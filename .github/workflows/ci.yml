name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: src
      DATABASE_URL: postgresql://battlebot:change_me@127.0.0.1:55432/battlebot

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: battlebot
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: battlebot
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U battlebot -d battlebot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
