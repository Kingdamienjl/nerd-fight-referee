power_scale:
  tier:
    text: 'At least 8-B, possibly at best High 6-A * Name: John, Homelander * Origin:
      The Boys * Gender: Male * Age: 38-45 (s1-s5) * Classification: Supe *'
    source_ids:
    - character-stats-profiles-homelander
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: "He is able to damage and be damaged by people relative to him, meaning\
      \ his attack potency would scale to his durability. At least city block - multi\
      \ city block level Was able to tank a chemical plant explosion with no damage.\
      \ Is comparable to Soldier Boy who can tank his own explosions. Small town level\
      \ His power is compared to that of a neutron bomb by Stan Edgar when talking\
      \ about his bunkers safety. Considered the \u2018most powerful superhero\u2019\
      \ which would put him above the power Nubia generated when creating her storm.\
      \ Possibly small city - mountain level Madelyne Stillwell stated that no weapon\
      \ on Earth can harm him, and Eric Kripke states that he doesn\u2019t have many\
      \ physical weaknesses. Butcher states that the weapon that \u2018killed\u2019\
      \ Soldier Boy must have been as strong as an h bomb, based on his limited knowledge\
      \ of him being \u2018nearly\u2019 as strong as Homelander. MM compares Soldier\
      \ boy to the likes of an h bomb. Soldier Boy claims that a cage containing enriched\
      \ uranium was used to test if supes could survive an atomic bomb, which implies\
      \ that the blast wasn\u2019t the concern but the radiation poisoning. Atomic\
      \ bombs (like the ivy king which was tested in 1952, which fits the time frame\
      \ in which Soldier Boy was tested) can reach up to 500 kilotons of tnt. Hydrogen\
      \ bombs (like the tsar bomba) can reach up to 50 megatons (higher considering\
      \ the tsar bomba\u2019s 100 megaton prototype). Higher with lasers (was able\
      \ to knock out temp v Butcher who is comparable to him). Claims he could wipe\
      \ New York off of the map \u2018for fun\u2019 (calculation), and is stated to\
      \ be able to level a city in minutes. Possibly at best small country - multi-continental\
      \ level Homelander states he would \u2018destroy everything and everyone\u2019\
      \ if Maeve released the flight 37 footage. In season 5\u2019s promotional poster,\
      \ Homelander is shown admiring the destruction he has caused. Eric Kirpke has\
      \ stated Homelander could \u2018destroy the world\u2019 via an apocalyptic event\
      \ (surface wiping). Considered the \u2018most powerful superhero\u2019 which\
      \ should put him above the power generated in Black Hole\u2019s \u2018quantum\
      \ singularity\u2019. *"
    source_ids:
    - character-stats-profiles-homelander
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: "At least hypersonic+ - sub-relativistic travel speed Out-sped Butcher\u2019\
      s C4 vest. Stated he could go to space, went to space in a deleted scene, seen\
      \ in space in a promotional poster for season 5, Hughie stated that he could\
      \ fly to space to escape the virus, travelling to space would be this fast.\
      \ Is likely faster than Ryan who can travel from Russia to New York instantly.\
      \ SOL attack speed His lasers were stated by a vfx artist (who worked on the\
      \ show) to be actual lasers. Lasers are light meaning they would be light speed.\
      \ Sub-relativistic - relativistic reaction/combat speeds He is able to react\
      \ to and tag people relative to him. Soldier Boy is able to block Butchers lasers\
      \ (this calculation labels Homelanders lasers as sub-relativistic, so the value\
      \ would be much higher if the accurate light speed value were used). Soldier\
      \ boy is able to block Annie\u2019s blasts, which are light. He is able to dodge\
      \ Ryan\u2019s lasers. Higher when in flight (was able to blitz Soldier Boy when\
      \ flying). Possibility at best MFTL travel speed Should be somewhat comparable\
      \ to A-train (however he was injured and likely exhausted), who could statue\
      \ lasers after receiving a new heart and could statue light when amped. *"
    source_ids:
    - character-stats-profiles-homelander
    confidence: 0.8
    notes: auto_repair source extraction
