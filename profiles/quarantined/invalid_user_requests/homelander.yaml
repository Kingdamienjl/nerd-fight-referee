  intelligence:
    text: Above Average (Is a manipulator and skilled actor; after he botched the
      rescue mission of Flight 37, which led to the Crash of Transoceanic Flight 37,
      Homelander managed to manipulate the situation to make the public support superheroes
      in the national defense. Planned on secretly giving vials of Compound V to terrorists
      so that the military would be forced to accept supes into the forces. Figured
      out that Stillwell and Vogelbaum were lying by noticing minute details between
      both of their stories. Correctly assessed that Stan Edgar was involved with
      the murders during the Congress hearing. Outsmarted Stan Edgar by turning Victoria
