power_scale:
  tier:
    text: '{{8-B}}, possibly {{8-A}} physically. {{Varies}}, up to far higher with
      radiation blasts Name: Soldier Boy, Ben, "A Living, Breathing American Hero",
      The Most Idiotic of them All, America''s Son. Origin: The Boys (TV Series) Gender:
      Male Age: Early to Mid 20s physically, 105 years old chronologically (Was born
      in 1919 and hasn''t aged at all since WWII) Classification: Supe, Superhero,
      Soldier for the U.S. Army, Leader of Payback (both formerly)'
    source_ids:
    - vsbattles-soldier-boy
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: City Block level20.56 Tons of Tnt, possibly Multi-City Block level+ physically800
      Tons of TNT (Was the strongest man alive. Is nearlyThe Boys; Season 3; Episode
      6; "Herogasm" as strongThe Boys; Season 3; Episode 1; "Payback" as Homelander,
      the latter even doubting that he could handle him. Fought against Homelander
      on equal grounds before getting overpowered. Bruised Homelander, whereas a chemical
      plant explosion dealt no damage to him. Fought against and eventually overpowered
      a Temp- V Butcher. Even after Maeve punched Homelander, the latter still considers
      Soldier Boy as a "bigger fish"). Varies (Soldier Boy's blasts vary depending
      on his charging time as well as on his physical state. Even after just waking
      up and with a few seconds charge, he could blast Kimiko through a wall. A similar
      charge but in a better physical state could vaporize people and destroy most
      of a buildingThe Boys; Season 3; Episode 5; "The Last Time to Look on This World
      of Lies"), up to far higher with radiation blasts (His final explosion was implied
      to be able to kill everyone at the Vought Tower, which would have included Homelander,
      a Temp-V empowered Butcher and Queen Maeve, however given that said explosion
      failed to kill the latter after she jumped in to save everyone, it's possible
      Soldier Boy decided to lower the potency of the blast at the last moment)
    source_ids:
    - vsbattles-soldier-boy
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Hypersonic+ combat and reaction speedScales to Mach 18.2 (Can keep up with
      Homelander's physical attacks. Casually restrained Kimiko with one hand when
      she tried to sneak on him before she could react)
    source_ids:
    - vsbattles-soldier-boy
    confidence: 0.8
    notes: auto_repair source extraction
  durability:
    text: City Block level, possibly Multi-City Block level+ (Endured brutal hits
      from Homelander and a Temp-V empowered Butcher. Withstood a blast of light from
      a supercharged Starlight without much damage. Can withstand his own radioactive
      explosions. Maeve believed that if there was a weapon capable of killing Soldier
      Boy, it would also be effective to kill Homelander, implying the former to be
      nearly as durable as the latter), higher with his shield (Withstood a prolonged
      ray from Butcher's heat vision without major damage, though eventually enough
      heat weakened its structure)
    source_ids:
    - vsbattles-soldier-boy
    confidence: 0.8
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range physically, Several Meters with throwing knives, Tens
      of Meters with radiation blasts and his pistol
    source_ids:
    - vsbattles-soldier-boy
    confidence: 0.8
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Easily defeated several soldiers during an attack in Nicaragua
      without breaking a sweat,The Boys; Season 3; Episode 3; "Barbary Coast" and
      then he still didn't show any signs of exhaustion after fighting his team up
      until Mindstorm used his powers on him and they proceeded to knock him out with
      Novichok. Outlasted a Temp-V empowered Butcher in a fight and quickly recovered
      from a fully charged blast from Starlight, to then, through sheer force of will,
      overcame the effects of the Novichok nerve agent and attempt to detonate a blast
      to destroy the Vought Tower)
    source_ids:
    - vsbattles-soldier-boy
    confidence: 0.8
    notes: auto_repair source extraction
  intelligence:
    text: Above Average (Has performed several black ops for Vought and the U.S government
      between the 60s and 70s. Is a highly skilled combatant, on par with the likes
      of Butcher. Methodically avoided Mindstorm's powers, easily seeing through his
      attempt at tricking them, and got information out of him before killing him)
    source_ids:
    - vsbattles-soldier-boy
    confidence: 0.8
    notes: auto_repair source extraction
