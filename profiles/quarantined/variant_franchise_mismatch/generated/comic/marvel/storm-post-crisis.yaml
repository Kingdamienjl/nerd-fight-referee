power_scale:
  tier:
    text: '{{9-B}} physically. At to least {{Low 6-B}}, likely far higher via environmental
      destruction. Up to {{3-C}} with lightning bolts. {{Varies}}, up to at least
      {{High 6-A}} when accessing ambient energy. Up to {{1-A}} at her peak and accessing
      her godhead. Name: Ororo Munroe, Storm, Hadari Yao Origin: Marvel Comics Gender:
      Female Age: Unknown. Likely in her mid-thirties. Classification: Omega level
      mutant, queen and goddess of Wakanda, member of the Quiet Council of Krakoa,
      member of the Great Ring, regent of Arakko, X-Men leader and member, Morlock
      queen.'
    source_ids:
    - vsbattles-ororo-munroe
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: 'Wall level+ physically (Spars equally with GambitX-Treme X-Men Vol 1 35
      and defeated Cyclops while powerlessUncanny X-Men Vol 1 201). At least Small
      Country level, likely far higher via environmental destruction (Under Rachel''s
      control, created a primal planetary hyper-storm like the one that shaped the
      planet. Later dispersed the storm after merging consciousnesses and wills with
      Rachel.Uncanny X-Men #459 While grieving Wolverine, she stated that she could
      set the atmosphere on fire. According to Thor, Storm summoned "a tempest fierce
      enough to scour the surface of the world down to its bedrock"). Up to Galaxy
      level with lightning bolts (Can harm StardustFantastic Four Vol 1 546). Varies,
      up to at least Multi-Continent level when accessing ambient energies and forces
      (Storm''s ability to manipulate the weather extends to the ambient energies
      and forces relative to her location, the effects of her powers depend on what
      she has access to. Using power from the galactic core, which was composed of
      millions of suns, Storm was stated to shine with the brightness of a star).
      Up to Outerverse level at her peak and accessing her godhead (Storm overpowered
      The Adversary and was stated to be a bigger god than him. Storm fought a group
      of entities including the Adversary, Bete Noir, the First Fallen, the Goblin
      Force, and the Elder God Annihilation, repelling them all. By working with Magneto
      in a circuit they managed to temporarily destroy the Shadow King, whose realm
      naturally exists on the level of the astral planeAstonishing X-Men #1. While
      in Overspace, Storm harmed eight Dominions at once with her powers, Dominions''
      power and nature make them capable of threatening the Beyonders. Storm created
      a storm around Yggdrasil that threatened to spread to the other realms on its
      branchesMarvel''s Voices Infinity Comic #92Marvel''s Voices Infinity Comic #93).
      Can negate durability in several ways.'
    source_ids:
    - vsbattles-ororo-munroe
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: 'HypersonicMach 8.23 combat and reaction speed (Scaling from Cyclops, Wolverine,
      and Black Panther. Famously defeated Cyclops for leadership of the X-Men without
      her powers. Casually reacts to an attack from a bloodlusted Cyclops. Storm has
      also reacted to lightning bolts, Cyclops'' optic beams, and military missiles.
      Reacted to Thor throwing Mjolnir.Contest of Champions #3 Dodged a hammer throw
      from Ragnarok.Black Panther 2005 #25 Reacted to Quicksilver before he could
      reach her. Her ability to perceive energy and manipulate neural impulses allows
      her to increase her reaction speed), likely up to Infinite when accessing her
      godhead (As she is a bigger god than The Adversary, she should have speed comparable
      to him when accessing her godhead). Up to FTL flight speed (Flies at jet speeds.Uncanny
      X-Men #386 Casually broke the sound barrierX-Men Vol 4 #26. Can quickly fly
      from Earth to Sentinel City, which is near the sun)'
    source_ids:
    - vsbattles-ororo-munroe
    confidence: 0.8
    notes: auto_repair source extraction
