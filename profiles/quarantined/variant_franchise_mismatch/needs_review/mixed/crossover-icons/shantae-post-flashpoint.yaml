    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Small Building level (She can trade blows with enemies that can harm her
      as well as enemies that can take hits from the Bomb Gauntlet, although she is
      weaker. She is able to cut down a tree in a single slash, which would yield
      this much energy), higher with Bombs and the Bomb Gauntlet (Bombs are able to
      destroy things she could not normally, and with the Bomb Gauntlet, she can attack
      with the strength of these bombs), far higher with The Sword of Faramore/Smart
      Chainsword (She was able to one-shot the final and most powerful enemy, Daimur
      and is twice as strong as her previous sword)
    source_ids:
    - mediawiki-shantae-post-flashpoint
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Superhuman travel speed (She was able to move faster than lava from a volcano,
      which can reach up to 30 mph), higher with Speedy Shoes (Speedy Shoes increase
      her movements speed marginally) with Subsonic reactions and combat speed (She
      is able to react to Fleetus, who moves in blurs, and is able to move her hands
      quickly enough to look like they are in multiple places at once)
    source_ids:
    - mediawiki-shantae-post-flashpoint
    confidence: 0.6
    notes: auto_repair source extraction
