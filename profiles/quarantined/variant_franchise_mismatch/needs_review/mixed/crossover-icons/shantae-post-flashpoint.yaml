  tier:
    text: '{{9-A}}, higher with Bombs and Bomb Gauntlet, far higher with The Sword
      of Faramore/Smart Chainsword Name: Arzette Rahklin Origin: Arzette: The Jewel
      of Faramore Gender: Female Age: At least 21 (She is old enough to drink alcohol
      and rule as queen) Classification: Human, Princess of Faramore (Formerly), Queen
      of Faramore (Briefly, before establishing a democracy)'
    source_ids:
