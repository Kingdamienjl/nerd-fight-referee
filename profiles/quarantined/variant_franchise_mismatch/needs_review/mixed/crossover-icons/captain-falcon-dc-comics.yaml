    - field: standard_equipment
      value: 'Captain America''s shield, Captain America suit, handcuffs, communicator/hacking
        unit, flashlight, oxygen mask, Redwing (a vampire bird armed with sonic cannon),
        cybernetic implant *Falcon''s Wings: The Falcon''s original jet-powered glider
        wings allowed him to fly at speeds up to 250 mph. Black Panther supplied Falcon
        with a new costume and wings. An emitter array on Falcon''s back creates holographic
        "hard light" wings with a maximum wingspan of up to 50 feet (15 m). Controlled
        by a cybernetic link, the wings can be instantly reconfigured into "dozens
        of different cruise configurations." A "magnetic drive," in turn, provides
        the thrust needed to get Falcon airborne. The emitter also possesses GPS Jamming
        Devices that prevent satellite tracking, while the hard-light wings interfere
        with infra-red tracking. A Vibranium microweave was added to the costume itself,
        making Falcon resistant to small arms fire. The entire system is controlled
        mentally through cybernetic circuitry in the Falcon''s mask. The costume has
        in the past featured a hidden "talon," a cybernetically controlled grappling
        line built into the gauntlets of his costume which he uses to entangle opponents,
        hook objects, or for swinging and climbing when his wings are detached. The
        costume''s visors come equipped with various capabilities, including infrared
        lenses, giving him the ability to see objects by their infrared signature
        at night, magnification capabilities, and remote imaging sensors that allow
        a full 360 degree of vision when activated. The cowl also has a wideband receiver
        and transmitter with an unspecified range. The suit was originally built by
        Wakandan scientists, with costume modifications by Desmond Burrell. The wings
        have been modified by Tony Stark, as Sam said after saving New York from Zola''s
        bomb, making them in full-vibranium: they''ve been capable of absorbing the
        whole explosive power of the bomb, saving Falcon from certain death. *Cybernetic
        Implant: Sam has an implant in his brain that enhances his ability to see
        what birds see and transmit the visuals into a data storage facility that
        then converts the visuals into images and videos'
      source_id: mediawiki-captain-falcon-dc-comics
      provider_id: vsbattles
      authority: high
      confidence: 0.75
