      value: 'Above Average (Toru was a salaryman working in a store. Nacht is a powerful
        demiwyrm with various spells, weapons and items. Has shown to be effective
        in combat and while she comes off as carefree, she is always on guard and
        analytical. Has good combat experience and previously in Real Life Online
        trained with Tasty Pickle, who was the top-ranked magic-class player. Has
        been able to fight and defeat opponents with hundreds of years of experience)
        Standard Tactics: As a spellcaster she uses magic to create powerful attacks
        from range, even several kilometers, and has extremely high evasion, having
        no problem retreating if necessary. She doesn''t have a set spell, or an order
        of spells, she usually uses and so they appears to be random. However, if
        she is angered she will use Septima Terror to spam nearly a dozen spells all
        at once and shred her opponent to pieces. She can also use illusions, turn
        her opponent into dust and etc depending on how she feels. Her Primordial
        Darkness will automatically counter any incoming attack at close range depending
        on the attackers power, even cutting off their limbs instantly.'
