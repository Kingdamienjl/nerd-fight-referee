    - field: weaknesses
      value: "Unknown | None ==Notes/Explanations== {{Scroll box|content=*Although\
        \ the Source, the Presence, and the Overvoid have sometimes been depicted\
        \ as the Light of Creation, this does not reflect their full nature. Ram V's\
        \ The New Gods (2025) #1 frames the Source as the Light, emerging from a self-referential\
        \ void as the first knowable expression of existence, opposed to the Great\
        \ Darkness. The New Gods (2025) #12 clarifies that the Source in its purest\
        \ form is a pre-creational white emptiness beyond both the Light and the Great\
        \ Darkness. Grant Morrison confirmed on Reddit that equating the Overvoid\
        \ with the Light is a misunderstanding. Thus, the true form of the Source,\
        \ Presence, and Overvoid is the absolute God, the Light of Creation is their\
        \ actualized expression, and the Voice is the active medium through which\
        \ the Light manifests, bringing existence and life with the command \u201C\
        Let there be Light!\u201D Together, these distinctions clarify the unified\
        \ essence of the three entities, explaining the Tier 0 ranking related to\
        \ their God key on their respective profiles. * The canonicity of the \"Death\
        \ of the New Gods\" series is extremely uncertain, as it strongly contradictedFinal\
        \ Crisis: Secret Files February, 2009 by the more prominent \"Final Crisis\"\
        \ event, along with all other writer portrayals of the entity. As such, the\
        \ events of that series should not be used to alter this profile. *Before\
        \ making any changes to this page, please read and follow the Power-scaling\
        \ Rules for Marvel and DC Comics. *For information about the cosmological\
        \ scaling that informs the tiering, please refer to the DC Comics Cosmology\
        \ page.}} {{Scroll box|}} == Gallery == Source 1.jpg Source 2.jpg Source 3.jpg\
        \ Source 4.jpg Source 5.jpg The Source - Jack Kirby's Fourth World 013 002.webp\
