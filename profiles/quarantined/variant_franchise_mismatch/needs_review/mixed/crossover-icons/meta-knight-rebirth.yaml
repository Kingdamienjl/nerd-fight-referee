    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: "Superhuman. While manifesting as darkness before forming his body, he quickly\
      \ moved from a portal in Kirby's universe to the area of his battle in another\
      \ reality, a distance passing by a galaxy in between, and that darkness outpaced\
      \ the Star Allies Sparkler chasing it with a small head start. Void Termina\
      \ is composed of most Jamba Heart pieces, being the embodiment of their power,\
      \ his stamina may be on the same level. Fought 4v1 Kirby and three other Star\
      \ Allies for 4 rounds during most versions of his encounter, going for a 5th\
      \ round in Story Mode. Was going to \"travel the stars\", \"crushVoid Termina's\
