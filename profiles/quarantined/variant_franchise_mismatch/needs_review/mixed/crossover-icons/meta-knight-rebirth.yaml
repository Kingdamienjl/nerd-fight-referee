    text: Low Multiverse level (Took hits from the Star Allies Sparkler used by Kirby
      and three Star Allies in his Divine Demon and Angel Forms, and hits from Kirby
      and three Star Allies in his First Core and Final Core forms. In Story Mode,
      he was up for another around after that, getting slowly overpowered by the Star
      Allies' "Team Star Allies!" attack in a beam struggle, blasted by the attack,
      and facing a special attack where Kirby created projections of all of the Star
      Allies to launch at Void Termina, blowing him up only by the end of it), Regeneration
      makes him difficult to kill | Low Multiverse level (Another version of the character
      with more health), Regeneration makes him difficult to kill | Low Multiverse
      level (Yet another version of the character with more health), Regeneration
      makes him difficult to kill
    source_ids:
