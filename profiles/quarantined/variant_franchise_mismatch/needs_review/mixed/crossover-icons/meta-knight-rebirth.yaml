    - field: weaknesses
      value: "His Final Core form / soul takes small damage from the Star Allies'\
        \ Friend Hearts, which are derived from something with \"anti-Void power\"\
        . By nature, the soul of a Void resurrection is influenced by the one they\
        \ see first (Although Void Termina was filled with so much darkness and ill\
        \ intent that even seeing the good Kirby first, the heroes and Void Termina\
        \ still fought to the death). A simple-minded creature, doesn't seem able\
        \ to talk. Note: See here explanations for common misconceptions about the\
        \ character. ==Notable Attacks/Techniques== |-|Divine Demon Form (\u9B54\u795E\
        \u5F62\u614B)= Void Termina P1.png|Void Termina in Story Mode and The Ultimate\
        \ Choice; Infernal Crisis difficulty Void Termina's Devil form, The Ultimate\
        \ Choice; Soul Melter difficulty version \xB7 Kirby Star Allies.png|Void Termina\
        \ in The Ultimate Choice; Soul Melter difficulty Void Termina, True Destroyer\
        \ of Worlds' Devil form, The Ultimate Choice; Soul Melter EX difficulty version\
        \ \xB7 Kirby Star Allies.png|Void Termina, True Destroyer of Worlds in The\
        \ Ultimate Choice; Soul Melter difficulty EX Void Termina's first form. There\
        \ are 3 different versions of the character, varying their attacks slightly.\
        \ Kirby Star Allies - VT, The True Destroyer of Worlds waves.gif|Destructive\
        \ Step Attack (True Destroyer of Worlds) *\"Destructive Beating Punch\" (\u7834\
        \u6BB4\u62F3\u300C\u661F\u306E\u30AB\u30FC\u30D3\u30A3 \u30B9\u30BF\u30FC\u30A2\
        \u30E9\u30A4\u30BA \u304B\u3093\u307A\u304D\u30B5\u30DD\u30FC\u30C8\u30AC\u30A4\
        \u30C9\u300D(\"Kirby of the Stars Star Allies Perfect Support Guide\") page\
        \ 346): Punches the ground to attack, making three shockwaves that chase a\
        \ target. In Soul Melter and Soul Melter EX, there are five shockwaves instead.\
        \ In Soul Melter EX only, the cooldown between punches is drastically shortened.\
        \ *\"Destructive Step Attack\" (\u7834\u8E0F\u8972): Jumps, upon landing it\
        \ creates a circular shockwave that expands from where he is. He can do this\
        \ many times in a row. The number of shockwaves depends on the difficulty:\
        \ **Story Mode and Infernal Crisis: 1 shockwave per stomp. **Soul Melter and\
        \ Soul Melter EX: 3 shockwaves per stomp. **Occasionally, Void Termina may\
        \ do a third stomp depending on the difficulty and amount of health depleted.\
        \ In Soul Melter EX only, the third stomp will have alternating shockwaves\
        \ in both the air and on the ground. The cooldown between stomps is also drastically\
        \ shortened. *\"Destructive Dual Slash\" (\u7834\u53CC\u65AC): Reshapes his\
        \ hands to form two giant swords from Master Crown-like grips/hilts (No relationship).\
        \ He then gives the swords one of three elemental powers; see the following\
        \ technique. Then, Void Termina may perform a horizontal slash, a vertical\
        \ slash, or a cross slash that creates an giant X-shaped energy wave flying\
        \ outward. More often than not, he will do a combination of the three in the\
        \ order listed. **In Soul Melter EX only, the cooldown between slashes is\
        \ drastically shortened, and he does double the slashes instead (i.e. two\
        \ horizontal and vertical slash combos, and then two X-shaped energy waves).\
        \ *\"Mer\u0101ga of Solitude, Blizzard of Solitude, Barikka of Solitude\"\
        \ (\u5B64\u72EC\u306E\u30E1\u30E9\u30FC\u30AC\u3001\u5B64\u72EC\u306E\u30D6\
        \u30EA\u30B6\u3001\u5B64\u72EC\u306E\u30D0\u30EA\u30C3\u30AB): It's stated\
        \ that \"since he resembles someone who has entered his body, he also controls\
        \ the attributes of the Three Mage-Sisters]\": The Mage-Sisters are masters\
        \ of each of those elements, had their energies sacrificed to Void to help\
        \ him revive, and are trapped inside his body, meaning that Void Termina gained\
        \ those attributes from them. When the Mage-Sisters get tossed out of his\
        \ body when First Core form is defeated, Void Termina doesn't use these moves\
        \ anymore, but he still uses those elements in other attacks. Curiously, the\
        \ last 2 versions of Void Termina shown never displayed the Mage-Sisters inside\
        \ their bodies in the first place (Perhaps they were assimilated and dissolved\
        \ into nothing, like how the Jamba Heart pieces are not part of his body).\
        \ The shockwaves used with these elements have the following attributes: **\"\
        Mer\u0101ga of Solitude\": Creates a wave of fire that rushes forward. Can\
        \ be negated by the Star Allies' Blizzard, Bluster, or Splash bullets. Being\
        \ able to produce fire damage to the Star Allies, Void Termina's Fire Manipulation\
        \ likely scales to being able to turn off absolute zero cold, a nonsensical\
        \ action that would ignore durability in regular targets. **\"Blizzard of\
        \ Solitude\": Creates a wave of ice spikes that spread outward from the original\
        \ impact point. Can be negated by the Star Allies' Sizzle bullets. Being able\
        \ to produce freezing damage to the Star Allies, Void Termina's Ice Manipulation\
        \ likely scales to absolute zero cold, temperatures that failed to damage\
        \ Kirby, King Dedede, Meta Knight, and Bandana Waddle Dee before. **\"Barikka\
        \ of Solitude\": Creates a line of sparking electricity that rushes forward.\
        \ Can be negated by the Star Allies' Splash bullets. Once defeated, Void Termina\
        \ will fall knocked out into the ground. His face mask will come off, creating\
        \ a vortex that will suck anyone near it inside Void Termina's body. Touching\
        \ any part of Void Termina's body will suck them in. If an enemy doesn't choose\
        \ to play along this scenario, it's unclear what would happen; V"
