      \ the stars\"Void Termina's phase 3 Jpn. pause description during Story Mode,\
      \ and The Ultimate Choice; Soul Melter, and Soul Melter EX difficulties \xB7\
      \ Kirby Star Allies and destroyHyness's phase 2, Story Mode Jpn. pause description\
