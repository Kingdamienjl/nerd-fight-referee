  durability:
    text: At least Wall level (Survived being hit by energy that could pulverize a
      human body, Survived falling from a spaceship, breaking through the glass ceiling
      and hitting the ground at high speeds, Fell from her TARDIS, which was above
      the clouds and was unharmed), Possibly Building level (Survived being struck
      by lightning, although it did knock him out), Solar System level with TARDIS
      (Can orbit around supernovas), High Complex Multiverse level with full defenses
      (The Black Guardian could not forcefully enter the TARDIS while all of the defenses
      were activated; The Black Guardian is one of The Guardians of Time; The Guardians
      of Time rule over the Six-Fold-Realm, which contains six dimensions that existed
      outside of the standard five where most corporeal beings dwelled and is inhabited
      primarily by transcendental beings) | High Complex Multiverse level (The Skasis
      Paradigm could give The Doctor enough power to stop the Time War, The TARDIS'
      11-Dimensional matrix can be absorbed) | High Complex Multiverse level (Absorbed
      the Lux Aeterna, a lattice of point singularities at the points where the dimensions
      of the Higher Place and the Six-Fold-Realm crossed, Fought the Quantum Archangel)
      | High Hyperverse level, possibly High Outerverse level with the glory (Took
      hits from The Master who is comparable to him).
    source_ids:
