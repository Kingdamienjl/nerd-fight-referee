    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Wall level+ (Punched down a metal door, which requires this much energy),
      Solar System level while Regenerating (Heavily damaged the TARDIS, which can
      stay intact while orbiting around a supernova, Destroyed a Dalek ship), Wall
      level to Building level with Sonic Screwdriver (Three Sonic Screwdrivers could
      overpower a Dalek), Solar System level with the TARDIS (Can tow a Neutron Star,
      burn stars and create supernovas), High Complex Multiverse level with Space-Time
      Manipulation (By working together, The Doctor and The Master were able to use
      their TARDISes to weaponize space and time to defeat theQuantum Archangel, a
      being who is comparable in power to the Lux Aeterna, a lattice of point singularities
      at the points where the dimensions of the Higher Place and the Six-Fold-Realm
      crossed.), Multiverse level+ via Self-Destruction (The self-destruction of the
      TARDIS would cause a Total Event Collapse, deleting every universe from history,
      making so they never existed in the first place) | High Complex Multiverse level
      (The Skasis Paradigm could give The Doctor enough power to stop the Time War,
      The TARDIS' 11-Dimensional matrix can be absorbed, The Moment could destroy
      both Time Lords and Daleks, and end the Time War in a single instant, The Key
      to Time is a powerful and legendary artifact which the Guardians of Time used
      to maintain the equilibrium of time itself, controlling omniversal order and
      chaos, Found a way to turn 11-Dimensional beings from the Six-Fold Realm into
      normal humans with no power, Armageddon Sapphire is capable of restarting a
      new universe as well as tearing reality apart causing damage to the Six-Fold
      realm) | High Complex Multiverse level(Absorbed the Lux Aeterna, a lattice of
      point singularities at the points where the dimensions of the Higher Place and
      the Six-Fold-Realm crossed, Fought the Quantum Archangel) | Hyperverse Level
      (comparable to the grace) | High Hyperverse level with the glory, which acts
      as a focal point for the whole omniverse and is infinite dimensional, possibly
      High Outerverse Level (Scott Gray confirmed that all of Doctor Who is canon,
      including the comics. The Glory is said to contain the whole "omniverse" which
      is generally assumed to be the whole cosmology of Doctor Who but it is also
      shown to contain a segment of Marvel on the left side. (this was published by
      Marvel themself. As a result, the Doctor has the power of the entire Marvel
      cosmology. This does not contradict Marvel's definition of "Omniverse"), possibly
      Far Higher (It can be argued that he also has the power over every verse Marvel
      has had a canonical crossover with due to them being added to the omniverse,
      however, until confirmation it is uncertain whether this is valid.)
    source_ids:
    - character-stats-profiles-shovel-knight-post-flashpoint-crossover-icons
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Peak Human with FTL+ reactions (Moved his arm in nanoseconds to dodge laser
      beams, Dodged attacks from Cybermen), Massively FTL+ with TARDIS (Stated to
      be able to outrun the Big Bang) | Immeasurable (The Skasis Paradigm could give
      The Doctor enough power to stop the Time War, The TARDIS' 11-Dimensional matrix
      can be absorbed, The Moment could destroy both Time Lords and Daleks, and end
      the Time War in a single instant) | Immeasurable (Absorbed the Lux Aeterna,
      a lattice of point singularities at the points where the dimensions of the Higher
