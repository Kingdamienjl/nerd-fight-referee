    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman. Fought an entire army of Feitheran assailants in an hours-long
      airborne battle. After being badly hurt and defeated, he flew for four whole
      days before collapsingHawkman Vol 5 15. Could stand up and fight even after
      being stabbed by a dagger that could suck his soul.
    source_ids:
