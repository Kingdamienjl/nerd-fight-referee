    notes: auto_repair source extraction
  intelligence:
    text: At least Genius. Carter Hall has access to the knowledge of many of his
      previous lives, having experience in many kinds of combat and leadership. Although
      these memories had somewhat faded with time, Hawkman now remembers all of his
      previous lives clearly. Was described by Batman as the greatest detective ever,
      complementing his skills as an archaeologist who studied the Eight, Ninth and
      Tenth Metals, mystical elements with magic abilities and discovering much about
      Barbatos and the Dark Multiverse by himself. He has been able to find many more
      hidden and forgotten artifacts, often braving through temples filled with traps
      laid by ancient but advanced civilizations. Built a highly advanced Soarship
      in a previous lifeHawkman Vol 5 6. | Average. Still capable of speech, but is
      subservient to Barbatos and seems to have lost most of his wit.
    source_ids:
    - mediawiki-shovel-knight-post-flashpoint
