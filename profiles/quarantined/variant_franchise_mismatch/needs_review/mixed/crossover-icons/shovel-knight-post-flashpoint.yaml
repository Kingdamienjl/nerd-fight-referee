  tier:
    text: "9-B, 4-B while Regenerating, 9-B to 8-C with Sonic Screwdriver, 4-B with\
      \ the TARDIS, High 1-C with Space-Time Manipulation, 2-A via Self-Destruction\
      \ | High 1-C | High 1-C, possibly 1-B | High 1-B, possibly High 1-A with the\
      \ glory, possibly Far Higher Name: Unknown real name, Most commonly known as\
      \ \u201CThe Doctor\u201D. Other frequent aliases include \"John Smith\", \"\
      Doctor Who\", \"Theta Sigma\" and \"Oncoming Storm\", He also possesses several\
      \ other less common aliases and nicknames Origin: Doctor Who Gender: Varies\
      \ depending on the Regeneration (First to Twelfth Doctors were Male, Thirteenth\
      \ Doctor is Female) Age: Unknown exact number, At least 1950 years old; At least\
      \ 4.5 billion years mentally (Has retained the memories of countless copies\
      \ of himself, which spent billions of years trapped in the confession dial)\
      \ Classification: Time Lord"
    source_ids:
