      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Standard human weaknesses Notable Attacks/Techniques: *Avian Telepathy:
        Sam was given the ability to telepathically link with birds endowed by the
        Red Skull using the Cosmic Cube. This link is strongest with his companion
        Redwing but he is also able to extend his empathic link to other birds making
        it possible for him to see through their eyes. He has also shown the ability
        to control birds. He is also a skilled handler and trainer of birds even without
        his mental powers. These abilities work on every bird including some extent
        of telepathic reading of Inhuman Bird People. Nick Fury''s intel classified
