        ====Eidolons==== {{main|Eidolon (Final Fantasy IX)#Eiko''s summons|t1=Eiko''s
        eidolons}}thumb|Eiko bestows the party with [[Shell (Final Fantasy IX status)|Shell
        with Carbuncle''s "Pearl Light", achieved by summoning Carbuncle with Moonstone
        as Eiko''s add-on.]] Eiko can summon four eidolons: Fenrir, Phoenix, Carbuncle,
        and Madeen. Equipping various add-ons allows her to change the eidolons''
        summon abilities. Fenrir has two attacks, and can be either earth- or wind-elemental,
        and Carbuncle has various different buffs it can bestow the party with, depending
        on the jewel Eiko equips (Reflect is default with Ruby Light). With Phoenix,
        Eiko has a chance of saving the party from annihilation with an auto-summon
        when the party is defeated, making her a good candidate to take along to face
        the toughest challenges in the game, such as Yan, Ozma, and the final boss.
        If Zidane and Dagger are alive when Eiko summons an eidolon for the first
        time before they reach Madain Sari, they will exchange a dialogue mid-battle.
        Zidane will say "Dagger, was that an eidolon?", and Dagger will reply "I think
        so. Eiko can use magic too?" This resets everyone''s turn regardless whether
        an action has been chosen. {{clear}} ====Trance==== right|100px|Eiko in Trance.
        Eiko''s Trance ability is Dbl Wht, allowing her to cast two consecutive White
        Magic spells in one turn, providing she has MP for both. The spells count
        as separate actions and will deplete the Trance gauge individually. ===Stats===
