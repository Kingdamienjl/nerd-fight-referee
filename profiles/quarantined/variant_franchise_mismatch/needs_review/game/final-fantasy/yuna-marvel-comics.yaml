    - field: intelligence
      value: Asuna is a brilliant tactician as she was the Vice Commander of the strongest
        guild in Aincrad, the Knights of Blood Oath; leading the way against field
        bosses and raid bosses alike in the front lines. She is a masterful rapier
        user, to the point that she became known as "The Flash" for her speedy and
        dexterous strikes that even Kirito noted that he cannot follow. In addition,
        she always had the highest grades in school for most of her life, making her
        amazing academically, and she is quick to grasp concepts new to her, becoming
        adept at them within seconds. During her Star Queen years, she, alongside
        Kirito, has gained immense experience and knowledge in general as a ruler,
        politician, and swordswoman, and ruled an interstellar empire.
      source_id: mediawiki-yuna-marvel-comics
