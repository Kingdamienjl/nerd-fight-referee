    - field: weaknesses
      value: 'Sword Skills have a slight post-motion stun at the end of them in exchange
        for increased power. Cannot fly in areas void of sunlight or moonlight (ALfheim
        Online Key Only). Extensive use of Geographical Manipulation will strain Asuna
        so much to the point where it will damage her soul (Alicization Keys Only).
        Because of Incarnation''s passive nature based on the imagination and willpower
        of the individual, at worst, if the user thinks a situation is hopeless or
        impossible to succeed, Incarnation will instead have a negative effect and
        make that situation true. Notable Attacks/Techniques: ===All VR Avatars===
        Incarnation: A secret skill passed down by Integrity Knights since ancient
        times, and one of the most important concepts in the Sword Art Online franchise.
        Incarnation refers to the ability to change the state of the world through
        pure willpower and imagination. For any other virtual reality world, it is
        a system glitch, usually activated in times of extreme emotion or during extreme
        brain activity, allowing closer access to one''s Fluctlight, or soul, to temporarily
        change the world around them. For residents of the Underworld, it is a constant
        passive that dictates whether they succeed or fail in anything. The more confident
        one is in their abilities and the more of a positive reputation they have,
        the more the world shall bend in their favor. It is the power which Sacred
        Arts derive from. Its effects are versatile, as the power has been used to
        wield invisible blades, create swords from the user''s blood, transmute objects,
        increase the chances of an event happening, and much more. However, the power
        of an Incarnation ability can be matched by another Incarnation ability, and
        the use of Incarnation is mentally exhausting, requiring a lot of concentration
        and energy to perform. If the user is in a state where their will is not strong
        enough, they become unable to use Incarnation. There are a limited amount
        of people who can use Incarnation to its full potential, and much practice
        and experience are needed to be able to use it. This ability is most prominent
        in the Underworld, as this ability is one of that world''s core mechanics.
        However this ability has also been shown multiple times throughout the series
        before the Alicization arc. ===Outside System Skil'
