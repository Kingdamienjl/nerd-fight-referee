        Notable Attacks/Techniques: ====Commando==== *Ultima Arrow: Serah''s signature
        attack, she charges a powerful arrow that flies into the sky before coming
        down as a veritable rain shower of projectiles, staggering the opponent and
        dealing heavy damage. *Blindside: If Serah strike the enemy with single target
        physical attacks on their sides or back, the damage they receive is doubled.
        *Blitz: A ranged physical attack Serah uses to attack multiple enemies. Can
        also be performed while in mid-air. *Launch: Serah tosses a staggered foe
        into the air with a powerful thrust, allowing her to continue the assault.
        While the opponent is in mid-air, he cannot use any skills. *Ruin/Ruina/Ruinga:
        Serah unleashes powerful bursts of null energy to deal damage to nearby enemies.
        *Scourge/Smite: Serah''s damage is quintupled while attacking foes who are
        on the verge of recovering from her initial attacks. ====Ravager==== *Aero:
        Serah engulfs the target in wind to damage and stun them. *Blizzaga: Serah
        attacks her opponent with a huge chunk of ice, dealing heavy ice-elemental
        damage. *Elemental Strikes: Serah imbues her weapon with fire, ice, lightning,
        or wind, allowing him to exploit his foes'' elemental weaknesses while remaining
        on the physical offensive. *Fearsiphon: Serah is able to regain her stamina
        by draining the enemy''s mounting feelings of fear as she attacks them, allowing
        her to unleash even more attacks on her foes when she has the advantage. *Firaga:
        Serah attacks her opponent with a huge fireball, dealing heavy fire-elemental
        damage. *Thundaga: Serah attacks her opponent with a barrage of thunderbolts,
        dealing heavy lightning-elemental damage. *Vigor: Serah''s blows stagger the
        target even more than usual for as long as she remains in peak form, but loses
        this vigor should she start taking significant injuries. ====Sentinel====
        *Deathward: When critically injured, Serah''s defense and attack power increase
        by 25%. *Element Guard: Reduces incoming damage by 20% and eliminates 33%
        of incoming elemental damage. *Reprieve: As long as she is not on her last
        legs, Serah can survive virtually any attack short of an instant-kill move
        with just enough energy left to fight. *Steelguard: Serah reduces the damage
        taken from enemy attacks and her guard becomes more effective with each bit
        of damage taken. *Vendetta: After taking damage from the enemy, Serah counterattacks,
        dealing damage proportional to the amount of damage she took while defending.
        Each received attack increases the final damage by 10% to a max bonus of 300%.
        ====Saboteur==== *Deprotega: Reduces the defense of all targets by 30% and
