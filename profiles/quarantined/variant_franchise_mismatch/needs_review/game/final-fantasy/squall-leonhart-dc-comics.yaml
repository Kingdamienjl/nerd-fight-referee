        by 30% and deals magic damage. *Dispelga: Nullifies the enchantments, buffs,
        and barriers of all targets and deals magic damage. *Imperilga: Reduces the
        elemental resistances of all targets and deals magic damage. *Poisonga: Poisons
        all of Serah''s targets and deals damage. *Wound: Deals a vicious blow that
        prevents the target from regenerating. ====Synergist==== *Protect: Raises
        the target''s physical resistance by 25%. *Shell: Raises the target''s magical
        resistance by 25%. *Veil: Increases the target''s resistance to status effects
