    - field: intelligence
      value: Serah is known to be mature, wise, and thoughtful for her age, being
        a straight A student and is always looking out for the well-being of her sister
        Lightning. Despite not having much experience in combat, she quickly becomes
        an expert of the course of her adventures with Noel, being more than capable
        of keeping up with him and the likes of Caius Ballad, a warrior who has been
        fighting for over two thousand years. She is far more magically inclined than
        Noel, having a much high magic stat (reflecting her general intelligence)
        and learning a much greater variety of spells (i.e. Firaga, Thundaga, and
        Blizzaga). She is also accomplished in both melee and ranged combat with her
        bowsword, taking apart her foe's defenses as a Saboteur before laying down
        the hurt as a Commando or Ravager.
      source_id: mediawiki-squall-leonhart-dc-comics
