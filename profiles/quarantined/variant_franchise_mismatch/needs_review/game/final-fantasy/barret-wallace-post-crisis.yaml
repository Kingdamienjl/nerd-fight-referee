      value: "of the Materia stocked to it. This can change his role to allow him\
        \ to equip more Magic Materia while not sacrificing his physical damage. Additionally,\
        \ two of Barret's Limits, Angermax and Catastrophe (his ultimate Limit), are\
        \ notable for tremendous damage potential, which can be further amplified\
        \ with Missing Score if Barret's Materia is assigned correctly. Missing Score\
        \ also potentially allows Barret to abuse an overflow glitch if stocked with\
        \ mastered Knights of the Round Materia. Barret is a date option for Cloud\
        \ in the Gold Saucer. He begins with 0 hidden date points and has few dialogue\
        \ options to improve this value, making him the hardest character to date.\
        \ Dating Barret in the PlayStation 4 version earns the Best Bromance trophy.\
        \ Barret-ffvii-field.png|Field model. Barret-ffvii-backpack.png|Barret wearing\
        \ a parachute backpack. Barret-ffvii-young.png|A younger Barret. Barret-ffvii-sailor.png|Barret\
        \ in a sailor outfit. ===Final Fantasy VII Remake=== {{main|Barret Wallace\
        \ (VII Remake party member)}} thumb|right|Battle render. Barret normally wields\
        \ gun-arms that specialize in long-range attacks, reaching enemies that would\
        \ be difficult for melee characters and allowing him to deal single-target\
        \ damage at a distance; this allows him to consistently deal damage to enemies\
        \ at any range, making him exceptional at building ATB. He can also equip\
        \ melee weapons, which change his playstyle entirely, making him focused towards\
        \ dealing slow but hard-hitting melee attacks. His unique ability is Overcharge\
        \ with a ranged weapon, which deals considerable damage and fills his ATB\
        \ gauge quickly, or Overrun with a melee weapon, in which he charges forward\
        \ dealing damage in enemies along his path and then slams down with an attack\
        \ in a wide radius. Both of Barret's limit breaks deal ranged physical damage.\
        \ thumb|left|Barret using Maximum Fury. Barret has the highest durability\
        \ of any party member, boasting very high HP and defensive attributes, as\
        \ well as abilities that allow him to resist being knocked back. However,\
        \ most of his attributes are below average. Barret excels in a unique role\
        \ in which he can tank damage from the rest of the party and draw it towards\
        \ himself using his ability Lifesaver, as well as his ability Steelskin that\
        \ resists all damage he takes. With the right materia setup, he can serve\
        \ effectively in a supporting role where he protects the party and provides\
        \ supplementary damage. Depending on his materia and weapon setup, though,\
        \ he can instead be used more for damage-per-second. Barret is an option for\
        \ a resolution scene in the quest \"Resolve\" in Chapter 14, \"In Search of\
        \ Hope\", depending on the player's affection mechanics with Aerith or Tifa.\
        \ Barret only participates in the Odd Jobs that take place during \"In Search\
        \ of Hope\". ===Final Fantasy VII Rebirth=== {{main|Barret Wallace (VII Rebirth\
        \ party member)}} In Final Fantasy VII Rebirth, Barret has a modified moveset\
        \ and can only equip gun-arms, with all melee weapons removed and abilities\
        \ from them repurposed. This defines his role as a durable, ranged attacker\
        \ with strong supportive and defensive capabilities. He has many weapon upgrades\
        \ that improve the capabilities of his Overcharge, such as increasing its\
        \ damage, faster recharge, or even granting him {{Icon|FFVIIR2|status|protect}}\
        \ upon use. His offensive synergy skills do allow him to attack in closer\
        \ range and his defensive skill renders him immobile, but immune to damage.\
        \ Barret has new synergy abilities through which to combine attacks with the\
        \ various different combination of the game's new party members added since\
        \ Remake. Barret is also a date option for Cloud in the Gold Saucer on the\
        \ second occasion (based on the date from the original game), based on a mechanic\
        \ determined by completing sidequests with him, performing synergy moves with\
        \ him and choosing certain dialogue options. Barret has an alternate outfit\
        \ in the form of his sailor suit from the original game, which can be selected\
        \ at a changing booth. Barret Avalanche Cell Leader outfit from FFVII Rebirth\
        \ render.png|Avalanche Cell Leader. Barret Junon Naval Crew outfit from FFVII\
        \ Rebirth render.png|Junon Naval Crew. ===Final Fantasy VII Ever Crisis===\
        \ {{Main|Barret Wallace (Ever Crisis party member)}} Barret is one of the\
        \ initially playable characters. He is a tank character who specializes in\
        \ buffing allies' defense. His limit breaks are Grenade Bomb, Mindblow, and\
        \ Satellite Beam, and his ultimate weapons are Ultimate Gatling Gun and Missing\
        \ Score. ==Musical themes== {{audio|filename=FFVII - Barret's Theme.ogg|title=\"\
        Barret's Theme\" from Final Fantasy VII}} \"Barret's Theme\" {{J|\u30D0\u30EC\
        \u30C3\u30C8\u306E\u30C6\u30FC\u30DE|Baretto no T\u0113ma}} plays as the background\
        \ to the Seventh Heaven and Sector 7 slums after preparing to attack the Mako\
        \ Reactor 5. Additionally, \"Mining Town\" {{J|\u70AD\u5751\u306E\u8857|Tank\u014D\
        \ no Machi}}, which plays during Barret's flashbacks of Corel and in North\
        \ Corel, is a remix of \"Barret's Theme\". A blues arrangement of \"Barret's\
        \ Theme\" is a music disc in Rem"
