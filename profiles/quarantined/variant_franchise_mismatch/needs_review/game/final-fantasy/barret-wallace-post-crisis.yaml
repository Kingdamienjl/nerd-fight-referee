        \ }} {{Quote|A faction leader of the anti-Shinra militant group Avalanche.\
        \ Barret is filled with a burning hatred for Shinra, a company he claims is\
        \ destroying the planet. His right arm has been modified into a firearm, allowing\
        \ him to attack his enemies at long range.|Final Fantasy VII Remake loading\
        \ screen}} Barret Wallace is a major recurring character in the Final Fantasy\
        \ VII series. He is a playable character in Final Fantasy VII, Final Fantasy\
        \ VII Remake, Final Fantasy VII Rebirth, and Final Fantasy VII Revelation,\
        \ and has supporting roles in other titles. He is the leader of a cell of\
        \ the eco-terrorist group Avalanche, trying to prevent Shinra Electric Power\
        \ Company from using mako, the life source of the planet, as a form of energy.\
        \ Barret fights passionately for his cause to protect the planet. He cares\
        \ greatly for his allies, motivating them with powerful speeches, while also\
        \ himself fighting on the front lines of his cell's operations. His seemingly\
        \ benevolent cause of fighting for the planet is a cover for his personal\
        \ vendetta and anger, which he later must come to terms with. Despite his\
        \ brash and sometimes violent attitude, Barret has a good heart and is torn\
        \ between fighting and caring for his adopted daughter, Marlene. Barret wields\
        \ a gun-arm, a mechanical gun grafted in place of his right arm, allowing\
        \ him to fire from range. His Limit Break abilities largely consist of physical\
        \ attacks with these weapons. Barret has high HP, allowing him to fill the\
        \ role of taking damage from other party members. ==History== ===Before Final\
        \ Fantasy VII=== ====Early life==== Born on December 15, 1972{{cite|Final\
        \ Fantasy VII 10th Anniversary Ultimania Revised Edition|p=32|name=ff7 10th\
        \ anniversary ultimania timeline}} in the small, forested coal mining village\
        \ of Corel, Barret married a woman named Myrna who suffered from an unspecified\
        \ illness. Because of his wife's illness, Barret advocated for co-operation\
        \ with Shinra in building a mako reactor north of Corel when mako was discovered.\
        \ His childhood best friend, Dyne, opposed the arrangement, but Barret and\
        \ the others convinced him that it would help the town when Scarlet arrives\
        \ to oversee the deal.{{cite|FFVII|script=Barret's Past|name=Barret's Past}}\
        \ Avalanche occupied Corel on May 8, 0003, two years after the reactor's construction.\
        \ Barret helped the Turks sneak into the mako reactor to reclaim it (not knowing\
        \ Avalanche at the time and not knowing that he would join them later). Sometime\
        \ after, Barret and Dyne explore the Corel reactor after it exploded under\
        \ mysterious circumstances. On their way back to Corel, the town's mayor arrived\
        \ and told them that Corel was under attack before being gunned down by a\
        \ deployment of Shinra soldiers tasked with burning Corel to the ground to\
        \ cover up the reactor's failure as the attack of a local insurgent group.{{cite|VIIBC}}\
        \ In the chaos, Barret and Dyne were gunned down by Shinra troops while returning\
        \ to town, causing Dyne to fall off a cliff while Barret narrowly grabbed\
        \ his left hand with his right hand. However, Scarlet took one of the soldier's\
        \ guns and shot their hands, after which Dyne fell to his apparent doom, while\
        \ Barret barely escaped, despite his severe injuries.{{cite|FFVII|script=The\
        \ Desert Prison|name=The Desert Prison}} As revealed in Final Fantasy VII\
        \ Rebirth, Barret's wounds were treated by Doctor Sheiran. While searching\
        \ for survivors, Barret found Dyne's daugther, Marlene, and decided to raise\
        \ her, believing that Dyne died. The artisan Old Man Sakaki made a prosthetic\
        \ adapter for his arm that allowed Barret to attach weapons.{{cite|OtWtaS|\"\
        Episode: Barret\"|name=otwtas episode barret}} Barret learned of Avalanche,\
        \ becoming a leader within the organization, and went to Midgar to begin his\
        \ campaign against Shinra.{{cite|FFVII|script=In the Land of the Study of\
        \ Planet Life|name=In the Land of the Study of Planet Life}} {{Section}} ====Moving\
        \ to Midgar==== Barret and Marlene wandered from town to town before arriving\
        \ in Midgar,{{cite|VIIRToTP|p=169-170|name=totp 169}} where they initially\
        \ were homeless and slept on the street.{{cit"
