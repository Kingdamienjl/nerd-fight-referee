    - field: weaknesses
      value: "Barret must be pressed in a battle to use his Limit Breaks, so most\
        \ of the time, he can't use them right away or in succession. He is also brash\
        \ and easily provoked if the right buttons are pushed, such as his previous\
        \ crimes or his fallen AVALANCHE comrades. Notable Attacks/Techniques: |-|Limit\
        \ Breaks= Limit Breaks are powerful special moves Barret can perform in battle.\
        \ All living beings have a portion of the Spirit Energy that flows through\
        \ the Lifestream in themselves when this energy raises to its limit, it eventually\
        \ aligns and overflows, allowing to go beyond the user's standard capabilities\
        \ and reach a much greater power, just as their name indicate. Limit Breaks\
        \ are affected by emotions; intense ones such as rage can lead to attaining\
        \ the state to use these moves much faster than usual. A proof of their power\
        \ can be seen in Cloud's battle against Bahamut SIN: his regular attacks did\
        \ little more than annoy the Summoned Beast; however, his Braver Limit Break\
        \ could scar its face and knock it off the air, sending it plummeting to the\
        \ ground, while Climhazzard could destroy Bahamut with a single-use. Level\
        \ 1: *Big Shot: Barret charges his Spirit Energy into a large sphere that\
        \ takes an orange color before releasing it in a single shot. *Mind Blow:\
        \ Similar to Big Shot, however, the sphere takes a pale blue color, and instead\
        \ of dealing physical damage, the target's magic power and energy are completely\
        \ depleted. Level 2: *Grenade Bomb: Barret aims his gun and the trigger, instead\
        \ of shooting ammo, instantly creates an explosion at the enemy's location,\
        \ covering a big area. *Hammer Blow: Barret charges at the enemy and crushes\
        \ them with his left hand, leaving a trace of dark blue Spirit Energy, killing\
        \ them instantly. Level 3: *Satellite Beam: Barret points at enemies and crosshairs\
        \ lock on them before he makes some signals, and several beams of energy fall\
        \ from the sky, destroying the selected area. *Angermax: Barret shoots a massive\
        \ barrage of bullets at much higher speeds at all enemies. Level 4: *Catastrophe:\
        \ Barret gun apparently overheats as it fills with Spirit Energy before he\
        \ jumps high above and unleashes a large laser to continually strike all enemies.\
        \ |-|Magic= Accessed through the Green Materia, this allows the wielder to\
        \ access the wisdom of the Ancients, the Cetra, and the connection they shared\
        \ with the Planet to use its powers and manifest various incredible abilities.\
        \ These can range from offensive manipulation of the elements to support effects\
        \ and even powerful healing abilities. While each Magic Materia normally allows\
        \ the use of a specific set of spells (such as Lightning allowing to use Bolt,\
        \ Bolt2 or Bolt 3; or Mystify granting Berserk and Confu, both mind-affecting\
        \ spells), there exists the Master Magic Materia, which gives the user every\
        \ spell in existence except for the one of a kind Holy and Meteor. Notable\
        \ spells include: Offensive: *Fire3 (Firaga), Ice3 (Blizzaga), Bolt3 (Thundaga)\
        \ and Quake3 (Quaga): Very high-level elemental magic that conjures their\
        \ respective elements for a powerful attack to strike a single enemy or a\
        \ wide area. *Bio3 (Bioga): The user cast large bubbles of venomous liquids\
        \ that drown the enemy to inflict heavy damage and leave them poisoned. *Demi3\
        \ (Graviga): A powerful gravity well is created to drag and crush enemies\
        \ within it. This spell cannot be reflected. *Comet2 (Cometeor): Calls forth\
        \ several small meteors from outer space to strike the enemy four times. This\
        \ spell cannot be reflected. *Death:A spell that conjures a Grim Reaper to\
        \ instantly kill an opponent. This spell can affect robotic enemies and ghosts\
        \ unless they explicitly resist instant death. *Tornado: A spell that creates\
        \ a powerful twister on an opponent. May inflict confusion. *Freeze: A sudden\
        \ cold surrounds an enemy, and then they\u2019re instantly encased in ice,\
        \ freezing its surrounding area as well. May inflict Stop. *Break: Rock is\
        \ materialized around the opponent and proceeds to crush them, turning them\
        \ into stone as well. May inflict Petrification. *Flare: The user causes a\
        \ nuclear reaction by making the atoms of the target collide with each other,\
        \ resulting in a powerful explosion of extreme heat to completely incinerate\
        \ an opponent. *Ultima: The most powerful Black Magic Spell in the story after\
        \ Meteor itself. A massive energy wave that strikes a wide area for non-elemental\
        \ damage. The spell cannot be reflected. Healing: *Cure3 (Curaga):The user\
