      value: "\"Kick some Shinra ass and save the planet\" and \"Save the girl\u2014\
        while kicking more Shinra ass\u2014and get out\".{{cite|FFVIIR|script=A Broken\
        \ World}} While climbing, the group saw the ruins of Sector 7. Barret told\
        \ the grieving Tifa to never forget the view.{{cite|FFVIIR|script=The Path\
        \ to Greater Heights}} In \"The Belly of the Beast\", upon reaching the Shinra\
        \ Building, Barret, eager to attack, encouraged charging the headquarters\
        \ head-on, but was quickly shut down by Cloud.{{cite|FFVIIR|script=Infiltration}}\
        \ After fighting in the parking garage, they snuck into the tower, unknowingly\
        \ being aided by Mayor Domino.{{cite|FFVIIR|script=A Helping Hand|name=A Helping\
        \ Hand}} Barret declared the building a \"monument to corporate greed\" and\
        \ relished returning one day to burn it down.{{cite|FFVIIR|script=Shinra Building\
        \ Intel}} Depending on Cloud's choice, the group climbed the emergency stairwell\
        \ or used the elevator. The group encountered soldiers in the latter, but\
        \ also scared, normal employees. Tifa remarked how easy it was to forget that\
        \ ordinary people who are just trying to provide for themselves work for Shinra.\
        \ Barret responded that these people are not without sin and must accept their\
        \ complicity.{{cite|FFVIIR|script=Use the Elevator|name=Use the Elevator}}\
        \ During the tour of Shinra's history, Barret was disgusted both by the museum\
        \ of Shinra's accomplishments as well as the presentation in the Visual Entertainment\
        \ Hall, saying that it made him want to puke.{{cite|FFVIIR|script=Playing\
        \ the Tourist}} Upon meeting the mayor, Barret was surprised to learn that\
        \ Domino was an Avalanche collaborator, irritated that HQ had not informed\
        \ him, but promised to help get payback. When the group found Professor Hojo,\
        \ Barret held him at gunpoint to free Aerith. Hojo escaped by unleashing Specimen\
        \ H0512 and, after the battle, Barret freed Aerith and, inadvertently, Red\
        \ XIII, another research specimen who joined the group. {{multiple image |direction\
        \ = vertical |width = 180 |image1 = Sephiroth impales Barret from FFVII Remake.png\
        \ |alt1 = Sephiroth impales Barret on his Masamune. |image2 = Whispers heal\
        \ Barret from FFVII Remake.png |alt2 = Whispers heal Barret |footer = Sephiroth\
        \ stabs Barret through the abdomen, but the Whispers heal him. }} Cloud was\
        \ briefly possessed and fell unconscious. Aerith took him and the group to\
        \ her childhood home in Hojo's laboratory, commencing \"Deliverance from Chaos\"\
        . Barret bonded with her due to his knowledge of the Ancients and offered\
        \ to let the group escape while he went to further attack the building. Aerith\
        \ warned against this, trying to tell him more before the Whispers interrupted.{{cite|FFVIIR|script=A\
        \ Way Out|name=A Way Out}} The Shinra Building came under attack, with Wedge\
        \ and Mayor Domino securing their escape route through a helicopter escort.\
        \ The group were sidetracked as they fell through the Drum, Hojo's secret\
        \ research laboratory, with Hojo tracking them to gather data. Barret teamed\
        \ up with Cloud and separated from Tifa and Aerith until the group reunited\
        \ to find the body of Jenova removed from the lab and a trail leading up to\
        \ President Shinra's office. Upon finding the president dangling from the\
        \ roof, President Shinra offered Barret anything in desperation. Barret first\
        \ appeared ready to throw him off the roof, but Tifa and Aerith pleaded for\
        \ him to stop. Barret showed mercy, but demanded that the president reveal\
        \ that it was Shinra who destroyed Sector 7 and that Avalanche was not a pawn\
        \ of Wutai. The president grabbed a gun and mocked Barret for his principles.{{cite|FFVIIR|script=The\
        \ Ominous Trail|name=The Ominous Trail}} Sephiroth appeared and killed the\
        \ president, along with seemingly Barret, until the Whispers healed his wound.\
        \ Rufus Shinra shot down the Avalanche helicopter, forcing the group to leave\
        \ through the front entrance. Cloud urged Barret to take Aerith and the others\
        \ while he bought them time; Barret offered to stay and back him up, but Cloud\
        \ declined.{{cite|FFVIIR|script=The Showdown}} Barret left with Red XIII and\
        \ Aerith, while Tifa remained behind. The group tried to leave by elevator,\
        \ but were stopped by a machine known as the Arsenal. After defeating it,\
        \ they reached the lobby, where Heidegger confronted them. Barret stood defiant\
        \ before Heidegger until Cloud and Tifa rescued them with stolen Shinra vehicles\
        \ and they escaped on the Midgar Expressway, commencing \"Destiny's Crossroads\"\
        . At the end, when Sephiroth opened a portal to the singularity, Barret helped\
        \ fight off the large Whispers, ending their grip on fate and helped Cloud\
        \ in his duel against Sephiroth. Afterwards, Barret promised to help the group\
        \ fight Sephiroth, saying that an enemy of the planet was an enemy of his.{{cite|FFVIIR|script=The\
        \ Turning Point}} thumb|left|The party trudges toward Kalm. In \"Episode INTERmission\"\
        , Barret leads the party towards Kalm on foot until they rest before Tifa\
        \ and Aerith help the party hitch a ride on Choco Bill's pick-up. During \"\
        The Tragedy of Five Years A"
