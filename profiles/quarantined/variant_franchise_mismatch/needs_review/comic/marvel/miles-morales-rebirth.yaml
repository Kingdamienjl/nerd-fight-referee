    - field: striking_strength
      value: "Continuing his studies at Brooklyn Visions Academy, Miles also continued\
        \ his superhero career and stopped Tombstone from acquiring some mind-controlled\
        \ kids to use as henchmen.{{r|Miles Morales: Spider-Man Vol 1 3}} During one\
        \ of his outings, he met Starling, the granddaughter of Adrian Toomes, the\
        \ Vulture.{{r|Miles Morales: Spider-Man Vol 1 5|6}} After learning that his\
        \ parents are having a baby, Miles was captured by a teleporter, who took\
        \ him to a facility where he was tortured and experimented on by a being known\
        \ as the Assessor until he was rescued by his dad and uncle.{{r|Miles Morales:\
        \ Spider-Man Vol 1 7|9}} right|180px|thumb|Old and new enemies When Miles\
        \ turned seventeen, he encountered the Green Goblin from his native universe,\
        \ whose presence made him have flashes to his old life. Miles soon discovered\
        \ that the Goblin was working for a mysterious man known as Ultimatum, who\
        \ also attacked Miles before leaving.{{r|Miles Morales: Spider-Man Vol 1 10}}\
        \ After helping his Uncle Aaron, who returned to wear the mantle of the Prowler,\
        \ the two arrived at the hospital where his mom was giving birth to Miles'\
        \ new baby sister, Billie.{{r|Miles Morales: Spider-Man Vol 1 11|13}} ====Leaving\
        \ the Champions==== When the Champions begun fighting Zzzax, Ms. Marvel and\
        \ Viv Vision were killed in the process. Mephisto arrived and offered to rewind\
        \ back time in order for the remaining heroes to save their teammates. Miles\
        \ was filled with guilt and accepted Mephisto's offer, and the demon reversed\
        \ time resurrecting their dead teammates but unwittingly allowing a girl Miles\
        \ saved in the previous timeline die. After that, Miles told Kamala the truth\
        \ of what happened, leading to Miles quitting the Champions until he could\
        \ figure out what he really wanted to do and if he could handle the weight\
        \ of being Spider-Man.{{r|Champions Vol 3 2|4}} However, as Blackheart begun\
        \ corrupting members of the Champions, Miles was forced to help his friends.\
        \ He, along with Ms. Marvel, also revealed their identities to Nova in order\
        \ to free him from Blackheart's corruption. Then all the Champions began fighting\
        \ Blackheart, who had still a grudge against Miles,{{r|Spider-Man Vol 2 1}}\
        \ and tried to use the deal that Miles made with Mephisto, but the Champions\
        \ defeated Blackheart and the demon was taken down by his father since his\
        \ son ruined his plans and promised to the Champions that he'll be back.{{r|Champions\
        \ Vol 3 9|10}} ====Absolute Carnage==== While fighting the Scorpion a few\
        \ months later, Miles was beset by a horde of four-armed symbiote-monsters,\
        \ recognizing the spirals on their faces as Knull's emblem. When Carnage arrived\
        \ to claim Mac Gargan's Venom codex, Miles attempted to fight him off. Venom\
        \ arrived to save the Scorpion from being killed, though Gargan suffered severe\
        \ spinal trauma. However, Venom was unable to save Miles, who was overwhelmed\
        \ and bonded to an offshoot of the Carnage symbiote, turning him into a six-armed\
        \ symbiote-doppelganger.{{r|Absolute Carnage Vol 1 2}}{{r|Absolute Carnage:\
        \ Miles Morales Vol 1 1}} thumb|left|Bonded with the symbiote Under the symbiote's\
        \ control, Miles was sent to kill J. Jonah Jameson alongside a Carnage doppelg\xE4\
        nger formed from the serial killer Happy Dan Andrews; coming into conflict\
        \ with Silver Sable and her Wild Pack.{{r|Absolute Carnage: Miles Morales\
        \ Vol 1 2}} Miles managed to separate himself from his symbiote with a Venom\
        \ Blast, but willingly rebonded to it to spy on Dark Carnage's plans.{{r|Absolute\
        \ Carnage: Miles Morales Vol 1 3}} Evidently he succumbed to it once more,\
        \ as he attacked Rex Strickland's warehouse alongside Dark Carnage and the\
        \ Carnageized Norman Osborn, attempting to kill Eddie Brock. Miles' symbiote\
        \ was electrocuted by Eddie, and Miles filled Eddie in on what he had learned\
        \ of Dark Carnage's plans. However, they were unable to stop Dark Carnage\
        \ from assimilating the Venom symbiote and becoming powerful enough to free\
        \ Knull. Miles informed Eddie that the Maker had lied about his codex-extracting\
        \ machine incinerating them, prompting Eddie to merge to the harvested codices\
        \ into a gestalt symbiote and pursue Dark Carnage.{{r|Absolute Carnage Vol\
        \ 1 4}} ====Multiversal Adventures==== After the restored Web of Life and\
        \ Destiny started to be corrupted due to the Patternmaker going missing, Miles\
        \ was recruited by Spider-Zero to help find Annie.{{r|Spider-Verse Vol 3 1}}\
        \ During his travelling, he aided Spider-Ma'am and her team in battling evil\
        \ versions of themselves, including an evil version of himself, which were\
        \ lead by a Carnage-possessed Aunt May. They were able to defeat them and\
        \ Miles continued his search.{{r|Spider-Verse Vol 3 2}} He then teamed up\
        \ with SP//dr to fight against Kraven who had been enhanced by Mister Sinister,\
        \ but luckily they were victorious.{{r|Spider-Verse Vol 3 3}} thumb|right|Team-up\
        \ with [[Peni Parker (Earth-14512)|SP//dr]] He helped Web-Slinger in defeating\
        \ Scorpion,{{r|Spider-Verse Vol 3 4}} and also helped The Spider-Man in battling\
        \ Madame Swarm"
