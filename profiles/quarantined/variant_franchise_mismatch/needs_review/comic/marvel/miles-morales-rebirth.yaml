    - field: standard_equipment
      value: 'Spider-Man''s Suit: Miles originally wore a cheap Spider-Man costume,
        before wearing his red and black suit. Vibranium Suit: Gifted to him by Black
        Panther, the fabric of this spider-suit is comprised of a Vibranium Nano-Mesh
        "interwoven with an internal coaxial, insulated coating." The suit was designed
        to regulate the excessive output of Miles'' bio-electricity while simultaneously
        allowing him to use his venom-based abilities for far longer in exchange for
        limiting their overall potency. The suit is also equipped with its own specialized
        Web-Shooters and can shield Miles from most fatal injuries, but lacks the
        full capabilities of a true Panther Habit due to the mesh needing to be thin
        enough for Miles to maintain his full agility. Web-Shooters: Originally created
        and used by Peter Parker, Aunt May gave Peter''s web-shooters to Miles. Over
        a year later, Miles was given an updated pair by his world''s S.H.I.E.L.D.
        {{Navigation'
      source_id: fandom-marvel-miles-morales-rebirth
