    - field: powers_and_abilities
      value: ": Miles speaks and . Expert Hand-to-Hand : Despite his lack of formal\
        \ training prior to his spider-bite, Miles' enhanced agility, reflexes, and\
        \ coordination made him an extraordinary melee fighter. He had also learned\
        \ to mimic the original Ultimate Spider-Man's fighting style by watching old\
        \ online videos of the hero\u2019s past battles to improve his own combat\
        \ skills. He later received combat training from the Ultimates. After becoming\
        \ the prot\xE9g\xE9 of Misty Knight, Miles received training in hand-to-hand\
        \ combat and martial arts, which in combination with his powers have made\
        \ the Brooklyn Spider-Man into an even more formidable combatant. In addition,\
        \ Miles has learned most of his moves from sh\u014Dnen media and video games.\
        \ Investigation: Miles is the prot\xE9g\xE9 of veteran detective Misty Knight,\
        \ who trained the Spider-Man on how to radically improve both his investigative\
        \ skills and inductive/deductive reasoning while working together at her agency.\
        \ Miles' talents as a detective were strong enough to even impress Blade,\
        \ as he was able to quickly deduce the whereabouts of a vampire nest both\
        \ heroes were hunting down. : Courtesy of his \"internship\" with Misty Knight's\
        \ agency, Miles also became the apprentice of the renowned Kenjutsu practitioner,\
        \ Colleen Wing. Under Colleen's tutelage, Miles developed into a highly-adept\
        \ swordsman to compliment his usage of the \"Venom-Saber\" energy construct.\
        \ These skills have enabled him to single-handedly hold his own against dangerous\
        \ foes such as the Extrembiote-empowered Cletus Kasady, Roderick Kingsley,\
        \ and the vampire spawn of R'ym'r the Insatiable One."
