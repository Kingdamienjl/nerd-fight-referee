      value: "*Genius-Level Intellect: Miles was shown to be incredibly intelligent,\
        \ being able to develop an energy converter when he was in middle school which\
        \ earned him a place in an Oscorp science exhibition. He also demonstrated\
        \ an understanding of biophysics upon discovering his bioelectric abilities,\
        \ throwing out possible explanations for this new power such as electrolytes\
        \ and others. *Expert Hacker: Miles was shown to be able to use his tablet\
        \ to hack into many types of devices. *Expert Combatant: Miles was briefly\
        \ taught basic Boxing stances and counter punches from Spider-Man before he\
        \ gained spider-powers. This was later proven to be useful, when Miles stood\
        \ up for a civilian who was being attacked by Ryker's Island escapees. As\
        \ Spider-Man, Miles developed a unique combat style which incorporates a rudimentary\
        \ form of Boxing, Capoeira, Pro-Wrestling, and Breakdancing. Though his mentor\
        \ is more adept overall in crime fighting, Miles can still hold his own in\
        \ combat, having come into his own under Peter\u2019s tutelage. He is a versatile\
        \ hand-to-hand combatant, owing to his respective radiation-infused spider\
        \ altering his physiology and granting him several abilities, such as enhanced\
        \ strength, agility, speed, his \u201Cspider-sense\u201D, as well as his bio-electricity\
        \ and camouflage. *Multilingualism: Miles is fluent in and , which he uses\
        \ when talking to his mother. He is also advanced in American Sign language.\
        \ *Indomitable Will: Just like his mentor, Miles has an incredibly strong\
        \ force of will, completely free of evil and temptation. For the few years\
        \ he's been active as Spider-Man, he has managed to find a balance his life\
        \ as a student and his superhero life. His will was so great that, despite\
        \ the immense pain it caused and knowing it would likely kill him, he absorbed\
        \ the energy of the Nuform reactor in order to save Harlem. During his confrontation\
