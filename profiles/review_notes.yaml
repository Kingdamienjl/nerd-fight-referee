- profile_path: profiles/needs_review/anime/inuyasha/naraku.yaml
  field_path: power_scale.speed.text
  issue_type: auto_repair
  note: Auto repair extracted source-backed value
  suggested_value: "Naraku could move faster than the eye could see, both in the air\
    \ and on the ground. He managed to fight against Inuyasha and his group many times\
    \ through his natural speed, though he usually retreated after a short time. *\
    \ Superhuman vitality and regeneration: Naraku's supernatural vitality coupled\
    \ with his immense regenerative capabilities made him a difficult foe to physically\
    \ combat. Even if beheaded or got his body entirely shattered, he will not die.\
    \ If he is attacked without spiritual power, he will not take any damage.Zusetsutaizan\
    \ \u014Cgikaiden, page 191. He can break apart and reassemble his body at will.\
    \ He suffers no damage from physical attacks such as being slashed with swords\
    \ or stabbed with spears.Zusetsutaizan \u014Cgikaiden, page 192. At Mount Hakurei,\
    \ he even used Sessh\u014Dmaru to test out his new body's capabilities and emerged\
    \ unfazed.{{Cite anime|1|124}} * {{Translation|Transformation|\u5909\u5316, \u3078\
    \u3093\u3052|Henge}}: Naraku could take the form of anyone or anything that he\
    \ chose, usually a humanoid, and change his voice along with his physical appearance.\
    \ He possessed the young lord, Kagewaki, and remained in that standard form for\
    \ the rest of the series. We're told by Miroku that every time his grandfather\
    \ battled Naraku, the demon appeared in a different form, being defeated when\
    \ Naraku took the form of a beautiful young woman. The most important instance\
