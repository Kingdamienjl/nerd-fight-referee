  note: Auto repair extracted source-backed value
  suggested_value: While in his Hybrid form, Denji's physical durability is increased
    to inhuman levels. He can fall from great altitudes and punch Devils through walls,
    without receiving any injuries. He also has survived a point-blank blast from
    the Bat Devil that destroyed a building behind him,{{Ref|m|8|11 - 14}} multiple
    explosions from Reze, being on fire for extended periods of time and being near
    the Typhoon Devil's tornado, which has been shown to be strong enough to lift
    cars. His head and chainsaws are far more durable than the rest of his body, due
    to being made of metal, and being capable of deflecting bullets.{{Ref|m|28|9}}
    **Augmented
