- profile_path: profiles/needs_review/anime/chainsaw-man/denji.yaml
  field_path: power_scale.intelligence.text
  issue_type: auto_repair
  note: Auto repair extracted source-backed value
  suggested_value: 'Despite never receiving a proper education, Denji is very perceptive
    when it comes to ascertaining his enemies'' weaknesses and how to exploit them.
    Denji was trained under Kishibe, who he refers to as "master" later on in the
    story, who teaches him various strategies. This is shown in the fight against
    Katana Man where Denji deceives Katana Man by making him think that Denji can
    only manifest chainsaws in his arms. Denji also managed to incapacitate Reze by
    using her weakness against water and defeat Santa Claus by abusing her weakness
    towards fire and light. In the time between Parts 1 and 2 Denji has continued
    developing his skills, such as learning to use his neck cables to reattach his
    head and legs after being dismembered and learning to resist mental attacks by
    damaging his own brain with his chainsaws as seen in the fight against the Falling
    Devil. *Swimming: After meeting Reze, Denji learned how to swim. He managed to
    use this skill to his advantage during his fight against her.'
