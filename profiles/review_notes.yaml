- profile_path: profiles/needs_review/anime/inuyasha/inuyasha.yaml
  field_path: power_scale.durability.text
  issue_type: auto_repair
  note: Auto repair extracted source-backed value
  suggested_value: "Inuyasha has a very sturdy body and can endure a great deal of\
    \ physical pain, as was once demonstrated in an early battle with Sessh\u014D\
    maru when he continued fighting even after being impaled in the stomach. He was\
    \ also capable of surviving considerable blunt force trauma, a direct blow from\
    \ a solid wooden log that broke on contact, falling several stories into a crevasse\
    \ in his fight with Ry\u016Bkotsusei, and being thrown hard enough to shatter\
    \ solid rock. His skin was thick enough for him to survive being tangled by Yura's\
    \ wire-thin hair strands, which were capable of cutting through solid tree trunks.\
    \ *Accelerated Healing: Inuyasha is capable of rapid recovery from even the most\
    \ grievous of injuries (i.e., impalement) and can do so without any visible scarring.\
    \ When T\u014Dt\u014Dsai yanked out one of Inuyasha's fangs to repair the Tessaiga,\
    \ he mentioned that Inuyasha would grow a replacement canine in just half a day.\
    \ Regardless, the extent of his healing abilities is not unconditional, and it\
    \ has been implied he could not regenerate lost limbs. *Enhanced Senses: While\
    \ not quite as sensitive as those of T\u014Dga and Sessh\u014Dmaru, Inuyasha's\
    \ senses of smell and hearing are nonetheless remarkably acute. He is able to\
    \ hear what people were whispering from great distances away; as was the case\
    \ when, while perched on a tree, he overheard Akitoki H\u014Dj\u014D hiding in\
    \ a bush, quietly praising Kagome under his breath. Likewise, his sense of smell\
    \ is extremely keen; he could smell hints of blood from kilometers away and could\
    \ detect the presence of people by smell long before they could be seen. His sense\
    \ of smell was also his method of detecting y\u014Dki and thus was used in locating\
    \ the Kaze no Kizu, the striking point of the Bakury\u016Bha and y\u014Dketsu\
    \ auras, and, once, sniffing out the path of the outside world to pierce Sessh\u014D\
    maru's Meid\u014D Zangetsuha. He could catch a whiff of Naraku's power from many\
    \ miles away as soon as he let down his barrier with at least as much accuracy\
    \ as K\u014Dga, despite the latter being a full y\u014Dkai. *thumb|Inuyasha's\
    \ claws.Claws: Inuyasha has sharp, blade-like claws, and he can use them to easily\
    \ slice ordinary foes to ribbons. Normally, he uses these claws in his Sankon\
    \ Tess\u014D (\u6563\u9B42\u9244\u722A; \"Claws of Exorcism\" or \"Claws of Steel\"\
    \ in VIZ manga; \"Iron Reaver Soul Stealer\" in the English dub) attack. His full-powered\
    \ Sankon Tess\u014D is at least strong enough to break steel frames and destroy\
    \ numerous roof tiles.Zusetsutaizan \u014Cgikaiden, page 30 *Blood Solidification:\
    \ By using his demonic power, Inuyasha can harden his own blood and throw them\
    \ like bladed projectiles in an attack he refers to as Hijin Kess\u014D (\u98DB\
    \u5203\u8840\u722A lit. Flying Blade Blood Claws; VIZ, \"Claws of Blood\" or \"\
    Daggers of Blood\"; \"Blades of Blood\" in the English dub). While he typically\
    \ used blood from an already open wound, Inuyasha could draw the necessary blood\
    \ to use the attack by digging his nails into his palms. He would often use this\
    \ tactic as a surprise counterattack after being wounded when his opponents would\
    \ assume he was weakened by his wounds and lower their guard.Zusetsutaizan \u014C\
    gikaiden, page 31 *Longevity: Inuyasha's mixed heritage and him being the son\
    \ of a powerful daiy\u014Dkai, afforded him supernatural longevity. Inuyasha noticeably\
    \ aged slower than normal humans; he was over 150 years old at the time of his\
    \ sealing but looked to be the physical equivalent of a 15-year-old human. *Limited\
    \ Time Travel: By jumping down the Bone-Eater's Well, Inuyasha could travel back\
    \ and forth five hundred years to and from the future. Inuyasha has repeatedly\
    \ traveled to Kagome's time without the aid of a Sacred Jewel Shard. Others, besides\
    \ Inuyasha and Kagome, were unable to travel through the well, as shown when Shipp\u014D\
    \ attempted to go through the well but failed, and when S\u014Dta attempted to\
    \ go down the well to call Inuyasha for help during the attack of the Noh Mask\
    \ but was unable to get through either. *{{Translation|Transformation|\u5909\u5316\
    , \u3078\u3093\u3052|Henge}}: Due to his half-demon heritage, Inuyasha transforms\
    \ against his will when certain conditions are met. Thus this attribute can fluctuate\
    \ between strength and weakness, making it an unreliable ability. Most notably,\
    \ during the night of the new moon, he is temporarily rendered human for the duration\
    \ of the event. In another case, Inuyasha transforms into a full-fledged demon\
    \ when his life is in mortal danger. He is also susceptible to being corrupted\
    \ by an impure Sacred Jewel, turning into a savage demon. This was first seen\
    \ when he and his friends were trapped in the Stone Ogre's belly, Inuyasha used\
    \ a shard of the Sacred Jewel to strengthen Tessaiga's power, an effort which\
    \ backfired when the impure powers of the shard flowed through Tessaiga, causing\
    \ Inuyasha to transform. After Kagome purified the shard, Inuyasha regressed into\
    \ a more tamed version of his y\u014Dkai form. His y\u014Dki increased exponentially,\
    \ allowing him to enhance the Tessaiga's Kong\u014Ds\u014Dha's barrier-piercing\
    \ effect with an intensity far superior to its previous uses, as wel"
