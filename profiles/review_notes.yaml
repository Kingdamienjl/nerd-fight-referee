- profile_path: profiles/needs_review/anime/berserk/zodd.yaml
  field_path: abilities
  issue_type: auto_repair
  note: Auto repair extracted source-backed value
  suggested_value: === Swordsmanship and Tactics === Zodd has learned a large variety
    of fighting styles and tactics throughout his centuries of battle. He is able
    to fight with nearly any weapon he finds on the battlefield, but his preferred
    weapons in his normal form are dual-wielding swords and battleaxes. While battling
    Guts on the Hill of Swords, he is able to discern within seconds that his sword
    is damaged by the Dragon Slayer's massive swings and quickly discards it, adopting
    a new fighting style from new weapons on the spot. === Strength === Zodd is able
    to defeat the average apostle with ease, and is the only apostle known to have
    survived direct conflict with the Skull Knight, whom he has fought on multiple
    occasions. In his apostle form, he can parry large weapons with his horns and
    claws, absorb arrow volleys with his thick fur and skin, and break through solid
    concrete and rock with sheer force. His strength is such that he can send a fully-armored
    Guts with his Dragon Slayer flying across the battlefield with the swipe of his
    paw. Furthermore, he is capable of tearing fully armored men and horses to pieces
    with a single swipe.
  source_id: fandom-berserk-zodd
  timestamp: '2026-06-09T15:05:47Z'
  created_at: '2026-06-09T15:05:47Z'
- profile_path: profiles/needs_review/anime/chainsaw-man/denji.yaml
  field_path: power_scale.durability.text
