    Asylum II: Clayface and endured severe internal damage while continuing to fight.
    Despite heavy blood loss and exhaustion, Batman routinely pushes himself to keep
    fighting until his body gives out.Batman (1940) #497 His endurance further extends
    to resisting explosions and extreme impacts; the Batsuit itself greatly enhances
    his survivability. It has withstood massive blasts and collapsing debris,Batman
    (1940) #437 explosions that obliterate several floors of a building,Batman (1940)
    #619 and direct RPG detonations.Batman: Poison Ivy Even without armor, Bruce''s
    conditioning allows him to take bone-shattering impacts and remain functional.)'
