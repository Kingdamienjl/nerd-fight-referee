- profile_path: profiles/needs_review/anime/mob-psycho-100/arataka-reigen.yaml
  field_path: abilities
  issue_type: auto_repair
  note: Auto repair extracted source-backed value
  suggested_value: Reigen possesses a wide variety of skills and knowledge due to
    working many different jobs while trying to avoid becoming a masseur as his parents
    wanted. He applies these skills and knowledge when helping his clients, only calling
    in Mob if actual spirits are involved. Reigen has also said he possesses the green
    belt in Shaolin kung-fu{{qref|ch = 45|p = 14}} and is proficient enough in martial
    arts to knock people out. Initially unable to see spirits, he gained the ability
    to see them after being temporarily infused with Mob's psychic power.{{qref|ch
    = 49|p = 17}} When infused with Mob's powers, he entered the "Reigen Arataka -
    1000%" state, where he was able to effortlessly deal with all of the 7th Division
    Scars, taking their most powerful attacks like they were nothing. Reigen's true
    strength lies in his mental fortitude and charisma. He has the ability to focus
    on and execute solutions when in the face of uncertainty or adversity and keeps
    his cool in all situations. He is good at winning arguments, and maintaining common
    sense and positivity no matter the argument. He's a skilled manipulator of other
    people, able to tell half-truths and straight-up lies naturally. He's also a good
    actor, which helps him carry his lies along and is critical to maintaining his
    persona as a master psychic, especially during the years when he couldn't even
    see spirits. Reigen is also the creator of various "special techniques", which
    he uses to great effect in his line of work. They can range from offensive abilities
    to restorative body or mind-cleansing procedures, often involving him dramatically
    shouting the name of the said ability as he performs it. {| width="100%" align="center"
    cla
