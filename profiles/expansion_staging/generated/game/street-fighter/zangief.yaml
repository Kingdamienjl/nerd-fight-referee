    with the rythmic movement of its user''s muscles) *Limited Power Nullification (Head Butt and Banishing
    Flat cancel out normal projectiles. Iron Body nullifies incoming attacks) *Damage Boost (Can perform
    enhanced versions of his Special Attacks. Cossack Muscles enhances his Screw Pile Drive and Borscht
    Dynamite) *Status Effect Inducement (By hitting the opponent repeteadly, without them being able to
