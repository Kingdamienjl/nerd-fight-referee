- id: claim-weaknesses-625dcaa7
  section: weaknesses
  axis: weakness
  text: 'None notable. Notable Attacks and Techniques: |-|Notable Attacks/Techniques= {{#tag:tabber| {{!}}-{{!}}Unique
    Attacks= *Rawhide: A downward hammer punch. *Brutal Spike: A quick high hook. *Heavy Impact: A powerful
    punch delivered while lunging forward meant to strike the midsection. *Outlaw Kick: A spinning rounhouse
    kick targeting the opponent''s head. *Triple Impact: A combination of three blows featuring a jab,
    a hook and an overhead punch. *Snapback Combo: A combo consisting in two right hooks, followed by
    a low punch and an uppercut. Rawhide.gif|Rawhide BrutalSpike.gif|Brutal Spike HeavyImpact.gif|Heavy
    Impact OutlawKick.gif|Outlaw Kick TripleImpact.gif|Triple Impact SnapbackCombo.gif|Snapback Combo
    {{!}}-{{!}}Throws= *Punisher: Luke grabs the opponent by the back of the head and punches their face
    thrice, knocking them down. *Scrapper: Luke grabs the opponent''s head and knees their face, then
    shoves them to the other side and knees them again. LukePunisher.gif|Punisher Scrapper.gif|Scrapper
    {{!}}-{{!}}Special Attacks= *Sand Blaster: Luke punches the air and fires a projectile of orange ki
    energy. The EX version is stronger and travels farther. SandBlaster.gif|Sand Blaster EXSandBlaster.gif|EX
    Sand Blaster *Rising Rocket: A rising uppercut performed while jumping high into the air. The EX version
    is stronger. RisingRocket.gif|Rising Rocket EXRisingRocket.gif|EX Rising Rocket *Avenger: Luke bends
    low and rushes forward with a wide stance, then can follow up with any of his moves or one of the
    following techniques. The EX version allows him to power through an enemy hit. **No Chaser: A shoulder
    tackle. The EX version is stronger and faster. **Impale: Luke somersaults forward and and kicks with
    his falling heel. The EX version is stronger. LukeAvenger.gif|Avenger (Normal and EX) NoChaser.gif|No
    Chaser (Normal and EX) LukeImpaler.gif|Impaler (Normal and EX) *Flash Knuckle: A direct strike that
    comes in three different fashions. The light version is a fast uppercut. The medium version is a straight
    lunging punch. The heavy version is powerful a rushing overhead punch. Luke can charge up all of these
    versions, increasing the damage dealt and the distance the opponent is launched. The EX version is
    a double uppercut delivered while moving forward. LightKnuckle.gif|Flash Knuckle (Light) MediumKnuckle.gif|Flash
    Knuckle (Medium) HeavyKnuckle.gif|Flash Knuckle (Heavy) ChargedLightKnuckle.gif|Flash Knuckle (Light
    - Charged) ChargedMediumKnuckle.gif|Flash Knuckle (Medium - Charged) ChargedHeavyKnuckle.gif|Flash
    Knuckle (Heavy - Charged) EXFlashKnuckle.gif|EX Flash Knuckle {{!}}-{{!}}Super Attacks= *Annihilator:
    Luke begins with a Hard Shot to power up what is about to come. He delivers a stunning hook, rushes
    over the opponent and follows with two more hooks. Luke then unleashes a barrage of quick punches,
    before ending with a last, devastating hook across the opponent''s face. center|335px {{!}}-{{!}}V-Techniques=
    *Downward Strike: Luke quickly dashes backwards to dodge an incoming attack and replies with a fast
    and powerful punch that strikes the opponent before they are able to react, knocking them down. *Ejector:
    After blocking an attack, Luke delivers a reverse turning kick that knocks the opponent down. DownwardStrike.gif|Downward
    Strike LukeEjector.gif|Ejector *Hard Shot: Luke powers up his forearms, which become swolled and red-hot.
    His next standard Flash Knuckle has the properties of the charged version, while the charged version
    is made even stronger. *Suppressor: Luke lunges back and then delivers a gut punch. This technique
    can also be used to counter blows and throws. HardShot.gif|Hard Shot Suppressor.gif|Suppressor (Normal
    and Counter) *Fully Armed: Luke waves his leading arm upwards as steam arises from his forearm. By
    doing this, he gains access to the following moves: **Rock Smasher: Three Sand Blaster fired in a
    row. **Thermobaric Thrash: After landing an EX Sand Blaster, Luke fires five more projectiles in rapid
    succession. FullyArmed.gif|Fully Armed RockSmasher.gif|Rock Smasher ThermobaricThrash.gif|Thermobaric
    Thrash *Vanguard: Luke pumps up, as steam arises from his arms. He becomes able to chain together
    different version of his Flash Knuckle one after the other. LukeVanguard.gif VanguardCombo.gif }}
    |-|Fighting Style= Luke is a Mixed Martial Artist who favors classic standing-up fighting with occasional
    flying attacks and the use of energy blasts such as Sand Blaster. His skills have been forged by the
    years spent in the military and refined through street fighting, although little is known about said
    period of his life. Luke is an aggressive fighter bent on a strong offense with the purpose to push
    the opponent to the corner with relentless blows, combos and projectiles. LukeIntro.gif LukePunches.gif|Punches
    LukeKicks.gif|Kicks LukeCrouchingPunches.gif|Crouching Punches LukeCrouchingKicks.gif|Crouching Kicks
    LukeJumpingPunches.gif|Jumping Punches LukeJumpingKicks.gif|Jumping Kicks {| cla'
