  intelligence:
    text: "Extraordinary Genius (While the intelligence of the Balrogs is never explored in detail, as\
      \ Maiar they should be somewhat comparable to the likes of a limited Istar like Radagast who is\
      \ considered to be much less wise than Gandalf or Saruman as Istari.Unfinished Tales, Part Four:\
      \ II, The Istari As Radagast was considered one of \"The Wise\" despite being an intellectual lesser\
      \ to his peers, this should make them comparable to a being who can accurately deduce the future\
      \ with knowledge and experience alone. Durin's Bane in particular was capable of matching Gandalf\
      \ in a magical duel with counter-spells that \"nearly broke\" him.The Lord of the Rings: Fellowship\
      \ of the Ring, Book Two, Chapter 5 The Bridge of Khazad-D\xFBm) | Possibly Nigh-Omniscient (The\
      \ Ainur acted as the origin to all that which existed within E\xE4, having sung all the concepts\
      \ which constitute the world during the Anulindal\xEB. However, Eru himself withheld some knowledge\
      \ about his creation from the Ainur)"
    source_ids: *id002
    confidence: 0.95
