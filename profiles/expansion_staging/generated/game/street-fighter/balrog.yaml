  attack_potency:
    text: "Small City level (By successfully causing enough pain to Ungoliant that she was forced to flee,\
      \ the Balrogs should scale above Morgoth's scream, which Ungoliant withstood point blank)Silmarillion:\
      \ Chapter 9 OF THE FLIGHT OF THE NOLDOR, possibly Mountain level, likely far higher (Balrogs are\
      \ considered to be most dreadful and powerful of the Fallen Maiar across the Tolkien's Legendarium.Silmarillion:\
      \ VALAQUENTAMorgoth's Ring: PART FIVE. Text X Thus, they should be stronger to the dark spirits\
      \ that were capable of destroying the Moon over an unquantifiable amount of time)Silmarillion: Chapter\
      \ 11 OF THE SUN AND MOON AND THE HIDING OF VALINOR, can ignore conventional durability with Soul\
      \ Manipulation (Ainur can directly influence the f\xEBar/soul to attack it directly)The Nature of\
      \ Middle-Earth, Part Two: Body, Mind and Spirit, XIII SpiritSilmarillion: AINULINDAL\xCBMorgoth's\
      \ Ring: Notes on motives in the Silmarillion (iii) | Outerverse level (The Ainur in their origin\
      \ are residents of the \"primary creation\", with the difference between a primary and a secondary\
      \ world being described as the difference between reality and \"myth and fairy-story\". In this\
      \ state, they resided in a world of purely will and awareness outside the space-time of E\xE4 once\
      \ it was created, with the Ainur being described as beyond the bounds and limits of time and space)Letters\
      \ of Tolkien: Letter 131Letters of Tolkien: Letter 181The Nature of Middle-Earth, Part Three: The\
      \ World, it's Lands, and its Inhabitants, III Powers of the Valar, possibly High Outerverse level+\
      \ (Sub-creators of the primary world, the creators of stories and myth within the primary reality,\
      \ are described as possessing \"no bounds, but the laws of contradiction\" in their capacity as\
      \ \"writers\". As the \"highest created beings\" created by Eru, the Ainur are potentially similar\
      \ existences to these sub-creators, with the Ainur possessing \"special 'sub-creative' powers\"\
      \ as Eru grants them certainty that their creations are given reality, unlike the writers who do\
      \ not possess this certainty)Letters of Tolkien: Letter 153"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "Supersonic+ to High Hypersonic, Immeasurable when discarding his physical form (The Ainur are\
      \ still capable of travelling at any speeds they desired, being able to instantly appear anywhere\
      \ they desired within E\xE4 and exploring the past at will. However, the future is something they\
      \ can only explore so far as the design was made clear to them during the Music)Morgoth's Ring:\
      \ PART FIVE. Text XIThe Nature of Middle-Earth: Part Two, XIV The Visible Forms of the Valar and\
      \ Maiar | Immeasurable (In their origin, the Ainur were unbound by space-time, and were capable\
      \ of exploring both the past and future with their movements)Morgoth's Ring: PART FIVE. Text XI"
    source_ids: *id002
