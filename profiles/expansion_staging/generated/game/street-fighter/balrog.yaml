    \ *Lightning Manipulation (Durin's Bane created a massive thunderstorm during his fight with Gandalf\
    \ the Grey) *Likely Analytical Prediction (While lesser than Saruman in intelligence, they are somewhat\
    \ comparable to a lower Istar, who can accurately predict the future through logical deduction) *Acausality\
