- id: claim-powers-and-abilities-f7b3e899
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Expert Martial Artist (Master of the Esoteric Yoga fighting
    style.Street Fighter V: Champion Edition - Official Website) *Acrobatics (Hypermobility and Self-Momentum.)
