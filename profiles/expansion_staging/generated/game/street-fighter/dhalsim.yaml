    Fighter 4: Win Quotes-Versus Mode) * Space-Time Manipulation (Non-Combat Applicable: Through meditation,
    Dhalsim is able to touch the very fabric of space and time.Super Street Fighter 4: Win Quotes-Versus
    Mode) *Teleportation (Via Yoga Teleport: Warped himself from India to Mexico.) *Flight (Restricted
    flight: Can levitate.Street Fighter IV - Dhalsim''s Rival Battle) *Instinctive Reaction (His body
    can sense danger and enter a defensive stance before his mind is aware of it.Side readers: Musings
    on a Still Night (Part 1)) *Status Effect Inducement (By hitting the opponent repeteadly, without
    them being able to recover, he can cause them to enter the "Stun" status, which leaves them unable
    to react. His Focus Attack causes the opponent to enter a "crumpling" status) *Damage Boost (Can perform
    enhanced versions of his Special Attacks. Yoga Deep Breath enhances his Yoga Fire.) *Limited Fate
    Manipulation (Fighters can fight against their destiny.)'
