      \ Sweep Focus dhalsim.gif|Focus Attack *Yoga Upper: Dhalsim performs a quick, open-handed, uppercut\
      \ that hits almost vertically above him. *Divine Kick: Dhalsim performs a front kick with his hands\
      \ put together. *Thrust Kick: Dhalsim crouches low and extends his leg out toward his opponent.\
      \ *Yoga Anvil: Dhalsim extends both of his arms upward at a 45\xB0 angle. *Yoga Spear/Drill Kick:\
      \ Dhalsim performs a drill-like kick downward towards his opponent. *Yoga Mummy: Dhalsim slowly\
      \ twirls downward, spinning like a drill, and hitting the opponent headfirst. *Yoga Tower: Dhalsim\
      \ raises his body into the air by stretching his leg, allowing most attacks to pass under him. *Yoga\
      \ Chop: Dhalsim strikes his opponent with a downward, open-handed chop. *Yoga Sweep: Dhalsim stretches\
      \ his leg and slides forward, hitting the opponent with the tip of his foot. *Focus"
