- id: claim-weaknesses-1e468407
  section: weaknesses
  axis: weakness
  text: "Kyo does not train and uninterested easily. Emotionally sensitive about the fact that he never\
    \ graduated from high school due to being kidnapped by NESTS. Notable Attacks/Techniques: *Specials\
    \ **108 Shiki \u2022 Yamibarai: Kyo unleashes a burst of fire that travels across the ground. **114\
    \ Shiki \u2022 Aragami (\u30FB\u307F; Method 114: Savage Bite): Kyo delivers a flaming right hook\
    \ that can be followed up with further attacks. ***124 Shiki \u2022 Munotsuchi: Kyo swings downward\
    \ to sweep the opponent off their feet. ****427 \u2022 Shiki Hikigane: After performing Shiki 124,\
    \ Kyo delievers a strong uppercut that launches the opponent into the air, allowing for further combos.\
    \ ***127 Shiki \u2022 Yanosabi: Kyo drives his left elbow downward, slamming the opponent into the\
    \ ground. It can also act as the third move in the attack chain if 128 was used 2nd instead. ***128\
    \ Shiki \u2022 Konokizu: Kyo delivers a flaming uppercut with his left fist. ****125 \u2022 Shiki\
    \ Nanase: After Shiki 127 or 128, Kyo performs a side kick, launching the opponent away. ****Ge-Shiki\
    \ \u2022 Migiri Ugachi: After grounding the opponent with Shiki 127 or 128, Kyo punches downward,\
    \ striking them. ****212 Shiki \u2022 Kototsuki Yo: After Shiki 127 or 128, Kyo grabs the opponent's\
    \ face and burns them up. **115 Shiki Dokugami (\u30FB\u307F; Style 115: Poison Bite): Kyo delivers\
    \ a strong, flaming left hook that allows for further attacks similar to 114 Shiki Arigami ***401\
    \ Shiki \u2022 Tsumiyomi: Kyo delivers a flaming back hand at the opponent. ****402 Shiki \u2022 Batsuyomi:\
    \ Kyo bashes the opponent upwards with his back, launching them upwards. *****100 Shiki \u2022 Oniyaki:\
    \ Kyo spirals in the air while engulfed with flames, finishing the chain. **100 Shiki \u2022 Oniyaki:\
    \ Kyo spirals in the air while engulfed with flames. Can act as a defensive tool. **75 Shiki \u2022\
    \ Kai: Kyo delivers a series of high kicks that launch the opponent upward, allowing for further combos.\
    \ **R.E.D. Kick: Kyo jumps forward in an arc and swings back leg around for an overhead kick. **212\
    \ Shiki \u2022 Kototsuki You: Kyo rushes and grabs the opponent then unleashes a fiery explosion on\
    \ the target in his clutches. **101 Shiki \u2022 Oboroguruma: Kyo performs a lunging spin kick that\
    \ leads to two other kicks. **910 Shiki \u2022 Nuetsumi: Kyo does an uppercut with his rear hand,\
    \ launching the opponent. It also acts as a counter, where Kyo responds to any attack with a downward\
    \ punch to the ground. *Supers **Ura 108 Shiki \u2022 Orochinagi: Kyo gathers fire into his palms\
    \ then thrusts it, creating a giant wave of fire in front of him. **Ura 121 Shiki \u2022 Ama no Murakumo:\
    \ Kyo fires a fire projectile at the opponent and summons a series of large fire pillars that follow\
    \ right after. **Saishuu Kessen Hiougi-Totsuka: Kyo cloaks his arms in fire and rushes at the opponent\
    \ with terrifying speeds. Once he hits him/her with the flame engulf fist, he unleashes a massive\
    \ fire explosion around him, completely burning the opponent. **Ura 1212 Shiki \u2022 Yakumo: Kyo\
    \ tosses a grounded flaming projectile, stunning his opponent on contact. He follows up with 2 flaming\
    \ punches and ends with a flaming tornado that imbues the Kusanagi clan logo above him. Feats: Respect\
    \ thread Note: Not to be confused with Kusanagi (His clone). ==Notable Matchups== Victories: Losses:\
