- id: claim-weaknesses-8625374a
  section: weaknesses
  axis: weakness
  text: "Kula is extremely childish and easily angered, especially when she sees fire. Notable Attacks/Techniques:\
    \ *Cryokinesis - Kula has extraordinary control over ice. When using her powers, Kula's hair becomes\
    \ blue, and her eyes turn magenta. When not in use of her powers, her hair is strawberry-blonde, and\
    \ the eyes are blue. Also, when her powers are active, she is surrounded by an aura of cold air that\
    \ continually swirls around her. Her ice powers are strong enough to freeze and shatter a space station\
    \ (Zero Cannon) made of steel, which means she can lower down the temperature around her as low as\
    \ minus 200\xB0F, though the limits of her cryokinesis are still unknown. **Create ice - Kula can\
    \ create ice out of thin air. **Ice breath - Kula can blow cold air out of her mouth. **Crystals -\
    \ Kula can create crystals of ice in her hand that could momentarily freeze her opponent, but its\
    \ primary use is to absorb incoming projectiles. **Ice strikes - Kula can create ice spikes around\
    \ her hands and freeze her hair, making it become dangerous pointed spikes. She can also embed her\
    \ attacks with cold air instead of ice, which she uses for her anti-air attack. **Slippery floor -\
    \ Kula can freeze the floor, using it to slide and possibly trip her opponents. **Ice shield - Kula\
    \ can create a shield of ice. The protection is hard enough to withstand superhuman strength. **Ice\
    \ projectile - Kula can fire a projectile made of ice with a kick. **Snowflake Projectile - Aside\
    \ from her ice projectile, Kula can fire snowflake-shaped projectiles that are larger than her standard\
    \ ice projectiles. **Body of ice - Kula can transform her entire body into ice. This is shown during\
    \ her intro. **Freeze - Kula can completely but temporarily encase her opponent in ice. **Ice Spikes\
    \ - Kula can create large, dangerous, pointed spikes made of ice. **Freeze air - Kula can transform\
    \ the air around her into ice, damaging anyone except herself, in range. This power is shown to the\
    \ full extent when she first appeared in KOF 2000 when she was able to freeze the entire stage (either\
    \ the docks or the factory, depending on when you fight her). **Snowman - Kula can create a snowman\
    \ and drop it on her enemy. **Ice control - Kula has control over her ice even when she has already\
    \ used it on her opponent. She can completely freeze her opponent from quite a distance by encasing\
    \ him/her in a huge crystal of ice then shatters her ice crystal from a distance, dealing a considerable\
    \ amount of damage to her opponent. It's best shown in her new Climax Desperation Move in KOF XIV.\
    \ ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Scroll box| content={{reflist|2}}\
    \ }} ==Notes/Explanations== {{Scroll box|content=}} {{Discussions}} Category:Characters Category:King\
