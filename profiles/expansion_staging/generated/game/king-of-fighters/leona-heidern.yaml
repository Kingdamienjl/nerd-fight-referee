  intelligence:
    text: Gifted |-|Chapter of Orochi Saga (KOF '96 to KOF '97)= The members of the Ikari Team were all
      instructed in a battlefield killing art known as "assassination arts" by their commanding officer,
      HeidernThe King of Fighters Characters; KOF '94-97 Complete Collection of All 45 Character Setting
