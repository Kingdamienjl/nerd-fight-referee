    the opponent and Passive Attack Amplification (His Attack Potency is constantly rising) with Vajra.
    |-|Optional Equipment NT=Sound Manipulation and Mind Manipulation with Roc (The bird-like noise emitted
    from when this weapon is swung attacks the mind of those who here it)
