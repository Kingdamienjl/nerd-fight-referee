- id: claim-weaknesses-4f5a221a
  section: weaknesses
  axis: weakness
  text: 'Slightly Arrogant. Notable Attacks and Techniques: *Pale Moon Dust: He knocks his opponents back
    with a hit, stabs his sword into the ground, and attacks the opponent by biting their neck, After
    vampirizing his opponent, he gets up, wipes his mouth, and says, "Perhaps I shall make you Amy''s
    pet!" *Royal Vexation: Raphael begins his Critical Edge by saying "Now you''ll see..." and performs
    an uppercut with his rapier. While the enemy is in mid-air, he shouts "...The extent of my power!",
    stabs them quickly three times and delivers a fourth finishing stab while rose petals fly about. Note:
    Many of Raphael''s abilities come from the various weapons he can equip. As such, in battle the creator
    should specify what weapon(s) he is allowed to have.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-b823f98b
  section: abilities
  axis: hax
  text: Original Timeline=Superhuman Physical Characteristics, Expert Swordsman, Mind Manipulation (If
    he bites the foe), Immortality (Type 1), Teleportation, Energy Manipulation, Energy Draining (By touching
    someone on the abdomen), Passive Durability Amplification and Limited Durability Negation with Epee,
    Heals himself each time he blocks with Wo Dao, Passive Attack Amplification, Sealing (Banishes Evil
    only), Holy Manipulation and can heal himself each time he attacks with Holy Antler, Pierces through
    armor with Estoc, Passive Durability Amplification, Regeneration (Low) and will heal each time he
    damages an opponent or blocks an attack with Queen's Guard. |-|Graf Dumas=Soul Manipulation (Can rob
    the souls of entire armies at once. Deals Soul Damage with each of attacks, stealing the soul of his
    opponent slowly during combat), Fire Manipulation, Chaos Manipulation, Unholy Manipulation, Mind Manipulation
    (Can manipulate the minds of others in order to coerce them into taking Soul Edge. If there is a malfested
    target, Soul Edge feeds off of their sinful actions of bloodlust and gains the ability to control
    them), Weapon Mastery, Electricity Manipulation, Creation (Created a mimic of Soul Edge as well as
    Astral Chaos), Dark Magic, Regeneration (Low), Immortality (Types 1 and 6), Teleportation, Dimensional
    BFR (Can send others to Astral Chaos. All Souls taken by Soul Edge are sent to Astral Chaos. Astral
    Chaos warps and corrupts all who enter, mind, body and soul, eventually driving them mad and turning
    them into a form of Malfested), Duplication, Light Manipulation, Possession, Reality Warping, Spatial
    Manipulation (Can cut through dimensions), Necromancy, Madness Manipulation (Type 2; Simply being
    in contact with its power is enough to drive one into madness. Can corrupt entire areas making it
    so that anyone who enters the area will be driven mad), Illusion Creation, Curse Manipulation, Corruption
    (Can turn those who come into contact with it into mindless Monsters, Vampires, Malfested, etc. Even
    sustaining injuries from him or any wielder of Soul Edge is enough to drive one insane as shown with
    Raphael whose body became corrupted by his wounds. Coming into contact with a malfested's blood can
    in fact infect another as shown when Amy became malfested by treating Raphael's wounds), When the
    host body is defeated, Inferno will appear to fight the opponent or use his mental powers to get them
    to grab the sword, Enhanced Senses, Extrasensory Perception, Resistance to Sealing (Taki's seals had
    no effect on him). |-|New Timeline=All Original Timeline abilities minus weapon abilities and Vampire
    powers, Statistics Amplification with Soul Charge.
  source_ids: *id003
