- id: claim-weaknesses-70dbf21c
  section: weaknesses
  axis: weakness
  text: "Weak against Ghost, Psychic and Dark type attacks | Gengar can only access their Mega Evolutionary\
    \ stage through physical possession of a specific Mega Stone type that is uniquely attuned to that\
    \ species and resonating the Stone with an accompanying Mega Ring (or similar device containing a\
    \ Key Stone), which can only be constructed by artificial means: this excludes most wild specimens\
    \ from harnessing the innate evolutionary potential, leaving only individuals in captivity as probable\
    \ candidates for Mega Evolution. Mega Evolution is not a permanent transformation; specimens immediately\
    \ revert back to their \"base\" forms once combat has been successfully concluded | Gigantamax can\
    \ only be used in areas with Dynamax energy (i.e. dens and stadiums), Destroying their non-move forcefield\
    \ through any means will harm them Notable Attacks/Techniques *Levitate: Gengar's special ability.\
    \ Gengar tend to continually hover in mid-air for combat situations even while not actively flying,\
    \ avoiding the ineptitude of its physiology in handling or traversing on land. *Cursed Body: Gengar's\
    \ new ability. Gengar, when hit, has a chance of making sure the opponent cannot use that move again\
    \ for a short period of time. *Shadow Tag: Mega Gengar's special ability. As a result of the Mega\
    \ Evolution, Mega Gengar are able to completely restrict an entity's ability of locomotion by conventional\
    \ means by entering or simply making contact with their shadow(s). However, spectral or ectoplasmic\
    \ beings are unaffected by this ability, regardless of them possessing a shadow. Note: Only techniques\
    \ that Gengar can naturally learn will be listed in this profile. No TMs, HMs or Tutor Moves. *Hypnosis:\
    \ Gengar utilizes hypnotic suggestion to send the target organism into a deep sleep. *Lick: Gengar\
    \ licks the opponent with its gaseous tongue, triggering physical paralysis and/or a strong possibility\
    \ of death via convulsions. *Spite: Gengar fires a hex that depletes the target's stamina severely\
    \ each time it uses the technique last used prior to the hex making contact. *Mean Look: Gengar fixes\
    \ a dark, arresting look at the opponent, freezing their actions on the spot and preventing further\
    \ escape. Even abilities like teleportation are ineffectual. *Curse: Gengar evokes a curse by reducing\
    \ as much of half of its own health. The opponent is then \"cursed\" and gradually sapped of their\
    \ own health until either unconsciousness or death. *Night Shade: Gengar uses its ghostly powers to\
    \ dupe the target into witnessing a frightening mirage. *Confuse Ray: Gengar releases a sinister ray\
    \ of light which mentally disorientates the opponent. *Sucker Punch: From a secure hiding spot, Gengar\
    \ rushes out and performs a sneak strike before retreating back into seclusion. *Shadow Punch: Gengar\
    \ throws a fist composed of shadows at the opponent with unerring accuracy. *Payback: Gengar begins\
    \ to store up its energy reserves, reserving it for a retaliatory strike of dark energy against the\
    \ opponent's prior attack. The nature of the energy appears to enable Gengar to augment the strike\
    \ beyond its standard power if it occurs after a previous offensive blow from the foe. *Shadow Ball:\
    \ Gengar projects a blob of shadow energy at the opponent. *Dream Eater: Gengar begins to consume\
    \ the dreams of sleeping organisms, stealing mental energy from them and using up to half of the absorbed\
    \ energy for regenerating health. *Dark Pulse: Gengar focuses its negative and violent thoughts into\
    \ a visibly dark aura, before projecting the aura outwards as an omnidirectional \"wave\" of dark\
    \ energy. *Destiny Bond: Gengar casts a peculiar energy signature outwards, linking it with a certain\
    \ organism: when Gengar falls unconscious, the link backlashes at the offender of Gengar's defeat\
    \ to also fall unconscious. *Hex: Gengar fires a hex that inflicts direct damage on opponents; however,\
    \ against foes under the influence of malignant status conditions (severe burns, paralysis, body-freezing,\
    \ forcible sleep), the damage is doubled. *Nightmare: Gengar triggers particularly intense nightmares\
    \ in the minds of sleeping organisms, potent enough to drain physical health, for the duration of\
    \ their slumber. ==Gallery== tumblr oled616EfI1uhuflmo1 500.gif tenorj.gif tumblr nnj6ld8JkI1s5rmywo1\
    \ 500.gif tumblr m4hsmrkpJy1rwaejso1 500.gif 1506622415516.gif gengar-gif-18.gif ==Notable Matchups==\
    \ Victories: Xatu (Pok\xE9mon) Xatu's Profile (Base Gengar was used in this battle) Losses: Inconclusive:\
    \ {{discussions}} Category:Characters Category:Species Category:Game Characters Category:Anime Characters\
    \ Category:Pok\xE9mon Category:Ghosts Category:Darkness Users Category:Possession Users Category:Mind\
    \ Users Category:Neutral Characters Category:Poison Users Category:Monsters Category:Intangibility\
    \ Users Category:Mega Pok\xE9mon Category:Temperature Users Category:Absorption Users Category:Regeneration\
    \ Users Category:Immortals Category:Undead Category:Reality Warpers Category:Illusionists Category:Healers\
    \ Category:Enhanced Senses Users"
  source_ids: *id003
