- id: claim-powers-and-abilities-c5158050
  section: abilities
  axis: hax
  text: "Gastly=Superhuman Physical Characteristics, Immortality (Types 3 and 7), Darkness and Shadow\
    \ Manipulation, Enhanced Senses, Statistics Amplification, Statistics Reduction, Intangibility and\
    \ Incorporeality (It is made up of a mixture of gases and souls. They can phase through walls), Possession,\
    \ Curse Manipulation, Shapeshifting, Status Effect Inducement, Illusion Creation (Gastly can create\
    \ illusions of fully evolved Pok\xE9mon. A group of Gastly made an illusion of fire), Reality Warping,\
    \ Perception Manipulation (A group of Gastly once messed with the perception of Team Rocket), Necromancy\
    \ (A Gastly once used its fog to resurrect Pok\xE9mon zombies), Sleep Manipulation, Mind Manipulation,\
    \ Soul Manipulation, Size Manipulation, Poison Manipulation, Absorption of dreams, Healing, Power\
    \ Nullification, Aura (Via Dark Pulse), Offensive Illusion Creation (Via Night Shade), Duplication,\
    \ Flight, and Pseudo-Teleportation, Regeneration (Mid-High; Gastly is composed of gas and has no real\
    \ shape, so it can reform itself), Damage Transferal (Via Destiny Bond), Minor Sealing (Via Mean Look),\
    \ Electricity Manipulation, Fire Manipulation, Ice Manipulation, Invisibility (Gastly is almost completely\
    \ invisible, and can turn itself and other Pokemon invisible), Paralysis Inducement (Its attacks cause\
    \ the 'paused' status in Pok\xE9mon Ranger. Lick can paralyse the enemy), Dynamax, Resistance to Poison\
    \ Moves, Bug, Grass, and Fairy moves, as well as Sleep Manipulation and Mind Manipulation (Gastly\
    \ can no-sell the mind control of an enhanced Drowzee that could control every other Pok\xE9mon on\
    \ an island) and Immunity to being Poisoned and Earth Manipulation (within limitations) |-|Haunter=Same\
    \ as before to a greater exent, plus Life Force Absorption, Light Manipulation, Telekinesis, possibly\
    \ Dimensional Travel (Said to have come from another dimension) |-|Gengar=Same as before to a greater\
    \ extent, sans Regeneration (Mid-High), plus Can absorb heat to lower temperature by 10 degrees Celsius\
    \ and Regeneration (Likely Mid, can regenerate large holes in its body), Stealth Mastery (can disappear\
    \ into shadows for sneak attacks) |-|Mega Gengar= Same but higher, Dimensional Travel (The third eye\
    \ growth enables Mega Gengar to freely observe beings and events across space-time boundaries and\
    \ see into alternate dimensions/universes), can immobilize an enemy's movement by making contact with\
    \ its shadow |-|Gigantamax Gengar=All of Gengar's abilities plus, Gigantamax, Dimensional Travel and\
    \ Death Manipulation (It's mouth is rumored to lead directly to the afterlife, Steals the lives of\
    \ those it catches), Sound Manipulation (Standing in front of its mouth causes one to hear the voices\
    \ of their loved ones), Superior Soul Manipulation, Telekinesis, Ectoplasm Manipulation, and Fear\
    \ Manipulation via Max Terror (Prevents the opponent from switching out or fleeing), Superior Darkness\
    \ Manipulation and Statistics Reduction (target's Sp. Def) via Max Darkness, Superior Mind Manipulation\
    \ via Max Mindstorm (Changes the ground to Psychic Terrain), Forcefield Creation via Max Guard"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
