- id: claim-weaknesses-ea301372
  section: weaknesses
  axis: weakness
  text: "Weak to Water, Grass, and Ice-type moves, though Drought reduces the effectiveness of Water-type\
    \ moves. Is prone to blind rage. Drought can't activate during the heavy rain of Primordial Sea or\
    \ when the mysterious air current of Delta Stream appears | Weak to Ground-type moves and is especially\
    \ weak to Water-type moves, though Desolate Land completely nullifies Water-type moves. Remains prone\
    \ to blind rage Feats: Created an artificial sun that released a beam. Notable Attacks/Techniques:\
    \ *Drought: Base Groudon only. Summons harsh sunlight when it starts to battle. The harsh sunlight\
    \ can strengthen any Fire-type attacks while also weakening any Water-type attacks in the battle;\
    \ it can also allow the move Solar Beam to be used instantly. *Desolate Land: Primal Groudon only.\
    \ Affects weather in the same way as Drought. However, the heat is now so intense that it completely\
    \ nullifies Water-type moves. *Hot Blooded: One of a series of Abilities that appeared in Pok\xE9\
    mon Conquest. It allows Groudon to passively restore health while standing on lava/magma, soil, or\
    \ sand. *Eruption: Groudon launches multiple fiery rocks up into the air from its mouth that rain\
    \ down on the opponent. *Precipice Blades: Groudon's signature move. Groudon manipulates the earth,\
    \ causing multiple spears of earth to stab the opponent that explode upon contact. *Thunder: Groudon\
    \ fires off a massive bolt of electricity from its body that can cause paralysis. Its accuracy is\
    \ increased under rain but decreased under sunny conditions. *Hyper Beam: Groudon charges a black\
    \ and purple orb of energy in its mouth which it then fires off as a beam. Unlike most Pok\xE9mon\
    \ Groudon does not appear to need to recharge afterwards. *Solar Beam: Groudon charges up and fires\
    \ a green beam of solar energy from its mouth. Even under cloudy conditions Groudon can still charge\
    \ up the attack rather quickly. *Flamethrower: Groudon fires off a destructive jet of flames from\
    \ its mouth that can cause burns. *Fissure: Groudon opens up a fissure in the ground to BFR the opponent.\
    \ *Mud Shot: Groudon fires off a stream of mud from its mouth that also reduces the opponent's speed.\
    \ *Rock Tomb: Groudon throws a series of rocks at the opponent which also reduces their speed. *Bulk\
    \ Up: Groudon tenses its muscles to bulk up its body raising its attack and defense. *Rest: Groudon\
    \ falls asleep and heals back up to peak condition. This leaves it asleep for a bit however. *Ancient\
    \ Power: Groudon manipulates nearby rocks with an ancient power and hurls them at the opponent. This\
    \ may raise all of Groudon's stats. *Scary Face: Groudon makes a scary face at the opponent to lower\
    \ their speed. *Earth Power: Groudon causes the ground beneath the opponent to erupt with power. This\
    \ may lower their special defense. *Lava Plume: Groudon torches everything around it to strike all\
    \ of its opponents. It also hits its allies and has a high chance of causing a burn. *Earthquake:\
    \ Groudon sets off an earthquake to strike all of its opponents. This also hits its allies. *Fire\
    \ Blast: Groudon fires off a star-shaped blast of fire that has a chance of causing a burn. *Hammer\
    \ Arm: Groudon hammers down one of its arms. This also lowers Groudon's speed. *Slash: Groudon slashes\
    \ at the opponent with its claws. It has a high chance of dealing critical damage. ==Gallery== Pok\xE9\
    mon-Omega-Rubyh-Alpha-Sapphire-Concept-Art-Battle-Primal-Groudon-Kyogre-72.jpg xy-conflito-primitivo\
    \ (1).png Groudon animation.gif tumblr nlmv4q1SdG1sgdowto2 500.gif 7ad99b36dc7ae0cf3a7a865c7a60dff3b6aec658\
    \ hq.gif tumblr of1q9bhURs1s87y5ho1 500.gif ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ {{Scroll box|content=}} {{discussions}} Category:Characters Category:Game Characters Category:Genderless\
