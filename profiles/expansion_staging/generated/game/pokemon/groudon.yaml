    \ Pok\xE9mon Category:Temperature Users Category:Fire Users Category:Lava Users Category:Monsters\
    \ Category:Electricity Users Category:Weather Users Category:Manga Characters Category:Statistics\
    \ Amplification Users Category:Movie Characters Category:Energy Users Category:Solar Energy Users\
    \ Category:Transformation Users Category:Healers Category:Status Effect Users Category:Explosion Users\
