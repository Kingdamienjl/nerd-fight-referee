- id: weaknesses-causing-multiple-spears-of-earth-to-stab-the-opponent-that-explode-up
  name: 'causing multiple spears of earth to stab the opponent that explode upon contact. *Thunder: Groudon
    fires off a massive b'
  description: "causing multiple spears of earth to stab the opponent that explode upon contact. *Thunder:\
    \ Groudon fires off a massive bolt of electricity from its body that can cause paralysis. Its accuracy\
    \ is increased under rain but decreased under sunny conditions. *Hyper Beam: Groudon charges a black\
    \ and purple orb of energy in its mouth which it then fires off as a beam. Unlike most Pok\xE9mon\
    \ Groudon does not appear to need to recharge afterwards. *Solar Beam: Groudon charges up and fires\
    \ a green beam of solar energy from its mouth. Even under cloudy conditions Groudon can still charge\
    \ up the attack rather quickly. *Flamethrower: Groudon fires off a destructive jet of flames from\
    \ its mouth that can cause burns. *Fissure: Groudon opens up a fissure in the ground to BFR the opponent.\
    \ *Mud Shot: Groudon fires off a stream of mud from its mouth that also reduces the opponent's speed.\
    \ *Rock Tomb: Groudon throws a series of rocks at the opponent which also reduces their speed. *Bulk\
    \ Up: Groudon tenses its muscles to bulk up its body raising its attack and defense. *Rest: Groudon\
    \ falls asleep and heals back up to peak condition. This leaves it asleep for a bit however. *Ancient\
    \ Power: Groudon manipulates nearby rocks with an ancient power and hurls them at the opponent. This\
    \ may raise all of Groudon's stats. *Scary Face: Groudon makes a scary face at the opponent to lower\
    \ their speed. *Earth Power: Groudon causes the ground beneath the opponent to erupt with power. This\
    \ may lower their special defense. *Lava Plume: Groudon torches everything around it to strike all\
    \ of its opponents. It also hits its allies and has a high chance of causing a burn. *Earthquake:\
    \ Groudon sets off an earthquake to strike all of its opponents. This also hits its allies. *Fire\
    \ Blast: Groudon fires off a star-shaped blast of fire that has a chance of causing a burn. *Hammer\
