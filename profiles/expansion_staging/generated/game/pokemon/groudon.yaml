- id: claim-powers-and-abilities-a29471a5
  section: abilities
  axis: hax
  text: "Base= *Superhuman Physical Characteristics *Large Size (Type 0: Groudon is 3.5 meters tall) *Longevity\
    \ (Has lived for Several millions of years) *Earth Manipulation (Stated to have raised lands and expanded\
    \ continentsPok\xE9mon Ruby/Sapphire/Emerald/Omega Ruby/Alpha SapphirePok\xE9mon HeartGold/SoulSilverPok\xE9\
    mon X and Y Can manipulate the earth with moves like Precipice Blades and Earthquake) *Fire Manipulation,\
    \ Magma Manipulation, Light Manipulation, and Heat Manipulation (Groudon can make water and entire\
    \ floods evaporate with it's light and heat. Can create magma to form a path on water. Groudon can\
    \ use fire based moves such as Fire Blast and Eruption) *Limited Absorption (Via Solar Beam which\
    \ the user gathers light for a turn then shoots it out in a bundled beam the next turn) *Statistics\
    \ Amplification (Can tense its muscles to bulk up its body, boosting its Attack and Defense stats\
    \ with Bulk Up, Ancient Power can boost all the users stats) *Statistics Reduction and Social Influencing\
    \ (Can lower a target's speed and Scary Face which frightens the target with a scary face to harshly\
    \ lower its Speed stat. Mud Shot can reduce the target's speed. Hammer Arm has a chance to lower the\
    \ users own speed) *BFR (Fissure which open up a fissure in the ground and drops the target in, removing\
    \ them from the battlefield. Dragon Tail knocks the target away, forcing a different Pok\xE9mon to\
    \ be dragged out in Trainer battles and instantly ending wild battles against a single Pok\xE9mon)\
    \ *Self-Healing and Purification (Type 3; Via Rest which fully restores the user's HP and cures any\
    \ status conditions) *Weather Manipulation (Groudon's Drought ability passively summonsPok\xE9mon\
    \ Sun/Moon/Ultra Sun/Ultra Moon Harsh Sunlight in battle. Caused the suns heat to increase drastically\
    \ which threatened to end all life on earthPok\xE9mon Ruby/Sapphire/Emerald/Omega Ruby/Alpha Sapphire)\
    \ *Transformation (Is capable of Primal Reversion which restores the user to their true power) Resistance\
    \ to: *Poison Manipulation, Acid Manipulation, and Earth Manipulation (Only takes 1/2 damage from\
    \ Poison-Type and Rock-Type moves) *Fire Manipulation, Heat Manipulation, and Magma Manipulation (Slept\
    \ underground in magma after its battle with KyogrePok\xE9mon Diamond/Pearl/Platinum/Brilliant Diamond/Shining\
    \ PearlPok\xE9mon Black/White/Black 2/White 2. Can easily walk through lava in the Cave of Origin.\
    \ Likely unaffected by the increased temperature from the sun) |-|Primal Groudon= *Greater Fire Manipulation\
    \ and Magma Manipulation (The energy that fills Primal Groudon pours forth as magma, and it burns\
    \ with such an extreme temperature that its body is always shimmering with the haze of its heatOmega\
    \ Ruby and Alpha Sapphire website) *Greater Weather Manipulation, Temperature Manipulation, and limited\
    \ Power Nullification (Primal Groudon's ability, Desolate Land creates extremely harsh sunlight which\
    \ instantly evaporates Water-Type moves. Desolate Land cause any attempts to use other weather-modifying\
    \ moves to fail) Resistance to: *Steel-Type, Bug-Type, and Fairy-Type (Only takes 1/2 damage from\
    \ Steel-Type, Bug-Type, and Fairy-Type attacks)"
