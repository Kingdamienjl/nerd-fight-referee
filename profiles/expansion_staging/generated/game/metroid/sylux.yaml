- id: claim-powers-and-abilities-6129a600
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery (Noted to be a resourceful tracker and a
    deadly sharpshooterMetroid Prime: Hunters (2006) - Manual), Radiation Manipulation, Homing Attack
    and Energy Absorption (Can fire a high-density beam of neutrinos that automatically targets nearby
    foes with the Shock Coil, and he can even drain enemies'' health to heal his own with itMetroid Prime
    Hunters (2006) - Logbook, Shock Coil), Transformation (Sylux can transform into Lockjaw, a small form
    similar to Samus'' Morph Ball, which attacks by laying explosive trip wiresMetroid Prime: Hunters
    (2006) - Logbook, Lockjaw), Acrobatics (Shown to elegantly dive into Lockjaw form), Flight and Teleportation
    (Sylux'' gunship, the Delano 7, is capable of interstellar warp travelMetroid Prime 3: Corruption
    (2007) - Ending), Energy Projection (The Delano-7 is armed with an energy autocannon. Shown to utilize
    an energy weaponMetroid Prime Hunters (2006) - Intro), Summoning (Can remotely call the Delano-7 and
    make it assist him in combatMetroid Prime Hunters (2006) - Vesper Defense Outpost), Nanotechnology
    (The Universal Ammunition for Sylux'' Shock Coil is nanotechnology that adapts at the molecular level
    to fit almost any required caliber and compositionMetroid Prime Hunters (2004) - Logbook, Small/Medium/Large
    UA Pack), Stealth Mastery (Infiltrated a Galactic Federation Base to steal a Metroid Egg without ever
    being spottedMetroid Prime: Federation Force (2016) - Post-Credits Scene), Resistance to Temperature
    Manipulation (Can withstand attacks from the Magmaul, which fires concentrated magma that burns at
    temperatures in the thousands of degreesMetroid Prime Hunters Nintendo Player''s Guide, and the Judicator,
    which shoots out plasma at near-absolute zero temperaturesMetroid Prime: Hunters (2006) - Logbook,
    Judicator), Electricity Manipulation (Can survive being hit by the Volt-Driver, a weapon that emits
    multi-terawatt, high voltage electricityMetroid Prime: Hunters (2006) - Logbook, Volt Driver), Radiation
    Manipulation (Can withstand attacks from the Shock Coil, which fires a high-density beam of neutrinos
    powerful enough to harm Samus AranMetroid Prime Hunters (2006) - Logbook, Shock Coil), possibly Life
    Absorption (While Gorea killed many Alimbics by devouring their life force, SyluxMetroid Prime Hunters
    (2006) - Alimbic Lore, Alimbic War 04, was only rendered unconscious by this, recuperating quickly
    enough to escape the destruction of the areaMetroid Prime Hunters (2006) - Oubliette)'
