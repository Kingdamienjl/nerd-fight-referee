  section: weaknesses
  axis: weakness
  text: 'The inside of Kraid''s mouth is far more vulnerable to damage than the rest of his body and so
    whenever he needs to breathe he blocks attacks directed at it with his claws. Attacking his eyes can
    cause him to open his mouth. Notes: It is unknown whether the Kraid in Metroid Dread is the same as
    the one in previous games, or rather another member of his species. While he is referred to in game
    as Kraid through the Mission Log and Maps, Metroid Dread Report Volume 6 states that he is "a giant
    monster that appears to be Kraid, a beast Samus has fought in previous games." ==Gallery== Kraid Metroid
