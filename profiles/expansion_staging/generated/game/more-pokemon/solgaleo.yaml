- id: claim-weaknesses-4ef5f249
  section: weaknesses
  axis: weakness
  text: 'Solgaleo takes additional damage from Fire, Dark, Ghost, and Ground-type attacks. Searing Sunraze
    Smash can only be used once per battle. Flare Blitz and Wild Charge cause recoil damage. Notable Attacks/Techniques:
    *Full Metal Body: Solgaleo is immune to the effects of abilities or attacks that lower its stats.
    *Sunsteel Strike: Solgaleo''s signature move. Solgaleo envelops itself in energy and charges at its
    opponent, ramming them with the force of a meteor and ignoring abilities that would impede or stop
    its charge. **Searing Sunraze Smash: Solgaleo''s signature Z-Move. While ignoring the target''s Ability,
    Solgaleo charges at the enemy and rolls into a ball with full force after transporting them to Ultra
    Space. *Splash: Solgaleo hops around which does absolutely nothing. *Teleport: Solgaleo teleports
    elsewhere. *Cosmic Power: Solgaleo absorbs a cosmic power to boost its defense and special defense.
    *Wake-Up Sl'
  source_ids: *id003
  decisive: false
