  name: 'and speed. It can also be used to restore those who have perished to Yveltal''s Oblivion Wing.
    However it cannot restore '
  description: 'and speed. It can also be used to restore those who have perished to Yveltal''s Oblivion
    Wing. However it cannot restore them if too much time has passed since they perished. *Aurora Beam:
    Xerneas fires a multicolored beam of energy from its antlers. It may lower the opponent''s attack.
    *Horn Leech: Xerneas jabs the opponent with its antlers. This also restores its health by half of
    the damage dealt. *Gravity: Xerneas increases gravity in the area forcefully grounding those in the
    air and preventing them from taking off. *Heal Pulse: Xerneas releases a pulse of energy that heals
    whoever Xerneas chooses. *Aromatherapy: Xerneas releases a soothing scent that cures itself and its
    allies of status conditions. *Ingrain: Xerneas roots itself in place to gradually restore health over
    time. *Take Down: Xerneas recklessly charges the opponent. This also causes some recoil damage to
    Xerneas. *Light Screen: Xerneas sets up a protective psychic screen around itself and its allies that
    halves the damage of special attacks. *Moonblast: Xerneas draws power from the moon into a sphere
    and fires it at the opponent. It may also lower their special attack. *Megahorn: Xerneas harshly stabs
    its opponents with its antlers. *Night Slash: Xerneas coats its antlers with a dark energy and slashes
    at the opponent with the them. It has a high chance of dealing critical damage. *Psych Up: Xerneas
    copies the opponent''s stat changes. *Misty Terrain: Xerneas fills the terrain with a mist that protects
    all those who are grounded from status conditions and halves the damage of Dragon-type moves. * Nature
    Power: Xerneas draws power from nature and attacks. The move it turns into depends upon the current
    environment. Inside a building it becomes Tri Attack. In caves and mountains'
