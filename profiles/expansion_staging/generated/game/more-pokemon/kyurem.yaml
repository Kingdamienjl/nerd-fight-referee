- id: claim-weaknesses-ab0ba529
  section: weaknesses
  axis: weakness
  text: "Vulnerable to Dragon, Rock, Fairy, Steel, and Fighting-type moves. The powerful freezing energy\
    \ generated inside its body can freeze its own body when leaked out. Outrage leaves Kyurem confused\
    \ although it will eventually snap out of it. The Life Orb takes 10% of Kyurem's total health for\
    \ every successful offensive hit. Dragon Rage and Endeavor are the exceptions to this. Notable Attacks/Techniques:\
    \ *Pressure: Base Kyurem only. Kyurem makes the opponent expend twice as much energy, tiring them\
    \ out twice as quickly. *Turboblaze: White Kyurem only. Moves can be used on the target regardless\
    \ of its Abilities. *Teravolt: Black Kyurem only. Moves can be used on the target regardless of its\
    \ Abilities. *Glaciate: Normal Kyurem only. Kyurem attacks by blowing freezing cold air at opposing\
    \ Pok\xE9mon. This lowers their Speed stat. *Ice Burn: White Kyurem only. Kyurem surrounds itself\
    \ in a cold sphere of reddish energy that it then fires off as reddish-purple beams of energy. This\
    \ may leave the target with a burn or freeze them solid. *Fusion Flare: White Kyurem only. Kyurem\
    \ fires off a massive sphere of flames at the opponent. This move\u2019s power is increased when influenced\
    \ by Fusion Bolt or Bolt Strike. Should Kyurem somehow be frozen in spite of its immunity it will\
    \ be able to thaw out. *Freeze Shock: Black Kyurem only. Kyurem charges up a massive electrically\
    \ charged sphere of ice before firing it off. This may also leave the target with paralysis or freeze\
    \ them and part of the surrounding ground. *Fusion Bolt: Black Kyurem only. Kyurem surrounds itself\
    \ in a giant sphere of light blue electricity and slams into the opponent. This move\u2019s power\
    \ is increased when influenced by Fusion Flare or Blue Flare. *Ice Beam: Kyurem fires off an icy blue\
    \ beam of energy that may freeze the opponent. It can also be used to create ice in general and freeze\
    \ water. *Shadow Claw: Kyurem covers its claws in a shadowy energy and slashes at the opponent. This\
    \ move has an increased chance to deal critical damage. *Dragon Pulse: Kyurem fires off a multicolored\
    \ beam of dragon-shaped energy. *Icy Wind: Kyurem blows a chilling wind at the opponent that also\
    \ lowers their speed. *Dragon Rage: Kyurem fires off a blue flame of energy that deals consistent\
    \ damage. *Sheer Cold: Kyurem attacks by freezing the opponent to absolute zero temperatures. As an\
    \ Ice-type, its accuracy is increased for Kyurem. *Dragon Breath: Kyurem fires off a hazy purple flame\
    \ of energy that can cause paralysis. *Scary Face: Base Kyurem only. Kyurem makes a scary face at\
    \ the opponent, lowering their speed. *Slash: Kyurem slashes at the opponent with its claws. It has\
    \ a high chance of dealing critical damage. *Imprison: Using a psychic power, Kyurem creates a seal\
    \ on itself that prevents its opponents from using any moves they share with it. *Endeavor: Kyurem\
    \ hits the opponent with a physical blow that reduces their health to match its own. *Blizzard: Kyurem\
    \ blows a blizzard at the opponent, possibly freezing them. Its accuracy is increased under hail.\
    \ *Outrage: Kyurem attacks and rampages for a while. If there are multiple opponents each series of\
    \ attacks will be directed to one at random. The attack leaves Kyurem confused afterwards. *Ancient\
    \ Power: Kyurem manipulates nearby rocks with an ancient power and hurls them at the opponent. This\
    \ may also raise all of its stats. *Hyper Voice: Kyurem lets out an extremely loud roar to damage\
    \ the opponent. It also bypasses moves like Substitute. *Noble Roar: Kyurem lets out a noble roar\
    \ to intimidate the opponent which in turn lowers their offensive stats. *Shadow Ball: Kyurem fires\
    \ a purple ball of energy which may lower the target's special defense. *Freeze-Dry: Kyurem rapidly\
    \ cools its target, potentially freezing them. Unlike other Ice-type moves, it's super effective on\
    \ Water-types. ==Gallery== 5269d1724cb93.jpg tumblr or1mv3mB5k1tlzsj9o2 500.gif TZ2C7N.jpg Tumblr\
    \ n08l4ylt5A1rxsnrxo1 500.gif Tumblr onapubGWtL1tgjlm2o1 500.gif Tumblr n08la0c81y1rxsnrxo1 500.gif\
    \ ==Notable Matchups== Victories: Rayquaza (Pok\xE9mon) Rayquaza's Profile (Both Black and White Kyurem\
    \ were used. Rayquaza could Mega Evolve) Losses: Inconclusive: {{Discussions}} Category:Characters\
    \ Category:Pok\xE9mon Category:Absolute Zero Users Category:Anime Characters Category:Balance Users\
    \ Category:Berserkers Category:Bodily Weaponry Users Category:Breath Attack Users Category:Clairvoyance\
    \ Users Category:Darkness Users Category:Dragons Category:Durability Negation Users Category:Earth\
    \ Users Category:Electricity Users Category:Fire Users Category:Flight Users Category:Fusionism Users\
    \ Category:Fusions Category:Game Characters Category:Ice Users Category:Legendary Pok\xE9mon Category:Manga\
    \ Characters Category:Monsters Category:Movie Characters Category:Paralysis Users Category:Power Nullification\
    \ Users Category:Rage Users Category:Resistance Negation Users Category:Sound Users Category:Statistics\
    \ Amplification Users Category:Statistics Reduction Users Category:Status Effect User"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
