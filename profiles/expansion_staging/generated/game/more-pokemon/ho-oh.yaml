- id: claim-weaknesses-bb28ed08
  section: weaknesses
  axis: weakness
  text: 'Ho-Oh is vulnerable against Water and Electric-type attacks and is especially vulnerable to Rock-type
    moves. Using Burn Up removes its Fire-typing which removes its Water-type weakness in exchange for
    an Ice-type weakness and lessens its Rock-type weakness and removes its burn immunity. Becomes weak
    to Ground-type moves if forcibly grounded before it uses Burn Up. Brave Bird and Flare Blitz deal
    recoil damage. Notable Attacks/Techniques: * Pressure: Ho-Oh makes the opponent expend twice as much
    energy, tiring them out twice as quickly. * Regenerator: Ho-Oh restores 33.3% of its health when away
    from combat for an extended period. * Sacred Fire: Ho-Oh''s signature move. Ho-Oh fires off a beautiful
    mystical flame that has a high chance of causing a burn. Should Ho-Oh be frozen it will be able to
    thaw out. * Whirlwind: Ho-Oh flaps its wings creating a whirlwind to blow the opponent away. * Weather
    Ball: Ho-Oh gathers a ball of energy that is influenced by the weather. Its Type changes depending
    on the weather. The weather also doubles its power. Normal-type in neutral weather. Fire under intense
    sunlight. Water in rain. Ice in hail. Rock in a sandstorm. * Gust: Ho-Oh creates a damaging gust of
    wind. * Brave Bird: Ho-Oh covers its body in a blue flame-like energy and charges at the opponent
    with extreme force. This causes recoil damage to Ho-Oh as well. * Extrasensory: Ho-Oh attacks with
    a telekinetic force that has a chance of causing the opponent to flinch. Its power doubles if the
    opponent has made themselves smaller such as through Minimize. * Sunny Day: Ho-Oh clears the skies
    making it bright and sunny. The increased temperatures powers up Fire Type moves and weakens Water
    Type moves. It also allows Solar Beam to be charged up more quickly and decreases the accuracy of
    Thunder and Hurricane. * Fire Blast: Ho-Oh fires off a powerful star-shaped blast of fire that can
    cause burns. * Punishment: Ho-Oh hits the opponent with a dark attack that increases in power the
    more the opponent boosts their stats. * Ancient Power: Ho-Oh manipulates nearby rocks with an ancient
    power and hurls them at the opponent. This may also raise all of Ho-Oh''s stats. * Safeguard: Ho-Oh
    creates a barrier around itself and its allies that protects against status conditions. * Recover:
    Ho-Oh heals any injuries it has received by up to half of its maximum health. * Future Sight: Ho-Oh
    prepares a psychic blast that hits the opponent later on in the fight. It ignores moves like Protect
    and Detect. * Natural Gift: Ho-Oh attacks by drawing power from its held berry. Its Type and power
    are dependent upon the berry in question. This also consumes the berry. * Calm Mind: Ho-Oh calms its
    mind boosting its special attack and special defense. * Sky'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
