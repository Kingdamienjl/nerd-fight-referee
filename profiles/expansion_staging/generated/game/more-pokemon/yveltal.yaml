- id: weaknesses-and-supplementary-means-such-as-lifting-the-target-in-question-or-sim
  name: 'and supplementary means such as lifting the target in question or simply blasting them. It may
    also lower their special '
  description: 'and supplementary means such as lifting the target in question or simply blasting them.
    It may also lower their special defense. *Hurricane: Yveltal flaps its wings to create a hurricane
    which is blown in the opponent''s direction and may cause confusion. Its accuracy is increased under
    rain but decreased under sunny conditions. *Dark Pulse: Yveltal fires off a dark pulse of energy which
    can cause the opponent to flinch. *Razor Wind: Yveltal fires off literal blades of wind at the opponent.
    It can hit multiple opponents. *Taunt: Yveltal taunts the opponent which forces them to use nothing
    but offensive attacks. *Roost: Yveltal roosts to heal itself. This leaves Yveltal grounded while it
    heals. *Snarl: Yveltal lets out a dark damaging snarl which also lowers the opponent''s special attack.
    *Double Team: Yveltal creates illusory copies of itself. This also increases its evasiveness. *Disable:
    Yveltal disables the last move used by the opponent preventing its use. *Air Slash: Yveltal fires
    off blades of compressed air at the opponent. It may also cause the opponent to flinch. *Foul Play:
    Yveltal attacks the opponent using their own physical power against them. *Dragon Rush: Yveltal covers
    itself in a draconic energy and then rushes the opponent possibly causing them to flinch. *Focus Blast:
    Yveltal focuses some energy into a sphere which it then fires at the opponent. It may also lower the
    opponent''s special defense. *Sucker Punch: Yveltal sucker punches the opponent before they can attack.
    It fails if they aren''t going to use an offensive move. *Sky'
