- id: claim-weaknesses-c031005d
  section: weaknesses
  axis: weakness
  text: "Lunala will take additional damage from Ghost and Dark Type attacks. Menacing Moonraze Maelstrom\
    \ can only be used once per battle. Notable Attacks/Techniques: *Shadow Shield: Lunala is able to\
    \ greatly reduce the damage taken from a single attack for as long as it is at peak condition. *Moongeist\
    \ Beam: Lunala's signature move. Lunala fires an ominous beam of light that ignores any abilities\
    \ that would stop or nullify it. **Menacing Moonraze Maelstrom: Lunala's signature Z-Move. While ignoring\
    \ the target's Ability, Lunala fires six ominous beams and concentrates them all at once at the opponent\
    \ after transporting them to Ultra Space. *Splash: Lunala hops around doing absolutely nothing at\
    \ all. *Teleport: Lunala teleports elsewhere. *Cosmic Power: Lunala absorbs a cosmic power to boost\
    \ defense and special defense. *Hypnosis: Lunala hypnotizes the opponent into falling asleep. *Confusion:\
    \ Lunala attacks with a telekinetic force similar to Psychic that can cause confusion. *Night Shade:\
    \ Lunala attacks with a ghostly attack that deals consistent damage. *Confuse Ray: Lunala fires a\
    \ ray that causes confusion. *Air Slash: Lunala fires blades of compressed air that can cause the\
    \ opponent to flinch. *Shadow Ball: Lunala fires off a shadowy black and purple ball of energy that\
    \ can lower the opponent's special defense. *Moonlight: Using the power of the moon, Lunala heals\
    \ itself. The amount of health it restores increases under sunny conditions but decreases under rain,\
    \ hail, sandstorms, and other weather conditions. *Night Daze: Lunala lets out a dark shockwave that\
    \ can lower the opponent's accuracy. *Magic Coat: Lunala reflects any non-offensive moves, such as\
    \ Leech Seed or Toxic, back at the opponent. *Moonblast: Drawing power from the moon, Lunala fires\
    \ off a sphere of energy at the opponent. It may also lower the opponent's special attack. *Dream\
    \ Eater: Lunala consumes the opponent's dream dealing damage and healing Lunala by half of the damage\
    \ dealt. *Phantom Force: Lunala vanishes somewhere before reappearing and striking the opponent ignoring\
    \ moves like Protect, Detect, and Spiky Shield. *Wide Guard: Lunala sets up a forcefield that protects\
    \ it and its allies from widespread attacks. *Hyper Beam: Lunala fires off a destructive beam of energy.\
    \ It may have to rest afterwards, but given that the likes of Kyogre and Groudon don't need to rest\
    \ after using it Lunala may not need to either. *Swift: Lunala fires star-shaped homing projectiles.\
    \ ==Gallery== Sample e2c125421da4cd4bad5a6deb07f2adff.jpg Lunala...png lunala..png Lunala Pokemon\
    \ TCG Sun & Moon.png ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters\
    \ Category:Pok\xE9mon Category:Absorption Users Category:Anime Characters Category:Attack Reflection\
    \ Users Category:Cosmic Awareness Users Category:Darkness Users Category:Dream Users Category:Energy\
    \ Users Category:Flight Users Category:Forcefield Users Category:Game Characters Category:Genderless\
    \ Characters Category:Ghosts Category:Healers Category:Intangibility Users Category:Legendary Pok\xE9\
    mon Category:Monsters Category:Portal Users Category:Power Nullification Users Category:Psychics Category:Role-playing\
    \ Characters Category:Space Users Category:Statistics Amplification Users Category:Statistics Reduction\
    \ Users Category:Status Effect Users Category:Telekinesis Users Category:Teleportation Users Category:Ultra\
    \ Beasts Category:Video Game Characters Category:Bats Category:Homing Attack Users Category:Wing Users\
    \ Category:Durability Negation Users Category:BFR Users Category:Dimensional Travel Users Category:Mind\
    \ Users Category:Possessed/Brainwashed Characters"
