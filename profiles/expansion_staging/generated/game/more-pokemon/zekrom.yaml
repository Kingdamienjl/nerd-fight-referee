  description: 'Zekrom creates a seal on itself that prevents the opponent from using any moves they share
    with it. *Hyper Voice: Zekrom lets off an extremely loud roar that damages the opponent. It also bypasses
    moves like Substitute. *Crunch: Zekrom coats its fangs in a dark energy and crunches the opponent
    with them. It may also lower their defense. *Thunderbolt: Zekrom fires off a bolt of electricity that
    may paralyze the opponent. *Dragon Rage: Zekrom fires off a blue flame of energy that deals consistent
    damage. *Slash: Zekrom slashes at the opponent with its claws. It has a high chance of dealing critical
    damage. *Outrage: Zekrom attacks and rampages for a while. If there are multiple opponents each series
    of attacks will directed to one at random. It leaves Zekrom confused afterwards. *Ancient Power: Zekrom
    manipulates nearby rocks with an ancient power and hurls them at the opponent. This may also raise
    all of its stats. *Noble Roar: Zekrom lets out a noble roar which intimidates the opponent causing
    their offenses to drop. *Giga Impact: Zekrom surrounds itself with energy and tackles the foe with
    extreme force. Given that the likes of Kyogre and Groudon lack the need to recharge after Hyper Beam'
