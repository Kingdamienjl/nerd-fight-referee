- id: claim-weaknesses-ec2a32cb
  section: weaknesses
  axis: weakness
  text: 'None Notable Notable Attacks/Techniques: *Belnades Clan: Sypha is a member of the Belnades Clan,
    a renowned family of legendary witches. They are also vampire hunters, and close allies of the Belmont
    Clan, a bond that began with Sypha and Trevor''s own matrimony. Ever since, the Belnades have haunt
    and destroyed the forces of the night with their magic. *Belnades Magic: The Belnades Clan possess
    incredible magical powers, a trait innate to her bloodline which began with Sypha herself. Sypha was
    born into a family of witches, and was taught the ways of witchcraft by her elder sisters. When her
    family was hunted down and executed by the Church, Sypha would escape her fate, and ironically be
    adopted by the priests of a monastery. There, she was trained in the holy arts. Finally, as an adult
    Sypha would form a pact with the spirits of nature, gaining control over the elemental forces. As
    such, Sypha became an unmatched witch with mastery over nearly all forms of magic, and her power would
    be passed down through the Belnades bloodline. **Holy Flames: Sypha summons her Grimoire and channels
    her magical energies through her left arm, pushing her palm forward and releasing a wide and prolonged
    burst of purifying flames. **Triple Blaze: A variation of the former attack. Rather than releasing
    one focused blast of flames, Sypha instead channels her magic and with a swipe of her hand shoots
    three fireballs at her foe. **Frozen Crysta'
  source_ids: *id003
  decisive: false
  status: unverified
