- id: claim-standard-equipment-e0e04baa
  section: equipment
  axis: equipment
  text: '*Belnades Staff: The Belnades Staff, also known as the Wallachia Staff, is the Heirloom Weapon
    of the Belnades Clan, wielded by various witches throughout the centuries. Though unimpressive as
    an offensive weapon when compared to the Belmont''s Vampire Killer, the Belnades Staff is a incredibly
    potent magical tool, through which Sypha channels her magical energies and weaves powerful spells.
    *Grimoire: As a witch of the Belnades Clan, Sypha often carries a large ancient grimoire with her,
    through which she can cast numerous spells and chants, both offensive and defensive. In combat, Sypha
    typically summons the tome with her power, which materializes floating in the air above her hand,
    and automatically opens itself on the proper page as she speaks the magic words.'
