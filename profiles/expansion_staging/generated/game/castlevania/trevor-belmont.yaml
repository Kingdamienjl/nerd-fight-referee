- id: claim-standard-equipment-20d1eae4
  section: equipment
  axis: equipment
  text: 'File:TB1.gif|Trevor''s daggers File:TB4.gif|Trevor''s cross File:TB5.gif|Trevor''s holy water
    File:TB8.gif|Trevor''s axe *The Vampire Killer: The Vampire Killer is the legendary Heirloom Whip
    of the Belmont Clan, which has been wielded by several heroes throughout the centuries in their quests
    to stop the Dark Lord Dracula. The Vampire Killer is intrinsically connected to the Belmont Bloodline,
    and only a member of their clan can wield it. If one who isn''t a Belmont attempts to wield it, the
    whip will simply slowly drain their life away. Long ago, it was known simply as the Whip of Alchemy,
    and was a much weaker magical weapon developed by the alchemist Rinaldo Gandolfi. The Whip was transformed
    into its current state with the sacrifice of Sara Trantoul, betrothed of Leon Belmont. Sara had been
    cursed with vampirism, though her heart was still pure. Through a ritual, her soul was infused within
    the whip, allowing the weapon to awaken to its true potential. Empowered by a soul both tainted and
    pure, the Vampire Killer is simultaneously a Holy and Vampiric Weapon, and its power is lethal to
    all demonic entities. The Vampire Killer is able to nullify or reflect Magic and projectiles with
    its touch alone, it also weakened Dracula''s powers so much that he was unable to resurrect himself
    or use his powers to escape for several years. **Flame Whip: Trevor channels elemental magic through
    the Vampire Killer, making it ignite with burning fire. **Ice Whip: Trevor channels elemental magic
    through the Vampire Killer, surrounding it with a cold air. The whip then becomes capable of freezing
    its targets on contact **Thunder Whip: Trevor channels elemental magic through the Vampire Killer,
    causing an electrical current to run through its extension. **Wind Whip: Trevor channels elemental
    magic through the Vampire Killer, giving it the power of the winds. The whip obtains a green glow
    as a result. **Holy Whip: Trevor channels holy magic through the Vampire Killer, causing it to become
    particularly deadly to the creatures of the night. **Abyss Whip: Trevor channels dark magic through
    the Vampire Killer, giving it the power of The Abyss. *Sub'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
