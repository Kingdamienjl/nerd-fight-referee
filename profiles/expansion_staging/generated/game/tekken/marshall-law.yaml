- id: claim-weaknesses-9b0d9ea2
  section: weaknesses
  axis: weakness
  text: 'He likely tends to forfeit a fight if bribed. Notable Attacks/Techniques: *Somersault Kick: Law
    performs his signature somersault move. *Dragon''s Tail: Law sweeps the opponent legs, he can follow
    up this move with his somersault kick. *Dragon''s Descent: Law jumps and crushes the opponent with
    his feet. *Fake Step: Law assumes a stance which enables him to dodge the opponent attack, in this
    stance he can follow up with a punch, kick, uppercut or knock the opponent away. *Rage Art: Law punches
    the opponent in the stomach, then follows up with a powerful Dragon Judgement, pauses and finishes
    with a Dragon Flight to the face. ==Gallery== File:Marshall-stance-t2.png|Tekken 2 Law. File:TK4 Law.png|Tekken
