    laws of time. In practice, this is the reason why the likes of Fire God Liu Kang was unaffected by
    his past self's injuries and why Dark Raiden was erased when his past self was brought forth into
    the timeline), Air Manipulation (Fujin has mastery over the element of wind, allowing him to manipulate
    it in both offensive, defensive, and other methods that specializes in other areas. Can manipulate
    the air inside one's lungs, ignoring durability), Flight (Can freely move through the air in different
    ways, from levitating himself and walking on air to true flight), Forcefield Creation (Can create
    wind barriers for offense and defense. Offensively, he uses them to ricochet his bolts. Defensively,
    he uses them to block attacks), Attack Reflection (Can deflect attacks back to the attacker with a
    blast of wind), Healing (Only with Jinsei essence, which he can manipulate to heal others with a touch),
    Power Bestowal (Can bestow a limited form of flight to his allies), Social Influencing (Stated to
    be charismatic and demonstrates this by convincing Future Jax [who was convinced by Kronika to fight
    for her] to leave her side and rejoin the forces of good)
  source_ids: *id003
