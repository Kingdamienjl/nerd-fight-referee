    senses, especially hearing), Extrasensory Perception (Can sense and interact with the invisible Spirit
    Realm and its ghostly inhabitants. Somehow sensed Shinnok once he was trapped inside his own amulet.
    Can sense hidden runes), Acrobatics (Surface Running. Can run up on walls before leaping off of it),
    Magic (Has some knowledge of magic, as he was able to recite an incantation to open a mystical portal
    leading to the Sky Temple), Flight (Restricted flight), Telekinesis (Can manipulate opponents and
    objects from afar. His telekinesis is potent enough to project images of himself to attack from a
    distance), Summoning (When his sword is shattered, the demonic spirits trapped in his sword can be
    summoned by Kenshi to assist him in kombat. Some attack animations from the Possessed variation imply
    that Kenshi is the one being possessed by the demons), Teleportation (Can somehow teleport himself
    over short distances), Telepathy (Can read someone's mind as well as communicate his own thoughts
    to others), Likely has Sense Manipulation (His son Takeda inherited his telepathic abilities from
    him, which includes the ability to overload someone's senses at close range to render them unconscious)
  source_ids: *id003
  decisive: true
