- id: claim-weaknesses-623e56d1
  section: weaknesses
  axis: weakness
  text: 'Axl is a bit cocky and reckless. Has a tendency to drag out fights to enjoy them. Rather whiny
    and a reflexive thinker. Transformation time is usually limited in-game (though this is likely exaggerated
    for gameplay purposes and may be a non-issue considering how much time he spends transformed between
    cutscenes). Certain Special Weapons can only be used with specific guns, forcing Axl to switch weaponry
    to use them which can be difficult during combat. Special Weapons have a limited amount of ammunition
    Notable Attacks/Techniques: A-Trans: By accessing the DNA of a Reploid he''s defeated and absorbed
    or used his Copy Shot ability on, he''s able to take their form and use any of their abilities. For
    example, copying Silver Horn would allow him to generate tidal waves. He was initially limited to
    Reploids his size, but later grew past this limitation by Command Mission. For gameplay reasons he''s
    limited to one attack before reverting (Command Mission was a Turn-Based RPG), but it''s highly likely
    that he''s able to remain in a form longer (he greeted X while disguised and presumably undercover
    for an extended period of time and frequently infiltrated other facilities during his tenure as a
    member of Red Alert). Alternatively, he can simply use the opponent''s abilities, such as their weapons
    or their signature traits (i.e. copying a Kyuun B will simply increase his movement speed). A full
    list of Axl''s Weaponry and abilities can be found here. * Stealth Mode: Axl can turn himself completely
    invisible for a short period of time. During this time, he is completely invulnerable to oncoming
    attacks from Reploids similar to him in power with a few exceptions. Conversely, this also means that
    Axl cannot be targeted with support affects. As Axl''s "Hyper Mode", his firepower is doubled during
    this time, but due to the stealthy nature of this ability his speed is reduced significantly. In addition,
    the stealth and invulnerability provided by this form gives him ample time to look for his opponent''s
    weak points, greatly improving his chances of striking critical spots for additional damage. === Notable
    Transformations === *Depth Dragoon: A seahorse-like knight who controls thunder and lightning, he
    specializes in boosting his own parameters before assailing his foes with destructive lightning attacks
    and his trusty sword and shield. He can also control gravity and electromagnetism to hold foes in
    place and destroy their internal systems. *Mach Jentra: A bird-like Reploid with command over fire,
    he darts out of the way of most attacks with his high-speed flight capabilities and can burn foes
    with the "Flames of Gehenna". He can also summon robot soldiers called Preons to his position as well
    as restrain targets with a special adhesive that drains the energy from weapons systems. He can also
    stun foes with a special attack that pierces through most shields and armor. *Mad Nautilus: A massive
    Reploid modeled after a Nautilus, he''s a mad scientist that can inflict a wide variety of status
    effects on his opponents, rendering them berserk, paralyzed, blinded, or infected with a virus. In
    addition, he can also pierce through forcefields, fire powerful energy beams, and increase gravity
    to crush his foes. *Ninetai'
