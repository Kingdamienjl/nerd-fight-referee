    \ light beams to teleport and travel across dimensions) |-|Abilites= *Stealth Mastery *Vehicular Mastery\
    \ *Fire Manipulation *Electricity Manipulation *Absolute Zero & Ice Manipulation *Earth Manipulation\
    \ *Water Manipulation *Air Manipulation *Restricted flight *Statistics Amplification *Damage Reduction\
    \ & Invisibility (in Hyper Mode) *Shapeshifting & Power Mimicry (With his Copy Chip, Axl can transform\
    \ into the various Reploids and Mechaniloids he's defeated and absorbed and gain their respective\
