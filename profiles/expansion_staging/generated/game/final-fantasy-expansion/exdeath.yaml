  intelligence:
    text: Exdeath is a tremendously powerful and feared warlock. As dastardly as he is cruel, he possesses
      a massive repository of powerful spells due to being the amalgamation of hundreds of evil souls.
      To this end, he was able to manipulate the heroes into revealing the Crystals locations, allowing
      him to shatter them and thus summon the power of the Void. In combat he slings a variety of powerful
      spells at a distance while staggering would-be aggressors with barriers and punishing them for their
      insolence. However, his success has also left him extremely arrogant, thus leading to his temporary
      defeat at the hands of the Warriors of Dawn and later Galuf alone.
