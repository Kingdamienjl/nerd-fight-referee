  text: Exdeath is a tremendously powerful and feared warlock. As dastardly as he is cruel, he possesses
    a massive repository of powerful spells due to being the amalgamation of hundreds of evil souls. To
    this end, he was able to manipulate the heroes into revealing the Crystals locations, allowing him
