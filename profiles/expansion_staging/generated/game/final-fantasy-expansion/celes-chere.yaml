- id: claim-powers-and-abilities-c1da3292
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Summoning, Extrasensory Perception (Mages have shown to
    naturally possess thisFinal Fantasy IV: The After Years), Magic, Conceptual Manipulation (Type 2),
    and Space-Time Manipulation (Magic is shown in the novels to remove concepts and warp space and time
    itself, like the Devil''s road, which the concept of time was lost,Final Fantasy IV Novel 1, chapter
    5, page 199 and time and space were twisted to the pointFinal Fantasy IV: The After Years Novel, chapter
    1, page 67 the past, present and futureFinal Fantasy IV: The After Years Novel, chapter 1, page 73
    existed as oneFinal Fantasy IV: The After Years Novel, chapter 3, page 147), Law Manipulation (Magic
    is stated to rewrite the natural order of thingsFinal Fantasy IV Novel 1, chapter 5, page 198), Subjective
    Reality (Magic,Final Fantasy IV Novel 1, chapter 1, page 29 in its basest form,Final Fantasy IV Novel
    1, chapter 3, page 107 is projecting one''s innerFinal Fantasy IV: The After Years Novel, chapter
    2, page 109 mind onto realityFinal Fantasy IV: The After Years, and is powered by intelligence and
    mental strength), Power Modification (Including Duplication, Fusionism, Statistics Amplification,
    Size Manipulation, Homing Attack, Danmaku, Aura, Breath Attack, and Energy Manipulation, Magic users
    across the games have consistently shown the ability to manipulate the shape and properties of their
    own magical abilities, with even higher tiers of spells simply being considered stronger versions
    of the same basic ability), Non-Physical Interaction (Magic as a whole is shown to affect a wide variety
    of different beings, from intangible/immaterial beings to non corporeal beings, to abstract concepts
    like Chronodia, who''s the flow of time itself Final Fantasy I, to Nonexistent beings like Exdeath
    and Cloud of Darkness), Regeneration Negation (Mid-Godly) and Immortality Negation (Types 1, 2, 3,
    and 7. Was capable of killing God of Magic Kefka, who took the power of the Warring Triad and became
    the source of all magic and Espers, including Gilgamesh), Absorption (via Runic which absorbs magical
    attacks), Fire Manipulation, Ice Manipulation and Matter Manipulation (Sub-Atomic; Can use different
    levels of Fire and Ice magic. Both Fire and Ice related abilities are stated to affect the target''s
    electrons, being able to even negate durability in the process), Electricity Manipulation and Pain
    Manipulation (Is able to utilize different levels of Lightning spells, which is capable of attacking
    the nervesFinal Fantasy IV Volume 2 Novel, chapter 7, page 54), Statistics Amplification, Absorption,
    Power Nullification, Poison Manipulation and Corrosion Inducement (The Poison spell is stated to Corrode
    the targetFinal Fantasy IV Series Guidebook), Time Manipulation, Purification (Type 3; via Esuna),
    Explosion Manipulation (via Flare), Transmutation, Holy Manipulation, Petrification, Disease Manipulation
    (via Bio), Earth Manipulation, Air Manipulation, Flight, Death Manipulation, Resurrection, Soul Manipulation
    (via Death and Raise, the Death spell reaps the targets soul; killing them, and the Raise spell can
    bring back a spirit to a deceased body) Gravity Manipulation (via Gravity magic, the Haste and Slow
    spells are stated to control gravity), Energy Manipulation, Healing, Regeneration (Mid-Low), Sleep
    Manipulation and Biological Manipulation (via Sleep, which can affect the target''s cerebral cortex)
    Information Analysis and Clairvoyance (Libra is stated to have insight), Madness Manipulation (Type
    2) and Morality Manipulation (Can inflict targets with the Confuse status ailment, driving the target
    insane and attack anyone, even their allies), Teleportation and Spatial Manipulation (via Teleport,
    which is stated to warp space), BFR (The teleport/Warp spells are capable of banishing targets to
    the Void, which inflicts the following abilities on the victim: Existence Erasure/Void Manipulation,
    Mind Manipulation (which includes Madness Manipulation (Type 3), and Perception Manipulation), Space-Time
    Manipulation, Time Stop, and Corruption (Type 2)), Berserk Mode, Size Manipulation, Attack Reflection
    Negation (Several spells pierce through reflect such as Tornado, Flood, Drain, Ultima and Gravity
    spells), Biological Manipulation (The Sleep Spell and the Hold Spell are capable of affecting the
    brain''s fundamental functions), Blood Manipulation (The Death spell is stated to solidify the target''s
    blood to kill them) {{!}}-{{!}}Resistance= Resistance to Absorption (Can harm Kefka with magic after
    he absorbs the goddess statue which is stated and shown to absorb magicFinal Fantasy 6), Subjective
    Reality, Magic, Conceptual Manipulation (Type 2), and Space-Time Manipulation (Characters are capable
    of surviving and resisting magical abilities, Which is shown to project one''s inner mind onto reality,
    and as shown with the creation of the Devil''s road, remove entire concepts and warp space and time
    to where the past, present, and future exists as one), Law'
