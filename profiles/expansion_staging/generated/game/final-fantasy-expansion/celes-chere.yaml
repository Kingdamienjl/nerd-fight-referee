  text: Gifted. Celes is one of the only successful Magitek Knights of the Gesthahlian Empire, granting
    her greater expertise than all of her comrades except for Terra. A former ranking general in the Gestahlian
    Military, she is also proficient with all sorts of melee weapons, being the only other female character
