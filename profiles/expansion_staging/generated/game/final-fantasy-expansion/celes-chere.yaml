- id: claim-weaknesses-740fd44d
  section: weaknesses
  axis: weakness
  text: 'Runic can only be used with a bladed weapon, and she cannot use it if disarmed. Notable Attacks/Techniques:
    |-|Magic= *Runic: Celes'' signature ability, allowing her to negate any enemy magical attack simply
    by intercepting it with a bladed weapon, absorbing it and restoring her mana reserves with the energy
    from the attack. *Firaga: Celes ignites her target in a fiery explosion. *Blizzaga: Celes fires a
    giant shard of Ice that can split into smaller shards to home in on their target. Alternatively, she
    can use multiple shards to revolve around herself. *Thundaga: Celes calls down contracting Lightning
    Bolts around her foe. *Holy: Celes fires orbs of holy magic at her foe that home in on their location.
    *Flare: Celes induces nuclear fusion in her target''s location, causing a concentrated thermal explosion.
    *Meltdown: Celes releases ultra-hot flame that envelops everything. Alternatively, she can fire off
    an orb of superheated magic. *Poison: Celes poisons his target *Bio: Celes fires a cloud of noxious
    gas to poison her target. *Quake: Celes opens up a rift in the earth to swallow up her foes. *Tornado:
    Celes summons multiple tornadoes to assault her foe. *Flood: Celes summons a stream of water at her
    target''s location. *Drain: Celes absorbs her target''s life energy to heal herself. *Break: Celes
    petrifies her target, allowing her to break and shatter them at her leisure. *Death: Celes reaps the
    target''s soul and solidifies their blood, killing them instantly. *Graviga: Celes conjures a dome
    of gravity over her foe, crushing them under the gravity and reducing 3/4s of their HP. *Banish: Celes
    banishes her target to the void. *Meteor: Celes hails down meteors that ignore defense. *Ultima: Celes
    conjures the ultimate black magic, causing an expanding explosion that ignores defense. *Libra: Celes
    scans her target to check their hp, mp and current weaknesses. *Curaga: Celes heals herself and allies
    a large amount of HP *Rasp: Celes damages the target mp, draining it. *Silence: Celes silences the
    target preventing them from using abilities. *Protect: Celes raises a magical shield around her target
    that doubles physical defense. *Shell: Celes raises a magical shield around her target that doubles
    magical defense. *Reflect: Celes places a barrier around her target that reflects magic back at the
    caster. *Hastega: Celes manipulates time to speed up himself and allies. *Slowga: Celes manipulates
    time to slow down her targets *Imp: Celes transforms her target into an imp. *Float: Celes casts a
    spell that allows her to levitate in mid-air. *Vanish: Celes casts a spell that allows her to become
    invisible. *Teleport: Celes casts a spell that enables her to teleport. *Quick: Celes stops time for
    everyone in her range. *Sleep: Celes casts a spell to make her target fall asleep. *Confuse: Celes
    casts a spell on her target that causes them to become unable to differentiate friend from foe and
    attack allies. *Berserk: Celes casts a spell that can drive her target berserk. *Dispel: Celes cancels
    out the effects of abilities. *Valor: Celes doubles the damage of the next attack of the target. |-|Relics=
    *Silver Spectacles: Silver Rimmed glasses that protect against blind *Star Pendant: Star Shaped pendant
    with a jewel in the center that protects against poison. *Jeweled Ring: A ring with a large gem that
    protects against petrify. *Fairy Ring: Ring imbued with a fairy''s magic that prevents poison and
    blind. *Peace Ring: Ring that soothes the user''s mind, protecting them from Berserk and Confuse *Amulet:
    Protective Charm that prevents Zombification, Poison, and Blind *White Cape: Flowing white cape that
    protects against Silence and Impification *Safety Bit: A small sphere that spins around the user''s
    hand, that protects against petrification, zombification, and death. *Memento Ring: A ring blessed
    by the love of a passed mother that protects against petrification, zombification, and instant death.
    *Ribbon: A silk ribbon that protects against all status ailments, including Sleep and Sap. *Protect
    Ring: A ring that automatically enchants protect on the user. *Reflect Ring: A silver ring that automatically
    enchants Reflect on the user. *Angel Wings: Rumored Angel Wings that automatically enchants float
    on the user. *Angel Ring: Ring encrusted with Angel Wings that automatically enchants Regen on the
    user. *Hermes Sanda'
  source_ids: *id003
