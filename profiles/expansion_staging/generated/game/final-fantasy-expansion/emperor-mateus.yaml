    (Can resist the paralysis status effect), Time Stop (Can resist the Stop spell), Transmutation (Can
    resist turning into a Toad), Size Manipulation (Can resist the Mini spell), Curse Manipulation and
    Statistics Reduction (Can resist the Curse status effect, which makes the target far weaker than before),
    Fear Manipulation (Can resist the Fear spell), Memory Manipulation (Can resist the Fog status effect,
