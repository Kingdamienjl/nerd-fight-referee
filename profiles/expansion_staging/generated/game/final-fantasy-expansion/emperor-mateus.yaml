  section: abilities
  axis: hax
  text: 'Base=Superhuman Physical Characteristics, Extrasensory Perception (Mages have shown to naturally
    possess thisFinal Fantasy IV:The After Years), Magic, Subjective Reality (Magic,Final Fantasy IV Novel
    1, chapter 1, page 29 in its basest form,Final Fantasy IV Novel 1, chapter 3, page 107 is projecting
    one''s innerFinal Fantasy IV: The After Years Novel, chapter 2, page 109 mind onto realityFinal Fantasy
    IV:The After Years, and is powered by intelligence and mental strength), Non-Physical Interaction
    (Magic as a whole is shown to affect a wide variety of different beings, from intangible/immaterial
    beings to non corporeal beings, to abstract concepts like Chronodia, who''s the flow of time itselfFinal
    Fantasy I, to Nonexistent beings like Exdeath and Cloud of Darkness), Conceptual Manipulation (Type
    2), and Space-Time Manipulation (Magic is shown in the novels to remove concepts and warp space and
    time itself, like the Devil''s road, which the concept of time was lost,Final Fantasy IV Novel 1,
    chapter 5, page 199 and time and space were twisted to the pointFinal Fantasy IV: The After Years
    Novel, chapter 1, page 67 the past, present and futureFinal Fantasy IV: The After Years Novel, chapter
    1, page 73 existed as oneFinal Fantasy IV: The After Years Novel, chapter 3, page 147), Law Manipulation
    (Magic is stated to rewrite the natural order of thingsFinal Fantasy IV Novel 1, chapter 5, page 198),
    Power Modification (Including Duplication, Fusionism, Statistics Amplification, Size Manipulation,
    Homing Attack, Danmaku, Aura, Breath Attack, and Energy Manipulation; Magic users across the games
    have consistently shown the ability to manipulate the shape and properties of their own magical abilities,
    with even higher tiers of spells simply being considered stronger versions of the same basic abilityFinal
    Fantasy IV: The After Years Novel, chapter 2 page 114), Air Manipulation (Can make tornadoes at will),
    Electricity Manipulation and Pain Manipulation (via Thunder spells, which are capable of attacking
    the nervesFinal Fantasy IV Volume 2 Novel, chapter 7, page 54), Holy Manipulation (via Holy), Telekinesis,
    Hellfire Manipulation, BFR (The Teleport spell is capable of banishing targets to the Void, which
    inflicts the following abilities on the victim: Existence Erasure/Void Manipulation, Mind Manipulation
    (which includes Madness Manipulation (Type 3), and Perception Manipulation), Space-Time Manipulation,
    Time Stop, and Corruption (Type 2), Afterimage Creation (via Blink), Forcefield Creation (via Wall
    and Barrier) Darkness Manipulation and Perception Manipulation (Can inflict the Darkness/Blind status
    effect, which would render the target blind through darknessFinal Fantasy V GBA Manual), Statistics
    Reduction (via Curse), Life Force Absorption, Sealing & Power Absorption (Can seal targets inside
