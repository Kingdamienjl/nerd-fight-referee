- id: claim-standard-equipment-09c82fa6
  section: equipment
  axis: equipment
  text: '* Apokolilptian Armor: Barda retained her Apokoliptian armor after escaping to Earth, using it
    to supplement her already impressive durability, being able to withstand attacks from other New Gods
    and their weaponry. * Mega Rod: Barda''s signature weapon, a virtually indestructible rod with the
    functional components of a Mother Box. As a result, it is a powerful melee weapon that can easily
    clash with weapons like Wonder Woman''s sword without suffering damage and can project powerful concussive
    blasts across a wide range that can tear through the hulls of armored warships and force back entities
    as durable as Superman. * Mother Box: A sentient supercomputer kept on Barda''s person at all times,
    its most well-known usage is its ability to create "Boom Tubes" that can transport Barda virtually
    anywhere she desires, between planets, solar systems, and even universes. They can also manipulate
    the gravitational constant of the surrounding area, allow Barda to survive in inhospitable conditions
    like the vacuum of space, manipulate and evolve non-sentient machines, heal Barda and sustain her
    in the face of life-threatening injuries, and transfer energy from one place to another. * Aero Discs:
    Special devices that can defy gravity, Big Barda can stand upon them in order to simulate flight,
    being able to maneuver through the air freely while using them.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
