      strange, out-of-the-box, and usually destructive (but frequently successful) solutions for problems,
      such as destroying a battlefield to end a war. Managed to create a planet by himself.Action Comics
      Vol 1 856. He is however, easy to manipulate, unaware of his strength, and struggles with communication
