- id: claim-powers-and-abilities-88abae1b
  section: abilities
  axis: hax
  text: 'Avatars= *Superhuman Physical Characteristics **Large Size (Type 5 for his weakest versions,
    Type 10 for his stronger versions) **Enhanced Senses and Extrasensory Perception **Immortality (Types
    1, 2, 3, 4, 5, 8 and 9; Unicron cannot die so long there exists Evil and Malice in the Multiverse.
    Unicron true self exists in the void between worlds and outside the multiverse) **Regeneration (Low-Mid
    for his weakest version, comparable to other Transformers who can regain their limbs and arms with
    enough scrap, up to High-Godly for his stronger versions, as he survived being erased from history)
    *Skilled Swordsman *Martial Arts *Dimensional Storage (Likely capable of accessing the Transwarp)
    *Reactive Evolution (Every time Unicron dies, he adapts from his previous body and becomes resistant)
    *Empowerment (Empowered by Chaos, Fear, Death, Malice, Hate, Vengeance and many other negative feelings)
    *Transformation (Can transform into his Planetary form at will) *Space-Time Manipulation *True Flight
    & Spaceflight *Body Control *Energy Projection (His planet form has a massive energy cannon used to
    wipe the life of planets he is about to eat) *Reality Warping (Can shape and mold all of reality to
    how he sees fit) *Energy Manipulation (Can manipulate energy down to its most fundamental level. Wields
    all cosmic energy) *Shapeshifting (Can take up the form of anything he desires at the moment) *Size
    Manipulation *Chaos Manipulation, Death Manipulation and Fear Manipulation(By virtue of embodying
    this concept, he should have control over it), Dimensional Travel (Scaling from an extremely weak
    avatar of Vector Prime, who was able to access the planet of Gigantion through extreme effort, which
    was locked in another universe) *Void Manipulation (Can manipulate the swirl of nothingness) *Law
    Manipulation (Can remove and replace laws or fundamental aspects of a universe, such as peace or order)
    *Mathematics Manipulation *Physics Manipulation *Matter Manipulation (Can convert energy to matter
    and vice versa) *Telepathy (Can telepathically communicate with people across the entire cosmos and
    make them his slaves) *Mind Manipulation (Each evil action taken by mortal beings only happens because
    Unicron subconsciously wishes for it to be so) *Empathic Manipulation & Morality Manipulation (Can
    influence one''s morality to that of the side of evil) *Technology Manipulation & Power Bestowal:(Can
    completely alter the structure of Transformers and make them stronger than usual) *Unholy Manipulation
    (Unicron is the opposing force to Primus, who embodies light and order, whereas Unicron embodies Chaos
    and evil. Unicron is able to corrupt beings into doing his bidding) *Corruption (Type 2; Easily corrupted
    the people of YST by simply existing) *Transmutation, Biological Absorption and Biological Manipulation
    (Absorbed and converted an entire planet and all it''s inhabitants into a new metal body for him)
    *Energy, Soul and Power Absorption (Absorbed the souls and energies of other living beings or objects
    in general to power himself) **Soul Manipulation (Can control and manipulate sparks) *Resurrection
    and Necromancy (Can revive beings from the dead) *Existence Erasure (Can erase or create artifacts
    that can erase beings from existence, such as even Primus himself) *Weapon Creation *Clairvoyance
    and Precognition (Can see and accurately predict future events) *Madness Manipulation (Can drive beings
    insane) *BFR *Pocket Reality Manipulation (Can create and control his own pocket dimensions that exist
    outside of The Multiverse) *Summoning (Can summon his own heralds to assist him) Resistance to: *Law
    Manipulation *Space-Time Manipulation *Soul Manipulation *Magic *Information Manipulation *Telepathy
    *Reality Warping *Existence Erasure (Can resist being erased by artifacts such as the Matrix of Leadership,
    which can erase beings of pure evil) |-|Singularity= All previous abilities to an unfathomably greater
    extent, along with: *Large Size (Type 10) *Higher-Dimensional Existence *Abstract Existence (Type
    1; Embodies chaos and evil on a multiversal scale) *Conceptual Manipulation (Type 1; Can remove concepts
    from the multiverse, such as the concept of order) *Incorporeality (Exists as an idea. The very representation
    of chaos and evil itself) *Acausality (Type 4; Exists outside the nature of cause and effect) *Absorption
    (Everything Unicron devours becomes part of him) *Non-Physical Interaction (Can harm other non-corporeal
    beings) *Avatar Creation'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
