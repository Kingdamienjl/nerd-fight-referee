      Prime and Megatron.)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Subsonic movement speed with High Hypersonic+ flight speed and Massively FTL+ reaction and combat
      speed (Comparable to Optimus Prime)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class G (Grimlock is routinely portrayed as the physically strongest Transformers character,
      save the titans and combiners. He is seen casually bracing the Washington Monoument, and, with help
      from Optimus Prime, tilt it back up. Stronger than Blast Off who towed a massive asteroid)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At least Brown Dwarf level (Capable of harming characters such as Optimus Prime and Megatron)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least Brown Dwarf level (Even in his significantly weaker robot form, Grimlock was able to
      survive an all-out onslaught of attacks from most of the Decepticon forces, albeit barely. In Tyrannosaurus
      form, Grimlock was never shown to take any bit of damage, tanking shots from even Megatron. Far
      tougher than Soundwave and Starscream, who survived shots from the Orbit disruptor cannon.)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Practically Infinite. Grimlock, along with most, if not all Cybertronians, were depicted as
      tireless machines.
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range with sword, at least Hundreds of Meters with his Galaxial Launcher
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Below Average. Grimlock is a very basic creature when it comes to intelligence, preferring to
      fight first and think later, if then, and speaking only in the third person. Because of his lower
      intelligence, Grimlock is easily tricked and manipulated.
    source_ids: *id002
    confidence: 0.95
