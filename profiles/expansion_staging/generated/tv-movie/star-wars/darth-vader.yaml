    text: right|280px {{Quote|Anakin Skywalker was weak. I destroyed him.|Darth Vader facing his former
      Padawan Ahsoka Tano.}} ==Summary== Darth Vader is a Dark Lord of the sith and the apprentice of
      Emperor Palpatine, ruler of the Galactic Empire. Vader was once the esteemed Jedi Knight Anakin
      Skywalker, whose unparalleled midichlorian count labeled him as the Chosen One destined to bring
      balance to the Force. However, the numerous tragedies he suffered during his service to the Jedi
      Order in the Clone Wars took their toll on Skywalker, making the young knight desperate to find
      a way to protect his lover Padme Amidala. This opened the Chosen One to the manipulations of Darth
      Sidious, who turned the newly christened Vader against the Jedi Order, slaughtering numerous Jedi
      and their younglings as part of Order 66. However, Vader was defeated on Mustafar by his former
      master, Jedi Knight Obi-Wan Kenobi, leaving the Sith Lord with grievous injuries and burns so severe
      that he had to be encased in his iconic life support system. With his former identity entirely relinquished,
      Vader became a feared enforcer of the emperor's regime, laying waste to anyone who would oppose
      Palpatine's Will. However, Vader was defeated once more by his son, Luke Skywalker, in lightsaber
      combat during their final confrontation aboard the Death Star II. Being offered mercy by his son,
      Vader's paternal instincts took over as Palpatine began to electrocute Luke with a continuous stream
      of Force Lightning. Subduing his master from behind, Vader then tossed Palpatine into the reactor
      shaft to save Luke, sustaining fatal injuries and severe damage to his life support systems in the
      process. Luke then removes Vader's helmet, allowing Anakin Skywalker to look into his son's eyes
      for the first and final time before becoming one with the Force. ==Powers and Stats
