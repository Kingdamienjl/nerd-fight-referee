- id: claim-weaknesses-25dc4cb5
  section: weaknesses
  axis: weakness
  text: 'Not fully trained in the use of the Force or the Lightsaber, as she is just getting used to using
    them Notable Attacks/Techniques: *Telekinesis: Rey utilizes Telekinesis either as offensive or defense.
    Her power is shown to be stronger than Kylo Ren''s, as she could pry Luke''s Lightsaber out of his
    own telekinetic grip when he tried to summon it to his hand, causing it to fly past him and into hers
    instead. *Mind Trick: Rey utilizes Mind Tricks, to control the minds of other sentient beings, however,
    it does not work on individuals with a strong will. It took her three tries to master it. *Mind probe:
    Rey utilizes mind probe to sift through the thoughts of a sentient being. She was able to resist Kylo
    Ren''s attempt to probe her mind for the map to Luke Skywalker''s location and even turned his attack
    back on him to discover his own fears of inadequacy in the shadow of Darth Vader. *Force vision: Rey
    utilizes Force vision, to have visions of the past, the present, and the future; however, like all
    force users, her visions are not always clear or sometimes has visions even when she is not utilizing
    this power at will. *Force sense: Rey utilizes Force sense, to sense another sentient being''s emotions,
    the future, ripples in the Force caused by momentous or traumatic events, or impending danger and
    the presence of the dark side. She learned this when Ren attempted to use it against her. *Battle
    Meditation: Rey utilized Battle Mediation, allowing her to renew her morale, stamina, and overall
    battle prowess. This allowed her to defeat the more skilled, yet injured, Kylo Ren in battle by meditating
    on the Force as Maz Kanata taught her. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters Category:Star Wars Category:Movie
    Characters Category:Female Characters Category:Protagonists Category:Primary Protagonists Category:Telekinesis
    Users Category:Mind Users Category:Telepaths Category:Staff Users Category:Humans Category:Adults
    Category:Live-Action Characters Category:Gun Users Category:Good Characters Category:Energy Weapon
    Users Category:Psychometry Users Category:Weapon Masters Category:Heroes Category:Pilots Category:Teenagers
    Category:Dual Wielders Category:Empowerment Users Category:Jedi Category:Element Users Category:Electricity
    Users Category:Science Fantasy Characters Category:Enhanced Senses Users Category:Stealth Masters
    Category:Status Effect Users Category:Orphans Category:Tragic Characters Category:Prisoners'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
