  intelligence:
    text: Gifted (Throughout the movie, Rey has been shown to be of great intelligence. She has lived
      almost her entire life living on the Junkfields of Jakku, where she had honed her skills in survival
      in addition to having stayed in peak-physical condition, traverse various downed star cruisers and
      other pieces of war tech, and even learning languages of other beings such as that of Chewbacca's
      and BB-8's. Rey has also been shown to be an amazing mechanic of sorts, knowing the in's and out's
      of how machinery works and has displayed an understanding of even the Millennium Falcon itself,
      making her skills rival that of Han Solo. After having encountered Luke's Skywalker's lightsaber,
      Rey has also potential in the Force. Despite not having been trained in its power after having them
      awakened, she was capable of resisting Kylo's attempt to probe her mind to the point of being able
      to use it and against him and exploit his own fears. She was also able to use yet another force
      technique by mind-tricking a stormtrooper into unshackling her restraints after only a few tries.
      Towards the end of the movie, Rey's skill and power over the force grew considerably, being able
      to out force Kylo Ren when they were going for Luke's lightsaber and being able to repel his attacks
      during their battle)
    source_ids: *id002
    confidence: 0.95
