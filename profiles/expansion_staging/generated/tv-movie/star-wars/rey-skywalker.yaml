power_scale:
  tier:
    text: '{{9-A}} naturally, {{9-A}} with NN-14, {{Unknown}} with Force powers | {{7-B}}, {{Unknown}}
      with spirits of dead Jedi'
    source_ids: &id002
    - mediawiki-317616
    confidence: 0.95
  attack_potency:
    text: Small Building level naturally (Overpowered Finn with ease) and NN-14 (Heavy blaster pistols
      pack this kind of firepower per shot), Unknown with Force powers (After embracing the power of the
      Force, she defeated Kylo Ren while he was severely wounded and weakened in the Force after murdering
      his father) | City level+ (Force Pushed a giant serpent hard enough to create an avalanche. Luke
      Skywalker described her power as so immense and raw that it scared him and reminded him of Kylo
      Ren, even stalemating the latter in a telekinetic Force struggle. After training with Leia, she
      grew significantly more powerful, and should be more powerful than High-Republic knights, who stopped
      debris that destroyed moons in the Great Hyperspace Disaster), Unknown with spirits of dead Jedi
      (Was aided by the spirits of a thousand dead Jedi, including Luke Skywalker, his father Anakin,
      Obi-Wan Kenobi, Yoda, Qui-Gon Jinn, Ahsoka Tano, Mace Windu, Luminara Unduli, Aayla Secura, Kanan
      Jarrus, and Adi Gallia, to the point where she blocked and deflected Darth Sidious' Force Lightning
      at him, destroying him)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Relativistic+ combat and reaction speed (Able to duel and overpower Kylo Ren while he was severely
      wounded and weakened in the Force after murdering his father. Upscales from Clone Wars' Obi-Wan,
      who can deflect a laser), Relativistic+ up to Speed of Light attack speed with blaster weaponry
      (Most energy weapons, including Blasters, Laser Cannons and Turbolasers, direct invisible beams
      at lightspeed. The bolt seen when a weapon is fired is actually a pulse of plasma traveling along
      the beam at less than lightspeed"Naval Weapons and Equipment". Star Wars Encyclopedia. De Agostini
      Publishing, 2021) | Relativistic+ combat and reaction speed (Comparable to Kylo Ren. Blocked Darth
      Sidious' lightning. Can easily deflect blaster bolts)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Peak Human naturally, Likely Superhuman with Force Amplification, Class M with Telekinesis (Lifted
      a great deal of rock towards the end of the Battle of Crait. Pulled back a flying First Order Transporter.
      Should scale to Kylo Ren and to High-Republic knights, who stopped debris that destroyed moons in
      the Great Hyperspace Disaster)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
