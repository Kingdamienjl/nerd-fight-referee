- id: claim-weaknesses-1c4804b5
  section: weaknesses
  axis: weakness
  text: "His vital organs have not undergone modification, rendering them exceedingly vulnerable to any\
    \ form of attack if his chest cavity is pried open, He is somewhat arrogant and will often fail to\
    \ accommodate for factors outside of his control when he has the upper hand. Due to a combination\
    \ of factors, including natural breathing issues, cyborgization, and damage inflicted to his lungs,\
    \ has left him with a serious cough and severe breathing deficiencies. Notable Attacks/Techniques:\
    \ * Cyborg Physiology: As a cyborg, Grievous was physically stronger, faster, and agile then most\
    \ other sentient beings and could match that of most Force-users. Being a cyborg, Grievous could take\
    \ far more damage than most other sentient beings and does not need to breathe air and could survive\
    \ indefinitely in outer space. In addition his cyborg enhancements also allows him to split his arms\
    \ in two, giving him four arms to fight with and can spin his torso, arms, and wrists in deadly, blindingly\
    \ fast storms of death. Grievous can even use his feet just as well as his hands and his ability to\
    \ wield his lightsabers in this unorthodox and fast flowing style makes him able to hold his own against\
    \ several opponents at once. General Grievous' Thrust Surge-Star Wars Battlefield 2.gif|Thrust Surge\
    \ General Grievous' Unrelenting Advance-Star Wars Battlefield 2.gif|Unrelenting Advance General Grievous'\
    \ Claw Rush-Star Wars Battlefield 2.gif|Claw Rush ** Thrust Surge: This and the 2 following techniques\
    \ are dubbed by a game,Gameplay \xB7 Star Wars Battlefront II they are not actual names Grievous gives\
    \ to his tactics. In-game, Grievous would only 2 lightsabers, Thrust Surge allows him to use all 4\
    \ arms, rushing forward as he stabs with 4 lightsabers at once. The damage is unblockable in-game,\
    \ representing how difficult it would be to block such an assault. Grievous would sometimes use a\
    \ similar tactic in canon. ** Unrelenting Advance: A technique Grievous often implements in combat,\
    \ he uses his cybernetics to spin his lightsabers in 2 hand like helicopter propellers, forming both\
    \ a shield of sorts, and an incoming assault that would be difficult to defend against, all while\
    \ leaving 2 other arms free. Even Obi-Wan reacts initially shocked to the speed of the spinning blades,Star\
    \ Wars: Episode III \u2013 Revenge of the Sith if he is able to defend against the move. ** Claw Rush:\
    \ A technique Grievous often uses across his life, if rarely in combat. Uses his cybernetics to crawl\
    \ through the ground at high speed, bending his legs backwards and using all 4 arms, resembling a\
    \ spider. A simple pirouette puts his body back to normal when he finishes. In this state, Grievous\
    \ can hold himself in walls, roofs, and unstable terrain.Star Wars: The Clone Wars; Season 3; Episode\
    \ 2 \"ARC Troopers\" While defeated, Grievous managed to escape and run over a merciful Obi-Wan once\
    \ using this move,Star Wars: The Clone Wars; Season 2; Episode 9 \"Grievous Intrigue\" likely helped\
    \ by the unpredictability of this contortion. And Grievous is portrayed as being able to damage comparable\
    \ foes by running over them with this technique in one game. *Lightsaber skil"
