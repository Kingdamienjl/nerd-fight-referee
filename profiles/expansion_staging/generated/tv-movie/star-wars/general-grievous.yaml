  intelligence:
    text: 'Gifted (Having been personally trained by Count Dooku, one of the greatest lightsaber duelists
      ever produced by the Jedi Order, Grievous is a master of multiple forms of lightsaber combat, even
      training his Magnaguards in seven forms of Lightsaber combat.Star Wars: Card Trader (Set: Base Series
      1, Card: Magnaguard - Separatists) Feared as a Jedi hunter, his collection of dozens of lightsabers
      proved his effectiveness in combat, easily adapting to various Jedi tactics before going in for
      the kill. He is also a skilled pilot and marksman, often clashing with Republic forces in his own
      starfighter and with blaster weaponry when necessary. even overwhelming multiple Jedi at once. stated
      to be a Major Force in the clone wars, both in strategy and combat, can use his lightsabers to lethal
      effectiveness.Star Wars: Rise of the Separatists Is said to be a Brilliant Military Strategist.
      His brain was cybernetically enhanced to make him a smarter fighter. He is also pragmatic, resorting
      to any means of victory in combat, including involving innocents in the crossfire as well as using
      his Magnaguards to attack his opponents from behind as he continued to press on them from the front.
      However, he is quite arrogant and self-assured and sometimes underestimates his targets once he
      has the upper hand and will fail to counter for outside factors, such as Hondo Ohnaka using a starfighter
      to intervene in Grevious'' battle with Ahsoka Tano.'
