  tier:
    text: '{{7-B}}, higher when guided by the Force, much higher with Empowerment and Rage Power | At
      least {{7-B}}, higher when guided by the Force, much higher with Empowerment and Rage Power'
    source_ids: &id002
    - mediawiki-8977
    confidence: 0.95
  attack_potency:
    text: 'City level+ with Force Amplification and Telekinesis (Even before turning to the dark side,
      Dooku was one of the most powerful Jedi the Order had ever produced, and was portrayed as comparable
      to a younger Mace Windu.Tales of the Jedi Episode 3; Choices Dooku wondered if he could have beaten
      Darth Maul during the Phantom Menace with Qui-Gon Jinn.Star Wars: Age of Republic; Count Dooku Due
      to being comparable to a younger Windu and potentially being superior to Phantom Menace Maul, Dooku
      is more powerful than High-Republic knights, who stopped debris that destroyed moons in the Great
      Hyperspace DisasterStar Wars: The High Republic (Light of the Jedi)), higher when guided by the
      Force, much higher with Empowerment and Rage Power | At least City level+ with Force Amplification
      and Telekinesis (Count Dooku as a Sith was a monster to behold, holding the power and skill to match
      even Yoda,Star Wars Lightsabers: A Guide to Weapons of the Force (2018) though was ultimately outmatched
      and had to distract the Grandmaster to flee.2017 Topps Star Wars Journey to the Last Jedi (UK Release)
      - #112 Dooku is considered by Yoda to be both The Jedi Order''s greatest student and greatest failure.Star
      Wars: Absolutely Everything You Need to Know, Updated and Expanded Far superior to Asajj Ventress,
      to the point where his force lightning scorches her body and can even kill her,Star Wars: Dark Disciple
      and with extreme aid she fails to eliminate him.Star Wars: The Clone Wars Season 3 Episode 12; Nightsisters
      Consistently defeated Clone Wars Anakin Skywalker,Star Wars: The Clone Wars Season 4 Episode 18;
      Crisis on Naboo and performed with similar success against Obi-Wan Kenobi when he was helped by
      Anakin.Star Wars: The Clone Wars Season 6 Episode 10; The Lost One At the beginning of Revenge of
      the Sith, he defeated Obi-Wan and put up an extended duel with an Anakin Skywalker who had grown
      to be stronger than him at the time), higher when guided by the Force, much higher with Empowerment
      and Rage Power'
    source_ids: *id002
    confidence: 0.95
  speed:
