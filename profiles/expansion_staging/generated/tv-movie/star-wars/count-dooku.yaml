  stamina:
    text: Superhuman (As a former Jedi Master and a powerful Dark Lord of the Sith, Dooku's stamina greatly
      exceeded what is considered normal for a man of his advanced age, notably being able to last in
      duels with Anakin Skywalker and Obi-Wan Kenobi without tiring whatsoever, and making no sound of
      pain when both his hands were cut off)
    source_ids: *id002
