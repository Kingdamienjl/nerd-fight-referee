      being apparently in pain due to it and his exposure to it being portrayed as recklessS2-E3:The Heiress),
      City level+ with his Beskar armor (Beskar is resistant to lightsaber attacks, including the Darksaber,
      used by Moff Gideon against him)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: 'Peak Human (Did not appear to be the least bit tired after fending off and defeating three
      Trandoshan warriors after having already been in a fierce firefight just minutes prior. Took a severe
      battering from a mudhorn, but still kept getting back up to continue fighting; then made his way
      back to the Jawas who hired him with the prize they had asked for. Ran from an AT-ST without seeming
      even the least bit tired. Carried Boba Fett''s armor, The Child, tens of kilos of krayt dragon meat
      and many other values a few hundreds of meters on a desert, ultimately conversing in a canteen while
      still standing with that weight, without appearing to be tiredS2-E2: The Passenger)'
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range physically & with vibroknife, Several Meters with his flamethrower, throwing
      vibroknife effectively & Electricity Manipulation (Once a target is already electrocuted, the electricity
      can expand this far). Tens of Meters with his blaster pistol and fibercord whip. Hundreds of Meters
      with flash charges, 200 Meters with Relby-v10 micro grenade launcher,at least Kilometers with Amban
      phase pulse rifle (Being classified as a sniper rifle, its range should be far superior to that
      of the E-11 carbine, which has canonically showcased 800 meters effective range. Other snipers within
      canon are stated to be capable of hitting targets out to 5 kilometers; His Amban phase pulse rifle,
      which is classified as a sniper rifle, is also potentially capable of such ranges).
    source_ids: *id002
    confidence: 0.95
