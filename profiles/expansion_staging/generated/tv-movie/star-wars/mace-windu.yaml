- id: claim-weaknesses-3dc8a460
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Force Push: Mace can use telekinesis to blast Force
    energy outward, hurling back those hit by it. *Force Wave: A stronger version of Force push, Mace
    can unleash an omnidirectional blast of Force energy. *Shatterpoint Perception: Windu can use the
    Force to tell him how to deal with enemies, what their weaknesses and strengths are, and how their
    actions or his affect things directly or indirectly to win. Such as killing Dooku in the first year
    of the war would''ve been the Shatterpoint to end the Clone Wars, by the end, it was linked to Obi-Wan,
    Anakin, and Palpatine. *Telekinesis: Mace can use this through the Force to put his mind literally
    over matter, capable of blasting opponents, shielding himself or disarming people, its limits are
    only those of the creativity that Force User has. His greatest display of this power was crushing
    General Grievous'' chest armor plating. *Telepathy: Windu can easily manipulate others mentally with
    the Force to trick, deceive, maim or even kill outright. Can also use this power externally or internally
    when it comes to illusion creation, manifestation, and manipulation; see range for more details. *Form
