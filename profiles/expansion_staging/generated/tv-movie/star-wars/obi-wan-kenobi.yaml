- id: claim-standard-equipment-66cacc74
  section: equipment
  axis: equipment
  text: "**All the powers and abilities of the lightsaber. **Thread Manipulation, Non-Standard Breathing\
    \ (Type 3) and Light Manipulation with Jedi Gear and Jedi Utility Belt (Beyond their lightsabers,\
    \ Jedi also carried a wide variety of equipment with them on their missions. Those items included\
    \ small grappling hooks for scaling difficult obstacles; comlinks and handheld holographic projectors\
    \ for viewing and transmitting important information; and breathing devices for surviving on planets\
    \ with underwater civilizations or unwelcoming atmospheres. The belt contains a number of useful tools\
    \ and items, in a compact and visually nondescript manner. A Jedi utility belt contains a three-day\
    \ supply of food capsules, an emergency medpac, a lightsaber maintenance kit, a slim glow rod, a comlink,\
    \ and an aquata breather. In addition, a standard lightsaber can be securely hung from the belt for\
    \ easy access) |-|Clone Wars - Obi-Wan Kenobi Show= Same as before, plus: *Social Influencing (Known\
    \ galaxy-wide as \"The Negotiator\", Obi-Wan Kenobi subdued planets, defeated armies, and more by\
    \ simply using his wit and masterful diplomacy to stop more fights than he startsStar Wars Encyclopedia:\
    \ The Comprehensive Guide to the Star Wars Galaxy) *Mind Manipulation (With RESTRICTIVE MIND TRICK;\
    \ A Jedi's mastery of the Force can influence the weak-minded, and in the case of Master Kenobi, even\
    \ subvert his enemy's desire to use their abilities against him[Game] Star Wars Battlefront II) *Resistance\
    \ to Fear Manipulation and Paralysis Inducement (Unaffected by the combative presence of Darth Vader.Obi-Wan\
    \ Kenobi; Season 1 Episode 6; Part VI The presence of Darth Vader in the Force is cold;[Animated television\
    \ series] Star Wars Rebels - The Siege of Lothal it was as if the air had been sucked out of the room,\
    \ like a door opening into the vacuum of space and drawing all living beings toward a great void that\
    \ promised only death, threatening to drown them, freezing them in place and making them want to cling\
