- id: claim-weaknesses-47a794d4
  section: weaknesses
  axis: weakness
  text: 'Suffers continuous mental conflict over his Light Side nature conflicting with his desire for
    more power in the Dark Side of the Force. Notable Attacks/Techniques: *Telekinesis: Kylo Ren can use
    this through the Force to put his mind literally over matter, capable of blasting opponents, shielding
    himself or disarming people, its limits are only those of the creativity that Force User has. Kylo
    Ren has demonstrated considerable prowess with the power, even halting the movement of a blaster bolt
    in mid-air. *Telepathy: Can easily manipulate others mentally with the Force to trick, deceive, maim,
    or even kill outright. Kylo Ren has a considerable mastery for the power, able probe for hidden thoughts
    in the minds of others, and learns them for himself. *Tutaminis: Through the Force, Kylo Ren can draw
    potentially harmful energy into his body and diffuse it or channel it away completely. Kylo Ren demonstrated
    this power when he used the Force to block several of Rey''s lightsaber strikes with his bare hands.
    *Force Stasis: Force Stasis was an ability of the Force to forcibly halt things headed in a Force-user''s
    direction, from people up to and including blaster bolts. Note: ==Notable Matchups== Victories: Lord
    Helmet and Megamaid (Spaceballs) Lord Helmet''s Profile, Megamaid''s Profile (Supremacy is commanded
    by Kylo Ren circa Rise of Skywalker. Megamaid is commanded by Lord Helmet. Both ships have all their
    carried craft, troops and screening ships. Battle takes place in whereabouts of planet Druidia, at
    least 300 kilometers away from planet itself. Starting distance between Supremacy and Megamaid is
    26478 meters. Speed is equalized.) Losses: High Templar (StarCraft) High Templar''s Profile (Speed
    was equalized and they fought for 2 matches with the first round restricting the use of the High Templar''s
    Feedback ability while the 2nd round allowed it.) Inconclusive: ==References== {{scroll box|content={{reflist|2}}}}
    {{Discussions}} Category:Star Wars Category:Evil Characters Category:Antagonists Category:Telekinesis
    Users Category:Sword Users Category:Psychics Category:Characters Category:Movie Characters Category:Male
    Characters Category:Martial Artists Category:Mind Users Category:Forcefield Users Category:Energy
    Users Category:Primary Antagonists Category:Science Fantasy Characters Category:Humans Category:Telepaths
    Category:Traitors Category:Absorption Users Category:Precognition Users Category:Attack Reflection
    Users Category:Enhanced Senses Users Category:Tyrants Category:Tragic Characters Category:Energy Weapon
    Users Category:Rulers Category:Memory Users Category:Status Effect Users Category:Leaders Category:Psychometry
    Users Category:Adults Category:Reformed Characters Category:Clairvoyance Users Category:Live-Action
    Characters Category:Vehicular Masters Category:Comic Book Characters Category:Extrasensory Perception
    Users Category:Healers Category:Rage Users Category:Pilots Category:Murderers Category:Terrorists
    Category:Weapon Users Category:Astronauts Category:Princes Category:Royal Characters Category:Orphans'
  source_ids: *id003
  decisive: false
  status: unverified
