  attack_potency:
    text: Small Building level naturally (Fought and overpowered Finn in lightsaber combat while heavily
      weakened. Comparable to Rey and defeated multiple Elite Praetorian Guards, all of whom should be
      superior to First Order Stormtroopers, alongside her), City level+ with Force Amplification (Destroyed
      a large portion of a temple. Snoke considers him to be the ideal embodiment of the Light and Dark
      sides of the Force. His power was held in high regard by his uncle. Stated to be able to defeat
      Luke during the Empire Strikes Back who bested the Grand Inquisitor. Should be more powerful than
      High-Republic knights, who stopped debris that destroyed moons in the Great Hyperspace Disaster)
      | Small Building level naturally, City level+ with Force Amplification (Matched Rey in a telekinetic
      struggle, despite the latter being considerably stronger since their showdown on the Supremacy)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Relativistic+ (Easily able to react to and deflect blaster fire, far superior to Luke Skywalker
      post A New Hope, who is capable of fending off IG-100 MagnaGuards for a brief period of time with
      little training) | Relativistic+ (Faster than Jedi Rey)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Peak Human naturally, up to Class M with Force Amplification and Telekinesis (Far superior to
      Season 1 of Rebels Ezra Bridger and should be at least comparable to Kanan Jarrus. Should be more
      powerful than High-Republic knights, who stopped debris that destroyed moons in the Great Hyperspace
      Disaster)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Small Building level naturally, City level+ with Force Amplification | Small Building level
      naturally, City level+ with Force Amplification
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Small Building level naturally (Should not be weaker than an average Stormtrooper or a trained
      Force Adept. Survived being thrown hard enough to shatter stone and the subsequent fall after being
      drained of the Force, though he sustained a twisted ankle and potentially two broken ribs). City
      level+ with Force Amplification via power-scaling (Can deflect lightsaber strikes. Stated to have
      "immense" telekinetic defences) | Small Building level naturally, City level+ with Force Amplification
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Peak Human (Can fight extreme battles with little hindrance with serious wounds for several
      minutes at a time)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range with his lightsaber; Tens of Meters with Force abilities; Galactic and
      Interdimensional with Force sense (Superior to the likes of Kanan and Ezra who were able to sense
      the Dark Side power of Darth Vader on Lothal while still in orbit)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (Though young, Kylo Ren has very high intelligence, He was the best student at Luke's
      Jedi academy, and because he is very gifted, he was able to surpass the other apprentices in the
      various areas of the Jedi training. Voe attempted to beat him in lightsaber combat, meditation,
      and other Jedi techniques, but she never succeeded. He was a dedicated Jedi apprentice and used
      to practice calligraphy, the art of fancy handwriting that was abandoned long ago by the people
      of that time, in order to record his observations of the lessons. He was both the commander of the
      First Order military forces and leader of the Knights of Ren. He also seems to know every Stormtrooper
      by number, which is impressive considering the vast number of them which exist. Skilled and experienced
      combatant. Considered "unstoppable" on the battlefield of the new trilogy era)
    source_ids: *id002
    confidence: 0.95
