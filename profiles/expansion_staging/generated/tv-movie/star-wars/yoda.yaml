- id: claim-weaknesses-c56a375c
  section: weaknesses
  axis: weakness
  text: 'Developed a severe depression while in his exile, since it took him 20 years to, once again,
    understand and learn self-forgiveness. A large part of his actions in the order is limited by his
    pedagogy, being the first teacher of basically all younglings, or by the Council, whose blindness
    was exploited by Sidious, resulting in the Empire and the end of the order. Notable Attacks/Techniques:
    *Force Barrier: A defensive Force power that creates a barrier or wall of Force energy around the
    intended target, be itself, friend, or foe. Depending on the strength of the individual, the barrier
    could only withstand a few attacks before collapsing. *Telekinesis: Yoda can use this through the
    Force to put his mind literally over matter, capable of blasting opponents, shielding himself or disarming
    people, its limits are only those of the creativity that Force User has. Yoda has demonstrated considerable
    prowess with the power, even matching the telekinetic might of Darth Sidious. *Telepathy: Can easily
    manipulate others mentally with the Force to trick, deceive, maim, or even kill outright. Yoda has
    a considerable mastery for the power, able probe for hidden thoughts in the minds of others, and learn
    them for himself. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}}
    {{Discussions}} Category:Characters Category:Star Wars Category:Movie Characters Category:Cartoon
    Characters Category:Book Characters Category:Game Characters Category:Male Characters Category:Chi
    Users Category:Mind Users Category:Heroes Category:Good Characters Category:Protagonists Category:Geniuses
    Category:Comic Book Characters Category:Aliens Category:Martial Artists Category:Wise Characters Category:Telepaths
    Category:Telekinesis Users Category:Energy Users Category:Forcefield Users Category:Matter Users Category:Sword
    Users Category:Science Fiction Characters Category:Cane Users Category:Jedi Category:Longevity Users
    Category:Teachers Category:Survivors Category:Honorable Characters'
  source_ids: *id003
  decisive: false
  status: unverified
