  intelligence:
    text: 'Extraordinary Genius (Built an advanced droid, and a podracer that he had been working on for
      years at the age of 9 years old. One of the other children states that he had been working on it
      for years, implying that he had began building it at an even earlier age than 9. He''s also demonstrated
      to be able to speak Huttese fluently. Skywalker competes in the Boonta Eve podrace at the age of
      9 years old with his own custom made podracer he built. He displays heightened reflexes and showings
      of impressive dexterity throughout the race. He not only wins the race, but he wins his freedom
      from being a slave because of that. Anakin participated in the Battle of Naboo at the age of 9,
      and managed to survive and destroy the Trade Federation control ship.Star Wars: Episode I The Phantom
      Menace Designed custom starfighters and other devices, master starfighter pilot, skilled and experienced
      combatant. Unorthodox, yet brilliant, tactician and strategist. Fixed a pit droid head with ease,
      knows the weak spot for some Trade Federation constructs,Star Wars: Episode II Attack of the Clones
      able to fix a droid-mech central processor with ease,Star Wars: Obi-Wan and Anakin #3 fixed at least
      4 other mechs,Star Wars: Obi-Wan and Anakin #4 claims he can fix all the broken equipment in a tribe''s
      village, a communications unit, built a speeder that he uses to save an injured Obi Wan,Star Wars:
      Obi-Wan and Anakin #5 figured out how to start The Twilight,Star Wars: The Clone Wars film hid AT-TEs
      on asteroids in order to flank and defeat General Grevious''s attack fleet, outsmarted Admiral Trench
      using a stealth ship,Star Wars: The Clone Wars: Season 2, Episode 16 rigged one of the Malevolance''s
      navicomputers to cause it to jump into hyperspace into a moon, destroying it,Star Wars: The Clone
      Wars: Season 1, Episode 4 climbed under bridge to plant grenades, and destroy tanks crossing it,
      came up with a strategy to take out 2 armored sniper droidekas before a couple of bombs explode,
      fooled Dooku with a trick, to stall for time,Star Wars: The Clone Wars film can jury rig a communicator
      to make it work, easily deduces that Captain Rex is under Asaj Ventress''s influence,,Star Wars:
      The Clone Wars film knows about Droidekas, and how to take them down,Star Wars: The Clone Wars:
      Season 5, Episode 2 "A War on Two Fronts" hides under a crate to pass through enemy shield, he knows
      how to utilize his Padawan, Ahsoka, when he needs her, once effectively utilized AT-TEs to board
      a separatist ship, lands half of a crashing Trade Federation Dreadnought,Star Wars: Episode III
      Revenge of the Sith avoids ship debris while avoiding Malevolance''s EMP blast, causes Tri Fighters
      to crash into each other, and shoots down Ventress, destroys a group of missiles, outmaneuvers MagnaGuard
      pilots with help from R2, outmaneuvers Vulture droids with his piloting skills, Successfully navigated
      his entire fighter squadron through the Kaliida Nebula, and through the native Neebray,Star Wars:
      The Clone Wars: Season 1, Episode 3 "Shadow of Malevolence" able to quickly and casually disarm
      a bomb, disables droid artillery with a well thrown EMP grenade, flourishes a pole arm, displaying
      the fact that Jedi are trained in the use of many different weapons, beats the hell out of Clovis,
      leaving him temporarily crippled, and showing a proficiency in hand to hand combat,Star Wars: The
      Clone Wars: Season 6, Episode 6 "The Rise of Clovis" he can effectively use an electro-whip to do
      things such as disarming foes,Star Wars: The Clone Wars: Season 4, Episode 12 "Slaves of the Republic"
      takes control of a flying insectoid and smacks Ventress with it, takes on an IG Assassin Droid in
      hand to hand combat, uses a deactivated electro-whip to take down 4 people, uses grenade to destroy
      fuel line)'
    source_ids: *id002
    confidence: 0.95
