power_scale:
  tier:
    text: '{{9-B}} physically, {{7-B}} with Mandalorian equipment Name: Boba Fett Origin: Star Wars Gender:
      Male Age: 36 (Return of the Jedi), 41 (Book of Boba Fett) Classification: Clone of Jango Fett, Bounty
      Hunter, Mandalorian (Possibly, sources state he''s a human with Mandalorian armor, while The Mandalorian
      states Jango was a Foundling, and thus Boba would be by extension)'
    source_ids: &id002
    - mediawiki-10559
    confidence: 0.95
  attack_potency:
    text: Wall level physically (Should be at least comparable to Dengar. Capable of knocking out Kage
      Warriors, who are capable of matching Dengar in hand to hand combat. Kicked a solid metal door so
      hard that it was bent out of shape and flew right off its hinges. Ripped off a large alien's arm
      [said arm being thicker than Fett's own legs]. Should be at least as strong as an old and sickly
      Nakano Lash who was strong enough to pin down and snap the neck of a Thisspiasian bounty hunter
      whose tail strikes could crack and shatter a solid stone floor; Nakano even feared Boba as well.
      Easily shattered Stormtrooper armour), City level+ with Mandalorian equipment (In the past, when
      the Mandalorians clashed with the Jedi, their weapons, arsenal, and technology were greatly enhanced
      and specifically designed to counter them, with some gadgets even being referred to as anti-Jedi,
      and by the time of the High-Republic, Jedi knights stopped debris that destroyed moons in the Great
      Hyperspace Disaster)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Peak Human travel speed with Relativistic+ combat and reaction speed (Could react to and fight
      with Din Djarin), Relativistic+ to Speed of Light attack speed with blaster weaponry (Most energy
      weapons, including Blasters, Laser Cannons and Turbolasers, direct invisible beams at lightspeed.
      The bolt seen when a weapon is fired is actually a pulse of plasma traveling along the beam at less
      than lightspeed"Naval Weapons and Equipment". Star Wars Encyclopedia. De Agostini Publishing, 20210.9c
      to 1c), up to Subsonic+ flight speed with Jetpack (Used by others to keep up with shuttles with
      top atmospheric speeds of 800 km/h or more. Used by Paz Vizsla to catch up to the Razor Crest, which
      should be even faster but was moving at unknown speeds222.2222 m/s, or 800 km/h)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Peak Human (Lifted a Stormtrooper with one arm)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Wall level (Should be comparable to Dengar, who has punched an injured Chewbacca right through
      a wall)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Wall level by himself (Can take numerous blow from Kage Warriors, who themselves are comparable
      to Dengar and can match him in hand to hand combat. Should be at least as durable as old and sick
      Nakano Lash, who was completely fine after taking a tail strike from a Thisspiasian that was strong
      enough to crack and shatter a solid stone floor), City level+ with his armour (Survived a Class-A
      Thermal Detonator explosion at close range with no notable damage. His armour should be no less
      durable than that of Dengar), Beskar is resistant to lightsaber attacks
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Peak Human
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range physically, Several Meters with flame thrower and grappling cable, Tens
      of Meters with blaster pistols and grenades, Hundreds of Meters with blaster carbine and rockets
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius in combat (Boba Fett is a highly talented and extremely dangerous combatant. He was trained
      from birth by his father, himself one of the most dangerous warriors in the entire galaxy, and was
      already highly capable as a martial artist and with all sorts of weapons by the mere age of 10.
      By the age of 13, he was already at least as skilled as a fully mature Clone Trooper of the Grand
      Army of the Republic, widely regarded as some of the greatest soldiers in the galaxy, and was as
      skilled a pilot as Clone Aces of the Republic Navy. He was also intelligent enough to lead and manage
      his own bounty hunters' syndicate, which included such names as Dengar, Bossk, Embo, and C-21 Highsinger)
    source_ids: *id002
    confidence: 0.95
