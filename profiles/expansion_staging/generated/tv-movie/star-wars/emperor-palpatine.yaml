  attack_potency:
    text: City level+ (Far stronger than his former apprentices, effortlessly overpowered Luke Skywalker
      and mocked his abilities as "feeble". Easily disabled and destroyed a freighter while using very
      little of his true strength, and deepened his mastery of the Force over time), possibly far higher
      (Stated to be significantly more powerful than Bendu by Vader, who'd heard reports from the Battle
      of Atollon. Should be more powerful than High-Republic Jedi knights, who stopped debris that destroyed
      moons in the Great Hyperspace Disaster) | At least City level+ (Heavily overpowered Kylo Ren and
      Rey at the same time), Unknown after absorbing the Force Dyad (Significantly stronger than before,
      disabled the entire Citizens' Fleet with a large blast of Force Lightning. The backlash of his Force
      Lightning destroyed a large portion of the Sith Amphitheatre)
    source_ids: *id002
    confidence: 0.95
