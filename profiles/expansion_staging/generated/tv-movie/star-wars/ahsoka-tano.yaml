  attack_potency:
    text: City Block level+ (Pulverized an ice cliff along with half a dozen Jedi initiates, all of whom
      are far inferior to Ahsoka. Has contended with the likes of General Grievous and Asajj Ventress,
      although she is inferior to both, and defeated multiple MagnaGuards at her weakest level of power)
      | City level+ (Near the end of the Clone Wars, she improved to the point of being able to fight
      on par with Darth Maul. Should be more powerful than High-Republic knights, who stopped debris that
      destroyed moons in the Great Hyperspace Disaster) | City level+ (Contended with Darth Vader for
      a long while on Malachor. Word of God states that, as of 3 BBY, Darth Vader and Darth Sidious are
      the only two people in the Galactic Empire capable of contending with Ahsoka blow for blow)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Relativistic+ combat and reaction speed augmented by precognition (Capable of putting up a defensive
      fight against General Grievous, Asajj Ventress and even Darth Maul. It should also be noted that
      as an Ataru specialist, Force augmented speed, agility, reflexes are second nature to her) | Relativistic+
      combat and reaction speed augmented by precognition | Relativistic+ combat and reaction speed augmented
      by precognition (Kept up with Darth Vader for most of their encounter)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Peak Human naturally, up to Class M with Force Amplification and Telekinesis (Should be at least
      comparable to Season 1 of Rebels Kanan Jarrus. Along with Plo Koon, she held up the collapsing command
      tower of a Venator-class star destroyer, a structure made with the same materials as but which dwarfs
      the AT-AT Walker, and should weigh several thousand tonnes at the very least. Can also clash with
      General Grievous. Should be more powerful than High-Republic knights, who stopped debris that destroyed
      moons in the Great Hyperspace Disaster) | Peak Human naturally, up to Class M with Force Amplification
      and Telekinesis (Superior to her past self) | Peak Human naturally, up to Class M with Force Amplification
      and Telekinesis
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: City Block level+ Force Amplification (Capable of trading blows with General Grievous, Asajj
      Ventress, briefly with Darth Maul) | City level+ | City level+ with Force Amplification (Can trade
      blows with Darth Vader)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Wall level naturally (Scaling from other Force Adepts). City Block level+ with Force Amplification
      (Survived a direct hit from the antipersonnel laser cannon of a Droid Gunship. Has taken blows from
      General Grievous and telekinetic assaults from Barriss Offee, whose power is such that Ahsoka thought
      she really was the genuine thing when impersonating Ventress) | City level+ | City level+ with Force
      amplification (Briefly blocked a blast of Sith Magic from Darth Sidious)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Capable of fighting at near peak despite days of little to no sustenance and rest.
      Capable of fighting against a Jedi Padawan to Knight level Force user despite just having run for
      multiple hours nonstop, then immediately go on to successfully raid an Imperial base and rescue
      prisoners. Has consistently showcased stamina beyond what would be capable of even the most physically
      fit normal humans)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range with lightsabers; Tens of Meters via Telekinesis; Galactic and Interdimensional
      with Force Sense (Should be superior to the likes of Kanan Jarrus and Ezra Bridger, who could sense
      Darth Vader's Dark Side power on the planet Lothal while still in orbit and likely at least comparable
      to the likes of the Asajj Ventress and the Grand Inquisitor, who could sense when Force Adepts had
      left a planetary system)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Unknown (Even in her early days as a Padawan, Ahsoka was unusually talented at lightsaber combat.
      Preferring an unorthodox reverse-hand grip as per the ancient version of Form V, she managed to
      single-handedly defeat three MagnaGuards and later went on to duel with infamous assassin Asajj
      Ventress as well as the infamous Jedi Hunter, General Grievous. Her skills only grew during her
      time in the order, switching to the Jar'Kai two sword style and surviving a second clash with Grievous
      even after he began using four swords at once. She is also a talented wielder of the Force, being
      so advanced in the use of telekinesis and Force Speed that her master, Jedi Knight Anakin Skywalker,
      sometimes forgot how young she was. Seventeen years after leaving the Jedi Order, she has honed
      her skills to mastery, casually defeating two Inquisitors, dueling former Sith Lord Darth Maul on
      even ground, and putting up a respectable fight against Darth Vader. In addition, the executive
      director of Rebels went so far as to say that Ahsoka's overall might was only rivaled by Vader and
      Sidious, further emphasizing the degree of her power and skill)
    source_ids: *id002
    confidence: 0.95
