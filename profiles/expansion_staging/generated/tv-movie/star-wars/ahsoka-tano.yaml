- id: claim-weaknesses-b932db1f
  section: weaknesses
  axis: weakness
  text: 'By the end of the series, Ahsoka has become overly reliant on her second lightsaber and thus
    will be significantly hampered should she somehow be unable to retrieve it | None notable l| None
    notable. Notable Attacks/Techniques: * Bleeding: Bleeding is the process that a Dark Side Adept used
    the Force to bend a kyber crystal to their will. Any kyber crystal could be bled, including their
    own if they were a former light side practitioner and kept their lightsaber. This process was accomplished
    by the individual pouring rage, hate, and pain into the crystal via the Force until the crystal turned
    crimson, resulting in the bloodshine lightsabers associated almost exclusively with dark side adepts.
    Some Sith believed that the proper method was to take a kyber crystal or crystals from a Jedi''s lightsaber
    and bleed it. After defeating the Sixth Brother, Ashoka manage to "heal" the effects of bleeding on
    a kyber crystal, by using the light side of the Force, thus changing the crystal''s color again. This
    allowed her to create her white lightsabers. * Telekinesis: Ahsoka can use this through the Force
    to put her mind literally over matter, capable of blasting opponents, shielding herself or disarming
    people, its limits are only those of the creativity that Force User has. Ahsoka showcased impressive
    telekinetic prowess even as a Padawan. She has crushed numerous LR-57 combat droids by bringing a
    large wall down on them, collapsed a several storey tall ice-cliff with the aid of six younglings,
    has blasted back Asajj Ventress, and has even blasted back the infamous General Grievous despite being
    somewhat exhausted. * Telepathy: Can easily manipulate others mentally with the Force to trick, deceive,
    maim or even kill outright. Can also use this power externally or internally when it comes to illusion
    creation, manifestation, and manipulation. Ahsoka has exhibited command of the Jedi power "Mind Trick".
    * Force Vision: A Force ability which grants the user the ability to witness past or future events
    in the form of psychic visions. They can be random and uncontrollable. A Force Adept could have a
    vision while asleep, in a meditative trance, or even when touching an object of some significance.
    Although once common, the ability had grown rare during the waning years of the Galactic Republic.
    Through this ability, Ahsoka had glimpses of attempts on the life of Senator Padme Amidala by bounty
    hunter Aurra Sing days in advance and also had glimpses of Ziro the Hutt, the one who hired Sing to
    assassinate Amidala. * Force Jump: Although a power common to most trained Force Adepts, it should
    be noted that Ahsoka is especially skilled with it. This makes sense since she is a Form IV Ataru
    specialist which places emphasis on speed & agility (including leaping ability). She has proven herself
    capable of just about keeping up with the likes of Anakin Skywalker and Plo Koon with this ability
    (themselves masters of Force Jump). She has also used this ability against a distracted Darth Vader
    - leaping towards him at high velocity and badly damaging his helmet with a lightsaber strike. ==Notable
    Matchups== Victories: Thanos (Fortnite) Thanos'' Profile (Clone Wars Season 1-6 Ahsoka was used and
    speed was equalised) Losses: Obi-Wan Kenobi (Star Wars) Obi Wan''s profile (This was Kenobi in Revenge
    of the Sith and Ahsoka during the Siege of Mandalore, canon versions were used and speed was equalized)
    Inconclusive: {{Discussions}} Category:Characters Category:Movie Characters Category:Cartoon Characters
    Category:Star Wars Category:Jedi Category:Mind Users Category:Sword Users Category:Psychics Category:Energy
    Users Category:Primary Protagonists Category:Protagonists Category:Heroes Category:Good Characters
    Category:Female Characters Category:Chi Users Category:Aliens Category:Martial Artists Category:Telepaths
    Category:Telekinesis Users Category:Memory Users Category:Regeneration Users Category:Science Fantasy
    Characters Category:Clairvoyance Users Category:Precognition Users Category:Forcefield Users Category:Psychometry
    Users Category:Dual Wielders Category:Prisoners Category:Freedom Fighters Category:Survivors Category:Adults
    Category:Humanoid Characters'
