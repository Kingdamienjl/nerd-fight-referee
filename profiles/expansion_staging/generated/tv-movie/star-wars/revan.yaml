    - mediawiki-9223
    confidence: 0.95
  attack_potency:
    text: "Planet level (Stronger than Darth Malak. Meetra Surik mused that of all the people she\u2019\
      s met, which includes both herself and Darth Nihilus, the latter of which she knew could hold massive\
      \ starships together through pure force of will, Revan\u2019s command of the Force is the greatest.\
      \ Was also considered by Ajunta Pall to have \"blinding\" power) | At least Planet level (Darth\
      \ Malak acknowledged Revan had grown superior to his previous power as Darth Revan, who was already\
      \ stronger than Malak) | Solar System level (At his best, he nearly matched Vitiate. Lord Scourge\
      \ perceived futures where both Revan or Vitiate could have come out on top in their fight) | Planet\
      \ level (Despite being weakened by having his mind ravaged and powers drained for over 300 years,\
      \ Revan was still capable of resisting the Emperor's mental powers better than he had after his\
      \ experiences during the Mandalorian Wars. Capable of fighting against a strike team of the Empire's\
      \ strongest warriors, including Darth Nox) | Solar System level (Fought against a strike team of\
      \ all of the galaxy's most powerful champions, even including the Hero of Tython, and was only barely\
      \ defeated)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Relativistic. FTL reactions and combat speed (Can easily reflect multiple blaster bolts at once)
      | Relativistic. FTL reactions and combat speed (Comparable to Malak) | Relativistic. FTL reactions
      and combat speed | At least FTL+ reactions and combat speed (Kept pace against Vitiate) | Relativistic.
      FTL reactions and combat speed | At least FTL+ reactions and combat speed (Kept up with the Hero
      of Tython).
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Peak Human. Superhuman via Force Amplification, Class G with Telekinesis.(Superior to Padawan
      Rivi-Anu who while grievously wounded and exhausted, briefly held up a Venator-class Star Destroyer,
      a class of warship whose mass is in the range of millions of tonnes)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Planet level with Force Amplification (Physically capable of contending with the likes of 2
      Terentatek at once) | At least Planet level with Force Amplification | Solar System level with Force
      amplification | Planet level with Force amplification | Solar System level with Force amplification.
    source_ids: *id002
    confidence: 0.95
  durability:
    text: "Street level naturally. Planet level with Force Amplification (Proved capable of resisting\
      \ complete atomization of his body while on Nathema just after having fought through the Mandalorian\
      \ Wars. More powerful than Malak, and thus more durable) | Street level naturally. At least Planet\
      \ level with Force Amplification | Street level naturally. Solar System level with Force Amplification\
      \ (He survived repeated telepathic and telekinetic attacks from the Sith Emperor. Also proved himself\
      \ capable of withstanding a bloodlusted Sith Emperor\u2019s Force Lightning for a brief period of\
      \ time, albeit is caused him great agony) | Street level naturally. Planet level with Force Amplification\
      \ | Street level naturally. Solar System level with Force Amplification."
    source_ids: *id002
