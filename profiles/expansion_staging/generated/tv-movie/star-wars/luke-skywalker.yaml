- id: claim-weaknesses-61ea25d8
  section: weaknesses
  axis: weakness
  text: 'Inexperienced, only possesses a tentative grasp of his powers | Incomplete training, inexperienced
    as a true lightsaber duellist, still lacks proper control over his abilities | None notable | None
    notable Notable Attacks/Techniques: *Force Barrier: A defensive Force power that creates a barrier
    or wall of Force energy around the intended target, be itself, friend, or foe. Depending on the strength
    of the individual, the barrier could only withstand a few attacks before collapsing. Luke has demonstrated
    considerable prowess with the power, even protecting himself from objects Darth Vader telekinetically
    threw at him during the duel on Bespin. *Telekinesis: Luke Skywalker can use this through the Force
    to put his mind literally over matter, capable of blasting opponents, shielding himself or disarming
    people. Its limits are only those of the creativity that Force User has. *Telepathy: Can easily manipulate
    others mentally with the Force to trick, deceive, maim, or even kill outright. Luke Skywalker has
    a considerable mastery for the power, able probe for hidden thoughts in the minds of others, and learn
    them for himself. *Force Projection: Was the visual manifestation of a Force user who had the ability
    to seemingly appear in one place while actually being elsewhere. Jedi Master Luke Skywalker projected
    an image of himself into the Battle of Crait to confront his nephew, Kylo Ren, which resulted in Skywalker''s
    death due to the prolonged and strenuous energy needed to maintain the illusion. Note: ==Notable Matchups==
    Victories: Losses: * Albert Wesker (Resident Evil) Albert Wesker''s Profile (Post A New Hope - Star
    Wars (Marvel 2015) comics Luke was used and speed was equalized) * Harry Potter (Wizarding World)
    Harry''s Profile (Post A New Hope - Star Wars (Marvel 2015) comics Luke was used and speed was equalized)
