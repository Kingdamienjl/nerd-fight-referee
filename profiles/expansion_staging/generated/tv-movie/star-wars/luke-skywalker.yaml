  attack_potency:
    text: Large Building level (Scaling from his durability, same as defensive power but just directed
      towards offence, managed to quake an Imperial II-class Star Destroyer, albeit in a moment of rage
      and he had no control over his power) | City level+ (Shortly after his defeat at Cloud City, Luke
      fought and defeated the Grand Inquisitor's spirit, who described him as 'so strong'. By this point,
      he should be more powerful than High-Republic knights, who stopped debris that destroyed moons in
      the Great Hyperspace Disaster) | City level+ (Surpassed Darth Vader, heavily implied to have become
      a significant threat to Darth Sidious) | At least City level+ (Implied to be far more powerful than
      during the end of the Galactic Civil War. Supreme Leader Snoke told Kylo Ren that Luke was one of
      the most formidable Jedi ever, and that Luke had earned his respect and even his fear; he further
      went on to say that if he had Luke by his side instead of Kylo Ren, the galaxy would have been his
      a long time ago. While projecting himself to Crait, his Force power was great enough to quake his
      island home on Ach-to)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Relativistic+ combat and reaction speed (Can trade strikes with IG-100 Magnaguards, which are
      capable of trading strikes with Force Adepts on the level of Jedi Knights, such as Nahdar Vebb and
      Ahsoka Tano, all of which are comparable to Clone Wars' Obi-Wan, who can deflect a laser), Relativistic+
      to Speed of Light attack speed with blaster weaponry (Most energy weapons, including Blasters, Laser
      Cannons and Turbolasers, direct invisible beams at lightspeed. The bolt seen when a weapon is fired
      is actually a pulse of plasma traveling along the beam at less than lightspeed"Naval Weapons and
      Equipment". Star Wars Encyclopedia. De Agostini Publishing, 2021) | Relativistic+ combat and reaction
      speed (Capable of trading strikes with a slightly holding back Darth Vader. Far superior to his
      post Battle of Yavin self) | Relativistic+ combat and reaction speed (Matched his father in combat.
      Should be at least on the level of strong Jedi Masters and Councilor level Jedi by this time, which
      would put him in the same league as the likes of Clone Wars era Obi-Wan Kenobi and Anakin Skywalker)
      | Relativistic+ combat and reaction speed (Casually out-dueled Rey once he regained his connection
      to the Force and despite at least six years of being out of practice. Likely at least comparable
      to his Return of the Jedi self)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Peak Human naturally, up to Unknown with Force Amplification and Telekinesis | Peak Human naturally,
      up to Class M with Force wielding (By this point, he should be more powerful than High-Republic
      knights, who stopped debris that destroyed moons in the Great Hyperspace Disaster) | Peak Human
      naturally, up to Class M with Force wielding (Superior to Padawan Ahsoka Tano and Kanan Jarrus as
      of the Battle of Endor. Should also be superior to Battle of Crait Rey, who was able to lift a great
      deal of rock once she put her mind to the task and allowed the Force to flow through her) | Peak
