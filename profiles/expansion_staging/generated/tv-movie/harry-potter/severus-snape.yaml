  attack_potency:
    text: Wall level physically. Building level with magic (One of the most powerful and respected Death
      Eaters, feared by the likes of Dolohov and Yaxley, and should be comparable to Bellatrix Lestrange.
      Effortlessly stomped Harry in a duel. Duelled Minerva McGonagall, who was capable of fighting Voldemort
      alongside Kingsley Shacklebolt and Horace Slughorn, while holding back and fought capably but then
      fled after the interference of Flitwick, Sprout and Slughorn). Some spells also ignore conventional
      durability.
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "Athletic Human with Subsonic reactions (Arguably faster than Harry Potter and beat him to the\
      \ draw) and flight speed, Speed of Light attack speed via Lumos Solem (Lumos Solem is a charm that\
      \ creates a blinding flash of sunlight used to defend against the Devil's Snare. Snape should know\
      \ this spell, as it\u2019s implied to be taught in basic herbology to defend against the Devil's\
      \ Snare and advanced charms class, and first years like Hermione have showcased this spell)"
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Athletic Human by himself (Was able to lift a 15 year old Harry Potter. Should be comparable
      to other wizards). Class 5 with spells (Comparable, if not superior, to Ron Weasley. Sent Harry
      Potter flying backwards effortlessly).
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Wall level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Wall level (Comparable to Harry Potter) physically. Large Building level, likely higher with
      magical shielding (Should be comparable to Mad-Eye Moody, who was capable of creating defences Voldemort
