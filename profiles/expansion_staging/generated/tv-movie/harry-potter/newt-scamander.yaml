- id: claim-weaknesses-43cda0cc
  section: weaknesses
  axis: weakness
  text: 'Unknown Notable Attacks/Techniques: List of Spells seen used by Newt: *Accio: This charm summons
    an object to the caster, potentially over a significant distance. It can be used in two ways; either
    by casting the charm and then naming the object desired, or by pointing your wand at the desired object
    during or immediately following the incantation to "pull" the target toward the caster; in either
    case, the caster must concentrate on the object they wish to summon in order for the charm to succeed.
    The caster doesn''t necessarily need to know the location of the target if they say the name of the
    object to be summoned. *Revelio: This charm is used to reveal concealed objects, messages, invisible
    things, and passages. It was considered difficult for a second year student. *Apparition: Wizarding
    transportation. *Petrificus Totalus: A curse that paralyzes the opponent. *Repairo: A charm that "repairs"
    a broken object to it''s original state. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}}
    Category:Characters Category:Wizarding World Category:Movie Characters Category:Humans Category:Wizards
    Category:Summoners Category:Dimensional Storage Users Category:Teleportation Users Category:Matter
    Users Category:Status Effect Users Category:Weather Users Category:Memory Users Category:Transmutation
    Users Category:Healers Category:Paralysis Users Category:Parasol Users Category:Wand Users Category:Magic
    Users Category:Attack Reflection Users Category:Mind Users Category:Air Users Category:Power Nullification
    Users Category:Healers Category:Illusionists Category:Light Users Category:Animal Users Category:Writers'
  source_ids: *id003
  decisive: false
  status: unverified
