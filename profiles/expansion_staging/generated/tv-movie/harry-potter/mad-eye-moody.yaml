    Wanding-Light Charm, BFR with the Vanishing Spell and Boggart-Banishing Spell, Invisibility with the
    Disillusionment Charm, Memory Manipulation with the Memory Charm (Can erase, alter and create memories),
    Summoning with the Patronus Charm, Teleportation via Apparition, likely Pain Manipulation and Death
    Manipulation (Barty Crouch Jnr while disguised as Moody, was able to demonstrate the Unforgivable
