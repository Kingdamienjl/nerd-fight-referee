    fast opponents can dodge it and it can be stopped by throwing another object (or victim) in the way
    * Crucio: She curses the opponent to feel unspeakable amounts of pain, usually incapacitating the
    target unless they possess unusually high resistance to pain. Continued exposure can fry the victim''s
