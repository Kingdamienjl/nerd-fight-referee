power_scale:
  tier:
    text: '{{9-B}} physically. {{High 8-C}} with magic | {{9-B}} physically. At least {{High 8-C}} with
      regular spells, {{Low 7-C}} with more powerful spells'
    source_ids: &id002
    - mediawiki-514278
    confidence: 0.95
  attack_potency:
    text: Wall level physically. Large Building level with magic (Was said by many to be the second most
      powerful Dark Wizard ever, and hence shouldn't be overwhelmingly weaker than Voldemort. Fought the
      Dumbledore brothers in a three-way duel. Easily overpowered Newt Scamander) | Wall level physically.
      At least Large Building level with magic (Likely superior to old Dumbledore. Described repeatedly
      as Prime Dumbledore's equal in power and two of the strongest wizards with the Elder Wand, which
      would make him superior to Voldemort, as the latter was unable to match Old Dumbledore. Created
      a fire that was eventually going to burn down Paris and summoned multiple lightning bolts. Contended
      with Dumbledore much better than Credence Barebone did), Small Town level+ with more powerful spells
      (Dueled Prime Dumbledore in a legendary duel and was described to have lost only because he was
      slightly less skilled, with Dumbledore admitting in terms of power, they were evenly matched). Several
      of his spells can ignore conventional durability.
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "Athletic Human with Subsonic reactions (His fires disintegrated two Aurors mid-apparation.\
      \ Able to match Dumbledore), Speed of Light attack speed via Lumos Solem (Lumos Solem is a charm\
      \ that creates a blinding flash of sunlight used to defend against the Devil's Snare. Grindelwald\
      \ should know this spell, as it\u2019s implied to be taught in basic herbology to defend against\
      \ the Devil's Snare and advanced charms class, and first years like Hermione have showcased this\
      \ spell)"
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Athletic Human physically. Class 5 to Class 10 with magic (Comparable to Dumbledore. Threw a
      car on Tina Goldstein with wandless magic) | Athletic Human physically. Class 5 to Class 10 with
      magic (Should be stronger than before)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Wall level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Wall level (Should be comparable to Harry Potter) physically. Large Building level, likely higher
      with magical shielding (Should be far superior to a bounty hunter capable of blocking attacks from
      Credence's Obscurus. Protected himself from over ten aurors simultaneously) | Wall level physically.
      Large Building level, likely higher with magical shielding (Capable of blocking attacks from Albus
      Dumbledore. Should be far stronger than before)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Fought Dumbledore for 3 hours)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Tens of Meters with most spells. At least Tens of Kilometers with Teleportation and with magic
      (His fire was going to spread over all of Paris. Should be comparable to Dumbledore)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius. An extraordinarily skilled dark wizard, his skills, mastery, and understanding of magic
      were acknowledged to be very nearly equal to Albus Dumbledore, their duel being considered the greatest
      duel ever. Should be more skilled than Voldemort, as he was overwhelmed by Dumbledore in his elder
      days while Grindelwald gave Dumbledore a prolonged fight in their primes. Grindelwald was an exceptional
      strategist and leader as an adult, whose expertise was perhaps best shown by his ability to start
      a massive revolution on his own, gathering a large number of followers to establish a new wizarding
      world order and strategically overwhelming much of the Wizarding world to the point that Dumbledore's
      tactical advice ultimately proved fruitless, requiring Dumbledore's direct intervention to finally
      put an end to his For the Greater Good revolution. He was an exceedingly skilled manipulator who
      was even able to once manipulate Dumbledore himself and could convince crowds of followers to join
      him, even manipulating a trained group of Aurors to create a martyr out of a member of his army.
      He was even able to manipulate Credence and Queenie into joining him despite their clear wariness
      of him. Grindelwald also proved to be a consummate actor, multitasker and investigator, as during
      his time disguised as Graves, Grindelwald was able to perfectly mimic his personality and American
      accent, and limit his magical abilities to be only on par with Graves, as well as convincingly and
      effectively carry out Graves' many duties, while also gradually managing to locate the rampaging
      Obscurial, all without arousing suspicion.
    source_ids: *id002
    confidence: 0.95
