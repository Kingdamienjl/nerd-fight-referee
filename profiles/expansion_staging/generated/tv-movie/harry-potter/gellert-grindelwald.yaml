    shockwaves), Weather Manipulation (Used Magic to control the weather during his escape from the MACUSA),
    Healing (Healed the cuts on Credence's hands wandlessly and non-verbally, by simply touching them),
    Biological Manipulation (Conjured a new forked tongue for Abernaty), Necromancy (Wandlessly reanimated
    a Qilin and bend it to his will), Transmutation (Transfigured the reigns of his Incarceration Carriage
    into living snakes), Deconstruction (Desintegrated two Aurors's wands), Memory Manipulation (Removed
    Yusuf's memories of Leta's death), Invisibility with the Disillusionment Charm, Precognition (Is a
    powerful seer), Illusion Creation and Smoke Manipulation (Made an illusion of notable events from
    World War II to his followers out of smoke. Can also project images with spells), Shapeshifting (Transformed
    himself into an exact replica of Percival Graves for an extended period of time. Turned himself into
    one of his followers), Teleportation via Apparition, Genius Intelligence, Social Influencing (Can
    sway entire crowds to join his side. MACUSA was forced to cut out his tongue after he convinced 3
