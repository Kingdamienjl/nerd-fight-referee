      of Aurors would not have stood a chance against McGonagall in broad daylight), higher in her prime
      (Was likely over a hundred years old during the events of the Second Wizarding War and was noted
      to be old). Some spells also ignore conventional durability
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "Athletic Human with Subsonic combat speed and reactions (Kept up with Voldemort), Speed of\
