- id: claim-weaknesses-072e9771
  section: weaknesses
  axis: weakness
  text: 'Extremely reckless, immature and even downright irresponsible. Risked getting caught by the Ministry
    of Magic merely because he was bored in his house. Arrogant and too casual in combat, such as when
    he taunted Bellatrix Lestrange to do better which ultimately led to his demise. Has an explosive temper,
    as demonstrated when he shredded the portrait of the Fat Lady when he was not allowed access into
    the Gryffindor dormitory. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters
    Category:Male Characters Category:Humans Category:Dogs Category:Magic Users Category:Telekinesis Users
    Category:Teleportation Users Category:Transformation Users Category:Transmutation Users Category:Paralysis
    Users Category:Summoners Category:Water Users Category:Fire Users Category:Temperature Users Category:Explosion
    Users Category:Pain Users Category:Light Users Category:Biology Users Category:Size Users Category:Memory
    Users Category:Sound Users Category:Holy Users Category:Earth Users Category:Deconstruction Users
    Category:Curse Users Category:Status Effect Users Category:Creation Users Category:BFR Users Category:Healers
    Category:Vehicular Masters Category:Wizarding World Category:Tragic Characters Category:Wand Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
