  section: weaknesses
  axis: weakness
  text: "Somewhat mentally unstable, and sometimes he doesn\xB4t take things seriously. Extremely arrogant\
    \ ==Gallery== JpzZ2rT.jpg ==Notable Matchups== Victories: Rick Taylor (Splatterhouse) Rick's Profile\
    \ (Rick from the Original Series was used and Ash carried all of his weapons. They fought in a forest)\
    \ Denji (Chainsaw Man) Denji's Profile (Base Denji was used and Ash didn't have the Book of the Dead\
    \ or the Kandarian Dagger. Speed was equal and both had prior knowledge) Losses: Inconclusive: Frank\
    \ West (Dead Rising) Frank's Profile (Frank West only had his 9-B weapons, Ash had the Book of the\
    \ Dead, and Speed was equalized) {{Discussions}} Category:Characters Category:The Evil Dead Category:Brawlers\
