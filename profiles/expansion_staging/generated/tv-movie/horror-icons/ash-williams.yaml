    \ Characters Category:Acrobats Category:Preparation Users Category:Vehicular Masters Category:Time\
    \ Users Category:Body Control Users Category:Regeneration Users Category:Durability Negation Users\
    \ Category:Supernatural Willpower Users Category:Murderers Category:Comedy Characters Category:Disabled\
    \ Characters Category:Adults Category:Blade Users Category:Weapon Users Category:Dual Wielders"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
