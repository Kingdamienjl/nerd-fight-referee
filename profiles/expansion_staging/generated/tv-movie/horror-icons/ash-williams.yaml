- id: claim-powers-and-abilities-50bc8551
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Expert Marksman and Unarmed Combatant, Vehicular Mastery,
    Acrobatics (Capable of performing this), Preparation (Formed a plan to take on an army of Deadites,
    which involved making gun powder with the guidance from few textbooks, training medieval soldiers,
    and creating the Battle Car, a modified 1973 Oldsmobile Delta 88), Supernatural Willpower (He was
    able to survive nearly 2 days in the cabin, resisting extreme physical and mental torture in the process,
    was able to strangle a possessed Kelly even when unconscious, was able to resist possession and was
    also able to resist Baal''s attempt to control his mind), Instinctive Reaction (Killed Eligos without
    thinking), Limited Body Control (Could reshape his skull after being extremely stretched), Possibly
    Regeneration (Low; Had the flesh ripped from his leg in the first film but was fine by the second
    movie which takes place in less than a day after the first one, his stump stopped bleeding just moments
    after cutting his hand off, he was also able to quickly recover from the damage that Eligos did to
    his Brain and Neurons), Resistance to the following: Dream Manipulation (Prevented Eligos from controlling
    his dream), Mind Manipulation (Baal a demon capable of controlling anyone''s mind, couldn''t control
    Ash''s mind), Possession (Was able to resist possession), Heat Temperatures (Was able to drink a teapot
    full of boiling water twice), Pain (Gets constantly beaten by Deadites, was able to keep running after
    crashing his car and hitting his head on the ground, severed his own hand with a chainsaw and did
    not demonstrate any signs of pain moments later, pierced his own leg with a scissor and simply shrugged
    off, was able to keep fighting against Baal even after having his hand severed again). Has Durability
    Negation with Kandarian Dagger and Dimensional/Time Travel with Necronomicon'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
