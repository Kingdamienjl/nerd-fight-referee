power_scale:
  tier:
    text: '{{9-B}}, higher with Mechanical Gauntlet Name: Ashley Joanna "Ash" Williams, The Chosen One,
      The Hero from Sky, The Savior of Humanity, Ashy Slashy, El Jefe Origin: The Evil Dead Age: 25 in
      the trilogy, 50''s in Ash vs Evil Dead Gender: Male Classification: Human, The Chosen One'
    source_ids: &id002
    - mediawiki-11640
    confidence: 0.95
  attack_potency:
    text: Wall level+ (Has slain and killed Deadites that can punch through wooden walls. Held a door
      against the Kandarian Demon, who has split apart small trees and flipped over cars. Broke out of
      a Deadite-possessed Doctor's grip, who could punch through a metal table, which should be on this
      level), higher with Mechanical Gauntlet (Superior to his normal arm. Casually crushed an iron goblet,
      has easily overpowered and killed multiple Deadites with it, and it held against a sword-wielding
      Evil Ash). Ignores conventional durability with Kandarian Dagger
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Superhuman (Outran The Kandarian Demon that was gaining on him while Ash was on horseback, and
      has kept up with a car) with Supersonic combat speed and reactions (Can dodge his own boomstick
      shots fired at him, and can keep up with the Deadites, who are also capable of reacting to the shots
      of Ash's boomstick)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class K (He was able to contain the strength of the Kandarian Demon, who is capable of overturning
      cars. Can physically compete with Deadites)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Wall level+ (Busted right through a wooden door without effort, making him this strong; has
      punched through Deadite Skeletons and even broke one's spine with a backbreaker), higher with Mechanical
      Gauntlet
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Wall level+ (Survived being thrown through a wooden staircase, can charge right through a wooden
      door without any injuries, lived after being thrown through a stone wall. Withstood being thrown
      several hundred feet into a tree by the Kandarian Demon. Should be comparable to Evil Ash, whose
      skull tanked a point-blank shotgun blast, with it only dislocating his jaw and blasting the skin
      off of it), higher with Mechanical Gauntlet (Has easily blocked blows from a sword-wielding Evil
      Ash)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (He lasted approximately 2 nights in the cabin without adequate rest to later go
      to fight Deadites. He can continue fighting even after receiving fatal injuries such as cutting
      his hand or even being stabbed.)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, Extended Melee Range with his chainsaw, Tens of Meters with his boomstick
      and shotgun, Kilometers with the Book of the Dead.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (Has decades of knowledge and experience of fighting Deadites. Very good mechanical knowledge,
      such as creating his own mechanical hand. Has presented the ability to quickly adapt to situations
      to ensure his own survival in battle. Capable of modifying a 1973 Oldsmobile Delta 88 into a battle
      vehicle only using materials from 1300 A.D. and the few materials left in the trunk of the car)
    source_ids: *id002
    confidence: 0.95
