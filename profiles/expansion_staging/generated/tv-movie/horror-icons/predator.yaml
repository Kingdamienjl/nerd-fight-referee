- id: claim-standard-equipment-3352dfee
  section: equipment
  axis: equipment
  text: '*Greater Enhanced Senses, Information Analysis, and Vocal Mimicry (The Bio-Mask; Allows Predators
    to know the targets emotional state, whether they are hostile or civilian, as well as the health of
    the target. It can also to mimic voices to intimidate or lure prey) *Analytical Prediction (The Bio-Mask
    can predict and anticipate strikes and calculate the trajectory for killshotsPredators: Surviving
    Life) *Extrasensory Perception (The Sat-Com can map the terrain, as well as locate nearby enemies
    or objects) *Statistics Amplification and Forcefield Creation (When a Predator is severely injured
    The Second Wind Device will send a jolt of energy that cauterizes all wounds while giving the hunter
    a burst of speed and a temporary forcefield) *Limited Technology Manipulation (Predators such as the
    Disc Masters have the ability to control Smart discs with their minds) *Camouflage (Via Cloak; which
    allows them to become virtually invisible) *Energy Manipulation (Predators can shoot energy blasts
    out of their Wrist GauntletsAliens vs Predator: War) *Fire Manipulation (Predators can attach portable
    flamethrower packs onto their wrists. The Blazer Military Armor uses arcing Inferno Beams which can
    reach temperatures that are hotter than many stars at their core), *Electricity Manipulation (Electroshock
    Bolas carry a powerful electrical current strong enough to instantly kill most victimsPredator: Big
    Game) *Plasma Manipulation (Many different weapons used by Predators are plasma based. Scout ships
    come armed with Plasma cannons) *Deconstruction (The Vanguard Armor has a Killscreen Generator which
    emits unstable streams of dark plasma particles that vaporize incoming enemy projectiles) *Self-Destruction
    (Via Self-Destruct Device) *Spaceflight *Minor Electricity Manipulation (Scout ships have an internal
    electroshock defense systemAlien vs Predator: Thicker than Blood) Resistance to: *Fire Manipulation
    and Acid Manipulation (Both the Hydra Military Armor and Blazer Military Armor grant resistance to
    fire and acid damage)'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-9400ceed
  section: weaknesses
  axis: weakness
  text: "Predators evolved to breathe a slightly different atmosphere than Earth's and often require breathing\
    \ apparatuses to breathe properly, though these are not necessary for survival. Their blood glows\
    \ in the dark, making it easy to track them by it in low-light conditions. A Predator's cloaking systems\
    \ short-circuit when exposed to water. Their code of honor makes many Predators reluctant to fight\
    \ those that cannot fight back, or those that are ill or pregnant. They dislike using their advanced,\
    \ high-powered weaponry against worthy prey unless necessary, often handicapping themselves by abandoning\
    \ their ranged weapons and even armor to better enjoy a hunt or honor a skilled foe, though there\
    \ are those that lack such morals. Since their Bio-Masks use infrared to see, Predators cannot see\
    \ things with low temperatures. Notable Weapons and Technology: A full list of Yautja technology and\
    \ weapons can be seen here and here Predator Bio-masks.png| Various Bio-Masks Celtic's Bio-Mask.webp|Celtic's\
    \ Bio-Mask Elder Predator Bio-Mask.webp|An Elder Predators Bio-Mask - Bio-Mask: In addition to simple\
    \ protection, the Predator's unique visor provides many functions, such as a breathing apparatus,\
    \ a translator, voice mimicry systems, audio and visual recorders, the ability to zoom in on distant\
    \ objects and targets, and the Plasmacaster targeting systems. The Bio-Mask has many different systems\
    \ that perform various tasks that aid in a hunt, such as predicting and anticipating strikes, calculating\
    \ the trajectory for killshots, picking up brain waves to help alert the user for danger, identifying\
    \ a\u200B\u200B weapon and its ammunition. Of these systems, the best known and most used are their\
    \ imaging systems, which allow Predators enhanced sight through a number of different settings, such\
    \ as thermal and ultraviolet vision, electromagnetism-based sight, tech vision that allows them to\
    \ spot and analyze mechanical systems, and neuro vision allowing for the analysis of a target's emotional\
    \ state, among many others that have not yet been fully demonstrated. Predator Combi stick extended.webp|A\
    \ fully extended Combistick FVPlasmacaster2.webp|Plasmacaster concept art Smart Disc BTS-P2.webp|A\
    \ Smart Disc Pred Plasma gun.webp|A Plasma Pistol Predator Dissolving Acid.png|Concept art of Dissolving\
    \ Acid Predator Falcon.png| Bird-like spying drone used by Predators Predator Netlauncher1.webp|The\
    \ Netgun used by Predators Pred ShurikenPNG.webp|Predator Shuriken replica from Slideshow Collectibles"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-7b62d232
  section: abilities
  axis: hax
  text: 'Base= *Superhuman Physical Characteristics *Enhanced Senses (Yautja see in the infrared spectrum,
    Predators can also emit a pulse from its body that immediately tracks and highlights the location
    of its preyPredator: Hunting Grounds) *Martial Arts (Elite and Veteran Predators are stated to have
    a more complex and dangerous martial art than any Machiko Noguchi had ever seen who was heavily trained
    from a young age in multiple martial artsAliens vs. Predator: Prey) *Weapon Mastery (Predators are
    trained in many different weapons. Spear Masters and Disc Masters are stated to be impossibly skilled
    in their respective artsAliens versus Predator: Extinction) *Longevity (Predators can live to be thousands
    of years old) * Regeneration (Low; Predators have a minor healing factor which lets them heal broken
    ribs in around a dayAliens vs. Predator (comic series)) *Acrobatics (Predators can jump several meters
    and jump across trees with ease) *Stealth Mastery (Most Predators sneak up on, stalk, and ambush their
    opponents) Resistance to: *Diseases (Predators have advanced immune systems that render them highly
    resistant to most bacteria and viruses) *Acid Manipulation (A Predator''s blood can neutralize Xenomorph
    acid to lessen its effects) *Poison Manipulation (Predators are highly resistant to toxins, in that
    they are practically unaffected by an attempt to poison them with a blood chemistry based toxin created
    by someone who had created an entire bio-dome with an approximate atmosphere and environment of what
    could be the Predator Homeworld) *Radiation (Predators can survive exposure to amounts of radiation
    that would prove lethal for humans) |-|With'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
