- id: claim-weaknesses-65363dec
  section: weaknesses
  axis: weakness
  text: "An extreme temperature change can heat up their acid blood and cause them to explode. Notable\
    \ Attacks/Techniques: {{Scroll box|content= Sfkmkzpmavh2jbrpcvur.gif|Head Bite IndolentRichHogget-mobile.gif|Acid\
    \ Spit * Head Bite: Arguably a Xenomorph\u2019s most notable attack, involving the use of their inner\
    \ jaw to pierce the victim's skull and fatally destroy the brain. The striking force of the Xenomorph's\
    \ inner jaw is extremely powerful, able to pass completely through both sides of the skull. * Acid:\
    \ Certain castes of Xenomorph have evolved to use their acid blood in a more offensive manner. Drones,\
    \ for example, have developed a highly pressurized bloodstream that can cause them to physically explode\
    \ if sufficiently damaged, showering the surrounding area in acid. Runners have been shown to be able\
    \ to spit acid and Xenomorphs Bursters will explode once killed.Aliens: Fireteam Elite - The Only\
    \ Way to be Sure - LOG 4 * Eggmorphing: When absent of a hive, a Xenomorph Drone will begin taking\
    \ hosts and cocooning them in a secreted resin that exposes them to enzymes and growth hormones that\
    \ gradually shapes their body into that of an Ovomorph.Alien RPG Core Rulebook - pg. 305 The Drone\
    \ will then inject genetic material from the barb of its tail into the host, allowing it to incubate\
    \ a Facehugger and continue the life cycle. }} ==Gallery== {{Scroll box|content= Necronom IV.jpg|Necronom\
    \ IV, the original art of which that inspired the Xenomorph ALIEN2-2404277258.jpg|Giger's Refined\
    \ Design Alien-1-2434899695.jpg Alien4 Egg.jpg|Ovomorph, known colloquially as a Xenomorph Egg Xenos-ign-burster-1614990887441-76419151.jpg|Xenomorph\
    \ Burster Aliens5-640x368-2167927695.jpg|Xenomorph Prowler Aliens-fireteam-spitters-1259901-11193139.jpg|Xenomorph\
    \ Spitter Screenshot 20161224-141337-1234078769.jpg|Alien King Aliens-Infiltrator-Lisez-un-extrait-exclusif-du-nouveau-1110866644.jpg|Albino\
    \ Super-Drone Xenomorph Alien-Corridor-2-1726155673.jpg Captura-de-pantalla-2013-09-26-a-las-14.44.17.jpg|More\
    \ intricate look at the front of a facehugger. Article pic.jpg|Egg Silo 250-1945541395.png|Hive Resin\
