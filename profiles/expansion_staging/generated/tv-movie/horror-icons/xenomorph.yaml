  text: "Facehugger= *Dream Manipulation (Facehuggers can cause nightmares.Alien Isolation (Comic) p.\
    \ 10-19 Kane would go on to suffer these nightmares as wellAlien (1979)) *Bodily Weaponry (Conventional\
    \ and Unconventional; Tail, Acid, etc) *Paralysis Inducement (The facehugger can paralyze their victim\
    \ whenever they get in physical contact with themAliens Inflitrator: Chapter 22) *Stealth Mastery\
    \ *Small Size (Type 1; Its 'body' can reach around someones face, its tail makes up most the length\
    \ of its body) *Acid Manipulation (Like Other Xenomorphs, have acid blood. A small spill of its acid\
    \ was going to eat through the hull of a ship) *Self-Sustenance (Type 1; Capable of thriving in space,\
    \ like its brethren) |-|Xenomorph= {{#tag:tabber| {{!}}-{{!}}Chestburster= *Reactive Evolution & Power\
    \ Mimicry (Aliens are capable evolving rapidly to incorporate things like diseases into their genetic\
    \ makeup. Chestbursters incorporate traits from the host into their genetic makeup, and is thus capable\
    \ of gaining the powers, abilities, and strength of the host through thisAlien: The Weyland-Yutani\
    \ Report, p. 25) *Acid Manipulation *Bodily Weaponry (Conventional and Unconventional - Tail, Acid,\
    \ Teeth) *Accelerated Development (Shortly after emerging, a chestburster will molt into a full adult\
    \ Xenomorph, which usually takes less than a day) *Stealth Mastery (Kane's chestburster easily remained\
    \ hidden from the Nostromo crew) *Small Size (Type 0; No more than a foot tall and about two feet\
    \ in lengthAlien\xB3 Special Edition (2003)) {{!}}-{{!}}Adult Xenomorphs= *Superhuman Physical Characteristics\
    \ *Self-Sustenance (Type 1; Capable of thriving in space, as shown here,Alien Isolation - Mission\
    \ 18 here, and hereAliens Defiance #8) *Bodily Weaponry (Conventional and Unconventional - Tail, Acid,\
    \ Pharyngeal Jaw, Teeth) *Acid Manipulation (Xenomorphs have acid stronger than their previous forms\
    \ and any on Earth. Their acid can break molecular bonds with ease. A Xenomorphs Acid can last long\
    \ enough to eat through a bridge support cableAliens: Dust to Dust #3 and should be superior to a\
    \ facehuggers blood of which can eat through the hull of a ship. Xenomorph acid is capable of corroding\
    \ through the dome, which is made of a thick plastic,Alien Echo: Chapter 19 that is also bulletproofAlien\
    \ Echo: Chapter 12) *Large Size (Varies; from Types 0 to 1 - Tower over humans, Large Castes like\
    \ Praetorians and Crushers tower over regular Xenomorphs, reaching almost to sizes similar to that\
    \ of a queen.Aliens: Fireteam Elite - The Only Way to be Sure - LOG 7 Xenomorph Queens can reach up\
    \ to 6 meters in height, if not largerAlien RPG Core Rulebook - pg. 316) *Surface Scaling (Can crawl\
    \ on ceilings, smooth walls,Alien Echo: Chapter 11 and up vertical ventsAlien: Blackout) *Stealth\
    \ Mastery (Xenomorphs do not show up on infrared, capable of sneaking up on trained marines and pilots,Aliens\
    \ (1986) as well as utilizing environmental advantages such as ventilation systems to ambush their\
    \ prey) *Adhesive Manipulation (Xenomorphs can secrete a resin that hardens into a shell of solid\
    \ material. Castes like the worker xenomorphs specialize in this, and can produce and spin resin with\
    \ their long tonguesAlien RPG Core Rulebook - pg. 314) *Regeneration (Mid-Low; Ripley 8 was able to\
    \ quickly regenerate an incision scar due to her Xenomorph genesAlien: Resurrection (1997)) *Possibly\
    \ Telepathy (Queens have been said to communicate telepathically with other Xenomorphs) *Biological\
    \ Manipulation (Xenomorphs can secrete the black gooAlien RPG Core Rulebook - pg. 319 and can use\
