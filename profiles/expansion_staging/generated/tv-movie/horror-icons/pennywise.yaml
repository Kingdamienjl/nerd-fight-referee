  stamina:
    text: 'Superhuman (In between its period of hibernation, Pennywise is active for about an entire year.
      During that time, it is non-stop terrorizing its victims through various means, hunting them down
      and devouring them. Can continue operating and living after being shot in the head, with a considerable
      portion of its head missing.IT Novel: Chapter 8) | Infinite'
    source_ids: *id002
    confidence: 0.95
  range:
    text: 'Varies from Standard Melee Range to Several Meters physically via shapeshifting; Tens of Kilometers
      with powers (Pennywise''s powers extend all throughout all of Derry, an influence so absolute that
      it was like Pennywise was one with Derry. Existing everywhere in Derry, filling in all its hollow
      places.IT Novel: Chapter 10IT Novel: Chapter 19 Can cause disasters like earthquakes and storms
      that stretch all across Derry.IT Novel: Chapter 23IT Novel: Chapter 21) up to High Outerversal |
      High Outerversal (Is capable of reaching those inside of creation from the void it resides, dragging
      the minds of others into the Deadlights.IT Novel: Chapter 21)'
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: At least Gifted (Pennywise has been around for at least billions of years without end, and has
      spent a considerable portion of this time terrorizing the residence of Derry in-between its periods
      of hibernation. Thanks to this, Pennywise excels in mind games and trickery, using its vast abilities
      to establish as much fear as possible within its victims/meals, regularly utilizing vulnerabilities
      like fears, traumatic experiences, deceased loved ones, memories, and more to its benefit. Alongside
      this, Pennywise is meticulously manipulating all of Derry, Maine so it can easily get away with
      its kills, not only receiving little to no intervention from local authorities, but from the rest
      of the world, making so the wider public news doesn't pick up on Pennywise's heinous actions. Pennywise
      is also a talented schemer that is adept in manipulation, such as using the form of a clown to lure
      in kids like George, and convinced Henry Bowers to hunt down the Losers Club.
    source_ids: *id002
    confidence: 0.95
