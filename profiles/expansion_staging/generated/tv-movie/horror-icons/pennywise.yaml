- id: claim-weaknesses-a7a63a65
  section: weaknesses
  axis: weakness
  text: "* Arrogance: Pennywise heavily underestimates humanity, believing them to be weak, and finds\
    \ the idea of them being able to resist it utterly ridiculous. This leads Pennywise to toy with his\
    \ prey, thinking they are unable to retaliate, and can be baffled if they do somehow manage to effectively\
    \ fight back. As a result of the Losers Club defeating it when they were children, Pennywise entered\
    \ a mild depressive state, questioning its own capabilities, and even making it feel afraid. This\
    \ also can lead it to do illogical things, such as purposefully leaving ways for its victims to escape.\
    \ * Belief: Repeatedly, it has been shown that strong enough courage is extremely effective against\
    \ Pennywise. With strong enough belief, one can make Pennywise physically weaker, and vulnerable to\
    \ things that it otherwise wouldn't have been. The Losers Club have exploited this weakness several\
    \ times against Pennywise, using things like silver ball bearings and Eddie's aspirator to combat\
    \ IT. The most extreme example of this is when Richie was able to harm Pennywise with sneezing power,\
    \ while doing an Irish cop voice, by simply believing that it can hurt IT.IT Novel: Chapter 8 (However,\
    \ this could be a result of external help. Time and time again, it is mentioned that each member of\
    \ the Losers Club was being benefited by some mysterious force) * Ritual of Ch\xFCd: An ancient ritual\
    \ that is essentially a battle of willpower and belief against both the avatar, and the true form\
    \ of IT. Firstly, a group of at least six people is needed to initiate the ritual in the first place.\
    \ Ideally, you would want seven people, as seven has a special talismanic quality to it. These six\
    \ to seven people must also have child-like imaginations. This can be easily found in actual children,\
    \ but adults will have a far harder time to pull this off. The Losers Club were able to compensate\
    \ for having jobs that allow them to be creative in their adulthoods. It is also possible for the\
    \ ritual to be performed by a lesser amount of people, or even one person, it will just be much harder,\
    \ and that individual would need a thorough understanding on how the ritual works. Secondly, one to\
    \ two of those seven people must then wrap their tongues around each other. Both opposing sides must\
    \ bite down on their tongues, and try to get each other to laugh despite the pain. However, another\
    \ way for one side to win, is for the other side to bail out. Pennywise can potentially cheat through\
    \ this thanks to its shapeshifting capabilities. But the collective belief of the castor and their\
    \ companions can lock IT into a single form. Once that is done, both sides will become able to telepathically\
    \ communicate with each other, their minds linked. The castor will also be able to read the mind of\
    \ IT, which can cause good amounts of pain within IT. Then the ritual will actually begin. Once the\
    \ minds are linked, the castor's mind will be separated from their physical body, and will be sent\
    \ across an unimaginable distance towards the Deadlights, IT's mind. In this state, the castor can\
    \ inflict pain onto IT's true form with their childish belief. As in, them believing in things like\
    \ Santa Claus and the Tooth Fairy can deal real damage to the Deadlights. Bill and Richie were able\
    \ to get IT to bail out of the ritual, and win, through this way. However, in this state, the castor\
    \ is also vulnerable. Not only are they vulnerable to the Deadlights, but IT can potentially cause\
    \ the mind of the castor to fly off away, forever separated from their body. If the castors succeed\
    \ in completing the Ritual of Ch\xFCd, they will be able to kill off Pennywise, negating his Immortality\
    \ and Regeneration. If the castors fail, Pennywise will remain, and will devour their Ka (Mind, soul,\
    \ destiny, and life-force). Once all is done, the castors also need to actually kill Pennywise the\
    \ Clown in order to finish him off. This is all just to kill the avatar, not the Deadlights themselves.\
    \ This also doesn't prevent Pennywise from coming back, nor separate reality from the Deadlights'\
    \ influence. * Natural Laws: All living things must abide by the laws of the shape they inhabit. Despite\
    \ Pennywise's shapeshifting ability, this applies to it.IT Novel: Chapter 21 Essentially, what this\
    \ means is that if it takes a shape, he must abide by the limitations of that shape. If Pennywise\
    \ were to turn into a fish, he would have to stay in water. This also applies to fictional creatures\
    \ like vampires and werewolves. This also subjects Pennywise to pain, and death. Until its encounter\
    \ with the Losers Club, pain was a foreign concept to it. * Hibernation: Pennywise has a hibernation\
