  attack_potency:
    text: "Varies from Wall level (Tore George's arm offIT Novel: Chapter 1 with ease and splintered Adrian's\
      \ ribs just by squeezing him.IT Novel: Chapter 2 Punched Victor's head off, and later peeled half\
      \ of Belch's face off down to the bone.IT Novel: Chapter 19 Tore the heads off of Dawn Roy and Adam\
      \ Terrault. Tore open Jeffrey Holly. Tore both of John Feury's legs off. Dismembered Jerry Bellwood.IT\
      \ Novel: Chapter 9 Ripped apart a group of nine lumberjacks, including their heads, arms, and feet.IT\
      \ Novel: Chapter 3 Transformations like his Paul Bunyan statue form should be this level from size\
      \ alone, but in this form IT was easily able to chop a bench in two.IT Novel: Chapter 11 Ripped\
      \ Eddie's arm off. Can shapeshift into a shark), Large Mountain level+ (IT arriving on Earth caused\
      \ a cataclysmic impact that \"turned a big hill into a doughnut\".IT Novel: Chapter 15 IT's death\
      \ in its spider form, the form that most closely resembles IT's true form, caused a massive earthquake\
      \ that destroyed downtown Derry,IT Novel: Chapter 23 which has been calculated to be worth 2.6 Gigatons.\
      \ Said earthquake was far superior to the 1960 Valdivia Earthquake) up to High Outerverse level\
      \ (Pennywise's spider form is considered the closest approximation to its true physical form and\
      \ is a manifestation of the Deadlights within our reality. This form is described as a spider that\
      \ literally exists beyond space and time, possessing a structure that transcends the limits of three-dimensional\
      \ reality.IT Novel: Chapter 21 IT Novel: Chapter 22 It should be comparable to the other GuardiansInfinite\
      \ layers and two additional layers) | High Outerverse level (Before existence into being, Maturin\
      \ and Pennywise were two opposing cosmic forces forming an abstract alliance in the void they inhabited.IT\
      \ Novel: Chapter 21 Maturin was a benevolent, kind, and passive turtle who only observed, while\
      \ Pennywise, his brother and counterpart, was a divine embodiment of evil and brutality, who enjoyed\
      \ interfering in events through his clown avatar.IT Novel: Chapter 22 Before being defeated in the\
      \ Ritual of Ch\xFCd, it was known that the massive cosmic horror had its own infinite realm called\
      \ the Deadlights within the void of Todash,IT Novel: Chapter 21 and that it stood opposite. Maturin\
      \ is a universal and eternal force representing cosmic separation on the outer rim of the multiverse.IT\
      \ Novel: Chapter 22Dark Tower VI: Song of Susannah Although it is unknown whether IT is still alive,\
      \ it is known that the Deadlights continue to exist even after the Ch\xFCd War. Even godlike beings\
      \ such as the Crimson King must rely on the Deadlights for assistance in order to reach higher cosmic\
      \ hierarchiesInsomniaInfinite layers and three additional layers)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Varies from Subsonic (Can move as fast as an express-train.IT Novel: Chapter 18 Was able to
      keep up with Bill on his bike with ease and regularly attacks people before they can react), up
      to Massively FTL+ (Traveled from "outside of everything" to Earth.IT Novel: Chapter 15 [19,486c
      to 47,092c]. Can outpace the members of the Losers Club, who can react to and perceive things while
      being flung from.IT Novel: Chapter 22 Earth, to outside the universe, and into the Deadlights within
      moments.IT Novel: Chapter 222.41945 to 145.16748 Quadrillion c Bill and Richie can also perceive
      things while going so fast, that Maturin completely disappeared from sight within a single eyeblink.IT
      Novel: Chapter 2219.56605 Quintillion c) | Immeasurable (Pennywise resides in a deeper void within
      the Macroverse, beyond everything.IT Novel: Chapter 21 This means that for Pennywise to reach Earth,
      it must emerge from this region and pass through the Prim and the Dark Tower. The same applies to
      the Losers'' Club in terms of ability, but in reverse. As for Maturin''s ability, Maturin is a cosmic
      turtle who holds all of existence, including the Dark Tower, on its back or within its mind). Omnipresent
      in its own reality. (Deadlights)'
    source_ids: *id002
    confidence: 0.95
