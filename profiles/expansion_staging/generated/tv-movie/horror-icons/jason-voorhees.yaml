  stamina:
    text: 'Superhuman (Jason can survive and continue hunting and killing his prey even after taking injuries
      that would be lethal for others. Even as an ostensibly normal human, he was able to get up quickly
      after his collarbone was sliced through and recovered from having an axe blade slammed into his
      skull, going straight back to killing no worse for wear. As an undead human, his stamina becomes
      even greater, allowing him to walk through worse injuries without issue. In Freddy vs Jason, he
      continued to fight after having three of his fingers sliced off, both of his eyes gouged out, and
      being impaled in numerous places and slashed multiple times, getting up to land a final attack on
      Freddy after having his own machete shoved deep into his body and being set on fire. As a cyborg,
      his stamina becomes even higher. In Jason X: Planet of the Beast, he survived on Planet 666 for
      two weeks. Planet 666 is impossibly hostile to all life. Organic matter being exposed to the atmosphere
      causes it to disintegrate and turn into dust, the planet''s average temperature fluxes between 0
      and -196 degrees Celsius, there''s no breathable atmosphere on the planet, the planet''s condition
      changes every day, and even incredibly resistant microorganisms that can survive incredibly harsh
      conditions cannot survive on Planet 666)'
    source_ids: *id002
    confidence: 0.95
