- id: claim-weaknesses-68628b69
  section: weaknesses
  axis: weakness
  text: 'As Thorn is the entity that controls Michael, it will cause him to suddenly become inactive whenever
    resting. A ritual can also be performed to separate Thorn from Michael, depriving him of his power.
    Note: This profile covers Michael Myers in the Thorn Timeline. The movies in this timeline are Halloween,
    Halloween II, Halloween 4: The Return of Michael Myers, Halloween 5: The Revenge of Michael Myers,
    and Halloween: The Curse of Michael Myers. ==Gallery== Michael2.jpg|Michael in Halloween II (1981)
    Michael2-4.png|Ditto 6aafd206bc624f77ab7471b382622977.jpg|Michael in Halloween 4 Halloween-5-2.jpg|Michael
    in Halloween 5 Michael6.jpg|Michael in The Curse of Michael Myers LbNG36v.jpg|Michael (in the 1978
    film) as a child ==Notable Matchups== |-|Victories:= *Naoko Kirino (Pumpkin Night) Naoko''s Profile
    (Speed was equalized) *Jason Voorhees (Friday the 13th) Jason''s Profile (This was human Jason from
    the third and fourth films. Speed was equalized. Fight took place in a dark field) |-|Losses:= *Don
    Quixote de la Mancha (El Ingenioso Hidalgo Don Quixote de la Mancha) Don Quixote''s Profile *Chucky
    (Child''s Play (Verse)) Chucky''s Profile (Speed was equalized and both had their standard and optional
    equipments. Chucky''s After-Life key used. Fight was taked place in a rundown apartment. Both was
    had start 10 meters away with no line of sight) *William Afton (Five Nights at Freddy''s Book Trilogy)
    William''s Profile (Post-Springlocked William is used, speed is Equalized, takes place in Haddonfield,
    Illinois, distance is 5 meters.) |-|Inconclusive:= ==References== {{Scroll box|Content={{Reflist}}}}
    ==Notes/Explanations== {{Scroll box|Content=}} {{Discussions|Michael Myers Thorn Timeline|Michael
    Myers}} Category:Characters Category:Halloween Category:Adults Category:Antagonists Category:Book
    Characters Category:Evil Characters Category:Horror Characters Category:Humans Category:Immortals
    Category:Knife Users Category:Male Characters Category:Movie Characters Category:Murderers Category:Primary
    Antagonists Category:Psychopaths Category:Regeneration Users Category:Sadists Category:Serial Killers
    Category:Stealth Masters Category:Telepaths Category:Villains Category:Silent Characters Category:Live-Action
    Characters Category:Scissor Users Category:Axe Users Category:Scythe Users Category:Hammer Users Category:Emotionless
    Characters Category:Cursed Characters Category:Mask Users Category:Blade Users Category:Drivers Category:Rod
    Users Category:Syringe Users Category:Scalpel Users Category:Gun Users Category:Claw Users Category:Fork
    Users Category:Weapon Users Category:Weapon Masters Category:Possessed/Brainwashed Characters Category:Tragic
    Characters'
