power_scale:
  tier:
    text: '{{9-B}} Name: Michael Myers, The Boogeyman, The Shape, Thorn Origin: Halloween Age: 21-38 Gender:
      Male Classification: Human, Serial Killer, Host of Thorn, Smith''s Grove Sanitarium Patient (formerly),
      Patient at Ridgemont Federal Sanitarium (formerly)'
    source_ids: &id002
    - mediawiki-18733
    confidence: 0.95
  attack_potency:
    text: Wall level (Comparable to those who can harm him. With minimal effort, could toss a man through
      the air and into an electrical power plant, hard enough to damage and short circuit it. Splintered
      a wooden door into pieces. which requires at least this much energy. Threw Loomis into a door, destroying
      it, which would require this much energy. Stabs a shotgun through Kelly and the door behind her.
      Punched through John Strode's body before proceeding to slam him into a circuit box, damaging it.
      Casually broke wooden rails after throwing Loomis into them Broke down a cell gate using a man's
      head According to Dr. Loomis, Michael only grows stronger over time. Smashed a wooden cabinet into
      thousands of pieces, which takes around this much energy [5,834.019,2310875 J]), can bypass durability
      with some abilities
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Superhuman (Frequently disappears from sight, eluding the senses of those around him. Managed
      to get the jump on Alice from close range. Murdered Bernard before he could react. Traveled from
      the roof of a house to ground floor in mere seconds. Attacked Dr. Loomis before he could react.
      Slaughtered an entire police station off-screen) with Subsonic travel speed (Seemingly moved so
      fast that he teleported)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 25 (Has effortlessly snapped several people's necks, which requires this much force. Dragged
      a massive tree onto a two-way road, with trees weighing anywhere between 2,000 and 20,000 pounds.
      Quickly ripped out Rob's arm, and can do this effortlessly, which would require this much force.
      Broke down a cell gate using a man's head after crushing it)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Wall level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Wall level (Survived being shot six times and falling off of a two-story balcony. Survived a
      major gas explosion that blew apart an entire room; although, he collapsed shortly after. Took an
      onslaught of heavy weapons. Left unscratched from several vehicular accidents, all of which generate
      this much energy at the very least. Despite being connected to John Strode he seems unaffected by
      the electricity. Managed to survive several house explosions). Immortality, empowerment, and regeneration
      make him harder to kill.
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Has persistently stalked his victims while enduring numerous hazards that would
      easily kill a normal human. He was able to get up quickly after being shot six times and falling
      from a balcony and recovered after a guillotine blade stuck in his face. Was not killed even after
      several vials of corrosive acid were injected into his body)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, Extended Melee Range with kitchen knife, Kilometers via Soul, Dream, Pain,
      Mind Manipulation, Telepathy and Possession
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Above Average (Michael is rather cunning despite his simple, brutal method of killing. In his
      first escape, Michael mastered driving in seconds and later memorized Haddonfield''s layout to effectively
      travel across town. He utilizes his skill in stealth to sneak up on and kill unsuspecting victims.
      After being stabbed in the eye and chest by Laurie, he pretended to be dead to trick her and approach
      her in deadly silence. Michael can play dead after taking attacks that would kill most people, allowing
      his targets to become vulnerable and open for a killing blow. Often kills the power and disables
      landlines before entering locations to murder his victims. Had enough foresight to drag a large
      tree onto a road, blocking off an escape route for his victims. Killed every single officer in a
      police station by himself, despite lacking any form of combat training) Standard Tactics: Michael
      Myers is an emotionless, mute serial killer who feels no remorse when killing people or animals.
      This enables Michael to be a brutal killer and sometimes mutilate his victims. Michael usually uses
      a kitchen knife to carry out his murders, but he can also use other weapons he finds. Michael utilizes
      the element of surprise and his natural talent in stealth, stealthily approaching his target in
      deadly silence.'
    source_ids: *id002
    confidence: 0.95
