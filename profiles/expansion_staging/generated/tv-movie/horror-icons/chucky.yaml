  intelligence:
    text: "Genius |-|Overall= Chucky is a highly cunning and manipulative killer, skilled in various forms\
      \ of magic and strategy, particularly voodoo, which allows him to escape death and continue his\
      \ pursuits even after permanently dying. He has a knack for tricking others into doing his bidding,\
      \ often hiding his true nature. Chucky is resourceful, creating complex devices and traps with little\
      \ formal knowledge, and is adept at taking advantage of weak points, whether physical or situational.\
      \ He is a master of planning and executing his goals, including manipulating people, gathering information,\
      \ and seizing opportunities to further his agendas. |-|Notable Feats= {{#tag:tabber| {{!}}-{{!}}Knowledge=\
      \ *Chucky has a vast amount of knowledge in voodoo magic and techniques taught to him by John Bishop.\
      \ Through these various different rituals, he can cheat at death and resurrect even if he\u2019\
      s declared permanently dead. Even though he can be killed, it never lasts as he always seems able\
      \ to find some way to come back (even through outside help). As of Cult of Chucky, he learned a\
      \ new ritual that would allow him to split his soul into multiple different vessels and possess\
      \ multiple people simultaneously. *Knowledgeable in chemistry and engineering; created a homemade\
      \ bomb using fertilizer and butane, powerful enough to kill within a 6-foot radius. It included\
      \ a strap with a button for detonation. It should be mentioned that Chucky doesn\u2019t have any\
      \ formal training in these fields, meaning he either self-taught himself or adapted to it. *Hacked\
      \ into The White House\u2019s system to disable the power grid, allowing him to move undetected.\
      \ *Capable of targeting weak points of the human body such as the spine to paralyze and/or incapacitate\
      \ victims. Could severe a Secret Service agent\u2019s frontal lobe from his thalamus with a pen,\
      \ demonstrating an understanding of the human body. *Stitched up Nica\u2019s wrists despite not\
      \ having any formal experience, which still would require him to have medical skills given the major\
      \ veins and arteries in the arm. {{!}}-{{!}}Strategy/Planning= {{#tag:tabber| {{!}}-{{!}}Six Sacrifices=\
      \ After the climax of Season 2, Chucky realizes that to reclaim his power, he must perform a ritual,\
      \ requiring six sacrifices. He discovers the White House is evil enough, especially after the tragic\
      \ death of the President\u2019s son, Joseph. He disguised himself and hid behind Joseph\u2019s grave,\
      \ waiting for the right moment. As James and his family mourn, Henry spotted him and convinced his\
      \ parents to let him bring Chucky to the White House where Chucky introduces himself as \u201CJoseph.\u201D\
      \ Later in the night, Chucky hacked into the White House, disabling the power and allowing him to\
      \ strike a secret agent during the blackout. The next day, he manipulates Henry into convincing\
      \ his father to let him stay in the Oval Office, where he quietly observes and uncovers secrets,\
      \ including a coded safe with a gun (which he used later in the season). He later stole a letter\
      \ opener from Henry\u2019s room; When an agent named Teddy comes to escort Chucky back to Henry,\
      \ Teddy is distracted by the letter opener and Chucky uses the opportunity to kill him with the\
      \ agent\u2019s own gun. The discovered body causes disbandment & panic upon the staff & service\
      \ agents, and later once he\u2019s into the Oval Office, he slits the throat of a secretary who\
      \ unknowingly picks him up and he leaves her body for the staff to find. During the Halloween Gala\
      \ party taking place days later, Chucky causes another power outage and, when it returns, disappears,\
      \ only to be found by James. Meanwhile, Chucky had loosened the bolts on the chandelier prior to\
      \ the party, accounting the perfect moment for it to fall during the party. As the chandelier crashes\
      \ to the ground, killing several guests who were diverted to the single-falling bolt on the chandelier,\
      \ Chucky\u2019s ritual is complete, and his path to reclaiming his spirit is sealed. {{!}}-{{!}}Killing\
      \ Eddie and Framing Andy= After Karen Barclay sends Andy off to school, Chucky manipulates Andy\
      \ into taking him across the city to Eddie\u2019s hideout, a place Eddie uses to stay off the radar.\
      \ Once they arrive at the location, Andy heads off to the bathroom, leaving Chucky alone in a chair.\
      \ Chucky takes the opportunity to run across the street to Eddie\u2019s house, a nearby, rundown\
      \ property. Once inside, Chucky deliberately makes noise, enough to rouse Eddie from his sleep.\
      \ He enters the kitchen where he blows out the pilot light on the stove and turns the gas up. Chucky\
      \ then proceeds to make more noise, intentionally drawing Eddie\u2019s attention and luring him\
      \ toward the stove. Knowing that Eddie has a hair-trigger temper and a tendency to overreact, Chucky\
      \ uses this to his advantage. As Eddie hears the noise, he grabs his gun, believing there might\
      \ be an intruder in his house, and moves towards the sound. Chucky\u2019s bait works perfectly,\
      \ as Eddie bursts open the door and fires wildly in the direction of the noise, causing the gas\
      \ to ignite and leading to a m"
    source_ids: *id002
    confidence: 0.95
