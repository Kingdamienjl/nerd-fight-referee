- id: claim-weaknesses-e30e3766
  section: weaknesses
  axis: weakness
  text: "If Chucky does not transfer his soul fast enough, he will be stuck as a doll. His small size\
    \ and light weight make it hard for him to effectively fight others and he is prone to arrogance.\
    \ If his heart is destroyed, he will be \"killed\", but he'll come back just fine once repaired. The\
    \ soul transfer ritual takes time and can be interrupted. ==Notes/Explanations== ==Notable Matchups==\
    \ Victories: *Michael Myers (Green Timeline) (Halloween) Michael Myers\u2019 Profile (1978 Michael\
    \ and Chucky\u2019s doll form were used. Speed was equalized and both had their standard equipment.\
    \ Both started 10 meters away from each other) *Roman Bridger (Scream) Roman Bridger\u2019s Profile\
    \ (Chucky\u2019s second key was used. Speed was equalized and both had their standard equipment. Fight\
    \ took place in a rundown apartment and both started 10 meters away from each other with no line of\
    \ sight) *Ghostface (1996) (Scream) Billy and Stu\u2019s Profile (Chucky was teamed up Tiffany and\
    \ both were in their second key. Speed was equalized. Fighters were equipped with a knife and gun.\
    \ Fight took place in a movie theatre and started 20 meters away with no line of sight. Fighters had\
    \ no prior knowledge) *Michael Myers (Thorn Timeline) (Halloween) Michael Myers' Profile (Speed was\
    \ equalized and both had their standard and optional equipments. Chucky's After-Life key used. Fight\
    \ was taked place in a rundown apartment. Both was had start 10 meters away with no line of sight)\
