    \ to Aragorn's own, with Legolas not only seeing Edoras from a distance that Aragorn cannot, but also\
    \ describe it in such detail that he can accurately describe individuals, their current state, and\
    \ their attire.The Lord of the Rings: The Two Towers, Book Three, III The Riders of RohanThe Lord\
