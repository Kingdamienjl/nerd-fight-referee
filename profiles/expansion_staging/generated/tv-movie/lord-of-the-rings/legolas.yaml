    \ state to their mortal companions)The Lord of the Rings: The Return of the King, Book Five, II The\
    \ Passing of the Grey Company * Magic (Individuals in the Legendarium are unable to use magic unless\
    \ they are of the appropriate race/species or inherited magic from them in some manner.Letter 155\
