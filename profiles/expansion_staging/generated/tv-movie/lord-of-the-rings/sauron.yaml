  axis: hax
  text: "Within the confines of E\xE4= *Powers and Resistances of the Ainur (Abilities and Resistances\
    \ of the Greater Maiar from \"Within the confines of E\xE4\" and \"Prior to entering E\xE4\") *Fear\
