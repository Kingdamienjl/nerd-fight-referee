      \ The Shadow of the Past As he is also the head of the White Council, he may also scale above the\
      \ likes of Galadriel, with Gandalf the Grey emphasising that it was by \"the devices of Saruman\"\
      \ that they were able to drive Sauron from Dol Guldur.The Lord of the Rings: The Fellowship of the\
      \ Ring, Book Two, II The Council of Elrond However, the language used here also imply his value\
      \ came from his indirect influence, rather than his might) | At least Mountain level (He should\
      \ be comparable to his peer Ol\xF3rin, who should be far superior to his state as Gandalf the White)Unfinished\
      \ Tales: Part Four, II The Istari, at most High Universe level (It is said that the Maiar who constituted\
      \ the order of the Istari were mighty for even members of the \"angelic people\", being peers of\
      \ Sauron in the past.Unfinished Tales, Part Four: II: THE ISTARI However, it is unknown how much\
      \ weaker Sauron was during this time, meaning it is uncertain whether he would classify as a Greater\
      \ Maiar while he was their peer or not), can ignore conventional durability with Soul Manipulation\
      \ (Ainur can directly influence the f\xEBar/soul to attack it directly)The Nature of Middle-Earth,\
      \ Part Two: Body, Mind and Spirit, XIII SpiritSilmarillion: AINULINDAL\xCBMorgoth's Ring: Notes\
      \ on motives in the Silmarillion (iii) | Outerverse level (The Ainur in their origin are residents\
      \ of the \"primary creation\", with the difference between a primary and a secondary world being\
      \ described as the difference between reality and \"myth and fairy-story\". In this state, they\
      \ resided in a world of purely will and awareness outside the space-time of E\xE4 once it was created,\
