      \ and claimed to be second to only Sauron in power, being capable of matching him over Amon Hen,\
      \ although the effort would leave him exhausted)The Lord of the Rings: The Two Towers, Book Three,\
      \ X The Voice of SarumanThe Lord of the Rings: The Fellowship of the Ring, Book Two, X The Breaking\
      \ of the Fellowship | At least Mountain level (Logically stronger than he ever was as an Istar,\
      \ as the form of a wizard was taken to restrict the powers of those Maiar who were part of the order.\
      \ Even Gandalf the White was obligated to conceal his true power, while also being restrained by\
      \ the limits of a physical form)Letters of Tolkien: Letter 156 at most High Universe level (It is\
      \ said that the Maiar who constituted the order of the Istari were mighty for even members of the\
      \ \"angelic people\", being comparable to Sauron in his origins, although it is unclear how comparable\
      \ this version of Sauron would be compared to his state during the First Age.Unfinished Tales: Part\
      \ Four, II The Istari Of all the potential ringbearers, only Gandalf was considered to have an even\
      \ chance of overthrowing Sauron as the Ring Lord if he claimed the One Ring, with Tolkien citing\
      \ this to be due to their shared origins and nature)Letters of Tolkien: Letter 246, can ignore conventional\
      \ durability with Soul Manipulation (Ainur can directly influence the f\xEBar/soul to attack it\
      \ directly)The Nature of Middle-Earth, Part Two: Body, Mind and Spirit, XIII SpiritSilmarillion:\
      \ AINULINDAL\xCBMorgoth's Ring: Notes on motives in the Silmarillion (iii) | Outerverse level (The\
      \ Ainur in their origin are residents of the \"primary creation\", with the difference between a\
      \ primary and a secondary world being described as the difference between reality and \"myth and\
      \ fairy-story\". In this state, they resided in a world of purely will and awareness outside the\
      \ space-time of E\xE4 once it was created, with the Ainur being described as beyond the bounds and\
      \ limits of time and space)Letters of Tolkien: Letter 131Letters of Tolkien: Letter 181The Nature\
      \ of Middle-Earth, Part Three: The World, it's Lands, and its Inhabitants, III Powers of the Valar,\
      \ possibly High Outerverse level+ (Sub-creators of the primary world, the creators of stories and\
      \ myth within the primary reality, are described as possessing \"no bounds, but the laws of contradiction\"\
      \ in their capacity as \"writers\". As the \"highest created beings\" created by Eru, the Ainur\
      \ are potentially similar existences to these sub-creators, with the Ainur possessing \"special\
      \ 'sub-creative' powers\" as Eru grants them certainty that their creations are given reality, unlike\
      \ the writers who do not possess this certainty)Letters of Tolkien: Letter 153"
