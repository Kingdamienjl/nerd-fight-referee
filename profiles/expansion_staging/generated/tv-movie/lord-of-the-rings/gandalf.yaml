- id: claim-standard-equipment-892f53a1
  section: equipment
  axis: equipment
  text: "*Narya: Narya, also known as the ring of fire, is an elvish ring made by Celebrimbor. It can\
    \ \u201Cinspire hearts\u201D, as well as the being able to hide him from forms of remote observation\
    \ (however it won't work against a powerful enough telepath). It can also hold back the decays of\
    \ time, and likely the sickness, rot, etc. caused by Sauron. *Wizard staff: Gandalf uses a wooden\
    \ staff. The use of this is unknown. It appears to work like a lantern, channeling his light creation,\
    \ as well as possibly his other powers. However, it is unknown if it is useful at all, or if it would\
    \ be useful for an unrestricted Maia. It also appears to be able to channel his force fields, snapping\
    \ of enough strain is put on it, though again, this is unconfirmed. *Glamdring: Glamdring is a very\
    \ strong, durable, and sharp, Elven sword. It is capable of harming invulnerable beings like Balrogs,\
    \ and gives of a light whenever orcs/goblins are near."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
