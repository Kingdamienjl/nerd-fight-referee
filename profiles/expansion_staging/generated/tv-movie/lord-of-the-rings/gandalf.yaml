- id: claim-weaknesses-dc34c00a
  section: weaknesses
  axis: weakness
  text: "Most of his powers are sealed and although immortal he can still be killed | He can still be\
    \ killed (Although it is significantly more difficult. He stated that Aragorn, Legolas and Gimli weren't\
    \ capable of even scratching him) | None notable | None notable Notable Attacks/Techniques: Basic\
    \ Magic: \u200BBeing powerful sorcerers, the Istari have access to many spells and the Words of Command,\
    \ powerful spells that are much more dangerous than normal magic. Gandalf himself can remember all\
    \ the spells in multiple languages, and most Istari can banish massive storms. They are some of the\
    \ strongest magicians in Lord of the Rings, being well aware of most forms of magic and full capable\
    \ of understanding the magic of the Dwarves. As the White he should also be able to use magic like\
    \ that Saruman used to dominate the minds of Rohirrim soldiers and Th\xE9oden. Other Istari are implied\
    \ to be able to banish massive storms. *Words of Command: The Words of Command are powerful spells,\
    \ much more dangerous than normal ones. The first recorded use of a Word of Command was when Gandalf\
    \ used it to close a door, with the Balrog using his magical knowledge to try and open it, leading\
    \ to its destruction. Words of Command may have a relation to the Anulindale, where the entire world\
    \ was formed by words strung together in song, with the Words of Command possibly being extensions\
    \ or continuations of the music. If so, this may be the only way to change the original music except\
    \ for by the actions of man, making it one of the most potent forms of magic in Lord of the Rings.\
    \ The spells Gandalf referred to may be Words of Command, with men not needing any do to being able\
    \ to work outside the music without needing Words of Command, which might work as a sort of cheat\
    \ code. *Istari Forcefields: The Istari can create powerful force fields to block attacks from enemies.\
    \ As with most magic in Lord of the Rings, the exact nature of it is unknown. However, it does seem\
    \ to put tremendous strain both on the Istari's staff and the attackers weapon. This is shown when\
    \ Gandalf used a shield to block an attack from Durin's Bane. This destroyed Gandalf's staff and the\
    \ sword held by Durin's Bane. This seems to imply that the staff is the item \"Channeling\" the spell,\
    \ so to speak. *Spellcraft: Spellcraft is not an official term, yet rather the best term to capture\
    \ the art of creating spells via potions and metals. Examples of spellcraft include the Plantiri,\
    \ magical stones crafted in Valinor; Durin's door, an ithildin door crafted by Celebrimbor; the Rings\
    \ of Power, magic rings that grant invisibility to those who use them, which where crafted by the\
    \ Elves of Eregion and the Silmirals, magic jewels crafted by Feanor. Spellcraft can be used to manipulate\
    \ objects and give them special properties, making them far more potent in combat. Most Elven swords\
    \ appear to have magical qualities. As shown above, spellcraft usually revolves around using and/or\
    \ creating magical substances runes and other, more obscure forms of magic. Being a powerful magician,\
    \ Gandalf should be more than capable of using such powers' Elemental Magic: Istari magic mostly focuses\
    \ on control over the elements. They can create light, fire and smoke; manipulate water; banish weather\
    \ storms or control fireworks. Each of the Istari have control over a certain element. Gandalf seems\
    \ to be connected to fire, Saruman to the Earth, and Radagast to life. Each of them have great power\
    \ over their own element, with Gandalf even being able to go toe-to-toe with a Balrog. *Illumination:\
    \ Gandalf can create light from his staff to allow him and others to see in dark places. *Blinding\
    \ Light: Gandalf can create light that can be focused and concentrated on enemies to temporarily blind\
    \ and disorient them. As Gandalf the White he was able to drive of the Nazg\xFBl with this *Fire Creation:\
    \ Gandalf apparently has the power to cause any object to burst into flame remotely. The flammability\
    \ of the target does not seem to matter - he used it on a bunch of trees which were wet and covered\
    \ with snow. The fires are much more difficult to put out than normal fires, but Gandalf can put them\
    \ out at will. Still, he seems somewhat constrained by the laws of physics - he cannot work on snow.\
    \ *Lightning/Weather manipulation: Gandalf can call down bolts of lightning and thunder upon the area,\
    \ and create huge storms. The other Istari were also implied to be able to perform similar feats.\
    \ *Telepathy: Gandalf seems to be able to keep in telepathic contact with allies, though this seems\
    \ to require those he speaks with to bear a Ring of Power. He can also gain information from the minds\
    \ of others (Such as when he looked into Frodo's dreams), detect and resist mental compulsion (Such\
    \ as that used by Saruman and Sauron), and inspire others to increase their morale (With the latter\
    \ two being strengthened by Narya). He is also likely capable of offensive telepathy, but the most\
    \ we have seen of this is when he creates a type of intimidation,"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
