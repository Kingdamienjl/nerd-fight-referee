  section: abilities
  axis: hax
  text: "Within the confines of E\xE4= {{#tag:tabber|Gandalf the Grey= *Superhuman Physical Characteristics\
    \ *Weapon Mastery (Skilled with a sword) *Genius Intelligence (Is one of \"The Wise\") *Light Creation\
    \ (Can create light, either to see in dark places or to blind enemies) *Telekinesis *Forcefield Creation\
    \ (Created a forcefield strong enough to block the Durin's Bane's attacks) *Immortality (Type 1) *Telepathy\
    \ *Dream Manipulation (Can enter dreams) *Animal Manipulation (Can communicate with animals) *Weather\
    \ and Lightning Manipulation *Fire Manipulation, Smoke Manipulation, Heat Manipulation, Energy Manipulation\
    \ and Energy Projection via Words of Command ((Gandalf can create colored flame, create pillars of\
    \ smoke, and cause fires to grow hotter and explode) *Analytical Prediction (Gandalf and other Istar\
    \ are intelligent enough to accurately predict the future through logical deduction) *Acausality (Type\
    \ 2; Changes to the past or future are unable to affect the \"Music in being\", otherwise referred\
    \ to as the present)Morgoth's Ring: PART FIVE. III.. Resistance to: *Mind Manipulation (The barrier\
    \ of Unwill within every individual mind prevents mental penetration by even the likes of Sauron without\
    \ consent.)The Nature of Middle-Earth, Part Two: Body, Mind, and Spirit, IX \xD3SANWE-KENTA. *Soul\
    \ Manipulation (Soul with free-will are considered indestructible)Letters of Tolkien: Letter 211 {{!}}-{{!}}\
    \ Gandalf the White= All previous powers enhanced including: *Immortality (Types 1 and 2), possibly\
    \ Power Nullification (After Saruman's staff was destroyed by him, he was stripped of most of his\
    \ magic, despite the loss of Gandalf's staff having little effect on him) {{!}}-{{!}} Maia= All previous\
    \ abilities to a greater extent, including: *Powers and Resistances of the Ainur (At least possesses\
    \ the Common Abilities and Resistances from \"Within the confines of E\xE4\", at most possesses those\
    \ of the Greater Maiar), retains verse-wide abilities and resistances }} |-|Prior to entering E\xE4\
    = All previous abilities on an unfathomably higher extent including: *Powers and Resistances of the\
    \ Ainur (At least possesses the Common Abilities and Resistances from \"Prior to entering E\xE4\"\
    , at most possesses those of the Greater Maiar) Resistance to: *Mind Manipulation *Soul Manipulation\
    \ due to verse-wide resistances."
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
