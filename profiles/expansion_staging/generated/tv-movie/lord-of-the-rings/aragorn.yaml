  axis: hax
  text: "{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= |-|Base= *Superhuman Physical Characteristics\
    \ *Longevity (As one of the D\xFAnedain, Aragorn lived was capable of living for 210 years in his\
    \ physical prime before he willingly relinquished his life.The Lord of the Rings: Appendix A D\xFA\
    nedain/N\xFAmen\xF3reans are capable of relinquishing their lives before old age can physically impair\
    \ themThe Nature of Middle-Earth, Part One: Time and Ageing, IX: TIMESCALES AND RATES OF GROWTH) *Weapon\
    \ Mastery (Aragorn was a capable leader of men even as a young man and took part in multiple wars\
    \ as a member of the armies of Rohan and Gondor. He has skills in combat at sea, land, and won has\
    \ renown in combat under many identities. By the time of the War of the Rings, Aragorn was one of\
    \ the most skilled combatants in the War, being one of only three to come out unharmed in the Battle\
    \ of Pelennor Fields and never sustaining a single injury for the entire trilogy) *Supernatural Willpower\
    \ (Aragorn's will is implied to be superior to all other mortals of his time, including the likes\
    \ of Denethor whose \"strong will\" is noted to have been a significant factor in preventing his mind\
    \ from being dominated by Sauron during their mental contests.Unfinished Tales, Part Four: The Palant\xED\
    ri With the advantage of his authority over the Palant\xEDri, Aragorn was even capable of overpowering\
    \ Sauron's will to expell him from using the Palant\xEDri for a time, albeit such a feat is beyond\
    \ Aragorn in a direct confrontation) *Magic *Healing *Possibly Curse Manipulation/Death Manipulation\
    \ (As a descendent of Luthien and Melian the Maia, Aragorn inherited the ability to utilise \"magic\"\
    . While this is primarily used for healing purposes using herbal ingredients, Aragorn is potentially\
    \ capable of replicating curses upon oath-breakers like his ancestor Isildur did.The Lord of the Rings:\
    \ The Return of the King, Book Five, VIII The Houses of HealingLetter 156 Aragorn even makes a similar\
    \ oath that any who touches And\xFAril save himself will die, although this is never tested in the\
    \ storyThe Lord of the Rings: The Two Towers, Book Three, VI The King of the Golden Hall) *Blessed\
    \ (As one of the D\xFAnedain/N\xFAmen\xF3reans, Aragorn was the only character during the time of\
    \ the War of the Rings to have had the blessings of Elenna almost completely restored in him. As such,\
    \ he is granted several blessings) with the abilities of **Enhanced Senses **Empathic Manipulation\
    \ **Regeneration (Low) **Telepathy ** Resistance to Disease Manipulation (D\xFAnedain/N\xFAmen\xF3\
    reans possessed several blessings alongside their enhanced physiques.The Nature of Middle-Earth, Part\
    \ Three: The World, its Lands, and its Inhabitants, XI Lives of the N\xFAmen\xF3reans Notably, Aragorn's\
    \ hearing is superior to even Legolas, an elf, in the right conditions.The Lord of the Rings: The\
    \ Two Towers, Book Three, V The White Rider Moreover, his Empathic Manipulation was capable of inspiring\
    \ enough awe that others are unable to withstand his \"gaze\" for long when \"the light of his eyes\
    \ is kindled\", while even friends such as Gimli or Legolas are unable to help but look upon Aragorn\
    \ in awe when he is at full majesty.The Lord of the Rings: The Two Towers, Book Three, III The Riders\
    \ of Rohan At his best, Aragorn's visage is able to inspire a similar awe to that inspired by one\
    \ of the High Elves and the light of Valinor, and even when outnumbered and in a terrible position,\
    \ he was still capable of causing doubt and pause within enemy warriors with but a warningThe Lord\
    \ of the Rings: The Two Towers, Book Three, VII Helm's Deep) *Social Influencing (Aragorn's reputation\
    \ as Strider was capable of inspiring fear within Bree folk, while witnessing his combat skills was\
    \ capable of causing enemy soldiers to halt their pursuit of his fellow warriors at the Hornburg.The\
    \ Lord of the Rings: Fellowship of the Ring, Book One, XI A Knife in the Dark As King and military\
    \ leader, his reputation, leadership, and social status inspired awe, respect, and joyThe Lord of\
    \ the Rings: The Return of the King, Book Six, V The Steward and the King) *Acausality (Type 2; Changes\
    \ to the past or future are unable to affect the \"Music in being\", otherwise referred to as the\
    \ presentMorgoth's Ring: PART FIVE. III.) *Resistance : **Mind Manipulation (The barrier of Unwill\
    \ within every individual mind prevents mental penetration by even the likes of Sauron without consentThe\
    \ Nature of Middle-Earth, Part Two: Body, Mind, and Spirit, IX \xD3SANWE-KENTA.) **Soul Manipulation\
    \ (Soul with free-will are considered indestructibleLetters of Tolkien: Letter 211) ** Possibly resistance\
    \ to Fear Manipulation (Aragorn was capable of withstanding being within the presence of the Oathbreakers,\
    \ who are described as \"wraiths of fear and darkness\". However, it is not completely clarified whether\
    \ or not the fear they cause is simply due to their nature and reputation as ghosts or if it is a\
    \ supernatural effect). |-|And\xFAril= *Damage Reduction (The gift of Galadriel and Celeborn's sheath\
    \ ma"
