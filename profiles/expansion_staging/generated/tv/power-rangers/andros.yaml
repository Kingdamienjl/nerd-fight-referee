- id: claim-standard-equipment-3ce5576e
  section: equipment
  axis: equipment
  text: 'Wrist Communicator=right|300px |-|Astro Morpher=right|350px |-|Astro Blaster=right|350px |-|Spiral
    Saber=right|350px |-|Battlizer Gauntlet=right|350px |-|Red Galaxy Glider=right|250px |-|Megatank=right|350px
    |-|Astro Megazord= |-|Delta Megazord= |-|Mega V1= * Wrist Communicator: While not used much. The In-Space
    Rangers keep the communicator that was used by older Rangers. It can be used to communicate with others
    and teleport. * Astro Morpher: The morpher that the Rangers use to transform into the In-Space Power
    Rangers. It has 12 buttons that the Rangers press to activate its various uses. By entering 3-3-5
    they transform into Power Rangers. By entering 2-5-9 the Rangers can summon their Galaxy Gliders.
    By entering 7-6-1 they can deploy the Megatank. By entering 1-0-8 they can connect with D.E.C.A..
    By entering 5-4-1 the Rangers can summon the Astro Megazord. It is to be noted that the Rangers never
    used any of these combinations other than the standard 3-3-5 since they can access their equipment
    normally without the use of the Astro Morpher but it is an option they have in case its needed. *
    Astro Blaster: The Astro Blaster is the standard blaster that the In-Space Rangers use as part of
    their standard arsenal. The blaster fires a blue energy blast that is capable of phasing through others
    with the right adjustments. The blaster itself can be freely adjusted, changing the strength and the
    applications of the blast itself, as previously mentioned. The Astro Blaster can be split into two
    smaller guns or even combined with other special weapons of the Rangers. Five Astro Blasters can combine
    their strength to create a big energy sphere. * Spiral Saber: Andros'' personal special weapon. It
    is a drill sword that can be used in close combat but also in ranged combat as it can create energy
    blasts. The Saber can be used to reflect attacks, break forcefields and combine with the Astro Blaster
    to form the Spiral Saber Booster. * Battlizer Gauntlet: A gauntlet that Andros uses in combat. It
    has 3 functions. Button 1 covers Andros'' fist in red grid energy increase the strength and impact
    of his strikes. Button 2 releases various energy beams that slice through objects that can normally
    overpower him. Button 3 unleashes the power of the Battlizer and transforms Andros into the Red Battlizer
    Ranger. * Red Galaxy Glider: The jet board of the Power Rangers. It is used to fly anywhere and everywhere,
    from cities to a planet''s atmosphere all the way to outer space. It is also a viable tool for combat
    as it has been used various times to combat threats in outer space, fast targets or even to distract
    and attack targets on the ground. Its speed can be accelerated or decreased depending on the pilot
    leaning forward of backwards. * Megatank: A heavy vehicle designed and made by Andros to navigate
    and operate on rough terrains. As aforementioned, the Megatank can navigate in tight and rough spaces
    and it also has a crane that can be used to defuse and nullify bombs.Power Rangers In-Space Ep8; When
    Push Comes to Shove The materials of the Megatank allow it to safely "travel" from outer space to
    the atmosphere of various planets like earth to the ground. * Astro Megazord: Andros is capable of
    summoning the Astro Megazord * Delta Megazord: Andros is capable of summoning the Delta Megazord *
    Mega V1: Andros is capable of summoning the Mega V1'
  source_ids: *id003
  decisive: false
