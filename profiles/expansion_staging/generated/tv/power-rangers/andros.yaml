  name: 'Mega V1= * Wrist Communicator: While not used much. The In-Space Rangers keep the communicator
    that was used by older Ra'
  description: 'Mega V1= * Wrist Communicator: While not used much. The In-Space Rangers keep the communicator
    that was used by older Rangers. It can be used to communicate with others and teleport. * Astro Morpher:
    The morpher that the Rangers use to transform into the In-Space Power Rangers. It has 12 buttons that
    the Rangers press to activate its various uses. By entering 3-3-5 they transform into Power Rangers.
    By entering 2-5-9 the Rangers can summon their Galaxy Gliders. By entering 7-6-1 they can deploy the
    Megatank. By entering 1-0-8 they can connect with D.E.C.A.. By entering 5-4-1 the Rangers can summon
    the Astro Megazord. It is to be noted that the Rangers never used any of these combinations other
    than the standard 3-3-5 since they can access their equipment normally without the use of the Astro
    Morpher but it is an option they have in case its needed. * Astro Blaster: The Astro Blaster is the
    standard blaster that the In-Space Rangers use as part of their standard arsenal. The blaster fires
    a blue energy blast that is capable of phasing through others with the right adjustments. The blaster
    itself can be freely adjusted'
