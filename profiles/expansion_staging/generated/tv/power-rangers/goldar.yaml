      all of the moves and fighting styles of the opponent , let them be combination of multiple martial
      arts or combining dancing, bugs or athletism with martial arts to create new techniques that are
      powerful enough to give trouble to Zedd''s armies Mighty Morphin Power Rangers magazine profiles,
      Goldar can "see attacks coming from moon distance away" or predict the attacks of the opponent before
