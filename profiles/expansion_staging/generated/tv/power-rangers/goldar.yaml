- id: claim-weaknesses-7deaedfc
  section: weaknesses
  axis: weakness
  text: 'Often arrogant and cocky when fighting way weaker foes Notable Attacks/Techniques: *Fire attacks:
    Goldar can create fire attacks from his sword that can bend and follow the target, working as homing
    fire blasts that can also eradicate Putties who can already resist similar abilities *Stealth: Goldar
    can at times act stealthy, it is also enough to remain undetected from Zordon and his sensors which
    are galactic in range and can extent to other dimensions and even the Morphin Grid, contains molecular
    to sub-atomic sensors, sensors which see through shapeshifting, energy detecting and much more *Teleportation:
    Goldar can teleport anywhere he wants, let it be another celestial body, voids, dimensional gaps or
    other dimensions, teleportation can also be used in combat Notes: As Power Rangers as a verse is under
    massive revisions, it should be noted that the profile should not be used in vs matches until the
