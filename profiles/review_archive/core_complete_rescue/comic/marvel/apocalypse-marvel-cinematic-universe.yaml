    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: *Regenerative Healing Factor:
        Apocalypse acquired near-instantaneous recuperative powers to mend wounds
        and regenerate lost anatomy. When Mystique (disguised as Psylocke) slit his
        throat, Apocalypse recovered immediately. Even with his armor ripped off,
        Apocalypse was still healing from the disintegration caused by the Phoenix.
        *Telekinesis: Apocalypse has formidable telekinetic abilities, which border
        on matter manipulation. He can pull dust-like particles from matter that he
        can turn into various objects and disintegrate objects into said particles.
        Apocalypse can levitate objects of immense size to launch at his opponents.
        Apocalypse also frequently utilized this to fuse his opponents within walls
        or on the ground. On the grandest scale, he was capable of destroying a large
        portion of Cairo in a "sandstorm" and reassembling most of the material into
        a personal pyramid. However, his telekinesis is not absolute, as he needed
        Magneto''s manipulation of the magnetic poles to destroy human civilization
        *Matter Transmutation: Apocalypse can transmute matter into anything he wants,
        as he gave Archangel new metallic wings and a new helmet for Magneto. Apocalypse
        could liquefy rock surfaces and turn portions of it gelatinous and rubber-like,
        enabling him to trap his foes *Telepathy: Apocalypse had a degree of telepathic
        abilities, able to sense telepathic activity and block enemy telepaths. However,
        he could not look into someone''s mind, plant or erase memories, or control
        it, which is why he wanted Charles'' body. Still, he can instantly connect
        with Cerebro and force the nations to destroy all their nuclear weapons. While
        battling mentally with Charles, Apocalypse gained the upper hand relatively
        quickly, to which the fight only shifted out of Apocalypse''s favor when Phoenix
        joined the fight. *Barriers: Apocalypse can generate an extremely durable,
        yellow-hued energy shield around himself, able to withstand the combined attacks
        of Storm''s lightning, Cyclops''s optical blasts, and Magneto''s tremendous
        torrent of high-speed metal projectiles. However, it did not protect him from
        Phoenix''s power for long. *Teleportation: Apocalypse can teleport over tremendous
        distances at will, generating an immense sphere of violet light around himself
        and others or a hazy, violet portal he and others can walk through. *Mutant
        Power Bestowal: Apocalypse can bestow others with extraordinary powers and
        abilities, or even enhance their natural mutant powers, as he would periodically
        do with each new generation of his Horsemen of Apocalypse. He gave Psylocke
        more powerful and versatile energy projections, provided Archangel bio-metallic
        wings (far more formidable than his previous organic ones), as well as improved
        Storm''s electrokinesis and flying capability (turning her hair white in the
        process). Furthermore, he granted Magneto an even greater power, enabling
        the latter to manipulate Earth''s magnetic poles and causing worldwide disaster.
        Apocalypse also amplified Professor X''s mind power, making Charles able to
        deliver a telepathic message from Apocalypse to all the people of Earth *Host
        Power Absorption: Every time Apocalypse''s essence enters a new host body,
        he not only retains all of his previous abilities but also gains the abilities
        of his host, thereby continually expanding on his arsenal of abilities. ==Notable
