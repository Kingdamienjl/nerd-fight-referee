  intelligence:
    text: 'General= Gifted (Received summa cum laude from Columbia Law School, and
      is a very skilled lawyer) |-|Skill= {{Border|Scroll=yes|Visible=Yes|Content=
      Daredevil is an extremely skilled martial artist, and has been praised for his
      prodigal skill by other martial arts masters such as Stick, Elektra, Iron Fist,
      Nobu, and Bakuto. While casual, had the upper-hand on Maya Lopez, who 3 years
      later would go on to fight evenly with HawkeyeHawkeye, S1E3Hawkeye, S1E5 and
      even Yelena Belova and Kate Bishop simultaneously.Hawkeye, S1E4 He consistently
      shows creativeness and adaptability in combat, such as using a gun attached
      to his hand to his advantage, running up a wall to escape a hold, and using
      his surroundings to his advantage to burn Nobu alive, who was about to kill
      him prior to that. }} Standard Tactics: Despite being a non-lethal fighter,
      Daredevil typically never holds back in a battle and brutalises his opponents
      whether they be a goon, henchman or arch-nemesis. He has hospitalised multiple
      criminals in this regard, with the first man he beat up having to eat through
      a straw for a month. However, he avoids intentionally killing anyone and typically
      limits himself to hand-to-hand combat with his Billy Club so as to not inflict
      lethal injuries. Younger opponents are one of the few exceptions to Matt''s
      ferocity as he has a notable sensitivity towards them, as seen when Stick tricked
