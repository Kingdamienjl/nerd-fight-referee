    text: 'Wall level+. Can create pressure domes to block attacks,Uncanny X-Men #283
      higher against elemental and energy based attacks (Her powers naturally react
      to protect her from attacks of this nature). Up to Outerverse level at her peak
      and accessing her godhead (Should be comparable to her AP, and she was able
      to take an attack from a Dominion)'
    source_ids:
    - vsbattles-black-panther-modern-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: 'Superhuman (Fought and defeated Black Panther after previously fighting
      the Dora Milaje.World''s Apart #3 After getting stabbed in the ribs and struck
      by her own lightning, proceeded to fight off assailantsX-Treme X-Men #14X-Treme
      X-Men #15 Fought in the Genesis War for Arakko, which lasted around 70 daysX-Men:
      Red #14)'
    source_ids:
    - vsbattles-black-panther-modern-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Planetary usually, Interdimensional with portals, up to Universal with senses
      (Narration states that Storm perceives the universe "... the empty space, bright
      stars, solid planets" all as patterns of energy that she's able to control.
      Mentions that she sometimes feels as if she has pierced the core of creation
      and something behind and within it all), Outerversal at peak
    source_ids:
    - vsbattles-black-panther-modern-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Above Average (Storm has been the leader of the X-Men and thinks of creative
      ways to use her powers in almost any situation, and is aware of the effect her
      powers have on the planet. Served on the governing bodies both mutant nations,
      Krakoa and Arakko, while also being the regent/representative of the entire
      Solar System to the rest of the universe. Is an expert at pickpocketing and
      lock picking. Picked a lock designed by T''Challa to not yield to science or
      magicDoomwar #1) Standard Tactics: Storm often refrains from using her full
      strength for several reasons. Storm more often than not refrains from killing,
      but will if necessary. Storm tries to be careful about the ways she alters the
      weather in one location because it will affect the weather in another part of
      the world. Lastly Storm refrains from using her more powerful abilities in populated
      areas out of fear of collateral damage.'
    source_ids:
    - vsbattles-black-panther-modern-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
