    - field: weaknesses
      value: 'Due to his damaged psyche and experiences, Cosmic Ghost Rider does not
        demonstrate the same demeanor as he did as the Punisher. Also, due to his
        insanity, he sometimes forgets that he has great supernatural/cosmic power
        at his disposal. His normal Penance Stare does not work on those beings who
        are either innocent or feel no regret for their actions. As he is technically
        dead, Cosmic Ghost Rider can be controlled by beings who hold power over the
        dead, such as Hela. He cannot readily time travel with the Time Stone on a
        whim and has to charge it with the Power Cosmic first. Due to the mental strain
        of bearing both the Power Cosmic and the power of a Spirit of Vengeance, Cosmic
        Ghost Rider can suffer mental fatique if he uses his powers constantly over
        an extended period of time. This can allow him to become dazed and even knocked
        out. Feats: *Has to hold back not to destroy worlds. *Fought and killed most
        of an army made up of 166 alternate reality heroes. *Defeated and killed&nbsp;an
        alternate version of&nbsp;Thanos Notable Attack/Techniques: *Penance Stare:
        Cosmic Ghost Rider looks into his opponent''s eyes, and forces them to experience
        all the pain and suffering they have caused others. **Penance: Cosmic Ghost
        Rider, uses a version of the Penance Stare that incinerates his target whether
        they feel regret or not for their actions. *Hellfire: Cosmic Ghost Rider is
        able to summon and project Hellfire. He''s been seen using it fly by shaping
        it into a surfboard and release extremely large explosions of it. Note: *Before
        making any changes to this page, please read and follow the Power-scaling
        Rules for Marvel and DC Comics. *The version of Thanos that Cosmic Ghost Rider
        fought and killed is not as powerful as the Thanos of modern day comics. The
        alternate Thanos that we see Cosmic Ghost Rider defeat should ultimately be
        comparable to Thanos at an earlier point in his career, who should, in turn,
        be comparable to Classic Adam Warlock. *Although his feat of fighting a large
        army of heroes is impressive in its own right, it should not be used as justification
        for his scaling. Due to Cosmic Ghost Rider''s meddling, the alteration in
        the Earth-616 timeline that created those version of the heroes would have
        also created changes to their histories and feats. Hence, we cannot truly
