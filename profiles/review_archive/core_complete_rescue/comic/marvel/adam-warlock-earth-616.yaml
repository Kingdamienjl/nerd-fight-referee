        one of the cornerstones of all reality throughout Earth-616, with the Gems
        themselves encompassing within them entire Multiverses of infinite proportions.
        Later managed to contend with and do visible harm to Champion, guardian and
        master of the Power Gem whilst he was in possession and usage of it, pushing
        him back with his force fields and later one-shotted him while both he and
        Champion became stronger. Nearly single-handedly stomped all of the Annihilators
        one on one, albeit with some help from Adam Warlock. Despite this, Thanos
        is already consistently superior to Warlock overall, being able to two-shot
        or even kill him with a single blast, despite Adam being able to survive the
        merging of the timelines of two Earths"Earth" refers to a designated Universe
        in Marvel's Multiverse (I.E Earth-616, Earth-1610, etc etc.). Managed to contend
        with and defeat his doppelganger, even doing so on the Astral Plane, thus
        scraping the inner components of Eternity's thoughts and dreams), far higher
        via Energy Projection and Magic (Has successfully managed to almost evenly
        battle Odin, with the All-Father referring to Thanos as a worthy foe unlike
        anything he had fought in eons. Later blasted Galactus and sent him flying,
        even destroying his helmet, and is listed alongside Galactus as a part of
        a list of entities capable of killing the Phoenix Force. His Force Fields
        are capable of surviving attacks from Omega Thanosi, whom he had previously
        killed in a rage, with Omega Thanosi being created from Galactus' DNA and
