  tier:
    text: '{{High 4-C}}, becomes higher from absorbing more people, {{Varies}}, up
      to far higher with Kamehameha, Galick Gun and Special Beam Cannon | {{High 4-C}},
      far higher with Self-Destruction, {{Varies}}, up to far higher with Kamehameha,
