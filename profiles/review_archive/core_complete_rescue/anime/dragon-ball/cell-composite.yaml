        limbs, and also a pair of strong hind legs that enable them to leap toward
        the non-assimilated lifeforms. Aside from leaping, they could either attack
        by biting or spitting digestive fluid as a projectile. They could be crippled
        easily with a few shots from guns before being finished by a single blast
        from a flamethrower. They were inspired by a mutated form of Norris''s head
        after he was mutated by the Thing''s cells. *Scuttler Pods: A form of Thing
        that is basically a fleshy, blob-like biomass that is immobile but dangerous
        due to manifesting Scuttlers as means of defense. Their prime weakness is
        the inability of moving combined with having no alternate means of defense.
        They can be destroyed by blasts from flamethrowers and a variety of firearms.
        *Walkers: Form of Thing that manifests as a humanoid monster with a deformed
        torso, deformed claw hands, and insectoid legs that were formerly humanoid
        ones. Their early forms were brutish, muscular monsters with a huge, transparent
        hole in their torso. *Imitations: They are a form of Thing that was previously
        introduced in the films. They perfectly assumed their victim''s appearance
        and were able to transform to their mutated form when their potential victims
        lowered their guard. For the game incarnations, they tend to retain some elements
        of their hosts'' appearance like clothes that are still intact though their
        limbs are a in mutated state, similar to the mutated Palmer in the 1982 film.
        *Dog Beasts: Thing beast that is similar to the mutated form of Lar''s dog
        as both formerly had assimilated dogs. Unlike the latter, Dog Beasts still
        retain their limbs (though said body parts also mutated to the point where
        they could support their weight as well as enable them to run at tremendous
        speed). *Ruptures: They are a form of huge Thing that takes up an entire room
        or even be part of the room integrated into the architecture. Typically, they
        have human forms embedded in them and attack with tentacles, teeth and fluids.
        They are immobile and confined to the location in which they are met, which
        made them vulnerable due to the inability of avoiding their enemies'' attacks.
        Note: All media, excluding the ones where it has no feats, have been used.
