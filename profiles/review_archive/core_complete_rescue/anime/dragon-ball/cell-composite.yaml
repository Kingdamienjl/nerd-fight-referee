    - field: weaknesses
      value: 'Cannot function out of water Notable Attacks/Techniques: *Jaw: A powerful
        jaw capable of killing other cells, usually resulting in them exploding into
        chunks of meat. *Proboscis: Some cells have a proboscis, which essentially
        allows it to drink its opponent alive, providing it sustenance and healing
        it. *Spike: A spike to use by the cell when ramming its enemies, and is more
        powerful than either its jaws or its proboscis. *Poison: A poisonous sac that
        can open to release clouds of poison around the cell. This provides it with
        an immunity against an enemy cell''s poisons, and presumably provides at least
        some resistance against others. *Electricity: An electric bulb that generates
        electricity, shocking enemies that get too close to it before having to recharge.
        Multiple bulbs allow for faster recharge time. This bulb also prevents the
        cell from getting shocked by electricity. *Jet: Outside of the flagella, this
        is the first speed part you can unlock. It allows the cell to fly forward
        at incredible speed for their size. *Cilia: Another mobility part that allows
        the cell to turn incredibly fast in the water, but on their own are rather
        slow. *Eggs: The Maa cell can release groups of black egg sacs randomly or
        after dying that, given time and if not eaten or destroyed by larger cells,
        can hatch into Juniors. Juniors are incredibly small compared to the Maa,
        but are capable of ripping apart cells normally too large for them to harm
        with their sharp jaws and their numbers. ==Notable Matchups== Victories: Losses:
