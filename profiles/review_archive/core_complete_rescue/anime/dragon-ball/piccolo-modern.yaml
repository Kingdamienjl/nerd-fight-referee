    - field: weaknesses
      value: 'Piccolo''s regeneration is stamina based and he cannot regenerate if
        his brain is destroyed. Notable Attacks/Techniques: Ki: The fighting power
        and life force of a martial artist, a tangible energy derived from the user''s
        vigor, courage, and mind. It can be used in a number of ways, such as to surpass
        the limits of one''s body to greatly increase in strength, and it can be fired
        as blasts of energy or used to create defensive barriers. Along with his Namekian
        heritage and Dragon Clan status, this is the source of Piccolo''s superhuman
        capabilities and power. He is incredibly skilled in the art of ki control.
        He often fires powerful blasts of ki from his mouth. *Antenna Beam: Piccolo
        can fire arcs of electricity from his antennae. *Chasing Bullet: A powerful
        and fast blast of ki that rapidly homes in on Piccolo''s target. *Explosive
        Demon Wave: Inherited from his father, this is one of Piccolo''s signature
        techniques. Supporting his leading arm with the other, he fires a powerful
        wave of ki straight forwards. *Eye Lasers: Piccolo can fire lasers from his
        eyes. *Hellzone Grenade: One of Piccolo''s most powerful techniques. Piccolo
        fires a large barrage of ki blasts, which lie suspended in the air around
        his opponent before they fly at them from all directions, causing a massive
        explosion. *Light Grenade: After bringing his hands together, Piccolo charges
        up and fires a high-power sphere of energy straight at his opponent, causing
        a massive explosion. *Special Beam Cannon: One of Piccolo''s signature attacks.
        After bringing his index and middle fingers to his forehead, Piccolo charges
        up and fires a spiraling laser that can drill through most opponents. Magic:
        As a member of the Dragon Clan, Piccolo has several magical abilities. *Magic
        Materialization: Piccolo can create objects and clothing, seemingly out of
        thin air, often using this to create his weighted clothing whenever he has
        a need for it. Namekian Physiology: Piccolo is a Namekian, a long-lived race
        of slug-like aliens with exceptional hearing. This grants him several abilities,
        most notably the power to regrow lost limbs and destroyed organs as long as
        his head remains intact. He can also extend his arms to great lengths to attack
        and grab opponents from a distance, and he can even use his regenerative powers
        to greatly increase his body''s volume, growing significantly in size as a
        result. ==Others== Notable Victories: Notable Losses: Inconclusive Matches:
        category:Ednaxel2'
