      value: Gifted (Having been trained in the Turtle School alongside Goku by Master
        Roshi from an early age, Krillin is an exceptionally skilled martial artist
        with decades of combat experience. Lacking the Saiyan blood, sheer strength,
        and genius of Goku, Krillin instead depends on his tactical smarts, intelligently
        and practically putting his skills to use to survive against much stronger
        opponents. He has developed a number of techniques for this purpose)
