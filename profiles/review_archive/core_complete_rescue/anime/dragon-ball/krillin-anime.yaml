        \ vigor, courage, and mind. It can be used in a number of ways, such as to\
        \ surpass the limits of one's body to greatly increase in strength, and it\
        \ can be fired as blasts of energy or used to create defensive barriers. Learning\
        \ how to use ki at an early age, Krillin is now very skilled in its use, and\
        \ has been called the strongest human on Earth, something that doubtlessly\
        \ stems from his training under many martial artists and the potential he\
        \ had unlocked by Grand Elder Guru. *{{Nihongo|Double Tsuibikidan|\u30C0\u30D6\
