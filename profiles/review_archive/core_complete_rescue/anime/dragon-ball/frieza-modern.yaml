  intelligence:
    text: Academically=Supergenius (Robotnik is an ingenious and cunning individual.
      Calculating and deceptive, Robotnik was able to successfully win the Great War,
      overthrow the Kingdom of Acorn, and rule for over a decade. During his reign,
      Robotnik masterminded numerous schemes to undermine the Freedom Fighters. A
      scientific genius of remarkable skill, he has created and managed a global empire.
      This includes mechs and battalions of robots equipped with instruments far surpassing
      modern weaponry, machines capable of defying the laws of physics, travelling
      through and stopping time, splitting matter, controlling minds, sealing and
      nullifying powers and even artificial intelligence, one of which he created
      by accident. In an extremely short amount of time created a robotic bird that
      can spontaneously explode other robots. Just after going off his insanity and
      with no resources managed to figure out the reason why he can't defeat Sonic,
      the exact same conclusion a fellow genius Mammoth Mogul came to. Amongst his
      greatest feats are creating the Ultimate Annihilator which could erase his entire
      universe and create other universes, and working with Dr. Wily to create the
      Egg-Wily Machine X and Super Genesis Wave, which could harness enough power
      to completely rewrite all of reality. Stated to possess an unmatched intellect
      and be able to build, operate or invision "just about anything". |-|In Combat=
      Genius (Having squared off against Sonic, Freedom Fighters and variety of other
      enemies for years of his reign, Eggman gained a high amount of combat experience,
      being able to fight on par with Sonic outside and inside of his Mechs, on occasions
      completely dominating the blue blur, most notably with his Egg Beater battlesuit)
    source_ids:
    - vsbattles-frieza-modern-dragon-ball
    confidence: 0.6
    notes: auto_repair source extraction
