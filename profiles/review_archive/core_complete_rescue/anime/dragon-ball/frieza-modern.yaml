  durability:
    text: Varies between Low Multiverse level, possibly higher (Fought hand-to-hand
      with rage-powered Sonic to the death. His species, the Overlanders, fought the
      Mobians in the Great War on equal footing. Casually tanked a roar that collapsed
      a universe),Sonic BlastSonic felt the roar and states it had the same sensation
      as the destruction of a Zone's reality, Space & Time, exploding. He wasn't even
      sure the Flickies survived till they bit Robotnik Prime's hand. higher as roboticized
      (His robot body's durability is able stone wall Sonic, his body effectively
      roboticize with a touch and his immortality make him difficult to harm or kill),
      lower when Organic. Complex Multiverse level with his Energy Dome. His machines
      varies higher in Low Multiverse level, possibly higher (Sonic's base AP could
      not damage the Egg Beater's shield and his Rage Power only caused a dent. The
      EDB's presence made Sonic use Super rather than fighting it in Base. Bunnie
      and Mighty tried and failed to break out from the Egg Grapes) to Complex Multiverse
      level with the Egg-Wily Machine X (Its forcefield withstood Super Sonic's strikes)
    source_ids:
