  intelligence:
    text: 'Gifted (Jason was shown to be a skilled detective, as he could deduce that
      a message was sent from Two-Face and later find his location, he could tell
      something was wrong with Speedy by watching his eyesNew Teen Titans Vol. 2 #20,
      May 1986, and he deduced candidates for who his birth mother could be. During
      his six months of training with Batman, he mastered computer science, and he
      knows how to administer first aidBatman Vol. 1 #412, October 1987. After his
      resurrection, he was skilled enough to hold his own against the likes of Batman
      and Nightwing, although Tim Drake noted that he was more skilled than Jason,
      and that Jason was not a smart fighter.) Standard Tactics: As Robin, Jason relies
      on his acrobatics to avoid attacks and get into position to deliver his own.
      As Red Hood, he only enters close combat when he has to, as he primarily uses
      his wide range of guns to attack his enemies. When he does enter close combat,
