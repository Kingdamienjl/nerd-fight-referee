      value: 'Due to his advanced age, he began to develop arthritis, but he can use
        Finka''s nanobots to counteract the effects. Notable Attack/Techniques: *Stealth
        Master: Excluding characters with perfect invisibility or supernatural powers,
        Sam Fisher is arguably one of the greatest stealth artists in all of fiction.
        He makes use of blending into the shadows and silent movement in order to
        appear invisible to his enemies. His ability in stealth is so great that it
        is possible for him to be a foot away from his enemy and still appear completely
        invisible. He also has several pieces of equipment that help to further enhance
        his stealth ability, for example he has multiple EMP devices to disable lights
        creating more shadows, his tactical operations suit is lined with a material
        named Gore-Tex that suppresses his heat signature making him invisible to
        various sensors and has several devices to help him detect his enemies before
        they can detect him. Fisher''s knowledge of stealth tactics and environmental
        awareness enables him to sneak around most opponents and to subdue them quickly
        using either lethal or non-lethal means. *Athletic ability and Parkour skil'
