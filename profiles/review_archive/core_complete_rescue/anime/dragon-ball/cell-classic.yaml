        to be a gag, and thus it can be restricted in versus matches. Notable Attacks/Techniques:
        |-|Special Moves= SoulSword1.gif|Soul Sword SpinalSlide.gif|Sliding Kick BoneShaker.gif|Bone
        Shaker Skeleport1.gif|Skeleport (KI) Skeleport2.gif|Skeleport (KI2) PowerDevour.gif|Power
        Devour PowerDevour2.gif|Power Devour (Projectiles) PowerDevour3.gif|Power
        Devour (Physicals) SearingSkull.gif|Searing Skull FlameBlade.gif|Flame Blade
        SkeleSkewer.gif|SkeleSkewer SkullScrape.gif|Skull Scrape SpinalDiveKick.gif|Dive
        Kick SoulDrainSpinal.gif|Soul Drain SpinalGrimReaper.gif|Grim Reaper StunningSkull.gif|Stunning
        Skull *Soul Sword: Spinal swings his cutlass imbued with fire. With the Shadow
        version, he performs the move twice in a row. *Sliding Kick: Spinal slides
        and kicks the opponent. *Bone Shaker: Spinal rushes forward to bash the opponent
        with his shield. *Skeleport: Spinal touches the ground with the grip of his
        sword and teleports to another location, usually behind or right in front
        of the opponent. With an alternate version, he spins on himself, sinks through
        the ground and emerges in another location. *Power Devour: Spinal rises his
        shield while it glows in energy. While active, the shield can absorb projectiles
        and physical blows. The absorbed attacks are then converted into skulls that
        start floating around Spinal, who can use them to perform stronger versions
        of his techniques. Spinal can also sacrifice some of his own energy (not health)
        to summon up to 5 skulls. *Searing Skull: Spinal imbues one of his skulls
        with flames and shoots it at the opponent. With the Super version, Spinal
        shoots a stronger skull, marked by a long, fiery trail. With the Shadow version,
        he fires two skulls in a row. *Flame Blade: Spinal delivers a rising slash
        with his cutlass imbued with fire. With the Super version, Spinal keeps swinging
        the sword several times with a rotatory motion. The combo ends with a Searing
        Skull that knocks the opponent down. *SkeleSkewer: Spinal lunges forward with
        his cutlass. *Skull Scrape: Spinal crouches and slides forward, targeting
        the opponent''s legs with his flaming cutlass. With the Super version, he
        drives the sword against the opponent several times. *Dive Kick: Spinal leaps
        in the air and falls on the opponent leg-first, delivering a diving kick.
        *Soul Drain: Spinal shoots several rings of fire from his shield. These rings
        will deplete the opponent''s energy and give it to Spinal. The amount of stolen
        energy depends on how many rings hit the opponent. *Grim Reaper: A Super move.
        Spinal imbues his cutlass with fire and jumps towards the opponent, attacking
        them with a diving slash. *Stunning Skull: A Super move. Spinal shoots out
        a blue skull that damages and stuns the opponent. |-|Finishers= *Shield Stab:
        Spinal delivers two frontal slashes with his cutlass, then brings his shield
        forward and extends the spike at its center, stabbing the opponent three times
        and killing them. *Skeleton Grab: Spinal rises his cutlass and summons a skeleton
        that emerges below the opponent and drags them underground. *No Mercy III:
        Spinal summons a lightning bolt that incinerates the opponent. *No Mercy IV:
        Spinal conjures electricity from his shield, summoning a pair of demonic hands
        that restrain the opponent. A huge skull then falls from the sky, crushing
        the opponent. *No Mercy V: Spinal uses his powers to lift the opponent without
        touching them. He then conjures electricity from his shield, causing the opponent
        to be drained of their blood, which splashes on the ground. ShieldStab.gif|Shield
        Stab SkeletonGrab.gif|Skeleton Grab SpinalNM3.gif|No Mercy III SpinalNM5.gif|No
        Mercy IV SpinalNM4.gif|No Mercy V *Humiliation: Spinal points his cutlass
        at the defeated opponent, who is then mysteriously forced to dance. center|thumb|Humiliation|320px
        |-|Others:= *Fighting Style: Spinal is first and foremost a swordfighter and
        his weapons of choice are a large cutlass and a small round shield. He wields
        them with great mastery, due to his past as a legendary and fierce warrior,
        and his balanced offense and defense are supported by a variety of supernatural
        abilities. Spinal mainly attacks using his sword, with technique ranging from
        wide slashes to straight thrusts, but he has a fondness for using his shield
        to bash the opponent, the hilt to hammer their head, grapples to throw them
        away and even his legs. About the latter, he employs several high and low
        kicks, knee strikes and occasionally flying dropkicks. SpinalComboKI.gif|Ultra
        Combo (KI) SpinalCombo2.gif|Ultra Combo (KI2) SpinalHiltAttack.gif|Spinal
        attacking with the hilt *Shapeshifting: Spinal possesses the unique ability
        transform into a black and white copy of his opponent when they are being
        hit by one of his combos. In this way, he gets access to to their physiology,
        weapons, powers and techniques for a brief moment and use them to end the
        combo. SpinalMimicry.gif SpinalMimicry2.gif SpinalM'
