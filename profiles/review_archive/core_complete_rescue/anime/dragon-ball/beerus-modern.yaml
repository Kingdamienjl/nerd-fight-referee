  tier:
    text: '{{2-C}}, possibly far higher Name: Horizont-Al and Verti-Cal, Al & Cal
      Origin: Sonic the Hedgehog (Archie Pre-Genesis Wave) Gender: Both Male Age:
      Unknown Classification: Unknown (The Editor doesn''t even know),Sonic Universe
      issue #31; "Inside Job" - Part Three: "Setting the Stage" Demi-Gods (The Editor''s
      last note),Sonic Universe Issue #32; "Inside Job" - Part Four: "No Holds Barred"
      Zone-Imps,Sonic the Hedgehog Archives Vol. 16; "Who''s Who profiles: Al & Cal"
      Machine Gods.'
    source_ids:
    - vsbattles-beerus-modern-dragon-ball
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Low Multiverse level (Are Extra-dimensional beings that casually control
      their Zone, Universe. Grew stronger after being hit by Ultimate Annihilator
      and from fighting each other, with their robotic forms continuously evolving,
      to the point that mere side effects of their battles threatened the existence
      of other Zones, with each Zone having it''s own divergent timestream, gaining
      the attention of Zone Cops.It is left unexplained which of their attacks were
      endangering outside zones. Presented as superior to Sonic and Tails, easily
      incapacitating both of them in a single indirect blast. Easily destroyed large
      portion of the Zone Jail, a prison for multiversal criminals, making exits for
      the Destructix), possibly far higher (Are stated to be "Omnipotent" and "All-powerful"
      by WoG, with them likely having Base Sonic cast for comparisonSonic the Hedgehog
      issue #65; "Sonic-Grams letters", by that time characters like Super Forms,
      Master Mogul First Tenure and Enerjak were established. Possibly exist as Extra-dimensional
      beings inside an Extra-dimensional Zone with complete control over it, similarly
      to their fellow Higher-Dimensional Goddess Illumina, who''se Maginaryworld and
      Precioustone are said to support the existence of Extra-dimensional worlds.
      When asked on Bumblekast about their capability of fighting the likes of Super
      Sonic, Ian Flynn answered with "maybe"), can Negate Durability with several
      of their powers.'
    source_ids:
    - vsbattles-beerus-modern-dragon-ball
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At least Infinite (Their energy blasts created an explosion fast enough
      to easily tag Sonic's and Tails' speed as they tried to escape, with Sonic being
      able to fight with Robotnik Prime faster than explosion of the Ultimate Annihilator,
      which blast reached beyond the infinite universe to reach all other Zones, infinite
      universes, in the infinite multiverse. Can dodge each other's energy attacks,
      which were seemingly able to reach out into the Multiverse)
    source_ids:
    - vsbattles-beerus-modern-dragon-ball
    confidence: 0.6
    notes: auto_repair source extraction
