  attack_potency:
    text: Multi-City Block level+ (Can smash apart wood, crush boulders in his hands,
      destroy cars, and one-shot large bears. Exactly 10 times weaker than his Great
      Ape form>963 Tons), Varies (The Kamehameha works by condensing one's Ki into
      a single point, the power of the move proportionally varying depending on how
      much power is condensed), up to far higher with Kamehameha (The Kamehameha can
      get strong enough to completely annihilate beings far superior to the user),
      Town level as a Great Ape (Destroyed Pilaf's castle, killed Grandpa Gohan, who
      fought well against Post-Korin Training Goku>9.63 Kilotons) | At least Multi-City
      Block level+, possibly higher, Varies, up to far higher with Kamehameha (Roshi
      was terrified of his Kamehameha. Easily destroyed Major Metalitron's head and
      damaged his torso, who was completely impervious to all his other attacks up
      to that point), at least Town level as a Great Ape (Stronger than before, fought
      and defeated Krillin) | Small Town level+ (Is half the strength of his Post-Korin
      Training self>4.63 Kilotons), Varies, up to far higher with Kamehameha, at least
      Town level as a Great Ape>46.3 Kilotons | Town level (By struggling nearly non-stop
      for three days against Korin, he unknowingly increased his strength by double
      what was before. Superior to Tao Pai Pai who is strong enough to throw pillars
      at Massively Hypersonic speeds), Varies, up to far higher with Kamehameha, higher
      as a Great Ape>96.3 Kilotons | Planet level (He is equal to Tien Shinhan, who
      is superior to Roshi, who previously destroyed the moon>1.5 Yottatons), Varies,
      up to far higher with Kamehameha, Large Planet level as a Great Ape>15 Yottatons
      | At least Planet level+ (Equal to youthful King Piccolo who previously defeated
      him at half strength in his much more elderly state>3 Yottatons), Large Planet
      level as a Great Ape>30 Yottatons | At least Large Planet level (Surpassed Kami,
      fought evenly against and ultimately defeated Piccolo Jr., superior to Annin
      and grew nearly twice as strong as before>6 Yottatons), Varies, up to far higher
      with Kamehameha (Declared to be able to shatter the Moon.Daizenzhuu 2 - Battle
      History - Special Attacks - Pages 202 to 217 With his Super Kamehameha, he could
      one-shot kill Piccolo)
    source_ids:
    - vsbattles-krillin-classic-dragon-ball
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Superhuman (Managed to react to and tag a pterodactyl, which can reach up
      to 67 miles per hour, 29.95 meters per second, he also evaded a large bear that
      should have such speeds, Master Roshi mentions that even pre-training, Goku
      should be able to run 100 meters in 5 seconds or in other words 20 meters per
      second) with Transonic combat speed (Can react to, fight and defeat Yamcha who
      can create shockwaves which are at least Mach one), Supersonic+ flight speed
      with Flying Nimbus (Can keep up with and outright out-speed Red Ribbon Army
      jetsDragon Ball - Chapter 81Dragon Ball - Chapter 70Dragon Ball - Chapter 93Mach
