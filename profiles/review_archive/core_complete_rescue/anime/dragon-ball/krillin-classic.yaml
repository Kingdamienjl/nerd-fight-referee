        thought up by Kame-sennin. It is a technique that condenses ki into one point
        and then fires it. The technique''s force changes based on the strength of
        its user''s ki, and if mastered it also becomes possible to control its force.
        Goku picked up on this technique in mere moments after witnessing Roshi destroy
        a battleship with it. Martial arts: Goku is an incredibly talented martial
        artist as mentioned earlier, although his experience in this continuity is
        somewhat lacking. *Janken: One of the few special attacks that Goku had before
        he acquired the Kamehameha. "Guu" [rock] is a punch, "Choki" [scissors] is
        an eye-poke, and "Pa" [paper] is a palm slap. Sometimes he uses them separately,
        but there are also times when he uses them as a combo attack. What''s more,
        there are also times when he will feint by calling out "Guu" but doing a "Paa".
        Saiyan Physiology: The physiology of a Saiyan, an aggressive warrior race
        of conquerors. Saiyans have the natural ability to control ki and to fly,
        likely playing part in Goku''s incredible talent when it comes to the usage
        and control of ki. In addition, while his lifespan is comparable to that of
        a human, Goku will remain at his peak strength for much longer. One of the
        most powerful abilities of a Saiyan is their ability to grow stronger and
        stronger through combat, allowing Goku to constantly push his own limits during
        a fight and rise to higher and higher peaks in power. This ability grants
        a substantial boost in power when Goku is badly injured, allowing him to reach
        a whole new level of power once he recovers.}} |-|Path to Power={{Scroll box|content=Ki:
        The fundamental energy that humans are comprised of, and the comprehensive
