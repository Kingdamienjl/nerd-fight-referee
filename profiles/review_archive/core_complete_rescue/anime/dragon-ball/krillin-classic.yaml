        DB movies 1-3= {{Scroll box|content=Ki: The fundamental energy that humans
        are comprised of, and the comprehensive power an individual has. Ki as a concept
        includes spiritual powers such as vitality, soberness, bravery, and so on.
        It can be used in a number of ways, such as to surpass the limits of one''s
        body to greatly increase in strength, and it can be fired as blasts of energy
