      | Low Multiverse level (Prior to the Tournament of Power, as a Super Saiyan,
      he could defeat Watagash and match Super Saiyan Goku shortly afterwards. After
      unleashing his hidden potential once again, which Vegeta previously admitted
      to be greater than his and Goku's powers, Gohan could easily overwhelm and ragdoll
      Super Saiyan 2 Goku. Requested Goku to fight him at full-strength, which prompted
      Goku to turn Super Saiyan Blue. Clashed evenly with Super Saiyan Blue Goku and
      forced him to use Kaioken to defeat him. Was stated by the narrator to have
      power that rivaled Goku's. Overpowered Koichiarator, who was able to take hits
      from Goku and Vegeta in their Super Saiyan Blue forms. Was able to trade blows
      with Super Maximum Light Speed Mode Dyspo in the Tournament of Power) | Low
      Multiverse level (Blocked a test punch from Base Piccolo and matched a suppressed
      Gamma 1, who is comparable to Goku and Vegeta up to a certain point. As a Super
      Saiyan, he clashed with a much stronger, but still suppressed Gamma 1. In his
      Ultimate state, he overpowered a full power Gamma 1, who easily stomped him
      while he was a Super Saiyan6 Universes), far higher with his Beast Form (After
      unlocking his Beast transformation, Gohan effortlessly overpowered Cell Max
      and instantly killed the creature with Special Beam Cannon to the head. Cell
      Max was beating Orange Piccolo with ease and was touted as an opponent that
      even Goku and Vegeta might not win against. Stated to be the strongest warrior.
