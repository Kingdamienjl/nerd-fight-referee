      a blast from her and Gatchan completely annihilated itThe Brief Return of Dr.
      Slump chapter 15). Complex Multiverse level with Plot Manipulation (Gatchan's
      plot prowess is akin to that of Toriyama's,Dr. Slump Arale-chan episode 59 making
      them able to create, manipulate, and even end the entire series. The narrative
      contains many worlds,Dr. Slump Arale-chan episode 219 each of which has 6D timelines
      which are countless due to each timeline naturally existing for every day, hour,
      and minute that occurs in time, as well as each action in a timeline creates
      a new timeline meaning a timeline exists for every possible future.Dr. Slump
      Arale-chan episode 190Dr. Slump 1997 episode 64Dragon Ball manga chapter 357
