      value: File:YRsvVIi.png|Freeza's second form stated to be able to destroy the
        universe. DBS_Universal_Freeza.jpg|Freeza is stated by the narrator to be
        a threat to the universe. File:Universal Freeza Final Form statement.png|Freeza's
        final form is stated by North Kaio to be able to destroy the universe. File:MHwR1SY.png|The
        Genkidama is filled with the energy of the entire universe. * The verse reach
        the Low Complex Multiverse level [5-D] thanks to Freeza who has multiple statements
        of being able to destroy the universe which is infinite and contains a superspace.
        * The verse reach Low Complex Multiverse level [6-D] thanks to Super Saiyan
        Son Goku, who is already stronger than Freeza, and is stated to have a power
        impossible to measure mathematically and to have a power from another plane
        of existence/dimension compared to those comparable to Freeza. * The verse
        reach Low Complex Multiverse level [Infinite 6-D] thanks to (Anime) Perfect
        Cell who is stated to have infinite power and to be an entire threat to the
        Living World. * The verse reach Complex Multiverse level [9-D] thanks to Super
        Saiyan 3 Son Goku who can shake the entirety of Universe 7. * The verse reach
        High Complex Multiverse level [10-D] thanks to Super Saiyan God Son Goku who
        fought Beerus in a super-dimensional combat, making them transcend Universe
        7. * The verse reach Outerverse level thanks to those comparable to Son Goku
        and Vegeta during the Tournament of Power in the manga who can affect the
        World of Void which lacks the concept of space and time and those comparable
        to (Anime) Goku Black who can affect a summit beyond the gods understanding.
      source_id: character-stats-profiles-goten-modern
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: 'It''s important to remember that power and speed corelate each other
        in Dragon Ball and this is very consistent across the franchise. The verse
        reach the Infinite speed tier with Freeza being able to destroy the entire
        infinite universe which would require infinite power and infinite speed to
        do so. == Explanations == |-|Calculations= * Dragon Ball Z (Manga) - Scaling
        Chain & Stats Chain |-|Explanations= {{#tag:tabber|Lore & Energies= * Ki Manipulation
        * Soul Physiology {{!}}-{{!}}Scaling Chains & Power Level Evolution= Scaling
        Chains & Power Level Evolution: * Dragon Ball Z (Manga) - Scaling Chain &
        Power Level Evolution * Dragon Ball GT - Scaling Chain & Power Level Evolution
        {{!}}-{{!}}Canon= center|700px Due to its large amount of medias and adaptations,
        the canonicity of Dragon Ball can be confusing. The source material is the
        perfect edition (Kanzenban) manga Dragonball. The animes Dragonball and Dragonball
        Z are adaptation and extensions of the manga as Toriyama says that Dragonball
        is the anime and the manga. The anime possess subtories that aren''t showed
        in the manga which many fans call them "fillers", the best example would be
        the ''Otherworld Saga'' which is a saga that hasn''t been showed in the manga
        at all. The anime also introduces the twelve first movie to the canon as the
        screenwriter of the anime, Koyama, and the Daizenshuu affirms that all movies
        happened in the same timeline and the anime has an entire saga, the ''Garlic
        Jr. Saga'' that confirms that the Dead Zone movie is part of the anime. The
        only exception would be the three Broly movies which would happen only in
        the alternate ''GT timeline'' as a new Broly appeared in Dragonball Super.
        Dragonball GT is a side story to the actual main one, in other words, an alternate
        ending from the original. The three Broly movies can take place in this timeline
        without inconsistencies to the narrative. The Battle of Gods movie is canon
        to ''GT'' as affirmed by Toei and heavily implied by the games aswell. The
        games are part of the canon as Dragonball Z: Kakarot, which has been stated
        many times to tell adventures and subplots that weren''t shown in the manga
        and to be canon, has Xenoverse events directly linked to this game, making
        Xenoverse canon. Xenoverse is part of the same universe and setting as Dragonball
        Heroes putting not only Heroes but many games linked to it canon to the main
        continuity. * Dragonball''s Canon {{!}}-{{!}}Cosmology= Cosmology: * Dragon
        Ball''s Cosmology (Low-End) * Dragonball''s Cosmology (High-End) Rebuttals:
        * Regarding 1-A Otherworld }} == Characters == === Dragon Ball - Dragon Ball
