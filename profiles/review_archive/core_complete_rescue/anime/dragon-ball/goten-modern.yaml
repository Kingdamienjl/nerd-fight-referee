        impossible to measure mathematically and to have a power from another plane
        of existence/dimension compared to those comparable to Freeza. * The verse
        reach Low Complex Multiverse level [Infinite 6-D] thanks to (Anime) Perfect
        Cell who is stated to have infinite power and to be an entire threat to the
        Living World. * The verse reach Complex Multiverse level [9-D] thanks to Super
        Saiyan 3 Son Goku who can shake the entirety of Universe 7. * The verse reach
        High Complex Multiverse level [10-D] thanks to Super Saiyan God Son Goku who
        fought Beerus in a super-dimensional combat, making them transcend Universe
