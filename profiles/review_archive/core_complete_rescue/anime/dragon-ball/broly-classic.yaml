  intelligence:
    text: Average generally, Extraordinary Genius combatant (Although he lacks knowledge
      when it comes to things that aren't related to fighting, Goku is a master of
      prodigal skill when it comes to martial arts, with years of experience fighting
      against powerful opponents with a plethora of abilities. As a child, he was
      able to beat martial artists on such a level as Grandpa Gohan, who was stated
      to be an unparalleled master in all martial arts. In his battle with Master
      Roshi, he copied his Drunken Fist style to adapt to it and created his own style
      known as the "Crazy Fist" in response. His skill when it comes to combat and
      the usage of Ki allows him to replicate other Ki-based techniques after seeing
      them once, and he was the first to realize how much energy the Super Saiyan
      transformations unnecessarily drained. Despite this drawback, he was the first
      to master the Super Saiyan state, making it highly efficient and subsidizing
      the need to reach a higher grade, which decreases speed as a side effect. He
      is a genius in combat and is capable of devising new applications of his techniques
      on the fly, such as using Kamehameha with his feet. Was able to go toe to toe
      with Cell, a being created by the genius scientist Dr. Gero to be the ultimate
      warrior, spending 20 years taking the DNA and footage of every fighter on earth
      and on Namek, copying their techniques, their mannerisms, and their skills to
      create him, including Goku himself, also having knowledge on how he approaches
      battle as well. Capable of analyzing and copying Beerus' fighting style, allowing
      him to match Beerus' attacks and cancel out the shockwaves that threatened the
      universe. Later in Super, before adapting to Hit's Time-Skip, he was able to
      predict the movements he'd make in the 0.1 seconds of skipped time and react
      properly, beating a technique that for over 1000 years was completely unstoppable,
      even as Hit was constantly improving said technique in battle. Immediately figured
      out how to use a Ki blast to resurrect himself after he was killed by Hit. Goku
      mastered Ultra Instinct, a technique even the Gods of Destruction have deemed
      a difficult task, with none of them stating to have mastered it, including Beerus,
      despite being hundreds of millions of years older with experience as a God of
      Destruction. He also had performed such a feat in less than 48 minutes and is
      the only mortal in all 12 universes to have mastered the technique. He can rely
      purely on his muscle memory and something "beyond" instinct to fight, no longer
      needing to consciously think to do so while being more serious in this form.
      In all of Universe 7, he is among the most skilled warriors to exist, superior
      to master martial artists such as Master Roshi, Piccolo, the Kais, and only
      rivaled by Vegeta, being labeled as one of the only few who can entertain Beerus,
      the God of Destruction of Universe 7. Among all 12 universes, he is one of if
      not the most skilled fighter, superior to many other master-level warriors and
      beings thousands up to millions of years older than him, being stated to have
      surpassed the gods. Was able to fight Broly after he adapted to Super Saiyan
      God Vegeta with only Super Saiyan, being able to keep up through sheer skill
      despite the power difference)
    source_ids:
    - mediawiki-broly-classic
    confidence: 0.6
    notes: auto_repair source extraction
