    - field: weaknesses
      value: 'Frieza is arrogant and sadistic, preferring to prolong an opponent''s
        suffering rather than killing them right away, even when it is entirely feasible
        for him to do so. Frieza''s ki rapidly drains when he uses 100% of his power
        due to his lack of experience with it, and he cannot fight for long in this
        condition. Notable Attacks/Techniques: {{Border|Visible=Yes|Content= *Ki:
        The fighting power and life force of a martial artist, a tangible energy derived
        from the user''s vigor, courage, and mind. It can be used in several ways,
        such as to surpass the limits of one''s body to dramatically increase strength.
        It can also be fired as blasts of energy or create defensive barriers. Possessing
        such ridiculous strength at birth that few could match him, Frieza is a mighty
        mutant hybrid of his race whose power is so great that to properly control
        it, he had to create lesser, weaker forms to restrain his strength. He is
        incredibly skilled in using ki, though his ignorance of its spiritual side
        meant he doesn''t know how to sense ki. **Death Ball: After gathering ki in
        the shape of a sphere with a single fingertip, Frieza creates a giant energy
        sphere that can easily destroy planets. His expertise in the technique allows
        him to restrain it to instead put a planet on a timer towards destruction
        if he so pleases. Its most powerful variant is the Supernova, a massive, sun-like
        sphere of energy that takes some time to charge but has immense power. **Death
        Beam: Frieza''s favored finishing technique, a small, highly concentrated
        beam of ki fired from the fingertip with enough force to easily punch through
        an opponent''s body. Frieza often uses this technique to torture his opponents
        before finishing them off, and uses it with great precision. He can fire many
        of them rapidly, overwhelming his opponents with a barrage of high-power attacks.
        **Death Psycho Bomb: By launching a small, invisible sphere of ki into his
        opponent, Frieza can force them to rise into the air as the sphere expands
        within them, ultimately exploding and destroying them from the inside. **Death
        Saucer: A technique similar to Krillin''s Destructo Disc, though Frieza can
        make two of these discs at once and throw them at opponents. They home in
        on targets, making them difficult to escape. Still, Frieza''s overconfidence
        makes it very possible that he will lose track of them and end up cutting
        himself in half accidentally. It should be noted that it can cut through opponents
        several times stronger and more durable. **Death Wave: Frieza can gather ki
        in his fingertips before releasing it with a sweep of his arm, slicing through
        his surroundings with a thin, razor-sharp blade of energy. **Imprisonment
        Ball: Frieza can trap his opponent within a sphere of ki, preventing them
        from escaping, and while they''re trapped within, he can toy with them, kicking
        them around like a ball before ultimately kicking them into the ground, causing
        a massive explosion. This explosion is so powerful that it creates a vacuum,
        sucking everything nearby to its center. **Nova Strike: After surrounding
        himself in a sphere of ki, Frieza launches himself at his opponent and slams
        into them with devastating force. }} ==Others== Notable Victories: Notable
