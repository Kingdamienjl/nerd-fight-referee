      value: 'Frieza is extremely overconfident and sadistic, preferring to drag out
        an opponent''s suffering over time and humiliate them rather than kill them
        instantly, even when such a thing is fully possible for him. Due to his inexperience
        with the form, at 100% power, Frieza rapidly drains his ki and cannot fight
        in this form for long, and his Golden form has the same weakness before he
        masters the form during his mental training in Hell. Notable Attacks/Techniques:
        * Death Beam: Frieza extends his right arm and fires a small, bullet-like
        beam of ki from his index finger, which barrels down and pierces an opponent.
        * Death Ball: Small ball of Ki used in a technique to destroy a planet. *
        Fissure Slash: Capable of casually slashing thousands of meters of area with
        his finger (at 50% power). * Nova Strike: Frieza shields his body in energy
        and rushes the opponent. * Punishing Blaster: Frieza gathers energy in his
        right hand, raises his hand, thrusts his hand forward and fires a massive
        blast causing massive damage. * Telekinesis: Capable of moving rocks to throw
        at a target at high speed, or paralyzing weaker targets with Ki techniques
        and making them explode. * Tsuibi Kienzan: Uses his Ki to generate up to two
        remotely tracking and homing energy discs; are much more effective when he
        uses his hands to increase their speed and cutting ability.'
