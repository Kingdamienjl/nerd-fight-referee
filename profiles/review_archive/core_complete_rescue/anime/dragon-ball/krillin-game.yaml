        * Ki Blast: The most basic form of energy wave. * Kamehameha: Krillin learns
        the move by just watching Goku and Yamcha use it, and he uses this move for
        the first time in the 22nd World Martial Arts Tournament against Chiaotzu.
        * Double Tsuihikidan: A move where Krillin fires two energy waves that target
        his enemy. * Scattering Bullet: Krillin fires a Ki blast at his enemy. Right
        before it hits, the attack flies above his target and scatters apart resulting
        in several small but powerful blasts. * Destructo Disc: Also known as Kienzan,
        is an attack invented by Krillin that has very sharp edges that can cut through
        just about anything. ** Chain Destructo Disc Barrage: A rapid-fire version
        of the Destructo Disc used by Krillin against Frieza. * Solar Flare: An attack
        that can blind anyone who is facing the user unless their eyes are closed.
        ** 100x Solar Flare: A new variation of the Solar Flare developed by Krillin
        in Dragon Ball Super. It is basically the Solar Flare, but much stronger,
        as unlike Solar Flare, it blinds the opponent even if their eyes are closed.
        This is noted as a surprise attack, and would not work if it is used over
        and over, as Krillin must rely on the opponent to be in a certain state. It
        also possibly blinds the opponent from sensing ki, evident to how Gohan could
        not find Krillin after he had used it.'
