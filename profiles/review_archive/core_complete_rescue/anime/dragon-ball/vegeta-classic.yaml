  stamina:
    text: Superhuman (Goku can train for days with minimal rest and can fight through
      his long, arduous fights with the likes of Vegeta and Frieza, continuing to
      fight against Vegeta even after overexerting himself with Kaioken x4, and ultimately
      outlasting the latter even after being effortlessly beaten around, pushing himself
      to his limits with Kaioken, and exhausting himself with his Spirit Bomb. When
      he was younger, he managed to pull through and defeat Piccolo even after all
      of his limbs were broken and he was mortally injured. However, his stamina drops
      greatly as a Super Saiyan 3, which he can only maintain for a couple of minutes,
      making it effectively useless against opponents on his level)
