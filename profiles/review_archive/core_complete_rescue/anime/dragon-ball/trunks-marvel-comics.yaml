      value: Magik is highly skilled in the black magic of Limbo granted by the patron
        of Belasco, Chthon, as well as White Magic of Earth granted by the patron
        of Storm's lineage, Oshtur. Illyana is also highly skilled in ancient weaponry,
        typically axes and swords. Even without her Soul Sword, she led an attack
        on hordes of rebelling demons using only an ax without suffering any injuries
        and succeeding in quelling their rebellion.
