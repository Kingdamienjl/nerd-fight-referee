    - field: intelligence
      value: 'Genius (Dooku is a master at manipulation, deceit, politics, and is
        incredibly perceptive. Asajj Ventress is entirely unable to lie to him through
        his sheer perception.Dooku: Jedi Lost; Part One Dooku was the mastermind behind
        the majority of separtist plots throughout the Clone Wars, successfully keeping
        the war going through assassination, treachery, and charisma, outwitting Obi-Wan
        Kenobi and Anakin Skywalker multiple times) *Combat Skill: Count Dooku is
        easily within the top five most skilled Lightsaber duelists of his era, being
        on par with Mace Windu and Grandmaster Yoda,Star Wars: El Lado Oscuro with
        him being confirmed to be evenly matched in skill with the latter during their
        duel during Attack of the Clones. Even while having just woken up, having
        been poisoned, being outside of combat-ready clothing, and with his senses
        being dulled to the point that he couldn''t even see, Dooku was still able
        to duel Asajj Ventress and two Nightsisters who train from both as warriors
        and assassins to a standstill until he got into proper position to remove
        the assassins from his home. An early Asajj Ventress, whom was a successful
        gladiator and assassin, was completely unable to hit Dooku or even make him
        spill his wine. Consistently defeated Anakin Skywalker and Obi-Wan Kenobi
        in duels, overwhelming the former and always opening up the latter''s nigh-indomitable
        defense,Star Wars: The Clone Wars; the Movie occasionally even when they work
        together,Star Wars: The Clone Wars Season 6 Episode 10; The Lost One only
        failing when Anakin got stronger and tapped into the Dark Side of The Force
        for his final duel. Far superior to General Grievous, and taught the good
        general who can successfully teach all seven primary forms of lightsaber combat.Star
        Wars: Card Trader (Set: Base Series 1, Card: Magnaguard - Separatists) Standard
        Tactics: Count Dooku notably has a fighting style most alike to Fencing, identifying
        weaknesses in his opponent''s defense and exploiting them, and thus, he acts
        with fencing in mind, with lightning fast cuts and thrusts, but has no issues
        switching his form of lightsaber combat when needed. Notably, Count Dooku
        is one of the few Force Users who consistently uses force powers in combat,
        using Force Lightning to shock foes he considers lesser to himself or to break
        up a blade clash.'
      source_id: mediawiki-8977
