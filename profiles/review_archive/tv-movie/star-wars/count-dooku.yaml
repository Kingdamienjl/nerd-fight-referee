    - field: weaknesses
      value: 'Like all Sith, Dooku suffers from a measure of overconfidence and bloodlust.
        Notable Attacks/Techniques *Form II (Makashi): The second form of Lightsaber
        combat, Makashi was a style breed for Lightsaber combat it was described as
        elegant and focused, and was based on balance and footwork to outmaneuver
        opponents. Fluidity and economy of motion were relied on, rather than strength,
        with Form II blade work heavily utilizing jabs and light cuts rather than
        hack and slash movements. Although it was designed for Lightsaber combat it
        wasn''t designed for blaster bolt deflects or effectiveness against multiple
        enemies but Dooku has trained to have an effect in both areas. *Force Barrier:
        A defensive Force power that creates a barrier or wall of Force energy around
        the intended target, be itself, friend, or foe. Depending on the strength
        of the individual, the barrier could only withstand a few attacks before collapsing.
        *Force Lightning: An offensive Force technique that uses Force energy to produce
        electricity with one or two hands that stream outwards from the fingertips,
        its speed is usually great enough to catch an opponent off-guard even when
        prepared, and can be used either in bursts or simply torrent out in an a gush
        of agony on its victim. *Telekinesis: Darth Tyranus can use this through the
        Force to put his mind literally over matter, capable of blasting opponents,
        shielding himself, or disarming people, its limits are only those of the creativity
        that Force User has. Darth Tyranus has demonstrated considerable prowess with
