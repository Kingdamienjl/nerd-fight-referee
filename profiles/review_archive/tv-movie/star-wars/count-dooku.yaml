      value: "His internal organs can be exposed, leaving him more vulnerable. For\
        \ more competent opponents, he relies on fear, surprise, and intimidation.\
        \ If he lacks even one of those elements, he would likely have to retreat.\
        \ Feats: * Defeated multiple Jedi Masters. * Killed a room of Clone Troopers.\
        \ * Defeated Durge and Ventress. * Killed multiple Jedi throughout the Clone\
        \ Wars. {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"\
        1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"\
        2\" style=\"text-align: left; \" |Notable Attacks/Techniques: |- | *Cyborg\
        \ Body: Grievous' body is now made up of special and strong metal. With only\
        \ a few of his internal organs left. His cybernetics enhances his strength,\
        \ speed, agilty, intelligence, and much more. This new body gives him the\
        \ ability to be equal to or surpass most Jedi during the Clone Wars. His brain\
        \ was implanted with a computer to be able to analyze fighting styles of his\
        \ opponents. Even being able to copy Vapaad from Mace Windu. His body can\
        \ perform superhuman agility like twisting his body, cling onto ceiling and\
        \ surfaces, and much more. *Lightsaber Combat: Trained by Lightsaber combat\
        \ by Count Dooku, in mere weeks, Grievous surpassed all of Dooku's students.\
        \ Trained and has knowledge of all 7 Lightsaber forms. **Form I: Known as\
        \ Shii-Cho, this was the simplest form of lightsaber combat technique studied\
        \ by the Jedi Knights of the Old Republic, and was generally considered the\
        \ first form used by the original creators of lightsabers. Sometimes called\
        \ the ideal form, Form I used horizontal side swipes and parries made with\
        \ the blade of the lightsaber held upright to push the point of an enemy\u2019\
        s blade away during a side-to-side attack. If the attack was a downward slash\
        \ aimed at the head, Form I simply reversed the motion, with a horizontally\
        \ held lightsaber being moved up and down to deflect a blow. All the basic\
        \ ideals of attack, parry, target zones, and practice drills were created\
        \ with the Form I style. **Form II: Known as Makashi, this ancient Jedi Knight\
        \ lightsaber combat technique was developed when pikes and staves were more\
        \ common in the galaxy. Form II emphasized fluid motion and anticipation of\
        \ a weapon being swung at its target, allowing the Jedi to attack and defend\
        \ with minimal effort. Although many Jedi historians considered Form II to\
        \ be the ultimate refinement in lightsaber-to-lightsaber combat, it was dropped\
        \ in favor of Form III combat when blaster weapons became prevalent in the\
        \ galaxy. **Form III: Known as Soresu, this was a lightsaber dueling technique\
        \ developed by the Jedi Knights after blaster weapons became the normal weapon\
        \ of choice among criminals and underworld beings. Unlike Form II combat,\
        \ which was developed to work against another lightsaber, Form III was most\
        \ effective in anticipating and deflecting blasterfire. It stressed quick\
        \ reflexes and fast positional transition to block shots before the enemy\
        \ could get a clean lightsaber blow or fire. It was essentially a defensive\
        \ technique, helped by the more aggressive philosophy of the Jedi while reducing\
        \ the exposed areas of their bodies. Because of this, many modern Jedi\u2014\
        especially those who practiced Form III\u2014considered it the form that required\
        \ the least discipline to use in open combat. It was the death of Qui-Gon\
        \ Jinn at the hands of Darth Maul, many believed, that brought the Form IV\
        \ style of open, acrobatic fighting and took up Form III to minimize the risk\
        \ of injury or death at the hands of an opportunistic opponent. **Form IV:\
        \ Known as Ataru, this was developed by the Jedi Knights during the last decades\
        \ of the Old Republic. It emphasized acrobatic strength and power in wielding\
        \ the blade\u2014attributes that were frowned upon by many traditional Jedi\
        \ Knights and Masters. It had a tremendous appeal to the eager Padawan learners\
        \ of the time, who believed that the Jedi needed to become more involved in\
        \ rooting out and eradicating crime and evil. This form was practiced by Qui-Gon\
        \ Jinn, although his death at the hands of Darth Maul, and the weaknesses\
        \ of Form IV in defending against a Jedi\u2019s body. Yoda, however, practiced\
        \ Form IV with such speed that, when coupled with his small size, it let him\
        \ confound enemies of his body for many an exploit. **Form V: Known as Shien\
        \ or Djem So, this was one of the precursors to many forms of lightsaber combat\
        \ created by the Jedi Knights of the Old Republic. Form V was developed by\
        \ a group of Jedi who came to feel that Form III was too passive, while Form\
        \ IV was not powerful enough. It addressed both forms\u2019 shortcomings.\
        \ Even a Jedi Master who proved undefeatable might not be able to overcome\
        \ the enemy. However, many felt that Form V lacked any sort of mobility, and\
        \ forced Jedi to defend themselves without shifting positions. Among the many\
        \ unique aspects of Form V was the development of techniques in which the\
        \ lightsaber wielder attempted to deflect a blaster bolt back at the firer,\
        \ deliberately to cause harm to the opponent. Many Je"
