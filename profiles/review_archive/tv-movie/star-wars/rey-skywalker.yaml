    - field: weaknesses
      value: 'Not fully trained in the use of the Force or the Lightsaber, as she
        is just getting used to using them Notable Attacks/Techniques: *Telekinesis:
        Rey utilizes Telekinesis either as offensive or defense. Her power is shown
        to be stronger than Kylo Ren''s, as she could pry Luke''s Lightsaber out of
        his own telekinetic grip when he tried to summon it to his hand, causing it
        to fly past him and into hers instead. *Mind Trick: Rey utilizes Mind Tricks,
        to control the minds of other sentient beings, however, it does not work on
        individuals with a strong will. It took her three tries to master it. *Mind
        probe: Rey utilizes mind probe to sift through the thoughts of a sentient
        being. She was able to resist Kylo Ren''s attempt to probe her mind for the
        map to Luke Skywalker''s location and even turned his attack back on him to
        discover his own fears of inadequacy in the shadow of Darth Vader. *Force
        vision: Rey utilizes Force vision, to have visions of the past, the present,
        and the future; however, like all force users, her visions are not always
        clear or sometimes has visions even when she is not utilizing this power at
        will. *Force sense: Rey utilizes Force sense, to sense another sentient being''s
