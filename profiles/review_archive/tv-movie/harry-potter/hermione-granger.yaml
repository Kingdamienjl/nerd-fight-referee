        her targets into harmless animals. ** Switching Spell: Hermione swaps the
        physical traits of two objects of her choice, such as placing a human''s ears
        on a cactus while replacing said ears with cactus barbs. ** Vanishment: Hermione
        is able to make various objects vanish with only moderate effort, which she
