    - field: weaknesses
      value: 'Hermione can be overly reliant on logic and reasoning, which can impair
        her ability to make rapid, intuitive decisions. Her social intelligence isn''t
        very high, and she can also be rather close-minded, with a tendency to dismiss
        anything that requires thinking even slightly outside the box. Has a tendency
        to panic in actual combat. Several spells, such as Transfiguration and Apparition,
        can be difficult to use while under pressure due to the intense amounts of
        concentration involved. Vanishing Spell becomes more difficult with the complexity
        of the animal to be vanished, so it only works well on small animals and objects.
        Notable Attacks/Techniques: * Apparition: Visualizing a place in her mind
        that she knows well, Hermione "apparates" to her target location virtually
        instantly. * Bombarda: Also known as the Blasting Curse, Hermione''s curse
        causes the victim or targeted area to explode violently, being powerful enough
        to blast through thick doors. Hermione can further amplify the power of this
        spell with the incantation, "Bombarda Maxima". * Expecto Patronum: More commonly
        known as the Patronus Charm, Hermione summons an ethereal otter made of positive
        energy and good memories to ward off evil creatures like Dementors, proving
        exceptionally effective against them. * Impedimenta: Also known as the Impediment
        Curse, Hermione''s curse causes the afflicted victim to suddenly slow to a
        crawl, effectively immobilizing them. She can also cause them to levitate
        or send them flying backwards if she so wishes, but the spells effects only
        last about ten seconds. * Locomotor Mortis: Also known as the Leg-Locker Curse,
        Hermione casts a charm that causes the victim''s legs to adhere to each other,
        preventing proper movement. * Locomotor Wibbly: Also known as the Jelly-Legs
        Jinx, Hermiones casts a charm that prevents the target from feeling their
        legs upon impact, causing them to give way and the victim to collapse onto
        the ground. * Obliviate: Also known as the Memory Charm, Hermione wipes her
        target''s memory to any degree she wishes, preventing them from recalling
        specific information about any subject she desires even when the victim is
        subject to excruciating torture, such as the Cruciatus Curse. * Protego: Also
        known as the Shield Charm, Hermione generates a temporary barrier that wards
        off oncoming magical and physical attacks. By using its Maxima variant along
        with the spells Fianto Duri and Repello Inimicum, Hermione can generate an
        even more powerful version that disintegrates those that touch it with hostile
        intentions. However, the spell has its limits, and will shatter completely
        if struck with a sufficiently powerful attack. * Stinging Jinx: Hermione flings
        a charm that stings the target it hits, causing swelling, needle-like pain,
        and welts to form around the area of impact. * Stupefy: Also known as the
        Stunning Spell, Hermione fires off a charm that instantly incapacitates the
        target or halts the motion of a moving object. Repeated uses against the same
        target can cause serious harm or death. * Transfiguration: Hermione is exceptionally
        skilled in this branch of magic, which pertains to the the transfiguration,
        creation, vanishing, and switching of the targets'' traits. Applications include:
