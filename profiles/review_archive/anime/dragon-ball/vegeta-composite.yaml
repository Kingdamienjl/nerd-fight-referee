    - field: weaknesses
      value: 'None noteable Notable Attacks/Techniques: * Ki: The fighting power and
        life force of a martial artist, a tangible energy derived from the user''s
        vigor, courage, and mind. It can be used in a number of ways, such as to surpass
        the limits of one''s body to greatly increase in strength, and it can be fired
        as blasts and beams of energy from different parts of the body or used to
        create defensive barriers, explosions and shockwaves. Along with his Saiyan
        blood, Ki acts as the source of Goku''s incredible power and abilities. Goku''s
        prodigal skill in combat and the use of ki allows him to replicate the ki
        techniques of others after seeing them only once. After becoming a Super Saiyan
        God, Goku gained divine ki, which can only be sensed by other gods. * Kamehameha:
        Goku''s famous signature technique, which he learned after witnessing Master
        Roshi use it to extinguish the flames on Fire Mountain, successfully replicating
        it not long later on his first try. As his signature technique, it is something
        that Goku has used on many occasions, and he has created a number of variations
        over the course of his fighting experience, such as firing it from his feet,
        using it to propel himself into the air, and bending it mid-flight to catch
        opponents by surprise. Perhaps the most useful variation is the Instant Kamehameha,
        in which Goku uses Instant Transmission to teleport just before firing the
        attack, appearing right in front of his opponents and giving them no time
        to dodge. * Kaio-ken: A technique developed by King Kai and taught to Goku
        during his time training on his planet. It greatly increases Goku''s ki for
        just a moment, boosting his strength and speed significantly for that time.
        However, this heavily strains his body, and if he overuses it, it will leave
        him in intense pain all over his body, leaving him incapable of moving without
        causing himself further pain. Initially, the strongest Kaio-ken Goku can utilize
        is x4, but by the time of the Frieza Saga, he has mastered its use, allowing
        him to push it to his maximum of x20. * Spirit Bomb: Goku''s ultimate attack,
        taught to him by King Kai, performed by gathering a vast amount of energy
        from all the lifeforms in his surroundings to create a massive, incredibly
        destructive sphere of ki. To use it, one must have a pure heart, and so Goku
        is a perfect user of the technique due to his obliviously innocent nature.
        While it is incredibly powerful and can prove capable of completely destroying
        an opponent when used with sufficient power, it takes a very long time to
        charge and is therefore very difficult to use, though the charge time can
        be sped up by gathering energy from those who willingly and knowingly provide
        it. It is noted that if Goku makes even the smallest mistake using it, he
        could easily destroy Earth. * Destructo Disc: Krillin''s signature technique,
        which Goku presumably copied from him. Raising his hand above his head, Goku
        creates a razor-sharp disc of ki with incredible cutting power, and then throws
        it at his opponent. It should be noted that the Kienzan can cut through opponents
        that are several times stronger and more durable. * Kiai: The ability to project
        an invisible burst of force with ki, which Goku can perform with his hands
        and even with a glare. * Solar Flare: One of Tien Shinhan''s signature techniques,
        which Goku copied from him during their match in the World Tournament. Bringing
        his hands up to his face, Goku can create a bright flash of light that can
        blind opponents. * God Bind: A technique that can be used by Goku in his Super
        Saiyan God form. He transfers his own godly ki to the opponent''s body, blocking
        them in place. * Gravity Bash: Goku creates a compressed sphere of ki and
        hits the opponent while holding it in his palm. * Fusion Dance: A special
        dance created on planet Metamor, learnt by Goku from the inhabitants of said
        planet. This technique allows to beings to fuse and become a much more powerful
        entity. To ensure an optimal result, the two must perform all poses correctly,
        otherwise the fused being will be weak and goofy. The more similar are the
        height and personality of the two, the better the new being will be, but it
        will always last only for 30 minutes, with this time limit becoming shorter
        if the strength of the fusion increases too much. Goku used it in order to
        face Broly, performing the Dance together with Vegeta and giving birth to
        Gogeta. * Instant Transmission: A teleportation technique that Goku learned
        between the Frieza and Cell Sagas on the planet Yardrat, which allows him
        to lock onto the ki signatures of others and teleport to their locations.
        Its use takes some concentration, which is aided by Goku putting his index
        and middle fingers to his foreheads (He has also shown to teleport without
        placing his fingers), and he needs a ki signature to teleport to, otherwise,
        he cannot perform the technique. It can be used to teleport others as well,
        as long as they are in physical contact with Goku. * Mafuba: Also known as
        th'
