        S.H.I.E.L.D. basesAvengers: The Initiative Featuring Reptil Vol 1 1 and terrorizing
        cities if given enough time) Animal Manipulation and limited Mind Manipulation
        (Stegron can control dinosaursMarvel Team-Up Vol 1 19 through a combination
        of psionics and sound. His control also extends to reptilian humanoids, and
        he can affect dragons'' sense of balanceDaredevil Vol 7 8). Limited Resistance
        to Ice Manipulation (Can survive getting encased in ice for extended periods
        of timeSensational Spider-Man Vol 1 13) and Resistance to Mind Manipulation
        (Attempting to control his mind can cause debilitating painSpider-Man and
        the X-Men Vol 1 1). His optional equipment grants him Necromancy (He has made
