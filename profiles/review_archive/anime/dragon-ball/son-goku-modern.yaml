  attack_potency:
    text: At least Multiverse level+, likely Outerverse level (Fu gave the Future
      Warrior enough power to combat Ultra Instinct Goku making him more powerful
      than a battle of Gods arc SSJ3 Goku and Future Warrior who defeated Demigra,
      who was going to destroy all of history/everything and create a brand new history
      with Toki-Toki's power, a bird who controls all of space and time. Scales above
      his father who was going to destroy all dimensions. There are infinite diverging
      timelines in the main history and multiple other sets of history in Xenoverse.
      Fused all of history together and has created his own set of history known as
      Tokipedia, an exact replica of the original set of history. He can also reset
      all of Tokipedia just by putting his sword into the air. Scales to Heroes feats
      and cosmologies and both are just in different timelines, with Trunks having
      travelled to another timeline to help Xeno Goku.) | Outerverse level (Fu is
      stated to be the strongest villain in Dragon Ball History, made from the DNA
      of the strongest fighters in history, including Mechikabura as stated in guides,
      the anime, the manga and the arcade, putting him above previous villains like
      Mechikabura who even in his youth had the power to destroy all of existence,
      and later absorbed all of space and time and the entire DBH arcade and even
      the likes of Hearts who with the power of the Universe Seed could have destroyed
      all of existence. Far above pre UGM Demigra who was relative to his youth self
      who absorbed toki-toki, giving him control over all of space and time and the
      power to create all dimensions. These feats would include the creation and destruction
      of infinite diverging timelines, as well as the Subspace, a dimension where
      the concepts of space and time do not exist, and the world of void, another
      dimension where the concepts of space and time do not exist, and would also
      extend to the Crack of Time, a dimension separate from yet connected to all
      dimensions where said dimensions are represented through crystals. It would
      likely include a modern Japan within the arcade, which is the only thing real
      within the arcade with the rest being fiction. Far above Sealas who was going
      to destroy all of existence including Beat's world, which views the entire DBH
      arcade world as fiction and fake in comparison to themselves, and the inhabitants
      require avatars to enter the DBH world. World Mission is canon to universe mission
      and takes place prior to old Mechikabura, so Fu would far outscale all these
      feats as even Mechikabura is stronger than Sealas as he is "the greatest evil"
      the time patrol had ever faced. UMX is also canon to World Mission where Demigra
      who Fu scales above transcended space and the DBH world to enter Beat's world
      and was planning on destroying it and had the power to destroy all of creation.
      Fu restrained Prison Planet arc Cumber who was combating Vegito Blue.), higher
      as Super Fu (Having Saiyan DNA, Super Fu is likely a 50x multiplier similar
      to a Saiyans Super Saiyan transformation. In this transformation he reversed
      the transformation of and blitzed Golden Great Ape Cumber during the Prison
      Planet arc who was making Kaioken Blue Vegito struggle and later was making
      SSJ4 Vegito struggle.) | Outerverse level (Fu in base easily defeated SSJB Goku
      and Vegeta who are much stronger than their universe mission selves as well
      as stronger than SSJ4 Xeno Goku and Vegeta. Could hold his own against a serious
      and stronger SSJB Vegito from the Prison Planet arc and performed rather well),
      higher as Super Fu (When transformed he easily sliced Vegito Blue's Spirit Sword
      and when angry he was ready to fight a full powered Vegito Blue.) | Outerverse
      level (Fu even while sturggling to control his newly found Dark Factor and still
      learning about it, fought and restrained SSJ4 Limit Broken Vegito as well as
      Vegito Blue, and even blitzed and restrained Vegito Blue. Demigra and his team
      were involved and trying to stop Fu with the Time Labryinth) | Outerverse level
      (After absorbing the Universe Tree and Dogi-Dogi's power, he became absolutely
      stronger than everyone to the point no one except Goku with the Universe Tree
      and Toki-Toki absorbed could fight against him.)
    source_ids:
