    - field: intelligence
      value: Average generally. Extraordinary Genius combatant (Although he lacks
        knowledge when it comes to things that aren't related to fighting, Goku is
        a master with prodigal skill when it comes to martial arts, with years of
        experience fighting against powerful opponents with a plethora of abilities.
        His skill when it comes to combat and the usage of ki allows him to replicate
        other ki-based techniques after seeing them just once, and he was the first
        to realize how much energy the Super Saiyan transformations unnecessarily
        drained. Despite this drawback, he was the first to master the Super Saiyan
        state, making it highly efficient. He is a genius in combat, capable of adapting
        to situations very quickly, devising new applications of his techniques on
        the fly, such as using the Kamehameha with his feet. His intelligence allows
        him to predict the movements of other skilled fighters even when they use
        Time Stop, such as Hit. Overcame his stamina weakness as a Super Saiyan Blue
        with his intellect, by rapidly changing between Super Saiyan God and Blue.
        Mastered the Super Saiyan Blue transformation in the middle of a fight against
        God Zamasu. Copied Hakai, a special technique belonging solely to Gods of
        Destruction, and even though Goku claimed that he messed up the technique,
        he still managed to replicate its effect and nearly erase God Zamasu if not
        for Zamasu using Mai as hostage. In the Tournament of Power, Goku was able
        to achieve Perfected Ultra Instinct which was deemed impossible for mortals
        to achieve, as even the strongest Gods of Destruction find it difficult to
        accomplish. These same gods have been alive for over hundreds of millions
        of years and have yet to achieve Ultra Instinct, despite this Goku managed
        to achieve the form with just his mortal lifetime of training)
      source_id: vsbattles-goku
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Goku seeks strong opponents and therefore will allow his opponents to
        reach their full power for the sake of a good fight. He often drops his guard
        and leaves openings for his opponents whenever he gets distracted, lowering
        his durability. His Spirit Bomb requires a long charge-up period, during which
        time he is vulnerable. He cannot survive in the vacuum of space and needs
        to locate a Ki signature to teleport using Instant Transmission. The Evil
        Containment Wave requires a suitable container to seal the target into and
        drains a large amount of Ki, the latter of which could kill him if he lacks
