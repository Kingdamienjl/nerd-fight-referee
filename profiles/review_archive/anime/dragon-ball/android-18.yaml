        Human") by Dr. Gero, modified on a cellular level to be superhuman and instilling
        her with an infinite supply of energy and immense power. Due to her artificial
        energy, 18 has no ki signature and cannot detect ki normally herself. As opposed
        to the fully mechanical models, 18''s organic components mean that she can
        train and grow stronger over time and she ages much more slowly than a regular
        human. While she does not make use of normal ki, 18 can still utilize her
        own energy for a variety of attacks. *Kienzan: Krillin''s signature technique,
        which 18 surely learned from her husband. Raising her hand above her head,
