    - field: weaknesses
      value: "Majin Buu's energy can be worn out if he fights another Buu or a copy\
        \ of himself. In addition, if he is battling against stronger opponents, he\
        \ may also get psychologically weakened over time. Innocent and Kid Buu are\
        \ both fairly unintelligent and prone to fooling around in fights, taunting\
        \ and mocking opponents rather than going all out and destroying them immediately.\
        \ Buu has a short temper and is easily angered. Buu is influenced by the personalities\
        \ of those he absorbs; as he absorbs more heroic individuals, he will become\
        \ less villainous and more good-natured. ==Gallery== Kid_Buuuuu.gif|The Pure\
        \ Majin Buu Ultra_Buuuu.gif|Super Buu transitioning through absorption with\
        \ the Southern Supreme Kai Fat_Buuuuu.gif|Innocent Buu Evil Buu absorbs Good\
        \ Buu.gif|Evil Buu absorbs Good Buu Super_Buuuuu.gif|Evil Buu after absorbing\
        \ Good Buu transforms into Super Buu Buu_Piccolooooo.jpg|Super Buu with Piccolo\
        \ absorbed Buu_Goteeeeenks.jpg|Super Buu with Gotenks and Piccolo absorbed\
        \ Buu-Gohaaaaaan.gif|Super Buu with Gohan absorbed Buuhaaaaan.gif|Super Buu\
        \ (Gohan absorbed) eating sweets ==Notes== Both the Manga and Anime of Dragon\
        \ Ball are canon, however, Toei Animation has its own continuity of Dragon\
        \ Ball and, therefore, what is in the Anime does not apply to the main canon\
        \ which is the Manga, with the Anime having different scales and tiers than\
        \ the Manga. Contrary to popular belief, Kid Buu is weaker than Buuhan in\
        \ the Anime as well. There are several examples that contradict the quotes\
        \ about Kid Buu being the most powerful: * Goku mentions that even if he and\
        \ Vegeta left Super Buu's body they would still lose to him, proving that\
        \ Goku and Vegeta didn't get stronger after the fusion. This makes the scene\
        \ of Super Saiyan Goku fighting Ultimate Gohan an Outlier. * Super Buu, after\
        \ absorbing Gotenks, is mentioned to be the most powerful Majin Buu in history,\
        \ and he had memories of Kid Buu as shown when he says that without Good Buu\
        \ he would disappear. * Goku (Post-Vegito) believed he could defeat Kid Buu\
        \ alone, while with Super Buu he believed the only way he and Vegeta could\
        \ win was with fusion. * After Porunga revived Gohan, Goten, and Trunks, Goku\
        \ believed that Vegeta's plan was for the three of them to defeat Kid Buu,\
        \ implying that Gotenks and Gohan could defeat Kid Buu. Vegeta just didn't\
        \ accept the idea because he wanted the people of Earth to take responsibility\
        \ for Majin Buu's defeat. Powerscale: Super Buu (Gohan absorbed) > Super Buu\
        \ (Gotenks absorbed) > Kid Buu (South Supreme Kai absorbed) > Super Buu (Piccolo\
        \ absorbed) \u2265 Super Buu > Kid Buu > Innocent Buu > Evil Buu > Good Buu.\
        \ For justifications for Tier 1-A, see this blog about Dragon Ball cosmology.\
        \ ==Credits== *VS Battles Wiki Category:Had3s1235 Category:Tier 1 Category:Tier\
        \ 1-A"
