    text: 'Outerverse level (far stronger than Super Saiyan 2 Majin Vegeta who was
      equal to Goku as a Super Saiyan 2 who is far stronger than his previous self
      in the Otherworld Tournament where his base form is comparable to weighted Pikkon
      who one-shotted Cell who possess an infinite to mathematically immeasurable
      power level and was going to destroy the entire universe), weaker after dividing
      himself with Evil Buu. | Outerverse level (stronger than Innocent Buu after
      his division and inheriting most of Majin Buu''s power). | Outerverse level
      (Piccolo states that Super Buu became stronger than beforeDragon Ball #488,
      he would be comparing Super Buu the whole Majin Buu with Evil and Innocent Buu
      as before Buu''s division, it was his strongest and "whole" self; is comparable
      to Gotenks after his training in the Hyperbolic Time Chamber who is stated to
      be stronger than Vegeta), higher via Vice Shout (The Vice Shout is described
      as "only being usable to those with a high power level" which would imply that
      Super Buu became stronger when using this technique), Outerverse level+ with
      Gotenks absorbed1 layer (stated that he became the strongest Majin of all times,
      Gohan is no match for Buu and beats him easily, the difference between him and
      utter Innocent Buu is infinite, is comparable to Super Saiyan 3 Goku albeit
      stronger than him), higher with Gohan absorbed (stated to be stronger than before,
      can fight toe-to-toe with Vegetto for a moment), higher after fighting Vegetto
      (grew stronger, said that Vegetto hasn''t surpassed him and pushed him to use
      Super Saiyan thus making Buu stronger than Vegetto''s base form), far higherPossibly
      2 layers with Outside Space (just like Vice Shout, his power increased drastically
      when using it, pushed Super Saiyan Vegetto to use his full power to break through
      his barrier and was stated by Vegetto to have "amazing power"). | Outerverse
      level+2 layers (is stated many times to be the strongest iteration of Majin
      Buu and the strongest enemy Goku ever faced which would include Super Janemba
      as Fusion Reborn happens before the climatic fight between Goku and Buu in the
      Kaioshin Realm, this same Janemba is a threat to the entire Universe; is capable
      of destroying the Universe in an instant; stronger than a full power Super Saiyan
      3 Goku who is the strongest in the universe with a power of a different league
      than anything Vegeta can imagine which should include Vegetto and this power
      is supported by Goku not wanting to use the Potara as he is confident that he
      can beat Pure Buu all alone however it turns out that Goku needed the Potaras
      to easily beat Pure Buu and has a power "out of this world" that needed the
      Super Genkidama to be stopped).'
