  tier:
    text: '4-B | High 3-A | High 3-A | High 3-A | High 3-A | High 2-A | 2-B Name:
      Broly, also known as Burori Origin: Dragon Ball Movies Gender: Male Age: 37
      (Was born around the same time as Goku) Classification: Saiyan, Legendary Super
      Saiyan'
