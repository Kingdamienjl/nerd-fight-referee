    - field: weaknesses
      value: 'Broly is extremely arrogant and insane, and he has a soft spot in his
        lower abdomen that is vulnerable to attacks due to an assassination attempt
        on him as an infant. | Bio-Broly is vulnerable to the culture fluid, which
        dissolves his body and contact with water can cause him to solidify if he
        was exposed to the culture fluid. Notable Attacks / Techniques: Ki: The fighting
        power and life force of a martial artist, a tangible energy derived from the
        user''s vigor, courage, and mind. It can be used in a number of ways, such
        as to surpass the limits of one''s body to greatly increase in strength, and
        it can be fired as blasts of energy or used to create defensive barriers.
        Along with his Saiyan blood, Ki acts as the source of Broly''s incredible
        power and abilities. Born with an extremely high power level of 10, 000, Broly
        is an extremely powerful monster of a Saiyan. *Energy Shield: Broly can create
        a shimmering shield of energy around his body to protect himself from attacks,
        doing so in his childhood to survive the Supernova that destroyed Planet Vegeta.
        *Eraser Cannon: Broly''s signature attack, a powerful energy sphere that he
        charges up in a single hand and then swings at his opponent, causing an immense
        explosion on contact with his target. *Omega Blaster: An immensely powerful
        attack that Broly charges up in his hand by firing more and more ki blasts
        into it, before throwing it at his target. Saiyan Physiology: The physiology
        of a Saiyan, an aggressive warrior race of conquerors. Saiyans have the natural
        ability to control ki and to fly. While his lifespan is comparable to that
        of a human, Broly will remain at his peak strength for much longer. One of
        the most powerful abilities of a Saiyan is their ability to grow stronger
        and stronger through combat, allowing Broly to constantly push his own limits
        during a fight and rise to higher and higher peaks in power. This ability
        grants a substantial boost in power when Broly is badly injured, allowing
        him to reach a whole new level of power once he recovers. *Super Saiyan: The
        famous, legendary transformation of a Saiyan that allows them to greatly surpass
        their limits and reach the fabled state that is Super Saiyan. These transformations
        can be reached through extensive training, but are more often unlocked in
        moments of intense emotional turmoil and need, and due to the natural aggressiveness
        of Saiyans, they cause the user to become more aggressive and malicious. His
        own Super Saiyan transformation is originally limited by Paragus'' crown,
        restricting his power, but he eventually powers up enough to break through
        it and access his full power. As the Legendary Super Saiyan, Broly accessed
        his unique, berserk transformation as a child when Frieza destroyed Planet
        Vegeta. This first-class transformation increases his power drastically.'
