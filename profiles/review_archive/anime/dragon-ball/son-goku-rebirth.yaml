    - field: powers_and_abilities
      value: 'As a verse that composited all Dragon Ball materials, powerful and unique
        abilities from both Canon and Toei was carried over to Dragon Ball Games Other
        than that, game verse also introduced a lot of original and extremely powerful
        abilities, especially among the Demon race featured in Dragon Ball Heroes
        & Xenoverse Multiverse. Things such as Mind Manipulation that works on higher-dimensional,
        non-corporeal and abstract beings, the ability to attack souls, potent infinite
        (6-D) multiverse scale Absorption, the ability to erase beings from all of
        history, extremely potent Power Nullification and passive Corruption which
        results in mind control through dispersed dark energy across the multiverse
        are some of the powerful abilities introduced through Demons in Xenoverse
        and Heroes, along with resistance to such abilities from the protagonists
        often times. All of this make Dragon Ball Games verse a powerful verse with
        powerful special abilities. }} ==Explanation Pages== Despite simply being
