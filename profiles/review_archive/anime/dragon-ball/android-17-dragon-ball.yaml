    - field: weaknesses
      value: 'Initially, Android 17 was quite arrogant and most of his choices during
        his initial appearance were motivated by what he simply called "The Game",
        but he has grown past his overconfidence since then. Notable Attacks/Techniques:
        Android Physiology: Once a human, Android 17 was converted into a cybernetic
        android (or "Artificial Human") by Dr. Gero, modified on a cellular level
        to be superhuman and instilling him with an infinite supply of energy and
        immense power. Due to his artificial energy, 17 has no ki signature and cannot
        detect ki normally himself. As opposed to the fully mechanical models, 17''s
        organic components mean that he can train and grow stronger over time and
        he ages much more slowly than a regular human. While he does not make use
        of normal ki, 17 can still utilize his own energy for a variety of attacks.
        *Android Barrier: The Red Ribbon Android version of the regular energy shield,
        an energy-based forcefield used to block attacks. This is 17''s signature
        technique, and by the time of the Tournament of Power, he has grown more skilled
        in its use, allowing him to use it to encircle and trap opponents or wrap
        the barriers around his hands to boost his attacking power. If need be, he
        can even cause the barrier to violently explode. *Kiai: The ability to project
        an invisible burst of force with energy, which 17 can perform with his hands.
        His Kiai has special explosive properties, making it particularly potent.
