    - field: weaknesses
      value: "Initially, Goku can be weakened and put into intense pain if his tail\
        \ is grabbed or removed, though he gets over this after the Red Ribbon Saga.\
        \ At first, he cannot fly without the Kintoun, but he learns how to fly before\
        \ the 23rd World Tournament. He needs a moon in order to transform and as\
        \ an Ozaru, he becomes an animalistic berserker with no control over himself.\
        \ Saiyans require a higher metabolism, when they are without enough food,\
        \ they perform worse in battle and become fatigued. | Goku seeks strong opponents\
        \ and therefore will sometimes allow his opponents to reach their full power\
        \ for the sake of a good fight. Kaioken strains his body, causing him intense\
        \ pain and exhaustion if he overuses it. He can drop his guard and leaves\
        \ openings for his opponents whenever he gets distracted, lowering his durability.\
        \ His Genki-dama requires a long charge-up period, during which time he is\
        \ vulnerable. He cannot survive in the vacuum of space and needs to locate\
        \ a ki signature to teleport using Instant Transmission. Super Saiyan 3 drains\
        \ his ki rapidly and will exhaust him within only a few minutes. Notable Attacks/Techniques:\
        \ Ki: The fighting power and life force of a martial artist, a tangible energy\
        \ derived from the user's vigor, courage, and mind. It can be used in a number\
        \ of ways, such as to surpass the limits of one's body to greatly increase\
        \ in strength, and it can be fired as blasts of energy or used to create defensive\
        \ barriers. Along with his Saiyan blood, Ki acts as the source of Goku's incredible\
        \ power and abilities. Goku's prodigal skill in combat and the use of ki allows\
        \ him to replicate the ki techniques of others after seeing them only once.\
        \ * Kamehameha: Goku's famous signature technique, which he learned after\
        \ witnessing Kame Sen'nin use it to extinguish the flames on Fire Mountain,\
        \ successfully replicating it not long later on his first try. As his signature\
        \ technique, it is something that Goku has used on many occasions, and he\
        \ has created a number of variations over the course of his fighting experience,\
        \ such as firing it from his feet, using it to propel himself into the air,\
        \ and bending it mid-flight to catch opponents by surprise. In his fight against\
        \ Piccolo Daimao, Goku used a Kamehameha to propel himself into the air and\
        \ punch straight through Piccolo Daima\u014D with his one good arm. * Kiai:\
        \ The ability to project an invisible burst of force with ki, which Goku can\
        \ perform with his hands and even with a glare. * Taiy\u014Dken: One of Tenshinhan's\
        \ signature techniques, which Goku copied from him during their match in the\
        \ World Tournament. Bringing his hands up to his face, Goku can create a bright\
        \ flash of light that can blind opponents. Martial Arts: Goku is a master\
        \ martial artist who has learned from many of his universe's greatest teachers,\
        \ from his adoptive grandfather, Gohan, Kame Sen'nin, Karin, and Kami-sama\
        \ * Kyoken: A technique meant to distract and confuse an opponent, in which\
        \ Goku acts like a wild, frenzied dog or monkey before striking his opponent\
        \ while they're caught off guard. * Dragonthrow: Goku's signature grapple,\
        \ in which he grabs his opponent by the arm, tail, or antenna, and then spins\
        \ them around before throwing them away. * Hasshuken: A technique used to\
        \ counter Tenshinhan's Four Witches Technique and copied from King Chappa,\
        \ in which Goku moves his arms so fast that he appears to have eight of them.\
        \ * Jan ken: Goku's initial signature technique, taught to him by his grandfather.\
        \ After yelling \"Jan Ken\", Goku then follows up with either a strong punch\
        \ (rock), a poke to the eyes (scissors), or an open palm strike (paper). Saiyan\
        \ Physiology: The physiology of a Saiyan, an aggressive warrior race of conquerors.\
        \ Saiyans have the natural ability to control ki and to fly, likely the origin\
        \ of Goku's own incredible skill when it comes to the usage and control of\
        \ ki. In addition, while his lifespan is comparable to that of a human, Goku\
        \ will remain at his peak strength for much longer. One of the most powerful\
        \ abilities of a Saiyan is their ability to grow stronger and stronger through\
        \ combat, allowing Goku to constantly push his own limits during a fight and\
        \ rise to higher and higher peaks in power. This ability grants a substantial\
        \ boost in power when Goku is badly injured, allowing him to reach a whole\
        \ new level of power once he recovers. * Ozaru: When exposed to the light\
        \ of the full moon, as long as he still has his tail, Goku will undergo a\
        \ transformation into the Ozaru, a massive, gigantic monkey with far greater\
        \ power. However, this comes at the expense of his skill, turning him into\
        \ a violent, mindless monster who cannot differentiate between friend and\
        \ foe. == Notes == == Gallery == Themes : https://youtu.be/w0vlVQj2iEo?si=vZnrIlMWOjjDTh-V\
