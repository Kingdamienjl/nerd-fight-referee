    can use the four basic techniques), Master Hand-to-Hand Combatant (Was able to
    fight Feitan Portor evenly and deflected all of his sword strikes with her tail),
    Poison Manipulation (Her stinger carries a neurotoxin potent enough to instantly
    incapacitate pro Hunters. Rammot claims that creatures stung by her usually sleep
    for a month), Transformation (By pulling out her stinger, Zazan can transform
    into a monstrous crocodile-like creature), Limited Immortality (Type 2, Chimera
    Ants can survive for a day after being decapitated), Biological Manipulation,
    Mind Manipulation with Queen Shot (Zazan can transform humans into grotesque Chimera
    Ant hybrids with her stinger. The mutated humans are stripped of their will and
    serve Zazan blindly)
  source_ids: *id003
