        Immediately noticed that drink was laced. His sense of smell is considered
        as good as dogs; he can smell Leorio's cologne from several kilometers away),
        Accelerated Development (Gon's talent was described to possess an uncanny,
        bottomless potential. Gon can learn extremely quickly, and that is true especially
        in the field of Nen, with an aptitude like his being very rare), Reactive
        Power Level (Gon's physical capabilities increase amid combat. He can adapt
        to stronger and faster opponents and much more skilled opponents), Weapon
        Mastery (Gon is highly adept with using his fishing rod as a weapon), Adaptation
        (Was unaffected by the low temperature and oxygen levels on top of the world
        tree), Regeneration (Low. Healed a broken arm in ten days. Healed a broken
        radius and ulna, a cracked humerus, three rib fractures and twelve cracks
        in one month instead of the predicted four. Enhancers in general have much
        faster regeneration rates than others), Limited Animal Manipulation (Gon is
        shown to be good with animals), Limited Stealth Mastery (Tailed Hisoka without
        being noticed for a day by unconsciously using Zetsu), Resistance to Poison
        Manipulation (Geretta's poison was stated to paralyze a person for ten days.
        Gon got up just a few minutes after) and Pain Post-Nen Training (Zoldyck Family
        Arc/Heavens Arena Arc/Yorknew City Arc)= All previous abilities plus Limited
        Nen (Enhancer; Has mastered the four basic principles and Gyo to limited extents),
        Afterimage Creation, Self-Perception Manipulation (By releasing his Ten and
        going into Zetsu, Gon can enhance his senses and dodge attacks that are too
        fast for him to react), Martial Arts (Trained in Shingen-ryu Kung Fu by Wing)
        Post-Nen Training (Greed Island Arc/Chimera Ant Arc)= All previous abilities
        on a higher level. Improved Martial Arts (Trained in Shingen-ryu Kung Fu by
        Biscuit Kruger), Improved Nen (Has mastered various advanced techniques and
        can use a limited version of En which allows him to react to opponents he
        cannot respond to with his sight. Gon's aura has been noted to be huge by
        various characters), Transmutation and Weapon Creation with Scissor (By transmuting
        his aura, Gon can create a sword made of Nen), Energy Projection with Paper
        (Gon can expel aura from his hands in the form of a spherical projectile),
        Statistics Amplification with Rock (By charging his fist with Ko, coupled
        with two limitations to create Jajaken, Gon can make his punches much more
        powerful), Vibration Manipulation (He can create shock-waves with the mere
        charge-up of Jajanken and with trees), Empowerment (Depending on Gon's emotional
        state, whether it is extreme determination or almost uncontrollable anger,
        his aura becomes more powerful and changes in nature. For instance, if he
        is furious, his aura becomes more powerful, dark, and sinister and was even
        able to put Morel Mackernasey, his disciples and Knov on edge. Killua Zoldyck
        stated that Gon in his enraged state was superior to a Neferpitou who was
        merely in Ten and this rage was enough for Pitou's intuition to discern he
        had potential to be a threat to Meruem.) All previous abilities on a far higher
        level. Air Manipulation (His mere power-up caused heavy winds to occur), Law
        Manipulation and Transformation (By forming a Vow, Gon sacrificed everything
        he had including his latent potential to force his body to adulthood; the
        Vow was so powerful that the only Exorcist in the Hunter Association could
        not remove it and would have died trying)
