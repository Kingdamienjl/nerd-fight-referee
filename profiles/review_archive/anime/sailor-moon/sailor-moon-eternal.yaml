      value: "Items= File:bxw item6.png|Transformation Brooch File:bxw item19.png|Disguise\
        \ Pen File:Crystal Star Manga.png|Crystal Star File:bxw item30.png|Cosmic\
        \ Heart Compact File:bxw item21.png|Holy Grail File:Crisis Moon Compact 29.jpg|Crisis\
        \ Moon Compact File:Holy Moon Calice 29.jpg|Holy Moon Chalice File:Eternal\
        \ Moon Article manga Eternal Sailor Moon.png|Eternal Moon Article *Transformation\
        \ Brooch\u300C{{Ruby|\u5909\u8EAB|\u3078\u3093\u3057\u3093}}\u30FB\u30D6\u30ED\
        \u30FC\u30C1 Henshin Bur\u014Dchi\uFF63: The very first magical item that\
        \ Usagi Tsukino used to transform into her standard Sailor form as Sailor\
        \ Moon. It's transformation phrase is Moon Prism Power, Make Up! It was given\
        \ to Usagi by Luna in Act 1 of the manga. Luna tricked her into transforming\
        \ into Sailor Moon to prove to Usagi that she had a destiny as a Sailor Guardian.\
        \ Once she obtained it, Usagi began wearing the brooch in the center of the\
        \ bow on the front of her school uniform when she was in civilian form. The\
        \ brooch was broken in Act 14 of the manga but received the Crystal Star.\
        \ *Disguise Pen\u300C{{Ruby|\u5909\u88C5|\u3078\u3093\u305D\u3046}}}\u30DA\
        \u30F3 Hens\u014D Pen\uFF63: A pen that was given to Usagi by Luna, so she\
        \ could disguise herself in order to complete a mission more easily. While\
        \ she looks like the person she wants to be, she also apparently gains the\
        \ knowledge of whoever she changes into. This was used many times during the\
        \ first arc of the manga. The pen can also become an umbrella. *Crystal Star:\
        \ The second magical item that Usagi Tsukino used to transform into the much\
        \ stronger second evolution of her standard, regular Sailor form of Sailor\
        \ Moon. It is used in the transformation Moon Crystal Power, Make Up. In Act\
        \ 14 of the manga, Queen Serenity bestowed the Crystal Star for Usagi in the\
        \ Chamber of Prayer when Usagi arrived on the Moon and restored the Moon Castle\
        \ after the defeat of Queen Metalia. Usagi simply had to place the Silver\
        \ Crystal inside the brooch to use it. It is destroyed in the final battle\
        \ against Death Phantom and is replaced by the Cosmic Heart Compact. *Cosmic\
        \ Heart Compact: The third transformation brooch given to Usagi Tsukino in\
        \ order to transform into a much stronger and more evolved version of her\
        \ standard Sailor form. It was given to her along with the Spiral Heart Moon\
        \ Rod. In order to transform, she shouts Moon Cosmic Power, Make Up. *Holy\
        \ Grail\u300C{{Ruby|\u8056\u676F|\u305B\u3044\u306F\u3044}} Seihai\uFF63:\
        \ A sacred goblet/cup of great, holy power used by Super Sailor Moon in the\
        \ manga. By calling out Crisis, Make Up!, the Grail enables her to temporarily\
        \ become Super Sailor Moon, which is a much stronger and more powerful evolution\
        \ of her third regular Sailor form. It seems to greatly increase the healing\
        \ powers of the Spiral Heart Moon Rod, as it bestows a far more powerful moon/rainbow-based\
        \ attack, which is much more effective on a Daimon-Rainbow Moon Heartache.\
        \ Its origins and summoning were different both in the original anime and\
        \ the manga. *Crisis Moon Compact: A brooch given to Usagi Tsukino by Pegasus\
        \ when she upgraded her Cosmic Heart Compact in Act 39. Along with Chibiusa,\
        \ using her Chibi Moon Compact, Usagi transforms into Super Sailor Moon using\
        \ the phrase Moon Crisis, Make Up. *Holy Moon Chalice: An item under Eternal\
        \ Sailor Moon's possession that appeared in the manga. In the manga the Holy\
        \ Grail was upgraded to the Holy Moon Chalice and it enables her to upgrade\
        \ her power set and become Eternal Sailor Moon during the Dream arc, and it\
        \ allowed Usagi Tsukino to transform into Eternal Sailor Moon. *Eternal Moon\
        \ Article: The brooch Usagi Tsukino uses as Eternal Sailor Moon. It is her\
        \ final brooch which holds her Silver Crystal and gains wings when she transforms\
        \ much like Eternal Sailor Moon herself does. It is seen in the manga. The\
        \ compact is a large pink heart with upwards pointed yellow crescent moon\
        \ on its bottom point. On each side of the heart are three small white wings\
        \ which connect to the heart through a pearl which appear like two wings on\
        \ each side, much like Sailor Moon's hair clips. When transformed, large wings\
        \ appear from behind the brooch much like Eternal Sailor Moon's own wings."
