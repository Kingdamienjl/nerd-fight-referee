        \u8EAB\u3078\u3093\u3057\u3093\u30DA\u30F3\uFF63: The first magical transformation\
        \ items that Ami had used. It allows her to transform into her regular, standard\
        \ Sailor form. She sacrificed her pen, in order to awaken Sailor Moon, who\
        \ was within Metalia at the time. The pen were eventually replaced by the\
        \ much stronger and more powerful Star Power Stick. * Star Power Stick: The\
        \ second magical transformation items Ami used. They were given to her by\
        \ Luna along with new communicators after she destroyed her own transformation\
        \ pen in order to help Sailor Moon defeat Metalia. After the Sailor Mercury\
        \ received power upgrades from Neo-Queen Serenity, she no longer used the\
        \ stick to transform. * Mercury Crystal: The Sailor Crystal that Ami Mizuno\
        \ used to transform into Super Sailor Mercury. She received the item from\
        \ Guardian Mercury, her Sailor Power Guardian. * Mercury Goggle: Also called\
        \ the Virtual Reality Visor or the VR Visor for short, is a transparent blue\
        \ visor that Sailor Mercury wore on occasion. She could make it appear or\
        \ disappear by touching one of her earrings, and used this item to scan and\
        \ make analysis of enemies and phenomena in battle, as well as make calculations.\
        \ This item appears first in Act 11 of the manga. * Communicator: Special\
        \ devices used by the Sailor Guardians to keep in touch with each other. The\
        \ Guardians wear wristwatch-type communication devices which allow them to\
        \ speak with each other. Two sets appeared throughout the series. The first\
        \ set appeared in Act 03, Volume 01, and came directly from the Sailor V game.\
        \ The second set were given to them after Chibiusa's appearance. * Super Computer:\
        \ A miniature supercomputer that Sailor Mercury owned which could be used\
        \ to scan surroundings and analyze data, proving very useful in battle. It\
        \ was given to her by Luna. Sailor Mercury's Supercomputer appears first in\
        \ Act 03, Volume 01. It gives Sailor Mercury the ability to analyze and solve\
        \ very complex and scientific problems with ease, and can find weak points\
        \ in enemies."
