    - field: intelligence
      value: 'Average (She is an idol singer. She is strict and calm, as well as smart
        and observant, but she also has a good sense of humor), possibly Varies with
        Teletia S (She can gain the skills of whoever she changes into) Standard Tactics:
        Minako is pretty pragmatic, she uses the Teletia S to disguise herself and
        gain new superhuman abilities, although she usually transforms into her Sailor
        Guardian form for battle purposes | Sailor Venus uses love-based powers in
        addition to forms of light and metal transformation. Her attacks are based
        around love, with the exception of Venus Beam.'
      source_id: mediawiki-minako-aino-sailor-moon
      provider_id: vsbattles
      authority: high
      confidence: 0.75
