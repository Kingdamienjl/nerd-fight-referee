        Kaleidoscope File:Eternal_Tiare_Ani.jpg|Eternal Tiara File:Moonpowertiare.jpg|Moon
        Power Tiara *Tiara: Sailor Moon''s tiara served as her first weapon. *Moon
        Stick: The Moon Stick was an item used by Sailor Moon in the first season
        of the series. She used this item to perform the Moon Healing Escalation attack.
        The Moon Stick became more powerful after the Silver Crystal was attached
        to it. The previous owner of the Moon Stick was Queen Serenity. *Cutie Moon
        Rod: The Cutie Moon Rod is the weapon used by Sailor Moon to perform Moon
        Princess Halation. *Spiral Heart Moon Rod: The Spiral Heart Moon Rod is the
        third mystical weapon *Moon Kaleido Scope: The Moon Kaleidoscope, or Kaleidomoon
        Scope, was a weapon given to Super Sailor Moon by Pegasus in the fourth season
        of the original anime. In the anime it was a much stronger, upgraded version
        of the Spiral Heart Moon Rod, and in the manga Pegasus transformed two mundane
        kaleidoscopes. She used it to perform the Moon Gorgeous Meditation attack
        with great mystical moon/dream-related abilities granted to her by Pegasus.
        *Eternal Tiara: The Eternal Tiara was the strongest and most powerful moon-based
        weapon Super Sailor Moon received when she evolved into Eternal Sailor Moon
        in the original anime version. It was used to perform Starlight Honeymoon
        Therapy Kiss, and eventually Silver Moon Crystal Power Kiss for the rest of
        the fifth season. *Moon Power Tiara: The Moon Power Tiara is Sailor Moon''s
        second new weapon in the Sailor Stars season and final weapon of the overall
        series. It is the upgraded form of the Eternal Tiare, and it is created when
        Eternal Sailor Moon attaches the Holy Moon Chalice to the Tiara. With the
        Moon Power Tiara, Eternal Sailor Moon can perform Silver Moon Crystal Power
        Kiss. She also performed Silver Moon Crystal Power in episode 199 with it.
        |-|Costume items= RedHairPieces.png|Red Hair Pieces *Red Hair Pieces: The
        Red Hair Pieces, often called Odango Covers or Odango Shields by fans, appear
        in Sailor Moon''s hair when she transforms, decorating her odango. |-|Misc.
        Items= Orgel.jpg|Orgel File:CommunicatorSMC1.png|Communicator File:Gin8.jpg|Silver
        Crystal *Communicator: In the anime, the communication device is a small,
        flat, computer-like object that is used by the senshi in the first season
        in order to communicate with each other. *Orgel: The Orgel is a star-shaped
        locket given to Sailor Moon by Tuxedo Mask in episode 26. The Orgel would
        play an instrumental version of "Moonlight Legend" once it was opened, and
        a small beam of light would shine from it while a crescent moon in the orb
        would rotate slowly. When Endymion was brainwashed by Queen Beryl, Sailor
        Moon used the Orgel to make him remember his real self.'
