    - field: powers_and_abilities
      value: "*Experienced Combatant: Due to being born a hany\u014D in a time of\
        \ great strife between humans and demons, Inuyasha was very experienced in\
        \ unarmed combat. However, unlike the technical skills displayed by Sessh\u014D\
        maru, Inuyasha generally relied more on brute force than any type of martial\
        \ arts. His conventional combat strategy was centered around attacking his\
        \ opponents quickly and beating them into submission, leaving him at a disadvantage\
        \ when faced with more sophisticated combatants. *Adept Swordsman: After obtaining\
        \ Tessaiga as his signature weapon, Inuyasha used it as his main form of combat.\
        \ Since Inuyasha never had used a sword before, and because he often relied\
        \ solely on Tessaiga's demonic powers, skilled swordsmen normally pointed\
        \ out how reckless he was when fighting them, using his lack of experience\
        \ to their benefit. Sessh\u014Dmaru remarked early on that the Tessaiga was\
        \ no different than a wooden club in Inuyasha's hands. However, as he continued\
        \ to face great challenges from skilled opponents, Inuyasha developed his\
        \ swordsmanship with Tessaiga to the point of being able to contend against\
        \ Sessh\u014Dmaru in battle, though he still remained inferior in overall\
        \ skills. *Minor Medicinal Knowledge: Inuyasha had a limited knowledge of\
        \ medicine and minor illnesses; for example, he was taught by his mother how\
        \ to concoct an herbal medicine that could easily cure colds in an instant,\
        \ which he made for Kagome when she was sick."
