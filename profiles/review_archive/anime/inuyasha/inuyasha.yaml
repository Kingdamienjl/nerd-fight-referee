    - field: weaknesses
      value: "Turns into a merely athletic human version of himself on the night of\
        \ the new moon (Though even then he is considerably more durable than most\
        \ normal human beings, being able to take hits from demons like Tokajin, who\
        \ can crater the ground just by falling over). Without his sword, he risks\
        \ becoming a mindless full y\u014Dkai. Without his sheath or the cloth of\
        \ the fire rat, he becomes more vulnerable to harm. Inuyasha's sense of smell\
        \ is so acute that he is vulnerable to sensory overload. Inuyasha is susceptible\
        \ to the effects of spiritual power, seeing as how Kiky\u014D and Kagome were\
        \ able to subdue him with various spells. right|thumb|Inuyasha's y\u014Dkai\
        \ form. * Demonic Blood: When not in possession of Tessaiga with its sealing\
        \ power and when his life is in danger, Inuyasha can unwillingly change into\
        \ a full-fledged demon. While undoubtedly more powerful in this form, his\
        \ demon blood overwhelms him into a whirlwind of rage whose sole purpose is\
        \ destruction. In this form, Inuyasha's physical strength was more than doubled,\
        \ which was more than enough to eviscerate GoshinkiInuYasha anime; Episode\
        \ 43 and GatenmaruInuYasha anime; Episode 52 with a single swipe of his claws,\
        \ and shove Ry\u016Bkotsusei's massive body into a cliffside with one arm.\
        \ His regeneration was also bolstered, allowing him to immediately recover\
        \ from life-threatening injuries and poisons received prior to transforming.\
        \ His y\u014Dki was also powerful enough to erode Sessh\u014Dmaru's Meid\u014D\
        \ Zangetsuha after cutting his own y\u014Dketsu with the Dragon-Scaled Tessaiga.\
        \ However, because y\u014Dki is toxic to humans, Inuyasha's half-human body\
        \ and mind couldn't handle the power he inherited from his father. As a y\u014D\
        kai, Inuyasha was incapable of feeling pain, fear, compassion, or mercy; he\
        \ only feels rage and hedonistic bloodlust, which, coupled with his newfound\
        \ predatory instinct, lack of intelligence, and inability to discriminate\
        \ between friend and foe, drove him to attack and kill anyone in his vicinity.\
        \ With every subsequent overload, this form's intelligence diminished, and\
        \ it became easier to trigger and harder for him to recover from. If left\
        \ unchecked, Inuyasha would continue to fight and kill until his body either\
        \ gave out or was killed by an opponent. right|thumb|Inuyasha's human form.\
        \ * New Moon: All half-demons, like Inuyasha, lose their demonic power for\
        \ a period of time; in his case, he loses his demonic powers and form during\
        \ the night of the new moon. On the night of the new moon his hair turned\
        \ black, his eyes turned brown, he lost his y\u014Dkai abilities and attributes\
        \ (i.e. his fangs, dog ears, and claws), and could only use Tessaiga in its\
        \ katana form. During the night of the new moon before the sun sets, Inuyasha\
        \ suffered from pre-transformation symptoms, such as losing his acute sense\
        \ of smell, before eventually turning into a human.InuYasha anime; Episode\
        \ 13InuYasha anime; Episode 66 Arguably, the ears are the biggest change:\
        \ while the rest of his body demonstrates physical transformation, like claws\
        \ becoming fingernails and toenails, his dog ears simply vanish, to be replaced\
        \ with human ears appearing on the sides of his head. * Sensory Overload:\
        \ Inuyasha's sense of smell is so acute that he is vulnerable to sensory overload\
        \ (e.g. in \"The Cursed Ink of the Hell-Painter\" he was temporarily knocked\
        \ out by the strong smell of black ink). His taste buds are also highly sensitive\
        \ to spicy foods. * Spiritual"
