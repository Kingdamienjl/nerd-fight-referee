  speed:
    text: "Inuyasha can run and move at speeds that easily exceeded that of a conventional\
      \ horse, but he was considerably slower than Entei, the y\u014Dkai horse that\
      \ served as Hakud\u014Dshi's steed. While not capable of true flight, having\
      \ inherited a lesser version of his father's more rudimentary powers, Inuyasha\
      \ could manipulate his own y\u014Dki to an extent when he jumped, allowing him\
      \ to glide over long distances and slow his falls as he lands. *Superhuman Agility\
      \ and Reflexes: Inuyasha has inhuman reflexes and remarkable reaction time.\
      \ He has swiped arrows fired at him out the air with his claws.{{Cite anime|1|2}}\
      \ He has also been able to combine his reflexes with his enhanced senses to\
      \ catch objects thrown at him midair without turning around. Inuyasha's agility,\
      \ balance, and bodily coordination are similarly enhanced. *Superhuman"
    source_ids:
    - fandom-inuyasha-inuyasha
