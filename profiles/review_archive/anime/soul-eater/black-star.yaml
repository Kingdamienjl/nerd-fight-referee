    - field: tier
      value: '8-A | Low 2-C Name: Maka Albarn Origin: Soul Eater Gender: Female, very
        briefly Male while within the Book of Eibon Age: 13-14 Classification: Scythe
        Meister, 2-Star Meister, DWMA Student, Spartoi Member'
