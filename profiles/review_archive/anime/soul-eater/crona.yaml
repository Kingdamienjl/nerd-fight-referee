- id: claim-weaknesses-058a4cba
  section: weaknesses
  axis: weakness
  text: 'Tends to take a lot of hits before going on the offensive, Suffers from low
    self-esteem | The Kishin Asura can overtake their body if their will goes down
    Notable Attacks/Techniques: *Black Blood: A type of artificially made black blood
    cell invented by Medusa. The Black Blood, when infecting a person, fills the infected''s
    soul with madness and imbues them with great power. It can solidify, heal wounds,
    and can be used as weapons. **Bloody Needles: Crona turns their blood drops into
    large needle-like weapons and pierces their opponents with them. It can also be
    materialized directly from their body to defend against physical attacks. **Bloody
    Slicer: Crona cuts their own wrist and fires a boomerang-like projectile from
    the wound. **Bloody Coat: Crona''s blood expands and solidifies, forming a sort
    of shield protecting them from attacks. **Bloody Lance: This time Crona''s blood
    takes the shape of a large sharp cone. The attack was countered so its effects
    weren''t seen but based on its name it can be deducted it''s a long-range piercing
    attack. **Black Dragon: After absorbing a large number of human souls, Ragnarok
    grows wings. Crona can now fly and all their attacks are enhanced. **Mad Blood:
    Crona''s most powerful technique. They summon large quantities of Black Blood
    and engulf their opponent with it. The Black Blood is highly corrosive, dissolving
    normal humans in an instant and has powerful madness inducing abilities, to the
    point that simply touching it is enough to make people lose their minds. The blood
    can also solidify, trapping the souls of those it killed into a giant dome of
    insanity. In this form, Crona can produce enough Black Blood to create a massive
    tsunami capable of destroying an entire city. After becoming part of Asura, Crona
    uses Brew to augment the Mad Blood to the cover the entire moon. *Screech Beta:
    A shockwave in the shape of a screaming mouth shot from Ragnarok''s sword. *Screech
    Alpha: Same as above but far more powerful. At its strongest, it can bisect a
    ship. *Screech Gamma: A close combat technique where Crona''s sword changes its
    shape to resemble the screaming faces of Screech Alpha. Crona then attacks with
    multiple, chaotic swipes that are hard to defend against. *Screech Delta: Like
    Crona''s previous screech attacks, except this attack uses all three of their
    arms and spins around at incredibly rapid speeds. Also, it was able to overwhelm
    Black*Star''s Zetsuei. *Madness Fusion: A relatively simple yet extremely effective
    transformation technique, which uses the significant amount of madness emitted
    by a Clown, a personification of pure madness itself, to provoke this unusual
    form of ''evolution'' in a subject''s power. This involves a Clown physically
    fusing with a subject, giving them incredible power. Note: This profile covers
    the manga version of Crona. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== {{scroll box|content={{reflist|2}}}} {{discussions}} Category:Characters
    Category:Soul Eater Category:Sword Users Category:Antagonists Category:Soul Users
    Category:Blood Users Category:Martial Artists Category:Regeneration Users Category:Absorption
    Users Category:Anti-villains Category:Tragic Characters Category:Protagonists
    Category:Teenagers Category:Demons Category:Vibration Users Category:Sound Users
    Category:Enhanced Senses Users Category:Summoners Category:Fusionism Users Category:Madness
    Users Category:Intangibility Users Category:Shapeshifters Category:Immortals Category:Flight
    Users Category:Multiple Selves Users Category:Corrosion Users Category:Mind Users
    Category:Non-Physical Interaction Users Category:Multiple Selves Users Category:Humans
    Category:Witches Category:Hybrids'
