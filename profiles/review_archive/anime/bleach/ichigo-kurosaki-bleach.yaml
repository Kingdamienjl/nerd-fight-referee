    - field: keys
      value: "After Ichigo learned the truth about the source of his Shinigami powers\
        \ and had his Zanpakut\u014D reforged, his Hollow and Quincy powers came into\
        \ balance with one another; however, should Ichigo's inner Hollow be woken\
        \ by large amounts of Quincy Reiatsu,Bleach manga; Chapter 675, page 14 this\
        \ balance will be disrupted, and Ichigo can meld with his inner Hollow,Bleach\
        \ manga; Chapter 676, page 5-6 resulting in a powerful transformation.Bleach\
        \ manga; Chapter 675, page 15 In this form, the left side of Ichigo's face\
        \ and neck change to resemble the form his inner Hollow took on while fighting\
        \ Ulquiorra Cifer, as well as his former Hollowfication; his left eye inverts\
        \ in color with a black sclera and yellow iris, he has dark marks running\
        \ down his face and along his neck, and he gains a long, forward-pointing\
        \ horn on the left side of his head.Bleach manga; Chapter 675, pages 16-17\
        \ While in this form, the larger blade of Zangetsu turns white.Bleach manga;\
        \ Chapter 675, page 14 :Power Augmentation: As with his Hollow mask, Ichigo's\
        \ merged Hollow form drastically increases his combat capabilities and overall\
        \ power. *Enhanced"
