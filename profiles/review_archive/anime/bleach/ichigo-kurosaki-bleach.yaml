    - field: durability
      value: "While only a teenage Human, Ichigo is a highly resilient young man,\
        \ safely breaking free from a binding spell (albeit a low-level one) and withstanding\
        \ an assault from a large Hollow.Bleach manga; Chapter 1, pages 26-33 Enhanced\
        \ Reflexes: Even without Shunpo, Ichigo is a very fast and agile fighter,\
        \ able to take down three high-level opponents and pick up his Zanpakut\u014D\
        \ before any of them hit the ground. Ichigo possesses great reflexes, dodging\
        \ a strike with no wasted effort and immediately counterattacking.Bleach manga;\
        \ Chapter 86, pages 14-15 He can strike quickly, without warning, and in rapid\
        \ succession.Bleach manga; Chapter 55, page 11 Even against faster opponents,\
        \ he can watch their movements to better analyze and block otherwise fatal\
        \ strikes.Bleach manga; Chapter 117, pages 12-15 Even when struck by surprise\
        \ by Tenjir\u014D Kirinji, who is fast enough to outpace Su\xEC-F\u0113ng,\
        \ Ichigo counterattacked and injured said attacker without anybody else noticing.Bleach\
        \ manga; Chapter 520, page 12 Ichigo managed to dodge a surprise point-blank\
        \ shot to the head and attempt to perform a counter against Robert Accutrone,\
        \ who was fast enough to match and pressure Shunsui Ky\u014Draku, a master\
        \ of Shunpo.Bleach manga; Chapter 585, pages 12-13 Keen Intellect: Despite\
        \ his somewhat punkish attitude, Ichigo is analytical, perceptive, and deductive.\
        \ In his high school, Ichigo's grades are almost always near the top, despite\
        \ his work as a Substitute Shinigami.Bleach manga; Chapter 34, pages 7-8 Aside\
        \ from that, Ichigo can determine the pattern of his opponent's battle methods\
        \ and form a proper counter-strategy to overcome his opponent's attacks.Bleach\
        \ manga; Chapter 96, page 14-17 Bilingual: As a requirement of his profession\
