    - field: striking_strength
      value: "Since he was a child, Ichigo has had an innate ability to clearly see\
        \ spiritual beings and sense their presence. After becoming a Shinigami, his\
        \ senses have continued to improve with time, learning various advanced sensing\
        \ techniques, such as using a spirit ribbon to find Y\u016Bichi Shibata (in\
        \ bird form).Bleach manga; Chapter 8, page 11 Even from a considerable distance,\
        \ he can detect the condition of a being with spiritual power. During his\
        \ intense fight against Kenpachi Zaraki, he clearly sensed and recognized\
        \ Sado's energy signature even as it weakened, despite the considerable distance\
        \ between them.Bleach manga; Chapter 108, pages 22-23 Expert Hand-to-Hand\
        \ Combatant: Physically, Ichigo's Human body is in top form, having been trained\
        \ in martial arts since he was a small child, both professionally and by his\
        \ father. He has repeatedly shown great agility and coordination in his attacks.\
        \ In addition to having powerful strikes, Ichigo is proficient in counterattacks,\
        \ takedowns, throws and body locks. He has repeatedly caught an opponent's\
        \ weapon strikes with a single hand.Bleach manga; Chapter 97, page 16 He effortlessly\
        \ defeats multiple bullies and gangsters on a regular basis, and is a better\
        \ martial artist than Tatsuki Arisawa, the second nationally ranked competitor\
