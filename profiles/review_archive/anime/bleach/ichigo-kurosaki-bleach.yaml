    - field: weaknesses
      value: "*Poor Reiatsu control (Formerly): Originally, Ichigo's spiritual energy\
        \ was difficult for him to control, due to its sheer amount being more than\
        \ his body can consciously contain. Because of this and lack of proper training,\
        \ it not only leaked out constantly, effectively making stealth impossible\
        \ against spiritually-aware beings, but his Reiatsu also fluctuated wildly\
        \ in strength, with Ulquiorra stating that it was unreadable at its weakest\
        \ point, yet stronger than his own at its highest. Bleach manga; Chapter 193,\
        \ page 20 According to Kirio Hikifune, Ichigo has gained control over his\
        \ fluctuating Reiatsu after training in the Soul King Palace.Bleach manga;\
        \ Chapter 555, page 10 *Injury Transfer: Whenever Ichigo suffers a injury\
        \ in his Shinigami form, it is reflected on his Human body when he returns\
        \ to it, with only sufficient healing being able to rectify or prevent this.Bleach\
        \ manga; Chapter 25, pages 1-2 *Defenseless Body: Each time Ichigo leaves\
        \ his Human body to enter his Shinigami form without using Kon to animate\
        \ it, it is left lifeless and defenseless until he can reenter it.Bleach manga;\
        \ Chapter 34, page 15 *Damaging Reiatsu (Formerly): Initially, Ichigo's poor\
        \ control over his vast Reiatsu caused him to risk severe harm to himself\
        \ and those around him if he significantly overexerted himself.Bleach manga;\
        \ Chapter 49, pages 3-19Bleach manga; Chapter 50, pages 8-17 *Close-Quarters\
        \ Disadvantage (Formerly): When wielding his original Zanpakut\u014D, Ichigo\
        \ risked getting his blade stuck in nearby surfaces while fighting in small\
        \ or cramped spaces like building hallways.Bleach manga; Chapter 31, pages\
        \ 15-16 *Mask Time Limit (Formerly): Like all Visored, Ichigo can only keep\
        \ his Hollow mask summoned for a certain amount of time before it automatically\
        \ shatters or is intentionally dispersed, though he has been able to drastically\
        \ increase the time limit through training and combat. Originally, Ichigo\
        \ was only able to wear the mask for four seconds at a time.Bleach manga;\
        \ Chapter 225, page 9 After training with the Visored, the limit increased\
        \ to eleven seconds.Bleach manga; Chapter 231, page 10 His time limit further\
        \ increased during his third battle with Grimmjow; the reason behind him being\
        \ able to keep the mask summoned for most of a grueling battle's duration\
        \ is unknown, but Grimmjow speculated that his improvements came from a subconscious\
        \ need.Bleach manga; Chapter 282, page 7Bleach manga; Chapter 346, page 3\
        \ Once he gained resolve to fight Aizen, Ichigo's final mask was used for\
        \ a substantial period of time,Bleach manga; Chapter 396, pages 6-19 but began\
        \ dispersing again once he lost his composure.Bleach manga; Chapter 397, page\
        \ 1 *Fear (Formerly): Ichigo cannot re-summon his Hollow mask if too much\
        \ fear lies in his heart. After Ichigo's mask changed in his battle with Yammy\
        \ Llargo, he noticed his mask felt different, as if it was heavier, and he\
        \ was unable to re-summon it for a brief period of time.Bleach manga; Chapter\
        \ 379, pages 6 & 16-18 Tensa Zangetsu states the oddities of the new mask\
        \ come from Ichigo's fear of the Hollow form he took to defeat Ulquiorra,\
        \ where his sanity was overwhelmed by its power, and he cannot Hollowfy properly.Bleach\
        \ manga; Chapter 411, page 6 ==Trivia== ===General Trivia=== *According to\
        \ Volume 1 of Bleach:Bleach manga; Chapter 7, page 22 **Ichigo likes slim\
        \ fit shirts and pants. **Ichigo likes chocolate and karashi mentaiko. **Ichigo's\
        \ favorite celebrities are Mike Ness and Al Pacino. **The person Ichigo respects\
        \ the most is William Shakespeare. *According to Shonen Jump's character popularity\
        \ polls, Ichigo was consistently the most popular character in Bleach in the\
        \ first three polls, but ranked 3rd in the fourth popularity poll. He was\
