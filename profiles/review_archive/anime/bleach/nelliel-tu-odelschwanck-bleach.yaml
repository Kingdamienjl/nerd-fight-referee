  tier:
    text: "At least {{High 6-B}}, {{6-A}} with Cero Doble, higher with Gran Rey Cero,\
      \ at least {{6-A}} with Resurrecci\xF3n, {{High 6-A}} with Cero Oscuras, higher\
      \ with Gran Rey Cero | {{High 6-A}}, higher with Resurrecci\xF3n, even higher\
      \ with certain techniques"
    source_ids:
