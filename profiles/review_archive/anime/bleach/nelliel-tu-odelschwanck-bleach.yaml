    text: Gifted (While in her original form, she is shown to be quite intelligent.
      Having a great understanding of combat and its forms, and the methods behind
      an opponent's skill and intentions, she can discern personalities easily. She
      also has a philosophy on life that provides a code of honor, respect, and mercy.
      However, her childlike antics can sometimes block her intelligence. At one point,
