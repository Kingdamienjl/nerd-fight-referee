    - field: powers_and_abilities
      value: "Immense Spiritual Power: As the former Tres Espada, Nelliel has a vast\
        \ amount of Reiryoku, powerful enough for her Fracci\xF3n to sense it from\
        \ a large distance. Renji even stated that her spiritual power was close to\
        \ Ichigo's, which led him to confuse the two for a moment. Her Reiatsu is\
        \ pink. Upon releasing her Resurrecci\xF3n, Nelliel's already-massive Reiryoku\
        \ vastly increases, with the released Reiatsu alone pushing back Nnoitra when\
        \ he tried to stop her. The increase in power allowed Nelliel to easily overpower\
        \ Nnoitra when they were roughly equal before. Master Swordsman: As a former\
        \ Espada, Nelliel has a great deal of experience in fighting, showing hardly\
        \ any effort in her advanced use of swordsmanship. Her body flows elegantly\
        \ when engaging in combat, so finely tuned that she can stop her attacks at\
        \ a moment's notice, and subsequently execute lethal attacks with absolute\
        \ precision. She easily defeated Nnoitra, who is a highly proficient swordsman\
        \ in his own right, several times. Expert Hand-To-Hand Combatant: Even without\
        \ the aid of her Zanpakut\u014D, Nelliel is quite a skilled fighter. During\
        \ her battle against Nnoitra, she was able to skillfully dodge and counter\
        \ his attacks. She also used her swordsmanship in conjunction with her hand-to-hand\
        \ combat skills. thumb|right|190px|Nelliel absorbing Nnoitra's [[Cero.]] {{translation|Cero\
        \ Doble||Sero D\u014Dburu|Spanish for \"Double Zero\", Japanese for \"Heavy\
        \ Duet Hollow Flash\"}}: According to Nnoitra, Nelliel's specialty is to absorb\
        \ incoming Reiatsu-based attack, such as a Cero, by swallowing it, and then\
        \ returning it while combined with a Cero of her own, thus creating a potent\
        \ Cero Doble. In her true form, the force(s) of the Cero Doble is augmented\
        \ greatly, since she rebounds the attack while blending it with her own Cero,\
        \ which is pink in color and drastically increasing its power. Son\xEDdo Master:\
        \ As befitting a former Espada, Nelliel has great skill in Son\xEDdo. She\
        \ was able to repeatedly sneak up on and effortlessly avoid Nnoitra with her\
        \ speed. She easily transported the badly hurt Ichigo to a safer place during\
        \ one of Nnoitra's attacks. Nelliel's speed is great enough that Kisuke Urahara\
        \ entrusted her to save himself, Grimmjow, Yoruichi, and Y\u016Bshir\u014D\
        \ from the Gift Ball Deluxe before it could kill them. Enhanced Strength:\
        \ Nelliel possesses large amounts of physical strength, fitting with her former\
        \ position. With her great strength, Nelliel can fend off attacks from gigantic\
        \ weapons like Nnoitra's, launch her opponent several meters away with a single\
        \ punch, and effortlessly slice through the Hierro of an Espada-level Arrancar\
        \ opponent with one swing of her Zanpakut\u014D. She is also capable of halting\
        \ the full force of Nnoitra's Cero with one hand."
