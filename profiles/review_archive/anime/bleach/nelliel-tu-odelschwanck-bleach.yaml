    field_candidates:
    - field: keys
      value: "thumb|right|190px|Nel's healing \"saliva\". {{translation|Nel Shower|\u30CD\
        \u30EB\u30B7\u30E3\u30EF\u30FC|Neru Shaw\u0101}}: Nel's saliva possess some\
        \ weak form of healing power. She activates it by reaching into her mouth\
        \ and massaging her uvula, causing her to vomit. The vomit has a similar appearance\
        \ to saliva, leading her to believe that it is.Bleach manga; Chapter 254,\
        \ pages 2-5 {{translation|Cero Doble|{{Ruby|\u91CD\u594F\u865A\u9583|\u30BB\
        \u30ED\u30FB\u30C9\u30FC\u30D6\u30EB}}|Sero D\u014Dburu|Spanish for \"Double\
        \ Zero\", Japanese for \"Heavy Ensemble Hollow Flash\"}}: Nel's unique ability\
        \ where she swallows an enemy's Cero and fires it back, with a force exceeding\
        \ that of the original blast. This ability is indicated by the eyes on her\
        \ skull mask glowing. Unlike in her true form, Nel does not mix the swallowed\
        \ Cero with her own; instead, she simply sends it back.Bleach manga; Chapter\
        \ 252, pages 12-14 While her child form severely limits her Arrancar powers,\
        \ she is still able to absorb and redirect a Cero blast from a Privaron Espada-class\
        \ Arrancar in its released form, though the effort seems to tire her immediately.\
        \ {{translation|Ch\u014Dkasoku|\u8D85\u52A0\u901F|Super Acceleration}}: In\
        \ her child form, Nel can accelerate her movements with what appears to be\
        \ a rudimentary form of Son\xEDdo. When she uses this Son\xEDdo form, her\
        \ mask's eyes glow.Bleach manga; Chapter 250, page 4 {{translation|Nel Tamapunch|\u30CD\
        \u30EB\u4E00\u6253\u30D1\u30F3\u30C1|Nel Stroke Punch}}: While being in her\
        \ child form, Nel punches her opponent in their private region, which inflicts\
        \ great damage if they are male.Bleach manga; Chapter 286, page 10 Adult Transformation:\
        \ When experiencing intense emotions, Nel can resume her original form. When\
        \ active, Nel regains all her lost powers including her Zanpakut\u014D. After\
        \ a certain amount of time passes, Nel will automatically revert back into\
        \ her child form.Bleach manga; Chapter 296, page 18"
      source_id: fandom-bleach-nelliel-tu-odelschwanck-bleach
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: weaknesses
      value: "===Child Form=== Limited Cero Doble: In her child form, Nel's Arrancar\
        \ powers are severely limited, and one use of a Cero Doble tires her severely.Bleach\
        \ manga; Chapter 252, page 14 Additionally, unlike her original form, she\
        \ could not mix her own Cero into the enemy's reflected Cero.Bleach manga;\
        \ Chapter 291, pages 17-19 ===Resurrecci\xF3n=== Time Limit: After regressing\
        \ to her child form from a sneak attack by Nnoitra and Szayelaporro Granz\
        \ and prior to having the armband Kisuke made for her, Nel's Resurrecci\xF3\
        n seems to have a time limit before she regresses to her child form.Bleach\
        \ manga; Chapter 296, page 18 ==Fracci\xF3n== thumb|right|190px|Nel and her\
        \ Fracci\xF3n during their super sentai-style intro. {{translation|Dondochakka\
        \ Birstanne|\u30C9\u30F3\u30C9\u30C1\u30E3\u30C3\u30AB\u30FB\u30D3\u30EB\u30B9\
        \u30BF\u30F3|Dondochakka Birusutan}} is a large, spotted, humanoid Arrancar\
        \ with a tiki mask and compound eyes. He appears to speak with a Yakuza-style\
        \ accent (Mafia in the Dubbed episodes)- often ending his sentences with \"\
        dont'cha know\" (\"know what I'm talkin' 'bout?\" in the dubbed episodes)\
        \ - and is fairly tame in comparison to other Hollows. Despite his menacing\
        \ appearance, he is prone to tear-filled outbursts at the slightest provocation,\
        \ usually when he's worried about something. {{translation|Pesche Guatiche|\u30DA\
        \u30C3\u30B7\u30A7\u30FB\u30AC\u30C6\u30A3\u30FC\u30B7\u30A7|Pesshe Gat\u012B\
        she}} is a seemingly harmless, humanoid Arrancar whose mask resembles an insectoid\
        \ head with a large pair of mandibles. He wears an eye patch and a loincloth.\
        \ His Hollow hole is slightly lower than normal, positioned near his stomach\
        \ instead of his chest. He and Dondochakka were once Nel Tu's Fracci\xF3n,\
        \ but had their masks forcibly removed by Nnoitra Gilga and Szayelaporro Granz,\
        \ and were left for dead with Nel. After realizing that their master had reverted\
        \ to a defenseless child, he and Dondochakka pledged to protect her. According\
        \ to Pesche, they hid their true identities from Nel because they feared not\
        \ doing so might cause her memories to come back. Neither of them wanted this,\
        \ because Nelliel strongly disliked fighting, and in her child form, she would\
        \ no longer have to fight. He and Dondochakka spent the following time traveling\
        \ around Hueco Mundo, keeping Nel amused with games like eternal tag, while\
        \ still training (probably without her knowledge) to better protect her. {{translation|Bawabawa|\u30D0\
        \u30EF\u30D0\u30EF|Bawabawa}} is a giant, eel-like Hollow whose mask consists\
        \ of a simple plate on his head with a pair of horns. He is a parasite that\
        \ Dondochakka keeps inside him if not out, giving him a particular Fracci\xF3\
        n-state. He acts as both a pet and transportation for Pesche, Dondochakka,\
