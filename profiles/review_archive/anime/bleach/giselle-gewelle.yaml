- id: claim-standard-equipment-44e50581
  section: equipment
  axis: equipment
  text: '*: Heilig Bogen are the standard spirit weapons wielded by Quincy, made of
    Reishi and Reiatsu. Although originally in the shapes of bows that fire Heilig
    Pfeil, many Quincy switch up their Heilig Bogen to be crossbows, sniper rifles,
    handguns, and even Gatling guns. **: The primary form of attack for Quincies,
    spiritual energy manifested as arrows and fired from the Heilig Bogen. Giselle''s
    have little skulls on their tips. *: A device possessed by select members of the
    Wandenreich military, including all Sternritter which allows one to steal a Shinigami''s
    Bankai or any power that is fundamentally similar to a Shinigami''s Bankai.'
