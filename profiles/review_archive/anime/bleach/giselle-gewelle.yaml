  axis: hax
  text: '*Soul Physiology & Quincy Physiology (Soul: High-Tier/Quincy: Sternritter-Tier)
    *Expert Archer (Giselle, as a member of the Stern Ritter is a highly skilled Archer
    and warrior) *The Zombie: **Enhanced Mind Manipulation, Corruption (Type 1) &
    Necromancy (Anyone who comes into contact with Giselle''s blood turns into a zombie,
    even the deadBleach Chapter 589 and will obey every one of her commandsBleach
    Chapter 580) **Healing (Giselle can reattach limbs by using the bodies of the
    deadBleach Chapter 584) **Immortality (Types 2 & 3) & Regeneration (Low-Mid; Giselle
    can survive from a cut that left her with a missing shoulder and missing organs
