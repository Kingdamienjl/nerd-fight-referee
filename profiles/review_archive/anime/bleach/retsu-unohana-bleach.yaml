      \ the nerfed version of Zaraki at the bare minimum. Unohana believes that Zaraki's\
      \ power in the early Thousand Year Blood War Arc is nothingBleach TYBW Episode\
      \ 9, Unohana casually beats down ZarakiBleach TYBW Episode 9, she believes Zaraki\
      \ is weakBleach TYBW Episode 9, she brings Zaraki to the brink of deathBleach\
      \ TYBW Episode 9, and kill Zaraki countless timesBleach TYBW Episode 1058.4172\
      \ Exatons), Small Planet level, possibly Multi-Solar System level with Bankai\
      \ (Kubo stated that Aizen chose not to fight UnohanaBleach Chapter 171 because\
