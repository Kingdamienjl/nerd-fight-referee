    - field: powers_and_abilities
      value: "Immense Spiritual Power: As one of the oldest captains in the Gotei\
        \ 13 and therefore one of the most experienced, Unohana has a tremendous amount\
        \ of spiritual power. Alongside Genry\u016Bsai Shigekuni Yamamoto, she is\
        \ one of the first captains of the Gotei 13 who were noted to be the strongest\
        \ generation of the organization's history, making her one of its most powerful\
        \ combatants. Unohana has acknowledged that no one but Kenpachi Zaraki's power\
        \ exceeds her own. Unohana's power is reputable enough that even Sousuke Aizen,\
        \ who just before had effortlessly cut down T\u014Dshir\u014D Hitsugaya in\
        \ his Bankai and would go on to effortlessly defeat Sajin Komamura and Ichigo\
        \ Kurosaki, preferred to retreat rather than even attempt to incapacitate\
        \ her. thumb|Unohana subdues Zaraki with Zanjutsu. Master Swordsman: Unohana's\
        \ personal specialty is sword fighting, particularly in the art of '. only\
        \ losing when Zaraki grew powerful enough to kill her. Unohana is also adept\
        \ in sleight-of-hand, able to seamlessly launch her concealed dagger blades\
        \ with deadly accuracy. Shunpo Practitioner: Unohana is proficient enough\
        \ in this skill to be as fast as the average captain. thumb|right|Unohana\
        \ heals herself in the midst of battle. Kid\u014D Master: Unohana has advanced\
        \ knowledge of Kid\u014D and the flow of spiritual energy. Her knowledge and\
        \ mastery of healing Kid\u014D are unrivaled within Soul Society. Unohana\
        \ is well-versed in a variety of Kid\u014D, highly masterful in healing Kid\u014D\
        \ and is able to easily use high-level Had\u014D and Bakud\u014D spells without\
        \ incantation. *: As the captain of the 4th Division, Retsu is highly proficient\
        \ in Kaid\u014D, having taught the technique to the members of her division.\
        \ Master Healer: Unohana learned healing techniques from Tenjir\u014D Kirinji.\
        \ Though she originally learned healing Kid\u014D to prolong her fights, Unohana\
        \ since became the most knowledgeable on health-related matters in all of\
        \ Soul Society, highly proficient in conventional healing techniques and herbal\
        \ healing. Her knowledge of anatomy is great enough that upon examination\
        \ of Aizen's \"dead body\", she concluded it was not Aizen or even real. She\
        \ is also able to heal more than just Shinigami, as shown when she heals Yasutora\
        \ Sado, a Human, as well as Gantenbainne Mosqueda, an Arrancar. Her powers\
        \ of perception were great enough to deduce that Aizen's elaborate illusion\
        \ of a corpse doll wasn't real, and that Aizen was perpetuating a much larger\
        \ scheme. :Shikai Special Ability: Minazuki possesses the ability to heal;\
        \ when wounded individuals are placed within its mouth, they are swallowed\
        \ and stored inside its stomach. The stomach acids of Minazuki are strong\
        \ healing medicines and ointments which gradually soak over the wounded, curing\
        \ their injuries. It can carry at least six people within its stomach. At\
        \ Unohana's command, Minazuki will regurgitate the people out of its mouth\
        \ onto the ground. Minazuki is also able to alter its size, becoming as small\
        \ as a puppy at minimum. in copious enough amounts to form a massive pool\
        \ and completely cover the battlefield. Minazuki's blade then re-coagulates\
        \ into a solid state, albeit with the red liquid still covering and continuously\
        \ seeping off it, and can consequently be used to clash against another Zanpakut\u014D\
        \ without losing its form. If Unohana suffers a lethal blow, the blood-like\
        \ liquid quickly disperses into nothing, leaving no trace. *Bleach: The 3rd\
        \ Phantom is the first video game to feature Retsu Unohana as a playable character.\
        \ However, she is a non-combatant character and uses various healing methods\
        \ while in play but can also use offensive Kid\u014D such as Shakkah\u014D\
        . *She appears in Bleach: Brave Souls, being a healer character in most of\
        \ her forms. She has one form where she is not a healer and fights with her\
        \ zanpakut\u014D, Minazuki, in a manifested form instead. thumb|right|190px|Yachiru\
        \ Unohana from a thousand years ago in Brave Souls. *In her first non-healer\
        \ form, she is a melee strong attack character with the \"Speed\" Attribute\
        \ and the \"Shinigami Killer\" and \"Captain Killer\" abilities, with every\
        \ attack being able to inflict Weaken. She has three Innate Skills built in\
