    - field: weaknesses
      value: "None notable Notable Attacks/Techniques: Shunpo: A Shinigami movement\
        \ technique which allows the user to move faster than the eye can follow.\
        \ As speed is the main factor of the technique, the method is best characterized\
        \ by how fast one can get from point A to point B in the least amount of steps.\
        \ Shikai: The initial release to a Shinigami's Zanpakut\u014D. It is activated\
        \ by a command while declaring the name of the Zanpakut\u014D Spirit. It changes\
        \ the shape of the Zanpakut\u014D and/or granting special abilities. * Minazuki\
        \ : Minazuki can create limbs to land on, and heal anyone it has consumed\
        \ via the numerous ointments it stores in its belly. File:Ep55Minazuki.png|Minazuki\
        \ Bankai Minazuki.gif|Bankai Minazuki Unohana in Bankai can launch slashes\
        \ of blood from afar.gif|Unohana launches slashes of blood Unohana in Bankai\
        \ can also deflect attacks with a flurry of blood.gif|Unohana pushes back\
        \ Kenpachi with a flurry of blood Unohana in Bankai can also deflect attacks\
        \ with a flurry of blood 2.gif|Unohana deflects attacks from Kenpachi with\
        \ a much larger flurry of blood Bankai: The ultimate and final release to\
        \ a Zanpakut\u014D. The difference in power between Shikai and Bankai is generally\
        \ around 5-10 times more powerful. Even though Bankai is the final stage of\
        \ a Zanpakut\u014D, it does not mean the Shinigami's growth ends there. A\
        \ Bankai, especially one recently obtained, can evolve even further as its\
        \ Shinigami gets stronger. * Minazuki: Unohana cuts herself which releases\
