        \ Stamina Only Reduced Strong Attack Cooldown 6%\", and her unlockable skills\
        \ are \"Havoc +20%\", \"Frenzy +2\", \"Devastation +40%\", \"Debilitator +5\
        \ sec\", \"Long Stride\", \"Poise\", \"Marauder\", \"Complete Status Immunity\"\
        , \"Damage inflicted at full STA +20%\", \"Spiritual Pressure Boost +80%\"\
        , and the brand-new \"Rampage +2%\", she is the very first summonable unit\
