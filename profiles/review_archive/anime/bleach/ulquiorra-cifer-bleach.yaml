    text: "At least Continent level+ (With his bare hands, Ulquiorra blocked a Cero\
      \ from GrimmjowBleach Chapter 278, he's barely nicked by post-final Grimmjow\
      \ fight Bankai IchigoBleach Chapter 340, casually blocks the a strike from that\
      \ IchigoBleach Chapter 343, and is able to briefly withstand a Black Getsuga\
      \ enhanced strike from a Hollowfied Bankai IchigoBleach Chapter 344), at least\
      \ Multi-Continent level with Resurrecci\xF3n (No-sells an attack from Hollowfied\
      \ Ichigo's Black Getsuga, upscaling his durabilityBleach Chapter 346, and Unmasked\
      \ implies Ichigo cannot damage UlquiorraBleach Official Character Book 3 Unmasked),\
      \ higher with Segunda Etapa (Comparable to his Attack Potency, as he can withstand\
