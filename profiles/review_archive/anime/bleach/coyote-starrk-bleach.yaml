  attack_potency:
    text: "Multi-Continent level (As an Espada, Starrk would be stronger than the\
      \ Privaron Espada, such as Dordoni,Bleach Chapter 250Bleach Chapter 251Bleach\
      \ Chapter 254Bleach Official Character Book 2 Masked since Nnoitora claims the\
      \ current Espada are stronger than the previous,Bleach Chapter 292 which is\
      \ supported by the databooks which claim the Espada are above all other Arrancar,Bleach\
      \ Official Character Book 2 Masked and the power of the Espada make the Fraccion's\
      \ pale in comparison;Bleach Chapter 209 additionally, the Espada are ranked\
      \ according to their power, making Starrk stronger than Baraggan,Bleach Official\
      \ Character Book 2 MaskedBleach Official Character Book 3 Unmasked and as such,\
      \ Starrk upscales from Baraggan. Burnt ShunsuiBleach Chapter 3654.435 Petatons),\
      \ higher with Gran Rey Cero (Gran Rey Cero is the most powerful enhanced version\
      \ of the Cero,Bleach Official Character Book 2 Masked making it a greater amplification\
      \ than Cero Oscuras which is 10x,Bleach Official Character Book 3 Unmasked it\
      \ was calculated to be this strong but scales higher via powerscaling44.35 Petatons),\
      \ at least Multi-Continent level with Resurrecci\xF3n (Stronger than Resurrecci\xF3\
      n Baraggan. His Resurrecci\xF3n multiplies his power by 10x, as the releases\
      \ of Espada numbered 4 are up are considered stronger than Cero Oscuras and\
      \ considered to be similar in strength to the Gran Rey CeroBleach Chapter 34544.35\
      \ Petatons), higher with Cero Oscuras (All Espada can use this technique in\
      \ their release formsBleach Chapter 346 which amplifies their normal Cero by\
      \ 10x443.5 Petatons), far higher with Gran Rey Cero (It is the ultimate Cero,\
      \ it was calculated to be this strong but scales higher via powerscaling), even\
      \ higher with Wolves (Starrk can utilize his Wolves' power in the form of explosions\
      \ or swords, Love and Rose had their Hollow Masks shattered by the explosions,Bleach\
      \ Chapter 373 he displayed power worthy of being the number 1 ranked Espada\
      \ in order to draw out Shunsui's Bankai,Bleach Official Character Book 3 Unmasked\
      \ which is likely referring to his full power, Cien claims it is among the most\
      \ powerful abilities in Hueco Mundo, excluding Cien's full transformation and\
      \ Aizen,Spirits Are Forever With You 2 meaning it would be stronger than Ulquiorra's\
      \ Lanza del Relampago3.8945 Exatons)"
