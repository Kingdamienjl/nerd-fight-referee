        \ wears long, dark gray gloves that have light gray lines running down the\
        \ arm sections and only cover his middle fingers and thumbs. He now has a\
        \ second Hollow hole on his abdomen, and both holes seem to contain a H\u014D\
        gyoku and have cracks spreading over his torso, with his chest hole being\
        \ filled with blue energy and his abdominal hole being filled with green;\
        \ these Hollow holes each have a bandoleer of segmented Reiatsu that transitions\
        \ from its color to that of the other hole as it stretches out behind Starrk\
        \ and circle around, connecting to his guns as ammo. :*Instead of an eyepatch,\
        \ Starrk now has flame-like blue-black Reiatsu covering his left eye, as well\
        \ as a red flame tattoo around it, and his right eye has red sclera and a\
        \ thin black pupil. His hair, now gray, is hip-length and tied in an unkempt\
        \ ponytail at the back, emanating blue-black Reiatsu from its tip. Starrk's\
        \ pistols now resemble short, one-handed {{W|Henry rifle|Henry rifles}} and\
        \ are largely black, with the light, gray-colored design of a crescent moon\
        \ unleashing rays of light on the barrels and a stylized wolf skull at the\
        \ base of the grip. He also wears knee-length heeled boots of a similar design\
