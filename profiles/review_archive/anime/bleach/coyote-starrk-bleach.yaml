        \ to commemorate the inclusion of the Can't Fear Your Own World light novel.\
        \ Designed by Tite Kubo, this appearance mirrors Ulquiorra's own H\u014Dgyoku-enhanced\
        \ power, transcending Resurrecci\xF3n. thumb|right|190px|Starrk's [[H\u014D\
        gyoku-empowered Resurrecci\xF3n.]] :*In this form, Starrk is completely shirtless\
        \ save for a sleeveless vest and pants that are composed of jagged black Reiatsu,\
