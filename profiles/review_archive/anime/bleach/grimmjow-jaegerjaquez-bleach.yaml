    - field: powers_and_abilities
      value: "Great Spiritual Power: Grimmjow possesses a great deal of spiritual\
        \ energy. Rukia described it as \"worlds apart\" from his Fracci\xF3n and\
        \ wondered if he was even the same species. His Reiatsu is blue. After releasing\
        \ his Resurrecci\xF3n, Grimmjow's Reiryoku increases enough to briefly overpower\
        \ Ichigo's Hollowfication-enhanced Bankai. Expert Swordsman: Although he usually\
        \ prefers hand-to-hand combat, Grimmjow is also able to fight effectively\
        \ with his Zanpakut\u014D. He could hold his own against Ichigo, who at the\
        \ time was using Bankai and his Hollow mask, when he only had one arm. He\
        \ is also able to hold his own against Shinji Hirako, while Shinji is wearing\
        \ his Hollow mask. In his third fight and with both arms, Grimmjow was able\
        \ to fight on par with Ichigo in battle. Grimmjow's skill instantly bisected\
        \ the Sternritter Quilge Opie, cutting through the Quincy's Vollst\xE4ndig-enhanced\
        \ Blut Vene before he could react. Son\xEDdo Master: As the 6th Espada, Grimmjow\
        \ is very proficient in the use of Son\xEDdo. Even in his unreleased state,\
        \ he is able to keep up with Ichigo Kurosaki while in Bankai. Initially, Grimmjow\
        \ could even surprise and overwhelm Ichigo with his speed. {{translation|Cero||Sero|Spanish\
        \ for \"Zero\", Japanese for \"Hollow Flash\"; Viz \"Doom Blast\"}}: Grimmjow\
        \ is capable of firing a red Cero from the palm of his hand or fist, even\
        \ at the same time. He can fire it at point-blank range to increase its lethality,\
        \ to the point that he incinerates the top half of Luppi after regaining his\
        \ arm and rank. His Cero is powerful enough to neutralize the Cero of fellow\
        \ Espada Ulquiorra Cifer during their brief scuffle, though it badly burned\
        \ his right arm from his hand to his elbow. thumb|190px|Grimmjow fires a [[Gran\
        \ Rey Cero.]] *{{translation|Gran Rey Cero||Guran Rei Sero|Spanish for \"\
        Grand King Zero\", Japanese for \"King Hollow Flash\"}}: As an Espada, he\
        \ is able to use this Espada-exclusive Cero variant, which produces a much\
        \ larger and more powerful version of the normal Cero. This Cero is strong\
        \ enough to potentially cause great damage to Las Noches itself. For this\
        \ reason, Aizen banned its use inside the fortress, although Grimmjow clearly\
        \ ignored this during his last battle with Ichigo. In order to fire it, Grimmjow\
        \ first cuts his own hand on his Zanpakut\u014D, mixing his blood with the\
        \ Cero as a catalyst. Grimmjow's Gran Rey Cero is colored blue. {{translation|Hierro||Iero|Spanish\
        \ for \"Iron\", Japanese for \"Steel Skin\";Viz \"Iron Skin\"}}: Grimmjow's\
        \ Hierro is strong enough to effortlessly block the sharp edge of a released\
        \ Shikai blade with his bare hand, later showing the density of his skin by\
        \ being able to grab Ichigo's Bankai blade and receiving no damage. Grimmjow\
        \ was able to survive a pointblank Getsuga Tensh\u014D (though emerging with\
        \ grievous injuries) and immediately afterwards withstands being frozen by\
        \ Rukia's Shikai, noting that simply freezing the top layer of his skin isn't\
        \ enough to kill him. {{translation|Descorrer||Desukor\u0113ru|Spanish for\
        \ \"Drawing Back/Opening\", Japanese for \"Loosed Void\"}}: A technique used\
        \ by Espada-level Arrancar, and sometimes others, to open a Garganta between\
        \ the Human World and Hueco Mundo. Grimmjow demonstrated this ability during\
        \ his own personal invasion of Karakura Town. {{translation|Pesquisa||Pesukisu|Spanish\
        \ for \"Inquiry\", Japanese for \"Investigative Nerves\"}}: Grimmjow demonstrated\
        \ this ability when he and his Fracci\xF3n invaded Karakura Town. He is able\
        \ to detect targets from a considerable distance. Enhanced Strength: Grimmjow\
        \ is able to push back Ichigo with little effort and throw Ichigo a considerable\
        \ distance. His kicks are strong enough to send an opponent flying and destroy\
        \ several buildings in the surrounding area. He is capable of wreaking powerful\
        \ havoc simply by attacking with his hand, having impaled Luppi Antenor, his\
        \ Espada replacement, through the chest with his bare hand relatively easily\
        \ despite Luppi's Hierro. Enhanced Durability: Grimmjow has proven himself\
        \ to be a very durable fighter, as he took a Bankai-enhanced Getsuga Tensh\u014D\
        \ from Ichigo and only sustained a scar on his chest. Later, despite having\
        \ only one arm, he was able to take 2 direct hits from Ichigo in his Hollow-enhanced\
        \ state and emerged with only minor injuries and continued fighting. Highly\
        \ Perceptive Combatant: Despite his demeanor, Grimmjow is an astonishingly\
        \ clever fighter who frequently picks up on subtleties in his opponent's behavior;\
        \ he was able to discern from simple observation, during his first fight with\
        \ Ichigo, that his Bankai-enhanced Getsuga Tensh\u014D was damaging his body,\
        \ and also noted that Ichigo was capable of 2 to 3 more of those attacks at\
        \ best. Upon his second fight with Ichigo, he makes note that Ichigo was straining\
        \ to use his Hollowfication because of how his breathing instantly became\
        \ heavier as soon as his mask came off. However, he notes that it may not\
        \ be so simple as that, denoting that it may have something to do with him\
        \ having taken so much damage, losing too much spir"
