      value: "Grimmjow has proven himself to be a very durable fighter, as he took\
        \ a Bankai-enhanced Getsuga Tensh\u014D from Ichigo and only sustained a scar\
        \ on his chest.Bleach manga; Chapter 211, page 16 Later, despite having only\
        \ one arm, he was able to take 2 direct hits from Ichigo in his Hollow-enhanced\
        \ state and emerged with only minor injuries and continued fighting.Bleach\
        \ manga; Chapter 232, page 18 Highly Perceptive Combatant: Despite his demeanor,\
        \ Grimmjow is an astonishingly clever fighter who frequently picks up on subtleties\
        \ in his opponent's behavior; he was able to discern from simple observation,\
        \ during his first fight with Ichigo, that his Bankai-enhanced Getsuga Tensh\u014D\
        \ was damaging his body, and also noted that Ichigo was capable of 2 to 3\
        \ more of those attacks at best.Bleach manga; Chapter 212, page 13 Upon his\
        \ second fight with Ichigo, he makes note that Ichigo was straining to use\
        \ his Hollowfication because of how his breathing instantly became heavier\
        \ as soon as his mask came off.Bleach manga; Chapter 233, page 3 However,\
        \ he notes that it may not be so simple as that, denoting that it may have\
        \ something to do with him having taken so much damage, losing too much spiritual\
        \ energy, or that it has a limit to the amount of time he can use it.Bleach\
        \ manga; Chapter 235, page 12 Upon his third fight with Ichigo, he notes that\
        \ he extended the amount of time he can stay in his masked state.Bleach manga;\
        \ Chapter 282, page 7 ===Zanpakut\u014D=== {{translation|Pantera|{{Ruby|\u8C79\
        \u738B|\u30D1\u30F3\u30C6\u30E9}}|Pantera|Spanish for \"Panther\", Japanese\
        \ for \"Panther/Leopard King\"}}: His Zanpakut\u014D's tsuba resembles a rigid,\
        \ crooked \"S,\" while the sheath and handle are light blue.Bleach manga;\
        \ Chapter 281, page 6 thumb|right|190px|Grimmjow partially activates his Resurrecci\xF3\
        n. *Partial Transformation: Grimmjow can, at will, change the appearance of\
        \ his hands to that of his released state, used to try to hunt Askin Nakk\
        \ Le Vaar when he entered the Soul King Palace.Bleach manga; Chapter 630,\
        \ pages 4-5 {{clear}} thumb|right|190px|Grimmjow's Resurrecci\xF3n, Pantera,\
        \ damaged during his battle with Ichigo. *Resurrecci\xF3n: His release command\
        \ for his Zanpakut\u014D is {{translation|\"Grind\"|\u8ECB\u308C|kishire}},\
        \ referring to grinding one's teeth. To release his Zanpakut\u014D, he holds\
        \ it up, like the start of a low sweep stroke, with his right hand. The sword\
        \ glows light blue as he puts his left hand up to it. He then rakes his hand\
        \ along the length of the blade with a swift motion, while calling out its\
