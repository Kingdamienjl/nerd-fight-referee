      value: "*Anti-Arrancar Mine: **Explosion Manipulation & Limited Instinctive\
        \ Action (Uryu has access to Anti-Arrancar Mines,Bleach, Chapter 343: \"The\
        \ Greed\" explosives created by Mayuri Kurotsuchi that automatically activate\
        \ after they've sensed an Arrancar's ReiatsuBleach, Chapter 344: \"The Pride\"\
        ) *Styptic: **Healing (Uryu can inject himself with a Styptic to stop blood\
        \ flow to a specific damaged area of the bodyBleach, Chapter 349: \"The Lust\
        \ 3\") *Letz Stile: **Statistics Amplification, Enhanced Absorption (Biological,\
        \ Soul, Energy & Mental), Matter Manipulation, Damage Boost, Transformation,\
        \ Aura (Explosive) & Fire Manipulation (After releasing his Sanrei Glove,\
        \ Uryu activates \"Letz Stile\", a state of power that transform's Uryu's\
        \ physical attire,Bleach, Chapter 125: \"Insanity & Genius\" its main function\
        \ is to push a Quincy's ability to deconstruct, manipulate and absorb Reishi\
        \ to its utmost limit, while in this form Uryu's active manipulation of Reishi\
        \ becomes passive to him, causing everything Reishi around him to deconstruct\
        \ and be absorbed into him. This is then condensed into pure Reishi which\
        \ is constantly ejected from Uryu's shoulder, creating immense heat in the\
        \ process. Because of the increased amount of Reishi Uryu can absorb and manipulate,\
        \ his physical stats are greatly increased, he's also capable of sending arrows\
        \ which are three times above his normal attacking power while in the form\
        \ as well) *Seele Schneider: **Durability Negation, Vibration Manipulation\
        \ & Limited Size Manipulation (Uryu has access to Seele Schneider's, weapons\
        \ which act similarly to chainsaws, vibrating at a staggering 3,000,000 rotations\
        \ per second, because of this level of rotation it causes the bonds between\
        \ Reishi to loosen, making it easier for Uryu to absorb and manipulate that\
        \ Reishi. He's also capable of absorbing Reishi into Seele Schneider, increasing\
        \ the length and attack power of the weapon tremendously) *Still Silver Arrow:\
        \ **Limited Power Nullification (The Still Silver Arrow allows Uryu to momentarily\
        \ nullify the abilities of those who used the Ausw\xE4hlen to create the material\
        \ the arrow is made of,Bleach, Chapter 684: \"The Blade\" which he used on\
        \ Yhwach) }} |-|Soul Society Arc"
      source_id: vsbattles-uryu-ishida-bleach
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: attack_potency
