        the Sky)" enabling them to survive the shaking of the entire Seireitei, albeit
        Ichigo is implied to have contributed somewhat more than UryuBleach, Chapter
        85: "INTRUDERZ (Breakthrough the Roof Mix)"56.26742 Megatons), at most Country
        level with Heilig Pfeil (Able to pierce and destroy Mayuri''s handBleach,
        Chapter 121: "In Sane We Trust"38.94478 Teratons), higher with Letz Stile
        (Letz Stile drastically amplifies Uryu''s stats, and he was able to take Mayuri''s
