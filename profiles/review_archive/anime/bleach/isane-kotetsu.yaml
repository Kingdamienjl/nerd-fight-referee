    - field: powers_and_abilities
      value: "Soul Physiology and Shinigami Physiology (Soul: High-Tier/Shinigami:\
        \ High-Tier), Master Hand-to-Hand Combatant (Unohana is skilled in interweaving\
        \ martial arts into her swordplay), Master Swordswoman (As the first Kenpachi,\
        \ and one of the oldest and most experienced swordswomen in the Gotei 13,\
        \ Unohana is a master of the sword. Unohana has fought for several centuries\
        \ and has mastered several forms of sword fighting. She was so skilled in\
        \ fighting that she had no equal amongst the hundreds of Rukongai criminals.\
        \ Her skill and knowledge of sword styles and combat is so extensive, she\
        \ titled herself \u201CYachiru,\u201D which translates to \u201C8000 styles\u201D\
        \ as a symbol of how many sword styles she mastered. Unohana is capable of\
        \ out fighting the likes of Kenpachi Zaraki and \u201Ckilling\u201D him several\
        \ times in their sword fight), Summoning, Flight, Limited Animal Manipulation,\
        \ Acid Manipulation and Healing (True Flight - Unohana\u2019s Shikai creates\
        \ a large sting ray like creature that she can control and use to fly. The\
        \ stomach acids of this creature can heal the injuries of several people at\
        \ once), Enhanced Healing, Statistics Amplification, Durability Negation,\
        \ Blood Manipulation and Corrosion Inducement (Unohana\u2019s Bankai creates\
        \ a fountain of blood from its Blade. This blood has shown the ability to\
        \ \u201Cmelt\u201D away the skin, muscles and tendons of someone, leaving\
        \ only bones and eyeballs behind), Further Enhanced Healing, Energy Manipulation\
        \ and Energy Projection (After being trained by Tenjiro Kirinji, Unohana became\
        \ a master in Kaido. This technique can heal fatal wounds and restore lost\
        \ Reiryoku at the cost of user\u2019s own reserves. Unohana can even use Kaido\
        \ to heal her own body in the midst of a battle)Empathetic Manipulation, Charisma,\
        \ Multiple Personalities(She was able to hide her true identity for a long\
        \ time while disguising herself as a friendly person, She can change her facial\
        \ expression to scare or intimidate people.), Light Manipulation via (Kido)\
        \ Ink Manipulation via Tenteikura, Illusion Creation via (Bankai)(It is capable\
        \ of putting her opponents in a dream state letting them see their bodies\
        \ melt and only their bones remain) Darkness Manipulation Forcefield Creation,\
        \ Resistance to Soul Manipulation, Magic (via Kido Spells), Personality Alteration\
        \ (via Chappy/Soul Candy), Sleep Manipulation (via Shinten which is a green\
        \ liquid medicine) , Speed Manipulation (via Shadow Step which enhances their\
        \ speed to bypass other people's perception) Extrasensory Perception (She\
        \ has great insight to know what is going on and she was able to realize that\
        \ hanataro was wounded in Huecomundo without being there at that location\
        \ he was assigned to.),Power Nullification (via Spiritual Pressure and when\
        \ two spiritual pressures collides the weaker one gets pushed down and send\
        \ the damage back to the opponent) Existence Erasure (via Soul Crush),Sound\
        \ Manipulation (via Tenteikura which is used to locate the coordinates and\
