    - field: powers_and_abilities
      value: 'Soul Physiology and Shinigami Physiology (Soul: High-Tier/Shinigami:
        High-Tier), Master Swordsmanship and Skilled Hand-to-Hand Combatant (As the
        previous Captain of Squad 3 and a proven child prodigyBleach: Chapter 315.4,
        Gin''s an extremely talented and experienced combatant, with either his swordsmanship
        or hand to hand abilities. With this level of skill being shown against other
        master swordsmen like Ichigo KurosakiBleach: Chapter 400, or when even as
        a child he was capable of outskilling the likes of seated shinigami, people
        who have been training for decades and perfecting their swordsmanship), Genius
        Intelligence, Enhanced Stealth Mastery and Enhanced Camouflage (With Reiatsu
        Concealing Cloak - Gin can completely negate the emission of his Reiatsu,
        causing him to become unsensible to even ShinigamiBleach: Chapter 315.8. He
        can also intertwine Kido into this cloak which causes him to blend into the
        environment and conceals his physical appearanceBleach: Chapter 532), Limited
        Cloth Manipulation and Teleportation (With Sentan Hakuja - Gin can spin a
        long, white piece of cloth in a circular motion, trapping himself and anyone
        else caught in the twirl of cloth. As the cloth tightens, with a white flash,
        it teleports the targets to another locationBleach: Chapter 171), Weapon Control
        (With Shikai and Bankai - Gin''s Zanpaktou''s main functionality is the extension
        and contraction of the its blade, doing so to ridiculous lengthsBleach: Chapter
        77, with his Shikai being capable of extending the blade one hundred times
        its original lengthBleach: Chapter 399. While Bankai extends it 13km), Poison
        Manipulation, Durability Negation and Corrosion Inducement (Cellular - With
        Bankai - Gin''s Bankai contains a hidden effect within it, it''s capable reducing
        the entire blade into dust in an extremely short timeframe and extending at
        extreme lengths and speeds, reforming it in the process. If someone is pierced
        by this sword Gin can leave a fragment of it inside them, which when activated,
        dissolves one''s cells through a corrosive poisonBleach: Chapter 414), Damage
        Boost and Limited Empowerment (Buto Renjin - Gin can increase the strength
        of his Bankai''s attack power by an order of magnitude, and the speed of his
        Bankai by two times with this techniqueBleach Official Character Book 3 UNMASKED),
        Illusion Creation, Sleep Manipulation and Limited Memory Manipulation (With
        HakufukuBleach: Chapter 416 - Through pure eye-contact alone, Gin''s capable
        of placing someone under an illusion, this illusion creates purple flower
        petals which fall down from seemingly nowhereBleach: Chapter 103, these petals
        cause the opponent to become light-headed and tired. After a couple seconds
        of this feeling they succumb to unconsciousness, awaking shortly after with
        muddied memories of what previously happenedBleach: Chapter 129), Resistance
        to High Temperatures (Withstood the heat generated by Ichigo''s Getsuga Tensho),
        Low Temperatures (Withstood the coldness from Toshiro Hitsugaya''s iceBleach:
        Chapter 132)'
