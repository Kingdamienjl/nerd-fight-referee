- id: claim-powers-and-abilities-97180a0e
  section: abilities
  axis: hax
  text: "*Soul Physiology & Shinigami Physiology (Soul: High-Tier/Shinigami: High-Tier)\
    \ *Master Swordsman & Expert Hand-to-Hand Combatant (As a former captain of the\
    \ Gotei 13, Kaname is a highly skilled swordsman and martial artist. Kaname formally\
    \ trained in the Shinigami academy, and learned sword styles such as Zanjutsu,\
    \ and martial arts forms such as Hakuda. Kaname can use Hakuda and Zanjutsu to\
    \ out skill fighters like Sajin Komamura, who are larger and more imposing than\
    \ he isBleach: Chapter 383) *Kido: **Fire Manipulation (Haien is a Kid\u014D spell\
    \ that allows Kaname to shoot a slash of fire from his swordBleach: Chapter 213)\
    \ **Telepathy (Tenteik\u016Bra is a Bakud\u014D which gives Kaname the ability\
    \ to broadcast his or others voice into the minds of many people across a large\
    \ distanceBleach: Chapter 314) **Limited Cloth Manipulation & Teleportation (Sentan\
    \ Hakuja is a Bakud\u014D that creates a a large white rope that wraps around\
    \ Kaname and the people he selects to teleport them to a separate locationBleach:\
    \ Chapter 171) *Reiatsu Concealing Cloak: **Enhanced Stealth Mastery & Enhanced\
    \ Camouflage (With the Reiatsu Concealing CloakBleach: Chapter 532, Kaname can\
    \ completely negate the emission of his Reiatsu, causing him to become unsensible\
    \ to even ShinigamiBleach: Chapter 315.8, he can also intertwine Kido into this\
    \ cloak which causes him to blend into the environment and conceals his physical\
    \ appearance) *Shikai: **Sound Manipulation & Sleep Manipulation (Suzumushi's\
    \ Shikai releases a sound that is so highBleach: Chapter 126 that it peacefully\
    \ renders the target unconscious. The sound the Shikai releases can even free\
    \ the blade from chainsBleach: Chapter 368) **Weapon Creation & Danmaku (Suzumushi:\
    \ Nishiki Benihiko creates a swarm of hundreds of blades to attack the opponentBleach:\
    \ Chapter 139) *Bankai: **Limited Duplication, Limited Weapon Control, Sense Manipulation\
    \ & Extrasensory Perception Negation (Suzumushi Tsuishiki: Enma K\u014Drogi manipulates\
    \ the ring on the hilt of SuzumushiBleach: Chapter 146. The ring duplicates and\
    \ the duplicate rings expand and spread over a large area. This creates a large\
    \ black dome around Kaname and his opponents, which is the catalyst for the ability.\
    \ This dome acts as an arena for the fight onwards. Within the dome, all senses,\
    \ including Reiatsu sensing are removed from everyone within the dome. The only\
    \ sense that remains is touch) All previous abilities enhanced plus: *Hollow Physiology\
    \ (Hollow: High-Tier Arrancar) **Statistics Amplification (Kaname can utilize\
    \ HollowficationBleach: Chapter 384, which amplifies all of his statistics to\
    \ a level beyond a mere Bankai. Kaname can further amplify his physical abilities\
    \ with his Resurrecci\xF3n) ***Regeneration (High-Low; Can regenerate having his\
    \ arm completely crushed and mangledBleach: Chapter 385. Kaname's Hollowfication\
    \ even allowed him to breathe and talk despite having his throat torn openBleach:\
    \ Chapter 387) ***Enhanced Sound Manipulation (Los Nueve Aspectos manipulates\
    \ sound in such a way as to act as a concussive force to damage an opponentBleach:\
    \ Chapter 386)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
