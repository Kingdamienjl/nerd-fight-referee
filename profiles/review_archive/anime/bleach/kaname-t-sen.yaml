        \ (Suzumushi's Shikai releases a sound that is so highBleach: Chapter 126\
        \ that it peacefully renders the target unconscious. The sound the Shikai\
        \ releases can even free the blade from chainsBleach: Chapter 368), Weapon\
        \ Creation & Danmaku (Suzumushi: Nishiki Benihiko creates a swarm of hundreds\
        \ of blades to attack the opponentBleach: Chapter 139), Limited Duplication,\
        \ Limited Weapon Control, Sense Manipulation & Extrasensory Perception Negation\
        \ (Suzumushi Tsuishiki: Enma K\u014Drogi manipulates the ring on the hilt\
        \ of SuzumushiBleach: Chapter 146. The ring duplicates and the duplicate rings\
