        \ & Teleportation (Sentan Hakuja is a Bakud\u014D that creates a a large white\
        \ rope that wraps around Kaname and the people he selects to teleport them\
        \ to a separate locationBleach: Chapter 171), Enhanced Stealth Mastery & Enhanced\
        \ Camouflage (With the Reiatsu Concealing CloakBleach: Chapter 532, Kaname\
        \ can completely negate the emission of his Reiatsu, causing him to become\
