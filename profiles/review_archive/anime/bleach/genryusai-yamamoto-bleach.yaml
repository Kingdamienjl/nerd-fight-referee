        \ two-fisted punch used by Yamamoto against Wonderweiss. The attack can completely\
        \ destroy an opponent with a single blow. Shunpo Master: Yamamoto is highly\
        \ skilled and experienced in the art of Shunpo, outracing Shunsui Ky\u014D\
        raku and J\u016Bshir\u014D Ukitake during a chase across the Seireitei. He\
        \ overtook both captains, and arrived at their destination first without even\
        \ being noticed by them. thumb|right|190px|Yamamoto sends Wonderweiss flying.\
        \ Immense Strength: In addition to his surprisingly muscular physique for\
