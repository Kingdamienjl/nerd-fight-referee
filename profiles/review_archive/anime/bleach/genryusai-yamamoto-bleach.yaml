      value: "Immeasurable Spiritual Power: As the most experienced Shinigami, Yamamoto\
        \ possesses extremely massive amounts of Reiryoku. He served as Captain-Commander\
        \ of the Gotei 13 since its conception over 1,000 years ago because no Shinigami\
        \ can rival him in all that time. Even Aizen, who also possesses extraordinary\
        \ Reiryoku, openly acknowledges that if they fought directly, Yamamoto would\
        \ definitely overpower him. Against three Sternritter, elite Quincy with above-Captain\
        \ level might, Yamamoto was able to swiftly repel them. Likewise, he previously\
        \ defeated the Quincy Emperor, and even centuries later when diminished in\
        \ power by old age and only a single arm, Yhwach opted to trick Yamamoto to\
        \ exhaust himself before directly facing Yamamoto. *Masterful Reiatsu Control:\
        \ Yamamoto can exert his Reiatsu to induce fear in captain level combatants,\
        \ and can physically paralyze and possibly even choke lieutenant level combatants\
        \ simply by gazing in their direction. Yamamoto's spiritual pressure has the\
        \ same effect as his Zanpakut\u014D, for it is the elemental representative\
        \ of fire. He tends to glow with a fiery aura, which has the potential to\
        \ burn and set his surroundings on fire without the use of his Zanpakut\u014D\
        . It is the formidable pressure of his Reiatsu which makes the Reiatsu itself\
        \ look like flames. When Yamamoto is enraged, his Reiatsu is powerful enough\
        \ to be felt all around the Seireitei with tremendous force. thumb|right|190px|Yamamoto\
        \ uses Hitotsume: Nadegiri on Ayon. Master Swordsman: Yamamoto is a swordsman\
        \ of the highest caliber. Even with a single hand, few could hope to face\
        \ him and come out alive as his powerful skill can take down most with a single\
        \ precise strike. Yamamoto fought two of the strongest captain-level Shinigami\
        \ in history, Shunsui Ky\u014Draku and J\u016Bshir\u014D Ukitake, simultaneously\
        \ and emerged without any sign of injury. *: A precise cut of extreme force\
        \ and speed which can slice through large, multi-story high opponents. The\
        \ opponent is killed with one swift slash so precise, they are not even aware\
        \ of it until after it has taken place. Yamamoto takes his Zanpakut\u014D\
        \ in its sealed cane form and thrusts it at his opponent, punching a large\
        \ hole in their body. This technique was effective against a multiple story-high\
        \ opponent like Ayon. thumb|right|190px|Yamamoto uses S\u014Dkotsu on Wonderweiss.\
        \ Hakuda Master: Yamamoto was a highly skilled and powerful unarmed combatant\
        \ with equally formidable mastery of Hakuda, as he claimed that even without\
        \ his Zanpakut\u014D, he was in no danger from Wonderweiss Margela. He effortlessly\
        \ caught a strike from the deceptively fast Ayon. Yamamoto can deliver powerful\
        \ blows which can smash through Espada-level Hierro, and block the majority\
