        tug on her own uvula to make herself vomit, though this only works on her
        Child form.), Attack Reflection, Light Manipulation, Breath Attack, Damage
        Boost, and Energy Projection (Nel can use Cero Doble to reflect incoming Ceros
        and reflect them. Ceros are consistently noted to be light-based, and despite
        this, she can suck them up and spit them out at her opponent. In her regained
        adult form, this is her signature move, and she can double their attack potency
        by adding her own cero to them. Furthermore, she is shown stopping one with
        her bare hand, meaning she can physically interact with light. This also means
        she can fire her own ceros, which are again, shown to be light based attacks.
        She can also boost her own Cero's attack potency with Cero Oscuras and Gran
        Rey Cero, which the espada can use, though only in her adult form.), Resistance
        to Extrasensory Perception (She can use Sonido to aid her in high-speed movement,
        and this is noted as having a level of resistance to sensingBLEACH Can't Fear
        Your Own World 1.), Master Swordsman (Every single numero is an expert fighterBLEACH;
