    - field: durability
      value: "When battling Ichigo and Renji, Aizen remained entirely unharmed not\
        \ only from the lieutenant's Higa Zekk\u014D, but also a direct and powerful\
        \ slash from the blade of Tensa Zangetsu, which he blocked with a single finger\
        \ without suffering even a small cut in his skin.Bleach manga; Chapter 174,\
        \ pages 11-14 After being freed from Muken with his powers having increased\
        \ during his imprisonment, Aizen used Had\u014D #90. Kurohitsugi on himself,\
        \ point-blank, in a failed attempt to destroy the chair he was bound to, yet\
        \ remained entirely unharmed.Bleach manga; Chapter 622, page 15 Later, when\
        \ a Soul King-empowered Yhwach returned to the Seireitei, Aizen withstood\
        \ a blast of the Quincy King's dark Reiatsu, which annihilated the very chair\
        \ that had remained intact after Kurohitsugi, and emerged without a scratch.Bleach\
        \ manga; Chapter 682, pages 11-12 H\u014Dgyoku Fusion: Although Aizen was\
        \ supposedly rejected by the H\u014Dgyoku's will during the climax of his\
        \ battle vs. Ichigo,Bleach manga; Chapter 421, pages 18-19 thus losing the\
        \ transcendent powers that he had awakened, Aizen nonetheless (despite outwardly\
        \ returning to his original pre-Chrysalis form) remained inseparably fused\
        \ with the wish-granting orb. By Urahara's estimate, Aizen has somehow grown\
        \ even stronger during his time sealed (relative to when he faced Ichigo),\
        \ although if that too was made possible by, or otherwise relates to, the\
        \ H\u014Dgyoku is unclear. thumb|right|190px|Aizen withstands being impaled\
        \ and dismembered by Yhwach. *{{Translation|Immortality|\u4E0D\u6B7B|Fushi}}:\
        \ Aizen's fusion with the H\u014Dgyoku has, to some degree, immortalized him.\
        \ He survived being vertically bisected by Ichigo's ultimate attack, Mugetsu,\
        \ and quickly regenerated. Urahara's stratagem to defeat Aizen entailed secretly\
        \ embedding a sealing Kid\u014D into him when he was at his most vulnerable,\
        \ pre-metamorphosis, since Urahara knew that killing Aizen once fully fused\
        \ with the H\u014Dgyoku would be nigh-impossible.Bleach manga; Chapter 421,\
        \ pages 5-17 The Central 46 has cited Aizen's immortality as the reason for\
        \ why he was not given a death sentence, implying that he is expected to outlive\
        \ his 20,000-year prison sentence.Bleach manga; Chapter 423, pages 1-3 Likewise,\
        \ Mayuri Kurotsuchi has counted Aizen among the Muken prisoners who, for one\
        \ reason or another, cannot be killed by any executioner in Soul Society,\
        \ as their heart never stops beating.Bleach manga; Chapter 623, page 6 Even\
        \ Yhwach, aware of Aizen's fusion with the H\u014Dgyoku, admitted that killing\
        \ the latter would be a time-consuming task. This has manifested as granting\
        \ Aizen incredible endurance and resilience; once the final battle to defeat\
        \ Yhwach was underway, Aizen was unfazed by having his arm torn off and a\
        \ hole blown through his chest,Bleach manga; Chapter 683, page 14 and ultimately\
        \ survived being swallowed by Yhwach's chaotic darkness.Bleach manga; Chapter\
        \ 684, pages 4-5Bleach manga; Chapter 686, page 11 {{clear}} ===Zanpakut\u014D\
        === thumb|right|190px|Ky\u014Dka Suigetsu. {{translation|Ky\u014Dka Suigetsu|\u93E1\
        \u82B1\u6C34\u6708|Mirror Flower, Water Moon}}: Aizen's Zanpakut\u014D appears\
        \ as an ordinary {{W|Katana|katana}} with a metallic-gold {{W|Tsuba|tsuba}}\
        \ that is of hexagonal shape, a {{W|Japanese sword mountings#Tsuka|tsuka}}\
        \ with green wrapping (leaving traditional rhombus gaps) and a golden kashira,\
        \ as well as a green (black in the anime) {{W|Japanese sword mountings#Saya|saya}}.\
        \ Ky\u014Dka Suigetsu does not outwardly change between its sealed and Shikai\
        \ forms. *Shikai: The release command, {{translation|\"Shatter\"|\u7815\u3051\
        \u308D|kudakero}}, is spoken to both activate and deactivate the Shikai.Bleach\
        \ manga; Chapter 171, pages 9-10Bleach manga; Chapter 371, pages 11-13 The\
        \ sword's sealed and Shikai states being identical, plus Aizen's ability to\
        \ release silently,Bleach manga; Chapter 371, pages 7-8 helps the release\
        \ go unnoticed. right|thumb|190px|Aizen uses Ky\u014Dka Suigetsu. :Shikai\
        \ Special Ability: Called {{translation|Kanzen Saimin|\u5B8C\u5168\u50AC\u7720\
        |Complete Hypnosis|viz=Perfect Hypnosis}}, Aizen's Shikai ability is to control\
        \ the five senses, allowing Aizen to make his enemies misperceive everything\
        \ about someone or something: form, shape, mass, feel, smell, etc. The hypnotic\
        \ ritual \u2014 that is, the sole condition to place a target under Kanzen\
        \ Saimin \u2014 is Aizen showing them his Shikai release. If they see it once,\
        \ the target will be under the hypnotic spell ever after, succumbing to it\
        \ with every new release no matter how long ago they were hypnotized;Bleach\
        \ manga; Chapter 171, pages 9-13 e.g., the Visored remain affected even after\
        \ 110 years. The hypnosis itself is flawless, as even if a victim is aware\
        \ of it, they cannot resist its influence.Bleach manga; Chapter 176, page\
        \ 13 In combat, Aizen's illusions tend to leave his enemies entirely at his\
        \ mercy, as they cannot rely on anything they see, hear, touch, or smell being\
        \ real. For this reason, it was believed that no one in Soul Society or anywhere\
        \ else had as much a chance to defeat Aizen as Ichigo, since he was never\
        \ hypnotized.Bleach manga; Chapter 38"
