    - field: weaknesses
      value: "===Zanpakut\u014D=== Sight Requirement: Because Ky\u014Dka Suigetsu's\
        \ Shikai release must be seen for victims to succumb to the hypnosis, it does\
        \ not work on the blindBleach manga; Chapter 171, pages 13-14 or those who\
        \ have not seen its release. Minute Flaws: While Ky\u014Dka Suigetsu's illusions\
        \ are close to perfect, those perceptive enough may, upon thorough examination,\
        \ notice slight differences in a given illusion compared to the real thing,\
        \ even if they cannot discern exactly what is wrong. 4th Division Captain\
