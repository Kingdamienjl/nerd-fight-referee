    - field: weaknesses
      value: "the method is best characterized by how fast one can get from point\
        \ A to point B in the least amount of steps. : The initial release to a Shinigami's\
        \ Zanpakut\u014D. It is activated by a command while declaring the name of\
        \ the Zanpakut\u014D Spirit. It changes the shape of the Zanpakut\u014D and/or\
        \ granting special abilities., : When spun, the sword creates optical illusion.\
        \ Shinji describes the release technique as something like a trump card. Up\
        \ and down, left and right as well as forward and backward are reversed. However,\
        \ it is not just the sense of direction that is changed, direction of incoming\
        \ attacks, and injury locations are also inverted. In addition the effect\
        \ of the Inverted World can be targeted at or neglected from specific opponents,\
        \ making it ideal for use in group fighting. It also severely affects the\
        \ equilibrium of those its power is used on giving them vertigo, Sakanade\
        \ : The ultimate and final release to a Zanpakut\u014D. The difference in\
        \ power between Shikai and Bankai is generally around 5-10 times more powerful.\
        \ Even though Bankai is the final stage of a Zanpakut\u014D, it does not mean\
        \ the Shinigami's growth ends there. A Bankai, can evolve even further as\
        \ its Shinigami gets stronger., Shinji's bankai inverts the sense of friend-and-foe\
        \ across anyone within the vicinity of his bankai. Shinji stands on a large\
        \ flower construct that protects him from the effects. His sword becomes a\
        \ staff with a large circular form on the front end. It's a wide-range bankai,\
        \ dangerous to use around allies, and is best used against multiple enemies\
        \ at once. His bankai is less effective against an enemy one-on-one since\
        \ there is nobody else to swap one's recognition of 'ally' and 'enemy' with.\
        \ But in such a case, Sakashima Yokoshima Happ\u014Dfusagari : The process\
        \ in which a Soul attains the powers of a Hollow in order to pass the limits\
        \ of their being. By gaining the power of a Hollow, one's Reiryoku increases\
        \ dramatically. Only those who have control over their inner Hollow can Hollowfy\
        \ manually. It manifests itself as a unique mask of different shapes and designs.\
        \ Soul Reapers that can accomplish Hollowfication are known as Visoreds.,\
        \ : A powerful blast of concentrated spiritual energy fired in a laser like\
        \ fashion that only Hollows, and blast area of the Cero is dependent on the\
        \ strength, spiritual power, Shinji's Cero Spells casted by Shinigami with\
