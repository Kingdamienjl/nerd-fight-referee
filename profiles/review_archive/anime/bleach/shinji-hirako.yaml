  section: abilities
  axis: hax
  text: "*Soul Physiology & Shinigami Physiology (Soul: High-Tier/Shinigami: High-Tier)\
    \ *Master Swordsmanship & Skilled Hand-to-Hand Combatant (Shinji, as a captain\
    \ of the Gotei 13 is a highly trained and expierenced swordsman and martial artist.\
