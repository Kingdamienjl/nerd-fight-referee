- id: claim-weaknesses-e8b9d6e4
  section: weaknesses
  axis: weakness
  text: "Hollow Mask only lasts 5 minutes but it can be reapplied. Omnidirectional\
    \ attacks can be used to circumvent the illusions of Sakanade. Shinji will refuse\
    \ to use his Bankai when his allies are present. Notable Attacks and Techniques:\
    \ : A Shinigami movement technique which allows the user to move faster than the\
    \ eye can follow. As speed is the main factor of the technique, the method is\
    \ best characterized by how fast one can get from point A to point B in the least\
    \ amount of steps. : The initial release to a Shinigami's Zanpakut\u014D. It is\
    \ activated by a command while declaring the name of the Zanpakut\u014D Spirit.\
    \ It changes the shape of the Zanpakut\u014D and/or granting special abilities.\
    \ *: When spun, the sword creates optical illusion. Shinji describes the release\
    \ technique as something like a trump card. Up and down, left and right as well\
    \ as forward and backward are reversed. However, it is not just the sense of direction\
    \ that is changed; the opponent's eyesight, direction of incoming attacks, and\
    \ injury locations are also inverted. In addition the effect of the Inverted World\
    \ can be targeted at or neglected from specific opponents, making it ideal for\
    \ use in group fighting. It also severely affects the equilibrium of those its\
    \ power is used on giving them vertigo, causing confusion, disorientation and/or\
    \ nausea. Shinji has further trained in its use to allow it to invert the words\
    \ and sounds that he says or heard by his enemies. Furthermore he also claimed\
    \ that with sufficient training he could even invert the temperature as well.\
    \ File:Shinji shikai02.gif|Sakanade : The ultimate and final release to a Zanpakut\u014D\
    . The difference in power between Shikai and Bankai is generally around 5-10 times\
    \ more powerful. Even though Bankai is the final stage of a Zanpakut\u014D, it\
    \ does not mean the Shinigami's growth ends there. A Bankai, especially one recently\
    \ obtained, can evolve even further as its Shinigami gets stronger. * Shinji's\
    \ bankai inverts the sense of friend-and-foe across anyone within the vicinity\
    \ of his bankai. Shinji stands on a large flower construct that protects him from\
    \ the effects. His sword becomes a staff with a large circular form on the front\
    \ end. It's a wide-range bankai, dangerous to use around allies, and is best used\
    \ against multiple enemies at once. His bankai is less effective against an enemy\
    \ one-on-one since there is nobody else to swap one's recognition of 'ally' and\
    \ 'enemy' with. But in such a case, Shinji could always pretend to be friends\
    \ and then stab the opponent from behind. File:Sakashima Yokoshima Happ\u014D\
    fusagari.gif|Sakashima Yokoshima Happ\u014Dfusagari : The process in which a Soul\
    \ attains the powers of a Hollow in order to pass the limits of their being. By\
    \ gaining the power of a Hollow, one's Reiryoku increases dramatically. Only those\
    \ who have control over their inner Hollow can Hollowfy manually. It manifests\
    \ itself as a unique mask of different shapes and designs. Soul Reapers that can\
    \ accomplish Hollowfication are known as Visoreds. *: A powerful blast of concentrated\
    \ spiritual energy fired in a laser like fashion that only Hollows, Arrancars,\
    \ and Visoreds can use. The power, force, speed, and blast area of the Cero is\
    \ dependent on the strength, spiritual power, and sometimes skill of the user.\
    \ File:Ep140ShinjiMask.png|Shinji's Hollow mask File:ShinjisCero1.gif|Shinji's\
    \ Cero Spells casted by Shinigami with strong enough Reiryoku and Reiryoku control.\
    \ Kid\u014D is divided into mainly three categories: Had\u014D for attacks, Bakud\u014D\
    \ for battle support and Kaid\u014D for healing. The spells are ranking from 1-99\
    \ with 1 being the weaker and easier spells to cast and 99 being the most powerful\
    \ and difficult to cast. Skilled users can cast Kid\u014D without the need of\
    \ an incantation; however, casting without incantation does reduce the Kid\u014D\
    's effectiveness less than a third of it's full potential. * Shinji puts his hand\
