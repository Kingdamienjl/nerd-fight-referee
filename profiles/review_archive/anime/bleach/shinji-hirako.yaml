    \ captainBleach Chapter -107. Shinji's skill in swordsmanship is displayed by\
    \ his ability to combat Gin Ichimaru in swordsmanship for an extended periodBleach\
    \ Chapter 375, and combat Mashiro Kuna's Hollowfied Hakuda techniquesBleach Chapter\
    \ -99) * Multiple Selves and Hollow Physiology (All Types/Hollow: Low Tier Arrancar\
    \ - After being HollowfiedBleach Chapter -99 by Sosuke Aizen, Shinji's soul became\
    \ inhabited by a Hollow, giving Shinji access to multiple Hollow techniques such\
    \ as CeroBleach Chapter 236) *Summoning, Statistics Amplification & Transformation\
    \ (Visored's can summon their Hollow Mask at willBleach Chapter 185 that grant\
    \ them Hollow powers and personalities for a limited time, whilst also greatly\
    \ boosting their statisticsBleach Chapter 236 to a level even beyond a BankaiBleach\
    \ Chapter 383Bleach Chapter 384) *Sleep Manipulation and Limited Dream Manipulation\
    \ (With Tanma Otoshi, Shinji places his hand in front of his target's face and\
    \ puts them to sleep and send them to their Inner WorldBleach Chapter 217) *Perception\
    \ Manipulation Nullification (Noren Mekuri is a Kido spell that allows Shinji\
    \ to dispel techniques that are used to hide things from his view such as KyokkoBleach\
    \ Chapter -107, which bends lightBleach Chapter 335, and cuts through spaceBleach\
    \ Unmasked Databook to conceal it's target) *Energy Projection (Using an unnamed\
    \ Kido spell, Shinji can fire blasts of energy strong enough to dispel a Cero\
    \ from Grimmjow JaegerjaquezBleach Chapter 236) *Fire Manipulation & Existence\
    \ Erasure (As an incredibly skilled and powerful Kido Master, Shinji should certainly\
    \ be able to use Hado 54: HaienBleach Databook, Official Character Book 2: \"\
    Masked\") *Danmaku, Light Manipulation and Explosion Manipulation (Shinji can\
    \ utilize Had\u014D 91, Senju K\u014Dten Taih\u014D, to fire several arrows of\
    \ light at his opponent to bombard them. These arrows explode on contactBleach\
    \ Thousand Year Blood War Anime: Episode 40Bleach Thousand Year Blood War Anime:\
    \ Episode 40) *Fragrance Manipulation (When released, Sakanade releases a pleasant\
    \ aroma by spinning around Shinji's hand. When smelt, those who Shinji chooses\
    \ are trapped within the \"Inverted World.\") **Sense Manipulation & Perception\
    \ Manipulation (Within the inverted world, the opponent's vision is completely\
    \ inverted, causing them to perceive left as right, up as down, front as back\
    \ and more. The reversal of sight caused by Sakanade even extends to where an\
    \ opponent has been injured as well. This manipulation disrupts the opponents\
    \ reflexes and puts them in a situation where they cannot adaptBleach Chapter\
    \ 387) **Social Influencing (Shinji is able to use his words to deceive intelligent\
    \ opponents to enhance the results of his ShikaiBleach Can't Fear Your Own World\
    \ Chapter 18) **Sound Manipulation (The inversion can disrupt equilibrium in the\
    \ target, and cause dizziness, and Shinji additionally learns how to reverse sound\
    \ to his targetBleach Chapter 554) **Attack Reflection (Shinji is able to reverse\
    \ attacks from his opponents by using Sakanade's powerBleach Chapter 612) *Limited\
    \ Creation, Mind Manipulation & Morality Manipulation (Shinji's Bankai creates\
    \ a large flower that Shinji steps in that protects him from his opponents. Sakashima\
    \ Yokoshima Happofusagari is an area of effect power that reverses the sense of\
    \ allegiance in all those within its range indiscriminately, turning ally into\
    \ foe and vice-versa. This leads to groups of people tearing each other apart\
    \ when they used to be alignedBleach Can't Fear Your Own World Chapter 19) Resistance\
    \ to: *Extrasensory Perception (2 layers; when using Son\xEDdo while Hollowified\
    \ (The Vizards are capable of using Son\xEDdo when they are HollowifiedKubo's\
    \ Club: 400, which allows them to bypass Extrasensory PerceptionBleach Can't Fear\
    \ Your Own World, Vol. 2 Chapter of even captain level opponents)"
