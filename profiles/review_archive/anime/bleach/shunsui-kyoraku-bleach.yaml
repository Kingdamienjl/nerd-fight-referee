        \ tendrils to extend out from him like shadows (resembling {{W|Sumi-e|ink-drawn}}\
        \ pine branches) while his Zanpakut\u014D Spirit, Katen, manifests behind\
        \ him.Bleach manga; Chapter 647, pages 15-17 A vast area around Shunsui is\
        \ subsequently overcast with an aura that alters the perception of those it\
        \ reaches, making their surroundings appear \"gloomy, desolate, and full of\
        \ despair\" as they feel chills,Bleach manga; Chapter 648, pages 4-9 and making\
        \ the sky look as if covered in eerie yellow squares, like the paneling of\
        \ a theater stage. The blades of Katen Ky\u014Dkotsu: Karamatsu Shinj\u016B\
        \ remain in the shape of their Shikai form.Bleach manga; Chapter 648, pages\
        \ 8 :Bankai Special Ability: Whereas Shunsui's Shikai makes children's games\
        \ real, his Bankai makes the story of a {{W|Theatre of Japan|tragic theater\
        \ play}} reality,Bleach anime; Episode 403 (eyecatch) based on a {{W|Shinj\u016B\
        |double suicide}} of two lovers, forcing Shunsui and his opponent to act out\
