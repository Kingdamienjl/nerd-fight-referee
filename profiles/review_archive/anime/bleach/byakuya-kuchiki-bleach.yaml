    - field: standard_equipment
      value: "*\u014Cken Clothing: After training with the Royal Guard, Byakuya dons\
        \ special clothing in order to safely return to the Seireitei. These clothes\
        \ are made from the bones and hair of the members of the Royal Guard, and\
        \ they possess incredible defensive power, allowing Byakuya to withstand the\
        \ friction that results from breaking through the 72 barriers between Soul\
        \ Society and the Soul King Palace without suffering any damage; Yhwach notes\
        \ that no Shinigami could hope to wear greater garb. These clothes take the\
        \ form of a white, turban-like headpiece covering the upper half of his head\
        \ and trailing off to his shoulders; a tasseled muffler covering his mouth;\
        \ and a white cape with a thick, light-colored hem worn over his shihakush\u014D\
        ."
