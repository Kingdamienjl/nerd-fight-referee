  intelligence:
    text: 'Genius (Byakuya has had decades of experience as a captain of the Gotei
      13, being renowned as one of the most skilled swordsmen, Flash Step practitioners,
      and Kido users in all of Soul Society. He is a rival to Yoruichi Shihouin, the
      Flash Goddess, when it comes to Flash Step skillBleach, Chapter 99: "Dead Black
      War Cloud" as he created some of his techniques by combining Flash Step with
      Zanjutsu such as his Senka. He is also known for being quite skilled in calligraphy
      and having been promoted to captain of Squad 6 at around the same time as Gin
      Ichimaru, with both being the same ageBleach, Chapter -105: "Turn Back the Pendulum
      4". He maintains a very calm and stoic demenor when it comes to nearly anything,
      having control over his emotions and remaining quite rational at all times.
      He is also stated to be smarter than Toshiro Hitsugaya and Gin, both of which
      are well-known for their intellect, and was also declared by Shunsui Kyoraku
      himself to be able to replace him as the Captain Commander of the Gotei 13Bleach:
      Can''t Fear Your Own World: Chapter 17. He has a very strong ability of analyzing
      and countering abilities as well as identifying his opponent''s strengths and
      weaknesses. This is shown in his battle against Zommari Rureaux when he slashed
      his limbs to prevent them from attacking himselfBleach, Chapter 300: "Curse
      Named Love" and had used his mastery of Kido to stop Rukia from harming herself
      after tricking him into thinking he was completely disarmed, as well as move
      her body with the weakest Hado to break the ice on her. He is also perceptive,
      noting that Ichigo''s Bankai was causing him problems as they fought since his
      speed decreased, and noted that Zommari''s techniques were similar to Kido,
      using Bakudo #81: Danku as a response to them to counter them as it can null
      all Kido 89 and under)'
