    - field: striking_strength
      value: 'Orihime has a good amount of skill in detecting spiritual energy, as
        she can sense Hollows and ongoing battles at a significant distance. If she
        concentrates, she can even sense the Reiatsu of people within protective barriers.Bleach
        manga; Chapter 222, page 15 Expert Hand-to-Hand Combatant: While a pacifist
        by nature, Orihime has a natural talent for martial arts. According to Tatsuki,
        who trained Orihime herself, Orihime has the fighting skill of a 1st-dan.Bleach
        anime; Episode 42 - in the English dub version it is yellow belt. Orihime
        is skillful enough to incapacitate two unseated Shinigami soldiers when she
        surprise attacked them.Bleach manga; Chapter 119, pages 14-15.'
      source_id: fandom-bleach-orihime-inoue-bleach
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: durability
      value: "Orihime has withstood separate assaults by Loly Aivirrne and Menoly\
        \ Mallia, which involved physical attacks and the use of Bala, with only moderate\
        \ bruising and swelling.Bleach manga; Chapter 272, pages 16-17 Memory Chikan\
        \ Resistance: Orihime was able to recall the event of her brother fighting\
        \ Ichigo, even though the memory chikan has been used on her by Rukia.Bleach\
        \ manga; Chapter 49, page 8 ===Shun Shun Rikka=== thumb|right|190px|One half\
        \ of the Shun Shun Rikka in their sealed state. {{translation|Shun Shun Rikka|\u76FE\
        \u821C\u516D\u82B1|Six Flowers of the Hibiscus Shield|viz=Six Princess Shielding\
        \ Flowers}}: Orihime's spirit energy is harbored in the pair of six-petal\
        \ flower-shaped hairpins that her brother gave her. Shun Shun Rikka is composed\
        \ of six spirits that reside within the hairpins, each of which is two petals\
        \ on the clip when inactive.Bleach manga; Chapter 43, page 18 Only spiritually\
        \ aware beings can see them.Bleach manga; Chapter 43, pages 1-7 They reside\
        \ in her hair-clips, which are shaped like six-petaled flowers. Through various\
        \ combinations of the six fairies, Orihime has the power to reject phenomena\
        \ by denying or undoing events in various forms.Bleach Official Character\
        \ Book Souls, page 71Bleach manga; Chapter 240, page 13 This power can be\
        \ used for attack, defense, or healing (depending on the combination). thumb|right|190px|Orihime's\
        \ power activating. The Visored Hachigen Ush\u014Dda comments that her hair\
        \ pins, being the physical manifestation of her powers, is very much like\
        \ the Zanpakut\u014D of a Shinigami, and that her powers resemble his own\
        \ powers.Bleach manga; Chapter 228, page 11 Sousuke Aizen, in his explanation\
        \ of the H\u014Dgyoku, states that Orihime's powers were actually awakened\
        \ by the H\u014Dgyoku; when she cursed her powerlessness with all her heart,\
        \ the H\u014Dgyoku answered her desire.Bleach manga; Chapter 401, page 5 The\
        \ spirits are separate manifestations of Orihime's spirit, each with its own\
        \ unique appearance and personality. Each are named after a flower: ====Ayame====\
        \ thumb|190px|right|Ayame. * {{translation|Ayame|\u3042\u3084\u3081|Iris}}\
        \ Voiced by, Tomoe Sakuragawa, English: Philece Sampler :Ayame has a quiet\
        \ personality. She wears a dress larger than her body. She, along with Shun'\u014D\
        , is in charge of Shun Shun Rikka's healing ability.Bleach Official Character\
        \ Book Souls, page 71 {{Clear}} ====Baigon==== thumb|190px|right|Baigon. *\
        \ {{translation|Baigon|\u6885\u5DCC|Ume}} Voiced by, Kiyoyuki Yanada, English:\
        \ Liam O'Brien :Baigon is a bald male spirit. He is brawny, and has a large\
        \ body. He wears a mask that covers the bottom of his face. Baigon is part\
        \ of Shun Shun Rikka's defense. {{Clear}} ====Hinagiku==== thumb|190px|right|Hinagiku.\
        \ * {{translation|Hinagiku|\u706B\u7121\u83CA|Daisy}} Voiced by, Daisuke Kishio,\
        \ English: Kirk Thornton :Hinagiku is a highly energetic male spirit. He wears\
        \ a large eye patch that ends in a horn. Hinagiku is part of Shun Shun Rikka's\
        \ defense. {{Clear}} ====Lily==== thumb|190px|right|Lily. * {{translation|Lily|\u30EA\
        \u30EA\u30A3|Lily}} Voiced by Rie Kugimiya, English: Kate Higgins :Lily is\
        \ a female spirit with bright pink hair, transparent yellow goggles, and a\
        \ blue bathing suit. She has a tattoo on her backside. Lily is part of Shun\
        \ Shun Rikka's defense. She has a futuristic style. {{Clear}} ====Shun'\u014D\
        ==== thumb|190px|right|Shun'\u014D. * {{translation|Shun'\u014D|\u821C\u685C\
        |Althea}} Voiced by Junko Noda, English: Dorothy Elias-Fahn, Latin American\
        \ Spanish: Javier Olgu\xEDn :Shun'\u014D is a friendly young male spirit with\
        \ a topknot. He and Tsubaki are usually the ones who talk to Orihime. He,\
        \ along with Ayame, is in charge of Shun Shun Rikka's healing ability. {{Clear}}\
        \ ====Tsubaki==== thumb|190px|right|Tsubaki. * {{translation|Tsubaki|\u693F\
        \u9B3C|Camellia}} Voiced by Toshiyuki Morikawa, English: Wally Wingert, Latin\
        \ American Spanish: Jorge Ornelas :Tsubaki is a fiery male spirit. He is the\
        \ only Shun Shun Rikka spirit capable of direct attack. He often strikes anyone\
        \ who gets on his nerves (including Orihime). Because he is primarily focused\
