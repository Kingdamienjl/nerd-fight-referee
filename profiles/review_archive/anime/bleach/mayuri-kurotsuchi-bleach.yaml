    field_candidates:
    - field: powers_and_abilities
      value: "Genius Intellect: Mayuri Kurotsuchi is the most intelligent, scientific,\
        \ and inventive mind in Soul Society. According to Shunsui Ky\u014Draku, if\
        \ given a full day to prepare with enough information at hand, Mayuri can\
        \ find a solution to any problem or obstacle. *Master Scientist/Inventor:\
        \ As the head of the Shinigami Research Institute, Mayuri is a talented inventor\
        \ and scientist, having created a number of devices and techniques to aid\
        \ him in battle. *Master Chemist/Pharmacologist: Being the current head of\
        \ the Research and Development Institute, Mayuri is an adept chemist and pharmacologist\
        \ who uses drugs and other chemicals to affect living organisms, conducting\
        \ experiments to develop new medications, determine optimal dosages, and identify\
        \ potential side effects. By his own admission, he also has a tolerance for\
        \ all the drugs he created on himself. *Master Strategist: Mayuri has a talent\
        \ for being well prepared. He takes many precautions before engaging in personal\
        \ combat with an adversary, usually studying them through his various methods.\
        \ He always has a contingency plan if something doesn't work out the way he\
        \ expects. *Tracking Expert: He has stated that he merely needs a strand of\
        \ a person's hair to find them. By using a simple chemical process, he can\
        \ discern the location of the person in question, using their DNA as a reference.\
        \ *Zanpakut\u014D Modification Expert: Uniquely among Shinigami, Mayuri can\
        \ manually alter and improve his own Zanpakut\u014D and its capabilities.\
        \ When fighting Szayelaporro, Mayuri revealed that he had installed a self-destruct\
        \ feature in his Bankai that would activate should it attack him. During his\
        \ skirmish with a zombified Hitsugaya, he displayed the use of a sensor installed\
        \ in the hilt of his Zanpakut\u014D that allowed it to automatically counter\
        \ all sword attacks aimed toward him. After paralyzing Zaraki with Ashisogi\
        \ Jiz\u014D, Ky\u014Ddo Yon in order to incapacitate him, Mayuri noted that\
        \ he would have to upgrade the paralyzing power of his Shikai after seeing\
        \ that Zaraki could still move his eyes. Most notably, however, Mayuri used\
        \ the information he gained on Pernida Parnkgjas during their battle to create\
        \ an alternate form of his Bankai in order to counter the latter's The Compulsory.\
        \ *Arrancar Resurrection: Mayuri has found a method to reanimate deceased\
        \ Arrancar with their personalities and fighting skills intact; he can also\
        \ fully restore any body parts they lost in death, such as with the revived\
        \ Luppi Antenor, who lost the upper half of his body to Grimmjow Jaegerjaquez.\
        \ However, these resurrected Arrancar are not innately loyal to Mayuri, so\
        \ he keeps them in line by electrically shocking the pain centers in their\
        \ brains. He has also integrated his Postcognition Drug into the bodily fluids\
        \ of all his resurrected Arrancar, so if their opponents come into contact\
        \ with these fluids, they will experience the effects of the drug. thumb|right|190px|Mayuri\
        \ rapidly restructures his right arm with his left. Body Modification Expert:\
        \ Mayuri has done extensive research on modifying bodies, and he has upgraded\
        \ a variety of his own body parts to function as weapons and provide him with\
        \ useful abilities. In addition, he can also restructure his own body in an\
        \ extremely short period of time if necessary, such as when he singlehandedly\
        \ rearranged the contents of his arm in a matter of seconds in order to prevent\
        \ Pernida Parnkgjas from controlling it. thumb|190px|right|Mayuri's Liquid\
        \ Form. *: When Mayuri stabs himself with his Zanpakut\u014D while in its\
        \ sealed state, it shifts him into a liquid form. Doing so doesn't kill him,\
        \ as it is a last resort technique, but instead simply leaves him unable to\
        \ attack or be attacked, making it an effective escape tool. He can move around\
        \ and speak in this form. He reforms after a few days, but without any of\
        \ his previous body modifications. This ability is a result of the extensive\
        \ amount of experimentation he has performed on himself. *: His left arm can\
        \ extend out like a grappling hook. When the arm is attacked it explodes on\
        \ impact, but with his regenerative serum, this is not a problem (though it\
        \ does cause him serious pain). *Hidden Kusarigama: He is able to pull part\
        \ of his ear out to form a scythe, attached to a rope-like ligament, for use\
        \ as a kusarigama. It is easily as sharp as a standard Zanpakut\u014D, and\
        \ he is quite skilled in its use. *: Another one of Mayuri's abilities, likely\
        \ achieved scientifically, is his ability to meld with the color and texture\
        \ of the environment. He used it while attempting to track the Ryoka in Soul\
        \ Society. When he reveals himself, the topical camouflage flakes away. *Organ\
        \ Replacement Surgery: Most impressively, he has demonstrated the ability\
        \ to replace functional internal organs with false ones that are just as functional\
        \ as their real counterparts yet nowhere near as vulnerable to harm, a feat\
        \ he performs on himself and his lieutenant to safeguard them from injury.\
        \ This particular operation is conceived of and carried out"
