    confidence: 0.75
    notes: auto_repair source extraction
  attack_potency:
    text: "At least Continent level+ (As an Espada, Baraggan would be stronger than\
      \ the Privaron Espada, such as DordoniBleach Chapter 250Bleach Chapter 251Bleach\
      \ Chapter 254Bleach Official Character Book 2 Masked, since Nnoitra claims the\
      \ current Espada are stronger than the previousBleach Chapter 292, which is\
      \ supported by the databooks which claim the Espada are above all other ArrancarBleach\
      \ Official Character Book 2 Masked, and the power of the Espada make the Fraccion's\
      \ pale in comparisonBleach Chapter 209; additionally, the Espada are ranked\
      \ according to their power, making Baraggan stronger than HarribelBleach Official\
      \ Character Book 2 MaskedBleach Official Character Book 3 Unmasked. He also\
      \ effortlessly tossed around Soi-FonBleach Chapter 355Bleach Chapter 3563.8945\
      \ Petatons), Multi-Continent level with Gran Rey Cero (Gran Rey Cero is the\
      \ most powerful enhanced version of the CeroBleach Official Character Book 2\
      \ Masked, making it a greater amplification than Cero Oscuras which is 10xBleach\
      \ Official Character Book 3 Unmasked, it was calculated to be this strong but\
      \ scales higher via powerscaling38.9448 Petatons), Multi-Continent level with\
      \ Resurreccion (Stronger than Resurreccion Harribel. His Resurrecci\xF3n multiplies\
      \ his power by 10x, as the releases of Espada numbered 4 are up are considered\
      \ stronger than Cero Oscuras and considered to be similar in strength to the\
      \ Gran Rey CeroBleach Chapter 34538.9448 Petatons, Respira is 3.8945 Exatons),\
      \ higher with Cero Oscuras (All Espada can use this technique in their release\
      \ formsBleach Chapter 346 which amplifies their normal Cero by 10x389.4479 Petatons),\
      \ far higher with Gran Rey Cero (It is the ultimate Cero, it was calculated\
      \ to be this strong but scales higher via powerscaling), Respira ignores conventional\
      \ durability (It was able to age Jakuho Raikoben, albeit it needed to be projected\
      \ far ahead of BaragganBleach Chapter 364Bleach Chapter 369, and Cien claims\
      \ it is among the most powerful abilities in Hueco Mundo, excluding Cien's full\
      \ transformation and AizenSpirits Are Forever With You 2, meaning it would be\
      \ capable of aging things as strong as Ulquiorra's Lanza del Relampago)"
