    field_candidates:
    - field: striking_strength
      value: "its only purpose had become awaiting the invasion of another force.\
        \ When Baraggan was told one of his subordinates had been killed, Sousuke\
        \ Aizen, Gin Ichimaru, and Kaname T\u014Dsen appeared at the entrance to the\
        \ court. T\u014Dsen killed a Hollow which had tried to attack Aizen, who,\
        \ stating he and Baraggan had never met before, asked him if he was the King\
        \ of Hueco Mundo. Confirming his status, Baraggan asked Aizen who they were.\
        \ Pointing out they had no masks, which made it obvious they were not Hollows,\
        \ Baraggan asked if they were Humans or Shinigami. When the question was not\
        \ answered, Baraggan, stating he cared very little about what they were, said\
        \ he was so bored, he would have split his army in two and made them kill\
        \ each other if they had not arrived, and welcomed them to his palace of Las\
        \ Noches.Bleach manga; Chapter 371, pages 2-6 thumb|right|190px|Aizen shows\
        \ Baraggan his [[Zanpakut\u014D.]] T\u014Dsen states that it was interesting\
        \ that Baraggan called a place without walls or a ceiling a palace, asking\
        \ if it was a joke on his part. Baraggan replied that he had no need for a\
        \ ceiling, for he was a king, and that the very sky of Hueco Mundo was the\
        \ roof of his palace. Unsheathing his Zanpakut\u014D, Aizen asked Baraggan\
        \ to take a look at his sword, telling him that its name was Ky\u014Dka Suigetsu.\
        \ As he held it up for all to see, Baraggan asked him what he was doing. Aizen\
