power_scale:
  tier:
    text: 'At least {{6-A}}, {{High 6-A}} with Gran Rey Cero, {{High 6-A}} with Resurreccion,
      higher with Cero Oscuras, far higher with Gran Rey Cero Name: Baraggan Louisenbairn,
      God-King of Hueco Mundo Origin: Bleach Gender: Male Age: Unknown Classification:
      Arrancar, 2nd Espada, Former King of Hueco Mundo'
    source_ids:
