        \ of whatever he touches, causing the appropriate damage which comes with\
        \ aging. He aged Su\xEC-F\u0113ng's left arm to the point where its bones\
        \ broke after becoming very brittle, rendering it unusable. thumb|right|190px|Baraggan's\
        \ Reiatsu. Immense Spiritual Power: As a member of the top four Espada, Baraggan\
        \ is forbidden to release his Zanpakut\u014D inside Las Noches because such\
