    - field: weaknesses
      value: "The barrier he uses to protect himself from the effects of his ability\
        \ can be negated if his Respira somehow enters his own body. Notable Attacks/Techniques:\
        \ Cero: A powerful blast of concentrated spiritual energy fired in a laser\
        \ like fashion that only Hollows, Arrancars, and Visoreds can use. The power,\
        \ force, speed, and blast area of the Cero is dependent on the strength, spiritual\
        \ power, and sometimes skill of the user. *Gran Rey Cero: A much more powerful\
        \ Cero only accessible to the Espada. By mixing their blood with a Cero, the\
        \ Espada can discharge a blast that can distort space and is powerful enough\
        \ to destroy Las Noches. *Cero Oscuras: A powerful Cero that can only be used\
        \ by the Espada in their Resurrecci\xF3n. This Cero is powerful enough to\
        \ destroy Las Noches as well. Bala: An Arrancar ability similar to Cero, except\
        \ it's weaker and 20 times faster. Son\xEDdo: The Arrancar equivalent of Shunpo;\
        \ however, is more akin to teleporting as the character completely disappears\
        \ from senses from point A to point B. Hierro: An ability that allows Arrancars\
        \ to harden their skin with Reiyroku to defend against incoming attacks. Pesquisa:\
        \ An energy sensing technique that allows Arrancars to sense any foes nearby\
        \ and gauge how strong they are. Descorrer: An Arrancar technique that allows\
        \ them to travel between Hueco Mundo and the Living World. Caja Negacion:\
        \ These cubes are capable of sealing away an enemy from the battlefield for\
        \ a very long time, even foes that are far stronger, however the time limit\
        \ for the stronger foes is much shorter than those on the same level as him.\
        \ Senescencia: Baraggan's aspect of death as an Espada is aging. He possesses\
        \ abilities based around time manipulation due to it. *Time Dilation Field:\
        \ A field that surrounds Baraggan that slows the time around him. It prevents\
        \ surprise attacks and slows all attacks while leave the attacker open for\
        \ a counter. *Age Acceleration: Baraggan can rapidly accelerate the aging\
        \ of whatever he touches. It is rapid enough to accelerate the aging of Su\xEC\
        -F\u0113ng's arm to a point of being brittle enough to instantly break. Resurrecci\xF3\
        n: The Arrancar equivalent of a Shikai/Bankai, this form allows an Arrancar\
        \ to unleash their true power as a Hollow. Arrogante: Baraggan's Resurrecci\xF3\
        n that is released upon the command Decay. His person is entirely shrouded\
        \ in a dark cloak and his body is transformed to a skeleton with a crown.\
        \ It grants new abilities and further amplifies his previous abilities. *Respira:\
        \ Baraggan generates a miasma that spreads outwards to rapidly age everything\
        \ caught in it or making contact with it. It can even affect inanimate objects\
        \ or energy projections like Kid\u014D. The aging is rapid enough to near-instantly\
        \ skeletonize Su\xEC-F\u0113ng's arm despite Shinigami being able to live\
        \ over thousands of years. *Gran Caida: Barragan summons a large axe to fight\
        \ his enemies in close range. File:Senescencia.gif|Senescencia File:Respira.gif|Respira\
