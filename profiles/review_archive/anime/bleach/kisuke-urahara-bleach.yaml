    field_candidates:
    - field: durability
      value: "While not the most imposing in appearance, Urahara has received considerable\
        \ physical training from his days in the Onmitsukid\u014D, and is well-conditioned\
        \ for battle. He can take large amounts of punishment. His durability caused\
        \ Hiyori Sarugaki to be more careful about how she would hit him if she did\
        \ not want to hurt herself instead.Bleach manga; Chapter -107, pages 13-14\
        \ Enhanced Endurance: During his time as a captain, he would regularly be\
        \ assaulted by his then-lieutenant Hiyori. Each time, he would take the assaults\
        \ indifferently, if not laugh about it, with little to no adverse effect on\
        \ himself. Against Askin's The Deathdealing, despite displayed great exhaustion\
        \ from the Quincy's poisonous power, Urahara was still able to move about\
        \ with considerable agility, surprising Askin.Bleach manga; Chapter 644, pages\
        \ 13-14 Enhanced Agility: While normally laid-back, Urahara is an immensely\
        \ agile fighter. In battle, he can effectively use the battlefield to his\
        \ advantage, flipping and jumping from wall to wall to keep his opponents\
        \ unsure of his attack patterns. Offensively, his agility grants him great\
        \ balance and dexterity in battle, attacking his opponent from various angles\
        \ with great accuracy and force. thumb|right|190px|Urahara holds his blade\
        \ against a surprised Yammy's neck. Master Assassin: As a former high-ranking\
        \ member of the Onmitsukid\u014D, Urahara possesses considerable mastery in\
        \ the art of stealth combat. He has repeatedly shown impressive skill in staying\
        \ hidden and unseen while maneuvering towards his target. He can completely\
        \ hide his presence, remaining undetected until he intentionally reveals himself.\
        \ During his battle against Yammy, he repeatedly caught his opponent completely\
        \ off guard and effectively took advantage of it.Bleach manga; Chapter 235,\
        \ page 2 Even the perceptive and intuitive Aizen was caught by surprise.Bleach\
        \ manga; Chapter 402, pages 8-9 He was also able to launch a successful sneak\
        \ attack on the Quincy Quilge, sensing when Quilge was not using his Blut\
        \ Vene for defense.Bleach manga; Chapter 499, page 9 {{clear}} ===Zanpakut\u014D\
        === thumb|right|190px|Benihime's sword-cane sealed state. {{translation|Benihime|\u7D05\
        \u59EB|Crimson Princess|viz=Red Princess}}: A blade described by Urahara as\
        \ \"not nice\", it is one of the few known Zanpakut\u014D with a female spirit\
        \ owned by a male. When sealed, Benihime is a beige-colored shikomizue (a\
        \ blade hidden inside a cane) with a curved handle and silver base. As the\
        \ blade resides in a cane, the cane's handle is still the hilt and the shaft\
        \ is the sheath, allowing it to still operate like other Zanpakut\u014D.Bleach\
        \ manga; Chapter 64, page 20 The shaft's base bears a Gokon Tekk\u014D emblem\
        \ on the bottom, which can separate souls from bodies by pressing the mark\
        \ to it.Bleach manga; Chapter 29, page 12 Back when Urahara was still in the\
        \ Gotei 13, Benihime was sealed in an average-sized katana form, with a black\
        \ sheath worn under Urahara's sash. It had an oval-shaped tsuba, with a snowflake-design\
        \ embossed in it, and a black hilt-wrapping.Bleach anime; Episode 69, flashback\
