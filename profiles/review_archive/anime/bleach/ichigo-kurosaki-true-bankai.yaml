  intelligence:
    text: "{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|General= Gifted\
      \ {{Border|Scroll=Yes|Visible=No|Content=Ichigo may be straightforward at times\
      \ and can seem clueless, but underneath a base level interpretation, Ichigo\
      \ is exceptionally intelligent. Before Bleach, he was an excellent student grade\
      \ wise, ranking near the top 20 in his schoolBleach, Chapter 35: \"Will You\
      \ Be My Enemy?\". He was able to remain above the average in high school despite\
      \ the pre-timeskip events of Bleach interfering with his life, only having dropping\
      \ grades due to his depressed state after his loss of powers, which all of those\
      \ events occurred while he was in school both physically and emotionally. Even\
      \ before the events of the story, he was known for constantly skipping school,\
      \ which persisted into high school as wellBleach, Chapter 18: \"6/17 op.2 Doesn't\
      \ Smile Much Anymore\"Bleach, Chapter 25.2: \"things like loneliness\". but\
      \ despite that, he scored high among his class. He deduced his Shihakusho is\
      \ a part of his Bankai on his own and how it indicates his current Reiatsu and\
      \ further confirmed this after Orihime told him Reiatsu takes longer to recover,\
      \ noting to Unohana that his current Reiatsu was indicated by his Shihakusho's\
      \ current conditionBleach, Chapter 382: \"The United Front 2 (Discordeque Mix)\"\
      . He also mastered his true Hollow and Quincy powers and understands the equilibrium\
      \ and what is needed to breach it after just unlocking his newfound abilities.\
      \ Ichigo also within only days of being a Soul Reaper, could use Spirit Ribbons\
      \ without any guidance at all, a feat not even Rukia could do despite her years\
      \ of experience within the Gotei 13Bleach, Chapter 8: \"Chasing Chad\". His\
      \ knowledge is vast compared to many as he was taught by Kisuke Urahara, the\
      \ greatest genius the Soul Society ever had, learning about the cosmology, races,\
      \ techniques, and even learning about some of the Soul Society's top secrets,\
      \ something most captains don't know, in addition to other sources such as the\
      \ Vizards, Xcution, and Squad 0 teaching him things such as Hollowfication,\
      \ Fullbrings and the Royal Palace, being able to quickly absorb and apply that\
      \ information despite these being completely foreign to him as a teenager with\
      \ no experience with phenomenon beyond the World of the Living and having no\
      \ official or formal teachings of it, in addition to his vast lack of quantitative\
      \ experience compared to most Soul Reapers. He very quickly learns new life\
      \ skills and general concepts and is able to apply them with ease such as learning\
      \ how to fly using Yoruichi's device after being told how to fly once without\
      \ trainingBleach, Chapter 116: \"White Tower Rocks\". }} |-|In Combat\u25BE\
      = Genius (Ichigo is a terrifying fighter when it comes to his tactical and creative\
      \ intellect and combat capabilities) {{#tag:tabber| Adaptation and Accelerated\
      \ Growth= {{Border|Scroll=Yes|Visible=No|Content= Ichigo is infamously adaptive\
      \ and has a staggering growth rate, being listed as a war potential for his\
      \ extraordinary growth speed in combat and training. He can go from being completely\
      \ inferior in skill and stats to outskilling his enemies and overpowering them\
      \ quickly. He learned Bankai in 2 days using a life-threatening method when\
      \ even prodigies need 10 years to do so, gaining 10 years of experience in only\
      \ 2 daysBleach, Chapter 120: Shake Hands With GrenadesBleach, Chapter 130: Suspicion2\
      \ [of Tears]Bleach, Chapter 133: Memories in the rain2 \"the nocturne\"Bleach,\
      \ Chapter 138: Individual ThoughtsBleach, Chapter 162: Black Moon Rising. After\
      \ the first day, it was stated by Yoruichi that Ichigo's combat skill exclusively\
      \ had improved, and was also stated by Urahara that Ichigo is more gifted than\
      \ he is, which holds significant weight as Urahara is a combat genius in his\
      \ own right. Ichigo has also faced off against many unique and strange weapons\
      \ and have used them to his advantage through adapting and analyzing as well\
      \ as honing his skills and instinctsBleach, Chapter 86: \"Making Good Relations,\
      \ OK?\"Bleach, Chapter 87: \"Dancing With Spears\"Bleach, Chapter 88: SO UNLUCKY\
      \ WE AREBleach, Chapter 96: \"BLOODRED CONFLICT\"Bleach, Chapter 109: \"Like\
      \ a Tiger Trying Not to Crush the Flowers\". Despite the massive barrier between\
      \ Byakuya and Renji, Ichigo surpassed this barrier easily within his first few\
      \ fights by fighting equally with Byakuya after just recently fighting Renji\
      \ only two fights ago, even outskilling himBleach, Character Book SOULS. While\
      \ vastly weaker than him, he learned to control his reiatsu flow against Kenpachi\
      \ and went from not even making a dent and lacking the ability to land a meaningful\
      \ hit, to dealing actual damage to him. He became a master of Flash Step in\
      \ a matter of minutes, a technique that takes 6 years to masterBleach: TURN\
      \ BACK THE PENDULUM 1Bleach, Character Book SOULSBleach, Chapter 160: \"Battle\
      \ on Guillotine Hill\", being able to spam it relentlessly in his fight with\
      \ Byakuya, in addition to effectively using his Bankai just after he unlocked\
      \ it."
    source_ids:
    - vsbattles-ichigo-kurosaki-true-bankai-bleach
