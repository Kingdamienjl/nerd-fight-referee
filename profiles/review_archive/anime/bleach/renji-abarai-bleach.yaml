      value: "Immense Spiritual Power: Originally, as a lieutenant of the Gotei 13,\
        \ Renji possessed high spiritual energy. Upon learning Bankai, this power\
        \ increased on a scale from 5-10, with Rukia Kuchiki commenting that it was\
        \ so high, she could not recognize it until it decreased to a familiar level.\
        \ This spiritual power significantly increased again after training with the\
        \ Royal Guard and eating Kirio Hikifune's Reiatsu-induced food, making his\
        \ power completely different from before. This is proven when Renji calmly\
        \ overpowers Mask De Masculine, a captain-level combatant who previously defeated\
        \ Renji soundly, with his Shikai alone during their second encounter. His\
        \ Reiatsu is light red in color. Master Swordsman: Trained by Ikkaku Madarame,\
        \ *Whip Sword Mastery: Renji's weapon skills are very versatile. Despite the\
        \ unique shape that his Shikai takes, a retractable sword-whip, Renji is able\
        \ to effectively wield it as if it is an extension of his body. A true testament\
        \ of his skills is how he can maneuver his Shikai in a variety of ways: attacking\
        \ from behind, or either the left or right, without giving away the pattern\
        \ or direction of his attack until it is too late. He can also use the extension\
        \ capabilities to constrict opponents, surrounding them from various angles\
        \ and then retracting Zabimaru in order to crush his adversaries. Shunpo Expert:\
        \ Knowing that Zabimaru's Shikai attacks leave him open to counterattacks,\
        \ Renji became very proficient in Shunpo to compensate for this, allowing\
        \ him to dodge point-blank attacks with it. Renji can keep up with captain-level\
        \ opponents and is correspondingly somewhat knowledgeable of the higher-level\
        \ techniques of Shunpo. Kid\u014D Practitioner: As a student at the Shin'\u014D\
        \ Academy, Renji showed poor skill in Kid\u014D. By the time he became a lieutenant,\
        \ his prowess improved enough for him to cast low-level Bakud\u014D spells\
        \ and mid-level Had\u014D spells such as Shakkah\u014D without incantation.\
        \ Renji has enough knowledge of Kid\u014D to manipulate it for purposes other\
        \ than fighting, such as to illuminate dark corridors; however, his skill\
        \ for repeated and continuous spell casting is still weak, as blasts in succession\
        \ will randomly explode on him, and he can only maintain a small ball of light\
        \ without reciting the full chant. Immense Strength: Renji possesses incredible\
        \ physical strength. When he swings Zabimaru, he can easily toss his foe into\
        \ the air, and subsequently pushes them through an entire building several\
