    - field: durability
      value: "Seventeen months after Aizen's defeat, Renji takes a direct, ground-shattering\
        \ strike from Jackie's enhanced Dirty Boots Fullbring unfazed.Bleach manga;\
        \ Chapter 465, pages 15-16 He endured the unique healing properties of Tenjir\u014D\
        \ Kirinji's hot springs without rotting away after being fully healed for\
        \ a noticeable period, as well as the Royal Guard member's powerful punch,\
        \ while remaining mostly unfazed, which greatly impressed the man.Bleach manga;\
        \ Chapter 520, page 11 Later, after his training with the Royal Guard and\
        \ during his fight with Mask, Renji emerged unharmed after withstanding the\
        \ onslaught of Mask The Superstar-enhanced Star Lariat and Star Flash: Super\
        \ Nova.Bleach manga; Chapter 563, pages 12-17 Enhanced Endurance: During his\
        \ first fight with Byakuya, Renji was hit directly by every blade from Senbonzakura\
        \ Kageyoshi and then pierced by five more blades; Bleach manga; Chapter 142\
        \ pages 14-15Bleach manga; Chapter 143 pages 9-10 despite such terrible damage,\
        \ he shocked Byakuya by fighting through it to almost strike down his captain\
        \ before finally collapsing.Bleach manga; Chapter 144 pages 1-12 Similarly,\
        \ Renji managed to endure his own full-power Had\u014D #31. Shakkah\u014D\
        \ at point-blank simply to hurt Szayelaporro Granz, despite being severely\
        \ burned by it.Bleach manga; Chapter 275, pages 12-16 He even withstood having\
        \ several internal organs crushed by Szayelaporro's Teatro de Titere, forcing\
        \ Szayelaporro to instead crush his tendons in order to bring him down while\
        \ noting that Renji should have been rendered unconscious by that point.Bleach\
        \ manga; Chapter 295, page 8 Enhanced Speed & Reflexes: When fighting against\
        \ Ury\u016B Ishida in Wahrwelt without access to Shunpo, Renji displays impressive\
        \ natural speed and reflexes, allowing him to dodge several Heilig Pfeil and\
        \ redirect one with his foot; even at close range, Renji evaded one with only\
        \ a small scratch on his cheek. ===Zanpakut\u014D=== Zabimaru redirects here.\
        \ For the manifested spirit see Zabimaru (Zanpakut\u014D spirit). {{translation|Zabimaru|\u86C7\
        \u5C3E\u4E38|Snake Tail}}: Zabimaru's sealed form resembles a typical katana.\
        \ It has a rectangular bronze tsuba with a jagged design, and a red handle\
        \ and sheath. thumb|right|190px|Zabimaru's [[Shikai state.]] *Shikai: Its\
        \ Shikai command is {{translation|\"Howl\"|\u5486\u3048\u308D|hoero|\"Roar\"\
        \ in the English dub}}. In its Shikai, Zabimaru transforms into an even longer\
        \ 6-part segmented blade; each segment is wider than the one preceding it\
        \ from the hilt, with 2 pick-like protrusions on the front and back of each\
        \ segment, with the ones on the front much longer than the ones on the back.\
        \ The segments of Zabimaru can grow in number almost without limit. The segments\
        \ are connected by a stretchable thread, making Zabimaru more useful as a\
        \ whip than an actual sword, however, it can serve as a regular sword just\
        \ as easily, thanks to Renji's swordsmanship. Its guard and handle remain\
        \ the same in its Shikai release.Bleach manga; Chapter 54, pages 17-19 Because\
        \ of the way its Shikai doubles as a whip, Renji states that out of all the\
        \ Zanpakut\u014D wielded by the lieutenants, Zabimaru is the most difficult\
        \ to master. :Shikai Special Ability: Zabimaru has a rarely used special technique\
        \ known as: :*{{translation|Higa Zekk\u014D|\u72D2\u7259\u7D76\u54AC|Bite\
        \ of a Broken Baboon's Fang|viz=Baboon Fang Bite}}: Renji can use his spiritual\
        \ power to levitate the disconnected or broken segments of Zabimaru into the\
        \ air, allowing him to execute a one-shot omni-directional attack, however,\
        \ Renji states that this technique is damaging to Zabimaru, as he can only\
        \ use it once, and leaves him defenseless.Bleach manga; Chapter 174, pages\
        \ 7-13 thumb|right|190px|S\u014D\u014D Zabimaru *Bankai: {{translation|S\u014D\
        \u014D Zabimaru|\u53CC\u738B\u86C7\u5C3E\u4E38|Twin Kings Snake Tail|viz=Two\
