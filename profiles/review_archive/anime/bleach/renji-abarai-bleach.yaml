    - field: lifting_strength
      value: "History== {{Scroll-1| thumb|left|190px|A young Renji with [[Rukia during\
        \ their early years in Rukongai.]] Renji grew up in the 78th District of Rukongai,\
        \ Inuzuri, with several other children. The children were Fujimaru the tallest\
        \ who had a strong sense of responsibility and was the witty one, Kosaburou\
        \ who was quiet and a hard worker, and Mameji who was the butt of all the\
        \ jokes and timid but good with numbers.Bleach Jet Art Book Having come to\
        \ Soul Society alone, they helped each other to search for their families.\
        \ One day, after stealing a jug of water, Renji and his friends were chased\
        \ by a kama-wielding adult. Rukia Kuchiki tripped the adult and urged Renji's\
        \ group to follow her to avoid losing the water. Rukia joined their group\
        \ and they lived together as a family. They all hated Inuzuri and the people\
        \ there. Renji disliked the fact that Rukia had spiritual power like he did.\
        \ Ten years after Rukia joined their group, with all of their friends dead,\
        \ Rukia proposed that they become Shinigami, which Renji agreed to do. As\
        \ they were quite gifted with spiritual powers, they entered the Shin'\u014D\
        \ Academy with ease, where they struggled to prove their worth among those\
        \ from noble families.Bleach manga; Chapter 98, pages 5-11 The night before\
        \ the welcoming ceremony for the new students of the Academy, Renji slept\
        \ in a tree, against Rukia's advice. The following morning, he fell out of\
        \ the tree and landed on a headstone where a startled Izuru Kira had been\
        \ praying. Having scored among the highest grades in the entrance exam, Renji\
        \ was admitted into the top class along with Izuru and Momo Hinamori.Bleach\
        \ manga; Chapter -17, pages 4-8 thumb|right|190px|Renji helps to defend [[Sh\u016B\
        hei Hisagi|Hisagi.]] Two months after entering the Academy, Renji scolded\
        \ Rukia for still not fitting in and informed her that he was going to the\
        \ Human World for field training to practice the Kons\u014D for the first\
        \ time. Whilst being briefed on the field trip by Sh\u016Bhei Hisagi, Hotaru\
        \ Kanisawa, and Aoga, Renji failed to recognize Sh\u016Bhei, who was to lead\
        \ the mission. Izuru explained to him that Hisagi was famous and a gifted\
        \ student. Renji, Izuru, and Momo were assigned to the same group. When Momo\
        \ joined them, Renji kicked Izuru because of how he greeted her, saying that\
        \ he should not let his emotions show so easily. While in the Human World,\
        \ Renji remarked that Kons\u014D was a lot easier than he had imagined. He\
        \ then lost his temper with the constantly fidgeting Izuru and punched him.Bleach\
        \ manga; Chapter -17, pages 10-16 As Sh\u016Bhei called an end to their field\
        \ trip, the group was attacked by a Huge Hollow, which killed Kanisawa and\
        \ seriously wounded Aoga. Sh\u016Bhei ordered the group to retreat while he\
        \ stayed to fight the Hollow. When a second Huge Hollow appeared, Momo stopped\
        \ and questioned why they were running away. Renji reminded Momo that the\
        \ Hollow had just killed two sixth year students. When Momo rushed back towards\
        \ Sh\u016Bhei, Renji and Izuru followed her and helped to block the second\
        \ Hollow's attack on him. When more Huge Hollows showed up, they were saved\
        \ by the arrival of Fifth Division's Captain Sousuke Aizen, and his lieutenant,\
        \ Gin Ichimaru. When Momo wondered if they would ever become as strong as\
        \ Aizen and Ichimaru, Renji laughed at the notion and insisted that captains\
        \ and lieutenants were monsters.Bleach manga; Chapter -17, pages 17-33 thumb|left|190px|Renji\
        \ and Rukia during their [[Shin'\u014D Academy|Academy days.]] Having passed\
        \ an important exam, Renji rushed to find Rukia to tell her. However, when\
        \ he found her, she was with several Shinigami, including Byakuya Kuchiki.\
        \ As they left, Renji noted Byakuya's power, causing him to wonder who he\
        \ was. Renji asked what they wanted and congratulated Rukia when she told\
        \ him that they want to have her adopted into the Kuchiki Clan, have her graduate\
        \ immediately and assigned to the 13th Division. Rukia thanked him and left.\
        \ Renji told himself that Rukia finally had a family and that he should stay\
        \ out of it.Bleach manga; Chapter 98, pages 12-16 After Rukia left, Renji\
        \ trained every day in a bid to beat Byakuya, but he was unable to defeat\
        \ him even once.Bleach manga; Chapter -17, page 18 Renji graduated from the\
        \ Shin'\u014D Academy in its 2,066th year and joined the Gotei 13, where he\
        \ initially served under Aizen in the 5th Division, along with Izuru and Momo.\
        \ The rebellious Renji, however, was moved to the 11th Division and rose to\
        \ the rank of 6th Seat.Bleach manga; Volume 23, 0 side-B During his time in\
        \ the 11th Division, he befriended Ikkaku Madarame, to whom he revealed that\
        \ he wanted to become stronger than Byakuya Kuchiki.Bleach manga; Chapter\
        \ 144, page 14 Ikkaku taught Renji how to fight and Renji became aware that\
        \ Ikkaku had a Bankai, and requested that he use it to train Renji.Bleach\
        \ manga; Chapter 206, pages 12-13 Forty years after Rukia's adoption into\
        \ the Kuchiki Clan, in mid-April, Momo and Izuru presented Renji with a letter\
        \ stating that he was to be promoted to lieutenant of the 6th"
