      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "He has genuine overconfidence. He also tends to think too much during\
        \ actual battles. Notable Attacks and Techniques:, : A Shinigami movement\
        \ technique which allows the user to move faster than the eye can follow.\
        \ It consists of three stages, and Shunpo-The concept of posture or stance\
        \ in martial arts, it involves how a practitioner maintains balance, which\
        \ is crucial for effective technique execution. -The concept of withdrawing\
        \ or pulling back the leg in martial arts, the method is best characterized\
        \ by how fast one can get from point A to point B in the least amount of steps.,\
        \ : The initial release to a Shinigami's Zanpakut\u014D. It is activated by\
        \ a command while declaring the name of the Zanpakut\u014D Spirit. It changes\
        \ the shape of the Zanpakut\u014D and/or granting special abilities. Tenjiro's\
        \ release command is \"Heavenly Flash!\"., : Kirinji uses the light that Kinpika\
        \ radiates to momentarily blind his enemies, and it also seems to give him\
        \ an increase in striking power. thumb, Kirinji summons water, Hot Spring\
        \ Water Manipulation: Tenjiro is capable of summoning and manipulating hot\
        \ spring water from his hot springs to burn and drain opponents of their Blood\
        \ on contact and reiatsu or heal and revitalize allies., : Spells cast by\
        \ Shinigami with strong enough Reiryoku and Reiryoku control. Kid\u014D is\
        \ divided into mainly three categories: Had\u014D for attacks, Bakud\u014D\
        \ for battle support and Kaid\u014D for healing. The spells are ranking from\
        \ 1-99 with 1 being the weaker and easier spells to cast and 99 being the\
        \ most powerful and difficult to cast. Skilled users can cast Kid\u014D without\
        \ the need of an incantation, casting without incantation does reduce the\
        \ Kid\u014D's effectiveness less than a third of its full potential."
