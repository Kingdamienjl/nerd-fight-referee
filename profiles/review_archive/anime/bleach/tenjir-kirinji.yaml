  intelligence:
    text: 'Extraordinary Genius (Tenjiro Kirinji is a master at the body and soul
      in terms of medical application, having created Kaido, the shinigami art of
      healing, which promoted him to his position in Squad 0.BLEACH: 13 BLADEs Tenjiro''s
      mastery of the art allowed him to tutor the likes of Retsu Unohana, one of the
      Soul Society''s most skilled healers and his student, being vastly superior
      to her.Bleach TYBW Season 1 Episode 8 (14:13-14:39) He created special hot springs
      for healing and can perfectly use those dangerous methods to heal those on the
      brink of death with perfect judgment of knowing when they are ready, successfully
      healing an injured Ichigo Kurosaki, Renji Abarai, Rukia Kuchiki, and a near-dead
      Byakuya KuchikiBleach Chapter 519: Hot Hot Heat, a feat that even Unohana couldn''t
      manage. Even geniuses on the level of Kisuke Urahara couldn''t copy his hot
      springs 1 to 1. He also is an extremely skilled practitioner in Shunpo, being
      able to ridicule Shunpo masters such as Sui-Feng with ease and is a master of
      the second stage of Shunpo BakkyakuKlub Outside Q&A #570)'
