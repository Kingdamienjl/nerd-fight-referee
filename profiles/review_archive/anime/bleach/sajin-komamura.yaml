- id: claim-powers-and-abilities-03a02203
  section: abilities
  axis: hax
  text: 'Soul Physiology and Shinigami Physiology (Soul: High-Tier/Shinigami: High-Tier),
    Master Swordsmanship and Expert Hand-to-Hand Combatant (As the previous captain
    of Squad 7, Komamura''s an extremely experienced swordsman and hand-to-hand combatant,
    with this level of skill being displayed in his many battles, such as against
    the likes of Kaname TosenBleach: Chapter 383 or Bambietta BasterbineBleach: Chapter
    556), Weapon Creation (With Shikai - Komamura''s Shikai allows him to project
    a large, translucent replica of his sword into the air behind him,Bleach: Chapter
    384 increasing the physical power behind his strikes alongside its effective rangeBleach:
    Chapter 139), Large Size, Statistics Amplification and Creation (Type 2 - Komamura''s
    Bankai generates a large, samurai-like construct which replicates all of Sajin''s
    moves simultaneously,Bleach: Chapter 148 this construct is incredibly tall, reaching
    over a 100+ meters in size.Bleach Calc The main effect behind this Bankai, just
    like his Shikai, is to increase Sajin''s attacking power behind his strikes, alongside
    his effective range, just doing so on a much larger level compared to his ShikaiBleach:
    Chapter 385), Invulnerability and Immortality (Type 7 - With Humanization - After
    offering his heart to his grandfather,Bleach: Chapter 556 Komamura is induce with
    the effects of "humanization", what this does, aside from the visual changes,
    makes Sajin invulnerable towards attacks,Bleach: Chapter 557 regardless of the
    attack being physical, spiritual, mental or even esoteric in nature, such as Bambietta
    Basterbine''s Reishi bombs. It also strips away the "life" behind his Bankai,
    effectively "killing" it and Sajin while under this effect, and instead transforms
    into a construct of pure Reiatsu)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
