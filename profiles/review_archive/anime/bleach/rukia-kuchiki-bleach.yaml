      value: "*\u014Cken Clothing: After training with the Royal Guard, Rukia dons\
        \ special clothing in order to safely return to the Seireitei. These clothes\
        \ are made from the bones and hair of the members of the Royal Guard, and\
        \ they possess incredible defensive power, allowing Rukia to withstand the\
        \ friction that results from breaking through the 72 barriers between Soul\
        \ Society and the Soul King Palace without suffering any damage; Yhwach notes\
        \ that no Shinigami could hope to wear greater garb. These clothes take the\
        \ form of a long white shawl wrapped around her head and hang past her shoulders,\
        \ fluffy white earmuffs, a white visor covering her eyes, and a long white\
        \ cloak worn over her shihakush\u014D."
