      value: In order to further give the enemy an advantage, Zaraki wears bells on
        each spike of his hair. These bells can only be heard by enemies whose Reiatsu
        is concentrated to the point where it can actually defeat Zaraki. Sometime
        after Aizen's defeat, Zaraki stopped wearing them.Bleach manga; Volume 53,
        the sketch between Chapters 463 and 464 {{clear}}
      source_id: fandom-bleach-kenpachi-zaraki-bleach
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: durability
      value: "In part due to his incredibly concentrated Reiatsu, Zaraki is very hard\
        \ to damage. During his battle against Yammy, as Zaraki was focusing his attention\
        \ on Ichigo, Yammy delivered a powerful blow with his massive fist, launching\
        \ Zaraki several meters and smashing him into a large pillar. Despite the\
        \ impact, Zaraki quickly emerged unfazed, unimpressed by the \"decent punch\"\
        \ Yammy threw at him.Bleach manga; Chapter 380, pages 7-10 During his battle\
        \ with Gremmy, Zaraki remained unharmed after being fired upon by dozens of\
        \ firearms and having missiles thrown at him,Bleach manga; Chapter 575, pages\
        \ 14-16 and later withstood the cold vacuum of space and having several clones\
        \ of Gremmy self-destruct at point-blank range with only moderate injuries.Bleach\
        \ manga; Chapter 578, pages 6-13 thumb|right|190px|Zaraki easily withstands\
        \ impalement from [[Kaname T\u014Dsen to grab him for a counterattack.]] Immense\
        \ Endurance: Zaraki's physical prowess is equally displayed by his resilience.\
        \ Zaraki often ignores most of the injuries he sustains in battle, not suffering\
        \ any debilitation despite having multiple slash and puncture wounds on his\
        \ body and rarely any signs of pain much like a berserker. While battling\
        \ Sajin Komamura and Kaname T\u014Dsen, he took a hit from Komamura's Tenken\
        \ and stabbed by the projectiles of Suzumushi Nishiki: Benihik\u014D and shrugged\
        \ it off, claiming it wasn't even enough to wake him up. He allowed himself\
        \ to be stabbed by T\u014Dsen just to grab T\u014Dsen's sword to dispel his\
        \ Bankai's effect.Bleach manga; Chapter 139, pages 15-16 During his first\
        \ battle with Nnoitra, he suffered numerous slash wounds, was even impaled\
        \ and almost beheaded with no visual impairment of his fighting performance;\
        \ Nnoitra noting most people would have already been dead by then.Bleach manga;\
        \ Chapters 306-312 Even after Zaraki suffered severe organ damage from his\
        \ battle with Gremmy, it took the combined effort of four Sternritter and\
        \ their Schrifts to finally defeat him, rendered immobile from his injuries\
        \ but still fully conscious.Bleach manga; Chapter 580, pages 16 Despite having\
        \ his arm mangled by Pernida's The Compulsory, Zaraki still managed to nonchalantly\
        \ hold his sword with that arm.Bleach manga; Chapter 635, pages 13-17 Even\
        \ after receiving grievous injuries that left him comatose, he healed enough\
        \ to return to training only days later, showing a high recovery rate as well.Bleach\
