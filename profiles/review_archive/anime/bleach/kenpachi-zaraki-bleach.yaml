    - field: powers_and_abilities
      value: "thumb|190px|Zaraki's battle prowess continuously increases while battling\
        \ [[Retsu Unohana.]] Specialized Combatant: Zaraki did not attend the Shin'\u014D\
        \ Academy, and thus has a limited skillset, especially for a Gotei 13 Captain.\
        \ Despite that and even before accessing any of his Zanpakut\u014D's power,\
        \ he more than made up for this fault with his sheer might, resilience, and\
        \ ingenuity. Training himself into a masterful combatant, he uses basic and\
        \ direct, but effective methods to overwhelm his opponent. Fighting solely\
        \ on instinct, reflexes, and present observation, he has no set pattern of\
        \ attacks and likewise steadily improves with each exchange. From this, he\
        \ can instantly change his approach and tactics, making it almost impossible\
        \ for his opponents to anticipate him. Against T\u014Dsen's Bankai, which\
        \ left him with only a sense of touch, he kept adapting and dodging T\u014D\
        sen's attacks at the moment the latter's blade touches him to avoid serious\
        \ injury and counter-attack with increasing accuracy. These traits, combined\
        \ with his monstrous power, easily make him one of the strongest Shinigami\
        \ in the Gotei 13's history. His immense fighting prowess is the reason why\
        \ Zaraki was recognized as one of the 5 Special War Powers by the Wandenreich,\
        \ proving himself as such by having easily defeated three Sternritters back-to-back,\
        \ who are said to possess above-Captain level might while he had greatly restrained\
        \ power at the time. * Highly Perceptive Combatant: Despite his seeming disregard\
        \ for any strategy and self-admitted aversion to thinking, Zaraki has regularly\
        \ displayed a surprisingly keen understanding of various situations. Even\
        \ Byakuya was impressed by Zaraki's ability to understand things he has no\
        \ personal experience with. He is likewise able to quickly see through his\
        \ opponents' attack patterns and battle methods, finding and exploiting weaknesses\
        \ in his opponents' techniques, and likewise quickly adjust and alter his\
        \ own methods to better counter them. Against Gremmy Thoumeaux, Zaraki correctly\
        \ deduced that Gremmy Thoumeaux's The Visionary was limited by concentration\
        \ and can have its effects removed if his attention is diverted. He is also\
        \ insightful to people's nature, able to notice subtle traits in people and\
        \ see what drives a person's actions; he correctly singled out Kaname T\u014D\
        sen and Gin Ichimaru as the only captains who are afraid to die. He possesses\
        \ sharp intuition towards incoming danger, which allowed him to repeatedly\
        \ dodge T\u014Dsen's assault while still affected by his Bankai. thumb|right|190px|Zaraki\
        \ exerts his monstrous Reiatsu. Immeasurable Spiritual Power: Even by a captain's\
        \ standards, Zaraki's Reiryoku is monstrous. Despite having subconsciously\
        \ suppressed his true power for centuries, Zaraki's fighting prowess was never\
        \ noticeably hindered; even with his energy-sealing eyepatch, he could challenge\
        \ two captain-level and Bankai-wielding opponents in succession. Ganju Shiba\
        \ estimated his sealed power to be close to or at the same level as Byakuya\
        \ Kuchiki's Reiatsu. Retsu Unohana, one of the most powerful captains of the\
        \ Gotei 13, stated she was weaker than him even while he was still a child.\
        \ During the Invasion of Hueco Mundo, he defeated the Fifth Espada, Nnoitra\
        \ Gilga, and overpowered Yammy Llargo, the strongest of the Espada. After\
        \ defeating Unohana and removing his mental limits, Zaraki becomes powerful\
        \ enough to fight on par with and defeat Gremmy Thoumeaux without taking off\
        \ his eyepatch, and pressure Gerard Valkyrie while the Sternritter was vastly\
        \ empowered by The Miracle and previously defeated several Shinigami in a\
        \ single attack. When unleashing a strong enough surge of energy, it becomes\
        \ visible and yellow in color, sometimes appearing as a skull. :Unruly Reiatsu\
        \ Control: By his own admission, Zaraki has poor control of his spiritual\
        \ energy as it constantly remains very potent, forcing him to rely on his\
        \ eyepatch to keep it at a more manageable level. Despite this, he is able\
        \ to make liberal use of it in a variety of ways. It can affect large areas,\
        \ spanning miles, and cause others within that area to enter a state of paralysis\
        \ and confusion. When exerting his energy, the sheer magnitude of Zaraki's\
        \ energy can cause considerable damage, destroying the area around him and\
        \ launching away weaker opponents. Likewise, this can repel or disrupt most\
        \ enemy attacks and abilities. After defeating Unohana, Zaraki gains considerable\
        \ control over his Reiatsu; prior to fighting Gremmy, Shinigami in the nearby\
        \ area were completely unable to detect his Reiatsu. He can also use his Reiryoku\
        \ for more basic feats, such as standing in midair like other Shinigami. thumb|right|190px|Zaraki's\
        \ spiritual aura protects him while unguarded. :*Damage Resistance: The intensity\
        \ of Zaraki's Reiryoku also acts as a sort of armor, making it impossible\
        \ for him to be harmed by anyone not at least at his level of power. This\
        \ is first demonstrated when he faced Ichigo; at the start of the fight, Zaraki\
        \ allows Ichigo to strike"
