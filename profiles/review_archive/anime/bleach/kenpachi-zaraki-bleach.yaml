    - field: speed
      value: "Prior to learning how to perform basic Shunpo, Zaraki displayed deceptively\
        \ degree of speed for his size and build. Thanks to the tremendous raw strength\
        \ in his legs, Zaraki's natural acceleration more than made up for his lack\
        \ of Shunpo, allowing him to move fast enough to instantly close a huge gap\
        \ of space between him and his opponent,Bleach anime; Episode 199 and even\
        \ seemingly disappear from sight. In battle, he can strike with incredible\
        \ speed in rapid succession, making it highly difficult for his opponents\
        \ to find an opening and counterattack. During his short battle with Byakuya,\
        \ Zaraki manages to keep up with his opponent's incredibly fast Shunpo, a\
        \ feat which shocked and impressed Byakuya.Bleach anime; Episode 244 ===Zanpakut\u014D\
        === Nozarashi redirects here. For the manifested spirit see Nozarashi (Zanpakut\u014D\
        \ spirit). thumb|190px|Nozarashi in its sealed form. {{translation|Nozarashi|\u91CE\
        \u6652|Weather-Beaten One|viz=Weather Beaten}}:Bleach manga; Chapter 576,\
        \ page 18 As a young boy living in the Rukongai, Zaraki came upon a dead Shinigami.\
        \ He took the Asauchi, imprinting his soul upon it to become his own Zanpakut\u014D\
        .Bleach manga; Chapter 529, page 5Bleach manga; Chapter 525, page 6 While\
        \ still a wanderer, he would carry the sword across his back by a rope, over\
        \ his right shoulder and at the left of his waist under his sash while a Shinigami.\
        \ The blade is much longer than most Zanpakut\u014D, roughly the size of a\
        \ nodachi, with a relatively narrow, but long tsuba shaped like a serrated,\
        \ eliptical bicone. The hilt and braid are both white, though they are mostly\
        \ wrapped in white bandages, as is his sword's brown saya.Bleach manga; Chapter\
        \ 120, page 9 Originally, Zaraki was the only captain in the history of the\
        \ Gotei 13 to not know the name of his Zanpakut\u014D, nor could he perform\
        \ either of his blade's releases. Zangetsu noted Zaraki's disharmony with\
        \ his sword caused the two to damage each other's powers; consequently, Zaraki\
        \ could not hear the cry of his sword. Their disharmony left it with little\
        \ spiritual energy and easier to damage; the blade is chipped and worn-down\
        \ upon its edge. Despite this, Nozarashi can easily cut through most targets:\
        \ Zaraki stabs straight through Ichigo's Zanpakut\u014D, and later slices\
        \ a building in half with no apparent effort after removing his eyepatch.\
        \ After his fight with Ichigo, Zaraki wished to learn more about his Zanpakut\u014D\
        \ because he wanted to become stronger and could identify with the pain of\
        \ not having a name. Later, upon defeating Retsu Unohana in battle and awakening\
        \ his true strength, Zaraki finally heard his Zanpakut\u014D's voice.Bleach\
        \ manga; Chapter 527, pages 5-9 thumb|right|190px|Nozarashi in its Shikai\
        \ form. *Shikai: Before Zaraki knew its name, Soul Society believed that Zaraki's\
