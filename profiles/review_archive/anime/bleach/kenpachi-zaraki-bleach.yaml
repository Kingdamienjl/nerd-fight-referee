      value: "===Combat=== Kid\u014D: Zaraki has no skill or interest in the use of\
        \ Kid\u014D, leaving him only with direct-attack methods for battle. Reiatsu\
        \ Mental Limiters (Formerly): As noted by Unohana, because of Zaraki's strong\
        \ desire for a challenging fight, but possessing such overwhelming power that\
        \ quickly defeats most opponents, he subconsciously began limiting his Reiatsu,\
        \ even without his eyepatch. Against foes of high power, his power will instinctively\
        \ be just slightly above said foe. The longer he fights a foe that pressures\
        \ him, the more he subconsciously removes his limits, steadily increasing\
        \ his Reiatsu. Zaraki's subconscious limit was the reason he lost his fight\
        \ with Ichigo, as he could not adjust to Ichigo's increase in power in time.Bleach\
        \ chapter 525, page 11-15 After his death-battle against Unohana, Zaraki's\
        \ subconscious barriers were permanently removed, granting him constant and\
        \ instant access to his full power (when not wearing his eyepatch). ===Zanpakut\u014D"
