        \ into the custom \u201Cabsolute\u201D entity represented by this profile.\
        \ ---- = Key Feats =, Casually defeats Junko Enoshima and Mukuro Ikusaba within\
        \ the composite scaling interpretation., Single-handedly defeats Future Foundation\
        \ fleets consisting of dozens of battleships., Masters every known human talent.,\
