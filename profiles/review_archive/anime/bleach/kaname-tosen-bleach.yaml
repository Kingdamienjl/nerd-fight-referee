    - field: keys
      value: "{{W|Yama (Buddhism)|Yama}} Cricket|viz=Bell Bug Closing Ceremony: Field\
        \ Cricket}}: Suzumushi maintains its form of a regular katana, though without\
        \ the small ring. T\u014Dsen holds up his sword in his right hand, and places\
        \ his left palm against the ring on his cross guard. The ring begins to spin\
        \ as it releases spiritual energy. As it spins faster, the circle grows bigger\
        \ and bigger until it's large enough to surround his body. The ring then splits\
        \ into ten other glowing rings of similar size that encircle T\u014Dsen. With\
        \ a slash of his sword, the circles go flying outwards and form a circular\
        \ perimeter over a large area. Once in position, the ten rings begin to generate\
        \ a black void, which grows in size until it forms a large black dome, which\
        \ is centered around T\u014Dsen's body and anchored to the ground by the ten\
        \ rings. Each ring of Suzumushi Tsuishiki: Enma K\u014Drogi is inscribed with\
        \ a unique kanji, which include {{translation|Skeleton|\u9AA8|Hone}}, {{translation|Scatter/Squander|\u6563\
        |Bara}}, {{translation|Daring/Tragic/Pitiful|\u6562|Kan}}, {{translation|Inflamed/Fester|\u721B\
        |Ran}}, {{translation|Blood|\u8840|Chi}}, and {{translation|Stretch/Spread|\u5F35\
        |Ch\u014D}}.Bleach manga; Chapter 146, pages 7-16Bleach manga, Chapter 147,\
        \ Page 10-14Bleach manga; Chapter 148, Page 2 :Bankai Special Ability: The\
        \ dome creates a vacuum that nullifies the senses of spiritual energy, sight,\
        \ sound, and scent, what T\u014Dsen calls {{translation|Mumy\u014D|\u7121\u660E\
        |lit. \"No Light\", popularly known as \"Avidya\" and defined as \"Ignorance\
        \ (of Buddhist teachings)\"}}. The only sense the victim retains is that of\
        \ touch. Unlike with some Zanpakut\u014D, Suzumushi does not convert itself\
        \ into the massive dome that it creates during Bankai. Instead, the dome serves\
        \ as a separate extension of Suzumushi itself, allowing T\u014Dsen to wield\
        \ its sealed form as a weapon while inside the dome, but preventing him from\
        \ using its abilities. The technique's main shortcoming is that anyone, not\
        \ just T\u014Dsen himself, touching Suzumushi's hilt is immune to the dome's\
        \ effects, so anyone able to grab Suzumushi recovers their senses. The dome\
        \ only exists as long as T\u014Dsen wills it to, or if he happens to become\
