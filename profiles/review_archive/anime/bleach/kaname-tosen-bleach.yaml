        \ a wide area, overloading the hearing of anyone in range and knocking them\
        \ unconscious. This comparatively humane and painless technique fits with\
        \ T\u014Dsen's self-presentation as a proponent of justice.Bleach manga; Chapter\
        \ 126, page 16 The ring tone is produced by the vibration of Suzumushi, which\
        \ T\u014Dsen can also use to free his sword from something wrapped around\
        \ and ensnaring it, such as Kazeshini.Bleach manga; Chapter 368, page 4 :*{{translation|Suzumushi\
