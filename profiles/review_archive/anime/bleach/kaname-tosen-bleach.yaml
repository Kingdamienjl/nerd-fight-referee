        \ 1-3 & pages 11-13 ===Zanpakut\u014D=== {{translation|Suzumushi|\u6E05\u866B\
        |Cricket|viz=Bell Bug}}: Kaname T\u014Dsen attained Suzumushi after attending\
        \ the funeral of his late friend.Bleach manga; Chapter 148, Page 9 In its\
        \ sealed state, Suzumushi looks like a regular katana with an orange hilt.\
        \ The tsuba has a teardrop shape, with the base of the drop arcing over the\
        \ top of the blade, and the point of the drop pointing below the cutting edge.\
        \ A row of several tiny teardrop-shaped holes decorates the bottom of the\
        \ curve, and a small ring, approximately 2\" in diameter, dangles off the\
        \ tip of the tear-drop. *Shikai: Unlike most Zanpakut\u014D, Suzumushi has\
        \ two Shikai commands, each producing a unique automatic effect. thumb|right|190px|Suzumushi,\
        \ T\u014Dsen's first Shikai ability. :Shikai Special Ability: Suzumushi maintains\
        \ its form of a regular katana. Suzumushi's release command is {{translation|\"\
