- id: claim-weaknesses-990142c6
  section: weaknesses
  axis: weakness
  text: Tends to underestimate humans, and secretly envies them greatly. Those who
    can sense souls can easily tell Envy apart from humans by the massive amount contained
    within him. If killed enough times, Envy will run out of souls to regenerate causing
    Envy to be reduced to a another much weaker and near defenseless tiny leech-like
    bug form or turn into dust killing him for good. Although, this weakness is somewhat
    circumvented by Envy being able to absorb souls to add to his Philosopher's Stone.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-d60794bf
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Homunculus Physiology, Social Influencing
    (Convinced May Chang to return to Amestris despite her needing to take care of
    her own matters in XingChapter 80. Can imitate other people he barely knows decently
    well while transformed into them), Shapeshifting (Envy can perfectly mimic other
    people and transform into themChapter 6, although he might sometimes make slight
    mistakesChapter 15. Envy can also take the form of animalsChapter 38, and make
    the transformation as fast as he needs it to be, down to it being over in the
    course of a quick leapChapter 94), Explosion Manipulation and possibly Preparation
    (Caused a large explosion through unknown meansChapter 13), Elasticity, Body Control
    and Weapon Creation (Envy''s shapeshifting isn''t limited to people or things
    he can turn into, as he can freely manipulate his body to form various useful
    weaponsChapter 50), Density Manipulation (As Envy''s real form is quite large,
    he becomes very dense when shrinking), Large Size (Type 1: Envy''s true form is
    this largeChapter 51) | Small Size (Type 2), Body Puppetry and Absorption (Envy
    can control others'' bodies by biting themChapter 80. He can use this ability
    to fuse multiple bodies together and return to his true formChapter 91), Natural
    Weaponry (Teeth)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
