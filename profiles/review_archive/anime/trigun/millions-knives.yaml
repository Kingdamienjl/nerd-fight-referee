    - field: weaknesses
      value: "Doesn't go all out. Notable Attacks/Techniques: *Camp Fire (\u30AD\u30E3\
        \u30F3\u30D7\u30D5\u30A1\u30A4\u30A2 Kyanpu Faia): Starjun sets his entire\
        \ body on fire, also burning everything in the near vicinity. *Medium Flame\
        \ (\u4E2D\u706B Ch\u016Bbi): A more intense Camp Fire, boasting increased\
        \ range and heat. *Strong Flame (\u5F37\u706B Tsuyobi): An even more intense\
        \ Camp Fire, it easily melts Toriko's Fork Armor and scorches him. *Burner\
        \ Broil Stab (\u30D0\u30FC\u30CA\u30FC\u7099\u308A\u523A B\u0101n\u0101 Aburi\
        \ Sashi): A powerful thrust using the Burner Knife. *Single Stroke Grill Cut\
        \ (\u4E00\u5200\u713C\u304D\u5207\u308A Itt\u014D Yakikiri): A slash carried\
        \ out with the Burner Knife. *Burner Punch (\u30D0\u30FC\u30CA\u30FC\u30D1\
        \u30F3\u30C1 B\u0101n\u0101 Panchi): A punch covered in fire, it is capable\
        \ of completely burning through an opponent of Toriko's caliber. *Fire Spear\
        \ (\u30D5\u30A1\u30A4\u30A2\u30FC\u30B9\u30DA\u30A2 Faia Supea): Starjun creates\
        \ a spear composed of fire around his forearm. The spear releases a column\
        \ of fire extreme flames. *Burner Shot (\u30D0\u30FC\u30CA\u30FC\u30B7\u30E7\
        \u30C3\u30C8 B\u0101n\u0101 Shotto): Starjun shoots a barrage of fire projectiles\
        \ from his hands, riddling the opponent full of holes. *Thermal Disinfection\
        \ (\u71B1\u6D88\u6BD2 Netsu Sh\u014Ddoku): Starjun increases his body temperature\
        \ to prevent poison from affecting his body. *Fire Shield (\u706B\u76FE Hitate):\
        \ Starjun extends his hand outward and produce flames that act like a barrier\
        \ to block attacks, melting them away in an instant. According to Toriko,\
        \ the flames may reach the temperature of 2800\xB0F, the melting point of\
        \ iron. *Blaze Whirlwind (\u706B\u708E\u65CB\u98A8 Kaen Senp\u016B): Using\
        \ his Burner Knife, Starjun creates a large cyclone of flames around him strong\
        \ enough to stop and melt a barrage of Toriko's Flying Knives and Forks. *Volcano\
        \ (\u30DC\u30EB\u30B1\u30FC\u30CE Boruk\u0113no): Starjun creates a large\
        \ torrent of flames. *Star Slicer (\u661F\u5207\u308A Hoshigiri): Using Satan\
        \ Burner, Starjun swings his Burner Knife. *Burner Squall (\u30D0\u30FC\u30CA\
        \u30FC\u30B9\u30B3\u30FC\u30EB B\u0101n\u0101 Suk\u014Dru): Starjun turn his\
        \ arm into fire and, with an overhand punch, calls down a rain of fire. The\
        \ attack covers a wide area, and the explosions generate multiple, large mushroom\
        \ clouds. *Gourmet Clairvoyance (\u30B0\u30EB\u30E1\u5343\u91CC\u773C Gurume\
        \ Senrigan): Starjun uses his appetite's third eye to lock onto and track\
        \ its target. It can see over any distance, which can keep track of Starjun's\
        \ prey even should they escape into space. Since light takes approximately\
        \ eight minutes to reach earth, it can be believed that the light is relatively\
        \ old. However, Starjun's eye is able to process the \"current\" prey, thus\
        \ keeping its eye on the future. *Knocking: He is shown to be quite adept\
        \ at Knocking. During his first appearance, while using a GT Robot, he manages\
        \ to easily knock a large school of Puffer Whale, impressive as he is underwater\
        \ at the time and both Toriko and Coco have to concentrate very hard to Knock\
        \ just one Puffer Whale. Note: Due to Starjun using GT Robos, his performance\
        \ was greatly nerfed, and it is difficult to gauge his power prior to the\
        \ Cooking Fest Arc. However with the GT Robo, he scales to its performance."
