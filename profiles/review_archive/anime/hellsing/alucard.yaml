      value: "Alucard's heart is his main weak point, destroying it will force Alucard\
        \ to use one of his many souls to serve as an \"extra life\" so it may die\
        \ in his place, extending his life in the process. However, simply damaging\
        \ Alucard such as cutting his arms or destroying his head will not have Alucard\
        \ use his souls, instead just activating his standard regeneration without\
        \ any use of them. If Alucard has no souls left to use, a single fatal strike\
        \ to his heart will instantly kill him. This may also be true of if his head\
        \ is destroyed or completely removed. Using Level 0 empties Alucard soul stock,\
        \ and thus he can be killed with a fatal blow to the heart. Needs to consume\
        \ blood otherwise he will enter a dormant state | If Alucard is not aware\
        \ of his existence or absorbs another existence, he will disappear. No longer\
        \ has 120 thousand lives, as he was forced to kill them all. Notable Attacks/Techniques:\
        \ *Dark Composition: Though he generally dons a corporeal, humanoid form,\
        \ Alucard is actually made up of a highly variable otherworldly substance\
        \ that is black in core and reddish on its edges. This can be especially seen\
        \ whenever he takes heavy damage, the darkness being immune to conventional\
        \ weaponry. Along with composing his being, it can serve as a weapon. Alucard\
        \ is able to transform this material into virtually anything he chooses, like\
        \ a puddle of goo. *Transformation: When he releases his restrictions to level\
        \ 1 or 0, he gains the ability to change forms. He has demonstrated the ability\
        \ to change into multiple forms, but one in particular, a form where he looks\
        \ mostly like he does normally except wilder and wearing a black straitjacket,\
        \ is consistently shown to have the most power, as he frequently uses it to\
        \ overpower enemies who had previously overpowered him in his other forms,\
        \ such as Tubalcain Alhambra and Alexander Anderson. Outside of this straitjacket\
        \ form which he uses for battle, he has also demonstrated an ability to turn\
        \ into an androgynous form commonly known as \"Girlycard\", which seems to\
        \ possess the same abilities as his standard red coat-clad form, and his original\
        \ form as Count Vlad Tepes, which seems to be his weakest form as he turned\
        \ from it back into his red coat form when he found himself overwhelmed against\
        \ Alexander Anderson. Each form seems to have a slightly different mood while\
        \ he is using it, with \"Girlycard\" being the most flamboyant, Vlad the Impaler\
        \ seemingly being the most emotional, and Straitjacket being the most animalistic\
        \ and savage, all while Red Coat is the most gentlemanly and regal. *Regeneration:\
        \ Alucard has the ability to perfectly and quickly recover from any physical\
        \ injury. He has been torn to shreds by conventional weaponry and holy weaponry\
        \ designed to kill his kind and has survived all of it. Holy weapons, while\
        \ they do affect him more, are regenerated all the same if not as quickly.\
        \ *Hematophagy: As a vampire, Alucard has the ability to consume blood raw.\
        \ He has long, conical fangs to assist in this job as well as serpentine-like\
        \ tongue. His feeding habits have been seen to vary: from the traditional\
        \ neck-biting to simply ripping people to pieces and outright devouring them.\
        \ Alucard doesn't seem to need blood to survive, however if starved of of\
        \ it, he will enter an inactive death-like state. *Aestivation: Alucard will\
        \ enter a dormant state if he goes too long without blood. It is unknown if\
        \ he can be starved to death, as he goes decades without a drop of blood before\
        \ a young Integra finds him. It is never made clear if this is unique to him\
        \ or if all vampires can do this. *Hemokinesis: Alucard has the ability to\
        \ manipulate blood. This ability seems to be limited to blood outside of the\
        \ body, as he is never seen influencing the blood of enemies while they are\
        \ intact. **Soul Absorption: By draining a person of their blood, Alucard\
        \ gains dominance over their souls and very forms. He also takes on whatever\
        \ knowledge they possess, as he was able to find out about Millennium by draining\
        \ Tubalcain Alhambra of his blood. ***Familiar Control: Alucard can summon\
        \ forth anyone he's taking the soul of at will. He has an entire legion dwelling\
        \ within him but seems to favor using Baskerville, the Black Dog. Whoever\
        \ he absorbs, their powers are at his disposal. While Seras gives her familiar,\
        \ Pip Bernadotte, some free reign within her own soul, Alucard seems content\
        \ to completely dominate everything living inside him. It is unclear if this\
        \ is due to their individual wills or a lack of experience on Seras' part.\
        \ It is unclear if Alucard is able to gain any familiars after consuming Schr\xF6\
        dinger. *Mist Body: Alucard is capable of turning his body into some sort\
        \ of dark reddish mist in order to render attacks against him useless. *Daywalking:\
        \ Other vampires operate in the dark, because of a presumed weakness to light.\
        \ Alucard however seems to have no problem with sunlight, only complaining\
        \ that being up during the day is exhausting. *Hypnosis: Alucard has the ability\
