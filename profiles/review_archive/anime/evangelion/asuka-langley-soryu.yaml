power_scale:
  tier:
    text: 'Low 5-B, higher with A.T. Field Name: Adam, The First Angel, The First
      Apostle (In supplementary material) Origin: Evangelion Age: Billions of years
      old (Adam was already on earth before Lilith had arrived, 4 billion years ago)
      Gender: Unknown, possibly Male Classification: Angel/Apostle, Seed of Life'
    source_ids:
    - character-stats-profiles-asuka-langley-soryu-evangelion
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: Small Planet Level (Adam, along with Lilith, are god-like beings who stand
      as the two strongest characters within the Evangelion setting, being vastly
      superior to their progeny and would thus upscale any feats that they perform.
      Evangelion Unit-01 upon acquiring the Fruit of Life attains a level of existence
      equal to that of Adam, meaning that he would scale to the former's feat of harming
      Lilith-Rei, who is Low 5-B via sheer size), higher with A.T. Field. Can negate
      durability with Anti-A.T. Field
    source_ids:
    - character-stats-profiles-asuka-langley-soryu-evangelion
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: "Supersonic movement speed (Upscaled from Unit-01, who was able to move\
      \ this fast as they approached a descending Sahaquiel, though it should be noted\
      \ that Unit-01 is made from Lilith, not Adam), with FTL+ combat speed, attack\
      \ speed and reactions (Possesses the optic blasts of Sachiel, Israfel and Zeruel,\
      \ which are consistently stated to be rays of light in the supplementary material,\
      \ and Arael\u2019s mind probing A.T. Field which is projected as a ray of light.\
      \ Upscaled from Unit-00, who was able to intercept Ramiel\u2019s particle beam,\
      \ which moves at 99% light speed, and who should be comparable to Units 01 and\
      \ 02, who were able to dodge Israfel\u2019s optic blasts mid combat. Superior\
      \ to Angels who are shown to be relative or even superior to the Evas, such\
      \ as Zeruel, who was able to blitz Unit-02 and Unit-01. Upscaled from Berserk\
      \ Unit-01, who was able to react to Zeruel\u2019s arms, which were used in blitzing\
      \ Unit-02. Is equal to Awakened Unit-01, who should be superior in speed to\
      \ her berserk self)"
    source_ids:
    - character-stats-profiles-asuka-langley-soryu-evangelion
    confidence: 0.8
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: "Small Planet Level (Awakened Eva 01, who was able to harm Lilith-Rei, was\
      \ considered equal to Adam. Due to Newton\u2019s third law this would scale\
      \ to her durability as well), higher with A.T. Field. Immortality and Regeneration\
      \ make him very difficult to kill"
    source_ids:
    - character-stats-profiles-asuka-langley-soryu-evangelion
    confidence: 0.8
    notes: auto_repair source extraction
  stamina:
    text: Athletic | Essentially Infinite when it has its Umbilical Cable connected,
      has 5 minutes internal battery otherwise and longer with extra batter packs.
      Much higher in berserk mode as it can run without a power source as it contains
      a soul
    source_ids:
    - vsbattles-asuka-langley-soryu-evangelion
    confidence: 0.75
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range | Extended Melee Range. Hundreds of Meters to Thousands
      of Kilometers with ranged weapons (The Positron rifle can shoot into low earth
      orbitEpisode:22 - Staying Human Director's Cut 15:30)
    source_ids:
    - vsbattles-asuka-langley-soryu-evangelion
    confidence: 0.75
    notes: auto_repair source extraction
  intelligence:
    text: General= Genius (Asuka is considered a child prodigy as well as a genius.Evangelion
      Chronicle 03 At the age of 14, she had already graduated from university and
      earned her degree.Episode:10 - The Magma Diver 05:12 Although she cannot read
      kanji, she is fluent in both German and Japanese, as well as being capable of
      casually thinking to herself in either language even during the heat of an Angel
      battle without the risk of facing a programming error based off of Unit-02's
      language settings.Episode:08 - Asuka Arrives in Japan Used her knowledge on
      thermal expansion when facing Sandalphon, immediately realizing what she had
      to do to counter the Angel's adaptation given the circumstances) |-|Combat=
      Gifted (Taking great pride in her position as the Second Child, Asuka is takes
      her combative performance of Unit-02 rather seriously. Marked as an elite member
      of NERV,Evangelion Chronicle 03 she received years of training to become an
      EVA pilot, starting at a very young age, which granted her the skills to proficiently
      wield various different weapons. While operating an unarmed Unit-02, Asuka has
      displayed a high degree of agility in combination with hand-to-hand combat,
      allowing her to swiftly evade harm from, and overwhelm her opponents. In armed
      combat, she wields knives, glaives, axes, assault rifles, sniper rifles, and
      bazookas. When facing Matarael without the tactical assistance of Misato Katsuragi
      and less than three minutes of power remaining for the three Evangelion Units,
      Asuka came up with a plan in mere seconds and successfully coordinated herself,
      Shinji, and Rei against the Angel which resulted in the EVA Children's victory.
      When facing the Mass Produced Evangelions, she had no issue in effectively wielding
      their spears, despite the fact she had never once been trained in or used their
      weapons beforehand. Went on to outskill the nine Mass Produced Evangelions at
      once, all of whom were piloted by a Dummy System based on Kaworu Nagisa's thought
      patterns, and only lost to them after being struck with a replica Spear of Longinus.
      After preparing for the battle against Israfel, Asuka could move in perfect
      sync with Shinji, both in and outside of their Evangelions. This ultimately
      led to them defeating the aforementioned Angel in under a minute)
    source_ids:
    - vsbattles-asuka-langley-soryu-evangelion
    confidence: 0.75
    notes: auto_repair source extraction
