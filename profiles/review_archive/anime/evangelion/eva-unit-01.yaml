        \ (Sachiel's soul was deposited into a physical body by Adam immediately after\
        \ the events of \"Second Impact\" on 13th September 2000) Gender: Unknown\
        \ Classification: Angel/Apostle, Child of Adam Powers and Abilities: Angel\
        \ Physiology (Humanoid), Large Size (Type 1 - Comparable in size to Eva Unit-01),\
        \ Pseudo-Flight (Sachiel is shown using his A.T. Field to lift himself off\
        \ of the ground), Body Control (Capable of projecting Spears of Light from\
        \ his forearms. Can increase the musculature of his arms, and wrap around\
        \ his opponents like a ball) Attack Potency: Mountain level (Broke Unit-01's\
        \ arm and later managed to punch through its head), Large Mountain level with\
        \ A.T. Field (A.T. Fields can be used offensively to bypass those of others)\
        \ Speed: Superhuman movement with FTL combat speed, attack speed and reactions\
        \ (Managed to react to a Berserk Unit-01, and even blitzed them with the optic\
        \ blasts, who is superior to Base Unit-01, who was able to react to Israfel's\
        \ optic blasts) Lifting Strength: Class M (Sachiel can casually lift an Evangelion\
        \ Unit above its own height). Striking Strength: Mountain level Durability:\
        \ Mountain level. Large Mountain level with A.T. Field (Withstood a direct\
        \ N2 mine detonation) Stamina: Infinite (S\xB2 Engines provide limitless motive\
        \ energy) Range: Tens of Meters via sheer size, Hundreds of Meters with optic\
        \ blasts, Tens of Kilometers with the \"Cruciform Explosions\". Standard Equipment:\
        \ Nothing notable. Intelligence: Sachiel is not portrayed as having particularly\
        \ exceptional intelligence among the Angels, using brute force and energy-attacks\
        \ in order to breach \"Tokyo-3\". However, it does seem to not operate entirely\
        \ on pure instinct: it appears to show a morbid curiosity for the futility\
        \ of the JSSDF's assault on occasion, even taking out individual targets and\
        \ prolonging the useless defense. At the same time, prior to the \"N\xB2 Weapon\"\
        \ explosion, The \"Angel of Water\" also appeared to avoid combat situations\
        \ as much as possible, attempting to flee from the JSSDF forces multiple times.\
        \ It also demonstrates adaptability when it evolves its body and develops\
        \ a second face, along with a new technique, following the \"N\xB2 Weapon\"\
        \ explosion. Angels are stated in supplementary material to be capable of\
        \ learning. Weaknesses: Sachiel has a particularly slow regenerative process:\
        \ just 18% of lost biomass requires several hours to recover. The \"core\"\
        \ of an Angel, once breached, means the absolute certainty of death for the\
        \ Angel involved. Notable Attacks/Techniques (S\xB2 = Super Solenoid Engine;\
        \ also known as the \"Fruit of Life\"): An elusive double-helical organ, traditionally\
        \ possessed by only Adam and its progeny, the Angels. This \"engine\" organ\
        \ is responsible for the perpetual energy supply that the Angels can utilize,\
        \ along with the vast majority of their exotic physiological powers (including\
        \ levitation, regeneration and energy-projection). Appears to be the key to\
        \ inverting \"A.T. Fields\" and projecting an \"Anti A.T. Field\" also, as\
        \ well as accessing the \"Dirac sea\" * A.T. Field: The intangible light of\
        \ the soul in the physical world, A.T. Fields are possessed by all living\
        \ beings on NGE-Earth and are one of the major aspects of the human psyche\
        \ that defines someone as \"individual\" and \"protect\" them from the intrusion\
        \ of another's feelings. However, the Evangelion Units and the Angels are\
        \ unique in the ability to generate A.T. Fields that are corporeal and occasionally\
        \ visible to the naked eye, possibly due to large amounts of innate energy\
        \ contained in their souls. Their \".T. Fields mostly function as a physical\
        \ defence: a forcefield consisting of concentric octagonal yellow lines. The\
        \ barrier is almost perfect, only being temporarily disrupted from its active\
        \ state by incredibly energetic weapons or erosion by another corporeal A.T.\
        \ Field that is superior in strength. If left alone after initial disruption,\
        \ the A.T. Field will revive its durability almost instantly as long as the\
