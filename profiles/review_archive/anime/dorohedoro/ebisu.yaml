    - field: weaknesses
      value: 'Most of his moves drain Heat, His insanity while making him hard to
        predict means he will make bad decisions like when he stopped one of his own
        men from stabbing Kiryu by getting stabbed himself Notable Attacks/Techniques:
        * Thug Style: The Thug Style is an unarmed fighting style where Majima fights
        using rough martial arts similar to typical street fighting. The Thug Style
        also has Majima using underhanded tactics in a fight such as poking an opponent''s
        eyes, kicking an opponent''s shins to trip them up, quickly striking the back
        of an opponent''s neck and snapping an opponent''s neck after getting behind
        them. * Breaker Style: The Breaker Style is an unarmed fighting style where
        Majima fights using breakdancing moves. * Slugger Style: The Slugger Style
        is a fighting style where Majima wields a metal baseball bat. Majima is able
        to wield his baseball bat either as a typical baseball bat, as a pair of Nunchaku
        or even as a stick that Majima can balance on so he can easily flip around.
        After some training, Majima is able to use his Slugger Style to wield Nunchaku,
        Kali Sticks, Poles, Tonfa and Kantanas better than he can in his other styles.
        * Mad Dog of Shimano Style: The Mad Dog of Shimano Style is a fighting style
        where Majima wields a dagger. Majima :* Eye Poke: The Eye Poke is a technique
        where Majima, in the middle of a punch combo, quickly pokes the opponent''s
        eyes with his hands, causing them to recoil and leaving them temporarily disoriented,
        leaving them open to a neck snap. :* Insight: Insight is the ability that
        allows Majima to detect if someone is holding a hidden weapon. From Majima''s
        perspective, he will see an opponent glowing yellow if they have a bladed
        weapon or red if they have a firearm. :* Frantic Throw: Frantic Throw is a
        technique where Majima, after getting grabbed by an enemy, can quickly get
        out of the throw before delivering a high kick to the opponent''s head. :*
        Harsh Lesson: Harsh Lesson is a technique where Majima counters an opponent''s
        attack by grabbing their arm and pulling them past him before delivering a
        quick chop to the back of the opponent''s neck. ::* Secret of the Strut (Elbow):
