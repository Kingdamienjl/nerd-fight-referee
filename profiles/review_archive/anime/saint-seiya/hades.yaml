    - field: weaknesses
      value: 'Hades is particularly vulnerable if he''s in the body of a human. The
        Light of the Heavens, which brings Hope to humanity, can bring severe damage
        to his body Feats: Toggle *Created a barrier that rendered his enemies nearly
        if not completely powerless. *Rearranged the solar system with a thought from
        a cross-universal distance with his TK. *In the body of his host, and without
        his Surplice, he is superior to the likes of Thanatos and Hypnos who could
        kill people with thoughts across time and space. *Master of all life Hades''s
        presence instantly kills everything within his vicinity and rejects all forms
        of life. *In his true form, he could create Hell/Hades, The Hyperdimension,
        and the Elysium Fields. These are part of the Greek Underworld, which resides
        outside the Universe''s Space-Time and maintains them through his Divine Will.
        The Hyperdimension is the size of a universe, containing countless galaxies,
        and Elysium are said to be infinite. Hell/Hades is likely comparable in size.
        Notable Attacks/Techniques: * Greatest Eclipse: Through his Divine Will, Hades
        has all the Solar System''s planets shift their positioning at incredible
        speeds until all eventually form a perfect alignment. On Earth, the moon slowly
        covers the Sun in an Eclipse that can be simultaneously observed from all
        places on the planet. Merely gazing at the event shatters the hopes in mortal
        souls, and the shadows that cover the surface bring despair to all. Once the
        Eclipse is over, the world will be covered by darkness and humanity will suffer
        a slow and painful death. * Divine Curse: Through his sword, his lingering
        hate could inflict a spiritual wound (shaped as his sword, invisible except
        to Gods) that blocks the life and power of his enemy, and induces a coma.
        Eventually causes death through the sword slowly moving into the body of the
        victim. It was used against God Saint Seiya so he would never reincarnate
        again. Even after the death of Hades, it''s hard to remove other Olympian
        gods, prompting Athena to attempt to change history to save him. Note: Most
        of his feats were done when he was not in his actual body. Furthermore, we
        have yet to know whether or not he actually used his Kamui as such his upper
        limits remain unknown. ==Gallery== center|540px {{Quote|Oh, humans... You
        are always acting madly on impulse in the face of despair, with no regard
        for your strengths and limitations. Now, no longer satiated with the Earth
        bestowed upon you by the Gods, you attempt to claim the universe so you may
        taint it as well. And beyond all that... You dare defy the Gods themselves
        when instead you ought to accept and bow to our Will... But now that you have
        abandoned even the feeling of devotion, I declare that you are not merely
        foolish but rather beings worthy of pity.|Hades, upon facing Seiya}} center|540px
        {{Quote|I-It can''t be... I who have absolute power over death... I who am
        a God... How can I lay defeated within the realm of the dead? ... I don''t
        believe, I can''t'' believe! ... But... If I die, then this Underworld, created
        by me, shall too reach its end. Hell, The Elysium Fields... Everything...
        A-Athena, you too shall be wrapped in this world''s destruction and will certainly
        perish alongside me... And this will mean that humans won''t have achieved
        a true victory... Heh... Athena, you who are a Goddess, when will you realize?
        This love of which you speak... Is naught but a hallucination created by the
        minds of humans... In reality, no one truly believes in this intangible, eternal
        love... No one does!|Hades, as he is dying}} ==Notable Matchups== Victories:
