        \ of Repair, Conceptual Manipulation (Concept Type 2 - Type 3 Negation - At\
        \ least Mid-High - All negators either negate their own rule or negate the\
        \ rule of others.Undead Unluck: Chapter 3 Rip's ability is the negation of\
        \ repair which negates any and all healing techniques applied to wounds he\
        \ inflicts, working on Ruin's UnruinUndead Unluck: Chapter 107 and Andy. This\
        \ ability will not stop until he is deadUndead Unluck, Chapter 23. Furthermore,\
        \ gaining a better understanding of Unrepair causes any new learned ways to\
        \ heal get negated as wellUndead Unluck: Chapter 109. These rules are considered\
        \ fundamental or necessary and removal of them causes what they rule over\
        \ to be removed from the world such as insects being removed when Uma Insect\
        \ was killed, this is shown with others as well. For a more in depth detailing\
        \ refer to Uma pages like Seal), Limited Subjective Reality & Accelerated\
        \ Development (Training - Battle - Abilities - Andy states \"In the end, it's\
        \ all a matter of how we perceive the rules. So long as we believe in that\
        \ concept, our abilities will develop as much as we want\" what this means\
        \ for all Negators is that their own perception of their ability's use and\
        \ limits can be developed which allowed Andy to develop his Undead ability.\
        \ Victor also is stated that by consciously changing the interpretation of\
        \ death allows him a multifaceted use of his regeneration. This is also something\
        \ Billy says is \"sound logic\" meaning he too accepts this line of thinkingUndead\
