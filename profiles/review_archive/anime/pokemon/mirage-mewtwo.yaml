    \ Can turn into Data, Enhanced Senses, Elemental Manipulation (Of the Fire, Water,\
    \ Grass, Electric, Poison, Dark, Steel, Ground, Rock, Air, etc. variety), Statistics\
    \ Amplification (Passively when involving attack and accuracy, or in sunshine,\
    \ rain, sandstorms, inflicted with a status condition, and when health is low.\
    \ Active otherwise), Status Effect Inducement, Regeneration (Low-High), Teleportation,\
    \ Energy Absorption, Dimensional Travel, Telepathy, Telekinesis, Mind Manipulation,\
    \ Hellfire Manipulation, Time Travel, Reality Warping, Mind Control, Memory Manipulation,\
    \ Soul Manipulation, Intangibility, Forcefield Creation, Illusion Creation, Portal\
    \ Creation, Power Nullification, Absorption (Of fire, water, electricity, health,\
    \ bodies, souls, and life force), Time Stop, Energy Manipulation, Life Draining,\
    \ Magma Manipulation, Martial Arts, Body Control, Size Manipulation, Empathic\
    \ Manipulation, Healing, Stat Debuffing, Homing Attack, Dream Manipulation, Resistance\
    \ Negation, Immunity Negation, Transformation, Precognition (Can see the past,\
    \ the present and the future at the same time), Time Manipulation, Resistance\
    \ to every type sans Rock, Light Manipulation, Life Manipulation, Fear Manipulation,\
    \ Weather Manipulation, Sealing, Black Hole Creation, Hacking, Spatial Manipulation,\
    \ Absolute Zero, Genius Intelligence, Negation, Chi Manipulation, Flight, Sand\
    \ Manipulation, Resurrection, Invisibility, Sleep Manipulation, Extrasensory Perception,\
    \ Pocket Reality Manipulation, Dimensional BFR, Sound Manipulation, Immortality\
    \ (Types 1, 3, 7 and 8; Shares Mew's immortality, the immortality of ghost Pok\xE9\
    mon, the immortality of Deoxys, and reliant on the Mirage System), Self-Sustenance\
    \ (Types 1, 2 and likely 3), Reactive Evolution, Shapeshifting, Power Mimicry\
    \ (Can steal both, moves and passive abilities), Danmaku, Magnetism Manipulation,\
    \ Rage Power, Duplication, Berserk Mode, Afterimage Creation, Explosion Manipulation,\
    \ Gravity Manipulation, Attack Reflection, Aura, Pain Manipulation, Adaptation,\
    \ Petrification, Bone Manipulation, Acid Manipulation, Curse Manipulation, (Minor)\
    \ Probability Manipulation, Transmutation, Disease Manipulation, Magic, Cannot\
    \ be oneshot (Within reason), Immunity to Mind and Soul Manipulation due to lacking\
    \ them (As it is a mirage), Cannot be put to sleep, paralyzed, burned, frozen,\
    \ poisoned, confused, infatuated, have its stats lowered, have secondary effects\
    \ made to affect it, taunted, or made to flinch, Can passively force the opponent\
    \ to expend twice the energy, Statuses inflicted on it go right back to the user,\
    \ Physical contact does damage to the attacker, and can also force infatuation,\
    \ paralysis, burns, sleep, or poison, Movement restriction (Can step on shadows\
    \ and prevent the opponent from moving), Can prevent fleeing and teleporting,\
    \ Explosions can't happen around it, Cannot be hit by a non-Super Effective move,\
    \ It's smell can cause fainting or becalms fighting spirit (Muk and Meganium respectively),\
    \ Its body is 18000 degrees F\xB0, Can ensure all attacks to land, electric and\
    \ water based attacks heal him, fire based attacks boost his fire based attacks,\
    \ Feint bypasses shields and precognition, Immune to poison and acid based attacks."
