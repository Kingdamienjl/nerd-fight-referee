      value: Country level, likely Large Star level+ (Is repeatedly stated to be the
        strongest Intoner, which makes her superior to Four, who using the Power of
        Song, created a Titan out of Intoner Magic. Comparable to Level 2 Mikhail,
        who easily killed Three by swallowing her. Comparable to Mikhail, who even
        in his Stage 1 form and weakened by the curse that Two placed on him, was
        able to fight Watchers like Abdiel, and in his Stage 1 early in the game,
        was also able to defeat other Watchers like Phanuel, Armaros & Egrigori, who
        are of the same species as the Grotesqueries, where a single Grotesquerie
        can create a black hole of this magnitude). Up to Multiverse level+ with the
        Power of Song (The Power of Song allows the Intoners to contend against Dragons
        like Michael, who was stated to be the strongest Dragon at that time, with
        Zero specifically choosing him to destroy The Flower. This is further proven
        as when Mikhail, the reincarnation of Michael, was killed in Branch C, Zero
        went mad over the fact that no Dragon would be strong enough to kill her and
        prevent The Flower from destroying the world. 4 Intoners were able to use
        the Power of Song to create a shield strong enough to fully stop a blast from
        Michael) & Intoner Mode (Intoner Mode is the trump card of an Intoner, where
        only strong Dragons like Michael, Mikhail, Angelus and Legna would be strong
        enough to contend against it, and it should be on par with the New Breed).
        Will eventually become Multiverse level+ (After Zero absorbs her sisters,
        The Flower will eventually bloom from within her and encroach upon reality)
