        be killed as well through attacks from dragons or weapons created out of them.
        The resurrection function of The Flower takes a few seconds to generate a
        new body for Zero, and can be temporarily halted should The Flower get stabbed
        when it is in the middle of generating a new body. The Intoner Mode is directly
