- id: claim-weaknesses-44c1931b
  section: weaknesses
  axis: weakness
  text: 'Weak against Water type attacks, very weak against Fighting, and Ground type
    attacks | Weak against Fire, still weak against Fighting, and Ground type attacks
    but not as much. Aggron can only access their Mega Evolutionary stage through
    physical possession of a specific Mega Stone type that is uniquely attuned to
    that species and resonating the Stone with an accompanying Mega Ring (or similar
    device containing a Key Stone), which can only be constructed by artificial means:
    this excludes most wild specimens from harnessing the innate evolutionary potential,
    leaving only individuals in captivity as probable candidates for Mega Evolution.
    Mega Evolution is not a permanent transformation; specimens immediately revert
    back to their "base" forms once combat has been successfully concluded.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-1f071f31
  section: abilities
  axis: hax
  text: '*Sturdy: Aggron''s primary special ability. Aggron with this particular ability
    simply have even higher compositional durability than other members of the species
    that lack this attribute. *Rock Head: Aggron''s secondary special ability. Most
    Aggron have their rocky and metallic hybrid composition further enhanced with
    shock-absorbent structures, preventing any possibility of self-trauma from recoil
    of their more reckless physical attacks. *Heavy Metal: Aggron''s hidden (tertiary)
    special ability. A select few Aggron are composed of an unusually heavy metal
    alloy, doubling their weight (720 kilograms) compared to the average (360&nbsp;kg).
    *Filter: Mega Aggron''s sole special ability. As a result of the Mega Evolution,
    these Aggron have developed an anomalous characteristic within their metallic
    composition which automatically reduces the incoming energy output of techniques
    and abilities classified as "super effective" against Aggron physiology (such
    as fire and extreme heat in general) to much more tolerable levels; in optimum
    circumstances (i.e. against creatures or beings of comparable power to Mega Aggron),
    the output decrease is 25%.'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
