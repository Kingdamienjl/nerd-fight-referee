    - field: stamina
      value: Superhuman (Has an immensely high endurance and recovery speed. Capable
        of lasting in brawls for nearly a dozen hours with no rest. During his more
        serious fights, Luffy has suffered life-threatening injuries that gave him
        severe internal bleeding and damage to his organs, and he could continue fighting
        with only moderate lapses. He only stops fighting when it is physically impossible
        for him to even move. He took several strikes from Rob Lucci that affected
        all of his organs and left him in a large puddle of his own blood, yet he
        could stand back up shortly after and withstand the same attack immediately
        after. After the Marineford War, Luffy suffered from severe physical and mental
        trauma due to the loss of his brother, his life-threatening injuries, and
        having to use adrenaline-based drugs more than once to keep fighting, only
        to merely pass out and go on a rampage several hours later immediately after
        going through surgery, and being in perfect condition some time after. During
        his fight with Charlotte Katakuri, Luffy had only slept for a few hours for
        the last days, and was vomiting blood, barely conscious, and taking a beating,
        yet could continue fighting quite effectively, which surprised his opponent.
        He is capable of fighting for over 13 hours despite having suffering severe
        injuries all over his body and shrugging off a fatal injury that tore off
        one side of his torso. Able to persevere with highly lethal poison coursing
        through his veins and with grave wounds. His endurance can be nearly completely
        restored instantly if he eats meat. Despite dying during his battle with Kaidou,
        he was revived by his Gear 5th and was able to keep fighting, and even after
        taking many more hits from Kaidou and losing his Gear 5th form due to being
        on the verge of death, he managed to recover by beating his heart to the beat
        of a drum)
