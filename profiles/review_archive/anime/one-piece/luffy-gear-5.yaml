    - field: weaknesses
      value: "Standard Devil Fruit users weaknesses. Excessive usage of Gear 4th renders\
        \ Luffy unable to use Haki for 10 minutes. Gear 4th greatly increases Luffy's\
        \ metabolism, making his body burn calories much faster and greatly lowers\
        \ how long he can remain in combat. Gear 4th Tankman Full Version can only\
        \ be utilized when Luffy has consumed a sufficient amount of calories. However,\
        \ after improving his Haki in the Wano arc, he doesn't suffer the same drawback\
        \ when using Gear 4th, being able to activate and deactivate it at will without\
        \ suffering any notable toll and being capable of using his King Kong Gun\
        \ without losing too much stamina in the process. Notable Techniques: Gear\
        \ Second: Luffy pumps his blood rapidly with his legs to kick start the process\
        \ which in turn, increases the speed of his blood flow, thus providing more\
        \ oxygen and nutrients to various parts of his body which makes him faster\
        \ and much stronger. It uses even more oxygen and energy, hence using up more\
        \ food and he has to breathe harder. The increase in his metabolism causes\
        \ him to be hungrier than usual or even a paralytic type effect after a long\
        \ usage of it. Can be used to achieve a full body effect, or an effect on\
        \ any single area of his body (e.g. the arm). The techniques in this mode\
        \ are basically the same as the regular attacks, but greatly augmented by\
        \ his enhanced attack speed and, consequently, attack power. The known Gear\
        \ Second specific techniques are listed below. When he uses Gear Second in\
        \ conjunction with Armament Haki, his techniques receives the epithet \"Hawk\"\
        \ or \"Eagle\" added to the name of the attack. Gear Third: Luffy pumps air\
        \ through his bones to make them gigantic. This gives his arm more mass and\
        \ a larger area to attack with far greater strength. Previously Luffy turned\
        \ into a chibi form after canceling the technique but after the timeskip he\
        \ no longer shrinks in size. The techniques in this mode are basically the\
        \ same as the regular attacks, but greatly augmented by his increased mass\
        \ and power. Gear Fourth: In order to activate the technique, Luffy coats\
        \ his arm in Busoshoku Haki before biting into his forearm. Similar to how\
        \ he activates Gear Third, he blows an incredible amount of air into his body,\
        \ but this time he inflates his muscular structure before distributing the\
        \ air throughout his body, with emphasis on his upper half. Luffy's proportions\
        \ become warped and his body becomes much larger in size, with his arms, upper\
        \ torso, and legs coated in Armament Haki. The coating across his torso resemble\
        \ the wispy ends made from flames, giving it the appearance of tattoos, and\
        \ he also gains shading around the inner and outer edges of his eyes. Gear\
        \ Fourth also increases Luffy\u2019s metabolism. Once Gear Fourth reaches\
        \ its limit, it automatically deactivates and Luffy is left exhausted and\
        \ unable to use Haki for ten minutes. Even afterwards, Gear Fourth is extremely\
        \ taxing on Luffy's body and stamina. * Bounceman: Luffy's proportions become\
        \ warped and his body becomes much larger in size, with his arms, upper torso,\
        \ and legs coated in Armament Haki. In this form, Luffy is continuously emitting\
        \ steam in this form. As a side-effect, he is incapable of standing still\
        \ on the ground, and instead constantly bounces on the spot. While Luffy is\
        \ using Boundman, his physical strength and speed are increased whereas before,\
        \ Gear Second's lack of strength and Gear Third's lack of speed made them\
        \ ineffective individually. * Tankman: Luffy takes a form similar to Bound-Man,\
        \ but his torso is enlarged to the point where he basically looks like a Rubber-Ball.\
        \ This form focuses heavily on increasing his defenses and the harmonization\
        \ between his Haki and Gomu-Gomu powers. * Snakeman: Luffy takes a form similar\
        \ to Bound-Man, but he appears much skinnier, and this form focuses heavily\
        \ on the use of homing attacks and a dramatic increase in speed. Gear Fifth:\
