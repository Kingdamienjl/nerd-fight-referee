    - field: weaknesses
      value: 'Standard Devil Fruit users weaknesses. He leaves his body defenseless
        when he uses his astral projection. Notable Attacks/Techniques: Yomi Yomi
        no Mi (Revive-Revive Fruit or Underworld-Underworld Fruit): A Paramecia type
        Devil Fruit which enhances the user''s soul to the point where they can come
        back to life after dying once, remain alive until their body is sufficiently
        damaged, and to use several other soul-based abilities. The power that allows
        him to live in the human world is not organs nor muscles: it is his soul.
        *Astral Projection: A new ability Brook demonstrated after the time skip.
        Brook is able to separate his body and soul, and move his soul everywhere
        he wants to, even through walls. When Brook is in Spectral form he both visible
        and audible to people. It is currently unknown as to how far the extent can
        Brook maintain this separation of his soul from his body. *Soul Energy: After
        two years of training, Brook has mastered the use of this Devil Fruit to the
        extent of knowing its true nature. He reveals that in order for his soul to
        remain here in this world, it produces a unique and powerful energy that is
        almost physical in form. He has also mastered the energy his soul emits to
        the extent that he can reattach his bones by using this energy such as when
        he is beheaded he then attaches his head back with the help of it. *Chills
        of the Underworld: Through his soul, Brook is able to summon the very cold
        of the underworld, which he utilizes in conjunction with his sword, Soul Solid,
        to generate freezing attacks. Music: Brook''s devotion to music not only helped
        him to pass the lonely days during his long isolation but also serves as a
        combat tool. *Nemuriuta Flanc (Lullaby Parry): Brook swipes his weapon over
        his violin like a fiddle and plays a soothing melody which makes his opponents
        fall asleep. *Party Music: Brook uses his music to hypnotize his opponents
        into believing they are at a night festival. This way, his opponents not only
        drop their guards, but they are also made vulnerable to suggestions. Fencing
        Style: Brook uses an unnamed form of swordsmanship that resembles classical
        fencing. It specializes in speed and thrusting techniques. *Hanauta Sancho:
        Yahazu Giri (Three-Verse Humming: Arrow-Notch Slash): A high-speed technique
        where Brook swiftly cuts his opponent(s) as he approaches them and then re-sheats
        his blade. *Requiem la Banderole: Performed much the same as Yahazu Giri,
        except Brook executes a lateral slash against the opponent''s chest. *Aubade
        Coup Droit (Dawn Serenade: Right-Handed Strike): A ranged thrusting technique
        that creates a highly compressed blast of air. *Prelude: Au Fer (Prelude:
        After): A technique intended to disarm the opponent by destroying whatever
        weapon they might be wielding at close range. *Gavotte Bond en Avant (Gavotte:
        Leap Forward): A thrusting technique in which the user propels himself forward
        in order to strike an opponent. *Swallow Bond en Avant (Swallow Leap Forward):
        An aerial version of Gavotte Bond en Avant. *Polka Remise (Polka Continuation):
        A combination technique in which the user delivers several consecutive thrusts
        against the opponent. *Quinte Tierce Fantasia (Fifth Parry and Third Parry
        Fantasy): Typically used in conjunction with Party Music, Brook uses a swift
        draw-and-sheathing technique while his opponents are still under the influence
        of the hypnotic nature of the musical technique. *Kasuriuta: Fubuki Giri (Pastoral
        Song: Blizzard Slash): Combining Hanauta Sancho: Yahazu Giri and his Devil
        Fruit ability, Brook does the same thing Yahazu Giri does but he sheaths his
        sword from top to bottom and the streak mark he creates with his "chilled"
        sword freezes the opponent''s blood. thumb|center|400px|Kasuriuta: Fubuki
        Giri (Pastoral Song: Blizzard Slash) *Winds of Hades: Brook uses his Soul
        Solid in conjunction with his Devil Fruit ability to fire freezing winds at
        his opponent. ==Gallery== One Piece Soul King Brook New World English Dub
        Brook Post TS.png Brook by_bodskih-dbcd5jq.png Brook by bodskih-dbcd52t.png|Brook
        when he was human ==Notable Matchups== Victories: Madara Uchiha (Naruto) Madara''s
        Profile (Alive Madara and Onigashima Raid Brook were used, speed was equal,
        Sunano''o was restricted, battle location was Konoha 20 meters apart from
        each other) Charlotte Perospero (One Piece) Perospero''s Profile (Battle was
        in Minecraft''s infinite Superflat world) Ulti (One Piece) Ulti''s Profile
        (Battle was in Minecraft''s infinite Superflat world) Losses: Vivica (Miraculous:
        Tales of Ladybug & Cat Noir) Vivica''s profile (Pre-Timeskip Brook and Desperada
        were used. Speed was equalized) Inconclusive: Sans (Undertale) Sans'' Profile
