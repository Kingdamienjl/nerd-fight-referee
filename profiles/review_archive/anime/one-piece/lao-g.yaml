        and orientation of the objects inside. Anything caught within the path of
        Law's sword-swing is spatially displaced), Telekinesis (Can telekinetically
        manipulate any object and anyone he cuts within his room), Biological Manipulation
        (He can seemingly separate an opponent's limb from their body while keeping
        the connection intact [feeling, nerves, muscle movements, etc], but this allows
        Law to freely control the severed pieces from an object or person while doing
        no harm to it. He can however choose to damage these severed objects with
        physical strikes or offensive abilities, or attach them to walls or other
        objects as a means to incapacitate his opponent), Power Nullification with
        Mes (The hearts that Law push out lose the ability to use a logia's innate
        transformation ability, making it to where anyone can make contact with them),
        Teleportation with Shambles (Can freely switch himself with any object or
        person in his Room, or any object with another object), Soul Manipulation
        (Can switch the souls and personalities of people inside his Room), Forcefield
        Creation with Curtain, Durability Negation with Gamma Knife, Regeneration
        Negation (Since his Spatial cutting doesn't damage physically, the opponent's
        regeneration is rendered useless. He's beaten people who could turn into smoke
        and gas), Electricity Manipulation with Counter Shock (Can generate electrical
        charges like a defibrillator), Enhanced Senses and Information Analysis with
        Scan (Can scan targets inside his ROOM using his fruit's energy and beaming
        it through the crowd, like an X-ray machine), Energy Projection and Radiation
        Manipulation with Gamma Knife and Radio Knife, Power Bestowal (Can give eternal
        life to another person, but only at the cost of his own life), Limited Size
        Manipulation and Intangibility via K-Room (Law can cover his sword in a sphere
        of energy, causing it to increase in size at will, at the same time it passes
        through any matter without dealing piercing damage), Damage Boost (The deeper
        his sword goes through the opponent's body in K-room, the greater is the damage
        applied to the opponent), Non-Physical Interaction (Damaged Misery by cutting
        her in half with a casual sword swing), Limited Sound Manipulation (Via R-Room
        - Able to completely mute anything inside his Room), Limited Vibration Manipulation
        (Seen as he affected Misery's entire giant body with a single sword swing,
        also shown in K-room explosions), Resistance to Diseases, Madness Manipulation,
        Mind Manipulation and Soul Manipulation via Willpower (Through sheer willpower
        they can resist losing their mind when absorbing shadows through the Kage
        Kage no Mi. Shadows belonging to strong willed people are difficult to control,
        allowing them to rebel against Moria's pact which usually immediately submits
        a shadow to his supremacy and orders. Spiritual energy is contained within
        one's soul/life; this energy is represented by the fighting power or the Haki
