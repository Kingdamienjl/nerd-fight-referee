        \ wastelands Notable Attacks/Techniques: Suna Suna no Mi (Sand-Sand Fruit):\
        \ A Logia-type Devil Fruit, eaten by Crocodile, allowing him to become, generate\
        \ and manipulate sand. It also allows the user to control quicksand, sandstorms\
        \ and the absorption of liquids. This fruit allows Crocodile to sense anything\
        \ that is moving through sand (he uses his power to sense underground rivers).\
        \ Crocodile has shown to create sand blades that can slice through the ground,\
        \ create sandstorms, quick sands, and cause dehydration by physical contact.\
        \ In addition, Crocodile has shown to transform his arm into sand in order\
        \ to extend his reach for his hook, as a long-range capture and strike. He\
        \ can also suck all the moisture out of any object, living or non-living,\
        \ by placing his right hand on them. This ability allows him to utterly destroy\
        \ his surroundings and killing all organic lifeforms via dehydration. *Desert\
        \ Spada (Treasured Sword of Desert): Crocodile forms his right hand into a\
        \ loose blade of fast-moving sand and then stabs it into the ground, extending\
        \ it along the ground like a torpedo, splitting anything in its path, including\
        \ the very ground itself, through extreme and focused erosion, created by\
        \ the sand blade. *Desert la Spada (Adamant Treasure Sword of Desert): An\
        \ altered version of Desert Spada. Crocodile now forms several solid blades\
        \ with fan-shaped edges instead of one large blade made from sand. *Desert\
        \ Girasole (Desert Sunflower): Crocodile creates a loose sand blade from his\
        \ right hand with Desert Spada. Like Desert Spada, He stabs it into the ground\
        \ causing an area in front of him to collapse. However, a giant pit of quicksand\
        \ will be formed instead, with the sand being taking away by underground rivers\
        \ (which he can detect). Anything caught in the pit will be sucked in and\
        \ buried alive. This attack can only be done in a desert terrain. *Barchan\
        \ (Crescent-Shaped Dune): Crocodile swings his right arm forward while leaving\
        \ a crescent shaped trail of sand behind it. Anything hit by that trail is\
        \ instantly robbed of all moisture because of Crocodile's dehydration ability.\
        \ *Desert Encierro (Desert Prison): Crocodile grabs someone with his right\
        \ hand, then slowly or quickly drains the moisture from them with his dehydration\
        \ ability. This leaves them in a withered and seemingly fleshless state. *Sables\
        \ (Sandstorm): Crocodile summons a massive tornado of sand and sends it on\
        \ a rampage. Once this sandstorm grows large enough, not even he can stop\
        \ it. He can also make a sandstorm that can suck the water out of living things\
        \ and is apparently able to crack steel. Another usage is to send people flying\
        \ with this technique. In deserts, it can cross the length of a small country\
        \ and many of them in succession over a period of time can bury an entire\
