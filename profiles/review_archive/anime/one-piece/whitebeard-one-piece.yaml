    - field: intelligence
      value: Gifted (Whitebeard is the pirate closest to obtaining the "One Piece"
        treasure in the entire world, and along with a couple of decades' worth of
        experience, is the single most-dangerous pirate in his world. He has sufficient
        leadership qualities to oversee a last-minute invasion of Marineford, an incredibly
        skilled military strategist, and a match for Sengoku the Buddha. His tactical
        prowess was demonstrated when he scattered the pirates so that they wouldn't
        be routed by Pacifista, or when he bypassed the siege wall. Has mastered the
        use of the Gura Gura no Mi)
      source_id: vsbattles-whitebeard-one-piece
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Standard Devil Fruit users weaknesses. | Same as before. Has been weakened\
        \ by age, with his sickness getting worse over time. | Same as before. His\
        \ old age has severely weakened him, as he's seriously ill and has heart issues.\
        \ He's also a static fighter and doesn't usually dodge incoming attacks from\
        \ opponents. Notable Attacks/Techniques: Haki: There are normally two types\
        \ of Haki regular people can tap into: Kenbunshoku Haki, which allows individuals\
        \ to sense the presence of others, and Bus\u014Dshoku Haki, which allows individuals\
        \ to create an invisible armor around them. There is, however, a third type\
        \ of Haki, Ha\u014Dshoku Haki, that only a few individuals can use. Whitebeard\
        \ is one of these people. *Ha\u014Dshoku Haki (Color of the Conquering King):\
        \ Newgate's level of proficiency with this Haki was displayed during his fight\
        \ against Gol D. Roger 28 years before the current events. They created a\
        \ massive shockwave that engulfed the island they were fighting in when they\
        \ produced a Clash between their Conqueror's Haki's. *Bus\u014Dshoku Haki\
        \ (Color of Armaments): His level with this Haki was high enough to imbue\
        \ his Murakumogiri with it, displaying the ability to use Goken's basic level\
        \ when he clashed swords with Roger without touching each other's blade. *Kenbunshoku\
        \ Haki (Color of Observation or Mantra): Whitebeard's proficiency with this\
        \ type of Haki is notable. Being able to react to attacks from some of the\
        \ fastest characters in the world proves that he was, at the very least, very\
        \ proficient with it. In his youth Newgate felt Oden's presence from far away\
        \ and could tell how strong he was even before their blades made contact.\
        \ Even in his old age, he could prevent an attempted assassinated by Ace while\
        \ sleeping, attacking him before he could land a hit. Could detect attacks\
        \ coming from behind or sideways. Gura Gura no Mi (Tremor-Tremor Fruit): Whitebeard\
        \ ate the Tremor-Tremor Fruit, turning him into a \"Tremor Human\" that can\
        \ create incredibly powerful shockwaves through virtually any medium, including\
        \ air, land, and the seafloor. frame|center|Whitebeard laying the smackdown\
        \ on Akainu. *Kaishin: Whitebeard swings his arm (or arms) and literally cracks\
        \ the air itself, sending devastating shock waves through the air in the direction\
        \ it is facing. These shock waves are able to pass through and damage almost\
        \ any substance, literally tearing it apart. The shock waves can also be sent\
        \ into the sea, generating huge tsunamis, and can be used in conjunction with\
        \ physical attacks in close-quarters combat - as Akainu can attest. This attack\
        \ was so powerful, that the combined Busoshoku Haki of all three Admirals\
        \ was needed to nullify it. **Gekishin: A close range version of Kaishin,\
        \ causing severe damage to even giants and an admiral. He can also passively\
        \ generate vibrations around himself to ward off attacks like Aokiji's freezing\
        \ mist. *Kabutowari: Whitebeard converges quakes into a sphere of focused\
        \ power around his fist, effectively harnessing his terrible destructive power\
        \ into a pinpoint attack he can use in close-quarters combat while avoiding\
        \ collateral damage (evident when Moby Dick's deck didn't suffer a single\
        \ dent when he crushes Lonz's head with a quake bubble against it). *Naginata\
        \ Rasetsu: Whitebeard surrounds his bisento with the same bubble to greatly\
        \ increase its striking power and range. *Shima Yurashi: Whitebeard grips\
        \ the air as if it were tangible and pulls on it, releasing a massive shockwave\
        \ that, even in his old age, was powerful enough to tilt all of Marineford\
        \ despite its reinforcements along with the seas that Aokiji had frozen. *Quake-Explosion:\
        \ Similar to his quake bubble, Whitebeard focuses his quake power around in\
        \ a sphere of focused power, with the difference being that he then sends\
        \ it forward and releases it in an explosion-like quake. Notes: The discrepancy\
        \ between his epithet in English and his appearance is due to the fact that\
        \ the Japanese language only has one word for facial hair. ==Notable Matchups==\
        \ Victories: *Obito Uchiha (Naruto) Obito's profile (\"Marineford\" Whitebeard\
        \ and \"J\u016Bbi Jinch\u016Briki\" Obito were being used. Speed was Equalized)\
        \ *Monkey D. Garp (One Piece) Garp's Profile (Marineford Whitebeard and Current\
        \ Garp were used. Both were bloodlusted) *Monkey D. Luffy (One Piece) Luffy's\
        \ Profile (Old Whitebeard and Wano; Act 2 Luffy were used) *Blackbeard (One\
        \ Piece) Blackbeard's Profile (Prime Whitebeard and Post-Timeskip Teach were\
        \ used) *Sanji (One Piece) Sanji's Profile (Post Vinsmoke Awakening Sanji\
        \ and Whitebeard's \"Old\" key were used) Losses: *Big Mom (One Piece) Big\
        \ Mom's Profile (Old Whitebeard was used) Inconclusive: *Dracule Mihawk (One\
        \ Piece) Mihawk's Profile (Old Whitebeard was used) *Monkey D. Luffy (One\
        \ Piece) Luffy's Profile (Prime Whitebeard and Raid on Onigashima Luffy were\
        \ used, and Luffy had access to Gear 5th) ==References== {{scroll box|content={{reflist|2}}}}\
        \ ==Notes and Explanations== {{Discussions|Whitebeard|Whitebeard}} Category:Characters\
        \ Category:One Piece"
