    - field: weaknesses
      value: "Sanji refuses to use his hands and knives in battle except under special\
        \ circumstances. He is a lecher and is often distracted by sufficiently attractive\
        \ females and refuses to violently hit any woman for any reason, even if it\
        \ costs him his life. Notable Attacks/Techniques: Hide/Show |-|Regular Techniques=\
        \ Black Leg Style: A martial-arts style that was passed on to Sanji by his\
        \ mentor Zeff. It is designed to free the use of one's hands and prevent them\
        \ from being damaged during a battle, something that is disastrous to a chef\
        \ like Sanji or Zeff. As a fighting style, the style boasts a wide and impressive\
        \ array of kicks, coupled with super acrobatic skill making it a very versatile\
        \ fighting technique, allowing Sanji to effectively weave continuous and powerful\
        \ attacks upon adversaries. *Collier (Neck): A kick to the neck which Sanji\
        \ does it whilst still on the ground. **Collier Shoot (Neck Shoot): Sanji\
        \ jumps high into the air and lands a powerful kick to the opponent's neck.\
        \ *\xC9paule (Shoulder): A downward kick targeting the opponent's shoulder,\
        \ meant to knock them off balance or drive them into the ground. **\xC9paule\
        \ Shoot (Shoulder Meat Shoot): Sanji jumps into the air then brings his heel\
        \ down on the opponent's shoulder. *C\xF4telette (Rib): Dropping down into\
        \ a one-handed handstand position, Sanji kicks the opponent hard in the ribs,\
        \ this attack is usually followed by Selle. *S\xE9lle (Lower Back): Commonly\
        \ used as a combo attack with C\xF4telette, using the momentum from the C\xF4\
        telette attack Sanji (still in a handstand) spins around in the opposite direction\
        \ to deliver a fast kick to the opponent's lower back or lumbar region. *Poitrine\
        \ (Breast/Chest): A stabbing kick straight into the opponent's chest. *Poitrine\
        \ Shoot (Breast/Chest Shoot): A stronger version of Poitrine, except that\
        \ this time Sanji aims a little higher and kicks up instead of down. *Gigot\
        \ (Legs): Running at the opponent Sanji delivers a sweeping kick to the kneecaps,\
        \ the opponent is either send flying or slammed to the ground as a result.\
        \ *Mouton Shot (Sheep Shot): One of Sanji's strongest single kicks, and a\
        \ common finishing move. He starts by jumping or flipping into the air and\
        \ then channels all his might into one leg to deliver a kick to the opponent's\
        \ mid-section, or sometimes their head, that sends them flying. *Reception:\
        \ Sanji lifts one of his legs high and hooks his foot around the opponent's\
        \ neck, then uses that leg to smash the opponent's face into the ground hard.\
        \ *Anti-Manner Kick Course (Behavior Antithesis Kick Course): Thought to be\
        \ Sanji's strongest single kick attack, he gathers all the power he can muster\
        \ and delivers a massive vertical kick by lifting one of his legs a full 180\
        \ degrees in the air. This attack is usually aimed at the very center of the\
        \ opponent's torso (front or back). *Bas C\xF4te (Shoulder Roast): A mid-air\
        \ attack, Sanji kicks one leg straight forward to attack the opponent while\
        \ kicking the other one backwards to provide the necessary momentum. *Longe:\
        \ A sweeping kick, usually performed from the back targeting the opponent's\
        \ back, very useful for sending an opponent flying in preparation for another\
        \ kick. *Tendron (Collar): A straight on side kick targeting the middle area\
        \ of the opponent's collar bone. This attack forms part of the Bas C\xF4te,\
        \ Longe, Tendron, Flanchet, Quasi, Queue, Cuisseau, Jarret, Veau Shot combo.\
        \ *Flanchet (Stomach/Belly): A simple kick to the opponent's stomach. First\
        \ used against Mr. 2. This attack forms part of the Bas C\xF4te, Longe, Tendron,\
        \ Flanchet, Quasi, Queue, Cuisseau, Jarret, Veau Shot combo. **Flanchet Shoot\
        \ (Belly Shoot): Sanji kicks the opponent with a head on snap kick. \"Flanchet\"\
        \ is French for \"stomach\". *Quasi (Rump): Sanji flips over into a double-handed\
        \ handstand, spins around and kicks the opponent. This attack is usually followed\
        \ by Queue. This attack forms part of the Bas C\xF4te, Longe, Tendron, Flanchet,\
        \ Quasi, Queue, Cuisseau, Jarret, Veau Shot combo. *Queue (Tail): Commonly\
        \ used as a combo attack with Quasi, Sanji continues spinning with the momentum\
        \ from Quasi and swings his other leg around to kick the opponent's tail bone.\
        \ This attack forms part of the Bas C\xF4te, Longe, Tendron, Flanchet, Quasi,\
        \ Queue, Cuisseau, Jarret, Veau Shot combo. *Cuisseau (Thigh): Often used\
        \ right before or after Jarret, Sanji sends a hard kick to the opponent's\
        \ thigh. This can be used to attack or block an incoming kick. This is called\
        \ Cuisseau Crusher in the Viz Manga and Turkey Tenderizer in the 4Kids dub,\
        \ but it keeps its original name in the FUNimation dub. First used against\
        \ Mr. 2. This attack forms part of the Bas C\xF4te, Longe, Tendron, Flanchet,\
        \ Quasi, Queue, Cuisseau, Jarret, Veau Shot combo. **Cuisseau Shoot (Thigh\
        \ Shoot): A hard kick to the thigh that sends the opponent flying. *Jarret\
        \ (Shin): Often used right before or after Cuisseau, Sanji sends a hard kick\
        \ to the opponent's shin. This can be used to attack or block an incoming\
        \ kick. This attack forms part of the Bas C\xF4te, Longe, T"
