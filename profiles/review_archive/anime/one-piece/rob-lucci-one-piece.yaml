  attack_potency:
    text: Island level (Stated to be the strongest member in the history of CP9, which
      makes him stronger than Kaku, Jabra, Blueno, and the othersOne Piece Vol. 44
      Chapter 422. When his Doriki was measured by Fukurou, he was given a 4000, while
      the other members ranged from 630 to 2200One Piece Vol. 40 Chapter 379. Equally
      matched Base Luffy's raw strengthOne Piece Vol. 42 Chapter 4099.36 Gigatons),
      higher with Rokushiki (Far superior to the Rokushiki of the weaker membersOne
      Piece Vol. 39 Chapter 373. Matched Luffy's Gum Gum Bazooka with a weaker attackOne
      Piece Vol. 43 Chapter 41018.7 Gigatons) far higher in Hybrid Form (Fought Gear
      2nd Luffy for an extended period of timeOne Piece Vol. 44 Chapter 425), even
      higher with Hybrid Rokushiki, his Six King Pistol can bypass durability by targeting
      the organs | Moon level (Stussy admitted to being inferior to himOne Piece Vol.
      106 Chapter 1073. Oneshot Stussy with a Finger PistolOne Piece Vol. 108 Chapter
      1091. Was considered by Shaka to be an elite unit alongside Stussy, Kaku, and
      the SeraphimOne Piece Vol. 106 Chapter 1072. Destroyed several Sea Beast weaponsOne
      Piece Vol. 106 Chapter 1067One Piece Vol. 107 Chapter 1068. Should be superior
      to Base Kaku188.362 Exatons), Small Planet level in Hybrid Form (Effortlessly
      one-shot Atlas. Matched Gear 4th Luffy's Kong Gun, sending S-Bear flying together
      with himOne Piece Vol. 106 Chapter 10763.014 Zettatons), far higher with Awakening
      (Much stronger than his hybrid stateOne Piece Road to Laugh Tale Vol. 3. Stated
      to be tough by Zoro and was able to successfully stall him, although the latter
      holding back on unleashing more HakiOne Piece Vol. 109 Chapter 1107), even higher
      with Rokushiki (Disarmed Enma from Zoro's grasp with his Hand Pistol Spots technique3.014
      Zettatons) or Armament Haki (Clashed with Gear 5th LuffyOne Piece Vol. 106 Chapter
      1069 before quickly getting overwhelmed moments laterOne Piece Vol. 106 Chapter
      1070. Fought Zoro while he was unleashing EnmaOne Piece Vol. 108 Chapter 1093
      for an extended period of timeOne Piece Vol. 109 Chapter 1105)
    source_ids:
    - mediawiki-rob-lucci-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'At least Relativistic (Far faster than the rest of CP9, which includes
      Kalifa, Jabra, Kaku, and the others. Outsped Post-Skypiea Luffy and dodged an
      attack from Franky), higher with Soru (Went FTE to Post-Skypiea Luffy, and outsped
      and blitzed Enies Lobby Luffy), Relativistic+ in Hybrid Form (Even faster than
      in base and can change his form with Life Return to increase his speed even
      further, kept up with Gear 2nd Luffy before he slowed down), even higher with
      Soru and Kamisori | FTL (Should be superior to Base Kaku. Kept up with a casual
      attack from Zoro. Reacted to S-Hawk''s flying slash coming his way3.349c), higher
      in Hybrid Form (Dodged S-Bear''s Ursa Shock despite being in chains moments
      before it landed and tagged him with Six King Pistol. Kept pace with Gear 4th:
      Boundman Luffy and matched the speed of his Kong Organ Gun with his own Hand
      Pistol Yellow LotusOne Piece Vol. 107 Chapter 1077), FTL+ with Awakening (Inferior
      to Gear 5th Luffy in speed, but could counter and react to a few of his attacks.
      Him and Luffy were remarked to have astonishing speed during their fight by
      Shaka13.396c), higher with Shave and Finger Pistol techniques (Dodged an attack
      from Gear 5th Luffy with Shave. Landed a Hand Pistol on Sentomaru13.396c)'
    source_ids:
    - mediawiki-rob-lucci-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
