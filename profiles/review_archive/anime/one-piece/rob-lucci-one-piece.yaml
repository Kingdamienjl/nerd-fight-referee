  durability:
    text: Island level (More durable than the other members of CP9. Completely unphased
      from a barrage of punches from a struggling Water 7 Luffy, and he blocked a
      kick from an enraged kick from Water 7 Sanji, He withstood a punch to the face
      from Gear 2nd Luffy, though this still visibly injured him and sent him flying
      a fair distance), higher with Tekkai (Tanked a Gomu Gomu no Gatling Gun from
      Luffy and a punch from Franky), far higher in Hybrid Form (Took numerous attacks
      from Gear 2nd Luffy with minimal damage despite Gear 2nd being capable of thrashing
      Lucci in his Base Form), even higher with Hybrid Tekkai (Although he was nearly
      defeated by it, he could take a punch from Gear 3rd Luffy and remain conscious
      enough to fight him in Gear 2nd again) | Moon level (Should be at least as durable
      as Kaku, who withstood being hit by the Frontier Dome's laser defense at 72%
      power. Stussy needed to use sea prism stone to weaken Lucci in order to incapacitate
      him188.362 Exatons), Small Planet level in Hybrid Form (As a physical fighter,
      he can withstand the force of his own physical attacks3.014 Zettatons), far
      higher with Awakening (Fought against Enma unleashed Zoro for an extended period
      of time, taking several attacks from him without going down. Could take a few
      attacks from Gear 5th Luffy before eventually losing), even higher with Armament
      Haki (Withstood clashing against Gear 5 Luffy's Armament Haki)
    source_ids:
    - mediawiki-rob-lucci-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Can fight for a long time and take lots of damage without becoming
      exhausted. Trained as an assassin and special fighting force since childhood.
      Didn't even flinch upon taking canon-fire to his back, which resulted in him
      receiving large permanent burn scars), higher as a Zoan Devil Fruit User (Zoan
      Devil Fruit users are hailed for their ability to recover very quickly. It took
      all of Luffy's energy to permanently incapacitate Lucci in his Zoan form, and
      left the former incapacitated before the latter fell), even higher with Awakening
      (Awakened Zoan Devil Fruit users have even greater stamina and recovery than
      normal Zoan Devil Fruit users. Lucci in his Awakened Form managed to fight against
      Gear 5th Luffy for a period of time and, despite losing and being temporarily
      incapacitated, later emerged with only minor injuries and little exhaustion
      shortly afterwards)
    source_ids:
    - mediawiki-rob-lucci-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Extended Melee Range in Zoan Form, Tens of Meters
      with Tobu Shigan Bachi, up to Hundreds of Meters with Rankyaku (Brings down
      the Galley La headquarters building with a casual swipe of his leg)
    source_ids:
    - mediawiki-rob-lucci-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted. A Master of martial arts and killing techniques (and was even viewed
      as a "genius" among Cipher Pol 9 agents, according to Who's-Who), competent
      battle strategist, good at figuring out plans and motivations of his enemies,
      knowledgeable about Devil Fruits, skilled shipwright (enough to become a foreman
      in a world-famous boatyard), a sawyer, tree nail, and bolt specialist.
    source_ids:
    - mediawiki-rob-lucci-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
