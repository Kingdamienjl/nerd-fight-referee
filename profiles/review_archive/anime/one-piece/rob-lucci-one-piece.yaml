        users gain the senses of their respective animal), Limited Biological Manipulation
        via Seimei Kikan, Air Manipulation (Via Rankyaku and Flying Shigan), Transformation
        and Bodily Weaponry (Ate the Neko Neko no Mi, Model: Leopard, a Zoan-type
        Devil Fruit which allows him to transform into a leopard and a giant leopard-human
        hybrid), Attack Reflection (via Tekkai: Utsugi), Minor Durability Negation
        (via Rokuogan), Haki (Kenbunshoku, Busoshoku), Resistance to Animal Manipulation
