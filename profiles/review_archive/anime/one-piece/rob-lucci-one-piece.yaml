  tier:
    text: '{{6-C}}, higher with Rokushiki, far higher in Hybrid Form, even higher
      with Hybrid Rokushiki | {{5-C}}, {{Low 5-B}} in Hybrid Form, far higher with
      Awakening, even higher with Rokushiki or Armament Haki'
