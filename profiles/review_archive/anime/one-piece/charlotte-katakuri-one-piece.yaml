    - field: attack_potency
      value: 'Large Island level (As "the perfect man," Katakuri is considered to
        be the Charlotte family''s greatest masterpieceOne Piece Vol. 88 Chapter 882
        and the strongest of the 3 Sweet CommandersOne Piece Vol. 87 Chapter 879,
        making him far superior to Cracker and Smoothie), up to Country level with
        Edged Mochi (Could harm Luffy through his Armament Haki defense, to the point
        to cause him pain when clashing. Clashed with Gear 4th: Snakeman Luffy, overcoming
        his Haki defense throughout the battleOne Piece Vol. 89 Chapter 89517.25 Teratons)
        and Awakening (Dealt severe damage to Gear 4th: Boundman LuffyOne Piece Vol.
        88 Chapter 884 with his Power Mochi fistsOne Piece Vol. 88 Chapter 885. Could
        harm Luffy through his Armament Haki defenseOne Piece Vol. 89 Chapter 894),
        higher with Buzz Cut Mochi (Knocked Gear 4th: Snakeman Luffy out for 10 minutes
        after hitting him with it twiceOne Piece Vol. 89 Chapter 896)'
      source_id: mediawiki-charlotte-katakuri-one-piece
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: 'FTL (Faster than Gear 2nd Luffy and can keep up with Snakeman Luffy),
        higher with Buzz Cut Mochi (Blitzed Gear 4th: Snakeman Luffy''s Jet Culverin.
        Luffy had to resort to his fastest technique - King Cobra - in order to pull
        of a dual-exchange), far higher reactions with Future Sight (Intercepted Gear
        4th: Boundman Luffy''s Kong Gun and Rhino Schneider before they could hit
        him. Viewed Snakeman Luffy''s attacks as moving in slow motion as he dodged
        them. Activated Armament Haki to protect himself from Luffy''s Black Mamba
        technique and effortlessly weaved through his barrage)'
      source_id: mediawiki-charlotte-katakuri-one-piece
      provider_id: vsbattles
