    - field: intelligence
      value: Gifted (Possesses a high level of fighting ability. Displays creative
        and effective ways to immediately turn a situation into his favor, such as
        using his power to make earplugs for him and his entire family while Big Mom's
        screams were causing everyone to be stunned. Or when he used his power to
        plug up Bege's cannons. He focuses on efficiency, aiming to destroy any possible
        threats before they can do anything. He was initially sensitive about his
        abnormal jaw and teeth and would become enraged should anyone mock him or
        call him a monster, but during his fight with Luffy, he began to embrace his
        monstrous appearance. He is very honorable when it comes to fighting opponents
        that make an impression on him, not tolerating an interference from his family
        that results him gaining an upper-hand against Luffy--leading him to impale
        himself in the side with his spear in order to equalize Luffy's handicap and
        went out of his way to KO his nearby allies for the interruption)
      source_id: mediawiki-charlotte-katakuri-one-piece
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Standard Devil Fruit users weaknesses. His powers are weak against anything\
        \ that can make him wet, though this is simply because it lowers the density\
        \ of his body, turning him into a more liquid substance-making it hard to\
        \ trap his opponents. It does not harm him in any way. Notable Attacks/Techniques:\
        \ |-|Devil Fruit= Mochi Mochi no Mi: A special Paramecia-type Devil Fruit,\
        \ this fruit allows the user to create, control, and transform into mochi.\
        \ The user is given the ability to generate and turn any part of their body\
        \ into thick, extremely viscous mochi \u2014 specifically white mochi paste\
        \ \u2014 to manipulate as they please. This paste is thick enough to be usable,\
        \ especially when hardened by Busoshoku Haki, as an effective blunt-force\
        \ weapon and is capable of trapping people, even extremely strong ones, due\
        \ to its sticky, stretchy nature. The latter is such that high-caliber gunfire\
        \ is completely unable to pierce through it. Additionally, due to its malleability\
        \ and compatibility with Haki, the mochi can be formed into a massive variety\
        \ of shapes, such as fists, tendrils, and even spiked clubs. Owing to this\
        \ same malleability, it is possible to form earplugs made from Mochi to block\
        \ and neutralize harmful sound-based attacks. As a \"special\" Paramecia,\
        \ this Devil Fruit\u2019s ability to transform into mochi is analogous to\
        \ the elemental transformation of a Logia. Thus, the user is intangible against\
        \ attacks that are not imbued with Busoshoku Haki, and they can freely morph\
        \ their transformed body into any shape. {{#tag:tabber| {{!}}-{{!}}Regular\
        \ Techniques= * Yanagi Mochi (\u67F3\u30E2\u30C1 Yanagi Mochi?, literally\
        \ meaning \"Willow Mochi\"): Katakuri sprouts multiple long tendrils of mochi\
        \ mimicking his leg and uses them to stomp down on his opponent. * Mochi Tsuki\
        \ (\u30E2\u30C1\u7A81\u30C4\u30AD Mochi Tsuki?, literally meaning \"Mochi\
        \ Thrust\"): Katakuri, while holding his spear Mogura, tightly twists his\
        \ mochi arm and then untwists it while thrusting the spear forward, creating\
        \ a very powerful drilling stab. * Kaku Mochi (\u89D2\u304B\u304F\u30E2\u30C1\
        \ Kaku Mochi?, literally meaning \"Square Mochi\"): Katakuri turns his arms\
        \ and hands into mochi and compresses them until they acquire a square shape.\
        \ He then hardens them with Busoshoku Haki and punches his opponent. The compact,\
        \ tight square-shape of the fists result in attacks that are a lot stronger\
        \ than a regular Haki-enhanced punch, enough to cause Luffy great pain when\
        \ clashing fists with him. * Yaki Mochi (\u713C\u9905\u30E4\u30AD\u30E2\u30C1\
        \ Yaki Mochi?, literally meaning \"Grilled Mochi\"): Katakuri inflates his\
        \ mochi forearm until the pressure causes it to explode, propelling his Haki-embedded\
        \ fist at his target from a distance. The speed of the fist is so high that\
        \ it catches on fire due to friction. * Zan Giri Mochi (\u65AC\u30B6\u30F3\
        \u30FB\u5207\u30AE\u30EA\u30FB\u9905\u30E2\u30C1 Zan Giri Mochi?, literally\
        \ meaning \"Sliced Mochi\"): Katakuri's strongest attack. He turns his entire\
        \ body into mochi and rapidly spins towards his opponent in a donut-like shape.\
        \ When he reaches his opponent he returns to normal shape and, using the momentum\
        \ from the spinning, slams his enlarged mochi forearm, covered in spikes and\
        \ hardened with Busoshoku Haki, into his opponent with tremendous force. Aside\
        \ from the damage caused by the powerful impact, his opponent will also be\
        \ stuck to his forearm due to the stickiness of the mochi, which Katakuri\
        \ then uses to spin his arm several times through the air before smashing\
        \ it down into the ground from a very considerable height, crushing his opponent\
        \ under its weight with enough force to create a large crater. Yanagi_Mochi.png|Yanagi\
        \ Mochi. Kaku_Mochi.png|Kaku Mochi. Mochi_Tsuki.png|Mochi Tsuki. BE53A8D9-D574-4B07-9DC7-403C846A093C.gif|Yaki\
        \ Mochi. Zan_Giri_Mochi_.gif|Katakuri attacking Luffy with Zan Giri Mochi\
        \ 9961A236-53E2-4911-9FFF-A0AB80572687.png|\u2026before ending the technique\
        \ by smashing him down into the ground. {{!}}-{{!}}Awakened Techniques= Katakuri\
        \ awakens his devil-fruit powers, allowing his paramecia abilities to extend\
        \ to the environment. Rather then having the ability to produce Mochi solely\
        \ from his body, he is also capable of altering the environment around him\
        \ into Mochi, spreading the adhesive substance around to enhance his range\
        \ of attacks and to capture his opponents. * Nagare Mochi (\u6D41\u308C\u30E2\
        \u30C1 Nagare Mochi?, literally meaning \"Flowing Mochi\"): Using his awakened\
        \ powers, Katakuri transforms the ground around him into mochi and uses it\
        \ to capture his opponent from a far-away distance. * Kagami Mochi (\u52A0\
        \u3005\u8EAB\u304B\u304C\u307F \u30E2\u30C1 Kagami Mochi?, literally meaning\
