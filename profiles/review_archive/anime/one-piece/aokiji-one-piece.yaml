        \ to sense the presence of others, and Bus\u014Dshoku Haki which allows individuals\
        \ to create an invisible armor around them. There is however a third type\
        \ of Haki, Ha\u014Dshoku Haki, that only a few individuals can use. *Bus\u014D\
        shoku Haki (Color of Armaments): Aokiji is capable of utilizing this type\
        \ of Haki, but his limitation is never explored. He had created a wall with\
        \ the other Admirals to block a quake from Whitebeard, which is an application\
        \ of Goken, thus he should be highly proficient or even advanced in its level\
        \ of application. *Kenbunshoku Haki (Color of Observation): He's capable of\
        \ utilizing this type of Haki, but his limitation is never explored. He should\
