        \ attacks Notable Attacks/Techniques: Haki: There are normally two types of\
        \ Haki regular people can tap into: the Kenbunshoku Haki which allows individuals\
        \ to sense the presence of others, and Bus\u014Dshoku Haki which allows individuals\
        \ to create an invisible armor around them. There is however a third type\
        \ of Haki, Ha\u014Dshoku Haki, that only a few individuals can use. *Bus\u014D\
        shoku Haki (Color of Armaments): Aokiji is capable of utilizing this type\
        \ of Haki, but his limitation is never explored. He had created a wall with\
        \ the other Admirals to block a quake from Whitebeard, which is an application\
        \ of Goken, thus he should be highly proficient or even advanced in its level\
        \ of application. *Kenbunshoku Haki (Color of Observation): He's capable of\
        \ utilizing this type of Haki, but his limitation is never explored. He should\
        \ at least be proficient with its application. Hie Hie no Mi (Chilly-Chilly\
        \ Fruit): A Logia type Devil Fruit which allows the user to turn himself,\
        \ as well as his surroundings, into ice. Most attacks are ineffective against\
        \ the user because its user can simply shatter and reform the ice composing\
        \ them on impact. Most of this Devil Fruit's attacks require Kuzan to contact\
        \ his enemy directly to freeze them, yet Kuzan found ways like creating ice\
        \ spears or ice tentacles to extend his combat range. This Devil Fruit also\
        \ allows Kuzan to seemingly project the freezing temperature of his body and\
        \ emit it outwards, such as when he uses his mere physical presence to freeze\
        \ the ground, air, water and any object around him. Kuzan is capable of immediately\
        \ freezing targets that come into contact with his range, inflicting potential\
        \ frostbite to them, and even lowering their physical constitution down that\
        \ even falling over would break pieces of their body off. *Ice Age (Glacial\
        \ Epoch): An attack used only near the ocean or another large area of water.\
        \ Kuzan places his hand in the water, then in an instant, freezes it (along\
        \ with anything in/on it) completely solid. The actual extent of the ice can\
        \ stretch for miles and last for over a week. The attack can still be conducted\
