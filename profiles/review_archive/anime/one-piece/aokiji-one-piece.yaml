        \ Fruit): A Logia type Devil Fruit which allows the user to turn himself,\
        \ as well as his surroundings, into ice. Most attacks are ineffective against\
        \ the user because its user can simply shatter and reform the ice composing\
        \ them on impact. Most of this Devil Fruit's attacks require Kuzan to contact\
        \ his enemy directly to freeze them, yet Kuzan found ways like creating ice\
        \ spears or ice tentacles to extend his combat range. This Devil Fruit also\
        \ allows Kuzan to seemingly project the freezing temperature of his body and\
        \ emit it outwards, such as when he uses his mere physical presence to freeze\
