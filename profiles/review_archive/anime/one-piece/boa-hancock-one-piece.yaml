    - field: intelligence
      value: Gifted (As the captain of the Kuja Pirates and a member of the Seven
        Warlords of the Sea, Hancock is an immensely talented and capable combatant,
        easily demolishing scores of Pacifistas with her decades of experience in
        hand-to-hand combat and the use of her Devil Fruit's abilities. She is also
        one of the few people in the world able to use all three forms of Haki, allowing
        her to easily anticipate her foes' attacks and crush them with her superior
        technique. As such, even the highest echelons of the World Government, including
        the Admirals, are wary of her power and influence. Her prowess was proven
        during the Whitebeard War, where she was one of the only combatants to leave
        the battlefield completely unscathed, despite clashing with both the Whitebeard
        Pirates and the Marines during the conflict. However, her confidence in her
        beauty and strength has also made her rather arrogant, often looking down
        upon others with reckless abandon. In addition, her love for Luffy drives
        many of her actions, which nearly led her to leap into the fray against the
        Admirals despite the political upset it would cause.)
      source_id: mediawiki-boa-hancock-one-piece
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Standard Devil Fruit users weaknesses. Her Devil Fruit's abilities don't\
        \ work on someone who isn't attracted to her (Example: Luffy), or is feeling\
        \ an emotion far superior at the time they would feel lust for her (Momonga\
        \ was able to not be affected during the time she used her powers due to feeling\
        \ the pain from stabbing himself more than his lust for her) Notable Attacks/Techniques:\
        \ Haki: There are normally two types of Haki regular people can tap into:\
        \ the Kenbunshoku Haki which allows individuals to sense the presence of others,\
        \ and Bus\u014Dshoku Haki which allows individuals to create an invisible\
        \ armor around them. There is however a third type of Haki, Ha\u014Dshoku\
        \ Haki, that only a few individuals can use. Hancock is one of these people.\
        \ * Ha\u014Dshoku Haki (Color of the Conquering King): Hancock is stated to\
        \ be capable of utilizing Haoshoku Haki. She's been shown to use it making\
        \ animals her servants. * Bus\u014Dshoku Haki (Color of Armaments): Hancock\
        \ has displayed the ability to harm Luffy's Rubber body and Smoker's smoke\
        \ body with blunt force and projectiles, and like the residents of her island\
        \ capable of applying hardening to her pet snake, meaning she is at least\
        \ proficient with it * Kenbunshoku Haki (Color of Observation or Mantra):\
        \ She sensed both Luffy and the Heart Pirates were alive deep underwater despite\
        \ other Kenbunshoku Haki users being unaware, and continued to track their\
        \ movement while still underwater. Mero Mero no Mi (Love Love Fruit): A Paramecia-type\
        \ Devil Fruit that Hancock was forcibly fed as a young woman, it grants her\
        \ the ability to incite lust and perversion in others as well as the ability\
        \ to turn her foes to stone should they fall for her charms. Anyone who experiences\
        \ any sort of \"dirty thoughts\" towards her will be susceptible to this Devil\
        \ Fruit's powers, as the Fruit itself amplifies those feelings in order to\
        \ affects the targets. During this time, Hancock's petrified victims will\
        \ have their consciousness frozen, as if time had stopped around them, preventing\
        \ them from making any sort of action unless Hancock willingly releases them\
        \ from this state. However, sufficient concentration, being blind or blindfolded\
        \ (and thus unable to experience Hancock's beauty), or simply lacking any\
        \ sort of affection for Hancock can nullify these effects. On the other hand,\
        \ she can also petrify her foes with her physical attacks as well as her techniques,\
        \ regardless of whether or not the target feels lust for her, even working\
        \ on inanimate objects or machines like Pacifistas. But this use of her powers\
        \ will only affect the area struck rather than the entirety of the target's\
        \ body. *Mero Mero Merrow: Hancock's signature technique, she forms a heart\
        \ shape with her hands to fire a heart-shaped beam that applies her Devil\
        \ Fruit's effects to anyone in range. However, as with the Devil Fruit's normal\
        \ functions, this technique can be resisted by focusing on something other\
        \ than Hancock (such as a powerful emotion or self-inflicted pain) or simply\
        \ by not feeling any sort of affection for her (as if the case with Luffy)\
        \ ** Awaken: Hancock blows a kiss at a person or persons previously turned\
        \ to stone by Mero Mero Merrow, which causes small hearts that wash over them\
        \ and restore them to their normal state. center|thumb|300px *Pistol Ki"
