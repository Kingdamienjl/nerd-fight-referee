  tier:
    text: '{{6-B}}, {{5-C}} in Zoan Forms, even higher with Conqueror''s Haki Infusion
      Name: Yamato, "Kozuki Oden" (self-proclaimed) Origin: One Piece Gender: Male
      Age: 28 years old Classification: Samurai, Oni, Self-Proclaimed Kozuki Oden,
      Mythical Zoan User Power and'
