      \ With a 108 Pound Phoenix, he cut through Ohm's iron clouds when his regular\
      \ attacks couldn\u2019t and proceed to one-shot him) | Island level (Fought\
      \ on par with Hybrid KakuOne Piece Vol. 43 Chapter 413 and overpowered him on\
      \ different occasionsOne Piece Vol. 43 Chapter 417. Defeated Zombie Ryuma in\
      \ 5 minutesOne Piece Vol. 48 Chapter 4679.36 Gigatons), higher with Strongest\
      \ Attacks (One Gorilla & Two Gorilla combines the strength of both arm \"gorillas\"\
      \ to double his power. Pushed back Hybrid Kaku's Nose Pistol and injured himOne\
      \ Piece Vol. 43 Chapter 416. Onigiri is equivalent to Luffy's Gum Gum Bazooka.\
      \ Likely would have sliced through Kaku's Iron Body with Lion Song18.7 Gigatons),\
      \ far higher with Asura (Turned Kaku's strongest attack \"Tempest Kick: Sky\
      \ Slicer\", into mist, and then proceeded to one-shot him. Harmed a PacifistaOne\
      \ Piece Vol. 52 Chapter 510)"
