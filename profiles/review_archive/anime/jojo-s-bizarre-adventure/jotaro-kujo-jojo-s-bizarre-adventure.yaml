      kicked through a chain15 Kilojoules); at least Large Building level+ with Star
      Platinum (Demonstrably stronger than Dark Blue Moon; Capable of inflicting heavy
      damage upon itJoJo''s Bizarre Adventure: Stardust Crusaders Chapter 15 and defeating
      him, slicing his head with the Star Finger.JoJo''s Bizarre Adventure: Stardust
      Crusaders Chapter 16 Superior to his Diamond Is Unbreakable and Stone Ocean
      iterations. Has a reputation as the most powerful Stand during Stardust Crusaders.JoJo''s
      Bizarre Adventure: Stardust Crusaders Chapter 73 One of the strongest Stands
      in the entire series, surpassing Stands such as Whitesnake, Magician''s Red
      and more in nearly all physical capabilities. Far stronger than the likes of
      Dio Brando''s minions and comparable, albeit weaker than The World and is heralded
      as a Stand with unmatched power as the strongest warriorJoJo-A-Go-GO: Star Platinum
      Page 1 that demonstrates first-class power as the strongest Stand in the worldJoJo-A-Go-GO:
      Star Platinum Page 27.83 Tons of TNT), higher when enraged (Grows exponentially
      when angered. Could cave in DIO''s skull and tear him apart.JoJo''s Bizarre
      Adventures: Stardust Crusaders Chapter 148 While angry, Jotaro was capable of
      punching a hole through The World''s body despite being previously outmatched
      merely moments prior.JoJo''s Bizarre Adventures: Stardust Crusaders Chapter
      145 Broke a further strengthened HIGH DIO''s The World''s hand and damaged HIGH
      DIOJoJo''s Bizarre Adventures: Stardust Crusaders Chapter 150), far higher at
      its peak (Upon hitting his breaking point, getting as angry as he possibly could,
