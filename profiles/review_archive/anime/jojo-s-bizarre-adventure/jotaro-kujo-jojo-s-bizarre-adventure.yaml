    - field: weaknesses
      value: 'Jotaro is quick to anger, though he becomes calmer as he matures. Any
        damage dealt to Star Platinum is reflected onto Jotaro. In Stone Ocean, he
        can only stop time for up to five seconds with Star Platinum: The World, and
        must wait a moment before he can use it again, due to how taxing it is on
        the body, which doesn''t affect his Stardust Crusaders and Diamond Is Unbreakable
        self. Disuse of this ability over a long period of time will cause his maximum
        duration to decrease, potentially as low as half a second. If someone Jotaro
        cares about is in danger, he will prioritize protecting them over attacking
        the enemy. Feats: Star Platinum Respect Thread {| cla'
