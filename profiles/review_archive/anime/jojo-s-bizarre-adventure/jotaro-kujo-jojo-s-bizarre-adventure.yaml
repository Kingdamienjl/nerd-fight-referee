  stamina:
    text: Superhuman (Jotaro's willpower and resilience are phenomenal, enough for
      him to withstand many beatdowns from DIO and the World during their climactic
      showdown, persisting to deliver a killing blow even after having multiple bones
      broken. In Diamond is Unbreakable, Jotaro was able to continue advancing on
      and dodging attacks from Bug-Eaten despite continually stopping time whilst
      being affected by his poison. After being nearly killed by Sheer Heart Attack,
      Jotaro was still able to force himself to his feet and catch Kira off guard
      before beating him down with Star Platinum)
