  intelligence:
    text: Gifted (Though he may appear short-tempered and straightforward, Jotaro
      is remarkably cunning and resourceful, taking after his grandfather in many
      ways. Though his Stand may be the simplest of all, Jotaro's intelligence more
      than makes up for this straightforwardness, as he can easily bluff and lure
      opponents into vulnerable positions from which to beat them senseless. When
      cornered, Jotaro will even rely on the Joestar secret technique of simply running
      away, though to a more advantageous position, such as luring Rubber Soul into
      the water so that he'd have no choice to breathe. Impressively, he even bluffed
      Daniel J. D'Arby, who was able to cheat even his grandfather, into passing out.
      He showcased his intelligence best in his final battle with DIO, using a simple
      magnet trick to buy time by convincing DIO he can move within stop time before
      the trick was revealed, baiting DIO into attacking him during stopped time and
      leaving himself vulnerable to counterattack. He also had the foresight to pad
      his clothing with magazines to lower the impact of any projectiles, and he lured
      DIO into yet another trap by playing dead, taking the opportunity to crush his
      skull. As an adult, Jotaro has become calmer and even more intelligent, so much
      so that he's stated to always be calm and collected in a fight, carefully analyzing
      Kira's household to profile him and his motivations, coming to many accurate
      conclusions regarding his personality and motivations. He has also become a
      marine biologist who contributed greatly to the field. Jotaro is also bilingual,
      fluent in at least Japanese and English). Star Platinum has been shown to have
      it's own self-sentience being described as violent and hard to control, Star
      Platinum despite following Jotaro's commands has shown the intelligence to act
      on its own in some situations for the benefit of Jotaro, such as finding and
      bringing Jotaro items to entertain himself with or in most cases, self-preservation,
      acting on its own if given the chance when Jotaro otherwise can't or is unable
      to.
    source_ids:
    - mediawiki-jotaro-kujo-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
