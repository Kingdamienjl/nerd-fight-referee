    notes: auto_repair source extraction
  attack_potency:
    text: Athlete level. Small Building level with Hierophant Green, likely Large
      Building level with the Emerald Splash (Damaged DIO. Wounded an early Star Platinum
      and harmed Jean Pierre Polnareff)
    source_ids:
    - mediawiki-noriaki-kakyoin-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At least High Hypersonic, likely higher reactions (Can perceive events down
      to at least 1/10,000th of a second). At least Relativistic, likely higher with
      Hierophant Green (Considered fast by Polnareff, though was taken out by Chariot
      before he could finish his attack later on. Intercepted Emperor with Emerald
      Splash and guarded against The World; albeit at his slowest)
    source_ids:
    - mediawiki-noriaki-kakyoin-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: At least Wall level, likely higher (Survived being crushed by Forever briefly).
      Small Building level, possibly higher with Hierophant Green (Survived a held
      back assault from Star Platinum, creating a hole in the roof of a school, took
      a casual punch from The World at its weakest)
    source_ids:
    - mediawiki-noriaki-kakyoin-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Peak Human (Was able to survive for quite a long time while missing his
      internal organs)
    source_ids:
    - mediawiki-noriaki-kakyoin-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Standard Melee Range physically. Hierophant Green has an effective manifestation
      range of at least Hundreds of Meters (Long-Distance StandJoJo6251 - Pg. 121
      with an A in RangeJoJo-A-Go!Go!: Section 4; His tentacles extended a few hundred
      meters against The LoversJoJo''s Bizarre Adventure: Stardust Crusaders Chapter
      52, checked every inch of a super tankerJoJo''s Bizarre Adventure: Stardust
      Crusaders Chapter 18 and flew 100 meters towards The Sun before being attackedJoJo''s
      Bizarre Adventure: Stardust Crusaders Chapter 54), Far Higher when stretching
      (Stated that his Stand can stretch indefinitelyJoJo''s Bizarre Adventure: Stardust
      Crusaders Chapter 60, something supported by his Stand stretching several hundred
      metersJoJo''s Bizarre Adventure: Stardust Crusaders Chapter 52 while microscopic
      in sizeJoJo''s Bizarre Adventure: Stardust Crusaders Chapter 50), at least Tens
      of Meters with Emerald Splash (Capable of covering at least 20 metersJoJo''s
      Bizarre Adventure: Stardust Crusaders Chapter 140 and hit a clock tower from
      tens of meters awayJoJo''s Bizarre Adventure: Stardust Crusaders Chapter 141)'
    source_ids:
    - mediawiki-noriaki-kakyoin-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Genius Combatant (He was able to figure out the true nature of The World,
      and has shown to be very creative when it comes to using his stand's abilities
      such as his fights with Grey Tower and Lovers by setting up traps and leading
      them into said traps)
    source_ids:
    - mediawiki-noriaki-kakyoin-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
