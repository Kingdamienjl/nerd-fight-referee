      is rarely an issue for it due to erasing time, it could react to Silver Chariot
      while it was mid-attack, erase time, and quickly gouge out Silver Chariot's
      eye and continue attacking Polnareff before he could defend himself. Polnareff
      stated that he only barely dodged King Crimson once and that whether or not
      Giorno could defend against it is a matter of luck, with Giorno Giovanna barely
      having enough time to react and failed to defend himself against King Crimson's
      blow. Moved Spice Girl fast enough to dodge a strike from Sticky Fingers)
