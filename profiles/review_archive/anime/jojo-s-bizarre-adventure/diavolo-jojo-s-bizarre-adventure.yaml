    text: Athlete level, At least Large Building level, likely Large Building level+
      with King Crimson's arms (Retains the same strength as the full King Crimson
      Stand. Punched a deep hole in Leone Abbacchio's chest while Doppio was in disguise
      as a kid) | Athlete level, At least Large Building level, likely Large Building
      level+ with King Crimson (An overwhelmingly powerful Stand with outstanding
      strength and is stated to be First-Class in power. Severely maimed Silver Chariot.
      Can completely overpower and manipulate Spice Girl casually even being capable
      of punching through Spice Girl in one hit while angered. Threatened to tear
      off Sticky Finger's arm, punched out Bruno's abdomen and further nearly bisected
      him. Punched off Gold Experience's arm and later smashed open Gold Experience's
      head in one blow, but it was unaffected because of Gold Experience Requiem abandoning
      its previous body like a shell). High Universe level Environmental Destruction
      with Time Erasure (King Crimson is able to skip and erase time from the universe,
      Up to Dozen-odd seconds)
    source_ids:
