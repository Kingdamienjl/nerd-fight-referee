  intelligence:
    text: Doppio= Above Average (Despite his naive and eccentric nature, Doppio is
      a very competent fighter, capable of being effective on his own without Diavolo's
      help. He was able to figure out Risotto Nero's ability and came up with the
      idea of using his natural magnetism to find him despite his camouflage) |-|Diavolo=
      Gifted (Naturally, as the leader of the extremely successful and powerful gang
      Passione, Diavolo is a cunning man with a knack for strategy. For the sole purpose
      of maintaining his anonymity no matter what, Diavolo has eradicated nearly all
      the traces of his past, and acts to make sure that he never reveals himself
      when he can help it to deal with his subordinates. Diavolo is also very observant,
      seeing the true nature of Chariot Requiem and disabling it himself, while also
      keeping track of Bucciarati's gang. In combat, he makes brutal and simplistic
      use of his Stand, taking no chances and erasing time to deliver lethal blows
      without delay. Has creatively worked around the limitations of his Stand by
      using his own open wounds to throw blood in the direction of his opponents'
      eyes so that it can become detached from his body, becoming part of the erased
      environment, and ultimately hinder his enemies' actions once time returns to
      normal. He's competent at thinking on his feet as well, taking any opportunity
      he can when they arise and exploiting his surroundings to dispatch of Risotto
      Nero)
    source_ids:
    - mediawiki-diavolo-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
