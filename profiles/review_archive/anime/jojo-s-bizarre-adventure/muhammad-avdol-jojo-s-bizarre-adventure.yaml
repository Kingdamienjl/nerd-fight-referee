    - field: weaknesses
      value: "Any damage taken to Magician's Red will reflect back onto Avdol. His\
        \ life detection ability can be trumped by certain attacks or abilities that\
        \ leave no trace of their presence (Such as with Vanilla Ice) Notable Attacks/Techniques:\
        \ Jojo cqc.gif|Magician's Red in action Red bind mk2.gif|Red Bind Jojo cfr.gif|Cross\
        \ Fire Hurricane Jojo cf.gif|Cross Fire Hurricane Special Jojo mr flame.gif|Magician's\
        \ Red Vs. Silver Chariot Life sense jojo.gif|Life Detector MagicianRed.gif|Avdol\
        \ manifesting Magician's Red MRFast.gif|Magician's Red avoiding blows from\
        \ Silver Chariot RestrainAvdol.gif|Avdol demonstrating that he has the strength\
        \ and ability to overcome and restrain even someone like Iggy *Magician's\
        \ Red: Magician's Red is a humanoid Stand with the body of a red bird. It\
        \ is capable of using melee attacks, but its more preferred to use its ability\
        \ or its ability mixed with melee attacks. Since its body is composed of flames,\
        \ any fire attacks put onto Magician's Red will have no effect. **Flame Manipulation:\
        \ Magician's Red's main ability is pyrokinesis. It can project flames that\
        \ are visible only to Stand users, but have the strength to produce this much\
        \ force. It can evaporate metal and incinerate objects in mid-air. There is\
        \ no limit to the shape or form of the flames Avdol produces. **Cross Fire\
        \ Hurricane: Magician's Red's signature attack. It fires a set of flames in\
        \ the shape of an ankh, strong enough to bury itself several meters into the\
        \ ground before rising underneath the enemy still in tact. ***Cross Fire Hurricane\
        \ Special: An advanced form of the Crossfire Hurricane, it is made to cover\
        \ a wider radius and fire more ankh-shaped flames repeatedly. Avdol has acknowledged\
        \ there is no limit to how long he can use this attack. **Red Bind: Magician's\
        \ Red uses its flexible flames to wrap an opponent around with a stream of\
        \ fire. Once trapped, Avdol can trap them on top of surfaces and burn the\
        \ oxygen around the opponent, essentially suffocating them and leaving them\
        \ helpless. **Life Detection: The flames of Magician's Red produce a psychic\
        \ energy that is capable of detecting movement, breathing and even Stand energy\
        \ within a 15 meter radius. It forewarns Avdol of an incoming opponent or\
        \ reveals one in hiding. ==Gallery== {{Scroll box|content= File:JoJo's Bizarre\
        \ Adventure Stardust Crusaders OST - Fire Shaman File:JoJo's Bizarre Adventure\
