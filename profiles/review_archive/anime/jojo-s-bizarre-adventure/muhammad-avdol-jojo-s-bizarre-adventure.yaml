    text: 'Standard Melee Range physically. Magician''s Red has an active manifestation
      range of likely just a few meters (Short-Distance Power Type that can''t stray
      far from the body that''s ranked C in Range), Standard Melee Range physically,
      at least Several Meters with Pyrokinesis (Attacked Chariot from several meters
      awayJoJo''s Bizarre Adventure: Stardust Crusaders Chapter 13 and created a stream
      of fire that wrapped around Judgement from this distanceJoJo''s Bizarre Adventure:
      Stardust Crusaders Chapter 65. Controlled fire from a distance of a few metersJoJo''s
