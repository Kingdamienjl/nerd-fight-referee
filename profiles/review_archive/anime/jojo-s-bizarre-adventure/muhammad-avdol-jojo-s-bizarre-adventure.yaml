  attack_potency:
    text: Street level (Can run with over a hundred kg weighing him down and launch
      a fully grown man across a room with one punch), likely Large Building level
      with Magician's Red. (Overwhelmed Judgement, who was capable of deflecting Silver
      Chariot's blows and overpowering him. Capable of melting a hole in the ground
      in a split second and melted a tunnel)
    source_ids:
    - mediawiki-muhammad-avdol-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At least Peak Human (Kept pace with Joseph Joestar) with Massively FTL reactions,
      Massively FTL with Magician's Red (Could dodge strikes from Silver Chariot and
      react to a flurry with a burst of flames, fought Judgement and reacted to Geb
      and Emperor)
    source_ids:
    - mediawiki-muhammad-avdol-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
