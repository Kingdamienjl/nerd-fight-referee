    - field: weaknesses
      value: 'Any damage taken by Whitesnake will be reflected back onto Pucci. Whitesnake
        must touch a target to extract a Disc, and if a Stand Disc is too strong for
        a user to handle or otherwise incompatible, it will reject them. Someone can
        snap out of Whitesnake''s illusion-inducing mist if they notice inaccuracies.
        | Any damage taken by C-Moon will be reflected back onto Pucci. | Any damage
        taken by Made in Heaven will be reflected onto Pucci, who retains his human
        weaknesses. Due to the effects of time acceleration, airborne attacks are
        more likely to affect Pucci, and its time acceleration slowly increases over
        time. Notable Attacks/Techniques: Whitesnake: Pucci''s original Stand, a malicious
        and hateful, long-range humanoid Stand with a personality of its own. Its
        range is about twenty meters, allowing it to stray from Pucci and act in his
        place, and it retains impressive levels of strength despite its long-distance
        functions, making it a deadly Stand. JoJos Bizarre Adventure All-Star Battle-Whitesnake''s
        illusion.gif|Whitesnake''s illusion in All-Star Battle JoJos Bizarre Adventure
        All-Star Battle-Pucci''s Made in Heaven.gif|Obtaining Made in Heaven in All-Star
        Battle *DISC Creation: Whitesnake''s primary and most dangerous ability is
        the power to extract a portion of the spirit of a victim as a tangible Disc.
        These Discs can be memory Discs containing the victim''s memories, or Stand
        Discs containing their Stand, and they can be inserted into others to grant
        them access to whatever it is they contain. This can be used to inject harmful
        Stand powers into opponents. Meanwhile, those who have their Discs extracted
        will fall into a coma, and without being put on life support, will die as
        their bodily functions begin to fail, unless their Memory Disc is returned.
        The return of a Stand Disc without a Memory Disc will grant the target their
        consciousness, but they will eventually atrophy and die all the same. Whitesnake
        can insert other Discs, such as those containing commands that a target must
        follow, even the physically impossible, or even just regular music CDs to
        play music. Pucci can also use Whitesnake on himself, doing so to remove his
        sense of sight so that he would not be affected by Heavy Weather. *Illusionary
        Acid: Whitesnake can exude an acidic mist that corrodes objects in its surroundings
        and traps them in a trance, distracting and misleading them with lifelike
        illusions. It can use these illusions to disguise itself as others and ambush
        victims. However, if someone sees the discrepancies between the illusion and
        the real world, they can snap out of it. *Mind Control: By inserting its hand
        into a target''s head, Whitesnake can control them, leaving them to obediently
        follow Pucci''s orders. C-Moon: Pucci''s second Stand, an evolved Whitesnake.
        It resembles a fusion of its components, that is, Whitesnake and the Green
        Baby. It has some semblance of intelligence and, due to its deadly abilities,
        is extremely powerful. It remains a long-range Stand, and the closer Pucci
        is, the more he can control it. *Gravity Inversion: C-Moon makes Pucci the
        center of reverse gravity, causing all objects within a 3 kilometer radius
        to be repelled from his position. Those above him will be pushed further upwards,
        and unfixed objects will fall away from him. C-Moon is unaffected, and Pucci
        can utilize its abilities to walk on any surface or even levitate. More lethally,
        by striking an object with its fist, C-Moon can alter gravity to twist it
        inside out, but the effects will be reversed if C-Moon strikes them again.
        Made in Heaven: Pucci''s ultimate Stand, an extremely powerful close-range
        Stand resembling a two-headed, bipedal centaur. *Time Acceleration: From the
        moment Made in Heaven appears, it controls gravitational forces across the
        entire universe to dramatically accelerate the passing of time, more and more
        the longer it is active. However, this only affects non-living beings, besides
        Pucci, causing everyone else to see the universe speeding up around them.
        This makes projectiles move at extreme speeds, making it difficult to react
        to them in time. It even accelerates stopped time, decreasing a user''s window
        of action. This makes Pucci incredibly fast as well, and his speed only increases
        further over time. However, critically, Pucci retains his human weaknesses,
        and will be affected more quickly by hazardous environments. Eventually, Made
        in Heaven''s acceleration of time will cause the universe''s reset. **Consequential
        Fate: After the universe''s reset, everything that happened in the previous
        universe will be repeated, in accordance with fate, save for some changes
        that Pucci can make himself. Anyone who died in the previous universe will
        be replaced by a similar person with a whole new soul. All those who survived,
        however, will have a precognitive understanding of everything that will occur
        to them. If Pucci himself is killed, the universe will reset again, but without
        his influence. ==Gallery== {{Scroll box|content= Whit'
