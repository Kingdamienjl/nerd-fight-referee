  tier:
    text: '{{9-B}}, {{8-C}} with Sticky Fingers Name: Bruno Bucciarati Origin: JoJo''s
      Bizarre Adventure: Vento Aureo Gender: Male Age: 20 Classification: Human, Gangster,
      Capo, Stand User'
    source_ids:
