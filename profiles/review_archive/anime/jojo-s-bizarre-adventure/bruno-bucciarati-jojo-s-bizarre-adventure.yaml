  attack_potency:
    text: Wall level (Knocked out Pesci with a kick and cracked a train windshield.
      Italian train windshields of the time have been noted to be able to withstand
      1 kilogram projectiles at 100 m/s with slight damage). Building level with Sticky
      Fingers (Fought Gold Experience, who harmed Black Sabbath. Can somewhat fight
      with Secco, despite being inferior. Stated to be able to attack with enormous
      power at short range and briefly staggered King Crimson), his zippers ignore
      durability
    source_ids:
    - mediawiki-bruno-bucciarati-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At most Massively FTL reactions (Summoned his Stand to block an attack from
      Gold Experience. Unzipped his head to dodge a blow from the Grateful Dead. Could
      react to a casual King Crimson. Could react to, albeit barely, to Secco. Reacted
      to a powered up Sex Pistols within Diavolo's body). At most Massively FTL with
      Sticky Fingers (Excels in speed. Could tag King Crimson twice, even while he
      was mid-attack), Massively FTL with Zipper Manipulation (Was able to evade one
      of his blows through the use of his zippers, dodging the attack in its entirety)
    source_ids:
    - mediawiki-bruno-bucciarati-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Wall level, possibly far higher (Could take blows from both Giorno Giovanna
      and Secco). Building level with Sticky Fingers (Can withstand his own punches,
      and can fight against Gold Experience)
    source_ids:
    - mediawiki-bruno-bucciarati-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Above Peak Human (Briefly survived for a few minutes, and could still move,
      after getting punched through the abdomen by King Crimson and cleaved through
      his shoulder down to this chest, rupturing his heart)
    source_ids:
    - mediawiki-bruno-bucciarati-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Standard Melee Range physically. Sticky Fingers has an effective manifestation
      range of 2 metersJoJo''s Bizarre Adventure: Golden Wind Chapter 9JoJo-A-GoGo:
      Section 63 (Stated to be merely 2 metersJoJo''s Bizarre Adventure: Golden Wind
      Chapter 128 and attempted to attack The Boss from 2 meters awayJoJo''s Bizarre
      Adventure: Golden Wind Chapter 80), Standard Melee Range physically, up to at
      least Several Meters when unzipping his armJoJo''s Bizarre Adventure: Golden
      Wind Chapter 22JoJo''s Bizarre Adventure: Golden Wind Chapter 60, Higher with
      Zipper Manipulation (Split a large pillarJoJo''s Bizarre Adventure: Golden Wind
      Chapter 82JoJo''s Bizarre Adventure: Golden Wind Chapter 83)'
    source_ids:
    - mediawiki-bruno-bucciarati-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted. A high ranking member of Passione, heavily relied upon due to his
      trustworthiness and reliability to get tasks done. Bruno has a surprising amount
      of ingenuity, making exceptional use of his seemingly mundane ability, turning
      something that would seem weak and useless on paper into a extremely dangerous,
      lethal and versatile power, making use of it in a wide variety of ways both
      in and outside of battle. He's also quite analytical and has shown time and
      time again to have the capacity to figure out a foe's weaknesses and to exploit
      them, how they fight and make use of their abilities and even how much of a
      priority they are to take out based on their actions and personality. Bruno
      has also shown the qualities of a leader, able to formulate plans and how to
      best make use of his fellow gang member's abilities for their missions. At one
      point he was also given complete management over a variety of operations through
      Naples and was expected to do so without issue, though he never got the chance
      to show how good he'd have been at managing said tasks.
    source_ids:
    - mediawiki-bruno-bucciarati-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
