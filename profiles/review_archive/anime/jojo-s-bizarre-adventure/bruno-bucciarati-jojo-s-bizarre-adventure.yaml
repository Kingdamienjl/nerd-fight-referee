    - field: intelligence
      value: Gifted. A high ranking member of Passione, heavily relied upon due to
        his trustworthiness and reliability to get tasks done. Bruno has a surprising
        amount of ingenuity, making exceptional use of his seemingly mundane ability,
        turning something that would seem weak and useless on paper into a extremely
        dangerous, lethal and versatile power, making use of it in a wide variety
        of ways both in and outside of battle. He's also quite analytical and has
        shown time and time again to have the capacity to figure out a foe's weaknesses
        and to exploit them, how they fight and make use of their abilities and even
        how much of a priority they are to take out based on their actions and personality.
        Bruno has also shown the qualities of a leader, able to formulate plans and
        how to best make use of his fellow gang member's abilities for their missions.
        At one point he was also given complete management over a variety of operations
        through Naples and was expected to do so without issue, though he never got
        the chance to show how good he'd have been at managing said tasks.
      source_id: mediawiki-bruno-bucciarati-jojo-s-bizarre-adventure
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Any damage taken by Sticky Fingers will reflect onto Bruno. Bruno can
        only activate his ability through direct contact. Unzipping himself can be
        fatal if it disconnects him from his heart Notable Attacks/Techniques: Sticky
        Fingers Bruno Zippers.gif|Zippers Sticky fingers powa (temporary).gif|Creating
        an opening through a wall Bruno_Punch_Ari_1.gif|Sticky Fingers launching its
        fist Ez8.gif|Arrivederci Ezgif-2-f51b16396c8f_2.gif|Bruno utilizing Sticky
        Fingers Ez12.gif|Bruno decapitating Zucchero Bruno_3gif.gif|Attacking pillars
        and reattaching Trish''s hand Bruno_4_gif.gif|Bruno retrieving a phone from
        his zippers *Sticky Fingers: Sticky Fingers is a large, blue-and-white humanoid
        Stand with zipper themed decor on various parts of its body. It uses melee
        attacks in conjunction with its zipper-based abilities. **Zippers: Anything
        Bruno or Sticky Fingers touches can add a zipper onto that object. From that
        point, Bruno can then zip and unzip that object to any extreme to the point
        of detaching, reattaching or closing off pieces of one object. If Bruno unzips
        a solid object, it also equally unzips the opposite side of it, such as a
        wall or a body. If a living person or object is unzipped, Bruno can freely
        damage them from the inside if he wishes. If said living person or object
        is detached, any damage or pain taken by the original source will reflect
        onto them as if they were still connected. Bruno can unzip himself to manipulate
        his body for various purposes, such as detach limbs to extend his range or
        separate his body to dodge attacks. **Unknown Dimension: Sometimes, when Bruno
        unzips a surface, it will lead to a dark, unknown area. Bruno states that
        he does not know where this is or where it leads to, but it can be used as
        a hiding spot or a gateway to other areas. ==Notable Matchups== Victories:
        Jolyne Cujoh (JoJo''s Bizarre Adventure) Jolyne''s Profile Josuke Higashikata
