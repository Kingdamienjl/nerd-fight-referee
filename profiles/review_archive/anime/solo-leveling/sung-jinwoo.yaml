    - field: intelligence
      value: 'Gifted (Jin-Woo has displayed incredibly keen instincts and intuition
        even in stressful situations, his deductions having saved multiple people
        from certain death. Is capable of noticing the gaps within a group''s ranks,
        and is capable of deciphering the faults and errors of his comrade''s movements
        and strategies.Solo Leveling; Webnovel; Chapter 19 He has shown to be very
        analytical and observative, being able to decipher and mirror the techniques
        of others down their muscle movements, breathing patterns, and postures, after
        only a moment of observation. Further into the series, Jin-Woo demonstrates
        the ability to easily predict and counter even the most minute movements of
        his opponents, sensing both the flow and trajectory of attacks. He is especially
        experienced at going up against an overwhelming amount of opponents, even
        by himself, and could defend and counter eight weapons being swung at him
        at once with a single sword and dodged the nigh-undetectable gaps between
        the attacks) Standard Tactics: |-|Re-Awakened= Sung Jin-Woo starts by analyzing
        his opponents. He''s able to gauge strength by sensing one''s Aura, immediately
        telling whether or not a fight is one he can take head on or not. After that,
        he will usually activate ''Stealth'' to avoid detection (Erases his presence
        completely, making him impossible to detect), use his ''Agility'' stat to
        slow down time, and activate ''Dash'' to increase his speed by 40% in an attempt
        to blitz the opponent in combat. He attacks with his daggers, using ''Poison
        Fang of Kasaka'' to inflict poison debuffs (''Paralysis'' and ''Bleeding''),
        and ''Knight Killer'' to slice through tougher, or armored opponents - though
        he often duel wields. His fighting style is most akin to an assassin, using
        stealthy attacks while aiming for vital points to end fights quickly and effectively.
        His skill ''Vital Points Targeting'' allows him to deal great additional damage
        every time he strikes an opponent''s weak point. If Jin-Woo is caught in a
        stalemate or tight position, he will then activate ''Intimidation'' to induce
        ''Fear'' and decrease the opponent''s stats by 50%. Against those with murderous
        intent against him, Jin-Woo will fight with the intent to kill as quickly
        and efficiently as possible, as due to the nature of the system, he himself
        will die if he does not. |-|Shadow Monarch= Immediately upon entering a battle,
        Sung Jin-Woo will summon all of his soldiers from his shadow to overwhelm
        his opponent with numbers, and activate ''Monarch''s Territory'' to spread
        his shadow over the battlefield and increase the statistics of every soldier
        by 50%. Jin-Woo utilizes the strength and abilities of every Shadow Soldier
        while simultaneously engaging in close-quarters-combat, primarily dual-wielding
        the ''Demon King''s Shortswords'' which add to his attack power. His method
        of attack is similar to before, using his skills to increase his speed and
        avoid detection, while attacking weak and vital points he perceives in his
        enemies to end battles as quickly as possible. He will use ''Ruler''s Authority''
        to telekinetically bind, crush, and throw opponents around; block or deflect
        oncoming projectile attacks; and launch himself through the air. His sword
        skills are far more profound in this key, as he''s able to predict oncoming
        attacks by perceiving every minute movement his opponents make in slow motion
        and read the trajectory of every attack used against him. Against armies or
        hoards of opponents, he will resurrect those that fall using ''Shadow Extraction''
        to turn them into his soldiers, turning the tides against the enemy. |-|Black
        Heart=More or less the same as before, however, he will now amplify his attacks
        with magic energy to greatly increase his strength and inflict irreversible
        magical damage onto his opponents. He will also disorient his opponents by
        shouting with magic energy. His skill is even greater than before, and he
        can sense even the flow of energy behind the attacks from his opponents, dodging
        them with blinding speed. His Agility stat is also higher, which allows him
        to completely freeze his opponents from his perspective. His primary weapon
        in this key is Kamish''s Wrath, a set of daggers that allow him to shoot long-range
        darkness projectiles that follow the trajectory of his attacks. These projectiles
        can split into dozens upon dozens more attacks in of themselves, which he
        uses to his advantage to completely overwhelm the opponent in series of danmaku
        blows. |-|True Shadow Monarch=Same as before. His presence alone is enough
        to completely disorient most opponents, however, he can also use ''Dragon''s
        Fear'' to instill an even deeper fear if necessary, incapacitating every being
        weaker than him instantly, over a radius of many kilometers. Against a powerful
        enemy, if warranted, he will use his control over darkness and enter his ''Spiritual
        Body Manifestation'' form to overwhelm them. This form is extremely massive
        and far more powerful than his normal form, however it drains his mana very
        fast, thus'
