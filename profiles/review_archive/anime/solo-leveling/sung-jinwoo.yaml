    - field: intelligence
      value: 'Gifted (Jin-Woo has displayed incredibly keen instincts and intuition
        even in stressful situations, his deductions having saved multiple people
        from certain death. Is capable of noticing the gaps within a group''s ranks,
        and is capable of deciphering the faults and errors of his comrade''s movements
        and strategies.Solo Leveling; Webnovel; Chapter 19 He has shown to be very
        analytical and observative, being able to decipher and mirror the techniques
        of others down their muscle movements, breathing patterns, and postures, after
        only a moment of observation. Further into the series, Jin-Woo demonstrates
        the ability to easily predict and counter even the most minute movements of
        his opponents, sensing both the flow and trajectory of attacks. He is especially
        experienced at going up against an overwhelming amount of opponents, even
        by himself, and could defend and counter eight weapons being swung at him
        at once with a single sword and dodged the nigh-undetectable gaps between
        the attacks) Standard Tactics: |-|Re-Awakened= Sung Jin-Woo starts by analyzing
        his opponents. He''s able to gauge strength by sensing one''s Aura, immediately
        telling whether or not a fight is one he can take head on or not. After that,
        he will usually activate ''Stealth'' to avoid detection (Erases his presence
        completely, making him impossible to detect), use his ''Agility'' stat to
        slow down time, and activate ''Dash'' to increase his speed by 40% in an attempt
        to blitz the opponent in combat. He attacks with his daggers, using ''Poison
        Fang of Kasaka'' to inflict poison debuffs (''Paralysis'' and ''Bleeding''),
        and ''Knight Killer'' to slice through tougher, or armored opponents - though
        he often duel wields. His fighting style is most akin to an assassin, using
        stealthy attacks while aiming for vital points to end fights quickly and effectively.
        His skill ''Vital Points Targeting'' allows him to deal great additional damage
        every time he strikes an opponent''s weak point. If Jin-Woo is caught in a
        stalemate or tight position, he will then activate ''Intimidation'' to induce
        ''Fear'' and decrease the opponent''s stats by 50%. Against those with murderous
        intent against him, Jin-Woo will fight with the intent to kill as quickly
        and efficiently as possible, as due to the nature of the system, he himself
        will die if he does not. |-|Shadow Monarch= Immediately upon entering a battle,
