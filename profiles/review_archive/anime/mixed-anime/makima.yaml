    - field: attack_potency
      value: 'Varies (As the devil embodying the fear of control, the more feared
        she is, the more powerful she becomes,Chainsaw Man Chapter 6 even a relatively
        minor boost in fear can immensely boost a devil''s overall strength and the
        effects of their abilities.Chainsaw Man Chapter 148); Multi-City Block level+
        physically (She is implied to have punched gaping holes through the chests
        of a group of assassins and is stated to have ridiculous power by Akane.Chainsaw
        Man Chapter 28 By the end of Part 1, her physical abilities were powerful
        enough to keep up and eventually overpower a "clone" of Chainsaw Man with
        her bare hands to where she was able to rip off his limbs and punch holes
        into him. Was also able to decapitate Quanxi along with two of her fiends
        with a simple sword slash, albeit they had surrendered at that point.Chainsaw
        Man Chapter 70 Her power had forced most of the countries of the world to
        surrender to her and pushed the US President to release its portion of the
        Gun Devil against her.Chainsaw Man Chapter 75Upscales from 550 Tons of TNT),
        Small Town level+ with Usage: 1,000 Years (One-shot a weakening PochitaScales
        to 5.5 Kilotons of TNT), At least Town level, possibly Large Town level with
        Telekinesis (Powerful enough to one-shot characters such as Power,Chainsaw
        Man Chapter 81 even blowing off her limbs while she was in her Blood Devil
        form. Able to launch Part 1 Pochita into space with 4 telekinetic shots while
        drawing blood from him with each shot and even shattered one of his chainsaws.Chainsaw
        Man Chapter 88Upscales from 21.67 kilotons of TNT, possibly 108.35 kilotons
        of TNT)'
