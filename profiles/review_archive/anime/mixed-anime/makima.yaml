    - field: powers_and_abilities
      value: 'Through her Control powers, she is able to access a vast array of abilities,
        whether it be her minion''s innate abilities or abilities that she can reasonably
        access via contracts. Most notably these include the abilities of: *Devil
        Hunters: **Various Hunters ***BFR (As Makima has previously formed a contract
        with the Hell Devil before to escape from Hell, she should be able to do the
        reverse and sacrifice devil hunters to summon its hand to directly transport
        her target(s) to Hell.) **Akane Sawatari ***Sealing, Summoning & Non-Physical
        Interaction (By sacrificing one of her fingernails, her contract with the
        Snake Devil allows her to summon it to devour opponents and to store them
        for later use via spitting them out.Chainsaw Man Chapter 34 It''s capable
        of swallowing entities such as the Ghost Devil which normally is intangible.Chainsaw
        Man Chapter 15) **Aki Hayakawa ***Curse Manipulation & Limited Death Manipulation
        (Can utilize the Curse Devil''s powers through his nail-like blade, which
        can instantly kill those who have been pierced three times by itChainsaw Man
        Chapter 24 at the cost of lowering the summoner''s lifespan.Chainsaw Man Chapter
        18) ***Precognition (With his contract with the Future Devil, able to see
        a few seconds into the future.Chainsaw Man Chapter 35 The Future Devil can
        also see the future of whoever puts their head into its chest.) ***Non-Physical
        Interaction (Possesses a katana created by the Angel Devil which can cut through
        intangible beings such as ghosts.Chainsaw Man Chapter 41) *Devils & Fiends
        (General Devil/Fiend Physiology): **Beam ***Intangibility (Able to become
        intangible and swim through any surface from walls to the ground to the floor
        of a surface.) **Angel ***Life Absorption (Automatically absorbs the lifespan
        of anyone that touches him, even the slightest touch can take away 2 months
        of someone''s life.Chainsaw Man Chapter 50) ***Weapon Creation, Non-Physical
        Interaction & Possible Death Manipulation (Able to create weapons out of the
        lifespan that he absorbed with special properties such as being able to cut
        through ghosts and seemingly instantly kill upon contact.Chainsaw Man Chapter
        60) ***Possibly Regeneration (High-Mid) & Immortality Negation (Enhanced Type
        4; By using 1000 years of lifespan, was able to pierce through & mortally
        wound the Chainsaw Devil, despite his regenerationChainsaw Man Chapter 88
        & ability to always rise back up, no matter how many times he is killed.Chainsaw
        Man Chapter 84Chainsaw Man Chapter 104) **Prinz ***Intangibility (Able to
        turn intangible to hide in the ground for surprise attacks.) ***Portal Creation
        & Dimensional Travel (By opening the zipper on herself, she''s able to transport
        people across dimensions, such as Hell.) **The Zombie Devil ***Necromancy
        (Able to bring back the deceased as zombies.Chainsaw Man Chapter 94) ***Zombification
        & Corruption (Type 1; The zombies of the Zombie Devil can turn any human that
        they bite into more zombies.) *Hybrids (General Hybrid Physiology): **Barem
        Bridge ***Fire Manipulation (As the Flamethrower Hybrid, he''s capable of
        producing an immense amount of flames out of his flamethrowers.) **Samurai
        Sword ***Non-Physical Interaction (His katanas are capable of cutting through
        the attacks and slicing limbs off the Ghost Devil who is normally intangible.)
        **Quanxi ***Martial Arts (As Kishibe claims, if the entirety of humanity came
        together and held a bare-knuckle fighting tournament, she would take first
        place.Chainsaw Man Chapter 54) **Reze ***Explosion Manipulation (As the Bomb
        Hybrid, able to produce massive explosions via just some small sparks or from
        parts of her body.Chainsaw Man Chapter 48) ****Limited Flight (Able to use
        her own explosions like rockets to gain propulsion to simulate flight.Chainsaw
        Man Chapter 47) ***Duplication & Self-Destruction (Able to create a "decoy"
        version of herself by separating her head from her body which can self-detonate.)
        *Possible Contracts (General Devil/Fiend Physiology) - [See Note]: **Power
        ***Limited Blood Manipulation & Weapon Creation (Capable of freely manipulating
        her own blood, which she can do remotely, in order to create weapons.Chainsaw
        Man Chapter 31 Also able to manipulate the blood of others through direct
        touch, though she calls this difficult.) **Cosmo ***Mind Manipulation, Information
        Manipulation & Madness Manipulation (Types 1 and 3; Can bring people inside
        her own mental space where she can force them to retain the knowledge of everything
        there is in the universe, making them lose the capability of thinking about
        anything other than Halloween until they die.) **Pingtsi ***Information Analysis
        (Through using her hair and hand similarly to a scope, she''s able to discern
        what devil contract one has and the condition of that body as well.Chainsaw
        Man Chapter 61) **Santa Claus ***Dollification (Their contract with the Doll
        Devil allows them to be able to turn any human that they touch into dolls,
        even if the touch is on just their clothes.) **Kat'
