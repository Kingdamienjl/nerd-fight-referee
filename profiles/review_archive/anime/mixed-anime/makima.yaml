  intelligence:
    text: 'At least Genius. As the leader of multiple devil extermination units, Makima
      has years of experience leading devil hunters against other foes, given her
      high rank. True to her nature as the Control Devil, manipulation and methodical
      calculations are core parts of her character to where she planned out everything
      that happened to Denji throughout Part 1, including the deaths of both Power
      and Aki in order to eventually break him. Even without her Control powers, she
      could still manipulate Denji into trusting and falling for her even after Makima''s
      reveal as the mastermind of his undoing.Chainsaw Man Chapter 2 Likewise, she
      was also able to manipulate almost every member of the Public Safety Devil Hunters,
      such as the merge between Special Division 1, 2, 3 and 4 under her control,Chainsaw
      Man Chapter 28 into bringing out an outcome where Denji would offer himself
      to her with no resistance, even against the likes of Kishibe who despite his
      suspicions towards Makima decided to not to interfere with her business until
      it was too late. Possibly Omniscient with the Cosmos Devil. The Cosmos Devil''s
      mind contains the sum of all the knowledge of the universe. At least Gifted.
      Her many years of experience leading devil hunters against other foes can be
      display during her fight with a "clone" of Pochita where she was able to keep
      up and eventually defeat him despite him retaining knowledge on Denji''s special
      training with the likes of Kishibe, who was stated to be the "strongest devil
      hunter there is" and able to briefly keep upChainsaw Man Chapter 62 with his
      former partner Quanxi, who is so skilled that she is regarded to be able to
      be able to win against anyone in the world in a pure bare-knuckle fighting.
      In fights, she also has shown to be able to smartly use combinations of her
      abilities and the environment to best counter her opposition. An example can
      be seen with her use the Zombie Devil to counter Power''s internal blood manipulation
      or with her making Chainsaw Man into a public hero, stripping him of power that
      devils receive by being feared. Standard Tactics: *As a result of her being
      the devil that embodies control itself, she claims that she can promptly control
      the minds of any life-form she considers to be lower than herself, only beings
      such as Pochita, who Makima adores to a point where she would call herself a
      fan of his, and powerful beings such as the Darkness Devil are generally out
      of her immediate control. In spite of her claims, there have been plenty of
      other characters that Makima doesn''t seem to have been placed under her control
      before such as Kishibe, Kobeni, the Anti-Makima Squad, etc. This can be explained
      however with that she simply didn''t care enough to place them under her control
      as their overall threat to her was perceived to be minuscule and never really
      felt the need to use them. *Against opponents she cannot or does not choose
      to immediately control until she proves herself being able to properly defeat
      them, Makima generally prefers to stay in the shadows while manipulating or
      controlling others to perform the battles for her but when the situation is
      right or when it calls for it, she''ll typically use her overwhelming telekinetic
      powers to quickly and mercilessly end a fight. Only in rare situations against
      opponents who she deeply respects or/and admires such as Chainsaw Man will she
      choose to personally engage with them with just her bare hands. However, during
      fights, due her damage transference contract, Makima generally does not care
      nor try to avoid any incoming attacks no matter what threat it poses to her.'
    source_ids:
    - vsbattles-makima-mixed-anime
    confidence: 0.6
    notes: auto_repair source extraction
