      an alchemical lab. Quickly came up with a plan to attempt to beat Roy Mustang
      in a fightChapter 12.5. Izumi Curtis considers Edward a geniusChapter 25Chapter
      20. Learned alchemy at a very young age just by reading about itChapter 21.
      Learned how to start fires and get food in a wild island and even fight when
      he was still a childChapter 22. Also performed a soul transmutation at such
      a young age, which Roy Mustang considered very impressiveChapter 24 and convinced
      him he could pass the state alchemist exam, which he did at the age of 12, becoming
      the youngest one in historyChapter 42. Ed''s gift in alchemy is also accompanied
