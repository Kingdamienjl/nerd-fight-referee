- id: claim-powers-and-abilities-41d03a27
  section: abilities
  axis: hax
  text: Physical= Superhuman Physical Characteristics, Genius Intelligence, Martial
    Arts and Weapon Mastery (Despite his young age and incredibly short size, Edward
    is a very skilled hand-to-hand fighterChapter 1, a skill which he constantly hones
    by sparring with his brotherChapter 9, who he also has amazing teamwork withChapter
    72. Edward has shown the ability to dodge constant barrages of attacks from his
    enemiesChapter 12, putting his great agility to good use, or deflect them even
    with just one armChapter 87, grapple enemies far stronger than him by using their
    weight against them and use his alchemy to aid himself in combat in many waysChapter
    28, such as shooting the ground underneath him upwards as a springboard, or destroying
    his constructs to throw dust in his enemies' eyes), Acrobatics (Can deliver acrobatic
    attacks mid-fight such as handstand kicks, and is able to use those abilities
    to dodge attacks so well he has been compared to a monkey. Can use walls, his
    own alchemy and even his enemies as springboards to move through adverse situations
    swiftlyChapter 47), Cyborgization (Partial. Edward's right arm and left leg are
    missing and have been replaced with automail, highly advanced mechanic prosthetic
    limbs that serve him just as well as any organic ones would in combat), Breaking
    the Fourth Wall (Prevented the reader from seeing his height. Complained that
    Alphonse was so strong that the manga's title should have been changedChapter
    33), |-|With Alchemy= All abilities inherent to Alchemy, Earth Manipulation, Weapon
    Creation (Often creates spears to fight, or turns his automail into a bladed weaponChapter
    2), Limited Sealing, Limited Non-Physical Interaction, Life Manipulation and Soul
    Manipulation (Bound his brother's soul to a suit of armor, Can power up his alchemy
    to perform otherwise impossible feats by sacrificing some of his lifespanChapter
    77), Healing (Could heal a large hole in his midsection by sacrificing some of
    his life force), Transformation and Soul Manipulation (Turned himself into a Philosopher
    Stone, aka an object powered by his own soul), Portal Creation and Dimensional
    Travel (Those who attempt human transmutation will be taken to meetChapter 23
    Truth when it inevitably fails, a fact that Edward has used to his own advantage
    to escape Gluttony's pocket dimension)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
