    gloves, then changing the concentration of the oxygen in the air to favor the
    fire's expansionChapter 5. Mustang typically uses his fire alchemy to cause explosionsChapter
    4, but can also shoot streams of fireChapter 93 and focus his attacks well enough
    to target an enemy's vital points such as their tongue of eyesChapter 94), Non-Physical
    Interaction (Fire Alchemy can affect gases such as the air and liquids such as
    waterChapter 38), Minor Healing (Knows healing alchemy, though he is not too skilled
