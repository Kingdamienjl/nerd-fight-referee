        \ having the necessary chakra natures. Naturally, the user also needs to actually\
        \ see the technique they are attempting to copy, meaning they cannot copy\
        \ something they did not see or is obscured from their line of sight. In fact,\
        \ the same can be said for essentially all of the Sharingan's abilities; they\
        \ are sight based abilities, so if the opponent can obscure the user's vision\
        \ using extremely thick mist/dust or blind them, the Sharingan's abilities\
