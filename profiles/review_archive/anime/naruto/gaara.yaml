    \ Madara's Truth-Seeker Orb shield before 8th Gate Guy could propel himself towards\
    \ it.Jin no Sho Page 77Naruto Chapter 660Naruto Chapter 6691 c) | At least FTL\
    \ | FTL+ (Used his sand to close the distance between Darui and MomoshikiBoruto:\
