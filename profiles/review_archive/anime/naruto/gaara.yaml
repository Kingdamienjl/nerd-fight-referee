    \ Paralysis Jutsu, Shinobi can completely paralyze their targetsRin no Sho, Page\
    \ 176 from close to mid range) **Air Manipulation (Able to utilize Wind Style)\
    \ **Electricity Manipulation (Able to utilize Lightning Style) **Earth Manipulation\
    \ (Able to utilize Earth Style) **Sand Manipulation ***Instinctive Reaction (Gaara's\
    \ sand will protect him independently from his will) ***Barrier Creation (Gaara's\
    \ sand acts independently and will always defend him) ***Extrasensory Perception\
    \ with Sand Eye ***Flight (True Flight; Can use his sand as a form of flight for\
    \ himself and others) ***Sealing (Can seal opponents with his Sand jutsu, like\
    \ Giant Sand Seal) *Jinch\u016Briki: **Multiple Selves (All Types; As a Jinch\u016B\
    riki) **Non-Physical Interaction (Soul; Tailed Beast Chakra Arms users can physically\
    \ interact with intangible objects like their soul when it's halfway extracted\
    \ from them) *Self-Sleep Manipulation (Can force himself to fall asleep to transfer\
    \ control of his body to Shukaku) *Body Control Resistance to: *Paralysis Inducement,\
    \ Body Puppetry & Possession (Tailed Beasts and their Jinch\u016Briki are capable\
    \ of of resisting the binding effects and controlNaruto, Chapter 444: \"The Response\"\
    Naruto, Chapter 567: \"Jinch\u016Briki of Konoha\" of the Rinnegan's Black Receivers)\
    \ }} |-|Kazekage Rescue Arc=All previous abilities on a greater scale |-|Fourth\
    \ Shinobi World War Arc=All previous abilities except Jinch\u016Briki related"
