    \ of Sasuke needing to predict his movements beforehand with the Sharingan just\
    \ to avoid death) | Subsonic+ (At least as fast as before) with Massively Hypersonic\
    \ reaction speed (Managed to react to CS2 Kimimaro's charge and erected a shield\
    \ to intercept him.Naruto, Chapter 216: \"Halbert and Shield...!!\" Reacted to\
    \ CS2 Kimimaro's tail swipe and blocked it with his sand. Reacted to and stopped\
    \ CS2 Kimimaro's VineMach 291.69), Massively Hypersonic with the Sand Shield (Intercepted\
    \ CS1 Kimimaro's attack in order to save Lee. Blocked Kimimaro's Teshi Sendan.Naruto,\
    \ Chapter 213: \"Debt...!!\" His Sand Shield was capable of intercepting numerous\
    \ attacks from CS2 Kimimaro. Managed to tag CS1 Kimimaro with his Sand Tsunami;\
    \ however, it should be noted that the sheer scale of the attack was likely a\
    \ major contributing factor) | At least Sub-Relativistic (Can keep up with Deidara\
    \ and react to his explosivesNaruto Chapter 2480.028 c) | Relativistic (He intercepted\
    \ A\u2019s Guillotine Drop from a fair distance away\u2014though the feat is somewhat\
    \ mitigated by the Raikage\u2019s free fall momentum. He also reacted to Madara\u2019\
    s Susano\u2019o attacks alongside \u014CnokiNaruto Chapter 464Naruto Chapter 5630.14\
    \ c) | FTL (Gained more strength after meeting both Rasa and Shukaku. Capable\
