      source_id: mediawiki-hidan-naruto
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: '*Triple-Bladed Scythe: The Triple-Bladed Scythe is the primary weapon
        of Akatsuki-member Hidan. Its main purpose is to aid him in collecting blood
        for his curse ritual. Because of this, it is designed not so much to kill
        the target, but to wound them, no matter how big or small the wound. The three
        blades get smaller from top to bottom, giving the scythe a larger range despite
        decreasing its lethality. The scythe is attached to a long metal cable, wound
        around two spools on Hidan''s left hip. This cable is strong enough to block
        kunai and allows Hidan to further increase the scythe''s range by swinging
        it through the air. The scythe can split up and it has various other functions
        that were never shown. Due to its large size, Hidan claimed that it greatly
        inhibits his attack speed, and it makes him the slowest member in Akatsuki.
        Despite this, he is remarkably nimble in manipulating it, even being capable
        of using the scythe to deflect incoming shuriken. *Retractable Spear: This
        weapon is used by Hidan mostly in his Jashin rituals. The spear is a retractable
        cylinder that can be extended to its full size quickly. It is regularly used
        as Hidan''s main killing move during his ritual, by stabbing himself in the
        heart. Hidan''s rituals are usually long due to him liking to toy with his
        opponent, such as stabbing himself in several different areas of his body,
        to make them suffer before finishing them off. Hidan may also use it for combat,
        although this has only been shown to be used as a last resort when his Triple-Bladed
        Scythe was unavailable to him. He is shown to hide at least two of these spears
        in his Akatsuki cloak.'
      source_id: mediawiki-hidan-naruto
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Average (Hidan's intelligence is not very high, yet is he capable of
        fundamental analysis after he was captured by Shikamaru's shadow several times)
      source_id: mediawiki-hidan-naruto
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'The Death Controlling Possessing Blood requires two special conditions
        to function: the user drawing an insignia of Jashin on the ground with their
        own blood and standing at the center of it, and ingesting the blood of their
        intended victim. If these two conditions are not met, the damage to Hidan
        would not be shared with his victim. Hidan is unable to move his body if it
        is separated from his head, such as by decapitation, thus rendering him helpless
        unless the head is reattached to the body. Although unable to die from most
        causes, Hidan can still die from malnutrition. Notable Attacks/Techniques:
        *Jujutsu: Jujutsu (literally meaning: Curse Technique) are a type of techniques
        that harm the enemy by cursing them. They work similar to juinjutsu, however,
        the user doesn''t have to apply a seal on the enemy to curse them. **Curse
        Technique: Death Controlling Possessed Blood: The Curse Technique: Death Controlling
        Possessed Blood is the exclusive jujutsu technique of Hidan and his primary
        method of killing his opponents under Jashinism. The technique requires two
        special conditions: One being that Hidan must have drawn an insignia of Jashin
        on the ground in his own blood, to which he must remain in the centre for
        the technique to function properly. The other being him to acquire and ingest
        the blood of his intended victim. Once ingested, his skin then turns black
        with white markings which makes him look like a skeleton, a symbol of absolute
        death. This serves as the link between him and his victim. Once his sacrificial
        ritual takes place, the victim''s body is linked with Hidan''s curse until
        he either steps or is forced out of the circle. Any kind of injury that Hidan
        inflicts upon himself (or the injury they inflicted on him) is reciprocated
        on his target, be it a mere scratch to a pierce in the heart. If Hidan is
        forced to step out of the circle, the link is temporarily broken and the victim
        is set free, but only as long as Hidan has stepped out of the circle''s reach.
        Basically, this technique makes Hidan a living voodoo doll. 1267.gif|Jashin
        Ritual with Kakuzu 1265.gif|Jashin Ritual with Yugito 1268.gif|Hidan vs Asuma
        1264.gif|Hidan vs Kakashi 1269.gif|Hidan vs Orochimaru and Kakuzu (Storm Revolution)
