        that harm the enemy by cursing them. They work similar to juinjutsu, however,
        the user doesn''t have to apply a seal on the enemy to curse them. **Curse
        Technique: Death Controlling Possessed Blood: The Curse Technique: Death Controlling
        Possessed Blood is the exclusive jujutsu technique of Hidan and his primary
        method of killing his opponents under Jashinism. The technique requires two
        special conditions: One being that Hidan must have drawn an insignia of Jashin
        on the ground in his own blood, to which he must remain in the centre for
        the technique to function properly. The other being him to acquire and ingest
        the blood of his intended victim. Once ingested, his skin then turns black
        with white markings which makes him look like a skeleton, a symbol of absolute
        death. This serves as the link between him and his victim. Once his sacrificial
        ritual takes place, the victim''s body is linked with Hidan''s curse until
        he either steps or is forced out of the circle. Any kind of injury that Hidan
        inflicts upon himself (or the injury they inflicted on him) is reciprocated
