  stamina:
    text: 'Superhuman (He has a considerable amount of chakra in his base form. He
      got up, ran to Kushina, and used a Sealing Jutsu immediately after being slashed
      across the chest. Even after being stabbed through his torso, he maintained
      his Sealing Jutsu and sent his chakra inside Kushina to battle Kurama. Minato
      across the Third Shinobi War was known for clearing out several battlefields
      across the globe in succession by teleporting to various points across countries.Naruto,
      Chapter 242: "Chronicle 4: The Crybaby Ninja" Minato could additionally suppress
      Kurama for hours while Kushina was giving birth, stopping his attempts to break
      free from the weakening seal. Even after all of the events of the Nine-Tails
      attack, where Minato had to expend large amounts of Chakra by defeating Obito,
      consistently teleporting across countries, teleporting massive Tailed Beast
      Bombs to the ocean, and teleporting the Nine-Tails himself, all in succession,
      Minato, while on low Chakra could still split Kurama in half, seal one half
      in himself, and after getting stabbed through the chest and having his soul
      consumed by the reaper, could not only use the Summoning Jutsu to summon Geortora
      and give him a sealing key, he could still use another high level seal to confine
      the remaining half of Kurama in Naruto. Even being able to use Sage Mode requires
      extremely large Chakra reserves.Naruto, Chapter 412: "Quivers of Anticipation"
      Even the famous Orochimaru, a powerful ninja hailed as one of the legendary
      Sannin, did not have a body with Chakra Reserves capable of withstanding Sage
      Mode.Naruto, Chapter 579: "Uchiha Brothers United Front!!" Senjutsu also enhances
      Minato''s stamina, as it does not actually use up his own reserves, but the
      natural energy he had previously built up.)'
    source_ids:
    - mediawiki-minato-namikaze-naruto
    confidence: 0.6
    notes: auto_repair source extraction
