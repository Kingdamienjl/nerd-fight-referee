    - field: weaknesses
      value: "Sometimes acts without thinking. Incapable of utilizing the Six Paths\
        \ Chibaku Tensei and Majestic Attire Susano'o without Sasuke. The Baryon Mode\
        \ only lasts for a limited amount of time and gradually weakens him overtime\
        \ Notable Attacks/Techniques: Hide/Show |-|Transformations= {{#tag: tabber|\
        \ Sage Mode= ===Sage Mode === Sage Mode is a state that can be activated by\
        \ mixing natural energy with chakra, creating senjutsu chakra. It allows users\
        \ to tap into the natural power of the world, granting new techniques to them\
        \ and allowing them to be able to apply senjutsu chakra to their ordinary\
        \ techniques. After gathering an amount of natural energy around themselves,\
        \ users can learn to draw nature's energy into them by mixing it with their\
        \ own chakra, adding a new dimension of chakra power by adding natural energy.\
        \ This chakra cannot be seen by someone who has not been trained in senjutsu.\
        \ It also allows the user to enter a vigorous state, which can dramatically\
        \ increase the strength of all ninjutsu, genjutsu, and taijutsu. {{!}}-{{!}}\
        \ Kurama Mode and Kurama Chakra Mode= ===Kurama Mode and Kurama Chakra Mode===\
        \ As with all jinch\u016Briki transformations, Kurama Mode gives the user\
        \ increased stamina, speed, and defense. The Kurama Mode augmentations are\
        \ noticeably superior: Naruto becomes strong enough to push a fully formed\
        \ Tailed Beast Ball through a multi-layered barrier with just one arm, neutralize\
        \ the White Zetsu with a single kick despite its durability, and, in collaboration\
        \ with Killer B in his full Eight-Tails form, take down the Outer Path Demon\
        \ Statue with one punch. Naruto's speed is so great in this form that B had\
        \ trouble determining whether he had used the Body Flicker Technique when\
        \ he attacks Kisame Hoshigaki. He could even surpass the speed of a fully\
        \ charged A (Fourth Raikage), as well as the Third Raikage's extremely fast\
        \ attack before the latter had any chance to react. Naruto's durability is\
        \ also very high in this form, as he was able to withstand extreme heat with\
        \ only minor burns, and withstand the Tenpenchii of Ten-Tails, suffering only\
        \ minor physical injuries and losing his cloak. The user is also able to create\
        \ chakra arms while in this form, which can be used to improve dexterity and\
        \ maneuverability, to give him a way to interact with his environment and\
        \ opponents. Naruto used his arms as shadow clone substitutes in his creation\
        \ of many Rasengan variants. He can use his hand in conjunction with a chakra\
        \ arm to perform the shape transformation in the Rasengan, and multiple chakra\
        \ arms to perform the shape and nature transformation of the Rasenshuriken,\
        \ which he is able to throw while in this mode. Once the variant Rasengan\
        \ are formed, Naruto can use the chakra arms to deliver them across long distances\
        \ or, in the case of the Rasenshuriken, direct them towards their target.\
        \ Initially, Naruto attempted to create a technique related to the Tailed\
        \ Beast Ball: Tailed Beast Rasengan. However, he later developed a more effective\
        \ version of this technique: the Super Mini Tailed Beast Ball, a miniature\
        \ of the Tailed Beast Ball that he is able to control with the help of a shadow\
        \ clone. Like his predecessor, Mito Uzumaki, Naruto gains Kurama's ability\
        \ to sense negative emotions, something that even the best sensor-type ninja\
        \ cannot do. Furthermore, he is able to sense Kurama's chakra signature even\
        \ when inside a chakra isolation chamber, as well as detect from other chakra\
        \ signatures across great distances. The chakra of this form gives immense\
        \ life force such that Wood Release techniques react to the life-giving properties\
        \ of the chakra and mature into full-grown trees in a matter of seconds, either\
        \ through contact or proximity. Using Kurama Chakra Mode was initially a risk,\
        \ as Naruto had to temporarily \"bottleneck\" his own chakra in order to access\
        \ the chakra he removed from Kurama, during which time he could drain Naruto's\
        \ own chakra. If Kurama managed to drain all of Naruto's chakra, Naruto would\
        \ die. The shadow clones provide an additional risk, as Kurama would absorb\
        \ every portion of Naruto's chakra even faster for each clone he made. In\
        \ addition, Naruto also had to be careful with the amount of time he spent\
        \ in this mode as there was a limit to how much chakra he could get away from\
        \ Kurama. Despite these risks, once he became involved in the Fourth Ninja\
        \ World War, Naruto deployed several shadow clones while he was in this mode\
        \ and even managed to stay in shape for an entire night. Gy\u016Bki attributed\
        \ this to the fact that Kurama had purposely stopped taking Naruto's chakra.\
