    - field: weaknesses
      value: 'Using the incomplete Rasenshuriken damages him. Sage Mode has an energy
        limit (Using Rasenshuriken too many times causes him to revert to his Base
        Form). Can be an utter and complete idiot at times. Version 2 of his Nine-Tails
        Cloak leaves him in a frenzied state where he cannot reason and differentiate
        friend from foe. In it''s intial usage, his Tailed beast Mode supposedly lasts
        for only 8 minutes (Not the case anymore as this timeframe was extended throughout
        the war). Incapable of utilizing the Six Paths Chibaku Tensei and Majestic
        Attire Susano''o without Sasuke. ==Standard Tactics== {{Border|Scroll=yes|Visible=Yes|Padding=Yes|Content=
        *Base: Naruto''s fighting style depends on who he is facing, but it heavily
        incorporates the Shadow Clone Jutsu, which is almost always his starting move.
        Clones are generally used as support for Naruto, helping Naruto in situations
        where he finds himself to be at a disadvantage of any kind. Clones serve to
        distract enemies and discover their abilities, among other information that
        is then relayed to Naruto once the clone is destroyed. Combined with his intelligence,
        Naruto manages to deceive characters much more experienced and powerful than
        himself. It is common for Naruto to attempt to overwhelm his opponent with
        a massive number of clones, and if the opponent is too strong for that to
        work, he will use the clones as distractions in order to create openings to
        attack the opponent from. Facing an opponent with summons or large sized opponents
        would prompt Naruto to summon Gamabunta to aid him in battle. **Preparation:
        If Naruto is given preparation time, he can and will use Sage Mode, provided
        it''s not restricted by the OP in VS Matches. Naruto can use summons like
        Gamabunta, Gamahiro, Gamaken, Fakasaku (Pa) and Shima (Ma), to help him during
        battles, adding more abilities to Naruto''s arsenal, such as sound-based Genjutsu.
        Naruto can also change the battlefield to his favor, creating clones and using
        the Transformation Jutsu to make them look like rocks, woods or whatever else
        the situation calls for. *Sage Mode: Being far more versatile and powerful
        in Sage Mode, Naruto would also start using clones, combining with various
        equipment such as smoke bombs, to deceive the opponent and create openings,
        which he will then exploit. Naruto relies on his summons more often in this
        form. He can utilize his summons to separate the enemy''s forces, and disorient
        them with sound-based illusions, or simply overwhelm them with numbers. Naruto''s
        senses are extremely heightened in this form, and he is granted sensory capabilities
        that allow him to feel incoming attacks, sense impending danger, sense life-forces
        and emotions, and detect targets and events from thousands of kilometers away.
        Relying on these sensory capabilities more now means he would not attack rashly
        at the first opportunity, but would instead wait for the correct opportunity
        to counterattack effectively. He also mastered a new form of martial arts
        known as Frog Kata (Kawaze Kumite). This greatly increased his skill in Taijutsu,
        and made him far more dangerous in close quarters combat thanks to his ability
        to use nature as an invisible extension of his body, essentially increasing
        his melee range, and the ability to ignore durability by doing internal damage
        to targets using Frog Strike. Naruto is also able to use the Rasenshuriken
        without any drawbacks to himself now. *Kurama Chakra Mode **Before Kurama''s
        cooperation: In this form, Naruto will use Shunshin more often than before
        to overwhelm his opponets with speed, intercept their attacks from great distances,
        or dodge them in order to avoid damage. He is capable of freely abusing varioust
        types of Rasengans, some of them being able to cause cellular damage and slow
        down regeneration up to Low-Godly. Naruto will also use chakra arms of varying
        sizes, which helps him create more Rasengan variants more easily, increases
        his mobility and versatility, and greatly aids him in combat by offering extra
        range and limbs. **After Kurama''s cooperation: Naruto is able to use and
        spam Biju Bomb, even being able to use them with different sizes. Being able
        to use the Kurama Avatar, Naruto''s durability and attack potency increases.
        Naruto can, and will be able to spam clones with Rasenshurikens to deal with
        his opponent. **With Sage Mode: Sage Mode makes Naruto stronger and more durable.
        He is able to attack with Senjutsu, making his attacks and his energy unable
        to be absorbed due to Standard Battle Assumptions, since Chakra is what is
        equalized, not Senjutsu. *Six Paths Sage Mode: Being able to fly and "understand
        all things" makes Naruto able to control and manipulate his Truth-Seeking
        Ball, being able to erase the target and nullify energy-based attacks equalized.
        Naruto is also invulnerable, as only attacks with Senjutsu would work on him.
        Naruto was seen sealing an enemy that couldn''t be defeated by normal means.
        }} {| cla'
