      value: "Self-explanatory Note: This page contains crucial information; please\
        \ refrain from any editing to ensure data integrity and accuracy. Unauthorized\
        \ modifications may result in unintended consequences and jeopardize the document's\
        \ reliability. ==Explanations & Related Blog Posts== \"Sasukes not Pain why\
        \ does he have pain abilities?\" (Explanation #1): Pain's abilities are caused\
        \ by the Rinnegan's six paths technique, its stated that anyone whom possess's\
        \ the Rinnegan are capable of using all of their individual abilities, and\
        \ this statement is backed by the fact we have quite literally seen him use\
        \ the Paths of Pains abilitys, one specific instance is when he used Chibaku\
        \ Tensei to trap all 9 Bijuu in large planetoids in order to use the chakra\
        \ from them to create Indra's Susanoo as well as Indra's Arrow, another thing\
        \ that adds consistency to the idea of every Rinnegan user being able to use\
        \ all of the Pain's techniques is for starters Obito being capable of summoning\
        \ the Gedo statue on multiple occassions, him physically using the paths of\
        \ pain technique himself on 6 of the the 9 jinchuriki, as well as using the\
        \ Demonic Chains of the Outer Path. The abilities of the six paths of pain\
        \ are going to be within every page where the individual has a Rinnegan, this\
        \ includes Nagato Uzumaki's, Obito Uchiha's, Madara Uchiha's, Hagaromo Otsutsuki,\
        \ and Kaguya Otsutsuki (as well as Momoshiki and Urashiki) \"Why is Izanagi\
        \ in resistances?\" (Explanation #2): Multiple reasons, the first being the\
        \ fact that the sharingan is stated to see past any and all illusions and\
        \ mind tricks that being Genjutsu and has proven this on multiple occasions,\
        \ aswell as being backed by Kakashi's idea that only a Sharingan would be\
        \ capable of dealing with Tsukuyomi in his fight against Itachi. Another thing\
        \ to back this idea of Sasuke not being effected by the Genjutsu within the\
        \ main series of Naruto and Naruto: Shippuden is the fact he broke through\
        \ Tsukuyomi, which is thought to be the most powerful genjutsu and is stated\
        \ as such by Black Zetsu whom has existed since Kaguya's sealing and has seen\
        \ all of shinobi history, He broke through Tsukuyomi with a basic pair of\
        \ 3 tomoe Sharingan and is confirmed that even the basic pair of sharingan\
        \ can be used in comparison to and maybe even equal to that of a Mangekyo\
        \ depending on the prowess of the user which would mean that Sasuke logically\
        \ is capable of deterring lesser-genjutsu and considering Izanagi is just\
        \ that i placed it within the resistances. ===Related Blog Posts=== * Why\
