    - field: weaknesses
      value: "His fighting style is primarily limited to taijutsu. There is a small\
        \ blind spot near the back of his neck, which his vision can not cover. Notable\
        \ Attacks/Techniques Byakugan (White Eye): This eye technique is the kekkei\
        \ genkai of the Hy\u016Bga clan and one of the Three Great D\u014Djutsu. Wielders\
        \ of this eye can see long distances (at least up to 10 kilometers) and can\
        \ see objects that are too small for the ordinary eye to detect (such as the\
        \ tenketsu points on a human's body). The Byakugan has an almost perfect 360-degree\
        \ field of vision, though there is a small blind spot located near the back\
        \ of the user's neck. The eye can also see through objects as well as many\
        \ barriers and can see chakra. Juuken (Gentle Fist): By taking advantage of\
        \ the Byakugan, the user can see a person's chakra pathway system. Juuken\
        \ inflicts internal damage through attacking the body's Chakra Pathway System\
        \ by injecting chakra into specific pressure points (tenketsu), subsequently\
        \ injuring internal organs that are closely intertwined with the pathways.\
        \ Once these tenketsu points are struck, they are in turn sealed and can no\
        \ longer produce chakra for a certain amount of time, severely limiting the\
        \ victim's chakra flow., Hakkeshou Kaiten (Eight Trigrams Palms Heavenly Spin):\
        \ The user releases chakra from all of the tenketsu points on their body and\
        \ spins rapidly to create a small omnidirectional vortex of chakra that can\
        \ be used for defensive purposes., Hakke Rokujuuyon Shou (Eight Trigrams Sixty-Four\
        \ Palms): By utilizing the Byakugan's ability to pinpoint a person's tenketsu\
        \ points, the user will strike 64 of the victim's 361 chakra points to seal\
        \ off their chakra flow and inflict internal damage., J\u016Bkenp\u014D Ichigekishin\
        \ (Gentle Fist Art Single Body Blow): A close-range technique which allows\
        \ the user to expel a forceful blast chakra from all of their tenketsu points\
        \ at once. Similar to Kaiten, Hakke Kuhekisho (Eight Trigrams Empty Wall Palm):\
        \ A combination attack involving two Juuken users who simultaneously strike\
        \ a target with their Hakke Kuushou (Eight Trigrams Empty Palm) technique.\
        \ Neji uses this jutNO in combination with Hinata."
      source_id: character-stats-profiles-neji-hy-ga-naruto
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
