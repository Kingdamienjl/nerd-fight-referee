  stamina:
    text: "Superhuman Kisame's chakra reserves were constantly stated to powerful\
      \ and massive throughout the series. The first case emphasising Kisame's chakra\
      \ was Nagato (Pain) stating that Kisame had the largest amount of chakra in\
      \ the Akatsuki, this is significant because the Akatsuki contained chakra monsters\
      \ like Nagato himself. Kisame's chakra reserves initially with a 30% clone were\
      \ said to be greater than anyone Neji had ever seen before since Naruto. In\
      \ this weakened state, he was able to create a massive amount of water as far\
      \ as the eye could see in his battle against Team Guy with just a fraction of\
      \ his chakra, and this is stated in Sha no Sho to be because of his enormous\
      \ chakra reserves, comparable to that of Naruto, which makes the scale of his\
      \ ninjutsu is incredible.Sha no Sho, Page 167 Karin stated his chakra was humongousNaruto\
      \ Chapter 380, page 14 when Kisame approached Hebi. Kisame's chakra volume were\
      \ comparable to those of jinch\u016Briki. Chojuro stated that Kisame had jinch\u016B\
      riki-level chakra volumeNaruto Chapter 468, page 9 which when fused with Samehada\
      \ resulted in him becoming like a bij\u016B, outputting jinch\u016Briki-like\
      \ power, when cautioning the Gokage of him. Kisame was able to absorb all of\
      \ Killer B's chakra, including almost all of Gy\u016Bki's chakra ,Naruto Chapter\
      \ 472, page 13 without going insane or dying.Naruto Chapter 471, page 11 This\
      \ replicates a similar feat to Kinkaku and Ginkaku whereas others who attempted\
      \ to eat the Gy\u016Bki's chakra meat through his tentacles died.Naruto Chapter\
      \ 529, page 4 Kisame has a high pain tolerance. When Bee's Lariat blew his chest\
      \ open, he shrug it off by smiling and sarcasm. When captured on Turtle Island,\
      \ he bit off his own tongue in order to avoid giving up intel, and willingly\
      \ allowed himself get eaten alive by sharks without making a single noise)"
    source_ids:
    - mediawiki-kisame-hoshigaki-naruto
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Several Meters with Samehada, Kilometres with Suiton,
      Interdimensional with Summoning
    source_ids:
    - mediawiki-kisame-hoshigaki-naruto
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "At least Above Average Despite seeming to be merely quick-tempered, bloodthirsy\
      \ and bellicose, Kisame has been shown to be very observant and tactical, in\
      \ truth, a more analytical thinker. He realised Killer B's tactics very quickly\
      \ whilst battling him and was able to counter him. He attacked B's comrades\
      \ to trick B into melee range. He managed to fake his own death in order and\
      \ infiltrate Kumogakure undetected where he was able to gather intel for the\
      \ Akatsuki. The sensors in Kumogakure couldn't detect him because he shared\
      \ the same chakra signature with Samehada, and he was only foiled when Naruto\
      \ spontaenously gained the ability to sense emotions after gaining control over\
      \ Kurama's chakra and entering Bij\u016B Chakra Mode.Naruto Chapter 505 Before\
      \ he committed suicide, he placed a trap within a scroll that had intelligence\
      \ on the Shinobi Alliance to make sure it could still be delivered to his allies\
      \ even after his death. Kisame has shown the intelligence to dissect and understand\
      \ the mechanics of how his opponents' abilities work whilst fighting. He was\
      \ able to analyse Bee's Lightning Style mid-combat, which he deduced was more\
      \ piercing than Wind Style on average. He deduced and explained the mechanics\
      \ of Asakujaku after seeing it just a second time. Standard Tactics: Kisame\
      \ is naturally bloodlusted"
    source_ids:
    - mediawiki-kisame-hoshigaki-naruto
    confidence: 0.6
    notes: auto_repair source extraction
