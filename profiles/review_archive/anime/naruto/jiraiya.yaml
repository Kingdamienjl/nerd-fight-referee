  intelligence:
    text: "Genius Jiraiya was a legendary Shinobi of the highest pedigree as part\
      \ of Konoha's legendary Sannin. He graduated from the Ninja Academy at the tender\
      \ age of 6,Rin no Sho, Page 73Sha no Sho, Page 91 with the average graduation\
      \ age being 12 years old.Itachi Shinden: Book of Bright Light; Chapter 1, Page\
      \ 57 Jiraiya was able to complete the Ch\u016Bnin Exam's written test, which\
      \ included questions involving Trigonometry, Kinematics, among other topics\
      \ far too advanced for his age group.Naruto Chapter 41Naruto Chapter 44 The\
      \ examinees were expected to either solve the questions using their own knowledge,\
      \ or use a combination of their analytical abilities, powers of observation,\
      \ special abilities, and intelligence gathering skills in order to cheat the\
      \ correct answers, which was the trueNaruto Chapter 41 purposeNaruto Chapter\
      \ 44 of the exam. He was acknowledged for his abilities and skill by the likes\
      \ of Hanz\u014D, which is how he became part of the Sannin alongside Oorchimaru\
      \ and Tsunade.Naruto Chapter 369 He was a ninja of such great skill and renown\
      \ that even the likes of Kisame HoshigakiNaruto Chapter 144 and Kabuto YakushiNaruto\
      \ Chapter 162 openly admitted inferiority to him, despite their usual arrogance,\
      \ which is backed up by their own vast skills and abilities. Even a genius of\
      \ Amado's caliber thought so highly of Jiraiya and his abilities that he found\
      \ cloning him a worthwhile endeavor in his attempts to undermine Isshiki \u014C\
      tsutsuki and Kara.Boruto: Naruto Next Generations, Chapter 47 He was even praised\
      \ and greatly respected for his talent and skill as a Shinobi by the likes of\
      \ Minato Namikaze.Naruto Chapter 382 Jiraiya was also the first choice to be\
      \ the Fifth Hokage, which is a testament to his great power and skill, but also\
      \ his ability to manage the largest Shinobi village in the world.Naruto Chapter\
      \ 140 Jiraiya is also extremely observant, as he was able to deduce Sasuke and\
      \ Boruto's identities, as well as the fact that they're from the future from\
      \ what little information he was presented, which forced Sasuke to erase his\
      \ memories.Boruto: Naruto Next Generations, Episodes128-136 Jiraiya is a master\
      \ of Fuinjutsu, and knows a plethora of seals. His skill is so high that he\
      \ can effortlessly undo Orochimaru's Five Elements Seal,Naruto Chapter 91 create\
      \ sealing tags that can instantly suppress Kurama's chakra,Naruto Chapter 277Boruto:\
      \ Naruto Next Generations; Episode 131 and even have the ability to counter\
      \ and seal the likes of Urashiki \u014Ctsutsuki.Boruto: Naruto Next Generations;\
      \ Episode 133 Jiraiya was also a master ofespionage, intelligence gathering,\
      \ and infiltrationNaruto Chapter 367Sha no Sho, Page 91Sha no Sho, Page 92 This\
      \ allowed him to track down the Akatsuki, despite their extremely secretive\
      \ nature and the plethora of abilities that would allow them to avoid detection\
      \ at the members' disposal.Naruto Chapter 143 He was able to singlehandedly\
      \ deduce their goals to gather the Tailed Beasts, and even the fact that they\
      \ wouldn't go after Naruto for another three years. He also managed to track\
      \ down Orochimaru on a number of occasions, knew of his affiliation with the\
      \ Akatsuki, as well as him leaving the organization, and even had intel on his\
      \ Art of Immortality Jutsu.Naruto Chapter 143Naruto Chapter 237 He also found\
      \ out that Danz\u014D Shimura was conducting shady dealings behind the scenes,\
      \ and warned Tsunade about him and his organization, Root.Naruto Chapter 367\
      \ He was also able to discover the fact that the leader of the Akatsuki, Pain,\
      \ was located in Amegakure,Naruto Chapter 366 and he effortlessly infiltrated\
      \ the village.Naruto Chapter 367 He was then able to use his brilliant powers\
      \ of disguise in order to stealthily capture two local ShinobiNaruto Chapter\
      \ 368 and extract information regarding Pain out of them.Naruto Chapter 369\
      \ Once he was located and confronted by Konan and Pain, Jiraiya was able to\
      \ showcase his deductive, combat, and tactical intelligence in spades during\
      \ their extended battle. He was able to effortlessly figure out how to neutralize\
      \ Konan's intangible paper form, which was accomplished by completely covering\
      \ her in his adhesive oil.Naruto Chapter 372 This tactic restricted her movements\
      \ and allowed him to capture her with his hair.Naruto Chapter 372 Once he started\
      \ fighting Pain, he was confronted with the conundrum of figuring out his identity,\
      \ as well as his abilities, all while being engaged in mortal combat with him.\
      \ In the midst of fighting 3 Paths of Pain, he was analyzing their individual\
      \ abilities and formulating strategies to neutralize them. He quickly figured\
      \ out that each Path only possesses one main ability. He also figured out that\
      \ they all have a shared vision. Upon realizing that continuing to fight the\
      \ 3 Paths out in the open will lead to him being overwhelmed and killed, he\
      \ decided to use a diversion and retreat into an enclosed environment where\
      \ he had the upper hand.Naruto Chapter 378 While retreating, he was reviewing\
      \ his findings regarding Pain with Ma and Pa,"
