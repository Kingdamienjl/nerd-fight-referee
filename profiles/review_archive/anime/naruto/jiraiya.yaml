  stamina:
    text: Base= Superhuman. Jiraiya has strong and large chakra reserves, which allowed
      him to successfully achieve Sagehood.Naruto Chapter 412 He was able to endure
      a relatively long battle against Orochimaru,Naruto Chapter 166Naruto Chapter
      169 even though his chakra had been medically tampered with prior to the confrontation,
      leaving him unable to properly manipulate chakra.Naruto Chapter 165 He was also
      able to summon Gamabunta,Naruto Chapter 169 which takes a significantly large
      amount of chakra.Naruto Chapter 96 Jiraiya was also able to have a lengthy battle
      against Pain, where he used a large number of Ninjutsu and summoned powerful
      summons such as Gamaken, Ma, and Pa.Naruto Chapter 375Naruto Chapter 376Naruto
      Chapter 377Naruto Chapter 378 He was also resilient enough to endure losing
      his arm,Naruto Chapter 379 having another battle against the 6 Paths of Pain,
      then getting stabbedNaruto Chapter 381 and bleeding out, having his throat crushed,Naruto
      Chapter 381 being impaled by six rods, and finally seemingly dying, only to
      come back through sheer will in order to use his last remaining chakra to inscribe
      a secret message on Fukasaku's back to relay the information he'd discovered
      throughout his battle with Pain.Naruto Chapter 382 It should be noted that even
      after all of that damage he'd sustained and pain he'd endured, he still had
      the mental fortitude to quickly come up with and write a very complex coded
      message relaying all the information he'd learned |-|Sage Mode= Superhuman.
      With Sage Mode, Jiraiya's stamina increases significantly because he does not
      actually use up his own chakra, but rather the Senjutsu chakra he'd created
      by absorbing Nature Energy from his surroundings.Naruto Chapter 415 It should
      be noted that Sage Mode normally does not last for very long, usually around
      five minutes at most; however, Jiraiya does have a work around for this, which
      is to fuse with Ma and Pa in order to have them supply him with a constant flow
      of Nature Energy, making his Sage Mode seemingly endless.Naruto Chapter 420
