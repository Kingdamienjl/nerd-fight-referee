  attack_potency:
    text: "Varies (Pain's power varies depending on how many bodies are active at\
      \ a time and how far they are from Nagato ) from City level+ (Even with 6 bodies\
      \ active and being far away from Nagato, Pain can easily overpower Kakashi,\
      \ Ch\u014Dza, and Choji with his Shinra Tensei. With less bodies active, he\
      \ was able to trade blows with base Naruto, although he wasn't at full capacity\
      \ yet53.15 Megatons) to Country level (His Rain Tiger at Will technique is this\
      \ powerful, and he can easily maintain it for long periods of time over Amegakure\
      \ without draining himself. Casually caught a punch from Sage Mode Jiraiya.\
      \ Sage Mode Jiriaya admitted that the three Pains he was facing could kill him\
      \ if he fought them simultaneously.Naruto, Chapter 378: \"One to One...!!\"\
      \ The Animal Path could stab and wound Sage Mode Jiraiya, and his dog and bird\
      \ summons were capable of matching Gamaken, who's equal to GamabuntaSha no Sho,\
      \ page 657 Teratons), higher with Shinra Tensei (He easily dissipated Sage Mode\
      \ Naruto's Rasenshuriken with 3 bodies active, and later replicated the feat\
      \ with one body active while heavily exhausted.Naruto, Chapter 441: \"Rasen-Shuriken\
      \ vs. Almighty Push!!\" He easily sent Sage Mode Naruto and his clone flying,\
      \ which caused the clone to disperse and the original to groan in pain, with\
      \ a casual Shinra Tensei. Casually one-shot Gamabunta and Gamaken with a massive\
      \ Shinra Tensei, sending both flying outside the village and breaking all of\
      \ their bones), far higher with Chaotic Shinra Tensei (When Nagato focuses his\
      \ power on the Deva Path, his Shinra Tensei is dramatically enhanced), even\
      \ higher with Chibaku Tensei (His Chibaku Tensei is calculated to be this powerful.\
      \ It should be stronger than himself. It was also capable of overpowering KN6\
      \ Naruto and his Tailed Beast Bomb7 Teratons, possibly 14.9 Teratons) |-|Edo\
      \ Tensei"
    source_ids:
