  axis: weakness
  text: 'Being a puppet user he is highly vulnerable to close range fighters (However,
    he has come up with many ways of escaping it: he''s shown to act quite deceptively,
    switching places with his puppets using the Body Replacement Technique, also altering
    their appearances to resemble his, to escape close combat when an opponent gets
    too close, while at the same time putting his puppets in range of the enemy, allowing
    Kankuro to catch his foes off guard and kill them).'
  source_ids: *id003
  decisive: false
