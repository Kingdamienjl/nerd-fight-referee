  intelligence:
    text: Being one of the Fourth Kazekage's children who underwent the gruelling
      training of Sunagakure, Kankuro became a highly skilled and capable shinobi.
      Kankuro's skills improved considerably over the time-skip, becoming a jonin
      and later being chosen to lead the Surprise Attack Division during the Fourth
      Shinobi World War. He has shown himself to be a capable leader, having his division
      set up a miniature headquarters before assigning individuals to various roles.
      In addition, he has shown the tactical sense to call a retreat when outmatched
      as well as attack accordingly, and synchronise skills with his teammates for
      the most appropriate outcome. Kankuro is a highly talented puppeteer, indicated
      when Sasori, a renowned master of the Puppet Technique, complimented Kankuro's
      abilities.
    source_ids:
    - vsbattles-kankuro-naruto
    confidence: 0.6
