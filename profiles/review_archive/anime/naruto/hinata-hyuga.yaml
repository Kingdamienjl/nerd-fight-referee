        honed her skills after reconciling her with cousin Neji, managing to hold
        her own against numerous Zetsu clones and eventually Juubi spawns during the
        Great Shinobi War. True to her clan''s traditions, she is a specialist in
        close-range combat who attempts to disable her opponent by sealing off their
        tenketsu before going in for the finish. She also has pronounced chakra control,
        acting as a medical-nin and assisted in the erection of numerous seals. Also,
        she produced various techniques of her own from what she already knew in the
