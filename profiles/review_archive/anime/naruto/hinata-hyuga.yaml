      value: "Her fighting style is primarily limited to taijutsu, and there is a\
        \ small blind spot near the back of her neck, which her vision cannot cover.\
        \ Notable Attacks/Techniques: Byakugan (White Eye): This eye technique is\
        \ the kekkei genkai of the Hy\u016Bga clan and one of the Three Great D\u014D\
        jutsu. Wielders of this eye can see long distances (at least up to 10 kilometers)\
        \ and can see objects that are too small for the normal eye to detect (such\
        \ as the tenketsu points on a human's body). The Byakugan has an almost perfect\
        \ 360-degree field of vision, though there is a small blind spot located near\
        \ the back of the user's neck. The eye can also see through objects as well\
        \ as many barriers and can see chakra. Juuken (Gentle Fist): By taking advantage\
        \ of the Byakugan, the user can see a person's chakra pathway system. Juuken\
        \ inflicts internal damage through attacking the body's Chakra Pathway System\
        \ by injecting chakra into specific pressure points (tenketsu), subsequently\
        \ injuring internal organs that are closely intertwined with the pathways.\
        \ Once these tenketsu points are struck, they are, in turn, sealed and can\
        \ no longer produce chakra for a certain amount of time, severely limiting\
        \ the victim's chakra flow. *Hakke Kuushou (Eight Trigrams Empty Palm): After\
        \ using their Byakugan to locate a target's vitals, the user will attack with\
        \ a forceful palm thrust which releases a small wave of chakra. The attack\
        \ is powerful enough to blow a person off of their feet and has a range of\
        \ several meters. *Hakke Kuhekisho (Eight Trigrams Empty Wall Palm): A combination\
        \ attack involving two Juuken users who simultaneously strike a target with\
        \ their Hakke Kuushou (Eight Trigrams Empty Palm) technique. Hinata uses this\
        \ jutsu in combination with Neji. *Juho Soshiken (Gentle Step Twin Lion Fists):\
