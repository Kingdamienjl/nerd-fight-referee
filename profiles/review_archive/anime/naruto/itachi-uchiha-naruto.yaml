        \ by Edo Tensei, he can still be sealed away, and is vulnerable to attacks\
        \ that directly target his soul. Notable Attacks/Techniques: Hide/Show *Sharingan\
        \ (Mirror Wheel Eye): The first of the Sharingan's powers is being able to\
