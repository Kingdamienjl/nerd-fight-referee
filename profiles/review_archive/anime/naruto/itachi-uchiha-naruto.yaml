    - field: weaknesses
      value: "Part I= The Sharingan's ability to copy Ninjutsu, Genjutsu, and Taijutsu\
        \ is limited by the user's physical condition,Rin no Sho, pages 192-193 that\
        \ is to say, that the user needs to be physically capable of performing the\
        \ technique they are trying to replicate. They need to meet any physical or\
        \ chakra amount prerequisites the technique in question may have. This ability\
        \ is also incapable of replicating Kekkei Genkai, due to either not possessing\
        \ the genetic predisposition and/or having the necessary chakra natures. Naturally,\
        \ the user must be able to see the technique they are copying; they cannot\
        \ replicate what they cannot see. The same can be said for essentially all\
        \ of the Sharingan's abilities; they are sight-based abilities, so if the\
        \ opponent can obscure the user's vision using extremely thick mist/dustNaruto\
        \ Chapter 26 or blind them, the Sharingan's abilities will be rendered ineffective.\
        \ Likewise, suppose the opponent is too fast for the Sharingan to track them.\
        \ In that case, they will be safe from its abilities. Sharingan Genjutsu requires\
        \ eye contact, so if the opponent can avoid eye contact or is blind, they\
        \ will avert Sharingan Genjutsu entirely. Finally, the Sharingan's predictive\
        \ capabilities may partially be circumvented by fast attacks with little or\
        \ no pattern, such as Naruto's chakra armsNaruto Chapter 231 that emerge from\
        \ any part of his body and attack instinctively. The Izanami was deemed to\
        \ be incredibly dangerous to be used in combat, such that it was forbidden,\
        \ due to the inherent escape route designed with the technique. If one stops\
        \ trying to escape the original outcome and attempting change their fate,\
        \ they can break out of the loop.Naruto Chapter 586Naruto Chapter 587 The\
        \ Mangeky\u014D Sharingan offers far more power than the regular Shairngan,\
        \ but that power comes at a cost. More powerful techniques entail a far higher\
        \ chakra cost, making Mangeky\u014D Sharingan Jutsu extremely taxing to use\
        \ and maintain. Additionally, the Mangeky\u014D Sharingan also causes great\
        \ strain on the user's vision, eventually resulting in complete blindness\
        \ with continuous use. Use of the Izanagi and Izanami also causes permanent\
        \ blindness in the eyes they are cast from.Naruto Chapter 586Naruto Chapter\
        \ 587 The Susano'o causes its users immense pain \"in every cell in their\
        \ body\". Kotoamatsukami can only be used once each ten years, per eye, unless\
        \ the user possesses Hashirama Senju's cells. |-|Part II= Same as before.\
        \ Itachi also suffers from a terminal illness that significantly weakens him\
        \ and causes constant pain over time. It also diminishes his chakra reserves\
