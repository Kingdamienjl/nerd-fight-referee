        s next move from the slightest muscle tension in their body. Sharingan's third\
        \ and most well-known power grants the user the ability to memorize almost\
        \ any technique they witness. **Sharingan Genjutsu: The Uchiha clan's generic\
        \ illusionary art. The Uchiha can lock their opponents into their chosen illusion\
