        a limited amount of time. *Kage Kubi Shibari no Jutsu: Shikamaru''s extended
        shadow takes the shape of a hand and can restrain the opponent or snap their
        neck. Stronger opponents can overpower this technique. *Kagemane Shuriken
        no Jutsu: Taking advantage of Asuma''s chakra knives, Shikamaru will store
        his shadow chakra in the blades. He will target his opponent''s shadow with
        sharp objects and can "capture" them similar to Kagemane no Jutsu. *Kage Nui
        no Jutsu: Shikamaru creates multiple shadow tendrils that are no longer bound
