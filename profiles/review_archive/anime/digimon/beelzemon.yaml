    Shot: Rapidly fires the Berenjena. *Heartbreak Shot: Fire a shot aimed at the
    opponent''s heart. *Chaos Blast: Attacks the opponents with energy balls of darkness
    and chaos. Beelzemon Blast Mode *Corona Blaster (Death Slinger): Fires a destructive
    wave from the Blaster that destroys the target at the atomic level. *Corona Destroyer
    (Chaos Flare): Draws an inverted pentagram with his cannon and fires energy blasts
