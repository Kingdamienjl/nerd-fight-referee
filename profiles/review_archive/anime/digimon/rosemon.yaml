  section: weaknesses
  axis: weakness
  text: "Fire and Wind based skills, Virus Digimon Notable Attacks/Techniques *Thorn\
    \ Whipping: Tames a Digimon, no matter how frenzied, with a thorned whip charged\
    \ with electricity. Those who suffer this technique become Rosemon's slave in\
    \ body and soul. *Drain Whipping: Attacks the enemy with her whip and drains their\
    \ life force. *Stun Whipping: Attacks the opponent with her whip and paralyzes\
    \ them. *Electro Whipping: Attacks the foe with an electrified whip and causes\
    \ them to become confused. *Rose Spear: Brings the opponent down using the whip\
    \ as a rapier. *Forbidden Temptation: Beautifully destroys the opponent's data\
    \ in a shower of innumerable rose petals. *Ivy Hug: Entangles the opponent in\
    \ vines. *Rose Velvet: Covers the ground in thorns. *Rosy Cradle: Summons a storm\
    \ of sleep-inducing rose petals. *Fascination: Enthralls an opponent and steals\
    \ its life-force. *Beauty Shock: Shocks its opponent with lightning from its left\
    \ whip. *Thorn Shoot (Thorn Shot): Shoots a thorn. *Danger Thorn: Shoots thorns\
    \ at all enemies. *Final Aura: Greatly heals all allies. *Gaia Element III: Blasts\
    \ the opponent with a burst of plant energy. *Lila Shower: Fires multiple beams\
    \ from her fingers. This attack can poison the opponent. *Lovely Cologne: Charms\
    \ the enemy with a sweet smell. *Un Deux Pollen: Dances gracefully, scattering\
    \ lovely-smelling pollen to bewitch the opponent. *Temptation: Spreads a cloud\
    \ of pink pollen that saps the enemy's life and strength, or binds the enemy with\
    \ leaves. *Green Trap: Spins around releasing flowers and pollen that can paralyze\
    \ enemies. *Pure Temptation: Covers all enemies in an illusion in order to confuse\
    \ them. *White Hail: Shoots balls of freezing energy into the air, causing icicles\
    \ to fall down on the foe. *Dark Crusher: Launches an arrow of darkness at the\
    \ opponent that instantly destroys any data it hits. Those who survive this attack\
    \ have a chance to be paralyzed. *Flash Ray: Unleashes a flash of light that causes\
    \ confusion. *Raging Darkness: A darkness based attack that lowers the opponents\
    \ resistance to the power of Darkness. *Poison: This skill includes multiple attack\
    \ modes\uFF1ASummons a magic circle, Attacks with energy breath, Release a heart-shaped\
    \ energy wave, Sprays poison smoke and hits the foe with a body attack to convert\
    \ the opponent's power into dark energy, destroying them from the inside. The\
    \ stronger the opponent, the stronger the poison. *Darkness Wave/Bat Blitz: Unleashes\
    \ a wave of dark red bats with purple cyclone or fire bats that burn opponent\
    \ to a crisp. This move burns the body and soul directly. *Transfer: Warps the\
    \ target to another space. *Chrono Breaker: Wears away the opponent's body by\
    \ stopping time or destroying it. *Petrifier: Stares at the opponent and petrifies\
    \ them. *Petra Fire: Releases a beam from its eyes that petrifies the opponent.\
    \ *Black Hole: Summons a garbage can and uses it to suck opponents into the black\
    \ hole within it. Those sucked in disappear without a trace. *Poison S-mush: Throws\
    \ various mushrooms that have the following effects. **Poison the opponent for\
    \ them to take damage until they die. **Causes the opponent to become paralyzed.\
    \ **Erases the opponents' memories. **Turns the opponent into an 8-bit sprite\
    \ and nullifies their abilities. **Turn resistance into weaknesses and vice versa.\
    \ **Causes the foe to be confused. **Puts the foes to sleep. **Instantly kills\
    \ the opponent. *Branch Drain: Either grabs the foe to drain their life force\
    \ or drains it by inhaling. *Charit\xE9 (Fra: Charity): Amplifies the aura of\
    \ its mantle, gently wraps it around the opponent and then annihilates them. *Jewel\
    \ of Heart (Tifaret): Shoots Tifarets at the opponent. *Aguichantes L\xE8vres:\
    \ It blows a kiss, releasing several hearts that overwhelm the opponent by firing\
    \ lasers. These lasers bypass magical defenses. *Rosen Blood:The \"Aphroditear\"\
    \ drops on its petals, seen when incurring the wrath of Rosemon, are said to be\
    \ the tears of Rosemon's love, and Digimon that have seen them are eventually\
    \ annihilated by its Special Move \"Rosen Blood\", in which they personally embrace\
    \ Rosemon's thorned whips despite knowing that they will get injured, causing\
    \ damage afterwards. *Gr\xE4me: Destroys the enemy's body from within using its\
    \ chain. *Ende Brechen: Crushes the enemy's essence directly. *Zone Deleter: Blows\
    \ away the opponent and all of the space around them to another dimension. *Master\
    \ of Darkness: Changes the opponent's nature to darkness and manipulates them\
    \ to its heart's content. *Eroberung (Conquest): Swings her sword in an arc shaped\
    \ like the crescent moon before rushing at her opponent, slicing them and absorbing\
    \ their power as her own. **Eroberung Sturm (Conquest Storm): Rosemon sweeps through\
    \ an area while slicing everything in range with Blut Evolution, having the same\
    \ effects as Eroberung. *Ged\xE4chtnisst\xF6rung (Memory Disturbance): Grapples\
    \ the opponent and reads their memories. *Geist Abend (Ghost Evening): Fires off\
    \ energy beams to hypnotize targets. *Ghost Move: I"
