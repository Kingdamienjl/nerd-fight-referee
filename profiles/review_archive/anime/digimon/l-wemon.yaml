  intelligence:
    text: Kouichi, being a troubled teen burdened with jealousy towards his long-lost
      twin Kouji Minamoto, allowing him to be manipulated by those willing to prey
      on his feelings of jealousy. As Duskmon, he is a ruthless combatant and and
      skilled swordsman capable of taking on the rest of the Legendary Warriors at
      once, easily defeating them in most of their encounters. He is far less intelligent
      as Velgrmon, showing an even more aggressive side and relentlessly and mindlessly
      pursuing and attacking his foes. He regains clarity of mind as Loweemon and
      JagerLoweemon, matching even Fusion-Hybrid level opponents in combat and is
      a master spearman who deftly wields his powers of darkness.
    source_ids:
    - vsbattles-l-wemon-digimon
