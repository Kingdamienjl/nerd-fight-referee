      the thinking for him. Despite this, he has proven himself to be a legitimate
      threat, batting away the heroes on several occasions with his furious barrages
      of punches and kicks and combining them with his plant-based powers to devastate
      large areas very quickly. However, he's easily tricked due to his poor critical
