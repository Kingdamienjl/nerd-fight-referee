    - field: powers_and_abilities
      value: '{{Border|Scroll=Yes|Visible=Yes|Content= *Superhuman Physical Characteristics
        (The sons of Ipswitch have shown physical prowess above even the strongest
        humans) *Magic (The Sons of Ipswitch wields The Power, a mysterious source
        of supernatural abilities which first manifested within him on his 13th birthday.
        Even before his ascension, Caleb''s powers were greater and more developed
        than his peers due to his five years of experience in harnessing and controlling
        The Power. *Telekinesis (Sons of Ipswitch can levitate and manipulate objects
        with only his sheer willpower. He does not seem to need to focus to use this
        power; he used this ability to summon The Book of Damnation from the bookshelf
        and even opened and turned the pages on its own, as if it were alive, with
        no visible effort on his part. Even before ascension, Caleb was able to survive
        a head-on collision with a semi-truck in his car, by using his telekinesis
        to reassemble the vehicle, however, a feat of such magnitude left him visibly
        sweating and breathing heavily. By channeling this ability with that of his
        friends, they were able to lift Tyler''s Hummer and fly through the air over
        a cliff. He can use this ability on himself in order to levitate and maneuver
        in the air) *Martial Arts *Statistics Amplification (By summoning the mystical
        forces within his body, Sons of Ipswitch can increase his physical strength
        to levels beyond human. They get stronger with age. Much like one''s strength,
        a warlock could use The Power to augment their speed and agility to undetermined
        and considerable levels. Enough to be registered as a speeding blur to the
        naked eye and fast enough to react to certain things at inhuman speeds, such
        as gunfire) *Air Manipulation (Shown when Reid blew up a girls skirt after
        a bet with his brothers to see what color underwear she had on) *Astral Projection
        (The power to project one''s consciousness and senses beyond and away from
        the physical body. When Sarah got out of the shower to investigate the broken
        light bulb, that smoky being behind her could have been a case of astral projection;
        the inference is that it is Chase stalking her. This power may have been used
        by the head of the Putnam family, John Putnam, prior to said family being
        hunted down during the witch hunts in the 17th Century in order to visit people
        in their dreams, as one such victim claimed that this was the crime) *Teleportation
        (The power to instantaneously disappear from one place and reappear in another.
        This power is shown all throughout the film when characters would suddenly
        appear and disappear out of nowhere) *Fire Manipulation (Caleb a ring of fire
        on the altar around The Book of Damnation with only his will) *Extrasensory
        Perception (Because of their spiritual union, They can sense whenever another
        of the Sons of Ipswich is using his powers. They can also feel the strength
        of the power used. An example of which is how someone else''s use of The Power
        was able to wake him from his sleep in the night. *Clairvoyance (Warlocks
        can also see the conjured spirits of the deceased, particularly darklings.
        Warlocks can sense when one of their own is using The Power. In some cases,
        the sensing of one using The Power can awaken another from their slumber)
        *Stealth Mastery (Broke into the school''s library to learn about Chase''s
        background. Since they are the only Warlocks, they have to hide their powers
        from the public]) *Shockwave Creation (Caleb has the ability to create shockwaves,
        and shoot them as projectiles from his hands of feet) *Supernatural Willpower
        (A warlock is able to perform a variety of feats using sheer willpower alone.
        They can cast a vast number of spells just by thinking of the intention they
        want to make. They also have exceptional stamina that far exceeds ordinary
        humans, shown when Chase, who is addicted to using his powers and suffers
        burnouts but through willpower alone continues to use the power) *Curse Manipulation,
        Mind Manipulation, Information Manipulation, and Empathic Manipulation (The
        power to magically bewitch others into doing one''s bidding by the way of
        suggestion. Through the use of this power, a Son of Ipswich could mentally
        extract information, subliminally implant commands, lower the inhibitions,
        manipulate thoughts and memories, or completely disable/enable the emotions
        in other individuals) *Technopathy (The Power enables its users to affect
        machines to random degrees; when Reid used his powers to fix Sarah''s car,
        he got it running again, and when Caleb used his powers to escape a car crash,
        he made his car disassemble and reassemble after flying past a truck) *Power
        Bestowal (The Sons can will their power to other members by chanting "I will
        you my power") *Disease Manipulation (Similar to his brother he can induce
        an illness and cause someone to automatically throw up) *Flight (The power
        to defy gravity and hover or maneuver freely in the air or even fly. Caleb
        uses this power during his fight with Chase in Putnam Barn. May'
