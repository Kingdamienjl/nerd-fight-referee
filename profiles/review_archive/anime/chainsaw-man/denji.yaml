    - field: stamina
      value: Superhuman (Even before becoming a Devil-Human Hybrid, Denji has been
        continuously hunting devils and doing other odd jobs while malnourished to
        the point of having trouble sleeping from the hunger every single day. Even
        after being stabbed through the heart, could still run away for a brief while.
        This phenomenal ability to endure has only been further shown after his revival.
        Extreme injuries such as disembowelment,Chainsaw Man Chapter 79 broken bones,Chainsaw
        Man Chapter 18 amputation, being set ablaze, being dissolved by acid, bisectionChainsaw
        Man Chapter 152 and even decapitation have shown to not be enough to stop
        his determination to keep on fighting; likely thanks to his resolute will
        and masochist tendencies revealed later on. Also, thanks to his physiology,
        Denji can theoretically fight indefinitely as long as there's blood around.
        This can be seen with his battle with the Eternity Devil, where he battled
        the devil non-stop for three days straight)
