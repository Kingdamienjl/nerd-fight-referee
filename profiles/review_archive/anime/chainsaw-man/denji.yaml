    - field: powers_and_abilities
      value: (As the Control Devil, Makima can control any life form she perceives
        as inferior to herself, including humans and devils, fiends and animals alike.
        After taking control of a target, she can utilize the abilities of those under
        her influence, even posthumously and regardless of whether those abilities
        originated from prior contracts. Following her defeat of the Gun Devil in
        their twelve-second confrontation, she subsequently took control of it and
        forced it into Aki Hayakawa's corpse. Given her established mechanics of control,
        this would grant her access to the Gun Devil's projectile-based abilities,
        which she can manipulate and alter in scale and potency. As such, Makima's
        projectile attacks after this point are consistent with Gun Devil-derived
        abilities. Likewise, Yoru's usage of 28% of the Gun Devil represents a proportional
        manifestation of the same power source) *Gun Devil Bullet Percentage Scaling
        Clarification (When scaling Gun Devil bullet speed from 20% to 28%, this is
        not an 8% increase in speed but an 8 percentage point increase in output.
        Since 28 divided by 20 equals 1.4, 28% of the Gun Devil's bullet speed is
        1.4 times the value of the 20% calculation. This represents a 40% increase
        relative to the 20% value. Therefore, if 20% of the Gun Devil corresponds
        to a specific attack speed, 28% scales by multiplying that value by 1.4. This
        should not be confused with multiplying by 1.08 or 1.28, as the comparison
        is between 20% and 28% of the same source, not 100% and 108% or 128%.) ==Knowledgeable
