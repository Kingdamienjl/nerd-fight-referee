  intelligence:
    text: Gifted. Sakamoto is a legendary hitman hailed as the greatest of all time,
      even among top-tier assassins. He is a master tactician and combatant, capable
      of outsmarting and defeating the strongest assassins in Japan through sheer
      skill and ingenuity. Highly resourceful, Sakamoto can weaponize virtually any
      object in his environment, such as using a cough drop to deflect a bullet, flicking
      a mechanical pencil lead to blind an opponent's eye, using a half-off sticker
      to obscure another eye, or riding a railroad tile like a surfboard and using
      a coupon to cut ropes, among many other improvisational feats. Outside of combat,
      he applies his assassin skills with remarkable precision and subtlety, becoming
      a well-regarded jack-of-all-trades within his community and a caring, "legendary"
      father to his daughter, Hana. He also appears to possess photographic memory,
      having recalled the exact chemical composition of Boiled's explosives despite
      only glimpsing it years prior.
    source_ids:
    - vsbattles-taro-sakamoto-sakamoto-days
