    - field: standard_equipment
      value: '*Grimoire: Yuno possesses a four-leaf clover grimoire that contains
        various wind-based spells, which he receives in the acceptance ceremony after
        he turns 15 years old. The grimoire is similar to the grimoire that the first
        Wizard King received. His grimoire has a gold-colored cover, the gold-colored
        four-leaf clover insignia at the center of the front cover and intricate ornaments
        around the borders. Yuno Grimoire.png|Yuno''s Grimore'
      source_id: mediawiki-yuno
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Genius. Yuno was recognized as a genius from an early age, quickly mastering
        basic magic spells and receiving the Four-Leaf Clover Grimoire, which is given
        only to great heroes, decimating most normal foes in combat. As a result,
        he has a certain air of arrogance about him and is reluctant to accept help,
        but this belies the fact that he is actually very hard-working and that his
        "genius" status is partially because of his willingness to practice his magic
        constantly when compared to the far more complacent nobility. Yuno mastered
        Mana Skin after seeing it once, despite not knowing its existence prior to
        that. A week after learning Mana Skin, he polished his technique even further
        to learn Mana Zone, something most Magic Knights and Captains are unable to
        do despite their years of experience in the battlefield.
      source_id: mediawiki-yuno
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: ===Magic=== Wind Magic: An
        elemental magic that allows Yuno to manipulate wind. Yuno has been seen to
        be proficient with this magic even before he received his grimoire. He usually
        uses this magic in the form of whirlwinds that could knock out his opponents
        in a single hit. He can also surround himself in wind to increase his movement
        speed as well as allow him to fly. *Towering Tornado: Yuno generates a localized
        tornado to pulverize obstacles and send foes flying. *Crescent Kamaitachi:
        Yuno extends his arms outward to generate a crescent-shaped blade of compressed
        air, launching it as a projectile to slice foes in half and destroy oncoming
        attacks. *Tornado Fang: Yuno creates a large, horizontal tornado which drills
        through opponents and their spells. The spell is powerful enough to shatter
        rock and to blow away multiple opponents. *Gale White Bow: Yuno pulls back
        his right arm with an open palm, generates a large bow made of wind, and creates
        six large arrows that are fired at a target. The arrows can block an opponent''s
        attack and then split into smaller arrows that continue toward the target.
        The power of the arrows can be amplified with another''s assistance. PSX 20190816
        232610.jpg|Towering Tornado Yuno crescent wind sickle.png|Crescent Kamaitachi
        image(2).png|Unnamed trident spell image(1).png|Gale White Bow Tornado Fang.png|Tornado
        Fang Creation Magic: A magic that allows Yuno to manifest any entities that
        he desires. Yuno uses this magic with his wind magic to create a wind-based
        entity. *Swift White Hawk: Yuno generates a hawk-shaped familiar out of wind
        that acts like the actual animal, responding to his commands and attacking
        foes with its beak and talons. It can also absorb surrounding winds to further
        bolster its size and potency. *Wind Blades Shower: Yuno compresses the surrounding
        air into tangible and somewhat visible blades, launching them at the target
        to impale and eviscerate them. He can create dozens of them at a time to overwhelm
        multiple foes, saturate an area to prevent escape, or concentrate their attacks
        on a single foe for even greater damage. *Heavenly Wind Ark: A support-type
        Magic, Yuno shapes the wind into a boat that he and his allies can ride on,
        permitting high-speed flight. It appears to have high maneuverability, as
        it can be used effectively in trap-filled underground dungeons, but has never
        seen use in combat, suggesting that it may be impractical in a direct fight.
        Yuno White Hawk.png|Swift White Hawk PSX 20190816 233115.jpg|Wind Blades Shower
        PSX 20190816 233126.jpg|Heavenly Wind Ark Spirit Magic: A magic that allows
        Yuno to summon a spirit that could assist him in battle. Yuno uses this magic
        to summon Sylph, one of the four Major Elementals, representing Wind. *Sylph
        Breath: Sylph blows a brief puff of air which quickly turns into a massive
        gust that can send foes flying through dungeon walls and smash through the
        side of a castle. It is powerful enough to instantly defeat Mars, who resisted
        Asta''s and Yuno''s previous attacks. *Spirit Dive: Yuno assimilates an elemental
        spirit into his body. The spell is enable to contain and control the power
        of the spirit, dramatically increasing their own magic power. When Yuno is
        combined with Sylph, Yuno''s body glows green, a green circle of connected
        crosses appear around his wrist, two green wing appear from his back, and
        a green crown of connected crosses appears atop of his head. He can also form
        3 weapons made from mana, that had been so far named after the four gods of
        wind of Greek Mythology: **Spirit of Zephyr: After absorbing an elemental
        spirit, Yuno condenses external Mana into a large, two-handed sword. Since
        it is partially composed of external Mana, it can take on the properties of
        that Mana. As well as cutting through enemies with the blade, Yuno can manifest
        a giant tornado around the sword. *Spirit Storm: After Yuno is done absorbing
        an elemental spirit, He can releases the Mana in a powerful tornado. *Spirit''s
        Hushed Dance: After absorbing an elemental spirit, Yuno takes control of the
        surrounding Mana, enabling him to predict and evade attacks, even those from
        Light Magic. He appears to dance along a stream of wind. PSX 20190816 233135.jpg|Sylph''s
        Breath PSX 20190816 233143.jpg|Spirit Dive Spirit Storm.png|Spirit Storm PSX
        20190816 234204.jpg|Spirit''s Hushed Dance Spirit of Zephyr.png|Spirit of
        Zephyr *Magic Sensing: After temporarily losing all five senses to Catherine''s
        magic, Yuno awakened the Wind-Magic user''s specialty: sensing and controlling
        the flow of Mana around him, allowing him to locate and detect foes and attacks
        using their Mana signatures alone. *Restraining Magic: Wind Spirit Restraining
        Magic: Liable Tempest: After absorbing Slyph''s power, Yuno flies in a circle
        around his target and increases his speed until a vortex of wind is created.
        Yuno then compresses the vortex into a tight cocoon and fastens it with several
        wind streams. *Reinforcement Magic'
