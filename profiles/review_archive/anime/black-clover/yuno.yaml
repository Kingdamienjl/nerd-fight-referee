  intelligence:
    text: Genius. Yuno was recognized as a genius from an early age, quickly mastering
      basic magic spells and receiving the Four-Leaf Clover Grimoire, which is given
      only to great heroes, decimating most normal foes in combat. As a result, he
      has a certain air of arrogance about him and is reluctant to accept help, but
      this belies the fact that he is actually very hard-working and that his "genius"
      status is partially because of his willingness to practice his magic constantly
      when compared to the far more complacent nobility. Yuno mastered Mana Skin after
      seeing it once, despite not knowing its existence prior to that. A week after
      learning Mana Skin, he polished his technique even further to learn Mana Zone,
      something most Magic Knights and Captains are unable to do despite their years
      of experience in the battlefield.
