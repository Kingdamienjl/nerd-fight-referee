  text: "\"mw-collapsible mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"\
    1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align:\
    \ left; |Notable Attacks/Techniques: |- | Dark Cloaked Avidya Slash.png|Dark Cloaked\
    \ Lightless Slash Dark Cloaked Black Blade.png|Dark Cloaked Black Blade Black\
    \ Hole.png|Black Hole DarkCloakedDimensionSlicer.PNG|Dark Cloaked Dimension Slash\
    \ Yami binds Patolli.png|Dark Binding Black Cocoon.png|Black Cocoon Yami's Reverse\
    \ Blade Strike.png|Dark Cloaked Lightless Blunt Strike Yami slashes wildly.png|Dark\
    \ Cloaked Lightless Blade Storm Yami saves Charla.png|Dark Cloaked Black Blade\
    \ Blunt Slash Dark Cloaked Dimension Slash Equinox.png|Mana Zone Dark Cloaked\
    \ Dimension Slash: Equinox Yami Black Moon.jpg|Mana Zone Black Moon Dark Cloaked\
    \ Iai Slash.png|Mana Zone Condense: Dark Cloaked Iai Slash {{Nihongo|Dark Magic|{{Ruby|\u95C7\
    |\u3084\u307F}}{{Ruby|\u9B54|\u307E}}{{Ruby|\u6CD5|\u307B\u3046}}|Yami Mah\u014D\
    }}: Yami's magic allows him to manipulate darkness. He primarily uses this magic\
    \ to increase his physical abilities and channels it into his sword, creating\
    \ destructive arcs of dark energy that are powerful enough to counter Licht's\
    \ Light Magic spells. It is a rare and unique magic that was recognized by the\
    \ Sorcery Emperor himself. *{{Nihongo|Dark Magic: Dark Cloaked Lightless Slash|{{Ruby|\u95C7\
    |\u3084\u307F}}{{Ruby|\u9B54|\u307E}}{{Ruby|\u6CD5|\u307B\u3046}}\u300E{{Ruby|\u95C7\
    |\u3084\u307F}}{{Ruby|\u7E8F|\u307E\u3068\u3044}}\u30FB{{Ruby|\u7121|\u3080}}{{Ruby|\u660E\
    |\u307F\u3087\u3046}}{{Ruby|\u65AC|\u304E}}\u308A\u300F Yami Mah\u014D \"Yamimatoi:\
    \ Mumy\u014Dgiri\"}} Channeling his magic into his katana, Yami swings his blade,\
    \ unleashing a dark arc of energy that absorbs other attacks and retains the same\
    \ sharpness as an edged weapon. **{{Nihongo|Dark Magic: Dark Cloaked Lightless\
    \ Blade Storm|{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u9B54|\u307E}}{{Ruby|\u6CD5\
    |\u307B\u3046}}\u300E{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u7E8F|\u307E\u3068\u3044\
    }}\u30FB{{Ruby|\u7121|\u3080}}{{Ruby|\u660E|\u307F\u3087\u3046}}{{Ruby|\u4E71\
    |\u307F\u3060}}\u308C{{Ruby|\u65AC|\u304E}}\u308A\u300F|Yami Mah\u014D \"Yamimatoi:\
    \ Mumy\u014D Midaregiri\"}}: Yami coats their sword in Dark Magic and swings it\
    \ in a disorderly fashion, creating multiple Dark Cloaked Avidya Slashes. **{{Nihongo|Dark\
    \ Magic: Dark Cloaked Black Blade|{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u9B54|\u307E\
    }}{{Ruby|\u6CD5|\u307B\u3046}}\u300E{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u7E8F\
    |\u307E\u3068\u3044}}\u30FB{{Ruby|\u9ED2|\u304F\u308D}}{{Ruby|\u5203|\u3070}}\u300F\
    |Yami Mah\u014D \"Yamimatoi: Kuroba\"}} By coating his katana with darkness, Yami\
    \ can increase the range and power of his swings. **{{Nihongo|Dark Magic: Dark\
    \ Cloaked Black Blade Blunt Slash|{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u9B54|\u307E\
    }}{{Ruby|\u6CD5|\u307B\u3046}}\u300E{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u7E8F\
    |\u307E\u3068\u3044}}\u30FB{{Ruby|\u9ED2|\u304F\u308D}}{{Ruby|\u5203|\u3070}}{{Ruby|\u5CF0\
    |\u307F\u306D}}{{Ruby|\u8599|\u306A}}\u304E\u300F|Yami Mah\u014D \"Yamimatoi:\
    \ Kuroba Minenagi\"}}: Yami coats a sword in darkness and extends the blade by\
    \ shaping the darkness. Then he swings the blade wide and pushes a target back\
    \ with the blunt side of the sword. **{{Nihongo|Dark Magic: Dark Cloaked Lightless\
    \ Blunt Strike|{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u9B54|\u307E}}{{Ruby|\u6CD5\
    |\u307B\u3046}}\u300E{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u7E8F|\u307E\u3068\u3044\
    }}\u30FB{{Ruby|\u7121|\u3080}}{{Ruby|\u660E|\u307F\u3087\u3046}}{{Ruby|\u5CF0\
    |\u307F\u306D}}{{Ruby|\u6253|\u3046}}\u3061\u300F|Yami Mah\u014D \"Yamimatoi:\
    \ Mumy\u014D Mineuchi\"}}: Yami coats his sword with Dark Magic, goes behind their\
    \ target, and strikes the target's nape with the back of their sword. The blow\
    \ is strong enough to knock the target unconscious, and since it is done with\
    \ the blunt side of the sword, the target is not grievously injured. **{{Nihongo|Dark\
    \ Magic: Black Cocoon|{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u9B54|\u307E}}{{Ruby|\u6CD5\
    |\u307B\u3046}}\u300E{{Ruby|\u9ED2\u7E6D|\u304F\u308D\u307E\u3086}}\u300F|Yami\
    \ Mah\u014D \"Kuromayu\"}}: Yami creates a spherical shell of darkness around\
    \ themselves. The sphere can also be used as a means of transport. **{{Nihongo|Dark\
    \ Magic: Black Hole|{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u9B54|\u307E}}{{Ruby|\u6CD5\
    |\u307B\u3046}}\u300E{{Ruby|\u9ED2\u7A74|\u304F\u308D\u3042\u306A}}\u300F|Yami\
    \ Mah\u014D \"Kuroana\"}}: Yami creates a singularity of darkness that draws in\
    \ incoming projectile attacks, nullifying them in the process, but is limited\
    \ by the singularity's small size. **{{Nihongo|Dark Magic: Dark Cloaked Dimension\
    \ Slash|{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u9B54|\u307E}}{{Ruby|\u6CD5|\u307B\
    \u3046}}\u300E{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u7E8F|\u307E\u3068\u3044}}\u30FB\
    {{Ruby|\u6B21|\u3058}}{{Ruby|\u5143|\u3052\u3093}}{{Ruby|\u65AC|\u304E}}\u308A\
    \u300F|Yami Mah\u014D \"Yamimatoi: Jigengiri\"}}: A powerful slash that cuts through\
    \ \"dimensions\" (space) itself, which Yami described as being able to cut through\
    \ anything. Yami developed this attack as he was trapped and pushed to the brink\
    \ watching his men fight a battle to the death. **Mana Zone: Dark Cloaked Dimension\
    \ Slash: Equinox: Greater version of Dark Cloaked Dimension Slash, extending its\
    \ range and reach. **{{Nihongo|Mana Zone: Black Moon|{{Ruby|\u9B54\u4F55|\u30DE\
    \u30CA}}\u30BE\u30FC\u30F3\u300E{{Ruby|\u9ED2\u6708|\u304F\u308D\u3065\u304D}}\u300F\
    |Mana Z\u014Dn \"Kurozuki\"}}: Yami takes control of the surrounding mana and\
    \ then creates a Black Hole overhead, expanding the range of its absorption over\
    \ a defined area. Yami is also able to discriminate what gets absorbed by the\
    \ spell, such as erasing an opponent's spell while leaving an ally's spell unaffected.\
    \ **{{Nihongo|Mana Zone Condense: Dark Cloaked Iai Slash|{{Ruby|\u9B54\u4F55|\u30DE\
    \u30CA}}\u30BE\u30FC\u30F3{{Ruby|\u51DD\u7E2E|\u304E\u3087\u3046\u3057\u3085\u304F\
    }}\u300E{{Ruby|\u95C7|\u3084\u307F}}{{Ruby|\u7E8F|\u307E\u3068\u3044}}\u30FB{{Ruby|\u5C45\
    |\u3044}}{{Ruby|\u5408|\u3042\u3044}}{{Ruby|\u65AC|\u304E}}\u308A\u300F|Mana Z\u014D\
    n \"Iaigiri\"}}: Yami sheathes his sword, condenses the area of Black Moon's effect,\
    \ and waits for his opponent to attack. Once the opponent is in range, Yami coats\
    \ his sword in darkness, quickly draws the blade, and dashes forward, slashing\
    \ the opponent across the stomach. **{"
