    text: Building level+ (Survived a killing strike from Spirit Detective arc Hiei,
      albeit was badly wounded. Also survived a full powered strike strike from a
      Saint Beast just below Byakko) | Large Town level (Survived Karasu's largest
      explosion) | Small Country level (Survived at least one attack from a serious
      Defensive Armor Sensui) | Multi-Continent level (His durability this point should
      be leagues above that of Sensui at his peak, whose power level was a tiny fraction
      that of Demon World Tournament Kurama)
