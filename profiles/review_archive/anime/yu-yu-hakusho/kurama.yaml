    - field: weaknesses
      value: 'Kurama was always angry and easy to provoke. It is vulnerable to sufficient,
        high-level mind-controlling and sealing techniques. While sealed in a host
        (jinchuuriki), it will die if the host does. Like all Tailed Beasts, it can''t
        correctly focus its power without a Jinchuriki''s aid, thus throws around
        its power randomly. Notable Attacks/Techniques: *Tailed Beast Bomb: The signature
        attack of the Tailed Beasts, Kurama mixes appropriate proportions of positive
        black chakra and negative white chakra to form a ball of energy that he can
        fire at his target, obliterating large swathes of land in an instant on impact.
        Alternatively, Kurama can swallow it to compress its energy into a beam that
        could only be stopped by another being as powerful as a Tailed Beast like
        the Eight-Tails. **Continuous Tailed Beast Bombs: Kurama fires several uncompressed
        Tailed Beast Balls in rapid succession to quickly decimate an area. *Tailed
        Beast Shockwave: Kurama uses his massive chakra reserves to empower his roars
        and movements, dispersing oncoming attacks as powerful as Naruto''s Ultra-Big
        Ball Rasengan and sending other Tailed Beasts flying backward. *Negative Emotions
        Sensing: Kurama can sense negative emotions such as hatred and killing intent
        of any individual around it. *Sage Technique: Kurama can draw the energy of
        nature around him, blending it with his and Naruto''s chakra. **Six Paths:
        Massive Rasenshuriken: While empowered by Naruto''s Six Paths Sage power and
        combined with the entire natural chakra on the planet, they create two shadow
        clones of the whole chakra figure. The three chakra avatars merged, creating
        a three-faced, six-armed avatar. In its right arms, it creates an Ultra-Big
        Rasenshuriken, and in its left arms, it creates a Tailed Beast Ball Rasenshuriken.
        It is powerful enough to counter Indra''s Arrow.'
      source_id: character-stats-profiles-kurama
      provider_id: character_stats_profiles
      authority: high
