    - field: weaknesses
      value: 'Her internal parts are vulnerable to attacks if anything gets inside.
        She was designed to be mentally a teenager. Which leads into her being stubborn,
        careless, or even naive at multiple times. She''s most often vulnerable to
        electric or magnetic based attacks. She has a limited amount of power, but
        she can recharge with a solar panel. Feats: *Can push someone on a skateboard
        fast enough that they create fire from raw speed. *Kicked a ball with enough
        force that it destroyed houses, airplanes, trees, and space ships causally.
        Even setting it on fire and sending it into space. *Has enough strength to
        stop a Frieze Wheel from rolling as well as pulling a tree, a statue, and
        even a moose. *Causally destroyed school property. *Can survive the inside
        of a tornado. *Managed to lift up large objects like small buildings with
        quick speed. *Flew to the moon, and back within a short time frame.My Life
        As A Teenage Robot - "There''s No Place Like Home School" (Season 3) *Can
        say 500 words a minute.My Life As A Teenage Robot - "Stage Fright" (Season
        3) *Defeated a giant pizza robot that can push away 2 buildings away.My Life
        As A Teenage Robot - "A Spoonful of Mayhem" (Season 3) *Slowed down 2 giant
        walls from crushing her with her strength. *Destroyed multiple asteroids.My
        Life As A Teenage Robot - "Infectious Personality" (Season 3) *Destroyed a
        being who stated that he can destroy a planet. *Prevented a building from
        falling. *Flew around Earth multiple times. *Tanked and pushed back a missile.
        *Lifted multiple Zoo animals. *Can keep up with the Lancer in combat, who
        can react to Jenny''s lasers. *Instantly incinerated a soccer net. *Outsmarted
        Vexus despite her knowing Jenny''s weapons and weaknesses. {| class="mw-collapsible
        mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
        | colspan="2" style="text-align: left; " |Notable Attacks/Techniques: |- |
        *Superhuman Strength: Possesses inhuman amounts of strength. So much to the
        point she can causally destroy the environment around her. *Weapon Creation:
        She is designed to be a battle droid. Which allows her to generate any weapon
        she desires. Which includes weapons like laser beams, drills, golf clubs,
        mace, missiles, electricity, and so much more. *Transformation: She can transform
        her body into anything. This include things like planes, tanks, and bikes.
        *Shapeshifting: She can change her entire appearance. Usually for stealth
        purposes. |} ==Gallery== File:Jenny-Pilot-Season1-Final.PNG.webp File:JennyMovieStar.webp
