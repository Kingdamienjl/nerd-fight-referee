  intelligence:
    text: 'Extraordinary Genius (Zedd has been alive for over several thousand eons,
      he has been expanding his knowledge on dark magic and artifacts, his knowledge
      unparalleled and there is no dark secret he is not aware of. Zedd was able to
      rebuilt the Serpentera, the most massive Zord at the time, and can perfectly
      pilot it despite being extremely complex and far technological advanced than
      all of humanity by many generations) Extraordinary Genius (Zedd is a strategical
      expert . Dwarfs Tommy Oliver, Jason Lee Scott and even Goldar in combat skills.
      Capable of remembering the fighting styles of the people he fought, recognized
      the Vessel''s fighting style to be similar to that of an Eltarian. Even if someone
      knows his fighting style, he can create new styles by utilizing his powers as
      a magician.Power Rangers issue 15 He can copy and counter an opponent''s magical
      spell or fighting style and moves by seeing them once, far weaker and less skilled
      characters, even Putties, can adapt and learn entire styles and techniques by
      seeing them once, even Tommy''s fighting style that mixes up every fighting
      style to ever exist. Zedd is also far superior to not only Polluticorn, who
      excels in all unarmed combat, but also Goldar who is his greatest warrior, training
      him regularly. Zedd is one of the greatest warriors in the universe, far exceeding
      many geniuses in fighting including the ones mentioned above) Zedd isn''t only
      a genius on the field of fighting or engineering but is also extremely knowledgeable
      on the cosmos and its secrets. Zedd has traveled around the multiverse itself,
      along with other magicians, seeing a lot of artifacts and magic powers that
      connect to the very existence itself but also beyond it. Zedd is aware of the
      Morphin Grid and its fundamental existence that binds all of creation. Zedd''s
      knowledge on the very universe and its way of working is vast and comparable
      to Rita''s books and Zordon''s data. Standard Tactics: Zedd will not fight someone
      head to head at first, he will send his army of Putties and a monster, that
      he will create depending on objects or living organisms he will find in the
      area. After his monsters are destroyed, Zedd will use his combat skills and
      also his powerful energy and lightning blasts to overwhelm his opponents, blasts
      that Zedd loves to use in the form of AoE of massive range. Zedd will also use
      his magic to overwhelm and defeat the opponent but they are mostly used if the
      fight drags out or if Zedd is bloodlusted and annoyed'
    source_ids:
    - vsbattles-lord-zedd-power-rangers
    confidence: 0.6
    notes: auto_repair source extraction
