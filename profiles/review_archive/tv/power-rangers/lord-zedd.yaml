        | right|320px right|320px * Lightning Attacks: Lord Zedd can create powerful
        lightning attacks from his visor, body or his personal Z-Scepter. They can
        be used for various things, such as blasting the enemy or putting them under
        a powerful spell. * Weather Manipulation: Lord Zedd can manipulate the weather
        in a way of creating storms or winds, even in the moon itself. Much like other
        magicians in the franchise, Zedd can create powerful storms that can be felt
        from the moon all way into the Earth * Matter Manipulation: Zedd''s main method
        of causing trouble is by manipulating matter to create his new monsters. By
        manipulating matter at sub-atomic levels, Zedd can transmute innocent objects
        and animals into powerful and ugly monsters ready to destroy the planet. Zedd
        not only manipulates matter at such levels to utilize transmutation but also
        use it to deconstruct the enemy and objects. * Magic: Zedd is an expert on
        dark magic and been studying it for several thousand eons, dwarfing even powerful
        magicians who are classified as some of the strongest in the galaxy. His knowledge
        over dark magic is no joke and he even combined it with his armed and unarmed
        combat styles to create a brand new fighting style. |} Note: As Power Rangers
