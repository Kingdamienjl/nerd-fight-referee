      value: Low Complex Multiversal to High Complex Multiversal (Link defeated Demise
        in Skyward Sword, a primordial entity who existed before Hyrule's creation
        and wielded power that could reshape reality across dimensions. When possessing
        the complete Triforce, Link wields power derived from the Golden Goddesses
        who created the entire Zelda multiverse, which according to the Hyrule Encyclopedia
        contains "millions of parallel worlds." The Triforce sustains entire dimensions
        as seen in A Link Between Worlds, where without it, Lorule began to collapse.
        In the Japanese version of A Link to the Past, Ganon with the full Triforce
        "transcended space and time," placing its power beyond conventional dimensional
        constraints) | Low Hyperversal to High Hyperversal (The Golden Goddesses exist
        beyond the dimensional structure of the Zelda multiverse, having created the
        very concepts that govern reality. By wielding the complete Triforce in games
        like Wind Waker and A Link to the Past, Link gains access to power that can
        fundamentally reshape the structure of reality across all dimensions and timelines.
        In Majora's Mask, Link defeats Majora, an entity capable of collapsing dimensional
        boundaries and threatening the fabric of reality itself. The ability to counter
        such metaphysical threats places Link at Hyperversal levels when wielding
        divine artifacts) | Low Outerversal to Outerversal (At his absolute peak with
        the complete Triforce, Link channels the essence of the Golden Goddesses who
        existed in a state of pure abstraction "before time began, before spirits
        and life existed" as stated in Ocarina of Time. The Japanese texts of Skyward
        Sword and A Link to the Past describe the Triforce as power that "stands beyond
        all concepts," placing it at Outerversal levels. Link's ability to defeat
        entities like Demise, whose curse transcends conceptual boundaries to affect
        all incarnations throughout history, demonstrates his capacity to operate
        at this cosmic level when wielding divine artifacts) | High Outerversal+ to
        Extraversal (When wielding the complete Triforce, Link channels the essence
        of the Golden Goddesses who existed in a primordial void that "predates all
        concepts" and created the fundamental frameworks that govern all reality.
        The research confirms that "the Goddesses give concepts to the Zelda cosmology"
        - they didn't just transcend concepts, they created concepts themselves. This
        places the Golden Goddesses at a level that existed before the very idea of
        transcendence, dimensional hierarchies, or conceptual frameworks. The Japanese
        texts describing the Triforce as power that "stands beyond all concepts" indicates
        it operates on a meta-conceptual level that transcends even the frameworks
        that create outerversal hierarchies. Link's scaling to beings who existed
        before and created the concepts that other High 1-A entities transcend places
        him at the absolute peak of the tiering system, comparable to entities that
