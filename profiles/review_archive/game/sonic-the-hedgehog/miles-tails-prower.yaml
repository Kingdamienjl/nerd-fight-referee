        \ are swung increasing his attack range. * Rapid Tails Attack: An advanced\
        \ form of the Tail Swipe move where Tails performs a chain of continuous Tail\
        \ Swipes in rapid succession. * Tornado Attack: Tails performs a Tail Swipe\
        \ at such incredible speeds and force that it forms air currents around him,\
        \ making him resemble a mini tornado. * Spin Attack: Tails curls into a ball\
        \ while rolling along the ground. * Spin Jump: A variant of Spin Dash used\
        \ to attack enemies mid-jump. * Spin Dash: Tails rolls in place to charge\
        \ up, then dashes forward at high speed in ball form. It is said that Tails\
        \ was the first to create the spin dash by imitating Sonic's performances.\
        \ * Homing Attack: Tails can spin jump and home in on his enemies and attack\
        \ them with such velocity and speed. * Dummy Ring Bomb: Tails throws several\
        \ dummy rings that explode on impact. * Dummy Ring Snipe: Tails throws a single\
        \ dummy ring after aiming. * Dummy Ring Blitz: Tails throws a box filled with\
        \ dummy rings from the air that explode and release several dummy rings that\
        \ explode on contact. * Insta-Shield: Tails creates a temporary shield for\
        \ a split-second that can slash enemies and items within their range without\
        \ having to touch them. * Tails Heal: Tails utilizes a healing machine in\
        \ order to recover from damage. * Magic Hook: Tails uses the Magic Hand to\
        \ deliver a punch at opponents. The Magic Hand appears to be a boxing glove\
        \ attached to a spring-like object, allowing him to swing the invention around\
        \ his body before hitting the opponent. * Energy Ball: Tails summons the Energy\
        \ ball, a red arm cannon, and shoots a yellow sphere-shaped energy projectile\
        \ at the opponent. * Flick: Tails summons the Big Hand, a large, gloved hand,\
        \ which appears from underground to flick opponents. * Chu\xB2 Bomb: Tails\
        \ summons a mouse-shaped bomb which runs on the ground and actively seeks\
        \ out opponents. * Adrenaline Rush: Tails deploys a temporal field around\
        \ an ally, boosting their speed and granting them the Hyper status effect.\
        \ Color Powers: * Cyan Laser: Using the power of a Cyan Wisp, Tails transforms\
        \ into a cyan laser beam. As the Cyan Laser, Tails gains the same properties\
        \ as that of a real laser, allowing him to move as a living beam of light.\
        \ When hitting any surfaces as the Cyan Laser, Tails can also bounce off them\
        \ as if they were a reflective surface. * Indigo Asteroid: Using the power\
        \ of an Indigo Wisp Tails turns into an orb-shaped body with striped indigo\
        \ skin and a matching planetary ring encircling his middle. As the Indigo\
        \ Asteroid, Tails essentially becomes a miniature planet with a strong gravitational\
        \ field. Tails is as such capable of creating a powerful gravitational pull\
        \ around himself, strong enough to tear all kinds of objects to pieces and\
        \ pull them into the Asteroid Ring. Additionally, the gathered matter can\
        \ be used to empower the gravitational pull. The Indigo Asteroid also grants\
        \ Tails the ability to levitate through midair. * Yellow Drill: Using the\
        \ power of a Yellow Wisp Tails turns into a yellow spiral drill. As the Yellow\
        \ Drill, Tails can burrow and tunnel underground at remarkable high speeds\
        \ and can be applied underwater, allowing Tails to move through water like\
