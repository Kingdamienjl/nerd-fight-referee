        \ a four-wheeled cart which can drive at high speeds. The Cyclone is one of\
        \ the Tails' most powerful creations, capable of overpowering all kinds of\
        \ robot drones belonging to GUN and can even overpower Dr. Eggman's Eggwalker.\
        \ It is armed with various weapons, including the Volkan Cannon mini-gun,\
        \ a laser target, a grabbling hook, and two kinds of missile launchers which\
        \ can either shoot homing missiles at locked targets or missile barrages.\
