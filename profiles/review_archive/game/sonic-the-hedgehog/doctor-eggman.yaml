  intelligence:
    text: Supergenius (Created Sage, Eggman's most advanced AI that successfully integrated
      herself within Cyber Space, and managed to restore her code even after she was
      destroyed. Built a large empire of advanced machines and robots which have varied
      purposes, with his technology far surpassing modern weaponry. He has constructed
      machines capable of draining energy from sources of power greater than the Chaos
      Emeralds, granting enough power to slice through dimensions and essentially
      warp reality. Created a ray powerful enough to place the entire planet under
      mind control. Has made devices capable of forging miniature stars. Developed
      a method of turning harmless woodland critters into dangerous robots which serve
      him. Created the Final Egg Blaster, a weapon which has a laser powerful enough
      to destroy multiple star systems in a single blast. Created weaker prototypes
      of the Phantom Ruby, which were still capable of warping reality to a limited
      degree. Stated several times to be a certified genius, an authority on robotics
      and boasting an IQ of 300. Is an intellectual rival to Tails, and regarded by
      Doctor Starline as the greatest scientific mind in the worldSonic the Hedgehog
      Free Comic Book Day 2022)
    source_ids:
