        a touchpad or voice command, the wrist controller can fire laser beams, beams
        for encapsulating victims as strong as Sonic in force fields, and beams for
        teleportation. It also possesses a ghost detector. The wrist controller also
        possesses technopathy abilities, enabling it to control virtually anything
        electronic around it. *Doomsday Device: Fires a sphere which unleashes an
        omnidirectional wave of powerful and unstable energies set at certain frequencies
        which erases matter over a radius encompassing an entire planet. *Anti Gravity
        Ray: A machine that can negate the forces of gravity by emitting a yellow
        anti-gravity field. Its anti-gravity field can be used to lift common objects
        or even something as large as Dr. Eggman''s lair. Conversely, the Anti Gravity
