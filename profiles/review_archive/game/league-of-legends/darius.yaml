        \ Having served in the Noxian warhost since he was 12, Darius has spent most\
        \ of his life fighting in numerous grueling campaigns of conquest from one\
        \ end of the known world to the other, as well as crushing a number of rebellions\
        \ against the throne. As he rose steadily through the ranks he garnered a\
        \ great respect for his aggression, discipline, and refusal to ever take a\
        \ backward step, even going so far as beheading a Noxian general after he\
        \ ordered a retreat, rallying the scattered warbands and winning a great and\
