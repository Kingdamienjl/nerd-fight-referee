  stamina:
    text: Superhuman (Able to continue fighting even after having nearly all of his
      life force drained away, Should be comparable to other Vanguard members such
      as Diador, who was able to fight nearly non-stop for several days against the
      Trifarian Legion, and Cithria, who even as a recruit had to go through near
      constant exertion for two weeks before beginning to feel the effects of exhaustion.
      Even normal Demacian soldiers are taught to withstand tremendous amounts of
      injury, not showing any outward signs of pain even when their body is crushed
      and their eyes are impaled with shards of glass.)
    source_ids:
    - vsbattles-garen-league-of-legends
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range with sword, potentially Hundreds of Kilometers with
      Demacian Justice (vertically) | Extended Melee Range with sword, potentially
      Hundreds of Kilometers with Demacian Justice (vertically) | Likely Interstellar
    source_ids:
    - vsbattles-garen-league-of-legends
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (Garen is a highly skilled combatant and strategist, widely considered
      to be one of the greatest swordsmen in Demacia, having trained non-stop from
      the age of twelve in the art of combat and war and quickly gaining a fearsome
      reputation on the battlefield. By the time he turned eighteen he had already
      served in multiple campaigns, fighting off Freljordian barbarians, mages, and
      the Noxian military, which granted him a nomination as a member of the Dauntless
      Vanguard, a position he won with ease through his sheer courage and skill. His
      skill was so well recognized by the rest of the Vanguard that of the over two
      thousand members [each being a legendary hero in their own right, the most skilled
      and well trained soldiers in Demacia, masters of multiple weapons, and boasting
      extensive knowledge of battle tactics and warfare on top of having accomplished
      extraordinary feats such as singlehandedly slaying dragons and wyrms, outmatching
      entire hosts of the Trifarian Legion, and being able to take on entire armies
      on their own and emerge victorious] he was chosen to be the new Sword-Captain
      after the previous leader had died, a decision that was unopposed by any member
      of the Vanguard. As a member of the Dauntless Vanguard, Garen is a master of
      battlefield strategy, able to communicate entire combat plans to other members
      of the Vanguard through nothing but subtle eye and facial movements, as well
      as perceive other members' strategies given in the same manner through just
      peripheral vision, and doing so at a speed described as blindingly fast by people
      less trained than them. He is also hyper-observant, as all members of the Vanguard
      are required to master the art of observation of every aspect of the battlefield
      as well as potential changes that could be made both within and outside of their
      line of sight at any given moment and identify what their enemy is observing
      and how they can potentially advance.)
    source_ids:
    - vsbattles-garen-league-of-legends
    confidence: 0.6
    notes: auto_repair source extraction
