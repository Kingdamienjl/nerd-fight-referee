  attack_potency:
    text: Multiverse level (Is rather equal to his peers, Aqua and Ventus (Kingdom
      Hearts)) | Complex Multiverse level (Significantly stronger than before, could
      fight Xehanort, is noted in KHIIFM as being far more powerful than any foe KHII
      Sora has ever faced before including Sephiroth and Xemnas, could put up a fight
      against Terra-Xehanort in KHIII even while being supported by the Dark Guardian
      and a fragment of Xehanort's heart from the present, who could also defeat Re
      Mind KHIII Sora)
    source_ids:
    - vsbattles-terra-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Infinite (Capable of keeping pace with Xehanort and Vanitas despite his
      focus on physical strength rather than speed, capable of traveling between worlds
      [Which each reside in different solar systems] in short periods of time, comparable
      to others that can travel across the worlds with a Keyblade Glider, which has
      been shown to also relate to direct physical movements and is comparable to
      the Gummi Ship based on Aqua and Ventus getting to the Keyblade Graveyard within
      a day just like it while also including the threat of Gummi Heartless, comparable
      to Xemnas, who reacted to Roxas going from Radiant Garden to the Keyblade Graveyard
      in seconds, not far behind Sora, who reacted to a Keyblade beam from Xehanort
      of a similar nature as this one) | Infinite (Significantly faster than Terra,
      was easily keeping up with KHII Sora, who at some point in KHII fought Roxas,
      the second most powerful member of Organization XIII as well as one of the fastest
      characters in the entire series)
    source_ids:
    - vsbattles-terra-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
