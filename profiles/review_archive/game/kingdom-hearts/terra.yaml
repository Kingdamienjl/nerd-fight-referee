    - field: weaknesses
      value: "Terra has normal human weaknesses, he is highly arrogant, and he can\
        \ only change the precedence of one thing at a time. Notable Attacks/Techniques:\
        \ Terra_Flour_Guillotine.jpg|Terra shapes flour into a guillotine Terra_Flour_Spear.jpg|Terra\
        \ produces a flour spear Wheat Manipulation: A byproduct of his Execution\
        \ of Light spell is the manipulation of wheat flour, as a symbol of 'Flesh\
        \ of God' and the Fruits of the Earth, similar to red wine being the 'Blood\
        \ of God'. Terra normally uses this to create a white guillotine to attack\
        \ the enemy, though he can also use it in a more amorphous shape compared\
        \ to a small white tsunami, capable of affecting a small street. Strength\
        \ Recovery: Terra can recover his strength more quickly and efficiently through\
        \ partaking in earth's harvest and blessings. The quality of these blessings\
        \ does not matter, as a few cheap wine bottles will suffice. Terra_Precedence_Blades.jpg|Terra\
        \ is unharmed by Itsuwa's spear Terra_Precedence_Magic.jpg|Terra defends himself\
        \ from Tsuchimikado's spell Terra_Precedence_Phasing.jpg|Terra manipulates\
        \ precedence to phase through a wall Terra_Precedence_Air.jpg|Terra stops\
        \ Itsuwa's spear by raising the air's precedence over it Execution of Light:\
        \ This power allows Terra to change the precedence of things. Something of\
        \ a higher precedence cannot be harmed by a lower precedence, while something\
        \ of a higher precedence can easily harm something of lower precedence. For\
        \ example, he can make flour have a higher precedence than brick walls, so\
        \ flour will be able to cut through walls. He can also do things like make\
        \ air have a higher precedence than weapons making it so that people can not\
        \ move their weapons, human bodies have a higher precedence than steel wires\
        \ that would normally cut a human apart to allow him to brush them away as\
        \ easily as spider webs, flour have a higher precedence than ceilings so that\
        \ he can lower a ceiling by stabbing his flour guillotine on it and pulling\
        \ down, lower the air's precedence below flour's so that he can use flour\
        \ like a fan to launch an explosive air shockwave or raise human skin's precedence\
        \ over things like stones, bullets, blades or magic to nullify enemy attacks.\
        \ He can also make himself phase through solid objects by lowering their precedence\
        \ below the human body's.Toaru Majutsu no Index Volume 14 Chapter 3 Part 8\
        \ The one major weakness of this spell is that he can only change the precedence\
        \ of one thing at a time, and he must call the name of the thing that he wants\
        \ to change the precedence of like this: \u201CPrecedence: Magic \u2013 Lower,\
        \ Human Skin \u2013 Higher.\u201D. ==Notable Matchups== Victories: Losses:\
        \ Inconclusive: ==References== {{discussions}} Category:Characters Category:Toaru\
        \ Majutsu no Index Category:Antagonists Category:Evil Characters Category:Humans\
        \ Category:Intangibility Users Category:Light Novel Characters Category:Magic\
        \ Users Category:Male Characters Category:Villains"
