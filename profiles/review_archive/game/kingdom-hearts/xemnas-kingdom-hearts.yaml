  attack_potency:
    text: Multiverse level (Undamaged by KHI Sora, Donald, Goofy and Beast, able to
      fight an endgame KHII Sora who had fought many powerful enemies including Sephiroth.
      Is the leader of and confirmed by Word of God to be the most powerful member
      of Organization Xlll, making him above Roxas at his full potential and the likes
      of Xaldin and Lexaeus who are both tied as the third strongest), can ignore
      durability with Nil | Multiverse level (Matched the full power of Sora and Riku;
      he is stronger than his base form and he would have killed Sora if not for Riku's
      interference), can ignore durability with Nil, Time, and Water | Complex Multiverse
      level (Comparable to if not slightly stronger than Sora and the other Guardians
      of Light), can ignore durability with Nil
    source_ids:
    - mediawiki-xemnas-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Infinite (Comparable to others that can travel across the worlds with a
      Keyblade Glider, which has been shown to also relate to direct physical movements
      and is comparable to the Gummi Ship based on Aqua and Ventus getting to the
      Keyblade Graveyard within a day just like it while also including the threat
      of Gummi Heartless, reacted to Roxas going from Radiant Garden to the Keyblade
      Graveyard in seconds, not far behind Sora, who reacted to a Keyblade beam from
      Xehanort of a similar nature as this one) | Infinite (Faster than his base form,
      spent the better part of his fight with Sora and Riku actively trying to blitz
      them by himself, and almost succeeding, his movements are a blur to Sora, likely
      copying the movements of Larxene who did the same)
    source_ids:
