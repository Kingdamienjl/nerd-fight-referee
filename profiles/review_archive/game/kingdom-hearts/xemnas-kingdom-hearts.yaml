  stamina:
    text: Superhuman (Created entire environments for Sora to fight in, summoned scores
      of Nobodies, and even fought Sora himself several times, and still showed no
      signs of fatigue by the time you get to him in the Realm Between; in Dream Drop
      Distance he manages to fight Sora to the point the latter is exhausted and later
