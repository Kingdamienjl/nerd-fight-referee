    - field: weaknesses
      value: 'None Notable. Notable Attacks/Techniques: * Keyblade (Star Seeker, then
        Kingdom Key D / Star Cluster): Through channeling one''s strength of heart,
        the user can summon a Keyblade to use in battle. Mickey''s Keyblade is the
        Kingdom Key D, a weapon from the realm of darkness. Through the use of the
        Keyblade, the user is granted increased strength, speed, durability, and increased
        magical power, as well as access to special abilities, like turning your keyblade
        into a bike or whip. Thus far, Mickey has not demonstrated such special abilities
        despite his level of power and skill as a Keyblade Master. Mickey has recently
        upgraded his previous two Keyblades and merging them into the Star Cluster
        keyblade. * Pearl: Can summon a ball of light energy that homes in on the
        target at high speeds. * Holy: Can heal multiple targets back to perfect Health.
        Takes some time to charge though. * Stopza: More powerful than Stopga, possibly
        the strongest version of the Stop spell to date. Towards the end of KH3D,
        Mickey drops into Organization XIII''s throne room Where Nothing Gathers and
        casts Stopza on the 12 Xehanorts save for himself and Riku. Stopza is shown
        to have a moderately large range, calculated to be around 67.2m. * Ultima:
        An extremely powerful offensive spell used by Mickey. It was so strong that
        it took Master Xehanort''s Stopza, clashing with it, in order to nullify its
        power.'
      source_id: character-stats-profiles-mickey-mouse-game-kingdom-hearts
