power_scale:
  tier:
    text: 'At least High 4-C, higher. Likely 2-A | 4-A, possibly 3-A Name: Michael
      Theodore Mouse (full name) Origin: Disney, Mickey & Friends, Kingdom Hearts
      Gender: Male Age: 90 years old in the real time (Was created in 1928). Otherwise,
      depicted as in early-to-mid 20s Classification: Mouse, mascot, king, jedi, detective,
      superhero, entertainer, musketeer, etc.'
    source_ids:
    - character-stats-profiles-mickey-mouse-game
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Large Star level (Far superior to Zeus. Helped Aqua in her fight against
      Ventus-Vanitas with the Complete X-Blade. Is portrayed to be at least equal,
      and possibly superior to Sora and Riku. Capable of fighting Armored Xenmas if
      Sora falls in battle during any part of the fight), higher with Force Amplification,
      items, toon force and Super Mickey. Likely Multiversal level+ (Fought Ansem,
      who used the power of the destroyed worlds to fight against Sora. And every
      world would be restored after Ansem's defeat. The amount of worlds destroyed
      can be seen at the end credits, every shooting star is a world. Note that worlds
      can at a bare minimum have a star and worlda star and world, to being as big
      as a universe. According to Yen Sid, there are countless worlds shining like
      stars in the sky, meaning there's a infinite "which's synonym is countless"
      number of worlds as a star equates to a world. Mickey also fought Xemnas after
      he had absorbed a broken Kingdom Hearts, that would still scale to the true
      Kingdom Hearts which created a ton of worlds which means there are as many worlds
      as there are stars according to the manga) | Multi-Solar System level, likely
      Universe level (Significantly amps his base power. Capable of manipulating several
      star systems and with the wave of his hand, manipulated celestial bodies, however
      the latter is debatable on what they are. Briefly fought against Genie Jafar
      with the Sorcerer's Hat)
    source_ids:
    - character-stats-profiles-mickey-mouse-game
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively FTL+ (Dodged laser fire. Is a very quick and nimble character
      on par with Sora and Riku. Is able to keep up with certain characters if Sora
      falls. Comparable to Ventus. Traversed the solar system with Pluto and reacted
      to the things that are happening around them), likely Infinite (Moved around
      in the Realm of Darkness, a place where time doesn't exist) to Immeasurable
      (Comparable to Young Xehanort who transcends time as stated by Tetsuya Nomura)
    source_ids:
    - character-stats-profiles-mickey-mouse-game
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Large Star level (Can take hits from Ventus-Vanitas who wielded the X-Blade,
      a weapon comparable to an incomplete Kingdom Hearts), higher with Force Amplification,
      items, toon force and Super Mickey. Likely Multiversal level+ (Survived hits
      from Ansem and Xenmas) | Multi-Solar System level, possibly Universe level (Briefly
      fought Genie Jafar and caught a fireball from him)
    source_ids:
    - character-stats-profiles-mickey-mouse-game
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Can go on for an extended duel with Sora and not appear even
      the slightest bit fatigued even after being defeated)
    source_ids:
    - vsbattles-mickey-mouse-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range with his sword. Planetary with magic
    source_ids:
    - vsbattles-mickey-mouse-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Sephiroth is extremely skilled in the use of his signature weapon and magic
    source_ids:
    - vsbattles-mickey-mouse-game-kingdom-hearts
    confidence: 0.6
