- id: claim-powers-and-abilities-31309869
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Standard Keyblade powers, Damage Boost
    (Can make all of his attacks critical hits via the All Critical ability that various
    Keychains he possesses have, Via the Strike Armlet which has the Critical Boost
    ability that increases Sora's chance of landing critical hits), Summoning (Can
    summon meteors via Meteor Rain), Flight (Can glide through the air), Self-Sustenance
    (Type 1. Can breathe in space), Magic, Homing Attack (With most spells), Fire
    Manipulation, Ice Manipulation, Electricity Manipulation, Air Manipulation, Paralysis
    Inducement (Can immobilize foes with wind-based spells and the Wishing Star Keychain
    which has the Aero Counter ability which allows him to inflict this via blocking),
    Enhanced Senses (Has a "map" in his head (While it could normally be dismissed
    as a game mechanic, the status effect in 358/2 Days that prevents access to it
    justifies it being an actual ability), said map also displays the locations of
    enemies and allies), Information Analysis (Via Scan which allows him to view his
    opponent's health), Life Absorption (Via the Metal Chocobo and the Ultima Weapon
    Keychains which have the Drain ability), Healing (Via Curaga and various items,
    Via various Keychains which have the Drain Counter ability that allows the user
    to recover health by blocking attacks, Via various Keychains which have the Regen
    ability), Statistics Amplification (Via various Keychains, Via the Power Armlet
    which has the Attack Boost ability that can increase its user's attack strength
    if they have less than 25% of their health left, Via the Wizard's Armlet which
    has the Magic Boost ability that can increase its user's Magic if they have less
    than 25% of their health left, Via various Keychains which have the Attack Upgrade
    ability that increases the power of its user's physical attacks, Via various Keychains
    which have the Magic Upgrade ability that makes its user's Magic more powerful,
    Via the Olympia and the Metal Chocobo Keychains which have the Full Swing ability
    that increases the user's strength in exchange for landing less critical attacks,
    Via the Oblivion Keychain which has the Two-Edged Blade ability that increases
    the strength of its user's physical attack but drains their health with every
    hit in exchange), Damage Reduction (Via various Keychains which have the Protect
    ability that can reduce damage from attacks by 25%, Via various Keychains which
    have the Shell ability that can vastly reduce damage from Magic attacks, Via the
    Half-moon Armlet which has the Half-Damage ability that can halve all damage when
    Sora has 25% or less of his health left), Light Manipulation (Can use several
    light based attacks as a warrior of light), Gravity Manipulation (Via Gravity
    Drop), Magnetism Manipulation (Via Magnega), Resurrection (Via Oathkeeper which
    has the Auto-Life ability that allows the user resurrect themself), Time Manipulation
    (In the form of slowing down and stopping time), Status Effect Inducement (Can
    stun opponents with Stun Impact), Keyblade Master-level Fighter, Invulnerability
    (While healing himself (Via Leaf Bracer)), Vibration Manipulation (Via Quake),
    Mind Manipulation, and Confusion (Can confuse the target with Confuse), Instinctive
    Reaction (Via various Keychains which have the Auto-Block ability which allows
    Sora to sometimes automatically block attacks, Via various Keychains which have
    the Auto-Dodge ability that allows Sora to sometimes automatically dodge attacks,
    Via the Kingdom Key which has the Auto-Potion ability which allows Sora to automatically
    heal himself with Potions (Hi-Potions if he has no Potions) when he has low health,
    Automatically counterattacks after blocking via Auto-Counter, Block-Counter and
    Command Counter (The former two abilities are provided by the Oblivion Keychain
    and the latter by the Command Ring), Automatically counterattacks after being
    attacked mid-air via Auto-Payback (from the Oblivion and the Zero/One Keychains),
    Aerial Payback and Command Payback (from the Payback Ring)), Is able to hold on
    in a fight after taking massive damage or being comboed via Second Chance and
    Once More Elemental Manipulation (Fire, Lightning, Ice, and Wind), Time Manipulation
    (Data-Sora's Keyblade was able to nullify Jafar's Magic-based Time Stop without
    Sora having to even think about it, Can move inside the Realm of Darkness, Resists
    getting his time slowed down), Status Effect Inducement (Getting movement controls
    reversed, Getting his ability to jump (when not attacking) nullified, and getting
    blinded), Statistics Reduction (In the form of getting his defense cut), Power
    Nullification, Absorption, Death Manipulation (Unaffected by Heartless, which
    passively kill and absorb things around them), Data Manipulation (Ansem The Wise
    stated that the "heart" cannot be contained by data, and that the process itself
    would be incalculable), Existence Erasure (Can take hits from Heartless, which
    can do this with any attack), Cosmic Radiations, Curse Mani
  source_ids: *id003
  decisive: true
