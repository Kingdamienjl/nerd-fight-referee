        \ the use of the Keyblade, the user is granted increased strength, speed,\
        \ durability, and increased magical power, as well as access to special abilities,\
        \ like turning one's Keyblade into a bike or whip. Thus far, Riku has not\
        \ demonstrated such special abilities, despite achieving Master status as\
