    - field: standard_equipment
      value: "Note: Pre-Keyblade, Riku only holds as Standard Equipment his wood sword\
        \ and Potions. |-|Keyblade= right|100px * Keyblade: Through channeling one\u2019\
        s strength of heart, the user can summon a Keyblade to use in battle. Through\
        \ the use of the Keyblade, the user is granted increased strength, speed,\
        \ durability, and increased magical power, as well as access to special abilities,\
        \ like turning one's Keyblade into a bike or whip. Thus far, Riku has not\
        \ demonstrated such special abilities, despite achieving Master status as\
        \ of the events of Dream Drop Distance. His original Keyblade, Soul Eater,\
        \ reflects his actions from working with Maleficent and her force's of darkness\
        \ and Ansem and what he had done to countless worlds as a result of being\
        \ with them. His personal and developed keyblade, Way to the Dawn, reflects\
        \ his atonement for his past actions and thus provides a balanced boost to\
        \ physical attacks and magic. |-|Keychains= right|100px Found among all Keyblades,\
        \ Keychains allow the user's Keyblade to change shape and abilities, which\
