    - field: powers_and_abilities
      value: "{{Border|Scroll=Yes|Visible=Yes|Content= *Expert Strategist and Tactician\
        \ (When unexpected situations make his mind race, he can resist excessive\
        \ emotional reactions and keep thinking rationally. He can process situations\
        \ of what has happened, what is happening, and what might happen next, in\
        \ thousandths of a second\u2014even to the point where time stands still.\
        \ If he is confronted with an intelligent and dangerous entity, he will be\
        \ cautious, trying to maintain control and not let knee-jerk reactions get\
        \ the better of him-avoiding any action that could be perceived as aggressive.\
        \ Likewise, in interactions and conversations, he would first go with the\
        \ flow while gathering information and deducing the ulterior motives behind\
        \ it, then consider the consequences of each response before finally taking\
        \ action) *Social Influencing (Charisma \u2014 At the age of thirteen, he\
        \ transforms from a child who lost everything to a figure who provides inspiration\
        \ and direction to individuals of similar fate\u2014showing incredible resilience\
        \ by taking the initiative to find a new shelter for the survivors who lost\
        \ everything and offering a perspective that provides new hope and purpose,\
        \ namely, inviting them to accept the fact that they \u201Cdo not exist\u201D\
        \ in the eyes of a more powerful being and, therefore, must hide their existence\
        \ in order to survive. Not only that, but he also directs them to survive\
        \ for the hope of the future, so that one day someone can witness the end\
        \ of the war. Leadership \u2014 At the age of eighteen, he was already in\
        \ a position that required him to make decisions that would determine the\
        \ fate of two thousand people. He became a leader because he had the determination\
        \ to make difficult decisions that were impossible to avoid for the safety\
        \ of the village and the village relied on him completely; if they lost him,\
        \ they would only be trapped in resignation and fear. Reputation \u2014 Convinced\
        \ everyone with a tactic that was the most logical way to increase the likelihood\
        \ of overall safety, that is, the principle that sacrificing one life to save\
        \ two (sacrificing a few individuals to keep a large group safe) was a strategy\
        \ to maintain the community in the midst of dangerous conditions, thereby\
        \ directing everyone to prioritize the common good over personal interests.\
        \ Even his words and decisions are like policies that cannot be contested\
        \ by those under his command. For example, when he silenced Alei's advice\
        \ despite his insistence, and also when he ordered Ivan to die. Instigating\
        \ Fear \u2014 Made Alei shiver and tremble without saying a word and only\
        \ gave him a look and gesture as if he was slitting his throat. Deception\
        \ \u2014 Implied to has deceived everyone just like breathing) *Analytical\
        \ Prediction and Masterful Analytical Skills (Was able to predict and see\
        \ through an Ex-Machina's\u2014\u2014a machine's lies. Was able to predict\
        \ what his interlocutors' intentions and motives were while talking to them.\
        \ Can gain much informations after analyzing and deducing the motives and\
        \ intentions of his interlocutors; Analyzing the Ex-Machina's motives, and\
        \ suspecting that it had been watching the humans for a long time. Moreover,\
        \ when Ex Machina proposed a game as a form of \u201Cchallenge,\u201D he immediately\
        \ identified an opportunity in this situation, in that he understood that\
        \ accepting this game might pave the way for avoiding an immediate threat\
        \ and quickly realized that accepting this offer was an opportunity to gain\
        \ more information about Ex Machina. Even though he knew the chances of winning\
        \ were slim, he still strategized the most realistic strategy by adding conditions\
        \ if he won. At the moment Ex Machina mentioned the village, Riku didn't necessarily\
        \ take it as a coincidence, he further analyzed that this mention could have\
        \ two main reasons: either Ex Machina was just stating the facts neutrally,\
        \ or it was implicitly giving a warning with a specific intention. He thought\
        \ that if Ex Machina had an ulterior motive involving the village or humans,\
        \ it would probably accept his new terms as a way to achieve its goal. Conversely,\
        \ if Ex Machina rejected the condition, he could conclude that the village\
        \ was not its main focus) *Adaptation (Adapted Schwi's adaptation and her\
        \ analytical power in chess by exploiting her weaknesses\u2014a lack of understanding\
        \ of the \"heart\" and an inability to read hidden intentions or intuition\
        \ through the use of psychological tactics like deception, baiting, and manipulation,\
        \ which she can't calculate or predict. He's always adapting his tactics and\
        \ strategies to counter Schwi's moves) *Mind Reading (Capable of reading Think's\
