    - field: standard_equipment
      value: "Note: Pre-Keyblade, Riku only holds as Standard Equipment his wood sword\
        \ and Potions. |-|Keyblade= right|100px * Keyblade: Through channeling one\u2019\
        s strength of heart, the user can summon a Keyblade to use in battle. Through\
        \ the use of the Keyblade, the user is granted increased strength, speed,\
        \ durability, and increased magical power, as well as access to special abilities,\
        \ like turning one's Keyblade into a bike or whip. Thus far, Riku has not\
        \ demonstrated such special abilities, despite achieving Master status as\
        \ of the events of Dream Drop Distance. His original Keyblade, Soul Eater,\
        \ reflects his actions from working with Maleficent and her force's of darkness\
        \ and Ansem and what he had done to countless worlds as a result of being\
        \ with them. His personal and developed keyblade, Way to the Dawn, reflects\
        \ his atonement for his past actions and thus provides a balanced boost to\
        \ physical attacks and magic. |-|Keychains= right|100px Found among all Keyblades,\
        \ Keychains allow the user's Keyblade to change shape and abilities, which\
        \ vary a lot depending on the user and the Keychain itself. The following\
        \ are all the formes Riku's Keyblade can take from the respective Keychain:\
        \ KHI {{Scroll box|content= Keyblade of heart.png|Keyblade of heart|link=http://www.khwiki.com/Keyblade_of_heart\
        \ }} KHII {{Scroll box|content= Way to the Dawn KHII.png|Way to the Dawn|link=http://www.khwiki.com/Way_to_the_Dawn\
        \ }} KH3D {{Scroll box|content= KH3D Way to the Dawn.png|Way to the Dawn Ultima\
        \ Weapon KH3D.png|Ultima Weapon Skull Noise KH3D.png|Skull Noise|link=http://www.khwiki.com/Skull_Noise\
        \ Guardian Bell KH3D.png|Guardian Bell|link=http://www.khwiki.com/Guardian_Bell\
        \ Dual Disc KH3D.png|Dual Disk|link=http://www.khwiki.com/Dual_Disk KH3D Ocean's\
        \ Rage.png|Ocean's Rage|link=http://www.khwiki.com/Ocean's_Rage Knockout Punch\
        \ KH3D.png|Knockout Punch|link=http://www.khwiki.com/Knockout_Punch All for\
        \ One KH3D.png|All for One|link=http://www.khwiki.com/All_for_One Counterpoint\
        \ KH3D.png|Counterpoint|link=http://www.khwiki.com/Counterpoint Divewing KH3D.png|Divewing|link=http://www.khwiki.com/Divewing\
        \ Sweet Dreams KH3D.png|Sweet Dreams|link=http://www.khwiki.com/Sweet_Dreams\
        \ Unbound KH3D.png|Unbound|link=http://www.khwiki.com/Unbound End of Pain\
        \ KH3D.png|End of Pain|link=http://www.khwiki.com/End_of_Pain }} KHIII {{Scroll\
        \ box|content= KH3D Way to the Dawn.png|Way to the Dawn KHIII Braveheart.png|Braveheart|link=http://www.khwiki.com/Braveheart\
        \ }} |-|Potion= right|100px A one-use item that allows to recover health by\
        \ a decent amount quickly by casting it on himself or an ally. |-|Hi-Potion=\
        \ right|100px A one-use item that allows to recover health by a noticeable\
        \ amount quickly by casting it on himself or an ally. |-|Mega Potion= right|100px\
        \ A one-use item that allows Riku and allies to recover health by a decent\
        \ amount quickly by casting it on himself and allies. |-|Ether= right|100px\
        \ A one-use item that allows to recover magic by a noticeable amount quickly\
        \ by casting it on himself or an ally. |-|Hi-Ether= right|100px A one-use\
        \ item that allows to recover magic back to peak quickly by casting it on\
        \ himself or an ally. |-|Mega Ether= right|100px A one-use item that allows\
        \ Riku and allies to recover magic back to peak quickly by casting it on himself\
        \ and allies. |-|Elixir= right|100px A one-use item that allows to recover\
        \ health and magic back to peak quickly by casting it on himself or an ally,\
        \ also rendering the one casted to with a resistance to multiple status effects\
        \ for a while. |-|Megalixir= right|100px A one-use item that allows Riku and\
