    - field: intelligence
      value: Riku is much calmer and cool-headed than his friend Sora and is no less
        capable in combat. Being the first among the two to be declared a Keyblade
        Master (albeit while Sora's attempt was sabotaged by Xehanort), Riku is one
        of the most skilled fighters in the series, being able to fight evenly with
        Xehanort's Thirteen Seekers of Darkness, as showcased during his fight Young
        Xehanort, who was implied to have been possessed by his future self. Like
        Terra before him, Riku's connection with the Darkness allows him to use several
        attacks associated with it, such as Dark Splicer and Dark Aura. As a result,
        he's generally even faster and more powerful than Sora in combat but is weaker
        defensively due to his relative lack of defensive abilities like Reflega.
        Also, he bears immense guilt over his previous actions in the first and thus
        seeks to atone for them, a feeling that haunts him to this day and one that
        his opponents (such as Ansem, Seeker of Darkness) can exploit.
      source_id: vsbattles-riku-kingdom-hearts
