    - field: weaknesses
      value: 'Far less dangerous in melee encounters. Prone to attacking anything
        that hurts it, and as such will lose focus on its main enemy if hit by a stray
        projectile from someone else. Is not immune to its own flames, and can in
        fact harm itself if it is within close proximity of the target when fire spells
        are cast. Most spells take a brief moment of standing still in order to cast,
        leaving it vulnerable to attack during that period. Fire blasts can be avoided
        altogether if the target hides behind cover before they are cast, and they
        leave the Arch-vile exposed to counterattacks if they miss. Notable Attacks/Techniques:
        * Fire Column: The Arch-vile thrusts its hands forward, sending a fast-moving
        column of fire at its target. * Fire Blast: A spell that causes a fire to
        ignite itself underneath the target''s feet and follow them around whenever
        they move. After a moment of gathering its flames, the Arch-vile shoot its
        hands forward, creating an explosion of fire underneath the target that more
        often than not sends them flying backwards. This can be avoided if the target
        manages to leave the Arch-vile''s line of sight before the spell is cast,
        however. * Summon: With this spell, the Arch-vile opens a portal to Hell,
        summoning any demon of its choosing to fight at its side. * Resurrection:
        When presented with a fallen ally, the Arch-vile is capable of bringing them
        back to life with a spell. Resurrected beings are cured of all wounds and
        possess every bit of the strength they had before they died. Note: Not to
        be confused with the Summoner. Despite the two enemies fulfilling the same
        exact role within their respective games in the franchise, they are two different
        monsters with different abilities and thus should not be treated as one in
        the same. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}}
