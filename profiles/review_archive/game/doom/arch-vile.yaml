        \ limits of one's body to dramatically increase strength. It can also be fired\
        \ as blasts of energy or create defensive barriers. Possessing such ridiculous\
        \ strength at birth that few could match him, Frieza is a mighty mutant hybrid\
        \ of his race whose power is so great that to properly control it, he had\
        \ to create lesser, weaker forms to restrain his strength. He is incredibly\
        \ skilled in using ki, though his ignorance of its spiritual side meant he\
        \ didn't know how to sense ki at first. *Death Ball (\u30C7\u30B9 Desu kidama?):\
        \ After gathering ki in the shape of a sphere with a single fingertip, Frieza\
