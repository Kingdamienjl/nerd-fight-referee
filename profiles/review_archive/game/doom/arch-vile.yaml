    - field: weaknesses
      value: "Frieza is arrogant and sadistic, preferring to prolong an opponent's\
        \ suffering rather than killing them right away, even when it is entirely\
        \ feasible for him to do so. Frieza's ki rapidly drains in his 100% power\
        \ state due to his lack of experience with it, and he cannot fight for long\
        \ in this condition. Note: If you've noticed this page compared to some other\
        \ Frieza pages on other profiles/websites, you'd noticed that there is no\
        \ scaling that gets him into 4-A or 3-C. This is for many reasons: *First,\
        \ the supposed argument that Goku gets a large amount of Ki up to 4-B with\
        \ his Spirit Bomb against Frieza from other solar systems is not how it works.\
        \ Goku simply gathered energy from planets close to Namek and all living beings\
        \ of it, he's not getting all energy, he's just grabbing an amount which he\
        \ thinks will be enough to kill Frieza *Second, the supposed \"star void\"\
        . I suppose because of OPM's star void, DB fans tried to apply the same logic\
        \ to Frieza's explosion of Namek. However, comparing the two is fallacious.\
        \ OPM's feat is explicitely shown on screen as coming from a huge laser beam\
        \ with an explosion sound effect, with literally nothing trying to make it\
        \ an error and it's as blatant as it can be. Meanwhile, Frieza's \"feat\"\
        \ has numerous problems. Given the fact that it's an omnidirectional planetary\
        \ explosion and not a laser beam, it's beyond strange that this only affects\
        \ the stars behind Namek and not everything around it, with both of the backgrounds\
        \ before and after the explosion being completely contradictory to one another,\
        \ with many stars and planets suddenly showing up out of nowhere. Many of\
        \ the planets close around Namek are also completely unnafected by this \"\
        4-A\" explosion, with this also being proved by some episodes later where\
        \ there are still many stars and planets close to Namek's explosion's epicenter,\
        \ which would automatically debunk the supposed claim that the explosion reached\
        \ up to galactic ranges trying to justify it. It's also worth mentioning that\
        \ in many scenes there is seemingly no stars behind the planets at all. This\
        \ is all because of the fact that Dragon Ball Z was animated using cell shaded\
        \ animation, and they would simply put an image above an existing image to\
        \ make animation. The reason for the supposed star void is most likely because\
        \ Namek's dying aura was put all over it, with the void being a placeholder\
        \ for the animators to put Namek over it. The fact there is no single statement\
        \ or implication that Namek's explosion obliterated numerous stars in any\
        \ source just adds the final nail in the coffin for this argument. So all\
        \ in all, the supposed star void is nothing more than an animation mistake\
        \ being blown up to massive proportions to make feats to put Namek Frieza\
        \ and Goku at higher levels than what they are actually supposed to be at.\
        \ *Regarding Garlic Jr's scaling and the Dead Zone, i prefer to explain it\
        \ when i eventually make his page, but for now i don't believe the Dead Zone\
        \ should scale to his physical stats as it's a highly concrentrated ultimate\
        \ attack which requires his Ki to be heightened massively and he blatantly\
        \ doesn't scale to it as he can't break from it and only broke from it when\
        \ he got stronger. Notable Attacks/Techniques: File:FriezaTec.gif|Death Ball\
        \ File:FriezaTec2.gif|Death Beam File:FriezaTec3.gif|Death Saucer File:FriezaTec4.gif|Death\
        \ Psycho Bomb File:FriezaTec5.gif|Death Wave File:FriezaTec6.jpg|Imprisonment\
        \ Ball File:FriezaTec7.gif|Nova Strike *Ki (?): The fighting power and life\
        \ force of a martial artist, a tangible energy derived from the user's vigor,\
