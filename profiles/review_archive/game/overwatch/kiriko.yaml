      value: Gifted (Kiriko is highly skilled in martial combat, specifically Ninjutsu/Kunoichi
        and Kendo. Having been trained since she was a child alongside the likes of
        Genji and Hanzo, Kiriko received some of the best combat mentoring in Japan,
        both her mother and her fellow students teaching her the ways of swordsmanship,
        knife throwing, stealth, and wall climbing, aspects of combat that she mastered
        even as a child. This, coupled with the spiritual practices taught by her
        grandmother and the supernatural abilities granted to her by the Fox Spirit,
        shaped Kiriko's fighting style into one that incorporated elements of both
        of her mother and grandmother's teachings,Kiriko making her a dangerous opponent
        and an equally powerful ally to those fighting alongside her. Her skill is
        such that she has taken down groups of armed men with her bare hands, is able
        to make full use of her environment such as burting pipes to give her an improvised
        smokescreen, and being able to accurately hit numerous small targets while
        moving at an amplified sprint without being detected)
