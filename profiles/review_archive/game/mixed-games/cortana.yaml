    - field: weaknesses
      value: 'Chief''s energy shields must recharge after taking an extended beating,
        leaving him open to damage for a few seconds, if he gets hit with enough force
        his armor might lock. Notable Attacks/Techniques/Notes: John was an unknowing
        child who excelled at always being at the top. He never lost and this was
        one of the qualities that Dr. Halsey adhered for in the SPARTAN project. Even
        at a young age, he was exceptionally strong and fast compared to other children
        of his age group and fortunately, it made him stick out long enough for him
        to be noticed. When Dr. Halsey and Lieutenant Keyes first observed John in
        action on his home planet of Eridanus II in the small city of Elysium. He
        qualified beyond their expectations having extraordinary reflexes, physical
        proportions and and extremely agressive drive for success. He was chosen out
        of 150 possible candidates and was given one last task by Dr. Halsey to determine
        whether was suitable or not. He was asked to watch an old coin and choose
        which side it would land on. As it flew through the air, John snatched it
        before it even landed and chose correctly, the Eagle. Even at the young age
        of 6, John was referred to by Dr. Halsey of having amazing eye-sight. Alongside
        74 other children, John was conscripted and covertly kidnapped from his parents
        to initiate his SPARTAN training. In their absence, flash clones of the children
        were left behind to avoid any suspicion or cause any concern. John and the
        other candidates were taken to the planet Reach where Dr. Halsey informed
        them of the SPARTAN- II program they were to be initiated into and how they
        would become humanity''s greatest protectors. The following morning, John
        awoke in his quarters and looked upon his new'
      source_id: character-stats-profiles-cortana-mixed-games
