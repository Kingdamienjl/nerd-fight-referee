    - field: intelligence
      value: At least Gifted (As Doctor Catherine Halsey's favorite Spartan, John
        showed exceptional promise as a leader and soldier even at an early age. A
        natural leader, he rallied his fellow cadets to heavily injure and incapacitate
        a group of armed and trained UNSC Marines and steal their Pelican dropship
        at the age of eight. Since then, John has been trained in all forms of military
        warfare, being an expert in hand-to-hand combat, firearms usage, stealth tactics,
        and the operation of any number of military vehicles, being able to kill two
        elite ODSTs and maim three more when he was just fourteen years old. By the
        time of the Covenant-Human War, John was a decorated soldier who could turn
        the tides of battle almost single-handedly, leading UNSC forces to rout entire
        battalions of Covenant forces, being a key figure who was feared as "The Demon"
