        was relatively confident he could survive a 30-meter fall without breaking
        anything); at least Small Building level+ with MJOLNIR physical armor (Nearly
        all forms of Human and Covenant weaponry have been defeated by his armor;
        tanked a Hunters fuel rod plasma cannon at point blank range without shields
        and immediately picked himself up); at least Large Building level with MJOLNIR
        energy shields (Prototype MJOLNIR shields could take dozens of 7.62mm rifle
        rounds at point blank without dropping noticeably in shield strength and could
        take several direct hits from 50mm anti-vehicle rounds that would have "penetrated
        his old (shieldless) suit instantly" while only dropping to roughly quarter
        shield strength, later incarnations of the MJOLNIR are more powerful; survived
        the heat and impact of a re-entry fall of over 2 kilometers relatively unharmed
        by riding on a piece of ship hull and locking down his armor's servos), possibly
        up to City Block level+ (Used the detonation of a large antimatter bomb to
        accelerate himself to high speeds, and withstood the impact of hitting a spaceship
        traveling at what appears to be at least hypersonic+ speed, the latter equal
        to at least 5.38 tonnes of TNT), cumulatively higher when under the recharging
        effects of a Regeneratorand Regenative Field (versus continuous or prolonged
        damage only, the shield's basic durability remains the same); at least City
        Block level with Overshield, Drop Shield and Deployable Cover (Roughly two
        to three times stronger than MJOLNIR shields); at least Multi-City Block level
        with Armor Lockup and Invincibility (Renders him virtually impervious to melee,
        physical projectiles, flames, explosives, directed energy weapons, high-energy
        electromagnetic/thermal radiation, artillery, anti-tank missiles, and vehicle
        impacts); probably at least Small City level+ with Bubble Shield (Renders
        him completely impervious to all previously mentioned threats except vehicle
        impacts; a bubble shield created by Cortana withstood a point-blank nuclear
        detonation of at least several megatons, although it's unknown whether or
        not the normal Bubble Shield is as strong), can likely expect a similar level
        of performance from the Hardlight Shield (Except monodirectional rather than
        omnidirectional).
