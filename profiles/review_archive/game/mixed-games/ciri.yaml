    - field: weaknesses
      value: 'Cirno is stupid and naive and can get discouraged easily. Notable Attacks/Techniques:
        * Manipulating Cold: Cirno has the ability to manipulate cold to the point
        of being able to freeze water. However, even while saying "manipulate", when
        coldness is in an omitted state, it seems like her surroundings are chilly
        even in summer. In battle, she uses this ability to attack others with icicles,
        huge ice cubes, or wieldable weapons like swords, but also to freeze her opponents
        or their danmaku. However, despite being able to freeze something hot like
        flaming danmaku, she is unable to freeze lasers. Skill Cards: * Freeze Touch
        Me: Cirno lowers her own body temperature to freeze the air around her. *
        Freezing Lasers: Cirno fires three beams of ice in three directions. * Frost
        Pillars: Cirno creates a large amount of cold air at her feet, causing pillars
        of frost to burst from the ground and launch her opponent into the sky. *
        Frozen Technique: Cirno shoots out a short-ranged wave of cold that freezes
        her opponent in place. * Ice Charge: After surrounding herself with ice, Cirno
        charges at her opponent. * Ice Kick: Cirno jumps and dramatically spinkicks
        her opponent while generating ice. * Icicle Bomb: Cirno creates an unstable
        block of ice that approaches her enemy and shaters when it gets close. * Icicle
        Rise: Creating pillars of ice at her feet, Cirno shoots them into the sky
        as projectiles. * Icicle Shoot: Cirno rapidly fires a series of tiny icicles
        forwards. * Icicle Sword: Cirno creates a sword from ice and strikes at her
        opponent with it. * Little Iceberg: After forming blocks of ice in her hands,
        Cirno throws them at her opponents. * Midsummer Snowman: Cirno rolls a ball
        of ice that grows bigger and bigger and throws itself at her opponent. Spell
        Cards: * Blowing Ice "Ice Tornado": Cirno spins in place to create a large
        tornado of snow and ice. * Cold Body "Super Ice Kick": From the air, Cirno
        launches herself at her opponent to strike them with a spinning kick. * Cold
        Sign "Insta-Freeze Beam": Cirno fires three powerful freezing beams in three
        directions. * Freeze Sign "Freeze Atmosphere": Cirno lowers the temperature
        around her and attacks with frozen particles. * Freeze Sign "Perfect Freeze":
        Cirno shoots snowballs all around her, which freeze in mid-air before moving
        around after a brief delay. * Frost Sign "Frost Columns": Cirno freezes all
        the ground around her and her opponent to freeze them in place. * Ice Clump
        "Cold Sprinkler": Cirno creates a wave of extremely cold ice cubes that transform
        into lances of ice when she throws them at her opponent. * Ice Clump "Great
        Crusher": Cirno creates a giant ice cube and slams it onto her opponent. *
        Ice Sign "Fairy Spin": Spinning in place, Cirno fires icicles all around her.
        * Ice Sign "Icicle Machine Gun": Cirno rapidly fires icicles from her hands.
        * Ice Sign "Sword Freezer": After creating a sword from ice, Cirno charges
        at and thrusts at her opponent with it. ==Others== Notable Victories: Notable
        Losses: Notable Draw: Category:Ningen Zoo Category:Tier 9'
