power_scale:
  tier:
    text: '{{High 7-C}}, higher with Talismans, far higher with Giga Slave Name: Lina
      Inverse, The Magical Genius, Bandit Killer, Dragon Spooker Origin: Slayers Gender:
      Female Age: 15 years old in Slayers, 16 years old in Slayers NEXT, 17 years
      old in Slayers TRY, 18 years old in Slayers Revolution and Slayers Evolution-R
      Classification: Human, Sorceress'
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: "Large Town level+ (Destroyed a mountain that was stated to take \"an entire\
      \ day\" to walk around with a Dragon Slave. Her Dragon Slave has consistently\
      \ been shown to have enough destructive power to wipe out vast landscapes and\
      \ leave massive craters in the aftermath. Comparable to Pokota who blasted a\
      \ town into a massive crater with a Dragon Slave. Conjured a large chunk of\
      \ ice with Dynast Bras to block an attack from reincarnated Zanaffar. Zanaffar\u2019\
      s attacks are capable of destroying a castle tower), higher with Demon Blood\
      \ Talismans, far higher with Giga Slave (A miscast Giga Slave could turn the\
      \ whole world into nothingness. In an alternate timeline, a miscast Giga Slave\
      \ was shown to destroy the world and entire galaxies, which suggests that it\
      \ would have eventually destroyed the entire universe)"
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Superhuman (Crossed a large field in a short time) with Massively Hypersonic
      combat speed and reactions (Dodged a lightning strike at close range. Reacted
      to Chaotic Eye's lightning attacks)
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Large Town level+ (Survived a Dragon Slave from Pokota. Got back up quickly
      after being hit by her own reflected Dragon Slave. Survived an explosion stated
      to be as powerful as the Dragon Slave. Withstood an explosion from a black powder
      bomb stated to be comparable to her Fire Ball. Survived a mines' explosion at
      point blank range, which was stated to be 30 times more powerful than the earlier
      black powder bomb, powerful enough to teeter and shake a large temple. Withstood
      a Burst Flame from Halcyform which destroyed his large mansion), higher with
      Demon Blood Talismans
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
  stamina:
    text: High (Capable of fighting against large monsters or other powerful entities
      for prolonged periods of time)
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
  range:
    text: Standard melee physically, hundreds of meters to kilometers with magic
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
  intelligence:
    text: "Gifted (Lina dubs herself a \"Magical Genius\" without exaggerating, having\
      \ created custom spells such as a fishing spell that can fish a stream to extinction\
      \ and even the Giga Slave spell. She specializes in black magic, yet she is\
      \ also skilled in shamanism, slightly versed in white magic, and can also hold\
      \ her own with the short sword. Lina has an extremely high magic capacity, and\
      \ she is able to draw upon extremely powerful spells such as the Dragon Slave\
      \ and Giga Slave. When she acquired the Demon's Blood Talismans from Xelloss,\
      \ she was able to increase her magical (bucket) capacity even more, giving her\
      \ the ability to cast more powerful spells such as Ragna Blade. In addition\
      \ to battle skills, Lina is also a master businesswoman, thanks to growing up\
      \ in a family of merchants. Designed and built a Magic Tank powerful enough\
      \ to smash through buildings and tank hits from Amelia and Pokota\u2019s spells.\
      \ Instantly recognized the enchantment used on a suit of armor, and that the\
      \ expense required to cast it meant that its wearer had a wealthy sponsor)"
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
