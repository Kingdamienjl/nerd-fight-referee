        \ yet she is also skilled in shamanism, slightly versed in white magic, and\
        \ can also hold her own with the short sword. Lina has an extremely high magic\
        \ capacity, and she is able to draw upon extremely powerful spells such as\
        \ the Dragon Slave and Giga Slave. When she acquired the Demon's Blood Talismans\
        \ from Xelloss, she was able to increase her magical (bucket) capacity even\
        \ more, giving her the ability to cast more powerful spells such as Ragna\
        \ Blade. In addition to battle skills, Lina is also a master businesswoman,\
