        \ of the Divination Arts they can do include: ***Spirit Pendulum Divination:\
        \ It\u2019s utilized to communicate with spiritual intelligence, and this\
        \ determines the good or bad, success or failure, of the sentence that they\
        \ are repeating seven times in their mind. ***Dowsing Rod Seeking: This is\
        \ used for obtaining directions towards the location of a target, the \"rod\"\
        \ in use could be a stick, cane, etc. ***Dream Divination: This allows the\
        \ diviner to gain revelations and recall almost everything they see. ***Astrolabe\
        \ Divination: This is used to determine the inquirer\u2019s fate by determining\
        \ the positions of the sun, moon, blue and red stars at their birth, the corresponding\
        \ spots in the sky, matching the representative symbols to the astrolabe,\
        \ and the corresponding situations of the different constellations. ***Magic\
        \ Mirror Divination: This is used to connect to a third party, high-level\
        \ existence to ask for answers and gain revelations. *Danger Intuition: They\
        \ can intuitively detect danger using their Spirituality. *Spirit Vision:They\
        \ can use Spirit Vision to see non-physical things, such as ghosts and specters.\
        \ They could see the different parts of a Soul, deduce a person's health and\
        \ emotions, and determine if something has a magical aura. *Mysticism: In\
        \ terms of knowledge of Mysticism, a Seer will be more learned and professional\
        \ than a Mystery Pryer **They don't directly gain knowledge about Mysticism,\
        \ only the skills and abilities to learn it. *Enhanced Memory: Initially,\
        \ Seers have a slight increase in memory that improves along with the digestion\
        \ of the potion. * They can \u201Csee\u201D obstructed objects and \u201C\
        hear\u201D faint footsteps, allowing them to take preemptive judgment. But\
        \ their visual, auditory, and tactile senses do not have any enhancements.\
        \ |-|Clown=Clowns are good at fighting with artifice and are very crafty.\
        \ New Abilities, thumb * Bodily Control: A Clown has near complete control\
        \ over their bodily functions. ** Their limbs will not move if they don't\
        \ will them to. ** Their face will only show the expressions they wish to\
        \ show, with the only situations such as extreme shock or pain causing them\
        \ to show their true feelings. *** This makes them the nemesis of Spectator,\
        \ as they cannot accurately read a Clown's body language * Physical Enhancements:\
        \ After advancement Clown receives a powerful body, making them akin to a\
        \ master acrobat. ** They gain powerful coordination and a near inhumane sense\
        \ of balance. A Clown will never lose their balance, barring any extrenuating\
        \ circumstances. The increased coordination also makes them very talented\
        \ at learning combat skills. *** This allows them to walk over tightropes\
        \ as if they were flat ground, or jump and land on the backrest of a chair\
        \ without stumbling. *** After becoming a Clown, Klein went from the level\
        \ a newbie fighter, to the level of an apprentice knight who had been training\
        \ for months over the span of a single session of combat training. He also\
        \ became a lot better at shooting. ** Their agility and speed becomes exceptional,\
        \ while their strength gains a decent increase. *** These enhancements allow\
        \ a Clown to commit various feats of acrobatics, such as swinging themselves\
        \ up by their feet, easily scaling the outsides of buildings or using backflips\
        \ to evade attacks during fights. *** Thanks to the increased strength, Klein\
        \ was capable of knocking out two burly and experienced bouncers in just three\
        \ strikes. * Paper Daggers: A Clown becomes capable of temporarily turning\
        \ sheets of paper as hard and sharp as steel, allowing them to throw them\
        \ as flying daggers or use them as knives. ** Klein killed Meursault by piercing\
        \ his throat with an unfinished draft of a contract. Strengthened Abilities\
        \ * Spiritual Intuition: The Spiritual Intuition of a Clown is greatly enhanced,\
        \ even granting them an unreliable short term form of premonition. ** A Clown\
        \ can supernaturally see the appearance of someone standing behind a door\
        \ without ever opening it. ** A Clown can sometimes intuitively predict the\
        \ next action somebody will take. This is very useful during combat, but cannot\
        \ be relied upon as it happens sporadically and infrequently. It can only\
        \ provide an opportunity to take advantage of. *** Like Divination, this ability\
        \ is much more reliable when it comes to actions that will cause harm to the\
        \ Clown. This allows them to often pre-dodge attacks that would be very damaging\
        \ or even lethal. |-|Magician=New Abilitiesthumb *Magicians gain 9 spells\
