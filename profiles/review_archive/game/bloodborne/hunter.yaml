  attack_potency:
    text: At least Multi-City Block level (Capable of fighting and killing Henryk,
      the Old Hunter, who can withstand the meteors of the Fluorescent Flower, which
      are this strong. Able to fight and kill Father Gascoigne as well as weaker Beasts
      such as the Cleric Beast, Blood-Starved Beast, and Vicar Amelia) | Town level
      (Can fight and kill the Living Failures, who are capable of this, as well as
      Darkbeast Paarl and the Abhorrent Beast) | Large Island level+ (Has access to
      equipment such as A Call Beyond, which is this powerful, the Augur of Ebrietas,
      which summons part of Ebrietas to wield as an attack, the Amygdalan Arm, which
      is the severed still-living arm of a lesser Amygdala, and the Kos Parasite,
      which is able to transform The Hunter into a fully fledged Kin. Can fight and
      defeat Great Ones such as Ebrietas, Rom, Amygdala, and the Celestial Emissary,
      as well as other users of A Call Beyond and Augur of Ebrietas such as Yurie,
      Imposter Iosefka, Micolash, and Forgotten Madman) | At least Large Island level+,
      likely Large Planet level (Can defeat Great Ones such as The Orphan of Kos,
      and Mergo's Wet Nurse, as well as Gehrman, the First Hunter and Lady Maria of
      the Astral Clocktower) | Large Planet level (After consuming 3 Third Umbilical
      Cords, The Hunter transcends The Hunt entirely and becomes one of the most powerful
      Great Ones, surpassing the likes of Mergo, who moved the moon and created the
      Nightmare of Mensis. Fought, defeated, and usurped the Moon Presence, which
      created the Hunter's Dream and moved the moon, and took control of the Hunter's
      Dream as a result)
    source_ids:
    - vsbattles-good-hunter
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: High Hypersonic Combat Speed and Reactions (Able to dodge the meteors of
      the Fluorescent Flower as well as keep up with Henryk who can do the same. Can
      easily dodge point-blank gunfire from flintlock rifles and Victorian-era gatling
      guns) | Massively Hypersonic Combat Speed and Reactions (Faster than before.
      Capable of dodging lightning as well as the meteors of the Living Failures and
      Blacksky Eye) | At least Massively Hypersonic, likely higher Combat Speed and
      Reactions (Faster than before. Can react to the projectiles of A Call Beyond)
      | At least Massively Hypersonic, likely higher Combat Speed and Reactions (Faster
      than before. Able to react to Amygdala's lasers) | At least Massively Hypersonic,
