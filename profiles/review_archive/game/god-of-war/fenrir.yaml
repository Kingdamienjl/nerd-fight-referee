    - field: weaknesses
      value: "Currently bound by Gleipnir Feats/Statements: {{Quote| The Norse world\
        \ was composed of Yggdrasil and the nine worlds, so it had an extremely simple\
        \ structure. It was just one continent with the world tree at the center.\
        \ After that, there were only the various worlds at the end of the roots and\
        \ branches. Then where was the sea? That was simple: it surrounded that one\
        \ continent. Or more accurately, it was a massive ocean with a continent floating\
        \ in it. |The Circumstances Leading to a Certain Magical Heavy Zashiki Warashi\u2019\
        s Simple Killer Queen's Marriage - The Norse world has a single continent\
        \ on it with some extra territories, such as the floating world of Asgard\
        \ and the island of Muspelheim. This gives an idea of the level of power of\
        \ top tiers like Odin}} {{Quote| \u201CTake that up with the bearded head\
        \ god who made up the rules. He\u2019s terrified of the prophecy, so he\u2019\
        s been that way ever since he learned he\u2019d be eaten by Fenrir during\
        \ Ragnar\xF6k. To him, \u2018good\u2019 people are heroes who can kill lots\
        \ of people and \u2018evil\u2019 people are pacifists who can\u2019t.\u201D\
        \ [...] \u201CIt all started with a prophecy saying the three children of\
        \ Loki and Angrbo\xF0a would oppose the bearded head god. During Ragnar\xF6\
        k, Fenrir swallows Odin whole while J\xF6rmungandr grows infinitely to crush\
        \ the land and ultimately kills and is killed by Odin\u2019s son Thor. That\u2019\
        s why Odin needed to put together some countermeasures before that happened.\u201D\
        \ [...] \u201CEven as one of those three disastrous siblings, the prophetesses\
        \ and the three goddesses of fate couldn\u2019t tell what kind of role she\
        \ would play. All they know is that she has the same level of power as Fenrir\
        \ and J\xF6rmungandr.\u201D [...] She is one of Loki and Angrbo\xF0a\u2019\
        s three children. Fenrir is prophesied to eat Odin and J\xF6rmungandr is prophesied\
        \ to grow too large and crush the land, but no one knows what Hel will do.\
        \ |The Circumstances Leading to a Certain Magical Heavy Zashiki Warashi\u2019\
        s Simple Killer Queen's Marriage - Fenrir is prophesied to devour Odin during\
        \ Ragnarok, and he's considered to be comparable to his siblings}} {{Quote|\
        \ The river was actually the drool overflowing from Fenrir\u2019s mouth. That\
        \ beast was prophesied to devour Odin, so a sword had been thrust upwards\
        \ through his lower jaw to forever prevent him from closing his gaping maw.\
        \ His entire body was bound by the unbreakable rope known as Gleipnir. That\
        \ rope had been made from several \u201Cimpossible to acquire\u201D materials\
        \ and no beast could tear through it. But once that impossibility was accomplished,\
        \ Fenrir would be released into the world and his anger and hatred would consume\
        \ Odin. The rage and resentment at the source of his power had already exceeded\
        \ the critical point. [...] \u201CNo matter how hated we are by the world,\
        \ we are family. We are siblings who share the same blood. \u2026If someone\
        \ was going to save her, this may not have happened. But no one will save\
        \ her. They won\u2019t even try. And yet you all have the nerve to call yourselves\
        \ gods!\u201D The prison creaked. The supposedly unbreakable Gleipnir gave\
        \ a cry of discord greater than ever before. [...] There truly was no one\
        \ who would save Hel. There truly was no one who would be her friend. There\
        \ truly was no one here he could rely on. This result filled him with even\
        \ more anger and hatred. The strength needed to tear Gleipnir asunder grew\
        \ even further. |The Circumstances Leading to a Certain Magical Heavy Zashiki\
        \ Warashi\u2019s Simple Killer Queen's Marriage - Fenrir's source of power\
        \ are his negative emotions, which will ultimately allow him to break the\
        \ unbreakable rope Gleipnir}} {{Quote| \u201CFine then,\u201D accepted Fenrir.\
        \ \u201CBut I will be watching, human. You have claimed you will put your\
        \ life on the line, so do everything you can. If you hold back with anything\
        \ at all and you fail to save Hel, I will tear off your arm as promised. Even\
        \ if your physical body is not here, your arm will never move again if I tear\
        \ it off of your spiritual body. That is the contract we will be making.\u201D\
        \ |The Circumstances Leading to a Certain Magical Heavy Zashiki Warashi\u2019\
        s Simple Killer Queen's Marriage - Fenrir can damage souls}} {{Quote| \u201C\
        So that\u2019s what\u2019s going on.\u201D Loki, the man known as an evil\
        \ god, leaned up against a stone wall in Asgard and faced the giant wolf named\
        \ Fenrir. Fenrir could be seen as his child, his greatest masterpiece, or\
        \ his anti-god weapon. \u201CI am more sensitive to most when it comes to\
