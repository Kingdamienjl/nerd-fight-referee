    text: Extended Melee Range. Tens of Kilometers with lightning attacks. Up to Low
      Complex Multiversal with shockwaves (The force of his blows were powerful enough
      to shake the Nine Realms, as well as eventually splinter Yggdrasil), Complex
      Multiverse level with BFR (Had sent Jormugandr back through time with a single
      blow)
    source_ids:
