    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Average normally, Genius in combat (Many characters who've met him, Brok\
      \ and Mimir in particular, show contempt of Thor's intelligence and openly refer\
      \ to him as \"the big idiot\". However, in the field of battle, Thor is an exceptionally\
      \ proficient warrior regarded as Asgard's greatest, with millennia of training\
      \ and experience in killing countless enemies of the Aesir, particularly the\
      \ Giants and the Vanir. Extremely skilled in both unarmed hand-to-hand combat\
      \ and wielding Mj\xF6lnir, Thor masterfully combines both proficient martial\
      \ arts, such as boxing, wrestling, and grappling, and expert handling of his\
      \ hammer, capable of contending with even the likes of Kratos, an extraordinary\
      \ warrior who was \"without equal\" back in Greece and who had killed all the\
      \ Gods in Greece and slew Magni and Baldur, both being remarkable fighters amongst\
      \ the Aesir, forcing their first fight to end in a stalemate and only narrowly\
      \ being defeated in their second fight. He also has demonstrated a degree of\
      \ cunning at certain situations, as displayed by him being able to see through\
      \ Atreus's attempts to play him by sending him on Surtr's Gauntlet while he\
      \ would do something else and cleverly waiting until Starkaor was weakened before\
      \ executing him)"
    source_ids:
    - vsbattles-thor-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
