    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Complex Multiverse level (Defeated Kratos and Atreus handily and it took
      the combined efforts of the former two and Freya to defeat him. Killed the first
      Giant Ymir and created six of the Nine Realms from his body)
    source_ids:
