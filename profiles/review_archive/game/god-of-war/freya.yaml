  tier:
    text: "{{1-C}} Name: Freya, \"Frigg\", The Witch in the Woods, Vanad\xEDs, Na\xF0\
      , Queen Mistletoe (By Heimdall) Origin: God of War Gender: Female Age: Thousands\
      \ of years old Classification: Deity, Norse Goddess, Vanir Goddess, Goddess\
      \ of Love, Beauty, Fertility, Childbirth, Magic, War and Death, Former Leader\
      \ of the Vanir, Former Queen of Asgard and the Valkyries"
    source_ids:
