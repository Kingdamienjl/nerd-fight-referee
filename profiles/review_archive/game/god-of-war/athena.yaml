    - field: attack_potency
      value: Complex Multiverse level (Considerably stronger than the original Blades
        of Chaos, and far more powerful than anything else a mortal could wieldGod
        of War II (Novel)- Chapter 1, which would put it above the likes of the Blade
        of Artemis. Kratos used the Blades to absorb Thera's powers for himself, which
        further fueled his rage. Later he used the Blades to kill Thanatos out of
        sheer rage, grief and vengeance because the latter had killed his brother
        Deimos in front his own eyes. Later, Kratos would wield these Blades to great
        effect against the Sisters of Fate, and then afterwards against Zeus armed
        with the Blade of Olympus, and was still able to stab through the latter several
        times despite having feigned defeat a short while prior.God of War II (2007)
        Mere hours later, Kratos easily defeated Poseidon and his hippocampi while
        wielding these Blades) | Low Complex Multiverse level (Even stronger than
        before. Kratos used the Blades of Exile to great effect against Hades and
        eventually defeated him by using said Blades to steal the Claws of Hades to
        then absorb Hades' soul into himself. Kratos then gave Zeus a massive and
        brutal beatdown with these Blades, with Kratos and Zeus now effectively matching
        each other blow-for-blow as equals)
