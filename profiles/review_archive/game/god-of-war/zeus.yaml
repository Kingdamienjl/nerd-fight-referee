    - field: weaknesses
      value: "Zeus is incredibly pompous, arrogant, and short-sighted, refusing to\
        \ face the consequences of his actions and nearly allowing the Giants to rise\
        \ by refusing to take heed of Apollo's prophecy. Furthermore he has all the\
        \ weaknesses of a normal god: They can be injured by supernatural weapons\
