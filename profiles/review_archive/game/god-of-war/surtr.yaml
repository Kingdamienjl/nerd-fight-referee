    - field: weaknesses
      value: "Unlike \xC6sir he's not immune to curses Feats/Statements: {{Quote|\
        \ When the final battle of Ragnar\xF6k happened, it was said a large number\
        \ of evil spirits and giants would be dragged from that world using the giant\
        \ ship Naglfar that was made from the nails of the dead. It was the most evil\
        \ of all places. And Surtr, the one who ruled at the top of all that evil,\
        \ would burn away all nine worlds with his burning sword. [...] For one thing,\
        \ he was over 4 meters tall. He also held enough energy within him to activate\
        \ a magic sword with destructive power on a great enough scale to burn down\
        \ the world tree. [...] \u201CAre you going to fight that Surtr guy with this?\u201D\
        \ \u201CThat is but one of many options. Success would be difficult, though,\u201D\
        \ readily admitted Loki. \u201CAfter all, Surtr possesses a magic sword of\
        \ his own that can set fire to the world tree Yggdrasil and burn away all\
        \ nine worlds. He has the more powerful sword and his strength is much greater\
        \ than average. I doubt I could win in a direct fight.\u201D [...] During\
        \ the final battle of Ragnar\xF6k, several monsters such as the great serpent\
        \ J\xF6rmungandr, the great wolf Fenrir, and the queen of the underworld Hel\
        \ would join together to oppose Asgard. However, the once who held the most\
        \ important role was Surtr. His sword would burn away the world tree and all\
        \ nine worlds. |The Circumstances Leading to Waltraute's Marriage - Surtr\
        \ is prophesied to one day burn down the world tree and all nine worlds with\
        \ his flame sword}} {{Quote| However, she was not near the boy. While maintaining\
        \ a distance at which a human could not see her but a Valkyrie could see him,\
        \ Waltraute opened her eyes wide and stared intently at the boy. [...] Surtr,\
        \ the ruler of the fire world of Muspelheim, had accurately captured the locations\
        \ of Loki and the boy as they approached (as well as the location of the Valkyrie\
        \ emitting a fearsome light from her eyes). |The Circumstances Leading to\
        \ Waltraute's Marriage - Surtr's senses are able to locate both Loki and Jack\
        \ approaching Muspelheim and Waltraute, who was on standby much further away\
        \ to the point a human wouldn't be able to see her}} {{Quote| \u201CUm,\u201D\
        \ started Muninn and Huginn upon meeting up with Waltraute. \u201CWhy don\u2019\
        t you head back to Asgard? You can watch him easily enough from there.\u201D\
        \ \u201CYou fool. I need to be able to head out immediately if something happens.\
        \ Bifr\xF6st cannot be used around the fire world of Muspelheim or the underworld\
        \ of Niflheim because the flow of magical power is so strange there. I can\
        \ be more certain from here.\u201D [...] \u201CNo, this is more important!!\
        \ I don\u2019t know why, but the no-view zone in Muspelheim has been unlocked!\u201D\
        \ squawked one of the ravens. \u201CThat\u2019s Naglfar!! That\u2019s the\
        \ giant ship Naglfar!!\u201D [...] They were the giant ships known as Naglfar.\
        \ During the final battle of Ragnar\xF6k, they would carry countless evil\
        \ spirits and giants to attack the human world of Midgard and the heavenly\
        \ world of Asgard. Technically, they were likely not simple ships but actually\
        \ something like a mobile version of Bifr\xF6st. Around the fire world of\
        \ Muspelheim and the underworld of Niflheim, the odd flow of magical power\
        \ prevented the use of Bifr\xF6st. That was one of the defensive lines set\
        \ up by the giants to prevent a surprise attack from the \xC6sir, but it also\
        \ made it difficult for the giants to use similar transportation techniques.\
        \ That was why they needed Naglfar. Once Naglfar achieved enough distance\
        \ from Muspelheim that it was outside the range of that defensive area they\
        \ had set up themselves, the giants and evil spirits on the ships could be\
        \ scattered throughout the nine worlds. That was how \u201Cthe battle that\
        \ would end the world\u201D would spread throughout all the worlds in no time\
        \ at all. [...] Due to the distorted flow of magical power, Bifr\xF6st could\
        \ not be used to reach Muspelheim. That distortion also interfered with Asgard\u2019\
        s other magic, and some of the most distorted areas could not even be seen\
        \ with their magically-enhanced vision. Surtr had hidden Naglfar\u2019s construction\
        \ in one of those areas to prevent anyone from observing its rate of completion.\
        \ That was why Asgard based their decisions on the prediction made by the\
        \ head of wisdom M\xEDmir. |The Circumstances Leading to Waltraute's Marriage\
        \ - Surtr was able to \"hack\" Muspelheim and distort the flow of magical\
        \ power to obstruct transportation magic like Bifrost plus magical observation}}\
        \ {{Quote| Unlike an \xC6sir like Loki, the human boy or the giant Surtr would\
        \ definitely be cursed if they drew the magic sword D\xE1insleif. Even if\
        \ the gods and the giants were said to be the same at the root, they directionality\
        \ of their powers (what the \xC6sir called good and evil) was completely different.\
        \ While Surtr might be able to withstand the curse that leaked from the scabbard,\
        \ even he would be unable to resist it if he completely drew the sword. [...]\
        \ D\xE1insleif\u2019s curse was so powerful not even he could oppose it if\
        \ he were to draw the sword from its scabbard. |The Circumstances Leading\
        \ to Waltraute's Marria"
