    - field: weaknesses
      value: "Gullible and can be easily manipulated. Most of his Magatama have weaknesses\
        \ that make him vulnerable to certain attacks | None notable Notable Attacks/Techniques:\
        \ Magatama: Magatama (\u30DE\u30AC\u30BF\u30DE?) are a parasite entity appearing\
        \ in Shin Megami Tensei III: Nocturne, which function as a combination of\
        \ armor, weapon and spellbook. According to Lucifer, Magatama are the very\
        \ essence of demons. When the protagonist is turned into the Demi-Fiend, a\
        \ horn grows on his nape, serving as a symbol of him being one with the Magatama.\
        \ Through the development of this horn, the Demi-Fiend acquires the actual\
        \ powers of a demon and is capable of using magic and directly interacting\
        \ with demons. At first, Demi-Fiend merely develops the strength to fight\
        \ with demons on equal terms, as well as communicating with a variety of races\
        \ for possible purposes of negotiation, recruitment, and collecting information.\
        \ As he grows stronger, the Magatama grants him new abilities ranging from\
        \ regular attacks to special powers that no demon has ever seen nor used.\
        \ *Marogareh: Base Level Dark Magatama, and the Demi-Fiend's initial Magatama.\
        \ Focuses mainly on physical attacks, though also contains low-level Stat\
        \ Boosting and Probability Manipulation. *Wadatsumi: Base Level Neutral Magatama,\
        \ focused on Ice magic. Absorbs Ice Spells. *Ankh: Base Level Light Magatama,\
        \ focused on Healing magic, and low-level Probability Manipulation. Absorbs\
        \ Light / Expel Spells. *Shiranui: Low Level Dark Magatama, focused on Fire\
        \ magic, but also contains some Stat Manipulation. Absorbs Fire Spells. *Hifumi:\
        \ Low Level Neutral Magatama, focused on Force magic, but also contains some\
        \ Stat Manipulation. Absorbs Force Spells. *Iyomante: Low Level Light Magatama,\
        \ focused on support skills, such as weakening the enemy. Absorbs Mind Spells.\
        \ *Anathema: Mid-Low Level Dark Magatama, focused on Curse magic, such as\
        \ weakening the enemy, Probability Manipulation and inducing Death. Absorbs\
        \ Dark / Death Spells. *Kamudo: Mid-Low Level Neutral Magatama, focused on\
        \ physical attacks, though also contains Stat Manipulation and Probability\
        \ Manipulation. *Narukami: Mid-Low Level Light Magatama, focused on Electrical\
        \ magic, but also contains some Stat Manipulation. Absorbs Lightning Spells.\
        \ *Miasma: Low-Mid Level Dark Magatama, focused on Ice magic, though contains\
        \ some Mind Manipulation and Durability Bypassing. Absorbs Ice Spells. *Murakumo:\
        \ Low-Mid Level Neutral Magatama, focused on Stat Immunities, though also\
        \ contains some Probability Manipulation. *Nirvana: Low-Mid Level Light Magatama,\
        \ focused on Expel magic. Absorbs Light / Expel Spells *Muspell: Mid Level\
        \ Dark Magatama, focused on Status Affecting magic, containing some Mind Manipulation.\
        \ *Djed: Mid Level Neutral Magatama, focused on -kaja magic. Amplifies Demi-Fiend's\
        \ stats while weakening his enemy's. Absorbs Curse Spells. *Geis: Mid Level\
        \ Light Magatama, focused on Healing magic. Absorbs Light / Expel Spells.\
        \ *Satan: High-Mid Level Dark Magatama, focused on magic growth and Special\
        \ magic. Absorbs Dark / Death Spells. *Gehenna: High-Mid Level Neutral Magatama,\
        \ focused on Fire magic, though also contains Stat Manipulation and Durability\
        \ Bypassing. Absorbs Fire Spells. *Kamurogi: High-Mid Level Light Magatama,\
        \ focused on physical attacks, though contains Probability Manipulation. *Gundari:\
        \ High Level Dark Magatama, focused on Force magic. Absorbs Force Spells *Vimana:\
        \ High Level Neutral Magatama, focused on physical attacks, though contains\
        \ Stat Manipulation and Probability Manipulation. Absorbs Nerve Attacks. *Adama:\
        \ High Level Light Magatama, focused on Electrical magic, though contains\
        \ Stat Manipulation and Probability Manipulation. *Gaea: Top Level Dark Magatama,\
        \ focused on Earth magic, though also contains Probability Manipulation. **Gaea\
        \ Rage: Demi-Fiend's most powerful Earth-based attack, dealing Mega Physical\
        \ damage to all foes in exchange for 35% of Demi-Fiend's HP. Infamous for\
        \ doing up to 9999 Damage per Party member in Digital Devil Saga 2, a game\
        \ in which the player's maximum possibly HP is only 999. *Kailash: Top Level\
        \ Neutral Magatama, focused on Almighty magic and Protective Spells. *Sophia:\
        \ Top Level Light Magatama, focused on Healing magic. Absorbs Light / Expel\
        \ Spells. *Masakados: The Magatama that holds Ultimate Power. Capable of utilizing\
        \ the strongest Almighty Spell, Passively repelling Fire, Ice, Lightning,\
        \ Force and Physical attacks, Bypassing all Durability and Absorbing Physical\
        \ / Magical / Light / Expel / Dark / Death / Ailments Spells. ==Gallery==\
        \ Hitoshura 02.jpg Hitoshura 01.jpg True Demon Hitoshura.jpg Hitoshura 03.jpg\
        \ ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters\
        \ Category:Megami Tensei Category:Abstract Entities Category:Acausal Characters\
        \ Category:Air Users Category:Anti-villains Category:Antiheroes Category:Attack\
        \ Reflection Users Category:Chaos Users Category:Concept Users Category:Curse\
        \ Users Category:Darkness Users Category:Demons Category:Element Users"
