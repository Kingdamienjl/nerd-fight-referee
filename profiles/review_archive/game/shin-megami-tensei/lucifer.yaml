  attack_potency:
    text: Outerverse level (Stands as the most powerful of all chaos-aligned demons,
      being the "greatest power of darkness, created by none other than The Great
      Will himself" and reigning over the entirety of the Expanse, including Atziluth,
      the highest of the Four Worlds of the Tree of Life, which lies at the basis
      of, and encompasses all existence as a realm of pure nothingness beyond the
      very concept of dimensions, with Lucifer himself inhabiting Kether, the highest
      part of the Tree of Life as a whole), higher with transformations (Both his
      angelic and demonic forms stand above his human disguises in power, being the
      states which Lucifer taps into when engaging in direct combat against those
      he deems as threats) | Outerverse level (Defeated and killed YHVH during the
      first stages of Armageddon, before consuming His essence and becoming "more
      than He could possibly imagine," which resulted in Lucifer transcending into
      a higher plane of existence beyond even the Empyrean, the Throne of God that
      exists as the highest heaven)
    source_ids:
    - vsbattles-lucifer-shin-megami-tensei
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Immeasurable while incarnated. Omnipresent otherwise
    source_ids:
