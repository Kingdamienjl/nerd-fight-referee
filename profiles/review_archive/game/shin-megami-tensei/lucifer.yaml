    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: Buffs and Debuffs: A set of
        skills that, as the name implies, allows the caster to greatly amplify their
        own physical attributes and reduce that of their foes, thus allowing one to
        stand up to much stronger opponents by closing or even reversing the gap in
        power between them. Outside of gameplay limitations, they can be stacked indefinitely,
        and sufficient usages of buffs allow the caster to survive attacks that would
        otherwise obliterate them with only minor injuries and amplify their speed
        to the point of completely outspeeding opponents that could previously predict
        all of their movements, while debuffs have a directly proportional effect
        on the enemy''s statistics. * Luster Candy: Increases all statistics of an
        entire party (Strength, speed and durability) by one rank. * Debilitate: Decreases
        all statistics of an entire party (Strength, speed and durability) by one
        rank. * Dekaja: Removes all buffs from all foes. * Dekunda: Removes all debuffs
        from himself and all allies. * Hot Dark Matter: Increases Lucifer''s offensive
        power by two ranks. Only available to his "Matter" form. * Cold Dark Matter:
        Increases Lucifer''s defenses by two ranks. Only available to his "Matter"
        form. * Holy Crucifixion: Decreases all statistics (Attack, Defense, Accuracy
        and Speed) of a single foe by two ranks. Only available to his "Matter" form.
        Almighty Attacks: The highest class of spells in the Megami Tensei franchise,
        consisting largely of powerful non-elemental attacks that have the special
        property of completely bypassing any resistances or immunities that a target
        may possess, be them innate or magically enforced, with the latter of which
        including anything from reflective barriers to items that distort the very
        laws of the universe in order to protect the user from all forms of damage,
        and they are likewise unable to blocked, dodged or drained. Lucifer''s arsenal
        is vast, and includes the powers of every Demon under his command, as they
        are nothing but facets of himself, but some of the most notable spells he
        has access to are: * Megidola and Megidolaon: Unleashes a wave of destructive
        energy which deals heavy damage to all foes to different degrees each, and
        also has the added effect of forcibly dragging an opponent into its area of
        effect should they be outside of it, engulfing them in "the complete annihilation
        beyond death." * Megidoladyne: The most powerful member of the "Megido-" family
        of skills, which deals heavy almighty damage that covers the entire battlefield,
        and whose destructive power increases by 50% in relation to its previous instance
        with each use. * High King: Unleashes a stream of electricity from his hands,
        affecting all foes within range and having a 100% chance of inflicting Bind
        upon them. * Root of Evil: Summons a wave of darkness that distorts time itself
        and deals a random status effect to all foes, which includes reducing their
        total health by 1/2, 3/4 or 9/10 and inflicting poison, mute or stun. * Morning
        Star: Deals severe almighty damage to all foes, either by calling down the
        power of a constellation or channeling the light of the Empyrean Heaven, inflicting
        serious damage even to foes of comparable power to Lucifer himself. Also halves
        the vitality of all foes by half in its Shin Megami Tensei IV incarnation.
        * Asteroid Bomb: Summons a wave of asteroids which deals massive damage to
