    - field: intelligence
      value: At least Supergenius, likely Nigh-Omniscient . Before his fall from grace,
        Lucifer stood as the existence closest to God and one of the foremost members
        of the divine host, having bestowed humanity with the gift of wisdom and intelligence,
        and his own existence is closely linked to the concepts of lies and deceit,
        making him an exceptional manipulator and deceiver, and likely putting him
        above lesser deities such as Loki, who are described as possessing "an intellect
        beyond anything a human could hope to have," and archangels such as Gabriel.
        Described as perceiving time in a non-linear manner, witnessing the flow of
        history from the beginning to the end and vice-versa | Nigh-Omniscient. Absorbed
        YHVH's Knowledge, and through it became an enlightened being with an intimate
        awareness of the true nature of reality, having ascended to a higher plane
        of existence beyond even the God of Law's ability to comprehend.
      source_id: vsbattles-lucifer-shin-megami-tensei
