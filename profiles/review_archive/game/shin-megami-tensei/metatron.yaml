power_scale:
  tier:
    text: '{{1-A}}, potentially higher Name: Metatron, The Voice of God, The Face
      of God, The Angel of Contracts, The King of the Angels, The Creator of All Things,
      The Lesser YHWH. Formerly known as Enoch. Origin: Megami Tensei Gender: Genderless,
      though assumes masculine form. Age: Inapplicable. Exists beyond the concept
      of time and does not abide by it in any linear sense. Classification: Demon,
      Mechanized Angel, Avatar of YHVH, Seraph, Chancellor of Heaven, Image of Satan,
      "Lesser Deity."'
    source_ids:
    - vsbattles-metatron-shin-megami-tensei
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Outerverse level (Stated to be metaphysically the same entity as Shaddai,
      and is thus comparable to other names of YHVH such as Sabaoth and Elohim, the
      latter of which personifies and governs the realm of Chokmah, one of the three
      primary spheres of the archetypal realm of Atziluth, which is said to exist
      beyond the very concept of dimensions altogether), potentially higher (While
      controlled by YHVH's own will, Metatron has no set power level, and can receive
      certain degrees of power from him in order to best suit any circumstance. Stated
      to be the most powerful being in creation, second only to God Himself, during
      the events of Devil Survivor, and was the first demon to be sent in order to
      defeat the Apocalypse end-game cast in YHVH's Universe, long after they had
      defeated Merkabah and Lucifer)
    source_ids:
    - vsbattles-metatron-shin-megami-tensei
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Immeasurable while incarnated; Omnipresent otherwise
    source_ids:
    - vsbattles-metatron-shin-megami-tensei
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Outerverse level (Can endure numerous attacks from foes such as Demi-Fiend
      and Abel, and was able to erect a forcefield capable of blocking out the brunt
      of the latter's attacks until dissipated)
    source_ids:
    - vsbattles-metatron-shin-megami-tensei
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Infinite
    source_ids:
    - vsbattles-metatron-shin-megami-tensei
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Outerversal
    source_ids:
    - vsbattles-metatron-shin-megami-tensei
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Nigh-Omniscient. Exists as an embodiment of YHVH's mind, will and voice,
      and is described as being all-seeing, aware of everything that occurs in creation.
    source_ids:
    - vsbattles-metatron-shin-megami-tensei
