        is able to control air current in order to fly, dodge attacks, generally make
        himself more agile and create cutting air currents around himself to make
        attack ineffective *Bay Tornado: By using the effect of the middle finger,
        Cross creates a tornado directed at his enemies with his finger as the eye
        of the tornado *Dance of Gale: By using the effect of the middle finger, Cross
        creates wind in multiple directions sends waves of wind towards his opponent
        - when contact is made, the opponent is diced into multiple pieces Earth (Thumb):
        *Rock Pillars: By using the effect of the thumb, Cross touches the ground
        and makes Rock Pillars shoot out of the earth and crash into the target *Impact:
        By using the effect of the thumb, Cross touches the ground and sends a shock
        wave destroying the area and leaving a crater. After the timeskip, this attack
        is strong enough to level the city that the Stea Government base was built
        on. Electrified Water (Index Finger): *Hurricane: By using the effect of the
        index finger, Cross creates a massive electrified water hurricane in the air
        which rains electrified water * Thunder Dragon: By using the effect of the
        index finger, Cross creates a dragon out of the electric water he creates
        and charges forward at his enemy. * Sphere: By using the effect of the index
        finger, Cross molds a sphere with the electrified water he creates and throws
        it at a target. * Lightning Drop: By using the effect of the index finger,
