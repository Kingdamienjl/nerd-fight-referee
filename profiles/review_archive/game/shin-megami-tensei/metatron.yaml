    - field: weaknesses
      value: 'His abilities gradually drain his mental and spiritual energy. Notable
        Attacks/Techniques: Buffs and Debuffs: A set of skills that, as the name implies,
        allows the caster to greatly amplify their own physical attributes and reduce
        that of their foes, thus allowing one to stand up to much stronger opponents
        by closing or even reversing the gap in power between them. Outside of gameplay
        limitations, they can be stacked indefinitely, and sufficient usages of buffs
        allow the caster to survive attacks that would otherwise obliterate them with
        only minor injuries and amplify their speed to the point of completely outspeeding
        opponents that could previously predict all of their movements, while debuffs
        have a directly proportional effect on the enemy''s statistics. * Luster Candy:
        Increases all statistics of an entire party (Strength, speed and durability)
        by one rank. * Debilitate: Decreases all statistics of an entire party (Strength,
        speed and durability) by one rank. * Dekaja: Removes all buffs from all foes.
        * Dekunda: Removes all debuffs from himself and all allies. Almighty Attacks:
        The highest class of spells in the Megami Tensei franchise, consisting largely
        of powerful non-elemental attacks that have the special property of completely
        bypassing any resistances or immunities that a target may possess, be them
        innate or magically enforced, with the latter of which including anything
        from reflective barriers to items that distort the very laws of the universe
        in order to protect the user from all forms of damage, and they are likewise
        unable to blocked, dodged or drained. Lucifer''s arsenal is vast, and includes
        the powers of every Demon under his command, as they are nothing but facets
        of himself, but some of the most notable spells he has access to are: * Megidola
        and Megidolaon: Unleashes a wave of destructive energy which deals heavy damage
        to all foes to different degrees each, and also has the added effect of forcibly
        dragging an opponent into its area of effect should they be outside of it,
