      to attack, stated to move at light speed, and Rex himself could keep up with
      Brighid, who was Mythra's rival sometime before the Aegis War), Massively FTL+
      with Foresight (During Foresight, his perception of time slows down to the point
      where light seems to be standing still, which would make him this fast) | Massively
      FTL+, likely Infinite (Should be faster than his older self by virtue of having
      access to Pneuma) | Massively FTL+ (Comparable to Shulk), likely Infinite (Kept
