    - field: weaknesses
      value: 'Poor attention span. Predictable fighting style earlier in his career,
        manipulating too many machines at once can confuse him. His various machines
        have their own limitations Notable Attacks/Techniques: Rex Utilizes variety
        of different machines which he can build using his nanites and uses them in
        the combat, from making swords in the closer quarter combat to long ranged
        projectile based weapons and a varity of tools such as jetpack to help him
        fly in the air, Following are all of his machines mentioned below: *Machine
        Manifestation: Rex can shape his nanites into a variety of machinery. He uses
        these for offense, defense, and transportation. The weapons he forms out of
        his body can be destroyed, but he usually can reform them quickly afterward.
        Also, if Rex is exhausted, it takes more focus to maintain his weapons; otherwise
        they instantly disassemble. At one point, Van Kleiss drained away all but
        one of Rex''s nanites, temporarily removing Rex''s powers as well. After an
        MRI, Dr. Holiday discovered the Omega-1 Nanite that Dr. Gabriel Rylander had
        injected into Rex and identified it as a Control Nanite. Using the supply
        of inactive nanites he had previously off-loaded in the Purgatory base, Rex
        was able to reactivate the Control Nanite, regaining his original powers,
        as well as gaining the blueprints for more powerful machines. Previously,
        Rex lacked the ability to program his body into building more than one machine
        at a time. As of now, Rex can allow his nanites to build and use two machines
        simultaneously. **Smack Hands: Rex''s most commonly used weapon; a pair of
        massive gauntlets that cover his arms. The Smack Hands give Rex incredible
        strength allowing him to lift heavy objects, strike with incredible force
        and launch himself through the air. In addition, the Hands are capable of
        rotating at high speeds which Rex can use to add even more power to his strikes,
        drill through and underground and propel himself quickly through water. While
        the Smack Hands make for a decent shield, they fare poorly against acid. **Boogie
        Pack: A jetpack with two large turbines that form out of Rex''s back. The
        turbines can each launch four extentions attached to retractable cables to
        attack and bash aside obstacles. The Boogie Pack also features a set of large
        grappling hooks to entangle and grab enemies. Can be used to probel Rex even
        underwater. The Boogie Pack has a limit of how much weight it can carry at
        once. **Slam Cannon: A large cannon positioned over Rex''s shoulder. The Slam
        Cannon doesn''t produce it''s own ammo. Instead, a large claw extends from
        its back into the ground before pulling back and storing the material in the
        cannon as ammunition. Finally, it fires the material back out as a projectile.
        **Rex Ride: An orange hoverbike that Rex forms out of his legs. Due to levitating
        off the ground, it can go over any terrain. Also features a battering ram
        that deploys from the front. **Punk Busters: A pair of large armored boots.
        These allow Rex to leap large distances, or deliver powerful kicks and stomps.
        **Big Fat Sword: Also known as the B.F.S., it is a large sword formed from
        either arm. Not only an offensive weapon, it can be used to deflect attacks
        and can reconfigure to form a high-powered buzzsaw. **Blast Caster: With this
        build, Rex forms a large dynamo on his back and a whip/tentacle on his right
        arm. The whip is used to lash out at targets and ensnare them. The dynamo
        can generate electricity that flows down the whip to stun captured foes. **Funchucks:
        Giant, metallic nunchaku that are attached to both of Rex''s arms. By spinning
        them at high speeds, he can deflect projectiles. He can also slam them together
        after spinning them to release a blast of energy at his target. **Bad Axes:
        Two large axes with energized blades. **Block Party: Rex creates a pair of
        gauntles that each generate a forcefield to stop/deflect attacks. Can also
        be used to create a dome of energy to fully surround Rex. The energy shields
        will shatter after withstanding enough damage. **Sky Slyder: A machine that
        resemebles a surfboard that Rex forms from his legs. Capable of flying through
        the air at high speeds. Category:Characters Category:Generator Rex Category:Male
