    - field: weaknesses
      value: 'Azrael is reckless and is prone to being ensnared by traps, very arrogant
        and is obsessed with defeating Kokonoe, His crude and unrefined fighting style
        means that he can be easily overtaken by those able to match him in strength,
        The "weak points" he creates are generated by physical contact and are thus
        useless if Azrael can''t reach his opponent or if his attacks are blocked,
        Dislikes fighting foes weaker than himself, Is a total blood knight who savors
        battle and won''t finish it until he''s had his fill, egging on his foes to
        use their full power against him. Due to his fighting style, as pointed out
        by Kagura, it is easy to read and combat against if you know martial arts.
        Notable Attacks/Techniques: *The Terror: Azrael creates numerous "weak points"
        on his opponent''s bodies as he attacks. These weak points leave his foe susceptible
        to certain Drive attacks in his arsenal, greatly increasing the damage those
        attacks deal and his opponent''s susceptibility to them. However, this ability
        can be nullified if the attacks are blocked completely and a weak point is
        consumed every time a successful attack is made on them. *Mental Colosseum:
        Azrael''s Overdrive in which he exerts his power in an intimidating aura to
        break his opponent''s concentration and defenses, allowing him to leave weak
        points with each of his attacks regardless if they''re blocked or not. *Full
        Spartan: Azrael kicks his opponent while charging his power, then kicks them
        to send them flying. Azrael then teleports himself at behind, before giving
        the opponent one powerful punch. *Gustav Buster: An inward leaning-lunging
        hook punch of raw-energy after a short dashing step. *Tiger Magnum: An upward
        face-striking punch with the leading hand. **Cobra Spike: Upward splits kick
        punt with the following foot into an inward recovery turn. **Leopard Launcher:
        Straight blazing clothesline with the following arm that covers distance.
        *Growler Field: Azrael summons a red aura with an intimidating pose. While
        it is active, Azrael can absorb projectiles. **Phalanx Cannon: Flings his
        arm outward and fires a high speed projectile. Can be used after absorbing
        a projectile with Growler Field, at any moment. *Sentinel Dump: Azrael jumps
        and slams the ground, sitting atop the opponent. *Valiant Crush: Forward leaning
        back turning push kick with the following leg in red energy. **Valiant Charger:
        Charges at the enemy after Valiant Crush if hitting a weakpoint. *Hornet Bunker:
