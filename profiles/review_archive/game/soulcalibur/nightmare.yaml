        of armor with no actual wielder for the sword, he is actually the sword rather
        than the armor that wields it, meaning that breaking the sword will kill him
        Notable Attacks and Techniques: *Soul Wave: Unleashes a burst of red energy
        the absorbs the souls of all those in range by stabbing the ground with Soul
        Edge. Another method shown is that Nightmare bows down, crossing his hands
        and storing energy, as we can see electric bolts gather around him. A stage
        starts to shake and by straightening up and shouting "Hate!" Nightmare releases
        a crimson energy sphere now accompanied with an additional ring of light and
        explosion sound. *Evil Seed: Nightmare exclaims "Watch this!" and punches
        the opponent with his claw, knocking his foe backwards. He uppercuts him/her
        into the air, then slams his sword point first into the ground and a ball
        of energy erupts around his opponent as they scream. This move drains their
        soul into Soul Edge. *Dark Reconquista: Nightmare holds his sword up, calls
        for it, saying "Soul Edge", and does one heavy vertical slash to knock his
        opponent to the ground while saying "Burn!". *Grim Lord: This consists of
        four hits: the first one is a rather strong middle kick attack, which works
        like a launcher, so that the next attack can catch an enemy in mid-air. Then,
        Nightmare grabs his opponent with his twisted arm and then unleashes the most
        damaging blow with a bursting sound, by emitting dark red energy which surrounds
        him, forming a sphere. *Bloody Invasion: At the beginning he raises his hand
        and then hits it heavily against the ground saying, "Run if you can" and creating
        a tremor. *Death Row: This is a part of a Brave Edge move called Death Lord''s
        Annihilation. There are two hits in this Weapon Art. The first one is a high
        punch which knocks an enemy down and then goes a middle long-range stabbing
