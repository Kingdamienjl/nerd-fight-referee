        nature. Magicians use these vibrations to twist the logic of all things. Mages
        were constantly said to be able to bring phenomenas, imaginations and thoughts
        into reality. Notably, white magic is cast through certain prayers) Conceptual
        Manipulation (Type 2) and Space-time Manipulation (Magic was shown to be able
        to significantly affect entire concepts and twist space and time) Gravity
        Manipulation and Time Manipulation (The ''Haste'' and ''Slow'' spells were
        stated to be capable of affecting time and gravity) Summoning (Can summon
        her Eidolon) Blood Manipulation and Death Manipulation (The death spell causes
        the blood of organic beings to coagulate resulting in the instant death of
        that being) Poison Manipulation and Corrosion Inducement (The ''Poison'' spell
        generates toxins in an individual''s body and corrodes their body bit by bit)
        Pain Manipulation and Electricity Manipulation (The Thunder spells burn through
