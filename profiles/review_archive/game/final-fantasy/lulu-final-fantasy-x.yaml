- id: claim-intelligence-f013c787
  section: power_scale
  axis: battle_iq
  text: Lulu is one of the most experienced members of the party, having been a guardian
    for two other summoners before becoming Yuna's. She specializes heavily in Black
    Magic, bombarding foes from a distance with a variety of powerful spells to prevent
    them from ever approaching her. In addition, she eventually becomes one of the
    strongest guardians in history, having contributed to the defeat of Sin, a feat
    thought impossible up to that point. However, Lulu suffers from the guilt of failing
    to protect her last two summoners and can be emotionally distraught in addition
    to her preference to stick to the traditional ways, leaving her sorely behind
    on varied and modern trains of thought.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-8c68a837
  section: weaknesses
  axis: weakness
  text: She has a limited supply of mana, but her Onion Knight doll renders this issue
    virtually non-existent, Lulu is shackled emotionally and spiritually by the guilt
    from her past actions and her preference for traditional methods, which she does
    not get over until the end of the game.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
