        \ Poison Manipulation; Size Reduction (via the Mini spell); Transmutation\
        \ into Frogs; Statistics Reduction (both the Frog and Small status reduce\
        \ the enemy\u2019s offensive capabilities); Power Nullification (via DeBarrier\
