  attack_potency:
    text: 'At least Multi-Continent level, likely higher (Can fight alongside Vincent
      Valentine, whom had easily taken outBefore Crisis -Final Fantasy VII- (2004)
      3rd ver. Ravens, a type far stronger than the 2nd which effortlessly defeated
      2nd Class SOLDIER members, like Sebastian and Essai,Crisis Core -Final Fantasy
      VII-: The Complete Guide (2007) whom compare to Zack Fair when he took down
      Ifrit, a Summon equal to Shiva. Grew stronger since then and earned control
      of stronger Summons like Leviathan and Bahamut) | Unknown (After her death her
      physical capabilities were effectively gone. While her Spirit became stronger
      than ever due to being freedFinal Fantasy VII: The Maiden Who Travels the Planet
      (2005) from the limitationsFinal Fantasy VII: On the Way to a Smile - Lifestream
      Black (2009) of the body, and performed several miraculous feats, it doesn''t
      have any direct displays of power) | Multiverse level+ (Draws power from the
      Gods of the Cycle. Participated in the defeat of Shinryu)'
    source_ids:
    - mediawiki-aerith-gainsborough-final-fantasy
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Sub-Relativistic+ (As early as the events of Midgar, could dodge the lasers
      of the security systems inside Shinra's facilities. Has become much stronger
      since then) | Unknown (Aerith's Spirit became a traveller of the Lifestream,
      where the concept of time and distance are different than in the living world.
      However, the exact details of how this would translate into her speed is never
      clear) | Massively FTL+ (Comparable to other Warriors of the Cycle. Took part
      in the defeat of Shinryu)
    source_ids:
    - mediawiki-aerith-gainsborough-final-fantasy
    confidence: 0.8
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: At least Multi-Continent level, likely higher (Compares to Vincent, who
      easily took the attacks of 3rd ver. Ravens, a stronger version than those who
      can easily one-shot the 2nd Class SOLDIER, Sebastian and Essai, who compare
      to the level Zack had when he defeated Ifrit) | Unknown (When Sephiroth was
      spreading Geostigma on the surface, Aerith tried to approach him but he chased
      her off, implying him to be a danger to her. However, Sephiroth abandoned the
      pursuit quickly and continued with his plans, while simply mocking Aerith, making
      estimations uncertain) | Multiverse level+ (Can fight the other Warriors of
      the Cycle. Survived Shinryu's attacks)
    source_ids:
    - mediawiki-aerith-gainsborough-final-fantasy
    confidence: 0.8
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (While having trouble keeping up with Cloud at the beginning,
      Aerith eventually became strong enough to keep up with the party's battles without
      showing fatigue. This is noticeably seen in the Assault to Shinra HQ where they
      effortlessly fought hordes of robotic enemies and SOLDIER members, and later
      seen after the journey to the Temple of the Ancients, where Aerith, despite
      the long journey and arduous battles, could immediately take off on her own
      to the other side of the Planet to the Forgotten City and reach the place without
      help)
    source_ids:
    - mediawiki-aerith-gainsborough-final-fantasy
    confidence: 0.8
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range with staves, much higher with Materia; at least Kilometers
      as a Spirit in the Lifestream.
    source_ids:
    - mediawiki-aerith-gainsborough-final-fantasy
    confidence: 0.8
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (Despite her alleged innocence, Aerith is very street smart and cunning,
      knowing how to handle and adapt herself very well in the dangerous environments
      of lower Midgar, which aside many criminals also has monsters running around.
      In addition, she spent a good amount of time in a dangerous journey fighting
      specialized combatants, such as the Shinra military, SOLDIER members, the Turks,
      as well as dangerous monsters while travelling with the party. Lastly, as a
      Cetra, Aerith has a natural connection to the Planet and can hear and understand
      the voices in the Lifestream to learn new knowledge and secrets that nobody
      else would have access to in the present day)
    source_ids:
    - mediawiki-aerith-gainsborough-final-fantasy
    confidence: 0.8
    notes: auto_repair source extraction
