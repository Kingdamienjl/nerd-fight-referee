    - field: powers_and_abilities
      value: 'Innate as a Mortal= Superhuman Physical Characteristics; Skilled user
        of Staves and Rods; Extrasensory Perception (as a Cetra, she is naturally
        connected to the Planet and can listen to the voice of the Lifestream, gathering
        new knowledge and even telling distant events such as a person''s passing);
        Telepathy (can communicate with others through dreams); Energy Manipulation
        via controlling her own Spirit Energy to grasp different abilities through
        her Limit Breaks: Healing (via Healing Wind, Pulse of Life and Great Gospel);
        Purification (Type 3 via Breath of the Earth, Pulse of Life and Great Gospel);
        Time Stop and Silence Inducement (via Seal Evil) with the addition of Power
        Nullification (via the Silence Status); Rage Power and Empowerment (via Fury
        Brand); Temporary Invulnerability (via Planet Protector and Great Gospel).
        Non-Physical Interaction (able to hurt and defeat the ghost and souls of the
        fallen Gi Tribe); Regeneration Negation (Up to Low-High, the pieces of Jenova,
        even cells, destroyed by the party are gone for good and can''t be used for
        the Reunion to rebuild Jenova''s body) and Immortality Negation Types 2, 3,
        6, 7 and 8. Can permanently kill Jenova and her pieces, who aside from being
        extremely durable is able to regenerate from single cells, as well as survive
        as long as just her cells remain, through which she can enforce her will,
        even through other people injected with them. Additionally, can permanently
        finish off the souls and spectres of the Gi Tribe). Resistance to: Soul Absorption
        and Soul Manipulation (as a Cetra her spirit is not absorbed nor diffused
        upon death, and she will join the collective current of souls only if she
        wishes to); Mind Manipulation, Empathic Manipulation and Memory Manipulation
        (Cetras have such a strong individuality that Aerith was unaffected by the
        Lifestream, managing to keep her emotions and memories despite the process
        that takes away all traces of them from each soul to assimilate it in the
        flow); Corruption (Types 1 and 2, the Cetra interacted with the Lifestream
        as part of their daily lives, yet despite this exposure to Spirit Energy,
        they don''t become Makonoids. Additionally, Aerith was unaffected by Jenova''s
        virus despite confronting her directly). Power Mimicry and Power Absorption
        (Limit Breaks are born from the user''s Spirit Energy, which shapes their
        mind and soul, and cannot be copied or imitated, the sole exception being
        Zack who is acknowledged as an unusual case, and even then creates a variant
        of the original move) |-|As a Spirit= All previous abilities, except for physical
        ones, plus: stronger Extrasensory Perception (spirits are freed from the boundaries
        of the flesh, elevating the senses to a higher level and sensing the true
        nature of things) and Clairvoyance (can perceive events and emotions anywhere
        on the Planet); Self-Sustenance (Types 1, 2 and 3); Astral Projection (should
        she wish, she can show herself in the surface as an apparition); possibly
        Avatar Creation (she considered creating extensions of herself, similar to
        Sephiroth''s Remnants, but decided against it); Soul Manipulation, Empathic
        Manipulation and Memory Manipulation (can interact with souls in the Lifestream,
        restore their individuality and, through memories, she can ease the hatred
        and other negative feelings of those trapped in the Negative Lifestream, so
        they can rest); Purification (Types 1, 2 and 3 via Great Gospel); Incorporeality.
        All previous resistances, plus Resistance to: Time Manipulation and Time Stop
        (the realm where the spirits of the dead reside in the Lifestream does not
        really have time, and souls are no longer bound by it)'
      source_id: vsbattles-aerith-gainsborough-final-fantasy-game
      provider_id: vsbattles
