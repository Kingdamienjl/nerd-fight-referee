        \ to use it's not combat applicable) |-|Magic= Magic; Elemental Manipulation\
        \ (of the Fire, Ice, Lightning, Earth and Gravity variety); Death Manipulation\
        \ (via Death); Durability Negation (via the Demi spells). Healing, Purification\
        \ (Type 3) and Regeneration (Mid-Low via the Regen spell). Damage Reduction\
        \ via Barrier Creation (the Barrier, MBarrier and Shield Spells reduce damage\
        \ instead of blocking attacks); Attack Reflection (via Reflect). Time Manipulation\
