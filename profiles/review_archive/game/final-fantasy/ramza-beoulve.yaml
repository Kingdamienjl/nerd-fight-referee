    text: Superhuman (Ramza has displayed the capability to engage in combat for what
      amounts to be hours without major sign of exhaustion. Notable instances are
      the assault on Riovanes Castle, which would include a one-on-one duel against
      White Knight, Wiegraf Folles, and a battle to the death against the Lucavi Belias
      the Gigas, as well as the battle at the Necrohol of Mullonde, where he fought
      the demonic armies of the Lucavi, culminating in his victorious battles against
      Hashmal and Ultima. He was also capable of defeating the forces of Knight Templar,
      Barich Fendsor, while being poisoned by Mossfungus, the same mushroom that when
      spread through the ranks of the Order of the Northern Sky completely disabled
      the army. After the battle, Ramza was no worse for wear)
    source_ids:
    - vsbattles-ramza-beoulve-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended melee range with weapons, dozen to thousands of meters with special
      abilities and Magick.
    source_ids:
    - vsbattles-ramza-beoulve-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Genius (Ramza received military and noble education in the Military Ackademy
      of Gariland, as well as guidance from his father and hero of the 50 Year War,
      Barbaneth. Notably, in a world where most dedicate their whole life to a single
      combat discipline, Ramza is capable of mastering in short time many, vastly
      different arts of combat, including spearmanship, archery, unarmed fighting,
      marksmanship and various type of swordplay, each with varied and differing techniques.
      This is further showen by his aptitude for all sorts of magickal arts, each
      having fundamental differently principles in the powers they grasp: the elemental
      powers of the world for Black Magick, the spiritual aspects of existence with
      White Magick, the laws of time and space with Magick, among many others. Furthermore,
      Ramza can optimize the talents of his soldiers to help them quickly develop
      in their different classes of choice. This is further proven by his tactical
      and military capabilities, which are nothing short of astonishing. As Ramza
      slowly formed his own forces, his journeys went with obtaining nothing but one
      victory after another over every opposing faction he came across: criminal groups,
      armies working for important nobles, the Knights Templar of the church, and
      many others, among whom many foes were veteran heroes and armies from the 50
      year war with greatly refined warfare, military traditions and vastly superior
      resources, as well as the Lucavi, demons from another world with powers incomprehensible
      for humans, who have been pulling the strings behind many positions of powers
      and even nations behind the scenes for centuries)'
    source_ids:
    - vsbattles-ramza-beoulve-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
