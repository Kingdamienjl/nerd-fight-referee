    - field: intelligence
      value: 'Genius (Ramza received military and noble education in the Military
        Ackademy of Gariland, as well as guidance from his father and hero of the
        50 Year War, Barbaneth. Notably, in a world where most dedicate their whole
        life to a single combat discipline, Ramza is capable of mastering in short
        time many, vastly different arts of combat, including spearmanship, archery,
        unarmed fighting, marksmanship and various type of swordplay, each with varied
        and differing techniques. This is further showen by his aptitude for all sorts
        of magickal arts, each having fundamental differently principles in the powers
        they grasp: the elemental powers of the world for Black Magick, the spiritual
        aspects of existence with White Magick, the laws of time and space with Magick,
        among many others. Furthermore, Ramza can optimize the talents of his soldiers
        to help them quickly develop in their different classes of choice. This is
        further proven by his tactical and military capabilities, which are nothing
        short of astonishing. As Ramza slowly formed his own forces, his journeys
        went with obtaining nothing but one victory after another over every opposing
        faction he came across: criminal groups, armies working for important nobles,
        the Knights Templar of the church, and many others, among whom many foes were
        veteran heroes and armies from the 50 year war with greatly refined warfare,
        military traditions and vastly superior resources, as well as the Lucavi,
        demons from another world with powers incomprehensible for humans, who have
        been pulling the strings behind many positions of powers and even nations
        behind the scenes for centuries)'
