        XII: The Zodiac Age (2017). Combat with his Final Eclipse attack. However,
        said dimension could very well be an universe, as the Lucavi hold power beyond
        the comprehension of mortals, with the strongest of them being absolute existences
        who both transcend and are unruled by the principles and logics of nature,
        having the power to control the laws and rules of the world and reduce everything
        to complete nothingness. Among them, Zodiark stands as the most powerful one,
