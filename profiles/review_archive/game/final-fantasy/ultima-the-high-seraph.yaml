power_scale:
  tier:
    text: Low 2-C, possibly 2-A
    source_ids:
    - vsbattles-ultima-the-high-seraph-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Universe level+ (Although weaker, Ultima is comparable to Zodiark as one
      of the strongest Lucavi, being capable of facing Vaan and his allies in combat
      around the same time they would fight Zodiark and show to be capable of commanding
      him in his mature state. A mature Zodiark was shown to be capable of obliterating
      a realm large enough to contain faraway starsFinal Fantasy XII: The Zodiac Age
      (2017). Combat with his Final Eclipse attack. However, said dimension could
      very well be an universe, as the Lucavi hold power beyond the comprehension
      of mortals, with the strongest of them being absolute existences who both transcend
      and are unruled by the principles and logics of nature, having the power to
      control the laws and rules of the world and reduce everything to complete nothingness.
      Among them, Zodiark stands as the most powerful one, possessing the power to
      shape the laws of the universe, among which are space and time, along with an
      overwhelming might that grants him dominion over all aspects of creation, making
      him capable of bringing annihilation to everything in existence), possibly Multiverse
      level+ (Before facing her, Vaan and his team had defeated Multi-Armed Gilgamesh
      in proper combatFinal Fantasy XII: The Zodiac Age (2017). Combat on two separate
      occasionsFinal Fantasy XII: Revenant Wings (2007). Before facing Vaan and his
      allies, Gilgamesh could hold his ownFinal Fantasy V: Pixel Remaster (2021) against
      Bartz Klauser and his fellow Warriors of Light and defeat a powerful foeFinal
      Fantasy V: Pixel Remaster (2021) that was giving them trouble, shortly before
      they defeated Neo-Exdeath and, eventually, Enuo, both who had gained power over
      the VoidFinal Fantasy V: Pixel Remaster (2021).)'
    source_ids:
    - vsbattles-ultima-the-high-seraph-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Massively FTL+ (Even in a vastly weakened state, Ultima is far more powerful
      than Dark Behemoths, who can use their Magick to move the stars in the skyFinal
      Fantasy Tactics: The War of the Lions (2007). Chapter 4 at these speeds with
      their Almagest spellFinal Fantasy Tactics: The War of the Lions (2007). Skill
      Description - Japanese Version. She is also much stronger than Ultima Demons,
      among who even the weakest members are capable of using Almagest>79,392,212.36cMagick
      does scale to physical parameters, due to being a power that comes from the
      soul and is achieved by controlling Mist, a form of energy found in the environment
      and stored in the body. The soul has a direct relation to a persons''s physical
      and magical strength..)'
    source_ids:
    - vsbattles-ultima-the-high-seraph-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Galactic (Much more powerful than Orran Durai, an Astrologer who can stop
      the movement of stars and constellations with his powers, as well as Dark Behemoths
      and Ultima Demons who can move around the stars in the sky with their Almagest
      spell3.8262385e+42kg), possibly Immeasurable (Fought alongside Balthier, who,
      alongside Vaan and his allies, had defeated Multi-Armed Gilgamesh twice in the
      past.)
    source_ids: &id002
    - mediawiki-181213
    confidence: 0.95
  striking_strength:
    text: Universe level+, possibly Multiverse level+
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Universe level+ (Can endure the attacks and techniques of Vaan and his allies,
      who are capable of defeating Zodiark), possibly Multiverse level+ (Vaan and
      his team were capable of defeating Gilgamesh.)
    source_ids:
    - vsbattles-ultima-the-high-seraph-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman likely Infinite (Humans are constantly referred as feeble and
      limited compared to the Lucavi, despite their own displays of endurance, such
      as Ramza managing to fight and win while poisoned by the same toxin that disabled
      an entire army faction. Ultima in particular never runs out of magickal power
      and can use limitlessly her abilities.)
    source_ids:
    - vsbattles-ultima-the-high-seraph-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Interestellar (Stronger than Ultima Demons, who can reach and move faraway
      stars with Almagest), possibly Low Multiversal (The plan of the Lucavi was to
      resurrect Ultima so her coming would allow them to freely travel between the
      different planes in the setting. This includes the mortal world, the Empyreal
      Plains, the World of Illusion and the Netherworld.)
    source_ids:
    - vsbattles-ultima-the-high-seraph-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Likely Genius (Though due to her limited appearances it's hard to tell,
      Ultima still has impressive feats that show an impressive intellect. She could
      wage war against the Occuria for thousand years, and despite being defeated,
      the Occuria were a god-like race who were capable of pulling the strings to
      control the history through Ivalice for many years. Furthermore, within the
      Auracites is contained the wisdom of the Lucavi, which is millenia of knowledge
      that completely surpassess human knowledge and can easily overwhelm the human
      host when they first come across it, as seen when Wiegraf first became Belias.
      Additionally, Ultima had the undying loyalty of Hashmall, a Lucavi who had been
      manipulating events through Ivalice for years and manipulated events, powers
      and factions from behind the scenes, kickstarting the bloody civil war that
      came to be known as the War of the Lions.)
    source_ids:
    - vsbattles-ultima-the-high-seraph-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
