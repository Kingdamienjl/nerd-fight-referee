      confidence: 0.75
    - field: stamina
      value: Superhuman likely Infinite (Humans are constantly referred as feeble
        and limited compared to the Lucavi, despite their own displays of endurance,
        such as Ramza managing to fight and win while poisoned by the same toxin that
        disabled an entire army faction. Ultima in particular never runs out of magickal
        power and can use limitlessly her abilities.)
      source_id: mediawiki-181213
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: range
      value: Interestellar (Stronger than Ultima Demons, who can reach and move faraway
