- id: claim-powers-and-abilities-3442e4f2
  section: abilities
  axis: hax
  text: 'Auracite: *Reality Warping (Not combat applicable; Though their exact nature
    remains ambiguous, the Auracites, also known as the Zodiac Stones, are implied
    to hold the spirits of the Lucavi or maybe their power. Still, their power is
    stated to be capable of altering the very weave of natureFinal Fantasy Tactics:
    The War of the Lions (2007). Chapter 2 . It''s also heavily implied that the miracles
    of Saint Ajora, Ultima''s previous host, were actually real and were possible
    thanks to Ultima''s power or the Virgo Auracite. Additionally, the power if the
    Auracites is of such degree that some believe that it can allow to reach a higher
    planeFinal Fantasy Tactics: The War of the Lions (2007). Chapter 4 (Japanese).
    All that said, the nature of these powers has never been explicitly shown, so
    it remains unknow how it could be applicable in combat if at all.) *Blessing,
    Possession and Corruption (Type 2; By using their corresponding Auracite, the
    Lucavi can prey and bring forthFinal Fantasy Tactics: The War of the Lions (2007).
    Chapter 3 the desperation and temptationsFinal Fantasy Tactics: The War of the
    Lions (2007). Chapter 3 inside a person''s heart, to then form a pact with them.
    If they accept, they will surrender their body and soul to the Lucavi, becoming
    their host. This new host will be granted far superior powerFinal Fantasy Tactics:
    The War of the Lions (2007). Chapter 3 than they originally had, but their hearts
    will be heavily influenced by the fiendish nature of the LucaviFinal Fantasy Tactics:
    The War of the Lions (2007). Chapter 3, if they manage to keep their personality
    at all. Eventually, when the Lucavi sees fit, they will simply take over completelyFinal
    Fantasy Tactics: The War of the Lions (2007). Chapter 3 the host.) *Transformation
    (When in possession of a host, the Lucavi can completely take them overFinal Fantasy
    Tactics: The War of the Lions (2007). Chapter 3, if they hadn''t already done
    so, and use their Auracite to transform their host body to fully enter the mortal
    worldFinal Fantasy Tactics: The War of the Lions (2007). Chapter 4 from their
    own realm, the netherworld. Normally, Espers and Scions, like the Lucavi, can
    only manifest a small echo of their powerFinal Fantasy Tactics A2: Grimoire of
    the Rift (2008) when summoned through GlyphsFinal Fantasy XII: The Zodiac Age
    (2017). Sage Knowledge or Summon MagickFinal Fantasy Tactics: The War of the Lions
    - Job Description - Japanese Version (2007), but when using a host this way, the
    Lucavi can come forth with their full power.) *Healing and Resurrection (The Auraicites
    possess the power to heal other living beings, normally done to their hosts, even
    if they are on the brink of deathFinal Fantasy Tactics: The War of the Lions (2007).
    Chapter 4. On ocassion, they have revived unrelated individualsFinal Fantasy Tactics:
    The War of the Lions (2007). Chapter 3 who have been killed in battle, however,
    it''s a mystery why the Auracite chose to do this, as it''s a mystery why creatures
    of such evil nature would save someone without gaining something.) General Lucavi'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
