- id: claim-weaknesses-6f33b316
  section: weaknesses
  axis: weakness
  text: One of Ultima's few legitimate weaknesses is the Dark element, the only one
    she is not flat out immune to and actually takes additional damage from. She also
    is vulnerable to Blind, however this is mitigated as she can simply heal herself
    from it with Blindna. This latter weakness is gone in her Arch Seraph form. Ultima
    cannot use all her Battle Conditions at once, only one, however, she can cycle
    through them during battle.
