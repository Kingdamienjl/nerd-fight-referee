  intelligence:
    text: Gifted. In spite of his flirtatious and goofy demeanor, Locke is a highly
      accomplished member of the Returners, easily dealing with most common soldiers
      and is responsible for rescuing Terra from the clutches of the Empire when they
      met in Narshe. Although he dislikes being treated as such, he is sticky-fingered,
      often pocketing important items and even pieces of equipment from his foes in
      and out of combat. He is proficient in the use of knives, swords, and throwing
      weapons and can keep up with experienced and hardened soldiers like Celes in
      a fight, later helping to take down Kefka, who had become the God of Magic,
      once and for all.
