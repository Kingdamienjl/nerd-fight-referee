power_scale:
  tier:
    text: 4-A, far higher if completely summoned, higher with Spirit Energy
    source_ids:
    - vsbattles-zirconiade-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Multi-Solar System level (Zirconiade was known as a Summon that would scorch
      all life on the Planet and whose summoning was an apocaliptic threat like none
      before, while Summons like Bahamut Fury were treated as little more than another
      obstacle to overcome. In its incomplete state it could easily overwhelm four
      veteran Turks and was only defeated by a last ditch effort Limit Break from
      the Player Turk. Its destruction was considered such an upset by the Planet
      to the ecosystem that a Weapon was deployed to investigate the cause), far higher
      if completely summoned (It's statedBefore Crisis -Final Fantasy VII- (2004)
      that the sole reason Zirconiade could be defeated by the Turks at all was because
      its summoning was imperfect and had it been properly done and had accessBefore
      Crisis -Final Fantasy VII- (2004) to its full powerBefore Crisis -Final Fantasy
      VII- (2004) it would have been unstoppable), higher with Spirit Energy
    source_ids:
    - vsbattles-zirconiade-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Immobile movement speed (Doesn't appear to move around and relies entirely
      on ranged attacks), Massively FTL+ Combat Speed (Its attacks and the movement
      of detatched body parts can easily catch the Player Turk and other veterans.
      Is a far stronger Summon to Bahamut Fury)
    source_ids:
    - vsbattles-zirconiade-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Stellar (Though it doesn't engage in physical combat, Zirconiade is a far
      stronger Summon than Typhon who reaches this level of strength with its abilities)
    source_ids: &id002
    - mediawiki-4789728
    confidence: 0.95
  striking_strength:
    text: Multi-Solar System level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multi-Solar System level, likely higher (The Player Turk noted during the
      whole battle that Zirconiade wasn't taking damageBefore Crisis -Final Fantasy
      VII- (2004) from their attacks and possibly didn't sustain any from the previous
      combined efforts from his comrades either), far higher when completely summoned
      (Had Zirconiade been perfectly Summoned and had access to its full power, it
      would have been too powerful to defeat)
    source_ids:
    - vsbattles-zirconiade-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Summons have never displayed signs of fatigue in battle, and
      being creatures made of Spirit Energy they likely don't)
    source_ids:
    - vsbattles-zirconiade-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Up to Kilometers with Zirconiguards and Spirit Energy, possibly Planetary
      (Appears to be immobile yet its function is to destroy all life on the whole
      Planet)
    source_ids:
    - vsbattles-zirconiade-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: At least Average (Aside an assumption from Fuhito that Zirconiade was ordering
      him to deliver its Materia, the Summon doesn't display any kind of thought process,
      will or desire and simply fights, seemingly on instinct and acting more like
      a force of destruction. However, it efficiently uses its ranged abilities in
      proper combinations. Though the main reason it overwhelmed the Turks was its
      vast superiority in sheer power)
    source_ids:
    - vsbattles-zirconiade-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
