- id: claim-weaknesses-8c298269
  section: weaknesses
  axis: weakness
  text: Zirconiade appears to be an immobile entity. Due to its Summon Materia being
    damaged, Zirconiade needs to absorb life force from other beings constantly to
    sustain itself. If not properly summoned it won't access its full power and the
    Summon will be unstable, furthermore, if the summoning was imperfect Zirconiade
    has no way to access its full power on its own unless it somehow has access to
    its own Materia along the four Support Materia that compensate for the damaged
    Summon Materia. If the four Zirconia Guards are destroyed, Zirconiade won't be
    able to absorb attacks.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-6a23f95c
  section: abilities
  axis: hax
  text: "Zirconiade: *Superhuman Physical Characteristics, Large Size (Type 1), Longevity\
    \ (Summon as part of the Planet's ecosystemFinal Fantasy VII: 10th Anniversary\
    \ Ultimania (2007) could have existed for millions or billions of years), Immortality\
    \ (Type 8. As long as copies of their Materia exist, Summons cannot be permanently\
    \ killed off), Incorporeality and Non-Physical Interaction (Summons are of similar\
    \ natureCrisis Core -Final Fantasy VII-: The Complete Guide (2007) as Minerva,\
    \ a being who trascends matterCrisis Core -Final Fantasy VII-: The Complete Guide\
    \ (2007) entirely), Flight (Appears to levitate on the sky of its dimension, however\
    \ doesn't seem to move around), Additional Limbs, Body Control (Has several \"\
    drone\" like assist Summons as part of itself, called Zirconia Guards, that it\
    \ controls remotely. Can detatch the spikes on its back to hover around the battlefield\
    \ and shoot independently from the main body), Invulnerability (if the Zirconia\
    \ Guards are active, Zirconiade will absorbBefore Crisis -Final Fantasy VII- (2004)\
    \ any attacks thrown at it), Life Manipulation (It can absorb the lifeBefore Crisis\
    \ -Final Fantasy VII- (2004) of others to sustain itself, such as Elf\xE9 to compensate\
    \ the damaged state of its own Summoned Materia), Empowerment (It can greatly\
    \ increase the capabilities of whoever has its Materia. This allowed Elf\xE9Before\
    \ Crisis -Final Fantasy VII- (2004) to briefly match Sephiroth), Aura that includes\
    \ Fear Manipulation and Pain Manipulation (Zirconiade has an AuraBefore Crisis\
    \ -Final Fantasy VII- (2004) of such pressure that feels it can crush its enemies\
    \ and instills fear in them), Energy Manipulation (can use its Spirit Energy to\
    \ create rays of light that fall on its opponents or to unleash a massive beam\
    \ of energy in front of itself. Its detatched spikes can shoot barrages of laser\
    \ like beams independently of the main body), Pocket Reality Manipulation and\
    \ Spatial Manipulation (Like all Summons, Zirconiade sustains its own dimensionCrisis\
    \ Core -Final Fantasy VII-: The Complete Guide (2007), which collapsed when ZirconiadeBefore\
    \ Crisis -Final Fantasy VII- (2004) was destroyed. Its mere summoning caused to\
    \ break some of the boundaries between its own realm and the real world, creating\
    \ a pathBefore Crisis -Final Fantasy VII- (2004) to itself), Reflection Negation\
    \ (The special attacks of Summons cannot be reflectedFinal Fantasy VII (1997)\
    \ by shields or barriers) Zirconia Guard: *Energy Projection (Can create spheres\
    \ of energy that rotate around it to repel enemies), Summoning (Can summon several\
    \ arachnoid creatures to protect itself) Resistance to: *Energy Manipulation,\
    \ Fire Manipulation and Ice Manipulation reaching Absolute Zero (Its natural resistances\
    \ allow Zirconiade to take half damage from non-elemental and fire attacks, plus\
    \ no damage from ice attribute moves, including Shiva's Diamond Dust, whose coldFinal\
    \ Fantasy Explorers. Japanese Website Summon profiles (2014) reaches these temperatures),\
    \ Matter Manipulation and Radiation Manipulation (Can withstand Bahamut ZERO's\
    \ Teraflare a more powerful variant of the Flare spell which is consistently described\
    \ as a nuclear blast)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
