        injected with her cells. Additionally, it can permanently finish off the souls
        and specters of the Gi Tribe). Resistance to Banishment (despite entering
        the Planet''s Core within the Lifestream itself, Barret was not taken forcefully
        taken from the living world); Mind Manipulation and Memory Manipulation (his
        mind has grown strong enough to not collapse nor be eroded under the weight
        of the Spirit Energy of the Lifestream); Soul Manipulation, Soul Absorption
        and Empathic Manipulation (his spirit was not forcefully diffused nor reabsorbed
