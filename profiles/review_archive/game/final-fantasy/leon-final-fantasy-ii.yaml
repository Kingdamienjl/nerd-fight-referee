    1, page 29 in its basest form,Final Fantasy IV Novel 1, chapter 3, page 107 is
    projecting one''s innerFinal Fantasy IV: The After Years Novel, chapter 2, page
    109 mind onto realityFinal Fantasy IV: The After Years, and is powered by intelligence
    and mental strength), Non-Physical Interaction (Magic as a whole is shown to affect
    a wide variety of different beings, from intangible/immaterial beings to non corporeal
    beings, to abstract concepts like Chronodia, who''s the flow of time itselfFinal
    Fantasy I, to Nonexistent beings like Exdeath and Cloud of Darkness), Conceptual
    Manipulation (Type 2), and Space-Time Manipulation (Magic is shown in the novels
    to remove concepts and warp space and time itself, like the Devil''s road, which
    the concept of time was lost,Final Fantasy IV Novel 1, chapter 5, page 199 and
    time and space were twisted to the pointFinal Fantasy IV: The After Years Novel,
    chapter 1, page 67 the past, present and futureFinal Fantasy IV: The After Years
    Novel, chapter 1, page 73 existed as oneFinal Fantasy IV: The After Years Novel,
    chapter 3, page 147), Law Manipulation (Magic is stated to rewrite the natural
    order of thingsFinal Fantasy IV Novel 1, chapter 5, page 198), Power Modification
