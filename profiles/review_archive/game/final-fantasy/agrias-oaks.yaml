    - field: stamina
      value: Superhuman (Agrias has displayed the capability to engage in combat for
        what amounts to be hours without major sign of exhaustion. Notable instances
        are the assault on Riovanes Castle, which would include a battle to the death
        against the Lucavi Belias the Gigas, followed by an encounter with Marquis
        Elmdore and his assassins. Later would be the battle at the Necrohol of Mullonde,
        where she fought the demonic armies of the Lucavi, culminating in the victorious
        battles against Hashmal and Ultima. She was also capable of defeating the
        forces of Knight Templar, Barich Fendsor, while being poisoned by Mossfungus,
        the same mushroom that when spread through the ranks of the Order of the Northern
        Sky completely disabled the army. After the battle, Agrias was no worse for
        wear)
      source_id: mediawiki-110334
      provider_id: vsbattles
      authority: high
      confidence: 0.75
