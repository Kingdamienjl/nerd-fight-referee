  lifting_strength:
    text: "Class M (Can block the Blizzaga spellFinal Fantasy Tactics: The War of\
      \ the Lions (2007). Chapter 4 of Black MagesFinal Fantasy Tactics: The War of\
      \ the Lions - Job Description - Japanese Version (2007) much more consistently\
      \ than before8,282.8443352 Metric Tons), likely at least Class T (Superior to\
      \ C\xFAchulainn, the Impure, and by extension, Exodus, the Judge-Sal who can\
      \ call forth a gigantic meteorite through his magic,Final Fantasy XII: The Zodiac\
      \ Age (2017). Combat even when at a small part of his strength when summoned\
      \ through a Glyph>5384381010 Metric TonsMagick does scale to physical parameters.\
      \ The reason is that Magick, despite being cast by controlling the energy known\
      \ as Mist, it's actually a power that comes from the soul and is stored within\
      \ it. The soul has a direct relation to a persons's physical and magical strength.)"
