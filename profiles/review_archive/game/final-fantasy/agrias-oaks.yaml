    - mediawiki-110334
    confidence: 0.95
  striking_strength:
    text: Town level, likely at least Small Country level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Town level (Can endure the Time Mage's Meteor spell), likely at least Small
      Country level (Can fight and withstand Belias' full powers, who, at a mere echo
      of his real strength, could materialize a small Sun)
    source_ids:
    - vsbattles-agrias-oaks-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Agrias has displayed the capability to engage in combat for
      what amounts to be hours without major sign of exhaustion. Notable instances
      are the assault on Riovanes Castle, which would include a battle to the death
      against the Lucavi Belias the Gigas, followed by an encounter with Marquis Elmdore
      and his assassins. Later would be the battle at the Necrohol of Mullonde, where
      she fought the demonic armies of the Lucavi, culminating in the victorious battles
      against Hashmal and Ultima. She was also capable of defeating the forces of
      Knight Templar, Barich Fendsor, while being poisoned by Mossfungus, the same
      mushroom that when spread through the ranks of the Order of the Northern Sky
      completely disabled the army. After the battle, Agrias was no worse for wear)
    source_ids:
    - vsbattles-agrias-oaks-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range with her weapon. Hundreds of Meters with magicks and
      sword skills.
    source_ids:
    - vsbattles-agrias-oaks-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (Agrias skills as a knight are remarkable enough to be selected as
      Princess Ovelia's personal bodyguard among the already elite unit that is the
      Lionsguard, the personal guards of the royal family. Though mostly following
      Ramza's lead, once she joins her army, Agrias had shown to be a capable leader
      and skilled tactician in her own right when she took charge of her knights and
      Ramza's mercenary group during the events at Orbonne Monastery. Like Ramza,
      Agrias has also shown to be a talented warrior, with great potential and quick
      grasp of many different disciplines, allowing her to master in months vastly
      different classes that employ unrelated fundaments for many differing skills
      such as several types of Magick or different kinds of weapons and techniques.
      As a Holy Knight, her capabilities were honed enough that she could compare
      to Cidolfus Orlandeau, hero of the 50 Year War whose legendary might earned
      him the title of Thunder God. Furthermore, Agrias participated in the defeat
      of the demonic forces of the Lucavi, beings of power beyond human understanding
      that have lived since the early ages of Ivalice, proving to be a match for these
      otherwordly entities)
    source_ids:
    - vsbattles-agrias-oaks-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
