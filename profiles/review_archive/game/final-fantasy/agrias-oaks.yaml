      level (Took part in the defeat of Belias, the Gigas, whose own Hellfire technique
      can create a miniature Sun.Final Fantasy XII: The Zodiac Age (2017). Combat
      Belias was capable of displaying this power when summoned through a Glyph,Final
      Fantasy XII: The Zodiac Age (2017). Sage Knowledge which only allows him to
