    - field: intelligence
      value: Gifted (Agrias skills as a knight are remarkable enough to be selected
        as Princess Ovelia's personal bodyguard among the already elite unit that
        is the Lionsguard, the personal guards of the royal family. Though mostly
        following Ramza's lead, once she joins her army, Agrias had shown to be a
        capable leader and skilled tactician in her own right when she took charge
        of her knights and Ramza's mercenary group during the events at Orbonne Monastery.
        Like Ramza, Agrias has also shown to be a talented warrior, with great potential
        and quick grasp of many different disciplines, allowing her to master in months
        vastly different classes that employ unrelated fundaments for many differing
        skills such as several types of Magick or different kinds of weapons and techniques.
        As a Holy Knight, her capabilities were honed enough that she could compare
        to Cidolfus Orlandeau, hero of the 50 Year War whose legendary might earned
        him the title of Thunder God. Furthermore, Agrias participated in the defeat
        of the demonic forces of the Lucavi, beings of power beyond human understanding
        that have lived since the early ages of Ivalice, proving to be a match for
        these otherwordly entities)
      source_id: vsbattles-agrias-oaks-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
