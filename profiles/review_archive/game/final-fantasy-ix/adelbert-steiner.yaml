    - field: weaknesses
      value: 'An Electromagnetic Pulse will disable his Ether Gear temporarily, binding
        his hands will leave him unable to use his Ether Gear at all. Notable Attacks/Techniques:
        Machina Maker: By using Ether Gear, Weisz can control and manipulate machines.
        He is shown to be able to change or remodel all kinds of machines to his liking,
        such as upgrading a spaceship or recreating E.M. Pino''s missing leg. After
        training for seven days, Weisz is now able to alter electronic devices in
        an instant similar to that of Drakken Joe''s Alchemist. When using Ether Gear
        on his arms, Weisz''s Ether color is yellow. *Million Bullets: Weisz touches
        the floor and modifies it to create numerous guns that he can activate remotely
        and fire at a selected target. *Atlas Flame: Weisz touches his weapon and
        modifies it into a flamethrower that shoots a large stream of flames. *Mortal
        Crash: Weisz touches an object while using his Ether Gear and throws it onto
        the ground, turning it into a bomb and causing it to explode in the process.
        Weisz Machina Maker.png|Machina Maker Weisz Million Bullets.gif|Million Bullets
        Weisz Atlas Flame.gif|Atlas Flame Weisz Mortal Crash.jpg|Mortal Crash Arsenal
        Suit: With Hermit''s help, Weisz constructed a weapon that he can control
        through a bracelet. When activated, his entire body becomes covered in a powered
        suit of armor that harnesses the power of his Ether Gear. While donning this
        armor, he takes on a superhero alias called "Arsenal". When Weisz equips his
        Arsenal Suit it draws out the potential of his Ether Gear, thus allowing him
        access to more advanced techniques. However, overuse of these abilities decreases
        the amount of time he can keep Arsenal active. *Vise Cannon: Weisz transforms
        the top of his forearm into a double-barreled machine-gun that he then uses
        to fire physical ammunition at his enemies *Drum Buster: Weisz remodels his
        entire forearm into a canon that fires an explosive blast of energy. *Metallica
        Explosion: Weisz re-configures his entire right arm, increasing its size dramatically
        while at the same time building up heat energy, he then releases all the built-up
        power in an explosive punch. *Grandee Ray: While wearing his Arsenal Suit,
        Weisz produces a laser from his forearm plating that fires a ray beam at his
        target. *Grandee Wing: While in his Arsenal Suit, Weisz creates a wing-like
        blade from his forearm playing that is strong enough to slash an O-Tech in
        half. Edens Zero Arsenal Mark 1 Anime.png|Arsenal Suit Mark 1 Arsenal Mark
        2 Requip.jpeg|Arsenal Suit Mark 2 Arsenal Suit Land Mode.jpeg|Arsenal Suit
        Land Mode Edens Zero Vise Cannon.gif|Vise Cannon Edens Zero Drum Buster.gif|Drum
