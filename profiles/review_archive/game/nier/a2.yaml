  tier:
    text: '{{7-A}}, higher with Berserk Mode, {{6-C}} with Black Box Detonation Name:
      YoRHa Type A No.2, A2, Number Two Origin: NieR: Automata Gender: Female Age:
      4 (By the end of the game) Classification: Android'
