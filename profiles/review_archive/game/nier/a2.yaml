  attack_potency:
    text: 'Mountain level+ (Comparable to 2B who can harm herNieR Automata; 2017;
      Ch 06-05: A2''s Revenge (A & B)), higher with Berserk Mode. Higher with flight
      unit, Island level with Black Box detonation (Comparable to No 4''s Black Box
      detonation which destroyed Mount Ka''ala and killed everything in a 250 km radiusNieR
      Automata; 2017; Concert Script 3 (Beasts Who Kill One Another))'
    source_ids:
    - vsbattles-a2-nier
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'At least Superhuman (Comparable to 2B who is able to outrun Beauvoir''s
      missilesNieR Automata: Ch 04-03: Advent of the Songstress (A & B)), FTL+ combat
      and reaction speeds (able to dodge point blank EMP, lasers, and particle beams,
      can turn invisible through sheer speed), higher with Berserker Mode (Berserker
      Mode enhances her speed) and Overclock chip (Able to move normally while perceiving
      the world moving at 1/10 speed). higher reaction speed with Evasion System chip
      (perceived world moving at 1/4 speed). Speed of Light attack speed with pod
      laser, Massively Hypersonic+ flight speed with flight unit (Florida grew noticeably
      larger in a short period of timeNieR Automata; 2017; Ch 10-02_1: 9S Placed in
      Battle (B)),'
    source_ids:
    - vsbattles-a2-nier
    confidence: 0.6
    notes: auto_repair source extraction
