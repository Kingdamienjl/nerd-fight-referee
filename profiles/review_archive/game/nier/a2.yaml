    - field: intelligence
      value: 'Gifted. Number 2 personality types were noted for having exceptional
        analytical and decision making skills.NieR Automata; 2017; Archives | Saved
        Machine Records | [Top Secret] Model No.2 Even combat models have exceptional
        technical knowledge and can direct a fusion reactor bypass in the field and
        have the skills to hack alien technology. While her technical knowledge does
        not exceed 9S, she has shown the ability to learn incredibly quickly. After
        a 9S model went after her using a specific hacking technique, she modified
        her own systems to protect herself from that technique and destroy 9S instead
        should he try again. Veteran combatant. Androids pass along knowledge and
        skills by sharing data. Making each android a culmination of the skills and
        knowledge of past generations of androids. Androids were first conceived over
        ten thousand years ago and have been at constant war against multiple faction
        since. For the past 5 thousand years their enemies have been the aliens and
        their living weapons, the Machine Lifeforms. Their enemies, the machines,
        are constantly evolving new weapons and tactics to counter the weapons and
        tactics used against them with an evolution being triggered every 30 that
        are killedYoRHa: Pearl Harbor Descent Record - A NieR:Automata Story; Vol
        07, causing the resistance to only fight during certain times of the year
        when their evolution speed is slower. In order to turn the tides of the war,
        the YoRHa were created. YoRHa are expected to kill thousands of machines per
        YoRHa android without regard to the evolutionYoRHa: Pearl Harbor Descent Record
        - A NieR:Automata Story; Vol 01. During Pearl Harbor Descent, they were expected
        to be outnumbered one thousand to one and they considered this an easy victory.
        However after losing many of their fellow YoRHa and learning they had underestimated
        the machines they ended up engaging in a battle of 16 thousand to one odds.
        Despite only achieving mediocre scores in training, managed to not only survive
        Pearl Harbor Descent but survived for years alone afterwards and killed every
        pursuit android sent after her including 2E despite them being superior to
        her. Her data was effective enough that it was given to the executioner models.
        After YoRHa was infected by a logic virus which removes the limiters on their
        body, making them faster and stronger, A2 is still able to dispatch YoRHa
        soldiers with ease once protecting 2B from 6 infected YoRHa at once. Should
        be comparable to 2B who defeated Adam, a powerful machine that could learn
        and evolve so quickly that Adam was able to learn anything instantly and could
        fight on par with 2B and 9S a few seconds after being born. Possibly more
        skilled than 2B who she has fought and defeated in the past.'
      source_id: mediawiki-a2
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'As an android she is affected by electromagnetic waves and Logic Viruses.
        The body she is currently in dies if the OS chip is removed. Will lose her
        Type 8 immortality if the YoRHa network is destroyed or she is severed from
        it, as she is in the events of the game. Berserk Mode damages her body, and
        leaves her vulnerable for several seconds afterwards as she reboots. Has a
        somewhat reckless personality when it comes to dangerous situations The Pod
        lasers can only damage through heat and thus certain materials including heat
        resistant materials can take reduced to no damage from them. Notable Attacks/Techniques:
        ===Pods=== thumb|250px Pods are small robots that follow and support the main
        Characters of NieR:Automata. The number of pods accompanying an android is
        three (Pod A, Pod B and Pod C). The Pods are capable of flight and are extremely
        useful in combat in various ways: - The pod can provide information. It can
        access the YoRHa network and draw knowledge from its vast archives. Additionally
        it can scan the surroundings and observe and analyze opponents. - It can use
        its respective weapon to perform long range attacks on the enemy. The pod
        is able to lock on to its target in order to greatly improve accuracy and
        trace enemy movements automatically. Those three pods each hold a different
        one of the three following'
      source_id: mediawiki-a2
