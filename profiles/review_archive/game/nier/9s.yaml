power_scale:
  tier:
    text: 'At most {{7-A}}, higher with Flight Unit, {{6-C}} with Black Box Detonation
      Name: YoRHa No.9 Type S, 9S, Nines Origin: NieR: Automata Gender: Male Age:
      3 (By the end of the game) Classification: Android Affiliation: YoRHa'
    source_ids:
    - vsbattles-9s-nier
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: 'At most Mountain level+ (Weaker than combat model but still able to harm
      A2 NieR Automata; 2017; Ch 06-05: A2''s Revenge (A & B) who survived an explosion
      with a 250 km blast radiusNieR Automata; 2017; Concert Script 3 (Beasts Who
      Kill One Another)), Higher with flight unit, Island level with Black Box detonation
      (Comparable to No 4''s Black Box detonation which destroyed Mount Ka''ala and
      killed everything in a 250 km radius. ), Hacking negates durability to an extent
      against machines and androids by causing them to explode from within.'
    source_ids:
    - vsbattles-9s-nier
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: 'At least Superhuman (Able to outrun Beauvoir''s missilesNieR Automata:
      Ch 04-03: Advent of the Songstress (A & B)), FTL+ combat and reaction speeds
      (able to dodge point blank EMP, lasers, and particle beams, can turn invisible
      through sheer speed, comparable to 10H who dodged a laser from centimeters awayNieR
      Automata - A Much Too Silent Sea; 1150: Investigation (entrance room)), Higher
      with Overclock chip (Able to move normally while perceiving the world moving
      at 1/10 speed), Higher reaction speed with Evasion System chip (perceived world
      moving at 1/4 speed). Speed of Light attack speed with pod laser, Massively
      Hypersonic+ flight speed with flight unit (Florida grew noticeably larger in
      a short period of timeNieR Automata; 2017; Ch 10-02_1: 9S Placed in Battle (B)),'
    source_ids:
    - vsbattles-9s-nier
    confidence: 0.8
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: 'At most Mountain level+ (While weaker should be comparable to A2, who survived
      Number 4''s nuclear black box detonation which had a 250 km blast radius. Survived
      riding a nuclear missile into Grun''s mouth and the ensuing explosion NieR Automata;
      2017; Ch 05-02: Goliath Attack (A & B)), higher with Flight Unit and shields
      (can ignore attacks from adversaries of comparable strength).'
    source_ids:
    - vsbattles-9s-nier
    confidence: 0.8
    notes: auto_repair source extraction
  stamina:
    text: Virtually inexhaustible (Is an android. YoRHa type androids do not need
      any fuel to function)
    source_ids:
    - vsbattles-9s-nier
    confidence: 0.8
    notes: auto_repair source extraction
  range:
    text: "Tens of Meters with close combat weapons and shockwaves, Hundreds of Meters\
      \ with the Pod\u2018s gatling, Kilometers with the Pod\u2018s laser and the\
      \ Flight Unit. Sensors in the skin allow her to detect enemies from kilometers\
      \ away .NieR Automata World Guide [City Ruins Survey Report]; Vol 1"
    source_ids:
    - vsbattles-9s-nier
    confidence: 0.8
    notes: auto_repair source extraction
  intelligence:
    text: At least Gifted. Even combat models have exceptional technical knowledge
      and can direct a fusion reactor bypass. In an organization of tech experts able
      to hack alien technology, 9S is the best. So much so his very existence posed
      a threat to YoRHa so he was assigned an undercover executioner type android
      to watch him and kill him if he ever gleaned information he should not. However,
      he was able to consistently deduce the identity of the E-Type android. He's
      demonstrated his hacking skills saving 2B and himself from getting caught up
      in YoRHa's network corruption and resulting destruction. Temporarily neutralized
      a Logic Virus infection within himself, which is extremely difficult and at
      times impossible for other androids to do without the use of a vaccine program.
      During his battle with Eve, he hacked and severed Eve's connection to the machine
      network, a network that spanned the entire planet and was deemed to be impossible
      by Pod 042. Backed up his data and consciousness into the network of surrounding
      defunct machines to save himself after contracting a Logic Virus infection he
      was unable to combat. Despite all attempts to stop him, 9S always breaches the
      Bunker's security and discovers the truth about humanity. A skilled pilot and
      combatant, although below the level of 2B and A2. Androids pass along knowledge
      and skills by sharing data. Making each android a culmination of the skills
      and knowledge of past generations of androids. However 9S is not a combat unit,
      instead meant for scouting and reconnaissance. In combat usually relies on his
      technical knowledge to defeat his opponents. This also means the combat data
      he's been given is not as extensive as dedicated combat units. However he is
      still shown to be a capable fighter. After the destruction of YoRHa he went
      on a warpath against the machines. Has admitted to being unable to defeat 2B
      in direct combat, calling it a "One-sided fight", and resorted to ambushing
      and hacking her in order to gain an upper hand. Was able to match A2 in one
      on one combat but this was after he was infected by a logic virus which would
      remove his limiters, making him stronger and faster, and A2 was also abiding
      by the final wishes of 2B to take care of 9S. In the Tower, 9S defeats several
      copies of 2B controlled by the machines but he acknowledges they were not as
      skilled as she was.
    source_ids:
    - vsbattles-9s-nier
    confidence: 0.8
    notes: auto_repair source extraction
