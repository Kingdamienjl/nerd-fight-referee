    - field: weaknesses
      value: 'Scanner Models are not optimized for battle, although this hasn''t really
        affected him. As an android he is affected by electromagnetic waves and Logic
        Viruses, and hacking, although his barriers give him heightened protection
        from electromagnetic waves and his skill at hacking gives him an advantage
        in defending himself from viruses and hacking. The body he is currently in
        dies if the OS chip is removed. He will lose his Type 8 immortality if the
        YoRHa network is destroyed. His mental stability was impacted severely by
        the death of 2B, and caused him to become deranged, violent, and lack a sense
        of self-preservation. The Pod lasers can only damage through heat and thus
        certain materials including heat resistant materials can take reduced to no
        damage from them. Note: A2 surviving the destruction of Mt. Ka''ala cannot
        be considered at full strength because of her distance from Number 4. The
        inverse square law must be applied to calculate the energy. Notable Attacks/Techniques:
        ===Hacking=== Can easily hack into machines, electronics, and even himself.
        Able to bypass all of the Bunker''s security. ===Pods=== thumb|250px Pods
        are small robots that follow and support the main Characters of NieR:Automata.
        The number of pods accompanying an android is three (Pod A, Pod B and Pod
        C). The Pods are capable of flight and are extremely useful in combat in various
        ways: - The pod can provide information. It can access the YoRHa network and
        draw knowledge from its vast archives. Additionally it can scan the surroundings
        and observe and analyze opponents. - It can use its respective weapon to perform
        long range attacks on the enemy. The pod is able to lock on to its target
        in order to greatly improve accuracy and trace enemy movements automatically.
        Those three pods each hold a different one of the three following'
