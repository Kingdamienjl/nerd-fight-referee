        with some even claiming him to still have the strength and speed of a twenty-year-old.Assassin''s
        Creed Revelations (2011)- The Vizier, Part 1 One of his most notorious feats
        of endurance involves him sprinting at top speed for over 300 meters uninterrupted
        and still appear completely unexhausted.Assassin''s Creed Revelations (2011)-
