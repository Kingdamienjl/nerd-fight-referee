    - field: attack_potency
      value: "At least Small Building level+ by himself (Being a fully-fledged Isu-Hybrid\
        \ having directly descended from Adam and Eve themselves and being a high-ranking\
        \ Master Assassin, he should easily be stronger than the Minotaur and should\
        \ also be superior to most other Isu-Hybrids. Learned all of Alta\xEFr Ibn-La'Ahad's\
        \ skills and abilities via the Codex and the Masyaf Keys. Can not only trade\
        \ blows with comparably-durable enemies capable of harming him and damaging\
        \ his armor sets, he can even counter them with his own blows, and he can\
        \ also harm himself. Traded blows with and overpowered Rodrigo Borgia thrice\
        \ in a row, even when the latter was empowered with the Papal Staff of Eden\
        \ in their last two fights. Fought on equal grounds with Rodrigo's son Cesare,\
        \ and eventually overwhelmed him) and with normal bombs (Can easily blow up\
        \ wooden structures and stone walls without issue. His bombs have a radius\
        \ of over 4 meters, though they can easily harm people of comparable durability,\
        \ and Assassins and Byzantine Templars with far weaker bombs than his could\
        \ effortlessly destroy reinforced barricades and siege machines.Assassin's\
        \ Creed Revelations (2011)- Den Defense Missions Piri Reis blew up entire\
        \ hulls of multiple large ships with the same bombs as Ezio during the Ottoman-Venetian\
        \ WarAssassin's Creed Revelations (2011)- Piri Reis: Sticky Situations), higher\
        \ with swords, melee weapons, hidden blades, Hidden Gun, crossbow, normal\
        \ artillery, the Staff of Eden (Unknowingly enhanced his own abilities when\
        \ he used the Papal Staff to open the Basilica Vault after defeating Rodrigo\
        \ Borgia) and the Apple of Eden (Apple of Eden clones are powerful enough\
        \ to easily overwhelm the likes of Alta\xEFr, Bayek and even Kassandra). Building\
        \ level+ with Leonardo da Vinci's war machines (Blew up multiple factories,\
        \ reinforced stone cannon barracks, their towers and burned down several Borgia\
        \ ships with Leonardo da Vinci's war machines, and is capable of destroying\
        \ other comparable war machines.Assassin's Creed Brotherhood (2011)- Leonardo's\
        \ War Machines Leonardo's tank is this powerful), artillery (The cannons he\
        \ used could easily one-shot multiple wheeled cannons and destroy massive\
        \ siege towers in 3 hits. Also capable of one-shotting Leonardo's war machines\
        \ like the Tank. Also made use of Greek Fire and left an entire harbor full\
        \ of warships in flamesAssassin's Creed Revelations (2011)- Setting Sail)\
        \ and his strongest bombs (In his chase for Cesare in Spain, he used Leonardo's\
        \ bombs to blow up several warships, confirmed in the Brotherhood novel. Blew\
        \ up the lighthouse that held up the Great Chain of the Golden Horn by using\
        \ a bomb that had 50 times the power of his usual bombs) generally. Even higher\
        \ with preparation (With enough preparations he managed to blow up the massive\
        \ gunstock caches of Cappadocia and cover the entire underground city of Derinkuyu\
        \ and leave it completely uninhabitable). Can also negate durability with\
        \ the Apple of Eden and poisoned weaponry"
      source_id: mediawiki-ezio-auditore
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: At least Supersonic+ (Easily deflected arrows at point-blank range and
        outran arrow hails multiple times during the events of Assassin's Creed II
        Discovery. Easily kept up with his Apple of Eden clones. Kept up with and
        dodged attacks from a Staff-amped Rodrigo Borgia, with those being amplified
        by the Pieces of Eden being able to fight on par with the likes of Jacob Frye,
        Kassandra, Bayek and Nikolai Orelov. Capable of dodging arquebus and musket
        shots simply by sidestepping and can even run faster than them. Even in old
        age he could easily keep up with the more-agile-and-flexible Shao Jun, who
        herself is capable of dodging hand-gonne bullets at this speed, and was also
        responsible for teaching her to be able to do so. Barely managed to save Jun
        from an oncoming hand-gonne shot), higher with the Staff of Eden and bombs.
        Supersonic with artillery, Leonardo's war machines (Should be comparable to
        other smoothbore cannons due to Leonardo modifying them with the Apple of
        Eden's help) and the Hidden Gun (The Hidden Gun was based on a wheellock mechanism
        and thus should have comparable speeds to wheellock pistols, which can easily
        hit over 438 m/s). Athletic Human with the tank (Some guards often got overwhelmed
