        right after and still managed to later on and blitz several armed guards without
        issue,Assassin''s Creed Brotherhood (2010)- Emergency Exit later on freerunning
        throughout the Auditore crypt, and in the ensuing conflict, not once did he
        suffer from exhaustionAssassin''s Creed Brotherhood (2010)- Modern Day: Auditore
        Crypt Singlehandedly blitzed and wiped out several enemy regiments during
        the Battle of Viana.Assassin''s Creed Brotherhood (2010)- Pax Romana Easily
        defeated hordes of mercenaries in several fistfighting competitions that extended
        multiple rounds, and Ezio won all of them without ever tiring. Even after
        being stabbed in the side, Ezio managed to wipe out every single enemy before
        falling unconscious.Assassin''s Creed Reflections Issue #1 Ezio''s abilities
        overall, gave him legendary status among the Roman Thieves Guild,Assassin''s
        Creed Brotherhood (2010)- Guild Challenges (Thieves, Challenge 2)Assassin''s
        Creed Brotherhood (2010)- For the Fans so far as going to convince some of
        the members to believe that Ezio''s freerunning skills were exaggerated, and
