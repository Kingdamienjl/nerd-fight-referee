        and loved ones. Incredibly protective of his family and loved ones, and his
        sense of honor and justice can often get the best of him. As of Brotherhood,
        medicine only numbs his pain, forcing his body to regenerate on its own over
        time. Maximizing the Apple's range rapidly drains his life-force (Mostly due
        to being inexperienced with using its powers at that time, though the Apple
        counters this by healing him back just as quickly. Eagle Sense takes some
        time to thoroughly identify a person and their characteristics should Ezio
        choose to be more specific with his search or see his target hiding amongst
        a crowd wearing simimlar clothing. The tank requires at least 4 people to
        properly operate. Both the Flying Machine and the Flying Bomber require heat
        sources and convection of air to stay afloat (The Flying Bomber's cannon negates
        this). The Naval Cannon required Ezio to continuously switch from boat mode
        to cannon mode, leaving him vulnerable to oncoming fire during this switching
        period. The poison blade's composition was so fragile that it broke upon use,
