        \ in the series) and with bombs, higher with his Hidden Blades, his personal\
        \ longsword (His sword was used by Ezio many times to fight against a Staff\
        \ of Eden-amped Rodrigo Borgia), Apple of Eden and even higher with preparations.\
        \ Can negate durability with the Apple of Eden | At least Small Building level+\
        \ (Not much weaker than his younger self, was now capable of one-shotting\
