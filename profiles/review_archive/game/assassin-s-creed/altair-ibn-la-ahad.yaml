power_scale:
  tier:
    text: At least {{9-A}} by himself and with bombs, higher with his Hidden Blades,
      his personal longsword, Apple of Eden and even higher with preparations | At
      least {{9-A}}, higher with his Hidden Blades, Apple of Eden, Hidden Gun and
      even higher with preparations | At least {{9-A}}, higher with his Hidden Blades
      and Apple of Eden, catapults, and even higher with preparations
    source_ids:
