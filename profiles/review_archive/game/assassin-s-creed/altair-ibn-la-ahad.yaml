    - field: intelligence
      value: "Extraordinary Genius (Alta\xEFr was raised at the Assassin fortress\
        \ at Masyaf and quickly rose through the ranks of the Order to become one\
        \ of the most respected and feared Assassins in the Brotherhood, second only\
        \ to its leader, Al Mualim. A cold and objective man, Alta\xEFr fully devoted\
        \ himself to whatever course he chose to pursue. He had a proud nature, and\
        \ was often impetuous, demanding, arrogant, and impatient. However, after\
        \ his failure at Solomon's Temple and commencing on a mission to redeem himself,\
        \ Alta\xEFr began pondering the motivations of his targets after listening\
        \ to their final words. Alta\xEFr was a Master Assassin, capable of extraordinary\
        \ acrobatic feats and versed in the application of deadly arts. Trained extensively,\
        \ he was able to overcome any obstacle, human or terrain, climb the tallest\
        \ towers and leap from the highest ledges without a hint of fear. Like other\
        \ Assassins, he was also trained in stealth assassination techniques, hand-to-hand\
        \ and weapons combat, and blade throwing. His noncombat skills included climbing,\
        \ urban acrobatics, eavesdropping, interrogation, and pickpocketing. He also\
        \ had extensive knowledge of Holy Land politics and religion, which helped\
        \ him better understand his opponents. Once he gained access to the Apple's\
        \ powers, he begain introducing new techniques to all the fields required\
        \ for an Assassin to be perfect, like stealth, disguise, killing from the\
        \ shadows, reconnaissance, combat skills, adaptability, advanced weaponry,\
        \ using advanced tactics and much more. According to Niccol\xF2 Polo, at the\
        \ age of 92 Alta\xEFr retained the same strength; stamina and skill he had\
        \ in his youth, possibly due to renewed training when he reclaimed the title\
        \ of Mentor. Alta\xEFr also possessed Eagle Vision, a \"sixth sense\" or intuition\
        \ that allowed him to see a person's true intentions. Due to this gift, Alta\xEF\
        r had heightened intuitive abilities and senses, along with his sharpened\
        \ fighting skills. Alta\xEFr's skills made him one of the most deadly and\
        \ adept Assassins in the Order's history, and they were legendary even after\
        \ his death. Alta\xEFr was also a skilled artist, and his Codex was heavily\
        \ illustrated. In it he drew blueprints for Hidden Blade modifications; manuals\
        \ for assassination techniques, maps, and even a detailed sketch of his wife,\
        \ Maria, bordered with hand-drawn flowers. Due to his extensive research on\
        \ the Apple thanks to his extremely fast learning skills, he had written several\
        \ thousands of books dedicated to the Apple's knowledge alone in an extremely\
        \ short amount of time and even made a library for them using advanced materials\
        \ that even steel could not penetrate. As mentioned in his final confrontation\
        \ with Abbas, Alta\xEFr claimed to have seen many things about life, death,\
        \ the past and the far future, thoroughly indicating that Alta\xEFr had even\
        \ learned about modern technology itself. He had invented advanced alloys\
        \ as new materials for his Hidden Blades, alloys that were rare even in the\
        \ modern world, and he even built an armor set far more advanced and lighter\
        \ than anything else existing in the modern world, and he destroyed its formula\
        \ in fear of the technology being too powerful for mankind to use. He was\
        \ even trying to uncover the true origins of human life and why they existed,\
        \ but having just started in the last years of his life, this meant that he\
        \ would never finish his work. Even in death he would still occasionally hallucinate\
        \ with the immense amount of knowledge he had gained in his entire lifespan\
        \ and when spending a few moments on the Apple alone)"
      source_id: mediawiki-altair-ibn-la-ahad
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Standard human weaknesses, but has survived situations that would kill\
        \ most peak-level human beings (According to Niccol\xF2 Polo in The Secret\
        \ Crusade novel, at the age of 92, Alta\xEFr retained the same strength, stamina,\
        \ and skill he had in his youth, possibly due to renewed training when he\
        \ reclaimed the title of Mentor). Upon Adha's death, he became increasingly\
        \ depressed, arrogant and prone to outbursts to the point where it resulted\
        \ in him breaking all three tenets of the Creed, and being punished and demoted,\
        \ forcing him to slowly climb back through the ranks and becoming wiser as\
        \ a result, and eventually obtained a new sense of honor to protect the oppressed\
        \ people of the Holy Lands. Refuses to back down or give up even when the\
        \ odds are against him or even when he is heavily injured. Was almost consumed\
        \ by vengeance of his son Sef's death at the hands of Abbas and after witnessing\
        \ his wife Maria's death, Alta\xEFr was once again driven into a severe depression\
        \ for over 20 years since then, alienating himself from his family for most\
        \ of this duration, suffering from hallucinations and other diseases until\
        \ 1247, when he finally regained his resolve and his status as Mentor upon\
        \ killing Abbas. {| cla"
      source_id: mediawiki-altair-ibn-la-ahad
