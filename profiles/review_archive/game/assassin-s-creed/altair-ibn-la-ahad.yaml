  durability:
    text: "At least Small Building level+ (Tanked being hit by catapults multiple\
      \ times. Capable of tanking his own bombs exploding at point-blank range, having\
      \ done so multiple times in his quest for the Chalice. Regularly no-selled bridges,\
      \ scaffoldings and other sturdy structures collapsing on him. Took multiple\
      \ hits from Al Mualim and his clones made by the Apple of Eden, emerging triumphant\
      \ in the end, with Apple clones being able to easily harm the likes of Kassandra\
      \ and also being able to take multiple direct hits from the Staff of Eden, which\
      \ can easily draw blood from Ezio even with the latter having Alta\xEFr's armor\
      \ equipped. Should be on par with most other Isu-Hybrids, who can tank attacks\
      \ of this magnitude and no-sell energy beams that are powerful enough to simultaneously\
      \ vaporize three humans at once and reduce them to a bloody mist, said energy\
      \ beams having the same properties and even working in the exact same manner\
      \ as the energy-based powers of the Isu themselves, their technology and all\
      \ of their Pieces of Eden, like the Sword, Spear, Staff and the Koh-i-noor),\
      \ higher with his armor (His armor was capable of easily withstanding hits from\
      \ the Staff of Eden, and was built via technology from the Apple of Eden, as\
      \ seen when Ezio used it against Rodrigo Borgia in December 1499. A few days\
      \ later in January 1500, as the Siege of Monteriggioni was carried out, it was\
      \ directly struck down by cannonballs that could easily destroy entire fortress\
      \ walls and reduce buildings to splinters, and was left completely undamaged,\
      \ as seen when an older Ezio later returned to pick it up and use it for his\
      \ later travels after Cesare's death, with the armor itself still being in pristine\
      \ condition, and Ezio himself tanked the same cannonballs during the Siege of\
      \ Viana twice in a row) | At least Small Building level+ (Not much weaker than\
      \ before, took blows from comparable enemies while in this state) | At least\
      \ Small Building level+ (Considerably superior to his younger self. Because\
      \ of this, he eventually sent his armor away, no longer needing it for protection,\
      \ and also because he feared that its technology was far too dangerous even\
      \ for modern-day combat)"
    source_ids:
    - vsbattles-altair-ibn-la-ahad-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: "Superhuman (Even when grievously injured and profusely bleeding Alta\xEF\
      r still refused to back down and proceeded to fight hordes of guards as if nothing\
      \ happened to him during his journeys in Mongolia in the 1220s and on his return\
      \ to Masyaf in 1247. Even before he ascended to the rank of Master Assassin,\
      \ during the events Alta\xEFr's Chronicles he was already capable of clearing\
      \ entire fortresses full of soldiers without any sign of exhaustion or ever\
      \ stopping in his tracks, all in the matter of a single day) | Below Average\
      \ Human (Can barely walk) | Superhuman (Alta\xEFr retained the same stamina\
      \ that he had in his youth due to his renewed training)"
    source_ids:
    - vsbattles-altair-ibn-la-ahad-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Extended Melee Range with swords, several Tens of
      Meters with throwing knives, several Hundreds of Meters with bullets, at least
      several Kilometers with the Apple of Eden, possibly far higher (Could easily
      cover entire cities if he chose to, his Apple clones could easily dispatch of
      enemies from Masyaf Castle to as far as the Masyaf gates without even trying)
    source_ids:
