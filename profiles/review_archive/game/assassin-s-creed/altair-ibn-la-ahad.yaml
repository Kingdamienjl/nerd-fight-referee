        \ end of the first game not long after his hunt for the 9 Templars and redemption,\
        \ he fought against and ultimately defeated Al Mualim, even with the latter's\
        \ use of clones via the Apple of Eden of his former Templar associates and\
        \ repeated attempts to control his mind and absorb his life-force for his\
        \ own, with Apple clones being able to damage the likes of Kassandra, and\
        \ a Staff-amped Rodrigo Borgia, who can easily draw blood from Ezio Auditore\
        \ da Firenze equipped with Alta\xEFr's armor, with both Ezio and the armor\
