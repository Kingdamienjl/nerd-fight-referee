    - field: standard_equipment
      value: "*Apple of Eden (Wielded it against the citizens of Cyprus to calm them\
        \ down and inform them of Armand Bouchart's crimes. Later extensively studied\
        \ and catalogued the Apple's information into new Assassin techniques and\
        \ gear, even peering into the past and future. Later used it to wipe out an\
        \ entire Mongol horde sent to invade Masyaf) *Poison Inducement (Legalized\
        \ the use of poison after Al Mualim's deathAssassin's Creed II (2009)- Alta\xEF\
        r's Codex, Page 6) *Fire Manipulation (via Fire Arrows) *Smoke Inducement\
        \ (via smoke bombs, used them in his quest to find the Chalice in Alta\xEF\
        r's Chronicles) *Explosion Generation (Via splinter bombs, used them to blow\
        \ up walls and gigantic stone pillars in Alta\xEFr's Chronicles, and via Black\
        \ Arrows, which he used to scatter Mongol troops and keep them distracted)\
        \ }}"
      source_id: vsbattles-altair-ibn-la-ahad-assassin-s-creed
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "At least Small Building level+ by himself (He can fight against characters\
        \ who can harm him and counter their attacks with his own, and he can also\
        \ harm himself. Also capable of physically injuring and killing Templar Captains\
        \ with his punches, and Templar Captains can tank his bombs at point-blank\
        \ range, which are this powerful. Also fought against and defeated the Master\
        \ of the Tower, who can tank the same exact bombs without any damage. By the\
        \ end of the first game not long after his hunt for the 9 Templars and redemption,\
        \ he fought against and ultimately defeated Al Mualim, even with the latter's\
        \ use of clones via the Apple of Eden of his former Templar associates and\
        \ repeated attempts to control his mind and absorb his life-force for his\
        \ own, with Apple clones being able to damage the likes of Kassandra, and\
        \ a Staff-amped Rodrigo Borgia, who can easily draw blood from Ezio Auditore\
        \ da Firenze equipped with Alta\xEFr's armor, with both Ezio and the armor\
        \ being able to brush off cannonballs this powerful. Can do the same exact\
        \ feats as Ezio himself and should not be much weaker than him despite the\
        \ massive 300-year-gap between them, and Ezio himself gave Alta\xEFr considerable\
        \ praise for his immense skillset. Should be comparable to most other Isu-Hybrids\
        \ in the series) and with bombs, higher with his Hidden Blades, his personal\
        \ longsword (His sword was used by Ezio many times to fight against a Staff\
        \ of Eden-amped Rodrigo Borgia), Apple of Eden and even higher with preparations.\
        \ Can negate durability with the Apple of Eden | At least Small Building level+\
        \ (Not much weaker than his younger self, was now capable of one-shotting\
        \ comparable Assassins with just his fists alone), higher with his Hidden\
        \ Blades, Hidden Gun (Should not be much weaker than Ezio's gun, which is\
        \ an exact replica of Alta\xEFr's blueprints), Apple of Eden and even higher\
        \ with preparations. Can negate durability with the Apple of Eden and poisoned\
        \ weaponry | At least Small Building level+ (Stated by Niccol\xF2 Polo in\
        \ The Secret Crusade novel to be a greater Assassin when compared to his younger\
        \ self), higher with his Hidden Blades, Hidden Gun and Apple of Eden, catapults\
        \ (His catapults were vastly superior to the ones he experienced back in the\
        \ 1190s, capable of demolishing entire buildings. Superior to most trebuchets),\
        \ and even higher with preparations (Had vast knowledge of every single Isu\
        \ tech thanks to having extensively studied the Apple, and even knew a great\
        \ deal about the 21st century). Can negate durability with the Apple of Eden\
        \ and poisoned weaponry"
      source_id: vsbattles-altair-ibn-la-ahad-assassin-s-creed
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: "At least Supersonic+ (Easily kept up with multiple phantoms of Al Mualim\
        \ when the latter used the Apple, and Al Mualim was vastly superior to Alta\xEF\
        r even without the Apple's aid, with the Apple's clones being able to fight\
        \ on par with characters like Bayek, Ezio and Staff wielders like Rodrigo\
        \ Borgia. Shares the same moveset as Ezio and Desmond Miles and shouldn't\
        \ be much slower than them. Can run so fast that not even crossbow bolts and\
        \ arrows can keep up with him), higher attack speed with bombs. Subsonic attack\
        \ speed with bows and throwing knives | Below Average Human (Can barely walk)\
        \ with at least Supersonic+ combat speed and reactions (His combat speed still\
        \ remains the same as his younger days. Could still easily slaughter hordes\
        \ of comparable Assassins without issue, and could take multiple of them out\
        \ in quick succession like in his prime), higher attack speed with bombs.\
        \ Supersonic with his Hidden Gun (The Hidden Gun is based on a wheellock mechanism\
        \ and would thus have comparable speeds to a wheellock pistol, which can hit\
        \ 438 m/s) | Athletic Human (The only attributes that Alta\xEFr lost over\
        \ time were his running speed due to his age) with at least Supersonic+ combat\
        \ speed and reactions (His combat speed and reactions have become vastly superior\
        \ to his younger self due to his renewed and extensive training thanks to\
        \ the Apple), higher attack speed with bombs. Supersonic with his Hidden Gun"
      source_id: vsbattles-altair-ibn-la-ahad-assassin-s-creed
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: durability
      value: "At least Small Building level+ (Tanked being hit by catapults multiple\
        \ times. Capable of tanking his own bombs exploding at point-blank range,\
        \ having done so multiple times in his quest for the Chalice. Regularly no-selled\
        \ bridges, scaffoldings and other sturdy structures collapsing on him. Took\
        \ multiple hits from Al Mualim and his clones made by the Apple of Eden, emerging\
        \ triumphant in the end, with Apple clones being able to easily harm the likes\
        \ of Kassandra and also being able to take multiple direct hits from the Staff\
        \ of Eden, which can easily draw blood from Ezio even with the latter having\
        \ Alta\xEFr's armor equipped. Should be on par with most other Isu-Hybrids,\
        \ who can tank attacks of this magnitude and no-sell energy beams that are\
        \ powerful enough to simultaneously vaporize three humans at once and reduce\
        \ them to a bloody mist, said energy beams having the same properties and\
        \ even working in the exact same manner as the energy-based powers of the\
        \ Isu themselves, their technology and all of their Pieces of Eden, like the\
        \ Sword, Spear, Staff and the Koh-i-noor), higher with his armor (His armor\
        \ was capable of easily withstanding hits from the Staff of Eden, and was\
        \ built via technology from the Apple of Eden, as seen when Ezio used it against\
        \ Rodrigo Borgia in December 1499. A few days later in January 1500, as the\
        \ Siege of Monteriggioni was carried out, it was directly struck down by cannonballs\
        \ that could easily destroy entire fortress walls and reduce buildings to\
        \ splinters, and was left completely undamaged, as seen when an older Ezio\
        \ later returned to pick it up and use it for his later travels after Cesare's\
        \ death, with the armor itself still being in pristine condition, and Ezio\
        \ himself tanked the same cannonballs during the Siege of Viana twice in a\
        \ row) | At least Small Building level+ (Not much weaker than before, took\
        \ blows from comparable enemies while in this state) | At least Small Building\
        \ level+ (Considerably superior to his younger self. Because of this, he eventually\
        \ sent his armor away, no longer needing it for protection, and also because\
        \ he feared that its technology was far too dangerous even for modern-day\
        \ combat)"
      source_id: vsbattles-altair-ibn-la-ahad-assassin-s-creed
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: stamina
      value: "Superhuman (Even when grievously injured and profusely bleeding Alta\xEF\
        r still refused to back down and proceeded to fight hordes of guards as if\
        \ nothing happened to him during his journeys in Mongolia in the 1220s and\
        \ on his return to Masyaf in 1247. Even before he ascended to the rank of\
        \ Master Assassin, during the events Alta\xEFr's Chronicles he was already\
        \ capable of clearing entire fortresses full of soldiers without any sign\
        \ of exhaustion or ever stopping in his tracks, all in the matter of a single\
        \ day) | Below Average Human (Can barely walk) | Superhuman (Alta\xEFr retained\
        \ the same stamina that he had in his youth due to his renewed training)"
      source_id: vsbattles-altair-ibn-la-ahad-assassin-s-creed
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: range
      value: Standard Melee Range, Extended Melee Range with swords, several Tens
        of Meters with throwing knives, several Hundreds of Meters with bullets, at
        least several Kilometers with the Apple of Eden, possibly far higher (Could
        easily cover entire cities if he chose to, his Apple clones could easily dispatch
        of enemies from Masyaf Castle to as far as the Masyaf gates without even trying)
      source_id: vsbattles-altair-ibn-la-ahad-assassin-s-creed
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: "Extraordinary Genius (Alta\xEFr was raised at the Assassin fortress\
        \ at Masyaf and quickly rose through the ranks of the Order to become one\
        \ of the most respected and feared Assassins in the Brotherhood, second only\
        \ to its leader, Al Mualim. A cold and objective man, Alta\xEFr fully devoted\
        \ himself to whatever course he chose to pursue. He had a proud nature, and\
        \ was often impetuous, demanding, arrogant, and impatient. However, after\
        \ his failure at Solomon's Temple and commencing on a mission to redeem himself,\
        \ Alta\xEFr began pondering the motivations of his targets after listening\
        \ to their final words. Alta\xEFr was a Master Assassin, capable of extraordinary\
        \ acrobatic feats and versed in the application of deadly arts. Trained extensively,\
        \ he was able to overcome any obstacle, human or terrain, climb the tallest\
        \ towers and leap from the highest ledges without a hint of fear. Like other\
        \ Assassins, he was also trained in stealth assassination techniques, hand-to-hand\
        \ and weapons combat, and blade throwing. His noncombat skills included climbing,\
        \ urban acrobatics, eavesdropping, interrogation, and pickpocketing. He also\
        \ had extensive knowledge of Holy Land politics and religion, which helped\
        \ him better understand his opponents. Once he gained access to the Apple's\
        \ powers, he begain introducing new techniques to all the fields required\
        \ for an Assassin to be perfect, like stealth, disguise, killing from the\
        \ shadows, reconnaissance, combat skills, adaptability, advanced weaponry,\
        \ using advanced tactics and much more. According to Niccol\xF2 Polo, at the\
        \ age of 92 Alta\xEFr retained the same strength; stamina and skill he had\
        \ in his youth, possibly due to renewed training when he reclaimed the title\
        \ of Mentor. Alta\xEFr also possessed Eagle Vision, a \"sixth sense\" or intuition\
        \ that allowed him to see a person's true intentions. Due to this gift, Alta\xEF\
        r had heightened intuitive abilities and senses, along with his sharpened\
        \ fighting skills. Alta\xEFr's skills made him one of the most deadly and\
        \ adept Assassins in the Order's history, and they were legendary even after\
        \ his death. Alta\xEFr was also a skilled artist, and his Codex was heavily\
        \ illustrated. In it he drew blueprints for Hidden Blade modifications; manuals\
        \ for assassination techniques, maps, and even a detailed sketch of his wife,\
        \ Maria, bordered with hand-drawn flowers. Due to his extensive research on\
        \ the Apple thanks to his extremely fast learning skills, he had written several\
        \ thousands of books dedicated to the Apple's knowledge alone in an extremely\
        \ short amount of time and even made a library for them using advanced materials\
        \ that even steel could not penetrate. As mentioned in his final confrontation\
        \ with Abbas, Alta\xEFr claimed to have seen many things about life, death,\
        \ the past and the far future, thoroughly indicating that Alta\xEFr had even\
        \ learned about modern technology itself. He had invented advanced alloys\
        \ as new materials for his Hidden Blades, alloys that were rare even in the\
        \ modern world, and he even built an armor set far more advanced and lighter\
        \ than anything else existing in the modern world, and he destroyed its formula\
        \ in fear of the technology being too powerful for mankind to use. He was\
        \ even trying to uncover the true origins of human life and why they existed,\
        \ but having just started in the last years of his life, this meant that he\
        \ would never finish his work. Even in death he would still occasionally hallucinate\
        \ with the immense amount of knowledge he had gained in his entire lifespan\
        \ and when spending a few moments on the Apple alone)"
      source_id: vsbattles-altair-ibn-la-ahad-assassin-s-creed
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Standard human weaknesses, but has survived situations that would kill\
        \ most peak-level human beings (According to Niccol\xF2 Polo in The Secret\
        \ Crusade novel, at the age of 92, Alta\xEFr retained the same strength, stamina,\
        \ and skill he had in his youth, possibly due to renewed training when he\
        \ reclaimed the title of Mentor). Upon Adha's death, he became increasingly\
        \ depressed, arrogant and prone to outbursts to the point where it resulted\
        \ in him breaking all three tenets of the Creed, and being punished and demoted,\
        \ forcing him to slowly climb back through the ranks and becoming wiser as\
        \ a result, and eventually obtained a new sense of honor to protect the oppressed\
        \ people of the Holy Lands. Refuses to back down or give up even when the\
        \ odds are against him or even when he is heavily injured. Was almost consumed\
        \ by vengeance of his son Sef's death at the hands of Abbas and after witnessing\
        \ his wife Maria's death, Alta\xEFr was once again driven into a severe depression\
        \ for over 20 years since then, alienating himself from his family for most\
        \ of this duration, suffering from hallucinations and other diseases until\
        \ 1247, when he finally regained his resolve and his status as Mentor upon\
        \ killing Abbas. {| cla"
      source_id: vsbattles-altair-ibn-la-ahad-assassin-s-creed
      provider_id: vsbattles
      authority: high
      confidence: 0.75
