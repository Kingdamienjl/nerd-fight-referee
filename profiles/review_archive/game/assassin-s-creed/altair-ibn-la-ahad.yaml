    notes: auto_repair source extraction
  attack_potency:
    text: "At least Small Building level+ by himself (He can fight against characters\
      \ who can harm him and counter their attacks with his own, and he can also harm\
      \ himself. Also capable of physically injuring and killing Templar Captains\
      \ with his punches, and Templar Captains can tank his bombs at point-blank range,\
      \ which are this powerful. Also fought against and defeated the Master of the\
      \ Tower, who can tank the same exact bombs without any damage. By the end of\
      \ the first game not long after his hunt for the 9 Templars and redemption,\
      \ he fought against and ultimately defeated Al Mualim, even with the latter's\
      \ use of clones via the Apple of Eden of his former Templar associates and repeated\
      \ attempts to control his mind and absorb his life-force for his own, with Apple\
      \ clones being able to damage the likes of Kassandra, and a Staff-amped Rodrigo\
      \ Borgia, who can easily draw blood from Ezio Auditore da Firenze equipped with\
      \ Alta\xEFr's armor, with both Ezio and the armor being able to brush off cannonballs\
      \ this powerful. Can do the same exact feats as Ezio himself and should not\
      \ be much weaker than him despite the massive 300-year-gap between them, and\
      \ Ezio himself gave Alta\xEFr considerable praise for his immense skillset.\
      \ Should be comparable to most other Isu-Hybrids in the series) and with bombs,\
      \ higher with his Hidden Blades, his personal longsword (His sword was used\
      \ by Ezio many times to fight against a Staff of Eden-amped Rodrigo Borgia),\
      \ Apple of Eden and even higher with preparations. Can negate durability with\
      \ the Apple of Eden | At least Small Building level+ (Not much weaker than his\
      \ younger self, was now capable of one-shotting comparable Assassins with just\
      \ his fists alone), higher with his Hidden Blades, Hidden Gun (Should not be\
      \ much weaker than Ezio's gun, which is an exact replica of Alta\xEFr's blueprints),\
      \ Apple of Eden and even higher with preparations. Can negate durability with\
      \ the Apple of Eden and poisoned weaponry | At least Small Building level+ (Stated\
      \ by Niccol\xF2 Polo in The Secret Crusade novel to be a greater Assassin when\
      \ compared to his younger self), higher with his Hidden Blades, Hidden Gun and\
      \ Apple of Eden, catapults (His catapults were vastly superior to the ones he\
      \ experienced back in the 1190s, capable of demolishing entire buildings. Superior\
      \ to most trebuchets), and even higher with preparations (Had vast knowledge\
      \ of every single Isu tech thanks to having extensively studied the Apple, and\
      \ even knew a great deal about the 21st century). Can negate durability with\
      \ the Apple of Eden and poisoned weaponry"
    source_ids:
    - vsbattles-altair-ibn-la-ahad-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "At least Supersonic+ (Easily kept up with multiple phantoms of Al Mualim\
      \ when the latter used the Apple, and Al Mualim was vastly superior to Alta\xEF\
      r even without the Apple's aid, with the Apple's clones being able to fight\
      \ on par with characters like Bayek, Ezio and Staff wielders like Rodrigo Borgia.\
      \ Shares the same moveset as Ezio and Desmond Miles and shouldn't be much slower\
      \ than them. Can run so fast that not even crossbow bolts and arrows can keep\
      \ up with him), higher attack speed with bombs. Subsonic attack speed with bows\
      \ and throwing knives | Below Average Human (Can barely walk) with at least\
      \ Supersonic+ combat speed and reactions (His combat speed still remains the\
      \ same as his younger days. Could still easily slaughter hordes of comparable\
      \ Assassins without issue, and could take multiple of them out in quick succession\
      \ like in his prime), higher attack speed with bombs. Supersonic with his Hidden\
      \ Gun (The Hidden Gun is based on a wheellock mechanism and would thus have\
      \ comparable speeds to a wheellock pistol, which can hit 438 m/s) | Athletic\
      \ Human (The only attributes that Alta\xEFr lost over time were his running\
      \ speed due to his age) with at least Supersonic+ combat speed and reactions\
      \ (His combat speed and reactions have become vastly superior to his younger\
      \ self due to his renewed and extensive training thanks to the Apple), higher\
      \ attack speed with bombs. Supersonic with his Hidden Gun"
    source_ids:
    - vsbattles-altair-ibn-la-ahad-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
