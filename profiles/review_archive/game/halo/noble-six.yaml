    - field: weaknesses
      value: 'Gilgamesh is insufferably arrogant and will thus almost always hold
        back unless he sees his opponent as entertaining or worthy of his power. He
        barely knows how to wield most of the weapons in the Gate of Babylon. After
        being "blackened" by the Grail''s mud, he physically incarnated and lost the
        ability to enter spirit form. His arrogance makes him unlikely to use Ea unless
        facing a worthy opponent | Same as before | None notable Notable Attacks/Techniques:
        ===Noble Phantasms=== Gate of Babylon: The King''s Treasure: Gilgamesh''s
        grand treasury. It is a storehouse that contains the countless treasures of
        the world collected by Gilgamesh. Using Key of the King''s Law, Bab-ilu, he
        can open an invisible door to its contents to summon them whenever he pleases.
        It contains the prototypes of all Noble Phantasms, which are fired from his
        vault as projectiles. He can also gather them directly into his hand for when
        he wants to fight up close. Due to the sheer number of Noble Phantasms he
        possesses, one can''t try and take them head-on as they possess various unknown
        abilities to properly counter virtually any Servant recorded in the Throne
        of Heroes. The rate and power of the Noble Phantasms he releases depend on
        the situation he is in and how Gilgamesh will use them, and who he is facing
        against. Additionally, he can also have them summoned right next to his opponent
        or from all directions to either attack them in surprise or to overwhelm them.
        Through the way he uses this Noble Phantasm, having adopted this manner from
        his fight with Enkidu in life, that makes him summoned into the Archer-class.
        It has an incredibly efficient mana cost, needed only to open the gates, to
        begin with. He can prepare and produce hundreds or even a thousand Noble Phantasm
        at once if he wishes and can return them to the vault whenever he pleases,
        even mid-flight. The Gate of Babylon contains all the treasures in the world,
        including the "wisdom of humanity" or in other words, the basis for all things
        constructed by humans throughout human history, from the works of the Library
        of Alexandria, to board games, to even airplanes and submarines. The only
        technology he lacks are things created by humans with entirely new concepts
        and the technology of extraterrestrial races. In addition to the "wisdom of
        humanity," he also possesses the Prototypes of all Noble Phantasms, as all
        heroes'' myths and legends are derived from his in some way, due to his status
        as the original hero. As such, he can overwhelm any Servant by targeting their
        weaknesses with the Noble Phantasms. While he does not possess Noble Phantasms
        that were made before or after his time, such as some Divine Constructs, or
        Noble Phantasms that are formed from a Heroic Spirit''s life and legend like
        God Hand, he would possess something that could be considered their prototypes,
        even if it was a paradox. Notable items within the Gate of Babylon include:
        *Anti-Spirit Incense: An ash-like powder that attracts walking corpses like
        those summoned by Angra Mainyu. *Auto-Defensors: A series of golden discs
        that float around Gilgamesh. The defensors can defend an area as large as
        a single floor building. They defend Gilgamesh from virtually any projectile
        by shooting them down with innumerable lightning bolts as they approach. It
        provides sufficient protection against even a storm of surprise attacks from
        Enkidu. However, a sufficiently fast projectile, such as True Archer''s arrows,
        would be able to bypass them altogether. *Command Spel'
