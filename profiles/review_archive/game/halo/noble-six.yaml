    - field: weaknesses
      value: "He usually keeps an 85 cm diameter surrounding him where the blades\
        \ of his Shikai and Bankai won\u2019t travel, so as to protect himself from\
        \ being injured by them Notable Attacks/Techniques: Shikai: The initial release\
        \ to a Shinigami's Zanpakut\u014D. It is activated by a command while declaring\
        \ the name of the Zanpakut\u014D Spirit. It changes the shape of the Zanpakut\u014D\
        \ and/or granting special abilities. * Senbonzakura: Byakuya's Zanpakut\u014D\
        . It normally takes the form of an ornate katana, but once he triggers it's\
        \ activation with the command \"Scatter\", it splits into a thousand tiny\
        \ blades. These blades are too small to be seen normally, but reflect light\
        \ in such a way that they appear to be shaped like cherry blossoms. He can\
        \ direct them by swinging the hilt of his sword. These blades cannot enter\
        \ within 85cm of Byakuya unless he himself allows the blades to enter the\
        \ area, creating a \"woundless area\" that can be entered to take him by surprise.\
        \ Byakuya later trained with the Royal Guard to gain a greater understanding\
        \ of Senbonzakura, giving him even greater control and the ability to produce\
        \ constructs on a large scale to a point that a previous wielder of Senbonzakura\
        \ mistook the Shikai for the Bankai. Bankai: The ultimate and final release\
        \ to a Zanpakut\u014D. The difference in power between Shikai and Bankai is\
        \ generally around 5-10 times more powerful. Even though Bankai is the final\
        \ stage of a Zanpakut\u014D, it does not mean the Shinigami's growth ends\
        \ there. A Bankai, especially one recently obtained, can evolve even further\
        \ as its Shinigami gets stronger. * Senbonzakura Kageyoshi: Byakuya's Bankai\
        \ is a much grander version of his Shikai. Upon activation, he drops Senbonzakura\
        \ into the ground, passing into it like water until a thousand giant blades\
        \ rise from it that split into a hundred million blades. Byakuya controls\
        \ these blades mentally, but can double their efficiency and speed by using\
        \ his hands. He can use these blades to attack his opponent as well as form\
        \ makeshift barriers for defense. The sheer quantity lets him do both simultaneously,\
        \ making it difficult to reach him. * Senkei: Byakuya compresses Senbonzakura\
        \ into four rows of thousands of glowing swords that encircle himself and\
        \ his opponent to limit their freedom of movement. It is Senbonzakura's true\
        \ form and it has abandoned defense for the sake of pure offense to kill the\
        \ enemy. A thousand blades are formed by the petals of Senbonzakura and the\
        \ blades have their strength explosively increased through the petals hardening\
        \ into the shape of a sword. The increases is double of it's previous state\
        \ and Byakuya is not limited to one sword at a time either. Byakuya is reluctant\
        \ to use this ability and will only do so for those he has sworn to kill himself.\
        \ * Ikka Senjinka: Byakuya attacks a single target with all of his Senkei\
        \ swords at once. * G\u014Dkei: All the petals surrounding the enemy in a\
        \ sphere, thus preventing escape, and converge onto the target. An attack\
        \ from every direction at once. * Sh\u016Bkei: Hakuteiken: The final ability\
        \ of Senbonzakura Kageyoshi. All the petals of Senbonzakura Kageyoshi concentrate\
        \ into one blade to maximize it's power into one point."
