power_scale:
  tier:
    text: At least {{9-B}} | {{9-A}} physically; {{9-C}} to {{8-C}} with weapons,
      {{8-A}} with Mjolnir's Self-Destruction
    source_ids:
    - vsbattles-noble-six-halo
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: At least Wall level (Comparable to Master Chief) | Small Building level+
      physically (Can KO other Spartans and other comparable troops with multiple
      punches); Street level to Building level+ (Ranges from UNSC handguns to Spartan
      Lasers), Multi-City Block level (Spartans can set the reactor in their armor
      to self-destruct to prevent it from falling into enemy hands, resulting in a
      massive explosion)
    source_ids:
    - vsbattles-noble-six-halo
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Superhuman travel speed (100+ km/h; comparable to other SPARTANs), Subsonic
      combat speed and reactions (Comparable to suitless John, who reacted to stun
      rounds) | Superhuman movement speed (Faster than before, Supersonic combat speed
      and reactions (comparable to other SPARTANs, can reacted to bullets and Covenant
      weaponry); Speed of Light attack speed with Spartan laser, (Although, it requires
      5 seconds to charge)
    source_ids:
    - vsbattles-noble-six-halo
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: At least Wall level | Small Building level+ (Comparable to other SPARTANs)
      likely Building level with MJOLNIR energy shields, (Comparable to other SPARTANs,
      can barely withstand a Fuel Rod Cannon); at least Building level with Overshield
      (Roughly two to three times stronger than MJOLNIR shields); at least Multi-City
      Block level with Armor Lockup (Renders him virtually impervious to melee, physical
      projectiles, flames, explosives, directed energy weapons, high-energy electromagnetic/thermal
      radiation, artillery, anti-tank missiles, vehicle impacts and Scarab Guns)
    source_ids:
    - vsbattles-noble-six-halo
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Can last much longer on the battlefield much longer than any
      of the UNSC marines and ODST soldiers, has the pain tolerance to continue fighting
      even when losing an arm. Stated to have lasted hours in his final stand against
      the Covenant. Stamina is further enhance by MJOLNIR regeneration).
    source_ids:
    - vsbattles-noble-six-halo
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range; Hundreds of Meters with most ranged weapons, Kilometers
      with sniper rifles
    source_ids:
    - vsbattles-noble-six-halo
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: At least Gifted (Noble Six is a natural prodigy. Despite his lack of experience,
      he is just as skilled as the rest of his team, and excellent military tactician,
      and adept in nearly every weapon or vehicle he/she can find. He/she ultimately
      paved the way for Master Chief).
    source_ids:
    - vsbattles-noble-six-halo
    confidence: 0.6
    notes: auto_repair source extraction
