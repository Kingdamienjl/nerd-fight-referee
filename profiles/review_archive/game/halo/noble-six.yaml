        \ be more than human (i.e. of divine blood), and Transmigration into One cannot\
        \ completely \"save\" those of a scale of existence above mankind, such as\
        \ gods. There is also a small chance to be able to overcome it by those who\
        \ have reached enlightenment through their strong ideals, or those who have\
        \ not known the suffering of life or its four noble truths | Cannot fight\
        \ in spirit form in lower dimensions, and requires a physical vessel to not\
        \ shatter it. Notable Attacks/Techniques: {{Nihongo|Authority|{{Ruby|\u6A29\
        \u80FD|\u3051\u3093\u306E\u3046}}|Kenn\u014D}}: As a Divine Spirit, Saver\
        \ possesses Authorities, special powers distinct from Codecasts, Noble Phantasms,\
        \ and Skills in that while they achieve results based on some logical process\
        \ or principle, an Authority realizes a result simply because the user has\
        \ the right to do so. Authorities are powers on the level of world construction\
        \ and can be powers such as event shifting, time manipulation, causality manipulation,\
        \ manipulation of concepts they embody, kingdom-building and other powers\
        \ on that level. The Gods originally used their Authorities during the Age\
        \ of Gods to shape the world, build kingdoms and advance civilization. But\
        \ as time went, humanity advanced to the point that Authorities became unnecessary.\
        \ When summoned as a Servant, Saver cannot utilize his Authorities without\
        \ heavily straining and harming himself. ===Noble Phantasms=== {{Quote|The\
        \ wheel tells time. All lives and all anguish shall return unto me. Under\
        \ the great Enlightenment, humanity shall become one.|Saver utilizing Amita\
        \ Amit\u0101bha}}{{Nihongo|Chakravartin: Turner of the Wheel|{{Ruby|\u8F49\
        \u8F2A\u8056\u738B|\u30C1\u30E3\u30AF\u30E9\u30FB\u30F4\u30A1\u30EB\u30C6\u30A3\
        \u30F3}}|Chakura Varutin}}: Saver's first Noble Phantasm, two chakram that\
        \ expand in the sky above him. The smaller one is seven-kilometer long while\
        \ the larger one is seventy kilometers long. The smaller chakram slowly rotates\
        \ during battle, firing bolts of light at nearby enemies like a mobile, omnidirectional\
        \ artillery platform. Over time, the number of rings increase, and the lights\
        \ on the mandala behind Saver light up, until there are seven rings and seven\
        \ lights. Once these seven prismatic rings and lights are all activated, it\
        \ allows for the use of Saver's true Noble Phantasm, Amita Amit\u0101bha.\
        \ In addition to its bolts of light Chakravartin also displayed the ability\
        \ to seize control of the Moon Cell, allowing Saver to change the rules of\
        \ the Moon Cell holy grail war and potentially prune all the timelines in\
        \ the timeline tree. {{Nihongo|Amita Amit\u0101bha: Transmigration into One|{{Ruby|\u4E00\
