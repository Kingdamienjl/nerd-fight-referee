        \u30D0}}|Amita Amit\u0101ba}}: The ultimate Anti-Unit Noble Phantasm, and\
        \ Saver's true Noble Phantasm. After Chakravartin is fully charged, Saver\
        \ can utilize Amita Amit\u0101bha by reciting its true name. The mandala's\
        \ lights then converge onto the chakram, and all the rings of light combine\
        \ into a single, massive spinning ring, forming the halo seen on the back\
        \ of the celestial Buddha, Vairocana. The pillars of light surround his opponent\
        \ and engulf them, creating a massive explosion, a teaching to showcase the\
        \ final Moksha, calling upon energies rivaling the laws of man's creation.\
        \ According to the Indian idea of Brahman, all humans are reincarnations of\
        \ Brahma, and all humanity is thus one individual. Amita Amitabha \"saves\"\
        \ those that it strikes, freeing them from suffering and returning all things\
        \ to the Buddha. As human history grows longer and longer, the attack grows\
        \ more powerful, and it deals damage that no living thing can withstand, furthermore\
        \ it freezes the target upon activation preventing them from defending themselves\
        \ or evading the Noble Phantasm. Though those that are not alive and have\
        \ not known the suffering of life or the four noble truths have a small chance\
        \ of survival. Those who have achieved enlightenment through their own strong\
        \ ideals can overcome it, and it is weaker against those that are not completely\
        \ human, and it cannot completely \"save\" those who are on a scale of existence\
        \ above mankind. ===Class Skil"
