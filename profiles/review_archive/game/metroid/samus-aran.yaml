        physical abilities, the ability to suppress of her eventual Metroid powers
        and likely Samus'' clairvoyant abilities. It also enabled Samus to survive
        on Zebes despite its difficult conditionsMetroid Manga (2002) - Chapter 2,
        enduring its acid rains and other inhospitable conditionsMetroid Manga (2002)
        - Chapter 11. *Zero Suit: A form-fitting flexible attire Samus wears beneath
        her Power Suit. While it lacks the innate protection and boosted defenses
        of her general armor, it''s still capable of utilizing Energy Tanks and grants
        Samus extra means of protection when she is unable to access the Power Suit.
        **Paralyzer Pistol: An emergency pistol Samus keeps on hand in case she is
        rendered unable to utilize her usual arsenal. Its main function against stronger
        foes is to stun them for long enough for Samus to disengage safely and while
