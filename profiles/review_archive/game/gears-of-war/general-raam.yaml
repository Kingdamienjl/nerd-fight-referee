        \ *Hard Drive Divinity (HDD): Utilizing a sufficient level of power gained\
        \ from the faith of her people, Rom can transform into White Sister in order\
        \ to enjoy higher overall stats. *Sharing Field: Rom uses Share Energy to\
        \ create a temporary pocket dimension which is able to contain and weaken\
        \ the powers of whoever is trapped inside it. {{!}}-{{!}} Basic Attacks \u25BE\
        = {{#tag:tabber|mk2 - VII Attacks= *Rush Attacks: Extremely fast attacks that\
        \ use multiple hits for damage, but have weaker cumulative damage. **Blast:\
        \ \"Elementary level wind magic.\" **Blast Rush: \"A continuous chant for\
        \ Blast.\" **Wind Storm: \"Mid-level magic that summons a fierce whirlwind\
        \ to swallow the foe.\" **Rain: \"Light element magic that falls like rain.\"\
        \ **Comet Shower: \"Attack by raining down countless small meteorites.\" *Power\
        \ Attacks: Attacks that don't utilize as many hits as Rush, but are extremely\
        \ powerful. These are the most powerful of basic attacks. **Flame: \"Elementary\
        \ level flame magic.\" **Flame Rush: \"A continuous chant for Flame.\" **Flame\
        \ Storm: \"Mid-level magic that summons a blazing whirlwind to swallow the\
        \ foe.\" **Extension: \"High-level magic with the Fire element.\" **Thunder\
        \ Bolt: \"Releases a high-pressure electrical current at the enemy.\" **Shining\
        \ Rain: \"A shining magical attack is unleashed on the enemy.\" **Darkness\
        \ Fall: \"Dark magic that surrounds the enemy in smoky darkness.\" *Standard\
        \ / Break Attacks: Attacks designed to break the enemy's guard and weaken\
        \ their defenses, or overall serve as good middle-ground attacks between Rush\
        \ and Power, dealing a moderate amount of damage in a moderate amount of hits.\
        \ **Ice: \"Elementary level ice magic.\" **Thunder: \"Elementary level lightning\
        \ magic.\" **Ice Rush: \"A continuous chant for Ice.\" **Thunder Rush: \"\
        A continuous chant for Thunder.\" **Ice Storm: \"Mid-level magic that summons\
        \ a freezing whirlwind to swallow the foe.\" **Thunder Storm: \"Mid-level\
        \ magic that summons a shocking whirlwind to swallow the foe.\" **Shining\
        \ Arrow: \"Fire at the enemy with three arrows of light.\" **Ice Nebula: \"\
        The high-level version of Ice Storm. Summons an unimaginably fierce blizzard.\"\
        \ *EX Finish Attacks: These are attacks performed at the end of a string of\
        \ attacks, usually to finish a combo, but sometimes as an enemy finisher.\
        \ These deal more damage than even the Power attacks, and are shown to have\
