    - field: intelligence
      value: 'Average but has a modest amount of combat experience and is a highly
        skilled magic user (Rom''s magic is the most potent magic seen in the series
        thus far, and she has shown to have great control over it. These magic attacks
        have a large variety of elements, and are also stated to have different levels
        of complexity to them in their descriptions, such as "elementary", "mid-level",
        and "high-level". She is said to have taught her healing magic to Nepgear.
        Somewhat versed in entomology as she read up a book about bugs. In Sisters
        VS Sisters, she has shown the capability to defeat the "Mecha Doll", "Mecha
        Peacekeeper", and "Battle Goddess" enemies, where they are mentioned to have
        the battle data of a Goddess installed in them,Sisters VS Sisters - Enemy
        Library, Mecha Doll (PN-NP) have both the battle data and greater mobility
        through their wings,Sisters VS Sisters - Enemy Library, Mecha Peacekeeper
        (PN-NP) or are stated to have both the battle data and is "the ultimate autonomous
        soldier which passed all tests with flying colors".Sisters VS Sisters - Enemy
        Library, Battle Goddess (PN-NP) Additionally, these Mecha enemies have even
        shown the same exact fighting style as the Goddess they imitate due to sharing
        the same motions of attacks as the Goddesses they imitate. This would include
        the likes of herself, Noire, Neptune, and all of the other Goddesses given
        there are multiple Mecha Doll, Peacekeeper, and Goddess entities; one such
        example is the "Mecha Doll PN-NG" enemy, with the "PN-NG" standing for "Planeptune-Nepgear",
        meaning that the specified Mecha Doll has the battle data and combat style
        of Nepgear. Rom has demonstrated the ability to defeat multiple of these Mecha
        enemies at once on their own, such as in the Arena, where several fights contain
        these enemies in batches or lonesome, up to a maximum of 6 enemies, with one
        such fight containing two Battle Goddesses, which would realistically show
        more combat proficiency and skill than the standard Mecha Dolls and Mecha
        Peacekeepers as a result of them "[passing] all tests with flying colors"Neptunia:
        Sisters VS Sisters (2022))'
      source_id: vsbattles-general-raam-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
