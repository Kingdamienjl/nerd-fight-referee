        Witch''s version of Temporal Control, Witch Time is an ability that allows
        Bayonetta to increase her statistics and slow down time to the point that
        projectiles appear nearly motionless and extensive battles can take place
        in a matter of seconds. This allows the user to bypass their opponent''s defenses
        and execute combinations of attacks and other feats that would otherwise be
        impossible to do in normal speed. Bayonetta also can stack Witch Time over
        itself to further increase her speed. *Umbran Climax: Techniques that allow
        Bayonetta to enter into an ascended state of power. Both techniques allow
        her to continually manifest the limbs of various infernal demons and increase
        her damage output. In Umbran Climax, she also gains the capability to perform
        "Infernal Weaves" and even recover her health while in that state. *Wicked
        Weaves: A technique that can be executed by powerful Umbra Witches to summon
        forth Infernal Demons by using their hair as a conduit. Bayonetta''s Wicked
        Weaves usually summon the massive limbs of Madama Butterfly, the demoness
        she has made a pact with, though she is entirely capable of using any of the
        demons under her command in conjunction with this technique. Wicked Weaves
        significantly increase the power of Bayonetta''s attacks, and become more
        powerful still the farther into a combo a Wicked Weave is produced. **Infernal
        Weaves: A significantly more powerful variant of Wicked Weaves accessable
        while Bayonetta has powered up into Umbran Climax. In addition to using normal
        Wicked Weaves for every attack, the end of combos cause Infernal Weaves to
        fully manifest the Infernal Demons for extreme damage in a large area-of-effect.
        *Torture Attacks: A special ability allows Bayonetta to summon ancient devices
        that werr once used to torture her fellow Witches during the Witch Hunts,
        giving her the ability to use them instead on her enemies. These attacks range
        from an iron maiden, decapitation by guillotine, placing them into a grinder,
        burning them, hanging them, crushing them to death, and pulling out a chainsaw
        to bisect foes. *Charge Bullet: A technique that charges Bayonetta''s guns
        as she fires normally, imbuing her bullets with more magic and as a result
        making them much more powerful. *Umbran Portal Kick: Bayonetta instantly summons
        a portal under herself and dives or falls into it, shortly reappearing in
        the air and then crashing back to the ground while posing, damaging all close
        enemies. This technique is also useful as a quick means of odging an attack.
        *Beast Within: A series of transformational techniques that Bayonetta can
        use to shapeshift into different animals that grant her new abilities. **Panther
