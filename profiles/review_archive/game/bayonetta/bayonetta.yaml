        suplexing Fortitudo during their battle. She also slaughters countless angels
        every day to maintain her many Faustian contracts with the demons she summons,
        being more worried about her Sunday dress than facing the totality of Paradiso's
        forces by the modern day. However, her vast experience and sadistic streak
        have made her overconfident at times, and thus she can be caught off guard
