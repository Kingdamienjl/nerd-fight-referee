    Willpower, Empowerment, and Reactive Power Level (In times of dire need, Persona
    users can massively increase their strength to the point to where those who previously
    stomped them can be overwhelmed by their sheer aura. Persona users can manifest
    new abilities and force their Persona''s to evolve mid-fight, and change the tides
    of battle). With Persona: Cognitive Physiology (Persona), Magic, consisting of
    Elemental Manipulation (with Agi, Bufu, Garu, Zio), Resistance Negation (with
    Megido), Damage Boost (with Mind Charge). Resistance and Affinities: Invulnerability
    to Death Manipulation, and Curse Manipulation. Reflection to Light Manipulation,
    and Holy Manipulation Base: All previous abilities, greatly enhanced. With Persona:
    All previous abilities, greatly enhanced, plus: Light Manipulation, Holy Manipulation,
    and Death Manipulation (with Hama and Mudo spells) Resistance and Affinities:
    All previous abilities, greatly enhanced.'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
