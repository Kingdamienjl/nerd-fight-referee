    - field: attack_potency
      value: "Outerverse level (Fights Demons/Shadows in early blocks of Tartarus\
        \ like Thebel, Arqa and Yabbashah, which correlate to the Sephirah Yesod and\
        \ Hod, a world that encompasses material functions and the foundation of all\
