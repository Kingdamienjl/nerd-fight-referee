      value: "Observation (This set of abilities is default to humans, as observation\
        \ is an ability given to all humans. This ability also goes by the terms understanding\
        \ and cognition), Reality Warping & Enhanced Subjective Reality (stated that\
        \ humans have the power to shape the world. Humanity has tremendous Control\
        \ over the flow of reality and the power of the human mind gave birth to the\
        \ universe and everything is made of cognition, and they created all kind\
        \ of gods and demons with the dimensions of their imaginations.), Logic Manipulation\
        \ (By assigning answers to phenomena without an answer, humanity changes their\
        \ beliefs into truths), Conceptual Manipulation (Type 1) Casuality Manipulation,\
        \ Soul Manipulation, Enhanced Information Manipulation (type 2) (Humans shape\
        \ and grant individuality to demons , with demons being largely conceptual\
        \ entities. Information is a label for human thought and information also\
        \ being The Soul and serves to fundamentally define all phenomena within the\
        \ akashic record, a complete record of causality and concepts and information\
        \ is what generates reality, thus \"God\" is the sun, the crucible of information.\
        \ and all things consisting information, contains \"God\".), Perception Manipulation,\
        \ Plot Manipulation, Reactive Power Level (humans can create rumors that,\
        \ as they gain strength , become stronger and turn into reality . Rumors can\
        \ also change people's stories, experiences, and personalities , and the longer\
        \ they persist and the more they are believed, the stronger they become .\
        \ Rumors can go beyond mere gossip; they are myths, tales, stories, sayings,\
        \ lies, or, of course, a rumor. Rumors can also alter shadow attacks and change\
        \ their archetypes), Empathic Manipulation (The Akashic Records, made from\
        \ Cognition are able to influence the minds of others.), Non-physical interaction\
        \ (Abstract thoughs, Minds, Nonexistence (type 2) As shown with prior examples,\
        \ Cognition is capable of interacting with souls, abstract thoughts, minds,\
        \ reality, and the nothingness of the void), Existence Erasure (True-Godly\u3010\
        Concept\u3008Type 1\u3009\uFF0CData, Fate, Casuality, Space-time, History,\
        \ Law, Willpower, Narrative, Identity, Information\u3008Type 2\u3009& Nonexistence\
        \ [all types] (The removal of anything from the cognition of the masses will\
        \ result in the erasure of their existence including of there material consciousness,\
        \ form and compositional information which serves as a conceptual template\
        \ for their existence, and spiritually, including their zero-bodies which\
        \ anchor their souls in the material body across all of history alongside\
        \ with their identity, which the gods with The power of cognition would lose\
        \ the very foundation of their existences. which erasing them in Keter, and\
        \ a void of absolute nothingness and they dissolve into the oneness of The\
        \ Archetypes and are thusly dispersed within all worlds) ** Regeneration (True-Godly\u3010\
        Concept\u3008Type 1\u3009\uFF0CData, Fate, Casuality, Space-time, History,\
        \ Law, Willpower, Narrative, Identity, Information\u3008Type 2\u3009& Nonexistence\
        \ [all types] Humans have shown the consistent capacity to restore themselves\
        \ through their cognitive or willpower prowess, such as when Enlil had erased\
        \ the party, just for them to come back to life after hearing Hikari's pleas,\
        \ or when the merged state of both the material and cognitive worlds was replete\
        \ with the cognition of the non-existence of the thieves, thus erasing them\
        \ both materially, including their material consciousness, form and compositional\
        \ information which serves as a conceptual template for their existence, and\
        \ spiritually, including their zero-bodies which anchor their souls in the\
        \ material body across all of history, requiring them to \"reclaim their existence\"\
        \ in reality. Most prominently, Kazuya, by remembering who he is, managed\
        \ to restore his own attachment to the cycle of reincarnation, which was previously\
        \ severed by YHVH, and locked him perpetually in the afterlife/sea of souls\
        \ , which is a complete void where everything dissolve into it, a sea of nothingness,\
        \ which corresponds with Absolute Nothingness) ** Regeneration Negation (True-Godly)\
        \ & Immortality Negation (all Types) Just as they are able to grant powers\
        \ to these Gods, the collective disbelief of these Gods can strip of them\
        \ or their immortality and acausality. and Humanity's observation grants things\
        \ determinance, their property and individuality their essence itself), Higher\
        \ Dimensional Physiology & Abstract Existence (Type 1) applied only to the\
        \ Soul (Humans and demons are the same creatures in their essence what differentiates\
        \ humans and demons besides their current existence is the fact that humans\
        \ are moved by the heart, the soul. The soul comprises diverse unique ideas,\
        \ fundamental concepts for our existence , the definition of an existence\
        \ that is written in a place in space , this being a product of our consciousness,\
        \ which gives form to that which does not possess a form , thus the mind is\
        \ also a conceptual construct.)"
