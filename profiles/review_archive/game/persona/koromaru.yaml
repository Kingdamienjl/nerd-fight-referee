- id: claim-powers-and-abilities-855ce154
  section: abilities
  axis: hax
  text: 'Base: Superhuman Physical Characteristics, Enhanced Senses (As a dog, he
    should likely have superior smell), Weapon Mastery (Can wield a knife), Supernatural
    Willpower, Empowerment, and Reactive Power Level (In times of dire need, Persona
    users can massively increase their strength to the point to where those who previously
    stomped them can be overwhelmed by their sheer aura. Persona users can manifest
    new abilities and force their Persona''s to evolve mid-fight, and change the tides
    of battle). With Persona: Cognitive Physiology (Persona), Magic, consisting of
    Fire Manipulation, Curse Manipulation, and Death Manipulation (with Mudo and Eiha
    skills), Fear Manipulation (with Evil Smile and Evil Touch), Attack Reflection
    (with Counterstrike and High Counter), Damage Boost (with Fire Boost and Amp),
    Statistics Amplification (with Sukukaja and Masukukaja), and Statistics Reduction
    (with Rakunda, and Weapon Crusher) Resistance and Affinities: Resistance and Invulnerability
    to Fire Manipulation, Curse Manipulation, and Death Manipulation. Fire, Ice, Electricity,
    Wind, Explosion, Energy, Curse, Darkness, Holy, Light, and Death Manipulation
    (w/ various gems), Resistance Negation (w/ Megido gems), Status Effect Inducement
    (w/ various weapons), Healing (w/ various items), Attack Reflection (w/ Mirrors),
    Statistics Amplification (w/ various equipment and Sutras), Damage Boost and Empowerment
    (w/ various equipment), Debuff Negation (w/ Dekaja Gem), Statistics Reduction
    (w/ Dekunda Gem). Invulnerability and Law Manipulation (With the Omnipotent Orb,
    the laws of the universe are warped and manipulated to enforce the law that no
    harm can be enacted on the user). Base: All previous abilities to a greater extent.
    With Persona: All previous abilities to a greater extent. Resistance and Affinities:
    All previous abilities to a greater extent.'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
