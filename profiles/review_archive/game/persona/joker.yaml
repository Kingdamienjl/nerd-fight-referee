        are pulled out of nowhere and used despite being missing in both gameplay
        and cutscenes), Supernatural Willpower, Empowerment, Accelerated Development
        and Reactive Evolution (Battle, Leveling, and Training; Physical Stats, Magic,
        and Improved Resistances. (Humans are able to get more powerful after defeating
        strong demons or even as they are in the middle of battle, even against opponents
        ontologically superior to them, and are able to grow massively in strength
        in the span of merely a day''s time or less, either through resolve, the threat
        of death, or training, or the bonds they hold dear), Superhuman Charisma (As
        shown through Shadow Negotiation, Ren is charismatic enough to break the mind
        control that a Palace Ruler passively possesses over the Shadows in their
        Palace), Sealing and Power Absorption (After persuading a Shadow to become
        apart of him, Joker seals his once-foes and they become a new mask), Information
        Analysis and Extrasensory Perception (With Third Eye, which allows Ren to
        single-out anything relevant to his current objectives, spot details invisible
        to the naked eye, as well as sense the strength of an opponent relative to
        himself), Perception Manipulation (Third Eye can slow down Ren''s perception
        of time), Cognition (Type 1) and Passive Fate Manipulation (Ren is the Trickster,
        a being capable of defying and changing fate in the Megami Tensei multiverse,
        that binds even the gods which inherently exist under an irregular system
        of causality. The smallest intervention on Ren''s part is capable of dramatically
        changing predetermined fates. This is further observed by Chihaya Mifune,
        who can perceive fates through Tarot readings with complete accuracy, to the
        point of receiving accurate visions of the future, such as Ren''s death in
        the police interrogation room. Ren was capable of defying his predetermined
        fate of losing to Yaldabaoth, who had hijacked his journey as a Wild Card
        and rigged everything against his success. Furthermore, an effectively-deified
        Takuto Maruki has stated that even if he were to retry his final battle with
        the Phantom Thieves, it would be impossible for him to win), Non-Physical
