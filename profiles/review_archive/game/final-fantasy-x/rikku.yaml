        \ reflects any spell back at her enemy. \u25AA Dispel: Rikku removes any sort\
        \ of buffs her enemy has that would increase their power. \u25AA Regen: Rikku\
        \ casts a spell that gradually heals herself or one of her allies over a period\
        \ of time. \u25AA Auto-Life: Rikku casts a spell that ensures that, upon"
