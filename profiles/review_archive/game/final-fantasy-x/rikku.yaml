    - field: weaknesses
      value: "None Notable Notable Attacks/Techniques: |-|Innate= \u25AA Steal: Rikku\
        \ secretly grabs items her opponents may possess to use for herself. \u25AA\
        \ Luck: Rikku raises her party's \"luck\", making it easier for them to dodge\
        \ attacks. \u25AA Spare Change: Rikku tosses a random amount of gil at her\
        \ opponents, dealing damage dependent on how much she uses. \u25AA Mug: Rikku\
        \ attacks an enemy while simultaneously stealing from them. \u25AA Bribe:\
        \ Rikku offers her enemy a large sum of gil, potentially convincing them to\
        \ leave the battle and leave their possessions behind, regardless of their\
        \ sentience or comprehension of money. \u25AA Pilfer Gil: Rikku attacks her\
        \ enemy while stealing any money they have. \u25AA Copycat: Rikku mimics the\
        \ previous action of one ally, using whatever technique they had just used.\
        \ \u25AA Mix: Rikku's Overdrive, which allows her to quickly combine two items\
        \ and create a new one with superior utility. Among the items she can create\
        \ are: * Final Elixir: Clears her party of negative status effects, fully\
        \ recovers their vitality and magic, and revives all of her deceased allies\
        \ at full strength. * Ultra NulAll: Bestows NulAll to her party and significantly\
        \ increases their attack power, magic power, physical resistance, magic resistance,\
        \ evasion, accuracy and luck. * Hyper Vitality: Doubles her party's vitality\
        \ and grants them five casts of Cheer. * Hyper Mana: Doubles her party's magic\
        \ reserves and grants them five casts of Focus. * Hyper Mighty G: Gives her\
        \ party Protect, Shell, Haste, Regen and Auto-Life, which revives them if\
        \ they happen to die. * Freedom X: Enhances her entire party to render magic\
        \ cost a non-issue. * Miracle Drink: Significantly enhances her entire party's\
        \ critical hit rate. * Trio of 9999: Significantly enhances her party's attack\
        \ power and healing power, so all of their strikes deal incredible damage\
        \ and any healing will affect them tremendously. * Hotspurs: Increases her\
        \ party's Overdrive gauge charging by 1.5x. * Eccentrick: Doubles the rate\
        \ at which her allies' Overdrive gauges will charge, which can stack with\
        \ Eccentrick. * Chaos Grenade: Throws a grenade that deals a massive amount\
        \ of damage and severely lowers enemy defense, slows down time for them, poisons\
        \ them, blinds them, nullifies their magic and puts them to sleep, all for\
        \ a very long duration. * Nega Burst: Creates a pseudo-black hole that, by\
        \ default, cripples her enemy regardless of their own vitality. * Black Hole:\
        \ Creates a gravitational singularity that heavily cripples her enemies regardless\
        \ of their vitality. * Sunburst: Forms a small, white energy sphere that violently\
        \ explodes. * Abaddon Flame: A much more powerful version of Brimstone that\
        \ also severely lowers her enemies' defense. * Thunderblast: An enhanced Electroshock,\
        \ which deals far greater damage and dramatically lowers her enemies' defense.\
        \ * Dark Rain: An enhanced Aqua Toxin with much higher damage and the added\
        \ effect of dramatically lowering her enemies' defense. * Krysta: An enhanced\
        \ Black Ice that deals greater damage and has the added effect of severely\
        \ lowering their defense. |-|Inherited= Contrary to popular belief, the party\
        \ members are not limited to their sections of the Sphere Grid and are capable\
        \ of branching into the sections of other characters. Key Spheres, which are\
        \ strictly used for this purpose, are canonically given out at certain points\
        \ in the story, and character-exclusive abilities like Lulu's Black Magic\
        \ and Kimahri's Lancet are discussed as if they are common abilities and not\
        \ completely restricted to the characters in question. As a result, the party\
        \ is entirely capable of using each others' abilities, as long as they are\
        \ part of the Sphere Grid. Yuna's Sphere Grid: \u25AA Curaga: Rikku significantly\
        \ heals herself or one of her allies. \u25AA NulBlaze: Rikku nullifies all\
        \ fire damage for herself and her allies for one attack. \u25AA NulShock:\
        \ Rikku nullifies all lightning damage for herself and her allies for one\
        \ attack. \u25AA NulTide: Rikku nullifies all water damage for herself and\
        \ her allies for one attack. \u25AA NulFrost: Rikku nullifies all ice damage\
        \ for herself and her allies for one attack. \u25AA Esuna: Rikku removes all\
        \ negative status effects on herself or one of her allies. \u25AA Life: Rikku\
        \ revives one of her allies if they happen to die, though they are nonetheless\
        \ still significantly injured. \u25AA Full-Life: Rikku revives one of her\
        \ allies at their full strength. \u25AA Shell: Rikku enhances an ally's magic\
        \ defense, halving the damage of all spells directed at them. However, there\
        \ is also inclusive of any healing spells. \u25AA Protect: Rikku enhances\
        \ an ally's physical defense, halving any damage they receive from physical\
