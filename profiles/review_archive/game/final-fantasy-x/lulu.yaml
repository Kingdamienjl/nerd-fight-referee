    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: *Pix, Faerie Companion: Lulu
        is assisted by Pix, a faerie, who fires a barrage of 3 bolts to her target
        every time she uses a basic attack against an enemy, dealing bonus magic damage
        with each bolt. The bolts can be blocked by units in the way of Lulu''s target.
        Casting Help, Pix! on an ally transfers Pix''s help to them. *Glitterlance:
        Lulu and Pix each fire a magic bolt towards the target point, dealing magic
        damage to the first enemy they pass through, reduced against enemies thereafter,
        and slowing them. If an enemy is hit by a second bolt from the same cast,
        they will either take no damage, or reduced damage depending upon if the first
        bolt had hit another unit before them. The second hit will refresh the slow.
        *Whimsy: **On Ally Cast: Lulu casts erratic magic upon an ally champion, giving
        them bonus attack speed and bonus movement speed for the next few seconds.
        **On Enemy Cast: Lulu turns the target enemy champion into a harmless critter
        or a plant, polymorphing them and reducing their base movement speed. As shown
        in her lore, this effect lasts indefinitely until Lulu reverses the effect.
        *Help, Pix!: **On Ally Cast: Lulu sends Pix to the target ally, shielding
        them if they are a champion. **On Enemy Cast: Lulu sends Pix, Faerie Companion
        Pix to the target enemy, dealing magic damage and granting true sight of them.
        *Wild Growth: Lulu enlarges herself or a target allied champion, knocking
        up units around them, increasing their bonus health and causing them to slow
        nearby units. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
