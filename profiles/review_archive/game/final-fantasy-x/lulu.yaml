  intelligence:
    text: Lulu is one of the most experienced members of the party, having been a
      guardian for two other summoners before becoming Yuna's. She specializes heavily
      in Black Magic, bombarding foes from a distance with a variety of powerful spells
      to prevent them from ever approaching her. In addition, she eventually becomes
      one of the strongest guardians in history, having contributed to the defeat
      of Sin, a feat thought impossible up to that point. However, Lulu suffers from
      the guilt of failing to protect her last two summoners and can be emotionally
      distraught in addition to her preference to stick to the traditional ways, leaving
      her sorely behind on varied and modern trains of thought.
    source_ids:
