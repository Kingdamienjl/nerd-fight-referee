    - field: weaknesses
      value: 'The Ouroboros forms generate heat overtime, if not managed properly
        this heat will draw in black fog and cause an Annihilation Event which will
        kill the user. Notable Attacks/Techniques: right|300px *Interlinking: The
        main ability of a completed Ouroboros, it allows for two Ouroboros to fuse
        into a singular being granting them a significant power increase and new abilities.
        Although the form is incredibly powerful, interlinked beings generate large
        amounts of heat the longer they are used and when reaching it''s limit black
        fog will engulf the interlinked being and cause an annihilation event. right|300px
        *Class Change: A unique ability of Noah and co.''s Ouroboros. It allows for
        them to copy the class of those they are around (typically fighting with or
        even fighting against as evident by Triton) and gain that class'' arts and
        abilities. The speed of which various depending on how adept the user is with
        said class (for example, Noah is adept with swords and thus would copy other
        sword classes fairly quickly). When obtaining these classes, users becomes
        immediately adept at using them the classes as all they can do with it flashes
        in front of their eyes with uses describing it as if they have always known
        how to use the class. Mastered classes have their abilities arts and abilities
        unlocked for any class which allows for users to use a multitude of weapons
        and abilities at once. Xenoblade-xenoblade-chronicles.gif|Noah drawing Lucky
        Seven Infinity Blade Talent.gif|Noah using Infinity Blade Unlimited Sword.gif|Noah
        using Unlimited Sword *Draw Lucky Seven: Noah draws upon Lucky Seven and as
        he does his former sheathe transforms into a gauntlet for him to use. In this
        state, Noah''s power and abilities are much more powerful as seen by Lucky
        Seven destroying the Colony 4 Flame Clock when his Ouroboros could not lay
        a dent in it. **Infinity Blade: A Talent Art unique to Noah that he can use
        regardless of class. Noah draws Lucky Seven as he delivers a powerful defence
        ignoring slash onto his foes. **Unlimited Sword: Another Talent Art unique
        to Noah. Noah draws Lucky Seven as he uses it at it''s full capabilities.
