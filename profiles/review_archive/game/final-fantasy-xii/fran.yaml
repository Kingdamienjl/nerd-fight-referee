    - field: intelligence
      value: 'Above Average, a master in fighting. While initially her fighting proficiency
        came from Master''s skills, soon the skills and Fran began to work in unison
        increasing her abilities tremendously.TSKD WN Chapter 28 Fran is a merciless
        warrior, that has no problem with killing or torturing those that wrong her.
        She is a bit of a battle maniac and will quickly grow bored with tasks like
        research or gathering.TSKD Manga Chapter 8 She can easily read and avoid large
        amounts of straight projectile patterns.TSKD WN Chapter 127 She usually lacks
        much of an expression and is hence difficult to read.TSKD WN Chapter 152 Over
        time, Fran has learned to use clever tricks while fighting. Examples Include:
        Splashing her blood into someone''s eyes,TSKD WN Chapter 705 briefly putting
        Master into her Dimensional Storage to remove adhesives,TSKD WN Chapter 707
        tilting the ground with Earth Magic and making it slippery with Ice Magic
        to ring out someoneTSKD WN Chapter 713 or emitting immense killing intent
        to distract the opponent so that Urushi can surprise attack.TSKD WN Chapter
        737 Fran makes up for the intuition Master lacks, being able to instantly
        make good calls on which actions to take should surprising events happen.
        Standard Tactics: Fran will regularily start 1-on-1 fights by using Awakening
        and Brilliant Lightning Rush. With her senses and speed raised tremendously,
        she will then generally briefly listen to Master''s analysis and strategy
        before chosing her approach to the fight. Should an attack come at her before
        that can happen, she will instinctively chose a course of action and, thanks
        to her excellent instincts, often chose a good one.'
      source_id: vsbattles-fran-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
