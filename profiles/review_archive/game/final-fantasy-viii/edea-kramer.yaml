    - field: weaknesses
      value: 'Junctioning Guardian Forces cause memory loss, has a limited stock of
        spells to use, Irvine must be hard-pressed to use his Limit Breaks, unless
        he has buffed himself with Aura. He has to manually decide between some of
        his resistances, although they can be changed when he wants them to. Changing
        his resistances or Junctioning an ability to his strikes locks it out from
        being used elsewhere (Can''t have Death Junctioned to his attacks and resistances
        at the same time as an example) Notable Attacks/Techniques: *Draw and Stock/Cast:
        Irvine can absorb the energy from an opponent to recreate their magical abilities.
        He can use this absorbed energy offensively to use the same ability on an
        opponent, or he can Junction it to become resistant/immune/strengthened by
        it. *Junction: Able to increase his statistics via Guardian Forces and grant
        himself resistance/immunity/strength to effects of magic and energy. *Guardian
        Forces (GFs): Guardian Forces are mystical entities that claim dominion over
        the elements. Irvine''s superhuman abilities are a direct result of being
        Junctioned to multiple Guardian Forces, which he can temporarily manifest
        in a battle to assist him in combat. Irvine''s Guardian Forces are listed
        below: |-|Limit Breaks= *Shot: Fires different types of ammo at his enemies:
        **Normal Shot: Physical attack on one enemy. It has moderate power and fires
        fairly quickly. **Scatter Shot: Fires attacks at all enemies in a wide area.
        Fires fairly quickly **Dark Shot: Fires attacks at an enemy with each shot
        is having a chance to inflict poison, silence, blind, sleep or slow. Fires
        slowly **Flame Shot: Fires attacks on all enemies in an area inflicting fire
        damage **Quick Shot: Weak but a fast attack on one enemy. It does low damage
        but fires very quickly. **Armour Shot: Fires defensive ignoring ammo at an
        enemy. Fires Slowly **Hyper Shot: Attacks his opponents with ammo that creates
        a powerful energy blast. |-|Guardian Force= *Ifrit: Uses a Fire-elemental
        attack called "Hellfire *Shiva: Uses a Ice-elemental absolute zero attack
        called "Diamond Dust" *Quetzalcoatl: Uses a Lightning-elemental attack called
        "Thunder Storm" *Siren: Uses a Non-Elemental attack called Silent Voice. It
        also inflicts "Silence." *Brothers: Uses an Earth-Elemental attack called
        "Brotherly Love." *Diabolos: Uses a Gravity-based attack that deals damage
        in relation to the enemies'' maximum HP called "Dark Messenger." *Carbuncle:
        Grants Reflect status to party *Leviathan: Deals Water-Elemental Damage and
        attempts to Removes the enemy from the battlefield with a huge torrent of
        water. *Pandemona: Uses a Wind-Elemental attack called "Tornado Zone" *Cerberus:
        Enables the party to cast two or three magic spells in one turn *Doomtrain:
        Uses a Poison-Elemental Attack called "Runaway Train," Inflicts every status
        ailment at the same time. *Alexander: Uses a Holy-Elemental Attack called
        "Holy Judgement." *Bahamut: Uses a Non-Elemental Attack called "Mega-Flare"
        *Odin: Uses "Zantetsuken," which kills opponents instantly, this has a random
        chance to occur, and Irvine has no Control over it. *Phoenix: Uses a Fire-Elemental
        attack called Rebirth Flame. Can resurrect fallen party members should they
        die. *Eden: Eden uses a Non-Elemental attack called "Eternal Breath" |-|Magic=
        *Doom: Cuts an opponent''s thread of life, forcing them to live on borrowed
        time (16 seconds), causing instant and immediate death once it runs out. *Death:
        Summons a reaper from a small void to strikes the foe with its scythe, instantly
        killing most of them. *Drain: Drains a portion of the target''s health, healing
        the caster for the same amount. *Firaga: Launches an enormous fireball at
        an opponent. *Thundaga: Launches a large lightning bolt at an opponent. *Blizaga:
        Launches an enormous icicle at an opponent. *Tornado: Creates a mighty tornado
        damaging all opponents. *Quake: Creates a violent earthquake at an opponent''s
        feet. *Bio: Inflicts a virulent poison upon an opponent. *Demi: Crushes the
        foe in an orb of gravity and reduces their HP by half. *Holy: Blasts the target
        with holy damage. *Meltdown: Shoots a powerful wave of energy at the target
        causing non-elemental damage, and reducing the enemy''s physical/magical defense
        to 0. *Meteor: Summons meteors to bombard her targets for a brief period.
        *Flare: Blasts the target with non-elemental damage. *Ultima:: Draws in large
        amounts of magical energy and unleashes it in a massive explosion upon the
        enemy, dealing non-elemental damage. *Haste: Speeds up time around the target,
        raising their effective movement and combat speed. *Slow: Slows down time
        around an opponent reducing their effective combat and movement speed. *Aura:
        Status magic that increases the chance of the affected character getting a
        Limit Break and allows them to get Limit Breaks outside of being in HP Critical
        health. Being under the effects of Aura boosts the character''s Crisis Level,
        enhancing their Limit Breaks as well. *Silence: Prevents the foe from casting
        spe'
