    - field: intelligence
      value: Genius (Was the main and most valued detective towards the police force
        investigation towards Li Tianchen and the supernatural phenomenon involving
        the possession of people through images. Lu Guang came from the future and
        has significant knowledge on future events that is ordained by destiny, and
        how to change fate or make events stay the same; he is very knowledgable on
        concepts so-called "future nodes", which are significant specific points in
        time that are strictly unchangable -- if a future node were to be changed,
        then reality will become absolutely catastrophic. Considering Lu Guang has
        the ability to see into the events up to 12 hours after a specific photo was
        taken, he is able to grasp knowledge and events that are otherwise unbeknownest
        to others. Lu Guang taught Cheng Xiaoshi to control and manage his powers,
        to prevent causes of time paradoxes and universal cataclysm)
      source_id: mediawiki-4944268
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Considering Lu Guang possess's Cheng Xiaoshi's time traversal powers,
        his supernatural photo-traversing powers are extremely limited and can only
        be initiated through images, the picture can only transfer his soul into a
        certain individual at once -- hence, the accessibility of his powers may not
        be possible if he were to lack the required materials. Without any images
        or videos, he is pretty much a mere ordinary human. However, he is capable
        of accessing his powers through online images and videos displayed on a screen.
        Otherwise
      source_id: mediawiki-4944268
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: 'Photo Traversal: Cheng Xiaoshi''s notable power that can travel back
        in time through photos by soul-transferring into the body of the photographer
        who took the picture, he is not only capable of traversing into real physical
        copies of photos but also images displayed on a screen, such as a phone. This
        power of his allows him to travel back to anywhere back in time, neglecting
        the quality of the photo, insinuating that his power''s potency does not have
        any limitations., Space-Time Warping: Lu Guang stated his powers can warp
        all of space-time and reality if he does one wrong move either intentionally
        or unintentionally. In order for space-time and reality not to be changed,
        he needs to act in accordance to Lu Guang''s instructions that''ll flow with
        the history and causality from the time period to present day., Fate Alteration:
        Cheng Xiaoshi bestowed his powers to Lu Guang after his death, allowing Lu
        Guang to travel back in time and reverting everything that happened, changing
        destiny itself and deleting the original timeline. Lu Guang travelled back
        in time to rewrite Cheng Xiaoshi''s fate by keeping him alive., Cause and
        Effect Reversion: Cheng Xiaoshi''s time traversal powerss can reverse all
        of cause and effect by reversing every incident that happened with time travel.
        Lu Guang rewritten the entire timeline after he harnessed Cheng Xiaoshi''s
        time traversal powerss to travel back in time, therefore reverting every incident
        that occurred, including its causality., Possession: Through soul-transferring
        to the photographer of the picture, he has full possession of their body and
        as well inherit their memories. Therefore, he can possess the photographer
        of the picture with his Photo Traversal time travelling ability.'
      source_id: mediawiki-4944268
      provider_id: vsbattles
      authority: high
      confidence: 0.75
