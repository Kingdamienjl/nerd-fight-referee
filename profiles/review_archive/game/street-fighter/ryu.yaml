      value: 'Ryu can lose his calm sometimes, especially when unleashing the Satsui
        no Hado, which turns him into a berserker blinded by rage. He believes in
        showing true mercy to his opponents, and does not believe in killing his opponent.
        He is also afraid of spiders (he once woke up with one in his mouth). Note:
