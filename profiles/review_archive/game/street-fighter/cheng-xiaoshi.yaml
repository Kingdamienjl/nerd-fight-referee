  attack_potency:
    text: Street level (Fought on par with Qianjin -- a retired cop and cirminal organisation
      leader, and many of his gang membersSeason 2, Episode 2), Varies via Possession
      (He is capable of possessing anyone who's in the picture, hence his power can
      vary depending on the person he possesses); Universe level+ Environmental Destruction
      through his Time-Traversal powers (Cheng Xiaoshi's Time-Traversal powers can
      potentially cause a "hurricane" that can destroy the world,Bridon Chapter, Episode
