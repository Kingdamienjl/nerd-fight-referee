      with a band of soldiers he formed after having been reassigned in an effort
      to thwart his investigation, and eventually he even cornerered M. Bison.Street
      Fighter 30th Anniversary Collection His military training made him knowledgeable
      in several fields, such as leadership, piloting, Harrier maintenance, psychology,
      stealth, assassination and hand-to-hand combat. He is an especially capable
      fighter, being expert in military martial arts, wrestling and chi techniques;
      his arsenal became even wider with the augmentations he received after coming
      back to life. Has records of victories in USA national tournaments.All About
      Street Fighter ZERO 3 Was Guile''s mentor and his skill allowed him to keep
