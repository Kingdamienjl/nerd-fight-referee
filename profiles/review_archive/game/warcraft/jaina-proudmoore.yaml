    - field: intelligence
      value: 'Gifted (Rexxar is a master survivalist who lives off the land without
        any aid not from an animal companion, and sometimes not even then. Considered
        one of the greatest hunters in Azeroth''s history, with practically nobody
        properly comparing to him in the modern day. Rexxar lead the Horde in the
        invasion of Kul Tiras, something considered impossible for the modern Horde
        without the aid of the Zandalari) *Combat: Rexxar is one of the greatest combatants
        in Azeroth''s history, non-verbally communicating with Grommash Hellscream
        in the middle of a massive combat until they were the only two left on the
        battlefield, and without getting hit once by the soldiers around them, simply
        left. Even against opponents superior to him, Rexxar has no problems using
        agility and the aid of his companions to overwhelm even the most hellish foes.
        Considered one of the greatest hunters in Azeroth''s history, with practically
        nobody properly comparing to him in the modern day, which would include Lor''themar
        Theron.'
      source_id: mediawiki-jaina-proudmoore
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'None Notable Notable Attacks/Techniques: *Rexxar: While Rexxar never
        fights alone, he has plenty of abilities he can achieve himself. **Frenzy:
        Physical damage dealt is increased by 100%. Attack speed increased by 50%.
        **Roar: Taunts the target to attack you, but has no effect if the target is
        already attacking you. **Vengeance: Damage increased by 100% upon an ally
        being felled within view of Rexxar. **Cleave: Inflicts 110% of normal melee
        damage to an enemy and its nearest allies, affecting up to 3 targets. **Sundering
        Cleave: Hacks at the armor of an enemy and its nearby allies, affecting up
        to 3 targets. A target''s armor is reduced per Sunder Armor. *Standard Animal
        Companions: These are animal companions often seen with or around Rexxar **Misha
        **Huffer **Leokk **Spirit *Optional Animal Companions: These are Animal Companions
        that Rexxar isn''t almost always accompanied by, and instead are either dead
        or only used once or twice on-screen **Huelo: A Wolf and Rexxar''s first ever
        Animal Companion on Azeroth, Huelo is a currently deceased companion who met
        his end during Battle for Azeroth, and was subsequently buried where Rexxar
        first met her. **Haratha: A Wolf and Rexxar''s primary companion while he
        was a part of the Old Horde. He was killed protecting his master in the final
        retreat from the Dark Portal by a dying warlock of the Horde wanting to rejuvenate
        himself with Rexxar''s life. Rexxar avenged Haratha by killing the warlock.
        **Two Unnamed Wolves: Used as a mount to ride, presumably have the same characteristics
        as the rest of Rexxar''s Companions **Unnamed Dread Raven: A Large Raven Rexxar
