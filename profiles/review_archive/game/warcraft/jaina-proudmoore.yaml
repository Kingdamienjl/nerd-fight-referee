    - field: intelligence
      value: 'Gifted (Rexxar is a master survivalist who lives off the land without
        any aid not from an animal companion, and sometimes not even then. Considered
        one of the greatest hunters in Azeroth''s history, with practically nobody
        properly comparing to him in the modern day. Rexxar lead the Horde in the
        invasion of Kul Tiras, something considered impossible for the modern Horde
        without the aid of the Zandalari) *Combat: Rexxar is one of the greatest combatants
        in Azeroth''s history, non-verbally communicating with Grommash Hellscream
        in the middle of a massive combat until they were the only two left on the
        battlefield, and without getting hit once by the soldiers around them, simply
        left. Even against opponents superior to him, Rexxar has no problems using
        agility and the aid of his companions to overwhelm even the most hellish foes.
        Considered one of the greatest hunters in Azeroth''s history, with practically
        nobody properly comparing to him in the modern day, which would include Lor''themar
        Theron.'
