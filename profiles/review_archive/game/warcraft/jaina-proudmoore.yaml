  intelligence:
    text: 'Genius (Arthas is a nearly unparalleled martial combatant. Having been
      trained since childhood to join the Knights of the Silver Hand, Arthas was personally
      tutored in armed combat by Muradin Bronzebeard, becoming one of the youngest
      to join the order at the age of 19, and came to be considered one of the finest
      swordsmen in Lordaeron.Warcraft III: Reign of Chaos Game Manual In order to
      join the Knights of the Silver Hand, apprentices are trained to use a variety
      of weapons, they learn combat tactics and many techniques, as well as how to
      ride and fight on their steed. Their training sessions are long and difficult,
      lasting up to several hours a day until exhaustion, and doing so every day for
      years. Training at arms is important for a paladin, so are prayer and meditation,
      as they must be able to cut down their enemies but must also be able to heal
      their allies and themselves. Following the ceremony of induction, they continue
      to be trained by their master, in order to learn how to use their new holy powers.
      Once their training is complete, and to improve their new abilities, young paladins
      are given various quests, missions, and trials by their masters in order to
      continually prove their worthiness to the order. One of Arthas'' earliest missions
      involved hunting down and defeating an Orc Blademaster of the Blackrock Clan,
      a group of Orcs who utilize a mix of illusion magic and warrior energy coupled
      with their mastery of swordsmanship to act as an elite fighting force within
      the Horde. Later in life, after obtaining Frostmourne, Arthas singlehandedly
      defeated Mal''Ganis''s army, destroyed his base, and killed Mal''Ganis before
      singlehandedly killing his own army and raising them with his newfound powers
      as a Death Knight.Army of the Damned As a death knight, Arthas would go on to
      serve as the Lich King''s champion, carrying out crusades to spread the Undead
      Plague while personally slaughtering his former ally paladins and knights of
      the Silver Hand, most notably Uther the Lightbringer, as well as other forces
      such as the High-Elves of Silvermoon, entire camps of Blackrock Clan Orc Blademasters,Blackrock
      & Roll Too! the mages of Kirin Tor,The Siege of Dalaran and Illidan''s forces
      of Vashj''s Naga and Kael''s Blood Elves.A Symphony of Frost and Flame Arthas
      has also faced Illidan Stormrage on two separate occasions, with their second
      duel being acknowledge by Arthas as the only time in his entire combat history
      where he was ever brought close to dying. Arthas is also a master tactician,
      having served as Ner''zhul''s champion for years and accelerating the Scourge''s
      spread tenfold as a death knight, and later nearly conquering Azeroth as the
      Lich King.'
    source_ids:
    - vsbattles-jaina-proudmoore-warcraft
