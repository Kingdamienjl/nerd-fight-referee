    - field: weaknesses
      value: "The destruction of Frostmourne will instantly result in the release\
        \ of the souls trapped within the mourneblade. From there the spirits of the\
        \ Lich King's victims will swarm their tormentor, repaying his cruelty with\
        \ righteous vengeance. After this Arthas is left defenceless and fatally wounded.\
        \ This feat was only accomplished by Tirion landing a desperate blow when\
        \ Arthas was convinced he had won and had already begun to raise the Champions\
        \ into undeath. As this occurred, Tirion was blessed by the Light, allowing\
        \ him to break free from his icy prison and amping both him and the AshbringerThe\
        \ Lich King Encounter, both of which directly counter the undead. The Ashbringer\
        \ in particular destroys the undead so thoroughly it leaves nothing but ash\
        \ in its wakeWorld of Warcraft: Ashbringer, Issue 1Azeroth Armory: Forging\
        \ the Ashbringer. Feats: Arthas most notably slaughtered the Champions of\
        \ Azeroth who were stated to be Azeroth\u2019s greatest champions and the\
        \ greatest fighting force Azeroth had ever known up until that point. These\
        \ same champions have previously defeated many notable threats such as The\
        \ Firelord: RagnarosMolten Core, The Lord of Blackrock Spire: NefarianBlackwing\
        \ Lair, The God of the Qiraji: C\u2019thunTemple of Ahn'Qiraj, The Archlich:\
        \ Kel\u2019ThuzadNaxxramas, The Sun King: Kael'thas SunstriderTempest Keep,\
        \ The Defiler: ArchimondeBattle for Mount Hyjal, The Deciever: Kil\u2019JaedenSunwell\
        \ Plateau, The Betrayer: Illidan StormrageBlack Temple, The Fiend of a Thousand\
        \ Faces: Yogg-SaronUlduar and more. Arthas also fought one of his toughest\
        \ battles against Illidan before he became the Lich KingA Long Time Coming\
        \ (WC3 Undead). It is worth noting that although he was weaker than he is\
        \ as the Lich King by a large degree, Arthas at this point was being amped\
        \ by the remaining powers of the Lich King at the time, Ner\u2019zhul. It\
        \ is stated that it was the only time up to that point where he came close\
        \ to dying. Despite the adversity he sliced into Illidan\u2019s flesh and\
        \ nearly killed him, yet Arthas never delivered the final blow. Although Illidan\
