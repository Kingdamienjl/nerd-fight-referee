      one-shot Blackmoore the instant he got serious. Crushed an entire castle with
      his use of the elements. Portrayed as comparable to Cairne Bloodhoof in their
      fights alongside each other. Fought Daelin Proudmoore alongside Rexxar and Cairne,
      The former of whom was highly respected by Grommash Hellscream and should be
      somewhat comparable to the Warsong Warchief.Beyond the Dark Portal Crushed Brux''s
      skull and one-shot him with ease. When angered, Thrall instantly caused a massive
      Earthquake, a thunderstorm, and a tsunami all at once. by the time of Vanilla
      World of Warcraft, Thrall was considered the mightiest orc alive,World of Warcraft:
      Game Manual placing him above orcs like Rehgar whom trained Varian Wrynn.World
      of Warcraft: The Comic Dueled Garrosh Hellscream,World of Warcraft: Wrath of
      the Lich King Pre-Event and later battled Varian Wrynn on even grounds.The Battle
      For The Undercity), at most Planet level (Superior to Varok Saurfang, who heavily
      injured a weakened Malfurion. Did minor damage to Archimonde with his lightning,
      which a bloodlusted Malfurion also did with vines.War of the Ancients Trilogy
      Fought Fel Orc Grommash Hellscream with an army at his back. Later in life was
      portrayed repeatedly as comparable to High King Anduin Wrynn) | Planet level
      (Directly comparable to Neltharion as the Earth-Warder. Effortlessly dispatched
      a powerful raging fire elemental. Portrayed as comparable to Kalecgos, who is
      somewhat comparable to Khadgar.World of Warcraft: Dragonflight Later portrayed
      as comparable to every other Dragon Aspect, including Nozdormu, Ysera, and Alexstrazsa.
