        \ family of orcs. The weapon was famously wielded by Grommash Hellscream,\
        \ chieftain of the Warsong clan, and was later also held by his son and heir\u2014\
        Garrosh, Warchief of the Horde. The sharply curved axe head, with an intricate\
        \ series of grooves in it,Wolfheart, pg. 291 is massive, well worn, and permanently\
        \ stained with old blood. Its wickedly curved blade has two notches in it,\
        \ and many small holes in the head near the handle.Wolfheart, pg. 64 When\
        \ swung, the notches causes the axe to \"sing\" its own battle cry, just as\
        \ Grom once did, which gave the weapon its name.The Shattering: Prelude to\
        \ Cataclysm, pg. 39 The skull on the blade is believed to be that of a slain\
        \ goren.\"Azeroth Armory - Gorehowl\"/> The leather wrap on the handle would\
        \ have been made from clefthoof hides. When it wasn't held in Garrosh's hands,\
        \ he hooked it onto a brace on his back.Wolfheart, pg. 435 - 436 Summary Courtesy\
        \ of WowPedia. Xal'atoh: A weapon originating from the Old God Ysharaaj, Xal'atoh\
        \ was Garrosh's weapon of choice after he put discarded his timeline's Gorehowl\
