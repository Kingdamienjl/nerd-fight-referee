    - field: weaknesses
      value: "Solomon is incredibly arrogant and tends to gloat and monologue to his\
        \ foes. His control over magecraft will weaken should even one of his rings\
        \ be lost. He requires a great deal of preparation time to recreate Earth\
        \ as he desires. Goetia is the Beast representing Pity and will thus mirror\
        \ whoever he's confronting, becoming aggressive in the face of aggression\
        \ and being calm and sympathetic in the face of gentleness. Notable Attacks/Techniques:\
        \ ===Noble Phantasms=== {{Quote|My feat! My ideal! Know the true purpose of\
        \ my birth! This planet will be reborn! All life will become the past! Sing\
        \ your praises. My name is Goetia! Human Order Incineration Ritual, King of\
        \ Demon Gods, Goetia!|Goetia using Ars Almadel Salomonis}}{{Nihongo|Ars Almadel\
        \ Salomonis: The Time of Birth has Come, He is the One who Masters All|{{Ruby|\u8A95\
        \u751F\u306E\u6642\u304D\u305F\u308C\u308A\u3001\u5176\u306F\u5168\u3092\u4FEE\
        \u3081\u308B\u8005|\u30A2\u30EB\u30B9\u30FB\u30A2\u30EB\u30DE\u30C7\u30EB\u30FB\
        \u30B5\u30ED\u30E2\u30CB\u30B9}}|Arusu Arumaderu Saromonisu}} Solomon's third\
        \ Noble Phantasm, and the Noble Phantasm most used by Goetia. It is the \"\
        |\" of Original Sin, appearing at first as a massive ring of light the size\
        \ of North America that encircles the planet. It fires hundreds of millions\
        \ of lines of light, with each light possessing a power equal to Excalibur,\
        \ and travels through time to destroy the surface of the planet in the past,\
        \ present, and future all at once, eradicating humanity at all points in time.\
        \ Nothing on Earth surpasses the heat produced by this attack and no earthly\
        \ material can withstand it for as long as it abides by the laws of physics.\
        \ It can also be focused into a single point and fired as an Anti-Unit Noble\
        \ Phantasm with enough power to pierce through the entire planet with a hole\
        \ via the heat it produces alone. However, its true application is in the\
        \ energy it gathers by incinerating humanity, which it mostly uses to fuel\
        \ itself. By destroying humanity across 3,000 years, Goetia harvests the spiritrons\
        \ of all life throughout 3000 years of history, an amount of energy that surpasses\
        \ the creation of Earth itself and can use it to travel back in time to the\
        \ creation of the earth and recreate the planet as he pleases with entirely\
        \ new concepts. Such a feat is close to True Magic. {{Nihongo|Ars Paulina:\
        \ The Time of Crowning has Come, He is the One Who Begins All|{{Ruby|\u6234\
        \u51A0\u306E\u6642\u304D\u305F\u308C\u308A\u3001\u5176\u306F\u5168\u3092\u59CB\
        \u3081\u308B\u8005|\u30A2\u30EB\u30B9\u30FB\u30D1\u30A6\u30EA\u30CA}}|Arusu\
        \ Paurina}}: Solomon's second Noble Phantasm, and his Reality Marble. It is\
        \ a workshop that exists outside of the universe, outside of space and time,\
        \ in the sea of imaginary numbers. It is powered by Solomon's Magic Circuits,\
        \ and death in this space does not count, allowing him to resurrect those\
        \ who die within it. {{Nihongo|Ars Nova: Light Band Convergence Ring|{{Ruby|\u8A23\
        \u5225\u306E\u6642\u304D\u305F\u308C\u308A\u3001\u5176\u306F\u4E16\u754C\u3092\
        \u624B\u653E\u3059\u8005|\u30A2\u30EB\u30B9\u30FB\u30CE\u30F4\u30A1}}|Arusu\
        \ Nova}}: The only Noble Phantasm Goetia has to himself, hypothesized in place\
        \ of the true Ars Nova used by Solomon. Instead of its original, intended\
        \ use, he uses it to activate the calculations needed to return the Earth\
        \ to its genesis and recreate it as he pleases. ===Class Skil"
