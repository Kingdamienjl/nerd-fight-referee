    text: At most Small Planet level1.68 Zettaons of TNT, likely Multi-Solar System
      level (Capable of fighting Endgame Tarnished, who could fight The Elden Beast.
      Defeated the king of the Fire Giants, whose minion is described by Alexander
      as "practically a god" on the level of Radagon of the Golden Order or Queen
      Marika herself. Likewise, Alexander had previously battled Radahn, and witnessed
      Radahn's defeat first-hand, thus, likening the Fire Giant to a god would suggest
      that Alexander believed the Fire Giant was vastly superior to Radahn16.88 ExaFoe),
      higher as Hoarah Loux (Godfrey is a persona created to appear more dignified,
      kingly and cilized via using Serosh, however this weakens him as he is containing
      his warrior instincts and bloodlust. In his fight he releases his inner nature
      in an attempt to beat the Tarnished)
