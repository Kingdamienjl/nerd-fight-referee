        \ Arts= Karate(Gojo-Ryu, Shotokan and Kyokushin): *Forearm Parry: Blocking\
        \ a punch is the process of stopping it on it's line of attack. Parrying a\
        \ punch is the process of deflecting an incoming shot from it's line of attack.\
        \ For every shot thrown there is an effective block or parry that can be used\
        \ as a counter measure. Mikey forearm parry 1.gif Mikey forearm parry 2.gif\
        \ *Headbutt: A headbutt is a strike with the head, typically involving the\
        \ use of robust parts of the cranium as area of impact. Effective headbutting\
        \ revolves around striking a sensitive area with a less sensitive area, such\
        \ as striking the nose of an opponent with the forehead. A misplaced headbutt\
        \ can cause more damage to the headbutter than the headbuttee. Mikey headbutt\
        \ 2.gif *Elbow Strike: An Elbow Strike is a strike made with either the point\
        \ of the elbow or the part of the humerus or ulna closest to the joint. Elbows\
        \ can be used upwards, downwards, to the side (similar to a hook), or as a\
        \ straight jab; they can also be used to strike targets in front of, to the\
        \ side of or behind the practitioner. Mikey elbow 1.gif Mikey elbow 2.gif\
        \ Mikey elbow 3.gif * Knee Strike: An Knee Strike is a strike made with the\
        \ area of the leg around the knee (some styles strike with the kneecap, however,\
        \ this can be dangerous). They can be devastating in close-range combat. Mikey\
        \ knee.gif *Front Kick: Executed by lifting the knee straight forward, while\
        \ keeping the foot and shin either hanging freely or pulled to the hip, and\
        \ then straightening the leg in front of the practitioner and striking the\
        \ target area. Mikey front kickk.gif Taekwondo: * Roundhouse kick: Mikey's\
        \ signature kick. A fast heavy kick performed by first raising the knee of\
        \ the kicking leg so that the knee is aimed toward the target, as with a Front\
        \ Kick. You then pivot on the balls of the non-kicking foot and turn the hip\
        \ over slightly so that your body is turned sideways toward the target. The\
        \ leg is then straightened to kick, so that the shin of the leg is moving\
        \ in an arc that's parallel to the ground as you are kicking. Mikey Roundhouse\
        \ kick 1.gif Mikey roundhouse 2.gif *Jumping Roundhouse kick: This technique\
        \ allows martial artists to achieve higher kicks so they can target an opponent\u2019\
        s head with a roundhouse kick. Mikey jumping roundhouse 1.gif Mikey jumping\
        \ roundhouse 2.gif *Jumping Axe kick: This is a more advanced version of the\
        \ traditional axe kick. The dramatic jumping axe kick is useful for breaking\
        \ and demonstrations. Mikey axe kick.gif *540 spin kick: A flying spin 540\
        \ degree kick to the head/neck area. Usually done against taller opponents.\
        \ Mikey weird ahh kick.gif *Front Kick: A fast kick to the chin whick stuns\
        \ opponents. Usually done against taller opponents. Mikey taekwondo frontkick.gif\
        \ *Jumping Crescent kick: A jumping crescent kick delivered to the head. Usually\
        \ done against taller opponents. Mikeyjumpingcrescent.jpeg *High Jump Kick:\
        \ The non-kicking leg first rises knee-high into the air. Then you jump using\
        \ the kicking leg. This is form so that the non-kicking leg can give your\
        \ body extra upward momentum, to increase the height of your jump. Then while\
        \ in the air, you perform a Front Kick. Typically you land on the non-kicking\
        \ foot.The jump front kick requires flexibility to execute. Mikey high jumping\
        \ kick.gif * Backwards Kick: A fast kick delivered with the back of the heel.\
        \ You normally need to lean your body forward as you pivot away from the target\
        \ in order to get any height into the kicking leg. The striking surface for\
        \ a Back Hook Kick is the back of the heel. Mikeybackwardkick.jpeg *Back Hook\
        \ Kick: The Back Hook kick is a relatively modern trend in Taekwondo competitions,\
        \ but is not common traditionally. It is similar to a Roundhouse kick, but\
        \ with a backwards sweep once the foot is extended. The intended impact on\
        \ the opponent with this kick is meant to be the heel of the kicking foot.\
        \ Mikey Reverse Hook.gif * Flying Side Kick: A Flying Side Kick is a variation\
        \ of a Side Kick. It is usually performed by taking a step and jumping off\
        \ the non-kicking leg then performing the Side Kick in mid-air. Mikeyflyingkick.jpeg\
        \ MMA: *Ground and pound: A fighting style, primarily in mixed martial arts,\
