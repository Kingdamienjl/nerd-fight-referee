    - field: intelligence
      value: "Extraordinary Genius (Leonardo is renowned primarily as a painter. Two\
        \ of his works, the Mona Lisa and The Last Supper, are the most famous, most\
        \ reproduced, and most parodied portrait and religious paintings of all time,\
        \ their fame approached only by Michelangelo's Creation of Adam. Leonardo's\
        \ drawing of the Vitruvian Man is also regarded as a cultural icon. He also\
        \ managed to decode Alta\xEFr Ibn-La'Ahad's highly-encrypted Codex pages within\
        \ mere seconds and uncovered several advanced inventions with the help of\
        \ the Apple of Eden without any problems, and thus should have knowledge somewhat\
        \ on par with Alta\xEFr himself. Only around fifteen of his paintings survived,\
        \ due to frequently disastrous, experimentation with new techniques, and his\
        \ chronic procrastination. Nevertheless, these few works and his notebooks\
        \ are an invaluable contribution to later generations of artists. Indeed,\
        \ Leonardo could arguably be considered the most iconic artist of the Italian\
        \ Renaissance, with only a handful of his contemporaries (most notably Leonardo's\
        \ chief artistic rival and fellow Florentine, Michelangelo) posing a real\
        \ challenge. Leonardo was also revered for his technological ingenuity. He\
        \ conceptualized a helicopter, a tank, concentrated solar power, a calculator,\
        \ the double-hull, and outlined a rudimentary theory of plate tectonics. As\
        \ a scientist, he greatly advanced the state of knowledge in the fields of\
        \ anatomy, civil engineering, optics, and hydrodynamics, and thanks to the\
