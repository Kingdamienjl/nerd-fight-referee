  intelligence:
    text: Gifted combatant (Highly adept at stealth, subterfuge, and misdirection.
      Additionally, he is well-versed in the use of combat martial arts. His fighting
      style seamlessly blends attacks with any part of his body and weaponry. Along
      with these abilities comes a propriety for assassination techniques. Can defeat
      numerous Foot Elite, robots, aliens and even Raphael with nunchakus. Although
      not shown as particularly focused on ninjutsu, preferring to spend his time
      reading comics or watching movies or practicing his skateboarding, Michelangelo
      is quite an effective fighter, he beat Raphael in a fight. He's not as smart
      as his brothers, but he often surprises those around him by exceeding their
      expectations, even demonstrates quick wits and intelligence, aiding his allies
      and brothers with decisive ideas. Eats the weirdest pizzas on the planet (Tuna
      fish, peanut butter and grape jelly anyone?))
    source_ids:
