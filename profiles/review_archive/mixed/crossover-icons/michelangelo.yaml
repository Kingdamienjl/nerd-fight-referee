  attack_potency:
    text: Small Building level+ (Should be comparable to Leonardo. Considered as one
      of the greatest fighters in the multiverse) | At least Town level (Wields the
      "Inazuma" nunchakus, which should be comparable to Raphael's "Banrai", which
      can shatter mountains) | At least Planet level+, possibly Large Planet level
      (Next to Donny, Michelangelo arguably has the most control over his Chi Empowered
      form. Traded blows and even defeated members of the Mystic Warriors on multiple
      occasions) | Large Planet level (Contributed to the temporary defeat of the
      Tengu Shredder in his Dragon Form)
    source_ids:
    - mediawiki-michelangelo
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Supersonic (Comparable to the other turtles who can easily outrun missiles.
      He has been noticed as the fastest and quickest turtle of the team), with Massively
      Hypersonic+ reactions (Can react to attacks from the Justice Force members such
      as the Silver Sentry who was mind-controlled to kill him, and Sentry and the
      other Justice Force members are capable of travelling at this speed. He has
      dodged and reacted to electricity) | Massively Hypersonic+ (Should be far faster
      than his base form. Is equal to Chi Empowered/Mystic Raphael and Donatello who
      can easily one-shot a Boulder Monster who can easily defeat the Silver Sentry.
      Can easily traverse mountains on foot. Is comparable to Hisomi-Shisho, who can
      traverse 200 yards in just a second) | Massively Hypersonic+ (Far swifter then
      Chi Empowered/Mystic Michelangelo. Alongside with the other Chi Empowered/Mystic
      turtles fought against and moved faster than Tengu Shredder could react)
    source_ids:
    - mediawiki-michelangelo
