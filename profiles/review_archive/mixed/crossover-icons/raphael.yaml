    - field: weaknesses
      value: 'He easily panics after being attacked with a rider. Notable Attacks/Techniques:
        Swallow: Yoshi catches enemies with his long adhesive tongue and swallows
        them to either turn them into an egg or devours them completely. Egg Throw:
        Yoshi will pinpoint his target and throws either his signature Yoshi Eggs
        to attack enemies or Yarn Balls to restrict them. The eggs occasionally shown
        to have ricocheting, explosive, and homing capabilities. Mega Eggdozer: Yoshi
        will throw a gigantic heavy egg across large distances. It has an even heavier
        variant called Metal Eggdozer. These eggs are powerful enough to hurt Bowser
        in his giant form. Egg Roll: Yoshi encases himself in an egg, which can be
        used for defense and protection, and rolls at his opponents at high speed.
        He has a variant where the egg he encases himself in is several times larger
        than his size and can bury the opponents he bulldozes. Ground Pound: Yoshi
        slams his rear end on the ground with great force, which can cause many results
        such as creating shockwaves. Rainbow Flutter: Yoshi will use his signature
        Flutter Jump technique and either strike the target or throw a projectile
        which leaves a rainbow trail. The latter action will make two projectiles
        during the process. Foot of Fury: Yoshi''s Super Strike. After being surrounded
        by yellow and green sparks and rings, he then kicks the target with energy.
        Magic Weapon: Yoshi forges a weapon of pure energy in shape of a hockey stick.
        It''s only seen in Mario Sport Mix in a fight against the Behemoth. Badges:
        Yoshi can use a variety of badges that can grant him special abilities such
        as making his ground pound stronger, unlimited fire and ice watermelons, and
        immunity to fire and lava-based attacks and obstacles. Transformations: Yoshi
        has a variety of transformation he can utilize: *Super Dragon Yoshi: Yoshi
        will grow wings and gains the ability to breath explosive fire. This is also
        used as a Mega Strike where it has re-entry force and in Super Mario World,
        it can create earthquakes. *Mega Yoshi: Similar to Mega Mario, Yoshi will
        grow into gigantic proportions, becomes invincible, and breaks almost anything
        for a limited time. *Super Happy Yoshi: A transformation gained after eating
        a Heart Fruit. Super Happy Yoshi is invincible, stronger, faster, and has
        a longer tongue for a limited time. *Golden Flutter Wings: A power-up that
        grants Yoshi flight and invincibility with no time limit.'
      source_id: character-stats-profiles-raphael-mixed
      provider_id: character_stats_profiles
      authority: high
