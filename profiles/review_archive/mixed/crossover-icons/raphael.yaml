    - field: intelligence
      value: Genius, became an S-rank magician at a young age, surpassing in power
        even other S-rank magicians. Has studied the Evil Gods and copied numerous
        grimoires for her Grim Bullet spell. Said to have mastered at least 500 sorceries.
        Came up with the tactics that the human and fairy alliance used to defeat
        the army of angels, and she quickly figured out a way to defeat Raphael and
        his Last Fantasia spell. Managed to copy Homura's Teleport spell that she
        only saw once to avoid a lethal attack
