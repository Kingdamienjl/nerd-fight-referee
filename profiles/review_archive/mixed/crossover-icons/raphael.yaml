    - field: weaknesses
      value: "Normal human weaknesses, Grim Bullet requires a long chant and can be\
        \ interrupted as she manufactures the bullet | Cannot freely use Teleport,\
        \ as it taxes her mind a lot Notable Attacks/Techniques: *Sorceries: As an\
        \ S-rank magician Sumika is an expert at using sorceries. She's stated to\
        \ have mastered at least 500 sorceries. **Photon Bullet (Magical Light Bullet):\
        \ 1st Grade non-elemental sorcery. A small energy bullet created by magic,\
        \ the most basic of sorceries. The speed of these bullets is usually below\
        \ regular bullets, but they compensate by allowing the magician to control\
        \ them mid-flight to chase and intercept enemies. **Barriers: Like other magicians,\
        \ Sumika is capable of deploying magic barriers to protect herself. ***Protection\
        \ (Barrier Expand): 1st grade, non-elemental sorcery. A basic personal magic\
        \ barrier intended to be used against physical attacks. **Flashbang (Flash):\
        \ 1st grade, non-elemental sorcery. This sorcery creates a bright flash of\
        \ light to temporarily blind the enemy. **Aero Step (Wind Walk): 2nd grade,\
        \ wind element sorcery. Creates an air current under the caster's legs, allowing\
        \ them to move at high speed. **Evil Tempest (Black Dragon\u2019s Sword Wing\
        \ Storm): 5th grade, wind element sorcery. Summons a spiral vacuum storm to\
        \ carve apart the enemy. **Ancient Zero (Flame of Origin): 5th grade, fire\
        \ element sorcery. This sorcery creates a bright fireball much like a miniature\
        \ sun to burn the enemy. This sorcery can be attached to projectiles such\
        \ as bullets or even compressed into the caster's fist for a melee attack.\
        \ **Unknown Ice Sorcery: Sumika can use ice sorcery to freeze a path and slide\
        \ over it. **Unknown Spatial Sorcery: An unnamed sorcery used by Sumika that\
        \ twists space so that the enemy cannot approach the caster, no matter how\
        \ much they run. **Space-time Bend: 3rd grade, dimension element sorcery.\
        \ This sorcery twists space in front of the caster so that any incoming objects\
        \ can't move straight, thus directing them away from the caster. **Explosion\
        \ Sorcery: Unnamed sorcery that creates an explosion. **Healing: Sumika knows\
        \ healing magic. **Acceleration Magic: Sumika knows magic that boosts her\
        \ speed. **Flesh Hardening: A sorcery used to strengthen the user's body against\
        \ physical attacks.h **Alchemy: Sumika knows how to use magic to create bullets\
        \ for her revolvers. **Healing: Though not skilled at using it, Sumika is\
        \ capable of using basic healing sorceries to speed up the healing of a wound\
        \ by accelerating the target's cell division. **Material Transference: A sorcery\
        \ that automatically reloads Sumika's revolvers. **Reverse Spell (Supplementary\
        \ Chant Channel): Performing chanting while also speaking normally by mixing\
        \ magical musical scales inside casual words, a magician\u2019s super high-class\
        \ technique that allows Sumika to hide the chant of a sorcery inside common\
        \ words directed at her enemy. **Dual Spell (Overlapping Aria): A super advanced\
        \ skill that less than five magicians can use, allowing the user to recite\
        \ two chants at once. *Air Raid: Special equipment given to magicians. Taking\
        \ the form of four fairy-like wings on their back, it allows magicians to\
        \ fly. *Heroic Spirit Contract: As a Heroic Spirit User, Sumika has used necromancy\
        \ to establish a contract with the soul of a powerful hero, thus borrowing\
        \ some of their power in the form of one or multiple Hero Skills. Sumika has\
        \ a contract with the Billy the Kid. **Quickdraw: Sumika's first Hero Skill,\
        \ the representative quickdraw of Billy the Kid. This skill allows instantaneous\
        \ firing of three bullets by pulling the trigger once. Additionally, the bullets\
        \ are wrapped in a curse of absolute hit that manipulates cause and effect,\
        \ making it so [shooting] = [hit]. These bullets can be shot down by another\
        \ attack that manipulates causality, though they can similarly be used to\
        \ counter that kind of attack. **Back Sniper (Instinct Evasion): Sumika's\
        \ second Hero Skill, associated with Billy the Kid\u2019s legend that said\
        \ that he shot to death enemies behind him without even turning back. The\
        \ skill's effect is [Perfect invalidation of blind spot]. The contractor becomes\
        \ able to detect all dangers that come from blind spots with 100% accuracy\
        \ using instinct. The skill foresights cause and effect, so it will even warn\
        \ Sumika of attacks like Lily's Gae Bolg that manipulate causality and allow\
        \ her to deploy a barrier to block them. While usually 100% accurate, Sumika\
        \ might be slow to react to the warning if she has just gone through a tough\
        \ fight and her senses are dulled. *Grim Bullet (Demon Book Assassin Bullet):\
        \ The special technique developed by Sumika because of her idolization of\
        \ Homura that gave her her S-rank nickname. In order to use it, Sumika first\
        \ needs to summon a binder containing several hundred paper pages that hold\
        \ copies of grimoires. By selecting the pages related to a specific grimoire\
        \ and Evil God, Sumika can then perform a chant and summon a portion of the\
        \ Evil God's power in the shape of a bullet. **Celaeno Fragme"
