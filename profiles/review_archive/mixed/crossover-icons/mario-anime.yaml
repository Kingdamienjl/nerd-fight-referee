        by jumping around through different karts, and when he''s seen to be more
        accustomed to maneuver himself around the Mushroom Kingdom as he fights a
        group of Bowser''s minions; or while also navigating himself against the Banzai
        Bill), Sheer Will (Despite getting casually getting beaten by Donkey Kong,
