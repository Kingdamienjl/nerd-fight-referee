        Fire: What this reptilian tyrant is known for. It is Bowser''s signature attack
        and he is able to make use of this with a multitude of diverse applications:
        *Fire Breath: Bowser''s signature attack and probably the most skilled fire
        breather in the series as he is able to breathe fire in various ways. Bowser
        will breathe fire either in large streams or individual large fireballs. He
        also uses this move to make a fiery rain and breath different colored fire
        that has unique effects such as breathing blue fireballs that homes onto his
        target. Bowser have occasionally shown to be even embed his physical attacks
        such as claw swipes and tail whips with fire. *Fire Storm: Bowser breathes
        a large stream of fire that acts as a whip. Hitting opponents with it cause
        them to be cloaked in fire, run uncontrollably, and reverse their normal movements.
        *Fire Breath Barrage: Bowser''s Special Shot in Mario Tennis Aces. First,
