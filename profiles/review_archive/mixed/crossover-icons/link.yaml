        \ power bracelet only lasts 10 minutes. Feats: *Threw his shield so hard that\
        \ it flew all the way out of the Underworld before stopping, even with Link\
        \ and Zelda standing on it (Underworld Connections). *The Crissword has sliced\
        \ several Hylian weapons in half, which should be superior to human weapons\
        \ (Stinging a Stinger). *Once defeated Ganon using nothing but bees just because\
        \ the Triforce of Wisdom told him to (Stinging a Stinger, though this is likely\
        \ PIS). *Held on to a rampaging Octorok for a long while until someone helped\
        \ him out (The White Knight). *Yelled so hard from a bottom of a lakebed that\
        \ the entire lake shook (Underworld Connections). *Made Spryte infatuated\
        \ just by looking at him. *Link\u2019s feet can hold his entire body weight\
        \ for an extended period of time. *Just after waking up he can easily blitz\
        \ and overpower many Moblins, who are stronger than Hylians, who are stronger\
        \ than humans; claims he can kill 15 of them at once. *Defeated multiple Tinsuits,\
        \ who can casually destroy heavy stone walls, and did not use his sword while\
        \ doing so (The White Knight). *Fell a distance many times higher than the\
        \ North Castle itself, so high that Zelda's wheelbarrow she put under him\
        \ exploded upon him hitting it, which he then easily shook off (Sing for the\
        \ Unicorn). *Deflected a wall busting blast while greatly injured (The White\
        \ Knight). Note: There are some that argue in this episode the reason Link\
        \ avoids his sword blast is because he continually forgot about being a spirit,\
