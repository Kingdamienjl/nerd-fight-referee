    - field: weaknesses
      value: 'Goku cannot breathe in space. Tends to hold back to gauge his opponents
        power and have an exciting fight, although he will go all out if needed. Notable
        Attacks/Techniques: * Martial Arts: Goku is a master martial artist who has
        learned from many of his universe''s greatest teachers, from his adoptive
        grandfather, Grandpa Gohan, Master Roshi, Korin, Kami, King Kai, and even
        Whis. ** Crazy Fist: A technique meant to distract and confuse an opponent,
        in which Goku acts like a wild, frenzied dog or monkey before striking his
        opponent while they''re caught off guard. ** Dragonthrow: Goku''s signature
        grapple, in which he grabs his opponent by the arm, tail, or antenna, and
        then spins them around before throwing them away. ** Eight-Arm Fist: A technique
        used to counter Tien Shinhan''s Four Witches Technique and copied from King
        Chappa, in which Goku moves his arms so fast that he appears to have eight
        of them. ** Rock, Scissors, ''N'' Paper: Goku''s initial signature technique,
        taught to him by his grandfather. After yelling "Jan Ken", Goku then follows
        up with either a strong punch (rock), a poke to the eyes (scissors), or an
        open palm strike (paper). * Ki: The fighting power and life force of a martial
        artist, a tangible energy derived from the user''s vigor, courage, and mind.
        It can be used in a number of ways, such as to surpass the limits of one''s
        body to greatly increase in strength, and it can be fired as blasts of energy
        or used to create defensive barriers. Along with his Saiyan blood, Ki acts
        as the source of Goku''s incredible power and abilities. Goku''s prodigal
        skill in combat and the use of ki allows him to replicate the ki techniques
        of others after seeing them only once. After becoming a Super Saiyan God,
        Goku gained divine ki, which can only be sensed by other gods. ** Kamehameha:
        Goku''s famous signature technique, which he learned after witnessing Master
        Roshi use it to extinguish the flames on Fire Mountain, successfully replicating
        it not long later on his first try. As his signature technique, it is something
        that Goku has used on many occasions, and he has created a number of variations
        over the course of his fighting experience, such as firing it from his feet,
        using it to propel himself into the air, and bending it mid-flight to catch
        opponents by surprise. Perhaps the most useful variation is the Instant Kamehameha,
        in which Goku uses Instant Transmission to teleport just before firing the
        attack, appearing right in front of his opponents and giving them no time
        to dodge. As of the Tournament of Power, Goku has once again used this technique
        in a new way, as a barrier against other attacks. ** Instant Transmission:
        A teleportation technique that Goku learned between the Frieza and Cell Sagas
        on the planet Yardrat, which allows him to lock onto the ki signatures of
        others and teleport to their locations. Its use takes some concentration,
        which is aided by Goku putting his index and middle fingers to his forehead
        (He has also shown to teleport without placing his fingers), and he needs
        a ki signature to teleport to, otherwise he cannot perform the technique.
        It can be used to teleport others as well, as long as they are in physical
        contact with Goku. ** Kaioken: A technique developed by King Kai and taught
        to Goku during his time training on his planet. It greatly increases Goku''s
        ki for just a moment, boosting his strength and speed significantly for that
        time. However, this heavily strains his body, and if he overuses it, it will
        leave him in intense pain all over his body, leaving him incapable of moving
        without causing himself further pain. Initially, the strongest Kaio-ken Goku
        can utilise is x4, but by the time of the Frieza Saga, he has mastered its
        use, allowing him to push it to his maximum of x20. After mastering Super
        Saiyan Blue, which required perfect ki control and a calm mind, Goku became
        capable of using Kaio-ken alongside this transformation, first pushing it
        to x10, and then x20. ** Genki Dama (Spirit Bomb): Goku''s ultimate attack,
        taught to him by King Kai, performed by gathering a vast amount of energy
        from all the lifeforms in his surroundings to create a massive, incredibly
        destructive sphere of ki. To use it, one must have a pure heart, and so Goku
        is a perfect user of the technique due to his obliviously innocent nature.
        While it is incredibly powerful and can prove capable of completely destroying
        an opponent when used with sufficient power, it takes a very long time to
        charge and is therefore very difficult to use, though the charge time can
        be sped up by gathering energy from those who willingly and knowingly provide
        it. ** Kiai: The ability to project an invisible burst of force with ki, which
        Goku can perform with his hands and even with a glare. ** Kienzan (Destructo
        Disk): Krillin''s signature technique, which Goku presumably copied from him.
        Raising his hand above his head, Goku creates a razor-sharp disc of ki with
        incredible cutting power, and then throws it at his'
