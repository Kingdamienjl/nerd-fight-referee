    - field: intelligence
      value: 'Gifted, possibly Genius (Due to his decelerated aging, Dredd has amassed
        a lifetimes worth of skill and experience, being on the force for nearly 50
        years, with 15 years of training prior even to that. Due to his almost superhuman
        commitment to the law, his knowledge on legal matters in MC1 is unmatched,
        being able to recite and memorize even the most obscure laws and legal procedures.
        In addition, Dredd has been shown to be an expert manipulator and can completely
        change his demeanor on the fly. Dredd can just tell when someone is up to
        no good2000 AD #205 and if someone is evil or good by their eyes2000 AD #181)
        Standard Tactics: Contrary to popular belief, Dredd actually hates killing2000
        AD #169 and actively avoids doing so,Judge Dredd Megazine #6as he strictly
        obeys the law regarding what gets the death penalty. He also holds back in
        hand-to-hand combat, practicing extreme self-control. Regardless, he has been
        shown many times to be willing to kill if he has no other choice or if his
        opponent qualifies for the death penalty. He also does not torture or use
        excessive force,2000 AD #195 but will manipulate and lie. Despite his loyalty
        to the law and system, he does not have blind trust in authority figures.
        In terms of fighting, Dredd is primarily a gunman, but is expertly trained
        in martial arts and acrobatics as well, and will use those skills without
        hesitation. Note: This page covers Dredd as he appears in 2000 AD and related
        publications by Rebellion, IPC, and Fleetway. Since the novels and radio plays
        build from this canon, they are also considered canonical. This does not cover
        the 1995 or 2012 films, or the DC or IDW series, as they are separate continuities.
        The series, Lawman of the Future and Heavy Metal Dredd are not generally considered
        canon due to their wildly different takes on Dredd as a character. The Dredd/Batman
        crossovers are considered canonical stories in the Dredd mythos. Additionally,
        they are written by John Wagner and Alan Grant, two writers who have hundreds
        of writing credits for both Batman and Dredd stories. Similar to the Dredd/AVP
        crossovers, as they are listed in the official Judge Dredd timelines. The
        IDW Dredd vs Alien vs Predator is canon to both the IDW continuity and the
        main continuity as it references the events of the older stories.'
      source_id: vsbattles-optimus-prime-crossover-icons
      provider_id: vsbattles
      authority: high
