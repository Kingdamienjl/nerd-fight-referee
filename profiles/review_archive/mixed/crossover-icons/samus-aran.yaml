    - field: intelligence
      value: 'Genius. Designed the gunship she uses in Metroid Prime 3, combining
        both Federation and Chozo technologyMetroid Prime 3: Corruption (2007) - Logbook,
        Hunter-Class Gunship. Won an infamous inter-planetary spaceship race through
        the hardest course in the galaxy, against some of the galaxy''s most skilled
        pilots, despite all of them being out to kill her, her ship being sabotaged
        and the top competitor being armed with her Speed BoosterSamus and Joey: Metroid
        Extreme (2004) - Chapter 5. Hijacked and learned how to pilot a Space Pirate
        ship in secondsMetroid: Zero Mission (2004) - Ending. *Combat Skill: Even
        by her first game outing, Samus was thought to be the greatest bounty hunter
        in the universeMetroid: Zero Mission (2004) ManualMetroid Prime Trilogy (2008)
        - Art Booklet, a hotly contested title that she has held onto ever since.
        She has saved the galaxy multiple times from otherwise invincible threats
        of various kinds, won the Galactic Federation entire wars with her actions
        and become universally dreaded by the otherwise fierce Space Pirates. **Marksmanship:
        Samus'' suits enhance her aiming capabilities with a targeting systemMetroid
        Prime (2002) - Logbook, Thardus, though she is capable of manually surpassing
        their level of accuracy when neededMetroid Manga (2002) - Chapter 12. Shot
        down two ricocheting bullets out of the air at once to prevent them from hitting
        civilians, from outside of the building, through a saloon doorSamus and Joey:
        Metroid Extreme (2004) - Chapter 1. Even as a teenager, Samus'' aim was good
        enough to rapid-fire disarm an entire group of hostiles without harming a
        single one of themMetroid Manga (2002) - Chapter 2. Shot a large gear she
        flipped into the air, causing it to be launched precisely onto a mechanism
        and locking it in placeMetroid Prime 3: Corruption (2007), Elysia, Powerworks.
        Blasted a foe''s whipping tongue out of the airSamus and Joey: Metroid Extreme
        (2004) - Chapter 2. **Hand to Hand Combat: Samus is a skilled hand-to-hand
        combatant, capable of overwhelming and disarming multiple armed opponentsMetroid
        Manga (2002) - Chapter 13, easily defeating comparable foesSamus & Joey (2002)
        - Chapter 5 and incorporating acrobatic hand-to-hand combat and grappling
        in her fighting styleMetroid: Other M (2010), as well as the ability to perform
        Melee Counters, quick parries that stun the attacking foe for a few seconds,
        even while crouching, in Morph Ball form or in the air. She has also been
        shown to parry attack combosMetroid Dread (2021) - Chozo Soldier Boss Battle,
        halt foes'' attacks or grapple themMetroid Dread (2021) - Corpius Boss Battle
        to give herself an opening to shoot them at point-blank range. **Acrobatics:
        Samus'' Power Suit enhances her natural acrobatic abilitiesMetroid: Other
        M Art Folio, though even without it she can perform incredible feats such
        as quick dodges in any direction, repeating somersaultsMetroid Manga (2002)
        - Chapter 7, wall-jumps and bouncing off several creatures without even making
        contact with the groundMetroid Manga (2002) - Chapter 2. Climbed up Kraid''s
        body on two separate occasions, using her own Power Bomb to boost herself
        up in the first and avoiding several attacks in the secondMetroid Manga (2002)
        - Chapter 15Metroid Dread (2021) - Kraid Boss Battle. Can use the boosters
        on her back to change her momentum in midairMetroid: Samus Returns (2017)
        - Proteus Ridley Boss Battle. Dodged through a rain of a thousand attacksSamus
