  stamina:
    text: 'Superhuman. After being knocked out and infected with Phazon by Dark Samus,
      Samus returned to her senses much faster than the other Hunters she was fighting
      alongside, and managed to activate a device to save the situation she was in,
      despite having just suffered wounds that would leave her in a one-month comaMetroid
      Prime 3: Corruption (2007) - Intro, Norion. After being mind controlled into
      fighting the Federation Force in a long boss battle that ended with her unconscious
      and buried underneath a pile of rubble, Samus woke up, freed herself and returned
      to a combat-ready state in the span of minutesMetroid Prime: Federation Force
      (2016) - Mission 2: Smokestack. After being forced to damage her own suit and
      then withstand several powerful attacks, Samus powered through a comparable
      enemy''s prolonged fire, walking straight through it to deliver a crushing blow.
      Could stand back up and move normally after having her atoms partially destroyedSamus
      & Joey (2002) - Chapter 15. After enduring the process of having her powers
      ripped out of her body, which she described as nearly making her faint and leaving
      her barely able to crawl, Samus managed to gather enough energy for a single
      deadly attack out of her sheer willpowerSamus & Joey (2002) - Chapter 17. Similarly,
      she could gather the power to fight through sheer will after enduring through
      acid powerful enough to seriously damage her suit, leaving her barely able to
      move.'
