    - field: weaknesses
      value: 'Samus'' Thermal and X-Ray visors can be overloaded by massive bursts
        of temperature and energy respectively, forcing her to temporarily switch
        back to another Visor. If Samus'' suit receives incredible damage, it can
        permanently lose access to some of its functions, depowering Samus and requiring
        her to find them againMetroid Prime 2: Echoes (2004) - Samus chases Dark Samus
        into Dark Aether, or even be temporarily disabled altogetherMetroid: Other
        M (2010) - Adam''s sacrifice [cutscene]. Though this isn''t immediately obvious,
        the Screw Attack can be countered by striking along the axis of its rotationSamus
        and Joey: Metroid Extreme (2004) - Chapter 2. Cannot control the blast radiusSamus
        & Joey (2002) - Chapter 1 of her explosive weapons. Notable Attacks/Techniques:
        Standard= {{#tag:tabber|{{!}}-{{!}}Default= *Chozo Blood: Samus was genetically
        modified by the Chozo at a young age, receiving DNA from the Mawkin and Thoha
        clans, respectively donated by Raven Beak and Gray Voice, one of her caretakers
        growing up. This alteration to her genetic make-up grants Samus superhuman
        physical abilities, the ability to suppress of her eventual Metroid powers
        and likely Samus'' clairvoyant abilities. It also enabled Samus to survive
        on Zebes despite its difficult conditionsMetroid Manga (2002) - Chapter 2,
        enduring its acid rains and other inhospitable conditionsMetroid Manga (2002)
        - Chapter 11. *Zero Suit: A form-fitting flexible attire Samus wears beneath
        her Power Suit. While it lacks the innate protection and boosted defenses
        of her general armor, it''s still capable of utilizing Energy Tanks and grants
        Samus extra means of protection when she is unable to access the Power Suit.
        **Paralyzer Pistol: An emergency pistol Samus keeps on hand in case she is
        rendered unable to utilize her usual arsenal. Its main function against stronger
        foes is to stun them for long enough for Samus to disengage safely and while
        it pales in comparison to Samus'' usual weaponry and is relatively harmless
        to her typical foes, it is still capable of powering electrical machinery
        or destroying weaker targets and obstacles. The Paralyzer has infinite ammunition
        and is capable of firing rapidly, but needs to recharge briefly for shots
        to have a paralyzing effect. {{!}}-{{!}}'
