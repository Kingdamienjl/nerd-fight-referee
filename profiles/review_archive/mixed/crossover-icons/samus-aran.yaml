    - field: attack_potency
      value: 'One of Samus'' most iconic and powerful upgrades, the Screw Attack allows
        Samus to surround herself in a field of energy while spin jumping, shredding
        through any opponents in her way while also providing protection, rendering
        her effectively invulnerable. It is powerful enough to easily destroy most
        enemies just by jumping through them. She can also perform this with short
        hops, essentially dashing forwards with a Screw Attack. |-|Suits= * Zero Suit:
        The skintight bodysuit that Samus wears underneath her Power Suit. If she
        has somehow lost access to her Power Suit, Samus instead utilizes this, which
        leaves her unprotected and much more vulnerable. The Zero Suit can also be
        used to manifest and unmanifest her Power Suit. * Power Suit: Samus'' basic,
        signature Power Suit, the lynchpin of her arsenal, properly known as Chozo
        Battle Suit Ver SA1-4468-VM6-P. This refers to both the base Power Suit without
        upgrades, and her suit as a whole and any equipment she may have acquired.
        It is equipped with Oxygen Supply Equipment that allows Samus to survive essentially
        indefinitely in the vacuum of space or underwater, and protects against airborne
        toxins and pollutants, allowing her to survive in inhospitable environments.
        The Power Suit''s modular technology allows Samus to integrate all sorts of
        technology into its construction so that she can amass a powerful arsenal
        of weapons and armor upgrades throughout her adventures, becoming increasingly
        dangerous as she does so. Weapons and ammunition are stored as data until
        they are needed, at which point they are rendered tangible so that Samus can
        fire them. It has advanced energy shielding technology equipped by default
        as well, protecting her from harm. The Power Suit integrates with Samus on
        a biological level, and thus cannot be removed without her cooperation, but
        if she wills it, it will simply disappear in a flash. She can materialize
        it in the same way. At the end of Zero Mission, after passing the Ruins Test,
        Samus gains the Legendary Power Suit, a powerful upgrade to her basic Power
        Suit that she has wielded ever since then. In Metroid Fusion, her Power Suit
        is rebuilt as the Fusion Suit, which has much of the same capabilities but
        is much slimmer and lighter, and, as a result, provides less protection, especially
        against subzero temperatures, which Samus is extremely weak to thanks to her
        Metroid DNA. ** Varia Suit: Samus'' most recognizable suit, the Varia Suit
        protects against extreme conditions such as acid and intense temperatures
        of either extreme, allowing her to safely travel through superhot locations
        such as the depths of Norfair and subzero locations such as Sector 5 in Metroid
        Fusion, overcoming the weakness to cold she had at the time thanks to her
        Metroid DNA. It also increases the strength of Samus'' defenses, greatly reducing
        the damage she takes in combat. ** Gravity Suit: One of Samus'' most effective
        suits, the Gravity Suit allows her to move through environments with abnormal
        gravity and water without being impeded, making her highly resistant to gravitational
        forces. It also further reinforces her defenses and increases her resistance
