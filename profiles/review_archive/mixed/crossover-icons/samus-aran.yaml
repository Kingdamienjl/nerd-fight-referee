        wall-jumps and dashing slides even on slanted groundMetroid Manga (2002) -
        Chapter 6. Shown to use the jets on her back to haltMetroid Dread (2021) -
        Raven Beak ambushes Samus Aran or enhance her momentum when necessary. **Strategy:
