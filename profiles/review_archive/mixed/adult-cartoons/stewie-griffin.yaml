- id: claim-powers-and-abilities-6f432dc2
  section: abilities
  axis: hax
  text: 'Base= * Superhuman Physical Characteristics * Preparation * Genius Intelligence
    * Weapon Mastery (Skilled in using ray guns and normal firearms) * Vehicular Mastery
    (Skilled in driving cars and piloting several types of aircraft) * Toon Force
    * Fourth Wall Awareness * Regeneration (Mid; Seen here) * Martial Arts (Skilled
    in karate) * Broadway Force * Limited Plot Manipulation via cutaways * Energy
    Manipulation with his ray gun * Explosion Manipulation via explosives (Also created
    a bomb that was set to explode if Mort burped) * Fire Manipulation with flamethrower
    |-|With Prep= All previous, plus: * Time Travel * Time Manipulation (By reversing
    the flow of time) * Spatial Manipulation * Physics Manipulation * Reality Warping
    * Cloning * Biological Manipulation (Created a machine that altered his reproduction
    system into that of a female''s. Also switched bodies with Brian) * Dream Manipulation
    (Made a machine that allowed him to travel into other people''s dreams) * Mind
    Manipulation and Mind Control with mind-related devices * Memory Manipulation
    (Can delete people''s memories) * Teleportation (Can teleport to different multiverses
    and timelines) * Size Manipulation (with Shrink Ray) * Precognition (Can see possibilities
    of situations with his simulation goggles) * Weather Manipulation (Controlled
    the world''s weather with the Weather Device so he could destroy broccoli) * Ice
    Manipulation (His Carbonite Freeze Gun froze a security guard solid for 10 years)
    * Soul exchange via Particle Interchange Transport'
