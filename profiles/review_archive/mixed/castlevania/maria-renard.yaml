  axis: equipment
  text: 'Maria Hymn.gif|Hymn Maria Suzaku.gif|Cardinal Maria Byakko.gif|Cat Maria
    Dragon DXC.gif|Dragon Maria Egg DXC.gif|Egg Maria Genbu.gif|Turtle *Hymn: Maria
    Renard sings a melody that allows her to attack enemies with sound alone. *Dove:
    Maria Renard''s signature Animal Spirit. Doves are Holy birds that bring protection,
    and for generations, they have been the symbol of the Renard Family. Maria''s
    doves serve primary offensive purposes, manifesting on her palms and gracefully
    flying to their nearby target, causing light damage. *Cardinal: Maria summons
    vermillion birds of fire which fly from her hands and towards their enemies. Alternatively,
    Maria can summon flaming owls that accompany her and attack her opponents. *Cat:
    Maria summons a small magical cat which runs through the floor, damaging all enemies
    who stand in its way. *Dragon: Maria summons a child dragon that hovers and swoops
    across the environment, plowing through her enemies. *Egg: Maria throws an Egg,
    which hatches in a few seconds and results in the animals to attack upward. *Turtle:
    A defensive ability. Maria summons a turtle shell that rapidly envelops her, protecting
    her from most enemy attacks.'
