- id: claim-powers-and-abilities-f930bf54
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Immortality (Type 4) *Skilled Acrobat\
    \ *Chi Manipulation (Chi is the source of a user's Bending) *Airbending **Flight\
    \ with Airbending *Breath Attack (Can breathe air as well as fire) *Waterbending\
    \ (Any phase of water) *Underwater Breathing (Type 2 in the Avatar State only;\
    \ Type 4 in base and the Avatar State) *Earthbending (Any phase of earth) **Surface\
    \ Scaling and Magnetism Manipulation with Earthbending *Large Size (Type 1 by\
    \ using Earthbending to create a rock golem body) *Lavabending while in the Avatar\
    \ State *Firebending *Electricity Manipulation with Lightning Redirection *Healing\
    \ with Waterbending *Energy Manipulation via Energybending **Life Manipulation\
    \ via Energybending (Can affect another person's life energy to impart them with\
    \ knowledge instantly, remove one's Bending completely, or restore it) **Power\
    \ Nullification with Energybending (Can take away a person's ability to Bend elements)\
    \ **Power Bestowal with Energybending **Soul Manipulation (The process of Energybending\
    \ reaches into the target's soul) **Durability Negation with Energybending and\
    \ asphyxiation **Possible Death Manipulation with Energybending (Once an Avatar\
    \ succeeds at utilizing Energybending, they have multiple options available to\
    \ them, including possibly killing the target.) *Empowerment (Enhanced Firebending\
    \ from Sozin's Comet) *Self-Sustenance (Types 2 and 3) *Statistics Amplification\
    \ (With the Avatar State) *Light Manipulation *Forcefield Creation *Limited Sound\
    \ Manipulation *Extrasensory Perception (Can see spirits and use Toph's seismic\
    \ sense technique) *Astral Projection (Able to go to the Spirit World in the Avatar\
    \ State) *Intangibility & Invisibility (Non-Physical, While as a spirit in the\
    \ physical world) *Regeneration while as a spirit in the Spirit World *Fusionism\
    \ (Able to unite with spirits) *Multiple Selves (The Avatars were all described\
    \ to be part of a single flame)The Shadow of Kyoshi Novel \u2014 Chapter 26 *\
    \ Non-Physical Interaction (Bending can interact with spirits) *Limited Reality\
    \ Warping while in the Spirit World *Limited Attack Reflection *Sealing and Forcefield\
    \ Creation (He can combine all 4 elements together into an elemental sphere, creating\
    \ a barrier from it, and it was originally used by Wan to seal Vaatu away in the\
    \ Tree of Time The Legend of Korra Book Two: Spirits - Beginnings, Part 2; The\
    \ Avatar also naturally has the ability to seal entrances shut without being able\
    \ to be accessed, as seen hereATLA Book One: Water - Winter Solstice, Part 2:\
    \ Avatar Roku) *Possible Clairvoyance (Should be capable of witnessing events\
    \ in the future like his past lives could, similarly to how Roku informed him\
    \ about the return of Sozin's comet) |-|La-fusion= All previous abilities plus:\
    \ *Large Size (Type 2) *Regeneration (Can reform by absorbing more water) *Element\
    \ Intangibility (Type 3) *Inorganic Physiology (Type 1; composed of light and\
    \ water) *BFR (La imprisoned Zhao in the Fog of Lost Souls) |-|Resistances= Resistance\
    \ to *Blood Manipulation and Body Puppetry (Baseline while in base; to an unknown\
    \ degree while in the Avatar State. Was able to resist Bloodbending on Yakone's\
    \ level) *Power Nullification *Poison Manipulation while in the Avatar State *Memory\
    \ Manipulation, Illusion Creation, Fear Manipulation, Madness Manipulation, Soul\
    \ Manipulation (3 layers), and Mind Manipulation (By Yangchen's time, Avatars\
    \ could withstand the effects of the Fog of Lost Souls.) *Temperature Manipulation\
    \ (Airbenders can use their breathing to resist cold temperatures)"
