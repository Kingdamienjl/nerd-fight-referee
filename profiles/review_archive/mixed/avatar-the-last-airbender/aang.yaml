- id: claim-weaknesses-8eb554e4
  section: weaknesses
  axis: weakness
  text: 'Is a pacifist by nature, refuses to take a life and is often overly forgiving
    unless friends'' lives are endangered. While he greatly surpasses most Benders,
    he still has some limits, he needs earth to earthbend and water to waterbend.
    The solar eclipse disables his firebending and the lunar eclipse disables his
    waterbending. He has not fully learned to metalbend and must perform martial arts
    to bend the material. Notable Attacks/Techniques: *Air Scooter: Aang can create
    and ride a ball of air with his Airbending. *Water Whip: Aang can create water
    whips by Waterbending, and secluding his arms in water. *Seismic Sense: After
    being taught this by Toph, Aang is able to sense all movement on the ground allowing
    for a radar of sorts. *Earth Armor: This technique allows Aang to coat his entire
    body (excluding his eyes) in a layer of earthly armor, and can even do it with
    crystal. *Avatar State: Aang taps into the cycle of reincarnation, and gains the
    accumulated knowledge, skill and experience of countless previous lifetimes. In
    addition, it dramatically augments the power of his Bending, allowing him to perform
    feats of power that would require multiple master level Bender to replicate. However,
    if he''s killed in this state, the cycle of reincarnation is permanently broken.
    *Air Shield: In his Avatar state, he can conjure an omni-directional sphere of
    condensed air. This air shield protects him from melee attacks as well as elemental
    attacks. It also levitates Aang and allows him to fly at high speeds. ==References==
    ==Notable Matchups== Victories: Losses: Po (Kung Fu Panda) Po''s (Kung Fu Panda)
    Profile (Season 3 Aang and Kung Fu Panda 4 Po were used. Anything above 7-C was
    restricted. Fight takes place in the Jade Palace Arena. Speed was equalized) Inconclusive:
