- id: claim-standard-equipment-67006914
  section: equipment
  axis: equipment
  text: '*OOO Driver: A transformation belt with three slots for three Core Medals:
    The right for a Head Medal that forms the helmet, the middle for an Arm Medal
    that forms the torso armor and gauntlets, and the left for a Leg Medal that forms
    the waist and leg armor. With the exception of Putotyra Combo, Burakawani Combo,
    and Super Tatoba Combo, OOO has access to about 125 interchangeable combinations
    with the 15 basic Core Medals at his disposal. *Core Medals: Seven sets of coins
    were created long ago by alchemists for a king who desired to rule the world,
    five of the sets were used to create homunculi called Greeed who become sentient
    beings when one coin from each set was destroyed. These coins, divided by three
    sets of Head, Arm, and Leg, work with the OOO Driver to enable OOO to assume his
    combo forms. The six sets are categorized by color: Ankh''s red bird-theme Core
    Medals, Kazari''s yellow feline-themed Core Medals, Gamel''s grey beast-theme
    Core Medals, and Mezool''s blue sea animal-themed Core Medals *Medagabryu: Putotyra
    Combo''s primary weapon, able to between Axe Mode and Bazooka Mode and able to
    shatter Core Medals.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-5ed32735
  section: power_scale
  axis: battle_iq
  text: At least Above Average normally, Gifted in combat (Said to have all of Eiji's
    memories, although he appeared to lack a true understanding of his character.
    Easily defeated Uva)
  source_ids: *id003
  decisive: false
  status: unverified
