- id: claim-weaknesses-6a30012e
  section: weaknesses
  axis: weakness
  text: Eiji was eventually shown to stop Goda from moving his body, preventing him
    for carrying out his goals. | Same as before. However, Goda discarded Eiji's body
    in his Rider form when this became a problem, and could still fight.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-7418f063
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Multiple Selves (Type 1, 2, and 3;
    However, Eiji will struggle for his body) *Martial Arts *Weapon Mastery *Acrobatics
    *Vehicular Mastery *Accelerated Development (Learned to control OOO''s powers
    within minutes) *Transformation *Enhanced Senses (He can sense the King''s presence)
    *Inorganic Physiology (Type 2) (The Greeed body is made of Cell Medals, thus lacking
    any organic parts) *Immortality (Type 1, 3, and 8; Should a Greeed be destroyed,
    they can still be revived as long as their main Core Medals remains intact) *Absorption
    (Greeed can consume Cell Medals to become stronger as well as heal themselves)
    *Regeneration (Varies, depending on how many Cell Medals one has, Low-High at
    most) (Greeeds can regenerate from a single Core Medal if they have enough Cell
    Medals) *Creation (As a Greeed himself, Goda can create Yummies. He never demonstrate
    this ability, though]) *Body Control (Goda hypothetically can turn his body into
    a mass of Cell Medals, then reform it back to his original state. Giving him some
    form of regeneration as long he has enough Cell Medals in his body) *Possession
    (If a Greeed''s body is destroyed but the Medal containing its consciousness remains
    the Greeed is able to act autonomously and possess human bodies) *Resistance to
    Perception Manipulation (The Greeed''s lack of proper senses, resulting in bleak
    sensory input (e.g., colors are washed out, taste is nonexistent, sounds are muffled
    and distorted) and Soul Manipulation (Greeeds are the beings made from a mass
    of Cell Medals, which are nothing but crystalized "desires" and have no soul of
    their own. Their consciousness is held inside the Core Medals, which act as their
    prime power source) All previous abilities, and should possessed all of OOO''s
    and the Greeeds'' powers and abilities as he absorbed all of their medals, including:
    *Explosion Manipulation (His attacks have a tendency of causing explosions) *Regeneration
    (Mid-Low) *Damage Reduction *Summoning (As he absorbed the purple medals, he should
    be able to summon the Medagabryu) *Energy Projection (The Medagabryu allows him
    to perform the Strain Doom blast) *Void Manipulation (The Medagaburyu Axe has
    the ability to damage, if not completely destroy, the Core Medals of the other
    Greeed. The Core Medals themselves are forms of artificial life and manifestations
    of desire. The Purple Core Medals are antithesis to and can completely erase other
    Core Medals) *Enhanced Senses *Duplication *Statistics Amplification *Forcefield
    Creation and Energy Manipulation *Electricity Manipulation *Light Manipulation
    *Higher Heat Manipulation *Statistics Amplification *Damage Reduction *Heat Manipulation
    *Stealth Mastery *Water Manipulation *Underwater Breathing *Sound Manipulation
    *Animal Manipulation *Statistics Amplification *Forcefield Creation and Energy
    Manipulation *Fire Manipulation *Durability Negation *Body Control *Flight *Regeneration
    Negation *Purification (Type 1) and Attack Reflection *Surface Scaling *Limited
    Self-Sustenance *Extrasensory Perception *Gravity Manipulation and Earth Manipulation
    *Homing Attack *Elemental Intangibility *Berserk Mode *Statistics Amplification
    *Ice Manipulation *Limited Durability Negation *Vibration Manipulation *Enhanced
    Senses *Elasticity *Transmutation and Deconstruction (Has King OOO and Gamel''s
    abilities, which can instantly turn organic and inorganic materials into a pile
    of Cell Medals through touch alone) *Air Manipulation *Resistance to Temperature
    Manipulation, Empathic Manipulation and Mind Manipulation, Heat Manipulation,
    Electricity Manipulation, Transmutation and Deconstruction'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
