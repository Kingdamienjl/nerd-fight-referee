  section: abilities
  axis: hax
  text: "*Kamen Rider Physiology **Superhuman Physical Characteristics **Transformation\
    \ with Tuning Fork Onkaku **Weapon Mastery (Skilled at wielding taiko drumsticks\
    \ and swordplay. Capable of using the Ongekikan Reppu as effectively as IbukiKamen\
    \ Rider Hibiki; Episode 46. Praticed both Ongekikan and Ongekigen in the past\
    \ and was able to master themKamen Rider Hibiki; Episode 24Kamen Rider Zukan;\
    \ Kamen Rider Hibiki) **Vehicular Mastery (Despite previously being a poor driver,\
    \ his special motorcycle training allowed him to mastered the GaikaKamen Rider\
    \ Hibiki; Episode 19Kamen Rider Zukan; Gaika) **Martial Arts (Stated to be excellent\
    \ in TaijutsuKamen Rider Official Perfect File. Matched Kasha in combat who is\
    \ a master of Taijutsu) **Non-Physical Interaction (Oni are able to interact with\
    \ Zanki after he uses the Soul Return Technique to restore his spirit and return\
    \ aliveKamen Rider Hibiki; Episode 45Kamen Rider Zukan; Soul Return Technique)\
    \ **Acrobatics (Possessing superior strength and flexibility over average humans,\
    \ Oni can perform feats of incredible agility. Stated to have outstanding athleticism\
    \ and has climbed sheer cliffs and jumped over valleys with a single ropeKamen\
    \ Rider Heisei vol. 6 Kamen Rider Hibiki MookKamen Rider Hibiki; Episode 23) *Fire\
    \ Manipulation (Capable of using Oni fire power even when not transformedKamen\
    \ Rider Hibiki; Episode 47) *Supernatural Willpower (In order to transform into\
    \ an Oni, they must push their bodies and minds to their limits through hard training\
    \ and endure severe physical and mental exhaustion to maintain their transformationKamen\
    \ Rider Zukan; Oni. In summer, Hibiki have even tougher training to use Kurenai\
    \ form, which places heavy strain on his entire body's musclesKamen Rider Zukan;\
    \ Kamen Rider Hibiki Kurenai) *Possibly Non-Standard Breathing (Type 2; Possibly\
    \ scaling to Kabuki who was able to breathe underwaterKamen Rider Hibiki And The\
    \ 7 Senki: The Movie) *Preparation (Either before or after encountering a Makamou\
    \ or it's Douji and Hime, Hibiki will send out the Disk Animals to collect information\
    \ of his opponents and analyze how to fight themKamen Rider Hibiki; Episode 3)\
    \ *Extrasensory Perception (Oni are capable of sensing evil presence of the Makamou,\
    \ the Man and the WomanKamen Rider Hibiki; Episode 20Kamen Rider Hibiki; Episode\
    \ 26Kamen Rider Hibiki; Episode 27. Sensed the Yoroi Tsuchigumo over a distance\
    \ before it could appearKamen Rider Hibiki; Episode 29) *Aura (Radiate redish\
    \ aura when he's training to obtain Kurenai Form) *Stealth Mastery (Appeared behind\
    \ Asumu and Chizu without making any noiseKamen Rider Hibiki; Episode 1) *Accelerated\
    \ Development (Training\u3010Physical Statistics & Abilities\u3011; Stated to\
    \ be the fastest person to become an Oni in history, despite not studying under\
    \ any specific master. Instantly mastered the Gaika bike after having special\
    \ motorcycle training. Every summer, he trained both his body and mind even harder\
    \ to acquire the ability to transform into Hibiki Kurenai. After losing the ability\
    \ to transform into Oni, Hibiki underwent special training to the utmost limit\
    \ to be able to use the Armed SaberKamen Rider Zukan; Kamen Rider Armed HibikiKamen\
    \ Rider Zukan; Sound Attack Amplification Sword Armed Saber, which took him a\
    \ few days, while Shouki and Danki required nearly a month to regain their transformation\
    \ ability. Hibiki is also able to learn many new special moves and battle techniques\
    \ through training. Oni are said to get stronger over timeKamen Rider Hibiki;\
    \ Episode 30 which allows them to defeat Armored Douji and Hime, who previously\
    \ stomped HibikiKamen Rider Hibiki; Episode 11Kamen Rider Hibiki; Episode 11)\
    \ *Power Nullification (The tuning fork vibration is capable of nullifying optical\
    \ camouflage and removing invisibilityThe Hibiki Situation)"
