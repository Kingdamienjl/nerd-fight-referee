    - field: powers_and_abilities
      value: 'Transformation with Buggle Driver II, Stealth Mastery (Masamune was
        able to slip through tight security and steal a briefcase of Proto Gashats
        that the Ministry of Health had kept), Hand to Hand Combat, Social Influencing
        (He was able to reclaim his job as CEO of Genm Corp and tricked the public
        into purchasing Kamen Rider Chronicle to boost sales), Deconstruction and
        Corrosion Inducement (Gashacon Bugvisor decomposes or evaporates anything
        it comes in contact with), Absorption (Gashacon Bugvisor can absorb Bugsters
        into it), Sealing (The Bugvisor can absorb and seal data of a being inside
        it), Immersion (He can travel to the Game World like the Bugster) Inorganic
        Physiology (Type 2; Bugsters body are made of data and such doesn''t have
        any organic parts), Body Control (Bugsters could turn into a mass of data
        to avoid attacks or escape), Immortality (Type 1, 3, 4, 6, 8), Regeneration
        (Mid-Godly; Bugsters can revive from their own deaths, after which the body
        and data vanish. Computer data is what makes up their body and mind, which
        means they can survive a complete destuction of their existence. If a Bugster
        is killed or before gaining a stable body, they can be absorbed and preserved
        into a Gashacon Bugvisor in a form of data, as an efficient way to preserve
        their data for other uses), Reactive Evolution and Accelerated Development
        (Other; Physical Statistics and Abilities; Bugsters become stronger and evolve
        every time they die, similar to how viruses mutate and adapt to man-made vaccines.
        When respawned, Bugsters can also "Level Up" like game characters, in a similar
        manner of the mutation of general viruses to survive vaccines. Some of the
        previously defeated Bugster even come back at a higher level than before.
        In fact, the Bugsters increasing powers necessitates the Riders having to
        find stronger upgrades for themselves. Developed the Reset ability out of
        his sheer rage to counter Hyper Muteki''s invincibility), Possession (They''re
        essentially parasites (or rather parasitoids, given they''re lethal to their
        hosts) that infect their host and grow inside them as a virus until their
        infection reaches a certain point, causing them to turn into a "Bugster Union".
        The virus evolves to the point where they can possess their victim instead
        of forming a Bugster Union. When Kamen Rider Chronicle comes into play, it
        seems to have evolved again: each Bugster no longer has a single host but
        rather a group of Ride Players, with even Perfect Bugsters now infecting multiple
        hosts), Data Manipulation (Like Bugster, he can enter Game World, and retrieve
        the data of patients, who had been taken over completely by the virus by inserting
        the respective Proto Gashat used to infect them into the Buggle Driver II.
        He can wipe out the revived data as well), Teleportation (Can teleport himself
        for simple travel or evade incoming assaults), Disease Manipulation, Data
        Manipulation, Status Effect Inducement and Existence Erasure (Can infect people
        with Bugster virus, if the virus is not stopped within time limit, the patient
        will instantly die with their body completely vanish), Resistance Negation
        (He can spread the Gamedeus Virus, which can infect the Bugster, who are said
        to be impossible to infect), Biological Manipulation and Transmutation (The
        Gamedeus Virus can turn people into Bugsters)'
