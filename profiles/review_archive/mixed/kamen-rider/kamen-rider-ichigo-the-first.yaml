- id: claim-standard-equipment-729abd80
  section: equipment
  axis: equipment
  text: '*Cyclone No. 1: The high-performance motorcycle ridden by Kamen Rider Ichigo,
    Takeshi Hongo. It has been specially tuned by the owner of Tachibana Racing, Tohei
    Tachibana, who has long admired Hongo''s motorcycle skills. With speeds of up
    to 400 km/h, exceptional durability and stability, and underwater riding, only
    Hongo, who has become a modified human being, is able to bring out the maximum
    abilities. *Typhoon: A belt-shaped device worn by Takeshi Hongo. By exposing this
    and activating it, the windmill-shaped dynamo in the center rotates. Transform
    Hongo into Kamen Rider No. 1. By rotating the dynamo, it also has the function
    of collecting wind power, which is the energy source of No. 1.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-5d50049b
  section: power_scale
  axis: battle_iq
  text: Gifted (Takeshi has sufficient knowledge of biochemistry from studying at
    Johnan University and is considered to have extraordinary intelligence. He is
    also adept at bike racing and has been entrusted with the Cyclone No. 1, which
    has been tuned to the limit. He was chosen by Shocker to be remodeled into their
    vanguard for inflation and assassinationKamen Rider Zukan; Shocker (The First).
    After betraying Shocker, he frequently battled assassins sent by them, even cooperating
    with Kamen Rider Nigo to bring them down. In the sequel, he is even more skilled
    after experienced many battles, able to fight Shocker's elites who have been upgraded
    by nanobots, and best Shocker Riders who has similar prowess as himKamen Rider
    Zukan; Shocker Rider)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-7e240c2c
  section: abilities
  axis: hax
  text: "* Superhuman Physical Characteristics * Transformation * Martial Arts * Vehicular\
    \ Mastery (Tobei Tachibana recognized his great motorcycle driving skills and\
    \ entrusted him with Cyclone No. 1, which requires significant physical ability\
    \ and skills to achieveKamen Rider Zukan; Cyclone No. 1. His abilities are enhanced\
    \ after undergoing remodeling surgeryKamen Rider Zukan; Kamen Rider Ichigo (The\
    \ Next). He can maneuver around, avoid explosives, and perform acrobatic feats\
    \ without losing control, handling the machine as if it were his limb. Triumph\
    \ over Shocker combatants and Shocker Riders on a bike chase)Kamen Rider The First;\
    \ 2005Kamen Rider The Next; 2007 * Acrobatics (Can pull off stunts even while\
    \ untransformed) * Stealth Mastery (Snuck into a building. Chosen by Shocker for\
    \ inflation and assassination missions) * Cyborgization (Normal) Resistance to:\
    \ * Mind Manipulation (Broke free from Shocker's brainwashing and regained his\
    \ ego) All previous abilities, plus: * Enhanced Acrobatics (Can execute acrobatic\
    \ moves and jump up to 15.3 meters. Perfectly landed after jumping off a building.\
    \ Utilized the recoil from rapid brakes to deliver a kick at speeds of up to 400\
    \ km/hKamen Rider Zukan; Cyclone No. 1 (The Next)) * Absorption (He can convert\
    \ wind power obtained from typhoons into energyKamen Rider Zukan; Kamen Rider\
    \ Ichigo (The First)) * Enhanced Senses (\u041E signal is a device that detects\
    \ danger and notifies Hongo when enemies appear around him. Compound Eyes have\
    \ eyesight far beyond that of ordinary people, enabling them to see what is going\
    \ on around them without missing a beat. It is also equipped with night vision,\
    \ enabling it to operate in the dark. Super tactile antennas are able to catch\
    \ every situation around him) * Explosion Manipulation (Can cause enemies to explode\
    \ into nothing) Resistance to: * Explosion Manipulation Fire Manipulation, and\
    \ Temperature Manipulation (Tanked an explosion without a scratch. Seemingly unaffected\
    \ by the fire surrounding him and its heat) Cyclone No. 1= * Free Movement (It\
    \ can travel underwater) * Limited Smoke Manipulation (Can create a smoke screen\
    \ out of tire smoke) Resistance to: * Fire Manipulation & Water Manipulation (Comparable\
    \ to Cyclone No. 2, which are resistant to water and fire)Kamen Rider Zukan: Cyclone\
    \ No. 2"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
