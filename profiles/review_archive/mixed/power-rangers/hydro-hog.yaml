    World Tour Live on Stage), Weapon Mastery (Sword, Anchor; He was able to masterly
    use swords to match multiple Rangers at once. He has mastery over his Anchor which
    he uses as a weapon in his fights), Immersion (Monsters can easily jump into fictional
    storiesMighty Morphin Power Rangers S2 Ep48; Storybook Rangers Part I), Absorption
    (Water, Life-Force; Hydro Hog can completely absorb the water from others including
    their life-forceMighty Morphin Power Rangers Alien Encounters; Page 218. This
    ability can be activated as long Hydro Hog has any form of physical contact with
    someoneMighty Morphin Alien Rangers Ep9; Hogday Afternoon: Part 1. He can easily
    evaporate and absorb instantly large bodies of water turning entire planets into
    wastelands), Fire Manipulation (Can breath fireMighty Morphin Alien Rangers Ep10;
    Hogday Afternoon: Part 2), limited Power Nullification (Nullified the Shogun Megazord''s
    flaming sword), Weather Manipulation (Created a tornado and a storm powerful enough
    to overpower the Aquitar Rangers), Teleportation (Capable of teleporting which
    he uses to gain advantages in a fight), Summoning (Capable of summoning and freely
    swapping through his weapons) and Explosion Manipulation (Has bombs that explode
    in contact) Matter Manipulation, Deconstruction (Molecular) and Existence Erasure
    (All monsters can resist the weapons of the Rangers), Poison Manipulation (All
    monsters can breath Edenoi''s poisonous air without issuesMighty Morphin Power
    Rangers S3 Ep1; A Friend in Need: Part I), Paralysis Inducement (All monsters
    can be stabbed and suffer attacks from the Power Lance but not get stunnedFrench
    Mighty Morphin Power Rangers magazines), Magnetism Manipulation (Monsters are
    capable of remaining unaffected while Manget Brain was messing with Earth''s polarityMighty
    Morphin Power Rangers S2 Ep20; Opposites Attract), Durability Negation (Internal
    Damage; All monsters can travel through dimensions without a problem which can
    be very dangerous as it can cause internal damageMighty Morphin Power Rangers
    S1 Ep34; The Green Candle, Part I), Radiation Manipulation (Monsters can blow
    up Power Plants without minding the radiationMighty Morphin Power Rangers S2 Ep24;
    The Ninja Encounter Part III), Time Manipulation (Reversal and Acceleration; Monsters
    are fine being on Earth despite the Earth spinning, reversing time due to the
    Rock of Time''s effectMighty Morphin Power Rangers S2 Ep39; Rangers Back in Time
    Part I), Mind Manipulation (Monsters can listen to Pumpkin Rapper''s hypnotic
