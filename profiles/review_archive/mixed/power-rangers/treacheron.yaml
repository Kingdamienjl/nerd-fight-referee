- id: claim-powers-and-abilities-b91c3697
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Longevity (Over 3000 years old) *
    Space Survival * Self-Sustenance (Types 1 and 2; Monsters do not need oxygen to
    survive making them also be able to be active in outer space.Power Rangers Lost
    Galaxy Ep12; Orion Rising Aliens can survive for over 3000 years without food
    or water and still have energyPower Rangers Lost Galaxy Ep15; Redemption Day)
    * Martial Arts (Master in various martial arts and techniques. He can fight the
    Galaxy Rangers in close combat) * Acrobatics (Capable of doing flips in the air)
    * Weapon Mastery (Master in the ways of the sword and capable of using his saya
    as a secondary weapon) * Accelerated Development (Battle, Passive; Physical Statistics
    - Treacheron constantly increases his strength in tandem with the Galaxy Rangers.
    From being overpowered by the Red Galaxy Ranger to overpowering him in their second
    match to being overpowered to again overpowering him until they appeared near
    equal. This also extends to their skill as Leo outskills him in their first fight
    but gets easily defeated in their second fight. In a single day he went from being
    a threat to the base Galaxy Rangers to being a threat to the Galaxy Rangers while
    amped by the Lights of Orion) * Speed Amplification (Can transform himself into
    energy while at the same time increasing his speed to match that of the Power
    Rangers) * Energy Manipulation (Capable of turning himself into energy. He can
    cover his sword in energy to increase the strength of his sword strikes) * Social
    Influencing (Deception - Deceived and fooled Trakeena in order to isolate her
    in a planet and then take revenge on her for setting him up) * Stealth Mastery
    (Much like the Shark Brothers who can perfectly maneuver and hide themselves inside
    Scorpius'' base without anyone seeing them) * BFR, Teleportation and Power Nullification
    (Capable of teleporting himself but also capable of teleporting away others and
    nullifying their armor in the process) * Summoning (Should be able of summoning
    Stingwingers like every other villain) * Sleep Manipulation (Monsters can operate
    in Terra Venture with the sleeping gas not bothering themPower Rangers Lost Galaxy
    Ep5; Homesick) * Death Manipulation (Monsters do not die from powder that inflicts
    instant deathPower Rangers Lost Galaxy Ep17; Stolen Beauty) * Fire Manipulation,
    Ice Manipulation and Electricity Manipulation (Monsters can withstand the elemental
    attacks of the Galaxy Rangers. Unbothered by the metaphysical flames of the Morphin
    Grid)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
