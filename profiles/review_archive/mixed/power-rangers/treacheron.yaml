    text: 'Gifted (Treacheron being an over 3000 years old alien, has collected various
      information about many artifacts and their locations by visiting their planets
      and learning their language . Being a cunning villain he can trick and deceive
      even his fellow villains ) Furio alongside many other villains accompanying
      Scorpius and his crew have been destroying planets and invading spacecrafts
      for over 3000 years across the whole universePower Rangers Lost Galaxy Ep10;
      The Sunflower Search staying undefeated. Treacheron can understand the level
      of skill of his opponents from a few seconds of watching them as he was able
      to match Magna Defender''s current skill with the same one he showed in their
      battle 3000 years ago and also calling it "flawless" and he was able to understand
      Leo''s skill after clashing with him. He can heavily increase his skill from
      losing to Leo to outskilling him and having a big back and forth progression.
      Even outside his sword, he has mastery over hand to hand combat which monsters
      have been confirmed to master multiple martial arts and techniques multiple
      across their years or conquest to become warriors.Power Rangers RPG: Across
      the Stars Treacheron can "eat Stingwingers for breakfast", being able to defeat
