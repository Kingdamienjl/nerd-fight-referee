      futuristic soldiers, know various martial art techniquesPower Rangers Lost Galaxy
      Ep1; Quasar Quest, Part 1 and even bother veteran warriors like Furio while
      in large numbers.Power Rangers Lost Galaxy Ep8; The Blue Crush Capable of beating
      multiple Rangers at once)'
