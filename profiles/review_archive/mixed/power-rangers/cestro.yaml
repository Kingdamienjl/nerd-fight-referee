- id: claim-powers-and-abilities-1a2cd02d
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics, * Longevity * Martial Arts (Their
    skill is a combination of ninja techniques, dancing moves and various earth martial
    arts such as wrestling moves) * Telepathy (Can control their zords with telepathy.
    Can telepathically talk to others. Used their telepathy to read data on the Power
    Ranger powers. Capable of communicating with fish lifeMighty Morphin Alien Rangers
    Ep6; Water You Thinking?) * Body Control (Aquitians can freely control the fish
    parts of their body) * Water Manipulation (Capable of using the water inside of
    them for water blast attacks. The water can also be used to pull things functioning
    as telekinesis) * Accelerated Development (After being beaten up by Master Vile''s
    monster team, they were able to defeat them right after in a zord fight. Shouldn''t
    be any weaker than the Earth Rangers) * Flight (Restricted, Spaceflight; Capable
    of levitating. Can fly through space) * Free Movement (Capable of walking on top
    of water) * Absorption (Capable of absorbing the water they come in-contact with
    to re-energize and power up) * Enhanced Senses (Capable of sensing water. The
    Aquitians can sense presences around them. Aquitians can detect dangerMighty Morphin
    Alien Rangers Ep9; Hogday Afternoon: Pt. 1) * Poison Manipulation (The Aquitians
    absorbed the chemical poison of the Barbaric Brothers for a long time without
    suffering any side effects. The poison would have been used to destroy the planet
    and it is capable of rendering machines useless) * Mind Manipulation and Empathic
    Manipulation (The Aquitians are beings of pure good, good that can passively destroy
    spells that control others making them evil) * Morphin Grid Energy (Ranger Physiology/Blue
    Ranger) * Energy Manipulation (The Aquitar Rangers can use their swords to create
    an energy triangle attack that causes massive damage to the opponentMighty Morphin
    Alien Rangers Ep7; Along Came a Spider) * Free Movement (Capable of walking on
    water) * Non-Standard Breathing (Ninjetti allows underwater activityMighty Morphin
    Power Rangers S3 Ep19; Changing of the Zords: Part II) * Duplication (Ninjetti
    allows duplication) * Broadway Force (Ninjetti is capable of forcing the opponent
    to danceMighty Morphin Power Rangers S3 Ep21; Follow That Cab!) * Size Manipulation
    (Ninjetti is capable of changing the size of the Ranger) * Energy Projection (Ninjetti
    allows the creation of energy shurikensMighty Morphin Power Rangers S3 Ep16; A
    Ranger Catastrophe: Part I) * Illusion Creation (Capable of creating illusions
    Mighty Morphin Power Rangers S3 Ep6; Ninja Quest: Part III) * Statistics Amplification
    (The Ninjetti can amplify their speed) * Teleportation (Ninjetti allows the usage
    of teleportation during fightsMighty Morphin Power Rangers S3 Ep10; Wizard for
    a Day) * Intangibility and Fusionism (Ninjetti allows the Ranger to become intangible
    and fuse using the environment around them. The Ninjetti powers can be combined
    into a single powerful ninja abilityMighty Morphin Power Rangers S3 Ep12; Stop
    the Hate Master: Part I) * Extrasensory Perception (The Ninjas can sense each
    other''s collective energy as they are linkedMighty Morphin Power Rangers S3 Ep7;
    Ninja Quest: Part IV) All previous'
  source_ids: *id003
  decisive: true
  status: unverified
