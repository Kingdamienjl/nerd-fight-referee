      value: Genius (Lalo is a cunning and tactical genius, having matched and also
        outwitted Gustavo Fring on multiple occasions. He has shown to be a long-term
        planner, having stashed and hidden millions of dollars in-case he needs to
        bail himself out of prison, and has a local man arranged with identical dental
        records so that he can be used as a body double in the future. Lalo is also
        a perceptive investigator with an eye for details; He puts these skills to
        use by snooping around Gus' operations in New Mexico. This leads him to discovering
        Gus' major enforcer, Mike Ehrmantraut, and eventually unraveled the construction
        of the secret meth superlab. Lalo is quick-witted and is able to formulate
        multi-step gambits; After realizing that his phone call with Hector was wiretapped,
        he exploits this by tricking Gus into believing that he would be directly
        going after him. This resulted in Mike calling off his armed men that were
        originally protecting Jimmy and Kim, in-order to protect Gus' location. Lalo
        exploits this diversion he crafted by visiting both Jimmy and Kim, forcing
        either of them to head to Gus' location and attempt to assassinate him. This,
        of course, was simply another scheme that hid Lalo's true intention, which
        was to further investigate the soon-to-be underground meth lab and to gather
        more evidence in-order to finally turn the Cartel against Gus Fring for his
        secretive activities and treachery against them. Complimenting his cunning
        intellect is also his ability to handle himself in combat; He successfully
        ambushed a squad of hitmen sent after him by luring them into the underground
        passageway he had sneaked out from, only to immediately head back into his
        compound and shoot one of them, followed by him gunning down the rest of the
        hitmen that were crawling through the passageway. Lalo is also able to use
        his charisma and amiable personality to allure Margarethe Ziegler to get information
        out from her.)
