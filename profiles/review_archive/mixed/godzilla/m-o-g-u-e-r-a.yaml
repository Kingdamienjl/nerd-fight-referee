- id: claim-weaknesses-84d4f92d
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks and Techniques: right|400px right|400px right|400px
    right|480px right|480px right|480px right|480px right|480px right|480px *Plasma
    Laser Cannons: Built into its eyes, which rapidly fire yellow plasma shots. The
    laser takes the form of a rapid stream of yellow energy blasts, which are said
    to be three times as powerful as Mechagodzilla''s Laser Cannons. Because the Plasma
    Laser Cannon fires a repeating series of individual laser blasts, the weapon can
    be cooled and recharged repeatedly as it fires, preventing it from overheating
    and allowing M.O.G.U.E.R.A. to continuously use the attack. *Automatic Tracking
    Lasers: Blue energy beams released from its hands. M.O.G.U.E.R.A. can fire an
    Automatic Tracking Laser Cannon from its hands. This laser possesses high penetrating
    power and can track targets, allowing M.O.G.U.E.R.A. to easily target and strike
    a moving enemy with the laser by moving its arms. M.O.G.U.E.R.A. used this laser
    in its first battle with SpaceGodzilla, while the Automatic Tracking Laser Cannon
    also serves as Land Moguera''s primary weapon. *Plasma Maser: M.O.G.U.E.R.A.''s
    most powerful weapon is the Plasma Maser Cannon, a powerful Maser Cannon equipped
    on its abdomen. It is said to be five times more powerful than the Maser beam
    fired by the MBT-MB92. The Plasma Maser Cannon can be fired more quickly than
    Mechagodzilla''s Plasma Grenade; however, when it is being fired it leaves M.O.G.U.E.R.A.''s
    abdomen exposed and compromises its armor. *All Weapon: The combined power of
    both weapons is capable of knocking SpaceGodzilla off his feet. *Spiral Grenade
    Missiles Each of M.O.G.U.E.R.A.''s arms is loaded with 12 Spiral Grenade Missiles,
    which are a weapon adapted from Super Mechagodzilla''s G-Crusher. *Drill Bit:
    A drill bit is located in the center of its face, which can be used for close
    range fighting. M.O.G.U.E.R.A. utilized the Drill Attack against SpaceGodzilla,
    and successfully penetrated its enemy''s skin and drew blood. The Crusher Drill
    is also present on Land Moguera''s front end, allowing the vehicle to burrow underground.
    *Separation and recombination: M.O.G.U.E.R.A. is the combined form of two vehicles:
    Land Moguera, a land-based tank with burrowing capabilities, and Star Falcon,
    a VTOL aircraft. M.O.G.U.E.R.A. can split apart into both vehicles and then recombine
    later. *Flight/Spaceflight: M.O.G.U.E.R.A. is capable of flight at Mach 1 in Earth''s
    atmosphere and faster in outer space *EMP Bombs: Can launch an EMP bomb that instantly
    detonates and leaves a blast radius for a short duration *Magnetic and Electronic
    Counter Measure (MECM): This prevents SpaceGodzilla from disabling M.O.G.U.E.R.A.''s
    control and weapon systems. It is designed to interfere with the electromagnetic
    waves given off by SpaceGodzilla by emitting disturbing radio waves. It receives
    the electromagnetic waves through M.O.G.U.E.R.A.''s antenna and responds by transmitting
    disturbing radio waves through a sonar device on the circular saw on M.O.G.U.E.R.A.''s
    back. *Complex Sensor System: M.O.G.U.E.R.A. has seven sensors collectively known
    as the Complex Sensor System placed in the slit in its forehead in order to reduce
    the influence of SpaceGodzilla''s electromagnetic waves. The seven complementary
    sensors are: the Ultra-High Sensitivity Camera, the Infrared Radar, the Active
    Sonar, the Thermo-Searcher, the Moving Body Scanner, the Gravity Measuring Instrument,
    and the Laser Aiming Tracking System. *Synthetic Blue Diamond-Coated Armor: M.O.G.U.E.R.A.
    is covered in a Synthetic Blue Diamond-Coated Armor, which can harmlessly reflect
    Godzilla''s atomic breath. The armor is applied in such a way that the parts of
    M.O.G.U.E.R.A. that would be most vulnerable to Godzilla''s atomic breath are
    the most heavily armored. While it is more resistant than Mechagodzilla''s Diamond
    Coating, M.O.G.U.E.R.A.''s armor lacks the ability to absorb plasma from Godzilla''s
    atomic breath like Mechagodzilla''s Plasma Grenade.'
  source_ids: *id003
  decisive: false
  status: unverified
