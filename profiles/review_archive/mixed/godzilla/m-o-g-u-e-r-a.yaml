    - field: weaknesses
      value: 'Plasma Laser Cannons: Built into its eyes, which rapidly fire yellow
        plasma shots. The laser takes the form of a rapid stream of yellow energy
        blasts, the weapon can be cooled and recharged repeatedly as it fires, Plasma
        Maser: M.O.G.U.E.R.A.''s most powerful weapon is the Plasma Maser Cannon,
        a powerful Maser Cannon equipped on its abdomen. It is said to be five times
        more powerful than the Maser beam fired by the MBT-MB92. The Plasma Maser
        Cannon can be fired more quickly than Mechagodzilla''s Plasma Grenade, when
        it is being fired it leaves M.O.G.U.E.R.A.''s abdomen exposed and compromises
        its armor., All Weapon: The combined power of both weapons is capable of knocking
        SpaceGodzilla off his feet., Spiral Grenade Missiles Each of M.O.G.U.E.R.A.''s
        arms is loaded with 12 Spiral Grenade Missiles, Drill Bit: A drill bit is
        located in the center of its face, and successfully penetrated its enemy''s
        skin and drew blood. The Crusher Drill is also present on Land Moguera''s
        front end, Separation and recombination: M.O.G.U.E.R.A. is the combined form
        of two vehicles: Land Moguera, a land-based tank with burrowing capabilities,
        a VTOL aircraft. M.O.G.U.E.R.A. can split apart into both vehicles and then
        recombine later., Flight/Spaceflight: M.O.G.U.E.R.A. is capable of flight
        at Mach 1 in Earth''s atmosphere and faster in outer space, Magnetic and Electronic
        Counter Measure (MECM): This prevents SpaceGodzilla from disabling M.O.G.U.E.R.A.''s
        control and weapon systems. It is designed to interfere with the electromagnetic
        waves given off by SpaceGodzilla by emitting disturbing radio waves. It receives
        the electromagnetic waves through M.O.G.U.E.R.A.''s antenna and responds by
        transmitting disturbing radio waves through a sonar device on the circular
        saw on M.O.G.U.E.R.A.''s back., Complex Sensor System: M.O.G.U.E.R.A. has
        seven sensors collectively known as the Complex Sensor System placed in the
        slit in its forehead in order to reduce the influence of SpaceGodzilla''s
        electromagnetic waves. The seven complementary sensors are: the Ultra-High
        Sensitivity Camera, Synthetic Blue Diamond-Coated Armor: M.O.G.U.E.R.A. is
        covered in a Synthetic Blue Diamond-Coated Armor, M.O.G.U.E.R.A.''s armor
        lacks the ability to absorb plasma from Godzilla''s atomic breath like Mechagodzilla''s
        Plasma Grenade.'
      source_id: mediawiki-537434
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: 'Spiral Grenade Missiles Each of M.O.G.U.E.R.A.''s arms is loaded with
        12 Spiral Grenade Missiles, which are a weapon adapted from Super Mechagodzilla''s
        G-Crusher., Drill Bit: A drill bit is located in the center of its face, which
        can be used for close range fighting. M.O.G.U.E.R.A. utilized the Drill Attack
        against SpaceGodzilla, and successfully penetrated its enemy''s skin and drew
        blood. The Crusher Drill is also present on Land Moguera''s front end, allowing
        the vehicle to burrow underground., Separation and recombination: M.O.G.U.E.R.A.
        is the combined form of two vehicles: Land Moguera, a land-based tank with
        burrowing capabilities, a VTOL aircraft. M.O.G.U.E.R.A. can split apart into
        both vehicles and then recombine later., Flight/Spaceflight: M.O.G.U.E.R.A.
        is capable of flight at Mach 1 in Earth''s atmosphere and faster in outer
        space, EMP Bombs: Can launch an EMP bomb that instantly detonates and leaves
        a blast radius for a short duration, Defenses=, Magnetic and Electronic Counter
        Measure (MECM): This prevents SpaceGodzilla from disabling M.O.G.U.E.R.A.''s
        control and weapon systems. It is designed to interfere with the electromagnetic
        waves given off by SpaceGodzilla by emitting disturbing radio waves. It receives
        the electromagnetic waves through M.O.G.U.E.R.A.''s antenna and responds by
        transmitting disturbing radio waves through a sonar device on the circular
        saw on M.O.G.U.E.R.A.''s back., Complex Sensor System: M.O.G.U.E.R.A. has
        seven sensors collectively known as the Complex Sensor System placed in the
        slit in its forehead in order to reduce the influence of SpaceGodzilla''s
        electromagnetic waves. The seven complementary sensors are: the Ultra-High
        Sensitivity Camera, the Infrared Radar, the Active Sonar, the Thermo-Searcher,
        the Moving Body Scanner, the Gravity Measuring Instrument, Synthetic Blue
        Diamond-Coated Armor: M.O.G.U.E.R.A. is covered in a Synthetic Blue Diamond-Coated
        Armor, which can harmlessly reflect Godzilla''s atomic breath. The armor is
        applied in such a way that the parts of M.O.G.U.E.R.A. that would be most
        vulnerable to Godzilla''s atomic breath are the most heavily armored. While
        it is more resistant than Mechagodzilla''s Diamond Coating, M.O.G.U.E.R.A.''s
        armor lacks the ability to absorb plasma from Godzilla''s atomic breath like
        Mechagodzilla''s Plasma Grenade.'
