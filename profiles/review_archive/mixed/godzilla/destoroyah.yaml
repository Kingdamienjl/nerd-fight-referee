  intelligence:
    text: High Animalistic (Destoroyah is often considered one of Godzilla's most
      merciless, intelligent, and evil foes, along with the Showa King Ghidorah and
      SpaceGodzilla. Unlike monsters that kill and destroy unintentionally and act
      only out of instinct or while under mind control, Destoroyah seems fully aware
      of the death and destruction he causes and takes pleasure in causing it. His
      cruelty is most visible when he attacks Godzilla Junior and later kills him
      while the latter is trying to reunite with his father. While Godzilla is grieving
      over his son, Destoroyah attacks him on two separate occasions, even appearing
      to laugh while he drags Godzilla by the neck. Destoroyah's strategies seem to
      revolve around causing as much pain to his opponents as possible, as his aggregate
      form is shown repeatedly stabbing Junior with his limbs and administering extremely
      painful doses of Micro-Oxygen into the wounds.)
