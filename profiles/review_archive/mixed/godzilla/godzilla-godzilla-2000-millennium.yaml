- id: claim-weaknesses-5d5016d7
  section: weaknesses
  axis: weakness
  text: "None notable \u200BFeats: *\u200BCaused huge amounts of damage to Multiple\
    \ Cities and Settlements *\u200BFought the Military numerous times *\u200BFought\
    \ the Millennium UFO (Millennium) *\u200BDestroyed the Millennium UFO (Millennium)\
    \ *\u200BFought and Killed Orga (Millennium) Notable Attacks and Techniques: *:\
    \ As with other incarnations of Godzilla, this Godzilla's signature ability is\
    \ his atomic breath. This Godzilla's atomic breath is unique in that, rather than\
    \ being a whitish mist or blue beam, it is a fiery orange color. This version\
    \ of Godzilla's atomic breath appears to be more incendiary in nature than previous\
    \ versions, producing a fiery explosion whenever it is used. Whenever Godzilla\
    \ charges his atomic breath, his dorsal fins glow orange and give off intense\
    \ heat. *Nuclear Pulse: This Godzilla possesses what appears to be a variation\
    \ of the Heisei Godzilla's nuclear pulse ability. This ability is seen only once\
    \ in the film when Orga attempts to swallow Godzilla whole. Godzilla's dorsal\
    \ fins begin to glow and give off heat, then the rest of his body begins to do\
    \ the same. Godzilla then unleashes a fiery shockwave of atomic energy from all\
    \ directions, obliterating Orga."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
