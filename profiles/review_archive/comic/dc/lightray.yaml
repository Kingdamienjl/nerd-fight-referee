    - field: weaknesses
      value: 'Standard Kryptonian weaknesses, but has survived situations that would
        kill an average Kryptonian, and once continued to fight even after having
        the iron in his blood turned to Kryptonite. Magic is said to be a weakness
        of his, having resisted powerful magic on many occassions. Refuses to kill
        on most occassions, and mentally blocks himself from using more of his power,
        Being forced to transform back into normal leaves him powerless., possibly
        characters with stronger Chi Manipulation, Normal base weaknesses, please
        refer to this explainer by WebCamParrot. I will also, at some point, be creating
        a DC Cosmology page for those who prefer a text/diagram form. Note 2: It is
        unreasonable to handwave away the rather abundant amount of Universal+ AP
        and Immesurable speed scaling in DC Comics. This is for two reasons:, First
        off, Superman holds back through all of his appearances, save at least two.
        This means that he would be holding back in any of the few low-end outliers,
        we see what happens in Superman 666 when Superman doesn''t hold back, even
        severely weakened, he shows he can effortlessly blitz and one-shot all the
        villains usually considered a threat to him, there are zero rules for how
        powerful you can make a character. It is utterly fallacious to say "Superman
        makes more sense being solar system level because he absorbs power from a
        star" or "It would be weird for him to be faster than time itself, when dozens
        upon dozens of instances say he can threaten the universe, and move fast enough
        to travel through time. You cannot just use the incredibly arbitrary and nonsensical
        "what makes sense" in powerscaling'
      source_id: character-stats-profiles-lightray-post-crisis
      provider_id: character_stats_profiles
      authority: high
