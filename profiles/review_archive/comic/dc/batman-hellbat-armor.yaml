    - field: intelligence
      value: 'At least Extraordinary Genius, potentially Supergenius. When Batman
        was jokerizing himself, he was consistently stated to be equal to The Batman
        Who LaughsThe Batman Who Laughs Vol 2 6The Batman Who Laughs Vol 2 7. Outsmarted
        and beat The Batman Who Laughs while jokerized. Was stated to be able to think
