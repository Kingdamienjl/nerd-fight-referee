- id: claim-powers-and-abilities-da07d451
  section: abilities
  axis: hax
  text: 'Peak Human Physical Characteristics, Breaking the Fourth Wall (Frequently
    broke the 4th wallGreen Lantern Vol 2 39The Flash Vol 1 258), limited Plot Manipulation
    (''Paused'' the story). With the Power Rod, Radiation Manipulation, Energy Manipulation,
    Energy Projection, Plasma Manipulation, Absorption, Power Mimicry (Absorbs Green
    Lantern energy and uses to emulate the Power Ring as his primary form of combat.
    He can theoretically do whatever a Green Lantern or anyone else he absorbs his
    energy from, can achieve. Has also stolen powers from The Flash), Extrasensory
    Perception (Can sense GL energyGreen Lantern: Rebirth Vol 1 1), Energy Projection,
    Energy Manipulation, Light Manipulation, Matter Manipulation, Creation, Weapon
    Creation (all innate powers of a GL), BFR (Sent one half of Green Lantern to another
    dimensionGreen Lantern Vol 2 29) Smoke Manipulation (Can generate smoke), Astral
    Projection (Projected an image of himself), Duplication (Created duplicates of
    himself), Illusion Creation (Created illusions so strong that it affected Hal
    Jordan, Can fully make himself appear to be someone else), Intangibility (Can
    walk through walls), Flight (While impersonating Green Lantern, he flew), Transmutation,
    Metal Manipulation (Transmuted a spaceship), Aura, Invisibility, Enhanced Senses
    (Could turn The Flash invisible, detect his energy signature, and manipulated
    his aura), Mind Manipulation, Statistics Amplification (After absorbing Flash''s
    speed, he became as fast as him Made hockey players as fast as The Flash after
    mind-controlling themFlash & Green Lantern: The Brave and the Bold Vol 1 2), Forcefield
    Creation, Explosion Manipulation, Temperature Manipulation, Radiation Manipulation
    (Created a H-Bomb-style explosionThe Flash Vol 1 259), Vibration Manipulation
    (Mimicked Flash''s vibrational powers), Technology Manipulation (Opened electronic
    prison doorsGreen Lantern Vol 2 147), Sand Manipulation (As seen hereGreen Lantern
    Vol 2 205), Earth Manipulation (Caused an Earthquake), Telekinesis (Lifted an
    entire baseball stadiumGreen Lantern Vol 2 206), Fire Manipulation (Created huge
    flames), Biological Manipulation (Could make Kid Flash''s heart beat so fast that
    it would explode]) Regeneration (Mid-Low), Death Manipulation (After regrowing
    his hand, it kills whatever it touchesGreen Lantern Vol 4 5), Energy Projection
    (Can shoot energy beamsGreen Lantern Vol 4 6), Necromancy (Resurrected the Black
    Lantern Corps, a group made up of deceased individualsBlackest Night Vol 1 1),
    Empowerment (Gets stronger per individual converted), Disease Manipulation, Corruption,
    Morality Manipulation, Perception Manipulation, Mind Manipulation, Biological
    Manipulation (The resurrection process is a corruption described as an illness
    of sorts, that warps the biological make-up and personality of the individual,
    resulting in a twisted and evil version of themBlackest Night Vol 1 5), Summoning
    (Can summon his zombies at willBlackest Night Vol 1 7) Resistance to Explosion
    Manipulation, Radiation Manipulation, Temperature Manipulation, Light Manipulation
    (Unscathed from an H-Bomb at ground zero with an aura)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
