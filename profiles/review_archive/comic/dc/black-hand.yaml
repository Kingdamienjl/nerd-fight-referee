- id: claim-weaknesses-3b90405a
  section: weaknesses
  axis: weakness
  text: Black Hand is a deeply troubled man. He suffers from "herophobia", believing
    that Green Lantern is the root of all of his problems, projecting his deep insecurities
    and regrets upon them. As such, he is extremely paranoid, to the point where simply
    seeing a GL throws him in a fit of rage. Also, his rod has limits to how much
    energy it can containLegends of the DC Universe Vol 1 28
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
