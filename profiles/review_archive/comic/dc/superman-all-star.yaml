    - field: weaknesses
      value: "| *Kryptonian Physiology: Under the effects of a \"yellow\" sun, Superman\
        \ possesses the same potential weaknesses as an average Kryptonian. These\
        \ include: **Vulnerability to Kryptonite **Vulnerability to Magic *After being\
        \ exposed to an overload of yellow solar radiation, Superman became largely\
        \ invulnerable to the effects of Green Kryptonite. However, some other wavelengths\
        \ of K-energy such as those of Black Kryptonite were still effective against\
        \ him, and red solar radiation was still capable of reducing him to a mortal\
        \ man. |} {| class=\"wikitable mw-collapsible mw-collapsed\" | style=\"color:\
        \ white; background-color:#101820\" |Notable Attacks/Techniques |- | *Kryptonian\
        \ Physiology: Under the effects of a \"yellow\" sun, Superman possesses the\
        \ same potential powers as an average Kryptonian. These include: **Solar Energy\
        \ Absorption: Under optimal conditions, this is the main source of Superman's\
        \ super powers as they are contingent upon exposure to solar radiation from\
        \ a yellow sun star system. His biological make up includes a number of organs\
        \ which lack analogues in humans and whose functions are unknown. It is believed\
        \ that between one or more of these and his bio-cellular matrix, \"yellow\"\
        \ solar energy is stored for later use. This allows for the use of these powers\
        \ to fade when yellow solar radiation is not available instead of immediate\
        \ failure. **Heat Vision: Superman can, as a conscious act, fire beams of\
        \ intense heat at a target by looking at it. He can vary the heat and area\
        \ affected. **Super-Hearing: Superman's hearing is sensitive enough to hear\
        \ any sound at any volume or pitch. With skill and concentration, he can block\
        \ out ambient sounds to focus on a specific source or frequency. **Enhanced\
        \ Vision: Superman's vision processes the entire electromagnetic spectrum\
        \ as well as allowing vast control over selective perception and focus. This\
        \ umbrella ability includes the following: ***Electromagnetic Spectrum Vision:\
        \ Superman can see well into most of the electromagnetic spectrum. He can\
        \ see and identify radio and television signals as well as all other broadcast\
        \ or transmitted frequencies. Using this ability, he can avoid detection by\
        \ radar or satellite monitoring methods. This also allows him to see the aura\
        \ generated by living thing. ***Telescopic Vision: This is the ability to\
        \ see something at a great distance, without violating the laws of physics.\
        \ Though limited, the exact extent of the ability is undetermined. In function,\
        \ it is similar to the zoom lens on a camera. ***X-Ray Vision: This is the\
        \ ability to see through any volume of matter except lead. Supermans can see\
        \ things behind a solid, opaque object as if it were not there. He can focus\
        \ this ability to \"peel back\" layers of an object, allowing hidden image\
        \ or inner workings to be observed. The exact type of energy perceived\u2014\
        such as x-rays, cosmic rays, or some other energy invisible to normal humans\u2014\
        is unclear. This ability perceives an ambient energy source though, it does\
        \ not involve the eye projecting a concentrated, possibly toxic, beam to be\
        \ reflected back from objects. ***Microscopic Vision: This is the ability\
        \ to see extremely small objects and images down to the atomic level. ***Infrared\
        \ Vision: Superman can see with better acuity in darkness, and to a degree\
        \ in total darkness. **Flight: Superman is able to manipulate graviton particles\
        \ to defy the forces of gravity and achieve flight. This ranges from hovering\
        \ to moving in any posture, in any direction. **Invulnerability: Due to the\
        \ interaction of his dense molecular structure and supercharged bio-electric\
        \ aura, Superman is nigh-invulnerable to extreme energy forces. In addition,\
        \ his extends this protection against toxins and diseases. ***Toxic Immunity\
        \ **Superhuman"
