        than human tissue. He does not possess superhuman strength levels despite
        his enhanced cellular ability without his cellular structure charged with
        yellow solar energy. Without such charging, his physical capabilities are
        identical to a human of his height and weight who engages in regular physical
        activity. As an alien, he possesses several organs whose functions are not
        yet disclosed or understood, but are believed to be part of or the source
        of his bio-matrix force field and reclamation aura. Superman''s body also
        stores energy actively within his bio-cellular matrix as an energy pattern
        that is linked to his body''s electromagnetic field. This energy powers most
        of his abilities such as flight, heat vision and other solar-based abilities
        while supplementing his physical abilities to superhuman levels. **Stellar
        Radiation Absorption: As a Kryptonian, his cells function like a super battery,
        hyper metabolizing specific wavelengths of radiation as fuel to enable living
        functions and/or superhuman abilities. Different wavelengths of radiation
        have different effects on Superman''s physiology and well being, but his cells
        cannot absorb or utilize all types of radiation. The wavelength of his home
        star system''s red sun enables his body to function on an identical level
        of a healthy human while the solar radiation on Earth, in both its raw and
        filtered state through the Earth''s atmosphere, acts as fuel to enable all
        of his powers. Every time Superman uses any of his superhuman abilities, his
