        \ possibilities. As a Demiurgic Archangel, Gabriel is immensely and incomprehensibly\
        \ far above Angels such as Castiel, who easily threatening the space beyond\
        \ the infinite numbers of infinitely superior dimensions, and angels themselves\
        \ exists as an abstract concept embodying the identity of God that is present\
        \ all across reality, extending further beyond the physical world and into\
        \ the higher realms outside of space-time continuum, being a fundamental constant\
        \ engraved into the very design of all Creation. The Angels themselves also\
        \ collectively gave the entire cosmos boundary length, breadth and volume,\
        \ and they called it space - the boundary of existence, a zone in which the\
        \ very concept of existence could finally be expressed after the Demiurgic\
        \ Archangels define the emptiness. Resided in Heaven, a realm that completely\
        \ transcends all of the Outerverses, which by itself contain that infinite\
        \ hierarchal multiverses as a fraction of itself, and stands on the highest\
        \ hierarchy of the Creation. Effortlessly far above Oblivion and the Endless,\
        \ both of which exists beyond space and time, in the space beyond space and\
        \ space beneath space, and the former exists far beyond any Outerverses, which\
        \ is an entire story of its own, to which infinite layers of higher and lower\
        \ dimensions are a part of such \"story\", holding them as microscopic fragments\
        \ of himself. The most minor fragments of his powers empowered the Avatar\
        \ of God, who are the supreme Creator above all other to an outerverse. Fought\
        \ with Lucifer Morningstar and defeated him, setting many parts of the Creation\
        \ ablaze) | Extraversal Level (At least comparable, if not, superior to Weldrok,\
        \ who views the 'World of the Writers', a Universe beyond the Void, as beneath\
        \ him and can freely controls it. The World of the Writers itself chronicles\
        \ the happenings of all other outerverses, realities and things happening\
        \ below them in Creation, believing it to be fiction or imagination. Even\
        \ when the hellhound surpassed the Divine Goddess, Gabriel was still able\
        \ to fight on par with and overpower him, though Gabriel himself is later\
        \ defeated. Equal in power of the Void, a force of nothingness that holds\
        \ all of Creation; including infinite outerverses, each with infinite possibilities,\
        \ and the Omniverse that contains all of such things; as something below even\
        \ the infinitesimally microscopic fragments of itself and in the end, all\
        \ of Creation itself fills up to nothing but zero in comparison to the Void.\
        \ As one of the Three Demiurgic Archangels, Gabriel Hornblower participated\
        \ in the shaping all of Creation. Completely transcends all concept of \"\
        infinity\", even one such as the Absolute Infinity, holding even such concept\
        \ as a microscopic and an unremarkable aspect of himself. Effortlessly killed\
        \ Azathoth with a snap of his finger, who embodies the totality of existence\
        \ [an infinitely layered cosmological structure that becomes more unfathomable\
        \ the further into it \"travelers\" get, also having an infinite amount of\
        \ dimensionless, limitless gods who view everything below them as simply a\
        \ game without any rules, with even the absolute lowest of these gods viewing\
        \ the unfathomable, infinitely layered structures such as The Ultimate Void,\
