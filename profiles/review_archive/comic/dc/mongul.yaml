      value: 'Universe level+ (Fought Golden Age Superman in Infinite Crisis to a
        stalemate, where both altered timelines and shattered the boundaries of space
        and time, and furthermore were outright stated to be going for the destruction
        of eachother''s universes. Both would later shatter the universe again, and
        the DC Comics site backs up the DCU shaking apart. Comparable to Shazam, who
        fought the Invincible Man, who siphoned power from the soul of the Universe,
        created by the Big Bang. Fought Black Adam, who Superman said hits harder
        than Shazam/Captain Marvel, and who survived a tesseract expanding in his
        head, Shazam himself could also survive a tesseract bomb. Knocked down Superboy-Prime,
        who was planning to destroy the universe by flying into Oa, causing a new
        big bang and leaving himself only. Tussled with Nebula Man, literally a living
        Universe. Fought with 30th Century Mordru, who wields all the magical power
        of Universe-247. Fought Monarch, who stated his Quantum power was akin to
        the Big Bang, and whose fight with Captain Atom was twisting space and time
        and causing compressed universes to explode. Fought many Imperiex Probes for
        several days, where one could fight and mortally wound Aquaman, who was causing
        the universe to collapse in on itself. Very capable of fighting Kyle Rayner,
        and walking through a full-power blast from him, the same Kyle that took down
        an Abberation that was breaking down the laws of reality, and was stated to
        threaten the universe, and was able to revert these changes by amplifying
        his ring. Took down Starman, who overwhelmed Darklord Maaldor, the latter
        of whom possessed an entire universe. Decked Blackstar, who can manipulate
        the energies of the cosmos as he wills) | At least Universe level+, likely
        far higher (Unfathomably stronger than his base, to a practically indescribable
        extent. Through Superman''s history, he has had an ingrained mental block
        preventing the use of his full strength, due to his usual refusal to kill
        or cause severe harm. This is even present when he looks to be enraged. It''s
        only after training with Mongul that Superman first uses his full power. On
        the two occasions that Superman went all out: Superman thoroughly and utterly
        stomped Doomsday in their rematch, to the point where Doomday''s claws shattered
        like glass on Superman''s chest. After having his soul split in two by the
        Phantom Stranger, in order to take on Hell, heavily weakening and corrupting
        him, but removing his restraints, he effortlessly one-shot all of his previous
        villains including powerhouses like Darkseid and Doomsday; also instantly
        killing Brainiac by just shuffling his hands, and Lex in his war suit by spitting
        at him.) | At least Universe level+ (Much stronger than his base form. When
