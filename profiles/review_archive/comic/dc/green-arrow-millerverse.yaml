    - field: powers_and_abilities
      value: Superhuman Physical Characteristics (See Attack Potency, Speed, and Durability),
        Weapon Mastery (Demonstrates profound mastery of the bow and arrow, with his
        feats of marksmanship including shooting an arrow into the barrel of a gun
        from a distance, hitting Brimstone's reactor from a distance, etc), Hand-to-Hand
        Combat Expertise (Demonstrates aptitude for combat, particularly boxing -
        with Black Canary considering his level of skill somewhat notable (though
        lesser than her own) and GA being capable of defeating The Question), Stealth
        Mastery (Has demonstrated the capacity to sneak up on enemies with great expertise),
        Acrobatics (Frequently does flips and rolls to recover from or avoid attacks),
        Explosion Manipulation (with Explosive Arrows and his Quantum Arrow), Electricity
        Manipulation (with Taser Arrows), Paralysis Inducement (with Net Arrows and
        Bola Arrows), Smoke Manipulation (with Smoke Arrows), Sleep Manipulation (with
        his Knockout Gas Arrow)
      source_id: character-stats-profiles-green-arrow-millerverse-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Small Building Level physically (Downscaling from 0.095 Tons - Beat up
        the Question, who (during JLU Season 2) was all but stated to be capable of
        physically subduing a non-enhanced Lex Luthor for long enough to strangle
        him to death with a tie, with the Brainiac-Induced super strength Lex had
        at the time being strongly implied to be the only reason Vic's plan didn't
        work. As a well-built grown man with ample martial arts training and enough
        superhero experience to have had a sidekick, it stands to reason GA would
        be stronger than Rocky Ballentine (a relatively normal woman whose only training
        was a women's self-defense course), who could contend with and harm Jay and
        Lark - the latter two being capable of kicking someone through a wall. He
        should also be stronger than borderline-civilian Kathy Duquesne, who destroyed
        a wooden crate with one kick. Can casually knock grown men out in one hit),
        higher with Impact Arrows (Could injure the Huntress, and were implied to
        be possibly helpful against Wildcat. Ripped through Dark Heart drones, which
        were unhurt by machine gun fire. Oneshot a Parademon), at least Small Building
        Level, possibly higher with Explosive Arrows (Has created massive explosions,
        with one being capable of destroying a military-grade helicopter), far higher
        with Quantum Arrow (Created an explosion this size)
      source_id: character-stats-profiles-green-arrow-millerverse-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Hypersonic (Scaling to Mach 8.7), possibly Relativistic+ (Scaling to
        0.53c) reactions and combat speed (Dodged a strike from and leg-swept Mano,
        who could keep up with and land hits on Batman, and moved in tandem with a
        Lantern beam at close range, blocking it with his hand. Believed he could
        release his bowstring to fire arrows quicker than Huntress (who could dodge
        attacks from a bloodlusted Wonder Woman and keep up with Roulette, who side-stepped
        a sound wave at close range) could move. Avoided gunfire and attacks from
        Brimstone), with his arrows possessing Subsonic+ attack speed (Considering
        his superhuman (by IRL standards) strength and how advanced his equipment
        is, it's not unreasonable to assume his arrows travel at speeds meeting or
        exceeding the World Record of 550 mph)
      source_id: character-stats-profiles-green-arrow-millerverse-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: Small Building Level (Downscaling from 0.095 Tons - Should scale to his
        AP as per Newton's Third Law. Got up immediately, only being scuffed from
        dirt, after being a few meters away from the explosion of his and Speedy's
        quantum arrows - however, exactly how much force he took in this instance
        is difficult to determine. Kept fighting after blows from an angry Wildcat,
        who could allegedly fight evenly with Black Canary, defeat Tracer (as evidenced
        by being the Meta-Brawl's champion - Tracer being capable of tackling Batman
        and hurting him with a punch), and destroy a wall with one hit)
      source_id: character-stats-profiles-green-arrow-millerverse-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Normal Human Weaknesses, with the only tie in comics that have statements
        to the contrary (other than Batman: The Adventures Continue, which has so
        many continuity issues that it''s essentially impossible to argue it''s canon)
        being Justice League Infinity, the Batman and Harley Quinn tie in comics,
        and specifically the first annual of Batman Adventures. Ergo'
      source_id: character-stats-profiles-green-arrow-millerverse-dc-comics
