  intelligence:
    text: Trained from infancy by his mother, Talia al Ghul, Damian is an expert hand-to-hand
      combatant able to keep up with all but the best martial artists in close combat
      and can wipe out scores of henchmen and even elite ninjas with ease. He also
      regularly spars with Nightwing and Batman. He has also used staves, swords,
      spears, knives, and other armaments, even managing to hold off Deathstroke long
      enough to send money to the latter's account. Also, having been raised by the
      League of Assassins, he is adept in stealth maneuvers, detective work, vehicle
      operation, and other skills. He is also empathetic towards animals, owning several
      pets, including a cowardly but physically strong and flight-capable gargoyle
      named Goliath. However, having been spoiled and raised with limited social interaction,
      he is often arrogant to the point of being reckless, with his lack of a father
      figure in his earlier years making him desperate to seek acknowledgment and
      recognition from him. Thus, he sometimes makes poor decisions when he gains
      the upper hand.
    source_ids:
    - vsbattles-robin-dc-comics
    confidence: 0.6
    notes: auto_repair source extraction
