  attack_potency:
    text: 'Low Complex Multiverse level (As the former leader of the Female Furies,
      Barda is a powerful New God capable of fighting Pre-Clayface Wonder Woman and
      fought alongside Post-Clayface Wonder Woman in a death matchSuperman/Batman
      Vol 1 #11, August 2004. Dealt grievous damage to Superman with her Mega Rod.
      She was able to fight the Female Furies and Lobo with physical force. She was
      able to hit Wonder Woman One Million so hard that the impact scale broke)'
    source_ids:
    - vsbattles-big-barda-dc-comics-post-crisis
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
