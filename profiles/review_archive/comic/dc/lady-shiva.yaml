- id: claim-weaknesses-7f3ae95c
  section: weaknesses
  axis: weakness
  text: "Shiva is extremely confident in her abilities and constantly seeks a good\
    \ fight above all. She also seeks her own death at the hands of a superior combatant.\
    \ Notes: * Shiva\u2019s Classic tier covers everything up to approximately 1996,\
    \ and her Modern tier covers 1998 and beyond. However, there isn\u2019t really\
    \ a definitive point of separation for Shiva\u2019s tiers because she is always\
    \ training and improving, to the point that herself in one year would be \u201C\
    inept and obsolete\u201D compared to her by the next year. * Before making any\
    \ changes to this page, please read and follow the Power-scaling Rules for Marvel\
    \ and DC Comics. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==\
    \ {{scroll box|content={{reflist|2}}}} {{discussions|Lady Shiva Post-Crisis|Lady\
    \ Shiva (Post-Crisis)}} Category:Characters Category:DC Comics Category:Female\
    \ Characters Category:Comic Book Characters Category:Martial Artists Category:Anti-villains\
    \ Category:Assassins Category:Vigilantes Category:Humans Category:Villains Category:Leaders\
    \ Category:Weapon Masters Category:Stealth Masters Category:Precognition Users\
    \ Category:Social Influencers Category:Acrobats Category:Pressure Point Users\
    \ Category:Paralysis Users Category:Parents Category:Preparation Users Category:Resurrection\
    \ Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-d36a2e2d
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Master Martial Artist (Constantly stated\
    \ to be theBatman Vol. 1 #509, July 1994 greatestBirds of Prey: Manhunt #4, December\
    \ 1996 martialBatgirl Vol. 1 #8, November 2000 artistBatgirl Secret Files and\
    \ Origins, August 2002 on the planet. Batman stated that Shiva knows at least\
    \ a dozen forms and a hundred techniques. She is the world master of all fighting\
    \ formsRobin Vol. 2 #50, February 1998. Batman has never beaten her in single\
    \ combat. Stated to be the most dangerous and deadly martialRobin Vol. 2 #52,\
    \ April 1992 artistBirds of Prey Vol. 1 #62, Feburary 2004 in the world), Enhanced\
    \ Senses (Detected Shadowdragon while he was invisibleShowcase \u201896 #9, September\
    \ 1996), Stealth Mastery (Managed to follow Green Arrow despite him making sure\
    \ he wasn\u2019t followedGreen Arrow Vol. 2 Annual #1, September 1988. Disappeared\
    \ from Tim Drake without him noticingRobin Vol. 1 #5, May 1991. Snuck up on Cassandra\
    \ Cain), Acrobatics (Performed a backflipQuestion Annual #1, October 1988 and\
    \ dodged bulletsBatman Chronicles #22, September 2000), Pressure Points and Paralysis\
    \ Inducement (Paralyzed a helicopter pilotQuestion Vol. 1 #36, March 1990 and\
    \ Cassandra Cain with nerve strikes), Weapon Mastery (Batman stated that Shiva\
