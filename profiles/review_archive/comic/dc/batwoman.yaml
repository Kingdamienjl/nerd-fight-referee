        market deals with crooked former Marines to get equipment in her early days
        as a vigilante. **Knows about a Religion of Crime coven before Batman does.
        **Knows how to collect blood samples for DNA testing, and what to test for.
        **Gets a hostage to help defeat a kidnapper. **Studies the occult. **Can read
        footprints well enough to know there are no outliers. **Researches the legend
        of the Weeping Woman and uses meditation to figure out her weakness. **Finishes
        picking a lock without looking. *Strength **Throws a robber roughly six feet
        with one arm while sitting. Hits another with a volleyball pole, and smacks
        another with his bag of loot so hard that a bunch of jewels get stuck in his
        face. **Keeps a man braced against a wall with one foot. **Bench-presses 165
        lbs (50 and 10 lb plates and a 45-lb bar). **Grapple-swings while carrying
        a woman in one arm. After landing, throws her what looks like ten or so feet,
        also one-handed. **Casually throws a knife hard enough that it gets stuck
        in a wooden door. **Punctures a fuselage with her gauntlet and holds a woman
        by the wrist. **Punches a shapeshifter so hard he changes back into a human.
