    - field: weaknesses
      value: "Normal human weaknesses but has survived situations which would kill\
        \ an average human, refuses to kill. Notable Attacks/Techniques: * Batarangs:\
        \ Boomerangs shaped like his symbol, he can use these to knock guns out of\
        \ enemies' hands and KO them. There are also varieties, such as exploding\
        \ batarangs, tracking batarangs, electrocuting batarangs, freezing batarangs,\
        \ etc. * Stealth: Batman is an absolute master of stealth, being capable of\
        \ disappearing and staying hidden, even from beings with senses as strong\
        \ as Superman. Batman is also a master of disguise, being capable of disguising\
        \ himself as people of different races and ages. Batman is known for his ability\
        \ to be completely unnoticed and unseen through these methods. *Senses: Batman\
        \ has honed his senses to perfection, allowing him to achieve analysis most\
        \ others cannot. This includes smelling chemical changes and pheromones in\
        \ order to smell his foe\u2019s emotion, hearing normally unnoticed sounds\
        \ in Gotham, and seeing things far too far away for a normal eye to see. *Preparation:\
        \ Batman is a master of using resources and time in order to prepare himself\
        \ for any objective. While Batman is a nearly unrivaled scientific genius,\
        \ the real danger comes from his ability to predict situations that may arise\
        \ and plan for nearly any future conflict. Even before a situation shows the\
        \ possibility of occurring, Batman has likely already planned for it. For\
        \ example, Batman has planned methods to kill every one of his allies individually\
        \ should the need arise, prepared a extra mind just in case he needed it,\
        \ and observed the majority of what can be considered human culture, from\
        \ song references to obscure shows, in order to be ready for any threat, among\
        \ many other things. Respect Thread: Post-Crisis and Flashpoint Respect Thread\
        \ ==Others== Notable Victories: Notable Losses: Inconclusive Matches: Category:Tier\
        \ 8 Category:Tier 4 Category:Spinosaurus75DinosaurFan"
