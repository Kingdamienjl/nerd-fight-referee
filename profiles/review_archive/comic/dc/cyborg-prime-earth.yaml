    - field: attack_potency
      value: Extraversal (Endured the destruction of Space and Time and punched through
        the concept of his own death that caused it. A clash with another Superman
        caused Space and Time to shatter. Broke the Primordial Void to save Lois Lane.
        For reference, the void is the foundation of dreams, which itself is beyond
        space, time and dimensions. Ascended into the Dreaming, which is also beyond
        Space, Time and Dimensions. Could survive various forces of the Cosmology,
        such as speed and gods, and repel it with his heat vision. His fight with
        Rogol is said to cause the Phantom Zone to tremble from this fight, and Superman
        has said he could destroy said realm if he puts his mind to it. Broke a hole
        in the source wall, which is several layers above the Godsphere. Destroyed
        the World Forger's Multiverse, likely consisting of up to the 5th dimension,
        considering a corrupted Myxy and how he's a sixth dimensional entity, with
        one punch. The 5th Dimension itself is an infinite layer above the Godsphere,
        and the 6th dimension is an infinite layer above that. This was during a dip
        in 6th dimensional suns however, so it's unknown whether he can access this
        normally. Knocked out Auter.io and Barbatos with one punch, both of which
        being able to create and destroy stories. These would be inconsistent with
        his encounter with Mandrakk however, who could cause similar damage, yet Superman
        needed the Cosmic Armor to match. States that his mind and body are stronger
        than they've ever been, potentially including his amp from the 6th dimension,
        however it's unknown whether or not this is accurate, as the other statements
        he brings up in this moment are already comparable to his older self. Most
        of these feats affect areas far, far above the infinite dimenisons in DC.)
