        \ tommy-gun fire), with Superhuman running speed (Briefly kept ahead of Dick\
        \ Grayson) | Hypersonic combat speed and reactions (Scaling to Mach 8.7 -\
        \ Should be at least slightly faster considering her two years of training\
        \ with Batman. Stated to be faster than Nightwing in combat. Reacted to a\
        \ bullet and moved around a lot during its flight. Shown to be as fast as\
        \ Harley Quinn), possibly as high as Relativistic+ reactions and combat speed\
        \ (Scaling to 0.53c - As mentioned earlier, slightly superior to Batman and\
