    - field: powers_and_abilities
      value: "In her B:TAS key, Barbara boasts: * Superhuman Physical Characteristics\
        \ (See Attack Potency, Speed, and Durability) * Superhuman Athleticism (Performs\
        \ inhumanly high leaps in her debut) * Hand-to-Hand Combat Skills (Even prior\
        \ to training with Batman, she had been instructed in self-defense) * Acrobatics\
        \ (Shown to be prodigious at acrobatics, casually doing incredible flips)\
        \ With her BTAS key's Optional Equipment, she can utilize: * Smoke Manipulation\
        \ (Used a smoke grenade against Two-Face's gang) In her TNBA key, Barbara\
        \ now wields: * Superhuman Physical Characteristics (See Attack Potency, Speed,\
        \ and Durability) * Genius Intelligence (See Intelligence) * Hand-to-Hand\
        \ Combat Mastery (According to Batman: Animated (a book about the production\
        \ of BTAS and TNBA written by the show's crew), has honed her \u201Cphysical\
        \ and deductive skills\u201D to the point that they \u201Call but rival (Batman\u2019\
        s).\u201D Is playable in Rise of Sin Tzu - every single playable character\
        \ in Rise of Sin Tzu is regarded by the game's manual as wielding \"extraordinary\
        \ martial arts abilities.\" Is an \"accomplished martial artist.\" Takes on\
        \ foes with \u201Cacrobatic fighting skills.\u201D Stated to possess \"combat\
        \ training.\" Shown to know at least basic judo throws) * Enhanced Senses\
        \ (Noticed Terry McGinnis was in her office despite him being invisible, and\
        \ trained in stealth by Bruce Wayne - for reference, even a highly trained\
        \ field member of the NSA had no idea Terry was there despite being just feet\
        \ away from him. Was also trained by Bruce Wayne, and as such should have\
        \ received the same training that granted Tim Drake inhumanly sharp hearing)\
        \ * Weapon Mastery (with Gadgets such as Batarangs - in example, she can throw\
        \ a Batarang accurately enough to disarm Mr. Freeze) * Vehicular Mastery (with\
        \ the Batmobile and her Motorcycle, both of which she's shown driving with\
        \ expertise) * Greater Acrobatics (Is now an olympic-level athlete. Avoided\
        \ beams from Mr. Freeze's blaster with flips. Flipped to avoid energy beams.\
        \ Easily traversed an airborne gymnastic course) * Greater Superhuman Athleticism\
        \ (Has jumped absurdly far) * Paralysis Inducement (Can restrain foes with\
        \ her Bola, Rope Batarangs, and these capsules which create a strong adhesive)\
        \ * Electricity Manipulation (Uses an electrified Batarang) * Adhesive Manipulation\
        \ (via Adhesive Pellets) * Light and Sound Manipulation (via Flashbangs) *\
        \ Smoke Manipulation (via Smoke Pellets) * Explosion Manipulation (Shown to\
        \ use an explosive) * Hacking (Can hack into the door system of a vault. Even\
        \ better with technology than Batman and Nightwing) * Preparation (Prepared\
        \ silicate powder specifically to take on Livewire) * Vehicular Mastery (with\
        \ the Batmobile, seemingly) With her Optional Equipment, she can utilize:\
        \ * Batmobile: Fire Manipulation and Smoke Manipulation (The Batmobile can\
        \ shoot flame and fire smoke bombs) * Negation of Electricity (with Silicate\
        \ Powder) Despite never demonstrating these, it is very likely that, due to\
        \ studying under Batman, Batgirl possesses Stealth Mastery, Escapology Mastery,\
        \ Disguise Mastery, et cetera. Due to being a close ally of Batman who has\
        \ access to the Batcave, it stands to reason that her optional equipment could\
        \ include all of Batman's equipment, as she could reasonably access it and\
        \ use it in battle."
      source_id: character-stats-profiles-batgirl-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: At least Wall Level (At least 17 Kilojoules - Can brawl with and knock
        out hardened criminals, some of them twice her size - said criminals should
        scale to (at least) the likes of Doctor Destiny, who outside of the Dreamscape
        is only an average, somewhat frail man), possibly higher physically (Made
        Robin slightly stagger back with a kick, though she did no real damage. Was
        similarly capable of knocking back Mr. Freeze with a kick, though she could
        seemingly only do so because she caught him off guard), higher cutting damage
        with Batarangs | Small Building Level (Scaling to 0.095 Tons - Considering
        she is said to have spent the two-year timeskip between BTAS and TNBA "honing
        her physical abilities" in hopes of being a better vigilante, it seems only
        intuitive that she would have become substantially stronger. Fought Harley
        Quinn (who could harm Nightwing as well as Batman), one-sidedly beating her
        down. Struggled with Catwoman. Kicked TNBA era Clayface hard enough to warp
        his face and knock him over. In Rise of Sin Tzu, can fight and beat down the
        game's common enemies (kicking them into concrete hard enough to notably crater
        it and punching them through wooden fences), who, during one story mission,
        are shown to, over time and with several minutes of constant attack, wear
        down and damage the Batcave's thick metal security doors. Should be comparable
        to The Penguin's henchwomen, who could kick Batwoman through a concrete wall,
        making a large crater. Kicked a door down), possibly higher (Using the Batrope,
        was able to temporarily restrain Calendar Girl's mechanical dinosaur, which
        was powerful enough to smash apart rocky cliffsides just by headbutting them
        - though this is a pretty transparent outlier overall), higher cutting damage
        with Batarangs
      source_id: character-stats-profiles-batgirl-dc-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: "Hypersonic (Scaling to Mach 8.7), possibly Relativistic+ (Scaling to\
