    - field: intelligence
      value: 'Genius (Ollie was remembered as history''s greatest archer by the year
        3000.Adventure Comics Vol 1 251 Consistently shown to be growing in skill,
        to the point where a rusty or tired Ollie easily performed feats superior
        to nearly any other archer. His skill is only truly rivaled by Merlyn the
        Dark Archer and Arsenal, and was said to be an even better marksman than Deadshot,
        who had perfect aim.Deadshot Vol 2 2 Beyond just being an impeccable shot,
        Ollie has extensive knowledge of human biologyLong Bow Hunters Vol 1 1Green
        Arrow Vol 2 2Green Arrow Vol 3 15The Question Vol 1 17The Brave and the Bold
        Vol 2 21Green Arrow Vol 2 22 and the construction of vehicles, which he often
        uses in battle. His resourcefulness in combat has additionally allows him
        to use the environment itself as a key asset.Green Arrow Vol 2 7 In addition
        to his archery, Ollie is shown to be one of the worlds'' best combatants,
        capable of outsmarting Deathstroke and the League of Assassins on numerous
        occasions. Knowing his limits, the Emerald Archer frequently trains with Wildcat,Identity
        Crisis Vol 1 1 the Justice League,Identity Crisis Vol 1 3 and for a year straight,
        the greatest teachers in the world to vastly improve his abilities ) Genius
        (Ollie is an expert hunter with a deep knowledge of survival and tracking.
        He has learned to study the subtle movements of prey animals to a tee and
        can tell the obscure differences between footprints. Memorized very square
        inch of the Star City Forest, in all of its confusing glory,Green Arrow Vol
        4 1 Skilled at bandaging wounds.Green Arrow Vol 2 4) Gifted (Ollie proved
        himself to be a skilled politician in his run as mayor of Star City, gaining
        a high approval rate and flawlessly executing complicated legal procedures
        to punish his opponents) Standard Tactics: Although traditionally a long-ranged
        fighter, Ollie is by no means a one-trick pony. An expert acrobatic, Ollie
        consistently uses his agility and nimbleness to overwhelm his enemies, a tactic
        that even worked on highly skilled combatants such as Roy Harper and Deathstroke.
        Unlike many DC heroes, Ollie is willing to kill under extreme circumstances,
        admitting that he doesn''t have a reason to keep sparing Merlyn''s life and
        killed several terrorists with explosives. He is, however, still a merciful
        and compassionate man who will spare the lives of most of his enemies, and
        has even shown a great deal of compassion towards Solomon Grundy.'
