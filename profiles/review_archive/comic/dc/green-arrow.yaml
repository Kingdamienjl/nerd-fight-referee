- id: claim-weaknesses-9e54a98f
  section: weaknesses
  axis: weakness
  text: 'Ollie is easily seduced by women, even cheating on his lover Black Canary,
    whom he loves dearly, without hesitation. He is also inherently sympathetic to
    marginalized groups, which while this is usually a strength that allows him to
    gain allies, has been used to manipulate him in the past. ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== : References in bold are Pre-Crisis
