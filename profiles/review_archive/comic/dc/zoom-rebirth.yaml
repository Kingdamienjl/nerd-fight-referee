    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Speed of Light (Jesse describes him as a light-speed sociopath.) Unknown
      (Faster than Post-Crisis Jay and Post-Crisis Wally. At this point, Wally has
      escaped the concept of death.) Infinite (The Forever Force allows him to slow
      down time to a complete stop.) At least Immeasurable (He speed blitzed the Justice
      League and the Titans. Superman can fly fast enough to travel through time.)
      Irrelevant (Zoom fought Wally and Barry at the same time. Wally outran the Speed
