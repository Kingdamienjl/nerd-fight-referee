    confidence: 0.75
    notes: auto_repair source extraction
  intelligence:
    text: 'Genius (As a one of the best and youngest criminal profilers the FBI has,
      he is trained in psychology, criminology, sociology and investigative support
      training from the FBI,The Flash Secret Files Vol 1 #3 solved numerous metahuman
      related cases over the years, deduced the motivation and problems of several
      criminals as well. Was able to repair parts of the Cosmic Treadmill after reading
      the automatic override instructions while in a wheelchair,The Flash Vol 2 #196
      and later rebuilt the treadmill all by himself.) Standard Tactics: Despite being
      able to control how fast or slow he moves while riding time itself, he prefers
      to keep it slow and calculated; focusing on letting those who he believes can
      become better heroes to work through their problems and tragedy instead of wanting
      them to fail, however, against those who are not he won''t hold back against
      them, although he prefer not to killThe Flash Vol 2 #223 or making it as painless
