    text: Multiverse Level, likely higher (He sent Post-Crisis Jay flying. Jay was
      comparable to Barry Allen, who defeated the Anti-Monitor. The Anti-Monitor destroyed
      all but 5 universes in the Multiverse.) Multiverse Level+ (Zoom's punch hurt
      more than Superman's. Post-Crisis Superman's fight with his Golden Age self
      shattered the boundaries of space and time.), High Outerverse Level (One-shots
      the Justice League and the Titans. Superman broke a part of the Source Wall.)
    source_ids:
