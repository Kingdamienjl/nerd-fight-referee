  intelligence:
    text: "Genius. Bane was able to go from being illiterate to reading three books\
      \ a day and learning how to read in six languages. He read all of the books\
      \ in the Pe\xF1a Duro library, of which there were thousands, and read many\
      \ more books that were smuggled in to him. He was able to single-handedly deduce\
      \ that Bruce Wayne was Batman. He is a master strategist and a student of every\
      \ military leader and conqueror in history. He was able to recognize a chess\
      \ play even though he\u2019d never seen a chessboard before,Batman: Bane of\
      \ the Demon #2, April 1998 and merely a day later, he was challenging Ra\u2019\
      s Al Ghul in a game of chess.Batman: Bane of the Demon #3, May 1998 Ra's Al\
      \ Ghul regarded Bane as an equal to the greatest minds that he\u2019d ever known.\
      \ He is also a skilled chemist that could recreate Venom with only a little\
      \ bit of help. Standard Tactics: Prior to and during Knightfall, Bane rarely\
      \ ever fought without Venom, but after Knightfall, he would never use it. He\
      \ is almost exclusively a hand-to-hand fighter that occasionally makes use of\
      \ guns."
    source_ids:
    - vsbattles-bane-dc-comics
