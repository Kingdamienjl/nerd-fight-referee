  stamina:
    text: "Superhuman (During his time in Pe\xF1a Duro, he did intense exercises every\
      \ day: a thousand push-ups, sit-ups and pull-ups and meditation for four hours\
      \ instead of sleeping. He could continue fighting despite taking several hits,\
      \ stabs and slashes, he literally ignored having Batarangs shot into his back\
      \ and still survived being beaten down by Azrael. While in Blackgate Penitentiary,\
      \ he ran twenty miles every day for six months and swam through a thirty-knot\
      \ current with no problem. Escaped a prison hundreds of feet below the surface\
      \ without showing signs of fatigue. Easily climbed up a cliff in the middle\
      \ of a hurricane with 120 mph windsAzrael #38, February 1998)"
