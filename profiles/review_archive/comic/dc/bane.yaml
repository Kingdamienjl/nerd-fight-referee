        \ deduce that Bruce Wayne was Batman. He is a master strategist and a student\
        \ of every military leader and conqueror in history. He was able to recognize\
        \ a chess play even though he\u2019d never seen a chessboard before,Batman:\
        \ Bane of the Demon #2, April 1998 and merely a day later, he was challenging\
        \ Ra\u2019s Al Ghul in a game of chess.Batman: Bane of the Demon #3, May 1998\
        \ Ra's Al Ghul regarded Bane as an equal to the greatest minds that he\u2019\
        d ever known. He is also a skilled chemist that could recreate Venom with\
        \ only a little bit of help. Standard Tactics: Prior to and during Knightfall,\
        \ Bane rarely ever fought without Venom, but after Knightfall, he would never\
