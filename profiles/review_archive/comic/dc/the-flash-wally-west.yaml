    - field: weaknesses
      value: 'Various types of energy can affect him even while moving or functioning
        at superhuman speeds, as well as effectively diminish/cut off his connection
        to the Speed Force. Using the Speed Force excessively and recklessly can result
        in him being permanently trapped in it. He cannot alter the kinetic energy
        of objects that gain their speed from time manipulation. He also needs a massive
        amount of food to compensate for his greatly accelerated metabolism. Feats:
        * Wally escaped a black hole and outraced the explosion of Krypton and Zeta-Beams.The
        Flash Vol 2 #137 May 1998 *He reset every radio on earth in one sextillionth
        of a second. *He ran to the Heat Death of the Universe to defeat the Black
        Racer. *The Flash Feats Timeline Project Notable Attacks/Techniques: *Relativistic
        Mass Punch: By accelerating to near the speed of light, he uses the Speed
        Force to allow the effects of relativity to increase the mass of his body,
        thus allowing him to hit with an incredibly powerful punch (said to hit like
        a white dwarf). *Speed Force Dump: After touching his opponent, he can send
        them into the Speed Force. *Speed Steal: By touching (or just being near)
        an opponent, he can steal all of their kinetic energy and momentum, adding
        them to his own. In addition to slowing the targets down, it also immobilizes
        them indefinitely, making them frozen like statues. Note: * Before making
        any changes to this page, please read and follow the Power-scaling Rules for
