  intelligence:
    text: 'Gifted (An experienced fighter to the extent he could fight a faster and
      stronger alternate Superboy and deduced his overarching plan.Action Comics Vol
      1 #591, August 1987 Quickly figured out how to cut off Gunge''s power source
      and defeat himSuperman: The Earth Stealers, May 1988) | Extraordinary Genius
      (Superman is well-acquainted with highly advanced Kryptonian technology and
      has used it to build and maintain the Fortress of Solitude, memorized the design
      of the Miracle Machine and has repeatedly outsmarted Lex Luthor. He is skilled
      in Torquasm Vo, a Kryptonian martial art. Good deductive and leadership skills.
      He has massive battle experience with all kinds of powerful beings, and is highly
      resourceful, with his quick thinking saving countless lives on numerous occasions.
      His mastery over his powers is greater than that of the Kryptonian Military
      Guild.Superman: World of New Krypton #1 He was trained in rapidly recognizing
      and analyzing situations in mere seconds by BatmanSuperman/Batman Annual Vol
      1 2JLA Classified Vol 1 #32, March 2007) Standard Tactics: Superman is known
      for holding back his immense strength due to his kind and good-hearted nature.
      He vows to never kill or seriously harm, and thus, almost never goes ''all out''.
      *Superman admits to holding back against his enemiesSuperman Vol 2 #153, February
      2000 *Superman goes through great care not to hurt people, and only goes hard
      against people who can take it.Action Comics Vol 1 #831, November 2005 **Note:
      This doesn''t mean he goes all-out, but that he''ll just go a bit stronger against
      these guys *Superman decides he has to be as relentless as Doomsday, implying
      he wasn''t going all out before, when he really should have.Superman Vol 2 #75,
      November 1992 *A "sun drunk" Superman has to actively hold back so he isn''t
      a danger to othersSuperman: The Man of Steel Vol 1 #50, November 1995 *Superman
      says he''s stronger because he doesn''t use his full power *It''s said that
      Superman could easily crush others with his superspeed, but doesn''t because
      he''s a good person and can hold back his powers to insane degreesBatman: Hush
      *Batman stated that Superman holds back his power and regulates it subconsciously
      without him even realizing it.JLA Classified Vol 1 #32, March 2007'
    source_ids:
    - vsbattles-superman-post-crisis
