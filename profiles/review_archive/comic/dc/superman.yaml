        \ of Raptors. *Super Breath: By exhaling moisture laden air super cooled in\
        \ his lungs, Superman pushes targets in front of him or himself backwards\
        \ far away, also capable of stopping fires. SUPERMAN_FREEZEBREATH.gif|Superman\
        \ using Super Breath *Flight: Can propel himself at varying speeds within\
        \ the air. SUPERMAN_FLIGHT1.gif|Superman flying off == Notable Matchups ==\
        \ |-|Victories= *Godzilla (Godzilla Minus One) Godzilla's Profile (Post Mutation\
