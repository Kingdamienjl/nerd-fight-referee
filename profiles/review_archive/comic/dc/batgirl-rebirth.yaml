        \ blasts while it traveled toward her. Dealt with Livewire's lightning - in\
        \ one instance moving to block a blast while it flew toward her before it\
        \ could cross just a few feet - moving at Mach 502 to do so), with Subsonic\
        \ travel speed with her Motorcycle (Should be as fast as IRL motorcycles)\
