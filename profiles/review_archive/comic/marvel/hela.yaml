    - field: weaknesses
      value: 'If she is deprived of her cloak, Hela reverts to her true form, and
        her life force is insufficient to maintain her usual physical strength without
        it, making her unable to stand, levitate, project mystical bolts, or even
        crawl. The right side of her body is fully alive, but the left side is dead
        and decayed. Feats: Notable Attacks/Techniques: *Control Over Life & Death:
        As the Asgardian Goddess of Death, Hela holds the power of life and death
        over the Asgardians. An Asgardian''s death is somewhat different from the
        death of a human. While mortal spirits flee the physical form at the moment
        of death, the spirits of gods remain in their bodies until Hela draws them
        out and dispatches them to the realms of Hel and Niflheim. These spirits remain
        integral for eternity and reside under Hela''s control within dimensions.
        However, Hela''s control over death extends beyond only the Asgardians, also
        affecting the beings of Midgard. She can will mortals into dying with nothing
        but a glare or a touch, and either speed up a being''s aging or render them
        immortal through her powers. She is so integral to human death that when she
        died no being on Earth could perish anymore. Note 1: Before making any changes
        to this page, please read and follow the Power-scaling Rules for Marvel and
        DC Comics. Note 2: In an early appearance, it''s established that either Hela
        or an aspect of Hela (presumably the latter) comes to the people dying at
        least on Earth to "cause them" their deaths (while it simultaneously comes
        naturally to them) and carry away their souls. Hela may do this to either
        everyone as they die or some of them as she chooses, and she is physically
        present in one place as this happens elsewhere, somehow. She can even be defeated
        while people still die, potentially meaning that she can still do this function
        when defeated, or that she isn''t doing it because she doesn''t always perform
        this function. This mechanics & powers may or may not have been dropped &
        retconned over the years (or downgraded to an unknown degree). Similar to
        this unexplored powers, Hela has claimed to know the exact date & time of
        Annaihilus'' one true final death, as well as who kills him and how; this
        could be because an aspect of Hela will be there to carry his soul, if so
        making it a reference to those powers, or it simply could be coincidence,
        with this simply being its own, unrelated powers. Either way, Hela is immensely
        inconsistent and doesn''t even use this knowledge of when characters are going
        to die to her advantage more often than not, attacking others with a killing
        intent & getting herself defeated when she should be fully aware of the time
        & specifics of her enemies'' deaths in the first place. ==Notable Matchups==
        Victories: Losses: Inconclusive: ==References== {{Scroll box|{{reflist|2}}}}
