  attack_potency:
    text: 'Varies (Due to the Odinsleep factor, which causes his Odinforce to go up
      and down. When in a near depleted state, he can enter the Odinsleep to restore
      his powers) from Galaxy level (At his weakest, he is almost consistently still
      portrayed as comparable to the likes of Thor. Fought evenly against Jane Foster
      ThorThe Mighty Thor #5) to Low Outerverse level (His fight against Seth tore
      at the fabric of the multiverse itself and sent forth shockwaves that rippled
      through every plane of reality, with Silver Surfer stating that the forces unleashed
      by them could "rock our entire continuum,"Journey into Mystery; Vol 1; #513
      thus affecting the internal contents of Eternity itself. His power is said to
      be comparable to Galactus''s own,Thor; Vol 1; #168Fantastic Four: World''s Greatest
      Comic Magazine #11 and the two stood evenly matched in direct confrontationMighty
      Thor; Vol 1; #3Mighty Thor; Vol 1; #4). Can ignore conventional durability via
      several abilities'
