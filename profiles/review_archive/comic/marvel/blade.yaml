      value: 'Gifted. Blade is the best vampire hunter in the world, feared by vampires
        everywhere.Blade Vol 1 1 His vampire hunter training includes miscellaneous
        abilities such as being able to recognize false antiques and pickpocketing,
        as well as encyclopedic knowledge of vampires and demons and even eldritch
        beings like Shuma-Gorath.Mighty Avengers Vol 1 3 Blade has been fighting vampires
        since he was 12 years old,Avengers Vol 8 14 and has clashed with master combatants
        such as Dracula, Wolverine and Spider-Man. Standard Tactics: Blade is sometimes
        depicted as being unwilling to kill humans,Blade Vol 4 12 though this isn''t
        always the case. Either way, he is incredibly brutal towards vampires, typically
        showing no mercy and using all of the many weapons at his disposal to eliminate
        them.'
