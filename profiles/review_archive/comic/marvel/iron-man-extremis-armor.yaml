        \ such as satellites, cellular phones, and computers throughout the world.\
        \ Stark was capable of projecting his voice through transmitting sound systems\
        \ such as cellular phones via electronic transmissions from his central nervous\
        \ system.Iron Man Vol 4 #5. It can crack codes entire nations couldn't, and\
