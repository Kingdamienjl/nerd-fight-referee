    - field: intelligence
      value: Extraordinary Genius. Charles Xavier is one of the most intelligent people
        on Earth, being arguably its most powerful telepath and specializes in genetics
        and biology. Has at least 3 PhDs and invented the Cerebro and Cerebra telepathy-boosting
        machines. Due to his telepathic excursions, he has acquired a great deal of
        information from around the world, including knowledge of various cultures,
        fields of science, and important events. As a result of his military training,
        Xavier is also experienced in martial arts and the use of pressure points,
        allowing him to incapacitate those who are much younger and more agile than
        him and has spent decades preparing the X-Men for nearly every conceivable
        threat. In addition, he is savvy enough to develop the Xavier Protocols, a
        series of countermeasures to incapacitate the X-Men should they or he become
        a danger to mankind.
      source_id: vsbattles-professor-x-classic-marvel-comics
