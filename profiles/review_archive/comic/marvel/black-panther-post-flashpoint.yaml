        protect him from undead enemies, i.e. Dracula)Stating in {{cl|Captain Britain
        and MI13 Vol 1 10}} that he has always anticipated war between himself and
        Dracula. Considering Doom''s capabilities to time travel, there is possibility
        of this being true. ** Optional Systems: The following devices could be added
        to Doom''s armor at his whim, but Doom himself only carried them if he felt
        he would need those:{{r|Machines of Doom Vol 1 1}} *** Energy Fist{{r|Machines
        of Doom Vol 1 1}} *** Fingertip Darts{{r|Machines of Doom Vol 1 1}} *** Image
        Projector{{r|Machines of Doom Vol 1 1}} *** Inhibitor Ray{{r|Machines of Doom
        Vol 1 1}}{{r|Fantastic Four Vol 1 246}} *** Instant Hypnotism Impulser{{r|Machines
        of Doom Vol 1 1}} *** Intensified Molecule Projector{{r|Machines of Doom Vol
        1 1}} *** Ionic Blade{{r|Machines of Doom Vol 1 1}} *** Knuckle Rockets{{r|Fantastic
        Four Vol 1 318}} *** Mini-Missile Launcher{{r|Machines of Doom Vol 1 1}} ***
        Nerve Impulse Scrambler{{r|Machines of Doom Vol 1 1}} *** Neuro-Space Field{{r|Machines
        of Doom Vol 1 1}} *** Sleeping Gas{{r|Incredible Hulk Vol 1 143}} *** Refrigeration
        Unit{{r|Machines of Doom Vol 1 1}} *** Sonic Drill{{r|Machines of Doom Vol
        1 1}} *** Stun-Shocker{{r|Machines of Doom Vol 1 1}} As a genius-level inventor
        and monarch of a sovereign nation, Doom can attain many other pieces of equipment
        as needed. * Cloak of Levitation: As the new Sorcerer Supreme, Doom got hold
        of Strange''s Cloak that allowed him to levitate.{{r|Blood Hunt Vol 1 5}}
