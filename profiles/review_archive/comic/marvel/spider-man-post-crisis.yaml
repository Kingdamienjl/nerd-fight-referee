        \ of Spider-Man and Superboy (Pre and Post-Crisis), but his secret identity\
        \ of Pete Ross is a reference to Superboy's best friend in Smallville. The\
        \ name also reflects Spider-Man clone Ben Reilly's fashion of naming himself,\
        \ being a composite name inspired by the two most significant influences in\
        \ his life (Reilly being Aunt May's maiden name). Both clones also alter their\
