    - field: weaknesses
      value: 'Carbonadium can weaken his healing factor and his metal skeleton makes
        him susceptible to attacks based on electricity, magnetism, and Antarctic
        Vibranium (which dissolves atomic/molecular bonds within metals). Wolverine
        can die from decapitation, suffocation and metal poisoning without his healing
        factor, destroying all of his cells.Wolverine: Killing Made Simple #1, October
        2008 Notable Attacks/Techniques: *Berserker Rage: Triggered by a fierce battle,
        Wolverine enters a feral state where he attacks like a wild animal and becomes
        more resistant to telepathy. *Fastball Special: Usually Colossus (though any
        Strong Man/Woman will do) picks up Wolverine and hurls him like a baseball,
        claws forward at a distant enemy or crowd. Notes: *This profile only covers
        the original Marvel Comics version of Wolverine. *Due to how wielders of sharp
