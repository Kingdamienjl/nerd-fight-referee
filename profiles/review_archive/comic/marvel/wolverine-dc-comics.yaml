    - field: weaknesses
      value: '* Memory Issues: Likely due to his healing factor, Wolverine has experienced
        large periods of life without memories of certain traumatic events. * Sensory
        Overload: One of Wolverine''s weaknesses is the fact that his heightened senses
        could be taken advantage of. For instance, when Wolverine was fighting the
        Hulk (Bruce Banner), he was nearly killed by the Hulk''s thunderclaps due
        to his heightened sense of hearing. * Adamantium Allotropes: The Adamantium
        has thirteen different allotropes (variants) that are very unstable compared
        to Adamantium because of their different molecular configurations and thus
        physical properties. For example, Adamantium nine caused Wolverine to become
        dizzy and weak just by being in close contact with it. * Hot Claws: A new
        addition to his abilities that comes with the drawback of weakening his regenerative
        ability the longer he has them active, having gone full tilt berserker during
        a skirmish with the X-Men leaving him drained of stamina as they absorb energy
        from his Healing Factor in order to work. * Drowning: Of the few ways to kill
        Wolverine, given drowning . He has admitted that being kept underwater can
        kill him, with the healing factor only prolonging the agony. Wolverine added
        that he is not fond of being on water, as the addition of nearly 100 pounds
        of Adamantium to his body reduced his buoyancy. * Muramasa Blade: Wolverine''s
        only specific vulnerability known to date. Created by having his soul infused
        into the katana, the efficiency of his mutant healing factor is decreased
        dramatically if he sustains injury from the Muramasa Blade. Wolverine has
        been wounded once with the blade and, though the injury was very minor, it
        did not heal completely for 2 days. Later the blade was broken and a piece
        of it was stolen by Daken and laced to the underside of his two wrists'' bone
        claws, similar to his father''s bonding process, by Phineas Mason (Tinkerer).
        Logan later removed the pieces of the Muramasa blade from Daken''s arms and
        buried them with the rest of the blade in an unmarked grave near the Howlett
        Estate in Alberta. After Logan''s death, Laura Kinney and Carol Danvers were
        tricked into revealing the location of the blade and its fragments to the
        Orphans of X who melted it down and forged it into several bullets. With the
        onset of X of Swords however, two all new Muramasa Blades were made by the
        late Swordsmith in the depths of Hell. It was made evident that the mystic
        incisor can cut through Adamantium as stated by Logan himself. {{Navigation'
      source_id: fandom-marvel-wolverine-dc-comics
