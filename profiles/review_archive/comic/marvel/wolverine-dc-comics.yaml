    - field: standard_equipment
      value: 'Throughout his life, Wolverine has used a variety of bladed weapons,
        most frequently daggers and, at times, swords; as a samurai, he was especially
        skilled with the katana. He has also wielded many different types of firearms
        throughout his careers as a soldier, a mercenary, and a spy. While he was
        highly skilled with firearms and because of his perfect eyesight it is very
        difficult for him miss when firing a gun, he has stated on multiple occasions
        that he isn''t fond of them and prefers to use bladed weapons, despite this,
        Wolverine used guns frequently after he lost his healing factor. * New Muramasa:
        After seeking out the ancient swordsmith whom created his prior blade, Wolverine
        now wields an all new enchanted Katana to participate in the battle for Krakoa.
        {{Navigation'
      source_id: fandom-marvel-wolverine-dc-comics
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: lifting_strength
      value: 'During all those years, Logan met and fell in love with many women and
        unknown to him, he also fathered a number of children. Those children would
        be found later on by another of Logan''s sons, Daken, who would give them
        to an evil organization who wanted revenge on Logan for what he did to them
        in the past: the Red Right Hand. On Daken''s advice, the Red Right Hand trained
        them in order to use them as weapons against Logan but knowing perfectly that
        they wouldn''t stand a chance against him. They would be known as the Mongrels.{{r|Wolverine
        Vol 4 14}} ===Department K=== After he quit Team X, Wolverine joined Department
        K, a secret Canadian Defense Ministry branch with ties to Weapon X. Based
        in Ottawa, he partnered with Neil Langram and worked again with Nick Fury,
        now a high-ranking CIA agent, and with Richard and Mary Parker (the parents
        of Peter Parker a.k.a. the Amazing Spider-Man).{{r|Untold Tales of Spider-Man
        Vol 1 -1}} thumb|left|Secret Agent Logan Years later, Langram was sought as
        an operative by the Hellfire Club, but he refused, and was then slain by Sabretooth,
        hired as a mercenary. Wolverine and Carol Danvers, a young US spy, investigated
        and infiltrated the Canadian Ministry of Defense, and more precisely a top-secret
        research and development agency which was in its early stage of growth, hidden
        in a sub-basement of a vast government complex: Department H. Within they
        discovered a list of several names called "The Mutant Agenda", and more troubling
        the names of both Logan and his dead partner Neil were on it. Logan and Carol
        then decided to track Dr. Perry Edwards, who wrote a book about the rise of
        superhumans and whose name was at the top of the list. The duo found him in
        New York and were able to save him from an assassination attempt, they then
        told him what they had found. He wasn''t surprised and explained to them that
        he discovered the existence of genetically superior beings who were living
        amongst them: Mutants. But more importantly he also discovered that some of
        those mutants weren''t benevolent and were planning to kill all the members
        of the inner circle of the Hellfire Club in their search for power, but to
        that end they needed to keep the existence of mutantkind a secret.{{r|Logan:
        Shadow Society Vol 1 1}} After infiltrating the Hellfire Club in order to
        learn more, Logan and Carol were lured by Sebastian Shaw and Sabretooth to
        a Canadian Hellfire Club facility where Sabretooth confronted them. After
        discovering that Sabretooth killed Perry Edwards and several government officials
        to make sure the existence of mutantkind couldn''t be revealed to the public,
        Sabretooth told Wolverine details of the Club''s intent to guide a war between
        mutants and humans. Sabretooth tried to kill Logan, and during their fight
        he told Logan that it was time for him to admit the truth: he was a mutant
        just like him and that was why he was so obsessed with mutants.{{r|Logan:
        Shadow Society Vol 1 1}} Logan, realizing that Sabretooth was the one who
        had killed Langram, proceeded to defeat his foe by stabbing him with his sword.
        Despite the severe injury, Sabretooth wasn''t done, and he decided to bomb
        the facility, but Logan and Carol were able to escape in time. Sabretooth
        survived and also escaped later on. After this adventure, Logan and Carol
        parted ways, but after he started to talk about this conspiracy with the Ministry
        of Defense and after bursting in both Department H and the Hellfire Club during
        this adventure, Logan''s reputation was now dirt in his country. As a result,
        he tried to forget about the mutant problem and decided to go to the Yukon.{{r|Logan:
        Shadow Society Vol 1 1}} But Logan was still troubled by Sabretooth''s revelations,
        and he started to develop a morbid preoccupation with the current "mutant"
        scandals.{{r|Wolverine: Weapon X Files Vol 1 1}}{{r|Marvel Comics Presents
