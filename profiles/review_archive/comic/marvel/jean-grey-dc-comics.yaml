    - field: weaknesses
      value: "Equipment = | Transportation = Formerly X-Men Blackbird, X-Men Stratojet,\
        \ X-Copter, Professor Xavier's Rolls Royce, Sentinel Air Transport, X-Factor\
        \ Plane, and various aircraft's constructed by Ship. She is also capable of\
        \ telekinetic flight. | Weapons = | Notes = * Jean has a complicated relationship\
        \ with the Phoenix Force. Originally, she was simply a host that bonded with\
        \ the Phoenix,{{r|X-Men Vol 1 101}} and then she became Dark Phoenix and died.{{r|X-Men\
        \ Vol 1 134|137}} However, when she was brought back, it was retconned that\
        \ all of her appearances from {{cl|X-Men Vol 1 101|to=137}} were actually\
        \ the Phoenix Force itself, who posed as Jean while the real Jean was healing\
        \ in a cocoon.{{r|Classic X-Men Vol 1 8}}{{r|Fantastic Four Vol 1 286}} In\
        \ other words, Jean did not destroy D'bari IV because it was the Phoenix.\
        \ Some writers, however, later presented the idea that Jean and Phoenix are\
        \ one.{{r|X-Men: Phoenix Endsong Vol 1 5}}{{r|A.X.E.: X-Men Vol 1 1}} Kieron\
        \ Gillen took it a step even further and had Jean/Phoenix give Hope Summers\
        \ life, who in turn sacrificed herself to give the Phoenix life; thus, Phoenix,\
        \ Jean, and Hope form a cycle.{{r|X-Men: Forever Vol 1 4}}{{r|Immortal X-Men\
        \ Vol 1 18}} X-Editor Jordan D. White said after {{cl|Rise of the Powers of\
        \ X Vol 1 5}}, \"Jean is the Phoenix and always is the Phoenix, even when\
        \ she\u2019s not the Phoenix. And the Phoenix is always Jean, even when it\u2019\
        s not Jean.\"{{cite|ref=true|url=https://aiptcomics.com/2024/06/10/x-men-monday-255-jordan-d-white-exit/|title=X-Men\
        \ Monday #255 \u2013 The Jordan D. White X-It Interview|work=AIPT|first=Chris|last=Hassan|date=10\
        \ June 2024|accessdate=10 June 2024}} * Following M-Day, when most mutants\
        \ were left depowered and no mutant births seemed possible, a mutant baby\
        \ was born in Cooperstown, Alaska, temporarily damaging Cerebra when it detected\
        \ the child. She bore a resemblance to Jean and when Cyclops held her before\
        \ giving her to Cable, the baby grasped a locket Cyclops wore that contained\
        \ a picture of him and Jean, hinting at a relation between the two. * In {{cl|Secret\
        \ Invasion Vol 1 4}} Phoenix appeared in her Green Phoenix costume, among\
        \ several heroes rescued from a downed Skrull ship. It seemed that they came\
        \ from the glory of the 1970's era. Phoenix and Beast from the Skrull ship\
        \ were killed and reverted to their Skrull forms upon their death. * Due to\
        \ her past self having been brought to the current timeline, Jean's telepathy\
        \ powers became evident to her a year before they were supposed to surface.{{r|All-New\
        \ X-Men Vol 2 9}} It had no effect on the current timeline because Young Cable\
        \ helped the five young mutants get returned to their own time, and Jean blocked\
        \ all of their memories of future events until after they experience the return\
        \ home of their younger selves.{{r|Extermination Vol 1 5}} * Jean has been\
        \ stated to be more powerful without the Phoenix{{r|X-Men: Red Annual Vol\
        \ 1 1}}{{r|X-Men: Red Vol 1 6}}{{r|X-Men: Red Vol 1 9}} and was even told\
        \ by Cassandra Nova that she was more powerful than their last encounter,\
        \ which was Jean tapping into the Phoenix Force.{{r|New X-Men Vol 1 126}}\
        \ | Trivia = * Storm is Jean's best friend.{{r|Classic X-Men Vol 1 2}} * Multiple\
        \ people have been stated to be afraid of Jean, such as notable telepaths\
        \ Emma Frost{{r|New X-Men Vol 1 139}} and Cassandra Nova.{{r|X-Men: Red Vol\
        \ 1 3}} * Jean's resemblance to Rose may have affected Wolverine's attraction\
        \ to her.{{r|Wolverine Vol 2 176}} thumb * Against the X-Men's ideals, Phoenix\
        \ has killed enemies before: Prism and MeMe, although Prism's destruction\
        \ was accidental.{{r|X-Factor Vol 1 11}}{{r|Uncanny X-Men Vol 1 292}} * In\
        \ her early missions with the X-Men, Jean was surrounded by men romantically\
        \ interested in her. Among them Professor X, Angel, Beast, Cyclops, Iceman,\
        \ and (briefly) Blob.{{r|X-Men Vol 1 3}} * Jean Grey was depicted as Professor\
        \ X's laboratory assistant, early in her career with the X-Men.{{r|X-Men Vol\
        \ 1 4}} * Jean Grey cooked for the other X-Men, when the team's unseen cook\
        \ had days off.{{r|X-Men Vol 1 6}} * Jean Grey has expressed jealousy over\
        \ the Scarlet Witch's attractiveness.{{r|X-Men Vol 1 6}} * Jean Grey and Wanda\
        \ Maximoff are two heroines with dedicated fanbases that tend to clash with\
        \ each other. When Steve Orlando, the long-running writer of Scarlet Witch,\
        \ was asked if Wanda and Jean could team up, Orlando answered that, due to\
        \ the toxicity from both sides, he and other comic creators purposely avoid\
        \ pairing Wanda and Jean in a story.{{cite|ref=true|refname=Orlando1|url=https://bsky.app/profile/thesteveorlando.bsky.social/post/3mm5vif4xik24|title=\u202A\
        @thesteveorlando.bsky.social\u202C: \"It's been years--this deserves an honest\
        \ answer. The toxicity of segments of both fanbases means I and most creators\
        \ will never put these two together. Not that it will never happen, but there's\
        \ very little to be gained when both have segments totally uninterested in\
        \ story and focused on \"winning.\"\"|work=Bluesky|first=Steve|last=Orlando|d"
