  intelligence:
    text: 'Above Average (Storm has been the leader of the X-Men and thinks of creative
      ways to use her powers in almost any situation, and is aware of the effect her
      powers have on the planet. Served on the governing bodies both mutant nations,
      Krakoa and Arakko, while also being the regent/representative of the entire
      Solar System to the rest of the universe. Is an expert at pickpocketing and
      lock picking. Picked a lock designed by T''Challa to not yield to science or
      magicDoomwar #1) Standard Tactics: Storm often refrains from using her full
      strength for several reasons. Storm more often than not refrains from killing,
      but will if necessary. Storm tries to be careful about the ways she alters the
      weather in one location because it will affect the weather in another part of
      the world. Lastly Storm refrains from using her more powerful abilities in populated
      areas out of fear of collateral damage.'
