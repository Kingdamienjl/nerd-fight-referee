    and sabotaged the cargo inside.Ultimates Vol 4 7) Their equipment includes trick
    arrows, which grant them Technology Manipulation (Said to possess arrows able
    to fry every electronic device in a 200 yard distance), Homing Attack (As shown
    here), Explosion Manipulation (Many of their arrows can explode), Sound Manipulation
    (They have arrows able to emit debilitating sounds as well as noise-cancelling
