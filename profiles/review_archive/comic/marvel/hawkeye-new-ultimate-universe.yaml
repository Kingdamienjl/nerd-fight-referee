    (Via inertia-cancelling arrow), Electricity Manipulation (Via industrial-taser
    arrows) and likely Biological Manipulation (Via neural-disruptor arrows). Enhanced
    Senses and Information Analysis via their mask (Can zoom in their view, and have
    a HUD which gives out targetting information of their target)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
