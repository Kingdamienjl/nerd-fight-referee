    - field: weaknesses
      value: 'Forces himself to not speak as his mere whisper can destroy the very
        city they live in and kill anyone close to him. He stopped speaking when he
        was but an infant when he accidently killed his parents. Reliance on Electronic
        (Electrons) EnergyFantastic Four Vol 1 47. He needs to take in air before
        he can unleash his sonic attack. For example, if his mouth gets covered, he
        can''t break it with his sound attack. Inhumans are weak to diseases compared
        to humans. As before. In addition, his sonic powers are far weaker in vacuum
        of space. Near the blue side of the moon, his sound is "muffled" - almost
        to the point where he can speak. Gets periodic headaches. Adheres too much
        to the rules, even going as far to let his own son be killed. When Thor destroyed
        his Antenna, it created an energy feedback that left Black Bolt senseless.
        This stopped him from being able to control his power.. Always need to control
        his power, otherwise it will have dire consequences. For a while, his Antenna
        was broken, leaving him unstable. He cannot control his powers and it left
        him in a weakened/senseless state. After Maximus drained him off all of his
        energies, it left him powerless - which means he could utter a few words without
        damaging anything/anyone. He always needs Medusa to interpret for him, otherwise
        he won''t be able to convey his thoughts properly. In addition, at times,
        the Royal Family misunderstands what he means, thus causing some issues. Medusa,
        his wife, is both a source of strength and weakness for Black Bolt. At times,
        he can be self destructiveBlack Bolt Vol 1 12 due to him being a bad husband
        and a father. He upholds Inhuman laws a little too much, often time coming
        at the cost of his own family. Such as when he nearly gave up Ahura to be
        killed by the Inhuman Genetic Council. Notable Attacks/Techniques: Notes:
        == Explanations == * Physical Varied Mechanism: His physical strength and
        speed relies on available Electrons. He absorbs nearby Electrons, converting
        it to speed and strength. His strength relies on his emotional level, and
        it''s source energy is tied to his brains. His powers are controlled mentally.
        * Particle & Electron Manipulation Varied Mechanism: Can control the output
        of his energyInhumans Vol 1 7. In addition, it relies on how much Electrons
        are available for him to absorb. His powers are controlled mentally. * Sound
        Manipulation Varied Mechanism: Can control the power output of his voice when
        needed to ensure those around him aren''t hurt by it. Can range from a mere
        whisper to a scream, the louder he wants his voice, the more powerful his
        attacks become. His sonic powers are connected to the Electrons he absorb.
        His Sonic powers can only be controlled through strong willpower. His powers
        are controlled mentally. When he lost his sonic power, he was able to get
        it back when he finally decided that he needed to use it to save himself,
        his new adopted daughter - Blinky, and his son - Ahura, alongside his new
        friends - Absorbing Man and Titania. *'
      source_id: mediawiki-karnak-earth-616
      provider_id: vsbattles
      authority: high
      confidence: 0.75
