    - field: weaknesses
      value: 'Like all Inhumans, he has a relatively weak immune system. Notable Attacks/Techniques:
        *Stress Point Detection: Through mental discipline, Karnak has gained the
        extrasensory ability to perceive the stress points, fracture planes, or weaknesses,
        physical or psychological, in all objects or persons around him. By striking
        and applying pressure at these points, he can split or shatter objects made
        of seemingly invincible substances or render insensate beings of far greater
        strength than he. This mental discipline is virtually effortless, and Karnak
        can attain this state of awareness for extended periods of time. Note: Before
        making any changes to this page, please read and follow the Power-scaling
        Rules for Marvel and DC Comics. ==Notable Matchups== Victories: Losses: Inconclusive:
