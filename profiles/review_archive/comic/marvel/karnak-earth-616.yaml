    - field: stamina
      value: Can fight for prolonged periods of time. Flew from Attilan, which is
        in Himalaya to New York in a short time. Flew deep into the ocean, ignoring
        the pressure of the water. In there, he found a cave full of dead people,
        so he used his powers and caused it to collapse. After that, he flew up back
        up and found a giant robot. Instead of fighting it, Black Bolt went around
        the city, saving as many people as he could from the robot's carnage. Flew
        through a tube for many miles and then outran its collapse. For 9 days, Maximus
        had him chained and forced to watch his people suffer, all while he was also
        getting hurt and humiliated. He was unable to sleep, rest, have any sustenance.
        On top of it being a physical pain, he was forced to see his people and his
        wife degraded for days and he could do nothing to stop it. Despite all this,
        he was forced to not use his voice - even to moan in pain - or he would hurt
        the people he loves. At the end, he couldn't endure the pain of those he loved,
        so he shouted and destroyed the whole of Attilan city. After the destruction
        of the city, he went out for hours to write a statement for his people in
        hopes that they would forgive him. While he did defeat Maximus and spared
        his people of further harm, the destruction of the city and the 9 days eventually
        hurt his spirit. After fighting a man who was stealing his energies, Black
        Bolt still was able to fly far away and caught up with a missile, stopping
        it and saving people. Was maintain the life-force of all Inhumans (there are
        almost 100,000 of them) for days at least, preventing them from dying, before
        he collapsed. At times, can move up to 6 hours non-stop before running out
        of energy. Fought Namor and then Thor, however, he was overpowered by Thor
        after the latter got serious. When Thor destroyed his Antenna, it created
        an energy feedback that left Black Bolt senseless. This stopped him from being
        able to control his power. Despite that, he was still trying to fight against
        some enemies to save himself and his allies. Destroyed underneath a mountain
        and caused an avalanche. He was able to claw his way out of it and still have
        energy to fly away. Fought the Thing and Namor, as well as other F4 and Inhumans.
        During the fight, Sue noted his speed was too much for her.
