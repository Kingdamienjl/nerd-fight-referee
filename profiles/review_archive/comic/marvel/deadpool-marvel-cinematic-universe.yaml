  intelligence:
    text: Gifted (Deadpool is very seasoned mercenary, with a career spanning across
      many years. Over the course of his life has has performed (oftenly even accomplished)
      many different assignments, including assassination, espionage, theft, rescuing
      and son on, a list too long for the count. He has been a prominent member of
      several high-profile teams, most notably X-Force and some iterations of the
      Avengers, as well as a number of mercenary agencies, some even led by him. Deadpool
      is widely (and infamously) renowned within the community of metahumans, amongst
      both heroes and villains, due to having been a recurrent ally, foe or close
      acquaintance of nearly everyone. The many adventures he has partaken have led
      him to every corner of the world and oftentimes even across the universe, other
      dimensions and different time periods. Few are the beings with whom Deadpool
      has not contended, for he has fought (and killed) all sorts of superpowered
      individuals, assassins, monsters, aliens and weird creatures in general. Deadpool's
      antics are misleading of his actual worth and everyone who mistakes him for
      a fraud eventually pays the price. Despite often spiraling into incompetence
      out of pure carelessness, Deadpool's true competence as a warrior and strategist
      emerge the very moment he decides to act seriously. Thanks to his skill, Deadpool
      has lived through the most absurd situations, facing death countless times and
      living to tell the tale)
    source_ids:
