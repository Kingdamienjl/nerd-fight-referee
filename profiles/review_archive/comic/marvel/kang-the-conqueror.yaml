  intelligence:
    text: At least Extraordinary Genius (Kang the Conqueror is a master tactician,
      scientist and engineer from the 31st century, who discovered the existence of
      universes stacked on top of his own and made contact with his Variants, as well
      as developed and mastered incredibly advanced technologies such as his Armour
      and Time Sphere. Started the Multiversal War against his Variants, which was
      so devastating that it nearly destroyed the entire Multiverse. Able to create
      weapons and technology that allowed him to destroy entire planets and timelines.
      While trapped in the Quantum Realm, he managed to convince Janet he was only
      trying to escape, successfully hiding his true goal and intentions, which were
      only revealed when Janet got a glimpse of his mind and memories. Later conquered
      the entire Quantum Realm, establishing a gigantic empire running on immensely
      advanced technology he personally developed, which was stated by Jane van Dyne
      to be centuries beyond anything she, Hope and Hank can dream of. A master martial
      artist, who defeated Ant-Man, the Wasp and Cassie Lang in both their human and
