    - field: powers_and_abilities
      value: "thumb|right|Doctor Doom with the Power Cosmic *Super-Genius Intelligence:\
        \ Doctor Doom's most dangerous weapon is his intellect. He is one of the top\
        \ mortal minds on the planet. He even cured Ben Grimm of his Thing form. Doctor\
        \ Doom's Time Platform is one of numerous inventions; others include devices\
        \ that can imbue people with powers, and many types of robots. He often uses\
        \ \"Doombots\", exact mechanical replicas of himself. They look like him,\
        \ talk like him, and even act like him. Individually, Doombots have an advanced\
        \ AI (artificial intelligence) so that each one believes itself to be the\
        \ real Doom. As a safety measure, each Doombot has a dampener program that\
        \ is triggered whenever the real Doom (or another Doombot) is nearby. These\
        \ \"body doubles\" appear when Doom cannot be present or is unwilling to risk\
        \ his own life, and are often responsible for Doom's seeming return from certain\
        \ death. Another common type of robot used is the Servo-Guard, the police\
        \ force of Latveria. Doom specializes in all levels of physics, robotics,\
        \ cybernetics, genetics, materials science, weapons technology, biochemistry,\
        \ and time travel. He also has natural talents for leadership, strategy, politics,\
        \ and manipulation. He was taught under leading roboticist Dr. Cronos. He\
        \ has been shown as a prodigious electrical and mechanical engineer, admired\
        \ by Tony Stark, an inspired theoretician with extensive knowledge of parallel\
        \ universes and dimensions, and even a practiced neurosurgeon, having surgically\
        \ separated Hulk from Bruce Banner. His knowledge extents to virtually any\
        \ scientific field and his mind is said to work as fast as a sophisticated\
        \ computer. Doom's knowledge of magic enhances his scientific brilliance;\
        \ the time platform is a result of combining the two skills. Doom\u2019s consciousness\
        \ was vast and powerful enough to download a planet\u2019s worth of data.\
        \ *Master Martial Artist: During his time in Tibet, Doom was presumably trained\
        \ in martial arts by the monks. He is vastly skilled in many combat techniques,\
        \ both armed and unarmed. He has been trained by the best sword masters on\
        \ Earth and can achieve very powerful nerve strikes. His combat skills are\
        \ so great that he managed to kill a lion with his bare hands, to be indistinguishable\
        \ to Daredevil while in his suit, and to wield Captain America's shield as\
        \ skillfully as Steve Rogers himself. He was also able to defeat Black Panther\
        \ in close combat even when his suit was depowered and incapacitate Taskmaster\
        \ on pure hand to hand, without the aid of technology or magic. *Expert Occultist\
        \ & Magical Knowledge: Years of extensive training and studying under various\
        \ magical experts, as well as years of time travel, battling supernatural\
        \ enemies and learning various lost arts of magic and mysticism have made\
        \ Doom incredibly knowledgeable in the occult and the wider fields of magic\
        \ altogether. *Peak Human Conditioning: Doom has trained his body to the level\
        \ of the finest human athlete. He is well-built, fast and agile. He has also\
        \ displayed great reflexes and equilibrium. Victor once claimed that he was\
        \ training and building himself physically for years, so as to be ready to\
        \ face the demonic beings called from Mephisto during their annual confrontation.\
        \ His physical strength and durability match even those of Daredevil. *Indomitable\
        \ Will: Doom has phenomenal determination, fearlessness, and strength of will.\
        \ Indeed, he has the strongest will on Earth. Hence, he was able to resist\
        \ psychic attacks from Emma Frost and the mind control of the Purple Man using\
        \ only his will, to reject the mystical armor that the Soulsword provides\
        \ the wielder on sheer willpower alone and while he was tortured in Hell,\
        \ he refused to let a single audible indication of pain exit his mouth. Doom's\
        \ willpower could be considered even godly as, after having stolen the Beyonders'\
        \ omnipotent abilities for himself, he was capable of creating an entire new\
        \ planet from the remnants of incursion points between collapsing worlds,\
        \ that new planet was Battleworld. He held this world together with his will.\
        \ *Highly Influential Connections: As Monarch of Latveria, Doctor Doom has\
        \ access to technological and military hardware. He also has command of conventional\
        \ military forces; see Doctor Doom's Generals. *Charismatic leader: Doom is\
        \ able to attract people's positive attraction, especially on the citizens\
        \ of Latveria, even when his plans are failing. He is also a skilled politician\
        \ and strategist and has occasionally been the leader of numerous teams, including\
        \ the Cabal and the Fantastic Four. *Diplomatic Immunity: As the leader of\
        \ a sovereign nation, Doctor Doom often visits the United States or the United\
        \ Nations for political reasons. He enjoys diplomatic immunity during these\
        \ trips, and his embassy is considered foreign soil. He has even been escorted\
        \ by Captain America himself. After renouncing his status as ruler of Latveria,\
        \ it is likely he lost this status. After reconquering Latveria, it's likely\
        \ he regained it. *Artist: Doom has shown himself to be a talented artist.\
        \ He painted a duplicate of the while using Layla Miller as his model. *Pianist:\
        \ Doom has shown himself to be a talented pianist. He has played various compositions\
        \ of his own creation. *Master Swordsman: Doom has been shown being proficient\
        \ in sword combat, having been trained by the best teachers - until he overcame\
        \ them all - and being able to out-duel Warlord Krang in swordsmanship. *Weapon\
        \ systems and vehicles proficiency: Victor is highly proficient in the use\
        \ of weapons, mostly those of his own creation, such as battle suits, ray\
        \ weapons and bombs, but he also utilizes rifles, guns and grenades with great\
        \ aiming ability. He has also been shown as a capable driver of vehicles such\
        \ as the Excavator and the Gyroscopic Aircraft *Multilingual: Besides , he\
        \ speaks all languages spoken in Latveria, those being , , , and and possibly\
        \ several others. *Master Chef: Doom is an expert cook. He described his potatoes\
        \ dauphinoise as \"the stuff of legends\"."
