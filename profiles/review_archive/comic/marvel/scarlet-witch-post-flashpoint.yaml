    - field: durability
      value: 'The armor is fashioned of a high-strength titanium alloy enchanted with
        magic and has been shown durable enough to take a blast from the Infinity
        Gauntlet to point-black range, with little to no harm.{{r|Infinity Gauntlet
        Vol 1 4}} The armor managed to withstand a massive explosion of energy at
        ground zero , from the Marquis of Death - which destroyed the entire capital
        of Latvia and the rest of the country.{{r|Fantastic Four Vol 3 567}} ** Video
        Communicator: Built into the right wrist is a video communicator, which he
        can use to stay in contact with his bases from any point on Earth. ** Electric
        Shock: The outer surface of the armor can generate a massive electric shock
        on command. ** Electrical Field:{{r|Machines of Doom Vol 1 1}} Also known
        as Electrical Force Field,{{r|Giant-Size Super-Villain Team-Up Vol 1 1}} the
        Electro-Magnetic Amplifier{{r|Fantastic Four Vol 1 199}} and Neural Disruptor,{{r|Uncanny
        X-Men Vol 1 145}} this mechanism allows Doom to generate a point-blank electric
        shock causing enormous damage to anyone daring enough to touch Doom - for
        example, someone in melee with him. It also affects, to a lesser extent, nearby
        people not in direct contact with Doom''s armor. Anyone affected is susceptible
        to falling unconscious.{{r|Machines of Doom Vol 1 1}} Doom used this device
        to kill his clone{{r|Fantastic Four Vol 1 199}} and also to knock down Elvin
        Haliday{{r|Avengers Vol 1 333}} and even Colossus, who had resisted previous
        attacks.{{r|Uncanny X-Men Vol 1 145}} It was however not enough to stun The
        Thing in the latter''s mutated, "spiky" state.{{r|Fantastic Four Vol 1 319}}
        **Magnetic Polarity Controllers: Besides manipulating metal, this device allows
        Doom to redirect Magneto''s power against him.{{r|Super-Villain Team-Up Vol
        1 14}} **Teleportation device: Doom''s armor is able to teleport him across
        a short-range of distances{{r|Super-Villain Team-Up Vol 1 3}} **Link to Doom''s
        Time-Plat'
      source_id: fandom-marvel-scarlet-witch-post-flashpoint
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: keys
      value: 'An invention Doom can use to travel through time{{r|Iron Man Vol 1 149}}
        ** Flight: Dr. Doom''s suits of armor are upgraded to give him the power of
        flight without the use of jet-packs. ** Jet-Packs: The typical suit of armor
        has twin jet-packs mounted at the waist, though other suits (or modifications
        of the original suit) contain a single jet-pack mounted on the back. ** Concussive
        Blasts: Concussive bolts of force can be fired from the gauntlets, fingertips,
        palms and faceplate of the armor, though the mask only generates force blasts
        when it is not being worn. ** Force-Field: The suit''s best defense is the
        force-field generated by the armor, which has a maximum radius of eight feet
        (and so can encompass others); Doom cannot attack without lowering his force-field.{{r|Fantastic
        Four Vol 1 40}} ** Infrared Vision: Infrared scanners in the helmet allow
        the wearer to detect heat sources, permitting night vision and the ability
        to see invisible persons (unless they do not give off or can somehow mask
        their heat signature). ** Recycling System: The armor is self-supporting,
        equipped with internal stores and recycling systems for air, food, water,
        and energy, allowing the wearer to survive lengthy periods of exposure underwater
        or in outer space. ** Sensor Systems: Optical scanners in the helmet allow
        the helmet''s eyepieces to be used as high-powered telescopes, and parabolic
        ear amplifiers fitted inside the helmet allow Doom to detect extremely faint
        sounds and unusual frequencies within the audible range for humans. **Vacuum
