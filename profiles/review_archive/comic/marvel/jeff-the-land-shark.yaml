    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics, Stealth Mastery (Can sneak inside\
        \ houses without being detected, the only thing visible when he is on the\
        \ dark is his eyes and smiles. I looked up and nearly jumped out of my bed.\
        \ There, in the little ray of light, illuminating from between my curtains,\
        \ were a pair of two eyes. These weren\u2019t regular eyes; they were dark,\
        \ ominous eyes. They were bordered in black and\u2026 just plain out terrified\
        \ me. That\u2019s when I saw his mouth. A long, horrendous smile that made\
        \ every hair on my body stand up.), Weapon Mastery (Can throw his knife skillfuly\
        \ into someone's shoulderHe pulled up a knife, aiming at my heart. He jumped\
        \ on top of my bed. I fought him back; I kicked, I punched, I rolled around,\
        \ trying to knock him off me. That\u2019s when my dad busted in. The man threw\
        \ the knife, it went into my dad\u2019s shoulder. The man probably would\u2019\
        ve finished him off, if one of the neighbors hadn\u2019t alerted the police.),\
        \ Berserk Mode (Jeff can enter a state of pure rage in which all he wishes\
        \ to do is kil\u201CCome on, Jeff! Fight me!\u201D He picked Jeff up and threw\
        \ him into the kitchen. Randy saw a bottle of vodka on the counter and smashed\
        \ the glass over Jeff\u2019s head. \u201CFight!\u201D He threw Jeff back into\
        \ the living room. \u201CCome on, Jeff! Look at me!\u201D Jeff glanced up;\
        \ his face riddled with blood. \u201CI was the one who got your brother sent\
        \ to JDC! And now you\u2019re just gonna sit here and let him rot in there\
        \ for a whole year! You should be ashamed!\u201D Jeff started to get up. \u201C\
        Oh, finally! you stand and fight!\u201D Jeff was now to his feet, blood and\
        \ vodka on his face. Once again, he got that strange feeling... the one he\
        \ hadn\u2019t felt for a while. \u201CFinally. He\u2019s up!\u201D said Randy\
        \ as he ran at Jeff. That\u2019s when it happened. Something inside of Jeff\
        \ snapped. His psyche was destroyed, all rational thinking was gone, all he\
        \ could do was kill. He grabbed Randy and pile\u2010drove him to the ground.\
        \ He got on top of him and punched him straight in the heart. The punch caused\
        \ Randy\u2019s heart to stop. As Randy gasped for breath. Jeff hammered down\
        \ on him. Punch after punch, blood gushed from Randy\u2019s body until he\
        \ took one final breath and died.l), Fire Manipulation (Via lighter), Minor,\
        \ Resistance to Disease Manipulation (Was not negatively affected after burning\
        \ his eyelids off to never blink again, which usually leads to infections\
        \ and loss of eye health. His smile-shaped scars around his mouth didn't get\
        \ infected, which shows that Jeff has a strong immune systemHis eyes were\
        \ bordered in black, seemingly never closing. \u201CI couldn\u2019t see my\
        \ face. I got tired and my eyes started to close. I burned out the eyelids\
        \ so I could forever see myself\u2014my new face.\u201D) * Minor Resistance\
        \ to Pain (Was able to fight after being stabbed into his shoulder.Jeff saw\
        \ the guns trained on him and ran for the stairs. As he ran, Troy and Keith\
        \ let out fire on him, each shot missing. Jeff ran up the stairs. He heard\
        \ Troy and Keith follow up behind. As they let out their final rounds of bullets,\
        \ Jeff ducked into the bathroom. He grabbed the towel rack and ripped it off\
        \ the wall. Troy and Keith raced in; knives ready.Carved a smile into his\
        \ face with a knifeLater that night, Jeff\u2019s mother awoke to a sound coming\
        \ from the bathroom. It sounded as if someone was crying. She slowly walked\
        \ over to see what it was. When she looked into the bathroom, she saw a horrendous\
        \ sight. Jeff had taken a knife and carved a smile into his cheeks.Burnt his\
        \ eyelids)"
