    - field: attack_potency
      value: "Street Level (Broke Randy's wrist, which would be at this level.Jeff\
        \ popped the kid in the nose. As Randy reached for his face, Jeff grabbed\
        \ the kid\u2019s wrist and broke it. Randy screamed and Jeff grabbed the knife\
        \ from his hand. Troy and Keith rushed Jeff, but Jeff was too quick. He threw\
        \ Randy to the ground. Keith lashed out at him, but Jeff ducked and stabbed\
        \ him in the arm. Keith dropped his knife and fell to the ground screaming.\
        \ Troy rushed him too, but Jeff didn\u2019t even need the knife. He just punched\
        \ Troy straight in the stomach and Troy went down. As he fell, he puked all\
        \ over the place. Liu could do nothing but look in amazement at Jeff. Smashed\
        \ a window.The man turned and ran down the hallway. I heard a smash, like\
        \ glass breaking. As I came out of my room, I saw the window that was pointing\
        \ towards the back of my house was broken. I looked out it to see him vanish\
        \ into the distance It was stated that he would have killed an adult man if\
        \ the cops hadn't came. Stronger than Randy and his goons, who had threw him\
        \ through a glass door.Randy pulled a knife on Jeff and stabbed it into his\
        \ shoulder. Jeff screamed and fell to his knees. Randy started kicking him\
        \ in the face. After three kicks, Jeff grabbed his foot and twisted it, causing\
        \ Randy to fall to the ground. Jeff stood up and walked towards the back door.\
        \ Troy grabbed him. \u201CNeed some help?\u201D He picked Jeff up by the back\
        \ of the collar and threw him through the patio door. As Jeff tried to stand,\
        \ he was kicked down to the ground. Randy repeatedly started kicking Jeff,\
        \ until he began coughing up blood.), Higher with weapons (Killed Troy with\
        \ a single hit of a towel rack.Troy swung his knife at Jeff, who backed away\
        \ and banged the towel rack into Troy\u2019s face. Troy went down hard. Now\
        \ all that was left was Keith. He was more agile than Troy, though, and ducked\
        \ when Jeff swung the towel rack. He dropped the knife and grabbed Jeff by\
        \ the neck. He pushed him into the wall. A thing of bleach fell down on top\
        \ of him from the top shelf. It burnt both of them; they both started to scream.\
        \ Jeff wiped his eyes as best as he could. He pulled back the towel rack and\
        \ swung it straight into Keith\u2019s head. As he lay there, bleeding to death,\
        \ he smiled ominously. Multilated his face with his own knife. Disembowled\
        \ his parents.\u201CHoney, get the gun we\u2026\u201D She stopped as she saw\
        \ Jeff in the doorway, holding a knife. \u201CMommy, you lied.\u201D That\
        \ was the last thing they heard. Jeff rushed them with the knife and gutted\
        \ both of them. Threw a knife into someone's shoulder. Stabbed Keith into\
        \ his arm.)"
