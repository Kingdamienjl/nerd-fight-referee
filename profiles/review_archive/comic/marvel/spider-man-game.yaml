    - field: intelligence
      value: General= Extraordinary Genius (Before the main story even began, Peter
        Parker has shown that his intellect exceeded normal standards. At the mere
        age of 15 after getting his powers, he developed his signature web-shooters.
        As a sophomore, his aptitude for science help him win awards like the Fisk
        Science Prize. He also developed "Spider-Tracers" to track his foes. Created
        his own cell phone from parts he found dumpster diving. Developed insulators
        in his suit for his future battles against Electro, and created a jammer to
        disrupt Vulture's wings. Academically brilliant, he also gained a Bachelor
        of Science degree in Biophysics at Empire State University, with his A-graded
        thesis of neurotechnology. And while he did get an offer at Oscorp with a
        high salary, he chose to work at Octavius Industries. Over the course of the
        story, Peter has shown expertise in many STEM related fields. Examples include
        applied science, chemistry, biology, engineering, mathematics, physics, and
        mechanics. His skills is so impressive he can do calculus and physics equations
        in his head to make sure he swings correctly. He later developed many different
        devices and suits to help him against his villains such as the suspension
        matrix, concussive blast, numerous of web related gadgets, and the Anti-Ock
        suit. Otto Octavius himself even acknowledges Peter's intelligence and states
        that Peter has a talent for guerilla science like none other. Prime examples
        of this include synthesizing a counter-drug to Tombstone's invulnerability
        in an incredibly short amount of time, using only the lab supplies found in
        the back of a truck and being able to quickly make an antidote to Scorpion's
        toxin after being hit by it. Peter is also a formidable and proficient hacker
        as shown as he was able to hack into Fisk's console in the server room to
        obtain evidence to put Fisk into jail. Peter's also notable for his impressive
        skills in intelligence gathering and data interpretation, being able to pick
        up on patterns others do not notice, examples include by how he had to sometimes
        correct flaws in the mechanical appendages designed by Otto. Other examples
        include his work with the Oscorp research stations made by Harry all over
        the city, developing new ideas to solve problems that was presented in said
        stations) |-|Combat= Has defeated and outsmarted many foes with genius intelligence
        such as the Vulture and Shocker, the latter of which is regarded as a gifted
        autodidact who Kraven the Hunter considered to be "nearly something", seeing
        him as a vicious, feral, and sincere fighter. Even in his early career as
        a superhero, Wilson Fisk, a formidable strategist considered him a threat.
        After 8 years of crime fighting, Spider-Man is a highly accomplished and versatile
        hand-to-hand combatant. He is easily capable of doing numerous professional
        wrestling moves. Many specific lucha libre maneuvers have been noted in his
        fights, such as dropsaults, headscissors takedowns, reverse frankensteiners,
        and the famous hurricanrana. Casually took down entire units and camps of
        agents for Sable International, a mercenary-security organization that even
        in its early stages, was comprised of trained and hardened soldiers with highly
        respectable technology and battle tactics. His combat skills are so impressive,
        he's fought and defeated skilled combatants such as Wilson Fisk and Tombstone,
        fought evenly against extraordinary martial artists like Silver Sable, and
        was even able to accomplish all the combat challenges and defeat (while holding
        back) the mercenary Taskmaster who possesses a "photo-reflexive memory", allowing
        him to observe, assess and then instantly replicate his target's combat maneuvers
        as well as develop his own countermeasures against them through anticipating
        their movements and at the time had already fully studied and analyzed Spider-Man's
        moves during their final fight. It's also important to acknowledge that Peter
        is largely self taught in combat, having learned many of his fighting techniques
        from watching movies. By the eighth year of his crime-fighting career, he
        possesses an masterful understanding of his abilities such that he managed
        to train his partner Miles in combat, traversal, and stealth challenges he
        set up for him across the city while he was away with several holo-drones,
        which are humanoids manifested through hard light that are proficient in the
        use of martial arts, melee weaponry, and firearms, and analyze hostile combat
        tactics in battle.
      source_id: vsbattles-spider-man-game-marvel
