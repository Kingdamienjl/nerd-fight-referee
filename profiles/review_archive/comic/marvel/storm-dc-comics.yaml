    - field: striking_strength
      value: "thumb|left|First encounter with X-Men Ororo continued her travels around\
        \ Africa, dispensing justice and helping people with her powers.{{r|Black\
        \ Panther Vol 4 14}} In the Serengeti Plains in Tanzania she was met by the\
        \ Masai people who told her they have seen \"the coming of the Goddess Ororo\"\
        \ in their dreams. She was at first confused, but then accepted this role,{{r|Uncanny\
        \ Origins Vol 1 9}} and used her powers to help the local tribes combat the\
        \ drought.{{r|Giant-Size X-Men Vol 1 1}}{{r|Classic X-Men Vol 1 10}} She settled\
        \ in the Uzuri village in Kenya on the border with Tanzania, where she was\
        \ taken in by an elderly tribal woman named Ainet.{{r|X-Men Vol 2 77}} Once,\
        \ when their village was going through a terrible drought, Storm commanded\
        \ rain for days just to help them. By doing this, she threw off the natural\
        \ order of nature, and droughts were formed over numerous other villages,\
        \ and hundreds of animals were killed. Sensing the damage she had done, Ainet\
        \ taught her to be responsible with her powers and how she could fix the problem\
        \ by properly distributing rain.{{r|X-Men Vol 2 77}} Overtime Ororo began\
        \ to question her role as a goddess.{{r|Uncanny X-Men Vol 1 305}} thumb|right|Worshipped\
        \ as goddess During another drought, the villagers formed a dam in the dry\
        \ river, and Ororo planned to start a rain to fill it with water. However,\
        \ her control over the storm was hijacked by Deluge. He used his own powers\
        \ to drastically increase the storm in size, planning to use it to devastate\
        \ the planet. The plane with the young X-Men, Cyclops, Jean Grey and Beast\
        \ was caught in the storm and their crashed down. Ororo rescued Beast and\
        \ brought him to her village. They then reunited with Cyclops and Jean as\
        \ well and worked together to stop Deluge. Jean telepathically connected minds\
        \ of Beast and Ororo, Beast explained to her in details how to use water droplets\
        \ to form a giant lens in the sky and they focused it on Cyclops to let him\
        \ absorb sunlight and channel it into optic blasts to attack Deluge. Deluge\
        \ was initially happy to absorb more energy, but was quickly overloaded and\
        \ then exploded. Ororo bid them farewell, and returned to her village. Beast\
        \ suspected that she was a mutant, and planned to inform their teacher, Professor\
        \ Xavier. Jean confirmed that Ororo was a mutant and told the rest that Xavier\
        \ already knew about Ororo for several years.{{r|X-Men: The Hidden Years Vol\
        \ 1 5|7}} For several years she combated the drought in a large area of Kenya\
        \ and Tanzania,{{r|Uncanny X-Men Vol 1 194}}{{r|Storm Vol 5 1}} from the Serengeti\
        \ Plains, to Ngorongoro, Lake Manyara{{r|Uncanny Origins Vol 1 9}} and Mount\
        \ Kilimanjaro,{{r|X-Men Vol 2 77}} and in all other countries around the Lake\
        \ Victoria{{r|Astonishing X-Men: Xenogenesis Vol 1 5}} and saved untold number\
        \ of lives in result. For her actions she was worshipped as a goddess{{r|Giant-Size\
        \ X-Men Vol 1 1}}{{r|Classic X-Men Vol 1 10}} and the Wind-Rider, and became\
        \ a local myth, remembered, respected and worshipped even many years after\
        \ she left.{{r|Uncanny X-Men Vol 1 194}}{{r|Astonishing X-Men: Xenogenesis\
        \ Vol 1 5}} ===X-Men=== thumb|right|Recruited by Charles Xavier When the original\
        \ team of the X-Men were captured by the sentient island being, known as Krakoa,\
        \ Professor Xavier was left with no choice but to recruit Ororo and other\
        \ mutants from around the world into the X-Men in order to rescue his original\
        \ students. Xavier explained to Ororo that she was not a \"goddess\", but\
        \ a mutant and had a responsibility to use her abilities to help the world,\
        \ just as she had helped the local tribes. Curious, Ororo accepted Professor\
        \ Xavier's offer and was given the code name Storm.{{r|Giant-Size X-Men Vol\
        \ 1 1}} After most of the original team left, Ororo, along with fellow new\
        \ recruits Nightcrawler, Colossus, Wolverine, Thunderbird, and Banshee stayed\
        \ as members of the new X-Men. This new group of X-Men were mostly adults\
        \ and trained in the use of their powers in the Danger Room.{{r|X-Men Vol\
        \ 1 94}} Storm remained with the X-Men for years. Storm was initially very\
        \ na\xEFve when it came to the customs of the modern world, but her teammate\
        \ Jean Grey (Marvel Girl), helped educate her in the ways of society and the\
        \ pair formed a lasting friendship. Jean was also one of the first X-Men to\
        \ learn of Storm's claustrophobia, after the two women chased a thief into\
        \ the subway.{{r|Classic X-Men Vol 1 2}} thumb|right|All-New X-Men Storm\u2019\
        s claustrophobia placed the entire team in danger when they battled Juggernaut\
        \ and Black Tom Cassidy in Cassidy Keep. In the cellars of the ancient castle,\
        \ Ororo felt entombed between the walls of solid rocks and went into shock.\
        \ She could do nothing but cry while her teammates were butchered. Only after\
        \ all had fallen did she find the strength to fight. However, it was only\
        \ after the Juggernaut accidentally punched a hole in the wall and she could\
        \ see the open sky again that she could free the team and turn the tide.{{r|X-Men\
        \ Vol 1 101|103}} In the Savage Land St"
