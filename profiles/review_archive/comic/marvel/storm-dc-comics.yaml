    - field: weaknesses
      value: '* (practically formerly): Having been trapped under rubble for three
        days in Cairo while her mother lay dying, Storm''s claustrophobia was once
        so severe, it rendered her completely helpless. However, she has more or less
        conquered her fear, though tight spaces still make her uncomfortable. These
        flashbacks still attack her when she is enclosed. * Emotional Influence: Storm''s
        ability to manipulate the weather in her immediate vicinity is affected by
        her emotions; hence, if she does not maintain control, a fit of rage might
        induce a destructive storm. As a result, Storm has in the past kept a tight
        rein on all extreme emotions. * Physical Condition: Storm is limited by the
        force of her will and the strength of her body. It once took her several hours
        to put an end to a savage blizzard sweeping over much of Canada, and she nearly
        killed herself from exhaustion in the process. * Naturally Occurring Limitation:
        Storm respects the natural boundaries of the planet''s biosphere, and manipulates
        weather patterns as they naturally exist. For example, she could end a drought
        in one area by creating torrential rains there, but that would necessitate
        robbing all available moisture from the surrounding area. (In contrast, Thor,
        whose weather affecting ability is magical, can change the weather in one
        area without disrupting existing weather patterns anywhere else). Storm does
        not typically create atmospheric conditions that cannot exist naturally on
        the planet she is on. She could not, for example, lower temperatures as far
        as absolute zero or raise them to solar intensities. However, when the situation
        has called for it, Ororo has created natural and unnatural phenomena which
        do not exist on Earth, such as Jovian atmospheric pressure, a massive tornado
        that reaches to the upper atmosphere of the planet, or when she superheated
        plasma. {{Navigation'
