    - field: powers_and_abilities
      value: 'thumb Genius Intelligence: A mastermind, Magneto is a genius in various
        scientific fields. He is an expert in and mutation. He has created artificial
        living beings, mutated humans in order to give them superhuman powers, instilled
        genetic mind-control, created adult clones of human beings, and manipulated
        the genetic structures of those clones during their development. His discoveries
        in particle would revolutionize the field and place him among the giants of
        scientific history if they were to be revealed. He has magnetically-powered
        aircraft and spacecraft, space stations, an underground complex said to be
        a masterpiece of automated technology that would do Tony Stark or Reed Richards
        proud, , and computers, magnetically-powered generators, and machines capable
        of nullifying mutant powers within a radius of several miles. : With several
        decades of fighting experience, Magneto is a skilled fighter. By increasing
        his physical stats with his powers, he can hold his own against Iron Man and
        defeat several men unarmed. : Magneto is fluent in , , , and . Indomitable
        Will: Magneto will strive to complete his goals, no matter what it takes.'
      source_id: fandom-marvel-magneto-dc-comics
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: weaknesses
      value: 'Physical Condition: Magneto''s ability to wield his superhuman powers
        effectively is dependent upon his physical condition. When severely injured,
        his body is unable to withstand the strain of manipulating magnetic energy.
        When his powers are not at their peak, he also appears to have greater difficulty
        utilizing his magnetism for great feats. He is also susceptible to physical
        and mental fatigue that can ultimately affect his ability to adequately use
        his powers, especially if he overuses or extends them in a short amount of
        time. Headaches: As a side effect of the vast powers Magneto manipulates,
        he is prone to headaches. {{Navigation'
      source_id: fandom-marvel-magneto-dc-comics
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: standard_equipment
      value: Magneto relies primarily on his natural powers, although he has occasionally
        used magnetically powered devices he invented, such as his machine for inducing
        earthquakes and volcanic eruptions from afar. Magneto used to employ mechanisms
        for magnifying his own powers, but since his rejuvenation, he no longer needs
        them.
      source_id: fandom-marvel-magneto-dc-comics
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: striking_strength
      value: 'Magneto was left powerless, along with most of the world''s mutant population,
        and with no more mutant births, the species that Magneto had dedicated his
        life to fight for was rapidly headed towards extinction. The X-Men left him
        amidst the ruins of Genosha, a broken and shell-shocked man.{{r|House of M
        Vol 1 8}} When Quicksilver came to Genosha to restore the mutants'' powers
        with the Inhumans'' Terrigen Mist, Magneto condemned his actions, pointing
        out the disastrous side-effects the Mists had on non-Inhumans. An angry Quicksilver,
        frustrated at never being able to win his father''s approval, attacked Magneto
        with his new powers gained from the Mists, savagely beating him until his
        daughter Luna begged him to stop. When the Inhumans later came looking for
        their Mists, Magneto told them what had happened.{{r|Son of M Vol 1 5}} Thereafter,
        the Collective (a being comprised of energy from all the former mutants''
        powers) re-powered Magneto and revealed itself as Xorn, the impostor who had
        devastated New York. Xorn explained that he took the image of Magneto because
        he knew mutants would follow him, but that they needed the true Magneto once
        again. Magneto, not in control of himself, began attacking the New Avengers
        and S.H.I.E.L.D. agents that Xorn nearly destroyed while he pleaded for them
        to kill him. He was taken down with a direct attack to his brain from Inhuman
        S.H.I.E.L.D. agent Daisy Johnson. Iron Man, Ms. Marvel, and the Sentry combined
        their powers and sent the Collective/Xorn into the sun. Unconscious, Magneto
        was loaded into a S.H.I.E.L.D. helicopter. The helicopter, however, exploded
        upon take-off through unknown means; his body was not found among the rubble.{{r|New
        Avengers Vol 1 20}} Afterward, Magneto was being searched for by the U.S.
        government, the Morlocks, and the X-Men. Professor Xavier was unable to locate
        him with Cerebro, despite the increase in power to his recently restored telepathy.
        Xavier and Nightcrawler found traces of Magneto paying his respects at a local
        graveyard, standing in front of a tombstone belonging to one of his very first
        henchmen. Also, the Morlocks came after Magneto for reasons of their own and
        used him to justify their terrorist acts.{{r|Uncanny X-Men Vol 1 487}} Magneto
        spoke to a crippled, depowered Morlock, claiming he had lost what once made
        him superior. However, when Skids found him at a local cemetery sometime later,
        she gave him a mysterious book that Masque had in his possession. It claimed
        to chronicle the future of mutantkind, and in it, the book stated Magneto
        was still a mutant.{{r|Uncanny X-Men Vol 1 491}} At the behest of Exodus,
        Magneto appeared to help restore the broken psyche of Professor Xavier, who
        had suffered massive brain damage after being shot in the head. Stil powerless,
        he reminisced about the past between the X-Men and the Brotherhood with Omega
        Sentinel. Together they managed to revive Xavier before being attacked by
        Frenzy. Magneto wounded Frenzy by firing a medical laser into one of her eyes,
        prompting Exodus to ask what punishment he would have instilled on a human
        who injured a mutant. Magneto replied "Death" and Exodus proceeded to choke
        him with his telekinesis before a recovering Xavier challenged Exodus on the
        astral plane. After Xavier defeated Exodus, he left Magneto and Karima to
        try and rebuild his lost memories.{{r|X-Men: Legacy Vol 1 208|210}} ===Regaining'
