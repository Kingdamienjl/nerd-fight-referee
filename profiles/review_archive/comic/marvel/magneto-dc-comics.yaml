    - field: intelligence
      value: 'A mastermind, Magneto is a genius in various scientific fields. He is
        an expert in {{Ability|Geneticists|genetic engineering}} and mutation. He
        has created artificial living beings, mutated humans in order to give them
        superhuman powers, instilled genetic mind-control, created adult clones of
        human beings, and manipulated the genetic structures of those clones during
        their development. His discoveries in particle {{Ability|Physicists|physics}}
        would revolutionize the field and place him among the giants of scientific
        history if they were to be revealed. He has {{Ability|Engineers|designed}}
        magnetically-powered aircraft and spacecraft, space stations, an underground
        complex said to be a masterpiece of automated technology that would do Tony
        Stark or Reed Richards proud, {{Ability|Robotics|complex robots}}, and computers,
        magnetically-powered generators, and machines capable of nullifying mutant
        powers within a radius of several miles.{{r|X-Men: Earth''s Mutant Heroes
        Vol 1 1}} {{Ability|Martial Arts|Skilled Combatant}}: With several decades
        of fighting experience, Magneto is a skilled fighter. By increasing his physical
        stats with his powers, he can hold his own against Iron Man and defeat several
        men unarmed. {{Ability|Multilingual}}: Magneto is fluent in {{Speaker|English}},
        {{Speaker|French}},{{r|Classic X-Men Vol 1 12}} {{Speaker|German}},{{r|X-Men:
        Magneto Testament Vol 1 1}} and {{Speaker|Yiddish}}.{{r|Uncanny X-Men Vol
        1 522|The (Yiddish) words used are a bit unclear, but this is most likely
        a minor mistake by the writer.}} Indomitable Will: Magneto will strive to
        complete his goals, no matter what it takes.'
