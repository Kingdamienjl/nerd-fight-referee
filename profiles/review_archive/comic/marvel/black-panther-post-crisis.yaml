    - field: powers_and_abilities
      value: '* Genius Intelligence: T''Challa is a polymath genius and has an eidetic
        (a.k.a. photographic) memory. His knowledge of physics and engineering ranks
        him among the top eight intellects of the world. He possesses accomplishments
        such as a PhD in physics from Oxford University. He also combined alchemy
        with science to create a new scientific field called Shadow Physics, a dangerous
        discipline which allowed him to track Vibranium on a quantum level, craft
        weapons which would be particularly effective against Vibranium, and create
        an unstable teleportation device which, at the time, ripped apart anyone using
        it with great healing ability. * : T''Challa has been groomed to be a warrior
        since birth. He is a master in practically all forms of armed and unarmed
        combat, having mastered various styles of martial arts from around the world.
        He is considered to be one of the best martial artists to have ever walked
        the Earth. He has stalemated, and at times even gained the upper hand against
        various highly skilled martial artists such as Captain America, Daredevil,
        Iron Fist, and many other dangerous opponents in hand-to-hand combat. He was
        able to overpower Wolverine twice without much difficulty, even when Wolverine
        was using his claws. Captain America himself said that when he won against
        T''Challa, T''Challa was not his usual self, seeming weaker than he actually
        was. He was shown to be skilled enough to defeat the skilled combatant Karnak
        the Shatterer with a single blow to the head. * : T''Challa is a rigorously
        trained and acrobat. He is particularly accomplished at gymnastics, acrobatics,
        and brachiation (swinging from one branch to another using one''s arms). *
        : T''Challa is a master marksman adept with hunting knives, firearms, and
        other projectile weaponry. * : T''Challa is a genius tactician, strategist,
        and leader who is practically peerless. He was taught tactics and strategies
        in his youth by his father, who encouraged him to always think two steps ahead
        of his enemies and three steps ahead of his friends. His prowess is such that
        he is able to outthink and outmaneuver individuals such as Tony Stark and
        other geniuses. * Expert and Hunter: Even without his superhuman senses, T''Challa
        is a master tracker and hunter. He can pick up a prey''s scent and memorize
        tens of thousands of individual ones. * : T''Challa can fluently speak his
        native language, English, and other various languages. * : T''Challa can invent
        various devices with special properties when needed. He possesses abilities
        and intellect that makes him a peer and has proven to be able to invent and
        create weaponry that rivals their engineering capabilities. T''Challa can
        also duplicate practically any other technologies after learning how they
        work or by glancing at the designs. * Highly Influential Connections: As the
        king of Wakanda, T''Challa has access to a vast collection of magical artifacts,
        technological and military hardware, as well as the support of his nation''s
        wide array of scientists, adventurers, and super heroes. * Diplomatic Immunity:
        As the leader of a sovereign nation, T''Challa often visits the United States
        or the United Nations for political reasons. He enjoys diplomatic immunity
        during these trips, and his embassy is considered foreign soil. * Musical
        Skill: T''Challa is a skilled musician and can play the flute. * Substantial
        Wealth: T''Challa is Wakandan royalty, thus he has access to a vast amount
        of wealth due to the advanced technology he has created/invented, and the
        stores of Vibranium possessed by his country. His wealth surpasses that of
        Tony Stark, whose net worth is in the billions.'
