        = Black Panther Vol 4 40 | Overview = T''Challa{{r|Captain America Vol 1 100}}
        wears the sacred and hereditary mantle of the legendary Black Panther, champion
        of the highly advanced and secluded nation of Wakanda.{{r|Fantastic Four Vol
        1 52}} After witnessing the tragic demise of his father at the hands of the
        colonizer Klaw the Master of Sound,{{r|Fantastic Four Vol 1 53}} T''Challa
        perfected his body, mind and soul to step in as the chieftain of his country.
        By weaponizing the wondrous metal Vibranium, communing with the Heart-Shaped
        Herb, and being blessed by Bast the Panther Goddess, he has become Black Panther,
        the most dangerous man alive.{{r|Avengers Vol 1 87}} To get aid in protecting
        his country, Black Panther contacted the Fantastic Four and soon became an
        esteemed figure among the heroic community.{{r|Fantastic Four Vol 1 53}} Gaining
        the respect of Captain America,{{r|Tales of Suspense Vol 1 97|99}} he has
        also become a prominent member of Earth''s Mightiest Heroes, the Avengers.{{r|Avengers
        Vol 1 51|52}} Despite his inherent nobility, Black Panther has constantly
        demonstrated his supreme loyalty to his people and shows no hesitation to
        manipulate situations for Wakanda''s best interests.{{r|Black Panther Vol
        3 1|25}} He faced numerous challenges regarding the stability of Wakanda,
        most prominently concerning the actions of the dissidents Killmonger,{{r|Jungle
        Action Vol 2 6}} M''Baku,{{r|Avengers Vol 1 62}} and the White Wolf.{{r|Black
        Panther Vol 3 10|12}} As an influential agent in the world, Black Panther
        was part of relevant organizations such as the Illuminati,{{r|New Avengers
        Vol 3 1}} the Ultimates,{{r|Ultimates Vol 2 1}} and the Crew,{{r|Black Panther
        and the Crew Vol 1 6}} as well as having operated as the chairman of the Avengers.{{r|Avengers
        Vol 8 8}} He also counts on inestimable aid from his loyal bodyguards, the
        Dora Milaje, the diplomatic escort Everett K. Ross,{{r|Black Panther Vol 3
        1}} his determined sister, Shuri,{{r|Black Panther Vol 4 20}} and his mutant
        ex-wife Storm.{{r|Black Panther Vol 4 25}} Additionally, during T''Challa''s
        rule, Wakanda expanded to the stars, becoming an intergalactic empire.{{r|Marvel
        Legacy Vol 1 1}} Black Panther witnessed the monarchy being rejected in Wakanda,
        sparking a rebellion,{{r|Black Panther Vol 6 1|6}} which eventually led to
        a transition in its regime.{{r|Black Panther Vol 6 7|12}} As a parliament
        was instated, T''Challa ultimately abandoned his position as king and went
        into exile.{{r|Black Panther Vol 8 14}} In this setting, he has explored facets
        of his nation that he had never experienced before, acting as a crime-fighter
