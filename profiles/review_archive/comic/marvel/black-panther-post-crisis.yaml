    - field: durability
      value: 'T''Challa''s skin, muscle, and bone tissues are augmented to levels
        that are much denser and harder than normal humans,{{r|Official Handbook of
        the Marvel Universe Master Edition Vol 1 9}} making him far more durable and
        resistant to damage to various degrees.{{r|Civil War: Battle Damage Report
        Vol 1 1}} He withstood getting smashed on his head by a glass bottle with
        no visible injury or discomfort.{{r|Black Panther: The Man Without Fear Vol
        1 513}} T''Challa can withstand blows from superhuman opponents like Killmonger,{{r|Black
        Panther Vol 3 20}} who has the strength to overpower and kill an adult bull
        elephant with his bare hands.{{r|Black Panther Vol 3 15}} * Peak Human Regeneration:
        T''Challa''s enhanced healing speed and capabilities allows him to have a
        conditioned metabolism and immune system that enables extraordinarily efficient
        healing.{{r|Official Handbook of the Marvel Universe Master Edition Vol 1
        9}} * Peak Human Agility: T''Challa''s equilibrium, balance, flexibility,
        dexterity, and bodily coordination are enhanced to levels superior to any
        Olympic-level athlete that has ever competed.{{r|Official Handbook of the
        Marvel Universe Master Edition Vol 1 9}} This gives him cat-like agility.{{r|Official
        Handbook of the Marvel Universe Master Edition Vol 1 9}}{{r|Civil War: Battle
        Damage Report Vol 1 1}} T''Challa has been seen to run barefoot on utility
        pole wires,{{r|Black Panther Vol 3 53}} and leap across an entire opera room.{{r|Black
        Panther Vol 3 58}} * Peak Human Endurance: T''Challa''s endurance is about
        double that of an Olympic-level athlete.{{r|Official Handbook of the Marvel
        Universe Vol 1 2}} He continued to function for 13 hours while fighting Killmonger
        despite being exhausted.{{r|Black Panther Vol 3 20}} * Peak Human Reflexes:
        T''Challa''s reaction time are beyond the natural limits of an Olympic-level
        athlete,{{r|Official Handbook of the Marvel Universe Master Edition Vol 1
        9}} allowing him to dodge multiple gunfire at point-blank range with ease.{{r|Official
        Handbook of the Marvel Universe Master Edition Vol 1 9}}{{r|Civil War: Battle
        Damage Report Vol 1 1}} He has been noted to have reflexes faster than an
        actual panther. King of the Dead: As the King of the Dead, T''Challa possesses
        other powers as listed below: * {{Power|Necromancy}}: T''Challa is able to
        take command of the dead itself. He was able to take control of an entire
        army of zombies{{r|Secret Wars Vol 1 7}} and order the spirits of Necropolis
        to aid him in his fight with Tetu.{{r|Black Panther Vol 6 11}} * {{Power|Energy
        Construct Creation|Spirit Energy Constructs}}: T''Challa learned he could
        create weapons out of spiritual force through his title as the King of the
        Dead,{{r|Black Panther Vol 6 11}} creating a spear out of ectoplasmic energy
        with which to affect both the material and ethereal planes.{{r|Black Panther
        Vol 6 171|172}} * {{Power|Cosmic Awareness|Hyper-Cosmic Awareness}}: Due to
        T''Challa''s exposure to Galactus'' mind both before and after his transition
        from the Devourer of Worlds to the Lifebringer due to his odd means of warping
        to Taa II, his Worldship,{{r|Ultimates Vol 2 4}} he began experiencing visions
        in his dreams and day-to-day life. He was beginning to see and sense the cage
        around the Marvel Universe and the goings on outside it in the Multiverse
        as well.{{r|Ultimates 2 Vol 2 1}} An unknown effect that intake of the Heart-Shaped
        Herb has is that it also connects the head of the Panther Tribe to the precious
        metal which mutated it. Kings of the secret nation possess a sixth sense for
        the unique energy signature Vibranium gives off, letting them know when it
        is stolen out from Wakanda and where its thieves are headed with it.{{r|Rise
        of the Black Panther Vol 1 2}} {{Navigation | title = Former Powers | body
        = Alchemy and ancient magic gave him resistance to magical attacks {{Power|Clairvoyance}}:
        Many years ago, exposure to the Vibranium Mound gave T''Challa extrasensory
        capabilities. He was able to see objects around him even while blindfolded.
        He also experienced visions of the future, wherein he saw himself in conflict
        with the energy-vampire known as Kiber the Cruel. These powers disappeared
        shortly after his battle with Kiber.{{r|Black Panther Vol 1 10|12}} Phoenix
        Force: During the Enter the Phoenix tournament, T''Challa was empowered by
        the Phoenix Force. His portion of the Phoenix Force was eventually taken by
        Echo.{{r|Avengers Vol 8 41|44}} }}'
