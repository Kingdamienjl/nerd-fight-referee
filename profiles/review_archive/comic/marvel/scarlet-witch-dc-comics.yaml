        \ and hadn't even come close to discovering her true potential. She cannot\
        \ defend herself against threats she is not aware of. Destroying the Darkhold\
        \ prevents Wanda from Dreamwalking, as the book is required to do so. In Multiverse\
        \ of Madness, she is mentally unstable. Note: ==Notable Matchups== Victories:\
