    - field: weaknesses
      value: 'Equipment = | Transportation = | Weapons = | Notes = * The White Witch
        is an amalgamation of both Scarlet Witch and DC Comics'' {{DC|Zatanna Zatara
        (New Earth)|Zatanna}}. * The White Witch is a flirtatious character who physically
        touches both Doctor Strangefate and Access. She also flirted with Myx. * The
        exact origin of the powers of the White Witch is unknown. She is partly based
        on Zatanna, who is not completely human. Zatanna is a member of the {{DC|Homo
        Magi|Homo Magi}}, a sub-race of humanity with hereditary magical powers. Several
        other magic users of DC Comics are either full-blooded Homo Magi or hybrid
        descendants of them. Wanda Maximoff is, of course, a mutant. * The mysterious
        father of the White Witch may hint at the multiple fathers of the Scarlet
        Witch. The parentage of Zatanna is more clear as she is a legacy character,
        daughter and heiress of Golden Age magical hero {{DC|Giovanni Zatara (New
        Earth)|Giovanni Zatara}}. *While not stated as a source for this character,
        there is a DC character also called the White Witch. She is {{DC|Mysa Nal
        (Pre-Zero Hour)|Mysa Nal}}, an alien member of the {{DC|Legion of Super-Heroes
        (Pre-Zero Hour)|Legion of Super-Heroes}} with magical powers of her own. *
        The White Witch somewhat resembles the {{DC|Laura Neilsen (New Earth)|Silver
        Sorceress}}, a white-haired sorceress of the Justice League. The Sorceress
        was created as a homage to Marvel''s Scarlet Witch. * Besides connections
        and resemblances to other comic book characters, the White Witch shares an
        alias with a famous literary character. The White Witch is the alternate name
        of Jadis, a major villain from two books in the series "The Chronicles of
        Narnia" by C.S. Lewis. Jadis is an extraordinarily tall and beautiful woman
        who uses her looks as a weapon. * While the white motif in the costume of
        the White Witch probably derives from the uniform of Mysa Nal, the "blatantly
        sexual" nature of the character and the rather skimpy nature of the outfit
        do not. Some websites about the Amalgam characters point a resemblance of
        these elements to those of another Marvel character: the White Queen. * The
        White Witch is a magical disciple and potential love interest to the otherwise
        cold-hearted Doctor Strangefate. Some websites about the Amalgam characters
        suggest that she may be his version of Clea, Dr. Strange''s disciple, lover,
        and later wife. | Trivia = }} Category:Magicians'
