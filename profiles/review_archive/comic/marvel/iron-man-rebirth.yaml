    - field: intelligence
      value: 'Quite apart from the powers granted him by the suit, Tony Stark is far
        more than a mechanical engineering prodigy who graduated from the Massachusetts
        Institute of Technology with honors at the age of 17.{{r|Iron Man: The Legend
        Vol 1 1}} With an intelligence classified as super-genius,{{r|Avengers: Roll
        Call Vol 1 1}} he easily is one of the smartest people on Earth. Furthermore,
        this extends to his remarkable ingenuity dealing with difficult situations
        such as foes and deathtraps where he is capable of using his available tools,
        like his suit, in unorthodox and effective ways, for example when he built
        the first Iron Man Armor in captivity.{{r|Tales of Suspense Vol 1 39}} Stark
        claims to be the one who invented cloak technology.{{r|International Iron
        Man Vol 1 2}} {{Power|Computer Hacking Skills}}: He has been able to hack
        technology from the Kree, a race centuries more advanced than humans,{{r|Iron
        Man Vol 1 278}} even developing nanites encoded with a virus capable of shutting
        down the Supreme Intelligence.{{r|All-New Invaders Vol 1 5}} He has also hacked
        technology from the Skrulls,{{r|Secret Invasion Vol 1 8}} and Eternals{{r|A.X.E.:
        Judgment Day Vol 1 4}} {{Power|Robotics}}: Stark has been able to repair advanced
        artificial beings such as Vision{{r|Avengers Vol 4 19}} and the Original Human
        Torch.{{r|Invaders Vol 3 7}} He was chosen by Ultron to rebuild his body.{{r|Avengers
        Vol 1 202}} Tony''s genius allows him to act as a futurist, a person capable
        of intuiting the future based on current trends, to the point of foreshadowing
        that a situation like the Superhuman Civil War was going to happen years before
        it did.{{r|New Avengers: Illuminati Vol 1 1}} This ability also extends to
        a much smaller scale, with Tony being capable of predicting with accuracy
        the way an interaction with a given individual will go down even before talking
        with them, a faculty that makes it really hard for human interactions to surprise
        him,{{r|Invincible Iron Man Vol 3 7}} and causes him to sometimes finish other
        people''s sentences.{{r|Spider-Man Vol 2 7}} Stark can use his superior intellect
        to the levels of dividing his consciousness with the help of Stark Datashades
        and perfectly operate three portions of his consciousness at the same time,
        being able to move, fight, talk and process information in three different
        bodies at the same time.{{r|Iron Man: Fatal Frontier Infinite Comic Vol 1
        7}} Tony has been mentioned by Eternity to be the world''s greatest engineer,{{r|Mighty
        Avengers Vol 1 30}} and by Reed Richards to be the world''s best multitasker.{{r|Avengers
        Vol 5 43}} thumb|left|250px Master Engineer: He is an excellent engineer and
        mechanic capable of fixing almost any, if not all machinery. Master Businessman:
        Stark is extremely well-respected in the business world, able to command people''s
        attentions when he speaks on economic matters by virtue of the fact that he
        is savvy enough to have, over the years, built up several multi-million-dollar
        companies from virtually nothing. He is known for the loyalty he commands
        from and returns to those who work for him, as well as his impeccable business
        ethics.{{r|Tales of Suspense Vol 1 89}}{{r|Iron Man Vol 1 103}} He also strives
        to be environmentally responsible in his businesses, and in one case, immediately
        fired an employee who made profitable (but illegal) sales to Doctor Doom.
        He states that if he wanted to, he could give away his entire fortune and
        build it up again within a week. Stark most notably turned his father''s munitions
        firm into a multinational corporation that covered virtually all contemporary
        scientific industry when barely in his early twenties.{{r|Iron Man Vol 1 288}}
        Master Tactician: He is a brilliant tactician capable of quickly formulating
        battle strategies and new plans if the situation changes, like being able
        to elaborate different complex plans in order to defeat different enemies
        in difficult situations,{{r|Invincible Iron Man Vol 2 4}}{{r|Invincible Iron
        Man Vol 2 516}} and be victorious. Even going as far as to simultaneously
        put Reed Richards in check on five different boards playing chess, a game
        he didn''t learn until later in his life, leaving Richards totally astonished.{{r|Invincible
        Iron Man Vol 2 4}} Expert Combatant: Stark was trained in unarmed combat by
        Captain America,{{r|Iron Man Vol 1 125}} Black Widow, Black Panther, and Shang-Chi,{{r|Iron
        Man: Fatal Frontier Infinite Comic Vol 1 12}} making him a quite physically
        formidable combatant on his own when the situation demands it. He has managed
        to fight Hammer Industries guards,{{r|Iron Man Vol 1 125}} defeat five Skrull
        soldiers in single-handed combat,{{r|New Avengers: Illuminati Vol 2 1}} Stark
        Industries security guards,{{r|Iron Man vs. Whiplash Vol 1 3}} numerous Voldi
        gladiators,{{r|Iron Man Vol 4 7}} handle his own against Madame Hydra,{{r|Iron
        Man: Director of S.H.I.E.L.D. Annual Vol 1 1}} and bare-handedly confront
        several ninja.{{r|Invincible Iron Man Vol 3 8}} Skilled Swords'
