    - field: durability
      value: 'His armor is very durable, capable of withstanding tremendous amounts
        of punishment. It can withstand high caliber bullets with ease. He can also
        withstand rockets, missiles, torpedoes, high powered lasers, and such, taking
        little to no damage. Future armors were fully resistant against electricity,
        fire, heavy impacts, energy blasts, take zero Kelvin and up to the Sun''s
        temperatures, even some of Thor''s attacks (see Thorbuster). The suit can
        withstand almost unlimited kinetic and thermal impact, as well as most forms
        of radiation thanks to its refractory coating. The armor can survive anything
        short of a nuclear explosion at ground zero. The suit automatically protects
        its wearer when he enters an intrinsically hostile environment, such as outer
        space or deep sea. The armor even has specialized circuitry that guards against
        telepathic attacks.{{r|Iron Man Vol 4 9}} Tony is very confident in his suit''s
        defensive abilities, when he was caught in a nuclear explosion, he was only
        thinking about women and completely forgot about what was happening around
        him.{{r|Invincible Iron Man Vol 1 32}} * Energy Shield: Energy shielding that
        can protect the user from harm. It is also capable of reflecting attacks and
        staying mobile. At 2% power, the shield is strong enough to withstand a nuclear
        explosion. It is even capable of protecting its user at the point blank of
        a nuclear explosion caused by a material even more radioactive than Uranium,
        Phlogistone.{{r|Iron Man: Fatal Frontier Infinite Comic Vol 1 1}} The suit''s
        shielding can resist a force blast from the Spectral Mandarin Ring, a beam
        of energy so powerful it can destroy the bonds between atoms and molecules,{{r|Iron
        Man Vol 4 24}} and magic.{{r|Avengers & X-Men: AXIS Vol 1 9}} =====Offensive'
