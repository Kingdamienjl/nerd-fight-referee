    - field: lifting_strength
      value: "{{r|Invincible Iron Man Vol 5 10}} a skyscraper-sized Sentinel Buster\
        \ Armor built on Nidavellir with Ironheart's help, piloted through Tony's\
        \ most powerful armor yet, the Model 72. During the X-Men's final battle against\
        \ Orchis, Tony lured Feilong and the Stark Sentinel armada to Australia, where\
        \ he engaged them with his new giant armor.{{r|Invincible Iron Man Vol 5 15}}\
        \ Although Feilong felled the Sentinel Buster Armor by ramming his own War\
        \ Machine Sentinel into the suit's power source,{{r|Invincible Iron Man Vol\
        \ 5 16}} Iron Man delivered him a decisive beatdown.{{r|Invincible Iron Man\
        \ Vol 5 17}} However, the A.I. allied with Orchis turned against their human\
        \ allies in a bid to destroy all organic life. With assistance from Magneto\
        \ using his powers as a battery, Stark reawakened the Sentinel Buster long\
        \ enough to decimate the remaining supply of Stark Sentinels, clearing the\
        \ way for the X-Men's victory against Nimrod.{{r|Invincible Iron Man Vol 5\
        \ 18}} ===The Improvised Iron Man=== thumb|left|Model 74, a Makeshift Knight\
        \ Although Emma amicably turned down Tony's offer to further pursue their\
        \ romance, as a parting gift she used her powers to funnel money from various\
        \ criminal sources to restore his fortune.{{r|Invincible Iron Man Vol 5 20}}\
        \ Taking back the reins of Stark Unlimited, Tony quickly tried to pivot the\
        \ company away from weapons manufacturing. However, A.I.M. took advantage\
        \ of the transitional state and the Feilong-appointed Board of Directors to\
        \ ally themselves with Roxxon and offer a bid for the company.{{r|Iron Man\
        \ Vol 6 1}} With the support of demonic entities represented by the demon\
        \ Belasco,{{r|Iron Man Vol 6 3}} Roxxon resurrected Justine Hammer, who devised\
        \ a ploy to compromise almost the entirety of Tony's armory with a magic-infused\
        \ virus and cannibalized the Mysterium Armor for her own Iron Monger Armor.{{r|Iron\
        \ Man Vol 6 1}} Tony managed to stop the merger when Belasco revealed his\
        \ involvement to the board, and he persuaded the demon's benefactors to withdraw\
        \ their support. When they turned on the board in requital, Iron Man negotiated\
        \ their safety in exchange for annulling the merger and resigning. However,\
        \ Tony was left with an Improvised Armor he had jerry-rigged from scraps,\
        \ since Belasco's masters didn't extricate him from their magical malware.{{r|Iron\
        \ Man Vol 6 3}} With the help of Ironheart and the Scarlet Witch, Tony began\
        \ slowly purging his armory of the virus.{{r|Iron Man Vol 6 5}} He was still\
        \ employing the Improvised Armor when Doctor Doom used the powers of Sorcerer\
        \ Supreme to broker the allegiance of the world's leaders and named himself\
        \ Earth's emperor.{{r|One World Under Doom Vol 1 1}} The desperation to defeat\
