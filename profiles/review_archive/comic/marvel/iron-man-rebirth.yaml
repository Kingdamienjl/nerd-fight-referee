    - field: speed
      value: 'Even when not traveling for extended distances, the armor enables the
        wearer to move and react at very high speeds, shown for example when he was
        able to outmaneuver Spider-Man{{r|Invincible Iron Man Vol 1 14}} and the Human
        Torch.{{r|Civil War Vol 1 7}} * Flight: The armor can typically reach speeds
        in excess of Mach 10, however Iron Man has been recently depicted as able
        to reach orbital escape velocities (5 miles per second) and up to speeds that
        can outrun black holes. Use of the jet boots provide enough power to lift
        a load of about 500 tons. Most recent suits are even able of reaching warp
        speed.{{r|Iron Man: Fatal Frontier Infinite Comic Vol 1 1}} * Power Cel'
