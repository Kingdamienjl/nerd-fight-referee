    - field: keys
      value: 'An invention Doom can use to travel through time{{r|Iron Man Vol 1 149}}
        ** Flight: Dr. Doom''s suits of armor are upgraded to give him the power of
        flight without the use of jet-packs. ** Jet-Packs: The typical suit of armor
        has twin jet-packs mounted at the waist, though other suits (or modifications
        of the original suit) contain a single jet-pack mounted on the back. ** Concussive
        Blasts: Concussive bolts of force can be fired from the gauntlets, fingertips,
        palms and faceplate of the armor, though the mask only generates force blasts
        when it is not being worn. ** Force-Field: The suit''s best defense is the
        force-field generated by the armor, which has a maximum radius of eight feet
        (and so can encompass others); Doom cannot attack without lowering his force-field.{{r|Fantastic
        Four Vol 1 40}} ** Infrared Vision: Infrared scanners in the helmet allow
        the wearer to detect heat sources, permitting night vision and the ability
        to see invisible persons (unless they do not give off or can somehow mask
        their heat signature). ** Recycling System: The armor is self-supporting,
        equipped with internal stores and recycling systems for air, food, water,
        and energy, allowing the wearer to survive lengthy periods of exposure underwater
        or in outer space. ** Sensor Systems: Optical scanners in the helmet allow
        the helmet''s eyepieces to be used as high-powered telescopes, and parabolic
        ear amplifiers fitted inside the helmet allow Doom to detect extremely faint
        sounds and unusual frequencies within the audible range for humans. **Vacuum
        Resistance Doom''s armor allows him to survive in space, underwater or at
        toxic environments.{{r|Marvel Super-Heroes Vol 1 20}} ** Solar Energy Absorption:
        A thermo-energizer allows the armor to absorb and store solar and heat energy,
        and use it to power the armor''s other systems; this system can only be used
        while the force-field is deactivated. ** Thermal Units: This device hidden
        on Doom''s gloves allowed him to spray a cloud of yellow mist with special
        properties to nullify invisibility powers of a character in an area. Once
        this enemy was located, Doom could easily change to a different attack.{{r|Fantastic
        Four Vol 1 199}} ** Personal Adapters: Using this device Doom can absorb multiple
        forms of energy. ** Special protection against other machines: Doom''s armor
        is impervious to some of his other devices, such as the Disintegrator.{{r|Amazing
        Spider-Man Vol 1 5}} His suit was also unhackable by the Extremis{{r|Mighty
        Avengers Vol 1 10}} ** Splinters of the True Cro'
