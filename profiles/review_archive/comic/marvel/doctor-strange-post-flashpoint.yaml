    - field: intelligence
      value: "Doctor Doom's most dangerous weapon is his intellect. He is one of the\
        \ top mortal minds on the planet.{{r|Incredible Hulk Vol 3 606}} He even cured\
        \ Ben Grimm of his Thing form.{{r|Fantastic Four Vol 1 17}} Doctor Doom's\
        \ Time Platform{{r|Fantastic Four Vol 1 5}} is one of numerous inventions;\
        \ others include devices that can imbue people with powers,{{r|Marvel Super\
        \ Heroes Secret Wars Vol 1 3}} and many types of robots.{{r|Fantastic Four\
        \ Vol 1 5}} He often uses \"Doombots\", exact mechanical replicas of himself.\
        \ They look like him, talk like him, and even act like him. Individually,\
        \ Doombots have an advanced AI (artificial intelligence) so that each one\
        \ believes itself to be the real Doom.{{r|Fantastic Four Vol 1 258}} As a\
        \ safety measure, each Doombot has a dampener program that is triggered whenever\
        \ the real Doom (or another Doombot) is nearby. These \"body doubles\" appear\
        \ when Doom cannot be present or is unwilling to risk his own life, and are\
        \ often responsible for Doom's seeming return from certain death.{{r|Avengers\
        \ Vol 1 332|333}} Another common type of robot used is the Servo-Guard, the\
        \ police force of Latveria.{{r|Fantastic Four Vol 1 84}} Doom specializes\
        \ in all levels of physics, robotics, cybernetics, genetics, materials science,\
        \ weapons technology, biochemistry, and time travel. He also has natural talents\
        \ for leadership, strategy, politics, and manipulation. He was taught under\
        \ leading roboticist Dr. Cronos. He has been shown as a prodigious electrical\
        \ and mechanical engineer, admired by Tony Stark,{{r|Iron Man Vol 1 150}}\
        \ an inspired theoretician with extensive knowledge of parallel universes\
        \ and dimensions,{{citation}} and even a practiced neurosurgeon, having surgically\
        \ separated Hulk from Bruce Banner.{{r|Incredible Hulk Vol 1 5}} His knowledge\
        \ extents to virtually any scientific field and his mind is said to work as\
        \ fast as a sophisticated computer.{{r|Fantastic Four Vol 1 373}} Doom's knowledge\
        \ of magic enhances his scientific brilliance; the time platform is a result\
        \ of combining the two skills.{{r|Venom Vol 5 25}} Doom\u2019s consciousness\
        \ was vast and powerful enough to download a planet\u2019s worth of data.{{r|Doom:\
        \ The Emperor Returns Vol 1 1}} *Master Martial Artist: During his time in\
        \ Tibet, Doom was presumably trained in martial arts by the monks.{{r|Fantastic\
