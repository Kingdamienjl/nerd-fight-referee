        using the Thanos Returns and Thanos Wins storylines by Donny Cates. Several
        of the feats performed by Old King Thanos were performed off-panel via unknown
        means, and several of the on-panel ones would be extreme outliers if used
        to scale the present-day Thanos. *Do not attempt to scale Thanos to other
        mainstream Marvel characters using the storylines The Infinity Siblings, The
