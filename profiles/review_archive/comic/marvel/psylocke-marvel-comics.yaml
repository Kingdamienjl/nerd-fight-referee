    text: Multi-City Block level physically (Without using her powers she defeated
      Sabretooth. With a single kick draws blood from Wolverine and has defeated him
      in a sparring match. Defeated Spiral on several occasions.). City level, possibly
      far higher with psionic powers (Has claimed to be capable of shattering small
      mountains, which would require this much energy to perform. Knocked out Iron
      Man. Destroyed Dark Iceman's ice wall, which Captain Britain couldn't destroy.
      Harmed Rogue. Punched Hercules. Was stated to be the same level of threat as
      Colossus and Magneto. Telekinetically destroyed a planet-sized forcefield.)
