    - field: powers_and_abilities
      value: ': A natural genius, Xavier is a leading authority on genetics, mutation,
        and psionics. He possesses considerable expertise in other life sciences.
        He is highly talented in devising equipment for utilizing and enhancing psionic
        powers. Xavier is also quite the masterful tactician and strategist, effectively
        evaluating situations and devising swift responses; he has, on numerous occasions,
        even fashioned long-term operations as complex as those of adversaries such
        as Sinister, Magneto, and Apocalypse. Military Training: Charles served in
        the United States Military, secretly employing his abilities to specialize
        in search and rescue missions. Expert Fighter: In his travels in the East,
        he became a proficient hand-to-hand combatant and gained knowledge of pressure
        points.'
      source_id: fandom-marvel-professor-x-post-crisis
