    - field: weaknesses
      value: "The mask can be loosened by the Question's continuous use of nicotine\
        \ or the sheer change in body chemistry through dehydration or malnutrition\
        \ | Same as before. Eventually, Sage develops lung cancer, which severely\
        \ affected his health before death. Notable Attacks/Techniques: * Dragon-Style\
        \ Kung Fu: The Question is trained in martial arts by the famous Richard Dragon.\
        \ Using what he had learned, the Question is capable of defeating multiple\
        \ enemies at onceThe Question Vol 1 4, armed copsThe Question Vol 1 16 and\
        \ fight superhumans52 Vol 1 3. He can feel inexplicable sensations, making\
        \ it difficult to sneak up on him. He\u2019s also trained well in blocking\
        \ and ignoring painThe Question Annual Vol 1 1 and surviving potentially lethal\
        \ cold temperaturesThe Question Vol 1 36. ** Zen Buddhism: His training with\
        \ Dragon also granted him mystical abilities that is based around zen principles.\
        \ He knows a mental technique that can help in healing wounds and broken bones.\
        \ * Urban Shamanism: Later in his adventures, the Question would become self-taught\
        \ in urban shamanism. With it, he can walk in the astral plane, see through\
        \ walls, see the souls of dead people, and track down people by feeling the\
        \ city he is in. With focus and the aid of his gas, the Question can also\
        \ make himself a floating invisible astral form that can hurt and kill his\
        \ enemies and influence people\u2019s minds. Notes: * Portions of this page\
