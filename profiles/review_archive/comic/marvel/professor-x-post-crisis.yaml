    - field: standard_equipment
      value: '* Pseudoderm Mask: A mask made out of an experimental substance known
        as "pseudoderm" that gives the Question the appearance of a man without a
        face. The mask also serves as another layer of defense and a way to scare
        or intimidate people. The mask is very difficult to remove without the proper
        binding agent. It is also lead-lined as countermeasures to x-ray vision *
        Binary Gas: The Question carries a specialized gas inside his belt to apply
        and remove his mask. The gas is also helpful for disguises since it can change
        the color of his suit and hair. Besides these, the gas can also be used as
        a smokescreen against his enemies, and has psychotropic properties which Sage
        eventually uses to amplify his senses and chi awareness. Besides the belt,
        the gas can also be summoned via the Question''s hands. * Calling Cards: Question
        often leaves calling cards that also emit the same binary gas, which he has
        shown to use as weapons, specifically as a custom specialized type of smoke
        grenade. * Optional'
