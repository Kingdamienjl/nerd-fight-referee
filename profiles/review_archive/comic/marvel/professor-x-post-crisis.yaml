        \ was the entity Onslaught, which was a physical manifestation of that dark\
        \ side. Also, Onslaught was created in the most violent act Xavier claimed\
        \ to have done: erasing the mind of Magneto. Once the X-Men fought images\
        \ of the original team, which had been created by what Xavier said was his\
        \ \"evil self ... who would use his powers for personal gain and conquest,\"\
        \ which he said he was normally able to keep in check. * Telepathy: Xavier\
        \ is vulnerable to disturbing images when using telepathy, even incapacitating\
        \ or killing him. In other instances, Xavier was shown to be secretive and\
        \ manipulative. During the battle against Onslaught, the X-Men found Xavier's\
        \ files, the \"Xavier Protocols\", which detailed how to kill many of the\
        \ characters should the need ever arise, such as if they went rogue. Also\
        \ it was revealed that when Xavier realized that the Danger Room had become\
        \ sentient, he kept it trapped and experimented on it for years, an act that\
        \ Cyclops called \"the oppression of a new life\" and equated to humanity's\
        \ treatment of mutants. Later still, a de-powered Xavier was forced to admit\
        \ that he had sent a group of hastily trained young mutants and carelessly\
        \ sent them to Krakoa to save the original X-Men, resulting in their deaths.\
        \ Because one of the mutants was Cyclops' brother Vulcan, Xavier erased Cyclops'\
        \ memory of the event. He further manipulated the rescue team of new X-Men\
