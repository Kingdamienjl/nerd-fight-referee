    - field: weaknesses
      value: 'Doom is very arrogant and overconfident, and sometimes becomes bored
        and allows his opponents to win. He cannot retain the Power Cosmic to the
        same extent as the Silver Surfer or Galactus, as he is still only a human.
        When wielding Galactus'' power, Doom is subject to his hunger. During Secret
        Wars, he couldn''t fully control the immense powers of the Beyonder. Notable
        Attacks/Techniques: Psionics: Doom has studied and gained access to a host
        of mental abilities, evolving as a being through his extensive mental development.
        *Hypnosis: Doom has the power to hypnotize others through eye contact, dominating
        their minds with his overwhelming willpower. He has even done this against
        beings as powerful as a Kraken (though he did note the Kraken to have a brain
        "the size of an apple"), as well as people with high mental resistance such
        as Reed Richards. *Ovoid Mind Transfer: A mental power that Doom learned from
        the alien Ovoids. By making eye contact with another being, he can transfer
        his consciousness into their body and dislocate their psyche through sheer
        force of ego,Guardians of the Galaxy (2020) #14 switching places with their
        original consciousness, and leaving them in his old body. As he prefers his
        own body to that of any other, he dislikes doing this, but will do it if necessary,
        and can even use it multiple times in quick succession while fighting. He
        can even use this ability to transfer his soul to other bodies. Magic: Doom
        is one of the greatest sorcerers on Earth. He has amassed this magical knowledge
        from several tutors and sources over the years, reading from many tomes of
        black magic (including those inherited by his sorceress mother) and training
        under Morgan le Fay, Cagliostro, Doctor Strange, the Haazareth Three, and
        the Marquis of Death. *Crimson Bands of Cytorrak: A spell that draws power
        from the god Cyttorak to create several red energy rings to bind an opponent.
        *Dreamtime: Thanks to his research, Doom can access the Australian Aboriginal
        Dreamtime to communicate with others through their dreams. *Healing: Doom
        can use his mystic abilities to heal himself and others, such as to heal his
        arm after Skaar severed it in two. *Magical Banishment: Doctor Doom can banish
        a moon demon named Anamelech from the mortal plane of existence with a spell
        along with all of Anamelech''s arcane artifacts. *Mystical Forcefield: Doom
        can create magic shields strong enough to withstand Morgan Le Fay''s attacks,
        and even while wounded was capable of creating forcefields powerful enough
        to block attacks from the Thing and Kulan Gath. He can also summon the Shield
        of the Seraphim, which he can use as a battering ram in addition to being
        a shield. *Mystic Bolts: Doom was able to overpower the sorcerer Wiccan in
        a magical duel. *Power Removal and Absorption: Using magic, Doctor Doom easily
        stripped the powerful sorceress Ceranda of her powers and took them for himself.
        *Sealing: Like most master sorcerers, Doctor Doom is skilled in magically
        sealing hostile entities away and stripping them of their power, even those
        as powerful as Hela, who is both a Hell Lord who ruled over Hel as well as
        the Norse Goddess of Death. *Spirit Reversal: A spell that crippled The Sentry,
        but only due to his unstable mental state. *Summoning: Doom can summon a variety
        of demons and monsters, calling upon entire hordes of demonic abominations
        like the Mindless Ones to fight against his opponents, some of which are strong
        enough on their own to match the likes of the Thing, and overwhelm the Avengers.
        *Teleportation: Doom''s mystic abilities allow him to teleport, and he can
        even interfere with the teleportation spells of others, controlling and changing
        their destinations so they will arrive wherever he pleases, even on a far-off
        planet or light years away. *Temporal Banishment: Doom was able to easily
        banish Morgan le Fay back in time, stranding her in 1,000,000 B.C. Note: *This
        profile only covers the 616 version of Doctor Doom. Not all of the features
        described in his armor are present at once (although they could be), and many
        of them are devices that he made in the past. *Before making any changes to
        this page, please read and follow the Power-scaling Rules for Marvel and DC
        Comics. ==Notable Matchups== Victories: * Yakagi Suimei (Isekai Mahou wa Okureteru!)
        Yakagi''s Profile (Doctor Doom''s Sorcerer Supreme Key and Yakagi''s Archiatius
        Overload Key were used. Speed was equalized, and Doom''s optional equipment/preparation
        was restricted) Losses: * Rimuru Tempest (Tensei Shitara Slime Datta Ken -
        Light Novel) Rimuru''s Profile (Both sides had acess to an SSD with all Chess
        books ever written up until 2026; Rimuru had 20 seconds of preparation time
