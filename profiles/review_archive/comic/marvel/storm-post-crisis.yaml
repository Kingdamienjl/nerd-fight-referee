        elements and rearrange them. To do this the element must know the exact elemental
        make-up of the object or human. Most Firestorms cannot affect living tissue
        but it is possible though very unstable. * Density Control: Firestorm has
        complete control over molecules and as such can change the density of solids,
        liquids and gases to as light as hydrogen or as heavy as uranium. Although
        he has direct control over an object''s density he can use this ability on
        himself and only himself and affect living tissue to pass through objects.
        * Matrix Memory Recall: Elements tied to the Firestorm Matrix can access the
        memories of each and every single being that has ever been fused into the
        Matrix. New elements are allowed to automatically download surface information.
        *Energy Manipulation: **Energy Projection: Firestorm can project massive amounts
        of different amount of energies. Naturally occurring energy projected by Firestorm
        are "Nuclear Blasts" however elements can project a number of different energies
        at will, such as Kryptonite energy. **Energy Absorption: Firestorm can absorb
        massive amounts of energy as well as being able to absorb many different types
        of energy. Most commonly the elements and energies associate with life and
        the human body are absorbed. **Forcefield Creation: Firestorm can create energy
        shields and energy forcefields to deflect and stop attacks, like energy beams
        and punches *Quark Vision: The ability to see extremely small objects and
        images down to the subatomic level. *Self-Sustenance: Elements tied to the
