      value: While tutoring his new, impatient apprentice, Kyllian was pulled into
        another dimension by a talisman. When Strange managed to find him, Kyllian
        refused to go; preferring to remain with Iskelior, a woman he met there. The
        bickering sorcerers were interrupted by the ancient sorceress Lilith, who
        began tearing down the mystical barrier to allow her demonic offspring, the
        Lilin, passage to Earth. Kyllian remained behind to seal the dimensional tear,
        and Strange returned to Earth, promising to rescue Kyllian later.{{r|Doctor
        Strange, Sorcerer Supreme Vol 1 58|59}} Joining the Midnight Sons, Strange
        confronted Lilith and her Lilin. At one point the Midnight Sons were menaced
        by a blood lusting Morbius, while Wong's betrothed, Imei, was dying from the
        poisoned kiss of the Lilin Sister Nil. Strange chose to subdue Morbius' bloodlust,
        saving the most people possible, but allowing Imei to die. Furious, Wong left
        Strange, and would even try to kill him on later occasions. Eventually, the
        Midnight Sons were victorious, and the Lilin were sealed back away in another
        dimension. In the meantime, Kyllian was rescued by Modred the Mystic, and
        returned to Earth in the form of Wildpride, now more in control of his "animal
        magick," and bearing a grudge against the master he felt abandoned him.{{r|Doctor
        Strange, Sorcerer Supreme Vol 1 60|61}} ===Un-Earth=== Strange was later part
        of an international coalition of heroes opposing the techno-magical Mys-Tech
        and was one of the six beings who stabilized the unraveling reality created
        by the clandestine group's "Un-Earth," a mystical replica they planned to
        use to control the real Earth.{{Citation}} ===Salome=== Strange again had
        to defend his title as Sorcerer Supreme, this time from Salome, a winged member
        of the mysterious Blood race and allegedly the first Earth-born Sorcerer Supreme
        over 20,000 years ago. Salome easily reclaimed the mantle from a weakened
        Strange and began gathering followers to help her rule the Earth. Unable to
        stand against Salome, Strange secluded himself in a pocket dimension, taking
        Sister Nil (the last of the Lilin remaining in the Earth realm) to record
        his actions and act as his assistant. From that dimension, he dispatched two
        magical constructs based upon himself to tend to his earthly affairs. The
        first, Vincent Stevens, became a cunning businessman, and built a fortune
        with which to develop so-called "technomagick." The other was a being called
        Strange, a masked figure who fought alongside the Midnight Sons and gathered
        artifacts for Strange to use against Salome. Strange also left the leadership
        of the Secret Defenders to Doctor Druid, another of the Ancient One's pupils.
        Though Doctor Druid served as best he could, he was ultimately unable to lead
        the group.{{Citation}} Possessing only a few of his artifacts and mystically
        poisoned by Salome's dance, Dr. Strange realized that he would have to focus
        on developing his weakest discipline, elemental magic, in order to reclaim
        the mantle of Sorcerer Supreme. Dr. Strange had barely finished enhancing
        his sorcery when Stevens and Strange rebelled against him. Stevens was apparently
        destroyed in the resulting conflict, and Strange went to the Dark Dimension,
        where he merged with the rebellion's Nobel as Paradox. Meanwhile, Salome had
        enlisted Wong against his old master, claiming to have bound Imei's soul to
        the demon Xaos, and promising a full resurrection in exchange for his service.
        Later, Strange would show Wong that Salome had been deceiving them and that
        Imei was truly dead. Wong gained some closure when Strange took him to visit
        her in the afterlife, and the two eventually reconciled. This time, however,
        Wong joined Strange as an equal partner, and in many ways a brother, not a
        servant. Wong still referred to Strange as "Master" from time to time because
        "old habits are hard to break."{{Citation}} ===War of the Seven Spheres===
        After defeating Salome, Dr. Strange temporarily assumed a younger, more violent
        persona as he began to track down and terminate the illegal operations established
        by Stevens. Dr. Strange was still cleaning up after Stevens when he was again
        summoned by the Vishanti to serve in the War of the Seven Spheres; unwilling
        to lose any more of his already diminished power, this time Strange complied.{{Citation}}
        Although from his perspective Strange spent 5,000 years fighting for the Vishanti
        against their enemies, the Trinity of Ashes, only a few months passed on Earth
        by the time he returned. During this time, he was forced to thoroughly violate
        his moral code in order to survive. By the end Strange was an utterly broken
        man who no longer identified as a doctor but as a general, willing to commit
        any atrocity if it meant winning. The Trinity sued for peace on the condition
        that Strange be locked away for their protection. The Vishanti, no longer
