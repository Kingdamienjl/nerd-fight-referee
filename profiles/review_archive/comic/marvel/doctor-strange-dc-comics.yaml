    - field: lifting_strength
      value: 'These spells seem to be quicker to perform but lesser in power than
        spells using divine energy. Strange has used his magics altogether to alter
        his clothing through something akin to minor molecular control, control and
        manipulate elements, matter manipulation, soul manipulation, warping reality,
        absorbing magic, time manipulation, magic sleep, etc. * Dr. Strange has also
        been shown to amass as much wealth/gold as he desires using magic, as he has
        done to pay debts he owed.{{Citation}} The Words: Doctor Strange has become
        an expert in the Black Priests''s ability to use language to distort reality,
        becoming even more capable than the Black Priests themselves in a short amount
        of time. Each "word" is a symbol which means "something." The addition of
        another symbol can change the meaning of that "something." Doctor Strange
        stated this method to be akin to {{WP|Substitution cipher|replacement cipher}}.{{r|New
        Avengers Vol 3 27}} This way, he can {{Power|Reality Warping|distort the reality}}
        in different ways, depending how many symbols are said and in which order.
        Some of the features achieved by the use of Words include: * {{Power|Fire
        Generation}}{{r|New Avengers Vol 3 13}} * {{Power|Decay Inducement|Organic
        Disintegration}}{{r|New Avengers Vol 3 13}}{{r|New Avengers Vol 3 27}} * {{Power|Ice
        Generation}}{{r|New Avengers Vol 3 27}} * {{Power|Paralysis}}{{r|New Avengers
        Vol 3 27}} Divine Sources: Dr. Strange can channel the extra-dimensional energy
        of mystical and non-mystical beings in multiple dimensions (known as Principalities)
        to empower his spells. This can take the form of standard spells ("Crimson
        Bands of Cyttorak") or just state what he wants to occur and channeling some
        being to make it happen. It is unknown at this time what debt, if any, he
        incurs by invoking the powers that be. There is no strict quid pro quo (as
        the simple acknowledgment and invoking of the entity increases the entity''s
        own powers, inexplicably), though some entities will feel he is obliged to
        heed their call when they need help in their conflicts as did the Vishanti.
        This ability to be a conduit to multiversal power sources has given rise to
        the phrase "Dr. Strange is as powerful as the god he invokes." Doctor Strange''s
        powers typically come from one of three divine sources: The Vishanti (a trinity
        formed of Hoggoth, Oshtur, and Agamotto), the Octessence (a group of eight
        beings, consisting of Balthakk, Cyttorak, Farallah, Ikonn, Krakkan, Raggadorr,
        Valtorr, and Watoomb) and other beings who owe him a debt (this includes Satannish
        and even Dormammu). However, certain abilities of his stem from more obscure
        sources, such as the Faltine, the Seraphim, Cinnibus, Sheol, Ikthalon, Denak,
        Cyndriarr, Munnopor, Morpheus, Dyzakk, the Olympian deities (such as Poseidon
        and Hades) and others.{{Citation}} Darkness of the Divine Conduit (Black Magic):
        By sheer force of will "take" the power of another entity. This does not require
        the use of a spell. He used this ability against Arioch and Shuma-Gorath.
        The fact that Stephen can do this is a testament to his incredible willpower
        and strength of mind. This is considered black magic and as such he rarely
        employs this. Also, when taking the powers of celestial entities, he absorbs
        the mind and assumes their duties and roles in the dimension in which they
        exist. If his will falters, he can lose all sense of self.{{Citation}} Although
        Dr. Strange primarily uses spells that are considered ''white magic'', he
        will use spells from other disciplines such as black magic, elemental magic,
        and catastrophe magic when necessary.{{Citation}} Dr. Strange''s powers are
