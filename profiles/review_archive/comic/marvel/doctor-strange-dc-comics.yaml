    - field: powers_and_abilities
      value: 'Former Expert Surgeon/Surgical Consultant: Strange holds an M.D. in
        neurosurgery and was once considered one of the foremost experts in his field.
        However, the nerve damage he suffered in his car crash severely compromised
        the manual dexterity in his hands, preventing him from performing surgery
        except when temporarily supplemented by magic. Even without magic, Strange
        retains his medical knowledge. He still practices medicine, was the Illuminati''s
        surgeon, and can guide other less skilled, yet un-maimed surgeons through
        intense effort, and is still capable of serving as a consultant. Expert Occultist
        & Magical Knowledge: During his studies which continued until recently Dr.
        Strange has gain expert awareness on cults and the extra-dimensional entities
        they worship, this knowledge as of yet far exceeds any on Earth in the Marvel
        Universe. Expert Strategist: Though Stephen seems to suffer from an impulsive
        nature, instinctively jumping into situations of life-or-death, it''s apparent
        that he works best this way possessing considerable strategic skills, which
        has been employed in leadership structures, and spontaneous situations, all
        of which is a necessity in the random environment of Mysticism. Expert Martial
        Artist: Dr. Strange is a skilled athlete and was trained in the martial arts
        used by Tibetan monks in Kamar Taj, proving sufficiently talented to pass
        down such training to others, such as Clea. These talents have assisted him
        from time-to-time when incapable of using his sorcery. Strange is a formidable
        opponent to any skilled attacker and continues to train regularly with Wong.
        He has in some cases, been known to occasionally spar with other heroes; in
        one case, Strange was able to evade a kung fu hand-chop by Mantis (the future
        mother of the Quoi) "only three others have ever done" and who has been able
        to subdue Thor in sheer physical combat, despite his strength nearly hundreds
        of times superior to his own.'
      source_id: fandom-marvel-doctor-strange-dc-comics
      provider_id: ''
      authority: ''
      confidence: 0.75
    - field: weaknesses
      value: 'Science-Based Weakness: It has been said Strange''s power is weaker
        against strictly science-based opponents. Incantations and Gestures Dependency:
        Strange also depends on spoken incantations, mystical gesturing, and his arcane
        artifacts in his duties; likely these can be counted as weaknesses. Strange
        has been incapacitated various times by being gagged and bound, preventing
        him from uttering arcane invocations or performing mystic gestures. The Hulk
        breaking his hands greatly crippled his magic ability. Human Factor: Another
        weakness is that Strange, despite all his spells and magical training, is
        only human physically. Hence, if not taking proper care or defenses, Strange
        can be overpowered by mere blows, energy attacks, or gas. While technically
        immortal per se, he still must eat, sleep and breathe in order to survive.
        Astro-Limits: Such is the skill and mastery of Doctor Strange that he is capable
        of spending up to 24 hours upon the astral plane before he must rejoin his
        ethereal form with his physical one, lest succumb to corporeal deterioration
        leading to bodily death and eternal suspension as a spirit. The physical form
        remains in an inert, death-like trance, vulnerable to both physical and magical
        forms of harm while the astral form is absent. If harm were to befall his
        physical form while he was in his astral form, he would be stranded in his
        wraith-like state. Though Strange has only his personal abilities in his astral
        form, the Ring of the Ancient One/Ring (of Full Power) can grant him access
        to the same resources he possesses in his physical body; however, certain
        writers and editors appear to have portrayed Strange in an astral form capable
        of feats beyond his personal abilities even without the Ring. According to
        Baron Mordo, the intense atomic radiation of the sun''s core can change the
        composition of astral forms. Magic-Induced Physical Changes: A fact not known
        by many people is that the use of magic takes a physical toll on its user.
        During his first lessons, Stephen vomited for three days straight because
        of this. As years went by, Strange''s body changed so much his stomach can''t
        even accept human food and can only ingest that which would kill a normal
        person. Mysterium: Strange is vulnerable to the anti-magic metal known as
        mysterium. It is immune to his magic and it can render Strange powerless.'
      source_id: fandom-marvel-doctor-strange-dc-comics
      provider_id: ''
      authority: ''
