    - field: weaknesses
      value: 'His webbing can be burnt through by a powerful enough corrosive liquid
        and its adhesiveness can be negated with teflon spray. ==Explanations== *When
        Spider-Man: The New Animated Series aired on MTV, the episodes were released
        out of order. When citing episodes, please refer to the DVD''s episode order.
        *This Spider-Man should also not be confused with or scaled to the Sam Raimi
        version of the character. The idea that the show connects to the Sam Raimi
        Trilogy is a common misconception resulting from the first film''s popularity
        influencing certain aspects of the cartoon, which was originally taking a
        majority of its inspirations from the Earth-1601 comics. Even without taking
        into account how the later films conflict with the series, Spider-Man: The
        New Animated Series still makes direct contradictions to the events of Spider-Man
        (2002). **In Spider-Man: The New Animated Series, Harry says "Let me ask you
        something, Pete. Ever seen my dad from age 14 ''till college?", meaning that
        this version Norman Osborn met Peter when he was very young.Spider-Man: The
        New Animated Series, Episode 3: Law of the Jungle This explicitly conflicts
        with Spider-Man (2002), when Peter meets Norman for the first time. **In Spider-Man:
        The New Animated Series, Spider-Man had fought Kraven and sent him to a Russian
        gulag "years ago".Spider-Man: The New Animated Series, Episode 12: Mind Games,
        Part OneSpider-Man: The New Animated Series, Episode 13: Mind Games, Part
        Two Because Peter is 18 years old in this show, the same age when Raimi Trilogy
        Peter became Spider-Man, this is another explicit contradiction to Spider-Man
        (2002). **In Spider-Man (2002), Peter mentions being fired from his lab assistant
        position with Doctor Curtis Connors. In Spider-Man: The New Animated Series,
        Peter is helping Connors on a project that is very personal to the latter.Spider-Man:
        The New Animated Series, Episode 3: Law of the Jungle *While Spider-Man has
        dodged Electro''s electricity blasts, he has never been shown capable of dodging
        actual lightning bolts. *A majority of the feats during the events of the
        episode Mind Games, Part One should not be used, as they were simply events
        that the Gaines Twins tricked Spider-Man into believing were true with their
        mind powers. ==Gallery== 772spidey.jpg TNAS-Spidey.png Peter Parker (Earth-760207)
