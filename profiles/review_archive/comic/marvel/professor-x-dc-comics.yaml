      value: ': A natural genius, Xavier is a leading authority on genetics, mutation,
        and psionics. He possesses considerable expertise in other life sciences.
        Mutagenic Surgical and Therapy Expertise: With his ex-wife Moira Kinross,
        Xavier worked to help mutants, devising new therapies and surgical techniques
        for their unique patients. Ethical, Linguistic and Anthropological Expertise:
        Charles and Erik Lensherr developed concepts for a new mutant culture, including
        an alphabet and language and a new moral code. Enhanced Learning Capabilities:
        Xavier told Beast that for both of them such was the thirst for knowledge
        that there came a point when they couldn''t turn a page fast enough. Experimental
        Surgical Expertise: When cutting-edge surgery including a kangaroo kidney
        transplant must have been performed on Beast, Xavier and Jean Grey acquired
        the experimental surgical skills by reading the minds of top-notch surgeons.
        Biochemistry Expertise: Charles and Erik Lensherr developed the power-enhancing
        drug Banshee from the DNA of the Mutant Wolverine. : An author, the Professor
        went on a publicity trip to Europe to promote his book.'
