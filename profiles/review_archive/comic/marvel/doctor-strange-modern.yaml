power_scale:
  tier:
    text: '4-B | High 3-A to 2-C via Universal Destruction | 1-C with amplifications
      | High 1-A at peak Name: Stephen Vincent Strange Origin: Marvel Comics Age:
      Several Thousands of Years Olds; 91 Years Old Classification: Sorcerer Supreme,
      formerly Professional Surgeon'
    source_ids:
    - character-stats-profiles-doctor-strange-modern-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Solar System Level (Popped Supernovas), High Universal to Low Multiversal
      Level (Destroyed an entire dimension for being too evil, used all of his power
      to reverse the True Wheel of Change which can cause the universe to turn in
      on itself, destroyed an aspect of the True Wheel of Change, Inscribed a mystic
      circle and seal using the very soul itself; Strange then wielded that power
      described as pure life itself and capable of shaping or shaking a universe,
      and Surrounded the universe with chains), Complex Multiversal Level (Eternity
      stated Strange was a threat to The Multiverse and disturbs its balance, Sends
      signals across The Multiverse, "Avatar" for Eternity, matched The Infinity Gauntlet
      when he used all his Tailsman, and has battled, contended, defeated, & hurt
      Dormammu, Umar, Zom, Nightmare, Mephisto, Galactus, Ghost Rider, and Arioch.
      Created a barrier strong enough to block a maelstorm that was tearing through
      the void of Eternity, overpowered an alternate version of himself who was enhanced
      by a portion of Eternity's power, and both destroyed what was left of The Marvel
      Multiverse and gained power from The Living Tribunal to maintain The Multiverse's
      balance), High Outerversal Level (Hurt The Pre-Retcon Beyonder, encountered
      beings from The Omniverse, contended with a Living-Tribunal amped In-Betweener
      and Holt the destruction of The Nexus of All Realities; Defeated Shuma Gorath
      and The In-Betweener)
    source_ids:
    - character-stats-profiles-doctor-strange-modern-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At least Infinite (Comparable to the Ancient One, who reacted to Umar's
      Bolt of Bewilderment in a microsecond, and Baron Mordo whose power was used
      to fuel an incantation which sent him hurling across countless dimensions, at
      a speed which "defies mortal calculation". With the Scroll of Watoomb, he could
      instantly return after Adam Warlock sent him to the edge of the universe through
      the Infinity Gauntlet. Has fought and reacted to Mephisto on multiple occasions.
      Reacted to Borgo, a perfect copy of the Silver Surfer), up to Immeasurable at
      peak (Held his own against Dormammu in the Dark Dimension even before becoming
      Sorcerer Supreme, and forced Dormammu to exert a large deal of energy during
      their battle despite being inferior in power. Reflected a blast from Umar while
      she was in the Dark Dimension. Fought evenly with Nightmare) with magic, higher
      with certain artifacts and spells (When he had the power of Lord Chaos and Master
      Order, overwhelmed The In-Betweener). Irrelevant by uniting himself with Eternity
    source_ids:
    - character-stats-profiles-doctor-strange-modern-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: At least Solar System level with Forcefields (The Crimson Bands of Cyttorak
      defended his physical body from a supernova at point-blank range. Can hold back
      the power of Borgo, a perfect clone of the Silver Surfer created out of the
      latter's own energy. His invisible, automatic shields can protect him from Voltorg's
      atomic lightning, which was claimed by Yandroth to have the power to "hurl stars
      from their paths", only leaving him stunned due to the impact of the blast),
      Up to High Outerverse level at peak (Survived a psychic blow from Umar when
      she caught him off-guard after he momentarily put his magic shield down. Withstood
      beatings from the Mindless Ones in the Dark Dimension and blocked their beams
      with the Cloak of Levitation, during a period in time when the Mindless Ones
      were portrayed as a threat to Dormammu himself, Took a blast without any shielding
      from a serious and Hell-amplified Mephisto who was also amplified above his
      normal Hell-amplified self "a thousand-fold") and with his strongest forcefields
      (Strange's forcefields managed to shield him from the battle between Dormammu
      and Eternity, one which Strange said threatened to destroy both Dormammu and
      Eternity and was also stated to have caused a "transdimensional holocaust",
      with Dormammu confirming Strange's shields saving him from the clash. He and
      Clea using magic forcefields managed to shield against Dormammu's attack which
      was further amplified by him drawing on the Dark Dimension for power, and they
      would've overpowered Dormammu together with their forcefields had Baron Mordo
      not sneak-attacked them. Blocked multiple attacks from a serious and Hell-amplified
      Mephisto who was also amplified above his normal Hell-amplified self "a thousand-fold"),
      higher with certain Artifacts and Spells (Capable of uniting his being with
      Eternity through the Eye of Agamotto, and vastly increase his magical abilities
      by merging with, or drawing power from beings as powerful as Arioch and Shuma-Gorath.
      Capable of imbuing his magic with the power of Cosmic Entities such as Lord
      Chaos and Master Order, allowing him to stand up to, and even overwhelm the
      likes of The In-Betweener)
    source_ids:
