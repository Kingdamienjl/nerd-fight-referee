        \ fight against a demonically-possessed Wolverine, who is stated to have his\
        \ power amplified by those demons. Can fight those who can harm him) to Outerverse\
        \ level with magic (Fought evenly with Nightmare, and could break his attack\
        \ spell even while only in his astral form. Nightmare also views him as an\
        \ equal in power, with Strange stating himself to be Nightmare's equal. Held\
        \ his own against Dormammu even before becoming Sorcerer Supreme, and forced\
        \ Dormammu to exert a large deal of energy during their battle despite being\
        \ inferior in power, and as Sorcerer Supreme his most powerful sorcery could\
        \ dispel a whirlwind which significantly drained Dormammu's power through\
        \ its use. While inferior, held his own against Zom, who is stronger than\
        \ Umar at her peak, Dormammu at his peak, or Eternity. When enraged, easily\
        \ overpowered the mystic warlord Tiboro (even stating that he could kill Tiboro\
        \ whenever he wanted if he so wished) and was willing to take on Umar as well\
        \ without issue, with Tiboro himself being portrayed as comparable to Umar\
        \ and also being entirely unafraid of the Dweller in Darkness, who is comparable\
        \ to Nightmare), higher with certain Artifacts and Spells (Capable of channeling\
        \ the power of, and summoning Cosmic Entities such as Lord Chaos and Master\
        \ Order, having done so in order to overwhelm and imprison The In-Betweener,\
        \ and can unite with Eternity himself, causing him to become \u201Cone-with-all\u201D\
        \ and feel in many more dimensions than four. Could forcibly merge himself\
        \ with the demon Arioch - who claimed to be \"not even finite\" and completely\
        \ dwarfed Mephisto and Satannish in power and scope, rendering them akin to\
        \ \"mice in a great temple\" - allowing him to fight evenly against Shuma-Gorath.\
        \ Temporarily achieved a balance of power against The Infinity Gauntlet by\
        \ using the combined power of every single magical artifact in his possession)"
