        \ their annual confrontation.{{r|Astonishing Tales Vol 1 8}} His physical\
        \ strength and durability match even those of Daredevil.{{r|Daredevil Vol\
        \ 1 38}} *Indomitable Will: Doom has phenomenal determination, fearlessness,\
        \ and strength of will. Indeed, he has the strongest will on Earth. Hence,\
        \ he was able to resist psychic attacks from Emma Frost and the mind control\
