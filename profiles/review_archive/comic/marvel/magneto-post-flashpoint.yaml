        \ in all levels of physics, robotics, cybernetics, genetics, materials science,\
        \ weapons technology, biochemistry, and time travel. He also has natural talents\
        \ for leadership, strategy, politics, and manipulation. He was taught under\
        \ leading roboticist Dr. Cronos. He has been shown as a prodigious electrical\
        \ and mechanical engineer, admired by Tony Stark,{{r|Iron Man Vol 1 150}}\
        \ an inspired theoretician with extensive knowledge of parallel universes\
        \ and dimensions,{{citation}} and even a practiced neurosurgeon, having surgically\
        \ separated Hulk from Bruce Banner.{{r|Incredible Hulk Vol 1 5}} His knowledge\
        \ extents to virtually any scientific field and his mind is said to work as\
        \ fast as a sophisticated computer.{{r|Fantastic Four Vol 1 373}} Doom's knowledge\
        \ of magic enhances his scientific brilliance; the time platform is a result\
        \ of combining the two skills.{{r|Venom Vol 5 25}} Doom\u2019s consciousness\
        \ was vast and powerful enough to download a planet\u2019s worth of data.{{r|Doom:\
        \ The Emperor Returns Vol 1 1}} *Master Martial Artist: During his time in\
        \ Tibet, Doom was presumably trained in martial arts by the monks.{{r|Fantastic\
        \ Four Vol 1 278}} He is vastly skilled in many combat techniques, both armed\
        \ and unarmed. He has been trained by the best sword masters on Earth{{r|Super-Villain\
        \ Team-Up Vol 1 13}} and can achieve very powerful nerve strikes.{{r|Doom\
        \ Vol 1 1}} His combat skills are so great that he managed to kill a lion\
        \ with his bare hands,{{r|Doom Vol 1 1}} to be indistinguishable to Daredevil\
        \ while in his suit,{{r|Daredevil Vol 1 37}} and to wield Captain America's\
        \ shield as skillfully as Steve Rogers himself.{{r|Avengers Vol 1 25}} He\
        \ was also able to defeat Black Panther in close combat even when his suit\
        \ was depowered{{r|Black Panther Vol 4 19}} and incapacitate Taskmaster on\
        \ pure hand to hand, without the aid of technology or magic.{{r|Doctor Doom\
        \ Vol 1 4}} *Expert Occultist & Magical Knowledge: Years of extensive training\
        \ and studying under various magical experts, as well as years of time travel,\
        \ battling supernatural enemies and learning various lost arts of magic and\
        \ mysticism have made Doom incredibly knowledgeable in the occult and the\
        \ wider fields of magic altogether. *Peak Human Conditioning: Doom has trained\
        \ his body to the level of the finest human athlete. He is well-built, fast\
