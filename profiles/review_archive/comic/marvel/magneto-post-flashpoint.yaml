    - field: durability
      value: 'The armor is fashioned of a high-strength titanium alloy enchanted with
        magic and has been shown durable enough to take a blast from the Infinity
        Gauntlet to point-black range, with little to no harm.{{r|Infinity Gauntlet
        Vol 1 4}} The armor managed to withstand a massive explosion of energy at
        ground zero , from the Marquis of Death - which destroyed the entire capital
        of Latvia and the rest of the country.{{r|Fantastic Four Vol 3 567}} ** Video
        Communicator: Built into the right wrist is a video communicator, which he
        can use to stay in contact with his bases from any point on Earth. ** Electric
        Shock: The outer surface of the armor can generate a massive electric shock
        on command. ** Electrical Field:{{r|Machines of Doom Vol 1 1}} Also known
        as Electrical Force Field,{{r|Giant-Size Super-Villain Team-Up Vol 1 1}} the
        Electro-Magnetic Amplifier{{r|Fantastic Four Vol 1 199}} and Neural Disruptor,{{r|Uncanny
        X-Men Vol 1 145}} this mechanism allows Doom to generate a point-blank electric
        shock causing enormous damage to anyone daring enough to touch Doom - for
        example, someone in melee with him. It also affects, to a lesser extent, nearby
        people not in direct contact with Doom''s armor. Anyone affected is susceptible
        to falling unconscious.{{r|Machines of Doom Vol 1 1}} Doom used this device
        to kill his clone{{r|Fantastic Four Vol 1 199}} and also to knock down Elvin
        Haliday{{r|Avengers Vol 1 333}} and even Colossus, who had resisted previous
