- id: claim-powers-and-abilities-b3cc53cf
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Reality Warping *Accelerated Development
    (Passive; Abilities. His main power is to warp reality and "it gets stronger all
    the time"Marvel Super-Heroes (UK) Vol 1 #387) *Subjective Reality & Creation (Created
