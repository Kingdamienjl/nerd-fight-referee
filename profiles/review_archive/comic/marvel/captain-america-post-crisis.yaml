    - field: lifting_strength
      value: thumb|left|225px|Speaking in the name of the Avengers With Captain Marvel
        reforming the Avengers, Sam Wilson accepted her invitation to serve as Captain
        America and provide a ground, civilian-oriented perspective to the team. This
        place him in an uneasy position with his teammate Black Panther due to their
        recent tensions.{{r|Avengers Vol 9 1}} The Avengers preemptively addressed
        threats of any scale. In Pittsburgh, for instance, Wilson used his skills
        as a social worker to convince an exhausted rig driver to rest before causing
        a fatal crash.{{r|Avengers Vol 9 2}} When the Ashen Combine targeted Earth,
        Captain America and the Black Panther infiltrated their orbital fortress,
        Impossible City, to disable it.{{r|Avengers Vol 9 3|4}} Inside, they conversed
        with the station's enslaved intelligence{{r|Avengers Vol 9 5}} and liberated
        it from its handlers. The thankful city became their new headquarters.{{r|Avengers
        Vol 9 6}} The friction between the two Avengers eased when Earth was engulfed
        in a Darkforce calamity triggered by Varnae's vampiric invasion. Black Panther
        allowed himself to be captured to ensure Captain America escaped with the
        rest of the Avengers.{{r|Blood Hunt Vol 1 1}} Being free, Captain America
        broadcast a speech of hope and resistance on the Avengers' behalf,{{r|Blood
        Hunt Vol 1 3}} which was crucial in ending the catastrophe.{{r|Blood Hunt
        Vol 1 5}} thumb|250px|right|Against Eaglestar's Red Hulk As a constant presence
        in Harlem, Sam Wilson organized a reunion of Black super-heroes to honor Isaiah
        Bradley, the veteran Captain America. During the event, his cousin, Billie
        Wilson, mentioned she had enrolled him up for a land repurposing program run
        by Eaglestar. Aware of their ill history, Captain America investigated their
        operations in New Mexico, being escorted by Dennis Harmon to Skydream, an
        airborne, eco-sustainable community designed with Wakandan technology by dissident
        Dr. Cangza. Considering Wilson as a threat, deployed Lieutenant Robert Maverick,
        empowered as the Red Hulk, to neutralize him.{{r|Sam Wilson, Captain America
        Vol 1 1}} Having been detained, Wilson reunited with Torres, who had been
        subjected to Eaglestar's experiments to weaponize human flight. The son of
        Isaiah Bradley, the super combatant Shadow Soldier, stormed the flying base
        and broke them free. Billie Wilson, however, refused rescue, having embraced
        the fallacy of Skydream.{{r|Sam Wilson, Captain America Vol 1 2}} Brainwashed
        as well through the use of Jufeiro, Sam Wilson forced into agricultural labor
        on Skydream. Seeing through the deceit, Captain America and his cousin alarmed
        the Falcon and the Shadow Soldier. When infiltrating the secret facilities,
        the heroes were opposed by the War Angels, a unit of winged soldiers. They
        also realized Eaglestar's plan of targeting cities with significant Black
        populations to expand their army of slaves.{{r|Sam Wilson, Captain America
        Vol 1 3}} Outraged by the operation, Wilson proposed the destruction of Skydream,
        but was convinced by Billie Wilson of stealing and repurposing it instead.
        Although having rallied Maverick and Dr. Cangza to his side, Captain America
        was unable to break through Harmon's force fields.{{r|Sam Wilson, Captain
        America Vol 1 4}} Harmon threatened to incinerate the Bronx, causing Captain
        America to direct the strength of the Red Hulk to destroy his defenses. After
        Harmon died in action, Captain America coordinated his allies to shut down
        Skydream. As a winged angel, Billie Wilson carried out the farmland redistribution
        she had dreamed about with her cousin's support.{{r|Sam Wilson, Captain America
