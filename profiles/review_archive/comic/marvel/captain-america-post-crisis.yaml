    - field: powers_and_abilities
      value: '*Master Acrobat: Having undergone rigorous training in gymnastics with
        Captain America, Sam Wilson is a master acrobat. Before gaining means to fly,
        he relied mainly on this ability to move and act as a vigilante, which he
        retains to this day. *Master Martial Artist: Wilson has been trained in diverse
        styles of martial arts by Steve Rogers, being forged into a proficient fighter.
        His skills have allowed him to defeat some remarkable trained opponents, such
        as four elite Spetsnaz soldiers at a time for example, and superhumans as
        strong as the Wrecking Crew members. **Master Aerialist and Flight Combatant:
        He is an extraordinary aerialist and flight combatant due to his training
        and experimentation with his mechanical wings. His experience in martial arts,
        aerialist, and flight has made him one of the best aerial fighters in the
        world, exceeding the skills of other flyers such as Iron Man and Captain Marvel.
        **Expert Shield Fighter: As a very proficient wielder of Captain America''s
        Shield, Wilson has shown himself to be able to hit several targets from the
        air with pinpoint accuracy. *Peak Human Condition: Even before his training
        with Captain America, Sam Wilson was already in optimal shape. After intensive
        and extensive training as a super-hero, he is now above average athlete and
        have pushed his body to the pinnacle of human condition. ** Peak Human Strength:
        Over years of training, Sam Wilson''s strength is at the maximum limit of
        human conditioning. He was able to sent Crossbones flying with a single force
        kick, break steel chains that tied him to a tank, as well as bending a metal
        bar with his bare hands. ** Peak Human Endurance: Sam Wilson possesses exceptional
        tolerance to physical pain. He continued to function in spite of getting chest
        stabbed from Zemo''s sword and persevered after been set on fire from one
        of A.I.M. agents'' flamethrower while ripping off his costume suit. *Leadership:
        Wilson has inspirational leadership skills. He was once assigned to lead S.H.I.E.L.D.
        Super-Agents due to his reputation as a proficient tactician and strategist.
        He has led and motivated the Avengers in different occasions as well, being
        a heartening voice within the super-hero community. His sensible skills are
        partially a result of his experience as a social worker.'
