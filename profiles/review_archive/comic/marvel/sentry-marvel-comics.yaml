        serum, to embody the negative parts of him that he can''t control and were
        accentuated by the serum. In the past he materialized on his own as a separate
        entity that balanced the Sentry''s heroics with evil, or was directly created
        when Reynolds believed him to be around. He lost power and faded when Reynolds
        willed it after achieving mental stability and dominion of himself or when
        Sentry mindwiped himself and everybody else after the Void was becoming too
        independent and powerful, also being defeated by Sentry when their balance
        was broken (after the Void killed more people than the Sentry saved). But
        the Void always returned on his own as long as Sentry existed, in fact every
        seen incarnation of the character has displayed varying degrees of the Void
        in order to be able to act against his enemies even when performing heroics.
        During the events of Secret Invasion the Sentry and the Void personas merged
        again, with the Void starting to assert dominance throughout the events of
        Dark Reign (especially manifesting after Sentry suffered mental trauma or
        severe physical damage), culminating with the Void getting released during
        the events of Siege. It was also been speculated that the Void and the Sentry''s
        power source is the Judeo-Christian God, or that Robert Reynolds became empowered
        by a similar force. * Infinitendri'
