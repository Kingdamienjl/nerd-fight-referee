    - field: powers_and_abilities
      value: '{{Navigation | title = Healers | body = It was stated by Prodigy that
        Elixir and Icarus were the last two mutant healers in the Xavier Institute.{{cl|New
        X-Men Vol 2 21}}; That statement was seemingly restricted to the Xavier Institute,
        mentioned during a discussion on the healers'' efforts to restore X-Genes
        This statement obviously forgot Angel''s blood. }} {{Navigation | title =
        Precogs | body = Steve Rogers stated that Blindfold was the sole remaining
        mutant precog among the past larger number of them.{{r|Heroic Age: X-Men Vol
        1 1}} }} {{Navigation | title = Teleporters | body = It was stated by the
        Skrull Ch''rith that there were only twelve mutant teleporters, including
        Nightcrawler, Lila Cheney, Vanisher,{{r|Secret Invasion: X-Men Vol 1 2}} and
        seemingly Pixie. }} ===Immediate attacks=== The Sapien League took advantage
        of the situation by attacking the mansion and any mutants attempting to reach
        it.{{r|Decimation: House of M - The Day After Vol 1 1}} The X-Corp office
        of Paris was bombed, and Cyclops consequently dissolved the organization.{{r|Decimation:
        House of M - The Day After Vol 1 1}} ===The 198 at the Institute=== The Xavier
        Institute became a haven for those who still had their mutant powers, many
        of them attempting to escape persecution. Against the wishes of Institute
        professors Emma Frost and Scott Summers, the government assigned Sentinel
        Squad O*N*E to protect the mansion and its inhabitants.{{r|X-Men Vol 2 177|179}}
        Mutants at the Institute rallied around the number "198", an early government
        estimate of how many powered mutants were left in the entire world.{{r|X-Men:
        The 198 Vol 1 1}} ===The Ghoul=== Reporter Sally Floyd interviewed a number
        of depowered mutants for her Mutant Diaries report. However, a serial killer
        calling himself the Ghoul murdered several of those whom she interviewed,
        leaving "Not enough died" as a marker. The Ghoul was eventually killed in
        an explosion during an attempt to capture him by the X-Men. Given the nature
        of his teleportation powers, it''s possible that the Ghoul survived.{{r|Generation
        M Vol 1 5}} ===M-Day Energy Effects=== thumb|right|The Collective with the
        mutant energies from M-Day When the Scarlet Witch depowered mutants, she did
        not destroy the energy those mutants possessed. Instead, the energies got
        expelled from their bodies.{{r|X-Men: Deadly Genesis Vol 1 1}} While passing
        some orbiting rocks, the energy awakened a dormant Vulcan (who was fused with
        Darwin). This massively boosted Vulcan''s powers (and also Darwin''s).{{r|X-Men:
        Deadly Genesis Vol 1 1|6}} Eventually leaving orbit and entering the atmosphere,
        the energy was absorbed by the Collective, turning him into an immensely powerful
        and dangerous being; the energies later got dispersed into the Sun.{{r|New
        Avengers Vol 1 16|20}} ===Mutant Town=== X-Cell, a group of former mutants
        who blamed the United States government for losing their powers, began a terrorist
        campaign.{{r|X-Factor Vol 3 17|20}} With the overwhelming majority of Mutant
        Town''s residents now depowered, the label quickly began to lose all meaning.{{r|X-Factor
        Vol 3 28}} ===Onslaught=== Somehow, Onslaught was brought back to life, and
        chased Franklin Richards to Counter-Earth.{{r|Onslaught Reborn Vol 1 1|5}}
        ===Salem''s Seven''s return=== All dead, banished, or inanimate, the Salem''s
        Seven were all returned, including Brutacus who is part mutant.{{r|4 Vol 1
        25}} ==Endangered Species== Frightened by the end of mutantkind, Beast went
        on the search for a cure.{{r|X-Men Vol 2 200}} He made a broad appeal to the
        scientific community, both heroes such as Mr. Fantastic and Iron Man, but
        also villains like Dr. Doom and Mr. Sinister. All either rejected him or failed
        to provide aid. Desperate for help, Beast was joined by his unscrupulous alternate
        reality counterpart Dark Beast.{{r|X-Men Vol 2 200}} The two made no progress,
        and after the Dark Beast endangered an innocent attempting to test a cure,
        Beast parted ways with him. He decided to track down the Scarlet Witch herself,
        and found her in Transia, seemingly with no memory of her past. Wanda provided
        no answers and encouraged Beast to move on, as did Dr. Strange.{{r|X-Men Vol
        2 204}} ==Effects== ===Effects on mutants and X-Gene=== The X-Gene was erased
        from the Depowered Mutants, without any trace.{{r|New X-Men Vol 2 21}} Depowered
        mutants were detected as Humans by devices such as Cerebra.{{r|New X-Men Vol
        2 26}}{{r|New X-Men Vol 2 31}} The Decimation affected the DNA of every mutant,
        even when separated from its source: Mutant Growth Hormone (MGH) provided
        by depowered mutants was rendered useless.{{r|Uncanny X-Men Vol 1 490}} However,
        Astra managed to create a seemingly powered clone of the Blob despite the
        fact that the original had been de-powered.{{r|Magneto: Not a Hero Vol 1 1|4}}
        ===Reversing the Effect=== While the M-Day effect was initially thought to
        be irreversible, some methods proved more or less effective in restoring mutant
        powers. Please consult the Repowered Mutan'
