    - field: lifting_strength
      value: "In concordance with the High Evolutionary, Magneto was able to construct\
        \ a machine to restore his powers, using the Dreaming Celestial and the product\
        \ of what they called \"a Celestial lobotomy\". The machine however, was not\
        \ only nearly impossible to construct but extremely dangerous. The process\
        \ worked, and Magneto regained his mutant powers at the cost of the machine\
        \ itself.{{r|Uncanny X-Men Vol 1 500}}{{r|Uncanny X-Men Vol 1 507}} Apocalypse\
        \ managed to restore the powers of Polaris (depowered by M-Day) after turning\
        \ her into one of his Horsemen. It was believed that Apocalypse simply gave\
        \ her powers similar to her old ones through other means, but he seemingly\
        \ managed to re-activate Polaris' X-Gene.{{r|X-Men: Legacy Vol 1 259}} ====Reality\
        \ Manipulations==== After one of Legion's rogue personas, dubbing itself Moira,\
        \ altered reality to create a world of constant war and struggle where he\
        \ was a hero, some aspects of this reality bled through into the real world\
        \ after Legion restored it. One of these aspects were the powers of Chamber.\
        \ In this reality created by Legion, Chamber once again had his mutant powers\
        \ in their old state, and upon returning reality to its original form, Chamber\
        \ kept his restored powers.{{r|X-Men: Legacy Vol 1 248}} After falling into\
        \ the M'kraan Crystal and drifting into the White Hot Room, Professor Xavier\
        \ regained his telepathic powers upon emerging.{{r|Uncanny X-Men Vol 1 486}}\
        \ Wanda Maximoff was able to reverse the M-Day effect on one mutant, Rictor.\
        \ After losing the source of her enhanced powers, the Life Force, however,\
        \ Wanda was unable to reverse it for anyone else.{{r|Avengers: The Children's\
        \ Crusade Vol 1 6|7}} ===Hope Summers and Phoenix=== The return of mutant\
        \ messiah Hope Summers to the present triggered the first activated mutations\
        \ since her own and M-Day. It is believed that this, along with Hope's unique\
        \ ability to stabilize these mutants, were an extension of her relationship\
        \ with the Phoenix Force.{{r|X-Men: Second Coming Vol 1 2}} The Phoenix Force\
        \ travelled to Earth to claim Hope Summers as its host in order to reverse\
        \ the Scarlet Witch's curse. It did so successfully, after Hope used its powers\
        \ to re-ignite mutations across the world. This only caused new mutant births\
        \ however, and did not restore the powers of previously depowered mutants.{{r|Avengers\
        \ vs. X-Men Vol 1 1|12}} ===The Five=== After the founding of the mutant nation\
        \ of Krakoa, a group of mutants known as the Five were created, composed of\
        \ Hope Summers, Proteus,Tempus, Egg, and Elixir. The Five were tasked with\
        \ resurrecting mutants who had died prematurely. The Five able to revive depowered\
        \ mutants with their powers intact, presumably in part due to Proteus' reality\
        \ warping powers. {{r|X-Men Vol 5 7}} ==List of confirmed powered or depowered\
        \ mutants post-M-Day== ===Known Powered Mutants=== Known as the 198 (which\
        \ also was the name of a group of mutants gathered into the Xavier Institute).\
        \ Among the unnamed powered mutants to be counted are Gargouille's boyfriend{{r|Uncanny\
        \ X-Men Vol 1 519}} and a fire-breather,{{r|New X-Men Vol 2 44}} both killed\
        \ by Predator X. Utopia{{r|X-Men: Legacy Annual Vol 1 1}} and Ravencroft Asylum\
        \ for the Criminally Insane{{r|Generation M Vol 1 3}} also appeared to had\
        \ various unidentified mutants. ===Known Pre-M-Day Deceased Powered Mutants===\
        \ The Decimation extended even to mutants who were already dead on M-Day.\
        \ When Selene reawakened the dead of Genosha and elsewhere, she discovered\
        \ that many of her undead subjects no longer possessed their mutant abilities\
        \ as a result of M-Day.{{r|X-Force Vol 3 22}} Please consult the Known Pre-M-Day\
        \ Deceased Powered Mutants. ===Known Depowered Mutants=== Please consult the\
        \ M-Day Depowered mutants. | Part1 = Decimation: House of M - The Day After\
