      due to training from Iron Fist) | Below Average (Not very bright but capable
      of pulling off surprisingly clever battle tactics) | Average (He was a capable
      mob enforcer) | At least Average (He learned how to control his rage with the
      help of Hiroim, and had some experience as a leader) | At least Above Average
      (He holds the ability to analyze situations and reach conclusions and solutions
      successfully using "unreason and magical thinking") Standard Tactics: Despite
      his primal exterior, Dr. Banner is still able to control Hulk''s actions to
      some extent, as such Hulk will not kill his opponents or use excessive force
      if he doesn''t require it. *As stated by Iron Man, he can change his power beneath
      his punches. *As stated by Amadeus Cho, Hulk only ever attempts to grievously
      injure people under extreme circumstances **Cho later uses this theory himself
      to control Hulk''s power. **This is actually supported a few other times. *Hulk
      can easily kill his rogues'' gallery if he chooses to, but doesn''t. *Banner
      controls the Hulk to some extent, implying the morally idealistic Banner would
      actively try to hold back his attacks in order to not murder his opponents.
