    - field: standard_equipment
      value: 'Mjolnir and Jarnbjorn.jpg|Thor wielding both Mjolnir and Jarnbjorn Thor''s
        Chariot.jpg|Thor''s chariot pulled by Toothgnasher and Toothgrinder Megingjord.jpg|Thor
        equipping Megingjord Unlimited Hammer Work.png|Thor''s many hammers raining
        down on the servants of Cyttorak *Mjolnir: The magic hammer that grants him
        many of his powers and abilities. Forged from the mystical ore Uru, Mjolnir
        can only be wielded by those deemed "worthy". *Megingjord: A magical belt
        worn by the Thunder God would double his natural strength and stamina. However,
        wearing this would leave him exhausted later. *Jarnbjorn: A battle-axe forged
        by Dwarves that Thor wielded long before Mjolnir. This axe was enchanted to
        pierce the armor of Celestials or armor created using Celestial technology.
        *Uru Arm: An artificial arm forged of black Uru in the same fire where Mjolnir
        was created. It has been used as a replacement for Thor''s left arm, which
        was cut off by Malekith. Following the attack of the Mangog, this arm was
        melted by the God Tempest and later replaced by a golden Uru arm, and later
        still by an arm of The Destroyer. *Toothgnasher and Toothgrinder: Thor''s
        magical goats with incredible strength to contend with many enemies of Asgard.
        While Thor usually flies with Mjolnir, he also rides a chariot pulled by Toothgnasher
        and Toothgrinder should he need to carry many people or large objects with
        him. They served as Thor''s means of transportation before he wielded Mjolnir
        and after he became unworthy. Thor can also ride one of the 2 goats instead
        of a chariot. *Hammer Arsenal: Following the destruction of Mjolnir, Thor
        started wielding a wide arrange of hammers, also enchanted by Odin. However,
        none of them has proved to be as durable as Mjolnir, which was created from
        the purest of Uru, and therefore, often breaks after only 1 use. They also
        don''t appear to provide Thor as many abilities as Mjolnir did, besides flight,
        the powers to return to Thor''s hand and to channel Thor''s control of the
        elements. Notable Attacks/ Techniques: |-|Innate'
