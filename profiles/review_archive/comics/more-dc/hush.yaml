- id: claim-weaknesses-2586114e
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: Hush is divided between two phases,
    one being similar to ??? and his second one being the more challenging, "true"
    phase. * Phase 1 ** Hush lays on the ground. He will not start attacking until
    he takes damage. ** After he takes damage, he will shoot a basic danmaku towards
    the target. ** After he takes larger amounts of damage, he will stand up and a
    fly with invulnerability will begin circling Hush. He will occasionally spawn
    regular flies or flies that can shoot blood bullets. ** When he takes more amount
    of damage, he will start flying and shooting more tears occasionally. Sometimes,
    he will teleport towards the target. ** After he takes enough damage to trigger
    phase 2, he will transform and shift to this one. * Phase 2 ** Hush will transform
    into a more large, monstrous appearance. He now has 6666 HP ** Hush will vary
    attacks depending on how many HP left he has. Each 20% HP that is taken off Hush,
    he will sink into the ground for some seconds and become invulnerable to all forms
    of regular damage. ** (The following phases are taken from the The Binding of
    Isaac Rebirth gamepedia.) * Phase 1 (100-80% health) ** Hush fires barrages of
    bullets in certain patterns, combining 1-3 different patterns of shots. The same
    pattern can be used multiple times in each barrage. * Phase 2 (80-60% health)
    ** Hush will move to the center of the room before resuming its attacks. It also
    gains an additional'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-75535f08
  section: abilities
  axis: hax
  text: Phase 1= Superhuman Physical Characteristics, Immortality (Type 7), Danmaku
    and Water Manipulation (Can shoot dozens if not hundreds of tears in various patterns),
    Animal Manipulation and Summoning (Can summon various kinds of flies to attack),
    Invulnerability (Some of these flies are invulnerable to conventional damage and
    orbit around Hush to shield him), Flight and Body Control (Can sprout wings and
    fly), Teleportation (Hush teleports around, attempting to cut off the enemy's
    movement or even teleport on top of them to inflict damage), Damage Reduction
    and Reactive Power Level (Thanks to its Boss Armor, the damage Hush would suffer
    from stronger enemies is reduced), Small Size (Type 0, as tall as Isaac) |-|Phase
    2= Superhuman Physical Characteristics, Immortality (Type 7), enhanced Danmaku
    and Water Manipulation (Can fire many more tears at once as well as more varied
    kinds of them, and can also shoot vertical geysers of high-pressure waters that
    chase after the enemy), Avatar Creation (Before fighting the enemy directly, it
    will summon a copy of ??? (Boss), which is the first phase of his boss battle),
    Body Control and Elasticity (Can flatten itself completely against the floor of
    the Blue Womb), Large Size (Type 1. The Blue Womb seems to be part of Hush, and
    it is an entire dungeon floor, albeit a small one), Spatial Manipulation and Limited
    Intangibility (Can fire Continuum tears which re-appear on the other side of the
    room after leaving it, phasing through its walls with no issue), enhanced Summoning
    (Can summon much tougher versions of common enemies, such as dozens of Gaper zombies
    and Attack Flies), Blood Manipulation (Can summon Boils, stationary enemies that
    fire blood tears), Damage Reduction and Reactive Power Level (Thanks to its Boss
    Armor, the damage Hush would suffer from stronger enemies is reduced. Its water
    geyser attack's speed changes depending on the speed of who it's chasing), Light
    Manipulation (Hush emits a blinding flash of light when it is defeated) |-|Resistances=
    Resistance to Existence Erasure (Bosses in The Binding of Isaac are unaffected
    by the Eraser, which erases every instance of an enemy species when used on one
    of them, until they are at very low HP), Sealing (Bosses are immune to Friendly
    Ball, which seals enemies inside it), Transmutation (Bosses are immune to E. Coli,
    which turns enemies into poops), Size Manipulation (Bosses are immune to God's
    Flesh, which shrinks enemies), Limited Resistance to Status Effect Inducement,
    Fire Manipulation, Empathic Manipulation, Fear Manipulation, Petrification, Poison
    Manipulation, Disease Manipulation, Blood Manipulation (Once a boss in The Binding
    of Isaac is afflicted with a status effect, they cannot be affected by another
    status effect, including the same one, for the next 8 seconds)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
