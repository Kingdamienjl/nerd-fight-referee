    - field: intelligence
      value: At least Above Average. He was an electric engineer in a lab when the
        accident occurred. Basic understanding of how molecules, bonds, and chemicals
        work are needed for his abilities to work properly. However, his intelligence
        varies quite often depending on his mood. In addition to, in the beginning
        he could not figure out how create food as he found its molecular structure
        hard. In the same arc, he found Iron Man's tech too complicated. In terms
        of battle intelligence, he has been able to give the likes of Fantastic Four
        and Avengers a lot of trouble. He is able to use his Molecular Manipulation
        in variety of ways to save himself from the heroes. Like turning his forcefield
        to a spring, then parachute when fighting human torch. When he was fighting
        the Invisible Woman (then called Invisible Girl), he couldn't see her, so
        he covered her in newspapers to make it easier for him to attack her. The
        first time he appeared, to get rid of Reed, he created two magnets that pulled
        him away in separate direction and force him to stretch to his limits. Understood
        how the Silver Surfer utilises his powers and attacks his enemies, so he removed
        his one winning condition as soon as he could and defeated him. Was able to
        figure out how best to save people from Beyonder's death beam. At a weakened
        state, instead of covering each and everyone with a forcefield, he instead
        BFR'd everyone into sub-space to make everyone think the Beyonder had succeeded,
        likely the Beyonder himself too. To escape from Avengers and the government,
        he came up with a simple yet effective plan to escape. He instructed his girlfriend
        to use her heat based power to power up the balloon and run away. In terms
        of cosmic understanding, his intellect is almost unparalleled. He knows more
        about the cosmos than almost anyone else. He was the only one who could truly
        comprehend the plot of the Ivory Kings. A small part of it was perhaps due
        to his connection to them, but most of it seems to have come from his own
        experience and how he gathered intelligence from his other selves across the
        multiverse, and his own thinking. In addition, he was the only one who knew
        how to draw the Ivory Kings into the locations he wanted them to be in. Knew
        about the library of the Beyonders. When he instructed Doom on how to save
        the multiverse by killing him and thwarting the plans of the Beyonders, it
        took them 10 years to take notice of this, and even longer to understand what
        was going on. Thanks to his cosmic awareness, he can draw upon any knowledge
