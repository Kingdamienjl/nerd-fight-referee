      value: center|frameless|650x650px Atomized=right|frameless|600x600px ==Summary==
        Once a lowly lab technician desperate for recognition, Owen Reece miraculously
        became one of the most powerful beings in existence, the Molecule Man, while
        fixing an atomic device. His accident poked a pinhole into the universe of
        a child Beyonder and the energy from that universe empowered him. He encountered
        the child Beyonder in the latter's "Secret Wars," and they later fused into
        a Cosmic Cube, though he was ejected soon after. Unfortunately, Reece's "accident"
        was part of a grand experiment conducted by the grown-up Beyonders to end
        the Multiverse and he was their bomb. To sabotage this, the Molecule Man traveled
        back in time with Doctor Doom to kill his other selves. However, their deaths
        caused the Multiverse to contract, resulting in the incursions. Before the
        Multiverse ended, the Molecule Man confronted the Beyonders with Doom, absorbed
        the Beyonders' power, and gave it to Doom to create Battleworld. He later
        transferred that power to Reed Richards, and they brought back the Multiverse
        as the Eighth Cosmos. ==Power and Stats
