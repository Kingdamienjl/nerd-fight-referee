    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Soullessness, Cosmic Awareness,
        Transformation (Able to transform into his planet alt mode whenever he wants
        to), Flight, Large Size (Type 5 for his weakest avatars, Type 11 for his strongest
        avatars) Immortality (Types 1, 3, 5, 8 and 9; as long as evil exists in any
        corner of existence, any corner of reality, he cannot be killed or destroyed),
        Body Control, Energy Projection (In his planet form, he has a special energy
        beam used to destroy life on all planets he is about to eat), Corruption,
        BFR, Soul Manipulation, Reality Warping, Energy Manipulation, Shapeshifting,
        Size Manipulation, Regeneration (For his weakest avatars: Low-Mid; for his
        strongest avatars: High-Godly; survived being erased from history), Chaos
        Manipulation, Dimensional Travel, Dimensional Storage, Void Manipulation,
        Cosmic Awareness, Existence Erasure, Mathematics Manipulation, Physics Manipulation,
        Matter Manipulation, Mind Manipulation, Emotional Manipulation, Telepathy,
        Morality Manipulation, Reactive Evolution (Each time he gets destroyed by
        something, he comes back, immune to it), Technopathy, Power Bestowal, Beyond-Dimensional
        Physiology (His strongest avatars only), Resistance to Reality Warping, Soul
        Manipulation, Time Manipulation, Magic, Information Manipulation, Telepathy,
        Death Manipulation, Fear Manipulation, Existence Erasure All powers his avatars
        have, but on an infinitely greater level, Acausality (Type 5), Large Size
