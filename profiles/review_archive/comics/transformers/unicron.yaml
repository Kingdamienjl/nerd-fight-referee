    - field: attack_potency
      value: Varies from at least Large Planet level (His avatars can consume planets,
        stars. Unicron's existence generates shockwaves, which damage the space-time
        continuum and destroy entire galaxies.) to High Outerverse level (Barely noticed
        Vector Prime, one of the thirteen original Primes, who is beyond the concept
        of dimensions, whose true form resides in the Astral Plane, which exists within
        the Allsparkhttps://tfwiki.net/wiki/Source:Ask_Vector_Prime/Facebook#August_6.2C_2015.
        In order to access the Astral Plane, it is necessary to transcend time itself.
        Unicron's avatars surpass the True Star Saber, which is an ancient weapon
        capable of erasing the entire multiverse with 1 slash and returning all levels
        of existence to non-existence. When combined with the Terminus Blade, the
        True Star Saber rendered inter-dimensional travel impossible via strengthening
        the barriers between universes and nullified multiversal singularities, albeit
        the effect of the Shroud wasn't perfect. Unfathomably stronger than his strongest
        servants such as Ramjet. Unicron has been stated to be able to devour all
        of existence, even having done so in the past.) | High Outerverse level (Unfathomably
        superior to his strongest avatars. The Transformers cosmology has a Quantum
        Realm, alongside uncountable infinite higher dimensions, on top of the already
        existing 17-21 dimensions, which Unicron in his true form surpasses. Superior
        to the Unspace, which is a "timeless nomspace where ordered mathematics are
        nonsense". The battle between Unicron and Primus took place in Astral Plane,
        which is a realm where distance and scale become irrelevant. The Transformers
        cosmology contains the Tree of Life, which is an aspect of Primus and contains
        8 layers of spheres - Foundation, Splendor, Eternity, Beauty, the Emotional
        Plane, Understanding, Wisdom and the Crown. Unicron is comparable to, if not
        superior to his brother, being able to win a direct fight against Primus.
        The Foundation of the Tree of Life views all of reality as a metaphor for
        itself; a concept, which has to be relinquished, with the Crown transcending
        the Foundation. Megatron states that everything he experienced in the Tree
        of Life is more real than anything he experienced before within the Multiverse.)
        | High Outerverse level (Pre-Split Unicron is superior to Primus and his Post-Split
        self. Unicron originated as a single entity, before being divided into Unicron
        and his brother Primus.)
