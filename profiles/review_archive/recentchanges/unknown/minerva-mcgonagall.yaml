        is completely mangled beyond comparison. This ability is so potent that it
        can bypass the effects of the Divine Protection of the Sould Reaper, which
        can cause cellular destruction, as well as undo the damage done by Typhon's
        Authority of Pride, which breaks apart the target that she touches, effectively
        missing with their biological appearances. However, Minerva cannot undo the
        healing properties provided by her Authority, meaning that any assaulting
        actions would result in the target being healed, not even stepping on an insect
        will make any harm and instead, said tiny creature will only become rejuvenated,
        and not even holding a sword or a gun will have any different effect, as the
        result will end in the target being healed. As such, Minerva can only cause
        damage to non living beings and attack living beings indirectly, like causing
        shockwaves or causing a landslide. Furthermore, due to her Gate being connected
        to Od Laguna, Minerva draws enormous amounts of Mana from core of the world
        to use her Authority, causing calamities and disasters to spread all around
        the world each time she heals a living being
