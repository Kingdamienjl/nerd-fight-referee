        he won the inaugural wXw Shotgun Title and won it again, as well as the wXw
        World Tag Team Titles three times, the 2013 Mitteldeutschland Cup, the wXw
        Shotgun Championship Tournament, the 2017 16 Carat Gold Tournament, and the
        wXw Unified World Wrestling Championship. In WWE, he won the NXT UK Championship,
        the NXT Championship, and the WWE United States Championship. In 2023, ESPN
        ranked him #26 of the 30 best professional wrestlers under 30, he was ranked
        #30 of the top 500 singles wrestlers in the PWI 500 in 2024, and Sports Illustrated
