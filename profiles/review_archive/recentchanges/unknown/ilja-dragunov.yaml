    - field: weaknesses
      value: "Standard human weaknesses. He relinquished the NXT UK Championship after\
        \ an ankle injury in July 2022. He tore his ACL in September 2024, putting\
        \ him out of commission for over a year before he returned in October 2025.\
        \ Notable Attacks/Techniques: *Gr\xFC\xDFe aus Moskau: Dragunov uses a running\
        \ lariat. *Constantine Special: Dragunov uses a tiger feint lariat. *Torpedo\
        \ Moscow: Dragunov's signature and former finisher is a running, jumping headbutt.\
        \ *H-Bomb: thumb|250px|H-Bomb (NXT Stand & Deliver 2024) Dragunov's finisher\
        \ is a falling forearm drop. At NXT Battleground 2023, he jumped from steel\
        \ steps to hit Dijak while his face was against a steel chair. At NXT No Mercy\
        \ 2023, he used a Super H-Bomb to defeat Carmelo Hayes for the NXT Championship.\
        \ At NXT Halloween Havoc 2023, he jumped from the barricade to send Carmelo\
        \ Hayes through the announcement table, and did the same to Tony D'Angelo\
        \ at NXT Stand & Deliver 2024. He used the H-Bomb to defeat Sami Zayn for\
        \ the WWE United States Championship. *German Suplex: thumb|250px|German Suplex\
        \ (NXT TakeOver 36) *Death Valley Driver: *Backdrop Suplex: *Sleeper Hold:\
