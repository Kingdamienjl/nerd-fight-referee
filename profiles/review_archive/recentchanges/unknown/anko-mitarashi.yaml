- id: claim-weaknesses-90eff6f3
  section: weaknesses
  axis: weakness
  text: "Her greatest attack is a suicide technique and refuses to utilize her curse\
    \ seal's power. Notable Attacks/Techniques Kuchiyose no Jutsu (Summoning Technique):\
    \ The Summoning Technique is a space\u2013time ninjutsu that allows the summoner\
    \ to summon familiars, people, or objects across vast distances instantly. It\
    \ is usually activated by drawing from the user's blood, in which the user will\
    \ often bite their finger to break their skin to perform the technique. Some clans\
    \ of animal familiars require a contract to be formed with them before they can\
    \ be summoned. *Sen'eijashu (Shadow Snake Hands): The user can summon multiple\
    \ snakes out of their arms that extend several meters for an attack. Can be used\
    \ to latch on to or grab an enemy. *Sen'ei Tajashu (Many Shadow Snake Hands):\
    \ The technique uses the same principle as the standard Shadow Snake Hands Jutsu,\
    \ just on a larger scale with more snakes and a greater range. Sojasosai no Jutsu:\
    \ This forbidden technique is a murder-suicide attack, killing both the user and\
    \ the target. The user makes a one-handed seal with both their hand and the intended\
    \ victim. Ten no Juin (Curse Seal of Heaven): In the past, Anko was given the\
    \ Curse Seal of Heaven by Orochimaru. However, she chooses to suppress it rather\
    \ than using its augmentation powers to potentially increase her stats and ninjutsu\
    \ capabilities. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==\
    \ ==Notes/Explanations== Category:Characters Category:Naruto Category:Anime Characters\
    \ Category:Female Characters Category:Humans Category:Teachers Category:Summoners\
    \ Category:Manga Characters Category:Poison Users Category:Tragic Characters Category:Antiheroes\
    \ Category:Ninjas Category:Martial Artists Category:Good Characters Category:Weapon\
    \ Masters Category:Energy Users Category:Adults Category:Animal Users Category:Duplication\
    \ Users Category:Shapeshifters Category:Acrobats Category:Surface Scalers Category:Death\
    \ Users Category:Free Movement Users Category:Afterimage Users Category:Stealth\
    \ Masters Category:Statistics Amplification Users Category:Illusionists Category:Paralysis\
    \ Users Category:Chi UsersCategory:Extrasensory Perception UsersCategory:Knife\
    \ Users Category:Weapon Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-dd0aee13
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, Chakra Manipulation, Summoning,
    Snake Manipulation, Statistics Amplification (Shinobi are capable of enhancing
    their physical capabilities with the use of chakra. The Shunshin no Jutsu allows
    Shinobi to greatly enhance their speed by focusing chakra in their feetRin no
    Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and Water Walking
    (By focusing chakra at the soles of their feet, Shinobi can scale and cling to
    vertical surfaces, and even walk on waterNaruto Chapter 18Naruto Chapter 90),
    Afterimage Creation, Stealth Mastery, and Speed Enhancement (The Substitution
    Jutsu allows its user to instantly replace themselves with a nearby object such
    as a tree log, plant, person, or clone at the exact moment they are attacked.
    The Jutsu works even if the user is physically restrained or observed by characters
    as observant as Sharingan or Sage Mode users. This creates the optical illusion
    of the user being hit, which confuses the opponent and gives them an opening to
    flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter 374Naruto
    Chapter 580Naruto Chapter 674), Minor Illusion Creation and Duplication (With
    the Clone TechniqueRin no Sho, Page 220, Shinobi can create illusionary duplicates
    of themselves that have no physical substance), Shapeshifting (With the Transformation
    Technique, Shinobi can transform themselves into other people, animals, plants,
    and even inanimate objects, such as weapons), Paralysis Inducement (With the Temporary
    Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely paralyze their
    targets from close to mid range), Limited Death Manipulation (by linking up fingers
    can cause mutual death of her and the target)
  source_ids: *id003
  decisive: true
  status: unverified
