- id: claim-powers-and-abilities-7ed2a99b
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Enhanced Senses (Has the ability to
    track humans by scent and can smell fear) *Flight (The Creeper has wings, allowing
    him to fly) *Surface Scaling (Able to climb up walls and crawl around ceilings)
    *Acrobatics (Can perform backflips. Ran along the top of a car to avoid being
    hit by it) *Weapon Mastery (The Creeper is extremely proficient with weapons such
    as shurikens and a battleaxe) *Vehicular Mastery *Absorption (Whatever the Creeper
    eats becomes part of his own body, and he can eat the organs of others to replace
    his own) *Telekinesis (Telekinetically pulled his axe from a victim''s skull back
    into his hand) *Animal Manipulation (Wherever The Creeper travels, ravens and
    crows follow) *Immortality (Type 1 - Has been alive for centuries without end.
    Type 2 - Survived losing half of his own head without needing to regenerate. Type
    3 - See Regeneration) *Regeneration (Mid - Regenerated his own head after ripping
    it off, though he needs the organs and body parts of others to replace his own)
    *Extrasensory Perception (Able to communicate with spirits and ghosts. Sensed
    when someone got cut with his weapons) *Homing Attack (Via Shurikens and Knives)
    *Sound Manipulation (Can screech loud enough to crack windows and kill birds)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
