    and BFR (Guinness can produce wide-scale shockwaves from his strikes. They''re
    large enough to cause entire continents to be reduced to water-like ripples of
    earth, and send people flying tens of thousands of kilometers awayToriko: Chapter
    354: Pages 11-14Toriko: Chapter 376: Pages 6-7)'
