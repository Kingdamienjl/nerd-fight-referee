    - field: weaknesses
      value: "Possibly has the same weaknesses as Daemon and Ada but its still unknown.\
        \ Notable Attacks/Techniques: *Byakugan (White Eye): This eye technique is\
        \ the Kekkei Genkai of the Hy\u016Bga clan and one of the Three Great D\u014D\
        jutsu. This eye's wielders can see objects too tiny for the ordinary eye to\
        \ perceive (such as the tenketsu points on a human's body) and can see vast\
        \ distances (at least up to 10 kilometers). The Byakugan has a nearly perfect\
        \ 360-degree field of vision, except for a small blind spot near the user's\
        \ neck. The eye can see clearly through objects and many barriers, as well\
        \ as chakra. *Sensing Technique: The Sensing Technique allows the user to\
        \ mould chakra and change it to the sensor type. This enables them to detect\
        \ and track down targets through their chakra signatures. The range of this\
        \ technique varies between sensors. *Space\u2013Time Ninjutsu: By manipulating\
        \ a specific point of space, the user can warp anything targeted into a dimensional\
        \ void and teleport it to another location instantaneously. *Senrigan (Clairvoyance):\
        \ The Senrigan (\u5343\u91CC\u773C, literally meaning: Clairvoyance) is a\
        \ D\u014Djutsu possessed by Shibai. Using this ability, Shibai can project\
        \ his consciousness to any location to see and hear any present event, as\
        \ well as any past event up to the moment of his birth. *Intention Reflection\
        \ - Shibai originally possessed Daemon's ability, which is the effect of reflecting\
        \ \"killing intent\" of an opponent's attack back onto them, this causes the\
        \ opponent to be dealt the aftermath of the attack which they thought about\
        \ doing against Daemon, usually killing them in the process, this has shown\
        \ itself in different ways like someone who had the \"killing intent\" of\
        \ cutting Shibai's head off having their head cleanly removed from their body\
        \ or those who had the \"killing intent\" of burning Shibai alive being set\
        \ aflame unexpectedly. Category:HGenThree Category:Tier 2 Category:Tier 4"
