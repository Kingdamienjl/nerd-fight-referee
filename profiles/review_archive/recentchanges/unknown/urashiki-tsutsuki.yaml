- id: claim-powers-and-abilities-176f8341
  section: abilities
  axis: hax
  text: "\u014Ctsutsuki Physiology (\u014Ctsutsuki), Superhuman Physical Characteristics,\
    \ Social Influencing (Social position and Reputation - is a members of the Otsutsuki\
    \ clan. Instigated fear Kaguya feared their return and the possibility of revenge,\
    \ so she created an army of Zetsu and amassed chakra in preparation to fight them),\
    \ Chakra Manipulation, Energy Manipulation (Urashiki's able to transfer his chakra\
    \ to othersBoruto: Episode 128), Weapon Mastery (Urashiki can create a red fishing\
    \ rod and pouch out of chakraBoruto: Episode 53), Energy Absorption and Paralysis\
    \ Inducement (After piercing the target with his fishing pole, Urashiki paralyzes\
    \ the opponent, allowing him to drain the chakra of his target completely and\
    \ store it in his chakra pouchBoruto: Episode 62), Durability Negation, Intangibility,\
    \ and Non-Physical Interaction (Urashiki can use his fishing rod to phase through\
    \ the target and latch onto their chakraBoruto: Episode 123), Barrier Creation\
    \ (Urashiki can form barriers in the form of an orb to protect himselfBoruto:\
    \ Episode 122), Power Mimicry (Urashiki can steal the techniques of his targets\
    \ after draining their chakra and utilize them for himselfBoruto: Episode 62),\
    \ Limited Time Stop and Petrification (Using the Palace of the Dragon King, Urashiki\
    \ can freeze the target with a gaseous substance that, when touched, petrifies\
    \ their entire body, preserving them alive for ten thousand yearsBoruto: Episode\
    \ 53), Body Puppetry and Clairvoyance (Urashiki can utilize the Puppet Technique\
    \ on multiple puppets to manipulate them without chakra threads from vast distancesBoruto:\
    \ Episode 122, and he can link his vision with them, even while sealedBoruto:\
    \ Episode 123), Limited/Selective Intangibility & Mind Manipulation (Urashiki\
    \ can phase his hand through people to enter their subconsciousBoruto: Episode\
    \ 131), Time Travel (With Karasuki, Urashiki is able to travel to the pastBoruto:\
    \ Episode 128), Transformation (Upon consuming his accumulated chakra and d\u014D\
    jutsu, Urashiki is capable of undergoing a transformation similar to Momoshiki's;\
    \ causing his massive power to skyrocketBoruto: Episode 135), Paralysis Inducement\
    \ and Body Puppetry (The Black Receivers can paralyzeNaruto Chapter 420Naruto\
    \ Chapter 381Naruto Chapter 435Naruto Chapter 661 and hinder the movements of\
    \ whoever they pierce, and they can also control their movementsNaruto Chapter\
    \ 444), Extrasensory Perception (\u014Ctsutsuki can erase/nullify their chakra\
    \ signature, making them undetectable even to Sensor Type ninjasBoruto: Chapter\
    \ 61), Sealing (Although he's capable of being sealed, timeBoruto: Episode 122\
    \ and timeBoruto: Episode 123 again, he's been able to break out of these seals\
    \ with minimal effort) D\u014Djutsu= Sand Manipulation and Earth Manipulation\
    \ (With Gaara's chakra, he can manipulate sandBoruto: Episode 62), Electricity\
    \ Manipulation and Paralysis Inducement (With Mitsuki and Sasuke's chakra, he\
    \ can manipulateBoruto: Episode 62 lightningBoruto: Episode 133), Air Manipulation\
    \ (With Temari's chakra, he can manipulate windBoruto: Episode 123), Shadow Manipulation\
    \ (With Shikadai's chakra, he can use Shikadai's Shadow JutsusBoruto: Episode\
    \ 123), Illusion Creation and Mind Manipulation (With Mirai's chakra, he can create\
    \ illusionsBoruto: Episode 128), Healing (With a very small amount of Kurama's\
    \ chakra, he is able to heal minor wounds), Fire Manipulation (With Sasuke's chakra,\
    \ he can also manipulate fireBoruto: Episode 133) K\u0101ma= \u014Ctsutsuki Physiology\
    \ (\u014Ctsutsuki Vessel) All previous abilities aside from his red tomoe and\
    \ blue Rinnegan abilities and his Stolen Chakra; Energy Projection (Urashiki can\
    \ unleashBoruto: Episode 135 powerful blasts), Shockwave Generation (Urashiki\
    \ can generate omnidirectional shockwavesBoruto: Episode 135)"
  source_ids: *id003
  decisive: true
  status: unverified
