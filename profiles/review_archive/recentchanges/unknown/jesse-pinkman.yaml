    - field: intelligence
      value: 'Gifted in terms of learning. Average in terms of common sense (Although
        he was a bad student and made boneheaded decisions early into the series,
        he is incredibly street smart. After learning from Walter for less than an
        year he was able to cook meth that was 96% pureBreaking Bad S4E10: Salud,
        which was superior to that of Gale''s, who had an advanced degree in chemistry.
        He helped run the largest methamphetamine trafficking ring in American history,
        and talked his way out of being held at gunpoint. Was considered by Walt to
        be one of the greatest meth cooks in America and the only one worthy of being
        his partner. He was able to evade the police successfully, despite having
        a country-wide manhunt for him and managed to talk 2 assailants into splitting
        Todd''s stash. Could easily kill one of the 2 said assailants in a seemingly
        fair gun fight, by hiding one gun in his jacket''s pocket - thus outpacing
        him trying to pull out his own)'
      source_id: vsbattles-jesse-pinkman-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Human limitations. Impulsive. Very hesitant to kill innocent people,
        and will suffer major emotional trauma in doing so (as seen when he killed
        Gale). Has a soft spot for children. Suffers from PTSD after being enslaved
        by neo-nazis and possibly major depressive disorder after Combo''s and Jane''s
        deaths. Allergic to erythromycin. ==Notable Matchups== Victories: * Charlie
