- id: claim-weaknesses-5f786d56
  section: weaknesses
  axis: weakness
  text: 'Human limitations. Impulsive. Very hesitant to kill innocent people, and
    will suffer major emotional trauma in doing so (as seen when he killed Gale).
    Has a soft spot for children. Suffers from PTSD after being enslaved by neo-nazis
    and possibly major depressive disorder after Combo''s and Jane''s deaths. Allergic
    to erythromycin. ==Notable Matchups== Victories: * Charlie Matheson Jr (Slender:
    The Arrival) Charlie''s profile (Jesse has prior knowledge on Charlie and has
    5 minutes of preparation for a plan with a Baseball Bat. Speed is equal. Charlie
    is in his proxy form and is bloodlusted) * The Rake (The Rake) The Rake''s Profile
    (Jesse had prior knowledge on The Rake and was armed with a rock. Fight took place
    in Jesse''s backyard) * The Boys (Team) (TV Series) The Boys'' Profile (Jesse
    was teamed up with Walter. Both sides had 1 month of preparation time. Temp-V
    was restricted and The Boys only consisted of their human members. Walter & Jesse
    started on the top floor of Vought Tower and The Boys started outside of the tower)
