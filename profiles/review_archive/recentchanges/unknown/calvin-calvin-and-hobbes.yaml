  intelligence:
    text: 'Gifted (Although Calvin is Below Average academically he is shown to have
      a very large vocabulary as well as being a skilled manipulator, liar and displays
      a great amount of knowledge and understanding for topics he''s interested in.
      These topics include: Philosophy, History, Dinosaurs, Evolution, Economics,
      Politics, Space, and he even reads and seemingly understands the wall street
      journal. He also understands statistics, graphs, and probability shown when
      he makes his father "polls" to show how well he''s doing as his dad, not to
      mention his extremely impressive ability to create intricate and elaborate traps,
      as well as create a functional pulley system which all display his seeming aptitude
      and understanding of physics and creativity which is displayed in that most
      of his mechanisms are made with household items. Ran backwards as a way to trick
      his parents. Can create extremely impressive snow sculptures. Could also figure
      out how to correctly take a tire off his dads car and quickly created a decoy
      of himself to trick Hobbes. Used a tape recorder to trick Susie into a closet)'
    source_ids:
    - mediawiki-4806773
    confidence: 0.6
    notes: auto_repair source extraction
