    \ sneak up on Hobbes, was also able to hide from Hobbes via squeezing himself\
    \ in a mailbox) * Toon Force (Pulled himself into a lake with a fishing rod and\
    \ jumped several meters into the air even over the panel) * Afterimage Creation\
    \ * Social Influencing (Charisma, Instigating Fear and Deception; Calvin is shown\
    \ to be a skilled manipulator and liar. Can confuse his bully to the point that\
    \ he loses interest in bullying him and tricked his babysitter so that he could\
    \ lock her outside) * Small Size (Type 0) * Surface Scaling * Preparation (Given\
