    \ Fourth Wall Awareness (Directly addresses the readers at multiple points in\
    \ the books) * Acrobatics (Can jump extremely high) *Possibly limited Subjective\
    \ Reality (His Subjective reality is seemingly the thing keeping Hobbes alive.\
    \ He also has events where things completely irrational will happen generally\
    \ out of fear, boredom, etc) Resistance to: * Gas Manipulation/Poison Manipulation\
    \ (Didn\u2019t seem to care when he gassed his room with bug spray) * Perception\
    \ Manipulation/Madness Manipulation (Able to see Hobbes as a living creature despite\
    \ his perception manipulation)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
