    - field: weaknesses
      value: 'Astral projection (referred to as "Magic Viewing" or "Magical Sight,"
        in the novel and manga respectively): By closing her eyes, Ellen is able to
        mentally project herself in any area that rests within the entire forest''s
        range. As Ellen is forbidden to leave the Witch''s House in her original body,
        she uses this ability to view the forest in her mind, at any possible angle,
        as if she were truly present. This ability allowed her to watch over the forest
        for wandering children and adults., Control over the Witch''s House: The form
        of the Witch''s House changes upon Ellen''s command., Control over the forest:
        As a Witch, Ellen had complete control over the forest. She can use the forest''s
        wildlife (both fauna and flora alike) against others. She is also able to
        clear and block certain paths in order to lure humans to her home or prevent
        them from reaching her domain., Illusions: Having made a pact with a demon
        who specializes in illusions, Ellen herself is also able to use illusion magic
        to a certain extent in order to bring fear to her victims and please the Demon
        with more savory souls., Immortality: Upon becoming a Witch, Ellen was granted
        immortality. As a result, she did not age, which allowed her to live for centuries
        while maintaining her 7-year-old body. As noted by the Black Cat, because
        she''s a Witch, even the effects of her illness (albeit still progressing
        to a gruesome level) wouldn''t kill her. She also seemed to survive fatal
        wounds such as having her head cleaved off her body because the Demon would
        bring her back to her original state. However, Ellen eventually learns that
        a Witch can indeed die once she feels despair., Spiritual awareness: As a
        Witch, Ellen is able to see the spirits of her deceased victims residing in
        the Witch''s House.'
      source_id: character-stats-profiles-horned-witch-hansel-gretel-witch-hunters
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
