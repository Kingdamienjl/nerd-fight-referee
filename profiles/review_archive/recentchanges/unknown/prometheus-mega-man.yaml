    - field: weaknesses
      value: 'He is extremely confident in his abilities and is a complete sadist.
        Several of his attacks can be deflected with repeated energy attacks. He must
        be solid while attacking. Notable Attacks and Techniques:, Scythe Sweep: Teleports
        into his opponent''s blind spot before lunging at them with his scythe, firing
        a wide shockwave if they dodge before flying out of range with his scythe
        spinning all around him., creating blind spots in the attack., Overhead Guillotine:
        Descends at high speed while yelling "I''ve got you!" and making a sweeping
        slice at his opponent''s neck. If they dodge he phases into the ground, scattering
        four large fireballs in his wake to trap his opponent., Lava Plume: Summons
        two pillars of lava on either side of him that ascend towards the ceiling,
        spinning around him in a counterclockwise motion. There is a small gap between
        the pillars that allows the attack to be dodged, but it can also be repelled
        through repeated energy attacks., Flame Swords: Impales the ground with his
        "hair", causing flaming sword-shaped structures to erupt along the walls and
        floor of the room he fights in., Witch and Reaper: A combination attack with
        Pandora in which he conducts his Scythe Sweep while she attempts to ram the
        opponent while riding on her electrified staff. Prometheus can be stopped
        in his tracks if he is struck enough times though.'
