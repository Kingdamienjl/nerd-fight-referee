    - field: standard_equipment
      value: 'As Conan, he carries the following items: * Voice Changing Bowtie: A
        bowtie that Conan can frequently be seen wearing and keeps on his person even
        when he isn''t wearing it. It allows him to flawlessly change his voice to
        match another person whose voice is recorded on the dial. * Stun Gun Wristwatch:
        A working wristwatch doubles as a portable tranquilizer. It has a single dart
        that instantly puts the target to sleep upon injection. It is also fitted
        with a flashlight as well as a satellite phone and flash drive functions.
        * Power-Enhancing Kick Shoes: Conan''s sneakers are equipped with a unique
        mechanism. A button may activate it to stimulate muscles in his feet, enabling
        him to knock grown people down by kicking small items like a tin can or a
        rock at their heads. He frequently uses this in conjunction with the Anywhere
        Ball Dispensing Belt to quickly give himself a projectile to use. * Anywhere
        Ball Dispensing Belt: Conan''s belt can produce an inflatable soccer ball
        that lasts for ten seconds, giving him ample time to aim and kick it as a
        projectile when used in conjunction with the Power-Enhancing Kick Shoes. It
        can be used twice before needing to be refilled. * Turbo Engine Skateboard:
        An electric skateboard that runs on solar power, it is powerful enough to
        catch up to a speeding car and maneuverable enough to easily cut through crowded
        streets and highways. It was later upgraded to include a battery to operate
        in dimly lit areas and at night and can also convert itself into a snowboard
        if necessary. In addition, Conan possessed a red version of the skateboard
        with retractable wheels and could glide on the water, but this was destroyed
        after an encounter with Goemon Ishikawa XIII. * Button Speaker: Conan possesses
        miniature speakers that he can stick virtually anywhere to project his voice
        through with his Voice-Changing Bowtie. * Modified Glasses: Conan possesses
        several glasses that have been modified by Agasa to process a variety of functions.
        The lenses are bulletproof. They are equipped with a radar that keeps track
        of the positions of people within 20 meters as well as any transmitters he''s
        placed beforehand, telescopic functions, night-vision, and a microphone that
        can be placed anywhere to listen in on conversations by matching the frequency
        emitted by the microphone.'
      source_id: mediawiki-1486076
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Genius (Shinichi is a well-known amateur sleuth who solves difficult
        and unthinkable cases that often involve serious injury or murder. He is a
        recognized genius with an eidetic memory. He is very good at forensic science,
        has perfect pitch, and knows a lot of random facts, dates, and other things
        because he reads a lot. This allows him to easily disarm any explosives in
        the series, read inconsistencies in criminal testimony, and figure out motives
        based on the music played during the murders. He is also known to "bluff"
        by giving suspects false information to get more information, which shows
        that he knows a lot about criminal psychology. He is also very good at English,
        translating for an American diplomat with no apparent problems. He has matched
        wits with Kaitou Kid, who has an IQ of 400 and has evaded police custody by
        using a variety of visual and auditory illusions. Shinichi isn't just brilliant;
        he also knows how to use guns and has an excellent spatial awareness with
        a soccer ball because he loves the sport. This allows him to hit moving targets
        with small objects by bouncing them off walls and other objects. He is also
        a skilled acrobat, being able to swing from tree to tree and jumps considerable
        distances to escape onlookers)
