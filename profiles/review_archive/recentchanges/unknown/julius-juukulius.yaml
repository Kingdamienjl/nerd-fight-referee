- id: claim-weaknesses-b3b75d72
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Divine Protection of Gathering
    Spirits: A Divine Protection which allows him to see, talk, and be liked by Spirits,
    though he has to work hard to actually get liked by Spirits. *Spirit User: Julius
    was contracted with six Quasi Spirits. They were known as Ia, Kua, Aro, Ik, In,
    and Nes. *Nect: A high-level magic that enables people to share senses within
    the affected area by connecting their gates. *Clarista: An ability in which Julius
    imbues his sword with the power of his six Quasi Spirits. **Al Clarista: Julius
    imbues his sword with the power of his six Quasi Spirits, he then stabs his opponent
    with his sword and attacks their very souls. It is a certain death blade. **Al
    Clauzeria: Julius imbues his sword with the power of his six Quasi Spirits, and
    the fires it out in a ray of light, that will pierce through any defenses. *Fell
    Goa: Julius produces a sort of heat which creates a magical firestorm. *Phla Ilium:
    Julius shoots a magical beam of light that explodes and shoots in a direction
    after a couple of seconds. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== ==Notes and Explanations== Category:Characters Category:Re:Zero
    kara Hajimeru Isekai Seikatsu Category:Male Characters Category:Knights Category:Soul
    Users Category:Light Novel Characters Category:Anime Characters Category:Manga
    Characters Category:Spirit Contract Users Category:Sword Users Category:Fire Users
    Category:Earth Users Category:Water Users Category:Air Users Category:Light Users
    Category:Internet Characters Category:Blessing Users Category:Forcefield Users
    Category:Summoners Category:Weapon Masters Category:Magic Users Category:Temperature
    Users Category:Life Users Category:Healers Category:Regeneration Users Category:Ice
    Users Category:Status Effect Users Category:Visual Novel Characters Category:Statistics
    Amplification Users Category:Vibration Users Category:Non-Physical Interaction
    Users Category:Statistics Reduction Users Category:Aura Users Category:Enhanced
    Senses Users Category:Death Users Category:Mind Users Category:Accelerated Development
    Users Category:Extrasensory Perception Users Category:Durability Negation Users
    Category:Instinctive Action Users Category:Precognition Users Category:Platform
    Creation Users Category:Acrobats Category:Body Control Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-e925db97
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Body Control (The basics of flow method\
    \ is for the user to have have complete control over their body.Tanpenshuu 10,\
    \ \"The Golden Lion and the Sword Saint: Riot in Flanders\" Users of the Flow\
    \ Method can release heatVolume 12, Chapter 4 from their body,Arc 7 Chapter 100:\
    \ \"A Myriad of Changes at the Bastions\" which can vaporize snow around them)\
    \ *Master Swordsman (In skill with a sword, employment of mana, pedigree, and\
    \ exploits, Julius fulfills all the qualifications of a knight and is second to\
    \ noneVolume 4, Chapter 4) *Soul Manipulation, and Mind Manipulation (Can attack\
    \ the soul itself.Volume 9, Chapter 4 Damage to the soul, also damages the mind,Volume\
    \ 11, Chapter 5 as the mental has been equated to the spiritualVolume 10, Chapter\
    \ 2) *Conceptual Manipulation (Type 3; the Od is the \u201Cpure property itself\
    \ that made a human, human\u201D, being synonymous with the individual's soul\
    \ and defining their existence.Volume 25, Chapter 7Volume 25, Chapter 3 It encompasses\
    \ the individual's Memories, elemental character, destiny, and life force,Volume\
    \ 9, Chapter 1 with the body's form itself conforming to the Od, such that altering\
    \ the Od alters both the body and mind.Volume 31, Chapter 2 Od contains the Name\
    \ and Memories. When the name is vanquished, the person is erased across all of\
    \ history with the world being rewritten as though they were never there and wiped\
    \ from everyone's minds.Volume 6, Chapter 4 Eating the Name of his victim will\
    \ erase the Memories of them from the world itself,Volume 9, Chapter 6, \"To Each\
    \ Their Oaths\" even erasing evidence of their existence such as anything they\
    \ wrote.Volume 10, Chapter 1, \"At the Place They Returned To\" Those with their\
    \ Memories eaten forget everything about themselves and others, while those with\
    \ their Name eaten are completely forgotten by everyone in the world.) *Life Manipulation,\
    \ Healing, Heat Manipulation, Fire Manipulation, Water Manipulation, Ice Manipulation,\
    \ Earth Manipulation, Air Manipulation, Light Manipulation, and Status Effect\
    \ Inducement (Capable of using all 6 magic elements, which consists of fire, wind,\
    \ water, earth, dark and light. Fire element relates to temperature. Water element\
    \ regulates life and healing. Wind element functions outside the bodies of living\
    \ things. Earth element functions inside the body. Dark element magic is magic\
    \ that does things such as obstructing an opponent\u2019s vision, severing them\
    \ from sound, slowing their movements etc) *Sense Manipulation (Can share his\
    \ senses with othersVolume 8, Chapter 3) *Blessed, Limited Soul Manipulation &\
    \ Law Manipulation (Divine Protections affect the soul of those to whom they are\
    \ granted,Arc 8, Chapter 28 and the soul of those that they target. Divine Protections\
    \ are considered a constraint of the world,Sword Demon Battle Ballad a set rule\
    \ by which the world operates) *Forcefield Creation (Can create barriersVolume\
    \ 8, Chapter 4) *Magic, Law Manipulation & Conceptual Manipulation (Type 2; Magic\
    \ is the process of imposing one\u2019s will on reality by manipulating mana to\
    \ override natural laws,Arc 9, Chapter 12 it is reality and meddling with logic\
    \ to reshape the natural order of the world, where the caster\u2019s will clashes\
    \ with the world\u2019s resistanceOne Wild Night and can bend the world's natural\
    \ orderRiot in Flanders. The laws of the world being concepts themselvesArc 9,\
    \ Chapter 36 \u2013 \u201CProblem\u201D) *Summoning (Spirits User) *Statistics\
    \ Amplification, and Statistics Reduction (Warriors use mana via the Flow Method\
    \ to strengthen themselves.Arc 7, Chapter 98 Can buff himself with Yang magicEx\
    \ Novel 4, Diplomacy By Bloodshed and debuff his enemies with Yin magic) *Regeneration\
    \ (Low; Having excellent control over the Flow Method greatly contributes to the\
    \ recovery of wounds and physical strengthArc 9, Chapter 23, \"The Gang's All\
    \ Here\") *Enhanced Senses (People of the other world have incredible eyesight.\
    \ Can enhance his sense with Yang magic, can sense heat sources and changes in\
    \ the atmosphere via his Spirits) *Extrasensory Perception (Could sense the presence\
    \ of the guards outside his room and that of Cecilus. Even untrained civilians\
    \ such as Subaru can detect the mana in the atmosphere and spikes of magical energy\
    \ Volume 3 Chapter 3: \"The Meaning of Courage\") *Instinctive Action (Reacted\
    \ to Balleroy's invisible missiles at the speed of thought) *Paralysis Inducement\
    \ (Can seal his target's movementVolume 17, Chapter 5) *Vibration Manipulation\
    \ (Can create shock-wavesVolume 8, Chapter 4) *Non-Physical Interaction (Can interact\
    \ with the Unseen Hands,Volume 9, Chapter 3 which are intangible) *Possibly Death\
    \ Manipulation (Al Clarista is a certain-death blade, when hit by it Petelguese's\
    \ Unseen Hands were difficult to reconstitute, growing thinner) *Accelerated Development\
    \ (Battle; Other, Midbattle, Julius grew acclimated to the unnatural physical\
    \ sensation of looking through Subaru's vision, with frightening speed, raising\
    \ the accuracy and sureness of his sword to new heights) *Dura"
  source_ids: *id003
