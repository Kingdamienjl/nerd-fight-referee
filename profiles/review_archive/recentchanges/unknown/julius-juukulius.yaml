        Spirits, though he has to work hard to actually get liked by Spirits. *Spirit
        User: Julius was contracted with six Quasi Spirits. They were known as Ia,
        Kua, Aro, Ik, In, and Nes. *Nect: A high-level magic that enables people to
        share senses within the affected area by connecting their gates. *Clarista:
        An ability in which Julius imbues his sword with the power of his six Quasi
        Spirits. **Al Clarista: Julius imbues his sword with the power of his six
        Quasi Spirits, he then stabs his opponent with his sword and attacks their
        very souls. It is a certain death blade. **Al Clauzeria: Julius imbues his
        sword with the power of his six Quasi Spirits, and the fires it out in a ray
        of light, that will pierce through any defenses. *Fell Goa: Julius produces
        a sort of heat which creates a magical firestorm. *Phla Ilium: Julius shoots
        a magical beam of light that explodes and shoots in a direction after a couple
