    source_ids:
    - vsbattles-the-prototype-poppy-playtime-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Several Meters (Due to sheer size and the smoke eminating off of him)
    source_ids:
    - vsbattles-the-prototype-poppy-playtime-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'At least Gifted (A master manipulator who tricked the Player, Poppy, and
      numerous others acting as Ollie. While he was in captivity, he escaped fairly
      often, and could lead the others via knowing what they wanted and what to promiseSleep
      Well | "We want freedom...") Standard Tactics: The Prototype tends to start
      head-on engagements casually, messing around and giving half-hearted attacks
      while talking, but starting from Stealth causes The Prototype to sneak up on
      his victim, which results in a quick impalement of them and the brutal takedown
      of anyone else moving. When damaged or in any way bothered, he rushes the opponent
      down, attempting to kill them swiftly there after.'
    source_ids:
    - vsbattles-the-prototype-poppy-playtime-unknown
    confidence: 0.6
    notes: auto_repair source extraction
