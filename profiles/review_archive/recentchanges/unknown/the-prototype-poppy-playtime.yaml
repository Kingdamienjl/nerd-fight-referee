    confidence: 0.95
  striking_strength:
    text: At least Wall level+
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Wall level+, possibly lower (Virtually unharmed by a bloodlusted Kissy Missy
      attacking him, though she was able to pull off the light above the ribcage.
      Despite being engulfed in flame, the only damage The Prototype took from a large
      train crash was slightly scorched cloth. However, he can withstand his own attacks
      and more than likely being attacked by Doey the Doughman, who chose to run from
      him instead of fighting)
    source_ids:
