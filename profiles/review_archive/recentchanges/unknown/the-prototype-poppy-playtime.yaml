- id: claim-powers-and-abilities-0bdb651f
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics (The Prototype is repeatedly and without
    fail feared or worshipped by those under him, such as Mommy Long LegsPoppy Playtime
    Chapter 2: Fly in a Web) **Large Size (Type 0: Even from a distance, normal humans
    have to look up at The Prototype. Much taller than Kissy Missy and Huggy Wuggy,
    who are each 18 feet tall) **Immortality/Regeneration (Type 2/Low-Mid: Even if
    The Prototype was cut in half he could simply put himself back together, however,
    this has an unknown timeframe) **Self-Sustenance (Type 2: The Prototype lacks
    the need for Sustenance such as food or waterChapter 1 Official Trailer | Hidden
    Message: "Experiment 1006: ''The Prototype'' He seems serviceable as the prime
    example for the type of vessel which we are trying to create. Despite his digestive
    tract being wired properly, the Prototype finds no necessity for sustenance (unlike
    the others). All other experiments can only survive while subsisting on much larger
    portions.") **Bodily Weaponry (Conventional: The Prototype has sharp claws,LOOK
    AT HIM which he often uses to attack, and pointed legs, which he uses for the
    same purpose) **Surface Scaling (Can stick to ceilings and walls) **Cyborgization
    (Partial) **Stealth Mastery (Snuck up on the Player, Huggy Wuggy, and Kissy Missy)
    **Limited Light Manipulation (The Prototype''s eye glows in the darkPoppy Playtime:
    Chapter 5 - Official Game Trailer) *Smoke Manipulation (The Prototype when he
    appears is followed by red smoke) **Possibly Perception Manipulation/Sleep Manipulation
    (Possibly the same Red Smoke used by CatNap, as he was assimilated into The Prototype.
    After the player inhales the Red Smoke, they begin to see CatNap in a much more
    monstrous form. Prior to this, inhalation of the Red Smoke causes the protagonist
    to see and hear a hallucination of Huggy Wuggy. Red Smoke eventually puts those
    who inhale it to sleep. This process can seemingly take place in mere seconds
    when inhaled in high doses) *Social Influencing (The Prototype is always feared
    or worshipped by those under him, such as CatNap) *Voice Mimicry (Speaks using
    sampled clips of the voices of those he''s heard and met, and can choose to speak
    in one voice) *Fire Manipulation (Despite being engulfed in flame, the only damage
    The Prototype took from a large train crash was slightly scorched cloth) *Electricity
    Manipulation (Only stunned for a very short time after being shocked by a tesla
    coil and having electricity coursing through his body)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
