  attack_potency:
    text: At least Wall level+ (Superior to any individual Experiment, with only Doey
      the Doughman standing any chance not simply dying against him head-on, and even
      he is visibly scared of The Prototype. Accidentally broke Poppy Playtime's ceramic
      head. Casually killed a critter capable of harming the PlayerUpscales from 10.59
      Megajoules) higher via Piercing Damage (The Prototype's main method of attacking
      is piercing damage, which instantly kills CatNap, Kissy Missy and Huggy Wuggy,
      and the Player)
    source_ids:
    - vsbattles-the-prototype-poppy-playtime-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Superhuman (Can barely outrun a passenger train moving at top speeds), Subsonic
      Combat/Reaction speed (Superior to bigger bodies like Huggy and Mommy, hit Kissy
      before she could react)
    source_ids:
    - vsbattles-the-prototype-poppy-playtime-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class 100 (Effortlessly restrained the Player. Comparable or superior
