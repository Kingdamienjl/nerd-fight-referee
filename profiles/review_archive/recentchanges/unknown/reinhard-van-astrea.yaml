      \ the Four Great Nations.\" He is the strongest in the world and the strongest\
      \ in history, his power eclipsing even that ofReid Astrea Birthday 2025 the\
      \ first Sword Saint. Reinhard clashed evenly against the Witch of Envy, reaching\
      \ a stalemate against her in an endless battle of striking away her shadows,\
      \ where any momentary lapse in concentration would prove fatal for the hero.Arc\
      \ 9, Chapter 23, \"The Gang's All Here\" However, neither could show their true\
      \ power as the Witch was a half-asleep, incomplete manifestation, while the\
      \ Sword Saint was weakened by his injuries and the Witch's miasma. Even so,\
      \ both were still so powerful that they could instantly end any fight against\
      \ any opponent other than eachother,Arc 9, Chapter 32, \"The Man Named Clind\"\
      \ and merely the aftershocks of their battle would certainly destroy the world\
      \ in seven days.Arc 9, Chapter 17, \"Please, Don't Forgive Me\" While weakened\
      \ by the Sand Sea's miasma, Reinhard was able to easily parry attacks from,\
      \ and was confident he could behead the dragonhusk of the Divine Dragon with\
      \ his bare hand, the dragonhusk's strength being in a completely different dimension\
      \ compared to the Cloud DragonArc 9, Chapter 10 \"Limit of Three Days\" that\
      \ Garfiel Tinsel had fought. Despite Garfiel's own martial strength having rapidly\
      \ developed, he found that the depth of Reinhard's strength had only become\
      \ more unfathomableArc 10, Chapter 4, \"You're Welcome\"), even higher with\
      \ the Dragon Sword Reid (Only when wielding this indestructible blade can Reinhard\
      \ go all-out\u2014 with a single sword slash he obliterated the Beast of the\
