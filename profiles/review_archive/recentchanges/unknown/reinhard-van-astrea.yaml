  attack_potency:
    text: "At least Country level,Scales vastly above 23.9622 Teratons of TNT likely\
      \ far higher (Reinhard van Astrea is the strongest living creature that has\
      \ ever or will ever be born, incapable of even being contained in the frameworkVolume\
