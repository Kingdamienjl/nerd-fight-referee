    - field: weaknesses
      value: Reinhard's Gate cannot release mana, meaning he can never use magic.
        His Excess Mana Circulation Constitution becomes a detriment if he is surrounded
        by intense miasma, weakening his physical abilities. The Divine Protection
        of the Sword Saint cannot read the future attacks of an individual who does
        not believe they are performing an attack. Reinhard can only request whichever
        Divine Protection he feels he needs in a specific moment (whether it exists
        or not), he cannot simply manifest any ability whatsoever, and he cannot receive
        Divine Protections to counter phenomena neither he nor Od Lagna are aware
        of. Reinhard's Divine Protections will work as long as he does not deactivate
        them. He can choose to deactivate and even erase them altogether, which would
        make him vulnerable. He is also vulnerable against Authorities, unique abilities
        granted by Witch Factors that were held by the Witches of Sin and now the
        Sin Archbishops of the Witch Cult
      source_id: mediawiki-372238
      provider_id: vsbattles
      authority: high
