    - field: standard_equipment
      value: 'thumb, Dragon Sword Reid: A sword used by the first Sword Saint and
        passed down by successive Sword Saints within House Astrea. The sword can
        only be drawn from its sheath against opponents it deems worthy for it to
        be used against. It is the most famous blade in the world, there is no blade
        more holy than it, none more magical than it. It is the strongest, the sharpest,
        and the most beautiful in the world. It is an enchanted sword that has drunk
        the blood of the thousands of Dragons it butchered. It is a holy sword bearing
        a Divine Protection bestowed by the Sword God. It is a blade thoroughly honed,
        forged by an anonymous swordsmith, and the finest steel tempered by the finest
        skill. Both the blade and sheath are believed to be indestructible, and will
        remain even after the world''s ruin. It is said to have been bestowed upon
        the Sword Saint by the Sword God, and the sheath''s claw-shaped engravings
        are said to have been made by the Divine Dragon''s talons. While only worthy
        foes may witness its blade, it is also unable to be drawn by any being other
        than the Sword Saint. Once the Dragon Sword has been unsheathed, defeat is
        no longer a possibility.'
      source_id: mediawiki-372238
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Average normally, Extraordinary Genius in combat
