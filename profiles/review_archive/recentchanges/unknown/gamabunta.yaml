- id: claim-weaknesses-04617882
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Gunshot: After kneading and converting
    his chakra into water, Bunta will shoot one or more condensed blasts of water
    at the target. The size is dependent on how much water the user can store in their
    body. Gamabunta bullet water.gif Bullet water gamabunta.png *Toad Sword Beheading:
    A technique used by toads, where their strong hips and legs allow them to leap
    from a distance and slice their target with a blade, all in quick motion. Gamabunta
    uses this with his huge dosu (Yakuza sword) Gamadosuzan gamabunta.PNG Gamadosuzan
    gamabunta 1.png *Toad Oil Flame Bullet: This is a two-way cooperation ninjutsu
    used by Jiraiya and Gamabunta. Gamabunta uses shoots a jet of oil from his mouth
    before Jiraiya spews a blast of fire onto the substance to ignite it, creating
    a giant flame-thrower effect. The flames were intense enough for Manda to shed
    his skin to escape it. *Toad Oil Bullet: The user converts their chakra into an
    extremely sticky oil and spits it out as a huge mass. Those caught by it will
    find it difficult to move, and simply washing the oil away with regular water
    won''t be easy. Furthermore, if a Fire Release technique is launched at the target
    after this technique is used, they will be enveloped in flames in an instant.
    Gamabunta and jiraiya fire style toad oil flamethrower.gif Katon Gamayu Endan_1.PNG
    Katon Gamayu Endan_2.PNG ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== ==Notes/Explanations== Category:Characters Category:Naruto Category:Chi
    Users Category:Enhanced Senses Users Category:Extrasensory Perception Users Category:Water
    Users Category:Large Sized Characters Category:Ninjas Category:Summons Category:Animals
    Category:Heroes Category:Good Characters Category:Amphibians Category:Acrobats
    Category:Breath Attack Users Category:Weapon Masters Category:Anime Characters
    Category:Manga Characters Category:Energy UsersCategory:Surface Scalers Category:Adults'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
