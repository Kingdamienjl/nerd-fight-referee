    can withstand a lot of cold Mighty Morphin Power Rangers S2 Ep48) * Mind Manipulation,
    Illusion Creation and Broadway Force (Resisted Gnarly Gnome''s mind magic and
    overpowered his illusions, Gnarly Gnome mind controls anyone that listens to his
    music and can force them to dance against their will Mighty Morphin Power Rangers
    S1 Ep5 Mighty Morphin Power Rangers S1 Ep5 VHS Mighty Morphin Power Rangers Alien
