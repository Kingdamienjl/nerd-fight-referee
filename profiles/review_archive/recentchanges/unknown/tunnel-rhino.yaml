    - field: speed
      value: 'At least Subsonic reactions and combat speed (Scaling to 165 m/s - Scales
        to Batgirl, dodging several of her attacks. Can expertly react to his own
        flight speed, expertly turning while flying with his super-fast Jetpack at
        what''s clearly max speed - said Jetpack can go just as fast as an agitated
        Man-Bat, who flies at 185 miles per hour while bringing prey back to his nest,
        and Batman''s attack speed was sufficient to tag Man-Bat in mid-flight while
        matching flight speeds with him. Could dodge explosive rockets from Toymaker''s
        killer robots - Batgirl also has a similar feat of dodging projectile rockets
        designed to explode. With his back turned to his attacker, dodged the prongs
        of a taser. Aimdodged taser fire at close range. Has evaded bullets. As mentioned
        prior, scales to Batgirl, who dodged electric bolts from Maxy Zeus, which
        should be about this fast - Ellen Yin could also kick Riddler in front of
        an arc of electricity after it was fired, and Batman and Robin evaded blasts
        of electricity from a metahuman named Hotwire. Could evade attacks from a
        Venomized Joker (as well as from Bane, who should be similar in speed), with
        said Joker being fast enough to react to a small missile fired from the Batmobile
        and even block it. Moved so quickly while fighting Scarface''s goons that
        he was a blur, even once moving from right in front of one to several feet
        behind them before his attacker could even turn around. As fast as Robin,
        who dodged the fired darts from a booby trap. Consistently dodges strikes
        from whips. Can react to and dodge thrown metal playing cards from The Joker,
        which should be comparable in speed to shuriken or throwing knives. Scales
        to foes who can block thrown Batarangs (and could catch one right in front
        of his face), which should also be at least as fast as throwing knives. Can
        tag Man-Bat in mid-flight - Man-Bat''s casual flight speed is 185 miles per
        hour. Dracula, who is at least as fast as if not notably faster than Batman,
        couldn''t dodge a crossbow bolt despite his attacker announcing their presence
        seconds earlier, though this is likely an outlier), possibly as high as Relativistic
        (Scaling to 0.14c - As unbelievable as it may seem due to the fact that he''s
        a "peak human," the Dark Knight has a bit of relativistic scaling. Repeatedly
        dodged Firefly''s energy blasts (and scales to Batgirl, who blocked one after
        it was fired, as well as Robin, who could duck under one after it was fired
        and evade several while running away), which are stated to be lasers and overtly
        behave as such. Alongside Catwoman, seems to have dodged a laser beam), Speed
        of Light attack speed with his Thermal Laser, at least Subsonic attack speed
        with the Batmobile''s missiles (Should be at least equal to the rockets from
        1960s rocket launchers, if not far faster), and Supersonic+ attack speed with
        the Batwing''s missiles (Should equal that of typical ASRAAMs) His travel
        speeds are as follows: Superhuman on foot (Upscaling from 37 MPH - As fast
        as Robin, who outran a hyena. Frequently disappears from view entirely when
