    - field: attack_potency
      value: Small Building Level+ physically (Scaling to 0.226 Tons - Can fight evenly
        with those who can harm him, such as Man-Bat who can cause him to spit up
        blood. Can fight and harm Bane without venom (someone capable of punching
        into an armored car even before Venomizing) even being capable of tossing
        him into an armored car hard enough to dent it (something that, unlike Batman's
        punches, Base Bane shrugged off) - Bane's venom can only increase his strength
        by a factor of three at the most. Is capable of consistently harming and physically
        competing with Killer Croc, who can exert this much energy like it's nothing,
        smash through a stone wall, and no-sell falling on a car with enough force
        to crush it. Repeatedly harmed and staggered the imposter Solomon Grundy,
        who could destroy a large house over a short period of time, punch Batman
        through a stone pillar, and casually burst through walls. Though weaker, is
        capable of consistently harming Man-Bat, who can devastate the entrance to
        a bank, burst through several ceilings with one charge, slam through brick
        walls, bend steel awnings with his feet, knock a prison door off its hinges,
        tear apart metal pipes with a charge, etc. Can repeatedly harm The Joker,
        who wasn't affected by slamming through a ceiling, once kicking him into a
        brick wall hard enough to damage it. Sent Penguin flying through a tree limb
        with a punch, knocking him out - this is especially impressive considering
        having a wooden chair broken against the back of Penguin's skull only annoyed
        him. Threw Man-Bat with so much force he flew through the side of a water
        tower. Can fight and KO Firefly, who was only annoyed by being slammed through
        walls. Slammed one of the Kabuki twins' faces into a wall hard enough to crater
        it. Can fight and knock out Punch/Judy, with one of them being capable of
        throwing a subway seat through a metal door, damaging a stone wall with a
        punch, smashing through wooden planks, etc. Decapitated a robot with a punch.
        Hurt a Fox Mutant who was strong enough to destroy a bench. Can send grown
        men flying with attacks. Kicked a lighthouse door down. Bent a metal scaffolding
        by kicking Ragdoll into it. Destroyed a door in one attack. Embedded Phosphorus
        in the ground with a stomp. Tossed Rhino (Ventriloquist's henchman, not the
        animal) with enough force to destroy a museum display case and its wooden
        base. Has struck people hard enough to cause small shockwaves. Slammed Firefly
        through a wall. Defeated many Everywhere Men - a slam from two of them could
        slam metal doors off their hinges and bend them in the middle. Kicked a door
        off its hinges), higher with Swing Kicks (Somewhat staggered Bane, who no-sold
        Batman's normal strikes. Swing-kicked Mr. Freeze through a thick ice structure)
        and higher cutting damage with Batarangs (Sliced through several of Toymaker's
        killer robots like butter with one Batarang throw - in contrast, another of
        these Robots (which we can safely assume is identical, since they all look
        the exact same and seem to have been manufactured en masse) wasn't nearly
        as damaged by a kick from Batman, who would have no reason to hold back here.
        Can dismember Clayface II, who can overpower his predecessor, who is consistently
        portrayed as equal to or stronger than Batman. Sliced through all four supports
        of a water tower in one arc), at least Building Level with the Batmobile's
        Missiles (Blasted a large crater in a Gotham street), Building Level with
        the Bat-Bot (Scaling to 0.679 Tons - Fought a venomized Bane (catching his
        punch and harming him with a punch), who has this level of physical might
        and could no-sell Batman's punches. Destroyed the head of a building-sized
        robot Joker with one attack. Smashed through a metal ceiling by jumping through
        it. Punched Venomized Joker into a small carnival building hard enough to
        destroy it - being able to harm Venomized characters like Joker and Bane is
        notable, since Venomized Joker laughed off a missile from the Batmobile, with
        its AP being discussed above), Building Level piercing damage with Energy
        Pick (Scaling to 0.679 Tons - Robin's energy pick, which should be equal to
        Batman's, could slice through the armor of the Second Batmobile, which should
        be just as durable as the armor of the first Batmobile, which was only cosmetically
        damaged after a tackle from a Venomized Bane) - Batman being incapable of
        getting out of a shipping container with his gadgets in S4 E10 is textbook
        PIS and is not consistent with the level of power Batman and his gadgets display.
