    - field: weaknesses
      value: "Regular issues of old age. Notable Attacks/Techniques: Jinton (Dust\
        \ Release): Dust Release is a nature transformation kekkei t\u014Dta, a combination\
        \ of earth, wind, and fire. To perform Dust Release, users form a small three-dimensional\
        \ form (e.g., a cube, a cone, etc.) out of chakra in their hands. The object\
        \ expands once released by the user and moves astonishingly fast at its target;\
        \ anything that passes through it (or that is passed through by it) is disintegrated\
        \ on a molecular level. *Jinton: Genkai Hakuri no Jutsu (Dust Release: Detachment\
        \ of Primitive World Technique): Onoki forms a transparent hexahedron with\
        \ a sphere in the center which he launches towards the opponent. The cube\
        \ expands to cover the opponent entirely. After a bit of delay, the technique\
        \ destroys everything caught inside to a molecular level. Doton (Earth Release):\
        \ One of the basic elemental nature transformation techniques and allows the\
        \ user to manipulate the surrounding earth for offensive and defensive purposes\
        \ or create it; be it dirt, mud, or rock. *Iwa Bunshin no Jutsu (Earth Release:\
        \ Rock Clone Technique): Onoki creates up to four clones to distract the enemy\
        \ or otherwise gain the upper hand in combat. Although the clones are made\
        \ out of rocks, their appearance is the same as the original until they crumble.\
        \ *Doton: G\u014Dremu no Jutsu (Earth Release: Golem Technique): This technique\
        \ allows the user to create a giant humanoid being composed of rock that can\
        \ either be expelled from the user's mouth or formed from a pre-existing source\
        \ of earth. Depending on the user, the golem can be created instantly. *Doton:\
        \ Chid\u014Dkaku (Earth Release: Moving Earth Core): This technique grants\
        \ the user the ability to lower or raise the ground in the surrounding area,\
        \ allowing them to create giant holes or elevations in the ground. The size\
        \ of the affected area, as well as the depths that it is lowered or raised\
        \ to, is also up to the user. With precise timing, this technique can be used\
        \ to evade incoming attacks, as well as to endanger opponents by moving them\
        \ into the path of an oncoming attack reducing their reaction time as well\
        \ as knocking them off balance, making it even harder to avoid the attack.\
        \ *Doton: Kaj\u016Bgan no Jutsu (Earth Release: Added-Weight Rock Technique):\
        \ Onoki touches the opponent, encasing them in rock while also increasing\
        \ the enemy's weight tremendously. Onoki used this technique to hold down\
        \ Mu. Alternatively, this technique is frequently used to enhance Onoki's\
        \ physical blows. **Doton: Ch\u014Dkaj\u016Bgan no Jutsu (Earth Release: Ultra-Added-Weight\
        \ Rock Technique): Improved version of the previous technique. Onoki increases\
        \ his weight tremendously, enhancing the strength of his punch massively.\
        \ Albeit performing this technique is slightly straining to Onoki's worn-out\
        \ body, causing him severe back pains. *Doton: Keij\u016Bgan no Jutsu (Earth\
        \ Release: Light-Weight Rock Technique): Onoki can reduce the weight of objects\
        \ and people for various people. People with decreased weight can move faster,\
        \ but their physical power is reduced accordingly. **Doton: Ch\u014Dkeij\u016B\
        gan no Jutsu (Earth Release: Ultralight-Weight Rock Technique): More power\
        \ variation of the previous ability. Onoki can drastically lower the weight\
        \ of anything he makes physical contact with. He could casually pick up the\
        \ Turtle Island that way. He also managed to stop Madara's huge falling rock\
        \ that was as large as an entire mountain, although Madara dropped a second\
        \ rock on the previous one, overwhelming Onoki in the process. *Flight Technique:\
        \ Allows the user to fly. He can also transfer its effects to others for an\
        \ unspecified amount of time. Category:Tier 7 Category:Tier 6 Category:Slappyjoe056"
