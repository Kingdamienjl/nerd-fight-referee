    - field: weaknesses
      value: 'Raiton (Lightning techniques disable his bombs), and his strongest attacks
        take time. Pride of his art leads him to abandon strategy in his fight with
        Sasuke. Notable Attacks/Techniques: *C1:Basic exploding clay created with
        one of Deidara''s palm mouths, it can take the form of a small animal or insect
        and often can fly, reaching a target and then detonating with a small amount
        of explosive power (depends on the size). *C2: Creates a large dragon out
        of clay that Deidara can fly on, that shoots out smaller exploding clay missiles
        that home in on their target. *C3: A large clay statue that explodes with
        enough force to destroy an entire village (The Bomb would have destroyed Sunagakure
        if Gaara hadn''t stopped it). *C4: A large clay statue shaped like Deidara
        that explodes and releases millions of microscopic bombs that enter the bloodstream
        of anyone in range who breathes them in, On Deidara''s command, the micro-bombs''
        detonation causes the victims'' bodies to disintegrate at the cellular level,
        literally turning them into dust. His C4 can also grow and then trap nearby
        enemies as it then floods the inside with C4 bombs. When fighting Onoki, Deidara
        utilises an alternate method of C4 by forming a small, chibi-like clay statue
        of himself with the mouths in his hands. *C0: Deidara eats a large ball of
        clay with the mouth on his chest, turning his entire body into a giant bomb
        which then detonates in a massive explosion. It is claimed to have a 10km
        range. *Suicide Bombing Clone: Deidara creates a shadow clone, which then
        ingests some explosive clay and explodes, creating a diversion that can be
        used to escape. The explosion is said to be strong enough to destroy an entire
        forest. *Earth Style: Hiding Mole: By infusing the earth with chakra to turn
        it into fine sand, this Jutsu allows the caster to burrow his way through
        the earth, like a mole. It is well suited for sneak attacks and operations
        because the caster can sense what is happening on the ground above. By burrowing
        deep into the earth, it is also possible to escape to a place beyond an enemy''s
        reach. *Clay Doppelganger: A Doppelganger jutsu unique to Deidara. It can
        be used both to substitute himself and to capture an enemy. When attacked,
        the Clay Doppelganger absorbs attacks with its body to capture an enemy. If
        detonating clay is mixed in, the doppelganger can be exploded, taking the
        enemy with it. Category:Tier 7 Category:Tier 6 Category:Slappyjoe056'
