- id: claim-powers-and-abilities-11d5db03
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Chakra Manipulation and Control, Master\
    \ Hand-to-Hand Combatant, Flight, Acrobatics, Earth Manipulation, Air Manipulation,\
    \ Fire Manipulation, Electricity Manipulation, Statistics Amplification (Shinobi\
    \ are capable of enhancing their physical capabilities with the use of chakra.\
    \ The Shunshin no Jutsu allows Shinobi to greatly enhance their speed by focusing\
    \ chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71),\
    \ Surface Scaling and Water Walking (By focusing chakra at the soles of their\
    \ feet, Shinobi can scale and cling to vertical surfaces, and even walk on waterNaruto\
    \ Chapter 18Naruto Chapter 90), Minor Illusion Creation and Duplication (With\
    \ the Clone Technique,Rin no Sho, Page 220 Shinobi can create illusionary duplicates\
    \ of themselves that have no physical substance), Shapeshifting (With the Transformation\
    \ Technique, Shinobi can transform themselves into other people, animals, plants,\
    \ and even inanimate objects, such as weapons), Paralysis Inducement (With the\
    \ Temporary Paralysis Technique,Rin no Sho, Page 176 Shinobi can completely paralyze\
    \ their targets from close to mid range), Can grant flight to other people, Limited\
    \ Gravity Manipulation (Can increase or reduce weight of matter, however, he has\
    \ to touch it physically), Deconstruction and Power Nullification (Molecular -\
    \ Particle Style is considered an indefensible Jutsu given its effect of molecularly\
    \ decomposing anything it comes in contact with,Jin no Sho: Page 259 be it Ninjutsu\
    \ or Ninja Tools, by dismantling the atomic bonds that hold the molecules together.Naruto:\
    \ Chapter 466Naruto: Chapter 546Naruto: Chapter 552Naruto: Chapter 575 Sequentially,\
    \ anything that is decomposed by Particle Style is further decimated by its ability\
    \ to eliminate residual \"root materials\" that weren't completely dispersed by\
    \ the initial phase of Particle Style\u2019s decomposition)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
