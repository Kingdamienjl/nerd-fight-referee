    are the incorporeal manifestations of one's vital energy, and can only be harmed
    by other Stands), Non-Physical Interaction (Stands can interact with ghosts and
    other Stands), Regeneration (High-Low), Can manipulate and unravel strings that
    can be controlled remotely, as well as be used to listen in on sound from a distance,
