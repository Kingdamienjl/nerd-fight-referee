    - field: weaknesses
      value: Chain-smoker, physically not very formidable, it's vital to acknowledge
        how the DC cosmology functions, which substantiates placements and their transcendence
        over succeeding planes of existence. Realms like Limbo and Monitor Sphere
        are both High Outerversal realms as they act on a hierarchy of fictional transcendence
        over the below realms. Limbo views realms like the Sphere of the Gods and
        below as nonexistent fiction and transcends its infinite hierarchies such
        as infinite Heavens, Hells and Limbos. Monitor Sphere views realms like Limbo
        as minuscule and infinitesimal, where everything is more profound and meaningful.
        The Monitor Sphere is also a world of primal and more fundamental Platonic
        Forms, "participates" in the Monitor Sphere. The cosmology functions on higher
        fictional transcendences over each realm, so that's where the scaling is derived
        from. Use these links as references. It's also important to understand that
        the tier placement for John Constantine is situational, and he doesn't always
        exert this level of power. The justification for the tier placement is his
        ability to consistently contend with higher-dimensional beings that correlate
        with the logic of the cosmology as I established previously. John Constantine
        scales off of certain high-level magic users like Doctor Fate, Zatanna and
        Spectre, as well as scaling above other beings that normally contest or scale
        above Outerversal levels of powers. Constantine's power and the spells he
        casts also play a major factor in determining his overall power
      source_id: character-stats-profiles-john-constantine-injustice
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
