        themselves. Due to Ghost Devil embodying the concept of ghosts, the more feared
        ghosts or the name "Ghost Devil" become, the stronger it becomes), Additional
        Limbs (The Ghost Devil has multiple arms), Extrasensory Perception (The Ghost
        Devil perceives others through fear), Immortality & Resurrection (Types 4
        & 8; When a Devil dies, they will reincarnate in Hell; when they die in Hell,
        they will reincarnate on Earth. This cycle will continue as long as the concept
        they embody exists. It should be noted though, that every time a Devil reincarnates,
        their memories and personalities are reset, making them a completely different
        being from their previous incarnation), Inorganic Physiology, Intangibility
