- id: claim-weaknesses-f0d3e2b0
  section: weaknesses
  axis: weakness
  text: 'Infestors cannot attack on their own, and cannot take action while using
    Neural Parasite Notable Attacks/Techniques: *Fungal Growth: The Infestor is protected
    by hardened layers of mold and fungus that can be launched as a viscous fluid
    that quickly breaks down matter and prevents enemies from moving. *Infested Terrans:
    The Infestor can store infested Marines inside storage sacs, and can launch them
    great distances in order to wreak havoc on the Swarm''s enemies. *Neural Parasite:
    By launching a tentacle tipped with a multi-mouthed parasite at enemies, the Infestor
    can take control of the minds of its enemies for a short duration, even able to
    take control of the most mentally hardened Protoss warriors and even autonomous
    machines. ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters
