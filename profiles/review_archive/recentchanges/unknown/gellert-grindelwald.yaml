  attack_potency:
    text: Street level physically. Large Building level with magic (Was said by many
      to be the second most powerful Dark Wizard ever, and hence shouldn't be overwhelmingly
      weaker than Voldemort. Fought the Dumbledore brothers in a three-way duel. Easily
      overpowered Newt Scamander)
    source_ids:
    - vsbattles-gellert-grindelwald-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Athletic Human with Subsonic reactions (His fires disintegrated two Aurors\
      \ mid-apparation. Able to match Dumbledore), Speed of Light attack speed via\
      \ Lumos Solem (Lumos Solem is a charm that creates a blinding flash of sunlight\
      \ used to defend against the Devil's Snare. Grindelwald should know this spell,\
      \ as it\u2019s implied to be taught in basic herbology to defend against the\
      \ Devil's Snare and advanced charms class, and first years like Hermione have\
      \ showcased this spell)"
    source_ids:
    - vsbattles-gellert-grindelwald-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Athletic Human physically. Class 5 to Class 10 with magic (Comparable to
