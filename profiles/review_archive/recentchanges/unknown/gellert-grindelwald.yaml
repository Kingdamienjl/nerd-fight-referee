        the latter was unable to match Old Dumbledore. Created a fire that was eventually
        going to burn down Paris and summoned multiple lightning bolts. Contended
        with Dumbledore much better than Credence Barebone did), Small Town level+
        with more powerful spells (Dueled Prime Dumbledore in a legendary duel and
