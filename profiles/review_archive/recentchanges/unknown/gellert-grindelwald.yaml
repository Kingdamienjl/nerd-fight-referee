    confidence: 0.95
  striking_strength:
    text: Street level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Street level (Should be comparable to Harry Potter) physically. Large Building
      level, likely higher with magical shielding (Should be far superior to a bounty
      hunter capable of blocking attacks from Credence's Obscurus. Protected himself
      from over ten aurors simultaneously)
    source_ids:
    - vsbattles-gellert-grindelwald-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Fought Dumbledore for 3 hours)
    source_ids:
    - vsbattles-gellert-grindelwald-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Tens of Meters with most spells. At least Tens of Kilometers with Teleportation
      and with magic (His fire was going to spread over all of Paris. Should be comparable
      to Dumbledore)
    source_ids:
    - vsbattles-gellert-grindelwald-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Genius. An extraordinarily skilled dark wizard, his skills, mastery, and
      understanding of magic were acknowledged to be very nearly equal to Albus Dumbledore,
      their duel being considered the greatest duel ever. Should be more skilled than
      Voldemort, as he was overwhelmed by Dumbledore in his elder days while Grindelwald
      gave Dumbledore a prolonged fight in their primes. Grindelwald was an exceptional
      strategist and leader as an adult, whose expertise was perhaps best shown by
      his ability to start a massive revolution on his own, gathering a large number
      of followers to establish a new wizarding world order and strategically overwhelming
      much of the Wizarding world to the point that Dumbledore's tactical advice ultimately
      proved fruitless, requiring Dumbledore's direct intervention to finally put
      an end to his For the Greater Good revolution. He was an exceedingly skilled
      manipulator who was even able to once manipulate Dumbledore himself and could
      convince crowds of followers to join him, even manipulating a trained group
      of Aurors to create a martyr out of a member of his army. He was even able to
      manipulate Credence and Queenie into joining him despite their clear wariness
      of him. Grindelwald also proved to be a consummate actor, multitasker and investigator,
      as during his time disguised as Graves, Grindelwald was able to perfectly mimic
      his personality and American accent, and limit his magical abilities to be only
      on par with Graves, as well as convincingly and effectively carry out Graves'
      many duties, while also gradually managing to locate the rampaging Obscurial,
      all without arousing suspicion.
    source_ids:
    - vsbattles-gellert-grindelwald-unknown
    confidence: 0.6
    notes: auto_repair source extraction
