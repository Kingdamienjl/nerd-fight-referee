    - field: weaknesses
      value: "Normal human weaknesses, highly overconfident and arrogant, if under\
        \ sufficient mental stress she can unconsciously stop holding back and damage\
        \ herself with her own power, can only shoot a max of 4 beams at once, regular\
        \ techniques attack in a linear fashion | Same as before, but she's mentally\
        \ unstable, can't aim carefully when using Body Crystal, Body Crystal runs\
        \ out after a few minutes, leaving her very weakened | Normal human weaknesses,\
        \ overconfident and arrogant, if under sufficient mental stress she can unconsciously\
        \ stop holding back and damage herself with her own power, regular techniques\
        \ attack in a linear fashion, her right eye can be hacked to manipulate her\
        \ senses, particularly, her sight Feats: See here. Notable Attacks/Techniques:\
        \ Meltdowner.gif|The power of a single Meltdowner beam SiliconBurn.gif|Silicon\
        \ Burn MeltdownerShield.gif|Meltdowner Shield *Meltdowner: (\u539F\u5B50\u5D29\
        \u3057 Genshi Kuzushi (Merutodaun\u0101), lit. \"Atomic Destruction\"): Mugino's\
        \ ability is known as the Meltdowner, with the technical classification as\
        \ Particle Waveform High-Speed Cannon (\u7C92\u6A5F\u6CE2\u5F62\u9AD8\u901F\
        \u7832 Tsubuki Hakei K\u014Dsokuh\u014D). Electrons have the properties of\
        \ both particles and waves. Mugino's ability allows her to control electrons\
        \ in that \"ambiguous\" state and forcibly stuck them in a third, new state\
        \ where it is both particle and wave. When they strike other objects the electrons\
        \ controlled by Mugino are unable to react as either a particle or a wave\
        \ because of their fixed state. Normally, electrons have a mass that is close\
        \ to zero, but because they are stuck or \"stopped\" at this state they take\
        \ the form of a seemingly solid object, which has become a pseudo-\"wall\"\
        \ due to the \"stopped\" state, creating a highly destructive beam of high-speed\
        \ electrons that pierces through a target at the same velocity that it was\
        \ fired.Toaru Majutsu no Index Volume 15 Chapter 4 Part 7 Her ability is so\
        \ powerful that she unconsciously holds back part of her power due to her\
        \ survival's instinct so as to not damage herself with her own ability. When\
        \ her anger over Shiage hurting her despite being a \"worthless level 0\"\
        \ reached its peak, she blew up her own left arm from wrist to elbow while\
        \ trying to kill him with her power. Since her ability is a form of electron\
        \ manipulation, she can also manipulate enemy electric or electron-based attacks\
        \ and bend their trajectory away from her. **Meltdowner Beams: She can fire\
        \ beams of destructive electrons which are said to be stuck in a state between\
        \ particles and waves. Mugino initially could shoot four laser-like beams\
        \ or release one concentrated blast. Normally, her rate of fire is a little\
        \ slow since Mugino takes her time to perfectly aim and calculate the output\
        \ of every single shot. She can also fire her Meltdowner like a rocket engine\
        \ to move at speeds exceeding Mach 20. After World War III, Mugino has trained\
        \ her ability to the point that she can create up to 20 Meltdowner beams at\
        \ once.Shinyaku Toaru Majutsu no Index Volume 12 Chapter 2 Part 6 Wounds inflicted\
        \ are completely cauterized.Toaru Majutsu no Index New Testament Volume 12\
        \ Chapter 2 Part 15 **Silicon Burn (\u62E1\u6563\u652F\u63F4\u534A\u5C0E\u4F53\
        \ Kakusan Shien Hand\u014Dtai (Shirikon B\u0101n), lit. \"Diffusion Aid Semiconductor\"\
        ): To compensate for her usually slow firing rate, Mugino carries special\
        \ silicon cards. The slots found on the card's surface can disperse the Meltdowner\
        \ into dozens of small beams to cover the entire area.Toaru Kagaku no Railgun\
        \ Volume 5 Chapter 30 **Meltdowner Shield: Mugino can generate round-shaped\
        \ formations of her Meltdowner to block incoming attacks.Toaru Kagaku no Railgun\
        \ Volume 5 Chapter 28 The shield annihilates everything that comes in contact\
        \ with it thus protecting her. Mugino can supposedly also erect a full body\
        \ barrier to protect herself from all directions, solely as a last resort.\
        \ **Meltdowner Arm: After her mutilation, Mugino replaced her lost left arm\
        \ with an energy-like Meltdowner Arm which can move according to her wishes\
        \ yet carry the Meltdowner's properties.Toaru Majutsu no Index Volume 22 Chapter\
        \ 9 Part 4 She can freely expand the arm in size. **Meltdowner Eye: After\
        \ her mutilation, Mugino replaced her lost right eye with a Meltdowner eye.\
        \ While is not known if the eye is a functional replacement that allows her\
        \ to see, she can use it to fire a Meltdowner beam. *Body Crystal Overload:\
        \ Body Crystal is a special drug developed by Academy City in one of their\
        \ attempts to reach Level 6. The drug causes an esper's power to overload,\
        \ and in extremely rare cases that state would strengthen an esper\u2019s\
        \ power, but continued use of the drug will wear down their body and make\
        \ them dependent on the drug to activate their power. When Mugino ingested\
        \ a small amount of Body Crystal she was able to shoot tens of thousands of\
        \ Meltdowner beams around her, presumably much stronger than her normal powers.\
        \ Since she's constantly shooting beams the sphere around her looks like a\
        \ solid energy construct. She can also focus the beams in one spot to construct\
        \ a single arm"
