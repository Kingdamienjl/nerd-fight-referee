        \u7832 Tsubuki Hakei K\u014Dsokuh\u014D). Electrons have the properties of\
        \ both particles and waves. Mugino's ability allows her to control electrons\
        \ in that \"ambiguous\" state and forcibly stuck them in a third, new state\
        \ where it is both particle and wave. When they strike other objects the electrons\
        \ controlled by Mugino are unable to react as either a particle or a wave\
        \ because of their fixed state. Normally, electrons have a mass that is close\
        \ to zero, but because they are stuck or \"stopped\" at this state they take\
        \ the form of a seemingly solid object, which has become a pseudo-\"wall\"\
        \ due to the \"stopped\" state, creating a highly destructive beam of high-speed\
        \ electrons that pierces through a target at the same velocity that it was\
        \ fired.Toaru Majutsu no Index Volume 15 Chapter 4 Part 7 Her ability is so\
        \ powerful that she unconsciously holds back part of her power due to her\
        \ survival's instinct so as to not damage herself with her own ability. When\
        \ her anger over Shiage hurting her despite being a \"worthless level 0\"\
        \ reached its peak, she blew up her own left arm from wrist to elbow while\
        \ trying to kill him with her power. Since her ability is a form of electron\
        \ manipulation, she can also manipulate enemy electric or electron-based attacks\
        \ and bend their trajectory away from her. **Meltdowner Beams: She can fire\
        \ beams of destructive electrons which are said to be stuck in a state between\
        \ particles and waves. Mugino initially could shoot four laser-like beams\
        \ or release one concentrated blast. Normally, her rate of fire is a little\
        \ slow since Mugino takes her time to perfectly aim and calculate the output\
        \ of every single shot. She can also fire her Meltdowner like a rocket engine\
        \ to move at speeds exceeding Mach 20. After World War III, Mugino has trained\
        \ her ability to the point that she can create up to 20 Meltdowner beams at\
        \ once.Shinyaku Toaru Majutsu no Index Volume 12 Chapter 2 Part 6 Wounds inflicted\
        \ are completely cauterized.Toaru Majutsu no Index New Testament Volume 12\
