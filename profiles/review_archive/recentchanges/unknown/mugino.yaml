        \ yet carry the Meltdowner's properties.Toaru Majutsu no Index Volume 22 Chapter\
        \ 9 Part 4 She can freely expand the arm in size. **Meltdowner Eye: After\
        \ her mutilation, Mugino replaced her lost right eye with a Meltdowner eye.\
        \ While is not known if the eye is a functional replacement that allows her\
        \ to see, she can use it to fire a Meltdowner beam. *Body Crystal Overload:\
        \ Body Crystal is a special drug developed by Academy City in one of their\
        \ attempts to reach Level 6. The drug causes an esper's power to overload,\
