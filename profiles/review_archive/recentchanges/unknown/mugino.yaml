        \ Level 6 Notable Attacks/Techniques: Electromaster (\u96FB\u6483\u4F7F\u3044\
        \ (\u30A8\u30EC\u30AF\u30C8\u30ED\u30DE\u30B9\u30BF\u30FC) Dengeki Tsukai\
        \ (Erekutoromasut\u0101), lit. \"Electric Shock User\"): While Mikoto chose\
        \ to name her esper ability after her famous signature move, the Railgun,\
        \ she belongs to a type of espers called Electromasters, espers which can\
        \ generate and manipulate electricity and control electromagnetism. While\
        \ it's one of the more common abilities in Academy City, Mikoto is known to\
        \ be the city's strongest Electromaster, with a maximum output of 1 billion\
        \ volts. Despite being famous for her Railgun, she herself considers the true\
        \ worth of her ability to reside in its great versatility, holding pride on\
        \ her ability to attack the enemy with multiple attacks from multiple angles,\
        \ and disliking others considering her to be just a walking cannon. Electromagnetism:\
        \ *Railgun (\u8D85\u96FB\u78C1\u7832 (\u30EC\u30FC\u30EB\u30AC\u30F3) Ch\u014D\
        -Denjih\u014D (R\u0113rugan), lit. \"Super Electromagnetic Cannon\"): Mikoto\
        \ can fire metal objects at three times the speed of sound using her electricity.\
        \ Her railgun has a muzzle velocity of 1030 m/s (2307.2 mph), and can be fired\
        \ at a rate of 8 shots per minute. She primarily uses arcade coins as her\
        \ projectiles for portability, limiting her normal range to 50 meters because\
        \ of the coins melting due to friction, though she can use larger objects\
        \ for greater range and destructive power. **Liquid Proof Railgun: A version\
        \ of Misaka's Railgun improved and only possible through the participation\
        \ of Misaki. Misaki uses her ability to manipulate moisture at the microscopic\
        \ level into a special lattice pattern on the surface of the coin. By doing\
        \ so she cools the coin and greatly reduces its friction, taking away the\
        \ usual 50 meter limit of the technique imposed by the coin having vaporized\
        \ when reaching that distance and increases its power due to less kinetic\
        \ energy being lost in friction. Additionally, when the coating liquid is\
        \ vaporized and rapidly expands into steam this accelerates the coin further\
        \ making it so that it accelerates the further it flies instead of slowing\
        \ down. *Radar Interference: Mikoto can use electromagnetism to interfere\
        \ with radar and radar-based weapons liked guided missiles *Microwave Defense:\
