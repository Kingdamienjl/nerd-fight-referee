        Shotgun), Electricity Manipulation and Paralysis Inducement (With the Taser),
        Smoke Manipulation (With Smoke Grenades), Forcefield Creation and Limited
        Attack Reflection (With the Forcefield Launcher), Healing (With forcefields,
        donuts, and the Ambulance), Animal Manipulation and Enhanced Senses (Can tame
        and command a Dog to sniff out and attack enemies), Explosion Manipulation
