- id: claim-standard-equipment-18a710d3
  section: equipment
  axis: equipment
  text: 'Parachutes and donuts. Prisoner jumpsuit as a Prisoner. Police uniform, batons,
    pistols, shotguns, handcuffs, tasers, roadspikes, keycards, and police sirens
    as a Police Officer. With sufficient preparation time, they can gain access to
    a variety of melee, ranged weapons and explosives; a massive number of vehicles;
    and various items, a few examples include: *Handcuffs: An item used by the Police
    to restraint and arrest guilty Prisoners and Criminals. When someone is arrested,
    their hands will be forced behind their back, all of their items will immediately
    disappear, and they won''t be able to move aside from jumping in one place and
    turning in different directions. After 10 seconds, the arrested person will be
    teleported to their cell in either the Prison, Maximum Security Prison, or the
    old Bounty Island where they will be imprisoned. However, this can be prevented
    if someone else free the handcuffed person before 10 seconds pass (though the
    latter would still lose all of their items). Additionally, handcuffs can also
    be used to eject people from a vehicle and prevent them from entering it for 2
    seconds. *Forcefield Launcher: An alien forcefield generator. When fired, the
    weapon shoots out a small purple orb which expands into a larger spherical forcefield
    after reaching the place it was aimed at. The forcefield acts as a semi-permeable
    bubble which allows people to pass through but not bullets. This makes forcefields
    very good for defense as they can protect from enemy gunfire and potentially deflect
    them into nearby foes. In addition to protection, standing within the field also
    gives the person who deployed it a boosted healing effect, though only one forcefield
    can be deployed at a time. After 15 seconds, the forcefield will shrink down then
    disappear and the launcher will be able to deploy a new one. Apart from bullets,
    however, other things and people can pass through forcefields without issue. *Jetpack:
    A transportation item which uses a limited fuel tank to allow its user to either
    ascend into the air or slowly descend from high places to avoid fall damage. It
    can be refueled for free after running out and can also be refueled with Rocket
    Fuel for greater speed and duration. Jetpacks can only be refueled while on the
    ground 15 seconds after running out completely. Optional'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
