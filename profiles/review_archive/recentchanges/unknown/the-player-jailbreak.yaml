- id: claim-powers-and-abilities-0d55cf71
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Preparation (Some of their feats require
    extensive preparation time and resources) *Martial Arts (Police Officers should
    be trained in hand to hand combat, allowing them to quickly and effectively restrain,
    disarm, and arrest multiple armed criminals using handcuffs. Criminals should
    be comparable to Police Officers in unarmed combat) *Weapon Mastery (Skilled with
    various weapons) *Vehicular Mastery (Can easily operate a massive number of vehicles
    on their own, even including a UFO. Can perform PIT maneuvers) *Stealth Mastery
    and Sleight of Hand (Criminals can pickpocket police officers, escape prison through
    various means, and stealthily commit crimes without getting caught) *Social Influencing
    (Criminals can bribe the police, freely enter locations such as gun shops despite
    being wanted by the police, and even rob donut shops and gas stations by simply
    intimidating the cashiers without the need of weapons) *Hacking (Able to hack
    various computers in a very short amount of time) *Acrobatics (Can perform rolls
    and flips. Can quickly make their way through places that require decent acrobatic
    abilities, obstacle courses, and hallways full of deadly traps) *Regeneration
    (High-Low. Can regenerate from multiple gunshots and being severely burned, though
    this takes some time) *Summoning and Regeneration (Low-Mid for their vehicles.
    Can summon any vehicles they own. Most vehicles are shown to regenerate from multiple
    gunshots and damages that leave them temporarily disabled, ranging anywhere from
    having one of their tires popped or getting rammed by another vehicle to having
    the engine damaged so much that it lets out smoke, and continue functioning unhindered.
    The Tanker can be summoned again after exploding) *BFR and Paralysis Inducement
    (With Handcuffs) *Damage Reduction (With the Riot Shield and certain vehicles)
    *Statistics Amplification (With the Energy Drink and melee weapons. Can give the
    user a temporary speed boost) *Light Manipulation (With various light sources)
    *Statistics Reduction (With the Spotlight. Police officers can slow down criminals
    and their vehicles by aiming the spotlight at them) *Explosion Manipulation (With
    various explosives) *Self-Destruction (With the Tanker and Bank Truck) *Homing
    Attack (With the Jet and Rocket Launcher. Can fire guided missiles) *Flight (With
    various aircrafts, the Jetpack, the Parachute, and the Glider) *Fire Manipulation
    (With the Tanker and Rocket Launcher. Can create fires) *Water Manipulation (With
    the Firetruck. Armed with a water cannon that can quickly put out fires and push
    other Players around) *Plasma Manipulation and Electricity Manipulation (With
    the Plasma Pistol and Plasma Shotgun) *Electricity Manipulation and Paralysis
    Inducement (With the Taser) *Smoke Manipulation (With Smoke Grenades) *Forcefield
    Creation and Limited Attack Reflection (With the Forcefield Launcher) *Healing
    (With forcefields, donuts, and the Ambulance) *Animal Manipulation and Enhanced
    Senses (Can tame and command a Dog to sniff out and attack enemies) *Explosion
    Manipulation and Radiation Manipulation (With Nukes) Resistance to: *Extreme Heat
    and Radiation Manipulation (Can steal and carry around an uranium rod on their
    back without suffering from either the extreme heat or high levels of radiation.
    Can survive drinking the Energy Drink which is implied to have radioactive side
    effects) *Fire Manipulation (Can endure standing in fires for a brief period of
    time which can burn underwater and survive sitting inside the Tanker as it explodes)
    *Water Manipulation (Though they''re still pushed around, the Player isn''t hurt
    by the Firetruck''s water cannon which is the only water source in the game that
    can put out fires) *Ice Manipulation (Unbothered by the harsh winter weather with
