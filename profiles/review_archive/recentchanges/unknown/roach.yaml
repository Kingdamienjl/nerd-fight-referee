- id: claim-weaknesses-15e16b0b
  section: weaknesses
  axis: weakness
  text: 'The roach cannot attack aerial opponents due to its body structure. Notable
    Attacks/Techniques: *Acid Saliva: The roach launches stomach acid at the target
    from its mouth, punching through armor and easily dissolving flesh. *Burrow: Roaches
    can burrow underground in order to regenerate incredibly quickly by absorbing
    nutrients from the soil, and the Roach can move while burrowed. When tunneling
    claws are mutated, the Roaches gain the ability to move at full speed while burrowed
    while also gaining increased regeneration while burrowed. *Adaptive Plating: If
    mutated, when the Roach gets severely injured modular plates will thicken in reaction
    to loss of blood to make the Roach more durable. *Corpser Strain: A strain of
    Roach created by Abathur, the Corpser Roach possesses all the abilities of a normal
    roach, but its acid saliva also carries parasites that implant themselves in the
    roach''s victims. If killed in a short enough timeframe, the corpse produces Roachlings,
    an incredibly small strain of Roach that should at least be comparable to Zerglings.
    *Vile Strain: A strain of Roach created by Abathur, the Vile Roach possesses all
    the abilities of a normal roach, but its acid saliva also hardens into layers
    onto those they hit, making it far more difficult for them to move or attack.
    ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters Category:Game
    Characters Category:Animals Category:Science Fiction Characters Category:Regeneration
    Users Category:Acid Users Category:Parasites Category:Adaptation Users Category:StarCraft
    Category:Genderless Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
