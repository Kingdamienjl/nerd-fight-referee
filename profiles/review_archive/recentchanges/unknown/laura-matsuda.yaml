- id: claim-weaknesses-0d0b022b
  section: weaknesses
  axis: weakness
  text: 'Laura has a short temper and can sometimes act without thinking first. Notable
    Attacks/Techniques: File:StepElbow.gif|Step Elbow File:TwistBarrage.gif|Twist
    Barrage File:DualCrash.gif|Dual Crash *Step Elbow: Laura steps forward and performs
    a horizontal elbow strike *Twist Barrage: Laura steps forward and performs a horizontal
    elbow strike. If the first hit connects, she follows up with an upward elbow strike
    *Dual Crash: Laura performs a high elbow strike, followed by a knee strike File:SeoiThrow.gif|Seoi
    Throw File:PullbackHold.gif|Pullback Hold *Seoi Throw: Laura grabs her opponent
    by the arm. She pivots on her front foot, bends forward and throws her opponent
    over her hips *Pullback Hold: Laura grabs a hold of her opponent''s arm and pulls
    them towards her. Next, she swings herself over on top of her opponent''s back,
    forcing them to fall on their stomach. Laura sits on her opponent''s back, pulling
    their arm back into their body, stretching their upper limb and shoulder File:SplitRiver.gif|Bolt
    Charge - Split River File:RodeoBreak.gif|Bolt Charge - Rodeo Break File:ThunderClap.gif|Thunder
    Clap File:SunsetWheel.gif|Sunset Wheel *Bolt Charge: Laura performs a lunging
    elbow strike. She can follow up with two additional moves. Split River Laura swings
    and rotates herself over her descending opponent. Laura scissors her legs around
    one of her opponent''s legs. Laura applies a Hamstring Leglock once they hit the
    ground, applying pressure on their hamstrings and ankle. Rodeo Break Laura grabs
    one of her opponent''s arms and swings herself over them. She scissors her legs
    around the trapped arm and uses her own body weight to bring the opponent down.
    As Laura lands on the ground, puts her opponent in a Cross Armbar *Thunder Clap:
    Laura creates a slow-moving, electric projectile. Laura can charge her Thunder
    Clap, giving it further range and deal additional damage *Sunset Wheel: Laura
    grabs a hold of her opponent and hits them with an elbow strike. Next, Laura swings
    her opponent on her shoulders and performs a high-flying somersault, rotating
    herself several times in midair. Laura then slams her opponent back-first to the
    ground, locking them in a devastating Shoulder Lock *Inazuma Spin Hold: Laura
    steps forward to grab her opponent. She jumps into the air with her foe in hand
    and begins spinning around violently, slamming to the ground in a burst of electricity.
    Laura then proceeds to slam her opponent into all four corners, continuing to
    spin and crackle with electricity as she does so, until finally coming to a stop
    with her opponent locked in a choke hold center|335px File:DoubleSlap.gif|Double
    Slap File:VoltyLine.gif|Volty Line File:ThunderSpike.gif|Volty Sprink - Thunder
    Spike File:HeavyHeel.gif|Volty Sprink - Heavy Wheel File:SparkShow.gif|Spark Show
    File:ShockChoke.gif|Shock Stance - Shock Choke *Double Slap: After blocking an
    attack, Laura smacks her opponent with a spinning two-handed strike charged with
    electricity *Volty Line: Laura performs a tumbling wheel kick that hits overhead
    *Volty Sprink: Laura springs herself forward and into the air. During the jump,
    she has a couple of follow-up options. Thunder Spike Laura fires a Thunder Clap
    at a downward angle. Heavy Wheel Laura performs a downard axe kick *Spark Show:
    Laura''s wrists are surged with electricity. When Spark Show is activated, she
    will have increased mobility, as well as increased damage and stun output *Shock
    Stance: Laura''s upper body and feet are surged with electricity. When Shock Stance
    is activated, Laura can perform the Matsuda Sway. She undulates and twists her
    body to the side, dodging her opponent''s attacks. During the Matsuda Sway, Laura
    performs her Shock Choke, stretching her opponent''s neck and arm while they are
    electrified ==Gallery== ==References== ==Statistics Values== ==Notable Matchups==
    Victories: Blanka (Street Fighter) Blanka''s profile Losses: Chun-Li (Street Fighter)
