    rigged to detonate if Shinya Kawai's body were to be removed from its freezer),
    Preparation (Created numerous contingency plans for a variety of situations and
    had bombs set up well in advance), Social Influencing (Was able to accurately
    factor in the actions of Yagami, Soma, and others into his plans, at times even
    subtly manipulating key figures into making certain moves), Stealth Mastery (Effectively
    hid from Yagami, local law enforcement, and even the Japanese government's Public
    Security branch for some time), Pressure Points (Strikes the liver in his Mortal
    Attack, a known high-damage area of the body), Acrobatics (Skillfully climbed
    up a warehouse shelf extremely quickly and while attacking Yagami), Heat/EX (General
    Abilities)
  source_ids: *id003
