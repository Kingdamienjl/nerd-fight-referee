        hide his crimes from the DEA for over 2 years, despite having a brother-in-law
        that was a DEA agent. Was able to trick Jesse into thinking that Gus poisoned
        Brock and got Jesse on his side. Is a skilled manipulator, managing to get
        away with various complex lies, such as convincing multiple doctors he went
        into a fuges state and convincing Hank and Marie that he earned over 7 figures
        through gambling **Charisma; Manipulated Jesse into expanding their meth empire,
        reestablishing their partnership despite it having ruined Jesse''s life, killing
