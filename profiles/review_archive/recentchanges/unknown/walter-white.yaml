      Out which would have broken an average human''s hand. Has harmed and even once
      overpowered Jesse, albeit Pinkman always comes out as the victor in their scuffles.
      Overpowered Saul GoodmanBreaking Bad S3E4: Green Light). Street level with firearms
      (Has been shown to use weapons such as a Smith & Wesson 4506, Smith & Wesson
      M945, Ruger LCR, and M60 machine gunBreaking Bad S4E2: Thirty-Eight SnubBreaking
      Bad S3E12: Half Measures). Wall level with vehicles (Instantly killed one drug
      dealer and severely wounded another by running them over with his Aztek. 1986
      Fleetwood Bounder and Ford F-350 are on this level). Wall level with explosives
      (His homemade explosive made this explosion). At least Wall level with fulminated
      mercury (50 grams of Walter''s fulminated mercury caused an explosion this big,
      and Walter made at least a pound of it)'
