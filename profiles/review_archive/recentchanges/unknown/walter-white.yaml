        the former''s hate for Walter. Has talked his way out of gunpoint numerous
        times and frequently talked Mike into not killing him. Quickly gained the
        respect of Tuco and Jack''s gang **Coercion; Could orchestrate events so that
        Gus wouldn''t be able to kill him without risking his entire drug empire.
