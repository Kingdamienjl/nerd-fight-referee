        founded the company Gray Matter. The company''s initial task was to monetize
        a major scientific discovery made by Walter. The discovery was so large-scale
        that a Nobel Prize was awarded for it.Breaking Bad S1E3: ...and the Bag''s
        in the River Thanks to Walter''s discovery, the company has enriched itself
        and has a fortune of billions of dollars with a capital letter M and gained
        enormous influence and an impeccable reputation throughout the country, and
        possibly around the world. *The meth he created in the show was 99.1% pure,Breaking
        Bad S5E7: Say My Name which is extremely difficult to pull off according to
        real life instances and has yet to be seen when accounting for Walt''s alternate
        cooking method and the blue tint of his meth. *He is an expert in both planning
        and improvising as well. He outsmarted and killed Gustavo Fring, one of the
        most prominent and intelligent businessmen and meth distributors in the Southwestern
        United States and in the series finale, Walter constructed an oscillating
        machine gun out of the hood of a car which could be activated remotely, he
        also already constructed bombs and makeshift car batteries with simple household
        items. *Already showed to be a good manipulator, being able to manipulate
        dangerous criminals and professional killers to come out of being held at
        gunpoint and other life-threatening situations alive and, despite being the
        brother-in-law of a DEA agent, he was able to avoid capture and suspicion
        for nearly two years through his manipulation skills. *Planned a hidden robbery
        of a train that supplied resources from another country.Breaking Bad S5E5:
        Dead Freight The plan involved the effort of multiple people to realize a
        perfect robbery, and even after it initially fails, he quickly created a new
        plan through fast calculations and managed to get completely pour water (dilute
        methamphetamine). *Walt has a high working memory index. According to the
        duration of the time, which is 2-3 seconds, Walter easily remembers the coordinates
        of the area from an eighteen-digit number and stores the information for a
        long time.Breaking Bad S5E13: To''hajiilee Due to the high level of adaptability,
        Heisenberg instantly processes information received in extreme situations
        (under threat of life) and applies it to avoid conflicts and consequences.'
