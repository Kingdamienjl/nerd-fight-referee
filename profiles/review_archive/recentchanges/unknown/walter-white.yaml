        Broke into and out of a fire station with no firefighters spotting him. Broke
        into Elliot and Gretchen''s house without getting spotted until he revealed
        himself) *Social Influencing **Reputation; Has a notable reputation as a dangerous
        and powerful drug kingpin, being able to intimidate Declan into selling his
        product just by telling his group that he was the one that killed Gus Fring.
        Is admired and respected by Jack''s gang for his cooking skills **Instigating
        Fear; Intimidated a pair of drug dealers out of his territory with a single
        sentence, despite having a rather unknown reputation at the time. Intimidated
        Tuco into selling his product. Could intimidate Saul, making Saul continue
