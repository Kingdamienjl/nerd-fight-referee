- id: claim-weaknesses-e630fc1f
  section: weaknesses
  axis: weakness
  text: 'Emotionally unstable even after the events of the first Fantastic Beasts
    movie. Magical attacks can harm him while as an Obscurus. The Obscurus inside
    him is a parasite and will eventually kill him. Needs his wand to perform spells
    and magic. Notable Attacks/Techniques: right|200px * High Magic Capability: While
    Credence had not initially developed his magical abilities due to Mary Lou Barebone,
    his latent magical powers were incredible, which allowed him to survive long past
    the age of 10, despite having an Obscurus inside him. This was possibly due to
    Credence being a member of the Dumbledore family. After being given a wand for
    the first time, Credence instinctively cast a spell that fired a bolt of fiery
    energy so powerful, that it instantly destroyed a mountainside. right|200px *
    Obscurus Transformation: Credence was an Obscurial, prone to unleashing or embodying
    an Obscurus due to years of being forced to suppress his magic. He was immensely
    more powerful than other known Obscurials, living longer than any previously known,
    and requiring over 20 MACUSA Aurors unleashing destructive spells to nearly destroy
    Credence, though the latter still managed to survive. Ever since then, Credence
    had acquired complete control over his Obscurus, being far more precise with his
    Obcurus attacks than before while fighting Gunnar Grimmson, with the bounty hunter
    being forced to constantly hold up a Shield Charm, and Apparate away to safety.
    Gellert Grindelwald went so far as to claim to his acolytes that Credence''s Obscurus
    was the only being apart from himself powerful enough to defeat and kill Albus
    Dumbledore, the so-called greatest wizard of all time. * Wand versatility: Credence
    was able to effectively use the wand gifted to him by Grindelwald, without having
    been officially chosen by said wand, and Credence was even able to instinctively
    cast an extremely powerful spell from that wand, pulverising a mountainside. *
    Apparition: Although where he learned how to was unknown (though possibly during
    the travels that lead to him joining the Circus Arcanus), Credence was able to
    Apparate away from Grindelwald''s rally in Paris. ==Notable Matchups== Victories:
    Losses: Inconclusive: Category:Characters Category:Male Characters Category:Tragic
    Characters Category:Movie Characters Category:Antagonists Category:Magic Users
    Category:Teleportation Users Category:Energy Users Category:Transformation Users
    Category:Flight Users Category:Invisibility Users Category:Intangibility Users
    Category:Telekinesis Users Category:Size Users Category:Regeneration Users Category:Rage
    Users Category:Wizarding World'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
