    - field: weaknesses
      value: 'High Magic Capability: While Credence had not initially developed his
        magical abilities due to Mary Lou Barebone, his latent magical powers were
        incredible, despite having an Obscurus inside him. This was possibly due to
        Credence being a member of the Dumbledore family. After being given a wand
        for the first time, Credence instinctively cast a spell that fired a bolt
        of fiery energy so powerful, Obscurus Transformation: Credence was an Obscurial,
        prone to unleashing or embodying an Obscurus due to years of being forced
        to suppress his magic. He was immensely more powerful than other known Obscurials,
        living longer than any previously known, and requiring over 20 MACUSA Aurors
        unleashing destructive spells to nearly destroy Credence, though the latter
        still managed to survive. Ever since then, Credence had acquired complete
        control over his Obscurus, being far more precise with his Obcurus attacks
        than before while fighting Gunnar Grimmson, with the bounty hunter being forced
        to constantly hold up a Shield Charm, and Apparate away to safety. Gellert
        Grindelwald went so far as to claim to his acolytes that Credence''s Obscurus
        was the only being apart from himself powerful enough to defeat and kill Albus
        Dumbledore, the so-called greatest wizard of all time., Wand versatility:
        Credence was able to effectively use the wand gifted to him by Grindelwald,
        without having been officially chosen by said wand, and Credence was even
        able to instinctively cast an extremely powerful spell from that wand, pulverising
        a mountainside., Apparition: Although where he learned how to was unknown
        (though possibly during the travels that lead to him joining the Circus Arcanus)'
      source_id: vsbattles-credence-barebone-recentchanges
