        \ natural energy, as well as Six Paths Sage Chakra. They are capable of negating\
        \ all standard Ninjutsu. These orbs of black chakra are highly versatile and\
        \ can be used for offensive, and supplementary purposes. The user can apply\
        \ shape transformation to the balls to alter them into various weapons, either\
        \ by having the orbs pierce through holes in their hands or merely grabbing\
        \ them. The spheres can also wrap around the user to act as a defensive shield\
        \ or be launched to serve as high-speed projectiles. They are also capable\
        \ of causing massive explosions by rapidly expanding their size, a lethal\
        \ attack that can also damage the user's own body., Six Paths: Kunitsukami:\
        \ Asura creates a gigantic chakra avatar, which is powerful enough to do battle\
        \ with Indra's Complete Body \u2014 Susanoo. Asura is able to equip the avatar\
        \ with Truth-Seeking Balls that can be used as a means of offence, or the\
        \ avatar can serve as a defensive structure, similar to Indra's Susanoo.,\
        \ Senp\u014D: Mokuton: Shin S\u016Bsenju (Sage Art: Wood Release: True Several\
