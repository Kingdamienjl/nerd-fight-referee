    - field: intelligence
      value: 'Average (He is incredibly simple-minded and doesn''t know when to lie,
        but he can be quite observant, such as when he deduced Raika was in trouble
        by looking at his wounds and observing his behavior) Standard Tactics: Asura
        most often starts a confrontation without looking for direct conflict, opting
        to try and talk his opponent out of committing whatever he considers to be
        bad deeds. Once he is attacked, Asura will quickly move on to trying to stab
        them with the Key to Hell by any means necessary, often taking grievous blows
        in the process. He can do this even while not having free use of either of
        his arms via using his mouth instead.'
      source_id: mediawiki-5083251
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'He is honest to a fault, even about his otherworldly deeds, as he sees
        everything he does as a good deed and refuses to do bad deeds regardless of
        how much danger he''s in. On top of this, he is extremely trusting of others,
        leaving himself open to attacks while he attempts to convince them to stop
        doing evil. He often overextends himself in pursuit of helping others, even
        when it pushes his body to its absolute limits. The Gate to Hell will only
        appear to take those who have committed evil, Demonic Summoning: After the
        Key to Hell is stabbed into someone''s head and twisted, a demon will come
        through a Gate to Hell to drag that person through it and to the fiery depths.
        If the area the key is used in is too confined to hold the gate, it can manifest
        elsewhere, such as on a ceiling. The demons that appear out of it come in
        a wide variety., Oni: A hulking demon that grabs victims, putting them in
        a vice grip and dragging them through the Gate to Hell., Eyeball Demon: A
        giant demon head possessing many eyeballs, which can fly out of its eyeholes
        and sprout hands to surround and grab a target., Unicorn: A bulky creature
        resembling a unicornAsura''s Verdict Chapter 6 that bites its victims to pull
        them through the Gate to Hell while grinding them with its teeth., Mirror
        Monster: Two arms holding a mirror that releases a monster able to take the
        shape of its victim before revealing its true form and squeezing them with
        enough force to crack bone before pulling them into Hell., Shriveled Demon:
        A shriveled up demon with fingers that sap its victims of their life force,
        becoming bulkier in the process while leaving them deathly thin and lanky
        as they go through the Gate to Hell., Giant Serpent: A giant serpentAsura''s
        Verdict Chapter 38 that coils a victim with its tongue'
      source_id: mediawiki-5083251
      provider_id: vsbattles
      authority: high
      confidence: 0.75
