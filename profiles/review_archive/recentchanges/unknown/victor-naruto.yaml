- id: claim-powers-and-abilities-86d85086
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Stealth Mastery,
    Weapon Mastery, Acrobatics, Chakra Manipulation, Statistics Amplification (Shinobi
    are capable of enhancing their physical capabilities with the use of chakra. The
    Shunshin no Jutsu allows Shinobi to greatly enhance their speed by focusing chakra
    in their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface
    Scaling and Water Walking (By focusing chakra at the soles of their feet, Shinobi
    can scale and cling to vertical surfaces, and even walk on waterNaruto Chapter
    18Naruto Chapter 90), Minor Illusion Creation and Duplication (With the Clone
    TechniqueRin no Sho, Page 220, Shinobi can create illusionary duplicates of themselves
    that have no physical substance), Shapeshifting (With the Transformation Technique,
    Shinobi can transform themselves into other people, animals, plants, and even
    inanimate objects, such as weapons), Paralysis Inducement (With the Temporary
    Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely paralyze their
    targets from close to mid range), Cyborgization (Partial. Like with all other
    members of Kara, Victor's body had been modified with Scientific Ninja Tools by
    Amado), Illusion Creation (Can create illusory images of himself to communicate
    over a long distance with Genjutsu Communication), Body Control (Can manifest
    two giant extra arms that are capable of using hand seals to perform jutsu. Can
    manipulate the movements of his limbs even after they have been severed), Immortality
    (Type 3), Regeneration (High-Mid to Mid-High. Can regenerate his limbs and his
    head. Survived the total incineration of the upper part of the God Tree while
    he was inside it, though he was left in critical condition), Air Manipulation,
    Electricity Manipulation, Weather Manipulation (Can control storm clouds to produce
    lightning bolts), Earth Manipulation, Fire Manipulation, Water Manipulation, Blood
    Manipulation (Can manipulate his blood and use it as tendrils to retrieve lost
    limbs and reattach them), Curse Manipulation and Longevity (He put a cursed seal
    on himself, which extends his life), Hacking (With his holographic computer, he
    can manipulate a small drone designed for spying and hacking into other computers.
    He can also track moving targets and survey entire landscapes)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
