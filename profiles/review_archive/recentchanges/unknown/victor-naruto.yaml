      value: Genius. A talented businessman and scientist, he was able to create his
        own successful company with revolutionary new technology. His knowledge of
        science could even stabilise the famous cells of Hashirama Senju for his own
        experiments, creating an artificial God Tree. Victor also proved himself to
        be very sneaky and manipulative, convincing an entire country into believing
        he was a honourable and selfless man, all the while continuing his immoral
        experiments.
