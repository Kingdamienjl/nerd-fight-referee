- id: claim-standard-equipment-00b3f778
  section: equipment
  axis: equipment
  text: '*NinjaNomicon: A semi-sentient book containing all of the knowledge Randy
    needs to be the Ninja, including usage of techniques and the experiences of past
    Ninjas. It usually only opens to the Ninja and it will often advise Randy to try
    to help him. *Ninja Scarf: The Ninja Scarf is similar to a grappling hook in which
    the Ninja can swing from one place to another or grab his opponent. *Ninja Sword(s):
    A sword that the Ninja can use. The sword can also be dual weld, using two swords
    at once. This is Randy''s most used and, according to S. Ward Smith, the Ninja''s
    swordsmith, most powerful weapon if used properly. *Chain Sickle: A long chain
    with a sickle on the end. Randy often uses this weapon to kill multiple opponents
    at once or to strike large enemies safely from afar. *Ninja Balls: Balls with
    many uses including, smoke bombs, mini grenades, hot balls, freezing balls, tripping
    balls and bees. *Ninja Rings: A variation of the throwing weapons shuriken (also
    often called "Ninja Stars") that are shaped like discs. *Sais: Handheld, triple
    bladed weapons that resemble small tridents. *Nunchaku: Two short sticks (can
    be made of wood, metal or other materials) connected by a string or chain. Originated
    as an Okinawan farming tool, but has since been often utilized as a lethal weapon.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-6c1707d1
  section: power_scale
  axis: battle_iq
  text: Average normally (Isn't the most competent student, but is good at math),
    Above Average in combat (Possesses notable combat knowledge, using both his martial
    arts, weaponry, and techniques in combination with his surroundings to get the
    best of his opponents. Randy is capable of formulating successful plans by simply
    glancing at his environment and opponents)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-4c3eebc5
  section: weaknesses
  axis: weakness
  text: 'Overconfident. Easily distracted. Has a fear of chickens. If he abuses his
    ninja power, he''ll lose it. The Ninja Sword can''t cut through stupid. If his
    Ninja Mask is removed his suit will be removed as well. However, a portion of
    his powers remain. Notable Attacks/Techniques: *Ninja Air Fist: Creates a powerful
    blast of air, strong enough to pierce metal *Ninja Rage: In this mode, Randy is
    able to create fire-based attacks **Ninja Tengu Fireball: Fires a large destructive
    fireball from his hands, possibly exploding on impact *Earth'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-e19cb811
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Weapon Mastery (Skilled with a variety
    of weapons such as swords, chain knife sickles, blade discs, nightsticks, and
    more), Martial Arts, Acrobatics (Can perform feats of agility even without transforming),
    Transformation and Statistics Amplification (By putting on the ninja mask, he
    transforms into the Ninja, increasing his physical abilities), Breaking the Fourth
    Wall Enhanced Senses (Can see while blindfolded by using his sense of smell and
    dodged falling debris, gain super senses and learned to control them), Pressure
    Points (By hitting people on specific spots on their stomach, he can force them
    to throw up), Surface Scaling (Can run on walls and ceilings using spikes hidden
    with his suit), Stealth Mastery (Capable of sneaking into crowded areas without
    anyone seeing him), Invisibility (Can camouflage himself), Smoke Manipulation
    (Smoke bombs), Dimensional Storage (All of his weapons are within his suit), Elasticity
    (His scarf can stretch great lengths), Hair Manipulation (Can grow and manipulate
    his own hair), Light Manipulation (Flash bombs and Glow balls), Water Manipulation
    (Hydro Hand), Air Manipulation (Air Fist), Explosion Manipulation (Boom ball)
    Ice Manipulation (Cold ball), Electricity Manipulation (Electric ball), Earth
    Manipulation and Life Manipulation (Earth Attack allows him to manipulate the
    earth and create living sand creatures that can regenerate), Fire Manipulation
    and Heat Manipulation (His Hot ball can set objects on fire, he can also enter
    a mode that allows him to use the Tengu Fireball and emit extreme heat from his
    body), Insect Manipulation (Bee ball), Organic Manipulation (Slip ball), Sound
    Manipulation (Waterfall sound ball replicates the sound of a waterfall), Size
    Manipulation (Has a ball that expands in size), Healing and Resurrection (Art
    of Healing allows him to grow plant life faster, fix broken objects and even resurrect
    the dead) BFR (The book can pull the mind of whoever looks at it's pages into
    it, leaving their bodies unconscious. It can also pull an entire person into it
    if needed), Memory Manipulation (The book can erase the memories of other via
    the Ultimate Lesson), Power Bestowal (While inside the book, one can create weapons
    and armor, grow extra limbs, and gain super speed)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
