- id: claim-powers-and-abilities-971a330b
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Enhanced Senses (Smell; Tracked the
    children by their scent) *Limited Martial Arts (Freddie''s actor states that Buddy
    knows how to perform speed bag punches, showing some boxing skill"just Buddy things
    is my favorite game! you better get the answers right #buddy #ItsBuddy #game".
    Uploaded by @BuddytheUnicorn via YouTube, 9 Sep. 2026) *Immortality (Types 1,
    2 and 3; Buddy can indefinitely survive wounds that would be fatal, such as losing
    large chunks of flesh, though the destruction of his heart or brain are enough
    to kill him) *BFR (Buddy can pull people in through TV screens to replace characters.
    Rolling the credits also sends everyone back to Happy Town) *Extrasensory Perception,
    Fourth Wall Awareness and Cosmic Awareness (Can perceive those on the other side
    of the screen to pull them in. When a parapsychologist performed a ritual to communicate
    with spirits, Buddy heard it and responded. Buddy has a TikTok and X account in
    real life to promote his film) *Transformation (Buddy starts every episode as
    a stuffed animal. When someone breaks the Buddy-centric narrative of the show,
    such as by singing the "I hate Buddy" song, Buddy will transform into his monstrous
    Dark Buddy form) *Berserk Mode (During his transformed state, Buddy is far more
    aggressive and implacable) *Bodily Weaponry (His horn can impale people. During
    his transformed state, he also gains large claws) *Social Influencing (Utilizes
    his friendly appearance to lure children in) *Extremely High Pain Tolerance (Was
    barely slowed down after having half of his body scorched to the fourth degree.
    Sawed large chunks off his thighs) *Teleportation (Shown here) *Duplication (Despite
    Buddy being badly injured, another healthy Buddy was able to pull in grace. Other
    Buddies are shown elsewhere in the film) *Longevity *Broadway Force (By singing
    the "I love Buddy" song while hugging a child, he can force the episode to end,
    rolling the credits and restoring his injuries and the environment. By singing
    about the relevant lesson of the episode, he can trigger videos to play) *Mind
    Manipulation (Those pulled into the world of Buddy lose their memories of their
    past life and take on a role such as a mailman or nurse. When someone is pulled
    in, those on the outside also lose all memory of the missing person) *Biological
    Manipulation (Oliver notes that he never had to use the bathroom while in the
    It''s Buddy! show. Children within the show don''t age) *Pocket Reality Manipulation
    (The world of It''s Buddy! isn''t just a separate, isolated area. It''s a realm
    with its own distinct rules and entities. Beside the mind wipe that comes with
    entering it, any show-creatures such as Strappie who exit into the Real World
    transform into inanimate objects) *Healing (Fatal; Healed from having half of
    his body burned to the bone by ending the episode) *Immersion *Data Manipulation
    and Information Manipulation (All records of those who are pulled into It''s Buddy!
    are wiped from existence along with the memories of anyone who might have memory
    of them) *Weather Manipulation (His transformation summoned a storm) *Technology
    Manipulation (Can turn TVs on in the real world to broadcast his show) *Magic
    and Reality Warping (Shown to summon magic shoes which could hold the wearer in
    place unless they danced. It''s implied he could summon other similar objects.
    During Grace''s kidnapping, it''s shown that reality warps beyond just information
    to wipe trace''s of his victims from existence with furniture being set back into
    place) *Perception Manipulation (When he pulled Grace through, her husband was
    unable to hear or see her struggle with Buddy), *Plot Manipulation *Biological
    Manipulation *Magic *Reality Warping (With his transformed state, the credits
    rolling reverts him only to his base form, not the stuffed doll, so he doesn''t
    need to be called to manifest)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
