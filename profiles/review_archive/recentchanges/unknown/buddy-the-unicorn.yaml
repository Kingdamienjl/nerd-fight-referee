- id: claim-weaknesses-7c89468c
  section: weaknesses
  axis: weakness
  text: 'At the start of an episode, Buddy needs to be summoned by someone saying
    "Oh, Buddy!" to fully manifest, though a stuffed doll version of him still maintains
    his presence, though the final "episode" where he reverts from his transformation
    shows that this isn''t always the case. Things that appear out of place - such
    as Josh''s bloody journal or the sight of Buddy committing violence - crack the
    illusion of the show. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
