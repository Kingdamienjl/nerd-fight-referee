        a special room for the kill. He covers everything in plastic, puts up pictures
        of the target''s victims, and might use candles for lighting. Once he captures
        the person, often using M99 tranquilizer, he takes them to this room to perform
        his ritual. Dexter really enjoys this ritual. First, he takes off the target''s
        clothes and ties them to a table with shrink wrap. If the person was tranquilized,
        Dexter waits for them to wake up. Then, using a scalpel, he collects a drop
        of blood from their cheek as a trophy. While doing this, he makes them confront
        the crimes they''ve committed. Dexter might share some personal details but
        makes himself out to be a monster. He usually uses one of his tools to kill,
        doing it while the person is still conscious. His method involves restraining,
        dominating, and intimidating the victim. Killing another killer satisfies
        Dexter''s urge, and he believes it saves lives. Finally, Dexter cuts up the
