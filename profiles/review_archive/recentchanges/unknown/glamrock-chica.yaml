  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-8357b592
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Self-Sustenance (Types 1, 2, and 3),
    Immortality (Type 2; Comparable to other Glamrock animatronics and can still function
    after having her body crushed by a trash compactor, along with a torned off voicebox),
    Inorganic Physiology (Type 2), Enhanced Senses (Shown to have a keen sense of
    smell to where she can detect anything that even remotely smells like pizza),
    Sound Manipulation (Her singing can cause S.T.A.F.F. Bots to malfunction and stun
    other animatronics. Can also deactivate electronic locks with a shout), Information
    Analysis (Like the Toy animatronics, she has a built-in facial recognition software
    designed to identify registered customers in the Pizzaplex), Resistance to: Extreme
    Heat/Cold (Comparable to Glamrock animatronics such as Glamrock Freddy, who withstands
    the temperature that can be as high to melt dense ice blocks or as cold to freeze
    metal, which fluctuation he refered as extreme), Electricity and Water Manipulation
    (Advanced animatronics aren''t affected by short-circuit caused by water and electrical
    charges, as they can submerge in a sewer and resist several electrocutions, even
    without their casings)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
