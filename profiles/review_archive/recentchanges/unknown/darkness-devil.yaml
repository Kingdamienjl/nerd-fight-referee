- id: claim-powers-and-abilities-bb4e870c
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *General Devil Physiology (Primal-Fear)
    **Enhanced Senses (Instantly became aware of the cast''s arrival in Hell and was
    watching them from afar.Chainsaw Man Chapter 64) **Dimensional Travel (Reached
    out of Hell to fulfill its contract with Santa Claus.) **Regeneration (At least
    High-Mid, likely at least Mid-High; Should possess incomparably more potent regeneration
    than Santa Claus using a tiny piece of its flesh, who could instantly reform from
    being blown to pieces.Chainsaw Man Chapter 67 Likely possesses regeneration on
    par with Falling Devil''s avatars.Chainsaw Man Chapter 122Chainsaw Man Chapter
    125Chainsaw Man Chapter 126Chainsaw Man Chapter 131) ***Enhanced Regeneration
    (Santa Claus'' regeneration became much faster once in darkness) **Additional
    Limbs & Natural Weaponry (Possesses 8 limbs, all of which can be transformed into
    scythe-like appendages that can cut cleanly through opponents.Chainsaw Man Chapter
    65) *Darkness Manipulation (Covered Hell in darkness.) **Shapeshifting (Can turn
    itself into darkness, and then manifest itself.) **Summoning (Can summon the Sword
    of Darkness.) *Biological Manipulation (Caused Aki and Angel to bleed profusely
    with a mere stare.Chainsaw Man Chapter 66 Being stabbed by the Sword of Darkness
    causes catastrophically violent hemorrhaging which causes anyone stabbed to bleed
    far more than they normally would.) *Durability Negation & Deconstruction (Can
    cause an individual''s body to fall apart without actually damaging them.) *Fear
    Manipulation & Madness Manipulation (Type 3; Merely watching them was enough to
    instill a sense of terror into the Fiends; Pingsti nearly lost her mind and began
    begging for permission to commit suicide.) *Teleportation & Attack Reflection
    (Transported the Stone Devil into its hands and reflected its petrification back
    onto the Devil and its contractor.) *Telekinesis (Telekinetically twisted Denji''s
    body and made Galgali spontaneously explode. Crushed and twisted Makima''s arm.)
    *Forcefield Creation (Constantly has a forcefield in place.)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
