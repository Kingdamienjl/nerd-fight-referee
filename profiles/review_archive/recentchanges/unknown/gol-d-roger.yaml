    \ best Armament users shown to date, able to imbue his sword with Haki with Ryuo.\
    \ Therefore, he's able to use the rest of the abilities that come with its use.\
    \ *Conqueror's Haki: During his clash with Whitebeard 28 years ago they created\
    \ a Conqueror's Clash that generated a massive air blast around the island they\
    \ were fighting in, proving that Roger's Haki was strong enough to compete with\
    \ Whitebeard's. Divine Departure: Roger charges with his Cutlass in his hand and\
    \ unleashes a horizontal Air slash at the opponent's stomach. center|330px |}"
