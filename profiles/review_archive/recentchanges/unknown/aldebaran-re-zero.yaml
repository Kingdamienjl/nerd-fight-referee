        way that suits him. Across 23,008 loops, Al learned to use the Steel Thread
        Technique at a viable level for him, despite the fact that only the most gifted
        of geniuses can even grasp the fundamentals, let alone master the techniqueArc
        9, Chapter 50, "Decisive Battle on the Ice"), Genius magician (Aldebaran's
        use of magic makes efficient use of his limited resources, allowing him to
        get the jump on genius magicians such as Sphinx. Despite his lack of talent,
        Al is capable of casting multiple spells at once, and even two spells of differing
        attributes, which is of such difficulty that it practically requires multiple
        brains to perform. Aldebaran's only magical affinity was for the Yin attribute,
        which his Teacher nurtured with hellish training until he developed definite
        mastery of Yin Magic.Arc 10, Chapter 6, "Instantaneous Water Heater" Al has
        been imparted the complete magical knowledge of the Witch of Greed, who is
        the one who trained him from his birth, although he can only truly put his
        vast knowledge into practice with a superior vessel, as he lacks the mana,
        Gate, or talent to use it)
      source_id: vsbattles-aldebaran-re-zero
