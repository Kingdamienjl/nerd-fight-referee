  intelligence:
    text: Gifted (Aldebaran is a person lacking in skill, making up for it with sheer
      ingenuity and determination. He has spent over a decade as a gladiator fighting
      for his life. Al can come up with tens of different ways to kill monstrous superhumans
      such as Hornet despite lacking strength or skill, and his Authority means he
      can always make those plans a reality. Through looping time 5,765 times, he
      manipulated the entire Emilia Camp into moving exactly as he wanted them to,
      all in order to isolate Subaru in the Pleiades Watchtower with only opponents
      who Al can deal with. Al's analytical ability allows him to, through his looping,
      completely grasp everything a person is capable of, how they respond to different
      approaches, and how to manipulate them in a way that suits him. Across 23,008
      loops, Al learned to use the Steel Thread Technique at a viable level for him,
      despite the fact that only the most gifted of geniuses can even grasp the fundamentals,
      let alone master the techniqueArc 9, Chapter 50, "Decisive Battle on the Ice"),
      Genius magician (Aldebaran's use of magic makes efficient use of his limited
      resources, allowing him to get the jump on genius magicians such as Sphinx.
      Despite his lack of talent, Al is capable of casting multiple spells at once,
      and even two spells of differing attributes, which is of such difficulty that
      it practically requires multiple brains to perform. Aldebaran's only magical
      affinity was for the Yin attribute, which his Teacher nurtured with hellish
