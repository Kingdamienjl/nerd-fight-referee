    Category:Manga Characters Category:Primary Protagonists Category:Protagonists
    Category:Sleep Users Category:Smoke Users Category:Teenagers Category:Thieves
    Category:Disguise Users Category:Hat Users Category:Cape Users Category:Marksmen
    Category:Weapon Masters Category:Weapon Users Category:Vehicular Masters Category:Vehicle
    Users Category:Drivers Category:Social Influencers Category:Stealth Masters Category:Photographic
    Memory Users Category:Body Control Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
