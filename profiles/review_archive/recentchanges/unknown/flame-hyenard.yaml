      showing an above-average level of combat ability even amongst Reploids. Known
      as the "Crazed Warrior Cloaked in Flames", Hyenard overwhelmed his foes by swarming
      his opponents with duplicates and feral, berserker-like lunges and fireball
      attacks. After his infection, he has been driven insane by the constant pain
      the Sigma Virus has caused him, and thus wildly attacks anyone who confronts
      him in a misguided attempt to end his suffering. Even still, he retains enough
      of his cognitive functions to control other machinery, which he uses to summon
      giant Mechaniloids to ride and bombard his foes with missiles while he sends
