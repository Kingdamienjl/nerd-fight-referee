power_scale:
  tier:
    text: 'Name: Yuri Boyka, the Most Complete Fighter in the World,Undisputed II:
      Last Man Standing (2006) King of Prison Fighters,Undisputed III: Redemption
      (2010) Anton Lagunov (fake passportBoyka: Undisputed (2016)) Origin: Undisputed
      Film Series Gender: Male Age: Unknown Classification: Human, Fighter'
    source_ids: &id002
    - mediawiki-206046
    confidence: 0.95
  attack_potency:
    text: Street level+ (Easily overpowered the US's heavyweight boxing champion,
      George "Iceman" Chambers. Was even able to harm Iceman when he had grown considerably
      stronger and gained durability comparable to Boyka's own. He shattered Dolor's
      shin with a knee strike. He unintentionally killed Viktor Gregov in the ring,
      and he has defeated Koshmar, who is an insane 320lbs fighting champion that
      most of his opponents fear)
    source_ids:
    - vsbattles-yuri-boyka-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Peak Human with Superhuman combat speed and reactions (Can keep up with
      some of the best fighters on the planet, and thus should be comparable to most
      peak-level boxers, who can throw punches at 15 m/s. Disarmed trained firearms
      users before they could shoot him)
    source_ids:
    - vsbattles-yuri-boyka-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class 1 (Boyka slammed Arkady Daviic, who weighs 229 pounds [104KG].
      He had to carry around large rocks as prison punishment. Could lift heavy weights
      with his leg even after it was broken. Can effortlessly snap necks, which requires
      over 1,250 lbs of force. He broke Koshmar's arm and Zourab's neck)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Street level+ (Snapped a makiwara, a tool Peak Human martial artists use
      to condition their hands, with a punch. Destroyed a man's neck with a single
      punch, which would require this much energy. Broke a barbell, a bench and table
      legs. Can easily break bones without much effort)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Street level+ (Casually takes several punches, kicks, and elbows right to
      the head without flinching during fights from comparably strong opponents. Direct
      punches in the face from the heavyweight boxing champion of the world don't
      faze him. Survived a beating by multiple athletic thugs with baseball bats and
      even withstood multiple gunshots. Despite having a career ending broken knee,
      he willed himself throughout intense therapy just to be able to fight again.)
    source_ids:
    - vsbattles-yuri-boyka-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Peak Human (Constantly fights, jumps and flips around the ring without showing
      any sign of fatigue. After being forced to do hard labor, he still trained,
      whereas Turbo said he could barely walk. In one week, he defeated Boris Tarsov,
      the Ozerov brothers, and on the final night he defeated Igor Kazmir and Koshmar
      consecutively)
    source_ids:
    - vsbattles-yuri-boyka-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range
    source_ids:
    - vsbattles-yuri-boyka-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Above Average, Gifted in Combat (Extremely knowledgeable and Competent\
      \ in various forms of martial arts. Despite his weakened knee, in various fights\
      \ he\u2019s managed to adjust his fighting style very quickly and purposefully\
      \ leave his injured knee open to bait his opponents. He also knows how to play\
      \ chess and very knowledgeable about fighting to where he considers it a \u201C\
      science\u201D to him."
    source_ids:
    - vsbattles-yuri-boyka-unknown
    confidence: 0.6
    notes: auto_repair source extraction
