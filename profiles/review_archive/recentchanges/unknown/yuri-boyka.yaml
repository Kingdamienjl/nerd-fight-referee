        large number of techniques with real-life martial arts such as Shotokan Karate
        but is taken to superhuman levels with techniques that allow the user to leap
        further than would be possible. One of Kyokugenryu Karate''s main advantages
        is the implementation of the usage of chi as a way to enhance the damage that
        techniques deal or to launch as damaging projectiles. The style is very flexible
        with each master of Kyokugenryu Karate having different specialities, Chi
        Projection: Yuri has mastered the usage of Chi or her natural life force.
        Yuri can use her Chi as a weapon, firing out balls of energy to harm her opponent,
        she can either launch a small ball of chi or one the size of Yuri''s body.
        Yuri can also use her Chi to enhance her physical strikes. ::, MAX Mode: MAX
        Mode is a power-up all fighters can access. In exchange for their Super Meter
        depleting quickly over time, the fighter gets enhanced strength and durability
        for a limited amount of time as well as access to enhanced versions of their
        strongest techniques and the ability to use their strongest technique. Once
        their Super Meter is empty, Extra Mode: Extra Mode is an advanced version
        of MAX Mode where after it runs out, all of the advantages gained from using
        MAX Mode are kept for the rest of the fight. ::, Armour Mode: Armour Mode
        is a power-up all fighters can access. In exchange for their Super Metre depleting
        quickly over time, the fighter gets greatly enhanced durability. Once their
        Super Meter is empty, Counter Mode: Counter Mode is a power-up all fighters
        can access. In exchange for their Super Meter depleting quickly over time,
        the fighter gets enhanced strength as well as the ability to use Guard Cancels
        and Guard Escapes as much as they want. Once their Super Meter is empty, Critical
        Counter Mode: Critical Counter Mode is a power-up all fighters can access.
        When a fighter has filled out their Critical Counter gauge and lands a counter
        with a heavy attack, they will enter Critical Counter Mode. In Critical Counter
        Mode, the fighter is able to string together attacks and techniques better
        making them a better fighter, when Critical Counter Mode is nearly over, the
        fighter can choose to end it with an enhanced version of their strongest move.
        Once the Critical Counter gauge is empty, Hyperdrive Mode: Hyperdrive Mode
        is a power-up all fighters can access. In exchange for their Super Meter depleting
        quickly over time, the fighter gets the ability to cancel every one of their
        moves and techniques, allowing them to combo all of their moves and techniques
        together better. Once their Super Meter is empty, Silent Nage, Oni Harite:
