- id: claim-weaknesses-b557e07d
  section: weaknesses
  axis: weakness
  text: 'Kid''s obsession with perfect symmetry can hinder his concentration in battle.
    {| class="wikitable mw-collapsible mw-collapsed" !Notable Attacks/Techniques:
    |- | Soul Perception: A technique used by Weapon Meisters, grants the user to
    see into other''s souls. Grim Reaper physiology: As a Grim Reaper, Kid is naturally
    stronger and more resilient that a human. He is unaffected by most weather conditions
    like the sun''s UV Rays, immune to natural poisons as seen in his attempts to
    dye his hair to remove the Sanzu Lines'' visibility. It can be assumed there are
    many more benefits, those of which that are unknown. *Konso: This ability allows
    Kid to store souls and hold them for later use. Kid was in the process of using
    this technique to store a number of souls The Flying Dutchman had captured but
    did not actually get the chance to use it. *Madness of Order: Kid possesses his
    father''s Madness Wavelength, which is the polar opposite of Asura''s own madness
    wavelength. This could be potentially used subjugate all life and purge it of
    freewill if abused. When Kid learns to tap into his madness, it increases his
    stats while altering his appearance. He has a long sleeved black shirt, which
    is adorned by the presence of three horizontal white stripes equally distributed
    along the entirety of the tops length, and accompanied by a simple ruffled cravat
    worn around the neck. Normal Techniques & Stances *Death God Martial Art - Stance
    of "Crime": This fighting style is Kid''s normal style but without using Liz and
    Patti and therefore focuses on chops, kicks, and hammer blows (all of which can
    be symmetrical). He also adopts the stance before fighting Crona and Ragnarok.
    *Death God Martial Art - Stance of "Punishment": This fighting style is more defensive
    than the Stance of "Crime'', allowing Kid to use his father''s skull shields to
    block attacks, which he calls Death Arm Blocking. He uses Patti and Liz with this
    style. *Death Ride: Not really an attack, as it is Kid doing a rail slide with
    his skateboard. *Tornado Flip: Kid launches his skateboard, spinning, at an opponent,
    possibly cutting them in half. Not much is known as it was only used to save Patti
    and Liz once when they were being constricted by the Pharaoh of Wrath. *Sanzu
    River Shot: Kid shoots out a quick stream of bullets from each of his partners,
    with both Weapons aimed symmetrically. *Skull Shield: An enormous shield that
    takes the form of a skull resembling Shinigami''s own mask. It is easily large
    enough to cover an entire body and is primarily used to defend against attacks,
    especially those that could result in significant damage. *Soul Perception: A
    technique used by humans in the Soul Eater universe. While practically any Meister,
    Weapon and in some cases normal humans can see the souls of the deceased, this
    unique ability allows a person to perceive the souls of living people, and is
    much more of a rare skill. Sanzu Line Techniques *Sanzu Lines: A trait common
    in the Grim Reaper and those spawned from him, Kid''s being in the form of three
    lines. Recognized a Lord Death''s heir, Kid power increases with each line connected
    while empowering any weapon he uses at the time: causing the Thompson sisters''
    weapon forms to resemble Israeli-made Desert Eagles. But this weakens Lord Death,
    eventually killing him once all three are connected. **Sanzu Fall Shot: A technique
    used while the first Sanzu Line is connected using the power of BREW. Kid brings
    his arms up while firing and brings them down until he splits them, his arms parallel
    with the ground. The stream that is fired down can be used to strike multiple
    targets at once (including himself). **Shadow Skull Arms: After connecting the
    first Sanzu Line, Kid is able to produce black skull-like arms out of his body,
    although they seem to be slightly smaller than his father''s version. Unlike his
    father, Kid used the arms for a supportive purpose rather than for offense, using
    one of them to reattach his arm, that got severed in his fight with Mosquito.
    Soul Resonance Techniques *Soul Resonance: A special technique used by a Meister
    and Weapon group, in which they synchronize their souls'' wavelengths to increase
    the Meister''s power to use highly powerful techniques unique to them. **Death
    Cannon: Kid''s Soul Resonance attack. When activated, Kid''s lower arms are covered
    with metal and resemble cannon barrels. Three black spikes come out of each of
    the upper arms. He then charges his attack and fires two giant blasts of energy
    from the cannons that impact with the opponent, leaving behind a series of skull
    shaped smoke. **Parent''s Seven Rays: One of Death the Kid''s most powerful moves,
    that can only be utilized through the prior connection of two of the Lines of
    Sanzu that are displayed within his hair. It is performed by conducting a Soul
    Resonance with Liz and Patti. Like most of Kid''s powerful moves, the attack has
    a number of stages to go through before its completion. It first begins with Kid
    performing Soul Resona'
  source_ids: *id003
  decisive: false
