- id: claim-weaknesses-d2032421
  section: weaknesses
  axis: weakness
  text: "Has a death wish to be slain by the Omega, ie Gaoh Ryuki. The Eye of the\
    \ Sky uses rule-of-thumb to predict movements and attacks, and can therefore be\
    \ overcome with enough speed and unpredictability. B\xF6kh has no ground-based\
    \ attacks, preventing Naidan from properly dealing with a downed opponent. Notable\
    \ Attacks/Techniques: Eye of the Sky: A technique that allows Naidan to consciously\
    \ enter the flow state, which, when applied to martial arts, will enable him to\
    \ survey the situation akin to an aerial perspective. With this ability, he can\
    \ observe, predict and counter opponents that are faster than him. However, this\
    \ technique is not infallible. It is a predictive technique in nature, similar\
    \ to \"Foresight,\" and depends entirely on Naidan's concentration, deductive\
    \ ability, and physical capability to act on these predictions. As explained by\
    \ Lolong Donaire, this technique uses rule-of-thumb to predict movements and attacks.\
    \ Therefore, someone of high enough speed and unpredictability, such as Ryuki,\
    \ can surpass it. Kh\xFCch: The culmination of Naidan's three years of physical\
    \ conditioning. In practice, it can manipulate and dominate his opponent's flow\
    \ of energy, dispersing their power and rendering them unable to attack, such\
    \ as by grabbing the opponent's hips, making rotating into punches impossible.\
    \ A type of \"hard redirection,\" this technique is similar, yet fundamentally\
    \ different from the Niko Style's Redirection Kata and the Mudo Family's Hau.\
    \ ==Notable Matchups== Victories: Losses: Inconclusive: ==Notes/Explanations==\
    \ Category:Kenganverse Category:Martial Artists Category:Perception Users Category:Energy\
    \ Users Category:Antagonists Category:Villains Category:Characters"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
