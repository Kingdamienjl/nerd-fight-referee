      value: Varies Immensely from Wall Level (Can survive falls from the clouds unscathed)
        to Oterverse Level (Survived the destructive power of The Void, only getting
        briefly knocked unconscious and getting right back up a few moments later
        as if nothing even happened, and in fact would continue to live after the
        Void's destruction of all of existence), Varies from Higher to Far Higher
        with Statistics Amplification, Forcefield Creation, Damage Reduction, and
        various power-ups, equippable gear, and consumable items (Power-ups allow
        Mario to take an extra hit of damage. Has items and techniques to reduce damage
        from attacks), Lower with the Mini Mushroom and certain items and gear (Certain
        equippable gear lowers Mario's Defense power. The Mini Mushroom weakens Mario
        to the point that he's defeated in 1 hit from basic enemies), up to High Outerverse
