    - field: weaknesses
      value: 'Most of his power-ups either have a time limit or can be removed from
        an attack, Jump: Mario''s most common maneuver and primary form of attack.
        Mario jumps into the air to attack enemies and avoid obstacles and attacks.
        If Mario jumps under something like a Brick or a floor, he can punch it to
        smash it or bend or dislodge individual segments, either instantly defeating
        any enemy standing on top, or stunning them and causing them to fall to the
        floor, allowing Mario to run into or kick them in order to defeat them., Stomp:
        After jumping into the air, Mario lands and stomps on the enemy''s head to
        deal damage. Mario does not necessarily have to jump, a stomp can be performed
        any time he is falling., Spin Strike: An enhanced version of a stomp that
        allows Mario to stomp on that enemy without having to land on them, then jump
        while spinning with his arms tucked in. If this jump reaches the maximum height,
        then Mario ends that jump with a split. If not, then the spin continues as
        Mario descends but ends quickly., Crouching High Jump: Mario crouches to charge
        up power before jumping, allowing him to jump higher into the air and reach
        places he normally cannot. Mario does not necessarily have to remain ducking,
        he can keep the charge until he actually jumps, though it resets if he moves
        before jumping., Spin Jump: Mario spins while jumping. Most of the time, this
        technique reaches a different height from the standard jump, and attacks that
        would otherwise be harmful to land on., Drill Spin: After Spin Jumping high
        and slowly falling back down, Mario spins faster and propels himself downward
        very quickly while restricting horizontal movement. Like a Ground Pound, the
        Drill Spin can break multiple Brick Blocks in a row and defeat enemies. It
        often has slight mechanical differences from a Ground Pound, such as starting
        instantly compared to starting with a flip, and putting less restrictions
        on movement compared to a Ground Pound., Spinning Ground Pound: Mario Drill
        Spins and slams into the ground with the force of a Ground Pound., Spinning
        Ground Pound Jump: Mario jumps up immediately after performing a Spinning
        Ground Pound, spinning once in the air and gaining a jump height boost., Handstand
        Jump: Whie doing a Handstand, Mario jumps off the ground with his hands and
        does a flip in the air. This technique allows him to jump higher than a standard
        Jump would, allowing him to reach higher places., Handstand Double Jump: After
        performing a Handstand Jump, Mario humps again immediately upon landing, flipping
        high in the air a 2nd time and allowing him to reach even higher places.,
        Backward Somersault: An advanced type of jump where Mario jumps in the opposite
        direction that he''s moving, causing him to perform a backflip that reaches
        high into the air. This technique allows Mario to quickly reach higher platforms.
        They reach higher than Handstand Jumps, but come at the disadvantage of having
        to be in movement to execute them, so they cannot be performed on small platforms
        easily., Double Jump: Mario jumps immediately after landing from a prior jump,
        allowing him to gain a higher altitude than a Standard Jump would., Triple
        Jump: A special move where Mario jumps 3 times in a row while moving, front-flipping
        during the 3rd jump. The 3rd jump allows Mario to gain even higher altitude
        than the Double Jump would., Side Somersault: A high jump similar to the Backward
        Somersault that is performed in a similar manner, except this time Mario does
        a cartwheel in the air when he jumps. It typically grants a small amount of
        more height than the Backwards Somersault., Long Jump: Mario crouches while
        in motion and jumps, causing him to jump a long horizontal distance. The move
        is primarily used to clear huge gaps between platforms and move faster., Ground
        Pound: Mario jumps into the air before flipping midair, dropping down quickly,
        often to apply more force than an average stomp but with less mobility. This
        can have multiple effects, primarily either to attack or to break or activate
        blocks and other objects from above., Homing Ground Pound: Mario Ground Pounds
        quickly after a Spin in midair, causing him to come crashing down directly
        on a nearby enemy or object without needing to aim 1st., Ground Pound Jump:
        Mario jumps up immediately after slamming onto the ground with a Ground Pound,
        allowing him to jump higher than with a normal Jump., Wall Jump: A special
        move where Mario jumps towards a wall and jumps again upon colliding with
        the wall. If that is done in narrow passages, Mario can jump between the walls
        to ascend to a higher platform or over an obstacle., Super Jump: Mario jumps
        on 1 enemy up to 100 consecutive times.'
      source_id: character-stats-profiles-bonetail
