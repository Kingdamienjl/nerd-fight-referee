        \ caused a tremor that shook Castle Bleck, again, just like the Void did),\
        \ but also created Dimension D, a dimension that remained unaffected by the\
        \ Void when it began to consume all other dimensions. The Void was going to\
        \ consume all existence--all worlds, all dimensions, all possibilities and\
        \ all timelines, basically destroying the entire Marioverse. Plato's book\
        \ \"The Republic\" exists in Mario, and is referred to as \"the truth\" by\
        \ Aristotle, who in real life was the only person to object to Plato's Theory\
        \ of Forms introduced in The Republic. There are analogies that bear resemblances\
        \ to those in said book, and likewise, the game says that it explains the\
        \ world, the universe and all things, and answers countless questions. If\
        \ The Republic is actually legitimate in Mario, it would mean the Intelligible\
        \ World with all Universal concepts exists, and thus aspatial and atemporal\
        \ Forms also exist, and thus The Void would erase them all too. Defeated various\
        \ enemies that were powered by a Grand Star, including Bowser himself, which\
        \ is an item capable of powering Bowser's Galaxy Reactor, which, when removed,\
        \ caused the reactor to become unstable, resulting in it creating a supermassive\
        \ black hole that threatened to collapse the very fabric of the universe.\
        \ This includes the Matter Splatter Galaxy, which is referred to as a superspace\
        \ in the original Japanese version of the game (Raw: \u3061\u3087\u3046\u304F\
        \u3046\u304B\u3093 \u3057\u3081 \u307F\u3061. Translation: Super-space Shime\
        \ Shime). Superspaces contain the concept of space-time, meaning the Grand\
        \ Star has the potential to destroy such concepts. Defeated several foes that\
        \ were empowered by the Power Stars. Power Stars are one of the things that\
        \ the Llumas can transform into, with the Llumas also being able to transform\
        \ into entire galaxies, which would include the Matter Splatter Galaxy. Comparable\
        \ to post-Forces Sonic the Hedgehog, having canonically fought each other\
        \ in a Karate match. Sonic managed to hold his own against and even daze Infinite,\
        \ and managed to defeat him with aid. Infinite has been confirmed by SEGA\
        \ themselves to be the strongest villain that Sonic has faced yet, making\
        \ him stronger than even Solaris, who was stated to be a Super-dimensional\
        \ lifeform. Super-Dimensional is the translation of the term \u8D85\u6B21\u5143\
        \ or ch\u014D jigen, which means \"beyond higher dimensions,\" meaning Solaris\
        \ would be transcendent above such dimensions. Additionally, Solaris is described\
        \ as having the power to make the very meaning of time disappear, which would\
        \ require destroying the concept of time), Varies from Higher to Far Higher\
        \ with Statistics Amplification, Damage Boost, and various power-ups, equippable\
        \ gear, and consumable items (Several power-ups and certain techniques allow\
        \ Mario to instantly defeat or destroy enemies or objects that he takes more\
        \ than 1 hit to defeat or can't fully destroy. The Stars are able to increase\
        \ Mario's strength by a factor of 10 for each one he has. Several of Mario's\
        \ equippable gear and items are able to boost his attack power and/or damage\
        \ output), Lower with the Mini Mushroom and certain items and gear (Certain\
        \ equippable gear decreases Mario's attack power. The Mini Mushroom lowers\
        \ Mario's power, making it so that he needs a Ground Pound to defeat enemies\
        \ a normal jump could take out, and rendering him unable to defeat larger\
        \ enemies a Ground Pound would otherwise take out), up to High Outerverse\
        \ Level with certain power-ups (Certain power-ups like the Super Star or Mega\
        \ Mushroom allow Mario to 1-shot foes like Bowser Jr. and the Koopalings,\
        \ who are consistently shown as being able to fight on par with him, and even\
        \ foes like Bowser, who is consistently portrayed as being physically superior\
        \ to him. With the Rainbow Star, Mario was able to 1-shot a Gold Chomp that\
        \ was empowered by a Power Star), up to Extraverse Level with his most powerful\
        \ equipment (Can stack invincibility power-ups like the Super Star on top\
        \ of others like the Mega Mushroom or the Invincibility Leaf for even more\
        \ power. The Special Egg gives Mario the effects of the Super Star and the\
        \ Mega Mushroom combined, making it more powerful than both of them. The Giga\
        \ Bell allowed Mario to fight and defeat Fury Bowser, a form of Bowser that\
        \ was so powerful, that not even Mario amped by a Super Star or a Mega Mushroom\
        \ could even damage him). Can negate Durability with several of his abilities\
        \ and equipment"
