      value: 'Likely Above Average (Despite lacking the battle experience of the original
        Kazumi, Kazumi has shown to be quite battle capable against experienced magical
        girls, even manipulating the Saints at one point. By The Cuddling Despairs,
        she defeats several witched-out clones of Kazusa who still maintained the
        original''s memories) Feats: * Despite being an amnesiac for the majority
        of her series, she''s shown herself to be a competent fighter several times:
        ** Defeated Souju alongside Nico through coordinated attacks. ** Fought off
        the Pleiades Saints in a mock-witch form; it''s later revealed she was trying
        to get killed by the Saints the entier time. ** Defeated a Uwasa-clone of
        herself during Another Daze, whom managed to completely tank the attacks of
        Umika Misaki and Karou Maki, alongside Kamihama girls. ** Defeated several
        of Kazusa Michiru''s failed witched-out clones during The Cuddling Despairs
        event, each one having Kazusa''s experience but Kazusa''s vast array of abilities.'
