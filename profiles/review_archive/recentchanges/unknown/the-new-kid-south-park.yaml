- id: claim-powers-and-abilities-5fcf9e21
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Preparation, Martial Arts, Acrobatics\
    \ (Can use their farts to launch themselves and perform acrobatic feats in a technique\
    \ called \"Fartkour\", requires help from The Human Kite), Underwater Breathing\
    \ (Type 2; Can hold their breath for a very long time as seen in \"From Dusk till\
    \ Casa Bonita\"), Information Analysis (Inspection Mode lets them scan their environment\
    \ and view the current status effects and conditions of their enemies and allies\
    \ along with their weaknesses and immunities), Magic, Weapon Mastery, Social Influencing\
    \ (Can quickly befriend others and gain followers at a superhuman pace), Regeneration\
    \ (Low; can heal themselves via snacks), Hammerspace, Limited Hacking, Stealth\
    \ Mastery (Snuck past government agents and infiltrated the place they had disguised\
    \ as a new Taco Bell), A degree of Mind Manipulation, Psuedo-Cyborgization, Fragrance\
    \ Manipulation, Elemental Manipulation (Via weapons and by themselves), Poison\
    \ Manipulation, Energy Manipulation and Projection, Empowerment (Deals more damage\
    \ the lower his health is, and through various abilities.), Summoning (Via the\
    \ Plagues of Egypt, and through items), Breath Attack (Can breathe fire), Can\
    \ negate healing and regeneration, and skip the enemies turn, Power Bestowal (Can\
    \ grant temporary buffs to their allies such as regeneration), Statistics Amplification,\
    \ Status Effect Inducement, Healing (By farting on peoples balls, and through\
    \ items/abilities), Resurrection (With items they can revive their fallen allies,\
    \ their bodies need to remain intact for this to work which is why he cannot revive\
    \ Kenny McCormick whose body is destroyed when he dies), Electricity Manipulation,\
    \ Invisibility (Can temporarily turn invisible during a battle), Limited Teleportation\
    \ (Via anal probe device, they can dematerialize themselves and an ally and rematerialize\
    \ a short distance away allowing them to bypass obstacles, requires a satellite\
    \ dish to be nearby to do this), Explosion Manipulation (with Shadow Swap/Hammer\
    \ Bomb), Forcefield Creation, Heat Manipulation, Plant Manipulation, Empathic\
    \ Manipulation (One of his plant abilities allows him to temporarily charm an\
    \ opponent, making them fight for the New Kid and attack their own allies. This\
    \ wears off after two turns and it will be cancelled early if the affected opponent\
    \ is attacked. Works regardless of an opponents gender or sexual orientation),\
    \ Weapon Creation (Created a massive golden Warhammer and a scythe out of thin\
    \ air), Magnetism Manipulation (which somehow works on organic entities), Size\
    \ Manipulation (Because of an item granted by the Underpants Gnomes, the New Kid\
    \ can shrink themselves down to enter certain areas), Necromancy and minor Soul\
    \ Manipulation, Time Farts (Time Stop, Time Travel, Time BFR, Rewinding and Speeding\
    \ up time, and Summoning his Past Self), Resistance to Corruption (Type 1; Can\
    \ resist being turned into a Nazi Zombie or Vampire.), Acausality (Type 1; Remains\
    \ unaffected by changes to their own past, as they can interact with their past\
    \ self through time travel and later alter events surrounding their own origin\
    \ without being erased or otherwise affected by the changes, retaining their memories\
    \ and powers afterward. The TimeFart Summon further supports this, as its description\
    \ states that New Kid opens a portal into the fabric of their \u201Cpersonal timeline\u201D\
    \ and summons \u201Cyour past self\u201D to fight alongside them. This establishes\
    \ that the summoned New Kid is specifically their past self from their own timeline,\
    \ rather than simply an alternate version of New Kid), Curse Manipulation, Statistics\
    \ Reduction (Dire Shroud can curse an enemy with Defense Down), Transformation,\
    \ Possibly Abstract Existence (Type 2; The New Kid literally transforms into Death(At\
    \ 2:45))"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
