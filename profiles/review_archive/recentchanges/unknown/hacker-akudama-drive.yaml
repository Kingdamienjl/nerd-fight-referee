    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least Wall level, possibly at most Small Town level (Despite being weaker,
      Hacker has been shown surviving a lot of the same things as the other Akudama,
      such as missiles from police tanks154.3 Kilojoules and a flying bus collision
      into a large hotel complex without a scratch. Hacker was able to easily get
      up from falling a considerably high distance after Brawler destroyed the ceiling
      of the room by throwing Doctor into it. Despite this, he knows when his life
      is in danger and will swiftly leave against any force that could kill him such
      as the Execution Division Master. Hacker could likely be comparable to Swindler,
      who survived three particle cannons capable of destroying the Shinkansen with
      only a limb injured each.~5422.83 Tons of TNT (1807.62*3) Despite this, characters
      within the series are seemingly more vulnerable to piercing attacks, such as
      from knives or swords, than blunt-force or concussive attacks), Unknown as data
      (Due to no longer having a physical body. While hacking into it, Hacker was
      able to withstand the majority of Kanto's security system, while still being
      intact enough to shut it off with the help of Brother and Sister's siblings)
    source_ids:
    - vsbattles-hacker-akudama-drive-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Unknown (Hacker is capable of rapid, constant hacking throughout his escapades
      as an Akudama, though his physical stamina is seemingly not as great where he
      uses his drones for movement), at least Superhuman as data (Hacker's body is
      no longer physical and would not conventionally have the stamina required of
      a human. While hacking into Kanto, he was capable of keeping up with and withstanding
      Kanto's security, even while a significant portion of his body had been destroyed.
      It is revealed that Hacker had also remained alive enough to help assist with
      Swindler's final plan by hacking into every personal device in Kansai, despite
      being heavily damaged and on the verge of complete destruction after facing
      against Kanto's security protocolsAkudama Drive Comicalize - Chapter 57)
    source_ids:
    - vsbattles-hacker-akudama-drive-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, at least Tens of Kilometers with Drones (Hacker is
      capable of remotely controlling his drones, such as the one he left with Swindler,
      even while he had been converted into data by the Decontamination Zone), Varies
      with Hacking (Hacker's reach extends to the presence of radio waves, and has
      been shown capable of accessing various different systems all across Kansai
      and within Kanto)
    source_ids:
    - vsbattles-hacker-akudama-drive-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Standard Tactics: *As the Hacker, his role in the Akudama was for his extreme
      prowess in technology and hacking in order to recover the cargo from the Shinkansen.
      With this, he is not combative and acts in more of a supportive role compared
      to fighting on the frontlines. He opts to take off and run in order to avoid
      death, such as against the Executioners and would instead use others'' combat
      abilities to his advantage as distractions, hiding safely where he can control
      the situation. *Hacker''s utmost motivation is the desire for a challenge, where
      throughout his life he has claimed that nothing has been able to excite or challenge
      him sufficiently, where he quickly becomes bored to the point he loses his will
      to live. His main goal above all else is to see out a challenge, or ''game''
      as he likes to label it, and desires to go to Kanto for his well-regarded reputation
      in being far more advanced and exciting than Kansai. **Through this, Hacker
      is willing to risk his life just for the chance to get to Kanto and satiate
      his boredom, such as by going through the Quarantine Zone or removing Brother''s
      bomb collar. He thoroughly enjoys any difficult or challenging situation he''s
      put in, finding it fun and willing to go further to maximise the rush he gets.
      *As an Akudama, Hacker has no issues with murder or killing others to further
      his goals, where he would initially be willing to kill Ordinary/Swindler just
      for her simply being a witness. Despite this however, Hacker seems less bloodthirsty
      as his peers and can be capable of sympathy and kindness, though is mostly still
      driven by his own desire for challenge.'
    source_ids:
    - vsbattles-hacker-akudama-drive-unknown
    confidence: 0.6
    notes: auto_repair source extraction
