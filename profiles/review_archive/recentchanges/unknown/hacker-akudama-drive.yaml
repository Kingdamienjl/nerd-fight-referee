  attack_potency:
    text: At least Human level physically (Despite being an S-Rank Akudama, his infamy
      was earned through his genius-level hacking, and is not as exceptionally strong
      as other Akudama such as Brawler and Courier), possibly Wall level (Despite
      not showing any physical prowess, he could possibly be comparable to the likes
      of other non-combative Akudama, such as Hoodlum and Swindler). At least Small
      Building level with Drones, possibly higher (Hacker's drones are his main weapon
      of choice, where he states their built-in plasma lasers could easily vaporize
      a humanAt least 0.068-0.073 Tons of TNT, and was confident in using it as a
      threat against the likes of Brawler and Courier, though they were not phased
      by this claim. Hacker was also able to take out two security officers through
      unknown methods). Unknown as data (Hacker no longer exists physically after
      going through the decontamination zone, and does not seem to be able to interact
      with the real world outside of using technology such as his drones)
    source_ids:
    - vsbattles-hacker-akudama-drive-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Likely at least High Hypersonic+ Combat, Reaction and Perception Speed
      (Although not a combatant, Hacker''s brain and movement speed are comparable
      to that of his fellow Akudama, where he can almost instantly hack complex security
      protocols, even ones he has not prior seen in a matter of minutes or seconds,
      and can overall work effectively in really slim timeframes. Although not as
      fast, he would likely downscale from the Execution Division Master, who could
      casually deflect bullets from point blank range.Akudama Drive - Episode 6: BROTHER21417.1
      m/s His drone''s flight speed was seemingly able to keep pace with Brawler and
      Courier''s bike), possibly higher (Hackers''s speed could possibly be comparable
      to the likes of Courier or Brawler, who are able to consistently and easily
      dodge laser-like projectiles from police robots and tanks. Hacker in particular
      was able to dodge a laser from the Shinkansen''s security system, though had
      previously spotted it before it had fired), Unknown as data (Hacker now exists
      as data, and although ultimately needing external help from Brother and Sister''s
      siblings, Hacker was able to keep up and bypass multiple protocols from Kanto''s
      Quantum Supercomputer, which all took place within one leap for Swindler in
      the real world)'
    source_ids:
    - vsbattles-hacker-akudama-drive-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Unknown, at least Above Average Human with drones (Hacker's drones can easily
      sustain his body weight while flying, as well as could save Swindler after she
      was launched by Kanto's Gravitational Defense Mechanism with ease)
    source_ids: &id002
