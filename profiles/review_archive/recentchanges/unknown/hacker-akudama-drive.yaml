    - field: range
      value: Standard Melee Range, at least Tens of Kilometers with Drones (Hacker
        is capable of remotely controlling his drones, such as the one he left with
        Swindler, even while he had been converted into data by the Decontamination
        Zone), Varies with Hacking (Hacker's reach extends to the presence of radio
