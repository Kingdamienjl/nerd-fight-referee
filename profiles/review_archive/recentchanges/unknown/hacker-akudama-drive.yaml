      value: Unknown (Hacker is capable of rapid, constant hacking throughout his
        escapades as an Akudama, though his physical stamina is seemingly not as great
        where he uses his drones for movement), at least Superhuman as data (Hacker's
        body is no longer physical and would not conventionally have the stamina required
        of a human. While hacking into Kanto, he was capable of keeping up with and
        withstanding Kanto's security, even while a significant portion of his body
