- id: claim-standard-equipment-2aee8e51
  section: equipment
  axis: equipment
  text: 'right|200px|One of Hacker''s Drones Drones: Hacker''s main equipment consists
    of two floating spherical drones with cat-like faces, that constantly hover around
    him and seem to be remotely controlled without requiring any manual movement.
    Hacker''s drones come with various utilities, such as becoming floating step panels
    he can use to manoeuvre in the air, project holographic panels as well as avatars
    of Hacker himself. His drones also have combative abilities, where they were likely
    the weapons Hacker used to take out two security officers, as well as his drones
    being able to use deadly plasma lasers capable of vaporizing a human, which he
    used to threaten Brawler and Courier with. After departing with the rest of the
    Akudama, Hacker had given one of his drones to Swindler as a parting gift, which
    was revealed to be used as surveillance he could watch her through. With this,
    he was able to use his hacking to assist and save her, such as leading her to
    escape from Cutthroat or breaking both her and Courier out of the Decontamination
    Zone before they became one with Kanto. The drone that Hacker kept seemed to be
    assimilated into Kanto alongside him, for usage within the virtual world, while
    he is still able to utilise the drone he gave to Swindler for interaction with
    the physical world.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
