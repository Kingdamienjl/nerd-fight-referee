    - field: standard_equipment
      value: 'right, 200px, One of Hacker''s Drones Drones: Hacker''s main equipment
        consists of two floating spherical drones with cat-like faces, that constantly
        hover around him and seem to be remotely controlled without requiring any
        manual movement. Hacker''s drones come with various utilities, such as becoming
        floating step panels he can use to manoeuvre in the air, project holographic
        panels as well as avatars of Hacker himself. His drones also have combative
        abilities, where they were likely the weapons Hacker used to take out two
        security officers, as well as his drones being able to use deadly plasma lasers
        capable of vaporizing a human, which he used to threaten Brawler and Courier
        with. After departing with the rest of the Akudama, Hacker had given one of
        his drones to Swindler as a parting gift, which was revealed to be used as
        surveillance he could watch her through. With this, he was able to use his
        hacking to assist and save her, such as leading her to escape from Cutthroat
        or breaking both her and Courier out of the Decontamination Zone before they
        became one with Kanto. The drone that Hacker kept seemed to be assimilated
        into Kanto alongside him, for usage within the virtual world, while he is
        still able to utilise the drone he gave to Swindler for interaction with the
        physical world.'
      source_id: vsbattles-hacker-akudama-drive-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Standard Tactics: *As the Hacker, his role in the Akudama was for his
        extreme prowess in technology and hacking in order to recover the cargo from
        the Shinkansen. With this, he is not combative and acts in more of a supportive
        role compared to fighting on the frontlines. He opts to take off and run in
        order to avoid death, such as against the Executioners and would instead use
        others'' combat abilities to his advantage as distractions, hiding safely
        where he can control the situation. *Hacker''s utmost motivation is the desire
        for a challenge, where throughout his life he has claimed that nothing has
        been able to excite or challenge him sufficiently, where he quickly becomes
        bored to the point he loses his will to live. His main goal above all else
        is to see out a challenge, or ''game'' as he likes to label it, and desires
        to go to Kanto for his well-regarded reputation in being far more advanced
        and exciting than Kansai. **Through this, Hacker is willing to risk his life
        just for the chance to get to Kanto and satiate his boredom, such as by going
        through the Quarantine Zone or removing Brother''s bomb collar. He thoroughly
        enjoys any difficult or challenging situation he''s put in, finding it fun
        and willing to go further to maximise the rush he gets. *As an Akudama, Hacker
        has no issues with murder or killing others to further his goals, where he
        would initially be willing to kill Ordinary/Swindler just for her simply being
        a witness. Despite this however, Hacker seems less bloodthirsty as his peers
        and can be capable of sympathy and kindness, though is mostly still driven
        by his own desire for challenge.'
      source_id: vsbattles-hacker-akudama-drive-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
