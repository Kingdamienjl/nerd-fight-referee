- id: claim-weaknesses-a74ac894
  section: weaknesses
  axis: weakness
  text: 'Chai lacks foresight, and often makes poor decisions as a result. Can only
    equip up to 5 chips at any one time. Can only store Reverb energy for a limited
    amount of time. Summoning allies through 808 tires Chai out slightly, essentially
    giving each of them a bit of a cooldown before being summoned againHi-Fi Rush
    (2023) - Track 2: Power-Up. Dependent on his guitar for combat, and needs the
    rod stored inside his metal arm to create it - without it, he is unarmed. Note:
    Due to many of Chai''s abilities being dependent on chips, and his inability to
    equip them all simultaneously, it should be specified in Versus Matches which
    chips Chai possesses during the fight. He can equip up to 5 at minimum power,
    and less if he wishes to use the upgraded versions.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-fbc74ab7
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery and Acrobatics (Capable
    of performing a great variety of extremely acrobatic strings of attacks, performing
    feats of agility and mastery such as full-body spinning attacks, juggling foes
    in the air and throwing his weapon at a target while running and getting it to
    bounce right back into his handHi-Fi Rush (2023) - Track 4: Less Budget, More
    Problems or just fly back to him like a boomerangHi-Fi Rush (2023) - Track 10:
    A Masterplan. Managed to non-lethally defeat Korsica, herself a very skilled fighter,
    by blocking all or most of her attacks and getting her to wear herself down all
    the way to unconsciousnessHi-Fi Rush (2023) - Track 7: The Climb), Weapon Creation,
    Weapon Control and Fusionism (Chai can construct and deconstruct his guitar weapon
    from the rod at its core at will by gathering scrap around itHi-Fi Rush (2023)
    - Track 1: A Fresh Start, and even add more mass to it by attracting even more
    material. He can even fuse it with other weapons to improve them, as seen when
    combining it with Peppermint''s gun during Master Blaster. Finally, it will transform
    into a real guitar when he''s performing particularly well in a fight, represented
    by an S Rank combo in gameplay or when he''s defeating a boss. This likely corresponds
    to an increase in power, given that he does this to deal the finishing blow to
    foes), Metal Manipulation and Magnetism Manipulation (Chai''s robot arm has magnetic
    powers, which can be used to pull scraps of metal together to create and modify
    his guitar, as well as pull himself towards metallic objects and enemies as if
    he had a grappling hook), Bodily Weaponry and Cyborgization (Partial. Chai is
    mostly human, but has had his right arm replaced with a robotic one that stores
    his guitar when not in use and is powered by the source of his powers, an MP3
    player accidentally installed within his chest), Empowerment (Chai can increase
    the damage of his attacks by syncing them to the beat of the music playing in
    his chest), Broadway Force (Chai''s music player warps the world around him, making
    all movements of the environment happen in-sync with the beat. While most enemies
    do fight to the beat, this is not universal, with certain attacks being at a rhythm
    of their own and combat in cutscenes not being bound to any), Statistics Amplification,
    Electricity Manipulation and Absorption (Chai''s robot arm can absorb and temporarily
    store electricity and use it to power up Special Attacks, though he is still harmed
    by most electric attacks coming his way. He can also restore power to generators
    by hitting them with the right timing), Precognition (Chai can predict the pattern
    of foes'' attacks before the first move even comes out, even in environments dark
    enough to render fighting more difficult and with such precision to be able to
    foresee the types of attacks he won''t be able to block and dodge them instead),
    Breaking the Fourth Wall (Chai occasionally hints to being aware of the player
    of Hi-Fi Rush), Afterimage Creation (Chai leaves behind afterimages when dashing),
    Non-Physical Interaction (Can destroy large energy attacks just by swinging at
    a portion of them, as well as parry a great variety of things, including electricity
    and energy beams), Sound Negation (Could destroy a harmonic forcefield built out
    of sound by synchronizing with its frequencyHi-Fi Rush (2023) - Track 11: The
    Needle Drop), Danmaku (With Gain Tornado, Chai can cause the scrap around his
    guitar to detach and swing around him while separate from it), Flight (Chai can
    surf around on his guitar with Guitar Ride), Energy Manipulation (With Rip and
    Tear, Chai creates a pair of giant energy arms that then move on to tear at foes),
    Energy Projection (Chai can shoot a beam of energy from his guitar with Harmonic
    Beam, or rapid-fire smaller bolts as shown in Double Riff), Healing (With Pick
    Me Up!, Chai heals his wounds with a reserve energy drink), Illusion Creation
    (With Holo-Chai, Chai can create a convincing replica of himself to distract enemies),
    Vibration Manipulation (Can cause large shockwaves around himself with Hibiki,
    as well as cause more directional ones with various other attacks), Attack Reflection
    (With the Damage Rebound D-Parry chip, a portion of force from attacks he defends
    against harm the attacker), limited Creation (With the Parry Health/Charge chips,
    Chai can create healing vials and full batteries out of nothing while defending
    against an opponent), Information Analysis (The Enemy Analyze Chip lets Chai see
    enemy health), Resistance to Poison Manipulation (Unaffected by a magma deposit''s
    various toxic gasesHi-Fi Rush (2023) - Track 3: Trial by Volcanic Fire), Information
    Analysis (CNMN is unable to factor Chai into his equations, always getting an
    error when trying to predict his effect on things), Light Manipulation (Unaffected
    by proximity to the GNR-020''s beams, which shine with a brightness of over 7
