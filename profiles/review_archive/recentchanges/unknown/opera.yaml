  intelligence:
    text: 'Gifted, likely higher (Is capable enough to be the butler and right-hand
      man of one of the greatest demons that exist and who is one of the persons that
      effectively rule the netherworld, Sullivan. Taught both Kalego and Balam in
      school as their senpai. As a teacher is capable enough to make Iruma learn how
      to receive attacks instead of just instinctually dodging, which was what let
      him win the demon dodgeball play and have his rank promoted. Can talk on the
      phone about a heavy matter while simultaneous playing videogames only with his
      tail and still winMairimashita! Iruma-kun Volume 3; Chapter 24. Won the prices
      of all the competitions in the Battler Party. Part of his daily work is to deal
      with piles of paperworkMairimashita! Iruma-kun Volume 32; Opera-sensei''s Sukima
      that he finishes very quickly. Is the personal teacher of the Misfits to make
      them develop their battle prowess, with just his first-class already making
      them able to use a Non-Verbal spell) Standard Tactics: Use his great physical
      prowess to crush his enemy, while simultaneously taking full advantage of his
      agile body to dodge anything harmful.'
