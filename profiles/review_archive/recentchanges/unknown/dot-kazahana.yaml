        \ Addressing The Debunks === Addressing The \"Mistranslation\" Debunk: Okay,\
        \ so the idea for the mistranslation debunk is that the kanji for the original\
        \ Japanese scan states something different from the actual translation, mainly\
        \ around this specific character being this \"\u9593\" which has multiple\
        \ meanings in the Japanese language but most commonly means either space or\
        \ time, however when paired with \"\u7A7A\" which more commonly means an empty\
        \ space we can come to the conclusion that in this context the kanji of \"\
        \u7A7A\u9593\" is meant to represent spacetime or a time-space. which is not\
        \ only consistent with the statements of the series but is consistent with\
        \ the idea that the \u014Ctsutsuki clan are all capable of creating dimensions\
