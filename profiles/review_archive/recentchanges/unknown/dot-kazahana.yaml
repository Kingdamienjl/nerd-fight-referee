    - field: weaknesses
      value: "Using the Karma Seal to release jutsu causes him to \"Overheat\" and\
        \ pass out after a while. Notable Attacks/Techniques: *Body Transformation:\
        \ Kawaki's body has undergone significant modification at the hands of Amado,\
        \ down to the level of his circulatory and nervous systems, transforming him\
        \ into something of a living scientific ninja tool. His body tissue can undergo\
        \ rapid cellular division, causing it to expand, and it can also instantly\
        \ undergo sclerosis or malacia to harden or soften. This allows him to partially\
        \ transform his body in a manner similar to J\u016Bgo's Sage Transformation,\
        \ weaponizing it to produce sharp blades or piercing tendrils; these growths\
        \ can even be shed, or thrown as projectiles. This also provides him with\
        \ an accelerated healing rate, able to mend his injuries in minutes. **Energy\
        \ Blast: He can produce a powerful shockwave from his body, either as a focus\
        \ beam or in all directions, even the ground below him. *Shadow Clone Technique:\
        \ Kawaki creates tangible \u201Cshadow clones\u201D that can fight and use\
        \ his techniques, but disappear after one definite hit. *Karma: Karma is a\
        \ seal bestowed by members of the \u014Ctsutsuki clan that takes the form\
        \ of a four-point black diamond on the recipient's body, marking them as a\
        \ \"vessel\". The seal significantly enhances the user's physical abilities\
        \ and jutsu's power. **Absorption and Reflection: Karma allows him to absorb\
        \ any ninjutsu, negating its effects in the process, release an enhanced version\
        \ of it and unleash large-scale explosions. **Space-Time Portal: Using Karma,\
        \ the user creates a rift from the mark, which allows anyone who enters it\
        \ to travel to a chosen location including foreign dimensions. ***Isshiki's\
        \ D\u014Djutsu: An unknown d\u014Djutsu that Isshiki has in his right eye,\
        \ little is known about his powers, but it gives Kawaki the ability to use\
        \ Sukunahikona. *** Sukunahikona: Sukunahikona is a d\u014Djutsu of Isshiki\
        \ \u014Ctsutsuki's unspecified right eye. It allows him to instantaneously\
        \ shrink himself or any inorganic matter within his gaze and return it to\
        \ its original size at will. Because the change in size happens too fast for\
        \ the human eye to see, it is often mistaken for teleportation. Daikokuten\
        \ can store these objects within a timeless dimension, allowing them to maintain\
        \ their condition. While inhabiting Jigen\u2019s body, this technique customarily\
        \ required hand gestures to shrink foreign matter, but in his original form,\
        \ Isshiki can achieve the effect just by looking at desired object. Kawaki\
        \ possessing Isshiki's does not need to perform hand gestures. ****Daikokuten:\
        \ Daikokuten is a technique within the unspecified d\u014Djutsu of Isshiki\
        \ \u014Ctsutsuki. Through its use, anything he has previously shrunken using\
        \ Sukunahikona can be stored within a dimension where time doesn't flow, allowing\
        \ them to maintain a pristine condition. They can be instantaneously retrieved\
        \ at the focus of his gaze. The objects retrieved are manifested with such\
        \ speed that they can catch attentive opponents, such as Sasuke Uchiha and\
        \ Six Paths Sage Mode-enhanced Naruto Uzumaki off guard while inflicting severe\
        \ bodily harm on them. While inhabiting Jigen\u2019s body, this technique\
        \ normally required hand gestures in order to summon the foreign matter back,\
        \ but in his original form, Isshiki can achieve the effect just by looking\
        \ at the target location. Kawaki possessing Isshiki's does not need to perform\
        \ hand gestures. *****Black Cubes: Can manifest massive black cubes with Daikokuten,\
        \ which he can freely manipulate. These black cubes disrupt sensory abilities."
