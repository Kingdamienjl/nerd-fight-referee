        lightning bolt gravely harmed the Dark Lord of Apokolips. Has contend with
        cosmic entities such as the Spectre himself and almost defeat him while empowered
        by extreme human belief, with their battle ripples across infinite timeline
        and almost destroy all of Hell, which is described as having infinite realms
        and is larger than the Multiverse. His magical powers can accidentally create
        ripples across realities and rivals the Greek Gods, who can "manipulate creation
        as they see fit". Defeated Steppenwolf, who could create universes with a
        single thought, with minor struggle. In the battle of Apokolips, Billy single-handedly
        directly contended with the Darkseid and was able to match with the New God
        in a lengthy battle but was eventually overwhelmed due to his lack of experience.
        Defeated the Seven Deadly Sins, who can grant anyone who absorb them with
