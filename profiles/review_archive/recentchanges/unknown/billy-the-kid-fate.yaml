  attack_potency:
    text: 'Large Island level+ (While alone and surrounded, killed anywhere from one
      hundred to three hundred Oprichniki, who are as strong as a Servant while close
      to Ivan. Implied that in an open space, he could fight Musashi in equal groundsFate/Grand
      Order Part 2: Anastasia), Small Country level with Spirit Origin Ascension (Thanks
      to Da Vinci''s modifications, Billy managed to ascend his Spirit Origin to the
      next level, giving his gun 3 times the firepower), Higher with Thunderer (C-Rank
      Noble Phantasms like Triple-Linked Crane Wings are able to produce A-rank Attacks,
      which are able to bypass God Hand. As a C++ Rank Noble Phantasm, Thunderer should
      be able to deal this much damage)'
    source_ids:
    - vsbattles-billy-the-kid-fate-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Relativistic+ with FTL reactions and combat speed (Can keep up with other
      Servants), Higher with Thunderer (His Noble Phantasm slows down time for his
      surroundings and perceptions, thus increasing his combat speed to compensate
      for his target's speed. In addition, his quick draw skill is supposed to make
      it so he can always draw before his enemy attacks him with time to spare)
    source_ids:
    - vsbattles-billy-the-kid-fate-unknown
    confidence: 0.6
    notes: auto_repair source extraction
