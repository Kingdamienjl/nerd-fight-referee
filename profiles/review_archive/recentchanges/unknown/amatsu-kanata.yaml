- id: claim-weaknesses-5bf3e304
  section: weaknesses
  axis: weakness
  text: 'Erosion is a power that comes with massive risk as the world doesn''t allow
    the falsification of itself, thus it will inevitable try and correct whatever
    was eroded. This doesn''t work in parallel worlds such as the Divide however,
    nor on any Erosion done to individuals, as the world only fixes Erosion to the
    world itself and not individuals. Possessors of Chambers are fated to eventually
    be devoured by them. Notable Attacks/Techniques: *Erosion/Direct Tune/Data Erosion/Caligula/Tyranny:
    An extremely peculiar power that devils and specially powered people possess.
    It is the power to Erode the world. It manipulates the smallest component of the
    world, data, and is capable of rewriting it. In other words, a power capable of
    twisting substances, the traits of creatures, and furthermore even the physical
    laws. **Red Wind: Kanata''s bloodline ability, which allows her to control Erosion,
    manifesting it in the form of red wind, this wind is capable of devouring anything
    in its path. *Erosion Shift: A skill cultivated over a decade, Kanata is able
    to instantly drag her opponent into the world of the Divide, a separate world
    which is a copy of the world. It exists in the gap between nothingness itself.
    ==Notable Matchups== Victories: Losses: Inconclusive: ==References== Category:Characters
