    - field: standard_equipment
      value: 'Quick Draw Sleeve Gun System: Zombieman possesses a hidden gun supply
        system tucked within the forearms of his coat. He uses them to procure extra
        firearms in the heat of battle., Desert Eagle: Zombieman''s signature handgun.
