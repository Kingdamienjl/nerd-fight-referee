        foes he can exchange regular ammunition with heavier caliber ammunition which
        carries greater stopping power at the cost of greater recoil that will break
        his limbs., Glock: In preparation for the raid on the Monster Association,
        Zombieman had a Glock pistol concealed inside his own body as an ace up his
        sleeve, being able to somehow shot it from the inside of his chest as a surprise
        attack., Long-bearded Axe: Zombieman''s favored melee weapon., Machetes: Zombieman
        carries two machetes on his back under his coat he can duel wield.'
