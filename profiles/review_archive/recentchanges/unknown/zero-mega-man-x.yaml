  text: "Extraordinary Genius |- | As Wily\u2019s magnum opus, he is built to surpassMega\
    \ Man 2 - The Power Fighters the likes of Rock and Bass as well as all of Wily's\
    \ other Robot Masters in every capacity, including combat skill. Mega Man has\
    \ fought up to at least 88 Robot Masters, robots comparable or superior to himself,\
    \ and can potentially fight them all with just a simple Mega Buster and lacking\
    \ the movement options of Mega Man X. Notable of these Robot Masters include:\
    \ *Tengu Man, who reads air flow with his sheer skill, meaning Zero is also capable\
    \ of such. *Mega Man beat Sunstar and Ra Moon, the former having thousands of\
    \ years in combat experience, and the latter being a supercomputer of similar\
    \ age- who created a Ra Thor that was two times faster than Quick Man, and thus\
    \ Rock at that point in time. *Zero should also be superior to Tomahawk Man, a\
    \ Robot Master designed for combat that can throw an axe so accurately it can\
    \ cut a candle wick, extinguishing its flame, 100 meters away. Immediately upon\
    \ being unsealed, he began \"tearing up entire Hunter units\"Maverick Hunter Field\
    \ Guide before proceeding to fight Sigma, the strongest, most advanced Reploid\
    \ and leader of the Maverick Hunters, stated to have genius-level intellect and\
    \ the world's greatest combat abilitiesRockman X Chou Hyakka (Mega Man X Super\
    \ Encyclopedia). In that fight, he was able to (literally) disarm him, a feat\
    \ attributed to his mastery over improvised weapons, and would have killed him\
    \ had he not been paralyzed by a sudden jolt of pain immediately before the end\
    \ of the fight. *Maverick Hunters fight a variety of Mechaloids with various abilities\
    \ superior to their own, and often train against Magma Dragoon using his data,\
    \ who is a master martial artist to combat. Even outside of combat, he is able\
    \ to look at Mega Man X's damaged X-Buster and use its schematics and parts to\
    \ upgrade his own Z-Buster- despite X and Zero's bodies being technology that\
    \ Gate failed to analyze completely. Yet, Gate was able to build Infinity Mijinion,\
    \ who analyzes information with the accuracy and speed of multiple supercomputers.\
    \ However, since Zero is primarily designed to be a combat robot, most of his\
    \ intelligence is allocated to combat. *Fought and defeated Dynamo on multiple\
    \ occasionsMega Man X6, a Reploid so skilled at fighting that even while playing\
    \ around, he's superior to most Special A-Class Maverick Hunters, the highest\
    \ rank within the organization that only 0.01% of members reachRockman X: Origins\
    \ *Is constantly depicted as a match for X \u2014 having fought him on two separate\
    \ occasions \u2014 who himself is a skilled fighter capable of defeating a physically\
