        \ to copy the abilities of defeated Mavericks by analyzing their DNA program),\
        \ Accelerated Development (Can develop his own techniques via the Learning\
        \ System), Non-Physical Interaction (Can interact with the Nightmare Virus),\
        \ Enhanced Senses (Can see in pitch darkness), Limited Empowerment (Grows\
        \ in power due to the Sigma Virus) and Limited Absorption (Can passively absorb\
        \ sunlight), Skills, Genius Intelligence (see Intelligence section), Surface\
        \ Scaling & Acrobatics, Martial Arts (Knows the Shoryuuken and Tatsumaki Senpuukyaku.\
