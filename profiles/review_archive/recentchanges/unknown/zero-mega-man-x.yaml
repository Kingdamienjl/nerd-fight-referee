    electricity, water, air, energy, light, metal) **Homing Attack (Via Homing Torpedo)
    **Black Hole Creation (Via Magnet Mine & Gravity Well) **Gravity Manipulation
    & BFR (Via Gravity Well) **Intangibility (Via Chameleon Sting) **Forcefield Creation
    (Via Rolling Shield) **Energy Manipulation **Crystal Manipulation, Sealing and
    Speed Reduction (Via Crystal Hunter) **Magnetism Manipulation (Via Silk Shot)
