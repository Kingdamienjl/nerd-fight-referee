    - field: weaknesses
      value: 'Raijingeki: By pressing the Special Weapon button while standing, Zero
        will perform a forward thrust with the Z-Saber as a blade of blue lightning.
        Can cancel the attack delay by using Raijineki during a standing saber combo.,
        Kuuenbu: The Kuuenbu technique allows Zero the ability to jump one more time
        after an initial jump. (This is not actually an attack.), Kuueznan: The Kuuenzan
        technique allows Zero to perform a rolling slash attack with his Z-Saber whilst
        in the air. The slash will still go on as Zero changes directions., Rakuhouha:
        As his Giga Attack, Zero punches the ground, sending out waves of energy in
        a fan-like pattern., Tenkuuha: The Tenkuuha technique upgrades the Z-Saber,
        tinting it violet and allowing it to destroy energy shots., Ryuenjin: By pressing
        Up and Special Weapon button while standing, Zero will perform a leaping upward
        slash with the Z-Saber as a blade of red flames. This move has a fixed height.,
        Hyouretsuzan: Zero will perform a falling downward thrust with the Z-Saber
        turning into a giant light blue icicle. Cannot be interrupted, but he can
        aim the icicle left or right to hit the target more effectively., Hienkyaku:
        The Hienkyaku technique allows Zero to perform a dash in mid-air., Shippuunga:
        By pressing the Special Weapon button during a dash move, Zero will perform
        a large, twirling slash with a pink blade, hitting up to three times in a
        row. Take note that Zero can only do this while dashing on the ground, and
        not while performing Hienkyaku at the same time., C-Sword: Like Kuuenbu and
        Kuuenzan, Zero is able to air hike and perform an earth-element rolling slash
        surrounded by a crescent aura. Has a shorter cooldown time than Kuuenzan.
        The crescent aura is just a visual effect that can''t damage enemies., F-Splasher:
        Zero performs an ice-element version of Hienkyaku that surrounds his body
        in a sheet of ice. If the player presses up or down while performing this,
        Zero''s direction will be slightly altered upwards or downwards., E-Blade:
        Zero performs a lightning-element rising slash which also sends lightning
        bolts downwards, damaging enemies below him. The more times the attack button
        is pressed during the move, the higher Zero will reach., C-Flasher: As his
        Giga Attack, Zero performs a violet-colored version of Rakuhouha. Unlike Rakuhouha,
        the projectiles are unstoppable but do less damage on their own, but compensate
        with multiple hits. Damage taken can convert into energy for this attack.,
        Dark Hold: Zero freezes time for every object and minor enemy on the screen
        (it is also effective on Spiral Pegasus). This technique slowly consumes Weapon
        Energy, but can be turned off when not needed. It is exactly the same as X''s
        Dark Hold., W-Shredder: Zero performs a wind-element version of Shippuuga
        that causes him to halt during a dash and send out an after-image to strike
        a target if it makes contact with one., Quake Blazer: Zero performs a fire-element
        downward thrust that generates explosions when it connects. The explosions
        seem to be just a visual effect that can''t damage enemies. Can be interrupted
        as well as adjustable aim., Twin Dream: Zero performs a variant of X''s Soul
        Body. The image alone doesn''t cause any damage, but when Zero attacks, it
        mimics his move and cause damage to enemies within its attack range. Disappears
        after a short period of time., Yammar Option: Zero summons up to three robot
        dragonflies to shield him and fire straight ahead. Although this is the same
        as X''s version of this weapon, it has some differences: in Zero''s version,
        the robot dragonflies attack concurrently with Zero''s other attacks and Z-Buster
        shots., Sentsuizan: Zero performs an airborne version of Shippuuga that shakes
        the screen when it makes contact with the ground. Unlike Shippuuga which goes
        forward, this technique lets Zero fly diagonally downwards instead, Shoenzan:''
        Zero performs a ground version of Ryuenjin that also creates an upward wall
        of flames for extra upward reach., Hyoroga: Zero takes a mighty leap and clings
        to the ceiling. He can drop icicles or dash while on the ceiling. Shooting
        icicles will consume Weapon Energy, but Zero can still leap and air dash from
        the ceiling even without using any Weapon Energy. Note the ceiling needs to
        be within reach, as ones that are too high are impossible to attach to., Ensuizan:
        Zero performs a fast, water-element rolling slash. This version can also be
        performed while on the ground as well as in the air., Rakukojin: Zero performs
        a metallic downward thrust that explodes and horizontally throws small bouncing
        anchors when it connects. This is one of the few techniques to use Weapon
        Energy. While it can be used without Weapon Energy, no anchor will appear
        unless Weapon Energy is available for consumption., Guard Shell: Zero summons
        an energy shield that reflects energy shots. Like Yammar Option'
