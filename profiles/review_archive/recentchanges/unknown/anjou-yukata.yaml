    - field: powers_and_abilities
      value: 'Cursed Energy Manipulation, Superhuman Physical Characteristics & Statistics
        Amplification (Sorcerers and Curses can increase their physical power by reinforcing
        with cursed energy), Regeneration & Healing (Low-Mid - Yuta can regenerate
        his fingers easily. His Reversed Cursed Technique is adept enough to heal
        people from poison, which is a far harder feat to pull off), Power Mimicry
        (Yuta''s technique Copy is the ability to unconditionally copy other individuals''
        Innate Techniques), Enhanced Senses (Yuta and Rika''s vision are shared, allowing
        them to see what each other see), Energy Projection (Can release a burst of
        Cursed Energy), Black Flash (Performed Black Flash against Geto), Corruption
        (Type 2, Non-Combat Applicable - At first it was thought that Rika had cursed
        Yuta, but after further investigation, it was revealed that Yuta had cursed
        Rika, turning her into a Cursed Spirit after death, and corrupting her soul),
        Martial Arts, Weapon Mastery (Learned how to imbue Cursed Energy in a sword),
        Summoning (Rika will manifest whenever Yuta is threatened), Dimensional Storage
        (Able to store objects in sacs), Creation (Created a microphone), Cursed Speech
        Manipulation (Yuta is able to curse his words and create cursed words to enforce
        certain commands), Which allows him to performs: Sleep Manipulation, Paralysis
        Inducement, Limited Body Puppetry, Gravity Manipulation, Explosion Manipulation,
        Death Manipulation & Shockwave Creation, Power Nullification, Duplication
        & Hair Manipulation (Able to make mini Shikigamis of Rika from his hair. The
        Shikigamis are also in mini moving domains which nullify cursed techniques
        caught in their vicinity), Spatial Manipulation, Invisibility, Attack Reflection
        & Forcefield Creation (Copied Uro''s Sky Manipulation ability, which allows
        him to grip the sky, as if it were a surface. This includes bending space
        to create barriers, reflect attacks, or break space itself, along with the
        person with it, explicitly blowing past one''s guard), Holy Manipulation,
        Light Manipulation, Purification (Type 2) & Cursed Energy Nullification (Copied
        the Angel''s Cursed Technique, Jacob''s Ladder which nullifies all Cursed
        Techniques, including seals and barriers, and purifies evil), Precognition
        & Text Manipulation (Copied Charles'' Future Sight ability, which Charles
        to glimpse his opponent''s future in the next second by tagging them with
        a manga panel), Invisible Slash Attacks & Adaptation (Copied Sukuna''s Shrine,
        his Cursed Technique that sends slashes, invisible to even sorcerers and cursed
        spirits, flying at his opponent), Immortality & Possession (Type 6, Non-Combat
        Applicable - Kenjaku''s Cursed Technique allows him user to hop bodies by
        switching the targets brain with his own), Domain Expansion (Type 1 - Yuta
        possesses the ability to cast a Domain Expansion with a closed barrier. This
        barrier is especially notable, as the guaranteed-hit only affects the target
        Yuta is opposing, a skill that even Sukuna compliments. He himself can select
        any of his copied techniques as the guaranteed-hit effect. While in his Domain,
        Yuta has unrestricted access to any Innate Techniques that he has copied in
        the form of countless blades that are randomly scattered across the Domain
        and are only usable by Yuta himself. Yuta is unaware of the technique imbued
        in the katana until he grasps it), Including all of Satoru Gojo''s abilities'
