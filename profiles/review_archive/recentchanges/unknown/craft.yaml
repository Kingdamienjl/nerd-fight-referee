- id: claim-weaknesses-e0464f14
  section: weaknesses
  axis: weakness
  text: 'Pessimistic and cynical, has limited close-combat options due to his choice
    of weaponry, There''s a slight priming time before his cannon actually fires.
    Notable Attacks/Techniques: CraftConcussionGrenadesAndRoll.gif|Concussion Grenades
    and Combat Roll CraftRocketLauncher.gif|Rocket Launcher CraftLaserCannon.gif|Laser
    Cannon CraftAcuteLaserCannon.gif|Acute Laser Cannon CraftFragGrenade.gif|Fragmentation
    Grenade CraftSerratedBayonet.gif|Serrated Bayonet CraftExodus.gif|Exodus *Combat
    Roll: Craft activates his boosters to quickly accelerate and tumble forward in
    a blurring flash, allowing him to dodge attacks and get behind foes to launch
    counterattacks in an instant. *Rocket Launcher: Using the Rocket Launcher feature
    of his cannon, he fires a homing rocket at his opponent. *Laser Cannon: Craft
    activates a laser sight that locks on to his target before firing a wide and powerful
    beam that covers the entire battlefield. **Acute Laser Cannon: Craft jumps into
    the air and fires his cannon at a forty-five-degree angle, sweeping across the
    battlefield to catch those who dodged the initial firing. *Concussion Grenades:
    Craft throws three concussion grenades that go off the second they come into contact
    with the enemy or if they hit the ground, stunning foes caught in the explosion.
    *Fragmentation Grenade: Craft throws a much larger grenade that explodes with
    a flurry of shrapnel as it approaches its target, allowing him to catch his target
    off guard and even damage them if they dodge the initial explosion. *Serrated
    Bayonet: After extending the serrated bayonet attached to his cannon, Craft rushes
    his target to impale them with it, ejecting it with explosive force to drive it
    in further and send the opponent flying away for a follow-up attack from his cannon.
    *Exodus: His ultimate attack. He leaps into the air so that he''s perpendicular
    to his target, aiming his cannon downward to firing his laser cannon to attack
    the opponent and suspend him in the air. He then opens every compartment on his
    cannon to unload every rocket in his arsenal, saturating the area to destroy the
    opponent with overwhelming firepower and almost completely eliminating any chance
    of escape. ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters
    Category:Mega Man Category:Antagonists Category:Antiheroes Category:Energy Users
    Category:Energy Weapon Users Category:Game Bosses Category:Game Characters Category:Gun
    Users Category:Inorganic Beings Category:Male Characters Category:Reploids Category:Robots
    Category:Self-Sustenance Users Category:Soldiers Category:Video Game Characters
    Category:Weapon Masters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
