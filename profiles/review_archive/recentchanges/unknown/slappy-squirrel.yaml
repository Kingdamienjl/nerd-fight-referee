  attack_potency:
    text: Varies (As a toon, Slappy's capabilities depends on her belief of what she
      can or cannot do, with toons being actors that are required to take damage and
      pain in order to gain laughs and their power level varying depending on what
      they need to endure, although her physiology naturally allows him to perform
      superhuman feats) from City Block level to High Universe level (She can damage
      Walter Wolf, who took an explosive from the Warners. She was able to harm Wile
      E. Coyote by ramming her car into him), Complex Multiverse level at her peak
      (Can harm those who can harm her. Should be capable of reaching the same level
      of power as Yakko)
    source_ids:
    - vsbattles-slappy-squirrel-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Varies from Sub-Relativistic to Massively FTL+ (She is able to chase after
      Chicken Boo alongside the likes of Miles Standish, who could keep pace with
      the Warners, and outpace a turkey that could more closely trail behind them.
      Her car is fast enough to keep up with The Road Runner), Immeasurable at her
      peak (Should be comparable to Wile E. Coyote. She should be superior to other
      Toons that are capable of moving onLooney Tunes: Duck Amuck "The Film Reel")'
    source_ids:
    - vsbattles-slappy-squirrel-unknown
    confidence: 0.6
    notes: auto_repair source extraction
