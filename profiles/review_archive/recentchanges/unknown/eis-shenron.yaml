    - field: weaknesses
      value: "None notable Notable Attacks/Techniques: *Flight \u2013 The ability\
        \ to fly without the use of ki through the use of wings or special mechanisms.\
        \ *Magic Materialization - Nuova is able to form a lens for usage in his attacks.\
        \ *Nova Death Ray \u2013 Nuova forms a lens that can absorb heat from the\
        \ sun in front of his hands, and then shoots a lethal ray of fire at the opponent.\
        \ Because this attack gets it's power from the sun, it does not run out of\
        \ energy. *Heat Armor - The user raises their temperature to a point where\
        \ their body starts to glow a bright reddish orange, functioning as energy\
        \ shield that can also harm an attacking opponent. The power is so immense\
        \ that it is past the hotness of the Sun, around the temperature of a lightning\
        \ bolt. *Nova Star \u2013 First, Nuova charges a spiraling, fiery energy sphere\
        \ in his mouth. Then, he grabs the energy sphere and charges it in a fashion\
        \ similar to the Kamehameha. Finally, Nuova raises his hands and shouts \"\
        Nova Star!\" as he fires the energy sphere at the opponent, inflicting high\
        \ damage through a fiery explosion. *Sun Gun Attack \u2013 First, Nova hides\
        \ in his fire ball and then he begins firing Ki Blasts rapidly, inflicting\
        \ a great amount of damage. *Flaming Shot - Nuova Shenron charges a fiery\
        \ sphere in each hand using a stance almost identical to the Final Flash and\
        \ combines them to fire a fiery energy wave. *Blaster Meteor \u2013 First,\
        \ the user forms an Energy Shield around his body. Then, he brings his hands\
        \ apart to each side and releases many powerful energy blasts that home in\
        \ on the target, inflicting a massive amount of damage. *Nova Sphere \u2013\
        \ Nuova grabs his opponent and encases both himself and the opponent in a\
        \ large, swirling sphere of fire that takes to the sky. Any volatile attack\
        \ made by either Nuova or the opponent will cause the sphere to explode, creating\
        \ a powerful blast many times bigger than the sphere itself. Nuova himself\
        \ will not be harmed by the explosion due to being immune to the heat."
      source_id: character-stats-profiles-eis-shenron-unknown
      provider_id: character_stats_profiles
      authority: high
