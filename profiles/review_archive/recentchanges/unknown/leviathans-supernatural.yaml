- id: claim-weaknesses-93c0e559
  section: weaknesses
  axis: weakness
  text: 'Borax / Sodium Borate is extremely caustic to them, they can become immobile
    should their hosts be decapitated, and are completely reliant on their leader,
    Dick Roman (Should he die, Leviathans lose practically all cohesion and intellect,
    and devolve into mindless monsters). The "Bone Of Righteous Mortal Washed in the
    Three Bloods of Fallen" can kill them. Notable Attacks/Techniques: * Jaws: Leviathans
    possess massive, retractable jaws that are immensely strong and serves as their
    primary weapon and way to feed. Their jaws can rip open almost anything they bite
    into, bypassing their prey''s durability, up to and including humans, monsters,
    demons and even Angels. This means that a Leviathan''s jaws are capable of not
    only devouring souls, but non-corporeal beings which predate souls. * Possession:
    Leviathans can take over a human host''s body and mind by a touch, though unlike
    demons the process alters the host biologically and appears permanent. Upon possessing
    a host, they assimilate all of their memories and abilities. * Shapeshifting:
    Through physical contact with just one strand of DNA, Leviathans can instantaneously
    shapeshift their vessel into that person''s form, transforming into the person
    they are in contact with. Upon shapeshifting, the Leviathans assimilate all the
    memories and skills of that person. They are also capable of mimicking a human''s
    clothing through shapeshifting. == Gallery == centre|thumb|400x400px centre|thumb|400x400px
    ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters Category:Supernatural
    Category:TV Characters Category:Live-Action Characters Category:Monsters Category:Magical
    Creatures Category:Eldritch Horrors Category:Species Category:Evil Characters
    Category:Villains Category:Antagonists Category:Murderers Category:Sadists Category:Immortals
    Category:Regeneration Users Category:Possession Users Category:Shapeshifters Category:Blood
    Users Category:Power Nullification Users Category:Power Mimicry Users Category:Geniuses
    Category:Fantasy Characters Category:Horror Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-bd718424
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Enhanced Senses
    (Leviathans can track Angels, Demons, Humans and Monsters' presences, and one
    Leviathan could identify that a puddle of blood belonged to Dean simply by looking
    at it), Immortality (Types 1 and 3), Regeneration (High-Mid in Host, likely Mid-High
    in True Forms as Angels who can manipulate matter at a cellular level can't kill
    them), Possession and Shapeshifting (See more details below), Flight (In Purgatory),
    Poisonous Blood (Capable of killing even angels), Power Nullification (Works even
    with angels), Durability Negation (Capable of devouring humans, monsters, Demons
    and even Angels with their jaws)
  source_ids: *id003
