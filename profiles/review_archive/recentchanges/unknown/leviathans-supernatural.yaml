      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Borax / Sodium Borate is extremely caustic to them, they can become
        immobile should their hosts be decapitated, and are completely reliant on
        their leader, Dick Roman (Should he die, Leviathans lose practically all cohesion
        and intellect, and devolve into mindless monsters). The "Bone Of Righteous
        Mortal Washed in the Three Bloods of Fallen" can kill them. Notable Attacks/Techniques:
        * Jaws: Leviathans possess massive, retractable jaws that are immensely strong
        and serves as their primary weapon and way to feed. Their jaws can rip open
        almost anything they bite into, bypassing their prey''s durability, up to
        and including humans, monsters, demons and even Angels. This means that a
        Leviathan''s jaws are capable of not only devouring souls, but non-corporeal
        beings which predate souls. * Possession: Leviathans can take over a human
        host''s body and mind by a touch, though unlike demons the process alters
        the host biologically and appears permanent. Upon possessing a host, they
        assimilate all of their memories and abilities. * Shapeshifting: Through physical
        contact with just one strand of DNA, Leviathans can instantaneously shapeshift
        their vessel into that person''s form, transforming into the person they are
        in contact with. Upon shapeshifting, the Leviathans assimilate all the memories
        and skills of that person. They are also capable of mimicking a human''s clothing
        through shapeshifting. == Gallery == centre|thumb|400x400px centre|thumb|400x400px
