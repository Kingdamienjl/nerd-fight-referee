        They developed a food additive that cured cancer, AIDS, and other human diseases,
        and also produced other additives that would kill all other non-leviathan
        beasts, make humans compliant, as well as one that killed people with undesirable
        traits such as low body mass, hemophilia and high IQ. In addition, they were
