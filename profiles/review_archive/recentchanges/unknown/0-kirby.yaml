power_scale:
  tier:
    text: "Name: 0\xB2Enemy Info Card 9 \xB7 Kirby 64: The Crystal Shards, \"Zero\xB7\
      Two\" (\u30BC\u30ED\u30FB\u30C4\u30FC) Origin: Kirby 64: The Crystal Shards\
      \ Gender: Genderless Age: Unknown Classification: Member of the Dark Matter\
      \ species (Mysterious black clouds), Leader of the Dark Matter species, Angel-like\
      \ creature, unknown entity, black shadow (Before using its true form\u661F\u306E\
      \u30AB\u30FC\u30D3\u30A364 \u5FC5\u52DD\u653B\u7565\u6CD5 (\"Kirby of the Stars\
      \ 64: Certain Victory Strategy Method\")), \"Benevolent creature\"Kirby 64:\
      \ The Crystal Shards Prima Strategy Guide, page 6Infamously called a benevolent\
      \ creature by a strategy guide filled with many errors. They either A. purposely\
      \ avoided being accurate to overlook 0\xB2, as it later gives no further info\
      \ about it to keep hidden that it was the secret final boss. B. It is said with\
      \ a twisted sense of morality. Or C. the description was mistakenly swapped\
      \ with that of a character named Mopoo. 0\xB2 is not present in \"the cloud\
      \ levels of Shiver Star\"., \"The embodiment of evil\"\u300C20th Anniversary\
      \ \u661F\u306E\u30AB\u30FC\u30D3\u30A3 \u30D7\u30D7\u30D7\u5927\u5168\u300D\
      (\"20th Anniversary Kirby of the Stars Pupupu Encyclopedia\". August 3, 2012),\
      \ page 21, potentially \"darkness that possesses\" and \"villain of darkness\"\
      KIRBY STAR ALLIES THE ORIGINAL ART BOOK (Mar 16, 2021), page 136"
    source_ids: &id002
    - mediawiki-4430974
    confidence: 0.95
  attack_potency:
    text: 'Large Planet level (Fought evenly with Pre-Canvas Curse Kirby with Ribbon''s
      Shard Gun as a final boss, after Kirby had defeated Miracle Matter and being
      above any other Dark Matter at the time. Its defeat somehow led to a planet
      made of continent-sized Dark Matter beings blowing upKirby 64: The Crystal Shards),
      can ignore durability in some ways'
    source_ids:
    - vsbattles-0-kirby-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Massively FTL+ (As its defeat blew up a planet made of continent-sized\
      \ Dark Matter and 0\xB2 is their leader, it should be above the 3 regular Dark\
      \ Matter who flew past 8 galaxies in 7 seconds while chasing Ribbon, who was\
      \ doing the same. Kept up with Ribbon and Kirby in combat while flying)"
    source_ids:
    - vsbattles-0-kirby-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Unknown (Doesn't focus on lifting)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Unknown (May upscale from other Dark Matter beings, but the bandage in its
      head and proven lesser regeneration may imply it is having some unknown issues
      with its body. Never attacks physically itself)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Large Planet level
    source_ids:
    - vsbattles-0-kirby-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: "Peak Human. Fought a Kirby that was constantly shooting at its eye and\
      \ could not be defeated by this method alone, despite 0\xB2 getting bloodContent\
      \ warning description \xB7 Kirby 64: The Crystal Shards - Nintendo 64 - Nintendo\
      \ Switch Online blown out of its body with each attack at its eye"
    source_ids:
    - vsbattles-0-kirby-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard melee range physically, intergalactic with Morality Manipulation,
      Madness Manipulation, and projectiles (Dark Matter's influence affected 6 different
      worlds galaxies away from each other, Dark Matter was only physically present
      in the first and last of those worlds. 3 regular Dark Matter beings physically
      scattered the Crystal Shard around those 6 worlds, Zero-Two is above them combined
      as when he died a planet made of continent-sized Dark Matter blew up)
    source_ids:
    - vsbattles-0-kirby-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Above Average. While its goals are cartoonishly evil, and its species'\
      \ powerful abilities makes planning rather irrelevant, 0\xB2 is an effective\
      \ leader. They wasted no time coming to Ripple Star and filling the entire planet\
      \ in mind-controlling clouds. They attacked this planet knowing they have the\
      \ \"Cystal\", a powerful weapon that could hinder them. When Ribbon escaped\
      \ with the Cystal, essentially 3 scouts (Dark Rimuru, Dark Rimura, and Dark\
      \ Rimuro) were sent after her, chasing her across galaxies, shattering the Cystal\
      \ across planets, but failing to stop her. The 3 alien scouts tried to stop\
      \ the heroes, and enemies were mind-controlled everywhere Cystal Shards fell\
      \ to elimitate the heroes, with bosses along them guarding Crystal Shards so\
      \ that the heroes couldn't rebuild the complete Cystal. In the bad ending, without\
      \ all Crystal Shards collected by the time the heroes fight Miracle Matter,\
      \ the aliens' influence over Ripple Star flies away as if defeated, the heroes\
      \ are celebrated, and sent home, unaware that 0\xB2 is secretly possessing the\
      \ Fairy Queen. Ribbon, the fairy who contacted Kirby, is back on Ripple Star,\
      \ and so are the parts of the Cystal collected, the bad ending essentially dooms\
      \ Ripple Star. The possessed Fairy Queen appears grateful to the heroes, showing\
      \ 0\xB2 to not be a single-minded entity. In the regular version of events,\
      \ the Cystal is completed, the aliens' influence over Ripple Star blows up in\
      \ space, and the Cystal detects Fairy Queen's possession, attacking her. 0\xB2\
      \ flees and forms the planet Dark Star, where the final battle is fought."
    source_ids:
    - vsbattles-0-kirby-unknown
    confidence: 0.6
    notes: auto_repair source extraction
