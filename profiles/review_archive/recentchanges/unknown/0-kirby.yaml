    - field: intelligence
      value: "Above Average. While its goals are cartoonishly evil, and its species'\
        \ powerful abilities makes planning rather irrelevant, 0\xB2 is an effective\
        \ leader. They wasted no time coming to Ripple Star and filling the entire\
        \ planet in mind-controlling clouds. They attacked this planet knowing they\
        \ have the \"Cystal\", a powerful weapon that could hinder them. When Ribbon\
        \ escaped with the Cystal, essentially 3 scouts (Dark Rimuru, Dark Rimura,\
        \ and Dark Rimuro) were sent after her, chasing her across galaxies, shattering\
        \ the Cystal across planets, but failing to stop her. The 3 alien scouts tried\
        \ to stop the heroes, and enemies were mind-controlled everywhere Cystal Shards\
        \ fell to elimitate the heroes, with bosses along them guarding Crystal Shards\
        \ so that the heroes couldn't rebuild the complete Cystal. In the bad ending,\
        \ without all Crystal Shards collected by the time the heroes fight Miracle\
        \ Matter, the aliens' influence over Ripple Star flies away as if defeated,\
        \ the heroes are celebrated, and sent home, unaware that 0\xB2 is secretly\
        \ possessing the Fairy Queen. Ribbon, the fairy who contacted Kirby, is back\
        \ on Ripple Star, and so are the parts of the Cystal collected, the bad ending\
        \ essentially dooms Ripple Star. The possessed Fairy Queen appears grateful\
        \ to the heroes, showing 0\xB2 to not be a single-minded entity. In the regular\
        \ version of events, the Cystal is completed, the aliens' influence over Ripple\
        \ Star blows up in space, and the Cystal detects Fairy Queen's possession,\
        \ attacking her. 0\xB2 flees and forms the planet Dark Star, where the final\
        \ battle is fought."
