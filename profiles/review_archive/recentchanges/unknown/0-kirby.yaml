    - field: attack_potency
      value: 'At least Multi-Solar System Level (Was stated to be the leader of Dark
        Matter in the Kirby 20th Anniversary Encyclopedia, making it far stronger
        than regular Dark Matters, who are ranked among the strongest warriors of
        the Planet by Star Dream. The same guide also ranks Dark Nebula among the
        Dark Matter members and suggests that Dark Nebula might be a weaker incarnation
        of Zero. Dark Nebula was able to destroy all stars and celestial objects in
        the background until the only thing visible was a galaxy and stars far away
        from the battlefield, and Zero is at least comparable to Dark Nebula, if not
        superior), possibly Universe Level+ (Zero is very similar to Dark Mind''s
        final form, so it''s possible that Dark Mind''s final form is the mirror world
        equivalent of Zero. The mirror world has shown to contain parallel versions
        for many characters: Kirby, Meta Knight, King Dedede, Landia, Susie and possibly
        Whispy Woods, so it isn''t strange the fact that Dark Mind could be the mirror
        world equivalent of Zero. Dark Mind had the full control of the Mirror world,
        which has been described as a parallel universe, and was able to corrupt and
        warp it. The mirror world has also shown to contain three galaxies and several
        stars, thus further support it being a different universe. It is possible
        that Zero was inside the Master Crown and possessed Magolor after the latter
        was defeated by Kirby, because Magolor Soul has a giant eye with a red pupil
        in his mouth, which almost completely resembles Zero. Magolor had the full
        control of his Dimension as well as the main universe and was able to completely
        warp his dimension and use it as a weapon) to Multi-Universe Level (The mirror
        world also contains Master Hand and Crazy Hand, who created the Super Smash
        Bros universe and its space-time continuum. Dark Mind is the final boss of
        the game, thus it is stronger than both Master Hand and Crazy Hand. Master
        Hand alone is Universe Level+, the two hands together are Multi-Universe Level,
        and Dark Mind is stronger than them, easily putting it in this tier. The only
        thing we have to address now is that Master Hand and Crazy Hand are the same
        of their Super Smash Bros "counterpart". First of all, we know that Kirby
        can use his Smash ability which, according to the manual, allows Kirby to
        use all his moves from Super Smash Bros Melee. Then Master Hand appears several
        times in Kirby games. Both Kirby and Super Smash Bros are created by Masahiro
        Sakurai, whose last Kirby game is Kirby & The Amazing Mirror, and he probably
        wanted to honor the Kirby franchise by using Master Hand, thus symbolizing
        his will to dedicate himself to the Super Smash Bros franchise. Master Hand
        is strongly implied to be the creative hand of Masahiro Sakurai, and represents
        the first Sakurai, who wants to set up innovative and original ideas; Crazy
        Hand, on the other hand, represents the destructive hand of Masahiro Sakurai,
        who wants to destroy his works, scared by their serialization. It was also
        discovered that Master Hand appears into the files of Kirby Planet Robobot,
        to further support its relationship with the Kirby franchise. In Kirby Star
        Allies, Hyness notes that those of Jambastion are the "masters of a matter
        most dark". Void Termina''s core uses a form resembling Dark Matter in the
        final battle, and due to the fact that Zero is the creator of Dark Matter,
        this may possibly imply that Zero itself is a past incarnation or alternate
        form of Void Termina. Void Termina was stated to be able to cause the end
        of everything and was implied to be the strongest enemy ever faced by Kirby,
        making it even stronger than Dark Mind, whom is as strong as I explained before,
        and Queen Sectonia; the latter absorbed 4 Miracle Fruits, making her 4 times
        stronger than Hypernova Kirby, whose ability has been described as a Big Bang,
        making him Low 2-C, and the queen of Floralia is 4 times stronger than that,
        making her 2-C) | At least Multi-Solar System Level (Stronger than its previous
        form and the other Dark Matter members in Kirby 64, like Miracle Matter, whom
        can only be harmed by whatever ability is matching the form it is currently
        in, and is stronger than regular Dark Matter soldiers), possibly Universe
        Level+ to Multi-Universe Level (There are lot of similarities between Void
        Termina and Zero-Two, thus the latter might be another form of the former.
        First of all, the wings of Void Termina''s bird form are very similar to Zero-Two''s
        wings. The floor in which Kirby and his friends fight Void Termina''s core
        is very similar to Dark Star''s floor. The file name for the drops used by
        Void Termina''s core is called Red Tears, and in Zero-Two''s official artwork
        we can see that it has red tears too. Void Soul also shows a smiling face
        which resembles Zero-Two''s fake form and can use spikes just like Miracle
        Matter, the final boss of Kirby 64 without considering Zero-Two itself. Void
        Termina''s true form is very similar to a Dark Matter and can use an attack
        called Dark Matter Laser, thu'
