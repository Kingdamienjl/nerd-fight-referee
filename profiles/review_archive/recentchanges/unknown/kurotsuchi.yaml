    - field: weaknesses
      value: "None notable Notable Attacks/Techniques: * Antithesis: Ury\u016B's Schrift\
        \ allows him to reverse events that already taken place between two designated\
        \ targets. Such as switching the damage done to himself with Haschwalth, thus\
        \ leaving Haschwalth with his injuries and Ury\u016B with Haschwalth's injuries.\
        \ * Hirenkyaku: Essentially the Quincy version of the Shinigami Flash Step\
        \ and Arrancar Sonido. The Quincy creates platforms of Reishi under their\
        \ feet to swiftly move around the battlefield. * Ranso Tengai: An advanced\
        \ Quincy technique created for injured/old Quincy to control their limbs with\
        \ strings of Reishi like a puppet. Broken bones and severed tendons mean nothing\
        \ to this as the strings will control the limbs until the body/limb is destroyed.\
        \ * Sklaverei: Vollst\xE4ndig's basic Reishi Absorption ability pushed to\
        \ the absolute limit. This allows the user to absorb the Reishi that composes\
        \ spiritual and living beings, an absolute subordination of Reishi. Destroying\
        \ the Stern Ritter's Halo is the only way to stop it. * Heizen: Ishida uses\
        \ Heizen to instantly gouge and purge whatever is enclosed in the space made\
        \ by the four tossed Gint\u014D. This technique creates a transparent, rectangular\
        \ beam of energy from the silver tubes which slices through the opponent.\
        \ It is tremendously effective, even against Menos Grande. * Gritz: Ishida\
        \ uses a film of Reishi emitted from a thrown Gint\u014D to surround the enemy.\
        \ This technique forms a man-sized pentagonal Quincy cross, which envelops\
        \ its target. * Wolke: Ishida makes a Gint\u014D to create a large blast to\
        \ cushion his fall. * Sprenger: Ishida creates a pentagram seal on the ground\
        \ with his Seele Schneider to trap his foes into an attack that would explode\
        \ when he drops an ounce of Ginto into the pentagram. * Path Control: Ishida\
        \ can control a total of 3 arrows to home into his target. * Heilig Bogen:\
        \ Heilig Bogen are the standard spirit weapons wielded by Quincy, made out\
        \ of Reishi and Reiatsu. Although originally in the shapes of bows that fire\
        \ Heilig Pfeil, many a Quincy switch up their Heilig Bogen to be crossbows,\
        \ sniper rifles, handguns, and even gatling gun ** Heilig Pfeil: Ury\u016B\
        \ can gather Reishi from his surroundings and shape it into arrows, which\
        \ he can fire up to a total of 1,200 arrows at once. ** Licht Regen: Ury\u016B\
        \ charges the reishi in his bow to fire countless amounts of arrows upon his\
        \ foes. * Kojaku: Ury\u016B's first bow seen through the first arc is Kojaku.\
        \ He's able to utilize a stronger version of it in the final arc. * Ginrei\
        \ Kojaku: Ury\u016B's new bow after regaining his lost powers, it's used in\
        \ the third arc to the beginning of the final arc. ** Reishi Shield: Ury\u016B\
        \ can use Ginrei Kojaku as a temporary shield to block some attacks."
