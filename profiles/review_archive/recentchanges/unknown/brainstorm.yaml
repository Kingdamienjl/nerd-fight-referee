    - field: weaknesses
      value: Brain Vulnourability, Brainstorm's electric attacks are ineffective against
        weapons that were made specifically for electrokinetic aliens, such as the
        Shock Staff. If Brainstorm's shell is closed when releasing electricity, it
        will shock and injure his brain, as demonstrated with Dr. Psychobos. Because
        Brainstorm needs to concentrate to use his electrokinesis, things that causes
        him headaches, such as the sonic screams of a Sonorosian, can impair him.
        Being a Cerebrocrustacean, Brainstorm is at a massive disadvantage against
        a Vicetopus due to their large size and resistance to electricity. Brainstorm
        has difficulty walking on slippery surfaces, such as snow and ice. == Notes
        == == Statistic Values == Category:DJthisben10guy Category:Male Characters
        Category:Cartoon Characters Category:Aliens Category:Ben 10 Category:Ben 10
        Aliens Category:Superhuman Physical Characteristics Users Category:Body Control
        Users Category:Surface Scalers Category:Natural Weaponry Users Category:Acrobats
