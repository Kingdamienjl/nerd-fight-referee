    - field: powers_and_abilities
      value: '* Alien Physiology (All of Ben''s alien transformations follow the same
        rules and physiology as the Omnitrix, while also possessing all of its powers,
        functions, and resistances. While most of its functions have to be activated
        in specific manners, it also includes more passive ones * Superhuman Characteristics
        and Physiology ** Openable Cranium (Brainstorm can open his head, to reveal
        his brain) ** Surface Scaling (Here) ** Sharp Claws ** Acrobatics (Additionaly,
        he''s a sextuapedalist) ** Flight (Here) ** Underwater Breathing (Here) **
        Supergenius Intelligence (Hyper-Calculative Capacity, Instantaneous Physics
        Intuition, Spatial-Kinetic Visualization, Perfect Predictive Profiling, Environmental
        Weaponization, Efficiency Optimization, Macroscopic Psychological Manipulation,
        Long-Term Strategic Forecasting, Technological Mastery; Brainstorm''s cranium
        holds an immense brain, giving him super-massive intelligence that is too
        high to be measured on a human scale. Technically speaking, his IQ is shown
        to be 10^30, or one nonillion. He can solve very difficult calculations mentally
        in roughly seconds, and can visualize equations and trajectories of objects
        as if they''re actually there. He can even determine the mechanical values
        and physical properties of things by simply looking at them. In combat, Brainstorm
        is shown to be able to perfectly intuit and predict the mindsets, mannerisms,
        weaknesses, and attacks of his enemies; as well as being able to use his environment
        and any ordinary objects within it to win the fight with the minimal amount
        of moves. After defeating the Vengers, Brainstorm even got the idea for Ben
        to briefly quit being a superhero, calculating that their individual egos
        would turn them against each other in a matter of months once he removed himself
        from the picture) *** Extrasensory Perception, Information Analysis, Precognition
        & Analytical Prediction (He can solve very difficult calculations mentally
        in roughly seconds, and can visualize equations and trajectories of objects
        as if they''re actually there. He can even determine the mechanical values
        and physical properties of things by simply looking at them. In combat, Brainstorm
        is shown to be able to perfectly intuit and predict the mindsets, mannerisms,
        weaknesses, and attacks of his enemies, Brainstorm even got the idea for Ben
        to briefly quit being a superhero, calculating that their individual egos
        would turn them against each other in a matter of months once he removed himself
        from the picture) * Electricity Manipulation (Brainstorm can produce and manipulate
        electricity by both thinking hard enough and opening the exoskeleton plates
        on his skull. This electrical energy can be used in a variety of ways, such
        as electrocuting or launching enemies and disabling or destroying machinery.
        He can also charge up his electrical energy to produce a concentrated beam
        of electricity strong enough to blast Ship out of the air. Additionally, he
