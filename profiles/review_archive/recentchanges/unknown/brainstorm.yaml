        Influencers Category:Precognition Users Category:Analytical Prediction Users
        Category:Extrasensory Perception Users Category:Information Analysers Category:Electricity
        Users Category:Energy Users Category:Technology Users Category:Forcefield
        Users Category:Telekinesis Users Category:Shockwave Users Category:Telepaths
        Category:Weather Users
      source_id: character-stats-profiles-brainstorm-unknown
