        generate constructs with his electricity, as shown when Ultimate Kevin created
        a shield made of electricity to block Argit''s quills.) ** Neuronical Energy
        Manipulation (His power comes from thinking) ** Technology Manipulation via
        Electricity Manipulation (Could manipulate Animo''s mind control bracelete
