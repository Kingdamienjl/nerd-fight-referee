- id: claim-weaknesses-92fc1795
  section: weaknesses
  axis: weakness
  text: 'Unknown Notable Attacks/Techniques: List of Spells seen used by Newt: *Accio:
    This charm summons an object to the caster, potentially over a significant distance.
    It can be used in two ways; either by casting the charm and then naming the object
    desired, or by pointing your wand at the desired object during or immediately
    following the incantation to "pull" the target toward the caster; in either case,
    the caster must concentrate on the object they wish to summon in order for the
    charm to succeed. The caster doesn''t necessarily need to know the location of
    the target if they say the name of the object to be summoned. *Revelio: This charm
    is used to reveal concealed objects, messages, invisible things, and passages.
    It was considered difficult for a second year student. *Apparition: Wizarding
    transportation. *Petrificus Totalus: A curse that paralyzes the opponent. *Repairo:
    A charm that "repairs" a broken object to it''s original state. ==Notable Matchups==
    Victories: Losses: Inconclusive: Category:Characters Category:Wizarding World
    Category:Movie Characters Category:Humans Category:Wizards Category:Summoners
    Category:Dimensional Storage Users Category:Teleportation Users Category:Matter
    Users Category:Status Effect Users Category:Weather Users Category:Memory Users
    Category:Transmutation Users Category:Healers Category:Paralysis Users Category:Parasol
    Users Category:Wand Users Category:Magic Users Category:Attack Reflection Users
    Category:Mind Users Category:Air Users Category:Power Nullification Users Category:Healers
    Category:Illusionists Category:Light Users Category:Animal Users Category:Writers'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-b03b0bf5
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Magic, Energy Manipulation and Projection
    with various spells, Forcefield Creation with Shield Charms, Attack Reflection
    (Via spells and Shield Charms), Telekinesis with various spells, Paralysis Inducement
    (Via Petrificus Totalus), Memory Manipulation with the Memory Charm, Mind Control
    with the Confundus Charm, Air Manipulation (Can cause gusts of wind and dry clothes
    with wind), Limited Matter Manipulation (Repaired the entire upper half of Jacob
    Kowalski's apartment), Transmutation (Transformed glass into a sticky jelly-like
    substance to trap one of his Nifflers), Healing, Power Nullification (Nullified
    Grindelwald's shapeshifting spell. Dispelled Queenie's enchantment over Jacob),
    Weather Manipulation (Used the Atmospheric Charms to create weather conditions
    within his suitcase), Illusion Creation (Can create images of past events with
    the Tracking Spell), Light Manipulation with the Wand-Lighting Charm and Lumos
    Solem, Teleportation via Apparition, Dimensional Storage with his suitcase
  source_ids: *id003
  decisive: true
