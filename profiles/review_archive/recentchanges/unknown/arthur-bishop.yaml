    - field: intelligence
      value: 'Gifted (Harry McKenna said there is no one better than him because he
        can adapt and leave no loose ends, he also said Bishop see things and views
        people differently than anybody does. He deceived Harry into circumventing
        his own security and made his death look like a carjacking. He prevented Harry''s
        son Steve from killing a man because he knew he would be convicted on motive.
        He repaired a car in his free time. He agreed to train Steve to be a "mechanic"
        by having him study lists of every case of death imaginable provided by insurance
        companies, but not before conducting a thorough background check on him. He
        memorized another hitman''s routine and studied his weaknesses. He deduced
        an unnamed security guard''s identity based on his championship ring, and
        when he interrogated him, he made him believe he would inflict harm on his
        family. He later flushed Dean out of his secure building by making him believe
        he was inside with him. He speaks fluent English and Portuguese, and a woman
        commended his Brazilian accent when he was living under the identity of Otto
        Santos. He previously studied with Mei''s father, a doctor of Eastern medicine.
        He knew how to forge a passport and devised intricate plans to infiltrate
        Krill''s prison and assassinate him and destroy Adrian Cook''s sky pool, under
        extortion from Crain, whom he figured out was using him to eliminate the competition.)
        Standard Tactics: Bishop''s specialty is making his targets'' deaths look
        like accidents and he causes others to suspect someone else instead of him.
        When Steve asked him he does not simply shoot his targets, Bishop claimed
        his good judgment comes from experience, which had come from bad judgment.'
      source_id: mediawiki-4878564
      provider_id: vsbattles
      authority: high
