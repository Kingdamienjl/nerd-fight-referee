  intelligence:
    text: 'Innapplicable, Supergenius when piloted by Dr. Eggman (The pilot Dr. Eggman
      is a supergenius) Standard Tactics: The Egg King''s primary tactic is trying
      to crush and one-shot its opponent with its hands which generates orange travelling
      energy shockwaves on each side. If the hands are counterattacked, it will try
      and fire multiple travelling green energy shockwaves towards the opponent. If
      the opponent dodges the energy shockwave attack and ever gets onto one of its
      arms, the Egg King will start violently shaking its whole arm up and down to
      desperately launch the opponent away. The Egg King will also try to send explosive
      barrels out of its shoulders to knock back the opponent off its arm. Occasionally,
      the Egg King will fire a fast red laser beam from its head that explodes on
      contact or send out a small satellite that generates purple electricity to trap
      and shock the opponent. Once it''s on its last legs, the Egg King will attempt
      to destroy their opponent and the arena it''s in by crashing into the opponent/arena
      several times until the opponent is knocked out or the arena is destroyed.'
    source_ids:
    - vsbattles-egg-king-unknown
    confidence: 0.6
    notes: auto_repair source extraction
