    - field: weaknesses
      value: "Normal human weaknesses, Imagine Breaker has clear limitations, such\
        \ as fighting multiple opponents at the same time, conventional weapons or\
        \ flying opponents. Despite being able to negate more powerful attacks, Imagine\
        \ Breaker can have issues negating powers that are able to regenerate or are\
        \ receiving a constant supply of power if they are faster than its canceling\
        \ speed. His precognition skill can be restricted by opponents with superior\
        \ control over their involuntary body movements, Imagine Breaker (\u5E7B\u60F3\
        \u6BBA\u3057 Gens\u014D Goroshi (Imajin Bureik\u0101), lit. \"Illusion Killer\"\
        ): A mysterious power that exists in Touma's right hand due to Imagine Breaker\
        \ finding meaning in him since birth. Imagine Breaker is able to negate all\
        \ supernatural power like magic, and divine powers such as God's blessings\
        \ (luck) on physical contact, though it also provides Touma with some passive\
        \ defense against certain spells and apparently can interfere with some spells\
        \ just by being in their vicinity. Though it can negate anything supernatural,\
        \ it cannot negate natural forces from the supernatural such as a person's\
        \ life force (Evident to the fact that he hasn't killed anyone with a simple\
        \ handshake) and offers no protection against anything that is natural like\
        \ normal guns or swords and it won't negate natural consequences from a supernatural\
        \ power (such as the ashes from a magic fire). It also cannot \"completely\"\
        \ negate something if it surpasses its canceling speed such as Stiyl's Innocentius\
        \ or Accelerator's Dark Wings, but Touma has learned to use this limitation\
        \ to his advantage and use Imagine Breaker to interfere via \"disruption.\"\
        \ When upon contact with an attack, he can physically grab it and disrupt\
        \ it. Several people in-universe have speculated on Imagine Breaker's nature\
        \ and tried to explain it, with Ollerus's conjecture being that Imagine Breaker\
        \ is a reference point for the world born out of all magicians' fear of changing\
        \ the world too much and making it unrecognizable and their hopes of being\
        \ able to return to the normal world. Ollerus also stated that Imagine Breaker\
        \ existed long before Touma was born, possibly under different wielders and\
        \ different shapes, like it residing in objects. This was later supported\
        \ by Othinus stating the same thing and adding that she could gain possession\
        \ of Imagine Breaker if she removed all matter in the world, thus making it\
        \ so that the only thing for it to reside would be her., Precognition: Literally\
        \ referred in the original Japanese novels as Premonition Perception or Sense\
        \ of Foreboding (\u524D\u5146\u306E\u611F\u77E5 Zench\u014D no Kanchi), but\
        \ translated as Precognition in the fan translation for simplicity. Precognition\
        \ is the term used by characters to refer to the skill unconsciously developed\
        \ by Kamijou Touma through his many battles. Touma has gotten into such a\
        \ plethora of fights that he now can subconsciously anticipate attacks coming\
        \ his way. Combined with his reflexes and the courage to keep his body and\
        \ thoughts moving allows him to judge accurately what to do next. This works\
        \ because Touma is capable of unconsciously analyzing minute changes in the\
        \ battlefield and involuntary movements made by his enemies that likely not\
        \ even they are aware of. For example, Misaka Mikoto's electromagnetic fields\
        \ making metal items around her resonate. Even if Touma doesn't consciously\
        \ register these things, his unconscious does, allowing him to accurately\
        \ predict the path of an attack and move his body accordingly to stop it with\
        \ Imagine Breaker, dodge it or try to reduce the damage to his vitals in case\
        \ the former two options aren't possible. It's because of this skill that\
        \ Touma has been able to react to supersonic attacks, but it's been noted\
        \ that if he consciously takes note of it in battle and tries to use it then\
        \ it would likely fail. Due to the mechanics of this skill, it can be sealed\
        \ by an opponent who can restrict the information he receives, like the cyborg\
        \ Rensa who could completely freeze her face and control all of her body involuntary\
        \ muscular movements. This skill can be more simply described as a \"sixth\
        \ sense\" to react to upcoming attacks., Beyond the Right Hand: Whenever his\
        \ right arm has been severed or destroyed, it has been shown that the Imagine\
        \ Breaker holds within something with unimaginable potential. After his arm\
        \ has been severed, it has usually been able to regenerate/grow back as if\
        \ nothing had happened. However, there's been two different outcomes when\
        \ his arm is cut., Dragons: The first time his arm was cut by Aureolus Izzard,\
        \ referred to as the Dragon Strike (\u7ADC\u738B\u306E\u984E (\u30C9\u30E9\
        \u30B4\u30F3\u30B9\u30C8\u30E9\u30A4\u30AF) Ry\u016B\u014D no Ago (Doragon\
        \ Sutoraiku), lit. \"Jaw of the Dragon King\") appeared from the stump. While\
        \ at the time Stiyl Magnus stated that the dragon head had merely been an\
        \ unconscious creation from the alchemist's out of control reality warping\
        \ powers, Touma still harbored some do"
