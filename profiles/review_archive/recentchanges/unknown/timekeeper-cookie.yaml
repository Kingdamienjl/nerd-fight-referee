- id: claim-standard-equipment-ac699c01
  section: equipment
  axis: equipment
  text: 'Timekeeper Cookie owns a pair of Timeweaver Scissors, a standard-issue equipment
    distributed to all TBD agents. It can be used to make rips in space-time which
    allow the user to summon alternate timeline versions of Cookies or move virtually
    anywhere. She also has the Sonic Embroider, an upgraded version of the Timeweaver
    Scissors where she can create larger rifts without restriction, including rifts
    to the Time Rift. Timekeeper Cookie is also accompanied by either of her Pets,
    Cosmos Gear and Continuum Cog. Cosmos Gear will periodically summon other Cosmos
    Gears to assist Timekeeper Cookie, and Continuum Cog will periodically transform
    into 2 different states: Pure Light and Pure Darkness. During the Pure Light state,
    Continuum Cog creates Pure Light Jellies and restores energy to Timekeeper Cookie.
    During the Pure Darkness state, Continuum Cog becomes a black hole and absorbs
    all obstacles into it.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-44f0c415
  section: power_scale
  axis: battle_iq
  text: 'Extraordinary Genius (Has seen and learned about the lives of every iteration
    of herself up to the Croissant Cookie in Operation Timeguard, created a functioning
    time machine when she was still known as Croissant Cookie) Standard Tactics: She
    will start out by using Time Manipulation, creating rifts to alternate timelines
    to BFR them into one of them. She will also be "invincible" during this move,
    knocking away everything she touches. She periodically uses this move and is able
    to use Invocation Cards while using this move. All of her Treasures and Pets are
    passive, and activate their abilities to their fullest efficiency as soon as a
