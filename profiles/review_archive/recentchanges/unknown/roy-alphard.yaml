- id: claim-standard-equipment-68433f3e
  section: equipment
  axis: equipment
  text: '*Tiger Claws: A steel claw that is worn on each fingertip to mimic the claws
    of a beast. Roy''s skills allow him to deflect even the slashes of a knight''s
    sword with just his fingertips. *Concealed Daggers: A twin pair of concealed Witch
    Cult daggers, which Roy keeps hidden in his sleeves. He wields them in a two-handed
    style, and the slight increase in reach can catch opponents off-guard. *The Gospel:
    A book of prophecies given to all members of the Witch Cult, it is a defective
    version of an incomplete copy of the Book of Wisdom. It is a guide to the owner''s
    desired future, but its contents are vague and subject to change, the instructions
    being up to interpretation.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-3422ae33
  section: power_scale
  axis: battle_iq
  text: 'Extraordinary Genius Standard Tactics: Roy is a combatant with an absurd
    diversity in his capabilities, quickly abandoning ineffective tactics in favor
    of novel styles, pulling whatever he needs from his vast array of Memories. He
    often abuses the custom between warriors where they introduce themselves before
    battle, in order to obtain their Name. If he happens to possess the Memories of
    someone close to his opponent, he''ll imitate their mannerisms in order to make
    them feel uneasy. As Bizarre Eating, he has no eating standards, and merely sees
    fighting as a means to get his meals rather than something to enjoy, the opposite
    of his brother, and is therefore quick to use Eclipsing.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-52ac9853
  section: weaknesses
  axis: weakness
  text: "He can't eat a person's Name and Memories if he doesn't know their True Name.\
    \ If he eats another type of Name, he becomes plagued with severe nausea. The\
    \ Authority of Gluttony can only plunder the souls of people, animals and the\
    \ like are immune, although they still forget those whose Names are gone. Roy's\
    \ eating habits mean he has no sense of self-preservation, so he will gleefully\
    \ challenge seemingly unwinnable battles in order to fill his stomach. He is normally\
    \ unwilling to utilize Solar Eclipse because he fears his sense of self being\
    \ damaged by it, so he resorts to the inferior Lunar Eclipse. Notable Attacks/Techniques:\
    \ Authority of Gluttony: Roy's Authority of Gluttony can be divided into two powers\u2014\
    \ his ability to plunder a person's soul and consume their Name and Memories,\
    \ and his ability to access and physically utilize the stolen Names and Memories\
    \ within him. *Eclipsing: Roy can plunder a person's soul to eat the Name and\
    \ Memories of his opponent. To activate the Authority, he merely touches them,\
    \ chants the victim's full name, and licks his palm or his victim. Things such\
    \ as experience, talent, and the likes and dislikes of human relationships serve\
    \ as food for him, allowing him to take advantage of any abilities or Memories\
    \ his opponents had. However, if he eats a Name other than a person's True Name,\
    \ he becomes plagued with severe nausea. **Eclipsing the"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
