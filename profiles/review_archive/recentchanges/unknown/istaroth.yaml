    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Large Planet level (Alongside the other shades and the Heavenly Principles,
      she fought and defeated the Seven Dragon Sovereigns like Apep, Xiuhcoatl and
      Neuvillette in the Sky-War.Genshin Impact: Byakuyakoku Collection, Vol.2: Before
      Sun and Moon As one of the Four Shades of the Heavenly Principles, Istaroth
      should be superior to that of Moon Goddess like ColumbinaSong of the Welkin
      Moon, Act VI: Melting Moonlight in the Morning Mist20.5 Yottatons of TnT), Universe
      level+ with Fate hax (The Heavenly Principles and the Four Shades created and
      established the system of Fate that determines the course of the world. By imposing
      a predetermined Fate upon reality, they dictate the timeline''s progression
      from its beginning to its destined conclusion, with the anchoring of Fate likewise
      binding the Abyss to the end of time and thereby affecting the timeline in its
      entirety) up to Low Multiverse level via Environmental Destruction (Created
      multiple Spacetimes/Timelines and separated The Traveler in different spacetimes.Genshin
      Impact: Archon Quest, Chapter V Act VI: A Space and Time for You )'
    source_ids:
    - mediawiki-4986738
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Temporal Omnipresence (The Four Shades of the Heavenly Principles are ubiquitous.Archon
      Quest, Chapter VII, Act III: White Night, Like a Dream Upon Waking As the embodiment
      of time and the God of Moments,Before Sun and Moon - The Parable of the Tree
      Istaroth exists simultaneously across the entirety of the temporal dimension,
      encompassing every moment, every second, every minute, every instant, and all
      points in the past, present, and future,Before Sun and Moon: The Parable of
      the Tree as she is the one "stillness" within the endless flow of time)'
    source_ids:
    - mediawiki-4986738
    confidence: 0.6
    notes: auto_repair source extraction
