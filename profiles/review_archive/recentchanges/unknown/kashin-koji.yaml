    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: *Summoning Technique: The Summoning
        Technique is a space-time ninjutsu that allows the summoner to gather animals
        or people across long distances instantly. Kashin Koji uses this to summon
        frogs. **Reverse Summoning Technique: Like the standard Summoning Technique,
        this technique allows the user to transport a target to a location. After
        a shinobi has summoned an animal, they can use the Reverse Summoning Technique
        to transport the animal to another location. The shinobi and/or their allies
        can accompany the animal when this is done, such as by riding in its mouth,
        giving the shinobi a method of quickly travelling long distances or escaping
        confinement. **Summoning: Flames of the Flaming Mountain: Koji draws a ritual
        circle on the ground below his target, and as he joins his hands, he conjures
        powerful natural flames that never go out from a distant Flaming Mountain
        to incinerate him. *True Fire of Samadhi: Flames of purgatory that are almost
        impossible to get rid of be it storm or strong wind. They are stated to burn
        fast that even regenerative techniques can not keep up with them, and can
        be summoned directly from Koji, from a thrown Kunai or a summoned frog. *Fire
        Release: **Flame Bullet: This technique is executed by the user gathering
        oil in their mouth which is created by chakra, spitting it out, and igniting
        it. This technique simply shoots a flame bullet at the enemy. If the amount
        of oil that is prepared is kept down, the time it takes to invoke the technique
        is reduced. This allows the enemy to be stricken unaware, allowing the oil-containing
        flame bullet to burn them up completely. It is also possible to shoot out
        a series of flame bullets by partitioning the oil, or a continuous flamethrower.
        If this technique is fired after covering the enemy with oil using the Toad
        Oil Bullet, it has the power to wound or kill. This also keeps down the consumption
        of chakra. ***Big Flame Bullet: This technique is a senjutsu altered version
        of the Fire Release: Flame Bullet. The user fills their mouth cavity with
        oil, created inside his body with senjutsu chakra. This oil is expelled and
        at the same time ignited, creating a massive flame, equivalent in power to
        a multitude of Flame Bullets. The flames can be used as a single projectile
        or a continuous stream of flames. **Flame'
      source_id: character-stats-profiles-kashin-koji-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
