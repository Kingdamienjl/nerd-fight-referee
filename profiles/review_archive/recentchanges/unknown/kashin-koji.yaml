- id: claim-weaknesses-fdf9a9a8
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: Hide/Show * Summoning Technique:
    The Summoning Technique is a space-time ninjutsu that allows the summoner to gather
    animals or people across long distances instantly. Kashin Koji uses this to summon
    frogs. ** Reverse Summoning Technique: Like the standard Summoning Technique,
    this technique allows the user to transport a target to a location. After a shinobi
    has summoned an animal, they can use the Reverse Summoning Technique to transport
    the animal to another location. The shinobi and/or their allies can accompany
    the animal when this is done, such as by riding in its mouth, giving the shinobi
    a method of quickly travelling long distances or escaping confinement. ** Summoning:
    Flames of the Flaming Mountain: Koji draws a ritual circle on the ground below
    his target, and as he joins his hands, he conjures powerful natural flames that
    never go out from a distant Flaming Mountain to incinerate him. *True Fire of
    Samadhi: Flames of purgatory that are almost impossible to get rid of be it storm
    or strong wind. They are stated to burn fast that even regenerative techniques
    can not keep up with them, and can be summoned directly from Koji, from a thrown
    Kunai or a summoned frog. *Fire Release: **Flame Bullet: This technique is executed
    by the user gathering oil in their mouth which is created by chakra, spitting
    it out, and igniting it. This technique simply shoots a flame bullet at the enemy.
    If the amount of oil that is prepared is kept down, the time it takes to invoke
    the technique is reduced. This allows the enemy to be stricken unaware, allowing
    the oil-containing flame bullet to burn them up completely. It is also possible
    to shoot out a series of flame bullets by partitioning the oil, or a continuous
    flamethrower. If this technique is fired after covering the enemy with oil using
    the Toad Oil Bullet, it has the power to wound or kill. This also keeps down the
    consumption of chakra. ***Big Flame Bullet: This technique is a senjutsu altered
    version of the Fire Release: Flame Bullet. The user fills their mouth cavity with
    oil, created inside his body with senjutsu chakra. This oil is expelled and at
    the same time ignited, creating a massive flame, equivalent in power to a multitude
    of Flame Bullets. The flames can be used as a single projectile or a continuous
    stream of flames. **Flame'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-9edacbcf
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Master Hand-to-Hand Combatant, Acrobatics,\
    \ Stealth Mastery, Weapon Mastery, Chakra Manipulation, Statistics Amplification\
    \ (Shinobi are capable of enhancing their physical capabilities with the use of\
    \ chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance their speed\
    \ by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto\
    \ Chapter 71), Surface Scaling and Water Walking (By focusing chakra at the soles\
    \ of their feet, Shinobi can scale and cling to vertical surfaces, and even walk\
    \ on waterNaruto Chapter 18Naruto Chapter 90), Minor Illusion Creation and Duplication\
    \ (With the Clone TechniqueRin no Sho, Page 220, Shinobi can create illusionary\
    \ duplicates of themselves that have no physical substance), Shapeshifting (With\
    \ the Transformation TechniqueRin no Sho, Page 220, Shinobi can transform themselves\
    \ into other people, animals, plants, and even inanimate objects, such as weapons),\
    \ Paralysis Inducement (With the Temporary Paralysis TechniqueRin no Sho, Page\
    \ 176, Shinobi can completely paralyze their targets from close to mid range),\
    \ Fire Manipulation, Earth Manipulation, Paralysis, Energy Projection, Mind Manipulation,\
    \ Shapeshifting, Summoning (Can summon toads of varying sizes. Can also summon\
    \ an eternally burning natural fire from flaming mountains), Clairvoyance (Visual\
    \ Linking with toads. Can see through his summonings eyes), Body Control, Hair\
    \ Manipulation (Can use his hair to bind targets, harden it into needles and fire\
    \ them, and use it for defensive purposes), Oil Manipulation, Limited Teleportation\
    \ and Dimensional Travel (Can teleport his summonings to a desired location, including\
    \ other dimensions with Reverse Summoning. He can accompany the animal when this\
    \ is done, such as by riding in its mouth), Awakened Power and Precognition (At\
    \ the brink of death during his battle with Isshiki \u014Ctsutsuki, Kashin Koji\
    \ had awakened Prescience, allowing him to foresee future events. Not only does\
    \ this allow foresight, it also shows multiple possible futures.) All previous\
    \ abilities greatly increased, Transformation, Enhanced Senses, Extrasensory Perception,\
    \ Absorption (Can absorb natural energy from his surroundings), Limited Transmutation\
    \ and Petrification (Opponents who absorb excess amounts of natural energy from\
    \ him without the ability to properly balance it will subsequently be turned to\
    \ stone and into a frog)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
