    - field: weaknesses
      value: His reckless actions and strong temper usually threaten his life to the
        point he's called a 'suicidal blockhead'. He has a strong dislike to people
        that don't intend to be free, or just people that don't share his opinions.
        These issues later get fixed once he learns the truth of his father's basement,
        he can potentially be killed. Since Titan transformations require a clear
        goal in the user's mind to transform and transformations require wounding
        their human body to trigger it, they can be severely wound themselves if their
        mind is clouded from their goal. This is demonstrated when Eren hurts himself
        multiple times while attempting to transform against Annie in their battle,
        he will be unable to transform until said injury has healed (like when he
        was captured in the forest with Reiner, Bertholdt, and Ymir, he couldn't transform
        due to his severed limbs having not fully healed yet), Eren initially couldn't
        control his Titan body and was prone to becoming berserk, even attacking comrades
        like Mikasa. Using his Titan body for long amounts of time can render him
        unconscious, those with the power of the Titans appear to be, resistant to
        the normal absorption that creates mindless Pure Titans. However, this does
        not mean that they are immune to it. In Eren's case, repeated transformations
        in a short period of time lead to decreased control over the Titan form, as
        well as diminished Titan size and power. As such, it seems that there is a
        limitation on how long a human can remain in a transformed Titan state before
        risking absorption. If he loses the will to live, his regenerative factors
        won't work. Speaking of regeneration, regenerating from severe injuries such
        as lost limbs can strain his powers and prevent him from transforming, like
        all Shifters. Eren suffers from the Curse of Ymir, which limits every Shifter's
        lifespan to 13 years after first acquiring the Titan, before they weaken and
        eventually die. In Paths, Eren couldn't see all of the future in his father's
        memories and also didn't know he couldn't use the Founding Titan's powers
        in it.
      source_id: character-stats-profiles-chappil-anime
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
