    - field: standard_equipment
      value: "Arm Weapons are generally the weakest of Vile's weapons, but their high\
        \ firing rate and low energy usage means they can deal a large amount of damage\
        \ over time. They are also the only weapons he can use while still clinging\
        \ to a wall:, frameless Vulcans: Vile's standard Arm Weapons. They are gatling\
        \ guns hidden within Vile's hands, firing bullets from his fingertips. While\
        \ individually weak, they have a high firing rate and boast great damage-per-second,\
        \ frameless Missiles: Launched from Vile's elbow, requiring him to detach\
        \ an arm in order to fire. They offer more power than Vulcans, frameless Rocket\
        \ Punches: Vile's launches his fist as a projectile before it quickly returns\
        \ to him, similar to the Mega Arm. This type of weapon is powerful, but can\
        \ only be fired one at a time, Shoulder Weapons are of middling strength,\
        \ they are best used against airborne enemies. Furthermore, if used in the\
        \ air they will cause Vile to hover while firing, decreasing their firing\
        \ time. This technique can also be used to extend the horizontal distance\
        \ of Vile's jumps. If used on a ladder or wall, they put Vile into an aerial\
        \ state:, frameless Cannons: Vile's standard Shoulder Weapons. They fire spherical\
        \ blasts of energy from the barrel, frameless Lasers: Are larger streams of\
        \ energy rather than condensed blasts. They are similar to Cannons, frameless\
        \ Cutters: Are boomerang-like energy blades launched from Vile's barrel, Leg\
        \ Weapons are generally the most powerful of Vile's weapons, but they cause\
        \ Vile to stop while launching them, leaving him open to attack. However,\
        \ like Shoulder Weapons, if used in the air they will cause Vile to hover\
        \ while firing, decreasing their firing time. This technique can also be used\
        \ to extend the horizontal distance of Vile's jumps. If used on a ladder or\
        \ wall, they put Vile into an aerial state:, frameless Napalms: Vile's standard\
        \ Leg Weapons. They launch explosives that burst with different effects, frameless\
