    life to summon an otherworldly spectre. As they begin the hand seals, green seals
    spread across their body, and the user prays to the spectre. The jutsu turns the
    user into a red gemstone that then fuses with the spectre, turning it into a golem
    and creating an enormous barrier around its targets. *Chakra Absorption: The golem
    has the ability to absorb chakra from any living thing it touches. ==Notable Matchups==
