    - field: weaknesses
      value: "None Notably | its Darkspine form manifests as more violent. Notable\
        \ Attacks/Techniques: *Fourth Wall Awareness: *When the player isn't moving\
        \ him for a moment, Sonic's idle animation gets annoyed with the player, tapping\
        \ his foot while looking at the screen, showing boredom, stretching to be\
        \ on the move again, and had outright left due to becoming impatience in Sonic\
        \ CD that causes a Game Over. |-|Base Sonic \u25BE= -Attacks= File:Homing\
        \ attack.gif |One of Sonic's most common methods of attacking an enemy. File:Sonic\
        \ flying kick.gif|A stronger attack that Sonic can use when the Homing Attack\
        \ isn't enough. File:Sonic light speed attack.gif|After a small charge-up,\
        \ Sonic glows and launches the Light Speed Attack to hit all enemies near\
        \ him. File:Sonic Wind.gif |With simply a raise of his hand, Sonic launches\
        \ the Sonic Wind technique. File:Sonic magic hands.gif |Sonic using the Magic\
        \ Hands to trap an enemy. *Air Kick: Sonic jumps into the air and kicks out\
        \ to counter an aerial combatant. *Air Spin: Sonic jumps into the air, curling\
        \ into a ball to counter an aerial combatant in a manner reminiscent to the\
        \ Spin Jump. *Blue Tornado: Sonic uses the Spin Dash to encircle around opponents\
        \ through midair while leaving a blue trail. The resulting slipstream creates\
        \ a tornado effect that forms a blue cyclonic vortex of air around the opponent.\
        \ This can yank the opponents off their feet and fling them into the air,\
        \ disorient enemies, or blow away their weaponry or equipment. *Bound Jump:\
        \ In mid-air, Sonic curls into a ball and performs the Spin Attack straight\
        \ downwards to slam down on any target below him. If he impacts the ground,\
        \ Sonic will be propelled back into the air with enhanced jumping height.\
        \ *Chao"
