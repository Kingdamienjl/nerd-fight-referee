  section: weaknesses
  axis: weakness
  text: 'Can be stunned by bright lights and powerful shouts. Prone to taunting her
    opponents. Incredibly narcissistic and competitive, though can also be insecure
    at times. Cannot see in her shattered state due to lacking her eyes which forces
    her to rely on her hearing to get around. Consequently, this makes her even more
    insecure and will lash out in rage at the slightest sound. ==Notable Matchups==
