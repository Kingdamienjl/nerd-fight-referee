    Nights At Freddy''s Category:Genderless Characters Category:Game Characters Category:Video
    Game Characters Category:Indie Game Characters Category:Horror Characters Category:Bodily
    Weaponry Users Category:Enhanced Senses Users Category:Information Analysis Users
    Category:Musicians Category:Narcissists Category:Robots Category:Wolves Category:Immortals
    Category:Self-Sustenance Users Category:Inorganic Beings Category:Antagonists
    Category:Blind Characters Category:Primary Antagonists Category:Tragic Characters
    Category:Reformed Characters Category:Disabled Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-cc180ed3
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Bodily Weaponry (Teeth and claws), Self-Sustenance
    (Types 1, 2, and 3), Immortality (Type 2; Comparable to other Glamrock animatronics
    and can still function after having her eyes removed and her body wounded by a
    high speed go kart), Inorganic Physiology (Type 2), Enhanced Senses (Stated to
    "see things differently" compared to the other animatronics to where she can see
    hidden objects and movement through walls. Upon receiving her eyes, Freddy states
    that he sees new colors which implies infrared and/or ultraviolet vision. She
    is also able to see things that are invisible and, like Glamrock Freddy, should
    be able to see Vanny despite her suit preventing animatronics from seeing her
    normally), Information Analysis (Like the Toy animatronics, she has a built-in
    facial recognition software designed to identify registered customers in the pizzaplex),
    after getting shattered she gains Resistance to: Light Manipulation (Due to lacking
    her eyes), Extreme Heat/Cold (Comparable to Glamrock animatronics such as Glamrock
    Freddy, who withstands the temperature that can be as high to melt dense ice blocks
    or as cold to freeze metal, which fluctuation he refered as extreme), Electricity
    and Water Manipulation (Advanced animatronics aren''t affected by short-circuits
    caused by water and electrical charges, as they can submerge in a sewer and resist
    several electrocutions, even without their casings)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
