    - field: weaknesses
      value: "Margueritte Bois de Justice's curse will not work if the blade makes\
        \ contact with anywhere else that isn't the neck. Most of the standard Apostle\
        \ weaknesses. Eine Faust Scherzo's effect only works against those of the\
        \ dead, Same as before, minus the weakness about Eine Faust Scherzo. Is initially\
        \ afraid of emanating over creation and stops himself from doing so until\
        \ he discusses it with Marie, Standard Had\u014D God weaknesses. Upon the\
        \ death of his father, Ren will lose every trace of his divinity, None notable\
        \ Notable Attacks and Techniques: Yetzirah Margueritte Bois de Justice: The\
        \ Ahnenerbe of Ren, a Fusion Type Ahnenerbe. It is the guillotine that was\
        \ used during France's Reign of Terror, a murderous tool that killed many\
        \ counter-revolutionaries in those times. The guillotine was also the catalyst\
        \ that brought Marie into the world in her original life as a human, as well\
        \ as the same tool that brought about her end as soon as she reached adulthood.\
        \ It is thus the only tool in all of creation that can house her soul outside\
        \ of her personal domain of the Twilight Beach. Not only is this an Ahnenerbe\
        \ that can harm the very soul itself like all Ahnenerbe, but it can even allow\
        \ Ren to utilize Marie's curse. Said curse, one which caused anyone who comes\
        \ into contact with her or those she touches to be instantly decapitated,\
        \ became even more powerful due to Marie's soul ascending to that of a Gud\u014D\
        \ God. Thus by weaponizing this curse, Ren can instantly decapitate his target\
        \ by merely making contact with one's neck, even bringing an end to their\
        \ life regardless of their immortality or regeneration. Due to Marie's soul\
        \ being housed in there, Marie herself can take over Ren's body in certain\
        \ situations such as preventing him from having a mental breakdown, derived\
        \ from his desire \u201CI want to experience this moment for an eternity\u201D\
        . Inspired by his experience being in the Twilight Beach and wanting to enjoy\
        \ his plain yet simple daily life of normality a little longer, this desire\
        \ manifests itself in the form of slowing down his perception of time, this\
        \ allows Ren to perceive things as \"frozen\", with even something like lightning\
        \ itself appearing no more than being completely still in his world with his\
        \ first use of his Ber'iah. Ren can slow down time as many times as he wants,\
        \ from slowing it down by ten to as much as a thousand times, even reaching\
        \ as much as three thousand times when Marie was controlling Ren during Rea's\
        \ route. With a world only he himself can perceive, Ren can accelerate himself\
        \ and slow down time to the point of all things appear to be slowed to a near\
        \ halt. This is the result of a power that, limited only by his willpower,\
        \ can enable him to accelerate without limit and to have time halt to be in\
        \ that everlasting moment. Eine Faust Scherzo: Ren\u2019s Had\u014D Ber'iah\
        \ in Kei's route, derived from his desire while using Beatrice's Ahnenerbe\
        \ \"I do not want the dead to live\". A desire born to reject anyone of the\
        \ undead, Eine Faust Scherzo ability is to deny the \"very concept of death\"\
        . What this means is it allows Ren to kill anyone who is undead, a world that\
        \ rejects anyone that should have died in the first place. In short, Ren can\
        \ destroy immortal and undead beings and have them stay dead for good, making\
        \ it a very powerful ability against any who are not of the living, a castle\
        \ that houses the millions of dead souls Reinhard has devoured, with it slowly\
        \ dismantling the hell of infinite resurrections. However, Ren can only exercise\
        \ this power when facing off those who are not of the living, he can only\
        \ rely on Beatrice's Ahnenerbe to fight. Additionally, Ren's Scherzo Ber'iah\
        \ prevents any potential souls he would have otherwise had, obtained after\
        \ gaining power directly from Mercurius due to his connection to him through\
        \ a fusion of the latter's divine blood and Lotus' soul. It is similar to\
        \ Wilhelm's Ber'iah as a hybrid of both Had\u014D and Gud\u014D, with the\
        \ symbol of the Snake of Mercury glowing on his body along with having multiple\
        \ guillotine blades protruding from his back which he can use"
