    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Weapon Mastery (Extremely skilled
        swordsman with over 10,000 hours of training), Acrobatics, Shockwave Creation
        (His sword strikes can kick up shock waves that he uses to attack), Magic
        & Fire Manipulation (The main magic affinity, and the most compatible affinity
        that Caim has that he is the most efficient with is fire), Energy Manipulation,
        Creation, Reality Warping, Law Manipulation, Physics Manipulation, Mind Manipulation
        & Memory Manipulation (As a resident of Midgard, Caim can manipulate magic
        particles that are known in the parallel world of NieR Replicant as Maso.
        Maso is a mystical, extra-dimensional element that can be manipulated to harness
        energy from other worlds, allows the wielder to warp reality and break the
        laws of physics. In addition, this process, known as "magic," allows for the
        creation of "something from nothing". In Midgard, Magic works by drawing the
        magic particles by drawing on energy from across the multiverse, so it is
        fundamentally different from what we typically call magic. In addition, magic
        uses the naturally occurring magical particles, Maso, in the world, so even
        ordinary people can use it if they train), Durability Negation (Maso allows
        its user to penetrate all kinds of defenses), Quantum Manipulation, Information
        Manipulation & Duplication (Maso correlates with quantum mechanics, and thanks
        to this connection is able to recollect the history of the world, and the
        information of everyone in it, thus, being able to create perfect copies of
        someone thanks to that information), Automatic Translation (Maso allows its
        user, such as Pods, to translate angelic language), Extrasensory Perception
        (All characters demonstrated an ability to sense things in the environment),
        Soul Manipulation, Fusionism, Empowerment, Healing & Resurrection (As a resident
        of Midgard, Caim can naturally perform the Pact with a non-human side to gain
        more power at the cost of the most precious thing to him, either a habit or
        1 of his senses. Pacts are generated through the fusionism of souls between
        the Pact-partners. By merging their souls together, the 2 sides gain supernatural
        powers, and both participants gain a second chance in life should either or
        both be close to death, or if 1 of the sides is already dead) Same as before,
        Advanced Weapon Mastery (Can now use any other weapon efficiently the moment
        they drop in his hands), Advanced Magic (Can use other magic affinities with
        various effects depending on the weapon he wields), Statistics Amplification
        & Reactive Power Level (Due to his Pact with Angelus, Caim became far stronger,
        faster and more durable than the average soldier in the Drakengard World.
        Some of his weapons enhance his stats. In Drakengard, he grew so strong in
        a short amount of time to the point that he was able to kill Chaos Dragon
        Form Angelus in Branch C who was able to briefly wrestle the Grotesqueries
        in Branch D & defeat Queen-Beast in Branch E), Limited Telepathy (With his
        Pact-Partner, Angelus. Angelus translates the words of Caim through their
        telepathic link due to his inability to talk as their Pact costed Caim his
        voice), Space-Time Manipulation, Causality Manipulation, Conceptual Manipulation
        (Type 2), Law Manipulation & Fate Manipulation (Caim is a Singularity, an
        individual that is capable of exerting immense influence on the world, triggering
        the Branch phenomenon, which creates an individual world of its own independence
        with its own space and time, which was created as a result of the actions
        of the Singularity, with its own unique future unfolding later on. Branch
        phenomena occur when a singularity is present under conditions of sufficiently
        high magical particle concentration, referred to as Maso, combined with the
        actions taken by the Singularity, which leads to alternate possibilities and
        different futures from the original world), Fire Manipulation & Danmaku (Via
        Caim's Sword, Dragonhook, Glory's Bane, Kingsblood, Flameberge, Moonfire,
        Skald's Song, Takamasa, Battlelust, Knight's Vow, Robber King, Victor's Spoils,
        Crimson Hood, Executioner's Song, Foul Blade, Poisontongue, Iron Scraps, Pupil's
        Club, Sorrow's Companion, Spiked Wisdom, Dragonstorm & Souldouser), Statistics
        Amplification & Forcefield Creation (Via Butcher's Joy, Swordsmasher, Guardian's
        Sorrow, Soldier's Sword, Takamasa, Devilscale, Carrion-maker& Skull Banquet),
        Soul Manipulation & Energy Manipulation (Via Deathdance, Demonbane, Greed's
