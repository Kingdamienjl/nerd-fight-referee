        was matched only by Gudou Marie. In addition, Ren draws power directly from
        Mercurius in Eine Faust Finale. | Can and will eventually reach Extraverse
        Level (Ren is capable of emanating his law, but chooses not to out of fear
        of its effects, only changing his mind after a conversation with Marie.) |
        Extraverse Level (Taikyoku is the origin of all concepts and phenomena, including
        even duality itself. The singularity exists as an infinite abyss of colorless
        Taikyoku, disconnected and completely transcendent of the laws of creation.
        Said laws themselves govern all concepts, no matter how simple or complex
        they are. The singularity is referred to as an "endless downfall" and when
        one layer is bypassed, you just go through another one which goes without
        any end. Each layer or "hole" transcends the former as the first does the
        Multiverse, of which there are infinite. Additionally, within each layer exists
        an infinite existential hierarchy, similar to that of an infinite ladder in
        which each "step" or "foot" requires one to synchronize their soul and drive
        themself to a deeper and higher level of existence. Higher levels would essentially
        transcend lower levels as they do the multiverse. The singularity exists as
        a blank slate/canvas for the gods, with their relationship to it being similar
        to the relationship they (and by extension the singularity) have with all
        of creation, which exists as nothing, but a canvas for them to paint over.
        Gods hold a qualitative transcendence over it as it is shown that any Atziluth
        user can fill the singularity with their Taikyoku, which would mean that they
        exist above and outside all expansions of said cosmological figure in the
        same manner to the way they transcend the rest of the cosmology. The throne,
        the pinnacle of the cosmology, exists as a "hyper dimensional" realm beyond
        all definition and language entirely, being the destination of Yakou's travels
        and beyond the infinite layers of the singularity. It exists to prevent the
        destruction of all of existence from the throne god's presence, helping them
        channel their Taiji. Gods, however, have shown numerous times to being capable
        of destroying the throne and even instances of Throne gods painting over and
        encompassing the throne when they overthrow their predecessor, meaning that
        they transcend the throne itself as much as they would the rest of the cosmology
        as well. A god of higher taikyoku reigns supreme no matter what, being completely
        impossible to affect even if heaven and earth was turned over (ie. the top
        and bottom of the territory within the god's domain), with higher taikyoku
        gods being considered transcendent over weaker gods, so the transcendence
        that a higher god holds over a lower one is likely immeasurably greater than
        the scale that the entire cosmology exists on. At his peak, Ren has 90 Taikyoku
        and is equal with Mercurius and Reinhard, making him one of the strongest
        possible Hadou Gods to exist.) | Extraverse Level, unfathomably higher when
