- id: claim-weaknesses-22bade78
  section: weaknesses
  axis: weakness
  text: She is easily trusting of others and, as a result, can be quite naive. She
    can also be careless and stubborn at times. Her internal parts are far more vulnerable
    to damage than her external parts. She quickly shuts down if her power source
    is cut off, but she can compensate somewhat with solar panels and backup batteries.
    She is more vulnerable to electrical, magnetic and sometimes water-based attacks
    (Varies from briefly shortcutting her to rusting her whole body though on few
    occasions it doesn't have ill effects on her). Her regeneration is based on reattaching
    body parts or replacing them with spare ones. This won't work if her body parts
    are too damaged/far away, and she carries a limited amount of spares at the time.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-1e12a73e
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Inorganic Physiology (Type 2) **Self-Sustenance
    (Types 1 & 2) **Space Survival (Can survive in space) **Longevity **Immortality
    (Types 2 & 3) **Regeneration (Limited High-Mid; Can reacttach parts of her body
    as long as they aren''t too damaged) **Enhanced Senses (Demonstrated here, has
    Electromagnetic, X-Ray, Infrared and Ultraviolet Vision) ***Radar (Can track flying
    objects with her radar) **Acrobatics (Shown here) *Genius Intelligence (Can access
    all the information from the Internet) **Multilingualism *Reactive Evolution (She
    was controlled by the symbiotic skin throughout most of the episode, until she
    finally showed restraint) *Martial Arts (Capable hand-to-hand combatant) *Body
    Control (Can control her robotic body in many different ways. Can reacttach her
    head) **Bodily Weaponry & Weapon Mastery (Has a wide arsenal of weapons and technology
    which she weilds with considerable skill, including Guns, Saws, Engines, Maces,
    Drills, Blades, Shield, Claws, Axes, Power Fists, Hammers, Knives, Razors, Flails,
    Crossbow, Grappling Hook etc. Among miscellaneous objects are ladder, phone, cleaning
    equipment, signs, speakers, pencil sharpener, monitors, swiss army knife etc.
    Can create armor) ***Limited Attack Reflection (Can reflect lasers with her shields)
    ***Energy Projection (Can shoot energy from her hands, eyes, hair, feet, chest
    and laser guns) ***Plasma Manipulation (with Plasma Blaster) ***Explosion Manipulation
    (with missiles) ***Magnetism Manipulation (Can form her body into a magnet strong
    enough to pull a van) ***Stun Attack (with Stun Grenade Gun) ***Fire Manipulation
    (Via Flamethrower) ***Heat Manipulation (With Heat Gun) ***Ice Manipulation (Can
    freeze individuals, extinguish flames and shoot snowballs) ***Limited Water Manipulation
    (Can shoot water out of her body when connected to a water source) ***Electricity
    Manipulation ***Limited Air Manipulation (Can generate powerful winds with giant
    fans) ***Healing (Can heal others) **Flight & Spaceflight (Can fly via jets, as
    well as fly through space) **Light Manipulation **Additional Limbs (Can generate
    additional arms and legs) **Digit Manipulation **Shapeshifting **Transformation
    (Can transform into a jet, an excavator, a submarine and a bulldozer) **Spin-Dash
    (Can perform a spinning dash maneuver) **Elasticity (Can extend her arms, as well
    as her neckS3E4 Weapons of Mass Destruction) **Limited Creation (Can generate
    ammunition from her body) *Sound Manipulation (Can scream loud enough to shatter
    glass) *Aura (Shown here) *Toon Force **Hammerspace (Can hide in places much smaller
    than her. Is bigger from the inside than outside since her body carries inside
    herself weapons bigger than her) **Elasticity (Can survive & reform after getting
    flattened) **Possibly Gag Teleportation (Appeared in the bathroom before Tuck
    did, although it could be alluded to her being much faster) **BFR/Plot Manipulation
    (Accidentally threw a girl far away at the start of an episode & the girl only
    lands in the blackscreen after the episode ends, with several days passing during
    the episode)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
