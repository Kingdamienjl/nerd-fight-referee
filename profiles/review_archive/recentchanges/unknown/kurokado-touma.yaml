- id: claim-weaknesses-b801253d
  section: weaknesses
  axis: weakness
  text: 'Erosion is a power that comes with massive risk as the world doesn''t allow
    the falsification of itself, thus it will inevitable try and correct whatever
    was eroded. This doesn''t work in parallel worlds such as the Divide however,
    nor on actual people, as the world only fixes Erosion to the world itself and
    not individuals. Notable Attacks/Techniques: *Erosion/Direct Tune/Data Erosion/Caligula/Tyranny:
    An extremely peculiar power that devils and specially powered people possess.
    It is the power to Erode the world. It manipulates the smallest component of the
    world, data, and is capable of rewriting it. In other words, a power capable of
    twisting substances, the traits of creatures, and furthermore even the physical
    laws. *Mimicry: One of the abilities of a "True Cognate", it allows the user to
    copy the fighting styles and abilities of those they see. ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== Category:Characters Category:Male
