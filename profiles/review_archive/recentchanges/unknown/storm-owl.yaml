        to an opponent., Frost Giant: Summons a Lesser Ice Titan which attacks all
        enemies surrounding Morganthe and freezes them for 30 seconds., Lord of Winter:
        Deals large amounts of damage to the opponent and drains power (in the form
        of Pips) from them., Frost Demon: Summons an elephantine demon to attack an
        opponent with their sword., Black Mantle: Decreases an opponent''s accuracy.,
        Mana Burn: Drains power from an opponent (in the form of Pips), with damage
