        the Shadow Magic user based on their overall health. The damage done by backlash
        will ignore all resistances and shields, Fought evenly against Malistaire
        Drake while still a student of Ravenwood., Lead the Umbra Legion in a war
        against the Celestians, who summoned [[The Storm Titan (Canon, Wizard101)/Ben
        CleverName, Compelled her minions into fighting the war against the Celestians
        forever, even in death, without surrendering., Conquered the Eclipse Tower
        and corrupted the Moon Magic inside the tower with Shadow Magic., Destroyed
        the Radiant Alcazar by throwing it down from the Celestial Heavens and pulling
        the stars from the sky., Cast a spell that transformed all within Bastion
        into crystal., Cursed someone with eternal life, making it so that everything
        they touch turns into sand., Resurrected the spirit of Neza the Poet and forced
        it to attack the Wizard., Used the Song of Creation to corrupt the Broodmother
        and have her attack the Wizard., Forced the comet Xibalba to strike Azteca
        after mastering Astral Magic, Sirens: Summons the Sirens, a triad of monsters
        from the sea. Once summoned, the Sirens will sing a deadly song, causing damage
        to Morganthe''s enemies. Then, they will reduce the opponents'' accuracy.,
        Storm Owl: Summons a giant owl to attack opponents through electricity, dealing
        massive amounts of damage., Enfeeble: Removes all positive charms from an
        opponent., Storm Dragon: Summons a Dragon that breathes electricity onto an
        opponent, Lightning Strike: Adds a Storm accuracy charm., StormBlade: Adds
