        a Storm damage ward to all opponents., Legion Shield: Adds a negative damage
        ward to Morganthe and her duplicates., IceBlade: Adds an Ice damage charm.,
        Ice Trap: Adds an Ice damage ward., Handsome Fomori: Attacks an opponent with
