- id: claim-weaknesses-f16a2b87
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques: Kiba: Kiba (\u7259, Literally meaning:\
    \ Fangs) is one of the famous mystical swords of the Seven Swordsmen of the Mist.\
    \ The swords have been imbued with lightning, granting enhanced cutting power\
    \ in a manner similar to the high-frequency vibrations of lightning-based chakra\
    \ flow. It is this capability that has resulted in these \"thunderswords\" (\u96F7\
    \u5200, rait\u014D) being claimed as the sharpest swords in existence. Even without\
    \ lightning, they are very dangerous in battle, able to be used in combination\
    \ with agile spinning movements, sweeping through the targets while the user also\
    \ rotates. This, combined with the jagged nature of the blades, allows for more\
    \ damaging wounds inflicted. The user can transform and manipulate lightning freely,\
    \ even perform their Lightning Release techniques without hand seals. They also\
    \ boost the user's attack power to the highest limit, which allows them to perform\
    \ high-level Lightning Release techniques with a minimal cost of chakra. Raiton\
    \ (Lightning Release): One of the basic elemental nature transformation techniques\
    \ that allows the user to generate lightning by increasing the high frequency\
    \ vibrations of their chakra, allowing for piercing damage and fast movement.\
    \ The electricity paralyses the target so that they are unable to move and leave\
    \ them vulnerable to a finishing strike. While uncommon, lightning can be infused\
    \ into bladed weapons in a way similar to Wind Release through chakra flow for\
    \ increased the piercing power through vibrations, with the added effect of inducing\
    \ numbness. *Lightning Ball: Buntan creates a large amount of lightning balls\
    \ and launches them at her enemy. *Thunder Funeral: Feast of Lightning: Buntan\
    \ generates lightning with her whole body and launches the lightning bolt at her\
    \ enemy. *Lightning Fish: Buntan produces a large shark-like structure of lightning\
    \ that travels independently under water, striking at the target it is locked\
    \ on to. *Thunder Armour: Buntan cloaks herself with lightning, thus amplifying\
    \ her physical characteristics. Silent Killing: As the name suggests, this technique\
    \ is simply a soundless method of killing an opponent, usually from behind with\
    \ a blade. Additionally, because the user moves silently, the attack cannot be\
    \ anticipated and defended against. The user will often slit their opponent's\
    \ throat, preventing any cry that might give them away. Some shinobi also opt\
    \ to use a cover such as mist or even frost to rob their opponents of their field\
    \ of vision and then attack them. ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ ==References== ==Notes/ExplanationS== Category:Characters Category:Naruto Category:Anime\
    \ Characters Category:Boruto Category:Chi Users Category:Duplication Users Category:Electricity\
    \ Users Category:Energy UsersCategory:Extrasensory Perception Users Category:Enhanced\
    \ Senses Users Category:Female Characters Category:Free Movement Users Category:Healers\
    \ Category:Illusionists Category:Manga Characters Category:Paralysis Users Category:Shapeshifters\
    \ Category:Smoke Users Category:Statistics Amplification Users Category:Surface\
    \ Scalers Category:Sword Users Category:Teenagers Category:Vibration Users Category:Adults"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-35c55108
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, A very skilled swordswoman
    and fighter, Chakra Manipulation, Statistics Amplification (Shinobi are capable
    of enhancing their physical capabilities with the use of chakra. The Shunshin
    no Jutsu allows Shinobi to greatly enhance their speed by focusing chakra in their
    feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and
    Water Walking (By focusing chakra at the soles of their feet, Shinobi can scale
    and cling to vertical surfaces, and even walk on waterNaruto Chapter 18Naruto
    Chapter 90), Afterimage Creation, Stealth Mastery, and Speed Enhancement (The
    Substitution Jutsu allows its user to instantly replace themselves with a nearby
    object such as a tree log, plant, person, or clone at the exact moment they are
    attacked. The Jutsu works even if the user is physically restrained or observed
    by characters as observant as Sharingan or Sage Mode users. This creates the optical
    illusion of the user being hit, which confuses the opponent and gives them an
    opening to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter
    374Naruto Chapter 580Naruto Chapter 674), Minor Illusion Creation and Duplication
    (With the Clone TechniqueRin no Sho, Page 220, Shinobi can create illusionary
    duplicates of themselves that have no physical substance), Shapeshifting (With
    the Transformation Technique, Shinobi can transform themselves into other people,
    animals, plants, and even inanimate objects, such as weapons), Paralysis Inducement
    (With the Temporary Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely
    paralyze their targets from close to mid range), Electricity Manipulation, Mist
    Manipulation with Silent Killing, Vibration Manipulation (via lightning style)
  source_ids: *id003
  decisive: true
