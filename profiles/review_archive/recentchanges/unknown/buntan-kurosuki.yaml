    - field: weaknesses
      value: "None notable Notable Attacks/Techniques: Kiba: Kiba (\u7259, Literally\
        \ meaning: Fangs) is one of the famous mystical swords of the Seven Swordsmen\
        \ of the Mist. The swords have been imbued with lightning, granting enhanced\
        \ cutting power in a manner similar to the high-frequency vibrations of lightning-based\
        \ chakra flow. It is this capability that has resulted in these \"thunderswords\"\
        \ (\u96F7\u5200, rait\u014D) being claimed as the sharpest swords in existence.\
        \ Even without lightning, they are very dangerous in battle, able to be used\
        \ in combination with agile spinning movements, sweeping through the targets\
        \ while the user also rotates. This, combined with the jagged nature of the\
        \ blades, allows for more damaging wounds inflicted. The user can transform\
        \ and manipulate lightning freely, even perform their Lightning Release techniques\
        \ without hand seals. They also boost the user's attack power to the highest\
        \ limit, which allows them to perform high-level Lightning Release techniques\
        \ with a minimal cost of chakra. Raiton (Lightning Release): One of the basic\
        \ elemental nature transformation techniques that allows the user to generate\
        \ lightning by increasing the high frequency vibrations of their chakra, allowing\
        \ for piercing damage and fast movement. The electricity paralyses the target\
        \ so that they are unable to move and leave them vulnerable to a finishing\
        \ strike. While uncommon, lightning can be infused into bladed weapons in\
        \ a way similar to Wind Release through chakra flow for increased the piercing\
        \ power through vibrations, with the added effect of inducing numbness. *Lightning\
        \ Ball: Buntan creates a large amount of lightning balls and launches them\
        \ at her enemy. *Thunder Funeral: Feast of Lightning: Buntan generates lightning\
        \ with her whole body and launches the lightning bolt at her enemy. *Lightning\
        \ Fish: Buntan produces a large shark-like structure of lightning that travels\
        \ independently under water, striking at the target it is locked on to. *Thunder\
        \ Armour: Buntan cloaks herself with lightning, thus amplifying her physical\
        \ characteristics. Silent Killing: As the name suggests, this technique is\
        \ simply a soundless method of killing an opponent, usually from behind with\
        \ a blade. Additionally, because the user moves silently, the attack cannot\
        \ be anticipated and defended against. The user will often slit their opponent's\
        \ throat, preventing any cry that might give them away. Some shinobi also\
        \ opt to use a cover such as mist or even frost to rob their opponents of\
        \ their field of vision and then attack them. ==Notable Matchups== Victories:\
        \ Losses: Inconclusive: ==References== ==Notes/ExplanationS== Category:Characters\
