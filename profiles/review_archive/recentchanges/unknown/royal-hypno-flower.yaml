        Identical to Sunflower Queen''s version. * Hypno Tether: Attaches a beam onto
        the zombie that makes their vision blurred, and makes them move closer to
        it so she can use her Vine Whip. Identical to the Hypno-shroom''s form of
        offense but deals greatly increased damage. * Hypno Aid: Summons 3-4 Hypno-shrooms
        as support enemies. * Super Goatify: Only used every time the boss loses one-quarter
        of its health, the Royal Hypno-Flower roots in place, charging energy. During
        this time, she is highly vulnerable, but after she fires the attack, it transforms
        all Zombies into Stinky Goats (albeit pink in color). In order to dispel the
        effect, the Zombies must eat a decorative plant called the "Poly Leaf" which
        appears in randomly chosen spots throughout the map. As the boss becomes more
