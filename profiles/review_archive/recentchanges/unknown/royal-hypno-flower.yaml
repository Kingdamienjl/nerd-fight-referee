- id: claim-weaknesses-90469989
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: * Hypno Vine Whip: Lashes out twice
    in front of her with her arms, dealing damage and knocking back targets. Identical
    to Sunflower Queen''s version. * Hypno Tether: Attaches a beam onto the zombie
    that makes their vision blurred, and makes them move closer to it so she can use
    her Vine Whip. Identical to the Hypno-shroom''s form of offense but deals greatly
    increased damage. * Hypno Aid: Summons 3-4 Hypno-shrooms as support enemies. *
    Super Goatify: Only used every time the boss loses one-quarter of its health,
    the Royal Hypno-Flower roots in place, charging energy. During this time, she
    is highly vulnerable, but after she fires the attack, it transforms all Zombies
    into Stinky Goats (albeit pink in color). In order to dispel the effect, the Zombies
    must eat a decorative plant called the "Poly Leaf" which appears in randomly chosen
    spots throughout the map. As the boss becomes more damaged, more Poly Leaves are
    required to dispel this effect. ==Gallery== File:Royal Hypno Flower in game.png
    File:Royal Hypno Flower body.png File:Royal Hypno Flower face.png ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== Category:Plants vs. Zombies Category:Plants
    Category:Transmutation Users Category:Game Characters Category:Underground Mobility
    Users Category:Fungus Users Category:Mind Users Category:Perception Users Category:Summoners
    Category:Death Users Category:Large Sized Characters Category:Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-f31db8d1
  section: abilities
  axis: hax
  text: '* Plant Physiology (Bosses) * Underground Mobility (Can move in the underground)
    * Transmutation (layered 3 Can transform all Zombies into Stinky Goats; can transform,
    zombies and z mechs that resist transmutation into goats) * Death Manipulation
    (Can instantly kill goats) * Fungus Manipulation (Can shoot spores at enemies)
    * layered Non-Physical Interaction (Can turn scientists from pure balls of energy
    into goats despite other plants and forms of transmutation being incapable of
    interacting with them in this state) * Forcefield creation (she can create a force
    shield around themselves to protect themselves from attacks while charging up
    and during goat purge) * layered Mind Manipulation/Perception Manipulation (Attaches
    a beam onto the hero zombies that makes their vision blurred, and makes them move
    closer to it so she can use her Vine Whip, comparable to Hypno-shroom)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
