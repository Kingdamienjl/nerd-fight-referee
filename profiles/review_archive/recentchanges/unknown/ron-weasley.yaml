    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Athletic Human with Subsonic reactions via power-scaling, Speed of Light\
      \ attack speed via Lumos Solem (Lumos Solem is a charm that creates a blinding\
      \ flash of sunlight used to defend against the Devil's Snare. Ron should know\
      \ this spell, as it\u2019s implied to be taught in basic herbology to defend\
      \ against the Devil's Snare and advanced charms class, and first years like\
