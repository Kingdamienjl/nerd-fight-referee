  attack_potency:
    text: Street level physically (Comparable to Harry Potter and Beaters. Slammed
      a train compartment door so hard that the glass shattered). At least Small Building
      level (Hogwarts students learned the Freezing Spell in their third-year), likely
      Building level (Comparable to Hermione Granger, Luna Lovegood, and Ginny Weasley;
      and they were able to match Bellatrix Lestrange together) with magic. Some spells
      ignore conventional durability.
    source_ids:
