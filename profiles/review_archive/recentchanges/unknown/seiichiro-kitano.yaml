        \ pressure points that he can't hit or has pressure points in different locations\
        \ such as Heart and Souther, Kenshiro can be hit while using Mus\u014D Tensei\
        \ if the opponent can attack with nothingness as Kenshiro can or who can nullify\
        \ his ability to use Mus\u014D Tensei Notable Attacks/Techniques: * Hokuto\
        \ Shinken (Divine Fist of the North Star): Kenshiro is the chosen successor\
        \ of a 1,800-year-old martial art known as Hokuto Shinken. The main ability\
        \ of Hokuto Shinken is to hit pressure points on the opponent's body to affect\
        \ their body, there 708 pressure points on the human body and depending on\
        \ what pressure point is hit a different effect will happen. ** Seikyokurin\
        \ (Saint Zenith Ring): Seikyokurin is a stance which Kenshiro takes in order\
        \ to let his opponent know that he does not want to fight them. This is useful\
        \ since it does not require Kenshiro to speak which may alert any onlookers\
        \ that Kenshiro and his opponent are planning something. ** Tenha no Kamae\
        \ (Heaven Breaking Stance): Tenha no Kamae is a stance where Kenshiro moves\
        \ his arms in the shape of the Big Dipper. This stance is only used when Kenshiro\
        \ is fighting an opponent who is equal to him in strength, speed and skill.\
        \ ** Tenki Sh\u014D (Return to Heaven Palm): Tenki Sh\u014D is a gesture that\
        \ Kenshiro makes before fighting a worthy opponent to let them know that their\
        \ battle will be an honourable one and that Kenshiro means no ill will towards\
        \ them. ** Hyakuretsu Dan (Hundred Crack Snap): Hyakuretsu Dan is a technique\
        \ where Kenshiro punches the opponent one hundred times within a short amount\
        \ of time while hitting various pressure points over their body. This technique\
        \ is a prototype of the Hokuto Hyakuretsu Ken. ** Hiei Ken (Flying Defence\
        \ Fist): Hiei Ken is a technique where Kenshiro delivers a flying kick with\
        \ the intention of defending against other flying kicks. ** Hokuto Hyakuretsu\
        \ Ken (North Star Hundred Rending Fist): Hokuto Hyakuretsu Ken is a technique\
        \ where Kenshiro strikes an opponent one hundred times which hits various\
        \ pressure points, causing the opponent to violently explode. ** Nishi Shink\u016B\
        \ Ha (Two-Finger Nil-Space Grasp): Nishi Shink\u016B Ha is a technique where\
        \ Kenshiro grabs an arrow that was shot at him by an opponent before it hits\
        \ him and throws it back at them. ** Ganzan Ry\u014Dzan Ha (Rocky Mountain\
        \ Splitting Wave): Ganzan Ry\u014Dzan Ha is a technique where Kenshiro chops\
        \ his opponent in a way which fractures their skull. ** Hokuto Zankai Ken\
        \ (North Star Remorse Fist): Hokuto Zankai Ken is a technique where Kenshiro\
        \ jabs his thumbs into the pressure points on temples of his opponent's head\
        \ which causes the opponent to explode in three seconds after Kenshiro moves\
        \ his thumbs away from their temples. ** K\u014Dshu Hagan Ken (Neck Twisting\
        \ Face Breaking Fist): K\u014Dshu Hagan Ken is a technique where Kenshiro\
        \ jabs his finger into the pressure points on the side of his opponent's neck\
        \ before kneeing them in their face, causing them to explode. ** Goshi Retsu\
        \ Dan (Five Finger Fury Bullets): Goshi Retsu Dan is a technique where Kenshiro\
        \ strikes the pressure points on the opponent's hands, causing their fingers\
        \ to explode. ** Hokuto J\u016Bha Zan (North Star Soft-Breaking Slash): Hokuto\
        \ J\u016Bha Zan is a technique where Kenshiro rapidly kicks his opponent which\
        \ moves their body fat out of the way before he strikes a pressure point on\
        \ their stomach. ** Hokuto J\u016Bji Zan (North Star Cross Slash): Hokuto\
        \ J\u016Bji Zan is a technique where Kenshiro rapidly punches his opponent\
        \ in a cross formation across their body, striking several pressure points\
        \ which leave the opponent with only one minute left before they explode and\
        \ die. ** Hokuto G\u014Dkin Bundan Kyaku (North Star Steel Muscle Cutting\
        \ Kick): Hokuto G\u014Dkin Bundan Kyaku is a technique where Kenshiro kicks\
        \ pressure points on both of the opponent's arms which weakens the muscles\
        \ inside their arms making them as strong as a normal person. ** Hokuto S\u014D\
        kin Jizai Kyaku (North Star Tendon Pulling Will Kick): Hokuto S\u014Dkin Jizai\
        \ Kyaku is a technique where Kenshiro kicks the pressure points on the opponent's\
        \ neck which paralyses them and they can only move where Kenshiro orders them.\
        \ ** K\u016Bkyoku Ry\u016Bbu (Empty Polar Current Dance): K\u016Bkyoku Ry\u016B\
        bu is a technique where Kenshiro uses the vibrations in the air to learn the\
        \ location of an opponent and their attacks. ** Hokuto Kaikotsu Ken (North\
        \ Star Bone Crushing Fist): Hokuto Kaikotsu Ken is a technique where Kenshiro\
        \ jabs his fingers into the pressure point on his opponent's forehead which\
        \ causes them to explode. ** Kyomu Shidan (Nothingness Attack): Kyomu Shidan\
        \ is a technique where Kenshiro strikes a pressure point on the opponent's\
