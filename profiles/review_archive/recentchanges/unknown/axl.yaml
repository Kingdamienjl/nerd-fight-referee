      source_id: mediawiki-114477
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted (Axl is a capable fighter, being promoted to S-Class Maverick
        Hunter not long after joining, but is a bit reckless and impulsive. His peers
        tend to do most of the planning and he leaves analysis to Palette. However
        is capable enough at data and battlefield analysis to act as a Navigator and
        is an excellent actor and infiltrator, being able to imitate someone perfectly
        after only spending a short time observing them. He is also an expert marksman,
        able to easily keep up with X and Zero and quickly shoot down high-speed targets
        without trying)
      source_id: mediawiki-114477
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Axl is a bit cocky and reckless. Has a tendency to drag out fights to
        enjoy them. Rather whiny and a reflexive thinker. Transformation time is usually
        limited in-game (though this is likely exaggerated for gameplay purposes and
        may be a non-issue considering how much time he spends transformed between
        cutscenes). Certain Special Weapons can only be used with specific guns, he''s
        able to take their form and use any of their abilities. For example, copying
        Silver Horn would allow him to generate tidal waves. He was initially limited
        to Reploids his size, but later grew past this limitation by Command Mission.
        For gameplay reasons he''s limited to one attack before reverting (Command
        Mission was a Turn-Based RPG), but it''s highly likely that he''s able to
        remain in a form longer (he greeted X while disguised and presumably undercover
        for an extended period of time and frequently infiltrated other facilities
        during his tenure as a member of Red Alert). Alternatively, he can simply
        use the opponent''s abilities, Red: Axl''s mentor and surrogate father, he
        was the leader of the mercenary group Red Alert, which hunted Mavericks down
