- id: claim-weaknesses-60f34e57
  section: weaknesses
  axis: weakness
  text: 'Axl is a bit cocky and reckless. Has a tendency to drag out fights to enjoy
    them. Rather whiny and a reflexive thinker. Transformation time is usually limited
    in-game (though this is likely exaggerated for gameplay purposes and may be a
    non-issue considering how much time he spends transformed between cutscenes).
    Certain Special Weapons can only be used with specific guns, forcing Axl to switch
    weaponry to use them which can be difficult during combat. Special Weapons have
    a limited amount of ammunition Notable Attacks/Techniques: A-Trans: By accessing
    the DNA of a Reploid he''s defeated and absorbed or used his Copy Shot ability
    on, he''s able to take their form and use any of their abilities. For example,
    copying Silver Horn would allow him to generate tidal waves. He was initially
    limited to Reploids his size, but later grew past this limitation by Command Mission.
    For gameplay reasons he''s limited to one attack before reverting (Command Mission
    was a Turn-Based RPG), but it''s highly likely that he''s able to remain in a
    form longer (he greeted X while disguised and presumably undercover for an extended
    period of time and frequently infiltrated other facilities during his tenure as
    a member of Red Alert). Alternatively, he can simply use the opponent''s abilities,
    such as their weapons or their signature traits (i.e. copying a Kyuun B will simply
    increase his movement speed). A full list of Axl''s Weaponry and abilities can
    be found here. === Notable Transformations === *Red: Axl''s mentor and surrogate
    father, he was the leader of the mercenary group Red Alert, which hunted Mavericks
    down for their bounties. An expert scythe wielder who could go toe-to-toe with
    S-Class Maverick Hunters, he was able to generate powerful tornadoes to defend
    himself and attack foes while teleporting out of the way of enemy attacks. In
    addition, he could also create ghost-like duplicates of himself that could strike
    foes without being struck back, and counter oncoming ranged attacks with a powerful
    energy wave. Note: Since it can only be accessed after beating the game or by
    inputting a secret sequence, the "White" upgrade (which grants him unlimited flight
    time and boosts the distance of his dash and thus his travel speed) is of dubious
    worth for a canon profile. Model A of the ZX series displays many of his abilities,
    habits, and his personality. However, since the Biometal is referred to as Model
    Albert, it is unknown whether or not its feats should be correlated to Axl''s.
    ==Notable Matchups== Victories: Losses: Inconclusive: ==Notes/Explanations== Category:Male
