    - field: weaknesses
      value: "None notable Notable Attacks/Techniques: *Shadow Clone Technique: Omoi\
        \ creates tangible \u201Cshadow clones\u201D that can fight and use his techniques,\
        \ but disappear after one definite hit. Any information and experience the\
        \ clones gained are transferred to Omoi upon their dispersal. *Lightning Release:\
        \ Shadow Clone Technique: This technique allows the user to make a shadow\
        \ clone infused with lightning. Because it is a shadow clone, it is able to\
        \ perform techniques and interact with the environment. If the clone is injured,\
        \ it will revert to its natural lightning-state, at the same time electrocuting\
        \ whatever makes contact with it. Unlike a regular shadow clone, however,\
        \ it does not send chakra back to the user upon reverting to lightning. *Cloud-Style\
        \ Crescent Moon Beheading: The user swings their sword in a single, large,\
        \ crescent moon-shaped arc, which occurs with such ferocious velocity that\
        \ the technique can be employed in situations where only a very limited time\
        \ to react is available. The swing can be used to counter attacks from multiple\
        \ opponents simultaneously. *Cloud-Style Deception Beheading: Using the Body\
        \ Replacement Technique to feign being attacked, the user takes advantage\
        \ of their opponent's momentary shock, and charges forward with a lateral\
        \ sword slash. *Cloud-Style Reverse Beheading: The user does a powerful spin,\
        \ generating the momentum needed to slash at any opponents behind them. The\
        \ user can also utilize this spinning motion to trick an enemy that's in front\
        \ of them. The enemy is fooled into thinking the user will attack them, but\
