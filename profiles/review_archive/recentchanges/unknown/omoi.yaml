    - field: weaknesses
      value: 'Arrogant, plays with his enemies. Deepa stated that the carbon armor
        isn''t perfect and had a few flaws, but didn''t elaborate. Notable Attacks/Techniques:
        Carbon Control: This jutsu, allows Deepa to absorb and freely manipulate carbon,
        and use it for a variety of things. * Carbon Projectiles: For external sources,
        the user is able to remotely control the said carbon, shaping it into a myriad
        of shapes and levitated about freely. Upon which, the user can manipulate
        the cluster of cubes in a myriad of formations and launch them as a barrage
        of speeding projectiles that even the Sharingan has difficulty following.
        He can increase the size of his projectiles to strengthen their sheer force,
        able to plow even through an Iron Sand Wall. He could also supercharge his
        projectiles for a devastating attack. * Hardening: Alternately, the user can
        utilise used fine-tuned control over the carbon in their very body and rearrange
        the molecular-bond between them. In doing this, the user''s body will take
        on a dark reflective state akin to metal. In this state, the user''s body
        becomes super dense, as hard as a diamond, granting them immense physical
        strength and becomes impervious to nearly any form of damage. This ability
        can be used on any isolated part of the body or their entire being. *Carbon
        Ring: Deepa creates a ring out of carbon that rotates very quickly around
        his body, protecting him from various attacks. In addition, he is capable
        of attacking with a ring, throwing it at the enemy at high speed. *Carbon
        Whip: Deepa creates carbon whips on his hands that extend a considerable distance,
        allowing him to attack with sweeping blows. Thanks to the sharp ends, the
        whip can pierce the enemy. *Carbon Armor: When utilizing this internal and
        external nature of this technique on one''s self, the user completely encase
        himself in a two toned full body armor made of his hardened carbon abilities,
        as a last resort. It allows him to harden his fists from carbon into diamond.
