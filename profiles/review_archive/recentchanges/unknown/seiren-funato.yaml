- id: claim-weaknesses-600f422f
  section: weaknesses
  axis: weakness
  text: 'High-frequency sounds like thunder can interfere with her echolocation. Notable
    Attacks/Techniques: * Hiding in Black Fog Technique: The user emits a black fog
    to conceal themselves. * Echolocation Technique: By plucking the strings of her
    bow, Seiren can track targets by listening for the echoes they produce. Kagura
    compares it to how dolphins and bats navigate their surroundings. Other sounds,
    such as thunder, can interfere with it, throwing off her perception. ==Notable
    Matchups== Victories: Losses: Inconclusive: ==References== Category:Characters
    Category:Female Characters Category:Pirates Category:Bow Users Category:Stealth
    Masters Category:Acrobats Category:Weapon Masters Category:Energy Users Category:Surface
    Scalers Category:Free Movement Users Category:Statistics Amplification Users Category:Shapeshifters
    Category:Afterimage Users Category:Smoke Users Category:Energy Projection Users
    Category:Power Nullification Users Category:Paralysis Users Category:Enhanced
    Senses Users Category:Naruto Category:Boruto Category:Sound Users Category:Illusionists
    Category:Duplication Users Category:Anime Characters Category:Chi UsersCategory:Extrasensory
    Perception Users Category:Weapon Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-97824b71
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Stealth Mastery, Acrobatics, Weapon Mastery
    (She is a skilled bow user), Chakra Manipulation, Statistics Amplification (Shinobi
    are capable of enhancing their physical capabilities with the use of chakra. The
    Shunshin no Jutsu allows Shinobi to greatly enhance their speed by focusing chakra
    in their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface
    Scaling and Water Walking (By focusing chakra at the soles of their feet, Shinobi
    can scale and cling to vertical surfaces, and even walk on waterNaruto Chapter
    18Naruto Chapter 90), Minor Illusion Creation and Duplication (With the Clone
    TechniqueRin no Sho, Page 220, Shinobi can create illusionary duplicates of themselves
    that have no physical substance), Shapeshifting (With the Transformation Technique,
    Shinobi can transform themselves into other people, animals, plants, and even
    inanimate objects, such as weapons), Paralysis Inducement (With the Temporary
    Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely paralyze their
    targets from close to mid range), Afterimage Creation (Can create one or more
    afterimages of herself to move alongside her), Smoke Manipulation (Can create
    a black fog to conceal herself), Energy Projection, Power Nullification and Limited
    Paralysis Inducement with Ray Bow (Can shoot special chakra arrow from her bow,
    and also able to use the bowstrings to change the trajectory of the projectiles
    once they are shot. Those hit by the projectiles have their chakra flow disrupted
    and the affected limb is numb for a period of time), Enhanced Senses and Sound
    Manipulation (By using the bowstrings of Ray Bow, she can sense the environment
    and her prey by using echoes, the same technique that dolphins and bats use)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
