power_scale:
  tier:
    text: 9-C
    source_ids: &id002
    - mediawiki-5086331
    confidence: 0.95
  attack_potency:
    text: Street level (Frendos wield a variety of weapons such as crossbows, chainsaws,
      swords, saws, and knives, which are on this level, with their crossbow bolts
      hitting hard enough to completely punch through a victim's skull and stick into
      dirt. Arthur Hill was able to decapitate Eli Duvall with a garotte wire)
    source_ids:
    - vsbattles-frendo-the-clowns-clown-in-a-cornfield-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Peak Human (Frendos are shown attacking fairly fast at times. Sheriff Dunne
      is a crackshot with his service pistol. The Frendo in the garage snuck a toy
      onto the bench and ran to a hiding spot in just 6 seconds), Subsonic attack
      speed with various weapons (crossbows and firearms are this fast)
    source_ids:
    - vsbattles-frendo-the-clowns-clown-in-a-cornfield-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Peak Human (Sheriff Dunne was able to toss Cole far up a flight of stairs
      with one hand. A Frendo was able to impale and lift a teenager overhead with
      a pitchfork, another delivered the same fate to Janet. The crossbows the Frendos
      use is very heavy weight, ranging from 100-150 lb. Arthur Hill was able to overpower
      and lift his son with a single arm to throw him over a banister)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Varies from Street level to most Wall level (At least two Frendos were shown
      to have survived an explosion of two dynamite sticks that obliterated a silo,
      leaving a hole in the ground - one survived the concussive force but succumbed
      to his burn wounds later onClown in a Cornfield Novel,and the other was shown
      to be fine. Sheriff Dunne tanked a blast from Rust's shotgun, which nearly blew
      another man in half. The Frendo that wrestled Tucker quickly recovered from
      smashing through a coffee table. Stronger Frendos should be comparable to Rust,
      who came out of the silo explosion with a few minor burns)
    source_ids:
    - vsbattles-frendo-the-clowns-clown-in-a-cornfield-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Peak Human (A Frendo remained on his feet for several minutes after suffering
      horrific burns. Sheriff Dunne continued fighting after a shotgun blast to the
      shoulder and a rifle round through the gut, only stopping after a headshot.
      In the sequel novel, the sixty-four year old Arthur endured having his jaw maimed
      with a mallet strike, being blasted through the legs with shotgun pellets, suffering
      minor burns, and then jumping off the second story of his house)
    source_ids:
    - vsbattles-frendo-the-clowns-clown-in-a-cornfield-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Tens of Meters with ranged weapons
    source_ids:
    - vsbattles-frendo-the-clowns-clown-in-a-cornfield-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (The Frendos meticulously plotted the Kettle Springs massacre, taking
      out physical threats like Tucker prior to the party, enlisting turncoats like
      Ronnie and Matt, sabotaging vehicles, and using technology to stay coordinated
      and keep their victims' whereabouts known. A lawyer among them reviewed the
      suicide note forged for Colt, making sure it could hold up under investigation.
      The Frendos claimed many victims by corralling them into buildings before locking
      them inside and lighting the buildings on fire)
    source_ids:
    - vsbattles-frendo-the-clowns-clown-in-a-cornfield-unknown
    confidence: 0.6
    notes: auto_repair source extraction
