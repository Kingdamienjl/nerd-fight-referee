        he makes little to no noise while in action, can go completely undetected
        in public areas, and sneak up on victims with ghostly silence until it is
        too late, sometimes even giving off the illusion of teleporting), Weapon Mastery
        (Art the Clown across his films has explicitly shown the ability to use weapons,
        both conventional and improvised, as effective murder tools to mutilate people),
        Preparation (Carries a bunch of weapons and wears a clown costume), Sleep
        Manipulation via sedatives, Acid Manipulation via Fluoroantimonic Acid, Same
        as Before but Greater, Resurrection, Technology Manipulation (The sinister
        entity has shown to mess with technology. In Terrifier, while resurrecting
        Art the Clown, it caused the lights to rapidly flicker and started to make
        the phone and radio malfunction. In Terrifier 2, upon appearing to Art the
        Clown, it shut off a washing machine. Turned on a television despite having
        a broken electrical cord), Invisibility (Is naturally only visible to Art
        the Clown, however, the pale girl can make itself visible to other people
        if it chooses to), Shapeshifting (Turned into Barbara to emotionally mess
        with Sienna), Vocal Mimicry (Did a perfect imitation of John's voice to lure
        Sienna to Art the Clown's lair), Retrocognition (Gave Sienna a vision of Art
        the Clown murdering her mother), Reality Warping (Brought Sienna's nightmare
        into reality, creating a complete copy of it within the confines of Art the
        Clown's lair), Necromancy (While recreating Sienna's nightmare, it also brought
        the people Art the Clown killed in the dream back to life), Spatial Manipulation,
        Glowing Eyes, Biological Manipulation (Made Victoria give birth to Art the
        Clown's severed head), Overwhelmingly Frightful Presence (Art the Clown's
        presence and reputation is one that inspires fear. Terrified a man so much
        that he was reduced to a mumbling mess shortly after encountering him, despite
        being completely desensitized due to being a coroner for twenty two years,
        experiencing such horrific things such as an eight month year old baby microwaved
        to death. Completely traumatized Victoria, and even drove her insane to the
        point she loved him. Ever since the events of Terrifier, Art the Clown has
        garnered so much of a reputation that he has inspired people to dress like
        him. Jonathan bringing him up at the dinner table was enough to make Sienna
        have a nightmare featuring him), Demonic Protection (Is protected by a sinister
        entity that takes on the form of a little girl with the same clown get-up
        as Art. If Art the Clown dies, this mysterious entity will bring him back
        from the dead, one way or another)/Immortality (Type 2 [Resilient] - Survived
        after shooting himself in the head, remained alive after being stabbed in
        the head with a pole, and even continued to live as a severed head. Type 3
        [Regeneration] - See Regeneration for explanation. Type 8 [Reliant] - Is governed
        by a sinister entity that will resurrect him if he dies), Regeneration (Mid
        - Recovered after shooting himself through the head, Regenarated after having
        his eye ripped out,albeit after an unknown amount of time,reattachEd his head
        after being decapitated), Fire Manipulation (In Terrifier 2, Art while in
        Sienna's dream, caused a candle to suddenly burst into abnormally large flames),
        Ice/Water/Air Manipulation via Liquid Nitrate, Explosion Manipulation via
        Bombs, Vehicular Mastery (Drove a white van in the 3rd film and can drive
        a tricycle in the second film.), Somewhat Animal Manipulation (Owns a bunch
        of trained mice), Possession (Like Victoria)
