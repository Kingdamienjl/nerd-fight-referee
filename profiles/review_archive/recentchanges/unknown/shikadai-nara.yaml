    - field: weaknesses
      value: "Even being proficient in wind release, he requires his mother's fan\
        \ to use advanced techniques which he is still limited at and tires him quickly.\
        \ Notable Attacks/Techniques: * Shadow Imitation Technique: Allows the user\
        \ to extend his shadow. Once it comes into contact with the opponent's shadow,\
        \ they are forced to imitate the user's movements. Can work on multiple targets.\
        \ This technique can only work for a limited amount of time. * Shadow Imitation\
        \ Field Technique: This technique is an advanced version of the Shadow Imitation\
        \ Technique, where the user expands their shadow to cover a wide range, thereby\
        \ reducing the chance of escape. Due to the technique's concept, multiple\
        \ targets can be captured simultaneously. * Shadow\u2013Neck Binding Technique:\
        \ This is a variation of the Shadow Imitation Technique, designed for offensive\
        \ purposes. The user extends their shadow along a target's body, which, because\
        \ the shadow has physical properties, the target can feel. There, the shadow\
        \ can be used for restraint, replacing or adding to the binding of the Shadow\
        \ Imitation; the closer the user is to their target, the stronger this binding\
        \ becomes. * Wind Release: Sickle Weasel Technique: Using a Giant Folding\
        \ Fan, the user causes many currents of wind to collide with each other, creating\
        \ vacuum pockets. On its own, the gust is powerful enough to blow away incoming\
        \ attacks and knock targets off their feet. If a target should become engulfed\
        \ in the winds, their body will be carved up by the countless wind blades.\
        \ * Wind Release: Air Current Wild Dance: The user creates and controls air\
        \ currents from the palms of their hands. The technique is able to easily\
        \ whip up loose dust in the area. It is also performed to create a controllable\
        \ dust storm. * Wind Release: Great Task of the Dragon: The user swings their\
        \ fan to the sky, causing a giant tornado to descend upon a target. This technique\
        \ can be set up as a feint as it has a delayed activation. The technique alters\
        \ weather conditions temporarily and attacks from the sky rather than from\
