    - field: weaknesses
      value: 'Very lazy until Asuma died, currently lacks powerful attacks. His Shadow
        Manipulation technique consumes large amounts of chakra and can be overpowered
        with enough physical force or chakra absorption. Notable Attacks/Techniques:
        *Kagemane no Jutsu: Allows Shikamaru to extend his shadow. Once it comes into
        contact with the opponent''s shadow, they are forced to imitate Shikamaru''s
        movements. Can work on multiple targets. This technique can only work for
        a limited amount of time. *Kage Kubi Shibari no Jutsu: Shikamaru''s extended
        shadow takes the shape of a hand and can restrain the opponent or snap their
        neck. Stronger opponents can overpower this technique. *Kagemane Shuriken
        no Jutsu: Taking advantage of Asuma''s chakra knives, Shikamaru will store
        his shadow chakra in the blades. He will target his opponent''s shadow with
        sharp objects and can "capture" them similar to Kagemane no Jutsu. *Kage Nui
        no Jutsu: Shikamaru creates multiple shadow tendrils that are no longer bound
        to the ground like his other techniques. The tendrils have a piercing effect
        and can be used to restrain an opponent and even pick up objects and throw
        objects.'
      source_id: character-stats-profiles-shikadai-nara-unknown
      provider_id: character_stats_profiles
