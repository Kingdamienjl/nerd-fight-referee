- id: claim-weaknesses-23a6c11b
  section: weaknesses
  axis: weakness
  text: 'Is nihilistic and may not fight at her best unless she''s motivated. She
    becomes more vulnerable to fire while using her ice powers and more vulnerable
    to ice while using her lightning powers. Notable Attacks and Techniques: *Ice
    Sculpture: Creates a glass-like ice sculpture that attempts to crush a target
    by bouncing around before shattering harmlessly after a set time to serve as a
    distraction for Prometheus. *Helmet Bits: The bulbs at the end of her helmet detach,
    homing in on a target while firing a barrage of ice and lightning projectiles.
    *Lightning Rays: Fires trails of electricity from her staff that circle her target
    in set patterns to trap them and shock them if they misstep. *Electric Carousel:
    Creates three copies of her staff before electrifying all four of them, keeping
    two revolving around her to defend against projectiles while the other two spin
    erratically and attempt to bludgeon and shock the target. *Storm Cage: An attack
    similar to Lightning Rays but has her Helmet Bits circle a target and attack directly.
    Halfway through the attack the bits switch to ice projectiles. Prometheus can
    follow this attack with an Overhead Guillotine. *Witch and Reaper: A combination
    attack with Prometheus in which he conducts his Scythe Sweep while she attempts
    to ram the opponent while riding on her electrified staff. Prometheus can be stopped
    in his tracks if he is struck enough times though. *Fire, Ice, and Lightning:
    A combination attack with Prometheus, for which he uses his Flame Swords attack
    while Pandora launches the remote weapons from her helmet in an attempt to bludgeon
    the opponent with ice and lightning. ==Notable Matchups== Victories: Losses: Inconclusive:
    Category:Characters Category:Mega Man Category:Teleportation Users Category:Ice
    Users Category:Electricity Users Category:Staff Users Category:Flight Users Category:Antagonists
    Category:Armor Users Category:Female Characters Category:Game Characters Category:Emotionless
    Characters Category:Game Bosses Category:Evil Characters Category:Tragic Characters
    Category:Villains Category:Artificial Characters Category:Traitors Category:Weapon
    Masters Category:Telekinesis Users Category:Self-Sustenance Users Category:Absolute
    Zero Users Category:Reploids Category:Video Game Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
