    - field: weaknesses
      value: 'Has trouble controlling his electricity. He can cause cars, guns, and
        fuel to explode with a mere touch. He takes extensive damage, and will eventually
        die from being submerged in water, though he can possibly negate this weakness
        with cryokinesis via freezing the water. | None notable. Previous weaknesses
        are no longer a problem. | None notable. Notable Attacks/Techniques: * Lightning
        Bolts: Cole can shoot electricity out of his hands like a lightning bolt.
        Hitting targets with constant streams of electricity. * Alpha Bolt: A lightning
        bolt. Pure and simple. * Pincer Bolt: A cunning electrical attack that strikes
        enemies from three sides simultaneously. Intensifying damage. * Artillery
        Bolt: A long-range bolt that can hit targets from any distance. * Magnum Bolt:
        A single burst of unparalleled damage. This is a true thunderbolt. * Bolt
        Stream: Unleash a pounding stream of rapid-fire bolts. * Skull Bolt: Headshots
        with this power destabilizes the neuroelectricity in the brain, causing the
        targets head to explode. * Scythe Bolt: A wide swath of five times overcharged
        electricity. * Lightning Arcs: Cole can release deadly lightning arcs from
        any part of his body, from his hands to his head, that can easily bust through
        an armoured aircraft carrier designed to hold other powerful Conduits, kill
        fodder Conduits with his mere presence, and burn through rubber and insulation.
        * Electric Drain: Cole simply drains electricity from any object around him.
        * Electromagnetic Shockwave/TK Blast: Cole throws a force blast of powerful,
        electromagnetic energy like an air shotgun. He can reflect attacks back at
        attackers, even energy attacks. He can electrocute anything caught in the
        blast, reverse the magnetism of targets to suspend them in mid-air, or fire
        caged orbs of swirling Kinetic Energy that detonate with terrible force. *
        Shockwave/Alpha Blast: Basic EM Shockwave. * Detonation Blast: A swirling
        ball of caged kinetic energy that sticks to whatever it hits, eventually exploding
        with terrible force. Cole can also harness the kinetic energy to increase
        his speed and launch himself High into the air for a super jump. * Graviton
        Blast: A blast that lowers the gravity of anything it sends flying. Enemies
        are helpless as they hang in the air. * Punch Blast: A longer, narrower blast
        that slams into people and objects, sending them flying for more damage. This
        blast can cause severe damage to even the toughest Conduits and easily level
        structures. * Sniper Blast: A blast with a very long range, but narrow area
        of effect. Perfect for nailing a distant target. * Megawatt Hammer/Rockets:
        Cole can throw electric orbs of kinetic energy like rockets. They explode
        with great force, travel fast, can make enemies float, split into several
        smaller sticky rockets, and can have their flight path redirected via a Lightning
        Bolt, and will follow whatever the Bolt hit until it makes contact. * Megawatt
        Hammer/Alpha Rocket: An electrical rocket delivering a huge payload of explosive
        kinetic energy. * Redirect Rocket: After firing a rocket, Cole can redirect
        it mid-flight by hitting an enemy or object with a Bolt attack. The rocket
        will then chase the target until it hits. * Sticky Rocket: A rocket that splits
        when approaching a target, breaking into homing charges that attach to nearby
        enemies. * Tripwire Rocket: A rocket that, when sent off, splits into two
        rockets with a tripwire of electricity between them. If an enemy is caught
        in the wire, the rockets will smash together and explode, causing double the
        damage. * Tesla Missile: Cole primarily uses this power for restarting substations,
        but it can be used for combat. This is a rocket that Cole has direct control
        of, and can guide it in mid-air in any direction. It can one-shot even the
        strongest enemies. * Missile Bolt: Basically a combination of the Bolt and
        Rocket attack. With this, Cole can fire Megawatt Rockets with the fire rate
        of Lightning Bolts. Dealing out maximum damage in quick succession.'
