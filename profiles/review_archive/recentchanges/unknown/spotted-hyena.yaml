  intelligence:
    text: "High Animalistic (Regarded as among the smartest mammals in the world;\
      \ Contrary to popular culture, hyenas are proving to be intelligent\u2014in\
      \ some ways, as smart as primates. They live in societies as complex as those\
      \ of some primates and seem to show as much social intelligence. Also, like\
      \ primates, they form coalitions and understand that certain relationships are\
      \ more valuable than others. Like primates, they learn and follow rules of social\
      \ status and behaviour, and they solve social problems in ingenious ways, using\
      \ distraction, deception, or conciliation. Additionally, Hyenas are also innovative\
      \ and able to solve new technical problems. A study done by evolutionary anthropologists\
      \ demonstrated that spotted hyenas outperform chimpanzees on cooperative problem-solving\
      \ tests; captive pairs of spotted hyenas were challenged to tug two ropes in\
      \ unison to earn a food reward, successfully cooperating and learning the maneuvers\
      \ quickly without prior training. Experienced hyenas even helped inexperienced\
      \ clan-mates to solve the problem. In contrast, chimps and other primates often\
      \ require extensive training, and cooperation between individuals is not always\
      \ as easy for themhttps://en.wikipedia.org/wiki/Spotted_hyena#Intelligence)\
      \ Standard Tactics: When hunting prey, hyenas typically target the prey's scrotum\
      \ to quickly destabilize their prey. Once the scrotum is torn off, the hyena\
      \ would go for the throat and finish the prey off."
    source_ids:
    - vsbattles-spotted-hyena-unknown
    confidence: 0.6
    notes: auto_repair source extraction
