- id: claim-weaknesses-809df64c
  section: weaknesses
  axis: weakness
  text: He can't die for as long as Void wills itChapter 3, but can't regenerate while
    he's unconsciousChapter 3. Can't summon Void at willChapter 3. Has no control
    over his body once Void takes overChapter 4. Using the powers of Demons comes
    at a cost, as they can take full control of his body until their contracts expireChapters
    1, 2, and 8, and he experiences every instance of pain he inflicts upon his enemiesChapters
    2 and 13.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-b0d4e756
  section: abilities
  axis: hax
  text: '* Aura (Black energy emanates from him whenever he uses his powersChapters
    1, 2, and 26) * Immortality (Type 3; He cannot die as long as he can regenerate
    his bodyChapter 1) * Regeneration (Can regenerate even after his head, limbs,
    or entire body have been blown apartChapters 1, 9, 13, and 26) * Summoning (Can
    summon Demons and Demon Kings and harness their powers, including those of 1,024
    lower Demons, 256 intermediate Demons, and 108 high Demons, of whom 72 are Demon
    KingsChapters 1, 2, 3, 13, and 19) * Transformation (Grows two black energy horns
    on his head whenever he uses his powersChapters 1, 2, and 26) * Limited Statistics
    Amplification (Anyone who receives a transfusion of his blood experiences an increase
    in physical abilities for one hourChapters 5 and 8) * Soul Manipulation Resistance
    (His soul is bound by a contract with VoidChapter 1) * Precognition Resistance
    (His future cannot be accessed due to VoidChapter 3) * Air Manipulation (Morax
    can create slashes of airChapter 14) * Density Manipulation (Giselle can manipulate
    massChapters 12 and 18) * Fire Manipulation (Pavaka burns targets upon physical
    contact. Agni can manipulate fire at will, creating gigantic fire palms or causing
    flames to erupt around himChapters 1 and 2) * Gravity Manipulation (Hig can manipulate
    gravityChapter 12) * Mind Manipulation (Morax can control those affected by the
    gases he emitsChapter 13) * Pain Manipulation (Gula causes everyone inside it
    to share their senses, including pain, with one another. Although everyone affected
    experiences the shared pain, no one is actually harmed by itChapters 26 and 27)
    * Plant Manipulation (Morax can create numerous thorns to stab enemies and gigantic
    roots to impale themChapters 14, 15, and 16) * Poison Manipulation (Morax can
    release poisonous gas that can cause vomiting and fainting, emit corrosive gas
    that corrodes anything it touches, and inflict an incurable disease through any
    of his attacks. The disease causes living bodies to decompose, making them swell
    before their fat and remaining flesh melt away, ultimately leaving nothing but
    skin. Morax can also transform into gasChapters 13, 14, 15, and 16) * Spatial
    Manipulation (Gula can create spatial rifts within itselfChapter 27) * Absorption
    (Void can absorb anything within the Nihility, while Morax can absorb soulsChapters
    4 and 14) * Aura (Void can instill fear in those around himChapter 4) * BFR (Void
    can transport anyone into the Nihility and bring them backChapters 4, 5, and 6)
    * Enhanced Senses (Sai grants its user exponentially enhanced vision, akin to
    having multiple eyesChapter 8) * Flight (Both Hig and Morax possess true flightChapters
    12 and 13) * Immortality (Type 5; Void cannot die as long as he wills itChapter
    3) * Regeneration (Void can regenerate as long as the Relic of the Nihility remains
    intact, while Morax can regenerate even after his heart has been piercedChapters
    3, 12, and 14) * Summoning (Void, Agni, and Morax can enter the Living Realm by
    possessing his body. Additionally, the user can harness the powers of Pavala,
    Bhraj, Bason, Giselle, Hig, Phaleg, and Gula or summon them into the Living RealmChapters
    1, 2, 3, 4, 6, 8, 12, 13, 18, 26, and 27) * Transformation (Void, Agni, and Morax
    can take over his body, transforming it into their respective Demon formsChapters
    2, 3, and 12) * Weapon Creation (Bhraj can create six long lances to fight with,
    while Bason can create two gigantic fists for combatChapters 1, 2, 6, 8, and 12)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
