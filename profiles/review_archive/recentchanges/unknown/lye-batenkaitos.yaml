    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Weapon Mastery, Martial Arts, Charge
        Attack, Regeneration (Mid-Low, likely Low-Mid [Clones can heal from minor
        injuries by just resting. Furthermore, they can regenerate from goat charges,
        slash attacks from Monokuma, and bites from sea monsters. Scaling to Minamo,
        who instantly regenerated from having the tentacles of her Clione piercing
        through her arm]), Immortality (Type 8 [His existence relies solely on his
        X-Key and the Extend Machine respectively, and would die for good should the
        X-Key or the Extend Machine be destroyed]), Resurrection (Can resurrect himself
        by using the Extend function on the Extend Machine by inserting his X-Key.
        Not Combat Applicable), Pain Suppression (Numerous times of Extending himself
        had caused Haruto to not feel pain at all), Elasticity (Clione tentacles can
        extend into abnormal distances), Self-Destruction (Via SilBurst, which can
        release a huge explosion, albeit at the cost of the user dying), Ice Manipulation
        (Individually via the Freezing Gas Clione, and to all enemies via the Harsh
        Frost Coating Clione), Heat Manipulation (Individually via the Scalding Shot
        Clione, and to all enemies via the Heat Burst Clione), Electricity Manipulation
        (Can attack with electricity coated limbs, and induce paralysis to the enemies
        via the Electric Shock Clione), Poison Manipulation (Individually via the
        Decaying Spores Clione, and to all enemies via the Putrid Poison Toss Clione),
        Acid Manipulation (Individually via the Potent Acid Blast Clione, and to all
        enemies via the Potent Acid Spray Clione), Statistics Amplification (Via the
        One Thousand Fists Clione, which can grant its user enough power to knock
        back enemies that normally pose a threat to the Clione's user), Sound Manipulation
        (Can release sound waves in the form of an attack via the Sonic Wave Clione),
        Durability Negation (Via the Piercing Spear Clione, which can ignore and pierce
        through any kind of shields), Life Leech (Via the Sword of Rakshasa, which
        can absorb the life of its target and grant it to its user), Statistics Reduction
        (Can lower the strength of the enemy via the Depression Poison Clione, and
        lower the speed of the enemy via the Nervejack and Area Lockdown Cliones),
        Transmutation and Creation (Can transmute his enemies and turn them into Strengtheners
        via the Molecular Restructure Clione), Healing (Can heal himself to near full
        capacity via the Metempsychosis Clione, heal himself alongside his allies
        via the Gospel Clione, recover his own stamina via the Dried Food Generation
        Clione, recover his own and his allies' stamina via the Major Snacking Clione
        and cure all kinds of aliments via the Cure Aliment Clione), Power Nullification
        (Can reduce all kinds of physical, elemental, and aliment-based attacks, including,
        but not limited to Poison, Paralysis, Fear, Freezing, Sound, Heat and Acid
        for himself via the Diamond Cut Injection Clione, and can do the same to both
        himself and his allies via the Shoot Down Clione, as well as nullify Rage
        Power and Berserker Mode abilities via the Sedative Clione), Reactive Power
        Level (The several deaths that he sustained for more than the past 5 years
        had caused him to grow even more powerful, up to the extent that it can be
        possible for Haruto and the others to easily deal with Yosuke Kurosaki, who
        previously curbstomped the whole party by merely roaring earlier in the game,
        with normal blows, and without using the traps inside the lab that Yosuke
        was inside, as well as deal with Extend Terashima, upon said individual being
        revived, with ease), Immortality Negation (Was able to kill Extend Terashima,
        who was an immortal, without breaking his X-Key, with the X-Key of said villain
        breaking apart after his defeat), Reactive Evolution (The multiple deaths
        he suffered for the last 5 years and above were more than enough to allow
        him to gain Resistances to all aliments and diseases that can be found in
        life), Resistance to Poison Manipulation, Electricity Manipulation, Ice Manipulation,
        Sound Manipulation, Heat Manipulation, Fire Manipulation, Acid Manipulation
        (His numerous amounts of deaths allowed Haruto to gain resistances to these
        aliments and even more, growing even stronger with each 13 days passing),
        Possession and Corruption (The several deaths that were caused from overusing
        his Clione caused Haruto to gain immunity to the Clione's parasitic drawback
        which eats away the body of its owner, as well as take control of its host's
        body, turning said host into a Creature) and Pain Manipulation (Numerous times
        of Extending himself had caused Haruto to not feel any kind of pain, and thus
        should be immune to any kind of pain manipulation)
