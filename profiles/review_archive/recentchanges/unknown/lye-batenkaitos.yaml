- id: claim-weaknesses-0df36561
  section: weaknesses
  axis: weakness
  text: "Lye can't eat a person's Name and Memories if he doesn't know their True\
    \ Name. If he eats another type of Name, he becomes plagued with severe nausea.\
    \ The Authority of Gluttony can only plunder the souls of people, animals and\
    \ the like are immune, although they still forget those whose Names are gone.\
    \ He is normally unwilling to utilize Solar Eclipse because he fears his sense\
    \ of self being damaged by it, so he resorts to the inferior Lunar Eclipse. Following\
    \ his confrontation with Ram, Lye conquered his fear of using Solar Eclipse and\
    \ fully embraced its power to become a Warlock. Notable Attacks/Techniques: Authority\
    \ of Gluttony: Lye's Authority of Gluttony can be divided into two powers\u2014\
    \ his ability to plunder a person's soul and consume their Name and Memories,\
    \ and his ability to access and physically utilize the stolen Names and Memories\
    \ within him. *Eclipsing: Lye can plunder a person's soul to eat the Name and\
    \ Memories of his opponent. To activate the Authority, he touches them with his\
    \ hand, then licks the palm of the same hand while chanting the victim's full\
    \ name. Things such as experience, talent, and the likes and dislikes of human\
    \ relationships serve as food for him, allowing him to take advantage of any abilities\
    \ or Memories his opponents had. However, if he eats a Name other than a person's\
    \ True Name, he becomes plagued with severe nausea. **Eclipsing the"
  source_ids: *id003
  decisive: false
  status: unverified
