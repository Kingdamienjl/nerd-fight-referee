      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: '*Witch Cult Daggers: Lye wields a twin pair of Witch Cult-style daggers
        as his primary weapons. He keeps them tied to his wrists, allowing him to
        freely switch between fighting with blade and bare-handed techniques, more
        efficiently making use of his stockpiled techniques. Lye also keeps a hidden
        dagger, varnished with poison, concealed on his foot. *The Gospel: A book
        of prophecies given to all members of the Witch Cult, it is a defective version
        of an incomplete copy of the Book of Wisdom. It is a guide to the owner''s
        desired future, but its contents are vague and subject to change, the instructions
        being up to interpretation.'
      source_id: vsbattles-lye-batenkaitos-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Extraordinary Genius Standard Tactics: Lye is a monstrous synthesis
        of fighting styles, specializing in close- mid- and long-range combat, possessing
        the skills to handle any situation. He fights dirty, always abusing a custom
        in which warriors first introduce themselves to obtain their Names. Lye is
        obsessed with ensuring he eats only worthy people deemed as "gourmet", and
        thus he tends to grant opponents an opportunity to prove themselves. If he
        happens to possess the Memories of someone close to his opponent, he''ll imitate
        their mannerisms in order to make them feel uneasy. Lye makes use of the element
        of surprise, and is willing to fake his injuries, pretend to be unconscious
        or dead, and use false surrender to get a cheap hit, or flee when he sees
        that the battle is unfavorable.'
      source_id: vsbattles-lye-batenkaitos-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Lye can't eat a person's Name and Memories if he doesn't know their\
        \ True Name. If he eats another type of Name, he becomes plagued with severe\
        \ nausea. The Authority of Gluttony can only plunder the souls of people,\
        \ animals and the like are immune, although they still forget those whose\
        \ Names are gone. He is normally unwilling to utilize Solar Eclipse because\
        \ he fears his sense of self being damaged by it, so he resorts to the inferior\
        \ Lunar Eclipse. Following his confrontation with Ram, Lye conquered his fear\
        \ of using Solar Eclipse and fully embraced its power to become a Warlock.\
        \ Notable Attacks/Techniques: Authority of Gluttony: Lye's Authority of Gluttony\
        \ can be divided into two powers\u2014 his ability to plunder a person's soul\
        \ and consume their Name and Memories, and his ability to access and physically\
        \ utilize the stolen Names and Memories within him. *Eclipsing: Lye can plunder\
        \ a person's soul to eat the Name and Memories of his opponent. To activate\
        \ the Authority, he touches them with his hand, then licks the palm of the\
        \ same hand while chanting the victim's full name. Things such as experience,\
        \ talent, and the likes and dislikes of human relationships serve as food\
        \ for him, allowing him to take advantage of any abilities or Memories his\
        \ opponents had. However, if he eats a Name other than a person's True Name,\
        \ he becomes plagued with severe nausea. **Eclipsing the"
      source_id: vsbattles-lye-batenkaitos-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
