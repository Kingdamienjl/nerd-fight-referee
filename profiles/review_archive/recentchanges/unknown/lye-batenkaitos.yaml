- id: claim-standard-equipment-90330f41
  section: equipment
  axis: equipment
  text: '*Witch Cult Daggers: Lye wields a twin pair of Witch Cult-style daggers as
    his primary weapons. He keeps them tied to his wrists, allowing him to freely
    switch between fighting with blade and bare-handed techniques, more efficiently
    making use of his stockpiled techniques. Lye also keeps a hidden dagger, varnished
    with poison, concealed on his foot. *The Gospel: A book of prophecies given to
    all members of the Witch Cult, it is a defective version of an incomplete copy
    of the Book of Wisdom. It is a guide to the owner''s desired future, but its contents
    are vague and subject to change, the instructions being up to interpretation.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
