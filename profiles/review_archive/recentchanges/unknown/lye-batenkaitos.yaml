  stamina:
    text: Superhuman (Lye didn't give up after Ram snapped his wrist, elbow, shoulder,
      and pummeled his body, and tried to fight back after she shattered his nose,
      teeth, jaw, and forehead, only being stopped by the dislocation of his arms.
      Even when Ram drove her knee into Lye's elbow joint to smash it, Lye's follow-up
      strike didn't hesitate in the slightest. Lye continued challenging Ram even
      when she pelted him with her heel and innumerable wind blades, used wind to
      slash his eyes, nose, lips, ears, mincing his face until he shed blood instead
      of tears, and finally fled only after she shattered his knee, beat him until
      what was below his skin became lumps of flesh, and whittled down his frame by
      dragging him against a wall. In an act of love, he slashed off his own hands
      at the wrists to write a message to Ram, and he only finally died after being
      beheaded)
    source_ids:
