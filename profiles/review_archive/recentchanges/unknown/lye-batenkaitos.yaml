        of fighting styles, specializing in close- mid- and long-range combat, possessing
        the skills to handle any situation. He fights dirty, always abusing a custom
        in which warriors first introduce themselves to obtain their Names. Lye is
        obsessed with ensuring he eats only worthy people deemed as "gourmet", and
        thus he tends to grant opponents an opportunity to prove themselves. If he
        happens to possess the Memories of someone close to his opponent, he''ll imitate
        their mannerisms in order to make them feel uneasy. Lye makes use of the element
        of surprise, and is willing to fake his injuries, pretend to be unconscious
        or dead, and use false surrender to get a cheap hit, or flee when he sees
        that the battle is unfavorable.'
