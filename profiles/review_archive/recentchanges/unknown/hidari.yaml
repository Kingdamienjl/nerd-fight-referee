        to burn someone from the inside outBoruto: Naruto Next Generations; Episode
        152 (17:05) or carve through ironSha no Sho, Page 265) ****Breath Attack (With
        Great Fireball TechniqueBoruto: Two Blue Vortex, Chapter 11) ***Life Manipulation
