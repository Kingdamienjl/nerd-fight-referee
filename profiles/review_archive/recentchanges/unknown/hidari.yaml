    - field: weaknesses
      value: 'Double''s ability to function is dependent on the condition of both
        Shotaro and Philip. If their synchronization is somehow disrupted, Kamen Rider
        Double will be unable to move properly. If their Rider form takes any significant
        amounts of damage, both of them will feel the pain after returning to normal
        and Philip will often pass out due to his weaker constitution. Notable Attacks/Techniques:
        *Joker Extreme: CycloneJoker''s Maximum Drive finisher, during which a tiny
        controlled tornado lifts Kamen Rider Double into the air before Kamen Rider
        Double''s body splits down the middle as the halves reach their target in
        a drop kick fashion. A variation of this attack involves Kamen Rider Double
        jumping off the back wheel of Kamen Rider Accel Bike Form, allowing for faster
        acceleration upon descent. *Metal Twister: CycloneMetal''s Maximum Drive finisher,
        where Kamen Rider Double spins around while swinging the Metal Shaft covered
        in an aura of wind. When Stag Phone attached to the Metal Shaft, it allows
        Kamen Rider Double to perform the Metal Stag Break Maximum Drive, crushing
        the Dopant between two pincer-like energy projections emitted from the Metal
        Shaft. *Trigger Aerobuster: CycloneTrigger''s Maximum Drive finisher, firing
        multiple shots of pressurized air at the enemy. When Bat Shot attached to
        the Trigger Magnum, it allows Kamen Rider Double to perform the Trigger Bat
        Shooting Maximum Drive, locking onto the target through the Bat Shot and then
        firing a concentrated blast from the Trigger Magnum with pinpoint precision.
        *Metal Branding: HeatMetal''s Maximum Drive finisher, causing one or both
        ends of the Metal Shaft to ignite on fire and deliver a final blow to the
        opponent. A variation of this attack is the Steam Metal Branding, a tandem
        attack used in combination with Kamen Rider Accel''s Engine Blade which is
        only seen in the Hyper Battle DVD. *Joker Grenade: HeatJoker''s Maximum Drive
        finisher, during which Kamen Rider Double somersaults in mid-air, then HeatJoker''s
        body splits down the middle during descent as the halves each hit the target
        with elementally energized hooks. *Trigger Explosion: HeatTrigger''s Maximum
        Drive finisher, which fires a single constant stream of fire that completely
        vaporizes the enemy. HeatTrigger is the only form of Kamen Rider Double''s
        that has attempted to perform a Twin Maximum, in which the Trigger Magnum
        blasts out a massive fireball that incinerates anything in its path. *HeatMetal''s
        Unnamed Maximum Drive: After inserting the Heat Memory in the Maximum Slot,
        Double creates a massive fire energy on HardMammother and incinerates anything
        in its path. *HeatTrigger''s Unnamed Twin Maximum Drive: After inserting the
        Trigger Memory in the Trigger Magnum and the Heat Memory in the Maximum Slot,
        Double blasts out a massive fireball that incinerates anything in its path.
        *Trigger Full Burst: LunaTrigger''s Maximum Drive finisher, which fires multiple
        charged homing shots at the enemy. When Stag Phone attached to the Trigger
        Magnum, it allows Double to perform the Trigger Stag Burst Maximum Drive,
        crushing the Dopant between two pincer-like energy projections shot from the
        Trigger Magnum. *Joker Strange: LunaJoker''s Maximum Drive finisher, during
        which LunaJoker splits down the middle, the Luna half makes four copies of
        itself, and all five Luna halves execute rapid-fire karate chops on the target,
        and then the Joker half strikes the target with an energy powered chop. *Metal
        Illusion: LunaMetal''s Maximum Drive finisher where Kamen Rider Double spins
        the Metal Shaft around to create golden rings that float around Kamen Rider
        Double, before unleashing them upon the target all at once. *Fang Strizer:
        The Maximum Saber is used to perform FangJoker''s Maximum Drive, an flying
        roundhouse kick in which a projection of the Fang Memory''s head is shown
        "biting" the opponent when Kamen Rider Double comes in contact. This can be
        used with Accel''s Accel Glanzer to perform the Rider Twin Maximum finisher.
        *Double Xtreme: CycloneJokerXtreme''s Maximum Drive; after closing and opening
        the Xtreme Memory, a twister forms around Kamen Rider Double that lifts him
        into the air to then accelerate him down towards his target. *Double Prism
        Xtreme: By using the Prism Memory in the Double Driver''s Maximum Slot and
        activating its Maximum Drive as well as the Xtreme Memory''s Maximum Drive,
        it enables CycloneJokerXtreme to perform a powered-up version of the Double
        Xtreme which extends the initial drop kick into bicycle kicks. In this form,
        Kamen Rider Double wields the Prism Bicker which has its own Maximum Drives.
        *Golden Xtreme: CycloneJokerGoldXtreme''s Maximum Drive, an more powerful
        version of Double Xtreme. *Prism Break: After inserting the Prism Memory into
        the Prism Sword and by pressing the Maximum Starter button on its hilt, the
        Maximum Drive is initiated, either through an energized slash or a wave of
        energy. *Bicker Charge Break: An enhanced version of Prism Break when Double
        combining the Maximum Starter'
