        from old age as creatures that physiologically exist as pure life forceNaruto
        Chapter 90. Hidari is a fragment of a Ten-Tails, and thus it should also apply
        to him) *Chakra Manipulation **Chakra Nature Manipulation and Transmutation
        (Hidari is able to utilize two of the five basic Elemental Chakra Natures:
