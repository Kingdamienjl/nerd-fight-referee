        Lightning Release,Sha no Sho, Page 214 the user can produce and manipulate
        electricity and lightning. This Lightning can cause muscles to contract, bodies
        to go numb, and can outright cause temporary paralysisSha no Sho, Page 248Sha
        no Sho, Page 284) ***Fire Manipulation and Heat Manipulation (With Fire Release,
        the user heats up their chakra and produces flames that can burn whatever
