    - field: weaknesses
      value: 'He can''t use Chidori effectively because it''s difficult to control
        without the Sharingan, which he doesn''t have. He needs the assistance of
        the God Tree to regenerate from extensive damage. If he''s prevented from
        traveling to it with the claw marks, he won''t be able to regenerate. Notable
        Attacks/Techniques: *Fire Release: **Great Fireball Technique: The user kneads
        chakra in their body and turns it into fire, which they then expel from their
        mouth; the more chakra they use, the more flames that are produced. Sometimes
        the flames lack a distinct shape, being only a stream, but more often than
        not they take the form of a giant orb that maintains its shape until hitting
        a target. Upon impact, the fireball is powerful enough to crater the ground
        and vaporise the surroundings. Against living targets, the fireball can cause
        extensive burns. *Lightning Release: **Chidori: The Chidori is a high concentration
        of lightning chakra channelled around the user''s hand. To perform, the user
        first gathers lightning to their hand; the high concentration of electricity
        produces a sound reminiscent of many birds chirping, hence the name. Once
        the chakra is gathered, users charge at their target and thrust the Chidori
        into them, piercing them and typically causing fatal damage. Despite the sound
        it makes, the rapid speed at which it''s used makes it useful for assassinations.
        ***Chidori Current: Chidori Current is a ninjutsu that was developed by Sasuke
        Uchiha while he was training with Orochimaru. By releasing the Chidori in
        every direction, an electrical discharge flows from the user''s entire body
        allowing him to affect multiple enemies. When using this attack on a great
        number of enemies at once, it can effectively double as an instant defence.
        The body of the person touched by the Chidori will misinterpret the lightning
        nature as "electrical signals from the nerves", making its muscles contract.
        This causes the body to involuntarily go stiff, while at the same time receives
        damage. This attack can also be channelled through the ground to increase
