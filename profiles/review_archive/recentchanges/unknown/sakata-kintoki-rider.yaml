    - field: weaknesses
      value: 'the bulls and the chariot stride across lightning strikes, manifestations
        of Zeus, allowing it to move through the air just as easily as across the
        ground. Originally an offering to Zeus from King Gordius, and it tramples
        and crushes anyone it hits. Its form changes to accommodate its terrain better.,
        Via Expugnatio: Distant Trampling Domination: The Gordius Wheel''s trump card.
        This powerful charging attack acts as one of his Noble Phantasm, unleashing
        lightning strikes with every step and crushing foes underneath the bulls''
        powerful hooves. If the target is not strong enough to match the charge and
        fails the saving throw, they will take additional damage from being trampled
        by the bulls and the chariot''s wheels. Ionioi Hetairoi: Army of the King:
        Alexander the Great''s ultimate Noble Phantasm, an EX-ranked Anti-Army Reality
        Marble that summons all those that fought with him in life. Alexander''s kingship
        and abilities as a commander are the concepts of his Reality Marble. It is
        born from the collective belief and dreams of him and his army. He is not
        a magus, nor a demon, and cannot use it without his soldiers as a result.
        It recreates the landscape that Alexander and his soldiers had fought and
        won, imprinted on the heart of every soldier, a desert that stretches out
        into the horizon. It also maximizes Alexander''s Charisma. Once the Reality
        Marble is fully manifested, it summons his army, numbering in the tens of
        thousands, each of whom has become a minor Heroic Spirit after their death.
        It is a diverse fighting force, and each soldier is incredibly skilled and
        fought alongside Alexander in life. They display the full violent extent of
        Alexander''s tyrannical kingship, sweeping across the landscape. The army
        is made up of many heroes, Bucephalus. Each of the soldiers is Masterless
        Servants that cannot leave the Reality Marble. Still, Alexander can summon
        a single soldier into the world without activating the Reality Marble, often
        summoning Bucephalus. It includes warriors stronger than Alexander, as he
        is a king and not a fighter, possessing B-ranked Charisma of their own. As
        it is maintained by the entire army''s collective magical energy, if a large
        portion of the troops is destroyed, this ability cancels the spells altogether.
        As he was barely exposed to magic in his life, Rider''s D-Rank Magic Resistance
        is only enough to negate simple Single-Action magics, more advanced spells
        will affect him. Riding: The ability to ride mounts. Rider''s A+ rank in this
        skill allows him to ride mounts of all creatures and animals, even those on
        the level of Phantasmal and Divine Beasts, enabling him to control the bulls,
        powerful Phantasmal Beasts described as "Children of Zeus, which increases
        allies'' ability during group battles. At A-rank, Alexander can be said to
        have achieved the highest popularity possible for a human being. Divinity:
        The measure of one''s Divine Spirit aptitude, reflected in high ranks by the
        user becoming part Divine Spirit. At A-rank, it is even an indicator as one
        who has reached the Throne of Gods. Additionally, it possesses another effect
        that allows one to reduce "Anti-Purge defense" in proportion to the rank of
        their Divinity, allowing them to break through defensive abilities such as
        Protection of the Faith and Saver''s Enlightenment of the Sacred Fig. Rider''s
        C-rank is gained from his reputation as one who was said to be a son of Zeus.
        Military Tactics: The tactical knowledge used for battles where armies are
        mobilized, providing advantageous modifiers when dealing with an opponent''s
        Anti-Army and Anti-Fortress Noble Phantasms, or when using his Anti-Army and
        Anti-Fortress Noble Phantasms. As a famous conqueror and leader who never
        lost a battle, Iskandar''s tactical acumen is legendary'
