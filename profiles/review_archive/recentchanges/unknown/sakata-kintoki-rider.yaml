    - field: weaknesses
      value: 'Golden Drive - Good Night: Night Wolf Deadly Nine - Golden Dash, Golden
        Drive: Kintoki''s cherished mount. Known also as the Golden Bear Mk. 1, it
        is a large motorcycle imbued with the thunder god''s power that is bound to
        him when he is summoned as a Rider. It has the power to transform itself by
        its very nature, most particularly when releasing its True Name to ram his
        enemies with. Its tires are the transformed drums of the thunder god, once
        used originally to calm Minamoto no Raikou when she was suffering from nightmares
        in life but have now become part of Kintoki''s mount., Golden Drive - Good
        Night: Night Wolf Deadly Nine - Golden Dash: Kintoki''s Noble Phantasm when
        releasing its True Name transforms his trusty mount, into its high-speed charging
        configuration form designed to ram straight into his opponent. As he rides
        on to ram down his enemies, the tires power rise with every turn as Kintoki
        travels farther and farther, Riding: The ability to ride mounts. Due to Kintoki''s
        ambiguous classification as a Rider and possession of a Rider Belt, Animal
        Dialogue: The ability to converse with animals who don''t speak a "language
        of words". Kintoki possesses a C-Rank in this skill, preventing him from conveying
        very complex nuances. But since his mental structure is much like an animal,
        he can reach a mutual understanding with them., Divinity: The measure of one''s
        Divine Spirit aptitude, reflected in high ranks by the user becoming part
        Divine Spirit. At A-rank, it is even an indicator as one who has reached the
        Throne of Gods. Additionally, it possesses another effect that allows one
        to reduce "Anti-Purge defense" in proportion to the rank of their Divinity,
        allowing them to break through defensive abilities such as Protection of the
        Faith and Saver''s Enlightenment of the Sacred Fig. While it would normally
        be of a low rank of D, Kintoki''s class as a Rider emphasizes his heritage
        as a son of a thunder god, resulting in a higher rank of C., Natural Body:
        The possession of a perfect body from the day of one''s birth. Because of
