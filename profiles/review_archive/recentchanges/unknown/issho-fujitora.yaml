power_scale:
  tier:
    text: Low 5-B
    source_ids: &id002
    - mediawiki-9768
    confidence: 0.95
  attack_potency:
    text: Small Planet level (As a Navy Admiral and one of the "Greatest Military
      Powers," Issho should be superior to CP0 and SSG members like Sentomaru. Fought
      Revolutionary Army commander Karasu during the assault on Marijoa, and later
      engaged in battle with Aramaki, all while holding back significantly and only
      sustaining minor injuriesOne Piece Vol. 92 Chapter 925One Piece Vol. 104 Chapter
      1054One Piece Vol. 107 Chapter 1083One Piece Vol. 107 Chapter 1085. Easily fought
      and overpowered Sabo while being casual the entire fight. Should be roughly
      comparable to his fellow Admirals. According to Monkey D. Garp, the strongest
      possible forces available during the Reverie, capable of fighting threats like
      Big Mom and Kaidou, were assigned to protect the Celestial DragonsOne Piece
      Vol. 90 Chapter 907. During the Revolutionary Army's assault, Rob Lucci and
      a select group of CP0 agents were sent to guard Nefertari Vivi, while Issho,
      alongside Aramaki, were tasked with defending the Celestial Dragons. This implies
      that Issho is at least comparable to Rob Lucci in strength and considered powerful
      enough to confront top-tier threats. Has one of the Supreme Grade Blades, a
      tier of powerful weapons only a handful of the strongest have3.014 Zettatons)
    source_ids:
    - vsbattles-issho-fujitora-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Relativistic+ with Speed of Light perceptions with Observation Haki (Has
      speed roughly on par with Aramaki, as evident from the two Admirals' scuffle
      at Marijoa. Easily kept pace with Sabo.)
    source_ids:
    - vsbattles-issho-fujitora-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class E (Clashed with and pushed back against Gear 2nd and 3rd Luffy plenty
      of times. Should be relative to Aramaki, as they have a scuffle on Marijoa),
      Class Z with Press Press Fruit (Should be relative to Kizaru. Along with the
      Stone Pica statue, Fujitora lifted the entire rubble of the country of Dressrosa)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
