    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Weapon Mastery, Immortality (Types
        1, 2, and 5; Deathurge is a being that is not aliveQuasar Vol 1 #23 at allQuasar
        Vol 1 #39 and since he''s an embodiment of death, "killing him means creating
        him"G.L.A. Vol 1 #2), Abstract Existence (Type 2; Deathurge is the embodiment
        of "self-destruction"Quasar Vol 1 #2 that is shared by "all living beings
        everywhere". He''s also an embodiment of death), Flight, Intangibility (He
        can phase through wallsMarvel Two-In-One Vol 1 #72, the floor and peopleAvengers
        Vol 1 #248, physical objects, and even blasts of energyRune/Silver Surfer),
        Empowerment and Statistics Amplification (Deathurge feeds himself up with
        the negative, self-destructive feelings and loss of faith and hope of his
        target, making him stronger based on how much his target "seeks oblivion"),
        Incorporeality (His body is composed by "Darkforce"Official Handbook of the
        Marvel Universe A-Z Update Vol 1 #2, which he claims to be "a force given
        form by the despair and guilty suffered by every living, breathing creature
        in the universe"), Cosmic Awareness (He can sense when someone have self-destructive
        feelingsHellstorm: Prince of Lies Vol 1 #13. Doorman, while in the role of
        Deathurge, could use "death senses" to sense whenever someone was dyingGLX-Mas
        Special), Darkness Manipulation and Weapon Creation (His main method of attack
        is to create weapons from the same substance that composes his body. Some
        examples include axes, spears, a bow and arrows, a sword and a shield, chains,
        piles and maces, and his skies), Homing Attack (His spear chased Maelstrom,
        ignoring attempts to block it), Death Manipulation (When one of his weapons
        hits a target, they start to be covered in a blackness that kills on cellular
        level. In some cases, this is instantaneous), Durability Negation (His attacks
        can bypass the target''s body and cause tremendous weaknesses - or death -
        as they aren''t exactly physicalMarvel Comics Presents Vol 1 #138), Teleportation
        (He can teleport), Soul Manipulation (He can carry souls to the afterlifeG.L.A.
        Vol 1 #1), Empathic Manipulation (Made Silver Surfer feel a load of negative
        emotions and have depressive thoughts), Perception Manipulation and Invisibility
        (He can become invisible to specific people) and Shapeshifting (His form changes
        based on his target)'
