  intelligence:
    text: Genius (Although generally seen as dumb, Bizarro can more accurately be
      described as simply thinking in a different way than the typical. As such, he
      has displayed surprisingly genius intelligence when it comes to more objective
      fields such as technology, and has built successful rocket shipsSupergirl Vol
      5 55. Otherwise, Bizarro has rather keen critical thinking skills, though often
      uses them for strange, out-of-the-box, and usually destructive (but frequently
      successful) solutions for problems, such as destroying a battlefield to end
      a war. Managed to create a planet by himself.Action Comics Vol 1 856. He is
      however, easy to manipulate, unaware of his strength, and struggles with communication
      to non-Bizarros. Shown to have good people skills, examples include uniting
      an army of Supergirl's, Supermen, and BatmenSuperman/Batman Vol 1 24Superman/Batman
      Vol 1 25 and restoring Superman and Jimmy Olsen's friendshipSuperman Vol 2 221)
