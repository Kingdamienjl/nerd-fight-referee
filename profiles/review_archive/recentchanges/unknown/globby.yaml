        advantage of this weakness in various ways, such as grabbing it to forcefully
        pull Goop back or shooting it with a Positron Blaster, which causes Goop to
        spin rapidly and explode into multiple parts. Additionally, the Anti-Gravity
        Projector can also simply be switched off. If Goop's Anti-Gravity Projector
        is separated from him or deactivated, Goop's body collapses into a puddle,
        only capable of slowly slithering around until it is reactivated or he recollects
        it. Despite being able to survive being atomized, Goop will start to hurt
