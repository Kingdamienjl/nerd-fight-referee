- id: claim-weaknesses-c65a93be
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques: * Beam Knife: Marino's starting\
    \ weapon, a pair of small laser knives that she uses to attack twice. * Beam Blade:\
    \ A pair of short laser swords with straight blade (similar to a Ninjat\u014D\
    ) that attacks two times. * Beam Sword: A pair of short swords that Marino uses\
    \ to attack twice. They possess slightly better defensive stats than her other\
    \ weapons (Second only to the Vengeful Needles), but they weigh more than most\
    \ of her other weapons as a trade-off. * Beam Chakram: A pair of laser chakrams\
    \ that Marino uses to attack three times * Beam Wonder/Miracle: A pair of purple\
    \ laser blades shaped like a question mark that Marino uses to attack at close\
    \ range. Wonder attacks with More Learning to boost the amount of EXP obtained\
    \ from the enemy if it gives the final blow, while Miracle attacks with A Little\
    \ Rich which's final blow boosts the Zenny obtained. * Beam Dagger: A pair of\
    \ laser daggers with two blades that attacks with Eye Closer, which may cause\
    \ Blind status to the target. * Vengeful Needles: A pair of hand-held paper fans\
    \ that causes the same amount of damage Marino received before her attack. If\
    \ she isn't attacked before her attack, no damage is inflicted. The damage received\
    \ can be accumulated by not attacking with the weapon, inflicting more damage\
    \ when used in her turn. The damage is lost if she is defeated. * Fire/Ice/Thunder\
    \ Star: A elemental energy kunai that Marino uses to attack with Triple Arrow,\
    \ throwing three of them at one enemy. * Fire/Ice/Thunder Comet: Same as Fire/Ice/Thunder\
    \ Star, but Marino attacks by throwing five kunais at the enemy instead of three.\
    \ * Fire/Ice/Thunder Stella: Same as Fire/Ice/Thunder Star, but Marino attacks\
    \ by throwing one kunai in a barrage at each enemy present. * Emotional Reel:\
    \ Marino's Action Trigger, which allows her to use offensive skills and liberate\
    \ enemies of valuable items that would otherwise be difficult to take. ** Marino\
    \ Stamp: A simple aerial kick that does mediocre damage. ** Hyper Dive: A diving\
    \ attack at 200% damage pwoer. ** I'll Take That!: A 1-hit attack which guarantees\
    \ a chance to steal an item from the enemy. ** Your Life, Please!: A 3-hit S attack\
    \ at 50% power, which heals Marino's life energy by the amount of damage. ** Scattered\
    \ Flower: Marino throws six needles, which deals 250% damage with a high chance\
    \ of instant-kill. ** Mirage Dive: Marino creates two afterimages of herself and\
    \ they use an aerial kick that damages all enemies. * Quicksilver: Marino's Hyper\
    \ Mode, which highly increases her speed, enabling Marino to act several turns\
    \ in a row. Her life energy and power also receive a small boost. Lasts for 5\
    \ turns. ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters\
    \ Category:Female Characters Category:Robots Category:Mega Man Category:Game Characters\
    \ Category:Antiheroes Category:Element Users Category:Knife Users Category:Sword\
    \ Users Category:Transformation Users Category:Fire Users Category:Electricity\
    \ Users Category:Status Effect Users Category:Self-Sustenance Users Category:Absolute\
    \ Zero Users Category:Playable Characters Category:Fan Users Category:Blade Users\
    \ Category:Chakram Users Category:Martial Artists Category:Weapon Masters Category:Ice\
    \ Users Category:Video Game Characters Category:Good Characters Category:Protagonists\
    \ Category:Thieves Category:Thrown Weapon Users Category:Dual Wielders Category:Armor\
    \ Users Category:Danmaku Users Category:Reploids Category:Afterimage Users Category:Death\
    \ Users Category:Healers Category:Weapon Users Category:Shuriken Users Category:Boomerang\
    \ Users Category:Kunai Users Category:Stealth Masters Category:Statistics Amplification\
    \ Users Category:Damage Boost Users Category:Damage Reduction Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-6d9c5ffd
  section: abilities
  axis: hax
  text: '*Reploid Physiology (General) *Expert Hand-to-Hand Combatant *Weapon Mastery
    *Stealth Mastery *Transformation & Damage Boost (Via Quicksilver Hyper Mode) *Statistics
    Amplification (Can increase her speed via Godly Speed in X Dive and Quicksilver
    Hyper Mode) *Danmaku (Can throw three or five shurikens simultaneously) *Damage
    Reduction (Can reduce damage taken from enemies when her health is 50% or higher
    via Homeopathy Adaptability) *Ice Manipulation and Absolute Zero *Fire Manipulation
    (Hotter than the Earth''s core via superiority to Mega Man) *Electricity Manipulation
    *Status Effect Inducement (Can render her opponent temporarily blind and immobile
    via Beam Dagger/Enzuigiri respectively) *Afterimage Creation (Can create afterimages
    of herself) *Death Manipulation (Scattered Flower has a high chance of inflicting
    instant-death) *Healing (Can heal her life energy equal to damage given via Your
    Life, Please!) *Resistance to: **Reploid Physiology (General) **Cosmic Radiation'
  source_ids: *id003
  decisive: true
