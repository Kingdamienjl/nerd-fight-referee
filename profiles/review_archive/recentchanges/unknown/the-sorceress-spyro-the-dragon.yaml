    - field: weaknesses
      value: "Is extremely curious, cocky and arrogant., His powers are limited and\
        \ will need to be regained when being used so much., Somewhat cocky and impulsive,\
        \ Fire: A staple when it comes to dragons, Spyro can breath hot fire to burn\
        \ his enemies down, or shatter wooden containers. This fire is also hot enough\
        \ to turn metal red. Assuming it\u2019s stainless steel, this means Spyro\u2019\
        s flame can reach temperatures up to 1,077 degrees Fahrenheit. In Legends,\
        \ this ability lets Spyro shoot flameballs that travel much farther than before.,\
        \ Triple Flameballs: Shoots three Flameballs instead of one., Fire Shield:\
        \ Generates fire shields around him when he uses his Flameball attack., Exploding\
        \ Fireblast: His central Flameball ignites into an explosive force that not\
        \ only does more damage but hits multiple enemies., Fiery Frenzy: Spyro charges\
        \ and shoots a giant fireball with two fireballs beside it., The Daybringer\
        \ Flame: Builds up this attack, ice spikes, surround himself is an ice tornado\
        \ (which sends ice shards flying everywhere) as well as freeze his own tail\
        \ and extend it\u2019s range to perform a wide ranged spinning attack. He\
        \ can also freeze enemies as well as any water that comes into contract with\
        \ it., Bubble: Spyro cannot harm enemies or kill fodder with this breath,\
        \ but can use it to capture dragonflies in bubbles and also break open butterfly\
        \ jars., Aether is a spiritual matter that the universe is made of and is\
        \ Spyro\u2019s true element. It is often referred to as spiritual energy and\
        \ is the most powerful energy that Spyro can manipulate. Spyro in his normal\
        \ form utilizes Light Aether. He can channel Aether through the use of beam\
        \ attacks as well as use Aether to heal himself and open portals to other\
        \ dimensions. Its major downside is that Spyro can become extremely exhausted\
        \ after using Light Aether and can temporarily lose his elemental abilities.\
        \ Spyro can shoot purple beams of energy that can also take the form of his\
        \ head. This can also presumably take out Dark magic, Charge: Spyro charges\
        \ horn-first onto enemies and can also break metal vases and containers which\
        \ can't be destroyed with other attacks., Stun Charge: Enemies hit by his\
        \ charge become temporarily stunned., Comet Dash: A magic aura surrounds his\
        \ horns imbuing them with extra power and damage that burns enemies in its\
        \ path., Ibex's Wrath Charge: Builds up speed and such a destructive force\
        \ that it causes the very air around him to ignite into the magical form of\
        \ fiery ibex horns., Gliding/Flight: Spyro normally glides short distances,\
        \ but if he needs to go incredibly far distances, he straight up flies. He\
        \ can even fly over water and move at great speed., Spyro's Earth Pound: Performs\
        \ a devastating dive-bomb head smash while flying, damaging enemies all around\
