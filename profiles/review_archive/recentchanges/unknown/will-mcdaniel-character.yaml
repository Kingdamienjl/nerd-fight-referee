- id: claim-powers-and-abilities-ff9a7217
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Immortality (Type 4; Has died several
    times, but mysteriously always comes backTop 5 Weirdest Alien DiseasesSuper AbsorbentTrying
    Candy From Other DimensionsAlien Video Games Console However, this is not combat
    applicable), limited Space Survival (Survived being in the vacuum of space for
    a few minutes, though he was unable to breatheSpace Prison), minor Toon Force
    (Capable of deflating himself like a balloonThe Break Up Buddy (feat. Tomska)),
    Subjective Reality/Creation (Somehow caused Mr. Spatula Lipstick Face, his childhood
    imaginary friend, to become real and physicalThe (Imaginary) Friend Zone), Acausality
    (Type 1; Unaffected after having his parents erased from history by the Super
    Absorbent, which was also shown to have been capable of causing things to have
    never existedSuper Absorbent), Multiple Selves (Type 3; Instead of genitalia,
    Will has a head capable of speaking and thinking like a normal personTowel Talk),
    limited Bodily Weaponry (Possesses a mouth on his back full of teethThe Tooth
    Brushing Song), Vehicular Mastery (Capable of driving carsDon''t Feed Them), and
    Body Control (By pushing hard out of the sausage hole, Will can create sausages
    that taste like his personality.How to Cook a BBQ for an Alien Can deflate himself
    as if he was a balloonThe Break Up Buddy (feat. Tomska)) All previous abilities,
    plus Madness Manipulation (Type 1; Possessed cucumbers can bring instant insanity
    to those who touch its thornsHow to make a salad from possessed vegetables), Status
    Effect Inducement, Poison Manipulation (Insides of the Flesh Nuts are incredibly
    poisonousHow to cook Christmas Dinner for an Alien), Summoning (Eating the Lagoos
    candy will summon a demon-like creature, though the user can''t control them.Trying
    Candy From Other Dimensions Can summon Schplarbos by blowing into the Meat Whistle.Trying
    Candy From Other Dimensions Can also summon the Flour Demon and the Devil''s Udder,How
    To Bake A Possessed Cake as well as the Sweetness SlugTrying Candy From Other
    Dimensions Part 4), Corruption (The Assimilation Apple can corrupt its consumer
    into a husk of their former selves, only being able to talk about applesTrying
    alien fruit), Heat Manipulation (The Galaxy Fruit has a small ball of star-like
    fire, which is hot enough to do thisTrying alien fruit), Time Manipulation (The
    Fuddlezone7 has load times so short they reverse time itself.Alien Video Games
    Console The case for the Chrono-Steak can cause temporal annihilationI Tried Alien
    Steak), Insect Manipulation (Hive melons contain alien grubs insideTrying alien
    fruit), Minor Water Manipulation (If used, the Noise candy can make the person
    who''s hearing it drop large amounts of saliva for long periods of timeTrying
    Candy From Other Dimensions 2), Biological Manipulation (The Chrono-Steak can
    cause people to change into different periods of not only their life, but in the
    future of humanity, as demonstrated when Will had his head transformed into that
    of a baby and when he grew several noses in his faceI Tried Alien Steak), Plant
    Manipulation (Spore Sprouts release spores that embed themselves in human eardrumsHow
    to cook Christmas Dinner for an Alien), Matter Manipulation/Energy Manipulation
    (The Fuddlezone7 can convert organic matter into energyAlien Video Games Console),
    Dimensional Travel (By using his Portable Portal, Will can travel to any dimensionsHow
    To Invest In Other Dimensions For Beginners), minor Void Manipulation (Seen hereTrying
    Candy From Other Dimensions 3), Transmutation (Candy like the Cronen-Chew,Trying
    Candy From Other Dimensions the Orb,Trying Candy From Other Dimensions the Choco-GonsTrying
    Christmas Candy From Other Dimensions and others can transmute people), Fire Manipulation
    (Via gasoline and matchesDon''t Feed Them), Perception Manipulation (Taste Manipulation:
    The Taste-along Chew is capable of changing what the chewer is tasting according
    to what the doll saysTrying Candy From Other Dimensions 3), Enhanced Senses (One
    of the time crystals from the Chrono-Steak gave Will several noses. This allows
    him to have a great sense of smell and even have a sonar using this abilityI Tried
    Alien Steak), and Size Manipulation/Sealing (Whoever eats the Imprisonment Pop
    is shrunken down and forced to switch places with the being inside. The only way
    to get out is if someone else licks the Imprisonment PopTrying Candy From Other
    Dimensions Part 4) All previous abilities, plus Natural Weaponry (Bitey hair and
    lactating chin titsTop 5 Weirdest Alien Diseases)'
