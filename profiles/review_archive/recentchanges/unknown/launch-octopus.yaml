- id: claim-weaknesses-ebc80638
  section: weaknesses
  axis: weakness
  text: 'Cutting weapons, such as the Boomerang Cutter, can slice off his tentacles,
    leaving him unable to use his Whirlpool and Energy Drain techniques. Furthermore,
    heavy blunt force attacks, such as the Rolling Shield, can disorient him and cause
    massive damage to his internal buoyancy and pressure systems Notable Attacks/Techniques:
    *Homing Torpedo: Launches a torpedo that locks onto the nearest enemy and homes
    in onto them. He can also fire volleys of two to three missiles at a time, though
    these lose the majority of their homing ability. *Piranha: Launches four piranha-shaped
    torpedoes that home in on the nearest target. *Whirlpool: Spins rapidly in place,
    creating a whirlpool in the water that drags his opponent in, holding them in
    place and dealing damage to them. **Energy Drain: If the opponent is caught by
    his Whirlpool, he latches onto the opponent and begins draining their energy until
    they are able to struggle their way out of his grip. ==Notable Matchups== Victories:
    Losses: Inconclusive: Category:Characters Category:Male Characters Category:Game
    Characters Category:Video Game Characters Category:Game Bosses Category:Mega Man
    Category:Robots Category:Cephalopods Category:Leaders Category:Villains Category:Antagonists
    Category:Self-Sustenance Users Category:Homing Attack Users Category:Explosion
    Users Category:Martial Artists Category:Absorption Users Category:Water Users
    Category:Reploids Category:Mavericks (Mega Man) Category:Inorganic Beings Category:Additional
    Limbs Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
