    - field: weaknesses
      value: "Ichigo will rush into stuff without thinking first, he can be too merciful\
        \ on opponents. Notable Attacks/Techniques: Advanced Growth Rate: According\
        \ to both Aizen and Urahara, Ichigo's most astounding ability is his growth\
        \ rate; he grasps the basic control of advanced techniques in days where it\
        \ would take several years for even the most gifted Shinigami. Shortly after\
        \ gaining Shinigami powers and with no previous training, he began learning\
        \ advanced spiritual energy sensing techniques by sheer instinct. While it\
        \ takes most Shinigami at least 10 years to achieve Bankai, he did so in two\
        \ days (albeit with the assistance of a special device invented by Urahara\
        \ which was originally intended for three days). He gains considerable experience\
        \ in the use of Shunpo while training with Yoruichi, which was done over the\
        \ same period as his Bankai. Besides his improvements in his Shinigami abilities,\
        \ Ichigo greatly increased the time he could maintain his Hollow mask, from\
        \ eleven seconds to considerably longer amounts of time. During his first\
        \ fight with Ulquiorra, he is instantly incapacitated by one Cero blast, even\
        \ with his Hollow mask (which broke within a second), but only a few hours\
        \ later, he withstands another Cero from Ulquiorra without undergoing Hollowfication,\
        \ and can analyze Ulquiorra's movements much better than before, when he had\
        \ \"felt like [he] was fighting a machine or a statue\" and failed to predict\
        \ and counter his attacks. His latent abilities have been recognized by the\
        \ Wandenreich as potent enough to make him one of the Special War Powers of\
        \ Soul Society. Immense Spiritual Power: Ichigo has been noted on several\
        \ occasions to have tremendously vast levels of spiritual energy, well beyond\
        \ most other Shinigami. His spiritual power is noted to be heavy, which surprised\
        \ Renji Abarai. Ichigo constantly gives off Reiatsu at the level of a captain.\
        \ Even when worn-out in battle, he can continue fighting effectively while\
        \ still using Getsuga Tensh\u014D or unleashing and maintaining his Bankai.\
        \ Even at less than half strength, his spiritual energy is comparable to a\
        \ captain-level fighter. His energy is strong enough to hold back the S\u014D\
        kyoku, a halberd with the destructive force equivalent to one million Zanpakut\u014D\
        \ combined, using only his Zanpakut\u014D. His Reiatsu is light-blue in color.\
        \ After his training at the Soul King Palace, Ichigo was able to overwhelm\
        \ four Sternritter simultaneously and then calmly fight on par with a Sternritter\
        \ using Quincy: Vollst\xE4ndig using just his Shikai and eventually overpower\
        \ his foe. : Novice Reiatsu Control: Ichigo's spiritual energy is rather difficult\
        \ for him to control, as he has no formal training in controlling it, and\
        \ upon Hollowfication, his Reiatsu fluctuates wildly, with it being unreadable\
        \ at its lowest point and at its highest point greater than that of the fourth\
        \ Espada Ulquiorra Cifer. Due to this, and him having far more spiritual energy\
        \ than his body can consciously contain, it leaks out constantly, preventing\
        \ him from hiding it and effectively making stealth impossible when dealing\
        \ with other spiritually-aware beings. He has learned how to harden his spiritual\
        \ energy and enhance the strength of his attacks, or use it as a barrier to\
        \ reduce the impact of attacks on him, if not negating them completely. He\
        \ possesses some skill in channeling his spiritual power, as he was able to\
        \ destroy the Arbor of the S\u014Dkyoku, a seemingly impossible feat which\
        \ surprised the Gotei 13, by channeling his spiritual power through his sword\
        \ into the execution stand. According to Kirio Hikifune, Ichigo has gained\
        \ control over his fluctuating Reiatsu after his training in the Soul King\
        \ Palace, and it is now so powerful that it automatically becomes visible\
        \ when Ichigo is preparing to battle. Spiritual Awareness: Since he was a\
        \ child, Ichigo has had an innate ability to clearly see spiritual beings\
        \ and sense their presence. After becoming a Shinigami, his senses have continued\
        \ to improve with time, learning various advanced sensing techniques, such\
        \ as using a spirit ribbon to find Y\u016Bichi Shibata (in bird form). Even\
        \ from a considerable distance, he can detect the condition of a being with\
        \ spiritual power. During his intense fight against Kenpachi Zaraki, he clearly\
        \ sensed and recognized Sado's energy signature even as it weakened, despite\
        \ the considerable distance between them. === Shinigami"
