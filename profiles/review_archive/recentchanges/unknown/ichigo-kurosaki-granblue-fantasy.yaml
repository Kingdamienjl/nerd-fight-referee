- id: claim-weaknesses-66cfbf32
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Getsuga Jujisho: Ichigo performs
    2 Getsugatensho forming a cross dealing roughly 450% of his potency and lowers
    the enemies potency and special attack potency by 10% stacking up to 30%. with
    Zangetsu this potency is increased to 1250% and deals an additional 2 extra hit
    of dark damage. *Getsugatensho: Ichigo fires a projectile slash using his Spiritual
    power dealing 500% of his potency and dispelling amplifications or certain abilities.
    While Zangetsu is in effect, this ability deals an additional damage of the same
    potency. *Determination to Protect: Ichigo determination strengthens increasing
    his ability charge energy, his speed by thrice, and his Getsuga Jujisho''s Potency.
    While Substitute Soul Reaper is in effect. Ichigo protects his allies by substituting
    himself taking all the attacks even attacks that attacks multiple enemies or a
    wide area. *Nito-Zangetsu: Gains Zangetsu effect and charging up his Getsuga Jujisho
    while amplifying it to activate twice. *Zangetsu: Zangetsu increases his Potency
    and durability and reduces damage taken. *Hollow Soul Reaper''s Power: Whenever
    a Dark Chainburst is performed he follows up with Getsugatensho and gains stacking
    supplemental damage increase. *Quincy''s Power: His Quincy powers can reduce light
    damage he has taken to a certain degree, gains immunity to debuff, and gains a
    protective shield whenever an enemy performs a special attack. *Extended Mastery
    Support Skill: His Extended mastery increases his atk and durability for every
    Getsuga Jujisho he performs up to certain limit. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== Category:Characters Category:Granblue Fantasy
    Category:Bleach Category:Crossover Characters Category:Role-playing Characters
    Category:Damage Reduction Users Category:Energy Projection Users Category:Energy
    Users Category:Enhanced Senses Users Category:Extrasensory Perception Users Category:Fantasy
    Characters Category:Game Characters Category:Good Characters Category:Heroes Category:Humans
    Category:Hybrids Category:Male Characters Category:Non-Canon Characters Category:Non-Physical
    Interaction Users Category:Protagonists Category:Quincies Category:Shinigami Category:Statistics
    Amplification Users Category:Statistics Reduction Users Category:Teenagers Category:Video
    Game Characters Category:Weapon Users Category:Soul Users Category:Sword Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-f06a2e2a
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Extrasensory Perception (Capable of
    sensing Spiritual PressureBLEACH: Echoes in the Blue Hollow Chapter 1 Episode
    1 and can see ghosts) *Enhanced Senses (Can sense varying level of strength either
    from enemy presence or Spiritual pressure) *Energy Manipulation & Energy Projection
    (Capable of firing high-density Spiritual Pressure with Getsugatensho and Getsuga
    Jujisho) *Soul Manipulation (Shinigami passively exerts Spiritual Pressure) *Statistics
    Amplification (With Zangetsu) *Damage Reduction (Ichigo''s passive Quincy''s power
    allow him to greatly reduces damage from Light elemental attacks) *Statistics
    Reduction (With Getsuga Jujisho lowering the potency of enemies and their special
    attacks) *Non-Physical Interaction (Capable of attacking Ghosts and Spirits as
    Shinigami) *Aura & Soul Manipulation (Ichigo is able to resist Ulquiorra''s Spiritual
    pressure that is capable of paralyzing enemies as if crushing them or causing
    their hearts to poundEchoes in the Blue Hollow Chapter 3 Episode 2) *Status Effect
    Inducement (Ichigo''s Passive Quincy''s Power makes him virtually immune with
    specific exception against afflictionsStatus EffectsDebuffs which includes) **Poison
    Manipulation (From Poison and Toxicosis) **Burning (From Burned and Singed) **Corrosion
    Inducement (From Putrefiction) **Soul Manipulation (can resist their souls being
    taken out of their body into the afterlifeOdin Raid or Lich manipulating their
    soulLich Raid) **Sound Manipulation, Mind Manipulation & Morality Manipulation
    (From Tuning which is capable of changing, reading, and slightly controlling someone''s
    mind,Nio''s Trial of Eternals emotion,Niyon Skill Fate Episode and moralityNiyon
    Rematch Fate Episode, Confuse which confuses the target making them attack allies
    by mistake) **Slow and Gravity Manipulation (From Delay and Gravity Wave) **Perception
    Manipulation (From Blindness and Accuracy reduction) **Petrification (From Stoned)
    **Sleep Manipulation (From Sleep) **Paralysis Inducement (From Paralysis or Thunderstruck
    which lowers speed as result) **Necromancy & Power Modification (From Zombie which
    turns the target into zombies that takes damage from any healing properties, and
    Elemental Wedges which modifies your elemental properties making it a specific
    element and the enemies healing from it instead) **Death Manipulation (From Instant
    Death or Lethal Hit abilities) **Curse Manipulation (From Curse which negates
    any healing from being received) **Fear Manipulation & Energy Manipulation (From
    Petrify which fears the target making them unable to charge any energy or gain
    energy, and Shorted which makes the target unable to gain energy but can still
    use initially charged energy) **Statistics Reduction (From Atk Down which lowers
    potency, Defense Down which lowers Durability, Double and Triple attack down which
    lowers Speed of attacks, Elemental Atk and Def down which lowers Elemental resistance
    and potency) **Damage Reduction (From Special Atk lowered which reduces the damage
    of Special attacks) **Ice Manipulation (From Glaciate or Coldcage which lowers
