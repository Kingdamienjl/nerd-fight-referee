    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: *Getsuga Jujisho: Ichigo performs
        2 Getsugatensho forming a cross dealing roughly 450% of his potency and lowers
        the enemies potency and special attack potency by 10% stacking up to 30%.
        with Zangetsu this potency is increased to 1250% and deals an additional 2
        extra hit of dark damage. *Getsugatensho: Ichigo fires a projectile slash
        using his Spiritual power dealing 500% of his potency and dispelling amplifications
        or certain abilities. While Zangetsu is in effect, this ability deals an additional
        damage of the same potency. *Determination to Protect: Ichigo determination
        strengthens increasing his ability charge energy, his speed by thrice, and
        his Getsuga Jujisho''s Potency. While Substitute Soul Reaper is in effect.
        Ichigo protects his allies by substituting himself taking all the attacks
        even attacks that attacks multiple enemies or a wide area. *Nito-Zangetsu:
        Gains Zangetsu effect and charging up his Getsuga Jujisho while amplifying
        it to activate twice. *Zangetsu: Zangetsu increases his Potency and durability
