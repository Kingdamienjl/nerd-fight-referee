        \ at its lowest point and at its highest point greater than that of the fourth\
        \ Espada Ulquiorra Cifer. Due to this, and him having far more spiritual energy\
        \ than his body can consciously contain, it leaks out constantly, preventing\
        \ him from hiding it and effectively making stealth impossible when dealing\
        \ with other spiritually-aware beings. He has learned how to harden his spiritual\
        \ energy and enhance the strength of his attacks, or use it as a barrier to\
        \ reduce the impact of attacks on him, if not negating them completely. He\
        \ possesses some skill in channeling his spiritual power, as he was able to\
        \ destroy the Arbor of the S\u014Dkyoku, a seemingly impossible feat which\
        \ surprised the Gotei 13, by channeling his spiritual power through his sword\
        \ into the execution stand. According to Kirio Hikifune, Ichigo has gained\
        \ control over his fluctuating Reiatsu after his training in the Soul King\
        \ Palace, and it is now so powerful that it automatically becomes visible\
        \ when Ichigo is preparing to battle. Spiritual Awareness: Since he was a\
        \ child, Ichigo has had an innate ability to clearly see spiritual beings\
        \ and sense their presence. After becoming a Shinigami, his senses have continued\
        \ to improve with time, learning various advanced sensing techniques, such\
        \ as using a spirit ribbon to find Y\u016Bichi Shibata (in bird form). Even\
        \ from a considerable distance, he can detect the condition of a being with\
        \ spiritual power. During his intense fight against Kenpachi Zaraki, he clearly\
        \ sensed and recognized Sado's energy signature even as it weakened, despite\
        \ the considerable distance between them. === Shinigami"
