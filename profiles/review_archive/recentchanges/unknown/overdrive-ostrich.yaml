  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Sonic Slicer: Fires a blade of
    energy at his opponent, which can rebound off of surfaces multiple times at differing
    angles. He can also use the charged variant of this ability, which allows him
    to launch multiple energy blades into the air before they rain back down on his
    opponent. *Charge: Charges at his opponent in an attempt to ram into them or run
    them over. *Step: Similar to Charge, he skips towards his opponent in a jumping
    fashion to try to trample them. *High Jump: If his opponents attempt to flee,
    he can run parallel to them trying to outrun them, before leaping high into the
    air and slamming down on them. ==Notable Matchups== Victories: Losses: Inconclusive:
