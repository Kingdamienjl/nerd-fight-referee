    - field: durability
      value: "Inapplicable (AUP cannot be targeted, defined, reached, or interacted\
        \ with by any system in any layer. It possesses no form, no coordinates, and\
        \ no data presence. Even the God of Layer Two \u2014 holding absolute authority\
        \ over an infinite-dimensional reality \u2014 could not name, define, read,\
        \ erase, or confirm AUP's existence through any data channel: \"Nothing came\
        \ back. No resistance. No confirmation. No rejection It could measure.\")A\
        \ Game Syndrome, Part II\u2013III"
      source_id: character-stats-profiles-scratchmen-apoo-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: "True Namelessness \u2014 Any label directed toward AUP loses its destination\
        \ before arriving. The God of Layer Two's naming ability \u2014 which functions\
        \ as the act of creation itself, having never failed \u2014 failed entirely\
        \ upon contact with AUP: \"Not rejected. Not reflected back. It simply...\
        \ vanished, the way someone writes a label and then realizes that the box\
        \ it was meant to be affixed to never truly existed to receive anything at\
        \ all.\"'A Game Syndrome, Unregistered Existence \u2014 AUP is not hidden\
        \ or cloaked from detection, it is literally absent from every information\
        \ system across all layers simultaneously. Per author statement: \"It has\
        \ no name in the most fundamental sense \u2014 because a name requires a conceptual\
        \ identity that is registered in the information system of some dimension.\
        \ And this entity is not registered in the information system of any layer\
        \ in any dimension.\"'A Game Syndrome, Author's Notes, Acausality (Type 5\
        \ \u2014 exists outside all causal chains in all layers without exception)\
        \ \u2014 \"Power operates within systems of cause and effect. TCS is not registered\
        \ in any system of cause and effect.\"'A Game Syndrome, Author's Notes, Absolute\
        \ Untargetability \u2014 No system in any layer can generate a destination\
        \ coordinate for interaction with AUP. Every attempt at interaction \u2014\
        \ including by a Nigh-Omnipotent entity with absolute authority over an infinite-dimensional\
        \ reality \u2014 loses its address before arriving., Information Substrate\
        \ Manipulation \u2014 AUP touches the information substrate of every object\
        \ it passes through, changing the way those objects exist: \"from an existence\
        \ living and dynamic to an existence increasingly resembling a static representation\
        \ of itself, like a photograph slowly replacing the object it photographed.\"\
        'A Game Syndrome, Existence Alteration \u2014 Converts dynamic existence to\
        \ static states at the information substrate level. AUP does not destroy,\
        \ it converts the mode of existence of whatever its seepage contacts., Consciousness\
        \ Absorption \u2014 Draws consciousnesses into the Cognitive Strata (TCS),\
        \ the accumulated mass of absorbed awareness., Cross-Layer Seepage \u2014\
        \ Permeates multiple layers simultaneously, regardless of layer boundaries\
        \ or the laws governing each layer. Per author: \"TCS probably doesn't just\
        \ exist 'outside' Layer 2. It probably exists outside all layers simultaneously\
        \ \u2014 Layer 1, Layer 2, Layer 3, Elion's layer, my layer as the author,\
        \ and all the layers above mine that might exist but that I'll never know\
        \ about. Because the property of 'not registered in any information system'\
        \ is not selective. It applies universally.\"'A Game Syndrome, Author's Notes,\
        \ System Immunity \u2014 All powers that operate within any causal system\
        \ in any layer are inapplicable against AUP. This is not a resistance or a\
        \ nullification \u2014 it is the absence of the substrate that power requires\
        \ to function. The God of Layer Two's complete power set, including layer-scale\
        \ Existence Erasure, Causality Manipulation, produced zero effect., Pre-Narrative\
        \ Existence \u2014 AUP exists prior to the narrative of A Game Syndrome itself,\
        \ Immune to Existence Erasure (has no existence parameters within any information\
        \ system that erasure could target) *Immune to Causality Manipulation (not\
        \ registered in any causal chain in any layer) *Immune to Time Manipulation\
        \ (not bound by any temporal framework) *Immune to Spatial Manipulation (not\
        \ located within any spatial framework) *Immune to Mind Manipulation (no mind)\
        \ *Immune to Soul Manipulation (no soul) *Immune to Conceptual Manipulation\
        \ (no conceptual identity) *Immune to Law Manipulation (not subject to any\
        \ law in any layer) *Immune to Naming and Definition (any label loses its\
        \ destination address before arriving) *Immune to Nigh-Omnipotent power sets\
        \ (demonstrated: the God of Layer Two's absolute authority over an infinite-dimensional\
        \ reality was entirely ineffective) *Immune to Omniscient detection (the God\
        \ of Layer Two's simultaneous total consciousness coverage of all Layer Two\
        \ failed to read AUP's data)"
