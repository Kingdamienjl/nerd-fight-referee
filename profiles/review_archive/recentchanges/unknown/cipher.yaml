- id: claim-powers-and-abilities-ca80331d
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Longevity (Cipher is at least one thousand\
    \ years oldChest, Bear the Bygone Dust) *Extrasensory Perception (Enhanced Sight)\
    \ & Enhanced Senses **(Neutral Vision & Soul Vision; Can see soulsHero, Bear Thy\
    \ CoreflameKremnos, Cleanse Thy Rusted Blood (I)) *Pseudo-Flight (After flipping\
    \ the Coin of Whimsy, Cipher can use her immense speed to propel herself and amplify\
    \ her jumps, allowing brief flight) *Stealth Mastery (Cipher has demonstrated\
    \ great stealth skills, managing to slip past several guards and steal multiple\
    \ valuables without being noticed) **Sleight of Hand (She was able to pickpocket\
    \ a guard's keys using her tail without being noticed. https://www.hoyolab.com/article/39165444)\
    \ *Acrobatics (All Types; Cipher\u2019s medium build makes her very nimble, allowing\
    \ her to perform agile movements in confined spaces, control her momentum, and\
    \ run across wallsCipher Character Trailer \u2014 \"Piece of Cake\" | Honkai:\
    \ Star RailLies Dance on the Breeze) *Bodily Weaponry (Conventional; Cipher can\
    \ use her tail to grab and steal objects. She can also use her tail to hold onto\
    \ pillars while upside down) *Breaking the Fourth Wall (Cipher was able to break\
    \ the fourth wall by stealing the logo of Honkai: Star Rail) *Non-Physical Interaction\
    \ **(Spiritual, Mental & Information\u3010Type 2\u3011; Can interact with souls)\
    \ **(Memories; Should be able to interact with memories like the MC) **(Abstract\
    \ Existence\u3008Type 2\u3009\u3010Strife\u3011; Should be able to interact with\
    \ Nikador, the incarnation of Strife itselfKremnos, Cleanse Thy Rusted Blood (II))\
    \ *Summoning (Cipher can summon her Cat Magnet at willKeeping up with Star Rail\
    \ \u2014 Cipher: Wealth Comes in All Kinds of Ways! | Honkai: Star RailHoYoLAB:\
    \ Character Preview | Cipher) *Expert Magnet User *Imaginary Energy (Destruction\
    \ & Limited Elation) & Honkai Energy (Low-Level; Coreflames originate from Destruction,Earth,\
    \ Bear the Suffering of All which should function similarly to the Chrysos Heirs\
    \ that are stated to inherit Nanook's golden blood,Hero, Ignite That Primal Sun\
    \ which are congregations of Imaginary Internal EnergyAnti-Entropy Visual Novel:\
    \ Chapter 5, Part 2) *Absorption (Can use her Cat Magnet to suck up countless\
    \ objects inside it) *Dimensional Storage (Can store objects within her Cat Magnet,\
    \ which has a vast internal space) *Limited Creation (All of her attacks are capable\
    \ of creating coins) *Statistics Reduction, Statistics Amplification & Invisibility\
    \ (Cipher can decrease her enemies DEF decreased by 16%, inflicting the \"Theft\"\
    \ state on them, and while under the \"Theft\" state, enemies have their DEF decreased\
    \ by additional 8%.Lies Dance on the Breeze Hey, Jackpot for the Taking can weaken\
    \ her opponents, decreasing their DMG dealt by 10% and increasing Cipher's ATK\
    \ by 30%. Puss in Boots allows Cipher to become invisible and increases her movement\
    \ speed by 50%) *Statistics Amplification, Electricity Manipulation & Spatial\
    \ Manipulation (When Cipher flips the Coin of Whimsy into the air, her speed increases\
    \ so drastically that even those who could keep up with her at normal speed now\
    \ seem completely frozen from her perspective, allowing her to generate blue and\
    \ yellow electric bolts around her body while distorting the space around herPathstrider,\
    \ Set Sail Upon the River of SoulsFerryman, Ferry Me Across the Stream of Souls)\
    \ *Portal Creation (ZagreusChest, Bear the Bygone Dust is capable of creating\
    \ portals,\"Eternal Holy City\" Okhema - \"Spirithief\" Bartholos and as the bearer\
    \ of the Coreflame of Trickery, Cipher should possess this power) *Subjective\
    \ Reality (Every lie said by Cipher the Demigod of Trickery or the Titan Zagreus\
    \ turns into reality,Poet, Speak of the Sky Through Me (II) this is shown as Cipher\
    \ lied to Amphoreus that Kephale's protection will last for a thousand years,Slate,\
    \ Why Neglect That Light's Shade despite Kephale's protection lasting only for\
    \ three hundred years) *Duplication (Cipher's lies allow her to create as many\
    \ clones as she needs) *Shapeshifting & Sound Manipulation (Cipher can shapeshift\
    \ into anyone she desires, as well as change her voice according to the person\
    \ she has transformed into.Stars, Cleanse the Troubled Thoughts This ability also\
    \ works on objects) *Imaginary Energy & Honkai Energy (Low-Level) *Curse Manipulation\
    \ & Corrosion Inducement (Resisted defying her fate of being a female child of\
    \ Destruction. Those who dare to betray their fate as children of Destruction\
    \ will be afflicted with the Weathering Curse, which will corrode females' bodies\
    \ awayNon-Existent State) *Status Effect Inducement (Which in-game is represented\
    \ as Burning, Freezing, Electric Shock, Sharp Winds, Quantum Entanglement & Imaginary\
    \ Imprisonment)"
