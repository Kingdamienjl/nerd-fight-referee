        Has studied all about every student at Godolkin, knowning their powers, their
        rankings and academic history as well as other recorded part of their lives.
        Evolution; Forced himself to accelerate his evolution, in order to become
        capable of possessing Marie and Homelander), Social Influencing, Reputation:
        Thomas Godolkin was recognized as a brilliant scientist, his mind and work
        respected by the likes of Stan Edgar and Sage., Instigating Fear: As Cipher,
        he used his position as dean, alongside his cold demeanor and mysterious background,
        to intimidate the students, like Cate. Terrified Polarity by showing he doesn''t
        fear injury. Demoralized Jordan after having possessed them., Coercion: Forced
        Marie and Jordan to fight by threatening them to send them and Emma back to
        Elmira., Deception: Utilizing Doug Brightbill''s body, presented himself as
        "Dr. Gold" initially in order to regain access to the Odessa Program and then
        became "Cipher" to continue his work after the program was shut down. By possessing
        Polarity, he tricked Harper into giving away the whereabouts of Marie. Lured
        most of the students at God U. by falsely making them thinks he would reset
        the ranks for them to be promoted., Leadership: Spearheaded the Odessa Project.
        Repeatedly goated Marie into making progress and evolving her powers, if in
        manipulative ways., Superhuman Physical Characteristics (for Thomas Godolkin,
        as Cipher/Doug is just a human), Enhanced Hearing (All Supes have a wider
        range of hearing than humans, and it''s comparable to that of dogsGen V; Season
