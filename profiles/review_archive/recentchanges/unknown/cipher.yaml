- id: claim-standard-equipment-77048bc0
  section: equipment
  axis: equipment
  text: 'Her Cat Magnet that she can summon. Coin of Whimsy. Lies Dance on the Breeze:
    Increases the wearer''s SPD by 18%. After the wearer uses an attack, there is
    a 120% base chance to inflict the "Bamboozle" state on every enemy target. While
    under the "Bamboozle" state, enemy targets have their DEF decreased by 16% for
    2 turn(s). If the wearer''s SPD is higher than or equal to 170, there is a 120%
    base chance to inflict the "Theft" state on every enemy target. While under the
    "Theft" state, enemy targets have their DEF decreased by 8% for 2 turn(s). When
    "Bamboozle" or "Theft" is repeatedly inflicted, only the most recently inflicted
    instance takes effect. File:Lies Dance on the Breeze.png|Lies Dance on the Breeze'
