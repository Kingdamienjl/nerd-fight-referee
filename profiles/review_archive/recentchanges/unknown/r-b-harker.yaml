    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Human Achievements, Martial Arts,
        Acrobatics, Genius Intelligence (Combat applicable only), Vehicular Mastery,
        Stealth Mastery (He snuck into the Sheriff's base. The Sheriff had access
        to incredibly high tech machines that can affect reality along with hundreds
        of trained agents at his disposal, each able to move within Nevada, Hell and
        Improbability Drive spaces, yet none of them spotted Hank. Even Hank had a
        Sheriff tracker, and regular gunmen are shown with them on hand. Hank does
        this again later on against much more trained agents), Non-Physical Interaction
        (He can interact with beings inside Improbability Drive spaces, which contain
        Euclidian Geometry failure), Healing, Immortality (Types 4 & 8; The Higher
        Powers bring him back and heal him each time he suffers death from mortal
        wounds. The Higher Powers control the scheme of things, suggesting fate-like
        powers that give Hank and other Nevadans plot armor because of their physical
        and mental endurance. They are outright said to deny his death so that he
        can kill others. Later after the Higher Powers are controlled by Tricky, Hank
        survives not having half of his head, choosing not to fight while so badly
        battered), possible Reality Warping (One of Hanks crimes is "Distorting Reality"
        however this could just be propaganda against him), Empowerment (Emotion is
        a powerful factor in Nevada, so much so that Hank being ecstatic about his
        murders makes him more powerful and unstoppable than if he were furious, and
        his excitement is also what helps him be stronger than Sanford and Deimos),
        Explosion Manipulation (With grenades and rocket launchers), Statistics Amplification
        (Hank can amplify his reactions and speeds to respond to attacks faster and
        kill groups of enemies before they can fight back), Perception Manipulation,
        Afterimage Creation (Bullet Time slows his perception of time, increasing
        his speed and doubly giving him afterimages. He does this in normal combat
        as well), with Dissonant Reality Weapons, he has Energy Projection, Matter
        Manipulation, and Disassembly (Dissonant reality weapons fire dissonant energy,
        which can practically erase enemies, sometimes even with a single shot. they
        have even shown to be capable of taking down a Mag Agent), Resistance to Probability
        Manipulation, Gravity Manipulation, Physics Manipulation, Transmutation (The
        Improbability Drive gives control over improbability in order to cause things
        to happen, and while it effects everyone near Hank it doesn't effect Hank
        specifically. When doing this it changes gravity repeatedly and breaks the
        laws of physics, on one occasion creating falling whales and giant marshmallows
        in the sky before turning the sun itself into a normal grunt. Its power could
        also shift an entire building), Pain (Even after getting shanked by Jesus
        he could keep fighting and he was forced to keep fighting others while his
        jaw had been ripped off, the weakest beings of Nevada feel lots of pain and
        yet they still appear unaffected), Mind Manipulation, Corruption (He's been
        through Hell numerous times, whereas Hell would corrupt his allies but would
        never corrupt him), Trauma (He's murdered hundreds of grunts and agents, and
        could chainsaw their living bodies with no mental repercussion. Nevada generally
        doesn't have much humanity; there are no women, no children, no men. Just
        monsters. As time goes on the entropy of Nevada just increases due to the
        sheer madness. Part of this in Hank is due to his stronger mental constitutions),
        limited Emotional Manipulation (Relationships aren't really a thing in Nevada),
        and Fear Manipulation (Fear isn't a powerful motivator in Nevada), Weapon
        Mastery, Improbable Weapon Proficiency, Reality Anchoring, Time Manipulation
        (Can slow down time), Extrasensory Perception M.A.G Hank=All previous abilities
        and resistances, Afterimage Creation (Shown here), Electricity Manipulation
