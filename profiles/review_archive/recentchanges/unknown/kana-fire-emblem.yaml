- id: claim-standard-equipment-22d9c632
  section: equipment
  axis: equipment
  text: "Various swords, lances, bows, shuriken, staves, tomes, scrolls, Dragonstones\
    \ and Beaststones. Several of which increase various stats or decrease the opponent's,\
    \ and magical versions of each weapon type that deal magic based damage. Some\
    \ of the more notable weapons include: *Spirit Katana, Blessed Lance, Blessed\
    \ Bow, and Kris Knife, all of which deal extra damage against monsters and grant\
    \ regeneration to the wielder. *Raider Weapons that destroy enemy clothing and\
    \ armor on contact. *Venge Weapons that double Kana's attack power when the enemy\
    \ initiates the attack. *Votive Candle: Reproduces the effect of the Miracle skill.\
    \ *Freeze staff: Paralyzes the target. *Silence staff: The affected enemy cannot\
    \ speak/talk or use magic. *Entrap staff: Warps an enemy close to the user. *Rescue\
    \ staff: Similar to Entrap, this staff warps an ally close to the user. *Hexing\
    \ Rod: Curses the opponent, crippling their physical stamina and endurance and\
    \ limiting their regeneration. *Bifr\xF6st staff: Resurrects the dead."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-c0f20e2f
  section: power_scale
