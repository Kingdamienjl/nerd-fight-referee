- id: claim-powers-and-abilities-ed902676
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Weapon Mastery *Can Transform into\
    \ a Dragon, Wolfskin, or Kitsune *Accelerated Development * Magic, and Durability\
    \ Negation (Magic completely bypassesFire Emblem Engage - Chapter 4: A Land in\
    \ Bloom physical defenses such as armor,Fire Emblem: The Sacred Stones - Chapter\
    \ 4: Ancient Horrors or thick hidesFire Emblem: The Sacred Stones - Lute/Kyle\
    \ Support) **Fire Manipulation **Air Manipulation **Electricity Manipulation *Ice\
    \ Manipulation *Darkness Manipulation *Summoning *Healing via Staves *Water Manipulation\
    \ via Dragon Fang, *Can activate Dragon Veins *Regeneration (Low-Mid. Renewal\
    \ passively heals Kana, and healing is capable of mending stab wounds through\
    \ the torso Can also grant it to others) *Power Mimicry via Nohrian Trust *Power\
    \ Nullification with the Silence staff *Poison Manipulation *Damage Reduction\
    \ (Can reduce the damage of an incoming attack towards themselves or an ally)\
    \ *Empathic Manipulation with Voice of Peace *Status Effect Inducement *Curse\
    \ Manipulation with the Hexing Rod *Paralysis Inducement with the Freeze staff\
    \ *Statistics Amplification and Reduction *Absorption with Nosferatu *Damage Reflection\
    \ via Counter/Countermagic *Matter Manipulation with Profiteer and Salvage Blow\
    \ *Limited Spatial Manipulation with Swap *Teleportation of others *Resurrection\
    \ with Bifr\xF6st *Can somewhat ignore a speed difference between them self and\
    \ an opponent *Durability Negation with Rend Heaven and Luna *Limited Immortality\
    \ (Type 2, can survive a fatal blow with Miracle if his/her health was above a\
    \ certain point when struck) *Duplication (Can create a clone of themselves) *Flight\
    \ with several mounts *Non-Physical Interaction (Can harm souls) *Extrasensory\
    \ Perception Resistance to: *Magic (Via the resistance to magic stat directly\
    \ stated to exist like here) *Unconventional Resistance to Soul Manipulation (Characters\
    \ in Fire Emblem can consistently survive without their souls, albeit while being\
    \ reduced to a husk personality wise)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
