- id: claim-weaknesses-714383fc
  section: weaknesses
  axis: weakness
  text: Anti dragon Weapons, as well as anti beast weapons as a Kitsune or Wolfkin.
    Needs a Dragonstone or Beastatone to be able to control their Dragon form and
    Beast form respectively.
  source_ids: *id003
  decisive: false
