      so without assistance, and is a skilled fighter) Standard Tactics: Split Mushroom
      will jump around the area and latch onto a nearby surface, before sending up
      to 6 energy clones after the opponent. He will also create a near-identical
      clone of himself and proceed to hop and bounce around the arena. When at low
      health, he will also drop out of the air with his clone over the opponent and
      land headfirst into the ground, causing a plume of damaging spores to erupt
      from both of their heads.'
