    - field: weaknesses
      value: "Refuses to kill or use firearms. Has most normal human weaknesses, such\
        \ as the need to rest and eat. Note: Batman\u2019s suit, utility belt and\
        \ vehicles have several different iterations. However, considering the fact\
        \ that Batman is a perfectionist who is always overly prepared to rather comical\
        \ extents, it seems extremely unlikely that Batman would forgo any gadgets\
        \ or features between iterations of his technology or suit for no discernible\
        \ reason. Ergo, this profile will assume that all features from previous iterations\
        \ of Bat-tech have been carried over to their JLU counterparts, and that as\
        \ of JLU Batman still wields every gadget his utility belt contained in BTAS\
        \ or TNBA, or at least a newer gadget that also fulfills the purpose of gadgets\
        \ past. Note 2: Bruce Timm has stated that the original DCAU tie-in comics\
        \ are not canon, with the only tie in comics that have statements to the contrary\
        \ (other than Batman: The Adventures Continue, which has so many continuity\
        \ issues that it's essentially impossible to argue it's canon) being Justice\
        \ League Infinity, the Batman and Harley Quinn tie in comics, and specifically\
        \ the first annual of Batman Adventures. Ergo, I only consider those three\
        \ comics canon. Note 3: Scaling Bruce to Batman II may be somewhat contentious,\
        \ but it is rather consistent: As the man consistently implied to be the (overall)\
        \ strongest non-enhanced human in the verse, Bruce should outscale an aged,\
        \ out-of-shape Robin, who, while Joker was piloting his body, fought a suited\
        \ Batman II and \"(kicked) the stuffing out of him\", being overtly too strong\
        \ for him to defeat hand-to-hand (as made clear by Return of the Jokers screenplay)\
        \ to the point that Terry needed to resort to fighting dirty and taking advantage\
        \ of the Joker's vanity in order to land any substantial blows. In addition,\
        \ despite both being weaker than their respective opponents, Bruce performs\
        \ better against Venom-amped foes than Terry does. Despite not scaling to\
        \ his foe to any super-notable extent, Bruce (during Mystery of the Batwoman)\
        \ could hit Venomized Bane with a kick-throw combination strong enough to\
        \ escape from his grip. In contrast, Terry (whilst fighting Jackson Chappell,\
        \ who is likely weaker than Bane, considering Bane was a peak human (described\
        \ as a \u201Cman of great physical size and power\u201D) who took what appears\
        \ to be gallons of venom directly into his veins to amp himself, whereas Chappell\
        \ was a seemingly normal man who amped himself with a few small venom patches)\
        \ was plainly outclassed for their entire fight, with Terry being unable to\
        \ notably stagger Chappell with attacks, at least not to the extent that Bruce\
        \ staggered Bane. Furthermore, an aged, decrepit Bruce Wayne (who didn't believe\
        \ himself to be in his physical prime even when de-aged about twenty years)\
        \ could two-shot Shriek with his wooden cane - Shriek being someone capable\
        \ of taking a punch from Batman II and getting back up. Category:Goulden1998\
        \ Category:Tier 8 Category:Tier 9 Category:Superhuman Physical Characteristics\
        \ Users Category:Geniuses Category:Humans Category:Heroes Category:Superheroes"
