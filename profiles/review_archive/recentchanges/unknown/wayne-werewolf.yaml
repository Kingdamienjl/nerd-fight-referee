        \ Dodged attacks from Penguin while blinded. Evaded Joker's stab attempts\
        \ from all directions with only auditory clues) *Indomitable Will (Whilst\
        \ extremely sleep deprived, resisted Doctor Destiny's illusions and remained\
        \ lucid - these illusions even entranced Green Lantern (whose willpower needs\
        \ no introduction) and Superman before they were told none of it was real.\
        \ Forced himself out of Mad Hatter's mind control, which the Hatter seems\
        \ to think is impossible for any human mind) *Unparalleled Hand-to-Hand Combat\
        \ Mastery (The Caped Crusader's Martial Arts Mastery needs no introduction.\
        \ All of Batman's skills, which would include Martial Arts, have been \"honed\
        \ to an unparalleled level.\" Stated to have mastered martial arts and boxing.\
        \ Is one of the world's greatest practitioners of unarmed combat, and is an\
        \ expert in nearly every form of martial arts known to man. Is \"expertly\
        \ skilled\" in martial arts, a \u201Cmartial arts expert,\u201D and \"skilled\
        \ in virtually all forms of physical combat.\" Stalker, who has knowledge\
        \ of Batman's reputation (referring to him as \"legendary\" and \"the dark\
        \ demon of the concrete jungle\"), inferred from said reputation that \"Batman\"\
        \ could be an ageless soul that possesses each generation's \"greatest warrior.\"\
        \ Defeated Kyodai Ken, a renowned master of Martial Arts, and Batman himself\
        \ is referred to in Batman: Animated as \u201Ca martial-arts master.\u201D\
        \ Developed his own fighting style, which is a fusion of Karate, Old-fashioned\
        \ Street Fighting, Judo, and Jiujitsu. Is a master of various martial arts\
        \ who has studied under the world's best martial artists. Shows expertise\
        \ in Judo throws on several occasions. Is playable in Rise of Sin Tzu - every\
        \ single playable character in Rise of Sin Tzu is regarded by the game's manual\
        \ as wielding \"extraordinary martial arts abilities.\" Has defeated Bane\
