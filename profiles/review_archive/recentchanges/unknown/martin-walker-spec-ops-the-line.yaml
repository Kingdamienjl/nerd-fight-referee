  axis: weakness
  text: Completely delusional to the point he blames Konrad for all of the things
    that occurred in Dubai, despite Walker being responsible for all of the crimes
    committed during the events of the game. Though his delusions could be the result
    of the effects of White Phosphorus, which is capable of affecting people with
    such side effects. One of the side effects being hallucinations, which Walker
    is shown to experience later in the game
  source_ids: *id003
