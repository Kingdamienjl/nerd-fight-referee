        and unknowingly started a rumor the camp was haunted. Convinces Jason to kill
        others, it''s implied Jason believes if he kills enough people he can bring
        back his mom which was possibly given to him by Pamela. Convinced Alice she
        would help her for a short time. ** Fear Inducing; Started a rumor the camp
        was haunted. Alice quickly became fearful when just moments prior she was
