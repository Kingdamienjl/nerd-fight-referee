        in the camp as shown in her murders.) * Stealth Mastery (She committed murders
        without being caught and unknowingly started a rumor the camp was haunted.)
        * Vehicular Manipulation * Social Influencing ** Manipulation, Deception,
        and Charisma; When her son was murdered she was able to hide her crazy nature
        and kill two teens in 1957, it is implied she still worked as a cook after
