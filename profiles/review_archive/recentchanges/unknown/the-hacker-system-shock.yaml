    - field: tier
      value: "Inapplicable Note: AUP's tier is listed as Inapplicable not due to immeasurable\
        \ power output, but because the tier system itself \u2014 as an information\
        \ framework \u2014 does not apply to an entity unregistered in all information\
        \ systems. Supported by direct author statement: \"the concept of 'more powerful'\
        \ doesn't apply here. Power operates within systems of cause and effect. TCS\
        \ is not registered in any system of cause and effect.\""
      source_id: character-stats-profiles-the-hacker-system-shock-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: "True Namelessness \u2014 Any label directed toward AUP loses its destination\
        \ before arriving. The God of Layer Two's naming ability \u2014 which functions\
        \ as the act of creation itself, anchoring existence into the base substrate\
        \ of information \u2014 failed entirely upon contact with AUP. The definition\
        \ simply vanished without reaching any target., Unregistered Existence \u2014\
        \ AUP is not hidden or cloaked, it is literally absent from every information\
        \ system across all layers simultaneously. Even a total sweep of every consciousness\
        \ in Layer Two \u2014 every human, every infant, every bird \u2014 returned\
        \ zero traces of AUP., Acausality (Type 5; see classification note below)\
        \ \u2014 AUP exists at a level where the concept of causality was never established\
        \ as a functional framework. It is not \", immune to causality\" (which would\
        \ imply causality exists and AUP resists it). It is not \"outside causality\"\
        \ (which would imply causality is a container and AUP is beyond its walls).\
        \ AUP simply has no address in any causal system. Causality requires: *Cause\
        \ \u2192 Effect (temporal/logical sequence) *Dependency (one thing requires\
        \ another) *Directionality (before \u2192 after) AUP has none of these: *No\
        \ cause: AUP was never \"caused.\" It was not created, spawned, or generated.\
        \ It was found, already present, before any system existed. *No effect: AUP\
        \ does not \"do\" anything. It does not act, influence, or change. Its \"\
        effect\" is purely passive \u2014 absence filling space. *No temporal position:\
        \ AUP is not \"before\" or \"after\" anything. It exists at the point where\
        \ the concept of sequence was never written. *No dependency: AUP does not\
        \ depend on causality to exist. Removing all causality from all systems would\
        \ not affect AUP, because AUP was never registered in any causal chain to\
        \ begin with. Rewriting causality, reversing cause and effect, severing causal\
        \ links, or establishing new causal laws \u2014 none of these operations are\
        \ applicable, because they all require a target that exists within a causal\
        \ framework. AUP does not. \u26A0\uFE0F Classification"
      source_id: character-stats-profiles-the-hacker-system-shock-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Inapplicable (AUP does not attack. It alters existence parameters at
        the information substrate level without performing any action in the conventional
        sense. This operates prior to the framework that destructive capacity would
        describe)
      source_id: character-stats-profiles-the-hacker-system-shock-unknown
      provider_id: character_stats_profiles
      authority: high
