- id: claim-powers-and-abilities-8ee4de53
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics (Capable of causing damage to enemies
    like the Cortex Reaver and Cyborg Mutant with his Pipe/Wrench) *Absorption (With
    his Powerglove he can absorb large amounts of energy from conduit points in Citadel
    Station, which is stored in his Neural Interface to use at a later timeSYSTEM
    SHOCK REMAKE | Full Game Walkthrough | No Commentary: 08:57-09:10) *Data Manipulation
    & Technology Manipulation & Hacking (The Neural Interface allows the Hacker to
    insert their mind into Cyberspace Terminals and various pieces of tech around
    the stationSystem Shock Manual page 36. Without a Neural Interface or a way to
    enter Cyberspace, dealing with SHODAN is much more difficult as she can simply
    lock most of the doors around the stationSYSTEM SHOCK REMAKE | Full Game Walkthrough
    | No Commentary: 16:22-16:45. The Systems Analyser gives the Hacker information
    about the systems he has hacked into when he isn''t physically there to checkSystem
    Shock Manual page 34) *Enhanced Senses (Via Implants; Records where the Hacker
    has been and objects of interest in the area by projecting radar waves it uses
    to build a map of the Hackers surroundingsSYSTEM SHOCK REMAKE | Full Game Walkthrough
    | No Commentary: 07:00-07:05. The Target Identifier combines a laser rangefinder
    and radar scanner to identify foes and analyze their condition. Later versions
    track an enemy in combat with brackets in the view screen, especially useful in
    dark corridors. The Infrared Night Suit allows the hacker to see in Infrared frequencies.
    The Biological Systems Monitor tracks the Hackers Vital SignsSystem Shock Manual
    page 33) *Forcefield Creation (The Energy/Projectile Shield, creates a barrier
    around the hacker that absorbs the impact of kinetic and energy based attacksSystem
    Shock Manual page 31) *Limited Flight (The Turbo-Motion boots have Rockets in
    the bottom that allow for a small degree of upwards thrust) *Genius Intelligence
    (The Hacker is capable of gaining access to seemingly almost any corporations
    system. Hacking into TriOptimum''s systems lead to his arrest and the events of
    the start of the game. Where none of the scientists and computer techs on the
    station were able to remove SHODAN''s ethical constraints, Edward Diego required
    the services of the Hacker to achieve thisSYSTEM SHOCK REMAKE | Full Game Walkthrough
    | No Commentary: 00:00-5:00) *Purification (Type 1; The Environmental Protection
    suit emits an energy field that filters harmful contaminants, protecting the wearer
    from Environmental Hazards such as radiation and biological hazards) *Energy Projection
    (Via various energy weapons) *Limited Durability Negation (With the Laser Rapier;
    The DG-04 laser rapier utilizes a monofilament thread suspended in a contained
    energy field. The thread slices through organic and synthetic materials alikeMark
    IV Laser Rapier in game description) *Power Nullification (The JW-76 Mag-Pulse
    Rifle fires a ball of electromagnetic energy that completely fries the circuits
    of machinery and robotsJW-76 Mag-Pulse Rifle in game description) *Paralysis Inducement
    & Poison Manipulation (Via DH-07 Stun Gun which throws a weak plasma projectile
    at a target, discharging an arc that registers 10 kV to stun living creatures
    and damage cyborgs. The SV-23 Dartpistol delivers a potent NeurotoxinSystem Shock
    Manual page 29) *Fire Manipulation (The SK-27 Shotgun can be loaded with Dragons
    Breath rounds that explode into flames upon impactIn game description for Dragons
    Breath rounds) *Plasma Manipulation (The LG-XX fires spheres of charged plasma
    in a self-contained magnetic fieldIn game description for LG-XX Plasma Rifle)
    *Radiation Manipulation (Via Gas Grenades which emits a radioactive compound that
    instantly degenerates a targets nervous system) *Explosion Manipulation (With
    Fragmentation Grenades and Earthshakers) *Damage Boost & Statistics Amplification
    (With Berserk PatchesSYSTEM SHOCK REMAKE | Full Game Walkthrough | No Commentary:
    22:33-22:45 and Stamina PatchesSYSTEM SHOCK REMAKE | Full Game Walkthrough | No
    Commentary: 12:26) *Perception Manipulation (With Reflex Reaction AidSystem Shock
    Manual page 25) *Healing (Via Med Patches and Med Kits) *Enhanced Senses (With
    Sight Enhancement patches)'
