    - field: speed
      value: Inapplicable / Omnipresent (AUP does not travel. It exists simultaneously
        at the information substrate level of all spatial coordinates across all layers.
        When the God of Layer Two rewound time to the "zero point" before Layer Two's
        creation, the gap was already there. When He fast-forwarded to the farthest
        possible future, the gap remained unchanged.)
      source_id: character-stats-profiles-the-hacker-system-shock-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: "Inapplicable (AUP cannot be targeted, defined, reached, or interacted\
        \ with by any system in any layer. It possesses no form, no coordinates, and\
        \ no data presence. The God of Layer Two \u2014 with absolute authority over\
        \ an infinite-dimensional reality \u2014 could not name, define, read, erase,\
        \ or confirm AUP's existence. Every action taken against AUP either failed\
        \ or worsened the situation)"
      source_id: character-stats-profiles-the-hacker-system-shock-unknown
