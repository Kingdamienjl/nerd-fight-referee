        \ Bloodlust was added to help Killers, especially those with lower mobility\
        \ and/or no ranged attacks, catch up to Survivors who manage to evade them\
        \ for prolonged periods of time. == Equipments == * Minor Perception Manipulation:\
        \ Via Huntress Lullaby; those who are hooked find their perceptions muddled.\
        \ * Fear Manipulation: With Perks such as Friends 'til the End and Infectious\
        \ Fright, Killers can force Survivors to scream, revealing their location\
        \ * Power Nullification: Via The Third Seal; negates Extrasensory Perception\
        \ through the Blindness effect. And with Blindness, Killers strip Survivors\
        \ of their ability to see auras. * Enhanced Hearing: Via Stridor, allows Killers\
        \ to become sensitive to the breathing of their prey. * Status Effect Inducement:\
        \ Hemorrhage, Exposed and Mangled; provokes intense bleeding and slows down\
        \ the process of healing respectively. * Technology Manipulation: Surge, among\
        \ other perks meddle with nearby technology. Surge, specifically, is said\
        \ to charge the air and mess with tech. * Statistics Reduction: Mindbreaker\
        \ claims that \u201Cyour distressing presence drains and weakens your prey\u201D\
        \ and \u201Ccan evoke feelings of dread and fatigue in nearby individuals,\u201D\
        \ alongside causing exhaustion in-game; the longer a survivor is infected\
        \ with Uroboros, the slower their movement speed becomes. * Enhanced Summoning:\
        \ Cruel Limits, Thrilling Tremors and Corrupt Intervention among others all\
        \ summon the spikes and arms of the entity to meddle with generators and block\
        \ off escapes without needing to hook the survivors. * Animal Manipulation:\
        \ Via Spies From the Shadows, allows crows to communicate with Killers. *\
        \ Telepathy: Can form a psychic link to the Entity though Floods of Rage.\
        \ * Empowerment: Via No One Escapes Death; the attacks motivated through this\
        \ hex are more lethal, making strikes that would only injure become critically\
        \ lethal. * Resistance to Pain Manipulation: Via Enduring. Can resist to getting\
        \ stun by pallets. * Resistance to Blinding: Via Lightborn. Unaffected to\
        \ flashbangs, firecrackers, flashlight. Category:Agent 1306 __NOEDITSECTION__"
