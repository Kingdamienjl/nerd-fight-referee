      value: '* Superhuman Physical Characteristics: All killers possessed superhuman
        abilities when they are in the entity realm. * Passive Fear Aura: Via [https://deadbydaylight.fandom.com/wiki/Heartbeat
        The Heartbeat]. The very presence of a killer is enough to incite panic, severe
        anxiety, and terror. Amplified through proximity. * Stealth Mastery: All Killers
        possess natural stalking ability and can mask The Heartbeat. * Enhanced Senses:
        The Killer''s senses are so acute that they can detect [https://deadbydaylight.fandom.com/wiki/Loud_Noise_Notifications
        minor disturbances in terrain] as a trail to their target alongside their
        ability to detect the smell of blood and sound of breathing from great distances.
        * Extrasensory Perception: Killers are able to see the [https://deadbydaylight.fandom.com/wiki/Aura
        auras] of those bleeding out or attempting to heal their wounds. * Immortality
        (Types 1 & 8): Killers have an importance of collecting food for [https://deadbydaylight.fandom.com/wiki/The_Entity
        The Entity], and will be resurrected by it should they be killed. * Light
        Manipulation: Via the [https://deadbydaylight.fandom.com/wiki/Red_Stain Red
        Stain]; Projects light from himself, acting as a warning. * Clairvoyance:
        Sees the auras of [https://deadbydaylight.fandom.com/wiki/Generators#Auras
        generators] and [https://deadbydaylight.fandom.com/wiki/Exit_Gates exit gates]
        * Berserk Mode & Speed Boost: Should the lust for the kill become too great,
        the Entity''s connection to the Killer will be cut off, making them unpredictable.
        * Self-Sustenance (Type 2 & 3): Spends the aftermath of Trials stalking their
        prey at the Campfire, indicating the lack of need for eat, drink and rest.
        * Blessed: The Entity favors the Killer''s and will aid through indirect means
        should it be beneficial. * Summoning: Via [https://deadbydaylight.fandom.com/wiki/Hook
        Hooking]; exists as a sacrificial ritual to The Entity, awakening it to take
        the soul of the victim. * Bloodlust: [https://deadbydaylight.fandom.com/wiki/Bloodlust?so=search
        Bloodlust] was added to help Killers, especially those with lower mobility
        and/or no ranged attacks, catch up to Survivors who manage to evade them for
        prolonged periods of time.'
