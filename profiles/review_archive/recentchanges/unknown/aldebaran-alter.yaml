    - field: weaknesses
      value: "Alter is unable to draw out the true potential of the dragonhusk, making\
        \ him weaker than the Divine Dragon Volcanica. The original sentiments of\
        \ the Divine Dragon Volcanica may sometimes surface, shown by Alter's deep\
        \ affection for Felt, who Volcanica believed to be its friend Farsale Lugunica.\
        \ The dragonhusk has a scar beneath its chin inflicted by the first Sword\
        \ Saint, a fatal gap in the dragonscales. Notable Attacks/Techniques: Dragonhusk\
        \ Body: Having the Memories of Aldebaran installed in the dragonhusk of the\
        \ Divine Dragon, Alter was created. Despite the Divine Dragon weakening from\
        \ becoming a dragonhusk, and becoming weaker once more when the inexperienced\
        \ Alter hijacked it, he ultimately still pilots the strongest specimen of\
        \ the strongest species, with his entire body being made up of legendary treasures\
        \ of nature. *Dragonclaws & Fangs: The Divine Dragon has talons of extreme\
        \ sharpness, surpassing most famed swords as cutting tools. A single swipe\
        \ can tear up the earth, or rend space itself. Even being grazed a few millimeters\
        \ deep spells certain death for his opponents. Lining his jaws, the Divine\
        \ Dragon's fangs are even sharper and more durable than his claws, easily\
        \ chewing up anything trapped in his enormous maw. *Dragonbreath: As a Dragon,\
        \ he is a being given the right to tear the world asunder with just a roar.\
        \ His breath releases a blinding white light\u2014 a torrent of pure mana\
        \ that destroys aught that it comes into contact with. Just as harmless water\
        \ droplets can gather into a flood capable of washing away nations, mana charged\
        \ with overwhelming vigor can easily tear apart the realm of reality. *Dragonscales:\
        \ The hardness of dragonscales is proportional to the Dragon's volume of mana,\
        \ making them tougher the stronger and older the Dragon. As the apex of the\
        \ apex, the Divine Dragon's dragonscales possess hardness beyond even diamonds,\
        \ such that Holy Swords wielded by top-class warriors may not pierce his armor.\
        \ Complementing the dragonhalo, this is the physical aspect of the ultimate\
        \ lifeform's ultimate defense. The only vulnerability in this protection is\
        \ a white scar beneath the Dragon's chin, inflicted by the Stick Swinger who\
        \ had demanded to eat Volcanica. *Dragonhalo: The magical protection granted\
        \ by a dragonhalo is also proportional to the Dragon's volume of mana, making\
        \ it more impenetrable the stronger and older the Dragon. As the apex of the\
        \ apex, the Divine Dragon's dragonhalo endows it with near-complete immunity\
        \ to magic, and not even the strongest magician of the modern era, wielding\
        \ a fivefold Al-class spell, can bring any harm upon Alter. Complementing\
        \ the dragonscales, this is the magical aspect of the ultimate lifeform's\
        \ ultimate defense. Magic: Aldebaran was imparted with the extensive magical\
        \ knowledge of his Teacher, making him aware of practically every spell in\
        \ existence. Despite this, he never could use it with his inferior talents\u2014\
        \ until his Memories hijacked the Divine Dragon's dragonhusk, creating Alter.\
        \ With the enormous mana pool and superior Gate of the legendary Dragon, Alter\
        \ could now fully utilize his magical knowledge without restriction. *Al Shario:\
        \ The highest tier of Shario, it is a Forbidden Art that allows Alter to literally\
