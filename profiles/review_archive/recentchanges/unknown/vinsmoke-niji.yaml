    Large Island level, higher with Raid Suit Durability: Large Island level (Scaling
    from his AP), higher with Raid Suit Stamina: Superhuman (Fought an entire war
    in four hours and didn''t seem tired in the least) Range: Standard Melee Range,
    Several Meters with electricity Standard Equipment: Shape Memory Armor, Sword
    Intelligence: Gifted (As a member of the Vinsmoke family, Niji is an expert assassin
    and a skilled military commander, ending a two-year long war in four hours with
    no apparent effort on his part. He''s an expert hand-to-hand combatant, easily
    overpowering Sanji with little resistance on the latter''s part. He has a superhuman
    memory and can imitate any voice, possibly due to his genetic modifications.)
    Weaknesses: Niji is extremely arrogant and proud of his status as a noble, looking
    down on "peasants" and rarely taking them seriously Notable Attacks/Techniques:
    *Dengeki Blue: Niji possesses an ability that has given him the name "Dengeki
    Blue". Similar to Electro, Niji can electrify parts of his body to deal heavy
    damage to his opponents, and was able to knock back Charlotte Oven with a single
    electrified kick, successfully rescuing Chopper from his grasp. He can also imbue
    other objects with electricity such as a sword. **Stealth: Niji is able to seemingly
    disappear from his opponent and quickly come up behind them. **Henry Needle: Niji
    electrifies his knee and proceeds to strike his opponent in the back. *Kosoku
    no Ken: Henry Blazer: Imbuing his sword with electricity from Dengeki Blue, Niji
    speeds toward his opponents and runs in a lightning bolt-shaped motion while he
    strikes them down one after another.'
