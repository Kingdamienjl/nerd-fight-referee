- id: claim-powers-and-abilities-bbfa2b8f
  section: abilities
  axis: hax
  text: 'Tier: High 6-C, higher with Dengeki Blue Name: Vinsmoke Niji, epithet "Electric
    Blue" Origin: One Piece Gender: Male Age: 21 Classification: Human, Prince of
    the Germa Kingdom and a Commander of the Germa 66 Powers and Abilities: Superhuman
    Physical Characteristics, Expert Hand-to-Hand Combatant, Has knowledge of Swordplay,
    Cyborgization (Partial), Statistics Amplification and Pseudo-Flight with his boots,
    Electricity Manipulation (Can electrify parts of his body), Voice Mimicry, Regeneration
    (High-Low: [https://imgur.com/a/vlbhKBh Germa possesses incredible regenerative
    skin, allowing them to heal from wounds that completely pierce their bodies, dislocated
    jaws and even many broken bones]), Resistance to Fire Manipulation (With his Raid-Gear
    Equip), Blades and Blunt Force Trauma ([https://imgur.com/a/h9rPIHI Via their
    exoskeleton which grants them "iron bodies"]), Madness Manipulation, Mind Manipulation
    and Soul Manipulation via Willpower (Through sheer willpower they can resist losing
    their mind when absorbing shadows through the Kage Kage no Mi. Shadows belonging
    to strong willed people are difficult to control, allowing them to rebel against
    Moria''s pact which usually immediately submits a shadow to his supremacy and
    orders. Spiritual energy is contained within one''s soul/life; this energy is
    represented by the fighting power or the Haki itself. Those with strong souls,
    which are homologous to shadows, resist the effects of Brook''s soul manipulation)
    Attack Potency: Large Island level (Should be comparable to Ichiji and Reiju),
    higher with Dengeku Blue (Knocked Sanji out with two strikes) Speed: At least
    Relativistic+ (Kept up with his siblings during their blitz on the Charlotte family,
    while Yonji tagged Daifuku and Ichiji tagged Perospero), Speed of Light movement
    and attack speed with Henry Blazer (Said to move at the speed of light) Lifting
    Strength: At least Class T (Could put Sanji in a chokehold), higher with Raid
    Suit (His raid suit greatly increases his Lifting Strength) Striking Strength:
    Large Island level, higher with Raid Suit Durability: Large Island level (Scaling
    from his AP), higher with Raid Suit Stamina: Superhuman (Fought an entire war
    in four hours and didn''t seem tired in the least) Range: Standard Melee Range,
    Several Meters with electricity Standard Equipment: Shape Memory Armor, Sword
    Intelligence: Gifted (As a member of the Vinsmoke family, Niji is an expert assassin
    and a skilled military commander, ending a two-year long war in four hours with
    no apparent effort on his part. He''s an expert hand-to-hand combatant, easily
    overpowering Sanji with little resistance on the latter''s part. He has a superhuman
    memory and can imitate any voice, possibly due to his genetic modifications.)
    Weaknesses: Niji is extremely arrogant and proud of his status as a noble, looking
    down on "peasants" and rarely taking them seriously Notable Attacks/Techniques:
    *Dengeki Blue: Niji possesses an ability that has given him the name "Dengeki
    Blue". Similar to Electro, Niji can electrify parts of his body to deal heavy
    damage to his opponents, and was able to knock back Charlotte Oven with a single
    electrified kick, successfully rescuing Chopper from his grasp. He can also imbue
    other objects with electricity such as a sword. **Stealth: Niji is able to seemingly
    disappear from his opponent and quickly come up behind them. **Henry Needle: Niji
    electrifies his knee and proceeds to strike his opponent in the back. *Kosoku
    no Ken: Henry Blazer: Imbuing his sword with electricity from Dengeki Blue, Niji
    speeds toward his opponents and runs in a lightning bolt-shaped motion while he
    strikes them down one after another.'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
