    - field: weaknesses
      value: 'He lost his dominant left arm in his fight against Sasuke. Notable Attacks/Techniques:
        *Iron Claw: A simply squeezes the target''s face with his hand. He uses it
        on Killer B whenever B''s behavior irritates him. *Lightning Release: **Lightning
        Release Chakra Mode: A wraps his body in a layer of lightning chakra to boost
        his physical abilities, with more lightning giving greater boosts; the more
        he applies, the more his hair stands on end. The lightning strengthens his
        taijutsu, creating what is called nintaijutsu, and also shields him from most
        attacks, deflecting them on contact; A was impressed when Chidori pierced
        through to him, however slightly. The lightning stimulates his nervous system,
        enhancing his speed and reaction time enough to perform the , dodging attacks
        as fast as Amaterasu. He is so fast that not even the Sharingan can track
        him; only Minato Namikaze''s Flying Thunder God Technique and Naruto Uzumaki''s
        Nine-Tails Chakra Mode have been shown to be faster. ***Elbow: A thrusts his
        elbow at his opponent with extreme force. ***: A''s certain-kill technique.
        He grabs his opponent, lifts them high into the air, and slams them head-first
        into the ground in a powerbomb, shattering a wide area of ground on impact.
        Darui noted that no one had ever survived it, and had Sasuke Uchiha not cushioned
        the impact with his Susano''o, it would have killed him. Even so, it was strong
        enough to snap the ribs of Sasuke''s Susano''o. ***Lightning Oppression Horizontal:
        A performs a simple backhanded horizontal chop, powerful enough to snap the
        ribs of Sasuke''s Susano''o. ***Lightning Oppression Horizontal Chop: A leaps
        from a high vantage point and delivers a powerful horizontal chop from above,
        using the momentum of his fall to add force. If it cannot penetrate an opponent''s
        defense, it can still drive them into the ground, pinning them for a follow-up
        attack. ***Guillotine Drop: A leaps above his opponent and delivers a downward
        kick, using the momentum of his fall to add power. ***Lariat: A charges and
        strikes his opponent with a flexed, chakra-coated arm. A direct hit can blow
        away a target''s chest or neck. Though straightforward, it is very fast and
        powerful, and easily knocks opponents down. ***Lightning Straight: A charges
        at his opponent and punches them at maximum speed. ==Notable Matchups== Victories:
        Losses: Inconclusive: *Katsuki Bakugo (My Hero Academia) Bakugo''s Profile
        (The Five Kage in their 6-B keys and Final War Arc Dynamight were used) ==References==
