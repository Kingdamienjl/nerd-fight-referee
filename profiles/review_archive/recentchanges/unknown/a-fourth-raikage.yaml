    - field: weaknesses
      value: "Quick to anger, only has one arm (Bee implied that his left arm is stronger\
        \ than his right, lacks versatility compared to the other Kages) Notable Attacks/Techniques:\
        \ *Shunshin no Jutsu (Body Flicker Technique): A high-speed movement technique.\
        \ *Raiton Chakura M\u014Ddo (Lightning Release Chakra Mode): A wraps his body\
        \ in a layer of lightning chakra which, instead of being used offensively,\
        \ is used to stimulate his nervous system electrically. The technique speeds\
        \ up neural synapses' reaction time and pushes physical prowess to the absolute\
        \ limit allowing for tremendous raw speed. This mode also allows A to minimize\
        \ the damage dealt by other lightning-based attacks. He can also sharpen his\
        \ lightning chakra enough to cut through limbs neatly. This technique serves\
        \ as the basis for A's nintaijutsu. **Elbow: After covering himself in his\
        \ Lightning Release Chakra Mode, A thrusts his elbow at his opponent with\
        \ extreme force. **Guillotine Drop: After covering himself in his Lightning\
        \ Release Chakra Mode, A jumps into the air above his opponent and performs\
        \ a downwards kick, using the momentum of the fall to increase the power behind\
        \ the attack. **Liger Bomb: After covering himself in his Lightning Release\
        \ Chakra Mode, A grabs his opponent and lifts them into the air. Then, using\
        \ his extreme strength, he smashes them headfirst onto the ground in what\
        \ resembles a powerbomb maneuver. **Raigyaku Suihei (Lightning Oppression\
        \ Horizontal): A performs a simple backhanded horizontal chop against his\
        \ opponent. **Raigyaku Suihei Choppu (Lightning Oppression Horizontal Chop):\
        \ A leaps from a high vantage point and performs a simple yet powerful horizontal\
        \ chop on his opponent from above, seemingly using the momentum gained in\
        \ the previous fall to increase the force behind his strike. In the event\
        \ the attack isn't powerful enough to penetrate an opponent's defense, the\
        \ attack can be used to push an opponent well into the ground to prevent them\
        \ from escaping from another incoming attack. **Lariat: The user charges at\
        \ their opponent, striking them with a flexed arm, which can be coated in\
        \ chakra. A successful strike can blow away a target's chest or neck with\
        \ a direct hit. The attack is rather straightforward, but very quick, powerful\
        \ and is easily capable of knocking down an opponent. **Lightning Straight:\
        \ A runs towards the opponent and punches them at maximum speed. Category:Tier\
        \ 7 Category:Tier 6 Category:Slappyjoe056"
      source_id: character-stats-profiles-a-fourth-raikage-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
