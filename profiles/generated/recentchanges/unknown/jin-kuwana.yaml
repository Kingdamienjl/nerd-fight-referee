    confidence: 0.6
  intelligence:
    text: Genius (Devised a number of complex schemes to allow the parents of bullying
      victims to torture and murder their children's bullies, and left no evidence
      of either his or the parents' involvement, with each crime going unsolved until
      Yagami's involvement - even when such crimes involved high-ranking government
      officials such as Reiko Kusumoto. Made a mockery of the entire justice system
      in collaboration with Akihiro Ehara using a complex plan involving a falsified
      sexual battery incident which initially fooled public prosecutor Sadao Takano
      and defense attorney Saori Shirosaki, the latter of whom was involved in uncovering
      the AD-9 conspiracy. Also manipulated an entire class of Kurokawa Academy students
      into doing his bidding, and even accounted for the actions of Yagami and his
      cohort, Kazuki Soma and RK, and Reiko Kusumoto in his machinations. Also possesses
      incredibly high martial arts knowledge and is capable of effectively changing
      his identity to escape from law enforcement)
    source_ids:
    - vsbattles-jin-kuwana-unknown
    confidence: 0.6
