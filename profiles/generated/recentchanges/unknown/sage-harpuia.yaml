- id: claim-weaknesses-043647dc
  section: weaknesses
  axis: weakness
  text: 'Is rather proud, refusing to accept help, especially from the Resistance.
    Is vulnerable to ice-based attacks Notable Attacks/Techniques: *Sonic Boom: Harpuia
    dashes upward before unleashing a downpour of three crescent waves of compressed
    air and plasma. *Pile Driver: Harpuia towards the opponent to grab them, lift
    them into the air, and then smash them into the ground. *Homing Missiles: Fires
    off several homing missiles that seek a target until they''re destroyed. *Plasma
    Tornado: His EX Skill, Harpuia creates two thunderstorms on either side of the
    foe before forcing the target into them with a plasma-charged cyclone. *Armed
    Phenomenon: Harpuia transforms into a giant green and white plane modeled after
    a harpy. He primarily fights in this form by ramming his foes at high speed while
    unleashing powerful cyclones and thunderstorms as well as missile barrages. ==Notable
    Matchups== Victories: Losses: Inconclusive: Category:Characters Category:Robots
    Category:Electricity Users Category:Flight Users Category:Mega Man Category:Male
    Characters Category:Weather Users Category:Element Users Category:Antagonists
    Category:Game Bosses Category:Sword Users Category:Air Users Category:Good Characters
    Category:Heroes Category:Leaders Category:Transformation Users Category:Self-Sustenance
    Users Category:Game Characters Category:Video Game Characters Category:Reploids
    Category:Guardians Category:Dual Wielders Category:Inorganic Beings Category:Regeneration
    Users Category:Enhanced Senses Users Category:Immortals'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
