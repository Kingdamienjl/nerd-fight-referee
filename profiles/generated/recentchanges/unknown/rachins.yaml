- id: claim-weaknesses-3056032d
  section: weaknesses
  axis: weakness
  text: 'None notable Magic: Rachins is able to use fire magic. * Goa: Rachins manifests
    a blaze of fire, though the flame was noted to be rather underwhelming. He primarily
    uses this attack like a signal flare meant to summon Reinhard to his location.
    ** El Goa: Rachins produces a larger flame with a larger explosion than Goa. **
    Al Goa: Rachins lets loose a massive fireball, scorching away everything in its
    path. He can thin out the spell and make it look small, but it retains the same
    firepower as its large counterpart.'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
