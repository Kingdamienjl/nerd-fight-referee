- id: claim-powers-and-abilities-af42daba
  section: abilities
  axis: hax
  text: '* BFR (Can forcefully transport people into his Parallel Dimension, allowing
    him to choose whether to let them leave) * Deconstruction (Has a laboratory that
    can disassemble products registered in his Parallel Dimension) * Dimensional Storage
    (Can retrieve objects from his Parallel Dimension, grant others access to it,
    and freely enter and leave it. He can also prevent others from entering his Parallel
    Dimension and store objects associated with products registered in it. He can
    store any territory that his Parallel Dimension has marked as an object. The territories
    stored within his Parallel Dimension are PAX Fulfillment Center, Parallel Dimension
    Laboratory, ROK DCC, Camelot, and Emeth Dimension''s Construction Materials Warehouse)
    * Duplication (Any products inside his Parallel Dimension are registered as his
    property, enabling him to create an infinite number of duplicates) * Fusionism
    (Has a laboratory that can combine and modify products registered in his Parallel
    Dimension. He can preview information and simulate the effects of enchanted or
    combined products in advance) * Healing (Has a minor healing effect within his
    Parallel Dimension) * Homing Attack (Items from his Parallel Dimension are accurately
    shipped to their designated locations) * Power Nullification (Can remove regeneration
    effects within his Parallel Dimension) * Purification (Can remove mind-control
    effects within his Parallel Dimension) * Weapon Control (Can launch automatic
    and manual attacks while remaining hidden inside his Parallel Dimension. He can
    recall items that have been shipped and loot dropped by his enemies. He can ship
    multiple items simultaneously and automatically ship any chosen item, allowing
    him to set the desired shipping time interval) Items: * Electricity Manipulation
    (The bullets of the Assault Rifle have electric shock properties. Lionel can imbue
    his weapons with lightning) * Explosion Manipulation (The Bowling Ball can explode
    upon impact. The warhead of the Hellfire Missile has explosive properties) * Fire
    Manipulation (The Bowling Ball can set fire to anything it hits) Summons: * Clairvoyance
    (The spectral forms of the Knights of Camelot can scout the surrounding area and
    gather information) * Flight (The spectral forms of the Knights of Camelot can
    fly) * Forcefield Creation (Kim Sol can create a giant barrier around her body)
    * Healing (Kim Ju-Yeon can heal multiple people simultaneously) * Intangibility
    (The spectral forms of the Knights of Camelot cannot be influenced or affected
    by anything physical) * Martial Arts (Kim Sol is skilled in Martial Arts. Lancelot
    is learning martial arts from Kim Sol) * Weapon Mastery (Bedivere is skilled in
    ranged weaponry, from using slingshots to throwing spears. Gwayne, Lancelot, and
    Lionel are skilled in swordsmanship. Kim Sol is learning swordsmanship from Lancelot)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
