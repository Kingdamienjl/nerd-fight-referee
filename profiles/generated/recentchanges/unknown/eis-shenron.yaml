- id: claim-weaknesses-78737156
  section: weaknesses
  axis: weakness
  text: 'Eis is rather cowardly despite his great power, as he was hesitant to fight
    Goku without Nuova taking him on, first. Notable Attacks/Techniques: *Ice Blasts:
    An attack that freezes someone in ice, but is apparently weaker than the Ice Ray.
    *Kiai: Eis Shenron shoots with both hands together with a kind of Kiai of cold
    air. He uses this technique at close range against Goku. *Ice Ray: Eis Shenron
    shoots a thin ray from his eyes that freeze anything it hits. *Super Ice Ray:
    A more powerful version of Ice Ray, fires more like an energy blast from his hands.
    *Whirlgig: Eis Shenron grabs the opponent and swings them around. Used on Pan
    in Dragon Ball GT. Note: The statistics of Dragon Ball GT/Movie characters are
    clearly part of a separate continuity, and as such tend to differ greatly from
    the current canon. ==Notable Matchups== Victories: Losses: Inconclusive: == Statistics
    == Category:Characters Category:Dragon Ball GT Category:Acrobats Category:Anime
    Characters Category:Aura Users Category:Chi Users Category:Dragon Ball Category:Dragons
    Category:Energy Users Category:Evil Characters Category:Flight Users Category:Forcefield
    Users Category:Homing Attack Users Category:Ice Users Category:Immortals Category:Male
    Characters Category:Martial Artists Category:Non-Canon Characters Category:Self-Sustenance
    Users Category:Vibration Users Category:Villains Category:Demons Category:Dragon
    Ball (Toei)'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-d2c1c03b
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, Immortality (Types 4 & 8;
    Non-Combat Applicable - It is stated that due to the overuse of the Dragon Balls
    the Shadow Dragons came to life due to the overflowing amounts of negative energy
    accumulated in them, with the Shadow Dragons coming back every time the Dragon
