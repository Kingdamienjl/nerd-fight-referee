- id: claim-powers-and-abilities-314726f2
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics **Enhanced Senses (Hearing; All Supes\
    \ have a wider range of hearing than humans, and it's comparable to that of dogs.Gen\
    \ V; Season 1; Episode 2; \"First Day\" Likely Night Vision; Claims to have been\
    \ in the Mariana Trench before, where no light reaches its depths. Searched for\
    \ a downed plane about two miles deep, where little to no light reaches) **Regeneration\
    \ (Low; It was stated that all supes heal faster than humansThe Boys; Season 3;\
    \ Episode 7; \"Here Comes a Candle to Light You to Bed\"Amazon Prime's X-Ray Trivia)\
    \ **Reactive Evolution (Godolkin stated that under the right amount of pressure,\
    \ a supe can \"level-up\", becoming more powerfulGen V; Season 2; Episode 2: \"\
    Justice Never Forgets\") **Underwater Breathing (Types 1 & 2) **Acrobatics (Skilled\
    \ at diving) *Limited Telepathy (Only with sea creatures) **Social Influencing\
    \ (Animal Charming: has seduced several aquatic animals in the past, even forming\
    \ a meaningful relationship with an octopus) **Possibly Statistics Amplification\
    \ (A sperm whale under his command managed to outspeed an speedboat, despite the\
    \ sperm whale's normal top speed of 28 mph) *Skilled Combatant (As a former top\
    \ ranker at Godolkin University's crimefighting, Deep should have been trained\
    \ in hand-to-hand combat, similarly to other supes like Queen Maeve and A-Train.\
    \ Kept up with and outmatched Annie) Resistance to: *Cold & High Pressure (Can\
    \ swim in the the Mariana Trench. The temperature in the Mariana Trench depth\
    \ varies between 1 and 4 \xB0C.Mat, Mahmut. 23 Apr. 2023. \"Mariana Trench\".\
    \ Geology Science. Archived from the original on 24 Apr. 2023 Can withstand pressures\
    \ of over 300, likely up to 1000 atm) Likely Resistance to: *Piercing Damage (Certain\
    \ supes, unlike others, have been shown to be completely impervious to low caliber\
    \ bullets from pistolsThe Boys; Season 2; Episode 8; \"What I Know\"The Boys;\
    \ Season 3; Episode 2; \"The Only Man in the Sky\"Gen V; Season 1; Episode 1:\
    \ \"God U\" and assault riflesThe Boys; Season 1; Episode 1; \"The Name of the\
    \ Game\"The Boys; Season 1; Episode 3; \"Get Some\"Gen V; Season 1; Episode 5;\
    \ \"Welcome to the Monster Club\", and can even withstand shots from anti-materiel\
    \ rifles, albeit with moderate painThe Boys; Season 1; Episode 7; \"The Self-Preservation\
    \ Society\". In addition, this supes may also be highly resistant to cuts from\
    \ ordinary weapons and saws, requiring specialized saws to get through their skinThe\
    \ Boys; Season 2; Episode 6; \"The Bloody Doors Off\")"
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
