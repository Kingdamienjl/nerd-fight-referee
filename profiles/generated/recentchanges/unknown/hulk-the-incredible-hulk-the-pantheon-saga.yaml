- id: claim-standard-equipment-2327c141
  section: equipment
  axis: equipment
  text: 'None notable *Pick-Ups: Power ups that Hulk can access to aid him in battle.
    **Life Boost: Partially restores the Hulk''s health if he has already taken damage.
    **Gamma Boost: Surges Hulk''s stored Gamma energy levels **Super Gamma: Maxes
    out Hulk''s Gamma level for a brief duration of time. **Double Damage: Multiplies
    the strength of Hulk''s attacks by two. **Emergency Team Summon: Allows Hulk to
    summon a member of the Pantheon Emergency Team to assist him in combat. ***Ajax:
    Upon arrival, he will charge in the direction that Hulk is facing, barging through
    enemies and locked doors. ***Atalanta: Provides aerial support by shooting flaming
    arrows at any enemies surrounding the Hulk. ***Ulysses: Runs rapidly in circles
    around the Hulk, providing protection while causing destruction. ***Hector: Will
    temporarily stun all on-screen enemies.'
  source_ids: *id002
  decisive: false
  status: unverified
