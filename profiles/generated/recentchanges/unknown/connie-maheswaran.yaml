      level Forced Fusion Gems. Dispatched Corrupted-Fused Gems, who were strong enough
      to almost overpower Steven)
    source_ids:
    - vsbattles-connie-maheswaran-unknown
    confidence: 0.6
  speed:
    text: At least Average Human with likely Relativistic reactions and Combat Speed
      (Capable of keeping up with high-difficulty Holo-Pearls and fighting perfectly
      in tandem with Steven)
    source_ids:
    - vsbattles-connie-maheswaran-unknown
    confidence: 0.6
  lifting_strength:
    text: Class 50 (Able to physically contend with various Gems throughout the series
      without being overwhelmed strength-wise, should scale to Seasons 4-5 Steven
      based on various feats when they fought in tandem)
    source_ids:
    - mediawiki-64101
    confidence: 0.95
  striking_strength:
    text: Wall level
    source_ids:
    - mediawiki-64101
    confidence: 0.95
  durability:
    text: Wall level, Large Town level with her Sword and Rose's Sword (Able to block
      hits from Topaz (Steven Universe), Holo-Pearl, a bloodlusted Pearl, and a bloodlusted
      Jasper. Rose Quartz was able to use it for millennia without it being damaged
      by the force of her attacks and was able to clash against Hessonite with it)
    source_ids:
    - vsbattles-connie-maheswaran-unknown
    confidence: 0.6
  stamina:
    text: Athletic (Can keep up in fights against Gems and coordinate attacks alongside
