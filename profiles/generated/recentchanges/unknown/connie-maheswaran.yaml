    confidence: 0.6
  range:
    text: Extended Melee Range with her swords
    source_ids:
    - vsbattles-connie-maheswaran-unknown
    confidence: 0.6
  intelligence:
    text: Above Average (Due to being personally trained by Pearl, Connie is a highly-skilled
      fighter and swordsman, capable of holding her own against high-level Holo-Pearls,
      trained Gem soldiers such as Topaz, and even a possessed Pearl. She is able
      to efficiently fight in tandem with Steven, seamlessly combining her offense
      with his defense. She was even able to pull off complicated sword-based techniques
      in her battles against Corrupted Fusions without a hitch.)
    source_ids:
    - vsbattles-connie-maheswaran-unknown
    confidence: 0.6
