power_scale:
  tier:
    text: 'Name: Arthur Bishop,The Mechanic (2011) Otto Santos, Martin Basman, Clark,
      Tom SilvaMechanic: Resurrection (2016) Origin: The Mechanic duology Gender:
      Male Age: Mid-late 40s Classification: Human, Hitman'
    source_ids:
    - vsbattles-arthur-bishop-unknown
    confidence: 0.6
  attack_potency:
    text: Street level (Crain said he is the best, Bishop can fight against several
      men if a job goes wrong, including trained police officers and while his hands
      are bound)
    source_ids:
    - vsbattles-arthur-bishop-unknown
    confidence: 0.6
  speed:
    text: Athletic Human (Bishop rolled out of his car before Steve caused it to explode
      and ran to cover before a boat exploded) with Peak Human combat speed (Bishop
      quickly disarmed Steve before he could shoot a man, tossed a grenade through
      a submarine hatch before it was closed, and caught Crain's chain attack)
    source_ids:
    - vsbattles-arthur-bishop-unknown
    confidence: 0.6
  lifting_strength:
    text: Above Average Human (Bishop easily dragged a man after strangling him to
      death, he threw one of Vaughn's guards through a wall, pulled another guard
      off his feet and threw him off the roof of a building, he broke Sebastian's
      arm and tossed him out a window, broke a hitman's neck, knocked a woman out
      by slamming a table against her head and flipped a man with one hand, easily
      threw a man over a railing and broke a wooden chair over another man, broke
      another man's neck and threw another man into a hot tub)
    source_ids:
    - mediawiki-4878564
    confidence: 0.95
  striking_strength:
    text: Street level (Bishop injured Vaughn's guards with his strikes and easily
      kicked out a window, he injured Sebastian with his strikes, he broke a man's
      leg with a kick, kicked a police officer off his feet, used a wooden beam to
      break off chunks of a concrete wall)
    source_ids:
    - mediawiki-4878564
    confidence: 0.95
  durability:
    text: Street level (Bishop can withstand drops from high bridges into water, he
      beat Sebastian after sustaining some injuries and was unfazed by an intentional
      car crash)
    source_ids:
    - vsbattles-arthur-bishop-unknown
    confidence: 0.6
  stamina:
    text: Athletic (Bishop has a higher level of stamina compared to Steve, who lettered
      in four sports and received a scholarship from the University of Miami)
    source_ids:
    - vsbattles-arthur-bishop-unknown
    confidence: 0.6
  range:
    text: Standard melee range, extended with weapons.
    source_ids:
    - vsbattles-arthur-bishop-unknown
    confidence: 0.6
  intelligence:
    text: 'Gifted (Harry McKenna said there is no one better than him because he can
      adapt and leave no loose ends, he also said Bishop see things and views people
      differently than anybody does. He deceived Harry into circumventing his own
      security and made his death look like a carjacking. He prevented Harry''s son
      Steve from killing a man because he knew he would be convicted on motive. He
      repaired a car in his free time. He agreed to train Steve to be a "mechanic"
      by having him study lists of every case of death imaginable provided by insurance
      companies, but not before conducting a thorough background check on him. He
      memorized another hitman''s routine and studied his weaknesses. He deduced an
      unnamed security guard''s identity based on his championship ring, and when
      he interrogated him, he made him believe he would inflict harm on his family.
      He later flushed Dean out of his secure building by making him believe he was
      inside with him. He speaks fluent English and Portuguese, and a woman commended
      his Brazilian accent when he was living under the identity of Otto Santos. He
      previously studied with Mei''s father, a doctor of Eastern medicine. He knew
      how to forge a passport and devised intricate plans to infiltrate Krill''s prison
      and assassinate him and destroy Adrian Cook''s sky pool, under extortion from
      Crain, whom he figured out was using him to eliminate the competition.) Standard
      Tactics: Bishop''s specialty is making his targets'' deaths look like accidents
      and he causes others to suspect someone else instead of him. When Steve asked
      him he does not simply shoot his targets, Bishop claimed his good judgment comes
      from experience, which had come from bad judgment.'
    source_ids:
    - vsbattles-arthur-bishop-unknown
    confidence: 0.6
