  intelligence:
    text: 'Extraordinary Genius Standard Tactics: Roy is a combatant with an absurd
      diversity in his capabilities, quickly abandoning ineffective tactics in favor
      of novel styles, pulling whatever he needs from his vast array of Memories.
      He often abuses the custom between warriors where they introduce themselves
      before battle, in order to obtain their Name. If he happens to possess the Memories
      of someone close to his opponent, he''ll imitate their mannerisms in order to
      make them feel uneasy. As Bizarre Eating, he has no eating standards, and merely
      sees fighting as a means to get his meals rather than something to enjoy, the
      opposite of his brother, and is therefore quick to use Eclipsing.'
    source_ids:
    - vsbattles-roy-alphard-unknown
