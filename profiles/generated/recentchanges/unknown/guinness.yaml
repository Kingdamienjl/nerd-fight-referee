    some of the best fighters in the Toriko world, such as Jirou) *Paralysis Inducement,
    Sleep Manipulation, Soul Manipulation, and Information Manipulation (Type 1 -
    While under the effects of Guinness Search, the affected target is rendered immobile
    and unconscious as their information is pulled from themToriko: Chapter 354: Pages
    8-9Toriko: Chapter 354: Pages 18-19Toriko: Chapter 355: Pages 1-2, doing so by
    utilizing KnockingToriko: Chapter 383: Page 20. It''s stated by the narrator it
    feels like your very soul is being ripped out by Guinness''s sensing, and it''s
    visually shown to be the caseToriko: Chapter 355: Page 4. This can be further
    enhanced by Guinness using "Strong Search." A technique that is capable of temporally
    affecting Neo AcaciaToriko: Chapter 391: Page 10. Guinness can transfer information
    to others through his urineToriko: Chapter 355: Page 14) *Vibration Manipulation
    and BFR (Guinness can produce wide-scale shockwaves from his strikes. They''re
    large enough to cause entire continents to be reduced to water-like ripples of
    earth, and send people flying tens of thousands of kilometers awayToriko: Chapter
    354: Pages 11-14Toriko: Chapter 376: Pages 6-7)'
