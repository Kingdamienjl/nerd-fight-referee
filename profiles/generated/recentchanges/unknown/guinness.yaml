    Chapter 277: Page 12) *Aura and Fear Manipulation (Explosive - The Eight Kings
    contain a massive amount of appetite energy, which can be physically expressed
    through their aura; forcing weaker beings to become paralyzed with fear and completely
    lose the will to fight themToriko: Chapter 6: Page 20. It can even cause others
    to run away in terror if so desiredToriko: Chapter 2: Page 20) *Enhanced Senses
    (While all of The Eight Kings possess incredible sensing capabilities. The Battle
    Wolf King, Guinness, is especially cognizant of his surroundings. With just a
    single sniff from his snout, Guinness can understand someone''s "classification,
    sex, age, habit, evolutionary pathway, and genetic information." It even extents
    to the person''s personal taste in food and information on the person''s gourmet
    cells. Guinness receives every possible form of data from his target, and he instantly
    processes this information without issue. He can even receive and understand data
    from non-organic structures like rock formations, or non-humanoid lifeforms, such
    as sprouting treesToriko: Chapter 355: Page 3) *Large Size (Type 1 - Is an incredibly
    large beast, with a stated height of 55 meters, or 0.055 kilometers, while possessing
    a size of 100 meters, or 0.1 kilometers) *Martial Arts (Guinness is the most experienced
