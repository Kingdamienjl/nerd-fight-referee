- id: claim-powers-and-abilities-5e6153a2
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Genius Intelligence (One of Ben''s
    smartest alien of all time. Perfectly calculated geometry in a golf game, often
    outsmarts his opponents in combat. Cerebrocrustacean species rivals Azmuth the
    creator of the Omnitrix) *Electricity Manipulation (Can shoot electrcity from
    his claws and a powerful blast from his brain) *Analytical Prediction (Predicted
    who is going to attack in the fight first and the whole fight, also predicted
    when the Vengers will quit about playing superheroes) *Preparation (Was able to
    prepare a plan in seconds against the Billy Billion''s vengers) *Information Analysis
    (Can analyze the situtation very quickly) *Surface Scaling (Can climb webs and
    walls) *Telekinesis (Can throw people and objects around using electric telekinesis)
    *Forcefield Creation (Can make a forcefield around himself or others) *Vibration
    Manipulation & Paralysis Inducement (Stopped an incoming energy beam and knocked
    them back using shockwaves) *Flight (Can fly and levitate) *Telepathy (Communicates
    with others via telepathy.) * Possible Memory Manipulation (Should be comparable
    to Servantis, who can alter others memories to erase them and add fake memories)
    *Mind Manipulation (Bypassed Animo''s mind control to control Yeti''s mind, should
    be comparable if not superior to Servantis who can mind control Plumber Helpers)
    *Underwater Breathing (Brainstorm is a creature of the crustacean variety, meaning
    a marine arthropod similiar to a crab.) * Resistance (All abilties and resistances
    provided by the Omnitrix)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
