- id: claim-weaknesses-ff0c7448
  section: weaknesses
  axis: weakness
  text: "Initially, she was insecure about her abilities and prone to crying when\
    \ her loved ones were hurt, but that has since changed as of Naruto Chapter 632.\
    \ She is also enamoured with Sasuke and powerless to stop him from wreaking havoc\
    \ throughout Shippuden. She will put herself in harm's way to protect innocents\
    \ and loved ones. Notable Attacks/Techniques: Hide/Show * Chakra Enhanced Strength:\
    \ This is a technique where the user focuses chakra into their hands and feet\
    \ using precise chakra control and releases it with pinpoint timing. ** The training\
    \ for this technique is quite arduous, as Tsunade repeatedly came to Sakura with\
    \ full force to help her learn. Subsequently, the outcome of this training is\
    \ incredible, giving the user enough strength to make gigantic craters or kill\
    \ opponents with a single strike. * Chakra Scalpel: This medical technique forms\
    \ one's chakra into a small, sharp blade. This can then be used for precise incisions\
    \ necessary for surgeries and anatomical dissections. Unlike regular scalpels,\
    \ this method can make cuts inside the body without creating an open wound, limiting\
    \ the risks of an infection. * Cherry Blossom Impact: While some may see it as\
    \ \"superhuman strength,\" this technique is an application of medical ninjutsu,\
    \ that demands the ability to concentrate, along with minute chakra control. An\
    \ enormous amount of chakra is kneaded inside the body. All of it is gathered\
    \ into the first a split second later. After that, the chakra is released into\
    \ the target, causing massive damage. With the damage done dependent on the amount\
    \ of chakra used, it is also possible for a skilled shinobi to amass it in their\
    \ fingertip. When the ground is struck, the excess shock pulverizes it into tiny\
    \ pieces, which are then scattered like flower petals, earning the name \"Cherry\
    \ Blossom Impact.\" * Creation Rebirth: The absolute pinnacle of medical ninjutsu,\
    \ created by the greatest medical ninja, Tsunade, is the ultimate regeneration\
    \ technique. By releasing the enormous volume of chakra stored in her forehead\
    \ at once, the body's cell division is forcibly stimulated by proteins, reconstructing\
    \ all organs and tissues. The technique itself does not regenerate the old cells;\
    \ instead, it hastens the creation of new ones through division. If this technique\
    \ is used, a body with severely damaged vital organs, usually incurable, can be\
    \ instantly restored to its pre-injury state. By Tsunade's claim, as long as she\
    \ has chakra, she can't die by any means. As such, she gains a form of \u201C\
    immortality\u201D throughout the technique. ** However, a body's cells can only\
    \ split a certain number of times in a lifetime. By speeding up this process,\
    \ users of this technique are shortening their natural lifespan. * Strength of\
    \ a Hundred Seal: Seal, which is reputed to be the pinnacle of chakra control.\
    \ By storing vast amounts of chakra over an extended period into a specific point\
    \ on their body \u2014 frequently the forehead \u2014 the user creates this seal,\
    \ which manifests in the form of a rhombus-like marking. Once the seal is formed,\
    \ the user's already impressive chakra control allows them to perform techniques\
    \ without any wasted energy. When released, the seal will spread across the user's\
    \ face or wrap around their entire body. The stored chakra is then released into\
    \ their body, greatly amplifying their medical techniques and giving them access\
    \ to the Creation Rebirth and the Ninja Art Creation Rebirth \u2014 Strength of\
    \ a Hundred Techniques. * Mystical Palm Technique: This medical ninjutsu allows\
    \ the user to speed up the body's natural healing process by sending chakra from\
    \ their hands into a wound or afflicted body part. This allows the user to heal\
    \ a patient without needing medical equipment or surgery, making it very useful\
    \ on the battlefield. It can be used to treat both external and internal injuries.\
    \ It is vital to match the amount of chakra used to the severity of the affliction\
    \ or injury. This requires a considerable amount of chakra control. Because of\
    \ this, only a few experts can use this technique. Kabuto Yakushi demonstrated\
    \ the ability to use it a short distance away from the target instead of direct\
    \ contact. ** The user can overload the target's regular circulation by transmitting\
    \ excessive chakra, trapping them in suspended animation. Although this is usually\
    \ undesirable, Kabuto once used it to get Kiba Inuzuka out of his way. == Notable\
    \ Matchups == Victories: Losses: * Ichigo Kurosaki (Bleach) Ichigo's Profile (It\
    \ was Team 7 versus Ichigo Kurosaki. Ichigo was in his \"Merged Hollow Form Key\"\
    . Naruto was in his \"Part II: War Arc - Six Paths Key\". Sasuke was in his \"\
    Part II - Six Paths\" key, and Sakura was in her \"Fourth Great Ninja War Key\"\
    . The Battle took place on Dawn Island. The Combatants started 20 meters apart.\
    \ All Characters were In-Character but were willing to win) Inconclusive: == References\
    \ == == Notes/Explanations == Category:Characters Category:Naruto Category:Acrobats\
    \ Category:Adults Category:Afterimage Users Category:An"
