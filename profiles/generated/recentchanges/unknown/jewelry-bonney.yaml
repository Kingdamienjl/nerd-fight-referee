- id: claim-powers-and-abilities-81a5bc53
  section: abilities
  axis: hax
  text: "* Haki (Intermediate Bus\u014Dshoku - 2 Layers and Intermediate Kenbunshoku)\
    \ * Age Manipulation, Shapeshifting, and Transformation (With Age Age Fruit. She\
    \ can transform targets by manipulating their age) ** Limited Subjective Reality,\
    \ Statistics Reduction, and Statistics Amplification (Works by transforming herself\
    \ or others into any future state she imagines to be possible. Bonney can use\
    \ this to turn opponents into helpless versions of themselves such as a baby or\
    \ an elderly person, or increase their physical strength) ** Corrosion Inducement\
    \ and Durability Negation (By manipulating age, she can cause objects to decay\
    \ and people to lose strength or become incapacitated) ** Mind Manipulation, Limited\
    \ Death Manipulation, Pain Manipulation, and Perception Manipulation (Her Near\
    \ Death Experience technique causes extreme age manipulation that can distort\
    \ the target's mind and senses, inflict pain, and simulate death) Resistance to:\
    \ * Heat Manipulation * Madness Manipulation, Mind Manipulation and Soul Manipulation\
    \ via Willpower (Through sheer willpower they can resist losing their mind when\
    \ absorbing shadows through the Kage Kage no Mi. Shadows belonging to strong willed\
    \ people are difficult to control, allowing them to rebel against Moria's pact\
    \ which usually immediately submits a shadow to his supremacy and orders. Spiritual\
    \ energy is contained within one's soul/life; this energy is represented by the\
    \ fighting power or the Haki itself. Those with strong souls, which are homologous\
    \ to shadows, resist the effects of Brook's soul manipulation)"
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
