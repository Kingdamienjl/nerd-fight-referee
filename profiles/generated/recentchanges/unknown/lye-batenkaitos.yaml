    source_ids:
    - vsbattles-lye-batenkaitos-unknown
    confidence: 0.6
  stamina:
    text: Superhuman (Lye didn't give up after Ram snapped his wrist, elbow, shoulder,
      and pummeled his body, and tried to fight back after she shattered his nose,
      teeth, jaw, and forehead, only being stopped by the dislocation of his arms.
      Even when Ram drove her knee into Lye's elbow joint to smash it, Lye's follow-up
      strike didn't hesitate in the slightest. Lye continued challenging Ram even
      when she pelted him with her heel and innumerable wind blades, used wind to
      slash his eyes, nose, lips, ears, mincing his face until he shed blood instead
      of tears, and finally fled only after she shattered his knee, beat him until
      what was below his skin became lumps of flesh, and whittled down his frame by
      dragging him against a wall. In an act of love, he slashed off his own hands
      at the wrists to write a message to Ram, and he only finally died after being
      beheaded)
    source_ids:
    - vsbattles-lye-batenkaitos-unknown
    confidence: 0.6
  range:
    text: Standard Melee Range, up to Hundreds of Meters with Magic
    source_ids:
    - vsbattles-lye-batenkaitos-unknown
    confidence: 0.6
  intelligence:
    text: 'Extraordinary Genius Standard Tactics: Lye is a monstrous synthesis of
      fighting styles, specializing in close- mid- and long-range combat, possessing
      the skills to handle any situation. He fights dirty, always abusing a custom
      in which warriors first introduce themselves to obtain their Names. Lye is obsessed
      with ensuring he eats only worthy people deemed as "gourmet", and thus he tends
      to grant opponents an opportunity to prove themselves. If he happens to possess
      the Memories of someone close to his opponent, he''ll imitate their mannerisms
      in order to make them feel uneasy. Lye makes use of the element of surprise,
      and is willing to fake his injuries, pretend to be unconscious or dead, and
      use false surrender to get a cheap hit, or flee when he sees that the battle
      is unfavorable.'
    source_ids:
    - vsbattles-lye-batenkaitos-unknown
    confidence: 0.6
