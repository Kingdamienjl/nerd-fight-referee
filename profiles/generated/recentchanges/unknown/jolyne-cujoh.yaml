    source_ids:
    - vsbattles-jolyne-cujoh-unknown
    confidence: 0.6
  intelligence:
    text: "Gifted (She is a skilled battle tactician and strategist, having experienced\
      \ many stand battles where she was put on the back foot and had to improvise\
      \ to survive. Jolyne is also incredibly creative with Stone Free's abilities,\
      \ constantly thinking of new ways to use her strings to get an upper hand. Notable\
      \ examples of this include her tricking Miraschon by exploiting a loophole in\
      \ her stand's betting and rule-based ability to get to her and beat her down,\
      \ lighting herself on fire in order to protect herself from Rykiel's stand and\
      \ go on the offensive, and turning her own body into a M\xF6bius strip to avoid\
      \ being turned inside out by C-Moon's gravity manipulation by having no inside\
      \ or outside to control)"
    source_ids:
    - vsbattles-jolyne-cujoh-unknown
    confidence: 0.6
