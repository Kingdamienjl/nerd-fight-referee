  attack_potency:
    text: Street level (Can cave skulls in). At least Wall level, likely higher with
      Stone Free (Can bend steel bars)
    source_ids:
    - vsbattles-jolyne-cujoh-unknown
    confidence: 0.6
  speed:
    text: Massively Hypersonic (Reacted to and took action before meteorites could
      hit her multiple times and outpaced an explosion), at most FTL reactions (Reacted
      to Whitesnake. Could react to and combat C-Moon. Can effortlessly react to bullets).
      At most FTL with Stone Free (Boasts high speed. Comparable albeit slower than
      Whitesnake, though can match and even out-speed him in certain situations, landed
      an imprecise hit on Made in Heaven Pucci and could attack Made in Heaven despite
      being defeated by it. Can effortlessly deflect bullets, deflected meteorites
      and took action while one flew toward her)
    source_ids:
    - vsbattles-jolyne-cujoh-unknown
    confidence: 0.6
  lifting_strength:
