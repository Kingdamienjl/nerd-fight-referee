- id: claim-standard-equipment-6c3c8c7a
  section: equipment
  axis: equipment
  text: '*Quick Draw Sleeve Gun System: Zombieman possesses a hidden gun supply system
    tucked within the forearms of his coat. He uses them to procure extra firearms
    in the heat of battle. *Desert Eagle: Zombieman''s signature handgun. He will
    often make use of two of them in combat and when dealing with stronger foes he
    can exchange regular ammunition with heavier caliber ammunition which carries
    greater stopping power at the cost of greater recoil that will break his limbs.
    *Glock: In preparation for the raid on the Monster Association, Zombieman had
    a Glock pistol concealed inside his own body as an ace up his sleeve, being able
    to somehow shot it from the inside of his chest as a surprise attack. *Long-bearded
    Axe: Zombieman''s favored melee weapon. *Machetes: Zombieman carries two machetes
    on his back under his coat he can duel wield.'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
