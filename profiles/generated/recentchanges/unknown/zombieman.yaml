    reduced to a head as "lethal damage" and continued on living in that state for
    an entire week.One-Punch Man: Audiobook Maji Drama CD Vol. 2 - Genos, Training
    Stood back up with a two giant bullet holes on his body that destroyed his brain
    and heart, can store a Glock on the inside of his chest without any issueOne-Punch
    Man: Chapter 106 - Terrible Multiplying Bastard) *Regeneration (At least High-Mid;
    Capable of almost instantly regenerating from extreme damage to his body. During
