- id: claim-weaknesses-2070273d
  section: weaknesses
  axis: weakness
  text: 'He can''t use Chidori effectively because it''s difficult to control without
    the Sharingan, which he doesn''t have. He needs the assistance of the God Tree
    to regenerate from extensive damage. If he''s prevented from traveling to it with
    the claw marks, he won''t be able to regenerate. Notable Attacks/Techniques: *Fire
    Release: **Great Fireball Technique: The user kneads chakra in their body and
    turns it into fire, which they then expel from their mouth; the more chakra they
    use, the more flames that are produced. Sometimes the flames lack a distinct shape,
    being only a stream, but more often than not they take the form of a giant orb
    that maintains its shape until hitting a target. Upon impact, the fireball is
    powerful enough to crater the ground and vaporise the surroundings. Against living
    targets, the fireball can cause extensive burns. *Lightning Release: **Chidori:
    The Chidori is a high concentration of lightning chakra channelled around the
    user''s hand. To perform, the user first gathers lightning to their hand; the
    high concentration of electricity produces a sound reminiscent of many birds chirping,
    hence the name. Once the chakra is gathered, users charge at their target and
    thrust the Chidori into them, piercing them and typically causing fatal damage.
    Despite the sound it makes, the rapid speed at which it''s used makes it useful
    for assassinations. ***Chidori Current: Chidori Current is a ninjutsu that was
    developed by Sasuke Uchiha while he was training with Orochimaru. By releasing
    the Chidori in every direction, an electrical discharge flows from the user''s
    entire body allowing him to affect multiple enemies. When using this attack on
    a great number of enemies at once, it can effectively double as an instant defence.
    The body of the person touched by the Chidori will misinterpret the lightning
    nature as "electrical signals from the nerves", making its muscles contract. This
    causes the body to involuntarily go stiff, while at the same time receives damage.
    This attack can also be channelled through the ground to increase the range of
    the attack. *Claw Mark: Through unknown means, Hidari can manipulate claw marks
    and manifest them using the Rinnegan. Using these marks, Hidari can instantly
    travel from one mark to another, including to other dimensions. ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== ==Notes/Explanations== Category:Characters
    Category:Naruto Category:Hive Minds Category:Immortals Category:Chi Users Category:Element
    Users Category:Transmutation Users Category:Electricity Users Category:Paralysis
    Users Category:Fire Users Category:Temperature Users Category:Breath Attack Users
    Category:Life Users Category:Plant Users Category:Absorption Users Category:Portal
    Users Category:Teleportation Users Category:Dimensional Travel Users Category:Regeneration
    Users Category:Body Control Users Category:Weapon Creation Users Category:Trees
    Category:Boruto Category:Manga Characters Category:Energy UsersCategory:Surface
    ScalersCategory:Extrasensory Perception Users Category:Male Characters Category:Weapon
    Users'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-2d8023ee
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Hive Mind (Type 2. Hidari, along with
    the other Self-Aware God Trees, are a single existence known as the God Tree,
    but each possesses independent consciousnessBoruto: Two Blue Vortex, Chapter 5)
    *Immortality (Type 1. Tailed Beasts are beings made of pure ChakraNaruto Chapter
    256Naruto Chapter 467, and as such should not be capable of dying from old age
    as creatures that physiologically exist as pure life forceNaruto Chapter 90. Hidari
    is a fragment of a Ten-Tails, and thus it should also apply to him) *Chakra Manipulation
    **Chakra Nature Manipulation and Transmutation (Hidari is able to utilize two
    of the five basic Elemental Chakra Natures: Lightning and Fire) ***Electricity
    Manipulation and Paralysis Inducement (With Lightning Release,Sha no Sho, Page
    214 the user can produce and manipulate electricity and lightning. This Lightning
    can cause muscles to contract, bodies to go numb, and can outright cause temporary
    paralysisSha no Sho, Page 248Sha no Sho, Page 284) ***Fire Manipulation and Heat
    Manipulation (With Fire Release, the user heats up their chakra and produces flames
    that can burn whatever they touch. Concentrated chakra can also inherently produce
    great heat, enough to burn someone from the inside outBoruto: Naruto Next Generations;
    Episode 152 (17:05) or carve through ironSha no Sho, Page 265) ****Breath Attack
    (With Great Fireball TechniqueBoruto: Two Blue Vortex, Chapter 11) ***Life Manipulation
    and Plant Manipulation (With Wood Release,Sha no Sho, Page 307 the user can use
    their chakra as a life source to produce and manipulate wood, either by creating
    it from their own body or by controlling pre-existing sources) ****Absorption
    (The wooden structures of the god trees absorb the victims'' chakra and turn them
    into nourishment for them) **Portal Creation, Teleportation and Dimensional Manipulation
    (Can use the Rinnegan to manifest claw marks, which can be used to travel from
    mark to mark instantly, even if the location is in another dimensionBoruto: Two
    Blue Vortex, Chapter 12) * Healing & Limited Regeneration (At least Low-Mid; By
    using the Shinju Roots, the Hitoshinju can heal damage to their bodies, including
    injuries such as Kawaki driving a black rod through Jura''s skull, and can access
    another dimension through Claw Marks to regenerate with the aid of the roots of
    a God Tree, which can heal injuries to vital points and regenerate an entire arm)
    *Body Control and Weapon Creation (Can transform his forearms into a curved blade)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
