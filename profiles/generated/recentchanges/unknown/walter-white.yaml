- id: claim-powers-and-abilities-a9240bd5
  section: abilities
  axis: hax
  text: '*Genius Intelligence *Vehicular Mastery (Claimed to have some experience
    with vehicles.Breaking Bad S5E4: Fifty-One Was able to evade traffic while driving
    at fast speeds.Breaking Bad S4E6: Shotgun Narrowly avoided a semi-truck while
    driving at over 90 mph on the wrong side of the road with his eyes closed in an
    attempt to kill himselfBreaking Bad S3E9: Kafkaesque) *Preparation *Social Influencing
    (Convinced Tuco Salamanca to distribute his product,Breaking Bad S1E6: Crazy Handful
    of Nothin'' gained his trust, and was nearly successful in poisoning him until
    Jesse intervened.Breaking Bad S2E2: Grilled Intimidated a pair of drug dealers
    into leaving the meth business with one simple sentence, despite being unarmed
    and outnumbered with a small reputation at the time.Breaking Bad S2E4: Down Often
    negotiates favorable deals with other hardened criminals. Manipulated Jesse into
    expanding their meth empire, reestablishing their partnership despite it having
    ruined Jesse''s life,Breaking Bad S3E7: One Minute killing Gale,Breaking Bad S3E13:
    Full Measure turning against Gus, breaking up with his girlfriend,Breaking Bad
    S5E3: Hazard Pay and leaving Albuquerque. Manipulated Gus Fring, and orchestrated
    events to make it impossible for him to kill Walter without risking his meth empire.
    Convinced Hector Salamanca to work with him and serve as a suicide bomber despite
    Walter''s connection to Tuco''s death and Hector''s hatred of him. Talked Mike
    out of killing him on several occasions. Kept his illegal activities hidden despite
    having a brother-in-law in the DEA) *Stealth Mastery (Broke into a fire department,
    slipped Holly into a fire engine, turned on the truck''s flashing lights, and
    then left without anyone noticing.Breaking Bad S5E14: Ozymandias Followed Gretchen
    and Elliot through their home without either of them knowing he was there. Was
    able to sneak into Skyler''s house without anyone noticing during a citywide manhunt
    for him, despite the house being guarded by law enforcementBreaking Bad S5E16:
    Felina) **Poison Manipulation (Used phosphine gas to poison Emilio and Krazy-8Breaking
    Bad S1E1: Pilot) **Acid Manipulation (Has used Hydrofluoric acid to dissolve bodiesBreaking
    Bad S4E1: Box Cutter) **Fire Manipulation (Used thermite and a blowtorch to melt
    through a lock.Breaking Bad S1E7: A No-Rough-Stuff-Type Deal Burned down the superlab
    with Jesse by filling it with flammable chemicalsBreaking Bad S4E13: Face Off)
    **Explosion Manipulation (Used fulminated mercury to cause a great explosion)
    **Magnetism Manipulation (Used a large magnet to damage a laptopBreaking Bad S5E1:
    Live Free or Die) **Limited Electricity Manipulation (Used the electricity from
    a broken wire to free himself from handcuffsBreaking Bad S5E6: Buyout)'
  source_ids: *id002
