- id: claim-weaknesses-fbeaae20
  section: weaknesses
  axis: weakness
  text: "* Health: Walter's terminal lung cancer serves as a constant reminder of\
    \ his mortality and weakens him over time, causing him to break into coughing\
    \ fits and occasionally faint. However, in Season 2, Walter goes into remission,\
    \ and his cancer doesn't return until the latter half of Season 5. *Emotional\
    \ instability: Walter's personal struggles, including his cancer diagnosis and\
    \ family problems, often result in impulsive and erratic behavior. *Ego: Walter's\
    \ desire for control and power often clouds his judgement and leads him to underestimate\
    \ his enemies. His increasing confidence in his own abilities often leads him\
    \ to make unnecessarily dangerous decisions, and his ego often prevents him from\
    \ admitting his mistakes or seeking help, even when it would be in his best interests.\
    \ *Moral decay: Walter's involvement in the drug trade causes him to compromise\
    \ his own values and ethics, leading to a downward spiral of corruption and violence.\
    \ *Attachment to loved ones: White's love for his family can be used against him\
    \ by his enemies, as they are often used as leverage to manipulate or blackmail\
    \ him, and he has trouble manipulating them as effectively as he manipulates others.\
    \ *Unskilled: Although Walter is an excellent planner, he is by no means skilled\
    \ in combat. While unarmed, he resorts to messily scuffling with his opponents.\
    \ Despite his access to different weapons, he has never shown off any genuine\
    \ proficiency with them. Paired with his declining health, this makes direct confrontations\
    \ in battle significant high risk. ==Gallery== File:Change the Equation.jpg|Season\
    \ 1 poster. File:All Becomes Crystal Clear.jpg|Season 2 poster. File:Volatile.\
