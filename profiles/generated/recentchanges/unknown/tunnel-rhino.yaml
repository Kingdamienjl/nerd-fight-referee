    the Earth Gaizer or Bomb Bee are also effective at close range Notable Attacks/Techniques:
    *Charge 1: Charges forward in an attempt to smash into the opponent **Charge 2:
    Similar to Charge 1, only he is much faster, is invulnerable during his charge
    and can kick up stones behind him which hurt anyone attempting to get behind him.
    Only uses this version when at low health *Tornado Fang: Launches the drills out
    of his arm cannon and his shoulders simultaneously. *Drill Missile: Launches three
    drills which hover in place in a stack, before the middle one shoots forward followed
    quickly by the remaining two, sticking and burrowing into any surface they land
    in. ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters
