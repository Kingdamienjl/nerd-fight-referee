  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Longevity (Cipher is at least one thousand\
    \ years oldChest, Bear the Bygone Dust) *Extrasensory Perception (Enhanced Sight)\
    \ & Enhanced Senses **(Neutral Vision & Soul Vision; Can see soulsHero, Bear Thy\
