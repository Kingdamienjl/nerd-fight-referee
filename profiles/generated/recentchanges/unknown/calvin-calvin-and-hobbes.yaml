- id: claim-powers-and-abilities-3d327459
  section: abilities
  axis: hax
  text: "* Superhuman Physical Characteristics * Self-Perception Manipulation (With\
    \ chocolate frosted sugar bombs he's able to slow down time considerably) * Possibly\
    \ Immersion (Could seemingly jump over the comic panel) * Stealth Mastery (Could\
    \ sneak up on Hobbes, was also able to hide from Hobbes via squeezing himself\
    \ in a mailbox) * Toon Force (Pulled himself into a lake with a fishing rod and\
    \ jumped several meters into the air even over the panel) * Afterimage Creation\
    \ * Social Influencing (Charisma, Instigating Fear and Deception; Calvin is shown\
    \ to be a skilled manipulator and liar. Can confuse his bully to the point that\
    \ he loses interest in bullying him and tricked his babysitter so that he could\
    \ lock her outside) * Small Size (Type 0) * Surface Scaling * Preparation (Given\
    \ enough time to prepare he's able to set up intricate and impressive traps) *\
    \ Fourth Wall Awareness (Directly addresses the readers at multiple points in\
    \ the books) * Acrobatics (Can jump extremely high) *Possibly limited Subjective\
    \ Reality (His Subjective reality is seemingly the thing keeping Hobbes alive.\
    \ He also has events where things completely irrational will happen generally\
    \ out of fear, boredom, etc) Resistance to: * Gas Manipulation/Poison Manipulation\
    \ (Didn\u2019t seem to care when he gassed his room with bug spray) * Perception\
    \ Manipulation/Madness Manipulation (Able to see Hobbes as a living creature despite\
    \ his perception manipulation)"
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
