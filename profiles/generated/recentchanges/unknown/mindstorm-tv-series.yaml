- id: claim-powers-and-abilities-d06cb9d3
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Enhanced Hearing (All Supes have a
    wider range of hearing than humans, and it''s comparable to that of dogsGen V;
    Season 1; Episode 2; "First Day") **Regeneration (Low. It was stated that all
    supes heal faster than humans) **Reactive Evolution (Godolkin stated that under
    the right amount of pressure, a supe can "level-up", becoming more powerfulGen
    V; Season 2; Episode 2: "Justice Never Forgets") *Mind Manipulation (Is capable
    of hypnotizing people, making them do all sorts of things, like making someone
    believe they were a bullAmazon Prime''s X-Ray Trivia, or brainwashing a priest
    and a nun to trick Soldier BoyThe Boys; Season 3; Episode 7; "Here Comes a Candle
    to Light You to Bed") **Telepathy (It''s stated to possess the ability to read
    people''s thoughts in a radius of 3 miles. Read Butcher''s mind) **Sleep Inducement,
    Dream Manipulation and Memory Manipulation (He uses his powers to put people into
    comas, forcing them to experience a series of endless nightmares. Butcher''s nightmares
    were made from memories of his past) ***Status Effect Inducement (Those trapped
    by him will eventually die of terminal dehydration, and can only be freed if Mindstorm
    voluntarily releases them, as if he died or is otherwise incapacitated, they''ll
    remain comatose) *Preparation (Set up traps surrounding his house, such as hidden
    explosives and could produce a thick smoke curtain to take his opponents by surprise)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
