- id: claim-weaknesses-15373b9f
  section: weaknesses
  axis: weakness
  text: "Standard human weaknesses. He relinquished the NXT UK Championship after\
    \ an ankle injury in July 2022. He tore his ACL in September 2024, putting him\
    \ out of commission for over a year before he returned in October 2025. Notable\
    \ Attacks/Techniques: *Gr\xFC\xDFe aus Moskau: Dragunov uses a running lariat.\
    \ *Constantine Special: Dragunov uses a tiger feint lariat. *Torpedo Moscow: Dragunov's\
    \ signature and former finisher is a running, jumping headbutt. *H-Bomb: thumb|250px|H-Bomb\
    \ (NXT Stand & Deliver 2024) Dragunov's finisher is a falling forearm drop. At\
    \ NXT Battleground 2023, he jumped from steel steps to hit Dijak while his face\
    \ was against a steel chair. At NXT No Mercy 2023, he used a Super H-Bomb to defeat\
    \ Carmelo Hayes for the NXT Championship. At NXT Halloween Havoc 2023, he jumped\
    \ from the barricade to send Carmelo Hayes through the announcement table, and\
    \ did the same to Tony D'Angelo at NXT Stand & Deliver 2024. He used the H-Bomb\
    \ to defeat Sami Zayn for the WWE United States Championship. *German Suplex:\
    \ thumb|250px|German Suplex (NXT TakeOver 36) *Death Valley Driver: *Backdrop\
    \ Suplex: *Sleeper Hold: Dragunov defeated Gunther with his own submission for\
    \ the NXT UK Championship at NXT TakeOver 36, ending the latter's reign at 870\
    \ days. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== ==Notes/Explanations==\
    \ Category:Characters Category:WWE Category:AEW Category:Professional Wrestling\
    \ Category:Acrobats Category:Adults Category:Humans Category:Instinctive Action\
    \ Users Category:Male Characters Category:Martial Artists Category:Martial Arts\
    \ Champions Category:Wrestlers"
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-5888de7b
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics (Dragunov is said to be in tremendous
    physical condition, with commentary stating he is borderline superhuman when it
    comes to his physical abilitiesWWE Friday Night Smackdown, October 17, 2025) *Martial
    Arts (Dragunov is a skilled wrestler. He won the EW-COM Ringmaster Tournament
    in 2013 and the Next Step European Championship twice. In wXw, he won the inaugural
    wXw Shotgun Title and won it again, as well as the wXw World Tag Team Titles three
    times, the 2013 Mitteldeutschland Cup, the wXw Shotgun Championship Tournament,
    the 2017 16 Carat Gold Tournament, and the wXw Unified World Wrestling Championship.
    In WWE, he won the NXT UK Championship, the NXT Championship, and the WWE United
    States Championship. In 2023, ESPN ranked him #26 of the 30 best professional
    wrestlers under 30, he was ranked #30 of the top 500 singles wrestlers in the
    PWI 500 in 2024, and Sports Illustrated named him Comeback Performer of the Year
    in 2025.) *Instinctive Action (Dragunov can kick out of other wrestlers'' finishers)
    *Acrobatics (Dragunov is capable of high-flying maneuvers) *Pain Empowerment (Dragunov
    is said to feed off pain)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
