power_scale:
  tier:
    text: Low 5-B
    source_ids:
    - mediawiki-4989270
    confidence: 0.95
  attack_potency:
    text: 'Small Planet level (The strongest SeraphimOne Piece Vivre Card Databook
      #1718. S-Bear was ordered to defeat either CP0, S-Hawk, S-Shark, or S-Snake,
      implying he''s capable of doing soOne Piece Vol. 106 Chapter 1069. Was considered
      by Shaka to be an elite unit alongside Stussy, Kaku, and the SeraphimOne Piece
      Vol. 106 Chapter 10723.014 Zettatons)'
    source_ids:
    - vsbattles-s-bear-one-piece-unknown
    confidence: 0.6
  speed:
    text: Relativistic+ (Superior to his peers), higher perception (Saw Gear 4th Boundman
      Luffy's Kong Gun, although he was unable to respond in timeOne Piece Vol. 106
      Chapter 1076) or with flames off, possibly Speed of Light travel and attack
      speed with Devil Fruit (Has the same exact devil fruit abilities and mastery
      as Bartholomew Kuma), Speed of Light attack speed with Laser Beams
    source_ids:
    - vsbattles-s-bear-one-piece-unknown
    confidence: 0.6
  lifting_strength:
    text: Class Z (Superior to his peers. Took a Hawk Gatling from Gear 2nd Luffy
      without getting knocked awayOne Piece Vol. 107 Chapter 1078)
    source_ids:
    - mediawiki-4989270
    confidence: 0.95
  striking_strength:
    text: Moon level
    source_ids:
    - mediawiki-4989270
    confidence: 0.95
  durability:
    text: Small Planet level (Far more durable than any other of the Seraphim due
      to his Buccaneer blood. Tanked several hits from Gear 4th Luffy and Hybrid form
      Rob Lucci without injuriesOne Piece Vol. 107 Chapter 10773.014 Zettatons), lower
      with flames off (Far inferior than with flames on. Superior to the other Seraphim.
      Gear 2nd Luffy's Hawk Gatling was implied to be capable of harming him1.507
      Zettatons)
    source_ids:
    - vsbattles-s-bear-one-piece-unknown
    confidence: 0.6
  stamina:
    text: Superhuman (As Pacifista, the Seraphim will continue to fight until they
      are either completely destroyed or their bodies are damaged in a way that leaves
      them incapacitated)
    source_ids:
    - vsbattles-s-bear-one-piece-unknown
    confidence: 0.6
  range:
    text: Extended Melee Range through sheer size, Tens of Kilometers with Laser Beams,
      Stellar with Devil Fruit (S-Bear's Devil Fruit is the same as Bartholomew Kuma's,
      which was able to send the Straw Hat Crew all over the planet, even beyond the
      Grand Line) Standard Equipment None Notable
    source_ids:
    - vsbattles-s-bear-one-piece-unknown
    confidence: 0.6
  intelligence:
    text: Unknown, at least Gifted (As Pacifista, the Seraphim's intelligence are
      based on their programming, although they are capable of quickly analyzing data
      to improve on themselves and they never stop growing)
    source_ids:
    - vsbattles-s-bear-one-piece-unknown
    confidence: 0.6
