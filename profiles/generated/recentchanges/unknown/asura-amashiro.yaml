- id: claim-powers-and-abilities-b0334d39
  section: abilities
  axis: hax
  text: "Stealth Mastery (Followed Raika home without being spotted once he figured\
    \ he was in a bad situation.Asura's Verdict Chapter 11 Went far away from Raika\
    \ while they were talking without him noticingAsura's Verdict Chapter 20), Supernatural\
    \ Willpower (Stood back up and moved like nothing happened after being beaten\
    \ unconsciousAsura's Verdict Chapter 12), Aura (The atmosphere around him changed\
    \ when he was emotionally disturbed,Asura's Verdict Chapter 30 causing Iruya to\
    \ sense an immense air of danger surrounding him), Fear Manipulation and Illusion\
    \ Inducement (His presence made Iruya see a demon before opening a doorAsura's\
    \ Verdict Chapter 34), Rage Power (Whenever he is angered, Asura becomes much\
    \ stronger, to the point he can physically overpower people who before were much\
    \ stronger than him), Limited Invisibility (The growing mark on his arm is invisible\
    \ to anyone but himAsura's Verdict Chapter 15Asura's Verdict Chapter 27), Possibly\
    \ Extrasensory Perception (Could see Ye Olde Hell's Gate, shocking the shopkeep,\
    \ who claimed only those living a hellish life and who wish to send someone to\
    \ Hell can see itAsura's Verdict Chapter 1) Key to Hell \u25BE= Summoning, BFR,\
    \ and Limited Fusionism (By inserting the Key to Hell into an evil person's head\
    \ and twisting it, Asura can summon one of the one hundred demons residing within\
    \ Hell to drag them away through a Gate to Hell while they are still alive. Once\
    \ inserted, the key will stay stuck in the intended target's head, unable to be\
    \ pulled out unless it's twisted), Limited Fire Manipulation (A Gate to Hell leaves\
    \ behind symbols akin to scorch marks that cannot be removed wherever it is summoned)\
    \ Summoned Demons=Superhuman Physical Characteristics (Each of the demons Asura\
    \ summons are easily capable of restraining whoever they are sent to take, some\
    \ being able to crush bone with their sheer strength), Large Size (Type 0; Many\
    \ of the demons appear much larger than any ordinary human), Additional Body Parts\
    \ (Some demons have several additional eyes), Bodily Weaponry (The Unicorn and\
    \ Giant Serpent have sharp teeth), Duplication (The Eyeball Demon can generate\
    \ enough eyes to totally surround and overwhelm somebody), Vitality Absorption\
    \ (The Shriveled Demon saps victims, rendering them sickly thin husks and making\
    \ itself stronger), Shapeshifting (The Mirror Monster sets free a creature that\
    \ takes the form of its victim before attacking them), Multiple Selves (Type 3;\
    \ The Giant Serpent has two other snakes within it that can act on their own),\
    \ Regeneration (High-Low; The Giant Serpent's tongue can grow itself back after\
    \ being cut into pieces)"
