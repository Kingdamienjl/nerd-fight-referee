- id: claim-weaknesses-7d3bf9e7
  section: weaknesses
  axis: weakness
  text: 'If she uses her amulet too much, she''ll die, and is a little obsessed with
    her cousin. If she speaks about Valla outside of it, she''ll die Notable Attacks
    and Techniques: * Foreign Princess: Due to her status as a Princess of Hoshido
    and Nohr, all opponents who are considered to be foreign will have their attack
    and defenses reduced should they dare to approach her. * Healing Descant: Azura''s
    voice soothes all nearby injured allies, healing their wounds at a slow but steady
    rate. * Inspiring Song: Azura is able to sing tales of good fortune to bolster
    her allies'' morale, improving their overall combat speed, luck, and technique.
    * Voice of Peace: Azura sings ballads that advocate peace, weakening her enemies''
    will to fight and causing them to deal reduced damage as a result.'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
