- id: claim-weaknesses-7d011ac6
  section: weaknesses
  axis: weakness
  text: "There is an upper limit on the number of witchbeasts she can control, around\
    \ one thousand. Persistent use of her Divine Protection can overheat her ability,\
    \ causing backlash such as headaches and nosebleeds. Notable Attacks/Techniques:\
    \ *Divine Protection of Fiend Manipulation: Meili's Divine Protection, which allows\
    \ her to control witchbeasts\u2014 a kind of magical monster created over 400\
    \ years ago by the Witch of Gluttony. Meili triggers the same instinct in the\
    \ beasts as their horns, forcing the monsters to obey her. She is unable to control\
    \ particularly powerful witchbeasts such as the White Whale and can be incompatible\
    \ with certain others, such as the Flower Bear, though she can still control those.\
    \ This Divine Protection is unique and only a single user can be blessed with\
