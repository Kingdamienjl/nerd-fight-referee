- id: claim-weaknesses-6a8f255a
  section: weaknesses
  axis: weakness
  text: 'Being hit with enough foreign scrap metal, such as with Silk Shot, causes
    Magna Centipede''s tail to fall apart, disabling both his Magnet Mine and his
    ability to personally spread the Maverick Virus Notable Attacks/Techniques: *Magnet
    Mine: Using his control over magnetism, he is able to split apart his tail and
    use the segmented pieces as projectiles, launching them around and at his opponent.
    He is also able to fire mines that can stick to any nearby surface and explode
    after a short time, and when charged, changes to slow floating ball of magnetism
    that not only damages anyone who comes into contact with it, but also absorbs
    any enemy projectiles, growing in size if enough energy is drawn into itself.
    *Shuriken: Throws a volley of shuriken, able to cause them to arc in different
    directions depending on his throw. *Maverick Virus: Activates a powerful magnet
    that draws in any metallic or robotic opponents towards him. If they get drawn
    in close enough for him to capture, he will pierce them with his tail and inject
    them with the Maverick Virus before tossing them away. When done to Mega Man X,
    it caused the following effects to happen to him: **Restricted his ability to
    hold a Charged Shot or engage in rapid fire. **Reduced his agility when dashing.
    **Reduced his overall jump height. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== All notable information about Magna Centipede can be found his
    boss fight. Category:Characters Category:Male Characters Category:Game Characters
    Category:Video Game Characters Category:Game Bosses Category:Mega Man Category:Antagonists
    Category:Robots Category:Bugs Category:Self-Sustenance Users Category:Inorganic
    Beings Category:Martial Artists Category:Weapon Masters Category:Thrown Weapon
    Users Category:Magnetism Users Category:Body Control Users Category:Corruption
    Users Category:Biology Users Category:Statistics Reduction Users Category:Power
    Nullification Users Category:Reploids Category:Mavericks (Mega Man)'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-55fdb56d
  section: abilities
  axis: hax
  text: '*Reploid Physiology (General) *Skilled Hand-to-Hand Combatant *Weapon Mastery
    (Expert shuriken user) *Magnetism Manipulation, Explosion Manipulation & Body
    Control (Via Magnet Mine, which allows him to detach and segment his own tail,
    controlling them with magnetism; Has been shown to pull his robotic opponents
    towards himself) *Corruption, Biological Manipulation, Statistics Reduction and
    Power Nullification (Via the Maverick Virus; he is able to inject it directly
    into robotic opponents, which can reduce their movement capabilities or restrict
    the use of certain abilities altogether) All Resistance of Reploid Physiology
    (General)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
