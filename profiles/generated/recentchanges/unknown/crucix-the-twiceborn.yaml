  intelligence:
    text: 'At least Gifted (Is a skilled fighter, capable of effectively dual-wielding
      an axe and spear; the twins are able to coordinate effectively with one another,
      with the smaller twin being able to provide covering fire whenever the larger
      twin is staggered. Was responsible for the hundreds of inscriptions dedicated
      to the subject of eternity within the Shifting Archives of the Seat of Infinity
      and managed many disciples in his studiesTwin-Sister dialogue, after defeating
      Crucix a second time: "Crucix had many disciples. Solomon studied under him.
      He said he, too, was twiceborn... that he had undertaken the Rite of Rebirth.
      But I can''t believe it. He was no madman. No monster.") Standard Tactics: In
      the first phase, the larger twin will fight with their axe and spear while the
      smaller one will occasionally fire their crossbow, sometimes providing suppressive
      fire if the larger twin is staggered. In the second phase, after the smaller
      twin dies, the larger twin will go berserk and fight without restraint and lose
      some of their finesse.'
    source_ids:
    - vsbattles-crucix-the-twiceborn-unknown
    confidence: 0.6
