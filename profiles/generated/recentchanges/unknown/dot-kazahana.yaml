- id: claim-standard-equipment-9f309f20
  section: equipment
  axis: equipment
  text: "*Chakra Armor: The Chakra Armor is a unique type of armor that blocks out\
    \ opposing ninjutsu and genjutsu while strengthening the user's own chakra and\
    \ techniques. Powered by a crystal-like object, the armor produces an invisible\
    \ barrier around the user to nullify or deflect most chakra-based techniques,\
    \ as well as physical projectiles like kunai and f\u016Bma shuriken. The armor\
    \ has been shown to be strong enough to deflect high-level Water Release and protect\
    \ its wearer from multiple explosive tags, though it became heavily damaged in\
    \ the process. Aside from these features, the Chakra Armor was also endowed with\
    \ a wrist-mounted wire-launcher, enabling the user to either quickly move about\
    \ using the wire, or to bind and restrain an opponent."
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-39ecd0b2
  section: power_scale
  axis: battle_iq
  text: "Above Average (Dot\u014D proved to be a very crafty and manipulative man,\
    \ being able to cause a revolt in the Land of Snow that resulted in the death\
    \ of his brother, who was the leader of the country before him. He was further\
    \ shown to be rather adept in developing strategies and planning things out with\
    \ great detail from how he prepared for Team Kakashi's attack. He also had knowledge\
    \ of some foreign ttechniques such as Shadow Clone Technique)"
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-c0aaf19d
  section: weaknesses
  axis: weakness
  text: "The Chakra Armor has a limit to how much chakra it can nullify, as seen when\
    \ Kakashi was able to damage Nadare's armor with Raikiri. The armor is vulnerable\
    \ to taijutsu and is highly unstable and will, if sufficiently damaged, explode\
    \ on contact with another suit's power source. Notable Attacks/Techniques: *Ice\
    \ Release: **Black Dragon Blizzard: The user manipulates pre-existing ice and\
    \ forms it into a giant tiger. It is cold enough to freeze any Water Release technique\
    \ that it comes into contact with.An Ice Release technique formed from already\
    \ existing ice. After forming the needed hand seal Dot\u014D will thrust his arm\
    \ to send out a black ether-like dragon to strike his opponent. As it flies through\
    \ the air it will begin to turn. When it hits the target it will use its motion\
    \ to launch the opponent high into the air. **Twin Dragon Blizzard: An advanced\
    \ version of Ice Release: Black Dragon Blizzard in which Dot\u014D releases two\
    \ dragons of black snow that merge into a massive tornado. This technique manipulates\
    \ existing ice instead of creating ice. ==Notable Matchups== Victories: Losses:\
    \ Inconclusive: ==References== Category:Characters Category:Naruto Category:Acrobats\
    \ Category:Anime Characters Category:Antagonists Category:Male Characters Category:Energy\
    \ Users Category:Statistics Amplification Users Category:Surface Scalers Category:Free\
    \ Movement Users Category:Afterimage Users Category:Stealth Masters Category:Duplication\
    \ Users Category:Illusionists Category:Shapeshifters Category:Paralysis Users\
    \ Category:Ice Users Category:Armor Users Category:Forcefield Users Category:Power\
    \ Nullification Users Category:Thread Users Category:Flight Users Category:Leaders\
    \ Category:Movie Characters Category:Chi UsersCategory:Extrasensory Perception\
    \ Users Category:Adults Category:Weapon Users"
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-f7bff242
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Acrobatics *Chakra Manipulation **Statistics\
    \ Amplification (Shinobi are capable of enhancing their physical capabilities\
    \ with the use of chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance\
    \ their speed by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter\
    \ 24Naruto Chapter 71) **Surface Scaling and Water Walking (By focusing chakra\
    \ at the soles of their feet, Shinobi can scale and cling to vertical surfaces,\
    \ and even walk on waterNaruto Chapter 18Naruto Chapter 90) **Afterimage Creation,\
    \ Stealth Mastery, and Speed Enhancement (The Substitution Jutsu allows its user\
    \ to instantly replace themselves with a nearby object such as a tree log, plant,\
    \ person, or clone at the exact moment they are attacked. The Jutsu works even\
    \ if the user is physically restrained or observed by characters as observant\
    \ as Sharingan or Sage Mode users. This creates the optical illusion of the user\
    \ being hit, which confuses the opponent and gives them an opening to flee or\
    \ counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter 374Naruto Chapter\
    \ 580Naruto Chapter 674) **Minor Illusion Creation and Duplication (With the Clone\
    \ Technique,Rin no Sho, Page 220 Shinobi can create illusionary duplicates of\
    \ themselves that have no physical substance. Can also create shadow clones that\
    \ can use his techniques, relay information, and act as distractions) **Shapeshifting\
    \ (With the Transformation Technique, Shinobi can transform themselves into other\
    \ people, animals, plants, and even inanimate objects, such as weapons), Paralysis\
    \ Inducement (With the Temporary Paralysis Technique,Rin no Sho, Page 176 Shinobi\
    \ can completely paralyze their targets from close to mid range) **Ice Manipulation\
    \ (As an Ice Release user, Dot\u014D can manipulate ice and snow, but his use\
    \ seems to differ from a Kekkei Genkai, as he has only been shown to manipulate\
    \ pre-existing ice. Dot\u014D can manipulate the pre-existing ice and snow around\
    \ him to form dragons of black ice to assault his opponentsNaruto the Movie: Ninja\
    \ Clash in the Land of Snow (2004)) **Air Manipulation with Twin Dragon Blizzard\
    \ (Can use existing ice to create two dragons of black snow that merge into a\
    \ massive tornado) *Enhanced Statistics Amplification (The Chakra Armor increases\
    \ the chakra within the user's body and strengthens their jutsu) *Passive Forcefield\
    \ Creation and Chakra Nullification (The Chakra Armor creates a chakra barrier\
    \ around the user's body that deflects projectiles such as shuriken or kunai and\
    \ serves as an \"anti Chakra\", deflecting/nullifying chakra-based techniques\
    \ such as ninjutsu and genjutsu) *Thread Manipulation (The Chakra Armor has a\
    \ wrist-mounted wire launcher that can be used to quickly move or to bind and\
    \ restrain an opponent) *Flight (Dot\u014D's Chakra Armor has built-in wings for\
    \ gliding)"
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
