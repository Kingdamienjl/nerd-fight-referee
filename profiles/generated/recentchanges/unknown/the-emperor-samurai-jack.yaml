  origin: 'A large lake of the boiling ooze. Performing a prayer and bathing his arrow
    with the elixir, the Emperor shot a flaming arrow into the evil, intending to
    end it. However, his actions led to the awakening of an ancient being of pure
    darkness: Aku. Aku, finally awakened from an eon-long slumber, quickly defeated
    the Emperor, and left him imprisoned in the forest. Powerless, he could only watch
    in horror as the Master of Evil devastated his land and slaughtered his people
    with his power. However, when all seemed hopeless and at its darkest, the Emperor
    was freed by a celestial horse who descended from the skies, and which took him
    to a mountain in the clouds. There, he was met by the three gods: Ra, Odin and
    Vishnu, who extracted the righteous energies within the Emperor''s spirit and
    forged a magical sword from it. Bestowed with the sword, the Emperor now had the
    power to destroy Aku, and returned to save his people. He and the evil deity fought
    a long battle, but the Emperor was ultimately victorious, sealing Aku with his
    blade''s power. His victory did not last for long, however. Years later, Aku escaped
    from his prison and ravaged the land once again. While the Emperor tried to stop
    him, he was weakened by age and was quickly stopped and captured. His wife and
    his son, "Jack", were able to escape the palace''s devastation. Jack would train
    for the following decades, so that he would become the hero who would defeat Aku
    once and for all and rescue the land from his rule. ==Powers and Stats'
