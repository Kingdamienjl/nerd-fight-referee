- id: claim-weaknesses-7ebdb002
  section: weaknesses
  axis: weakness
  text: 'Due to the 4 Forces repelling each other in negative ways excessively using
    2 or more forces all at once could burn out his body. Should possess the same
    weaknesses other Speed Force users do, as well as those of his Post-Crisis counterpart.
    Feats: *Repaired the Speed Force Barrier at the cost of his life *Significantly
    damaged the Black Flash *Successfully gathered all 4 Forces in himself and accessed
    the Forever Force Notes: *Before making any changes to this page, please read
    and follow the Power-scaling Rules for Marvel and DC Comics. *While Hunter should
    be capable of similar singularity feats like Jenni Ognats at exactly the Speed
    of Light, it''s unclear if Speedsters would survive the aftermath of becoming
    a singularity and ripping the universe due to the Speed Force breaking down around
    them.Final Crisis: Legion of 3 Worlds Vol 1 #3'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
