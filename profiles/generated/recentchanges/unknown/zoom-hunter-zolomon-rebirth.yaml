- id: claim-powers-and-abilities-2f8ff70f
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Time Manipulation (Via the Forever Force
    which gives him full control over time), Afterimage Creation (As seen here), Regeneration
    (High-Low; Comparable to other Speed Force users), Statistics Amplification and
    Perception Amplification (Strength Force makes him stronger, Sage Force makes
    him faster and Speed Force makes him faster than even Barry Allen,The Flash Vol
    5 #80 perceptions can speed or slow down with the Speed, Still or Forever Force),
    Cloth Manipulation (Creates his own suitThe Flash Vol 5 #46), Energy Manipulation
    and Energy Projection (As seen here and hereThe Flash Vol 5 #50), Portal Creation,
    Dimensional Travel and Time Travel (By running through the Speed Force, Hypertime
    or Forever Force), Air Manipulation (Can create massive vortexesThe Flash Vol
    5 #57), Limited Sound Manipulation (Can deafen people with a snapThe Flash Vol
    5 #79), Power Absorption (Was able to absorb the Still Force from Steadfast),
    Retrocognition and Clairvoyance (Via windows in time or with the Still ForceThe
    Flash Vol 5 #75), Alternate Future Display (As seen here), Cosmic Awareness (Knew
    that if he absorbed all the Forces then the Black Flash would come for him, could
    sense the Black Flash), Extrasensory Perception (Could sense the location of the
    Force Users once they started using their powers), Mind Manipulation (With the
    Sage Force, Could possibly use the Sage Force to link minds together, Could potentially
    use the Sage Force to control peopleThe Flash Vol 5 #68), Telepathy (Can enter
    Wally''s mind), Earth Manipulation (Can control the earth and rocks him with the
    Strength Force,The Flash Vol 5 #50 Could possibly causes earthquakesThe Flash
    Vol 5 #54), As he mastered the Speed Force should be capable of the same abilities
    as Barry which includes the following: Durability Negation, Intangibility, Enhanced
    Senses, Aura, Limited Astral Projection, Flight, Precognition, BFR, Biological
    Manipulation, Electricity Manipulation, Light Manipulation, Spatial Manipulation,
    Accelerated Development and Instinctive Reaction, As he also mastered the Strength
    Force should also be capable of the abilities shown by lesser users which includes
    the following: Density Manipulation and Gravity Manipulation (The Strength Force
    is based on gravity and the forces of motion to allow him to increase his mass
    and create his own gravitational pull,The Flash Vol 5 #53 Can control the gravity
    around him), Body Control (Can shift the Strength Force around the body to strengthen
    or weaken certain aspects of itThe Flash Vol 5 #60), Rage Power and Transformation
    (Strength Force will transform the user''s body when the user is enraged), As
    he also mastered the Sage Force should also be capable of the abilities shown
    by lesser users which includes the following: Limited Empathy Absorption (The
    Sage Force feeds on empathy), Illusion Creation (As seen hereThe Flash Vol 5 #62
    and hereThe Flash Vol 5 #78), Information Analysis (As seen hereThe Flash Vol
    77), Memory Manipulation (Can tap into people''s memories with the Sage Force,
    Can also relive memories with the Still Force), Limited Fear Manipulation and
    Creation (Sage Force can tap into memories and channel them into physical entitiesThe
    Flash Vol 5 #61 or illusions), Should be capable of having the same passive effects
    of other Still Force users which includes the following: Immortality (Type 1;
    Via the Still Force), Motion Nullification (Still Force can negate motion to prevent
    movement,The Flash Vol 5 #69 it is the cosmic essence of stasisJustice League
    Vol 4 #6), Life Steal (Could possibly drain the life of others with the Still
    ForceThe Flash Vol 5 #73), Speed Absorption (The Still Force can passively steal
    speedThe Flash Vol 5 #72), Same powers as his Post-Crisis version but to an much
    greater extent as he has much greater control over the Forever Force after absorbing
    the 4 Forces (As he kept his memories and is portrayed as the same) Motion Nullification
    (Resisted the effects of the Still Force by using every bit of the Speed Force),
    Existence Erasure and Death Manipulation (The Black Flash couldn''t kill him with
    a single touchThe Flash Vol 5 #81), Sleep Manipulation (Speedsters have a special
    metabolism that prevents things such as sleep gas to deal damage to them or affect
    themThe Flash (2016) #774), Possesses the same Resistances as his Post-Crisis
    version due being the same character as well as the resistances as other Speedsters'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
