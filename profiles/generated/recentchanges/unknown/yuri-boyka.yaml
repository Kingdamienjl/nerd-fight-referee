- id: claim-weaknesses-f65dd7ea
  section: weaknesses
  axis: weakness
  text: "A knee weakened after being broken; vulnerable towards attacks to it, although\
    \ a few months before the start of the fourth film, he fixed it up to where the\
    \ injury is an minor inconvenience to him. Also very cocky with a temper and will\
    \ purposely leave himself open for one to hit him. Notable Attacks/Techniques:\
    \ Taekwondo, Wushu, Karate, Muay Thai, Sambo, and Brazilian Jiu-Jitsu * Guyver\
    \ Kick: Boyka's signature move. The technique is named after the film Guyver the\
    \ Dark Hero. First, he does a 360\xB0 side spin in the air with his rear leg tucked\
    \ into his stomach and his front leg pointed outward. Once his body is faced towards\
    \ his opponent, Boyka kicks them with the back leg, resembling a split position\
    \ in the air. Due to the speed and weird angle this kick is thrown at, it can\
    \ be very difficult to block or avoid. ==Notable Matchups== Victories: Losses:\
    \ Ip Man (Ip Man Trilogy) Ip Man's Profile Inconclusive: ==References== Category:Characters\
    \ Category:Undisputed Category:Antagonists Category:Boxers Category:Criminals\
