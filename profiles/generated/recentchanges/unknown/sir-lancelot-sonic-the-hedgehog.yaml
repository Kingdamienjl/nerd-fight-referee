- id: claim-weaknesses-665ccb6e
  section: weaknesses
  axis: weakness
  text: 'Can be arrogant at times Notable Attacks/Techniques: *Chaos Control: Curiously,
    Lancelot is able to perform Chaos Control without the use of a Chaos Emerald.
    Regardless, its applications are unchanged, as Lancelot uses it to control the
    fabric of time and space. He can use this to teleport himself as well as other
    people and objects, manipulate time by slowing or stopping it, inter-dimensional
    travel, and time travel. *Chaos Spear: Lancelot fires a powerful energy bolt either
    from his palm or from his sword. *Chaos Blast: Lancelot generates a powerful explosion
    and shockwave of highly powerful Chaos Energy that damages anyone caught in it''s
    range. *Chaos Punishment: Lancelot freezes time and warps toward the nearest enemy,
    delivering a powerful slash with his blade, a downward kick or a Chaos Blast.
    Alternatively, this technique can be used to warp over long distances in a high
    speed dash, similar to Sonic''s Speed Break. ==Notable Matchups== Victories: Losses:
    Shadow The Hedgehog (Main Sonic Continuity) Shadow''s Profile (Pre-Generations
    Shadow was used and the Light Speed Attack and his Uninhibited State were restricted)
    Inconclusive: ==Scaling Notes== Category:Characters Category:Sega Sonic Category:Acrobats
