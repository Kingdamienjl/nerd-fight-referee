- id: claim-powers-and-abilities-0be38a11
  section: abilities
  axis: hax
  text: 'The verse has a wide range of hax, including Power Mimicry, Existence Erasure, Higher-Dimensional
    Existence, Information Manipulation, Deconstruction, Spatial Manipulation, Mind Manipulation, Soul
    Manipulation, Subjective Reality, Fear Manipulation, Madness Manipulation, Gravity Manipulation, BFR,
    Time Manipulation, Causality Manipulation, and many more. |-|Terminology= is the main energy system
    of the verse. It is formed by molding the physical energy present in every cell of the body with the
    spiritual energy gained through training and experience, and is used to perform Jutsu. *(Note: In
    the verse, chakra is often used loosely as a blanket term for related energies. For example, Boruto
    calls the Earth''s centrifugal force that fuels his Uzuhiko the "Planet''s Chakra", Madara''s soul
    reattaching to his Edo Tensei body is described as his chakra settling back in, and characters state
    that losing all chakra means death, which strictly applies only once the physical and spiritual energy
    that make up chakra are exhausted.) The is the network that carries chakra throughout the body, supplying
    every organ and cell, much like the circulatory system carries blood. * are the 361 points along the
    Chakra Pathway System. They regulate the release of chakra like circuit breakers, and are too small
    to be seen even with the Sharingan. are the techniques chakra users perform by molding their physical
    and spiritual energy into chakra. They vary widely in scope and are mostly used in combat. * is the
    broadest of the three main jutsu types, covering most techniques that are not Taijutsu or Genjutsu,
    from elemental attacks and cloning to shapeshifting and healing techniques. * acts almost entirely
    on the mind. It manipulates the target''s senses with illusions to incapacitate them, read their mind,
    or deceive them. * are purely physical techniques, combining martial arts mastery with chakra control
    and output for superhuman feats in hand-to-hand combat.'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
