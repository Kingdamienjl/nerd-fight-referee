    EYE LIGHTS Mechani-Kong_Mouth_Speakers.png|LOUDSPEAKERS *Hypnotic Light: Mechani-Kong
    can emit a hypnotic light from the top of its head. This light is capable of temporarily
    entrancing Kong. *Grenades: Mechani-Kong has a utility belt attached to its waist
    that contains numerous giant grenades. Mechani-Kong can pull these grenades off
    its belt and throw them, either to try and harm its enemies or to dig through
    the Arctic ice. *Strength: Mechani-Kong possesses a high degree of physical strength.
    The machine is capable of grappling with King Kong himself, considered to be the
    strongest animal on Earth, and can dig through solid ice or scale the Tokyo Tower
    with ease. *High Beam Eye Lights: Mechani-Kong''s eyes are outfitted with powerful
    high-beam lights, which it can use to temporarily blind opponents. *Loudspeakers:
    Mechani-Kong has several loudspeakers inside its mouth, through which Dr. Who
    can broadcast his voice. ==Notable Matchups== Victories: Losses: Inconclusive:
