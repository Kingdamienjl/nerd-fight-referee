- id: claim-weaknesses-bb9fc26c
  section: weaknesses
  axis: weakness
  text: 'It suffers from a form of psychological suffering, comparable to the torture
    of that of its captives, after gaining sentience. Furthermore, it despises its
    very existence and the human race for giving it this existence. Note: Profile
    image comes from Harlan Ellison''s Dream Corridor, a comic adaptation by John
    Byrne ==References== ==Notable Matchups== Victories: Caine (The Amazing Digital
    Circus) Caine''s Profile (Speed was equal and the battle took place inside of
    AM) Ego the Living Planet (Marvel Cinematic Universe) Ego''s Profile (Speed was
    equal and Ego was in their Planet Form key, AM was transported 1:1 on Ego''s Planet
    and both had prior knowledge on them being able to planet manipulate, including
    AM knowing the planet was alive and Ego knowing AM is a artificial intelligence)
    Death (Final Destination) Death''s Profile (Win conditions were based off Ted,
    AM would win if he could keep Ted alive for 50 years, Death would win if he could
    kill Ted within the span of 50 years. Both were aware of the other and took place
    in a modern day reality with no humans unless needed) Losses: The Combine (Half-Life)
    The Combine''s Profile (The Combine has at least 2 months of preparation) Inconclusive:
