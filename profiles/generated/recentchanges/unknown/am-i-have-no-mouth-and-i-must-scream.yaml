- id: claim-powers-and-abilities-2c202fcb
  section: abilities
  axis: hax
  text: 'Innate: *Inorganic Physiology (Type 2) *Self-Sustenance (All Types) *Genius
    Intelligence *Longevity (Perfectly functional even after a 109 years of being
    activeIt was our one hundred and ninth year in the computer.) *Explosion Manipulation,
    Heat Manipulation, Radiation Manipulation, Sound Manipulation & Light Manipulation
    (Has access to nuclear weaponry) *Hacking (Took control of all of the world''s
    computer systems, even before gaining sentience.)There was the Chinese AM and
    the Russian AM and the Yankee AM and everything was fine until they had honeycombed
    the entire planet, adding on this element and that element. But one day AM woke
    up and knew who he was, and he linked himself, and he began feeding all the killing
    data, until everyone was dead Supernatural'
