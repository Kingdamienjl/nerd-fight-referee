    text: Superhuman (AM contained the humans and manipulated them to its whim, being
      part of all of planet Earth itself. AM created the Hurricane Bird"The hurricane
      hit us with the force of a glacier thundering into the sea. It was a palpable
      presence. Winds that tore at us, flinging us back the way we had come, down
      the twisting, computerlined corridors of the darkway. Ellen screamed as she
      was lifted and hurled faceforward into a screaming shoal of machines, their
      individual voices strident as bats in flight. She could not even fall. The howling
      wind kept her aloft, buffeted her, bounced her, tossed her back and back and
      down and away from us, out of sight suddenly as she was swirled around a bend
