- id: claim-range-2ccbb0ea
  section: power_scale
  axis: range
  text: 'Standard Melee Range normally, Tens of Meters with ranged attacks (He is
    able to throw his Kunai this far.), Hundreds of Meters with the Rasengan and its
    variants (Minato''s Rasengan completely decimated the area he and The Masked Man
    fought in. The impact of a Giant Rasengan has been compared to a small asteroid),
    Kilometers with Barriers (Stated that he could make a barrier large enough to
    contain Kurama, and contributed to the formation of a barrier that trapped the
    Ten-Tails. His teleportation barrier can be made big enough to eclipse a mountain.
    Uzumaki Barriers have also been shown covering large portions of Konohagakure.),
    and the Massive Rasengan (A Senjutsu users'' Massive Rasengan is capable of easily
    carving away mountains), Thousands of Kilometers with Chakra Sensory Mode (Can
    sense and identify Chakra signatures from multiple countries away. Minato was
    able to investigate the events of an entire battlefield from countriesNaruto Birthday
    Columns: 1/25/24 away from his current position in order to find his son Naruto.),
    Interdimensional with the Flying Raijin Jutsu (Better at Flying Raijin than Boruto
    Uzumaki, who has traversed to Isshiki''s Dimension with it.Boruto: Two Blue Vortex,
    Chapter 4: "The Awakening")'
