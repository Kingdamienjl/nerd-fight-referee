- id: claim-intelligence-cf1bd03e
  section: power_scale
  axis: battle_iq
  text: "Extraordinary Genius A genius of terrifying proportion. Minato's intellect\
    \ was the main contributing factor behind him being not only the most legendary\
    \ figure of his time,Jin no Sho, Page 173 but an immortal myth whose skills would\
    \ be remembered and aspired to decades after his death.Boruto: Two Blue Vortex,\
    \ Chapter 4: \"The Awakening\" Minato's brilliance first showed itself in the\
    \ Shinobi academy, when he graduated at just ten years old, with the average age\
    \ being 12.T\u014D no ShoItachi Shinden: Book of Bright Light; Chapter 1, Page\
    \ 57 Even as a Genin, Minato's intellect and talent allowed him to rise above\
    \ even the best Konoha soldiers, and become an international legend[Minato Column\
    \ 1] Yellow Flash of Konoha: Tales of Minato Namikaze's Valor at the same time\
    \ most ninja were learning the basics. When the villages Jinchuriki, Kushina was\
    \ kidnapped by highly skilled Kumogakure ninja who were able to easily infiltrate\
    \ the village and capture her. Konoha immediately sent multiple search parties\
    \ looking for her, but even experienced Jonin search parties were unable to track\
    \ her, but Minato, as a mere Genin was able to pick up on the trail she left and\
    \ defeat her captors.Naruto, Chapter 498: \"My Ma's Red Hair\" When it was time\
    \ take the Chunin Exams, Minato's intelligence once again left a mark, when he\
    \ earned the highest written exam score in the history of Konohagakure. Even other\
    \ geniuses who succeeded him, like Itachi Uchiha, and Shikamaru Nara failed to\
    \ overtake this score.Itachi Shinden: Book of Bright Light; Chapter 3, Page 121\
    \ This test included Kinematics, Trigonometry, and other topics too advanced for\
    \ his age group.Naruto, Chapter 41: \"The Whisper of Demons\"Naruto, Chapter 44:\
    \ \"The Talents We Test For\" These initial accolades are what made even the Legendary\
    \ Sannin praise him as a flawless genius overflowing with talent, that everybody\
    \ paled in comparison to.Naruto, Chapter 142: \"Kakashi vs. Itachi\" A genius\
    \ only seen once-in-a-decade, and incredibly rare to come across. Minato was even\
    \ hailed as the most brilliant ninja in Konoha history.Naruto Stealth Volume:\
    \ Road to Ninja, pg. 72 These accolades should place his intelligence as superior\
    \ to even high-level scientists like Orochimaru and Tobirama. Jiraiya in particular\
    \ was so impressed by Minato's talent, noting how it was superior to his own,\
    \ genuinely began to believe that Minato was the child of prophecy, the fated\
    \ savior who would protect the Shinobi world during a coming catastrophe. This\
    \ would imply that to Jiraiya, Minato's innate talent was enough to compare him\
    \ to Nagato, another genius Jiraiya believed to be the child of prophecy based\
    \ on his Rinnegan, the eyes of the Sage of the Six Paths, based solely on his\
    \ personal talents, as opposed possession of the highest level of Visual Jutsu\
    \ achievable. After Minato's early life as a ninja passed, his true genius shined\
    \ in his unique aptitude for Ninjutsu. Minato was born with two Chakra whorls,\
    \ as opposed to one, a symbol of a true genius, but also, a sign of his incredible\
    \ ability to understand different techniques. Minato on a multitude of occasions\
    \ demonstrates a high aptitude for breaking down complex techniques to make new\
    \ ones, or improve existing ones. Minato's Ninjutsu talent was displayed in a\
    \ variety of ways. He was able to create a variety of Ninjutsu in his own style,Rin\
    \ no Sho, principal among these many Ninjutsu he invented was the Rasengan. After\
    \ a single encounter with the Tailed Beasts, Minato knew he needed a new technique\
    \ to combat these powerful foes. He was able to observe their main technique just\
    \ once, and later break down its mechanics enough to perfectly replicate it for\
    \ human form, in the Rasengan. He used the principle of kneading Chakra to match\
    \ ones internal whorls to mimic the Tailed Beast's process of matching black and\
    \ white Chakra ratios. The Rasengan is made even more impressive at the technical\
    \ level by the fact it is the pinnacle of Shape Transformation,Naruto, Chapter\
    \ 321: \"Smooth Talking...!!\" an advanced form of Chakra Control that is the\
    \ backbone in the formation of all Ninjutsu. Minato's incredible Ninjutsu prowess\
    \ extends beyond merely creating new techniques, his ability to break down Ninjutsu's\
    \ mechanics and rework them extends to improving existing Ninjutsu as well. With\
    \ the Flying Raijin Jutsu, Minato evolved the technique beyond its creator Tobirama's\
    \ limits. Creating several supplementary techniques for it like the Flying Raijin:\
    \ Guiding Thunder,Jin no Sho a Ninjutsu that combines the principles of the Flying\
    \ Raijin with the barrier structure of the Uzumaki sealing techniques he learned\
    \ from Kushina. His improvements on the Flying Raijin were so vast that Boruto,\
    \ a prodigy decades into the future, could not match Minato's skill with Space-Time\
    \ Ninjutsu.Boruto: Two Blue Vortex, Chapter 4: \"The Awakening\" Minato has further\
    \ improved the Uzumaki sealing arts in his own way similar to the Flying Raijin.\
    \ At an extremely young age, Minato evolved the Uzumak"
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-c38990e1
  section: weaknesses
  axis: weakness
  text: 'Standard Tactics == {| class="mw-collapsible mw-collapsed" align="center"
    border="1" cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; " |Notable Attacks/Techniques: |- | * A sphere of chakra energy that can
    create a massive explosion and damage the inside of a target. Needs to be within
    melee range to use it. Minato invented this technique after he studied how the
    Tailed Beast Bomb works. *: It is a space-time Ninjutsu that allows the summoner
    to gather animals or people across long distances instantly. Minato can summon
    frogs, such as Gamabunta. **: A teleportation technique created by Tobirama Senju.
    To activate this technique, the user needs a special seal to mark the destination.
    After this is done, the user enters a dimensional void that instantaneously transports
    themselves to the location of the seal. Minato applied the formula in advance
    to weapons such as distinctive kunai, and can also apply the mark to a touched
    area, such as his opponent (The seal never disappears) or some other surrounding
    feature. Minato can also use this technique to teleport other objects (warped
    the Ten-Tails''s Tailed Bast Bomb without problems), though the size of the object
    determines the amount of chakra required. **: Using a kunai with a Flying Raijin
    seal, Minato can form a barrier that will teleport away incoming attacks directed
    at it to another Flying raijin seal at his choosing (basically the same as Flying
    Raijin, only applied to something other than himself). He can divert away attacks
    as powerful as a Tailed Beast Bomb from Kurama. *: A type of Jutsu that seals
    objects, living beings, chakra, along with a wide variety of other things within
    another object. **: A seal that invokes the power of the "death god". Once called
    upon, the death god hovers behind the user and wraps its left arm with prayer
    beads, which causes a seal to appear on it. The death god''s arm extends from
    their chest and grabs the soul of the target, immobilizing them, at which time
    the victim can see the death god as well. At the user''s command, the death god
    then performs the Sealing, consuming the souls of the user and the sealed, sentencing
    them to be locked in combat within its stomach for all eternity. ** The Sealing
    formula is carved into a human body or an object, and is mainly used when a giant
    enemy or evil spirit needs to be sealed. To use it, the user must have remarkable
    natural skills. **Contract Seal: When the user implements this technique on a
    summoner, it removes any direct control the summoner has over a summoned creature.
    *: A high-speed movement technique, accomplished by using chakra to temporarily
    vitalize the body and move in a short burst of enhanced speed. *Chakra Transfer
    Jutsu: Can transfer his chakra to other people, or people close to him. Jinchuriki
    Forms/'
