- id: claim-standard-equipment-13f47d42
  section: equipment
  axis: equipment
  text: "*Arm Weapons are generally the weakest of Vile's weapons, but their high\
    \ firing rate and low energy usage means they can deal a large amount of damage\
    \ over time. They are also the only weapons he can use while still clinging to\
    \ a wall: **frameless Vulcans: Vile's standard Arm Weapons. They are gatling guns\
    \ hidden within Vile's hands, firing bullets from his fingertips. While individually\
    \ weak, they have a high firing rate and boast great damage-per-second **frameless\
    \ Missiles: Launched from Vile's elbow, requiring him to detach an arm in order\
    \ to fire. They offer more power than Vulcans, but consume more energy **frameless\
    \ Rocket Punches: Vile's launches his fist as a projectile before it quickly returns\
    \ to him, similar to the Mega Arm. This type of weapon is powerful, but can only\
    \ be fired one at a time *Shoulder Weapons are of middling strength, and can be\
    \ aimed to fire at 0\xB0, 30\xB0, and 60\xB0. Because of this, they are best used\
    \ against airborne enemies. Furthermore, if used in the air they will cause Vile\
    \ to hover while firing, decreasing their firing time. This technique can also\
    \ be used to extend the horizontal distance of Vile's jumps. If used on a ladder\
    \ or wall, they put Vile into an aerial state: **frameless Cannons: Vile's standard\
    \ Shoulder Weapons. They fire spherical blasts of energy from the barrel **frameless\
    \ Lasers: Are larger streams of energy rather than condensed blasts. They are\
    \ similar to Cannons, but can pierce enemy shields **frameless Cutters: Are boomerang-like\
    \ energy blades launched from Vile's barrel *Leg Weapons are generally the most\
    \ powerful of Vile's weapons, but they cause Vile to stop while launching them,\
    \ leaving him open to attack. However, like Shoulder Weapons, if used in the air\
    \ they will cause Vile to hover while firing, decreasing their firing time. This\
    \ technique can also be used to extend the horizontal distance of Vile's jumps.\
    \ If used on a ladder or wall, they put Vile into an aerial state: **frameless\
    \ Napalms: Vile's standard Leg Weapons. They launch explosives that burst with\
    \ different effects **frameless Balls: Are spheres of energy who roll or bounce\
    \ along walls, or waves of fire that crawl along surfaces **frameless Flamethrowers:\
    \ Vile's most powerful weapons, they produces jets of flame from Vile's leg continuously\
    \ for several seconds thumb|center|500pxRide Armor: An massive mechanized suit\
    \ used by Vile and other Reploids. While piloting it, Vile is nearly indestructible\
    \ and can grab and destroy comparable foes with ease thumb|centerSub-Tank: An\
    \ recovery item able to restore Vile\u2019s health to full |}"
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
