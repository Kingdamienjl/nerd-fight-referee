- id: claim-weaknesses-bf85d704
  section: weaknesses
  axis: weakness
  text: "Use of the Curse Mark erodes the user\u2019s body until they eventually lose\
    \ themselves, binding them to OrochimaruNaruto Chapter 179. The second level makes\
    \ this erosion speed up dramaticallyNaruto Chapter 183 and it requires a greater\
    \ amount of chakra to sustain it. It also takes a serious toll on the user, leaving\
    \ them unable to move their body afterwardsNaruto Chapter 186. {| class=\"mw-collapsible\
    \ mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"\
    1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align: center; background-color:\
    \ #B0303A; color: #FFFFFF\" | Notable Attacks/Techniques |- | *Demonic Flute:\
    \ Illusionary Warriors Manipulating Melody: Tayuya plays her Demonic Flute in\
    \ order to control the three Doki. The tune she plays determines their overall\
    \ behaviour, as well as how each individual Doki moves, attacks, and works with\
    \ each other. In order to prevent opponents from analysing which tune produces\
    \ which action, Tayuya embeds the tunes within a complicated melody; to be able\
    \ to do this requires a good ear for music and skill with a flute. Although the\
    \ music itself can't be deciphered, careful study can allow opponents to read\
    \ Tayuya's finger configurations, giving them a way to predict what the Doki will\
    \ do. For instance, the tune played with Tayuya's right index and ring fingers\
    \ and left middle and pinky fingers causes the shirtless Doki to bend forward.\
    \ *Revolt of the Demon World: Tayuya plays a melody - her \"finale\" - with the\
    \ Demonic Flute, causing many-mouthed, worm-like spirits made of chakra to emerge\
    \ from the mouths of the Doki. The chakra of the spirits is almost entirely spiritual\
    \ energy, causing them to ravenously seek out physical energy in order to achieve\
    \ balance. Tayuya's melody directs the spirits at her targets, who they pursue\
    \ in so complicated a pattern as to resemble dancing. When the spirits pass through\
    \ the targets, they take bites of physical energy. Because of their immaterial\
    \ form, the spirits are impervious to direct attack. As such, the target's only\
    \ chance of stopping the spirits is to either prevent Tayuya from playing her\
    \ flute or to neutralise the Doki. *Demonic Flute: Phantom Sound Chains: This\
    \ genjutsu is performed with a flute. Because it is transmitted via sound, it\
    \ is effective against long ranges, working even on those whose location the user\
    \ does not know. Whoever hears the flute is subjected to an illusion of their\
    \ limbs being bound, preventing them from being able to move. They are also subjected\
    \ to morbid visions, weakening them mentally until they finally lose consciousness.\
    \ When Tayuya performs this with her Demonic Flute against Shikamaru Nara, Shikamaru\
    \ envisions himself on a barren landscape strewn with partial skeletons, his arms\
    \ and legs restrained by ropes suspended from the ceiling. In the manga, he is\
    \ forced to watch as his flesh seemingly melts from his bones;[2] in the anime,\
    \ it is the entire limb that melts, bone and all. |} ==Gallery== File:tayuya20001842.png\
    \ File:tayuya20040211_6.png File:tayuya20001671.png File:tayuya20030608.png ==Notable\
    \ Matchups== Victories: Losses: Tsunayoshi Sawada (Katekyo Hitman Reborn) Tsunayoshi\
    \ Sawada's Profile (Both were 8-A and speed was equalized. Both had prior knowledge\
    \ of each other and anything above 8-A was restricted) Inconclusive: ==References==\
    \ ==Notes/Explanations== Category:Characters Category:Female Characters Category:Naruto\
    \ Category:Chi Users Category:Summoners Category:Enhanced Senses Users Category:Sound\
    \ Users Category:Illusionists Category:Transformation Users Category:Statistics\
    \ Amplification Users Category:Chakram Users Category:Forcefield Users Category:Sealing\
    \ Users Category:Acrobats Category:Surface Scalers Category:Paralysis Users Category:Non-Physical\
    \ Interaction Users Category:Flute Users Category:Free Movement Users Category:Duplication\
    \ Users Category:Shapeshifters Category:Manga Characters Category:Anime Characters\
    \ Category:Energy UsersCategory:Extrasensory Perception Users Category:Weapon\
    \ Users"
