- id: claim-powers-and-abilities-08591772
  section: abilities
  axis: hax
  text: '*Oldwalker Abilities *Superhuman Physical Characteristics *Stealth Mastery
    (With the Spell Stealth Mission The Planeswalker can make something hard to block
    or detect.) *Invisibility (With the Spell Invisibility The Planeswalker can turn
    targets invisible.) *Camouflage (With the Spell Camouflage The Planeswalker can
    blend in with their surroundings.) *Weapon Mastery (With the Spells like Setessan
    Training & Archery Training The Planeswalker can give himself all kinds of weapon
    experience in an instant.) *Vehicular Mastery (The Planeswalker can summon all
    kinds of Vehicles and utilize them, from The Fleetwheel Cruiser to a literal Time
    Machine.) *Extrasensory Perception (With the Spell Sixth Sense they could enchant
    themselves, so they receive warnings about danger ahead of time.) *Telekinesis
    (With the Spell Telekinesis The Planeswalker can use Telekinesis. Oldwalkers seemed
    to have the ability to use Telekinesis with no spells requiredTime Streams- Artifacts
    Cylce 3; Chapter 14, Page 166) *Psychometry (With the Spell Track Down The Planeswalker
    can use magic to reveal things that have long disappeared.) *Forcefield Creation
    (With the Spell Forcefield The Planeswalker can create a Forcefield that negates
    almost all damage from a chosen target.) *Clairvoyance (With the Spell Future
    Sight The Planeswalker can see into the future.) *Precognition (With the Spell
    Precognitive Perception The Planeswalker can predict the future.) *Omniscience
    (With the Spell Omniscience The Planeswalker obtains Omniscience. Alongside that,
    with the Spell Enter The Infinite they can have every possible Idea & Spell possible.)
    *Limited Nonexistent Physiology & Acausality (Type 4, Nature Type; 1, Aspect Type;
    1, 2, 3 & 4: With the Spells Teferi''s Protection & Time and Tide The Planeswalker
    can phase out of Time & Existence entering a state of Nonexistence different from
    the Void/Nothingness/Emptiness of the Blind EternitiesTime Spiral - Time Spiral
    Cylce 1; Chapter 18, Page 206) *Protection (With the Spell Spectra Ward The Planeswalker
    can make it so the enchanted target has protection from everything.) *Invulnerability
    (With the Spell Indestructibility The Planeswalker can make it so enchanted target
    cannot be destroyed.) *Teleportation (With the Spell Telport The Planeswalker
    can teleport.) *Portal Creation (With the Spell Justiciar''s Portal The Planeswalker
    can create portals.) *BFR (With the Spell Temporal Machinations The Planeswalker
    can send a target to another time. With the Spell Journey to Nowhere The Planeswalker
    can send targets off to nowhere where they cannot return.) *Sealing (With the
    Spell Detention Vortex The Planeswalker can seal targets away in a vortex. While
    inside they cannot attack, block or utilize their abilities.) *Plane Manipulation
    & Creation (Oldwalkers could create their own Artificial Planes with each capable
    of being entirely different. Oldwalkers such as Urza could cause an entire Plane
    to collapseBloodlines - Artifacts Cylce 4; Chapter 25, Page 191Bloodlines - Artifacts
    Cylce 4; Chapter 2, Page 22) *Summoning (The Planeswalker is capable of summoning
    all kinds of Creatures, Artifacts, Enchantments and even other planeswalkers.)
    *Elemental Manipulation (The Planeswalker is capable of using all five types of
    colored Mana. Each one can represent an assortment of elements with minor examples
    like Blue being Time & Water and Red being Lightning & Fire.) *Fire Manipulation
    (With the Spell Obliterate The Planeswalker can obliterate almost anything with
    fire.) *Explosion Manipulation (With the Spell Erratic Explosion The Planeswalker
    can generate explosions.) *Electricity Manipulation (With the Spell Lightning
    Bolt The Planeswalker can summon lightning.) *Plasma Manipulation (With the Spell
    Chain of Plasma The Planeswalker can attack uisng plasma.) *Water Manipulation
    (With the Spell Hydroblast The Planeswalker can manipulate water to counter fire
    and destroy it.) *Acid Manipulation (With the Spell Stream of Acid The Planeswalker
    can generate acid.) *Ice Manipulation (With the Spell Encase in Ice The Planeswalker
    can control ice to freeze their targets.) *Air Manipulation (With the Spell Plague
    Wind The Planeswalker can manipulate the wind to destroy their enemies and stop
    them from regenerating.) *Sound Manipulation (With the Spell Warping Wail The
    Planeswalker can empower their voice with special abilities.) *Smoke Manipulation
    (With the Spell Smoke The Planeswalker can create smoke to hinder their enemies.)
    *Weather Manipulation (With the Spell Lightning Storm The Planeswalker can create
    a thunder storm. With the Spell Snowfall The Planeswalker can create a snow storm.)
    *Earth Manipulation (With the Spell Reshape the Earth The Planeswalker can control
    the earth.) *Metal Manipulation (With the Spell Metal Fatigue The Planeswalker
    can cripple metal.) *Breath Attack (With the Spell Frost Breath, Dragon Breath
    & Venomous Breath The Planeswalker can utilize breath attacks.) *Thread Manipulation
    & Body Puppetr'
