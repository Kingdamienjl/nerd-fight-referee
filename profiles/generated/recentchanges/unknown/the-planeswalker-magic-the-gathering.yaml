    \ Mma-14-ethersworn-canonist.jpg|Ethersworn Canonist Mps-20-painter-s-servant.jpg|Painter's\
    \ Servant Td2-1-platinum-angel.jpg|Platinum Angel C18-223-soul-of-new-phyrexia.jpg|Soul\
    \ of New Phyrexia Mm2-230-spellskite.jpg|Spellskite Cm2-231-wurmcoil-engine.jpg|Wurmcoil\
    \ Engine *Blightsteel Colossus: Blightsteel Colossus is a powerful creature whose\
    \ Trample ability causes any excess damage dealt to a creature to be inflicted\
    \ towards the opponent. Infect makes any damage afflict wounds that cannot be\
    \ healed as well as a permanent debuff that lowers the targets max durability\
    \ and attack power equivalent to the damage dealt. Also, if the target takes too\
    \ much Infect damage, they instantly die. Since Blightsteel Colossus possess 11\
    \ power and the Infect triggers at 10, taking a full hit would result in a one\
    \ hit kill. Blightsteel Colossus is indestructible, rendering it invulnerable\
