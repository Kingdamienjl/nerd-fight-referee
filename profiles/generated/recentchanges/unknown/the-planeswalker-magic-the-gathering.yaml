    \ Cage: Creatures can no longer enter the battlefield from the graveyard, nullifying\
    \ resurrection and reincarnation. Players can no longer use the powers of the\
    \ dead. *Phyrexian Altar: Sacrificing a creature to the altar grants The Planeswalker\
    \ more mana. They can synergize this with self-replenishing creatures to create\
    \ endless amounts of mana. *Icy Manipulator: Tap target artifact, creature, or\
    \ land. *Isochron Scepter: When Isochron Scepter enters the battlefield, The Planeswalker\
    \ may exile an instant card with converted mana cost 2 or less from your hand.\
    \ The Planeswalker may copy exiled card. They may cast the copy without paying\
    \ the mana cost. *Mindslaver: Sacrifice Mindslaver: Gain control of target player\
    \ during that player's next turn. *Mirage Mirror: Mirage Mirror becomes a copy\
    \ of target artifact, creature, enchantment, or land until end of turn. *Panharmonicon:\
    \ If an artifact or creature entering the battlefield causes a triggered ability\
    \ of a permanent you control to trigger, that ability triggers an additional time.\
    \ *Ring of Three Wishes: Grants the user a wish of their choice. Can only be used\
