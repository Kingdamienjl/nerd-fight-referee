- id: claim-weaknesses-7d7615f3
  section: weaknesses
  axis: weakness
  text: 'Is quite naive Notable Attacks/Techniques: * Angel''s Hand: Cinnamon uses
    a pair of gloves (starting weapon) to slap opponents twice. Archangel and Divine
    Hand are stronger versions of this weapon. * Metal Boxer: Cinnamon uses boxing
    gloves to attack enemies with two powerful punches. Full Metal Boxer is a stronger
    version of this weapon which boosts Cinnamon''s critical hit chance and evasion.
    * Injector: Two injection-shaped arms that Cinnamon uses to attack with Injected
    Poison, being able to cause "virus status" (making a target lose their health).
    * Drill Arm: Two arms with drills on them that Cinnamon can use to reduce an target''s
    armor/defense with Armor Peeler. * Melting Arm: Cinnamon attacks with Barrier
    Smasher (despite having the same appearance of Drill Arm), reducing the target''s
    shield/special defense upon a hit. * Head Hammer: Two hammer arms that may cause
    an opponent behave uncontrollably and randomly attack their allies upon a successful
    hit with the attack Brain Shaker. * 0 Effecter: An arm with a green sphere which
    allows Cinnamon to nullify an target''s assist effects with Eraser Hand. * Kitty
    Gloves: Cinnamon uses large kitty-shaped gloves (her strongest weapon) to attack
    with Deadly Scratch (a 5-hit combo), each hit being able to reduce the abilities
    of a target. * Angelic Aide: Cinnamon''s Action Trigger, which allows her to build
    up to 10 hearts, able to heal herself and her teammates by 10% per one heart or
    back to full health at any time if she gets all hearts. * Iron Maiden: Cinnamon''s
    Hyper Mode, which transforms her into a slightly more sinister-looking form, increasing
    both her power and LE at 50% boost for 4 turns. Her active teammates also get
    an added 25% to their Weapon Energy gain rate. Feats: Respect thread ==Notable
    Matchups== Victories: Losses: Inconclusive: Category:Characters Category:Mega
    Man Category:Game Characters Category:Video Game Characters Category:Female Characters
    Category:Heroes Category:Good Characters Category:Protagonists Category:Playable
    Characters Category:Robots Category:Androids Category:Reploids Category:Nurses
    Category:Maids Category:Drill Users Category:Hammer Users Category:Inorganic Beings
    Category:Self-Sustenance Users Category:Martial Artists Category:Weapon Masters
    Category:Weapon Users Category:Thrown Weapon Users Category:Syringe Users Category:Parasol
    Users Category:Claw Users Category:Transformation Users Category:Statistics Amplification
    Users Category:Flight Users Category:Healers Category:Status Effect Users Category:Empathic
    Manipulation Users Category:Statistics Reduction Users Category:Damage Reduction
    Users Category:Homing Attack Users Category:Forcefield Users Category:Poison Users
    Category:Life Users Category:Absorption Users Category:Power Nullification Users
    Category:Enhanced Senses Users Category:Summoners Category:Aura Users'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-b674b55e
  section: abilities
  axis: hax
  text: '*Reploid Physiology (General) *Martial Arts *Weapon Mastery *Transformation,
    Statistics Amplification & Aura (Via Iron Maiden Hyper Mode. Can use her Angel
    Aura ability to increase her allies'' attack damage, even increasing their movement
    speed via it''s Speed Enhancement chip. Can also increase her speed and range
    via Positioning System skill) *Homing Attack (The Positioning System skill allows
    her attacks to have a tracking effect) *Flight (Can rapidly flap her hair to float
    mid-air) *Healing *Status Effect Inducement & Empathic Manipulation (Can cause
    an opponent behave uncontrollably and attack their allies via Head Hammer) *Statistics
    Reduction (Can reduce her enemies'' shield/armor via Drill Arm/Melting Arm and
    even lower their abilities via Kitty Gloves. Can weaken the enemy''s attack damage
    by throwing a Syringe and even reduce their movement speed via it''s Interference
    chip in Mega Man X Dive) *Damage Reduction (Can increase the duration of reduced
    damage by 25% via her Persistent Virus skill. While using Angel Aura, her allies
    can consume a Heart to reduce their damage taken. Can reduce her damage taken
    by 15% when having five Hearts via Enchantment of Love skill) *Forcefield Creation
    (Can gain a shield around herself when casting Angel Aura with Three Hearts via
    Protective Shield skill) *Poison Manipulation and Absorption (Life;Can inject
    an enemy with a virus to lose their health via Injector) *Power Nullification
    (Can nullify an enemy''s positive effects via 0 Effecter) *Enhanced Senses (Can
    allegedly sense the good within people and Reploids'' hearts) *Summoning (Can
    summon hearts via Angelic Aide) *Resistance to: **Reploid Physiology (General)
    **Cosmic Radiation'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
