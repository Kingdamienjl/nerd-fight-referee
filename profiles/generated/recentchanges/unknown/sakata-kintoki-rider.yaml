- id: claim-weaknesses-b123738c
  section: weaknesses
  axis: weakness
  text: 'Cannot fight in Spirit Form. He is still haunted by his decision to kill
    Shuten-douji and Ibaraki-douji through underhanded means in life. Notable Attacks/Techniques:
    ===Noble Phantasm=== GoldenDrive.png|Golden Drive GoldenDrive_GoodNight.gif|Golden
    Drive - Good Night: Night Wolf Deadly Nine - Golden Dash *Golden Drive: Kintoki''s
    cherished mount. Known also as the Golden Bear Mk. 1, it is a large motorcycle
    imbued with the thunder god''s power that is bound to him when he is summoned
    as a Rider. It has the power to transform itself by its very nature, most particularly
    when releasing its True Name to ram his enemies with. Its tires are the transformed
    drums of the thunder god, once used originally to calm Minamoto no Raikou when
    she was suffering from nightmares in life but have now become part of Kintoki''s
    mount. ** Golden Drive - Good Night: Night Wolf Deadly Nine - Golden Dash: Kintoki''s
    Noble Phantasm when releasing its True Name transforms his trusty mount, the motorcycle
    Golden Bear, into its high-speed charging configuration form designed to ram straight
    into his opponent. As he rides on to ram down his enemies, the tires power rise
    with every turn as Kintoki travels farther and farther, causing lightning to rise
    up from the ground and engulf the area he drives on and reach hundreds of times
    the bikes normal maximum speed. ===Class Skills=== * Riding: The ability to ride
    mounts. Due to Kintoki''s ambiguous classification as a Rider and possession of
    a Rider Belt, his rank in this skill is void and, with it, the skill to ride other
    mounts. But he still has no issues handling Golden Bear. ===Personal Skills===
    * Animal Dialogue: The ability to converse with animals who don''t speak a "language
    of words". Kintoki possesses a C-Rank in this skill, preventing him from conveying
    very complex nuances. But since his mental structure is much like an animal, he
    can reach a mutual understanding with them. * Divinity: The measure of one''s
    Divine Spirit aptitude, reflected in high ranks by the user becoming part Divine
    Spirit. At A-rank, it is even an indicator as one who has reached the Throne of
    Gods. Additionally, it possesses another effect that allows one to reduce "Anti-Purge
    defense" in proportion to the rank of their Divinity, allowing them to break through
    defensive abilities such as Protection of the Faith and Saver''s Enlightenment
    of the Sacred Fig. While it would normally be of a low rank of D, Kintoki''s class
    as a Rider emphasizes his heritage as a son of a thunder god, resulting in a higher
    rank of C. * Natural Body: The possession of a perfect body from the day of one''s
    birth. Because of Kintoki''s A Rank in this skill, his Strength always gets a
    rank up, his body will be naturally brawny, and his body shape will never change
    no matter how many calories he consumes. * Thousand Mile Sprint: A skill acquired
    upon being with his beloved mount. It bestows Kintoki an inexhaustible amount
    of stamina even if he were to perform long-distance movement after a long time
    and demonstrates the effect of increasing his agility and, when performing a full
    sprint, an increase to his strength and durability and can even increase his Noble
    Phantasms power when its True Name is released. ==Notable Matchups== Victories:
    Losses: Inconclusive: Category:Characters Category:Nasuverse Category:Fate Category:Servants
    (Nasuverse) Category:Martial Artists Category:Animal Users Category:Summoners
    Category:Male Characters Category:Invisibility Users Category:Intangibility Users
    Category:Good Characters Category:Game Characters Category:Playable Characters
    Category:Bikers Category:Heroes Category:Warriors Category:Demigods Category:Electricity
    Users Category:Statistics Amplification Users Category:Regeneration Users Category:Spirits
    Category:Summons Category:Soul Users Category:Possession Users Category:Vehicular
    Masters'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
