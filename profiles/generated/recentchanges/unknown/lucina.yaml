- id: claim-powers-and-abilities-2bfaa905
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Weapon Mastery, Magic and Durability\
    \ Negation (Primarily utilize a sword befitting a master swordsman in combat,\
    \ with her Tiki Support stating that she is knowledgeable in fencing, but as a\
    \ playable character, she has acquired mastery over different variety of weapons\
    \ during the course of her adventure such as lances, axes, staves, tomes, and\
    \ bows. Magic completely bypassesFire Emblem Engage - Chapter 4: \"A Land in Bloom.\"\
    \ Nintendo, 2023 physical defenses such as armor,Fire Emblem: The Sacred Stones\
    \ - Chapter 4: \"Ancient Horrors\" or thick hidesFire Emblem: The Sacred Stones\
    \ - Lute/Kyle Support) *Martial Arts (In her Brady Support, it is shown that Lucina\
    \ is knowledgeable in grapples and submission holds) *Acrobatics (Can jump high\
    \ in the air and perform multiple flips whilst mid-air. Throws her sword into\
    \ the air, flips backwards to catch it, then kills an assassin by striking him\
    \ in the back) *Enhanced Senses and Extrasensory Perception (Able to sense an\
    \ assassin hiding in the bushes. Comparable to characters from Fire Emblem: Awakening,\
    \ and Fire Emblem: Fates, who can fight against invisible Vallite Soldiers by\
    \ sensing their presence) *Non-Physical Interaction (Comparable to characters\
    \ from Fire Emblem: Shadows of Valentia, who can harm Specters) *Accelerated Development\
    \ (Training and Leveling; Abilities and Weapon Experience; Has Naga Holy Blood,\
    \ which allows her to learn Light Magic at a faster rate) *Damage Boost (Via Critical\
    \ Hits, which deal triple damage to the enemy. Via Parallel Falchion, which deals\
    \ bonus damage to dragon units, even Grima who is unaffected by other dragon-effective\
    \ weapons, tripling the damage to the enemy. Via Rapier, which deals bonus damage\
    \ to beast and armored units, tripling the damage) *Healing, Durability Negation\
    \ and Resistance Negation (Via Parallel Falchion, which can be used to heal the\
    \ user. Via Aether, which heals the user on the first strike based on the damage\
    \ inflicted and ignore half of the enemy's defense and resistance on the second\
    \ strike. Healing in Fire Emblem is showcased to be capable of mending a stab\
    \ wound in the torso) *Empowerment (Via Weapon Triangle, weapon users with the\
    \ advantage may attack with increased battle accuracy and damage output; conversely,\
    \ users with the disadvantage may suffer from decreased battle accuracy and damage\
    \ output. In Awakening, sword users have an advantage over axe users, axe users\
    \ over lance users, and lance users over sword users) *Statistics Amplification\
    \ (Via Charm) *Probability Manipulation (Via Dual Strike+ and Rightful King) Resistance\
    \ to: *Magic (Via the resistance to magic stat directly stated to exist like here)\
    \ *Unconventional Resistance to Soul Manipulation (Characters in Fire Emblem can\
    \ consistently survive without their souls, albeit while being reduced to a husk\
    \ personality wise) Statistics Amplification (Can increase the stats of herself\
    \ and others through various skills), Accelerated Development (Can increase the\
    \ rate of experience she gains in battle, both herself and weapon skill, via Veteran\
    \ and Discipline respectively), Stealth Mastery (Via Pass and Locktouch), Acrobatics\
    \ (Via Acrobat and Movement-increasing skills), Death Manipulation (Via Lethality),\
    \ Empowerment (Has access to skills that is effective or can only be used under\
    \ certain circumstances, such as being damaged to a certain point, if Lucina or\
    \ an enemy initiate the battle, if Lucina is battling on an indoor or outdoor\
    \ map, etc.), Regeneration, Healing (Low-Mid; Has access to skills that allow\
    \ her to heal herself, either passively or through harming an enemy. Even has\
    \ access to a skill that increase the amount of healing she can perform to allies.\
    \ Healing in Fire Emblem is showcased to be capable of mending a stab wound in\
    \ the torso), Pseudo-precogniton (Has skills that increase her rate of evasion\
    \ against an attack, even more so if it is a specific type of weapon), Statistics\
    \ Reduction (Has access to skills that reduces the chances of an enemy dodging\
    \ her attacks as well as making more likely for her to land a critical hit), Damage\
    \ Boost (Via Ignis), Stamina Manipulation (Via Galeforce), Damage Reduction (Via\
    \ Pavise and Aegis), Supernatural Luck (Via Miracle), Flight (Via winged mounts),\
    \ Durability Negation and Resistance Negation (Via Luna), Probability Manipulation\
    \ (Has skills that increases the probability of certain actions happening, like\
    \ landing attacks, the possibility of inflicting critical hits, the chance of\
    \ her weapon\u2019s durability not decreasing, etc.), Minor Resistance to Magic\
    \ (Via Resistance +2) Optional Equipment(s)= Statistics Amplification, Weapon\
    \ Mastery and Resistance to Magic (Access to various of items, weapons and additional\
    \ skills that can be used to increase Lucina's statistics, including her resistance\
    \ to magical attacks and weapon mastery), Blessed (While using certain items,\
    \ Lucina is granted access to different skills, like Underdog, etc.), Healing,\
    \ Minor Matter Manipulation"
  source_ids: *id002
  decisive: true
  status: unverified
