  intelligence:
    text: "Gifted (Her father taught her how to use a sword when she was a little\
      \ child, and over the course of a decade or so, she has perfected her skills\
      \ against numerous opponents who are physically much stronger and durable than\
      \ the typical soldier and even herself and lack any sort of sensations given\
      \ they can rotate their head a full 180 degrees\u2014the Risens\u2014to the\
      \ point that she can compete in single combat with her father from the past.\
      \ In her Kjelle Support, she is stated to be more than capable of challenging\
      \ and even besting Kjelle, who is skilled enough to challenge everyone, with\
      \ the exception of Chrom, whom Kjelle cannot see beating in single combat, in\
      \ the Shepherds to sparring matches and defeat them all without anyone landing\
      \ a single blow. Furthermore, when Lucina is dead serious, Kjelle admits that\
      \ she knows better than to challenge Lucina at that point. In Chapter 22, she\
      \ could face the Deadlords, a group of 12 fallen warriors from various continents\
      \ who are considered formidable fighters in life and even more so in death,\
      \ and is led by Aversa, who is capable of making the usual mindless and wild\
      \ Risens practice simple tactics in cooperation with each other. Since the death\
      \ of her father and the Shepherd and the near destruction of her world by Grima,\
      \ where no area of the world is safe for humans and the Risens, who are capable\
      \ of turning those that they wounded into Risens, prowl the land as masters\
      \ of all, Lucina has managed to survive since childhood with the other children\
      \ of the Shepherds while leading the last of Ylisstol's citizens in their battle\
      \ against Grima's forces. Everyone was instructed in the future to never consider\
      \ the past lives of their adversaries because doing so makes it simpler for\
      \ them to combat the Risens, who are made up of former friends, neighbors, family\
      \ members, etc.)"
    source_ids:
    - mediawiki-2103869
    confidence: 0.6
