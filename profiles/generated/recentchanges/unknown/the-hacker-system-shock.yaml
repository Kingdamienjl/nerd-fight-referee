    text: Genius (Very likely the most skilled Hacker on planet Earth. TriOptimum's
      computer techs and AI specialists were unable to hack into SHODAN's AI in the
      way he was. Edward Diego believed he was the only person who would be able to
      alter SHODAN's ethical restraints. Effectively pulled off the impossible in
      his invasion and dismantling of SHODAN's access to Citadel Station. Was able
      to defeat her in Cyberspace despite her creating a Mutagenetic Virus, setting
      up to fire the Tachyon Mining laser at Earth, downloading herself into Earths
      computer systems and developing a new and more virulent Mutagenetic strain with
      limited help in a single day)
