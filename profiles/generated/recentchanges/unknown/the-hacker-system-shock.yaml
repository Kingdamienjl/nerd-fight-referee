- id: claim-standard-equipment-60c81818
  section: equipment
  axis: equipment
  text: 'AM-27 Flechette: center|thumb Favored among TriOptimum security officers
    in the 2070''s, this 6mm sub-machine gun fires needle-like ammunition. While the
    increased magazine size and automatic fire are welcome upgrades from the Dart
    Pistol, the damage output is actually less until you get your hands on Splinter
    rounds. Thankfully the AM-27 has significant armor-piercing capability which offsets
    the decreased damage when facing robotic threats. It is also an effective weapon
    against mutants as many of them take double damage from needles and automatic
    fire makes deflecting their projectiles easy. DC-05 Riot Gun: center|thumb For
    riot situations, this gun provides maximum knock-back with minimal damage (recommended
    for neutralizing less-dangerous targets). The Riot Gun deals exceptionally low
    damage, making it a poor choice for most combat scenarios. It''s capable of pushing
    various entities around, and is usually used to relocate live land mines or to
    push enemies into them. ML-41 Minipistol: center|200px|thumb Designed primarily
    as a defensive weapon, it is standard issue for TriOptimum executives. SV-23 Dartpistol:
    center|250px|thumb Provides excellent control of laboratory animals, delivering
    an explosive bite or a paralyzing neurotoxin. Magnum 2100: center|250px|thumb
    Standard issue for TriOptimum Security officers, the 2100 is the preferred offensive
    tool in confined spaces. While its stock fire mode delivers high damage, the 2100''s
    laser sight attachment utilizes a smart sensor to seek out and exploit a target''s
    weak point, but the calibration damage is lost if the operator loses the target.
    Sk-27 Shotgun: center|250px|thumb The SK-27 is a pump-action shotgun that uses
    a pistol grip for easier maneuverability in close-quarter environments. It is
    able to deal devastating damage to light-armored foes who are foolish enough to
    come into close range MARK III Assault Rifle: center|250px|thumb The Mark III
    Assault Rifle is based on the 2064 Interlocutor KR-5, but replaces full-auto for
    a three-round burst option to conserve ammo. The rounds it fires can cut into
    tougher organic and robotic opponents making the Mark III the best all-around
    rifle. MK-84 Accelerator Railgun: center|250px|thumb The MK-84 launches specially
    designed metal projectiles at high velocity, making it capable of penetrating
    heavy armor. Unfortunately, the high currents required to produce sufficient muzzle
    velocity results in a large charging time between each shot. SSR Skorpion: center|250px|thumb
    The KF-18 is a lightweight fully automatic 9mm submachine gun that is designed
    to quickly dispatch light-armored targets. Its ease of use makes it the weapon
    of choice in the TriOptimum Security arsenal, but care must be take in conserving
    ammo due to its fast rate of fire DG-04 Laser Rapier: center|250px|thumb The DG-04
    utilizes a monofilament thread suspended in a contained energy field. The thread
    slices through organic and synthetic materials, permanently disabling them. The
    rapier is typically carried by senior security officers and military commanders.
    DH-07 Stun Gun: center|250px|thumb This gun throws a weak plasma projectile at
    a target, discharging an arc that registers 10 kV to stun living creatures and
    damage cyborgs. TB-05 Sparqbeam Sidearm: center|250px|thumb Standard issue energy
    weapon. Fires a blast of energy that can be altered in power. Higher power settings
    cause the weapon to over-heat for longer periods. ER-90 Laser Blaster: center|250px|thumb
    This new laser weapon fires a pulse of high-energy ultraviolet light. The built-in
    liquid nitrogen cooling system allows for high-intensity damage. JW-76 Mag-Pulse
    Rifle: center|300px|thumb The electromagnetic bursts from the JW-76 are designed
    to penetrate shielding and disrupt even the most heavily armored of robots. The
    electricity it produces can be deadly to organic targets, but it is not recommended
    for this purpose. The user can pump the weapon a second time and draw energy from
    their power source to fuse the two rounds and create a larger electromagnetic
    field. Ion Riffle: center|300px|thumb Prototypes of this advanced energy beam
    gun evolved from late-model beam sidearms. It delivers a powerful stream of ionic
    particles with more force than normal Blaster guns. LG-XX Plasma Rifle: center|250px|thumb
    The LG-XX is an experimental energy weapon that fires spheres of charged plasma
    in a self-contained magnetic field. The charged plasma has a propensity for bouncing
    off bulkhead walls, so special care should be taken when using it in enclosed
    spaces. EM-83 Grenade Launcher: center|250pxthumb The EM-83 uses compressed gas
    charges to turn any grenade into a high-velocity projectile that detonates on
    impact. This includes fragmentation, electromagnetic, and gas grenades Frag Grenade:
    center|150px|thumb Once thrown, the Frag Grenade will explode after a few seconds,
    scattering shrapnel around the area. Emp Grenade: center|150px|thumb Discharges
    an electro magnetic pulse that disables r'
