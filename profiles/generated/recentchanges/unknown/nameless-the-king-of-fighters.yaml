- id: claim-powers-and-abilities-e2d5f733
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts *Acrobatics **Hypermobility:
    Can perform somersaults, rolling forward and backward, and all other acrobatic
    maneuvers with their respective moves. **Self-Momentum: Capable of leaping high
    into the air, propelling themselves forward or into the air, changing their trajectory
    mid-air, and performing multiple flips to adjust their landing or transition into
    an attack. They can also recover mid-air after being hit. *Statistics Amplification
    (Strength; Can enter the Max Mode state that boosts their strength and use powered-up
    versions of their attacks within a time limit) **Aura (Entering either Max Mode
    wraps the fighter in a blue or red energy) *Damage Boost (KOF fighters can charge
    energy to unleash a super version of their special attacks and a ultimate version
    of the super attacks) *Status Effect Inducement (KOF fighters can stun and temporarily
    render their opponents defenseless by striking them consecutively. They can also
    achieve a similar result through Guard Crush) *Afterimage Creation (Can leave
    afterimages with their speed) *Enhanced Senses & Extrasensory Perception **Detection:
    Can detect murderous intent and malevolent aurasThe King of Fighters ''95 Team
    Stories; Psycho Soldier TeamTHE KING OF FIGHTERS ''99 DRAMA CDThe King of Fighters
    XIII Pre-Battle Dialogues; Mr. Karate Vs. Takuma SakazakiThe King of Fighters
    XIV Pre-Battle Dialogues; Hein Vs. K''. Can also sense an opponent''s feeling,
    mental state, and hidden intent through combat or mere presenceThe King of Fighters
    XIII Win Quotes; Leona Heidern''s Win Quote against Takuma SakazakiThe King of
    Fighters XIII Pre-Battle Dialogues; Leona Heidern Vs. NESTS KyoThe King of Fighters
    XIII Pre-Battle Dialogues; Clark Still Vs. Goro Daimon. **Awareness: Can sense
    hidden presences from a distanceThe King of Fighters ''97 Team Stories; Art of
    Fighting TeamThe King of Fighters 2001 Team Stories; Japan TeamThe King of Fighters
    2003; Hero Team Ending. **Power Reading: Can determine their opponent''s strength
    by sensing their auraThe King of Fighters XIII Pre-Battle Dialogues; Mr. Karate
    Vs. Robert GarciaThe King of Fighters XIII Pre-Battle Dialogues; Mr. Karate Vs.
    Awakened SaikiThe King of Fighters XIII Pre-Battle Dialogues; Mr. Karate Vs. Elisabeth
    Blanctorche. Can potentially gauge the power and threat level of enemies'' strength
    before even physically seeing themThe King of Fighters 2003 Team Stories; K''
    TeamThe King of Fighters XV Team Stories; Orochi Team. *Non-Physical Interaction
    (Soul-Based; Can harm and interact with souls. Iori was confident in killing Mature
    and Vice, who exist as formless ghosts post-mortem, even without his powerThe
    King of Fighters XIII Team Stories; Yagami TeamThe King of Fighters XIV Team Stories;
    Yagami Team)'
