    to life), Fire Manipulation, Explosion Manipulation (His attacks can create fiery
    explosions), Berserk Mode (Can't stand his clients and attacks them), Status Effect
    Inducement, Statistics Reduction, Adhesive Manipulation (With his "Sticky Syrup
    Mixer" Gadget,can leaves sticky concoction around him and slows down when his
    enemies stand on it), Healing (Can earn 400 health points for attacking him enemies
    with "Medical Use" Star Power,can their health scores by 500 points per second
    by throwing healing potions with the "Herbal Tonic" Gadget to their teammates
    or can raise his health in a few seconds during the battle), Statistics Amplification
    (Hypercharge when activated, will increase Brawler speed and damage and gives
    them a shield that blocks a percentage of incoming damage for a short duration.
    Can do +200 more damage to him enemies, with "Extra Noxious" Star Power), Aura
    (Hypercharge will have the Brawler receive an aura of purple flames signifying
    their Hypercharged state), Passive Healing and possibly Regeneration (High-Low.
    Brawlers will passively heal damage that doesn't kill them), Damage Reduction
    (With Shield Gear), Enhanced Senses (With Vision Gear, which allows him to see
    targets in bushes for some time after hitting them), Damage Boost (Deals more
    damage with Damage Gear if they are at low health), Extrasensory Perception (Can
    see whether or not others are feeling happy)
  source_ids: *id002
