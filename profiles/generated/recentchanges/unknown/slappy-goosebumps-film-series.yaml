  attack_potency:
    text: Street level (Can easily kill the player through varying means, including
      but not limited to; strangulation, tearing his head off, beating, and suffocating
      him by shoving his fist down his mouth), likely Wall level normally (Comparable
      to the other monsters like Officer Murphy, The Beast from the East, and The
      Werewolf of Fever Swamp), higher via monster population (The more monsters that
      exist, the stronger Slappy becomes). Varies with summons, from Human level (Most
      monsters normally have a human build) to Building level (The Giant Praying Mantis
      unintentionally demolished a building). His magic can bypass conventional durability.
    source_ids:
    - vsbattles-slappy-goosebumps-film-series-unknown
    confidence: 0.6
  speed:
    text: Superhuman, possibly higher (Can easily outpace and kill the main character
      who can travel across a mall within seconds and escape a swarm of teleporting
      gnomes, and can not only move at speeds considered impossible by the protagonist,
      but move and attack speeds that it feels like the protagonist is being hit from
      every direction)
    source_ids:
    - vsbattles-slappy-goosebumps-film-series-unknown
    confidence: 0.6
