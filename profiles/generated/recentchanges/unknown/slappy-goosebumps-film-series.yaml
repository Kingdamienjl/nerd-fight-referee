    source_ids:
    - vsbattles-slappy-goosebumps-film-series-unknown
    confidence: 0.6
  range:
    text: Below Standard Melee Range physically, Several Meters with powers, higher
      when empowered by electricity (At best planetary)
    source_ids:
    - vsbattles-slappy-goosebumps-film-series-unknown
    confidence: 0.6
  intelligence:
    text: At least Above Average, likely Gifted (Was able to almost successfully destroy
      Madison, Delaware and command all of the Goosebumps monsters. Hijacked Sonny
      Quinn's miniature replica of Nikola Tesla's tower. Able to operate Nikola Tesla's
      Tower by himself. Skilled in Algebra. Can outsmart the player, who managed to
      complete several other tasks involving other Goosebumps monsters. Such as defeating
      The Beast from the Beast, solving Cronby's riddle, tricked Aunt Dahlia into
      drinking her own prune juice, weaponized the gargoyle's saliva to use it to
      turn Monster Blood into stone to keep a trap room from closing in on him, distracting
      Officer Murphy by making a mannequin look like a previous shoplifter, etc.)
    source_ids:
    - vsbattles-slappy-goosebumps-film-series-unknown
    confidence: 0.6
