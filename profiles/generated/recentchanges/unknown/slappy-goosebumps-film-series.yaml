- id: claim-powers-and-abilities-99ad264f
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics * Inorganic Physiology (Type 1) * Self-Sustenance
    (Types 1, 2 and 3) * Regeneration (Low-High) * Immortality (Types 3 and 4), and
    limited Immersion * Enhanced Senses (Heard Sarah call him a dummy while she was
    in a moving car and being a considerable distance away) * Stealth Mastery * Telekinesis
    (Shows this several times in the films. Being able to, but not limited to; pulling
    someones pants down, unscrewing the screws of a ladder, pull up several switches,
    and fold laundry) * Teleportation * Small Size (Type 0) * Magic * Life Manipulation
    with chant (His chant can not only bring himself back to life, but give life to
    inanimate objects) * Corruption (Type 2; Turned a woman into a human dummy hybrid)
    * Immortality (Types 4; Other versions of Slappy from other manuscripts can be
    take his place) * Self-Resurrection Technology Manipulation (Can make lights flicker)
    * Preparation (Given time, he can create a manuscript to use to seal others away)
    * Sealing and Summoning with manuscripts (With his manuscripts he can summon various
    monsters from the Goosebumps franchise) * Power Bestowal (While bringing various
    inanimate objects to life with his magic, they gained new properties. Such as
    jack-o-lanterns given the ability to fly) * possibly Clairvoyance (Learned Sarah
    Quinn''s locker combination without watching her put in her locker combination)
    * Body Control (Can still talk while having his mouth closed. Can roll his eyes
    into the back of his head. Can full rotate his head. etc) * Immersion (Can escape
    into the real world), Berserk Mode, Electricity Manipulation and Empowerment (Can
    fuse his magic with electricity, enhancing it in the process. An example of this
    is when he merged his magic with the electricity of Nikola Tesla''s Tower), Blessed
    (Was written by R.L. Stine to always survive) * Illusion Creation (As seen here)
    * Plot Manipulation via Breaking the Fourth Wall (Took over and override R.L.
    Stine''s introduction in the Goosebumps novel) * Empowerment (The more monsters
    that exist, the stronger Slappy becomes) * Weather Manipulation (Can create thunder
    and lightning strikes as a byproduct of him using his powers) Resistance to: *
    Electricity (Withstood the electricity of Nikola Tesla''s Tower at max power,
    which can emit electricity all around the world) * Sealing (Was still capable
    of interacting with the real world despite being sealed away in his manuscript)
    * Fear Manipulation (The Haunted Mask has no affect on Slappy if used on him,
    meanwhile with other monsters such as The Beast from The East they were effected
    by the mask''s fear inducing effects)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
