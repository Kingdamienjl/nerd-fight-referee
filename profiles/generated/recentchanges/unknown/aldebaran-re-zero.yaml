- id: claim-weaknesses-73da72e9
  section: weaknesses
  axis: weakness
  text: "Aldebaran's Domain must be set up manually, and it has a specific radius\
    \ in which time can be reset, meaning that if Al leaves this Domain he will have\
    \ to define his Domain once again or risk dying without any second-chances\u2014\
    \ the exception being Aggressor of the Domain, which activates even if Al willingly\
    \ unravels the Domain. If Al updates his Matrix at a poor time he could trap himself\
    \ in a softlock where he dies repeatedly forever. Al's Authority only turns back\
    \ time upon his death, meaning he could be incapacitated without having a chance\
    \ to die. The Authority causes some degree of mental damage, which can threaten\
    \ the stability of his Domain, but he mitigates this with repeated suicides to\
    \ rest his mind with unlimited time. Notable Attacks/Techniques: : Aldebaran possesses\
    \ an unenumerated Authority linked to a Witch Factor, despite possessing no Witch\
    \ Factor of his own, which allows him to create an imperceptible Domain with a\
    \ Matrix, within which a target can be placed inside of a time-loop. His Domain\
    \ has two different variations, based on the which side is given initiative within\
    \ the Domain: Victim or Aggressor. *: This is the side of Al's Authority where\
    \ he, as the Victim, receives initiative. Time will be reset back to a pre-defined\
    \ point in the Matrix upon Al's death. It is also possible that Al can set other\
    \ conditions for the Matrix updating. By allowing Al to challenge a situation\
    \ as many times as he desires, he can learn everything about the short loop such\
    \ as the opponent's fighting style, how they respond to different actions or words,\
    \ and exploit all of this information, while to everyone else it appears as though\
    \ Al has some sort of precognition or flawless combat abilities. It is this Authority\
    \ that makes him seemingly invincible, for if the chance nearing \"zero\" can\
    \ be made into \"one\", Aldebaran has the means of turning that \"one\" into the\
    \ very first \"one\" after accreting deaths innumerable. This requires an inhuman\
    \ level of mental fortitude as not only is death agonizing, but even loops a few\
    \ tens of seconds long can last days or even years if repeated enough. *: A bug\
    \ of Al's Authority that activates when Al's resolve weakens and he is cornered\
    \ by his opponent, or otherwise loses faith in his Authority, the Domain will\
    \ switch the initiative of the Authority from Al to his opponent, the Aggressor.\
    \ Time will continuously reset back to a pre-defined point regardless of what\
    \ occurs within the loop. This is Al's most powerful ability, as while neither\
    \ he nor the opponent can die within the loop, only they will remember the loops.\
    \ The opponent will eventually go mad within the inescapable repeating world,\
    \ so from Al's perspective he can just deactivate his Authority immediately after\
    \ confirming their heart has broken. This bug will activate even if Al doesn't\
    \ wish for it, including when he has undone his Domain, but he was also capable\
    \ of activating this bug willfully when he hardened his resolve. Magic: Al has\
    \ been imparted with vast magical knowledge from his Teacher, including great\
    \ magic of several attributes and a number of forbidden arts, although he lacks\
    \ the resources to make use of most of it. He has still been trained to be exceptionally\
    \ crafty and efficient with his magic. *Earth Magic: Al primarily uses Earth Magic,\
    \ allowing him to manipulate the earth, stone, mud, etc. Al is exceedingly creative\
    \ in using Earth Magic, making up for his lack of skill with ingenuity. He can\
    \ construct earthern weapons, armor, prosthetics, manipulate the environment,\
    \ and more. **Dona: With this spell he can fire stones at his opponents, or raise\
    \ a small wall of earth for defense or mobility. **El Dona: With this spell he\
    \ can make the ground burst with stone spikes where he aims, or coat his body\
    \ in earthern armor. **Earth Brand Arts: A technique stolen from Emilia, Al creates\
    \ numerous stone weapons of various breeds which he wields, shatters, and transforms\
    \ freely, making use of the disposable weapons to rapidly change fighting styles.\
    \ *Ol Shamak: A forbidden art of the Yin attribute developed by Echidna, it is\
    \ unknown where this spell ranks alongside the other tiers of Shamak. It is an\
    \ anti-Witch trump-card which seals the target's body in a contradictory black\
    \ light, and ceases the function of their Gate. This spell does not reach its\
    \ full potential unless used on a target that was granted power by a Witch Factor,\
    \ the effect of the spell being far greater and sealing the target in a small\
    \ black orb. ==Gallery== ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ ==References== ==Notes, Explanations and Statistic Values== Category:Characters\
    \ Category:Re:Zero kara Hajimeru Isekai Seikatsu Category:Male Characters Category:Earth\
    \ Users Category:Sand Users Category:Durability Negation Users Category:Weapon\
    \ Creation Users Category:Flight Users Category:Power Nullification Users Category:Time\
    \ Users Category:Concept Users Category:Law Users Category:Magic Users Category:Power\
    \ Mimicry Users Category:Swor"
