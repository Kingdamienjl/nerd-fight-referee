power_scale:
  tier:
    text: 9-A physically, higher with weapons, vehicles, and explosives, 7-C with
      Nukes
    source_ids:
    - vsbattles-the-player-jailbreak-unknown
    confidence: 0.6
  attack_potency:
    text: Small Building levelUpscales from 0.045 Tons of TNT physically (Can harm
      and kill other Players with their bare hands. Can also shatter thick glass display
      cases and temporarily disable a power box by punching them), higher with weapons
      (Their firearms can penetrate things that their explosives can't breach and
      can temporarily disable most vehicles with enough shots, including military
      vehicles), vehicles (Even the smallest vehicle can knock over streetlamps, signs,
      and trees and can temporarily disable other vehicles with PIT maneuvers. Some
      vehicles have built-in weapons that can harm the Player), and explosives (Can
      destroy walls, make holes on roofs, and even blow open bank vaults which requires
      at least this much energy), Town level with Nukes (Nukes are on this level.
      A single one packs enough power to cover 90% of the map and instantly kill all
      Players who are caught in the blast, excluding the person who launched the Nuke)
    source_ids:
    - vsbattles-the-player-jailbreak-unknown
    confidence: 0.6
  speed:
    text: Peak Human with Transonic combat speed and reactions (Can react to their
      own vehicles travelling at top speed and trade blows with other Players), higher
      with the Energy Drink and melee weapons (Can give the user a temporary speed
      boost). Up to Supersonic+ attack speed with ranged weapons and explosives (Firearms
      such as the Rifle which is based on the M4 Carbine, M16, and Heckler & Koch
      HK416, are this fast. The Tank can fire missiles that should be this fast),
      far higher, possibly Massively Hypersonic with the Taser and plasma weapons
      (Can shoot bolts of electricity that appear instantaneous from the Player's
      perspective). Varies from Superhuman (The Sloop can only go 62 mph/100 kph at
      top speed) up to Transonic travel speed with vehicles (The fastest land vehicle
      can reach 423 mph/681 kph at top speed. The fastest watercraft can reach 700+
      mph/1126+ kph at top speed), even higher with Rocket Fuel (The Scorpion was
      able to reach 531 mph/855 kph when tested with Rocket Fuel and can likely get
      even faster without obstruction)
    source_ids:
    - vsbattles-the-player-jailbreak-unknown
    confidence: 0.6
  lifting_strength:
    text: Class 5 (Can steal and carry around an uranium rod on their back without
      losing speed2.4 Tons of force), higher with Handcuffs (Can completely restrain
      other Players, making them unable to break out on their own), Class 100 with
      the Tow Truck, Frost Crawler, and helicopters (Can tow and carry the Tank and
      Sloop)
    source_ids:
    - mediawiki-2769962
    confidence: 0.95
  striking_strength:
    text: Small Building level, higher with melee weapons
    source_ids:
    - mediawiki-2769962
    confidence: 0.95
  durability:
    text: Small Building level (Can survive gunshots and attacks from other Players,
      including point blank C4 explosions which can blow open the steel doors of a
      bulletproof Bank Truck. Unharmed by most vehicles ramming into them at top speed,
      save for a few exceptions like the Cargo Train which can instantly kill them.
      Suffers no damage from the Bank Truck's self-destruction), higher with the Forcefield
      Launcher and Riot Shield (The former grants complete protection against bullets
      and the latter reduces damage taken from bullets by 60%), and vehicles (Most
      vehicles can't be permanently destroyed but only temporarily disabled. They
      will regenerate damages overtime and continue functioning unhindered. Some vehicles
      are bulletproof or can reduce all damage the Player takes while inside of them)
    source_ids:
    - vsbattles-the-player-jailbreak-unknown
    confidence: 0.6
  stamina:
    text: Peak Human (Can continue to operate for long periods of time and can quickly
      recover from fatigue)
    source_ids:
    - vsbattles-the-player-jailbreak-unknown
    confidence: 0.6
  range:
    text: Standard Melee Range normally, Extended Melee Range with melee weapons and
      handcuffs (Handcuffs can reach farther than they should physically be capable
      of), Hundreds of Meters with ranged weapons and equipment (The Sniper has a
      maximum range of 287 meters/941 feet)
    source_ids:
    - vsbattles-the-player-jailbreak-unknown
    confidence: 0.6
  intelligence:
    text: 'Gifted (Skilled in hand to hand combat and with various weapons. Can easily
      operate a massive number of vehicles on their own, even including a UFO, and
      customize them to increase their performance. Can also solve different puzzles.
      Can single-handedly and repeatedly defeat the VP and his army in combat, the
      former of whom stated to control the world and have more power than any other
      Criminal and also the one to have caused the numerous catastrophic events that
      devastated the island in the past Every version and past feature of Jailbreak
      is canon to the game''s storyline with events occurring in order of updates
      as confirmed by Jailbreak: Rewind and the release of OG Jailbreak. Foiled many
      of the VP''s schemes to take over or destroy the island. As Prisoners and Criminals,
      they''re capable of escaping the Prison, Maximum Security Prison, or Bounty
      Island through different ways, evading and fighting the Police on a daily basis,
      and can also infiltrate and rob heavily protected locations such as banks, museums,
      jewelry stores, casinos, nuclear power plants, and even military bases. As Police
      Officers, they''re capable of outsmarting Criminals, preventing and stopping
      crimes and can also track down and defeat the most dangerous criminals on the
      island)'
    source_ids:
    - vsbattles-the-player-jailbreak-unknown
    confidence: 0.6
