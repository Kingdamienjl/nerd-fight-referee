  intelligence:
    text: 'Genius in combat (Garfiel is a skilled fighter who can keep up with master
      swordsmen like Kurgan, despite being at a disadvantage due to Kurgan having
      eight arms. While his attitude suggests he uses brawn over brain, he is a tactical
      fighter who is capable of coming up strategies during battle, for example: he
      developed a counter to Elsa Granhiert''s analytical prediction which allowed
      her to counter any attacks she had witnessed once before, allowing him to land
      a blow on her; and in his fight with Olbart he also intentionally created openings
      in his defense to provoke his opponent into attacking. However he does also
      rely on his instincts that alert him of danger to escape from life threatening
      situations, and make do-or-die decisions. Garfiel can block attacks he can''t
      even see, and is a skilled fighter who trained using a record of Reid Astrea''s
      training regime. Battles on his level are immediate, and any delays between
      thinking and acting being exploited by the opponent. After just a few minutes,
      Garfiel acclimated to dealing with the fighting style of shinobi despite being
      completely incompatable with them. Garfiel can readily absorb and utilize the
      techniques of others after experiencing them himself, without even meaning to.
      Shamak which affects the senses such as hearing and vision,Volume 3, Chapter
      2 can be brushed off with skill, by anyone but a lower-grade opponent. Garfiel
      honed his skill in deathmatches with three of the Nine Divine Generals of Vollachia,
      a group of incredible warriors that exist at the summit of military might in
      the empireArc 8, Chapter 21) Standard Tactics: Garfiel is an ultra-close-range
      specialist, preferring to fight in his area of expertise. Thanks to his demi-human
      traits, Garfiel combines his martial arts with his senses and instincts, allowing
      him to rapidly flow through battle and intuitively respond in combat. His Divine
      Protection and healing magic means he can afford to allow himself to take even
      serious injuries if it means he can approach or deal a major blow to his opponent.
      Garfiel also uses Beastification to enhance his strikes, turning a blunt strike
      into a sharp blow that tears apart his target.'
    source_ids:
    - vsbattles-garfiel-tinsel-unknown
    confidence: 0.6
