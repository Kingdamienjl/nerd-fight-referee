    *Flight *Energy Manipulation *Energy Projection *Weather Manipulation *Electricity
    Manipulation *Fire Manipulation *Absolute Zero (His ice weapons are far superior
    to Mega Man and Tundra Man) *Air Manipulation *Soul Manipulation *Mind Manipulation
    *Incorporeality *Aura *Intangibility (Non-Physical) *Invisibility *Forcefield
    Creation *Possession (Can take over the bodies of other beings to preserve himself)
    *Corruption (Type 2 via the Sigma virus) *Regeneration (Mid-Godly: His program,
    essentially his soul, has been destroyed a couple times and still came back sometime
    later. Though, he can only regen his consciousness and needs to possess a new
    body to fight) *Immortality (Types 3, 6 and 8: As long as Zero''s original body
    and the Maverick Virus are around, Sigma will never truly die) *Reactive Evolution
    *Resurrection (Can resurrect other Reploids) *Resistance to: **Reploid Physiology
