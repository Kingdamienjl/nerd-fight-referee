- id: claim-powers-and-abilities-e9d09f64
  section: abilities
  axis: hax
  text: '*Reploid Physiology (General) *Genius Intelligence *Large Size (Type 0 for
    some forms, Type 3 as Final Sigma W and Type 4 as Colossus Sigma) *Expert Sword,
    Claw and Scythe User *Hand to Hand Combatant *Pressure Points (Can plow through
