  attack_potency:
    text: Street level (Should at least be physically comparable to wizards like Harry),
      Large Building level, likely far higher with Magic and as an Obscurus (Considered
      by Grindelwald to be one of the few beings capable of defeating Dumbledore.
      Casually broke apart a mountainside, shattered a building and tore apart parts
      of New York City by moving around. Effortlessly undid a Shield Charm made by
      Newt Scamander. Briefly contended with Dumbledore, albeit easily overpowered
      in the end.)
