      \ charm that creates a blinding flash of sunlight used to defend against the\
      \ Devil's Snare. Credence should know this spell, as it\u2019s implied to be\
      \ taught in basic herbology to defend against the Devil's Snare and advanced\
      \ charms class, and first years like Hermione have showcased this spell)"
