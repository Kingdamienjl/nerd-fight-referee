- id: claim-powers-and-abilities-24edcdef
  section: abilities
  axis: hax
  text: Peak Human Physical Characteristics, Immortality (Types 1, 7, and 8; Will
    live as long as it's coffin remains intact), Corruption (Type 1; Through it's
    bites, he can turn others into his minions or other vampires as seen with Felix,
    the first victim in the episode), Mind Control via bites, Shapeshifting (Is able
    to take on the appearance of other humans. With this shapeshifting it is able
    to change it's biological sex and age, change in size, alter it's voice, and change
    it's clothes), Teleportation (Seemingly teleported from inside the hospital onto
    the roof while chasing Amanda), possibly Clairvoyance (Possibly has this ability
    as it knew Felix's name without meeting him before), Can go on for 50 years without
    feeding, Natural Weaponry (Yellow fangs), Stealth (A main tactic of his is surprise
    attacking unsuspecting prey, often used in conjunction with his shapeshifting.
    Managed to turn almost everyone in a hospital into his minions without the main
    characters knowing it, and has likely been getting away with this for decades.
    Managed to go undercover as a young woman named Margot)
  source_ids: *id002
  decisive: true
  status: unverified
