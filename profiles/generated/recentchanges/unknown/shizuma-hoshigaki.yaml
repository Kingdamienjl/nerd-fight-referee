- id: claim-weaknesses-07b5323a
  section: weaknesses
  axis: weakness
  text: 'Somewhat reckless Notable Attacks/Techniques: *Crimson Mist Barrier Technique:
    Shizuma creates a thick mist blocking vision inside of the mist and sound outside
    of the mist. *Bloody Mist Absorption Technique: Shizuma swipes his blood across
    Samehada after which he creates a red mist that absorbs chakra from anyone who
    is wounded. *Water Release: Water Spikes: Shizuma is able to create spikes made
    of water from any source of water, this technique is extremely dangerous when
    used within his mist as he can make them appear anywhere in the mist. *Water Prison
    Technique: Shizuma traps his target in a sphere of water, this technique is incredibly
    hard to escape from as it restricts movement and breathing. ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== ==Notes/Explanations== Category:Naruto
    Category:Ninjas Category:Antagonists Category:Anime Characters Category:Characters
    Category:Male Characters Category:Water Users Category:Martial Artists Category:Sword
    Users Category:Chi Users Category:Statistics Amplification Users Category:Duplication
    Users Category:Acrobats Category:Absorption Users Category:Smoke Users Category:Extrasensory
    Perception Users Category:Weapon Masters Category:Surface Scalers Category:Paralysis
    Users Category:Free Movement Users Category:Illusionists Category:Shapeshifters
    Category:Teenagers Category:Boruto Category:Energy Users Category:Adults'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-18fd1931
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, A very skilled swordsman
    and fighter, Chakra Manipulation, Afterimage Creation, Stealth Mastery, and Speed
    Enhancement (The Substitution Jutsu allows its user to instantly replace themselves
    with a nearby object such as a tree log, plant, person, or clone at the exact
    moment they are attacked. The Jutsu works even if the user is physically restrained
    or observed by characters as observant as Sharingan or Sage Mode users. This creates
    the optical illusion of the user being hit, which confuses the opponent and gives
    them an opening to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto
    Chapter 374Naruto Chapter 580Naruto Chapter 674), Shapeshifting (Can transform
    into animate and inanimate objects), Statistics Amplification (Shinobi are capable
    of enhancing their physical capabilities with the use of chakra. The Shunshin
    no Jutsu allows Shinobi to greatly enhance their speed by focusing chakra in their
    feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and
    Water Walking (By focusing chakra at the soles of their feet, Shinobi can scale
    and cling to vertical surfaces, and even walk on waterNaruto Chapter 18Naruto
    Chapter 90), Minor Illusion Creation and Duplication (With the Clone TechniqueRin
    no Sho, Page 220, Shinobi can create illusionary duplicates of themselves that
    have no physical substance), Shapeshifting (With the Transformation Technique,
    Shinobi can transform themselves into other people, animals, plants, and even
    inanimate objects, such as weapons), Paralysis Inducement (With the Temporary
    Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely paralyze their
    targets from close to mid range), Water Manipulation, Chakra Absorption (Able
    to absorb chakra from jutsus or opponents with Samehada, he is also able to continuously
    absorb chakra with his bloody mist however the target must be wounded for it to
    work), Mist Manipulation (Can create a thick mist blocking vision inside of the
    mist and sound outside of the mist), Limited Sensing (Able to sense chakra inside
    of his mist), Healing (from enemies who have their blood spilled in the bloodmist)
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
