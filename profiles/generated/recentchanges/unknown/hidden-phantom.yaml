- id: claim-weaknesses-8c46cab0
  section: weaknesses
  axis: weakness
  text: 'Phantom is blindly loyal to X and by extension Copy X, causing him to make
    irrational decisions at times when he is involved. Notable Attacks and Techniques:
    * Shuriken Ride: Throws a large throwing star at his target. After reaching its
    maximum range, it will return to him and allow him to ride it in erratic patterns
    while he rains throwing knives from above while the star spins rapidly like a
    buzzsaw, allowing him to hit those who tried to approach him. * Fuma Shuriken:
    Phantom jumps into the air and throws a special throwing star that emits additional
    throwing stars and knives as it travels to swarm the opponent. * Clone Technique:
    He creates four afterimages of himself to confuse his opponent, rushing the opponent
    should he/she attack a clone. * Shadow Strike: His EX Skill, Phantom vanishes,
    covering the field with caltrops to restrict any chance of escape before rushing
    at a foe to finish them. Armed Phenomenon: Like his fellow Guardians, he is able
    to take on a special transformation called the Armed Phenomenon to unleash his
    full power. While never seen in story due to his untimely death, concept art shows
    that he would have transformed into an enormous bat like Mechaniloid that would
    have shot out blades that seek their target as well as transform into a large-spearhead
    shape to ram opponents at high speeds. Note: Phantom''s attacks were never officially
    named, but his basic patterns were provided some for reference. In addition, Biometal
    Model P bears his namesake and abilities, but is of debatable value when writing
    a profile about the abilities the original possesses since the Biometals can exhibit
    significantly different attacks than the originals (for example, Phantom himself
    never exhibited the ability to see through walls or the Mandala Star attack, but
    his Biometal does). ==Notable Matchups== Victories: Losses: Inconclusive: Category:Mega
    Man Category:Characters Category:Antagonists Category:Teleportation Users Category:Male
    Characters Category:Duplication Users Category:Weather Users Category:Telekinesis
    Users Category:Sword Users Category:Flight Users Category:Ninjas Category:Intangibility
    Users Category:Good Characters Category:Heroes Category:Leaders Category:Afterimage
    Users Category:Self-Sustenance Users Category:Game Characters Category:Video Game
    Characters Category:Reploids Category:Guardians Category:Kunai Users Category:Shuriken
    Users Category:Caltrop Users Category:Smoke Users Category:Bomb Users Category:Weapon
    Masters Category:Inorganic Beings'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-e71735a3
