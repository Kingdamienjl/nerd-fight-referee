- id: claim-weaknesses-a792e208
  section: weaknesses
  axis: weakness
  text: 'As Sun, he isn''t capable of fighting and can only warn others about his
    Moon persona. If there aren''t enough lights in the Pizzaplex, he''ll transform
    into Moon but if the opposite is the case it will revert him back into Sun meaning
    that he will fall back into his harmless persona. Both personas have a propensity
    for cleaning and can be distracted by the sight of messes. ==Notable Matchups==
    Victories: Jason Voorhees (Friday the 13th) Jason''s Profile (Speed was equal.
    Human Jason (Part III) was used. Battle took place in a dark forest at midnight)
    Losses: Inconclusive: ==References== Category:Characters Category:Five Nights
    At Freddy''s Category:Genderless Characters Category:Game Characters Category:Video
    Game Characters Category:Horror Characters Category:Indie Game Characters Category:Self-Sustenance
    Users Category:Inorganic Beings Category:Enhanced Senses Users Category:Multiple
    Selves Users Category:Transformation Users Category:Stealth Masters Category:Acrobats
    Category:Flight Users Category:Information Analysis Users Category:Antagonists
    Category:Neutral Characters Category:Robots Category:Clowns'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-1f9c3ffe
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Self-Sustenance (Types 1, 2, and 3)
    **Inorganic Physiology (Type 2) **Bodily Weaponry (Unconventional - Fingers; Has
    long fingers that can pierce through human flesh and even skull) **Immortality
    (Type 2; Is still functional after being shattered by the debris of an earthquake)
    **Acrobatics (Hypermobility, All-Terrain Mobility and Self-Momentum; Can do acrobatics
    tricks effortlessly, including layout backflips with ease. Launched himself with
    one hand while in upside down pose. Crawled through the seats of a carousel without
    issues. Casually emerges from the side of a lift) *Enhanced Senses (Can see in
    the dark) *Multiple Selves (Type 1; Possesses three distinct personalities which
    consists of Sun, who is upbeat, energetic and enjoys playing with children, Moon,
    who is aggressive, conniving, and seeks to punish children, and Eclipse, who is
    kind, calm, and caring towards children) *Body Control and Limited Elasticity
    (Can spin his head 360 degrees to the vertical axis and contort his body. His
    design allows him to shrink/extend his limbs more than humans could using springs)
    *Transformation (Can transform between Sun and Moon depending on the Pizzaplex''s
    light conditions. Can turn into Eclipse if rebooted) *Stealth Mastery (Has caught
    Gregory off guard on multiple occasions) *Minor Light and Sound Manipulation (As
    Eclipse, the Daycare Attendant can make parts of his body luminescent and emit
    various sounds such as party horn''s) *Limited Flight (Can suspend himself in
    mid-air through a long wire attached to the ceiling) *Surface Scaling (As shown
    here) *Subjective Reality and Creation (The Daycare Attendant can conjure objects
    corresponding to the decals with a finger snap, indicated by an ethereal sound.
    Is implied to have the power to create scores of Fizzy Faz that "makes heads explode".
    Created the Moon Orb decal, which affects the lighting systems. Can generate waves
    of fire that spreads from the barn to the carousel, which are instantly extinguished
    after his control being gone. Moon''s takeover is proved to have influenced this
    ability numerous times) **Perception Manipulation and Illusion Creation (Warps
    Gregory''s vision and creates halluciations of starry sky) **True Flight (Is able
    to move freely in mid-air despite losing the latch connected to the wire) *Technology
    Manipulation and Hacking (Moon is able to intrude AR World where Sun takes control,
    which is a distinctive layer of existence that can affect reality, without the
    V.A.N.N.I mask. As Jack-O-Moon, he can further cause glitches in the simulation)
    **Teleportation, Limited Intangibility and Clairvoyance (As a result of being
    able to intrude AR World, The Daycare Attendant can access shortcuts, which bypasses
    physical distance, allowing him to manifest in the exact place that Gregory is
    heading to. When immersed into the AR World, people do not abide by the physics
    of the normal world, allowing them to phase through certain objects) *Possibly
    Information Analysis (Should be comparable to the Glamrock animatronics who, like
    the Toy animatronics have built-in facial recognition software designed to identify
    registered customers in the Pizzaplex) Resistance to: *Light Manipulation (Is
    unaffected by the bright light produced from the Fazerblaster as well as the Faz
    Camera) *Extreme Heat/Cold (Comparable to Glamrock animatronics such as Glamrock
    Freddy, who withstands the temperature that can be as high to melt dense ice blocks
    or as cold to freeze metal, which fluctuation he refered as extreme) *Electricity
    and Water Manipulation (Advanced animatronics aren''t affected by short-circuit
    caused by water and electrical charges, as they can submerge in a sewer and resist
    several electrocutions, even without their casings)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
