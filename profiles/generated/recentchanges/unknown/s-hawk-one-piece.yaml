- id: claim-powers-and-abilities-db5d693e
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Enhanced Senses * Limited Light Manipulation,
    Explosion Manipulation, Heat Manipulation, and Energy Manipulation * Self-Sustenance
    (Type 1, 2, and 3) * Information Analysis * Inorganic Physiology (Type 2) * Adaptation
    and Resistance to Extreme Heat (As Lunarians, the Seraphim are capable of surviving
    in any natural environmentOne Piece Vol. 102 Chapter 1031) * Large Size (Type
    0) * Cyborgization * Skilled Hand-to-Hand Combatants * Statistics Amplification
    (Similar to KingOne Piece Vol. 102 Chapter 1035, when they deactivate the flames
    on their backs their speed increases but their durability decreasesOne Piece Vol.
    107 Chapter 1077) * Accelerated Development (Intelligence, Abilities, and Physical
    Statistics through battle;as the Seraphim absorb data, they are able to rapidly
    grow, gaining new abilities, attack patterns, and moreOne Piece Vol. 105 Chapter
    1065 * Master Swordsman (As Mihawk''s clone, S-Hawk has great sword skill) * Air
    Manipulation (Can send long-ranged slashes that deal large amounts of damageOne
    Piece Vol. 105 Chapter 1059) * Due to having Mihawk''s Lineage Factor in his DNA,
    S-Hawk likely has: ** Analytical Prediction (Through sensing the breath of someone
    or an object he can know the trajectory of their actions before it happens) **
    Extrasensory Perception (Through sensing the breath of someone or an object he
    can know their location despite not being visible to him) ** Limited Durability
    Negation (Through sensing the "Breath" of their desired target he'' able to cut
    objects or people they otherwise couldn''t through power alone. It''s effectiveness
    begins to lessen against objects or opponent''s with durability that far exceeds
    the limit of this ability) * Limited Metal Manipulation and Transformation (Can
    create blades from any part of his bodyOne Piece Vol. 106 Chapter 1076)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
