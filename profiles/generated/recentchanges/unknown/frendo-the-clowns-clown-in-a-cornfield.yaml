- id: claim-powers-and-abilities-1561bdea
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Stealth Mastery (A Frendo was able to
    sneak a jack-in-the-box right behind a teenager and disappear without making a
    sound or alerting him. Another appeared out of nowhere to get the drop on another
    victim even after the latter had thoroughly checked for hiding spotsClown in a
    Cornfield), Weapon Mastery (The Frendos are decent shots with their ranged weapons.
    Ex-Friendo Izzy was able to shoot Arthur from 35 yards away with a bow and later
    take out several gunmen Clown in a Cornfield 2: Frendo Lives), limited Martial
    Arts (Sheriff Dunne, being a cop, has some self defense and submission training,
    as shown when he incapacitates Dr. Maybrook with a chokehold), Social Influencing
    (Reputation, Charisma, and Deception: Frendos hold a variety of influential jobs
    in their daily lives from teachers to lawyers. Sheriff Dunne had spent years radicalizing
    the small group that would eventually expand to become the army of Frendos. In
    the novel, Sheriff Dunne is shown to be much more respected than the Mayor), Preparation'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
