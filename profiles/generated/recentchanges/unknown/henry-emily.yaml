- id: claim-powers-and-abilities-44679401
  section: abilities
  axis: hax
  text: '*Genius Intelligence (Was the lead builder of the first animatronics in the
    series, such as SpringbonnieFive Nights at Freddy''s: The Ultimate Guide and Fredbear.Five
    Nights at Freddy''s 3 Through his help, William and Henry were able to successfully
    run a popular business that made them excruciatingly rich; lured and successfully
    trapped all of the missing children to free their souls), *Social Influencing:
    **Deception: Despite being mostly innocent, Henry was capable of fooling all of
    the missing children and lured them back into Freddy Fazbear''s Pizza Place, burning
    all of them alive, Springtrap included. Was able to lay low for a little while
    to the point where it was incredibly hard to track him. **Social Position & Reputation:
    Was a highly well-known, respected, and awarded roboticist. **Charisma: Despite
    Afton knowing it was a trap, due to Henry making it incredibly interesting for
    him, Afton decides to go through with it, eventually being unable to escape the
    fire. However, this does not stop his legacy for long. *Stealth Mastery (Hid within
    Freddy Fazbear''s Pizza Place before starting the fire and giving his speech)
    *Preparation (Trap Preparation - Founded and recorded audio tapes for any manager
    willing to go ahead with his plan in order to end the terrifying legacy of Fazbear
    Entertainment. Freddy Fazbear''s Pizza Place was seemingly built with flamethrowersFive
    Nights at Freddy''s: Security BreachFreddy Fazbear''s Pizzeria Simulator) *Sound
    Manipulation (As seen during his monologue; he likely did this through a megaphone
    of sorts. The tape recorder is capable of giving instructions to Michael Afton)
    *Electricity Manipulation & Status Effect Inducement (Via his company-issued taser;
    used mostly to return animatronics into a more neutral state) *Information Analysis
    (Could build the Toy Animatronics, which have a facial recognition software connected
    to a criminal databaseFive Nights at Freddy''s 2) *Possible Light Manipulation
    (Should be well equipped with everything Michael has, including his flashlightFive
    Nights at Freddy''s: Sister Location) *Fire Manipulation (Started the Freddy Fazbear''s
    Pizza Place fire, albeit some parts were still mostly intact)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
