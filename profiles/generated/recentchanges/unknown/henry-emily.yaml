  stamina:
    text: Athletic (Comparable to Michael. Despite not seeming much, Henry is incredibly
      determined, founding multiple businesses and working non-stop in airtight Springlock
      suits. After wrestling with his guilt, he decides to build and conceive of a
      plan to trap all of the children inside of Freddy Fazbear's Pizza Place, which,
      in turn, would free their souls. This plan succeeds flawlessly)
    source_ids:
    - vsbattles-henry-emily-unknown
    confidence: 0.6
  range:
    text: Standard Melee Range, Several Meters with Taser (Tasers go up to 21 feet
      or 6.4 MetersCollege of Policing)
    source_ids:
    - vsbattles-henry-emily-unknown
    confidence: 0.6
  intelligence:
    text: "Extraordinary Genius Henry Emily was a successful businessman who was held\
      \ in high regard in the field of robotics, being able to deduce who the real\
      \ culprit of the Missing Children Incident was and build an entirely new pizzeria\
      \ made with the sole purpose of killing all of the vengeful spirits; a plan\
      \ that worked flawlessly. *Co-founded Fredbear's Family Diner and gave orders\
      \ from behind the scenes to Michael Afton in order to have him salvage all of\
      \ the animatronics within the back alley, a location he predicted they would\
      \ wound up in. (Anticipation, Planning, Setting Up Traps, Charisma) *Created\
      \ Fredbear and various animatronics within the series, all of whom were capable\
      \ of operating on degrees AI during that time period could. Was implied heavily\
      \ throughout the franchise to be smarter than William Afton, who could build\
      \ the animatronics seen in Sister Location. (VSI, Mathematical Thinking, PRI,\
      \ FSIQ) *As a businessman, he should have been capable of charismatic speaking;\
      \ this is backed up by him being a father and creating an animatronic known\
      \ as The Puppet to help watch over all the kids. (SQ, Charisma, Planning) *Like\
      \ William Afton, Henry also likely practiced child psychology to make sure that\
      \ the children would enjoy being around the animatronics on stage and while\
      \ they were being worn by their respective performers. Circus Baby notes that\
      \ Afton's knowledge in child psychology was so good that once Elizabeth was\
      \ killed, the children that entered the room straight afterwards to see her\
      \ perform would drown out her screams, stating that \"they couldn\u2019t hear\
      \ her over the sounds of their own excitement.\" This is further backed up when\
      \ Henry manages to predict where all the missing children would appear \u2014\
      \ behind the back alleyway. (Psychology, Emotional Understanding) *Laid low\
      \ in order to stave off the public's attention on Freddy Fazbear's reputation,\
      \ and to continue mourning the death of his daughter. He later recovers from\
      \ this state to go enact vengeance on William and to help free the souls of\
      \ the dead children (Deception, Emotional Management) *Lured and destroyed all\
      \ the remnants of the missing children, including that of Afton's, who, despite\
      \ knowing it was a trap, came along anyway due to how interesting Henry had\
      \ made it out to be. (Manipulation, Charisma) *Despite being in a burning building,\
      \ Henry continued monologuing with no signs of fear whatsoever (Emotional Management)\
      \ Standard Tactics: Henry will never confront anyone head on, and will lay low\
      \ before attempting to enact his plans. However, when he does enact his plans,\
      \ it usually turns out to succeed flawlessly."
    source_ids:
    - vsbattles-henry-emily-unknown
    confidence: 0.6
