- id: claim-standard-equipment-eafe90e7
  section: equipment
  axis: equipment
  text: 'SIG-Sauer P226, Heckler & Koch P9S, police armor | Auto-9 machine pistol,
    Tactical Ordinance grenades, Cobra Assault Cannon, Weapon Arm (includes a submachine
    gun, flame thrower, and smart bomb launcher with anti-tank warhead), Data Spike,
    Flightpack File:Auto-9.png|Auto-9 File:GunArm.png|Gunarm * Auto-9: RoboCop''s
    primary weapon, the Auto-9, remained stored in a mechanical holster which deployed
    from RoboCop''s right leg. It was also modified so it would not fire unless RoboCop
    was the one using it. * Terminal strip: RoboCop''s terminal strip was a sharp,
    spike-like device that protruded from RoboCop''s right fist. This device could
    be used by RoboCop to interface with a corresponding data port in order to download
    information from the police database and compare the information he gathered from
    his missions with the police database. This device was also used to kill Clarence
    Boddicker; having pinned RoboCop under a pile of scrap metal, the cyborg waited
    for Boddicker to approach and then stabbed Boddicker in the throat, killing the
    crime lord. * Gunarm/Machine gun/rocket launcher: By the time he faced the Urban
    Rehabilitators, RoboCop was outfitted with a gun arm. To use it, RoboCop removed
    his left hand and replaced it with the weapon assembly. It contained a 9mm machine
    gun, a flamethrower, and a small missile launcher with a projectile potent enough
    to destroy an armored vehicle. * Flightpack/recharging station: In his fight against
    the Rehabs, RoboCop used a flight pack. It also doubled as a replenishing system
    for when his battery system was low on power. The jetpack allowed Murphy to overcome
    his relatively limited mobility for tactical advantage in combat. File:I006739.jpg|Detroit
    Police Cruiser * Detroit Police Cruiser: Quick, nimble and able to take a lot
    of punishment, Detroit Police cruisers are cars used while officers are on patrol.
    As well as the usual red & blue lights, they have spotlights, nudge bars and no
    hub caps. They have been painted matte black paint and display the OCP logo on
    their side doors. The Detroit Police cruisers were modified first generation Ford
    Tauruses. In the original script, the cruisers were ultra-quick, ultra-advanced,
    twin jet turbine-powered vehicles, packed with electronics and sensor equipment,
    which proved far too expensive to render on screen. : Can Summon/Pilot: Detroit
    Police Cruiser (1986/1989 Ford Taurus LX [DN5]), 1986 Harley-Davidson FXSTC Softail
    Custom'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-8adc00a6
  section: power_scale
  axis: battle_iq
  text: 'Is a skilled and somewhat cunning combatant when he needs to be and his computerized
    brain affords him outstanding processing power. Standard Tactics: DPD protocols
    | Fundamental to his operational limits were RoboCop''s "Prime Directives," a
    set of rules, unbreakable and unbendable, that RoboCop is bound to uphold: #"Serve
    the public trust" #"Protect the innocent" #"Uphold the law" #"Never oppose an
    OCP Officer" (Was removed later on in RoboCop 3)'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-26d396e5
  section: weaknesses
  axis: weakness
  text: '* He moves quite slowly on foot - at the pace of an average human. He is
    also exceptionally heavy. * Still limited to mechanical maintenance, which means
    he needed servicing and tune-ups from time to time. * His remaining human tissue
    and organs can be a liability and needed to be monitored as well. * His power
    pack has enough charge for only 24 hours. Prolonged combat and sustaining too
    much damage can drain it quickly. (can be remedied with the flightpack doubling
    as a recharging station) * His programming prevents him from targeting children.
    * In the wrong hands, he can be programmed to be incompetent, corrupted, or a
    dangerous threat to society. * RoboCop occasionally had flashbacks of his previous
    life as Alex J. Murphy, which caused him to have "dreams" when he was in his recharging
    state. This sometimes caused him to sleepwalk or wake up in shock. * His fourth
    directive, "Any attempt to arrest a senior officer of OCP results in shutdown",
    but this was eventually overcome by being deleted in the third film. Feats: ===Strength===
    * [Grip] 400 foot-pound grip. Stated to be capable of "breaking every bone in
    your body".RoboCop * [Grip] Bent a gun barrel. * [Grip] Broke a chain in his grasp.RoboCop
    2 * [Pushing] Overpowered the arm of ED-209. * [Pushing] Pushed against Robocop
    2''s arm. For reference Robocop 2 was strong enough to flip an armored car. *
    [Striking] Reached through a wall and pulls a guy through it. * [Striking] Clotheslined
    a guy halfway across a convenience store and through a glass door. * [Striking]
    Broke down a large, locked door after several pushes. * [Striking] Punched through
    a metal door.'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-3c98db5e
  section: abilities
  axis: hax
  text: '*Martial Arts *Vehicular Mastery *Marksmanship *All of his former skills
    to a much greater extent *Superhuman Physical Characteristics *Cyborgization *Immortality
    (Type 2) *Bodily Weaponry (His data spike) *Enhanced Senses *Information Analysis
