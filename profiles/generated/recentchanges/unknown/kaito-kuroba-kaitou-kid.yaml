- id: claim-weaknesses-5c8c4971
  section: weaknesses
  axis: weakness
  text: 'He is very scared of the fish. And the fear can make him lose consciousness.
    Notable Attacks/Techniques: Kaitou kid image18.gif|Card Gun Hang Glider Cape Profile.jpg|Hang
    Glider Cape Turbo Engine Scooter Profile.jpg|Turbo Engine Scooter Kaito Kid Turbo
    Engine Skates.jpg|Turbo Engine Skates *Card Gun An unusual gun that fires playing
    cards at a rapid speed instead of bullets. *Hang Glider Cape The cape part of
    Kid''s outfit doubles as a getaway hang glider, relying on the air currents to
    allow Kid to escape safely. This is the only gadget Toichi has also been seen
    to use. *Turbo Engine Scooter A scooter with a turbo engine on the back and a
    miniature propeller on the front end. Kid is able to hide the scooter on his back
    under his cape until he''s ready to use it. So far, this item has only been used
    in the chapter it was introduced. *Turbo Engine Skates A set of super fast rollerskates
    Kid can easily attach on to his shoes for a quick getaway. So far, this item has
    only been used in the episode it was introduced. ==Gallery== Kaito kid image5.gif
    Kaito kid image 7.gif Kaito kid image6.gif Kid vs makoto 14.JPG Kid vs makoto
    11.jpg|Kaitou Kid VS Makoto Kyogoku (Detective Conan The Movie 23 : The Fist of
    Blue Sapphire) Kaitou kid image16.gif ==Notable Matchups== Victories: Losses:
    Inconclusive: ==References== Category:Characters Category:Detective Conan Category:Magic
    Kaito Category:Acrobats Category:Anime Characters Category:Bomb Users Category:Card
    Users Category:Flight Users Category:Geniuses Category:Good Characters Category:Gun
    Users Category:Heroes Category:Humans Category:Magic Users Category:Male Characters
    Category:Manga Characters Category:Primary Protagonists Category:Protagonists
    Category:Sleep Users Category:Smoke Users Category:Teenagers Category:Thieves
    Category:Disguise Users Category:Hat Users Category:Cape Users Category:Marksmen
    Category:Weapon Masters Category:Weapon Users Category:Vehicular Masters Category:Vehicle
    Users Category:Drivers Category:Social Influencers Category:Stealth Masters Category:Photographic
    Memory Users Category:Body Control Users'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
