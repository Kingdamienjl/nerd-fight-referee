- id: claim-powers-and-abilities-aae2cdf8
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Multiple Selves (Type 1; The director
    has clarified that Freaky Nikki isn't actually a separate entity but simply a
    separate personality), Stealth Mastery (Shown to make usage of dark corners to
    hide. Got the drop on Sarah and snuck into her dad's store to steal a gun), Minor
    Shapeshifting (Nikki's face is shown to involuntarily morph into a more decayed,
    older version of herself, though this reverts), Social Influencing (Deception;
    Prior to being questioned at dinner, the alter personality fooled everyone, maintaining
    a mostly normal personality), Darkness Manipulation (Framed herself in darkness
    in Bear's well-lit apartment), Sound Manipulation (Shown to be able to throw her
    voice, with Bear being unable to pinpoint her screaming while being in the same
    room as her. Her voice can also take on a demonic register), High Pain Tolerance
    (Shown to be unaffected after bludgeoning herself), Extrasensory Perception (Tracked
    down Bear after he snuck off to meet Sarah. Somehow knew he made the wish), Superhuman
    Willpower (Due to her obsessive nature, Nikki has no regard for pain, death, morality,
    or even basic sustenance if it makes her beloved happy) Magic (Via One Wish Willow),
    Power Bestowal, Mind Manipulation, Creation (The One Wish Willow can create objects
    such as cars and money), Morality Manipulation, Corruption Soul Manipulation,
    and likely many more abilities (It's acknowledged by the director that the One
    Wish Willow's existence creates a plot hole in how stable the world is, implying
    it can bring catastrophes on a much wider scale than seen in the film)
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
