- id: claim-weaknesses-396d3d76
  section: weaknesses
  axis: weakness
  text: 'If she recklessly uses her horn, the recoil could leave her battered. Using
    her horn for several hours will stimulate her Oni instincts, making her more violent
    and less reasonable. Rem tends to use magic with reckless abandon. Notable Attacks/Techniques:
    *Oni Transformation: The characteristic feature of the Oni clan is their horns.
    This is an organ which devours atmospheric mana to fuel the superhuman body of
    the utmost excelling combat species. Oni usually have two horns, but twins like
    Rem are born with one horn each, making them weaker. Even with an inferior horn,
    Rem is greatly empowered by the mana it provides her with; roughly doubling her
    strength, enhancing her regeneration, and flooding her mind with fighting instincts.
    Thanks to the teachings of Priscilla Barielle, Rem awakened the true power of
    the Oni clan to sense the emotions of others within the mana their horns absorb.
    This allows Rem to detect paths of concealed hostility and accurately respond
    to attacks in advance, as well as feel the trust and intent of her allies even
    if their words are inaudible. *Magic: To make up for her lesser Oni abilities,
    alongside training with weapons, Rem learned magic from her master Roswaal L.
    Mathers, the greatest magician in the world. With her affinity for the Water attribute,
    she developed ice magic for combat and healing magic for support. With ice magic
    she creates projectiles, barriers, and platforms of ice to support herself, and
    with healing magic she can perform first-aid. **Huma: The lowest class of Huma.
    It is a spell which manipulates ice on a small scale, such as forming a barrier
    to protect oneself. This Water attribute Huma differs from the Fire attribute
    Huma, as it directly converts mana into ice instead of freezing moisture in the
    air, which despite being more mana-intensive, allows Rem to instantly dismiss
    ice back into mana. **El Huma: A higher class of Huma. It is a spell which manipulates
    ice on a larger scale, usually offensively by forming numerous icicle projectiles
    in the air which can then be fired all at once. Rem once used this spell to turn
    a person''s blood into a frozen projectile. **Ul Huma: The second-highest class
    of Huma. It is a spell which creates large icicles of several meters in scale
    to attack with. Three of these icicles managed to push the White Whale off-course.
    **Al Huma: The highest class of Huma. It is a spell which forms an enormous mass
    of ice to smash into the target at high speed. This mass can exceed ten meters
    in size, and is able to pierce the White Whale''s mana-dispersing hide. ==Notable
    Matchups== Victories: *Ram (Re:Zero kara Hajimeru Isekai Seikatsu) Ram''s Profile
    (Speed was equalized, the starting distance was 400m, both started in the respective
    base forms) Losses: Inconclusive: ==References== ==Notes, Explanations and Statistic
    Values== Category:Characters Category:Re:Zero kara Hajimeru Isekai Seikatsu Category:Anime
    Characters Category:Aura Users Category:Blood Users Category:Bodily Weaponry Users
    Category:Demons Category:Enhanced Senses Users Category:Extrasensory Perception
    Users Category:Female Characters Category:Flail Users Category:Good Characters
    Category:Healers Category:Ice Users Category:Internet Characters Category:Isekai
    Characters Category:Instinctive Action Users Category:Transformation Users Category:Berserkers
    Category:Power Nullification Users Category:Platform Creation Users Category:Precognition
    Users Category:Light Novel Characters Category:Magic Users Category:Maids Category:Manga
    Characters Category:Monster Girls Category:Regeneration Users Category:Sleep Users
    Category:Statistics Amplification Users Category:Supernatural Willpower Users
    Category:Teenagers Category:Telepaths Category:Tragic Characters Category:Twins
    Category:Visual Novel Characters Category:Weapon Masters Category:Body Control
    Users Category:Weapon Users Category:Loyal Characters'
  source_ids: *id002
