    abilities of the Mirror of Regret which uses a person''s weaknesses and bad memories
    against them, draining their confidence and energy Mighty Morphin Power Rangers
    S2 Ep30. King Mondo turned the rangers evil and made them hate everyone but the
    rangers after realizing the power of kindness and love they were able to snap
