    Rangers to retain their memories after time was reversed Mighty Morphin Alien
    Rangers Episode 1; Alien Rangers of Aquitar: Pt. 1) * Pressure Points (The Mantis
    Kung Fu focuses on attacks on the vital points of the opponent) * Energy Manipulation
    (The Power Coins can be used to energize others Mighty Morphin Power Rangers S1
    Ep50) * Accelerated Development (The Rangers constantly get stronger, even mid-combat
    the Rangers despite being stomped by the Socadillo to the point that even if the
    Power Blaster can''t damage it, with Socadillo growing passively more powerful
    as it passively absorbed energy, they were able to grow in strength and easily
    overpower him Mighty Morphin Power Rangers S1 Ep55. The Rangers constantly grow
    in Power as they were able to defeat all of their strongest foes of the past in
    a few hits Mighty Morphin Power Rangers S2 Ep2. Caught up to the level of Zedd''s
    new monsters after encountering them, with Zedd''s monsters growing constantly
    stronger Mighty Morphin'' Power Rangers Comics Plus Issue 1. Instantly got enough
    power to overpower and fight many Chaos Putties where just some panels ago were
    completely overpowered by just one Mighty Morphin issue 2 Mighty Morphin issue
    3) * Sound Manipulation (The rangers were able to endure the sound of Baby Joey
    which is strong enough to shake buildings Zeo episode 5) * Disease Manipulation
    (Scales to Jason) * Electricity Manipulation (Comparable to Bulk and Skull who
    survived being electrocuted by Alpha 5) * Fire Manipulation (Scaling to Bulk and
    Skull that can touch and grab objects that just landed after atmospheric entry
    Mighty Morphin Power Rangers S2 Ep17) * Cold (Even while unmorphed the Rangers
    can withstand a lot of cold Mighty Morphin Power Rangers S2 Ep48) * Mind Manipulation,
    Illusion Creation and Broadway Force (Resisted Gnarly Gnome''s mind magic and
    overpowered his illusions, Gnarly Gnome mind controls anyone that listens to his
    music and can force them to dance against their will Mighty Morphin Power Rangers
    S1 Ep5 Mighty Morphin Power Rangers S1 Ep5 VHS Mighty Morphin Power Rangers Alien
    Encounters. Resisted Pumpkin Rapper''s raps Mighty Morphin Power Rangers S1 Ep54
    which are hypnotic . The Rangers can concentrate and control their thoughts which
    allows them to bypass Guitard''s mind manipulation abilities that can pierce through
    their resistances, even after Guitardo enhanced his music it was still difficult
    for him to control the Rangers Mighty Morphin Power Rangers S2 Ep11) * Empathic
    Manipulation, Mind Manipulation, Deconstruction (Molecular), Existence Erasure,
    Illusion Creation and Fear Manipulation (2 Layers) through Supernatural Willpower
    (Overpowered the illusions of the Island of Illusions that were so powerful they
    were projecting the fear of the person to the point of demolecularizing them which
    ends up completely dematerializing the person from existence . Their willpower
    allow them to break free from Rita''s fear spells Mighty Morphin Power Rangers
    S1 Ep43. Their will to work together as Rangers also nullified the magical affect
    of the boomerang of the Slippery Shark which made Jason and Tommy hate each other
