- id: claim-weaknesses-04775d3c
  section: weaknesses
  axis: weakness
  text: "Even being proficient in wind release, he requires his mother's fan to use\
    \ advanced techniques which he is still limited at and tires him quickly. Notable\
    \ Attacks/Techniques: * Shadow Imitation Technique: Allows the user to extend\
    \ his shadow. Once it comes into contact with the opponent's shadow, they are\
    \ forced to imitate the user's movements. Can work on multiple targets. This technique\
    \ can only work for a limited amount of time. * Shadow Imitation Field Technique:\
    \ This technique is an advanced version of the Shadow Imitation Technique, where\
    \ the user expands their shadow to cover a wide range, thereby reducing the chance\
    \ of escape. Due to the technique's concept, multiple targets can be captured\
    \ simultaneously. * Shadow\u2013Neck Binding Technique: This is a variation of\
    \ the Shadow Imitation Technique, designed for offensive purposes. The user extends\
    \ their shadow along a target's body, which, because the shadow has physical properties,\
    \ the target can feel. There, the shadow can be used for restraint, replacing\
    \ or adding to the binding of the Shadow Imitation; the closer the user is to\
    \ their target, the stronger this binding becomes. * Wind Release: Sickle Weasel\
    \ Technique: Using a Giant Folding Fan, the user causes many currents of wind\
    \ to collide with each other, creating vacuum pockets. On its own, the gust is\
    \ powerful enough to blow away incoming attacks and knock targets off their feet.\
    \ If a target should become engulfed in the winds, their body will be carved up\
    \ by the countless wind blades. * Wind Release: Air Current Wild Dance: The user\
    \ creates and controls air currents from the palms of their hands. The technique\
    \ is able to easily whip up loose dust in the area. It is also performed to create\
    \ a controllable dust storm. * Wind Release: Great Task of the Dragon: The user\
    \ swings their fan to the sky, causing a giant tornado to descend upon a target.\
    \ This technique can be set up as a feint as it has a delayed activation. The\
    \ technique alters weather conditions temporarily and attacks from the sky rather\
    \ than from the person. The storm clouds that create the attack dissipate immediately\
    \ after the tornado begins while the tornado continues in a highly concentrated\
    \ state. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==\
    \ ==Notes/Explanations== Category:Naruto Category:Ninjas Category:Male Characters\
    \ Category:Characters Category:Paralysis Users Category:Sealing Users Category:Statistics\
    \ Amplification Users Category:Stealth Masters Category:Afterimage Users Category:Surface\
    \ Scalers Category:Free Movement Users Category:Shapeshifters Category:Illusionists\
    \ Category:Duplication Users Category:Geniuses Category:Boruto Category:Manga\
    \ Characters Category:Anime Characters Category:Chi Users Category:Energy UsersCategory:Extrasensory\
    \ Perception Users Category:Adults"
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-8ddaed5d
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Chakra Manipulation, Acrobatics, Weapon
    Mastery (Is an adept shuriken user), Genius Intelligence, Statistics Amplification
    (Shinobi are capable of enhancing their physical capabilities with the use of
    chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance their speed by
    focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter
    71), Surface Scaling and Water Walking (By focusing chakra at the soles of their
    feet, Shinobi can scale and cling to vertical surfaces, and even walk on waterNaruto
    Chapter 18Naruto Chapter 90), Afterimage Creation, Stealth Mastery, and Speed
    Enhancement (The Substitution Jutsu allows its user to instantly replace themselves
    with a nearby object such as a tree log, plant, person, or clone at the exact
    moment they are attacked. The Jutsu works even if the user is physically restrained
    or observed by characters as observant as Sharingan or Sage Mode users. This creates
    the optical illusion of the user being hit, which confuses the opponent and gives
    them an opening to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto
    Chapter 374Naruto Chapter 580Naruto Chapter 674), Minor Illusion Creation and
    Duplication (With the Clone TechniqueRin no Sho, Page 220, Shinobi can create
    illusionary duplicates of themselves that have no physical substance), Shapeshifting
    (With the Transformation Technique, Shinobi can transform themselves into other
    people, animals, plants, and even inanimate objects, such as weapons), Paralysis
    Inducement (With the Temporary Paralysis TechniqueRin no Sho, Page 176, Shinobi
    can completely paralyze their targets from close to mid range), Air Manipulation,
    Shadow Manipulation (Can manipulate his shadow to restrain, control, or attack
    targets), Sealing (can seal people's movements with String Light Formation)
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
