- id: claim-powers-and-abilities-5378a3b0
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics (Admirals are consideredOne Piece SBS\
    \ Vol. 8 Chapter 66 to be superior toOne Piece 15th Anniversary: Dive to Grand\
    \ World Page 16 Rokushiki masters suchOne Piece Vol. 58 Chapter 567 as the Vice\
    \ AdmiralsOne Piece Vol. 69. Chapter 681, so Borsalino should haveOne Piece Vol.\
    \ 37 Chapter 347 greater physical ability than themOne Piece Vol. 37 Chapter 348)\
    \ *Large Size (Type 0; Borsalino is 3.02m tall) *Master Hand-to-Hand Combatant\
    \ (Borsalino served and trained in the NavyOne Piece Vivre Card Databook #0538\
    \ alongside Kuzan for 30 yearsOne Piece Vivre Card Databook #0357, with the latter\
    \ having been taught by GarpOne Piece Vol. 107 Chapter 1087 similarly to KobyOne\
    \ Piece Vol. 107 Chapter 1088) *Master Swordsman and Weapon Creation (Marines\
    \ are vigorously instructed in sword combatOne Piece Vol. 14 Chapter 119, with\
    \ Borsalino himself often using his sword Ama no MurakumoOne Piece Vol. 52 Chapter\
    \ 512. He was able to match Rayleigh blow for blow in a duel for an extended period\
    \ of timeOne Piece Vol. 53 Chapter 513) *Marksmanship (Borsalino has very precise\
    \ aim, seen when he was able to hit a small key across an entire warzoneOne Piece\
    \ Vol. 58 Chapter 571) *Haki (Advanced Bus\u014Dshoku- 7 Layers; Borsalino showed\
    \ the ability to emit his Bus\u014Dshoku Haki outside of his body when he used\
    \ it as a shield to protect Marineford Town from Whitebeard's Quake Wave alongside\
    \ the other two AdmiralsOne Piece Vol. 58 Chapter 564. He showed to have relative\
    \ Bus\u014Dshoku to Marineford Whitebeard when he failed to hit his true body\
    \ despite coating his attacks in Bus\u014Dshoku of his ownOne Piece Vol. 59 Chapter\
    \ 574. He also showed to have at least to good Bus\u014Dshoku Haki as SentomaruOne\
    \ Piece Vol. 108 Chapter 1091. Should be relative in Haki to Kuzan and SakazukiOne\
    \ Piece Vol. 56 Chapter 550. Intermediate Kenbunshoku; Borsalino's Kenbunshoku\
    \ Haki was shown to be relative to Sakazuki's and Kuzan's when they were all able\
    \ to sense the Whitebeard Pirates at the exact same timeOne Piece Vol. 56 Chapter\
    \ 551. Due to being an Admiral, his Kenbunshoku should be at least as good as\
    \ Issho's and superior to Koby's) * Light Manipulation, Intangibility, and Inorganic\
    \ Physiology (Elemental, Type 1 - With Pika Pika no Mi. Borsalino Devil Fruit\
    \ is a Logia Type that allows him to become, produce, and manipulate lightOne\
    \ Piece Vol. 52 Chapter 510. Due to being made of light, Borsalino can't be hurt\
    \ conventionallyOne Piece Vol. 52 Chapter 507. The only ways to counter his intangibility\
    \ are by using Haki, the element's natural counterOne Piece Road to Laughtale\
    \ Databook Vol. 3, or some type of durability negation) *Regeneration (High -\
    \ Borsalino's Devil Fruit allows him to regenerate from any damage as long as\
    \ his true body is not hit) *Extreme Heat, Energy Projection, and Explosion Manipulation\
    \ (28000\xBAC - Borsalino can fire laser-like beams and blastsOne Piece Vol. 59\
    \ Chapter 579 that contain scorching heatOne Piece Vol. 50 Chapter 485 and cause\
    \ large explosions) *Body Control, Danmaku, and Cloning (Borsalino can morph his\
    \ body around the attacks of his enemies and can also use it to shoot hundreds,\
    \ if not thousands of lasersOne Piece Vol. 59 Chapter 580. He can transform his\
    \ individual lasers into clones, and can potentially spawn thousands of clones\
    \ at onceOne Piece Vol. 108 Chapter 1093), *Shapeshifting, Camouflage, and Stealth\
    \ Mastery, and Absorption (Logia users can absorb their element in any form and\
    \ use it in several different waysOne Piece Vol. 81 Chapter 811. They can become\
    \ and attack with the new type of elementOne Piece Vol. 70 Chapter 691 as well\
    \ as use it as camouflage in it to trick their opponentOne Piece Vol. 20 Chapter\
    \ 177. Borsalino is capable of hiding within his own attacks to end up elsewhere\
    \ without his opponent knowing. He was able to bypass Luffy's Kenbunshoku Haki\
    \ by doing this) *Acrobatics, and Pseudo-Flight (Hypermobility and Self-Momentum\
    \ - Borsalino can travel far distances by turning into light and bouncing off\
    \ of them like mirrors. He can also change the direction of his movement mid-air\
    \ without coming into contact with anything else) *Damage Boost and Statistics\
    \ Amplification, (Borsalino can use his ability to enhance the speed of physical\
    \ attacksOne Piece Vol. 109 Chapter 1108. While using Yata no Kagami, he can accelerate,\
    \ increasing his speed and powerOne Piece Vol. 108 Chapter 1092) *Likely Flight\
    \ (Pseudo), Statistics Amplification (Durability and Speed), Body Control and\
    \ Damage Reduction, and Air Manipulation with Rokushiki (As a high-ranking official\
    \ in the Navy, Sakazuki was likely trained in Rokushiki just like the Vice Admirals\
    \ and Koby) Resistance to: *Light Manipulation and Heat Manipulation, (All Logias\
    \ are resistant to their respective elements) *Madness Manipulation, Mind Manipulation\
    \ and Soul Manipulation via Willpower (Through sheer willpower they can resist\
    \ losing their mind when absorbing shadows through the Kage Kage no Mi. Shadows\
    \ belonging to strong willed people are difficult"
