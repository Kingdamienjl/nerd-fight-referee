- id: claim-weaknesses-88c9df9d
  section: weaknesses
  axis: weakness
  text: "Standard Devil Fruit users weaknesses. He must leave his light state to physically\
    \ attack, he needs to create a mirror path (Yata no Kagami) in order to travel\
    \ at lightspeed unless he travels in a straight path, and cannot change his course\
    \ when traveling at that speed. Takes a few seconds for him to enter his light\
    \ state. When he is not taking a fight serious he often spaces out and ignores\
    \ his opponenthttps://imgur.com/a/gjlKN7m Notable Attacks/Techniques: Haki: There\
    \ are normally two types of Haki standard people can tap into: the Kenbunshoku\
    \ Haki which allows individuals to sense the presence of others, and Bus\u014D\
    shoku Haki which allows individuals to create an invisible armor around them.\
    \ There is, however, a third type of Haki, Ha\u014Dshoku Haki, that only a few\
    \ individuals can use. Kizaru is not one of these people. *Bus\u014Dshoku Haki\
    \ (Color of Armaments): Kizaru is shown using this type of Haki, but his level\
    \ of application is unknown. He had created a wall with the other Admirals to\
    \ block a quake from Whitebeard, which is an application of Goken, thus he should\
    \ be highly proficient or even advanced in its level of application. *Kenbunshoku\
    \ Haki (Color of Observation): Kizaru is confirmed to be a user of Kenbunshoku\
    \ Haki, but his level of application is never explored. He should at least have\
    \ an adept if not highly proficient level of application. Pika Pika no Mi (Glimmer\
    \ Glimmer Fruit): A Logia type Devil Fruit, this fruit allows the user to transform\
    \ into light at will as well as control it. It also enables him to move at the\
    \ speed of light and transport himself by means of reflection. The fruit's major\
    \ strengths, like other Logia types, allows the user to become the element they\
    \ control. From this, Kizaru is able to utilize light based attacks such as explosive\
    \ lasers. The elemental state the ability endows him with also allows him to avoid\
    \ conventional attacks as they only disperse him. It is likely that he can be\
    \ reflected like ordinary light while in light form. He is also extremely accurate\
    \ with his abilities, able to hit the key to Ace's handcuffs from a far distance.\
    \ center|300px *Yata no Kagami (Eight Span Mirror): Borsalino forms light in between\
    \ his hands, and reflects it off any surface he wishes. He then transforms into\
    \ the light in order to get to his desired location. center|300px *Ama no Murakumo\
    \ (Sword of the Gathering Clouds of Heaven): Borsalino forms a long, very sharp\
    \ sword out of light and solidifies it, similar to Admiral Aokiji's \"Ice Saber\"\
    \ technique.center|300px *Amaterasu (Heavenly Illumination): Borsalino points\
    \ his index and middle finger into the air or at his enemies (in the form of a\
    \ peace sign), and emits a powerful flash of light, blinding his opponent, or\
    \ any enemies in the vicinity thumb|center|358px *Yasakani no Magatama (Eight\
    \ Shaku Curved Jewel): Borsalino uses both hands to fire a torrent of deadly light\
    \ particles, causing extreme damage to whatever they hit. Borsalino can control\
    \ the spread of the attack, limiting it to a single person or covering a wide\
    \ area. It also has great piercing powers, penetrating a thick layer of ice and\
    \ then entering deep into the water with ease.center|300px *Laser-beams: Not a\
    \ named technique, and appears to be a generic attack by Kizaru. He shoots a laser-like\
    \ beam from his fingers, or feet (beyond situational preference, it doesn't seem\
    \ to matter for him where he shoots his lasers from) which possesses exceptional\
    \ piercing power and explodes when it strikes the ground (so far hasn't been shown\
    \ to explode upon hitting a human, as it has pierced right through everyone it\
    \ has hit). Kizaru foot.gif|Foot Laser Kizaru finger.gif|Finger Laser ==Gallery==\
    \ Borsalino aka admiral kizaru by bodskih-dbcd3u4.png child kizaeu.png|Borsalino\
