- id: claim-weaknesses-cf5d0de2
  section: weaknesses
  axis: weakness
  text: 'Dynamo is prone to arrogance and treats most fights as if they were for sport,
    Rarely getting serious until he''s on the verge of defeat. He is susceptible to
    Wing Spiral, W-Shredder, Meteor Rain and the Ensuizan Notable Attacks/Techniques:
    *D Blade: Dynamo throws his saber at the current location and it boomerangs back
    to him. He can also spin his saber to use it as a shield. **D Blade Kai: Dynamo
    throws three to five spinning blades at his target over few seconds, the blades
    will boomerang back to Dynamo. If the enemy attacks one of the blades, the blade
    will fly off the screen. **D Blade Ran: Dynamo jumps to the center of the battlefield
    and spins his saber in front of him, firing up to eight spinning blades which
    can either return to him, keep flying in their general direction, or home in on
    the specified target. *Tsubame Gaeshi: Dynamo jumps up and quickly swings his
    saber downward. *Trick Shot: Dynamo jumps up and shoots straight down. The blast
    will split when it reaches the ground and the two new blasts will move horizontally
    until they leave the arena. *Earth Gaizer: Dynamo jumps to the edge of the arena
    and charges energy in his hand. He then slams his fist into the ground three times,
    lasers will fall from the sky to the floor between each fist slam. **Earth Gaizer
    Kai: Dynamo jumps to one side of the screen and punches the ground causing lasers
    to shoot up in front of him. ==Notable Matchups== Victories: Losses: Inconclusive:
    Category:Mega Man Category:Game Characters Category:Game Bosses Category:Robots
    Category:Antagonists Category:Neutral Characters Category:Energy Users Category:Characters
    Category:Mercenaries Category:Villains Category:Self-Sustenance Users Category:Reploids
    Category:Video Game Characters Category:Sword Users Category:Weapon Masters Category:Inorganic
    Beings Category:Regeneration Users'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
