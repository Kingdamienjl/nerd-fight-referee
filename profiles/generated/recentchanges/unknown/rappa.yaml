- id: claim-powers-and-abilities-0d08467f
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Supernatural Willpower (Since she was\
    \ just a baby, Rappa could endure having her skin, muscles, and bones\u2014every\
    \ part of her body\u2014eroded, destroyed, and reconstructed daily for 10 years.\
    \ She could also withstand powerful electrical currents that felt like thousands\
    \ of needles piercing her flesh, along with the sensation of countless bombs exploding\
    \ within her body) *Extrasensory Perception (Enhanced Sight) & Enhanced Senses\
    \ **(Neutral Vision & Soul Vision; Can see soulsThe Stars Are Cold ToysGhost of\
    \ the PastSpecies of the Galaxy: Wubbaboo) **(Enhanced Hearing; Due to past experimentation\
    \ being done on her, Rappa gained super hearing that allows her to hear countless\
    \ sounds, including being able to clearly hear whispersThe Men Who Tread on the\
    \ Monkey's Tail and even the death of protons.) ***Telepathy (Rappa can hear the\
    \ thoughts of othersAn Andalusian Monkey) ***Limited Cosmic Awareness (Rappa's\
    \ super hearing allows her to hear events outside the Dreamscape, spanning the\
    \ entire Asdana Galaxy, even while she is inside a dreamBattles Without Ninja\
    \ and Humanity) *Non-Physical Interaction **(Spiritual, Mental & Information\u3010\
    Type 2\u3011; Can interact with souls) **(Energy; Can interact with a Stellaron\
    \ which is composed of pure energy.Data Bank Terms: Cancer of All Worlds (Phenomenon)\
    \ Can interact with Heliobi - beings composed entirely of pure energyList of Archenemies\
    \ - Abomination Scroll: HeliobiSeat of Divine Foresight - File Repository: Nemesis\
    \ \u2014 Abomination: Heliobi) **(Memories; Should be able to interact with memories\
    \ like Fu XuanTotal Recall) **(Data; Can interact with Aether Spirit which are\
    \ composed of dataAetherium Wars) **(Abstractions\u3008Type 2\u3009\u300CConcept\u3008\
    Type 3:\u3010Vision\u3011,\u3010Sight\u3011&\u3010Death\u3011\u3009; Can affect\
    \ Allseer, which embodies the concepts of vision and sightVersion 2.0 If One Dreams\
    \ At Midnight Special Program as well as Something Unto Death, which is a sort\
    \ of figurative amalgam of complex concepts, which for now is known as death)\
    \ *Expert Shuriken and Blade User (Rappa possess a great mastery over her Shuriken\
    \ skills, plus she can split her triple-bladed Shuriken into individual blades\
    \ which she can use in a very skillful way for assassinations) *Weapon Control\
    \ (Rappa is able to effortlessly control her triple-bladed Shuriken named Demonbane\
    \ Petalblade, and even if she throws her Shuriken too far away or it bounces off\
    \ to an unwanted direction, it will automatically return to her, furthermore,\
    \ Rappa can also split her triple-bladed Shuriken apart to wield the individual\
    \ blades like short swords and manipulate them as flying and deadly weapons without\
    \ the need to touch them, being able to attack her opponents from multiple directions\
    \ using unpredictable movementsKeeping up with Star Rail \u2014 Rappa: Whiteowl\
    \ Ninja's Bursting Scroll | Honkai: Star RailRappa Trailer \u2014 No Dazzle, No\
    \ Break | Honkai: Star RailAnimated Short: Cosmic Ninjutsu Inscriptions \u2014\
    \ Havoc Exorcism: Lunar Vileslayer Scroll) *Acrobatics (All Types; As a \"Ninja\"\
    , Rappa is incredibly acrobatic. She can effortlessly slide down a building while\
    \ controlling her speed to launch attacks, perform flips and spins, and weave\
    \ between her enemies' attacks) *Martial Arts (Rappa has been training since she\
    \ was young on her martial arts) *Hacking (Rappa can hack into systems by spraying\
    \ digital and permanent graffiti, causing them to crash) *Imaginary Energy (Hunt)\
    \ & Honkai Energy (Low-Level; As a Pathstrider of HuntData Bank Factions: Galaxy\
    \ Rangers \u2014 Hunt) *Space Survival & Flight (Galaxy Rangers can fly through\
    \ spaceAnd on the Eighth Day) *Shapeshifting (Rappa can shapeshift herself into\
    \ a immobile and unopenable treasure chest) *Creation, Organic Manipulation, Homing\
    \ Attack & Explosion Manipulation (Rappa can create multiple cans of spray paint\
    \ that hone in on their target to create a massive explosion) *Limited Platform\
    \ Creation (Rappa can use her Shuriken named Demonbane Petalblade as a platform\
    \ to slide across the floor and travel faster) *Durability Negation, Soul Manipulation,\
    \ Mind Manipulation, Information Manipulation (Type 2) & Perception Manipulation\
    \ (Vision, Hearing, Touch, Olfactory & Taste; Rappa can bypass the physical body\
    \ and directly attack a person's soul,HoYoLAB: Character Preview | Rappa severing\
    \ her opponent's five senses in the process. A person's soul is regarded as their\
    \ mind and is composed of fundamental information, the latter that shapes reality\
    \ and life as a line of code) *Passive Probability Manipulation (When one walks\
    \ on a Path their various possibilities collapses into a single entityLoading\
    \ Screen - Eidolons) *Imaginary Energy & Honkai Energy (Low-Level) *Antimatter\
    \ Manipulation (Can resist the effects from Reavers whose bodies are completely\
    \ made out of antimatterData Bank: Enemy Creatures - Voidranger: Reaver) *Electricity\
