- id: weaknesses-immunity-to-magic-and-not-even-the-strongest-magician-of-the-modern-e
  name: 'immunity to magic, and not even the strongest magician of the modern era,
    wielding a fivefold Al-class spell, can bring '
  description: "immunity to magic, and not even the strongest magician of the modern\
    \ era, wielding a fivefold Al-class spell, can bring any harm upon Alter. Complementing\
    \ the dragonscales, this is the magical aspect of the ultimate lifeform's ultimate\
    \ defense. Magic: Aldebaran was imparted with the extensive magical knowledge\
    \ of his Teacher, making him aware of practically every spell in existence. Despite\
    \ this, he never could use it with his inferior talents\u2014 until his Memories\
    \ hijacked the Divine Dragon's dragonhusk, creating Alter. With the enormous mana\
    \ pool and superior Gate of the legendary Dragon, Alter could now fully utilize\
    \ his magical knowledge without restriction. *Al Shario: The highest tier of Shario,\
    \ it is a Forbidden Art that allows Alter to literally bring the stars down to\
    \ earth. By manipulating the attraction between mana of the same type, a star\u2014\
    \ which is a mass of mana equal to a Great Spirit's, suspended in the night sky\u2014\
    \ can be pulled down to massacre his target. According to the Witch who created\
    \ the spell, this is the absolute pinnacle of destructive acts in this era, surpassing\
    \ even dragonbreath. *Ol Shamak: A Forbidden Art of the Yin attribute developed\
    \ by Echidna, it is unknown where this spell ranks alongside the other tiers of\
    \ Shamak. It is an anti-Witch trump-card which seals the target's body in a contradictory\
    \ black light, and ceases the function of their Gate. This spell does not reach\
    \ its full potential unless used on a target that was granted power by a Witch\
    \ Factor, the effect of the spell being far greater and sealing the target in\
    \ a small black orb. *Al Goa: The highest tier of Goa. It is a Fire attribute\
    \ spell that allows Alter to create an enormous, all-consuming fire, scorching\
    \ eventide to ash. The flames are so powerful that they turned a region of the\
    \ Sand Sea into glass, and suffocate anyone who can avoid being scorched to charcoal\
    \ by burning away all nearby oxygen. *Arrow of Indra: A high-level spell requiring\
    \ careful application of the four basic magic attributes. By using the temperature\
    \ gradient between Fire and Water Magic to create thunderclouds, and then using\
    \ Earth and Wind Magic to apply an electrical charge to his target, Alter causes\
    \ bolts of lightning to rain down upon them. This utilizes the same principle\
    \ as lightning rods, but without redirecting any energy into the ground. *Al Karum:\
    \ The highest tier of Karum. It is a Yin attribute spell that allows Alter to\
    \ create a field of super-gravitational force which multiplies the weight of thos"
