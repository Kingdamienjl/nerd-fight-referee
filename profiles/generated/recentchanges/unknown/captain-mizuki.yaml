power_scale:
  tier:
    text: At least 9-B
    source_ids:
    - vsbattles-captain-mizuki-unknown
    confidence: 0.6
  attack_potency:
    text: At least Wall level (Rhino Wrestler rated her attack power at 30 points,
      while four other A-Class Heroes got lower points. Demolished a couple of monsters
      with her grip strength. Swung a monster so hard it decapitated another monster
      she hit with it. Able to penetrate concrete with her javelin throw. Should be
      far superior to an unexceptional 12 year old like Saitama, who could survive
      this)
    source_ids:
    - vsbattles-captain-mizuki-unknown
    confidence: 0.6
  speed:
    text: Unknown, At least Superhuman (Can easily react to incoming attacks with
      her back turned. Ran an unknown yet fairly far distance before a couple of monsters
      could land a close ranged tackle. Ran and jumped over several guys to catch
      a ball before it fell to the ground. Used to be a world class track and field
      athlete)
    source_ids:
    - vsbattles-captain-mizuki-unknown
    confidence: 0.6
  lifting_strength:
    text: Class 5 (Lifted a large concrete pillar. Lifted a gigantic monster up and
      swung it several meters across hard enough to knock over 7 other large monsters,
      one of them even having their eyeball fall out from the hit)
    source_ids:
    - mediawiki-2051844
    confidence: 0.95
  striking_strength:
    text: At least Wall level
    source_ids:
    - mediawiki-2051844
    confidence: 0.95
  durability:
