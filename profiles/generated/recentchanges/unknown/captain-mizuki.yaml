      Level Rhino Wrestler and landing elbow first onto concrete without any serious
      injury. Got stomped on multiple times by a monster with sharp claws on its feet
      while off guard and only received slight pain)
    source_ids:
    - vsbattles-captain-mizuki-unknown
    confidence: 0.6
  stamina:
    text: Superhuman (Fought against numerous monsters without tiring. Won multiple
      championship metals in track and field. She seems to have issues reserving her
