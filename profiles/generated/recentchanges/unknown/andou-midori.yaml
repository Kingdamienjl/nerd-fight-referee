  intelligence:
    text: 'Average Standard Tactics: Andou is a psychopathic war veteran that has
      the tendencies of causing misery and hurting others for no reasons. It is known
      that Andou takes great pleasure in killing, torturing and hurting the weak,
      and if he''s ever met faced to faced with someone who is stronger or equal to
      him in terms of power, he would instantly complains, and brags of how he hates
      those kinds of peoples who are superior to him, and soon jumps into using dishonorable
      and cowardly tactics in hopes he could kill those peoples. His cruelty and sadism
      isn''t limited to people, as during his reintroduction in Part 2, he had just
      finished brutally killing serveral dogs and puppies. In-short, Andou is a remorseless,
      cold, violent, merciless, callous, yet cowardly and hypocritical man.'
