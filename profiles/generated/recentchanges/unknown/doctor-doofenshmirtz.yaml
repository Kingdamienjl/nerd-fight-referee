power_scale:
  tier:
    text: physically. Varies from to with most inventions, with Accelerateinator and
      Do-Over-Inator
    source_ids:
    - vsbattles-doctor-doofenshmirtz-unknown
    confidence: 0.6
  attack_potency:
    text: City Block level physically (Has occasionally fought against Perry the Platypus,
      who can harm him). Varies from Below Average Human level to City Block level
      with most inventions (With preparation time, Doofenshmirtz has been able to
      create many devices and machines that could harm him), Universe level+ with
      Accelerateinator and Do-Over-Inator (Capable of destroying spacetime, if they
      malfunction)
    source_ids:
    - vsbattles-doctor-doofenshmirtz-unknown
    confidence: 0.6
  speed:
    text: High Hypersonic+, possibly Sub-Relativistic (He can keep up with Perry in
      a fight)
    source_ids:
    - vsbattles-doctor-doofenshmirtz-unknown
    confidence: 0.6
  lifting_strength:
    text: Average Human
    source_ids:
    - mediawiki-551421
    confidence: 0.95
  striking_strength:
    text: City Block level
    source_ids:
    - mediawiki-551421
    confidence: 0.95
  durability:
    text: City Block level (Tanked the upper portion of his building exploding and
      was more frustrated than anything else. Survived an enormous ball of aluminum
      foil colliding with him. Doofenshmirtz has survived building-destroying explosions
      point blank numerous times, and has also been shown to survive getting stomped
      on by a skyscraper-sized robot capable of smashing large buildings, and casually
      ripping towers out of the ground)
    source_ids:
    - vsbattles-doctor-doofenshmirtz-unknown
    confidence: 0.6
  stamina:
    text: Superhuman (Can still go on in a fight even after receiving several burns
      all over his body)
    source_ids:
    - vsbattles-doctor-doofenshmirtz-unknown
    confidence: 0.6
  range:
    text: Standard Melee Range physically, up to Interdimensional with preparation
      time (He can travel to parallel universes)
    source_ids:
    - vsbattles-doctor-doofenshmirtz-unknown
    confidence: 0.6
  intelligence:
    text: "Supergenius in terms of technological prowess (He has singlehandedly created\
      \ a wide variety of machines that he usually names \u201C-Inators\u201D, which\
      \ have proven to be able to warp reality in virtually any manner that he wants,\
      \ including the Do-Over-Inator, which can create a time-loop that slowly corrupts\
      \ and warps the space-time continuum), usually Below Average in terms of common\
      \ sense (For example, he couldn't recognize Perry the Platypus until the latter\
      \ put a hat on his head, and constantly places self-destruct buttons on virtually\
      \ all of his machines)"
    source_ids:
    - vsbattles-doctor-doofenshmirtz-unknown
    confidence: 0.6
