- id: claim-powers-and-abilities-6af3542f
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Genius Intelligence, Martial Arts (able
    to fight against Perry the Platypus in Hand to Hand), Broadway Force. With preparation
    time, he has access to: Energy Manipulation, Energy Projection (Numerous of his
    inventions shoot out standard energy blasts), Reality Warping, Spatial Manipulation,
    Matter Manipulation, Physics Manipulation, Transformation, Magnetism Manipulation,
    Deconstruction, Age Manipulation, Mind Manipulation, Duplication, Biological Manipulation,
    Animal Manipulation, Heat Manipulation, Plant Manipulation, Water Manipulation,
    Sound Manipulation, Dimensional Travel, Clairvoyance (Can locate monster trucks),
    Size Manipulation, Ice Manipulation, Explosion Manipulation (World''s Largest
    Firecracker), Empathic Manipulation, Transmutation, Time Manipulation, Time Travel
    (Can travel through time with the Time Travelinator, which runs off of "time juice"),
    Technology Manipulation (Removing videos, blocking broadcasts, Pop-Up-inator,
    etc.), Air Manipulation, Morality Manipulation, Fusionism, Memory Manipulation,
    Fragrance Manipulation, Life Manipulation, Invisibility, Cloth Manipulation, Static
    Electricity Manipulation, Social Influencing (Several of his inators are made
    to influence the population through non-Mind Manipulation means), Earth Manipulation,
    Enhanced Senses (Tracking Device/Camera Bot), Thread Manipulation, Gravity Manipulation,
    Weather Manipulation, Status Effect Inducement (Least Likely-inator, Eat-It-All-Inator,
    etc.), Probability Manipulation, Teleportation, Hair Manipulation, Paper Manipulation
    (Confetti-inator), Sense Manipulation (Eye-Fog-Inator), Fear Manipulation and
    Subjective Reality (Worst-Fear-inator), Shapeshifting (Impression-Inator), Passive
    Restoration (After each episode ends, the storyline will be reset in the following
    episodes)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
