- id: claim-weaknesses-f645f46e
  section: weaknesses
  axis: weakness
  text: 'Old age. Extended use of the cursed seal causes his body to deteriorate,
    and can also weaken his regeneration, which can cause permanent damage to his
    body, such as the loss of his right leg and right eye. Notable Attacks/Techniques:
    *Self-Healing Technique: The Self-Healing Technique consists of a specific type
    of saiseijutsu that gives its users the ability to heal from injuries in an instant.
    Victor had powerful regenerative abilities at his disposal, to the point that
    he could instantly regrow his arms and even his head unfazed. *Blood Manipulation:
    Through an unknown technique, Victor showed the ability to manipulate his own
    blood and use it as tendrils to retrieve lost limbs and reattach them. *Arm Growth
    Technique: From the shoulders, the user is able to create an extra set of muscular
    arms of varying size. From these arms, the user can shield himself from ninjutsu,
    form hand seals, and even provide extra mobility to move about and scale terrains.
    *Wind Release: **Great Balloon: The user gathers an enormous amount of wind and
    creates a massive twister. Its power can easily repel two men a considerable distance
    away. The hand seals for the technique differ depending on which direction the
    user gathers wind. *Lightning Release: **Heavenly Formation Lightning: The user
    strikes with lightning bolts. The bolts can be produced either from storm clouds
    or the user themselves. Additionally, the bolts can be channelled through structures
    so as to strike at targets from multiple sources. *Earth Release: **Rupturing
    Earth Palm: The user places their hands on the ground. It will then create ruptures
    leading towards the targets. From there, the said ruptures will expand to collapse
    the ground around the targets, making them drown down under it. **Dust Storm:
    The user slams their hands on the ground, generating a large amount of soil. It
    is then launched and manipulated towards the opponent as a fast wave with crushing
    force. *Fire Release: **Great Fireball Technique: The user kneads chakra in their
    body and turns it into fire, which they then expel from their mouth; the more
    chakra they use, the more flames that are produced. Sometimes the flames lack
    a distinct shape, being only a stream, but more often than not they take the form
    of a giant orb that maintains its shape until hitting a target. Upon impact, the
    fireball is powerful enough to crater the ground and vaporise the surroundings.
    Against living targets, the fireball can cause extensive burns. **Fire Release:
    Great Flame Flower: Kneading his chakra and then converting it to fire, the user
    creates a multitude of fireballs at the same time which then rain down on the
    target causing severe, widespread damage around the field. *Water Release: **Water
    Formation Wall: The user spits a stream of water from their mouth at the ground,
    which circles around them and rises upward to create a wall. If the user is standing
    on a body of water, they can instead create the wall from the surroundings. The
    water wall defends anyone within its perimeter from attack, with the wall''s strength
    being determined by how much of the user''s chakra is put into it. Users control
    how long the wall lasts as well as how much water it''s made with. Because the
    water is clear, the wall doesn''t obstruct the user''s vision, allowing them to
    make their next move uninhibited. The wall''s initial formation, if timed correctly,
    can be used to fend off opponents, flinging them away as the wall rises. * Genjutsu
    Communication: This technique is a projection-type genjutsu which is used to meet
    with multiple people at once. It is used to compensate for the fact that a group
    may not always be in close proximity. All the images projected by this technique
    appear corporeal and even the immediate surroundings can be altered by the user.
    Wind Release Great Balloon.gif|Wind Release Great Balloon Down Combo (Earth Release
    Dust Storm).gif|Earth Release Dust Storm Fire Release Great Flame Flower.gif|Fire
    Release Great Flame Flower Water Release - Water Formation Wall.gif|Water Release
