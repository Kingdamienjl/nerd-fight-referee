  intelligence:
    text: Genius (Shinichi is a well-known amateur sleuth who solves difficult and
      unthinkable cases that often involve serious injury or murder. He is a recognized
      genius with an eidetic memory. He is very good at forensic science, has perfect
      pitch, and knows a lot of random facts, dates, and other things because he reads
      a lot. This allows him to easily disarm any explosives in the series, read inconsistencies
      in criminal testimony, and figure out motives based on the music played during
      the murders. He is also known to "bluff" by giving suspects false information
      to get more information, which shows that he knows a lot about criminal psychology.
      He is also very good at English, translating for an American diplomat with no
      apparent problems. He has matched wits with Kaitou Kid, who has an IQ of 400
      and has evaded police custody by using a variety of visual and auditory illusions.
      Shinichi isn't just brilliant; he also knows how to use guns and has an excellent
      spatial awareness with a soccer ball because he loves the sport. This allows
      him to hit moving targets with small objects by bouncing them off walls and
      other objects. He is also a skilled acrobat, being able to swing from tree to
      tree and jumps considerable distances to escape onlookers)
    source_ids:
    - vsbattles-conan-edogawa-unknown
