- id: claim-weaknesses-a45b5fa7
  section: weaknesses
  axis: weakness
  text: 'Is less effective without a deep body of water nearby (requires abundant
    amounts of water to spam her ice attacks), but can compensate somewhat with the
    water in the atmosphere. Armed Phenomenon form unusable outside of water. Is more
    susceptible to fire attacks. Will ignore important objectives in favor of fighting
    strong opponents like Zero. Notable Attacks/Techniques: *Spear Shot: Can fire
    the tip of her spear as a homing projectile. She seems to have an inexhaustible
    supply of them, leaving her free to pelt her foes from a distance. *Hyorin: Twirls
    her spear rapidly to create rings of snow and ice that momentarily acts as a shield
    before being shot as a projectile, freezing foes on contact. *Hyoryu: Her EX Skill.
    She is able to create homing projectiles in the shape of dragons out of ice, which
    lock onto a target and seek them until they''re destroyed or if they run into
    a wall. They freeze foes upon contact, leaving them vulnerable to additional attacks.
    In her Armed Phenomenon form, she fires multiple copies at once to try and trap
    a target before ramming them. *Ice Platform: She can create ice platforms to quickly
    slide down ledges or impede enemy movement. *Armed Phenomenon: Like her fellow
    Guardians, she is able to transform herself into a massive Mechaniloid-like creature
    to reach the limits of her firepower. In her case, she becomes a manta ray-shaped
    submarine that fires off torpedoes and multitudes of ice dragons to trap her targets
    as well as ram into them for physical damage. *Ice Beam: In her Armed Phenomenon
    form she is able of shooting a blue beam from the gem on her head, instantly freezing
    the surrounding water which can cause snowflake-shaped projectiles to rain down
    on foes which freeze on contact or erupt into ice spikes if they hit a floor.
    She can also use it to create arrow-shaped projectiles that bounce off nearby
    surfaces. ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters
    Category:Mega Man Category:Water Users Category:Ice Users Category:Female Characters
    Category:Antagonists Category:Game Bosses Category:Spear Users Category:Weather
    Users Category:Robots Category:Energy Users Category:Good Characters Category:Leaders
    Category:Transformation Users Category:Self-Sustenance Users Category:Absolute
    Zero Users Category:Reploids Category:Video Game Characters Category:Game Characters
    Category:Longevity Users Category:Weapon Masters Category:Inorganic Beings'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
