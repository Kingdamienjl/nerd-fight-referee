power_scale:
  tier:
    text: High 6-C, Higher with Spirit Origin Ascension, Far Higher with Thunderer
    source_ids:
    - vsbattles-billy-the-kid-fate-unknown
    confidence: 0.6
  attack_potency:
    text: 'Large Island level+ (While alone and surrounded, killed anywhere from one
      hundred to three hundred Oprichniki, who are as strong as a Servant while close
      to Ivan. Implied that in an open space, he could fight Musashi in equal groundsFate/Grand
      Order Part 2: Anastasia), Small Country level with Spirit Origin Ascension (Thanks
      to Da Vinci''s modifications, Billy managed to ascend his Spirit Origin to the
      next level, giving his gun 3 times the firepower), Higher with Thunderer (C-Rank
      Noble Phantasms like Triple-Linked Crane Wings are able to produce A-rank Attacks,
      which are able to bypass God Hand. As a C++ Rank Noble Phantasm, Thunderer should
      be able to deal this much damage)'
    source_ids:
    - vsbattles-billy-the-kid-fate-unknown
    confidence: 0.6
  speed:
    text: Relativistic+ with FTL reactions and combat speed (Can keep up with other
      Servants), Higher with Thunderer (His Noble Phantasm slows down time for his
      surroundings and perceptions, thus increasing his combat speed to compensate
      for his target's speed. In addition, his quick draw skill is supposed to make
      it so he can always draw before his enemy attacks him with time to spare)
    source_ids:
    - vsbattles-billy-the-kid-fate-unknown
    confidence: 0.6
  lifting_strength:
    text: Class M (Comparable to Martha who stopped a speeding train, Achilles who
      stopped a rolling 300 ton jumbo jet, and Asterios who swam carrying the 100-150
      ton Golden Hind galleon ship while injured, and Jeanne who can spin an entire
      airplane)
    source_ids:
    - mediawiki-384602
    confidence: 0.95
  striking_strength:
    text: Large Island level+
    source_ids:
    - mediawiki-384602
    confidence: 0.95
  durability:
    text: Large Island level+ (Is rather poorly armored for a Servant, but he managed
      to survive his fight with Diarmuid)
    source_ids:
    - vsbattles-billy-the-kid-fate-unknown
    confidence: 0.6
  stamina:
    text: Virtually Infinite for as long as he has sufficient mana
    source_ids:
    - vsbattles-billy-the-kid-fate-unknown
    confidence: 0.6
  range:
    text: Tens of Meters with Thunderer
    source_ids:
    - vsbattles-billy-the-kid-fate-unknown
    confidence: 0.6
  intelligence:
    text: Billy the Kid is one of the most legendary outlaws of the Wild West and
      his death was thought to have heralded the end of it. Despite being a relatively
      recent Heroic Spirit, he is still able to take on Servants who outstrip him
      entirely in terms of parameters with nothing but his wits and his famous quickdraw
      technique that carved his name into history in the first place.
    source_ids:
    - vsbattles-billy-the-kid-fate-unknown
    confidence: 0.6
