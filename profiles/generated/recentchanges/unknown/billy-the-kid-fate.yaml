- id: claim-weaknesses-6ad1e2c3
  section: weaknesses
  axis: weakness
  text: Cannot fight while in Spirit Form. Billy's Thunderer rounds can be shot down
    mid-flight. He lacks training in hand-to-hand combat. Even though his Noble Phantasm
    will always give him time to react to an opponent's actions, it does not mean
    he can necessarily respond to said actions. If the oncoming attack is too absolute,
    then he may still not be able to dodge or counter-attack in time, thus it can
    only work against attacks that he can actually dodge.
  source_ids: *id002
