- id: claim-weaknesses-b796b0e3
  section: weaknesses
  axis: weakness
  text: "Subaru is physically weak and has to rely on allies for support. Subaru can\
    \ only return to his latest \"save point\" after death and cannot control when\
    \ the save points are set. He also experiences intense trauma with each death\
    \ which can cause him great psychological distress. For this reason, he tends\
    \ not to rely on \"Return by Death\", using it only as a last resort. Invisible\
    \ Providence causes him enormous pain, thus can't be used continuously. Subaru's\
    \ Gate \u2014 the organ which takes in and expels Mana in one's body\u2014 was\
    \ damaged due to overuse without proper training and therefore he can only use\
    \ magic in tandem with his contracted spirit Beatrice. Notable Attacks/Techniques:\
    \ *Return by Death: An Authority which returns Subaru to an unspecified, unpredictable\
    \ and uncontrollable \"save point\" after his death. It activates instantly after\
    \ his life is taken, there's no lag between the point of death and the point of\
    \ resurrection, and there is supposedly no limit to how many times he can return.\
    \ This Authority allows Subaru an endless amount of second chances, as he can\
    \ recall the events of previous loops he has died in, inherently knowing what\
    \ will happen and the rough actions the people around him will take, almost like\
    \ a form of precognition. As he usually tries to do different things every time\
    \ he returned to life, Subaru is able to gather more intel on how his allies and\
    \ opponents behave under specific conditions, allowing him to predict their movements\
    \ and plan strategies accordingly. Subaru is not allowed to reveal this ability\
    \ to anyone and there are penalties for attempting to do so or if anyone is to\
    \ find out about it. Usually when he tries to speak about it Satella forcibly\
    \ silences him by grasping his heart, but if Subaru attempts to reveal his ability\
    \ irrespective of this penalty, she will find another appropriate punishment,\
    \ such as when she killed Emilia when Subaru was dead set on telling her. If anyone\
    \ is to discover the ability on their own, Satella will appear herself in order\
    \ to rectify it, such as when she attacked the Pleiades Watchtower when Rui gained\
    \ knowledge of Subaru's Authority by eating his memories, though it should be\
    \ noted that simply knowing that Subaru can redo events through some unknown means\
    \ will not trigger this penalty, as can be seen in Roswaal's case. Every time\
    \ he Returns by Death or triggers the penalty, the Witch's miasma, that attracts\
    \ Witchbeasts, looming around him grows stronger. Subaru can however use these\
    \ penalties to his advantage- such as when Petelgeuse attempted to possess him,\
    \ Subaru began to reveal his power to the invading spirit and Satella appeared,\
    \ which forced Petelgeuse out, or the many times Subaru has used himself as a\
    \ decoy to lure Witchbeasts into traps. *Shamak: Shamak allows the user to be\
    \ able to trap their opponents in an area of darkness that seperates their senses\
    \ from their body. The targets become unable to sense where they are; however,\
    \ they can still feel the ground and understanding what's happening to their body.\
    \ After abusing this spell too much Subaru caused his Gate to collapse, and he\
    \ is no longer able to use it or any magic unless through Spirit Arts with Beatrice.\
    \ *Authority: Subaru is currently in possession of two other Authorities beside\
    \ Return by Death, Sloth and Greed: **Invisible Providence: His Authority of Sloth\
    \ allows Subaru to create an invisible force field in the shape of a hand, an\
    \ oddly similar ability to the previous user. He acquired this Authority from\
    \ the Sloth Witch Factor which previously belonged to Petelgeuse. However he is\
    \ only able to control one hand, and using the Authority causes extreme physical\
    \ backlash. **Cor Leonis: His Authority of Greed which functions as an inverse\
    \ form of the previous holder of Greed, Regulus', \"Little King\"- which Subaru\
    \ manifested in Arc 6. As such, it works inversely to how Little King does, in\
    \ which Subaru takes on the burdens of others, either physical or mental, and\
    \ transfers them to himself temporarily in exchange for an increase in their combat\
    \ abilities. It seems that it only works on people who Subaru has a strong emotional\
    \ connection, whom he can perceive through points of light when the Authority\
    \ is active. Subaru can use it to derive the relative location of allies and their\
    \ emotional states. *Spirit Arts User: Subaru is contracted with the Artificial\
    \ Spirit Beatrice which allows him to take advantage of her vast array of magic\
    \ spells and lets them use unique original magics: **Shamak: A basic Yin Magic\
    \ spell that allows the user to be able to trap their opponents in an area of\
    \ darkness that seperates their senses from their body. The targets become unable\
    \ to sense where they are; however, they can still feel the ground and understanding\
    \ what's happening to their body. Beatrice's Shamak is potent enough to destroy\
    \ all 5 of a target's senses while active. **El Shamak: The target becomes unable\
    \ to form thoughts, and their will to fight is robbed from them. **Ul Shamak"
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
