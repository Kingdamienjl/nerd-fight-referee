  axis: hax
  text: Superhuman Physical Characteristics, Weapon Mastery, Stealth Mastery, Acrobatics,
    Chakra Manipulation, Electricity Manipulation, Statistics Amplification (Shinobi
    are capable of enhancing their physical capabilities with the use of chakra. The
    Shunshin no Jutsu allows Shinobi to greatly enhance their speed by focusing chakra
    in their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface
    Scaling and Water Walking (By focusing chakra at the soles of their feet, Shinobi
