- id: claim-weaknesses-890e94ef
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques: *Shadow Clone Technique: Omoi creates\
    \ tangible \u201Cshadow clones\u201D that can fight and use his techniques, but\
    \ disappear after one definite hit. Any information and experience the clones\
    \ gained are transferred to Omoi upon their dispersal. *Lightning Release: Shadow\
    \ Clone Technique: This technique allows the user to make a shadow clone infused\
    \ with lightning. Because it is a shadow clone, it is able to perform techniques\
    \ and interact with the environment. If the clone is injured, it will revert to\
    \ its natural lightning-state, at the same time electrocuting whatever makes contact\
    \ with it. Unlike a regular shadow clone, however, it does not send chakra back\
    \ to the user upon reverting to lightning. *Cloud-Style Crescent Moon Beheading:\
    \ The user swings their sword in a single, large, crescent moon-shaped arc, which\
    \ occurs with such ferocious velocity that the technique can be employed in situations\
    \ where only a very limited time to react is available. The swing can be used\
    \ to counter attacks from multiple opponents simultaneously. *Cloud-Style Deception\
    \ Beheading: Using the Body Replacement Technique to feign being attacked, the\
    \ user takes advantage of their opponent's momentary shock, and charges forward\
    \ with a lateral sword slash. *Cloud-Style Reverse Beheading: The user does a\
    \ powerful spin, generating the momentum needed to slash at any opponents behind\
    \ them. The user can also utilize this spinning motion to trick an enemy that's\
    \ in front of them. The enemy is fooled into thinking the user will attack them,\
    \ but instead the user attacks the targets behind the user. *Reverse Mist Beheading:\
    \ After creating several shadow clones which surround the enemy and attack them\
    \ simultaneously forcing them to jump into the air, the real user will then attack\
    \ them from above. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==\
    \ Category:Characters Category:Male Characters Category:Manga Characters Category:Anime\
    \ Characters Category:Naruto Category:Humans Category:Ninjas Category:Stealth\
    \ Masters Category:Sword Users Category:Acrobats Category:Chi Users Category:Surface\
    \ Scalers Category:Shapeshifters Category:Statistics Amplification Users Category:Electricity\
    \ Users Category:Duplication Users Category:Free Movement Users Category:Paralysis\
    \ Users Category:Illusionists Category:Adults Category:Teenagers Category:Energy\
    \ UsersCategory:Extrasensory Perception Users Category:Weapon Users"
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
