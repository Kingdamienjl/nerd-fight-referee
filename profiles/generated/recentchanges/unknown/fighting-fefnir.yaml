- id: claim-weaknesses-d447dcd0
  section: weaknesses
  axis: weakness
  text: 'Hot-headed and battle hungry, prefers one on one fights. Somewhat arrogant,
    almost blindly loyal to X. Is vulnerable to lightning-based attacks. Notable Attacks/Techniques:
    *Ground Break: Jumps up into the air before slamming the ground, sending a small
    plasma wave or large waves of rock at his target that grows larger when fully
    charged. *Solar Bullets: He''s capable of rapidly firing plasma and solar bullets
    much like his progenitor, X. Like X he''s also able to charge his attacks for
    additional stopping power but is unique in the fact that he can redirect his shots
    in mid-air to home in on targets. He is also able to convert them into more powerful
    fireballs if he''s holding a charge. *Rocket Upper: Grips his target before sending
    them skyward with a point-blank blast. *Fire Explosion: Summons a mortar launcher-like
    cannon which fires two shots in an arching angle. The first shot bursts mid air
    and the second bursts when it hits the ground. When the shots burst they send
    seven particles outward in a fan spread. *Meteor Rain: His EX Skill, causing him
    to fire shots in the air that rain down in an increasingly outward pattern. *Hell
    Fire: His other EX Skill, causes to the ground to erupt with massive pillars of
    flame that alternate frequently. *Armed Phenomenon: Fefnir is able to transform
    into a tank with several dragon-shaped cannons to battle against large groups
    of foes or particularly resilient ones. In this form his firepower is raised to
    the limit, unleashing barrages of artillery, flamethrowers, and seismic eruptions
    to crush all in his way. ==Notable Matchups== Victories: Losses: Inconclusive:
    Category:Characters Category:Mega Man Category:Fire Users Category:Energy Users
    Category:Male Characters Category:Robots Category:Weather Users Category:Earth
    Users Category:Gun Users Category:Leaders Category:Good Characters Category:Antagonists
    Category:Transformation Users Category:Self-Sustenance Users Category:Reploids
    Category:Guardians Category:Game Characters Category:Video Game Characters Category:Flamethrower
    Users Category:Inorganic Beings'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
