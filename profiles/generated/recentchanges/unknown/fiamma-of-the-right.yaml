- id: claim-weaknesses-6b6acc08
  section: weaknesses
  axis: weakness
  text: "Due to the Distortion of the Laws of the World that affected the elemental\
    \ balance, Fiamma of the Right couldn't use the full might of the Holy Right due\
    \ to the elements of Archangels becoming ambiguous, thus less powerful | None\
    \ notable {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"\
    1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"\
    text-align: left; |Notable Attacks/Techniques: |- | : The embodiment of the power\
    \ of the Right Hand within Christianity, which Fiamma of the Right claims has\
    \ the power to create miracles and destroy all evil outright. The power itself\
    \ is aligned to the Archangel Michael. The Holy Right derives its power from the\
    \ prominence the right hand has in Christian lore, wherein several miracles, rituals,\
    \ and traditions are performed using the right hand. The Holy Right's strength\
    \ depends on Fiamma of the Right's needs and the enemy that stands before him\
    \ \u2014 ergo, the Holy Right simply defeats whatever it targets with the precise\
    \ amount of force needed, no more no less. The Holy Right manifests as a mirage-like\
    \ hand that appears like a malformed bird's talon that appears to be growing out\
    \ of Fiamma of the Right's right shoulder. He possessed this ability since his\
    \ birth.Shinyaku Toaru Majutsu no Index Volume 2 Chapter 3 Part 6 *Miracles of\
    \ the Right Hand: Can use any symbolism magic that has anything to do with the\
    \ Right Hand: Archangel Michael cast down Lucifer and his fallen angels with the\
    \ right hand, the Son of God healed the sick with his right hand, the Bible was\
    \ written with the right hand, plus many others. *The Strike That Ends Everything\
    \ It Touches: This attack destroys everything it touches without any destructive\
    \ force. The striking force is as much as is needed to destroy a target - if the\
    \ target is humanity it can lifewipe, but will not destroy the planet. The maximum\
    \ power shown was continental (All of Asia and Europe). *Holy Right Auto Target:\
    \ The Holy Right has a function which allows it to automatically target anything\
    \ that it deems as a threat. This was shown when a satellite laser from Academy\
    \ City shot Fiamma out of nowhere, and the holy right blocked the laser and destroyed\
    \ the satellite when Fiamma waved his arm. Fiamma had no way to even know that\
    \ the laser was fired at him, nor did he even know where the orbital satellite\
    \ that shot the laser was located, so the logical explanation for this is that\
    \ the Holy Right has the ability to auto-target threats, that even Fiamma may\
    \ not know about. File:Fiammadestroysasatellite.gif|Fiamma showcasing its ability\
    \ to autotarget a satellite *The Strike That Reaches Everything When Swung: This\
    \ attack delivers itself right next to its target without any speed, thus allowing\
    \ him to move and attack anywhere and anything at will. It is essentially teleportation.\
    \ *Teleportation: Fiamma can teleport anywhere he wishes instantly as long as\
    \ he has an open horizontal path. *Flame Sword: He can produce a 30~40 km-sized\
    \ sword made of flame.Toaru Majutsu no Index Volume 20 Chapter 2 Part 6 *Absorption:\
    \ The Holy Right is able to absorb other things, shown when Fiamma disassembled\
    \ and absorbed Imagine Breaker as part of his plan to achieve La Persona Superiore\
    \ a Dio. *Other Attacks: Fiamma has demonstrated other attacks with the Holy Right,\
    \ such as creating beams or swords of light. Index's Controller: After acquiring\
    \ Index's controller, Fiamma solved the issue he had with the Right Arm slowly\
    \ disintegrating in the air with each use, limiting the number of times he could\
    \ use it in a row. Additionally, by using the controller he can activate Index's\
    \ John Pen Mode, access the knowledge of her grimoires, and even have her cast\
    \ magic for him, which will come from the controller.Toaru Majutsu no Index Volume\
    \ 18 Epilogue *: A high-class defensive spell which distorts space-time. Two magic\
    \ circles over two meters across appear and glow before exploding into something\
    \ that looks like pitch black lightning. This is described as cracking space open,\
    \ with the cracks quickly spreading in front of the user and looking like a barrier\
    \ preventing anyone from approaching them. Additionally, something that seems\
    \ to be pulsating swells up from within the cracks, and a beast-like scent wafts\
    \ in from the slight opening created by the pitch black cracks. Kamijou Touma\
    \ instinctually realized that the thing inside the cracks was very dangerous,\
    \ even if he didn't know what it was exactly.Toaru Majutsu no Index Volume 1 Chapter\
    \ 4 **: A high-class offensive spell, used after casting St. George's Sanctuary.\
    \ The black cracks caused by the previous spell suddenly open and widen all at\
    \ once. Then a pillar of light, looking like a laser beam about a meter across\
    \ shoots out from within the cracks. The spell holds the same power of the legendary\
    \ dragon of Saint George and it can be fired continuously. Upon trying to use\
    \ Imagine Breaker to stop it, Kamijou Touma found out that his right hand couldn't\
    \ negate the beam fast enough to counter i"
  source_ids: *id002
  decisive: false
