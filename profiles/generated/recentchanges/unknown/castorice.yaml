    ; Can interact with Nikador, the incarnation of Strife itselfKremnos, Cleanse\
    \ Thy Rusted Blood (II)) *Expert Scythe User *Weapon Creation (Castorice can create\
    \ a scythe made of pure energy) *Imaginary Energy (Destruction) & Honkai Energy\
    \ (Low-Level; Chrysos Heirs are stated to inherit Nanook's golden blood,Hero,\
    \ Ignite That Primal Sun which are congregations of Imaginary Internal EnergyAnti-Entropy\
    \ Visual Novel: Chapter 5, Part 2) *BFR (Dimensional; When Castorice uses her\
    \ ultimate, Pollux AKA Netherwing opens a portal to Netherland where her enemies\
    \ are sentKeeping Up With Star Rail \u2014 Castorice: Shine or Blemish: Owlbert's\
    \ Miserable Exile to Aidonia) *Flight (Castorice can fly when riding PolluxScholar,\
    \ Let Us Meet Again Before the Gates of Truth) *Resistance Negation (Netherwing\
    \ can ignore Quantum Resistance) *Resistance Negation & Damage Boost (Enemies\
    \ sent in Netherland have all their resistances ignored and Castorice deals increased\
    \ damage to them) *Limited Automatic Translation (Castorice can understand the\
    \ language of the Titans) *Additional Damage Boost (Netherwing damage increases\
    \ progressively from 10-22%, and can multiply 3 times to 30-66%, and with \"Breath\
    \ Scorches the Shadow\", the DMG dealt increases by 30%. This effect stacks up\
    \ to 6 times up to 180%) *Spatial Manipulation (Castorice can casually cut through\
    \ space to summon Pollux, while Pollux herself can tear through space with brute-force\
    \ strengthHoYoLAB: Character Preview | CastoriceHonkai: Star Rail Version 3.2\
    \ \"Through the Petals in the Land of Repose\" Special Program) *Summoning & Soul\
    \ Manipulation (Castorice can summon the soul of the deceased. She can also summon\
    \ her scytheGrove, Wherefore Are the Wise Silent) *Durability Negation, Aura (Overwhelming),\
    \ Death Manipulation & Deconstruction (Castorice can emit an overwhelming aura\
    \ that incapacitates anyone within its range and causes death to those who come\
    \ too close.Silver Chariot, Away to that Blackened Land Castorice possesses the\
    \ ability to cause death with a mere touch.Night Stars, Accompany My SlumberAmphoreus\
    \ Trailblaze Log (I) Everyone Castorice touches will slowly break apartDeath,\
    \ Dripping Like Morning DewAnimated Short: The Long Night of Serenity | Honkai:\
    \ Star RailCastorice Trailer \u2014 \"Epitaph\" | Honkai: Star Rail) *Energy Manipulation\
    \ (Castorice can generate multiple strands of energy to restrain her enemies)\
    \ *Imaginary Energy & Honkai Energy (Low-Level) *Curse Manipulation & Corrosion\
    \ Inducement (Resisted defying her fate of being a female child of Destruction.\
    \ Those who dare to betray their fate as children of Destruction will be afflicted\
    \ with the Weathering Curse, which will corrode females' bodies awayNon-Existent\
    \ State) *Aura (Overwhelming & Fear-inducing), Fear Manipulation (Mystical) &\
    \ Heat Manipulation (Castorice can resist Nikador's aura, which instills fear\
    \ and ignites the air into flamesWasteland, Hark Back Glory of Old) *Death Manipulation,\
    \ Corrosion Inducement & Deconstruction (Can resist the deadly effects of her\
