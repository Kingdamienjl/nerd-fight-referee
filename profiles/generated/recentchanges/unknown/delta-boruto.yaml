- id: claim-weaknesses-73bc80b7
  section: weaknesses
  axis: weakness
  text: "Her absorption requires a certain capacity to store chakra and then release\
    \ it after the fact, meaning that the absorption can be overtaxed given enough\
    \ chakra is available. Notable Attacks/Techniques: *Reverse Scale: With Microscopic\
    \ Scientific Ninja Tools in their blood stream, the user is able to modify their\
    \ flesh for offensive, defensive, and supplementary purposes. **Rising Thorn:\
    \ Using their modified body, the user stomps their foot into the ground, transforming\
    \ into a large thorn that rises beneath the opponent. **Great Crushing Funeral:\
    \ The user erupts thorn protrusions from their leg to skewer the opponent. **Runway\
    \ Booster: With their modified body, the user splits their legs open to expel\
    \ chakra, granting them flight. *Eye Technology: Her eye technology allows her\
    \ to absorb chakra-based techniques with her right eye and return them at the\
    \ opponent with her left eye. However, there is a limit to how much chakra the\
    \ eye can absorb before it stops functioning. *Destruction Beams: These beams\
    \ of light can completely obliterate the cells of the struck area, rendering them\
    \ incapable of regeneration. *Self-Destruction: With their modified body, the\
    \ user will initiate a self-destruction upon defeat in order to prevent the enemy\
    \ from studying their body or to take out those who defeated them. If they have\
    \ additional bodies stored away, they can transfer their consciousness via drone\
    \ to a new body. Eyes technology (Absorb).jpg|Eye Technology (Absorption) Eyes\
    \ technology (Reflection).jpg|Eye Technology (Reflection) Leg transformation -\
    \ Delta.jpg|Leg Transformation A rocket legs - Delta.jpg|Rocket Legs Shared vision\
    \ -Delta.jpg|Shared Vision Delta - Beam of light.png|Light Beams Delta's Destructive\
    \ Beams.gif|Destructive Beams (Anime) ==Gallery== 011548339626- Delta.jpg Palatas.png\
    \ ==Notable Matchups== Victories: Losses: Madara Uchiha (Naruto) Madara's Profile\
