- id: claim-powers-and-abilities-a6452783
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Master Hand-to-Hand Combatant *Acrobatics
    *Stealth Mastery *Weapon Mastery *Chakra Manipulation *Cyborgization (Full. Delta''s
    body has been extensively enhanced by Amado with highly-advanced Shinobi-ware
    to the point where she had become a full cyborg) *Nanotechnology (Has a scientific
    ninja tool body just like Kawaki (Naruto Next Generations),Boruto: Naruto Next
    Generations Chapter 31 who has nanomachinesBoruto: Naruto Next Generations Chapter
    68 implanted throughout his entire body that constantly alters his physiology
    throughout his circulatory and nervous systems at the cellular level, transforming
    him into a living scientific ninja tool.Boruto: Naruto Next Generations Chapter
    25Boruto: Naruto Next Generations Chapter 26 This grants Delta superhuman strength,
    durability, and speed Boruto: Naruto Next Generations Chapter 24 even without
    the use of chakra, just like Kawaki) *Body Control, Biological Manipulation &
    Weapon Creation (The nanomachines allows the user''s body to instantly undergo
    sclerosis or malacia to harden, soften, and expand. This allows her to transform
    parts of her body, weaponizing it; Enabling her to alter her legs into various
    weapons, shapes and sizes) *Energy Projection & Flight (Can split open her legs
    vertically and release a continuous stream of chakra in a manner similar to jet
    propulsion, allowing her to flyBoruto: Naruto Next Generations Chapter 30) *Aura
    & Statistics Amplification (Can coat herself in chakra to amplify her strength)
    *Absorption & Attack Reflection (Can absorb techniques with her right eye and
    release them back with her left eye) *Immortality (Types 6 and 8. Her drone records
    her consciousness should she be destroyed, and then upload it in replica bodies)
    *Regeneration (Low-Mid, easily regenerated her legs after they were severed) *Light
    Manipulation (Can fire light beams through her eyes) *Limited Durability Negation
    (Her beams can obliterate targets on a cellular level) *Regeneration Nullification
    (Her light beams kill off cells and make them crumble, effectively nullifying
    regeneration) *Clairvoyance & Enhanced Senses (Able to share vision with her drone
    which can track invisible targets such as Boruto''s Vanishing Rasengan) *Self-Destruction
    (Her body self-destructs automatically as a last defense). The Spy Drone has:
    Small Size (Type 1) *Inorganic Physiology (Type 2) *Enhanced Senses (Can track
    invisible targets with a radar feature)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
