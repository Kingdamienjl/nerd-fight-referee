- id: claim-standard-equipment-2187bbd1
  section: equipment
  axis: equipment
  text: '*Spy Drone: A spy drone Shinobi-Ware, created by Amado, and utilized by Delta.
    This deployable drone is normally housed in Delta''s back. Following her commands,
    it can be remotely controlled without using chakra, making it undetectable through
    sensing. The drone is equipped with a camera that is linked directly to Delta''s
    artificial eyes, allowing her to expand her vision. It also has a radar feature
    that allows it to detect things invisible to the naked eye. This camera is also
    able to record what it sees. Should Delta''s body be destroyed, the drone can
    be used to upload her consciousness into a new body.'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
