    at high speeds, before launching it at his opponent. This attack spins across
    the ground and can bounce off a surface once before dissipating. This can also
    be charged and used as a shield around himself, which can damage anyone who touches
    it, and can absorb energy blasts. *Guarding Using his super-tough armor, he can
    block most attacks that are launched at him, particularly projectile weapons.
    His strong defense can also be used offensively by curling into a ball and rolling
    at his opponents at high speed, bouncing off of nearby walls to further outmaneuver
    his opponents. ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters
