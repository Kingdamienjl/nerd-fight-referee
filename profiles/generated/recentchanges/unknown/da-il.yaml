- id: claim-standard-equipment-2956a5b1
  section: equipment
  axis: equipment
  text: 'The Relic of the Nihility * Can Summon: All those under contract with the
    Ruler of the Nihility, Void. * His summons include the following: The Ruler of
    the Nihility, Void, as well as Agni, Bason, Bhraj, Giselle, Gula, Hig, Morax,
    Pavaka, Pavala, Phaleg, and Sai, all of whom are Demons of varying ranks. His
    summons also include 1,024 Lower Demons, 256 Intermediate Demons, and 108 High
    Demons, of whom 72 are Demon Kings.'
  source_ids: *id002
  decisive: false
  status: unverified
