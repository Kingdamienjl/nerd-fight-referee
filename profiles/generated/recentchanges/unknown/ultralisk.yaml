- id: claim-weaknesses-e28ebbc2
  section: weaknesses
  axis: weakness
  text: 'Ultralisks are unable to hit targets in the air. Notable Attacks/Techniques:
    *Kaiser Blade Slash: The four scythe-like appendages on the front of an ultralisk
    are genetically honed to mono-molecular levels, enabling them to rip through nearly
    any armor with ease. *Frenzied: The Ultralisk is mindless, focusing only on what
    the hivemind demands of it. Because of this, it is immune to snare, slow, stun,
    and even mind control attacks. *Burrow: Despite its massive size, ultralisks are
    able to completely bury and unbury themselves extremely quickly. **Burrow Charge:
    The ultralisk is able to swiftly tear through the ground, charging the target
    from complete safety and forgoing any obstacle. Once it has reached its target,
    it erupts from under the ground, throwing back enemies and stunning them. *Tissue
    Assimilation: Ultralisks heal 40% of the damage dealt with their attacks. *Toxic
    Cloud: Release a burst of toxins around the noxious ultralisk to deal damage to
    nearby enemies. Does no damage to structures. *Reincarnation: Upon death the torrasque
    ultralisk enters a cocoon to regenerate, emerging at full HP upon hatching. if
    it is killed the torrasque dies. ==Notable Matchups== Victories: Losses: Inconclusive:
    Category:Characters Category:StarCraft Category:Absorption Users Category:Adaptation
    Users Category:Animals Category:Game Characters Category:Genderless Characters
    Category:Poison Users Category:Regeneration Users Category:Resurrection Users
    Category:Science Fiction Characters Category:Aliens Category:Large Sized Characters'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
