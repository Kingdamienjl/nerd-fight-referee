- id: claim-weaknesses-f9042e76
  section: weaknesses
  axis: weakness
  text: 'None Notable. Notable Attacks/Techniques: *Earth Release: **Rock Lodging
    Destruction: This technique destroys the equilibrium that allows a cave to remain
    standing. By removing the supporting spot, such as a single rock, even the most
    solid cave becomes fragile and ultimately collapses. A favourite tactic of Iwagakure-nin
    is to lure opponents into a cave and to then perform this technique. Stones gradually
    fall upon the opponents until finally a cave-in is caused, wiping them out. **Rock
    Gun Technique: The Earth Release: Rock Gun Technique is a technique which bullet-sized
    bits of rock are expelled from the user''s mouth with great speed and force. After
    they are fired, the chunks expand into huge boulders. Orochimaru stated that when
    used collaboratively, this technique can most likely destroy a mountain. *Barrier
    Releasing Technique: The user places four tags marked "Release" in a diamond formation
    on a barrier. After performing the hand seals, the technique will break the barrier.
    It takes time and concentration to break stronger barriers. To increase the strength
    of this technique, more than one user can perform the technique in unison. ==Notable
    Matchups== Victories: Losses: Inconclusive: ==References== Category:Characters
    Category:Male Characters Category:Naruto Category:Boruto Category:Ninjas Category:Acrobats
    Category:Statistics Amplification Users Category:Surface Scalers Category:Free
    Movement Users Category:Illusionists Category:Duplication Users Category:Shapeshifters
    Category:Paralysis Users Category:Earth Users Category:Power Nullification Users
    Category:Adults Category:Anime Characters Category:Manga Characters Category:Chi
    Users Category:Energy UsersCategory:Extrasensory Perception Users Category:Weapon
    Users'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-6c48c19c
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, Statistics Amplification
    (Shinobi are capable of enhancing their physical capabilities with the use of
    chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance their speed by
    focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter
    71), Surface Scaling and Water Walking (By focusing chakra at the soles of their
    feet, Shinobi can scale and cling to vertical surfaces, and even walk on waterNaruto
    Chapter 18Naruto Chapter 90), Minor Illusion Creation and Duplication (With the
    Clone TechniqueRin no Sho, Page 220, Shinobi can create illusionary duplicates
    of themselves that have no physical substance), Shapeshifting (With the Transformation
    TechniqueRin no Sho, Page 220, Shinobi can transform themselves into other people,
    animals, plants, and even inanimate objects, such as weapons), Paralysis Inducement
    (With the Temporary Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely
    paralyze their targets from close to mid range), Earth Manipulation, Forcefield
    Nullification with Barrier Releasing Technique
  source_ids: *id002
