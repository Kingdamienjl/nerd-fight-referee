- id: claim-weaknesses-2f7330ab
  section: weaknesses
  axis: weakness
  text: 'Needs to recharge his powers by sleeping once in 100 years,Mighty Morphin
    Power Rangers S2 Ep41 can sometimes be arrogant and underestimate his opponents.
    Has anger issues. His darkness spell can be shattered through strong light with
    the power to reflect spells back at him {| class="mw-collapsible mw-collapsed"
    align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%" |
    colspan="2" style="text-align: left; |Notable Attacks and Techniques: |- | |-|Lightning
    Attacks=right|320px |-|Weather Manipulation=right|320px * Lightning Attacks: Lord
    Zedd can create powerful lightning attacks from his visor, body or his personal
    Z-Scepter. They can be used for various things, such as blasting the enemy or
    putting them under a powerful spell. * Weather Manipulation: Lord Zedd can manipulate
    the weather in a way of creating storms or winds, even in the moon itself. Much
    like other magicians in the franchise, Zedd can create powerful storms that can
    be felt from the moon all way into the Earth * Matter Manipulation: Zedd''s main
    method of causing trouble is by manipulating matter to create his new monsters.
    By manipulating matter at sub-atomic levels, Zedd can transmute innocent objects
    and animals into powerful and ugly monsters ready to destroy the planet. Zedd
    not only manipulates matter at such levels to utilize transmutation but also use
    it to deconstruct the enemy and objects. * Magic: Zedd is an expert on dark magic
    and been studying it for several thousand eons, dwarfing even powerful magicians
    who are classified as some of the strongest in the galaxy. His knowledge over
    dark magic is no joke and he even combined it with his armed and unarmed combat
    styles to create a brand new fighting style. |} Note: As Power Rangers as a verse
    is under massive revisions, it should be noted that the profile should not be
    used in vs matches until the revisions end. ===Gallery=== LordZeddGuidebookRender.png|Lord
