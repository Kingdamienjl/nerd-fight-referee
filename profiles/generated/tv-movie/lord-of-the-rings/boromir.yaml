- id: claim-powers-and-abilities-ae5d0a19
  section: abilities
  axis: hax
  text: "* Superhuman Physical Characteristics * Weapon Mastery (Boromir is stated to have been the most\
    \ skilled warrior in all of Gondor, putting him above even the likes of \xC9omer who was one of only\
    \ three warriors to come out of The Battle of the Pelennor Fields unscathed in large part due to his\
    \ might and skill.The Lord of the Rings: The Two Tower, Book Four, V The Window on the WestThe Lord\
    \ of the Rings: The Return of the King, Book Five, VI The Battle of the Pelennor FieldsThe Lord of\
    \ the Rings: The Return of the King, Book Six, V The Steward and the King In his final battle, Boromir\
    \ was capable of slaying enough Orcs to form a pile around his body before succumbing to his wounds,\
    \ with it being shown that the mortal wounds caused by the force of over a hundred Uruks were not\
    \ caused in the melee but by ranged archers)The Lord of the Rings: The Two Tower, Book Three, III\
    \ The Uruk-Hai * Longevity (Due to being a D\xFAnedan of Gondor, Boromir should possess an extended\
    \ lifespan compared to normal people, albeit not one as long as his brother or father. Moreover, similar\
    \ to Aragorn and other Faithful D\xFAnedain/N\xFAmen\xF3reans, Boromir likely would have remained\
    \ in his physical prime had he lived until his natural death as his kind are capable of relinquishing\
    \ their lives upon sensing the coming of their physical aging and withering into senility) * Blessed\
    \ (As a man of \"high N\xFAmen\xF3rean lineage\", Boromir was therefore blessed with a diminished\
    \ form of the blessings given to the N\xFAmen\xF3reans)The Nature of Middle-Earth, Part Two: Body,\
    \ Mind, and Spirit, VI DESCRIPTIONS OF CHARACTERS with the abilities of possibly: ** Enhanced Senses\
    \ ** Regeneration (Low) ** Resistance to Disease Manipulation (D\xFAnedain/N\xFAmen\xF3reans possessed\
    \ several blessings alongside their enhanced physiques.The Nature of Middle-Earth, Part Three: The\
    \ World, its Lands, and its Inhabitants, XI Lives of the N\xFAmen\xF3reans As the blessings did not\
    \ run as true in Boromir as they did in Faramir, these specific abilities are only rated as possibly\
    \ present) *Acausality (Type 2; Changes to the past or future are unable to affect the \"Music in\
    \ being\", otherwise referred to as the present)Morgoth's Ring: PART FIVE. III.. Resistance to: *Mind\
    \ Manipulation (The barrier of Unwill within every individual mind prevents mental penetration by\
    \ even the likes of Sauron without consent.)The Nature of Middle-Earth, Part Two: Body, Mind, and\
    \ Spirit, IX \xD3SANWE-KENTA. *Soul Manipulation (Soul with free-will are considered indestructible)Letters\
    \ of Tolkien: Letter 211"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
