- id: claim-weaknesses-17165a86
  section: weaknesses
  axis: weakness
  text: 'Hermione can be overly reliant on logic and reasoning, which can impair her
    ability to make rapid, intuitive decisions. Her social intelligence isn''t very
    high, and she can also be rather close-minded, with a tendency to dismiss anything
    that requires thinking even slightly outside the box. Has a tendency to panic
    in actual combat. Several spells, such as Transfiguration and Apparition, can
    be difficult to use while under pressure due to the intense amounts of concentration
    involved. Vanishing Spell becomes more difficult with the complexity of the animal
    to be vanished, so it only works well on small animals and objects. Notable Attacks/Techniques:
    * Apparition: Visualizing a place in her mind that she knows well, Hermione "apparates"
    to her target location virtually instantly. * Bombarda: Also known as the Blasting
    Curse, Hermione''s curse causes the victim or targeted area to explode violently,
    being powerful enough to blast through thick doors. Hermione can further amplify
    the power of this spell with the incantation, "Bombarda Maxima". * Expecto Patronum:
    More commonly known as the Patronus Charm, Hermione summons an ethereal otter
    made of positive energy and good memories to ward off evil creatures like Dementors,
    proving exceptionally effective against them. * Impedimenta: Also known as the
    Impediment Curse, Hermione''s curse causes the afflicted victim to suddenly slow
    to a crawl, effectively immobilizing them. She can also cause them to levitate
    or send them flying backwards if she so wishes, but the spells effects only last
    about ten seconds. * Locomotor Mortis: Also known as the Leg-Locker Curse, Hermione
    casts a charm that causes the victim''s legs to adhere to each other, preventing
    proper movement. * Locomotor Wibbly: Also known as the Jelly-Legs Jinx, Hermiones
    casts a charm that prevents the target from feeling their legs upon impact, causing
    them to give way and the victim to collapse onto the ground. * Obliviate: Also
    known as the Memory Charm, Hermione wipes her target''s memory to any degree she
    wishes, preventing them from recalling specific information about any subject
    she desires even when the victim is subject to excruciating torture, such as the
    Cruciatus Curse. * Protego: Also known as the Shield Charm, Hermione generates
    a temporary barrier that wards off oncoming magical and physical attacks. By using
    its Maxima variant along with the spells Fianto Duri and Repello Inimicum, Hermione
    can generate an even more powerful version that disintegrates those that touch
    it with hostile intentions. However, the spell has its limits, and will shatter
    completely if struck with a sufficiently powerful attack. * Stinging Jinx: Hermione
    flings a charm that stings the target it hits, causing swelling, needle-like pain,
    and welts to form around the area of impact. * Stupefy: Also known as the Stunning
    Spell, Hermione fires off a charm that instantly incapacitates the target or halts
    the motion of a moving object. Repeated uses against the same target can cause
    serious harm or death. * Transfiguration: Hermione is exceptionally skilled in
    this branch of magic, which pertains to the the transfiguration, creation, vanishing,
    and switching of the targets'' traits. Applications include: ** Conjuration: Hermione
    creates things out of thin air, such as a flock of butterflies. She frequently
    uses this spell to create distractions. ** Human Transfiguration: Hermione converts
    herself or anyone else she desires into the shape of her choice, allowing her
    to disguise herself at will or turn her targets into harmless animals. ** Switching
    Spell: Hermione swaps the physical traits of two objects of her choice, such as
    placing a human''s ears on a cactus while replacing said ears with cactus barbs.
    ** Vanishment: Hermione is able to make various objects vanish with only moderate
    effort, which she can use to make hostile objects and creatures disappear before
    they can do any harm. ==Notable Matchups== Victories: Losses: Ron Weasley (Wizarding
    World) Ron Weasley''s Profile (Order of the Phoenix book versions were used, both
    in-character) Inconclusive: {{Discussions}} Category:Characters Category:Wizarding
    World Category:Alchemists Category:Book Characters Category:Curse Users Category:Fantasy
    Characters Category:Female Characters Category:Fire Users Category:Forcefield
    Users Category:Geniuses Category:Good Characters Category:Healers Category:Heroes
    Category:Humans Category:Live-Action Characters Category:Magic Users Category:Memory
    Users Category:Movie Characters Category:Protagonists Category:Schoolgirls Category:Status
    Effect Users Category:Teenagers Category:Telekinesis Users Category:Teleportation
    Users Category:Transmutation Users Category:Void Users Category:Wand Users Category:Witches
    Category:Students'
