    text: Gifted (Hailed as the most talented student of her year, Hermione proved
      herself to be an immensely talented and studious witch, reading all the assigned
      reference materials with fervor and obtaining outstanding marks in all her magical
      subjects, including Arithmancy, Runes (of which she was commended for translating
      the original version of Beedle the Bard), Charms, Transfiguration, Care of Magical
      Creatures, Defense against the Dark Arts, and many other disciplines. She has
      a virtually encyclopedic memory, often recalling details that her friends forgot
      or failed to read, and was considered a "borderline genius" for her academic
      prowess. Outside of her academic prowess, Hermione also proved herself to be
      an exceptionally talented duelist, facing off against numerous Death Eaters
      over the course of her adventures and staring down the likes of Voldemort's
      most trusted servant, Bellatrix Lestrange, along with fellow witches Ginny Weasley
      and Luna Lovegood, confounding her magical foes by interweaving conventional
      combat spells with unconventional spells. However, her exceptional intelligence
      can be a drawback at times, as she sometimes relies heavily on logic in a magical
      world. This sometimes leaves her unwilling to make intuitive decisions without
      hard evidence, which can impair her judgment)
