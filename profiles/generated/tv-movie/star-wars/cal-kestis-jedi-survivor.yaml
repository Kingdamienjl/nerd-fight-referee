- id: claim-powers-and-abilities-5c687798
  section: abilities
  axis: hax
  text: 'All previous abilities enhanced to a greater degree, plus *Enhanced Various Lightsaber Combat
    Skills (Much better with his previous three stances plus added the blaster and cross-guard stances
    to his skillset) *Mind Manipulation (Cal can confuse opponents into giving him vital information or
    aiding him in battleStar Wars: Jedi Survivor. Respawn Entertainment, 2023) *Enhanced Telekinesis (Can
    use The Force is much more various ways than before such as being able to hold large groups of enemies
    up in the air and slamming objects back towards the down with great force) *Resistance to Illusion
    Creation (Was able to turn Dagan Gera''s illusions back at him) When accessing the Dark Side: *Greatly
    enhanced Status Effect Inducement (When Cal calls on power from the Dark side his status effect on
    the area greatly increases, even being able to harm and kill people close enough to him upon activation)
    *Even greater Weapon Mastery (Cal using the Dark side pushes him into the utmost expertise of Jedi
    fighting, his moves when using his status effect bearing a direct resemblance to Jedi Master Cere
    Junda when under the effect. Someone who could even pressure Darth Vader) *Far stronger Telekinesis
    (Cal''s usage of The Force greatly increases with the dark side, allowing him to crush large steel
    locks and battle droids with his powers of the force alone. Cal is also able to use force choke when
    calling upon the dark side) *Even Greater Mind Manipulation (Cal''s confusion power becomes so strong
    when calling upon the Dark Side that opponents literally die on the spot from having their minds crushed
    when the ability is performed) |-|With BD-1= *Hacking (Can hack various advanced tools and droids
    to aid Cal in battle) *Healing (With Stim packs), *Electricity Conducting (Powerful enough to overcharge
    advanced tech and cause pain in a distracted Darth Vader)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
