- id: claim-powers-and-abilities-826d5b4e
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Aura and Nigh-Invulnerability (Can become invulnerable for\
    \ short periods of time), possibly Incorporeality (If he's indeed Cloud's darkness, it's stated he'd\
    \ be incorporeal https://www.khinsider.com/forums/index.php?threads/characters-report-vol-2-translations.197305/\
    \ Sephiroth He was written as a symbol of Cloud's darkness, and it's possible that just maybe he was\
    \ not a corporeal human entity at all. Perhaps the sequence of scenes involving them made players\
    \ feel like they were being left behind, but I'd like you to think of that as a representation of\
    \ a light and darkness that Sora, and thus you as players, cannot intervene in. --Nomura Tifa As a\
    \ symbol of light, like Sephiroth, it's possible that she too was incorporeal. That last scene where\
    \ she goes off to search for Cloud, you could say, is a metaphor for how Cloud's light still hasn't\
    \ lost him, even though he's disappeared off with his darkness, and it is trying to shine on him again\u2026\
    \ I'm pretty sure I didn't manage to get all that across very well. --Nomura ), Master Swordsmanship,\
    \ Magic, Flight, Teleportation, Energy Manipulation, Summoning (Can summon meteors from the sky to\
    \ rain down on his enemies), Fire Manipulation, Darkness Manipulation, Absorption (Can fully deplete\
    \ his opponent of magic with Heartless Angel), Durability Negation with Heartless Angel (Instantly\
    \ reduces the opponent to a single hit point of health), Immortality Negation (Type 5; Can destroy\
    \ the skeletal forms of the pirates despite them being neither alive nor dead), Resistance to Absorption,\
    \ Death Manipulation (Unaffected by Heartless, which passively kill and absorb things around them),\
    \ Data Manipulation (Ansem the Wise stated that the \"heart\" cannot be contained by data, and that\
    \ the process itself would be incalculable), Existence Erasure (Can take hits from Heartless, which\
    \ can do this with any attack), Magic (Most of Sora's spells can't hurt him in either game, note that\
    \ this includes Magic-based Time Stop, Fire Manipulation, Ice Manipulation, Electricity Manipulation,\
    \ Gravity Manipulation)"
  source_ids: *id003
  decisive: true
  status: unverified
