- id: claim-weaknesses-883557e6
  section: weaknesses
  axis: weakness
  text: 'Riku initially lacked defensive abilities like Sora''s Aeroga and Reflega
    spells (though this was overcome when Riku gained some of his defensive spells
    such as Dark Shield and the more powerful Dark Barrier), his darkness powers are
    weaker when using the Way to the Dawn keyblade (but it increases his light powers
    in return, giving him a balance of both powers), Must be hardpressed to do use
    Limit Break. Notable Attacks/Techniques: thumb|400px|Flowmotion Flowmotion (フリーフローアクション
    Furīfurō Akushon, lit. "Freeflow Action"): An ability that appears in Kingdom
    Hearts 3D: Dream Drop Distance. It allows Sora and Riku to traverse their surrounding
    environments with great ease when they interact with certain environmental elements.
    Using Flowmotion, Sora and Riku can jump off of walls, grind rails, leap great
    heights, and dynamically attack opponents. When Sora and Riku use Flowmotion,
    they are enveloped in a violet aura, and they are sometimes accompanied by two
    orbiting lights of the same color, that trail light behind them. |-|Keyblade Techniques=
    *Dark Aura: Riku charges up the darkness in his heart, and zips around at extreme
    speeds, impaling his opponent when he collides with them. After colliding with
    them several times, he finishes by generating a huge pillar of dark energy. *Dark
    Break: Riku leaps into the air and dive-bombs the enemy multiple times, generating
    shockwaves of darkness with each impact. *Dark Mode: Riku taps into the darkness
    in his heart and physically manifests it as a suit that he wears. His strength,
    speed, magical power, and durability are all exponentially increased in this state,
    allowing him to strike down the likes of Lexaeus in one hit. *Dark Roll: Riku
    transforms into a sphere of darkness and moves to another direction at a fast
    pace before turning back into his human form. Dodging while in this state makes
    Riku impervious to attacks. *Dark Splicer: Riku stops time around every enemy
    in his range and rapidly warps around while attacking the opponent. When time
    begins to flow again, the affected enemies are dealt sequential damage in rapid
    succession. *Darkstorm: Riku''s Limit Break. Riku performs a series of dashes
    within strands of darkness and attacks enemies that are in his way. Riku''s weapon
    is then transformed into a sword of light to attack enemies with dealing further
    physical and light magic damage. *Zantetsuken: Riku brings his blade back before
    unleashing an impossibly fast strike that deals massive damage to all foes in
    range. Soul Eater KH.png|Soul Eater|link=http://www.khwiki.com/Soul_Eater Way
    to the Dawn KHII.png|Way to the Dawn|link=http://www.khwiki.com/Way_to_the_Dawn
    Dark Aura KH3D.gif|Dark Aura|link=http://www.khwiki.com/Dark_Aura Dark Aura KHII.gif|"Kingdom
    Hearts II version of Dark Aura" Dark Break KHRECOM.gif|Dark Break|link=http://www.khwiki.com/Dark_Break
    Darkstrom KHD.gif|Darkstorm|link=http://www.khwiki.com/Darkstorm |-|Magic= *Blizzard:
    Fires a large chunck of ice that can rip through the target and potentially hit
    multiple targets. *Cure: Restores some of his health. *Dark Barrier: Riku generates
    a dark version of the usual Barrier spell to defend against attacks from all directions.
    *Dark Firaga: Riku shoots an orb of dark fire that splits into multiple separate
    orbs and homes in on the opponent. *Dark Shield: Riku projects a shield of darkness
    in front of him to protect himself and others from incoming attacks. *Fire: Launches
    a ball of fire at a target. *Stop: Riku stops time around all foes in a certain
    area, allowing him to attack them as he pleases. *Thunder: Riku summons thunder
    from the air to strike multiple foes. Dark Barrier KH3D.gif|Dark Barrier|link=http://www.khwiki.com/Dark_Barrier
    Dark Firaga KHRECOM.gif|Dark Firaga|link=http://www.khwiki.com/Dark_Firaga Dark
    Roll KH3D.gif|Dark Roll|link=http://www.khwiki.com/Dark_Roll Dark Shield KHII.gif|Dark
