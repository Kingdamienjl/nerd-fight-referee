  intelligence:
    text: Xemnas, being an incarnation of Xehanort himself, is one of the craftiest
      and most devious characters in all of Kingdom Hearts, creating and manipulating
      Organization XIII for his own ends, fooling his fellow Nobodies into believing
      that they had no hearts when they could in fact cultivate a heart through relationships
      and personal attachments, a fact he only revealed after being revived to face
      Sora once more. He also possesses enough knowledge to see through Marluxia's
      plans of rebellion and sends Axel to dispatch of the traitors and has Sora defeat
      the ones that Axel could not. As the Superior of the In-Between, he is able
      to fight on par with Keyblade Master-level opponents like Sora and would have
      in fact defeated him if not for Riku's intervention. He assaults foes with devastating
      flurries of blade swings and kicks, deflects attacks and trapping foes with
      barriers, and wields the powers of every other member of Organization XIII with
      ease. He is still able to fight on par with Sora with the powers the latter
      gained during the events of Dream Drop Distance, tiring the hero into exhaustion
      so that Xehanort could kidnap him.
    source_ids:
    - mediawiki-xemnas-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
