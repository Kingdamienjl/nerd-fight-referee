- id: claim-weaknesses-052391fd
  section: weaknesses
  axis: weakness
  text: "While it makes him stronger and faster, his berserk state appears to leave him incredibly aggressive\
    \ and makes him lose most of his rational processes. Using his weapon against him can take Sa\xEF\
    x out of his Berserker state, making him go back to normal and temporarily weakens him, requiring\
    \ him to absorb more power back from KH. Must be hardpressed to use his Limit Break. Notable Attacks\
    \ and Techniques: Lunatic_KHD.png|Lunatic All Shall Be Lost To You!.gif|All Shall Be Lost To You!\
    \ Begone!.gif|Begone! Berserk_KHD.gif|Berserk Claymore Drop.gif|Claymore Drop Move Aside.gif|Move\
    \ Aside! * Berserker Mode: Sa\xEFx's special ability is to absorb power from the Moon (ex. Kingdom\
    \ Hearts) and enter a \"Berserker\" state like the Nobodies he commands; the transformation alone\
    \ releases a powerful shockwave burst that deals damage to anyone near him. In addition to the boosted\
    \ strength and speed, his durability is also increased to the point of being invulnerable to Sora's\
    \ attacks. However, he is vulnerable to his own weapon while in this state, and it is only temporary,\
    \ requiring him to absorb more power from the Moon to reactivate it. ** Lunar Divination: Sa\xEFx\
    \ raises his arms into the air and absorbs power from the Moon and Kingdom Hearts, generating the\
    \ energy necessary to enter his Berserker Mode if given enough time. In addition, an aura surrounds\
    \ Sa\xEFx that prevents him being interrupted unless hit with a particularly powerful or stunning\
    \ blow and he is unable to attack during this period. * All Shall Be Lost to You!: While in Berserker\
    \ Mode, Sa\xEFx flies around his surroundings and rapidly thrashes the surrounding area, leaving circles\
    \ of blue flames in his wake that quickly dissipate and jumping periodically to slam the ground even\
    \ harder to release larger shockwaves. He finishes this by dashing at the opponent at high speed,\
    \ unleashing waves of flame similar to Begone! In addition, this attack is known as Berserk in 358/2\
    \ Days, acting as Sa\xEFx's Limit Break, showing that he can forcibly enter Berserker Mode when in\
    \ dire straits. * Begone!: While in Berserker Mode, Sa\xEFx repeatedly shouts and slams the tips of\
    \ his Claymore into the ground, sending out waves of fire in a fan-like pattern before tossing his\
    \ Claymore at the opponent, resulting in an additional eruption of flame. * Claymore Drop: Sa\xEF\
    x jumps into the air and throws his Claymore at the floor, generating a wide and powerful shockwave\
    \ that tosses foes into the air. * Move Aside!: Sa\xEFx tosses his Claymore at the enemy to deal great\
    \ damage and send them skyward from the force behind it. ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ {{Discussions|Saix|Sa\xEFx}} Category:Characters Category:Kingdom Hearts Category:Antagonists Category:Aura\
    \ Users Category:Berserkers Category:Concept Users Category:Darkness Users Category:Data Users Category:Dimensional\
    \ Travel Users Category:Existence Erasure Users Category:Fire Users Category:Flight Users Category:Game\
    \ Characters Category:Immortals Category:Invulnerability Users Category:Male Characters Category:Non-Physical\
    \ Interaction Users Category:Organization XIII Category:Playable Characters Category:Portal Users\
    \ Category:Possession Users Category:Power Nullification Users Category:Resurrection Users Category:Self-Sustenance\
    \ Users Category:Shockwave Users Category:Statistics Amplification Users Category:Summoners Category:Villains\
    \ Category:Weapon Creation Users"
  source_ids: *id003
  decisive: false
  status: unverified
