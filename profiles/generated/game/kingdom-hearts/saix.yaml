- id: claim-powers-and-abilities-13dc682f
  section: abilities
  axis: hax
  text: Nobody Physiology, Expert Claymore Wielder, Summoning (Can summon hordes Nobodies of and Heartless.
    The Nobodies specifically commanded by him have standard Nobody Physiology plus Claymore Mastery,
    Rage Power, Elasticity and Body Control. His Heartless have standard Heartless Physiology), Immortality
    Negation (Type 5, Can destroy the skeletal forms of the pirates despite them being neither alive nor
    dead), Aura, Flight, Power Nullification (Can inflict Silence which prevents the use of magic), Fire
    Manipulation, Darkness Manipulation, Rage Power (Can empower himself by the "moon" of Kingdom Hearts
    (However, he was shown capable of doing it by himself in KHIII) to go into a Berserk Mode that greatly
    increases his stats), Duplication (Can create duplicates of his weapon whenever he throws them at
    the target), Shockwave Generation, Self-Sustenance (Type 1. Can breathe in space), Nigh-Invulnerability
    (Can become invulnerable for short periods of time) |-|Resistances= Ice Manipulation, Cosmic Radiations,
    Darkness Manipulation, Corruption (Type 2) (His Black Coat protects him from the corrupting influence
    of the darkness of the lanes between and the Realm of Darkness), Time Stop (Can move inside of the
    Realm of Darkness), Information Manipulation (Should scale to his fellow Nobodies who were unaffected
    by Namine's powers), Madness Manipulation (Type 3), Mind Manipulation, Memory Manipulation, Soul Manipulation,
    Willpower Manipulation (The Realm of Darkness has been stated to eradicate existence itself within
    it, and anyone who's traveled there have never returned. Ansem the Wise by being in the Realm of Darkness
    was losing his sense of self and memories, having to give into his hatred to survive. Aqua not long
    after being in the Realm of Darkness lost the will to continue, and needed to stay true to her friends
    to fight it), Power Nullification (Unaffected by his own power), Possible Resistances to Void Manipulation,
    Attack Nullification, Power Nullification, Perception Manipulation, Attack Reflection (Via Nothing
    to Fear), Spatial Manipulation, Gravity Manipulation (Via Space in Its Place), Wind Manipulation,
    Paralysis Inducement (Via Flagging Winds), Ice Manipulation (Via Ice Breaker), Earth Manipulation
    (Via Down to Earth), Mind Manipulation/ Illusion Creation, Pocket Reality Manipulation, Sealing, BFR,
    Power Mimicry, (Via Lose Your Illusion), Fire Manipulation (Via Tears of Flame), Water Manipulation,
    Life Manipulation (Via Parting of Waters), Time Manipulation, Transmutation (Via Test of Time), Blindness,
    Death Manipulation, Curse Manipulation (Via Flowers Athirst), Electricity Manipulation (Via Stolen
    Thunder), Light Manipulation (Via Dying of the Light), and Resistances to all of the above via Master's
    Circle
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
