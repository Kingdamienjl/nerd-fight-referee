  text: "Sa\xEFx was an important and extremely competent retainer of Xemnas, handling most of the day-to-day\
    \ affairs of the Organization and generally ordering the other members around. He is an extremely\
    \ skilled manipulator, claiming to know how to injure a heart despite not having one and sending away\
    \ the useless and traitorous members of the Organization to Castle Oblivion to be eliminated by Sora\
    \ or Axel. In combat, he trades this intelligence for sheer brute force, becoming a berserker that\
    \ tears apart his targets with reckless abandon. However, this proves to be his downfall, as he is\
    \ blinded by rage while in this form, allowing Sora to seize his duplicate Claymores and counter Sa\xEF\
    x with his own attacks."
  source_ids: *id003
