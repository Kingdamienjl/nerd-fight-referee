- id: claim-standard-equipment-20bd5506
  section: equipment
  axis: equipment
  text: 'Various recovery items such as Potions, Ethers, and Elixirs, Keychains that allow him to modify
    his Keyblade *Keyblade: Through channeling one''s strength of heart, the user can summon a Keyblade
    to use in battle. Ven''s Keyblade is the Wayward Wind, a weapon from the realm of light. Through use
    of the Keyblade, the user is granted increased strength, speed, durability, and increased magical
    power. Like his friends Aqua and Terra, Ventus is able to turn his Keyblade into a Keyblade Glider,
    taking the form of a hoverboard that he can use to cross distances at high speeds and assault foes
    by performing various tricks such as spinning the board around. His personal Keyblade, the Wayward
    Wind is somewhat lacking in reach, but makes up for it with a slight increase to strength and magic.
    He later obtains the Lost Memory after regaining his memories of his time as Xehanort''s apprentice.
    It is a Keyblade with much longer reach and greatly improved physical and magical boosts in addition
    to being optimized to score more critically damaging blows on enemies. * Keyblade Armor: Normally
    kept as a simple shoulder plate when not in use, Ventus can activate it at any time by placing his
    hand on it, covering him from head to toe in a futuristic suit of armor with silver, olive, and gold
    highlights. This suit of armor protects Ventus from the Darkness and attacks that would directly target
    the Heart (soul) in addition to letting him survive the vacuum of space. However, it is not an absolute
    defense, as it was eventually corrupted by Xehanort''s darkness while protecting Sora and is later
    destroyed by Riku.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-a633ea88
  section: power_scale
  axis: battle_iq
  text: Like Sora, Ventus is naive, cheerful, and overly-friendly at times. As a result, he is somewhat
    easy to manipulate by those willing to prey on his sheer kindness. However, his kindness belies his
    prodigious use of the Keyblade, with Eraqus noting that his age is his sole barrier to being declared
    a Keyblade Master. Wielding his Keyblade in a unique reverse-grip, Ventus compensates for his relatively
    weak physical and magical prowess by unleashing aggressive flurries of swift strikes and conducting
    various acrobatic maneuvers to throw foes off guard. True to his name, he specializes in the use of
    wind and light, with the latter being a direct result of his purity of heart, controlling the battlefield
    with wide-reaching tornadoes and decimating foes with powerful blasts of light. However, for all his
    skill, he remains inexperienced, as a result, more experienced fighters can read his moves and catch
    him off guard, as Xehanort did during their battle at the Keyblade Graveyard
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-2eb753bd
  section: weaknesses
  axis: weakness
  text: 'Is rather naive and excitable at times due to not having any memory of his time before arriving
    at the Land of Departure Notable Attacks/Techniques: *Command Styles: Command Styles are special forms
    that Ventus and his friends can use by repeatedly using specific types of attacks. Once activated,
    they provide a dramatic boost to their combat abilities and often imbue their attacks with elemental
    properties. **Fever Pitch: Ventus'' personal Command Style that puts a large emphasis on overwhelming
    enemies with wide-ranged, speed-based combos. The finisher of this Command Style consists of a long
    combo ending with five beams of light. **Cyclone: A powerful Command Style that attacks by overwhelming
    enemies with spin attacks. The finisher consists of Ventus spinning around like a cyclone to damage
    all nearby enemies. **Rhythm Mixer: A musical Command Style that electrifies Ventus''s attacks and
    uses rhythmic sounds to attack enemies. The finisher consists of the user summoning a music set where
    they disappear into the ground and attack enemies with sound. The final portion of the finisher consists
    of the user reappearing and causing a shockwave, damaging nearby enemies. **Sky Climber: A Command
    Style that gives Ventus continuous, sustained flight, further enhancing his already impressive mobility.
    The finisher consists of Ventus mounting his Keyblade Glider and hitting multiple enemies before heading
    skyward then crashing back down and finally, spinning on himself, causing a small tornado. **Wingblade:
    Ventus replaces his Keyblade with six light swords that hover behind him, grabbing them to utilize
    in long combos with drastically increased attack speed. Although the swords seem to vanish after a
    certain number of hits, they can be quickly restored and replaced as they''re used. He can also plant
    all six swords in the ground to engulf his surroundings with a powerful burst of light. Shotlocks:
    Shotlocks are powerful abilities that allow Ventus to lock on to multiple targets or focus on a single
    target before unleashing a powerful barrage of attacks on all of them, dealing massive damage in the
    process. **Dark Link: After Vanitas breaks Ventus'' station in the Dive to the Heart, Ventus gains
    this ability. Ventus produces a triad of crystals of light that focuses energy into the center and
    shoots a large energy beam. **Flame Salvo: Ventus''s default Shotlock, allowing him to fire homing
    fireballs at his targets. **Meteor Shower: Ventus fires off homing energy bolts in all directions,
    hitting an especially large number of targets. **Multivortex: Ventus rapidly attacks his enemies with
    six swords of light before finishing off with a massive whirlwind that damages everything in range.
    This is generally considered his most powerful Shotlock. **Pulse Bomb: Ventus repeatedly fires off
    bolts of energy that generate plasma explosions of impact, electrifying enemies. Magic *Faith: Ventus
    summons several pillars of light that rapid spiral outward to deal heavy Holy-elemental damage across
    a wide area in addition to healing him. *Stop: Ventus stops time around his foes, leaving them vulnerable
    to further attacks. *Tornado: Ventus creates a howling whirlwind that he can control, sucking up enemies
    and tossing them about. Finishers and Exclusive Attacks *Air Flair: Ventus rapidly attacks the target
    with backhand swings, each swing accompanied by burst of wind before launching them into the air with
    a series of powerful gusts, stunning them in the process. * Celebration: Upon finishing a combo, Ven
    attacks the opponent by stylishly spinning his Keyblade in front of him, creating recovery items for
    him to use amid combat. * Dark Spiral: After Vanitas breaks the Awakening, Ventus gains this ability.
    He envelops himself in light energy and charges forward at a fast pace. *Dark Splicer: Ventus gains
    this ability during his battle against Vanitas. He rapidly warps around slashing the enemy, leaving
    solid afterimages behind in the process to disorient his foes. *Last Word: Ventus impales and traps
    his enemy with several large crystals of light at a fast pace, then kills them with a powerful slash.
    He used this to kill Vanitas. * Salvation: Ventus''s strongest attack, he charges up energy for a
    brief period before engulfing his surroundings in a tremendously powerful light, annihilating foes
    and healing some of his wounds. *Stratosphere: Upon finishing a combo, Ventus dives onto his opponents,
    slashing them before using them as a springboard to leap high into the air, repeating this maneuver
    several times before wiping out all nearby foes with a powerful gust of wind. * Time Splicer: An attack
    unique to Ventus and Aqua, allowing them to stop time around their foes and teleport to them as they
    please, dishing out powerful Keyblade strikes before they resume time to enact the effects of the
    damage accumulated while time was stopped. *Tornado Strike: Ventus spins around, creating a cyclone
    that knocks surrounding enemies into the air. *Wind R'
  source_ids: *id003
  decisive: false
