- id: claim-powers-and-abilities-6c496a39
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Standard Keyblade powers, Summoning (Can summon his Keyblade
    Armor, Via Snow White's D-Link which has the Sweet Seven technique that can summon colored gems that
    impact into enemies, Via Pete's D-Link which has the Rumble Rave technique that can summon Pete's
    race kart that he uses as Captain Dark, It also has the Fruit Shot technique which can summon a giant
    pineapple that bounces against the ground and bashes enemies), Flight (Can glide through the air,
    Can fly using the Sky Climber Command Style and Vanitas' D-Link), Time Manipulation (In the form of
    slowing down and stopping time), Energy Manipulation, Fire Manipulation, Ice Manipulation, Electricity
    Manipulation, Air Manipulation, Earth Manipulation (Via Terra's D-Link which has the Landbreaker technique
    that allows the user to break the ground), Explosion Manipulation (Via Explosion and Mega Flare),
    Magnetism Manipulation (Via Magnega), Gravity Manipulation (Via Zero Gravity and Transcendence), Invisibility
    (Via Vanish), Damage Boost (Can restore his own Focus Gauge by taking damage), Afterimage Creation,
    Elemental Manipulation, Light Manipulation (Can use several light based attacks as a warrior of light),
    Plant Manipulation (Via Snow White's D-Link which has the Sweet Memory technique that can create twisters
    of flowers that attack enemies), Magic, Teleportation, Enhanced Senses (Has a "map" in his head (While
    it could normally be dismissed as a game mechanic, the status effect in 358/2 Days that prevents access
    to it justifies it being an actual ability)), Telekinesis (Can automatically collect nearby prizes
    and items via Treasure Magnet), Transformation (Can change his Keyblade's form and abilities using
    Keychains, Can transform his Keyblade into a Keyblade Glider which allows for Flight and travel between
    worlds), Vehicular Mastery (Over the Keyblade Glider), Homing Attack (With most spells and Shotlocks),
    Information Analysis (Via Scan which allows him to view his opponent's health), Telekinesis, Spatial
    Manipulation, Poison Manipulation (Via Poison and the Bio Barrage Shotlock), Healing (Via Curaga,
    Faith, Salvation, D-Links and various items, Can recover health proportional to the strength of the
    attacks he blocks via Renewal Block, Via Cinderella's D-Link which has the Regen ability), Damage
    Reduction (Via Damage Control which halves the damage he takes if he's at low health, Via Donald's
    D-Link which has the Shell ability that can reduce damage from Magic attacks by 50%, Via Goofy's D-Link
    which has the Protect ability that can reduce damage from physical attacks by 50%), Resurrection (Via
    Aqua's D-Link which has the Auto-Life ability that can revive the user with 25% of their health),
    Forcefield Creation, Transmutation, Keyblade Master-level Fighter, Size Manipulation (Minimizes enemies
    with Mini, Shrunk down to the size of a mouse in Castle of Dreams), Sleep Manipulation (Via Sleepga),
    Status Effect Inducement (Has a chance of stunning his opponents with Stun Edge, Can blind enemies
    via Blackout), Paralysis Inducement (Can bind enemies in place with bind), Confusion Inducement (Can
    confuse the target with Confuse or the Chaos Snake Shotlock), Statistics Amplification (Via various
    Keychains, Can boost his stats tremendously via Command Styles and D-Links, Defender increases Ventus'
    durability if he's at low health, Via Terra's D-Link which has the Overdrive ability that increases
    the user's strength if they have less than 25% of their health left), Instinctive Reaction (His D-Link
    (His power summoned by someone else) has the Auto-Counter ability which allows the user to automatically
    counterattack when blown away by an enemy attack, Via Terra's D-Link which has the Auto-Block ability
    that allows the user to automatically block frontal attacks, Via Zack's D-Link which has the Attack
    Deflector ability that allows the user to sometimes automatically guard when attacked), Invulnerability
    (While healing himself (Via Leaf Bracer)), Self-Sustenance (Type 1. Can breathe in space) |-|Resistances=Curse,
    and Death Manipulation (Can resist Xehanort's Doom spell), Darkness Manipulation, Absorption, (Unaffected
    by Heartless, which passively kill and absorb things around them), Data Manipulation (Ansem The Wise
    stated that the "heart" cannot be contained by data, and that the process itself would be incalculable),
    Time Manipulation (Can break out of the Chrono Twister's Time Manipulation, the Keyblade grants a
    Resistance to Magic-based Time Stop, and he can move inside of the Realm of Darkness), Sleep Manipulation,
    Dream Manipulation, Statistics Reduction, and Power Nullification (His Keyblade Armor is what protected
    Sora from the darkness, and Keyblade Armor can resist all aspects of darkness), Existence Erasure
    (Can take hits from Heartless, which can do this with any attack), Fire Manipulation, Ice Manipulation,
    Electricity Manipulation, Air Manipulation, Poison Manipulation (Via Poison Block), Darkness Manipulation
