- id: claim-powers-and-abilities-ef78c935
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Aura, Keyblade Master powers minus the
    Power of Waking, Light Manipulation, Summoning (Can summon his Keyblade Armor),
    Flight (Flies into the air when performing Meteor or Prism Rain, Flies around
    when using Barrier Surge), Chain Manipulation (Can create chains of light to bind
    opponents), Teleportation, Vehicular Mastery (Over the Keyblade Glider), Homing
    Attack (Via Oboro and Kasumi), Fire Manipulation, Ice Manipulation, Electricity
    Manipulation, Air Manipulation, Possible Earth Manipulation, Poison Manipulation,
    Blindness Inducement, Time Manipulation, Damage Reduction, Healing, Self-Sustenance
    (Type 1. Can breathe in space) |-|Resistances=Elemental Manipulation, Darkness
    Manipulation, Cosmic Radiations, Corruption (Type 2), possible Possession (His
    Keyblade Armor protects him from the Corrupting Effects of the Darkness of the
    Lanes Between, it was implied that if Terra had his Armor on he would have been
    safe from Xehanort's possession), Absorption, Death Manipulation (Unaffected by
    Heartless, which passively kill and absorb things around them), Data Manipulation
    (Ansem The Wise stated that the "heart" cannot be contained by data, and that
    the process itself would be incalculable), Time Stop (The Keyblade grants a Resistance
    to Magic-based Time Stop, and he can move inside of the Realm of Darkness), Existence
    Erasure (Can take hits from Heartless, which can do this with any attack), Sleep
    Manipulation, Dream Manipulation, Statistics Reduction, and Power Nullification
    (Ventus' Keyblade Armor is what protected Sora from the darkness, and Keyblade
    Armor can resist all aspects of darkness), Madness Manipulation (Type 3), Mind
    Manipulation, Memory Manipulation, Soul Manipulation, Empathic Manipulation (The
    Realm of Darkness has been stated to eradicate existence itself within it, and
    anyone who's traveled there have never returned. Ansem by being in the Realm of
    Darkness was losing his sense of self and memories, having to give into his hatred
    to survive. Aqua not long after being in the Realm of Darkness lost the will to
    continue, and needed to stay true to her friends to fight it)
  source_ids: *id003
  decisive: true
  status: unverified
