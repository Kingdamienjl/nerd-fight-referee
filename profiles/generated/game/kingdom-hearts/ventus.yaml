  attack_potency:
    text: Multiverse level (Comparable to Aqua at the time) | Complex Multiverse level
      (Bested a boosted Vanitas who in base drove Aqua to unconsciousness not days
      before, traded blows with the former even when he had the X-Blade, the counterpart
      to Kingdom Hearts, albeit while it was incomplete, can keep up with Terra-Xehanort
      in KHIII alongside Aqua and Sora)
    source_ids:
    - mediawiki-4764405
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Infinite (Barely reacted to Stitch's cruiser, which traverses solar systems,
      while it was in hyperdrive, is easily one of the fastest characters in the series,
      capable of traveling between worlds (Which each reside in different solar systems)
      in short periods of time, comparable to others that can travel across the worlds
      with a Keyblade Glider, which has been shown to also relate to direct physical
      movements and is comparable to the Gummi Ship based on Aqua and Ventus getting
      to the Keyblade Graveyard within a day just like it while also including the
      threat of Gummi Heartless, comparable to Xemnas, who reacted to Roxas going
      from Radiant Garden to the Keyblade Graveyard in seconds, not far behind Sora,
      who reacted to a Keyblade beam from Xehanort of a similar nature as this one)
    source_ids:
