    Gravity Manipulation (Via Space in Its Place), Wind Manipulation, Paralysis Inducement (Via Flagging
    Winds), Ice Manipulation (Via Ice Breaker), Earth Manipulation (Via Down to Earth), Mind Manipulation/
    Illusion Creation, Pocket Reality Manipulation, Sealing, BFR, Power Mimicry, (Via Lose Your Illusion),
    Power Nullification (Via Sighing of the Moon), Fire Manipulation (Via Tears of Flame), Water Manipulation,
