- id: claim-weaknesses-bf9f3ff7
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Command Styles: Command Styles are special forms that
    Aqua and her friends can use by repeatedly using specific types of attacks. Once activated, they provide
    a dramatic boost to their combat abilities and often imbue their attacks with elemental properties.
    **Spellweaver: Aqua uses the power of light to telekinetically control her Keyblade and increase her
    magical power and attack range. Her finisher has her assault foes with balls of light as she attacks
    with her Keyblade and finishing foes with a pirouette that releases arcs of magic. **Ghost Drive:
    Aqua''s channels the power of darkness to drastically increase her speed and allow her to blitz opponents
    with swift rushing attacks and bursts of teleportation. *Shotlocks: Shotlocks are powerful abilities
    that allow Aqua to lock on to multiple targets or focus on a single target before unleashing a powerful
    barrage of attacks on all of them, dealing massive damage in the process. **Bubble Blaster: Aqua unleashes
    a torrent of bubbles from the tip of her Keyblade, dealing explosive water damage to all foes caught
    by them. **Prism Rain: Aqua fires several salvos of colorful homing projectiles that converge on the
    target to deal heavy magic damage. **Lightbloom: Aqua''s most powerful Shotlock, she spins around
    while firing homing blasts of light in all directions, dealing massive damage to all foes caught by
    this attack. Finishers and Exclusive Attacks *Barrier: Unlike her friends, Aqua generates an omnidirectional
    barrier to block incoming attacks instead of blocking them with her Keyblade, leaving no blind spots.
    **Barrier Surge: Aqua rushes forward while casting Barrier, deflecting incoming attacks and knocking
    aside foes in the process. *Glacier: One of Aqua''s strongest attacks, she flash freezes all nearby
    enemies before sending them skyward with an icy gust of wind. *Magic Hour: Her single strongest attack,
    she teleports all around the field, diving onto foes and leaving behind devastating pillars of light
    that deal massive damage on contact. *Raging Storm: Aqua''s exclusive variation of Firaga, she generates
    three pillars of flame that rotate around her and deal damage to anyone who dares to approach her.
    *Thundaga Shot: Fires a Thundaga spell concentrated into a fast-moving projectile. Magic *Bind: Locks
    the target in place, preventing them from moving from their current position. *Blackout: Aqua completely
    blinds her foes to make it extremely difficult for them to land physical attacks or properly aim.
    *Blizzaga: Aqua creates a sizable, spiked chunk of ice that deals heavy ice-elemental damage. *Mini:
    Aqua shrinks her foes to the size of an ant, proportionally lowering their speed, strength, and durability.
    In addition, their small size allows them to be crushed simply by stepping on them. *Stopga: Aqua
    instantly freezes time around her foes, leaving them helpless. *Transcendence: Creates an inescapable
    anti-gravity field that allows Aqua to toss her foe around at her leisure. ==Gallery== {{Scroll box|content=
    ===Keyblades=== Rainfell KHBBS.png|Rainfell|link=http://www.khwiki.com/Rainfell 200px-Stormfall KHBBS.png|Stormfall|link=http://www.khwiki.com/Stormfall
    200px-Master''s Defender KHBBSFM.png|Master''s Defender|link=http://www.khwiki.com/Master%27s_Defender
    ===Command Styles=== Ghost Drive (Finisher) KHBBS.gif|Ghost Drive''s Finisher|link=http://www.khwiki.com/Ghost_Drive
    Spellweaver KHBBS.gif|Spellweaver''s Finisher|link=http://www.khwiki.com/Spellweaver ===Shotlocks===
    Prism Rain KHBBS.gif|Prism Rain|link=http://www.khwiki.com/Prism_Rain Lightbloom KHBBS.gif|Lightbloom|link=http://www.khwiki.com/Lightbloom
    ===Finishers and Exclusive Attacks=== Glacier KHBBS.gif|Glacier|link=http://www.khwiki.com/Glacier_(Command)
    Magic Hour KHBBS.gif|Magic Hour|link=http://www.khwiki.com/Magic_Hour Raging Storm KHBBS.gif|Raging
    Storm|link=http://www.khwiki.com/Raging_Storm }} ==Notable Matchups== Victories: Losses: Inconclusive:
