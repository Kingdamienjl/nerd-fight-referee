- id: claim-powers-and-abilities-07667583
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Keyblade Master powers, Energy Projection, Time Manipulation
    (In the form of slowing down and stopping time), Fire Manipulation, Ice Manipulation, Electricity
    Manipulation, Air Manipulation, Earth Manipulation (Via Terra's D-Link which has the Landbreaker technique
    that allows the user to break the ground), Explosion Manipulation (Via Explosion and Mega Flare),
    Magnetism Manipulation (Via Magnega), Gravity Manipulation (Via Zero Gravity and Transcendence), Invisibility
    (Via Vanish), Damage Boost (Can restore her own Focus Gauge by taking damage, Her reprisals after
    blocking deal more damage via Critical Counter, Her reprisals deal 50% more damage via Reprisal Boost),
    Afterimage Creation, Light Manipulation (Can use several light based attacks as a warrior of light),
    Darkness Manipulation (Via Ghost Drive), Plant Manipulation (Via Snow White's D-Link which has the
    Sweet Memory technique that can create twisters of flowers that attack enemies), Telekinesis (Can
    automatically collect nearby prizes and items via Treasure Magnet, Can yank out munny, health and
    D-Link prizes from her enemies via Munny Magnet, Energy Magnet and D-Link Magnet), Damage Reduction
    (Via Damage Control which halves the damage she takes if she's at low health, Via Donald's D-Link
    which has the Shell ability that can reduce damage from Magic attacks by 50%, Via Goofy's D-Link which
    has the Protect ability that can reduce damage from physical attacks by 50%), Teleportation, Enhanced
    Senses (Has a "map" in her head (While it could normally be dismissed as a game mechanic, the status
    effect in 358/2 Days that prevents access to it justifies it being an actual ability)), Information
    Analysis (Via Scan which allows her to view her opponent's health), Poison Manipulation (Via Poison
    and the Bio Barrage Shotlock), Healing (Via Curaga, D-Links and various items, Can heal herself by
    blocking attacks with the Renewal Barrier technique, Via Cinderella's D-Link which has the Regen ability),
    Resurrection (Her D-Link (Her power summoned by someone else) has the Auto-Life ability which revives
    the user with 25% of their health), Forcefield Creation, Size Manipulation (Minimizes enemies with
    Mini), Sleep Manipulation (Can put enemies to sleep via Sleep), Status Effect Inducement (Has a chance
    of stunning her opponents with Stun Edge, Can blind enemies via Blackout, Can inflict various status
    effects via Magic Pulse (Being confused, frozen, blinded or stunned)), Paralysis Inducement (Can bind
    enemies in place with bind), Confusion Inducement (Can confuse enemies with Confuse or the Chaos Snake
    Shotlock), Statistics Amplification (Can boost her stats tremendously via various Command Styles and
    D-Links, Defender increases Aqua's durability if she's at low health, Via Terra's D-Link which has
    the Overdrive ability that increases the user's strength if they have less than 25% of their health
    left, Can perform a strike that is three times stronger than usual via Wishing Edge), Instinctive
    Reaction (Her D-Link (Her power summoned by someone else) has the Magic Deflector ability which allows
    the user to occassionally automatically block elemental attacks, Via Terra's D-Link which has the
    Auto-Block ability that allows the user to automatically block frontal attacks, Via Ventus' D-Link
    which has the Auto-Counter ability that allows the user to automatically counterattack when blown
    away by an enemy attack, Via Zack's D-Link which has the Attack Deflector ability that allows the
    user to sometimes automatically guard when attacked), Master Keyblade Wielder, Aura (Via Spellweaver),
    Invulnerability (While healing herself (Via Leaf Bracer) or using the Teleport Spike technique), Teleportation,
    Power Bestowal (Cast a spell on Kairi, which helped her find her special one), Transformation (Can
    change her Keyblade's form and abilities using Keychains, Can transform her Keyblade into a Keyblade
    Glider which allows for Flight and travel between worlds), Vehicular Mastery (Over the Keyblade Glider),
    Homing Attack (With most spells and Shotlocks), Chain Manipulation (Bound a Demon Tide in chains of
    light), Sound Manipulation (Via Rhythm Mixer), Is able to hold on in a fight after taking massive
    damage or being comboed via Second Chance and Once More, Purification (Esuna and Panacea allow Aqua
    to remove negative status effects from herself, Via Cinderella's D-Link which has the Auto-Remedy
    ability that passively removes negative status effects from the user), Summoning (Can summon her main
    weapon and her Keyblade Armor, Via Snow White's D-Link which has the Sweet Seven technique that can
    summon colored gems that impact into enemies, Via Pete's D-Link which has the Rumble Rave technique
    that can summon Pete's race kart that he uses as Captain Dark, It also has the Fruit Shot technique
    which can summon a giant pineapple that bounces against the ground and bashes enemies, As Anti-Aqua
    she can summon a Demon Tower to assist her, restrain enemie
  source_ids: *id003
  decisive: true
