- id: claim-standard-equipment-6c40592c
  section: equipment
  axis: equipment
  text: 'Various recovery items such as Potions, Ethers, and Elixirs *Keyblade: By channeling one''s strength
    of heart, the user can summon a Keyblade to use in battle. Through use of the Keyblade, the user is
    granted increased strength, speed, durability, and increased magical power. Aqua''s Keyblade is Rainfell,
    a Keyblade from the Realm of Light. It lacks in reach but offers a balanced boost to both physical
    attacks and magical attacks. It is later transformed into the Stormfell, offering greater reach and
    even greater boosts to her attacks. After losing it and her armor upon failing to save Terra from
    Xehanort''s influence, she begins wielding Eraqus''s Keyblade, the Master''s Defender, an even more
    potent Keyblade with excellent reach. *Keyblade Armor: Normally kept as a simple shoulder plate when
    not in use, Aqua can activate it at any time by placing her hand on it, covering her from head to
    toe in a futuristic suit of armor with silver, black, navy-blue, and dun highlights. This suit of
    armor protects Aqua from the Darkness and attacks that would directly target the Heart (soul) in addition
    to letting her survive the vacuum of space. She lost it to Terra-Xehanort while trying to save Terra''s
    heart, with it resting inside a hidden chamber in Castle Oblivion ever since.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
