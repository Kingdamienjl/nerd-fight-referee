  intelligence:
    text: Larxene is an exceptionally capable combatant, easily dominating Sora and
      the Riku Replica in their first fight, jabbing and kicking at them faster than
      they can react and knocking them into a wall before they retaliate. She specializes
      in close-range melee combat, utilizing her speed to overwhelm foes with flurries
      of jabs and kicks, their effectiveness increased by her usage of knives. She
      is also prone to swarm tactics, generating duplicates to attack foes from multiple
      directions at once and to break through persistent defenses. She is also incredibly
      skilled in the use of magic, particularly lightning magic, being Roxas' tutor
      in the art (albeit unwillingly). She utilizes this to full effect in her fights,
      constantly assailing foes with nearly endless downpours of lightning bolts and
      charging herself with lightning to unleash even more powerful and swift attacks.
      Larxene is also a sadist, reading Marquis de Sades' works with glee and dragging
      out her foes' pain and preying on their mental weaknesses by consistently taunting
      them for their failures. As a result, she is able to strike fear into nearly
      any opponent, even the Riku Replica, which claimed to feel no fear. However,
      this also means that while she specializes in speed-blitzing her foes, she sometimes
      fails to get serious enough or drags out the fight to enjoy it more
    source_ids:
    - mediawiki-larxene-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
