        technique where Roxas hits the opponent with a powerful upward swing that
        hits them into the air. * Vicinity Break: Vicinity Break is a Keyblade technique
        where Roxas unleashes a powerful spinning attack when surrounded. * Dodge
        Slash: Dodge Slash is a Keyblade technique where Roxas quickly swings his
        Keyblade left and right when surrounded just like Vicinity Break, but only
        if they are quite closer. * Retaliating Slash: Retaliating Slash is a Keyblade
        technique where Roxas, after being knocked into the air from an attack, quickly
        recovers and slashes the opponent with his Keyblade. * Flash Step: Flash Step
        is a Keyblade technique where Roxas quickly dashes to an opponent to attack,
        the stance in which he does so also allows to block attacks with the Keyblade
        on his path at the same time. * Aerial Finish: Aerial Finish is a Keyblade
        technique where Roxas, after finishing an aerial combo against a single target,
