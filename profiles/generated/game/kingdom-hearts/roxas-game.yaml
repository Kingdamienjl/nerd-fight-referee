    text: 'Multiverse level (ComparableKingdom Hearts 358/2 Days Ultimania; https://www.khinsider.com/news/358-2-Days-Scenario-Interview-894
      -- Why does Xion become able to use the Keyblade again on day 96? Nomura: This
      was less due to her doing missions together with Roxas every day, and more due
      to using his Keyblade. She was able to once again copy his power. At this moment,
      the two of them were perfectly in balance." to Xion, who inherited her powers
      from KHI Sora) | Multiverse level (Defeated Final Form Xion, and so should be
      at least 4 times stronger than KHI Sora as her powers were multiplied that many
      times in the process) | Multiverse level (Fought Riku and would have defeated
      him if he didn''t give into the darkness to make himself more powerful, defeated
      Saix, fought on par against a near-end game KHII Sora who had previously fought
      Demyx and Xaldin, the latter of whom is the third strongest member of the Organization
      alongside Lexaeus. Roxas is also superior to both of them as he is stated to
      be the second most powerful member of Organization XIII at his full potential
      according to Tetsuya Nomura, only being surpassed by Xemnas himself) | Complex
      Multiverse level (Comparable to the other Guardians of Light such as KHIII Sora)'
