    - field: standard_equipment
      value: '*Sharpshooter: A pair of Arrowguns Xigbar uses that shoots energy projectiles
        that can follow its targets. He can also combine them to create a larger Arrowgun
        that can shoot a faster and more powerful energy projectile. *Keyblade: Through
        channeling one''s strength of heart, the user can summon a Keyblade to use
        in battle. Through the use of the Keyblade, the user is granted increased
        strength, speed, durability, and increased magical power, as well as access
        to special abilities, such as turning his Keyblade into a Keyblade Glider.
        Luxu possesses "No Name", better known as Master Xehanort''s Keyblade, which
        is noted to be incredibly ancient and has the Master''s eye inlaid in the
        tip, allowing him to see the future through it. *Black Coat: A magically enchanted
        coat that allows the wearer to pass through the Corridors of Darkness safely,
        warding off corrupting influences and preventing the power of Darkness from
        encroaching one''s mind and soul. It is also useful for stealth, as the hood
        completely obscures one''s face and blends in the with the shadows created
        by the Corridors of Darkness.'
      source_id: vsbattles-xigbar-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: As the Organization's highest-ranking member short of Xemnas himself,
        Xigbar is an exceptionally capable combatant, casually trouncing dozens of
        Heartless at once without bothering to aim and is ruthlessly efficient on
        his missions. He specializes in long-range combat, harassing foes from a distance
        with his arrows and teleporting to prevent them from ever reaching him and
        even converts his arrowguns into a sniper rifle to shoot off devastating blasts
        to finish off cornered enemies. He supplements this with his spatial manipulation
        abilities, twisting the terrain to limit his opponent's freedom of movement,
        generating portals to redirect his shots for greater accuracy, and using his
        teleportation and gravity manipulation to grant himself unique and unusual
        vantage points from which to snipe his targets. However, for all his combat
        prowess, he is prone to being rather laid-back and lackadaisical, rarely getting
        serious unless he feels it's absolutely necessary. Luxu, while seemingly younger
        than the other Foretellers, is no less experienced, having been extensively
        trained by the Master of Masters in the use of his Keyblade and magic and
        being a general peer of his fellow apprentices. The nature of his role has
        made him incredibly gifted in the ways of deception, remaining almost completely
        hidden from the Foretellers for nearly a year and subtly manipulating events
        to ensure the Keyblade War came to pass. In addition, it is heavily implied
        that Luxu survived the Keyblade War, and would later go on to become a Master
        himself, teaching several Keyblade Wielders in a line of succession that would
        eventually lead to the rise of Eraqus and Xehanort. It is also likely that
        he was counting on Sora defeating Xehanort in the end, so that his plans could
        be realised.
      source_id: vsbattles-xigbar-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Xigbar is laid back and tends to not get serious even in the heat of
        battle, his weapons have a relatively lengthly reload time which leaves him
        vulnerable to attacks (but this is eliminated in his Data Battle), Reflecting
        his own shots back at him can leave him temporarily disoriented, He needs
        to be hard-pressed to use his Limit Break. | Luxu has a limited supply of
        magic and must take the time to recharge before using it again, Is more vulnerable
        without his Keyblade, but this is mitigated by the fact that he can still
        cast magic and teleport his Keyblade back to his hand. Notable Attacks/Techniques:
        * Arrow Storm: One of Xigbar''s Desperation Attacks, he twists the area into
        a tiny platform to limit his opponent''s movement before teleporting into
        the center, spinning around with Arrowguns blazing before teleporting outside
        of the arena to fire more rapid bursts of arrows from outside of his opponents''
        range. He then attempts to finish his target by opening over a dozen wormholes
        to rain a countless number of arrows on his opponents. * Cold Sniper: Xigbar
        teleports to a suitable vantage point before combining the Sharpshooter into
        a rifle and firing a barrage of rapid-fire arrows until his target aligns
        with his targeting reticule, upon which he fires a swift and powerful bolt
        that deals heavy damage on impact. He will continue to do so until he gets
        bored or if his opponent manages to deflect one or more of his sniper bolts.
        * Critical Snipe: Xigbar''s Limit Break, he combines the Sharpshooter into
        a rifle before firing off powerful energy bolts with much greater force than
        his normal arrows, blowing foes away with the massive knockback generated
        by the projectiles. Unfortunately, he is unable to use this attack while hanging
        upside-down, limiting his possible shooting angles. ** Final Critical Snipe:
        Xigbar''s Final Limit. In this state, his bullets become larger, more powerful,
        and are now fired at a faster rate. They also morph into pink, white, and
        blue energy spheres that ripple through the air as they are fired, dealing
        heavy damage to any enemies that get hit by these spheres. * Plasma Arrows:
        Xigbar fires a charged, neon blue arrow that ricochets around the battlefield,
        catching foes who are trying to dodge his normal shots off guard. However,
        like his normal arrows, these can be reflected to stun Xigbar. * Potshots:
        Xigbar continuously teleports around the battlefield, hanging in the air far
        from his opponent to prevent them from getting close as he pelts them with
        rapid-fire arrows. * Terrain Twist: Xigbar instantly reshapes the space around
        his foes, limiting their movement and rendering them sitting ducks for Xigbar
        to pick off until they adapt. * Wormholes: Xigbar is able to generate miniature
        wormholes that he can redirect his shots through, allowing him to attack from
        surprising angles to catch foes off guard or redirect arrows that have already
        missed. Note: Although Xigbar is laid back in appearance and in fights, Kingdom
        Hearts III confirmed that this was just a facade in order to gain Xehanort''s
        trust and not look suspicious. Xigbar would most likely not act under this
        mentality given he''s in an actual fight. The reason this is still noted as
        a weakness, however, is just that it is shown how he operates in fights thus
        far. ==Gallery== 640px-Sharpshooter KHIIFM.png|Sharpshooter|link=http://www.khwiki.com/Sharpshooter
