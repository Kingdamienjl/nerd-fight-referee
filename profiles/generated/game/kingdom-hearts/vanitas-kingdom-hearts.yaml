- id: claim-weaknesses-46e30207
  section: weaknesses
  axis: weakness
  text: "Vanitas is sometimes overconfident and tends to underestimate his foes' abilities. Destroying\
    \ the Unversed will cause him immense physical pain (However, he has shown great resilience to this,\
    \ as, shortly after his creation, he kept creating and destroying Unversed out of his own self-loathing.\
    \ See below for further clarifications) | His physical body and soul, while separated, are still bound\
    \ to some extent. If his soul is defeated, so will his body and \u03C7-Blade (When Ventus defeated\
    \ Vanitas' soul, his physical body died as well during his fight with Aqua and Mickey) Notable Attacks/Techniques:\
    \ ===Base/\u03C7-Blade"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-2d1ce4a1
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Self-Sustenance (Type 1. Can breathe in space), Standard
    Keyblade powers, Aura, Magic, Flight (Can fly on Keyblades or by himself), Fire Manipulation, Ice
    Manipulation, Electricity Manipulation and Air Manipulation, Teleportation (Can teleport constantly),
    Duplication (Can create clones via Clone Burst), Healing (Via Curaga), Summoning (Can summon hordes
    of Unversed and Heartless, His Unversed have access to Superhuman Physical Characteristics, Inorganic
    Physiology and Immortality (Type 8, dependent on Vanitas) via Unversed in general, Flight via some
    of the varieties of Unversed, Large Size (Type 0) via some of the varieties of Unversed, Natural Weaponry
    via Scrapper, Power Mimicry, Information Manipulation and Duplication via Mimic Master, Statistics
    Amplification via Iron Imprisoner, Time Stop via Chrono Twister, Invisibility via The Metamorphosis,
    Poison Manipulation via Mad Treant, Jellyshade, Flowersnake (Flowersnake also has Stunning Inducement),
    Vile Phial and Vitality Vial (Vitality Vial and Vile Phial also have Healing), Explosion Manipulation
    and Air Manipulation via Tank Toppler, Mind Manipulation and Confusion via Mandrake, Sound Manipulation
    via Symphony Master, Fire Manipulation via Red Hot Chili, Flame Box (Flame Box also has Summoning
    of meteors) and Lump of Horror (Lump of Horror has Weather Manipulation through inflicting the thundercloud
    status effect and Air Manipulation through flapping its wings), Electricity Manipulation via Yellow
    Mustard and Metamorphosis (Metamorphosis also has Invisibility), Ice Manipulation via Blue Sea Salt,
    Fire Manipulation, Ice Manipulation and Electricity Manipulation via Element Cluster and Triple Wrecker,
    Energy Projection and Teleportation via Sonic Blaster, and Weapon Mastery and Room Possession via
    Iron Imprisoner (Iron Imprisoner also has Fire Manipulation and Explosion Manipulation). His Heartless
    have access to standard Heartless Physiology), Darkness Manipulation (Is the darkness in Ventus' heart,
    can enhance his moves with it), Afterimage Creation (Can create afterimages with his strikes), Portal
    Creation (Can create portals), Regeneration (Unknown, after the destruction of his body, soul and
    "heart", Vanitas had still been able to regenerate) |-|Resistances=Absorption, Death Manipulation
    (Unaffected by Heartless, which passively kill and absorb things around them), Data Manipulation (Ansem
    The Wise stated that the "heart" cannot be contained by data, and that the process itself would be
    incalculable), Existence Erasure (Can take hits from Heartless, which can do this with any attack),
    Darkness Manipulation, Regeneration Negation (Unknown; Managed to regenerate back even after being
    defeated by Keyblade users), Corruption (Type 2) (Black Coats protect their wearers from the corrupting
    effects of the darkness of the Dark Corridors and the Realm of Darkness), Madness Manipulation (Type
    3), Mind Manipulation, Memory Manipulation, Soul Manipulation, Empathic Manipulation (The Realm of
    Darkness has been stated to eradicate existence itself within it, and anyone who's traveled there
    have never returned. Ansem the Wise by being in the Realm of Darkness was losing his sense of self
    and memories, having to give into his hatred to survive, Aqua not long after being in the Realm of
    Darkness lost the will to continue, and needed to stay true to her friends to fight it), Time Stop
    (Can move inside of the Realm of Darkness (Which is timeless in nature), and the Keyblade grants additional
    Resistance to Magic-based Time Stop), Cosmic Radiations
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
