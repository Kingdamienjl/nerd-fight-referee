- id: claim-weaknesses-46a62e3c
  section: weaknesses
  axis: weakness
  text: 'He can be slightly overconfident. His old age somewhat hampers his mobility
    and forces him to rely more on his magic and cunning (though this isn''t much
    of a problem given his feats and ability to transplant his heart or fragments
    of it into other bodies), to travel through time he must give up his body and
    be only a heart. Feats: *Manipulated Terra into letting darkness into his heart.
    *Defeated Terra and transferred his own heart into Terra''s body, becoming Terra-Xehanort.
    *Divided his heart among two other people, namely Braig and Isa. *Overthrew Ansem
    the Wise and stole his name. *Used his Keyblade to divide not only himself but
    at least five other people into Heartless and Nobodies. *Gained the absolute loyalty
    and admiration of Maleficent. *Sent his Heartless self, Ansem, Seeker of Darkness
    back in time to grant the power of time travel to his 16-year-old self (Young
    Xehanort). *Successfully summoned Kingdom Hearts. Notable Attacks/Techniques:
    Master Xehanort *Blizzaga: Summons three icicles to chase his target. He normally
    shoots off dark versions of these along with the normal ones in pairs, dealing
    both ice-elemental and darkness-elemental damage. Xehanort also uses this spell
    in conjunction with his physical combos, as well as using a close-range version
    of it where he freezes the target''s body whole in an instant. *Dark Firaga: Shoots
    a ball of dark flames at the target, dealing dark damage. *Dark Thundaga: Calls
    down a strike of dark lightning on his target. *Quake: Causes the earth to shape
    and erupt under his foe, sending his target flying into the air. Terra-Xehanort
    *Ars Solum: An ability taken from Terra. Performs a series of ferocious attacks
    empowered by darkness. *Curaga: Restores a substantial amount of health. *Dark
    Haze: Dashes through the field cloaked in darkness, damaging anything in his path.
    *Dark Impulse: Cloaks himself in darkness and mercilessly attacks his enemy with
    a barrage of feral attacks that utilizes both Keyblade and hand-to-hand strikes,
    finishing it off with a dark uppercut erupting from below. *Dark Volley: Launches
    multiple dark projectiles at the target. *Meteor: Summons a meteor to fall onto
    the battlefield and explode to destroy the target. *Rockbreaker: An ability taken
    from Terra. Xehanort summons several rock pillars from the ground and directs
    them at the target. His version differs from Terra''s in that instead of three
    pillars, he summons over ten at a time. *Ultima Cannon: An ability taken from
    Terra. Xehanort transforms his Keyblade into a massive cannon that shoots an equally
    massive ball of energy at his target, causing an even more massive explosion.
    With the Dark Figure *Dark Orbs: The Dark Figure fires two orbs of darkness towards
    the enemy, temporarily blinding them if hit by either one of them. *Dark Shadow:
    The Dark Figure detaches itself from Terra-Xehanort to attack the target from
    below several times. If the Dark Figure grabs the target, it will then slam them
    down at the ground, creating a large shockwave. *Shock Slash: The Dark Figure
    shoots a pair of shockwaves towards the target. No Heart *Big Bang: He hovers
    in midair, and concentrates dark energy before generating an enormous explosion.
    *Charge Crash: Slams down on the ground from the air, creating a large shockwave.
    *Dark Kick: Transforms his Keyblade into a set of greaves and assaults the target
    with a series of kicks. *Dark Volley: Fires several dark projectiles from his
    fist. *Distortion of Space and Time: No Heart creates a pool of darkness or a
    dark pillar of energy on the ground. If the target touches it, it will either
    leave them unable to move for a couple of seconds or double their speed and power
    depending on which one the target touches. *Explosive Punch: No Heart concentrates
    darkness in his fist before unleashing a devastating punch against his target.
    *Keyblade Shot: Summons an array of Keyblades that swarm the target. *Keyblade
    Glider: Transforms his Keyblade into a set of wings. This allows him to fly above
    the field, and attack the enemy. He prefers to use Dark Volley, Keyblade Shot,
    Charge Crash, and Big Bang while this ability is active. *Sonic Impact: No heart
    cloaks himself in darkness before dashing at the target twice to damage them and
    send them flying. *Upward Slash: A single slash that knocks the target into the
    air, leaving them open to follow up attacks. ==Gallery== {{Scroll box|content=
    Young Xehanort KHIII.png|right|Xehanort''s younger self, from when he was a teen
    on Destiny Islands. Coat Terra-Xehanort KH3.png|Xehanort after possessing Terra,
    commonly referred to as "Terra-Xehanort". Coat Ansem KH3.png|Ansem, also known
    as Xehanort''s Heartless Xemnas KHIII.png|Xemnas, the Nobody incarnation of "Terra-Xehanort"
    NoHeart.png|Xehanort''s Keyblade Armor, later given life by the Mirage Arena as
    the "No Heart". Coat Vanitas KH3.png|Vanitas, originally Xehanort apprentice and
    one of his other Seekers of Darkness. Xigbar KHIII.png|Braig, Xehanort''s cohort
    and curren'
  source_ids: *id003
