  attack_potency:
    text: Complex Multiverse level (One of the most powerful beings in the series.
      Struck down Master Eraqus and fought on par with Terra, who is one of the most
      physically powerful characters in the series. Effortlessly froze Ventus solid.
      His magical prowess is equal or superior to Aqua, a Keyblade Master specializing
      in magic. He should also be on par with Eraqus in this matter. Destroyed the
      majority of the Land of Departure with a pseudo black hole spell leaving everything
      in a complete wreck) | Complex Multiverse level (Capable of contending with
      Aqua, who had previously defeated Ventus-Vanitas, albeit was being held back
      by Terra's heart fighting against his own. Fought Lingering Will) | Complex
      Multiverse level (Effortlessly decimated several of the Guardians of Light in
      the initial battle, one-shotting Ventus, and easily holding back Sora with just
      an energy ball. Easily restrained the latter two and Aqua during a second confrontation)
      | Complex Multiverse level (Just a fragment of his heart on each of the Real
      Organization XIII members empowered them to be on the current level of the Guardians
      of Light), higher with Kingdom Hearts (Wields the X-Blade, which granted him
      control over the true Kingdom Hearts, which was going to recreate the cosmology
      of the setting. Such cosmology is of a size on this level)
    source_ids: *id002
    confidence: 0.95
  speed:
