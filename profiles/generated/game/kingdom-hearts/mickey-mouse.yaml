- id: claim-powers-and-abilities-abc0dc0e
  section: abilities
  axis: hax
  text: 'Classic= {{#tag:tabber|Base= *Superhuman Physical Characteristics *Breaking the Fourth Wall and
    Dimensional Travel (He can exit the cartoon via brute force and spin it around. Others cannot get
    back inside if the cartoon is over.Get A Horse (2013) He spin the screen around.The Wonderful World
    of Mickey Mouse S2E5: Steamboat Silly He is apparently able to hear and see people from beyond the
    fourth wallMickey Mouse Clubhouse S1E1: Daisy Bo-Peep) *Genius Intelligence *Toon Physiology *Weapon
    Mastery (He is skilled with a swordThe Gallopin'' Gaucho (1928) and was able to fight three royal
    guards at once for a while before overwhelmed.Walt Disney''s Mickey Mouse He is skilled with a gunWalt
    Disney''s Mickey Mouse and is a skilled gunner while flying a plane.Walt Disney''s Mickey Mouse He
    once weaved around a blimp while taking out all its guns without a hitch.Walt Disney''s Mickey Mouse)
    *Accelerated Development (Abilities; He is able to learn how to fly a plane in seconds.Plane Crazy
    (1928) The same was accomplished with ventriloquismWalt Disney''s Mickey Mouse and languageWalt Disney''s
    Mickey Mouse) *Stealth Mastery (He managed to sneak up on Pete.Walt Disney''s Mickey Mouse He managed
    to steal a gun from a sheriff without him noticing.Walt Disney''s Mickey Mouse He stole a watch from
    a doctor while he was watching him.Walt Disney''s Mickey Mouse) *Martial Arts (He knows jiu jitsu
    of which he majored in an advanced physical courseWalt Disney''s Mickey Mouse) *Vehicular Mastery
    (Can perform nearly impossible aerial maneuvers on a plane.Plane Crazy (1928)) *Acrobatics (Can perform
    long jumps as well as flips.Touchdown Mickey (1932)) *Non-Physical Interaction (He can unzip smokeHouse
    of Mouse S2E13: Dennis the Duck) *Additional Subjective Reality (He can make his own hallucinations
    come to life and physically interact with him.Orphan''s Picnic (1936)) *Durability Negation (He can
    pop people and deflate them like balloonsThe Opry House (1929)) *Paralysis Inducement (He knows a
    jiu jitsu technique that paralyzes the nervesWalt Disney''s Mickey Mouse) *Broadway Force and Life
    Manipulation (Managed to get an entire forest of aggravated animals to dance along with him by whistling.Jungle
    Rhythm (1929) He can make inanimate objects start to come to life to start dancing with him. He is
    able to make body parts come to life and make skeletons animate and pop out of people.The Opry House
    (1929) He can make clothes come to lifeThe Wonderful World of Mickey Mouse S2E5: Steamboat Silly)
    *Astral Projection (He can astral project while he is sleepingThru the Mirror (1936)) *Physics Manipulation
    (He can suspend himself in midairPlane Crazy (1928)) *Superhuman Precision (He shot at Pete precisely
    enough to disarm him.Walt Disney''s Mickey Mouse He shot a dollar coin as it was flipped in midair.Walt
    Disney''s Mickey Mouse He can make ricochet shots.Walt Disney''s Mickey Mouse) *Air Manipulation (He
    halted and dispersed of a tornadoThe Band Concert (1935)) {{!}}-{{!}}Magic= *Magic *Dimensional Storage
    (He can fit his wand inside and pull out a whole stand out of his hatMagician Mickey (1937)) *Telekinesis
    (He could make his clothes wrap themselves up and fly like a bird. He controlled a bottle so that
    it would stop in midair and made it squirt water at Donald. He stopped Donald in midair and moved
    him aroundMagician Mickey (1937)) *Transmutation (He turned his clothes into a bird and cards into
