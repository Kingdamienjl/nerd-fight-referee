power_scale:
  tier:
    text: '{{2-B}}, higher with the χ-Blade | {{1-C}}'
    source_ids:
    - vsbattles-vanitas-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Complex Multiverse level (Fought Late-KHBbS Ventus and Mickey Mouse at the
      same time. Held his own against Terra, fought both Aqua and Mickey at the same
      time and knocked out the former during the final battle in the Keyblade Graveyard),
      higher with the χ-Blade (Even while incomplete, Aqua had to call on the power
      of her friends to overpower Ventus-Vanitas with it) | Complex Multiverse level
      (Comparable to KHIII Sora, Aqua, Ventus, and the other Guardians of Light)
    source_ids:
    - vsbattles-vanitas-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Infinite (Capable of keeping pace with Ventus and has shown the ability
      to fly beside him in the Lanes Between, comparable to others that can travel
      across the worlds with a Keyblade Glider, which has been shown to also relate
      to direct physical movements and is comparable to the Gummi Ship based on Aqua
      and Ventus getting to the Keyblade Graveyard within a day just like it while
      also including the threat of Gummi Heartless, comparable to Xemnas, who reacted
      to Roxas going from Radiant Garden to the Keyblade Graveyard in seconds, not
      far behind Sora, who reacted to a Keyblade beam from Xehanort of a similar nature
      as this one) | Infinite
    source_ids:
    - vsbattles-vanitas-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Complex Multiverse level (Able to take hits from Aqua and Ventus, even laughing
      them off after his first fight with Aqua) | Complex Multiverse level
    source_ids:
    - vsbattles-vanitas-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Very high (Capable of fighting Aqua long enough to drive her unconscious)
    source_ids:
    - vsbattles-vanitas-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range with the Keyblade. Planetary with magic via power-scaling
      from Sora. Low Multiversal with the Corridors of Darkness
    source_ids:
    - vsbattles-vanitas-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Vanitas is an exceedingly skilled Keyblade Wielder and Magic user, being
      able to fight Keyblade Master-level opponents like Aqua and Mickey on even ground.
      Like his other half, Ventus (Kingdom Hearts), he is exceedingly quick and aggressive
      in combat, assaulting foes with high-speed attacks and creating afterimages
      as he moves to confuse opponents and weaving in powerful magic like Blizzaga
      into his swordplay. He is also able to perform incredible acrobatics maneuvers
      to disorient foes such as riding waves of Keyblades and using them as battering
      rams. However, due to embodying all of Ventus's dark emotions, he displays a
      certain degree of pride and overconfidence, repeatedly underestimating Ventus's
      power which leads to Vanitas's ultimate defeat
    source_ids:
    - vsbattles-vanitas-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
