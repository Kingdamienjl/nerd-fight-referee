      2014; Theater Mode Scene 29, My Last Wish, who was comparable to the real deal
      out of the manner Jiminy''s Journal Datascape parallels the main universe),
      Multiverse level, eventually Complex Multiverse level with summons, Drive Forms
      and Trinity Limit (They rely on Drive Orbs, a power sourceKingdom Hearts II
      Final Miz; 2007; Theater Mode Scene 122, The Fairies'' Gift, which becomes upgraded
      as Sora practices with them, which when combined with Stitch and Peter Pan scaling
      to Lingering Will at around the end of KHII results into them being consistently
      on this level) | Complex Multiverse level (KH3D Sora starts off on the level
      of Drive Form KHII Sora,https://www.khinsider.com/news/More-KH3D-Details-From-Famitsu-Interview-1857
      Famitsu said that Sora''s actions in the trailer looked a bit like the actions
      during his Kingdom Hearts 2 form changes. Nomura agreed. And there''s a reason:
      they want players to be able to experience dynamic form change-like actions
      even as normal actions here. comparable to Riku, who could fight Young Xehanort)
      | Complex Multiverse level (Sora became even stronger, could overpower a complete
      Χ-Blade-wielding Xehanort alongside Donald and Goofy, could wield the Χ-Blade
      to cancel outKingdom Hearts III + Re𝄌Mind; 2019; Theater Mode Scene 239, Checkmate
      its cosmological erasure at a 6-D scale with the help of others), higher with
      Formchanges (Formchanges are considered as a more advanced and superior technique
      compared to Drive Forms https://archive.is/qZefV "The concept of transforming
      Keyblades was conceived during development on Kingdom Hearts II Final Mix,"
      Nomura explained. "The Lingering Sentiment battle [between Sora and the abandoned
      Armor of Terra, a hero from Birth by Sleep] featured transforming armor, and
      the Keyblade itself transforms, and I wanted to recreate that and be able to
      incorporate that mechanic into Kingdom Hearts III''s gameplay. As you train
      and become a more masterful Keyblade wielder, your style of fighting develops
      and you are able to transform your Keyblade." )'
