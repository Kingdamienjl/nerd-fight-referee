power_scale:
  tier:
    text: '{{2-B}}, higher with Forms | {{1-C}}'
    source_ids:
    - vsbattles-xion-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Multiverse level (Fought with Roxas, Xion inherited her powers from KHI
      Sora and so should be on his level), higher with Forms (Xion's powers multiplied
      with the usage of each form, and so ranges from at least x1 (First Form), x2
      (Second Form), x3 (Third Form) and up to x4 (Final Form) times above KHI Sora
      with them). Can ignore conventional durability with Nil | Complex Multiverse
      level (Is comparable to other Warriors of Light such as KHIII Sora). Can ignore
      conventional durability with Nil
    source_ids:
    - vsbattles-xion-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Infinite (Kept up with Roxas, one of the fastest characters in the series,
      comparable to others that can travel across the worlds with a Keyblade Glider,
      which has been shown to also relate to direct physical movements and is comparable
      to the Gummi Ship based on Aqua and Ventus getting to the Keyblade Graveyard
      within a day just like it while also including the threat of Gummi Heartless,
      comparable to Xemnas, who reacted to Roxas going from Radiant Garden to the
      Keyblade Graveyard in seconds, not far behind Sora, who reacted to a Keyblade
      beam from Xehanort of a similar nature as this one)
    source_ids:
    - vsbattles-xion-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
