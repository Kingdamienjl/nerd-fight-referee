- id: claim-weaknesses-c5e9ada3
  section: weaknesses
  axis: weakness
  text: 'Most of his abilities are geared towards supporting his allies rather than
    direct fighting. Is somewhat of a pacifist and prefers the peaceful solution to
    a problem rather than engaging in combat. Does not have much to go by other than
    physical combat via his shield since his magic is much more limited in usability
    than other characters. One of his limit attacks requires Sora to be with him to
    use in battle Notable Attacks/Techniques: *Rocket: Goofy leaps at an airborne
    enemy and attacks with his shield. *Charge: Goofy charges his attack and unleashes
    it by bashing his shield at the target. *Tornado: Uses a spinning attack that
    inflicts multiple hits at the enemy. *Goofy Bash: Throws his shield as a projectile
    that hits a target from afar. *Goofy Turbo: Goofy rides on his shield and proceeds
    to slide across the field while dealing damage to enemies. *MP Gift: Transfers
    his mana to another person or teammate. *Evolution: In exchange for sacrificing
    all his mana, Goofy can restore all of the health of the team back up. *Tornado
    Fusion: One of Goofy''s limit attacks, where he and Sora attack enemies by spinning
    rapidly. *Teamwork: Another of Goofy''s limit attacks. He and Sora first start
    by throwing their weapons at the enemies, then the attack ends with Sora shooting
    him like a rocket. In 358/2 days, Goofy is shown being able to propel himself
    without Sora''s aid. Here he shoots at short distances around the field, dealing
    heavy damage to enemies that get in his way. ==Gallery== {{Scroll box|content=
    Goofy TR KHII.png|Timeless River Goofy SP KHII.png|Space Paranoids Goofy PL KHII.png|Pride
    Lands Goofy HT KHII.png|Halloween Town Goofy CT KHIIFM.png|Christmas Town Goofy
    AT KHII.png|Atlantica Goofy CotM KH3D.png|Country of the Musketeers GoofyTS.png|Toy
    Box GoofyMI.png|Monstropolis GoofyPC.png|The Caribbean }} ==Notable Matchups==
    Victories: Losses: Inconclusive: {{Discussions|Goofy Kingdom Hearts|Goofy (Kingdom
    Hearts)}} Category:Characters Category:Kingdom Hearts Category:Damage Boost Users
    Category:Damage Reduction Users Category:Dogs Category:Existence Erasure Users
    Category:Flight Users Category:Forcefield Users Category:Game Characters Category:Good
    Characters Category:Healers Category:Heroes Category:Ice Users Category:Inorganic
    Beings Category:Knights Category:Male Characters Category:Non-Physical Interaction
    Users Category:Playable Characters Category:Power Nullification Users Category:Protagonists
    Category:Regeneration Users Category:Science Fantasy Characters Category:Shield
    Users Category:Small Sized Characters Category:Statistics Amplification Users
    Category:Status Effect Users Category:Summoners Category:Telekinesis Users Category:Underwater
    Breathing Users Category:Vehicle Users Category:Weapon Masters Category:Book Users
