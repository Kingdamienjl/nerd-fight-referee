- id: claim-powers-and-abilities-3dc52031
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Vehicular Mastery (Capable of using the
    Gummi Ship), Underwater Breathing, Damage Boost (Can restore his own Magic by
    taking damage, Via the Nobody Guard which has the Nobody Buster ability that allows
    its user to deal 30% more damage against Nobodies), Regeneration (Low-Mid), Magic,
    Telekinesis (Can automatically collect prizes and items via Treasure Magnet),
    Resurrection (Can resurrect allies), Ice Manipulation (His D-Link (His power summoned
    by someone else) has the Freeze Raid technique which uses ice and can potentially
    freeze enemies), Damage Reduction (Via Damage Control which halves the damage
    he takes if he's at low health, Via the Majestic Mushroom shield and the Ultimate
    Mushroom shield which have the Protect and Protectga abilities that reduce the
    damage their user takes, His D-Link has the Protect ability which reduces damage
    from physical attacks by 50%), Status Effect Inducement (His D-Link has the Stun
    Boost ability which increases the chance of stunning opponents with attacks, His
    D-Link has the Confusion Strike technique which has a chance of confusing enemies),
    Is able to hold on in a fight after taking massive damage or being comboed via
    Second Chance and Once More, Expert Shield Wielder, Healing (Can transfer his
    mana to another person via MP Gift or sacrifice it to restore all of the team
    members' health via Evolution), Statistics Amplification (Via various Shields,
    Accessories and Armors, Berserk increases Goofy's attack power if he's at low
    health, Defender increases Goofy's durability if he's at low health), Flight (Via
    Superglide), Summoning (Can summon his main weapon), Immortality Negation (Type
    5; Can destroy the skeletal forms of the pirates despite them being neither alive
    nor dead), Non-Physical Interaction (Can harm Nobodies and Heartless), Small Size
    (Type 1) in Atlantica and Pride Lands forms, Inorganic Physiology in Space Paranoids
    form | All previous, Small Size (Type 1) and Inorganic Physiology (Type 1) in
    Toy Box form), Explosion Manipulation (Via Goofy Bombardier), Forcefield Creation
    (Via Trinity Guard) |-|Resistances= Light Manipulation (By being affiliated with
    the element of light, he naturally resists it), Electricity Manipulation (Via
    the Star Shield+ which has the Electric Protection ability), Disease Manipulation
    (Via the Clockwork Shield+ which has the Sneeze Protection ability that allows
    it's user to resist the Sneeze status effect), Weather Manipulation (Via the Storm
    Anchor+ shield which has the Cloud Protection ability which allows it's user to
    resist the Cloud status effect), Stunning Inducement (Via the Save the King+ shield
    which has the Stun Protection ability), Freezing Inducement (Via the Aegis Shield+
    which has the Freeze Protection ability), Burning Inducement (Via the Knight's
    Shield+ which has the Burn Protection ability), Existence Erasure (Can take hits
    from Heartless), Absorption, Death Manipulation (Unaffected by Heartless, which
    passively kill and absorb things around them), Data Manipulation (Ansem The Wise
    stated that the "heart" cannot be contained by data, and that the process itself
    would be incalculable), Possession (Unaffected by the Marionettes who possess
    toys, despite himself being a toy at that time), Sealing (Can break out of Zexion's
    attempt to seal him inside of a book), Time Stop (Can move inside of the Realm
    of Darkness), Darkness Manipulation, Corruption, Madness Manipulation (Type 3),
    Mind Manipulation, Memory Manipulation, Soul Manipulation, Willpower Manipulation
    (The Realm of Darkness has been stated to eradicate existence itself within it,
    and anyone who's traveled there have never returned. Ansem the Wise by being in
    the Realm of Darkness was losing his sense of self and memories, having to give
    into his hatred to survive. Aqua not long after being in the Realm of Darkness
    lost the will to continue, and needed to stay true to her friends to fight it)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
