  attack_potency:
    text: Multiverse level (Is rather equal to his peers, Aqua and Ventus (Kingdom
      Hearts)) | Complex Multiverse level (Significantly stronger than before, could
      fight Xehanort, is noted in KHIIFM as being far more powerful than any foe KHII
      Sora has ever faced before including Sephiroth and Xemnas, could put up a fight
      against Terra-Xehanort in KHIII even while being supported by the Dark Guardian
      and a fragment of Xehanort's heart from the present, who could also defeat Re
      Mind KHIII Sora)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Infinite (Capable of keeping pace with Xehanort and Vanitas despite his
      focus on physical strength rather than speed, capable of traveling between worlds
      [Which each reside in different solar systems] in short periods of time, comparable
      to others that can travel across the worlds with a Keyblade Glider, which has
      been shown to also relate to direct physical movements and is comparable to
      the Gummi Ship based on Aqua and Ventus getting to the Keyblade Graveyard within
      a day just like it while also including the threat of Gummi Heartless, comparable
      to Xemnas, who reacted to Roxas going from Radiant Garden to the Keyblade Graveyard
      in seconds, not far behind Sora, who reacted to a Keyblade beam from Xehanort
      of a similar nature as this one) | Infinite (Significantly faster than Terra,
      was easily keeping up with KHII Sora, who at some point in KHII fought Roxas,
      the second most powerful member of Organization XIII as well as one of the fastest
      characters in the entire series)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class M (One of the physically strongest characters in the series)
      | At least Class M
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Multiverse level (The physical superior of Eraqus's apprentices, able to
      trade blows with Vanitas and Xehanort) | Complex Multiverse level (Easily traded
      blows with a KHII End-game Sora)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multiverse level | Complex Multiverse level (Able to easily take hits from
      a KHII end-game Sora)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Very high. Limitless as Lingering Will (Given how he, in this state, is
      simply possessing his Keyblade Armor)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range with regular attacks. Planetary with magic
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Terra is a Keyblade Master-level combatant on par with his friends Ventus
      (Kingdom Hearts) and Aqua. Favoring slow, powerful attacks over Ventus's swift
      barrages and Aqua's magic, he crushes foes with the largest repertoire of attacks
      in the game, including the powerful Ars Solum and Zantetsuken attacks. While
      not as proficient as Aqua, Terra also has access to powerful and wide-reaching
      magic such as Quake and Meteor. In addition, much like Riku, his connection
      to the Darkness has given him access to dark-based attacks that his peers do
      not, such as Dark Haze and Chaos Blade. However, this boon also proves to be
      a weakness, as it renders Terra's heart vulnerable to possession. In addition,
      he has proven to be easy to manipulate as a result of his overly trusting nature
      and his fear of losing, becoming a pawn in Xehanort's game and eventually losing
      his body in the process. After becoming Lingering Will, Terra has become even
      more skilled, furiously attacking opponents with much faster and more precise
      combos and showcasing powerful energy and magical attacks alongside his new
      physical prowess
    source_ids: *id002
    confidence: 0.95
