  range:
    text: Extended Melee Range; Tens of Meters with melee attacks and with Keyblade
      telepathy; Planetary with magic via power-scaling
    source_ids:
    - vsbattles-ventus-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Like Sora, Ventus is naive, cheerful, and overly-friendly at times. As a
      result, he is somewhat easy to manipulate by those willing to prey on his sheer
      kindness. However, his kindness belies his prodigious use of the Keyblade, with
      Eraqus noting that his age is his sole barrier to being declared a Keyblade
      Master. Wielding his Keyblade in a unique reverse-grip, Ventus compensates for
      his relatively weak physical and magical prowess by unleashing aggressive flurries
      of swift strikes and conducting various acrobatic maneuvers to throw foes off
      guard. True to his name, he specializes in the use of wind and light, with the
      latter being a direct result of his purity of heart, controlling the battlefield
      with wide-reaching tornadoes and decimating foes with powerful blasts of light.
      However, for all his skill, he remains inexperienced, as a result, more experienced
      fighters can read his moves and catch him off guard, as Xehanort did during
      their battle at the Keyblade Graveyard
    source_ids:
    - vsbattles-ventus-game-kingdom-hearts
    confidence: 0.6
    notes: auto_repair source extraction
