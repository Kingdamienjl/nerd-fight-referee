- id: claim-powers-and-abilities-edbb3ad0
  section: abilities
  axis: hax
  text: Nobody Physiology, Summoning (Can summon her main weapon. Can summon hordes Nobodies of and Heartless.
    The Nobodies specifically commanded by her hold standard Nobody Physiology plus Afterimage Creation,
    Weapon Mastery, Electricity Manipulation, Limited Flight, Duplication and Stealth Mastery. Her Heartless
    have access to standard Heartless Physiology), Self-Sustenance (Type 1. Can breathe in space), Electricity
    Manipulation, Magic, Flight, Teleportation, Duplication, Expert Knife Wielder, Expert-Hand-to-Hand
    Combatant, Power Nullification (Can break cards with the card break system by using cards with equal
    or higher values, which includes attacks and Resistances), Portal Creation, Ice Manipulation (Used
    her electric powers to create a labyrinth of ice to trap Sora, Donald, and Goofy in Arendelle), Time
    Stop (Created a dome of darkness that caused everything outside of it to stop time in all of Arendelle),
    Immortality Negation (Type 5, Can destroy the skeletal forms of the pirates despite them being neither
    alive nor dead) |-|Resistances=Cosmic Radiations, Darkness Manipulation, Corruption (Her Black Coat
    protects her from the corrupting influence of the darkness lanes between and the Realm of Darkness),
    Time Stop (Can move inside of the Realm of Darkness), Information Manipulation (Should scale to her
    fellow Nobodies who were unaffected by Namine's powers), Power Nullification (Can keep up with the
    Power Nullification of others in Castle Oblivion with her cards), Madness Manipulation (Type 3), Mind
    Manipulation, Memory Manipulation, Soul Manipulation, Empathic Manipulation (The Realm of Darkness
    has been stated to eradicate existence itself within it, and anyone who's traveled there have never
    returned. Ansem the Wise by being in the Realm of Darkness was losing his sense of self and memories,
    having to give into his hatred to survive. Aqua not long after being in the Realm of Darkness lost
    the will to continue, and needed to stay true to her friends to fight it), Electricity Manipulation,
    Ice Manipulation (Unaffected by her own power), Possible Resistance to Void Manipulation, Attack Nullification,
    Power Nullification, Perception Manipulation, Attack Reflection (Via Nothing to Fear), Spatial Manipulation,
    Gravity Manipulation (Via Space in Its Place), Wind Manipulation, Paralysis Inducement (Via Flagging
    Winds), Ice Manipulation (Via Ice Breaker), Earth Manipulation (Via Down to Earth), Mind Manipulation/
    Illusion Creation, Pocket Reality Manipulation, Sealing, BFR, Power Mimicry, (Via Lose Your Illusion),
    Power Nullification (Via Sighing of the Moon), Fire Manipulation (Via Tears of Flame), Water Manipulation,
    Life Manipulation (Via Parting of Waters), Time Manipulation, Transmutation (Via Test of Time), Blindness,
    Death Manipulation, Curse Manipulation (Via Flowers Athirst), Light Manipulation (Via Dying of the
    Light), and Resistances to all of the above via Master's Circle
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
