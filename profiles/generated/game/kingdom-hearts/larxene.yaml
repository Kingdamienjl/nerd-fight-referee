- id: claim-weaknesses-dddd521d
  section: weaknesses
  axis: weakness
  text: 'Larxene is somewhat arrogant and is a complete sadist, Her duplicates can be nullified by tossing
    them into each other and the original to forcibly merge them back into one, temporarily negating Larxene''s
    ability to create more duplicates and leaving her weakened and vulnerable, Needs to be hard-pressed
    to use her Limit Break Notable Attacks/Techniques: *Blitz: Larxene generates four duplicates before
    they all teleport around the opponent in a star formation, rushing the opponent from all sides with
    their knives. *Lightning Barrage: Larxene constantly rains powerful lightning bolts on her foes, in
    various patterns, such as in a ring around her to repel attackers or directly on top of her foes and
    climbing with them as they shoot their victim into the sky. *Lightning Cage: Larxene and four duplicates
    press the assault on her foes with a flurry of kicks and knife swipes before teleporting again, quickly
    reappearing while moving in a circle round her foe to trap them before descending on them with a number
    of lightning bolts. *Lightning Dive: Larxene and her duplicates teleport before descending on her
    opponents while charged with electricity. *Rush: Larxene creates two duplicates that speed towards
    the opponent to pierce them with their knives before jumping back and teleporting again in preparation
    for another attack. *Savage Carousel: After charging herself with lightning, Larxene levitates in
    the air before emitting long chains formed of spheres made from condensed lightning from her hands,
    rotating to attack fleeing opponents who try to dodge, dealing massive damage. *Voltic Rush: Her Limit
    Break, in which she savagely attacks her foes with a veritable downpour of melee attacks, teleporting
    after them to prevent their escape. **Final Voltic Rush: Her Final Limit, in which she charges herself
    with lightning before performing Voltic Rush, further increasing her speed and power. ==Gallery==
    253px-Foudre KHII.png|Foudre|link=http://www.khwiki.com/Foudre LarxeneBlitz.gif|Blitz Lightning Barrage.gif|Lightning
    Barrage Lightning Cage.gif|Lightning Cage Lightning Dive.gif|Lightning Dive Rush.gif|Rush Savage Carousel.gif|Savage
    Carousel Voltic Rush.gif|Voltic Rush ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions}}
    Category:Characters Category:Female Characters Category:Kingdom Hearts Category:Evil Characters Category:Sadists
