- id: claim-powers-and-abilities-f647770c
  section: abilities
  axis: hax
  text: Xigbar= Nobody Physiology, Energy Manipulation (In the form of Arrows), Spatial
    Manipulation (Constantly warps around the battlefield, defying gravity. Controls
    his "space" element which disables the opponents ability to jump), Teleportation,
    Gravity Manipulation, Flight, Summoning (Can summon his main weapon. Can summon
    hordes Nobodies of and Heartless. The Nobodies specifically commanded by him hold
    standard Nobody Physiology plus Expert Marksmanship, Energy Manipulation, Teleportation,
    Spatial Manipulation, Gravity Manipulation and Elasticity. His Heartless have
    access to standard Heartless Physiology), Non-Physical Interaction (Can harm Heartless
    and also Nobodies), Immortality Negation (Type 5, Can destroy the skeletal forms
    of the pirates despite them being neither alive nor dead), Darkness Manipulation,
    Master Marksman, Portal Creation, Danmaku, Reality Warping (Warped the arena into
    smaller square versions), Possession (Had been able to possess many people over
    many lifetimes, despite having been keybladeless during that time), Aura, and
    Nigh-Invulnerability (Can become invulnerable for short periods of time), Self-Sustenance
    (Type 1. Can breathe in space) |-|Resistances= Ice Manipulation, Cosmic Radiations,
    Darkness Manipulation, Corruption (Type 2) (His Black Coat protects him from the
    corrupting influence of the darkness of the lanes between and the Realm of Darkness),
    Time Stop (Can move inside of the Realm of Darkness), Information Manipulation
    (Should scale to his fellow Nobodies who were unaffected by Namine's powers),
    Madness Manipulation (Type 3), Mind Manipulation, Memory Manipulation, Soul Manipulation,
    Willpower Manipulation (The Realm of Darkness has been stated to eradicate existence
    itself within it, and anyone who's traveled there have never returned. Ansem the
    Wise by being in the Realm of Darkness was losing his sense of self and memories,
    having to give into his hatred to survive. Aqua not long after being in the Realm
    of Darkness lost the will to continue, and needed to stay true to her friends
    to fight it), Gravity Manipulation, Spatial Manipulation (Unaffected by his own
    power), Possible Resistances to Void Manipulation, Attack Nullification, Power
    Nullification, Perception Manipulation, Attack Reflection (Via Nothing to Fear),
    Wind Manipulation, Paralysis Inducement (Via Flagging Winds), Ice Manipulation
    (Via Ice Breaker), Earth Manipulation (Via Down to Earth), Mind Manipulation/
    Illusion Creation, Pocket Reality Manipulation, Sealing, BFR, Power Mimicry, (Via
    Lose Your Illusion), Power Nullification (Via Sighing of the Moon), Fire Manipulation
    (Via Tears of Flame), Water Manipulation, Life Manipulation (Via Parting of Waters),
    Time Manipulation, Transmutation (Via Test of Time), Blindness, Death Manipulation,
    Curse Manipulation (Via Flowers Athirst), Electricity Manipulation (Via Stolen
    Thunder), Light Manipulation (Via Dying of the Light), and Resistances to all
    of the above via Master's Circle |-|Luxu= All former abilities with the exception
    of Nobody Physiology, Superhuman Physical Characteristics, Standard Keyblade powers,
    Dimensional Travel, Magic, Fire Manipulation, Electricity Manipulation, Air Manipulation,
    Ice Manipulation, Healing (Via Curaga), Master Keyblade Wielder, Resistance to
    Absorption, Death Manipulation (Unaffected by Heartless, which passively kill
    and absorb things around them), Data Manipulation (Ansem The Wise stated that
    the "heart" cannot be contained by data, and that the process itself would be
    incalculable), Magic-based Time Stop (The Keyblade grants Resistance to Magic-based
    Time Stop)
