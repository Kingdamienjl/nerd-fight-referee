    - field: standard_equipment
      value: 'Various recovery items such as Potions, Ethers, and Elixirs *Keyblade:
        By channeling one''s strength of heart, the user can summon a Keyblade to
        use in battle. Through use of the Keyblade, the user is granted increased
        strength, speed, durability, and increased magical power. Aqua''s Keyblade
        is Rainfell, a Keyblade from the Realm of Light. It lacks in reach but offers
        a balanced boost to both physical attacks and magical attacks. It is later
        transformed into the Stormfell, offering greater reach and even greater boosts
        to her attacks. After losing it and her armor upon failing to save Terra from
        Xehanort''s influence, she begins wielding Eraqus''s Keyblade, the Master''s
        Defender, an even more potent Keyblade with excellent reach. *Keyblade Armor:
        Normally kept as a simple shoulder plate when not in use, Aqua can activate
        it at any time by placing her hand on it, covering her from head to toe in
        a futuristic suit of armor with silver, black, navy-blue, and dun highlights.
        This suit of armor protects Aqua from the Darkness and attacks that would
        directly target the Heart (soul) in addition to letting her survive the vacuum
        of space. She lost it to Terra-Xehanort while trying to save Terra''s heart,
        with it resting inside a hidden chamber in Castle Oblivion ever since.'
      source_id: vsbattles-aqua-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted (The first among her friends to be recognized as a Keyblade Master,
        Aqua is an extremely accomplished Keyblade wielder. Specializing in the use
        of magic, Aqua gracefully dances around the battlefield while pelting foes
        with a variety of powerful spells, being arguably the most skilled Keyblade
        Wielder in the series short of Master Xehanort in this regard. She fights
        with almost dance-like grace, gliding and cartwheeling around the battlefield,
        utilizing unique variations of the common magic spells and specializing in
        the use of water, ice, and light in particular)
      source_id: vsbattles-aqua-game-kingdom-hearts
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: *Command Styles: Command Styles
        are special forms that Aqua and her friends can use by repeatedly using specific
        types of attacks. Once activated, they provide a dramatic boost to their combat
        abilities and often imbue their attacks with elemental properties. **Spellweaver:
        Aqua uses the power of light to telekinetically control her Keyblade and increase
        her magical power and attack range. Her finisher has her assault foes with
        balls of light as she attacks with her Keyblade and finishing foes with a
        pirouette that releases arcs of magic. **Ghost Drive: Aqua''s channels the
        power of darkness to drastically increase her speed and allow her to blitz
        opponents with swift rushing attacks and bursts of teleportation. *Shotlocks:
        Shotlocks are powerful abilities that allow Aqua to lock on to multiple targets
        or focus on a single target before unleashing a powerful barrage of attacks
        on all of them, dealing massive damage in the process. **Bubble Blaster: Aqua
        unleashes a torrent of bubbles from the tip of her Keyblade, dealing explosive
        water damage to all foes caught by them. **Prism Rain: Aqua fires several
        salvos of colorful homing projectiles that converge on the target to deal
        heavy magic damage. **Lightbloom: Aqua''s most powerful Shotlock, she spins
        around while firing homing blasts of light in all directions, dealing massive
        damage to all foes caught by this attack. Finishers and Exclusive Attacks
        *Barrier: Unlike her friends, Aqua generates an omnidirectional barrier to
        block incoming attacks instead of blocking them with her Keyblade, leaving
        no blind spots. **Barrier Surge: Aqua rushes forward while casting Barrier,
        deflecting incoming attacks and knocking aside foes in the process. *Glacier:
        One of Aqua''s strongest attacks, she flash freezes all nearby enemies before
        sending them skyward with an icy gust of wind. *Magic Hour: Her single strongest
        attack, she teleports all around the field, diving onto foes and leaving behind
        devastating pillars of light that deal massive damage on contact. *Raging
        Storm: Aqua''s exclusive variation of Firaga, she generates three pillars
        of flame that rotate around her and deal damage to anyone who dares to approach
        her. *Thundaga Shot: Fires a Thundaga spell concentrated into a fast-moving
        projectile. Magic *Bind: Locks the target in place, preventing them from moving
        from their current position. *Blackout: Aqua completely blinds her foes to
        make it extremely difficult for them to land physical attacks or properly
        aim. *Blizzaga: Aqua creates a sizable, spiked chunk of ice that deals heavy
        ice-elemental damage. *Mini: Aqua shrinks her foes to the size of an ant,
        proportionally lowering their speed, strength, and durability. In addition,
        their small size allows them to be crushed simply by stepping on them. *Stopga:
        Aqua instantly freezes time around her foes, leaving them helpless. *Transcendence:
        Creates an inescapable anti-gravity field that allows Aqua to toss her foe
        around at her leisure. ==Gallery== {{Scroll box|content= ===Keyblades=== Rainfell
