        to special abilities, like turning the Keyblade into a bike or whip. Terra
        is a complete master of the Keyblade, evident by the fact that he can morph
        his Keyblade into several different forms, including a whip, a bike, a bow,
        and a laser cannon among all other forms. Terra''s personal Keyblade is the
        Earthshaker, which is later upgraded into the more powerful Ends of the Earth.
        It has an average reach and offers an emphasis on physical attacks over magic
        and serves as the basis for almost all of his attacks. *Keyblade Armor: Normally
        kept as a simple shoulder plate when not in use, Terra can activate it at
        any time by placing his hand on it, covering him from head to toe in a futuristic
        suit of armor with bronze, black, and gold highlights. This suit of armor
        protects Terra from the Darkness and attacks that would directly target the
        Heart (soul) in addition to letting him survive the vacuum of space. However,
        since Terra already had darkness in his heart, it failed to save him from
        Xehanort''s attempt to possess him. Instead, his mind reanimated his Keyblade
        Armor and took up his Keyblade, becoming Lingering Will and beating Xehanort
        senseless to the point that the latter had trouble remembering his identity
        for several years.'
