power_scale:
  tier:
    text: '{{2-B}} | {{2-B}} | {{1-C}}'
    source_ids: &id002
    - mediawiki-10127
    confidence: 0.95
  attack_potency:
    text: Multiverse level (Undamaged by KHI Sora, Donald, Goofy and Beast, able to
      fight an endgame KHII Sora who had fought many powerful enemies including Sephiroth.
      Is the leader of and confirmed by Word of God to be the most powerful member
      of Organization Xlll, making him above Roxas at his full potential and the likes
      of Xaldin and Lexaeus who are both tied as the third strongest), can ignore
      durability with Nil | Multiverse level (Matched the full power of Sora and Riku;
      he is stronger than his base form and he would have killed Sora if not for Riku's
      interference), can ignore durability with Nil, Time, and Water | Complex Multiverse
      level (Comparable to if not slightly stronger than Sora and the other Guardians
      of Light), can ignore durability with Nil
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Infinite (Comparable to others that can travel across the worlds with a
      Keyblade Glider, which has been shown to also relate to direct physical movements
      and is comparable to the Gummi Ship based on Aqua and Ventus getting to the
      Keyblade Graveyard within a day just like it while also including the threat
      of Gummi Heartless, reacted to Roxas going from Radiant Garden to the Keyblade
      Graveyard in seconds, not far behind Sora, who reacted to a Keyblade beam from
      Xehanort of a similar nature as this one) | Infinite (Faster than his base form,
      spent the better part of his fight with Sora and Riku actively trying to blitz
      them by himself, and almost succeeding, his movements are a blur to Sora, likely
      copying the movements of Larxene who did the same)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class M, likely higher (Has Terra's body and is able to effortlessly
      throw Sora and Riku in the air. Easily manhandled and restrained King Mickey
      with one hand), should reach Class Y with telekinesis.
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Multiverse level (Has Terra’s body, able to trade blows with Sora on multiple
      occasions) | Multiverse level (Much stronger than his base form, able to knock
      Riku or Sora back with just one swing of his blades) | Complex Multiverse level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multiverse level (Tanked numerous attacks from Sora) | Multiverse level
      (Much stronger than his base form, tanked several attacks from Sora and Riku
      and was only defeated in the end after a series of long battles) | Complex Multiverse
      level
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Created entire environments for Sora to fight in, summoned scores
      of Nobodies, and even fought Sora himself several times, and still showed no
      signs of fatigue by the time you get to him in the Realm Between; in Dream Drop
      Distance he manages to fight Sora to the point the latter is exhausted and later
      appears to be none the worse for wear)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range with Interdiction, Tens of Meters with thorns and etherial
      blade projectiles, Planetary with telekinesis and magic, Low Multiversal with
      the Corridors of Darkness
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Xemnas, being an incarnation of Xehanort himself, is one of the craftiest
      and most devious characters in all of Kingdom Hearts, creating and manipulating
      Organization XIII for his own ends, fooling his fellow Nobodies into believing
      that they had no hearts when they could in fact cultivate a heart through relationships
      and personal attachments, a fact he only revealed after being revived to face
      Sora once more. He also possesses enough knowledge to see through Marluxia's
      plans of rebellion and sends Axel to dispatch of the traitors and has Sora defeat
      the ones that Axel could not. As the Superior of the In-Between, he is able
      to fight on par with Keyblade Master-level opponents like Sora and would have
      in fact defeated him if not for Riku's intervention. He assaults foes with devastating
      flurries of blade swings and kicks, deflects attacks and trapping foes with
      barriers, and wields the powers of every other member of Organization XIII with
      ease. He is still able to fight on par with Sora with the powers the latter
      gained during the events of Dream Drop Distance, tiring the hero into exhaustion
      so that Xehanort could kidnap him.
    source_ids: *id002
    confidence: 0.95
