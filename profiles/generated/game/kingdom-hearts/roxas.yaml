  text: KHDays= Nobody Physiology, Standard Keyblade powers, Summoning (Can summon
    hordes of Nobodies. The Nobodies specifically commanded by him hold standard Nobody
    Physiology plus Weapon Mastery and Elasticity), Damage Boost (Via various Keychains
    and the Critical Sun ring which have the Critical Boost ability that increases
    the user's chances of landing critical hits, Via the Omega Gear, the Mystery Gear
    and the Crimson Blood ring which have the Grand Slam ability that increases the
    user's chances of landing critical hits if they're at low health, Via various
    Keychains and the Soldier Ring which has the Combo Boost ability which allows
    the user to deal greater damage with increasingly longer attack combos), Flight
    (Capable of slowing his descent via float, Can glide through the air, Levitates
    while using Magic Hour), Self-Sustenance (Type 1. Can breathe in space), Resurrection
    (Can resurrect himself via Auto-Life), Energy Manipulation, Durability Negation
    (Via Nil Element), Ice Manipulation, Electricity Manipulation, Fire Manipulation,
    Air Manipulation, Light Manipulation), Paralysis Inducement (Can potentially immobilize
    foes via Aero spells and his finishing moves are capable of doing this as well
    via Aero Finish, Has a 15% chance of inflicting this via guarding through Aero
    Guard), Magic, Enhanced Senses (Has a "map" in his head (While it could normally
    be dismissed as a game mechanic, the status effect in 358/2 Days that prevents
    access to it justifies it being an actual ability), said map also displays the
    locations of enemies and allies), Healing (Via Cure spells and various items,
    Via the Lucky Ring which has the Heart Bonus ability that fully restores his health
    every time he collects 300 "hearts"), Statistics Amplification (Via various Keychains,
