  axis: battle_iq
  text: Roxas, despite his relatively brief existence, has amassed the combat skills
    of both Sora and Ventus, dual-wielding Keyblades to great effect even against
    Keyblade Master-level opponents. He is more brutal and aggressive than Sora, forgoing
    any form of defense outside of Light Shields in favor of pure offense, attacking
    with fast and powerful series of wild swings that seek to crush the target without
    resistance. He has managed to outmatch several of the most powerful characters
    in the series in Keyblade combat, disarming Sora, forcing Riku to release his
    blindfold and use the powers of Ansem, and outright defeating Saix, Axel, and
    Xion, the latter of whom had most of his power at the time. He is also incredibly
    skilled with both light and darkness magic, unleashing torrents of both with each
    swing of his Keyblades and firing out swift light arrays to block and attacks
    and to corner foes he can't defeat with brute force alone. However, his aggression
    and treatment as a non-individual by non-Nobodies has left him bitter and careless
    at times, leading to his defeat when he allowed Riku to remove his blindfold and
    gave Sora the opportunity to retrieve his Keyblade when he misunderstood its "summon-to-hand"
    mechanic while it was pinned
  source_ids: *id003
