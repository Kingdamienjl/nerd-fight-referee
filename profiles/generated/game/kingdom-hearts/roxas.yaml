- id: claim-weaknesses-401c0696
  section: weaknesses
  axis: weakness
  text: 'Roxas is sometimes aggressive to the point of being careless and rarely uses
    defensive spells or abilities outside of his Light Shields while dual-wielding,
    He must be hard-pressed to use his Limit Breaks Notable Attacks/Techniques: ===Attacks===
    * Dual Arcanum: Roxas swings his Keyblades wildly in left-and-right sweeping combos,
    and then dashes straight ahead with a powerful dual-outward strike after a delay,
    striking foes who attempt to dodge to the side with waves of light and darkness.
    He can also combine this with his Spot Beams for even more damage. * Dual Slash:
    Assumes an offensive stance by twirling and drawing back his Keyblades and swings
    them simultaneously in a wide arc, unleashing a whirlwind of light and darkness
    in the immediate area. * Dual Judgment: Roxas throws his Keyblades like buzzsaws
    up to five times before unleashing a wave of dark power that can drag the target
    in towards his attacks. * Event Horizon: Roxas'' Limit Break, he charges his Keyblade(s)
    with light and rushes at the opponent, dealing a massive combo that staggers the
    opponent and deals heavy damage while simultaneously attacking with his light
    arrays. * Hurricane Blast: Spins vertically forward in midair and falls forward
    onto his opponent''s location. * Light Shields: Roxas arranges his shields of
    light to form a laser array that he fires in all directions or spirals outward
    from his position to block attacks and knock back enemies. * Magic Hour: Roxas''
    other Limit Break, in which he levitates in the air before raining devastating
    beams or homing orbs of light from the sky, dealing massive damage to those unfortunate
    enough to be caught in it. He can also defend himself with his light shields while
    using this attack, rendering it incredibly difficult to harm him while he uses
    it. * Spot Beam: Roxas sends out his thirteen light shields in waves to attack
    the opponent, repelling attacks and damaging foes simultaneously while he continues
    to attack with his Keyblades. When he gets fully serious, he launches these with
    every movement. ===Magic=== * Aero: Roxas shoots out a swift gust of wind with
    slight homing properties. * Aerora: Roxas shoots out a larger gust of wind that
    slowly follows the target along the ground. * Aeroga: Roxas drags in all nearby
    foes with a powerful whirlwind. * Blizzard: Roxas launches a small ice crystal
    that pursues foes, passing through them multiple times to deal greater damage.
    * Blizzara: Roxas creates a larger ice crystal that floats in mid-air, detonating
    upon contact with an enemy or after a brief delay. * Blizzaga: Roxas creates a
    large ice mine that triggers a large explosion of ice and snow should an enemy
    approach it. * Curaga: Roxas quickly heals his wounds, restores his own stamina,
    and treats any allies in his vicinity * Fire: Roxas shoots out a small fireball
    that slowly homes in on its target. * Fira: Roxas shoots out a fireball that moves
    in a straight line at high speed while smashing through defenses and barriers.
    * Firaga: Roxas launches a large fireball that homes in on its target in an arc
    before detonating on impact or upon contact with any surface. * Thunder: Roxas
    calls down a string of lightning bolts in a straight line. * Thundara: Roxas brings
    down a lightning across a sizable area. * Thundaga: Roxas calls down a single,
    much larger lightning bolt after a brief delay. ===Support'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
