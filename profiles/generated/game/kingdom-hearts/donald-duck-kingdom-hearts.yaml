- id: claim-weaknesses-a6a06775
  section: weaknesses
  axis: weakness
  text: 'Is less capable of taking damage compared to Sora and Goofy and often gets knocked out a lot
    in battle. Is more focused on the use of magic in battle than physical fighting. Using Zettaflare
    depletes Donald of all of his energy, causing him to pass out. Notable Attacks/Techniques: *Donald
    Fire: Unleashes a firestorm at a target. *Donald Blizzard: Shoots a barrage of ice that can potentially
    hit multiple enemies. *Donald Thunder: Casts thunder from the sky. Very useful to hit multiple enemies
    from a distance. *Donald Cure: Healing spell. Restores most if not all of Donald''s health back. It
    also uses this to heal or revive his teammates. *Aeroga: Creates a wind barrier that halves any damage
    taken while active. Can also inflict damage to any enemies that get near the user. *Graviga: Donald
    creates a miniature event-horizon that crushes the target via gravity and can potentially render them
    temporarily defenseless. *Stopga: Stops time around the target for several seconds. Can also catch
    multiple targets if they are near the one that was cast on. *Fantasia: One of Donald''s limit attacks.
    He unleashes a barrage of fireworks to attack his enemies with. Useful when dealing with large groups
    of them. *Flare Force: Another one of Donald''s limit attacks. Donald unleashes a barrage of rockets
    at the targets (much like with Fantasia). *Zettaflare: Donald''s strongest attack in which unleashes
    a gigantic burst of fire at the opponent. Donald is incapacitated when this attack is used and is
    thus a desperation attack. ==Gallery== {{Scroll box|content= Donald Duck TR KHII.png|Timeless River
    Donald Duck SP KHII.png|Space Paranoids Donald Duck PL KHII.png|Pride Lands Donald Duck HT KHII.png|Halloween
    Town Donald Duck CT KHIIFM.png|Christmas Town Donald Duck AT KHII.png|Atlantica Donald Duck CotM KH3D.png|Country
    of the Musketeers DonaldTS.png|Toy Box DonaldPC.png|The Caribbean DonaldMI.png|Monstropolis }} ==Notable
    Matchups== Victories: Losses: Inconclusive: {{discussions|Donald Duck Kingdom Hearts|Donald Duck (Kingdom
    Hearts)}} Category:Characters Category:Kingdom Hearts Category:Birds Category:Comic Relief Characters
    Category:Damage Boost Users Category:Damage Reduction Users Category:Ducks Category:Electricity Users
    Category:Element Users Category:Existence Erasure Users Category:Explosion Users Category:Fire Users
    Category:Flight Users Category:Game Characters Category:Good Characters Category:Gravity Users Category:Ice
    Users Category:Inorganic Beings Category:Magic Users Category:Male Characters Category:Non-Physical
    Interaction Users Category:Playable Characters Category:Power Nullification Users Category:Protagonists
    Category:Science Fantasy Characters Category:Small Sized Characters Category:Statistics Amplification
    Users Category:Summoners Category:Time Users Category:Transformation Users Category:Underwater Breathing
    Users Category:Firework Users Category:Staff Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-825a945e
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Small Size (Type 0), Vehicular Mastery (Capable of using
    the Gummi Ship), Weapon Control, Summoning (Can summon his main weapon, Can summon meteors via Donald
    Meteor), Underwater Breathing, Magic, Telekinesis (Can automatically collect prizes and items via
    Treasure Magnet), Homing Attack (Via Flare Force), Elemental Manipulation, Fire Manipulation, Thunder
    Manipulation, Ice Manipulation, Wind Manipulation, Explosion Manipulation, Damage Reduction (Can halve
    the damage he takes with Aero, Via the Centurion+ staff which has the Damage Control ability that
    halves the damage the user takes if they're at low health, His D-Link (His power summoned by someone
    else) has the Shell ability which reduces damage from Magic attacks by 50%), Healing (Via Curaga),
    Statistics Amplification (Via various Staffs, Accessories and Armors, Berserk increases Donald's attack
    power if he's at low health, Via the Nobody Lance and the Shaman's Relic staff which have the Defender
    ability that can increase the user's durability if they are at low health), Gravity Manipulation,
    Damage Boost (Can restore his own Magic by taking damage, Via the Heartless Maul which has the Heartless
    Buster ability that allows its user to deal 30% more damage against Heartless, Via the Astrolabe+
    staff which has the Full MP Blast ability that increases the strength of Magic attacks by 50% if the
    user is at full Magic capacity), Time Stop (Via Stopga), Invulnerability (While healing himself (Via
    Leaf Bracer)), Resurrection (Can revive his allies in battle and restore their magic), Regeneration
    (Low-Mid), Is able to hold on in a fight after taking massive damage via Second Chance, Transformation
    (Transformed Sora, himself, and Goofy into aquatic creatures in Atlantica, and in other sorts of creatures
    to suit the World's order), Flight (Via Superglide, Donald can also float while performing certain
    spells), Creation (Can create fireworks), Non-Physical Interaction (Can harm Heartless and also Nobodies),
    Immortality Negation (Types 5 and 7; Can destroy the skeletal forms of the pirates despite them being
    neither alive nor dead), Inorganic Physiology in Space Paranoids form | All previous, Small Size (Type
    1) and Inorganic Physiology (Type 1) in Toy Box form |-|Resistances= Light Manipulation (By being
    affiliated with the element of light, he naturally resists it), Absorption, Death Manipulation (Unaffected
    by Heartless, which passively kill and absorb things around them), Data Manipulation (Ansem The Wise
    stated that the "heart" cannot be contained by data, and that the process itself would be incalculable),
    Sealing (Can break out of Zexion's attempt to seal him inside of a book), Time Stop (Can move inside
    of the Realm of Darkness), Possession (Unaffected by the Marionettes who possess toys, despite himself
    being a toy at that time), Existence Erasure (Can take hits from Heartless), Darkness Manipulation,
    Corruption, Madness Manipulation (Type 3), Mind Manipulation, Memory Manipulation, Soul Manipulation,
    Empathic Manipulation (The Realm of Darkness has been stated to eradicate existence itself within
    it, and anyone who's traveled there have never returned. Ansem the Wise by being in the Realm of Darkness
    was losing his sense of self and memories, having to give into his hatred to survive. Aqua not long
    after being in the Realm of Darkness lost the will to continue, and needed to stay true to her friends
    to fight it)
  source_ids: *id003
  decisive: true
  status: unverified
