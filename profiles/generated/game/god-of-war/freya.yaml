  attack_potency:
    text: Complex Multiverse level (Was the leader of the Vanir during the war against
      Asgard and Odin, with Mimir even stating her to be Odin's deadliest enemy. Was
      the true Queen of the Valkyries, and as such was superior to Sigrun, whom herself
      was far more powerful than any other Valkyrie. Valkyries can tear apart the
      fabric of an individual realm, cause their magic to ripple across its entirety,
      and make Yggdrasil bleedGod of War (2018) - Codex)
    source_ids:
