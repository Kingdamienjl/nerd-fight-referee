    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "Complex Multiverse level (His first fight with J\xF6rmungandr shook all\
      \ Nine RealmsGod of War (2018)- A Realm Beyond. Violently shook and then splintered\
      \ Yggdrasil in his second fight with the SerpentGod of War (2018), hurling the\
      \ latterGod of War: Ragnar\xF6k (2022)- The Realms At War back through time.\
      \ Fought against both J\xF6rmungandr and Surtr as Ragnar\xF6k, with the latter\
      \ destroying both Asgard and its World Tree branchGod of War: Ragnar\xF6k (2022)-\
      \ Groa's Secret in the process, which in turn shakes the entire tree to its\
      \ rootsGod of War: Ragnar\xF6k (2022)- Beyond Ragnarok. Fought on par with Ragnarok\
      \ Kratos numerous times and had his blows described as being as heavy as any\
      \ that the latter had feltGod of War: Ragnar\xF6k - Codex Entry (Thor) while\
      \ holding back, even managing to kill him, putting Thor above Hercules at the\
      \ least. Capable of staggering Kratos' use of Valor and preventing healing completely.God\
      \ of War: Ragnar\xF6k (2022) Stated byFrom Concept Art to Cosplay: Creating\
      \ iconic characters for God of War Ragnar\xF6k multiple sources to be the strongest\
      \ Norse godThe Art of God of War: Ragnar\xF6k- Page 91)"
