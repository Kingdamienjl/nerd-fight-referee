- id: claim-powers-and-abilities-042e5216
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Large Size (Type 0; Greek Kratos can barely reach his chest
    in height, with Greek Kratos being 2.34 meters tall. Officially, Hercules is stated to be 12 feet
    tall and 4000 lbs heavyGod of War III (2010)- Special Features: Voice Acting) *Soul Magic (Divine)
    *Master Combatant *Weapon Mastery *Air Manipulation, Shockwave Generation & Status Effect Inducement
    (Can create shockwaves with his sheer strength. His Nemean Cestuses on their own also can generate
    powerful shockwaves that stun foes, as seen when he used it to stun Kratos) |-|Resistances= *Disease
    Manipulation (Unaffected by the plagues released by Hermes'' death) *Poison Manipulation (Resists
    the attacks of the Chimera Soul Summon) *Petrification (Unaffected by the beams of the Gorgon Soul
    Summon, which can turn its victims to stone) *Blade of Olympus (Able to resist blows and attacks from
    the Blade of Olympus wielded by Kratos) *Everything Hades has (Completely unaffected by the Claws
    of Hades wielded by Kratos, who at this point has obtained Hades'' soul and in turn, all of his powers
    plus millions of other souls Hades has tormented over the years)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
