power_scale:
  tier:
    text: '{{1-C}} Name: Thor (Old Norse: Þórr) Origin: God of War Gender: Male Age:
      Over 200 years old, possibly thousands of years old (Thor was a fully-grown
      adult when Brok and Sindri forged Mjölnir for him 200 years prior to the events
      of God of War: Lore and Legends, with his sons having already been full-grown
      adults prior to this and being active in the Aesir-Vanir War) Classification:
      Half-Aesir, Half-Jotunn, God of Thunder and Lightning'
    source_ids:
    - vsbattles-thor-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Complex Multiverse level (His first fight with Jörmungandr shook all Nine
      RealmsGod of War (2018)- A Realm Beyond. Violently shook and then splintered
      Yggdrasil in his second fight with the SerpentGod of War (2018), hurling the
      latterGod of War: Ragnarök (2022)- The Realms At War back through time. Fought
      against both Jörmungandr and Surtr as Ragnarök, with the latter destroying both
      Asgard and its World Tree branchGod of War: Ragnarök (2022)- Groa''s Secret
      in the process, which in turn shakes the entire tree to its rootsGod of War:
      Ragnarök (2022)- Beyond Ragnarok. Fought on par with Ragnarok Kratos numerous
      times and had his blows described as being as heavy as any that the latter had
      feltGod of War: Ragnarök - Codex Entry (Thor) while holding back, even managing
      to kill him, putting Thor above Hercules at the least. Capable of staggering
      Kratos'' use of Valor and preventing healing completely.God of War: Ragnarök
      (2022) Stated byFrom Concept Art to Cosplay: Creating iconic characters for
      God of War Ragnarök multiple sources to be the strongest Norse godThe Art of
      God of War: Ragnarök- Page 91)'
    source_ids:
    - vsbattles-thor-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Immeasurable (His shockwaves encompassed the entirety of Yggdrasil, which
      is an infinite higher-dimensional structure, as well as the Nine Realms within
      it. Is also able to use said shockwaves in combat consistentlyGod of War: Ragnarök
      (2022)- Surviving Fimbulwinter and keep up with Kratos, who can react to, block
      and dodge his shockwaves)'
    source_ids:
    - vsbattles-thor-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
