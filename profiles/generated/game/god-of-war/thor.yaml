    text: Complex Multiverse level (Took hits from Jörmungandr and Surtr as Ragnarök.
      Managed to endure numerous blows from Kratos, as well as having his inner organs
      blown up by the Draupnir Spear several times in a row with no apparent damage)
    source_ids:
