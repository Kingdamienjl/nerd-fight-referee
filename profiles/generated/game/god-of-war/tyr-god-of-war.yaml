- id: claim-weaknesses-fe4ae272
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Blood for Blood, Dreyra!: A blood sacrifice spell learned
    from Tyr''s travels to the Mayan pantheon. Tyr cuts himself on his weapon and creates a ring of blood
    orbs that expands outwards to his targets. *Those Who Have Fallen, Carry Me!: A more advanced blood
    sacrifice spell, in which targets give their blood and life energy to Tyr, allowing him to heal at
    the cost of their vitality. *Darkness Come, Myrkyr!: An Egyptian curse of darkness. Tyr shrouds all
    of his surroundings in darkness save for a few small pockets of light. Even gods with enhanced sensory
    abilities are unable to see within its area of effect. *Um-Huxan!: A spell of presumably Eastern origin,
