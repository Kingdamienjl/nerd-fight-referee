        in the making of this profile. The Lunar Hook however, likely is literal in
        its tooltip despite its reference, since the original quote is changed from
        "You want the moon? Just say the word and I''ll throw a lasso around it and
        pull it down!" to, "You want the moon? Just grapple it and pull it down!".
        The developers had intentionally changed the dialogue to fit in with the game
        itself. Given the name of the hook, and the fact that it requires ultra-powerful
        fragments to create, this is likely meant to suggest that it has the capacity
        to literally pull down the Moon. ** Similarly, the S.D.M.G.''s tooltip was
        also considered, despite the tooltip being a reference. The name of the game
        it is referencing is named Edge of Space, and the tooltip states, "It came
        from the edge of space". The lack of capitalization and the purposeful addition
        of the item being said to come from there, suggests that it is both a reference,
