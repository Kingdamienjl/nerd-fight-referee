    - field: weaknesses
      value: 'Without the Blood Moon, Corruption only infects those who have any sins,
        or capacity for sin. Otherwise, fully pure beings will be rendered immune
        to it. The Blood Moon''s corrupting effect only works for as long as the Blood
        Moon lasts for. == Notes/Explanations == * Media used for this profile are:
        ** Terraria (2011 video game) *** Old-gen console version (2013) *** Old Chinese
        version (2018) *** New Chinese version (2021) ** Official Merchandise ** Terraria:
        The Animated Series (2014 web animation) ** DC: Terraria Issue #1 (2015 comic)
        ** Terraria LORE (2019 web novel) ** Terraria (2022 graphic novel) *** Issue
        1 (2022) *** Issue 2 (2022) *** Issue 3 (2022) *** Issue 4 (2022) *** Issue
        5 (2023) *** Issue 6 (2024) *** Issue 7 (2024) ** Terraria: The Board Game
        (2025 board game) * It should be noted that "Terraria", in the context of
        this statement, is likely referring to the universe (saying it''s referring
        to the planet isn''t a phrase that is very commonly used as opposed to the
        "fabric of reality", and using "Terraria" to refer to the universe is commonly
        seen in the pages). As a bonus, the Terraria wiki also subscribes to this
        interpretation, with the text saying the same thing on the .gg official wiki
        that is promoted on the official website to the game, and is promoted by Redigit
        himself. It also logically makes the most sense, given the Dryads had only
        waged war against Cthulhu when he was threatening reality itself, when hope
        seemed lost. It begs to question, "why would the Dryads, the beings consistently
        referred to being one with nature, only show up to stop Moon Lord when he
        was nearing his goal if his only intent was to threaten the planet specifically?"
        In addition, the fight the Dryads had with Moon Lord is referred to as "the
        Great Celestial War", confirming that it is a war the Dryads had waged against
        Moon Lord after he threatened reality. In addition, the lore is said to only
        exist to aid the protagonist in defeating Moon Lord and saving the world,
        and the lore then continues explaining the universe, aspects that are not
        utilized by the player to complete the game. It thematically makes more sense
        for Moon Lord to threaten the universe if the universe itself was to be primarily
        mentioned in an important scripture to aid the hero. * Terraria the Animated
        Series is an official licensed webseries, and according to the creative director
        of the game, since day 1, was a partnership between Element Animation and
        Jazwares in order to sell officially licensed Terraria toys later that year.
        * Due to the immense inconsistencies and vagueness of what constitutes as
        a "melee", "ranged", "magic" and "summon" damage (Flying Knife is a melee
        weapon but Throwing Knives being a ranged weapon. Plasma, fire, boomerangs,
        flesh, ice, spores, explosives, energy blasts all vary on their damage type.
        Some weapons that can be used as melee weapons aren''t "melee" weapons), it
        can be assumed that the damage type of weapons are only applicable to weapons
        and enemies in Terraria, and classifying weapons and attacks from outside
        the game as such would be questionable, akin to how Types in Pokemon are treated.
        * Tooltips that intentionally reference a quote from another media were questioned
        in the making of this profile. The Lunar Hook however, likely is literal in
        its tooltip despite its reference, since the original quote is changed from
        "You want the moon? Just say the word and I''ll throw a lasso around it and
        pull it down!" to, "You want the moon? Just grapple it and pull it down!".
        The developers had intentionally changed the dialogue to fit in with the game
        itself. Given the name of the hook, and the fact that it requires ultra-powerful
        fragments to create, this is likely meant to suggest that it has the capacity
        to literally pull down the Moon. ** Similarly, the S.D.M.G.''s tooltip was
        also considered, despite the tooltip being a reference. The name of the game
        it is referencing is named Edge of Space, and the tooltip states, "It came
        from the edge of space". The lack of capitalization and the purposeful addition
        of the item being said to come from there, suggests that it is both a reference,
        and intended that the item literally came from the edge of space, which is
        backed up by it being dropped by Moon Lord, who was able to move to the blind
        spot of the universe to reach the Terrarian''s world. ==Gallery== File:TerrarianOfficial1.jpg|The
        four endgame classes File:TerrariaOfficial2.jpg|Various Terrarians in different
        armors File:TerrariaOfficial3.jpg|Endgame Ranger riding a minecart File:TerrariaOfficial4.webp|Palworld
        player wearing Silver armor from Terraria File:TerrariaOfficial5.jpg|Palworld
        player and Terrarian "dapping up" File:TerrariaOfficial6.png|Endgame Ranger
        sitting down File:TerrariaOfficial7.png|Silver armor Terrarian playing with
        a yo-yo (as seen on the TerrariaOfficial Twitch channel) File:TerrarianOfficial2.jpg|Molten
        armor Terrarian as seen on the "Molten Armor: T-Shirt" design File:TerrarianOffici'
