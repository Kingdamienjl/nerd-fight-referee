        Lord, and the mechanical bosses plus Mechdusa. Moon Lord at his peak who is
        stated to seemingly threaten the very fabric of the universe itself. The mechanical
        bosses were created as organ replicas for Moon Lord to power him back to full
        power, due to his organs being torn out by Dryad civilization using their
        accumulated powers. By the time the Terrarian fights Moon Lord however, Moon
        Lord appears to have healed back his eyes, spine, skull, and brain back when
        he was regaining power back. This heavily suggests that the Terrarian fought
        Moon Lord when he was at the same power as Cthulhu. Stardust Pillar's summons
        are stated to use limitless energy. Moon Lord is stated to have unlimited
        power. Can survive light and fire-based attacks from the Torch God, a being
