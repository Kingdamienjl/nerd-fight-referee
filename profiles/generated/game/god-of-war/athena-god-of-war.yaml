- id: claim-powers-and-abilities-101a6630
  section: abilities
  axis: hax
  text: 'Olympian={{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= *Superhuman
    Physical Characteristics *Soul Magic (Divine), BFR, Light Manipulation, and Transmutation
    (After witnessing Zeus pull a follower''s soul and send it to the Underworld by
    merely picking a droplet and transforming it into a rainbowGod of War I Novelization,
    Chapter 26, Athena asks why Zeus hadn''t allowed her to intercede the same way
    for her thousands of followersGod of War I Novelization, Chapter 10, indicating
    she would''ve done so had Zeus allowed it) *Greek Godhood (Has been described
    to be the Embodiment of Wisdom, Reason and Purity.God of War PS2 User Manual-
    Pages 34-35God of War II PS2 User Manual- Pages 10-11) *Teleportation (Teleported
    away somewhere else after turning into mistGod of War (Novel)- Chapter 4) *Transformation
    and Abstract Existence (Type 1. Able to transform into a pure state of magicGod
    of War I Novelization, Chapter 26, with access to her GodheadGod of War I Novelization,
    Chapter 5 as the embodiment of wisdom, reason and purity.) *Power Nullification
    (Zeus states that Athena "refused to undo her mistake" and that he was forced
    to attend to the matter himselfGod of War II, implying that Athena could have
    also stripped Kratos of his godly powers had she chose to. Kratos himself assumes
    that Athena conspired against him when this occurs) *Healing (Imbued the Blade
    of Athena with a healing auraGod of War Ascension: Multiplayer for one''s self
    and their allies) *Forcefield Creation (The Blade of Perseus, given power by Athena,
    can summon a magical barrier to protect one''s self and their allies) *Resurrection
    (Resurrected the Hydra to make Poseidon empower Kratos. Her selfless sacrifice
    to save Zeus from Kratos brought her back to a higher existenceGod of War III)
    *Transmutation and Curse Manipulation (Transmuted the Head of Medusa into a shield.God
    of War I Novelization, Epilogue Cursed MedusaGod of War (Novel)- Chapter 7 and
    her fellow companions into becoming Gorgon monstersGod of War (2005)- PS2 Manual)
    *Conceptual Manipulation (Type 1), Non-Physical Interaction, Sealing and Summoning
    (Summoned Hope and then placed it in Pandora’s Box alongside the Great Evils as
    a failsafe if the Great Evils were to ever escape again) *Precognition (Athena
    is the Goddess of Foresight, being able to look through improbabilities and possibilities
    immediately, by putting herself into a trance that can predict the future of even
    other gods.God of War I Novelization, Ch.7) *Weapon Creation (Athena can summon
    weapons to replace others in her graspGod of War I Novelization,Prologue instantly)
    *Light Manipulation (Could manipulate the remnants of Iris''s rainbows into a
    ring formation with a gestureGod of War II Novelization, Ch.39) *Extrasensory
    Perception (Can sense the corruption of the Great Evils within other gods) }}
    |-|Ascended Athena= {{Border|Scroll=No|Visible=Yes|Padding=Yes|Content=All previous
    powers at a higher level, including: *Incorporeality (Attained this state after
    her resurrection) *Intangibility and Abstract Existence (Type 1) (Upon dying and
    shedding her corporeal flesh, Athena ascended to a higher state of existence as
    per above, beyond even the abstractions that are the Primordials and the denizens
    of the Underworld, whose Form makes up a part of their existence, effectively
    ascending far above everyone else in the Greek World. She cannot be interacted
    with by any mortal or god, including Kratos) *Restoration and Statistics Amplification
    (Restored her corroded Blades of Athena into the brand-new Blades of Exile) }}'
