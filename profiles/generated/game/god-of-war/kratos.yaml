    3; can breathe underwater with the aformentioned artefactsGod of War (2005)) }} {{!}}-{{!}}Magic={{Border|Scroll=No|Visible=No|Content=
    *Hadean Energy (He wields the Souls of Hades with his Blades and had been given the ability to wield
