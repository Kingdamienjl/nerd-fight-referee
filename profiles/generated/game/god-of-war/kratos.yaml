- id: claim-intelligence-82914f8b
  section: power_scale
  axis: battle_iq
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Teenager= Gifted (As a young boy, Kratos
    easily bested Spartan Warriors many time his yearsGod of War Comic (2010) - Issue #1 and was the youngest
    cadet in Spartan history to receive an Eiren''s Pass. Can regularly best undead captains, whom have
    a mastery of both blade and sickle, as well as Wraiths, whom defeating requires a mastery of both
    one''s fear and one''s weaponry) |-|Adult= Genius (Was the greatest general of the Spartan Empire,
    having never lost a battle until his fateful meeting with Alrik. While he prefers his Blades, Kratos
    is a master of all weapons, capable of accurately and expertly using them without conscious thought.God
    of War I Novelization, Ch.6 Throughout his adventures, he has solved many puzzles, mostly created
    by Daedalus, who built the Labyrinth of Minos, and Pathos Verdes the 3rd, who built the Temple of
    Pandora, being the first to ever conquer the latter after a millennium of attempts. Despite using
    brutal and bloody methods, Kratos is of a keen tactical mind and could accurately assess the state
    of Athens during its siege with a mere glance. Possesses wrestling skills that he can use to take
    down trained soldiers even while weakened and exhausted.God of War II Novelization, Ch.6 Would eventually
    come to have complete knowledge and awareness of all forms of war and combat across all of time. due
    to their rank as the God of War. Had fought against multiple younger clones of himself who were stated
    to be much stronger, faster, more agile and considerably more bloodlusted, and killed all of them,
    threatening Ares to send more and saying that none would ever reach his family.God of War (Novel)-
    Chapter 31 Stated by Athena to be a warrior who is second to none. Was able to figure out that Freya
    had bewitched Mimir so that the latter was unable to reveal Baldur''s weakness to mistletoe or his
    identity as Freya''s son) }} Standard Tactics: Despite his infamous anger and ferocity, Kratos is
    a very adaptable combatant, who sees his weapons as tools for specific tasks, finding preference to
    be meaningless. Even as a child, he considered the use of whatever means he had at hand to be a skill
    worth learning. His tactics mirror this, as he uses whatever is appropriate to the situation. This
    is not exclusive to his weapons and physical combat approach, as Kratos will regularly use all of
    his available magical abilities in battle one after the other.God of War I Novelization, Ch.12'
