    which inflicts fire damage and through Torrent of Flames, in which the spear can creates a torrent
    of flowing fire to scorch the land) **Ice Manipulation (Via the Frigid Spiral, which inflicts frost
    damage and slows targets down and through Bastion of Ice in which the spear creates a protective ring
    of orbiting ice fragments) **Explosion Manipulation (Via Hunter''s Blade, in which a large radial
    blast detonates marks left by the blade, through Crimson Exile) **Spatial Manipulation (Via Crown
    of Agis, in which the spear phases between realities to double the number and impact of spear attacks,
    through Astral Touch) **Time Manipulation and Time Stop (Via Soldier''s Point, which slows down time
    with its attacks and Aion''s Breath, in which the Point triggers a temporal disruption that can even
