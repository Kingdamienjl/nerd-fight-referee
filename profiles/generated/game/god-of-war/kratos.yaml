    which inflicts poison on its targets and emits a lethal cloud of poison, through Scourge of Ruin)
    **Electricity Manipulation and Forcefield Creation (Via Thunder Barb, which inflicts shock based damage
    and can surround you in a protective barrier of electricity, through Veil of Thunder) **Petrification
    and Earth Manipulation (Via the Petrified Spike, which petrifies its targets with each hit, and the
    Tremor of Doom, in which the Spike generates a ring of stones that can be flung at opponents) **Vibration
