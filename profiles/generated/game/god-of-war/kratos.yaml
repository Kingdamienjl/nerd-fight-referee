    (Optional: Had wielded the Gauntlet during his quest to save creation, and had it taken away at the
    end of the quest) *Sun Shield (Optional): **Attack Reflection (Can turn attacks back at one''s opponents,
    including projectiles) }} {{!}}-{{!}}Artefacts={{Border|Scroll=No|Visible=No|Content= *Amulet of Ouroboros:
    **Time Manipulation (Is able to shape time itselfGod of War Ascension - Official Website (video here))
