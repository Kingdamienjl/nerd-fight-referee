      Bust={{Border|Scroll=No|Visible=No|Content= *Air Manipulation (Via Anemos, which allows the bust
      to consume toxic vapors and emit them again via a wind from its mouthGod of War Sons of Sparta (2026)
      - Lycurgus Bust) *Enhanced Senses (Via Otos, which allows the bust to commune with the spirit plane
      via aural echoes from the ears, and reveal hidden secrets and locations) *Light Manipulation and
      Psychometry (Via Phos, which radiates lights to reveal hidden objects and surfaces) *Information
      Analysis (Via Historeo, which records information automatically into the archives and is enchanted
      to chronicle Kratos''s experiences in his travels) }} {{!}}-{{!}}Resistances={{Border|Scroll=No|Visible=No|Content=
      *Soul Magic (Innate; Can withstand attacks from various undead foes, with said undead warriors capable
      of ripping and mangling the souls of Athenians with their own handsGod of War 1 Novel - Chapter
      5) *Madness Manipulation (Type 1 and 2), Sound Manipulation, Status Effect Inducement, Explosion
      Manipulation, Body Puppetry, and Empathic Manipulation (Can withstand the sonic attacks of Sirens.
      Sirens can drive one mad with their voice, lure you and make your body act out against your will,
      instantly kill people by causing their heads to explode, and blow people up with their high-tuned
      sound pitch, can emotionally manipulate their victims, and their sound pitches are so precise that
      they can easily light people on fire) *Hadean Energy (Can withstand being touched by the Hands of
      Asphodel, a spectral hand from the Underworld whose touch is lethal) *Curse Manipulation (Can survive
      contact with Nosoi, whose cursed vapors can bring down the strongest warriors) *Petrification (Can
      break out of the petrification of Gorgons) }}}} {{!}}-{{!}}Ghost of Sparta= {{#tag:tabber| {{!}}-{{!}}Innate={{Border|Scroll=No|Visible=No|Content=All
      Innate Spartan Cadet powers and abilities to a much greater extent, including: *Martial Arts (Pankration
      and Jiu-Jitsu; See Feats section) *Social Influencing **Reputation: Is feared and reviled throughout
      the Greek World to a degree that people would rather die than be saved by him. **Leadership: He
      managed to inspire fanatical loyalty in the Spartan Army, growing the number under his command to
      the thousands from a mere fifty even against overwhelming odds and had them conquer Greece in his
      name well before he became the God of War. **Charisma: Played Lakhesis against her fellow Sisters
      of Fate after a single conversationGod of War II Novelization, Ch.42, with the former being infatuated
      with Kratos from his birth.God of War II Novelization, Ch.15 *Enhanced Senses and Extrasensory Perception
      (Kratos battles by feeling, sound, smell and a sense honed in battle that transcended physical hints.God
      of War II Novelization, Ch.35 Able to easily fight and judge distances while blinded, relying on
      his hearing to give him an edge.God of War II (Novel)- Chapter 16 Shortly after being depowered,
      rendered mortal and having been stripped of his godly powers, on his journey to the Island of Creation,
      Kratos was able to sense the energy flow and lethality of the Spear of Destiny well before realizing
      what the weapon was and right before it was used against him, twice in a row.God of War II (Novel)-
      Chapter 18 Was able to sense Theseus''s magical attacks,God of War II (Novel)- Chapter 21 sensing
      energy in magical objects,God of War II (Novel)- Chapter 40 Lahkesis''s reddish apparition appearing
      before him,God of War II (Novel)- Chapter 42 as well as sense the presence of the Last Spartan in
      complete darknessGod of War II (Novel)- Chapter 44 and fight against himGod of War II (2007)) *Analytical
      Prediction (Can accurately simulate the potential movement of his opponents, using his instincts
      and senses,God of War II Novelization, Ch.16 even without his eyes. Kratos battles by feeling, sound,
      smell and a sense honed in battle that transcended physical hints) *Information Analysis (Has shown
      the capability of not only learning the power and properties of artifacts and weapons with a glance,
      as he did with the Spear of Destiny and the Amulet of the Fate''s compatibilityGod of War II (Novel)-
      Chapter 23 with Cronos'' magic. Can instinctively sense the deadly nature and power of the Spear
      of Destiny, knowing it to be the real danger to him. Could find new vulnerabilities with every move
      of his opponents, accurately surmising the Rider''s battle strategy and why he wouldn''t use the
      Spear) *Soul Magic (Innate; Absorption and Empowerment; Can absorb magic in the middle of combat
      when fully enraged through physical combat or his weapons. Absorbed the Ifreet as he killed the
      Persian King barehandedly. Absorbed his previous powers and equipment back by physically killing
      soulsGod of War: Chains Of Olympus Official Strategy'
