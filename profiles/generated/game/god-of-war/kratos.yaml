    Rise of the Warrior (2013)- Chapter 8) **Age Manipulation (The Amulet of Uroboros can restore objects
    back to their previous state and undo the causes of their destruction as if it never happened to begin
    with) **Forcefield Creation (Can generate a forcefield to protect its user) *Eyes of Truth: **Power
    Nullification (The Eyes of Truth see through the dark magic of the Furies, which wraps realityThe
