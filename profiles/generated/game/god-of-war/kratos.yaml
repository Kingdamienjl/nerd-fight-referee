    of golden apples from just the sweet smell within its blood) *Accelerated Development (Battle; Physical
    Statistics. Had gone from needing help from Deimos to defeat a River Cyclops to killing strongerGod
    of War Sons of Sparta (2026) - Archives, better armed variants singlehandedly. Grew from barely holding
    his own against one Stymphalian bird with Deimos, to both of them being able to fight and defeat all
    three at the same time) *Attack Reflection (Can parry and return both the force of melee attacks and
    projectiles back at their sender with his Aspis) }} {{!}}-{{!}}Spartan Arms={{Border|Scroll=No|Visible=No|Content=
