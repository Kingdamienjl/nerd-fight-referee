      that Freya had bewitched Mimir so that the latter was unable to reveal Baldur''s
      weakness to mistletoe or his identity as Freya''s son) }} Standard Tactics:
      Despite his infamous anger and ferocity, Kratos is a very adaptable combatant,
      who sees his weapons as tools for specific tasks, finding preference to be meaningless.
      Even as a child, he considered the use of whatever means he had at hand to be
      a skill worth learning. His tactics mirror this, as he uses whatever is appropriate
      to the situation. This is not exclusive to his weapons and physical combat approach,
      as Kratos will regularly use all of his available magical abilities in battle
      one after the other.God of War I Novelization, Ch.12'
