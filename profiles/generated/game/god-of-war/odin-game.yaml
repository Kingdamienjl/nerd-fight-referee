  tier:
    text: "{{1-C}} Name: Odin (Old Norse: \xD3\xF0inn, Nordic: \u16DF\u16DE\u16C1\u16BE\
      ), The Allfather, The Raven King, Lord of the Hanged, One-Eyed King Origin:\
      \ God of War Gender: Male Age: Inapplicable. Predates time itself. Classification:\
      \ Deity, Norse God, Aesir, God of Sky, War, Magic, Death, Wisdom, Knowledge,\
      \ Poetry Healing and Frenzy, King of Asgard, Ruler of Valhalla"
