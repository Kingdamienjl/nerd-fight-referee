        *Telepathy (Can hear and feel animals' thoughts/emotions) *Precognition (Foretold
        of Thor coming his and Kratos' home years prior to his actual arrival in his
        dream) *Weather Manipulation and Necromancy (The world mourns his death by
        causing a red storm and summoning undead monsters such as Draugr and Hel-Walkers)
        *Transformation and Shapeshifting (Atreus' god ability allows him to transform
        into animals such as a bear and wolf) *Rage Power (Atreus is implied to have
        his own Spartan Rage. However, it's never fully shown as Atreus passes out
        due to his sickness before he can even use it.) *Forcefield Creation (Can
        activate a magical barrier from Sindri and Brok's gear) *Soul Manipulation
        (Atreus can take souls and transfer them into soulless beings or inanimate
        objects such as marbles and his knife) *Dimensional Travel (Is capable of
        traveling to different realms by thinking of the place he wants to go) *Spatial
        Manipulation (Can close rifts in space) *Time Manipulation (Has various forms
        of slowing down time such as Eagle Eye and Sharpshooter Stare) *Summoning
        (Can summon various spectral animals to aid him in combat) **Energy Manipulation
        with Storm of the Elks (Storm of the Elks summons a deer that discharges energy)
        **Fire Manipulation and Ice Manipulation with Bitter Squirrel (Ratatoskr's
        Bitter aspect can enter enemies and either freeze or burn them) |-|Arrows=
        *Statistics Amplification (Can charge the power of his arrows. Amplifies the
        power of three of his arrow shots with Sharpshooter Stare) *Duplication with
        Runic Arrows (Can fire multiple Runic Arrows at once via charging it) *Light
        Manipulation and Statistics Reduction with Light Arrows (The Light Arrows
        are imbued with the Light of Alfheim which can stun enemies, lessen the damage
