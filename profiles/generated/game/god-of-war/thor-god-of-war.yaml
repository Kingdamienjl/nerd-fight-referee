- id: claim-powers-and-abilities-62f42fc8
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Soul Magic (Divine) *Master Combatant
    (Trained Thrúd in secret to help her become a Valkyrie) *Weapon Mastery & Weapon
    Control (With Mjölnir) *Immortality (Types 1 & 2) *Lightning Manipulation, Paralysis
    Inducement, Status Effect Inducement, Weather Manipulation & Shockwave Inducement
    (Can perform an electric thunderclap, and paralyze enemies with his lightning)
    *Flight *BFR (The force of his blow was so powerful that he splintered Yggdrasil
    and hurled Jörmungandr back through time, however, it should be noted that this
    was completely accidental and random) *Stealth Mastery (Has a habit of repeatedly
    sneaking up on Odin and catching the latter off-guard, even doing so for people
    who would consider him an ally at times if they pose a threat to him) |-|Resistances=
    *Runic Magic (Gods resist the innate properties of their magics. Unaffected by
    the clashing of his Mjölnir with Laufey''s Leviathan Axe, which tore apart many
    poor souls in the Vanaheim Crater Area.God of War: Ragnarök (2022)- Casualty of
    War Damaging souls can shatter and fragment their memories as a consequence) *Ice
    Manipulation & Leviathan Axe (Withstood blows from the Leviathan Axe. Visibly
    unaffected by Fimbulwinter, which completely froze over Midgard and almost all
    of its water bodies) *Blades of Chaos (Could withstand being attacked and immolated
    by the Blades of Chaos) *Regeneration Negation and Seidr (Leave unscathed with
    no permanent injuries from the the Hilt of DainsleifGod of War Ragnarok) *Bifrost
    Magic (Able to resist Kratos''s usage of Bifrost Chakrams) *Electricity Manipulation
    (Withstood his own lightning. Can withstand the Hilt of Ridill) *Sound Manipulation
    (Can withstand the Hilt of Angravadall) *Absorption & Resistance Negation (Could
    entirely resist the Draupnir Spear''s Siphon and its abilities)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
