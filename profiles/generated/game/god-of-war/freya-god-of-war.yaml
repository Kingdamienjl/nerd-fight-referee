      ==Summary== Freya is a Vanir goddess, their leader in fact, and the former queen
      of Vanaheim. After leading a long and bitter war with the Aesir, she agreed
      to marry her deadliest enemy in order to maintain peace and safety for her people,
      with whom she would sire Baldur. After ruling as Queen of Asgard, she grew sick
      of Odin's tyranny and obsession before breaking off the marriage with him at
      long last. He would take revenge by banishing and locking her up in Midgard,
      stripping her of her warrior's spirit and forcing to live secluded in the woods.
      She would stay there until she would meet and aid Kratos and Atreus on their
      journey. Unfortunately, this would lead to the death of her son at the hands
      of Kratos and her vowing revenge. After hunting them throughout Fimbulwinter,
      she gradually frees herself from Odin's grip and, after initially combating
      Kratos and his son, eventually reconciling their differences and rejoins them
      as an ally. Upon defeating her former husband once and for all, she would take
      his place alongside Kratos in governing what was left of the Nine Realms. ==Powers
      and Stats
