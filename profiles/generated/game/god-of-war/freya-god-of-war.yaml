  intelligence:
    text: Genius (Freya is one of, if not the most, powerful and knowledgeable user
      of the Seiðr witchcraft practiced by the Vanir Gods. Even Kratos was impressed
      by her magical abilities, enough so that he called her competent in her craft,
      even before Mimir revealed her identity as a Vanir goddess. Among the greatest,
      if not the greatest, masters of the Magics of the Vanir, Freya is capable of
      casting a wide variety of Seiðr spells without any concentration, requiring
      simply mere hand gestures and verbal spells in the ancient Vanir language and
      was the one who taught Seiðr to start with. She's also an immensely skilled
      combatant who led the Vanir during the war against the Aesir and won numerous
      battles, stalemating Asgard in the process)
