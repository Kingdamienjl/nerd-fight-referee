    - field: weaknesses
      value: 'Retains his inability to use Resurrection stones on himself. Atreus
        inherited his father''s temper, often losing control of himself and causing
        him to act recklessly, though this weakness appears to have mostly faded after
        receiving a scolding from Kratos. Initially had trouble controlling his transformations
        due to them being triggered on extreme emotional impulses like rage or sadness,
        but has since overcome them to maintain better control over his powers. His
        godhood and the power he draws from it heavily depend on his focus and self-belief,
        going from being unable to perform physically exerting tasks at his lowest
        to fighting on large with powerful gods and immortal warriors when in the
        right mindset, his focus for the game improves considerably. He doesn''t know
        how to swim. He lacks wisdom, which causes him to get tricked by Odin. Notable
        Attacks/Techniques: *Ljösa (Nordic: ᛚᛃᛟᛊᚨ) Atreus fires arrows infused with
        the light of Alfheim that can stun opponents more easily than his regular
        arrows and can unleash large bursts of light to attack multiple opponents
        at once. *Þruma (Nordic: ᚦᚱᚢᛗᚨ) Atreus fires arrows imbued with the lightning
        of the dragon Hræzlyr, paralyzing foes and sending arcs of lightning to hit
        opponents near his original target. *Wrath of the Wolf: Summons a spectral
        wolf that pounces on enemies three times. *Falcon''s Dive: Summons a cast
        of spectral falcons that dive into the ground. *Bitter Squirrel: Summons a
        spectral squirrel, Ratatöskr, to unearth consumables that can restore Atreus''
        health. *Boar Stampede: Summons a stampede of spectral boars that trample
        enemies in their path. *Murder of Crows: Summons a murder of crows that swarms
        enemies. *Storm of the Elks: Summons a spectral elk that discharges destructive
        energy as it walks. ==Notable Matchups== Victories: *Thrud (God of War) Thrud''s
        Profile (Starting Distance was 10 meters; Battle took place in Midgard) *Baldur
        (God of War) Baldur''s Profile (Post-Godhood Realization Atreus was used;
        Battle took place in Asgard; Baldur was bloodlusted) *Niðhögg (God of War)
        Niðhögg''s Profile (Norse Mythology Kratos and Post-Godhood Realization Atreus
        fought together against Niðhögg) *Riku (Kingdom Hearts) Riku''s Profile (KH3
        Riku and Ragnarök Atreus were used. Match was decided on Tigger''s KH2 Minigame;
        Speed was equalized) Losses: *Thor (God of War) Thor''s Profile (Post-Godhood
        Realization Atreus was used) *Hercules (God of War) Hercules'' Profile (Battle
        took place at the Lake of Nine; Atreus'' Shapeshifting is allowed) *Frisk
        (Undertale) Frisk''s Profile (Low 1-C Frisk was used, speed was equalized,
        starting distance was 10 meters and Frisk had all of their optional equipment)
        Inconclusive: ==Gallery== atreus ragnorak.png|Atreus as he appears in the
        cover art of God of War: Ragnarök ==References== {{Scroll box|content={{Reflist|2}}}}
