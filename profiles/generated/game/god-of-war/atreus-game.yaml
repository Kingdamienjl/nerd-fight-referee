power_scale:
  tier:
    text: '{{1-C}}, higher with Shape-shifting Name: Atreus (Greek: Ἀτρεύς), Loki
      (Nordic: ᛚᛟᚲᛁ), Björn (Bear form. The name means "Bear") Origin: God of War
      Gender: Male Age: 11 years old during GoW2018, 14 years old during Ragnarök
      Classification: God/Jottun/Human hybrid'
    source_ids:
    - vsbattles-atreus-game-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Complex Multiverse level (After realizing his godhood and training for
      3 years, he is comparable to Valkyries like Hrist and Mist and can outright
      fight against one of them on his ownGod of War: Ragnarok (2022)- The Summoning.
      Even while younger and weaker, he could hurt Baldur after the latter lost his
      invulnerability. Inferior to Heimdall, which would put him on par with Ares),
      higher with Shapeshifting (Bit through Odin''s armGod of War: Ragnarok (2022)-
      Unlocking the Mask in his wolf form. As Bjorn, he was able to hold his own against
      Spartan Rage Kratos, but Kratos eventually prevailed and would''ve killed him
      if Atreus didn''t transform back to normal in time. Charged at Freya and threatened
      to kill her had Kratos not intervened. Easily tore apart a Valkyrie in half)'
    source_ids:
    - vsbattles-atreus-game-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Immeasurable (Can fight gods and monsters on par with Kratos in swiftness,
      such as Garm, the Valkyries, Baldur, and Odin)
    source_ids:
    - vsbattles-atreus-game-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Complex Multiverse level (Withstood a direct blow from Baldur with only
      his wind knocked out of him, and after getting his breath back, Atreus was ready
      to fight against Baldur yet againGod of War (2018)- Jotunheim in Reach. Somewhat
      comparable to, albeit much weaker than his father, Kratos. Survived a vicious
      beating from Hrist and Mist without any lasting injuries. Able to withstand
      beatdowns from the likes of Odin), higher with Shape-shifting (Even stronger
      while in Wolf Form or as Bjorn, being on par with his father and taking hits
      from Kratos' Spartan Rage)
    source_ids:
    - vsbattles-atreus-game-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Even before learning of his status as a god, Atreus singlehandedly
      destroyed an army of dark elves and fought alone for close to a whole day while
      protecting his father. His stamina further increased after realizing his potential,
      being able to endure long fights and withstand falls from great heights without
      suffering any noticeable fatigue)
    source_ids:
    - vsbattles-atreus-game-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Tens of Meters with Talon Bow and summons. Several
      Kilometers with Weather Manipulation (His screams caused the skies to darken
      and erupt into a violent storm. Inapplicable in combat), Low Multiversal via
      the Utangard (Can use it to travel to any of the Nine Realms)
    source_ids:
    - vsbattles-atreus-game-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Genius (Has the innate talent to understand written and spoken languages
      he has never heard of or read before by tracing their connections, being able
      to quickly learn how to read the Niflheim and Muspelheim languages when given
      a cipher, how to read Greek when given a jug of wine from Sparta, and even how
      to speak the dead language of the World Serpent despite only hearing it a handful
      of times. He can also understand some animals, and even Mimir, the smartest
      man in the nine realms, took note of Atreus' linguistic capabilities for someone
      of his age. A capable fighter, assisting his father in his fights using his
      bow skills and even taking on gods such as Baldur alongside Kratos)
    source_ids:
    - vsbattles-atreus-game-god-of-war
    confidence: 0.6
    notes: auto_repair source extraction
