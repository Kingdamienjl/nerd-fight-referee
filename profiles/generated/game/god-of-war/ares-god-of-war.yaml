- id: claim-powers-and-abilities-1f293e83
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Immortality (Types 1, 2 & 3) **Greek
    Godhood (Is the embodiment of War itself, all Gods of War have complete control
    and awareness over all forms of war, battle and conflict across all of timeGod
    of War (Novel)- Epilogue) **Regeneration (Low-Mid; Easily healed from being stabbed
    through the abdomen with his own Spider armsGod of War (2005)) *Soul Magic (Divine)
    and the Fires of Ares *Martial Arts & Weapon Mastery (As the God of War, Ares
    also possesses knowledge of all forms of conflict and combat across all of time)
    *Resurrection (He can respawn his army at any place in an instantGod of War I
    Novelization, Ch.8) *Accelerated Development (As the God of War, he can become
    stronger, faster and more combat-capable with every passing moment in battle,God
    of War 2 Novel- Chapter 3 with this power being at the same level as the Relic
    of Determination, where the warriors of Ares grow stronger by 20% per minuteGod
    of War: Ascension (2013)- Multiplayer) *Aura (Gave this power to the Lance of
    AresGod of War: Ascension (2013)- Multiplayer) *Flight *Teleportation *Pocket
    Reality Manipulation, Reality Warping, BFR, Duplication,, Power Mimicry, Power
    Nullification, All of Demigod Kratos''s Magics & Items, and Absorption (Sent Kratos
    into a pocket dimension where he fights a bunch of clones of himself that can
    replicate his powers, like Zeus'' Fury, as confirmed in God of War IIGod of War
    II (2007) and its novelGod of War 2 (Novel)- Chapter 47. He can nullify and strip
    others off of their own powers inside his own pocket dimension. He also warped
    the reality of said dimension, stealing all of Kratos''s powers and magic as well
    as his weapons from himGod of War (Novel)- Prologue and Epilogue, and completely
    nullified them, even going so far as to use the Army of Hades Soul Summon ability
    against him) *Weapon Creation (Can materialize various weapons out of thin air)
    *Animal Control (Commanded several mythical beasts such as harpies) *Dimensional
    Travel (Travelled with Kratos to a galaxy-sized dimension after sending him there)
    *Necromancy (Controlled hordes of Undead LegionnairesGod of War (2005)- PS2 Manual)
    *Fire Manipulation, Explosion Manipulation & Rage Power (His hair is literally
    composed of fire. Set many Barbarian Soldiers on fire. His War Hammer of Olympus,
    Maul, Blade, Spear and Lance can also manipulate fire in many intricate ways,
    even using his War Hammer of Olympus against Kratos. Can create a massive wall
    of flames with a power of the same name, as well as unleash explosions on enemies
    with Incineration. The Rage of Ares also gives Kratos the power to wield his fire
    and with it, controlled explosions, as well as further amplifying Kratos''s rage,
    and his Blades of Chaos have these abilities by default. His fires are even stronger
    than those of the Blades of ChaosGod of War (Novel)- Chapter 7) *Regeneration
    Negation (His fires prevented Kratos from being able to heal his back injury,
    forcing the latter to use his Blades of Chaos to heal himself and douse the fires
    out which still left his back soreGod of War (Novel)- Chapter 8) *Additional Limbs,
    Bodily Weaponry, Body Control & Limited Elasticity (Grew six Spider arms out of
    his back, and he can control and extend them to any length he wants) *Earth Manipulation
    & Magma Manipulation (Summoned volcanic rock structures in his battle with Kratos,
    also threw enflamed chunks of rock out of nowhere) *Healing & Damage Boost (via
    Battle Horn of Restoration, restores health and increase the weapon''s power)
    |-|Resistances= *Blades of Chaos (Able to resist the powers of the Blades of Chaos
    being used against him by Kratos) *Petrification and Deconstruction (Resists Poseidon''s
    Rage, which itself consists of Poseidon''s Power, which destroysGod of War Ghost
    of Sparta Brady Guide both the soul and the body of whoever stands in the path
    of its electric beam, with Poseidon''s Rage being able to even completely destroy
    incorporeal WraithsGod of War (Novel)- Chapter 6 to less than smoke. Unaffected
    by Medusa''s Gaze, which turns beings into stone.) *Death Manipulation (As per
    Hephaestus, Ares also had sex with AphroditeGod of War III (2010), who shares
    the same powers as her twin daughters Zora and Lora, who can kill people at the
    mere act of having sex with themGod of War (Novel)- Chapter 5)'
  source_ids: *id003
  decisive: true
  status: unverified
