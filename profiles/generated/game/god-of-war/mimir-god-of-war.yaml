- id: claim-weaknesses-f9336889
  section: weaknesses
  axis: weakness
  text: 'Cannot practically fight on his own. Huldra Project #9 causes him extreme
    pain to use. Notable Attacks & Techniques: *Clairvoyance: With a proper Medium,
    Mimir is capable of peering through reality to spot things that should be impossible
    to see, such as peering into Jötunheim through the last realmgate to it, or looking
    at messages reserved only for Giants. *Extrasensory Perception: Via unknown means,
    whether it be his Bifröst eyes or just intelligence, Mimir is capable of seeing
    through Týr''s illusionary capabilities with ease. *Huldra Project #9: A project
    prepared for two years by the Huldra Brothers Brock and Sindri, the after-effects
    of such were awakened after the battle of Ragnarök, causing Mimir to be capable
    of projecting a large amount of Bifröst energy from his eyes, seemingly at will.
    ==Notable Matchups == Victories: Losses: Inconclusive: ==References== {{Scroll
    box|content={{reflist|2}}}} {{Discussions|Mimir God of War|Mimir (God of War)}}
