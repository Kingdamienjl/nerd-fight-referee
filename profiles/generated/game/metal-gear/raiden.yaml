    text: "At least Genius; Raiden is a former child soldier who, by the age of six,\
      \ was already fighting on the front lines of the Liberian Civil War, and by\
      \ ten had become captain of his own platoon.Metal Gear Solid 4 Database: Raiden\
      \ Armed and trained under Solidus Snake in the Army of the Devil's Small Boy\
      \ Unit, his refined technique and prodigious kill count earned him multiple\
      \ monikers\u2014most notably \"Jack the Ripper\" and \"White Devil\"Metal Gear\
      \ Solid 2: Torture scene (Cutscene)\u2014and led to him being explicitly described\
      \ as a genius in combat even at that age.Metal Gear Rising: Revengeance - Konami\
      \ Website (Characters) Later, as part of the Patriots S3 Plan, Raiden was deliberately\
      \ modeled as a successor to Solid SnakeMetal Gear Solid 4 Database: Solid Snake\
      \ Simulation\u2014history's greatest warriorMetal Gear Solid 4 Database: Raiden\u2014\
      by being put through an intensive VR curriculum that recreated Snake's operations\
      \ in minute detail. Before the Big Shell Incident he had already completed hundreds\
      \ of VR missions (ranging from standard weapons and infiltration drills to \"\
      mystery\" scenarios, such as finding a murder culprit and solving locked room\
      \ puzzles, and even surreal set-ups like fighting giant enemies), including\
      \ simulations of the Shadow Moses and Tanker incidents with himself in Snake's\
      \ role.Metal Gear Solid 4 Database: VR Training This gave him exceptionally\
      \ broad and deep training in weapons handling, small-unit tactics, stealth infiltration,\
      \ espionage, demolitions, hostage situations, anti-armor work, close-quarters\
      \ combat, and a wide range of other specialized military skills that would normally\
      \ take a lifetime to accumulate, all under deliberately extreme, artificial\
      \ conditions. Building on that VR background, Raiden served in the U.S. Army's\
      \ Force XXI trials, testing network-centric warfare systems and battlefield\
      \ information technology, and was selected into the reconstituted FOXHOUND unit.Metal\
      \ Gear Solid 2: Vamp Encounter 2 FOXHOUND has notoriously high standards not\
      \ just for physical conditioning, but for mental aptitude and professional skill\
      \ as well: candidates are evaluated on marksmanship, emergency decision-making,\
      \ intelligence, foreign languages, foreign geography, knowledge of world events,\
      \ advanced technology, medical procedures, demolitions and detonation operations,\
      \ stealth communications, and proficiency with foreign weapon systems, followed\
      \ by professional drills in battlefield survival, fieldcraft and land navigation,\
      \ escape and evasion, hand-to-hand combat, infiltration and guerrilla warfare,\
      \ intelligence gathering, the language and customs of target regions, stealth\
      \ techniques, improvised explosives, high-tech equipment usage, advanced communications,\
      \ combat medical skills, and various air and sea insertion methods;Metal Gear\
      \ 2 Manual: FOXHOUND Training effectively they are experts and have mastered\
      \ numerous arts, possessing every skill and body of knowledge required of a\
      \ high-tech special forces unit, whether it be various martial arts, or anything\
      \ in between.Metal Gear 2 Manual: FOXHOUND Raiden himself notes undergoing language-school\
      \ and communications work there (including learning Spanish) and training in\
      \ a simulated Afghan village at Fort Polk.Metal Gear Rising: Revengeance - R-02:\
      \ Courtney; Rec 002 Notably, all of this\u2014his child-soldier upbringing,\
      \ VR conditioning, Force XXI participation and FOXHOUND training\u2014was already\
      \ part of his background before the Big Shell Incident, when he was in his early\
      \ twenties, and much of his Liberian past was still suppressed or fragmented\
      \ in his own memory. Taken together, Raiden's overall knowledge, technical proficiency,\
      \ and operational capability far exceed what would ordinarily be expected even\
      \ of the most elite special operations personnel on the planet. Raiden's capacity\
      \ to learn and adapt is arguably his greatest asset. Despite having almost no\
      \ prior real-world experience with a sword, he was able, in the span of only\
      \ a few moments of practice, to reach a level of proficiency where he could\
      \ defeat in single combat an opponent who not only held multiple advantages\
      \ over him, but was also a seasoned master swordsman and his former commander.Metal\
      \ Gear Solid 4 Database: Katana From there he built on that foundation through\
      \ self-directed study and practice, developing a largely self-taught style that\
      \ combines VR-drilled fundamentals, principles taken from Japanese swordsmanship\
      \ and samurai doctrine, and his own improvisational timing and footwork.Metal\
      \ Gear Rising: Revengeance - R-01: Courtney; Rec 024 By the events of Metal\
      \ Gear Rising: Revengeance he demonstrates practical mastery with a wide variety\
      \ of weapon types, seamlessly integrating HF blades with other melee systems\
      \ such as polearms, sais, whip-like segmented weapons, heavy blades and more,\
      \ on top of already-extensive familiarity with all manner of firearms, explosives,\
      \ and support gear. Across both simulations and real operations he has fought\
      \ an unusually wide spectrum of opponents: in"
