  stamina:
    text: "MGS2={{Border|Scroll=No|Visible=Yes|Content=Superhuman: The Big Shell Incident\
      \ is effectively a 24 hour operation, beginning April 29th and ending the morning\
      \ of April 30th (timeframe shown here, with the date being explicitly referenced\
      \ during the incident itself, April 29th,Metal Gear Solid 2: Snake's Elevator\
      \ Ascent 1 (Cutscene) and April 30thMetal Gear Solid 2: AG Surfaces 14 (Cutscene)).\
      \ In other words; it is hours of continuous exertion and decision-making where\
      \ Raiden is functional the entire time. He infiltrates Big Shell by water,Metal\
      \ Gear Solid 2: Infiltrating Big Shell (Intro) and spends hours moving strut-to-strut\
      \ under constant pressure, alternating between long stretches of stealth movement\
      \ and sudden spikes of direct combat. The work itself is physically grinding:\
      \ extended sneaking, repositioning, repeated sprints, climbing and hanging transitions,\
      \ swimming segments, taking out or bypassing sentries, and performing bomb disposal\
      \ under time constraints,Metal Gear Solid 2: Bomb disposal all while remaining\
      \ alert enough to avoid detection and keep his objective in mind. The incident\
      \ also repeatedly denies him anything resembling real rest due to constant time\
      \ limits, bombs, hostage situations,Metal Gear Solid 2: Post-Disarm, Elevator\
      \ Hall 1 (Codec) enforced battles, and more. The only real \"break\" he gets\
      \ is forced incapacitation: after nearly a full day of sneaking and fighting\
      \ (timing noted here; nightfall), he is electrocuted, stripped naked, tortured,\
      \ strangled, and punched, and keeps going anywayMetal Gear Solid 2: Sons of\
      \ Liberty (literally the whole game why even ask?) (with the strangling itself\
      \ being directly shown here, including a reference moment where he is not resisting).\
      \ Rather than being allowed to recover after this, he is pushed straight back\
      \ into continuous action, sneaking past armed Tengu in a frigid environmentMetal\
      \ Gear Solid 2: It's cold inside Arsenal (Codec)\u2014naked\u2014while mentally\
      \ assaulted by his incoherent CO and multiple mind-breaking truths. Before promptly\
      \ fighting dozens of Tengu alongside Snake once he gets his equipment back.\
      \ His stamina is further underlined when he is dosed with an excessive amount\
      \ of phenobarbital,Metal Gear Solid 2 - Screenplay (Page 623) a drug that is\
      \ explicitly shown earlier to be debilitating to normal people in the same incident\
      \ (the same drug crippling a normal person earlier,Metal Gear Solid 2 - Screenplay\
      \ (Page 482) and E.E. being given it and needing aid just to walk,Metal Gear\
      \ Solid 2 - Screenplay (Page 542)Metal Gear Solid 2 - Screenplay (Page 822)\
      \ with numbness in the legs shownMetal Gear Solid 2: E.E. Strut L 2 (Cutscene)).\
      \ Despite that, Raiden continues operating at a level where he can still perform\
      \ complex combat and movement, and the mission does not \"slow down\" for him\
      \ afterward. Near the end, this endurance culminates in him still being able\
      \ to fight Solidus Snake in a sword duel with minimal preparation and win, despite\
      \ the fact he has already been put through a full day of sustained exertion,\
      \ capture, torture, and chemical impairment. Ultimately ending with him being\
      \ seemingly more or less fine.Metal Gear Solid 2: Ending 1 (Cutscene) Notably,\
      \ the entire incident was deliberately manufactured to push Raiden's physical\
      \ and mental endurance, yet he still overcame it.Metal Gear Solid 4: Piggyback\
      \ Guide - Page 192Metal Gear Solid 4: Piggyback Guide - Page 193 This level\
      \ of endurance is consistent with his background. Even as a child, he was kept\
      \ functional under harsh conditions, being fed only once a day with food laced\
      \ with gunpowder containing toluene and still remaining an elite soldier.Metal\
      \ Gear Solid 2: AG Activated 23 As a FOXHOUND operative he also has extensive\
      \ conditioning involving cross-country marches, drills, and ranger practice,Metal\
      \ Gear 2 Manual: FOXHOUND Training and he is trained to continue operating while\
      \ compromised, as shown by completing a VR Mission that simulates a full infiltration\
      \ and demolition while replicating a heavily injured state.Metal Gear Solid\
      \ Virtual Missions Infinite with Wig B: provides infinite stamina. }} |-|MGS4={{Border|Scroll=No|Visible=Yes|Content=Superhuman:\
      \ Raiden progressively gets more damaged throughout the events of the incident,\
      \ yet he continues fighting through injuries that would normally cause immediate\
      \ incapacitation or death. The first clear demonstration comes during his initial\
      \ clash with Vamp. Even after Vamp drives a knife into where his heart would\
      \ be - and does it twice to account for possible reversed positions - Raiden\
      \ still fights Vamp (throughout which he's impaled and knifed several more times,\
      \ including driving his own blade through his own torso) and wins the exchange.Metal\
      \ Gear Solid 4: Solid Sun - Raiden Appears (Cutscene)Metal Gear Solid 4 - Screenplay\
      \ (Page 234) After this, he survives for nearly a day unaided, until Dr. Madnar\
      \ provides Raiden medical equipment,Metal Gear Solid 4: Solid Sun - Dr. Madnar\
      \ (Codec) with the caveat of it taking roughly 48"
    source_ids:
    - mediawiki-41439
    confidence: 0.8
    notes: auto_repair source extraction
  range:
    text: 'Standard Melee Range physically; Extended Melee Range with High-Frequency
      Blade (Nearly 1 meter in blade length); Varies, up to Kilometers with equipmentBased
      on minimum stated or shown values, real equivalents otherwise: *M9: Tens of
      Meters (Can hit and incapacitate a target from nearly 100 meters away; effective
