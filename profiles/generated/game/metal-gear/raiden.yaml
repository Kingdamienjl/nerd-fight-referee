    notes: auto_repair source extraction
  speed:
    text: 'Beat the game in under 2 hours (any difficulty). *Passing Rain: Beat Normal
      or higher in under 8 hours. *Light Drizzle: Beat Normal or higher in 12 hours
      or more. *Rain Shower: Beat the game in 10+ hours, with 10+ deaths, and use
      20+ healing items. *Battle Tested: Beat Normal or higher with 50+ detections.
      *Sworn to Secrecy: Beat Normal or higher with fewer than 35 detections. *Thunderstorm:
      Beat Hard or higher with no deaths and no Repair Nanopaste used. *Hard Worker:
      Get any rating in every Ranked Battle (including optional/hidden fights). *Jack
      the Ripper: Perform 1,000+ Blade Mode slices on enemies; also what he was known
      as as a child due to his killing prowess and later throughout the World Marshall
      Incident. *Precision Machine: Cleanly sever 30 of each body-part type in Blade
      Mode during a playthrough without destroying the cut parts. *Ninja: Get 50+
      Ninja Kills in a playthrough on Normal or above. *Samurai: Beat Normal or higher
      using the HF Blade exclusively as your primary weapon. *Massive Deterrent: Beat
      Normal or higher without killing Cyborg / Armored Cyborg / Cyborg Berserker
      enemies. *Mr. One Percent: Earn 300,000+ BP in one playthrough on Normal or
      higher. *Naked and Unloved: Beat Hard or higher without upgrading Life or Fuel
      Cell capacity. **Revengeance titles shown here. Origin: Metal Gear Age: 26 |
      31 | 35While never directly stated, we''re told that Raiden joined the Liberian
      war in 1989 in Database (which stared 1989/12/24), and that he fought in the
      80s by Solidus, in which he was only 6 when he began. Which implies 1983 is
      the year of his birth, making him roughly 26 in MGS2 (2009), 32 in MGS4 (2014),
      and 35 in MGR (2018). The exact age could vary depending on his exact birthdate
      relative to when in the year each game takes place but it''d be around these
      ages. *Master Book timeline for extra details. Gender: Male Classification:
      Human | Cyborg Ninja'
    source_ids:
    - mediawiki-41439
