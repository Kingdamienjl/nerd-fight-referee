  attack_potency:
    text: 'Building level+ (Defeated Solidus Snake,Metal Gear Solid 2: Solidus Snake
      (Boss) a perfect clone of Big Boss;Metal Gear Solid 4 Database: Solidus Snake1.14
      Tons of TNT; can harm a peak Solid Snake who at an earlier point in time could
      withstand Plastic Explosives. Can also contest Solidus Snake who is a perfect
      clone of Big Boss, designed to be his equal. Furthermore, Solidus wears a state-of-the-art
      exoskeleton that boosts strength by several times, with the original Big Boss
      and Venom Snake being all but immune to a younger rookie Snake''s attacks and
      most weaponry including said explosives. As such he still ultimately scales
      over earlier characters chronologically threefold. his weapons scale as they
      can harm Vamp and Solid Snake) | Multi-City Block level (Held back Outer Haven
      while missing an arm156.78 Tons of TNT) | Small City level (Weaker yet comparable
      to Senator Armstrong; he was able to contend and even briefly overpower Armstrong,
      as well as harm him bare-handed, even using his own strike to stop a blow from
      the aforementioned Senator. Also threw around and demolished Metal Gear EXCELSUSApproximately
      equal to Armstrong at his peak, whom is at least 1.902 Megatons of TNT.), Varies
      between Large Town level+, up to City level with equipment *High-Frequency Blade:
      5.7 Megatons (3.0x). *High-Frequency Murasama Blade: 6.65 Megatons (3.5x). *High-Frequency
      Long Sword: 6.65 Megatons (3.5x). *Stun Blade: 4.75 Megatons (2.5x). *Armor
      Breaker: 4.75 Megatons (2.5x). *High-Frequency Machete: 4.75 Megatons (2.5x).
      *Sai: 5.7 Megatons (3.0x). *Pole-Arm: 5.7 Megatons (3.0x). *Pincer Blades: 5.7
      Megatons (3.0x). *FOX Blade: 5.7 Megatons (3.0x). *High-Frequency Wooden Sword:
      0.627 Megatons (0.33x). *Snake Spirit: 0.95 Megatons (0.50x). *Body/Outfit "Attack"
      multipliers (these multiply weapon damage on top of the above): **Custom Body
      (Red): 1.15x (Attack). **Custom Body (Blue): 0.85x (Attack). **Custom Body (Yellow):
      1.0x (Attack). **All other listed bodies/armors (Standard/Original/Suit/Mariachi/Gray
      Fox/White/Inferno/Commando/etc.) are 1.0x (Attack). ***Highest Multiplier: High-Frequency
      Murasama Blade/High-Frequency Long Sword + Custom Body (Red): 7.45 Megatons
      (3.65x). ***Lowest Multiplier: High-Frequency Wooden Sword + Custom Body (Blue):
      532.95 Kilotons (0.2805x). , higher with Ripper Mode & High-Frequency Blades
      also ignore conventional durability (High-Frequency Blades weaken particle bonds
      to cut cleanly or damage virtually any targetMetal Gear Rising: Revengeance
      - High-Frequency Blade (Description)Metal Gear Rising: Revengeance - R-01: Kevin;
      Rec 013)'
    source_ids:
