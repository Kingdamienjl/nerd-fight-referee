    text: 'right|340px|thumb|Credit to itrashman115 {{Quote|America is diseased. Rotten
      to the core. There''s no saving it — we need to pull it out by the roots. Wipe
      the slate clean. BURN IT DOWN! And from the ashes, a new America will be born.
      Evolved, but untamed! The weak will be purged, and the strongest will thrive
      — free to live as they see fit, they''ll make America great again! (...) You
      still don''t get it. I''m using war as a business to get elected... so I can
      end war as a business! In my new America, people will die and kill for what
      they BELIEVE! Not for money. Not for oil! Not for what they''re told is right.
      Every man will be free to fight his own wars!|Armstrong explaining his motives
      to Raiden}} File:SenatorArmstrongSpeech.ogg ==Summary== Steven Armstrong is
      the main antagonist of the game Metal Gear Rising: Revengeance. He is a United
      States Senator representing the U.S. state of Colorado and a candidate for the
      2020 United States Presidential Election. When Armstrong was young, he used
      to play college football for the University of Texas, where he excelled at the
      game. Nevertheless, he renounced his chances of going pro by joining the Navy
      years later. By the time of 2018, Armstrong had become the senator of Colorado.
      He was also the benefactor of World Marshal Inc. and its de-facto CEO. ==Powers
      and Stats'
