- id: claim-weaknesses-249cdb73
  section: weaknesses
  axis: weakness
  text: 'Armstrong will die if his nanotech-infused heart is destroyed (Raiden had
    to rip it out of Armstrong''s body and crush it with his hand to end the fight),
    and his regeneration is negated by accessing it. His nanomachines require immense
    amounts of power to activate fully (He drained multiple heavily armed military-grade
    helicopters and tanks during his fight with Sam and Metal Gear Excelsus'' remaining
    energy during his battle with Raiden). He''ll generally try to recruit his opponent
    before going for the kill if he deems him worthy. It would be possible for someone
    much faster than Armstrong to outpace his nanomachines, which happened in his
    fight with Sam thanks to his Quick Draw, which greatly boosted Sam''s already
    superior speed. ==Gallery== File:Metal Gear Rising Revengeance OST It Has To Be
    This Way Extended|The Senator''s theme song File:Senator Armstrong Fire and Flames
    001.png File:Senator Armstrong nanomachines guidebook.webp|alt= ==Notable Matchups==
