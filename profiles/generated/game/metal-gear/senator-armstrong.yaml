    ==Summary== Steven Armstrong is the main antagonist of the game Metal Gear Rising:
    Revengeance. He is a United States Senator representing the U.S. state of Colorado
    and a candidate for the 2020 United States Presidential Election. When Armstrong
    was young, he used to play college football for the University of Texas, where
    he excelled at the game. Nevertheless, he renounced his chances of going pro by
    joining the Navy years later. By the time of 2018, Armstrong had become the senator
    of Colorado. He was also the benefactor of World Marshal Inc. and its de-facto
    CEO. ==Powers and Stats'
