- id: claim-weaknesses-dc3f56e6
  section: weaknesses
  axis: weakness
  text: 'As a young man, Ocelot was arrogant and overly confident until a defeat by
    Naked Snake taught him valuable lessons in humility and strategy. His penchant
    for theatrics, particularly his flair for dramatically reloading his revolver
    mid-combat, often left him vulnerable to attack, reflecting a certain disregard
    for practicality in favor of style. Later in life, the transplanted arm of Liquid
    Snake disrupted Ocelot''s mental stability, leading him to replace it with a regular
    bionic arm for greater equilibrium. ==Gallery== Liquid_Ocelot.jpg | Liquid Ocelot
