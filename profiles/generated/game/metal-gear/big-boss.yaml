- id: claim-weaknesses-c7ffad3d
  section: weaknesses
  axis: weakness
  text: 'Big Boss is missing an eye and is haunted by the memory of his mentor, The Boss. Notable Attacks/Techniques:
    *CQC: Unique and highly efficient martial arts, allowing a soldier a variety of options while not
    denying them the use of weapons. It generally has the user taking a stance with a knife and a handgun;
    thus, they could grab/throw opponents in melee, threaten/execute people with the sharp blade or shoot
    down opponents who''re otherwise outside the user''s range. CQC mostly focuses on grabs, throws, and
    other methods to disarm the target, allowing one to take down enemies without killing them or use
    them as a human shield. A skilled practitioner can even "chain" throws, allowing them to rapidly neutralise
    entire groups of soldiers in close proximity of each other. Being a co-developer of the technique,
    Big Boss is exceptionally skilled at CQC and overtime, during ''Operation Snake Eater'', grew to match
    and likely surpass the Boss'' mastery of it. naked snake cqc.gif|Naked Snake using CQC against the
    Ocelot Unit during the ''Virtuous Mission'' old boss cqc.gif|Big Boss using CQC to hug Old Snake ==Gallery==
    Calling To The Night - MGS Love Deterrence - Peace Walker + Ground Zeroes Version Metal Gear Solid
    4 Soundtrack Father and Son boss mgs3.webp|Naked Snake as he appears during the ''Virtuous Mission''
    boss mg1.webp|Big Boss as he appears in the Metal Gear (1987) manual boss mg2.webp|Big Boss as he
