- id: claim-standard-equipment-f85ce9f8
  section: equipment
  axis: equipment
  text: "|Many weapons, such as a knife, pistols, rifles, sniper rifles, grenades, mines, C4, and rocket\
    \ launchers. Other equipment includes a cardboard box, stealth mats, mine detectors, thermal and night\
    \ vision goggles, and binoculars. *iDroid: Holographic interface device that provides Snake with live\
    \ info on the terrain, weather, and position of objectives and marked targets. It also serves as a\
    \ communication device that keeps Snake in touch with Militaires Sans Fronti\xE8res' staff, allowing\
    \ Snake to call-in requests for airstrikes, chopper support, and airdrops to change or re-supply his\
    \ current equipment. *Analyzer: Electronic device that allows Snake to analyze the skills and abilities\
    \ of soldiers he focuses on. *Fulton Recovery System: Surface-to-air recovery system, it allows Snake\
    \ to extract supplies, weaponry, vehicles, animals, and people from the area and transport them to\
    \ Mother Base. *Sneaking Suit:: A unique military garment made of highly-resistant aramid weave that\
    \ offers superb damage resistance. It clings tightly to specific parts of the body, speeding up recovery\
    \ from wounds and increasing the user's endurance. Like other models before it, it provides insulation\
    \ that protects the body from dangerous substances and allows the user to operate in extreme climates\
    \ and damp conditions. It also incorporates noise-dampening soles that will enable the user to run\
    \ without making a sound. *Camouflages: During Operation Snake Eater, Naked Snake acquired several\
    \ unique camo uniforms, some of which possessed special abilities. **Mo"
  source_ids: *id003
  decisive: false
