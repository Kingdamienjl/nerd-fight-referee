      his lack of experience; and he was later chosen to lead them as his late father's
      final wish. Ike has also shown to be an excellent leader and successfully took
      on Daien's entire armies even with just a handful of mercenaries. Ike was also
      later chosen as the only one capable of leading the supreme general of both
      the Begnion Empire and the Laguz Alliance. Against both the forces of Daien
