  intelligence:
    text: 'Genius |-|General= A skillful combatant regarded as a living legend among
      mercenary circles, acquiring the moniker "Ashen Demon" for defeating many adversaries
      without showing emotion and was just as feared as “Blade Breaker” Jeralt, a
      legendary knight considered the strongest in history, was. Although they lack
      social expertise, they are depicted as gifted teachers because of their nature
      to reflexively help people, such as listening to their students’ problems and
      becoming a pillar of strength to help them grow into a better version of themselves,
      not to mention being able to bring out their hidden potential and help them
      excel even in topics they aren’t good at. According to Lysithea, they account
      for people''s weaknesses while capitalizing on their strengths. Can potentially
      become the first leader of the United Kingdom of Fodlan or Archbishop of the
      reform Church of Seiros, demonstrating their political and leadership abilities
      beyond directing soldiers. This is supported by a warrior of Catherine’s prestige,
      who after extensive research stated that they really are first rate, someone
      who should not exist with all of their exceptional qualities yet here they are;
      their sword skills are impeccable, and they’re a gifted educator who loves working
      with the students, and Catherine admits she can’t hope to emulate them. Outside
      of combat and tactics, they show a manipulative side, as seen by them goading
      Claude into betraying the Empire in Three Hopes: Scarlet Blaze Route so that
      Byleth can get revenge on them, and Claude can try to take Fodlan for himself.
      They are also very analytical, able to see past the three house lords’ first
      impressions and identify their hidden depths, such as Edelgard’s ambition, Dimitri’s
      mask of sanity, and Claude''s insincere casualness, not too long after meeting
      them. |-|Tactics= As noted by their Support with Claude and Seteth and their
      Expedition with Shez, Byleth is a tactical genius who is skilled in war and
      in matters of strategy with their preferred fighting style is guerrilla warfare.
      According to Shamir, battles tend to go smoother with them leading and Shez
      acknowledges that their commands are more intuitive than theirs. They are capable
      of multi-tasking, able to focus on giving orders whilst fighting at the same
      time according to Raphael. As a teacher of Garreg Mach, they host seminars for
      students, which includes magic, martial arts, battle tactics and mathematics.
      They played an instrumental role in the war, leading their chosen house and
      army to victory, despite the numerous odds and setbacks that plagued them since
      Byleth’s disappearance, ending the war that lasted for five years in a matter
      of months under their leadership. During Three Houses: Silver Snow Route, in
      order to capture Fort Merceus, said to be impregnable and thus could not be
      taken by a frontal assault even with the full might of the Knight of Seiros,
      the most famous order of knights in all of Fódlan, Byleth came up with the idea
      of infiltrating the fort by masquerading as Imperial forces and kill the enemy
      general. They’re considered the finest tactician in Fodlan by the time of the
      war, and even Edelgard and Hubert admits that Byleth’s tactical acumen far exceeds
      theirs, with the later even stating during their Tea-Time that their insight
      borders on precognition. However, if they get too emotional, they are prone
      to charge head-first recklessly, as shown in Three Houses: Prologue, Chapter
      10 and Non-Crimson Flower Chapter 12, and liable to falls for traps they normally
      wouldn’t, as shown in Three Hopes: Golden Wildfire Chapter 7. |-|Skill= See
      here for more information. When in comes to combat, although they have experience
      with many weapons, their preferred fighting style is swordwork, stating that
      they took naturally to the sword from the very moment they held one. Though,
      according to their Support with Felix and their first fight with Shez, they
      aren’t completely reliant on their sword and are more than willing to utilize
      anything as a weapon, such as their hands and feet, to throw their opponents
      off-guard and capitalize on it. They should be able to use the standard set
      of battle-tested tactics used by both knights and mercenaries, as they were
      taught by Jeralt, a former knight and current mercenary, which is to adapt to
      the flow of battle and decide a role depending on not only the situation but
      also who is fighting alongside them and doing what they can to see through it
      where they sometimes attack or defend, a style that is complemented by Shez
      to be versatile. Despite being a mercenary for about ten years according to
      their Support with Seteth, their combat prowess outstrip generals with Crests
      of the three countries and powerful fighters with decades or even centuries
      of combat experiences, the former with Gilbert, a Faerghus Knight who devoted
      his entire life to the path of a knight yet readily admitted that if they were
      to train, he would learn more from Byleth than vice-versa, and t'
