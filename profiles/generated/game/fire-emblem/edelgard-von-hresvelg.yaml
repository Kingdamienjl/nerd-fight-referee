      and Magic (Ranged attacks are capable of hitting opponents from the opposite
      side of the battlefield. The Crest of Flames Power can be fired at such a long
      range that Dimitri can’t perceive where it comes from and states that unless
      they know where it comes from, there is no chance of avoiding it). Can counter
      from any distance with the Ability Distant Counter. {| cla'
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (As heir of the Adrestian Empire, she is an exemplary student and
      a natural leader. At Garreg Mach Monastery, Edelgard is taught the art of warfare
      by trained professionals, one of which being Byleth Eisner, and has proven herself
      to be an accomplished warrior on the battlefield in the ways of weapons, magic
      and special skills. As the future leader of a nation, she is trained to be a
      skilled politician and an able leader, who can effectively lead battalions into
      battle and governing Adrestia when she finally becomes the Emperor. Driven by
      a desire to change society, she is willing to sacrifice anything, as she believes
      that the only means of achieving her goals is through war and sometimes underhanded
      tactics. Edelgard will use whatever it takes to achieve her goals, using some
      of her allies begrudgingly as a means to amass power and influence. Leads the
      Adrestian Empire and the Black Eagle Strike Force in a war against the Church
      of Seiros, the Kingdom of Faerghus, and the Leicester Alliance, with the war
      lasting as long as 5 years in Three Houses. Along with Shez, Dimitri, and Claude,
      she is able to defeat Epimenides' phantom soldiers of Hubert, Dedue, Hilda,
      and Byleth, and it was noted that these warriors are indistinguishable from
      the genuine version. Fought in Zahras, an unending dark abyss where the space
      around them was continuously distorted and twisted, which Epimenides expresses
      amazement that she could adapt to the surroundings so quickly. She is a capable
      dancer, having taught Dimitri at a young age and has a talent for drawing portraits.
      Given her love of Board Game—“a fun activity in which players compete using
      stones on a board”— as a gift, she is the type who enjoyed tactical thinking.
      Additionally, she likes the Monarch Studies Book, a gift particularly appreciated
      by people who take interest in the politics of Fódlan as well as an essential
      text for future kings, queens, and emperors)
    source_ids: *id002
    confidence: 0.95
