  attack_potency:
    text: 'At least Town levelScales higher than 15.64 Kilotons (The Three House Lords,
      such as Edelgard, Dimitri, and Claude, are all capable ofFire Emblem: Three
      Houses - Chapter 11: Throne of Knowledge one-shotting charactersFire Emblem:
      Three Houses - Chapter 12: To War who can survive Meteor. Ferdinand stated that
      she took down a Demonic Beast all by herselfFire Emblem: Three Houses - Byleth/Ferdinand
      C Support), higher with Awakening | At most Multi-Continent level+Downscales
      from 25.5 Exatons (Has access to Aymr and Labraunda, one of the Sacred Weapons
      which can compete with Heroes’ Relics. In Crimson Flower and Scarlet Blaze,
      she fought, defeated and killed the Immaculate One.Fire Emblem: Three Houses
      - Crimson Flower: Chapter 18: To the End of a DreamFire Emblem: Three Hopes
      - Scarlet Blaze: Final Chapter: A Path Forward Weakened and exhausted, she could
      throw a dagger hard enough to pierce Dimitri''s armor, and go deep into his
      shoulder.Fire Emblem: Three Houses - Azure Moon: Chapter 22: Oath of the Dagger
      Matches strength with Sothis-Fused Byleth, but it’s uncertain whether either
      combatants were giving it their allFire Emblem: Three Houses - Silver Snow:
      Movie: Reunion), higher with Awakening | Multi-Continent level+ (As stated in
      Hegemon Husk’s description, which reads “Edelgard, transformed by archaic methods
      into a grotesque form. She is now able to use the full and unbridled power of
      her Crests”, she has become far stronger than before. Dimitri is seen to be
      somewhat disabled after his encounter with Hegemon Edelgard in Azure Gleam,
      to the point where Shez does not trust him to walk on his own and must carry
      him to safetyFire Emblem: Three Hopes - Azure Gleam: Chapter 9: Reunion at the
      Fortress City)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: SubsonicScales to baseline Subsonic tier, Mach 0.1 travel speed (Not much
      slower than horse-mounted units. Scales to characters that can leave afterimages
      through sheer speed. Comparable to Caspar, who is stated to be faster than Rapheal,
      who can run from Garreg Monastery to Fodlan's Throat in less than a day, and
      Fodlan has a surface area equivalent to 2/3rds of the surface area of Europe),
      FTL combat speedEdelgard scales to 3.9c (Can keep up with Demonic Beasts, who
