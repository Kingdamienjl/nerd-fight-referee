- id: weaknesses-immune-to-enemy-abilities-that-attempt-to-lower-its-stats-tough-claws
  name: 'immune to enemy abilities that attempt to lower its stats. * Tough Claws:
    After Mega Evolving, Metagross'' claws are hard'
  description: 'immune to enemy abilities that attempt to lower its stats. * Tough
    Claws: After Mega Evolving, Metagross'' claws are hardened further, allowing it
    to deal even more damge in close combat. * Meteor Mash: Metagross smashes the
    target with the force of a meteor, potentially raising its attack power in the
    process. * Bullet Punch: Metagross exceeds its normal speed for an instant, throwing
    an extremely fast punch to catch the target off guard. * Zen Headbutt: Metagross
    rams into the target with a psychic headbutt enforced by its willpower, potentially
    interrupting any enemy attacks in the process. * Giga Impact: Metagross gathers
    all of its energy to ram into its target in a massive display of force to deal
    tremendous damage. However, the strain of performing this move forces it to rest
    and leaves it vulnerable. Skarmory * Sturdy: Skarmory''s sturdy constitution allows
    him to withstand any attack regardless of intensity for as long as it is in peak
    condition, leaving him with grievous injuries but with enough energy to continue
    fighting. * Spikes: Skarmory scatters caltrops and spikes around the battlefield
    to damage those who attempt to attempt to approach him. * Toxic: Skarmory administers
    a noxious poison that grows in intensity over time to gradually bring his target
    down. * Steel Wing: Skarmory slams the target with its metal wings, potentially
    increasing its defenses in the process. * Aerial Ace: Skarmory rams into the target
    with a complicated series of aerial maneuvers that is extremely difficult to dodge.
    Claydol: * Levitate: Claydol is able to hover above the ground, making it impossible
    to harm it with attacks involving the manipulation of the earth. * Reflect: Claydol
    erects a forcefield that cuts the damage taken from all physical attacks in half.
    * Light Screen: Claydol erects a forcefield that cuts the damage taken from all
    ranged attacks in half. * Extrasensory: Claydol assails the target with psychic
    power, potentially interrupting their actions. * Earth Power: Claydol forces the
    ground to erupt to earthen energy while wearing away at the target''s resistance
    to ranged attacks. Aggron: * Sturdy: Aggron''s sturdy constitution allows him
    to withstand any attack regardless of intensity for as long as it is in peak condition,
    leaving him with grievous injuries but with enough energy to continue fighting.
    * Stone Edge: Aggron causes the ground beneath the target to splinter into jagged
    shards, impaling them and targeting their vitals for critical damage. * Earthquake:
    Aggron triggers a large-scale earthquake to devastate the surrounding area. *
    Iron Tail: Aggron hardens its tail and smashes the target with it, potentially
    raising its already impressive defense in the process. * Dragon Claw: Aggron slashes
    the target with a claw charged with draconic energy. Cradily: * Suction Cups:
    Cradily roots itself into the battlefield with sticky, suction-cup like appendages,
    preventing it from being blown away or forcibly ejected from the fight. * Ancient
    Power: Cradily attacks the target with rocks infused with prehistoric power, potentially
    boosting its power, defenses, or speed in the process. * Sludge Bomb: Cradily
    flings a glob of toxic sludge at the target, potentially poisoning them in the
    process. * Giga Drain: Cradily rapidly drains the nutrients from the target''s
    body to rapidly heal its own injuries. * Confuse Ray: Cradily exposes its target
    to a strange ray that befuddles them, scrambling their rational thought and motor
    functions to potentially make them hurt themselves while trying to attack. Armaldo
    * Battle Armor: Armaldo''s shell keeps its vitals safe, preventing critical and
    decisive blows. * X-Scissor: Armaldo slashes the target with both claws in an
    X-shape. * Rock Blast: Armaldo hurls a barrage of small rocks like bullets to
    assail the target in rapid succession. * Metal Claw: Armaldo hardens his claws
    into metal before slashing the target, potentialyl raising its attack power in
    the process. * Crush Claw: Armaldo shreds the target''s defenses with its claws.
    Aerodactyl * Pressure: Aerodactyl pressures the target with his steel gaze, forcing
    the victim to use more energy than usual while utilizing their attacks. * Rock
    Slide: Aerodactyl triggers a cascade of rocks that descend upon the target, crushing
    them and potentially interrupting their actions along with destroying the landscape.
    * Thunder Fang: Aerodactyl bites the target with electrically-charged fangs. *
    Fire Fang: Aerodactyl bites the target with fire-infused fangs. * Ice Fang: Aerodactyl
    bites the target with ice-imbued fangs. ===World Tournament=== Excadrill.png|Excadrill
    Archeops.png|Archeops Metagross: *'
