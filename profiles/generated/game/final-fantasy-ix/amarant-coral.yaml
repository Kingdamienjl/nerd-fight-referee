power_scale:
  tier:
    text: '{{Low 2-C}} Name: Alduin (Also called Ald''uin, Thartaag, Ald Son of Ald).
      Known by many titles, such as The World-Eater, The Time-Eater, The Epoch-Eater,
      Firstborn of Akatosh, The Dragon God Origin: The Elder Scrolls Gender: Inapplicable.
      Referred to as male. Age: Inapplicable. Classification: Nordic Dragon God, World-Eater,
      Aspect of Aka'
    source_ids:
    - vsbattles-amarant-coral-final-fantasy-ix
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Universe level+ (Alduin is the World-Eater who brings about the End of Time
      by completely devouring the current Kalpa, destroying the very laws of reality
      as defined by the Ehlnofey and resetting Nirn back to the Dawn Era, whose end
      marks the beginning of a new Kalpa. Said to have destroyed twenty-two Jills
      with the fire of his breath. Can cause Dragon Breaks with his power. Became
      even more powerful by gorging on the souls of the dead in Sovngarde. His death
      was said to have echoed throughout all of Time by Paarthurnax, reverberating
      across all Eras of the world)
    source_ids:
    - vsbattles-amarant-coral-final-fantasy-ix
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Immeasurable (Is unbound by the concept of linear time and exists outside
      of it, living in the spaces between Kalpas. Unaffected by Dragon Breaks. Capable
      of literally flying through the currents of time, and traveling from Nirn to
      Sovngarde with sheer speed)
    source_ids:
    - vsbattles-amarant-coral-final-fantasy-ix
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Universe level+
    source_ids:
    - vsbattles-amarant-coral-final-fantasy-ix
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Infinite
    source_ids:
    - vsbattles-amarant-coral-final-fantasy-ix
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: At least Universal+ offensively (Can destroy the whole timeline of Nirn),
      up to High Hyperversal non-offensively (Can travel from Nirn to Sovngarde with
      ease)
    source_ids:
    - vsbattles-amarant-coral-final-fantasy-ix
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Unknown. As the first and most powerful dragon, Alduin is an immortal entity
      unbound by time itself, and who predated the creation of Nirn in the Dawn Era.
      As a major shard of the Dragon God Aka, and a direct aspect of Time itself,
      Alduin possesses vast cosmic knowledge over the nature of time and the universe
      as a whole. Ruled over all dragons until he was overthrown
    source_ids:
    - vsbattles-amarant-coral-final-fantasy-ix
    confidence: 0.6
    notes: auto_repair source extraction
