- id: claim-weaknesses-d7eef2c6
  section: weaknesses
  axis: weakness
  text: 'Can become extremely angry to the point of irrational action. Active Reloads require perfect
    timing to pull off. The Fabricator requires power to generate items, which it slowly gathers. He cannot
    be equipped with all of his weaponry at once. Note: Due to the massive list of weapons, Marcus can
    be equipped with, battles should specify which weapons he is using in battle. If not, it should be
    assumed he is using the Mark 3 Lancer Assault Rifle, Gnasher Shotgun, Bolo Grenades, and Snub Pistol.
    It also needs to be specified if Marcus has a Fabricator, as this can allow him to access his entire
