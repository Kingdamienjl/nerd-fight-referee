- id: claim-weaknesses-c8f74515
  section: weaknesses
  axis: weakness
  text: 'Kinetic barriers are activated based on the speed of an attack. A melee attack is not fast enough
    to set it off. In addition, the shielding afforded by kinetic barriers does not protect against extremes
    of temperature, toxins, or radiation. Notable Attacks/Techniques: *Throw: Tosses an enemy through
    the air with this biotic blast. *Lift: Cause enemies to float helplessly in the air. *Warp: Throws
    a blast of biotic energy that rips an enemy apart at a molecular level. It also prevents the targeted
    enemy from regenerating health. *Singularity: Creates a sphere of dark energy that traps and dangles
    enemies caught in its field. *Barrier: Surrounds the target with a high density mass effect shield.
    *Stasis: Stops an enemy in its tracks with a powerful mass effect field. Enemies will eventually break
    out of Stasis after taking major damage. *Warp Ammo: Blasts vulnerable opponents already lifted by
    biotics for a damage bonus, and weakens the armour of grounded targets. *Overload: Overloads electronics
    with a power surge, stunning the enemy. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    {{Scroll box| {{reflist|2}}}} {{discussions}} Category:Characters Category:Game Characters Category:Female
    Characters Category:Mass Effect Category:Gun Users Category:Super Soldiers Category:Aliens Category:Telekinesis
    Users Category:Telepaths Category:Forcefield Users Category:Energy Users Category:Gravity Users Category:Durability
    Negation Users Category:Video Game Characters Category:Matter Users Category:Weapon Masters Category:Soldiers
    Category:Martial Artists Category:Brawlers Category:Energy Projection Users Category:Hackers Category:Power
    Nullification Users Category:Electricity Users Category:Density Users Category:Paralysis Users Category:Black
    Hole Users Category:Science Fiction Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-90df4312
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Longevity, Weapon Mastery (Expert Markswoman and Grenadier),
    Hacking, Telepathy (As an Asari she is able to meld her mind with those of others in close proximity
    to her and exchange both thoughts and memories)Mass Effect Codex: Asari: Biology, Electricity Manipulation
    (Via Overload), Energy Manipulation/Mass Manipulation (Can manipulate dark energy to increase/decrease/fluctuate
    the mass of a given volume of space via mass effect fields created by her biotics), Telekinesis (Can
    move objects with her mind through mass lowering fields or root them in place with mass increasing
    fields via biotics), Energy Projection (In the form of Biotic Explosion and Warp), Forcefield Creation
    (She can enable kinetic barriers through her armour and cast biotic barriers), Paralysis Inducement
    (With Stasis), Black Hole Creation (Through Singularity), Regeneration and Durability Negation (Up
    to High, as Warp prevents regeneration on a molecular level) and Matter Manipulation (Warp rips the
    opponent apart on a molecular level)'
  source_ids: *id003
  decisive: true
  status: unverified
