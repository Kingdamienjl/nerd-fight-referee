- id: claim-weaknesses-2ca8ca25
  section: weaknesses
  axis: weakness
  text: 'Kinetic barriers are activated based on the speed of an attack. A melee attack is not fast enough
    to set it off. In addition, the shielding afforded by kinetic barriers does not protect against extremes
    of temperature, toxins, or radiation. Notes: This profile covers all of Shepard''s classes. You should
    specify what class type Shepard is on vs matches. Notable Attacks/Techniques: |-|Classes= *Soldier:
    Soldiers are pure combat specialists: no one is tougher or more suited to taking down enemies with
    barrages of gunfire. Soldiers have thorough weapons training and can use all special ammo types as
    well as grenades. High-level operatives are outfitted with ocular synaptic processors that allow them
    to focus on targets with lethal accuracy. *Engineer: Engineers are tech specialists, the most effective
    class at disabling the defense of the toughest enemies or incapacitating them to render them harmless.
    In combination with their weapons training, Engineers have the unique ability to spawn combat drones
    that can harass enemies or force them out of entrenched cover positions. *Adept: Adepts are biotic
    specialists, capable of disabling and killing enemies with raw biotic power. While they lack advanced
    combat training, they are the best at defeating enemies without firing a shot. They are outfitted
    with L5x implants that can spawn a micro-singularity, damaging enemies and pulling them into the air.
    *Infiltrator: Infiltrators are tech and combat specialists with the unique ability to cloak themselves
    from visual and technological detection. Their inventory is stocked with a wide variety of weapons,
    equipment, and powers. Infiltrators are deadly at any range, but particularly so with a sniper rifle.
    When scoping a target, superior reflexes take over, time momentarily slows down, and the Infiltrator
    finds an easy picking. *Sentinel: Sentinels are unique, bringing both tech and biotic abilities to
    the battlefield. In addition, to complete weapons training, Sentinels are equipped with an advanced
    shield that makes taking cover much less necessary and rushing their enemies much more productive.
    This armor system can also be detonated to blast nearby enemies. *Vanguard: Vanguards are feared for
    their high-risk, high-reward combat style, closing quickly on enemies and destroying them at short
    range with weapons and biotic abilities. They are outfitted with L5n implants, enabling them to perform
    a biotic charge that strikes the opponent with incredible force while bringing the Vanguard in for
    close-range combat. |-|Combat Ablities= *Adrenaline Rush: For a brief moment it slows down time around
    the player, giving a small window to line up the perfect head-shot with the sniper rifle or other
    weapons, as well as increasing the damage dealt, including melee damage.Mass Effect 2, Soldier ClassMass
    Effect 3, Soldier Class *Concussive Shot: Fires a single high-powered round that damages a target
    and can stun it for a few seconds. *Frag Grenade: Throws a frag granade. *Marksman: Increases weapon
    damage and fire rate for a short time.Mass Effect 3, Bonus Power *Carnage: Tears enemies apart with
    a vicious blast. *Overkill: Increases weapon damage and fire rate for assault rifles for a short time.Mass
    Effect 1, Soldier Class *Assassination: Increases the damage of the next sniper rifle shot.Mass Effect
    1, Infiltrator Class *Adrenaline Burst: Resets the cooldown of all powers. *Immunity: Increases damage
    resistance for a short time. *Unity/Medi-Gel: Heals and revives fallen squadmates.Mass Effect 1, MedicMass
    Effect 2Mass Effect 3 *Fortification: Fortify the strength of one''s shields as well as increases
    melee damage for a short time.Mass Effect 2, Bonus Power *Flashbang Grenade: Throw a flashbang grenade
    to stun enemies for a short time. *Inferno Grenade: Throw a fiery grenade.Mass Effect 2, Bonus Power
    *Proximity Mine: Set a ground mine to blow up enemies. *Sticky Grenade: Throws a grenade that sticks
    to enemies.Mass Effect 3, Infiltrator Class *Lift Grenade: Throws a grenade that suspends enemies
    in the air.Mass Effect 3, Sentinel Class *Cluster Grenade: Throw multiple grenades at once.Mass Effect
    3, Adept Class |-|Ammo Types= *Disruptor Ammo: Tears through kinetic shields and synthetic enemies.Mass
    Effect 2, Infiltrator Class *Incendiary Ammo: Tears through armored enemies, setting them on fire.Mass
    Effect 2, Vanguard ClassMass Effect 3, Vanguard Class *Cryo Ammo: Freezes enemies, turning them to
    ice. *Armor-Piercing Ammo: Tears through armored targets. *Shredder Ammo: Tears through organic enemies.
    *Warp Ammo: Tears through armor and forcefields. |-|Biotic'
