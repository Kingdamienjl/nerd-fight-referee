- id: claim-standard-equipment-c7d5e35f
  section: equipment
  axis: equipment
  text: 'Superhuman Physical Characteristics, Regeneration (Mid-Low), Social Influencing (Possesses great
    charisma and leadership skills. Can persuade both SarenMass Effect 1, Race Against Time: Final Battle
    and the Illusive ManMass Effect 3, Priority: Earth to fight back again their indoctrination. United
    a divided galaxy against the Reapers), Expert in Hand-to-Hand Combatant, Weapon Mastery (Expert Marksman
    and Grenadier), Perception Manipulation (Can slow down their own perception of time via Adrenaline
    Rush), Explosion Manipulation (Via Frag Grenade, Inferno Grenade, Proximity Mine and Sticky Grenade),
    Energy Projection (Via Carnage), Electricity Manipulation (Via Overload. Can also enhance their bullets
    with electricity via Disruptor Ammo), Fire Manipulation (Via Incinerate and Inferno Grenade. Can also
    enhance their ammo with fire via Incendiary Ammo), Ice Manipulation (Via Cryo Blast. Can also infuse
    their ammo with ice with Cryo Ammo), Poison Manipulation (With Neural Shock), Paralysis Inducement
    (Via Neural Shock), Hacking (Such as Decryption, Electronics, AI Hacking, Sabotage), Technology Manipulation
    (Via Damping), Healing (With Medi-Gel), Forcefield Creation (In the form of Kinetic Barriers and Tech
    Armor), Summoning (Can summon droids to fight by their side like Combat Drone, Sentry Turret, Defense
    Drone), Invisibility (Via Tactical Cloak), Illusion Creation (Can create holograms via Decoy), Absorption
    (Via Energy Drain), Damage Boost (Via Assassination, Adrenaline Rush) and Damage Reduction (Via Immunity,
    Defense Matrix and Fortification) Resistance to: Mind Manipulation (Was able to resist a direct a
    direct attempt of Indoctrination from a Reaper artefactMass Effect 2, Arrival, as well as being in
    contact with multiple other artefacts over the years without any hint of Indoctrination) |-|Biotics=Energy
    Manipulation/Mass Manipulation (Can manipulate dark energy to increase/decrease/fluctuate the mass
    of a given volume of space via mass effect fields created by their biotics), Telekinesis (Can move
    objects with their mind through mass lowering fields or root them in place with mass increasing fields
    via biotics), Energy Projection (In the Form of Biotic Explosion, Warp, Nova and Flare), Vibration
    Manipulation (Via Shockwave), Paralysis Inducement (Via Stasis), Gravity Manipulation (In the form
    of Singularity), Explosion Manipulation (With Cluster Grenades), Perception Manipulation (Heavy Charge
    can reduce their perception of time), Absorption (In the form of Energy Drain and Reave), Mind Manipulation
    (In the form of Dominate), Forcefield Creation (By creating Biotic Barriers), Regeneration and Durability
    Negation (Up to High, as Warp prevents regeneration on a molecular level) and Matter Manipulation
    (Warp rips the opponent apart on a molecular level)'
