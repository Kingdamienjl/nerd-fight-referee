    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Self-Sustenance (Type 1, 2 and 3),
        Extrasensory Perception, Aura, Presence Concealment, Invisibility, Non-Corporeal
        (Is inherently invisible and incorporeal to beings from foreign worlds, even
        to those who can perceive things such as spirits. Can create illusive copies
        of herself that are non-physical in nature. Can completely conceal her presence
        via Veil), Immortality (Type 1, 3, possibly 5 and 8; Stated that death is
        a privilege she will never know, leaving her stuck in endless solitude as
        a consequence of casting the Forbidden Spell), Resurrection/Regeneration (High-Godly;
        She bestowed upon Shadar his powers and made him into the Dark Djinn. Shadar
        in-turn would scale to Vileheart, a being born from despair and the darkness
        of the human heart, who can regenerate himself thanks to it even after being
        destroyed by conceptual attacks and beings like familiars), Empathic Manipulation
        (Should have to power to steal a piece of someone's heart, causing them to
        become broken-hearted, which puts them in a miserable state that they don't
        even know whether they're dead or alive, nor are they able to fight back or
        function properly), Invulnerability (Scaling to the Ivory Tower itself, which
        was noted by Marcassin to be invulnerable), Healing (Via Healing Touch and
        Healing Hand), Resurrection (Via Ashes of Resurrection. Can also utilize a
        regular spell in-combat that can revive her allies), Malevolence (Only as
        the White Witch), Indomitable Will, Transformation, which grants Large Size
        (Type 0; By turning into the Monster of Manna), Magic, Forcefield Creation
        (Via Nightshade), Levitation (Via Levitate), Clairvoyance (Shown to possess
        a crystal ball that allows her to peer into other worlds and tamper with them),
        Illusion Creation, Subjective Reality (Recreated multiple beings from her
