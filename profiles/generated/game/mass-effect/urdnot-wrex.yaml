- id: claim-weaknesses-81a419b8
  section: weaknesses
  axis: weakness
  text: 'Kinetic barriers are activated based on the speed of an attack. A melee attack is not fast enough
    to set it off. In addition, the shielding afforded by kinetic barriers does not protect against extremes
    of temperature, toxins, or radiation. Notable Attacks/Techniques: *Throw: Tosses an enemy through
    the air with this biotic blast. *Warp: Throws a blast of biotic energy that rips an enemy apart at
    a molecular level. It also prevents the targeted enemy from regenerating health. *Barrier: Surrounds
    the target with a high density mass effect shield. *Stasis: Stops an enemy in its tracks with a powerful
    mass effect field. Enemies will eventually break out of Stasis after taking major damage. *Immunity:
    When activated it reduces the damage Wrex takes. *Carnage: Rips a target to shreds with a vicious
    blast. *Stimulant Pack: A specially designed ops survival pack that temporarily increases survivability
    and all damage output. *Lift Grenade: Throwing this grenade into a group of enemies, sends them flying.
    ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions}} Category:Characters Category:Mass
    Effect Category:Game Characters Category:Super Soldiers Category:Psychics Category:Aliens Category:Military
    Characters Category:Male Characters Category:Forcefield Users Category:Telekinesis Users Category:Regeneration
    Users Category:Gun Users Category:Durability Negation Users Category:Matter Users Category:Weapon
    Masters Category:Martial Artists Category:Explosion Users Category:Energy Users Category:Density Users
    Category:Energy Projection Users Category:Paralysis Users Category:Power Nullification Users Category:Science
    Fiction Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-f92a9eff
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics (Krogan possess redundant nervous systems), Longevity (Krogan
    can live to be over a thousand years old, and Wrex is an exceptionally old member of his species),
    Regeneration (Low), Expert Hand-to-Hand Combatant, Weapon Mastery (Expert marksman and grenadier),
    Explosion Manipulation (With Lift Grenade), Energy Manipulation/Mass Manipulation (Can manipulate
    dark energy to increase/decrease/fluctuate the mass of a given volume of space via mass effect fields
    created by his biotics), Telekinesis (Can move objects with his mind through mass lowering fields
    or root them in place with mass increasing fields via biotics), Energy Projection (In the form of
    Biotic Explosion and Warp), Forcefield Creation (In the form of Kinetic Barriers and Biotic Barriers),
    Paralysis Inducement (Via Stasis), Regeneration and Durability Negation (Up to High, as Warp prevents
    regeneration on a molecular level) and Matter Manipulation (Warp rips the opponent apart on a molecular
    level)
  source_ids: *id003
