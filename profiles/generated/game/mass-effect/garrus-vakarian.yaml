- id: claim-weaknesses-c561f95f
  section: weaknesses
  axis: weakness
  text: 'Kinetic barriers are activated based on the speed of an attack. A melee attack is not fast enough
    to set it off. In addition, the shielding afforded by kinetic barriers does not protect against extremes
    of temperature, toxins, or radiation. Notable Attacks/Techniques: *Overload: Overloads electronics
    with a power surge, stunning the enemy. *Concussive Shot: Flattens an enemy with a precise blast at
    short or long range, effective against barriers. *Armor-Piercing Ammo: Effective against heavy-armor
    units and enables to shoot through light cover to hit enemies. *Proximity Mine: Fires this sticky
    mine into traffic. It will detonate when an enemy steps within range. ==Notable Matchups== Victories:
