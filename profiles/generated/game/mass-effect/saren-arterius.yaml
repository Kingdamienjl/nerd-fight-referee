- id: claim-weaknesses-5b81330c
  section: weaknesses
  axis: weakness
  text: 'Kinetic barriers are activated based on the speed of an attack. A melee attack
    is not fast enough to set it off. In addition, the shielding afforded by kinetic
    barriers does not protect against extremes of temperature, toxins, or radiation.
    Notable Attacks/Techniques: *Throw: Tosses an enemy through the air with a biotic
    blast. *Warp: Rips an enemy apart at a molecular level and stops the targeted
    enemy from regenerating health. *Carnage: Rips a target to shreds with a vicious
    blast. Does major collateral damage to enemies nearby. *Sabotage: Does damage
    in a 10m radius. Overheats enemy weapons, and burning them. *Shield Boost: Recharges
    the kinetic shield. ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions}}
    Category:Characters Category:Male Characters Category:Mass Effect Category:Aliens
    Category:Super Soldiers Category:Telekinesis Users Category:Gun Users Category:Primary
    Antagonists Category:Game Bosses Category:Game Characters Category:Berserkers
    Category:Hackers Category:Energy Users Category:Weapon Masters Category:Forcefield
    Users Category:Cyborgs Category:Martial Artists Category:Stealth Masters Category:Density
    Users Category:Technology Users Category:Energy Projection Users Category:Power
    Nullification Users Category:Matter Users Category:Inorganic Beings Category:Durability
    Negation Users Category:Science Fiction Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-6cb3c1d4
  section: abilities
  axis: hax
  text: Base=Superhuman Physical Characteristics, Cyborgization (Due to the control
    of the Reapers, he was being partially transforming into a husk), Expert Hand-to-Hand
    Combatant, Weapon Mastery (Expert Marksman and Grenadier), Stealth Mastery, Energy
    Manipulation/Mass Manipulation (Can manipulate dark energy to increase/decrease/fluctuate
    the mass of a given volume of space via mass effect fields created by his biotics),
    Telekinesis (Can move objects with his mind through mass lowering fields via biotics),
    Technology Manipulation (Via Sabotage), Forcefield Creation (Via Kinetic/Biotic
    Barriers), Energy Projection (Via Warp and energy blasts), Regeneration and Durability
    Negation (Up to High, as Warp prevents regeneration on a molecular level) and
    Matter Manipulation (Warp rips the opponent apart on a molecular level), Resistance
    to Telekinesis and Gravity Manipulation (Unaffected by most biotic abilities,
    like Throw and Singularity) |-|Husk
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
