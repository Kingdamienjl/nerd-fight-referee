- id: claim-weaknesses-636d4b67
  section: weaknesses
  axis: weakness
  text: 'Kinetic barriers are activated based on the speed of an attack. A melee attack is not fast enough
    to set it off. In addition, the shielding afforded by kinetic barriers does not protect against extremes
    of temperature, toxins, or radiation. Quarians have a weak immune system and are sensitive to outside
    bacteria. Notable Attacks/Techniques: *Overload: Overloads electronics with a power surge, stunning
    the enemy. *Combat Drone: Deploys an attack drone that stun and attacks targets, and draws enemy fire.
    *Defense Drone: Deploys a holographic drone to electrocute enemies within its firing range. *Energy
    Drain: Hits an enemy with an energy pulse that inflicts damage and steals barrier and shield power.
