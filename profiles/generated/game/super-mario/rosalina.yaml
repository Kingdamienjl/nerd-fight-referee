- id: claim-powers-and-abilities-2eb02c98
  section: abilities
  axis: hax
  text: 'Base= *Superhuman Physical Characteristics *Longevity (Has lived for over 100 yearsSuper Mario
    Galaxy) *Space Survival (Unaffected by the conditions of space) *Non-Standard Breathing (Type 2; Can
    stay underwater for extended periods of timeSuper Mario 3D World) * Hammerspace (Can hold various
    power-ups and items) *Aura and minor Light Manipulation (Can surround her self with a glowing aura)
    *Weapon Mastery (Skilled in the use of hammersMario Party Superstars, bows, boomerangsSuper Mario
    Party, Swords, and many more) *Acrobatics (Rosalina has shown skill in acrobatics being able to perform
    flipsMario Sports Superstars mid-airMario Kart 8 and complete challenges such as Champion''s Road)
    *Flight (Rosalina usually levitates slightlyMario Strikers: Battle League off the ground and can freely
    fly in the air) *Vehicular Mastery (Rosalina can operate a multitude of vehicles ranging from go-karts
    and bikes to tanks, Snowboards, hovercraft, Stakebords, Bobsleds, Minecarts, planes, and many more.
    Can skillfully navigate across many different environments such as numerous Rainbow Roads, which are
    narrow race tracks in space. Rosalina skilled enough to actively fend off other races while maneuvering
    around obstacles. Can perform mid-air acrobatic tricks while driving) *Toon Force and Elasticity (Can
    survive being flattened and recover immediatelyMario Party Superstars) *Magic *Telekinesis (Can telekineticallyMario
    Golf: Super Rush lift objects with her wand. Telekinetically Moved platforms in place to form a bridge)
    *Telepathy (Spoke to Mario, Peach, and Bowser from a great distance away) *Teleportation (Capable
    of teleporting from short distances to all the away to spaceMario Golf: World Tour) *Forcefield Creation
    (Made a large Forcefield around the Comet Observatory. Can make a smaller forcefield around herself
    and others) *Size Manipulation (Increased her size to be much larger than Mario) *Likely Restoration
    and Resurrection (Likely Restored the Mushroom Kingdom to its previous state and potentially revived
    Bowser) *Danmaku (Can unleash a rain of comets) *Creation (Created many platforms to form a pathway
    for Mario to walk on) *Summoning (Capable of summoning Luma''s to aid herMario Golf: Super Rush) *Afterimage
    Creation and Self-Perception Manipulation (Via Zone Speed which lets her slow her perception of timeMario
    Tennis Aces) *Attack Reflection and Status Effect Inducement (Can perform the Star Spin which reflects
    attacks and stuns foes on hit. Can reflect Star Bits Mario shoots at her) *Minor Ice Manipulation
    (Orbital Burst causes the ball to leave a trail of ice which can freeze opponents in it''s way) Resistance
    to; *Extreme Heat (As a racer in Mario Kart Wii, Rosalina can survive falling into lava without harmMario
    Kart Wii) *Fire Manipulation (As a playable character in Mario Kart Arcade GP DX, Rosalina can easily
    endure being set on fire when eating a Flaming TenderMario Kart Arcade GP DX) *Transmutation (Can
    take magic blasts from Magikoopas like normal attacks)'
