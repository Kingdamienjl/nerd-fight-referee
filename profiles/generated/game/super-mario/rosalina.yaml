- id: claim-standard-equipment-40449298
  section: equipment
  axis: equipment
  text: '*Transformation and Statistics Amplification (Via multiple power-ups) **Enhanced Statistics Amplification
    (The Super Star, Mega Mushroom, Invincibility Leaf, and Invincibility Bell all grant this due to in-game
    showings where a character becomes impervious to all types of conventional damage, and statements
    from sources) **Size Manipulation (With the Super Mushroom and Mega Mushroom) *Healing (With the Super
    Mushroom) *Fire Manipulation (With the Fire Flower which lets the user shoot fire from their hands)
    *Extended Weapon Mastery (With the Boomerang Flower, which lets the user throw unlimited boomerangs)
    *Surface Scaling and Shapeshifting (With the Super Bell and Lucky Bell, Rosalina can climb up vertical
    surfaces. The Lucky Bell in particular can allow Rosalina to transform herself into a golden lucky
    cat statue, temporarily making her invincible) *Flight (Restricted. Super Leaf (Tanooki) and Invincibility
    Leaf (Tanooki)) *Self-Resurrection (With 1-Up Mushrooms) |-|Optional'
