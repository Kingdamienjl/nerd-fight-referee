- id: claim-weaknesses-b67036e2
  section: weaknesses
  axis: weakness
  text: 'He easily panics after being attacked with a rider. Some power ups are temporary. Some of his
    powers require items to be in his mouth Notable Attacks/Techniques: *Swallow: Yoshi catches enemies
    with his long adhesive tongue and swallows them to either turn them into an egg or devours them completely.
    *Egg Throw: Yoshi will pinpoint his target and throws either his signature Yoshi Eggs to attack enemies
    or Yarn Balls to restrict them. The eggs occasionally shown to have ricocheting, explosive, and homing
    capabilities. *Mega Eggdozer: Yoshi will throw a gigantic heavy egg across large distances. It has
    an even heavier variant called Metal Eggdozer. These eggs are powerful enough to hurt Bowser in his
    giant form. *Egg Roll: Yoshi encases himself in an egg, which can be used for defense and protection,
    and rolls at his opponents at high speed. He has a variant where the egg he encases himself in is
    several times larger than his size and can bury the opponents he bulldozes. *Ground Pound: Yoshi slams
    his rear end on the ground with great force, which can cause many results such as creating shockwaves.
    *Rainbow Flutter: Yoshi will use his signature Flutter Jump technique and will either strikes the
    target or throw an object with rainbow-infused power, leaving a rainbow trail. The latter action will
    create two objects after the toss, with the second one serving as either a decoy or extra projectile.
    *Foot of Fury: Yoshi''s Super Strike. After being surrounded by yellow and green sparks and rings,
    he then kicks the target with energy. *Bubble: Yoshi will encase himself in a bubble. Being within
    the protective bubble will make him impervious to hazards and the attack of his foes. *Magic Weapon:
    Yoshi forges a weapon of pure energy in the shape of a hockey stick. It''s only seen in Mario Sport
    Mix in a fight against the Behemoth. *Zone'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
