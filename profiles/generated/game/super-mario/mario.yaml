      able to lift a giant gold statue of Peach. He's even intelligent enough to excel
      in multiple white-collar occupations such as being a physician and the CEO of
      a highly successful toy company and is also a highly capable doctor who is able
      to create his own medicine to cure diseases. Mario is an experienced fighter
      and expert combatant, battling and defeating a diversity of foes and beings
      with various magic, unnatural powers and abilities, vastly different technology,
      and multiple fighting styles. His expertise and fighting prowess even extend
      back to his earlier years, where he's fully capable of piloting vehicles, skillfully
      use various power-ups and weapons, and confront an entire alien race invading
      his planet as an infant. He also outsmarted archaeologists and scientists during
      his vacation to Pi'illo Island, solving the very mystery that left the aforementioned
      people scratching their heads and was able to beat Jynx, a master combatant,
      who was so impressed with Mario's fighting capabilities, he renamed his entire
      dojo after the plumber and made him the master. Mario has gained so much skill
      that he's capable of completing trials such as The Perfect Run, Tubular, The
      Impossible Pack, and more, where Mario's incapable of suffering so much as a
      single hit. He was even capable of navigating and completing the Forest of Illusion
      where it was stated Mario would need to use his brain to solve the most perplexing
      puzzles,Super Mario World and his multiple accomplishments have made him famous
      worldwide)
