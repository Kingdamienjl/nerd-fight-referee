  range:
    text: Standard melee physically, hundreds of meters to kilometers with magic
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (Lina dubs herself a "Magical Genius" without exaggerating, having
      created custom spells such as a fishing spell that can fish a stream to extinction
      and even the Giga Slave spell. She specializes in black magic, yet she is also
      skilled in shamanism, slightly versed in white magic, and can also hold her
      own with the short sword. Lina has an extremely high magic capacity, and she
      is able to draw upon extremely powerful spells such as the Dragon Slave and
      Giga Slave. When she acquired the Demon's Blood Talismans from Xelloss, she
      was able to increase her magical (bucket) capacity even more, giving her the
      ability to cast more powerful spells such as Ragna Blade. In addition to battle
      skills, Lina is also a master businesswoman, thanks to growing up in a family
      of merchants. Designed and built a Magic Tank powerful enough to smash through
      buildings and tank hits from Amelia and Pokota’s spells. Instantly recognized
      the enchantment used on a suit of armor, and that the expense required to cast
      it meant that its wearer had a wealthy sponsor)
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
