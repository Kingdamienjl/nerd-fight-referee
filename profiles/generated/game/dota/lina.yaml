  tier:
    text: '{{High 7-C}}, higher with Talismans, far higher with Giga Slave Name: Lina
      Inverse, The Magical Genius, Bandit Killer, Dragon Spooker Origin: Slayers Gender:
      Female Age: 15 years old in Slayers, 16 years old in Slayers NEXT, 17 years
      old in Slayers TRY, 18 years old in Slayers Revolution and Slayers Evolution-R
      Classification: Human, Sorceress'
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: Large Town level+ (Destroyed a mountain that was stated to take "an entire
      day" to walk around with a Dragon Slave. Her Dragon Slave has consistently been
      shown to have enough destructive power to wipe out vast landscapes and leave
      massive craters in the aftermath. Comparable to Pokota who blasted a town into
      a massive crater with a Dragon Slave. Conjured a large chunk of ice with Dynast
      Bras to block an attack from reincarnated Zanaffar. Zanaffar’s attacks are capable
      of destroying a castle tower), higher with Demon Blood Talismans, far higher
      with Giga Slave (A miscast Giga Slave could turn the whole world into nothingness.
      In an alternate timeline, a miscast Giga Slave was shown to destroy the world
      and entire galaxies, which suggests that it would have eventually destroyed
      the entire universe)
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Superhuman (Crossed a large field in a short time) with Massively Hypersonic
      combat speed and reactions (Dodged a lightning strike at close range. Reacted
      to Chaotic Eye's lightning attacks)
    source_ids:
    - vsbattles-lina-dota
    confidence: 0.8
    notes: auto_repair source extraction
