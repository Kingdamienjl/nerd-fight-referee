    text: Gifted. Celes is one of the only successful Magitek Knights of the Gesthahlian
      Empire, granting her greater expertise than all of her comrades except for Terra.
      A former ranking general in the Gestahlian Military, she is also proficient
      with all sorts of melee weapons, being the only other female character in the
      game to wear heavy armor and wielding several of the most powerful weapons in
      the game, preferring bladed weapons to use with her unique Runic ability. She
      is one of the most level-headed members of the party and has the most combat
      experience at the start of the story due to her background, being a successful
      and lauded general favored by the insufferably arrogant Gestahl.
