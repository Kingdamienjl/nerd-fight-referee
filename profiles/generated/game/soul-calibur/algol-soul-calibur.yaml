    Edge can cut through dimensions), Necromancy, Madness Manipulation (Type 2. Simply being in contact
    with Soul Edge's power is enough to drive one into madness. Can corrupt entire areas making it so
    that anyone who enters the area will be driven mad), Illusion Creation, Curse Manipulation, Corruption
    (Can turn those who come into contact with it into mindless Monsters, Vampires, Malfested, etc. Even
    sustaining injuries from him or any wielder of Soul Edge is enough to drive one insane as shown with
    Raphael whose body became corrupted by his wounds. Coming into contact with a malfested's blood can
    in fact infect another as shown when Amy became malfested by treating Raphael's wounds. Can bring
    forth Astral Chaos into the world in order to corrupt the entire world), Sealing (Soul Calibur can
    seal people away by crystallizing them), Purification (Type 2; Soul Calibur can purify evil), Resurrection
    (With the power of Soul Edge and Soul Calibur combined, Algol can fully resurrect himself. Soul Calibur
    is noted to have powers of resurrection as it had resurrected Siegfried from the dead after he died
    in his battle with Nightmare after the defeat of Abyss by responding to his immense willpower), Resistance
    to Mind Manipulation, Madness Manipulation (Type 3), Possession, Corruption (Completely immune to
    Soul Edge's mental and corruption abilities) and Blood Manipulation (All of his blood has been replaced
    with energy)
  source_ids: *id003
