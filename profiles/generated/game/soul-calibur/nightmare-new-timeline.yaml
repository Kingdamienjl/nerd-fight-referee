- id: claim-weaknesses-696d06e4
  section: weaknesses
  axis: weakness
  text: 'Holy Weaponry. Siegfried can attempt to break free of Nightmare''s grip if too much damage is
    taken, causing Nightmare to freeze up due to the mental struggle and become vulnerable. Notable Attacks
    and Techniques: *Dark Reconquista: Triumph: Nightmare slams his sword on top of his opponent, stabbing
    them and causing an explosion of cursed energy, Nightmare then appears out of the explosion on top
    of a dark horse made of said energy and charges towards his opponent. He then slashes the opponent
    with Soul Edge. *Soul Wave: Unleashes a burst of red energy the absorbs the souls of all those in
    range by stabbing the ground with Soul Edge. Another method shown is that Nightmare bows down, crossing
    his hands and storing energy, as we can see electric bolts gather around him. A stage starts to shake
    and by straightening up and shouting "Hate!" Nightmare releases a crimson energy sphere now accompanied
    with an additional ring of light and explosion sound.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-d0e88452
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Soul Manipulation (Can rob the souls of entire armies at
    once. Deals Soul Damage with each of attacks, stealing the soul of his opponent slowly during combat),
    Fire Manipulation, Hellfire Manipulation, Chaos Manipulation, Mind Manipulation (Can manipulate the
    minds of others in order to coerce them into taking Soul Edge. If there is a malfested target, Soul
    Edge feeds off of their sinful actions of bloodlust and gains the ability to control them), Weapon
    Mastery, Electricity Manipulation, Creation (Created a mimic of Soul Edge as well as Astral Chaos),
    Dark Magic, Regeneration (Low), Immortality (Types 1 and 6), Teleportation, Dimensional BFR (Can send
    others to Astral Chaos. All Souls taken by Soul Edge are sent to Astral Chaos. Astral Chaos warps
    and corrupts all who enter, mind, body and soul, eventually driving them mad and turning them into
    a form of Malfested), Duplication, Light Manipulation, Possession, Reality Warping, Spatial Manipulation
    (Can cut through dimensions), Necromancy, Madness Manipulation (Type 2; Simply being in contact with
    its power is enough to drive one into madness. Can corrupt entire areas making it so that anyone who
    enters the area will be driven mad), Illusion Creation, Curse Manipulation, Corruption (Can turn those
    who come into contact with it into mindless Monsters, Vampires, Malfested, etc. Even sustaining injuries
    from him or any wielder of Soul Edge is enough to drive one insane as shown with Raphael whose body
    became corrupted by his wounds. Coming into contact with a malfested's blood can in fact infect another
    as shown when Amy became malfested by treating Raphael's wounds), When the host body is defeated,
    Inferno will appear to fight the opponent or use his mental powers to get them to grab the sword,
    Enhanced Senses, Extrasensory Perception, Resistance to Sealing (Taki's seals had no effect on him).
    All previous abilities + Possession (Can possess the living and the dead), Power Mimicry (Can copy
    the fighting style of anyone it sees), Incorporeality (Is the will of Soul Edge).
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
