    the opponent in fire. *Witching Hour: Mitsurugi primes his sword while saying "Your time is up!" He
    then does an uppercut and slashes downwards, shouting "You will submit!" as he knocks down his opponent
    in an explosion of flames. Note: Many of Mitsurugi''s abilities come from the various weapons he can
    equip. As such, in battle the creator should specify what weapon(s) he is allowed to have. ==Notable
