- id: claim-weaknesses-0929a4b7
  section: weaknesses
  axis: weakness
  text: 'Kaleidoscope damages her each time she attacks or blocks. Notable Attacks and Techniques: *Grand
    Alchemy: Whips the opponent, says "Taste the power of my blade - shred apart!" and starts an alchemist
    spell to trap the opponent in a ball, splits the blade up into small pieces, and shoots them into
    the opponent. She then asks "Does it hurt?" *Acasual Paradox: Ivy grabs her opponent and, as her sword
    shatters, parts of it stick to the opponent''s body, making them levitate and fly. While in air, the
    sword pieces slash her opponent several times until the shards slam her opponent to the ground. Note:
    Many of Ivy''s abilities come from the various weapons she can equip. As such, in battle the creator
    should specify what weapon(s) she is allowed to have. ==Notable Matchups== Victories: Losses: Inconclusive:
    {{Discussions}} Category:Characters Category:Soul Calibur Category:Adults Category:Alchemists Category:Clairvoyance
    Users Category:Cursed Characters Category:Durability Negation Users Category:Energy Users Category:Female
    Characters Category:Fighting Game Characters Category:Fire Users Category:Game Characters Category:Healers
    Category:Humans Category:Illusionists Category:Immortals Category:Neutral Characters Category:Regeneration
    Users Category:Seduction Users Category:Soul Users Category:Statistics Amplification Users Category:Sword
    Users Category:Telekinesis Users Category:Tragic Characters Category:Weapon Masters Category:Whip
    Users Category:Mascots Category:Blade Users Category:Weapon Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-6a5fe339
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Telekinesis, Energy Manipulation, Fire Manipulation, Alchemy,
    Immortality (Type 1), Soul Manipulation (Can steal souls. Was able to take not only her lost soul
    but all the countless souls Cervantes had stolen all at once. Can create artificial souls that she
    can then implant into her body), Clairvoyance, Limited Illusion Creation with Mirage Blade (Appears
    as an illusion), Heals herself with each successful strike with Wiseman Mace, Limited Durability Negation
    with Dream Blade, Limited Durability Negation and heals herself each time she damages her opponent
    with Alraune, Heals herself when she damages an opponent with Black Widow, Passive Attack Amplification
    with Kogarashi, Passive Attack Amplification and Regeneration (Low) with Kaleidoscope, Resistance
    to Mind Manipulation (Despite having her blood cursed by Soul Edge, Ivy can resist having her mind
    corrupted by it) and a slight Resistance to Soul Manipulation (Was able to resist getting the last
    bit of her soul taken and can survive and fight with most of her soul being taken) | All Original
    Timeline abilities minus weapon abilities, Statistics Amplification with Soul Charge.
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
