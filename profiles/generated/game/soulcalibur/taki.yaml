- id: claim-weaknesses-a6961821
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks and Techniques: *Blades of Vanquishment: Taki says "Ougi!", kicks
    her foe, and then performs a magical ninja spell in order to duplicate herself into three. Afterwords,
    they all slash through the target, jump into the air, and become one again. Finally, Taki takes down
    the helpless opponent in one fatal strike and tells them to "Stay Down." *Vanquish Blades: At the
    beginning of this single middle Break Attack she crouches slightly and rushes forward, slashing the
    enemy horizontally with both of her blades in blue flames and colored lightning bolts. The enemy is
    thrown at quite a distance after the attack. Note: Many of Taki''s abilities come from the various
    weapons she can equip. As such, in battle the creator should specify what weapon(s) she is allowed
    to have. ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions}} Category:Characters
    Category:Soul Calibur Category:Absorption Users Category:Adults Category:Dual Wielders Category:Duplication
    Users Category:Durability Negation Users Category:Energy Users Category:Female Characters Category:Fighting
    Game Characters Category:Fire Users Category:Game Characters Category:Humans Category:Hunters Category:Martial
    Artists Category:Ninjas Category:Non-Physical Interaction Users Category:Orphans Category:Poison Users
    Category:Regeneration Users Category:Spies Category:Statistics Amplification Users Category:Status
    Effect Users Category:Sword Users Category:Teachers Category:Teleportation Users Category:Weapon Masters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-f674633c
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Teleportation, Energy Manipulation, Self Duplication(x3),
    Fire Manipulation, Sealing, Explosion Manipulation, Forcefield Creation, Regeneration (Low) via Gaea
