    after Dialga and was completely unaffected. *Immune to physical attacks due to
    being part ghost and its own intangibility. *Can fire energy beams powerful enough
    to briefly stun Dialga and Palkia and knock them backwards with sheer force of
    will. *Its portal was going to destroy both the Universe and can open such portals
    with its presence alone Notable Attacks/Techniques: *Shadow Force: Giratina can
    vanish and ambush its foes almost immediately. *Will-O-Wisp: Giratina can shoot
    a blue fireball from its mouth. *Aura Sphere: Giratina can draw from its Aura
    and fire a powerful energy sphere. *Dragon Claw: (In Origin Form) One of the foremost
    spikes on the side of its own body becomes infused with Dragon-type energy and
    Giratina charges at its opponent to violently strike with said spike. *Anti-Matter
    Manipulation: In the Distortion World, Giratina can manipulate anti-matter. Affecting
    the Distortion World will also affect the Real World. *Altered'
