- id: claim-weaknesses-ffb9bb51
  section: weaknesses
  axis: weakness
  text: 'It is weak to Water and Electric moves, even more so with Rock-type attacks. Charizard will die
    if the fire on the tip of its tail is completely extinguished, Blast Burn forces Charizard to rest
    and recuperate after its completion, leaving it vulnerable to attacks. Flare Blitz deals a significant
    amount of damage to Charizard on impact with its target, Charizard are known to be proud fighters
    to the point of overconfidence at times | As Mega Charizard X, it is only weak to Ground, Rock, and
    Dragon-type moves. As Mega Charizard Y, Drought won''t activate during the heavy rain of Primordial
    Sea or when a the mysterious air current of Delta Stream appears. | Gigantamax can only be used in
    areas with Dynamax energy (i.e. dens and stadiums), Destroying their non-move forcefield through any
    means will harm them Notable Attacks/Techniques: *Mega Punch: Charizard charges its fist with energy
    before dishing out a devastating punch. *Blast Burn: Charizard attacks with very intense flames that
    can inflict severe damage to the foes, which can kill by incineration. It may have to recharge afterward.
    *Wing'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-354249c6
  section: abilities
  axis: hax
  text: "Charmander= *Superhuman Physical Characteristics *Bodily Weaponry (Claws and fangs, used through\
    \ moves like Slash, Bite and Fire Fang) *Fire Manipulation (A Charmander's tail is constantly ablaze\
    \ since birth.Pok\xE9mon Stadium It' tail indicates Charmander's life force and burns brightly if\
    \ the Charmander is health. Can use fire-type moves such as Ember and Flamethrower) *Sound Manipulation,\
    \ Statistics Reduction, and Social Influencing (Via Growl which makes an opponent lower their attack\
    \ by cutely growling at them. Scary Face has the user frighten the target with a scary face to harshly\
    \ lower its Speed stat) *Breath Attack, Smoke Manipulation, and Paralysis Inducement (Smokescreen\
    \ releases an obscuring cloud of smoke which lowers the target's accuracy. Dragon Breath has the user\
    \ exhale with a mighty gust that inflicts damage which has a chance to leave the target with paralysis)\
    \ *Statistics Amplification (Blaze empowers fire-type moves by 50% when at 1/3 HP. Solar Power increases\
    \ the Pok\xE9mon's Special Attack by 1.5\xD7 during harsh sunlight. Moves such as Belly Drum, Swords\
    \ Dance, Dragon Dance, and Ancient Power allows the user to boost their stats) *Air Manipulation (Air\
    \ Cutter hits the target with razor-like wind) *Earth Manipulation (Rock Slide hurls large boulders\
    \ at opponents) *BFR (Dragon Tail knocks the target away forcing another Pok\xE9mon out in a trainer\
    \ battle and ending the battle against wild Pok\xE9mon) Resistance to; *Bug-type, Steel-type, Fire\
    \ Manipulation, Plant Manipulation, Ice Manipulation Fairy-type (Only takes 1/2 damage from Bug, Steel,\
    \ Fire, Grass, Ice, and Fairy-type attacks) |-|Charmeleon= All the abilities of Charmander including;\
    \ *Enhanced Fire Manipulation (When it swings its burning tail, it elevates the temperature to unbearably\
    \ high levels.Pok\xE9mon Red and Green If it becomes agitated during battle, it spouts intense flames,\
    \ incinerating its surroundingsPok\xE9mon Gold/Silver/Crystal) *Bodily Weaponry (Conventional; Noted\
    \ to have razor-sharp which it uses to destroy foesPok\xE9mon Ruby/Sapphire/Emerald/Omega Ruby/Alpha\
    \ Sapphire and tear up the fallen opponentsPok\xE9mon FireRed and LeafGreenPok\xE9mon X and Y) |-|Charizard=\
    \ All the abilities of Charmeleon including; *Enhanced Fire Manipulation and Breath Attack (Can spit\
    \ fire that's hot enough to melt boulders and cause forest firesPok\xE9mon Sword and Shield as well\
    \ as quickly melting glaciers weighing 10,000 tons. Charizard's fire breath is stated to be able to\
    \ melt any material) *Flight (Charizard can fly close to an altitude of 4,600 feet) *Darkness Manipulation\
    \ (Shadow Claw attacks the target with a a sharp claw made from shadows) *Transformation and Statistics\
    \ Amplification (While holding Charizardite X or Charizardite Y a trainer with a Key Stone can allow\
    \ Charizard to Mega Evolve which transforms the Pok\xE9mon and increases their stats) Resistance to;\
    \ *Bug-type and Plant Manipulation (Only takes 1/4 damage from Bug and Grass-type attacks) *Fighting-type\
    \ (Only takes 1/2 damage from Fighting-type moves) ===Mega Charizard X=== *Statistics Amplification\
    \ (Tough Claws boosts the power of the Pok\xE9mon's contact moves by approximately 30%) Resistance\
    \ to; *Electricity Manipulation (Only takes 1/2 damage from electric attacks) ===Mega Charizard Y===\
    \ *Greater Flight (Charizard Y boasts speed and maneuverability greater than that of a jet fighter)\
    \ *Weather Manipulation (Drought summons harsh sunlight in battle as soon as a Pok\xE9mon with Drought\
    \ enters the battle) |-|Gigantamax Charizard= All the abilities of Charizard and the abilities granted\
    \ from Gigantamaxing additionally; *Enhanced Fire Manipulation (The flame inside its body burns hotter\
    \ than 3,600 degrees Fahrenheit. When Charizard roars, that temperature climbs even higher)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
