- id: weaknesses-and-it-dives-into-the-opponent-with-great-speed-ice-beam-rayquaza-fir
  name: 'and it dives into the opponent with great speed. *Ice Beam: Rayquaza fires an icy blue beam of
    energy that can freeze th'
  description: "and it dives into the opponent with great speed. *Ice Beam: Rayquaza fires an icy blue\
    \ beam of energy that can freeze the opponent. It can also be used to create ice in general and freeze\
    \ water. *Hyper Beam: Rayquaza fires a black and purple beam of energy from its mouth. Unlike most\
    \ Pok\xE9mon Rayquaza lacks the need to recharge afterwards. *Dragon Pulse: Rayquaza fires a multicolored\
    \ beam of dragon-shaped energy at the opponent. *Draco Meteor: Rayquaza fires an orange sphere of\
    \ energy into the sky. The orb then explodes into meteors of energy that come crashing down onto the\
    \ opponent. Oddly Rayquaza does not appear to suffer the usual special attack drop the move normally\
    \ causes. *Twister: Rayquaza surrounds the opponent in a twister that can cause them to flinch. *Scary\
    \ Face: Rayquaza makes a scary face at the opponent to lower their speed. *Ancient Power: Rayquaza\
    \ manipulates nearby rocks with an ancient power and hurls them at the opponent. This may also raise\
    \ all of Rayquaza's stats. *Crunch: Rayquaza coats its fangs in a dark energy and then crunches its\
    \ opponent with them. It may also lower their defense. *Air Slash: Rayquaza fires off blades of compressed\
    \ air that have a chance of causing the opponent to flinch. *Rest: Rayquaza falls asleep and heals\
    \ itself back up to peak condition. This leaves Rayquaza asleep for a bit"
  source_ids: *id002
  source_claim_ids: []
