  attack_potency:
    text: Multiverse level+ (The Power of Kings is directly gained from Bahamut's
      power), higher with Arminger Arsenal (Capable of fighting Leviathan and significantly
      damage her), even higher with Arminger Unleashed (Empowered with the combined
      might of all of the 13 past Kings of Lucis before him, including Regis and the
      founding king Somnus, who banished Ardyn Izunia from Insomnia) | Multiverse
      level+, higher with Arminger Arsenal, even higher with Arminger Unleashed (Stronger
      than before, after being in the heart of the Crystal for ten years to gain the
      power of Providence and become the vessel for the Crystal's light. Defeated
      many other Kings of Lucis, Fought against Ifrit and managed to damage him) |
      Multiverse level+ (Far stronger than before, his power vastly exceeds that of
      the Astrals, including Shiva, who could subdue Ardyn Izunia with ease and killed
      Ifrit with her Diamond Dust attack) | Multiverse level+ (Is comparable to the
      other Warriors of Materia and draws power from the Gods of the cycle. Participated
      in the defeat of Shinryu)
    source_ids:
    - mediawiki-noctis-lucis-caelum-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively FTL+ (Scaling from Bahamut. Can keep up with his friends in training,
      who can react to his warp strike, as well as fight powerful individuals like
      Aranea, Leviathan and Titan, casually dodges lightning and light based attacks
      from beings like the Coeruls, Thunderocs and the Imps), higher with Warp Strike,
      even higher with Arminger Unleashed (Outpaced his own warp-strikes) | Massively
      FTL+ (Capable of dodging Omega's attacks, was already capable of keeping up
      with other Astrals, and now should be faster than before, managed to cut Ifrit's
      horn before he could react), higher with Warp Strike, even higher with Arminger
      Unleashed | Massively FTL+ (Even faster than before) | Massively FTL+ (Able
      to keep up with the other Warriors of Materia such as Cloud Strife)
    source_ids:
    - mediawiki-noctis-lucis-caelum-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
