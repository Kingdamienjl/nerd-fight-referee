  axis: hax
  text: 'Superhuman Physical Characteristics, Blessed (Is blessed by The Crystal, which grants her the
    abilities of the Crystal), Shapeshifting (As a demon, he can shapeshift into other beingsFinal Fantasy
    IV: The After Years Novel, chapter 3, page 169), Extrasensory Perception (Demons can sense othersFinal
    Fantasy IV: The After Years Novel, chapter 2, page 119), Acausality (Type 2 and 4; scales from the
    Demons; who can walk down the devil''s path naturally, where the concept of time doesn''t exist, and
    the past, present and future are merged as one in this realm), Possession (as a Demon, he can possess
    others), Conceptual Manipulation (Type 2), and Space-Time Manipulation (Magic is shown in the novels
    to remove concepts and warp space and time itself, like the Devil''s road, which the concept of time
    was lost,Final Fantasy IV Novel 1, chapter 5, page 199 and time and space were twisted to the pointFinal
    Fantasy IV: The After Years Novel, chapter 1, page 67 the past, present and futureFinal Fantasy IV:
    The After Years Novel, chapter 1, page 73 existed as oneFinal Fantasy IV: The After Years Novel, chapter
    3, page 147), Magic, Subjective Reality (Magic,Final Fantasy IV Novel 1, chapter 1, page 29 in its
    basest form,Final Fantasy IV Novel 1, chapter 3, page 107 is projecting one''s innerFinal Fantasy
    IV: The After Years Novel, chapter 2, page 109 mind onto realityFinal Fantasy IV: The After Years,
    and is powered by intelligence and mental strength), Non-Physical Interaction (Magic as a whole is
    shown to affect a wide variety of different beings, from intangible/immaterial beings to non corporeal
    beings, to abstract concepts like Chronodia, who''s the flow of time itselfFinal Fantasy I, to Nonexistent
    beings like Exdeath and Cloud of Darkness), Law Manipulation (Magic is stated to rewrite the natural
    order of thingsFinal Fantasy IV Novel 1, chapter 5, page 198), Limited Durability Negation, Forcefield
    Negation, and Intangibility (Magic negates conventional physical durability, barriers, and armor,
    requiring specific defense against magic which is powered by the Mind and Spirit), Power Modification
    (Including Duplication, Fusionism, Statistics Amplification, Size Manipulation, Homing Attack, Danmaku,
    Aura, Breath Attack, and Energy Manipulation; Magic users across the games have consistently shown
    the ability to manipulate the shape and properties of their own magical abilities, with even higher
    tiers of spells simply being considered stronger versions of the same basic abilityFinal Fantasy IV:
    The After Years Novel, chapter 2 page 114), Fire Manipulation, Time Manipulation (Time Travel) and
    Fate Manipulation which grants Immortality (Type 4 and 8) (The Cycle of Wrath allows its participants
    [Garland and the Four Fiends] to send each other back and forth through time allowing them to come
    back from the dead. This causes time to warp and spiral, with destiny and the future revolving around
    this Cycle of wrath.), Curse Manipulation and Transmutation (The Fiends are stated to being capable
    of cursing people and turning them into bats.), Space-Time Manipulation and Time Travel (Due to absorbing
    the power of the crystals, which are capable of warping space and time and is shown to time travel,
    was also capable of sending Garland to the past.), Fire Manipulation and Matter Manipulation (Macro-Quantum;
    Can use Fire magic, which is stated to affect the target''s electrons), Absorption (Is capable of
    absorbing the Crystal''s power), Darkness Manipulation and Perception Manipulation (Can inflict the
    darkness status ailment via various equipment, which would render the target blindFinal Fantasy V
    GBA Manual), Paralysis Inducement Resistance to Subjective Reality, Magic, Conceptual Manipulation
    (Type 2), and Space-Time Manipulation (Characters are capable of surviving and resisting magical abilities,
    Which is shown to project one''s inner mind onto reality, and as shown with the creation of the Devil''s
    road, remove entire concepts and warp space and time to where the past, present, and future exists
    as one), Law Manipulation (Resists magic, which can rewrite the natural order of things), Earth Manipulation
    (Unaffected by the Quake spell), Electricity Manipulation and Pain Manipulation (Is able to resist
    the Lightning spells, which are capable of attacking the nervesFinal Fantasy IV Volume 2 Novel, chapter
    7, page 54), Fire Manipulation, and Matter Manipulation (Macro-Quantum; Is capable of resisting Fire,
    which is capable of affecting the target''s electrons), Poison Manipulation and Corrosion Inducement
    (Can resist the Poison status effect, which is also stated to corrode the target), Darkness Manipulation
    and Perception Manipulation (Can resist the darkness status ailment via various equipment, which would
    render the target blindFinal Fantasy V GBA Manual), Petrification (Can resist the petrification status
    effect), Death Manipulation and Blood Manipulation (Can resist the Death spell, which is even stated
    to solidify the victim''s blood,F'
