    text: Gifted. As a Half-Esper, Terra is extremely adept and gifted in the use
      of magic, wielding several of the games most powerful spells and having one
      of the highest magic stats in the game. Though she is initially fearful of her
      powers and confused due to being rendered an amnesiac by the Empire's experiments,
