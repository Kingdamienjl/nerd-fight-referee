  stamina:
    text: 'Lightning''s combat prowess and stamina evolve throughout the trilogy as
      she too evolves from a mere L''Cie to becoming something more than human and
      that of deity herself: |-|Final Fantasy XIII= Superhuman: She and her allies
      fought through the city of Eden for a better part of the day. Should also be
      comparable to other L''Cie''s such as those in the world of Orience, who are
      capable of fighting for 6 days and 7 nights |-|Final Fantasy XIII-2= At least
      Superhuman, likely Infinite: It is stated that her battle with Caius Ballad
      could last for eternity if there is no clear victor |-|Lightning Returns: Final
      Fantasy XIII= Infinite: By virtue of being the divine savior imbued with Bhunivelze''s
      power, was never shown to be physically tired in spite of 13+ days of non-stop
      stress and combat. Also has three different sources of Infinite Energy: Chaos,
      Magic, and Eradia {| cla'
    source_ids:
    - vsbattles-aerith-gainsborough-classic-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Combat= *Extended Melee Range (With the Blazefire Saber and various
      gunblades; Higher with the gunblades in "Gun Mode") *Multiversal+ (With Magic;
      Magic as a whole is shown to affect omnipresent beings such as Exdeath when
      he's become one with the Void itself, which spans across the entire Final Fantasy
      Multiverse and is stated numerous times to contain an infinite number of worlds,
      can banish foes into the Void) |-|Unseen Chaos= At Least Multiversal+, likely
      Far Higher (Unseen Chaos originates from a Higher Dimension known as the "Unseen
      Realm". Where the concepts of Space and Time are nonexistent due to outright
      transcending them, along with the stories, information, and memories that makes
      up the worlds below it, and is completely inaccessible to dimensions below it
      through normal means. Only by Etro opening her "Gate" can the Unseen Realm be
      accessed. The Unseen Realm exists above the world of Valhalla. Valhalla itself
      is a world that is stated numerous times to be beyond Space & Time, and is confirmed
      to be on a different plane of existence, where all timelines are able to be
      viewed from and are referred to as "lower worlds", which includes "The Void"
      which is described as a mere "Shadow" in comparison to Valhalla. The void being
      a structure that is stated multiple times to contain and infinite number of
      universes and harbor "Extradimensional Spaces" in relation to those worlds)
    source_ids:
    - vsbattles-aerith-gainsborough-classic-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Lightning has shown to be very quick in adapting to situations and showcased
      tremendous growth throughout the events of the FFXIII trilogy. |-|Academic=
      Gifted: Lightning who was able to obtain a high ranking office in the Guardian
      Corp military, and is an expert in regards to machinery. This includes being
      capable of flying an airship, knowing how to work mechs, and is well versed
      in AMP Technology. Which by extension requires knowledge and understanding of
      phase-space interference. |-|Combatant= Extraordinary Genius: From the very
      beginning, Lightning has shown to be an incredibly skilled combatant, and is
      consistently shown to be a one woman army, capable of taking out multiple opponents
      by herself. Throughout the trilogy, Lightning has shown to evolve and adapt
      as a combatant throughout the trilogy through facing a variety of different
      opponents. Through these experiences she has consistently shown to be able to
      form strategies on the fly, develop counter measures in split second decisions,
      is capable of mastering different weapon types within seconds of acquiring them,
      and has been able to showcase feats that would ordinarily be impossible for
      one to accomplish. Such as being able to dodge attacks from foes who are able
      to read her mind. She has also shown to be able to understand "Paradoxes". Which
      is a Space-Time transcending phenomena that causes the past and future to overlap
      with one another, bringing impossibilities into existence to exist alongside
      possibilities. Which are directly compared to the Schrodinger''s cat experiment.'
    source_ids:
    - vsbattles-aerith-gainsborough-classic-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
