      value: 'Lightning has shown to be very quick in adapting to situations and showcased
        tremendous growth throughout the events of the FFXIII trilogy. |-|Academic=
        Gifted: Lightning who was able to obtain a high ranking office in the Guardian
        Corp military, and is an expert in regards to machinery. This includes being
        capable of flying an airship, knowing how to work mechs, and is well versed
        in AMP Technology. Which by extension requires knowledge and understanding
        of phase-space interference. |-|Combatant= Extraordinary Genius: From the
        very beginning, Lightning has shown to be an incredibly skilled combatant,
        and is consistently shown to be a one woman army, capable of taking out multiple
        opponents by herself. Throughout the trilogy, Lightning has shown to evolve
        and adapt as a combatant throughout the trilogy through facing a variety of
        different opponents. Through these experiences she has consistently shown
        to be able to form strategies on the fly, develop counter measures in split
        second decisions, is capable of mastering different weapon types within seconds
        of acquiring them, and has been able to showcase feats that would ordinarily
        be impossible for one to accomplish. Such as being able to dodge attacks from
        foes who are able to read her mind. She has also shown to be able to understand
        "Paradoxes". Which is a Space-Time transcending phenomena that causes the
        past and future to overlap with one another, bringing impossibilities into
        existence to exist alongside possibilities. Which are directly compared to
        the Schrodinger''s cat experiment.'
