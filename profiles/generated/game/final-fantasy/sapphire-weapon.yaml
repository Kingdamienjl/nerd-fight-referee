- id: claim-powers-and-abilities-71b76753
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics; Longevity; likely Self-Sustenance (Types 1 and 2); Large
    Size (Type 0); Flight and Levitation; Explosive Aura (Weapons can be seen engulfed in a blue energy
    and tends to result in being repelled when approaching them); Energy Manipulation, Energy Projection
    and Radiation Manipulation (the beams it fires from its mouth are concentrated radiation); Bodily
    Weaponry (Conventional; Horn). *Resistance to: Mind Manipulation, Soul Manipulation and Empathic Manipulation
    (slept in the Northern Crater, a place overflowing with Spirit Energy, presently known as Mako, for
    thousands of years, yet it seemed unaffected as it immediately flew off to carry out its mission without
    question), Deconstruction, Matter Manipulation (its body was unaffected by the Mako, despite the Lifestream
    being able to diffuse physical matter to retake the Spirit Energy of living beings) and Corruption
    (the Weapons were created to fight Jenova, who could unleash a powerful virus that mutated others
    into monsters. Mako can mutate creatures into monsters as well, yet the Weapons seemed unaffected);
    as well as Extreme Pressure (it can likely resist the conditions of the bottom of the ocean, like
    the Emerald Weapon as it''s shown traveling through the sea).'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
