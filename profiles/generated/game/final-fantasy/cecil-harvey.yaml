  section: equipment
  axis: equipment
  text: '*Dark Knight: Dark Sword, Shadowblade, and Deathbringer, which can inflict death to those struck
    by the blade. Also wields the Dark, Demon and Hades equipment, which grants holy and specific resistances
    to certain status ailments. *Paladin: A wide variety of Bows and Arrows, Axes, swords, holy weapons,
    daggers, and staffs with a wide variety of innate abilities; a vast array of different armors and
    equipment that grants enhanced resistances to elemental attacks and status ailments; and a wide collection
    of items that can boost the user, recover their abilities in a wide variety of ways, and inflict numerous
    status ailments on their targets. A Crystal'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-9474b549
  section: power_scale
  axis: battle_iq
  text: Gifted, Cecil is known as Baron's finest knight and was a terror on the battlefield with his skills
    of swordsmanship as a Dark Knight, even putting him on a higher level than the Baron knights, who
    are trained to analyze their targets in a few seconds to determine their weaknesses to take them down.
    His skills have not dulled as a Paladin, and his skills primarily revolve around defending his allies
    rather than attacking, utilizing a variety of minor White Magic and jumping into the line of fire
    to protect them. By The After Years, Cecil has become an effective and well-loved ruler amongst his
    citizens, showing that he is still an effective leader long after being relieved of command. In Dissidia
    he also shows the ability to switch between his forms as a Dark Knight and a Paladin to best suit
    the situation, manipulating light and darkness in tandem to overwhelm foes and adapt to changing battle
    conditions.
  source_ids: *id003
  decisive: false
  status: unverified
