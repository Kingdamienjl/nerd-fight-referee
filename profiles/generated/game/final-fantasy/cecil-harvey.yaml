- id: claim-weaknesses-8d1fc2cf
  section: weaknesses
  axis: weakness
  text: 'Some of his Dark Knight abilities require him to drain his health in order to use them | None
    notable Notable Attacks/Techniques: |-|Magic= *Cure: Casts a spell that heals himself of minor injuries.
    **Cura: A more powerful version of cure that heals moderate injuries. *Esuna: Removes negative status
    conditions such as poison, blinding, or paralysis on himself or allies. *Libra: Casts a spell that
    allows Cecil to view the status of the target, showing him the relative remaining fighting strength
    and their weaknesses. *Protect: Conjures a magical barrier that reduces the damage Cecil and his allies
    take from physical attacks. *Raise: Resuscitates an ally, bringing them back from the brink of death.
    *Shell: Conjures a magical barrier that reduces the damage Cecil and his allies take from magical
    attacks. *Teleport: Warps Cecil to a place of his choosing, allowing him to evade large-scale attacks.
    |-|Dark Knight= *Dark Cannon: Fires several orbs of darkness that pierce opponents and drag them into
    Cecil''s melee range. *Darkness/Soul Eater: Cecil sacrifices some of his vitality to fire a dark wave
    that strikes foes for darkness-elemental damage or temporarily double his striking strength. In Dissidia,
    Cecil repeatedly stabs his opponent before sending them flying with an orb of darkness. *Dark Flame:
    Stabs the ground to release a wave of dark fire that follows the opponent through walls and into the
    air. *Gravity Ball: Fires an orb of darkness that travels downward, sending the opponent into the
    ground at high speed by rapidly increasing gravity should the orb make contact. *Paladin Arts: Blows
    the opponent upward with an orb of darkness before switching to Paladin and using Searchlight. *Shadowbringer:
    Steps forward to slash the opponent with an upward movement, followed by a downward slash before sending
    the enemy skyward with a final upward thrust. *Soul Shift: His EX Burst in Dissidia, Cecil strikes
    his opponent as a Paladin before throwing a spear of darkness as a Dark Knight, finishing by transforming
    back into a Paladin and slicing through the target with a cross-shaped slash of light, dealing massive
    damage. |-|Paladin= *Luminous Shard: Cecil sends out a wave of light with a swing of his sword, homing
    in on the foe to deal damage on impact. *Paladin Force: Fires a projectile of light to stun the foe
    before dealing several flying slashes, finishing them by slamming them into the ground. *Saint''s
    Fall: Dives towards the opponent in a rising arc before slamming them into the floor. *Searchlight:
    Throws a magical seal that locks onto the target and fires magical projectiles. *Soul Shift: His EX
    Burst in Dissidia, Cecil strikes his opponent as a Paladin before throwing a spear of darkness as
    a Dark Knight, finishing by transforming back into a Paladin and slicing through the target with a
    cross-shaped slash of light, dealing massive damage. |-|Augments= *Item Lore: The user is capable
    of increasing the effectiveness of both healing and damaging items. *Counter: The user automatically
    counter attacks when they get hit by the enemy. *Curse: The user inflicts curse on the enemy, dropping
    their overall stats as a result. *Tsunami: Casts a giant wave of water upon the enemy that can potentially
    cause instant death. *Bluff: The user''s intelligence increases drastically, increasing their spell''s
    effectiveness. *Cry: The user starts crying and drops the enemy''s defenses by half. *Dualcast: the
    user is capable of casting two spells at once. *Bardsong: The user is capable of using the bard''s
    ability to sing, being able to use a variety of abilities, such as healing, inflicting status ailments
    on the enemy, or damaging them. *Hide: The user hides from the enemy, being undetected while capable
    of attacking from a distance with throwing items and bows. *Recall: The user casts a random spell
    that can cause random effects to the target. *Last Stand and Adrenaline: The user''s strength and
    defenses increases when their health is low. *Fast Talker: The user is capable of casting spells at
    a far shorter time than normal. *Whirlwind: The user casts wind magic upon the targets and decreases
    the target''s innate resistance to fire. *Eye Gouge: The user inflicts blind on the target, enveloping
    them in darkness and messing their optical senses. *Analyze: The user is capable of analyzing the
    target to determine their stats, strengths and weaknesses. *Upgrade: The user can mix an elemental
    attack item with their weapons, gaining their innate powers in their weapons as a result. *Inferno:
    The user casts a giant fire spell, damaging all foes in the area. *Darkne'
