    text: Above Average (Nanaki is very thoughtful and down to Earth individual, eager
      to learn new things and assimiliate new experiences and become wiser. Raised
      by the Bungah tribe, Nanaki is well informed of the importance of knowledge
      and experiences in the journey of life, which leads him to be a quick learner
