- id: claim-weaknesses-c51829be
  section: weaknesses
  axis: weakness
  text: 'She has a limited supply of mana that allows her to summon and use magic, although this is exaggerated
    in game. Feats: * Fought Kuja and defeated Necron with her party. * Defeated the Water Guardian with
    Eiko. Notable Attacks/Techniques: White Magic: *Cure, Cura and Curaga: Healing spells that cure either
    herself, the party or even the enemy if she so chooses. This also damages undead monsters. *Life:
    Can revive herself as well as one hit kill undead monsters. *Stona: Cures petrification. *Panacea:
    Cures venom and poison. *Shell: Raises her defense against magical attacks. *Protect: Raises her defense
    against physical attacks. *Mini: Allows her to transmute an enemy into a minature version of themselves,
    greatly reducing their power. *Reflect: Allows her to reflect back magical skills. *Confuse: Allows
    her to create confusion in an enemy. In this confusion, the enemy can attack allies, attack themselves
    or attack their intended target. *Berserk: Allows her to berserk her opponent. In this state, the
    enemy will only use physical attacks, albeit stronger than normal. *Silence: Allows her to nullify
    the powers of one/multiple targets. In this state, they cannot cast magic or use activated skills.
    *Float: Allows her to float above the ground, avoiding earth based damage. Eidolons: *Shiva: Deals
    ice damage to multiple enemies. *Ifrit: Deals fire damage to multiple enemies. *Ramuh: Deals lightning
    damage to multiple enemies. *Atomos: Deals partial damage to multiple enemies, often ignoring physical
    defense. Cannot ''kill'' a target. *Odin: Inflicts instant death to multiple enemies, bypassing durability.
    Can also deal wind damage if Garnet chooses via Odin''s sword ability. *Leviathan: Inflicts water
    damage to multiple enemies. This summon in particular was so powerful it was previously sealed by
    the Summoner Tribe. *Bahamut: Inflicts non-elemental damage to multiple enemies. This summon in particular
    damaged Base Kuja slightly. *Ark: Deals darkness damage to multiple enemies. This summon is capable
    of destroying the planet casually with his power, as well as being the fastest ability in the verse.
    ==Gallery== File:Garnet_Trance.png|Garnet Trance state. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters Category:Final
    Fantasy Category:Female Characters Category:Protagonists Category:Good Characters Category:Princesses
    Category:Magic Users Category:Heroes Category:Teenagers Category:Statistics Amplification Users Category:Mind
    Users Category:Resurrection Users Category:Size Users Category:Attack Reflection Users Category:Flight
    Users Category:Power Nullification Users Category:Darkness Users Category:Element Users Category:Energy
    Users Category:Final Fantasy IX Category:Queens Category:Healers Category:Information Users Category:Death
    Users Category:Non-Physical Interaction Users Category:Time Users Category:Law Users Category:Space
    Users Category:BFR Users Category:Death Users Category:Supernatural Willpower Users Category:Summoners
    Category:Sealing Users Category:Reactive Power Level Users Category:Dimensional Travel Users Category:Creation
    Users Category:Immortals Category:Matter Users Category:Soul Users Category:Radiation Users Category:Deconstruction
    Users Category:Self-Destruction Users Category:Explosion Users Category:Resurrection Users Category:Petrification
    Users Category:Duplication Users Category:Absolute Zero Users Category:Poison Users Category:Corrosion
    Users'
