  attack_potency:
    text: Multi-Solar System level (Capable of hurting Sin with his attacks, who is
      unaffected by the Gravitational Forces created as an effect of his Giga Graviton
      move. Furthermore, is considered by Lulu to have proven himself as a Guardian,
      maybe even as the best, after the final battle with Overdrive Sin, Implying
      his efforts and the efforts of at least one more Guardian were significant towards
      defeating Sin) | Multi-Solar System level (Can stalemate Wol, grew more powerful
      during his time in Palamecia Mobius Final Fantasy) | Multiverse level+ (Is comparable
      to the other Warriors of Materia and draws power from the gods of the cycle.
      Participated in the defeat of Shinryu)
    source_ids:
    - vsbattles-tidus-game-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
