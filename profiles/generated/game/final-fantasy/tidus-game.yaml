  durability:
    text: Multi-Solar System level (Can withstand the gravitational force exerted
      by Sin's Giga Graviton, however a direct impact would instantly kill him. Additionally,
      Tidus, regarded as one of the best Guardians ever, should be no less durable
      than Rikku, a Guardian of lesser note able to survive multiple Meteor spells
      and an Ultima from Trema, a character stronger than a Final Aeon-level Fiend,
      Paragon/Lord Zaon) | Multi-Solar System level | Multiverse level+
    source_ids:
