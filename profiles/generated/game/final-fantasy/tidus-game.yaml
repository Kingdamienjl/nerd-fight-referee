        ▪ Brotherhood: A sword gifted to Tidus by Wakka, originally meant for his
        brother Chappu. It comes with both the Waterstrike and Sensor abilities, adding
        water elemental damage to its attacks and analyzing an enemy''s strength,
        in addition to significantly boosting Tidus'' attack power. ▪ Caladbolg: Tidus''
        Celestial Weapon, obtained in the Calm Lands after escaping from Bevelle.
        It naturally ignores enemy defense, harming them regardless of attempts to
        increase their durability, and makes Tidus instinctively evade and counter
        attacks. ▪ Blitzball: A spherically-studded ball used in the Blitzball sport
        across Spira. Tidus primarily uses it for ranged attacks, hitting enemies
        from several dozen meters away.'
