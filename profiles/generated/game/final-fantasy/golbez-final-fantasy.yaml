  intelligence:
    text: Genius (A powerful thaumaturge, Golbez is the wielder of some of the most
      powerful spells in the game, including all of the highest-tier elemental spells
      along with the mighty Meteor. He is cold, manipulative, and pragmatic, turning
      Kain against Cecil and Rosa through mind control, but is also a charismatic
      leader to those close to him, as the Four Archiends hold him in the utmost esteem
      and Ceodore respects him after his reformation. His abilities are further expounded
      upon in Dissidia, which reveals his ability to summon the CPU and its nodes
      at will to assist him in a variety of attacks, also proving himself to be capable
      in close combat, batting away foes with swift backhands and knocking them into
      his magical attacks for maximum damage)
