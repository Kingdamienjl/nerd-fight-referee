    Inducement, Darkness Manipulation, Light Manipulation, Magma Manipulation, and Heat Manipulation;
    The crystals are generally capable of manipulating and sustaining the four elements, which are Fire,
    Water, Earth, and Wind. The crystals are capable of maintaining life and the four elements on a planetary
    scale, and can cause the world to become unlivable if they are destroyed. Marilith, when utilizing
    the power of World A''s Fire Crystal, was capable of causing volcanic eruptions, and the crystal itself
    could then calm said volcanoes. When the Fire Crystal on Planet R was destroyed, fire all over the
    world lost its heat and was snuffed out, and the fire that remained was considered cold. The Earth
    Crystal of Planet R is capable of creating Earthquakes to fight the Party. Tiamat and Kraken, were
    capable of causing storms and stopping the wind itself when utilizing the power of the World A Wind
    and Water crystals, and with them defeated, the crystals could calm the seas and cause the wind to
    start flowing once more. The Earth Crystal in World A could restore decayed land, which Lich could
    cause by utilizing the Earth Crystal''s powers. The Dark Crystals of Final Fantasy III are capable
    of connecting to the World of Darkness and causing darkness to flow out into the world. Exdeath could
    use all four Crystals of Planet R to paralyze the party with beams of electricity), Extrasensory Perception
    (Is shown being capable of sensing othersFinal Fantast IV: The After Years Novel, chapter 5, page
    243), Empathic Manipulation and Plant Manipulation (Is capable of controlling the emotions of demons
