- id: claim-weaknesses-204fa225
  section: weaknesses
  axis: weakness
  text: 'Junctioning Guardian Forces causes memory loss, has a limited stock of spells to use. Rinoa must
    be hard-pressed to use her Limit Breaks unless she has buffed herself with Aura. She has to manually
    decide between some of her resistances, although they can be changed when she wants them to. Changing
    her resistances or Junctioning an ability to her strikes locks it out from being used elsewhere (Can''t
    have Death junctioned to his attacks and resistances at the same time as an example) Notable Attacks/Techniques:
    *Draw and Stock/Cast: Rinoa can absorb the energy from an opponent to recreate their magical powers.
    She can use this absorbed energy offensively to use the same ability on an opponent, or She can Junction
    it to become resistant/immune/strengthened by it. *Junction: Able to increase her statistics via absorbing
    Guardian forces/Summons. Can grant herself resistance/immunity to effects of magic and energy she
    has absorbed from her enemies. *Guardian Forces (GFs): Guardian Forces are mystical entities that
    claim dominion over the elements. Rinoa''s superhuman abilities are a direct result of being junctioned
    to multiple Guardian Forces, which she can temporarily manifest in a battle to assist her in combat.
    - Sorcery'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-54ee21b8
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Non-Physical Interaction, Master Blaster Edge user, Flight
    (In her Angel Wing form), Magic, Explosion Manipulation (Via Angelo Cannon), Summoning, Regeneration
    (Low-Mid), Energy Blasts, Elemental Manipulation (Of the Fire, Ice, Lightning, Water Manipulation,
    Holy Manipulation, Water, Wind and Earth variety), limited Dimensional Travel/Pocket Reality Manipulation
    (Various summons can create/draw enemies into a pocket reality to attack them and transport them back
    again), limited Sealing (Can draw out and Seal enemy summons, using its power for herself), limited
    Damage Transferal (While summoning all damage taken is transferred to the GF), Poison Manipulation,
    Status Effect Inducement, Barrier Creation/Damage Reduction (Via Protect/Shell), Life Stealing (Via
    Drain and Junctioning it to her attacks), Sense Manipulation (Darkness reduces the targets vision
    drastically), Levitation, Telekinesis (Able to call down meteors), Petrification, Time Manipulation
    (In the variety of speeding herself up and slowing down her enemy) Time Stop (Via Stop), Gravity Manipulation,
    Transmutation (Via Zombie/Card ability), Invulnerability (Via Junctioning Rinoa can gain 100% resistance
    to elemental damage and statistic effects and even further to the point of where some of these abilities
    would heal her/Defend ability/Invincible Moon Limit Break), Biological Absorption (Via Devour ability),
    Power Absorption (Via Draw), Power Nullification (Via Silence/Lvl Down/Curses/Dispel), Healing, Durability
    Negation (Via Junctioning Death to her physical strikes, she can give her blows a chance to instantly
    kill the target. Meltdown/Demi), Information Analysis (Via Scan), Attack Reflection (via Reflect),
    Statistics Amplification (Can Junction Guardian Forces to increase her stats and Darkside), Statistics
    Reduction (Meltdown reduces opponents Physical/Magic defence stat to 0), Minor Mind Manipulation/Empathic
    Manipulation (Via Confuse/Berserk), Spatial Manipulation (Via Sorceress powers and Eden), Resurrection
    (Via Phoenix/Angelo Reverse), Absolute Zero (Via Shiva), BFR (Via Leviathan), | Same as before | All
    previous and Acausality (Type 2), Self-Sustenance (Type 2), Extrasensory Perception, and Dimensional
    Travel |-|Resistances= Via Junctioning, Rinoa can gain Resistances to Time Manipulation, Time Stop,
    Sleep Manipulation, Elemental Manipulation, Poison Manipulation, Durability Negation, Death Manipulation,
    Petrification, Power Nullification (To her magic and limit breaks), Status Effect Inducement, Sense
    Manipulation (Specifically sight), Curse Manipulation, Statistics Reduction (Specifically her defense),
    Necromancy/Zombification (Able to resist a spell that turns the target into a Zombie/Undead), Berserk
    Inducement, Mind Manipulation, Transmutation, and Limited BFR Resistance | Same as before | By the
    final battle the Party gains resistance to Space-Time Manipulation, Existence Erasure and Absorption
    (Can resist the process of the entire timeline being absorbed) | Same as before plus Resistance to
    Memory Manipulation, Perception Manipulation, and Void Manipulation. |-|Dissidia= {{#tag:tabber| Abilites=All
    previous abilities enhanced, Immortality (Type 8,reliant on his Crystal which let him return from
    fading from existence after Cosmos'' death) & Regeneration (Low-Godly), Summoning (Can summon various
    Eidolons from Summonstones and the World of Illusions), Willpower Manipulation (a person''s will is
    power there and enables them to do a multitude of things the stronger their willDissidia Final Fantasy
    Opera Omnia), Reactive Power Level (the greater someone''s will, the greater their powerDissidia Final
    Fantasy Opera Omnia), Law Manipulation (Beings with strong wills can overwrite the laws of the world
    and bend them to their willDissidia Final Fantasy Opera Omnia), Creation (With a powerful enough will,
    once can create various things such as phone lines, airships and even entire countries and worldsDissidia
    Final Fantasy Opera Omnia), Sealing (Can seal off large areas and people with her will, such as Cecil
    sealing himself in Castle Baron or the cast sealing Kefka inside a TorsionDissidia Final Fantasy Opera
    Omnia), Dimensional Travel (Characters can open Torsions, rifts in space-time to travel various dimensionsDissidia
    Final Fantasy Opera Omnia), and Immortality (Type 2) (Due to the crystal core of darkness''s influence
    in the hands of Ardyn, warriors will not die no matter how injured they are) {{!}}-{{!}}Resistances=Resistance
    to Mind Manipulation, Soul Manipulation (Via Zalera, the Death Serpah, who was going to absorb the
    souls of every living being on the planet), Corruption & Body Puppetry (Due to their light, Warriors
    of Materia can dispel attempts to control them), Empathic Manipulation, and Madness Manipulation (Type
    3; Resistant to the effects of the True Moon, which is capable of affecting the hearts and minds of
    all living beings on the planetFinal Fantasy IV: The After Years), Gravity Manipu'
