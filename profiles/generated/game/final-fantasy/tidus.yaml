  intelligence:
    text: Tidus is a master swordsman and shield wielder at the end of the game, comparable
      to legendary warriors and Guardians like his father Jecht and Auron. While he
      lags behind them in blocking attacks and in the use of brute force, he is far
      more agile and acrobatic, specializing in dodging attacks before dishing out
      lethal counterattacks in return with a variety of swift maneuvers. He also triumphed
      over Spira's strongest, most notably, he managed to defeat Yu Yevon and Sin
      once and for all, a feat thought impossible up to that point.
    source_ids: *id002
