- id: claim-standard-equipment-73a7fc0b
  section: equipment
  axis: equipment
  text: '▪ Longsword: Tidus'' initial weapon, given to him by Auron in the Dream Zanarkand
    as a gift from Jecht. A simple sword that he uses to fight off enemies ▪ Brotherhood:
    A sword gifted to Tidus by Wakka, originally meant for his brother Chappu. It
    comes with both the Waterstrike and Sensor abilities, adding water elemental damage
    to its attacks and analyzing an enemy''s strength, in addition to significantly
    boosting Tidus'' attack power. ▪ Caladbolg: Tidus'' Celestial Weapon, obtained
    in the Calm Lands after escaping from Bevelle. It naturally ignores enemy defense,
    harming them regardless of attempts to increase their durability, and makes Tidus
    instinctively evade and counter attacks. ▪ Blitzball: A spherically-studded ball
    used in the Blitzball sport across Spira. Tidus primarily uses it for ranged attacks,
    hitting enemies from several dozen meters away.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-fb93ddb0
  section: power_scale
  axis: battle_iq
  text: Tidus is a master swordsman and shield wielder at the end of the game, comparable
    to legendary warriors and Guardians like his father Jecht and Auron. While he
    lags behind them in blocking attacks and in the use of brute force, he is far
    more agile and acrobatic, specializing in dodging attacks before dishing out lethal
    counterattacks in return with a variety of swift maneuvers. He also triumphed
    over Spira's strongest, most notably, he managed to defeat Yu Yevon and Sin once
    and for all, a feat thought impossible up to that point.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-80f1f206
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: |-|Innate= ▪ Cheer: Tidus enhances
    his party''s attack power and durability. ▪ Hastega: Tidus accelerates time for
    his party, dramatically increasing their speed. ▪ Slowga: Tidus distorts time
    around his enemies, dramatically decreasing their speed. ▪ Delay Buster: Tidus
    strikes his enemy with an incredibly powerful blow, significantly increasing the
    time they need to take their next action. ▪ Provoke: Tidus taunts an enemy, encouraging
    them to attack him over his allies. ▪ Swordplay: Tidus'' Overdrive, a collection
    of sword techniques that he gradually develops as he uses this Overdrive repeatedly.
    * Spiral Cut: Tidus performs a series of flips and cartwheels towards his enemy,
    before leaping and slamming his sword down on them. * Slice & Dice: Tidus darts
    back and forth around his enemies, striking them six times. * Energy Rain: Tidus
    jumps off of one enemy into the air, charging energy in his sword and throwing
    it down to explode on enemies. * Blitz Ace: Tidus leaps forward and slashes at
    his enemy eight times, before using the hilt of his sword to leap into the air
    and kicking a Blitzball into his target, which explodes on impact. |-|Inherited=
    Contrary to popular belief, the party members are not limited to their sections
    of the Sphere Grid and are capable of branching into the sections of other characters.
    Key Spheres, which are strictly used for this purpose, are canonically given out
    at certain points in the story, and character-exclusive abilities like Lulu''s
    Black Magic and Kimahri''s Lancet are discussed as if they are common abilities
    and not completely restricted to the characters in question. As a result, the
    party is entirely capable of using each others'' abilities, as long as they are
    part of the Sphere Grid. Yuna''s Sphere Grid: ▪ Curaga: Tidus significantly heals
    himself or one of his allies. ▪ NulBlaze: Tidus nullifies all fire damage for
    himself and his allies for one attack. ▪ NulShock: Tidus nullifies all lightning
    damage for himself and his allies for one attack. ▪ NulTide: Tidus nullifies all
    water damage for himself and his allies for one attack. ▪ NulFrost: Tidus nullifies
    all ice damage for himself and his allies for one attack. ▪ Esuna: Tidus removes
    all negative status effects on himself or one of his allies. ▪ Life: Tidus revives
    one of his allies if they happen to die, though they are nonetheless still significantly
    injured. ▪ Full-Life: Tidus revives one of his allies at their full strength.
    ▪ Shell: Tidus enhances an ally''s magic defense, halving the damage of all spells
    directed at them. However, this is also inclusive of any healing spells. ▪ Protect:
    Tidus enhances an ally''s physical defense, halving any damage they receive from
    physical attacks. ▪ Reflect: Tidus creates a barrier around himself that automatically
    reflects any spell back at his enemy. ▪ Dispel: Tidus removes any sort of buffs
    his enemy has that would increase their power. ▪ Regen: Tidus casts a spell that
    gradually heals himself or one of his allies over a period of time. ▪ Auto-Life:
    Tidus casts a spell that ensures that, upon death, he will be automatically revived.
    Holy: Tidus calls down a massive beam of holy-elemental energy to blast his foes.
    Wakka''s Sphere Grid: ▪ Dark'
  source_ids: *id003
  decisive: false
