      than Rikku, a Guardian of lesser note able to survive multiple Meteor spells
      and an Ultima from Trema, a character stronger than a Final Aeon-level Fiend,
      Paragon/Lord Zaon) | Multi-Solar System level | Multiverse level+
    source_ids: *id002
