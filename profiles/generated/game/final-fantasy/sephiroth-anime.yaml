        the Huge Materia. The first three attack enemies with Fire, Ice and Lightning
        Elemental Spells, while the fourth one assists Sephiroth with Healing, Damage
        Reduction via Barrier Creation and by Dispelling Enhancements of his enemies),
        Non-Physical Interaction (ghosts and spectral monsters aren''t uncommon in
        the Planet), Spatial Manipulation and Portal Creation (Can cut through space
        with Masamune to create portals, doing so to enter Ifrit''s dimension and
        creating a portal to the Singularity), Resistance to Magic including Soul
        Manipulation, Information Manipulation, and Space-Time Manipulation (Can withstand
        various types of magic and spirit energy attacks), Banishment (despite falling
        into the Lifestream, Sephiroth was not taken away from the living realm),
        Mind Manipulation and Memory Manipulation (his strong will prevented prevented
        his mind from collapsing nor was eroded under the massive amounts of information
        and memories within the Lifestream), Soul Absorption and Empathic Manipulation
        (his spirit was not forcefully diffused nor reabsorbed by the Lifestream),
        Fire Manipulation (was completely unfazed by Genesis'' barrage of fire spells
        and Ifrit''s heat, later casually walked through Nibelheim as it burned down)
        |-|Final Fantasy VII= Same as before, plus Extrasensory Perception (spirits
        are freed from the boundaries of the flesh, elevating the senses to a higher
        level and sensing the true nature of things) and Clairvoyance (like the Cetra,
