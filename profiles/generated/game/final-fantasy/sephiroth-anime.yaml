        with Masamune), Life Manipulation (via Heartless Angel), as well as Healing
        and Regeneration Negation (Up to High-Low, possibly Low-Mid; Zangan mentioned
        that the wound Sephiroth inflicted on Tifa wouldn''t heal with magic), Teleportation
        and limited Levitation (likely via Jenova''s awakening abilities in him),
        Magic (via Materia to attain Elemental Manipulation of the Fire, Ice and Lightning
        variety), Barrier Creation (possibly via Materia, can create a shield to block
