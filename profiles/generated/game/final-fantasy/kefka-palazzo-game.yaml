    text: Gifted (An insane megalomaniac, Kefka believes that life is meaningless
      and thus seeks to destroy all of existence to prove it. Due to the experiments
      that twisted him into what he is today, Kefka boasts some of the most powerful
      magic in the game, including the mighty Flare, Meteor, Holy, and Ultima spells.
      He is also extremely pragmatic and manipulative, wiping out an entire kingdom
      by poisoning the water supply and twisting the events of the war led by Gestahl
