  attack_potency:
    text: At least Brown Dwarf level (Garland himself feared the power of Eidolons
      would be a threat to Terra itself, and he did this. This was proven partially
      true when Garnet and the rest of the party defeated Garland. She killed the
      Water Guardian as well fought Kuja and defeated Necron with the help of her
      party. Trance further boosts her power, she can also cast multiple summons in
      Trance), Odin and Mini ignore durability. | At least Multiverse level+ (Is comparable
      to the other Warriors of Materia and draws power from the gods of the cycle.
      Participated in the defeat of Shinryu)
    source_ids:
    - mediawiki-garnet-til-alexandros-xvii-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
