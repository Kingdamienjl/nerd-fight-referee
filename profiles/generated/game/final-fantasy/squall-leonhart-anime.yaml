  name: 'None Notable Note: Worlds in Kingdom Hearts are universes rather than planets
    like people think. Proof of this is how it'
  description: 'None Notable Note: Worlds in Kingdom Hearts are universes rather than
    planets like people think. Proof of this is how it''s been stated that you naturally
    can''t travel to different Worlds without. It has also been shown that Worlds
    are seen as stars in Traverse Town which is considered a "World between Worlds"
    which means they can''t be just planets. It has also been stated that a normal
    person can''t leave a World even if said World has advanced spaceships which are
    capable of travelling through space. Riku has stated that any two Worlds have
    different Axis of time and that every World has its own flow of time. The Grand
    Councilwoman who has been stated "oversee the universe" didn''t know what Terra
    was. ==Others== Notable Victories: Notable Losses: Inconclusive Matches: Category:Unbacked0
