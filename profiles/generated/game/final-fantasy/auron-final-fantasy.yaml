  attack_potency:
    text: Small Planet level (Capable of hurting Sin with his attacks, who is unaffected
      by the Gravitational Forces created as an effect of his Giga Graviton move.
      Furthermore, as a legendary Guardian, Auron is the most likely candidate to
      be considered a peer of Tidus at the time of the final battle with Overdrive
      Sin) | At least Multiverse level+ (Is comparable to the other Warriors of Materia
      and draws power from the gods of the cycle. Participated in the defeat of Shinryu)
      | Multiverse level (Battled Hercules to a standstill (and was winning), can
      keep up with KHII Sora and others against Hades)
