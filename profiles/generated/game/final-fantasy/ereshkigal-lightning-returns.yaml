- id: claim-weaknesses-9c3988d9
  section: weaknesses
  axis: weakness
  text: 'Its barriers will be removed once it undergoes its Awakening or if it''s staggered. Continuous
    magical barrages with stagger it and leave it vulnerable to attacks. It takes a while for it to cast
    Meteor and its variants and utters phrases that serve as a countdown and telegraph the attack but
    can cast other spells and use other attacks during the casting sequence. Notable Attacks and Techniques:
    *Awakening: Upon taking sufficient damage, Ereshkigal removes its barriers, decreasing its defenses
    but doubling his striking force and magical potency. *Barriers: Ereshkigal begins the fight with powerful
    barriers that greatly dampen the force behind an enemy''s magical and physical blows. *Blizzaga: Attacks
    the target with a freezing cold orb of energy that crystallizes foe on contact to deal heavy ice-elemental
    damage. *Bravery: Casts an enchantment that increases its strength by 40%. *Faith: Casts an enchantment
    that increases its magical potency by 40%. *Firaga: Attacks the target with a burning orb of flame
    that detonates on impact, dealing heavy fire-elemental damage. *Grand Impulse: Ereshkigal slams the
    ground with its tail, unleashing a powerful shockwave that tosses the opponent. *Meteor: Erishkigal
    is able to cast the powerful Meteor spell, dropping immense meteorites to bombard an opponent, dealing
    immense non-elemental damage. A countdown is invoked as he casts the spell through the use of the
    following phrases: "Words of power intoned...", "Gathering energy...", "Invoking Meteor..." "Meteor."
    Each successful casting increases the spell''s power, becoming Mega Meteor, Giga Meteor, Tera Meteor,
    and Exa Meteor, the last of which will instantly defeat Lightning. These spells also ignore any form
    of magical resistance. *Protect: Erishkigal creates a barrier that dampens the force behind his enemy''s
    physical blows. *Shell: Erishkigal creates a barrier that reduces the potency of enemy magical attacks.
    *Thundaga: Generates a storm of lightning bolts to bombard an enemy, dealing heavy lightning-elemental
    damage. *Trine: Bombards an opponent with triangular-shaped projectiles of magical energy.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
