    Novel, chapter 3, page 147), Holy Manipulation (In the form of Holy), Light Manipulation (Via Dia,
    Diara, and Diaja), Teleportation (Via Exit), BFR (The teleport/Warp spells are capable of banishing
    targets to the Void, which inflicts the following abilities on the victim: Existence Erasure/Void
    Manipulation, Mind Manipulation (which includes Madness Manipulation (Type 3), and Perception Manipulation),
    Space-Time Manipulation, Time Stop, and Corruption (Type 2)), Afterimage Creation (Via Blink), Healing
    (In the form of Cure, Heal, and their superior spells), Resurrection (via Life), Forcefield Creation
    (Via Protect, Shell and NulAll), Regeneration Negation (Mid-Godly) and Immortality Negation (Type
    3, 4, 7, and 9; Is capable of killing the Undeads permanently, and the Fiends despite absorbing the
    Crystal''s Essences and gaining its Regenerative and Immortality properties as a result), Invisibility
