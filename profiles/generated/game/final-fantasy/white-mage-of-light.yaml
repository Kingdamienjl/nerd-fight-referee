    and future exists as one), Law Manipulation (Resists magic, which can rewrite the natural order of
    things), Spatial Manipulation, Deconstruction, and BFR (Can withstand the attacks of Atomos, who manipulates
    space, crush enemies down to a molecular levelDissidia Final Fantasy, and can warp them into another
    dimension), Electricity Manipulation and Pain Manipulation (Is able to resist the Lightning spells,
    which are capable of attacking the nervesFinal Fantasy IV Volume 2 Novel, chapter 7, page 54), Fire
    Manipulation, Ice Manipulation, and Matter Manipulation (Macro-Quantum; Is capable of resisting these
    elements, the Fire and Ice spell in particular being capable of affecting the target''s electrons),
    Poison Manipulation and Corrosion Inducement (Can resist the Poison status effect, which is also stated
