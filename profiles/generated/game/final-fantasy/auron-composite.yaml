  intelligence:
    text: For all intents and purposes, Data-Sora is the exact likeness of his real-life
      counterpart in terms of temperament, personality, and thought patterns. While
      fully aware that he is a mere data copy, he confronts each and every challenge
      with nearly boundless cheer and retains his original’s naivety. Nevertheless,
      he also retains his original’s knack for combat, being able to use virtually
      all of his Keyblade Techniques and Magic spells, deftly using them to blast
      his way through armies of Heartless with ease. In addition, he also has a certain
      degree of puzzle-solving skills, navigating his way through Jiminy’s Journal
      and debugging it with only limited instruction from King Mickey. He is also
      in some ways even more determined and optimistic than the original Sora, completing
      his quest despite knowing that the Journal’s completion will lead to the end
      of his existence, trudging on even after his memories are erased due to the
      value he’s placed in the bonds he has with his friends (whom he no longer remembers)
      and to simply do the right thing
    source_ids:
    - vsbattles-auron-composite-final-fantasy
