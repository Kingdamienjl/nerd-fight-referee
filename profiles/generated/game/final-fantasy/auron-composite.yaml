    - field: intelligence
      value: 'Gifted (Despite being institutionalized since childhood and exhibiting
        silent and simple-minded behavior, Michael displays a high level of intelligence
        overall. In 1978, Michael orchestrated his escape from Smith''s Grove by triggering
        a mass breakout of prisoners from the transport bus. Prior to his murder spree,
        Michael had created escape plans, and also had ID’s of himself. He took notes
        on airplane schedules and acquired road maps to drive his way back to Haddonfield
        after he escaped, which was 150 miles away, despite him not having any notable
        prior driving lessons and learning them by observing how Loomis and other
        policemen drove him around from the backseat. Instantly mastered driving and
        later memorized all of Haddonfield''s roads to stalk his way around town.
        Plotted his Halloween night murder spree by stalking his victims, learning
        their whereabouts and gathering the necessary supplies to kill each of them
        with different tactics to lure them in. Usually sets up the corpses of his
        victims in a grotesque fashion so that others may find them, allowing him
        to kill them when they are in a panic. Has shown other instances of planning
        ahead, such as using a rake to jam the back door so Laurie couldn''t easily
        escape and cutting the phone line so she couldn''t call for help. He also
        has a tendency to play dead once he''s beaten down, allowing him to immediately
        retaliate when his victims lower their guard. Presumably caused the mass breakout
        during the 2018 events in order to steal a truck and drive back to Haddonfield
        where he carefully tracked and stalked Aaron and Dana in order to quietly
        kill them and retrieve his mask from their car. Discovered Laurie''s panic
        room beneath the floor by noticing light subtly shining from the bullet holes
        in the floor and predicted that Karen would have a gun trained on the spot,
        though he was fooled when she pretended to be helpless. Furthermore, Michael
        has proven to be effective in combat. He managed outmatched Laurie in a one-on-one
        confrontation, the latter of which had taken 40 years of self-defence training
        in preparation for killing Myers. Outsmarted Marion, wasting her bullets and
        left her defenseless before she was killed then redirected a woman''s hand
        using a vehicle door, causing her to shoot herself instead of Michael, with
        the latter only having a few seconds to act on this. Managed to kill an entire
        lynch mob using only a kitchen knife after taking a beating, despite his opponents
        all utilizing weapons with greater range such as baseball bats and handguns.
        Located Corey to Laurie’s residence to retrieve his stolen mask. Escaped after
        his 2018 murder spree, switching up his tracks, outsmarting the entire town
        of Haddonfield, and remained hidden despite investigation by Sheriff Scott,
        law enforcement, and the National Guard’s search of Michael, who could not
        turn up as much as a single clue, effectively outsmarting themHalloween Ends:
        The Official Movie Novelization, Page 19) Standard Tactics: Michael Myers
        is an emotionless, mute serial killer who feels no remorse when killing people
        or animals. This enables Michael to be a brutal killer and sometimes mutilates
        his victims. Michael usually uses a kitchen knife to carry out his murders,
        but he can also use other weapons he finds. Michael utilizes the element of
        surprise and his natural talent in stealth, stealthily approaching his target
        in deadly silence.'
      source_id: mediawiki-auron-composite
      provider_id: vsbattles
      authority: high
      confidence: 0.75
