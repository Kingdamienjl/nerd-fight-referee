  attack_potency:
    text: 'Small Country level (Should be comparable to his durability), far higher
      with Augments | Multi-Solar System Level (Is capable of defeating Bahamut and
      Dark Bahamut, the former is capable of creating a pocket dimension with stars
      with its summon, and is comparable to Kain, who''s able to defeat Lunar Bahamut
      by himself, who''s also capable of doing the same feat and said dimension vanishing
      when Lunar Bahamut loses and is capable of summoning Lunar Bahamut, and it''s
      stated in the lore that In order for anyone to summon, they must be stronger
      than the summon in order to control them. Is also capable of taking on Zeromus,
      who''s stated to be capable of destroying all in its wake, which would include
      the entire moon of FF4, which is shown in the novelsFinal Fantasy IV Volume
      2 Novel, chapter 11, page 243 and the actual game to have a starry sky in the
      background), far higher with Augments | At least Multi-Solar System level (Is
      able to take on and harm the Creator, The Creator merely duplicating himself
      was enough to destroy his entire moon vessel,Final Fantasy IV: The After Years
      Novel, epilogue, pg292 which is shown to have numerousFinal Fantasy IV: The
      After Years stars, nebulaes, and black holes), likely Low Multiverse level (The
      Creator was vastly superior to the Four creatures of darkness from FF3, which
      could each fight the endgame Warriors of Light in a 1v4, can also take on Gilgamesh
      and win), far higher with Augments | Multiverse level+ (Borrows powers from
      the gods of the cycle. Contributed to the defeat of the Planesgorgers and Shinryu),
      far higher with Augments. Can negate conventional durability in a wide variety
      of ways.'
    source_ids:
    - mediawiki-cecil-harvey-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Speed of Light (Is able to keep up with Yang, who's stated in the novels
      to move at the speed of light early on in the storyFinal Fantasy IV Novel 1,
      chapter 3, page 126) | FTL (Far faster than before) | Massively FTL+ (Can keep
      up with Gilgamesh) | Massively FTL+ (Can keep up with Shinryu)
    source_ids:
    - mediawiki-cecil-harvey-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
