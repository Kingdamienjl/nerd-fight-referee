  durability:
    text: Small Country level (Survived Titan's destructive power, which yields this
      much power), far higher with Augments | Multi-Solar System level (Tanked attacks
      from Zeromus, who is the manifested hatred of Zemus, far surpassing Lunarians
      like Golbez and Fusoya, could even tank blows from Bahamut and survive even
      when his guard was lowered), far higher with Augments | Multi-Solar System level,
      likely Low Multiverse level (Tanked attacks from The Creator and Gilgamesh),
      far higher with Augments | Multiverse level+, far higher with Augments, Immortality,
      Regeneration, and The Crystal's protection make him extremely difficult to kill.
    source_ids:
    - mediawiki-cecil-harvey-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (He can fight through entire gauntlets of monsters without tiring
      and regularly takes hits for his allies, even against the likes of powerful
      beings like Zeromus. He has also faced the God of Eidolons, Bahamut, gone through
      the Lunar temple to face numerous challenges against the Lunar summons, as well
      taking on an even more powerful version of Zeromus named Zeromus EG)
    source_ids:
    - mediawiki-cecil-harvey-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Multiversal+ with magic (Magic as a whole is shown
      to affect omnipresent beings such as Exdeath when he's become one with the Void
      itself, which spans across the entire Final Fantasy Multiverse, can even banish
      foes into the Void with the Warp ability)
    source_ids:
    - mediawiki-cecil-harvey-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted, Cecil is known as Baron's finest knight and was a terror on the
      battlefield with his skills of swordsmanship as a Dark Knight, even putting
      him on a higher level than the Baron knights, who are trained to analyze their
      targets in a few seconds to determine their weaknesses to take them down. His
      skills have not dulled as a Paladin, and his skills primarily revolve around
      defending his allies rather than attacking, utilizing a variety of minor White
      Magic and jumping into the line of fire to protect them. By The After Years,
      Cecil has become an effective and well-loved ruler amongst his citizens, showing
      that he is still an effective leader long after being relieved of command. In
      Dissidia he also shows the ability to switch between his forms as a Dark Knight
      and a Paladin to best suit the situation, manipulating light and darkness in
      tandem to overwhelm foes and adapt to changing battle conditions.
    source_ids:
    - mediawiki-cecil-harvey-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
