- id: claim-powers-and-abilities-bbae90a3
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics; Longevity; Self-Sustenance (Types 1 and 2); Large Size (Type
    1); Flight and Levitation; Explosive Aura (Weapons can be seen engulfed in a blue energy and tends
    to result in being repelled when approaching them); Energy Manipulation and Life Manipulation (Omega''s
    function is to take and carry the Lifestream to another world once the Planet is about to meet its
    end); likely Weapon Creation and Energy Projection (the inside of his body is guarded by several devices
    and machines that attack intruders with projectiles and energy beams. It''s likely that Omega Weiss''
    abilities are thanks to Omega itself). Resistance to: Mind Manipulation, Empathic Manipulation, Soul
    Manipulation, Soul Absorption, Empathic Manipulation, Memory Manipulation, Deconstruction, Matter
    Manipulation and Biological Absorption (as a creature born from pure Lifestream and meant to take
    and transport it to another world, Omega resists its negative effects, which affect body and mind)
    and Corruption (the Weapons were created as a countermeasure against Jenova, who could unleash a powerful
    virus that mutated others into monsters. Omega meant to transport the Lifestream resists its effect
    to mutate creatures into monsters); Extreme Cold, Cosmic Radiations and Gravity Manipulation (given
    that Omega''s mission is to search for a new planet, he should resist the conditions of outer space).'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
