- id: claim-standard-equipment-a5f2f692
  section: equipment
  axis: equipment
  text: 'DoC Protomateria.jpg|The Protomateria Protomateria Artwork.png|Design of the Protomateria by
    Tetsuya Nomura *The Protomateria: A special Materia found by Grimoire Valentine, father of Vincent
    Valentine, in a place with stagnated Lifestream, source of Chaos. Having anti-matter like properties,
    this Materia is believed to have been created by the Planet itself as a failsafe to keep control over
    Chaos and thus, prevent Omega untimely awakening, so they would not try to carry out their purpose
    before the due time and lead to a premature end.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
