      Safer Sephiroth. Controls the Knights of the Round) | Massively FTL+ (Far more
      powerful than before. Even when suffering from Geostigma,Final Fantasy VII:
      10th Anniversary Ultimania (2007) Cloud could keep up with the three Remnants
      of Sephiroth at once before being defeated, among whom Loz had an acceleration
      ability that allowed him to blitz TifaFinal Fantasy VII: Advent Children (2005)
      in a previous encounter, and Kadaj is stated to beFinal Fantasy VII: Advent
