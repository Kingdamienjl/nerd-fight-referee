    - field: intelligence
      value: Gifted (From the very beginning, even as an infantryman, Cloud displayed
        immense skill and natural talent for swordsmanship and battle. This, furthered
        by his military training and the memories inherited from Zack, led Cloud to
        have full grasp of every aspect of combat and strategy; including Magic, the
        use of Materia, Limit Breaks, and measures for Elemental Attributes and Ailments,
        among many other aspects, to the point, that by very early in the story, he
        could already easily defeat actual SOLDIER members. His knowledge became considerably
        more extensive thanks to his travels and encounters with more dangerous and
        powerful enemies, to the point he eventually branched from emulating Zack's
        fighting style into creating his own with the Fusion Sword, which includes
        expert use, in several different ways, of its various blades of different
        shapes and sizes. This eventually continued even after the events of the original
        game, with his delivery service requiring him to keep facing monsters and
        other dangers during the two years before his battles in Advent Children)
      source_id: vsbattles-barret-wallace-composite-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Cloud must be pressed in a battle to use his Limit Breaks, so most of
        the time he can''t use them right away or in succession. After the events
        of Final Fantasy VII, he has become moody and depressed over his failure to
        protect Aerith, Zack''s sacrifice to protect him and being unable to help
        Denzel''s fatal condition, Geostigma. Along with this poor disposition, the
        presence of Jenova Cells in his body led him to contract the disease himself
        and his performance in combat suffered noticeably as a result. However, having
        coming to terms with his failures and letting go of his burdens by the end,
        as well as being healed of the Geostigma, his strength and will to fight are
        back and stronger than ever. Feats: Show/Hide ===Strength=== *Went right through
        a very large piece of concrete. *Cut large debris in half from his motocycle.
        *Sliced large part of buildings into pieces. *Attacked Sephiroth hard enough
        to indent the metal they are standing on when he blocks. *Pushed Sephiroth
        through multiple floors of a building. *Threw Sephiroth after being stabbed
        hard enough to break machinery on the wall. *FF7 version *Jumped very far.'
      source_id: vsbattles-barret-wallace-composite-final-fantasy
      provider_id: vsbattles
      authority: high
      confidence: 0.75
