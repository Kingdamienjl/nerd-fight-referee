    5, page 270 numerous times to be a nuclear powerFinal Fantasy IV: The After Years
    Novel, chapter 5, page 271), Attack Reflection (via Carbuncle), Poison Manipulation
    and Corrosion Inducement (The Poison status effect, which is also stated to corrode
    the targetFinal Fantasy IV Series Guidebook), Darkness Manipulation and Perception
    Manipulation (The darkness status ailment via various equipment, which would render
    the target blindFinal Fantasy V GBA Manual), Power Nullification (The Silence
    status, which would render the target''s ability to use magic null), and'
