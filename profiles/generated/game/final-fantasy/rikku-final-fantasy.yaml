  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, Magic, Non-Physical Interaction (Able to kill
    the lingering Ghosts in the Cavern of the Stolen Fayth and the Wraiths found Inside Sin), Statistics
    Amplification (Via Cheer, Aim, Focus, Reflex, Protect and Shell), Time Manipulation (Can accelerate
    herself or slow down enemies in time with Hastega and Slowga), Energy Projection (Via Flare), Healing,
    Damage Negation (Via NulBlaze, NulShock, NulTide and NulFrost), Purification (Type 3 via Esuna and
    various items), Resurrection (Via Life, Full-Life and Auto-Life), Attack Reflection (Via Reflect),
    Power Nullification (Via Dispel and Silence Attack/Buster), Regeneration (Mid-Low via Regen), Holy
    Manipulation, Darkness Manipulation (Via Dark Attack/Buster), Sleep Manipulation (Via Sleep Attack/Buster),
    Absorption (Via Drain, Osmose and Eater abilities), Fire Manipulation, Ice Manipulation, Electricity
    Manipulation, Water Manipulation, Poison Manipulation (Via Bio), Gravity Manipulation (Via Demi),
    Death Manipulation (Via Death), Information Analysis (Via Scan and Sensor), Probability Manipulation
    (Via Jinx and Luck), Statistics Reduction (Via Break abilities), Radiation Manipulation, Damage Reduction
    (Via Sentinel), Fear Manipulation (Via Threaten), Necromancy and Transmutation (Via Zombie Attack),
    Social Influencing (Can bribe mindless monsters to leave battle), Power Mimicry (Via Copycat), Durability
    Negation (Via Piercing, Godhand, Ultima, and Demi), Enhanced Senses and Stealth Mastery (Via Initiative),
    Petrification (Via Stonestrike), Curse Manipulation and Death Manipulation (Via Candles of Life),
    Resistance to Fire Manipulation, Ice Manipulation, Electricity Manipulation, Water Manipulation, Darkness
    Manipulation, Power Nullification, Sleep Manipulation, Poison Manipulation, Petrification, Death Manipulation,
    Necromancy, Transmutation, Mind Manipulation, Empathic Manipulation, Time Manipulation (In the form
    of Time Slow and Stop), Absolute Zero (Can withstand Shiva's presence and attack), Radiation Manipulation
    Curse Manipulation, and Memory Manipulation (Can challenge Sin head-on without being impeded by its
    toxin) All previous abilities, Weapon Mastery, Martial Arts via her Berserker Dressphere, Telekinesis,
    Teleportation Via the Psychic Dressphere, Summoning Via Dark Knight, Lady Luck, Trainer, and Machina
    Maw Dresspheres (Can summon Meteors, Animals, Fiends, and a Machina to assist respectively), Power
    Nullification Via the Samurai Dressphere (Fingersnap reverts enemy buffs back to normal), Damage Boost,
    Empathic Manipulation, Mind Manipulation, Gravity Absorption Via the Psychic Dressphere (Gravity Eater
    absorbs Gravity based attacks), Durability Negation, Power Mimicry Via the Gun Mage Dressphere (Can
    learn enemy skills after being hit by them), Can bypass Attack Reflection, BFR Via the Mascot Dressphere
    (PuPu Platter ejects enemies from battle), Darkness Manipulation Via the Dark Knight dressphere (Darkness
    sacrifices HP to damage enemies with a wave of Darkness), Curse Manipulation Via Doom (Doom makes
    a counter appear over a targets head and kills them when it reaches zero), Paralysis Inducement Via
    the Thief Dressphere and Resistance to Paralysis Inducement
