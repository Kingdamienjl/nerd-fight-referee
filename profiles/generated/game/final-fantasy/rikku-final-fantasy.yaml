- id: claim-standard-equipment-94a1be50
  section: equipment
  axis: equipment
  text: 'Her Gauntlet, Godhand, various items | Dresspheres and various items. * Claw: Rikku''s initial
    weapon, a simple gauntlet used to defend herself. * Godhand: Rikku''s Celestial Weapon, found in a
    secret passage in Mushroom Rock Road. It naturally ignores enemy defense, harming them regardless
    of attempts to increase their durability. * Dresspheres: Spheres imbued with powers and the souls
    of others for Rikku to utilize, these speheres are capable to be swapped with instantly allowing for
    a wide range of versatility.'
