      to Bahamut Fury''s casual defeatCrisis Core -Final Fantasy VII- (2007), and whose death caused a
      major upset in the Planet''s ecosystem. The Jade Weapon proved to be a bigger threat than the Zirconiade,
      capable of defeating and imprisoning the Turks and needing collaborative effort from all of the
      them to wear down and eventually defeat. Weapons compare to Minerva, whom is explicitly statedCrisis
      Core -Final Fantasy VII- (2007) to be stronger than Summons altogether. When Jenova began her massacre
      of the Cetra the Planet deemed necessary to createFinal Fantasy VII (1997) the 8 Weapons to stop
      her, even if they didn''t fight in the end, which also signifies that Minerva herself wasn''t enough
      to defeat Jenova), likely Multiverse level+ (Weapons were presented as major threats to Cloud and
      his allies and, despite being defeated, fought them. Cloud had since become far stronger since fighting
      in Ramza Beoulve''s army during his stay in Ivalice, as an equal to Balthier and Luso Clemens, the
      former whom had defeated Gilgamesh twice alongside Vaan, and the latter who had teamed up with Vaan
