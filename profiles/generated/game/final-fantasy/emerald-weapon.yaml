- id: claim-powers-and-abilities-7232ebad
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics; Large Size (Type 1); Longevity; likely Self-Sustenance
    (types 1 and 2); Flight; Enhanced Senses (can fight with no problem at the bottom of the ocean); Explosive
    Aura (Weapons can be seen engulfed in a blue energy and tends to result in being repelled when approaching
    them); Regeneration (High-Low); Flight; Energy Projection (via Emerald Beam and Emerald Shoot); Power
    Nullification (Emerald Shoot disables all Barriers and Defensive effects, Emerald Beam disables non-innate
    Regenerative effects, Revenge Stamp disables Time Acceleration and Aire Tam Storm disables all the
    previously mentioned, plus Time Slowdown and Time Stop); Light Manipulation (via both variants of
    Emerald Laser) and Energy Depletion (via the Yellow Eye variant of Emerald Laser); Bodily Weaponry
    (Unconventional; Spikes) *Resistance to: Mind Manipulation, Soul Manipulation and Empathic Manipulation
    (slept in the Northern Crater, a place overflowing with Spirit Energy, presently known as Mako, for
    thousands of years, yet it seemed unaffected as it immediately flew off to carry out its mission without
    question), Deconstruction, Matter Manipulation (its body was unaffected by the Mako, despite the Lifestream
    being able to diffuse physical matter to retake the Spirit Energy of living beings) and Corruption
    (the Weapons were created to fight Jenova, who could unleash a powerful virus that mutated others
    into monsters. Mako can mutate creatures into monsters as well, yet the Weapons seemed unaffected);
    as well as Elemental Manipulation (of the Absolute Zero Ice, Water, Earth and Gravity variety) and
    Extreme Pressure (can resist the conditions of the bottom of the ocean).'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
