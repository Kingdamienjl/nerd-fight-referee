- id: claim-powers-and-abilities-03ecf79a
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Blessed (Is blessed by The Crystal, which grants him the
    abilities of the Crystal), Self-Sustenance (Type 1: Can breathe underwater via Oxyale), Acausality
    (Type 1; Was unaffected by the time paradox he made when stopping the timeloop Chaos made in the past),
    Master Swordsman, Magic, Subjective Reality (Magic,Final Fantasy IV Novel 1, chapter 1, page 29 in
    its basest form,Final Fantasy IV Novel 1, chapter 3, page 107 is projecting one''s innerFinal Fantasy
    IV: The After Years Novel, chapter 2, page 109 mind onto realityFinal Fantasy IV: The After Years,
    and is powered by intelligence and mental strength), Non-Physical Interaction (Magic as a whole is
    shown to affect a wide variety of different beings, from intangible/immaterial beings to non corporeal
    beings, to abstract concepts like Chronodia, who''s the flow of time itselfFinal Fantasy I, to Nonexistent
    beings like Exdeath and Cloud of Darkness), Law Manipulation (Magic is stated to rewrite the natural
    order of thingsFinal Fantasy IV Novel 1, chapter 5, page 198), Power Modification (Including Duplication,
    Fusionism, Statistics Amplification, Size Manipulation, Homing Attack, Danmaku, Aura, Breath Attack,
    and Energy Manipulation; Magic users across the games have consistently shown the ability to manipulate
    the shape and properties of their own magical abilities, with even higher tiers of spells simply being
    considered stronger versions of the same basic abilityFinal Fantasy IV: The After Years Novel, chapter
    2 page 114), Conceptual Manipulation (Type 2), and Space-Time Manipulation (Magic is shown in the
    novels to remove concepts and warp space and time itself, like the Devil''s road, which the concept
    of time was lost,Final Fantasy IV Novel 1, chapter 5, page 199 and time and space were twisted to
    the pointFinal Fantasy IV: The After Years Novel, chapter 1, page 67 the past, present and futureFinal
    Fantasy IV: The After Years Novel, chapter 1, page 73 existed as oneFinal Fantasy IV: The After Years
    Novel, chapter 3, page 147) Fire Manipulation, Ice Manipulation and Matter Manipulation (Macro-Quantum;
    Can use different levels of Fire and Ice magic. Both Fire and Ice related abilities are stated to
    affect the target''s electrons, being able to even negate durability in the process), Electricity
    Manipulation and Pain Manipulation (via Thunder spells, which are capable of attacking the nervesFinal
    Fantasy IV Volume 2 Novel, chapter 7, page 54), Sleep Manipulation and Biological Manipulation (via
    Sleep, which can affect the target''s cerebral cortex), Poison Manipulation, Disease Manipulation,
    and Corrosion Inducement (Can inflict Poison with Poison and Bio, the former is stated to corrode
    the target, and the latter inflicts the target with a disease), Darkness Manipulation and Perception
    Manipulation (Can resist the darkness status ailment via various equipment, which would render the
    target blind), Teleportation (Via Exit and Teleport), BFR (The teleport/Warp spells are capable of
    banishing targets to the Void, which inflicts the following abilities on the victim: Existence Erasure/Void
    Manipulation, Mind Manipulation (which includes Madness Manipulation (Type 3), and Perception Manipulation),
    Space-Time Manipulation, Time Stop, and Corruption (Type 2)), Time Manipulation (In the variety of
    speeding himself/his allies up via Haste and slowing opponents via Slow), Healing (via Cure), Resurrection
    (via Life), Forcefield Creation (Via Protect and NulDeath), Power Nullification (via Silence), Invisibility
    (Via Invis, can also make allies invisible via Invisira), Sleep Manipulation and Mind Manipulation
    (Via Sleep and Confuse), Status Effect Inducement (via Blind), Regeneration Negation (Mid-Godly) and
    Immortality Negation (Type 3, 4, 7, and 9; Is capable of killing the Undeads permanently, and the
    Fiends despite absorbing the Crystal''s Essences and gaining its Regenerative and Immortality properties
    as a result), Paralysis Inducement (via Hold), Statistics Amplification (via Temper), Statistics Reduction
    (via Focus and Focara), Soul Manipulation (Is capable of interacting with and killing souls), Space-Time
    Manipulation and Time Travel (the 4 crystals are capable of warping space and time, as well as being
    able to send someone back in time) Resistant to the Following: Subjective Reality, Magic, Conceptual
    Manipulation (Type 2), and Space-Time Manipulation (Characters are capable of surviving and resisting
    magical abilities, Which is shown to project one''s inner mind onto reality, and as shown with the
    creation of the Devil''s road, remove entire concepts and warp space and time to where the past, present,
    and future exists as one), Law Manipulation (Resists magic, which can rewrite the natural order of
    things), Spatial Manipulation, Deconstruction, and BFR (Can withstand the attacks of Atomos, who manipulates
    space, crush enemies down to a molecular levelDissidia Final Fantasy, and can warp them into another
    dimension), Electric'
  source_ids: *id003
  decisive: true
  status: unverified
