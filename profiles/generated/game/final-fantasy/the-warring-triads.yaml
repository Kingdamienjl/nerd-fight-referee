- id: claim-powers-and-abilities-d71e7698
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Immortality (Type 2, 3, and 7; Scales from other Espers,
    who can live despite being drained of their life energy, can regenerate their body from their Magicites,
    and can live on despite being dead as a Magicite), Regeneration (Mid-Godly; Scales to Gilgamesh, who
    is an Esper and has reformed his body after all of magic was erased from existence upon Kefka''s death),
    Shapeshifting (Espers are stated to take many shapes), Extrasensory Perception (Espers can sense others),
    Magic, Conceptual Manipulation (Type 2), and Space-Time Manipulation (Magic is shown in the novels
    to remove concepts and warp space and time itself, like the Devil''s road, which the concept of time
    was lost,Final Fantasy IV Novel 1, chapter 5, page 199 and time and space were twisted to the pointFinal
    Fantasy IV: The After Years Novel, chapter 1, page 67 the past, present and futureFinal Fantasy IV:
    The After Years Novel, chapter 1, page 73 existed as oneFinal Fantasy IV: The After Years Novel, chapter
    3, page 147), Law Manipulation (Magic is stated to rewrite the natural order of thingsFinal Fantasy
    IV Novel 1, chapter 5, page 198), Subjective Reality (Magic,Final Fantasy IV Novel 1, chapter 1, page
    29 in its basest form,Final Fantasy IV Novel 1, chapter 3, page 107 is projecting one''s innerFinal
    Fantasy IV: The After Years Novel, chapter 2, page 109 mind onto realityFinal Fantasy IV: The After
    Years, and is powered by intelligence and mental strength), Power Modification (Including Duplication,
    Fusionism, Statistics Amplification, Size Manipulation, Homing Attack, Danmaku, Aura, Breath Attack,
    and Energy Manipulation, Magic users across the games have consistently shown the ability to manipulate
    the shape and properties of their own magical abilities, with even higher tiers of spells simply being
    considered stronger versions of the same basic ability), Non-Physical Interaction (Magic as a whole
    is shown to affect a wide variety of different beings, from intangible/immaterial beings to non corporeal
    beings, to abstract concepts like Chronodia, who''s the flow of time itself Final Fantasy I, to Nonexistent
    beings like Exdeath and Cloud of Darkness), Air Manipulation (via Aero), Fire Manipulation, Ice Manipulation
    and Matter Manipulation (Sub-Atomic; Both Fire and Ice related abilities are stated to affect the
    target''s electronsFinal Fantasy IV Settings Guidebook, being able to even negate durability in the
    process), Flight, Telekinesis (via Meteor and Quasar), Body Control (via Reverse Polarity and Overture),
    Electricity Manipulation and Pain Manipulation (Lightning abilities are capable of attacking the nervesFinal
    Fantasy IV Volume 2 Novel, chapter 7, page 54), Energy Projection (via Wave cannon), Forcefield Creation,
    Absorption (Is stated and shown to absorb magicFinal Fantasy 6), Telekinesis, Time Stop (via Stop),
    Absolute Zero, Forcefield Creation, Madness Manipulation (Type 2) and Morality Manipulation (Can inflict
    targets with the Confuse status ailment, driving the target insane and attack anyone, even their allies),
    Can reflect magic back at the attacker, Afterimage Creation, Water Manipulation (via Flash Rain),
    Mind Manipulation, Necromancy (via Cloudy Heaven), Death Manipulation (via Blaster), Sleep Manipulation
    and Biological Manipulation (The sleep spell can affect the target''s cerebral cortex), As the Espers
    were created and their powers stem from the warring triads themselves, they gain the following'
  source_ids: *id003
  decisive: true
  status: unverified
