- id: claim-standard-equipment-107c534c
  section: equipment
  axis: equipment
  text: 'Shelke_engine_room.jpg|Shelke combat ready with the EM Blades activated Shelke_Sticks_Artwork.png|Design
    of Shelke''s EM Blades Shelke_Visor_Artwork.png|Design of the Synaptic Net Dive Visor Shelke_Shera.jpg|Shelke
    with the Synaptic Net Dive equipment on DC_Shelke_Phone_1.jpg|Design of Shelke''s Cellphone *EM Blades:
    Two short sword whose "blades" seem to emit an electric pulse in order to heat up and charge the the
    swords, giving an appearance similar to that of a Lightsaber. The hilts are connected by a cord like
    a nunchaku. Shelke dual wields these swords for quick and precise combos and flurries of attacks.
    *Shield Materia: An orange Materia Shelke carries around who grants her the ability to completely
    lock her opponents in place withing rings of energy, where even their time itself seems to stop. *Synaptic
    Net Dive Devices: In order to perform a Synaptic Net Dive, Shelke needs especially adapted terminals
    to connect herself and transfer her consciousness. These machines aren''t particularly unique and,
    in the case of not having one at hand, Shelke can modify computers so they can serve this porpuse.
    *Cell Phone: A common Cell Phone that isn''t used for combat, but it does come as relevant for Shelke''s
    information gathering and mission control roles during her time working as a Tsviet and later when
    joining Vincent.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-ca02b4ca
  section: power_scale
  axis: battle_iq
  text: Genius. Shelke's potential with Synaptic Net Diving, hacking and espionage skills were the main
    reason why Shinra took an interest in her in the first place. Though she's powerful warrior in her
    own right, Shelke truly shines in as mission control and gathering vital information to carry out
    missions. Good examples of her capabilites are how it was Shelke the one who hacked Deepground's supercomputer
    and used a virus to allow Deepgrounds rebellion tu succeed, by creating an opening in the control
    chip implantation on soldiers; later on, when Weiss communicated his plans and they realized they
    needed Vincent Valentine, quickly localized him using a Synaptic Net Dive.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-a973b003
  section: weaknesses
  axis: weakness
  text: Shelke has been noted to have a fragile body compared to her fellow Tsivets and, like most Deepground
    soldiers, she needs contant Mako baths to simply stay alive, leaving her with very poor stamina and
    in risk of passing out at very bad moments during missions outside of Deepground. Additionally, by
    her own admittance, her most powerful abilities such as Technichal Cancel, drain large amounts of
    her stamina, and while they can be used without issue in places with large amounts of external Mako,
    in most situations it can tire her out enormously.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-bcd8b42b
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics; Genius Intelligence; Invisibility; Stealth Mastery (managed
    to sneak on and follow Vincent, who can easily tell when he's being targeted by snipers); Skilled
    Swordswoman; Acrobatics; Enhanced Reflexes; Energy Absorption (can absorb external sources of Mako
    to fuel her abilities); Instinctive Reaction (can counterattack Vincent's moves despite being knocked
    back or staggered); Sealing (via the Shield Materia); Power Nullification and Perception Manipulation
    (via Technical Cancel); Forcefield Creation (via Protect); Duplication; Digital Projection, Information
    Manipulation, Sense Manipulation and Memory Manipulation (via the Syneptic Net Dive, Shelke can project
    her mind into digital planes and the minds of others, alter and create fake memories, and make them
    see images and memories from different people, however, it requires a specially adapted machine and
    Shelke needs to focus on its operation to do so, making it not combat applicable). Resistance to Mind
    Manipulation and Type-3 Corruption (despite constant exposure to Mako, and needing constant Mako Baths
    she doesn't suffer Mako Poisoning nor she becomes a Makonoid).
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
