- id: claim-intelligence-4719f187
  section: power_scale
  axis: battle_iq
  text: Due to possessing every Sorceress in history, Ultimecia boasts a massive repository
    of magical spells to use at her choosing, including the mighty Apocalypse. Having
    orchestrated the events of history for centuries, she is also master of deception
    and manipulation, convincing the president of Galbadia to make her the nation's
    diplomat and enticing the initially hostile Seifer Almasy to her side as her Knight
    before taking over the country and starting a war to further her plot. Her only
    downfall was the fact that she overlooked the possibility of the heroes using
    her Time Compression to journey to the future to face her personally, showing
    that while she is patient and calculating, the ultimate sorceress can also overlook
    certain things in her haste to finish her machinations, as proven by the end of
    the game in which she transfers her powers into Sorceress Edea, creating the time
    loop in which she is always defeated by the Legendary SeeD, Squall Leonhart.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-f7d3c627
  section: weaknesses
  axis: weakness
  text: 'In her final form, her casting of Apocalypse can be interrupted if her lower
    half is destroyed before she finishes. She is somewhat arrogant and is unable
    to foresee the specifics of her future. Causing her to regenerate more then twice
    seemingly leaves her weakened and confused. She will seek out the closest sorcerer
    to herself to pass her powers onto them so she can die peacefully. Notable Attacks
    and Techniques: *Draw and Stock/Cast: Ultimecia can absorb the energy from an
    opponent to recreate their magical powers. She can use this absorbed energy offensively
    to use the same ability on an opponent, or she can Junction it to become resistant/immune/strengthened
    by it. *Junction: Able to increase her statistics by absorbing energy from her
    opponents. Can grant herself resistance/immunity/strength with said energy. Can
    also attach the power to her physical attacks applying whatever effect the original
    ability inflicts (Can steal an instant death ability from her opponent and attach
    it to her physical attacks as an example) |-|Main'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
