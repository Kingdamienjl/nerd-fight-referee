- id: claim-powers-and-abilities-5baf7bda
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Blessed (Is blessed by The Crystal, which grants him the
    abilities of the Crystal), Self-Sustenance (Type 1: Can breathe underwater via Oxyale), Acausality
    (Type 1; Was unaffected by the time paradox he made when stopping the timeloop Chaos made in the past),
    Non-Physical Interaction (is capable of hitting Chronodia, the abstract concept of time itself), Master
    Martial Artist, Soul Manipulation (Is capable of interacting with and killing souls), Space-Time Manipulation
    and Time Travel (the 4 crystals are capable of warping space and time, as well as being able to send
    someone back in time), Regeneration Negation (Mid-Godly) and Immortality Negation (Type 3, 4, 7, and
    9; Is capable of killing the Undeads permanently, and the Fiends despite absorbing the Crystal''s
    Essences and gaining its Regenerative and Immortality properties as a result), Resistant to the Following:
    Subjective Reality, Magic, Conceptual Manipulation (Type 2), and Space-Time Manipulation (Characters
    are capable of surviving and resisting magical abilities, Which is shown to project one''s inner mind
    onto reality, and as shown with the creation of the Devil''s road, remove entire concepts and warp
    space and time to where the past, present, and future exists as one), Law Manipulation (Resists magic,
    which can rewrite the natural order of things), Spatial Manipulation, Deconstruction, and BFR (Can
    withstand the attacks of Atomos, who manipulates space, crush enemies down to a molecular levelDissidia
    Final Fantasy, and can warp them into another dimension), Electricity Manipulation and Pain Manipulation
    (Is able to resist the Lightning spells, which are capable of attacking the nervesFinal Fantasy IV
    Volume 2 Novel, chapter 7, page 54), Fire Manipulation, Ice Manipulation, and Matter Manipulation
    (Macro-Quantum; Is capable of resisting these elements, the Fire and Ice spell in particular being
    capable of affecting the target''s electrons), Poison Manipulation and Corrosion Inducement (Can resist
    the Poison status effect, which is also stated to corrode the target), Darkness Manipulation and Perception
    Manipulation (Can resist the darkness status ailment via various equipment, which would render the
    target blindFinal Fantasy V GBA Manual), Power Nullification (Can resist the Silence status, which
    would render the target''s ability to use magic null), Petrification (Can resist the petrification
    status effect), Death Manipulation and Blood Manipulation (Can resist the Death spell, which is even
    stated to solidify the victim''s blood,Final Fantasy IV Settings Guidebook), Paralysis Inducement
    (Can resist the Paralysis status effect), Status Effect Inducement (Is capable of resisting a wide
    variety of status ailments with the Ribbon), Morality Manipulation and Madness Manipulation (Type
    2; Can resist the Confuse status ailment, which can drive the target insane to attack anyone, even
    their allies), Sleep Manipulation (Can resist the Sleep status effect), Power Nullification (can resist
    the Silence status effect, which renders the target powerless), Time Stop (Can resist the Stop spell),
    Earth Manipulation (Can resist Earth based attacks), Curse Manipulation, Void Manipulation Biological
    Manipulation, Time Stop, Mind Manipulation, Statistics Reduction, and Corruption (Type 2, Can resist
    the powers of the darkness from FF3, which have shown to have these abilities), Regeneration Negation
    (High-Godly) and Immortality Negation (Type 1, 2, 3, 4, 5, 7, and 8; Is capable of withstanding hits
    from numerous foes blessed by the crystals and is still capable of healing from his wounds and not
    lose his immortality) Magic, Subjective Reality (Magic,Final Fantasy IV Novel 1, chapter 1, page 29
    in its basest form,Final Fantasy IV Novel 1, chapter 3, page 107 is projecting one''s innerFinal Fantasy
    IV: The After Years Novel, chapter 2, page 109 mind onto realityFinal Fantasy IV: The After Years,
    and is powered by intelligence and mental strength), Non-Physical Interaction (Magic as a whole is
    shown to affect a wide variety of different beings, from intangible/immaterial beings to non corporeal
    beings, to abstract concepts like Chronodia, who''s the flow of time itselfFinal Fantasy I, to Nonexistent
    beings like Exdeath and Cloud of Darkness), Law Manipulation (Magic is stated to rewrite the natural
    order of thingsFinal Fantasy IV Novel 1, chapter 5, page 198), Limited Durability Negation, Forcefield
    Negation, and Intangibility (Magic negates conventional physical durability, barriers, and armor,
    requiring specific defense against magic which is powered by the Mind and Spirit), Power Modification
    (Including Duplication, Fusionism, Statistics Amplification, Size Manipulation, Homing Attack, Danmaku,
    Aura, Breath Attack, and Energy Manipulation; Magic users across the games have consistently shown
    the ability to manipulate the shape and properties of their own magical abilities, with even higher
    tiers of spells simply being considered stron'
