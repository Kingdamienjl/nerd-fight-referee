- id: claim-weaknesses-3ade73ad
  section: weaknesses
  axis: weakness
  text: Despite his professionalism and no-nonsense attitude, Rude will hold back against people for whom
    he has a soft spot. This is noticeable regarding his romantic interest in Tifa Lockhart, against who
    he will only try to subdue instead of using his more effective close combat moves, despite Tifa going
    all out. This sort of block can jeopardize his missions and combat effectiveness. Previous to that,
    Rude dated a girl named Chelsea who actually was an AVALANCHE spy. Despite being aware of it, Rude
    never took measures for the issue and willingly accepted any possible outcome, even with Reno's warnings.
    Additionally, Rude, despite his stoic demeanor, can also get flustered when an outcome really takes
    him off-guard, and while he can keep an outward calm image, he needs a moment to regain his composture
    internally. Rude takes extra damage from wind-based attacks)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
