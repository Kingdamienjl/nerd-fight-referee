- id: claim-standard-equipment-102da2d8
  section: equipment
  axis: equipment
  text: 'Rude''s Black Gloves.png|Rude''s Leather Gloves Rude''s Shades.png|Rude''s Sunglasses Rude''s
    Spare Shades Remake.png|Rude''s Spare Sunglasses Shinra Security Chopper.png|Shinra Military Helicopter
    File:Rude''s Phone.png|Rude''s Phone *Leather Gloves: Rude doesn''t use weapons, relying mostly on
    his fists and physique. When engaging in combat, he will put on two black leather gloves before the
    fight. *Sunglasses: Not a weapon either, nor they offer any kind of tactical advantage, however they
    look very stylish and Rude is very adamant on keeping them on to mantain his professional and no-nonsense
    image. *Spare Sunglasses: In the unbelieveable case that Rude''s sunglasses may be lost during combat,
    he is savvy enough to carry a spare pair in his person so his impecable image is not lost. *Shinra
    Military Helicopter: The Shinra company provides the necessary vehicles to SOLDIER and the Turks for
    their missions. The Turks in particular are commonly seen piloting helicopters when they need a means
    of transport. These come equipped with a gatling machine gun on the front and napalm missiles at the
    sides. *Phone: Rude, like all Shinra personnel, carries a mobile phone to contact his colleagues or
    his teammates during missions and plan properly his next course of action.'
  source_ids: *id003
  decisive: false
  status: unverified
