- id: claim-standard-equipment-ec5e4448
  section: equipment
  axis: equipment
  text: '*Engine Blade: Noctis'' preferred one-handed weapon, it was presented to
    him on his sixteenth birthday, absorbing the elemental powers of those it defeats.
    Noctis later upgrades it with the latest in Insomnian technology to create the
    Ultima Blade, an immensely more powerful weapon that also increases Noctis'' health
    and mana reserves. *Ring of the Lucii: A treasured item passed down by all of
    the kings of Lucis to their successors, it binds their souls together and allows
    them to draw on the power of Eos'' Crystal. Upon activation, it grants Noctis
    incredible magical power and access to the whole of the Armiger Arsenal, but this
    can be incredibly painful and leaves extensive scarring after use, so it is not
    something he can use lightly until he becomes the King of Light. *Royal Arms:
    The thirteen ancestral weapons passed down by the greatest kings of the Lucii,
    Noctis gains access to them while utilizing the powers of the Ring of the Lucii.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-9d6f17cc
  section: power_scale
  axis: battle_iq
  text: Noctis is an expert combatant, wielding a wide variety of different weapons
    with skillful precision, shifting between them on a whim when the situation calls
    for it. In addition, he holds perfect synergy with his three companions, performing
    various combination attacks with them by communicating with naught but a few words.
    He is also a skilled diplomat, convincing the First Secretary of Altissia to lend
    him aid in dealing with Leviathan while also minimizing casualties. By the time
    of his final battle with Ardyn, Noctis managed to defeat his ancestor with the
    full might of the kings of Lucis despite Ardyn's access to the Ring of the Lucii's
    abilities and thousands of years of experience. Lastly, Noctis is also proficient
    in the art of stealth, being able to sneak around heavily-guarded Imperial bases,
    and warp-kill targets while remaining undetected.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-6c1dd03c
  section: weaknesses
  axis: weakness
  text: 'Cannot use the Ring of the Lucii''s abilities on a whim, as using it severely
    damages his body and drains his life-force. The Star of the Rogue can be used
    up-close, but doing so hurts Noctis. Some of his weapons also decrease his resistance
    (Example: Katana of the Warrior decreases his resistance to darkness). He must
    be in dangerous situations to summon the Astrals Notable Attacks/Techniques: |-|Armiger=Armiger:
    Noctis channels the power of the previous kings of Lucis, summoning all of their
    weapons and drastically increasing his power and speed, allowing him to decimate
    his enemies much faster than normal. Also, every attack performed activates Noctis''
    warp skill, making it very difficult to hit him. When used at maximum capacity,
    it also grants Noctis the ability to fly. * Sword of the Wise: The sword wielded
    by the king who erected the mighty walls that protect Insomnia, Noctis utilizes
    it to warp around his foes, attacking their blindspots with devastating warp-strikes.
    center|thumb|400px|Sword of the Wise * Axe of the Conqueror: A heavy axe wielded
    by a king known for his feats of arms, it is designed to wreak havoc with slow
    and devastating blows at the cost of Noctis'' defense. center|thumb|400px|Axe
    of the Conquerer * Bow of the Clever: The bow of a king known for his martial
    and intellectual prowess, it launches a constant supply of piercing arrows that
    can be easily drawn and fired while on the move. center|thumb|400px|Bow of the
    Clever * Swords of the Wanderer: A pair of swords wielded by the king said to
    be a swift as the winds themselves, they allow Noctis to unleash a deadly series
    of quick slashes and can combine for thundering attacks. thumb|center|400px|Swords
    of the Wanderer * Blade of the Mystic: A longsword wielded by the founder king
    who sought to protect the world along with the Oracle, it bolsters Noctis'' strength
    while it is in hand. It also increases the wielder''s resistance to the powers
    of darkness. thumb|center|400px|Blade of the Mystic * Star of the Rogue: A throwing
    star wielded by a queen who took to the shadows and shunned the public''s watchful
    eye, it can rapidly strike a single target multiple times or bounce between multiple
    targets, and even create duplicates of itself. It also increases Noctis'' resistance
    to fire, lightning, and ice attacks. thumb|center|400px|Star of the Rogue * Greatsword
    of the Tall: A greatsword wielded by a king as well-built as the mountains themselves,
    it resonates in its wielder''s hand, striking its victims multiple times with
    a single swing at the expense of the wielder''s resistance to the elements. thumb|center|400px|Greatsword
    of the Tall * Shield of the Just: A shield that protected the queen devoted to
    peace and love for all, it automatically deflects oncoming attacks and allows
    Noctis to expend magical energy to quickly heal himself. It also raises his resistance
    to fire, ice, lightning, and dark attacks at the expense of raw offensive power.
    thumb|center|400px|Shield of the Just * Mace of the Fierce: A mace wielded by
    a king who was gentle to his people but a monster to his foes, it possesses an
    affinity for causing grievous harm to body parts and appendages, crushing them
    and thus rendering them useless. thumb|center|400px|Mace of the Fierce * Scepter
    of the Pious: A staff wielded by a king who ruled according to divine law and
    worked in tandem with the Oracle, it takes upon numerous forms to smite its foes,
    obliterating them with swords of divine light. This staff also greatly increases
    the wielder''s resistance to the powers of darkness. thumb|center|400px|Scepter
    of the Pious * Trident of the Oracle: The weapon wielded by the Oracle, who brought
    man and god together and brought comfort and tranquility to the stars above. It
    can produce holograms and afterimages of the wielder that can also attack foes.
    thumb|center|400px|Trident of the Oracle * Katana of the Warrior: An oriental
    blade wielded by the King whose Queen was taken from him too soon, Noctis can
    draw and strike with it in a single heartbeat and crush his foes relentlessly
    with a cascade of blows. It also increases the wielder''s resistance to fire,
    ice, and lightning, but lowers their resistance to darkness. thumb|center|400px|Katana
    of the Warrior * Sword of the Father: The sword wielded by King Regis, father
    of the True King, it is a mighty sword designed that nurtures the light and increases
    the power of one''s finishing blows. thumb|center|400px|Sword of the Father Royal
    Cleave.gif|Royal Cleave Dynasty_Stance.gif|Dynasty Stance Apocalypsis.gif|Apocalypsis
    Armiger Storm.gif|Armiger Storm Armiger Assault.gif|Armiger Assault Armiger Vortex.gif|Armiger
    Vortex Armiger Barrage.gif|Armiger Barrage Armiger Onslaught.gif|Armiger Onslaught
    Noctis High Time.gif|High Time Legacy of the Lucii.gif|Legacy of the Lucii Armiger
    Unleashed: Noctis unleashes the full power of the kings of Lucis with authority
    granted to him by his possession of all thirteen Royal Arms and the Founder King''s
    Sig'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-7632f721
  section: abilities
  axis: hax
  text: 'Final Fantasy XV= Superhuman Physical Characteristics, Weapon Mastery, Stealth
    Mastery, Extrasensory Perception (Mages have shown to naturally possess thisFinal
    Fantasy IV: The After Years), Magic, Subjective Reality (Magic,Final Fantasy IV
    Novel 1, chapter 1, page 29 in its basest form,Final Fantasy IV Novel 1, chapter
    3, page 107 is projecting one''s innerFinal Fantasy IV: The After Years Novel,
    chapter 2, page 109 mind onto reality,Final Fantasy IV: The After Years and is
    powered by intelligence and mental strength), Non-Physical Interaction (Magic
    as a whole is shown to affect a wide variety of different beings, from intangible/immaterial
    beings to non corporeal beings, to abstract concepts like Chronodia, who''s the
    flow of time itself,Final Fantasy I to Nonexistent beings like Exdeath and Cloud
    of Darkness), Law Manipulation (Magic is stated to rewrite the natural order of
    thingsFinal Fantasy IV Novel 1, chapter 5, page 198), Limited Durability Negation,
    Forcefield Negation, and Intangibility (Magic negates conventional physical durability,
    barriers, and armor, requiring specific defense against magic which is powered
    by the Mind and Spirit), Power Modification (Including Duplication, Fusionism,
    Statistics Amplification, Size Manipulation, Homing Attack, Danmaku, Aura, Breath
    Attack, and Energy Manipulation; Magic users across the games have consistently
    shown the ability to manipulate the shape and properties of their own magical
    abilities, with even higher tiers of spells simply being considered stronger versions
    of the same basic abilityFinal Fantasy IV: The After Years Novel, chapter 2 page
    114), Conceptual Manipulation (Type 2) and Space-Time Manipulation (Magic is shown
    in the novels to remove concepts and warp space and time itself, like the Devil''s
    road, which the concept of time was lost,Final Fantasy IV Novel 1, chapter 5,
    page 199 and time and space were twisted to the pointFinal Fantasy IV: The After
    Years Novel, chapter 1, page 67 the past, present and futureFinal Fantasy IV:
    The After Years Novel, chapter 1, page 73 existed as oneFinal Fantasy IV: The
    After Years Novel, chapter 3, page 147), Power Bestowal (Can grant others the
    ability to summon and wield any of the weapons in his arsenal), Flight, Intangibility,
    Duplication, Teleportation, Weapon Control, Fire Manipulation, Ice Manipulation,
    Electricity Manipulation & Pain Manipulation (Is able to use the Lightning spells,
    which are capable of attacking the nervesFinal Fantasy IV Volume 2 Novel, chapter
    7, page 54), Light Manipulation, Healing, Regeneration (Mid-Low), Statistics Amplification
    (All of his weapons boost at least one of his parameters, like his resistance
    towards elemental magic), Statistics Reduction (Some of his weapons reduce the
    target''s strength, durability, etc.), Sound Manipulation (Can emit powerful sound
    waves with the Noiseblaster), Gravity Manipulation (Able to create a gravitational
    sphere that pulls enemies in), Precognition (Able to see the deaths of others),
    Holy Manipulation, Energy Blasts, Poison Manipulation, Curse Manipulation, Time
    Stop (Can imbue his weapons with the Stop spell), Spatial Manipulation and BFR
    (Can rip a hole in the universe and banish enemies to the void with Alterna),
    Summoning (Can summon various weapons in battle, as well as the Astrals to aid
    him in combat), Absorption (Can absorb elemental energies and the life force of
    his enemies), Death Manipulation, Barrier Creation (Should be capable of erecting
    "The Wall" like all Kings before him. Regular Kingsglaive members as well as Regis
    were all capable of creating spherical barriers around themselves, and Noctis
    should be capable of the same), Resistance towards Fire Manipulation, Ice Manipulation,
    Electricity Manipulation & Pain Manipulation (Is able to resist the Lightning
    spells, which are capable of attacking the nervesFinal Fantasy IV Volume 2 Novel,
    chapter 7, page 54), Poison Manipulation, Mind Manipulation, Time Manipulation,
    Death Manipulation, Petrification, Transmutation, Absolute Zero (Can survive Shiva''s
    ice attacks, including Diamond Dust), Madness Manipulation (Type 2; Can resist
    the Confuse status ailment, which can drive the target insane to attack anyone,
    even their allies), Conceptual Manipulation (Type 2), and Space-Time Manipulation
    (Characters are capable of surviving and resisting magical abilities, Which is
    shown to project one''s inner mind onto reality, and as shown with the creation
    of the Devil''s road, remove entire concepts and warp space and time to where
    the past, present, and future exists as one), Law Manipulation (Resists magic,
    which can rewrite the natural order of things), Power Nullification (Can resist
    the Silence status, which would render the target''s ability to use magic null),
    and Darkness Manipulation |-|Dissidia= {{#tag:tabber| {{!}}-{{!}}'
