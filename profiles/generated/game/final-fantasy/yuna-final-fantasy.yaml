  text: 'Final Fantasy X=Superhuman Physical Characteristics, Magic, Non-Physical Interaction (Able to
    kill the lingering Ghosts in the Cavern of the Stolen Fayth and the Wraiths found Inside Sin), Healing,
    Summoning, Barrier Creation, Regeneration (Mid-Low), Energy Blasts, Statistics Reduction (Via Break
    abilities), Damage Reduction (Via Sentinel), Fear Manipulation (Via Threaten), Necromancy and Transmutation
    (Via Zombie Attack), Death Manipulation (Via Death and Anima), Pocket Reality Manipulation (Via Anima),
    Statistics Amplification (Via Cheer, Aim, Focus, Reflex, Protect and Shell), Time Manipulation (Can
    accelerate himself or slow down enemies in time with Hastega and Slowga), Radiation Manipulation,
    Damage Negation (Via NulBlaze, NulShock, NulTide and NulFrost), Purification (Type 3 via Esuna and
    various items and Type 2 via sending souls to the farplane), Resurrection (Via Life, Full-Life and
    Auto-Life), Attack Reflection (Via Reflect), Holy Manipulation, Fire Manipulation, Ice Manipulation,
    Electricity Manipulation, Water Manipulation, Resurrection and Regeneration Negation, Poison Manipulation
    (Via Bio), Gravity Manipulation (Via Demi), Energy Projection (Via Flare and Mega Flare), Absolute
    Zero (Via Shiva), Information Analysis (Via Scan and Sensor), Probability Manipulation (Via Jinx and
    Luck), Social Influencing (Can bribe mindless monsters to leave battle), Power Mimicry (Via Copycat),
    Durability Negation (Via Piercing and Demi), Enhanced Senses and Stealth Mastery (Via Initiative),
    Intangibility (Ifrit can become smoke or flameWar of the Visions: Final Fantasy Brave Exvius), Resistance
    Negation (Via Anima and Bahamut), Curse Manipulation and Death Manipulation (Via Candles of Life),
    Resistance to Fire Manipulation, Ice Manipulation, Electricity Manipulation, Water Manipulation, Darkness
    Manipulation, Power Nullification, Sleep Manipulation, Poison Manipulation, Petrification, Death Manipulation,
    Necromancy, Transmutation, Mind Manipulation, Empathic Manipulation, Curse Manipulation, Radiation
    Manipulation, Absolute Zero (Can withstand Shiva''s presence and attacks), Time Manipulation (In the
    form of Time Slow and Stop) and Memory Manipulation (Can challenge Sin head-on without being impeded
    by its toxin) |-|Final Fantasy X-2=All previous abilities, Weapon Mastery, Telekinesis, Teleportation
    Via the Psychic Dressphere, Summoning Via Dark Knight, Lady Luck, and Trainer Dresspheres (Can summon
    Meteors, Animals, and Fiends to assist respectively but can no longer summon Aeons), Self-Destruction
    (Charon gives the users life to deal damage), Damage Boost, Mind Manipulation, Gravity Absorption
    Via the Psychic Dressphere (Gravity Eater absorbs Gravity based attacks), Durability Negation, Power
    Mimicry Via the Gun Mage Dressphere (Can learn enemy skills after being hit by them or forcibly steal
    them), Can bypass Attack Reflection, BFR Via the Psychic Dressphere (Can banish eneimes to parts unknown),
    Darkness Manipulation Via the Dark Knight dressphere (Darkness sacrifices HP to damage enemies with
    a wave of Darkness), Curse Manipulation Via Doom (Doom makes a counter appear over a targets head
    and kills them when it reaches zero), Forcefield Creation Paralysis Inducement Via the Thief Dressphere,
    Madness Manipulation (Was able to resist Shuyin''s attempts to drive her insane), and Resistance to
    Paralysis Inducement |-|Dissidia= {{#tag:tabber| Abilites=All previous abilities enhanced, possibly
    Immortality (Type 8,reliant on her Crystal which let Cosmos''s group return from fading from existence
    after Cosmos'' death) & Regeneration (Low-Godly), Summoning (Can summon various Eidolons from Summonstones
    and the World of Illusions), Self-Sustenance (Type 2, has no need to eat or drinkDissidia Final Fantasy
    Opera Omnia), Willpower Manipulation (a person''s will is power there and enables them to do a multitude
    of things the stronger their willDissidia Final Fantasy Opera Omnia), Reactive Power Level (the greater
    someone''s will, the greater their powerDissidia Final Fantasy Opera Omnia), Law Manipulation (Beings
    with strong wills can overwrite the laws of the world and bend them to their willDissidia Final Fantasy
    Opera Omnia), Creation (With a powerful enough will, once can create various things such as phone
    lines, airships and even entire countries and worldsDissidia Final Fantasy Opera Omnia), Sealing (Can
    seal off large areas and people with her will, such as Cecil sealing himself in Castle Baron or the
    cast sealing Kefka inside a TorsionDissidia Final Fantasy Opera Omnia), Dimensional Travel (Characters
    can open Torsions, rifts in space-time to travel various dimensionsDissidia Final Fantasy Opera Omnia),
    and Immortality (Type 2) (Due to the crystal core of darkness''s influence in the hands of Ardyn,
    warriors will not die no matter how injured they are) {{!}}-{{!}}Resistances=Resistance to Mind Manipulation,
    Soul Manipulation (Via Zalera, the Death Serpah, who was going to absorb the souls of every living
