- id: claim-weaknesses-c114a00a
  section: weaknesses
  axis: weakness
  text: Rosso is extremely sadistic, bloodthirsty, prideful and easy to anger. While she goes for a quick
    kill against lesser opponents, she does enjoy and prolong the suffering of opponents that put a better
    fight. If she loses the edge in a fight, she can quickly lose her temper and resort to questionable
    decisions or simply carelessly lash out. These shortcomings are lessened to an extent when she uses
    her Bloodburst mode, however, as she is focused on a simple quick kill.
  source_ids: *id003
  decisive: false
  status: unverified
