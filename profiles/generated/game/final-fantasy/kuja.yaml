  intelligence:
    text: Kuja is an incredibly skilled magician, casually wielding powerful spells
      like Flare Star and Holy as well as the ultimate magic, Ultima. Created as the
      Angel of Death, Kuja has no conscience, and is thus incredibly wicked, ruthless,
      and calculating, single-handedly instigating a war to wipe out life on Gaia
      as Garland intended, enslaving the mighty Bahamut with the airship Invincible
      and using it to wipe out Alexandria, only failing due to the intervention of
      the country's patron Eidolon, Alexander, which too was destroyed in the end.
      However, for all his power and brilliance, Kuja is also narcissistic, proud,
      and childish, having never experienced a childhood to develop his emotional
      maturity. As a result, he panics when things go wrong and refuses to improve
      himself since he feels that he has done nothing wrong.
    source_ids: *id002
