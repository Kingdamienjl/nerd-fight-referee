    - field: intelligence
      value: Due to possessing every Sorceress in history, Ultimecia boasts a massive
        repository of magical spells to use at her choosing, including the mighty
        Apocalypse. Having orchestrated the events of history for centuries, she is
        also master of deception and manipulation, convincing the president of Galbadia
        to make her the nation's diplomat and enticing the initially hostile Seifer
        Almasy to her side as her Knight before taking over the country and starting
        a war to further her plot. Her only downfall was the fact that she overlooked
        the possibility of the heroes using her Time Compression to journey to the
        future to face her personally, showing that while she is patient and calculating,
        the ultimate sorceress can also overlook certain things in her haste to finish
        her machinations, as proven by the end of the game in which she transfers
        her powers into Sorceress Edea, creating the time loop in which she is always
        defeated by the Legendary SeeD, Squall Leonhart.
