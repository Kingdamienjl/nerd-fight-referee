- id: claim-standard-equipment-23028f53
  section: equipment
  axis: equipment
  text: 'Reno Security Baton.png|Reno''s Security Baton Reno Security Baton Retracted.png|Reno''s Security
    Baton Retracted Reno EM Mine.png|Reno''s EM Mines Reno EM Mine Activate.png|Reno''s EM Mine Activated
    Rude on phone with Reno.png|Reno talking to Rude on the Phone Shinra Security Chopper.png|Shinra Military
    Helicopter *Security Baton: A retractable steel baton provided by the Shinra company, this is Reno''s
    weapon of choice, which aside using it for melee combat, also is used to channel electricy for his
    attacks and perform most of his techniques. It''s sturdy enough to withstand clashes with Cloud''s
    swords. *EM Mines: These devices, when activated, will float and slowly approach the enemy while producing
    a strong electrical current that can paralyze those who come in contact with it. If several EM Mines
    are used at once, they will connect with each other through a a string of electricity, effectively
    creating a net of sorts. *Shinra Military Helicopter: The Shinra company provides the necessary vehicles
    to SOLDIER and the Turks for their missions. The Turks in particular are commonly seen piloting helicopters
    when they need a means of transport. These come equipped with a gatling machine gun on the front and
    napalm missiles at the sides. *Phone: Reno, like all Shinra personnel, carries a mobile phone to contact
    his colleagues or his teammates during missions and plan properly his next course of action. Though
    Reno''s phone is never seen directly, Rude is shown receiving a call from Reno on his own.'
  source_ids: *id003
  decisive: false
  status: unverified
