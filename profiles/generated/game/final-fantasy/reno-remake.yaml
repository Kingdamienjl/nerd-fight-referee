- id: claim-weaknesses-d1cbaef6
  section: weaknesses
  axis: weakness
  text: Reno is very cocky and confrontational, which many times leads him to take less pragmatic decisions
    during missions and even get over his head measuring himself against an opponent, which in turn makes
    him hold deep grudges when he has been defeated or feels humilliated. His second defeat at the Sector
    7 pillar almost compromised his mission as he seemed more focused on picking a fight with Cloud to
    get back at him for their first encounter which ended in Reno's defeat. This led to him get badly
    injured and the mission being successful solely because of Rude's help and the Whispers of Fate intervention.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-2e9739c8
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics, Acrobatics (Hypermobility and Self-Momentum. Reno is a
    very acrobatic fighterFinal Fantasy VII Remake (2020), with most of his style relying on his speed
    to perform complex jumps and maneuvers, as well as quickly moving around the battlefield, to deliver
    barrages of attacks to the opponent or quickly evade and counter), Martial Arts and Weapon Mastery
    (Reno is shown to be an expert close range fighter, mixing up kicks with his use of the metal batonFinal
    Fantasy VII Remake (2020) to deliver powerful combos and easily keep up with other skilled fighters
    of different styles, such as Cloud''s swordsmanship or Tifa''s own martial arts), Vehicular Mastery
    (Is a skilled helicopter pilot and shot with the vehicle''s weapons), Stealth Mastery (All Turks are
    trained in infiltration and espionage. Though their capability depends on the specific individual,
    Reno at least is capable of following undetectedBefore Crisis -Final Fantasy VII- (2004) Rude, another
    Turk, and Avalanche membersBefore Crisis -Final Fantasy VII- (2004), who are also trained warriors),
    Spirit Energy Manipulation (Can use his Spirit Energy to perform special abilities with it), Non-Physical
    Interaction (Spirit Energy allows users to interact with non-corporeal beings like ghosts or Summons,
    the latter whom trascend physicalCrisis Core -Final Fantasy VII-: The Complete Guide (2007) matter),
    Electricity Manipulation (Reno specializes in electrical attacks, being able to perform several different
    types of techniques such as ranged projectiles, charge his own attacks, create traps or create bursts
    of electricity. Additionally, Reno carries EM Mines with him), Paralysis Inducement (The EM Mines,
    EM Shot and Binding Current paralyze the target), Statistics Amplification (Speed. FlashfootFinal
    Fantasy VII Remake (2020) allows Reno to charge and shift directions much faster than normal, allowing
    him to outspeedFinal Fantasy VII Remake (2020) enemies that normally are as quick as him), Homing
    Attack (EM Shot and Triple EM Shot track the opponent, the EM Mines slowly approach the enemy), Sealing
    (Via Pyramid, which traps an enemy within an energy construct which must be destroyed for them to
    be free) Resistances: *Resistance to: Madness Manipulation (Type 2, unaffected by Berserk) and Time
    Manipulation (Unaffected by Slow), Sense Manipulation and Power Nullification (Unaffected by Silence),
    Electricity Manipulation (Due to his natural affinity with lightning, Reno takes little damage from
    electrical attacks), Absolute Zero (Can withstand Shiva''s Diamond Dust, whose coldFinal Fantasy Explorers.
    Japanese Website Summon profiles (2014) reaches these temperatures), Matter Manipulation and Radiation
    Manipulation (Can endure Bahamut''s Megaflare. The Flare abilities are consistently described as a
    nuclear explosions)'
  source_ids: *id003
  decisive: true
