- id: claim-powers-and-abilities-d01d4143
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics; Longevity; likely Self-Sustenance (Types 1 and 2); Large
    Size (Type 1); Flight; Explosive Aura (Weapons can be seen engulfed in a blue energy and tends to
    result in being repelled when approaching them); Energy Projection (via Ruby Ray and Ultima); minor
    Madness Manipulation (via Ruby Ray); Fire Manipulation (via Ruby Flame); Body Control (can release
    two mechanical tentacles, under the ground, which it can control from distance); Transmutation and
    Size Reduction (via Right Revenge and Right Thrust); Statistics Reduction (the Frog and Small status
    reduce the opponent''s offensive capabilities) and Power Nullification (via the Frog status); Energy
    Depletion, Poison Manipulation and Gradual Petrification (via Left Revenge and Left Thrust); Paralysis
    Inducement (via Big Swing); Battlefield Removal (via Whirlsand); Magic; Summoning (of small meteorites
    via Comet2/Cometeor); Bodily Weaponry (Conventional; Claws). *Resistance to: Mind Manipulation, Soul
    Manipulation and Empathic Manipulation (slept in the Northern Crater, a place overflowing with Spirit
    Energy, presently known as Mako, for thousands of years, yet it seemed unaffected as it immediately
    flew off to carry out its mission without question), Deconstruction, Matter Manipulation (its body
    was unaffected by the Mako, despite the Lifestream being able to diffuse physical matter to retake
    the Spirit Energy of living beings) and Corruption (the Weapons were created to fight Jenova, who
    could unleash a powerful virus that mutated others into monsters. Mako can mutate creatures into monsters
    as well, yet the Weapons seemed unaffected); as well as Elemental Manipulation (of the Fire, Absolute
    Zero Ice, Lightning, Earth and Gravity variety).'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
