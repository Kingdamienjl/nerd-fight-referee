- id: claim-powers-and-abilities-5dd4d5fa
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Regeneration Negation (Mid-Godly) and Immortality Negation
    (Types 1, 2, 3, and 7. Was capable of killing God of Magic Kefka, who took the power of the Warring
    Triad and became the source of all magic and Espers, including Gilgamesh), Berserk Mode (is always
    enraged), Ice Manipulation and Weather Manipulation (via Blizzard Orb), Weapon Mastery (Via the Merit
    Award which allows the user access and skilled use to almost any form weapon), Acrobatics (via the
    Dragoon Boots), Immortality (Type 7, the lich ring turns the wearer into an undead having healing
    spells harm them but harmful spells such as death heal them), Damage Boost (The Gigas Glove and Earring
    boost the physical and magical damage of the user''s attacks), Statistics Amplification (Several relics
    enable constant Protect, Shell, and Haste), Regeneration (Mid-Low) (via Miracle Shoes and Angel Ring,
    which grant a constant Regen status), Attack Reflection (Reflect Ring generates a constant Reflect
    status), Homing Attack (Via Sniper''s Eye, allows attacks to always hit their target) and Accelerated
    Development (The Growth Egg doubles the rate of growth) Resistant to the Following: Absorption (Can
    harm Kefka with magic after he absorbs the goddess statue which is stated and shown to absorb magicFinal
    Fantasy VI), Subjective Reality, Magic, Conceptual Manipulation (Type 2), and Space-Time Manipulation
    (Characters are capable of surviving and resisting magical abilities, Which isFinal Fantasy IV Novel
    1, chapter 1, page 29 shown toFinal Fantasy IV Novel 1 chapter 3, page 109 project one''s innerFinal
    Fantasy IV The After Years Novel, chapter 2, page 109 mind onto realityFinal Fantasy IV: The After
    Years>, and as shown with the creation of the Devil''s roadFinal Fantasy IV Novel 1, chapter 5, page
    198, remove entire conceptsFinal Fantasy IV Novel 1, chapter 5, page 199 and warp space and timeFinal
    Fantasy IV The After Years Novel, chapter 1, page 67 to where the past, present, and futureFinal Fantasy
    IV The After Years Novel, chapter 1, page 73 exists as oneFinal Fantasy IV The After Years Novel,
    chapter 3, page 147), Law Manipulation (Resists magic, which can rewriteFinal Fantasy IV Novel 1,
    chapter 1, page 29 the natural order of thingsFinal Fantasy IV Novel 1, chapter 5, page 198), Dream
    Manipulation and Soul Manipulation (Is unfazed by the dream stooges ability to go into dreams and
    take their souls), Hellfire Manipulation (Via Ifrit), and Absolute Zero (Via Shiva. Her ice and aura
    are stated to reach absolute zero including Diamond Dust), Power Mimicry (His Desperation Attacks
    cannot be copied by Mimics) Status Effect Inducement (can resist a wide variety of status ailments
    in the game), Darkness Manipulation and Perception Manipulation (Can resist the darkness status ailment
    via various equipment, which would render the target blindFinal Fantasy V GBA Manual), Poison Manipulation,
    Disease Manipulation and Corrosion Inducement (Can resist the Poison and bio spell, which is stated
    to corrode the target, and inflict the target with a disease respectively), Berserk Mode (Can resist
    the Berserk status effect), Death Manipulation and Blood Manipulation (Can resist the Death spell,
    which is even stated to solidify the victim''s blood,), Necromancy (Can resist the Zombification status
    effect), Transmutation (Can resist the Imp status effect), Power Nullification (Can resist the Silence
    status effect, which render one''s abilities null), Madness Manipulation (Type 2) and Morality Manipulation
    (Can resist the Confuse status ailment, which drives the target insane and attack anyone, even their
    allies), Sleep Manipulation and Biological Manipulation (Can resist the Sleep spell, which can affect
    the target''s cerebral cortexFinal Fantasy IV Settings Guidebook), Life Manipulation (Can resist the
    Sap status effect)Fire Manipulation, Ice Manipulation and Matter Manipulation (Sub-Atomic; Can resist
    Fire and Ice magic. Both Fire and Ice related abilities are stated to affect the target''s electrons,
    being able to even negate durability in the process), Electricity Manipulation and Pain Manipulation
    (Is able to resist Lightning spells, which is capable of attacking the nervesFinal Fantasy IV Volume
    2 Novel, chapter 7, page 54)'
