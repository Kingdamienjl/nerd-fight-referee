        |-|KHI= {{#tag:tabber|{{!}}-{{!}}Combat= Gifted, Sora has taught himself a
        variety of Keyblade techniques, magical spells, and supporting abilities that
        have served him well on his journeys in just a few months, even being compared
        to Keyblade Masters, which when trained formally normally take years to even
        be considered as such, while also having fought countless foes on a wide variety
        of environments such as while airbone, grounded and underwater, even having
        fought as a merman on the last one without much issue, and could make the
        most of his own abilities to counteract the Phantom's intangibility. {{!}}-{{!}}Everything
        else= Above Average, likely Gifted, Sora could also eventually grasp how to
        drive the Gummi Ship, an inter-universal travel device to travel between the
        Worlds in the Ocean Between, while also dodging hostile ships and attacking
