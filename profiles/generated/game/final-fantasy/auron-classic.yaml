    text: Pre-Keyblade= Average, while Sora has played with a wood sword to pass time
      with his friends for a while, he's still remarked on mainly swinging it like
      a toy, and lacks experience in general, but has still been able to keep pace
      with Riku (both in combat and on a race), somebody slightly older, at the time,
      and three kids of his age at once. Besides combat, while Sora has only been
      in Destiny Islands, and so is quite unaware of much else, the fact Kairi was
      confirmed to go to school a bit after the start of KHII implies Sora was subject
      to an educative system previously, Sora was also clever enough to find the items
      Kairi requested for the trip in the raft they were going to have, notably including
      swimming for fish and pushing a boulder for a mushroom. |-|KHI= {{#tag:tabber|{{!}}-{{!}}Combat=
      Gifted, Sora has taught himself a variety of Keyblade techniques, magical spells,
      and supporting abilities that have served him well on his journeys in just a
      few months, even being compared to Keyblade Masters, which when trained formally
      normally take years to even be considered as such, while also having fought
      countless foes on a wide variety of environments such as while airbone, grounded
      and underwater, even having fought as a merman on the last one without much
      issue, and could make the most of his own abilities to counteract the Phantom's
      intangibility. {{!}}-{{!}}Everything else= Above Average, likely Gifted, Sora
      could also eventually grasp how to drive the Gummi Ship, an inter-universal
      travel device to travel between the Worlds in the Ocean Between, while also
      dodging hostile ships and attacking back with proper aim of his own. Sora has
      also traveled across several Worlds alongside Donald Duck and Goofy, and so
      is experienced with several kinds of cultures and ways to blend in them without
      disrupting their order, although he forgets to do so at times regardless, and
      has a good memory on patterns as he can follow up the original Black Ballade
      from its clones, and repeat the jumping patterns of Tigger and Roo. Sora also
      managed to keep track of the ways Tigger was headed to to block him from stomping
      the carrots, and quickly learned how to swing himself on vines and slide on
      trees. }} |-|KHCoM= {{#tag:tabber|{{!}}-{{!}}Combat= Gifted, even when Sora
      lost most of his memories as a side effect of Naminé messing with them at nearly
      the start, Sora managed to regain most of his former abilities by reinventing
      them from the start, even discovering more advanced techniques such as Lethal
      Frame and Ultimate-Class magic spells like Mega Flare, all while also mastering
      the unique card system all attacks are bound to in Castle Oblivion to his advantage,
      and learning to use large waves of homing attacks like Firaga Burst. Sora also
      managed to defeat some of the stronger members of Organization XIII like Marluxia
      and Larxene, the latter of which is regarded as one of the fastest characters
      in the series. {{!}}-{{!}}Everything else= Above Average, likely Gifted, Sora
      retained his previous mental skills, and has displayed a quick grasp of sky-diving
      and sorting off vegetables while also keeping Pooh safe as well, Sora also redisplayed
      the capability to memorize the jumping patterns of Tigger. }} |-|KHII= {{#tag:tabber|{{!}}-{{!}}Combat=Genius,
      Sora is remarked as a master swordman not long after the start of this journey
      even when he lost once again most of his powers at the start. Sora has also
      shown the ability to perfectly replicate attacks after seeing them a single
      time, showing heightened combat awareness and dynamic thinking skills, which
      is denoted in his capability to dual-wield Keyblades. He has even proven himself
      capable of using his opponent's weapons against them, utilizing Saïx's Claymore
      and copying his Berserk state, throwing Marluxia's own scythe at him while dealing
      with a death timer, backfiring Luxord's Law Manipulation-based "games", copying
      Xaldin's jumping attacks, using Demyx's clones against them, and stealing Roxas'
      Keyblades, notably triple-wielding Keyblades in the process. Sora has also shown
      a solid capability of teamwork, being able to consistently combine his strength
      with that of allies like Tron, Simba, Auron and Riku, most notably deflecting
      countless lasers at once from all directions alongside Riku. Sora could also
      keep up with Lingering Will, who had power directly comparable to Keyblade Masters
      and could defeat Braig, who had several generations of experience as formerly
      Luxu, and is stated to have used his Keyblade with more ease than Sora, even
      mastering the usage of several weapons from his transformed Keyblade, yet Sora
      could still keep up with Drive Forms and teamwork with summons. {{!}}-{{!}}Everything
