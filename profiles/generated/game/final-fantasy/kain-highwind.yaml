- id: claim-weaknesses-854744d3
  section: weaknesses
  axis: weakness
  text: 'Kain keeps his repressed jealousy towards Cecil locked inside, which can
    manifest as an evil doppleganger known as Dark Kain, but he has gotten over this
    by the time he becomes a Holy Dragoon. Notable Attacks/Techniques: |-|Dragoon
    Attacks= *Cyclone: Spins his spear to fire a ball of compressed wind as a projectile.
    *Dragon''s Fang: Kain flings his spear to strike stab the enemy and can even strike
    them at tight angles. *Dragoon''s Pride: His EX Burst in Dissidia, Kain launches
    himself in the air at incredible speeds, gaining altitude before reaching the
    peak of his jump. With the two moons of his world behind him, he runs his opponent
    through with his lance, leaving behind a beam of holy light that erupts and engulfs
    the opponent. *Gungnir: Kain throws his spear at his enemy, dragging the opponent
    all the way across the arena if it hits or until they slam into a wall or the
    ground before recalling the spear. *Jump: Kain''s signature ability. As a Dragoon,
    Kain is able to leap incredible distances in the air and freely maneuver through
    it, allowing him to come down with the momentum accumulated from his free fall,
    greatly amplifying the strength of his attacks while rendering him virtually impossible
    to hit with most attacks. While equipped with the Dragoon Gauntlets he gains access
    to Double Jump, allowing him to descend upon his foes with even greater speed
    and power. *Lancet: Kain is able to generate a phantasmal spear that impales his
    foe from below, healing him for an amount equal to the amount of damage his foe
    takes. *Rising Drive: Ascends into the air while spinning, drilling his spear
    into his opponent''s body before sending them flying. *Sky Rave: Descends on an
    opponent while spinning, dealing damage multiple times as he twists his spear
    into the target''s body before sending them crashing into the ground. |-|Magic=
    *Blink: Kain casts a spell that causes him or an ally to begin generating afterimages
    as they move, confusing enemies who rely on sight and making it for more difficult
    to land a hit. *Cure: Casts a spell that heals himself of minor injuries. **Cura:
    A more powerful version of cure that heals moderate injuries. *Esuna: Removes
    negative status conditions such as poison, blinding, or paralysis on himself or
    allies. *Haste: Speeds up time around himself or an ally, increasing their effective
    combat speed. *Hold: Kain casts a spell that instantly paralyzes the target, forcing
    them to watch helplessly as Kain attacks them. *Teleport: Warps Kain to a place
    of his choosing, allowing him to evade large-scale attacks. |-|Augments= *Item
    Lore: The user is capable of increasing the effectiveness of both healing and
    damaging items. *Counter: The user automatically counter attacks when they get
    hit by the enemy. *Curse: The user inflicts curse on the enemy, dropping their
    overall stats as a result. *Tsunami: Casts a giant wave of water upon the enemy
    that can potentially cause instant death. *Bluff: The user''s intelligence increases
    drastically, increasing their spell''s effectiveness. *Cry: The user starts crying
    and drops the enemy''s defenses by half. *Dualcast: the user is capable of casting
    two spells at once. *Bardsong: The user is capable of using the bard''s ability
    to sing, being able to use a variety of abilities, such as healing, inflicting
    status ailments on the enemy, or damaging them. *Hide: The user hides from the
    enemy, being undetected while capable of attacking from a distance with throwing
    items and bows. *Recall: The user casts a random spell that can cause random effects
    to the target. *Last Stand and Adrenaline: The user''s strength and defenses increases
    when their health is low. *Fast Talker: The user is capable of casting spells
    at a far shorter time than normal. *Whirlwind: The user casts wind magic upon
    the targets and decreases the target''s innate resistance to fire. *Eye Gouge:
    The user inflicts blind on the target, enveloping them in darkness and messing
    their optical senses. *Analyze: The user is capable of analyzing the target to
    determine their stats, strengths and weaknesses. *Upgrade: The user can mix an
    elemental attack item with their weapons, gaining their innate powers in their
    weapons as a result. *Inferno: The user casts a giant fire spell, damaging all
    foes in the area. *Darkne'
