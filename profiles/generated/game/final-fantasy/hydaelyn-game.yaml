  attack_potency:
    text: Low Multiverse level (Battled a transformed Gilgamesh after the latter had
      already participated in the Dissidia conflicts) | Low Multiverse level (Defeated
      the Cloud of Darkness within the Void who was about to destroy the Source) |
      Low Multiverse level (Significantly stronger than before. Killed the Knights
      of the Round Table as well as Nidhogg) | Low Multiverse level (Defeated Ardbert,
      who is his counterpart, along with the Warriors of Darkness. Killed Hollow Diabolos
      who's power is stated to rival that of the Cloud of Darkness. Defeated the Warring
      Triad whom are stated to possess infinite power) | Multiverse level+ (Defeated
      Zenos after the latter fused with Shinryu. Base Zenos was able to stomp Heavensward
      and Early-to-Mid Stormblood Warrior of Light) | Multiverse level+ (Killed a
      replica of Neo Exdeath who is stronger than the original. Won against Midgarsormr
      Prime whom Omega couldn't beat in his base form. Managed to defeat Final Omega
      who is significantly stronger than its M/F transformation that is much stronger
      than its base form) | Multiverse level+ (Significantly stronger than before.
