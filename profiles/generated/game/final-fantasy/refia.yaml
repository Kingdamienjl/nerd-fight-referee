- id: claim-powers-and-abilities-cf24ea95
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Summoning, Blessed (Has a Crystal with
    her, gaining the abilities of the Crystals as a result), Extrasensory Perception
    (Mages have shown to naturally possess thisFinal Fantasy IV: The After Years),
    Magic, Conceptual Manipulation (Type 2), and Space-Time Manipulation (Magic is
    shown in the novels to remove concepts and warp space and time itself, like the
    Devil''s road, which the concept of time was lost,Final Fantasy IV Novel 1, chapter
    5, page 199 and time and space were twisted to the pointFinal Fantasy IV: The
    After Years Novel, chapter 1, page 67 the past, present and futureFinal Fantasy
    IV: The After Years Novel, chapter 1, page 73 existed as oneFinal Fantasy IV:
    The After Years Novel, chapter 3, page 147), Law Manipulation (Magic is stated
    to rewrite the natural order of thingsFinal Fantasy IV Novel 1, chapter 5, page
    198), Subjective Reality (Magic,Final Fantasy IV Novel 1, chapter 1, page 29 in
    its basest form,Final Fantasy IV Novel 1, chapter 3, page 107 is projecting one''s
    innerFinal Fantasy IV: The After Years Novel, chapter 2, page 109 mind onto realityFinal
    Fantasy IV: The After Years, and is powered by intelligence and mental strength),
    Power Modification (Including Duplication, Fusionism, Statistics Amplification,
    Size Manipulation, Homing Attack, Danmaku, Aura, Breath Attack, and Energy Manipulation,
    Magic users across the games have consistently shown the ability to manipulate
    the shape and properties of their own magical abilities, with even higher tiers
    of spells simply being considered stronger versions of the same basic ability),
    Non-Physical Interaction (Magic as a whole is shown to affect a wide variety of
    different beings, from intangible/immaterial beings to non corporeal beings, to
    abstract concepts like Chronodia, who''s the flow of time itself,Final Fantasy
    I to Nonexistent beings like Exdeath and Cloud of Darkness), Elemental Manipulation
    (Of the Lightning, Teleportation, Ice, and Earth variety), Pain Manipulation (Is
    able to utilize different levels of Lightning spells, which is capable of attacking
    the nervesFinal Fantasy IV Volume 2 Novel, chapter 7, page 54), Gravity Manipulation
    (via Gravity magic, the Haste and Slow spells are stated to control gravitycontrol
    gravity), Radiation Manipulation (via Megaflare, which is statedFinal Fantasy
    IV: The After Years Novel, chapter 5, page 270 numerous times to be a nuclear
    powerFinal Fantasy IV: The After Years Novel, chapter 5, page 271), Martial Arts,
    Elemental Manipulation (Of the Fire, Ice, Lightning, Wind, and Earth variety),
    Darkness Manipulation (Has a weapon made of literal darkness), Levitation (via
    Levigrass shoes), Statistics Amplification (Has numerous spells and items that
    can increase his stats), Information Analysis (via Study and Libra), Death Manipulation,
    Resurrection, Soul Manipulation (via Death and Raise, the Death spell reaps the
    targets soul; killing themFinal Fantasy VI, and the Raise spell can bring back
    a spirit to a deceased body), Purification (Type 3; via Esuna and other curing
    items), Sound Manipulation (via Bard class), Explosion Manipulation (Via Flare),
    Empathic Manipulation and Statistics Reduction (the Viking class allows the user
    to taunt the foe to target them, lowering the target''s defense as a result),
    Healing and Regeneration (Mid-Low), Poison Manipulation and Corrosion Inducement
    (The Poison spell is stated to Corrode the targetFinal Fantasy IV Series Guidebook),
    Durability Negation (The Ultima weapon is made of Orichalcum, a mystical ore that
    can cut through anything), Magma Manipulation, and Black Hole Creation (The Geomancer
    class allows the user to control magma, and create black holes to send enemies
    to another rift), BFR (The teleport/Warp spells are capable of banishing targets
    to the Void, which inflicts the following abilities on the victim: Existence Erasure/Void
    Manipulation, Mind Manipulation (which includes Madness Manipulation (Type 3),
    and Perception Manipulation), Space-Time Manipulation, Time Stop, and Corruption
    (Type 2)), Berserk Mode, Size Manipulation, Attack Reflection Negation (Several
    spells pierce through reflect such as Drain, Tornado, Ultima and Gravity spells),
    Madness Manipulation (Can inflict confusion on the target), Transmutation (In
    the form of transforming others into toads), Petrification, Holy Manipulation,
    Telekinesis (Able to call down meteors), Perception Manipulation (via Blind),
    Teleportation, Forcefield Creation, Time Manipulation (Can speed up time around
    himself), Gravity Manipulation, Absolute Zero (via Shiva), Energy Projection,
    Limited Matter Manipulation (Can manipulate atoms to trigger spontaneous fusion
    explosions through the Flare spell), Biological Manipulation (The Sleep Spell
    and the Hold Spell are capable of affecting the brain''s fundamental functions),
    Blood Manipulation (The Death spell is stated to solidify the target''s blood
    to kill them), Attack Reflection (Can reflect magical attacks with Reflect)'
  source_ids: *id002
  decisive: true
