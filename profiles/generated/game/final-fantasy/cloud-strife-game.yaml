power_scale:
  tier:
    text: '4-B | High 5-A to Unknown | 3-C to Low 2-C, possibly 2-A Name: Cloud Strife
      Origin: Final Fantasy VII Gender: Male Age: 21 (Final Fantasy VII), 23 (Advent
      Children), 24 (Dirge of Cerberus) Classification: Human, Former Shinra Infantryman,
      Mercenary, Successful Sephiroth Clone, Champion (World of Final Fantasy)'
    source_ids:
    - character-stats-profiles-cloud-strife-game
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Solar System level (Capable of fighting Safer-Sephiroth. Has defeated Sephiroth
      with all versions of Omnislash. Notably, at the end of the original game, Cloud
      will briefly surpass Sephiroth's in their battle inside the Lifestream. Fought
      Sora and was implied to be even stronger than him at the time) | Dwarf Star
      level to Unknown (Higher tiered summons like Typhoon or Knights of the Round
      are capable of this level of power) | At least Galaxy level (Traded blows with
      Squall Leonhart, who slew Ultimecia's most powerful Guardians, who are able
      to seal away and junction themselves to the most powerful Guardian Forces and
      are comparable to Seifer in her Castle while all but his normal Junction-empowered
      physical attacks are sealed by their powers) to Universe level+, possibly Multiverse
      level+ (Contended against the Evil Forces led by Exdeath, which contained Sephiroth,
      Cloud of Darkness, and Exdeath himself who posed a major threat to all worlds,
      all dimensions and all of existence itself in a reality that is stated to contain
      infinite universes along with infinite versions of everyone, Dissidia confirms
      that the Final Fantasy reality are all connected between one another in one
      tightly knitted multiverse)
    source_ids:
    - character-stats-profiles-cloud-strife-game
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: FTL+ (Cloud can react to various abilities that move at these speeds such
      as Supernova. Capable of keeping pace with Sephiroth (a character far stronger
      than Bahamut Fury) in all incarnations), Massively FTL+ (Can outpace Sora at
      some occasions and at least keep up with him) | FTL+
    source_ids:
    - character-stats-profiles-cloud-strife-game
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Solar System level (Tanked the awakening of the five remaining Weapons in
      the Northern Crater and survived Sephiroth's Octaslash [Or at least the slashes
      that just moments before parried his original Omnislash] in Advent Children.
      Took hits from Sora) | Galaxy level (Took hits from Squall) to Universe level+,
      possibly Multiverse level+
    source_ids:
    - character-stats-profiles-cloud-strife-game
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Fought entire gauntlets of monsters, for what seem to be hours,
      with no sign of exhaustion. Clashed with powerful enemies under extreme conditions,
      such as fighting off the Remnants of Sephiroth while afflicted with Geostigma,
      a fatal disease whose symptoms include extreme fatigue and bouts of intense
      physical pain; as well as being able to keep going against Sephiroth despite
      sustaining heavy injuries, including being wounded in vital organs)
    source_ids:
    - vsbattles-cloud-strife-game-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range with his swords. Tens of Meters with Limit Breaks,
      much higher with Materia.
    source_ids:
    - vsbattles-cloud-strife-game-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (From the very beginning, even as an infantryman, Cloud displayed
      immense skill and natural talent for swordsmanship and battle. This, furthered
      by his military training and the memories inherited from Zack, led Cloud to
      have full grasp of every aspect of combat and strategy; including Magic, the
      use of Materia, Limit Breaks, and measures for Elemental Attributes and Ailments,
      among many other aspects, to the point, that by very early in the story, he
      could already easily defeat actual SOLDIER members. His knowledge became considerably
      more extensive thanks to his travels and encounters with more dangerous and
      powerful enemies, to the point he eventually branched from emulating Zack's
      fighting style into creating his own with the Fusion Sword, which includes expert
      use, in several different ways, of its various blades of different shapes and
      sizes. This eventually continued even after the events of the original game,
      with his delivery service requiring him to keep facing monsters and other dangers
      during the two years before his battles in Advent Children)
    source_ids:
    - vsbattles-cloud-strife-game-final-fantasy
    confidence: 0.6
    notes: auto_repair source extraction
