- id: claim-standard-equipment-02e88427
  section: equipment
  axis: equipment
  text: "*Zirconiade Summon Materia: Zirconiade's Materia. Of unknown origin, it was\
    \ in possession of Shinra's Science Department and being studied by Professor\
    \ Hojo before beign imbedded in Elf\xE9's body during experiments years before\
    \ she became part of Avalanche. It's currently damaged and can't be used to summon\
    \ Zirconiade and in order to sustain itself it drains Elf\xE9's life. The Materia\
    \ was destroyed alongside the Support Materia after the final battle with Fuhito.\
    \ *The Four Support Materia: Four special Materia with a pyramid pattern inside.\
    \ Also of unknown origin, these Materia can compensate for the damaged state of\
    \ Zirconiade's Summon Materia if the four are used in conjunction with it. While\
    \ this would allow for the summoning to be carried out, the five Materia must\
    \ still be delivered to Zirconiade in person for the summoning to be complete\
    \ and Zirconiade attain its true power."
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
