- id: claim-weaknesses-520c41b8
  section: weaknesses
  axis: weakness
  text: 'Aerith is one of the least physically oriented and one of the least properly
    trained members of the party when it comes to fighting skills, relying on her
    immense magical and spiritual abilities most of the time. Additionally, Aerith
    is surprisingly impulsive and stubborn, rushing into danger without second thoughts
    if something drives her to, as seen when she chased Tifa, whom she didn''t even
    know, to the Wall Market despite Cloud''s protests or when she abandoned the party
    to go to the Forgotten Capital alone despite the danger. Aerith has to be pressed
    in battle to user her Limit Breaks, so most of the time she can''t use them right
    away or repeatedly, however, since her death, and becoming a presence in the Lifestream,
    it''s not known if she has this limitation anymore as the condition of overflowing
    Spirit Energy to use Limit Breaks is one of the physical body. Notable Attacks/Techniques:
    |-|Limit Breaks= Limit Breaks are powerful special moves Aerith can perform in
    battle. All living beings have a portion of the Spirit Energy that flows through
    the Lifestream in themselves, when this energy raises to its limit it eventually
    aligns and overflows allowing to go beyond the user''s normal capabilities and
    reach a much greater power, just as their name indicate. Limit Breaks are affected
    by emotions, intense ones such as rage can lead to attaining the state to use
    these moves much faster than usual. Aerith''s Limit Breaks are rather unique in
    that they are entirely for support and healing and not offensive use, like her
    teammates, with her Spirit Energy granting her abilities very similar to that
    of Magic, and in some cases superior. This could be linked to her nature as a
    Cetra and how they share a closer link to the Planet than regular humans, having
    access to many powers that can only be attained through Materia. Level 1: *Healing
    Wind: Aerith''s Spirit Energy becomes a sky blue breeze that embraces the whole
    party, restoring their health by half their maximum amount. *Seal Evil: Aerith
    raises her staff and her Spirit Energy become sparks that gather on enemies and,
    with a flash, they find themselves frozen in time and silenced. Level 2: *Breath
    of the Earth: Aerith''s Spirit Energy becomes streams of light that surround the
    party and rise from the ground up, healing any ailment they have. *Fury Brand:
    Aerith waves her staff above her and her Spirit Energy becomes a discharge of
    electricity that makes the Spirit Energy of her teammates overflow in the form
    of a sphere, putting them in a state ready to use their Limit Breaks. Level 3:
    *Planet Protector: Aerith spins around and several golden stars engulf the party
    and they are surrounded by a golden aura, making them invulnerable to all damage,
    status infliction and healing for a limited amount of time. *Pulse of Life: Aerith
    throws her staff forward and kneels to pray, causing a gentle light to fall on
    the party healing all wounds and ailments. Level 4: *Great Gospel: Aerith tosses
    her staff and puts her hands together, as rain is called on the party. The downpour
    stops and the clouds above clear, and through the rays of the suns, a trio of
    angels descend leaving their blessing on the party in the form of beams of light,
    healing everyone completely and rendering invulnerable to damage for a limited
    amount of time. |-|Magic= Accessed through the Green Materia, this allows the
    wielder to access the wisdom of the Ancients, the Cetra, and the connection they
    shared with the Planet to use its powers and manifest all sorts of incredible
    powers. These can range from offensive manipulation of the elements, to support
    effects and even powerful healing abilities. Each Magic Materia normally allows
    the use of a specific set of spells (such as Lightning allowing to use Bolt, Bolt2
    or Bolt 3; or Mystify granting Berserk and Confu, both mind affecting spells).
    Notable spells include: Offensive: *Fire3 (Firaga), Ice3 (Blizzaga), Bolt3 (Thundaga)
    and Quake3 (Quaga): Very high-level elemental magic that conjures their respective
    elements for a powerful attack to strike a single enemy or a wide area. *Bio3
    (Bioga): The user cast large bubbles of venomous liquids that drown the enemy
    to inflict heavy damage and leave them poisoned. *Demi3 (Graviga): A powerful
    gravity well is created to drag and crush enemies within it. This spell cannot
    be reflected. *Comet2 (Cometeor): Calls forth several small meteors from outer
    space to strike the enemy four times. This spell cannot be reflected. *Death:A
    spell that conjures a Grim Reaper to instantly kill an opponent. This spell can
    affect robotic enemies and ghosts unless they explicitly resist instant death.
    Healing: *Cure3 (Curaga):The user can restore a large amount of health to themselves
    or their whole party. *Regen: An assist spell that allows the user to gradually
    recover health over time automatically. The speed of the regeneration may vary
    depending on the speed of the target''s time, under the Haste status it''s doubled,
    under Slow'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-713aab99
  section: abilities
  axis: hax
  text: 'Innate as a Mortal= Superhuman Physical Characteristics; Skilled user of
    Staves and Rods; Extrasensory Perception (as a Cetra, she is naturally connected
    to the Planet and can listen to the voice of the Lifestream, gathering new knowledge
    and even telling distant events such as a person''s passing); Telepathy (can communicate
    with others through dreams); Energy Manipulation via controlling her own Spirit
    Energy to grasp different abilities through her Limit Breaks: Healing (via Healing
    Wind, Pulse of Life and Great Gospel); Purification (Type 3 via Breath of the
    Earth, Pulse of Life and Great Gospel); Time Stop and Silence Inducement (via
    Seal Evil) with the addition of Power Nullification (via the Silence Status);
    Rage Power and Empowerment (via Fury Brand); Temporary Invulnerability (via Planet
    Protector and Great Gospel). Non-Physical Interaction (able to hurt and defeat
    the ghost and souls of the fallen Gi Tribe); Regeneration Negation (Up to Low-High,
    the pieces of Jenova, even cells, destroyed by the party are gone for good and
    can''t be used for the Reunion to rebuild Jenova''s body) and Immortality Negation
    Types 2, 3, 6, 7 and 8. Can permanently kill Jenova and her pieces, who aside
    from being extremely durable is able to regenerate from single cells, as well
    as survive as long as just her cells remain, through which she can enforce her
    will, even through other people injected with them. Additionally, can permanently
    finish off the souls and spectres of the Gi Tribe). Resistance to: Soul Absorption
    and Soul Manipulation (as a Cetra her spirit is not absorbed nor diffused upon
    death, and she will join the collective current of souls only if she wishes to);
    Mind Manipulation, Empathic Manipulation and Memory Manipulation (Cetras have
    such a strong individuality that Aerith was unaffected by the Lifestream, managing
    to keep her emotions and memories despite the process that takes away all traces
    of them from each soul to assimilate it in the flow); Corruption (Types 1 and
    2, the Cetra interacted with the Lifestream as part of their daily lives, yet
    despite this exposure to Spirit Energy, they don''t become Makonoids. Additionally,
    Aerith was unaffected by Jenova''s virus despite confronting her directly). Power
    Mimicry and Power Absorption (Limit Breaks are born from the user''s Spirit Energy,
    which shapes their mind and soul, and cannot be copied or imitated, the sole exception
    being Zack who is acknowledged as an unusual case, and even then creates a variant
    of the original move) |-|As a Spirit= All previous abilities, except for physical
    ones, plus: stronger Extrasensory Perception (spirits are freed from the boundaries
    of the flesh, elevating the senses to a higher level and sensing the true nature
    of things) and Clairvoyance (can perceive events and emotions anywhere on the
    Planet); Self-Sustenance (Types 1, 2 and 3); Astral Projection (should she wish,
    she can show herself in the surface as an apparition); possibly Avatar Creation
    (she considered creating extensions of herself, similar to Sephiroth''s Remnants,
    but decided against it); Soul Manipulation, Empathic Manipulation and Memory Manipulation
    (can interact with souls in the Lifestream, restore their individuality and, through
    memories, she can ease the hatred and other negative feelings of those trapped
    in the Negative Lifestream, so they can rest); Purification (Types 1, 2 and 3
    via Great Gospel); Incorporeality. All previous resistances, plus Resistance to:
    Time Manipulation and Time Stop (the realm where the spirits of the dead reside
    in the Lifestream does not really have time, and souls are no longer bound by
    it)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
