power_scale:
  tier:
    text: '{{Low 2-C}}, higher with Willpower | {{Low 1-C}}, higher with Willpower
      | {{1-A}}, higher with Willpower | {{1-A}}, higher with Willpower'
    source_ids: &id002
    - mediawiki-4731572
    confidence: 0.95
  attack_potency:
    text: Universe level+ (Fought and defeated Anahita in a fight to gain her cooperation.
      Defeated an incomplete Lahmu, forcing him to retreat, and can outmatch Artemis,
      who is superior to Quetzalcoatl), higher with Willpower | Low Complex Multiverse
      level (Killed Loki in a battle to get Idun back to safety, a feat in which she
      claims no Asgardian warriors can replicate. Defeated a complete Lahmu, who had
      merged with Sahori Itsukishima, and later killed the latter whose body was possessed
      by him. Singlehandedly vanquished Black Frost, Surt, Ishtar after she was substantially
      empowered by Magatsuhi, in-which she states she possesses the same power at
      her zenith and stated to far exceed Surt, and the Demon King, Arioch, within
      a single day, and Abdiel the next, with the latter admitting that she is ultimately
      no match for him. Forced Zeus, Odin, and Vasuki to submit their keys to reach
      the Temple of Eternity, amongst other Demons such as Amon, Adramelech, and Khonsu),
      higher with Willpower | Outerverse level (Killed an incomplete form of Baal
      (Shin Megami Tensei), followed by Metatron in the Temple of Eternity, along
      with Abdiel, Tsukuyomi, and Nuwa in a race for the Throne, in their Nahobino
      states. Defeated Shiva, who at the time was amplified vastly beyond his normal
      abilities due to spending an unknown amount of time gathering Magatsuhi in order
      to enact Rudra Astra, and fought against the Demi-Fiend, who by the time had
      already become a True Demon and assumed his title as the "King of Chaos."),
      higher with Willpower | Outerverse level (Assumed the power of the Throne of
      Creation that exists at the apex of the three pillars of the Tree of Life and
      at the pinnacle of the highest heaven, being the source of the light of creation
      from which the world is forged, and is himself capable of destroying the Throne.
      Defeated Matter Lucifer, who had consumed YHVH's Knowledge upon defeating Him
      and transcended into a higher plane of existence beyond the heavens and the
      Earth, above even the Throne itself, and consumed his Knowledge, releasing his
      world from the endless eons of the Mandala System)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Speed of Light Reactions and Combat Speed (Should be comparable to Plasma,
      a notably weak demon who can attack using electromagnetic waves), FTL with Sukukaja,
      higher with Willpower | Immeasurable, higher with Willpower | Immeasurable,
      higher with Willpower | Immeasurable, higher with Willpower
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: '{{#tag:tabber|{{!}}-{{!}}Early-Game=Elemental Manipulation (Capable of
      utilizing Fire, Ice, Water, Wind, Lightning), Death Manipulation and Darkness
      Manipulation (With Mudo skills), Light Manipulation and Holy Manipulation (With
      Hama skills), Statistics Amplification and Reduction (Can drastically increase
      his attack to where casual attacks do fatal damage, increase his defense to
      the point where devastating attacks become hindrances, and increase his speed
      to blitz opponents he was previously on par with. Can decrease his opponents
      attack to the point where stomps become fair fights, stone wall defenses can
      be damaged, and blitzes become equalized in speed. Can passively reduce one
      of three stats with Dread), Life and Magic Absorption (Can absorb an opponent''s
      vitality and magic reserves), Mind and Status Effect Inducement (Can directly
      attack the mind of his opponents. Nahobino can paralyze, petrify, curse, charm,
      poison), Power Nullification (Can prevent abilities from activating with Makajam),
      Healing (Can heal himself, and allies with Dia skills) {{!}}-{{!}}Mid-Game=Energy
      Manipulation, Resistance Negation and Existence Erasure (Can use Almighty Attacks,
      which bypass all barriers and reflectors, invulnerability, and resistances.
      Can even negate an opponents resistance to resistance negation with Pierce.
      Almighty attacks are able to hurt someone wielding the Omnipotent Orb, which
      bends the rules of reality to defend the user from attacks. The Megi- line of
      spells is capable of obliterating opponents with a light that erases them "beyond
      death"), Damage Boost and Damage Reduction (Can increase the strength of his
      attacks with Pleroma and Block skills, along with Kannabi Veil), Instinctive
      Reaction (Can automatically avoid Physical Attacks with Evade, and counter instantly
      with Counter), Limited Invulnerability (Can survive one fatal blow with one
      HP, with Endure, or completely negate it with God''s Shield), Forcefield Creation
      and Attack Reflection (Can reflect Physical Skills with Tetrakarn, and Magic
      Skills with Tetrakarn), Resurrection (Can revive allies with Recarm skills,
      and bring himself back to full health with Enduring Soul, negating death) {{!}}-{{!}}Late-Game=All
      previous abilities, far greater than before {{!}}-{{!}}True-Ending=All of Lucifer''s
      abilities, after killing him, and absorbing his Knowledge, just as the former
      did to YHVH and stole his abilities }}'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
