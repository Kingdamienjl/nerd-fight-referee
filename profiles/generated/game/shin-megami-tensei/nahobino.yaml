- id: claim-powers-and-abilities-f6992509
  section: abilities
  axis: hax
  text: Nahobino=Cognitive Physiology, Natural Weaponry, and Master Swordsman (Capable of wielding an
    energy blade from his finger tips, and using it with masterful profiency), Acrobatics (Shown to be
    incredible agile, doing backflips with ease), Observation (Type 1), Extrasensory Perception (Humans
    are capable of sensing Demons, and Aogami can sense energies, another's presence, and objects far
    away), Fusionism (Capable of fusing with Aogami to become Nahobino), Flight (Capable of flying), Non-Physical
    Interaction, Durability Negation, Healing Nullification, Immortality Negation (Type 2, 3, and 7),
    and Invulnerability Negation (Capable of interacting with Demons, which are invisible beings comprised
    of data and information, the fulcrum of the entire verse proper, a concept synonymous to souls, minds,
    and even concepts. Even entities devoid of time and space, and nonexistent bodies such as The White
    can be struck down. Can completely negate their invulnerability to conventional weaponry, and the
    requirement of needing to be on a specific informational frequency to harm, as well as Septentriones,
    which require spiritual attacks to harm, and as well as killing undead beings and regenerative entities,
    such as Nagas and Blobs), Accelerated Development, Supernatural Willpower, and Reactive Evolution
    (Battle, Leveling, and Training; Physical Stats, Magic, and Improved Resistances. Humans are able
    to get more powerful after defeating strong demons or even as they are in the middle of battle, even
    against opponents ontologically superior to them, are able to grow massively in strength in the span
    of merely a day's time or less, either through resolve, the threat of death, or training, or the bonds
    they hold dear), Power Absorption and Power Mimicry (Can absorb a Demon's essence, and abilities),
    Social Influencing (Humans throughout the series have been able to persuade demons to join their cause
    and ally with them, regardless of their alignment, through words alone, or exchanges and deals), Law
    Manipulation and Reality Warping (Capable of utilizing Miracles, powerful abilities that alter the
    laws of the world) |-|Inherited Skil
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
