    text: Superhuman. Capable of taking on hordes of Demons without rest, meanwhile
      using abilites that drain him of his mental stamina without breaking much of
      a sweat, along with the harsh conditions of Da'at. Only reached a perlious situation
      after he was blindsided by Lahmu.
