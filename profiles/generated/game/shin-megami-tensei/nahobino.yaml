      in-spite of having no known prior combat experience, Nahobino is an extremely skilled combatant,
      capable of contending with Gods and Demons who existed before and beyond time, and kill conceptualized
      embodiments of war in battle, such as Kali, who on her lonesome, dispatched an entire of Asura,
      Chi You, Futunushi, Siegfried, Odin, along with precognitive opponents, like Eligor, and rapidly
      able to grasp the extent of his power either through physicality & magic. Nahobino utilizes elemental
      magic, light and dark, and a myriad of ailments, evolving endlessly to where God ordered the Condemnation
      on beings like him due to his power)
