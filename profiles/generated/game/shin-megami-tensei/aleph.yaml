  attack_potency:
    text: Multi-Continent level (Defeated King Frost, who is capable of freezing the
      entire world with his power, and later did battle with far stronger enemies
      such as Betelguese and Daleth, the latter of whom he easily defeated multiple
      times) | Low Complex Multiverse level (Broke bonds that could restrain Amaterasu,
      who should be comparable to fellow Mother Goddesses such as Ouroboros. Defeated
      Raphael and Uriel simultaneously, and proceeded to kill Michael before destroying
      the false projection of YHVH created by the combined energies of the Three Archangels'
      faith) | Outerverse level (Can defeat Vairocana and kill Beelzebub, as well
      as control Shiva and Parvati, alongside their fusion, Ardhanarishvara. Fought
      and defeated Lucifer in the Law and Neutral Routes, wounding him so gravely
      that he died moments after their fight, and is capable of destroying the one-headed
      form of the Kuzuryu at this point of the game. Can defeat Satan, who states
      Aleph is the most powerful human that opposes God and His forces. Defeated YHVH's
      local manifestation, and can wield Masakado's katana and armor) | Outerverse
      level (Comparable to the other Messiahs, including Nanashi, and can fight against
      an unrestrained Stephen alongside them, although the latter was more amused
      and satisfied by their performance than significantly injured at the aftermath
      of the fight)
    source_ids:
    - mediawiki-4768808
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Speed of Light Reactions and Combat Speed (Should be comparable to Plasma,
      a notably weak demon who can attack using electromagnetic waves) | Immeasurable
      Reactions and Combat Speed | Immeasurable Reactions and Combat Speed | Immeasurable
      Reactions and Combat Speed
    source_ids:
    - mediawiki-4768808
