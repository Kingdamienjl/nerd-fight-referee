  intelligence:
    text: 'Genius. Designed the gunship she uses in Metroid Prime 3, combining both
      Federation and Chozo technologyMetroid Prime 3: Corruption (2007) - Logbook,
      Hunter-Class Gunship. Won an infamous inter-planetary spaceship race through
      the hardest course in the galaxy, against some of the galaxy''s most skilled
      pilots, despite all of them being out to kill her, her ship being sabotaged
      and the top competitor being armed with her Speed BoosterSamus and Joey: Metroid
      Extreme (2004) - Chapter 5. Hijacked and learned how to pilot a Space Pirate
      ship in secondsMetroid: Zero Mission (2004) - Ending. * Combat Skill: Even by
      her first game outing, Samus was thought to be the greatest bounty hunter in
      the universeMetroid: Zero Mission (2004) ManualMetroid Prime Trilogy (2008)
      - Art Booklet, a hotly contested title that she has held onto ever since. She
      has saved the galaxy multiple times from otherwise invincible threats of various
      kinds, won the Galactic Federation entire wars with her actions and become universally
      dreaded by the otherwise fierce Space Pirates. ** Marksmanship: Samus'' suits
      enhance her aiming capabilities with a targeting systemMetroid Prime (2002)
