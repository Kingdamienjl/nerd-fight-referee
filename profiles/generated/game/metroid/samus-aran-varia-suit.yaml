    text: 'At least Street level+ (Capable of jumping incredibly high even at a young
      age as well as defeating several armed guards with her bare hands), Building
      level with Paralyzer (While Samus'' emergency Paralyzer pistol cannot hurt the
      likes of Space Pirates, it''s still capable of destroying large metal blocks)
      | At least Town level, possibly Small City level (Powered a large bomb converted
      into a rocket with her Power Beam. Caused and withstood the explosive eruption
      of a large undersea volcano. Jumped at very high speeds), at least Town level+,
      possibly Small City level with stronger weapons (Samus'' Super Missiles, as
      well as other comparable attacks such as the Shinespark, are three times more
      powerful than her basic weapons such as the Power BeamWhile Samus'' weapon power
      should remain relatively consistent between keys, by the Varia Suit key most
      of her loadout is equal or superior to her Super Missiles, and her durability
      is comparable to their power. Thus, the durability feats she performs are not
      affected by the multiplier granted by ADAM''s statement) | At least Country
      level (With the Gravity Suit Samus could defeat the Diggernaut, a Chozo robot
      that could kill her in a single hit when she wore just the Varia Suit, on its
      own powerful enough to withstand a massive nuclear explosion, destroy Raven
      Beak''s small suns, kickstart a massive volcanic eruption that rendered the
      sky pitch-black as far as a village could see and defeat Knight, who withstood
      a massive explosion. Superior to the Federation Force, who beat a boss capable
      of causing significant seismic activitiesMetroid Prime: Federation Force (2016)
      - Mission 14) | At least Country level (Equipped with the Gravity Suit), far
      higher with Hyper Beam (Reversed a losing battle against Mother Brain, easily
      defeating her when she was previously defeated with little effort. Unable to
      hurt Silver Space Pirates with her normal gear, but can one-shots them with
      the Hyper Beam) | At least Country level (Equipped with the Gravity Suit) |
      Country level (Equipped with the Varia Suit), Star level (Could counter Greed''s
      enormous black holesSamus and Joey: Metroid Extreme (2004) - Chapter 12), up
