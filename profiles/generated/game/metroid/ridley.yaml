- id: claim-powers-and-abilities-db846e62
  section: abilities
  axis: hax
  text: 'Ridley= Superhuman Physical Characteristics, Large Size (Type 0. While Ridley''s
    exact size has varied between appearances, he''s usually shown as being roughly
    three times Samus'' height, while hunched over), Regeneration (Low-Mid. Survived
    his battle with Samus on SR388, despite his cybernetics blowing up, forcing him
    to abandon themMetroid: Samus Returns (2017) - Post-Credits Scene, only to show
    up later in Super Metroid, fully healed. Shown to regain his usual coloration
    moments after having his life force sucked out by the infant Metroid. Survived
    injuries that would be lethal even to him by feeding on human corpses), Plasma
    Manipulation, Fire Manipulation and Breath Attack (Ridley is capable of unleashing
    a wide variety of flaming plasma attacksMetroid Manga (2002) - Chapter 16 from
    his mouth), Explosion Manipulation (Can shoot fireballsMetroid: Other M (2010)
    - Ridley Boss Battle that explode across the ground), Bodily Weaponry (Ridley
    uses his fangs, claws and sharp tail, which is dexterous enough to grab and strangle
    foesMetroid Manga (2002) - Chapter 9, in battle), Flight, Stealth Mastery (Capable
    of concealing his presence from SamusMetroid Prime 3: Corruption (2007) - Intro,
    NorionSuper Metroid (1994) - Ridley Boss Battle [Ceres Space Colony]), Enhanced
    Senses (Could smell Samus'' noradrenaline through the Power SuitMetroid Manga
    (2002) - Chapter 8), minor Animal Manipulation (Ridley''s screeches are capableMetroid:
    Other M (2010) - "Prey" [cutscene] of sending other creatures into a berserk stateMetroid:
    Other M (2010) - The "Deleter" [cutscene]), Organic Manipulation (Ridley''s clone
    was shown to have stuck his former body to a wall with thick purple webs as he
    molted out of itMetroid: Other M (2010) - Samus discovers the molted remains of
    Ridley''s adolescent body [cutscene]), Transformation and Statistics Amplification
    (Ridley''s clone has the ability to enter a temporary transformation where it
    is immune to most of Samus'' attacks, though her Super Missiles will hit him hard
    enough to knock him out of this state immediately), Adaptation and Resistance
    to Acid Manipulation (Underwent genetic modifications to survive in Zebes'' environmentMetroid
    Manga (2002) - Chapter 9, granting him an increased adaptability to her surroundingsMetroid
    Manga (2002) - Chapter 2 and protecting him from the acid rain of CrateriaMetroid
    Manga (2002) - Chapter 11), Resistance to Temperature Manipulation (Unaffected
    by the heat of Lower Norfair, which damages Samus unless she has the Gravity Suit
