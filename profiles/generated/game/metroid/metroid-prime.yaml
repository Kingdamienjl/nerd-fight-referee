      of repeating somersaults,Metroid Prime (2002) - Frigate Orpheon upwards kicks
      while sliding, wall-jumps and dashing slides even on slanted ground.Metroid
      Manga (2002) - Chapter 6 Shown to use the jets on her back to haltMetroid Dread
