  attack_potency:
    text: Moon level (Despite her strength being a shadow of Mythra's, Pyra is able
      to contend with the likes of Brighid, who was Mythra's rival in the past), higher
      as Mythra (Repeatedly battled Malos, who is superior to his Gargoyles, which
      are this strong. Her clash with Malos was stated to have sunk three great titans
      into the Cloud Sea's bed, which was later backed up by Pyra herself. Aegis Blades
      are also stated by Pyra herself to be able to destroy the world), far higher
      with Pneuma's Sword (Far stronger than before, with Addam being unable to handle
      her newfound power. Clashed with Malos and eventually obliterated him, sinking
      Torna in the process) | Complex Multiverse level (Far stronger than before after
      Pneuma's awakening. Should not be far inferior to Mythra, and should be comparable
      to the likes of Nia and Tora), higher as Mythra (Was prepared to fight True
      Form Jin without transforming into Pneuma and is implied to have done so for
      a period of time) | Complex Multiverse level (Should be stronger than Pyra and
      Mythra after her awakening, due to being their final form. Receives her power
      from the Conduit, which draws its power from the Far-Flung Dimension, a 6-dimensional
      realm)
    source_ids:
    - vsbattles-mythra-xenoblade-chronicles-2
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At least Relativistic+, likely Speed of Light (Mythra uses natural light
      to attack, stated to move at light speed, and Pyra herself could keep up with
      Brighid, who was Mythra's rival) | Massively FTL+, likely Infinite (Should be
      comparable to the likes of Nia and Tora. Mythra also kept up with True Form
      Jin, and Pyra should be comparable to her in speed) | Massively FTL+ (Superior
      to Telethia who are capable of fighting against entities who are this fast)
      likely Infinite (Should be superior to Future Redeemed Rex who could keep up
