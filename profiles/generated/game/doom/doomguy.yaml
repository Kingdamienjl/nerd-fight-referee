    which possess and take over the souls of those they ram into) *Technology Manipulation
    (None of his tech-based equipment are affected by the presence of demons, which
    can subvert technology) *Acid & Toxins (Can wade through the remains of Mancubi
    without being harmed. The innards of Mancubi are revolting, toxic, and contain
    biotoxins that are corrosive) *Diseases (C'
