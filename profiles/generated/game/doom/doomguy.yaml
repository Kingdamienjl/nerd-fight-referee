  section: equipment
  axis: equipment
  text: '{{Border|Scroll=Yes|Visible=No|Content= *Space Survival (Can survive in the
    vacuum of space with his armor) *Explosion Manipulation (The Rocket Launcher can
    deliver explosive rockets that can turn several baddies inside-out) *Energy Manipulation
    & Plasma Manipulation (Both the Plasma Rifle and BFG 9000 shoot plasma that can
    even fry demons) *Fire Manipulation (The Plasma Rifle can act as a flamethrower,
    shooting out a torrent of fire) *Heat Manipulation (His weaponry can burn the
    demons of Hell, even though they are native to Hell where the very matter itself
    is described as incendiary. Even Arch-Viles, who are literally made of fire) *Light
    Manipulation (With The Unmaker) *Statistics Amplification (The Berserk power-up
    acts as a super adrenaline rush, enormously boosting the muscle power of the user]
    by ten times) *Healing & Purification (Health Potions provide a small boost to
    the health of the user, even past their normal limit. Stimpacks give the user
    a quick injection of booster enzymes. Medkits include bandages, antitoxins, and
    other medical supplies to make the user feel a lot healthier. Soul Spheres are
    objects that provide a large boost of health to the user, along with completely
    energizing them, making them feel more energetic than ever before. Mega Spheres
    are a combination between Soul Spheres and combat armor, giving both a massive
    boost in health and armor. Berserk Packs also heal you alongside acting as a super-adrenaline
    rush) *Invisibility (Blur Artifacts are strange orbs that makes the user difficult
    to be spotted by others) *Invulnerability (The Invulnerability Artifact renders
    the user immune to all damage for a brief period of time. This is done by it diffusing
    Argent plasma to the basal layer between the dermis, creating a tough film of
    bioplasma beneath the skin) *Clairvoyance (With the Automap Device, his view is
    replaced with a textured top-down map of everything he has seen of the area to
    date. He can zoom in, zoom out, and mark his location with it. He can update his
    Automap with Computer Maps, giving him a complete map of the entire area, including
    all secret or hidden areas) *Perception Manipulation (Blur Artifacts can blur
    the vision of the user) *Spiritual Armor (A special kind of armor that provides
    protection above and beyond normal armor) }}}} {{!}}-{{!}}Resistances= {{Border|Scroll=Yes|Visible=No|Content=
    *Essence Manipulation (Hell''s Essence & Sentinel Energy; Can survive in Hell
    for extended periods of time, Hell passively drains the essence out of the mortal
    creatures in it. "Essence" is a conceptual force that governs all of reality,
    including realms like Hell, and is responsible for the existence of one''s soul,
    memory, will, intelligence, mind, strength, and abilities, down to their essential
    natures. Can endure the fire-based attacks of demons, which can burn souls. Can
    also endure physical attacks, including bites, from demons, who are implied to
    be capable of devouring souls. Is immune to the effects of Lost Souls, Can remain
    relatively unaffected by the magic of Arch-Viles, which allow it to control the
    minds of others. Is immune to the effects of Hell Magic which can directly affect
    concepts; Forged the essence of mortal suffering to form the Icon of Sin. Buff
    Totems are incarnal manifestations of human suffering, formed from the tortured
    resonance of the once living. Was once able to turn the hatred of humans into
    an intoxicating energy. Was used to make physical material out of corruption and
    death) *Hellfire Manipulation, Acid Manipulation & Radiation Manipulation (Withstood
    radioactive toxic waste. Can casually survive on Mars with no issue during the
    events of DOOM 64, during this time Mars was infested with apocalyptic levels
    of radiation) *Madness Manipulation (Type 3; Immune to the negative effects of
    gateways, which induced a strange form of insanity into whoever entered them,
    turning them violent while babbling vulgarities) *Reality Warping & Law Manipulation
    (Can exist near the Icon of Sin with no negative effects, which warps reality
    and damages the intricate order of the universe just by existing]. Doomguy has
    also generally been fighting demons for lengthy periods of time, which passively
    corrupt reality, converting it into a reality similar to Hell) *Transmutation
    & Corruption (Generally resistant by Hell Magic, which once transformed hate into
    energy. Unaffected by the energy of Screecher Zombies, which can malform the bodies
