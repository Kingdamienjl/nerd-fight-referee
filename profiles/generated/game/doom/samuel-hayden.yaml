        also created. A mega-computer that exceeded the computational ability of any
        system before it and is the first truly autonomous AI. VEGA is a powerful
        "self-taught" AI that is unprecedented in AI theory, with it creating; a more
        effective method for processing Argent plasma into Argent Energy, better analysis
        theorems and even designed new Argent compression schema, allowing for the
        development of Argent Caches and Argent Accumulators. VEGA''s design is so
        complex that the study of its inner workings has been given its own field
        of study - VEGAcore Physics. Before he died, he completed the detailed instructions
        and designs for his new robotic body: a bionic automaton with a plasmatronic
        processing core (a biomechanical brain) along with specific instructions on
        specific parts of his brain. Samuel Hayden completed his Masters in Theoretical
        Physics at Oxford University and showed prodigious talent in several fields
        of science including thermodynamics, electromagnetic theory and nuclear sciences.
        At a young age he established the Samuel Hayden Foundation, a philanthropic
        organization dedicated to sponsoring young scientific talent and funding scientific
        programs in schools and colleges. He also took leadership of the UAC after
        a few months. Regularly creates technology that runs on Argent Energy, a fuel
        source made of extra-dimensional resources that requires an understanding
        beyond traditional science unrestrained by the repressive thinking of dimensionally
        bound contemplation to work. When Samuel Hayden was appointed as Project Director
        of the Argent Facility, Argent technology exploded, achieving work that destroyed
        the boundaries of our understanding of physics, "We rewrote the book and called
        it Argent" as Samuel himself said it. Is at least comparable to the other
        Seraphs if not smarter since he is favored by the Father for his intelligence.
        The Seraphs were able to create the Luminarium, a machine that can resurrect
        the dead by manipulating the energies and very nature of creation to harness
        powers that lay between dimensions. Also comparable to the Maykrs, who have
