  durability:
    text: At least Small Building level, likely far higher (Able to withstand hits
      from the Cyberdemon. Can take blasts from the BFG9000, but early incarnations
      are left severely weakened as a result) | Multi-City Block level (Capable of
      withstanding blasts from the BFG9000, granted when weakened it is incapable
      of surviving a fully-charged shot at point-blank range inside its mouth)
    source_ids:
    - mediawiki-spider-mastermind-doom
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Infinite (The demons of Hell have limitless aggression and are tireless
      beings)
    source_ids:
    - mediawiki-spider-mastermind-doom
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range physically. Several Meters with explosives, electricity,
      and telekinesis. Kilometers with its chaingun, and is likely capable of engaging
      enemies at similar distances with its other ranged weapons.
    source_ids:
    - mediawiki-spider-mastermind-doom
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: At least Genius (Led the invasions of both Earth and Mars at the same time.
      It is an exceptionally skilled computer hacker that can cut off any communications
      between Earth and Mars before the UAC could realize what was going on; likely
      comparable to Samuel Hayden)
    source_ids:
    - mediawiki-spider-mastermind-doom
