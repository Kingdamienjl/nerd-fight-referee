    notes: auto_repair source extraction
  attack_potency:
    text: At least Small Building level, likely far higher (Consistently portrayed
      as one of the most powerful demons in the series. It is the only enemy from
      the original games who is capable of killing the Cyberdemon on its own. Can
      easily kill Classic Doomguy regardless of amps) | Multi-City Block level (Should
      at least be as powerful as the Cyberdemon from the same game)
    source_ids:
    - mediawiki-spider-mastermind-doom
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Subsonic+ movement speed, at least Supersonic combat speed and reaction
      (Easily comparable to Doomguy, but slightly less agile than the Cyberdemon)
      | At least Supersonic+ (Far swifter than its classic self. Comparable to other
      Demons)
    source_ids:
    - mediawiki-spider-mastermind-doom
    confidence: 0.6
    notes: auto_repair source extraction
