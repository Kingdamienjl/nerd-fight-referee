power_scale:
  tier:
    text: At least {{9-A}}, higher with most melee weapons, his personal swords, Hidden
      Blades and firearms, and even higher with the Shroud of Eden
    source_ids: &id002
    - mediawiki-633862
    confidence: 0.95
  attack_potency:
    text: 'At least Small Building level+ (As a fully-fledged Isu-Hybrid, he should
      be comparable in strength to the rest of the protagonists in the series. Fought
      off and killed Duncan Walpole, a former Master Assassin-turned-Templar, all
      while heavily injured from a blast that destroyed his previous ship, with Master
      Assassins being at the very least comparable to Altaïr and Ezio in strength.
      He can fight against and easily defeat those who can harm him and have comparable
      durability, and can also harm himself. Can tear apart metal padlocks with a
      single punch or kick, break furniture in half,Assassin''s Creed IV: Black Flag
      (2013)- Lively Havana and can force open locked chests with just a single kick.
      Can casually shove his pistols into skulls. Equal to his quartermaster and best
      friend Adéwalé, who fought against Shay Cormac. Can hold his own against bull
      sharks, overpower crocodiles and easily fodderize jaguars. Overpowered and killed
      Bartholomew Roberts, a Sage, with ridiculous ease), higher with most melee weapons,
      his personal swords, Hidden Blades and firearms (Killed El Tiburón by repeatedly
      shooting him. His guns are capable of easily penetrating multiple skulls in
      a single shot. His swords can easily break open metal locks and cut through
      metal), and even higher with the Shroud of Eden (The Shroud of Eden significantly
      enhances the user''s base abilities to significantly higher levels)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: At least Supersonic+ (Shouldn't be much slower compared to most other Isu-Hybrids
      like Ezio, Altaïr, Adéwalé, his son Haytham or his grandson Connor. Capable
      of easily dodging gunshots from flintlocks and muskets at point-blank range
      in a similar fashion to Connor. Dodged shots from Charles Vane's pistols. Equal
      to and fought on par with Bartholomew Roberts, who would be equals to another
      fellow Sage, François-Thomas Germain, and wouldn't be much slower than the Isu),
      higher with the Shroud of Eden
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'At least Class 5 (Can easily overpower fully-mature American crocodiles,
      which weigh in at an average of 450-500 kg, in a wrestling match, and crocodiles
      have lifting strength several times greater than their body weight. Also equal
      in strength to Adéwalé. Can hold back bull sharks for a while and easily fodderize
      jaguars in a wrestling match. Effortlessly moved a large beam stuck into place
      by himself underwater.Assassin''s Creed IV: Black Flag (2013)- Diving For Medicines
      Easily wrestled with Roberts several times during their confrontations and always
      overpowered him. Can swing around massive battle-axes with ease and elegance.
      Capable of tearing apart chains,Assassin''s Creed IV: Black Flag (2013)- Tattoo
      TV Spot metal locks and bilboesAssassin''s Creed IV: Black Flag (2013)- The
      Treasure Fleet all by himself with his bare hands alone, which would require
      this much force at the very minimum for normal iron chains alone. Is unaffected
      by hurricane-force winds and can easily maintain near-perfect control of his
      ships while inside violent storms. His fight with Duncan Walpole resulted in
      the latter''s Hidden Blades being completely bent out of shape), higher with
      the Shroud of Eden'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At least Small Building level+, higher with the Shroud of Eden
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'At least Small Building level+ (Brushed off being shot multiple times at
      point-blank range right in his vital points, has easily survived extremely high
      falls without fracturing his bones and has tanked massive explosions from cannonballs,
      exploding gunpowder barrels and grenades that easily destroyed massive stone
      beams,Assassin''s Creed IV: Black Flag (2013)- Marooned scaffoldings and huge
      portions of massive warships at the same time without any armor multiple times
      in a row, easily making him this durable at the very minimum, with the exact
      same barrels being used throughout the Kenway Saga. Is equals with Adéwalé,
      and shouldn''t be much weaker than his son Haytham and his grandson Connor.
      Should be on par with other Isu-Hybrids, who can hold their own against Olympos
      Projects, withstand bombs this powerful and tank cannonballs of these levels.
      Easily withstood the defensive energy beams of the Observatory that can simultaneously
      vaporize upto three human beings at the slightest touch and reduce them to a
      bloody mist, said energy beams operating in the same exact way and sharing the
      same properties as the Isu''s own energy blasts and other Pieces of Eden like
      the Sword, Staff, Spear and the Koh-i-Noor. Can withstand swivel gun shots,
      which can punch through the Mayan Armor''s defenses), higher with armor sets
      and the Mayan Armor (The Mayan Armor is essentially immune to any small projectiles
      that hit him and is bulletproof. As it is made of the same materials as the
      rest of the Pieces of Eden, it should also be comparable to them in terms of
      durability, with Pieces of Eden being able to damage the likes of the Minotaur
      and Darius), and even higher with the Shroud of Eden'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: 'Superhuman (Capable of single-handedly clearing a Spanish galleon and blitzing
      everyone on board. Survived multiple near-death experiences where he was involved
      in massive explosions tossing him into the ocean, and he is also capable of
      holding his breath underwater far longer than most humans. Also capable of engaging
      in long and dangerous ship battles lasting over several hours while suffering
      from many injuries and extreme fatigue. Defeated Charles Vane and captured a
      fishing schooner on his own after being stranded on a deserted island for four
      months. Can also continue fighting as usual when tortured to the point of starvation
      for months on endAssassin''s Creed IV: Black Flag (2013)- To Suffer Without
      Dying), Infinite with the Shroud of Eden'
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, Extended Melee Range with equipment, Several Meters
      with guns
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (According to Blackbeard he ranks amongst the most clever of all
      the pirates of the West Indies. An extremely talented sailor by his own merit,
      was also recognized as one of the greatest Assassin leaders the British Brotherhood
      had ever seen or known. Even when he had just started his career his athletic
      and combat prowess were more than enough to easily kill the likes of a highly-trained
      Master Assassin like Duncan Walpole and even rival the Brotherhood's prowess
      in stealth, something which increased even more after he officially joined the
      Brotherhood back in England)
    source_ids: *id002
    confidence: 0.95
