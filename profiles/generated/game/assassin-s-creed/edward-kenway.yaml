  section: weaknesses
  axis: weakness
  text: 'Standard human weaknesses, but has survived situations that would kill peak-level
    humans. Was initially only motivated by greed for money, forgetting completely
    about his family, until he witnessed the death of his loved ones. Unable to run
    while using Eagle Vision to search for targets. The Mayan Armor can''t repel larger
    projectiles from the likes of swivel guns and cannons. Was also noted by Jennifer
    in the Unity novel to have grown weaker and slower due to his age and having received
    an injury a few years prior to his death. Note: The Assassin''s Creed: Awakening
    manga is a completely separate continuity in the Assassin''s Creed franchise,
    and as such, should be considered non-canon to the games, comics and the novels.
