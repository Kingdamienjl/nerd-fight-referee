  durability:
    text: "At least Small Building level+ (Tanked cannonballs slamming into him multiple\
      \ times in a row. Took multiple hits from Rodrigo Borgia and his Staff of Eden\
      \ and survived being sent flying by its power, and also survived being stabbed\
      \ by the latter, with the Pope now being able to overpower Apple clones on his\
      \ lonesome. Can tank his own bombs at point-blank range with no damage. Should\
      \ be on par with most other Isu-Hybrids, who can tank explosions on these levels,\
      \ fight with the likes of Darius, take hits from Olympos Projects like the Minotaur\
      \ and no-sell energy Isu energy beams powerful enough to vaporize three human\
      \ beings and reduce them to a bloody mist at the slightest touch, said energy\
      \ beams having the same properties and even working in the exact same manner\
      \ as the energy-based powers of the Isu themselves, their technology and all\
      \ of their Pieces of Eden, like the Sword, Spear, Staff and the Koh-i-noor),\
      \ higher with armors (Both the armor sets of Alta\xEFr and Brutus are basically\
      \ equal in terms of functionality and durability, with Alta\xEFr's armor having\
      \ brushed off the same cannonballs as Ezio himself, as he later got the armor\
      \ back from Monteriggioni's ruins in pristine condition sometime after Cesare's\
      \ death, and Alta\xEFr's armor is made of the same technology and materials\
      \ as the rest of the Pieces of Eden) and the Staff of Eden. Building level+\
      \ with the Naval Cannon and the Tank (Both the tank and naval cannon could casually\
      \ no-sell cannonballs that could one-shot gigantic buildings and fortress walls\
      \ with ease. Can withstand their own firepower)"
    source_ids:
    - vsbattles-ezio-auditore-assassin-s-creed
    confidence: 0.8
    notes: auto_repair source extraction
  stamina:
    text: 'Superhuman (Went on for several decades hunting down the killers of his
      father and brothers with little rest, food or water. Has survived being stabbed,
      shot and thrown off tall buildings multiple times and still managed to fight
      at full power as if nothing happened to him, such as when a Staff-amped Rodrigo
      Borgia stabbed him through his armor, merely calling the stab as something his
      armor brushed off,Assassin''s Creed Brotherhood (2010)- Mass Exodus and when
      he got shot at multiple points of his body and fell from several storeys right
      after and still managed to later on and blitz several armed guards without issue,Assassin''s
      Creed Brotherhood (2010)- Emergency Exit later on freerunning throughout the
      Auditore crypt, and in the ensuing conflict, not once did he suffer from exhaustionAssassin''s
      Creed Brotherhood (2010)- Modern Day: Auditore Crypt Singlehandedly blitzed
      and wiped out several enemy regiments during the Battle of Viana.Assassin''s
      Creed Brotherhood (2010)- Pax Romana Easily defeated hordes of mercenaries in
      several fistfighting competitions that extended multiple rounds, and Ezio won
      all of them without ever tiring. Even after being stabbed in the side, Ezio
      managed to wipe out every single enemy before falling unconscious.Assassin''s
      Creed Reflections Issue #1 Ezio''s abilities overall, gave him legendary status
      among the Roman Thieves Guild,Assassin''s Creed Brotherhood (2010)- Guild Challenges
      (Thieves, Challenge 2)Assassin''s Creed Brotherhood (2010)- For the Fans so
      far as going to convince some of the members to believe that Ezio''s freerunning
      skills were exaggerated, and blatantly impossible for someone his age, forcing
      him to prove otherwise.Assassin''s Creed Brotherhood (2010)- Up To SpeedAssassin''s
      Creed Brotherhood (2010)- Young At Heart By the time he was 52, word had reached
      Constantinople of his feats, leaving even the best Assassins there in awe of
      his amazing endurance, with some even claiming him to still have the strength
      and speed of a twenty-year-old.Assassin''s Creed Revelations (2011)- The Vizier,
      Part 1 One of his most notorious feats of endurance involves him sprinting at
      top speed for over 300 meters uninterrupted and still appear completely unexhausted.Assassin''s
      Creed Revelations (2011)- Guild Challenges (Thieves, Set 1) Even in old age,
      he managed to overpower several heavily armed Chinese men with only a fireplace
      poker and managed to do immensely strenuous acrobatic maneuvers while suffering
      from several ailments and handicapsAssassin''s Creed: Embers)'
    source_ids:
    - vsbattles-ezio-auditore-assassin-s-creed
    confidence: 0.8
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Extended Melee Range with equipment, Several Meters
      with throwing knives, a few Tens of Meters with the Apple of Eden (He could
      only use it to kill a few large group of guards before the energy drain became
      too much for him to handle), several Tens of Meters to possibly Hundreds of
      Meters with his Hidden Gun and Crossbow. Several Hundreds of Meters with war
      machines and Greek Fire. Several Kilometers with cannons
    source_ids:
    - vsbattles-ezio-auditore-assassin-s-creed
