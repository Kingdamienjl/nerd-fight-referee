  durability:
    text: At least Small Building level+ (Tanked being hit by catapults multiple times.
      Capable of tanking his own bombs exploding at point-blank range, having done
      so multiple times in his quest for the Chalice. Regularly no-selled bridges,
      scaffoldings and other sturdy structures collapsing on him. Took multiple hits
      from Al Mualim and his clones made by the Apple of Eden, emerging triumphant
      in the end, with Apple clones being able to easily harm the likes of Kassandra
      and also being able to take multiple direct hits from the Staff of Eden, which
      can easily draw blood from Ezio even with the latter having Altaïr's armor equipped.
      Should be on par with most other Isu-Hybrids, who can tank attacks of this magnitude
      and no-sell energy beams that are powerful enough to simultaneously vaporize
      three humans at once and reduce them to a bloody mist, said energy beams having
      the same properties and even working in the exact same manner as the energy-based
      powers of the Isu themselves, their technology and all of their Pieces of Eden,
      like the Sword, Spear, Staff and the Koh-i-noor), higher with his armor (His
      armor was capable of easily withstanding hits from the Staff of Eden, and was
      built via technology from the Apple of Eden, as seen when Ezio used it against
      Rodrigo Borgia in December 1499. A few days later in January 1500, as the Siege
      of Monteriggioni was carried out, it was directly struck down by cannonballs
      that could easily destroy entire fortress walls and reduce buildings to splinters,
      and was left completely undamaged, as seen when an older Ezio later returned
      to pick it up and use it for his later travels after Cesare's death, with the
      armor itself still being in pristine condition, and Ezio himself tanked the
      same cannonballs during the Siege of Viana twice in a row) | At least Small
      Building level+ (Not much weaker than before, took blows from comparable enemies
      while in this state) | At least Small Building level+ (Considerably superior
      to his younger self. Because of this, he eventually sent his armor away, no
      longer needing it for protection, and also because he feared that its technology
      was far too dangerous even for modern-day combat)
    source_ids:
    - vsbattles-altair-ibn-la-ahad-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Even when grievously injured and profusely bleeding Altaïr still
      refused to back down and proceeded to fight hordes of guards as if nothing happened
      to him during his journeys in Mongolia in the 1220s and on his return to Masyaf
      in 1247. Even before he ascended to the rank of Master Assassin, during the
      events Altaïr's Chronicles he was already capable of clearing entire fortresses
      full of soldiers without any sign of exhaustion or ever stopping in his tracks,
      all in the matter of a single day) | Below Average Human (Can barely walk) |
      Superhuman (Altaïr retained the same stamina that he had in his youth due to
      his renewed training)
    source_ids:
    - vsbattles-altair-ibn-la-ahad-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Extended Melee Range with swords, several Tens of
      Meters with throwing knives, several Hundreds of Meters with bullets, at least
      several Kilometers with the Apple of Eden, possibly far higher (Could easily
      cover entire cities if he chose to, his Apple clones could easily dispatch of
      enemies from Masyaf Castle to as far as the Masyaf gates without even trying)
    source_ids:
    - vsbattles-altair-ibn-la-ahad-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Extraordinary Genius (Altaïr was raised at the Assassin fortress at Masyaf
      and quickly rose through the ranks of the Order to become one of the most respected
      and feared Assassins in the Brotherhood, second only to its leader, Al Mualim.
      A cold and objective man, Altaïr fully devoted himself to whatever course he
      chose to pursue. He had a proud nature, and was often impetuous, demanding,
      arrogant, and impatient. However, after his failure at Solomon's Temple and
      commencing on a mission to redeem himself, Altaïr began pondering the motivations
      of his targets after listening to their final words. Altaïr was a Master Assassin,
      capable of extraordinary acrobatic feats and versed in the application of deadly
      arts. Trained extensively, he was able to overcome any obstacle, human or terrain,
      climb the tallest towers and leap from the highest ledges without a hint of
      fear. Like other Assassins, he was also trained in stealth assassination techniques,
      hand-to-hand and weapons combat, and blade throwing. His noncombat skills included
      climbing, urban acrobatics, eavesdropping, interrogation, and pickpocketing.
      He also had extensive knowledge of Holy Land politics and religion, which helped
      him better understand his opponents. Once he gained access to the Apple's powers,
      he begain introducing new techniques to all the fields required for an Assassin
      to be perfect, like stealth, disguise, killing from the shadows, reconnaissance,
      combat skills, adaptability, advanced weaponry, using advanced tactics and much
      more. According to Niccolò Polo, at the age of 92 Altaïr retained the same strength;
      stamina and skill he had in his youth, possibly due to renewed training when
      he reclaimed the title of Mentor. Altaïr also possessed Eagle Vision, a "sixth
      sense" or intuition that allowed him to see a person's true intentions. Due
      to this gift, Altaïr had heightened intuitive abilities and senses, along with
      his sharpened fighting skills. Altaïr's skills made him one of the most deadly
      and adept Assassins in the Order's history, and they were legendary even after
      his death. Altaïr was also a skilled artist, and his Codex was heavily illustrated.
      In it he drew blueprints for Hidden Blade modifications; manuals for assassination
      techniques, maps, and even a detailed sketch of his wife, Maria, bordered with
      hand-drawn flowers. Due to his extensive research on the Apple thanks to his
      extremely fast learning skills, he had written several thousands of books dedicated
      to the Apple's knowledge alone in an extremely short amount of time and even
      made a library for them using advanced materials that even steel could not penetrate.
      As mentioned in his final confrontation with Abbas, Altaïr claimed to have seen
      many things about life, death, the past and the far future, thoroughly indicating
      that Altaïr had even learned about modern technology itself. He had invented
      advanced alloys as new materials for his Hidden Blades, alloys that were rare
      even in the modern world, and he even built an armor set far more advanced and
      lighter than anything else existing in the modern world, and he destroyed its
      formula in fear of the technology being too powerful for mankind to use. He
      was even trying to uncover the true origins of human life and why they existed,
      but having just started in the last years of his life, this meant that he would
      never finish his work. Even in death he would still occasionally hallucinate
      with the immense amount of knowledge he had gained in his entire lifespan and
      when spending a few moments on the Apple alone)
    source_ids:
    - vsbattles-altair-ibn-la-ahad-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
