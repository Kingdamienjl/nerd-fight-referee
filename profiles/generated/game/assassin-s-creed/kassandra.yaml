power_scale:
  tier:
    text: At least {{9-A}}, higher with Rage Mode, the Spear of Leonidas, Sword of Damokles and Staff
      of Hermes, even higher after unleashing her true Isu potential | At least {{9-A}}
    source_ids: &id002
    - mediawiki-2233974
    confidence: 0.95
  attack_potency:
    text: "At least Small Building level+ (As a direct descendant of the Isu via Leonidas I and being\
      \ the biological child of Pythagoras who wielded the Staff of Hermes at the time, she should easily\
      \ be vastly superior to most other Isu-Hybrids like Alta\xEFr Ibn-La'Ahad and Ezio Auditore. Can\
      \ trade blows with those who can harm her. Casually demolished a gigantic wooden doorway by hurling\
      \ a man through it. Afterwards, she traded blows with Darius, who rammed her through a building\
      \ floor. Has also traded blows with defeated various Greek mythical beasts, including the Minotaur,\
      \ which can do this), higher with Rage Mode, the Spear of Leonidas, Sword of Eden and Staff of Hermes\
      \ (Fought against the Isu in Aletheia's simulation, which was designed to replicate the real Isu's\
      \ power in full to help her master the Staff's power. In the wrong hands, the Staff of Hermes would\
      \ bring about complete destruction of entire cities, as it did to Atlantis. Easily defeated Barnabas's\
      \ Apple of Eden-generated clones, which should put her on par with Alta\xEFr and Bayek, Kassandra\
      \ having done so a few days after the Apple permanently disabled her Spear), even higher upon unleashing\
      \ her true Isu potential (Can use the powers of the Isu and become one of them once she unlocks\
      \ her Isu DNA's true potential). Can negate durability with many of her abilities and her Spear\
      \ | At least Small Building level+ (Is a golden eagle, can easily kill deers and other large animals\
      \ with a single talon swipe. Also on par with Kassandra and Pythagoras)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: At least Supersonic+ (Can swat aside arrows in the same exact manner as Bayek and can also run
      faster than them. On par with many Greek mythical beasts and beings, who should be comparable to
      the Isu, and even dodged and outran attacks from Alexios and Pythagoras, including their full-powered
      blasts and retaliated with twice as much power without any hindrance. Easily snuck up on Layla Hassan
      without triggering any alarms or being seen by any security cameras. Kept up with the Medusa, who
      could move fast enough to leave blurs behind and even appear like she's teleporting) with Superhuman
      swimming speed (Can easily outpace great white sharks while underwater), higher with Rage Mode,
      Bull Rush and Defensive Maneuvers, Archery Master (Kassandra's surroundings can slow down while
      she prepares to attack in mid-air, and even arrow shots appear slow to her eyes) Skills via Spear
      of Leonidas, Hypersonic with the Staff of Hermes (Fought on par with and is equal to Eivor, who
      is this fast. Before this, as part of her training, she easily kept up with the simulations of Isu
      like Hermes himself and Hades, and could even block their energy beams. Also uncovered Isu Precursor
      Boxes to unlock her Sixth Sense to master the Staff's powers. Later effortlessly outpaced multiple
      of Barnabas's Apple-generated clones) | Subsonic (Golden eagles can achieve diving speeds of upto
      150 mph) with at least Supersonic+ combat speed and reactions (Can easily dodge attacks from Kassandra,
      Pythagoras and other comparable enemies)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class 5 (Can do the same feats as Bayek. Can casually send people twice her weight
      class flying with a single uppercut. Can push back and wrestle with large animals like great white
      sharks with her attacks. Wrestled with and defeated the Kretan Bull, who dwarved other ordinary
      cattle and even horses in terms of size alone, and also defeated other gigantic animals. Can easily
      move around even when her entire body is turned to stone. Pushed back and defeated the Minotaur,
      who could easily rip apart humans, wield a gigantic axe far too large and heavy for any man to use,
      and casually walk through Precursor stone, and she could even deflect his full-powered attacks without
      much trouble, and after she killed him she took up his axe as her own personal weapon. Later defeated
      Brontes and took up his gigantic stalagmite for her own use. Also pushed back and wrestled with
      a Staff-Amped Pythagoras. Should also be vastly superior to normal peak humans like Kyros of Zarax
      and Milo, both of them being able to lift massive pillars on their lonesome. Should be considerably
      stronger than her descendants, like Aya), higher with the Spear of Leonidas and the Staff of Hermes
      (Later easily overpowered multiple of Barnabas's Apple-generated clones) | Above Average Human (Should
      not be much weaker than most other golden eagles)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At least Small Building level+, higher with Rage Mode, Spear of Leonidas and the Staff of Hermes.
      Can ignore conventional durability via many of her abilities | At least Small Building level+ (Can
      injure enemies comparable to Kassandra herself. Can easily kill gigantic elk with a single talon
      swipe)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least Small Building level+ (Survived being thrown off a high cliff as a child without any
      injury; Can hold her own against great white sharks; Was completely fine after being rammed through
      a floor by Darius; Can go toe-to-toe with several Greek mythical beings and beasts like the Kretan
      Bull, Medusa and many more and survive their attacks, and also took hits from the Minotaur, who
      can generate this much energy. Can run on lava unhindered. Withstood full-powered attacks and blasts
      from Deimos and Pythagoras while they were equipped with their Pieces of Eden. Was only knocked
      unconscious by a gigantic tree falling on her. As she is a direct descendant of the Isu containing
      higher Isu genes than usual, she should be superior to most other peak-level Isu-Hybrids, who can
      tank explosions on these levels, brush off cannonballs and catapulted rocks with minimal damage
      and effortlessly no-sell Isu energy beams that are powerful enough to vaporize three human beings
      and reduce them to a bloody mist at the slightest touch), higher with armors, Rage Mode, Spear of
      Leonidas and Staff of Hermes (Can take considerably far higher amounts of damage than before. Can
      take hits from Aletheia's simulations of the Isu, and also from Apple-generated clones and those
      amped by the powers of the Apple), even higher with Ares' Last Breath (Temporarily becomes invulnerable
      to all types of attacks) | At least Small Building level+ (Has survived several run-ins with many
      wild animals in her entire lifespan and survived all of them. Only died because of old age)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Can run countrywide distances without stopping even when critically wounded. Can
      keep up in multiple battles for days while heavily injured and still not show any signs of fatigue).
      Infinite with the Staff of Hermes (No longer requires to eat, breathe or sleep) | Extremely High
      (As enduring as Kassandra)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, Extended Melee Range with swords and dagger sets, Several Meters with
      weapons and the Staff of Hermes, higher with its extending powers, several Tens of Meters with shockwaves
      from her Spear, up to Tens of Meters (30 meters with Athena's Sight), Hundreds of Meters with arrows
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius (Trained from a young age to fight as a Spartan, Kassandra was a highly skilled warrior
      able to wield a variety of weapons, use stealth to silently assassinate enemies and free run to
      climb and overcome most physical obstacles. She was also capable of correctly answering the riddles
      posed to her by the Sphinx. She had a great deal of knowledge on every innovation and discovery
      which have happened in her immensely long lifespan, such as being able to recognize Layla's device.
      She even knows of all historical information as well as many secret societies she has borne witness
      to during her immensely long lifespan) | (Quite High for an animal, can understand human speech
      quite well and is extremely protective of Kassandra and Pythagoras)
    source_ids: *id002
    confidence: 0.95
