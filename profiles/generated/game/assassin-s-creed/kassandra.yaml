- id: claim-weaknesses-020d136d
  section: weaknesses
  axis: weakness
  text: "Standard human weaknesses, but has survived situations which would kill most peak-level humans,\
    \ and once gaining access to the Staff of Hermes, most of these weaknesses are eventually removed.\
    \ The Spear of Leonidas will eventually run out of power, requiring to be recharged with special artifacts,\
    \ but it is still nonetheless a very formidable weapon, never losing its edge (It was eventually fully\
    \ repaired for future generations at the Forge of Hephaistos). Some of her abilities last for a short\
    \ amount of time and require a certain amount of her own body adrenaline to activate, which she then\
    \ needs to recharge by engaging in combat. Kronos Time Shift can only stop time for 3 seconds. Due\
    \ to the amount of time that has passed since obtaining the Staff of Hermes, Kassandra will die once\
    \ she willingly passes on the staff to her next successor or if it is forcibly taken away from her\
    \ (however, both entities will have to touch the Staff at the same time for this to happen) | Standard\
    \ golden eagle weaknesses. Extremely protective of Kassandra and her family Notable Attacks/Techniques:\
    \ Kassandra was capable of defeating multiple enemies simultaneously. Kassandra was able to wield\
    \ a myriad of weapons ranging from swords, bows, spears, and axes. Kassandra did not rely on a shield\
    \ for protection, instead being able to easily deflect enemy attacks. A master of stealth, Kassandra\
    \ was able to silently assassinate her targets undetected and was also able to utilize the foliage\
    \ of bushes to remain hidden from her enemies. She also proved proficient in the use of the Spear\
    \ of Leonidas which aided her in silent assassinations. A skilled freerunner, Kassandra was able to\
    \ scale the statue of Athena in Athens as well as natural elements with relative ease. She also proved\
    \ to be a strong swimmer whilst searching the ruins of underwater shipwrecks and was capable of holding\
    \ her breath for a relatively long period of time. Kassandra shared a symbiotic relationship with\
    \ her eagle, Ikaros, which aided her in reconnaissance thanks to her Eagle Vision. Unlike later Assassins\
    \ such as Alta\xEFr Ibn-La'Ahad, Ezio Auditore da Firenze, and Desmond Miles, Kassandra's Eagle Vision\
    \ was far more literal in the sense that activating the ability allowed her to see through the eyes\
    \ of Ikaros. With the Staff of Hermes which was passed on to her by her father Pythagoras, she was\
    \ rendered immortal and remained unchanged for far longer than two thousand years. She could even\
    \ cause the Staff of Hermes to transform into anything she chooses, such as a lantern. Other abilities\
    \ she possessed with the Staff and Spear are as follows: {| cla"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
