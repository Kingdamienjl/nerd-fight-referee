  durability:
    text: "At least Small Building level+ (Took hits from Apple of Eden clones in\
      \ his fight with Flavius, with Apple clones being able to easily harm Alta\xEF\
      r Ibn-La'Ahad, who is this durable, and Rodrigo Borgia, who can injure the likes\
      \ of Ezio even with the latter having the Armor of Alta\xEFr equipped, with\
      \ both Ezio and the Armor being this durable on their lonesome. Also fought\
      \ against the zombies of the pharaohs and giant scorpions generated by the Apple,\
      \ which are superior to ordinary Apple clones, and can also survive having his\
      \ spine crushed by them; Easily swatted aside Hypatos's attacks; Can survive\
      \ falls from over 25m multiple times in a row without any ill effects; Should\
      \ be comparable to his wife Aya, who tanked and blocked blows from The Guardian,\
      \ who could easily pulverize marble pillars with a single blow of his hammer,\
      \ and an Artifact-amped Lucius Septimius who could easily create massive craters\
      \ in the ground with his strikes and was now on par with the Isu; Should be\
      \ comparable to most other Isu-Hybrids, who can easily no-sell explosions of\
      \ these levels and tank energy beams powerful enough to vaporize three human\
      \ beings and reduce them to a bloody mist at the slightest touch), higher with\
      \ armor, shields, Rage Mode and Dash Boost | At least Small Building level+\
      \ (Took many lethal injuries on the level of Bayek and still kept going as if\
      \ nothing happened to her. Was even able to fly back to Rabiah to be nursed\
      \ back to health despite her advanced age)"
    source_ids:
    - vsbattles-bayek-of-siwa-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Can continue sprinting with ease even after being heavily injured
      and can keep sprinting countrywide distances in the intense desert heat non-stop.
      Once had his stomach sliced open by Bion, a ruthless assassin, multiple times
      in a row and could still hold his own against him somewhat, succumbing only
      after being thrown into a river, but was still capable of somewhat fighting
      on par with him for a lengthy period of time mere days later despite the wound
      still not having healed fully yet. Is generally unresponsive to any kind of
      pain he receives. Can survive being stabbed repeatedly and still manage to blitz
      and mercilessly slaughter entire garrisons of Roman fortresses without issue.
      Has been relentlessly tortured and even buried alive in hot desert sands, and
      he still managed to escape and recuperate without any medical aid. Set out on
      a year-long hunt for his son's murderers, seldom stopping to eat, drink or sleep
      in his incredibly dangerous and arduous journey through the desert, suffering
      from severe cuts and contusions and having lost a great deal of blood, finally
      collapsing from exhaustion after killing Rudjek, only to receive minimal medical
      aid and then get back to getting even more injuries before his return to Siwa.
      Capable of easily triumphing in intense gladiator battles under the desert heat)
      | Superhuman (Has survived similar situations as Bayek and was still possessing
      enough energy to fly back home to Siwa to be nursed back to health)
    source_ids:
    - vsbattles-bayek-of-siwa-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Extended Melee Range with swords, dagger sets, axes,
      maces and spears, Tens of Meters with fire bombs, Hundreds of Meters with arrows
      | Kilometers (Senu's eyesight should at the very least be on par with other
      birds-of-prey. Inapplicable in combat, her eyesight is only useful in recon
      situations)
    source_ids:
    - vsbattles-bayek-of-siwa-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted. He is regarded as the man who was responsible for laying the foundations
      of what would eventually become the Assassin Brotherhood. As a Medjay, Bayek
      was a highly skilled warrior trained in the arts of combat, he was able to engage
      multiple opponents simultaneously. Bayek was able to wield a variety of weapons
      ranging from khopesh, swords, spears, bows, axes and utilized shields for protection.
      A skilled freerunner, Bayek was able to scale the great pyramids of Egypt and
      the lighthouse of Alexandria as well as natural elements with relative ease.
      He also proved to be a strong swimmer whilst searching the ruins of underwater
      temples and was capable of holding his breath for a relatively long period of
      time. Having been trained by Kensa, Bayek was a skilled hunter, capable of killing
      several animals ranging from snakes, hippos, and crocodiles. With several decades
      of combat experience as a Medjay, armed with expertise in assassination, stealth,
      parkour, swimming and usage of several weapons on such a level that he can duel
      with and finish off multiple opponents at any given time regardless of their
      class or their combat experience. Is an extremely skilled detective. | Gifted.
      Senu was highly obedient of her master and could easily keep track of many objects.
      Could understand human speech, and would dive in to attack enemies if they threatened
      her master or his loved ones.
    source_ids:
    - vsbattles-bayek-of-siwa-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
