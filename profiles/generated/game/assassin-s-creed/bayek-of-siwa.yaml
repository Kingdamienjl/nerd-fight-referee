  attack_potency:
    text: "At least Small Building level+ (Should be comparable in strength to Alta\xEF\
      r Ibn-La'Ahad, as both of them fought against the clones of the same Apple of\
      \ Eden used against them as confirmed in the Infographics encyclopedia- Apple\
      \ of Eden #2 to be exact, Bayek having done so in his fight with Flavius Metellus\
      \ and Alta\xEFr having done so in his fight with Al Mualim, with Alta\xEFr being\
      \ this durable, and Apple clones are also capable of harming Kassandra and Rodrigo\
      \ Borgia, the latter being able to hurt and stagger Ezio Auditore da Firenze\
      \ with his punches, with Ezio being this durable. Later also went toe-to-toe\
      \ with various supernatural beings like the zombies of past pharaohs and giant\
      \ scorpions generated by the Apple, all of which are vastly superior to ordinary\
      \ Apple clones and can kill him within 4-5 hits. Capable of easily smashing\
      \ through pillars with a single punch. Capable of trading blows with those who\
      \ can harm him and can stagger them with his parries, and can also harm himself,\
      \ as seen when he scarred himself with an arrow to rub off Rudjek's name. Killed\
      \ a heavily-armored elephant with nothing but a rapid-fire bow), higher with\
      \ his Hidden Blade, melee weapons, bows, bombs, shields, ballistae, Rage Mode\
      \ and Dash Boost | At least Small Building level+ (Can easily injure enemies\
      \ comparable to him)"
    source_ids:
    - vsbattles-bayek-of-siwa-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At least Supersonic+ (Capable of casually slicing arrows shot at him at
      point-blank range, and can also deflect ballista shots at similarly close ranges,
      though can get staggered for a while due to the ballista's immense force. Can
      easily outrun charging lions and somewhat keep up with gazelles. Can even outswim
      crocodiles while in water. Casually dodged Khaliset's arrows simply by sidestepping
      and could even outpace them, and Khaliset could fire arrows on par with him.
      Reacted to and blocked a throwing knife at close range. Easily blitzed and defeated
      Flavius despite the latter's repeated attempts to slow him down and his repeated
      usages of Apple clones, and Flavius could easily dodge his arrows at point-blank
      range just by walking. Bayek also managed to dodge and outrun the Apple's energy
      blasts. Has also kept up with the zombies of Pharaohs generated by the Apple
      of Eden, who are capable of easily overwhelming him, and are also vastly superior
      to normal Apple clones, which can keep up with Ezio, who himself can dodge bullets
      and block arrows at point-blank range. Should be on par with the rest of the
      Isu-Hybrids) with Superhuman swimming speed (Can easily outpace crocodiles and
      hippos while underwater), higher with Rage Mode, Dash Boost and the Elite Ranger
      Skill (Bayek's surroundings can slow down while he prepares to attack in mid-air,
      and even arrow shots appear slow to his eyes. Can easily shoot multiple bows
      within this period before his enemies can even realize that something even happened,
      said enemies can also view arrows as slow, and can move so fast that even the
      Apple of Eden's omni-directional blasts appear near-frozen to his eyes) | Subsonic
      (Can easily achieve dive speeds and flight speeds of this level. Should not
      be much slower than golden eagles in this regard) with at least Supersonic+
      combat speed and reactions (Can easily dodge attacks from enemies comparable
      to Bayek)
    source_ids:
    - vsbattles-bayek-of-siwa-assassin-s-creed
    confidence: 0.6
    notes: auto_repair source extraction
