  intelligence:
    text: "Gifted (Having been raised in Kanatahs\xE9ton, Connor became a skilled\
      \ free runner at an early age, being able to climb trees and swing from one\
      \ to another, as well as scale cliff faces or other natural elements. He could\
      \ move through the cityscape just as easily and be able to slide under or vault\
      \ over obstacles within urban environments) During his youth, Connor had received\
      \ minimal combat training from the Kanien'keh\xE1:ka, becoming a young warrior\
      \ of the tribe. He wielded a tomahawk and dagger; also, he honed his skill with\
      \ a bow to the point where he could target any opponent and strike from a far\
      \ distance. Yet, he was still capable of holding his own against entire garrisons\
      \ of enemies with significantly higher combat experience than him. After being\
      \ mentored by Achilles, Connor's abilities increased significantly, and he eventually\
      \ became a Master Assassin, trained in the ways of stealth, swordsmanship, observation,\
      \ pickpocketing, and lock-picking. He was able to wield several different weapons,\
      \ including a tomahawk, bow, sword, dagger, flintlock pistols, poison darts,\
      \ rope darts, and Hidden Blades. He could dual-wield various combinations of\
      \ these weapons, with his ambidexterity helping him to do so proficiently. In\
      \ terms of weaponry, Connor possessed the Pivot Blade which became a deadly\
      \ tool in his arsenal as it aided him in combat as well as hunting Connor was\
      \ also skilled in unarmed combat, being able to overpower multiple opponents\
      \ at a time. If there was a possibility, he utilized the surrounding objects\
      \ to his advantage, such as chairs, tables, or barrels, to cripple his opponents.\
      \ His heavy build gave him an edge in combat but impeded his free-running abilities,\
      \ albeit by a negligible amount. He was so fast that he could easily dodge musket\
      \ fire. Also, his bulky build allowed him to overpower and kill multiple enemies\
      \ in mere seconds without hesitation. He could kick hard enough to even send\
      \ enemies twice his size, flying several meters into the air. As a child, he\
      \ was significantly strong enough to lift a log all by himself when he ran to\
      \ save his mother. Like his father, he could easily tear apart metal locks with\
      \ a single punch. Also, Connor was a capable swimmer, able to swim great distances\
      \ with relative ease. Connor also grew to be an efficient hunter, utilizing\
      \ his tracking skills and traps to hunt down various animals he encountered\
      \ across the Frontier, such as elks, cougars, wolves, bobcats, and bears, with\
      \ minimal effort. Connor was strong enough to go head-to-head with bears and\
      \ elks head-on and even push them back with his bare hands. Additionally, Connor\
      \ possessed the rare extra-sensory ability known as Eagle Vision, which he could\
      \ use to help identify clues and track down enemies. Tutored by Robert Faulkner,\
      \ Connor became a skilled captain, sailing the Aquila on multiple occasions\
      \ and was capable of fending off rogue waves. During these voyages, Connor recovered\
      \ a Shard of Eden buried by William Kidd on Oak Island, which granted him immunity\
      \ to stray gunfire. Connor was a skilled leader and battle commander, winning\
      \ many critical battles for the colonial army. Robert Faulkner mentioned Connor\
      \ was a fast learner, and he was able to add many skills to his repertoire.\
      \ While at times brash or impulsive, Connor was quite intelligent, learning\
      \ many languages and was a skilled military strategist. Connor understood politics\
      \ and made efforts to improve conditions for his people with the colonists.\
      \ He also made the homestead a thriving trade community."
    source_ids:
    - vsbattles-connor-kenway-assassin-s-creed
    confidence: 0.8
    notes: auto_repair source extraction
