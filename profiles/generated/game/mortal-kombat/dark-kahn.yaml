- id: claim-powers-and-abilities-d83ac374
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Master Martial Artist (Inherits from Shao Kahn, as he
    possesses his skill and fighting styles) * Regeneration (Low-Godly; Inherits from Shao Kahn) * Immortality
    (Type 1, 3 & 6; Inherits from both Shao Kahn and Darkseid, his consciousness will still exist and
    attempt to possesses others body) * Self-Sustenance (Types 1, 2 & 3) * Energy Manipulation (Can amplify
    some of his attacks with yellow energy surrounding him) * Magma Manipulation (Can blast opponents
    with molten rock projectiles) * Light & Sound Manipulation (Capable of generating blinding yellow
    flashes of light and deafening thunderclaps) * Weapon Mastery (Has access to Shao Kahn''s hammer,
    which he wields as skillfully as him) * Limited Invulnerability (Via kombat rage, Dark Kahn can make
    himself invincible for a short duration of time) * Telepathy & Empathic Manipulation (Can talk telepathically
    with others in their head and through his kombat rage, he can manipulate others minds to turn against
    even their allies and succumb them into madness, has done it on all heroes and villains of both universes,
    can even do it on a whole race, like the Tarkatans, from which Baraka is a part of) * Perception Manipulation
    (Made Sonya believe that Jax was Kano, as well as Liu Kang think that Batman was Shang Tsung) * Flight
    (Shown the capability of flying) * Reality Warping (was warping both the Mortal Kombat and DC universes
    into one by his mere existence) * Attack Reflection & Forcefield Creation (Can generate a barrier
    which can send attacks back to the opponent, he also shown he can reflect attacks back with his hand)
    * Teleportation (shown the ability to teleport) * BFR (Dark Kahn has teleported characters from both
    universes into each other''s universe) * Possession & Incorporeality (Dark Kahn consciousness can
    possesses others body even after he was destroyed) * Statistics Amplification & Reduction (Can amplify
    and reduce the power of others) * Summoning (Can summon Shao Kahn''s Wrath Hammer) * Existence Erasure
    (Was responsible for the disappearance of certain characters from both Mortal Kombat and DC, as he
    erased their existence) * As a fusion of Shao Kahn and Darkseid, he should have all their powers and
    abilities as well.'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
