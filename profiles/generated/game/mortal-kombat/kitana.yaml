- id: claim-powers-and-abilities-9d5c8d26
  section: abilities
  axis: hax
  text: "Human= Superhuman Physical Characteristics, Martial Arts (Skilled in Edenian fighting styles,\
    \ an ancient acrobatic fighting style with hints of Chinese wushu and ballet moves), Weapon Mastery\
    \ (Well trained in tessenjutsu, but also uses b\u014Djutsu and sai daggers. Can control her weapons\
    \ from afar without holding them), Stealth Mastery (Skilled assassin and spy), Enhanced Senses (Sensed\
    \ Jade while she was sneaking on her and staying hidden), Acrobatics (Hypermobility, Self-Momentum,\
    \ Surface Running. Can somehow defy gravity [without using her powers] for a short moment to perform\
    \ additional jumps, run up walls and leap off of them, etc.), Magic (Her powers are that of Edenian\
    \ magic), Flight (Restricted flight), Longevity (Edenians have long lifespans, even after ~10,000\
    \ years they have still remained as adults), Can interact with her past self, but will share with\
    \ it irreparable damage and death (As shown throughout MK11), Social Influencing (Convinced the Tarkatans\
    \ and their leader to leave Kronika's side and join the forces of Outworld together, despite them\
    \ having prior knowledge of their grim future under Outworld's leaders), Air Manipulation (Can summon\
    \ gusts of wind to form deadly tornados for many purposes, such as deflecting incoming projectiles),\
    \ Teleportation (Can instantly teleport over short distances in a burst of magic. Can use Mileena's\
    \ sai to teleport with her pink portals), Damage Boost (Can boost the damage of her fans) |-|Revenant=\
    \ All previous abilities, Immortality (Type 7), Self-Sustenance (Type 2)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
