- id: claim-weaknesses-0922f677
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attack/Techniques: *Energy Rings: Shoot a ring of energy. *(Air) Energy
    Rings: While in the air, shoot a ring of energy. *Leg Grab: Grab the opponent and throw them. *Kiss:
    Blow out a blinding kiss. *Arc Kick: Perform an arcing leap kick. *Military Stance: Enter a stance,
    gaining access to new moves. **Grab: Sonya slams the opponent''s face on her knee. She knocks them
    away with a spinning elbow. **Rising Kick: Sonya does a low kick and cartwheels backwards, launching
    nearby opponents. **Double Kick: Sonya cartwheels forward, launching nearby opponents. *Garrote Parry:
    Parry attacks with your garrote. **Freedom Strike: Sonya wraps her garrote wire around the opponent''s
    arm and neck. She uses this as leverage to throw them behind her, slamming them on her knee. Lastly,
    she punches them away. **Eagle Strike: Sonya wraps her garrote wire around the opponent''s neck and
    turns them around. She stomps the back of their knee causing them to kneel before knocking them up
    with a knee strike. She jumps up with the opponent and punches them down. **Justice: Sonya wraps her
    garrote wire around the opponent''s neck. She launches herself towards them and climbs up to their
    shoulders. They both spin around for a bit before slamming them down with a frankensteiner. **Stiff
    Neck: Sonya wraps her garrote wire around the opponent''s neck. She flips over them in a cartwheel
    motion and hits them with their backs. *Frag Grenade: Throw an explosive grenade. *Stun Grenade: Throw
    an electrocuting grenade. *Drone Drop: Receive a grenade resupply. *Drone: Call in a flying drone
    to assist in Kombat. **Park Drone: Stop the drone in place. **Heavy Blast: Fire a close range blast
    of electricity. **Homing Missile: Fire a homing orb of electricity. **Kamikaze: Fly towards the opponent
    and self-destruct your drone. **Low Kamikaze: Fly towards opponent''s feet and self-destruct your
    drone. *Ass Whooping: Throw a flurry of attacks. **Sonya will throw a straight punch to the gut, followed
    by two punches and a knee strike to the face before tossing them behind her. *Air Control: Grab airborne
    opponents and slam them. **Sonya will punch the opponent thrice before grabbing them by the shoulders
    to slam them down face first. *Leg Breaker: Perform a leg takedown. *(Air) Ops Drop: Gain an air grab.
    **Sonya will attack airborne opponents by pushing them down to the floor before punching them twice
    in the face. She finishes them off with an energy charged axe handle punch. *Krushing Kounters: Gain
    a standing and low parry. **Standing Kounter: Kounter high and mid attacks. ***When activated, Sonya
    will retaliate by climbing onto their back and uses her weight to roll them down to the floor. She
    grabs their arm and breaks it. She can also finish them off by stomping on their face once she gets
    up. **Low Kounter: Kounter low attacks. ***When activated, Sonya will retaliate by grabbing their
    leg and using it to flip them up, causing them to fall on the floor. She then crushes the opponent''s
    chest with her boot. She can also finish them off with a crushing front flip. *Energy Rings Charge:
    Gain the ability to charge amplified Energy Rings. *(Air) Downward Energy Rings: Can alter the angle
    of amplifed (Air) Energy Rings *(Air) Soaring General: Perform a flying kick while in the air. **Sonya
    can grab airborne opponents after kicking them. She will then perform a suplex that crashes them down
    together. *K.A.T. Turret Drop: Call down K.A.T. Turret to deal damage. *Summon K.A.T. Turret: K.A.T.
    Turret will appear and assist in Kombat. **Detonate K.A.T.: Self-destruct your drone, dealing damage.
    **K.A.T. Tantrum: Tackle the opponent and shoot them. *Turret Trauma: K.A.T. gains additional lethal
    turret attacks. **Mortar Strike: Fire an arcing bullet. **Straight. 50 Kal: Fire a straight bullet.
    **Leaping .50 Kal: Leap up and fire a straight bullet. *(Air) Marching Orders: Gain the ability to
    perform a double hitting attack while in the air. *Thigh Master: Sonya does a Leg Grab that separates
    their legs from their body and slams the body into the ground with such force, the face is rubbed
    off from contact with the ground. (MKX) *Boot to Head: Sonya tricks the opponent into grabbing her
    leg and spins around, delivering a counter kick to their head which decapitates them. (MKX) *Garro-That:
    Sonya parries her opponent and performs a Stiff Neck, wrapping her garrote around them, and decapitating
    them. (MKX - Covert Ops Variation) *Time Bomb: Sonya throws a frag grenade at her opponent which explodes
    and obliterates their torso, sending the arms and head flying elsewhere. (MKX - Demolition Variation)
    *Kamikaze: Sonya calls her drone to do a Kamikaze into her opponent. It skeletonizes the opponent''s
    head and torso with the explosion. (MKX - Special Forces Variation) *Pain and Agony: Sonya does her
    X-Ray move, with the neck break in the end of the move resulting in decapitation. *X-Ray (SF Beat
    Down): Sonya initiates her move with a series of punches and ki'
  source_ids: *id003
