- id: claim-powers-and-abilities-a7afc7d9
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Martial Arts, Weapon Mastery, Stealth Mastery, Acrobatics,
    Preparation, Summoning (Can call in her drones with a radio or any of her communicative devices) Energy
    Projection with her wrist device/power gloves (Fires a pink energy beam that can be coiled around
    objects before destroying it, the beams are implied to have heat as they can cauterize wounds. This
    energy can be infused into her fists to boost their damage), Explosion Manipulation with C4 charges
    and frag grenades (Should be noted that some of her frag grenades have a fuse time to them and that
    some of them are implied to be sticky grenades), Electricity Manipulation with stun grenades (Upon
    detonation, these grenades release a powerful electrifying current that can paralyze those caught
    in the blast) Flight, Two fully automatic machine guns, Explosion Manipulation (Via missiles. Said
    missiles can lock onto their targets), Self-Destruction (The drones can fly towards the opponent and
    self-destruct in a timed explosion), Fire Manipulation (Her flying drone has a built in flamethrower),
    Electricity Manipulation (Equipped with an electroshock cannon that can fire a homing orb of paralyzing
    electricity), Energy Projection (Can fire a pair of scorching laser beams to slice through opponents),
    Can replenish Sonya's supply of frag/stun grenades K.A.T. Drone= .50 caliber cannon, Self-Destruction
    (The drone can crawl towards the opponent and self-destruct in a timed explosion)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
