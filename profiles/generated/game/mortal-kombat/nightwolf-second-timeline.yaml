    (Can manipulate green energy, a type of magic commonly seen in the hands of many warriors in MK. Besides
    being able to boost his speed and damage, he can also make bubble shields, cover himself in an aura
    that reflects attacks and teleport, summon various energy weapons, etc.), Light Manipulation (Can
    call down a beam of light after reciting a Matokan incantation. When completing the incantation, he
    can summon a powerful light that will completely disintegrate anyone caught in it. If a part of it
    is only recited, the beam is less deadlier but still powerful enough to debilitate its targets), Electricity
    Manipulation (Can call down cloud-to-ground lightning on his foes, even while indoors. Can call it
    down on himself (without being harmed) but its true effects are not shown. Lastly, he can charge lightning
    through his weapons, sometimes imbuing them with blue fire), Summoning (Can summon the animal spirits
    of Kiba the Wolf, Komo the Bear, and Hana the Eagle. Outside of gameplay mechanics, these animal spirits
    can attack the opponent for Nightwolf, and Komo has the ability to increase its size. He can summon
    them all at once to unleash a deafening roar) All previous abilities, Immortality (Types 1 and 7),
    Self-Sustenance (Type 2)
  source_ids: *id003
