    and Dragon Kung Fu), Weapon Mastery (Wields a sickle), Stealth Mastery (Successfully
    ambushed Scorpion and Sub-Zero, as well as Jacqui and Jax), Acrobatics, Magic
    (Assisted Quan Chi in the creation of a Soulnado, creating a magical circle where
    the Soulnado is to be summoned), Flight (Has a limited form of vertical flight
    when flying through his portals), Immortality (Types 2, 3 and 7. Unfazed from
    using his chest as a sheath for his sickle blade. Is an undead revenant), Regeneration
    (Low-Mid. Unsheathes an entire sickle from his chest and instantly heals it afterwards),
    Self-Sustenance (Type 2), Unholy Manipulation (His powers were bestowed to him
    from the dark sorcerer Quan Chi), Darkness Manipulation (His powers mostly revolve
    around shadow and darkness. With a dark substance that resembles ectoplasm, he
    can create shadow clones that can multiply up to nine clones and control their
    composition to solidify and liquify them or make them intangible. He may turn
    fully invisible, but his attacks will manifest as a streak of darkness. In a non-canon
    ending, his shadows manifested as dark tendrils that revived fallen warriors and
    placed them fully under his control), Teleportation (Can instantly teleport by
    himself over short distances, or towards his clones and weapons. Can use dark
    portals for teleportation. The portals can emit dark tendrils to bind and trap
    his opponents without causing them to fall through it. He may banish people through
    these portals, sometimes his portals can break down and erase victims who pass
    through them. These portals may even suck in nearby opponents with an unknown
    force), Energy Projection (Via Ghostball. Some of his attacks can be infused with
    the same energy of Ghostball. In Brutality finishers, Ghostball can shrink opponents
    until they are crushed), Intangibility (Can turn into a dark liquid substance
    and flow around in this state), Soul Manipulation (Absorbed the souls of the Soulnado
    in MK9 that was supposed to kill him, making him a legion of damned souls that
    he enslaved and consumed), Sound Manipulation (Mimicked Sektor's grunt, confusing
    Sub-Zero in the process). Resistance to Soul Manipulation (Survived the effects
    and the destruction of a Soulnado)
  source_ids: *id003
