  attack_potency:
    text: Large Building level+ (Defeated all of his opponents in the first (tenth) Mortal Kombat tournament
      including the likes of Goro and Shang Tsung. Nearly killed Shao Kahn in the second tournament. Destined
      to fight against Raiden in every timeline) | At least Small Building level (Relies on a power source
      and is weakened without it. Fought Jax even with Shinnok sealed during that time and later managed
      to fight Cassie Cage), likely Large Building level+ (With Shinnok's presence, he managed to put
      up a fight against Raiden and also hurt him in MKX, later absorbed the powers of his alive self)
      | At least Multi-City Block level (At this state, Liu Kang has the combined might of his both versions
      and Raiden. Casually broke through the gate defending Kronika's Keep and the Netherrealm's demon
      army with a dive bomb which carved a crater, the latter being a feat that Fujin could only do the
      Krown's power. After tapping into the Jinsei, he defeated the White Revenants, Dark Cetrion, and
      Kronika. In his ending in Aftermath, he defeats Keeper of Time Shang Tsung before erasing him with
      the Hourglass' energies for good), likely far higher (While he does scale to Cetrion and others
      similar or above her in power, all of his feats against them were done after a "temporal Armageddon",
      an event that was stated by Cetrion and the Elder Gods to weaken their power and eventually erase
      all beings, including the Elder Gods. This means that he has fought a weaker version of Cetrion,
      but he later surpasses her and even her superior, implying that he may be more powerful than their
      versions before that event)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively Hypersonic+ combat and reaction speed (Can keep up with Raiden in every timeline,
      defeated Shao Kahn) | At least Peak Human travel speed with Hypersonic combat and reaction speed
      (Kept up with Cassie Cage and Jax), likely Massively Hypersonic+ combat and reaction speed (Can
      fight with Raiden while on Shinnok's presence, absorbed his alive self-powers to fight Raiden one
      more time) | Hypersonic+ travel speed (Raiden was able to fly up into the atmosphere at this speed,
      Liu Kang's god form should be able to replicate it as well), with Massively Hypersonic+ combat and
      reaction speed (Dodged Cetrion's projectiles and deflected multiple meteoroids from Kronika)
    source_ids: *id002
