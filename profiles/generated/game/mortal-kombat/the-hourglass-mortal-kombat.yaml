  text: To restart time, the Hourglass must be powered by a sufficient amount of powerful energy, which
    it consumes upon use. This is why Kronika always keeps reserves of energy to operate the Hourglass
    every time she uses it. Otherwise, it cannot be used that way, but its other functions can still be
    used. It also requires a sufficient amount of skill to use. Category:Mortal Kombat Category:Items
