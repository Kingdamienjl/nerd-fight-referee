- id: claim-powers-and-abilities-3320ec24
  section: abilities
  axis: hax
  text: Time Manipulation (The Hourglass can rewind time far into the Prehistoric and Chaotian Age, long
    before the realms and most of its inhabitants began to exist), Cosmic Awareness (People who use the
    Hourglass can see events that have transpired or are transpiring in several points in time and space),
    Time Travel (Can cause a time merger, where people from the past are brought into the present. It
    can also do the opposite where people from the present can be brought into the past), Statistics Amplification
    (The energy inside of it can be drawn out and given to someone else, making them strong enough to
