- id: claim-weaknesses-aa1fc6d1
  section: weaknesses
  axis: weakness
  text: 'Isn''t noted for his intellect and is a bigger brute than Drahmin. His rage can be exploited
    by smarter foes Notable Attacks/Techniques *Beast Lord: Moloch charges at the opponent, knocking them
    down. *Ground Bash: Moloch slams his orb on the ground, causing heavy damage. *Suction Breath: Moloch
    creates a large gust of wind which pulls the opponent towards him, and if successful, the opponent
    bounces off Moloch''s body and is left open for a juggle. *Power Ball: Moloch strikes the ground with
    his orb and creates a projectile which strikes the opponent''s legs. *Super Charge: Moloch raises
    his arm into the air and roars. This heals some damage. *Ragin Oni: Moloch flails both his arms in
    the air wildly. This also heals damage. *Furious Howl: Moloch emits a loud howl, which also heals
    damage.'
  source_ids: *id003
  decisive: false
  status: unverified
