- id: claim-powers-and-abilities-6ca20044
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Martial Arts (Employs a vague form of Chinese martial arts
    as his fighting style), Weapon Mastery (Skilled in wielding his sword), Magic (Arguably one of the
    most skilled sorcerers in MK alongside Shang Tsung. Can imbue his attacks with dark magic. Recited
    an incantation that released Shinnok from his own amulet), Acrobatics (Surface Running. Can run off
    on walls before leaping away from it), Longevity (Likely has a long lifespan as a Netherrealm demon),
    Can interact with his past self, but will share with it irreparable damage and death (As shown throughout
    MK11, although he may likely scale due to not existing outside the normal laws of time), Empowerment
    (Relies on the presence of Shinnok as a power source), Bone Manipulation (Can create solid energy
    skulls and skeletal creatures to attack his enemies. He may stack these skulls into a wall to block
    incoming attacks. These skulls can be animated to chomp down on the opponent), Mind Manipulation (Can
    force an opponent into a magical trance to control them. He may use the Amulet of Shinnok to control
    the opponent with a close range blast), Energy Projection (Can conjure a rune on the floor that fires
    a rising beam of light to strike the opponent), Summoning (Can instantly summon a variety of familiars
    [bats that spit liquid fire and demonic steeds] and his servants [the Revenants of slain Earthrealm
    and Edenian warriors] to aid him), Necromancy (Can revive the dead into Revenants once he takes their
    souls. Revenants are undead warriors whose souls are bound to his service. In the middle of combat,
    he may reanimate skeleton warriors to aid him), Teleportation (Can instantly teleport by himself or
    through the use of portals. He may create a Soulnado [with sufficient prep and assistance] which is
    presumably a rift to Outworld that drains souls on a very large scale), Telekinesis (Can move his
    opponent without physical contact), Illusion Creation (Created a fake image depicting the elder Sub-Zero
    and the Lin Kuei slaughtering the Shirai Ryu and Scorpion's family), Telepathy (While weakened, he
    used his telepathy to communicate with D'Vorah through a hologram), Deconstruction (Can magically
    disintegrate his opponent into a skeleton), Healing (Managed to accelerate Shao Kahn's regeneration
    process)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
