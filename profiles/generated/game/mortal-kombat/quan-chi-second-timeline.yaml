- id: claim-weaknesses-e12293ac
  section: weaknesses
  axis: weakness
  text: 'His magic drains faster in the Netherrealm''s lower planes. Vastly weakened without his power
    source Notable Attacks/Techniques *Up Slash: Quan Chi summons his sword and swings it upwards from
    below, slicing the opponent. **Enchantment: He follows up with another attack where he shoots a burst
    of magic from his chest skull. *Down Slash: Quan Chi summons his sword and swings it down over his
    head, slicing the opponent. **The attack can be delayed or cancelled before he swings the sword, allowing
    him to wind up the attack. *Power Punch: Quan Chi thrusts an energy coated open palm at this opponent.
    **Sinister: A combo that mixes the sorcerer''s martial arts and magic skills. After Power Punch, he
    does a downward hitting palm strike and a double palm to the opponent''s abdomen before launching
    them up with a rising magic blast. All strikes in this combo are imbued with his magic. *Torment:
    Quan Chi does a back hand to the head and a roundhouse to the gut. He finishes the combo with a blast
    of magic from his hand. *Pure Evil: Quan Chi strikes the opponent over their head with a double knife
    hand (similar to an axe handle except both hands are straightened out) and knees them in the chest.
    He then fires a magic blast from both hands. *Deceptive: Quan Chi chops the head of his opponent and
    strikes their chest with an open palm, blasting them with magic in the process. **Spellbinder: After
    knocking them away with the second hit, he kicks the airborne opponent through a portal. This launches
    them towards him. *Portal Kick: Quan Chi faces back to a portal behind him and kicks through it, causing
    the attack to strike behind the opponent through another portal. *Skull: Quan Chi conjures a magical
    construct of a skull from his hands or head, shooting it straight at the opponent. **It can also be
    performed while airborne. **Quan Chi can deal more damage by firing a larger skull fitted with curved
    horns. *Trance: Quan Chi hypnotizes his opponent, forcing them to walk towards him for a short amount
    of time. *Sky Drop: Quan Chi drops through a portal in the ground, then reappears above the opponent
    to stomp them. **Like most teleport moves, it can be done while airborne. **After stomping the opponent,
    he can pick them up by the head and slam their face thrice before throwing them away. *Ground Burst:
    Quan Chi does a short gesture (either pointing or waving his arms), creating a rune beam that strikes
    from below. *Skeletal Boost: Quan Chi summons a skeletal hand from a portal, giving him two buffs
    that he can choose from: a damage buff or a healing buff. *Black Magic: Quan Chi waves his arms around,
    creating a rune circle at his feet that buffs him with the ability to drain meter with his spells
    while standing in it. *Final Hex: Quan Chi waves his arms around, creating a rune circle beneath the
    opponent that causes them to take three times the chip damage received while they stand on it. *Dark
    Curse: Quan Chi waves his arms around, creating a rune circle at his feet that buffs him with armor
    that lasts for one hit while standing in it. *Portal Scoop: Quan Chi grabs his opponent''s legs and
    slams them in the opposite direction. Alternatively, he can slam them into a portal where they will
    fall through another one above him. *Portal Grab: Quan Chi sticks his hand through a portal to grab
    a distant opponent. He pulls them through the portal and slams them to the ground in front of him.
    **The attack can be changed where Quan Chi uses a sword to backstab the opponent through the portal.
    *Demon Spawn: Quan Chi waves his arms around, summoning a deadly Netherrealm Bat. It can be given
    commands from its master, allowing for different kinds of attacks. **The bat charges towards the opponent
    and rips through their throat. **The bat flies to the opponent''s feet, performing a kamikaze charge.
    **The bat spits a ball of fire at the opponent which scorches them. *Quan Chi grabs his opponent and
    summons a portal behind them before pushing them into it. Another portal opens above his head and
    spits them out as he shoots them with a blast of magic from his chest mounted skull. *Skull Transplant:
    Quan Chi summons a Skull that flies into the opponent. Upon contact, the skull destroys their head
    and takes its place. *Touch of Death: Quan Chi absorbs his opponent''s life essence through a Trance
    and leaves their skeletal remains on the floor. *Blood Shower: Quan Chi grabs his opponent and throws
    them into a portal. Another portal appears above Quan Chi, and a rain of blood gushes down from it
    on him, followed by the opponent''s head shortly after. *X-Ray (Amulet Assault): Quan Chi takes the
    Amulet from his belt, and fires a burst of energy into his opponents face, mesmerizing them. He then
    tosses his opponent a skull and forces them to hit themselves in the head with it causing damage to
    the skull, then makes them snap their own neck. *X-Ray (Skull Krusher): Quan Chi throws a large orb
    of magic at his opponent, stunning them while he walks through a po'
