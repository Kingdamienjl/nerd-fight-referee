- id: claim-weaknesses-7101229b
  section: weaknesses
  axis: weakness
  text: 'None notable Feats: * Billy killed multiple partygoers. * Able to contend with the other Kombatants.
    Notable Team Attacks/Techniques: * Backstage Pass: Ghostface retreats and another appears behind the
    opponent, slashing them with their knife. * Always Outnumbered: Ghostface pulls out their phone, calling
    another Ghostface onto the fightline to attack the opponent from behind. * Ghost Face Killer Swap:
    When performing certain attacks, Billy Loomis will trade places with either the Enforcer Ghostface
    or Assassin Ghostface, with them glowing briefly then changing their knives to their own. * Flick
    Of The Wrist: Ghostface taunts the opponent, with one accomplice standing behind him. The third Ghostface
    then appears behind the opponent, stabbing them in the back while the second accomplice charges the
    opponent and smacks them in the face is a frying pan. Ghostface then throws their knife at the opponent,
    lodging it into their chest then retracts the blade and stabs them in the top of their forearm and
    pulling downward, cutting their forearm and hand into two sections before stabbing them in the stomach
    and tossing them away.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
