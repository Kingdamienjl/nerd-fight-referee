- id: claim-weaknesses-b080e3cb
  section: weaknesses
  axis: weakness
  text: 'His past self is a bit disconnected with reality, which causes him to think that weird and mystical
    opponents are like the ones he "fought" in movies, making him underestimate powerful opponents | Loved
    ones have to be in danger for him to go into the Inner Power state. Notable Attacks/Techniques: |-|Basic
    Attacks/Kombos= *Charge Palm: Johnny pulls his rear palm back, charging it with green energy. He then
    delivers an open palm strike to the gut. If the attack is fully charged, it will infuse them with
    green energy as they crumple to the floor. *Axe Kick: This aptly named attack has Johnny perform an
    axe kick. *Cross Cutting: Johnny throws a jab and a side kick. He then throws a short range blast
    of green energy. *That''s The Ticket: Johnny does a high knee strike into 2 hook kicks and a downward
    snap kick, all the while standing on one leg. *Fade Out: Johnny does a hook kick and a front kick
    and performs a front flip kick. *Speed Bag: Johnny rapidly punches the opponent''s face with both
    fists. This combo can last as long as he wants, making it a deadly attack once caught by it, especially
    when equipped with his buffed brass knuckles. *Force Punch: Johnny pulls his rear arm back, charging
    it with green energy. He then delivers a straight jab. If the attack is fully charged, it will knock
    them away from him before they collapse. *Fatal Strike: Johnny throws three alternating punches. The
    third jab can be charged with green energy, causing him to crouch down in order to charge it. *Entertainer:
    Johnny lunges forward with a knee strike and does a roundhouse kick. The last kick can be charged
    with green energy, causing him to widen up his stance to charge it. *Something Punchy: After hopping
    up, Johnny does a double axe handle slam infused with energy. *Rise And Shine: While recovering from
    a knockdown/successfully blocking an attack, Johnny counters by jumping up with an uppercut. *Fix
    It In Post: Johnny throws a jab and a rear hook punch. He then does JCVD''s signature helicopter kick.
    *Bad Scripts: Johnny does a cross punch and repeatedly kicks the opponent''s gut. He finishes them
    off with a helicopter kick. *The Gist Of My Fist: Johnny spins with a back fist strike and does a
    low angled jab. He lunges towards them with a jumping shoulder strike. *Kind Of A Big Deal: Johnny
    does a hop hook kick and repeatedly kicks the opponent''s gut. He finishes the combo with a helicopter
    kick. *Making Headlines: Johnny hops forth with a low angled side kick. He drops low, standing on
    a hand & knee, to deliver a low kick and rises up with a cartwheel. *Tear Jerker: Johnny lunges forward
    with a knee strike and kicks the opponent with a leapfrog jump. |-|Special Moves= *Forceball: Johnny
    throws a concentrated bolt of energy at a rising arc or straight at the opponent. *Flip Kick: Johnny
    does a backflip imbued with green energy. **Rising Kick: An upgraded version that allows him to charge
    the attack, lowering his stance and he gathers energy in his fist before rising up. *Shadow Kick:
    Johnny does a side kick, propelling himself to great speeds using his green energy. **Flashy Shadow
    Kick: An upgraded version that allows him to charge the attack, widening his own stance and gathering
    energy in his fist before delivering the kick. *Nut Punch: Johnny splits his legs to the floor, throwing
    a punch at the opponent''s groin. **Nut Breaker: An upgraded version that allows him to charge the
    attack once he splits his legs, he pulls his fist back and gathering energy in it before obliterating
    their nether regions. *Fist Bump: Johnny clashes his knuckles together, gaining a buff that boosts
    all the damage done by his knuckles. *Rising Shadow: Johnny does a rising elbow strike while being
    propelled into the air with green energy. **Once airborne, he can perform a double hitting mid-air
    kick. *Mimic: Johnny taunts the opponent with a "Bring It" gesture, giving him the ability to summon
    Mimics. These Mimics are clones made of yellow energy that he can send out to perform attacks for
    him, such as his Shadow Kick and Rising Shadow. *Pissed Off: A attack throw where Johnny throws multiple
    hook punches to the face. **He can finish the attack with a backflip kick infused with green energy.
    *Mime Time: Johnny enters a parry stance, initiating a mime session where he pretends to be trapped
    in a box. If he''s struck while this is active, he will parry the opponent with a sucker punch and
    throw them behind him. *Brass Knuckles: Johnny equips his brass knuckles, dealing increased damage
    with his fists to blocking opponents. *Throwing Shades: Johnny throws his shades at the opponent.
    *Say Cheese: Johnny gets his camera and takes a picture with it, releasing a bright flash that stuns
    the opponent. **The camera can also produce a brighter flash that''s powerful enough to induce recoil
    on it. *Caged Rage: Johnny steps forward with a hook punch. *Stunt Double: Johnny calls in his stunt
    double to sucker punch the opponent from behind. **He can order a differen'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-b7c028b1
  section: abilities
  axis: hax
  text: Base= Superhuman Physical Characteristics, Martial Arts (His fighting style is somewhat reminiscent
    of the real life JCVD, who uses Karate. Johnny also uses pro wrestling techniques), Weapon Mastery
    (Wields firearms and other unorthodox weapons), Vehicular Mastery (Can drive a tank), Acrobatics (Hypermobility,
    Surface Running. Can do a jump roll, perform splits on the ground and air, run off walls before leaping
    off of them, etc.), Magic (His powers are magical in nature, which he inherited from warriors who
    were bred by a Mediterranean war cult to fight against gods), Can interact with his past self, but
    will share with it irreparable damage & death (As shown through MK11), Energy Manipulation (His green
    energy allows him to create and throw energy orbs as powerful projectiles, boost his speed in short
    bursts, and build up massive damage to his strikes. In MKX, he has the ability to create two energy
    clones to assist him in kombat), Awakened Power (Unintentionally summoned his green aura when protecting
    a loved one)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
