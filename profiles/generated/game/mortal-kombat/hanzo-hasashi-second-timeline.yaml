- id: claim-powers-and-abilities-675b0c97
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Martial Arts (Skilled practitioner of Eastern martial arts,\
    \ such as Judo and Karate), Weapon Mastery (Wields his signature spear as his default weapon. Throughout\
    \ multiple games, he has had different swords, from Westernized katanas to a traditional daish\u014D\
    . Can somehow do this with his spear), Stealth Mastery (Skilled practitioner of Ninjutsu), Acrobatics,\
    \ Flight (Limited flight), Immortality (Types 2 and 7, only for his revenant), Can interact with his\
    \ past self, but will share with it irreparable damage and death (As shown throughout MK11), Unholy\
    \ Manipulation (All of his powers are from the Netherrealm), Hellfire Manipulation (Hellfire is his\
    \ only element and it is prominent in his abilities that don't even burn stuff. He can heat metal\
    \ without visibly burning it, make hellfire blasts, cover himself in hellfire, wreathe his attacks\
    \ with it, and reveal a burning skull to breathe a cone of hellfire), Teleportation (Can instantly\
    \ teleport himself, from travelling short distances to interrealm travel. Can banish others into the\
    \ Netherrealm with physical contact. Also uses portals), Summoning (Can summon a demonic minion that\
    \ can explode in hellfire and a stone monolith), Illusion Creation (Can create a fake, immaterial\
    \ image of himself to trick his enemies. This image can also be made into a tangible clone of himself),\
    \ Dimensional Storage (Somehow keeps a long length of chains tipped with a kunai in his bracer), Air\
    \ Manipulation (Can summon a fire whirl upon teleporting), Intangibility (Can burn away parts of his\
    \ body [or all of it] to reveal a fiery skeleton form that allows him to phase through opponents while\
    \ burning them on contact. In this state, he can still hold onto others while remaining intangible),\
    \ Resistance to Fire Manipulation (Unaffected by an upgraded Sektor's flamethrower)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
