- id: claim-weaknesses-2f5f0ce6
  section: weaknesses
  axis: weakness
  text: 'Nothing notable Notable Attacks/Techniques: * Lunge: Gabranth link his swords together and charge
    forward to slam the opponent away. * Circle of Judgement: Gabranth spins around to draw in the opponent
    and knock them away. * Guilt/Execution: Gabranth thrusts forward to stun the opponent, then slice
    swords to cause a large explosion. * Innocence: Gabranth link his blades together then quickly slice
    them, firing four enormous energy blades. The blades can arc up or down on a slight angle to track
    the opponent. * Protect: Gabranth is enveloped in a magick field, increasing his defense and reducing
    physical damage taken. * Renew: Fully restores Gabranth''s health. * Enrage: Gabranth charges forward
    and attacks the opponent with a combo of sword slashes. * Hatred: Gabranth conjures a sphere around
    himself while charging, then releases a wave of energy in all directions. It has short range, but
    has a large blast radius. * Fulminating Oblivion: Gabranth creates a blast of energy that hits the
    opponent multiple times * Ruin Unflinching: Gabranth punches three times to shatter the screen around
    the opponent. * Frost Purge: Gabranth summons multiple swords that converge on the opponent. ==Notable
    Matchups== Victories: Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}}
    Category:Characters Category:Game Characters Category:Final Fantasy Category:Final Fantasy XII Category:Characters
    from Ivalice Category:Sword Users Category:Forcefield Users Category:Energy Users Category:Humans
    Category:Primary Antagonists Category:Antagonists Category:Male Characters Category:Magic Users Category:Element
    Users Category:Law Users Category:Space Users Category:BFR Users Category:Death Users Category:Supernatural
    Willpower Users Category:Summoners Category:Sealing Users Category:Reactive Power Level Users Category:Dimensional
    Travel Users Category:Creation Users Category:Immortals Category:Matter Users Category:Soul Users
    Category:Radiation Users Category:Deconstruction Users Category:Self-Destruction Users Category:Explosion
    Users Category:Resurrection Users Category:Petrification Users Category:Duplication Users Category:Absolute
    Zero Users Category:Poison Users Category:Corrosion Users Category:Twins'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
