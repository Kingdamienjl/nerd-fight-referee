    Nullification (The Silence status, which would render the target''s ability to use magic null), and
    Petrification (Via Malboro''s Bad Breath), Resurrection (Phoenix can revive fallen party members),
    Light Manipulation and Holy Manipulation (Via Alexander), Explosion Manipulation and Self-Destruction
