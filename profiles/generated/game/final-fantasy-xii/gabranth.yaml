    willDissidia Final Fantasy Opera Omnia), Creation (With a powerful enough will, once can create various
    things such as phone lines, airships and even entire countries and worldsDissidia Final Fantasy Opera
    Omnia), Sealing (Can seal off large areas and people with her will, such as Cecil sealing himself
    in Castle Baron or the cast sealing Kefka inside a TorsionDissidia Final Fantasy Opera Omnia), Dimensional
    Travel (Characters can open Torsions, rifts in space-time to travel various dimensionsDissidia Final
    Fantasy Opera Omnia), and Immortality (Type 2) (Due to the crystal core of darkness''s influence in
    the hands of Ardyn, warriors will not die no matter how injured they are) {{!}}-{{!}}Resistances=Resistance
    to Mind Manipulation, Soul Manipulation (Via Zalera, the Death Serpah, who was going to absorb the
    souls of every living being on the planet), Corruption & Body Puppetry (Due to their light, Warriors
    of Materia can dispel attempts to control them), Empathic Manipulation, and Madness Manipulation (Type
    3; Resistant to the effects of the True Moon, which is capable of affecting the hearts and minds of
    all living beings on the planetFinal Fantasy IV: The After Years), Gravity Manipulation (Unaffected
    by the gravitational pull of the True Moon, which even the Lunar Whale couldn''t escape from), Spatial
