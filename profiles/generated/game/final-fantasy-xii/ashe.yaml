- id: claim-weaknesses-c24497c0
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Frost Shot: Ashe''s basic attacks
    and abilities apply Frost to affected enemies, slowing them and causing subsequent
    basic attacks against them to deal bonus physical damage while they remain slowed.
    **Critical Slow: Ashe''s critical strikes deal no additional damage, but instead
    triple Frost''s slow strength. *Ranger''s Focus: Ashe gains bonus attack speed
    and causes each of her basic attacks to fire a flurry of five arrows. Ashe cannot
    gain Focus while this ability is active. Flurries trigger on-hit effects only
    once, and arrow deals modified physical damage that benefits from Frost Shots
    and life steal. While Ranger''s Focus is inactive, Ashe is granted Focus, stacking
    up to 4 times. After 4 seconds, each stack thereafter will fall off every second.
    *Volley: Ashe fires 9 arrows in a cone in the target direction, dealing physical
    damage to all enemies hit. Enemies can intercept multiple arrows, but do not take
    damage from arrows beyond the first. Volley applies Frost Shot''s Critical Slow
    to enemy champions hit. *Hawkshot: Ashe sends a hawk spirit toward the target
    location, granting sight of its path in a large radius at its destination. The
    hawk''s sight is not obstructed by brush or terrain. *Enchanted Crystal Arrow:
    Ashe fires a missile of ice in the target direction. The arrow shatters upon hitting
    an enemy champion, dealing magic damage, knocking down and stunning them. Enemies
    surrounding the main target take reduced damage. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} ==Notes==
    {{scroll box|content=}} {{Discussions|Ashe League of Legends|Ashe (League of Legends)}}
