  stamina:
    text: Superhuman. As a remote controlled robot, Cait Sith doesn't necesarily get
      tired and is more dependent on how long Reeve can keep controlling him, can
      easily keep up with the party in constant battles against special units of Shinra
      without exhaustion, as seen during his rescue of Barret and Tifa in Junon, as
      well as long journeys and travels facing dangerous enemies. However, Reeve himself
      is subject to exhaustion and Cait Sith has been seen "deactivated" on a few
      occassions, implying his activity hasn't remained continuous.
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range with the Fat Moogle, much higher with Materia.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Average combat wise (While Reeve is undoubtedly a genius in many ways; as
      he is a brilliant architect, executive, skilled roboticist and eventually an
      accomplished world leader; Cait Sith's poor combat abilities and Reeve's struggles
      with its performance in battle have been acknowledged several times and, despite
      improvements and several attempts to fix them, problems during fights keep appearing,
      showing that this is not one of Reeve's strong suits. Despite this, Cait Sith
      has been shown to be adept enough with Materia to use it as well as his teammates,
      and could perform well enough in teamwork to contribute to the group and never
      drag them down)
    source_ids: *id002
