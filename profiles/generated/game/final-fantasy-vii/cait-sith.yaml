  attack_potency:
    text: 'Possibly Wall level+ (During the events of Dirge of Cerberus, Reeve fights
      alongsideDirge of Cerberus -Final Fantasy VII- (2006) other WRO soldiers against
      Deepground troops, who should be no weaker than Shinra''s infantrymen and Avalanche
      troopers) | At least Multi-Continent level, likely higher (After an underwhelming
      performance in the past when trying to assist the Player Turk, Reeve decided
      to enhance Cait Sith''s fighting capabilities. By the time this new model debuts
      in battle, it can fight alongside Vincent Valentine, whom had easily taken outBefore
      Crisis -Final Fantasy VII- (2004) 3rd ver. Ravens, a type far stronger than
      the 2nd which effortlessly defeatedBefore Crisis -Final Fantasy VII- (2004)
      2nd Class SOLDIER members, like Sebastian and Essai,Crisis Core -Final Fantasy
      VII-: The Complete Guide (2007) whom compare to Zack Fair when he took down
      Ifrit, a Summon equal to Shiva. Grew stronger since then and earned control
      of stronger Summons like Leviathan and Bahamut), even higher with Limit Breaks
      (Limit Breaks are stated to allow the user to reach power far beyond their usual
      capabilities) | Multi-Solar System level (Equal to Red XIII and Cloud, the latter
      whom survived the energy releasedFinal Fantasy VII (1997) by the awakening of
      5 of the 8 Weapons. Grew strong enough to participate in the defeat of 3 of
      the Weapons, with each Weapon being around the same level as Minerva, a being
      stronger than Summons,Crisis Core -Final Fantasy VII- (2007) thus above Zirconiade
      and far more powerful than Bahamut ZERO), likely Multiverse level+ (Compares
      to Cloud, who fought in Ramza Beoulve''s army during his stay in Ivalice, as
      an equal to Balthier and Luso Clemens, the former whom had defeated Gilgamesh
      twice alongside Vaan, and the latter who had teamed up with Vaan on his own
      adventures. Cloud had become far stronger since these events), higher with Limit
      Breaks | Multi-Galaxy level (Controls the Knights of the Round, the only Summon
      who is far stronger than Minerva. Participated in the defeats of Jenova∙SYNTHESIS,
      the strongest she has ever been,Final Fantasy VII: Ultimania Omega (2005) and
      Safer Sephiroth, whom had become a being described as godlikeFinal Fantasy:
      Ultimania Archive - Volume 2 (2018) and nearing godhoodFinal Fantasy: Ultimania
      Archive - Volume 2 (2018) after absorbing knowledge from the Lifestream and
      completing the Reunion), likely Multiverse level+ (Far stronger than before),
      higher with Limit Breaks | At most Multi-Galaxy level, likely Multiverse level+
      (Has grown weaker in the two years since the battle with Sephiroth. Something
      Tifa herselfFinal Fantasy VII: Advent Children (2005) acknowledges. Should compare
      to Tifa, who managed to keep up with a casual Loz, a Remnant comparable to Kadaj
      who is stated to beFinal Fantasy VII: Advent Children -Reunion Files- (2006)
      as strong as Sephiroth was in the original game, but was overwhelmedFinal Fantasy
      VII: Advent Children (2005) when Loz got serious), higher with Limit Breaks
      | Multiverse level+ (Draws power from the Gods of the Cycle. Participated in
      the defeat of Shinryu), higher with Limit Breaks'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Possibly Supersonic (Even the weaker infantrymen are capable of dodging
      gunfire from automatic rifles and machine guns. If Reeve was in battle against
      them, he should compare) | Sub-Relativistic+ (Following the improvement of its
      combat capabilities, Cait Sith could fight alongside the party when they were
      noticeably above the level they had during the events of Midgar. Grew far stronger
      since then) | Massively FTL+ (Is an equal to Red XIII. Stronger than the Weapons,
      whom each is around the same level as Minerva, a being stronger than Summons,Crisis
      Core -Final Fantasy VII- (2007) which puts her above Zirconiade and, by extension,
      far above Bahamut Fury) | Massively FTL+ (Is comparable to Safer Sephiroth.
      Controls the Knights of the Round) | At most Massively FTL+ (Has grown weakerFinal
      Fantasy VII: Advent Children (2005) in the two years since Sephiroth''s defeat.
      Should be around Tifa''s level, who managed to keep up with a casual Loz, a
      Remnant comparable to Kadaj who is stated to beFinal Fantasy VII: Advent Children
      -Reunion Files- (2006) as powerful as Sephiroth was in the original game, but
      was overwhelmedFinal Fantasy VII: Advent Children (2005) when he got serious)
      | Massively FTL+ (Comparable to other Warriors of the Cycle. Took part in the
      defeat of Shinryu)'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'Limited Power Mimicry (Enemy Skill allows the user to learn some abilities
      from enemies); Elemental Manipulation of different varieties: Fire (via Beta),
      Lightning (via Trine), Water (via Aqualung) and Multi-Elemental (Magic Breath
      deals Fire, Ice and Lightning damage at once); Death Manipulation (via Death
      Sentence); Durability Negation (via Pandora''s Box); Healing and Type-3 Purification
      (via White Wind and Angel Whisper); Defensive Statistics Amplificaction (via
      Dragon Force); Time Acceleration and Damage Reduction via Barrier Creation (via
      Big Guard); Status Effect Inducement via Bad Breath: Poison Manipulation, Confusion,
      Silence Inducement, Size Reduction, Transmutation into Frogs and Sleep Inducement,
      the latter two are also inflicted via Frog Song; Energy Absorption (via Magic
      Hammer). Can grant himself Resistance to Death Manipulation (via Death Force).
      |-|Support= Attack Boost of two kinds: additional effects via Elemental Attacks
      of the Fire, Absolute Zero Ice, Lightning, Earth, Wind, Water, Gravity and Holy
      variety (via the Elemental Materia, which grants the user different attributes
      when linked with different Magic and Summon Materia in their weapons), and Status
      Effect Inducement of the Poison Manipulation, Sleep Inducement, Berserk Inducement,
      Limited Madness Manipulation, Petrification, Transmutation into Frogs, Size
      Minimization, Silence Inducement, Time Slowdown, Time Stop and Instant Death
      variety (via the Added Effect Materia, which allows the user to inflict several
      Status Ailments when linked with different Magic and Summon Materia in their
      weapons), and raw power boost via Magic Attack Boost (via MP Turbo); Life Absorption
      (via HP Absorb) and Energy Absorption (via MP Absorb); Instinctive Reaction
      of different varieties: Counterattacking (via Counter Attack or Counter, Magic
      Counter and Final Attack linked with certain offensive Materia), Automatic Healing
      (via Magic Counter or Final Attack linked with a healing Materia, or the Life
      or Phoenix Materia to save the user from near death), Automatic Follow-Up (via
      Added Cut) and Instinctive Initiative (via First Strike); Enhanced Awareness
      and Stealth (via Pre-Emptive, which allows to sneak on and attack enemies by
      surpise and prevents the user from being ambushed or being caught off-guard);
      Self-Sustenance (Type 1), Enhanced Vision and Underwater Breathing (via Underwater,
      which lets the user survive and fight with no problem at the bottom of the ocean).
      Additionally, can use the same Spell or Summon four times at once at half power
      (via Quadra Magic, except for Knights of the Round); can turn the single-targeting
      of several of Commands and Spells into an Area of Effect (via the All and Mega
      All Materia); regular attacks can reach a few meters beyond their actual physical
      reach (via the Long Range Materia). Resistance to Elemental Manipulation of
      the Fire, Absolute Zero Ice, Lightning, Wind, Earth, Water, Gravity and Holy
      variety (via the Elemental Materia, which protects the user from different elements
      when linked with Magic and Summon Materia in their armor); Status Effect Inducement
      which includes Poison Manipulation (as well as Acid Manipulation); Sleep Inducement;
      Silence Inducement; Transmutation; Power Nullification; Petrification; Size
      Manipulation; Madness Manipulation; Berserk Inducement; Time Manipulation, Time
      Stop and Death Manipulation (via Added Effect, which protects the user from
      different ailments when combined with Magic and Summon Materia in their armor);
      as well as to Extreme Pressure (via Undertwater, which prevents the user from
      being affected by the conditions of the bottom of the ocean).'
    source_ids: *id002
