    text: Superhuman. Nanaki can easily keep up with his teammates such as Cloud, Barret or Tifa who can
      fight gauntlets of formidable enemies for what seems to be hours. Later he would go on to face off
      exponentially stronger enemies such as Jenova and Sephiroth himself.
