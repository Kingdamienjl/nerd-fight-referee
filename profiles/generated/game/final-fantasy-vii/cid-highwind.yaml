  stamina:
    text: Superhuman. Cid can fight through hordes of monsters and other powerful
      beings, such as SOLDIER members, combat machines, and bioweapons, continuously
      without signs of exhaustion. Later he would go on to face off exponentially
      stronger enemies such as Jenova and Sephiroth himself without real fatigue.
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range with his spears, possibly Tens of Meters with Limit
      Breaks, much higher with Materia.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted. Cid is widely recognized as a genius engineer and an ace-pilot and
      was Shinra's pick to be the astronaut in their very first space launch. After
      the events of the original game, when Mako stopped being used as an energy source,
      Cid managed to rediscover the use of old fossil fuel, more precisely oil, and
      readapt technology to run into this alternative source, which went from small
      devices to a whole new airship, the Shera, only with a small team and very limited
      resources. When it comes to combat, Cid is notable in that he has no real combat
      training, special abilities, nor equipment, such as Cloud and Vincent's military
      background and genetic enhancements, Tifa's martial arts training, Barret's
      weaponry or Aerith's spiritual skills. Yet, he can keep up with the rest of
      the team with no issues, solely with his tools and capabilities, facing formidable
      enemies such as select military units, dangerous monsters, and even otherworldly
      horrors like Jenova. Initially, he could be quite stubborn regarding his decisions.
      Still, after Shera was proven right about the tank in the rocket that needed
      repairs, Cid became much more willing to accept his mistakes and observe with
      a cool head the world around him, becoming more or less one of the voices of
      reason for the party following the events of the original game.
    source_ids: *id002
    confidence: 0.95
