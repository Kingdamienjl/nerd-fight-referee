      on her Crystal which let Cosmos'' group return from fading from existence after
      Cosmos'' death) & Regeneration (Low-Godly), Summoning (Can summon various Eidolons
      from Summonstones and the World of Illusions), Willpower Manipulation (a person''s
      will is power there and enables them to do a multitude of things the stronger
      their willDissidia Final Fantasy Opera Omnia), Reactive Power Level (the greater
      someone''s will, the greater their powerDissidia Final Fantasy Opera Omnia),
      Law Manipulation (Beings with strong wills can overwrite the laws of the world
      and bend them to their willDissidia Final Fantasy Opera Omnia), Creation (With
      a powerful enough will, once can create various things such as phone lines,
