- id: claim-standard-equipment-9cb2285c
  section: equipment
  axis: equipment
  text: 'Superhuman Physical Characteristics; Skilled Spearman and user of Explosives;
    Acrobatics; Energy Manipulation (can empower his attacks with Spirit Energy when
    using Limit Breaks for greater power and different effects); Attack Boost in the
    form of raw damage boost (via Limit Breaks, which are stated to reach power much
    greater than the usual capabilities of the user) and additional effects: Explosion
    Manipulation (via Dynamite, Hyper Jump, Dragon Dive and Highwind), Life Absorption
    and Energy Absorption (via Dragon) and Instant Death (via Hyper Jump and Dragon
    Dive); Non-Physical Interaction (similar to his teammates, he can fight and defeat
    ghosts and spectral enemies); Regeneration Negation (Up to Low-High, the pieces
    of Jenova, even cells, destroyed by the party are gone for good. They can''t be
    used for the Reunion to rebuild Jenova''s body) and Immortality Negation (Types
    2, 3, 6, 7 and 8. Can permanently kill Jenova and her pieces, who, aside from
    being extremely durable, can regenerate from single cells, as well as survive
    as long as her cells remain, through which she can enforce her will, even though
    other people injected with them. Additionally, like his teammates, he can finish
    off ghosts and spectral enemies). Resistance to Banishment (despite entering the
    Planet''s Core within the Lifestream itself, Cid was not taken forcefully taken
    from the living world); Mind Manipulation and Memory Manipulation (his mind has
    grown strong enough to not collapse nor be eroded under the weight of the Spirit
    Energy of the Lifestream); Soul Manipulation, Soul Absorption and Empathic Manipulation
    (his spirit was not forcefully diffused nor reabsorbed by the Lifestream); Biological
    Absorption, Deconstruction and Matter Manipulation (his physical body wasn''t
    absorbed nor was dissolved by the Lifestream to retake his Spirit Energy); Corruption
    (Types 1 and 2, despite immense exposure to Spirit Energy, on several occasions,
    he never became a Makonoid. Additionally, was unaffected by Jenova''s Virus despite
    confronting her directly); Extreme Heat and Extreme Radiation (withstood Sephiroth''s
    Supernova); Mind Reading, Perception Manipulation, Illusion Creation, Telekinesis
    and Possession (by the time of their spiritual battle, he had grown strong enough
    to resist Sephiroth''s mental abilities); Power Mimicry and Power Absorption (Limit
    Breaks are born from the user''s Spirit Energy, which shapes their mind and soul,
    and cannot be copied or imitated, the sole exception being Zack who is acknowledged
    as an unusual case, and even then creates a variant of the original move).'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-f8518f22
  section: power_scale
  axis: battle_iq
  text: Gifted. Cid is widely recognized as a genius engineer and an ace-pilot and
    was Shinra's pick to be the astronaut in their very first space launch. After
    the events of the original game, when Mako stopped being used as an energy source,
    Cid managed to rediscover the use of old fossil fuel, more precisely oil, and
    readapt technology to run into this alternative source, which went from small
    devices to a whole new airship, the Shera, only with a small team and very limited
    resources. When it comes to combat, Cid is notable in that he has no real combat
    training, special abilities, nor equipment, such as Cloud and Vincent's military
    background and genetic enhancements, Tifa's martial arts training, Barret's weaponry
    or Aerith's spiritual skills. Yet, he can keep up with the rest of the team with
    no issues, solely with his tools and capabilities, facing formidable enemies such
    as select military units, dangerous monsters, and even otherworldly horrors like
    Jenova. Initially, he could be quite stubborn regarding his decisions. Still,
    after Shera was proven right about the tank in the rocket that needed repairs,
    Cid became much more willing to accept his mistakes and observe with a cool head
    the world around him, becoming more or less one of the voices of reason for the
    party following the events of the original game.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-42a0f341
  section: weaknesses
  axis: weakness
  text: 'Cid must be pressed in a battle to use his Limit Breaks, so most of the time,
    he can''t use them right away or in succession. While him being able to keep up
    with the rest of the party despite his lack of combat training is very telling
    of Cid''s skill and resourcefulness, this can also prove to be a weakness should
    his opponent be much more prepared in that regard, as he doesn''t have a distinct
    advantage or strong point in battle like his teammates. Notable Attacks/Techniques:
    |-|Limit Breaks= Limit Breaks are powerful special moves Cid can perform in battle.
    All living beings have a portion of the Spirit Energy that flows through the Lifestream
    in themselves, when this energy raises to its limit it eventually aligns and overflows
    allowing to go beyond the user''s standard capabilities and reach a much higher
    power, just as their name indicate. Limit Breaks are affected by emotions; intense
    ones such as rage can lead to attaining the state to use these moves much faster
    than usual. A proof of their power can be seen in Cloud''s battle against Bahamut
    SIN: his regular attacks did little more than annoy the Summoned Beast, however
    his Braver Limit Break could scar its face and knock it off the air, sending it
    plummeting to the ground, while Climhazzard could destroy Bahamut with a single-use.
    Level 1: *Boost Jump: Cid leaps into the air and falls into an enemy, striking
    with his spear. *Dynamite: Cid takes out a dynamite stick and lights the fuse
    with his cigar to throw at it at the enemy party. Level 2: *Hyper Jump: Cid aims
    with his lance before jumping high into the air, and with a flip changes trajectory,
    as his spear is engulfed in blue Spirit Energy, charging at the enemy party and
    creating a blast of energy upon impact. *Dragon: Cid makes several signals, and
    a serpentine dragon is materialized. The creature surrounds a single enemy and
    rises to the sky around them in a pillar of sparks of Spirit Energy. Cid recovers
    a quarter of the damage he dealt both as health and as magic. Level 3: *Dragon
    Dive: Cid extends his hand forward, stretches his neck and jumps on targets with
    such force that a large pillar of Spirit Energy erupts from the ground with each
    impact, for a total of six attacks. *Big Brawl: Leaving aside any sense of finesse
    and technique, Cid charges at the enemy and brutally beats them up in a messy
    cloud of dust and violence. Level 4: *Highwind: Cid makes signals to the sky,
    and the Highwind airship unleashes a missile assault on all enemies, finishing
    with a powerful bomb that creates a large vertical explosion upon impact. |-|Magic=
    Accessed through the Green Materia, this allows the wielder to access the wisdom
    of the Ancients, the Cetra, and the connection they shared with the Planet to
    use its powers and manifest all sorts of incredible skills. These can range from
    offensive manipulation of the elements, to support effects and even powerful healing
    abilities. While each Magic Materia allows typically the use of a specific set
    of spells (such as Lightning allowing to use Bolt, Bolt2 or Bolt 3; or Mystify
    granting Berserk and Confu, both mind-affecting spells), there exists the Master
    Magic Materia, which gives the user every magic in existence with the exception
    of the one of a kind Holy and Meteor. Notable spells include: Offensive: *Fire3
    (Firaga), Ice3 (Blizzaga), Bolt3 (Thundaga) and Quake3 (Quaga): Very high-level
    elemental magic that conjures their respective elements for a powerful attack
    to strike a single enemy or a wide area. *Bio3 (Bioga): The user cast large bubbles
    of venomous liquids that drown the enemy to inflict heavy damage and leave them
    poisoned. *Demi3 (Graviga): A powerful gravity well is created to drag and crush
    enemies within it. This spell cannot be reflected. *Comet2 (Cometeor): Calls forth
    several small meteors from outer space to strike the enemy four times. This spell
    cannot be reflected. *Death:A spell that conjures a Grim Reaper to instantly kill
    an opponent. This spell can affect robotic enemies and ghosts unless they explicitly
    resist instant death. *Tornado: A spell that creates a powerful twister on an
    opponent. May inflict confusion. *Freeze: A sudden cold surrounds an enemy and
    then they’re instantly encased in ice, freezing its surrounding area as well.
    May inflict Stop. *Break: Rock is materialized around the opponent and proceeds
    to crush them, turning them into stone as well. May inflict Petrification. *Flare:
    The user causes a nuclear reaction by making the atoms of the target collide with
    each other, resulting in a powerful explosion of extreme heat to completely incinerate
    an opponent. *Ultima: The most powerful Black Magic Spell in the story after Meteor
    itself. A massive energy wave that strikes a wide area for non-elemental damage.
    The spell cannot be reflected. Healing: *Cure3 (Curaga):The user can restore a
    large amount of health to themselves or their whole party. *FullCure: An incredibly
    powerful healing spell that will restore to full h'
