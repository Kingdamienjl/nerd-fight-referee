    and restoring his true persona) | Multi-Galaxy level (Fought Safer Sephiroth,
    who is stronger than the Knights of the Round), likely Multiverse level+ (Far
    more powerful than before) | At most Multi-Galaxy level, likely Multiverse level+
    (Has grown weakerFinal Fantasy VII: Advent Children (2005) in the two years since
    Sephiroth''s previous defeat. Scales to Tifa, who could take attacks from a casual
    Loz, who is comparable to Kadaj who is stated to beFinal Fantasy VII: Advent Children
    -Reunion Files- (2006) as strong as Sephiroth was in the original game, but was
    quickly defeatedFinal Fantasy VII: Advent Children (2005) when Loz attacked seriously)
    | Multiverse level+ (Can fight the other Warriors of the Cycle. Survived Shinryu''s
    attacks)'
