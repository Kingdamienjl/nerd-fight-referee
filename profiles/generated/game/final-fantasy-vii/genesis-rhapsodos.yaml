- id: claim-weaknesses-d62edbbe
  section: weaknesses
  axis: weakness
  text: 'He steadily degrades and rapidly ages because he does not have the required
    Jenova Cells (though this is no longer an issue after Crisis Core) which greatly
    hinders his full capabilities. Genesis is very self-centered and prideful, which
    leads him to easily feel slighted and angered, sometimes for very petty reasons,
    leading to very rash decisions without thinking of the consequences of his actions,
    and overestimating his capabilities or control over the situation. Genesis has
    a noticeable lack of empathy towards others, which can hinder his manipulations
    as he will not try to understand the situation beyond himself. Notable Attacks/Techniques:
    ===Base'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
