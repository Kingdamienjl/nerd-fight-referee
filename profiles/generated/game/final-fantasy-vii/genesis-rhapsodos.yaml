    confidence: 0.95
  attack_potency:
    text: 'Multi-Solar System level (As a failed subjectCrisis Core -Final Fantasy
      VII-: Ultimania (2007) of the Jenova Project, Genesis suffers from severe physical
      degradation that greatly weakens him. Despite this, he still gave Zack Fair
      a very close fight. At this point Zack had been recently promoted to 1st Class
      and easily defeated Bahamut Fury) | Multi-Solar System level (In his reenactment
      of LOVELESS, Genesis used the Red GlobeCrisis Core -Final Fantasy VII-: The
      Complete Guide (2007) in order to have this unique Materia gather the surrounding
      Lifestream in the Banora Underground and then absorb it into himself, granting
      him a more powerful form. Kept up with endgame Zack, who had defeated Minerva,
      a being superiorCrisis Core -Final Fantasy VII- (2007) to Summons, thus above
      Zirconiade and far more powerful than Bahamut Fury) | Multi-Solar System level
      (Hojo himself was impressedCrisis Core -Final Fantasy VII- (2007) by Genesis''
      growth despite being a failed subject. After conquering his fear of degradation
      and death and rediscovering his desireCrisis Core -Final Fantasy VII-: The Complete
      Guide (2007) to regain his pride as a SOLDIER, Genesis was granted a new chance
      by the Lifestream and restored to his prime condition. Fought a much closer
      fight against Zack than the Genesis Avatar, despite being ultimately defeated.
      In his prime condition, when going all outCrisis Core -Final Fantasy VII-: Reunion
      (2022), Genesis can make Sephiroth to fight more seriouslyCrisis Core -Final
      Fantasy VII-: Reunion (2022), though in the end Genesis was beingCrisis Core
      -Final Fantasy VII-: Reunion (2022) overwhelmed. Zack was the only other warrior
      to push SephirothCrisis Core -Final Fantasy VII- (2007) to fight seriously,
      during the events of Crisis Core even if he was easily defeatedFinal Fantasy
      VII: 10th Anniversary Ultimania (2007) in the end) | At most Multi-Solar System
      level (The Summoned G-Monsters are far weaker than Zack, but can give him trouble
      in larger numbers)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Massively FTL+ (Despite being greatly weakened due to degradation, Genesis
      still managed to keep up with Zack Fair, who by this point had easily defeated
      Bahamut Fury) | Immobile Movement Speed (The Genesis Avatar is anchored to the
      ground of Banora Underground), Massively FTL+ Combat Speed (With only his attacks
      and reactions managed to keep up with endgame Zack, whom had defeated Minerva,
      a being stated to beCrisis Core -Final Fantasy VII- (2007) above Summons, putting
      her above Zirconiade and thus far more powerful than Bahamut Fury) | Massively
      FTL+ (Faster than the Genesis Avatar. In his prime condition Genesis could almost
      outpaceCrisis Core -Final Fantasy VII-: Reunion (2022) a casual Sephiroth, forcing
      him to fight seriously, though Genesis would be overwhelmedCrisis Core -Final
      Fantasy VII-: Reunion (2022) in the end. Despite Zack''s decisive victory, Genesis
      still kept up to a much better degree than before) | At most Massively FTL+
      (While weaker, the monsters can catch up with Zack if he''s not careful)'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Stellar (Comparable to Zack, whom had easily defeated Bahamut Fury, a Summon
      more powerful than Typhon) | Stellar (Has become strong enough to push back
      endgame Zack, whom had defeated Minerva, a being far superior to Bahamut Fury)
      | Stellar (Genesis' at his strongest. Could hold a close duel with Zack and
      managed to push back a casual Sephiroth) | At most Stellar (While far weaker
