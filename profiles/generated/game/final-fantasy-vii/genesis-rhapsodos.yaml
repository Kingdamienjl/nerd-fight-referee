  intelligence:
    text: Gifted (One of Shinra's most renowned 1st Class SOLDIER, Genesis is a master
      swordsman on a similar level to the legendary Sephiroth, he is a superb close-quarter
      combatant and can easily combine his various magical spells with his swordplay
      in combat to keep his opponents on edge. He is also a skilled manipulator, single-handedly
      instigating war and manipulating the events of the game to cure his degradation,
      upon which he succeeds despite his defeat at the end of the game. However, the
      increasing severity of his degradation and disillusionment with Shinra has made
      him somewhat deluded and obsessed, clinging to LOVELESS and believing that the
      epic is a holy prophecy of a sort and that he, along with Sephiroth, and Angeal,
      whose role is succeeded by Zack, are its heroes)
    source_ids: *id002
    confidence: 0.95
