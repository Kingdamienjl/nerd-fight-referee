- id: claim-standard-equipment-691f4761
  section: equipment
  axis: equipment
  text: 'Yazoo-Velvet-Nightmare-FFVIIAC.jpg|Yazoo aiming his Velvet Nightmare Velvet Nightmare Concept
    Design.jpg|Concept Art of the Velvet Nightmare Velvet Nightmare Loz and Yazoo.jpg|Yazoo and Loz firing
    their Velvet Nightmares Remnantbirth.jpg|Remnant''s Birth and Materiallization Shadow Creeper.jpg|Shadow
    Creeper MateriaAC.JPG.jpg|Cloud''s Materia collection in Advent Children Kadaj-absorbing-a-Materia-FFVIIAC.jpg|Kadaj,
    a remnant of Sephiroth, absorbs Materia directly in his arm *Velvet Nightmare: Yazoo''s main weapon,
    a gun, more precisely a Gunblade variant, designed with blades on the slide of the cannon, not meant
    to attack but which can be used to defend against other weapons, just like how Yazoo did against Cloud''s
    Fusion Swords. *Motorcycle: Like his brothers, Yazoo rides a large motorcycle with three large pipes
    on the rear, and smaller ones covering the middle, facing front. The Remnants are shown to be incredibly
    skilled at maneuvering with these vehicles, performing stunts that would normally be impossible and
    be perfectly capable of engaging in combat and competent teamwork while riding them at high speeds.
    *Cloud''s Materia: When Loz arrived at Aerith''s church looking for Jenova, he came across a box containing
    several Materia, which were confirmed in the Reunion Files and Advent Children Staff Commentary to
    be Cloud''s. After defeating Tifa, Loz kidnapped Marlene and took the Materia with him, which Kadaj
    and Yazoo proceeded to use as well. Due to Remnants being made of Negative Lifestream and Materia
    being condensed Spirit Energy from the Lifestream, containing the wisdom of the Cetra to use the powers
    of the Planet, they can simply absorb them directly into their bodies to use them. While Yazoo and
    Loz were not explicitly shown using Materia, the English Script included in the Collector''s Set for
    the Advent Children movie reveals that Yazoo and Loz used Flare, Comet and a spell called Explosion
    in their suicide attack against Cloud at the end of the movie, meaning they had the following Materia
    in their possession: **Contain: A Materia originally found in Mideel, grants the Freeze, Break, Tornado
    and Flare spells to the user. Given Yazoo and Loz used Flare, would mean the Materia was mastered
    and had access to all of its spells. **Comet: A Materia originally found in the Forgotten Capital
    and grants the Comet and Comet2 spells. **Explosion: Presumably the Materia that teaches the Explosion
    spell. A Materia like this is never found in the original game, though it''s possible that, like Bahamut
    SIN, Cloud acquired it between the original story and the events of Advent Children.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
