- id: claim-weaknesses-7f5451d5
  section: weaknesses
  axis: weakness
  text: "Despite being the calmest of the Remnants, Yazoo is incredibly arrogant and prone to look down\
    \ on his enemies, taunting and playing with them instead of finishing things. Unless he really is\
    \ pushed in battle he's unlikely to take a more pragmatic approach, and by then it may be too late\
    \ to turn things around. Notable Attacks/Techniques: Despite not displaying unique techniques during\
    \ his fights, Yazoo does have some abilities he shares with his brothers, as well as the magic granted\
    \ to him by the Materia that was stolen from Cloud: *Personal: **Geostigma: A fatal disease caused\
    \ by Jenova Cells in the body. The parasitic presence of Jenova causes an internal conflict between\
    \ the cells and the patient's natural Spirit Energy, this leads to the body overworking itself trying\
    \ to purge the cells, which causes symptoms such as physical weakness, extreme fatigue, seizures,\
    \ hallucinations, depression, dark sores on the skin which emit a black pus and, eventually, death.\
    \ However, the severity of the symptoms may vary from patient to patient, some may die within a couple\
    \ of hours while others may simply have occasional bouts of pain. Those who die of Geostigma won\u2019\
    t join the Lifestream but rather will become part of the Negative Lifestream Sephiroth created. Given\
    \ Geostigma injects Jenova Cells in those suffering from it, they may have their Reunion instinct\
    \ awakened and are vulnerable to Sephiroth enforcing his will through them. Geostigma can be contracted\
    \ by contact with Jenova Cells scattered in the Lifestream, direct contact with Negative Lifestream\
    \ or being wounded by a Shadow Creeper, as they are made of Negative Lifestream. **Shadow Creepers:\
    \ Big quadrupedal monsters of vicious nature, materialized from the Negative Lifestream, reason why\
    \ they can be summoned without Materia. While they aren't particularly strong, they are quite fast\
    \ and persistent, and even if they are injured or mutilated they will keep chasing their target. However,\
    \ what's truly dangerous about them is that due to being made of Negative Lifestream, those who are\
    \ injured by a Shadow Creeper will be infected with Geostigma, something made worse by the fact they\
    \ can be summoned in large numbers at once. *Materia: **Comet and Comet2: The user summons a meteorite\
    \ or a shower of meteorites to crash into the opponent. These spells cannot be reflected. **Freeze:\
    \ A sudden cold surrounds an enemy and then they\u2019re instantly encased in ice, freezing its surrounding\
    \ area as well. May inflict Stop. **Break: Rock is materialized around the opponent and proceeds to\
    \ crush them, turning them into stone as well. May inflict Petrification. **Tornado: A spell that\
    \ creates a powerful twister on an opponent. May inflict confusion. **Flare: The user causes a nuclear\
    \ reaction by making the atoms of the target collide with each other, resulting in a powerful explosion\
    \ of extreme heat to completely incinerate an opponent. **Explosion: While the exact effects of this\
    \ spell are unknown, it seems this ability simply triggers a massive blast of magical energy, very\
    \ indicative of its name. ==Notable Matchups== Victories: Losses: Inconclusive: {{scroll box|content={{reflist|2}}}}\
    \ {{Discussions}} Category:Characters Category:Final Fantasy Category:Final Fantasy VII Category:Game\
    \ Characters Category:Video Game Characters Category:Book Characters Category:Movie Characters Category:Male\
    \ Characters Category:Villains Category:Evil Characters Category:Antagonists Category:Gun Users Category:Blade\
    \ Users Category:Bikers Category:Drivers Category:Martial Artists Category:Brawlers Category:Weapon\
    \ Masters Category:Acrobats Category:Enhanced Senses Users Category:Magic Users Category:Explosion\
    \ Users Category:Ice Users Category:Earth Users Category:Petrification Users Category:Air Users Category:Madness\
    \ Users Category:Matter Users Category:Summoners Category:Disease Users Category:Creation Users Category:Inorganic\
    \ Beings"
  source_ids: *id003
  decisive: false
  status: unverified
