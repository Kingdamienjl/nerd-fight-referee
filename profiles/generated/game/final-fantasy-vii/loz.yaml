      in the original game), likely Multiverse level+ (Repeatedly fought Cloud, who
      took part in Ramza Beoulve''s army during his stay in Ivalice, as an equal to
      Balthier and Luso Clemens, the former whom had defeated Gilgamesh twice alongside
      Vaan, and the latter who had teamed up with Vaan on his own adventures. Though
      in their battles Cloud was weakened by Geostigma, he had become far more powerful
      since the events in Ivalice)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Massively FTL+ (Can casually keep up with a Cloud weakened by Geostigma
      and with Tifa while just playing around, though Tifa had grown weakerFinal Fantasy
      VII: Advent Children (2005) in the past 2 years), higher with the Warp Tool
      (This ability allows Loz to move much faster, seeming asFinal Fantasy VII: Advent
      Children (2005) if he was teleporting. It allowed him to completely ovewhelmFinal
      Fantasy VII: Advent Children (2005) Tifa in their fight once he got serious.
      Loz compares to Kadaj, who is as strong asFinal Fantasy VII: Advent Children
      -Reunion Files- (2006) Sephiroth was in the original game)'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Stellar (Grappled with Tifa and proved to be far stronger when serious.
