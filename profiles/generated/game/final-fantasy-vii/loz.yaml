- id: claim-standard-equipment-c05158d1
  section: equipment
  axis: equipment
  text: 'Dual_Horn00.jpg|Loz''s Dual Hound Dual_Hound_Concept_Design.jpg|Concept Art
    of the Dual Hound Velvet_Nightmare_Loz and Yazoo.jpg|Yazoo and Loz firing their
    Velvet Nightmares Velvet_Nightmare_Concept_Design.jpg|Concept Art of the Velvet
    Nightmare Remnantbirth.jpg|Remnant''s Birth and Materiallization Shadow_Creeper.jpg|Shadow
    Creeper MateriaAC.JPG.jpg|Cloud''s Materia collection in Advent Children Kadaj-absorbing-a-Materia-FFVIIAC.jpg|Kadaj,
    a remnant of Sephiroth, absorbs Materia directly in his arm *Dual Hound Loz''s
    main weapon, a mechanical gauntlet equipped with a retractable function to deliver
    incredibly powerful strikes and delivering electrical discharges with varying
    intensity, effectively functioning like a taser. When retracted, the Dual Hound
    can serve as a protective arm piece of gear that covers Loz''s left forearm. When
    activated, a handle moves to the wearer''s hand which can be used to trigger the
    extraction of the two prongs that release the electric discharge. *Velvet Nightmare:
    Like Yazoo, Loz carries one of these guns, but using it as a backup weapon instead
    by virtue of being primarily a brawler. The Velvet Nighmater is a gun, more precisely
    a Gunblade variant, designed with blades on the slide of the cannon, not meant
    to attack but which can be used to defend against other weapons, just like how
    Yazoo did against Cloud''s Fusion Swords. When Yazoo''s own was destroyed during
    a fight with Cloud, Loz lent Yazoo his own which he used until his final appearance.
    *Motorcycle Like his brothers, Loz rides a large motorcycle with three large pipes
    on the rear, and smaller ones covering the middle, facing front. The Remnants
    are shown to be incredibly skilled at maneuvering with these vehicles, performing
    stunts that would normally be impossible and be perfectly capable of engaging
    in combat and competent teamwork while riding them at high speeds. *Cloud''s Materia:
    When Loz arrived at Aerith''s church looking for Jenova, he came across a box
    containing several Materia, which were confirmed in the Reunion Files and Advent
    Children Staff Commentary to be Cloud''s. After defeating Tifa, Loz kidnapped
    Marlene and took the Materia with him, which Kadaj and Yazoo proceeded to use
    as well. Due to Remnants being made of Negative Lifestream and Materia being condensed
    Spirit Energy from the Lifestream, containing the wisdom of the Cetra to use the
    powers of the Planet, they can simply absorb them directly into their bodies to
    use them. While Yazoo and Loz were not explicitly shown using Materia, the English
    Script included in the Collector''s Set for the Advent Children movie reveals
    that Yazoo and Loz used Flare, Comet and a spell called Explosion in their suicide
    attack against Cloud at the end of the movie, meaning they had the following Materia
    in their possession: **Contain: A Materia originally found in Mideel, grants the
    Freeze, Break, Tornado and Flare spells to the user. Given Yazoo and Loz used
    Flare, would mean the Materia was mastered and had access to all of its spells.
    **Comet: A Materia originally found in the Forgotten Capital and grants the Comet
    and Comet2 spells. **Explosion: Presumably the Materia that teaches the Explosion
    spell. A Materia like this is never found in the original game, though it''s possible
    that, like Bahamut SIN, Cloud acquired it between the original story and the events
    of Advent Children.'
