- id: claim-weaknesses-5e40b988
  section: weaknesses
  axis: weakness
  text: 'Skill and technique aside, Loz is very simple-minded, impulsive and childish,
    many times looking to have fun in battle rather than winning. Provoking him is
    not particularly difficult and his style and strategy are very straightforward
    beyond occasional distractions to flank his opponents. Also, by being made of
    Negative Lifestream, Loz is very vulnerable to purification, just like his brothers,
    as seen how Kadaj was physically hurt by Aerith''s rain when she cured Cloud''s
    Geostigma. Notable Attacks/Techniques: Being a martial artist equipped with a
    rather peculiar weapon, Loz has various moves at his disposal to use in battle,
    as well as abilities he shares with his brothers due to his nature as a Remnant
    of Sephiroth, along with the spells granted by the Materia stolen from Cloud:
    *Personal: **Dual Hound - Impact: The complete offensive function of the Dual
    Hound, once active, a handle is moved to the hand of the user, which triggers
    a pair of prongs to extend towards the opponent, along which a very powerful electric
    current is discharged, effectively working as a taser. **Warp: While the origin
    of this ability is unknown, if it''s achieved by Materia, equipment or is an ability
    possessed, Loz can suddenly accelerate dramatically his speed, which causes his
    body to glow and leave a trail of afterimages behind him, allowing him to easily
    overwhelm opponents he was even in speed before. While this ability doesn''t have
    a proper name, in the Reunion Files it is mentioned that the development team
    required a special tool, called the "Loz Warp Tool", to properly animate Loz movements.
    **Shockwave: Loz delivers a powerful strike to the ground, while making a very
    goofy face, that creates a shockwave on the earth that advances towards his opponent,
    strong enough to cancel out Cloud''s Blade Beam Limit Break. **Geostigma: A fatal
    disease caused by Jenova Cells in the body. The parasitic presence of Jenova causes
    an internal conflict between the cells and the patient''s natural Spirit Energy,
    this leads to the body overworking itself trying to purge the cells, which causes
    symptoms such as physical weakness, extreme fatigue, seizures, hallucinations,
    depression, dark sores on the skin which emit a black pus and, eventually, death.
    However, the severity of the symptoms may vary from patient to patient, some may
    die within a couple of hours while others may simply have occasional bouts of
    pain.Those who die of Geostigma won’t join the Lifestream but rather will become
    part of the Negative Lifestream Sephiroth created. Given Geostigma injects Jenova
    Cells in those suffering from it, they may have their Reunion instinct awakened
    and are vulnerable to Sephiroth enforcing his will through them. Geostigma can
    be contracted by contact with Jenova Cells scattered in the Lifestream, direct
    contact with Negative Lifestream or being wounded by a Shadow Creeper, as they
    are made of Negative Lifestream. **Shadow Creepers: Big quadrupedal monsters of
    vicious nature, materialized from the Negative Lifestream, reason why they can
    be summoned without Materia. While they aren''t particularly strong, they are
    quite fast and persistent, and even if they are injured or mutilated they will
    keep chasing their target. However, what''s truly dangerous about them is that
    due to being made of Negative Lifestream, those who are injured by a Shadow Creeper
    will be infected with Geostigma, something made worse by the fact they can be
    summoned in large numbers at once. *Materia: **Comet and Comet2: The user summons
    a meteorite or a shower of meteorites to crash into the opponent. These spells
    cannot be reflected. **Freeze: A sudden cold surrounds an enemy and then they’re
    instantly encased in ice, freezing its surrounding area as well. May inflict Stop.
    **Break: Rock is materialized around the opponent and proceeds to crush them,
    turning them into stone as well. May inflict Petrification. **Tornado: A spell
    that creates a powerful twister on an opponent. May inflict confusion. **Flare:
    The user causes a nuclear reaction by making the atoms of the target collide with
    each other, resulting in a powerful explosion of extreme heat to completely incinerate
    an opponent. **Explosion: While the exact effects of this spell are unknown, it
    seems this ability simply triggers a massive blast of magical energy, very indicative
    of its name. ==Notable Matchups== Victories: Losses: Inconclusive: {{scroll box|content={{reflist|2}}}}
    {{Discussions}} Category:Characters Category:Final Fantasy Category:Final Fantasy
    VII Category:Game Characters Category:Video Game Characters Category:Book Characters
    Category:Movie Characters Category:Male Characters Category:Villains Category:Evil
    Characters Category:Antagonists Category:Gauntlet Users Category:Gun Users Category:Blade
    Users Category:Bikers Category:Drivers Category:Martial Artists Category:Weapon
    Masters Category:Acrobats Category:Enhanced Senses Users Category:Electricity
    Users Category:Time Users Category:Magic Users'
