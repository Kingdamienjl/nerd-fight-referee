    infect people with Geostigma when hurting them); Creation (his clothes and weapons
    are materialized from Negative Lifestream); Incorporeality (like his brothers,
    Loz is an extension of Sephiroth's will made out of Negative Lifestream). Resistance
    to Disease Manipulation; Corruption (Types 1 and 2).
