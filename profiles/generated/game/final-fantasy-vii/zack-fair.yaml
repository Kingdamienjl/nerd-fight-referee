power_scale:
  tier:
    text: At least {{High 6-A}}, likely higher, even higher with the Digital Mind
      Wave | {{4-A}}, higher with the Digital Mind Wave | {{2-A}}, higher with the
      Digital Mind Wave
    source_ids: &id002
    - mediawiki-6418
    confidence: 0.95
  attack_potency:
    text: At least Multi-Continent level, likely higher (Defeated Ifrit in battle,
      finding himself in trouble only due to his back then bad habit of letting down
      his guard when believing trouble was over. Would later defeat Ifrit in a rematchCrisis
      Core -Final Fantasy VII- (2007) and claim his Materia, earning his command.
      Ifrit is consistently portrayed through the franchise as Shiva's equal. Some
      time later, Zack would defeat Bahamut, a far stronger Summon, and also obtain
      his Materia), even higher with the Digital Mind Wave (The Digital Mind Wave
      allows Zack to empower himself through memories and emotions, as well as perform
      Limit Breaks, techniques stated to reach power far beyond the user's regular
      capabilities) | Multi-Solar System level (In his earlier missions as a 1st Class
      SOLDIER, Zack easily defeated Bahamut Fury. With time he would become strong
      enough to defeat Minerva, an entity stated to be strongerCrisis Core -Final
      Fantasy VII- (2007) than Summons, which puts her above Zirconiade and makes
      her far more powerful than Bahamut Fury), higher with the Digital Mind Wave
      | Multiverse level+ (Draws power from the Gods of the Cycle. Participated in
      the defeat of Shinryu)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Sub-Relativistic+ (As a SOLDIER 2nd Class with recomendations for 1st Class
      promotion, Zack is far stronger than the 3rd Class members that would fight
      Cloud Strife and his allies during the events of Midgar) | Massively FTL+ (Easily
      kept up with Bahamut Fury's attacks. Would later grow strong enough to defeat
      Minerva, whom is far stronger than Bahamut Fury) | Massively FTL+ (Comparable
      to other Warriors of the Cycle. Took part in the defeat of Shinryu)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class M (Could contend with Ifrit, a Summon comparable to Titan) | Stellar
      (Clashed with Minerva, a being stated to be stronger than Summons, which would
      puts her far above Typhon) | Immeasurable (As a warrior of Materia and by drawing
      power from the Gods of the Cycle, is superior to Exdeath and Enuo in their original
      game, whom could move the Void itself)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Multi-Continent level | Multi-Solar System level | Multiverse level+
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least Multi-Continent level, likely higher (Fought Ifrit and withstood
      his Hellfire attack, only finding himself in danger due to letting his guard
      down. Ifrit is consistently portrayed as equal to Shiva. Later Zack would fight
      Bahamut and show to be capable of taking his Megaflare) | Multi-Solar System
      level (Fought Bahamut Fury and endured his strongest attacks, including Exaflare.
      Later would become strong enough to fight Minerva, a being stronger than Summons,
      being above Zirconiade and thus far more powerful than Bahamut Fury, and also
      push through her Judgment Arrow and other powerful moves) | Multiverse level+
      (Can fight the other Warriors of the Cycle. Survived Shinryu's attacks)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Zack is very fit and energetic; he frequently does squats in
      his free time. He can fight and defeat 1,000 Shrina Troopers back-to-back without
      fatigue. At the end of Crisis Core, Zack went up against a massive platoon of
      Troopers, where he was able to defeat them all except for three, due to heavy
      wounds and fatigue. After being gunned down, he remained conscious long enough
      for Cloud to find him, where they had a short conversation before he drew his
      last breath.)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range, much higher with magic and summons.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: A master swordsman who clashed with all three Legendary SOLDIERs and successfully
      defeated Angeal and Genesis. A 1st Class SOLDIER, Zack has access to a wide
      variety of skills and magic through his mastery of Materia. He also skilled
      in hand-to-hand combat, defeating Shinra's battalions of foot soldiers with
      nothing but his hands due to leaving the Buster Sword with Cloud as a shield
      against bullets.
    source_ids: *id002
    confidence: 0.95
