- id: claim-weaknesses-c659f602
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Costly Punch: Zack can spend a portion of his health
    to deal a powerful punch that ignores conventional defenses such as armor. *Death Jump: Leaps into
    the air before coming down on his opponent with the Buster Sword, inflicting Instant Death if the
    opponent has not demonstrated immunity to it. *Digital Mind Wave: Zack''s Limit Break, allowing him
    to unleash a variety of attacks inspired by his close associates depending on his mental state. Also,
    his attack power is proportional to his emotional state, ranging from low (depressed and tired) to
    normal (primary, calm mental state) to Heavenly (charged, extremely emotionally invested). *Chain
    Slash: A physical hit against one enemy. *Octaslash: Zack''s drive to match Sephiroth allows him to
    use the latter''s signature attack, unleashing eight physical hits against one enemy. *Rush Assault:
    Angeal''s advice urge Zack to unleash a combo of 15 physical hits total on one enemy or seven hits,
    seven hits, and one hit on up to three enemies. The final hit inflicts Stun (a form of paralysis).
    He pulls off a series of punches, finishing by speeding by the target. *Air Strike: Zack calls Tseng
    to send in an airstrike from one of Shinra''s attack helicopters, bombarding the opponent with missiles
    and heavy machine-gun fire. *Meteor Shots: Zack''s friendship with Cloud has him jump into the air
    and swing his blade multiple times, sending explosive blasts at his targets, dealing physical damage.
    An analog to Cloud''s Meteorain Limit Break. *Healing Wave: Aerith''s prayers completely restores
    HP, MP, and AP, with a chance of doubling the limits of his vitality temporarily, and clears status
    effects. He also gains complete invincibility to conventional attacks for a limited duration of time.
    *Lucky Stars: Encouragement from Cissnei causes all of his attacks are critical hits for a limited
    duration. *Apocalypse: He can cast a spell that damages all enemies through the use of a pentagram-like
    symbol. Summoning: Ifrit *Hellfire: A magical attack on all enemies. Zack summons Ifrit, who sends
    waves of flames at his targets. Bahamut *Mega Flare: A magical attack on all enemies. Zack summons
    Bahamut, who flies into the atmosphere and charges a large energy ball of destructive power. It then
    fires the ball at the ground below. Bahamut Fury *Exa Flare: A magical attack on all enemies. Zack
    summons Bahamut Fury, who, in outside space, uses the moon as a conductor to fire a large focused
    destructive beam at his targets. Odin *Zantetsuken: A summon that slashes Zack''s target with an incredibly
    sharp sword, inflicting Instant Death to those who aren''t immune to it. Phoenix *Rebirth Flame: A
    magical attack on all enemies. It casts Raise on Zack. Raise means that if he is KOed, he''ll be resuscitated
    automatically and fully healed. Note: Zack getting gunned down by Shinra Troopers is considered an
    example of Plot-Induced Stupidity ==Notable Matchups== Victories: Loses: Inconclusive: ==References==
