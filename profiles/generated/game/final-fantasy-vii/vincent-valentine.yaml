      VII- (2006) around Vincent due to the difference in speed), even higher in Chaos
      Form (Even in a berserk state, he could blitzDirge of Cerberus -Final Fantasy
      VII- (2006) Arch Azul, when before Vincent had failedDirge of Cerberus -Final
