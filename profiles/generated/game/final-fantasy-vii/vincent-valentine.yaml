  attack_potency:
    text: 'At least Multi-Continent level, likely higher (Easily took outBefore Crisis
      -Final Fantasy VII- (2004) 3rd ver. Ravens, a type far stronger than the 2nd
      which effortlessly defeatedBefore Crisis -Final Fantasy VII- (2004) 2nd Class
      SOLDIER members, like Sebastian and EssaiCrisis Core -Final Fantasy VII-: The
      Complete Guide (2007), whom compare to Zack Fair when he took down Ifrit, a
      Summon equal to Shiva. Grew stronger since then after joining Cloud and obtained
      control of even stronger Summons, like Bahamut), even higher with Metamorphize
      (Metamorphize, Vincent''s Limit Break, allows him to transform into different
      monsters greatly enhancing his capabilities) | Multi-Solar System level (Equal
      to Red XIII and Cloud, the latter whom Survived the energy released by the awakening
      of 5 of the 8 Weapons. Grew strong enough to participate in the defeat of 3
      of the Weapons, with each Weapon being around the same level as Minerva, a being
      stronger than SummonsCrisis Core -Final Fantasy VII- (2007), thus above Zirconiade
      and far more powerful than Bahamut ZERO), likely Multiverse level+ (Compares
      to Cloud, who fought in Ramza Beoulve''s army during his stay in Ivalice, as
      an equal to Balthier and Luso Clemens, the former whom had defeated Gilgamesh
      twice alongside Vaan, and the latter who had teamed up with Vaan on his own
      adventures. Cloud had become far stronger since these events), higher with Metamorphize
      | Multi-Galaxy level (Controls the Knights of the Round, the only Summon who
      is far stronger than Minerva. Participated in the defeats of Jenova∙SYNTHESIS,
      the strongest she has ever beenFinal Fantasy VII: Ultimania Omega (2005), and
      Safer Sephiroth, whom had become a being described as godlikeFinal Fantasy:
      Ultimania Archive - Volume 2 (2018) and nearing godhoodFinal Fantasy: Ultimania
      Archive - Volume 2 (2018) after absorbing knowledge from the Lifestream and
      completing the Reunion. Vincent''s abilities remained during the events of Advent
      Children, as time doesn''t dullBefore Crisis -Final Fantasy VII- (2004) his
      capabilities thanks to his immortal body), likely Multiverse level+ (Far stronger
      than before), higher with Metamorphize | Multi-Galaxy level, likely Multiverse
      level+ (Should be no weaker than before thanks to his immortality. Fought the
      colored Tsviets, however, aside Weiss, how they measure to previous enemies
      is unclear), higher with Metamorphize, far higher when empowered by Chaos (Upon
      controlling the essence of Chaos with the Protomateria, Vincent soundly defeatedDirge
      of Cerberus -Final Fantasy VII- (2006) Weiss the Immaculate when moments earlier
      Weiss had completely overhwelmedDirge of Cerberus -Final Fantasy VII- (2006)
      him), even higher in Chaos Form and with the Death PenaltyDirge of Cerberus
      -Final Fantasy VII- (2006) (Even in its uncontrolled state, Chaos Vincent could
      one-shotDirge of Cerberus -Final Fantasy VII- (2006) Arch Azul when previously
      he easily recoveredDirge of Cerberus -Final Fantasy VII- (2006) from a long
      assault. Once in control, and with the Death Penalty, Vincent defeated Weiss
      after he had merged with Omega) | Multiverse level+ (Draws power from the Gods
      of the Cycle. Participated in the defeat of Shinryu), far higher with Metamorphize'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Sub-Relativistic+ (Much stronger than Cloud and the party were during the
