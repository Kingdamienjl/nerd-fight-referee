  stamina:
    text: Superhuman. Hojo's experiments endowed Vincent with remarkable resilience.
      His endurance is evident as he has withstood battles against formidable adversaries
      like Sephiroth and consistently faces waves of enemies. During his clash with
      Deepground, Vincent maintained his vigor, even under Chaos' taxing influence,
      throughout prolonged final bouts.
    source_ids: *id002
    confidence: 0.95
  range:
    text: Hundreds of Meters with standard firearms, much higher with Materia.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Very high. Vincent, a former Turk, possesses advanced skills in marksmanship,
      infiltration, espionage, and close combat. Despite a thirty-year hiatus, he
      competes with the Planet's top fighters, such as Cloud Strife and Sephiroth.
      His extensive combat experience, enriched by journeying with formidable allies
      and confronting diverse foes, is further showcased in "Dirge of Cerberus."
    source_ids: *id002
