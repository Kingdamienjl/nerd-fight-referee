  lifting_strength:
    text: 'Limited Power Mimicry (Enemy Skill allows the user to learn some abilities
      from enemies); Elemental Manipulation of different varieties: Fire (via Beta),
      Lightning (via Trine), Water (via Aqualung) and Multi-Elemental (Magic Breath
      deals Fire, Ice and Lightning damage at once); Death Manipulation (via Death
      Sentence); Durability Negation (via Pandora''s Box); Healing and Type-3 Purification
      (via White Wind and Angel Whisper); Defensive Statistics Amplificaction (via
      Dragon Force); Time Acceleration and Damage Reduction via Barrier Creation (via
      Big Guard); Status Effect Inducement via Bad Breath: Poison Manipulation, Confusion,
      Silence Inducement, Size Reduction, Transmutation into Frogs and Sleep Inducement,
      the latter two are also inflicted via Frog Song; Energy Absorption (via Magic
      Hammer). Can grant herself Resistance to Death Manipulation (via Death Force).
      |-|Support= Attack Boost of two kinds: additional effects via Elemental Attacks
      of the Fire, Absolute Zero Ice, Lightning, Earth, Wind, Water, Gravity and Holy
      variety (via the Elemental Materia, which grants the user different attributes
      when linked with different Magic and Summon Materia in their weapons), and Status
      Effect Inducement of the Poison Manipulation, Sleep Inducement, Berserk Inducement,
      Limited Madness Manipulation, Petrification, Transmutation into Frogs, Size
      Minimization, Silence Inducement, Time Slowdown, Time Stop and Instant Death
      variety (via the Added Effect Materia, which allows the user to inflict several
      Status Ailments when linked with different Magic and Summon Materia in their
      weapons), and raw power boost via Magic Attack Boost (via MP Turbo); Life Absorption
      (via HP Absorb) and Energy Absorption (via MP Absorb); Instinctive Reaction
      of different varieties: Counterattacking (via Counter Attack or Counter, Magic
      Counter and Final Attack linked with certain offensive Materia), Automatic Healing
      (via Magic Counter or Final Attack linked with a healing Materia, or the Life
      or Phoenix Materia to save the user from near death), Automatic Follow-Up (via
      Added Cut) and Instinctive Initiative (via First Strike); Enhanced Awareness
      and Stealth (via Pre-Emptive, which allows to sneak on and attack enemies by
      surpise and prevents the user from being ambushed or being caught off-guard);
      Self-Sustenance (Type 1), Enhanced Vision and Underwater Breathing (via Underwater,
      which lets the user survive and fight with no problem at the bottom of the ocean).
      Additionally, can use the same Spell or Summon four times at once at half power
      (via Quadra Magic, except for Knights of the Round); can turn the single-targeting
      of several of Commands and Spells into an Area of Effect (via the All and Mega
      All Materia); regular attacks can reach a few meters beyond their actual physical
      reach (via the Long Range Materia). Resistance to Elemental Manipulation of
      the Fire, Absolute Zero Ice, Lightning, Wind, Earth, Water, Gravity and Holy
      variety (via the Elemental Materia, which protects the user from different elements
      when linked with Magic and Summon Materia in their armor); Status Effect Inducement
      which includes Poison Manipulation (as well as Acid Manipulation); Sleep Inducement;
      Silence Inducement; Transmutation; Power Nullification; Petrification; Size
      Manipulation; Madness Manipulation; Berserk Inducement; Time Manipulation, Time
      Stop and Death Manipulation (via Added Effect, which protects the user from
      different ailments when combined with Magic and Summon Materia in their armor);
      as well as to Extreme Pressure (via Undertwater, which prevents the user from
      being affected by the conditions of the bottom of the ocean). |-|Dissidia= {{#tag:tabber|
      Abilites=All previous abilities enhanced, possible Immortality (Type 8,reliant
      on her Crystal which let Cosmos'' group return from fading from existence after
      Cosmos'' death) & Regeneration (Low-Godly), Summoning (Can summon various Eidolons
      from Summonstones and the World of Illusions), Willpower Manipulation (a person''s
      will is power there and enables them to do a multitude of things the stronger
      their willDissidia Final Fantasy Opera Omnia), Reactive Power Level (the greater
      someone''s will, the greater their powerDissidia Final Fantasy Opera Omnia),
      Law Manipulation (Beings with strong wills can overwrite the laws of the world
      and bend them to their willDissidia Final Fantasy Opera Omnia), Creation (With
      a powerful enough will, once can create various things such as phone lines,
