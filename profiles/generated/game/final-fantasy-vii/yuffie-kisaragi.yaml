    text: Superhuman. Even after the journey to the Planet's Core, battling many dangerous
      monsters, as well as Jenova and Sephiroth himself, she was no worse for wear
      and, along with Vincent, was in good enough condition to rush back to Midgar
      and help with evacuation efforts during the fall of Meteor right after Sephiroth's
      defeat.
