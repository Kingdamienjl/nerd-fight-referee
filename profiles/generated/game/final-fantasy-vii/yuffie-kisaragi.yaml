- id: claim-standard-equipment-30570eb1
  section: equipment
  axis: equipment
  text: 'Superhuman Physical Characteristics; Skilled user of Shuriken; Skilled Martial
    Artist; Stealth Mastery; Acrobatics; Energy Manipulation (can empower her attacks
    with Spirit Energy when using Limit Breaks for greater power and different effects:
    Energy Projection via Gauntlet and All Creation); Attack Boost in the form of
    raw damage boost (via Limit Breaks, which are stated to reach power much greater
    than the usual capabilities of the user) and additional effects: Healing (via
    Clear Tranquil), Earth Manipulation (via Landscraper) and Durability Negation
    (via Gauntlet); Non-Physical Interaction (able to hurt and defeat the ghost and
    souls of the fallen Gi Tribe); Regeneration Negation (Up to Low-High, the pieces
    of Jenova, even cells, destroyed by the party are gone for good and can''t be
    used for the Reunion to rebuild Jenova''s body) and Immortality Negation (Types
    2, 3, 6, 7 and 8. Can permanently kill Jenova and her pieces, who aside from being
    extremely durable is able to regenerate from single cells, as well as survive
    as long as just her cells remain, through which she can enforce her will, even
    through other people injected with them. Additionally, can permanently finish
    off the souls and spectres of the Gi Tribe). Resistance to Banishment (despite
    entering the Planet''s Core within the Lifestream itself, Yuffie was not taken
    forcefully taken from the living world. Later, his spirit followed Sephiroth''s
    deeper into the Lifestream without being reclaimed); Mind Manipulation and Memory
    Manipulation (her mind has grown strong enough to not collapse nor be eroded under
    the weight of the Spirit Energy of the Lifestream); Soul Manipulation, Soul Absorption
    and Empathic Manipulation (her spirit was not forcefully diffused nor reabsorbed
    by the Lifestream); Biological Absorption, Deconstruction and Matter Manipulation
    (her physical body wasn''t absorbed nor was dissolved by the Lifestream to retake
    her Spirit Energy); Corruption (Types 1 and 2, despite immense exposure to Spirit
    Energy, on several occasions, she never became a Makonoid. Additionally, was unaffected
    by Jenova''s Virus despite confronting her directly); Extreme Heat and Extreme
    Radiation (withstood Sephiroth''s Supernova); Mind Reading, Perception Manipulation,
    Illusion Creation, Telekinesis and Possession (by the time of their spiritual
    battle, she had grown strong enough to resist Sephiroth''s mental abilities);
    Power Mimicry and Power Absorption (Limit Breaks are born from the user''s Spirit
    Energy, which shapes their mind and soul, and cannot be copied or imitated, the
    sole exception being Zack who is acknowledged as an unusual case, and even then
    creates a variant of the original move).'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-81724a62
  section: power_scale
  axis: battle_iq
  text: Above Average (Yuffie can be cunning when it comes to schemes and has shown
    to be a talented fighter and very skilled Materia user, fitting for her career
    as a Materia Hunter, able to keep up with the party and contribute as a valuable
    member in their fights. Despite her skill, Yuffie still has much to learn and
    mature both as a warrior and as a person)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-eed816ae
  section: weaknesses
  axis: weakness
  text: 'Yuffie must be pressed in a battle to use her Limit Breaks; therefore, most
    of the time, she can''t use them right away or repeatedly. Due to her stubborn
    personality, Yuffie is prone to rash decisions and make mistakes when under pressure,
    noticeable when the party chased her down in Wutai as she went from flawlessly
    robbing the entire party mid-fight, to increasingly miserable attempts to hide
    as she was further cornered. She also pays little attention to what doesn''t catch
    her interest, nor she bothers in studying or gathering information on it, leading
    her to be more naive and uninformed than she should on several topics, even Materia,
    which despite being her highest objective is something she has no noticeable knowledge
    in. Notable Attacks/Techniques: |-|Limit Breaks= Limit Breaks are powerful special
    moves Yuffie can perform in battle. All living beings have a portion of the Spirit
    Energy that flows through the Lifestream in themselves, when this energy raises
    to its limit it eventually aligns and overflows allowing to go beyond the user''s
    standard capabilities and reach a much higher power, just as their name indicate.
    Limit Breaks are affected by emotions; intense ones such as rage can lead to attaining
    the state to use these moves much faster than usual. A proof of their power can
    be seen in Cloud''s battle against Bahamut SIN: his regular attacks did little
    more than annoy the Summoned Beast, however his Braver Limit Break could scar
    its face and knock it off the air, sending it plummeting to the ground, while
    Climhazzard could destroy Bahamut with a single use. Level 1: *Greased Lightning/Shippu
    Jinrai: Yuffie dashes at an enemy and slashes at such speed that she can retreat
    even before the enemy can feel the damage of the attack. *Clear Tranquil/Meikyo
    Shisui: Yuffie concentrates as bubbles of Spirit Energy engulf her and her allies,
    restoring health equal to half of their maximum. Level 2: *Landscraper/Batsuzan
    Gaisei: Yuffie punches the floor creating a shockwave that travels to the enemies
    and causes the ground below them to erupt in a blast of rocks and dirt. *Bloodfest/Chimatsuri:
    Yuffie assaults opponents quickly dancing around them as she viciously slashes
    them from blind spots, with her spirit energy leaving a trail resembling blood.
    Level 3: *Gauntlet/Gaishu Isshoku: Yuffie creates a ring of energy of Spirit Energy
    at the feet of her foes, and as it spins the energy erupts upwards in several
    streams of light. This attack ignores the enemies'' defenses. *Doom of the Living/Shoja
    Hitsumetsu: An advanced version of Bloodfest. Yuffie charges at her enemies again,
    but as she strikes her Spirit Energy erupts in streams of a sickly purple light
    with each slash. The combo increases the number of hits for 10 to 15. Level 4:
    *All Creation/Shinra Bansho: Yuffie holds her weapon in front of her as she concentrates,
    her Spirit Energy glows violet and takes the form of an expanding circle, before
    shooting a massive beam that blasts away enemies. |-|Magic= Accessed through the
    Green Materia, this allows the wielder to access the wisdom of the Ancients, the
    Cetra, and the connection they shared with the Planet to use its powers and manifest
    all sort of incredible feats. These can range from offensive manipulation of the
    elements, to support effects and even powerful healing abilities. While each Magic
    Materia normally allows the use of a specific set of spells (such as Lightning
    allowing to use Bolt, Bolt2 or Bolt 3; or Mystify granting Berserk and Confu,
    both mind-affecting spells), there exists the Master Magic Materia, which gives
    the user every spell in existence with the exception of the one of a kind Holy
    and Meteor. Notable spells include: Offensive: *Fire3 (Firaga), Ice3 (Blizzaga),
    Bolt3 (Thundaga) and Quake3 (Quaga): Very high-level elemental magic that conjures
    their respective elements for a powerful attack to strike a single enemy or a
    wide area. *Bio3 (Bioga): The user cast large bubbles of venomous liquids that
    drown the enemy to inflict heavy damage and leave them poisoned. *Demi3 (Graviga):
    A powerful gravity well is created to drag and crush enemies within it. This spell
    cannot be reflected. *Comet2 (Cometeor): Calls forth several small meteors from
    outer space to strike the enemy four times. This spell cannot be reflected. *Death:
    A spell that conjures a Grim Reaper to kill an opponent instantly. This spell
    can affect robotic enemies and ghosts unless they explicitly resist instant death.
    *Tornado: A spell that creates a powerful twister on an opponent. May inflict
    confusion. *Freeze: A sudden cold surrounds an enemy and then they’re instantly
    encased in ice, freezing its surrounding area as well. May inflict Stop. *Break:
    Rock is materialized around the opponent and proceeds to crush them, turning them
    into stone as well. May inflict Petrification. *Flare: The user causes a nuclear
    reaction by making the atoms of the target collide with each other, resulting
    in a powerful explosion of'
