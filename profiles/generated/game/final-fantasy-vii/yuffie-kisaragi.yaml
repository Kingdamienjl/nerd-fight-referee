  attack_potency:
    text: 'At least Multi-Continent level, likely higher (Can fight alongside Vincent
      Valentine, whom had easily taken outBefore Crisis -Final Fantasy VII- (2004)
      3rd ver. Ravens, a type far stronger than the 2nd which effortlessly defeatedBefore
      Crisis -Final Fantasy VII- (2004) 2nd Class SOLDIER members, like Sebastian
      and Essai,Crisis Core -Final Fantasy VII-: The Complete Guide (2007) whom compare
      to Zack Fair when he took down Ifrit, a Summon equal to Shiva. Grew stronger
      since then and earned control of stronger Summons like Leviathan and Bahamut),
      even higher with Limit Breaks (Limit Breaks are stated to allow the user to
      reach power far beyond their usual capabilities) | Multi-Solar System level
      (Equal to Red XIII and Cloud, the latter whom survived the energy releasedFinal
      Fantasy VII (1997) by the awakening of 5 of the 8 Weapons. Grew strong enough
      to participate in the defeat of 3 of the Weapons, with each Weapon being around
      the same level as Minerva, a being stronger than Summons,Crisis Core -Final
      Fantasy VII- (2007) thus above Zirconiade and far more powerful than Bahamut
      ZERO), likely Multiverse level+ (Compares to Cloud, who fought in Ramza Beoulve''s
      army during his stay in Ivalice, as an equal to Balthier and Luso Clemens, the
      former whom had defeated Gilgamesh twice alongside Vaan, and the latter who
      had teamed up with Vaan on his own adventures. Cloud had become far stronger
      since these events), higher with Limit Breaks | Multi-Galaxy level (Controls
      the Knights of the Round, the only Summon who is far stronger than Minerva.
      Participated in the defeats of Jenova∙SYNTHESIS, the strongest she has ever
      been,Final Fantasy VII: Ultimania Omega (2005) and Safer Sephiroth, whom had
      become a being described as godlikeFinal Fantasy: Ultimania Archive - Volume
      2 (2018) and nearing godhoodFinal Fantasy: Ultimania Archive - Volume 2 (2018)
      after absorbing knowledge from the Lifestream and completing the Reunion), likely
      Multiverse level+ (Far stronger than before), higher with Limit Breaks | At
      most Multi-Galaxy level, likely Multiverse level+ (Has grown weaker in the two
      years since the battle with Sephiroth. Something Tifa herselfFinal Fantasy VII:
      Advent Children (2005) acknowledges. Should compare to Tifa, who managed to
      keep up with a casual Loz, a Remnant comparable to Kadaj who is stated to beFinal
      Fantasy VII: Advent Children -Reunion Files- (2006) as strong as Sephiroth was
      in the original game, but was overwhelmedFinal Fantasy VII: Advent Children
      (2005) when Loz got serious), higher with Limit Breaks | Multiverse level+ (Draws
      power from the Gods of the Cycle. Participated in the defeat of Shinryu), higher
      with Limit Breaks'
