      | At least Multi-Continent level, likely higher (Comparable to Vincent Valentine
      who easily took the attacks of 3rd ver. Ravens, a stronger version than those
      who can easily one-shotBefore Crisis -Final Fantasy VII- (2004) the 2nd Class
      SOLDIER, Sebastian and Essai,Crisis Core -Final Fantasy VII-: The Complete Guide
      (2007) who compare to the level Zack had when he defeated Ifrit) | Multi-Solar
      System level (Survived unharmed the energy releasedFinal Fantasy VII (1997)
      by the awakening of five of the eight Weapons. Eventually fought and defeated
      several of the Weapons themselves, each comparable to Minerva and far superior
      to Bahamut ZERO and Fury), likely Multiverse level+ (Fought as an equal in Ramza
      Beoulve''s army, alongside Balthier and Luso Clemens, the former whom had fought
      and defeated Gilgamesh twice alongside Vaan and the later who had teamed up
      with Vaan as well. Became far stronger after returning to the Planet and restoring
      his true persona) | Multi-Galaxy level (Fought Safer Sephiroth, who is stronger
      than the Knights of the Round), likely Multiverse level+ (Far more powerful
      than before) | Multi-Galaxy level, likely Multiverse level+ (Much stronger than
      before. Despite being weakenedFinal Fantasy VII: 10th Anniversary Ultimania
      (2007) by Geostigma could take attacks from the Remnants of Sephiroth, including
      Loz''s Pile Bunker which had one-shottedFinal Fantasy VII: Advent Children (2005)
      Tifa in a previous fight), likely far higher (Withstood Sephiroth''s OctaslashFinal
      Fantasy VII: Advent Children Complete (2009) when Sephiroth''s regular swings
      were strong enough to easily blockFinal Fantasy VII: Advent Children Complete
      (2009) Cloud''s original Omnislash. Cloud''s Limit Breaks have become strong
      to the point even mid-level ones can defeat with a single use enemies that are
      unaffected by his regular attacks) | Multiverse level+ (Can fight the other
      Warriors of the Cycle. Survived Shinryu''s attacks)'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Fought entire gauntlets of monsters, for what seem to be hours,
      with no sign of exhaustion. Clashed with powerful enemies under extreme conditions,
      such as fighting off the Remnants of Sephiroth while afflicted with Geostigma,
      a fatal disease whose symptoms include extreme fatigue and bouts of intense
      physical pain; as well as being able to keep going against Sephiroth despite
      sustaining heavy injuries, including being wounded in vital organs)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range with his swords. Tens of Meters with Limit Breaks,
      much higher with Materia.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (From the very beginning, even as an infantryman, Cloud displayed
      immense skill and natural talent for swordsmanship and battle. This, furthered
      by his military training and the memories inherited from Zack, led Cloud to
      have full grasp of every aspect of combat and strategy; including Magic, the
      use of Materia, Limit Breaks, and measures for Elemental Attributes and Ailments,
      among many other aspects, to the point, that by very early in the story, he
      could already easily defeat actual SOLDIER members. His knowledge became considerably
      more extensive thanks to his travels and encounters with more dangerous and
      powerful enemies, to the point he eventually branched from emulating Zack's
      fighting style into creating his own with the Fusion Sword, which includes expert
      use, in several different ways, of its various blades of different shapes and
      sizes. This eventually continued even after the events of the original game,
      with his delivery service requiring him to keep facing monsters and other dangers
      during the two years before his battles in Advent Children)
    source_ids: *id002
    confidence: 0.95
