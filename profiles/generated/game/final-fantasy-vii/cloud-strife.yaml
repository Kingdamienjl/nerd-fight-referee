  attack_potency:
    text: 'Wall level+ (Can fight on even ground with Avalanche Troopers), Multi-Continent
      level with Heightened Emotions (When empowered by his emotions, can fight enemies
      far above his usual level, helping the Player Turk defeat 1st ver. Ravens, warriors
      designed to counter SOLDIER), possibly higher with Firearms (Shinra has an active
      weapons development, which makes them effective even against their own superhuman
      units) | At least Multi-Continent level, likely higher (Can fight alongside
      Vincent Valentine, whom had easily taken outBefore Crisis -Final Fantasy VII-
      (2004) 3rd ver. Ravens, a type far stronger than the 2nd which effortlessly
      defeatedBefore Crisis -Final Fantasy VII- (2004) 2nd Class SOLDIER members,
      like Sebastian and Essai,Crisis Core -Final Fantasy VII-: The Complete Guide
      (2007) whom compare to Zack Fair when he took down Ifrit, a Summon equal to
      Shiva. Grew stronger since then and earned control of stronger Summons like
      Leviathan and Bahamut), even higher with Limit Breaks (Limit Breaks are stated
      to allow the user to reach power far beyond their usual capabilities) | Multi-Solar
      System level (Equal to Red XIII. Survived the energy releasedFinal Fantasy VII
      (1997) by the awakening of 5 of the 8 Weapons at once and defeated the Ultimate,
      Ruby and Emerald Weapons alongside his team, each Weapon being around the same
      level as Minerva, a being stronger than Summons,Crisis Core -Final Fantasy VII-
      (2007) stronger than Zirconiade, thus far above Bahamut ZERO), likely Multiverse
      level+ (During his stay in Ivalice, Cloud fought in Ramza Beoulve''s army as
      an equal to Balthier and Luso, the former whom had fought and defeated Gilgamesh
      twice alongside Vaan, and the latter whom had teamed up with Vaan on his own
      journeys. Though Cloud arrived in a very weakened state, he quickly caught up
      and became much stronger upon returning to the Planet and restoring his true
      self), higher with Limit Breaks | Multi-Galaxy level (Controls the Knights of
      the Round, the only Summon who is far stronger than Minerva. Was instrumental
      in the defeats of Jenova∙SYNTHESIS, the strongest she has ever been,Final Fantasy
      VII: Ultimania Omega (2005) and Safer Sephiroth whom had become a being described
      as godlikeFinal Fantasy: Ultimania Archive - Volume 2 (2018) and nearing godhood
      after absorbing knowledge from the Lifestream and completing the Reunion, then
      winning the duelFinal Fantasy VII: 10th Anniversary Ultimania (2007) between
      their Spirits in the Lifestream), likely Multiverse level+ (Far stronger than
      before), higher with Limit Breaks | Multi-Galaxy level, likely Multiverse level+
      (Much more powerful than before, something Sephiroth acknowledges and is impressed
      by,Final Fantasy VII: 10th Anniversary Ultimania (2007) despite his own superior
      power. Even when suffering from Geostigma,Final Fantasy VII: 10th Anniversary
      Ultimania (2007) Cloud could hold his own against the three Remnants of Sephiroth,
      among whom Kadaj is stated to beFinal Fantasy VII: Advent Children -Reunion
      Files- (2006) as strong as Sephiroth was in the original game. Once cured, Cloud
      could easily defeat Kadaj), far higher with Limit Breaks (Cloud''s Limit Breaks
      have become powerful to the point they can one-shot enemies that normally are
      unaffected by his regular attacks, such as Bahamut SIN or Sephiroth, the latter
      whom had easily controlled their duel despite holding back) | Multiverse level+
      (Draws power from the Gods of the Cycle. Participated in the defeat of Shinryu)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Supersonic (Can keep up with enemies who can dodge the gunfire of his machine
      gun) | Sub-Relativistic+ (As early as the events of Midgar, could dodge the
      lasers of the security systems inside Shinra''s facilities. Has become much
      stronger since then) | Massively FTL+ (Is an equal to Red XIII. Stronger than
      the Weapons, whom each is around the same level as Minerva, a being stronger
      than Summons,Crisis Core -Final Fantasy VII- (2007) which puts her above Zirconiade
      and, by extension, far above Bahamut Fury) | Massively FTL+ (Is comparable to
      Safer Sephiroth. Controls the Knights of the Round) | Massively FTL+ (Far more
      powerful than before. Even when suffering from Geostigma,Final Fantasy VII:
      10th Anniversary Ultimania (2007) Cloud could keep up with the three Remnants
      of Sephiroth at once before being defeated, among whom Loz had an acceleration
      ability that allowed him to blitz TifaFinal Fantasy VII: Advent Children (2005)
      in a previous encounter, and Kadaj is stated to beFinal Fantasy VII: Advent
      Children -Reunion Files- (2006) as powerful as Sephiroth was in the original
      game. Once cured, Cloud easily overwhelmed and defeated Kadaj), far higher with
      Omnislash Version 5 (This Limit Breaks allowed Cloud to completely outspeed
      and overwhelm Sephiroth, whom had previously easily controlled the pace of the
      fight despite holding back) | Massively FTL+ (Comparable to other Warriors of
      the Cycle. Took part in the defeat of Shinryu)'
    source_ids: *id002
    confidence: 0.95
