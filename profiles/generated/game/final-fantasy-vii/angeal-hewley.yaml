- id: claim-weaknesses-aeadb810
  section: weaknesses
  axis: weakness
  text: 'Due to the value the Buster Sword has to him, Angeal will avoid using it at all costs in combat
    to avoid damaging it, resorting to a much inferior standard SOLDIER blade. He has a great deal of
    self-loathing and wishes for nothing more but to die for being a "monster", which makes him contradict
    even his own values of honor and lose sight of the dreams that once pushed him forward. Notable Attacks
    and Techniques: *Rush Assault: Repeatedly assails a target or targets with a flurry of punches and
    kicks before charging his fists and dashing through them, generating an explosion that deals heavy
    damage. *Wings of Pride: A powerful eight-hit attack. *Charge of Greed: Angeal Penance charges at
    the opponent, dealing a crushing blow that ignores physical defenses. *Defense of Lust: Generates
    a barrier that protects him from both physical and magical attacks. *End of Gluttony: Angeal heals
    himself for a moderate amount. *Unleashed Rage: A powerful magical attack that ignores magical resistances.
    ==Explanations== Regarding as to whether Angeal Penance is stronger than human Angeal, given he never
    seriously fought anybody as a human during Crisis Core it''s hard to determine exactly how strong
    he was for sure, however certain elements allow to piece together an idea about it: During the events
    of Modeoheim, when Zack was still recently promoted to 1st Class and before he even got the Buster
    Sword, a decaying Genesis could give him a very hard fight despite being defeated (noticeable in that
    Zack looks tired after the fight), and shortly after Zack would defeat Angeal Penance, meaning this
    form of Angeal compares to a very weakened Genesis. At his prime, Genesis had a close fight with endgame
    Zack, whom had become far more powerful by that point and had even defeated Minerva, while human Angeal
    was fast and strong enough to intercept a clash between Genesis and Sephiroth when both were getting
    carried away in a spar, and Genesis was even seemingly going all out. Additionally, Angeal even took
    a point blank fire attack from Genesis and recovered just moments later without injury. While Sephiroth
    is not a point of reference, given it''s unclear how serious he was and how he''s portrayed as superior
    to everyobody else, Angeal at the very least shows he could compare to prime Genesis. So it''s safe
    to assume that Angeal Penance is actually a weakened form of Angeal. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters
    Category:Final Fantasy Category:Final Fantasy VII Category:Male Characters Category:Game Characters
