- id: claim-standard-equipment-a549afd1
  section: equipment
  axis: equipment
  text: 'Kadaj-Souba.jpg|Kadaj holding the Souba against Cloud Souba Concept Art.jpg|Concept
    Art of the Souba Remnantbirth.jpg|Remnant''s Birth and Materialization Shadow
    Creeper.jpg|Shadow Creeper MateriaAC.JPG.jpg|Cloud''s Materia collection in Advent
    Children Kadaj-absorbing-a-Materia-FFVIIAC.jpg|Kadaj absorbs Materia directly
    in his arm ZYKadaj.png|Kadaj holding what''s likely Bahamut SIN''s Materia Bahamut
    SIN summoning.png|Kadaj summoning Bahamut SIN Bahamut SIN.png|Bahamut SIN FFAC-BahamutSIN-Concept.jpg|Concept
    Art of Bahamut SIN *Souba: Kadaj''s primary weapon, materialized from Negative
    Lifestream. A katana with two parallel blades set at a small distance from one
    another. Kadaj uses this sword for quick and precise attacks, complimenting his
    agile and acrobatic fighting style, and the two blades can trap the opponents''
    weapon and possibly disarm them. Kadaj holds the Souba normally or in a reverse
    grip to adapt to combat situations better. Despite its smaller size, it doesn''t
    suffer from a strength output disadvantage against heavier weapons such as Cloud''s
    Fusion Sword. *Motorcycle Like his brothers, Kadaj rides a large bike with three
    large pipes on the rear, and smaller ones covering the middle, facing front. The
    Remnants are shown to be incredibly skilled at maneuvering with these vehicles,
    performing stunts that would generally be impossible and be perfectly capable
    of engaging in combat and competent teamwork while riding them at high speeds.
    *Cloud''s Materia: When Loz arrived at Aerith''s church looking for Jenova, he
    came across a box containing several Materia, which were confirmed in the Reunion
    Files and Advent Children Staff Commentary to be Cloud''s. After defeating Tifa,
    Loz kidnapped Marlene and took the Materia with him, which Kadaj and Yazoo proceeded
    to use as well. Due to Remnants being made of Negative Lifestream and Materia
    being condensed Spirit Energy from the Lifestream, containing the wisdom of the
    Cetra to use the powers of the Planet, they can absorb them directly into their
    bodies to use them. Out of the many Materia they took, the ones they were seen
    using are the following: **Fire: Briefly seen in the scene in the lake of the
    Forgotten Capital, Kadaj uses it to fire a blast to stop Marlene from escaping.
    **Lightning: Seen in his last duel with Cloud, Kadaj opens up with a Thunder spell
    to attack. **Bahamut SIN: Likely the Materia seen in his conversation with Rufus,
    also one of the Materia stolen from Cloud. Kadaj is seen playing with this Materia
    for a bit before absorbing it and use it to Summon Bahamut SIN to attack Edge.
    Given that Summon Materia is red and the Materia Kadaj was seen with was Blue,
    the color of the Support Materia, there''s a small possibility that it wasn''t
    Bahamut SIN''s but a different Materia to enhance the Summoning. Still, it''s
    most likely just an oversight.'
