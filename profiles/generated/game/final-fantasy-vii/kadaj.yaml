- id: claim-weaknesses-670f313b
  section: weaknesses
  axis: weakness
  text: 'Kadaj is quite wild and unstable. While he can be cunning and pragmatic,
    he is, in many ways, a young boy and can lose control when under emotional stress,
    leading to violent outbursts. Due to being made of Negative Lifestream, Kadaj
    is very vulnerable to Purification, as seen with his brief exposure to Aerith''s
    Great Gospel, causing him great pain. Notable Attacks/Techniques: As an extension
    of Sephiroth, Kadaj has also inherited abilities from Jenova, as acknowledged
    by Tseng. The Remnant uses these abilities to manipulate and instill fear on his
    targets and occasionally in combat. During the events of Advent Children, his
    brother Loz managed to steal Cloud''s Materia, allowing Kadaj to access to several
    magic abilities and the power to call forth Summons: *Personal: **Black Mist:
    Kadaj can turn into a black mist-like substance to go undetected. He did so to
    infiltrate Healen Lodge, where Rufus and the Turks were staying. **Masquerade:
    Kadaj can appear to others as someone who can be found on their memories, tricking
    their senses and mind, so he is seen, heard, and perceived as that person. If
    Kadaj does not know a person''s memories, then he will be seen in his actual appearance.
    **Consciousness Scan: By touching a person, in any way, Kadaj can quickly read
    the entirety of their minds and memories. **Pain Bind: Kadaj can heal wounds and
    take away the pain of a person. However, at any time he wishes, he can reopen
    the wound and injuries he had previously healed and return the pain in full force
    to said person. **Telekinesis: Like Sephiroth, Kadaj is capable of moving objects
    with his mind, though he only displayed this ability in one instance. **Teleportation:
    Kadaj can quickly teleport distances of dozens of meters. Even the Turks, who
    could keep up with the other Remnants in a straight-up fight, were unable to follow
    him when he used this ability. **Awakening: Similarly to Sephiroth, Kadaj can
    enforce his will through Jenova Cells and control those hosting them. In Advent
    Children, he extended it through the waters of the lake in the Forgotten Capital
    to the children of Edge, who were suffering from Geostigma. This awakened their
    Reunion instinct, leaving them as emotionless puppets, and would have made the
    kids go after Jenova''s Remains. **Geostigma: A fatal disease caused by Jenova
    Cells in the body. The parasitic presence of Jenova causes an internal conflict
    between the cells and the patient''s natural Spirit Energy, this leads to the
    body overworking itself trying to purge the cells, which causes symptoms such
    as physical weakness, extreme fatigue, seizures, hallucinations, depression, dark
    sores on the skin which emit a black pus and, eventually, death. However, the
    severity of the symptoms may vary from patient to patient. Some may die within
    a couple of hours, while others may have occasional bouts of pain. Those who die
    of Geostigma won’t join the Lifestream but instead will become part of the Negative
    Lifestream Sephiroth created. Given Geostigma injects Jenova Cells in those suffering
    from it, they may have their Reunion instinct awakened and are vulnerable to Sephiroth
    enforcing his will through them. Geostigma can be contracted by contact with Jenova
    Cells scattered in the Lifestream, direct contact with Negative Lifestream, or
    being wounded by a Shadow Creeper, as they are made of Negative Lifestream. **Shadow
    Creepers: Big quadrupedal monsters of vicious nature, materialized from the Negative
    Lifestream, reason why they can be summoned without Materia. While they aren''t
    particularly strong, they are quite fast and persistent, and even if they are
    injured or mutilated, they will keep chasing their target. However, what''s truly
    dangerous about them is that due to being made of Negative Lifestream, those who
    are injured by a Shadow Creeper will be infected with Geostigma, something made
    worse by the fact they can be summoned in large numbers at once. *Materia: **Fire
    Spell: Used when Marlene tried to escape from him in the Forgotten Capital. Kadaj
    shot a blast of fire to a nearby tree to scare her and stop her. **Thunder Spell:
    Used against Cloud at the beginning of their final duel. Unlike the spells in
    the original game, this doesn''t cause a lightning bolt to fall from the sky but
    fires several lightning blasts from the hands of the user at the target. **Bahamut
    SIN - Petaflare: Summononed to attack the monument in Edge and cause chaos in
    the city. This Summon is notable because unlike most others, it doesn''t draw
    the targets to a different space to attack and retreat; instead, it stays to fight
    in the real world. Bahamut SIN''s most powerful move is the Petaflare, a more
    powerful version of the Flare spell, which causes a nuclear reaction on the target
    upon impact. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    {{Scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters Category:Final
    Fantasy Category:Final Fantasy VII Category:Game Characters Category:Video'
