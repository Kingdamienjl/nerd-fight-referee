- id: claim-standard-equipment-8c75e443
  section: equipment
  axis: equipment
  text: 'FFVII Shotgun.png|Rufus using his Shotgun against Cloud Final Fantasy 7 AC Rufus shooting.jpg|Rufus''
    Custom Model Shotgun in Advent Children *Shotgun: A double-barreled, sawed-off shotgun with fires
    a spread shot towards the target. Rufus carries this weapon in his duel against Cloud. *Custom Shotgun:
    Seen in Advent Children when Rufus decides to escape from Kadaj. This custom model has a large barrel,
    but is capable of firing smaller bullets in quicker succession. *Handgun: As seen in Chapter 15, "Bad
    Timing", of the novel Final Fantasy VII The Kids Are Alright: A Turks Side Story, Rufus carries a
    gun hidden in his pockets as an extra safety measure. When Evan had to escape from Healen Lodge, taking
    the chance when his friends came to rescue him from the Turks, he tried to held Rufus hostage with
    a knife, Rufus, amused and surprised at the move decided to let Evan go and indicated Kyrie, Evan''s
    friend, where he had his gun hidden so they could use it in the way back to Midgar in the case monsters
    appeared.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
