- id: claim-weaknesses-f646b574
  section: weaknesses
  axis: weakness
  text: 'Rufus may run out of ammo during battle needing to reload. Taking advantage of this is not easy
    as it seems as Rufus will parry and evade attacks while he readies his firearm once again. | Dark
    Nation has a limited pool of magic which can run out. Notable Attacks/Techniques: *Rufus: **Shotgun:
    Rufus takes aim and fires his shotgun at the target. Depending on the model he can fire a spread shot
    like a regular shotgun or quicker fire like a handgun with smaller bullets. His shotgun''s gunfire
    is powerful enough to hurt Cloud. **Manipulation and Charisma: Perhaps Rufus''s greatest skill is
    his way with words. Rufus not only is sharp, but also soft spoken and charismatic, allowing him to
    easily entice other people and control conversations and the outcome of events. He also he can acutely
    read people''s demeanor and their implications to pinpoint what he can take advantage of to manipulate,
    deceive or simply use them, be it fears, ambitions, insecurities, desires and such. This not only
    has helped Rufus to establish deals with sworn enemies like the first AVALANCHE, but gained him the
    admiration of the Shinra directors, known for their petty infighting, as well as the Turks'' devotion.
    *Dark Nation: **Bolt (Thunder): A weaker level thunder magic that conjures a bolt of lightning to
    fall on the opponent. **Barrier: The user casts a barrier around the target that halves physical damage.
    Dark Nation will always prioritize using it on Rufus. **MBarrier: Similar to Barrier but halving Magical
    Damage instead. Like Barrier, Dark Nation will use it on Rufus instead of itself at first. ==Explanations==
    *Though Remake is not a separate continuity, rather the very same setting of the original game branching
    off to an "unknown journey" due to the characters breaking free from fate, due to the many differences
    between the game and the original due to the updated setting and gameplay, characters are still considered
    separate incarnations for the most part (such as abilities, available equipment and such), with the
    exception of their basic capabilities and skill as they are consistent between both games and don''t
    play into the differences between Remake and the original. *The reason Rufus scales to "Multi-Continent
    level" instead of "At least Multi-Continent level, likely higher", Cloud''s tier, is because Cloud''s
    tiering considers the end of Disc 1 a point by which he had feats of scaling far above the level he
    had when he fought Rufus, which happened at the end of Midgar at the early parts of Disc 1. ==Gallery==
    Rufus_enemyFFVII.png|Rufus'' in-game battle model Rufus_advent_children.png|Rufus in Advent Children,
    infected with Geostigma Rufus-reno-and-rude.jpg|Rufus alongside his Turks, Rude and Reno BeforeCrisisRufus.jpg|Rufus
    in Before Crisis PFF_Dark_Nation.png|Dark Nation in Final Fantasy: Record Keeper ==Notable Matchups==
    Victories: Losses: Inconclusive: {{scroll box|content={{reflist|2}}}} {{Discussions|Rude Final Fantasy
    VII|Rude (Final Fantasy VII)}} Category:Gun Users Category:Final Fantasy VII Category:Final Fantasy
