  intelligence:
    text: Gifted. Rufus is an very intelligent, cunning and manipulative man, capable of not only handling
      the Shinra company despite his rather young age, scheme brilliantly against it before that, but
      easily pull the strings to switch conversations in his favor and goad people to manipulate them
      however he sees fit for his own ends. He also can keep his head cool no matter how bad the situation
      gets and take pragmatic choices for the best outcome. Combat wise, Rufus is an extremely skilled
      and technichal fighter combining precise gunplay and close combat to both keep his opponents at
      distance but also easily dance around their close range attacks, managing to be a very hard opponent
      to catch even for opponents stronger and faster than him such as Cloud. Rufus can flawlessly cooperate
      with Dark Nation for combinations and taking advantage of his partners support magic. | Above Average.
      Despite seeming like a feral animal, Dark Nation can work surprisingly well with Rufus in combinations
      and takes a very tactical approach to defend its master, being very obedient to commands and knowing
      when to retreat should Rufus deem it necessary.
