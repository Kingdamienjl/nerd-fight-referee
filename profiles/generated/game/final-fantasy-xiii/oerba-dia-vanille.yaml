        psychological trauma are able to accelerate the progression of a L''Cie''s
        brand to trigger their transformation into a Cie''th. Some people have been
        stated to have instantaneously turn into a Cie''th just by sheer shock of
        being branded a L''Cie in the most severe cases. ==Users== Lightning (FFXIII),
        Snow, Fang (FFXIII), Hope (FFXIII), Sazh (FFXII), Vanille (FFXIII), and Class
        Zero (L''Cie Tabbers) ==Cie''th== center|550px|Final Fantasy XIII (2009).
        Photo of various types of Cie''th|thumb {{Border|Scroll=No|Visible=Yes|Content=List
        of abilities Cie''th possess. ==Normal Cie''th== All previous L''Cie abilities
        minus Immortality (Types 1 & 8) plus: *Immortality (Types 5 & 7; Cie''th are
        inherently described as both "unliving and undying".) ==The Undying== All
        previous L''Cie abilities minus Immortality (Type 8) plus: *Immortality (Types
        5 & 7; Cie''th are inherently described as both "unliving and undying".) ==Resistances==
        Same as L''Cie''s }} ==Weaknesses== When a Normal Cie''th''s energy runs dry,
        their body will slowly fossilize into a crystalized tombstone called a "Cie''th
        Stone". In this state, the Cie''th in question are completely immobile. This
        does not apply to The Undying ==Ragnarok== center|450px|Final Fantasy XIII
        (2009). The fusion of L''Cie''s Vanille and Fang to become the completed version
        of Ragnarok|thumb {{Border|Scroll=No|Visible=Yes|Content=These are abilities
        those with the potential to become Ragnarök possess. They also do not possess
        the previous weaknesses of either L''Cie or Cie''th. All previous abilities
        and resistances are even further enhanced in addition to the following: ==Incomplete
