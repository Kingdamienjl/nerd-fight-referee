- id: claim-weaknesses-a3332b1a
  section: weaknesses
  axis: weakness
  text: 'Weakness'' provided by the "Heart" and "Soul", Has a limited supply of Magic. Though this can
    be restored through various means. Notable Attacks/Techniques: ===Physical Attacks=== *Blitz: Hope
    whips his weapon around in a circle, attacking entire groups of enemies that choose to surround his.
    *Counter: Hope''s counterattack to certain targets. It can range from Level 1 to Level 3. *Launch:
    Hope sends the opponent skyward, leaving them helpless against follow-up attacks unless they have
    a flight ability. *Smite: The instant an airborne opponent is about to recover from being staggered,
    Hope attacks with a single physical blow for immense damage. *Deathblow: Has a chance to instantly
    slay targets hit who are below a certain HP threshold. *Block: A well-timed block can deflect much
    of the damage dealt by an attack and leave his in an advantageous position. *Mediguard: Guards against
    all attacks while continuously healing his own HP. *Steelguard: Guards against all attacks extremely
    effectively. The more attacks are absorbed, the more potent it becomes. *Magic Slash: A special attack
    inflicting both physical and magic damage simultaneously. *Relentless Assault: Attacks with a series
    of Magic Slash attacks. *Flamestrike: Attacks with a fire-imbued strike. *Aquastrike: Attacks with
    a water-imbued strike. *Froststrike: Attacks with an ice-imbued strike. *Sparkstrike: Attacks with
    a thunder-imbued strike. *Galestrike: Attacks with a wind-imbued strike. *Flame: Releases a large
    blast of fire magic that inflicts physical damage. *Flood: Releases a large blast of water/ice magic
    that inflicts physical damage. *Lightning: Releases a large blast of thunder magic that inflicts physical
    damage. *Wind Slash: Releases a large blast of wind magic that inflicts physical damage. *Shadowbind:
    A strike that greatly extends the length of time for which an enemy is staggered and additionally
    immobilizes them. *Darkne'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-195f2d21
  section: abilities
  axis: hax
  text: "{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Final Fantasy XIII \u25BE= {{#tag:tabber|\
    \ {{!}}-{{!}}L'Cie={{Border|Scroll=Yes|Visible=No|Content= General Abilities *Unseen Chaos Physiology\
    \ *Superhuman Physical Characteristics & L'Cie Physiology * Blessed and Empowerment (Protection; L'Cie's\
    \ are implanted with Crystal Shards on their bodies. Due to the Mythology of the Crystals being the\
    \ same as the classic games, this would grant his the abilities of The Crystals as a result. Even\
    \ after losing L'Cie status, he still retains this power as crystal energy mixed into the soil, now\
    \ granting people inner crystal power. Is also blessed by the Goddess Etro, who protected his by keeping\
    \ them from succumbing to the two fates that await L'Cie's) *Weapon Mastery (Of Boomerangs) and Martial\
    \ Arts (Able to keep pace with various trained military personnel and defeated numerous trained Psicom\
    \ officers utilizing a boomerang) *Passive Damage Reduction (via Fringeward) *Damage Reduction and\
    \ Healing (via Mediguard; as well as various guard and healing abilities) *Summoning (Can summon his\
    \ Eidolon \"Alexander\" from his L'Cie brand) *Supernatural Willpower (Able to revert back to his\
    \ human form from the Cieth transformation through pure strength of will. Scorching out his L'Cie\
    \ brand in the process) Full ATB Skill *Magical Resistance Negation (via Last Resort; which ignores\
    \ an enemies magic resistance) Magic *Magic, Conceptual Manipulation (Type 2), Space-Time Manipulation,\
    \ Law Manipulation, and Subjective Reality: Magic in it's basest form is projecting one's inner mind\
    \ onto reality, powered by intelligence and mental strength. It is also shown in the novels to remove\
    \ concepts and warp space and time itself, like the Devil's road, which the concept of time and distance\
    \ was lost, and time and space were twisted to the point the past, present and future existed as one.\
    \ Along with rewriting the natural order of things. **Durability Reduction (Magic ignores durability\
    \ to physical attacks requiring specific resistances to reduce the damage of) **Non-Physical Interaction\
    \ (Magic as a whole is shown to affect a wide variety of different beings, from intangible/immaterial\
    \ beings to non corporeal beings, to abstract concepts like Chronodia, who's the flow of time itself,\
    \ to Nonexistent beings like Exdeath and Cloud of Darkness) **Power Modification (Including Duplication,\
    \ Fusionism, Statistics Amplification, Size Manipulation, Homing Attack, Danmaku, Aura, Breath Attack,\
    \ and Energy Manipulation; Magic users across the games have consistently shown the ability to manipulate\
    \ the shape and properties of their own magical abilities, with even highis tiers of spells simply\
    \ being considered stronger versions of the same basic ability) **Energy Manipulation and Projection\
    \ (Via various magic spells) ** Data Manipulation and Information Manipulation (Type 2; Magic is synced\
    \ with Relics, which are used for Data Input and communication, Relics being tied to the crystals,\
    \ which in turn are tied to Fal'Cie deities who are capable of creating entire realities composed\
    \ of data such as Orphan's Cradle) *Elemental Manipulation **Fire, Ice, and Matter Manipulation (Macro-Quantum;\
    \ via Fire and Ice magic, Both Fire and Ice related abilities are stated to affect the target's electrons,\
    \ and even negate durability in the process) **Electricity Manipulation and Pain Manipulation (via\
    \ lightning magic, Lightning spells are capable of attacking the target's nervesFinal Fantasy IV Novel\
    \ 2 Ch7 page 54) **Water Manipulation, Air Manipulation, and Earth Manipulation (via Water & Aero\
    \ spells, and Quake respectively) *Poison Manipulation, Disease Manipulation, and Corrosion Inducement\
    \ (Can inflict Poison, which is also stated to corrode the target. The Poison spell is called \"Bio\"\
    \ in the Japanese. The Bio spell can cause diseases) *Status Effect Inducement **Paralysis Inducement\
    \ (Via Daze, which stuns the target) **Empathic Manipulation (via Provoke and Charge) **Pain Manipulation\
    \ (via Pain) **Power Nullification (via Fog and Fogga) **Curse Manipulation and Probability Manipulation\
    \ (via Curse; Which lowers the targets odds of interrupting actions) **Statistics Reduction (via Debrave,\
    \ Defaith and Slow; the former two reduces an enemies physical and magical prowess, while the latter\
    \ reduces speed) **Resistance Reduction (via Deprotect, Deshell and Imperil, which lowers an enemies\
    \ physical, magical and elemental resistances) *Resistance Amplification (Capable of raising physical,\
    \ magical and elemental resistances with the Viel Spell) *Statistics Amplification (via Bravera, Faithra,\
    \ Protect, and Haste spells, which the former two increase physical, magical attack prowess, protect\
    \ increases one's defense, while the latter increases speed) **Gravity Manipulation (Haste and Slow\
    \ spells are stated to be able to control gravity) *Information Analysis and Clairvoyance (via Libra;\
    \ the Libra spell is stated to be as such) *Healing and Purification (Type 3; For himself and others"
