- id: claim-weaknesses-31fc815f
  section: weaknesses
  axis: weakness
  text: "Snow is often rather headstrong, acting before thinking and getting himself and others into trouble,\
    \ and by the time of Lightning Returns, he harbors extreme guilt over his failure to save Serah's\
    \ life (Albeit after the events of the trilogy, neither of these are issues). Weaknesses provided\
    \ by the \"Heart and Soul\", along with L'Cie weaknesses Notable Attacks/Techniques: ===Physical Attacks===\
    \ *Blitz: Snow swings his fist around in a circle, attacking entire groups of enemies that choose\
    \ to surround him. *Counter: Snow's counterattack to certain targets. It can range from Level 1 to\
    \ Level 3. *Launch: Snow sends the opponent skyward, leaving them helpless against follow-up attacks\
    \ unless they have a flight ability. *Smite: The instant an airborne opponent is about to recover\
    \ from being staggered, Snow attacks with a single physical blow for immense damage. *Block: A well-timed\
    \ block can deflect much of the damage dealt by an attack and leave him in an advantageous position.\
    \ *Mediguard: Guards against all attacks while continuously healing himself. *Steelguard: Guards against\
    \ all attacks extremely effectively. The more attacks are absorbed, the more potent it becomes. *Aquastrike:\
    \ Attacks with a water-imbued strike. *Froststrike: Attacks with an ice-imbued strike. * Sovereign\
    \ Fist: Snow leaps into the air and slams his fist into the ground, dealing heavy physical damage\
    \ across a small radius. This attack will ignore any resistances to physical damage, but will also\
    \ ignore any vulnerabilities. ===Magic=== *Blizzard/Blizzara/Blizzaga: An ice elemental spell at various\
    \ levels depending on the intensity it is cast, with Blizzard being the weakest and Blizzaga the strongest.\
    \ *Aero/Aerora: A wind elemental spell at various levels depending on the intensity it is cast, with\
    \ Aerora being stronger than Aero. *Ruin/Ruina/Ruinga: A spell that deals non-elemental damage at\
    \ various levels depending on the intensity it is cast, with Ruin being the weakest and Ruinga the\
    \ strongest. *Haste/Hastega: A spell that bestows Haste upon a target, speeding up their movements.\
    \ *Curse/Cursega: A spell that deals light damage and afflicts a target with Curse, making them easier\
    \ to interrupt and knock around, and making it harder for them to do the same in return. *Fog/Fogga:\
    \ A spell that cancels enemy magic spells and deals magic damage to the target. Fogga distributes\
    \ a more powerful version of the spell over a wide area. *Slow/Slowga: Snow slows down the flow of\
    \ time for his enemies, forcing them to take longer than normal to use their attacks. *Stopga: Snow\
    \ stops time and cancels all actions taken by the opponent at the time of casting at the cost of doing\
    \ the same for Snow himself. *Cure/Cura/Curasa: A spell that restores a target's vitality, with Cura\
    \ being a more potent but more costly version of Cure. Curasa heals Snow or an ally an amount proportional\
    \ to the damage they've taken, being more potent as the target nears death. *Esuna: A spell that removes\
    \ a status ailment from a target. *Quake: Rends apart the earth, launching all enemies in a giant\
    \ radius into the air and stunning them momentarily. ===Eidolon=== *Shiva Sisters: Snow's Eidolons\
    \ are the Shiva Sisters, Nix and Stiria, who specialize in physical and magical combat respectively.\
    \ Snow has an amicable relationship with both of them and they thus synergize perfectly with him in\
    \ combat. They are capable of freezing enemies at Absolute Zero temperatures. *Penetration: Nix and\
    \ Stiria\u2019s attacks ignore any resistance to their Ice and Water attacks. *Curaga: Stiria heals\
    \ the wounds of one ally, rapidly bringing them back to peak performance. *Blizzaga: Stiria blasts\
    \ a target with a massive shard of ice to deal heavy Ice-elemental damage. *Arise: Stiria revives\
    \ Snow should he somehow fall in combat. However, the strain of doing so forces the Shiva Sisters\
    \ to leave the battlefield. *ATB Charge: Nix\u2019s presence supercharges her allies, allowing them\
    \ to perform their actions far more quickly than normal and reducing start up times for their abilities.\
    \ *Gestalt Mode: After spending enough time in combat with Snow, the Shiva Sisters can enter Gesalt\
    \ Mode, becoming a motorcycle for Snow to ride on. In doing so, Snow is able to release the full extent\
    \ of their frigid powers, freezing targets with their icy exhaust ramming targets with the motorcycle\
    \ itself. Their finisher is Diamond Dust, in which Snow rapidly spins the motorcycle in a circle to\
    \ flash freeze all foes nearby, after which the Shiva Sisters will leave the battlefield. ==Gallery==\
    \ Ff13-summon-snowshiva.png|Snow Villiers riding atop Shiva as she appears in her Vehicle form in\
    \ Final Fantasy XIII ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{scroll\
    \ box|content={{reflist|2}}}} {{Discussions}} Category:Characters Category:Male Characters Category:Game\
    \ Characters Category:Final Fantasy Category:Final Fantasy XIII Category:Protagonists Category:Heroes\
    \ Category:Good Characters Category:Brawlers Category:Ma"
