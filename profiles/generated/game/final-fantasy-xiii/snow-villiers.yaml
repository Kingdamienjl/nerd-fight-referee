  intelligence:
    text: 'Lightning has shown to be very quick in adapting to situations and showcased tremendous growth
      throughout the events of the FFXIII trilogy. |-|Academic= Average: Described by Lightning as easy-going
      and overly chummy, Snow is often overly idealistic and hot-headed, charging straight into battle
      without a thought and seeing himself as the hero of the story. As a result, he rarely thinks before
      he acts, which led him into trouble on more than one occasion. |-|Combatant= Extraordinary Genius:
      As a fighter, he is an excellent hand-to-hand combatant even before he became a l''Cie, beating
      back monsters and PSICOM forces with nothing but his fists and taking the brunt of the attack for
      his allies. He is also surprisingly skilled at magic, specializing in the use of Blizzard and Water
      and mastering them to their highest degrees. He becomes much more somber and more mature by the
      events of Lightning Returns, fighting Lightning on equal terms even after she had become The Savior
      and was capable of mastering the use of Axes and powers of a Cie''th within seconds.'
