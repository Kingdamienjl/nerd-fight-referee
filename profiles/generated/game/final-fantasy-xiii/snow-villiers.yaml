- id: claim-powers-and-abilities-199681d2
  section: abilities
  axis: hax
  text: "{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Prior to becoming a L'Cie \u25BE= {{#tag:tabber|\
    \ {{!}}-{{!}}Human={{Border|Scroll=Yes|Visible=No|Content= General Abilities *Unseen Chaos Physiology\
    \ *Peak Human Condition, Martial Arts Mastery, Marksmanship, Vehicular Mastery, and Acrobatics (Hypermobility\
    \ and All-Terrain Mobility; Snow was raised in the sanctum military facility, and from a young age,\
    \ he dedicated himself alongside his friends to protecting others. As he grew older. He's shown to\
    \ become a proficient combatant, capable of taking down leagues of trained Sanctum Soldiers by himself.\
    \ He's also shown to be proficent in using rifles as the leader of a rebellion group called NORA.\
    \ He has shown to be proficient in piloting a hoverbike and easily learned to control Shiva's Vehicle\
    \ form in seconds, in which she transforms into a motorcycle. Should be comparable to other characters\
    \ such as Lightning and Fang) AMP Technology *Antimatter Manipulation, Gravity Manipulation, Shockwave\
    \ Inducement, Electricity Manipulation, Summoning, minor Spatial Manipulation + Reality Warping, and\
    \ Pseudo-Flight (via AMP Technology; Snow's coat utilizes AMP Technology. Which stands for Antimatter\
    \ Manipulation Principal, the uses can range from Phase-Space interference, to the manipulation of\
    \ gravitational forces, which can allow for a Pseudo version of flight, this technology has also shown\
    \ to coat someone's body in electricity and summon creatures to someone's side) }} {{!}}-{{!}}Resistances={{Border|Scroll=Yes|Visible=No|Content=\
    \ *Unseen Chaos Resistances *Antimatter Manipulation and Electricity Manipulation (Can utilize AMP\
    \ Technology on his own body without feeling any ill effects) }}}} |-|Final Fantasy XIII \u25BE= {{#tag:tabber|\
    \ {{!}}-{{!}}L'Cie={{Border|Scroll=Yes|Visible=No|Content= All previous abilities, plus General Abilities\
    \ *Superhuman Physical Characteristics *L'Cie Physiology *Blessed and Empowerment (Protection; L'Cie's\
    \ are implanted with Crystal Shards on their bodies. Due to the Mythology of the Crystals being the\
    \ same as the classic games, this would grant him the abilities of The Crystals as a result. Even\
    \ after losing L'Cie status, he still retains this power as crystal energy mixed into the soil, now\
    \ granting people inner crystal power. Is also blessed by the Goddess Etro, who protected him by keeping\
    \ them from succumbing to the two fates that await L'Cie's) *Limited Immortality (Type 2, via Reprieve;\
    \ A passive ability that allows one to survive a fatal blow with 1 HP remaining) *Limited Death Manipulation\
    \ (via Deathblow; which has a chance to instantly slay a target with low HP) *Passive Damage Reduction\
    \ (via Fringeward) *Damage Reduction and Healing (via Mediguard; as well as various guard and healing\
    \ abilities) *Summoning (Can summon his Eidolon \"Shiva\" from his L'Cie brand) *Supernatural Willpower\
    \ (Able to revert back to his human form from the Cie'th transformation through pure strength of will.\
    \ Scorching out his L'Cie brand in the process) Full ATB Skill *Durability Negation, Resistance Negation,\
    \ and Explosion Manipulation (via Sovereign Fist; His full ATB Skill has Snow leaping into the air\
    \ and slamming his fist into the ground, dealing heavy physical damage across a small radius. This\
    \ attack will ignore any resistances to physical damage) Magic *Magic, Conceptual Manipulation (Type\
    \ 2), Space-Time Manipulation, Law Manipulation, and Subjective Reality: Magic in it's basest form\
    \ is projecting one's inner mind onto reality, powered by intelligence and mental strength. It is\
    \ also shown in the novels to remove concepts and warp space and time itself, like the Devil's road,\
    \ which the concept of time and distance was lost, and time and space were twisted to the point the\
    \ past, present and future existed as one. Along with rewriting the natural order of things. **Durability\
    \ Reduction (Magic ignores durability to physical attacks requiring specific resistances to reduce\
    \ the damage of) **Non-Physical Interaction (Magic as a whole is shown to affect a wide variety of\
    \ different beings, from intangible/immaterial beings to non corporeal beings, to abstract concepts\
    \ like Chronodia, who's the flow of time itself, to Nonexistent beings like Exdeath and Cloud of Darkness)\
    \ **Power Modification (Including Duplication, Fusionism, Statistics Amplification, Size Manipulation,\
    \ Homing Attack, Danmaku, Aura, Breath Attack, and Energy Manipulation; Magic users across the games\
    \ have consistently shown the ability to manipulate the shape and properties of their own magical\
    \ abilities, with even higher tiers of spells simply being considered stronger versions of the same\
    \ basic ability) **Energy Manipulation and Projection (Via various magic spells) **Data Manipulation\
    \ and Information Manipulation (Type 2; Magic is synced with Relics, which are used for Data Input\
    \ and communication, Relics being tied to the crystals, which in turn are tied to Fal'Cie deities\
    \ who are capable of creating entire realities composed of data such as"
