- id: claim-weaknesses-4b455d9b
  section: weaknesses
  axis: weakness
  text: 'Weakness'' provided by the "Heart" and "Soul", Has a limited supply of Magic.
    Though this can be restored through various means. Notable Attacks/Techniques:
    {{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Physical Attacks= {{Border|Scroll=Yes|Visible=No|Content=
    * Blitz: Fang whips her weapon around in a circle, attacking entire groups of
    enemies that choose to surround her. * Counter: Fang''s counterattack to certain
    targets. It can range from Level 1 to Level 3. * Launch: Fang sends the opponent
    skyward, leaving them helpless against follow-up attacks unless they have a flight
    ability. * Smite: The instant an airborne opponent is about to recover from being
    staggered, Fang attacks with a single physical blow for immense damage. * Deathblow:
    Has a chance to instantly slay targets hit who are below a certain HP threshold.
    * Block: A well-timed block can deflect much of the damage dealt by an attack
    and leave her in an advantageous position. * Mediguard: Guards against all attacks
    while continuously healing her own HP. * Steelguard: Guards against all attacks
    extremely effectively. The more attacks are absorbed, the more potent it becomes.
    * Magic Slash: A special attack inflicting both physical and magic damage simultaneously.
    * Relentless Assault: Attacks with a series of Magic Slash attacks. * Flamestrike:
    Attacks with a fire-imbued strike. * Aquastrike: Attacks with a water-imbued strike.
    * Froststrike: Attacks with an ice-imbued strike. * Sparkstrike: Attacks with
    a thunder-imbued strike. * Galestrike: Attacks with a wind-imbued strike. * Flame:
    Releases a large blast of fire magic that inflicts physical damage. * Flood: Releases
    a large blast of water/ice magic that inflicts physical damage. * Lightning: Releases
    a large blast of thunder magic that inflicts physical damage. * Wind Slash: Releases
    a large blast of wind magic that inflicts physical damage. * Shadowbind: A strike
    that greatly extends the length of time for which an enemy is staggered and additionally
    immobilizes them. * Darkne'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
