- id: claim-powers-and-abilities-91a33619
  section: abilities
  axis: hax
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Final Fantasy XIII
    ▾= {{#tag:tabber| {{!}}-{{!}}L''Cie= {{Border|Scroll=Yes|Visible=No|Content= General
    Abilities *Unseen Chaos Physiology *L''Cie Physiology *Superhuman Physical Characteristics
    *Martial Arts Mastery, Weapons Mastery (Of Spears and Guns), Marksmanship and
    Pressure Points (Fang has shown to be a natural born warrior. Capable of defeating
    trained military personal with ease. She has also shown to be proficient with
    the use of guns, being able to snipe people with gunshots while riding aboard
    a motorcycle. Is also able to knock Snow unconscious with a mere chop to his neck)
    *Blessed and Empowerment (Protection; L''Cie''s are implanted with Crystal Shards
    on their bodies. Due to the Mythology of the Crystals being the same as the classic
    games, this would grant her the abilities of The Crystals as a result. Even after
    losing L''Cie status, she still retains this power as crystal energy mixed into
    the soil, now granting people inner crystal power. Is also blessed by the Goddess
    Etro, who protected her by keeping them from succumbing to the two fates that
    await L''Cie''s) *Limited Immortality (Type 2, via Reprieve; A passive ability
    that allows one to survive a fatal blow with 1 HP remaining) *Limited Death Manipulation
    (via Deathblow; which has a chance to instantly slay a target with low HP) *Passive
    Damage Reduction (via Fringeward) *Damage Reduction and Healing (via Mediguard;
    as well as various guard and healing abilities) *Summoning (Can summon her Eidolon
    "Bahamut" from her L''Cie brand) *Supernatural Willpower (Able to revert back
    to her human form from the Cieth transformation through pure strength of will.
    Scorching out her L''Cie brand in the process) Full ATB Skill *Durability Negation,
    Resistance Negation Explosion Manipulation (via Highwind. Fang leaps into the
    air and brings her spear down into the enemy—similar to the Dragoon ability Jump—with
    an explosion damaging nearby enemies as she hits the ground. Highwind is a physical
    attack that uses the Strength stat to calculate damage. Highwind ignores physical
    resistance) Magic *Magic, Conceptual Manipulation (Type 2), Space-Time Manipulation,
    Law Manipulation, and Subjective Reality: Magic in it''s basest form is projecting
    one''s inner mind onto reality, powered by intelligence and mental strength. It
    is also shown in the novels to remove concepts and warp space and time itself,
    like the Devil''s road, which the concept of time and distance was lost, and time
    and space were twisted to the point the past, present and future existed as one.
    Along with rewriting the natural order of things. **Durability Reduction (Magic
    ignores durability to physical attacks requiring specific resistances to reduce
    the damage of) **Non-Physical Interaction (Magic as a whole is shown to affect
    a wide variety of different beings, from intangible/immaterial beings to non corporeal
    beings, to abstract concepts like Chronodia, who''s the flow of time itself, to
    Nonexistent beings like Exdeath and Cloud of Darkness) **Power Modification (Including
    Duplication, Fusionism, Statistics Amplification, Size Manipulation, Homing Attack,
    Danmaku, Aura, Breath Attack, and Energy Manipulation; Magic users across the
    games have consistently shown the ability to manipulate the shape and properties
    of their own magical abilities, with even higher tiers of spells simply being
    considered stronger versions of the same basic ability) **Energy Manipulation
    and Projection (Via various magic spells) *Elemental Manipulation **Fire, Ice,
    and Matter Manipulation (Macro-Quantum; via Fire and Ice magic, Both Fire and
    Ice related abilities are stated to affect the target''s electrons, and even negate
    durability in the process) **Electricity Manipulation and Pain Manipulation (via
    lightning magic, Lightning spells are capable of attacking the target''s nervesFinal
    Fantasy IV Novel 2 Ch7 page 54) **Water Manipulation, Air Manipulation, and Earth
    Manipulation(via Water & Aero spells, and Quake respectively) *Poison Manipulation,
    Disease Manipulation, and Corrosion Inducement (Can inflict Poison, which is also
    stated to corrode the target. The Poison spell is called "Bio" in the Japanese.
    The Bio spell can cause diseases) *Status Effect Inducement **Paralysis Inducement
    (Via Daze, which stuns the target) **Empathic Manipulation (via Provoke and Charge)
    **Pain Manipulation (via Pain) **Power Nullification (via Fog and Fogga) **Curse
    Manipulation and Probability Manipulation (via Curse; Which lowers the targets
    odds of interrupting actions) **Statistics Reduction (via Debrave, Defaith and
    Slow; the former two reduces an enemies physical and magical prowess, while the
    latter reduces speed) **Resistance Reduction (via Deprotect, Deshell and Imperil,
    which lowers an enemies physical, magical and elemental resistances) *Resistance
    Amplification (Capable of raising physical, magical and elemental resistances
    with the Viel Spell) *Statistics Amplification'
  source_ids: *id003
  decisive: true
