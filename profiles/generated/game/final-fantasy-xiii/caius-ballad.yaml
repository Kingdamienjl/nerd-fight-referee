  attack_potency:
    text: Multiverse level+ (Defeated Knight of Etro Lightning, whose existence is
      enough to sustain the infinite world of Valhalla. A world that operates on a
      different plane of existence where all timelines are able to be seen from and
      are referred to as "Lower Worlds". Valhalla gives birth to, controls, contains,
      and connects multiple different timelines, of which are there are an infinite
      number of, which equate to infinite possibilities via The Historia Crux. This
      includes The Void, which is considered a mere "Shadow" in comparison to Valhalla.
      With Valhalla being stated numerous times to be beyond Space-Time, and the "paradoxes"
      caused by the Unseen Chaos, which by extension should apply to the Unseen Realm
      itself, is said to completely transcend time. Is also superior to Serah and
      Noel, who were both capable of defeating Gilgamesh and Omega in the Coliseum),
      higher with Incarnate Summoning (An incarnate summon sacrifices the life of
      the summoner in exchange to fuse with the Eidolon for a massive boost in power)
      | Multiverse level+ (Able to stalemate Lightning as "The Savior" prior to her
      reuniting with Lumina. Became the "God of Death" and ruler of the new "Unseen
      Realm", a title that is only fit for the mightiest of beings comparable to the
      likes of The Savior, and Bhunivelze themselves. Was also able to release Paddra
      Nsu Yuel from her Seeress Fate), higher with Incarnate Summoning | Multiverse
      level+ (Is comparable to the other Warriors of Spiritus and draws power from
      the gods of the cycle. Can damage Materia's Warriors such as Warrior of Light)
    source_ids: *id002
