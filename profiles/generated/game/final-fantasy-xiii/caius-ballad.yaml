  range:
    text: Standard Combat= *Extended Melee Range (With his greatsword; Far Higher
      as Bahamut) *Multiversal+ (With Magic; Magic as a whole is shown to affect omnipresent
      beings such as Exdeath when he's become one with the Void itself, which spans
      across the entire Final Fantasy Multiverse and is stated numerous times to contain
      an infinite number of worlds, can banish foes into the Void) |-|Unseen Chaos=
      At Least Multiversal+, likely Far Higher (Unseen Chaos originates from a Higher
      Dimension known as the "Unseen Realm". Where the concepts of Space and Time
      are nonexistent due to outright transcending them, along with the stories, information,
      and memories that makes up the worlds below it, and is completely inaccessible
      to dimensions below it through normal means. Only by Etro opening her "Gate"
      can the Unseen Realm be accessed. The Unseen Realm exists above the world of
      Valhalla. Valhalla itself is a world that is stated numerous times to be beyond
      Space & Time, and is confirmed to be on a different plane of existence, where
      all timelines are able to be viewed from and are referred to as "lower worlds",
      which includes "The Void" which is described as a mere "Shadow" in comparison
      to Valhalla. The void being a structure that is stated multiple times to contain
      and infinite number of universes and harbor "Extradimensional Spaces" in relation
      to those worlds)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Extraordinary Genius; As Yeul's Guardian, Caius is an incredibly skilled
      warrior and swordsman as well as Lightning's equal in combat. Due to being immortal
      and having knowledge of every timeline and possible scenario through his connection
      to Yeul, Caius is always one step of his opponent and fully exploits this in
      every one of his fights with Lightning, Noel, and Serah. He is serious and callous,
      with thousands of years of combat experience and a ruthless nature to match,
      single-mindedly searching for his chance to be free of his "curse" of immortality
      and to liberate Yeul of the suffering caused by her constant reincarnation.
      Is also knowledgeable on all things related to Chaos. Whose effects can range
      from triggering Space-Time transcending Phenomena which causes the past and
      future to overlap with eachother and bring impossibilities into existence, which
      are directly compared to the Schrodinger's Cat Experiment
    source_ids: *id002
