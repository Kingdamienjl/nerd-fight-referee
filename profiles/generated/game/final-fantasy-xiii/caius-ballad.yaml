- id: claim-weaknesses-6e64f02f
  section: weaknesses
  axis: weakness
  text: 'Weaknesses Provided by the "Heart and Soul", Has a limited supply of magic
    with which to use his most potent abilities Notable Attacks/Techniques: *Body
    and Soul: Bestows Bravery, Faith, Haste and Regen on Caius, boosting his attacking
    and magic power as well as making him faster and slowly heal his injuries. *Eye
    of Bahamut: Caius unleashes several dark beams from Ragnarok''s hilt to inflict
    various debuffs on the target. *Heart of Chaos: Bestows Reraise to Caius, which
    automatically revives him when he''s killed. *Megaflare: When in the form of Chaos
    Bahamut, Caius generates a large ball of blue fire and throws it, causing it to
    explode and trigger a fusion reaction at the target location. *Gigaflare/Teraflare/Exaflare:
    Used only when he becomes Jet Bahamut, Caius begins a countdown from three and
    takes off when it reaches zero. He charges up a large fireball and fires it after
    a few seconds. If Caius is alone when this is performed, it is known as Gigaflare,
    if either Ganet or Amber Bahamut are present, it becomes the more powerful Teraflare,
    and if all three perform the attack, it''s the extremely powerful Exaflare. All
    of these attacks generate massive amounts of energy through a fusion reaction
    on impact. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
