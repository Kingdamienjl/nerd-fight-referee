- id: claim-powers-and-abilities-1bdbba4a
  section: abilities
  axis: hax
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Final Fantasy XIII-2
    ▾= {{#tag:tabber| {{!}}-{{!}}Yuel''s Guardian={{Border|Scroll=Yes|Visible=No|Content=
    General Abilities *Unseen Chaos Physiology *Superhuman Physical Characteristics
    *Martial Arts Mastery and Weapons Mastery (Of Greatswords) (Caius has consistently
    shown to be one of the best fighters of the trilogy. Being able to defeat Knight
    of Etro Lightning in battle, as well as stalemate The Savior prior to her receiving
    the Ultima Weapon and reuniting with Lumina. As a Guardian who has lived for thousands
    of years, he''s proficiently honed his combat prowess to become the Ultimate guardian
    to Yeul) *Blessed and Empowerment (Protection; Magic is drawing upon one''s inner
    "Crystal Power", due to crystal energy mixing into the soil, and them confirming
    to share the same mythology as the classic games. This grants him the abilities
    of The Crystals as a result. It is stated that the Goddess Etro blessed Caius
    by removing his L''Cie status and implanting her own "Heart" into his) **Immortality
    (Types 1 and 3-Mid-Godly; via the Heart of Chaos) *Summoning (His Eidolon Bahamut''s
    Eidolith is set into the hilt of his greatsword, which he can summon into battle
    at any point) **Fusionism, Transformation, Empowerment, and True Flight (An Incarnate
    Summon fuses the Eidolon with the summoner''s essence for an immense power boost)
    ***Radiation Manipulation (As Bahamut, he has access to the Flare and Megaflare
    attacks. Which are stated numerous times to be nuclear power) *Limited Death Manipulation
    (via Deathblow. Which can instantly kill a target at low health) *Information
    Manipulation (Type 1: Fragments are nuggets of pure information made of crystal,
    which contain the memories and stories of various things) *Telekinesis (Can call
    down meteors and raise massive rock formations) *Life Manipulation and Limited
    Regeneration Negation ("Wound" damage reduces a targets Maximum HP and prevents
    the opponent from Regenerating to full health) *Pocket Reality Manipulation and
    Summoning (Upon transforming into his Ultimate Form as "Jet" Bahamut. He creates
    a pocket dimension and summons two other Bahamuts to fight against Serah and Noel.
    This form can also grant him ) Magic *Magic, Conceptual Manipulation (Type 2),
    Space-Time Manipulation, Law Manipulation, and Subjective Reality: Magic in it''s
    basest form is projecting one''s inner mind onto reality, powered by intelligence
    and mental strength. It is also shown in the novels to remove concepts and warp
    space and time itself, like the Devil''s road, which the concept of time and distance
    was lost, and time and space were twisted to the point the past, present and future
    existed as one. Along with rewriting the natural order of things. **Durability
    Reduction (Magic ignores durability to physical attacks requiring specific resistances
    to reduce the damage of) **Non-Physical Interaction (Magic as a whole is shown
    to affect a wide variety of different beings, from intangible/immaterial beings
    to non corporeal beings, to abstract concepts like Chronodia, who''s the flow
    of time itself, to Nonexistent beings like Exdeath and Cloud of Darkness) **Power
    Modification (Including Duplication, Fusionism, Statistics Amplification, Size
    Manipulation, Homing Attack, Danmaku, Aura, Breath Attack, and Energy Manipulation;
    Magic users across the games have consistently shown the ability to manipulate
    the shape and properties of their own magical abilities, with even higher tiers
    of spells simply being considered stronger versions of the same basic ability)
    **Energy Manipulation and Projection (Via various magic spells) **Data Manipulation
    and Information Manipulation (Type 2; Magic is synced with Relics, which are used
    for Data Input and communication, Relics being tied to the crystals, which in
    turn are tied to Fal''Cie deities who are capable of creating entire realities
    composed of data such as Orphan''s Cradle) *Elemental Manipulation **Fire, Ice,
    and Matter Manipulation (Macro-Quantum; via Fire and Ice magic, Both Fire and
    Ice related abilities are stated to affect the target''s electrons, and even negate
    durability in the process) **Electricity Manipulation and Pain Manipulation (via
    lightning magic, Lightning spells are capable of attacking the target''s nervesFinal
    Fantasy IV Novel 2 Ch7 page 54) **Water Manipulation, Air Manipulation, and Earth
    Manipulation(via Water & Aero spells, and Quake respectively) *Poison Manipulation,
    Disease Manipulation, and Corrosion Inducement (Can inflict Poison, which is also
    stated to corrode the target. The Poison spell is called "Bio" in the Japanese.
    The Bio spell can cause diseases) *Status Effect Inducement **Paralysis Inducement
    (Via Daze, which stuns the target) **Empathic Manipulation (via Provoke and Charge)
    **Pain Manipulation (via Pain) **Power Nullification (via Fog and Fogga) **Curse
    Manipulation and Probability Manipulation (via Curse; Which lowers the targets
    odds of interrupting actions) **S'
