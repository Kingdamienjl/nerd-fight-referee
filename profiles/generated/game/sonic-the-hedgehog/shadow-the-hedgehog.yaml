    {{!}}-{{!}}Dark Shadow=right|400px {{Quote|Death to all who oppose me!|100px|rightShadow
    filling the Dark Gauge.}} {{!}}-{{!}}Hero Shadow=right|400px {{Quote|Behold the
    ultimate power!|100px|rightShadow filling the Hero Gauge.}} }} ==Summary== {{Nihongo|Shadow
    the Hedgehog|シャドウ・ザ・ヘッジホッグ|Shadō za Hejjihoggu}} is an anthropomorphic hedgehog
    and recurring character that has appeared numerous times throughout the Sonic
    the Hedgehog video game series and its related media, debuting in 2001''s Sonic
    Adventure 2 as the arch-rival of Sonic the Hedgehog and remaining that way since.
    He is a genetic hybrid between Hedgehog/Black Arms DNA created by Gerald Robotnik
    and the finalized result of {{Nihongo|Project Shadow|プロジェクトシャドウ|Purojekuto Shadō}},
    a government experiment of the United Federation aboard the Space Colony Ark that
    claimed to be achieving mankind''s ultimate eternal dream; immortality. The truth
    was far more sinister; to use said results in order to create weapons of untold
    destruction. However, when G.U.N. boarded the Space Colony Ark and began slaughtering
    workers and civilians alike, Shadow would be launched to Earth in an escape pod
    at the cost of his dearest friend''s life. Fifty years later, Dr. Eggman would
    discover and awaken Shadow from stasis during one of his many attempts to hold
    dominion over planet Earth. Despite working alongside the mad scientist for the
    majority of his first days after awakening, Shadow would aid the heroes at the
    eleventh hour upon realizing his memories had been tampered with by Gerald Robotnik
    long ago. No longer spurred on by vengeance, but instead to protect, he would
    assist Sonic the Hedgehog in stopping the original Project Shadow (the Biolizard)
    from crashing the Ark into the planet. Despite his rough demeanor and preference
    of solitude, Shadow the Hedgehog is there to prevent harm from coming to the planet
    Maria loved so dearly. ==Powers and Stats'
