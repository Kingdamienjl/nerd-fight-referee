    objects and throws them as projectiles to bombard an opponent from a distance.
    Should his opponent get close he can also target them directly and throw them
    back to force his foe to play catch-up. He can also use this ability on himself
    to simulate flight and can move at speeds comparable to Sonic and Shadow. **Psycho
    Smash: One of his signature attacks, Silver charges up psychic energy in his body
    before releasing a powerful burst of psychokinetic power that knocks foes far
    away. Those caught in its path are paralyzed and flung helplessly across a distance
    proportional to the time spent charging. Silver can also condense this energy
    into his hand to smack at an opponent at close range. **Psychic Knife: Flings
    a wave of psychokinetic energy that emits electrical charges, paralyzing foes
    on contact. **Psycho Shock: Silver jumps into the air and charges psychokinetic
    energy in his hand. Once he lands, he places the palm of his hand onto the ground
    and releases a psychokinetic shockwave that paralyzes nearby enemies and knocks
    away their projectiles from him. **Teleport Dash: The Teleport Dash is a psychic
    jump that warps space, allowing Silver to move quickly “through” an enemy or an
    enemy attack and avoid damage. This is a good move to use when facing multiple
    enemies that you must get close enough to use PK against them. **ESP/Psychic Control:
    Silver places both hands on his forehead, charging up energy before releasing
    in it a massive dome that induces vertigo on all opponents, rendering them incapable
    of moving properly and allowing Silver to zip past them or pummel them without
    retaliation. **Levitate: Silver uses his psychokinesis to move his own body through
    mid-air, granting him the ability of flight. When flying, Silver can move himself
    at extreme speeds, nearing those that Sonic can run at. **Teleport Dash: Silver
    jumps mid-air and uses his psychokinesis to warp space, allowing him to teleport
    through the air at light speed. **Meteor Smash: Silver uses his psychokinesis
    to pick up various debris and mashes them into a giant ball many times his own
    size. Silver then tosses the ball at his enemies as it tumbles along the ground.
    However, it will fall apart to pieces once Silver loses his concentration. *Spin'
