      Rings), up to Immeasurable at his peak (Able to outpace laser attacks that stem
      from Solaris'' body and whose attacks are shown to be throughout all of time
      itself due to them appearing in the past, present, and future alike. Comparable
      to Modern Super Sonic, who is capable of attacking Solaris faster than it can
      even cross its arms to defend itself), higher with the Spin Attack and Boost'
