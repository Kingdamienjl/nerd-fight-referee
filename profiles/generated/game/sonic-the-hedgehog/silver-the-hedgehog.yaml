      to outmaneuver even for the likes of Sonic. When flying, he can race Sonic evenly
      during Generations. Flew at an even pace with Infinite for a brief time), even
      higher with the Spin Attack (Silver can utilize the Spin Attack a technique
      that allowed Sonic, Tails Nine, and Renegade Knucks to blitz a group of Eggforcers
