- id: claim-weaknesses-ac15ca08
  section: weaknesses
  axis: weakness
  text: 'Extraordinarily mentally unstable, and just as likely to do something actively
    self-sabotaging as he is to do something in his best interests, as he claims he
    does not understand the idea of "motive". He will frequently structure his plans
    with exploitable weaknesses just to amuse himself. His right hand is a weak point
    and cannot regenerate. Notable Attacks/Techniques: * Roll: A simple combat roll
    meant for dodging attacks. * Scapegoat: At the cost of a small fraction of his
    health, Chaos summons a double of himself, blocking a single attack and vanishing
    afterwards. * Curse: Chaos throws a non-damaging ball of magic at the opponent.
    Upon hit, a debuff is applied to the opponent allowing Chaos to more accurately
    shoot at the opponent. * Deus Ex Machina: Chaos fires countless bullets through
    a portal, with them exiting through multiple portals surrounding the opponent.
    The portals will always manage to surround the opponent, no matter the position
    they are relative to Chaos. His revolvers somehow always have full clip afterwards
    despite Chaos never reloading in the timeframe. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{reflist}} {{Discussions}} Category:Characters
    Category:Guilty Gear Category:Omniscient Beings Category:Gun Users Category:Magic
    Users Category:Regeneration Users Category:Curse Users Category:Mind Users Category:BFR
    Users Category:Dimensional Travel Users Category:Duplication Users Category:Reality
    Warpers Category:Chi Users Category:Information Users Category:Possession Users
    Category:Anti-villains Category:Male Characters Category:Fighting Game Characters
    Category:Vehicular Masters Category:Primary Antagonists'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-68636a74
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Weapon Mastery,
    Vehicular Mastery, Magic via Information Manipulation (which entails Fire Manipulation,
    Water Manipulation, Air Manipulation, Earth Manipulation, and Chi Manipulation),
    Extrasensory Perception (Ki users can detect the flow of Ki in others), Teleportation
    and Time Travel, Summoning, Shapeshifting, Regeneration (High-Mid; recovered from
    Sol blowing him in half, although his right hand is exempt from this), Reality
    Warping, some level of Subjective Reality (can see his own memories from the future),
    Mind Manipulation, Curse Manipulation, Hacking, Possession, Duplication (Can summon
    duplicates which stand in place and act as barriers at the cost of vitality),
    Illusion Creation, Immortality (Types 1 and 7), Portal Creation, Dimensional Travel
    and BFR (Can create portals to different places in our dimension as well as the
    Backyard), Statistics Amplification (via Focus and Super Focus), Status Effect
    Inducement (via Curse), Fear Manipulation (managed to paralyze Anji Mito and even
    make Sol hesitate with his threatening aura alone), Mind Manipulation and Transmutation
    (can brainwash people and change their appearance, alongside with transmuting
    them into a copy of himself that he can possess), Regeneration Negation (at least
    Low-Mid) with his custom ammunition, Breaking the Fourth Wall (capable of shooting
    the round timer), Immunity to Information Manipulation, Matter Manipulation, Soul
    Manipulation, Mind Manipulation and Transmutation (Denizen of the Backyard, which
    constantly breaks down and reconstructs information with normally catastrophic
    effects on the physical), Resistance to Power Nullification (Asuka R. Kreuz claims
    that Chaos is a far stronger magician than he, which means that his magic is beyond
    the twelve Divine Steps and immune to traditional countermagic), Homing Attack
    with Deus Ex Machina
  source_ids: *id003
  decisive: true
  status: unverified
