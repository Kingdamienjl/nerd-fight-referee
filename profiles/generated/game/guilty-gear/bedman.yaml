  intelligence:
    text: 'Supergenius (Possesses an inhuman IQGuilty Gear: STRIVE - Glossary, further supported by him
      stating that an IQ of 200 at minimum is required to even be friends with himGuilty Gear Xrd -Sign-,
      Bedman Victory. In fact, this is all while he remains asleep, as he was born too intelligent for
      his brain to keep up with, forcing him to remain in a coma and in a world of dreamsGuilty Gear Xrd
      -Revelator- 2, Chapter 6 - Cause - B. If he were to wake up, he would only be able to survive for
      a short period of timeGuilty Gear Xrd -Revelator- 2, Chapter 8 - Wall - A before his advanced mental
      processes petrify his body, killing him. Jack-O Valentine even notes that when he is awake, his
      physical memory cannot keep up with the speed of his thoughtsGuilty Gear Xrd -Revelator- 2: Bedman
      Story Mode, in addition to stating that she has never encountered anyone with as much knowledge
      about magic as him despite being created by and knowing Asuka R. Kreutz. Trapped Asuka with the
      ultimate defense spell, Absolute Defense: FelionGuilty Gear Xrd -Revelator- 2, Opening, despite
      its authorization restrictions - a spell which Asuka himself admits to have trouble decoding and
      earlier admits to being unable to dispel.Guilty Gear Xrd -Sign-, Chapter 7 - Showdown - B Such a
      feat would require immense knowledge in physics, as the use of magic is heavily linked with physics,
      such that the teaching of it is known as Magic Physics. Should be superior in intelligence to Happy
      Chaos, whose intelligence does not cause him to suffer a condition like Bedman''s, in addition to
      possessing "inhuman" IQ despite the former''s already immeasurable IQ)'
    source_ids: *id002
    confidence: 0.95
