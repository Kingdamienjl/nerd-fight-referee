- id: claim-powers-and-abilities-a876d983
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Genius Intelligence, Regeneration (Low-Mid), Explosion Manipulation\
    \ (Capable of creating explosions with his punches), Sound Manipulation, Self-Sustenance (Type 1),\
    \ Precognition (His intelligence lets him accurately predict what will happen next), Dimensional Travel\
    \ and Teleportation (Capable of traveling to different dimensions instantly), Telepathy, Memory Manipulation\
    \ (Temporarily erased Elphelt's memory), Magic as Information Manipulation (Magic in GG is a result\
    \ of manipulation of information in the Backyard), Forcefield Creation, BFR (Can teleport someone\
    \ to the Backyard), Sleep Manipulation, Time Manipulation and Duplication with D\xE9j\xE0 Vu, Can\
    \ trap his target in a nightmare world made up of their worst fear (This has shown to be powerful\
    \ enough to even trap That Man, and dying in the nightmare kills the target in real life), Reality\
    \ Warping, Durability Negation, Existence Erasure, Law Manipulation and Resurrection (Able to warp,\
    \ resurrect and erase others in the dream world, though he doesn't have these in the real world while\
    \ comatose. Also stated that his words are rules within his world), Possession (Possessed his bed\
    \ after dying), Spatial Manipulation, Transmutation, Soul Manipulation, Mind Manipulation, Deconstruction,\
    \ Death Manipulation, Biological Manipulation, Matter Manipulation and Disease Manipulation (Temporarily\
    \ created Absolute World, which will kill any lifeforms, erases everything within the area, and merge\
    \ the Backyard, an alternate dimension composed of chaotic information that breaks down the fundamental\
    \ laws of anything inside, and reality), Higher-Dimensional Existence and Acausality (4-D & Type 3.\
    \ Deleted his own ID, making himself a multi-dimensional beingGuilty Gear: STRIVE - Happy Chaos Story\
    \ Mode and making his existence the same across Independent Segments and one that dwells across infinite\
    \ timelines) Resistance to Extreme Cold, Cosmic Radiations, Death Manipulation, Existence Erasure,\
    \ Reality Warping, Transmutation, Information Manipulation, Deconstruction, Biological Manipulation,\
    \ Spatial Manipulation and Disease Manipulation (Temporarily resisted Absolute World which will kill\
    \ every lifeforms, deconstruct matter at sub-atomic to macro quantum level, erase everything in the\
    \ universe and create information flares), Matter Manipulation, Spiritual and Mental attacks (Able\
    \ to reside in his dream world, which is part of the Backyard), Sleep Manipulation (Constantly in\
    \ a medically induced coma but still conscious), Power Nullification (Magic beyond the twelve Divine\
    \ Steps, like Bedman's, is immune to traditional countermagic) and Empathic Manipulation (Able to\
    \ resist Elphelt's Instant Kill to some extent)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
