- id: claim-weaknesses-2a9dec06
  section: weaknesses
  axis: weakness
  text: Compulsively talkative. Extremely condescending and rarely, if ever, fights at full power. Cannot
    speak, warp and erase in the physical world, and his brain is not functioning at full capacity. If
    he ever wakes up or is separated from his bedframe, he only has 4 minutes before his own thought process
    will overload his physical form and petrify his body.
  source_ids: *id003
