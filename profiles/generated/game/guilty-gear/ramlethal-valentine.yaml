  intelligence:
    text: 'Gifted (Despite her lack of understanding of many things in the world, as she is still learning
      things every dayGuilty Gear: STRIVE - Glossary, she was skilled enough to be recruited into Illyria''s
      special brigade as its leader by Ky Kiske and Leo Whitefang) Notable Attacks/Techniques: *Bajoneto:
      Ramlethal is able to launch her swords out of their sheathes to attack. They automatically hang
      in the air until she retrieves them. *Cloak: Ramlethal''s cloak seems to be a kind of organism which
      she can control at will. Notably, the bottom of the cloak is covered in sharp, extendable teeth.
      *Self-Destruct: Like all Valentine units, Ramlethal is capable of detonating herself in a massive
      explosion as a last resort. *Dauro: Ramlethal rushes forward, delivering an uppercut surrounded
      by magical energy. *Erarlumo: A combination of attacks consisting of an uppercut, an axe kick, and
      a slash with the cloak''s teeth. *Flama Cargo: Ramlethal grabs the opponent and surrounds them in
      magical energy, which explodes after a short time. *Sildo Detruo: Ramlethal jumps up, then falls
      down, slashing toward the ground with her fingernails. *Cassius: Ramlethal fires a small ball of
      energy. *Agresa Ordono: Ramlethal performs two horizontal slashes of the swords in front of herself.
      *Sabrobato: Ramlethal rears both swords over her head, then slams them into the ground in front
      of herself. *Ondo: Ramlethal places her hand to the ground and claws it back, summoning a burst
      of rock to erupt from the ground to strike opponents from a few meters away. It has has a tracking
      property that will summon the rock roughly in the area of the opponent, and will push the opponent
      closer to Ramlethal on hit or block. Overdrives: *Calvados: Ramlethal uses both swords to fire a
      gigantic laser beam. *Trance: Ramlethal gives both swords to her familiar Lucifero, who takes them
      in his mouth and spins forward at high speed. *Explode: Ramlethal surrounds the opponent with her
      cloak and charges it with magic energy, trapping them in an explosion. *Mortobato: Ramlethal slams
      both swords into the ground at her feet, inciting an explosion of magical energy around herself.
      Instant Kill: *Animo Estingi: Ramlethal attacks in a flurry before unsheathing her swords, then
      performs a cross-shaped slash with both, finishing the enemy.'
    source_ids: *id002
    confidence: 0.95
