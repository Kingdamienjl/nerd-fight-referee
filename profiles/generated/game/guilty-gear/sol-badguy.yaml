- id: claim-powers-and-abilities-e1665dca
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Content= *Gear Physiology *Acausality (Type 1; Even after his
    past self was killed by I-No, Sol continued to exist) *Immortality (Types 4 & Limited 8; Reliant on
    Master Ghost, though this doesn''t last indefinitely, His core is also stated by Leo to also be immortal)
    *Self-Sustenance (Types 1 & 2) *Regeneration (Mid-High; his regeneration is superior to Raven''s,
    and he can regenerate from being reduced to ash) *Genius Intelligence *Weapon Mastery **Air Manipulation,
    Forcefield Creation, Petrification, Chi Manipulation, Sound Manipulation, Teleportation, Electricity
    Manipulation, Sealing, Fusionism, Time Manipulation & Light Manipulation (Sol had and made the Outrage
    weapons which includes Anji''s Zessen, which can manipulate air, chi, sound and electromagnetic signals,
    teleport and create dimensional barriers. He also fused Fireseal with Zenga, which is able to use
    light magic. He also made and confiscated the Ky''s sword in Lightning The Urgent, which is able to
    create lightning and able to seal someone in subspace that slow time to near halt with their bodies
    turned into stone) *Flight (Shown to be able to fly even in base form) *Fire Manipulation *Regeneration
    Negation (Up to Low-Mid) *Statistics Amplification (Can amp himself with Junkyard and Dragon Install)
    *Explosion Manipulation (With All Guns Blazing), *Power Nullification (Can dispel spells) *Reactive
    Evolution (He was able to adapt to tuning of the Backyard in GG2O) *Summoning, Extrasensory Perception
    & Resurrection (Via the MasterGhost, he can summon servants, sense people from another dimension and
    resurrect himself) *Enhanced Senses (Illusions & Invisibility; Can see through illusions and invisible
    foes) *Magic as Information Manipulation *Absorption (Energy; Kickstarted the junkyard by absorbing
    and using the Saint Oratorio''s energy at the end of Xrd Revelator) **Radiation Manipulation & Energy
    Projection (By kick-starting the Junkyard, he can fire virtually limitless energy of Saint Oratorio
    which is also highly radiative) *Creation (Recreated his bike after it was blown up by antimatter
    bomb by a Gear) *Reality Warping, Disease Manipulation, Biological Manipulation, Spatial Manipulation
    & Transmutation (His transformation alone will further amplify the information flare, which will warp
    reality, destroy space, cause sickness and mutations and transmutate objects by rewriting their information)
    *Soul Manipulation, Mind Manipulation, Matter Manipulation, Deconstruction (Macro-Quantum), Death
    Manipulation & Existence Erasure (Capable of inducing Absolute World which will kill every lifeform
    in the universe, erase everything, deconstruct matter at sub-atomic to macro quantum scale and merge
    Backyard and reality, an universe that assaults one''s body, mind and soul) *Non-Physical Interaction
    (Soul/Spirit; Able to punch Zappa''s vengeful spirit, was also able to punch Chronus'' soul out of
    Justice) Resistance to: *Extreme Cold, Cosmic Radiation, Death Manipulation, Reality Warping, Spatial
    Manipulation, Biological Manipulation, Deconstruction (Macro-Quantum), Transmutation, Information
    Manipulation & Existence Erasure (Both he and Justice are able to survive the Absolute World which
    will kill all of the races in the universe, creating mass extinction and erase everything that can''t
    survive said world. It also deconstruct matter at sub-atomic to macro quantum scale. It also create
    information flare which will flood the space with information, destroying it and then warping its
    reality, even can rewrite the information of the object to become something else and also create diseases
    and mutations) *Sleep Manipulation (Wasn''t put into coma during Justice''s inactivity) *Black Holes
    (Able to hold the black hole created by him and That Man) *Extrasensory Perception (Zato couldn''t
    "see" him with his senses) *Poison Manipulation (Sol has dealt with toxic-type Gears on multiple occasions)
    *Power Nullification (Can hurt people who use magic beyond twelve steps with normal magic) *Time Manipulation
    (Can move in Axl''s frozen time) }}'
