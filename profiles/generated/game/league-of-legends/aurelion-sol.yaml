  section: power_scale
  axis: battle_iq
  text: 'At least Supergenius, likely Nigh-Omniscient (Having existed since the dawn of creation, as well
    as due to his nature as a Celestial, Aurelion Sol is an extremely intelligent being, possessing knowledge
    on the nature of reality that surpasses almost anyone on Runeterra. He is recognized by Word of God
    as being the single most knowledgeable known being in the universe, tied with Swain and ahead of ZoeRiot
    Report: December 2020, placing him above Bard, Soraka, The Celestials, Zilean, Singed, and Heimerdinger.
    His knowledge of magic is such that Runeterran mages are considered tragically primitive, comparable
    to infants trying to understand the mechanics of reality, children folding origami, and butchers sullying
    the true intent of magic in his eyes, and that even champions such as Nasus, Ryze, and Zilean, genius
    mages in their own rights, can learn millions of new things from him if he felt like teaching)'
  source_ids: *id003
  decisive: false
  status: unverified
