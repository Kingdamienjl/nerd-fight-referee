- id: claim-weaknesses-9e7e94da
  section: weaknesses
  axis: weakness
  text: 'Incredibly arrogant and egotistical in his abilities; while not to say that they aren''t impressive,
    this is what led to him being imprisoned under the control of the Targonians. Immensely powerful magic
    can force him to comply to orders, such as the ones that the Targonians used to bind him to Targon.
    Notable Attacks/Techniques: *Celestial Dragon Physiology: Aurelion Sol is a Celestial, an entity coming
    directly from the Celestial Realm. As a Celestial, Aurelion Sol does not possess a proper body and
    instead chooses to take the form of a dragon. **Immortality: As a Celestial, Aurelion Sol is immune
    to aging, disease and is functionally immortal. **Flight: Aurelion Sol is capable of flying across
    space by using his Celestial Dragon form and being attuned to the Celestial Realm. **Stardust Breath:
    Because of his Celestial Dragon physiology, Aurelion Sol can channel cosmic power into his mouth,
    breathing it out as a powerful blast of stardust capable of obliterating enemies in starfire. * Celestial
    Magic: Aurelion Sol is closely attuned to the Celestial Realm and has access to its magic, allowing
    him to create and manipulate the cosmos to his will. Unfortunately, these powers are strongly nullified
    by the golden crown given to him by the Aspects. Despite this, Aurelion Sol has begun regaining some
    control over his celestial magic, allowing him to create blasts of energy, miniature black holes and
    entire living entities out of constellations. **Stardust Manipulation: Aurelion Sol can manipulate
    stardust, allowing him to coalesce it into entire stars. Aurelion Sol is so talented in creating stars
    that he practically forged every star in the universe with pristine detail and care. Along with that,
    he can manipulate stars to his own whim by making miniature star-like objects, causing supernovas
    at will and even going as far as to drag entire stars down to crush his opponents. ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}}
    Category:Characters Category:League of Legends Category:Abstract Entities Category:Avatar Creation
    Users Category:Black Hole Users Category:Clairvoyance Users Category:Concept Users Category:Cosmic
    Awareness Users Category:Cosmic Entities Category:Creation Users Category:Dragons Category:Energy
