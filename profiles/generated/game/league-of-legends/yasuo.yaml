- id: claim-weaknesses-832b6f62
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: |-|Original Yasuo= *Way of the Wanderer:
    **Intent: Yasuo doubles his total critical strike chance from all other sources,
    but his critical strike damage is reduced by 10%. **Resolve: Yasuo generates Flow
    when he travels by any means. Upon taking champion or monster damage, Yasuo consumes
    all Flow to shield himself. *Steel Tempest: Yasuo thrusts his sword to deal physical
    damage to all enemies in the target direction, applying on-hit effects to the
    first target hit. Casting Steel Tempest while dashing with Sweeping Blade affects
    enemies around Yasuo instead. Steel Tempest''s ratio damage can critically strike,
    but it will be affected by Intent''s damage reduction, dealing reduced damage.
    If Steel Tempest hits an enemy, he gains a Gathering Storm stack to which he''s
    able to cast Steel Wind Rising. **Steel Wind Rising: Yasuo casts Steel Tempest.
    If it hits an enemy, Yasuo can gain another Gathering Storm stack to which he
    can cast Gathering Storm. ***Gathering Storm: Yasuo unleashes a whirlwind that
    travels an increased distance in the target direction, dealing the same damage
    and knocking airborne all enemies hit. Gathering Storm''s knockup does not gain
    increased range when cast during Sweeping Blade. *Wind Wall: Yasuo creates a gust
    of wind that travels in the target direction to form a wall in front of him. The
    wall slowly drifts forward, blocking all enemy projectiles. *Sweeping Blade: Yasuo
    Dash dashes toward an enemy dealing magic damage. Yasuo cannot dash to the same
    target more than once every few seconds. Each Sweeping Blade cast increases the
    next dash''s base damage by and can increase its damage a maximum of two times.
    *Last Breath: Yasuo blinks to the nearest airborne enemy champion, instantly generating
    maximum Flow while resetting Steel Tempest. Upon arrival, he suspends all nearby
    airborne enemies, dealing physical damage thereafter. For the next 15 seconds,
    Yasuo''s critical strikes gain bonus armor penetration. *Wind Manipulation: Yasuo
    can control his wind so precisely that he can use it to destroy the opponent''s
    weapon, and he can control wind created just from the breath from a person''s
    lungs. |-|PROJECT Yasuo= *Plasma Forge Drop Blade: PROJECT Yasuo''s alternate
    weapon, a nodachi with a plasma coating that provides a low density blade suitable
    for advanced operator mobility. Designed and tested for short to mid-range combat.
    *Way of the Wanderer: **Intent: Yasuo doubles his total critical strike chance
    from all other sources, but his critical strike damage is reduced by 10%. **Resolve:
    Yasuo generates Flow when he travels by any means. Upon taking champion or monster
    damage, Yasuo consumes all Flow to shield himself. *Steel Tempest: Yasuo thrusts
    his sword to deal physical damage to all enemies in the target direction, applying
    on-hit effects to the first target hit. Casting Steel Tempest while dashing with
    Sweeping Blade affects enemies around Yasuo instead. Steel Tempest''s ratio damage
    can critically strike, but it will be affected by Intent''s damage reduction,
    dealing reduced damage. If Steel Tempest hits an enemy, he gains a Gathering Storm
    stack to which he''s able to cast Steel Wind Rising. **Steel Wind Rising: Yasuo
    casts Steel Tempest. If it hits an enemy, Yasuo can gain another Gathering Storm
    stack to which he can cast Gathering Storm. ***Gathering Storm: Yasuo unleashes
    a whirlwind that travels an increased distance in the target direction, dealing
    the same damage and knocking airborne all enemies hit. Gathering Storm''s knockup
    does not gain increased range when cast during Sweeping Blade. *Wind Wall: Yasuo
    creates a gust of wind that travels in the target direction to form a wall in
    front of him. The wall slowly drifts forward, blocking all enemy projectiles.
    **XX-250 Environmental Barrier Unit: PROJECT Yasuo''s version of Wind Wall, a
    barrier of hard light which provides protection against all types of projectiles.
    *Sweeping Blade: Yasuo Dash dashes toward an enemy dealing magic damage. Yasuo
    cannot dash to the same target more than once every few seconds. Each Sweeping
    Blade cast increases the next dash''s base damage by and can increase its damage
    a maximum of two times. **MC-2 Firing Piston: A device used by PROJECT Yasuo which
    provides easy drifting between enemies. |-|Odyssey Yasuo= *Warp: Allows the user
    to dash towards the target location while being intangible and invulnerable. Can
    hold up to 3 charges. *Song: Odyssey Yasuo’s blade, Song, is a run of the mill,
    store-bought laser sword so heavily augmented with ora that it barely resembles
    its original model. Capable of creating pure energy barriers and bolts of plasma,
    Song is a powerful weapon even in unskilled hands. And Yasuo is exceptionally
    skilled. *Horizon: Gain bonus range on basic attacks and Steel Tempest. *Silvered:
    For every 2 bonus attack damage, Yasuo gains 1% bonus ability damage. *The Captain:
    Way of the Wanderer''s shield strength and duration are doubled, grants bonus'
