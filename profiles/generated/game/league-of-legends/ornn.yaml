- id: claim-weaknesses-6ba70906
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Living Forge: Ornn can purchase non-consumable items
    from anywhere on the field by forging them himself, and is also presented a Forge Menu with his recommended
    items to select to be forged. Forging takes 4 seconds and the process is interrupted if Ornn enters
    combat, disabling Living Forge. Additionally, Ornn and each of his teammates can purchase Masterwork
    upgrades. Each player may only have one Masterwork upgrade at a time. **Brittle: Bellows Breath''s
    final flame and Call of the Forge God apply Brittle to enemies for 6 seconds. Ornn''s next basic attack
    against a Brittle target consumes the mark, briefly knocks them back. The next immobilizing effect
    against a Brittle target consumes the mark, dealing a percent of the target''s maximum health as bonus
    magic damage and lasting 30% longer. *Volcanic Rupture: Ornn slams his hammer into the ground, sending
    a fissure in the target direction that stops early if an enemy champion is hit, dealing physical damage
    and slowing enemies hit for 2 seconds. After a 1.5-seconds delay, an impassable magma pillar erupts
    at maximum range for 4 seconds. *Bellows Breath: Ornn marches unstoppably in the target direction
    over the next 2.5 seconds. Over the march he belches fire over a cone in front of him, dealing magic
    damage every 0.5 seconds to enemies hit. The final bout of flame will apply Brittle. *Searing Charge:
    Ornn charges forward, dealing physical damage to enemies he passes through, stopping upon colliding
    with terrain. Upon collision creates a shockwave that deals increased physical damage and knocks up
    enemies within for 1 second. Searing Charge can damage enemies twice. Magma pillars and terrain created
    by enemy champions caught in the shockwave are destroyed. *Call of the Forge God: Ornn summons an
    elemental at maximum range in the target direction that stampedes toward him, dealing magic damage
    and slowing enemies hit by 40% for 2 seconds. While stampeding, Ornn can re-activate Call of the Forge
    God, causing him to dash forward in the target direction. If Ornn collides with the elemental, he
    headbutts it, sending it stampeding again in the new direction and empowering it to knock up enemies
    hit. Call of the Forge God can damage enemies twice. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==Notes== {{Scroll box|content=}} {{Discussions}} Category:Characters Category:Male Characters Category:Game
    Characters Category:League of Legends Category:Demigods Category:Guardians Category:Animals Category:Immortals
    Category:Fire Users Category:Lava Users Category:Earth Users Category:Incorporeal Characters Category:Hammer
    Users Category:Temperature Users Category:Breath Attack Users Category:Playable Characters Category:Large
    Sized Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
