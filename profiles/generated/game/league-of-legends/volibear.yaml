- id: claim-weaknesses-c3143974
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *The Relentless Storm: Volibear gains 1 stack of The
    Relentless Storm whenever he damages an enemy with basic attacks on-hit and abilities, up to a maximum
    of 5. At maximum stacks, he gains Lightning Claws. Volibear gains bonus attack speed per stack. **Lightning
    Claws: Volibear''s claws ignite with lightning, causing his basic attacks on-hit to deal bonus magic
    damage to the target and the closest visible enemy, chaining up to 4 subsequent targets. *Thundering
    Smash: Volibear drops on all fours, becoming gaining bonus movement speed, doubled when moving towards
    visible enemy champions. While active, Volibear''s next basic attack within the duration pounces on
    the target, deals bonus physical damage, and stuns the target. *Frenzied Maul: Volibear strikes the
    target enemy, dealing physical damage, applying on-hit and on-attack effects, and Wounding them. If
    Frenzied Maul targets a Wounded enemy, Volibear bites the target, dealing increased damage and healing
    himself. *Sky Splitter: Volibear summons a lightning bolt to strike at the target location. If Volibear
    is within the lightning strike, he shields himself. The lightning bolt deals magic damage to all enemies
    struck, slowing them, and grants sight of the area. *Stormbringer: Volibear gains bonus health, bonus
    attack range, increased range on Frenzied Maul, increased size, and leaps to the target location with
    immunity to crowd control as well as granting sight of the area. Volibear slows all enemies in an
    area on impact, with enemies in the epicenter also being dealt physical damage. Volibear also disables
    enemy turrets (including untargetable ones) in an area for a few seconds, dealing them the same physical
    damage. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Discussions}} Category:Characters
    Category:Male Characters Category:Game Characters Category:Video Game Characters Category:League of
    Legends Category:Science Fantasy Characters Category:Playable Characters Category:Bears Category:Gods
    Category:Demigods Category:Spirits Category:Berserkers Category:Warriors Category:Brawlers Category:Eldritch
    Horrors Category:Immortals Category:Avatar Creation Users Category:Magic Users Category:Empowerment
    Users Category:Reactive Power Level Users Category:Enhanced Senses Users Category:Incorporeal Characters
    Category:Size Users Category:Large Sized Characters Category:Electricity Users Category:Weather Users
    Category:Sound Users Category:Soul Users Category:Dream Users Category:Corruption Users Category:Mind
    Users Category:Empathic Manipulation Users Category:Morality Users Category:Telepaths Category:Possession
    Users Category:Power Nullification Users Category:Perception Users Category:Body Control Users Category:Acid
    Users Category:Statistics Amplification Users Category:Damage Boost Users Category:Paralysis Users
    Category:Healers Category:Forcefield Users Category:Statistics Reduction Users Category:Extrasensory
    Perception Users'
  source_ids: *id003
