  intelligence:
    text: Gifted (As the Commander General of The Trifarian Legion, Darius is a highly
      skilled military strategist and combatant, his fearsome notoriety being so widely
      recognized even in the lands beyond Noxus that it is not uncommon for entire
      cities to surrender at the first sight of his banners. Having served in the
      Noxian warhost since he was 12, Darius has spent most of his life fighting in
      numerous grueling campaigns of conquest from one end of the known world to the
      other, as well as crushing a number of rebellions against the throne. As he
      rose steadily through the ranks he garnered a great respect for his aggression,
      discipline, and refusal to ever take a backward step, even going so far as beheading
      a Noxian general after he ordered a retreat, rallying the scattered warbands
      and winning a great and unexpected victory against a far more numerous foe.
      As a result of this he was rewarded with a senior command of his own, attracting
      many thousands of eager recruits from across the empire, of which he accepted
      only the strongest, the most disciplined, and iron-willed. With the establishment
      of the Trifarix, Darius raised a new, elite force—the Trifarian Legion, the
      most loyal and prestigious warriors the empire could produce—and leads the armies
      of Noxus into a glorious new age of conquest. These soldiers, personally trained
      by Darius, hold a reputation known throughout Valoran—even among those who had
      never fought beside or against them—and are so feared that just two legionaries
      could take over an entire city. In combat Darius is a cold-blooded killer, moving
      through the battlefield with powerful, precise movements and striking with deadly
      force where it matters most.)
