- id: claim-weaknesses-e8566b28
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Vastayan Grace: Whenever Ahri lands
    2 ability hits against a champion within 1.5 seconds, she gains 20% bonus movement
    speed for 3 seconds. *Orb of Deception: **Passive: Whenever Ahri hits an enemy
    with one of her abilities, she gains a charge of Essence Theft, and can gain up
    to 3 charges per ability cast. Upon reaching 9 charges, her next Orb of Deception
    heals her every time an enemy is hit. **Active: Ahri sends an orb of arcane energy
    in the target direction, dealing magic damage to every enemy it passes through,
    then pulls it back to herself, dealing true damage on the way back. *Fox-Fire:
    Ahri summons three spectral flames which orbit her for up to 5 seconds. Flames
    prioritize champions hit by Charm or any enemy hit by Ahri''s last basic attack,
    within 3 seconds. After 0.25 seconds, each flame targets a prioritized enemy,
    or after 0.4 seconds pursues the closest visible enemy in range, prioritizing
    champions, then the target of Ahri''s last basic attack, dealing magic damage.
    Multiple flames can hit the same target, with each flame beyond the first dealing
    30% damage. *Charm: Ahri blows a kiss in a line, dealing magic damage to the first
    enemy hit and briefly charming them. As demonstrated in her lore and the cinematic
    A New Dawn, this attack is not an actual projectile and does not require actual
    contact to take effect, rather Ahri simply manipulates the opponent''s mind directly.
    *Spirit Rush: Ahri dashes and fires up to three energy bolts that each target
    one of her nearest visible enemies, dealing them magic damage. Each enemy can
    only be hit by one bolt at a time. Spirit Rush can be cast three times in succession.
    *Life Absorption: Ahri can absorb the life force of those she successfully manipulates
    or seduces, as well as those who are near death or have just died. *Emotion Control:
    Ahri is capable of freely manipulating her prey''s emotions, allowing her to quickly
    alternate between dazzling them with visions of beauty, causing hallucinations
    of deep longing, and creating dreams colored by raw sorrow, among other things.
    ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Discussions}}
    Category:Characters Category:League of Legends Category:Female Characters Category:Game
    Characters Category:Energy Users Category:Fire Users Category:Foxes Category:Good
    Characters Category:Magic Users Category:Soul Users Category:Hunters Category:Science
