    Category:Seduction Users Category:Memory Users Category:Absorption Users Category:Mind
    Users Category:Playable Characters Category:Enhanced Senses Users Category:Homing
    Attack Users Category:Flight Users Category:Life Users Category:Statistics Amplification
    Users Category:Temperature Users Category:Magma Users Category:Lava Users Category:Data
    Users Category:Perception Users'
  source_ids: *id003
