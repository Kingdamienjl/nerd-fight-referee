- id: claim-weaknesses-7b67798e
  section: weaknesses
  axis: weakness
  text: 'None notable. Notable Attacks/Techniques: *Way of the Hunter: **Intent: Yone
    doubles his total critical strike chance from all other sources, but his critical
    strikes deal reduced bonus physical damage. **Duality: Yone''s basic attacks alternate
    between using his Steel Sword and Azakana Sword on-attack. His Steel Sword deals
    completely physical damage while the Azakana Sword deals half physical damage
    and half magic damage. *Mortal Steel: Yone thrusts his Steel Sword in the target
    direction, dealing physical damage to enemies hit and applying on-hit and on-attack
    effects to the first enemy hit. Mortal Steel can critically strike. If Mortal
    Steel hits an enemy with the thrust, Yone gains a Gathering Storm stack. While
    Yone has two stacks of Gathering Storm, Mortal Steel consumes the stacks to instead
    cause him to dash a fixed distance in the target direction and unleash a whirlwind
    traveling the same direction, both dealing the same damage and knocking up all
    enemies hit in their path. *Spirit Cleave: Yone cleaves with his Azakana Sword
    in the target direction, dealing equal parts physical and magic damage to enemies
    hit in a cone. Yone shields himself if Spirit Cleave hits an enemy, with increased
    durability based on the number of enemy champions hit. *Soul Unbound: Yone Dash
    dashes a fixed distance in the target direction, gaining Spirit Form as well as
    creating an intangible clone that is sent the same distance behind the cast location,
    though not through terrain. **Spirit'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-71942be1
  section: abilities
  axis: hax
  text: Human=Superhuman Physical Characteristics, Weapon Mastery (Master Swordsman),
    Martial Arts (Skilled in hand-to-hand combat), Acrobatics, Wind manipulation (Capable
    of using the Wind Technique, but not to the extent of Yasuo), Paralysis Inducement
    (Via Staggering Strikes) |-|Demon=All previous abilities, plus Immortality (Types
    1 and 4, possibly Type 5; Stated to have fallen out of the cycle of Kindred),
    Self-Sustenance (Types 2 and 3; Yone does not need to eat or sleep), Extrasensory
    Perception (Able to see both the human realm and the Spirit Realm simultaneously),
    Information Analysis (Able to see the true names of demons and spirits), Magic
    (Able to use Spirit Magic), Dimensional Travel (Able to travel to and from the
    Spirit Realm at will), Weapon Creation (Able to summon his Azakana Sword from
    thin air), Non-Physical Interaction (Can hit intangible and incorporeal enemies),
    Soul Manipulation (Able to directly manipulate souls with his magic. His presence
    alone exerts a palpable force that affects the souls of those around him), Sealing
    (His Azakana Sword is able to seal demons and spirits), Smoke Manipulation (Able
    to manipulate smoke as well as transform into smoke), Astral Projection (Via Spirit
    Form), Intangibility (Via Spirit Form. His Azakana Sword is also intangible to
    mortals), Flight (Via Spirit Form), Forcefield Creation (Via Spirit Cleave), Reactive
    Power Level (Spirit Cleave's shield becomes more durable the more enemies Yone
    hits), Statistics Amplification (Speed Amplification Via Spirit Form), Limited
    Power Nullification (Via Spirit Form. It grants Yone the effects of Cleanse, nullifying
    all forms of crowd control including Empathic Manipulation, Fear Manipulation,
    Paralysis Inducement, Power Nullification, Statistics Reduction, and Sleep Manipulation),
    Paralysis Inducement (Via Fate Sealed), Teleportation (Via Fate Sealed), Resistance
    to Time Manipulation, Reality Warping, Soul Manipulation, and Existence Erasure
    (Resists the effects of the Spirit Realm)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
