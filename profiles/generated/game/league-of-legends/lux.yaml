- id: claim-weaknesses-899034b0
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Illumination: Damaging enemies
    with abilities marks them with light. Lux''s basic attacks and Final Spark consume
    the mark, dealing bonus magic damage. *Light Binding: Lux releases a sphere of
    light in a line that deals magic damage to the first two enemies hit and roots
    them. *Prismatic Barrier: Lux launches her wand in the target direction which
    returns to her after reaching maximum range. The outgoing wand shields Lux and
    all allied champions it touches. The returning wand also shields, while also stacking
    with the outgoing shield. *Lucent Singularity: Lux sends an anomaly of twisted
    light to a target area, slowing enemies inside and granting vision around it.
    At the end of the duration or if Lucent Singularity is reactivated, the area detonates,
    dealing magic damage. *Final Spark: Lux fires a massive laser of light in a line
    that deals magic damage, briefly revealing enemies as well as the surrounding
    area. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Discussions}}
