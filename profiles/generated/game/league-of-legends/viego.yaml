- id: claim-powers-and-abilities-d78d407d
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Immortality (Types 1, 7, and 8 [So long
    as the Black Mist exists, he will be reborn indefinitely]), Weapon Mastery (Skilled
    Swordsman), Magic, Intangibility, Corruption, Deconstruction, Soul Manipulation,
    Mind Manipulation, Empathic Manipulation, Madness Manipulation, Life Manipulation,
    Death Manipulation (Is both the source of and the physical manifestation of the
    Black Mist, and can manipulate it and its powers at will), Power Nullification
    (Should be able to nullify attacks with the Black Mist in the same manner as Thresh),
    Resurrection (Able to bring those who have died back to life as his servants),
    Teleportation, Possession (Able to possess people on a global scale, including
    people such as Karma who has thousands of minds and souls), Statistics Amplification
    (Speed Amplification Via Sovereign's Domination and Harrowed Path), Empowerment
    (Via Blade of the Ruined King), Damage Boost (Via Blade of the Ruined King), Healing
    (Via Blade of the Ruined King), Paralysis Inducement (Via Spectral Maw), Statistics
    Reduction (Speed Reduction Via Heartbreaker), Resistance to Existence Erasure,
    Purification (Type 3; Viego has absorbed healing waters that can remove all evil
    influences. He can therefore survive Ahri's mind manipulation and continue attacking),
    Mind Manipulation, Madness Manipulation, Empathic Manipulation, Life Manipulation
    and Death Manipulation (completely ignores all of Senna's abilities), Soul Manipulation
    (Withstood the initial black mist catastrophe without his soul getting corrupted
    on the level of other souls), Flight (Viego can fly in the form of black fog or
    in human form), Smoke Manipulation (Thanks to the triangular scar on his chest,
    Viego can generate black fog indefinitely and mold it into any shape he wants.
    Fog prison, fog ghouls, etc. He can also attack opponents with fog and infect
    them with it), Forcefield Creation (Viego can use the Black Mist and his Magic
    to create a wall/barrier that can block incoming attacks, and Viego does not need
    to take any action to activate it), Conceptual Manipulation (Type 1 and Layered
    1; In his battle with the Pantheon, Viego seems to have resurrected an erased
    concept and at the same time destroyed it forever)
