- id: claim-weaknesses-79d9dbc1
  section: weaknesses
  axis: weakness
  text: 'Possesses a single-minded obsession with finding and restoring Isolde''s
    life Notable Attacks/Techniques: *Sovereign''s Domination: Whenever an enemy champion
    is killed by Viego or dies within 3 seconds of being damaged by him, a Mist Wraith
    spawns from their corpse. Viego can basic attack a Mist Wraith to possess it,
    heal himself for part of the target''s maximum health, and blink to its location.
    Possession replaces Viego''s attacks, abilities, items, base stats, and appearance
    with the champion the Mist Wraith was summoned by and grants him a free cast of
    Heartbreaker. Viego also gains bonus movement speed while moving toward nearby
    enemy champions during this time. Viego will preserve his current health percentage
    between transformations. *Blade of the Ruined King: The Blade of the Ruined King
    is a royal weapon passed down from kings to kings. When a new king incarnated,
    it would absorb part of their soul in order to revive them should they get fatal
    injuries in battles. Viego''s basic attacks passively deal bonus physical damage
    on-hit. Additionally, damaging abilities apply a mark to enemies. Viego''s next
    basic attack against a marked target consumes the mark to strike twice, with the
    second strike dealing bonus physical damage and healing him. When used actively,
    Viego thrusts his blade in the target direction, dealing physical damage to enemies
    hit. Blade of the Ruined King''s passive remains under possession, and while transformed,
    the second strike is instead converted to bonus damage on-hit which no longer
    applies on-hit effects. *Spectral Maw: Viego charges to increase Spectral Maw''s
    mist range and stun duration, then hurls a blast of mist in the target direction
    and dashes a fixed distance in the same direction, though not through terrain.
    The mist deals magic damage to the first enemy struck and stuns them. *Harrowed
    Path: Viego sends a spectre in the target direction that creates a trail of mist
    along its path. The mist spreads around the first instance of terrain encountered.
    While inside the mist, Viego gains bonus attack speed and, if he is not attacking
    or casting, he becomes camouflaged and gains bonus movement speed. Declaring a
    basic attack or casting an ability will break the camouflage and remove the bonus
    movement speed. *Heartbreaker: Viego discards his current possession if he has
    one and gains displacement immunity over the cast time, then blinks to the target
    location. Upon arrival, Viego creates a blast that deals physical damage to all
    nearby enemies and knocks back all but one away based on proximity, though not
    through terrain. The most wounded enemy champion, alternatively the closest one,
    is not knocked back and instead takes the blow from Viego''s blade, which deals
    bonus physical damage, slows them by 99%, and applies on-hit effects. ==Notable
    Matchups== Victories: Losses: Inconclusive: ==References== {{discussions}} Category:Characters
    Category:League of Legends Category:Antagonists Category:Corruption Users Category:Damage
    Boost Users Category:Death Users Category:Deconstruction Users Category:Empathic
    Manipulation Users Category:Empowerment Users Category:Evil Characters Category:Forcefield
    Users Category:Game Characters Category:Ghosts Category:Healers Category:Immortals
    Category:Kings Category:Life Users Category:Madness Users Category:Magic Users
    Category:Male Characters Category:Mind Users Category:Non-Physical Interaction
    Users Category:Paralysis Users Category:Playable Characters Category:Possession
    Users Category:Power Nullification Users Category:Resurrection Users Category:Royal
    Characters Category:Science Fantasy Characters Category:Soul Users Category:Spirits
    Category:Statistics Amplification Users Category:Statistics Reduction Users Category:Sword
    Users Category:Teleportation Users Category:Undead Category:Weapon Masters'
  source_ids: *id003
