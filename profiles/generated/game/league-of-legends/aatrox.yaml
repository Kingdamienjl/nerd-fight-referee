- id: claim-weaknesses-07415f9b
  section: weaknesses
  axis: weakness
  text: 'Weaker hosts can be drained of their life force too quickly. Needs to constantly
    get new hosts and bodies to maintain a body strong enough to not decay too quickly.
    Notable Attacks/Techniques: *Deathbringer Stance: Aatrox''s next basic attack
    gains bonus range and deals a percent of the target''s maximum health as bonus
    physical damage. Enemy champions are Mutilated, reducing all healing and shielding
    on them. *The Darkin Blade: Aatrox swings his greatsword in the target direction,
    striking enemies in a line. The Darkin Blade can then be reactivated twice. The
    second cast strikes enemies in a cone and the third in the target area. Each cast
    deals physical damage, increasing with each cast. Hitting enemies at the far end
    of the first two casts and the center of the third deals bonus damage and knocks
    up enemies. *Infernal Chains: Aatrox smashes the ground in the target direction,
    creating a chain that stops on the first enemy hit, dealing physical damage, doubled
    against minions, and slowing them. If Infernal Chains hits a champion or large
    monster, they are chained to the impact area. If the chained enemy is still in
    the impact area after 1.5 seconds, they are dragged to the center and take the
    same damage again. *Umbral Dash: Aatrox Dash dashes in the target direction, gaining
    bonus attack damage. Aatrox heals for a percentage of the physical damage he deals.
    *World Ender: Aatrox unleashes his true demonic form, fearing nearby allied and
    enemy minions, and gaining bonus movement speed. While transformed Aatrox gains
    increased size and bonus attack damage, refreshing the bonus movement speed when
    out-of-combat with champions and turrets. Aatrox generates Blood Well equal to
    a percent of his maximum health. Taking lethal damage during World Ender revives
    Aatrox, during which he is untargetable, pacified and slowed and consumes the
    Blood Well to recover the same amount of health. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{Discussions}} Category:Characters Category:Male
    Characters Category:Game Characters Category:League of Legends Category:Neutral
    Characters Category:Energy Users Category:Sword Users Category:Blood Users Category:Flight
    Users Category:Immortals Category:Regeneration Users Category:Warriors Category:Science
    Fantasy Characters Category:Healers Category:Statistics Amplification Users Category:Soul
    Users Category:Playable Characters Category:Statistics Reduction Users Category:Matter
    Users Category:Possession Users Category:Life Users Category:Power Nullification
    Users Category:Chain Users Category:Transformation Users Category:Fear Users Category:Size
    Users Category:Absorption Users Category:Resurrection Users Category:Invulnerability
    Users Category:Large Sized Characters Category:Non-Physical Interaction Users
    Category:Dimensional Travel Users Category:Weapon Masters Category:Space Users
    Category:Concept Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
