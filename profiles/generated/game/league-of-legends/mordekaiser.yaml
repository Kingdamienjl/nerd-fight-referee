    Manipulation, Memory Manipulation, Madness Manipulation, Perception Manipulation, Reality Warping,
    Spatial Manipulation, Time Manipulation, Gravity Manipulation, Existence Erasure, Biological Manipulation,
    Corruption, Absorption (Life force, matter, magic, and information), and Soul Manipulation (Able to
    resist the full effects of The Void)
