- id: claim-powers-and-abilities-d6b735de
  section: abilities
  axis: hax
  text: Base=Superhuman Physical Characteristics, Immortality (Types 1, 4 [Though this is not combat applicable],
    7, 8 [Will exist in the physical realm so long as his armor exists], and 9 [Mordekaiser's Armor is
    nothing but a shell, as his true self exists as a disembodied soul within the Realm of Death]), Resurrection,
    Large Size (Type 0), Inorganic Physiology, Self-Sustenance (Types 1, 2, and 3), Weapon Mastery (Skilled
    mace wielder), Incorporeality (Mordekaiser's true form exists as a disembodied soul), Magic, Metal
    Manipulation, Necromancy, Soul Manipulation and Absorption (Able to manipulate, remove, absorb, and
    control souls, as well as turn them into any physical object he chooses so long as it is made of iron.
    The function of Thresh's lantern is based on Nightfall), Weapon Creation (Able to create weapons from
    the souls of his victims), Madness Manipulation and Existence Erasure (Should someone glance under
    his helm they will be driven mad and dissolve into lifeforce), Dimensional Travel and BFR (Able to
    travel to and from the Realm of Death and can forcibly send others there. Can also speak across realms),
    Summoning, Corruption, and Empowerment (The thousands of souls of those who he kills are trapped in
    the Realm of Death, corrupted and empowered by his magic, unable to be erased in death, and able to
    be summoned at his will. The Realm of Death itself is part of the Spirit Realm that has been corrupted
    by his influence.), Power Nullification (Bound Veigar to the physical plane to prevent him from escaping
    to Bandle City), Intangibility (Can become intangible in the real world by entering his spirit form),
    Damage Boost (Via Darkness Rise), Statistics Amplification (Speed Amplification Via Darkness Rise),
    Reactive Power Level (Obliterate deals more damage if it hits only a single opponent), Forcefield
    Creation (Via Indestructible), Self-Healing (Via Indestructible), Extrasensory Perception (Via Death's
    Grasp), Resistance Negation (Passively ignores magic resistance), Power Absorption (Able to steal
    part of his opponent's size, armor, magic resistance, health, attack damage, ability power and attack
    speed Via Realm of Death), Size Manipulation, Statistics Reduction (Size, armor, magic resistance,
    health, attack damage, ability power and attack speed reduction via Realm of Death), Resistance to
    Mind Manipulation and Madness Manipulation (Able to resist the influence of the Black Mist), Soul
    Manipulation (Has several million souls within him), Fire Manipulation (Was unfazed by flames that
    can melt humans just by being near it), and Existence Erasure (Was unable to be erased despite being
    within the Realm of Death for several hundred to several thousand years) |-|Infernal=All abilities
    as base plus Large Size (Type 3), Fire Manipulation, Magma Manipulation, and Heat Manipulation |-|Pentakill=All
    abilities as base plus Large Size (Type 1), Broadway Force, Dimensional Travel (Able to travel from
    the physical realm to the spirit realm), and Non-Physical Interaction (Able to affect Yordles and
    destroy Bandle City which, due to existing solely in the Spirit Realm, are both inherently non-corporeal)
    |-|Dragon Knight=All abilities as base plus Animal Manipulation (Able to control dragons) |-|Dark
