- id: claim-weaknesses-3f6255ca
  section: weaknesses
  axis: weakness
  text: 'Powerful enough magic can separate his soul from his armor, and if his armor is destroyed he
    cannot return to the mortal realm. Notable Attacks/Techniques: *Darkness Rise: Mordekaiser''s basic
    attacks deal bonus magic damage on-hit. Damaging abilities or basic attacks on-attack grant 1 stack
    per enemy champion or large monster hit, up to a maximum of 3. At 3 stacks, Mordekaiser gains Darkness
    Rise. Further basic attacks and abilities against enemy champions and large monsters refresh the duration.
    When activated, Mordekaiser projects a maelstrom of metal around himself, dealing magic damage per
    second to all nearby enemies, and gains bonus movement speed. *Obliterate: Mordekaiser smashes the
    area in the target direction, dealing magic damage to all enemies hit, increased if it hits only one
    enemy. *Indestructible: Mordekaiser passively stores part of the damage he deals and takes as Potential
    Shield. Mordekaiser can activate his Potential Shield shield himself. Indestructible can be recast
    after. Upon recast, Mordekaiser absorbs the remaining shield, healing for a percentage of the amount.
    *Death''s Grasp: Mordekaiser grants sight of the targeted area briefly and pulls all enemies within,
    dealing them magic damage. Additionally, Mordekaiser passively gains magic penetration. *Realm of
    Death: Mordekaiser slows the targeted enemy champion. If the target is still in range they''re banished
    together with Mordekaiser to the Death Realm. Only the target and Mordekaiser will enter the realm;
    other champions cannot follow them. For the same duration, Mordekaiser also reduces the target''s
    current attack damage, ability power, total attack speed, maximum health, armor, magic resist, and
    size, in addition to gaining them for himself. If Mordekaiser kills his target while inside, he keeps
    their partial stats. If one of the two affected champions leave the Death Realm, because of having
    died or having it dispelled, the other will do so as well, but the stats will remain stolen for the
    full duration. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{discussions}}
