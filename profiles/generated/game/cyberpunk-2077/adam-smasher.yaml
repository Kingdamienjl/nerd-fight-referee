- id: claim-powers-and-abilities-5becd15d
  section: abilities
  axis: hax
  text: 'Samson Body= * Superhuman Physical Characteristics * Cyborgization (Up to
    possibly 96% of his body has been replaced with machines. Has a built in HUD that
    can access a multitude of databases * Camouflage (Can blend in with his environment
    with his Environmental Assimilation SystemCyberpunk 2020: Solo of Fortune 2 page
    67-72) * Hacking (Can link to any electronic systemCyberpunk 2020: Chromebook
    2 page 80-81) * Fire Manipulation (Has a built in arc wielder that can cut through
    battleship plating) * Enhanced Senses (Has a notable array of visual and auditory
    upgradesCyberpunk 2020: Firestorm - Shockwave page 22) * Longevity (Cyborgs are
    capable of living for well over a hundred years due to their enhancements) * Explosion
    Manipulation (Has a wide range of explosive projectiles. From grenades to high
    explosive shells) * Skilled user in firearms and general combat tactics. Skilled
    in PanzerFaust, a martial art designed around full conversion Cyborgs. Considered
    to be a living legend and a notable hero of a world spanning war. Resistances
    * Pain Manipulation (Has built in Pain Editors that control the levels of pain
    that Smasher feels) * Poison Manipulation (Is immune to toxic gases that would
    be lethal to any human) * Radiation Manipulation (Has built in lead lined armor
    that allows Smasher to withstand heavy doses of radiation) * Light Manipulation
    (Has eye shielding to block out blinding light) * Sound Manipulation (Immune to
    things like sonics and stun bombs) |-|Dai Oni Body= All previous abilities due
    to Samson Body being combined with the Dai Oni body. * Large Size (Type 0; 3.1
    meters tallCyberpunk 2020: Firestorm - Shockwave page 40) * Cyborgization (Hooked
    up to a much larger frame as an Alpha Body. Has multiple built in weapons platforms)
    * Bodily Weaponry (Has built in Climber Claws that it can use as weapons) * Technology
    Manipulation (Can emit a jamming field over a wide radius) * Explosion Manipulation
    (Possess a shoulder mounted TOW-rocket) Resistances * Technology Manipulation
    (Can counter electronic jammersCyberpunk 2020: Maximum Meta- page 26) * Electricity
    Manipulation (Has built in capacitors to absorb EMPs) |-|Dragoon Body= * Superhuman
    Physical Characteristics * Cyborgization (96% of his body has been replaced with
    machine upgrades) * Explosion Manipulation (Possess shoulder mounted rockets)
    * Bodily Weaponry (Has built in machine guns and arm cannons installed onto his
    robotic frame) * Information Analysis and Enhanced Senses (Adam Smasher possess
    optic implants that allow him to scan the environment and other people. This function
    ranges widely in formation, getting everything from Blood Type, to holographic
    predictions of events based on the environment to telling Smasher what cybernetics
    someone else has and what possible strengths and weaknesses are. His body is a
    heavily modified version of the Dragoon frame, which is noted as having a wide
    variety of sensors and environmental scanners that would overwhelm normal human
    senses) * Statistics Amplification and Perception Manipulation (Adam Smasher has
    a Sandevistan installed on his frame, which greatly boosts his speed) * Skilled
    user in firearms and general combat tactics. Skilled in PanzerFaust, a martial
    art designed around full conversion Cyborgs. Considered to be a living legend
    and a notable hero of a world spanning war. Has over 50 years of further experience
    compared to his previous forms. * Possibly Large Size (Type 0; the Dragoon body
    is over 8 feet tall and Smasher''s version is notably bulkier and larger than
    the base frames) * Enhanced Senses (The Dragoon body comes with a variety of different
    vision packages that Smasher can swap between. The list includes Night Vision,
    Thermal Vision, Telescopic Vision, Infrared Vision and a standard HUD for his
    eyes. Amplified hearing and long range radio detection for his ears. Enhanced
    smell and a chemical analyzer for his nose. Sonar and Radar scanners and Radiation
    scanners) Resistances * Hacking (Easily overcame Lucy''s hacking attempt.Cyberpunk
    Edgerunners: S1E10 Lucy can easily overwhelm and kill netrunner cyborgs who themselves
    are incredibly good hackers.Cyberpunk Edgerunners: S1E07 Smasher''s ICE can shut
    down V''s cyberdeck and gets stronger the more V attempts to stack Quickhacks
    on him) * Radiation Manipulation, Biological Manipulation, Poison Manipulation,
    Electricity Manipulation (The Dragoon Body is designed to withstand Nuclear, Chemical,
    Biological and Electronic warfare and their adverse side effects.Cyberpunk 2020:
    Chromebook 2 page 80-83 The Dragoon body is also resistant to Infrared Sensors
    and EMPs) * Pain Manipulation (Has built-in Pain Editors that control the levels
    of pain that Smasher feels) * Light Manipulation (Has eye shielding to block out
    blinding light) * Sound Manipulation (Immune to things like sonics and stun bombs)'
  source_ids: *id003
  decisive: true
  status: unverified
