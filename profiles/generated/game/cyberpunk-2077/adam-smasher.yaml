- id: claim-weaknesses-0c9ae86e
  section: weaknesses
  axis: weakness
  text: 'Adam Smasher has a deep hatred for humanity and believes machinery is above
    organic matter. This, along with his ego, has lead to him making multiple rash
    and hot headed moves when confronted with someone that will challenge that worldview.
    Adam Smasher completely relies on his machinery to live. ==Notable Matchups==
    Victories: Losses: Adam Jensen (Deus Ex) Adam Jensen''s profile (Both were 9-A
    and speed was equalized) David Martinez (Cyberpunk (Games)) David Martinez''s
    Profile (Both were 9-B and speed was equalized. The battle took place in the Arasaka
    Tower) Inconclusive: ==Reference== {{Scroll box|content={{reflist|2}}}} {{Discussions}}
