power_scale:
  tier:
    text: At least {{9-B}} | {{High 8-C}}, higher with Berserk & Sandevistan
    source_ids:
    - vsbattles-johnny-silverhand-cyberpunk-2077
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: Wall level (Possess Gorilla Arms, which can replicate this feat. Can smash
      a person's head with enough force to pulverize it) | Large Building level (Fought
      on par with Adam Smasher and after a prolonged fight defeated him), higher with
      Berserk & Sandevistan
    source_ids:
    - vsbattles-johnny-silverhand-cyberpunk-2077
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Superhuman Running speed, High Hypersonic Combat Speed (Can deflect a point
      blank projectiles from a Mach 7 weapon. Can hit enemies with the Kerenzikov.
      Can dodge machine gun, pistol fire, sniper fire, and tech weaponry that utilize
      railgun technology. Should be comparable to cybernetically enhanced soldiers
      or psychos who are often seen as moving as actual blurs on screen), High Hypersonic+
      Combat speed with the Kerenzikov (The Kerenzikov increases V's speed until the
      world is moving at 40% speed from their perspective). Massively Hypersonic+
      with the Sandevistan (Can parry attacks from Adam Smasher when he's using a
      Sandevistan, which would make V superior to David Martinez . The Militech Apogee
      is superior to a Reflex ship that increases speed by a factor of 20x)
    source_ids:
    - vsbattles-johnny-silverhand-cyberpunk-2077
    confidence: 0.8
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: At least Wall level (Can take a grenade blast and shrug off gunfire which
      can easily bust walls) | Large Building level (Can take hits from Adam Smasher),
      higher with Berserk (Berserk enhanced V's durability to the point where they
      become immune to attacks that previously harmed them).
    source_ids:
    - vsbattles-johnny-silverhand-cyberpunk-2077
    confidence: 0.8
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Can sprint indefinitely. Killing opponents regains stamina with
      perks. During the game's Final Act, V pushed past multiple seizures and their
      body rejecting them while fighting Arasaka and eventually defeating Adam Smasher)
    source_ids:
    - vsbattles-johnny-silverhand-cyberpunk-2077
    confidence: 0.8
    notes: auto_repair source extraction
  range:
    text: Standard melee range physically. Extended melee range with cybernetic enhancements
      or weaponry. Tens to hundreds of meters with firearms and Quickhacking.
    source_ids:
    - vsbattles-johnny-silverhand-cyberpunk-2077
    confidence: 0.8
    notes: auto_repair source extraction
  intelligence:
    text: At least Above Average (V has complete mastery of most weapons that come
      their way, utilizing them extremely proficiently to the point of being able
      to wipe out entire squads of highly trained enhanced soldiers and taking down
      elite bodyguards who have already murdered men of his caliber. They can hack
      into other people's biochips and even military-grade computer systems. Has deep
      knowledge of the inner workings of the streets and corporations depending on
      the life path chosen. Certain dialogue paths that describe V's apparent history
      of military service, tech work, and savviness to social situations can appear
      depending on the attribute level. Can craft and install unique hardware or weaponry
      with no outside help)
    source_ids:
    - vsbattles-johnny-silverhand-cyberpunk-2077
    confidence: 0.8
    notes: auto_repair source extraction
