- id: claim-powers-and-abilities-38957a36
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Bodily Weaponry (Via its jaws and tough wing membrane),
    Rage Power (It becomes stronger and faster when enraged), Sound Manipulation (Its roar can briefly
    stun hunters), Large Size (Type 1 by length; a typical specimen is around 20 meters long), Flight
    (Its wing membranes enable flight), Breath Attack (It can exhale violent streams of water from its
    mouth), Water Manipulation (It can manipulate water by touch and through its breath weapon in a variety
    of ways: shooting globules of water, sending waves of water forward, and dragging puddles of water
    and those standing on it around), Electricity Manipulation (Over time, it builds up an electrical
    charge in its body which it can discharge by touch to stun or shock its foes, and which explosively
    evaporates water puddles as an attack), Status Effect Inducement (Its water attacks induce Waterblight,
    which halves the victim''s rate of stamina recovery, and its electrical attacks induce Thunderblight,
    which vastly increases the victim''s likeliness of becoming stunned), Weather Manipulation (Its presence
    causes blue fog and rain to appear), Resistance to Disease and Water and Thunder, possibly Darkness
    Manipulation (In its introductory cutscene, it appears to instantly turn day to complete darkness)'
  source_ids: *id003
  decisive: true
  status: unverified
