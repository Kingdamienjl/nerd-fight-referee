- id: claim-intelligence-fd838262
  section: power_scale
  axis: battle_iq
  text: 'At least Animalistic (seemingly understands gratitude as it gives a gesture of thanks to the
    Hunter for repelling the Qurio, capable of sophisticated fighting moves such as parrying and baiting
    attacks) Standard Tactics: *Malzeno is an agile but deceptively strong physical fighter. It smashes
    and flays its foes, occasionally calling upon its breath weapon or the Qurio to strike at range. *It
    will enter the Bloodening after absorbing enough life force from prey in the environment via Qurio
    or from its opponents using its jaws. While in its empowered state, it gains a crimson aura and is
    able to chain its attacks together more quickly. Its physical attacks in this state create Dragon
    Element explosions. Its speed is of particular note, even among its Elder Dragon peers, as it is now
    able to move so quickly as to apparently teleport from a hunter''s perspective. It has a habit of
    using its blistering speed to reposition itself behind its foes and immediately unleash a devastating
    attack at their backs. *Its Qurio-based attacks inflict Bloodblight on hunters, a unique status effect
    that dramatically reduces its victim''s ability to heal naturally and from outside sources such as
    Potions or Hunting Horn songs but also bestows victims with the ability to recover health by attacking.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-d25302f3
  section: weaknesses
  axis: weakness
  text: 'Fire and Dragon Element. It can be knocked out of the Bloodening if it takes sufficient damage.
    Notes: *Malzeno''s Monster Intro can be seen here. *It is currently unclear whether its life energy-draining
    powers are a result of the Qurio or a natural ability of the species, given that the Malzeno fought
    in Sunbreak did not have access to Qurio until another monster, Gaismagorm, released them in its territory.
    It is plausible that Malzeno can naturally drain life force and enter the Bloodening given that it
    can suck energy from monsters through its fangs, and therefore it is likely that the Qurio simply
    enhance its ability to do so.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-4bd59248
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Bodily Weaponry (Via its jaws, talons, hooked wings, and
    prehensile clawed tail), Rage Power (It grows stronger and faster when enraged), Sound Manipulation
    (Its roar can briefly stun hunters), Large Size (Type 1; By length, a typical specimen is around 23
    meters long), Flight (Its wings enable flight), Air Manipulation (It carries a powerful gust of wind
    while on the wing that it can use to disorient or stun its foes, even those as large as a Rathalos),
    Breath Attack and Energy Projection (It can fire beams of Dragon Element from its mouth at opponents
    and into the ground to cause waves of explosions, fling bolts of Dragon Element through the earth,
    or simply empower its physical attacks with Dragon Element), Animal Manipulation (It has a symbiotic
    relationship with the vampiric Qurio, able to cause them to move in dense swarms to strike or lure
    foes, and can absorb the life energy they collect), Explosion Manipulation (Its Dragon Element attacks
    and Qurio blasts create crimson explosions), Absorption (It can absorb life energy through its mouth
    and through swarms of Qurio to empower itself), Transformation and Empowerment (It can enter an empowered
    state known as the Bloodening after absorbing enough life energy; in this form, its aggression, power,
    and speed dramatically increase, and its physical attacks produce explosions of Dragon Element), Status
    Effect Inducement (Its Dragon Element attacks induce Dragonblight, and its tail and Qurio attacks
    induce Bloodblight on hunters), Statistics Reduction and Power Nullification (Dragonblight nullifies
    the victim's elemental and status attack properties, and Bloodblight greatly reduces the victim's
    ability to recover health from items), Disease Manipulation and Empathic Manipulation (It and the
    Qurio carry a virus that causes afflicted monsters to enter a hyper-aggressive state and humans to
    enter a dizzy, incapacitated state after a few days, and eventually death to both if left untreated),
    Resistance to Disease, Water, and Thunder as well as Disease Manipulation and Empathic Manipulation
    (the Qurio don't harm it), possibly Mind Manipulation and Madness Manipulation (Type 2; Dragon Element
    is said to attack the mind and drive monsters mad)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
