  intelligence:
    text: 'At least Animalistic (seemingly understands gratitude as it gives a gesture of thanks to the
      Hunter for repelling the Qurio, capable of sophisticated fighting moves such as parrying and baiting
      attacks) Standard Tactics: *Malzeno is an agile but deceptively strong physical fighter. It smashes
      and flays its foes, occasionally calling upon its breath weapon or the Qurio to strike at range.
      *It will enter the Bloodening after absorbing enough life force from prey in the environment via
      Qurio or from its opponents using its jaws. While in its empowered state, it gains a crimson aura
      and is able to chain its attacks together more quickly. Its physical attacks in this state create
      Dragon Element explosions. Its speed is of particular note, even among its Elder Dragon peers, as
      it is now able to move so quickly as to apparently teleport from a hunter''s perspective. It has
      a habit of using its blistering speed to reposition itself behind its foes and immediately unleash
      a devastating attack at their backs. *Its Qurio-based attacks inflict Bloodblight on hunters, a
      unique status effect that dramatically reduces its victim''s ability to heal naturally and from
      outside sources such as Potions or Hunting Horn songs but also bestows victims with the ability
      to recover health by attacking.'
    source_ids: *id002
    confidence: 0.95
