    Rise: Sunbreak) *Rage Power (It grows stronger and faster when enraged) *Breath
    Attack **Smoke Manipulation and Stamina Reduction (Can spray a mist to the surrounding
    area in a thick mist. Can breath out a gas that inflicts Fatigue, a status that
    completely drains staminaMonster Hunter Freedom Unite) **Poison Manipulation (Can
    spew out poison in the form of a projectiles or beam, can inflict a more powerful
    than normal poison called "Venom"Monster Hunter Rise: Sunbreak) **Acid Manipulation
    and Statistics Reduction (Can spit out acidic projectiles that inflict Defense
    DownMonster Hunter Freedom Unite) *Limited Air Manipulation (Slamming its tail
    on the ground can generate wind pressure that pushes back and stuns HuntersMonster
    Hunter Freedom Unite. Generates wind by flapping its wings to manipulate the poison
    clouds it creates, pushing them all toward the target or spreading them in all
    directionsMonster Hunter Rise: Sunbreak) Resistance to: *Water Manipulation (Resistant
    to Water-based attacks) *Disease Manipulation (Immune to the Frenzy virus) All
    previous abilities enhanced and: *Rage Power, Explosion Manipulation and Transformation
    (When their anger reaches its peak, they''ll enter into their Risen state with
    an explosion and their body will begin to glow) Resistance to: *Disease Manipulation,
    Corruption and Madness Manipulation (Type 1; Overcame the Qurio virus, a disease
    that drives Monsters mad in addition to making them more powerful, and obtained
    greater power)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
