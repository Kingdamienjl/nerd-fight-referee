  intelligence:
    text: 'At least Animalistic Standard Tactics: *Phase 1: It initiates combat by roaring and begins
      by using its bulky body and explosion-generating powers to crush its foes. In this phase, it possesses
      crystalline armor on its body that grant its physical attacks explosive properties. It also uses
      its enormous forearms to hurl boulders at distant opponents. Every few minutes, it will attempt
      to suck its foes into its mouth and engulf them in a powerful explosion. *Phase 2: If sufficiently
      injured, it sucks in a mass of Qurio to empower itself. It uses its explosion attacks more frequently
      and begins using its mouth suction to draw foes into its attacks. It can evoke a rain of explosive
      projectiles. Every few minutes, it calls down swarms of Qurio that cling to the walls of its chamber
      and climbs to feast on their energy. If it is not knocked down in this state, it releases a devastating
      explosion attack capable of one-shotting hunters. *Phase 3: When it is in grave danger, it rears
      up, roaring and setting itself ablaze. In this phase, it moves much more quickly, and additionally
      gains two new attacks: a crawling charge that leaves Blastblight-inflicting clouds that detonate
      after a delay, and a swift dash where it propels itself with jets of Qurio energy to slide across
      the arena into its foes and throwing explosions at a greater frequency than before. This is the
      most desperate and dangerous stage it enters before being killed.'
    source_ids: *id002
    confidence: 0.95
