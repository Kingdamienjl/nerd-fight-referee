- id: claim-weaknesses-eab55e10
  section: weaknesses
  axis: weakness
  text: 'Thunder and Dragon Element. Its own crystals can injure it if broken off and sucked into its
    mouth, and its bodily Qurio swarms can be targeted and detonated in certain moments to injure and
    knock it down. Notes: *Gaismagorm''s Monster Intro, which supplies its profile quote, can be seen
    here. *It is not technically stated to be an Elder Dragon in-game, but due to its abnormal powers
    and immunity to exhaustion, it is generally considered to be one.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-7884b8e3
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Bodily Weaponry & Additional Limbs(Via its sheer size, hexpartite\
    \ mouth, huge forearms, and thick hooked tail), Rage Power (It becomes stronger and faster when enraged\
    \ and when close to death), Sound Manipulation (Its roar can damage hunters and shatter stone), Large\
    \ Size (Type 1; it is typically around 40 meters long and 15 meters tall, but when fully stretched\
    \ out it reaches over 48 meters in length), Longevity (It has been stated to have lived since ancient\
    \ times), Earth Manipulation (Its rock-like forearms are stated to allow it to burrow through the\
    \ earth), Crystal Manipulation (Its body is partially coated in crystalized Qurio that can explode\
    \ when removed), Animal Manipulation (It is the host for innumerable vampiric Qurio that it can command\
    \ to flood ecosystems or recall to itself; Qurio drain the life from animals, even capable of killing\
    \ a creature as large as an Anjanath), Disease Manipulation and Empathic Manipulation (The Qurio carry\
    \ a virus that causes afflicted monsters to enter a hyper-aggressive state and humans to become incapacitated\
    \ after a few days, and eventually causes death to both), Absorption (It can absorb life energy gathered\
    \ by the Qurio to which it plays host, increasing its power), Air Manipulation (It can suck huge volumes\
    \ of air into its mouth to pull distant foes closer to it), Explosion Manipulation (Its Qurio breath\
    \ attacks and later-on Qurio-charged strikes create explosions, and Blastblight causes the victim\
    \ to explode if not shaken off), Status Effect Inducement (Its flame orbs induce Blastblight), Resistance\
    \ to Disease, Water, and Ice as well as Disease Manipulation and Empathic Manipulation (the Qurio\
    \ don't harm it), possibly Regeneration (Mid-Low; showed no visible damage after being impaled by\
    \ an exploding dragonator), possibly Fire Manipulation (It doesn\u2019t use Fire Element, but many\
    \ of its attacks resemble fire and it manifests a pair of fiery wings when performing its ultimate\
    \ attack)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
