- id: claim-powers-and-abilities-faefc492
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Bodily Weaponry (Conventional; Jaws,
    tail and its wings, said wings are extremely flexible and can extend in a spear-like
    formation for thrusting attacks, fold into a blade-like structure for swings and
    adopt an open-palm shape to swat down a target or use them like cannons) **Enhanced
    Senses (Enhanced Vision; Can spot prey from a high altitude) **Large Size (Type
    0) **Winged Flight (Flies at high speed by taking in air using its chest vent,
    before combining it with Dragon Element energy and expelling it from its wings
    as rocket-like propellant) *Rage Power (It grows stronger and faster when enraged)
    *Sound Manipulation (Their powerful and loud roars can blow back airborne Hunters
    and stun them) *Energy Projection (Can fire blast of Dragonic energy from its
    exhaust-like wingtips and imbue its physical strikes with the energy) **Power
    Nullification (Can inflict Dragonblight, those afflicted with this ailment have
    the Elemental and Status Effect properties of their attacks nullified) **Aura
    (While enraged, it will begin venting excessive amounts of its exhaust from its
    wings, head, and chest, losing its elemental weakness in this state) Resistance
    to: *Disease Manipulation (Immune to the Frenzy Virus) All previous abilities
    enhanced All previous abilities enhanced and: *Rage Power, Explosion Manipulation
    and Transformation (When their anger reaches its peak, they''ll enter into their
    Risen state with an explosion and their body will begin to glow) Resistance to:
    *Disease Manipulation, Corruption and Madness Manipulation (Type 1; Overcame the
    Qurio virus, a disease that drives Monsters mad in addition to making them more
    powerful, and obtained greater power)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
