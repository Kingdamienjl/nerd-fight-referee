    Attack (With Magic Missile), Danmaku (With Thousand Daggers), Telekinesis (With Summon Warlock), Water
    Manipulation and Weather Manipulation (With the Hydro Typhoon), Forcefield Creation (With Shield),
    Energy Manipulation (With the Spirit Fist), Enhanced Senses (Night Vision, with the Night Goggles),
    Statistics Amplification and Supernatural Luck (With Dracula''s body parts), Attack Reflection (Dracula''s
    ribs can passively reflect attacks backCastlevania II Simon''s Quest), Has access to the abilities
    of Chaos through the Chaos Ring Standard Belmont Resistances, Resistance to Air Manipulation (With
    the Wind Cloak), Electricity Manipulation (With the Lightning Robe), Ice Manipulation (With the Blizzard
