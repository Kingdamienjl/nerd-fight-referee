- id: claim-standard-equipment-ce8727eb
  section: equipment
  axis: equipment
  text: 'center|350px The Vampire Killer is the legendary Heirloom Whip of the Belmont Clan, which has
    been wielded by several heroes throughout the centuries in their quests to stop the Dark Lord Dracula.
    The Vampire Killer is intrinsically connected to the Belmont Bloodline, and only a member of their
    clan can wield it. If one who isn''t a Belmont attempts to wield it, the whip will simply slowly drain
    their life away. Long ago, it was known simply as the Whip of Alchemy, and was a much weaker magical
    weapon developed by the alchemist Rinaldo Gandolfi. The Whip was transformed into its current state
    with the sacrifice of Sara Trantoul, betrothed of Leon Belmont. Sara had been cursed with vampirism,
    though her heart was still pure. Through a ritual, her soul was infused within the whip, allowing
    the weapon to awaken to its true potential. Empowered by a soul both tainted and pure, the Vampire
    Killer is simultaneously a Holy and Vampiric Weapon, and its power is lethal to all demonic entities.
    The Vampire Killer is able to nullify or reflect Magic and projectiles with its touch alone, it also
    weakened Dracula''s powers so much that he was unable to resurrect himself or use his powers to escape
    for several years. Different colored books that Juste can use to perform Spell Fusions * Fire Book:
    A Red book that allows Juste to perform fire-based Spell Fusions * Ice Book: A blue book that allows
    Juste to perform ice-based Spell Fusions * Bolt Book: A yellow book that allows Juste to perform electricity-based
    Spell Fusions * Wind Book: A green book that allows Juste to perform Item Crashes * Summoning Tome:
    A black book that allows Juste to perform Summons Juste Knife.gif|Knife Juste Cross.gif|Cross Juste
    Axe.gif|Axe Juste Holy Water.gif|Holy Water Juste Holy Book.gif|Holy Book Juste Sacred Fist.gif|Sacred
    Fist * Dagger: Sharp knives that the user can throw at high speeds * Cross: A cross-shaped weapon
    that comes back to its user after being thrown * Axe: A giant single-head axe that can be thrown in
    an arc * Holy Water: A special canteen that when broken, will burst into holy flames that can move
    forward * Holy Book: A Bible that spirals away, damaging anything that touches it * Sacred Fist: A
    sub-weapon exclusive to Juste. Allows the user to unleash long-ranged, rapid-fire punches that look
    like energy blasts * Sylph Feather: A relic that allows Juste to jump mid-air * Griffin''s Wing: A
    relic that allows Juste to perform a high-jump * Crush Boots: Wearable boots that can let Juste do
    an upward-kick after doing a high-jump. Used to break golden colored ceilings. * Chaos Ring: A special
    ring that increases the power of Holy Water by making the holy flames hop forward and then stay in
    place. * Nova Ring: A special ring that increases the power of the Cross weapon by extending its reach
    * Logoth''s Ring: A special ring that increases the power of the Dagger weapon by allowing the wearer
    to throw three daggers at the same time. * Heaven''s Ring: A special ring that increases the power
    of the Axe weapon by making it bigger and slower, making continuous contact damage very easy to do.
    * Aurora Ring: A special ring that increases the power of the Sacred Fist by increasing its range
    * Earth Ring: A special ring that increases the power of the Holy Book weapon by making it circle
    around the user wildly * Night Goggles: An accessory that allows the wearer to see in the dark to
    a certain degree * Whip Upgrades: Can be equipped to the Vampire killer to give it different properties
    and increase its attack (most of them) ** Red Stone: Gives fire properties to the whip. Increases
    The Vampire Killer''s attack by 2. ** Blue Stone: Gives ice properties to the whip. Increases The
    Vampire Killer''s attack by 2. ** Yellow Stone: Gives electric properties to the whip. Increases The
    Vampire Killer''s attack by 2. ** Green Stone: Gives wind properties to the whip. Increases The Vampire
    Killer''s attack by 2. ** Energy Circle: Makes the user to automatically spin the whip like a windmill.
    Increases The Vampire Killer''s attack by 5. ** Crushing Stone: When equipped, the user can do a chargeable
    giant, energy whip strike. Decreases The Vampire Killer''s attack by 5. ** Steel Tip: Adds a steel
    ball to the tip of the whip. Increases The Vampire Killer''s attack by 10. ** Platinum Tip: Adds a
    platinum ball to the tip of the whip. Increases The Vampire Killer''s attack by 20. ** Bullet Tip:
    When at full health. Makes the whip shoot out a fireball for each swing. Increases The Vampire Killer''s
    attack by 5. * Eye of Vlad: A part of Dracula''s remains that makes Juste immune to curses. * Heart
    of Vlad: A part of Dracula''s remains that makes Juste immune to petrification. * Rib of Vlad: A part
    of Dracula''s remains that makes Juste immune to poison. * Nail of Vlad: A part of Dracula''s remains
    that increases Juste''s strength by 10. * Vlad''s Ring: One of Dracula''s possessions that increases
    Juste''s Luck by 10.'
