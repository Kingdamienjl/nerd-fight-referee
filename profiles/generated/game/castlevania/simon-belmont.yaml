- id: claim-weaknesses-ba21c45a
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Fireball: Channeling his magical
    energies through the Vampire Killer, Simon can cause it to shoot a fireball as
    he whips at his enemy''s direction. *Binding Whip: Simon whips his enemy, binding
    them in place and then pulling them towards him. *Rising Whip: Simon charges his
    whip with his magical power and unleashes it with a vertical sing, sending his
    opponent flying upwards. *Holy Ruin: Simon energizes his fist with magical power
    and unleashes a devastating punch. *Twisting Arrow: Simon leaps up into the air
    and subsequently performs a torpedo dive towards his foe. *Dancing Whip: Simon
    rapidly spins and tosses his whip around him. It doesn''t do much damage but can
    annoy his adversaries. *Whip Tornado: Simon charges his whip with magical energy
    and unleashes it as a whirlwind, swinging his whip in a 360-degree spin, damaging
    all surrounding enemies. *Sudden Impact: Simon quickly energizes his whip as he
    performs a spinning swing, slamming the whip on the ground and piercing enemy
    defenses with a rush release of magical power. *Vampire Killer (Simon Version):
    Simon''s finishing move. Simon focuses all of his magical power around himself,
    and dashes towards his foe at enhanced speed. Simon then whips his foe vertically
    five times, both him and his opponent ascending to the air. Finally, he charges
    his Vampire Killer with even more power and releases an incredibly fast array
    of attacks, totaling 99 whip swings. ==Gallery== {{Scroll box|content= Original
    Simon.webp|Simon in the original Castlevania ClassicSimon.png Simon_Belmont_Render.png|Simon
    in Castlevania Chronicles Simon belmont cover.jpg Simon_belmont_judgement.png|Simon
    in Judgement CastlevaniaChroniclesCover.jpg super smash bros ultimate simon render.png|Simon
    Belmont in Super Smash Bros Ultimate. Castlevania (NES)- Vampire Killer (Extended)|Vampire
    Killer in Castlevania Castlevania III Music (NES) - Deja Vu (Vampire Killer)|Vampire
    Killer in Dracula''s Curse Akumajou Dracula X68000 (castlevania chronicles) vampire
    killer EXTENDED|Vampire Killer in the Famicom version of Dracula''s Curse Castlevania
    III- Dracula''s Curse - Déjà Vu (Vampire Killer) ~ VRC6 chip version -EXTENDED-
    Music|Vampire Killer in Akumajou Dracula Super Castlevania IV OST- Stage B Vampire
    Killer (B-1)|Vampire Killer in Super Castlevania IV Vampire Killer - Castlevania-
    Dracula X Music Extended|Vampire Killer in Dracula X Vampire Killer (Bloodlines
    Version)|Vampire Killer in Bloodlines Castlevania Rondo of Blood Music - Vampire
    Killer (Stage 2b)|Vampire Killer in Rondo of Blood Castlevania Dracula X Chronicles
    Music- Vampire Killer|Vampire Killer in Dracula X Chronicles Castlevania Chronicles
    - Vampire Killer (Soundtrack)|Vampire Killer in Chronicles Vampire Killer (Symphony
    Of The Night Version) Extended|Vampire Killer in Symphony of the Night Castlevania-
