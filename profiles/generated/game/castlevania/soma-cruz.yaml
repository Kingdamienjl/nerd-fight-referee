      little humans will die off soon enough. Your turn came a little earlier, that''s
      all. Hahahahaha.|Soma to Celia.}} ==Summary== Soma Cruz is the protagonist from
      the games Castlevania: Aria of Sorrow and Castlevania: Dawn of Sorrow. He also
      appears in the cross-over game Castlevania: Harmony of Despair. Soma was a student
      who migrated into Japan for his studies until he and his close friend, Mina,
      were transported into Dracula’s castle after an solar eclipse occurred. Upon
      finding an exit, he realized he’s inherited the power of dominance due to being
      an incarnation of Dracula and destroyed the source of his dark power, Chaos,
      in hopes of preventing himself from becoming the next dark lord. One year later,
      however, it turns out that he still inherits these powers after being attacked
      by a priestess named Celia, who plans to revive the dark lord by killing Soma
      and finding candidates. Soma treads in Celia''s castle in order to prevent her
      from succeeding. Soma has the ability to copy the powers and abilities of the
      monsters by absorbing their souls upon their defeat. He’s also skilled in using
      a vast array of weapons. ==Powers and Stats'
