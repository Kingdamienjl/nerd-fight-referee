- id: claim-weaknesses-3a3daa62
  section: weaknesses
  axis: weakness
  text: 'None notable. Notable Attacks/Techniques: *Power of Dominance: The Power
    of Dominance is the primary ability of the Dark Lord. Soma inherited this power
    from Dracula, as he is the reincarnation of the count and thus has his soul. Through
    it, Soma can absorb the Souls of his enemies and can gain absolute control over
    his respective demonic souls. After absorbing a Soul, Soma gains the powers, resistances,
    control over the soul and can likely erase them from existence akin to Dracula.
    This power also grants Soma incredible control over souls as he was able to passively
    absorb them from Celia''s castle when witnessing Mina''s death and absorb the
    countless souls of the Abyss after defeating Menace. When submitting to Chaos
    and turning to his dark side, Soma is reborn as Dracula once again and has complete
    control over demons and the countless souls of the Abyss. *Magical Sea'
  source_ids: *id003
  decisive: false
