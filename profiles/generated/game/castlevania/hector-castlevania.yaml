    (With Homing Eye and Homing), Soul Manipulation and Energy Manipulation (With the Grand Wave and Glow
    Soul), Immortality (Type 7, one of them is a corpse), Sound Manipulation (With Ultra Scream), Technology
    Manipulation (With Satellite B), Temperature Manipulation (With Magma Mode), Shapeshifting (With the
    Mercury Sphere) Bird ID Types have Flight (As shown here), Bone Manipulation (With Bone Shot), Immortality
    (Unknown Type, Phoenix is stated to be Immortal), Self-Destruction (With Big Bang) Mage ID Types have
    Time Manipulation (With Time Stop), Ice Manipulation (As shown here), Holy Manipulation (With Purify
    and Demonic Disaster), Instinctive Reaction (With Synchron Saucer B), Life Manipulation (With Agnea),
    Statistics Amplification (Can raise Hector''s stats with Tension Boost), Forcefield Creation (With
