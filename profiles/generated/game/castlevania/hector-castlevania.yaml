    official strategy guide page 147), Extrasensory Perception (Can sense energy and via the Sixth Sense
    BroochCastlevania: Curse of Darkness Bradygames official strategy guide page 50), Curse Manipulation
    (Can manipulate Dracula''s Curse to an extent), Durability Negation via Ice Manipulation (As shown
    here), Fusionism (Can fuse himself with inanimate objects), Energy Manipulation (As shown here, can
    also conceal his own powersCastlevania Curse of Darkness Manga Chapter 1), Limited Air Manipulation
    (As a byproduct of his sword strikes), Weapon Creation (Can create spikes from the ground and summon
    Scythes with Death''s Scythe), Homing Attack (As shown here), Resurrection (With Death Doll), Reactive
    Power Level (With Megingelos), Damage Transferal (With the Sacrifice Brooch), Awakened Power (With
    the GaltiteCastlevania: Curse of Darkness Bradygames official strategy guide page 142), Enhanced Immortality,
    Resurrection and Regeneration Negation (Low-High Types 2, 3, 4, 6, and 7. Is capable of killing the
    Creatures of Chaos, which can survive lethal blows easily,Castlevania: The Belmont Legacy Issue 3
    possess other objects to exist, and are largely undead, with some of them being souls and evil spirits,Castlevania:
    Lament of Innocence) Dark Lord resistances (4-D - Baseline), Absolute Zero (With the Absolute Zero
    RingCastlevania: Curse of Darkness Bradygames official strategy guide page 132-134), Fire Manipulation
    (With the Boiling Ring), Curse Manipulation (Resisted Dracula''s Curse), Death Manipulation (Can use
    Death''s Scythe), Earth Manipulation (With the Earth Ring), Light Manipulation (With the Light Ring),
    Petrification (With the Medusa Ring), Poison Manipulation (With the Purity Ring), Electricity Manipulation
    (With the Storm Ring), Paralysis Inducement (With the Stun Resist Ring), Air Manipulation (With the
    Wind Ring), Darkness Manipulation (With the Void Ring), Absorption (With the Evil CoreCastlevania:
    Curse of Darkness Bradygames official strategy guide page 148) and Attack Reflection (Can harm Dracula
    with projectiles despite him being able to passively reflect attacks back with his ribsCastlevania
    II Simon''s Quest) Creatures of Chaos (4-D - Baseline) Fairy ID type has Healing and Purification
    (Type 3, with Healing Field), Enhanced Senses (Can see in any type of light, dark or bright), Poison
    Manipulation (Via Poison Powder), Explosion Manipulation (Via Skull Bomb), Invulnerability (With Invincible
    Vase), Absorption (With Healing Drop and Deadly Absorb), Sleep Manipulation (As shown here) Battle
    ID types has Inorganic Physiology (Type 1, has parts of the body made by magma or silver), Forcefield
