- id: claim-standard-equipment-d5064698
  section: equipment
  axis: equipment
  text: "File:Lament of Innocence Vampire Killer.webp|The Vampire Killer Richter Knife.gif|Knife Richter\
    \ Axe.gif|Axe Richter Cross.gif|Cross Richter Holy Water.gif|Holy Water Richter Bible.gif|Bible Richter\
    \ Stopwatch.gif|Stopwatch Richter Rebound Stone.gif|Rebound Stone Richter Agunea.gif|Agunea Richter\
    \ Vibhuti.gif|Vibhuti *The Vampire Killer: The legendary Belmont Clan's Heirloom Whip, wielded by\
    \ several heroes over the ages in their quests to stop the Dark Lord Dracula. The Vampire Killer is\
    \ closely linked to the Belmont lineage, and only the member of the clan may wield it. If someone\
    \ who isn't a Belmont tries to use it, the whip will slowly drain their life. It was formerly known\
    \ as the Whip of Alchemy, a considerably weaker magical weapon created by the alchemist Rinaldo Gandolfi.\
    \ The whip was changed into its present form by the sacrifice of Sara Trantoul, Leon Belmont's fianc\xE9\
    e. Sara had been afflicted with vampirism, but her heart was still pure. Her spirit was merged inside\
    \ the whip through a ceremony, enabling the weapon to awaken to its full power. The Vampire Killer\
    \ is a Holy and Vampiric Weapon, empowered by a soul that is both tainted and pure. It is capable\
    \ of destroying all evils. Moreover, Vampire Killer can also nullify or reflect magic and projectiles\
    \ with its mere touch. It also weakened Dracula's powers so much that he could not resurrect himself\
    \ or use his powers to escape for several years. *Sub"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
