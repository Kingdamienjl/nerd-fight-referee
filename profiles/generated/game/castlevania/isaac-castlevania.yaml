- id: claim-standard-equipment-f21c1bcc
  section: equipment
  axis: equipment
  text: '*The Laser Blade: Shrouded in mystery and with varying reports of its weight and length, many
    say it does not even exist. When sheathed, the sword has no blade; the blade''s energy beam only appears
    when it is swung. The blade is semi-flexible and glows with a purple aura, making it resemble a whip
    *Innocent Devil: The creatures that can only be created by a Devil Forgemaster like Isaac. He has
    various type of his devils to use in a fight. *Fairy-Type: The small creatures in shape of a fairy.
    They are relatively weak but have useful abilities to support Isaac such as healing, poison powder,
    lullaby and invisible magic. **Battle-Type: There are several different shapes of this type, such
    as the golem, skullknight, samurai-like, liquid golem, etc. they''re useful to fight in combat. **Bird-Type:
    The flying creatures in shape of birds or dragons. The Bird-Type is stronger than the Fairy-Type but
    weaker than the Devil-Type or Battle-Type. It''s very agile, giving it an advantage over ground enemies.
    They can easily defeat light enemies by juggling them but suffer against armored or heavy enemies.
    **Mage-Type: The wizard-like Innocent Devils. They are the only true magic-users of the Innocent Devils
    by casting elemental magic and time stop. **Devil-Type: The winged-devil. They''re considered a balance
    between the Battle-Type and the Bird-Type, as they can fly and perform Chain-Attacks with Isaac. They
    can use the Magic Circle ability to allow Isaac to hidden in Magic Circle. As they advance, they can
    cause spikes, blades and powerful explosions to issue from the Magic Circle. **Pumpkin-Type: The small
    devils with Jack O''Lantern head. they are among the weakest with the fairies will be completely vulnerable
    while performing one. However, they give a large boost to all stats, making Isaac very strong.'
