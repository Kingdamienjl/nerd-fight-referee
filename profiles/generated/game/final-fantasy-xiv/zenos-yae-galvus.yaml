- id: claim-weaknesses-6a266ad5
  section: weaknesses
  axis: weakness
  text: 'Extremely overconfident, arrogant, and obsessed with hunting powerful opponents.
    Views enemies and allies with equal contempt, not afraid to kill them the moment
    he thinks them as inconvenient or annoying. Holds back against inferior foes until
    they bore him, though will still try to kill them. Notable Attacks/Techniques:
    *Art of the Storm: Large AoE centered around Zenos. Deals lightning damage and
    applies Paralysis. *Art of the Swell: Knocks opponents back. *Art of the Sword:
    Targets all foes with a line AoE. They deal heavy damage so two AoE''s overlapping
    can easily kill. *Wall: Creates a pulsing red and black wall around the area.
    Touching it will apply a temporary Bleed DoT and a 15 second Damage Down debuff.
    *Unmoving Troika: Multi-hit tankbuster. *Vein Splitter: Large AoE centered on
    Zenos. Immediately after, creates four clones around the arena will also cast
    this ability. *Lightless Spark: Faces a target for a very long and wide conal
    AoE. *Lightless Flame: Summons several black flames around the area that explode.
    *Concentrativity: Group-wide AoE damage that covers the entire stage. Has shown
    to knockback and stun. *Swords: Zenos goes invulnerable and throw out his three
    swords to the edges of the arena. Whenever the swords begin to glow, a shadow
    Zenos will appear and use their abilities right after. Usually uses two at once.
    During this time, the Aether Transfer gauge will charge. **Ame-no-Habakiri: uses
    Art of the Sword. **The Swell: uses Art of the Swell. **The Storm: uses Art of
    the Sword. *Storm, Swell, Sword: Deals damage based on how full the Aether Transfer
    gauge is. If it reaches 100%, it is an instant kill. ==Gallery== FFXIV_Zenos_Resonant.png|Zenos''
    Eyes of Resonance FFXIV_Zenos_Shinryu.png|Zenos merging with Shinryu FFXIV_Zenos_Ala_Mhigan_Body.png|Zenos
    possessing the body of an Elezen from the Ala Mhigan Resistance ==Notable Matchups==
    Victories: Losses: Inconclusive: {{discussions}} Category:Characters Category:Final
    Fantasy Category:Final Fantasy XIV Category:Air Users Category:Antagonists Category:Blood
    Users Category:Damage Boost Users Category:Danmaku Users Category:Darkness Users
