- id: claim-powers-and-abilities-802d9cce
  section: abilities
  axis: hax
  text: 'Base= Superhuman Physical Characteristics, Magic, Non-Physical Interaction (Able to kill the
    lingering Ghosts in the Cavern of the Stolen Fayth and the Wraiths found Inside Sin), Immortality
    (Types 1, 3 and 7), Regeneration (Low-Godly. As an unsent, Auron can reform his body from non-physical
    pyreflies as long as his spirit is not sent to the Farplane), Statistics Reduction (Via Break abilities),
    Damage Reduction (Via Sentinel), Fear Manipulation (Via Threaten), Necromancy and Transmutation (Via
    Zombie Attack), Death Manipulation (Via Death and Shin-Zantetsu), BFR (Via Shooting Star), Air Manipulation
    (Via Tornado), Statistics Amplification (Via Cheer, Aim, Focus, Reflex, Protect and Shell), Time Manipulation
    (Can accelerate himself or slow down enemies in time with Hastega and Slowga), Healing, Damage Negation
    (Via NulBlaze, NulShock, NulTide and NulFrost), Purification (Type 3 via Esuna and various items),
    Resurrection (Via Life, Full-Life and Auto-Life), Attack Reflection (Via Reflect), Holy Manipulation,
    Fire Manipulation, Ice Manipulation, Electricity Manipulation, Water Manipulation, Poison Manipulation
    (Via Bio), Gravity Manipulation (Via Demi), Energy Projection (Via Flare), Radiation Manipulation,
    Information Analysis (Via Scan and Sensor), Probability Manipulation (Via Jinx and Luck), Social Influencing
    (Can bribe mindless monsters to leave battle), Power Mimicry (Via Copycat), Durability Negation (Via
    Piercing and Demi), Enhanced Senses and Stealth Mastery (Via Initiative), Curse Manipulation and Death
    Manipulation (Via Candles of Life), Resistance to Fire Manipulation, Ice Manipulation, Electricity
    Manipulation, Water Manipulation, Darkness Manipulation, Power Nullification, Sleep Manipulation,
    Poison Manipulation, Petrification, Death Manipulation, Necromancy, Transmutation, Time Manipulation
    (In the form of Time Slow and Stop), Mind Manipulation, Empathic Manipulation, Radiation Manipulation,
    Absolute Zero (Can withstand Shiva''s presence and attacks), Curse Manipulation, and Memory Manipulation
    (Can challenge Sin head-on without being impeded by its toxin) |-|Dissidia= {{#tag:tabber| {{!}}-{{!}}Abilites=
    All previous abilities enhanced, possibly Immortality (Type 8,reliant on her Crystal which let Cosmos''s
    group return from fading from existence after Cosmos'' death) & Regeneration (Low-Godly), Summoning
    (Can summon various Eidolons from Summonstones and the World of Illusions), Willpower Manipulation
    (a person''s will is power there and enables them to do a multitude of things the stronger their willDissidia
    Final Fantasy Opera Omnia), Reactive Power Level (the greater someone''s will, the greater their powerDissidia
    Final Fantasy Opera Omnia), Law Manipulation (Beings with strong wills can overwrite the laws of the
    world and bend them to their willDissidia Final Fantasy Opera Omnia), Creation (With a powerful enough
    will, once can create various things such as phone lines, airships and even entire countries and worldsDissidia
    Final Fantasy Opera Omnia), Sealing (Can seal off large areas and people with her will, such as Cecil
    sealing himself in Castle Baron or the cast sealing Kefka inside a TorsionDissidia Final Fantasy Opera
    Omnia), Dimensional Travel (Characters can open Torsions, rifts in space-time to travel various dimensionsDissidia
    Final Fantasy Opera Omnia), and Immortality (Type 2) (Due to the crystal core of darkness''s influence
    in the hands of Ardyn, warriors will not die no matter how injured they are) {{!}}-{{!}}Resistances=
    Resistance to Mind Manipulation, Soul Manipulation (Via Zalera, the Death Serpah, who was going to
    absorb the souls of every living being on the planet), Corruption & Body Puppetry (Due to their light,
    Warriors of Materia can dispel attempts to control them), Empathic Manipulation, and Madness Manipulation
    (Type 3; Resistant to the effects of the True Moon, which is capable of affecting the hearts and minds
    of all living beings on the planetFinal Fantasy IV: The After Years), Gravity Manipulation (Unaffected
    by the gravitational pull of the True Moon, which even the Lunar Whale couldn''t escape from), Spatial
    Manipulation, Deconstruction, and BFR (Can withstand the attacks of Atomos, who manipulates space,
    crush enemies down to a molecular level,Dissidia Final Fantasy and can warp them into another dimension),
    Extreme Cold and Cosmic Radiations (Can fight and survive on the moon), Absolute Zero (Can survive
    Shiva''s ice attacks, including Diamond Dust), {{!}}-{{!}}With Eidolons= Hellfire Manipulation (Via
    Ifrit, Phoenix, Rubicante, and Marilith), Ice Manipulation and Absolute Zero and Duplication (Via
    Shiva who''s Ice and aura are stated to reach Absolute Zero including her Diamond Dust, Shiva can
    duplicate herselfDissidia Final Fantasy NT), Water Manipulation (via Kraken, Cagnazzo, and Leviathan),
    Necromancy (Via Lich), Spatial Manipulation, Deconstruction, and BFR (via Atomos, who manipulates
    space, crush enemies down to a molecular level,Dissidia Final Fantasy'
