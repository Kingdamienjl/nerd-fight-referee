  section: equipment
  axis: equipment
  text: "\u25AA Blade: Auron's initial weapon, a generic sword that he uses to fight off enemies. \u25AA\
    \ Masamune: Auron's Celestial Weapon, which he obtains after bringing a Rusty Sword to a statue of\
    \ Lord Mi'ihen on the Mushroom Rock Road. It naturally ignores enemy defense, harming them regardless\
    \ of attempts to increase their durability, and allows Auron to instinctually counter attacks. Additionally,\
    \ his attacks become more powerful depending on how injured he is."
