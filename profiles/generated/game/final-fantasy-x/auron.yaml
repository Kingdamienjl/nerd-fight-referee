- id: claim-weaknesses-e86f6d8a
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques: |-|Innate= \u25AA Power Break: Auron strikes his enemy,\
    \ halving their physical power. \u25AA Magic Break: Auron strikes his enemy, halving their magic power.\
    \ \u25AA Armor Break: Auron strikes his enemy, halving their defense and shattering their armored\
    \ defense. \u25AA Mental Break: Auron strikes his enemy, halving their magic defense. \u25AA Full\
    \ Break\" Auron strikes his enemy, inflicting Power, Magic, Armor and Mental Break at once. \u25AA\
    \ Guard: Auron defends an ally from damage, taking the attack for them instead. \u25AA Sentinel: Auron\
    \ enters a defensive stance, decreasing the damage he receives from attacks. \u25AA Threaten: Auron\
    \ immobilizes his enemy with fear after threatening them. \u25AA Entrust: Auron grants one of his\
    \ allies the ability to quickly access their Overdrive, at the cost of his own Overdrive gauge. \u25AA\
    \ Zombie"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
