- id: claim-weaknesses-1b10c0b1
  section: weaknesses
  axis: weakness
  text: 'Base Seymour (Poison, Magic Break) Notable Attacks/Techniques: ▪ Curaga:
    Seymour significantly heals himself or one of his allies. ▪ Scan: Seymour analyzes
    his target''s vital statistics, determining their strength, elemental weaknesses,
    and ways to defeat them. ▪ Shell: Seymour enhances an ally''s magic defense, halving
    the damage of all spells directed at them. However, this is also inclusive of
    any healing spells. ▪ Protect: Seymour enhances an ally''s physical defense, halving
    any damage they receive from physical attacks. ▪ Reflect: Seymour creates a barrier
    around himself that automatically reflects any spell back at his enemy. ▪ Dispel:
    Seymour removes any sort of buffs his enemy has that would increase their power.
    ▪ Absorb: Seymour siphons part of his enemy''s vitality to heal himself. ▪ Black
    Sky: Seymour summons ten meteors from the sky to bombard his enemies with non-elemental
    damage. ▪ Confusion: Seymour distorts his enemy''s mind, making them attack their
    allies and themselves. ▪ Demi: Seymour creates a condensed sphere of gravity that
    crushes enemies under its weight. ▪ Drain'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
