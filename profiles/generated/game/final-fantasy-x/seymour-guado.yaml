    by it''s toxin), Radiation Manipulation, and Absolute Zero (Can withstand Shiva''s
    presence and attacks). |-|Dissidia= {{#tag:tabber| Abilites=All previous abilities
    enhanced, Summoning (Can summon various Eidolons from Summonstones and the World
    of Illusions), Willpower Manipulation (a person''s will is power there and enables
