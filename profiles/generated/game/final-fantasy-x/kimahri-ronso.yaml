  section: equipment
  axis: equipment
  text: '▪ Spear: Kimahri''s initial weapon, a generic spear that he uses in combat.
    ▪ Spirit Lance: Kimahri''s Celestial Weapon, obtained in the Thunder Plains after
    communing with the Qactuar stones. It naturally ignores enemy defense, harming
    them regardless of attempts to increase their durability, and allows Kimahri to
    instinctually evade and counter attacks.'
