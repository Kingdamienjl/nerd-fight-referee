- id: claim-weaknesses-57780f35
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: |-|Innate= ▪ Lancet: Kimahri absorbs
    energy from his enemy to heal himself and restore his magic reserves. This also
    allows him to learn their abilities. ▪ Scan: Kimahri analyzes his target''s vital
    statistics, determining their strength, elemental weaknesses, and ways to defeat
    them. ▪ Jinx: Kimahri lowers all of his enemies'' "luck", decreasing their chance
    of hitting him with their attacks. ▪ Ultima: The ultimate Black Magic, Kimahri
    blasts his foes with an incredible amount of arcane energy, exceeding all other
    spells in his arsenal in terms of raw power. ▪ Ronso Rage: Kimahri''s Overdrive,
    a collection of abilities that he obtained from fiends across Spira. As a Ronso,
    his Lancet allows him to learn enemy abilities and use them to their full potential.
    * Jump: Available at the start of the game. Kimahri leaps into the air and performs
    a downward thrust onto his target. * Seed Cannon: Learned from the Ragora in the
    Kilika Woods. Kimahri fires multiple seeds from his mouth to pelt an enemy. *
    Self-Destruct: Learned from the Bombs on Mi''ihen Highroad. Kimahri charges into
    one enemy in a kamikaze attack, sacrificing himself in a powerful explosion. *
    Fire Breath: Learned from the Dual Horn at Mi''ihen Highroad. Kimahri exhales
    a torrent of powerful fire onto all enemies. * Stone Breath: Learned from the
    Basilisks on the Djose Highroad. Kimahri exhales, and anything caught in the range
    of his breath is petrified. * Aqua Breath: Learned from the Chimeras in the Macalania
    Woods. Kimahri exhales a large torrent of water to overwhelm his enemies. * Thrust
    Kick: Learned from the YKT-63 at Bevelle. Kimahri dashes forward and kicks his
    enemy, punting them out of the battle. * Bad Breath: Learned from the Malboros
    in the Calm Lands. Kimahri exhales, unleashing a putrid breath that poisons enemies,
    puts them to sleep, blinds them, nullifies their ability to use magic, distorts
    their mind to make them attack their allies or themselves, and sends them into
    a mindless berserk rage. * Doom: Learned from Biran Ronso or the Ghosts in the
    Cavern of the Stolen Fayth. Kimahri summons a spectral figure who places a curse
    on the enemy and creating a timer above their head. Once the timer reaches zero,
    they will instantly die. Much like Death, this works on robotic enemies and ghosts
    even on Ye Yevon, and even enemies who resist instant death can still be killed,
    though the timer is considerably longer as a penalty. * White Wind: Learned from
    Yenke Ronso or the Dark Flan at Mt. Gagazet. Kimahri significantly heals himself
    and all of his allies. * Mighty Guard: Learned from Biran Ronso or the Behemoths
    at Mt. Gagazet. Kimahri bestows Protect, Shell and NulAll to his party, increasing
    their physical and magic defense, and allowing them to nullify damage from fire,
    lightning, water and ice damage once. * Nova: Learned from the Omega Weapon at
    the very end of the Omega Ruins. Kimahri encloses his enemies in a spatially distorted
    sphere, transforming it to resemble a star in the heart of a galaxy, before detonating
    it and dealing immense damage. |-|Inherited= Contrary to popular belief, the party
    members are not limited to their sections of the Sphere Grid and are capable of
    branching into the sections of other characters. Key Spheres, which are strictly
    used for this purpose, are canonically given out at certain points in the story,
    and character-exclusive abilities like Lulu''s Black Magic and Kimahri''s Lancet
    are discussed as if they are common abilities and not completely restricted to
    the characters in question. As a result, the party is entirely capable of using
    each others'' abilities, as long as they are part of the Sphere Grid. Tidus''
    Sphere Grid: ▪ Cheer: Kimahri enhances his party''s attack power and durability.
    ▪ Hastega: Kimahri accelerates time for his party, dramatically increasing their
    speed. ▪ Slowga: Kimahri distorts time around his enemies, dramatically decreasing
    their speed. ▪ Delay Buster: Kimahri strikes his enemy with an incredibly powerful
    blow, significantly increasing the time they need to take their next action. ▪
    Provoke: Kimahri taunts an enemy, encouraging them to attack him over his allies.
    Yuna''s Sphere Grid: ▪ Curaga: Kimahri significantly heals himself or one of his
    allies. ▪ NulBlaze: Kimahri nullifies all fire damage for himself and his allies
    for one attack. ▪ NulShock: Kimahri nullifies all lightning damage for himself
    and his allies for one attack. ▪ NulTide: Kimahri nullifies all water damage for
    himself and his allies for one attack. ▪ NulFrost: Kimahri nullifies all ice damage
    for himself and his allies for one attack. ▪ Esuna: Kimahri removes all negative
    status effects on himself or one of his allies. ▪ Life: Kimahri revives one of
    his allies if they happen to die, though they are nonetheless still significantly
    injured. ▪ Full-Life: Kimahri revives one of his allies at their full strength.
    ▪ Shell: Kimahri enhances an ally''s magic defense, halving the d'
