  intelligence:
    text: Kimahri is an excellent combatant with his spear, having intensely trained
      every day since his youth to become the strongest of his tribe and being able
      to expertly use a fiend's abilities through his Ronso rage. Over the course
      of Yuna's pilgrimage across Spira, he faced countless fiends with various abilities
      before ultimately helping to defeat Sin itself. By Final Fantasy X-2, he had
      become the Elder of the Ronso tribe, leading them effectively and helping to
      bring peace between the Ronso and the Guado.
