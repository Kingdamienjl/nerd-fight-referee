- id: claim-weaknesses-2c0fb65f
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: ▪ Jecht Beam: Jecht fires beams
    of energy from his eyes, petrifying anyone they come in contact with. ▪ Jecht
    Blade: Jecht charges energy in his sword and slashes at his enemy repeatedly,
    knocking them away from the sheer force of the attack. ▪ Triumphant Grasp: Jecht
    picks his enemy up in his grip and creates an explosion around them while turning
    them into a zombie, causing them to be harmed by healing abilities and items.
    ▪ Jecht Bomber: Jecht creates a massively powerful gravitational singularity to
    crush enemies flat. ▪ Hot Steel: Jecht ignites his sword and slashes at his enemy
    multiple times. ▪ Meteor Shot: Jecht calls down a meteor and tosses it at his
    enemy. ▪ Blitz King: Jecht kicks his foe twice before impaling them with his sword.
    He then produces a massive boulder that he fragments with a single kick and charges
    with energy with another. The fragments converge on his target and explode in
    an attack he calls the Ultimate Jecht Shot (Not to be confused with his Overdrive).
    ▪ Yu Pagoda: Two stone structures that accompany Braska''s Final Aeon during the
    final battle at Dream''s End. While they don''t damage enemies, they are able
    to provide many support abilities, and every time they''re destroyed they''re
    revived. * Power Wave: The Yu Pagodas charge Braska''s Final Aeon''s Overcharge
    energy, heal him and clear him of negative status effects. * Osmose: Drains one
    enemy of their magic energy, preventing them from using spells. * Curse: Debilitates
    enemies with several negative status effects, nullifying their ability to use
    techniques and magic, poisoning them, blinding them with darkness and putting
    them to sleep. ▪ Ultimate Jecht Shot: The Overdrive of Braska''s Final Aeon. Jecht
    summons a meteor from several planets away, before catching it and throwing it
    into the ground, breaking part in a chaotic explosion to deal massive damage to
    his enemies. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    {{Scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters Category:Game
    Characters Category:Male Characters Category:Final Fantasy Category:Final Fantasy
    X Category:Antagonists Category:Parents Category:Sword Users Category:Brawlers
    Category:Flight Users Category:Telekinesis Users Category:Energy Users Category:Magic
    Users Category:Game Bosses Category:Weapon Masters Category:Humans Category:Petrification
    Users Category:Underwater Breathing Users Category:Acrobats Category:Possessed/Brainwashed
    Characters Category:Law Users Category:Space Users Category:BFR Users Category:Death
    Users Category:Supernatural Willpower Users Category:Summoners Category:Sealing
    Users Category:Reactive Power Level Users Category:Dimensional Travel Users Category:Creation
    Users Category:Immortals Category:Matter Users Category:Soul Users Category:Radiation
    Users Category:Deconstruction Users Category:Self-Destruction Users Category:Explosion
    Users Category:Resurrection Users Category:Petrification Users Category:Duplication
    Users Category:Absolute Zero Users Category:Poison Users Category:Corrosion Users'
