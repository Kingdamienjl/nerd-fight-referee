      as "practically a god" on the level of Radagon of the Golden Order or Queen
      Marika herself. Likewise, Alexander had previously battled Radahn, and witnessed
      Radahn's defeat first-hand, thus, likening the Fire Giant to a god would suggest
      that Alexander believed the Fire Giant was vastly superior to Radahn16.88 ExaFoe),
