- id: claim-weaknesses-58c5ce86
  section: weaknesses
  axis: weakness
  text: 'None notable. Notable Attacks/Techniques: *Holy Spears: Radagon summons spears
    made of holy magic and throw them. *Holy Spear Fan: Radagon throws four smaller
    holy spears at the target, which will linger embedded in the ground before detonating
    as small explosions. *Draining Field: Radagon manifests a holy spear and slams
    it down, creating a field that drains health when one stands in it. *Charge Swing:
    From mid-range, Radagon glides towards his target and swings his hammer at them
    in a lariat-esque fashion. *Gold Breaker: Radagon leaps into the air, channels
    the powers of the Elden Ring through his hammer, and slams it down. *Parry Stance:
    Radagon holds out his left arm out as a defensive maneuver to deflect most projectiles
    and physical attacks. *Grab: Radagon''s spectral left arm fully materializes as
    he attempts to grab his target with a shockwave, before pressing them to the ground
    and smashing them with his hammer. *Teleport: Radagon teleports a short distance
    away, or even remaining in the same location, producing a damaging shockwave as
    he reappears. == Notable Matchups == Victories: Losses: Inconclusive: {{Discussions}}
