    text: At least City Block level, likely Large Town Level (Can defeat falling star
      beasts, which can withstand this much energy), possibly Mountain Level (Collected
      enough runes to be able to match Radahn who can hold back a meteor that can
      withstand this much energy) | likely Multi-Solar system level (Defeated Ranni
      who created a pocket dimension containing a moon and numerous stars), Likely
      Universe level+ (Defeated Placidusax, who was stated to live eternally beyond
      time) | possibly Outerverse Level (Defeated the Elden Beast who was stated to
      embody the concept of order, order is defined through the concepts of causality
      and regression, The Elden ring was stated to be a metaphysical abstraction in
      an interview with Miyazaki in which the Elden Beast is the Elden Ring's true
      form) | possibly Outerverse Level possibly Higher (Inherited the frenzied flame
      from the outer god of frenzied flame's vassal which was stated to be able to
      burn down the golden order and eventually all of creation)
