  intelligence:
    text: 'Gifted (Radahn is a well accomplished general and skilled fighter, being
      able to battle evenly against a master swordwoman like Malenia. Radahn is also
      a master of utilizing gravity magic) | Animalistic in general (The Scarlet Rot
      has reduced him to a mindless beast that feasts on friends or foes alike, even
      being unable to speak and resorting to grunts and loud howls.), Gifted in combat
      (Despite his mindlessness, he retains excellent control over his gravity magic
      and can simultaneously fight against the Mid-Game Tarnished and multiple fighters.)
      | Gifted (Should be relative to his prime self. Could utilize Miquella''s light
      to it''s full extent upon his arrival) Standard Tactics: |-|Prime= Radahn''s
      tactics are relatively unknown, but he was an accomplished militant who fought
      honorably and was praised for his wits on the battlefield. Likely, he fought
      similarly to his rotted and revived self. In his fight with Malenia, after waiting
      for her to equip her prosthetic, he started with sword strikes. |-|Rotted= Due
      to the Scarlet Rot, Radahn''s mind has deteriorated to the point that Jerren
      compares him to a dog regarding intelligence. He has also lost his feet and
      heavily relies on his trusted steed, Leonard, for movement. Despite this, he
      retains his ingenious skills in magic and combat. If the opponent is far from
      Radahn, he''ll attempt to snipe them with his great bow, wielding gravity arrows.
      He''ll also begin using rain and scatter arrows as the opponent approaches.
      Radahn will mount his horse and start slashing at the opponent with mighty sword
      swings and slams if the opponent is in close range. As the fight continues,
      Radahn will start using electric and gravity-based attacks. Eventually, he''ll
      fly into the mesosphere and descend onto the battlefield like a burning meteor;
      he''ll resume these tactics for the rest of the fight until his opponent dies.
      |-|Promised Consort= Upon his revival, Radahn no longer suffers the physical
      and mental ailments of his rotted self. He starts with Gravity Rush. He''ll
      continue with many sword combos and gravity-based attacks, giving the opponent
      no room for error. If he is sufficiently damaged, Miquella will appear and empower
      Radahn with his light magic. With his newly gained amplification, Radahn will
      raze the battlefield with devastating pillars of light; from then on, he''ll
      begin using light-based attacks, with the rest of his tactics mirroring his
      prime/rotted self, now more aggressive and coordinated.'
    source_ids:
    - vsbattles-radahn-elden-ring
    confidence: 0.8
    notes: auto_repair source extraction
