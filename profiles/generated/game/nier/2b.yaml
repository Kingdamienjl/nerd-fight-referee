power_scale:
  tier:
    text: '{{7-A}}, higher with Flight Unit, {{6-C}} with Black Box Detonation Name:
      YoRHa No. 2 Type E, 2E, (Alias) YoRHa No. 2 Type B, 2B Origin: NieR: Automata
      Gender: Female Age: 3 (By the end of the game) Classification: Android Affiliation:
      YoRHa'
    source_ids: &id002
    - mediawiki-744704
    confidence: 0.95
  attack_potency:
    text: 'Mountain level+ (Is able to harm A2,NieR Automata; 2017; Ch 06-05: A2''s
      Revenge (A & B) who survived No 4''s Black Box Detonation.NieR Automata; 2017;
      Concert Script 3 (Beasts Who Kill One Another) Stronger than 9S, who can destroy
      Flight Units,NieR Automata; 2017; Ch 17-05: 9S Self-Repairs which can withstand
      hits from the 2km tall GrunNieR Automata; 2017; Ch 07-05: Monster (A & B)),
      higher with Flight Unit, Island level with Black Box Detonation (Comparable
      to No 4''s Black Box detonation, which destroyed Mount Ka''ala and still killed
      everything in a 250 km radius)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'At least Superhuman travel speed (Able to outrun Beauvoir''s missilesNieR
      Automata: Ch 04-03: Advent of the Songstress (A & B)), FTL+ combat and reaction
      speeds (Able to dodge point blank EMPs, lasers, and particle beams. Can turn
      invisible through sheer speed), higher with Overclock Chip (Able to move normally
      while perceiving the world moving at 1/10 speed), higher reaction speed with
      Evasion System Chip (Perceived the world moving at 1/4 speed), Speed of Light
      attack speed with Pod Laser, Massively Hypersonic+ flight speed with Flight
      Unit (Florida grew noticeably larger in a short period of timeNieR Automata;
      2017; Ch 10-02_1: 9S Placed in Battle (B))'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'Class T (Comparable to her telekinesis. Can block punches from EngelsNieR
      Automata; 2017; Ch 05-02: Goliath Attack (A & B)), Class T with Telekinesis
      (Casually capable of wielding Engels'' arm as a weaponNieR Automata; 2017; Ch
      01-03_3: 2B''s Aerial Combat (A)), higher with Flight Unit (Can push against
      an Engles)'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: '"wikitable mw-collapsible mw-collapsed" !Spoilers |- | In the beginning
      of the game she is deployed to destroy the Goliath Class machine Engels. After
      the rest of her squad is destroyed, she is paired up with 9S. After that mission
      she and 9S get deployed to assist the resistance forces on the planet. As part
      of a mission the two of them explore the housing complex in the desert. There
      they discover a cave inhabited by machines. After being attacked by them those
      machines give birth to Adam. The two of them manage to defeat him, however Eve,
      born from Adams stab wounds, causes the cave to collapse and she and 9S have
      to flee. After a fight with multiple Engels, they encounter both Adam and Eve
      in the alien base beneath the city. This battle ends without any conclusive
      outcome. Later they battle the gigantic machine Grün. After defeating Grün,
      9S gets blasted away by the explosion. She immediately starts to search for
      him and finds him held captive by Adam in the copied city. She then kills Adam
      to free 9S. The grief Eve develops after losing Adam drives the machines in
      the network to go berserk, causing her and 9S to confront him in a final battle
      and succeed in defeating him. After these events she gets infected by a virus
      spread through the YoRHa network by the machines and asks A2 to kill her, with
      her memories then being transferred to A2. At the end of the story, 2B and 9S
      are repaired by their Pods to become the last surviving members of YoRHa. |}
      ==Powers and Stats'
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Mountain level+ (Comparable to A2. Was at the epicenter of two black boxes
      simultaneously detonating. While she did die in the explosion, her body is not
      only intact, but is also in good enough condition she retrieves and reuses the
      equipment on it.NieR Automata; 2017; Email | Commander: Lost Equipment Can withstand
      hits from Grun), higher with Flight Unit and Shields (Can ignore attacks from
      adversaries of comparable strength)'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Infinite (Is an android. YoRHa type androids are powered by a fusion reactor
      that does not need any fuel to function)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Tens of Meters with Physical Attacks and Shockwaves, Hundreds of Meters
      with Pod Gatling, Kilometers with Pod Laser, Flight Unit, and Sensors (Sensors
      in the skin allow her to detect enemies from kilometers awayNieR Automata World
      Guide [City Ruins Survey Report]; Vol 1)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Gifted (Number 2 personality types were noted to have exceptional analytical
      and decision making skills.NieR Automata; 2017; Archives | Saved Machine Records
      | [Top Secret] Model No.2 Even combat models have exceptional technical knowledge
      and can direct a fusion reactor bypass in the field and have the skills to hack
      alien technology.Nier Automata: YoRHa Shinjuwan Kouka Sakusen Kiroku Vol.2 Chapter
      5 Though they are still subpar when compared to types like the Scanner and Healer.
      While she was in denial of it, 2B was able to figure out YoRHa''s secret that
      humanity was in fact extinct. The only other character to have done so is Adam.NieR
      Automata - Volume 01 - Long Story Short; Chapter 05 While 9S or the Red Girls
      may have learned the truth, they usually did so by accessing the data directly
      as opposed to putting the clues together. Is trusted enough to be put into positions
      of leadership such as during her operation to take out a goliath weapons platform,
      she assumed captain''s duties immediately after the death of their commanding
      officer.NieR Automata; 2017; Ch 01-01_1: 2B''s Aerial Battle (A) Master combatant
      and pilot. Androids pass along knowledge and skills by sharing data. Making
      each android a culmination of the skills and knowledge of past generations of
      androids. Androids were first conceived over ten thousand years ago and have
      been at constant war against multiple faction since. For the past 5 thousand
      years their enemies have been the aliens and their living weapons, the Machine
      Lifeforms. Their enemies, the machines, are constantly evolving new weapons
      and tactics to counter the weapons and tactics used against them with an evolution
      being triggered every 30 that are killed,YoRHa: Pearl Harbor Descent Record
      - A NieR:Automata Story; Vol 07 causing the resistance to only fight during
      certain times of the year when their evolution speed is slower. In order to
      turn the tides of the war, the YoRHa were created. YoRHa are expected to kill
      thousands of machines per YoRHa android without regard to the evolution.YoRHa:
      Pearl Harbor Descent Record - A NieR:Automata Story; Vol 01 As an executioner
      model, 2B is the strongest YoRHa type. Despite being undercover, 9S managed
      to deduce her identity because of how much her battle capabilities exceeded
      other YoRHa.NieR Automata - Volume 01 - Long Story Short; Chapter 10 This was
      demonstrated during a descent to Earth where the invading force was corrupted
      by a logic virus. Despite the virus removing the limiters on their bodies, making
      them both stronger and faster, 2B battled and killed several dozen corrupted
      YoRHa combat models at the same timeNieR Automata; 2017; Ch 11-04: Contaminated
      YoRHa by herself with 9S abandoning the area so she could fight without fear
      of hitting him.NieR Automata - Volume 01 - Long Story Short; Chapter 07 The
      machines birthed Adam and Eve, powerful machines that could learn and evolve
      so quickly that Adam could learn anything instantlyNieR Automata - Volume 01
      - Long Story Short; Chapter 1 and could fight on par with 2B and 9S a few seconds
      after being born.NieR Automata; 2017; Ch 03-03: Battle with Adam And they would
      continue learning and evolving in the months after as well as killing numerous
      YoRHa. Despite this, neither Adam nor Eve could learn enough to actually defeat
      2B in any of their confrontations with 2B killing Adam in a one on one battle.
      9S has also admitted to being unable to defeat 2B normally, calling it a "One
      sided fight", and resorted to ambushing and hacking her in order to gain an
      upper handNieR Automata Memory Cage; Chapter 5)'
    source_ids: *id002
    confidence: 0.95
