- id: claim-weaknesses-8cd8d15c
  section: weaknesses
  axis: weakness
  text: 'Initially light due to being a Twili, causing her to stay in Link’s shadow.
    However, after receiving Zelda’s spirit, she can stay in the Light World with
    no harm. Notable Attacks/Techniques: *Magic: As a member and ruler of the Twili,
    Midna is capable of wielding her tribes magic, though much of it has been weakened
    following her curse by Zant into an imp. Still, she is able to help Link during
    his adventure using her abilities which include: **Twilight Deconstruction: Can
    turn into twilight particles granting a form of intangibility. She can also do
    so to other beings and objects and send them to another location. **Twilight Porta'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-37a8d67e
  section: abilities
  axis: hax
  text: '{{#tag:tabber|Base=Superhuman Physical Characteristics, Magic, Enhanced Senses
    (Detected the arrival of patrol guardsThe Legend of Zelda: Twilight Princess;
    Meeting Zelda), Flight (Capable of flight The Legend of Zelda: Twilight Princess;
    Lake Hylia) Portal Creation (Can create portals to exit dungeons The Legend of
    Zelda: Twilight Princess; Morpheel Battle), Teleportation, BFR and Matter Manipulation
    (She can teleport both herself and others. The Legend of Zelda: Twilight Princess;
    Eldin TwilightThe Legend of Zelda: Twilight Princess; Dark Beast Ganon Battle
    Transportation via Twilight Magic in general requires breaking down people and/or
    objects into particles and then restoring them back to a solid state), Dimensional
    Travel (Traveled to Hyrule from the Twilight Realm after being cursed The Legend
    of Zelda: Twilight Princess; Mirror of Twilight Completed), Darkness Manipulation
    (Can become shadows, as well as enter a person''s shadow The Legend of Zelda:
    Twilight Princess; Ordon Village), Intangibility (Can phase through objects The
    Legend of Zelda: Twilight Princess; Meeting Midna), Shapeshifting (Able to turn
    into different forms The Legend of Zelda: Twilight Princess; Hyrule Castle Twilight),
    Energy Manipulation (Can form an energy field that surrounds her, as well as create
    energy attacks The Legend of Zelda: Twilight Princess; Faron Woods Twilight),
    Telekinesis (After shooting energy onto an object, she can lift it using telekinesis
    The Legend of Zelda: Twilight Princess; Zora''s Domain), Dimensional Storage (Stored
    Link''s sword and shield while as a wolf), Hair Manipulation (Often uses her hair
    as an extra hand) {{!}}-{{!}} Fused Shadow= All previous plus Transformation (Can
    transform into a giant spider-like creatureThe Legend of Zelda: Twilight Princess;
    Breaking Hyrule Barrier), Large Size (Type 0), Additional Limbs (Possesses six
    limbs that also act as tentacles), Surface Scaling (Clinged onto Hyrule''s barrier
    and climbed it), Weapon Creation (Can conjure tridents), Body Control (Can extend
    her tentacles), Purification (Type 2; Removed Ganondorf from Zelda''s body), and
    Non-Physical Interaction (Attacked Ganondorf''s spirit using her trident)}} |-|Resistances=
    Resistance to Light Manipulation (After receiving the Triforce of Wisdom from
    Zelda, Midna could stay in the Light World without any harm to herselfThe Legend
    of Zelda: Twilight Princess; Saving Midna), Unholy Manipulation & Corruption (Triforce
    pieces prevent their user from being corrupted and turned into a demonThe Legend
    of Zelda: Twilight Princess; Eldin Province Tears Of Light), and Soul Manipulation
    (Triforce pieces protect their user from Zant''s Twilight veil, which causes all
    caught within it to become spiritsThe Legend of Zelda: Twilight Princess; Meeting
    Zelda)'
