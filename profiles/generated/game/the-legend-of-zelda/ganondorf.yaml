  intelligence:
    text: Base= Genius (Despite his reputation as a thief and being known by most
      of the races of Hyrule to have placed curses on people to get his way, he still
      gained and maintained the trust of the king of Hyrule while also running his
      own country in the desert to the west. He managed to deduce that Link held the
      means to open the Door of Time with what little interaction he had with him
      and secretly followed him into the Temple of Time in order to enter the Sacred
      Realm and claim the Triforce. He used Zant's insanity and desperation to his
      advantage by falsely posing as a god and granting him a portion of his power
      in order to try and create a new world by merging the Twilight realm with Hyrule
      and escape his imprisonment in the Twilight realm in the process. He is a highly
      skilled warrior who can match various incarnations of Link in swordsmanship.
      However, in games such as the original Legend of Zelda his intelligence has
      devolved to below-average levels, although he can still organize and command
      an army of monsters) |-|Botched Ressurection= Below Average (Due to the ritual
      to resurrect him being botched, he came back in an incomplete state barely able
      to form sentences, but he still retains some knowledge on his magic and fighting
      skills) | Genius | Genius (Even more intelligent than before due to his possession
      of the Triforce of Wisdom, and orchestrated a plan to free himself and his army
      from the Dark World by creating an avatar of himself to gain the trust of the
      people of Hyrule and use the 7 Maidens as a sacrifice to break the Wise Men's
      seal keeping him in the Dark World)
    source_ids: *id002
    confidence: 0.95
