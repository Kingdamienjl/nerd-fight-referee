  durability:
    text: Low Complex Multiversal to High Complex Multiversal (Link has survived encounters
      with multiversal threats throughout the series. In Skyward Sword, he endured
      attacks from Demise, a primordial entity of destruction who existed before Hyrule's
      creation. The Triforce of Courage inherently protects Link from corruption and
      transmutation effects that would affect beings across multiple dimensions, as
      seen in Twilight Princess where he transforms into a wolf rather than becoming
      a spirit like other beings when exposed to Twilight. Link has also survived
      the collapse of dimensions, such as when escaping the falling moon in Majora's
      Mask which threatened to destroy an entire pocket dimension) | Low Hyperversal
      to High Hyperversal (When empowered by divine artifacts like the complete Triforce
      or the Fierce Deity's Mask, Link gains durability that transcends dimensional
      limitations. In the Japanese version of A Link to the Past, the Triforce grants
      power that "transcends space and time," and Link with this power can withstand
      attacks from similarly empowered beings. Link has survived encounters with entities
      that threaten the fundamental structure of reality across all dimensions, such
      as Majora in Majora's Mask and Ganon with the complete Triforce. His ability
      to traverse between different planes of existence without harm further demonstrates
      his transcendent durability) | Low Outerversal to Outerversal (At his absolute
      peak, when protected by the full power of the Golden Goddesses through the complete
      Triforce, Link's durability reaches beyond conventional dimensional constraints.
      The Golden Goddesses existed in a state of pure abstraction "before time began,
      before spirits and life existed" according to Ocarina of Time lore. Link, when
      fully empowered by their essence through the Triforce, can withstand attacks
      from conceptual entities that exist beyond all dimensional hierarchies. This
      is evidenced by his ability to survive encounters with beings like Demise, whose
      curse transcends time and space to affect all incarnations throughout history,
      demonstrating Link's capacity to endure attacks that would threaten existence
      itself) | High Outerversal+ to Extraversal (When protected by the complete essence
      of the Golden Goddesses through the Triforce, Link's durability operates at
      a pre-conceptual level that existed before and created the concepts that govern
      damage, destruction, and harm. Since the Golden Goddesses existed in a primordial
      void that predates all concepts and created the fundamental frameworks that
      define vulnerability and protection, Link's durability when fully empowered
      transcends the very concepts that other transcendent beings must overcome, allowing
      him to withstand attacks that operate beyond all possible conceptual limitations
      and frameworks)
    source_ids:
    - character-stats-profiles-link-the-legend-of-zelda
    confidence: 0.8
    notes: auto_repair source extraction
