  attack_potency:
    text: Low Complex Multiversal to High Complex Multiversal (Link defeated Demise
      in Skyward Sword, a primordial entity who existed before Hyrule's creation and
      wielded power that could reshape reality across dimensions. When possessing
      the complete Triforce, Link wields power derived from the Golden Goddesses who
      created the entire Zelda multiverse, which according to the Hyrule Encyclopedia
      contains "millions of parallel worlds." The Triforce sustains entire dimensions
      as seen in A Link Between Worlds, where without it, Lorule began to collapse.
      In the Japanese version of A Link to the Past, Ganon with the full Triforce
      "transcended space and time," placing its power beyond conventional dimensional
      constraints) | Low Hyperversal to High Hyperversal (The Golden Goddesses exist
      beyond the dimensional structure of the Zelda multiverse, having created the
      very concepts that govern reality. By wielding the complete Triforce in games
      like Wind Waker and A Link to the Past, Link gains access to power that can
      fundamentally reshape the structure of reality across all dimensions and timelines.
      In Majora's Mask, Link defeats Majora, an entity capable of collapsing dimensional
      boundaries and threatening the fabric of reality itself. The ability to counter
      such metaphysical threats places Link at Hyperversal levels when wielding divine
      artifacts) | Low Outerversal to Outerversal (At his absolute peak with the complete
      Triforce, Link channels the essence of the Golden Goddesses who existed in a
      state of pure abstraction "before time began, before spirits and life existed"
      as stated in Ocarina of Time. The Japanese texts of Skyward Sword and A Link
      to the Past describe the Triforce as power that "stands beyond all concepts,"
      placing it at Outerversal levels. Link's ability to defeat entities like Demise,
      whose curse transcends conceptual boundaries to affect all incarnations throughout
      history, demonstrates his capacity to operate at this cosmic level when wielding
      divine artifacts) | High Outerversal+ to Extraversal (When wielding the complete
      Triforce, Link channels the essence of the Golden Goddesses who existed in a
      primordial void that "predates all concepts" and created the fundamental frameworks
      that govern all reality. The research confirms that "the Goddesses give concepts
      to the Zelda cosmology" - they didn't just transcend concepts, they created
      concepts themselves. This places the Golden Goddesses at a level that existed
      before the very idea of transcendence, dimensional hierarchies, or conceptual
      frameworks. The Japanese texts describing the Triforce as power that "stands
      beyond all concepts" indicates it operates on a meta-conceptual level that transcends
      even the frameworks that create outerversal hierarchies. Link's scaling to beings
      who existed before and created the concepts that other High 1-A entities transcend
      places him at the absolute peak of the tiering system, comparable to entities
      that operate beyond all possible conceptual limitations and frameworks)
    source_ids:
    - character-stats-profiles-link-the-legend-of-zelda
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: MFTL+ (Link has demonstrated extraordinary speed feats across the Zelda
      series. In Breath of the Wild, his Flurry Rush ability has been calculated at
      approximately Mach 1291, allowing him to perform seven sword slashes in the
      time it takes lightning to travel a short distance. Link consistently dodges
      and parries beams of light from Beamos enemies across multiple games, particularly
      in Twilight Princess where he's shown reacting to and dodging light-speed attacks.
      In Age of Calamity, Link and other characters can dodge Guardian beams which
      are explicitly described as moving at "lightspeed" according to in-game sources.)
      | Immeasurable (When wielding the complete Triforce or when moving through time
      with the Ocarina of Time or Harp of Ages, Link's speed potentially reaches Immeasurable
      levels as he transcends conventional time and space. The Japanese version of
      A Link to the Past states that Ganon with the full Triforce "transcended space
      and time," suggesting that Link, when wielding similar power, would scale to
      this level of speed. Link's ability to move freely between timelines and dimensions
      while retaining his memories and abilities further suggests speed beyond conventional
      measurement when at his peak power.) | Irrelevant (When channeling the complete
      power of the Golden Goddesses through the Triforce, Link operates on a pre-conceptual
      level that existed before the concepts of speed, time, and movement were created.
      Since the Golden Goddesses existed in a primordial void "before time began"
      and created all temporal and spatial concepts, Link's speed when fully empowered
      transcends the very frameworks that define movement and velocity. Operating
      at a level that predates and created the concepts that govern speed itself places
      Link beyond all conventional measurements of velocity)
    source_ids:
    - character-stats-profiles-link-the-legend-of-zelda
    confidence: 0.8
    notes: auto_repair source extraction
