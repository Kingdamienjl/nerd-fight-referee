- id: claim-powers-and-abilities-193d6b99
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Immortality (Types 1 and 2, Can survive
    having a sword plunged through his chest several times),The Legend of Zelda: Skyward
    Sword; Final Ghirahim Battle Weapon Mastery (Is a skilled swordsman capable of
    clashing with Link), Martial Arts, Magic, Aura, Energy Manipulation & Projection
    (Can channel energy through his hands to enhance his defenses,The Legend of Zelda:
    Skyward Sword: First Ghirahim Battle and is capable of projecting energy beams),
    Matter Manipulation (Can instantly reconstruct parts of his sword if it gets damaged),
    Unholy Manipulation and Possibly Corruption (Type 2 - Demons can emit fiendish
    power that can turn small innocent creatures into monsters),The Legend of Zelda:
    Skyward Sword; Batreaux Becomes Human Possibly Non-Physical Interaction (Should
    likely be capable of physically interacting with ghosts, as even a normal bottle
    in the Zelda series can physically trap and contain spirits),The Legend of Zelda:
    Ocarina of Time; Big Poes Teleportation (Can teleport on a whim), Extrasensory
    Perception (Can sense the location and presence of other beings), Regeneration
    Negation (Injuries that Ghirahim inflict are stubborn things, and did not go away
    even after Faron soaked in a basin of sacred healing water for so long that the
    water ran out of healing properties), Summoning (Can summon large hordes of monsters),The
    Legend of Zelda: Skyward Sword; Ghirahims Ritual Power Bestowal & Life Manipulation
    (Reanimated Koloktos with cursed energy, which also granted it powers beyond its
    conventional limits,The Legend of Zelda: Skyward Sword; Koloktos Battle he also
    gave life to Scaldera who upon death was revealed to be a product of Ghirahim''s
    magic, dispersing into the same crystal like particles seen with most of his magic),The
    Legend of Zelda: Skyward Sword; Scaldera Battle Telekinesis (He can telekinetically
    control his weaponsThe Legend of Zelda: Skyward Sword; Ghirahim Second Battle
    and lift up people),The Legend of Zelda: Skyward Sword; Ghirahim Kidnaps Zelda
    Attack Reflection (Can reflect magical attacks), Light Manipulation (He can generate
    flashes and beams of light), Darkness Manipulation (His presence darkened the
    Fire Sanctuary), Deconstruction (Can cause his own weapons and clothes to disintegrate
    into particles), Air Manipulation (He was the one who created the tornado that
    pulled Zelda to the surface and knocked away Link),The Legend of Zelda: Skyward
    Sword; Zelda Is Taken By The Tornado Weather Manipulation (He can cover the skyThe
    Legend of Zelda: Skyward Sword; Ghirahim vs Impa with dark clouds), Electricity
    Manipulation (Can channel electricity through his hands to shock his foe), Body
    Control and Transformation (Can transform his arms or entire body into a substance
    tougher than any armor), Platform Creation (Created a platform to fight Link on),
    Barrier Creation (He can create barriers to protect himself), Weapon Creation
    (He can conjure daggers, sabres, and massive broadswords), and Soul Manipulation
    (Cast a spell that would allow Demise to consume Zeldas soul), Resistance to Extreme
    Heat (Was fine while within the Fire Sanctuary located in the summit of Eldin
    Volcano, which is so hot it causes spontaneous combustion)The Legend of Zelda:
    Skyward Sword and Holy Manipulation (Is unaffected by physically holding the Goddess/Master
    Sword, Skyward Strikes which are superior to Link''s physicals cannot even make
    his true form flinch)'
