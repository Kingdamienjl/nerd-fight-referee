  intelligence:
    text: Despite his eccentric and outlandish behaviour, Sergeant Johnson is a veteran
      who served in numerous pivotal fights throughout the series, keeping pace with
      SPARTAN-IIs and fighting alongside Master Chief in various conflicts and even
      holding his own against the Arbiter. Unlike most Marines, he is comfortable
      with both Human and Covenant weaponry, but prefers the Sniper Rifle and Spartan
      Laser, showing an emphasis on precision and power. In addition, he quickly mastered
      the controls of various vehicles over the course of the war, hijacking a Scarab
      before Sangihelli forces could reach it.
