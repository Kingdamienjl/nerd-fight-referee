- id: claim-powers-and-abilities-fbe3164b
  section: abilities
  axis: hax
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Without MJOLNIR= *
    Superhuman Physical Characteristics * Cyborgization * Stealth Mastery * Martial
    Arts Expert (Spartans are trained in multiple martial arts and in Zero-G combat.
    Able to beat physically superior enemies through skill) * Pain Tolerance * Social
    Influencing (Social Position, Reputation, Leadership, and Charisma: Even to other
    Spartans he is a trusted leader to be respected and emulated. To other soldiers
    he is a savior even when death is close at hand. To human civilians he is like
    a titan coming to the rescue. To the Covenant he is a demon capable of untold
    horrors, yet brought knowledge that prevented their extinction.) * Vehicular Mastery
    (Chief is a master pilot of all UNSC and Covenant vehicles. Piloted a Warthog
    on two separate occasions through a collapsing super structure. Piloted a Mantis
    to extreme combat effectiveness despite never encountering the vehicle before
