- id: claim-weaknesses-ec9b3bd7
  section: weaknesses
  axis: weakness
  text: 'If he gets hit with enough force his armor might lock. Shields cannot regenerate
    while in the middle of rapid-fire attacks. MJOLNIR regenerating shields grant
    little protection against close-quarters combat attacks. Notable Attacks and Techniques:
    *Spartan Charge: John slams into his enemy while sprinting at full speeds. *Spartan
    Ground Pound: While hovering with his thruster pack, John can perform a powerful
    ground pound attacking multiple targets within the attacking circle. ==Gallery==
    center|400px|thumb|Master Chief''s armor evolution {{Scroll box|content= Halo
    Master Chief (Prototype) (Render).png|Master Chief''s beta armor/apperance. Halo
    The Fall of Reach Kid John.jpg|John in his early ages in the UNSC. Halo Forward
    Unto Down Chief (Updated).png|Master Chief clad in a Mjolnir Mark IV variant similar
    to his Mark VI armor, as it appears in Halo 4: Forward Unto Down. Halo Fall of
    Reach Chief.jpg|Master Chief clad in Mjolnir Mark V armor as it appears in Halo:
    Fall of Reach. Halo CE Chief (Updated).png|Master Chief clad in Mjolnir Mark V
    armor as it appears in Halo: Combat Evolved. Halo CE Anniversary Master Chief
    (Render).png|Master Chief clad in Mjolnir Mark V armor as it appears in Halo:
    Combat Evolved Anniversary. Halo FTR MK V Chief Updated.png|Master Chief clad
    in Mjolnir Mark V armor as it appears in Halo: Fireteam Raven. Halo 2 Master Chief
    (Render).png|Master Chief clad in Mjolnir Mark VI armor as it appears in Halo
    2. Halo 2 Anniversary Master Chief (Render).png|Master Chief clad in Mjolnir Mark
    VI armor as it appears in Halo 2: Anniversary. Halo Legends Master Chief.png|Master
    Chief clad in Mjolnir Mark VI armor as it appears in The Package. Halo Chief in
    3 (Updated).png|Master Chief clad in Mjolnir Mark VI armor as it appears in Halo
    3. Halo Reach Chief.jpg|Master Chief''s Firefight profile in Halo: Reach. John-117
    H4 Render.png|Master Chief clad in Mjolnir Mark VI GEN2 armor as it appears in
    Halo 4. H5G Render John117-FullBody4.png|Master Chief clad in Mjolnir Mark VI
    GEN2 armor as it appears in Halo 5:Guardians. }} ==Notable Matchups== Victories:
    Goblin Slayer (Goblin Slayer (Series)) Slayer''s Profile (Both were 9-B, Chief
    had ODST battle armor, MA5B, combat knife, and a plasma grenade. Goblin Slayer
    had the Gate Scroll. Speed was equalized) Metal Man (Iron Hero/Metal Man) Metal
    Man''s Profile (Both were 8-C, Chief had Generation 2 MJOLNIR armor and 8-C and
    lower weapons. Metal Man had his energy projection. Speed was equalized) Captain
    America (Marvel Cinematic Universe) Captain America''s Profile (Both were 8-C,
    all weapons restricted. Speed was equalized) Hook Horror (Dungeons and Dragons)
    Hook Horror''s Profile (Both were 9-A, anything higher than 9-A was restricted.
    Speed was equalized) Ganondorf (The Legend of Zelda) Ganondorf''s Profile (Base
    Ganondorf vs Gen 2 MJOLNIR Chief and speed was equalized) Homelander (The Boys)
    Homelander''s profile (Master Chief was given a week of prep time, and access
    to all of his equipment, as well as knowledge of Homelander''s weaknesses. Speed
    was equalized) Chris Redfield (Resident Evil) Chris''s Profile (Speed was equalized.
    Both were 9-A) Losses: Isaac Clarke (Dead Space) Isaac Clarke''s profile (Both
    were 8-C and speed was equalized) Iron Man (Marvel Cinematic Universe) Iron Man''s
    Profile (Speed was equalised, Stark was in his Mk 4 armour, Chief had his Generation
    1 Mjolnir armour plus his standard equipment, and Chief''s power-ups were one
    use) Marauder (DOOM) Marauder’s Profile (Master Chief had his equipment up to
    8-C key, fight took place in a spaceship) Captain America (Marvel Comics) Captain
    America''s Profile (Speed was equalized and Master Chief was in his 3rd key while
    also having access to Cortana) Inconclusive: Space Marine (Warhammer 40,000) Marine''s
