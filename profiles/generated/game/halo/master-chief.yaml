      survive, and is considerably stronger now as an adult) | Small Building level+,
      possibly higher (Can KO other Spartans and other comparable troops with multiple
      punches. Overpowered an Elite Zealot while extremely exhausted. Is capable of
      killing weaker Sangheili with one punch), Street level to Building level+ with
      Weapons (Arsenal ranges from Handguns to Spartan Lasers), Multi-City Block level
      with Mjolnir Self-Destruction (Spartans can set the reactor in their armor to
      self-destruct to prevent it from falling into enemy hands, resulting in a massive
      explosion161.2429 tons of TNT) | Building level (His new suit is significantly
      more powerful than before. Is comparable to Spartan Edward Buck who casually
      killed a Promethean Soldier with a stomp. Managed to penetrate the Didact''s
      eye with a knife, but got stomped shortly afterward), higher with Spartan Charge
      and Spartan Ground Pound (Both Spartan Abilities greatly increase the power
      of the Spartan, letting them smash through thick walls or flip Wraith tanks
      with their shockwaves). Street level to Town level with Weapons (UNSC weapons
      are slightly stronger than before. The Incineration Cannon is capable of vaporizing
      large portions of a Gravemind, requiring this much energy. Can get access to
      various Promethean Weapons) and Mjolnir Self-Destruction, higher with Damage
      Powerups and REQ Variants'
    source_ids: *id002
