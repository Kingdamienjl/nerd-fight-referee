  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Weapon Mastery (Skilled with a variety of weapons) *Damage
    Boost (Their weapons deal bonus damage to demons) *Immortality (Types 1, 2, and 7) *Astral Projection
    (The Black Knights fought throughout Lordran are the projected spirits of the Black Knights that reside
    within the Kiln of the First Flame) *Damage Reduction (Via Perseverance) *Damage Boost (Via Warcry)
    *Resistance to Fire Manipulation, Temperature Manipulation, Magma Manipulation, Explosion Manipulation,
