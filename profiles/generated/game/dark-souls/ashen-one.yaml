- id: claim-powers-and-abilities-e9cb5d8c
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Immortality (Types 1, 2, 4, 7, and 8),
    Regeneration (Mid-Low), Healing, Resurrection (Via Darksign), Acrobatics (Can
    survive long distance falls and is expert at rolling in battle), Dimensional Travel
    (via the Whitesign Soapstone and Red Eye Orb), Weapon Mastery, Magic, Fire Manipulation,
    Chaos Manipulation (With pyromancies like Great Chaos Fire Orb), Lightning Manipulation,
    Ice Manipulation (Can cause frostbite via spells like Snap Freeze or weapons like
    Irithyll Straight Sword), Earth Manipulation (Can cause literal earthquakes via
    Earth Seeker and spew earth boulders via Boulder Heave), Light Manipulation, Holy
    Manipulation, Poison Manipulation, Acid Manipulation (Via Acid Surge), Mind Control
    (With Rapport), Invisibility (With Hidden Body and Obscuring Ring), Shapeshifting
    (Via Chameleon), Energy Blasts, Telekinesis (Can create omnidirectional shockwaves
    with Wrath of the Gods), Lifesteal (With the Lifehunt Scythe, and other weapons),
    Aura (Can create healing or buffing auras through the Warmth spell or Lothric
    War Banner respectively), Limited Time Manipulation, Soul Manipulation (Can absorb
    the souls of defeated enemies and also use them to attack like Great Heavy Soul
    Arrow), Sound Manipulation (Can become completely silent), Darkness Manipulation
    (Can create abyssal fire via spells like Black Serpent, or use Dark power via
    weapons like the Frayed Blade), Summoning (Can summon ethereal blades, a Lion's
    Spirit, with Valorheart, or an abyssal insect swarm, with Gnaw and Dorhys' Gnawing),
    Homing Attack, Paralysis Inducement (With Pestilent Mist), Limited Law Manipulation
    (With Twisted Wall of Light they can create a barrier that denies magic its claim
    to physicality), Statistics Amplification (Through various sorceries, pyromancies,
    miracles, items and consumables he can amplify both his physical and magical offense
    and defense), Damage Reduction (Both magical and physical, through various equipment
    and miracles), Power Nullification (Can restrict the enemy's use of magic with
    Vow of Silence, and Healing and Status Effect Nullification via Hunter's Charm
    and Hunter's Duel Charm), Gravity Manipulation (with Cat Ring and Spook, which
    greatly reduces fall damage), Teleportation (Via Homeward Bone and Homeward miracle),
    Air Manipulation (Can cause air fluctuations via weapons like Storm Curved Sword
    or Tailbone Spear), Explosion Manipulation, Limited Curse Manipulation (Via Crucifix
    of the Mad King), Extremely Limited Luck Manipulation (With weapons such as the
    Mendicant's Staff or other pieces of equipment such as the Shield of Want), Durability
    Negation (Against shields via Darkdrift), and Limited Supernatural Luck, Resistance
    to Magic, Fire, Frost, Lightning, Dark, Mind, Soul, Toxin, Curse Manipulation,
    Petrification and Bleeding effects, Resistance to Statistics Reduction and Power
    Nullification via resisting Hollowing (Hollowing reduces even the mightiest warriors
    to desiccated corpses and the Darksign failed to completely suppress the Dark
    Soul)
