  section: weaknesses
  axis: weakness
  text: 'Many of the bearers items are limited in number, meaning that they will have to travel back to
    their dimension to acquire more. The bearer has no control over the time period at which they invade,
    meaning that opponents could potentially have time to prepare and get stronger after killing them
    once. The bearers teleportation isn''t really combat effective, and is unlikely to be useful unless
    the fight is taking place with a bonfire nearby. Damage dealt by certain hexes such as Climax is dependent
