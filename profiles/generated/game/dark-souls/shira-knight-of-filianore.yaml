- id: claim-standard-equipment-faf1b2b0
  section: equipment
  axis: equipment
  text: '*Crucifix of the Mad King: A halberd with the corpse of an Undead king bonded to it. It is capable
    of performing one of three things when slammed into the ground, awakening the Undead momentarily:
    It can scream, dealing damage in an area around the wielder, scream and buff the wielder''s poise
    and damage resistance, or create an orb of darkness that will follow the wielder and explode after
    some time. The latter attack can damage the wielder but can be dodged at the right moment to avoid
    said damage. *Sacred Chime of Filianore: A Chime used to perform Miracles. Shira specifically uses
    the Lightning Arrow Miracle, which allows her to create a bow made out of lightning and fire bolts
    of lightning at her opponents.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
