- id: claim-standard-equipment-46d6e109
  section: equipment
  axis: equipment
  text: '*Damage Reduction (All weapons grant a small, varying amount of damage reduction
    against physical, magic, fire, and lightning damage) *Blessed/Holy Manipulation
    (Via Talismans and Divine. Certain weapons [Astora''s Straight Sword, Crescent
    Axe, Grant, Greatsword of Artorias, and Silver Knight Spear] deal bonus Divine
    Damage to undead and demons) *Power Nullification (Divine weapons nullify the
    resurrection of undead beings) *Damage Boost (Certain Demon weapons [Black Knight
    Sword, Black Knight Greatsword, Black Knight Greataxe, and Black Knight Halberd]
    deal bonus damage to demons. Tin Crystallization Catalyst and Manus Catalyst double
    the power of Sorceries) *Status Effect Inducement (Possesses numerous weapons
    that inflict the Bleed condition, which drains a significant portion of the opponent''s
    vitality after the Chosen Undead lands multiple successive attacks) *Vibration
    Manipulation (Can project ranged shockwaves Via Drake Sword, Dragon Greatsword,
    Golem Axe, Grant, and Dragon King Greataxe) *Curse Manipulation/Non-Physical Interaction
    (Can harm Intangible/Incorporeal beings and Ghosts Via Jagged Ghost Blade, Cursed
    Greatsword of Artorias, and Ghost Blade) *Fire Manipulation (Via Fire weapons,
    Chaos weapons, Quelaag''s Furysword, Obsidian Greatsword, Demon''s Catalyst, Hammer
    of Vamos, Fire Arrow, and Pyromancy Flame) *Reactive Power Level (Via Chaos weapons,
    Quelaag''s Furysword, Chaos Blade, and Abyss Greatsword) *Magic (Via Magic weapons,
    Enchanted weapons, Velka''s Rapier, Stone Greatsword, Moonlight Greatsword, Server,
    Moonlight Butterfly Horn, Channeler''s Trident, Darkmoon Bow, Moonlight Arrow,
    and Catalysts) *Statistics Reduction (Speed Reduction Via Stone Greatsword) *Energy
    Projection (Via Moonlight Greatsword) *Self-Healing (Via Server, Butcher Knife,
    and Smough''s Hammer) *Poison Manipulation (Via Gravelord Sword, Large Club, Dark
    Silver Tracer, Guardian Tail, and Poison Arrow) *Disease Manipulation (Via Gravelord
    Sword) *Electricity Manipulation (Via Lightning weapons, Demon''s Spear, Dragonslayer
    Spear, Giant''s Halberd, and Lightning Bolt) *Statistics Amplification/Empathic
    Manipulation (Via Channeler''s Trident) *Soul Manipulation/Absorption (Via Dark
    Hand) |-|Shields= *Damage Reduction (All shields grant a small, varying amount
    of damage reduction against physical, magic, fire, and lightning damage) *Limited
    Attack Reflection (Many shields allow the Chosen Undead to parry physical attacks)
    *Magic/Energy Projection (Via Crystal Ring Shield) *Blessed (Sanctus, Silver Knight
    Shield, and Greatshield of Artorias) *Healing (Sanctus grants slight passive HP
    regeneration) *Statistics Amplification/Density Manipulation (Via Havel''s Greatshield)
    *Enhanced Resistance to Poison Manipulation, Fire Manipulation, Temperature Manipulation,
    Magma Manipulation, Explosion Manipulation, Electricity Manipulation, Magic, and
    Curse Manipulation (Bloodshield grants 50% increased resistances to Magic, Fire,
    Lightning, Poison, and Curse) |-|Armor= *Statistics Amplification (All Armor grants
    The Chosen Undead varying degrees of increased physical durability. Mask of the
    Father and Mask of the Mother slightly boost equipment load and HP respectively)
    *Damage Reduction (All Armor grants The Chosen Undead varying degrees of damage
    reduction against blunt and bladed/piercing attacks) *Damage Boost (Crown of Dusk
    boosts the damage of Sorceries. The Crown of the Dark Sun Gwyndolin boosts the
    effects of all magic) *Light Manipulation (Via Sunlight Maggot) *Limited Probability
    Manipulation and Soul Manipulation (Via Symbol of Avarice) *Enhanced Resistance
    to Poison Manipulation, Fire Manipulation, Temperature Manipulation, Magma Manipulation,
    Explosion Manipulation, Electricity Manipulation, Magic, and Curse Manipulation
    (Every piece of Armor grants varying increased resistances to Magic, Fire, Lightning,
    Poison, and Curse) |-|Items= {{#tag:tabber| {{!}}-{{!}}Recovery Items= *Healing
    (Low-Mid, Estus Flask, Divine Blessing, Elizabeth''s Mushroom, Humanity, and Twin
    Humanities can instantly heal the Chosen Undead from wounds as severe as being
    impaled through the torso or having their skull pierced) *Power Nullification
    (Bloodred Moss Clump, Purple Moss Clump, Blooming Purple Moss Clump, Egg Vermifuge,
    Purging Stone, and Divine Blessing nullify the effects of Bleeding, Poison, Parasites,
    and Curses respectively, and Divine Blessing nullifies all of these effects other
    than Curses) {{!}}-{{!}}Offensive Items= *Transformation (Dragon Head Stone and
    Dragon Torso Stone transform the Chosen Undead into an Everlasting Dragon hybrid)
    *Damage Boost (Via Gold Pine Resin, Charcoal Pine Resin, and Rotten Pine Resin)
    *Electricity Manipulation (Via Gold Pine Resin) *Fire Manipulation (Via Dragon
    Head Stone, Charcoal Pine Resin, Firebomb, and Black Firebomb) *Sound Manipulation
    (Via Dragon Torso Stone) *Breath Attack (Via Dragon Head Stone) *Explosion Manipulation
    (Via Firebomb and Black Firebomb) *Poison Manipulation (Via Rotten Pine Resin,
    Dung'
