      to defeat the Gaping Dragon, which is capable of this, as well as the Bell Gargoyles
      and the Moonlight Butterfly) | Town level (Fought and defeated the Ceaseless
      Discharge, which is this powerful. Able to defeat the likes of Chaos Witch Quelaag,
      and the Iron Golem) | Small Country level (Fought and killed Manus, Father of
      the Abyss, Artorias the Abysswalker, Lord's Blade Ciaran, Black Dragon Kalameet,
      and Great Grey Wolf Sif. Clashed and won against an illusory clone of Ornstein,
      who is capable of fighting and killing Everlasting Dragons, which should be
      capable of feats equivalent to this. Able to acquire fully upgraded Standard
      Weapons, which are described as being on par with the greatest weapons of legend,Very
      Large Ember - Ember required for weapon ascension. Huge ember of highest quality.
      Handled by the blacksmiths of Astora. Ascension for +10 standard weapon. Allows
      reinforcement to +15, on par with the greatest weapons of legend. fully upgraded
      Divine Weapons, which are described as being on par with the weapons of the
      gods in power,Large Divine Ember - Ember required for weapon ascension. Large
      divine ember, of secret church rites. Intended for select divine blacksmiths.
      Ascends +5 divine weapon. Allows reinforcement to +10, on par with the very
      weapons of the Gods. and fully upgraded Dark Weapons, which are described as
      being used to hunt godsDark Ember - Ember required for weapon ascension. The
      church long hid the forbidden black ember, and no living blacksmith knows of
      it. Ascends +5 divine weapon to occult weapon. (occult weapons can be reinforced
      to +5) Occult weapons were used to hunt the gods, and are effective against
      their following and kin.) | Star level (Capable of fighting and defeating The
      Four Kings, Seath the Scaleless, Gravelord Nito, and Great Lord Gwyn)
