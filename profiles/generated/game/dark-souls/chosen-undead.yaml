- id: claim-weaknesses-5e677a73
  section: weaknesses
  axis: weakness
  text: 'The Chosen Undead can only attune up to 10 spells (12 if utilizing the White
    Seance Ring and Darkmoon Seance Ring) at a time and cannot attune new spells in
    combat Notable Attacks/Techniques: |-|Pyromancy= *Fireball: Standard pyromancy
    of the Great Swamp. Hurl a fireball with a very small blast radius. The fire damage
    caused by fireballs makes them effective against corporeal beasts and Undead,
    who by nature fear flame. *Fire Orb: Pyromancy which improves upon Fireball. Hurl
    fire orb. The flaming fire orb explodes upon impact, causing fire splash damage
    in a spectacle which seems to symbolize the strength of the fire-manipulating
    pyromancers. *Great Fireball: Ultimate fireball pyromancy. Hurl giant fireball.
    Salaman the Master Pyromancer, also called Great Fireball after this spell, believed
    pyromancy was rooted in an adoration of fire. Those who acquire this spell usually
    agree. *Great Chaos Fireball: Art of the Flame of Chaos, which engulfed the Witch
    of Izalith and her daughters. Hurl giant chaos fireball. The Flames of Chaos can
    melt stone, producing a short-lived lava glob. *Firestorm: Primal pyromancy taught
    by Quelana of Izalith. Erect fire pillars in vicinity. The storm of flame is indiscriminate,
    and incinerates all nearby life. *Fire Tempest: Primal pyromancy of Quelana of
    Izalith. Erect giant fire pillars in vicinity. The tempestuous raging flames resemble
    those summoned by the Daughters of Chaos when they challenged the ancient dragons
    and scorched the very earth. *Chaos Storm: Art of the Flame of Chaos, which engulfed
    the Witch of Izalith and her daughters. Erects localized chaos fire pillars and
    leave localized pools of lava in their wake. *Combustion: Elementary pyromancy.
    Create powerful flame in hand. One of the most basic pyromancies. For this very
    reason, the flame thus created is fierce. *Great Combustion: Pyromancy which improves
    upon Combustion. Create powerful, giant flame in hand. Great Combustion creates
    a powerful flame, but many sorcerers mock the simplicity of this spell. *Fire
    Surge: Pyromancy foreign of the Great Swamp. Creates a surge of flame from palm
    to hand. *Fire Whip: Primal pyromancy taught by Quelana of Izalith. Sweep foes
    with fire whip. The root pyromancy of Combustion, but much more difficult to wield.
    *Chaos Fire Whip: Art of the Flame of Chaos, which engulfed the Witch of Izalith
    and her daughters. Sweep foes with chaos fire whip. This spell was wielded by
    the eldest of The Daughters of Chaos. *Poison Mist: Unique pyromancy crafted by
    Eingyi, considered a heretic even at the Great Swamp. Create poison mist. *Toxic
    Mist: Unique pyromancy crafted by Eingyi, considered a heretic even at the Great
    Swamp. Create intense poison mist. *Acid Surge: Pyromancy foreign to the Great
    Swamp. Emit acid which corrodes weapons and armor. *Flash Sweat: Pyromancy of
    Carmina, who harnessed the power of flame to actualize the inner-self. Intense
    sweating reduces flame damage. *Iron Flesh: Pyromancy of Carmina, who harnessed
    the power of flame to actualize the inner-self. Iron flesh boosts defense and
    resilience. Use of this pyromancy requires caution, as the caster becomes exceedingly
    heavy and unable to move freely. *Power Within: Pyromancy of Carmina, who harnessed
    the power of flame to actualize the inner-self. Short strength/endurance boost,
    but lose HP. Excessive power eats away the life-force of its caster, and like
    all dangerous spells, Power Within was kept secret for eons. *Undead Rapport:
    Advanced pyromancy of Quelana of Izalith. Charm Undead and gain temporary allies.
    The living are lured by flame, and this relationship is part and parcel to the
    art of pyromancy. Can be used by either gender. *Black Flame: A pyromancy discovered
    from the Dark of the Abyss by a pyromancer who wandered Oolacile. Conjure a great
    black flame in one''s palm. Black flames are weighty, and inflict physical damage,
    enough to smack away the mightiest of the shields. |-|Sorcery= *Soul Arrow: Elementary
    sorcery. Fire a soul arrow. Soul arrows inflict magic damage, making them effective
    against iron armor, tough scales, and other physically resilient materials. *Great
    Soul Arrow: Sorcery which improves upon Soul Arrow. Fire strong soul arrow. At
    the Vinheim Dragon School, the acquisition of this spell marks an apprentice''s
    coronation as a sorcerer. *Heavy Soul Arrow: Soul sorcery emphasizing power. Fire
    heavy soul arrow. A more powerful, but also slower sorcery. Difficult to use due
    to a long cool down and a limitation on the number of castings. *Great Heavy Soul
    Arrow: Sorcery which improves upon Heavy Soul Arrow. Fire strong heavy soul arrow.
    As difficult to use as Heavy Soul Arrow, but powerful enough to make it well worth
    it. Adored by certain sorcerers. *Homing Soulma'
