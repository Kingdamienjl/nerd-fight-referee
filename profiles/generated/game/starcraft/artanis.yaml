- id: claim-weaknesses-fe1f54ba
  section: weaknesses
  axis: weakness
  text: 'While still linked to the Khala, Artantis was vulnerable to psionic corruption
    and possession. Artanis is prideful at times, and can be brash if provoked. Notable
    Attacks/Techniques: *Psionic Storm: Artanis can create disturbances in psionic
    energies in a target location, tearing them into a vicious storm. This storm attacks
    almost every aspect of an enemy, from mind, to body, to armor; it can quickly
    rip even a durable enemy apart from its core. *Lightning Dash: Artanis blinks
    a short distance instantly, attacking any enemy upon arrival and stunning any
    unkilled by the initial attack. *Resurgence: When Artanis is in a pinch, he can
    harness his psionic abilities to render himself invulnerable to damage for a short
    time, all the while healing himself and restoring his shields to maximum. Upon
    use, he releases a psionic wave that throws back all enemies, damaging them in
    the process. *Astral Wind: Unleashes a restorative wave of psionic energy, healing
    himself and his allies as well as recharging affected units'' shields. *Force
    of Will: Artanis'' advanced armor and heightened psionic power allow him to gain
    back his shields three times faster than normal as well as slowly regenerating
    his life and healing his wounds. ==Notable Matchups== Victories: Losses: Inconclusive:
    {{Discussions}} Category:Characters Category:StarCraft Category:Male Characters
    Category:Game Characters Category:Energy Users Category:Telepaths Category:Healers
    Category:Forcefield Users Category:Aliens Category:Regeneration Users Category:Energy
    Weapon Users Category:Science Fiction Characters Category:Good Characters Category:Teleportation
    Users Category:Leaders Category:Matter Users Category:Mind Users Category:Military
    Characters Category:Protagonists Category:Longevity Users Category:Freedom Fighters
    Category:Knights'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
