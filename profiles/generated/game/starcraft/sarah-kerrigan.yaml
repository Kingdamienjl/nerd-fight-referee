- id: claim-powers-and-abilities-134caddb
  section: abilities
  axis: hax
  text: Ghost Operative= Superhuman Physical Characteristics, Weapon Mastery, Martial Arts, Energy Manipulation,
    Durability Negation, Electricity Manipulation and Technological Manipulation with EMP and Lockdown
    Rounds, Gravity Manipulation all Terran ground units have self gravity adjusters installed for travelling
    different planets and space platforms, Invisibility, Stealth Mastery, Hacking, Telekinesis all Terrans
    with a Psi Index of 8-10 can use Telekinesis, Can naturally detect the presence of nearby psionics
    and can detect others with the Ghost Visor, Telepathy, Resistance to Telepathy, heat, chemical, nuclear,
    and biological radiation |-|Queen of Blades= All previous abilities further enhanced, Absorption,
    Flight, Regeneration (Low-Mid), Healing, Status Effect Inducement (Can slow down and impair movement),
    Durability Negation via Psionic Storm, Matter Manipulation on an atomic level via Psionic Storm, Summoning
    (Can call forth various Zerg to aid her), Gravity Manipulation via Implosion, Biological Manipulation
    (Can manipulate microbes to shred a target or spread a hyperevolutionary virus), Mind Manipulation
    (Can destroy minds with Psionic Storm or control billions over planetary distances), Portal Creation
    (As her Swarm's hivemind, he is capable of opening a portal to War Space to move herself and her army
    over interstellar distances) |-|Primal Queen of Blades= All previous abilities, Resistance to Mind
    Manipulation (After being purified of Amon's influence, she was now able to resist his manipulation)
    |-|Xel'Naga= All previous greatly enhanced, Teleportation, Perception Manipulation (Was able to make
    Jim Raynor perceive her as her human self and say her goodbyes), Regeneration (Low-Godly) (As a Xel'naga,
    she must be killed in the Void or have her soul destroyed to die)
  source_ids: *id003
