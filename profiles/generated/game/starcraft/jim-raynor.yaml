- id: claim-weaknesses-cfd04eef
  section: weaknesses
  axis: weakness
  text: 'Armor piercing weaponry can make short work of a Marine; if the Marine''s
    blast visor is not down, their helmet is vulnerable to explosions; a Stimpack
    will damage the user. Notable Attacks/Techniques: *Deploy Breaching Charge: Jim
    Raynor plants an explosive device on a destructible doodad. After a brief delay,
    it explodes, doing minimal damage in an area of effect and destroying the doodad.
    *Experimental Plasma Gun: Jim Raynor can only use this ability after picking up
    ammunition for the weapon. A shot deals damage to its target. *Chrono-rift Device:
    Jim Raynor charges of this kind of device to act as a sort of "time bomb" that
    slows down all targets in the devices'' blast zone. ==Notable Matchups== Victories:
    Losses: Inconclusive: {{Discussions}} Category:Characters Category:StarCraft Category:Criminals
