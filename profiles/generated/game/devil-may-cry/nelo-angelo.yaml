      enough to even defeat Mundus, who was weakened at that time, only losing to
      him because of his wounds from his last fight against Dante.1.53449 Zettafoe),
      higher with Force Edge (The sword is capable of giving Vergil another portion
      of Sparda''s power,Devil May Cry 5 Before The Nightmare matched Dante by the
      end of the game). His attacks with Yamato ignore conventional durability | Low
      Complex Multiverse level (Matched Dante in Devil May Cry 1 on skills and powerDevil
      May Cry Brady Guide- Page 6 and was stated to be stronger than him on their
      first encounterDevil May Cry Kaitai Shinsho while also being capable of killing
      him at the same time,Devil May Cry Memorial Album Precious Tears: Page 38 and
      was also stated to be growing stronger and more skilled in each fightDevil May
      Cry Memorial Album Precious Tears: Page 79 and when he removed his dark helmet,
      Nelo Angelo''s vision and reaction speed increased.Devil May Cry Brady Guide-
      Page 12425 Universes) | Low Complex Multiverse level (As Urizen, he effortlessly
      defeated early game Dante and Nero. Later as such he ate the Qliphoth Fruit,
      the source of Mundus''s powers.Devil May Cry 5 (2019)- Mission 17 After being
      fully revived, he could fight on equal terms with late-game Dante after he awakened
      his own Sin Devil Trigger), higher with Sin Devil Trigger. His attacks with
      the Yamato ignore conventional durability'
