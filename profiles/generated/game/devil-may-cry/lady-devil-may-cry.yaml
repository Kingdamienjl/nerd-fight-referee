- id: claim-powers-and-abilities-eea65ee6
  section: abilities
  axis: hax
  text: 'DMC 3= * Superhuman Physical Characteristics * Acrobatics (Dodged several scythe attacks by side
    rolling and jumping, balanced herself on a thin bar and then jumped to another bar while holding herself
    with only 1 armDevil May Cry 3: Opening cutscene of Mission 6) * Weapon Mastery (Lady has shown proficiency
    with several weapons and is shown to be quite accurate with them, such as when she was able to shoot
    at Dante with Kalina Ann without looking at himDevil May Cry 3: Ending cutscene of Mission 3 hit multiple
    targets while being engaged in melee with them,Devil May Cry 3: Opening cutscene of Mission 6 tactically
    reloading all of her guns while in the middle of battle against multiple opponentsDevil May Cry 3:
    Ending cutscene of Mission 9 and hitting 3 targets easily with a single bullet for eachDevil May Cry
    3: Ending cutscene of Mission 20 and Epilogue) * Martial Arts (Kicked several demons pretty easilyDevil
    May Cry 3: Opening cutscene of Mission 6) * Explosion Manipulation (With Grenades and Kallina AnnDevil
    May Cry 3: Opening cutscene of Mission 6) * Homing Attack & Danmaku (With Hysteric, which launches
    several mini missiles that softly lock on targetsDevil May Cry 3: Misson 17 Lady Boss Fight) |-|Devil
    May Cry: The Animated Series= Same as before, plus: * Enhanced Weapon Mastery (Was able to shoot the
    tire of a moving bike with a single shot while driving her own motorcycle from very far away,Devil
    May Cry: The Animated Series Episode 2 shot Trish''s bullets and would later shoot a grenade that
    was thrown by herselfDevil May Cry: The Animated Series Episode 4) * Enhanced Martial Arts (Was capable
    of disarming and holding her own against a casual Trish in hand-to-hand combat, despite being physically
    weakerDevil May Cry: The Animated Series Episode 4) * Vehicular Mastery (Able to balance herself on
    her motorcycle while shooting both of her pistols, jump off of it while it remains on its course,
    and land back on top of it while moving at high speedsDevil May Cry: The Animated Series Episode 2)
    * Homing Attack (Kalina Ann''s normal missile can softly lock on and seek targetsDevil May Cry: The
    Animated Series Episode 4) |-|DMC 4-5= Same as before, plus: * Enhanced Weapon Mastery (Can easily
    shoot multiple enemies while standing on the ground with her handguns, use her shotgun as a nunchuck
    to shoot enemies pretty easily and throw explosives around her in a way only enemies are hurt by the
    explosion and incoming shrapnelDevil May Cry 4: Special Edition) * Enhanced Acrobatics (Can jump on
    walls and enemies, as well as use Kalina Ann to gain more distance while in the airDevil May Cry 4:
    Special Edition) * Fire Manipulation & Explosion Manipulation for her handguns (With Napalm Shot and
    Explosion Shot respectively, the former which sets enemies at blaze while the latter makes her bullets
    explode after some timeDevil May Cry 4: Special Edition) * Enhanced Danmaku (Hysteric shootsDevil
    May Cry 4: Special Edition much more missiles nowDevil May Cry 5) * Enhanced Homing Attack (With Multiple,
    Lady can more accurately lock on targets,Devil May Cry 4: Special Edition and Kalina Ann''s missiles
    turn much more effectively nowDevil May Cry 5; and Paranoia, which locks all missiles from Multiple
    into a single targetDevil May Cry 5) |-|Resistances= * Empathic Manipulation, Fear Manipulation, Mind
    Manipulation & Madness Manipulation (Types 2 & 3; Casually fights demons, whose presence can cause
    fear, despair, insanity,Devil May Cry Volume 1 Page 137Devil May Cry Volume 2 Page 138 and 188Devil
    May Cry 5 Visions of V Chapter 14.2 and madnessDevil May Cry 1 Brady Guide Page 114 to the point of
    self-harm and suicideDevil May Cry Volume 1 Pages 114-116)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
