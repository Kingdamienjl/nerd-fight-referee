- id: claim-standard-equipment-460c8c4b
  section: equipment
  axis: equipment
  text: 'Kalina Ann DMC4SE.webp|Kalina Ann Lady Handguns DMC4SE V2.webp|Hanguns Lady''s Submachine Gun.png|Submachine
    Gun Coyote-A DMC4.webp|Shotgun |-|DMC 3-Devil May Cry: The Animated Series= *Kalina Ann: Lady''s signature
    weapon, named after her mother, is a customized missile launcher with a big bayonet on top of its
    barrel that can be used as a grappling hook. Lady uses it as a firearm at long distances, as a melee
    weapon in close combat and uses its grappling hook to reach longer distances or even to latch into
    enemies. It fires large rockets out of its barrel, a barrage of smaller target-seeking rockets out
    of the launchers on the base, as well as being able to charge it''s main missiles in later installments.
    *Handguns: Lady has 3 handguns, which are loaded with 9mm ammunition. *Submachine Gun: Lady has small
    submachine guns with a small bayonet attached to it. *Grenades: Lady has access to some grenades.
    *Motorcycle: In Devil May Cry 3 and Devil May Cry: The Animated Series she owns a motorcycle. The
    first one gets destroyed by Dante. The motorcycle she rides in the anime is a red 1974 Ducati 750
    Supersport. |-|DMC 4-5= All of the previous equipment *Shotgun: A shotgun custom made for demon hunting
    that uses various kinds of buckshot to deal damage over a wide area. **000 Buckshot: A larger, stronger
    ammo Lady uses for her shotgun **Flechette Shot: Piercing and stronger ammo for Lady''s shotgun **Shredder
    Shot: The strongest ammo Lady uses for her shotgun *Hollow Point ammo: A stronger ammo Lady uses for
    her handguns *Napalm Shot: Incendiary rounds for Lady''s handguns *Explosion Shot: Bullets that Lady
    uses for her handguns, explode a few seconds after being shot *High Explosive Missile: A stronger
    missile then the standard ones used by Kalina Ann *Full Blast Missile: An even stronger missile for
    Kalina Ann *Maximum Burst Missile: The strongest missile available for Kalina Ann'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
