- id: claim-weaknesses-f4c765fc
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks and Techniques: |-|DMC 3-Devil May Cry: The Animated Series= *Hysteric:
    Lady launches several small missiles from the base of Kalina Ann, all of which have some form of homing
    technology. Becomes faster and more numerous in DMC 4 and DMC 5. *Grapple: Lady has a grappling hook
    attached to Kalina Ann which allows her to climb far distances or even use it to bring enemies closer
    to her |-|DMC 4-5= All previous attacks and techniques *Two Hand: Lady sends enemies flying, which
    she then follows up by a pummeling nearby enemies with her guns with her precise accuracy *Trigger
    Happy: Lady stays in position and send a barrage of shots with both of her pistols until her ammo
    runs out *Double Barre'
  source_ids: *id003
  decisive: false
  status: unverified
