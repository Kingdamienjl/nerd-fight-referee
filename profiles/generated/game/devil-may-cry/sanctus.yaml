- id: claim-weaknesses-31ad0499
  section: weaknesses
  axis: weakness
  text: "Can underestimate those who are mortals, will succumb to the Demon King and corrupt if unable\
    \ to stop its resurrection. Notable Attacks/Techniques: Solo Hissatsu: *Heaven\u2019s Drive: Sein\u2019\
    s signature shoot hissatsu, of which he kicks a soccer ball through dark summoned storm clouds, trailing\
    \ a staircase and sending it to Heaven. The ball then comes back down surrounded by massive spherical\
    \ light energy, to which crashes down and heads straight for the goal. This shoot was able to easily\
    \ break through Ijigen the Hand Kai, and was capable of damaging Edgar Valtinas in direct contact.\
    \ *Excalibur: A shoot hissatsu, of which Sein\u2019s aura is projected with the holy sword Excalibur\
    \ that appears from his foot. Once striking the ball with this sword, the sword rends the field in\
    \ two and is shot directly at the goal. The further away it is from a target, the stronger the shot\
    \ becomes and therefore the power varies from different ranges. *Angel Ball: A dribble hissatsu, of\
    \ which Sein kicks the ball and make sit grow wings and a halo. The ball will then be given life,\
    \ as it flutters around the opponents and can be controlled by him. The wings will disappear once\
    \ Sein is able to kick it again. *Ultra Moon: A dribble hissatsu, of which Sein acrobatically flips\
    \ over the opponent with the ball trapped between his feet as a large moon projection appears in the\
    \ sky, in order to get past the defense. *Saints Flash: A Hissatsu tactic used by the Tenkuu no Shito,\
    \ of which Sein is able to directly amp his speed within the match temporarily. Though not shown in\
    \ the anime, it is the opposite to Black Thunder, a tactic that instead slows the opponents to the\
    \ point it appears that time is stopped and lightning is static, and can therefore be assumed to able\
    \ to amp their speed to the degree that Black Thunder slows. Combination Hissatsu: *Shadow Ray: A\
    \ combination shoot hissatsu shot by Sein and Desuta, which combines both of their power of Dark Matter\
    \ and Heaven\u2019s Drive. Desuta spins the ball as Sein kicks it towards the goal in a stream of\
    \ light and dark energy. This hissatsu easily broke through Ijigen the Hand Kai, and initially required\
    \ weakening from both Kabeyama\u2019s The Mountain and Tobitaka\u2019s Shinkuuma in order for Endou\
    \ to stop it with his hissatsu. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}}\
    \ Category:Characters Category:Male Characters Category:Anime Characters Category:Inazuma Eleven Category:Athletes\
    \ Category:Angels Category:Immortals Category:Possessed/Brainwashed Characters Category:Captains Category:Energy\
    \ Users Category:Aura Users Category:Flight Users Category:Weather Users Category:Air Users Category:Electricity\
    \ Users Category:Mind Users Category:Sleep Users Category:Light Users Category:Holy Users Category:Statistics\
    \ Amplification Users Category:Teleportation Users Category:Soul Users Category:Kick-based Fighters\
    \ Category:Ball Users Category:Subjective Reality Users Category:Empowerment Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-02f926d1
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Soccer Mastery *Accelerated Development & Reactive Evolution\
    \ (Players in Inazuma Eleven continuously get stronger and improve their abilities through ever soccer\
    \ match they play) *Empowerment (Emotional - As their love for soccer grows, their physical stats\
    \ and hissatsus are able to evolve in mid-game) *Wind Manipulation (His movements and hissatsu are\
    \ able to easily conjure strong gusts of wind) *Pseudo-Flight (Can launch himself high into the air\
    \ for his hissatsu techniques and remain there for a while) *Limited Subjective Reality (The shape\
    \ and form of Hissatsus are based on bringing imagination to reality) *Energy Manipulation & Energy\
    \ Projection (Via Hissatsu) **Light Manipulation (Via Heaven Drive) **Statistics Amplification (Speed\
    \ - via Saint Flash) *Weather Manipulation & Teleportation (Summoned a large storm that spread over\
    \ most of Liocott Island. He also appears to be able to teleport after lightning strikes, as well\
    \ as instantly being able to return to Heaven\u2019s Gate after he abducted Rika) *Mind Control &\
    \ Sleep Inducement (Hypnotized Rika and made her fall asleep instantly with a gentle tap of his finger\
    \ on her forehead) *Holy Manipulation *Possible Soul Manipulation (Mainly in his Dark Angel form,\
    \ he claims to be able to steal and consume souls from other people. However, it seems he would only\
    \ do this once his opponent has been defeated (in a game of soccer), or could possibly require the\
    \ souls he consumes to be 'first-class' to his liking) *Possible Immortality (Type 1) *Alternate Self\
    \ Resonance (When parallel world versions of Inazuma Eleven characters are created through new timelines,\
    \ those versions will resonate with the original, boosting their overall abilities and development\
    \ of techniques temporarily until the main timeline has fixed itself out Inazuma Eleven GO Chrono\
    \ Stone - Episode 3Inazuma Eleven GO Chrono Stone - Episode 6)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
