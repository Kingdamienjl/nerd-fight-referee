    against his kind, he utilized it to strike down the whole legions along with numerous
    Demon Lords (including Mundus himself). The sword''s power was later used to seal
    the gate between the Human World and the Underworld. *Yamato: A mighty weapon
    once wielded by Sparda. It''s so supernaturally sharp that it can cut through
    the dimensional walls and barriers. It was also used to seal away demons to prevent
    them from entering the Human World. *Luce & Ombra: A pair of personally customized,
    semi-automatic pistols once crafted wielded by the Dark Knight Sparda, which were
    designed to rapidly fire bullets.'
