- id: claim-powers-and-abilities-b081d09f
  section: abilities
  axis: hax
  text: '*High Level Demon Physiology and Sparda''s Bloodline "Post-Awakening" *Analytical
    Prediction (Gilver, who has the combat data of Sparda and his sons, can detect
    patterns behind opponent''s attack in an instant and read all his moves, enabling
    him to narrowly avoid every one of them). *Weapon Mastery *BFR *Time Stop and
    Power Nullification via Sealing (Is capable of sealing demons or dimensions,Devil
    May Cry 3 Code 1Devil May Cry 3 Code 2Devil May Cry 5 (2019)- History of DMC this
    ability also sends the target to the Demon World and removes their powers. The
    seal is capable of prohibiting demons on a certain level of power from passing
    through there using their consciousness, since despite lesser demons being capable
    of sending their consciousness to the Human World to possess things,Devil May
    Cry 5 Before The Nightmare Page 49-51 this is something that the high-ranking
    demons can''t do, since they have some problems, one of those beingDevil May Cry
    5 Before The Nightmare- Page 226-227 because of their powersDevil May Cry 5 Before
    The Nightmare Page 232 being unable to pass through the gaps, requiring large
    portals to successfully pass through.Devil May Cry Kaitai Shinsho Guidebook Vergil
    and Dante eventually sealed the Qliphoth roots'' portal with the Yamato to stop
    the roots from tearing Red Grave City apart and from merging the Demon World with
    the Human World.Devil May Cry 5 (2019)- Mission 20 When Sparda sealed the Demon
    World, time stopped in it) *Fire Manipulation, Space-Time Manipulation, Durability
    Negation, Weapon Creation, Forcefield Creation, Portal Creation, Resurrection,
    Summoning, Memory Manipulation, Power Nullification and Conceptual Manipulation
    (Type 1) (With Yamato, the Yamato''s blade is sharp enough to cut through dimensions,Devil
    May Cry 4 Deadly Fortune Page 183-184 can create magical swords,Devil May Cry
    4 Special Edition (2014)Devil May Cry 5 (2019) is capable of creating a shield
    to protect the user,Devil May Cry 5 (2019)- PrologueDevil May Cry 5 (2019)- Mission
    8Devil May Cry 5 (2019)- Mission 10Devil May Cry 5 (2019)- Mission 11Devil May
    Cry 5 (2019)- Mission 12 can create portals,Devil May Cry 4 (2008)- Mission 18
    was capable of resurrecting NeroDevil May Cry 4 (2008)- Mission 6 and the sword
    also came to help Vergil when he was a kid.Devil May Cry 5 Visions Of V Chapter
    26 Sanctus used it to nullify Nero''s power and his resistance to absorption,
    allowing the Saviour to absorb him Can separate man from demon and power from
    heart, can change people''s memories and give them a physical formDevil May Cry
    5 Visions Of V Chapter 1 and can also be used to separate Nero from the SaviorDevil
    May Cry 4 Deadly Fortune Volume 2 Page 138 as seen when Dante threw the sword
    into the chest of the Savior,Devil May Cry 4 (2008)- Mission 19 since Nero''s
    body and soul was absorbedDevil May Cry 4 Deadly Fortune Volume 1 Page 214-215
    and melted together with the others bodies and souls inside the SaviorDevil May
    Cry 4 Deadly Fortune Volume Page 142-143Devil May Cry 4 (2008)- Enemy Files: The
    Savior and becoming one single existence with him when he fought against Sanctus
    and the Savior in the Advent ChamberDevil May Cry 4 (2008)- Mission 11) *Electricity
    Manipulation *Darkness Manipulation |-|Resistances= *High Level Demon Physiology
    and Sparda''s Bloodline "Post-Awakening" *Resistance to Sealing (With Yamato,
    it can cut through and create portals between the Human World and the Demon World,Devil
    May Cry (2001)- Weapon Files: YamatoDevil May Cry 3 Code 1Devil May Cry 4 (2010)-
    Mission 10 said dimensions had their connection sealed by Sparda in the past,Devil
    May Cry 5 (2019)- History of DMC and since Sparda sealed the dimensions in the
    past, demons are no longer able to travel between the Demon World and the Human
    WorldDevil May Cry 5 (2019)- Documents: The QliphothDevil May Cry 5 (2019)- Nico''s
    Reports: Hell Caina)'
