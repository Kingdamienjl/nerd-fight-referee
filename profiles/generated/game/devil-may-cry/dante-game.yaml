  stamina:
    text: Superhuman (As a Demon, Dante can last hours in battle without pause, can
      fight entire hordes of demons and fights against Demon Bosses without rest or
      relevant signs of fatigue, only showing it in prolonged fights against those
      who were comparable to him, and then showed to only need mere seconds to recover.
      Dante showed to only need mere seconds to recover after combatDevil May Cry
      Volume 1 Page 135 and he can also recover his stamina and energy when he is
      in Devil Trigger in middle of combatDevil May Cry Deadly Fortune Volume 2 Pages
      193-194) | Superhuman (Both Dante and VergilDevil May Cry 5 (2019)- Mission
      19Devil May Cry 5 (2019)- Mission 20 fought against each other for 39 days straight
      in the Underworld from June 15 to July 24 while having extremely short breaks)
    source_ids:
    - mediawiki-dante-game
    confidence: 0.6
    notes: auto_repair source extraction
  range:
