      (Alastor was able to sense Nelo Angelo''s presence despite him being in the
      mirror dimension) | Varies from Extended Melee Range to Tens of Meters with
      projectiles and at least Interdimensional, Low Complex Multiversal with Sensing
      (Can sense killing intent from another dimensionDevil May Cry Memorial Album
      Page 176) | Varies from Extended Melee Range to Tens of Meters with projectiles
      and energy attacks (His Devil Trigger Explosion destroyed the top of a skyscraperDevil
      May Cry: The Animated Series (2007)- Episode 12) | Varies from Extended Melee
      Range to Tens of Meters with projectiles and energy attacks, at least Hundreds
      of Meters with Space-Time Manipulation (Dante''s imperfect technique can cut
      the Hell''s Gate from a far distance) and Low Complex Multiversal with Portal
      Creation via Yamato (Can create portals in the Demon World while in the Human
