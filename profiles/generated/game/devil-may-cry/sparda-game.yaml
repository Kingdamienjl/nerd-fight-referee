      in the Human World, even in the form of broken shards, as seen when both DMC2
      Dante and Balrog used them to escape the Demon World back into the Human WorldDevil
      May Cry 5 Before the Nightmare- Pages 49-52, 79 and 80)'
    source_ids:
    - vsbattles-sparda-game-devil-may-cry
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Extraordinary Genius |-|General= The Sparda bloodline are almost perfect
      beings capable of achieving anything, conquering tasks they had yet to master
      in a few seconds and mastering any moveset in mere moments of observation.Devil
      May Cry: Peak of Combat Gilver, a clone of Vergil, became familiar with a gun
      in seconds despite not knowing much about firearms and be uncomfortable with
      them in the first place.Devil May Cry: Volume 1 Dante can blend art and science
      in his movesets and has shown to be able to quickly master all the objects,
      weapons and vehicles he uses. |-|Swordsmanship= Was widely known as the strongest
      swordsman in the Demon World and single-handedly defeated Mundus'' legions using
      only a sword. He was the teacher of Baul and Modeus and also taught Dante and
      Vergil. With Sparda''s skills, Chen overwhelmed Dante in single combat.'
