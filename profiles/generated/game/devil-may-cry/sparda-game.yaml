  range:
    text: 'Varies from Extended Melee Range to Tens of Meters with projectiles and
      energy attacks (Scales to Dante, who Devil Trigger Explosion destroyed the top
      of a skyscraperDevil May Cry: The Animated Series (2007)- Episode 12). and at
      least Interdimensional, Likely Low Complex Multiversal with Sensing (Scales
      to Dante, who sensed Vergil on top of the Temen-ni-gruDevil May Cry 4 Prima
      Guide Book Recap- DMC3 and also scales to Vergil, who was able to sense Lady''s
      presence when she entered the Temen-ni-gruDevil May Cry 3 (2005)- Mission 4
      and Dante was also show to be able to sense killing intents from another dimension),
      Low Complex Multiversal with Dimensional Travel (Can travel between the Demon
      World and the Human World and can also get out of Fault''s body, which is another
      dimensionDevil May Cry 4 Prima Guide Page 46- Bestiary Section: Fault), likely
      at least Hundreds of Meters with Space-Time Manipulation (Should scale to Dante,
      who after making a imperfect technique was capable to cut the Hell''s Gate from
      a far distanceDevil May Cry 4 (2008)- Mission 17) and Low Complex Multiversal
