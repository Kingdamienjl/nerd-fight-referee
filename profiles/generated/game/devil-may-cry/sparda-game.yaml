  attack_potency:
    text: 'At least Multi-Solar System level (Before awakening to justice and helping
      the humans against the demons, Sparda was Mundus''s right and left hand, and
      was also one of the very reasons why Mundus became a Demon King in the first
      place. Superior to other Mundus generals) | Low Complex Multiverse level (With
      the entirety of his powers, Sparda singlehandedly defeated Mundus at his full
      power25 Universes and his Demon Army. Separated the Human World and the Demon
      World once more after they were fused by Mundus, and placed seals binding the
      Demon World to prevent the reoccurrence of such an event; said seals were maintained
      by his raw power. Massively superior to his previous self, he grew stronger
      just by existing to the point that he feared his own powers, eventually deciding
      to seal a good portion of it, created and sealed a good portion of his powersDevil
      May Cry 3 (2005) - Character: Sparda into the Rebellion, Yamato and Devil Sword
      Sparda. With the power given by the Devil Sword Sparda, which holds a considerable
      portion of his powersDevil May Cry 5 (2019) - Documents: The Legend of Sparda,
      but not the entirety of it, Dante was able to fight against and eventually defeat
      Mundus, and also sealed him away in a gap between the Human World and Demon
      WorldDevil May Cry 4 Deadly Fortune Volume 2- Stage 16 when Dante was unable
      to permanently kill him. He was also stated to possess boundless and seemingly
      infinite power). Can ignore durability with Yamato | Low Complex Multiverse
      level (While weakened, he fought and eventually defeatedDevil May Cry 3142 Graphic
      Arts: Page 161 Bolverk, who was his nemesis at that time,DEVIL MAY CRY 2 BradyGatmes®
      Official Strategy Guide: Mission 16: Page: 80 and also defeated and sealed Argosax
      the Chaos, albeit with help from the Vie de Marli clan of sorcerers. Fought
      and sealed all the Demon Kings). Can ignore durability with Yamato'
    source_ids:
    - vsbattles-sparda-game-devil-may-cry
    confidence: 0.6
    notes: auto_repair source extraction
