power_scale:
  tier:
    text: At least {{8-C}}, far higher after taking his name back | At least {{7-B}}
      | {{4-C}}, up to at least {{4-A}}, higher with Force Edge | {{Low 1-C}}, higher
      with Devil Sword Sparda | {{Low 1-C}}, higher with Devil Trigger | {{Low 1-C}},
      higher with Devil Trigger | {{Low 1-C}}, higher with Devil Trigger | {{Low 1-C}},
      higher with Sin Devil Trigger
    source_ids: &id002
    - mediawiki-3077
    confidence: 0.95
  attack_potency:
    text: 'At least Building level (Physically is far superior to most lesser demons,
      which can tear humans apart and easily wreck cars with a single strikeDevil
      May Cry 5 (2019)- Mission 3 and they can also easily withstand every modern
      weapon created in the Human World,Devil May Cry 5 Before The Nightmare Epilogue
      Pages 316-317 vastly superior to demons like Blitz. Vastly superior to Black
      Knights which were created by Mundus to be one of his strongest servants among
      fodder minions, made with data gathered after carefully studying how Dante,
      Vergil and Sparda fightDevil May Cry 5 Before The Nightmare: Chapter 13: Trish:
      Page 227 and 228>0.3824 Tons), far higher after taking his name back (Massively
      superior to his "Tony" persona and is equal to Gilver when he is without his
      armor, and eventually grew strong enough to match him with his armor and while
      he was being amped by the NexusDevil May Cry Volume 1: Phrase 4: Page 175-184)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively Hypersonic+ (Superior to Blitz. Can perceive and counter a lot
      of Gilver's moves, which can't be perceived by normal humansDevil May Cry Volume
      1 Phrase 2 Pages 60-61)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'Class K (Dante in his earlier days as a mercenary was capable of casually
      ripping out spines,Devil May Cry Volume 1: Phrase 3: Page 126 which requires
      at least this amount of force. Comparable to Nero, who can lift and swing around
      demons such as BerialDevil May Cry 4 (2008)- Mission 2 and BaelDevil May Cry
      4 (2008)- Mission 4 with little difficulty. Clashed with Gilver multiple times101.97162
      Metric Tons)'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At least Building level, far higher after taking his name back (Comparable
      to Gilver)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least Building level (Physically far superior to most lesser demons,
      which can easily withstand every modern weapon created in the Human World),
      far higher after taking his name back (Took multiple attacks from Gilver) |-|DMC
      3 (Pre-DT)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (As a Demon, Dante can last hours in battle without pause, can
      fight entire hordes of demons and fights against Demon Bosses without rest or
      relevant signs of fatigue, only showing it in prolonged fights against those
      who were comparable to him, and then showed to only need mere seconds to recover.
      Dante showed to only need mere seconds to recover after combatDevil May Cry
      Volume 1 Page 135 and he can also recover his stamina and energy when he is
      in Devil Trigger in middle of combatDevil May Cry Deadly Fortune Volume 2 Pages
      193-194) | Superhuman (Both Dante and VergilDevil May Cry 5 (2019)- Mission
      19Devil May Cry 5 (2019)- Mission 20 fought against each other for 39 days straight
      in the Underworld from June 15 to July 24 while having extremely short breaks)
    source_ids: *id002
    confidence: 0.95
  range:
    text: 'Extended Melee Range normally, Tens of Meters with projectiles, Kilometers
      with Sensing (Dante from kilometers away in the city senses Vergil on top of
      Temen-Ni-Gru which erupts in middle of the city,Devil May Cry 4 Prima Guide
      Book Recap- DMC3 scales to Vergil, who was able to sense Lady''s presence when
      she entered the Temen-ni-gruDevil May Cry 3 (2005)- Mission 4), Low Complex
      Multiversal with Dimensional Travel (Can travel between the Demon World and
      the Human World and can also get out of Fault''s body, which is another dimensionDevil
      May Cry 4 Prima Guide Page 42- Bestiary Section: Fault) | Varies from Extended
      Melee Range to Tens of Meters with projectiles, and Interdimensional with Alastor
      (Alastor was able to sense Nelo Angelo''s presence despite him being in the
      mirror dimension) | Varies from Extended Melee Range to Tens of Meters with
      projectiles and at least Interdimensional, Low Complex Multiversal with Sensing
      (Can sense killing intent from another dimensionDevil May Cry Memorial Album
      Page 176) | Varies from Extended Melee Range to Tens of Meters with projectiles
      and energy attacks (His Devil Trigger Explosion destroyed the top of a skyscraperDevil
      May Cry: The Animated Series (2007)- Episode 12) | Varies from Extended Melee
      Range to Tens of Meters with projectiles and energy attacks, at least Hundreds
      of Meters with Space-Time Manipulation (Dante''s imperfect technique can cut
      the Hell''s Gate from a far distance) and Low Complex Multiversal with Portal
      Creation via Yamato (Can create portals in the Demon World while in the Human
      World,Devil May Cry (2001)- Weapon Files: YamatoDevil May Cry 3 Code 1Devil
      May Cry 4 (2010)- Mission 10 and vice versa, as seen when Dante used a broken
      Yamato shard to escape the Demon World and return back into the Human World
      after the events of Devil May Cry 2Devil May Cry Before the Nightmare: Chapter
      2 Pages 49-52 and Chapter 4 Pages 79-80) | Varies from Extended Melee Range
      to Tens of Meters with projectiles and energy attacks and Planetary with Shockwaves
      (Can create powerful shockwaves sufficient to shake the planet Earth) {| cla'
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Extraordinary Genius |-|General=The Sparda bloodline are almost perfect
      beings capable of achieving anything, conquering tasks they had yet to master
      in a few seconds and mastering any moveset in mere moments of observation.Devil
      May Cry: Peak of Combat Gilver, a clone of Vergil, became familiar with a gun
      in seconds despite not knowing much about firearms and be uncomfortable with
      them in the first place.Devil May Cry: Volume 1 Dante can blend art and science
      in his movesets and has shown to be able to quickly master all the objects,
      weapons and vehicles he uses. |-|Swordsmanship= Pre-DMC2: Inherited Sparda''s
      swordsmanship. Easily defeated the Black Knights, demons made with Sparda and
      the twin''s combat data, and fought Gilver, the most powerful of them. Fought
      Vergil several times. Easily defeated Baul and Modeus. Held his own against
      Chen, who had precognitive powers and Sparda''s skills. Post-DMC2: Surpassed
      Sparda''s swordsmanship. Fought Vergil several times again. Defeated Bolverk
      twice, who was Argosax''s most skilled fighter and a rival of Sparda.'
    source_ids: *id002
    confidence: 0.95
