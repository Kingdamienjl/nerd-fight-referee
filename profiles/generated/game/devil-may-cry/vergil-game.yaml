        Vergil''s skill in hand-to-hand combat. Lunar Phase and Beowulf Combo B. |-|Force
        Edge= centre|thumb|200px|Devil May Cry 3: Special Edition, Devil Arms File
        — Force Edge: "A sword magically imbued with Sparda''s power. A powerful sword
        with great hidden potential." A blade similar in power to Rebellion. It is
        the sealed form of the sword wielded by Sparda himself; Vergil dual-wields
        it with Yamato in combat. Vergil is capable of throwing the Force Edge with
        such power; it creates a whirlwind vacuum and sucks any enemies in carving
        them up. Vergil is also capable of stabbing at tremendously high speeds with
        this weapon. Vergil can also use energy slashes when wielding Force Edge.
        |-|Summoned Swords= centre|thumb|150px| Devil May Cry 4, Yamato — Summoned
        Swords: "Summon a magical blade and fling it towards a foe, piercing the enemy
        through sheer force of will. Vergil conjures a spectral sword that bears a
        resemblance to Force Edge and launches it at high speeds against his enemies.
        Vergil is skilled in their usage circling himself with the blades and being
        able to shoot them out afterward if he wants, being able to summon them to
        surround an enemy eventually impaling them and making them rain towards an
        enemy also. He has also shown that he can create swords of different sizes
        and can wield one himself. |-|Mirage Edge= centre|thumb|250px| Devil May Cry
        5: Special Edition, Mirage Edge: A weapon shaped from Vergil''s own infernal
        energy. There''s something about this blade—its shape and attacks—that resembles
        Force Edge, the sword his father wielded so long ago. Vergil conjures a spectral
        sword that bears a resemblance to Force Edge, except this time to use for
        offensive combat instead of using it as a ranged projectile, dual-wielding
        it alongside Yamato. Vergil uses it in the same exact manner as he used the
        Force Edge, using it as a replacement. |}'
