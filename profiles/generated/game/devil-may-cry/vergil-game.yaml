        anyone caught in it to shreds. Vergil can also send multiple Judgement Cuts
        in rapid succession. * Judgement Cut End: A more powerful variation of Judgement
        Cut, where Vergil readies up his sword and then moves forward at such speeds
        to leave after-images behind. Such a move allows him to cover the area in
        his slashes, allowing him to take out large numbers of enemies in one full
        sweep. Hell on Earth: By concentrating his demonic/magic powers on his hand
        and slamming than in the ground with a mighty punch, Vergil can create a powerful
        AOE attack that can cause devastating attacks on his enemies. Deep Stinger:
        A forward lunge using both Yamato and Mirage Edge, with all the strength of
        his body and soul behind them. Note: Vergil''s optional equipment comes from
        the canonical mobile game Peak of Combat, but the mechanics of the game fall
        into the Optional Equipment rules set by RPG characters with no distinct/set
        of weaponry they use above all other potential items they may have, being
        completely in the choosing of the player. As such, whilst they are listed
        as Optional, there is no reason to assume anything regarding their canonicity.
