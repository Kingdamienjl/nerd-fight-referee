- id: claim-weaknesses-fc9e398d
  section: weaknesses
  axis: weakness
  text: "Dangerously overconfident. Vergil can sometimes become a little too obsessed with beating Dante\
    \ to show his superiority | Seeing items from his past causes him pain. Remains obsessed with defeating\
    \ his brother Dante | He retains his overconfidence and obsession with defeating Dante. Nevertheless,\
    \ Vergil introspects at the end of the story; he reconciles with his twin and even accepts his help\
    \ while continuing their sibling rivalry peacefully, although he still shows considerable annoyance\
    \ towards Dante and his antics. |-|Devil Trigger= {{#tag:tabber| {{!}}-{{!}}Overview= Devil Trigger\
    \ is a state where Vergil utilizes the devilish portion of his bloodline to transform into a demonic\
    \ form\u2014activated at some point in his life before his reunion with Dante. Much like his brother,\
    \ not only can Vergil instantly activate Devil Trigger, he can also charge up demonic energy and release\
    \ it to simultaneously damage enemies and transform. This is called Devil Trigger Explosion. All Devil\
    \ Trigger forms give Vergil increased attack, defense, speed, healing, and passive Fear Manipulation.\
    \ {{!}}-{{!}}Innate= File:Yamato_(V-DT)_DMC4SE.png|DMC 3/4 Yamato Devil Trigger File:Beowulf Yamato_(V-DT).png|Beowulf\
    \ Devil Trigger File:SINDEVILTRIGGERVERGILHD.jpg|Sin Devil Trigger File:Gallery_DMC5_Vergil DT.png\
    \ |Concept Art of Vergil's DMC5 Devil Trigger. Base Devil Trigger: Vergil's natural Devil Trigger\
    \ gained sometime before his reunion with Dante. This Devil Trigger is the most basic of the Devil\
    \ Trigger forms and can be accessed anytime Vergil wishes without a Devil Arm. In addition, it gives\
    \ Vergil a balanced boost to all stats. * Sin Devil Trigger: The Strongest Devil Form that Vergil\
    \ has access. He gained it after his human and demon selves reunited together into one. It is a powerful\
    \ form that awakens his true inner demonic heritage. It gives Vergil a further dramatic increase in\
    \ attack, range, defense, speed, and regeneration. Additionally, he also gains the ability to fly\
    \ and even create a doppelganger that can replicate all of his moves or act independently. }} |-|Notable\
    \ Attacks/Techniques= Summoned Swords: As said before, Vergil can summon spectral blades that resemble\
    \ the form of the Force Edge. Through this, Vergil has numerous ways to use his summoned swords, whether\
    \ for attacking his enemies from a distance, surrounding them with it or from atop, or having the\
    \ blades move around himself for defense and attack enemies get too close to him. Judgement Cut: A\
    \ signature move Vergil performs with his Yamato. By using the space-cutting properties of the sword,\
    \ Vergil can attack his enemies from a distance by cutting through the air, where it sends a dark\
    \ distortion that is then covered in slashes, cutting anyone caught in it to shreds. Vergil can also\
    \ send multiple Judgement Cuts in rapid succession. * Judgement Cut End: A more powerful variation\
    \ of Judgement Cut, where Vergil readies up his sword and then moves forward at such speeds to leave\
    \ after-images behind. Such a move allows him to cover the area in his slashes, allowing him to take\
    \ out large numbers of enemies in one full sweep. Hell on Earth: By concentrating his demonic/magic\
    \ powers on his hand and slamming than in the ground with a mighty punch, Vergil can create a powerful\
    \ AOE attack that can cause devastating attacks on his enemies. Deep Stinger: A forward lunge using\
    \ both Yamato and Mirage Edge, with all the strength of his body and soul behind them. Note: Vergil's\
    \ optional equipment comes from the canonical mobile game Peak of Combat, but the mechanics of the\
    \ game fall into the Optional Equipment rules set by RPG characters with no distinct/set of weaponry\
    \ they use above all other potential items they may have, being completely in the choosing of the\
    \ player. As such, whilst they are listed as Optional, there is no reason to assume anything regarding\
    \ their canonicity. == Gallery == File:Corrupt_Vergil_(Model)_DMC4SE.png|Corrupted Vergil File:Corrupt_(V-DT)_DMC4SE.png|Corrupted\
    \ Devil Trigger File:DMC5_W.Vergil.jpg|Weakened Vergil. ZSCXeUk - Imgur.gif|Vergil in DMC 5, featuring\
    \ Yamato. == Notable Matchups == Victories: Losses: Inconclusive: == References == {{Scroll box|Content={{Reflist|2}}}}\
    \ == Notes/Explanations== {{Scroll box|Content=}} {{Discussions|Vergil Devil May Cry|Vergil (Devil\
    \ May Cry)}} Category:Characters Category:Devil May Cry Category:Afterimage Users Category:Air Users\
