- id: claim-standard-equipment-401030b0
  section: equipment
  axis: equipment
  text: "| |-|Yamato= center|thumb|200px|Devil May Cry 3: Special Edition, Devil Arms File \u2014 Yamato:\
    \ \"A memento from Vergil\u2019s father. This samurai-esque sword\u2019s blade is said to cut through\
    \ anything.\" This is Vergil's primary weapon Yamato. It ignores conventional durability. Examples\
    \ of this are when Yamato pierced through Nero's Devil Bringer which was supposed to be an indestructible\
    \ demonic arm. And cut open a dimensional wall to aid Dante against Arkham, and has many showings\
    \ of spatial cutting. Yamato has also been shown to be capable of slicing targets dozens of meters\
    \ away with ease. |-|Beowulf= center|thumb|250px|Devil May Cry 3: Special Edition, Devil Arms File\
    \ \u2014 Beowulf: \"Flash gauntlets and greaves. This set boosts Vergil\u2019s attack and speed, making\
    \ him a powerhouse.\" Flash gauntlets and greaves, which had enough power to launch Beowulf into the\
    \ air from an uppercut and slice him in half with an axe kick. It also demonstrates Vergil's skill\
    \ in hand-to-hand combat. Lunar Phase and Beowulf Combo B. |-|Force Edge= centre|thumb|200px|Devil\
    \ May Cry 3: Special Edition, Devil Arms File \u2014 Force Edge: \"A sword magically imbued with Sparda's\
    \ power. A powerful sword with great hidden potential.\" A blade similar in power to Rebellion. It\
    \ is the sealed form of the sword wielded by Sparda himself; Vergil dual-wields it with Yamato in\
    \ combat. Vergil is capable of throwing the Force Edge with such power; it creates a whirlwind vacuum\
    \ and sucks any enemies in carving them up. Vergil is also capable of stabbing at tremendously high\
    \ speeds with this weapon. Vergil can also use energy slashes when wielding Force Edge. |-|Summoned\
    \ Swords= centre|thumb|150px| Devil May Cry 4, Yamato \u2014 Summoned Swords: \"Summon a magical blade\
    \ and fling it towards a foe, piercing the enemy through sheer force of will. Vergil conjures a spectral\
    \ sword that bears a resemblance to Force Edge and launches it at high speeds against his enemies.\
    \ Vergil is skilled in their usage circling himself with the blades and being able to shoot them out\
    \ afterward if he wants, being able to summon them to surround an enemy eventually impaling them and\
    \ making them rain towards an enemy also. He has also shown that he can create swords of different\
    \ sizes and can wield one himself. |-|Mirage Edge= centre|thumb|250px| Devil May Cry 5: Special Edition,\
    \ Mirage Edge: A weapon shaped from Vergil's own infernal energy. There's something about this blade\u2014\
    its shape and attacks\u2014that resembles Force Edge, the sword his father wielded so long ago. Vergil\
    \ conjures a spectral sword that bears a resemblance to Force Edge, except this time to use for offensive\
    \ combat instead of using it as a ranged projectile, dual-wielding it alongside Yamato. Vergil uses\
    \ it in the same exact manner as he used the Force Edge, using it as a replacement. |}"
  source_ids: *id003
  decisive: false
  status: unverified
