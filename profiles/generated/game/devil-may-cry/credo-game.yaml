      and Alchemist, Agnus is known to be a highly intelligent individual. Having
      created many of the Demons used by the Holy Knights & various Hell Gates only
      showcases his intellectual prowess. He also possesses a deep understanding of
      demonic forces. Created Dice Game which bind fate of all who step on the board,
      even demons, which are Type 4 Acasauls beings and the board game can create
      large Solar System sized dimensions which are perfect recreations of past events,
      he made Saviour who is made from many millennia worth of souls and demons. He
      has his own personal demon world of unknown size as a pocket dimension. He is
