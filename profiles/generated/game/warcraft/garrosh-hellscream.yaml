- id: claim-powers-and-abilities-01c65870
  section: abilities
  axis: hax
  text: 'Base=Superhuman Physical Characteristics (Orcs by Nature are stronger than most humans in nearly
    every regard), Weapon Mastery (Highly skilled in the use of twin one-handed axes and a singular two-handed
    axe), Martial Arts (Is a highly skilled hand to hand combatant and overwhelmed Thrall in such a fight),
    Non-Physical Interaction (All combatants in Warcraft have the natural ability to harm and kill a variety
    of intangible and incorporeal entities, beings that are physically intangible such as ghosts and spirits
    and air and fire elementals as well as beings that are elementally intangible such as oozes and slimes
    and water elementals), Preparation (Has access to all resources in the Horde''s Arsenal with preparation
    time), Vibration Manipulation (Can generate Shockwaves), Statistics Reduction (Via demoralizing Shout,
    which reduces attack potency by 20%), Resistance to the following: Mind Manipulation/Fear Manipulation/Ice
    Manipulation/Transmutation/Plant Manipulation/Status Effect Inducement/Light Manipulation/Empathic
    Manipulation/Sleep Manipulation/Power Nullification/Telekinesis/Electricity Manipulation/Darkness
    Manipulation/Vibration Manipulation/Paralysis Inducement/Explosion Manipulation/Statistics Reduction/Curse
    Manipulation/ (via being a Boss, Arthas is immune to Mind Control, Fear, Polymorph, and the Frost
    Nova spells, alongside any other Crowd Control abilities in his verse) and Magma Manipulation (Tanked
    Lava from Thrall with seemingly no burn marks on his person) and Mind Manipulation/Morality Manipulation/Limited
    Law Manipulation (Directly stated he resists The Jailer''s Domination,Garrosh Shadowlands death which
    has the sole purpose of the utter suppression of another being, altering the victim''s thoughts so
    powerfully that it interferes with their sense of selfWorld of Warcraft: Grimoire of the Shadowlands
    and Beyond, pg. 120 and is woven into the very fabric of the realm of the Maw and the tower of TorghastShadowlands
    Afterlives: Bastion. |-|Y''Shaarj Empowered=All Previous, Plus Large Size (Up to Type 0), Darkness
    Manipulation (Inflicts Shadow damage with various attacks), Transmutation/Corruption (Types 1 and
    2; Via Touch of Y''Shaarj, which transforms the afflicted individuals into Sha and compels them to
    spread the touch)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
