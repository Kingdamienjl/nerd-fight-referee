  attack_potency:
    text: 'Mountain level (Fought and killed the Doomguard captain Azzinoth, who in turn is superior to
      Felguards capable of killing Vol''jin,Where He Fell who is far stronger than fodder animus which
      can do this. Fought and killed multiple Doomguards during the assault of Ravencrest. Possesses all
      of the spells of RhoninWar of the Ancients Novel and thus should be comparable to him), higher,
      up to at least Multi-Continent level Via Arcane Siphon (Capable of absorbing the magic of others
      to greatly amplify the power of his own magic. Able to amplify himself to the point of overpowering
      and killing Balaadur, an extremely powerful eredar who is significantly stronger than unnamed eredar
      that destroyed the surface of Fanlin''Deskor,World of Warcraft: Grimoire of the Shadowlands and
      Beyond, pg. 69 a feat which yields this much energy) | At least Mountain level (Significantly more
      powerful than before. Matched Death Knight Arthas Menethil and fought him to a stalemateA Destiny
      of Flame and Sorrow), At least Planet level, likely Far Higher with the Demon Soul (The Demon/Dragon
      Soul was used by Deathwing to massacre nearly all of the Blue Dragonflight, and was used against
      him three times, once to knock two of his elementium plates from his spine, once to blow a massive
      hole through him, and one final time to completely vaporize him,Dragon Soul Raid although it drained
      the other Dragon Aspects of their power for a time to charge it enough to perform all three blows),
      higher Via Arcane Siphon | Planet level (Blew the planet Nathreza apart with his magic.World of
      Warcraft: Illidan, Chapter 19World of Warcraft: Chronicle Volume 3, pg. 148 After absorbing the
      Skull of Gul''dan''s power he was described as becoming more powerful than any of Archimonde''s
      lieutenants. Killed Tichondrius moments after absorbing the power of the Skull of Gul''dan. Defeated
      Magtheridon alongside Akama, Vashj, and Kael''thas.Lord of Outland Killed Azgoth, who was strong
      enough to harm him.Harbingers - Illidan Fought and defeated Akama. Fought Maiev Shadowsong multiple
      times.Terror of the Tides: Rise of the NagaWarcraft III: The Frozen ThroneWorld of Warcraft: Illidan,
      Chapter 16), Possibly higher (Maiev Shadowsong fought alongside Khadgar against Alternate Gul''dan,
      and was holding her own, despite being the weakest one there.The Tomb of Sargeras (audio drama)
      Illidan is Referred to as one of the most powerful beings to ever walk the lands of Azeroth, possibly
      putting him on relative par with the Dragon AspectsThe Back of the Illidan novel), higher in Demon
      Form and Via Arcane Siphon. Illidan''s Attacks and Spells Ignore Conventional Durability to a limited
      extend (Illidan''s basic attacks and damaging spells deal Chaos damage, which bypasses physical
      defenses, armor, and resistances as well as other forms of damage-mitigating magic. Although, it
      should be noted that this durability negation is limited to defenses additional to the target''s
      normal physical durability) | At least Planet level (Far more powerful than he ever was before.Chronicles
      Volume 4; Page 114 Matched Archmage Khadgar when his body was possessed by Sargeras and casually
      killed alternate universe Gul''Dan.Nighthold Raid Defeated MephistrothCathedral of Eternal Night
      and Kin''garoth,, the Burning Throne and assisted in the fight against Kil''jaeden.Tomb of Sargeras
      Broke free of Xe''ra''s magic and killed her.Rejection of the Gift Assisted in the defeat of the
      avatar of Aggramar who was empowered by the Titan World-Soul of the planet Argus) higher in Demon
      Form and Via Arcane Siphon. Illidan''s Attacks and Spells Ignore Conventional Durability to a limited
      extend (Illidan''s basic attacks and damaging spells deal Chaos damage, which bypasses physical
      defenses, armor, and resistances as well as other forms of damage-mitigating magic. Although, it
      should be noted that this durability negation is limited to defenses additional to the target''s
      normal physical durability)'
