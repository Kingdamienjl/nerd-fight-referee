  intelligence:
    text: Gifted (Despite his former carefree and frivolous nature, Genji is a highly
      competent ninja, being able to throw shuriken with perfect accuracy, dodging
      and bisecting Hanzo's arrows, and even managing to deflect Hanzo's Spirit Dragons.
      Due to his training and cybernetic enhancements, he can easily scale most objects
      and can double-jump in mid-air, allowing him incredible mobility and ease of
      motion in urban environments. His skill is high enough that he was able to work
      alongside other highly skilled fighters such as Reaper and Cassidy during his
      service in Blackwatch as well as alongside Tracer, Winston, and the other members
      of Overwatch after Blackwatch was disbanded.Storm Rising He outmatched his brother
      Hanzo, a highly gifted in his own right and the heir to the Shimada clan, and
      fought alongside Overwatch's best, dismantling his family's criminal empire
      along with many other foes during the Omnic Crisis. His skill and precision
      are apparent even in more menial tasks, such as carving a pumpkin or making
      paper shurikensOverwatch Emotes)
