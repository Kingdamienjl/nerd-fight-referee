- id: claim-weaknesses-d049c431
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Hand Cannon: Doomfist fires a short-range
    burst from the knuckles of his left fist. Its ammunition is automatically regenerated
    over a short time. *Rocket Punch: Doomfist charges up a powerful punch then is
    propelled forward by the rockets inside his gauntlet, causing overwhelming damage
    to the affected target. In addition, it will cause further devastation if the
    target then collides with a wall. *Seismic Slam: Doomfist leaps forward and smashes
    the ground he lands on to release a damaging shockwave around the point of impact.
    *Rising Uppercut: Doomfist uses the boosters in his gauntlet to catch flying enemies
    or knock grounded enemies skyward. *Power Block: Doomfist can use his gauntlet
    to block incoming attacks, which not only reduces damage taken by 75%, but also
    increases the power of his next Rocket Punch. This movement speed is temporary
    reduced by 35% while Power Block is activated. *Meteor Strike: Doomfist leaps
    to tremendous heights before crashing down on a target of his choice to crush
    them with the momentum gained on the way down. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{Reflist|2}} {{Discussions}} Category:Characters
    Category:Overwatch Category:Antagonists Category:Anti-villains Category:Assassins
    Category:Brawlers Category:Energy Users Category:Evil Characters Category:Forcefield
    Users Category:Game Characters Category:Gauntlet Users Category:Leaders Category:Male
    Characters Category:Martial Artists Category:Playable Characters Category:Primary
    Antagonists Category:Shockwave Users Category:Terrorists Category:Video Game Characters
    Category:Villains'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
