    text: Unknown. Genius combatant (The former heir to an ancient and infamous clan
      of assassins, Hanzo was known as a prodigy in his youth, excelling in all aspects
      of his training and an innate understanding of strategy and tactics. A master
      of stealth, silent killing, and all a manner of weapons, he is implied to be
      even more skilled than his brother Genji in the art of the sword, only picking
      up the bow due to trauma over the latter's "death." This does not deter his
      skill, though, as he can use a bow as an equally lethal weapon, able to make
      nearly impossible shots, hit targets from around corners without being able
      to see them and perform precision shots on small moving targets while simultaneously
      restraining a grown man. After he struck down his brother, he spent ten years
      honing his murderous skills, seeking to prove himself a warrior without peer.
      Also, he held his own against his brother Genji after the latter underwent cyborg
