- id: claim-weaknesses-57eae274
  section: weaknesses
  axis: weakness
  text: "Soldier: 76 is somewhat cynical and clings to the past. He shows signs of exhaustion from aging.\
    \ His heroic trait makes him generally prioritize saving innocents over pursuing his target if at\
    \ all possible. Helix Rockets can harm him if fired at close range. Notable Attacks/Techniques: *Sprint:\
    \ Thanks to the Soldier Enhancement Program and his training, Soldier: 76 can sprint at superhuman\
    \ speeds to quickly reposition himself or catch fleeing targets. *Heavy Pulse Rifle: Soldier: 76's\
    \ primary weapon, a highly advanced experimental weapon that fires \"pulse beams\" at speeds comparable\
    \ to most firearms. Due to lacking the complications of physical ammunition, the Heavy Pulse Rifle\
    \ remains accurate and effective at long distances and even while on the move. It also maintains pinpoint\
    \ accuracy almost comparable to a sniper rifle when fired in short bursts. However, it still suffers\
    \ from minor spread if used as a fully automatic weapon. *Helix Rocket: Soldier: 76 fires a cluster\
    \ of rockets from his Heavy Pulse Rifle. These rockets act as a single projectile, exploding when\
    \ they hit an enemy or a solid surface, dealing heavy damage to anyone caught in the explosion or\
    \ struck by the rockets directly. *Biotic Field: Soldier: 76 plants a biotic emitter on the ground.\
    \ The energy projection restores health to anyone within the field, sealing their wounds and restoring\
    \ their stamina in the process. *Tactical Visor: Soldier: 76\u2019s pinpoint targeting visor \"locks\"\
    \ his aim on the threat closest to his crosshairs, optimizing every shot from the Heavy Pulse Rifle\
    \ so that it will squarely hit the locked-on target. Should the target somehow escape or fall to 76's\
    \ assault, the Tactical Visor will automatically lock on another target to maintain the offensive.\
    \ ==Gallery== centre|thumb|330x330px ==Notable Matchups== Victories: Mr. Incredible (The Incredibles)\
    \ Mr. Incredible's Profile (Both were High 8-C, Battle took place in Dorado, Speed was equalized,\
    \ and the contestants started at a distance of 10 meters away_ Losses: Inconclusive: Commander Shepard\
    \ (Mass Effect) Shepard's Profile (Soldier Shepard was used, 8-B weapons and shields were restricted\
    \ and speed was equalised) {{Discussions|Soldier 76|Soldier: 76}} Category:Characters Category:Male\
    \ Characters Category:Game Characters Category:Video Game Characters Category:Overwatch Category:Good\
    \ Characters Category:Protagonists Category:Gun Users Category:Healers Category:Vigilantes Category:Military\
    \ Characters Category:Soldiers Category:Humans Category:Playable Characters Category:Super Soldiers\
    \ Category:Explosion Users Category:Antiheroes Category:Regeneration Users Category:Adaptation Users\
    \ Category:Weapon Masters Category:Martial Artists Category:Stealth Masters Category:Energy Users\
    \ Category:Information Analysis Users Category:Preparation Users Category:Rocket Users Category:Brawlers"
  source_ids: *id003
  decisive: false
