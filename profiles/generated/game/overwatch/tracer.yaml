  intelligence:
    text: 'Unknown. At least Gifted in combat (As one of Overwatch''s most famous
      and proactive agents, Tracer is a fearless combatant and a skilled combatant.
      In combat, Tracer combines her marksmanship skill, acrobatic prowess, and time-enhanced
      speed to act as a highly unpredictable fighter, repeatedly teleporting and amplifying
      her speed in order to constantly stay in her opponent''s blind spots and avoid
      attacks while peppering them with non-stop hails of focused gunfire. Though
      her guns are primarily close-range weapons, she has a high-degree of accuracy
      with them, being able to accurately hit targets with singular bullets such as
      shooting a pipe while mid-flip to create a smokescreen, and even when wielding
      normal submachineguns she has shown the ability to disarm an entire mob by shooting
      the guns out of their hands. Her skill has even commended by marksmen as good
      as D.Va,D.Va: How can you be good at shooting in real life, but so bad in games?
      Tracer: Mmm... it''s not the same thing, I guess. D.Va: *sigh* It''s lonely
      at the top. Tracer: I could beat you at the cooking games, though. and she has
      also shown equal marksmanship skill with other weapons, such as Widowmaker''s
      rifle. Due to being trained in field combat by Overwatch, Tracer is also skilled
      in close quarters combat, having shown the ability to incapacitate Talon troops
      with her bare hands and even match Widowmaker in hand to hand combat)'
    source_ids: *id002
    confidence: 0.95
