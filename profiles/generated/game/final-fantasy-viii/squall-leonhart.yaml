      of abilities that could be grouped as "Bonus"Final Fantasy VIII (1999): Tutorial,
      Info Corner. (HP Bonus, Str Bonus, Spr Bonus, among others, give a small boost
      to the parameter increase of the user everytime they level up.) *Power Modification
      and Sleight of Hand (Pick-Pocketing;The Mug abilityFinal Fantasy VIII (1999):
      Tutorial, Info Corner. allows the user to steal from enemies with their reglar
      attacks. The Expend 2x1Final Fantasy VIII (1999): Tutorial, Info Corner. allows
      the user to only use a single stock when casting multiple copies of the same
      spell when under the Double statusFinal Fantasy VIII (1999): Combat Mechanics..)
      *Instinctive Action (The Counter abilityFinal Fantasy VIII (1999): Tutorial,
      Info Corner. allows the user to immediately respond attacks, even blocked ones,
      with a physical attack. The Cover abilityFinal Fantasy VIII (1999): Tutorial,
      Info Corner. makes the user automatically protect a weakened ally from incoming
      attacks that would knock them out or kill them. Finally, the Initiative abilityFinal
      Fantasy VIII (1999): Tutorial, Info Corner. enables the user to take action
      automatically when battle begins. The Auto-Potion abilityFinal Fantasy VIII
      (1999): Tutorial, Info Corner. allows the user to instantly heal themselves
      with a medicine upon taking damage.) *Healing (Passive; The Move-HP UpFinal
      Fantasy VIII (1999): Tutorial, Info Corner. ability allows the user to recover
      their life force, and thus heal wounds, by simply walking around. This differs
      from normal Regeneration in that it only works outside the strain of combat.)
      *Passive Time Manipulation and/or Attack Reflection (The "Auto" abilities, Auto-Haste
      and and Auto-ReflectFinal Fantasy VIII (1999): Tutorial, Info Corner. are essentially
      passive effects that grant those same augments to the userFinal Fantasy VIII
      (1999): Combat Mechanics., activating as soon as battle begins and cannot be
      dispelled, even if the user is knocked out.) Party'
