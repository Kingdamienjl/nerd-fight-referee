  stamina:
    text: Superhuman (An essential aspect of SeeD training if for the mercenary to
      be prepared to carry out missions under extreme circumstances, which include
      deprivation of rest and food, as well as injury, for periods of days. Squall
      is capable of constantly fighting monsters under these situations for what seems
