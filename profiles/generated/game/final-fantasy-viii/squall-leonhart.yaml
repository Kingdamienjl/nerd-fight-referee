    displayed full knowledge of the workings of Junction, during the field exam to
    become a SeeD, he proved the extent of his fighting capabilities and military
    strategy on a proper mission. By the end he passed with exceptional results, despite
    dealing with Seifer, a very difficult teammate and leader who failed the exam
    precisely due to a lack of professionalism. Notably, Squall is one of the very
    few people to master a Gunblade, a weapon noted to be so difficult to use that
    most people simply decide to choose a simpler option, and, furthermore, Squall
    was noted by principal, Cid Kramer, to be the very first Gunblade specialist to
    join SeeD in the history of Balamb Garden. This is despite the academy's worlwide
    success as a mercenary contractor. Even at his young age and comparatively short
    career as a SeeD, Squall was chosen to become the Commander of Balamb Academy
    in times of crisis, chosen over more experienced members of the force, earning
    the leadership over even his superiors during the war of the Gardens and managing
    to pull everyone through times of crisis. This talent could already be seen in
    his earlier missions, when Squall swiftly took the lead of his team, guiding them
    and assisting their inexperienced clients in dangerous jobs.)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-8d169c1a
  section: weaknesses
  axis: weakness
  text: 'Guardian Forces slowly erase memories from earlier on his life. With Junction
    spells can only be allocated to one place, meaning he can''t, for example, imbue
    his attacks with ice and protect himself from cold with the Blizzaga spell, he
    has to choose and at best use the inferior Blizzara, or a different spell, in
    the other slot, and, additionally, using the spells in combat with reduce the
    stock and weaken the empowering effect of Junction little by little. Limit Breaks
    cannot be used freely, the user must find themselves in danger in order to access
    them. | Same Junction shortcomings as before, however, after recovering his past
    and important memories, the memory loss effect of Guardian Forces seems to have
    been stopped. | Same Junction shortcomings as before. If Squall''s belief in the
    bond with his friends and his love for Rinoa falters the anchor protecting him
    from effects threatening his existence will weaken. In particular, Squall''s fear
    of being alone once again can affect him heavily in this regard. | None notable.
    Notable Attacks/Techniques: {{Border|Scroll=No|Visible=Yes|Padding=Yes|Content=
    |-|Limit Breaks= FF8 Squall Limit Break Aura.gif|Squall''s Aura when activating
    Renzokuken FF8 Squall Finishing Blow Aura.gif|Squall''s Aura when activating Finishing
    Blows Limit Breaks are powerful techniques that can be used when someone finds
    themselves endangered, be it by suffering from injuries, facing overwhelmingly
    strong enemies, sustaining ailments or having their allies defeated in battle.
    This is known as Crisis Level, which in gameplay terms would translate to low
    HP, status conditions, overleveled enemies and such. The higher the Crisis Level,
    the higher the chances of performing Limit Breaks and the stronger they become,
    though the exact way it does depends on the specific individual and their abilities.
    {| cla'
