- id: claim-powers-and-abilities-44cbce76
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Non-Physical Interaction, Master Marksman,
    Magic, Summoning, Energy Manipulation (Can manipulate energy to replicate various
    spells normally only available naturally to a sorceress), Energy Blasts, Elemental
    Manipulation (Of the Fire, Ice, Lightning, Holy, Water, Wind and Earth variety),
    Poison Manipulation, Status Effect Inducement (Via Dark Shot), Barrier Creation,
    Levitation, Telekinesis (Able to call down meteors), Petrification, Time Manipulation
    (In the variety of speeding himself up and slowing down his enemy) Time Stop (Via
    Stop), Gravity Manipulation, Transmutation (Via Card ability), Invulnerability
    (Via Junctioning, Irvine can gain 100% immunity to elemental damage and statistic
    effects and even further to the point of where some of these abilities would heal
    him. The Defend ability nullifies the next physical attack received), Biological
    Absorption (Via Devour ability), Power Absorption (Via Draw), Power Nullification
    (Via Silence/Lvl Down/Dispel/Curses), Healing, Durability Negation (Via Armour
    shot and Junctioning Death to his attacks), Information Analysis (Via Scan), Attack
    Reflection (Via Reflect), Statistics Amplification (Can Junction Guardian Forces/Summons
    to increase his stats), Statistics Reduction (Meltdown reduces opponents Physical/Magic
    defence stat to 0), Minor Mind Manipulation/Empathic Manipulation (Via Confuse/Berserk)
    Spatial Manipulation (Via Eden), Resurrection (Via Phoenix), Absolute Zero (Via
    Shiva), BFR (Via Leviathan) | Same as before | Same as before and Acausality (Type
    2), Self-Sustenance (Type 2) |-|Resistances= Via Junctioning Irvine can gain Resistances
    to Time Manipulation, Time Stop, Sleep Manipulation, Elemental Manipulation, Poison
    Manipulation, Durability Negation, Death Manipulation, Petrification, Power Nullification
    (To his magic and limit breaks), Status Effect Inducement, Sense Manipulation
    (Specifically sight), Curse Manipulation, Statistics Reduction (Specifically his
    defence), Necromancy/Transmutation (Able to resist a spell that turns the target
    into a Zombie/Undead), Berserk Inducement, Mind Manipulation, and Limited BFR
    Resistance | Same as before | By the final battle the Party gains resistance to
    Space-time Manipulation, Existence Erasure and Absorption (Can resist the process
    of the entire timeline being absorbed) |-|Dissidia= {{#tag:tabber| {{!}}-{{!}}Abilites=
    All previous abilities enhanced, Immortality (Type 8,reliant on his Crystal which
    let him return from fading from existence after Cosmos'' death) & Regeneration
    (Low-Godly), Summoning (Can summon various Eidolons from Summonstones and the
    World of Illusions), Willpower Manipulation (a person''s will is power there and
    enables them to do a multitude of things the stronger their willDissidia Final
    Fantasy Opera Omnia), Reactive Power Level (the greater someone''s will, the greater
    their powerDissidia Final Fantasy Opera Omnia), Law Manipulation (Beings with
    strong wills can overwrite the laws of the world and bend them to their willDissidia
    Final Fantasy Opera Omnia), Creation (With a powerful enough will, once can create
    various things such as phone lines, airships and even entire countries and worldsDissidia
    Final Fantasy Opera Omnia), Sealing (Can seal off large areas and people with
    her will, such as Cecil sealing himself in Castle Baron or the cast sealing Kefka
    inside a TorsionDissidia Final Fantasy Opera Omnia), Dimensional Travel (Characters
    can open Torsions, rifts in space-time to travel various dimensionsDissidia Final
    Fantasy Opera Omnia), and Immortality (Type 2) (Due to the crystal core of darkness''s
    influence in the hands of Ardyn, warriors will not die no matter how injured they
    are) {{!}}-{{!}}Resistances= Resistance to Mind Manipulation, Soul Manipulation
    (Via Zalera, the Death Serpah, who was going to absorb the souls of every living
    being on the planet), Corruption & Body Puppetry (Due to their light, Warriors
    of Materia can dispel attempts to control them), Empathic Manipulation, and Madness
    Manipulation (Type 3; Resistant to the effects of the True Moon, which is capable
    of affecting the hearts and minds of all living beings on the planetFinal Fantasy
    IV: The After Years), Gravity Manipulation (Unaffected by the gravitational pull
    of the True Moon, which even the Lunar Whale couldn''t escape from), Spatial Manipulation,
    Deconstruction, and BFR (Can withstand the attacks of Atomos, who manipulates
    space, crush enemies down to a molecular level,Dissidia Final Fantasy and can
    warp them into another dimension), Extreme Cold and Cosmic Radiations (Can fight
    and survive on the moon), Absolute Zero (Can survive Shiva''s ice attacks, including
    Diamond Dust), {{!}}-{{!}}With Eidolons= Hellfire Manipulation (Via Ifrit, Phoenix,
    Rubicante, and Marilith), Ice Manipulation and Absolute Zero and Duplication (Via
    Shiva who''s Ice and aura are stated to reach Absolute Zero including her Diamond
    Dust, Shiva can duplicate herselfDissidia Final Fantasy NT)'
