    Mimicry (Via Draw) Summoning (Though not shown, he''s clearly Junctioned to something), Master Gunswordsmanship,
    Elemental Manipulation (Of the fire variety), Energy Blasts, Portal Creation (Via Bloodfest), Attack
    Reflection (Via Zanketsuken Reverse), Damage Boost/Explosion Manipulation (Via Gunblade trigger),
    limited Reactive Evolution (Junctioning can increase his resistances/change the aspect of his attacks
    based on what his opponent uses), Healing, Power Nullification (Via Dispel), Time Manipulation (Via
    Haste), limited Sealing (Can draw out and Seal enemy summons, gaining their power for himself), Statistics
    Amplification (Via Junctioning magic to his stats), Damage Transferal (While summoning, all damage
    taken is transferred to the GF), can use all the magic the main cast can but prefers not to. |-|Resistances=
    Via Junctioning, Seifer can gain Resistances to Time Manipulation, Time Stop, Sleep Manipulation,
    Elemental Manipulation, Poison Manipulation, Durability Negation, Death Manipulation, Petrification,
    Power Nullification (To his magic and limit breaks), Status Effect Inducement, Sense Manipulation
    (Specifically sight), Curse Manipulation, Statistics Reduction (Specifically his Physical/magic defence),
    Necromancy/Transmutation (Able to resist a spell that turns the target into a Zombie/Undead), Berserk
    Inducement, Mind Manipulation, Transmutation, and Limited BFR Resistance | Same as before |-|Dissidia=
    {{#tag:tabber| Abilites=All previous abilities enhanced, Summoning (Can summon various Eidolons from
    Summonstones and the World of Illusions), Willpower Manipulation (a person''s will is power there
    and enables them to do a multitude of things the stronger their willDissidia Final Fantasy Opera Omnia),
    Reactive Power Level (the greater someone''s will, the greater their powerDissidia Final Fantasy Opera
    Omnia), Law Manipulation (Beings with strong wills can overwrite the laws of the world and bend them
    to their willDissidia Final Fantasy Opera Omnia), Creation (With a powerful enough will, once can
    create various things such as phone lines, airships and even entire countries and worldsDissidia Final
