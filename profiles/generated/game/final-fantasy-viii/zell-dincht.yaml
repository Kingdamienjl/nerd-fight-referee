- id: claim-weaknesses-4096b048
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Draw and Stock/Cast: Squall can
    absorb the energy from an opponent to recreate their magical powers. He can use
    this absorbed energy offensively to use the same ability on an opponent, or he
    can Junction it to become resistant/immune/strengthened by it. *Junction: Able
    to increase his statistics via absorbing energy from his opponents. Can grant
    himself resistance/immunity/strength with said energy. Can also attach the power
    to his physical attacks applying whatever effect the original ability inflicts
    (Can steal an instant death ability from his opponent and attach it to his physical
    attacks as an example) *Guardian Forces (GFs): Guardian Forces are mystical entities
    that claim dominion over the elements. Squall''s superhuman abilities are a direct
    result of being Junction to multiple Guardian Forces, which he can temporarily
    manifest in a battle to assist him in combat. Squall''s Guardian Forces are listed
    below: |-|Limit Breaks= -Duel: Zell unleashes a long series of punches and kicks
    before finishing it off with either Burning Rave, Meteor Barett, Different Beat,
    or My Final Heaven. -Burning Rave: Zell charges up all his ki in a flaming globe
    around him and then punches the ground, sending shockwaves at the opponent(s)
    and throwing them into the air. -Meteor Barett: Zell jumps into the air and collects
    his energy. Channeling the power into his fist, he dives at his opponent, passing
    straight through while the enemy is subject to many explosions. -Different Beat:
    Zell runs at his opponent and backflips, knocking them into the air. He repeatedly
    backflips, sending them higher up. After a while, he jumps on them and stamps
    them into the ground, leaving a big crater. -My Final Heaven: Zell charges up
    his ki in a similar way to Burning Rave and channels it into one fist. Zell then
    rushes past the opponents, sending them spinning around. Zell circles around the
    Earth once in a matter of seconds, and then rushes through them again before doing
    his finishing punch. |-|Guardian Force= *Ifrit: Uses a Fire-elemental attack called
    "Hellfire *Shiva: Uses a Ice-elemental attack called "Diamond Dust" *Quetzalcoatl:
    Uses a Lightning-elemental attack called "Thunder Storm." *Siren: Uses a Non-Elemental
    attack called Silent Voice. It also inflicts "Silence." *Brothers: Uses an Earth-Elemental
    attack called "Brotherly Love." *Diabolos: Uses a Gravity based attack that deals
    damage in relation to the enemies'' maximum HP called "Dark Messenger." *Carbuncle:
    Grants Reflect status to party *Leviathan: Deals Water-Elemental Damage and attempts
    to Removes the enemy from the battlefield with a huge torrent of water. *Pandemona:
    Uses a Wind-Elemental attack called "Tornado Zone" *Cerberus: Enables the party
    to cast two or three magic spells in one turn *Doomtrain: Uses a Poison-Elemental
    Attack called "Runaway Train," Inflicts every status ailment at the same time.
    *Alexander: Uses a Holy-Elemental Attack called "Holy Judgment." *Bahamut: Uses
    a Non-Elemental Attack called "Mega-Flare" *Odin: Uses "Zantetsuken," which kills
    opponents instantly, this has a random chance to occur, and Squall has no Control
    over it. *Phoenix: Uses a Fire-Elemental attack called Rebirth Flame. Can resurrect
    fallen party members should they die. *Eden: Eden uses a Non-Elemental attack
    called "Eternal Breath" |-|Magic= *Doom: Cuts an opponent''s thread of life, forcing
    them to live on borrowed time (16 seconds), causing instant and immediate death
    once it runs out. *Death: Summons a reaper from a small void to strikes the foe
    with its scythe, instantly killing most of them. *Drain: Drains a portion of the
    target''s health, healing the caster for the same amount. *Firaga: Launches an
    enormous fireball at an opponent. *Thundaga: Launches a large lightning bolt at
    an opponent. *Blizaga: Launches an enormous icicle at an opponent. *Tornado: Creates
    a mighty tornado damaging all opponents. *Quake: Creates a violent earthquake
    at an opponent''s feet. *Bio: Inflicts a virulent poison upon an opponent. *Demi:
    Crushes the foe in an orb of gravity and reduces their HP by half. *Holy: Blasts
    the target with holy damage. *Meltdown: Shoots a powerful wave of energy at the
    target causing non-elemental damage, and reducing the enemies'' physical/magical
    defense to 0. *Meteor: Summons meteors to bombard her targets for a brief period.
    *Flare: Blasts the target with non-elemental damage. *Ultima:: Draws in large
    amounts of magical energy and unleashes it in a massive explosion upon the enemy,
    dealing non-elemental damage. *Haste: Speeds up time around the target, raising
    their effective movement and combat speed. *Slow: Slows down the time around an
    opponent and reducing their effective combat and movement speed. *Aura: Status
    magic that increases the chance of the affected character getting a Limit Break
    and allows them to get Limit Breaks outside of being in HP Critical health. Being
    under the effects of Aura boosts the character''s'
