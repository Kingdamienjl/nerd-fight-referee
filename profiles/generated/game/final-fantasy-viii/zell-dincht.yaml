  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Non-Physical Interaction, Martial Arts,
    Magic, Regeneration (Mid-Low), Life Stealing (Via Drain and Junctioning it to
    his attacks), limited Sealing (Can draw out and Seal enemy summons, using its
    power for himself), Limited Reactive Evolution (Via Junctioning. Can change his
    resistances/damage types based on what his opponent is using), Summoning, Energy
    Manipulation (Can manipulate energy to replicate various spells normally only
    available naturally to a Sorceress), Elemental Manipulation (Of the Fire, Ice,
    Lightning, Holy Manipulation, Water, and Earth variety), Poison Manipulation,
    Status Effect Inducement, Limited Dimensional Travel/Pocket Reality Manipulation
    (Various summons can create/draw enemies into a pocket reality to attack them
    and transport them back again), Barrier Creation/Damage Reduction (Via Protect
    and Shell), Levitation, Telekinesis (Able to call down meteors), Petrification,
    Time Manipulation (In the variety of speeding himself up and slowing down his
    enemy) Time Stop (Via Stop), Gravity Manipulation, Transmutation (Via Zombie/Card
    ability), Invulnerability (Via Junctioning, Zell can gain 100% immunity to elemental
    damage and statistic effects and even further to the point of where some of these
    abilities would heal him/Defend ability), Biological Absorption (Via Devour ability),
    Power Mimicry (Via Draw), Power Nullification (Via Silence/Lvl Down/Dispel/Curses),
    Sense Manipulation (Via Darkness, massively reduces the targets vision), Healing,
    Self-Destruction (Via Kamikaze), Durability Negation (Via Junctioning Death to
    his physical strikes, he can give his blows a chance to instantly kill the target
    and various other spells), Information Analysis (Via Scan), Attack Reflection
    (via Reflect), Statistics Amplification (Can Junction Guardian Forces to increase
    his stats. Can expend 10% of his HP to triple the damage of his next strike),
    Statistics Reduction (Meltdown reduces opponents Physical/Magic defence stat to
    0), Minor Mind Manipulation/Empathic Manipulation (Via Confuse/Berserk), limited
    Damage Transferal (While summoning all damage Zell takes is transferred to his
    Guardian Force), Spatial Manipulation (Via Eden), Resurrection (Via Phoenix),
    Absolute Zero (Via Shiva), BFR (Via Leviathan) | Same as before | Same as before
    and Self-Sustenance (type 2), Acausality (Type 2). |-|Resistances= Via Junctioning,
    Zell can gain Resistances to Time Manipulation, Time Stop, Sleep Manipulation,
    Elemental Manipulation, Poison Manipulation, Durability Negation, Death Manipulation,
    Petrification, Power Nullification (To his magic and limit breaks), Status Effect
    Inducement, Sense Manipulation (Specifically sight), Curse Manipulation, Statistics
    Reduction (Specifically his Physical/magic defence), Necromancy/Zombification
    (Able to resist a spell that turns the target into a Zombie/Undead), Berserk Inducement,
    Mind Manipulation, Transmutation, and Limited BFR Resistance | Same as before
    | By the final battle the Party gains resistance to Space-time Manipulation, Existence
    Erasure and Absorption (Can resist the process of the entire timeline being absorbed)
    |-|Dissidia= {{#tag:tabber| Abilites=All previous abilities enhanced, Immortality
    (Type 8, reliant on his Crystal which let him return from fading from existence
    after Cosmos'' death) & Regeneration (Low-Godly), Summoning (Can summon various
    Eidolons from Summonstones and the World of Illusions), Willpower Manipulation
    (a person''s will is power there and enables them to do a multitude of things
    the stronger their willDissidia Final Fantasy Opera Omnia), Reactive Power Level
    (the greater someone''s will, the greater their powerDissidia Final Fantasy Opera
    Omnia), Law Manipulation (Beings with strong wills can overwrite the laws of the
    world and bend them to their willDissidia Final Fantasy Opera Omnia), Creation
    (With a powerful enough will, once can create various things such as phone lines,
    airships and even entire countries and worldsDissidia Final Fantasy Opera Omnia),
    Sealing (Can seal off large areas and people with her will, such as Cecil sealing
    himself in Castle Baron or the cast sealing Kefka inside a TorsionDissidia Final
    Fantasy Opera Omnia), Dimensional Travel (Characters can open Torsions, rifts
    in space-time to travel various dimensionsDissidia Final Fantasy Opera Omnia),
    and Immortality (Type 2) (Due to the crystal core of darkness''s influence in
    the hands of Ardyn, warriors will not die no matter how injured they are) {{!}}-{{!}}Resistances=
    Resistance to Mind Manipulation, Soul Manipulation (Via Zalera, the Death Serpah,
