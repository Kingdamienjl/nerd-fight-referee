- id: claim-weaknesses-274d025e
  section: weaknesses
  axis: weakness
  text: 'None notable. Note: All gameplay footage stems from her arcade mode either in Final Fight 2 or
    Street Fighter Alpha 3 MAX. Fighting Style: Maki is specialized in Bushinryu ninjutsu, a style she
    shares with her rival Guy and her master Zeku. All the practictioners of this art have to eventually
    create their own personalized version and Maki''s makes great use of the tonfa, while also maintanining
    the signature traits of Bushinryu. As a ninja, Maki is incredibly agile and is able to perform all
    sort of acrobatic and quick maneuver, including dashes, somersaults, wall jumps, flying kicks, izuna
    drops and more, combined with an equal amount of strikes and some grappling technique. *Genko: Maki
    steps forward and delivers a hook punch. *Tengu Daoshi: Maki hugs the opponent then jumps and slams
    them head-first onto the floor. Maki can also launch herself towards the wall and jump off of it to
    increase the damage of the fall. *Hayagake: Maki sprints forward and either stops or performs a diving
    kick or a sliding kick followed by a Tengu Daoshi. *Saka Hayagake: An evasive maneuvers with which
    Maki runs backwards, then either stops or flips forward or backward. *Hassoukyaku: Maki jumps onto
    a wall and then jumps off of it or perform one between a short range dive kick or a long range dive
    kick followed by a Head Bomber. *Reppukyaku: Maki performs a handstand with her tonfa and spins around,
    kicking high. Genko.gif|Genko Hayagake3.gif|Hayagake (Dive Kick) Hayagake2.gif|Hayagake (Tengu Daoshi)
    Reppukyaku.gif|Reppukyaku *Standard Throws: Maki grabs the opponent and either knees their face several
    times, tosses them above her shoulder or combines the two into a single technique. *Shishigari: Maki
    grabs the opponent, bashes them with her tonfa and knocks them down with a roundhouse kick. *Head
    Bomber: Maki grabs an airborne opponent''s waist, flips them over and slams their head onto the floor.
    MakiThrow.gif MakiPowerbomb.gif *Bushin Guraiha: Maki delivers seven hooks in a row using both her
    tonfa and right fist, then finishes with a rising kick. *Tesshinhou: Maki runs forward, performs a
    flying kick or a sliding kick and knocks the opponent down with a Genko. *Ajaratengu: A stronger version
    of the Tengu Daoshi, with which Maki slams the opponent four times against the walls, gaining considerable
    height, then drives them head-first onto the ground at high speed. BushinGuraiha.gif Tesshinhou.gif
    Ajaratengu.gif'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
