- id: claim-weaknesses-476a794d
  section: weaknesses
  axis: weakness
  text: Considering Lu Guang possess's Cheng Xiaoshi's time traversal powers, his
    supernatural photo-traversing powers are extremely limited and can only be initiated
    through images; the picture can only transfer his soul into a certain individual
    at once -- hence, the accessibility of his powers may not be possible if he were
    to lack the required materials. Without any images or videos, he is pretty much
    a mere ordinary human. However, he is capable of accessing his powers through
    online images and videos displayed on a screen. Otherwise, none notable.
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-9704537b
  section: abilities
  axis: hax
  text: '*Photo Traversal: Cheng Xiaoshi''s notable power that can travel back in
    time through photos by soul-transferring into the body of the photographer who
    took the picture; he is not only capable of traversing into real physical copies
    of photos but also images displayed on a screen, such as a phone. This power of
    his allows him to travel back to anywhere back in time, neglecting the quality
    of the photo, insinuating that his power''s potency does not have any limitations.
    **Space-Time Warping: Lu Guang stated his powers can warp all of space-time and
    reality if he does one wrong move either intentionally or unintentionally. In
    order for space-time and reality not to be changed, he needs to act in accordance
    to Lu Guang''s instructions that''ll flow with the history and causality from
    the time period to present day. **Fate Alteration: Cheng Xiaoshi bestowed his
    powers to Lu Guang after his death, allowing Lu Guang to travel back in time and
    reverting everything that happened, changing destiny itself and deleting the original
    timeline. Lu Guang travelled back in time to rewrite Cheng Xiaoshi''s fate by
    keeping him alive. **Cause and Effect Reversion: Cheng Xiaoshi''s time traversal
    powerss can reverse all of cause and effect by reversing every incident that happened
    with time travel. Lu Guang rewritten the entire timeline after he harnessed Cheng
    Xiaoshi''s time traversal powerss to travel back in time, therefore reverting
    every incident that occurred, including its causality. **Possession: Through soul-transferring
    to the photographer of the picture, he has full possession of their body and as
    well inherit their memories. Therefore, he can possess the photographer of the
    picture with his Photo Traversal time travelling ability.'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
