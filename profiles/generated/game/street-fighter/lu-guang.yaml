power_scale:
  tier:
    text: 9-C, via Possession; Low 2-C Environmental Destruction through Cheng Xiaoshi's
      Time-Traversal powers
    source_ids:
    - vsbattles-lu-guang-street-fighter
    confidence: 0.6
  attack_potency:
    text: Street level (Fought on par with Qianjin -- a retired cop and cirminal organisation
      leader, and many of his gang members.Season 2, Episode 2 Was able to fight on-par
      and likely defeated Vein, with the latter can completely destroy a wooden chair
      with his bare bands, and effortlessly defeat Cheng Xiaoshi), Varies via Possession
      (He is capable of possessing anyone who's in the picture, hence his power can
      vary depending on the person he possesses); Universe level+ Environmental Destruction
      through Cheng Xiaoshi's Time-Traversal powers (Cheng Xiaoshi's Time-Traversal
      powers can potentially cause a "hurricane" that can destroy the world,Bridon
      Chapter, Episode 1 as distorting future sequence nodes can result in catastrophic
      events)
    source_ids:
    - vsbattles-lu-guang-street-fighter
    confidence: 0.6
  speed:
    text: Superhuman reaction and combat speed (Comparable to Cheng Xiaoshi, who reacted
      and dodged punches and kicks from many skilled fighters and gang members. Reacted
      to Qianjin and Li Tianchen's punches and kicks. Was able to dodge bullets fired
      from Vein's pistol several times, hence he was able to keep on par with him
      without high difficulty), Varies via Possession (Speed can vary depending on
      his possession target)
    source_ids:
    - vsbattles-lu-guang-street-fighter
    confidence: 0.6
  lifting_strength:
    text: Unknown
    source_ids:
    - mediawiki-4944268
    confidence: 0.95
  striking_strength:
    text: Street level, Varies via Possession
    source_ids:
    - mediawiki-4944268
    confidence: 0.95
  durability:
    text: "Street level (Survived and wore off stabbing wounds from a Qi\xE1ol\xED\
      ng\u4E54\u82D3 possessed by Li Tianchen. Capable of taking multiple hits from\
      \ Qianjin after Li Tianchen exacerbated his knife-stab wound, which made it\
      \ worse than before), Varies via Possession (His durability can vary depending\
      \ on the person he possesses)"
    source_ids:
    - vsbattles-lu-guang-street-fighter
    confidence: 0.6
  stamina:
    text: At least Peak Human, possibly Superhuman (Wore off and recovered an exacerbated
      wound that was caused by a deep stab by a kitchen knife. Was still capable of
      fighting Qianjin after a brawl with Li Tianchen and knife-stab wound; in the
      end, he was still standing despite bearing fractured bones and a broken leg.
      However, Xiao Li interfered with his fight with Qianjin before he can exert
      up to his limit)
    source_ids:
    - vsbattles-lu-guang-street-fighter
    confidence: 0.6
  range:
    text: Standard Melee Range, Universal+ and Interdimensional with Cheng Xiaoshi's
      supernatural powers
    source_ids:
    - vsbattles-lu-guang-street-fighter
    confidence: 0.6
  intelligence:
    text: Genius (Was the main and most valued detective towards the police force
      investigation towards Li Tianchen and the supernatural phenomenon involving
      the possession of people through images. Lu Guang came from the future and has
      significant knowledge on future events that is ordained by destiny, and how
      to change fate or make events stay the same; he is very knowledgable on concepts
      so-called "future nodes", which are significant specific points in time that
      are strictly unchangable -- if a future node were to be changed, then reality
      will become absolutely catastrophic. Considering Lu Guang has the ability to
      see into the events up to 12 hours after a specific photo was taken, he is able
      to grasp knowledge and events that are otherwise unbeknownest to others. Lu
      Guang taught Cheng Xiaoshi to control and manage his powers, to prevent causes
      of time paradoxes and universal cataclysm)
    source_ids:
    - vsbattles-lu-guang-street-fighter
    confidence: 0.6
