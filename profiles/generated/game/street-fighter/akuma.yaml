- id: claim-powers-and-abilities-ebdd8c1c
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Genius Martial Artist (A master of the assassin martial
    art known as Ansatsuken) *Acrobatics (Extremely agile and in possession of a vast repertoire of acrobatic
    techniques and jumping attacks. Moreover, he can foil enemy throws, regain his footing with a recovery
    roll and backflip in mid-air to recover his aerial balance after being striken by the opponent.Gameplay
    Able to reach tens of meters into the air with his jumps.) *Chi Manipulation and Projection (Controls
    the Satsui no Hado to a masterful degree, it being an innate and unique form of ki stemming from the
    natural killing intent present within every living being but which only few can harness, let alone
    control. Such power grants exceptional strength and can be manifested to empower physical attacks
    and project energy blasts. Akuma can also form an energy construct around his body to enhance his
    striking power even more.) *Aura and Minor Temperature Manipulation (Can manifest his fighting spirit
    in the form of an [https://www.youtube.com/watch?v=XT6zG2BucQ8&t=26s] auraStreet Fighter VI - Akuma''s
    Taunts and as heat and haze; it can even obscure the vision and grow into a physical force capable
    of exerting overwhelming pressure, distort the air, crack the earth and incapacitate a normal person
    through mere contact.Street Fighter IV Official Website (archived) Several of his techniques utilize
    this aura for combat purposes) *Social Influencing (Social Reputation and Instigating Fear: Akuma
    is widely renown as a legendary martial artist, to the point of having earned the title of "Master
    of the Fist", and even striking fear into the Player.) *Extrasensory Perception (Can sense ki and
    should possess the same degree of ability as other ki users less skilled than him.Street Fighter IV
    - Akuma''s Ending) *Teleportation (Vanished into nowhere after destroying his own island. Suddenly
    disappeared in front of Gen and the Player.) *Analytical Prediction (Anticipated Gen''s stealth killing
    blow and teleported away before he could initiate the attack.) *Transformation (Into Shin Akuma.Street
    Fighter III: 2nd Impact) *Fire Manipulation (Via various techniques) *Limited Air Manipulation and
    Pseudo-Flight (Via Demon Armageddon) *Vibration Manipulation (Can unleash massive shockwaves with
    just light strikes and transmitted a massive one throughout a statue in order to collapse the cliff
    behind it. Also via Hyakki Gosai) *Statistics Amplification (Via Ashura Senku, Dohatsu Shoten and
    Shiretsu Hasshi) *Illusion Creation (Via Ashura Senku) *Death and Pain Manipulation (Via Shun Goku
    Satsu/Raging Demon. This technique brings death to its victim through the weight of their own sins,
    and not by Akuma''s fist.Street Fighter Alpha 3 - Akuma''s Ending The eviler the victim is, the more
    they suffer in death.) *Duplication (Via Shun Goku Satsu) *Limited Damage Reduction (Via Rakan, which
    weakens the opponent''s blows) *Limited Power Nullification (Via Kiai, which cancels out normal projectiles)
    *Damage Boost (Can perform enhanced versions of his Special Attacks) *Empowerment (Sip of Calamity
    turns into a different and stronger attack whenever Akuma is at low health) *Status Effect Inducement
    (By hitting the opponent repeatedly, without them being able to recover, he can cause them to enter
    the "Stun" status, which leaves them unable to react. His Focus Attack causes the opponent to enter
    a "crumpling" status) *Limited Fate Manipulation (Fighters can fight against their destiny.) Resistance
    to: *Soul Manipulation (Via Mudo Tensho; Resisted Necalli''s attempt at devouring his soul.) *Corruption
    and Empathic Manipulation (Has perfect control over the Satsui no Hado, preventing it from consuming
    him.Street Fighter V - Kage''s Character Story Is the first person to hold full control over the Shun
    Goku Satsu, as all of his predecessors were taken over by the Satsui no Hado and driven berserk until
    their last breath.All About Street Fighter ZERO 2)'
  source_ids: *id003
  decisive: true
  status: unverified
