- id: claim-standard-equipment-5a169268
  section: equipment
  axis: equipment
  text: '*Herbal Drink: A preparation passed down throughout generations of mountain hermits. It is made
    of herbs, reishi mushroom, ginseng and more. Akin to a medicine or an energy drink, it stimulates
    the user''s ki, improving their control over it and increasing their physical performances. As a side
    effect, it induces a state akin to drunkenness and puts a heavy toll on the body, reason why only
    drunken boxers can take advantage of its properties. Its effects are not limitless and after a certain
    point it ceases to increase ki power, instead replenishing part of it which each swig.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
