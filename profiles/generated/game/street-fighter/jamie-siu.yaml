  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts (Drunken Boxing Expert) *Acrobatics (Hypermobility
    and Self-Momentum: Integrated breakdancing into drunken boxing, developing a style that is perfect
    for either fighting, taunting or simply showing off.Street Fighter VI - World Tour (Enrolling under
    Jamie)Street Fighter VI - Jamie''s TauntsStreet Fighter VI - Jamie''s Win Pose Knows a variety of
    jumping attacks and extremely acrobatic techniques. Can perform backflips in mid-air to regain his
    balance and bounce back on his feet after a knockdown.Street Fighter VI - Gameplay) *Damage Boost
    (Can perform enhanced versions of his Special Attacks) *Statistics Amplification and Chi Manipulation
    (Jamie''s drink stimulates his ki, making stronger and faster the more he drinks it.Street Fighter
    VI - Dee Jay''s Win Quotes (vs. Jamie)) *limited Healing (Drinking his herbal preparation after reaching
    the maximum "drink level" restores a little of his ki reserves) *Pressure Points (Via Tenshin) *Enhanced
    Senses (His drink heightens his awarenessStreet Fighter VI - Dhalsim''s Win Quotes (vs. Jamie)) *Empowerment
    (Gatsuga Saiho turns into a different and stronger attack whenever Jamie is at low health) *Limited
    Fate Manipulation (Fighters can fight against their destiny.) *Resistance to Poison (Minor; Training
    in drunken boxing made him able to withstand large quantities of his herbal drink, whose effects are
    so strong that a simple cup can induce an immediate drunkenness-like state into a semi-accomplished
    fighter such as The Player and cause a heavy nosebleed in anyone but drunken boxers. A similar beverage
