- id: claim-weaknesses-74a42c83
  section: weaknesses
  axis: weakness
  text: 'Some of his techniques become available only after reaching a certain "drink level". Fighting
    Style: |-|Notable Attacks/Techniques= {{#tag:tabber| {{!}}-{{!}}Unique Attacks= *Tensei Kick: Jamie
    rotates his leg upward and kicks the opponent into the air. *Phantom Sway: Jamie slides and spins
    his legs to kick the opponent twice, then turns around and delivers a rear kick. As the opponent falls
    down, Jamie takes an earned goulp from his gourd. *Falling Star Kick: Jamie does a front flip and
    strikes the opponent overhead with his falling heel. *Hermit''s Elbow: Jamie lunges forward and attacks
    with his elbow. *Senei Kick: Jamie steps forward with a low kick aimed at the opponent''s shin. *Bitter
    Strikes: A rapid combo that chains together a jab, a low kick and yet another jab. Unlocked with 1
    drink level. *Full Moon Kick: A Falling Star Kick followed by a double rear kick delivered while performing
    a handstand and drinking from his gourd. Unlocked with 2 drink levels. *Intoxicated Assault: Jamie
    elbows the opponent''s face, then follows up a palm strike to their chest and final dropkick. Unlocked
    with 3 drink levels. *Ransui Haze ("Dead Drunk Rotation"): A sequence of attacks whose execution varies
    depending on the situation. It can consists of a low kick followed by a headbutt, a low kick and a
    triple low spinning palm strike or a low kick with subsequent retreat meant to take a drink from the
    gourd. Unlocked with 4 drink levels. *Vainglory Strike: Jamie spins forward and delivers a powerful
    shoulder bash. *Leg Sweep: After blocking an opponent''s attack, Jamie performs a handstand to deliver
    a heavy roundhouse to their face. {{scroll box|content= TenseiKick.gif|Tensei Kick PhantomSway.gif|Phantom
    Sway FallingStarKick.gif|Falling Star Kick HermitElbow.gif|Hermit''s Elbow SeneiKick.gif|Senei Kick
    BitterStrikes.gif|Bitter Strikes FullMoonKick.gif|Full Moon Kick IntoxicatedAssault.gif|Intoxicated
    Assault RansuiHaze.gif|Ransui Haze VaingloryStrike.gif|Vainglory Strike LegSweep.gif|Leg Sweep }}
    {{!}}-{{!}}Throws= *Back Shaver: Jamie leans his back into the opponent to deliver a double elbow
    to their head and gut, then grabs their right arm and drives his shoulder into their chest. *Wheel
    Punch: Jamie holds the opponent wrist and crumples them with a hefty kick to their midsection. Next,
    Jamie vaults over their back, throws them off balance by pulling their leg and punts their gut with
    a kick. BackShaver.gif WheelPunch.gif {{!}}-{{!}}Special Attacks= *The Devil Inside: Jamie drinks
    from his gourd and unleashes his ki, gainining access to new techniques and incresing his statistics
    the more he drinks. Upon breaking open his vest freeing his hair, Jamie reaches his maximum potential
    and every additional drink replenishes some of his reserves of ki. *Freeflow Strikes: Jamie advances
    forward and punches thrice while spinning. The more he drinks, the more punches are added to the sequence.
    Jamie can increase the strength and speed of this attack at the cost of some more energy. *Freeflow
    Kicks: Similarly to the previous technique, Jamie moves forward with a backhand punch, a rear kick
    and front kick delivered while drinking from his gourd. The ehnhanced version has the same properties.
    *Swagger Step: Jamie lunges towards the opponent and strikes with the heel of his palm. By using more
    energy, Jamie can increase the strength and speed of this attack. *Arrow Kick: Jamie falls on his
    back while kicking the opponent in the air, then springs upward with a flying kick. The enhanced version
    is faster. *Luminous Dive Kick: A diving kick executed in mid-air. Its speed can be increased at the
    cost of more energy. Unlocked with 1 drink level. *Bakkai ("Bursting Twirl"): A flurry of rotating,
    upside-down kicks delivered while sliding along the ground. With enhanced version, Jamie lands more
    and stronger kicks. Unlocked with 2 drink levels. *Tenshin ("Spotted Dragon"): Jamie thrusts his fingers
    in front of their eyes and stops their movements for a moment. The enhanced version leaves the opponent
    completely limp and causing them to fall down, completely open to any attack. Unlocked with 3 drink
    levels. *Swagger Hermit Punch: A Swagger Step followed by an additional strike. The enhanced version
    is stronger. Unlocked with 4 drink levels. {{scroll box|content= DevilInside.gif|The Devil Inside
    FreeflowStrikes.gif|Freeflow Strikes FreeflowKicks.gif|Freeflow Kicks SwaggerStep.gif|Swagger Step
    ArrowKick.gif|Arrow Kick LuminousKick.gif|Luminous Dive Kick Bakkai.gif|Bakkai JamieTenshin.gif|Tenshin
    SwaggerHermitPunch.gif|Swagger Hermit Punch }} {{!}}-{{!}}Super Attacks= *Breakin'': A furious barrage
    of rotating, upside-down kicks. Jamie can even have a drink while executing this move. *The Devil''s
    Song: Jamie takes a huge swig from his gourd, instantly maxing his drink level. As a side effect of
    not reaching it through gradual gulps, its effects lasts for about 15 seconds. If Jamie is already
    at his maximum drink level while executing this techniqu'
