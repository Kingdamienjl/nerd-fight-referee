- id: claim-powers-and-abilities-e09ddd26
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts (Expert in his own feral fighting style.Street
    Fighter V Champion Edition: Official Website) *Acrobatics (Hypermobility and Self-Momentum.) *Natural
    Weaponry (Fangs and claws. Marisa stated that Blanka''s fangs are sharper than a lion''s.Street Fighter
    VI - VS Mode Marisa Win Quote) *Electricity Manipulation *Enhanced Senses (Smell and Vision: Has a
    keen sense of smell, which also allows to recognize different him to tell if someone is scared, evil
    or not human.Street Fighter V - VS Mode Winquotes (Vs. Alex)Ultra Street Fighter IV - VS Mode Winquotes
    (Vs. Decapre)Street Fighter IV - VS Mode Winquotes (Vs. M. Bison)Super Street Fighter IV - VS Mode
    Winquotes (Vs. Oni) Can see in the dark.All About Street Fighter ZERO 3) *Stealth Mastery (An expert
    hunter who reached the top of the food chain in the brazilian jungle.) *Camouflage (His green skin
    blends withAll About Street Fighter ZERO 2 the natural environment) *Social Influencing (Animal Charming:
    Could tame and ride a whale.Street Fighter IV - Blanka''s Prologue) *Adaptation (Became able to generate
    electricity upon being electrocuted by an electric eel. The green color of his skin is due to his
    body having absorbed a mix of herbs and flowers he had painted himself with.Street Fighter VI - World
    Tour - Blanka''s Dialogues His general physique was altered overtime to accustom him to the life in
    the jungle) *Fragrance Manipulation (The mush of plants his body has absorbed permanently was meant
    to repel bugs.) *Extrasensory Perception and Telepathy (Can hear the whispers of the wind, water and
    trees. This is furtherly elaborated by Lily, who states that the spirit of the jungle is with him
    and that he might even able to hear the voice of her wind spirit.Street Fighter VI - VS Mode Winquotes
    (Vs. Lily)Street Fighter VI - Blanka''s Story ModeStreet Fighter VI - Lily''s VS Mode Winquotes (Vs.
    Blanka) Should be able to sense chi, just like other expert chi users.) *Underground Mobility (Via
    Lightning Mole) *Statistics Amplification (Via Jungle Dynamo) *Weapon Mastery and Explosion Manipulation
    (Via Blanka-chan Doll) *Empowerment (Ground Shave Cannonball turns into a stronger attack whenever
    Blanka is at low health) *Damage Boost (Can perform enhanced versions of his Special Attacks) *Status
    Effect Inducement (By hitting the opponent repeteadly, without them being able to recover, he can
    cause them to enter the "Stun" status, which leaves them unable to react. His Focus Attack causes
    the opponent to enter a "crumpling" status) *Limited Fate Manipulation (Fighters can fight against
    their destiny.) Resistance to: *Electricity (Even before developing his powers, he endured being shocked
    by an electric eel with enough power to knock out a horse and immediately stomped the eel in retaliation.)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
