- id: claim-powers-and-abilities-f1dbc3e2
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Master Capoeirist *Acrobatics (Hypermobility and Self-Momentum.
    Elena''s fighting style - capoeira- features a profusion of acrobatics and articulated movements.
    Her repertoire includes handstands, flips and flying kicks, and extends even further. She can also
    walk on her hands, use backflips to maintain her balance when struck in mid-air and recover her footing
    with a cartwheel when knocked down.Street Fighter VI - Gameplay Could swiftly evade several hippos
    charging at herStreet Fighter VI - World Tour) *Healing (The Majivu people have inherited the power
    of healing from their ancestors, who in turn are said to have obtained it from a fountain of life.
    Elena is one of the few children born with this ability and she demonstrates it via techniques such
    as Healing and Revival Dance) *Energy and Life Manipulation (Akuma stated that Elena emanates "the
    very force of life".Street Fighter VI - Elena''s Story Mode Zangief has commented on this ability,
    labeling it as "The power of Mother Earth".Street Fighter VI - Zangief''s Win Quote vs. Elena Her
    strongest technique, Song of the Grasslands, is said to be powered by nature itself. This power emanates
    from Elena''s body as a green glow and it is related to the power of healing he has inherited from
    her ancestors. This energy is also seen empowering some of her special and super attacks) **Minor
    Plant Manipulation (A side-effect of some of her strongest techniques is to seemingly make grass and
    flowers sprout from the ground spontaneously) *Minor Extrasensory Perception and Telepathy (Elena
    has been able to "hear the voice of nature" since childhood; while she herself does not understand
    it completely, she describes it as the ability as empathic bond with nature which normal people do
    not possess. She has also been able to communicate with trees, although not perfectlyUltra Street
    Fighter IV - Elena''s Prologue) *Air Manipulation (Via Sylph Amulet) *Social Influencing (Has an astonishing
    ability to befriend others, even with the likes of Akuma) *Empowerment (Song of the Grasslands turns
    into a different and stronger attack whenever Elena is at low health) *Damage Boost (Can perform enhanced
    versions of her Special Attacks) *Status Effect Inducement (By hitting the opponent repeatedly, without
    them being able to recover, she can cause them to enter the "Stun" status, which leaves them unable
    to react. Her Focus Attack causes the opponent to enter a "crumpling" status) *Limited Fate Manipulation
    (Fighters can fight against their destiny)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
