  intelligence:
    text: 'Gifted (Elena has been regarded as a natural fighter since her childhood, having quickly learned
      capoeira from her brother Marcus soon after his return from Brazil. Since then, she has demonstrated
      the ability to improve and become stronger at a quick pace, en example being the time she surpassed
      her brother, whom she previously couldn''t defeat, after her first round-the-world trip to compete
      in the 3rd World Tournament. Since then she has grown into an expert capoerist, has grasped held
      of her innate supernatural abilities and even came to compete in the 4th World Tournament. She was
      also capable of passing on her fighting style to the Player, a mark of her skills as a teacher.
      Elena is also a passionate scholar, having attended school first in JapanStreet Fighter III: 2nd
      Impact - Elena''s Arcade Ending and then in FranceStreet Fighter III: 3rd Strike - Elena''s Arcade
      Ending to follow in on her father''s footsteps.Street Fighter 30th Anniversary Collection After
      finishing university, Elena decided to become a veterinarian and while she is not yet a professional,
      she has already began to put her skills to practice on the field. She is also a polyglot, knowing
      Japanese, French, English and the traditional language of her people, the Majivu. )'
    source_ids: *id002
    confidence: 0.95
