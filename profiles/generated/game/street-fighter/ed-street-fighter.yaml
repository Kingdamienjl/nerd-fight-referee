- id: claim-powers-and-abilities-07a1271d
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts (Psycho Boxing Mastery) *Acrobatics (Can perform
    a variety of jumping attacks, roll on the ground to recover his footing, jump back on a standing position
    after a knock down and do backflips in the air to keep his balance after a strike) *Chi Manipulation
    (Psycho Power: Was bestowed the ability to manipulate M. Bison''s Psycho Power, a type of chi energy
    related to one''s mind that grants him several special abilities and enhances the power of his physical
    strikes) *Supernatural Willpower (Psycho Power is influenced by one''s psyche and a strong mind is
    required in order to control it. Very few individuals can wield it without having their mind broken
    or even perish, and even less can undergo the training necessary to master itStreet Fighter VI - World
    Tour (JP Dialogues)) *Extrasensory Perception (Should be able to sense chi, just like other expert
    chi users. Sensed the Psycho Power coursing through the Player.) *Telekinesis (Remotely stole Zangief''s
    chess key and lifted F.A.N.G.''s hat.Street Fighter V - A Shadow Falls) *Fire Manipulation (Used his
    Psycho Power to scorch F.A.N.G.''s hat and Balrog''s golden glove.Street Fighter V - Balrog''s StoryStreet
    Fighter V - Balrog''s Arcade Ending (SFV Route) Accidentally burned a linen with a Psycho Power-charged
    paper plane.Street Fighter V - Falke''s Arcade Ending Psycho Power manifests as purple flames and
    engulfs the opponent in them on hit.Street Fighter VI - Ed''s TauntsStreet Fighter V and VI - Gameplay)
    *Minor Power Bestowal (Can imbue little objects with Psycho Power) *Explosion Manipulation (Psycho
    Sparks can detonate into large blastsStreet Fighter VI - Ed''s Victory Animation) *Thread Manipulation
    (Able to project wires of Psycho Power to snare the opponent, as also displayed by several of his
    techniques.Street Fighter VI - World Tour - Meeting Ed Such constructs can also be made into an elastic
    web that traps the opponent [Psycho Chamber] and bounces projectiles away.) *Damage Boost (Can perform
    stronger versions of his special attacks at the expense of more stamina) *Empowerment (Psycho Chamber
    turns into a different and stronger attack whenever Ed is at low health) *Limited Fate Manipulation
    (Fighters can fight against their destiny.) Resistance to: *Mind Manipulation (Possesses the psychic
    fortitude required to not have his mind and heart crushed by the grievous effects of Psycho Power.)
    *Possession (Fought and won a long-lasting battle against M. Bison''s will which attempted to crush
    his self and take over his body.Street Fighter VI - World Tour (Ed''s Dialogues))'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
