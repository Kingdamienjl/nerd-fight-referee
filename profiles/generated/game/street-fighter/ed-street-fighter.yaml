- id: claim-weaknesses-7ba34b81
  section: weaknesses
  axis: weakness
  text: 'None notable. Fighting Style: *Psycho Knuckle: Ed charges up Psycho Power into his fist and dashes
    forward at great speed, punching the opponent and placing himself behind them to follow up with further
    attacks. *Cobra Punch: A punch to the face delivered while leaping forward. *Flicker Combination:
    A triple of high jabs. *Body Blow Combination: Two uppercuts to the midsection, with the second sending
    the opponent flying. *Hitman Combination: A low and a high jab in rapid succession, followed by a
    heavy downward punch that knocks the opponent down. *Low Smash Combination: A jab to the midsection
    followed by a strong uppercut. *Turn Punch: Ed pivots and delivers a hefty straight punch. *Hammer
    Blow: Ed blocks and attack and counters with a strong uppercut. PsychoKnuckle.gif CobraPunch.gif FlickerCombo.gif
    BodyLowCombo.gif HitmanCombo.gif LowBodyCombo.gif EdTurnPunch.gif HammerBlow.gif *Face Buster: Ed
    grabs the opponent''s shoulder and pulls them towards himself, then he does a shoulder check to their
    face before knocking them away with a powerful hook. *Rib Crusher: Ed catches the opponent by the
    arm, switches sides with them and delivers a punch to the kidney and one to the head. *Psycho Blow:
    Ed staggers the opponent with a punch to the gut and then uppercuts them away. *Cheat & Smash: Ed
    throws the opponent off balance with a push, uppercuts them in the air and turns around to strike
    them with a hook as they fall. FaceBuster.gif RibCrusher.gif PsychoBlow.gif|Clips taken from ToniToniVersus
    Cheat&Smash.gif| *Psycho Spark: Ed down a close-range punch and winds up a sphere of Psycho Power
    that deals damage and shields from incoming projectiles. The enhanced version is stronger. **Psycho
    Shoot: Ed jabs forward and fires the sphere generated by Psycho Power as a flying a projectile. *Psycho
    Upper: An uppercut cloaked in Psycho Power that sends the opponent flying upward. The enhanced version
    is stronger and allows Ed to follow up with a downard punch that slams the opponent on the ground.
    *Psycho Blitz: Several types of close-range punch combinations infused with Psycho Power. The enhances
    version consists in a flurry of super-fast, close-ranged uppercuts to the chest, followed by a downward
    hook and a powerful uppercut. *Psycho Flicker: A quick jab imbued with Psycho Power that greatly extends
    the reach of the attack. By charging the move up, the Psycho Powe will stick on the target and turn
    into an energy net that allows Ed to pull them over and make them vulnerable to further attacks. *Kill
    Rush: Ed tucks down and dashes forward at great speed, useful to close the distance or fall back in
    retreat. **Kill Switch Break and Chaser: Two uppercuts released at different timings, speed and reach
    depending on what best fits the moment. *Psycho Rising: A rising kick imbued with Psycho Power that
    launches the opponent upward. **Psycho Splash: Ed dives down fist-first to strike the airborne opponent.
    *Psycho Storm: A rapid flurry of Psycho Flickers culminating in a strong hook. *Psycho Cannon: Ed
    focuses his Psycho Power into a single, large sphere of energy and sends it towards the opponent.
    *Psycho Barrage: Ed advances forward while unleashing a series of jabs imbued with Psycho Power to
    the opponent''s adbomen. After the initial rush, Ed leaves the stunned opponent in place and stars
    dashing around them at high speed to further punch them throghout the whole body. He finishes the
    assault with a powerful uppercut right to the chin that blasts them up in the air. *Psycho Chamber:
    Ed charges up a Psycho Flicker and strikes the opponent in the chest, launching them away. The leftover
    Psycho Power lingering on the opponent''s body morphs into a sticky web that snares their feet and
    arms, keeping them suspended in the air in a crux fashion. Ed advances and starts barraging their
    costricted body all over with powerful shots, then finishing with a strong uppercut that sends them
    flying. If Ed is drawing close to defeat, he will extend the combination by snaring the airborne opponent
    with Psycho Power threads, pull them towards himself and violently smashing them down with a hook
    to the face. Street Fighter V - Ed Critical Art Psycho Barrage Street Fighter 6 - Ed ALL Super & Critical
    Arts *Kill Step: Upon blocking an opponent''s attack, Ed turns around and puts himself behind the
    opponent. *Psycho Split: Ed quickly dashes backwards to dodge an incoming attack and replies with
    a powerful uppercut that strikes the opponent before they are able to react, knocking them down. *Psycho
    Snatcher: Ed latches a Psycho Power thread onto the opponent and pulls himself closer to deliver a
    staggering gut punch. By charging the move, Ed can instead multiply the wires and pull back the opponent,
    leaving them airborne and vulnerable. *Psycho Swing: Ed closes in on the opponent and strikes with
    a powerful hook or uppercut imbued in Psycho Power. *Enhanced Snatcher: A stronger version of Psycho
    Snatcher, with which Ed leaps onto the snared oppon'
  source_ids: *id003
