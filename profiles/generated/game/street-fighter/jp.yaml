- id: claim-powers-and-abilities-4645d315
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Genius Intelligence *Martial Arts *Weapon Mastery *Acrobatics
    (Hypermobility and Self-Momentum: Utilizes several jumping attacks and is able to perform backflips
    to maintain his balance when struck in mid air) *Chi Manipulation *Social Influencing *Supernatural
    Willpower (Psycho Power is influenced by one''s psyche and a strong mind is required in order to control
    it. Very few individuals can wield it without having their mind broken or even perish, and even less
    can undergo the training necessary to master it) *Extrasensory Perception and Clairvoyance (Should
    be able to sense chi, just like other expert chi users. Was aware of The Player sneaking into the
    champion belt room. Sensed Kimberly approaching his location.) *Teleportation (Psycho Power lets him
    dematerialize at will and reappearStreet Fighter VI - JP''s Arcade Mode elsewhere, both from close
    and long distances.Street Fighter VI - World Tour (Enrolling under JP cutscene)) *Fire Manipulation:
    (His Psycho Power should have the same properties as Ed''s, due to visually behaving in the same way
    when striking the opponent.) *Power Bestowal (Infused The Player with Psycho Power, allowing him to
    become his student and learn his techniques.) *Mind Manipulation (Bestowing Psycho Power upon individuals
    unable to control it inexorably drives them to insanity and possibly even death. One of Shadaloo''s
    test subjects has been left victim of continuous mental disorders, hallucinations, panic attacks and
    more.All About Street Fighter ZERO 3) *Matter Manipulation (Able to conjure his Psycho Power in the
    form of large thorns erupting from the ground or else, as shown by his special techniques.) *Spatial
    Manipulation and Portal Creation (Via Departure) *Forcefield Creation and Homing Attack (Via Amensia)
    *Durability Negation (Via Interdiction) *Explosion Manipulation (Via several techniques) *Telepathy
    (Spoke in Kimberly''s mind.) *Astral Projection (Can manifest Torbalans, entities made of Psycho Power
    that fight beside him. These phantoms can also appear, scout and attack even if JP isn''t present.Street
    Fighter VI - World Tour He seemingly showed himself to Kimberly as an illusion, before appearing physically.Street
    Fighter VI - Kimberly''s Arcade Mode Apparently manifested next to Ken in a similar fashion.Street
    Fighter VI - Ken''s Arcade Mode) *Damage Boost (Can perform enhanced versions of his Special Attacks)
    *Empowerment (Interdiction turns into a different and stronger attack in whenever JP is at low health)
    *Afterimage Creation (Can seemingly leave afterimages behind him) *Limited Fate Manipulation (Fighters
    can fight against their destiny.) Resistance to:to: *Mind Manipulation (Possesses the psychic fortitude
    required to not have his mind and heart crushed by the grievous effects of Psycho Power.) *Possession
    (In order to control Psycho Power and remain himself he must have been able to overcome M. Bison''s
    will like Ed had to do)'
