- id: claim-weaknesses-01c84100
  section: weaknesses
  axis: weakness
  text: 'None notable Fighting Style: |-|Notable Attacks/Techniques= {{#tag:tabber| {{!}}-{{!}}Unique
    Attacks= *Guillotinna: A roundhouse downward kick. *Malice: A low kick aimed at the opponent''s feet.
    *Bylina: A rear kick that sends the opponent flying. *Grom Strelka: Using his cane, JP bashes the
    opponent overhead and follows up with a mid swing. *Zilant: A combination of attacks that starts with
    a high kick and a mid cane swing, which can be followed by a overhead or low cane strike. *Espada:
    JP steps forward and delivers a powerful thrust with his cane. *Exilio: JP blocks an incoming attack,
    then pivots on himself and bats the opponent away with his Psycho Power-infused cane. Guilottina.gif
    JPMalice.gif Bylina.gif GromStrelka.gif Zilant.gif ZilantMid.gif ZilantLow.gif Espada.gif Exilio.gif
    {{!}}-{{!}}Throws= *Ravina: JP grabs the opponent by the arm and thrusts his cane into their midsection.
    *Uragan: JP pulls the opponent towards himself and flips them over by pushing their back. *Tornado:
    JP grabs an airborne opponen and tosses them behind himself. Ravina.gif UraganJP.gif TornadoJP.gif
    {{!}}-{{!}}Special Attacks= *Triglav: JP plants his staff into the ground, causing large thorns of
    Psycho Power to emerge at a distant location, even underneath the opponent. By consuming more energy,
    JP can conjure multiple spikes in a row. *Stribog: JP imbues his cane with Psycho Power and pivots
    in place, smacking the opponent first and then launching them away with thorns that protrude forward.
    The strength of this attack can be increased at the cost of more energy. *Departure: JP places a void
    of Psycho Power in the air from which thorns spawn after a couple seconds. Using more energy, JP can
    places two rifts next to each other. **Shadow: JP spawns thorns from a Departure at his own timing,
    useful to deceive the opponent and keep them guessing. **Window: JP vanishes and warps out from a
    Departure portal with a drop kick. *Amnesia: JP covers himself in a barrier of Psycho Power, which
    absorbs an opponent''s attack and turns into a sphere that follows them and explodes into spikes after
    a moment. JP can conjure two bombs at the cost of more energy. *Torbalan: JP sends out his Psycho
    Power clones to claw at the opponent. *Embrace: JP summons a Torbalan that hugs the opponent and explodes
    into a blast of Psycho Power. Triglav.gif Stribog.gif DepartureJP.gif DepartureWindow.gif JPAmnesia.gif
    Torbalan.gif JPEmbrace.gif|Clips taken from:Mr Alberonen FGC {{!}}-{{!}}Super Attacks= *Chornobog:
    JP fires two interlocked shockwaves of Psycho Power. *Lovushka: JP generates four spheres of Psycho
    Power around the opponent, which then transform into Torbalans that assault the opponent one after
    the other. *Interdiction: JP teleports in front of the opponent and lifts them up by the neck, channeling
    Psycho Power through their body. As the victim contorts in pain, JP pokes them with his cane and triggers
    an explosion of Psycho Power thorns from within their body. Upon drawing near to defeat, JP can instead
    imbue the opponent with Psycho Power, slam them down and and evoke a tower of thorns underneath them
    that rises upward and impales them in multiple spots, just to finish them off with even more spikes
    that erupt from inside them. center|335px }} |-|Combat Skills= ===Psycho Power=== A form of Chi Energy
    created by M. Bison as a corruption of Soul Power. Psycho Power borns from the user''s soul and is
    influenced by their psyche. It increases physical characteristics and allows to perform all sorts
    of wonders, but only if the user is able to tolerate the extreme toll that is put on their body and
    mind as a consequence. Psycho Power is extremely versatile and its holders can utilize it in different
    ways according to their own will and ingenuity. JP always envied M. Bison and longed to attain his
    power for himself, which he eventually did through unknown methods. According to his own admission,
    JP has yet to grasp full control over Psycho Power, even though is able to utilize several of his
    former boss''s abilities and new ones that reflect his distate for physical combat. center|400px ===Bartitsu===
    A modification of such gentlemanly fighting style resulted from the enhancements granted by Psycho
    Power.Street Fighter 6 Developers answer the fans burning Questions! JP believes physical combat to
    be irrational and a pointless exposure to the enemy''s attacks, reason why he maintains himself distantStreet
    Fighter VI - JP''s in-game character guide while keeping the opponent guessing and away from him,
    engaging in close combat only out of necessity or if given a safe opportunity. JP feels only contempt
    towards weaker opponents and isn''t used at outright killing defeated foes, but is still known for
    murdering people he needs to dispose of. center|400px ==Gallery== {{scroll box|content= JPConcept.webp
    JPConcept2.webp Street Fighter 6 JP''s Theme - The Plunderer }} ==Notable Matchups== Victories: Losses:
    Inconclusive: ==References== {{scroll box|content={'
