  intelligence:
    text: 'Genius {{scroll box|content= A machiavellian businessman and expert fighter who rose to power
      through a series of successful plots. Used to be Shadaloo''s accountant, a time during which he
      managed the organization''s financial matters and initiated the plan that led him to attain M. Bison''s
      Psycho Power.Street Fighter VI - World Tour (JP Dialogues) After the fall of Shadaloo, he moved
      through corporations and NGOs and got involved in infrastructure projects in a lot of countries,
      committing financial crimes all over the world and being directly responsible for ethnic conflicts,
      civil wars and more. JP consistently manages to come out clean from his ordeals, vanishing and then
      reapparing in the guise of a different person. He can impersonate multiple identities, speak different
      accents and act with such a convinction to fool everyone he interacts with of his good intentions
      and extraneousness to the trail of destruction that he leaves behind him. He even received a letter
      of commendation from the president for his work.Street Fighter VI Comics - Issue #4 In his latest
      exploit, JP became the head of the Terra Network Partners, an NGO that supports developing countries,
      and the acting policy advisor of to the the country of Nayshall, bringing it to independence and
      economic and technological progress. In doing so, he convinced Ken Masters into using his Foundation
      to lend him billions worth of funds. JP simultaneously double-crossed his partners by forming and
      leading a subservise terrorist group named Amnesia, manipulating its members for his own interests.
      JP thus committed a huge operation of money laundering and coming out of it cleanly after framing
      and blackmailing Ken for the crime.Street Fighter VI Comics - Issue #1Street Fighter VI Comics -
      Issue #2Street Fighter VI Comics - Issue #3 JP is quite sophisticated, possesses a vast vocabulary
      and is knowledgeable in topics such as chess puzzles, cuisine, music and philosophy, the latter
      being something he often muses about.Street Fighter VI - JP Win Quotes (vs. Zangief) Although he
      believes to not being an expert in neither Psycho Power nor combat, JP succeeded in emplyoing M.
      Bison''s power in old and new ways, as well as developing a personal fighting style and proving
      himself a worthy opponent to fighters of the caliber of Kimberly, Cammy, The Player and possibly
      even Ken. Lastly, JP is an excellent teacher who succeeded in imparting his fighting style and techniques
      on The Player. }}'
    source_ids: *id002
    confidence: 0.95
