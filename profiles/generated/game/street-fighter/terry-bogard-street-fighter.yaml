    fighters admired him and sought out to confront their skills against him. Terry's adaptability allows
    him to comfortably engage in battle in any kind of unorthodox location. Has fought Joe Higashi, champion
    of Muay Thai, countless times and has defeated him in the first "The King of Fighters" tournament.Street
    Fighter VI - World Tour - Pao Pao Cafe (talk with George Azuma) Has never lost a fight to his little
    brother Andy, who is a master of Shiranui ninjutsu. Terry is an old rival of the likes of Ryu, Ken
    andStreet Fighter VI - Terry's Victory Quotes (Vs. Chun-Li) Chun-Li, all of whom still recognize his
    skill, valour and spirit even after over twenty years)
