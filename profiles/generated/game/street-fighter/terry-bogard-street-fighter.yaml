  intelligence:
    text: Gifted in combat (Terry is a seasoned fighter with a lifetime of experience behind his back
      and known worldwide as the "Legendary Hungry Wolf". He has been trained since childhood by his late
      father Jeff Bogard, who was an accomplished martial artist recognized by his own master Tung Fu
      Rue. When his father was killed by Geese, a fellow martial artist turned to evil, Terry and his
      brother Andy kept on training solitarily. Many years later, their quest culminated in the King of
      Fighters Tournament, where Terry finally claimed his revenge on Geese. Terry's journey did not end
      there, in fact he kept traveling the world in order to meet strong challengers and hone his crafts,
      never stopping much a single place. Terry made short work of the Player in just a few moves, gracefully
      avoiding all their attacks and claiming victory without even striking them; by this point in the
      story, the Player has already gained fame for his capabilities, mastered and blended a large number
      of fighting styles [varying depending on each playthrough] and won the Nayshall fighting tournament.
      Later, Terry proved to be a capable teacher and passed down his techniques onto them. Terry was
      the special VIP invited to the opening of the Pao Pao Cafe, a chain of stores widely renownedStreet
      Fighter VI - World Tour - Knockout Festival event (talk with Chad) as a nexus of skilled fighters.
      Because of his fame, a crowd of competent fighters admired him and sought out to confront their
      skills against him. Terry's adaptability allows him to comfortably engage in battle in any kind
      of unorthodox location. Has fought Joe Higashi, champion of Muay Thai, countless times and has defeated
      him in the first "The King of Fighters" tournament.Street Fighter VI - World Tour - Pao Pao Cafe
      (talk with George Azuma) Has never lost a fight to his little brother Andy, who is a master of Shiranui
      ninjutsu. Terry is an old rival of the likes of Ryu, Ken andStreet Fighter VI - Terry's Victory
      Quotes (Vs. Chun-Li) Chun-Li, all of whom still recognize his skill, valour and spirit even after
      over twenty years)
    source_ids: *id002
    confidence: 0.95
