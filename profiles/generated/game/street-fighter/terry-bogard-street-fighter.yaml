- id: claim-weaknesses-d42312e7
  section: weaknesses
  axis: weakness
  text: 'None notable. Fighting Style: *Hammer Punch: An overhead punch delivered while lunging forward.
    *Power Drive: Two straight punches thrown in a row, with the second one being empowered by ki and
    launched while spinning in place. *Power Shoot: A straight punch followed by an upward roundhouse
    kick which sends the opponent flying. *Power Dunk: A sequence of attacks performed after a Power Shoot.
    It consists of a jumping tackle and a diving punch enfused in ki energy. *Passing Sway: A straight
    punch and a horizontal roundhouse kick. **Jumping Lariat: Following a Passing Sway, Terry hops to
    the side of the opponent and hits them with a lariat while remaining positioned in front of them.
    Alternatively, he can perform a feint while instead jumping behind them. **Jumping Knee: In a similar
    fashion to before, Terry hops and knees the opponent while placing himself behind them. Conversely
    to the previous move, Terry does a feint but remains in front of the adversary. *Fire Kick: A low
    kick connected to a high, diagonal kick done while dashing forward. *Back Spin Kick: A spinning, roundhouse
    kick delivered while lunging forward. This attack packs more strength than usual, being meant to be
    a particularly heavy blow. *Back Knuckle: After blocking an incoming blow, Terry pivots in place and
    knocks the enemy off with a swing of his fist. *Grasping Upper: Terry grabs the opponent and pulls
    them closer while bending them down. He then knees them in the gut and launches them back with an
    uppercut to the chin. *Buster Throw: Terry grapples the opponent, turns around and lifts them on his
    shoulder in order to slam them back-first on the floor. GraspingUpper.gif SFBusterThrow.gif *Power
    Wave: Terry punches the floor and unleashes a projectile that slides forward across the ground. The
    speed and reach of the technique can be modulated to different degrees in order to keep the opponent
    guessing. The enhanced version moves slower but its harder and travels very far. *Round Wave: Terry
    smashes the ground and triggers a stationary blast similar to a Power Wave. Meant to be used up close,
    it may stagger the opponent even if they block it. *Quick Burn: A swift combination consisting in
    a hook and downward punch, both infused with energy. Useful to string in other attacks, apply pressure
    or break through defenses. The enhanced version is powered by stronger orange energy and adds a rising
    shoulder tackle at the end which launches the opponent away. *Burning Knuckle: Terry quickly leaps
    forward with his energized fist outstretched. The enhanced version packs even more strength and lets
    him reach farther. *Power Charge: Terry spins in place and charges forward with a hefty shoulder check.
    Heavier versions may even knock the opponent in the air, opening the way to further attacks. The enhanced
    version is brutally strong and launches the victim across a great distance. *Crack Shoot: Terry performs
    a forward somersault jump and meets the adversary with his falling heel. Great to catch airborne opponents
    and avoid incoming attacks, especially when done at different heights. The enhanced version is stronger.
    *Rising Tackle: A physics-defying jumping attack delivered by spinning upside-down, ascending upward
    in the air and hitting the target with rotating kicks. The enhanced version is quicker in execution
    and moves faster for multiple hits. *Buster Wolf: Terry dashes forward at mad speed and drives his
    fist into the opponent, before letting out a violent burst of energy which blows them away. *Power
    Geyser: Terry smashes the ground and generates a powerful eruption of energy in front of him. Depending
    on his reserves of energy, Terry can unleash up to three geysers in a row, with the second ones exploding
    each at a farther distance. Terry can also delay the detonation of these geyers and have them explode
    all togetherStreet Fighter VI - Terry''s Victory Animation at the same time, while also reaching higher
    in the sky. *Rising Fang: Terry''s most powerful technique. After having his power overflow from the
    whole body, Terry initiates a Rising Tackle which sends the opponent flying upward. Upon dropping
    down, Terry gathers even more energy in his fist and immediately springs up with a second Rising Tackle,
    striking the still airborne opponent with a long series of drilling kicks. Once reached the apex,
    Terry finishes the assault with an extremely powerful, upside-down Buster Wolf which explodes a blast
    of energy right through the opponent''s body. If Terry is drawing close to defeat, he replaces his
    second Rising Tackle with a Burning Knuckle aimed at the floor, triggering a detonation which sends
    him flying at high speed towards the falling opponent. Terry then delivers a flying Buster Wolf of
    unprecedented magnitude that finishes off the target. Terry All Supers And Critical Art (4K PS5) -sf6'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-c965401c
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Martial Arts (Terry has mastered a unique form of martial
    arts rooted in Hyakkyokuseiken and expanded through his own ingenuity [further details in the sections
    below]), Acrobatics (Terry can perform a number of jumping attacks and extremely acrobatic special
    techniques. He is also able to perform somersault jumps forward and backward, recover his footing
    with a quick back roll or a handspring when knocked down and use backflips to maintain his balance
    when struck in mid-air.Street Fighter VI - Gameplay Moreover, Terry smoothly landed on his feet when
    an opponent flung him in the air.Street Fighter VI - World Tour Has fought on a floating raft and
    a moving train), Chi Projection (Terry can cloak his fists in pure energy to enhance their strength
    and even project it outwards in the form of projectiles or violent eruptions. This energy has a bright
    blue color when used lightly, but takes on a fierce orange tone when released at high levels of power),
    Extrasensory Perception (Should be able to sense chi like other expert chi users), Possibly Heat Manipulation
    and Blessed (Lily claims he is blessed by the spirits of fire,Street Fighter VI - Terry's Victory
    Quotes (Vs. Lily) which should be the secret behind his "burning fists".Street Fighter VI - Lily's
    Victory Quotes (Vs. Terry) Several of his energy attacks seem to bear fiery properties, such as charring
    the ground and leaving smoke behind them), Damage Boost (Can perform enhanced and different versions
    of his Special Attacks), Empowerment (Rising Fang turns into a different and stronger attack whenever
    Terry is at low health), Limited Fate Manipulation (Fighters can fight against their destiny.)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
