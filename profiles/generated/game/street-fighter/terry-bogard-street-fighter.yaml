  text: Gifted in combat (Terry is a seasoned fighter with a lifetime of experience behind his back and
    known worldwide as the "Legendary Hungry Wolf". He has been trained since childhood by his late father
    Jeff Bogard, who was an accomplished martial artist recognized by his own master Tung Fu Rue. When
    his father was killed by Geese, a fellow martial artist turned to evil, Terry and his brother Andy
    kept on training solitarily. Many years later, their quest culminated in the King of Fighters Tournament,
    where Terry finally claimed his revenge on Geese. Terry's journey did not end there, in fact he kept
    traveling the world in order to meet strong challengers and hone his crafts, never stopping much a
    single place. Terry made short work of the Player in just a few moves, gracefully avoiding all their
    attacks and claiming victory without even striking them; by this point in the story, the Player has
    already gained fame for his capabilities, mastered and blended a large number of fighting styles [varying
    depending on each playthrough] and won the Nayshall fighting tournament. Later, Terry proved to be
    a capable teacher and passed down his techniques onto them. Terry was the special VIP invited to the
    opening of the Pao Pao Cafe, a chain of stores widely renownedStreet Fighter VI - World Tour - Knockout
