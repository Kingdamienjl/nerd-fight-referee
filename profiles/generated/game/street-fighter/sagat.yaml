- id: claim-powers-and-abilities-0f68aa3d
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Muay Thai Master *Acrobatics (Hypermobility
    and Self-Momentum; Sagat is able to perform attacks in mid-air and employs acrobatic
    techniques which surpass conventional human limits. Such abilities can also be
    applied for defense, such as nullifying throws, somersaulting in mid-air to regain
    balance after having been hit, or rolling across the ground to swiftly shift position)
    *Chi Manipulation and Projection (Sagat can harness his chi to empower his physical
    strikes and fire energy projectiles. Years of relentless training have also made
    him develop an affinity to the Satsui no Hado, the Murderous Intent, a power that
    grants incredible strength at the cost of their sanity; however, Sagat have always
    refused to give in to its tentations, utilizing it very scarcely and only from
    demonstration) *Extrasensory Perception (Should be able to sense chi, just like
    other expert chi users. Was able to witness the Player''s inner battle against
    their dark side) *Aura (Can envelop himself in a battle auraAll About Street Fighter
    ZERO 3) *Social Influencing (Animal Charming; Has found and raisedShadaloo C.R.I.
    - Concept/Rejected Art his pet tiger Willa Maiu, which has stood loyal to him
    even in adulthood. Instigating Fear; Sagat carries himself with a powerful demeanor
    which appears intimidating to most; such behavior was engraved onto his person
    by the dignity emanated by Nuakan, the late emperor of Muay Thai whose title was
    stripped by Sagat himself. His mere, silent presence made a local leaders more
    favorable towards an appeal of the village elder) **Minor Perception Manipulation
    (His sheer aura made the Player experience a frightul hallucinationStreet Fighter
    VI - World Tour) *Fire Manipulation (Via Tiger Raid) *Damage Boost (Can perform
    enhanced versions of his Special Attacks. Angry Charge and Hanuman Charge enhance
    his Tiger Uppercut and Tiger Knee) *Empowerment (Tiger Vanquisher ascends into
    a stronger versions whenever Sagat is at low health) *Status Effect Inducement
    (By hitting the opponent repeteadly, without them being able to recover, he can
    cause them to enter the "Stun" status, which leaves them unable to react. His
    Focus Attack causes the opponent to enter a "crumpling" status) *Limited Fate
    Manipulation (Fighters can fight against their destiny) Resistance to: *Corruption
    (Awakened and managed to overcome the influence of the Satsui No Hado,Street Fighter
    V - Sagat''s Character Story which he came to control, albeit to a very limited
    extent, years later)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
