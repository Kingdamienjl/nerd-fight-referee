    roundhouse kick delivered while advancing forward. *Tiger Sting: A straight punch
    followed by a kick to the midsection. *Tiger Slash: A low punch followed by an
    overhead elbow strike. *Tiger Rise: A low punch followed by a powerful knee uppercut
    which knocks the opponent into the air. *Tiger Punishment: Sagat lunches forward
    with a hefty hook, pushing through incoming attacks. *Tiger Twin Babel: After
    blocking an opponent''s attack, Sagat retaliates with a double punch delivered
    with clasped hands. *Edge Knee Strike: Sagat delivers a quick knee strike to the
    opponent''s midsection. *Fake Kick: Sagat performs a feint, faking to deliver
    a high kick. *Focus'
