- id: claim-weaknesses-d87555f0
  section: weaknesses
  axis: weakness
  text: 'Her poison might require higher dosages and more time against larger and/or stronger opponents
    opponents.Street Fighter VI - A.K.I.''s Versus Mode Win Quotes (Vs. Luke, E. Honda and Zangief) Fighting
    Style: *Pu Lao: An overhead slash delivered by pivoting on place. *Chi Wen: A double claw thrust performed
    while lunging forward. *Qiu Niu: A small forward hop that enables two rising kicks in a row. *Gong
    Fu: A diving slash from above the opponent. *Hun Dun: A pair of claw slashes at chest height. *Qiong
    Qi: A lunging stab to the chest followed by yet another stab, this time from a crouching position
    and with the added effect of poisoning the target. *Zao Chi: A low roundhouse kick delivered while
    advancing forward in a crouching stance. *Feng Shi: A reverse, low front walkover resulting in a hefty
    overhead kick. *Whisper: A.K.I breaks the opponent poise with a series of arm movements, then locks
    their neck and sweeps their leg, sending them crashing to the ground. *Gluttony: A.K.I. twists the
    opponent arm, switching places and forcing them onto their knees, defenseless against a double claw
    thrust. Whisper.gif Gluttony.gif *Nightshade Pulse: A.K.I. launches a bubble at the opponent which
    explodes on hit and poisons them. She can also perform an enhanced version that travels faster and
    deals more damage. **Nightshade Chaser: A.K.I. extends her talons to burst the bubble, increasing
    its blast range and triggering Toxic Blossom *Orchid Spring: A.K.I. pierces the ground with her talons,
    generating a puddle of poison. *Toxic Wreath: A.K.I. slashes downard while also creating and bursting
    a bubble that poisons the opponent. *Serpent Lash: A.K.I. lashes out with her talons to pierce and
    poison the enemy. The enhanced version is stronger and travels faster. *Cruel Fate: A.K.I. does a
    reverse somersault to place herself over the opponent and claw them as she descends. With the enhanced
    version, she clutches the opponents neck with her legs and stabs their face several times, poisoning
    them in the process. *Snake Step: A.K.I. quickly slides forward and/or behind the opponent. She can
    also perform a deceiving feint. With the enhanced version A.K.I. covers a higher distance. *Sinister
    Slide: A.K.I. slithers on her back like a snake to close in on the opponent and avoid incoming attacks.
    She can follow up with three attacks. **Venomous Fang: A.K.I. punces forward claw-first and poisons
    the opponent on hit. **Heel Strike: A.K.I. revolves on herself and delivers to low kicks as she rises
    up. **Entrapment: A.K.I. crawls on the opponent and snares them with her body, constricting them into
    submission before letting go. *Deadly Implication: A.K.I. does a handstand, kicks the opponent upward
    and traps them into a large poisonous bubble, which then explodes. *Tainted Talons: A.K.I. bends forwards
    and extends all her talons to lash at the opponent, triggering a poisonous burst and leaving a large
    toxic pool on the ground. *Claws of Ya Zi: A.K.I. punctures various pressures points on the opponent''s
    body, sending her poison coursing through them. After inducing a complete paralysis, the toxins violently
    burst out from within. If A.K.I. is drawing close to defeat, she will snare the opponent in her chains
    with every strike, binding them completely and causing the poison to deal even more damage as it detonates.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-2b70b044
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts *Weapon Mastery and Thread Manipulation *Acrobatics
    (Hypermobility and Self-Momentum: Makes use of several jumping attacks and acrobatic techniques.Street
    Fighter VI - Gameplay Can perform spinning jumps, mid-air backflips to maintain her balance after
    being striken and do a recovery roll to regain her footing after a knock down.) *Damage Boost (Can
    perform enhanced versions of her Special Attacks) *Air Manipulation (Via Nightshade Pulse) *Explosion
    Manipulation (Via Toxic Blossom, an ability that makes A.K.I.''s poison burst out when an already
    poisoned opponent is hit by another poison-based attack) *Pressure Points (Induced spasms and twitches
    in a man paralyzed by her poison and forced the Player to open their mouth and swallow.Street Fighter
    VI - World Tour - A.K.I.''s cutscenes Also via Claws of Ya Zi) *Durability Negation (Via Claws of
    Ya Zi) *Healing (Instantly nullified the effects of her poison by striking a pressure point. Since
    poison and medicine are essentially two sides of the same coin, she should be able to utilize her
    abilities even in non-harmful ways. ) *Poison Manipulation, Perception Manipulation, Biological Manipulation
    and Paralysis Inducement (Her poisons can induce blurred vision, paralysis of the central nervous
    system and a variety of other effects.) *Social Influencing (Made the Player believe to having being
    poisoned and feel its effects through her speech, while in reality he had just taken a harmless medicine.)
    *Body Control (Inhumanly flexible and able to perform extreme movements during combat) *Stealth Mastery
    (Instructed by F.A.N.G. into a professional assassin. Slipped past JP''s security detailStreet Fighter
    VI - A.K.I.''s Story Mode) *Empowerment (Claws of Ya Zi turns into a different and stronger attack
    whenever A.K.I. is at low health) *Limited Fate Manipulation (Fighters can fight against their destiny.)
    *Resistance to Poison Manipulation (Poison Hand users develop immunity to many types of poison through
    controlled exposure and A.K.I. went through the same exact practice. Can ingest and breath her poison
    without dire consequences.Street Fighter VI - A.K.I.''s Taunts)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
