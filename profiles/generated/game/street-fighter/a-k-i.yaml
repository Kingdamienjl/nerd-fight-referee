- id: claim-standard-equipment-b7e2daa2
  section: equipment
  axis: equipment
  text: '*Talons: Ten long and sharp metallic claws that cover A.K.I.''s fingers. Their thin tip makes
    them ideal to strike pressure points with accuracy and inject poison. They are composed of several
    segments connected to a long chain laced with poison, which then flows through the claw. Such chains
    are incredibly long and are normally wrapped around A.K.I.''s arms. She can extend them at will with
    great dexterity. They can be used for slashing or to snare one or multiple foes. *Bags of poisons
    and medicines'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
