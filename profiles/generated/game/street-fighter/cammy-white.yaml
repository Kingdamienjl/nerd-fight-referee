- id: claim-powers-and-abilities-c7677d62
  section: abilities
  axis: hax
  text: 'Alpha Series/Killer Bee= *Superhuman Physical Characteristics *Martial Arts (Expert in Shadaloo
    Assassination Techniques and Special Force TrainingStreet Fighter 30th Anniversary CollectionStreet
    Fighter IV PRIMA Official Game Guide) *Acrobatics (Hypermobility and Self-Momentum) *Stealth Mastery
    (Is Shadaloo''s top assassin) *Marksmanship (Skilled in knife-throwing.Street Fighter V:Champion Edition
    - Official Website) *Chi Manipulation (Can enhance some of her Special Attacks with ki) *Status Effect
    Inducement (By hitting the opponent repeteadly, without them being able to recover, she can cause
    them to enter the "Stun" status, which leaves them unable to react) *Summoning (Via Psycho Streak)
    *Information Analysis (Programmed to analyze, retrieve, measure and evaluate fighting data of her
    opponents. Can also perform life and power readings.Street Fighter Alpha 3 - Cammy''s Arcade Mode)
    *Poison Manipulation (Carries lethal poison.All About Street Fighter ZERO 3) |-|SF2 Onwards/Delta
    Red= All previous abilities enhanced with the exception of Summoning, Information Analysis, and Poison
    Manipulation, plus: *Greater Stealth Mastery (Is an agent of Delta Red, a special operation division
    of the British Secret Intelligence Service. Infiltrated an S.I.N. laboratory.Street Fighter IV: The
    Ties That Bind Cammy''s tendency for sneaking up on armed opponents and sneakily striking them has
    been performed with "devastating" results against said opponents. Additionally, her efficiency in
    stealth has earned her the title of "The Silent Killer") *Vehicular Mastery (Air Vehicles: Able to
    pilot a jet plane.Super Street Fighter IV Original Video Animation) *Enhanced Senses (Can sense nearby
    cats.Street Fighter V - Versus Mode Winquotes (Generic)Street Fighter V - Versus Mode Winquotes (Vs.
    Sagat)) *Extrasensory Perception (Able to sense chi.) *Statistics Amplification (Via Delta Drive)
    *Damage Boost (Can perform enhanced versions of her Special Attacks) *Limited Fate Manipulation (Fighters
    can fight against their destiny.) Resistance to: *Same as before to a greater extent. |-|Killer Bee/SF
    Alpha series'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
