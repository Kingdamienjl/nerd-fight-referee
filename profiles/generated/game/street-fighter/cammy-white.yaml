  intelligence:
    text: Gifted (A specialized assassin, martial artist, and special agent, Cammy
      has always considered herself a "born soldier".Street Fighter VI - World Tour
      She is skilled in knife throwing and has an extensive knowledge in Shadaloo
      Assassination Techniques and Special Forces Training. Cammy has worked as M.
      Bison's personal killer for a time and was the best among the Shadaloo Elite
      Guard known as "The Dolls". After that, she became a top member of Delta Red,
      a special operation division of the British Secret Intelligence Service. Cammy
      also participated in the 2nd and 3rd World Warrior Tournament and could contend
      with several highly skilled fighters, even outside of formal competitions. As
      Killer Bee, her mindset is totally different. Despite having high fighting abilities,
      her way of thinking and speaking resembles more that of a machine rather than
      a human, due to having been brainwashed by Shadaloo. Towards the end of her
      journey, M. Bison's control over her started to slowly fade away, gradually
      restoring Cammy's mind. She is incredibly adaptable, having mastered her techniques
      in live combat and following the idea of analyzing one's own battles to sharpen
      their skills.Street Fighter VI - World Tour Additionally, she has gone on to
      act as an instructor to her fellow Delta Red operatives, teaching them in standard
      combat training, knife throwing, and horseback riding.Street Fighter VI - World
      Tour Later on, Cammy would briefly mentor the Player, teaching them how to effectively
      use speed and finesse in their attacks rather than needlessly wasting their
      strength, as well as passing along several of her signature techniquesStreet
      Fighter VI - World Tour)
    source_ids: *id002
    confidence: 0.95
