- id: claim-standard-equipment-514b1532
  section: equipment
  axis: equipment
  text: 'Crests: Ingrid''s one-of-a-kind headgears. They bear her personal emblem and possess mystical
    properties that have never been fully revealed. Multiple versions of M. Bison have stolen these crests
    and used them as power catalysts for their Psycho Drive; in one occasion, the crest even proved too
    powerful for the machine alone to contain, thus causing its self-destruction. The actual purpose of
    the crests is unclear and they seemingly regulate Ingrid''s powers, as she could not access some of
    them without having to first recover one of the crests; however, she''s also been seen relinquishing
    them, at least for a time.Capcom Fighting Evolution - Ingrid''s Ending'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
