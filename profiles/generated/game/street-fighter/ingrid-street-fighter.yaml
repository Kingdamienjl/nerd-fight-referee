- id: claim-weaknesses-0a15acad
  section: weaknesses
  axis: weakness
  text: 'Ingrid is unable to manifest her true form in lower-dimensional worlds, as they simply lack the
    complexity to house her being. Ingrid admits to possess weaknesses as, in spite of her enormous power,
    the strength that "Terrans" pursue is different altogether, and may cause her to score losses from
    time to time, even if she never detailed the mechanics behind this phenomenon; most notably, one of
    her alter-egos did experience defeat against the Player and Ingrid herself, addressing this event
    as a matter of will, rather than strength. Losing one of her crests somewhat limited her access to
    her own powers, though the specifics are unknown. Fighting Style: *Sun Bright: An overhead attack
    delivered by bashing the opponent overhead with clasped hands. *Halo Flight: A backhand slap performed
    while leaping forward. *Pretty Heel Kick: A slap followed by a rear kick. *Glowing Touch: A roundhouse
    kick followed by a spinning slap. *Luminous Uppercut: Two upward hand thrusts that knock the opponent
    into the air, as if Ingrid was playing volleyball. *Satellite Leap: A sequence of kicks unleashed
    in mid-air. *Twinkle Kick: A double, upside-down roundhouse kick launched while leaping forward; this
    powerful attack is meant to power through an incoming attack. *Odd Flight: After blocking an attack,
    Ingrid launches herself head-first towards the opponent to knock them back. *Easy Step: A punt kick
    delivered while hopping forward. *Little Lag: A sliding kick that hits the opponent at ground level.
    *Love Roll: An evasive roll meant to dodge incoming attacks and get around the opponent. *Strange
    Knuckle: Ingrid grabs the opponent''s hand and coats them in a strange light which freezes them in
    place, before bonking them in the face with a stiff punch. *Gravity Drop: Ingrid clasps the opponent''s
    hand and uses her powers to lift them into the air, before tossing them behind herself. *Light Punish:
    Ingrid clenches the opponent''s arm and electrocutes them repeatedly. StrangeKnuckle.gif|Strange Knuckle
    GravityDrop.gif|Gravity Drop LightPunish.gif|Light PunishFootage by Fighting Game Move Lists *Sun
    Shot: A projectile made of sparkling light. It stops for a moment after being launched, then it darts
    towards the opponent. Ingrid can shoot them at different angles and speeds to keep the opponent guessing.
    The enhanced version is stronger. *Sun Flare: Ingrid fires a beam of light from her palm. This technique
    can be used to stock "Sun Crests", tokens which can be expended to empower these beams. When consuming
    a sun crest, Sun Flare launched a bigger, faster and stronger light beam. The enhanced version acts
    as if Ingrid had already stocked Sun Crests. **Lights of Heaven: A technique which Ingrid performs
    upon merging with a Monoid and copying the abilities of Dark Ingrid. She first rolls into a ball of
    light, then reappears with four celestial wings on her back and unleashes a devastating beam of light.
    *Solar Burst: A beam of light shot downwards while in mid-air. It possesses the same properties as
    Sun Flare. *Sun Rise: A somersault kick empowered by light. It can be preceded by a vortex of slaps
    delivered while doing a pirouette. The enhanced version adds a few more kicks and reduces Ingrid''s
    blind spots at the end of the move. *Sun Veil: Ingrid pulls out one of her Monoids and uses it as
    a shield. Upon taking a hit, they swallow the opponent whole, teleport in mid-air and drop their victim
    to fall onto the floor. The Monoids can also eat and absorb incoming projectiles. The enhanced version
    is faster. *Vanishing Sun: A teleportation technique which can also be followed by various flying
    kicks upon reappearing. *Sun Upper: Ingrid generates a small shield of light in front of her. If the
    opponent touches it, they are suddenly lifted vertically into the air and then dropped down. *Sun
    Dive: A multi-hitting, flying attack which Ingrid delivers while performing ballet-like spins. *Sunburst:
    Ingrid generates a sphere of dense light and blows it towards the opponent. This projectile then blows
    into flame, torching the victim on impact. *Sunshine: Ingrid launches herself into a lengthy pirouette,
    kicking the opponent repeatedly and ending with a somersault kick. *Sun Delta: Ingrid summons a large
    shield of light in front of her; it captures the opponent and lifts them into the air, dealing continuous
    damage. Ingrid then shoves her arms down, commanding the construct to launch the opponent crashing
    down. Sunburst.gif|Sunburst IngridSunshine.gif|Sunshine SunDelta.gif|Sun Delta *Shining Sun: A versatile
    attack which takes different forms depending on the Sun Crests Ingrid has stockpiled. With the base
    version, Ingrid powers her kicks with light energy and rises upward with a triple somersault kick,
    before finishing the opponent with an Easy Step in mid-air. By consuming a Crest, Ingrid kicks the
    opponent into the air and ascends upward with a light-cloaked pirouette which damages the opponent
    multiple times. Upon using two crests, Ingrid kicks t'
