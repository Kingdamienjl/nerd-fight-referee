- id: claim-powers-and-abilities-c663f038
  section: abilities
  axis: hax
  text: '*Genius Intelligence *Higher-Dimensional Existence, Avatar Creation, Fissionism and Hive Mind
    (Type 2) (Her true form resides in a higher dimension and she interacts with the lower worlds by projecting
    herself into them, similarly to how a person projects a shadow. Her true being cannot manifest entirely
    within lower dimensions, and so parts of her are distorted into separate extensions of Ingrid''s power
    called "Monoids". They possess their own personalities and, although they may occasionally slip and
    speak in first person as if they were Ingrid herself, or deny their individuality, Ingrid does not
    possess inherent awareness of their thoughts and whereabouts. There also exists an evil counterpart
    to Ingrid''s pure persona, Dark Ingrid, whom embodies their negative traits and possesses the same
    powers and strength. Overall, there are many projections of Ingrid operating at the same time across
    the multiverse and they can even come into conflict with each other. Ingrid''s humanoid form is 99.9%
    similar to actual humans and as such, it experiences the same physiological needs and weaknessesStreet
    Fighter VI - Ingrid''s Victory Quotes (Vs. A.K.I.)) *Longevity, possibly Immortality (Type 1. Has
    told Ryu that she has not aged a day since their last encounter and that she has always maintained
    the same appearance.Street Fighter VI - Ingrid''s Arcade Mode She remembers the ancient times of the
    dance plaguesStreet Fighter VI - Ingrid''s Victory Quotes (Vs. Dee Jay) and the practice of fighting
    pankration in the nude.Street Fighter VI - Ingrid''s Victory Quotes (Vs. Marisa) Speaks lightly about
    the 4000 years of chinese history.Project X Zone 2 - Ingrid''s Pre-Battle Dialogues Claims to have
    intervened in the course of history even for hundreds of years straight. Ingrid herself doesn''t exactly
    know how old she is, as it depends on each of her projections and other factors; nonetheless, she
    also claims to have been around for thousands of years) *Small Size (Type 1 for the Monoids) *Superhuman
    Physical Characteristics (Despite her innocent appearance, Ingrid can effortlessly overpower even
    the most intimidating fighters) *Martial Arts (Ingrid practices an unknown fighting style to which
    she refers to as being "the martial secrets of the universe". The Monoids are also capable fighters
    in their own right) *Acrobatics (Hypermobility and Self-Momentum. Capable of performing jumping attacks
    and aerial somersaults.Street Fighter VI - Gameplay Makes use of many acrobatic special techniques
    and is able to nullify throwsStreet Fighter Alpha 3 MAX - Gameplay and regain her balance after being
    struck in mid-air. Could leap down from an aircraft and her form was complimented even by a ninja
    such as Kage-MaruProject X Zone 2 - Chapter 10) *Flight (Capable of achieving true flight. The Monoids
    naturally move by hovering through the air) *Energy and Chi Manipulation (Ingrid draws her power from
    the cosmoStreet Fighter VI - Manon''s Victory Quotes (Vs. Ingrid) which, from her perspective, refers
    to the endless multiverse. This power appears similar to the fighters'' ability to channel ki which,
    unbeknownst to them, flows from a different dimension. Ingrid herself is the font from which Psycho
    Power flowsStreet Fighter VI - JP''s Victory Quotes (Vs. Ingrid) and her light powers possess a similar
    signature) *Extrasensory Perception (Was aware that someone besides the Player had been accidentally
    whisked into a parallel world. As the arguably maximum expert on ki, she should share the ability
    to sense it that many Terran fighters possess. Could sense an accumulation of irregular energy in
    a nearby world. Could sense the various energies swirling inside the Millennium Tower, as a result
    of M. Bison''s Psycho Drive tearing apart the dimensional barriers that separates the various worlds
    of the multiverseProject X Zone 2 - Chapter 38) *Reality Warping (The matrix of her powers is an esoteric
    symbol identified as a "code", a string woven into a world-shaping power called a "program"; codes
    are bestowed upon selected individuals and their executions and interactions can alter entire worlds.
    She can bring forth the entirety of a stage, complete with all its natural elements and peopleStreet
    Fighter VI - Ingrid''s Match Start Animation) *Dimensional Travel (As an extradimensional being, Ingrid
    possesses the ability to travel across the universes and timelines that comprise the infinite multiverse.Ingrid
    references her first encounter with Ryu, which took place in the parallel canon of "Street Fighter
    Alpha 3 MAX"Ingrid mentions her appearances in "Capcom Fighting Evolution" and "Project X Zone 2",
    thus making both games canon to her. Moreover, she displays awareness on the original Fatal Fury world
    and was implied to be behind Tifa Lockhart''s arrival in the Street Fighter universe The Monoids constantly
    showcase the same ability to freely cross dimensions and use to ferry the Player from their universe
    to Ingrid''s NULSPACE) *Clairvoyance, Precognition a'
