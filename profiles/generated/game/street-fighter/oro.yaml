- id: claim-weaknesses-526d9342
  section: weaknesses
  axis: weakness
  text: 'Tends to remain suppressed, sealing his dominant arm, to give opponents a fighting chance Notable
    Attacks/Techniques: |-|Unique Attacks= Kaeshi.gif|Kaeshi Genkotsu TobiHiza.gif|Tobi Hiza Tsurane Uchiage.gif|Tsurane
    Uchiage OiOnibi.gif|Oi Onibi OiMinomushi.gif|Oi Minomushi OroJump.gif|Double Jump *Kaeshi Genkotsu
    ("Returning Knuckle"): Oro turns around and hits the opponent with the back of his fist. He then checks
    his turtle. *Tobi Hiza ("Flying Knee"): Oro jumps over the opponent and hits them with a knee strike.
    *Hane Jodan Mawashi ("Bouncing High Level Turn"): Oro strikes the opponent''s face with a spinning,
    roundhouse kick. In order to perform the move, he tosses his turtle into the air, but it safely lands
    back on Oro''s hand. *Tsurane Uchiage ("Lined Up Launching Uppercut"): Oro knees the opponent and
    follows up with an uppercut, sending them flying. *Oi Onibi: Oro strings together Tsurane Uchiage
    and Onibi. *Oi Minomushi: Oro strings together Tsurane Uchiage and Minomushi. *Double Jump: Thanks
    to his enhanced agility, Oro can perform a second jump in mid-air. |-|Throws= YashiKudaki.gif|Yashi
    Kudaki OroTomoeNage.gif|Tomoe Nage KJG.gif|Kuuchuu Jigoku Guruma Kubijime.gif|Kubi-jime Kataguruma
    *Yashi Kudaki: Oro switches side with the opponent and jumps on them, clutching their neck between
    his legs. Then he elbows their head, before planting his feet on their shoulder and pushing them onto
    the ground, while he lands safely with a backflip. *Tomoe Nage: Oro grabs his opponent and falls backwards.
    He then plants his feet low on the opponent at waist level and applies strong pressure. This causes
    the opponent to flip and land on their back. *Kuuchuu Jigoku Guruma ("Midair Hell Carriage"): Oro
    grabs an airborne opponent and drags them on the ground, planting his knee on their midsection. *Kubi-jime
    Kataguruma: Oro climbs on the opponent and strokes them a few times with his legs and his free arm.
    |-|Special Attacks= NichirinSho.gif|Nichirin Sho (Horizontal) Nichirin2.gif|Nichirin Sho (Vertical)
    NichirinEX.gif|EX Nichirin Sho NiohRiki.gif|Nioh Riki NiohRikiEX.gif|EX Nioh Riki JinchuWatariV.gif|Jinchu
    Watari JinchuWatariEX.gif|EX Jinchu Watari JinchuNobori.gif|Jinchu Nobori JinchuNoboriEX.gif|EX Jinchu
    Nobori OniYanmaV.gif|Oni Yanma OniYanmaEX.gif|EX Oni Yanma Tsuranekeashi.gif|Tsuranekeashi TsuranekeashiEX.gif|EX
    Tsuranekeashi *Nichirin Sho ("Sun Ring Palm"): Oro thrusts his hand forward and emits a small orb
    of burning ki from his fingertips, setting the opponent on fire on contact. The EX version of this
    attacks gives the projectile homing capabilities and an enhanced force, although it comes with less
    speed. *Nioh Riki ("Benevolent King''s Strength"): Oro grabs his opponent with one hand and slams
    them on ground three times. The EX version is stronger. *Jinchuu Watari ("Human Pillar Ferry"): Oro
    jumps forward into the air. If he lands on his opponent, he will stomp their head twice and bounce
    off them. The EX version is faster and allows Oro to deliver four kicks. **Hitobashira Nobori: If
    Oro performs Jinchuu Watari in mid-air, he will kick at the opponent''s head multiple times. The EX
    version allows Oro to kick the opponent nine times. *Jinchu Nobori: An alternate version of Jinchuu
    Watari. After the attack, Oro lands in front of the opponent instead of bouncing off them. The EX
    version retains the same properties. *Oni Yanma ("Ogre Dragonfly"): Oro leaps into the air, spinning
    while performing an elbow attack. The EX version allows Oro to jump higher and deliver more hits.
    *Tsuranekeashi ("Lined Up Leg Kicks"): Oro swings his leg, performing a vertical kick. He then brings
    it down and smashes the opponent again with the heel. The EX version adds a final somersault kick.
    |-|Super Attacks= *Yagyou Dama ("Night Traveling Soul"): A stronger version of the V-Technique Onibi.
    *Yagyou Odama (Night Traveling Great Soul): A super powered version of Yagyou Dama. Oro leaps up into
    the air and summons a massive orb of ki, throwing it at the opponent. *Kishin Tsui ("Demon/Oni God
    Hammer"): Oro ferociously lunges a short distance at the opponent and uses both hands to throw up
    the opponent into the sky, and makes a gigantic leap with them. Moments later, he then crashes into
    the opponent at high speed with his head, even setting said opponent on fire, forcing them into the
    ground for significant damage. Yagyou.gif|Yagyou Dama YagyouOdama.gif|Yagyou Odama Kishin3.gif|Kishin
    Tsui *Daishinsenriki ("Great Divine Immortal Power"): A combination of the previously listed techniques.
    After downing the opponent down with Kishin Tsui, Oro bounces off them and throws a Yagyou Odama at
    them. center|335px |-|V-Techniques= AshiBarai.gif|Ashi Barai Okabuto.gif|Okabuto Wari Onibi1.gif|Onibi
    (Medium) Onibi2.gif|Onibi (High) Onibi3.gif|Onibi (Low) Minomushi.gif|Minomushi KakiOtoshi.gif|Kaki
    Otoshi EdaUchi.gif|Eda Uchi Manrikitan.gif|Manrikitan Kishinriki.gif|Kishinriki KuchuJigoku.gif|Kuchu
    Jigoku TenguStone.gif|Tengu Stone TenguCombo.gi'
