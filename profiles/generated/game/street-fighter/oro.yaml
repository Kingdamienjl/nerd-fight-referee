- id: claim-powers-and-abilities-9b36ab1d
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Longevity *Genius Intelligence *Martial Arts *Acrobatics
    *Chi Manipulation and Projection (Mastered the Senjutsu chi arts and developed his own version of
    the Satsui no Hado) *Temperature Manipulation (Via Nichirin Sho) *Extrasensory Perception (Can sense
    different types of chi and tell their nature and power level.Street Fighter V - Rose''s Story ModeStreet
    Fighter III: 3rd Strike - Oro''s Arcade Mode) *Surface Scaling (Able to adhere to a flying plane without
    falling.Street Fighter III New Generation - Oro''s Ending) *Social Influencing (Animal Charming: Takes
    care of several pets alone in his cave, including a wild dolphin he supposedly tamed.Street Fighter
    V - Arcade Mode SFV Path - Oro''s Ending) *Possibly Stealth Mastery (May possess knowledge on stealth,
    as Senjutsu gave birth to Ninjutsu.Street Fighter V - Oro''s Versus Mode Win Quotes (Vs. Ibuki)) *Telekinesis
    (Mastered the art of telekinesis and is able to perform Tengu Stone and Tengu Midare Stone.Street
    Fighter 30th Anniversary Collection) *Elemental Manipulation (Some special objects randomly summoned
    with Tengu Stone deal fire, ice and electric damage) *Homing Attack (Via EX Nichirin Shou) *Pseudo-Healing
    (Some special objects randomly summoned with Tengu Stone can restore a little of Oro''s power gauge)
    *Flight (Can fly freely, usually while enveloped in a cloth.Street Fighter V - Dhalsim''s Story Mode)
    *Damage Boost (Via Kishin Riki. Can also perform enhanced versions of his Special Attacks) *Status
    Effect Inducement (By hitting the opponent repeteadly, without them being able to recover, he can
    cause them to enter the "Stun" status, which leaves them unable to react) *Limited Fate Manipulation
    (Fighters can fight against their destiny.) *Possibly Resistance to Corruption (Created and flawlessy
    controls his own version of the Satsui no Hado, preventing it from taking him over, although it may
    be due to it being his own creation.Shadaloo C.R.I The Side Readers: Musings on a Still Night (Part
    2))'
