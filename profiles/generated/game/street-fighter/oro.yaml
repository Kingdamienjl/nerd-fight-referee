  intelligence:
    text: 'Genius (A legendary master of Senjutsu, the Sennin fighting style, who gained great wisdom
      and knowledge during his long life. Such style gave birth to Ninjutsu, and Oro is so famous to be
      featured in ninja academy textbooks.Street Fighter V - Ibuki''s Versus Mode Win Quotes (Vs. Oro)
      Possesses almost unparalleled combat skill, perhaps matched only by Akuma, which has led him to
      a challenge-free life, reason why he seals his dominant arm, trying to give a chance to his opponents.
      Often challenges himself by holding and juggling his pet turtle in casual battles, managing to perform
      all of his techniques and movements without making it fall or take damage. He states that even Ryu
      would take 15 more years of training before forcing him to use both arms.Street Fighter III: 3rd
      Strike - Oro''s Ending Mastered the art of telekinesis and ki control, even creating and subduing
      his own imitation of the Satsui no Hado. To him, ki techniques considered the pinnacle of martial
      prowess and performed by highly disciplined fighters are nothing more than plaything for youngsters.Shadaloo
      C.R.I The Side Readers: Musings on a Still Night (Part 1) Even in a match meant for fun, he is considered
      unpredictable by Dhalsim.Street Fighter V - Oro''s Story Mode His understanding of the very root
      of all types of ki, has brought him to realize how they come from the same source of power and are
      fundamentally neither good nor evil. Possesses knowledge on mathematics, physics and astronomy,
      knowing the laws that govern space and the Earth''s rotation; as a continuation of his explanation
      about ki, he theorized that the boundaries between the normal and other worlds can''t exist in just
      two dimensions, which brought him to compare them to a Calabi-Yau manifold. On top of that, he is
      expert in mysticism and philosophy, and he occasionally has debates on the latter with Dhalsim,
      who has troubles following his thoughts at time. Despite their own wisdom, Dhalsim and Rose see
      him as a master and one to consult in time of crisis, as he knows much more than meets the eye.Street
      Fighter V - Menat''s Story Mode Is the only known person to having discovered M. Bison''s Psycho
      Power''s corruptive effect, on top of understanding its functioning)'
    source_ids: *id002
    confidence: 0.95
