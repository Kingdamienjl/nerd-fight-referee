    (Has great charisma, which allowed him to gather a large number of followers in an alternate ending)
    *Water Manipulation (Could split the sea) *Body Control and Levitation (Can grow six wings on his
    back while performing Seraphic Wing) *Teleportation (Disappeared in front of Yun) *Minor Existence
