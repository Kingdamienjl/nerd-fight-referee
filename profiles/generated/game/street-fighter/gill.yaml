  axis: hax
  text: '*Superhuman Physical Characteristics *Genius Intelligence *Longevity *Martial Arts *Acrobatics
    (Hypermobility and Self-Momentum) *Fire Manipulation *Ice Manipulation *Energy Projection and Light
