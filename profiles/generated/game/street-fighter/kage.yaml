- id: claim-weaknesses-b15b962e
  section: weaknesses
  axis: weakness
  text: 'Can have his emotions manipulated quite easily. Kage''s ultimate purpose is to lure his victims
    into fully embracing the Satsui no Hado he embodies and thus a physical fight, assuming it actually
    happens, isn''t enough to achieve victory, neither for Kage nor for his opponent; resisting Kage''s
    attempts to corrupt you and totally rejecting him will force him to leave or even vanish. Note: Do
    not attempt to add incorporeality to Kage, as it has been confirmed in the Street Fighter World Warrior
    Encyclopedia - World Tour Edition (2024) that he is a physical being, and this has been accepted here.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-de549202
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts (Master of Shotokan Karate and Ansatsuken)
    *Acrobatics *Chi Manipulation and Projection (Embodies the Satsui no Hado and can harness it in several
    ways) *Aura *Teleportation and Clairvoyance (Can track down those who have experienced the Satsui
    no Hado and appear in front of them) *Possibly Telepathy (Appears to be able to talk into people''s
    mind) *Supernatural Willpower (Spontaneously got a consciousness when Ryu overcame the Satsui no Hado)
    *Limited Corruption (Type 3: Can tempt the Satsui no Hado users to fully embrace it) *Possibly Perception
    Manipulation (When tempted by the Satsui no Hado, Sagat''s perception of Namupun was distorted, seeing
    and hearing a demon instead of her. It is unknown if this happened or not in the same occasion Kage
    visited Sagat) *Fire Manipulation (Via Shakunetsu Hadouken) *Possibly Air Manipulation and Restricted
    Flight (Via Kurekijin) *Teleportation (Via Misogi) *Statistics Amplification (Via Taigyaku Mudo and
    Ashura Senku) *Illusion Creation (Via Ashura Senku) *Death and Pain Manipulation (Via Shun Goku Satsu/Raging
    Demon. This technique brings death to its victim through the weight of their own sins, and not by
    Kage''s fist. The eviler the victim is, the more they suffer in death) *Damage Boost (Can perform
    enhanced versions of his Special Attacks) *Status Effect Inducement (By hitting the opponent repeteadly,
    without them being able to recover, he can cause them to enter the "Stun" status, which leaves them
    unable to react) *Limited Fate Manipulation (Fighters can fight against their destiny.) Resistance
    to: *Soul Manipulation (Stated by Akuma to be "soulless")'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
