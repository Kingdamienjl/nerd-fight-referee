      \ precious advice to those who seek help, such as Ryu, Alex, the Player and all the peregrines visiting\
      \ his temple. Is an expert in mysticism and philosophy, and often engages in discussions on the\
      \ matter with Oro. He is also a great martial artist, having developed many abilities through meditation\
      \ and self-improvement. Even when holding back, he can battle on par with the likes of Karin, Ryu,\
      \ Necalli, Alex, Rufus, Rashid, Rainbow Mika |-|Unique Attacks= YogaUpper.gif|Yoga Upper Divine\
