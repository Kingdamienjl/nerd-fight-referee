- id: claim-weaknesses-2f81e776
  section: weaknesses
  axis: weakness
  text: 'None notable. Fighting Style: *Senkotsu Uchi: A close-range, overhead attack performed by thrusting
    a fan downwards. *Hien Ren Kyaku: A double knee and a jumping kick, followed by a backflip that lets
    Mai execute a special technique right after. *Hoshi Kujaku: An upward kick delivered with both legs
    and while doing a handstand; it is immediately followed by two roundhouse kicks that knock the opponent
    down. *Botan Ichige: A powerful fan thrust delivered while spinning forward. Its superior force compared
    to other attacks allows Mai to push through lighter attacks. *Yusura Ume: Mai blocks an incoming attack
    and replies with a powerful rear attack that knocks the opponent away. *Shiranui Gourin: Mai grabs
    the opponents head, vaults over them and tosses them away. *Fuusha Kuzushi: Mai throws the opponent
    off with her hand, then grabs their head with both her feet and slams them backwards. *Yume Zakura:
    Mai intercepts an airborne opponent, positions herself above them and drives them down onto the floor,
    plunging her knees into their body. ShiranuiGourin.gif FuushaKuzushi.gif YumeZakuraSF6.gif *Kachousen:
    Mai hurls a spinning fan at the opponent. She can throw them at different speeds and trajectories,
    as well as charging up the attack to make the fan bounce on the opponent and fall back to hit them
    a second time. With the enhanced version, Mai throws a bouncing fan at higher speed, allowing her
    to act right after the throw. **Midare Kachousen: By charging up the overdrive Kachousen, Mai can
    throw up to four fans in a row. *Ryuuenbu: Mai twirls around and strikes the opponent with the flaming
    tail of her dress. She can also initiate the attack with a swift jab strike, then execute the move
    itself. The enhanced version adds a flaming uppercut at the end which launches the opponent upward.
    *Hissatsu Shinobi Bachi: Mai cartwheels forward and launches herself elbow-first at the opponent.
    With the enhanced version Mai leaps upward and launches the opponent in the air, leaving them vulnerable
    to subsequent attacks. *Hishou Ryuuenjin: Mai performs a flaming, somersault knee strike to counter
    the airborne approach of the opponent. The enhanced version allows Mai to push through incoming attacks.
    *Musabi no Mai: While airborne, Mai dives diagonally against the opponent and tackles them at high
    speed. The enhanced version hits harder, knocking the opponent in the air and leaving them exposed
    to further attacks. *Kagerou no Mai: Mai releases a powerful surge of vertical flames around herself.
    Once performed, she gains five Flame Stocks that increase the power of her Special Techniques and
    Super Attacks. When enhanced by a Flame Stock, Kagerou no Mai creates two fiery clones of Mai that
    spin around her and eventually turn into a small hurricane of flames. *Chou Hissatsu Shinobi Bachi:
    A super-powered version of the homonymous special technique, boosted by powerful flames. It can also
    be performed in mid-air. *Shiranui Ryuu: Enbu Ada Zakura: Mai unleashes a fiery whirlwind that drags
    the opponent up in the air; she then slashes them three times with her burning fans, before carrying
    them down for a final, grounded slash that causes fire to burst out of their chest. If Mai is about
    to approach defeat, the power of this technique increases, while also adding a final elbow strike
    that knocks down the opponent. SF6 - Mai Sheranui All Supers (She Has 6 Supers) it''s Amazing. -sf6'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-6e9fcea6
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Ninjutsu *Fan Mastery *Acrobatics (Mai utilizes numerous
    jumping attacks and acrobatic special techniques. She is also able to perform somersault jumps, use
    backflips to maintain her balance when struck in mid-air and recover her footing with a handspring
    or a cartwheel when knocked downStreet Fighter VI - Gameplay) *Stealth Mastery *Camouflage & Possibly
    Teleportation (As a master ninja, Mai should be an expert in stealth tactics. Has disguised herself
    as a common fighter and held up the act until the end of the second Knock Out Festival. She also vanished
    in front of Terry and the Player in a mere momentStreet Fighter VI - World Tour) *Fire Manipulation
    & Limited Air Manipulation (Mai''s ninja arts let her produce flames from her fans and body; they
    are used for a number of special techniques and she can extinguish them by raising gusts of wind.
    Mai can also utilize such an ability to generate small fireworksStreet Fighter VI - Mai Shiranui''s
    taunts) *Damage Boost (Can perform enhanced and different versions of her Special Attacks. Also via
    Kagerou no Mai) *Empowerment (Shiranui Ryuu: Enbu Ada Zakura turns into a different and stronger attack
    whenever Mai is at low health) *Limited Duplication (Via Kagerou no Mai) *Cloth Manipulation (Mai
    can somehow change her whole outfit in the blink of an eyeStreet Fighter VI - Mai Shiranui''s select
    animation) *Limited Fate Manipulation (Fighters can fight against their destiny.) *Resistance to Fire
    Manipulation (Has made her clothes fire-resistant to endure her flame-based techniques; she herself
    is also not hurt by them)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
