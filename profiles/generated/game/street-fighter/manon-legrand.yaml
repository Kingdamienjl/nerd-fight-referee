- id: claim-weaknesses-653d0237
  section: weaknesses
  axis: weakness
  text: "None notable. Fighting Style: *R\xE9v\xE9rence: A double palm strike to the chin delivered with\
    \ both hands, meant to stagger the opponent and follow up with another attack. *Tomoe Derri\xE8re:\
    \ Manon slides forward and kicks upward to launch the opponent into the air. *\xC0 Terre: A palm thrust\
    \ followed by a low kick that pulls the opponent closer. *En Haut: A crescent kick followed by an\
    \ axe kick delivered with the same leg. *Temps Li\xE9: A double hand strike to the midsection. The\
    \ second one pulls the opponent closer. *Allong\xE9: A rising slap to the chin followed by an overhead\
    \ palm strike. *Glissade: Manon spins and leaps forward with a powerful split kick. *\xC9cart\xE9\
    : After blocking an opponent's attack, Manon raises one of her legs and spins in place, delivering\
    \ a hefty palm strike to the midsection. *Ouchi Gari: One of the original 40 throws of judo. Manon's\
    \ grapples with the opponent, slips her legs between theirs and tosses them to the ground. *Uchi Mata:\
    \ Yet another staple of judo. Manon locks the opponent's wrist, slips her leg between theirs and throws\
    \ them over her back, slamming them down. OuchiGari.gif UchiMata.gif *Man\xE8ge Dor\xE9: A throw that\
    \ grants Manon a power-up to her throw-based Special Attacks (figuratively referred to as \"Medals\"\
    ) every time it lands, up to 5 times. Manon can spend more of her energy to increase the speed of\
    \ this technique, regardless of its level. **Level I-II: Manon clenches the opponent's forearms, sweeps\
    \ their feet while doing a pirouette and flips them into the air. **Level III-IV: Manon repeats the\
    \ same movements as before, but instead of letting the airborne opponent fall down on their own, she\
    \ grabs them by the collar and slams them to the floor. **Level V: Manon once again trips the opponent\
    \ with a pirouette, but this time she launches them high into the air. She then leaps upward, catches\
    \ them by the collar and drives them down face-first, crushing them underneath her shoulders. *Rond-point:\
    \ Manon does a turn, extending one of her legs vertically to kick the opponent, either sending them\
    \ flying upward or thwarting a jumping attack. The enhanced version launches the victim even higher,\
    \ leaving them open to follow-up attacks. *D\xE9gag\xE9: A powerful kick that can be performed in\
    \ three different ways. The first two are a double split kick delivered by either sliding (thus tripping\
    \ the opponent) or leaping forward. The third variation is an overhead, spinning kick. The enhance\
    \ version is a powered-up version of the third type of kick. *Renvers\xE9: Another throw that grants\
    \ Manon \"medals\" every type it lands. It can also be turned into a feint. The enhanced version is\
    \ faster, regardless of the level. **Level I-II: Manon spins towards the opponent (avoiding possible\
    \ incoming projectiles) and strikes mid her open hand. She immediately grasps their wrist and turns\
    \ around, position herself behind them while sweeping one of their feet with her leg. Manon finishes\
    \ by tossing the disoriented opponent to the ground. **Level III-IV: Manon initiates the move a described\
    \ above, but instead of letting the opponent go, she grabs them by the wrist and and forces them to\
    \ spin around her in a dance-like motion. She then releases them, just to immediately grab them once\
    \ again and slam them down by sweeping their feet and pushing them onto the floor. **Level V: Upon\
    \ grabbing the opponent, Manon raises her leg to catapult the opponent upward and leave them spinning\
    \ helplessly. As they fall, she grabs their wrist and pulls, slamming them down. *Grand Fouett\xE9\
    : An alternative option to Renvers\xE9. Instead of going for a throw, Manon uses the momentum of her\
    \ spin to deliver a roundhouse kick. *Arabesque: Manon enter an arabesque pose and slides towards\
    \ the opponent at great speed, launching them away upon impact. *\xC9toile: Manon performs a double\
    \ Rond-point and follows up with a leaping kick. *Pas de Deux: Manon grips the opponent's wrist, sweeps\
    \ one of their toom to thrown them off balance and sends launches them behind her, cauing them to\
    \ spin on a single leg like a top. Manon catches them again and forces them into four ballet poses,\
    \ before finishing them with a powerful Uchi Mata. If Manon is drawing close to defeat, she will bring\
    \ the opponent into even more poses, before launching them high into the air while holding them by\
    \ the wrist to violently slam them onto the ground after several aerial rotations."
  source_ids: *id003
  decisive: false
  status: unverified
