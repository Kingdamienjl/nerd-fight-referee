      taken during childhood, Manon has efficiently adapted its movements to combat and evolved her judo
      into a new and unique style. She also made it a recurring practice to challenge other fighting styles
      such as savate and fencing, both in regular bouts and street fighting, always coming out on top
      and improving her skills evermore. A competent teacher, she successfully imparted her fighting style
      and philosophy into the Player. Manon has demonstrated to be good at mathematics, holding the knowledge
      of physics in great value and calculating precisely how much muscle mass she puts in every part
      of her body during workout. Manon is also a famous model and performer with long-time experience
      within the industry, having began her career almost as early as she did with judo and establishing
