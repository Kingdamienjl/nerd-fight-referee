- id: claim-powers-and-abilities-640c99e8
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Martial Arts (Judo Champion) *Acrobatics (Her fighting\
    \ style alone is a demonstration of her exceptional agility. Makes use of several jumping attacks\
    \ and acrobatic techniques.Street Fighter VI - Gameplay Can perform mid-air backflips to maintain\
    \ her balance after being stricken and roll back into position after a knock down.) *Cloth Manipulation\
    \ (Able to supernaturally change her outfit in the blink of an eye.Street Fighter VI - World Tour\
    \ (Meeting Manon)) *Chi Manipulation (While performing most of her moves, Manon emanates an ethereal\
    \ aura and feathers) *Afterimage Creation (Via Arabesque and \xC9toile) *Damage Boost (Can perform\
    \ enhanced versions of her Special Attacks. Some of her techniques allow her to progressively increase\
    \ the strength of her Special Attacks the more she lands them) *Empowerment (Pas de Deux turns into\
    \ a different and stronger attack whenever Manon is at low health) *Limited Fate Manipulation (Fighters\
    \ can fight against their destiny.)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
