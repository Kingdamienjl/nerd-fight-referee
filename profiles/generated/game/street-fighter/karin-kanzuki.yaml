      the speed of the attacks and make themsecond-guess their own choices. Such style is borne as a a
      mix of styles from both inside and outside Japan such as Judo, Sambo, and Bajiquan. She is also
      specialized in the esoteric arts and secret moves of the Kanzuki household, mastering secret techniques
      such as the "Kanzuki-ryu kata of unyielding resistance" and the "Ruler's Staying Hand". Her skill
      and strength allowed her to overwhelm skilled fighters such as R. Mika, Rashid, Ibuki and the Shadaloo
      elite assassins Marz and Enero. She can also fight evenly with martial arts masters such as Ken,
      F.A.N.G, Zangief, Dhalsim, Zeku and Sakura, and she even went fist to fist with M. Bison. She overthrew
      her father Kanzuki Daigenjuro from the lead of the Kanzuki Zaibatsu, stealing his stock and still
      preventing him from taking his role back. She now runs a global super corporation, which is even
      wealthier than the Masters family. She is a firm and capable leader, who can take quick but efficient
      decisions, as she has demonstrated when she devised a way to investigate the intrusion of Shadaloo
      in her satellite and a plan to stand against the entire criminal organization and ultimately vanquish
      it by guiding the world's best fighters)
