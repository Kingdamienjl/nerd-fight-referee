- id: claim-weaknesses-69d7667a
  section: weaknesses
  axis: weakness
  text: 'None notable Fighting Style: *Ridge Thrust: Lily hops forward and hammers the opponent overhead
    with both clubs. *Horn Breaker: Lily thrusts one her club at the opponent''s head. *Great Spin: Lily
    jumps above the opponent and descends onto them with a spinning body press. *Double Arrow: While in
    mid-air, Lily smacks the opponent twice with her clubs. *Desert Storm: Lily clenches her clubs together
    and delivers a triple attack while pivoting forward. *Earth''s Rage: Lily turns on herself and smashes
    the opponent''s face using both clubs. *Cross Hammer: Lily blocks an opponent''s attack and counters
    with an overhead attack done with both clubs and while somersaulting in place. *Canyon Throw: Lily
    hooks the opponent ankle with her clubs and flips them upward. *Falling Cliff: Lily sticks her clubs
    in a cross-like fashion to capture the opponent''s neck and pull it over to stagger them. She then
    loads them onto the shoulders and tosses them backwards. CanyonThrow.gif FallingCliff.gif *Condor
    Wind: Lily twirls her clubs to summon the power of the wind and gain one Windclad stock, which powers
    up certain special moves. By spending more of her energy, Lily delivers a rotating attack while still
    obtaining a Windclad stock. *Condor Spire: Lily flies forward carried by the wind and tackles the
    opponent. Lily can increase the power of this attack by using more energy than normal. The technique
    is strengthened even further depending on the amount of Windclad che has in store. *Tomahawk Buster:
    A Condor Spire performed diagonally in the air. It retains all the properties of the previous move.
    *Condor Dive: A Condor Spire performed in mid-air and meant to dive diagonally onto the opponent.
    Once again, it can be powered up in the same way as before. *Mexican Typhoon: Lily hooks the opponent''s
    head with her clubs, then leaps forward and spins around them while still holding on. This movement
    allows her to ascend high up into the sky together with the enemy, circling around several times to
    build momentum and smash them into the ground upon coming down. The enhanced version adds more strength
    to the move. *Breezing Hawk: Lily summons the power of the wind and starts spinning furiously around
    the opponent, striking them countless times and finishing with a double uppercut than launches them
    away. *Thunderbird: Similarly to Breezing Hawk, Lily uses her wind manipulation to spin on herself
    at great speed and unleash a series of attacks while she ascends upward. This technique can also be
    performed in mid-air and be powered up by Windclad stocks. *Raging Typhoon: Lily''s leaps forward
    to catch the opponent''s neck with her clubs and perform tow Mexican Typhoons in a row. If Lily is
    drawing close to defeat, she will spin even more rapidly during the second Mexican Typhoon, just to
    lose hold of the opponent and clumsily drop onto them with her butt, somehow dealing more damage than
    normal.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-89f34d13
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts *Weapon Mastery (Pogamoggan Mastery) *Acrobatics
    (Makes use of several jumping attacks and acrobatic techniques.Street Fighter VI - Gameplay Can perform
    mid-air backflips to maintain her balance after being stricken and do a somersault to regain her footing
    after a knock down) *Telepathy, Air Manipulation Extrasensory Perception and Blessed (Can speak with
    the spirits of nature, imbue herself with their power and sense them in the environment or within
    other people. Toyno''Ikonoi, the spirit of wind, has chosen her at birth, and granted her the power
    to manipulate air currents. It talks to her and provides advice and information about her opponents.Street
    Fighter VI - Lily''s Win Quotes (vs. JP)Street Fighter VI - Lily''s Win Quotes (vs. Chun-Li) Lily
    frequently consults Toyno''Ikonoi and other spirits, receiving their guidance and counseling. Moreover,
    she can recognize "power spots", places brimming with energy and spirits) *Limited Chi Manipulation
    (Dhalsim sensed a great and ominous power reminiscent of the Satsui no Hado within Lily, but he himself
    isn''t sure of its real nature, and she cannot access it yetStreet Fighter VI - Lily''s Story ModeStreet
    Fighter VI - Dhalsim''s Story Mode) *Social Influencing (Animal Charming: Wild animals are not wary
    of her and let her approach and interact with them willingly. Owns a pet hawk that is very fond of
    herStreet Fighter VI - Lily''s Victory Screen) *Surface Scaling (Has conquered a colossal baobab and
    a tall cliff without using any climbing equipment.Street Fighter VI - World Tour - Lily''s Dialogues
    Reached Blanka in the middle of the Amazon forest while crawling down a tree) *Limited Light Manipulation
    (With her camera) *Damage Boost (Can perform enhanced versions of her Special Attacks and accumulate
    "Windclad Stocks" that increase the power of several of her techniques) *Empowerment (Raging Typhoon
    turns into a different and stronger attack whenever Lily is at low health) *Limited Fate Manipulation
    (Fighters can fight against their destiny)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
