  attack_potency:
    text: Small Building level (Equal to wrestlers who can slam each other through
      different types of floor, leaving large craters behind. Fought and defeated
      the likes of Poison and Rolento. OftenStreet Fighter V - Arcade Mode - SFV Path
      - Zangief's Ending depicted as comparableStreet Fighter V - Arcade Mode - SFV
      Path - R. Mika's Ending to Zangief. Can easily destroy metal and wooden barrels,
      tires, crates, bins, fences, cars, phone boots, billboards, glass panels, wire
      meshes, and many different kinds of doors and gates)
    source_ids:
