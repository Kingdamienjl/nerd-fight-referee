- id: claim-weaknesses-3af8d8e0
  section: weaknesses
  axis: weakness
  text: 'None notable. Notable Attacks and Techniques: Haggar''s fighting style is
    centered around powerful blows and crushing slams taken from professional wrestling
    and pure brawling, often enhanced by utilizing stage elements such as ropes, fences
    and turnbuckles. Haggar is also incredibly agile for his size, knowing a variety
    of dashing, running and flying attacks that carry all the weight of his mighty
    muscles. His signature and most devastating technique is the Spinning Piledriver,
    with which he brings the opponent high into the sky, whirls furiously to build
    momentum and then drives them down through the floor. Haggar isn''t wary of fighting
    dirty either, and will eagerly stomp on downed opponents, toss them against wall,
    objects and explosives, target weak spots such as the head and utilize weapons
    (his favourite being the pipe and the 2x4), especially if his enemies are the
    punks he deeply hates. Standing, Running and Jumping Strikes= HaggarDL.gif HaggarRunningKnee.gif
    HaggarJumpingKnuckle.gif HaggarDK.gif HaggarShoulder.gif HaggarClothesline.gif
    HaggarFElbow.gif HaggarCombo.gif HaggarCombo2.gif HaggarBodyPress.gif Slams, Throws
    and Grapples= HaggarGorillaPress.gif|Gorilla Press HaggarSuplex.gif|Suplex HaggarAtomicDrop.gif|Atomic
    Drop HaggarPowerbomb.gif|Powerbomb HaggarPiledriver.gif|Piledriver HaggarDoubleLegSlam.gif|Double
