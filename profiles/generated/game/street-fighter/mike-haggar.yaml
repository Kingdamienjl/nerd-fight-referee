    confidence: 0.6
  speed:
    text: Subsonic travel speed, with Supersonic+ reactions and combat speed (He can
      attack faster than crossbow bolts. Comparable to Cody and Guy, has fought Rolento
      and can tag him mid sprint)
    source_ids:
    - vsbattles-mike-haggar-street-fighter
    confidence: 0.6
  lifting_strength:
    text: Class M (Wrestlers like him are powerful enough to slam the opponent through
      the stage, even if made of steel, leaving a large human-shaped hole behind.
      Haggar himself is overall equal in strength with them, and superior to some,
      and used to wrest and pin them down regularly during matches. Portrayed as comparable
      to Zangief. Can lift and throw even the largest opponents several meters into
      the air)
    source_ids:
    - mediawiki-5544
    confidence: 0.95
  striking_strength:
    text: Small Building level
    source_ids:
    - mediawiki-5544
    confidence: 0.95
  durability:
    text: Small Building level (Wrestlers like him can withstand each other's strongest
      attacks and get up for a second round. Able to take hits from the top members
      of the Mad Gear and Skull Cross gangs, and survive explosive thrown at him)
    source_ids:
    - vsbattles-mike-haggar-street-fighter
    confidence: 0.6
  stamina:
    text: Superhuman (Used to endure intense battles against his fellow wrestlers,
      fighting them even on rings made of ice, stone and steel. Can clear entire urban
      areas and facilities in a short time, taking on dozens of armed and unarmed
      enemies on his own)
    source_ids:
    - vsbattles-mike-haggar-street-fighter
    confidence: 0.6
  range:
    text: Standard Melee Range; Extended Melee Range to Tens of Meters with weapons
    source_ids:
    - vsbattles-mike-haggar-street-fighter
    confidence: 0.6
  intelligence:
    text: Gifted (Haggar is mostly known for his skill in combat and politics. He
      had a glorious career in pro wrestling that made him a seasoned fighter. He
      was one of the few CWA main eventers who could aspire to claim the title of
      the undefeated champion Victor Ortega, and in this period he faced many opponents
      with unique and/or odd fighting styles, abilities and equipment, sometimes battling
      them unorthodox stages, such as floors made of ice or with chains instead of
      ropes. Governed Metro City well for a full term as its mayor. Annihilated huge
      criminal organizations such as the Mad Gear (twice) and the Skull Cross, with
      only a few peers by his side, travelling across every corner of Metro City and
      even chasing them around the world. During his three main adventures he went
      through entire hordes of enemies, which included several types of thugs, soldiers
      and martial artists of all size and shape, often armed with knives, swords,
      guns, explosives and other weapons. His travels also led him to battle in a
      pletora of locations, ranging from standard urban areas and buildings, to places
      such as the inside and the top of speeding trains, paths filled with traps,
      tight spaces such as elevators, worksites and mine fields. Is rather ingenious
      and can use throw and use weapons such as knives and swords with certain proficiency
      despite not being familiar with them, and also pick up objects like pipes and
      lumbers and turn them into effective tools for combat)
    source_ids:
    - vsbattles-mike-haggar-street-fighter
    confidence: 0.6
