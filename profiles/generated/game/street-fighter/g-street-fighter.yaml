- id: claim-weaknesses-8c907902
  section: weaknesses
  axis: weakness
  text: 'His Presidentiality levels go down if he is knocked down. Some of his moves are often followed
    by taunts, gestures and dances, but doesn''t necessarily perform them all the times. Fighting Style:
    WildPresident.gif|Wild President StrongPresident.gif|Strong President CrashPresident.gif|Crash President
    FlyingPresident.gif|Flying President *Wild President: G spins on himself and clubs the opponent with
    the back of his fist. *Strong President: G delivers a powerful uppercut that sends the opponent flying.
    *Crash President: G raises his right leg and hammers the opponent''s head with the heel. *Flying President:
    After performing a jump, G widens his body and lands on the opponent. *Message To The People: G performs
    one of his famous speeches, with three versions being known so far. This allows him to buil his own
    reserves of chi the more he keeps talking. The entire technique takes quite a lot of time to be completed,
    but G can stop at any time. center|335px ViolencePresident.gif|Violence President DestroyPresident.gif|Destroy
    President ShiningPresident.gif|Shining President *Violence President: G slightly pushes the opponent''s
    shoulder, before delivering a powerful gut punch. The crumpled opponent is then hit by a clothesline
    to the face. *Destroy President: G lifts the opponent off the ground with a single hand, then brings
    them over his head and slams them back-first on his knee. *Shining President: G presses the head of
    a crouched opponent and volently knees their faces. GCharge.gif|G Charge (Normal and Full) GSmashOver1.gif|G
    Smash Over Lv.1 GSmashOver2.gif|G Smash Over Lv.2 GSmashOver3.gif|G Smash Over Lv.3 EXGSmash.gif|EX
    G Smash Over GSmashUnder1.gif|G Smash Under Lv.1 GSmashUnder2.gif|G Smash Under Lv.2 GSmashUnder3.gif|G
    Smash Under Lv.3 EXGSmashUnder.gif|EX G Smash Under GBurst1.gif|G Burst Lv.1 GBurst2.gif|G Burst Lv.2
    GBurst3.gif|G Burst Lv. 3 EXGBurst.gif|EX G Burst GSpinKick1.gif|G Spin Kick Lv.1 GSpinKick2.gif|G
    Spin Kick Lv.2 GSpinKick3.gif|G Spin Kick Lv.3 EXGSpinKick.gif|EX G Spin Kick GImpact.gif|G Impact
    Lv.1 GImpact2.gif|G Impact Lv.2 GImpact3.gif|G Impact Lv.3 EXGImpact.gif|EX G Impact *G Charge: G
    touches the ground with his palm and starts absorbing Earth''s energy, raising his Presidentiality.
    He can perform a quick version, which raises his Presidentiality by one level, or a longer version
    that fills the entire gauge. *G Smash Over: G quickly dashes forward and delivers a raising punch
    filled with energy, sending the opponent flying. Its effects and strength depend on the level of G''s
    Presidentiality. The EX version is identical to the third level, but doesn''t require the maximum
    amount of Presidentiality to be performed. **Lv. 1: The most basic version, with no special properties.
    **Lv. 2: Deals more damage and sends the opponent higher than normal into the air, allowing G to perform
    more attacks while they fall down. **Lv. 3: Deals even more damage, and G''s fist is now imbued in
    magma, which burns the opponent on hit. The first punch is followed by a second one, which causes
    further damage and burns, on top of sending the opponent crashing against the wall, if available.
    *G Smash Under: Another dashing punch imbued with energy, this time aimed at the opponent''s feet.
    Its effects and strength depend on the level of G''s Presidentiality. The EX version is identical
    to the third level, but doesn''t require the maximum amount of Presidentiality to be performed. **Lv.
    1: The most basic version, with no special properties. **Lv. 2: Deals more damage and leaves G less
    exposed if the opponent blocks the attack. **Lv. 3: Deals even more damage, and G''s fist is now imbued
    in magma, which burns the opponent on hit. The first punch is followed by a second one, which causes
    further damage and burns. *G Burst: A golden, meteor-shaped projectile made of chi and fired from
    G''s arm at an angled direction. Its effects and strength depend on the level of G''s Presidentiality.
    The EX version is identical to the third level, but doesn''t require the maximum amount of Presidentiality
    to be performed. **Lv. 1: The most basic version, with no special properties. **Lv. 2: Deals more
    damage and pushes the opponent farther than normal. **Lv. 3: Deals even more damage, and the projectile
    now explodes in a burst of magma upon hitting the ground, burning the opponent and knocking them down.
    *G Spin Kick: G leaps forward and delivers an overhead wheel kick, with his legs imbued with chi.
    Its effects and strength depend on the level of G''s Presidentiality. The EX version is identical
    to the third level, but doesn''t require the maximum amount of Presidentiality to be performed. **Lv.
    1: The most basic version, with no special properties. **Lv. 2: Deals more damage, causes more staggering
    and sends the opponent flying if they are hit while in the air, leaving them open to more attacks
    while they fall. **Lv. 3: Deals even more damage, and G''s leg is now imbued in magma, which burns
    the opponent. The first kick is followed by'
