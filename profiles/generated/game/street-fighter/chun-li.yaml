- id: claim-powers-and-abilities-b3a4d830
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts (Expert in Kung-Fu, Kempo, and other Chinese
    martial arts) *Acrobatics (Hypermobility & Self-Momentum) *Chi Manipulation & Projection *Stealth
    Mastery (Is a professional detective and managed to infiltrate an S.I.N. laboratory.Street Fighter
    IV: The Ties That Bind) *Marksmanship (Used to carry a gun with her and she is stated to be skilled
    with firearms, but she has never fired anything more than warning shots and always prefers to use
    physical combat instead.Street Fighter Alpha 3 - Chun-Li''s Arcade ModeStreet Fighter V Champion Edition:
    Official WebsiteStreet Fighter 30th Anniversary Collection Competes in skeet shooting for sportStreet
    Fighter VI - World Tour - Chun-Li''s Dialogues) *Social Influencing (Charisma & Deception; Learned
    how to deal with a lost child.All About Street Fighter ZERO 3 Is a good actress and could circumvent
    Charlie''s guards) *Extrasensory Perception (Can sense chiSuper Street Fighter IV Original Video Animation)
    *Enhanced Senses (Her senses never dulled over time and she could still be aware that Juri was following
    herStreet Fighter VI - Chun-Li''s Story Mode) *Forcefield Creation (Via Kikosho) *Statistics Amplification
    (Via Renkiko) *Limited Power Nullification (Via Hakkei, which cancels out normal projectiles) *Damage
    Boost (Can perform enhanced versions of her Special Attacks) *Status Effect Inducement (By hitting
    the opponent repeatedly, without them being able to recover, she can cause them to enter the "Stun"
    status, which leaves them unable to react. Her Focus Attack causes the opponent to enter a "crumpling"
    status) *Awakened Power (Her determination and emotions allowed her to defeat Vega, who could overcome
    her not much time beforeStreet Fighter V - Chun-Li''s Character Story) *Limited Fate Manipulation
    (Fighters can fight against their destiny.)'
