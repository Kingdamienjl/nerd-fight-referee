  axis: weakness
  text: 'Refused to use her gun against M. Bison, as she wanted to defeat him in a fight. Notable Attacks/Techniques:
    |-|Unique Attacks= Tsuitotsuken.gif|Tsuitotsuken Yosokyaku.gif|Yosokyaku Kakukyakuraku.gif|Kakukyakuraku
