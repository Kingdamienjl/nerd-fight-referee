    ChunLiWallJump.gif|Wall Jump RearSpinKick.gif|Rear Spin Kick KakusenShu.gif|Kakusen Shu KintekiShu.gif|Kinteki
    Shu Tenshoukyaku.gif|Tenshoukyaku Chun Focus.gif|Focus Attack SourenShou.gif|Souren Shou Kakushu.gif|Kakushu
    Senjou.gif|Senjou Suitotsu.gif|Suitotsu *Tsuitotsuken ("Chasing Thrust Fist"): Chun-Li performs a
    hand chop thrust attack towards her opponent. *Yosokyaku ("Hawk Claw Leg"): While airborne, Chun-Li
    brings one of her feet downwards, hitting her opponent below. *Kakukyakuraku ("Crane Leg Fall"): Chun-Li
    jumps and flips to her opposite side, hitting her opponent with a backward-facing landing stomp. *Hakkei
    ("Fajin/Force Exert"): Chun-Li thrusts her palms forward. The attack can also destroy normal projectiles.
    *Sen''enshu ("Whirling Circle Kick"): Chun-Li flips into a head stand while spinning her legs, then
    slams her legs down in front of her, dealing a good amount a damage. *Tenkukyaku ("Aether Leg"): Chun-Li
    does a high-standing vertical upward heel kick. *Yokusenkyaku: Chun-Li performs a slight hop vertical
    roundhouse kick. *Wall Jump: Thanks to her heightened agility Chun-Li is able to adhere on a wall
    for a brief moment and gain an additional jump. *Rear Spin Kick: Chun-Li performs a somersault and
    hits the opponent with a knee strike. *Kakusen Shu: Chun-Li pivots and delivers a horizontal roundhouse
    kick. *Kinteki Shu: Chun-Li stretches her leg and hits the opponent with the top of her foot. *Hienshu
    ("Flying Swallow Kick"): Chun-Li jumps in the air, stops her momentum and drops over the opponent
    with the sole of her foot. *Tenshokyaku ("Ascension/Heaven Rising Legs"): Chun-Li swiftly delivers
    a Kinteki Shu followed up by a Tenkukyaku, then leaps upwards and kicks while spinning repeatedly.
    *Focus'
