  intelligence:
    text: 'Genius (The best of a generation of individuals that are the culmination of countless generations
      of selective breeding, more intelligent than any who have come before them. Versed in scripture,
      science and combat, Gill was instructed since childhood with the purpose of making him the leader
      of the Secret Society, an organization which pulls the strings of the world from behind the curtain.
      Specifically, Gill has always focused his attention on academics, scripture and dogma. Moreover,
      Gill won a tournament to-the-death meant to establish the best among his peers, even defeating his
      brother Urien in the finals.Super Street Fighter - Vol. 2Street Fighter Unlimited - Issue #8 An
      exceptional leader who expertly guided the Secret Society towards world domination through a carefully
      developed plan, which almost came to fruition. Gained worldwide trust through his charisma and ability
      to manage the Secret Society''s resources. Completely outmatched Evil Ryu, even considering him
      predictable and easy to control)'
    source_ids: *id002
    confidence: 0.95
