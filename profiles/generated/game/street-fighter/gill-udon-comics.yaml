- id: claim-powers-and-abilities-9cf4c7ae
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Genius Intelligence, Master Martial Artist, Acrobatics,
    Fire Manipulation (Controls and projects fire through the right half of his body. Can imbue his limbs
    with flames and set others ablaze just by touching them), Ice Manipulation (Projects and controls
    ice through the left half of his body. Can freeze people and objects whole through a simple touch
    or by raisingStreet Fighter VS Darkstalkers - Issue #0 his hand, encasing them completely or making
    them so brittleStreet Fighter Unlimited - Issue #7 they shatter. Such power is potent enough to stop
    a nuclear missile on its tracks and immobilize one as strong as Evil Ryu, who was unable to break
    free on his own.Street Fighter Unlimited - Issue #11 Can also generate ice constructs such as spikes,
    walls and beams), Body Control (Can sprout six angelic wings on his back), Flight (Able to fly and
    levitateStreet Fighter Unlimited - Issue #4 with or without his wings), Energy Manipulation and Projection
    (Via Seraphic Wing. As the master of opposites, he possesses the unique ability to act as a catalyst
    for positive and negative chi,Street Fighter VS Darkstalkers - Issue #3 channeling their united essence
    into other beings), Power Nullification (Silenced Evil Ryu''s Satsui no Hado and reverted Oni back
    into a human, something Akuma didn''t deem possibleStreet Fighter Unlimited - Issue #1), Regeneration
    (Mid-Low; Instantly healed from severe burns upon awakening his powers), Resurrection (Restored Rufus
    back to life), Forcefield Creation (Attacks from weaker opponents don''t even reach himStreet Fighter
    Unlimited - Issue #10), Immortality (Types 6 and 7), Possession and Power Bestowal (Can survive as
    a disembodied spirit and take over the bodies of people who share the unique genetic marker of his
    bloodline, granting them his same powers), Social Influencing (His charisma, coupled with the Secret
    Society''s immense resources and influence, established him as a true savior at the eyes of all humanity,
    which cast aside their differences and came to blindly worship himStreet Fighter Unlimited - Issue
    #5), Resistance to Heat, Light, Loud Sounds and Radiations (Standing at the epicenther of a nuclear
    explosion didn''t affect him at all, despite the extremely high levels of heat, brightness, loudness
    and radiation it generates)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
