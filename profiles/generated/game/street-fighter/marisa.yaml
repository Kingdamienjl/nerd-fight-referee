    backflips to maintain her balance and swiftly regain her footing if knocked down in mid-airStreet
    Fighter VI - Gameplay) *Chi Manipulation and Forcefield Creation (Can cover her body with a golden
    energy that strengthens her blows and shields her from enemy attacks. Such properties are particularly
