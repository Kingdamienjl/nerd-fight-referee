- id: claim-weaknesses-88397f6d
  section: weaknesses
  axis: weakness
  text: 'Afraid of heights. Fighting Style: |-|Notable Attacks/Techniques= {{#tag:tabber| {{!}}-{{!}}Unique
    Attacks= *Marisa Style: Marisa can increase the power of her strikes by charging them for a few moments.
    *Light Two Hitter: A double, light jab aimed at the face. *Medium Two Hitter: Two hooks of medium
    strength to the lower body. *Heavy Two Hitter: A pair of hefty, high hooks. *Volare Combo: A jab and
    a downward chop performed in mid-air. *Caelum Arc: A downard punch delivered in mid-air with both
    hands clenched together. *Magna Bunker: A strong gut punch executed while lunging forward, useful
    to stagger the opponent and follow up with other attacks. *Novacula Swipe: A mid hook followed by
    a sweeping punch to the feet that knocks the opponent down. *Novacula Thrust: A mid hook followed
    by a strong push kick. *Malleus Breaker: Two overhead punches targeting the malleus. *Falx Crusher:
    A pair of advancing knees. *Secutor: A powerful mid punch delivered while lunging forward. *Love Tap:
    Marisa blocks an attack and counters with a heavy slap to the face. {{scroll box|content= MarisaStyle.gif|Marisa
    Style LightHitter.gif|Light Two Hitter MediumHitter.gif|Medium Two Hitter HeavyHitter.gif|Heavy Two
    Hitter VolareCombo.gif|Volare Combo CaelumArc.gif|Caelum Arc MagnaBunker.gif|Magna Bunker NovaculaSwipe.gif|Novacula
    Swipe MalleusBreaker.gif|Malleus Breaker FalxCrusher.gif|Falx Crusher Secutor.gif|Secutor LoveTap.gif|Love
    Tap }} {{!}}-{{!}}Throws= *Mounted Grace: Marisa locks the opponent''s wrist, hugs their waist and
    pulls it to take them down. While keeping the hold on one leg, she delivers powerful punch that smashes
    the opponent''s head against the ground. *Ponte Milvio: Marisa locks the opponent''s wrist, then lifts
    them over her shoulder and tosses them behind her. MountedGrace.gif PonteMilvio.gif {{!}}-{{!}}Special
    Attacks= *Gladius: A straight punch powered by ki. Marisa can charge the attack to increase its strength,
    power through an incoming attack and open the way to a second, even stronger punch that launches the
    enemy away. By using more energy, Marisa''s ki protects her even while charging the punch and add
    even more power to the already strengthened punch. *Dimachaerus: An uppercut and a hammer punch chained
    together and empowered by ki. The enhanced version makes the second punch strong enough to make the
    opponent bounce on the ground and be exposed to one more attack. *Phalanx: Marisa covers herself in
    protective ki, leaps forward and strikes with a downward punch infused with ki. The enhanced version
    is even stronger and aims at slamming the opponent against a wall to leave them open. *Quadriga: Marisa
    hops forward and attacks with a front kick empowered by ki. The enhanced version is even stronger
    and sends the opponent flying away. *Scutum: Marisa raises her guard while covering both her forearms
    with ki. Upon blocking an attack, Marisa steps forward and thrusts her arms into the opponent. Marisa
    can spend more energy to make her ki armor even more resistant. **Tonitrus: Upon initiating Scutum,
    Marisa first hammers and then uppercuts the opponent with both arms. **Procella: Marisa cancels Scutum
    in favor of a low, roundhouse kick that trips the opponent. **Enfold: Marisa performs Scutum to feint
    a defensive maneuver, to instead lure the into being grabbed. She then pushes their head down, locks
    their arm and mounts on them with all her body, forcing them into submission. With the opponent trapped,
    Marisa charges her fist with ki and smashes the opponent''s head onto the ground for devastating damage.
    {{scroll box|content= Gladius.gif|Gladius Dimachaerus.gif|Dimachaerus PhalanxMarisa.gif|Phalanx Quadriga.gif|Quadriga
    Scutum.gif|Scutum Tonitrus.gif|Tonitrus Procella.gif|Procella Enfold.gif|Enfold }} {{!}}-{{!}}Super
    Attacks= *Javelin of Marisa: Marisa rears back and attacks with a full-power punch. Marisa can charge
    the attack to increase the damage dealt and raise an armor of ki that protects her from an incoming
    attack. *Meteorite: Marisa raises her guard and moves forward with a leaping tackle. While still in
    the air, she comes down rapidly with a crushing hammer punch. *Goddess of the Hunt: Marisa raises
    a full-body ki armor and tackles the opponent with a powerful shoulder, stunning the momentarily.
    Without letting them room for recovery, Marisa smacks their face with a full-power uppercut, sending
    them crash against the wall. If Marisa is drawing close to defeat, she will pack even more energy
    into an additional punch that crushes the opponent''s head against the aforementioned wall. }} |-|Combat
    Skills= ===Pankration=== A form of unarmed combat sport born in ancient Greece around 600 BC, and
    practicted for hundreds of years even during Roman times. It makes use of Boxing and Wrestling techniques,
    as well as many others, in fashion resembling modern Mixed Martial Arts. A pankratiast aims at submitting
    the opponent with every method and technique, to prove their superior might. Fascinated by the glory'
  source_ids: *id003
