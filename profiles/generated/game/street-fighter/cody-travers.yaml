    confidence: 0.6
  intelligence:
    text: Above Average (A very skilled combatant who makes use of both martial arts
      and underworld brawling. Helped vanquishing the Mad Gear Gang facing all of
      its members, often taking on many of them at the same time. Took part in many
      brawls, but is also able to give a hard time to actual fighters such as Rolento,
      Guy and Zeku. Is an excellent improviser, being able to use the environment
      to his advantage and turn pretty much anything he gets his hands on in a weapon.
      Is especially good with knives and dirty tricks, including throwing stones and
      dust, crushing eyes and holding down the opponents using the handcuffs he used
      to wear. Can somewhat get his job as a mayor done, despite his habit to avoid
      any responsibility.)
    source_ids:
    - vsbattles-cody-travers-street-fighter
    confidence: 0.6
