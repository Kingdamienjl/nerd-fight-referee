  intelligence:
    text: 'Gifted (Previous to becoming an agent, C. Viper was a scientist and engineer, professions which
      she tried to further even while working undercover, gaining terrific results researching tech such
      as drones and holograms at SiRN and the battle suit and the BLECE project at S.I.N. Being a secret
      agent came natural to her, which led to her becoming one of the best CIA agent there is. A great
      detective as well, she has been tasked with the investigation of large-scale criminal organizations,
      such as Shadaloo, S.I.N. and SiRN, and sensible subjects such as M. Bison, Juri, Urien,Street Fighter
      V - Urien''s Story Mode Q,Shadaloo C.R.I. - Character Guide 043: Q JP and the Player, each of whom
      she has managed to track down at least once. She could also retrieve informations even about secret
      topics, such as the truth behind Charlie''s assassination and the destruction of the Nguuhao clan.Street
      Fighter V - M. Bison''s Story Mode As an impersonator, she has always managed to climb up the ranks
      of the companies she had infiltrated, going as far as toppling many of them from the inside. Training
      allies was one of the many skills picked up during her training and she could effectively pass her
      fighting style onto the Player. Has been the only one to truly master the battle suit. Her fighting
      skill allowed her to defeat Cammy and confront the likes of Chun-Li, Ryu, Hakan, JP and M. Bison.Street
      Fighter IV - M. Bison''s Rival Battle Her specialty is the performance of magic tricksUltra Street
      Fighter IV - Website (archived))'
