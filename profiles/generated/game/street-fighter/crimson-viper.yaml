- id: claim-powers-and-abilities-9df59097
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts (Utilizes a peculiar secret agent fighting
    style in combination with her many gadgets) *Sleight of Hand (Her moveset includes several feints.
    Has used her jacket as a decoy to mislead Cammy) *Acrobatics (Hypermobility and Self-Momentum. Capable
    of utilizing several jumping attacksStreet Fighter VI - Gameplay and acrobatic techniques. In combat,
    she can also perform somersault jumps and mid-air flips to recover her balance after being struck
    by the opponent. Could leap down a construction site with absolute nonchalance) *Stealth Mastery (Is
    an expert spy and special agent, one of the best the C.I.A.Street Fighter VI - World Tour - Juri''s
    Conversations has at its disposal. Has worked undercover as a field agent for S.I.N. without being
    discovered until the very end;Street Fighter IV - C. Viper''s Ending years later she managed to infiltrate
    the SiRN and become a research department director.Street Fighter VI - C. Viper''s Story Mode Could
    enter a Shadaloo base and nobody but M. Bison could notice her. Has worked together with Juri to infiltrate,
    double-cross and eventually rob and destroy several organizations. The training she has received in
    order to become a secret agent has also taught her the craft of assassination) *Social Influencing
    (Deception: As a master impersonator, C. Viper excels at selling her acts and convincing people to
    believe whatever identity she is pretending to have, such as Director Grace Hill. Furthermore, she
    handles a number of fake aliases simultaneously and disposes of them routinely.Street Fighter VI -
    C. Viper''s Victory Screen Deceived Eliza in order to blackmail Ken and managed to eventually bring
    Ryu to her. Has staged an elaborate ruse to lure the Player into an ambush. Instigating Fear: While
    posing as the S.I.N. agent Maya, C. Viper gained an infamous reputation due to her intimidating personality.
    Miscellaneous: She was taught interrogation, negotiation and intimidation tactics as part of her training)
    *Camouflage (Has received camouflage training during her instruction to become a special agent. The
    adoption of different aliases requires her to don a different disguise for each of them) *Weapon Mastery
    (Has mastered her battle suitStreet Fighter IV - C. Viper''s Prologue and its many gadgets. Carries
    a handgunStreet Fighter IV - Cammy''s Ending with her and should have received firearm training during
    her career) *Electricity Manipulation (Her gauntlets are outfitted to discharge electricity from the
    knuckles) *Light Manipulation (Her gloves can emit blinding flashes of light) *Fire Manipulation (Sports
    small flamethrowers in her boots. Her electric gloves can also ignite paper) *Vibration Manipulation
    (Her gauntlets can release powerful shockwaves) *Air Manipulation and Flight (Her heels can emit pressurized
    air to enhance her jumps and even enable her to flyStreet Fighter IV - The Ties That Bind via perpetual
    propulsion) *Forcefield Creation (Her gloves can raise a small energy shield, as exemplified by Focus
    Force) *Minor Technology Manipulation (Her smart glasses'' lens can switch between sunglasses mode
    and normal modeStreet Fighter VI - C. Viper''s Match Intro) *Minor Illusion Creation (Her gauntlets
    can project hologramsStreet Fighter VI - C. Viper''s Character Selection Screen and interact with
    them) *Information Analysis (Her smart glasses provide metrics and intel, and can even act as lie
    detectors. Makes use of data-harvesting sensors. Could read and measure Ryu''s power level) *Analytical
    Prediction (Utilizes AI-powered movement prediction tech to gain an edge in battle) *Limited Sound
    Manipulation (Uses a device to alter her voice during interrogationsStreet Fighter VI - World Tour
    - C. Viper) *Damage Boost (Can perform enhanced versions of her Special Attacks) *Empowerment (Via
    Limit Decoupler. Hard Luck Rejector also turns intro a stronger version whenever C. Viper is approaching
    defeat) *Status Effect Inducement (By hitting the opponent repeteadly, without them being able to
    recover, she can cause them to enter the "Stun" status, which leaves them unable to react. Her Focus
    Attack causes the opponent to enter a "crumpling" status) *Limited Fate Manipulation (Fighters can
    fight against their destiny)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
