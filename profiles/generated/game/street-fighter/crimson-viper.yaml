- id: claim-weaknesses-d28f9e0c
  section: weaknesses
  axis: weakness
  text: 'Claims her combat performance would decrease around eighty percent were she to fight without
    her various gadgets. Fighting Style: *Viper Elbow: C. Viper does a small leap forward and performs
    an elbow drop onto her opponent *Double Kick: C. Viper first delivers two kicks in a row, aiming to
    the midsection first and to the face then. *High Jump: C. Viper uses her special heels to enhance
    her jumping capacity. *Viper Cannon: C. Viper lunges forward to deliver a devastating punch empowered
    by shockwaves. While performing this attack, she also attempts to push through the opponent''s attack.
    *Counter Spark: After blocking an opponent''s attack, C. Viper retaliates with a hand strike engulfed
    in lightning. *Viper Blade: C. Viper delivers a high roundhouse kick. *Focus'
  source_ids: *id003
  decisive: false
  status: unverified
