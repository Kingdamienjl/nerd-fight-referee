  stamina:
    text: Superhuman (A well-trained fighter, who can hold back and prolong battles
      with the the world's best warriors, such as Chun-Li, Charlie Nash and F.A.N.G,
      just to toy with them. Is one of the few individuals in possession of the physical
      and mental fortitude required to control Psycho Power without dire effects on
      their body and mind. In SFV, Nash blew himself up while trying to absorb his
      power, and the latter still had plenty of energy, and enough to put up a fight
      with Ryu)
