- id: claim-weaknesses-bec465ae
  section: weaknesses
  axis: weakness
  text: 'None notable. Fighting Style: *Water Slicer Slide: Kimberly slides along the ground and kicks
    the opponent. *Windmill Kick: Kimberly performs a reverse somersault and kicks the opponent overhead.
    *Hisen Kick: Kimberly leaps forward and land on the opponent with her leading leg. **Step Up: As a
    follow up to Hisen Kick, Kimberly can step on the opponent and jump in three different directions.
    *Elbow Drop: Kimberly jumps above the opponent and dives on them knee-first. *Bushin Tiger Fangs:
    A mid punch followed by a spinning uppercut. *Bushin Prism Strikes: Kimberly punches the opponent
    twice, then does a spinning uppercut and finishes with a Windmill Kick. *Bushin Hellchain: Two high
    punches, followed by an elbow to the face and a final roundhouse kick. *Bushin Hellchain Throw: A
    string of two punches, an elbow jab and a Seoi Nage. *Steadfast Strike: Kimberly leaps forward and
    kicks the opponent in their midsection. *Shapeless State: Kimberly parries an incoming attack and
    replies with a spinning elbow strike. *Ripcord Throw: Kimberly grabs the opponent''s wrist and delivers
    a chop to their face, then vaults past them and finishes by throwing them over her shoulders. *Bell
    Ringer: Kimberly knees the opponent''s face, plants her legs on their chest and uses the momentum
    to perform a Tomoe Nage. RipcordThrow.gif BellRinger.gif *Bushin Senpukyaku: Kimberly unleashes a
    series of spinning kicks while ascending in the air upward. This technique can also be initiated from
    mid-air. At the cost of more stamina, the sequence of kicks is extended. *Vagabond Edge: Kimberly
    dashes forward and drives her elbow into the opponent. She can then follow up with roundhouse kick
    or an upward kick. Kimberly can employ more stamina to increase the speed of this attack. *Hidden
    Variable: Kimberly conceals herself in colorful smoke and reappears in another spot. *Nue Twister:
    Kimberly grabs an airborne opponent, turns them upside-down and drives them head-first onto the ground.
    The strength of this attack can be increased at the cost of a little more stamina. BushinSenpukyaku.gif
    VagabondEdge.gif HiddenVariable.gif NueTwister.gif *Sprint: Kimberly runs forward leaving a trail
    of afterimages after her. This technique is meant to be followed by one of the following options.
    By spending more stamina, Kimberly can increase the damage dealt by these attacks. **Emergency Stop:
    Kimberly stops to adjust her distance or reduce her openings. **Torso Cleaver: A reverse somersault
    kick that launches the opponent upward. **Shadow Slide: A Water Slicer Slide made stronger by the
    increased speed. **Neck Hunter: An overhead spinning kick aimed at the neck. **Arc Step: Kimberly
    steps on the opponent''s body several times and gets back into position with a backflip. ***Bushin
    Izuna Otoshi: While still in the air, Kimberly dashes towards the opponent, grabs their body and slams
    them down. ***Bushin Hojin Kick: After the backflip, Kimberly descends diagonally with a single or
    double flying kick. KimberlySprint.gif EmergencyStop.gif TorsoCleaver.gif KimberlyShadowSlide.gif
    NeckHunter.gif ArcStep.gif BushinIzunaOtoshi.gif BushinHojin.gif *Genius at Play: Kimberly loads one
    or multiple spray cans. **Shuriken Bomb: Kimberly tosses one or more Shuriken Bombs on the ground.
    GeniusAtPlay.gif ShurikenBomb.gif ShurikenBombSpread.gif *Bushin Beats: Kimberly sprints forward and
    knocks the opponent down with a jumping somersault kick. As the opponent lays on the floor, she punches
    their face, then places herself above them and unleashes a flurry of punches to their stomach. *Bushin
    Thunderous Beats: If Kimberly has a Shuriken Bomb loaded at the end of Bushin Strikes, she finishes
    the combo by throwing it at the downed opponent. *Bushin Scramble: Kimberly jumps upwards and then
    dives down to tackle the opponent and send them flying. She then jumps and runs back and forth on
    the nearby walls to deliver a series of flying kicks. She culminates the sequence by reaching above
    the opponent, crossing her arms and diving down to slam them on the ground. *Bushin Ninjastar Cypher:
    Kimberly turns up her cassette player to boost her performances and initiate her strongest technique.
    She uppercuts the opponent into the air and surrounds them with a volley of Shuriken Bombs, which
    will then be sprayed around to draw a graffito as the opponent is striken by multiple aerial attacks,
    before being sent crashing down. Upon drawing close to defeat, Kimberly concludes instead with a punch
    to the face and a Nue Twister.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-60c623c2
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts (Expert Ninja) *Weapon Mastery *Explosion
    and Smoke Manipulation (Via Shuriken Bombs, modified spray cans which can be used as explosive weapons
    or to create smoke screens, effectively working as a different take on traditional ninpo smoke bombs.)
    *Acrobatics (Hypermobility and Self-Momentum: Possesses a vast repertoire of jumping attacks and acrobatic
    techniques, some of which reach superhuman and physics-defying levels. Is a capable parkourist and
    was able to bolt across a construction site to follow The Player unnoticed.Street Fighter VI - World
    Tour (Chapter 9)Street Fighter VI - World Tour (Chapter 8) She recurrently pulls off a variety of
    stunts and performs maneuvers that allow her to maintain or regain her footing during combat.Street
    Fighter VI - Kimberly''s Intro Animations) *Stealth Mastery (Stealth is a fundamental part of Bushin-ryu
    training and Kimberly demonstrated her proficiency when she infiltrated a construction site and stalked
    The Player without making any sound) *Teleportation (Via Hidden Variable, which allows her to teleport
    around the battlefield and or leave her location entirely) *Damage Boost (Can perform enhanced versions
    of her Special Attacks) *Afterimage Creation (Leaves afterimages of herself while sprinting, as seen
    in many of her techniques) *Statistics Amplification (Listening music from her cassette player increases
    her strength and speed [Bushin Ninjastar Cypher]) *Empowerment (Bushin Ninjastar Cypher turns into
    a different and stronger attack in whenever Kimberly is at low health) *Limited Fate Manipulation
    (Fighters can fight against their destiny.)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
