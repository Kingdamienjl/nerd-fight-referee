  section: weaknesses
  axis: weakness
  text: Cheng Xiaoshi's supernatural photo-traversing powers are extremely limited
    and can only be initiated through images; the picture can only transfer his soul
    into a certain individual at once -- hence, the accessibility of his powers may
    not be possible if he were to lack the required materials. Without any images
    or videos, he is pretty much a mere ordinary human. However, he is capable of
    accessing his powers through online images and videos displayed on a screen.
  source_ids: *id002
