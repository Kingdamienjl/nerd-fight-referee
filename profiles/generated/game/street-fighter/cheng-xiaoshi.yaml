  section: abilities
  axis: hax
  text: Peak Human Physical Characteristics, Superhuman Durability, Superhuman Speed,
    Genius Intelligence, Soul Manipulation/Possession and Limited Time Travel (Xiaoshi
    can possess one's body through the transference of the soul through accessing
    photos and images.Season 1, Episode 1 The image Xiaoshi traversed and possessed
    into may be from the past, therefore he can travel to that specific time period
    when the image was taken), Extrasensory Perception and Clairvoyance (Able to perceive
    and analyze his opponent while in an another person's body across time periodsSeason
    1, Episode 11), Memory Manipulation (Inherits and control the memories of his
    clients and all the people he has possessed. Therefore, he'll also have a bonds
    and feel emotions for the love ones of his clients. Can also link his memories
    and point of view with Lu GuangSeason 1, Episode 5), Empathic Manipulation (Induced
    the guilt of a murderer, causing him panic attacks and doubting his own sanity),
    Telepathy (Able to communicate with Lu Guang psychically without any conventional
    interaction while in a another person's body in another time period), Fate Manipulation/Causality
    Manipulation (His power can redirect fate and cause events in the past, by traveling
    back in time, reversing events and setting a new future.Season 2, Episode 12 Lu
    Guang even fooled Xiaoshi to prevent him from changing the past, otherwise it
    may cause catastrophic events), Teleportation (Took a gunshot wound fired by Vein
    for Lu Guang by teleporting between them), Limited Power Bestowal (Can transfer
    his powers to another person upon his death), Martial Arts (Has experience in
    fighting. Trained with a martial arts master who knows various sacred techniques
    that can easily quell their opponents.Season 1, Episode 7 Fought with Qianjin,
    a criminal leader and multiple of his gang membersSeason 2, Episode 10Season 2,
    Episode 11), Durability Negation (Via the "Sending You to Heaven" technique, he
    can inflict an uppercut that can knockout opponents who are vastly stronger than
    his possession target), Reality Warping/Space-Time Manipulation (Any wrong action
    made by Cheng Xiaoshi may warp all of space-time and reality, practically changing
    everything)
  source_ids: *id002
  decisive: true
  status: unverified
