power_scale:
  tier:
    text: 9-C, via Possession; Low 2-C Environmental Destruction through his Time-Traversal
      powers
    source_ids:
    - vsbattles-cheng-xiaoshi-street-fighter
    confidence: 0.6
  attack_potency:
    text: Street level (Fought on par with Qianjin -- a retired cop and cirminal organisation
      leader, and many of his gang membersSeason 2, Episode 2), Varies via Possession
      (He is capable of possessing anyone who's in the picture, hence his power can
      vary depending on the person he possesses); Universe level+ Environmental Destruction
      through his Time-Traversal powers (Cheng Xiaoshi's Time-Traversal powers can
      potentially cause a "hurricane" that can destroy the world,Bridon Chapter, Episode
      1 as distorting future sequence nodes can result in catastrophic events)
    source_ids:
    - vsbattles-cheng-xiaoshi-street-fighter
    confidence: 0.6
  speed:
    text: Superhuman reaction and combat speed (Reacted and dodged punches and kicks
      from many skilled fighters and gang members. Reacted to Qianjin and Li Tianchen's
      punches and kicks. Organised timings and took action fast enough to avoid getting
      stabbed by Liu Min possessed by Li Tianchen), Varies via Possession (Speed can
      vary depending on his possession target)
    source_ids:
    - vsbattles-cheng-xiaoshi-street-fighter
    confidence: 0.6
  lifting_strength:
    text: Unknown
    source_ids:
    - mediawiki-4875480
    confidence: 0.95
  striking_strength:
    text: Street level, Varies via Possession
    source_ids:
    - mediawiki-4875480
    confidence: 0.95
  durability:
    text: Street level (Survived and quickly recovered from a gunshot wound; can still
      fight afterwards. Capable of taking multiple hits from Qianjin after getting
      tremendously injured prior by a gunshot wound), Varies via Possession (His durability
      can vary depending on the person he possesses)
    source_ids:
    - vsbattles-cheng-xiaoshi-street-fighter
    confidence: 0.6
  stamina:
    text: At least Peak Human, possibly Superhuman (Recovered and adapted from a gunshot
      wound in a very short period of time. Was still capable of fighting Qianjin
      after a brawl with Li Tianchen and a gunshot wound; in the end, he was still
      standing despite bearing fractured bones and a broken leg. However, Xiao Li
      interfered with his fight with Qianjin before he can exert up to his full extend)
    source_ids:
    - vsbattles-cheng-xiaoshi-street-fighter
    confidence: 0.6
  range:
    text: Standard Melee Range, Universal+ and Interdimensional with his supernatural
      powers
    source_ids:
    - vsbattles-cheng-xiaoshi-street-fighter
    confidence: 0.6
  intelligence:
    text: "Gifted (Was the main and most valued detective towards the police force\
      \ investigation towards Li Tianchen and the supernatural phenomenon involving\
      \ the possession of people through images. Extremely cunning and intelligent,\
      \ capable of devising viable plans and make the most vital usage with his powers.\
      \ Noticed the instant that he is not the only person with superpowers and Liu\
      \ Min was a puppet of Li Tianchen, before it was discovered by anyone else.\
      \ Easily convinced the police that neither he nor Qi\xE1ol\xEDng\u4E54\u82D3\
      \ stabbed Lu Guang but another superpower wielder, Li Tianchen, who possessed\
      \ Qiaoling during the scene)"
    source_ids:
    - vsbattles-cheng-xiaoshi-street-fighter
    confidence: 0.6
