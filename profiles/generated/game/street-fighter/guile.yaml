    of Glory Focus guile.gif|Focus Attack *Knee Bazooka: Guile performs a jumping
    knee strike towards the opponent. *Reverse Spin Kick: Guile executes a stationary,
    upside-down kick. *Spinning Back Knuckle: Guile extends his arm out and clubs
    across the head using the back of his fist. *Rolling Sobat: Guile turns back for
    a brief second and does a leaping back-spin kick forward or backward. *Guile High
    Kick: Guile performs a spinning high kick. *Full Bullet Magnum: Guile performs
    a downward punch. *Burn Straight: Guile throws a straight punch toward his opponent.
    *Taurus Combination: Guile delivers a quick, low roundhouse kick to his opponent''s
    shins. When the attack connects, Guile follows up with a spinning back kick to
    his opponent''s head. *Tall Edge: Guile delivers a low kick to his opponent and
    follows up with a small hook to his opponent''s head. *Drake Fang: Guile delivers
    a crouching kick to his opponent''s legs and follows up with a downward punch.
    *Swing Out: Guile delivers a small hook to his opponent''s head, finising the
    combination with a Spinning Back Knuckle. *Bullet Revolver: Guile delivers a low
    kick to his opponent and follows with a small hook to his opponent''s head. Guile
    finishes the combination with a Spinning Back Knuckle. *CPS1 Chain: Guile delivers
    a low kick and immediately follows up with straight punch. *Shades of Glory: Guile
    pulls out his shades and wears them. He can then take them off. *Focus'
