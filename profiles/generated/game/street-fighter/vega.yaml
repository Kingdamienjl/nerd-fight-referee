    Shard: Vega does a small forward jump hop and delivers a downward kick with a straight leg. *Matador
    Blitz: Vega first performs a short, fingertip thrust, followed by a roundhouse kick that launches
    the opponent. Vega ends the combination with a spinning swipe that knocks the opponent further back.
    *Matador Flash: Vega first performs a upward slash. If the attack connects, he follows up with a downward
    slash that knocks the opponent back. Vega ends the combination by with a spinning slash that knocks
    the opponent further back. *Buster Claw: Vega lunges forward and extends his claw-hand toward the
    opponent. *Switch Claw: Vega puts aways his claw and enters a bare-handed stance. *Wall Jump: Thanks
    to his heightened agility, Vega is able to adhere on a wall for a brief moment and gain an additional
    jump. *Back Slash: Vega somersaults backwards to evade an incoming attack. He can perform a simple,
    short one, or an extended jump by landing on both hands and jumping again. *Cosmic Heel: Vega steps
    back and then jumps forward to deliver a roundhouse kick. *Focus'
