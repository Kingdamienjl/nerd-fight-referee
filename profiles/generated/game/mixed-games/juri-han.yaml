- id: claim-weaknesses-66f48b6c
  section: weaknesses
  axis: weakness
  text: 'Likes to toy around with her foes. The Feng Shui Engine Beta has a limited
    charge. Notable Attacks/Techniques: |-|Unique Attacks= File:Senkaikyaku.gif|Senkaikyaku
    File:Tojushu.gif|Tojushu File:Kyoretsushu.gif|Kyoretsushu File:Enkushu.gif|Enkushu
    File:Korenzan.gif|Korenzan File:JuriFocus.gif|Focus Attack *Sekku ("Temple Air")/Senkaikyaku:
    Juri leaps forward, spins and delivers a downward, roundhouse kick *Tojushu ("Trampling
    Lesser Assault"): Juri jumps forward and stomps her opponent, knocking them down
    *Kyoretsushu: Juri first delivers a back elbow strike to her opponent''s midsection.
    If the first attack hits, Juri rotates and finishes the combination with an upward
    side kick *Enkushu: Juri jumps and performs an open handed thrust and then lands
    an airborne roundhouse kick to knock her opponent to the ground *Korenzan: Juri
    lifts her leg up to kick her opponent. She then brings her leg downward, hitting
    her opponent with the heel of her foot *Focus'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-a462ae31
  section: abilities
  axis: hax
  text: 'Base= *Superhuman Physical Characteristics *Martial Arts (Juri is a master
    in Tae Kwon Do) *Acrobatics (Hypermobility & Self-Momentum) *Enhanced Senses (Dodged
    an attack from behind with her eyes closed) *Stealth Mastery (Took out a group
    of terrorists while hiding in the shadows) *Vehicular Mastery (Able to perform
    acrobatic maneuvers with her motorcycle) *Chi Manipulation & Projection *Extrasensory
    Perception (Should be able to sense chi, just like other just like other expert
    chi users) *Limited Cyborgization (Her left eye is replaced either by the Feng
    Shui Engine or by the Feng Shui Engine Alpha) *Possibly Afterimage Creation (Via
    Kasatushi) *Damage Boost (Can perform enhanced versions of her Special Attacks)
    *Status Effect Inducement (By hitting the opponent repeatedly, without them being
    able to recover, she can cause them to enter the "Stun" status, which leaves them
    unable to react. Her Focus Attack causes the opponent to enter a "crumpling" status)
    *Limited Fate Manipulation (Fighters can fight against their destiny.) |-|Feng
    Shui Engine= The Feng Shui Engine grants her: *Statistics Amplification *Greater
    Chi Manipulation & Projection (The engine artificially raises her Chi) *Aura *Forcefield
    Creation (Can create Chi barriers) *Explosion Manipulation (Able to generate large
    Chi explosions) *Information Analysis (Has a lock-on system, can read an opponent''s
    energy level and more. It can also record what Juri sees and gather data on the
    opponent''s fighting style) |-|Feng Shui Engine Alpha= The Feng Shui Engine Alpha
    grants her: *Statistics Amplification *Greater Chi Manipulation & Projection (Has
    the same function of the previous engine but on a weaker scale) *Aura *Energy
    Absorption (Via the Feng Shui Engine Beta technique) *Hacking (Enables intrusion,
    hacking and much more) |-|Street Fighter IV'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
