- id: claim-weaknesses-39bc3777
  section: weaknesses
  axis: weakness
  text: 'If Hakumen does not stand by his convictions, the Power of Order will see
    him as weak and not be of use to him. Notable Attacks/Techniques: *Drive: God
    Slash: Hakumen is capable of blocking, then instantly countering attacks intercepted.
    Doing so instantly earns him one magatama (max. 8), which can be used to perform
    special moves in place of Astral Heat. *Overdrive: Demon God: Temporarily provides
    an increase in both his attack power and toughness and additionally increases
    the rate at which he naturally generates magatama with his attacks and blocks.
    The lower Hakumen''s remaining health upon activation, the longer it lasts. *Earthbind:
    A passive ability of Hakumen''s. Whenever his sword, the Okami, comes into contact
    with a projectile, it instantly nullifies and destroys it, creating a temporary
    black hole-like void of vacuum energy that inflicts damage to those who come into
    contact with it equal to the nullified projectile''s damage. Additionally, further
    projectiles that touch the Earthbind are nullified. *Crimson Lotus: Lunges forward
    and smashes the opponent with the hilt of his sword. Can lead into or out of combos,
    and potentially wallbounce in some instances. Costs 1 magatama. *Demonic Leg:
    Dashes forward while briefly acquiring invincibility. Costs 1 magatama. Can be
    canceled into Hades, a powerful uppercut that launches the opponent, for 1 additional
    magatama. *Lotus: A low sweeping kick followed by a direct thrust kick, both imbued
    with black ink-like energy. Costs 2 magatama. *Firefly: Performs a swift upwards
    kick infused with black ink-like energy, immediately halting all momentum and
    gaining brief invulnerability. Semi-unblockable. Costs 2 magatama. *Rending Steel:
    An extremely powerful overhead blow, followed by an arcing side slash. Costs 3
    magatama. *Camellia: An extremely powerful spinning aerial slash that drives opponents
    into the earth. A good combo finisher. Costs 3 magatama. *Agito: Swipes directly
    downwards with his claw from the air, causing a translucent wave of black energy
    to trace his swing. Costs 1 magatama. *Distortion Drive: Empty Sky'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-4a6ec86d
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Acausality (Type 1; Unaffected by Phenomena
    Intervention, which can reset the timeline) Self-Sustenance (Types 1, 2 and 3;
    Lacks any need for sustenance due to not having an organic body), Non-Physical
    Interaction (Can cut through things with no physical form, such as alternate realities),
    Enhanced Senses (Can navigate through the boundary, an infinite space of nothing),
    Invulnerability (Is a being that exist outside of Logic; the fundamental rules
    of the world; meaning any abilities/weapons/and powers that are restrained by
    Logic cannot harm them), Extrasensory Perception (Can see invisible beings), Shockwave
    Generation (Capable of blowing people away by bursting), Portal Creation, Forcefield
    Creation (Anyone taught by the NOL can create barriers), Soul Manipulation, Healing
    and Regeneration Negation (up to High-Godly; Wounds inflicted by a Nox Nyctores
    scar the soul, which the victim cannot recover from even through Phenomena Intervention
    by Amaterasu, Nox Nyctores are also superior to Ars Magus, a weapon capable of
    killing the Black Beast, a creature that has the ability of Self Observation,
    which is what Terumi used to regenerate from Hakumen''s Time Killer), Telepathy
    (Was capable of reading Ragna''s memories), Instinctive Reaction (A Nox Nyctores
    fights, moves and warns the user without any consent), Spatial Manipulation (Tore
    a hole in the fabric of space and time to view an alternate event in the Continuum
    Shift), Causality Manipulation (Capable of creating causal drifts with only his
    ego), Aura (Merely being in his presence caused Ragna to become paralyzed), Immortality
    Negation (1, 3, and 9 [Was capable of killing Arakune]), Paralysis Inducement
    (Can passively paralyze those he sees), Precognition (Capable of predicting attacks
    using his mind''s eye), Time Manipulation (The Susanoo Unit slashes time), Existence
    Erasure (Time Killer completely erases the target''s "time", removing their existence
    from the past, present and future without causing a paradox), Immortality (Types
    1, 5 and 9; As an "uncertain factor", he is neither alive nor dead, and his true
    body exists in the Boundary), Reactive Power Level (The larger the threat to the
    world becomes, the stronger the Power of Order will make Hakumen), Power Nullification
    (Ōkami can nullify abilities), Light Manipulation (The Susanoo Unit produces light),
    Statistics Amplification (Via Overdrive), Cosmic Awareness (Is aware of other
    timelines), Regeneration (Low; Stated to heal at supernatural speeds during the
    events of Phase Shift) and Limited Subjective Reality (Power of Order can make
    something that doesn''t exist exist) |-|Resistance=Resistant to the following:
    Poison Manipulation, Madness Manipulation, Biological Manipulation and Statistics
    Reduction (Can resist the effects of Seithr, which is poisonous, can induce addiction
    and deteriorate bodies, as well as reducing the power of others), Memory Manipulation
    (Can resist the effects of Cauldron and/or Boundary, which erases memories), Chaos
    Manipulation (Resist the Boundary, which turns everything into a spiraling chaos),
    Void Manipulation/Existence Erasure and Corruption (Type 2) (Can resist the effects
    of the boundary, which can erase those that enters it, and corrupt them beyond
    recovery in a similar fashion to what happened to Arakune), Technology Manipulation
    (Is unaffected by the effects of Seithr, which can mess with technology), Corrosion
    Inducement (Resists getting corroded by the Cauldron), Time Manipulation (Can
    resist the effects of Cauldron and/or Boundary, which stops time by existing),
    Mind Manipulation and Information Manipulation (Able to resist the boundary/cauldron,
    which when entered or get closed, will result in taking infinite information and
    memories, dating across beginning of time and all possibilities), Heat Manipulation
    (Is unfazed by the intense heat from a cauldron), Empathic Manipulation (The Nox
    Nyctores can shut down the user''s emotions), Paralysis Inducement (Could fight
    Nu normally, who could paralyze with her strikes), Transmutation (As a chosen,
    he''s unaffected by the Embryo''s effect to turn everything into seithr), Disease
    Manipulation (Can resist the Black Beast''s power, who''s mere existence caused
    the Union Virus in Xblaze), Power Absorption (Can fight the Black Beast without
    having his powers absorbed from its presence), Deconstruction (Is capable of being
    near a Black Beast without deconstructing as it''s stated to do in Phase Shift),
    Resistance Negation (Is immune to the Embryo''s phenomena Intervention, which
    is shown to affect beings that are protected by Celica''s existence, who were
    able to ward off Phenomena Intervention that''s capable of affecting beings outside
    of logic), Phenomena Intervention (The Power of Order overpowers Phenomena Intervention,
    even by the Takamagahara System and The Embryo), Absorption (Can fight the Black
    Beast without being absorbed), Sealing (Resisted sealing during Phase Shift),
    Perception Man'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
