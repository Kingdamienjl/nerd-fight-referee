- id: claim-standard-equipment-36f72ab3
  section: equipment
  axis: equipment
  text: '* Interfectum Malice: Ōkami: One of the eleven Nox Nyctores created by Nine
    the Phantom to combat the Black Beast during the Dark War, taking the form of
    a long nodachi. It allows Hakumen to cut through dimensions to create viewpoints
    of other timelines, which he can also use to create a spatial bend resembling
    a black hole. Ōkami also nullifies abilities within a certain radius of the blade
    and can phase through objects such as its sheath.'
  source_ids: *id003
