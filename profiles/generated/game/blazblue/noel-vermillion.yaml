- id: claim-standard-equipment-bd642c54
  section: equipment
  axis: equipment
  text: '*Arcus Diabolus: Bolverk: Bolverk is the third Nox Nyctores, appeared as shapeshifting guns,
    starting from two handguns, to a multi-barrel machine called Fenrir, a shotgun called Freyja, a rifle
    called Thor and a machine gun called Sleipner. The main ability of Bolverk is creating blasts and
    shots that pierces through space, bypassing defenses and barriers. *Lux Sanctus: Murakumo: The tenth
    Nox Nyctores, it is the only Nox Nyctores capable of creating without the Black Beast as a core. It''s
    appeared as a giant sword but when activated, it turns into an armor and 8 swords surrounding the
    user. This weapon can only be wielded by Dimensional Boundary Contact Prime Fields. Murakumo''s abilities
    are versatile. It can connect to the Boundary in order to pull out limitless energy from the dimension,
    telekinetically move their swords, flight, summoning of swords and turrets, absorption that can work
    on illusions and even abstract entities, creating gravitational fields, teleportation even to other
    dimensions, firing energy, creating barriers, binding and knockout, distortion of space-time, analysis
    of certain lifeforms, clairvoyance to future, etc.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
