- id: claim-weaknesses-2b74fe82
  section: weaknesses
  axis: weakness
  text: "She is clumsy and somewhat emotionally fragile, and lacks self-esteem. Notable Attacks/Techniques:\
    \ *Phenomenon Intervention: Is an ability that is called \"The Power of the God\". It can change its\
    \ target's state from \"exist\" to \"not exist\" and vice versa. If it cannot be determined if the\
    \ target actually \"exists\" or not, it is almost impossible to perform a Phenomenon Intervention.\
    \ Since a sudden disappearance of the target would shock those surrounding it, their memories are\
    \ altered. Phenomenon Intervention also allows the user to erase one reality and overwrite it with\
    \ another (a different world that is a result of an existing possibility). In other words, it imposes\
    \ a result of a certain phenomenon from a parallel world into the current world. It changes a possibility\
    \ into reality. |-|As Noel= *Chain Revolver: Noel slides forward and fires her gun directly in front\
    \ of her. *Chain Quasar: An amp that increases her speed significantly. *Zero-Gun: Sleipnir: Noel\
    \ hits the opponent with the first blow of Bloom Trigger; upon connecting, she fires the missile from\
    \ her Zero Gun: Thor which carries them off horizontally forward upon connecting. She then finishes\
    \ them off with a powerful electric spear-head blast from Bolverk (formed into a giant railgun) which\
    \ upon hitting the missile carrying the opponent, shoots through both the missile and the opponent.\
    \ *Type XI: Optic Barrel: Sets a mark, which explodes soon after. Strength used determines placement\
    \ of mark. *Type XVII: Chamber Shot: Noel fires a shotgun directly at the front of an enemy, dealing\
    \ big damage. *Type XIII: Revolver Blast: Fires four shots while twirling in the air. *Type IX: Muzzle\
    \ Flitter: Flips forward and catches the opponent with her legs. She then slams them on the floor\
    \ by spinning her entire body. *Type II: Bloom Trigger: Jams the barrel of her gun forward followed\
    \ by large energy blast from gun. *Type III: Spring Raid: Noel performs powerful and fast flash kick.\
    \ *Type V: Assault Through: Spins forward very quickly so she can pass through the opponent, then\
    \ tackles with shoulder. *Type VI: Flash Hider: Noel fires her gun at the ground while the opponent\
    \ is on the floor, hitting them multiple times while having blank and merciless face. *Zero-Gun: Fenrir:\
    \ Jams the barrel of the gun forward and, sprays them with machine gun fire, then blows them away\
    \ with a charged shot from the Nemesis Stabilizer. *Bullet Storm \u21D2 Zero-Gun: Thor: Noel fires\
    \ a volley of bullets, followed by a missile that explodes upon contact. *Valkyrie Veil: Noel creates\
    \ a shield in front, blocking the next attack. If Noel is hit during this time, she instantly counters\
    \ the attack, followed by Noel firing a barrage of shots at the opponent. Energy grows in the background,\
    \ and then explodes, destroying the opponent. |-|As Mu-12= *Steins Gunner: Place an object in space\
    \ that will fire upon your opponents. Can charge power to unleash a more powerful attack. *Steins\
    \ Geyser: Steins on screen will fire at constant intervals, then only disappear after a period of\
    \ time. *Pillar of Light: Mu hits the opponent staggering them, she then summons her swords to spin\
    \ around the opponent, which then all hit the opponent creating a huge energy pillar. *Totsuka Blade:\
    \ Laser bounces to the oldest stein, then bounces in order up to the newest, then at the opponent.\
    \ *Arrows of Heaven: Fires a high-speed projectile from the steins. *Origins: Form a powerful barrier\
    \ and knock back an opponents who approach. *Sword of Decimation: Uses all of her swords to create\
    \ one big slash that can break through enemy's guard. *Tokotachi Blade: Steins Gunner will charge\
    \ at the opponent, and deal damage to any opponent it touches. *Ikutachi Blade: Mu does a forward\
    \ diagonal leap and slashes behind her with her eight blades. *Divine Wrath of the Heavens: The Steins\
    \ Gunner will explode, hitting opponents close enough to the blast. *Wisdom of the Divines: Bind your\
    \ opponent, immobilizing then completely, then call upon eight swords to strike them down at once.\
    \ *Blessed Mirror: A Distortion Drive that draws upon the power of the Ten Fists of Heaven. The attack\
    \ will be amplified depending on how many Steins have been placed. *Sword of the Godslayer: Mu hits\
    \ the opponent, creates eight enormous swords, then throws them at the opponent. *God Slaying Sword:\
    \ Mu hits the opponent, charges up an enormous sword, then slashes them with it. ==Gallery== {{Scroll\
    \ box|content= BlazBlue Central Fiction Noel Vermillion Crest.png|Emblem of Noel. BlazBlue Central\
    \ Fiction Mu-12 Crest.png|Emblem of Mu-12. CT_Noel_Vermillion.png|Noel's select portrait in Calamity\
    \ Trigger CS_Noel_Vermillion.png|Noel's select portrait in Continuum Shift CS_Mu-12.png|Mu-12's select\
    \ portrait in Continuum Shift CP_Mu-12.png|Mu-12's select portrait in Chronophantasma Noel_CP.png|Noel's\
    \ select portrait in Chronophantasma NOL_Noel_CPEX.png|NOL Noel's select portrait in Chronophantasma\
    \ Noel_BBTAG.png|Noel's select portrait in BlazBlue Cross Tag Battle Noel Verm"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
