- id: claim-weaknesses-ca50b8d6
  section: weaknesses
  axis: weakness
  text: "Can act rather dismissive, prideful, and/or apathetic; sometimes, though, this is just an act.\
    \ Hates her vampiric urges greatly, finding the act of drinking one's blood to be particularly distasteful.\
    \ Notable Attacks/Techniques: * Slave Red: A sorcery that completely dominates the will of another,\
    \ enslaving the victim to the caster's whims. Can only be cast on any given individual once in their\
    \ lifetime. * Drive: Slipheed: Rachel's drive, which gives her dominion over the wind. In-game, this\
    \ manifests as her ability to cause a gigantic gust of wind to blow in a single direction, carrying\
    \ herself, all opponents, airborne projectiles, and summons with it. She can activate this ability\
    \ with a thought, allowing her to throw gusts of wind without warning. * Tiny Lobelia: Throws a cannonball\
    \ herself, or transforms Nago into a cannon that fires a cannonball in an arc. Once this cannonball\
    \ hits the ground, or an opponent, it transforms into a lightning rod that stays in place. * George\
    \ XIII: Summons a large frog that follows the opponent around. If it gets close enough, it will emit\
    \ a small electrical field around itself that damages and briefly stuns enemies. Disappears after\
    \ hitting the opponent. It itself has limited durability. * Impish Gysophilia: Summons a pumpkin that\
    \ flies slowly through the air. Though normally otherwise inactive, if Slipheed is activated it will\
    \ grow, surround itself in a purple aura, and fly rapidly in the corresponding direction, inflicting\
    \ damage upon anyone it hits. Unlike George XIII, can remain in place indefinitely. * Sword Iris:\
    \ With a snap of her fingers, wave of her hand, or similar short motion, Rachel calls down a lightning\
    \ bolt upon each lightning rod she has created, hyper-charging them: this both amplifies the power\
    \ of the bolt if the enemy is near a lightning rod and destroys the rods themselves. * Beezle Lotus:\
    \ Rachel transmutes all of her deployed lightning rods into cartoon-like Lotus helicopter bats that\
    \ home in on the opponent. Fly for a longer period of time than Lotus Barrel. * Lotus Barrel: Similar\
    \ to Beezle Lotus, Rachel transmutes all of her deployed lightning rods into cartoon-like Lotus helicopter\
    \ bats, which home in on the opponent. These are a lighter pink, as opposed to Beezle Lotus's dark\
    \ pink bats. Lotus Barrel is superior to Beezle Lotus for zoning and controlling the battle. * Baden-Baden\
    \ Lily: Rising into the air, Rachel calls down a particularly powerful bolt of lightning upon both\
    \ herself, and upon all lightning rods in play in a manner similar to Sword Iris. * Tempest Dahlia:\
    \ Projects a powerful blast of wind forward, carrying a large number of debris and summons with it.\
    \ Automatically replenishes all missing Wind Charges upon use. She can increase this move's strength\
    \ depending on her Drive's current power, adding large frogs and pumpkins into the mix as a result.\
    \ * Clownish Calendula: After a short charge-up, calls down a beam of energy resembling moonlight\
    \ around her; if the enemy makes contact with this light, Rachel automatically transports them into\
    \ the Requiem. There, they are held in place as Rachel slowly rises into the air, gathering energy,\
    \ before finally performing a sweeping motion with her hands: this results in a massive beam of violet\
    \ lightning descending from the heavens accompanied by an explosion of lightning and rose petals.\
    \ ==Gallery== {{Scroll box|content= Rachel_Alucard_(Calamity_Trigger,_Character_Select_Artwork).png|Rachel's\
    \ select portrait in Calamity Trigger. Rachel_Alucard_(Continuum_Shift,_Character_Select_Artwork).png|Rachel's\
    \ select portrait in Continuum Shift. Rachel_Alucard_(Chronophantasma,_Character_Select_Artwork).png|Rachel's\
    \ select portrait in Chronophantasma. BlazBlue_Cross_Tag_Battle_Rachel_Alucard_Main.png|Rachel's select\
    \ portrait in Cross Tag Battle. Nago_(Story_mode_artwork,_normal).png|Nago, Rachel's shapeshifting\
    \ cat familiar. GiiBB.png|Gii, Rachel's other diminuitive bat familiar. Rachel_Alucard_(Emblem,_Crest)_(1).png|Emblem\
    \ of Rachel Alucard. 506px-BlazBlue Central Fiction Rachel Alucard Chibi.png|Rachel's chibi portrait\
    \ Queen of Roses (Rachel Alucard)|Queen of Rose, Rachel Alucard's theme. Queen of Rose II\u2014Blazblue\
    \ Chrono Phantasma|Queen of Rose II, the remix of Queen of Rose. Blazblue Calamity Trigger - White\
    \ Requiem|White Requiem, the theme playing during Ragna and Rachel's fights against one another. BlazBlue\
    \ Chrono Phantasma OST - White Requiem II|White Requiem II, the remix of White Requiem. }} ==Notable\
    \ Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters Category:BlazBlue\
    \ Category:Absorption Users Category:Acausal Characters Category:Air Users Category:Attack Reflection\
    \ Users Category:Aura Users Category:BFR Users Category:BlazBlue Cross Tag Battle Category:Blood Users\
    \ Category:Body Control Users Category:Body Puppetry Users Category:Causality Users Category:Clairvoyance\
    \ Users Category:Cloth Users Category:Concept Users Category:Creation Users Category:Darkness Users\
    \ C"
