  text: 'Superhuman Physical Characteristics, Self-Sustenance (Type 1; Can survive the Edge, which lacks
    any oxygen), Perception Manipulation (Can enhance his senses with magic, as it''s stated to do so
    in Phase Shift), Psychometry (All magic users are able to detect others with magic, as stated in Phase
    Shift), Regeneration (Mid-Godly; Stated that she keeps regenerating her existence, even if she doesn''t
    want to), Magic (Is stated to use magic in Phase Shift), Weapon Mastery, Immortality (Type 3, 4, 5,
    7, and 8; Hakumen stated that he and Rachel are neither alive nor dead, Is also life linked with Naoto,
    which means both her and Naoto must die at the same time for her to truely die), Acausality (Type
    1; Is unaffected by the effects from a Phenomena Intervention, which can reset an entire timeline),
    Energy Manipulation, Portal Creation, Summoning (Can summon different creatures to aid her in battle),
    Non-Physical Interaction (Can hit Arakune and Izanami), Telepathy (Communicated with Ragna and Kokonoe),
    Intangibility (Scales from Amane, who was able to phase through Valkenhayn''s strikes due to his nature
    as an Observer), Power Bestowal (Can bless others with the Tsukuyomi unit''s powers), Forcefield Creation
    and Attack Reflection (Can block and redirect attacks with the Tsukuyomi unit), Enhanced Senses (Can
    hear the sleep of other people while within her own dimension), Absorption (via Ivy Blossom), Invulnerability
    (Is a being that exist outside of Logic; the fundamental rules of the world; meaning any abilities/weapons/and
    powers that are restrained by Logic cannot harm them), Clairvoyance (Can see everything that happens),
    Pocket Reality Manipulation (Can make the imagined landscape), Shockwave Generation (Capable of blowing
    people away by bursting), Fear Aura and Necromancy (Other vampires, such as Fuzzy has fear aura and
    can raise the dead as ghouls), Body Control (Other vampire like Fuzzy can manipulate its own body
    parts), Teleportation, Electricity Manipulation, Weather Manipulation (Can cause spatiotemporal teleportation.
    Caused lightning strikes), Soul Manipulation, Healing and Regeneration Negation (up to High-Godly;
