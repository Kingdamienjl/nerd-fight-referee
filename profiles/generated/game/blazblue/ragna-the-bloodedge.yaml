      via death (As the Central Fiction, should Ragna die, all of existence would
      vanish by Amaterasu) | Small Country level+ normally (Traded blows with Take-Mikazuchi
      and a restricted Azrael), Large Planet level with the Azure Grimoire and the
      IDEA Engine, Low Complex Multiverse level via death | Large Planet level (Can
      keep up with Izanami and Nine), Low Complex Multiverse level via death | Large
      Planet level (The Black Beast is regarded as one of the most powerful beings
