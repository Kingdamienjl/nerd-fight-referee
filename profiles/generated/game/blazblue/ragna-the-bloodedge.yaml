      Multiverse level (Became a being that exceeds Amaterasu. The True Azure is acknowledged
      as the most powerful force in the series, with Amaterasu being inferior to it,
      the same god who's far beyond gods and beings who can control the Boundary,
      a realm that transcends the Blazblue Multiverse). Able to ignore conventional
      durability in variety of ways.
