    text: At least Large Town level+, likely Small Country level+ normally (Easily
      above the likes of Tager and Bang, the former can generate this much force of
      energy. Superior to Mai and Meifang, the latter of whom survived the destructive
      power of Take-Mikazuchi), Large Planet level with the Azure Grimoire and IDEA
