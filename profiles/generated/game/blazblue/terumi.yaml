power_scale:
  tier:
    text: '{{5-A}}, higher when hated/feared | At least {{5-A}}, higher when hated/feared.
      {{Low 1-C}} with Hax'
    source_ids: &id002
    - mediawiki-8252
    confidence: 0.95
  attack_potency:
    text: Large Planet level (Stronger than Ragna with the Azure Grimoire, fought
      The Black Beast alongside the other members of the Six Heroes, strangling it
      so hard that one of its heads popped out of its neck. Killed Nine by nice kick
      to the jaw. Also killed Tomonori who is comparable to Jubei, by piercing him
      with Ouroboros. Treated Valkenhayn like a dog, stomping his body multiple times
      while shouting him to play dead), possibly higher when feared/hated by large
      amounts of people (Stated that in the worlds he would have created, the fear/hate
      the people would have for him would make him grow stronger than even The Black
      Beast) | At least Large Planet level (Should be no weaker than a full-power
      Hakumen, managed to beat Ragna, Jin, Noel, Izayoi and Jubei at the same with
      no effort of which the first stated he was stronger than Azrael after only two
      strikes, Izanami stated that she would have difficulty atomizing the entire
      planet and the moon, Terumi is more powerful in this state, having access to
      the full power of the Susano'o unit), possibly higher when feared/hated by large
      amounts of people. Low Complex Multiverse level with Hax (Absorbed Noel, which
      in turn gives him access to the Power of the Eye, which is far beyond all the
      gods in Blazblue, who can warp/control the boundary, a realm that transcends
      the multiverse). Able to ignore conventional durability in a variety of ways.
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Infinite (Traversed through the boundary with ease, which is stated to be
      infinite in size) | Infinite (Should be as fast as he was before)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class T (Comparable to Ragna, who can push back Take-Mikazuchi) | Class
      T
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Large Planet level | Large Planet level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Large Planet level (Can withstand blows from Hakumen and bloodlusted Jubei)
      | Large Planet level (Can withstand blows from Black Beast Ragna). Regeneration,
      Abstract Existence, Non-corporeality and various degrees of Immortality make
      him extremely difficult to kill.
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Infinite (Due to being a soul) | Infinite (Susano'o Unit gives the user
      infinite stamina)
    source_ids: *id002
    confidence: 0.95
  range:
    text: 'Standard Melee Range normally. Unknown with his chain (Geminus Anguium:
      Ouroboros is stated as being on a chain of infinite length). Low Complex Multiversal
      with Teleportation (Can teleport to the deepest reaches of the boundary) | Extended
      Melee Range normally, likely at least Hundreds of Meters to several Kilometers
      with energy projection. Low Complex Multiversal with Hax'
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Supergenius (as he was able to foil a nigh-Omniscient supercomputer and
      is one of the brains behind the major events of virtually everything in the
      BlazBlue reality, such as having a hand informing both the NOL and Sector 7
      and playing both sides against each other, manipulating Trinity into freeing
      him from Nine's Mind Eater spell, and then killing them both, and being the
      one ultimately responsible for the Prime Field War, which allowed him to break
      free of the Susano'o Unit that at the time was binding him to the Master Unit,
      as well as being the one who invented the Azure grimoire.)
    source_ids: *id002
    confidence: 0.95
