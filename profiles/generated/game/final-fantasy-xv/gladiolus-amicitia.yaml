- id: claim-weaknesses-8aded065
  section: weaknesses
  axis: weakness
  text: 'Rather ineffective against flying opponents; needs to kill the opponent in
    order for the Force Stealer and Absorb Shield to work; can''t use his Shields''
    passive abilities; cannot regain Elemancy grenades on his own, as Noctis is the
    only one with the ability to make them. Notable Attacks/Techniques: *Rage Meter:
    Gladio''s strength increases the more he blocks attacks and takes damage. At it''s
    fullest effect, Gladio''s strength is quadrupled, and he can freely combine this
    with his Glaive Arts in order to utterly demolish his opponents. *Glaive Arts:
    As Gladio fights and fills his Valor Meter up, he gains the access to unique Glaive
    Arts; swordsmanship techniques said to have been passed down through the generations.
    Gladio can use the following Glaive Arts: **Earthshatter: Gladio slams his sword
    into the ground, creating a powerful shockwave that damages and pushes enemies
    away from him **Razor''s Edge: Gladio performs a wide and powerful slash, easily
    cleaving through his enemies **Tempest: Gladio swings his greatsword in a 360-degree
    spin, knocking the enemy off their balance and leaving them more susceptible to
    assault. **Maelstrom: Gladio delivers a slash before jumping and spinning in the
    air, smashing his sword downwards to deal massive damage **Dual Master: Gladio''s
    final Glaive Art, learned after defeating Gilgamesh. First, he brandishes both
    his signature greatsword as well as the Genji Blade, before attacking the foe
    with a wild flurry of slashes, dealing massive damage; especially when his Rage
    Meter is completely filled. *Dawnhammer: Gladio leaps into the air and cleaves
    his enemy in two with a single stroke, dealing far more damage than his regular
    attacks. *Cyclone: Gladio slams his shield into the ground, sending out a shockwave
    that throws all surrounding enemies into the air. *Impulse: After concentrating
    for a second, Gladio proceeds to swing his greatsword, creating a vacuum while
    causing a massive electrical shockwave in front of him, devastating all enemies
    in the vicinity. *Elemancy: Thanks to Noctis, Gladiolus can use elemental energies
    condensed into Magic Flasks in order to attack. Gladiolus can use the following
    Elemental Attacks: **Fire: A grenade infused with the fire element, which creates
    an explosion of flames. Fira and Firaga are stronger versions of this. **Blizzard:
    A grenade infused with the ice element, which causes a frost-filled explosion
    that freezes oponents. Blizzara and Blizzaga are stronger versions of this. **Thunder:
    A grenade infused with the lightning element, which unleashes a burst of electricity.
    Thundara and Thundaga are stronger versions of this. **Healcast: A special grenade
    that both casts either Fire, Blizzard, or Thunder, and fully heals Gladiolus when
    it detonates. **Venomcast: A grenade infused with an element and poison, both
    casting a certain elemental spell and inflicting any enemy hit by the spell with
    poison. **Cursecast: A grenade that both casts an elemental spell and lowers the
    enemy''s strength. **Freecast: A grenade that casts an elemental spell, and has
    a chance of not draining Gladiolus'' supply of elemental energy. **Failcast: A
    grenade that casts an elemental spell which either does much more damage than
    it usually would, or fails to cast at all. **Stopcast: A grenade that casts an
    elemental spell, and has a chance to freeze the target in time. **Blastcast: A
    grenade that casts an elemental spell that deals significant damage to both the
    target, and Gladiolus himself. **Killcast: A grenade that casts an elemental spell
    with a chance of instantly killing the target. **Expericast: A grenade that casts
    an elemental spell and may give Gladiolus an experience boost. **Maxicast: A grenade
    that casts the ultimate elemental spell, dealing much more damage than an ordinary
    spell would. Note: Gladiolus should be able to use Elemancy by himself due to
    it''s nature as a weapon. However, he has only shown to do so once, so it should
    be noted whether he''s allowed to use it in threads by the one who made it. ==Notable
    Matchups== Victories: Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}}
