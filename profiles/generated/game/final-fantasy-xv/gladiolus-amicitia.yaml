- id: claim-standard-equipment-7fab94d4
  section: equipment
  axis: equipment
  text: 'Greatswords: Gladio''s primary weapon of choice; having trained many years
    and having fought a great variety of foes, thus mastering its style of inflicting
    slow yet powerful blows in the process. Due to the Greatswords'' great weight
    and Gladio''s physical strength, he has no problems with breaking an enemy''s
    guard or cutting off enemy apendages. Gladio can use the following greatswords:
    *Two-Handed Sword: A greatsword forged to fight many foes at once, it inflicts
    15% more damage with each additional enemy within a 65 feet radius (can be stacked
    up to +100% damage). *War Sword: A greatsword forged with even more heft as to
    deprive foes of their defence, it reduces the target''s vitality when struck.
    *Blade of Brennaere: A greatsword who''s core is filled with flames, it inflicts
    greater damage to those vulnerable to fire, and boosts Gladio''s resistance to
    fire-elemental damage when in hand. *Thunderbolt: A greatsword crackling with
    electricity, it shocks the target when struck, and increases Gladio''s resistance
    to lightning-elemental damage when in hand. *Claymore: A greatsword with ore that
    increases Gladio''s vitality forged into the blade, allowing him to take more
    damage and continue fighting. *Force Stealer: A greatsword crafted with Insomnian
    technology, it absorbs the elemental powers of the foes Gladio defeats. *Hardedge:
    A greatsword forged with an edge that cuts with the precision of a scalpel, it
    makes cutting off appendages even easier. *Duel Code: A greatsword designed for
    single combat, it deals greater damage to lone enemies within a 65 feet radius.
    *Hyperion: A greatsword which, like the Two-Handed Sword, is forged to battle
    many foes at once, it inflicts 15% more damage with each additional foe within
    a 65 feet radius, with a maximum power boost of 100%. In addition, it inflicts
    far more damage compared to the Two-Handed Sword, essentially rendering the latter
    useless. *Afrosword: A greatsword with a design based on a turntable (and likely
    inspired by Afrojack), it greatly increases Gladio''s health and resistance to
    magic, making him "Unstoppable". *Iron Duke: A crude but robust greatsword, it
    dispenses with enchantments, as it is designed with simple devastation in mind.
    *Dominator: A greatsword infused with holy light, it deals far greater damage
    against Daemons and the like, whom fear all that is sacred. *Apocalypse: A greatsword
    designed to safeguard Gladio by becoming deadlier as his health wanes. *Masamune:
    A sword said to have come from a faraway land, it can occasionally deal critical
    blows to an uninjured foe. *Genji Blade: A sword that used to belong to Cor Leonis,
    before being taken by Gilgamesh, and finally ending up in Gladio''s possession
    after defeating the latter; this glaive ends a flurry of attacks with a deadly
    coup de grâce. Shields: Gladio''s secondary "weapon" of choice, it primarily functions
    as a means to protect Gladio from all kinds of damage and raises his vitality,
    but it can also function as a makeshift knuckle by punching the ground, creating
    a small shockwave that throws enemies off balance. Gladio can use the following
    shields: *Kite Shield: A common and easy-to-use shield, it restores a small bit
    of the wielder''s health when phasing through enemy attacks; though Gladio cannot
    use this ability due to lacking the ability to Blink, basically rendering the
    Kite Shield useless. *Absorb Shield: A shield which, as the name implies, absorbs
    the elemental powers of defeated foes courtesy of the Insomnian technology it
    was crafted with. *Flame Shield: A shield that boosts Gladio''s resistance to
    fire (especially when raised), and increases his strength for 5 seconds after
    being hit with a fire-elemental attack. *Ice Shield: A shield that increases Gladio''s
    resistance towards ice (especially when raised), and amplifies his health recovery
    rate when hit with an ice-elemental attack. *Thunder Shield: A shield that bolsters
    Gladio''s resistance towards electricity, and increases his odds of landing critical
    blows when hit by a lightning-elemental attack. *Hero''s Shield: A shield that''s
    especially effective against wielders of firearms, as it bolsters Gladio''s defence
    against damage dealt by guns. *Black Prince: A shield that boosts Gladio''s resistance
    towards darkness (especially when raised), and boosts his magic reserves when
    hit with a dark-elemental attack. *Power Shield: A shield forged with elements
    that increase Gladio''s strength and protection, it greatly bolsters his power
    and vitality when in hand. *Wizard Shield: A shield forged with elements that
    enhance the strength of Gladio''s magic, it greatly enhances the power of his
    magic spells when in hand. *Aegis Shield: A shield said to have been forged by
    the Gods themselves, it has a 10% chance of completely blocking an attack. *Medjay
    Assassin''s Shield: A shield that once belonged to a legendary assassin of the
    sands, it significantly increases Gladio''s strength after he blocks an attack
    at the very last second. *Ziedrich'
