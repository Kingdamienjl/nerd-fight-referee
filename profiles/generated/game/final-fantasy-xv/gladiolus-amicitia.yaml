  intelligence:
    text: As a member of the Crownsguard, Gladio has been training for nearly a decade
      to protect the Lucian royalty, mastering the usage of a greatsword that delivers
      slow but powerful blows. In addition, he is skilled in the use of a shield,
      protecting himself and his allies from harm at a moment's notice and even using
      it offensively. He is also in perfect sync with his teammates, protecting them
      when needed and utilizing combination attacks while only communicating with
      a few words. In addition, Gladio has undertook the Trials of Gilgamesh, and
      was even one of the two to survive it (the other being Cor Leonis; who was renowned
      as the best warrior in all of Lucis), and the first to beat it, albeit after
      obtaining the blessings and power of many late warriors. And as of the 10-year-long
      timeskip, Gladio has amassed over 10 years of additional combat experience,
      having spent his time fighting Daemons and other creatures by himself, and has
      even held his own against The Fierce; a former King of Lucis who was hailed
      as a fearsome warrior in his time.
    source_ids: *id002
    confidence: 0.95
