  intelligence:
    text: Despite being the weakest and least experienced party member in the game, Prompto is an exceedingly
      capable marksman, being able to keep up with Noctis, Gladiolus and Ignis despite having only received
      basic training from veteran Crownsguard members. In addition, Prompto is capable of keeping up with
      his teammates in training and even the likes of Aranea Highwind; a seasoned Mercenary who quickly
      rose through the ranks of the Niflheim Empire with her fighting prowess while airborne, as well
      as the Rogue; a former Queen of Lucis and expert of long-ranged, stealth-based combat, whilst they
      were soaring through the air and hiding in the shadows (Thus, at their best) respectively, whilst
      taking pictures mid-fight.
    source_ids: *id002
    confidence: 0.95
