- id: claim-weaknesses-7a2d26bc
  section: weaknesses
  axis: weakness
  text: "As mentioned above, Prompto has a very limited amount of actual combat experience bar the crash-course\
    \ training he received from veteran combatants and his travels with the party; however, this shouldn\u2019\
    t really come up as he\u2019s kept up with people that do have considerable amounts of combat experience.\
    \ In order for the Valiant to work, Prompto needs to kill the target with it, and in order to perform\
    \ certain techniques, Prompto\u2019s health needs to be either high or low. Prompto cannot regain\
    \ Elemancy by himself, as Noctis is the only one with the explicit ability to craft them. Notable\
    \ Attacks/Techniques: *Crackshot: When the enemy is vulnerable, Prompto can fire a devastating Crackshot\
    \ to finish the enemy off, striking a random pose before shooting the target with an extra-powerful\
    \ shot. *Techniques: **Piercer: Prompto fires a single shot at the enemy, partially bypassing their\
    \ defense and reducing it overall. **Recoil: Prompto overloads one of his machines at the enemy, dealing\
    \ heavy damage. **Starshell: Prompto fires an orb of light into the sky, illuminating the surrounding\
    \ area, weakening Daemons and making stealth much more difficult. **Gravisphere: Prompto creates a\
    \ pseudo-singularity that pulls enemies towards it while gradually damaging them. **Trigger-Happy:\
    \ Prompto pulls out twin pistols and hits the enemy with a barrage of shots. *Teamwork skil"
  source_ids: *id003
  decisive: false
  status: unverified
