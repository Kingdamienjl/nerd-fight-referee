- id: claim-powers-and-abilities-0f7e635d
  section: abilities
  axis: hax
  text: 'Base=Superhuman Physical Characteristics, Extrasensory Perception (Mages have shown to naturally
    possess thisFinal Fantasy IV: The After Years), Magic, Subjective Reality (Magic,Final Fantasy IV
    Novel 1, chapter 1, page 29 in its basest form,Final Fantasy IV Novel 1, chapter 3, page 107 is projecting
    one''s innerFinal Fantasy IV: The After Years Novel, chapter 2, page 109 mind onto realityFinal Fantasy
    IV: The After Years, and is powered by intelligence and mental strength), Non-Physical Interaction
    (Magic as a whole is shown to affect a wide variety of different beings, from intangible/immaterial
    beings to non corporeal beings, to abstract concepts like Chronodia, who''s the flow of time itselfFinal
    Fantasy I, to Nonexistent beings like Exdeath and Cloud of Darkness), Law Manipulation (Magic is stated
    to rewrite the natural order of thingsFinal Fantasy IV Novel 1, chapter 5, page 198), Limited Durability
    Negation, Forcefield Negation, and Intangibility (Magic negates conventional physical durability,
    barriers, and armor, requiring specific defense against magic which is powered by the Mind and Spirit),
    Power Modification (Including Duplication, Fusionism, Statistics Amplification, Size Manipulation,
    Homing Attack, Danmaku, Aura, Breath Attack, and Energy Manipulation; Magic users across the games
    have consistently shown the ability to manipulate the shape and properties of their own magical abilities,
    with even higher tiers of spells simply being considered stronger versions of the same basic abilityFinal
    Fantasy IV: The After Years Novel, chapter 2 page 114), Conceptual Manipulation (Type 2) and Space-Time
    Manipulation (Magic is shown in the novels to remove concepts and warp space and time itself, like
    the Devil''s road, which the concept of time was lost,Final Fantasy IV Novel 1, chapter 5, page 199
    and time and space were twisted to the pointFinal Fantasy IV: The After Years Novel, chapter 1, page
    67 the past, present and futureFinal Fantasy IV: The After Years Novel, chapter 1, page 73 existed
    as oneFinal Fantasy IV: The After Years Novel, chapter 3, page 147), Light Manipulation, Holy Manipulation,
    Telepathy (Can communicate with Astrals and the spirits of the dead Kings of the Lucis), Dream Manipulation
    (Can communicate with the Astrals via her dreams), Healing and Regeneration (Low-Mid, could have heal
    the deadly wound inflicted by Ardyn had she not decided to give her power to Noctis), Summoning (Can
    awake the Astrals and summoned them to help Noctis and his friends in Insomnia), Weapon Mastery Resistance
    to Conceptual Manipulation (Type 2), and Space-Time Manipulation (Characters are capable of surviving
    and resisting magical abilities, Which is shown to project one''s inner mind onto reality, and as
    shown with the creation of the Devil''s road, remove entire concepts and warp space and time to where
    the past, present, and future exists as one), Law Manipulation (Resists magic, which can rewrite the
    natural order of things) |-|Dawn of the Future=Same as before plus Absorption (Received the same ability
    to absorb daemons in her body Ardyn possesses from Bahamut), Darkness Manipulation (Can channel Darkness
    and became able to use them), Statistics Amplification (Grows stronger each time she absorbs daemons)'
