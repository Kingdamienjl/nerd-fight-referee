power_scale:
  tier:
    text: '{{2-A}}, higher with Arminger Arsenal | {{2-A}} | At least {{2-A}}'
    source_ids: &id002
    - mediawiki-567183
    confidence: 0.95
  attack_potency:
    text: Multiverse level+, higher with Arminger Arsenal (Comparable to post-timeskip
      Noctis, wields the same Armiger Arsenal used by his descendants. Fought and
      defeated King Regis in his prime) | Multiverse level+ (Far stronger than before
      in Dawn of the Future, had the power of the past Kings and fought Bahamut in
      the Beyond) | Multiverse level+ (Is able to keep up with the other Warriors
      of Spiritus and draws power from the gods of the cycle. Participated in the
      defeat of Shinryu) far higher with the Crystal Core of Darkness (Was in control
      of the crystal core of darkness which was stated to be Superior to the voidDissidia
      Final Fantasy Opera Omnia and was going to use its power to destroy the multiverse)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively FTL+ (Capable of keeping up with Post-Timeskip Noctis), higher
      with Warp Strike (Can also use the Warp Strike) | Massively FTL+ (far faster
      than before, should be comparable to King of Light Noctis) | Massively FTL+
      (Should be comparable to the other Warriors of Spiritus) far higher with the
      Crystal Core
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class T (Comparable to Noctis) | Immeasurable (Is superior to Neo Exdeath
      and Enuo) far higher with the Crystal Core (Effortlessly overpowered Noctis
      in a Warp-Strike Clash)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: All previous abilities greatly enhanced, the abilities of the crystals (The
      Crystal Core contains the powers of Neo Exdeath and God of Magic KefkaDissidia
      Final Fantasy Opera Omnia), Reality Warping (The crystal can rewrite the worldDissidia
      Final Fantasy Opera Omnia) Corruption and Body Puppetry (Ardyn was able to corrupt
      Caius Ballad and Ultimecia and control their bodies Seymour implies that the
      wielder of the Crystal could directly control the warriors of spiritus and drive
      them to rampage.Dissidia Final Fantasy Opera Omnia), Law Manipulation (The Crystal
      Core maintains the laws of the Land of RespiteDissidia Final Fantasy Opera Omnia),
      Sealing and Power Absorption (The Crystal Core was capable of sealing the transformations
      of the Warriors of Spiritus inside itself and can control them, which includes
      Hell Emperor, Neo Exdeath, God of Magic Kefka, Safer Sephiroth, Chaos Bahamut,
      Griever Ultimecia, Sin & Braska's Final Aeon, Seymour Omnis, The Undying, and
      IncognitusDissidia Final Fantasy Opera Omnia), Clairvoyance (Ardyn was capable
      of using the crystal core to see what's happening in the other worldsDissidia
      Final Fantasy Opera Omnia), Immortality (Types 2 and 8, Ardyn was able to prevent
      all warriors deaths no matter how injured they were via the crystalDissidia
      Final Fantasy Opera Omnia)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multiverse level+, higher with Arminger Arsenal (Tanked attacks from Noctis,
      survived a full power blast from Noctis' Armiger Arsenal, only finally going
      down after being struck by all 13 of his Royal Arms in succession after the
      fact) | Multiverse level+ | Multiverse level+ far higher with the Crystal Core
      (Completely stalemated the Dissidia cast)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range with various weapons; Hundreds of Meters with magic;
      Tens of Kilometers with warping and Armiger Arsenal | Multiversal+ higher with
      the Crystal Core
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted, Despite his frivolous and lighthearted exterior, Ardyn is wickedly
      intelligent. Being the Chancellor of Niflheim, Ardyn is incredibly skilled in
      the arts of negotiation and deception, effectively ruling the empire despite
      his lack of royal title, convincing Lucis to sign a false peace treaty with
      Niflheim, and tricking the entire party into believing that he was simply an
      ordinary traveler, never realizing his true identity until Ardyn told them himself.
      He also invented the process for converting humans into completely inorganic
      Magitek Infantry, a deed that fueled his rise to his position as Chancellor
      and paved the way for the rest of his plans. In combat, Ardyn fights almost
      identically to his descendant, Noctis, summoning a wide variety of different
      weapons in battle and swapping between them on a whim. To this end, his long
      life has granted him thousands of years of experience dealing with Daemons and
      any other enemies in his path, allowing him to evenly duel Noctis despite the
      latter’s awakening as the King of Light.
    source_ids: *id002
    confidence: 0.95
