- id: claim-standard-equipment-6dbbae56
  section: equipment
  axis: equipment
  text: 'Daggers are Ignis'' primary weapons of choice, which he has trained to wield since he was 16
    years old. Due to the daggers'' great versatility, Ignis is able to fight at both close and long ranges,
    being able to wield them in both normal and reverse-grip, as well as throwing or even kicking them
    at the opponent. In addition, most of them (with the Spelldaggers being the only exception) enhance
    Ignis'' magic reserves and the strength of his magical attacks when summoned. Ignis can wield the
    following daggers: *Avengers: Daggers designed to unleash the fullest extent of their power in times
    of peril, they increasingly deal more damage the more damage Ignis takes. *Cutlasses: Daggers designed
    for agile and cunning combatants, they sap away at the foes'' strength with each strike. *Mythril
    Knives: Daggers that, as the name implies, have blades forged with Mythril, and enhance Ignis'' magical
    power as a result. *Plunderers: Daggers crafted with Insomnian technology, they are capable of absorbing
    the elemental powers of defeated foes. *Assassin''s Daggers: Daggers that were favored by assassins
    (as the name implies), they are infused with venom, giving them a small chance to poison the target
    with each strike. *Delta Daggers: Short but deadly daggers that were designed to inflict gaping wounds.
    As such, they reduce the defence of the opponent with each strike. *Main Gauches: Well-balanced and
    lively daggers that were designed to inflict extra harm on foes in vulnerable positions. *Orichalcum:
    Daggers whose blades are infused with holy light, they inflict greater damage against Daemons and
    all beings vulnerable to sacred energies. *Ulric''s Kukris: Blades formerly used by Nyx Ulric, a hero
    who sought to protect his homeland by joining the Crownsguard. As such, they are also one of Ignis''
    strongest daggers, given that they amplify most of his attributes. These attributes include, but aren''t
    limited to; his health, magic reserves, physical and magical strength, vitality, and resistance towards
    ballistic damage as well as fire, ice, lightning, and darkness-based magic. *Organyx: Daggers that
    were designed as the ultimate pair of blades, they provide enhancements to most of Ignis'' attributes.
    Unlike the Ulric''s Kukris, however, they do not amplify the same amount of attributes (such as his
    health and strength) and provide lesser boosts to his stats. However, they also provide greater resistance
    towards elemental magic and deal more damage as compensation. *Vigilantes: Daggers who''s cores are
    forged with a special alloy, they possess a small chance to freeze the target in time with each strike.
    *Zwill Crossblades: Blades forged for agile combatants that know how to avoid blows, they inflict
    greater damage when Ignis is at full health. *Mage Mashers: The signature daggers of a previous Final
    Fantasy protagonist, they are outfitted with protective gems that increase Ignis'' resistance towards
    fire, ice and lightning-based magic. *Spelldaggers: Ignis'' signature daggers and the ones he exclusively
    wield while controlled by the player. These daggers are imbued with elemental properties, giving him
    the ability to Flamebind, Stormbind or Frostbind them for a variety of purposes, ranging from dealing
    greater damage against specific targets, to exploiting any elemental weaknesses the enemy may possess.
    Polearms are Ignis'' secondary weapons of choice. Complementing his daggers, which specialize in fast
    and constant damage, Ignis can inflict precise and focused damage from both mid- and long-range with
    polearms, granting him even more versatility than he already has. Unlike his daggers, who each provide
    a boost to Ignis'' magic resistance and strength of his magical attacks, each polearm provides a boost
    for different stats, be it magic resistance, elemental damage, or the odds of dealing critical blows.
    *Javelin: A polearm designed to unleash the fullest extent of its power in times of peril, they can
    deliver critical strikes against the foe when Ignis'' health is low. *Drain Lance: Ignis'' signature
    polearm. Due to being crafted with Insomnian technology, it absorbs the elemental powers of defeated
    foes when in hand. *Mythril Lance: A polearm which, as the name implies, is forged with mythril. As
    such, they enhance the power of Ignis'' magical attacks. *Rapier Lance: A polearm that pierces with
    the precision of a needle. Because of this, Ignis can break off appendages with greater ease than
    usual. *Storm Lance: A polearm with electricity crackling in its blade; it deals greater damage against
    foes vulnerable to lightning because of this feature. *Ice Spear: A polearm with ice embedded in its
    blade; due to this, it deals more damage against foes vulnerable to ice. *Wyvern Lance: A polearm
    said to have been favored by Dragoons, it inflicts far greater damage in midair. *Radiant Lance: A
    polearm infused with holy light. Due to this trait, it inflicts far greater damage against Daemons
    and the like, who are vulnerable to everything sacred. *Dr'
