- id: claim-weaknesses-7ff2e639
  section: weaknesses
  axis: weakness
  text: 'Despite his usually calm and collected demeanor, Ignis can be rather hot-blooded when Noctis''
    life is in danger, to the point he''d gladly sacrifice anything to ensure the latter''s safety. Some
    of his weapons'' passive abilities require him to defeat his foe, be at full or low health. In addition,
    some of his Techniques are support-based, and essentially useless without his teammates. | As of the
    events that happened in Altissia, Ignis has lost his eyesight, though this doesn''t seem to be much
    of an issue since the 10-year timeskip; having spent his time honing his other senses, and even hunting
    Daemons by himself on the regular. | Doesn''t normally have the Ring in his possession, and even if
    he does, using its full power forces him to sacrifice his life afterwards as a prerequisite. Notable
    Attacks/Techniques: *Techniques: Ignis, being the most support-based party member, has several Techniques
    that can vary from strategic offensives to issuing support, including healing and granting status
    buffs. **Mark is Ignis'' default Technique, where he tosses daggers at all enemies on the field. Upon
    finishing, Noctis will automatically rush in and warp-strike to all daggers that were thrown and had
    landed. **Enchantment calls for Ignis to pull out a Magic Flask and imbue Noctis''s weapons with Flameboost,
    Frostboost, or Stormboost, depending on the target. However, Ignis can''t imbue Noctis''s weapon with
    Darkness or Light. **Regroup has Ignis signal an urgent command to fall back and band together, summoning
    the party to his call. Along with healing their HP based on a percentage, Regroup heals an ally in
    Danger state, boosts HP recovery and critical hits, and allows for the party to regain composure,
    from keeping allies close again for link-strikes and Techniques, to allowing the party to recalculate
    their tactics on the field. **Overwhelm has Ignis commence a full on assault with the party. It is
    one of Ignis''s more powerful but studious Techniques to master; it focuses the party on one enemy
    at a time, where Noctis retains normal attacks while allies attack with Deathblows, with the party
    invincible for the duration of the onslaught. Depending on Ignis''s position as well with the enemy''s,
    the Technique can end up overwhelming a target with a constant stream of blows, or end up a sloppy
    with inconsistent and missed attacks, demanding a great degree of patience and setting up to ensure
    its full potential. **Sagefire allows Ignis to enchant his daggers with Fire-Elemental Magic before
    attacking the enemy. Depending on the distance and whether he makes it to the target, Sagefire will
    have the attack consume the opponent in an explosion should it land, or will have Ignis cast off the
    flame into a giant stationary pyre should he miss. *Teamwork skil'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
