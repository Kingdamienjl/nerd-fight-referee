    Air Manipulation (With Frostbind), Absorption (With the Plunderers, Drain Lance and Lancet Technique),
    Statistics Amplification (With the Spelldaggers, Avengers, Organyx, Mage Mashers, Mythril Knives,
    Javelin, Mythril Lance, Dragoon Lance, and the Flamebind, Stormbind, Frostbind and Overclock Techniques),
    Statistics Reduction (With the Delta Daggers, Cutlasses and Cursecast), Holy Manipulation (With the
    Orichalcum Daggers and Radiant Lance), Poison Manipulation (With Venom Fang, Venomcast and the Assassin''s
    Daggers), Death Manipulation (With Killcast), Curse Manipulation (With Cursecast), Time Stop (With
    the Vigilantes and Stopcast), Healing (With Healcast and Regenerate), Information Analysis (With Analyze),
    Regeneration (Mid-Low), Skilled Cook (Can boost the stats of those that eat his meals), Resistance
    towards Elemental Magic (Of the Fire, Ice, Lightning and Darkness varieties), Pain Manipulation (Is
    able to resist the Lightning spells, which are capable of attacking the nervesFinal Fantasy IV Volume
    2 Novel, chapter 7, page 54), Poison Manipulation, Mind Manipulation, Time Manipulation, Death Manipulation,
    Petrification, Transmutation, Absolute Zero (Can survive Shiva''s ice attacks, including Diamond Dust),
