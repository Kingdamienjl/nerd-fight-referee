    text: 'right|250px {{Quote|I was just a rookie cop late as hell on his first day.
      That''s why I''m still alive.|Leon recalling the events of Raccoon City to Jason}}
      }} |-|2010 onwards ▾= {{#tag:tabber| {{!}}-{{!}}Damnation=right|250px {{Quote|I''m
      not a CIA agent. I''m just a regular American who was screwed out of his vacation,
      dumped on a plane, and brought to this place without any breakfast.|Leon responding
      to Buddy }} {{!}}-{{!}}Resident Evil 6=right|180px {{Quote|And I lost over seventy-thousand
      people, including the President, because of Simmons!|Leon responding to Chris
      Redfield}} {{!}}-{{!}}Vendetta=right|250px {{Quote|When I was a kid, I used
      to think about what kind of man I''d grow up to be. I never thought my life
      would turn out this way.|Leon in Resident Evil Vendetta}} {{!}}-{{!}}Death Island=right|250px
      {{Quote|Well, if it isn''t... Whoever you are.|Leon responding to Dylan Blake''s
      introduction}} {{!}}-{{!}}Resident Evil Requiem=right|250px {{Quote|Well, that’s
      my cardio for the week.|Leon after defeating a wave of zombies that cornered
      him in an office room}} }} ==Summary== Leon Scott Kennedy is one of the main
      characters in the Resident Evil horror media franchise by Capcom. He debuted
      as one of the two playable protagonists of the video game Resident Evil 2. Leon
      later returned as the main character of Resident Evil 4 and as one of the protagonists
      in Resident Evil Darkside Chronicles and Resident Evil 6. During the events
      of Resident Evil 2, Leon is a rookie police officer who arrives in the doomed
      Raccoon City on his first day on the job, only to confront the T-Virus outbreak
      first-hand. He teams up with civilian survivor Chris''s sister Claire Redfield,
      rescues the young Sherry Birkin, and worked together with the mysterious Ada
      Wong. Four years later, in Darkside Chronicles, Leon, a trained agent was sent
      to South America with the assistance of Jack Krauser to take down the Drug Lord,
      Javier Hidalgo. Two years later, in Resident Evil 4, Leon is assigned to rescue
      the president''s daughter from a sinister cult, Los Illuminados. In Resident
      Evil 6, he continues to work for the U.S. government. He survived the C-Virus
      outbreak in Tall Oaks along with agent Helena Harper. He was framed for the
      murder of the president. He travelled to China to put a stop to the mastermind''s
      scheme and clear his name. He eventually reunites with Ada and a grown-up Sherry.
      Leon has a leading role in the CG Animated Resident Evil Media such as Resident
      Evil: Degeneration, Resident Evil: Damnation, Resident Evil Infinite Darkness,
      Resident Evil: Vendetta, and Resident Evil Death Island in which he is a special
      agent for the government. ==Powers and Stats'
