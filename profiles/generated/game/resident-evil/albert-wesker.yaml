- id: claim-weaknesses-543d747f
  section: weaknesses
  axis: weakness
  text: 'Needs to maintain a constant dose of a special serum to keep his Progenitor
    virus (that gives him his superhuman powers) stable; however, overdosing on the
    serum causes him to show symptoms of poisoning. Extremely arrogant to the point
    of a god complex. With Uroboros, his weak point is located on the heart in his
    chest. ==Gallery== File:Code Veronica_Wesker.png|Albert Wesker in Resident Evil
    Code: Veronica File:The Mercenaries - Wesker - Resident Evil 4 Music Extended
    File:Resident Evil 5 - Winds Of Madness (Extended & Looped) ==Notable Matchups==
    Victories: Homelander (Dynamite Entertainment) Homelander''s Profile (Speed was
    equalized and Uroboros Wesker used. 8-B Homelander were used. Homelander had prior
    knowledge and was bloodlusted. They started 6 meters apart, in Raccoon Police
    Station.) Luke Skywalker (Canon) (Star Wars) Luke Skywalker''s Profile (Post A
    New Hope - Star Wars (Marvel 2015) comics Luke was used and speed was equalized)
    The Joker (DCAU) The Joker''s Profile (Speed was equalized. Post Virus Wesker
    and Normal Joker was used) Yokai (Big Hero 6) Yokai''s Profile (9-A versions used
    and speed was equalized) Losses: Zhu Yuan (Zenless Zone Zero) Zhu Yuan''s Profile
    (The fight took place in Raccoon City Police Station (Requiem). Post-Virus Wesker
    is used; he has access to the environment''s BOWs. Zhu Yuan has prior knowledge
    of AP/Durability and Speed. Unequal Speed ​​and SBA are used) Ruby Rose (RWBY)
    Ruby''s Profile (Beacon Arc Ruby and Uroboros Wesker used, speed was equalized,
    and starting distance was 10 meters) Green Goblin (Marvel Comics) Goblin''s Profile
    (Speed was equalized, starting distance was 50 meters, Base Green Goblin and Post-Uroboros
    Wesker used) Yor Forger (Spy × Family) Yor''s Profile (Pre-Virus Wesker used,
    speed was equalized, Wesker had a month of preparation time, and starting distance
    was 10 meters) Raiden (Metal Gear) Raiden''s Profile (MGS2 Raiden and Post-Virus
