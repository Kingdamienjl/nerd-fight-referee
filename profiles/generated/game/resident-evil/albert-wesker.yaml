  intelligence:
    text: Extraordinary Genius (At a very young age Albert was subjected to training
      and experimentation by Oswell E. Spencer, inducted into a specialized project
      called 'Project Wesker'. Only Albert and Alex are the only surviving candidates,
      with Albert only being the successful subject. By the time of his adult life,
      Wesker is an accomplished virologist and bioengineer,Biohazard Kaitai Shinsho-
      Page 17 was a former army engineer officer,Biohazard Perfect Capture Guide and
      worked as a chief researcher of Umbrella's virus development department.Biohazard
      5 Kaitai Shinsho- Page 14 Alongside William Birkin, and Umbrella's other top
      scientists, they created the T-VirusWesker Report 1 and created powerful B.O.Ws
      from it; notable ones being the Tyrants. Later on in life, Wesker created the
      Uroboros virus; a virus that brings out a human's hidden potential if they had
      the genetics for it.Resident Evil 5 Albert Wesker is a master manipulator and
      deceiver, always cunning and always scheming to gain more power and become a
      god.)
