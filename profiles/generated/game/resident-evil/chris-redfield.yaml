- id: claim-powers-and-abilities-44a1bfad
  section: abilities
  axis: hax
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|1998 to 2003={{Border|Scroll=Yes|Visible=No|Content=
    *Superhuman Physical Characteristics *Martial Arts, Weapon Mastery and Vehicular Mastery (Trained
    and served in the U.S Air Force) *Acrobatics (Able to perform a backflip to avoid moving lasers) *Explosion
    Manipulation (Via Grenade Rounds and Rocket Launcher) *Acid Manipulation (Via Acid Rounds) *Fire Manipulation
    (Via Flame Rounds) *Poison Manipulation (Via Gas Rounds) *Light Manipulation (Via Flash Grenades)
    *Healing (Green Herbs and First Aid Spray are able to heal, Green Herbs mixed with Red Herbs boosts
    the healing effects) *Damage Reduction & Resistance to Disease Manipulation & Poison Manipulation
    (Blue Herbs are able to eliminate poisons and diseases, mixing it with Green and Red Herbs boosts
    the effect) }} |-|Post 2005={{Border|Scroll=Yes|Visible=No|Content= *Superhuman Physical Characteristics
    *Martial Arts, Weapon Mastery and Vehicular Mastery *Social Influencing (Leadership: Captain of the
    B.S.A.A and the Hound Wolf Squad, able to coordinate his teammates in order to win and survive encounters
    against B.O.Ws) *Analytical Prediction (After years of fighting bioterrorism, Chris has developed
    heightened senses that alerts him of danger) *Explosion Manipulation (Via Hand Grenade, Explosive
    Rounds, Remote Bomb and Rocket Launcher) *Fire Manipulation (Via Incendiary Grenade and Flame Rounds)
    *Light Manipulation (Via Flash Grenade and Flash Rounds) *Acid Manipulation (Via Acid Rounds) *Electricity
    Manipulation (Via Electric Rounds, Shock Grenade and Stun Rod) *Ice Manipulation (Via Nitrogen Rounds)
    *Paralysis Inducement (Via Pulse Grenade) *Sound Manipulation (Via B.O.W Decoy) *Damage Reduction
    (Via Melee Vest and Bullet-proof Vest) *Durability Negation (Magnums are able to pierce through armour)
    *Danmaku (Via Gatling Gun) *Limited Power Nullification (Via RAMROD ammo, they are able to inhibit
    a B.O.W''s regeneration capabilities) *Healing (Via Green Herbs and First Aid Spray, Red Herbs being
    able to boost the healing effects of Green Herbs, and Med Injector) *Resistance to Disease Manipulation
    & Poison Manipulation (Able to remain unaffected by the effects of Uroboros when physically holding
    Wesker back)}} }}'
