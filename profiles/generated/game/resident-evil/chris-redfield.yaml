- id: claim-weaknesses-83b3d4cb
  section: weaknesses
  axis: weakness
  text: 'Chris'' headstrong mentality for justice usually gets him in trouble (That was the reason why
    he was discharged from the U.S Air Force) and worries for his younger sister, Claire Redfield. Over
    the years of fighting bioterrorism, after losing many friends and comrades, Chris has become troubled
    to a point where he comes off as antagonisticResident Evil: Village. ==Notable Matchups== Victories:
    Losses: Master Chief (Halo) Master Chief''s profile (Speed was equalized, both were 9-A) Inconclusive:
