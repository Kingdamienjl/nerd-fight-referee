- id: claim-weaknesses-2de5baef
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks and Techniques: *Frenzy: A status effect that is the result of a
    target being forced to process information incomprehensible to humans, such as information about the
    Great Ones, Eldritch Truth, or Cosmos. This effect is a twofold form of damage, as when this occurs
    to a living being they will rapidly devolve into utter madness mentally, while physically their blood
    will begin to violently erupt out of various random points on their body as spears of solidified Frenzied
    Coldblood. *720 Swing: The Orphan of Kos swings his sword in a short-range 360-degree ring followed
    immediately by a mid-range 360-degree ring. *Uppercut Swing: A delayed mid-range forward uppercut
    used on its own and at the end of combos; strikes directly behind him when the blade returns to his
    hand. *Leaping Dive: The Orphan of Kos leaps into the air and performs a forward dive at a fixed angle
    after a very short delay. *Airborne Strike: The Orphan of Kos leaps into the air and strikes the ground
    in front of him with a close to mid-range sword slam while hovering. *Guillotine Slam: A slow two-handed
    downward chop performed at close range, sometimes to open a combo. *Double Uppercut: A two-hit frontal
    launcher followed by at least one downward slam if it connects. *Faint Rush: An extremely quick two-hit
    long-range dash attack in a straight line. *Visceral Grenade: The Orphan of Kos rips a chunk of flesh
    from his abdomen and throws it at you from all ranges. *Visceral Groundburst: The Orphan of Kos rips
    a chunk of flesh from his abdomen and drives it into the ground at his feet, creating a large frontal
    explosion. *Visceral Assault: The Orphan of Kos throws multiple chunks of flesh at the ground in a
    line creating a wall of large explosions in front of him, sometimes used to end combos or immediately
    after a Visceral Groundburst. After the first wave he will often leap 90 degrees to the side and perform
    the attack again. *Visceral Bombardment: The Orphan of Kos flies into the air and rains Visceral Grenades
    on a large circular target area beneath him. Each projectile creates an initial explosion and a forward
    wave of smaller explosions that moves outward along the ground. *Bolts of Sorrow: The Orphan of Kos
    screams for about three seconds. Roughly 1.5 seconds into the scream a massive bolt of lightning will
    strike the corpse of Kos in the middle of the beach and release large waves of lightning outward from
    that spot in six directions. ==Gallery== center|400px ==Notable Matchups== Victories: Losses: Inconclusive:
    {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters Category:Male Characters
    Category:Game Characters Category:Video Game Characters Category:Bloodborne Category:Game Bosses Category:Final
    Bosses Category:Eldritch Horrors Category:Orphans Category:Monsters Category:Immortals Category:Acrobats
    Category:Explosion Users Category:Blood Users Category:Electricity Users Category:Reality Warpers
    Category:Curse Users Category:Invisibility Users Category:Madness Users Category:Power Bestowal Users
    Category:Mind Users'
  source_ids: *id003
  decisive: false
  status: unverified
