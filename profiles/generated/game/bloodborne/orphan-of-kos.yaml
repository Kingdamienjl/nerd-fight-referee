- id: claim-powers-and-abilities-03d84de3
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Immortality (Types 1, 2 [Able to function unimpeded after
    receiving injuries as severe as being impaled through the skull and torso and having organs ripped
    outVisceral Attacks], 7 & 9 - Great Ones exist on higher, transcendental planes of thoughtIsz Root
    Chalice - According to the Choir, the land of Izs lies in contact with the cosmos, which allowed the
    Great Ones to function on transcendental planes of thought.Eye Rune - Eyes symbolize the truth Master
    Willem sought in his research. Disillusioned by the limits of human intellect, Master Willem looked
    to beings from higher planes for guidance, and sought to line his brain with eyes in order to elevate
    his thoughts. and are able to exist as disembodied spirits even after their physical bodies have died)
    **Acrobatics *Blood Manipulation & Explosion Manipulation (Able to use its blood to generate projectile
    and AoE explosions) *Electricity Manipulation (Able to call down bolts of lightning from the sky)
    *Reality Warping (All Great Ones possess the ability to warp reality both actively and passively with
    their mere presence, turning everything around them into twisted nightmares) **Curse Manipulation
    (Curses are the result of inciting the anger of Great OnesDefiled Chalice - A chalice that breaks
    a labyrinth seal. Only, this defiled chalice is cursed. Curses are caused by inciting the anger of
    the Great Ones, and used to hex others.. Even after the death of her physical body, Kos was able to
    maintain a perpetual curse over The Hunter''s NightmareFishing Hamlet Priest - Byrgenwerth... Byrgenwerth...
    Blasphemous murderers... Blood-crazed fiends... Atonement for the wretches... By the wrath of Mother
    Kos... Mercy for the poor, wizened child... Mercy, oh please... Atonement for the wretches... Lay
    the curse of blood upon them, and their children, and their children''s children, for evermore. Each
    wretched birth will plunge each child into a lifetime of misery. Mercy for the poor, wizened child...
    Let the pungence of Kos cling, like a mother''s devotion... Curse here, curse there. A curse for he,
    and she, why care. A bottomless curse, a bottomless sea, source of all greatness, all things that
    be. Listen for the baneful chants. Weep with them, as one in trance. And weep with us, oh, weep with
    us...].) **Invisibility (Great Ones and Kin are completely invisible to those lacking Insight, or
    knowledge of their existence) **Power Bestowal (Great Ones are capable of granting mortals an array
    of supernatural powers, up to and including ascending them into Kin) **Mind Manipulation (Great Ones
    can impact human thoughts and actions without the humans'' knowledgeBloodborne: The Old Hunters Guidebook
    page 184) **Madness Manipulation (Type 3 - Merely looking at Great Ones or hearing their incomprehensible
    voices causes one to go insane) Resistance to: *Madness Manipulation (Type 3 - Completely unaffected
    by the incomprehensible knowledge of the Eldritch Truth) *Poison Manipulation (Possesses an innate
    resistance to Slow and Rapid Poison) *Fire Manipulation, Temperature Manipulation, Magma Manipulation
    & Explosion Manipulation (Possesses an innate resistance to Fire-based attacks) *Electricity Manipulation
    (Possesses an innate resistance to electricity [bolt]) *Magic (Possesses an innate resistance to Arcane
    damage) *Curse Manipulation & Blood Manipulation (Possesses an innate resistance to blood-based attacks.)
    *Mind Manipulation, Sense Manipulation & Morality Manipulation (Unaffected by the Shaman Bone Blade)'
  source_ids: *id003
  decisive: true
