- id: claim-weaknesses-2de5baef
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks and Techniques: *Frenzy: A status effect that
    is the result of a target being forced to process information incomprehensible
    to humans, such as information about the Great Ones, Eldritch Truth, or Cosmos.
    This effect is a twofold form of damage, as when this occurs to a living being
    they will rapidly devolve into utter madness mentally, while physically their
    blood will begin to violently erupt out of various random points on their body
    as spears of solidified Frenzied Coldblood. *720 Swing: The Orphan of Kos swings
    his sword in a short-range 360-degree ring followed immediately by a mid-range
    360-degree ring. *Uppercut Swing: A delayed mid-range forward uppercut used on
    its own and at the end of combos; strikes directly behind him when the blade returns
    to his hand. *Leaping Dive: The Orphan of Kos leaps into the air and performs
    a forward dive at a fixed angle after a very short delay. *Airborne Strike: The
    Orphan of Kos leaps into the air and strikes the ground in front of him with a
    close to mid-range sword slam while hovering. *Guillotine Slam: A slow two-handed
    downward chop performed at close range, sometimes to open a combo. *Double Uppercut:
    A two-hit frontal launcher followed by at least one downward slam if it connects.
    *Faint Rush: An extremely quick two-hit long-range dash attack in a straight line.
    *Visceral Grenade: The Orphan of Kos rips a chunk of flesh from his abdomen and
    throws it at you from all ranges. *Visceral Groundburst: The Orphan of Kos rips
    a chunk of flesh from his abdomen and drives it into the ground at his feet, creating
    a large frontal explosion. *Visceral Assault: The Orphan of Kos throws multiple
    chunks of flesh at the ground in a line creating a wall of large explosions in
    front of him, sometimes used to end combos or immediately after a Visceral Groundburst.
    After the first wave he will often leap 90 degrees to the side and perform the
    attack again. *Visceral Bombardment: The Orphan of Kos flies into the air and
    rains Visceral Grenades on a large circular target area beneath him. Each projectile
    creates an initial explosion and a forward wave of smaller explosions that moves
    outward along the ground. *Bolts of Sorrow: The Orphan of Kos screams for about
    three seconds. Roughly 1.5 seconds into the scream a massive bolt of lightning
    will strike the corpse of Kos in the middle of the beach and release large waves
    of lightning outward from that spot in six directions. ==Gallery== center|400px
    ==Notable Matchups== Victories: Losses: Inconclusive: {{scroll box|content={{reflist|2}}}}
    {{Discussions}} Category:Characters Category:Male Characters Category:Game Characters
    Category:Video Game Characters Category:Bloodborne Category:Game Bosses Category:Final
    Bosses Category:Eldritch Horrors Category:Orphans Category:Monsters Category:Immortals
    Category:Acrobats Category:Explosion Users Category:Blood Users Category:Electricity
    Users Category:Reality Warpers Category:Curse Users Category:Invisibility Users
    Category:Madness Users Category:Power Bestowal Users Category:Mind Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-03d84de3
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Immortality (Types 1, 2 [Able to function
    unimpeded after receiving injuries as severe as being impaled through the skull
    and torso and having organs ripped outVisceral Attacks], 7 & 9 - Great Ones exist
    on higher, transcendental planes of thoughtIsz Root Chalice - According to the
    Choir, the land of Izs lies in contact with the cosmos, which allowed the Great
    Ones to function on transcendental planes of thought.Eye Rune - Eyes symbolize
    the truth Master Willem sought in his research. Disillusioned by the limits of
    human intellect, Master Willem looked to beings from higher planes for guidance,
    and sought to line his brain with eyes in order to elevate his thoughts. and are
    able to exist as disembodied spirits even after their physical bodies have died)
    **Acrobatics *Blood Manipulation & Explosion Manipulation (Able to use its blood
    to generate projectile and AoE explosions) *Electricity Manipulation (Able to
    call down bolts of lightning from the sky) *Reality Warping (All Great Ones possess
    the ability to warp reality both actively and passively with their mere presence,
    turning everything around them into twisted nightmares) **Curse Manipulation (Curses
    are the result of inciting the anger of Great OnesDefiled Chalice - A chalice
    that breaks a labyrinth seal. Only, this defiled chalice is cursed. Curses are
    caused by inciting the anger of the Great Ones, and used to hex others.. Even
    after the death of her physical body, Kos was able to maintain a perpetual curse
    over The Hunter''s NightmareFishing Hamlet Priest - Byrgenwerth... Byrgenwerth...
    Blasphemous murderers... Blood-crazed fiends... Atonement for the wretches...
    By the wrath of Mother Kos... Mercy for the poor, wizened child... Mercy, oh please...
    Atonement for the wretches... Lay the curse of blood upon them, and their children,
    and their children''s children, for evermore. Each wretched birth will plunge
    each child into a lifetime of misery. Mercy for the poor, wizened child... Let
    the pungence of Kos cling, like a mother''s devotion... Curse here, curse there.
    A curse for he, and she, why care. A bottomless curse, a bottomless sea, source
    of all greatness, all things that be. Listen for the baneful chants. Weep with
    them, as one in trance. And weep with us, oh, weep with us...].) **Invisibility
    (Great Ones and Kin are completely invisible to those lacking Insight, or knowledge
    of their existence) **Power Bestowal (Great Ones are capable of granting mortals
    an array of supernatural powers, up to and including ascending them into Kin)
    **Mind Manipulation (Great Ones can impact human thoughts and actions without
    the humans'' knowledgeBloodborne: The Old Hunters Guidebook page 184) **Madness
    Manipulation (Type 3 - Merely looking at Great Ones or hearing their incomprehensible
    voices causes one to go insane) Resistance to: *Madness Manipulation (Type 3 -
    Completely unaffected by the incomprehensible knowledge of the Eldritch Truth)
    *Poison Manipulation (Possesses an innate resistance to Slow and Rapid Poison)
    *Fire Manipulation, Temperature Manipulation, Magma Manipulation & Explosion Manipulation
    (Possesses an innate resistance to Fire-based attacks) *Electricity Manipulation
    (Possesses an innate resistance to electricity [bolt]) *Magic (Possesses an innate
    resistance to Arcane damage) *Curse Manipulation & Blood Manipulation (Possesses
    an innate resistance to blood-based attacks.) *Mind Manipulation, Sense Manipulation
    & Morality Manipulation (Unaffected by the Shaman Bone Blade)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
