- id: claim-weaknesses-cee1285f
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: Silver Claiming: Reina is an accomplished
    "Silver Claimer", allowing her to mold silver into any shape she desires. Despite
    the fact that silver is known to be a soft and brittle metal in real life, Reina''s
    silver is just as durable as steel, allowing her to make great use of it as a
    series of projectiles or as weapons in close combat. White Kiss: This Dark Bring
    has the ability to create anything from nothing. It takes the form of a silver
    snake wrapped around her left arm. Reina uses this Dark Bring to create silver,
    which she manipulates with her Silver Claimer abilities to create weapons. The
    Dark Bring itself can also be manipulated by Reina to be used as a weapon. *Spear
    Rain: Vortices of silver appear from multiple directions, which then unleash salvos
    of silver spears at the opponent. Her father originally wanted to learn how to
    do a smaller version of this in his show because he thought it would look cool
    and draw audiences. *Silver Emperor: A huge and powerful figure in the guise of
    an emperor, made out of silver, that can ordered to attack an opponent. This move
    is in memory of her father who used to make miniature silver figurines of knights
    and demons to use in his puppet show. *Silver Bond: This is a Silver Claimer''s
    ultimate technique. For it to work, two Silver Claimers must have complete trust
    in each other. Musica and Reina used this technique to defeat Ogre and destroy
    the core of the Silver Ray. It repels all incoming attacks as it begins to release,
    when enough energy is gathered, a huge shockwave will be released at a target.
    Reina Dark Bring.jpeg|Spear Rain Reina Silver Emperor.jpeg|Silver Emperor Musica
    Reina Silver Bonds.jpeg|Silver Bonds ==Notable Matchups== Victories: Losses: Inconclusive:
    {{Discussions}} Category:Characters Category:RAVE Category:Female Characters Category:Manga
    Characters Category:Good Characters Category:Heroes Category:Metal Users Category:Transmutation
    Users Category:Air Users Category:Weapon Masters Category:Weapon Creation Users
    Category:Martial Artists Category:Adults'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
