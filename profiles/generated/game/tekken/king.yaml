power_scale:
  tier:
    text: '{{5-C}}, higher in Zoan Forms even higher with Armament Haki, far higher
      with Self-Destruction or Omori Karyudon Name: King, Arbel, "King the Conflagration"
      Origin: One Piece Gender: Male Age: 47 Classification: Pirate, Lunarian, Head
      All-Star/Calamity of the Beast Pirates, Zoan Devil Fruit user'
    source_ids:
    - mediawiki-214184
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: "Moon level (The strongest Beast Pirate next to KaidouOne Piece Vivre Card\
      \ Databook #1308, which means his base is superior to Queen and Jack's bases,\
      \ who fought on equal terms for twelve hours without losing against Base Nekomamushi,\
      \ who could disarms Base Kaido, after fighting for several hours without losing\
      \ against Base Inuarashi, who is equal to Nekomamushi, respectively. In the\
      \ past, easily overpowered RaizoOne Piece Vol. 96 Chapter 970. Cut off Full\
      \ Zoan Marco's wing with his swordOne Piece Vol. 100 Chapter 1006 and matched\
      \ Sanji's kicksOne Piece Vol. 98 Chapter 988. Fought against Post Mink Medicine\
      \ Bus\u014Dshoku Zoro as an equal at the start of their fight, even overpowering\
      \ him in one exchange of blows. Could combat Marco one-vs-one offscreen for\
      \ 30 minutes, eventually outlasting and defeating him188.362 Exatons. Stated\
      \ that Zoro and Sanji needed their respective power ups to defeat King and Queen),\
      \ higher in Zoan Forms (Overpowered Sanji, and although he failed to split him\
      \ in half like he claimed to do because of the durability of the Raid Suit,\
      \ he wounded him through it. His Hybrid Form sent Zoro flying with a slash and\
      \ a clash, and cut Hybrid QueenOne Piece Vol. 102 Chapter 1027. Overpowered\
      \ Zoro's Ul-Tora Gari with a single Imperial Archer, with the impact of his\
      \ attack making Zoro cough up blood.), even higher with Armament Haki (Quickly\
      \ overwhelmed, pushed back, and injured ZoroOne Piece Vol. 102 Chapter 1032),\
      \ far higher with Self-Destruction (Zoro said that if he didn't block with Armament\
      \ Haki, he would've diedOne Piece Vol. 102 Chapter 1033), or Omori Karyudon\
      \ (King was confident that it'd kill Zoro despite the latter having matched\
      \ King in all his previous states)"
    source_ids:
    - mediawiki-214184
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: FTL (Tagged Marco and kept up with Roronoa Zoro), higher in Zoan Forms (Faster
      than before), even higher with Flames-Off (With his lunarian flame turned off,
      his speed increases greatly)
    source_ids:
    - mediawiki-214184
    confidence: 0.8
    notes: auto_repair source extraction
