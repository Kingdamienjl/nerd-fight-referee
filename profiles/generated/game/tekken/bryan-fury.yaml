- id: claim-weaknesses-b4ff43d5
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Snake Bomb: Bryan thrashes the opponent, which bounces
    upon hitting the ground. *Gatling Rush: Bryan quickly punches the opponent multiple times, then finishes
    the move with a knee. *Meteor Smash: Bryan performs a devastating punch on the opponent. *Fisherman''s
    Slam: Bryan punches the opponent in the belly, then keeps and throws them to the other side of the
    stage. *Rage Art: Bryan uses a Chopping Elbow and then uppercuts the opponent into the air. He hits
    the opponent on the way down with a Mach Kick and punches them away with a Mach Breaker before taunting.
    ==Gallery== File:big-bryan.png|Tekken 3 Bryan. File:bryan-z2.png|Tekken 4 Bryan. File:TK5_Bryan.png|Tekken
    5 Bryan. File:TK_Terrorist Bryan.png|Tekken 7 Bryan. ==Notable Matchups== Victories: Losses: Inconclusive:
    {{Discussions}} Category:Tekken Category:Characters Category:Male Characters Category:Fighting Game
    Characters Category:Gun Users Category:Martial Artists Category:Game Characters Category:Antagonists
    Category:Villains Category:Military Characters Category:Weapon Masters Category:Evil Characters Category:Chi
    Users Category:Statistics Amplification Users Category:Playable Characters Category:Adults Category:Cyborgs
    Category:Sadists Category:Murderers Category:Information Analysis Users Category:Power Nullification
    Users Category:Weapon Users Category:Light Users Category:Knife Users Category:Explosion Users Category:Fourth
    Wall Aware Characters Category:Accelerated Development Users Category:Aura Users Category:Rage Users
    Category:Damage Boost Users Category:Healers Category:Durability Negation Users Category:Status Effect
    Users Category:Fire Users Category:Body Control Users Category:Automatic Translation Users Category:Damage
    Reduction Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-3452a194
  section: abilities
  axis: hax
  text: '*Verse universal abilities *Superhuman Physical Characteristics *Chi Manipulation (Can enhance
    the strength of his attacks) *Automatic Translation (all characters in the cast can understand each
    other speaking their respective languages) *Extrasensory Perception (Power Reading) (multiple characters
    can sense through the others fists their negative desire and if they have some power or not) *Possibly
    Non Physical Interaction (fighters are capable of interacting with Kazumi like normal despite being
    a ghost) *Cyborgization (Full. He was claimed to be a cyborg, and his entire body is replaced with
    mechanical parts by Dr Abel) *Skilled Martial Artist (uses kickboxing as a fighting style) *Limited
    Body Control (can increase his muscles in his body during certain moves) *Limited Power Nullification
    (can nullify physical blows thrown at him) *Enhanced Senses (Vision (Neutral)) (has scanners in his
    eyes which can detect even invisible opponents) *Weapon Mastery (talented with various weapons, such
    as pistols, SMGs, miniguns, rocket launchers, shotguns, combat knives, grenades and even steel beams)
    *Fire Manipulation (can ignite fire from his fists) *Explosion Manipulation (via sticky bombs) *Light
    Manipulation (one of his weapons can shoot lasers) *Accelerated Development (Others; Physical Statistics,
    Abilities; although Bryan death was near, his body just flowed with energy that made him more powerful
    then before, developing an uncontrollable rage along that) *Limited Fourth Wall Break (breaks the
    screen of the "camera man") *Resistance to Fire Manipulation (unfazed from a helicopter exploding
    on him and walks out of the fire like nothing) and shown to be bulletproof several times'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
