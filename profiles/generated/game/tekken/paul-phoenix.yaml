- id: claim-weaknesses-bfcc0a30
  section: weaknesses
  axis: weakness
  text: 'While Paul has strength that can deal damage to the likes of Feng, his carelessness can interfere
    with his ability, which was demonstrated by his loss to Kuma. Notable Attacks/Techniques: *Hammer
    of the Gods: Paul delivers a fierce lashing that damages the opponent. *Shoulder Smash: Paul attacks
    and sends the opponent away with his shoulder. *Incomplete Somersault: Paul tries to use Marshall
    Law''s Somersault Kick, but he ends up falling in the ground since can''t get the landing right. *Rage
    Art: Paul starts with a Hammer Punch that bounces the opponent off the ground and into the air, then
    he finishes the move with a massive Burning Fist as the opponent falls to the ground. *Burning Fist:
    Paul uses his entire body to thrust into a powerful punch. He used this move to destroy both a brick
    wall and a rockslide. This move is also powerful enough to knock out foes in the Tekken-verse with
    a single punch if it is a counter hit. thumb|center|335 px ==Gallery== File:2164796-paul4e.png|Tekken
    2 Paul. File:TK3_Paul.png|Tekken 3 Paul. File:4TK_Paul.png|Tekken 4 Paul. File:DF97235C-B1AF-41D9-8312-082212946D8F-3568-0000037805A661C5.png|Tekken
    7 Paul. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters
    Category:Male Characters Category:Game Characters Category:Fighting Game Characters Category:Tekken
