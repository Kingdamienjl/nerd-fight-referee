- id: claim-powers-and-abilities-af41cb81
  section: abilities
  axis: hax
  text: '*Verse universal abilities (Rage; Heat; Armor; Ki Charge) *Superhuman Physical
    Characteristics *Acrobatics *Martial Arts (mastered Karate and Tekken Force Martial
    Arts) *Chi Manipulation & Durability Negation (Scales from Kazuya, who used his
    ki to punch Heihachi to the chest all the way outside of his back with it, causing
    his heart to eventually stop beating, they can enhance the strength of their attacks)
    *Electricity Manipulation (Mishimas can generate electricity, which was used before
    to stun people, they can also nullify energy based attacks like ki as well with
    it, their ability is good enough to control actual lightning from the sky in tandem
    with their own attacks) *Negation (Scales from Heihachi and Kazuya, whom shown
    the capability to negate the armor status effect of their opponents) *Automatic
    Translation (All characters in the cast can understand each other speaking their
    respective languages) *Extrasensory Perception (Power Reading) (multiple characters
    can sense through the others fists their negative desire and if they have some
    power or not) *Possibly Non Physical Interaction (fighters are capable of interacting
    with Kazumi like normal despite being a ghost) *Healing (should be capable of
    healing himself just like the other members of his family can) *Limited Fourth
    Wall Break (Scales from other Mishimas with various examples of 4th wall break)
    *Self-Sustenance (Type 1 and 2) & Possibly Space Survival (Scales from Jin and
    Kazuya, whom survived in outer space as normal humans, after falling from orbit
    without their devil gene, scales from Jin, whom didnt drown when descending down
    in the ocean and also has survived days in the desert, scales from Heihachi, whom
    was knocked unconscious after the Jack ambush till the 5th tournament was over,
    which was announced around 1-2 months ago in-universe) *Aura (Mishimas can generate
    auras out of their body) *Weapon Mastery (has a pistol and MK-47) *Vehicular Mastery
    (Able to drive cars) |-|Resistances= *Electricity Manipulation (Mishimas dont
    seem to be affected by the electricity they generate or from natural lighting)
    *Soul Absoption (Scales from Heihachi, whom managed to resist Ogre absorbing his
    soul despite likely taking it from other fighters and died, as well as scaling
    from Jin, for still having the devil gene when Ogre tried the same on him and
    resisted having his Devil Gene taken away by Kazuya himself) *Death Manipulation
    (survived the raging demon by sheer durability from Akuma, as well as Jin, whom
    didnt die after killing Azazel and destroying his body in order to end him, which
    brings death to others who do so) *Fear Inducement (Scales from Lars and Jin,
    whom were being unaffected by Azazel appearance which can overwhelm those who
    see it and has the power to reduce beings to ashes and also shown to be able to
    frighten others with his appearance) *Fire Manipulation (was able to resist Jinpachi
    aura for quite a while till it was too much to handle it) *Heat Manipulation (Can
    resist heat from lava nearby, his body even survived a fall in lava, also scales
    from Jin, whom is capable of fighting Jinpachi in a volcanic like environment,
    unfazed from an explosion point blank in his face) *Cold Manipulation (Mishimas
    manage to fight for prolonged periods of time during a heavy rain storm) *Wind
    Manipulation (Scales from Jin and Kazuya, whom even in an exhausted state, werent
    flinched by a massive tornado coming their way and engulfing them) *Smoke Manipulation
    (arent bothered by the toxic smoke emanated from a volcano) *Radiation Manipulation
    (has resisted a Jack self destructing, as well as scaling from Lars, whom resisted
    a Jack self destructing, with the Jacks running on Plutonium)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
