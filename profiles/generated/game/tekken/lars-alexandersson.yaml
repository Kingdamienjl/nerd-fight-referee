- id: claim-weaknesses-95d32548
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Ark Blast: Lars shocks the opponents with his hands
    enveloped by lightning. *Lightning Screw: Lars launches the opponent into the air with a kneeing and
    a kicks performed in a quick succession. *Zeus: Lars charges in the palm of a large amount of chakra
    and lightning attacks an enemy with an uppercut palm. *10-Hit Combo: Lars gets a few melee strikes
    the enemy, followed by a punch technique "Zeus", which Lars throws opponent high into the sky. Lars
    continues combination immediate movement in the form of lightning in the sky, followed by lobed adversary.
    Appearing over the opponent, Lars gets a few more punches charged with lightning, and then finishes
    the enemy with a powerful charge of Zeus in the stomach, driving the enemy into the ground. *Rage
    Art: Lars punches the opponent hard in the chest, follows up with three more punches and finishes
    with his Zeus move. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters
    Category:Game Characters Category:Tekken Category:Electricity Users Category:Humans Category:Heroes
    Category:Good Characters Category:Soldiers Category:Amnesiacs Category:Protagonists Category:Primary
    Protagonists Category:Military Characters Category:Martial Artists Category:Gun Users Category:Leaders
    Category:Weapon Masters Category:Male Characters Category:Chi Users Category:Statistics Amplification
    Users Category:Adults Category:Playable Characters Category:Fighting Game Characters Category:Vibration
    Users Category:Paralysis Users Category:Acrobats Category:Vehicular Masters Category:Status Effect
    Users Category:Durability Negation Users Category:Power Nullification Users Category:Aura Users Category:Rage
    Users Category:Damage Boost Users Category:Healers Category:Automatic Translation Users Category:Self-Sustenance
    Users Category:Fourth Wall Aware Characters Category:Damage Reduction Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-98a37d9f
  section: abilities
  axis: hax
  text: '*Verse universal abilities (Rage; Heat; Armor; Ki Charge) *Superhuman Physical Characteristics
    *Acrobatics *Skilled in Martial Arts (mastered Karate and Tekken Force Martial Arts) *Chi Manipulation
    and Durability Negation (scales from Kazuya, who used his ki to punch Heihachi to the chest all the
    way outside of his back with it, causing his heart to eventually stop beating, they can enhance the
    strength of their attacks) *Electricity Manipulation (Mishimas can generate electricity, which was
    used before to stun people, they can also nullify energy based attacks like ki as well with it, their
    ability is good enough to control actual lightning from the sky in tandem with their own attacks)
    *Negation (scales from Heihachi and Kazuya, whom shown the capability to negate the armor status effect
    of their opponents) *Automatic Translation (all characters in the cast can understand each other speaking
    their respective languages) *Extrasensory Perception (Power Reading) (multiple characters can sense
    through the others fists their negative desire and if they have some power or not) *Possibly Non Physical
    Interaction (fighters are capable of interacting with Kazumi like normal despite being a ghost) *Healing
    (should be capable of healing himself just like the other members of his family can) *Limited Fourth
    Wall Break (scales from other Mishimas with various examples of 4th wall break) *Self-Sustenance (Type
    1 and 2) and Possibly Space Survival (scales from Jin and Kazuya, whom survived in outer space as
    normal humans, after falling from orbit without their devil gene, scales from Jin, whom didnt drown
    when descending down in the ocean and also has survived days in the desert, scales from Heihachi,
    whom was knocked unconscious after the Jack ambush till the 5th tournament was over, which was announced
    around 1-2 months ago in-universe) *Aura (Mishimas can generate auras out of their body) *Weapon Mastery
    (has a pistol and MK-47) *Vehicular Mastery (can drive cars) |-|Resistances= *Electricity Manipulation
    (Mishimas dont seem to be affected by the electricity they generate or from natural lighting) *Soul
    Absoption (scales from Heihachi, whom managed to resist Ogre absorbing his soul despite likely taking
    it from other fighters and died, as well as scaling from Jin, for still having the devil gene when
    Ogre tried the same on him and resisted having his Devil Gene taken away by Kazuya himself) *Death
    Manipulation (survived the raging demon by sheer durability from Akuma, as well as Jin, whom didnt
    die after killing Azazel and destroying his body in order to end him, which brings death to others
    who do so) *Fear Inducement (scales from Lars and Jin, whom were being unaffected by Azazel appearance
    which can overwhelm those who see it and has the power to reduce beings to ashes and also shown to
    be able to frighten others with his appearance) *Fire Manipulation (was able to resist Jinpachi aura
    for quite a while till it was too much to handle it) *Heat Manipulation (can resist heat from lava
    nearby, his body even survived a fall in lava, also scales from Jin, whom is capable of fighting Jinpachi
    in a volcanic like environment, unfazed from an explosion point blank in his face) *Cold Manipulation
    (Mishimas manage to fight for prolonged periods of time during a heavy rain storm) *Wind Manipulation
    (scales from Jin and Kazuya, whom even in an exhausted state, werent flinched by a massive tornado
    coming their way and engulfing them) *Smoke Manipulation (arent bothered by the toxic smoke emanated
    from a volcano) *Radiation Manipulation (has resisted a Jack self destructing, as well as scaling
    from Lars, whom resisted a Jack self destructing, with the Jacks running on Plutonium)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
