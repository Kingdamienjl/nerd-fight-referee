- id: claim-weaknesses-ba5b0dfc
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Ark Blast: Lars shocks the opponents
    with his hands enveloped by lightning. *Lightning Screw: Lars launches the opponent
    into the air with a kneeing and a kicks performed in a quick succession. *Zeus:
    Lars charges in the palm of a large amount of chakra and lightning attacks an
    enemy with an uppercut palm. *10-Hit Combo: Lars gets a few melee strikes the
    enemy, followed by a punch technique "Zeus", which Lars throws opponent high into
    the sky. Lars continues combination immediate movement in the form of lightning
    in the sky, followed by lobed adversary. Appearing over the opponent, Lars gets
    a few more punches charged with lightning, and then finishes the enemy with a
    powerful charge of Zeus in the stomach, driving the enemy into the ground. *Rage
    Art: Lars punches the opponent hard in the chest, follows up with three more punches
    and finishes with his Zeus move. ==Notable Matchups== Victories: Losses: Inconclusive:
    {{Discussions}} Category:Characters Category:Game Characters Category:Tekken Category:Electricity
    Users Category:Humans Category:Heroes Category:Good Characters Category:Soldiers
    Category:Amnesiacs Category:Protagonists Category:Primary Protagonists Category:Military
    Characters Category:Martial Artists Category:Gun Users Category:Leaders Category:Weapon
    Masters Category:Male Characters Category:Chi Users Category:Statistics Amplification
    Users Category:Adults Category:Playable Characters Category:Fighting Game Characters
    Category:Vibration Users Category:Paralysis Users Category:Acrobats Category:Vehicular
    Masters Category:Status Effect Users Category:Durability Negation Users Category:Power
    Nullification Users Category:Aura Users Category:Rage Users Category:Damage Boost
    Users Category:Healers Category:Automatic Translation Users Category:Self-Sustenance
    Users Category:Fourth Wall Aware Characters Category:Damage Reduction Users Category:Weapon
    Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
