- id: claim-powers-and-abilities-62dd7980
  section: abilities
  axis: hax
  text: '*Power Bestowal, Corruption and Morality Manipulation: Pandora senses the negative emotions (such
    as rage, hate,Street Fighter X Tekken - Balrog and Vega''s Ending anguish, thirst for power,Street
    Fighter X Tekken - M. Bison and Juri''s Ending the desire of protecting others and even sheer evilness)
    of those approaching it, then fuels and enhances them to different degrees, ranging from mild anger
    to blind bloodlust and battle frenzy, turning against each other and affecting even people who are
    normally peaceful.Street Fighter X Tekken - Julia''s After Story Consequently, Pandora bestows them
    with tremendous powerStreet Fighter X Tekken Vita - Episode 1 while corrupting both their bodies and
    minds, to the point they can''t be considered human beings anymore. It also triggers dark energies,
    such as the Devil Gene,Street Fighter X Tekken - Jin and Xiaoyu''s Ending the Satsui no HadoStreet
    Fighter X Tekken - Ryu and Ken''s Ending and the Psycho Power, occasionally blending with them and
    granting new powers and abilities to their users. Such effect is usually temporary and disappears
    after awhile, but in some cases it lastedStreet Fighter X Tekken - Bison''s After Story forever.Street
    Fighter X Tekken - Juri''s After Story *Necromancy: Brought a frozen mammoth back to life, corrupting
    it in the process.Street Fighter X Tekken Vita - Episode 3 Could also reanimate the corpse of a dinosaur.Street
    Fighter X Tekken - Pandora''s Box Stage *Statistics Manipulation: Can apparently alter its own durability
    at will. *Telepathy: Called outStreet Fighter X Tekken - Akuma''s Prologue Akuma andStreet Fighter
    X Tekken - Ogre''s Prologue Ogre even before arriving on Earth. Pandora''s influence hauntedStreet
    Fighter X Tekken - King''s After Story King and Marduk''s mindsStreet Fighter X Tekken - Marduk''s
    After Story even after they had thrown the box away. *Extrasensory Perception: Perceives the conflicts
    and battles around it, as well as the negative emotions people emanate. Is aware of the inner desires
    of those who claim it. *Light Manipulation and Energy Projection: When ready to exert its power, Pandora
    often emits a pillar of energy that rises high into the sky and falls down in the shape ofStreet Fighter
    X Tekken - Dudley and Elena''s Ending harmless light particles.Street Fighter X Tekken - Chun-Li and
    Cammy''s Ending Upon its first activation, Pandora projected a tall beam of red energy that affected
    the lighting of a large area around itself. *Gravity Manipulation: Can alter the gravity around itself,
    causing nearby objects to float. *Illusion Creation: Showed King and Marduk an illusionStreet Fighter
    X Tekken - King and Marduk''s Ending of Armor King. Manifested a circular symbol above itself when
    activating for the first time. *Creation and Duplication: GeneratedStreet Fighter X Tekken - Akuma''s
    Ending a mass of energyStreet Fighter X Tekken - Akuma''s After Story shaped like Oni in order to
    provide Akuma a worthy opponent to fight. Created an armyStreet Fighter X Tekken - Hwoarang and Steve''s
    Ending of 100Street Fighter X Tekken - Hwoarang''s After Story Akumas. *Weather Manipulation: Unleashed
    a fierce storm that gripped the Antarctic region. *Technology Manipulation: RestoredStreet Fighter
    X Tekken - Bryan and Jack-X''s Ending Jack-X''s system and turned it against Bryan. *Biological Manipulation:
    Kazuya believes the Devil Gene can be amplifiedStreet Fighter X Tekken - Kazuya and Nina''s Prologue
    by using the power of the box. Stripped Zangief and Rufus of their body mass,Street Fighter X Tekken
    - Zangief and Rufus''s Ending giving them a sleek physique. *Summoning: Summoned strange alien bears,Street
    Fighter X Tekken - Guile and Abel''s Ending as Pandora is meant to be a beaconStreet Fighter X Tekken
    - Guile''s After Story for extraterrestrials. *Mind Manipulation: Its light enthralledStreet Fighter
    X Tekken - Law and Paul''s Ending Law and Paul. *Dimensional Storage: Can make it so its inside is
    much bigger than it should be. Could contain a large number of alien bears inside itself. *Flight:
    Can fly and travel in space. *Absorption and Purification: AbsorbedJin''s Devil Gene''s energy and
    soothed it temporarily, as not evenStreet Fighter X Tekken - Xiaoyu''s After Story Pandora could get
    ridStreet Fighter X Tekken - Jin''s After Story of it once and for all. *Transmutation: Turned Ogre
    into pure energy.Street Fighter X Tekken - Ogre''s Ending *Existence Erasure: Erased itselfStreet
    Fighter X Tekken - Cody and Guy''s Ending after sensing Cody and Guy''s intention of destroying it.
    Did the sameStreet Fighter X Tekken - Poison and Hugo''s Ending when Hugo and Poison rejected it.
    Pandora vanished in several other endings either after exertings its powers or when the characters
    failed to claim them. *Sealing: SealedStreet Fighter X Tekken - Raven and Yoshimitsu''s Ending Raven
    within itself, making it impossible for him to escape. *Age Manipulation: Reverted Kuma to a cub.Street
    Fighter X Tekken - Heihachi and Kuma''s Ending *Size Manipulation: Incr'
