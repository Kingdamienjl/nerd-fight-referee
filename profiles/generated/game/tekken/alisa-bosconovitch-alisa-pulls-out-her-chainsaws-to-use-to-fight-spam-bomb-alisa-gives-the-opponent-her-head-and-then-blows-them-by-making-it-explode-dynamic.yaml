- id: claim-powers-and-abilities-ad60868b
  section: abilities
  axis: hax
  text: '*Verse universal abilities *Superhuman Physical Characteristics *Inorganic Physiology (Type 2)
    *Acrobatics *Chi Manipulation and Statistics Amplification (Can enhance the strength of her attacks)
    *Automatic Translation (all characters in the cast can understand each other speaking their respective
    languages) *Extrasensory Perception (Power Reading) (multiple characters can sense through the others
    fists their negative desire and if they have some power or not) *Possibly Non Physical Interaction
    (fighters are capable of interacting with Kazumi like normal despite being a ghost) *Limited Fourth
    Wall Break (she looks at the "Cameraman" when earlier she was focused on the opponent) *Skilled Martial
    Artist (utilizes a unique style described as "high-mobility combat with thrusters") *Information Analysis
    and Extrasensory Perception (can scan information and analyze, as well as detect enemies in an area
    from a distance) *Weapon Mastery (shown to be using a minigun) *Technology Manipulation and Healing
    (can fix themselves and heal their health after being hit by a laser) *Limited Power Nullification
    (she can nullify energy based projectiles) *Hacking (capable of hacking) *Immortality and Regeneration
    (Type 2 and 3; Mid, she can function with her head detached from the body and regrow a new one) *Explosion
    Manipulation and Status Effect Inducement (her head can explode like a bomb and can burn the opponent
    with her explosive head) *Flight (has the capability of flying) *Body Control (can rotate her torso
    independently from the rest of the body) *Bodily Weaponry (Artificial, her arms can become rocket
    missiles and can pull chainsaws out of her hands) *Resistances: Technology Manipulation (despite being
    told to shut down, she later managed to boot up herself without voice command)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
