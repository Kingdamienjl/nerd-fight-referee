- id: claim-weaknesses-9daca87c
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Blonde Bomb: Nina will place her
    hands together and move them toward her opponent which is sent away. *Deadly Assault:
    Nina attacks the opponent with a combination of three kicks done in a quick succession.
    *Power Charge: Nina charges and delivers a powerful chi attack. *Evil Mist: Nina
    releases a poisonous mist from her mouth. *Double Arm Break: Nina grabs the opponent
    and hits them, then breaks the opponent arm while reaching for the other arm in
    order to move them higher, breaking the opponent shoulders in the process. *Rage
    Art: Nina initially stuns the opponent with a variation of Blonde Bomb before
    executing a twisting throw on her opponent, finishing by putting them in a submission
    hold between her legs and snapping their neck. ==Gallery== File:nina-t2.png|Tekken
    2 Nina. File:nina-t3-hd.png|Tekken 3 Nina. File:nina-z1.png|Tekken 4 Nina. File:Nina_williams___tekken_blood_vengeance___render_by_moresense-d9ko0vd.png|Tekken
    6 and Blood Vengeance Nina. File:tekken_7_fr_nina_williams_render_cutout_by_deadlypoisonbeauty-d9pl0zd.png|Tekken
    7 Nina. ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions}}
