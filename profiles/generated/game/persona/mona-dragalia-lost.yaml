- id: claim-powers-and-abilities-095299c4
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Skilled Swordsman, Natural Weaponry, Summoning (He can summon
    his Persona Zorro to assist him in battle), Magic, Air Manipulation, Energy Projection, Shapeshifting
    (Can change into a van, particularly when using his Mona Car skill), Non-Physical Interaction (Can
    harm ghosts), Statistics Amplification (Using his force strike grants him the "Beast Eye" buff, which
    increases his Persona gauge fill rate by 20%; Gwiber increases his strength by 40% while Y Ddraig
    Goch increases his defense by 50%; gains additional strength and health with wyrmprints), Statistics
    Reduction (The Free-Spirited Opera wyrmprint reduces one's own strength by 10% and has a 10% chance
    to lower the opponent's strength by 10% for a short time), Forcefield Creation (The wyrmprints A Brief
    Repose and A Bouquet can bestow a one-time shield which can block up to 30% of her health in damage
    and a life shield that blocks damage up to 15% her total health respectively), Healing (Zorro heals
    the entire party with 10% Recovery Potency when Mona performs his spinning attack during his flurry;
    Wyrmprints with the Last Recovery or Healing Doublebuff effects gives the user a 14% regen buff when
    HP is below 30% HP or a 3% regen buff when granted a defense buff, respectively), Resurrection (The
    Beneath the Boughs wyrmprint sacrifices 50% of the user's Persona gauge to bring them back to life
    if they get killed in combat), Instinctive Reaction (With The Genius Tactician, the user is able to
    dodge any reasonably avoidable attack automatically once every 30 seconds), Power Nullification (Via
    Fury Penetrator, Frenzy Res and Spectral Shield Penetrator), Limited Resistance Negation (Via Skill
    Resistance Penetrator), Damage Boost (Lucky Punch has a 30% higher chance of landing critical hits
    on the opponent, with a 25% chance of being even stronger with a 50% chance of landing critical hits;
    Increases damage dealt from critical hits by 20%; Increases the damage dealt by wind attacks; Conditionally
    via Copy Punisher; various wyrmprints increase her flurry strength, her force strike strength, her
    strength when attacking an opponent in a broken state, etc.), Resistance to Soul Manipulation via
    Soul Eater Res, freezing, water attacks upon landing ten or more consecutive attacks, as well as damage
    from specific High Dragons, Limited Resistance to Water Manipulation and Statistics Reduction (Via
    Whirlpool Res)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
