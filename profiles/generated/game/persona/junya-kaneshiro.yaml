- id: claim-weaknesses-a477cf94
  section: weaknesses
  axis: weakness
  text: Due to representing Kaneshiro's obsessive greed, Bael is easily distracted by items of value.
    Unlike other Palace Rulers, his ability to summon Shadows is limited by his perceiving them as hired
    help, and thus limiting the number of times he can summon them by the amount of wealth he has left.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-3eb02a30
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Cognitive Physiology (Shadow), Cognition (Minor), Summoning
    (all Palace Rulers can summon Shadows of varying strength from the Collective Unconscious to fight
    for them, so long as they are weaker than the Ruler in question), Transformation (can transform into
    Bael). Magic, Curse Manipulation, Darkness Manipulation, Danmaku, Elemental Aura, Empathic Manipulation
    (his touch can inflict crippling fear), Fire Manipulation and Explosion Manipulation (with Piggytron''s
    missiles), Shockwave Creation, Smoke and Empathic Manipulation (can release a gas that inflicts fear),
    and Resistance Negation (with March of the Piggy). Using his Palace Shadows, Kaneshiro has additional
    access to: Fire Manipulation, Ice Manipulation, Air Manipulation, Electricity Manipulation, Explosion
    Manipulation, Psychokinetic Manipulation, Holy Manipulation, Light Manipulation, Death Manipulation,
    Self-Destruction, Statistics Amplification (with "-Kaja" spells), Statistics Reduction (with "-kunda"
    spells), Damage Boost, Healing, Status Effect Inducement, Mind Control, Empathic Manipulation (with
    Rage and Fear) and Sleep Manipulation. Invulnerability (Shadows are composed of matter that defies
    the laws of physics, rendering them invulnerable to conventional interaction). Status Effect Inducement
    consisting of Paralysis Inducement, Empathic Manipulation, Biological Manipulation, Fear Manipulation
    and Death Manipulation.'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
