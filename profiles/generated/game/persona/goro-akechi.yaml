power_scale:
  tier:
    text: '{{1-A}}, higher with Willpower, far higher with Loki and Call of Chaos
      | {{1-A}}, higher with Willpower, far higher with Call of Chaos | {{1-A}}, higher
      with Willpower, far higher with Call of Chaos'
    source_ids: &id002
    - mediawiki-1003343
    confidence: 0.95
  attack_potency:
    text: Outerverse level (Goro is capable of putting up an even fight against the
      combined might of the Phantom Thieves, despite losing decisively, and among
      the Phantom Thieves is considered the only equal to Ren Amamiya at the time,
      due to their rivalry), far higher with Loki and Call of Chaos (Although it is
      uncertain whether the difference in power between Robin Hood and Loki is as
      immense as the usual standard between an evolved Persona and its predecessor
      due to Goro's status as a Wild Card, Loki should still be far more powerful
      than Robin Hood. This is further amplified by Goro's use of Call of Chaos on
      himself, which elevated a relatively weak Shadow like Cerberus into a notable
      threat to individual members of the Phantom Thieves), higher with Willpower
      | Outerverse level (Assisted in the defeat of Azathoth and Maruki, the former
      being stated to be on a whole other level than Yaldabaoth and is the master
      of the Faceless God), higher with Willpower, far higher with Call of Chaos |
      Outerverse level (Can meagerly damage and withstand blows from a full-power
      Adam Kadmon, the First Man, and the First World that transcends the entire Tree
      of Life, and is the closest emanation of the Great Reason), higher with Willpower,
      far higher with Call of Chaos
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Immeasurable (Capable of keeping up with the entire Phantom Thieves, who
      are superior to the likes of Parvati), higher with Willpower, far higher with
      Loki and Call of Chaos | Immeasurable (Kept pace with Azathoth), higher with
      Willpower, far higher with Call of Chaos | Immeasurable (Kept pace with Adam
      Kadmon), higher with Willpower, far higher with Call of Chaos
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Immeasurable (Comparable to Ren, who's Persona Kohryu states that through
      his power, Ren possesses the might to move all of creation), higher with Willpower,
      far higher with Loki and Call of Chaos | Immeasurable (Stronger than before,
      and should be above the other Phantom Thieves sans Ren Amamiya, who collectively
      held back the sustained force of Fused Adam Kadmon's all-out punch), higher
      with Willpower, far higher with Call of Chaos
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Outerverse level, higher with Willpower, far higher with Loki and Call of
      Chaos | Outerverse level, higher with Willpower, far higher with Call of Chaos
      | Outerverse level, higher with Willpower, far higher with Call of Chaos | Outerverse
      level, higher with Willpower, far higher with Call of Chaos
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Outerverse level (Took hits from the Phantom Thieves, who could withstand
      blows from Shadows such as Paravati), higher with Willpower | Outerverse level
      (Took hits from a serious Takuto Maruki), higher with Willpower | Outerverse
      level (Barely endured full power blows from Fused Adam Kadmon), higher with
      Willpower
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman. Can fight for hours on end despite the constant use of physical
      and magic skills, which significantly drain physical and mental stamina respectively
      with every use. Goro himself has cleared entire Palaces on his own, prior to
      meeting the Phantom Thieves.
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range with melee attacks | Up to Low Complex Multiversal
      with spells | Same as before. Up to Outerversal with spells.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius. Goro is comparable to Ren Amamiya at the minimum, and is often portrayed
      as being able to occasionally one-up the leader of the Phantom Thieves in wits.
      The two are often depicted as rivals in almost every aspect, including intelligence,
      and while the main source of Goro's fame as a detective is fraudulent, he is
      still able to match wits with established geniuses such as Sae Niijima and Naoto
      Shirogane.
    source_ids: *id002
    confidence: 0.95
