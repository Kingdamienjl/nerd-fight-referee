- id: claim-powers-and-abilities-30ec8443
  section: abilities
  axis: hax
  text: 'Base: Superhuman Physical Characteristics, Martial Arts, Weapon Mastery (Katanas),
    Supernatural Willpower, Empowerment, and Reactive Evolution (In times of dire
    need, Persona users can massively increase their strength to the point to where
    those who previously stomped them can be overwhelmed by their sheer aura. Persona
    users can manifest new abilities and force their Persona''s to evolve mid-fight,
    and change the tides of battle). With Persona: Cognitive Physiology (Persona),
    Magic, consisting of: Fire, Ice, Lightning, Wind, Radiation, Explosion, Psychokinetic,
    Energy, Holy, Light, Curse, Darkness and Death Manipulation. Resistance Negation
    (with Break and Almighty skills, which also bypass Invulnerability, Attack Reflection,
    Forcefields, Attack Absorption and Law-based defenses), Healing, Purification
    and Resurrection (with various support spells), Absorption (with Life and Spirit
    Drain), Statistics Amplification and Statistics Reduction (with Physical skills
    and various support spells), Damage Boost (with critical hits), Damage Reduction
    (with Guard), Status Effect Inducement, which includes, Empathic Manipulation
    (Dizziness/Nausea, Confusion, Despair and Rage), Fear Manipulation (with Evil
    Touch and Evil Smile), Memory Manipulation (with Makajama and Makajamaon), Sleep
    Manipulation (with Dormina and Lullaby) and Mind Control (with Marin Karin and
    Brain Jack). Resistances and Affinities: Depending on the equipped Persona, Resistance,
    Invulnerability, Reflection and/or Absorption of: Fire, Ice, Lightning, Wind,
    Energy, Holy, Light, Curse, Darkness and Death Manipulation. Base: All previous
    abilities to a greater extent. With Persona: All previous abilities to a greater
    extent. Weapon Creation (with skills like Sword Dance and God''s Hand), Summoning
    (can summon meteors with Agneyastra), Earth Manipulation (can create powerful
    earthquakes with Gigantomachia), Spatial Manipulation and Durability Negation
    (with Vorpal Blade), Limited Invulnerability (with Endure skills and/or sufficient
    willpower), Enhanced Regeneration (with Regenerate, Invigorate and Fast/Instant-Heal
    skills), Damage Boost (with Boost and Amp skills), Limited Probability Manipulation
    (with Critical-chance buffs, such as Rebel''s Vanguard), Damage Reduction (with
    Elemental Walls and certain Persona Traits), additional Danmaku (with skills like
    Riot Gun), Forcefield Creation and Attack Reflection (with Tetrakarn and Makarakarn),
    Forcefield Negation (with Tetra and Makara Break) and Buff and Debuff Negation
    (with Dekaja and Dekunda), Damage Transferal (with Hex ailment, which transfers
    half of the damage dealt by an attacker back onto themselves), Power Nullification
    (with Bind skills), Poison Manipulation (with Poison ailment) and Clairvoyance
    (with Navigation skills), Spatial Manipulation and Durability Negation (with Vorpal
    Blade). Resistances and Affinities: All previous abilities to a greater extent.
    Empowerment, Healing, Invulnerability and improved Reactive Evolution (During
    the final fight, the pleas of SEES revitalized Kotone and allowed her to endure,
    adapt, and outright nullify the onslaught of Death from Nyx), Immortality (Type
    2; After using the Great Seal, Kotone can survive without her soul for a month),
    Flight (Ascended upwards during the final fight against Nyx), Sealing (Sealed
    away Erebus, preventing The Fall). Fire, Ice, Electricity, Wind, Explosion, Energy,
    Curse, Darkness, Holy, Light, and Death Manipulation (w/ various gems), Resistance
    Negation (w/ Megido gems), Status Effect Inducement (w/ various weapons), Healing
    (w/ various items), Attack Reflection (w/ Mirrors), Statistics Amplification (w/
    various equipment and Sutras), Damage Boost and Empowerment (w/ various equipment),
    Debuff Negation (w/ Dekaja Gem), Statistics Reduction (w/ Dekunda Gem). Invulnerability
    and Law Manipulation (With the Omnipotent Orb, the laws of the universe are warped
    and manipulated to enforce the law that no harm can be enacted on the user)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
