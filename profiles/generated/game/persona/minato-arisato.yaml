- id: claim-weaknesses-b2448d7f
  section: weaknesses
  axis: weakness
  text: 'Makoto inherits the elemental weaknesses of his equipped Persona if they
    have one. He needs an Evoker to summon his Personas. Using the Great Seal sacrifices
    his soul, and would thus be out-of-character for him to use outside of extreme
    circumstances Notable Attacks/Techniques: Persona Summoning: The ability to utilize
    Personas, powerful manifestations of the mind and soul. Personas can move and
    attack independently of their users, allowing for double-teaming between their
    user and the equipped Persona. Each Persona has a set of elemental affinities,
    which also apply to their user while the Persona is equipped. Unlike the respective
    casts of Persona 4 and 5, the cast of Persona 3 can use their Personas in reality.
    Makoto''s initial Persona is Orpheus, its evolved form is Orpheus Telos, and his
    ultimate Persona is Messiah. Each Persona has a unique set of statistics and elemental
    affinities, which also apply to their user while the Persona is equipped. The
    Personas that Makoto has access to are listed here. Persona Skil'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-64ba6466
  section: abilities
  axis: hax
  text: 'Mid-Game= Base: Superhuman Physical Characteristics, Martial Arts, Weapon
    Mastery (Katanas), Supernatural Willpower, Empowerment, Accelerated Development
    and Reactive Evolution (Battle, Leveling, and Training; Physical Stats, Magic,
    and Improved Resistances. (Humans are able to get more powerful after defeating
    strong demons or even as they are in the middle of battle, even against opponents
    ontologically superior to them, and are able to grow massively in strength in
    the span of merely a day''s time or less, either through resolve, the threat of
    death, or training, or the bonds they hold dear) With Persona: Cognitive Physiology
    (Persona), Magic, consisting of: Fire, Ice, Lightning, Wind, Radiation, Explosion,
    Psychokinetic, Energy, Holy, Light, Curse, Darkness and Death Manipulation. Resistance
    Negation (with Break and Almighty skills, which also bypass Invulnerability, Attack
    Reflection, Forcefields, Attack Absorption and Law-based defenses), Healing, Purification
    and Resurrection (with various support spells), Absorption (with Life and Spirit
    Drain), Statistics Amplification and Statistics Reduction (with Physical skills
    and various support spells), Damage Boost (with critical hits), Damage Reduction
    (with Guard), Status Effect Inducement, which includes, Empathic Manipulation
    (Dizziness/Nausea, Confusion, Despair and Rage), Fear Manipulation (with Evil
    Touch and Evil Smile), Memory Manipulation (with Makajama and Makajamaon), Sleep
    Manipulation (with Dormina and Lullaby) and Mind Control (with Marin Karin and
    Brain Jack) Resistances and Affinities: Depending on the equipped Persona, Resistance,
    Invulnerability, Reflection and/or Absorption of: Fire, Ice, Lightning, Wind,
    Energy, Holy, Light, Curse, Darkness and Death Manipulation |-|Late-Game= Base:
    All previous abilities to a greater extent With Persona: All previous abilities
    to a greater extent. Weapon Creation (with skills like Sword Dance and God''s
    Hand), Summoning (can summon meteors with Agneyastra), Earth Manipulation (can
    create powerful earthquakes with Gigantomachia), Spatial Manipulation and Durability
    Negation (with Vorpal Blade), Limited Invulnerability (with Endure skills and/or
    sufficient willpower), Enhanced Regeneration (with Regenerate, Invigorate and
    Fast/Instant-Heal skills), Damage Boost (with Boost and Amp skills), Limited Probability
    Manipulation (with Critical-chance buffs, such as Rebel''s Vanguard), Damage Reduction
    (with Elemental Walls and certain Persona Traits), additional Danmaku (with skills
    like Riot Gun), Forcefield Creation and Attack Reflection (with Tetrakarn and
    Makarakarn), Forcefield Negation (with Tetra and Makara Break) and Buff and Debuff
    Negation (with Dekaja and Dekunda), Damage Transferal (with Hex ailment, which
    transfers half of the damage dealt by an attacker back onto themselves), Power
    Nullification (with Bind skills), Poison Manipulation (with Poison ailment) and
    Clairvoyance (with Navigation skills), Spatial Manipulation and Durability Negation
    (with Vorpal Blade) Resistances and Affinities: All previous abilities to a greater
    extent |-|Universe Arcana= Empowerment, Healing, improved Reactive Evolution,
    Invulnerability (During the final fight, the pleas of SEES revitalized Makoto
    and allowed him to endure, adapt, and outright nullify the onslaught of Death
    from Nyx), Immortality (Type 2; After using the Great Seal, Makoto can survive
    without his soul for a month), Flight (Ascended upwards during the final fight
    against Nyx), Sealing (Sealed away Erebus, preventing The Fall) |-|Optional Items=
    Fire, Ice, Electricity, Wind, Explosion, Energy, Curse, Darkness, Holy, Light,
    and Death Manipulation (w/ various gems), Resistance Negation (w/ Megido gems),
    Status Effect Inducement (w/ various weapons), Healing (w/ various items), Attack
    Reflection (w/ Mirrors), Statistics Amplification (w/ various equipment and Sutras),
    Damage Boost and Empowerment (w/ various equipment), Debuff Negation (w/ Dekaja
    Gem), Statistics Reduction (w/ Dekunda Gem). Invulnerability and Law Manipulation
    (With the Omnipotent Orb, the laws of the universe are warped and manipulated
    to enforce the law that no harm can be enacted on the user)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
