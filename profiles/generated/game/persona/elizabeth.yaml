  attack_potency:
    text: "Outerverse level (Serves as the \u201CUltimate Opponent\u201D, existing\
      \ within the Monad Depths, and is the final adversary before the fight against\
      \ Nyx (Persona). Grew stronger after the events of Persona Q, growing to level\
      \ 99 during the events of A Family Affair, when previously Zeus (Persona Q)\
      \ could possess her without resistance despite a singular level gap in strength.\
      \ Flawlessly wields powerful Personas such as Satan (Shin Megami Tensei) during\
      \ Velvet Blue, and Masakado (Shin Megami Tensei) who in which an aspect of him\
      \ could fare against Raidou Kuzunoha The XIV (Shin Megami Tensei). Killed Niades,\
      \ an aspect of Nyx during the events of Velvet Blue), higher with Willpower\
      \ | Outerverse level (Noted to train excessively, Elizabeth was capable of one-shotting\
      \ Erebus (Persona) with mindless ease after the events of Persona 4. Overwhelmed\
      \ Shadow Operatives Aigis at full power, humiliated Shadow Labrys and a Post-Persona\
      \ 4 Golden Yu Narukami was advised and admitted to fight her with intent to\
      \ kill, yet lost decisively), higher with Willpower"
