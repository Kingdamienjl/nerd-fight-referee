  tier:
    text: 1-A
    source_ids:
    - mediawiki-2557672
    confidence: 0.95
  attack_potency:
    text: Outerverse level (The primary and most powerful demonic authority behind
      the Assembly of Nihilo, being considered the God of Shijima and the only deity
      powerful enough to sponsor Hikawa's Reason, thus putting him massively above
      the likes of Mot and by extension Baal, Metatron and Beelzebub. Stated to be
      a natural resident of the archetypal abyss of Atziluth, having battled Ahura
      Mazda long before the awakened world was even born, and holding his own domain
      in it in the form of the Tower of Ethics)
    source_ids:
    - vsbattles-ahriman-shin-megami-tensei-persona
    confidence: 0.6
  speed:
