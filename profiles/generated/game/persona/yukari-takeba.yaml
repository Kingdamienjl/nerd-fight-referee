- id: claim-powers-and-abilities-fdc4cd43
  section: abilities
  axis: hax
  text: 'Base: Superhuman Physical Characteristics, Weapon Mastery (Archer), Supernatural
    Willpower, Accelerated Development and Reactive Evolution (In times of dire need,
    Persona users can massively increase their strength to the point to where those
    who previously stomped them can be overwhelmed by their sheer aura. Persona users
    can manifest new abilities and force their Persona''s to evolve mid-fight, and
    change the tides of battle) With Persona: Cognitive Physiology (Persona), Magic,
    consisting of Air Manipulation (Yukari''s main affinity is Garu), Healing (with
    Dia Spells), Power Nullification (Can negate Status Effects, and Binds), Resurrection
    (With Recarm), Attack Reflection (With Deflector Shot), Statistics Amplification
    (Can boost HP recovered by healing skills), Damage Boost (With Amp and Boost Skills),
    Resistance Negation (With Wind Break) Resistance and Affinities: Resistance and
    Invulnerability to Air Manipulation Fire, Ice, Electricity, Wind, Explosion, Energy,
    Curse, Darkness, Holy, Light, and Death Manipulation (w/ various gems), Resistance
    Negation (w/ Megido gems), Status Effect Inducement (w/ various weapons), Healing
    (w/ various items), Attack Reflection (w/ Mirrors), Statistics Amplification (w/
    various equipment and Sutras), Damage Boost and Empowerment (w/ various equipment),
    Debuff Negation (w/ Dekaja Gem), Statistics Reduction (w/ Dekunda Gem). Invulnerability
    and Law Manipulation (With the Omnipotent Orb, the laws of the universe are warped
    and manipulated to enforce the law that no harm can be enacted on the user). Base:
    All previous abilities to a greater extent. With Persona: All previous abilities
    to a greater extent. Resistance and Affinities: All previous abilities to a greater
    extent'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
