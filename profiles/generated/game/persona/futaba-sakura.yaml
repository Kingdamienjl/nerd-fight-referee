- id: claim-weaknesses-9576fcb3
  section: weaknesses
  axis: weakness
  text: 'None notable. Notable Attacks/Techniques: Persona Summoning: The ability
    to summon and utilize Personas. Personas can move and attack independently of
    their users, allowing for concurrent attacks to be performed. They are summoned
    and directed through thought and instinct, and most attacks manifest just as quickly
    and are controlled through the same means; and it should be noted that Personas
    do not need to be summoned in order to use their skills. Each Persona has a unique
    set of statistics and elemental affinities, which also apply to their user while
    the Persona is equipped. Futaba''s initial Persona is Necronomicon, her evolved
    Persona is Prometheus, and her ultimate Persona is Al Azif. Cognition: According
    to Morgana, the entire world is a product of Cognition; that is, what is real
    is only determined by humanity''s perception. It is effectively a form of collective
    Subjective Reality possessed by humanity. Within the Metaverse, this effect is
    taken to its extremes, resulting in things such as fake guns becoming real just
    by someone believing that it is, and said guns being always loaded due to the
    enemy''s logical assumption that a gun being held with hostile intent would naturally
    be so. More subtle displays of Cognition are also shown, such as when Ryuji Sakamoto
    managed to harm Shadows prior to awakening to his Persona, despite Shadows being
    invulnerable to all forms of standard physical interaction, simply because he
    believed that those Shadows were normal people playing a cruel prank. Will of
    Rebellion: The Phantom Thieves'' outfits take the form of one''s image of rebellion,
    and reflect the strength of their will to rebel against others'' desire to control
    them. This will of rebellion manifests as the aforementioned outfits, which protect
    the Phantom Thieves from the effects of Cognitive Distortions. Naturally, the
    stronger the will, the greater the extent of their resistance to the effects of
    Cognition. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}}
    Category:Characters Category:Persona Category:Female Characters Category:Protagonists
    Category:Humans Category:Criminals Category:Summoners Category:Megami Tensei Category:Game
    Characters Category:Stealth Masters Category:Thieves Category:Schoolgirls Category:Playable
    Characters Category:Geniuses Category:Hackers Category:Magic Users Category:Extrasensory
    Perception Users Category:Clairvoyance Users Category:Information Analysis Users
    Category:Information Users Category:Flight Users Category:Statistics Amplification
    Users Category:Space Users Category:Time Users Category:Power Nullification Users
    Category:Healers Category:Empowerment Users Category:Teleportation Users Category:Mind
    Users Category:Death Users Category:Matter Users Category:Creation Users Category:Weapon
    Creation Users Category:Role-playing Characters Category:Video Game Characters
    Category:Students Category:Non-Physical Interaction Users Category:Soul Users
    Category:Acrobats Category:Empathic Manipulation Users Category:Regeneration Users
    Category:Incorporeal Characters Category:Immortals Category:Reality Warpers Category:Damage
    Boost Users Category:Forcefield Users Category:Teenagers Category:Gamers'
