    text: Below Average normally, likely Very High with her Persona. Futaba is physically
      weak in stamina due to her lack of nutrition and exercise caused by her previous
      shut-in lifestyle. However, she shows no forms of exhaustion within the Metaverse,
      despite travelling on foot within Palaces with the rest of the Phantom Thieves;
      and should thus be roughly comparable to them.
