  intelligence:
    text: At least Genius, likely higher (Futaba is easily one of the most intelligent
      characters in Persona 5, if not the entire verse. In less than two years, she
      taught herself several university-level and higher subjects, researched and
      understood deep aspects of cognitive psience using only bits of scattered knowledge
      gathered from her photographic memories of her mother's notes, and became a
      world-renowned hacker possessing all of the associated skills. She did this
      all without any specialized equipment, outside instruction, as well as barely
      any notable effort on her part, as she had time for several useless side-projects,
      such as her developing a national-hit smartphone game out of boredom)
