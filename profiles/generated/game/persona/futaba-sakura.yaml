- id: claim-powers-and-abilities-4735b39e
  section: abilities
  axis: hax
  text: 'Early to Mid-Game= {{#tag:tabber|{{!}}-{{!}}Base= Superhuman Physical Characteristics,
    Genius Intelligence, Photographic Memory, Hacking, Clairvoyance, Extrasensory
    Perception, Stealth Mastery, Acrobatics, Regeneration (Mid-Low, speed depends
    on willpower), Summoning (Futaba can summon items from the Phantom Thieves'' shared
    inventory for her use, though since she rarely participates in combat, she has
    never actually needed to) and Cognition (Minor), and Supernatural Willpower, Empowerment,
    Accelerated Development, Reactive Power Level, and Reactive Evolution(Battle,
    Leveling, and Training; Physical Stats, Magic, and Improved Resistances. Humans
    are able to get more powerful after defeating strong demons or even as they are
    in the middle of battle, even against opponents ontologically superior to them,
    and are able to grow massively in strength in the span of merely a day''s time
    or less, either through resolve, the threat of death, or training, or the bonds
    they hold dear, Non-Physical Interaction, Durability Negation, Healing Nullification,
    Immortality Negation (Type 2, 3, and 7), and Invulnerability Negation (Capable
    of interacting with Demons, which are invisible beings comprised of data and information,
    the fulcrum of the entire verse proper, a concept synonymous to souls, minds,
    and even concepts. Even entities devoid of time and space, and nonexistent bodies
    such as The White can be struck down. Can completely negate their invulnerability
    to conventional weaponry, and the requirement of needing to be on a specific informational
    frequency to harm, as well as Septentriones, which require spiritual attacks to
    harm, and as well as killing undead beings and regenerative entities, such as
    Nagas and Blobs) {{!}}-{{!}}With Persona= Cognitive Physiology (Persona). Magic,
    consisting of Explosion Manipulation and Energy Manipulation. Information Analysis,
    Resistance Negation (with Almighty skills, which additionally bypass Invulnerability,
    Attack Reflection, Forcefields, Attack Absorption and Law-based defenses), Natural
    Weaponry (with Necronomicon''s tentacles), Healing and Mental Restoration (with
    Moral Support and Subrecover skills), Statistics Amplification (with Moral Support),
    Damage Reduction (with Guard), Forcefield Creation and Attack Reflection (Futaba
    can freely create domed forcefields that can reflect attacks back at the attacker),
    Reality Warping (with Cognition Manipulation), which grants her Creation (she
    can create weapons and objects from nothing) and Forced Teleportation (with Position
    Hack). {{!}}-{{!}}With Skill Accessories= Through equipping certain items, Futaba
    can possess any of the following: Enhanced Regeneration, Statistics Amplification,
    Attack Reflection, Forcefield Creation, Attack Absorption, Limited Precognition,
    Healing, Purification, Fire Manipulation, Electricity Manipulation, Air Manipulation,
    Radiation Manipulation, Explosion Manipulation, Light Manipulation, Holy Manipulation,
    Darkness Manipulation and Curse Manipulation. Invulnerability to Memory Manipulation
    and Sleep Manipulation. {{!}}-{{!}}Resistances and Affinities= Resistance to Cognition
    (The Phantom Thieves'' wills of rebellion serve as protection against the effects
    of Cognition), Cognition (the Phantom Thieves'' wills of rebellion serve as protection
    against the effects of Cognition). Existence Erasure, Information Manipulation,
    Mind Manipulation, Soul Manipulation, Fusionism and Memory Manipulation (Simply
    having the potential to awaken a Persona grants one a will firm enough to maintain
    their own existence and individuality in the unconscious world, where the concept
    of the ego does not exist and all individuality dissolves into oneness, with ordinary
    people being immediately overwhelmed by the nothingness and scattered throughout
    all possible worlds by stepping into it), Fate Manipulation and Curse Manipulation
    (Like the other protagonists, she is likely able to fight and defeat White Rider,
    the abstract embodiment of victory and conquest whose crown assures his success
    in all battles and wars. Unbothered by interactions with Pisacas, which fate humans
    to die in the span of nine months), Disease Manipulation, Probability Manipulation,
    Madness Manipulation and Chaos Manipulation (Unaffected by the act of looking
    into Girimehkala''s eye, which inflicts incurable sickness and misfortune into
    individuals, and by the gaze of Yakkha, which is said to inflict disease and madness),
    Petrification and Poison Manipulation (Can easily do battle against Basilisk and
    Cockatrice, both of whom turn normal people into stone simply by being touched
    or looked at, and have a gaze and breath so poisonous that any mortal being near
    them instantly dies, turning their surroundings into a desert), Life and Death
    Manipulation (Can fight Liches, whose presence drains the life of those who see
    them, and is not affected by Balor''s gaze, which instantly kills enemies, and
    Chatterskull''s laughter, which dooms whoever hears it to death, immediate'
