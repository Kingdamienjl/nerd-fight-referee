    text: At least Large Building level (Comparable to Chie, who is capable of kicking
      shadows hard enough to send them out of sight), likely Country level (Izanagi,
      the very first Persona he gets, is stated to have created the entirety of the
      Oyashima. Though this might be attributed to Izanagi-no-Okami), higher with
      Willpower | Low Complex Multiverse level (Fought and defeated Ameno-Sagiri,
      who was going to fuse the Human world and the TV World, which is part of the
      Sea of Unconscious that exists within all human hearts), higher with Willpower
      | Outerverse level (Managed to fight against Izanami along with the rest of
      the Investigation Team, who is an archetype that resides in the Kadath Mandala
      and also created Yomotsu-Hirasaka, a plane beyond the concept of dimensions
      entirely), higher with Willpower, far higher with Izanagi-no-Okami (After obtaining
      the World Arcana and undergoing his own Second Awakening, one-shot Izanami-no-Okami
      in the climax of the final battle) | Outerverse level (At the end of Arena Ultimax,
      Yu single-handedly held off the full power of Hi-no-Kagutsuchi, who in his incomplete
      form who is far superior to the Shadow Operatives and Sho Minazuki at this time),
      higher with Willpower
    source_ids: *id002
    confidence: 0.95
  speed:
    text: At least Relativistic+ (Should be superior to Plasma, who is capable of
