      to the likes of Thor, who is a resident of The Expanse, a higher-dimensional
      plane that transcends past, present, and future), higher with Willpower | Immeasurable
      (Is capable of combating Izanagi, who exists beyond the concepts of dimensions
      entirely), higher with Willpower | Immeasurable (Far faster than before), higher
