- id: claim-weaknesses-1b8fd993
  section: weaknesses
  axis: weakness
  text: 'Yu''s physical and spiritual vitality is drained by using physical and magical skills respectively,
    and he inherits the elemental weaknesses of his equipped Persona. Notable Attacks/Techniques: Persona
    Summoning: The ability to summon and utilize Personas. Personas can move and attack independently
    of their users, allowing for concurrent attacks to be performed. They are summoned and directed through
    thought and instinct, and most attacks manifest just as quickly and are controlled through the same
    means; and it should be noted that Personas do not need to be summoned in order to use their skills.
    Each Persona has a unique set of statistics and elemental affinities, which also apply to their user
    while the Persona is equipped. The Personas that Yu has access to are listed here. Persona Traits:
    As shown in P5R, all Personas possess inherent traits that assist in combat or support. The complete
    list of traits available are listed here. Persona Skil'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-55314521
  section: abilities
  axis: hax
  text: 'Early Game= {{#tag:tabber|{{!}}-{{!}}Base= Superhuman Physical Characteristics, Martial Arts,
    Stealth Mastery Weapon Mastery (Katana), Summoning, Supernatural Willpower, Empowerment, Accelerated
    Development and Reactive Evolution (Battle, Leveling, and Training; Physical Stats, Magic, and Improved
    Resistances. (Humans are able to get more powerful after defeating strong demons or even as they are
    in the middle of battle, even against opponents ontologically superior to them, and are able to grow
    massively in strength in the span of merely a day''s time or less, either through resolve, the threat
    of death, or training, or the bonds they hold dear), Cognition (Type 1), Non-Physical Interaction,
    Durability Negation, Healing Nullification, Immortality Negation (Type 2, 3, and 7), and Invulnerability
    Negation (Capable of interacting with Demons, which are invisible beings comprised of data and information,
    the fulcrum of the entire verse proper, a concept synonymous to souls, minds, and even concepts. Even
    entities devoid of time and space, and nonexistent bodies such as The White can be struck down. Can
    completely negate their invulnerability to conventional weaponry, and the requirement of needing to
    be on a specific informational frequency to harm, as well as Septentriones, which require spiritual
    attacks to harm, and as well as killing undead beings and regenerative entities, such as Nagas and
    Blobs). {{!}}-{{!}}With Persona= Cognitive Physiology, Regeneration (Mid-Low; Can replenish health
    over time with the Regenerate skills), Magic, consisting of: Fire, Water Manipulation, Ice Manipulation,
    Lightning, Earth Manipulation, Wind, Radiation, Explosion, Psychokinetic, Energy, Light, Darkness,
    and Death Manipulation (Hama and Mudo spells have a chance of instantly killing enemies). Resistance
    Negation and Existence Erasure (Can use Almighty Attacks, which bypass all barriers and reflectors,
    invulnerability, and resistances. Can even negate an opponents resistance to resistance negation with
    Pierce. Almighty attacks are able to hurt someone wielding the Omnipotent Orb, which bends the rules
    of reality to defend the user from attacks, and Reason Bearers, who are able to enforce rules into
    reality to protect themselves from attacks. The Megi- line of spells is capable of obliterating opponents
    with a light that erases them "beyond death"), Absorption (Can drain vitality and spiritual energy
    with Deathtouch, Spirit Drain, Life Drain, Energy Drain, and passive Absorb skills), Power Nullification
    (Can nullify buffs and debuffs with Dekaja and Dekunda, capable of nullifying instant death attacks),
    Healing, Purification and Resurrection (with various support spells such as the Dia- line of spells
    and Recarm), Statistics Amplification and Statistics Reduction (with Physical skills and various support
    spells such as the -kunda and -kaja line of spells), Damage Boost (with critical hits and Boost/Amp
    skills), Damage Reduction (with Guard. Capable of granting himself or allies resistances to various
    elemental attacks with elemental walls), Limited Probability Manipulation (with Critical-chance buffs,
    such as Rebellion), Forcefield Creation and Attack Reflection (with Tetrakarn and Makarakarn), Chaos
    Manipulation (Izanagi birthed Japan from chaos), Forcefield Negation (with Tetra and Makara Break)
    Status Effect Inducement, which includes, Sound Manipulation, Memory Manipulation and Power Nullification
    (via Makajam, which silences an opponent and prevents them from using skills), Empathic Manipulation
    (Can inflict dizziness, exhaustion and rage), Fear Manipulation (via Evil Smile and Evil Touch), Statistics
    Reduction and Age Manipulation (via Ennervate and Old One) and Poison Manipulation (via Poisma and
    Poison Mist) {{!}}-{{!}}With Skill Accessories= Through equipping certain items, Yu can possess any
    of the following: Enhanced Regeneration, Statistics Amplification, Attack Reflection, Forcefield Creation,
    Attack Absorption, Limited Precognition, Healing, Purification, Fire Manipulation, Damage Boost, Electricity
    Manipulation, Smoke Manipulation, Teleportation, Air Manipulation, Light Manipulation, Darkness Manipulation,
    Resistance Negation, Fear Manipulation, Empathic Manipulation, Sound Manipulation, Supernatural Luck.
    Resistance to Poison Manipulation, Empathic Manipulation, Fear Manipulation and Age Manipulation {{!}}-{{!}}Resistances
    and Affinities= Depending on the equipped Persona, Resistance, Invulnerability, Reflection and/or
    Absorption of: Fire, Ice, Lightning, Wind, Light, Darkness. Resistance to Death Manipulation, BFR,
    Probability Manipulation, Existence Erasure, Information Manipulation, Mind Manipulation, Soul Manipulation,
    Fusionism and Memory Manipulation (Simply having the potential to awaken a Persona grants one a will
    firm enough to maintain their own existence and individuality in the unconscious world, where the
    concept of the ego does not exist and all individuality dissolves into oneness, with ordinar'
  source_ids: *id003
