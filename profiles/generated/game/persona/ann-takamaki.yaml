  name: all Personas possess inherent traits that assist in combat or support. The
    complete list of traits available are listed
  description: 'all Personas possess inherent traits that assist in combat or support.
    The complete list of traits available are listed here. *Agi: Inflicts a small
    amount Fire damage. Inflicts Burn. *Dia: Restores a small amount of health to
    one member of the party. *Dormina: Inflicts sleep on the target. *Tarunda: Decreases
    the enemy''s attack. *Maragi: Inflicts a small amount of Fire damage to all enemies.
    Inflicts Burn. *Agilao: Inflicts a moderate amount of Fire damage. Inflicts Burn.
    *Fire Break: Negates the enemy''s resistance to fire. *Diarama: Restores a moderate
    amount of health to one member of the party. *Tentarafoo: Inflicts Confuse to
    all foes. *Ambient Aid: Greatly increase the chance of inflicting ailments in
    rain or special weather. *Maragion: Inflicts a moderate amount of Fire damage
    to all enemies. Inflicts Burn. *Fire Boost: Enhances Fire attacks by 25%. *Matarunda:
    Decreases the enemy team''s attack by 25%. *Agidyne: Inflicts heavy fire damage
    to a single opponent. Inflicts Burn. *Burn Boost: Enhance chance of inflicting
    Burn status. *Maragidyne: Inflicts heavy fire damage on all enemies. Inflicts
    Burn. *Diarahan: Fully restores the health of a single party member. *Concentrate:
    The next magic based attack made by Ann deals 2.5x damage. *Fire Amp: Enhances
    Fire attacks by 50%. *Masochist Lash: Additional attack when a target is bound.
    *Mind Charge:: Triple magic attack for next hit. Lasts for 3 attacks. *Blazing
    Hell: Severe Fire damage to all foes. Inflicts Burn. *Evade Ice: Triples evasion
    chance against Ice attacks. *High Energy: Next magical attack inflicts 2.5x damage
    for party. Unique to Célestine. Cognition: According to Morgana'
