- id: claim-weaknesses-162d5b85
  section: weaknesses
  axis: weakness
  text: "She and her Personas are vulnerable to ice-based attacks. Although this can be made irrelevant\
    \ through items or her later Persona awakenings. Notable Attacks/Techniques: Persona Summoning: The\
    \ ability to utilize Personas, powerful manifestations of the mind and soul. Personas can move and\
    \ attack independently of their users, allowing for double-teaming between their user and the equipped\
    \ Persona. Each Persona has a set of elemental affinities, which also apply to their user while the\
    \ Persona is equipped. Ann's initial Persona is Carmen, her evolved Persona is Hecate and her ultimate\
    \ Persona is C\xE9lestine. Persona Traits: As shown in P5R, all Personas possess inherent traits that\
    \ assist in combat or support. The complete list of traits available are listed here. *Agi: Inflicts\
    \ a small amount Fire damage. Inflicts Burn. *Dia: Restores a small amount of health to one member\
    \ of the party. *Dormina: Inflicts sleep on the target. *Tarunda: Decreases the enemy's attack. *Maragi:\
    \ Inflicts a small amount of Fire damage to all enemies. Inflicts Burn. *Agilao: Inflicts a moderate\
    \ amount of Fire damage. Inflicts Burn. *Fire Break: Negates the enemy's resistance to fire. *Diarama:\
    \ Restores a moderate amount of health to one member of the party. *Tentarafoo: Inflicts Confuse to\
    \ all foes. *Ambient Aid: Greatly increase the chance of inflicting ailments in rain or special weather.\
    \ *Maragion: Inflicts a moderate amount of Fire damage to all enemies. Inflicts Burn. *Fire Boost:\
    \ Enhances Fire attacks by 25%. *Matarunda: Decreases the enemy team's attack by 25%. *Agidyne: Inflicts\
    \ heavy fire damage to a single opponent. Inflicts Burn. *Burn Boost: Enhance chance of inflicting\
    \ Burn status. *Maragidyne: Inflicts heavy fire damage on all enemies. Inflicts Burn. *Diarahan: Fully\
    \ restores the health of a single party member. *Concentrate: The next magic based attack made by\
    \ Ann deals 2.5x damage. *Fire Amp: Enhances Fire attacks by 50%. *Masochist Lash: Additional attack\
    \ when a target is bound. *Mind Charge:: Triple magic attack for next hit. Lasts for 3 attacks. *Blazing\
    \ Hell: Severe Fire damage to all foes. Inflicts Burn. *Evade Ice: Triples evasion chance against\
    \ Ice attacks. *High Energy: Next magical attack inflicts 2.5x damage for party. Unique to C\xE9lestine.\
    \ Cognition: According to Morgana, the entire world is a product of Cognition; that is, what is real\
    \ is only determined by humanity's perception. It is effectively a form of collective Subjective Reality\
    \ possessed by humanity. Within the Metaverse, this effect is taken to its extremes, resulting in\
    \ things such as fake guns becoming real just by someone believing that it is, and said guns being\
    \ always loaded due to the enemy's logical assumption that a gun being held with hostile intent would\
    \ naturally be so. More subtle displays of Cognition are also shown, such as when Ryuji Sakamoto managed\
    \ to harm Shadows prior to awakening to his Persona, despite Shadows being invulnerable to all forms\
    \ of standard physical interaction, simply because he believed that those Shadows were normal people\
    \ playing a cruel prank. Will of Rebellion: The Phantom Thieves' outfits take the form of one's image\
    \ of rebellion, and reflect the strength of their will to rebel against others' desire to control\
    \ them. This will of rebellion manifests as the aforementioned outfits, which protect the Phantom\
    \ Thieves from the effects of Cognitive Distortions. Naturally, the stronger the will, the greater\
    \ the extent of their resistance to the effects of Cognition. ==Notable Matchups== Victories: Losses:\
    \ Inconclusive: {{Discussions}} Category:Characters Category:Persona Category:Acrobats Category:Criminals\
    \ Category:Damage Boost Users Category:Dancers Category:Death Users Category:Empathic Manipulation\
    \ Users Category:Empowerment Users Category:Female Characters Category:Fire Users Category:Flight\
    \ Users Category:Game Characters Category:Gun Users Category:Healers Category:Humans Category:Immortals\
    \ Category:Incorporeal Characters Category:Invulnerability Users Category:Magic Users Category:Mind\
    \ Users Category:Non-Physical Interaction Users Category:Playable Characters Category:Power Nullification\
    \ Users Category:Protagonists Category:Regeneration Users Category:Resistance Negation Users Category:Role-playing\
    \ Characters Category:Schoolgirls Category:Sleep Users Category:Soul Users Category:Statistics Reduction\
    \ Users Category:Status Effect Users Category:Stealth Masters Category:Students Category:Summoners\
    \ Category:Teenagers Category:Teleportation Users Category:Thieves Category:Video Game Characters\
    \ Category:Weapon Masters Category:Whip Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
