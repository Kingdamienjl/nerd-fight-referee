- id: claim-weaknesses-b2d81c14
  section: weaknesses
  axis: weakness
  text: 'She and her Personas are weak to psychokinetic attacks. Notable Attacks/Techniques:
    Persona Summoning: The ability to utilize Personas, powerful manifestations of
    the mind and soul. Personas can move and attack independently of their users,
    allowing for double-teaming between their user and the equipped Persona. Each
    Persona has a set of elemental affinities, which also apply to their user while
    the Persona is equipped. Makoto''s initial Persona is Johanna, her evolved Persona
    is Anat and her ultimate Persona is Agnes. *Frei: Light Nuclear damage to 1 foe.
    Technical dmg: Burn/Freeze/Shock. *Mafrei: Light Nuclear damage to all foes. Technical
    dmg: Burn/Freeze/Shock. *Vajra Blast: Medium Physical damage to all foes. *Diarama:
    Restore Medium amount of HP of 1 ally. *Rakukaja: Increases the defense of 1 ally.
    *Freila: Medium Nuclear damage to 1 foe. Technical dmg: Burn/Freeze/Shock. *Energy
    Shower: Cure Confuse/Fear/Despair/Rage/Brainwash of party. *Flash Bomb: Medium
    Physical damage to all foes. Low chance of Dizzy. *Dekunda: Negate all debuff
    effects of party. *Defense Master: Automatic Rakukaja on user at start of battle.
    *Mafreila: Medium Nuclear damage to all foes. Technical dmg: Burn/Freeze/Shock.
    *Nuke Break: Suppress innate Nuclear resistance of 1 foe. *Nuke Boost: Strengthen
    Nuclear attacks by 25%. *Marakukaja: Increases the defense of all allies. *Freidyne:
    Heavy Nuclear damage to 1 foe. Technical dmg: Burn/Freeze/Shock. *Diarahan: Fully
    restore HP of 1 ally. *Mafreidyne: Heavy Nuclear damage to all foes. Technical
    dmg: Burn/Freeze/Shock. *Mediarahan: Fully restores the HP of the entire party.
    *Nuke Amp: Strengthen Nuclear attacks by 50%. *Atomic Flare: Severe Nuclear damage
    to 1 foe. Technical dmg: Burn/Freeze/Shock. *Evade Psy: Triple evasion chance
    against Psy attacks. *Checkmate: Decrease Attack/Defense/Agility of all foes for
    3 turns. ==Gallery== |-|Renders= {{#tag:tabber| {{!}}-{{!}}Makoto Niijima= Manga
    Makoto Niijima NotRender.webp|Manga Makoto Niijima (Live Action).webp|Live Action
