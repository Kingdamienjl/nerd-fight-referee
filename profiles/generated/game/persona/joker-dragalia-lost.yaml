- id: claim-powers-and-abilities-2c217196
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Skilled Dagger and Gun User, Summoning (By taking off his\
    \ mask, he can summon his Persona Ars\xE8ne to assist him in battle), Magic, Darkness Manipulation,\
    \ Non-Physical Interaction (Can harm ghosts), Statistics Reduction (Can reduce his opponent's strength\
    \ by 15% with Phantom Barrage and 20% with Eiha; The Free-Spirited Opera wyrmprint reduces one's own\
    \ strength by 10% and has a 10% chance to lower the opponent's strength by 10% for a short time),\
    \ Statistics Amplification (Passively increases defense by 6%; Gains additional strength and health\
    \ with wyrmprints), Forcefield Creation (The wyrmprints A Brief Repose and A Bouquet can bestow a\
    \ one-time shield which can block up to 30% of his health in damage and a life shield that blocks\
    \ damage up to 15% his total health respectively), Self-Healing (Gains a 1% regen buff whenever he\
    \ uses Shibing Bazhen; Wyrmprints with the Last Recovery or Healing Doublebuff effects gives the user\
    \ a 14% regen buff when HP is below 30% HP or a 3% regen buff when granted a defense buff, respectively),\
    \ Resurrection (The Beneath the Boughs wyrmprint sacrifices 50% of the user's dragon gauge to bring\
    \ them back to life if they get killed in combat), Instinctive Reaction (With The Genius Tactician,\
    \ the user is able to dodge any reasonably avoidable attack automatically once every 30 seconds),\
    \ Power Nullification (Via Fury Penetrator, Divinity Penetrator, and Frenzy Res; His force strike\
    \ can remove one beneficial buff from the opponent, including Kai Yan's Adamantine Shield), Damage\
    \ Boost (His critical rate is boosted by 5% whenever he uses Qimen Dunjia; Various wyrmprints increase\
    \ his flurry strength, his force strike strength, his strength when attacking an opponent in a broken\
    \ state, etc.), Resistance to blinding attacks, Light Manipulation upon landing 10 or more consecutive\
    \ strikes, Statistics Reduction via Dull Res, Power Nullification to a limited extent via Dragon Delay\
    \ Res, and damage from specific High Dragons"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
