- id: claim-powers-and-abilities-3c206882
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Cognitive Physiology (Shadow), Cognition (Moderate), Genius
    Intelligence (possesses the same intelligence as the real Futaba), Summoning (all Palace Rulers can
    summon Shadows of varying strength from the Collective Unconscious to fight for them, so long as they
    are weaker than the Ruler in question, and Futaba in particular can likely also summon Cognitive Wakaba
    Isshiki), Flight (can levitate indefinitely), Creation (should possess Necronomicon''s ability to
    create objects and tools as needed within her Palace), Teleportation (Shadow Futaba has displayed
    the ability to disappear and reappear anywhere within the main structure of her Palace), Information
    Analysis and Clairvoyance (should possess similar levels of awareness and analysis as Necronomicon).
    Fire Manipulation, Electricity Manipulation, Air Manipulation, Holy Manipulation, Light Manipulation,
    Curse Manipulation, Darkness Manipulation, Death Manipulation, Sleep Manipulation, Empathic Manipulation
    (with Despair, Rage and Dizzy), Statistics Amplification, Damage Boost, Attack Reflection (with Makarakarn),
    Resistance Negation, Summoning and Transmutation (with Trapped Rat). Status Effect Inducement, consisting
    of: Paralysis Inducement, Empathic Manipulation, Biological Manipulation, Fear Manipulation and Death
    Manipulation.'
  source_ids: *id003
  decisive: true
  status: unverified
