- id: claim-powers-and-abilities-50167645
  section: abilities
  axis: hax
  text: "Reploid Physiology= *Superhuman Physical Characteristics *Inorganic Physiology (Type 2) *Self-Sustenance\
    \ (All Types) *Space Survival *Immortality **Type 1 (Reploids can live for centuries without any problem)\
    \ **Type 2 (Combat Applicable. Mid; Reploids can survive and fight even after being severely damaged)\
    \ **Type 3 & Regeneration (Low-Godly; as long as their souls still exist, Reploids can regenerate\
    \ their entire bodies even after complete destruction) *Non-Physical Interaction **(Data; Reploids\
    \ can interact with data) **(Elemental\u3014Type 7 & 8\u3015; Reploids can physically interact with\
    \ Cyber Elves, beings made of energy and electrons) **(Souls; Reploids can interact with Nightmare\
    \ Souls) *Accelerated Development (Reploids have limitless potential) *Damage Reduction (Reploids\
    \ are modeled after X, whose body possesses an inner reactive armor skeleton that reduces damage by\
    \ 93%) *Extrasensory Perception (Enhanced Sight\u30141 Layer\u3015; Reploids can sense the Sigma Virus,\
    \ which cannot be sensed like normal data) *Enhanced Senses **(Enhanced Vision) ***(Soul Vision; Reploids\
    \ can see Nightmare Souls) ***(Neutral Vision; all Reploids are able to see Cyber Elves, beings invisible\
    \ to humans) ***(Telescopic Vision; all Reploids are superior to Rock, who can see the Wily Star from\
    \ this distance) *Absorption (Energy), Statistics Amplification & Invulnerability (Type 2; Reploids\
    \ can enter an Overdrive state, which greatly increases their power through energy absorption and\
    \ can even render them invulnerable) *Teleportation & Dimensional Travel (Reploids can transform into\
    \ light beams to teleport and travel across dimensions) |-|Abilites= *Stealth Mastery *Vehicular Mastery\
    \ *Fire Manipulation *Electricity Manipulation *Absolute Zero & Ice Manipulation *Earth Manipulation\
    \ *Water Manipulation *Air Manipulation *Restricted flight *Statistics Amplification *Damage Reduction\
    \ & Invisibility (in Hyper Mode) *Shapeshifting & Power Mimicry (With his Copy Chip, Axl can transform\
    \ into the various Reploids and Mechaniloids he's defeated and absorbed and gain their respective\
    \ powers and fighting abilities, Additional Stats and Powers with upgrades) |-|Resistances= *Resistance\
    \ to: **Cosmic Radiation **Biological Manipulation & Disease Manipulation (Reploid should have resistances\
    \ to attacks related to organic biology) **Absolute Zero **Black Hole Creation **Biological Manipulation,\
    \ Layared Mind Manipulation (3 Layers), Layared Hacking (3 Layers), Corruption, Power Nullification,\
    \ Possession, Transmutation, Data Manipulation, Paralysis Inducement & Information Manipulation (Type\
    \ 2; New Gen Reploids are immune to all types of viruses, including the Sigma Virus, Nightmare Virus\
    \ and Roboenza) **As a Reploid, Axl should have and enhanced all of Rock's resistances"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
