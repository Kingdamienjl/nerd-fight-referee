    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Average Human. Tires as easily as an old man should in combat, but is relentless
      and single-minded in his goals, allowing him to pilot his machines against Mega
      Man for extended periods | Limitless
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range | Often Extended Melee Range. Hundreds of Kilometers
      with weaponry. | Often Extended Melee Range. Thousands of Kilometers to Planetary
      with weaponry. | Often Extended Melee Range. Thousands of Kilometers to Planetary
      with weaponry.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Extraordinary Genius. An indisputable genius in the field of robotics, building
      robots on par with Light's (or superior to them in terms of his combat models
      versus Light's industrial models) and manages to consistently challenge Mega
      Man time and again. His final creation far surpassed anything Light created
      up to the point and Zero was only matched in his combat potential by X and Sigma
      up until the advent of the New Generation Reploids. He also created a mutating
      computer virus that would later become the Maverick Virus, as well as a time
      machine. However, he is sometimes lazy and often petty, neglecting to merge
      the Doc Robot's personalities to prevent conflict and throwing tantrums over
      the smallest things. His arrogance and inferiority complex also blind him at
      times and prevent him from making optimal decisions.
    source_ids: *id002
    confidence: 0.95
