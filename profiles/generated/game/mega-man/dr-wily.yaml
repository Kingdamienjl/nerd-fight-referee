  attack_potency:
    text: 'Human level (A surprisingly spry and reasonably fit middle-aged man) |
      At least Large Island level+ to Brown Dwarf level with machines (Consistently
      gives Rock a hard time, built most Robot Masters that he faces in the series,
      and Wily Machine #8, which was amped by Evil Energy, managed to incapacitate
      Duo), higher with the Double Gear System | Moon level+ with Wily Numbers, Machines
      and Satellites (Has fought with Base Mega Man, his satellite lasers can easily
      reduce the earth to ash) | At least Small Star level to at most Low Multiverse
      level (Created the Wily Star and Zero)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Average Human | Massively FTL+ (Manages to tag both Mega Man and Duo with
      projectiles), higher with the Double Gear System | Massively FTL (Built Quick
      Man, who kept up with Duo) | Massively FTL+, likely Infinite (His strongest
      creation, Zero, is at this level)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Average Human | Class T to Class P (His Wily Machines are on par with Mega
      Man and some can even crush him under their weight) | Unknown | Inapplicable
      with Wily Star (The Wily Star is a space station), At least Class P (Creations
      like Zero should be superior to the likes of Mega Man and Proto Man)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Human level (Is an average, untrained human) | At least Large Island level+
      to Brown Dwarf level (Can damage both Mega Man and Duo) | Moon level+ with Wily
      Satellites | At least Small Star level to at most Low Multiverse level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Large Island level+ (Survived an explosion visible from outer space. Easily
      survived having debris fall on him) | At least Large Island level+ to Brown
      Dwarf level (All of his Wily Machines have tanked multiple hits from the likes
      of Mega Man, Bass, and Proto Man as well as Duo, Gamma was virtually invulnerable
