- id: claim-weaknesses-d88bf086
  section: weaknesses
  axis: weakness
  text: 'His core is very unstable so if he receives enough damage he will malfunction
    and vaporize himself and the enemy Notable Attacks/Techniques: *Big Bang Strike:
    By far his most powerful attack, however it leaves him exhausted after using it.
    It was so powerful that it utterly destroyed King''s shield, which Mega Man and
    Bass were unable to so much as scratch. *Chill Spike: Launches a special freezing
    gel that flash freezes the opponent. Should it miss, it would instead create an
    array of sharp icicles on the ground that are sharp enough to pop Nitro Man''s
    tires. *Commando Bomb: Launches a bomb that can be manually controlled, allowing
    Proto Man to direct it into a nearby wall, floor, or ceiling to generate a large
    explosion. *Rebound Striker: Proto Man throws a super-elastic ball that gains
    kinetic energy as it moves, increasing the force of each successive impact. *Solar
    Blaze: Proto Man launches a fireball that splits into two separate waves of flame
    after a certain amount of time has passed. These flames are comparable to the
    miniature star atop Solar Man''s head, allowing them to burn through most materials
    with ease. *Thunder Wool: Proto Man launches a piece of statically charged wool
    that floats above his opponents before striking them with numerous lightning bolts.
    *Triple Blade: Proto Man generates and fires three blades in a fan pattern to
    cover a wide range and attack multiple targets at once. *Water Shield: Proto Man
    generates a wheel of highly condensed water droplets that deflect projectiles.
    He can also direct the shield towards his opponent as an attack, with the droplets
    spiraling outwards to cover a wider area. *Wheel Cutter: Proto Man generates a
    buzzsaw that can be used to scale walls, attack in Melee Range, or fired as a
    projectile that climbs up surfaces. Note: A rough list of his other powers (he
    has access to most of these). ==Gallery== Proto Shield.PNG|The Proto Shield in
    action. Megaman 3 - Whistle Concert (Protoman Theme) ==Notable Matchups== Victories:
    Losses: Bass (Mega Man) Bass''s Profile (Only their standard equipment was given)
    Inconclusive: {{Discussions}} Category:Characters Category:Mega Man Category:Game
    Characters Category:Robots Category:Antiheroes Category:Fire Users Category:Ice
    Users Category:Time Users Category:Weather Users Category:Earth Users Category:Shield
    Users Category:Forcefield Users Category:Gravity Users Category:Matter Users Category:Water
    Users Category:Power Mimicry Users Category:Space Users Category:Thrown Weapon
    Users Category:Explosion Users Category:Energy Users Category:Electricity Users
    Category:Healers Category:Gun Users Category:Air Users Category:Sidekicks Category:Self-Sustenance
    Users Category:Absolute Zero Users Category:Playable Characters Category:Androids
    Category:Teenagers Category:Male Characters Category:Robot Masters (Mega Man)
    Category:Teleportation Users Category:Flight Users Category:Bodily Weaponry Users
    Category:Attack Reflection Users Category:Toon Force Users Category:Elasticity
    Users Category:Sound Users Category:Absorption Users Category:Inorganic Beings
    Category:Artificial Characters'
  source_ids: *id003
