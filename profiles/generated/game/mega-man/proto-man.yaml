- id: claim-powers-and-abilities-fb90ca1d
  section: abilities
  axis: hax
  text: 'Innate Abilities and Standard Equipment (Canon)= Superhuman Physical Characteristics,
    Self-Sustenance (Types 1, 2 and 3), Immortality (Combat Applicable Type 6 & 8:
    As long as his IC chip is still intact, he can be rebuilt as many times as one
    wants and can reappear in spare bodies - around 9 times - due to the Spare Body
    Transfer System), Inorganic Physiology (Type 2), Bodily Weaponry, Teleportation
    (Non-combat applicable, he can teleport himself or others as a beam of light),
    Energy Projection, Attack Reflection (His Proto Shield can reflect projectiles),
    Flight (He can fly using the Proto Jet), Summoning (He can summon Beat), Toon
    Force and Elasticity (He can recover from being crushed flat by the Mad Grinder),
    Vehicular Mastery (He is a skilled kart driver), Healing (With Energy Tanks),
    Transmutation (With Mystery Tank: Can turn enemies into Spare Bodies), Power Mimicry
    (He can copy the powers of defeated robots), Weapon Creation, Water Manipulation,
    Ice Manipulation, Fire Manipulation, Electricity Manipulation, Forcefield Creation,
    Earth Manipulation, Explosion Manipulation, Air Manipulation, Sound Manipulation
    (Noise Crush allows him to fire off damaging sound waves and absorb them to increase
    their power), Homing Attack, Self-Destruction, Immunity to Mind Manipulation and
    Soul Manipulation, Resistance to Magnetism Manipulation (Resisted Magnet Man''s
    Magnetic Powers which can process scrap iron), Resistance to Petrification (He
    can break out of Shade Man''s Petrification beams), EMPs, Spatial Manipulation
    (Can take hits from Cut Man''s space-cutting Rolling Cutter) |-|Optional'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
