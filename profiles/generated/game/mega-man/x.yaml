- id: claim-weaknesses-bca9f2ab
  section: weaknesses
  axis: weakness
  text: 'X is powered by sunlight so remaining without it for extended periods of time could prove dangerous
    (though he has large reserves). He can be pacifistic to a fault at times. His special weapons have
    a limited number of shots, but this can be averted if composite X is used, as the fourth game''s iteration
    of the Ultimate Armor eliminates energy costs. {{scroll box|content=}} ===Notable Attacks/Techniques:===
    Final Strike: A conjunction attack with his allies (most commonly Zero and Axl) that unleashes a powerful
    barrage of energy blasts on a number of opponents, dealing immense damage if not outright killing
    the targets in question. This attack completely ignores all defenses and recharges the weapon energy
    of X and his allies after use. This was the attack used to finish off Omega in the Elf Wars. Variable
    Weapons System: Like the Mega Man before him, X has the ability to copy weapons of defeated Mavericks,
    gaining some of their powers. The following is a list of these weapons found throughout the games.
    |-|Mega Man X= {{{!}} cla'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-1c2b331e
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Inorganic Physiology (Type 2), Self-Sustenance (Types 1,
    2 and 3. Can breathe underwater and in space), Gun Protrusion, Teleportation (Non combat applicable,
    He can travel long distances as a beam of light), Statistics Amplification (Through the use of various
    Parts, Chips and the Mother Elf), Healing (He can heal himself through the use of Sub Tanks. He can
    also heal himself without them), Power Mimicry (Mega Man X can copy the powers of defeated opponents),
    Weapon Creation (Can recreate the materials needed to use the copied weapons with his Variable Weapon
    System), Afterimage Creation, Soul Manipulation (Can use Soul Body and other soul-based attacks),
    Absolute Zero Ice, Gravity Manipulation, Fire Manipulation (Said fire is hotter than the Earth's core),
    Elemental Weapons (Of the Lightning, Water, Earth, and Air variety), Light Manipulation, EMPs, Weather
    Manipulation, Can render himself virtually invulnerable through various Special Weapons, Flight, Homing
    Attack, Explosion Manipulation, Forcefield Creation, Magnetism Manipulation (Can pull scraps of metal
    toward himself with a charged Silk Shot), Acid Manipulation, Vibration Manipulation (Can create small
    tremors), Invisibility, Transmutation, Black Hole Creation, Space-Time Manipulation, BFR, Dimensional
    Travel, Time Stop, Intangible Dopplegangers, Attack Reflection, Summoning (Can summon three dragonfly
    shaped mechaniloids to attack opponents), Danmaku, Crystal Manipulation (Can create crystals to shield
    himself),Expert Martial Artist (Can use various martial arts moves such as the Hadoken and Shoryuken),
    Stealth Mastery, Vehicular Mastery (Can use bikes, cars and mechs easily), Intangibility, Non-Physical
    Interaction (Can interact with Sigma's viral form, the souls of Mavericks and bits of the Sigma Virus),
    Extrasensory Perception (Can perceive the Mother Elf and the Sigma Virus, former which can only be
    seen by some robots and the latter by feeling his evil energy), Forcefield Negation (Can negate forcefields
    with his Charge Shot), Information Analysis (The 2nd and 3rd armor's head parts allow him to analyze
    the area around him for hidden items), Rage Power (He gains a power boost when notably angered), Resistance
    to Mind, Soul, and Biological Manipulation (Is explicitly immune to the various strains of the Maverick
    and Nightmare Viruses, which can affect the Mind, DNA and Soul of Reploids), Absolute Zero (Unaffected
    by the ice weapons used by various Reploids, which exceed the potency of weapons used by Robot Masters
    like Cold Man and Concrete Man, who could reduce things to absolute zero and turn things brittle enough
    to shatter with a touch respectively), Space-Time Manipulation (Was completely immune to Zero's use
    of the Dark Hold and is far superior to the original Mega Man, who could effectively fight while under
    the effects of Time Man's Time Slow), Gravity Manipulation, BFR (Gravity Beetle's Gravity Wells don't
    work on him), Black Holes (Is unaffected by Gravity Antonion's Squeeze Bomb, even in the singularity),
    Corruption (Type 2, can withstand being infected with the Sigma Virus), Magnetism Manipulation (Via
    being superior to Rock), Paralysis Inducement (He could break out of Vile's paralysis), Corrosion
    Inducement (Survived in Acid Rain for a significant amount of time)
  source_ids: *id003
  decisive: true
