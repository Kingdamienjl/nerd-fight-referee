- id: claim-powers-and-abilities-238c3a70
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery, Statistics Amplification
    (Of Strength, Speed and Defences; Dunban can buff himself through various means
    such as Arts such as Peerless, buff himself through ether gems or even through
    skills which happen passively), Acausality (Types 1, 2 and 4; Escaped the Passage
    of Fate thanks to Alvis which means that like Shulk they exist outside of it),
    Statistics Reduction (Of Strength, Speed and Defences; Dunban is able to debuff
    his opponent''s stats through varies means such as ether gems which allow for
    Dunban to debuff opponents through attacks), Passive Healing (Via many healing
    ether gems which allows Dunban to constantly get healed for even actions such
    as moving), Self-Sustenance (Type 1; Can breathe in Memory Space which is stated
    to resemble the vacuum of space), Elemental Manipulation (Of Fire, Lightning and
    Ice; Via Dunban having access to Blaze Attack, Lightning Attack and Chill Attack
    which allows for his attacks to also inflict apply these abilities), Poison Manipulation
    (Via Poison Attack which allows for Dunban to poison enemies through attacks),
    Enhanced Senses (Via the Night Vision ether gem granting night vision), Probability
    Manipulation (Can increase his chances of setting off statuses, performing a critical
    hit, landing a hit on his opponent, etc), Paralysis Inducement (Can inflict paralysis
    through attacks via the paralysis ether gem), Purification (Type 3; The art Spirit
    Breath removes debuffs), Durability Negation (Via Bleed Attack, which can make
    others bleed through attacks even when said attacks are unable to do so prior
    and can make others bleed when they couldn''t normally can''t conventionally),
    Damage Reduction (Is able to reduce physical and ether damage by up to 50% through
    Physical Protect and Ether Protect gems), Supernatural Luck (Via Unbeatable Gem,
    which can allow Dunban to survive a normally fatal blow with 1 HP), Social Influencing,
    Limited Empathic Manipulation (Via ether gems allowing for Dunban to increase
    or decrease how aggro opponents are), Non-Physical Interaction (Can harm Nebulas,
    which lack any physical forms), Damage Boost (Via Peerless increasing damage),
    Self-Resurrection (Able to revive himself through the use of Jaws of Death), Status
    Effect Inducement (Via Bind and Daze, bind prevents the target from moving though
    they can still attack, Dunban can inflict this through attacks via the Bind ether
    gem, is also able to forcibly daze an enemy through the daze status effect), Presence
    Concealment (via Cloak Gems which allow for Dunban to be undetected by enemies),
    Damage Transferal (Via Spike Gems allow the user to send back the exact same damage
    they took to the attacker, allowing both parties to be equally damaged), Life
    Force Absorption (Via HP Steal which allows for Dunban to steal HP when damaging
    his opponents), Shockwave Generation (Via Soaring Tempest which sends a shockwave
    in a fan around of Dunban) and Reactive Power Level ("Tension" is an ability that
    passively makes a character grow stronger over the course of battle) |-|Resistance=
    Resistant to the following: Fire Manipulation, Ice Manipulation, Poison Manipulation,
    Paralysis Inducement, Status Effect Inducement, Sleep Manipulation, Mind Manipulation,
    Death Manipulation, Damage Transferal, Statistics Reduction, and Power Nullification
    (The ether gems allows him to be resistant to these when equipped), Gravity Manipulation
    (Unaffected by Fiora''s Zero Gravity Field), Radiation Manipulation (via Terrain
    Defence Gem), Empathic Manipulation (via Lock-On Resist Gem) and Possession (Remained
    in control of himnself while using The Monado through pure technique), Space-Time
    Manipulation and Sealing (Able to withstand hits from The Monado which was used
    by A to damage and seal Fog Rifts which are rifts in space-time) |-|Optional'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
