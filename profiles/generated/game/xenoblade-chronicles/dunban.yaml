- id: claim-standard-equipment-84f7580d
  section: equipment
  axis: equipment
  text: Passive Reactive Evolution (The Monado bends to the will of it's master allowing
    it to change shape, overcome weaknesses as shown with Shulk damaging Metal Face
    with the Monado I despite the latter having Homs blood, grow in power as shown
    by The Monado becoming much more powerful when pushed, enhance resistances and
    develop resistances as shown with The Monado overcoming the effects of the Apocrypha
    which previously left it in a powerless state and later Shulk even comments that
    The Monado does not feel any different even when approaching the Apocrypha Generator
    and also The Monado can gain new abilities when needed as shown with it responding
    to Shulk's desires which allowed him to obtain Monado Shield, Monado Speed and
    Monado Purge, Shulk was also shown to be capable of actively triggering The Monado
    to obtain new abilities through his will and desire as shown through him obtaining
    Monado Purge and The Monado II once it had the shackles broken alongside Zanza
    stating that created the Monado's ability to see into the future in order to fight
    Meyneth), Limited Heat Manipulation (The Monado emits large amounts of heat which
    has shown to be capable of melting the armour of characters such as Metal Face,
    this would make the heat produced by The Monado superior to the heat that an ether
    river produces as other faced mechon such as Xord were able to survive prolonged
    contact in one), Power Bestowal and Damage Boost (Via Monado Enchant), Energy
    Projection (Via Monado Buster), and an Unconventional Possession, Body Puppetry,
    Pain Manipulation and Enhanced Electricity Manipulation (Via The Monado which
    has shown to possess those who attempt to wield it such as Arglas or control people
    such as Dunban, Dunban's exposure to The Monado also caused him to be wrapped
    in electricity that caused him to lose the use of his right arm permanently and
    Shulk's exposure caused him to be enveloped with an indescribable pain)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
