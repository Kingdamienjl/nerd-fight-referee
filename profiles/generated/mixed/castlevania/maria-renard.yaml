    rudimentary magical attack. She charges her magical energies and releases them
    in the form of an energy ball. *Guardian Knuckle: Maria focuses her magical power
    and manifests a guardian spirit, which will dash towards her opponent and assault
    them with an intense flurry of rapid punches. Alternatively, she can focus all
    of her magical power on one fist and release it in the form of a single yet devastating
    energized fist. *Magical Songbook: Maria can use a songbook in combat, releasing
    magical soundwaves that destroy all nearby enemies. *Magical Egg: Maria raises
    a magical egg. Her powers cause it to hatch open, releasing numerous birds the
    fly towards her enemies. *Martial Arts: By age 17, Maria Renard had mastered her
    skills in physical combat and was no longer the clumsy, amateurish brawler she
