  intelligence:
    text: Gifted. Zaheer is clever and innovative, able to plan quickly and efficiently, as well as charming
      and charismatic when he needed to be, enabling him to sweet talk his way into homes or strike deals
      with people. He is intelligent and patient, though he is also capable of ruthless violence, as demonstrated
      by his murder of Hou-Ting and attempted murders of Tonraq and Korra. He is a master of several forms
      of martial arts and has extensive combat experience. Zaheer is also well-versed in Air Nomad philosophy
      and history, mainly teachings of the legendary airbender, Guru Laghima, whom he holds in high regard.
      Through meditation, Zaheer was capable of entering the Spirit World and freely teleport himself
      and others to various places in that realm. His extensive practice and training in meditation gives
      him the ability to communicate with his physical body while his soul is still in the Spirit World.
      He is also proficient in the art of public speaking, capable of swaying the public opinion to support
      his goals, as he demonstrated in his speech to the people of Ba Sing Se.
    source_ids: *id002
    confidence: 0.95
