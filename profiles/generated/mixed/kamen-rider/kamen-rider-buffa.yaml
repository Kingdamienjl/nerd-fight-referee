power_scale:
  tier:
    text: 9-B as Michinaga Azuma, High 8-C as Kamen Rider Buffa, 8-B with Boost, 8-A with Boost Time,
      , up to 1-C with Desire Empowerment
    source_ids: &id002
    - mediawiki-5002672
    confidence: 0.95
  attack_potency:
    text: Wall level as Michinaga Azuma ([https://imgur.com/a/W7bwktw Scales to the Ace of Strength, who
      was able to casually crush two bowling balls with his hands]), Large Building Level as Kamen Rider
      Buffa (Buffa has the highest affinity with Zombie, and thus stronger than other Zombie users that
      don't share said affinity), City Block with Standard Boost Forms (Boost Users have their stats multiplied
      by several times), Multi-City Block with Boost Time (Boost Time allows Boost Users to further increase
      their stats by 10 times. Scales to Geats, who casually created this explosion, who one shotted Kamen
      Rider Shiro and overpowered Buffa ), Varies, up to Complex Multiversal Level with Desire Empowerment
      (All Geats Riders should be able to equalise their overall stats with Kamen Rider Revice, allowing
      them to fight against those from his series. Revice and others are comparable to Kamen Rider Jeanne)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Athletic Human as Michinaga Azuma (Is comparable to Sae Ganaha, who's a professional athlete);
      Hypersonic overall speed ([https://vsbattles.fandom.com/wiki/User_blog:GrayCraft_Dragon/Kamen_Rider_Geats_Ep_1_-_Geats_shot_Fortress
      Scales to Ace, who shot a Fort Jyamato at this speed], and [https://imgur.com/a/revolve-on-o1hR0SQ#7Wqmln2
      can dodge and run from getting shot at with the same Magnum Shooter 40X]) as Kamen Rider Buffa (All
      standard buckle forms should have the same overall speed), Hypersonic+ speed with Standard Boost
      Forms (Multiplies his speed by several times), Massively Hypersonic speed with Boost Time; higher
      with Boostriker (Boostriker is faster than any Rider on foot, no matter which forms they use); Varies,
      up to Massively FTL+ with Desire Empowerment (All Geats Riders should be able to equalise their
      overall stats with Kamen Rider Revice, allowing them to fight against those from his series.)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Athletic Human as Michinaga Azuma (Scales to Sae Ganaha, [https://cdn.imgchest.com/files/09f7ce68d7c3.mp4
      who casually tossed both Keiwa Sakurai and the couch he was sitting on]), Class M as Kamen Rider
      Buffa (3x weaker than Boost Forms), higher with Standard Boost Forms (Multiplies his stats by several
      times), much higher with Boost Time, Varies, up to Immeasurable with Desire Empowerment
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Wall level as Michinaga Azuma, Large Building Level as Kamen Rider Buffa, City Block with Standard
