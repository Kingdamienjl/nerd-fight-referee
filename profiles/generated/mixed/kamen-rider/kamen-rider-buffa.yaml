  range:
    text: Standard Melee Range with fists; Extended Melee Range with melee weapons; Hundreds of Meters
      with ranged weapons/attacks; Kilometers with Magnum Shooter 40X (Sniper Mode/Machine Gun Mode);
      Tens of Kilometers with [https://cdn.imgchest.com/files/4apc5pgdrq4.png Command Twin Toron Cannon].
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Average (Is a construction worker without any notable feats relying on his intelligence) Even
      when he was a recent participant in the Desire Grand Prix, Michinaga has proven himself to be formidable
      enough to be part of the finalists time and time again. Like the others, he''s able to handle hordes
      of Pawn Jyamatos without the need to transform. He''s consistently able to give Geats some challenge
      in their clashes, the latter having the combined experience of his previous lives that have won
      every DGP throughout two millennia. He can also hold himself well against more veteran Riders like
      Kamen Rider Ouja and Vice. Although his fighting style does not make use of the ranged aspect of
      his weaponry, Buffa can still implement them to give high pressure from close range. Standard Tactics:
      Michinaga usually likes to get up close and personal, prioritising melee above all else in brawls.
      Due to this, he is incapable of using ranged weaponry save for point blank attacks. His only means
      of true ranged attacks are from his abilities, rather than the weapons, which he has no problem
      using constantly. Regardless of whether he''s healthy or within an inch of his life, the act of
      charging headfirst like a bull is always prevalent in his style of fighting. Despite his bull-headed
      nature, he is still capable of delivering sneak attacks. In his words, he will do whatever it takes
      to win.'
    source_ids: *id002
    confidence: 0.95
