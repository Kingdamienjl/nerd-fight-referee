- id: claim-standard-equipment-a11d1e2a
  section: equipment
  axis: equipment
  text: '* SB-333B Delta Driver: Kamen Rider Delta''s transformation item. Much like
    Faiz''s driver, it cannot be destroyed by the power of an atomic bomb. If it is
    used by a person without willpower, it can corrupt the user, making them berserk.
    If used for a long time, it can result in mental illnesses. * SB-333P Delta Phone:
    The walkie-talkie-shaped control unit of the Delta Gear and the grip of the Delta
    Blaster. * SB-333DV Delta Mover: The digital camcorder-shaped view-screen and
    the main portion of the Delta Blaster. * Delta Blaster: The combination of Delta
    Phone and Mover. This is Delta''s gun and his primary weapon. It has different
    modes that can shoot streams or bursts of light. When Mihara says "check" into
    the phone, he can use Lucifer''s Hammer. * SB-VX0 Jet Slinger: Jet Slinger is
    Delta''s Rider Machine. It is a large motorcycle with a hovering function allowing
    it to fly. It can also bombard the enemy with missiles.'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-5f23571e
  section: power_scale
  axis: battle_iq
  text: Above Average (Mihara was initially an amateur in fighting, Despite this,
    Delta Gear's power let him survive in most fight. Mihara found a way to get himself
    and Faiz out of the clutches of Dragon Orphnoch with him slowly building enough
    will and confidence to step up to the threats, aside from that, he was mentioned
    to be a very good student at Ryusei ever since he was a child, though admittedly,
    his true potential has yet to be revealed. He was eventually trained by Kusaka
    and showed more skill and tenure than before, to the point he could take on and
    outsmart a group of Orphnochs, not to mention that he eventually managed to surpass
    the mind control in the Delta Gear)
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-cc88f6a4
  section: weaknesses
  axis: weakness
  text: He is less experienced than other Riders, and often rushes into battle without
    thinking.
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-c3a87066
  section: abilities
  axis: hax
  text: '* Transformation * Martial Arts * Weapon Mastery * Resistance to: ** Mind
    Manipulation through Supernatural Willpower (Can wear the Delta Driver without
    suffering its side effects) All previous abilities plus: * Superhuman Physical
    Characteristics * Acrobatics * Energy Manipulation and Energy Projection * Light
    Manipulation (Delta can shoot light bullets produced from Photon Blood) * Limited
    Self-Sustenance and Underwater Breathing (Type 3; Delta Lungs has 3 hours of oxygen
    supply) * Enhanced Senses (Delta has a 180 degree field of view, night vision,
    and x-ray vision) * Summoning (By saying "3821" into the Delta Phone, he can summon
    Jet Slinger) * Absorption (Delta can absorb physical impact and release it) *
    Explosion Manipulation (His attacks have a tendency of causing explosions) * Information
    Analysis (The Global Feeler are the antennas which communicates with the Eaglesat
    and Hawkeye satellites. Comparable to Faiz''s Global Feeler) * Fear Manipulation
    (Inspires fear in others through his mere presence) * Deconstruction (Photon Blood
    is an energy source that is able to disintegrate anything it touches into ash.
    It flows within Delta''s suit and can be used when Delta activates his weaponry.)
    * Durability Negation and Paralysis Inducement (Lucifer''s Hammer paralyzes the
    opponent before allowing Delta to perform an attack that phases through his target)
    * Danmaku via Jet Slinger * Flight via Jet Slinger * Resistance to: ** Electricity
    Manipulation and Deconstruction (Withstood the Dragon Orphnoch''s 10,000 volt
    lightning and was unaffected by his ability to deconstruct) ** Fear Manipulation
    (Comparable to other Riders who are unaffected by Delta''s fear inducement) **
    Radiation Manipulation (Sol Metal would be able to protect the user from fallout
    caused by nuclear bombs) ** Extreme Heat (Nuclear blasts can reach temperatures
    up to 100 million degrees Celsius) ** Sound Manipulation (Nuclear explosions can
    reach sounds up to 248 dB)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
