- id: claim-standard-equipment-6967c461
  section: equipment
  axis: equipment
  text: "*Blay Buckle: Kenzaki\u2019s henshin device which allows him to transform\
    \ into Kamen Rider Blade. After transformation, attached to the belt is his personal\
    \ weapon, the Blay Rouzer. *Chalice Rouzer: A henshin device which allows Kenzaki\
    \ to transform into the Joker Undead. *Rouze Card: Various Cards which hold the\
    \ power of previously defeated Undeads. By sliding it across the blade of the\
    \ Blay Rouzer, Kenzaki can use the powers of each respective card. **Slash Lizard:\
    \ A Rouze Card of the 2 of Spades, the Lizard Undead. Slash Lizard\u2019s ability\
    \ is to increase the sharpness of the Blay Rouzer, enhancing its overall power.\
    \ **Beat Lion, A Rouze Card of the 3 of Spades, the Lion Undead, Beat Lion\u2019\
    s ability is to strengthen the user\u2019s physical strength, allowing Kenzaki\
    \ to knockback stronger foes from a single attack. **Tackle Boar: A Rouze Card\
    \ of the 4 of Spades, the Boar Undead. Tackle Boar\u2019s ability is to increase\
    \ the user\u2019s physical strength, allowing Kenzaki to perform a charge attack\
    \ to ram enemies. **Kick Locust: A Rouze Card of the 5 of Spades, the Locust Undead.\
    \ Kick Locust\u2019s ability is to increase the user\u2019s physical strength,\
    \ allowing Kenzaki to perform his Rider Kick. **Thunder Deer: A Rouze Card of\
    \ the 6 of Spades, the Deer Undead. Thunder Deer\u2019s ability is to supplement\
    \ attacks with electricity. He can shoot out electricity or channel it through\
    \ his attacks. **Metal Trilobite: A Rouze Card of the 7 of Spades, the Trilobite\
    \ Undead. The Metal Trilobite\u2019s ability is to transmute Kenzaki\u2019s armor\
    \ into metal, greatly reducing damage. It could either no sell attacks or even\
    \ push back enemies after it\u2019s been hit. **Magnet Buffalo: A Rouze Card of\
    \ the 8 of Spades, the Buffalo Undead. Magnet Buffalo\u2019s ability is to allow\
    \ the user to freely manipulate magnetic forces to even pull enemies towards him.\
    \ **Mach Jaguar: A Rouze Card of the 9 of Spades, the Jaguar Undead. Mach Jaguar\u2019\
    s ability is to increase the user's speed. Allowing them to blitz people who were\
    \ previously at their level of speed. **Time Scarab: A Rouze Card of the 10 of\
    \ Spades, the Scarab Undead. The Time Scarab\u2019s ability is for the user to\
    \ momentarily stop time to avoid attack. *Rouze Absorber: Used to access Jack\
    \ Form and King Form. **Fusion Eagle: A Rouze Card of the Jack of Spades, the\
    \ Eagle Undead. It is used with the Absorb Capricorn card to transform the user\
    \ into their Jack Form. **Absorb Capricorn: A Rouze Card of the Queen of Spades,\
    \ the Capricorn Undead. It is used with the Fusion Eagle card to transform the\
    \ user into their Jack Form. However, Kenzaki could also be used with the Evolution\
    \ Caucasus card to evolve into King Form. **Evolution Caucasus: A Rouze Card of\
    \ the King of Spades, the Caucasus Undead. It is used with the Absorb Capricorn\
    \ card to evolve the transformant\u2019s armor into their King Form. *Blay Rouzer:\
    \ The personal weapon of Kamen Rider Blade in both his Ace and Jack Forms. The\
    \ front of the blade acts as a tray which holds cards which contain the power\
    \ of Undeads, monsters that the Blade has defeated previously. The Blay Rouzer\
    \ is capable of using up to 3 Rouze Cards at a time. *King Rouzer: The personal\
    \ weapon of Blade King Form, it has the powers of various Undeads which Kenzaki\
    \ has defeated. The King Rouzer can perform two special moves, Royal Flash which\
    \ shoots a beam from the blade, and Royal Straight Flush which creates 5 undead\
    \ projections for the Blade to run through before landing a powerful blow."
  source_ids: *id002
  decisive: false
