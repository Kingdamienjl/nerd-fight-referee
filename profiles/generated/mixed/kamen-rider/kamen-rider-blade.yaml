- id: claim-powers-and-abilities-fb714b46
  section: abilities
  axis: hax
  text: "Kamen Rider Physiology, Acrobatics (Performed a backflip before transforming),\
    \ Enhanced Senses (Undeads are attracted to each other by instinct), Regeneration\
    \ (Mid-Low), Immortality (Type 1, 2, and 8; Undead bodies cannot age or be damaged\
    \ by normal means. Their immortality is granted by the Stone of Sealing, and they\
    \ can't truly be killed to preserve their existence for the next battle), Self-Sustenance\
    \ (Type 2 & 3), Shapeshifting and Power Mimicry (Chalice Rouzer can transform\
    \ the user into other Undeads), Sealing (Can seal other Undead), Extrasensory\
    \ Perception (Scales to Hajime), Transformation (With Blay Buckle), Limited Law\
    \ Manipulation (A Joker Undead can destroy the world or a pocket dimension when\
    \ it is the only Undead remaining in that worldspace. Comparable to Hajime, who\
    \ in the original series made Darkroaches spawn and eventually swarm almost all\
    \ of Japan due to being the final Undead left in the Battle Fight. In Kamen Rider\
    \ Zi-O, Joker Undeads spawn instead due to Another Blade taking both Joker Undead\
    \ powers from Kenzaki and Hajime. In Kamen Sentai Gorider, Kenzaki effortlessly\
    \ destroys Kamen Rider Genm's Game World, with playing cards as a visualisation\
    \ to its destruction.), Resistance to Explosion Manipulation (Comparable to other\
    \ Undeads who couldn\u2019t explode even after a finisher) All human abilities,\
    \ Sealing with Common Blank cards, Statistics Amplification (By himself, Kenzaki\
    \ can gain more power for the sole purpose of protecting others. Slash Lizard\
    \ can increase the Blay Rouzer's power. Beat Lion increases the power of punches.\
    \ Tackle Boar increases the power of tackles. Mach Jaguar enhances speed. Kick\
    \ Locust increases the power of flying sidekicks), Rage Power (His hatred towards\
    \ Hajime was stated to have been converted into fighting strength, causing his\
    \ fusion rates to rise), Empathic Manipulation (The rising of Kenzaki's fusion\
    \ rate through hatred passively caused Hajime to become enraged, prompting him\
    \ to start fighting), Regeneration (Mid-Low; Blade's armour can self-repair and\
    \ such was the case after receiving an attack that left a large opening on its\
    \ helmet), Electricity Manipulation via Thunder Deer (Supplements the next attack\
    \ with electricity), Transmutation and Attack Reflection via Metal Trilobite (Transmutes\
    \ body into organic metal to reduce damage. This increases his durability to the\
    \ point where attacks will outright bounce right from Blade's body), Magnetism\
    \ Manipulation (With Magnet Buffalo as it allows him to temporarily have control\
    \ over magnetism), Time Stop (Via Time Scarab as it can freeze time in place in\
    \ a certain radius) and Explosion Manipulation (His attacks have a tendency of\
    \ causing explosions), Damage Boost through Gravity Manipulation (The Hammer Shell\
    \ uses gravitational energy to increase the attack power of his attack), Enhanced\
    \ Senses (His Organscope has a 500x zooming function, a fluoroscopic function,\
    \ and a high-sensitivity night-vision function. The Organ Sonar can hear objects\
    \ from 5 km away), Information Analysis (The Trident Feeler G is capable of capturing\
    \ information that Kenzaki needs. He was able to measure Hajime's power), Reactive\
    \ Power Level (After measuring Hajime's power, Kenzaki was able to increase his\
    \ power, causing a spike in the Rider System), Summoning (Can call the Blue Spader\
    \ by communicating it with brainwaves), Resistance to Fragrance Manipulation (The\
    \ Inner Mask is a device that filters all toxins), Temperature Manipulation (The\
    \ Mithril Armor Leather is capable of keeping the user\u2019s body temperature\
    \ uniform under any circumstances), Electricity Manipulation (Survived his own\
    \ electricity from Thunder Deer, which is likely stronger than the Jellyfish Undead\u2019\
    s own 1 million volt electricity, although this did push him back), Poison Manipulation\
    \ (Was unfazed by the Titan Undead\u2019s poison, only being affected by its mind\
    \ control) and Time Stop (While wearing the Scarab Undead's cloth, Kenzaki was\
    \ immune to the effects of frozen time) All powers of Ace Form enhanced, Flight\
    \ All powers of Ace Form enhanced, Can activate all Spade's Rouze Cards which\
    \ they fused in this form, Energy and Light Manipulation (With Royal Straight\
    \ Flush), Fire, Air and Ice Manipulation (When using Four Card), Time Manipulation\
    \ (With Time Scarab that allows him the power to control the time within a certain\
    \ radius), Immortality Negation (Types 2 and 8; Killed Jashin 14 along with the\
