  intelligence:
    text: Extraordinary Genius (Covered over 142,610 articles about magma in an incredibly
      short amount of time. Researched every piece of information about takoyaki in
      the span of one night. Casually calculated the speed, velocity and rotation
      of a roulette ball to figure out what number it will land on in another person's
      match, later doing this again to consistently score correct in his own match
      after some off-screen research. After researching certain skills, Philip can
      immediately replicate them efficiently to the point where he considers it "child's
      play", such as when he finally obtained the information he sought on the dance
      technique known as "Heaven's Tornado", incorporating it effectively in battle
      against the Cockroach Dopant. Found out the identity of the Sweets Dopant by
      noticing her word choice and comparing it to an articles she's written. Figured
      out the locations of where the Violence Dopant would attack by identifying his
      previous attacks and vague hints to Wakana's interview questions, as well as
      additions information from the latter that Philip asked for based on how he
      theorized an attack would be executed. Incredibly observant, being able to identify
      the Triceratops Dopant was Aya Kujo based on her leg injury, and will often
      offer insight on an opponent to Shotaro when the two fight as Double. Tracked
      the time of where a garbage truck usually arrives near a road bridge while running
      away from the Smilodon Dopant, timing it perfectly so that he and Akiko could
      escape), higher for the Gaia Library (Can access the Gaia Library, which in
      turn means that he has access to any recorded knowledge on Earth. While this
      does not mean that he actually knows everything, his unparalleled ability to
      crunch enormous amounts of information in a very short time makes this knowledge
      especially useful in his grasp)
    source_ids:
    - mediawiki-3471162
    confidence: 0.6
