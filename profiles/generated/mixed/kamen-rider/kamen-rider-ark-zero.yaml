    Kamen Rider Jin Burning Falcon Form''s Transformation Device/ Personal Weapon.
    *Thousand Jacker: Kamen Rider Thouser''s personal weapon. After stealing Thouser
    data, Ark-Zero can 3-D Print it with all the Progrisekeys data Thouser has stolen.
