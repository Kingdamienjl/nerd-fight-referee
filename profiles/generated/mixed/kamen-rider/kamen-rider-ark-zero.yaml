    confidence: 0.6
  attack_potency:
    text: Unknown in Abstract Form (Has never directly attacked anyone), Below Average
      Human as the Ark Satellite and in Mobile Form (Both forms are unable to attack),
      at least Large Island level as Kamen Rider Ark-Zero (Overwhelmed Lightning Hornet
      Valkyrie and Burning Falcon Jin), up to at least Small Country level with Reactive
      Power Level (Would eventually grow strong enough to face Zero-One Metal Cluster
      Hopper after being unable to damage the latter's Raising Hopper Form), higher
      with Finishers
    source_ids:
    - mediawiki-4653206
    confidence: 0.6
  speed:
    text: At least FTL+ combat and reaction speed (Faster than most Riders in the
      series, blitzed Thouser and Zero-One Metal Cluster Hopper and even matched Kamen
      Rider Zero-Two), higher with Reactive Power Level (Able to massively speed up
      its movement in order to match the opponent. Saw Zero-Two in slow motion despite
      the latter initially blitzing him)
    source_ids:
    - mediawiki-4653206
    confidence: 0.6
  lifting_strength:
