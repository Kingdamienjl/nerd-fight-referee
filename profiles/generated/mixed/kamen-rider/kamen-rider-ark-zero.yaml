  stamina:
    text: Infinite in its Abstract Form (Lacks a physical body to tire), Unknown as
      the Ark Satellite and in Mobile Form, Superhuman as Kamen Rider Ark-Zero (Comparable
      to other Kamen Riders like Horobi and Zero-One)
    source_ids:
    - mediawiki-4653206
    confidence: 0.6
  range:
    text: Planetary in its Abstract Form (Ark has access to the internet and pulled
      Kuroto's consciousness from it), Thousands of Kilometers, likely Planetary as
      the Ark Satellite (Was designed to be the Humagear-Control satellite which extended
      to an entire city. In an alternate timeline, the satellite controlled the entire
      population of Humagears on Earth), Unknown in Mobile Form, Standard Melee and
      Extended Melee to Hundreds of Meters with different weapons as Kamen Rider Ark-Zero
    source_ids:
    - mediawiki-4653206
    confidence: 0.6
  intelligence:
    text: Genius (A highly intelligence A.I that was designed for the purpose of providing
      the connection network for Hiden Intelligence's products such as Humagears.
      Due to being fed with information regarding criminal psychology and human history,
      including all of its wars resulted in the Ark's A.I concluding that humanity
      must be eliminated, because its continued malicious existence would lead to
      the end of all other lifeforms. It corrupted all of the Humagears, and lead
      a terrorist group called MetsubouJinrai.net sharing its own plans to exterminate
      humanity with them. It most terrifying ability is to simulate billion of events
      from Jin's betrayal to it revival as the embodiment of malice, all of which
      were under the prediction of Ark. The only thing was able to rival against him
      was Zero-Two prediction ability which outmatched it own)
    source_ids:
    - mediawiki-4653206
    confidence: 0.6
