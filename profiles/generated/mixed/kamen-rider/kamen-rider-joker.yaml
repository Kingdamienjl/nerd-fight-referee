  intelligence:
    text: Gifted (Having trained under Sokichi Narumi for years, he has honed his
      detective skills enough to become a competent private detective who is able
      to solve cases even without the help of Philip. His skills is such that the
      police, specifically Ryu, would often come looking for his help when dealing
      with Dopant-related cases. Deduced the identity of the T-Rex Dopant before Philip
      confirmed it with the Gaia Library. Quickly deduced the location of the Cockroach
      Dopant by recognizing the environment that he drew in his manga. Concluded that
      Suzuko Arima was a Dopant that aided the Maruo Arima/Beast Dopant in a car robbery
      and manipulated their friend Isamu Bito into taking the blame after finding
      her Gaia Memory kept in Sokichi Narumi's bear statue. Deduced Yukie to have
      used the Yesterday Memory in order to drive off her 3 earlier victims in order
      for them to protect a kindergarten, as well as being able to tell she was holding
      back as to get revenge instead of join Museum. Figured out that his client was
      hiding a Gaia Memory in a bag that was stolen and was forced into going to the
      Narumi Detective Agency in order to receive it back with some details from earlier
      in the case and Philip's help)
    source_ids:
    - mediawiki-3427951
    confidence: 0.6
