- id: claim-standard-equipment-e4ab6af5
  section: equipment
  axis: equipment
  text: "*Henshin Onsa Onkaku (\u5909\u8EAB\u97F3\u53C9 lit. \"Transformation Tuning\
    \ Fork\"): A folded, square-shaped tuning fork device used to generate a special\
    \ sound wave that transforms into Hibiki. The special sound waves can be used\
    \ to activate the Disk Animals and play back audio data recorded by them. *Ongekibou\
    \ Rekka (\u97F3\u6483\u68D2\u30FB\u70C8\u706B, lit. \"Sound Attack Clubs Raging\
    \ Fire\"): Hibiki's primary weapons. A pair of drumsticks that are used as clubs\
    \ in combat but still work as instrumental tools to perform finishers. Hibiki\
    \ can also use the \"Kibojutsu Rekkaken\" technique to shoot fireballs from his\
    \ Ongekibou and can even form flames in the shape of a sword to use against enemies.\
    \ *Ongekizofukuken Armed Saber ((\u97F3\u6483\u5897\u5E45\u5263\u30FB\u88C5\u7532\
    \u58F0\u5203): Armed Hibiki's primary weapon. It is equipped with a function not\
    \ found in other sound weapons, which is to generate special vibrations that strengthen\
    \ the demon, but those who are not compatible with the vibrations not only feel\
    \ extremely fatigued, but also risk being forced to cancel their transformation\
    \ and temporarily losing the ability to transform into a demon. The weapon is\
    \ used in \"Sword Attack Mode\" for slashing attacks, and in \"Sound Attack Mode\"\
    \ for a powerful sound attack wave. *Ongekiko Kaentsuzumi (\u97F3\u6483\u9F13\u30FB\
    \u706B\u708E\u9F13, Ongekik\u014D: Kaentsuzumi, lit. \"Sound Attack Drum Flame\
    \ Drum\"): A device that attaches to his belt for the use of delivering the final\
    \ blow to Makamou. By pressing it into Makamou's body to form a drum for their\
    \ Ongekida finishers. Its size changes depending on the size of the Makamou, but\
    \ it can also be adjusted using the switch-like part at the top. **Ongekiko Bakuretsu\
    \ Kaentsuzumi (\u97F3\u6483\u9F13\u30FB\u7206\u88C2\u706B\u708E\u9F13, Ongekik\u014D\
    : Bakuretsu Kaentsuzumi, lit. \"Sound Attack Drum Explosive Flame Drum\") An enhanced\
    \ version of the Ongekiko Kanetsuzumi. It creates a greatly amplified cleansing\
    \ sound that can be poured into the enem and requires fewer strikes with the Rekka\
    \ but can only be used once. *Disk Animals (\u30C7\u30A3\u30B9\u30AF\u30A2\u30CB\
    \u30DE\u30EB, Disuku Animaru): A type of shikigami that supports Oni, also known\
    \ as \"sound shikigami.\" When activated, they take the form of animals to assist\
    \ him with a variety of tasks, including gather information, search for enemies,\
    \ record audio, and fight. They also possess a certain level of intelligence,\
    \ so they can act of their own volition rather than simply waiting for orders.\
    \ **Akane Taka (\u831C\u9DF9, lit. \"Madder Hawk\"): A shikigami with the soul\
    \ of a hawk can instantly transform from disk form into a hawk form with the ability\
    \ to fly. The wings are made of sharp cutters, allowing it to attack while flying,\
    \ and can also be used like a shuriken. ***Hagane Taka (\u92FC\u9DF9, lit. \"\
    Steel Hawk\"): The Disk Animal Akane Taka has been strengthened into an Armed\
    \ Disk Animal by the sound waves emitted by the Ongekizofukuken Armed Saber. Its\
    \ flying speed has increased to twice that of Akanetaka, and the cutters at the\
    \ tips of its wings have become sharper, resulting in more damage. **Ruri Wolf\
    \ (\u7460\u7483\u72FC, lit. \"Lapis Wolf\"): A shikigami with the soul of a wolf.\
    \ It is specialized for performance on land, is able to traverse rough terrain\
    \ and poor footing without difficulty, and is also highly durable. It is equipped\
    \ with stealth capabilities that are useful when tracking Makamou, and it can\
    \ also combat Makamou with its sharp fangs. **Kohgane Ookami (\u9EC4\u91D1\u72FC\
    , lit. \"Golden Wolf): It is the successor to the Ruri Wolf and was created for\
    \ Zanki, who had retired as an Oni and joined Todoroki as a supporter. When Zanki\
    \ changes into Kamen Rider Zanki, it becomes an exoskeleton to protect his injured\
    \ right knee, however, this feature is never used. Because it is a cutting-edge\
    \ machine, its combat capabilities are outstanding, and it was able to destroy\
    \ Shuki's Oni Armor. **Seiji Gaeru (\u9752\u78C1\u86D9, lit. \"Celadon Frog\"\
    ): A shikigami with the soul of an frog. It is often used for the purpose of searching\
    \ for and recording Makamou both on land and underwater. **Ryoku Oozaru (\u7DD1\
    \u5927\u733F, lit. \"Green Ape\"): A shikigami with the soul of an ape. It is\
    \ the first Disk Animal to be equipped with a recording function. Notably, they\
    \ have higher intelligence and strength than other Disk Animals, so they are also\
    \ used to protect Makamou victims. ***Kabuto Oozaru (\u515C\u5927\u733F, lit.\
    \ \"Shell Ape\"): The strengthened version of Ryoku Oozaru Disk Animal whose body\
