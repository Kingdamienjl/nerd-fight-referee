  intelligence:
    text: Gifted (Hibiki is a veteran Oni who has been fighting Makamou for 15 years
      and is the fastest individual to become an Oni nearly entirely on his own. He
      constantly trains to get stronger and improve his techniques. He is not just
      competent in combat skills, but also in making quick decisions and calm judgment,
      dealing with the sudden emergence of Makamou, or retreating and adjusting his
      approach if he sustains considerable damage. In combat, Hibiki has been known
      to strategize with his allies against the monsters he fights, even theorizing
      on how some of their abilities work and planning his battles around his theories,
      such as amplifying sound attacks by matching and overlapping wavelengths with
      other Oni or delaying Nurikabe's Douji and Hime's Armored form duration after
      knowing that they have a time limit. Despite his lack of knowledge of most technology,
      Hibiki was able to fix the Asagi Washi disc by replacing its damaged pieces
      with Akane Taka disc parts and mastering the Gaika bike after training. Taught
      Todoroki and Ibuki Taiko-training)
    source_ids:
    - mediawiki-4150769
