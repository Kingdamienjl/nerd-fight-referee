- id: claim-weaknesses-1516d463
  section: weaknesses
  axis: weakness
  text: 'Sufficient damage to her physical form can revert her back to her vulnerable gem form which can
    be broken and destroyed Notable Attacks/Tecniques: White Diamond Corruption 1.gif|White Diamond corrupting
    Pearl... White Diamond Corruption 2.gif|... and controlling Amethyst *Aura Projection: The Diamonds
    can project an aura around them that they can control, they can either radiate it from their entire
    bodies or emit it from specific parts of their bodies, usually their hands, although in White''s case,
    it is her eyes. White''s aura is white and has light-like properties, and could only be blocked by
    Pink Steven''s shield. **Gem Corruption/Possession: White''s aura takes the form of a beam of light
    she can fire from her eyes, which, when it makes contact with a Gem''s gem or body, infects them,
    changing their colors to White''s own monochromatic colors. This leaves them limp for a moment, before
    White takes over their mind and body, turning the gem into an extension of White''s own consciousness.
    This power makes no distinction of the gem in question''s powers, working just as easily on Yellow
    and Blue Diamond as it did on the Crystal Gems, although it could be blocked by Gem Steven''s Shield.
    She can fire these beams out of the eyes of those she possesses, and can seemingly access the weapons
    of the Gems she controls. While there is no confirmed limit to how many gems she can control, she
    does claim she "doesn''t prefer to spread herself so thin" after controlling Yellow Diamond, Blue
    Diamond, Pink Pearl, and the Crystal Gems. ==Notable Matchups== Victories: Losses: Inconclusive: {{scroll
    box|content={{reflist|2}}}} {{discussions|White Diamond|White Diamond}} Category:Characters Category:Steven
    Universe Category:Adaptation Users Category:Aliens Category:Antagonists Category:Aura Users Category:BFR
    Users Category:Biology Users Category:Body Control Users Category:Cartoon Characters Category:Corruption
    Users Category:Energy Users Category:Fusionism Users Category:Gems Category:Genderless Characters
    Category:Giants Category:Immortals Category:Large Sized Characters Category:Leaders Category:Light
    Users Category:Mind Users Category:Pocket Reality Users Category:Possession Users Category:Power Bestowal
    Users Category:Primary Antagonists Category:Regeneration Users Category:Sealing Users Category:Shapeshifters
    Category:Size Users Category:Tyrants Category:Villains Category:Humanoid Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-23052d93
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Gem Physiology [Grants Regeneration (High-Mid), Immortality
    (Types 1 and 3), Shapeshifting, Size Manipulation, Body Control, Biological Manipulation, Fusionism,
    Self-Sustenance (Types I, II, and III), Automatic-adjustment to different strengths of gravity, Pocket
    Reality Manipulation (All Gems have a pocket dimension of infinite size contained within their gemstone),
    Sealing (Via Bubbles), and BFR (Via Bubbles)], Aura (Like other Diamonds, she should have an Aura
    that allows her to detect and harm entities on the astral plane, as well as to possibly enhance her
    physical attack power as we saw Blue Diamond do in "Reunited"), Large Size (Type 1), Corruption (Type
    2. Can corrupt/take over individual gems with her aura as well as corrupt a planet's worth of Gems
    alongside Blue and Yellow. Can also un-do this process alongside Yellow, Blue, and Pink/Steven), Light
    Manipulation/Energy Projection, Mind Manipulation/Possession, Power Bestowal (Grants those she possesses
    her own abilities alongside Flight and limited Intangibility), Resistance to Empathic Manipulation
    (Like Yellow, she should be able to resist Blue's empathic aura to a greater degree than other gems),
    Telepathy (Her aura should be stronger than Yellow's and Blue's, which could repel Steven in his astral
    form), and Gem Destabilization (Like Blue, she should resist Yellow's electricity-based gem destabilization)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
