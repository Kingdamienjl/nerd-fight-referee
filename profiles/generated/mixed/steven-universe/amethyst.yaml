    text: Above Average (More through experience than actual intelligence. She is
      the least intelligent of the Crystal Gems) Standard Tactics Out of the Crystal
      Gems, Amethyst is the least likely to rely on her weapon in combat, instead
      of relying on her martial art skills and enhanced physical prowess as a method
      of dealing with the minor threats through forceful punches and kicks. She also
      is a skilled wrestler, easily defeating all her human challengers in the Beach
      City Underground Wrestling league. Her fighting style can sometimes be considered
      reckless and foolhardy; in "Monster Buddies", she used her whip to pull the
      Centipeetle Mother towards her, knocking her and the other Crystal Gems down.
