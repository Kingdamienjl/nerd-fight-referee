- id: claim-weaknesses-e35ed2cd
  section: weaknesses
  axis: weakness
  text: "Emotionally sensitive, Sufficient damage to her physical form can revert her back to her vulnerable\
    \ gem form which can be broken and destroyed. Her powers are less effective on anything that has experienced\
    \ worse grief than her (although Lapis Lazuli was affected by it, it didn\u2019t take much of a toll\
    \ on her) and are seemingly ineffective on non-gem life-forms (Lion and Connie were unaffected by\
    \ her aura). Notable Attacks/Techniques: *Aura Projection: The Diamonds can project an aura around\
    \ them that they can control, they can either radiate it from their entire bodies or emit it from\
    \ specific parts of their bodies, usually their hands. Blue's aura is blue and has water-like properties.\
    \ Though intangible, Blue was able to break Lapis' water chains from her hands upon coating her hands\
    \ with her aura. She can use this as an offensive ability in both the physical and mental plane, as\
    \ seen when she was able to focus her aura and attack Steven as he was projecting. **Radiated Pathokinesis:\
    \ Blue Diamond can engulf a large area with her aura which induces sorrow to anyone exposed to it.\
    \ The induction is powerful enough to cause Gems exposed to the aura to break down and cry immediately\
    \ unprovoked, even affecting Yellow Diamond to a small degree. When she unleashed her grief over Pink\
    \ Diamond's death, she instantly rendered the Crystal Gems unable to fight. The aura is also potent\
    \ enough to split all but the most stable Gem fusions that get caught in it apart, as Alexandrite\
    \ came undone as soon as she was affected by the aura, while Garnet remained whole. The level of resistance\
    \ to the ability varies. Humans and animals are apparently not affected, as demonstrated by Connie\
    \ and Lion during Yellow and Blue's attack on Earth. Gems who feel that they have endured emotional\
    \ trauma worse than the feelings induced by the aura can resist it almost completely, as Lapis Lazuli\
    \ barely shed a tear upon being hit by the aura. **Concussive Blast: Blue Diamond is able to concentrate\
    \ her aura at a single point outside her body to launch long range energy blasts at her opponents.\
    \ *Energy Projection: She is shown to have some form of energy projection power that she uses for\
    \ battle. The energy can be molded into different projectiles, from spheres to a hail of lasers, or\
    \ combinations thereof. ==Notable Matchups== Victories: Losses: Inconclusive: {{scroll box|content={{reflist|2}}}}\
    \ {{Discussions|Blue Diamond|Blue Diamond}} Category:Characters Category:Steven Universe Category:Adaptation\
    \ Users Category:Aliens Category:Aura Users Category:BFR Users Category:Biology Users Category:Body\
    \ Control Users Category:Cartoon Characters Category:Corruption Users Category:Danmaku Users Category:Empathic\
    \ Manipulation Users Category:Energy Users Category:Fusionism Users Category:Gems Category:Genderless\
    \ Characters Category:Giants Category:Immortals Category:Large Sized Characters Category:Leaders Category:Neutral\
    \ Characters Category:Pocket Reality Users Category:Reformed Characters Category:Regeneration Users\
    \ Category:Royal Characters Category:Sealing Users Category:Self-Sustenance Users Category:Shapeshifters\
    \ Category:Size Users Category:Tragic Characters Category:Antagonists Category:Humanoid Characters"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-5a4e15d0
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Gem Physiology (Grants Regeneration [High-Mid], Immortality
    [Types 1 and 3], Shapeshifting, Size Manipulation, Body Control, Biological Manipulation, Fusionism,
    Self-Sustenance [Types 1, 2, and 3], Automatic-adjustment to different strengths of gravity, Pocket
    Reality Manipulation [All Gems have a pocket dimension of infinite size contained within their gemstone],
    Sealing and BFR [Via Bubbles]), Large Size (Type 1), Empathic Manipulation (Can project her emotions
    onto others, has shown the ability to do so with both Sadness and Joy), Aura (Allows her to detect
    and harm entities on the astral plane as well as seemingly increasing her physical attack power as
    she used it to break Lapis Lazuli's water-chains), Danmaku, Energy Projection, Corruption (When combined
    with White and Yellow she is able to corrupt an entire planet's worth of Gems), Weather Manipulation
    (Can create clouds that make Gems happy when they make contact with them), Pseudo/Reliant-Flight via
    riding on the clouds she creates. Resistance to Empathic Manipulation, Telepathy (Steven struggled
    to get near her in his Astral Projection form due to their aura), and Gem Destabilization (Resisted
    Yellow's electricity, which destabilizes a gem's form)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
