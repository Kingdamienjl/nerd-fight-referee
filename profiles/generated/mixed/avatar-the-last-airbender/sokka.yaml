  intelligence:
    text: Gifted (Sokka shows a remarkable proclivity towards science. He is adept at creating weapons
      from a variety of materials, and learned how to construct amateur explosives from his father, which
      he once used to simulate firebending. In another instance, Sokka used trickery and optical illusions
      to help his sister Katara fake the ability to earthbend. Sokka showed his incredible intellectual
      potential, capacity to learn, and critical thinking skills all throughout the friends' journey.
      He absorbed information quickly and completely and solved problems at an alarming rate. An example
      of this can be seen when he solved the dilemma of the hot air balloon, which stumped even the mechanist,
      shortly after having the concept explained to him. He incapacitated Wan Shi Tong by using the element
      of surprise and attacking him from above. In that particular encounter, Sokka's wit succeeded where
      Aang and Katara's bending had failed. It was Sokka who discovered that a solar eclipse disables
      a firebender's ability to bend and his idea to travel to Ba Sing Se and inform the Earth King. When
      Ba Sing Se and the Earth Kingdom fell, Sokka devised a new invasion plan to strike the Fire Nation
      on the Day of Black Sun with a group of their friends and allies they had made, rather than Earth
      Kingdom's armies. On the day of Sozin's Comet, he came up with a strategy that allowed himself,
      Suki, and Toph to bring down the entire Fire Nation airship fleet. Perhaps his greatest triumph,
      however, was his nearly single-handed defeat of Combustion Man by using his boomerang to hit the
      tattoo on his forehead to block the latter's chi flow. This action ultimately resulted in Combustion
      Man's demise, something that the combined efforts of all his friends failed to do. Sokka's leadership
      skills also evolved as the war ended)
    source_ids: *id002
    confidence: 0.95
