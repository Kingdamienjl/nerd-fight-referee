  intelligence:
    text: Gifted (Suki has shown to be exceptionally skilled in martial arts, showing a natural aptitude
      for it from a remarkably young age. Her skill and knowledge have made her an effective leader for
      the Kyoshi Warriors, aiding in various different ways throughout the Earth Kingdom. When fighting
      against Azula, Mai, and Ty Lee with her Kyoshi Warriors, she was the last of the captured, showing
      her skill as she was fending off a Firebending prodigy and two skilled Non-Benders. Despite initially
      losing to Ty Lee in a fight, she managed to train herself to match Ty Lee's style of fighting (which
      revolves around Chi-Blocking). Picked up how to do Chi-Blocking relatively fast from Ty Lee after
      the hundred-year war. Effectively taught Sokka multiple fighting techniques she had known in a short
      time. Impressed Sokka with her talent and intelligence when she devised a plan to help a factory's
      Non-Benders become good in the art of Chi-Blocking. Her teachings of the basic applications of Chi-Blocking
      to an entire army of Non-Benders impressed even Aang. Suki's general combat intelligence is highly
      respected overall, helping Non-Benders especially under her tutelage to impress Benders and Non-Benders
      alike)
    source_ids: *id002
    confidence: 0.95
