- id: claim-weaknesses-0adc92c0
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Fans: Her fans act as an extension of her body for
    her fighting style. They help with her offensive measures as they can be used for longer-ranged strikes
    and even Chi-Blocking. Their utility also complements her defense as well such as fanning away flames.
    *Shields: Concealed in her bracers, they can unfurl and form shields. These shields help Suki defensively
    by blocking melee attacks and long-range projectiles. They compliment her fighting style, which revolves
    around waiting for openings to use an opponent''s force against them. *Katana: While she hasn''t shown
    much on-screen usage of it, it is something she carries around when in her Kyoshi Warrior outfit.
    She has used this for trying to overwhelm an opponent in melee and going for lunges. *Chi-Blocking:
    Learned from Ty Lee after the hundred-year war, she is able to effectively use Chi-Blocking. Chi-Blocking
    involves hitting a person''s pressure points in rapid succession. The pressure point strikes allow
    for her to paralyze her foes and temporarily disable the usage of their abilities as it disrupts the
    chi output. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Reflist|2}} {{Discussions}}
