- id: claim-powers-and-abilities-812cb0db
  section: abilities
  axis: hax
  text: 'Morphin Grid Energy (Zord Physiology/White Ranger), Enhanced Senses, Extrasensory
    Perception, Information Analysis, Instinctive Action, Non-Physical Interaction,
    Underwater Breathing (Type 2), Immortality (Types 1 and 2), Deconstruction, Existence
    Erasure, Reactive Evolution, Regeneration negation (High-Mid) and Resistance Negation
    (Should share similar capabilities with the Thunderzords and the White Ranger)
    Innate abilities plus Bodily Weaponry (I; Its claws can be used in combat), Body
    Control (It can freely alter its structure Tokuma''s Super TV Graphics Books for
    Mighty Morphin Power Rangers vol 3), Sound Manipulation, possibly Empathic Manipulation
    (Can create sonic attacks via roaring Mighty Morphin Power Rangers S2 Ep18. Said
    sonic blast is stated to be able to shatter the will of its foes Power Rangers
    Collectible Card Game #56 ), Statistics Amplification (The White Tigerzord can
    concentrate its energy for more powerful attacks Mighty Morphin Power Rangers
    S2 Ep42), Healing (The Thunderzords contain systems that heal and re-energize
    them although it does take time for the healing to kick in Mighty Morphin Power
    Rangers S2 Ep19), Radiation Manipulation, Adaptation, Time Travel, Portal Creation
    (The Thunderzord''s power can use the radiation around them. Through residual
    chronal radiation, the Thunderzords were able to create a time hole Saban''s Mighty
    Morphin Power Rangers 1995 issue 2) and Transformation (Can transform into Warrior
    Mode) Innate abilities plus Accelerated Development, Statistics Amplification,
    Healing, Body Control, Radiation Manipulation, Adaptation, Time Travel and Portal
    Creation (Same as before), Information Analysis (Capable of analyzing and reading
    Tommy''s move so it can replicate them in battle ), Water Manipulation, Fire Manipulation,
    Metal Manipulation and Earth Manipulation (The White Tigerzord Warrior Mode contains
    different orbs inside its cockpit which can be used offensively against the enemy.
    The fire orb can be used to breath fire and burn the enemy . Although unlike the
    fire orb, the remaining orbs which consist of water orb, moon orb, sun orb, metal
    orb, earth orb and wood orb were never used), Regeneration Nulification (Low-Godly;
    Destroyed the Hatchasaurus who could Mighty Morphin Power Rangers S2 Ep23 reform
    himself from nothing after it was erased by the Dino Megazord Mighty Morphin Power
    Rangers S1 Ep36), Metal Manipulation and Fusionism (Took Grace''s Mechazord and
    fused with it Saban''s Go Go Power Rangers issue 31) Those of Warrior Mode plus
    Bodily Weaponry (IV; Its right arm have been replaced by a sword), Energy Manipulation
    (Can cover his attacks in energy to increase its power output so it can be used
    as a finisher . Has a canon that creates energy blasts Mighty Morphin Power Rangers
    issue 34) and Explosion Manipulation (Has a missile launcher that fires explosive
    projectiles ) Those of Warrior Mode plus Deconstruction, Existence Erasure and
    Fire Manipulation (The Mega Tigerzord will engulf the Firebird Thunderzord in
    flames and will land a devastating attack to the enemy, completely erasing them
    ), Illusion Creation (The Lion Thunderzord can create illusions to confuse Zedd''s
    monsters Cardzillion: Mighty Morphin Power Rangers Series 1 #28), Gravity Manipulation,
    Telekinesis (The Unicorn Thunderzord can overcome gravity Cardzillion: Mighty
    Morphin Power Rangers Series 1 #30 and make objects levitate ), Attack Reflection,
    Energy Manipulation and Forcefield Creation (The Mega Tigerzord can generate an
    energy field that can reflect attacks back at the opponent Mighty Morphin Power
    Rangers S2 Ep51) Shares the same resistances with the rest of the Thunderzords'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
