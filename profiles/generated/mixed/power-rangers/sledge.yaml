- id: claim-standard-equipment-d45305f7
  section: equipment
  axis: equipment
  text: His ship, which is strong enough to haul the entire earth. The ship also comes equipped with the
    "Magna Beam", which is a beam that is fired so fast that the Rangers barely have any time to react
    to it and can make monsters it hits grow to immense sizes. Briefly had a blaster that was empowered
    by the Purple Energem, this weapon was strong enough to overpower Heckyl. Sledge is also covered head
    to toe in a special type of alien armor. While said armor is old, worn and not as durable as it once
    was, the armor is still capable of shrugging off attacks from characters who are easily Large Planet
    level.
  source_ids: *id003
  decisive: false
  status: unverified
