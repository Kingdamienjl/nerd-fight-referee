- id: claim-weaknesses-b9c3e2ba
  section: weaknesses
  axis: weakness
  text: 'Large amounts of Dimensional Travel can weaken it and strain it. Because of the contradiction
    of having two simultaneous copies of the same power, Rangers with the exact same power existing simultaneously
    will eventually strain the portion of the Grid channeling it and kill both. Notes: As Power Rangers
    as a verse is under massive revisions, should be noted that the profile should not be used in vs matches
    till the revisions end As the Morphin Grid has been incosistent until now in the Power Rangers franchise,
    anything that involves the Grid must be evaluated carefully'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-78efaeaa
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Conceptual Manipulation (Type 1), Abstract Existence (Type\
    \ 1, exists as a fundamental force comparable to space-time or relativity which exists as the energy\
    \ all life shares. It is also completely independent from the multiverse it governs as it is seen\
    \ multiple times. An example would be Drakkon's multiverse destruction not being able to affected\
    \ the Grid), Existence Erasure (After tapping into a small portion of the Morphing Grid, Venjix could\
    \ erase Rangers from existence), Life Manipulation (Is the fundamental energy of life. Without the\
    \ presence of the Grid, all life and eventually existence itself would decay and collapse), Plant\
    \ Manipulation (Using its power, Alpha 5 could create many flowers), Creation (A small amount of Grid\
    \ Energy could create various devices), Acausality (Type 4; The Emissaries Three, who exist as part\
    \ of the Grid, see linear time as a limited, meaningless viewpoint, and see the fourth dimension of\
    \ time as limited), Clairvoyance and Precognition (With only a small amount of leftover Grid energy,\
    \ it\u2019s physical rock manifestation allowed for one to see the past, present, and future), Time\
    \ Manipulation (Split a single timeline\u2019s various points into separate timelines to create a\
    \ small multiverse), Power Bestowal (All Power Rangers draw and are granted power from the Grid),\
    \ Energy Manipulation (Small portions of its energy can be used as enough power to create unlimited\
    \ clean energy. Larger amounts like those in the Shattered Star could likely destroy the multiverse),\
    \ likely many more (all Power Ranger abilities channel the Grid), Resurrection (The Grid\u2019s energies\
    \ brought Gem and Gemma back to life after they were erased by Venjix)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
