- id: claim-powers-and-abilities-157d9913
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Longevity, Weapon Mastery (As showcased here Super Dino
    Charge episode 15), Smoke Manipulation and Resurrection (Doomwing can release a smoke from his sword
    that allows him to resurrect already destroyed monsters Super Dino Charge episode 15), Paralysis Inducement
    (Doomwing''s energy slash was able to paralyze Riley making incapable of movement and thus knocking
    him out for an entire day Super Dino Charge episode 15), Attack Reflection (All weapons in Dino Charge
    can reflect attacks Dino Charge episode 1 Dino Charge episode 12), Power Mimicry (Copied and mastered
    all of Zenowing''s techniques Super Dino Charge episode 15), Energy Projection (Can send energy attacks
    from his Fire Sword, he can also create his very powerful Doom Slash which is a counteraprt to Zenowing''s
    Silver Prism Slash Super Dino Charge episode 15), Electricity Manipulation (His attack can be electricity
    based Super Dino Charge episode 14), Fire Manipulation (He creates his Doom Slash by egulfing his
    sword in flames Super Dino Charge episode 15), Statistics Amplification (Can temporary increase his
    speed so he can strike his opponents without them having the proper chance to react Super Dino Charge
    episode 15), Regeneration (Mid-High: Instantly regenerated after being disintegrated Super Dino Charge
    episode 14), Self-Sustenance (Type 1: All monsters in Dino Charge are fine in outer space), Flight
    (Can use his wings to fly Super Dino Charge episode 14, should be comparable to Zenowing who can fly
    in space), Size Manipulation and Large Size (Type 1: Via calling upon the Magna Beam, Doomwing can
    grow giant and comparable in size to that of the Megazord Super Dino Charge episode 14) and Resistance
    to Deconstruction (Comparable to Lord Arcanon and Singe who are unaffected Super Dino Charge episode
    10 by Heckyl''s deconstruction), Electricity Manipulation (Like every other Dino Charge monster he
    can take the electricity attacks of the Gold Ranger), Fire Manipulation (Fine inside Singe''s Super
    Dino Charge episode 13 ship which was compared to a burning meteor Super Dino Charge episode 4, can
    take Heckyl''s attacks which are hot enough to melt metal) and Space Radiation (All monsters in Dino
    Charge are fine in outer space) Doomwing''s abilities that he lost after he and Zenowing got separated
    are the following: Zenowing''s and the Silver Dino Charge Ranger''s abilities'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
