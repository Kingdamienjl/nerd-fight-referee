  description: 'Resistance to Light Manipulation (Those saturated with void energy
    can see perfectly in any amount of light without being blinded) * Space Survival
    (All evil space aliens can operate in space) * Self-Sustenance (Types 1, 2 and
    3; Ecliptor''s body physiology allow him to act indefinitely without the need
    of air, water, food or sleep) * Enhanced Senses (Can hear sounds in space. Can
    hear spacecrafts flying through space and can detect their destination) * Martial
    Arts (Ecliptor can hold his own against Zhane in hand to hand combatPower Rangers
    In-Space Ep21; Red with Envy. * Weapon Mastery (Fought against Darkonda to the
    deathPower Rangers In-Space Ep27; Astronema Thinks Twice) * Fire Manipulation
    (Capable of breathing firePower Rangers In Space Episode 5; Never Stop Searching)
    * Stealth Mastery (Was able to hide from Andros despite his giant size at the
    time) * Illusion Creation (Capable of casting illusions upon others, making them
    see seven Ecliptors"Power Rangers In Space Episode 3; Save Our Ship) * Duplication
    (Capable of creating a shadow clone that shoots energy beams from its eyes. He
    can also create a shadow clone of just his head) * Electricity Manipulation (Ecliptor
    is capable of projecting electricity from his eyes that can restrain and bind
    others) * Regeneration (High and non-battle applicable; Returned after being destroyed
    by the Power Rangers) * Body Control and Flight (Can detach his head from his
    body and have it fly around to attack his enemies) * Perception Manipulation (Can
    project himself in the skyPower Rangers In Space Episode 8; When Push Comes to
    Shove) * Danmaku and Energy Projection (Can continuously project many energy blasts
    from his eyes) * Attack Reflection via his Sword (His sword can reflect attacks)
    * Technology Manipulation (Capable of traversing through computers and the internet)
    * Size Manipulation (Can freely change his sizePower Rangers In-Space Ep40; The
    Impenetrable Web) *Accelerated Development (Passive, Training and Battle; Physical
    Stats: Capable of catching up to the ever increasing strength of the Power Rangers.
    He was able to destroy Darkonda with 3 energy blasts despite not being able in
    earlier encounters) Evolved= All previous plus * Attack Reflection (Passive; His
    new body passivelyPower Rangers In Space Episode 7; A Ranger Among Thieves reflects
    attacks) * Additional Electricity Manipulation (He can project electricity from
    his hands which also allow him to "grab" and ragdoll the opponent around) *Explosion
    Manipulation (Can make others explode, similar to the Power Rangers) Reprogrammed=
    All previous plus * Cyborgization (Partial) Red= All previous enhanced plus *
    Flight (Can freely fly through space and sky) *Elemental Manipulation and Damage
    Boost (Fire, Thunder and Water; He can cover his sword in flame, thunder or water
    to deal extra elemental damage) *Poison Manipulation, Extreme Cold and Radiation
    Manipulation (Monsters can operate on Centauri b with no issuesPower Rangers In
    Space Episode 24; Zhane''s Destiny. The planet has X-ray and extreme ultraviolet
    radiation 60 times that of earth and is filled with toxic gasses. The planet also
    has temperatures of -39 celsius) *Fusionism via Supernatural Willpower (Forced
    his way out after Darkonda fused with him) * Transmutation (The Megazords cannot
    transmute him into energyPower Rangers In-Space Ep10; The Wasp With a Heart) *
    Status Effect Inducement and Sleep Manipulation (Due to his mineral physiology,
    Ecliptor cannot be put to sleep, cannot suffer hearing loss and cannot be stunned)'
