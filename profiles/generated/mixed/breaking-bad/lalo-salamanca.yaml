  attack_potency:
    text: Street level (Demonstrated to be physically comparable to his cousins, such
      as Tuco Salamanca, who knocked out Mike Ehrmantraut and beat a street thug to
      death.Breaking Bad Season 2 Episode 1, "Seven Thirty-Seven" Burst through a
      ceiling panel. Sliced off Casper's foot with a single swing of an axe while
      being injured moments priorBetter Call Saul Season 6 Episode 6, "Axe and Grind"),
      higher with firearms
    source_ids:
    - vsbattles-lalo-salamanca-breaking-bad
    confidence: 0.6
