  intelligence:
    text: 'Gifted (Despite his comical and sleazy facade, Saul is an exceptional lawyer and conman. For
      years, Jimmy consistently scammed enough people to make a living off of cons alone, with Marco Pasternak,
      a highly skilled conman in his own right, viewing Jimmy as far superior to him. As a lawyer, he
      was able to match wits with his older brother Chuck, a highly successful lawyer who Howard referred
      to as the "greatest legal mind [he] ever knew", eventually outsmarting and humiliating him in court.Better
      Call Saul S3E5: Chicanery Faked countless letters and impersonated multiple people with dozens of
      phones in order to get Huell out of jail.Better Call Saul S4E8: Coushatta Without Saul''s help,
      Walter White''s meth empire never would have gotten anywhere near the heights it reached at its
      peak, and Walter himself likely would have been caught or killed within a short period of time.
      After being caught and charged for his involvement in Walter''s meth empire, he was able to talk
      a sentence of 200 years in a maximum security prison down to 7 years in a prison of his choosingBetter
      Call Saul S6E13: Saul Gone)'
    source_ids: *id002
    confidence: 0.95
