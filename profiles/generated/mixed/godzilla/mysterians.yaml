- id: claim-weaknesses-2b09b25d
  section: weaknesses
  axis: weakness
  text: 'They are arrogant and underestimate their opponents. As a result of the nuclear war which destroyed
    their planet, the Mysterians'' bodies are ravaged with Strontium-90, causing roughly 80% of the newborn
    population to be horribly disfigured. Even the adult Mysterians are affected by Strontium-90, leaving
    their bodies covered in keloid scars and forcing them to wear full bodysuits and helmets to stay alive.
    The Mysterians are apparently weak to high temperatures, as the temperature inside their dome is considerably
    lower than the outside temperature. Some Mysterians move considerably slower than humans, a side effect
    of living for many generations in the low gravity of Mars. Notable Weapons and Technology: Moguera_render.png|MOGUERA
    Mysterian_Nuke_B.jpg|MYSTERIAN NUKE Mysterians_Lasers.jpg|MYSTERIAN GUNS Mysterian_ustation_022.jpg|MYSTERIAN
    STATION Mysterian_universe_ship_02.jpg|MYSTERIAN UFO Mysterian_dome_022.jpg|MYSTERIAN DOME * Moguera:
    One of the weapons of the Mysterian invaders, Moguera was unleashed in Japan, where it destroyed a
    village by triggering severe earthquakes while underground. Moguera soon surfaced and began rampaging
    through the countryside before the JSDF blew up a bridge as the machine was crossing it, destroying
    Moguera. The Mysterians would deploy a second Moguera to defend their dome when the Earth Defense
    Force began attacking it with Markalite Cannons. * Mysterian Nuke: Fifty-thousand years ago, the Mysterians
    were a thriving technologically advanced civilization that inhabited the planet Mysteroid, located
    between Mars and Jupiter. A nuclear war broke out between the Mysterians, and the entire planet was
    destroyed as a result, leaving behind only several smaller asteroids. * Mysterian Guns: They can shoot
    lasers enough strong to obliterate humans. * Mysterian Station: In order to journey to the planet
    which they so desired to conquer, the Mysterians used their universe station as a means of transport
    for their many ships and citizens. This ship served as the last home of the dwindling race since they
    had moved from Mars. When they arrived at their destined location, the space station dispatched a
    few of their own ships to the Earth''s surface, undetected. Their long-awaited invasion had finally
    begun... * Mysterian UFO: Capable of space travel; flight on earth at Mach 3; can fire a Pulse Energy
    Ray. * Mysterian Dome: In order to initiate their invasion of the Planet Earth, the Mysterians constructed
    a hidden underground base in the Mt. Fuji area of Japan. Without the denizens of Earth knowing their
    plans, they constructed a massive, burrowing dome as protection for their subterranean domain. Traps
    were situated around the dome soon afterward, and the base was completely guarded against attack (See
    Mysterian Dome).'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
