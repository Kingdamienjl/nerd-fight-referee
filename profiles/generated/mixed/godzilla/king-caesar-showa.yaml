- id: claim-weaknesses-65eb4c59
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks and Techniques: King_caesar_1974_eye_prism.jpg|Reflective Prism
    Eye *: The Okinawa deity was equipped with a Prism Eye. This is a "u" shaped prism that is located
    behind the creature''s eyes, with the end points being each eyeball. As a result, energy would travel
    through one eye, reflect off the walls inside the Prism Eye, and be released at the target from the
    opposite eye. In addition, the creature has specialized half-mirrored retinas under its eyebrows,
    which draw in light attacks around the eyes so that the Prism Eye can reflect them. This Prism Eye
    amplifies the attack power of the original beam, shooting back a ray that is roughly 10 times as powerful
    as the source. *Acrobatics: King Caesar was built with powerful legs. This enabled the golem-like
    creature to leap incredible distances, over 900 meters.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
