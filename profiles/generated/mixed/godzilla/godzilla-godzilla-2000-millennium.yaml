  attack_potency:
    text: At least Solar System level (Was stated to be the strongest Godzilla from
      the 20th Century making him to scale above Burning Heisei Godzilla and Rebirth
      Godzilla Jr.'s peak. His body releases radiation at a level that is not possible
      in the natural world. The most powerful radiation source in the universe is
      gamma-ray bursts (GRBs), which are extremely short-lived bursts of high-energy
      radiation, which produces at least 1 Foe or 10 Foe of energy and the strongest
      GRB being 12 KiloFoe, which can generate this level of energy through luminosity
      alone)
    source_ids:
    - mediawiki-87315
    confidence: 0.6
