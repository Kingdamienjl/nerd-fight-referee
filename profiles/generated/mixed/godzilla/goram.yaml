  axis: weakness
  text: 'None Notable Goram Fire.gif|DUAL FLAMETHROWERS Goram pistolfire.gif|DUAL PISTOL GUNS *Cannon
    Pistols: Strangely, the Terror-Beast is equipped with a dual set of 40-inch modified cannon pistols.
    It stores one on each side of its hips, just low enough to effectively reach and pull them out or
    shoot them quickly. The shots fired from each pistol acted much like a cannon, causing small explosions
    on whatever they hit and shooting large plumes of dirt upon hitting the ground. *Dual Flamethrowers:
    Within each of its sets of jaws, Goram is equipped with flamethrowers. The flames spat forth from
    each muzzle are capable of setting fire to numerous acres of land with a single sweep while the blaze
    was also able to cling to Zone Fighter for a short amount of time.'
