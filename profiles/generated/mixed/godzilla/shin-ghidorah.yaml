- id: claim-weaknesses-83bb27d9
  section: weaknesses
  axis: weakness
  text: 'While his hide is resistant to heat enough to survive Shin Godzilla Radioactive Ray Flow, his
    insides are somewhat more vulnerable. Feats: Casually did this. Notable Attacks and Techniques: Shin
    Ghidorah Gravity Beams Z.gif|Gravity Beams Shin Ghidorah Forcefield Z.gif|Energy Shield Shin Ghidorah
    Telekinesis Z.gif|Telekinesis *: King Ghidorah''s trademark attack. He can fire Gravity Beams from
    his mouth. He can use it both to destroy targets and pick them up. *Electric Bite: King Ghidorah can
    electrocute his opponent by biting them. *Hurricane Winds: King Ghidorah can cause wind storms with
    his wings. *Energy Shield: King Ghidorah can create a spiritual energy shield around himself to block
    attacks. *Telekinesis: From emitting light from his wings, King Ghidorah releases the objects lifted
    in the air by his Gravity Beams, sending them back to the ground. He also appears to control where
    they will land, as seen by him flinging debris at Godzilla. *Flight: King Ghidorah has two massive
    wings to fly at high speeds. While flying, Ghidorah moves in a serpent-like style.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
