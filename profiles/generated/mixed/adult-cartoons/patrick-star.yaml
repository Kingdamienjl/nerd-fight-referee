  intelligence:
    text: "Varies, normally Below Average. Extraordinary Genius in his best showings\
      \ (Patrick's exact intelligence is inconsistent and depends on the joke or plot.\
      \ Is usually low, but once in a while gets a random stroke of genius, such as\
      \ when SpongeBob and himself were trapped inside Squidward, and he came up of\
      \ the idea of Squidward burping, where he said \"capturing the Co2 in the ballast\
      \ tanks, refiring the engine, and riding the shockwave out of there\". In the\
      \ first season, he was more intelligent and capable of giving advice, but he\
      \ has become more stupid over the course of the series, such as thinking The\
      \ Krusty Krab's customers were calling the wrong number, denying the fact his\
      \ own wallet belongs to him, and struggling to order food. It has been noted\
      \ that he once forgot how to eat and he sometimes has trouble with basic things\
      \ like writing his own name down or opening a jar (even thinking he broke it\
      \ after he took the lid off), and in No Hat for Pat, he stated that he usually\
      \ forgets how to stand whenever he's nervous. He has called a pencil a \"writing\
      \ stick\" and his eyeballs his \"looking holes\". Often oblivious and has a\
      \ poor memory, once forgot he and SpongeBob were looking for Gary and when he\
      \ remembered, instead of telling SpongeBob where he had previously seen Gary\
      \ that day, he told him about basal wood, it was shown in an episode that Patrick\
      \ is so dumb that his brain doesn't even work. Like SpongeBob, he is rather\
      \ gullible and na\xEFve, although he is aware of his own stupidity, as he admitted\
      \ to SpongeBob in The Card. Patrick also stated to Squidward \"It varies\" when\
      \ asked how dumb he was. He figured out how to damage an enemy after a baseball\
      \ bat hit failed which, while not impressively intelligence, shows he can perform\
      \ basic problem-solving. Patrick has been shown to be a competent driver and\
      \ a skilled drummer, and even without Brain Coral, Patrick still contributed\
      \ with SpongeBob in scientific pursuits like cloning, to the point where he\
      \ invented a parallel universe in a mirror. It is revealed in the episodes Naughty\
      \ Nautical Neighbor and Squidward the Unfriendly Ghost that he knows how to\
      \ administer C.P.R. Patrick has shown knowledge in wrestling, and in Karate\
      \ Star, he was said to be a karate genius, having made perfect cuts with his\
      \ technique. Defeated a world-wrestling champion. Stomped a pumpkin monster\
      \ in unarmed combat. Consistently fights SpongeBob, Squidward, and even Sandy).\
      \ Genius after reading a bunch of books and Extraordinary Genius with Brain\
      \ Coral (He was portrayed as smarter than Sandy, and he even insinuated that\
      \ she was dumb around him)"
    source_ids:
    - vsbattles-patrick-star-adult-cartoons
