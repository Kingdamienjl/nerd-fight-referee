- id: claim-weaknesses-ad11cd31
  section: weaknesses
  axis: weakness
  text: 'Continual damage to her Aura will cause it to decay to the point where she can be left open to
    more significant damage. Aura''s durability is cumulative; it will deplete with each attack she takes
    and can be brought down by characters of similar strength. Semblances drain Aura by a small amount
    and without it they cannot be used until it is recharged. Constant exposure to extreme temperature
    can drain the user''s Aura. Notable Attacks/Techniques: * Omen: Raven''s main weapon of choice, which
    is armed with a sheath that has a rotary chamber filled with different types of Dust blades. By reattaching
    the handle to the sheath, Raven can interchange, or if need be, replace the Dust blade. The blades
    are telescopic, which allows them to be approximately twice the length of the sheath. She tends to
    most often use the blade made of Red Dust, though she has also used others. The colors seen so far
    in combat include: Red, Blue, Yellow, Gray/Black, and Green. The Dust blades, though powerful, can
    be broken if struck several times or hard enough. * Kindred Link: Raven''s Semblance allows her to
    create portals in the vicinity of people she shares a bond with. Though not combat applicable, she
    can use these portals for quick appearance and hasty retreats. Other people are also able to pass
    through these portals. So far, Raven has been able to create portals to Taiyang, Qrow, Yang, and Vernal.
    * Transformation: Raven has the ability to turn into a corvid, specifically a raven, which was granted
    to her by Ozpin at some point prior to the start of the series. In this form, she is capable of flight
    without her Maiden powers, and can cover large distances. She mainly uses it for stealth purposes.
    * Magic: As the Spring Maiden, Raven is the bearer of a magical power that has existed in Remnant
    for millennia. With it, she has control over the elements and weather, allowing her to perform feats
    such as summoning lightning, amplify her strikes with electricity, create widescale storms and strong
    gusts of wind, as well as the ability of flight. However, Raven is most proficient in using ice, as
    evident in her battle with Cinder. She can create and shape ice to her will, such as freezing opponents,
    shooting ice spike projectiles, creating platforms and wield a variety of ice-based weaponry. This
    ability also allows her to open the vault in Haven Academy. ==Notable Matchups== Victories: Losses:
    Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters
    Category:RWBY Category:Accelerated Development Users Category:Air Users Category:Antagonists Category:Aura
