- id: claim-weaknesses-4e40c502
  section: weaknesses
  axis: weakness
  text: 'Continual use of her Aura will cause it to decay to the point where she can be left open to more
    significant damage. Aura''s durability is cumulative; it will deplete with each attack she takes and
    can be brought down by characters of similar strength. Semblances drain aura by a small amount and
    without aura they cannot be used until the user''s aura is recharged. Constant exposure to extreme
    temperature can drain the user''s aura. Notable Attacks/Techniques: * Polarity: Pyrrha''s Semblance
    is Polarity, the ability to control magnetism. Pyrrha''s semblance is not affected by the number of
    objects she uses it on, and she has shown the ability to remotely manipulate multiple objects at once,
    including objects several times larger and heavier than herself, and move them at high speeds. As
    shown in "Best Day Ever", she does not need to come in contact with a metal object in order to manipulate
    it, and she can manipulate normally non-magnetic metals, such as aluminum. In most combat situations,
    Pyrrha does not go out of her way to broadcast her Semblance''s abilities. Instead, she uses it only
    to make very subtle changes of movement for her own weapons and sometimes her opponent''s weapon to
    affect the course of a battle. This gave her the psychological edge of appearing to be invincible
    in the eyes of most people. However, she has the ability to use her power offensively, as she can
    use her Semblance to create a magnetic pulse. * Pyrrhouette: Pyrrha uses her magnetism to orbit her
    spear around her while spinning, ending with a devastating circular slash. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters
    Category:RWBY Category:Female Characters Category:Cartoon Characters Category:Internet Characters
    Category:Heroes Category:Good Characters Category:Humans Category:Teenagers Category:Spear Users Category:Magnetism
    Users Category:Hunters Category:Schoolgirls Category:Shield Users Category:Sword Users Category:Gun
    Users Category:Weapon Masters Category:Aura Users Category:Forcefield Users Category:Statistics Amplification
    Users Category:Enhanced Senses Users Category:Extrasensory Perception Users Category:Non-Physical
    Interaction Users Category:Accelerated Development Users Category:Acrobats Category:Regeneration Users
    Category:Martial Artists'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
