- id: claim-standard-equipment-2590074b
  section: equipment
  axis: equipment
  text: "*Mil\xF3: Pyrrha's signature weapon, a weapon capable of transitioning between a javelin, a xiphos,\
    \ and a rifle. In javelin form, the rifle barrel becomes part of the body and Pyrrha can use it to\
    \ fire the javelin, giving it a burst of increased range, speed, and power. * Ako\xFAo\u0331: Pyrrha's\
    \ secondary weapon, a Greek Dipylon-style shield that she carries on her left arm. Ako\xFAo\u0331\
    \ has a razor-sharp edge and can be used as a thrown weapon, like a large discus. Pyrrha is skilled\
    \ at wielding Ako\xFAo\u0331 to the point where she can casually judge her throws well enough to ensure\
    \ that her shield returns to her upon its rebound. The shield is highly durable, able to withstand\
    \ massive concussive force, break through several trees consecutively, withstand the attack of a Death\
    \ Stalker's claw, and effectively function as a launch surface to amplify Nora Valkyrie's jump-attack,\
    \ while also protecting Pyrrha from a contact shot with one of Magnhild's grenades."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
