- id: claim-weaknesses-891416c4
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Magic: Salem, alongside the Maidens and Ozma, are among
    the few living characters who can perform True Magic, which was mostly lost after the God of Darkness
    erased the previous iteration of humanity. In battle, she commonly uses energy based attacks. However,
    she can also utilize elemental powers such as fire, electricity or even unconventional ones like smoke.
    **Grimm Control: When the Gods wiped out humanity and left the planet, Salem jumped into the Grimm
    Pools in a last ditch effort to end her life. Instead, she was corrupted into a being of pure destruction
    with the ability to control the Grimm. Over the many millennia, she learned to master her new found
    powers, allowing her to not only alter the Grimm by giving them new abilities, but even create new
    ones to suit her needs. *Immortality: Due to her transgressions against the Gods, Salem was cursed
    with immortality, preventing her from being reunited with Ozma. This curse prevents her from aging
    and falling to injury, letting her recover from any physical damage so long as Remnant exists. ==Gallery==
    Divide (feat. Casey Lee Williams) When It Falls (feat. Casey Lee Williams) ==Notable Matchups== Victories:
    Losses: Mard Geer Tartaros (Fairy Tail) Mard Geer''s Profile (Speed are equalized, Salem had no Grimm)
    Inconclusive: Kamen Rider Ark-Zero (Kamen Rider) Ark-Zero''s Profile (High 6-C versions used. Speed
    equalized. Ark-Zero had no machines and Salem had no Grimm) ==References== {{scroll box|content={{reflist|2}}}}
