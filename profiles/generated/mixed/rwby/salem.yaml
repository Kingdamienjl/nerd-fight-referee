  stamina:
    text: 'Likely Infinite (As a "being of infinite life", Salem does not require rest. After being cursed
      by the Gods she spent millennia restlessly wandering Remnant, and has shown the ability to continue
      fighting even while severely physically injured, up to and including having her skull caved in and
