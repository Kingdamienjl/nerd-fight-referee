      Atlas Military, and fight a team of professional Huntresses all within the span of a single day
      without any signs of exhaustion,RWBY: Arrowfell as well as the King of Vale, who fought off an entire
      army on his own during the Great WarRWBY: World of Remnant, Episode 16: The Great War)'
