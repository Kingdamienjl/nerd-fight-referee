      with Hazel she outlasted him to the point that he was physically incapable of moving due to exhaustion
      while she was unfazed.RWBY Volume 8 Episode 7 Should be vastly superior to the likes of Atlas Arc
      Teams RWBY, who can fight on and off for two days straight with minimal restRWBY Volume 8 and traverse
