  intelligence:
    text: Genius. Salem has lived for countless eons, during which she acquired extensive knowledge of
      the nature of Aura and Dust, as well as an understanding of human nature, society and history. She
      is also extremely knowledgeable on the workings of Grimm, learning about their biology to not only
      alter them, as seen with the winged Beringels, but can graft them to humans, which she did to Cinder
      by giving her one to replace her missing arm. Furthermore, she used the knowledge gained to push
      past their limits by creating entirely new and unique ones to suit her needs, such as the Beetle,
      a Grimm capable of siphoning Maiden powers, Monstra, a mobile fortress to house an entire army,
      or The Hound, a fusion of Grimm with a living being. She is a master manipulator, able to instill
      fear in others and can sway even the most steadfast into giving up or even joining her. When Hazel
      Rainart came seeking revenge for his sister's death, she demonstrated her immortality, allowing
      him to kill her continuously until he broke and joined her side. She managed to turn Leonardo Lionheart,
      a member of Ozpin's group and one he trusted with guarding the Relic of Knowledge to her side and
      have him act as a mole, delivering information on the group and getting Cinder's team into Beacon
      Academy as infiltrators. Raven Branwen, another member, fled from it all after learning more about
      Salem and returned to her tribe. Even after becoming a Maiden, she still refused to fight, stating
      that there was no beating her. When she declared to James Ironwood that she was personally coming
      to Atlas to collect the Relics, he decided that the best plan was taking Atlas and fleeing instead
      of staying to fight, believing that even with the greatest military in Remnant they were no match
      for her.
    source_ids: *id002
    confidence: 0.95
