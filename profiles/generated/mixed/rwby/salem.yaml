- id: claim-powers-and-abilities-d5dba1cb
  section: abilities
  axis: hax
  text: '{{#tag:tabber| {{!}}-{{!}}Innate= *Superhuman Physical Characteristics *Genius Intelligence *Immortality
    (Types 1, 2, 3, and 8; Salem was cursed with immortality by the God of Light and God of Darkness,
    ensuring that she is unable to die so long as Remnant exists.RWBY Volume 6 Episode 3: God of Light:
    I have made you immortal. Salem: Immortal? God of Darkness: You cannot die. You cannot be with your
    beloved. Both Gods: So long as this world turns, you shall walk its face. God of Light: You must learn
    the importance of life and death. Only then may you rest.RWBY Volume 8 Episode 7: "So long as this
    world turns, you shall walk its face". That was the curse cast upon her. But if Salem can divide humanity
    beyond repair, and bring all four Relics together, she believes that maybe her curse will be broken.
    The Gods will rule against us and destroy Remnant, once and for all." Even when injured and regenerating
    she can still move and attack) **Regeneration (Low-Godly; Due to the curse placed on her by the Gods
    preventing her soul from reaching the afterlife, Salem is completely immortal, allowing her to regenerate
    from any kind of physical damage so long as Remnant exists. This includes regenerating from a sphere
    of energy,RWBY Volume 8 Episode 14 being reduced to ash twice, crushed by a meteor, countless failed
    suicide attempts,RWBY Volume 6 Episode 3: "Salem was a prisoner once again. Her fruitless attempts
    to reunite with Ozma eventually became nothing more than acts of spite and defiance against the Gods."
    and even falling into the Pools of Grimm, which were described as both a force of "pure destruction"
    and pools of "annihilation"RWBY Volume 6 Episode 3: "The God of Darkness. None dare to enter his home,
    as men knew what monstrosities emerged from his blackened pools of annihilation."RWBY Volume 6 Episode
    3: "She was wrong. This force of pure destruction could not destroy a being of infinite life.") **Self-Sustenance
    (Type 3; Stated by Jinn to be a being of "infinite life" and has never shown signs of needing rest)
    *Supernatural Willpower (Can endure enormous amounts of pain with no reaction. She was able to fight
    unimpeded with her torso split in half and her skull caved in,RWBY Volume 8 Episode 9 as well as being
    unbothered by stabbing herself through the stomach with a swordRWBY Volume 6 Episode 3) *Social Influencing
    (Is a master manipulator, who is not only capable of instilling fear in others to the point of them
    giving up, but can also convert them to her side) *Magic **Statistics Amplification (Magic is able
    to amplify the strength of a user''s abilitiesRWBY Volume 8 Director''s Commentary) **Extrasensory
    Perception (Sensed that Cinder was alive after the Battle of Haven, despite not being there and everyone
    else believing she was deadRWBY Volume 6 Episode 4) **Flight (Is capable of flight) **Telekinesis
    (Casually crushed a giant Nevermore. Her anger was enough to shatter all the windows in her council
    roomRWBY Volume 6 Episode 4) **Elemental Manipulation (Has access to elemental magic and mastery over
    the forces of nature) ***Air Manipulation (Manifested a tornado beneath her) ***Energy Manipulation
    (Able to conjure and fire blasts of energyRWBY Volume 8 Episode 4) ***Forcefield Creation and Electricity
    Manipulation (Created an electrified barrier around herself) ***Fire Manipulation (Can launch fireballs
    and waves of fire) **Clairvoyance (Viewed an ongoing battle with her crystal ball. Her Seers are used
    to keep tabs on the Grimm and act as her eyes in the worldRWBY Volume 4 Episode 3RWBY Volume 5 Episode
    2) **Smoke Manipulation, Shapeshifting, and Intangibility (Can create and shape smoke into various
    forms, such as the image of her daughters. She can also shapeshift and travel as a cloud of smoke,
    allowing her to bypass attacks) ***Inorganic Physiology (Type 1; As a cloud of smoke) {{!}}-{{!}}Grimm'
