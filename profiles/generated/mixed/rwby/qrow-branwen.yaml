- id: claim-weaknesses-36440e12
  section: weaknesses
  axis: weakness
  text: 'Continual damage to his Aura will cause it to decay to the point where he can be left open to
    more significant damage. Aura''s durability is cumulative; it will deplete with each attack he takes
    and can be brought down by characters of similar strength. Semblances drain Aura by a small amount
    and without them they cannot be used until it is recharged (Though in Qrow''s case this only applies
    to him actively focusing his Semblance as it is normally continually passively active). His Semblance
    can affect allies without his consent. Constant exposure to extreme temperatures will wear the user''s
    Aura out sooner than later. Notable Attacks/Techniques: * Harbinger: Qrow Branwen''s signature weapon,
    a hybrid shotgun-sword-scythe that can take on multiple forms; a compact storage mode, a single-edged
    greatsword, a shotgun, a tonfa, a scythe, and a war scythe. In its greatsword form, the barrels of
    the shotgun are situated on either side of the main blade, although it is unknown whether they are
    functional in this state. The top half of the blade can be retracted into its base, forming a more
    compact portable mode, which is how Qrow normally carries Harbinger outside of battle. Harbinger''s
    ranged mode, in which the blade folds forwards, makes the shotgun barrels more prominent, with the
    rounds having a buckshot-like spread. In its scythe form, the shotgun barrels are present in the middle
    of the head of the scythe, and the shotguns can rotate independently of the rest of the hilt and of
    each other. In the completed form the blade gained red sharpened edges on the inside, while the outer
    edge take on a serrated appearance due to the folding. Harbinger can also unfold to form a war scythe,
    similar to Crescent Rose, and can conversely partially convert Harbinger into its scythe form for
    use as a bladed tonfa to mix his combat with punches. * Misfortune: Qrow''s Semblance brings misfortune
    wherever he goes, and unlike most Semblances, his is almost constantly active, with random spikes
    leading to incidents ranging from things as minor and small as a glass being knocked onto the floor
    to things as significant as a blocked attack chopping off the corner of a building. His Semblance
    can come to his advantage in a fight, such as when it caused Tyrian to fall through the roof of a
    building. His Semblance does not discriminate on who it affects, which causes him to keep his distance
    from the people he cares about. He can also choose to amplify his Semblance when he wishes. * Transformation:
    Qrow has the ability to turn into a corvid, specifically a crow, which was granted to him by Ozpin
    at some point prior to the start of the series. In this form, he can fly long distances and use it
    for stealth purposes by hiding in plain sight. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters Category:RWBY
    Category:Male Characters Category:Internet Characters Category:Cartoon Characters Category:Game Characters
    Category:Comic Book Characters Category:Manga Characters Category:Good Characters Category:Tragic
