    Users Category:Gun Users Category:Aura Users Category:Forcefield Users Category:Statistics Amplification
    Users Category:Enhanced Senses Users Category:Extrasensory Perception Users Category:Non-Physical
    Interaction Users Category:Accelerated Development Users Category:Regeneration Users Category:Energy
    Projection Users Category:Probability Users Category:Supernatural Luck Users Category:Magic Users
    Category:Shapeshifters Category:Small Sized Characters Category:Flight Users Category:Acrobats Category:Stealth
    Masters Category:Twins'
