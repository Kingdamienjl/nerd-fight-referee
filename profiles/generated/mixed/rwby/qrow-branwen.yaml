  intelligence:
    text: 'Gifted (Despite his reputation as a frequent alcoholic, Qrow is nevertheless a very capable
      Huntsmen, able to match Winter Schnee, another professional Huntress and high-ranking Atlas official,
      in armed combat even while he was inebriated. His skill and power are so great that Mercury Black,
      a professional assassin was terrified of his presence and immediately fled on sight. Even among
      his peers, Qrow is a greatly formidable Huntsman, with the likes of James Ironwood and Arthur Watts
      being wary of his combat prowess and reluctant to engage him in battle. As revealed in RWBY: The
      Grimm Campaign, Qrow''s skills and prowess as a legendary Huntsman is in fact a worldwide, publicly
      known fact, to the point where Qrow is even seen as a celebrity. He is an excellent marksman, swordsman,
      and scythe wielder, expertly utilizing what Ozpin describes as "one of the most dangerous weapons
      known to man". Even when disarmed, he is proficient enough in hand-to-hand combat to fight opponents
      even as dangerous as Tyrian Callows, despite the latter''s status as Salem''s assassin and a lethal
      close-quarters fighter in his own right. Qrow is also highly skilled in stealth, having served for
      years as a reconnaissance agent for Ozpin, traveling the world for information on Salem and her
      forces, tracking down the holders of the Maiden powers without arousing any suspicion, and managing
      to follow Team RNJR for months without any of them noticing his presence despite Lie Ren''s extrasensory
      perception being able to sense people nearby. He even went so far as to kill entire hordes of Grimm
      that were stalking them without being detected)'
    source_ids: *id002
    confidence: 0.95
