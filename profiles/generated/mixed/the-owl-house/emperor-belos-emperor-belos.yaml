- id: claim-powers-and-abilities-9acc78d1
  section: abilities
  axis: hax
  text: Same as before to a greater extent, Body Control, Bodily Weaponry, Shapeshifting (Belos' unknown
    condition causes him to transform into sludge or a sludge-like appearance. Has shown control over
    his shapeshifting, however, and has used it to reshape his distended limbs into sharp blades and spikes),
    Artificial Magic (Does not perform basic spells like the spell circle and achieves magic through an
    apparatus, such as use of his mechanical staff or other devices. In spite of this, Belos is an adept
    in the practice, achieving a vast amount of skill, power, and knowledge with artificial magic that
    he is described as the most skilled and powerful Witch to ever live. Belos' magic seems unaffected
    by Luz's cape made of Witch's Wool supposedly capable of deflecting all magic), Telekinesis (Frequently
    uses telekinesis to move objects and people without touching them, signified by his gloves glowing
    red), Summoning (Belos is able to summon and command fleshy tendrils to bend and form claws. Summoned
    a massive worm-like creature during his fight with Luz), Teleportation (Shown to be capable of disappearing
    by melting into the floor to avoid attacks), Telepathy (Luz, Willow, and Gus heard his reprimanding
    voice when they were in the castle's artifact display), Earth Manipulation (Able to raise sharp spikes
    of rock up from the ground), Mind Manipulation (When Lilith presented her sister Eda in her cursed
    Owl Beast form, Belos hit Eda with some kind of spell from his staff which made Eda regain consciousness),
    Petrification (Turned one of the old Golden Guards into Stone and tried to do the same to Luz)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
