power_scale:
  tier:
    text: 'At least {{4-B}}, lower with his Gauntlet Name: Conquest, real name unknown
      (Implied to have once had one) Origin: Invincible Gender: Male Age: Far older
      than 2000 years old (Far older than Omni-Man, is likely as old as Thaedus, who
      sparked the Great Purge by murdering Lord Argall. Was present during the Scourge
      Virus) Classification: Alien (Viltrumite)'
    source_ids:
    - character-stats-profiles-invincible-user-requests
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: At least Solar System levelUpscales from 4.5557326001 MegaFoe (Far stronger
      than mid-series Invincible and possibly Omni-Man, due to the latter respecting
      him as a formidable, powerful warrior despite himself being considered one of
      Viltrum's most powerful soldiers. Mortally wounded Invincible during their rematch,
      leaving him in a comatose state for several months after ripping out his intestines.
      Casually tore through a Coalition of Planets warship which withstood the recoil
      of its own firepower, which is this powerful. Stronger than Thaedus, who is
      potentially precisely this many times weaker than Thragg. Comparable to his
      durability), lower with his Gauntlet (His gauntlet seems to be weaker than his
      normal arm)
    source_ids:
    - character-stats-profiles-invincible-user-requests
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Massively FTL+Massively upscales from 23.342548 Quadrillion C (Kept up with
      Invincible, Oliver, and Omni-ManDo not attempt to downgrade the speed of Viltrumites
      and other Invincible characters based off of these statements from the A - K
      Handbook of the Invincible universe. Not only is the idea that Viltrumites cannot
      immediately achieve near-light to FTL speeds on the atmosphere of a planet without
      damaging it repeatedly contradicted [I.E El Chupacabra dodging electricity which
      canonically moves at 60,000 miles per second, Cho blitzing the Immortal to Antartica
      before the latter can even throw a punch, Mark and Conquest fighting 5 minutes
      faster than what G.D.A satellites can detect, etc etc.], but statements from
      both issues of the Invincible Handbook were not all written by Robert Kirkman,
      rather a team of multiple writers, few of whom are involved with writing for
      the main run of Invincible. While the Handbook is still usable for context and
      exposition not given elsewhere in the series and/or that is not inherently contradicted
      by the comic's storyline, any implication that Viltrumites must first "accelerate"
      in the vacuum of space or require the usage of "space warps" to achieve FTL
      speeds or travel intergalactic distances is an idea not present or shown anywhere
      to be true in the source material for either the comics or TV adaptation of
      Invincible. Also do not attempt to downgrade Viltrumites on the basis that their
      MFTL+ showings are purely "movement speed" feats, as there are numerous instances
      of Viltrumites being able to both react to or attack Viltrumites or characters
      comparable to Viltrumites in movement speed whilst they are travelling at their
      explicit top speeds.. Tracked and locked onto a moving C.O.P ship)
    source_ids:
    - character-stats-profiles-invincible-user-requests
    confidence: 0.8
    notes: auto_repair source extraction
  durability:
    text: Solar System level (Viltrumites are considered virtually unkillable by the
      Coalition of Planets, with none of their weapons before Omni-Man and Space Racer
      joined their ranks being considered powerful enough to damage them, which would
      include their warships, which possess this much firepower. Endured and even
      no-sold attacks from Invincible. Completely undamaged by flying through and
      fragmenting the aforementioned warship, which would possess this much shear
      strength based on the cannon possessing the firepower which obliterated said
      Solar Disk possessing miniscule surface area in comparison to the rest of the
      ship)
    source_ids:
    - character-stats-profiles-invincible-user-requests
    confidence: 0.8
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range; Thousands of Kilometers with Shockwaves (Created a
      huge crater on Viltrum's surface)
    source_ids:
    - vsbattles-invincible
    confidence: 0.75
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (He can keep fighting even when he has broken bones and hold
