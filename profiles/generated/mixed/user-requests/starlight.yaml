      value: 'None notable | Cannot fight in spirit form in lower dimensions, and
        requires a physical vessel to not shatter it. Notable Attacks/Techniques:
        |-|Koyanskaya of Light= Authority: As a Divine Spirit, Koyanskaya possess
        Authorities, special powers distinct from Code Casts, Noble Phantasms, and
        Skills in that while they achieve results based on some logical process or
        principle, an Authority realizes a result simply because the user has the
        right to do so. Authorities are powers on the level of world construction,
        and can be powers such as event shifting, time manipulation, causality manipulation,
        manipulation of concepts they embody, kingdom-building and other powers on
        that level. The Gods originally used their Authorities during the Age of Gods
        to shape the world, build kingdoms and advance civilization. But as time went,
        humanity advanced to the point that Authorities became unnecessary. When summoned
        as a Servant, Koyanskaya cannot utilize her Authorities to their full potential
        without harming and straining herself. === Noble Phantasms === Iz Tula Seven
        Drive: Spiritron Skirt Recovery - Type 79 Misfortune-Launching Grand Shrine:
        The Noble Phantasm of Koyanskaya of Light, a C-rank Anti-World Noble Phantasm
        that represents her rejection of the divine virtues, or her antagonism against
        the holy ones. When using it, she summons the NF-79 Tactical Suppression Vehicle,
        the best weapon ever made by Tamamo Heavy Industries (an NFF subsidiary) wich
