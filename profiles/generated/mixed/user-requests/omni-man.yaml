    text: At least Multi-Continent level (Comparable to Conquest.Invincible Season
      4, Episode 5 - Give Us a Moment Was able to devastate the Flaxan homeworld by
      flying around at high speed. Maintains a reputation as "the great Nolan" even
      amongst veteran Viltrumites, implying he is exceptionally strong by comparison,
