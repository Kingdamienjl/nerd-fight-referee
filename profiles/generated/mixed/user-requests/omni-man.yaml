    notes: auto_repair source extraction
  speed:
    text: Massively FTL+ (Flew all the way from Earth to Thraxa. Considerably faster
      than Invincible and pre-recovery Allen, who can travel to the Moon in seconds
      and Mars in under an hour. Flew fast enough to ignite the air around him while
      decimating the Flaxan homeworld32,698,413c)
    source_ids:
    - vsbattles-omni-man
    confidence: 0.8
    notes: auto_repair source extraction
  durability:
    text: At least Multi-Continent level (Sustained only a minor nosebleed from an
      explosion of a space station visible from space and can withstand the recoil
      of his own flight. Withstood hits from Lucan and Vidor. Took many hits from
      his Viltrumite executioners and still got up to fight after breaking freeInvincible
      Season 3 Episode 4 - You Were My Hero)
    source_ids:
    - vsbattles-omni-man
    confidence: 0.8
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range; Hundreds of Kilometers with Shockwaves (Managed to
      destroy hundreds of kilometers of Flaxan's surface. Can shake and crack part
      of a mountain with a punch)
    source_ids:
    - vsbattles-omni-man
    confidence: 0.8
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Took many hits from his Viltrumite executioners and still got
      up to fight after breaking free.Invincible Season 3 Episode 4 - You Were My
      Hero Just like Invincible, Omni-Man can hold his breath for two weeks. Singlehandedly
      killed the Guardians of the Globe while suffering several injuries. Showed little
      to no signs of tiring even after fighting several Reanimen, Hail Mary, The Immortal,
      and Invincible almost back to back)
    source_ids:
    - vsbattles-omni-man
    confidence: 0.8
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (Possesses centuries worth of combat experience and is stated by
      General Kregg to have single-handedly conquered hundreds of planets.Invincible
      Season 2, Episode 6 - It's Not That Simple Can fight competently against veteran
      Viltrumites. He's also shown to be quite knowledgeable in methods of crime fighting
      and was smart enough to hide his true colors for years without anyone suspecting
      a thing)
    source_ids:
