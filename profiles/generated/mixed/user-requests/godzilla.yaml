    - field: intelligence
      value: 'Average (Though he seems to mostly rely on instincts, Godzilla has demonstrated
        high cognitive ability in his combat skill, learning capabilities, and strategic
        ability during his battles, such as with the MUTOs, King Ghidorah, Kong, and
        Mechagodzilla. He recognized that the Hokmuto repeatedly attacked him from
        behind, promptly fooling him by turning his back to lure him in and then striking
        him with his tail, killing him. Godzilla recognized Scylla''s patterns of
        movement, initially failing to catch up, then intercepting her at her next
        destination rather than the one she was already at in her quest for nuclear
        radiation. Godzilla skillfully dispatched Scylla and the Ion Dragon respectively.
        He is also resourceful, taking advantage of the aquatic environment against
        Ghidorah. Godzilla also made use of the surface world''s stockpile of energy
        after being alerted by the Iwi that Skar plans to wage war and conquest once
        again with Shimo in tow. He can recognize threats and ignore those who are
        not, moving around battleships and vessels that lay in his path. The titan
        even shows a fine degree of recognition and memory. He recognizes and remembers
        that Serizawa—a mere human—saved him from his critical state. Godzilla also
        recognized Kong as a temporary ally after being saved by him from Mechagodzilla
        and that he could power the latter’s axe with his atomic breath to defeat
        their opponent. He appears to possess some degree inquisitiveness toward humans,
        as seen he briefly looks Ford Brody in the eye when he collapses to his level.
        It is also shown when he sees Serizawa approaching him and when he inspects
        the group that helped bring him back from his near-death state. Godzilla is
        capable of feeling and expressing emotion, as demonstrated by him laughing
        after he successfully hit Kong with his atomic breath. Moreover, he roars
        in grief while absorbing Mothra''s life force after she had sacrificed herself
        for him against Ghidorah, and remembered her sacrifice in the period of time
        after. Most importantly, Godzilla''s face and attitude soften once he sees
        Mothra resurrected in Godzilla x Kong: The New Empire)'
