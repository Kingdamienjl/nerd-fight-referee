    - field: weaknesses
      value: 'Vulnerable to electricity, but with some resistance. Vulnerable to various
        types of biological warfare. Vulnerable to mind control, although it resisted
        tachyon mind control better than other affected monsters. Godzilla seems to
        have an aversion to bright lights, a weakness exploited by both Cameron Winter
        (who used powerful spotlights when attacking Godzilla with the Cyberflies)
        and Maximillian Spiel (who used high-intensity quartz beams during Godzilla''s
        battle with Rhinosaurus). == Notable Attacks/Techniques: == * Atomic Breath:
        Godzilla''s signature weapon is his green atomic breath. As mentioned previously,
        this atomic breath has a long range and is extremely hot, capable of melting
        steel and sand and even creating its own heat front. * Atomic Bubble: Godzilla
        envelops his enemies in the flames of his atomic breath, creating an energy
        bubble that weakens or disintegrates anything within it. * Headbutt: Used
        to send a large monster flying hundreds of meters. * Tail Swipe: Used to send
        even larger monsters flying. * Excavation: He can burrow into the ground and
        completely submerge himself in a matter of seconds. He can use this to great
        effect in combat, whether to sneak up on enemies, launch surprise attacks,
        or escape danger. * Rigging: Strong enough to easily destroy an underwater
        mountain structure of the same size. * Amphibious: Godzilla is able to breathe
        underwater and spends most of his time there. He is capable of traveling thousands
        of kilometers across the ocean without showing signs of fatigue, and is said
        to swim faster than a submarine''s torpedoes. Category:Radiation Manipulation
        Users Category:Energy Projection Users Category:Absorption Users Category:Fire
        Users Category:Reactive Evolution Users Category:Adaptation Users'
