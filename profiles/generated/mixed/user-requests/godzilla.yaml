power_scale:
  tier:
    text: At least {{6-B}}, higher with Energy Absorption, possibly {{4-B}} | At least
      {{High 6-B}}, likely far higher, possibly {{4-B}} | At least {{6-B}}, higher
      with Energy Absorption, possibly {{4-B}} | At least {{High 6-B}}, higher after
      Fully Evolving, {{6-A}} with Spiral Heat Ray, possibly {{4-B}}
    source_ids:
    - vsbattles-godzilla
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: 'At least Country level+ (Fought Ghidorah in the past and can tear off his
      heads. Physically superior to MUTO Prime.Nelson, Arvid. September 14, 2020.
      Arvid Nelson on Godzilla''s strength. Twitter. (Backup image) Even while in
      a weakened state due to starvation, Godzilla opened a tunnel to the Hollow Earth
      from Hong Kong with his Atomic Breath and could have physically overpowered
      Kong during their fight, later doing so at the end of it. In this same state,
      Godzilla is stronger than Mechagodzilla.Jared Krichevsky via InstagramGodzilla
      was exhausted when fighting Mechagodzilla. Overpowered the MUTOs and Shinomura.
      His atomic breath is stated to be nature''s strongest weapon, which makes it
      stronger than this74.03 Teratons), higher with Energy Absorption (Godzilla overpowered
      Ghidorah after being recharged by one of Monarch''s nuclear bombs in 2019),
      possibly Solar System level (Godzilla casually crosses the vortices of the Hollow
      Earth,Monarch: Legacy of Monsters - Season 1, Episode 10: "Beyond Logic" which
      are described as eruptions of real Gamma Ray BurstsMonarch: Legacy of Monsters
      - Season 1, Episode 07: "Will the Real May Please Stand Up?" found in pulsars
      of supermassive black holes,Monarch: Legacy of Monsters - Season 1, Episode
      04: "Parallels and Interiors" which produces at least 1 Foe or 10 Foe of energy
      and the strongest GRB being 12 KiloFoe. Godzilla proves to be energetically
      superior to these eruptions by being able to eliminate the Ion Dragon, which
      also passes through these vortices unaffected. Furthermore, in an interview,
      Adam Wingard called the Hollow Earth vortexes “black holes” two times.GODZILLA
      VS. KONG - INTERVIEW WITH ADAM WINGARD - Coast To Coast AM - Ian Punnett (2021)
      The novels also compare the Hollow Earth vortexes to black holesGodzilla vs.
      Kong: The Official Movie Novelization (2021))'
    source_ids:
    - vsbattles-godzilla
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: At least Subsonic+ travel speed by sheer size (Quickly ran across several
      city blocks in Boston. Mauled Kong at high speeds while running on all foursMach
      0.66), High Hypersonic+ attack speed, combat speed, and reactions (Able to whip
      his tail faster than the speed of sound. Matched Ghidorah in combat. His Atomic
      Breath is able to move this quickMach 81.82)
    source_ids:
    - vsbattles-godzilla
    confidence: 0.8
    notes: auto_repair source extraction
  durability:
    text: 'At least Country level+, possibly Solar System level (Survived half of
      the total explosion yield of Serizawa''s nuclear missile, despite being weak
      and near-death. Withstood Ghidorah''s Gravity Beams without lasting damage.
      Even after weakening due to a lack of proper sustenance over a period of time,
      Godzilla endured being struck at his thigh by Kong''s battle axe while it was
      charged. The axe dismantled Mechagodzilla while charged by a weakened atomic
      breath. Moreover, Godzilla was only temporarily knocked down by a strike from
      the axe after it had been supercharged by his atomic breath, with all that energy
      being detonated on impact. In 1954, he survived the Castle Bravo Bomb detonating
      in his face,Monarch: Legacy of Monsters - Season 1, Episode 06: "Terrifying
      Miracles" as well as numerous other nuclear bomb tests), higher with Energy
      Absorption'
    source_ids:
    - vsbattles-godzilla
    confidence: 0.8
    notes: auto_repair source extraction
  range:
    text: Tens of Meters by Sheer Size, Hundreds of Meters with Tail (167.74 meters
      in 2014. 177.4 meters in 2019), Thousands of Kilometers with Atomic Breath (Can
      reach all the way through to the Hollow Earth) |-|Burning
    source_ids:
    - vsbattles-godzilla
    confidence: 0.8
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Godzilla has consistently shown tremendous endurance for being
      able to fight multiple Titans in fast succession without tiring out. Godzilla
      and Kong started fighting around sunset and finished at dawn, meaning they were
      fighting continuously for 12 hours)
    source_ids:
    - vsbattles-godzilla
    confidence: 0.8
    notes: auto_repair source extraction
  intelligence:
    text: 'Average (Though he seems to mostly rely on instincts, Godzilla has demonstrated
      high cognitive ability in his combat skill, learning capabilities, and strategic
      ability during his battles, such as with the MUTOs, King Ghidorah, Kong, and
      Mechagodzilla. He recognized that the Hokmuto repeatedly attacked him from behind,
      promptly fooling him by turning his back to lure him in and then striking him
      with his tail, killing him. Godzilla recognized Scylla''s patterns of movement,
      initially failing to catch up, then intercepting her at her next destination
      rather than the one she was already at in her quest for nuclear radiation. Godzilla
      skillfully dispatched Scylla and the Ion Dragon respectively. He is also resourceful,
      taking advantage of the aquatic environment against Ghidorah. Godzilla also
      made use of the surface world''s stockpile of energy after being alerted by
      the Iwi that Skar plans to wage war and conquest once again with Shimo in tow.
      He can recognize threats and ignore those who are not, moving around battleships
      and vessels that lay in his path. The titan even shows a fine degree of recognition
      and memory. He recognizes and remembers that Serizawa—a mere human—saved him
      from his critical state. Godzilla also recognized Kong as a temporary ally after
      being saved by him from Mechagodzilla and that he could power the latter’s axe
      with his atomic breath to defeat their opponent. He appears to possess some
      degree inquisitiveness toward humans, as seen he briefly looks Ford Brody in
      the eye when he collapses to his level. It is also shown when he sees Serizawa
      approaching him and when he inspects the group that helped bring him back from
      his near-death state. Godzilla is capable of feeling and expressing emotion,
      as demonstrated by him laughing after he successfully hit Kong with his atomic
      breath. Moreover, he roars in grief while absorbing Mothra''s life force after
      she had sacrificed herself for him against Ghidorah, and remembered her sacrifice
      in the period of time after. Most importantly, Godzilla''s face and attitude
      soften once he sees Mothra resurrected in Godzilla x Kong: The New Empire)'
    source_ids:
    - vsbattles-godzilla
    confidence: 0.8
    notes: auto_repair source extraction
