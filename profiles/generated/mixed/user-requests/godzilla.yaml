    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Large Size (Type 1; 91.44 meters),
        Underwater Breathing (Type 2), Enhanced Senses, Enhanced Vision (His eyes
        perceive light at a much more acute level than humans, allowing him to detect
        changes in light. This enabled him to see the flashes of the mutant hummingbirds,
        which reflected light to become invisible.), Natural Weaponry (Conventional;
        Teeth, claws and tail), Natural Armor (Armored Skin; like any giant monster,
        its skin is covered with very resistant and flexible scale armor, protecting
        it from giant explosions and piercing attacks), Acrobatics, Camouflage/Stealth
        Mastery (Via Ambush), Radiation Manipulation and absorption (As a mutant,
        Godzilla gains benefits from radiation, allowing him to strengthen himself,
        develop, and acquire new abilities. Apparently, he used the radiation from
        the radioactive volcano of Santa Marta, which would explain why his atomic
        breath generated an explosion exponentially larger than his usual explosions.
        It is also likely that he developed this resistance to volcanic eruptions
        by benefiting from the island''s radiation, which allowed the giant bees to
        mutate and evolve.), Accelerated Development (Passive, others, Abilities,
        intelligence and Physical statistics; he grew from human size to the height
        of a building in a few hours. his power grew rapidly, allowing him to overpower
        his rivals after just one encounter, even though they initially posed a challenge.
        His power grew so quickly that humanity needed to upgrade its weaponry to
        compete with him, and even then, he quickly surpassed them. Being an improved
        version of his father, he acquired atomic breath as a defense mechanism after
        being surrounded by the army as a child. As he matured and faced dozens of
        monsters, he gained incredible mastery in using his atomic breath in combat,
        as well as executing various improvised battle moves. Over time, he acquired
        increasingly greater reasoning abilities, becoming more intelligent than most
        of the mutations in the series, and combined with his experience with other
        creatures, he uses this to acquire new forms of combat.), Reactive evolution
        and Adaptation (He quickly adapted to human weaponry, having survived from
        a young age, becoming highly invulnerable to military-grade firearms. Abilities
        like electricity eventually became obsolete , only paralyzing him for brief
        moments, from which he easily recovered. He can adapt to his opponents in
        battle, testing their abilities and analyzing how to use them against them,
        as well as countering potentially dangerous abilities, rendering them useless
        against him if the same method is attempted.), Underground Mobility (He is
        an extraordinary burrower, as moments after hatching he could quickly burrow
        through many yards of concrete to escape the ruins of Madison Square Garden.
        Once fully grown, Godzilla could tunnel incredibly large distances in extremely
        short periods, sometimes appearing on the battlefield from underground), Skilled
        in Hand-to-Hand Combat. Atomic Breath, Fire Manipulation (possesses Atomic
        Breath, also known as Mighty Breath, a beam of blazing green plasma capable
        of injuring enemies. It is hot enough to transform sand into glass, melt metals,
        and create its own weather front. He can generate enormous explosions on contact,
        the size of which varies depending on his ability to modify the power of his
        Atomic Breath. He can also fire a variant of his Atomic Breath made of pure
        green flames, capable of igniting the surface of water or creating massive
        fires to burn his enemies.), Energy Manipulation, Extrasensory Perception
        (Godzilla detected from New York that Niko and Audrey were in danger in Alaska.
        It could perceive the atmospheric ionization caused by crackler, detect tachyons
        and follow their trail). Non-Physical Interaction (Can hit elemental intangibles
