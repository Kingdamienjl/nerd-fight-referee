power_scale:
  tier:
    text: 'At least 8-B, possibly at best High 6-A * Name: John, Homelander * Origin:
      The Boys * Gender: Male * Age: 38-45 (s1-s5) * Classification: Supe *'
    source_ids:
    - character-stats-profiles-homelander
    confidence: 0.8
    notes: auto_repair source extraction
  attack_potency:
    text: He is able to damage and be damaged by people relative to him, meaning his
      attack potency would scale to his durability. At least city block - multi city
      block level Was able to tank a chemical plant explosion with no damage. Is comparable
      to Soldier Boy who can tank his own explosions. Small town level His power is
      compared to that of a neutron bomb by Stan Edgar when talking about his bunkers
      safety. Considered the ‘most powerful superhero’ which would put him above the
      power Nubia generated when creating her storm. Possibly small city - mountain
      level Madelyne Stillwell stated that no weapon on Earth can harm him, and Eric
      Kripke states that he doesn’t have many physical weaknesses. Butcher states
      that the weapon that ‘killed’ Soldier Boy must have been as strong as an h bomb,
      based on his limited knowledge of him being ‘nearly’ as strong as Homelander.
      MM compares Soldier boy to the likes of an h bomb. Soldier Boy claims that a
      cage containing enriched uranium was used to test if supes could survive an
      atomic bomb, which implies that the blast wasn’t the concern but the radiation
      poisoning. Atomic bombs (like the ivy king which was tested in 1952, which fits
      the time frame in which Soldier Boy was tested) can reach up to 500 kilotons
      of tnt. Hydrogen bombs (like the tsar bomba) can reach up to 50 megatons (higher
      considering the tsar bomba’s 100 megaton prototype). Higher with lasers (was
      able to knock out temp v Butcher who is comparable to him). Claims he could
      wipe New York off of the map ‘for fun’ (calculation), and is stated to be able
      to level a city in minutes. Possibly at best small country - multi-continental
      level Homelander states he would ‘destroy everything and everyone’ if Maeve
      released the flight 37 footage. In season 5’s promotional poster, Homelander
      is shown admiring the destruction he has caused. Eric Kirpke has stated Homelander
      could ‘destroy the world’ via an apocalyptic event (surface wiping). Considered
      the ‘most powerful superhero’ which should put him above the power generated
      in Black Hole’s ‘quantum singularity’. *
    source_ids:
    - character-stats-profiles-homelander
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: At least hypersonic+ - sub-relativistic travel speed Out-sped Butcher’s
      C4 vest. Stated he could go to space, went to space in a deleted scene, seen
      in space in a promotional poster for season 5, Hughie stated that he could fly
      to space to escape the virus, travelling to space would be this fast. Is likely
      faster than Ryan who can travel from Russia to New York instantly. SOL attack
      speed His lasers were stated by a vfx artist (who worked on the show) to be
      actual lasers. Lasers are light meaning they would be light speed. Sub-relativistic
      - relativistic reaction/combat speeds He is able to react to and tag people
      relative to him. Soldier Boy is able to block Butchers lasers (this calculation
      labels Homelanders lasers as sub-relativistic, so the value would be much higher
      if the accurate light speed value were used). Soldier boy is able to block Annie’s
      blasts, which are light. He is able to dodge Ryan’s lasers. Higher when in flight
      (was able to blitz Soldier Boy when flying). Possibility at best MFTL travel
      speed Should be somewhat comparable to A-train (however he was injured and likely
      exhausted), who could statue lasers after receiving a new heart and could statue
      light when amped. *
    source_ids:
    - character-stats-profiles-homelander
    confidence: 0.8
    notes: auto_repair source extraction
  durability:
    text: Small town level, possibly mountain level, potentially at best multi-continental
      level. *
    source_ids:
    - character-stats-profiles-homelander
    confidence: 0.8
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Tens of Meters with Heat Vision
    source_ids:
    - vsbattles-homelander
    confidence: 0.75
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Comparable, if not superior, to Maeve and Soldier Boy. Endured
      multiple hits from both Soldier Boy and a Temp-V empowered Butcher and still
      managed to overpower them. When he was a kid, he could endure being exposed
      to extremely high temperatures for hours despite the immense pain)
    source_ids:
    - vsbattles-homelander
    confidence: 0.75
    notes: auto_repair source extraction
  intelligence:
    text: Above Average (Is a manipulator and skilled actor; after he botched the
      rescue mission of Flight 37, which led to the Crash of Transoceanic Flight 37,
      Homelander managed to manipulate the situation to make the public support superheroes
      in the national defense. Planned on secretly giving vials of Compound V to terrorists
      so that the military would be forced to accept supes into the forces. Figured
      out that Stillwell and Vogelbaum were lying by noticing minute details between
      both of their stories. Correctly assessed that Stan Edgar was involved with
      the murders during the Congress hearing. Outsmarted Stan Edgar by turning Victoria
      Neuman, his adopted daughter, against him and taking control of Vought)
    source_ids:
    - vsbattles-homelander
    confidence: 0.75
    notes: auto_repair source extraction
