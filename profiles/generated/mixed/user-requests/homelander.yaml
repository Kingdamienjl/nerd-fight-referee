        no line of sight) *Queen Maeve (The Boys) Maeve''s Profile (Season 3 Maeve
        and Temp-V Empowered Butcher were used. Both were in character and had full
        knowledge of each other''s abilities. Starting distance was 5 meters and the
        fight took place in the Vought Tower) *Richie Kirsch (Scream) Richie''s Profile
        (Starting distance was 20 meters, Richie has prior knowledge and a Berreta
