    - field: weaknesses
      value: 'Pre Compound V= Standard human weaknesses. Reckless in his desire to
        take the Seven (especially Homelander) down. Is willing to throw away missions
        and even risk his life in other to protect those he care for. |-|Empowered
        by Temp-V= Same as before, minus his human limitations. Temp-V is only temporary
        and its effects only last for 24 hoursThe Boys; Season 3; Episode 1; "Payback".
        Its effects can make Billy feel illThe Boys; Season 3; Episode 3; "Barbary
        Coast" and it causes brain lesions, with 3 to 5 doses stated to be lethalThe
        Boys; Season 3; Episode 7; "Here Comes a Candle to Light You to Bed". The
        healing from taking Temp-V only heals injuries the user had prior to taking
        it. After taking six doses of Temp-V, Billy eventually developed brain tumors,
        and has an estimated lifespan of 18 monthsThe Boys; Season 3; Episode 8; "The
        Instant White-Hot Wild". As a supe, he is vulnerable to high-frequency sounds,
        which can cause him immense pain. |-|Post Compound V= His health is slowly
        deteriorating due to the evolution of his cancer, which also started to cause
        him to see hallucinations of his deceased wife Becca, as well as from an ex-coworker
        named Joe Kessler, who Butcher thought was real and alive for a time. After
        taking Compound V to try and cure himself, it ended up giving powers and sentience
        to his tumor, which (represented by this hallucination of Joe Kessler) constantly
        tries to influence Butcher to follow his darkest desires, eventually succeeding.
        Initially, Butcher had no control over his tumor''s powers, though by the
        end of Season 4, he seems to have control over it, as long as he follows his
        dark side. Feats: |-|With Temp-V= *Bulletproof Durability (Certain supes,
        unlike others, have been shown to be completely impervious to low caliber
        bullets from pistolsThe Boys; Season 2; Episode 8; "What I Know"Gen V; Season
        1; Episode 1: "God U" and assault riflesThe Boys; Season 1; Episode 1; "The
        Name of the Game"The Boys; Season 1; Episode 3; "Get Some"Gen V; Season 1;
        Episode 5; "Welcome to the Monster Club", and can even withstand shots from
        anti-materiel rifles, albeit with moderate painThe Boys; Season 1; Episode
        7; "The Self-Preservation Society". In addition, this supes may also be highly
        resistant to cuts from ordinary weapons and saws, requiring specialized saws
        to get through their skinThe Boys; Season 2; Episode 6; "The Bloody Doors
        Off"). ==Notable Matchups== Victories: *Thomas Rogan (House of the Dead) Thomas''
        Profile (V-24 was restricted, speed was equalized, starting distance was 30
