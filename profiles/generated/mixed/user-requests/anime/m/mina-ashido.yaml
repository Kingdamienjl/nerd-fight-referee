      value: 'She risks damaging her own skin with her acid if she loses control of
        it. Using Acidman: Alma heavily tires her out, enough to make her pass out
        just a few seconds later, although she had been fighting against multiple
        villains for an unknown amount of time. Her maximum acid is powerful enough
        to hurt herself, despite her resistance. Notable Attacks/Techniques: Acid:
        Pinky''s Quirk gives her the ability to shoot out a corrosive liquid from
        within her body and can control the degree of viscosity, as well as its solubility.
        She can use it offensively but has shown utility as well such as melting handholds
        for herself to use while climbing. She also often slides around by secreting
        acid from her feet. *Acid Veil: Pinky generates a gelatinous acid wall which
        blocks incoming projectiles. Pinky''s Acid Veil was strong enough to block
        hardened spheres (which were stronger than concrete) with ease. *Acid Shot:
        Pinky shoots a rain of acid projectiles over a widespread area to shower down
        on to her opponents.My Hero Academia Volume 23 Chapter 214 *Acid Layback:
