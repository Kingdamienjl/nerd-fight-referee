        the Modern Era. In a notable encounter, Miguel effectively used the Black
        Rope to disrupt Satoru's Infinity, a feat few achieve. Surviving an encounter
        with a Six Eyes user, Miguel's exceptional performance during the Night Parade
        of a Hundred Demons earned him the title of "MVP" on December 24, 2017. Recognizing
