    - field: intelligence
      value: 'Genius (Creati is ranked to have S-class intelligence.My Hero Academia:
        Ultra Archive: The Official Character Guide Her analytical skills are strong,
        easily devising strategies and plans in battle and urgent situations, which
        she has no trouble putting in motion due to her Quirk''s versatility. Academically
        speaking, Creati is highly efficient, having been ranked 1st place in the
        mid-terms of her class,My Hero Academia Volume 7 Chapter 60 and understanding
        the composition of anything she wishes to create using her Quirk. The latter
        is a complicated task for even the simplest materials. Regardless, Creati
        commonly uses the objects from her Quirk to provide auxiliary support for
        her allies, as well as blindside her opponents, making her a very crafty individual,
        and reliable comrade. What she lacks in raw strength and destructive power,
        she makes up for with her ingenuity. When she was paired with Shoto against
        Eraser Head in the Final Exams, she realized that the Pro Hero''s Erasure
        Quirk has a smaller time limit due to the injury he received from the U.S.J.
        Nomu, and capitalized on that small interval to blindside him, and secure
        the victory for her and Shoto)'
      source_id: vsbattles-momo-yaoyorozu-my-hero-academia-my-hero-academia
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'The larger the object created from her Quirk, the more exposed her body
        is. If she runs out of lipids in her body, she will be unable to create any
        more objects. She can overthink how weak she is compared to classmates stronger
        than her, though after the Final Exam arc, this no longer applies. Notable
        Attacks/Techniques: Creation: Creati''s Quirk allows her to produce different
        objects, such as weapons and other objects, from any exposed part of her body.
        Apart from living things, Creati can create virtually any object. All she
        needs is an understanding of the object''s atomic configuration in order to
        do so. Creati''s body breaks down fat at a molecular level, which will then
        be reused as material for her to shape into objects with her Quirk, requiring
        a certain amount of consumption of food based on how she’ll use it.My Hero
        Academia Volume 9 Chapter 72 ==Notable Matchups== Victories: *Uravity (My
        Hero Academia) Uravity''s Profile (Final War Arc Creati and Final War Arc
