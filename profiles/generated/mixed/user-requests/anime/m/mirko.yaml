    - field: intelligence
      value: Gifted (Even at a young age, she was an incredibly noteworthy fighter.
        While still in middle school, Mirko became famous for crashing various fight
        clubs around the country and decimating them. Around this same period, she
        was able to take down dozens of wrestlers in a underground fighting ring with
        ease. Moving forwards, she would obtain more experience and grow in skill,
        becoming the No. 5 Pro Hero. Due to her high ranking as a Pro Hero, she would
        boast ample experience against many types of villains, and would carry more
        experience and skill compared to most Pro Heroes. Mirko displays mastery over
        her agility, effectively incorporating it into her fighting style. Was able
        to deal with multiple High-Ends by herself, continuing to fight with just
        as much finesse and ignoring the pain of her destroyed arm at the same time)
      source_id: vsbattles-mirko-my-hero-academia-anime
