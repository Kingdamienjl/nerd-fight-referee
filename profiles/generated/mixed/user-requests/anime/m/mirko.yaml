    - field: weaknesses
      value: 'Her body is not as strong or as durable as her legs. Notable Attacks/Techniques:
        {{Nihongo|Rabbit|{{Ruby|兎|うさぎ}}|Usagi}}: Mirko''s Quirk is a Mutant-Type Quirk
        which grants her the anatomy and abilities of a rabbit. These include rabbit
        ears, a tail, and tremendously powerful legs. Her legs are strong enough to
        enable her to leap long distances and kick with extreme force. With this ability,
        she has enough power to blow away Dabi''s flames and injure even the strongest
        types of Nomu. *{{Nihongo|Luna Ring|{{Ruby|踵月輪|ルナ リング}}|Runa Ringu}}: Mirko
        performs a cartwheel in the air with her legs to kick multiple targets simultaneously.
        She used this technique to free herself from the Quirk of a High-End Nomu.
        *{{Nihongo|Luna Fall|{{Ruby|月墜蹴|ルナ フォール}}|Runa Fōru}}: Mirko delivers a downward
        kick in the air to her opponent''s head, sending them straight to the ground.
        *{{Nihongo|Luna Tijeras|{{Ruby|月頭鋏|ルナ ティヘラ}}|Runa Tihera}}: Mirko grips her
        opponent''s head with her legs before rotating her body, using her superhuman
        strength to rip their head off and smash it into the ground. She only uses
        this technique against dangerous enemies she knows cannot be restrained. *{{Nihongo|Luna
        Arc|{{Ruby|踵半月輪|ルナ アーク}}|Runa Āku}}: Mirko raises her leg and delivers a mighty
