    - field: intelligence
      value: Gifted (A third-year student at the prestigious U.A. High School, Lemillion
        has demonstrated incredibly mastery over his hard to use Quirk, easily defeating
        all of Class 1-A during a training exercise while compensating for many of
        his Quirk's downsides. Known for his exceptional work ethic, he is well-acquainted
        with the ins and outs of hero work, being declared the best candidate to reaching
        the rank of number one hero. In addition, he can be exceptionally level-headed
        despite his normally goofy demeanor, restraining Deku from confronting Overhaul
        as per the instructions given to him by Nighteye despite his desire to save
        Eri. Due to his Quirk effectively blinding him while active, he has trained
        his prediction skills to the point of being able to accurately foresee where
        he is going to be launched while overlapping an object)
      source_id: vsbattles-mirio-togata-my-hero-academia-my-hero-academia
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Once he goes intangible his clothes will slip off him, leaving him naked,
        unless he''s wearing clothes made from parts of his body. Absolutely all of
        his senses except the sensation of falling are disabled while fully intangible
        and he cannot breathe while in this state. Notable Attacks/Techniques Permeation:
        Lemillion''s Quirk allows him to phase his entire body, or part of it, through
        anything, including the ground. When he deactivates his Quirk while overlapping
        a solid object, he gets catapulted out it at high speed. If he adjusts his
        body in the middle of falling and then deactivates his Quirk, he can influence
        where he emerges from the ground to launch a sneak attack. *Blinder Touch:
        Eyeball Crush: Lemillion pretends to poke an opponent in the eye while his
        arm is intangible, distracting them long enough to deliver an actual blow
        to their stomach. *Killing Move: Phantom Menace: Lemillion consecutively launches
        himself in and out of his target''s surroundings at high speeds with all of
        his brute force, striking from all directions in a near instantaneous combo.
