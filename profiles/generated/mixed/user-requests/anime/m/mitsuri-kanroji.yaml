power_scale:
  tier:
    text: 'At least {{7-C}}, likely higher, {{High 7-C}} with the Demon Slayer Mark
      Name: Mitsuri Kanroji Origin: Demon Slayer: Kimetsu No Yaiba Gender: Female
      Age: 19 Classification: Human, Demon Slayer, Love Hashira of the Demon Slayer
      Corps'
    source_ids:
    - vsbattles-mitsuri-kanroji-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: At least Town level (Stated that she has muscles eight times denser than
      what they should be. Superior to Post-Type Zero training Tanjiro, as Tanjiro
      hadn't reached the level of a Hashira until after his Hashira training, who
      could match Hantengu's emotion clones. Should be comparable to the other Hashira
      such as Tengen, who could match Gyutaro and survive his final attack. Could
      easily slash through and block Zohakuten's attacks. Showed afterwards that she
      managed to make a shallow cut in Zohakuten's neck, which should be the toughest
      part of his body), Large Town level with Demon Slayer Mark (Increased her strength
      by an Order of Magnitude. Was able to match Full Power Zohakuten and stalemate
      him until sunrise despite Zohakuten being unkillable. Ripped Muzan's arm clean
      off)
    source_ids:
    - vsbattles-mitsuri-kanroji-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively Hypersonic+ (Could keep up with Zohakuten and dodge his lightning.
      However, she is slightly slower than Giyu, Sanemi and Obanai), Sub-Relativistic
      with the Demon Slayer Mark (Increased her speed by an Order of Magnitude. Zohakuten
      only managed to hit her when she was exhausted)
    source_ids:
    - vsbattles-mitsuri-kanroji-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  durability:
    text: At least Town level, likely higher (Should be comparable to her Attack Potency.
      Could endure Zohakuten's direct blows that were intended to kill her), Large
      Town level with the Demon Slayer Mark (More durable than before. Withstood a
      direct attack from Muzan, although she was in critical condition afterwards)
    source_ids:
    - vsbattles-mitsuri-kanroji-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range, Several Meters with her whip sword and Breathing Techniques
    source_ids:
    - vsbattles-mitsuri-kanroji-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Hashira can train for months through training that almost puts
      them on the verge of death. Can keep fighting while taking a big amount of damage,
      though her stamina is bit lower than her fellow Hashira. Fought Lower Rank-level
      Demons in the Infinity Castle for nearly 5 hours on top of fighting Upper Rank
      4, Nakime)
    source_ids:
    - vsbattles-mitsuri-kanroji-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average (As a Hashira she's an experienced and very skilled swordswoman,
      though outside battle she sometimes seems kind of goofy)
    source_ids:
    - vsbattles-mitsuri-kanroji-demon-slayer
    confidence: 0.6
    notes: auto_repair source extraction
