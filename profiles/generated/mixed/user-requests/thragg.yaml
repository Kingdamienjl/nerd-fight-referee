    - field: weaknesses
      value: 'Conquest is sadistic, he loves battle as well as inflicting pain on
        others, even to the point of requesting opponents to try and resist him. He
        has a sensitive equilibrium in his ears that help him maintain flight. This
        can be exploited with pinpoint high frequency sound waves that will cause
        him intense pain with even higher waves giving him hallucinations and can
        even place him into a coma. As a Viltrumite, he is vulnerable to the Scourge
        Virus, though he eventually recovered, the virus severely negated his powers
        causing him to lose both his right eye and arm in the midst of a battle. The
        Klaxus Plant will poison and weaken him. Notes: Both the Comics and the Amazon
        Prime series are written, directed, and produced by Robert Kirkman and are
        virtually both almost 1-to-1 with the exception of a few ultimately irrelevant
        race/gender swaps. Kirkman has gone onto state that the goal of the show is
        to "expand and heighten" scenes, but not change them in a way that makes them
        substantially different from the comics. Additionally, Kirkman also specifically
        talks with animators and directors on how he wants things to be portrayed.
        Therefore, due to both the Comics and the Show being treated similarly enough
        to one another, they both should be usable as supplementary material for one
        another and are therefore classified under the same profile. == Notable Matchups
        == Victories: Losses: Inconclusive: == Statistics Values == Category:StoneKillerz12'
