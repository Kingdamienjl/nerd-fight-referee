    text: At least Small Planet level (Ripped Thaedus' head from his shoulders. Broke
      Oliver's arm in his grasp and punched his jaw apart with one blow. Successfully
      killed Battle Beast, even though the two's battle lasted for days. Easily overpowered
      Dinosaurus, smashing him through a moon base and cracking open his jaws. Far
      superior to Omni-Man, Anissa and Conquest, to a point where the latter actually
      fears him>1.373 Zettatons of TNT) | At least Small Planet level, likely far
      higher (One-shotted Rognarr's, who could previously rip him apart. Outmatched
      Allen's forces, being a threat to all of them despite having Post-Colossal Amplification
      Tech Jacket on his side>>13.73 Zettatons of TNT)
    source_ids:
    - vsbattles-thragg
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Massively FTL+ (Faster than Invincible and Omni-Man. Caught up to Mark when
      he was fleeing with stars blurring around them and reacted to Nolan rushing
      towards them at more than likely full speed to save his son. Can easily dodge
      Space Racer's infinity ray blasts, which can move fast enough to keep the pace
      with Mark, Nolan and Thaedus, with Nolan having to pull Mark for him to keep
      up despite Mark being able to outspeed the fastest spaceship CoP has>130,446,428
      c) | Massively FTL+ (Superior to Post-Colossal Amplification Tech Jacket>>1,304,464,280
      c)
    source_ids:
