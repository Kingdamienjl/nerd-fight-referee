        Regeneration (Low. Can heal himself and recover from mortal wounds through
        sheer resolve and iron will), Animal Manipulation (Rides a trained samurai
        horse that can be summoned with a whistle. Can quickly tame enemy war dogs
        to fight for him with the Charm of Canine Recruitment. Foxes lead him to shrines
        of Inari possibly due to the goddess Inari being Jin''s guardian spirit. Golden
        birds lead him to points of interest possibly due to the birds being a manifestation
        of the soul of Jin''s mother. Fireflies can guide to the location of artifacts.
