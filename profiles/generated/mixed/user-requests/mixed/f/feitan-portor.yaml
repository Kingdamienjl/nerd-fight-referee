    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Hypersonic with Hypersonic+ reactions (Matched Zazan and as the match went
      on began to overwhelm her with his speed)
    source_ids:
    - vsbattles-feitan-portor-hunter-x-hunter
    confidence: 0.6
    notes: auto_repair source extraction
  durability:
    text: Multi-City Block level (Survived a Nen attack while completely defenceless.
      Tanked attacks from Zazan, one of the strongest Squadron Leaders), up to Small
      Town level with Ryu and Ko, higher with Pain Packer's armor (Could withstand
      Rising Sun without any trouble)
    source_ids:
    - vsbattles-feitan-portor-hunter-x-hunter
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Extended Melee Range with his Umbrella, higher with
      Nen techniques, Hundreds of Meters with Rising Sun
    source_ids:
    - vsbattles-feitan-portor-hunter-x-hunter
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (As one of the fastest Troupe members, he should have endurance
      comparable to the likes of Hisoka and Uvogin. Feitan can fight dozens of mafia
      members and fought the remarkably powerful Zazan without showing any signs of
      exhaustion)
    source_ids:
    - vsbattles-feitan-portor-hunter-x-hunter
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average (Feitan is a highly skilled combatant and a master torturer.
      He is usually seen reading Trevor Brown books as a hobby)
    source_ids:
    - vsbattles-feitan-portor-hunter-x-hunter
    confidence: 0.6
    notes: auto_repair source extraction
