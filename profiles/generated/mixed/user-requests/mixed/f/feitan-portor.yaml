    text: Multi-City Block level (Comparable, if not superior to Bonolenov), up to
      Small Town level with Ryu and Ko, higher with Rising Sun (Rising Sun easily
      killed Zazan, who was completely unaffected by Feitan's Ko attack, Rising Sun
      is so powerful that the other Troupe members immediately ran away from it and
      in the past, nearly killed members who tried to see what happened. Additionally,
      Feitan claimed that the attack that burned Zazan wasn't that strong)
    source_ids:
