      authority: high
      confidence: 0.75
    - field: intelligence
      value: Atalanta is a peerless huntress skilled in, tracking, restraining wild
        beasts, camouflage and all other skills needed for a hunter. Her skill with
        a bow is said to tread into the realm of Gods, with her only peer being the
        model for Sagittarius, Chiron. Her skill is so great that she is able to strike
        targets in a dense forest from an extreme distance that they appear as moving
        dots during nighttime with perfect precision. Her technique is as natural
        as flowing water, allowing her to rapid fire arrows in a similar fashion to
        a machine gun and fire through gaps between her allies without hitting them.
        During her fight against Spartacus, she demonstrated her quick thinking by
        quickly setting up what would normally be a killing blow, by disarming him
        before using her superior speed to grab his sword and pin him down by exploiting
        his regeneration. When utilizing Agrius Metamorphosis way of thinking changes
        into that of a wild beast, making her combat style increasingly deadly as
        thoughts regarding how to kill an enemy are sped up. When combined with her
        self evolution skill, she is able to kill an enemy even faster, as she is
        able to constantly evolve to accompany her increased speed of thinking.
      source_id: vsbattles-agrius-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Atalanta refuses to fight or kill children. If she uses Agrius Metamorphosis,
        Phoebus Catastrophe will be sealed and she will lose her sanity and reason,
        which eventually results in her self-destruction. Ripping off the pelt will
        cause her to revert to her Archer form. Cannot fight in spirit form. Notable
        Attacks/Techniques: === Noble Phantasms === PhoebusFAAOE.gif|Phoebus Catastrophe
        normal version Phoebus Catastrophe Apocrypha.gif|Phoebus Catastrophe focused
        in a small area Phoebus Catastrophe FGO.gif|Atalanta using Phoebus Catastrophe
        in Fate/Grand Order Phoebus_Catastrophe_FGOA.gif|Arcade ver. {{Quote|With
        my bow and arrows, I respectfully ask for the divine protection of the sun
        god Apollo and the moon goddess Artemis. I offer thee this calamity — Phoebus
        Catastrophe!|Atalanta utilizing Phoebus Catastrophe}} Phoebus Catastrophe:
        Complaint Message on the Arrow: A "complaint letter" requesting for divine
        protection, sent to the moon goddess Artemis and the sun god Apollo, fired
        into the sky as two arrows. After the two arrows pierce the clouds, a faint
        light slowly fills the sky and calls upon a torrential rain of arrows upon
        her enemy. A single arrow can easily pierce Avicebron''s golems, but Servants
        have the strength and speed to deflect or dodge; while their individual damage
        is low, their true power comes in their sheer numbers. However, Atalanta can
        limit her range to focus it onto a single enemy, vastly increasing its strength.
        When utilized like this, it is capable of easily reducing even Servants as
        strong and durable as Spartacus to a near-death state. Agrius_Metamorphosis_Apocrypha.gif|Activation
        in the anime Atalanta_Alter_NP.gif|Tauropolos Skia Thermokrasia in Fate/Grand
        Order Agrius_Metamorphosis_Tauropolos.gif|Raining arrows Agrius Metamorphosis:
        Boar of Divine Punishment: The pelt of the Calydonian Boar, a Monstrous Beast
        that Artemis released upon the Earth in a fit of rage against those who failed
        to honor her blessings. As the one who claimed its pelt as spoils of war,
        Atalanta possesses it as a cursed Noble Phantasm. Upon activation, it seals
        Tauropolos and transforms Atalanta into a "Monstrous Human", and gains a condition
        similar to A-rank mad enhancement, resulting in all her parameters save for
        luck ranking up at the cost of her reason. In addition, it also grants her
        the equivalent of A Rank in the Transformation skill, allowing her to gain
        various characteristics depending on situation and environment. She can transform
        the pelt into a pair of wings for flight and form a dark version of Tauropolos
        to fire arrows seething with black magical energy that have homing properties.
        She can fire these en masse, creating a massive barrage powerful enough to
        make Ruler consider using her Noble Phantasm to withstand it. * Tauropolos
        Skia Thermokrasia: The Arrow that Eclipsed The Somber Sky: The Noble Phantasm
        she possesses as a Berserker. It''s a single shot imbued with all her magical
        energy that forcefully absorbs her target. By absorbing Tauropolos into her
        body she is able to fire herself as a ballistic missile at her target. Upon
        impact her magical energy creates a explosion of a dark substance with adhesive
        qualities, which forcefully absorbs her target unless they possess an extremely
        powerful Magic Resistance skill. === Class Skil'
