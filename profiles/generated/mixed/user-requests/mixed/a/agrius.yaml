        will lose his invulnerability, along with 70% of his speed, even if he is
        given the time to heal. He cannot use the Duel Field against women or those
        weaker than him, and he loses his invulnerability within it. Achilles' magical
        energy consumption is extremely high, so a first-rate Master is needed to
        support him at his full power for even a day. {| cla
