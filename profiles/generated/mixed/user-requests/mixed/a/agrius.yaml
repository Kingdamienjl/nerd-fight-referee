        model for Sagittarius, Chiron. Her skill is so great that she is able to strike
        targets in a dense forest from an extreme distance that they appear as moving
        dots during nighttime with perfect precision. Her technique is as natural
        as flowing water, allowing her to rapid fire arrows in a similar fashion to
        a machine gun and fire through gaps between her allies without hitting them.
        During her fight against Spartacus, she demonstrated her quick thinking by
        quickly setting up what would normally be a killing blow, by disarming him
        before using her superior speed to grab his sword and pin him down by exploiting
        his regeneration. When utilizing Agrius Metamorphosis way of thinking changes
        into that of a wild beast, making her combat style increasingly deadly as
        thoughts regarding how to kill an enemy are sped up. When combined with her
        self evolution skill, she is able to kill an enemy even faster, as she is
        able to constantly evolve to accompany her increased speed of thinking.
