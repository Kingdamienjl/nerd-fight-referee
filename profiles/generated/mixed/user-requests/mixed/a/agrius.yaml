        invulnerability. His invulnerability can be bypassed by those with Divinity,
        and those with an equal or higher rank than his own (usually granted by being
        the child of a major god) can negate it completely. His invulnerability also
        only applies to hostile actions, so "friendly" actions such as a vampire's
