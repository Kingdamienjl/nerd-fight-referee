        the users to control the temperature in a wide-scale. **Temperature Optimization:
        Allows the users to optimize the temperature to produce plants. *Weather Barrier:
        Allows the users to create a barrier against the weather. *Farming Barrier:
        Allows the users to create a farming barrier. *Fertile Rain: Allows the users
        to create fertile rain. *Spirit Magic: Magic which can directly interfere
        with the soul. The more precise definition of spirit magic is magic that manipulates
