        manipulate space to create Spatial veil and control Elements. === Illusion
        Eye (Gensōgan) - Stages of Power === The Illusion Eye (Gensōgan) is the Chikara
        Clan’s legendary ability, revered and feared for its complete mastery over
        illusions. This powerful ocular skill unfolds in three progressive stages,
        each granting the user an increased level of control over illusion, extending
        from direct attacks to the fabric of reality itself. Each stage significantly
        amplifies the scope and depth of illusion manipulation. ---- ==== Stage One:
        All Illusion Level 1 ==== The first stage, known as All Illusion Level 1,
        grants Chikara Clan members the ability to transform any observed attack,
        power, or ability into an intangible illusion, nullifying its effects completely.
        When an enemy’s attack falls within the user’s line of sight, it can instantly
        be rendered into a harmless illusion, losing all capacity to inflict physical
        or mental damage. This stage proves highly advantageous in combat, as it allows
        Chikara Clan members to neutralize incoming threats by converting them into
        illusions that lack any tangible impact. Even high-powered, finishing moves
        can be transformed into mere illusions upon entering the user’s field of vision.
        Notably, this power can affect attacks originating from higher dimensions,
        reducing them to ineffectual illusions; however, the user must maintain direct
        visual contact for this ability to be effective. ---- ==== Stage Two: All
        Illusion Level 2 - True Illusion ==== The second stage, All Illusion Level
        2: True Illusion, is considerably more advanced and fearsome. At this level,
        the Illusion Eye transcends simple attack manipulation and extends to the
        fundamental aspects of existence. With True Illusion, the user can influence
        not only direct attacks but also the foundational elements of reality across
        all dimensions and realms. This stage grants the Chikara Clan’s Illusion Eye
        absolute dominion over illusion, allowing it to alter and even erase the very
        fabric of the universe. Anything within the user’s sight can be turned into
        an illusion, including abstract concepts such as time, space, life, death,
        reality, and existence itself. Once affected by True Illusion, these aspects
        lose their essence across all conceivable dimensions, effectively becoming
        void and non-existent. True Illusion is unmatched by any power or cosmic force,
        as it renders all opposing abilities, no matter how complex or powerful, null
        and void. In addition to manipulating universal concepts, this level allows
        the user to disarm opponents by turning their physical defenses and equipment
        into illusions. Weapons, armor, and other gear can be rendered intangible
        and ineffective, depriving enemies of their resources and protection. ----
