    - field: weaknesses
      value: 'None notable Notable Attacks / Techniques: - Left Hand: As part of Toriko''s
        close call with her second Kunekune, she underwent a Close Encounter of the
        Fourth Kind and returned physically changed, with her left hand now a translucent
        blue. This left hand allows Toriko to interact with the true forms of supernatural
        beings in the Otherside, harming and affecting them with her touch, at one
        point severing a Fourth Kind''s fingers and pressing a painful handprint into
        another''s face.Otherside Picnic: Omnibus 2, page 198 With it, Toriko reversed
        the effects of the Yamanoke''s possession, repairing Sorawo''s physical form
        and ability to parse the environment around her, and then expelling the Yamanoke
        by slapping her back until she vomited it out. She can also remove the Voice
        from people under Runa''s control, freeing them, as well as intercept it before
        it can affect someone.Otherside Picnic: Omnibus 2, pages 194-195 Just as importantly,
        Toriko''s left hand can be used to pull open gates to and from the Otherside
        and similar supernatural phenomena like the Kotoribako,Otherside Picnic: Omnibus
        1, pages 465-471 on one occasion even sending Sorawo to the interstitial space
        on accident after shoving her. This seemingly uncontrollably occurred despite
        the fact that she was wearing a glove over it at the time. Finally, her left
        hand can harmlessly phase through flesh, seemingly only under certain circumstances,
        allowing her to remove supernatural items like an amulet from Akari''s torso,
        the Kotoribako''s "curses" from her own stomach, and return the Otherside''s
        influence to Sorawo''s eye, restoring her memories and vision. In the latter
        case, she was able to feel out what was wrong with Sorawo''s eye through touch,
        something modern medical science couldn''t accomplish. Similarly to Sorawo''s
        eye, which can move through different layers of perception to alter the forms
        of phenomena in the Otherside, Toriko''s left hand can be used to manipulate
        Otherside entities and change their form. This notably occurred with Satsuki
        Uruma''s manifestation at her ''funeral'', during which Toriko was able to
        manipulate Satsuki''s answers in a game of Kokkuri-san, changing her definition
        and altering the rules behind her ghost story. ==Notable Matchups== Victories:
