        age, and is said to have innate fighting abilitiesVideo Game Magazine GAMEST
        MOOK Vol.2 - The King of Fighters '94The King of Fighters Official Portal
        Website; Character Database. By the age of 15, he was said to have surpassed
        his father, demonstrating his extraordinary talent; then, at the age of 18,
        he won the All-Japan Mixed Martial Arts Tournament, defeating Benimaru Nikaido
        and Goro Daimon, both skilled martial artists. A year later, his team won
        the The King of Fighters '94 tournament and defeated Rugal Bernstein, who
        mastered all fighting styles and has defeated numerous KOF champions before
        them. From 95 to 97, he regularly participated in the KOF tournament as Team
        Hero, fighting against other fighters and the threats of the Orochi clan.
        |-|Chapter of NESTS Saga (KOF '99 to KOF 2001)= Quickly deduce that he was
        being used as a template for cloning based on the nature of his interrogation
        and a room filled with numerous corpses of himselfThe King of Fighters '99
