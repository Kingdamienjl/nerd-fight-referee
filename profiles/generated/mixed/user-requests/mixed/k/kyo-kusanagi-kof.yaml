        from '99 to 2001, where he was one of the potential fighters who would fight
        Clone Zero, followed by the original Zero, and ultimately Igniz. |-|Chapter
        of Ash Saga (KOF 2003 to KOF XIII)= After being defeated by Orochi Iori in
