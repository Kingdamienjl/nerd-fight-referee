  intelligence:
    text: 'Gifted (As the leader of the Boys, Butcher is a federally trained tactician
      who has directed successful operations in espionage, capture and blackmail against
      even the most powerful superheroes and corporations in the world. Came up with
      idea of bluffing about having evidence of Homelander''s son to Edgar in order
      to stop Black Noir''s attack on the spot and succeeded. He is also a clever
      fighter, as he revealed Translucent''s invisible body by spitting his own blood
      onto it during their fight and brought a liquid nitrogen tank to freeze Ezekiel''s
      arm and break it with his crowbar. Fabricated an explosive vest, that was activated
      by pressure-controlled remote, so that if Homelander killed him the explosives
      will still go off. Frenchie firmly believes that the team needs Butcher to succeed
      in their missionsThe Boys; Season 2; Episode 1; "The Big Ride". When attacking
      Neuman, he immediately made sure to cover her eyes to prevent her from using
      her powers) Standard Tactics: Butcher''s fighting style seems to be based on
      boxing, mostly involving punches, but also mixing in headbutts and elbow strikes,
      and sometimes going for neck grabs or straight up choking his opponent. While
      a more than capable hand-to-hand fighter, Billy is also an skilled marksman,
      and will not hesitate to shoot his opponent if given the opportunity. And, if
      things go south, Butcher isn''t afraid to manipulate others in order to save
      himself or those he care for, mainly through blackmailing, with either actual
      evidence or bluffing to have it. | His fighting style mostly remains the same,
      but now incorporating his heat vision, using both from a distance, as well as
      close range. | While not much has been seen of Butcher fighting after his deal
      with Kessler, he was shown as very level-headed and straightforward on his approach,
      quickly covering Neuman''s eyes to stop her powers, restraining her, and then
      using as many tendrils as needed to prevent other from intervening, like knocking
      out Zoe, tossing aside a gunmen, and stopping The Boys, to then finally take
      care of Neuman, quickly killing her.'
    source_ids:
    - vsbattles-billy-butcher
    confidence: 0.8
    notes: auto_repair source extraction
