  attack_potency:
    text: 'Wall levelScales to 310.7316 KiloJoules (Can fight with those capable of
      hurting him"Butcher: A Short Film". Can somewhat hurt Translucent with his strikes,
      who shrugged off getting hit by a car. Can hurt Hughie and even knocked him
      out with one punch, who withstood an explosion from a distance and quickly recovered.
      Comparable to M.M., who knocked out and hospitalized his commanding officer
      with one punchThe Boys; Season 3; Episode 4; "Glorious Five Year Plan". Killed
      Mesmer by repeatedly bashing his head against a sinkThe Boys; Season 1; Episode
      7; "The Self-Preservation Society". Hurt Splinter with his crowbar, who could
      take hits from Frenchie and M.M. when wielding improvised weapons. Shattered
      Ezekiel''s frozen arm with his crowbar). Street level to Wall level with weapons
      (Had made use of a Beretta 92FS, an M4A1, a Remington Model 870, a Serbu BFG-50A
      and can get access to a M134 Handheld Minigun), higher piercing damage with
      carbon metamaterial ammo (Frenchie made a .50 caliber round coated in the same
      metamaterial as Translucent''s skin with the idea of getting through his impenetrable
      skin and later did the same with a dart to inject the anti-supe virus into Neuman''s
      system, both to which Butcher got access toWhile they failed in the first attempt
      and Frenchie wasn''t fully sure about the second one working, the fact that
      they suggest this metamaterial to be used against this fully bulletproof supes
      clearly means that it is much stronger than they normal ammunition.). Wall level
      with 1987 Cadillac Brougham (Most cars are on this level. Destroyed the front
      of Hughie''s store and sent Translucent flying through several aislesThe Boys;
      Season 1; Episode 1; "The Name of the Game"). Up to Small Building level with
      explosivesScales to 0.019 Tons of TNT | City Block level20.56 Tons of Tnt, possibly
      Multi-City Block level+800 Tons of TNT (Traded blows with and hurt Homelander,
      whereas a chemical plant explosion dealt no damage to him, and who Edgar stated
      has the power of a neutron bombGen V; Season 2; Episode 6: "Cooking Lessons"While
      a common yield for a Neutron bomb is about 2 Kilotons, only around 40% of the
      power goes to the blast itself., but he couldn''t defeat him on his ownThe Boys;
      Season 3; Episode 6; "Herogasm". Held his own against Soldier Boy, but eventually
      got overpowered), higher with Heat Vision (Somewhat matched Homelander''s Heat
      Vision with his own, albeit with considerable effort. Soldier Boy struggled
      to resist being pushed by it and later he left a scar on his face) | Unknown
      (Has no offensive feats after his "deal" with "Kessler"), At least Small Building
      level, possibly Building level with tendrilsUpscales from 0.028, possibly from
      0.428 Tons of TNT (Tore Victoria Neuman in half and knocked out Zoe. Hughie
      stopped Annie and Kimiko from intervening, saying it would be suicide. Butcher
      believed that "Kessler" could save Annie from The Deep)'
    source_ids:
