        *Kaiju: Kaiju (怪獣 kaijū) is a Japanese word that literally means "strange
        beast" and is usually translated as "monster" in English. Traditionally, kaiju
        can refer to any sort of strange creature, but in recent times the word has
        become associated with a genre of tokusatsu entertainment, specifically Japanese
        cinema that involves giant monsters. The most powerful kaiju are at times
        advertently referred to as daikaiju (大怪獣 daikaijū) the prefix dai- emphasizing
        great power or status and is usually translated as "giant monster." *Mecha:
        In science fiction, mecha (メカ) or mechs are giant robots or machines typically
        depicted as piloted and as humanoid walking vehicles. Mechas are typically
        depicted as humanoid mobile robots. The term was first used in Japanese (meka)
        after shortening the English loanword mekanikaru (''mechanical''), but the
        meaning in Japanese is more inclusive, and "robot" (robotto) or "giant robot"
        is the narrower term. *Kaijin: Kaijin (怪人) is a Japanese word that means "mysterious
        person." In Japanese, kaijin is a relatively broad term that encompasses any
        fictional human-like character that possesses strange supernatural abilities
        and is usually used to refer to villains. *Hiiroo: (ヒイロ) is a person who is
        admired for great or brave acts or fine qualities. Any individual of colorful
        appearance and extraordinary prowess. *Earth Defenders: Earth Defenders tolerate
        humans but do not make a point to defend them - they see the Aliens as a blight
        on Earth and destroying them is their primary goal. They protect the world
        and their home of Monster Island from any foreign threat including humans.
        *Divine Monsters: These monsters are/have been worshipped by humans, and are
        aware of their divine power (figuratively and literally) and exert it, both
        to reward and punish, some being more benevolent than others. Most of them
        defend the cosmos itself, and therefore often ally with Earth Defenders. *Demonic
        Monsters: A demon is a supernatural evil being, that usually follows the commands
        of a demonic deity, whose principal motivations can vary, but usually tortured
        souls and kaiju for eternity in Hell. *GDF (Global Defense Force): The Global
        Defense Force has built many mechs to defend mankind from monsters, be they
        from Earth or Outer Space. *Aliens: These Alien monsters do the bidding of
        different alien races. Their primary goal is to conquer Earth by any means.
        They are willing to destroy both humans and kaiju from the other factions
        alike to achieve their goals, and with the support of their military, they
        are prepared to crush any resistance from the planet. *Lawless Monsters: Due
        to various reasons, these monsters merely follow their own needs, making no
        allies and attacking everything that threatens them. Some have a lust for
        power that comes before all other concerns, all working for their own, sinister
        agenda: to destroy everything in their path. Some of them are bent on world
        domination, while others merely destroy what they dislike and if unchecked,
        could destroy human civilization. *Independent Forces: These monsters are
        under mind control to obey the power of crazy scientists or any other races
        that came from Earth, and independently of the period, who have the intention
        to take control over the planet. Thes'
