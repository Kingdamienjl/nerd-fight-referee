  intelligence:
    text: "Gifted (Despite having quite a na\xEFve personality, Jack has proven himself\
      \ to be very intelligent. When a group of angels was pursuing him and the Winchesters\
      \ into the Sunstar Line cargo ship, Jack predicted that the angels would use\
      \ angel radio on him as soon as they got to him, based on his experience of\
      \ angels using it on him before. He easily figured out how the witch Broomhilda's\
      \ magic was killing Lora. This is something even Castiel and Jules couldn't\
      \ uncover, although Lora had told him the story of her captivity and not Castiel\
      \ and Jules. In addition to his intellectual feats, he has been shown as emotionally\
      \ competent. When killing Michael, he was smart enough to absorb his grace,\
      \ restoring his powers. After absorbing his essence, he should have inherited\
      \ God's Nigh-Omniscience)"
