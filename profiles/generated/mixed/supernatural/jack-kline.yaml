- id: claim-weaknesses-9ce3ab63
  section: weaknesses
  axis: weakness
  text: 'Archangel Blades | Same as before | None notable Notable Attacks/Techniques:
    *Biokinesis: Jack was able to easily inflict pain on Michael that damaged his
    vessel and brought him down to his knees (leaving him severely weakened and unable
    to fight) a feat never seen before even Lucifer was shocked. *Supernatural Concealment:
    When Jack does not want to be found, his powers are subconsciously concealing
    him from other beings, which was shown by the fact that Asmodeus and Lucifer and
    everyone else who were looking for him were incapable of tracking his whereabouts.
    This is notable considering how his immense power usually makes him very easy
    to locate. *Molecular Combustion: When Jack and Kaia combined powers to open a
    rift to an alternate reality, Kaia''s screams caused the rift Jack was opening
    to emit a yellow glow that caused six nearby angels to turn to dust. After lifting
    Zachariah into the air with telekinesis, Jack was able to cause Zachariah to explode
    simply by clenching his fist. By sending energy pulses similar to his telekinesis
    into the air, Jack caused three more angels to explode in mid-air. ==Notable Matchups==
