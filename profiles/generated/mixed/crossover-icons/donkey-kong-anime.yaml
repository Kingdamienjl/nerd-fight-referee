      the former capable of bringing metors down and the latter freezing over all
      of DK Island) | Multi-Galaxy level (Is a Star Child. By being a Star Child,
      Donkey Kong has a star embedded within his heart that grants him sufficient
      enough power to conquer the universe, given that the other six Star Children
      are with him. To have enough power to conquer the universe, he would have to
      be at this level.) | At least Solar System level+ to Multi-Solar System level+
