    Mastery (Witchers are known for not leaving sound with their footsteps.Also Geralt can sneak to soldiers
    to stun them) *Magic (Can perform rudimentary but effective magic with his signs) *Pseudo-Time Slow
    (With Heliotrope, can slow down time in a bubble-shaped area) *Forcefield Creation, Purification,
    and Attack Reflection with Quen (Reflects 50% of the damage it takes back at the attacker. Geralt
