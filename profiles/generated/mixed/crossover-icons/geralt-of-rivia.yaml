- id: claim-powers-and-abilities-7496fa04
  section: abilities
  axis: hax
  text: '{{#tag: tabber| The Witcher 1-3= === Base Geralt: === *Superhuman Physical Characteristics **Longevity
    (Due to witcher mutations expanding his lifespan, he could live as long as Vesemir, who was around
    most likely 300-400 years old at the time of his death and was just barely an old man by witcher standards)
    **Self-Sustenance (Type 2 - A witcher named Kiyan who was subjected to mage experiments didn''t eat
    anything for years and could still fight, and was described to "eat and drink by himself") **Regeneration
    (Low-Mid - can regenerate a big hole in his neck in a few months. healed from getting brutally bitten
    in the neck by Dettlaff. Eskel explains that witcher''s wounds heal much faster than normal humans'')
    **Limited Body Control (As stated in The Witcher 3 Universe Compendium, witchers are able to regulate
    the speed of their pulse and the flow of adrenaline, giving them unparalleled reflexes and strength)
    **Enhanced Senses (Vision, Hearing, and Smell - Has night vision, highly enhanced senses of smell
    and hearing, and can see through walls with certain potions. Could casually notice that Scoia''tael
    members are aiming arrows at him and Zoltan without even seeing them and hear them breathing, knowing
    their condition, and can detect the scent of things used long ago. Straining his senses allows him
    to smell and hear things hundreds to thousands of meters away. His Medallion can sense Places of Power,
    magic and nearby items. Can even see, hear and interact with ghosts, as seen when he talks with the
    von Everec ghosts in Hearts of Stone. Normal humans like Shani couldn''t sense them) ***Minor Instinctive
    Reaction (Could instinctively block an unexpected blow in the dark, instantly dodged a creature''s
    swing in sleep) **Acrobatics (Hypermobility, All-Terrain Mobility, and Self-Momentum - Geralt is incredibly
    agile, and can jump off castle walls with taking no damage. Expert at rolling and using complex maneuvers
    in battle, which he uses a lot) *Supernatural Willpower (Has lasted more than a century fighting monsters
    and bandits for a few crowns and barely living. Has experienced the death of his friends, loved ones
    and himself but it hasn''t demoralized him from still protecting the ones he still has. Fought the
    entire armada of the wild Hunt with the help of Letho of Gulet and a few other witchers and didn''t
