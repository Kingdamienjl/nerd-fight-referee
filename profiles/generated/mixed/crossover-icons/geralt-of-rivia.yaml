    a 50% chance to blind an opponent and another 50% to incinerate the opponent) *Explosion Manipulation
    (With explosive crossbow bolts) *Illusion Creation (With Fringilla''s medallion, could kill cast an
    illusion on Vilgefortz and kill him) {{!}}-{{!}} Blood and Wine= *All of the previous abilities enhanced
