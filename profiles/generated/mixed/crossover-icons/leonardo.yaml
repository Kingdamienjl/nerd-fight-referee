  attack_potency:
    text: Small Building level+ (Killed the creature known as Complete Carnage. A
      being that could turn itself into any form, control steel/concrete and absorb
      energy from other entities. Can match swords with The Shredder, Usagi and other
      enemies on his level) | At least Town level (Wields the Gunshin sword, which
      has been shown to be comparable to Raphael's "Banrai" which was stated to be
      able to shatter mountains by Juto-Shisho) | At least Planet level+, possibly
      Large Planet level (Has clashed with and defeated the Mystic Ninja on multiple
      occasions, members of which were capable of defeating the Ninja Tribunal with
      apparent ease) | Large Planet level (Managed to beam struggle and even temporarily
      defeat Tengu Shredder in his Dragon form. Destroyed an entire army of demons
      who were all apparently well above the Mystic Warriors)
    source_ids:
    - mediawiki-4668337
    confidence: 0.8
    notes: auto_repair source extraction
  speed:
    text: Supersonic (Has outrun missiles with extreme ease and scales to his brothers
      who can easily outrun missiles as well), with Massively Hypersonic+ reactions
      (Should be comparable to Michelangelo who can react to attacks from the Justice
      Force members such as Silver Sentry who was mind-controlled to kill Michelangelo.
      Sentry and the other Justice Force members are capable of leaving the Earth
      at this speed and are capable of reacting to and dodging electricity. Reacted
      to a huge meteor which was aimed at him alongside the other turtles) | Massively
      Hypersonic+ (Should be far faster than his base form. Is equal to Chi Empowered/Mystic
      Raphael and Donatello who can easily one-shot a Boulder Monster who in turn
      can easily one-shot the Silver Sentry. Fought against the Tengu Shredder alongside
      the other turtles, who can easily defeat the Silver Sentry. Equal to Chi Empowered/Mystic
      Michelangelo who is on equal footing with Hisomi-Shisho who can run 200 yards
      in just a second and managed to traverse mountains on foot with ease) | Massively
      Hypersonic+ (Far faster than Chi Empowered/Mystic Leonardo. Alongside with the
      other Chi Empowered/Mystic turtles fought against and moved faster than the
      Tengu Shredder could react)
    source_ids:
    - mediawiki-4668337
