  intelligence:
    text: Highly adept at stealth, subterfuge, and misdirection. Additionally, he
      is well-versed in the use of armed combat martial arts. His fighting style seamlessly
      blends attacks with any part of his body and weaponry. Along with these abilities
      comes a propriety for assassination techniques. Can match blades with Shredder,
      the Foot Elite, and Usagi without falling in combat. Brilliant tactician, nearly
      every plan of attack for the Turtles is devised by their leader. Also successfully
      negotiates a truce with the Foot Clan, bringing about an end to the constant
      fighting that plagued New York City.
