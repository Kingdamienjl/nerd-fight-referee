- id: claim-powers-and-abilities-95b670cf
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Weapon Mastery (Skilled with a variety of weapons), Shapeshifting
    (Can change between humanoid, squid, and ink forms at will), Regeneration (Mid-High, Low-Godly via
    Spawn Points; Can normally regenerate over half of their body after being converted to foreign ink.
    However, if their entire body is destroyed, they require a Spawn Point in order to regenerate from
    their soul), Intangibility (Elementa, Type 2, Can turn completely into ink and can turn any weapon
    they're carrying into ink), Bioluminescence, Enhanced Senses (Can accurately target prey unassisted
    from 100 meters away), Biological Manipulation (Able to change their color at will when out of battle),
    Stealth Mastery, Damage Boost (Via Object Shredder), Statistics Amplification (Speed Amplification
    Via Opening Gambit), Statistics Reduction (Speed Reduction Via Disruptor and Toxic Mist), Information
    Analysis (Via Recon), Forcefield Creation (Via Baller, Bubbler, and Ink Armor), Explosion Manipulation
    (Via Burst Bomb, Ink Mine, Splat Bomb, Suction Bomb, Autobomb, Curling Bomb, Fizzy Bomb, Torpedo,
    Bomb Launcher, Booyah Bomb, Bomb Rush, Bubble Blower, Inkstrike, Splashdown, and Tenta Missiles),
    Sound Manipulation (Via Echolocator and Killer Wail), Extrasensory Perception (Via Bomb Sniffer, Haunt,
    Thermal Ink, Ink Mine, Point Sensor, Echolocator, and Sting Ray), Flight (Via Inkjet), Weather Manipulation
    (Via Ink Storm), Transformation (Via Kraken), Invulnerability (Via Kraken and Bubbler), Energy Projection
    (Via Sting Ray), Intangibility (Molecular Via Sting Ray), Homing Attack (Via Seeker and Tenta Missiles),
    Resistance to Bone Manipulation (Due to lacking bones)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
