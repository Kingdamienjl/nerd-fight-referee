power_scale:
  tier:
    text: '{{9-B}} to {{9-A}}, {{High 6-A}} with vehicles Name: Fox McCloud Origin:
      Star Fox Gender: Male Age: 30 years old in Star Fox Command Classification:
      Red Fox, mercenary, leader of team Star Fox'
    source_ids:
    - mediawiki-fox-mccloud-game
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Wall level by himself and with weak weapons (Overpowered an 8 meter tall
      saurian with Krystal´s staff. Can blow up small Aparoids with his blaster and
      send people flying dozens of meters in the air with a charged blast and one-shot
      them. Able to take his fellow team members in mock combat), Small Building level
      with his best weapons (His grenades have a 12-foot blast radius), Multi-Continent
      level with vehicles (The Arwing is capable of obliterating Andross wielding
      the powers of the Krazoa Spirits, who are able to reconstruct Saurai's planet.
      It is considered the most powerful vessel in the galaxy. Should be comparable
      to its durability)
    source_ids:
    - mediawiki-fox-mccloud-game
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Superhuman with Supersonic combat speed and reactions (He has dodged arrows
      and blasters), FTL with the Arwing.
    source_ids:
    - mediawiki-fox-mccloud-game
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Building level (Survived great falls, being crushed by the 8-meter tall
      Saurian, and an Aparoid around this size), higher with barriers and reflectors.
      Multi-Continent level with vehicles (Can take hits from a Krazoa Spirits-empowered
      Andross and is able to take hits from the Gorgon's laser, which is capable of
      piercing a planet's crust in one shot, which would yield this much energy, and
      is considered a planet-killer. Can take hits from the Meteo Crusher, which is
      stated to be able to "clean up" unwanted planets in its path, one of which is
      hinted to be a ninth planet in the Lylat System that was reduced to a planetoid
      field. His vehicles are considered the most advanced craft the Cornerian Army
      has to offer)
    source_ids:
    - mediawiki-fox-mccloud-game
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Seems to be much higher than a regular human via feats)
    source_ids:
    - mediawiki-fox-mccloud-game
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Varies; Tens of Meters generally (With a blaster, and Landmaster); far higher
      with the Arwing.
    source_ids:
    - mediawiki-fox-mccloud-game
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted in combat intelligence (Possesses such a mastery over piloting that
      they are superior to the entire Cornerian Army, being one of the finest pilots
      in the entire solar system, and managing to take down Andross and his army,
      including entire fleets of ships alongside his team. He is able to defeat Aparoids
      frequently. Just one Aparoid was able to take down an entire fleet by itself,
      and he was able to best their queen, ending the threat of the species. He frequently
      dogfights Star Wolf, who are the only ones in the Lylat System comparable to
      them in skill)
    source_ids:
    - mediawiki-fox-mccloud-game
    confidence: 0.6
    notes: auto_repair source extraction
