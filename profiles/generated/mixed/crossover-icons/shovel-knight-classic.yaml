    - field: weaknesses
      value: 'Mostly classic vampire weaknesses (listed below) Feats/Statements: {{Quote|
        *Generally immortal. Bullets don’t work. Strength is 10-20 times normal. *Automatically
        regenerate any damage taken. *Take lethal damage from direct sunlight when
        outdoors. However, they can get along just fine indoors even during the day.
        No reports of taking damage from artificial sources such as UV lights. *Crushing
        their head won’t kill them. A stake from ash wood or hawthorn kills them instantly
        when driven through the heart. Also, thorough damage to the heart by other
        means keeps them from moving. When in their coffin during the day, destroying
        the heart with something other than their weakness and then burning their
        entire body will kill them. Burning them without destroying the heart works
        too. (Do holy water or silver bullets work? Are they different than werewolves?
        Watch out for mixed legends. I should probably ask my sister.) *Can’t cross
        flowing water. Mainly means rivers. But what about plumbing and sewers? +Oh,
        yeah. My sister can’t swim at all, can she? *When visiting someone else’s
        house, can’t enter without the owner’s permission. *Don’t show up in mirrors.
        The human eye and cameras can see them just fine. *To turn someone into a
        vampire, they have to suck a lethal amount of human blood. (1-2 liters?) *Can
        only turn humans into vampires. *They suck blood to acquire occult energy.
        Not enough and they can’t maintain their body. They also eat just like a human
        does. *Turn to ash when they die. *They have individual skills (changing size,
        controlling the mist or wind, and transforming into a bat, a wolf, or a bug)
        and strength varies depending on the individual. This is kind of like genetic
        mutations, so a vampire apparently can’t intentionally make someone into the
        kind of vampire they want. *They have a defined social hierarchy based on
        the queen. *The queen’s orders are absolute, but they generally have high
        intelligence. The same or greater than humans. *Said to be based on a blood
        curse, so they’re more on the occult side of things. There doesn’t seem to
        be any scientific sense behind their weaknesses or the path to usurpation.
        ← I just inputted everything according to the legends. |My Vampire Older Sister
        and Zombie Little Sister 01 - General Vampire traits}} {{Quote| Meanwhile….Oh,
        no. They’re keeping up with us. Several vampires were jumping from building
        to building in the sunken city!! Not even the horsepower of a motorboat could
        outdo vampires with the power of the night. They were catching up and they
        would jump onto the boat before long. [...] It was Erika. We were running
        the motorboat at full speed, but we never seemed to move any further from
        her voice. The voice reverberated oddly throughout the wide outdoors and pursued
        us indefinitely. |My Vampire Older Sister and Zombie Little Sister 01 - Vampires
        keep up with a motorboat by roof hopping}} {{Quote| She ran down another tunnel
        too fast for a normal person to keep up. A few vampires joined her and supported
        her. A few gunshots tried to stop her, but they were quickly silenced and
        replaced by cries of despair and meaningless pleas for mercy. |My Vampire
        Older Sister and Zombie Little Sister 01 - Vampires are superhumanly fast}}
        {{Quote| In addition to the standard traits, most vampires have a special
        skill. These are most likely mutations created from a mixture of the victim’s
        own traits and the skill of the vampire that bit them. One group is attempting
        to establish a link between this and the chromosome damage caused by cell
        death while the blood is being sucked out, but that will likely end in failure.
        |My Vampire Older Sister and Zombie Little Sister 01 - Besides their generic
        traits vampires have extra supernatural powers that change from vampire to
        vampire}} {{Quote| “We vampires can transform into a great variety of animals,”
        said Erika in her dress. “Bats, wolves, rats, moths, and so on. Even if a
        ferocious beast tears us apart and swallows us bit by bit, we can still transform
        inside its belly. This one became countless moth larvae and ate through the
        thick blood vessels to reach the head.” |My Vampire Older Sister and Zombie
        Little Sister 01 - Vampires tend to have shapeshifting abilities}} {{Quote|
        “Younger brother, Vampires have many'
