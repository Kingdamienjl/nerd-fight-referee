    - field: weaknesses
      value: 'Can be somewhat overconfident in some situations. Notable Attacks/Techniques:
        Captain Falcon *Falcon Punch: Captain Falcon draws his arm, charges energy
        briefly, and thrusts his fist forward, utilizing his Pyrokinesis for a devastating
        attack. **Falcon Dash Punch: Captain Falcon dashes towards his enemy while
        executing a Falcon Punch (A bit weaker then the standard Falcon Punch, leaves
        him vulnerable while executing the process). **Mighty Falcon Punch: A more
        powerful version of the standard Falcon Punch (Leaves him extremely vulnerable
        while executing the process). *Falcon Kick: Captain Falcon dashes forward,
        leg extended and cloaked in flame. **Lightning Falcon Kick: Instead of using
        his pyrokinesis, Captain Falcon uses his electrokinesis to perform a faster
        version of the standard Falcon Kick (Attack deals bit less damage, can go
        trough multiple enemies, can stunt opponents at the start up of the process).
        **Falcon Kick Fury: Captain Falcon deals multiple kicks to his enemy (Does
        not apply his pyrokinesis for the use of this move,can hit multiple opponents
        at once, knocks back the enemy at the end of this move). *Raptor Boost: Captain
        Falcon coils his arm back and thrusts himself forward, encasing his fist in
        flame and uppercutting the first foe he comes in contact with. **Heavy Raptor
        Boost: A Raptor Boost that has a slow starting process but packs more power
        (Ignores attacks that deals little damage, attacks with strong damage can
        interrupt the process while it''s being used). **Wind-up Raptor Boost: Captain
        Falcon steps back then charges at the enemy with a Raptor Boost (Captain Falcon
        moves faster while using this attack, the attack itself deals less damage
        than the standard version of the Raptor Boost). *Falcon Dive: Captain Falcon
        jumps upwards, latches onto his foe, and then rebounds off of them as they
        are engulfed in an explosion. **Explosive Falcon Dive: Has a more explosive
        range than the standard Falcon Dive (Has less jumping height than the standard
        version). **Falcon Strike: Deals a strike instead of grabbing the enemy (Has
        more jumping height than it''s standard version). Blue Falcon *Boost Fire:
        Captain Falcon forces the Blue Falcon to spin rapidly, releasing an aura that
        cuts through structures.'
      source_id: character-stats-profiles-captain-falcon-game
