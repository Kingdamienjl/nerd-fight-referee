        ones. However, it''s unclear if it actually means entire universes or just
        basic attacks.) | Ranges from Galaxy level to Universe level+. (Mario has
        consistently defeated foes who are capable of imprisoning the Power Stars.
        Rosalina has clearly stated in Super Mario Galaxy that Power Stars are one
        of the many afterlife transformations of Lumas. These same Lumas can also
        transform into planets, comets, stars, or even galaxies. Mario is also capable
        of defeating foes with Grand Stars, which are responsible for keeping the
        Lumas alive. Since Mario is constantly physically toppling characters this
        powerful in the 3D genre, Mario should be Galactic at bare minimum. However,
        this isn’t his absolute potential. Mario has commonly taken on Bowser, who
        was able to tank a universe consuming black hole at point-blank range in Super
        Mario Galaxy. In Super Mario Galaxy 2, the Grand Star Bowser wielded was responsible
        of creating a massive black hole that covered the entirety of a singular universe.
        He even scales to Rosalina, who, despite being able to dwarf Mario in terms
        of powers and abilities, has still shown that she can get hurt from standard
        enemies around his level, as seen in Super Mario 3D World. Rosalina has shown
        to have the ability to manipulate the time-space continuum to her own liking,
        such as resetting it entirely in Super Mario Galaxy.) | Multi-Continent level
        in Mario & Luigi: Superstar Saga. Mario is capable of defeating foes who are
