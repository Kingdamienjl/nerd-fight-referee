        to numerous different worlds, as seen in numerous other Mario games. It''s
        big enough to be considered a continent. The BeanBean Kingdom is stated to
        be equal in size, so it''s likely that Bowletta was going to form an even
        bigger country. Island level in Mario & Luigi: Partners in Time. Mario defeated
        the Elder Princess Shroob, who was able to form an entire storm that spread
