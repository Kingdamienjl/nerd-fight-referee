        the Dark Star and Dark Fawful. Mario defeated Bowser in the same game. Ranges
        from Universe level to Multiverse level in Mario & Luigi: Dream Team. Mario
        was capable of defeating Antasma, who is vastly superior to Dreamy Luigi.
        One of Dreamy Luigi''s abilities allowed him to control time itself. He even
        overpowered the even stronger Dreamy Bowser, who had the power of every single
        dream. Dreams are obviously universes, as we see Mario enter them. There are
        hundreds of inhabitants on Pi''illo Island, so it makes perfect sense for
