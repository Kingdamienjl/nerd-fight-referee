        upon activation. All of his attacks will double in power but he also receives
        double the damage from his opponents as well. {{!}}-{{!}} Magic= bowser crush.gif|Bowser
        Crush. illusion hat.gif|Illusionary Hats. bowser gravity.gif|Gravity Inversion.
        Magic: Alongside his usual tactics for combatting his foes, Bowser is also
        no stranger to using magic to achieve what he desires. *Transmutation: A personal
        favorite of his, Bowser will cast a spell on his target(s) that will change
        them into helpless stone bricks, blocks, plants, frogs, apples, or even obedient
        monsters, being able to affect entire populations of a country at once with
        the spell with ease. *Bowser Crush: Bowser will create a giant green Mechakoopa
        to stampede over his opponents. *Illusionary Hats: Bowser will create illusionary
        hats to throw at his opponent, despite being illusions they can physically
        harm anyone they touch. *Gravity Inversion: Bowser will alter his targets
        gravity to fling them to his desired destination, being able to move even
        those who can withstand and somewhat resist the gravitational pull of a black
        hole, he can also alter his own gravity to achieve the same effects. *Endless
        Distance: Bowser will distort and manipulate the very fabric of space itself
        to create what seems to be an infinite amount of distance. Using this technique,Bowser
        will create a spatial loop that traps his targets at the start leaving them
        unable to get near him. *Bowser Curse: Bowser will place a curse on his target
        that will allow him to control their movements, having been shown to make
        them take steps they didn''t mean or want too, or force them to turn around
        and walk in the opposite direction. {{!}}-{{!}} Other Techniques= ground pound
        plumber.jpg|Mario ground-pounding. Ground Pound: Introduced in Super Mario
