    shield that makes attacks bounce off Arwings while rolling and are reflected back
    to sender), Forcefield Creation (The G-Diffuser produces a forcefield that protects
    the ship from enemy fire), Heat Manipulation (Smart Bombs can evaporate Solar
    Prominences, which are arches of incandescent gasses, breaking them apart. Said
    gasses are higher than 9,000 degrees), Resistance to Radiation Manipulation and
    Magnetism Manipulation (Radiation and magnetism-based storms cause most ships
    in Sector Y to malfunction. Star Fox's Arwings are not affected by this), Gravity
    Manipulation (Comes equipped with an anti-gravity device), Heat Manipulation (Arwings
    can take up to 9,000 degrees, something that Slippy reaffirms. However, even if
    the temperature exceeds this, the ship's shields will protect it from this for
