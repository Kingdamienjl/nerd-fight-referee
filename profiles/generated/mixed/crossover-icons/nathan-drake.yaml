    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (Has encyclopedic knowledge of vast amounts of history including
      South American mythology and civilizations, Tibetan culture, Arabian legends,
      Marco Polo's travels, Sir Francis Drake's discoveries, Greek mythology, pirate
      history and more. He can recall historical dates and the exact events that occurred
      during that time with startling accuracy. Has noticed inconsistencies within
      history, which led to the unveiling of secrets such as the Tree of Life and
      Sir Francis Drake's missions and supernatural threats hidden away by the late
      explorer. Is knowledgeable in several languages, being able to fluently translate
      16th century Spanish from the pages of an old journal and fluently read Latin
      along with some skill in Indonesian, Turkish, German, etc. When he competes
      against others over a treasure, he is always ahead and makes breakthroughs they
      couldn't accomplish themselves even when they held a major advantage. He has
      solved dozens of ancient puzzles in his career with the use of his historical
      knowledge, observations and notes in his journals. In terms of combat, he is
      a master of improvisation and uses his sharp wits to escape any sticky situation
      he may find himself in through either banter or quickly improvised plans. He
      even utilizes the environment in combat and thanks to his acrobatic skills and
      gear, he can get the drop on foes without being detected. He is very skilled
      in close combat despite not being formally trained, taking out nearly a dozen
      agents and mercenaries at once, defeating men who are twice his size and fending
      off supernatural beings. Additionally, he's skilled when it comes to weaponry
      and is proficient with any firearm he gets his hands on (including primitive
      weapons like a crossbow) and managed to hold his own against Rafe Adler in a
      swordfight despite never using a sword before.)
    source_ids: *id002
    confidence: 0.95
