      over 1,250 lbs of force. Caught and held a large gate. Pushed a Aerospatiale
      Alouette III helicopter overboard a ship through weakened railings)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Small Building level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Small Building level (Was blown up alongside Charlie Cutter by an RPG, which
      yielded this much energy. Was blown up by a tank shell but was only knocked
      back. Has tanked multiple RPG explosions on several occasions. Has taken blows
      from Lazarević, Talbot and Nadine). His luck makes him somewhat difficult to
      kill.
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Despite getting shot and losing a lot of blood, he still managed
      to defeat a group of mercenaries. Later, he would power through a Himalayan
      blizzard while still bleeding out and not wearing the appropriate gear and clothing.
      Defeated groups of mercenaries in an abandoned village after roaming the Rub'
      Al Khali desert or two straight days without any food or water)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range; Several Meters with grenades; Hundreds of Meters with
