      her. Can wield explosive weapons like the RPG-7, which is powerful enough to
      damage tanks)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Subsonic+Mach 0.3386 (Ran from an RPG rocket after it was fired at his position.
      Was described as being too fast to track by by mercenaries and snipers while
      on foot) with Supersonic+ combat speed and reactions (Has consistently dodged
      RPG-7 rockets. Has also consistently dodged rounds from assault rifles like
      the AK-47 and the G36. Reacted to and shot down Hydra 70 missiles from a helicopter),
      Subsonic+ (Makes use of M1911s and rocket launchers) to Supersonic+ attack speed
