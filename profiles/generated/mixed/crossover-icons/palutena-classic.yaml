    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "At least Multi-Continent level (Can harm characters who can withstand attacks\
      \ from Reshiram, who can scorch the world with fire, and should be superior\
      \ to such; Palutena going so far as to call him \u201Carguably the most powerful\
      \ Pok\xE9mon in existence\u201D, and Viridi even immediately wanting him dead\
      \ when she considered his potential for havoc), higher with items, far higher\
      \ via Daybreak, Dragoon, Home-Run Bat, Golden Hammer, or Psystrike | Universe\
      \ level+ (Fought and defeated Galeem and Dharkon, who are individually capable\
      \ of crushing the universe in a short period of time. Can also contend with\
      \ characters amplified by Spirits of Palkia and Arceus, the former of whom controls\
      \ all of space and the latter of whom appeared from nothing and created the\
      \ world and sky. Possesses highly trained Spirits of Master Hand, Crazy Hand,\
      \ and even Galeem and Dharkon themselves), higher with items, far higher via\
      \ Daybreak, Dragoon, Home-Run Bat, Golden Hammer, or Psystrike"
    source_ids:
    - mediawiki-palutena-classic
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Immeasurable (Managed to move fast enough to create a shield in an attempt
      to protect itself from Galeem's rays of light, and is comparable to other combatants
      who could also react to them to different degrees, such as Link parrying some
      of them or Kirby outpacing them with a Warp Star. All combatants can also use
      a Warp Star to quickly crash-land on targets, and it's possible for them to
      react to and dodge it)
    source_ids:
    - mediawiki-palutena-classic
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
