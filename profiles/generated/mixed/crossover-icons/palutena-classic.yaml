  durability:
    text: Multi-Continent level (Can take hits from Kirby, Captain Falcon, and Duck
      Hunt and other fighters in World of Light) | Universe level+ (Can withstand
      hits from Galeem and Dharkon)
    source_ids:
    - mediawiki-palutena-classic
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman; Can fight off hundreds of opponents in Endless Smash; was able
      to aid in the battle against dozens of Master Hands
    source_ids:
    - mediawiki-palutena-classic
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Several Meters with ranged attacks, Extended Melee
      Range to Hundreds of Meters with items and Psystrike (Some Items, like Timer
      and Lightning, can affect even the largest stages, like Palutena's Temple)
    source_ids:
    - mediawiki-palutena-classic
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "At least Gifted in combat; Fitting for the ultimate Pok\xE9mon, Mewtwo\
      \ is one of the most intelligent Pok\xE9mon representatives in Smash Bros, notably\
      \ one of the greatest known fighter from the Pok\xE9mon series. On top of this,\
      \ he can use any given weapons and items in combat. Can defeat 100 Mii Fighters\
      \ in Century Smash, and multiple hundreds without rest in Endless Smash. Can\
      \ hold off wave after wave of every other fighter in All Star mode."
    source_ids:
    - mediawiki-palutena-classic
    confidence: 0.6
    notes: auto_repair source extraction
