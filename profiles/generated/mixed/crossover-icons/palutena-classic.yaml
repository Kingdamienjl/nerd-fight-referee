power_scale:
  tier:
    text: At least {{High 6-A}}, higher with items, far higher via Daybreak, Dragoon,
      Home-Run Bat, Golden Hammer, or Psystrike | {{Low 2-C}}, higher with items,
      far higher via Daybreak, Dragoon, Home-Run Bat, Golden Hammer, or Psystrike
    source_ids:
