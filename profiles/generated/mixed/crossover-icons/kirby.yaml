  attack_potency:
    text: Large Planet level (Can trade blows against foes that can harm him,4.63
      ronnatons such as Meta Knight, King Dedede,Kirby Super Star'Kirby Air Ride'Kirby
      Super Star Ultra and other final bosses. Defeated Marx, whose body survived
      a part of Nova itself blowing up, which destroyed it to small piecesSide content
      portrays Marx as having died from this, but it happened right after being beaten
      by Kirby, Marx's body was still in 1 piece, and somehow remained active enough
      to absorb things around.), able to negate durability with some base powers or
      Copy Abilities | Low Multiverse level (Helped by Meta Knight, King Dedede &
      Bandana Waddle Dee, their battle against Magolor EX "went beyond limits"Magolor
      Soul's Jap. pause description, Extra Mode · Kirby's Return to Dream Land Deluxe
      [ie made them stronger], allowing them to defeat Extra Mode Magolor Soul,15
      or 16 universes destroying the Master Crown. Stated several times to have "infinite
      power," which is reminiscing & a likely progression to how the Master Crown
      was repeatedly stated to have the same.Note that, on its own, having "infinite
      power" like this is irrelevant due to being an obvious hyperbole. Kirby and
      the crown having the same connotation is simply being said to further support
      the scaling between them. In side content, which shows what Kirby can do, he
      displays further feats that scale him to the crown), able to negate durability
      with some base powers or Copy Abilities | Low Multiverse level (Displayed further
      scaling to the Master Crown and became stronger), able to negate durability
      with some base powers or Copy Abilities
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively FTL+ (Kept up by himself with Meta Knight, Nightmare, Dark Meta
      Knight, Dark Mind, Dark Nebula, Jamba Heart pieces, and Void Termina several
      times; All of which proven to be comparable in speed to Warp Stars [8387548039870.238c],
      which Kirby is capable of flawlessly piloting while reacting & dodging obstacles
      & projectiles. Has many times piloted Warp Stars & similar vehicles as they
      fly interstellar distances in short amounts of time, beyond just straight trajectories.
      Presumably launched Marx from a moon to Nova, who was at interstellar distances.
      Repeatedly outran waves that were consuming interstellar parts of Another Dimension,
      which were moving fast enough to get past stars and nebulae in the background,
      as well as keeping up with the Lor Starcutter and Landia.Kirby's Return to Dream
      Land'Kirby's Return to Dream Land Deluxe Can redirect a world destroying meteor
      9999 light years away in seconds. Was able to keep up with other beings capable
      of travel interstellar distances with ease while being able to maneuver in their
      movement. Can put higher efforts to mobilize slightly faster than normal)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: '*Acrobatics (Hypermobility & Self-Momentum. Can easily mobilize around
      in ground & air while doing pirouettes, spinning at numerous angles, and having
      his body contracted. While in the air, he can will his body to quickly descend,
      to bounce into greater heights, or move at an opposite side, regardless of his
      prior momentum. Doesn''t lose perception while performing multiple abrupt maneuvers
      in vehicles with omnidirectional control or in adventures where he''s used as
      a ball) *Vehicular Mastery (Skilled while navigating & fighting with land &
      supernatural flying vehicles) *Weapon Mastery (Skilled with long, medium & low
      range weapons, and many other creative & arbitrary ones) *Useful fighting style
      *Stealth Mastery (Could hide in the clouds while climbing around the outside
      of the Halberd to later reappear underneath the ship, potentially having done
      so to mobilize undetected. Portrayed as being able to use sneak attacks) Unique
      skil'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Large Planet level (Can attack with punches, kicks, and tackles using Copy
      Abilities. Can turn into a ball and collide with King Dedede to harm him,Kirby's
      Pinball Land'Kirby's Block Ball'Kirby Tilt 'n' Tumble when the latter gave Kirby
      "an intense death match," despite Dedede not being serious at the timeRevenge
      of The King in-game description · Kirby Super Star Ultra) | Low Multiverse level
      (As before. Previously shown to be able to beat up comparable foes in base;Kirby
      Mass Attack Presumably, as his power grows, all his physical characteristics
      in base remain even. Can turn into a ball and can collide with comparable foes
      to harm themKirby and the Rainbow Curse) | Low Multiverse level (As before.
      Slightly more powerful with Mouthful Mode)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Large Planet level (Survived unharmed a part of the biggest explosion of
      Galactic Nova's nucleus while inside Nova, whereas sections of its body's surface
      were destroyed by it, which were much further away from the blast [4.63 ronnatons].
      Kirby was in his Starship at the time, which leaves most of his body exposed.
      Some of his Copy Abilities augment his durability when used or passively), regeneration
      makes him difficult to kill | Low Multiverse level (By the time he fought Magolor
      Soul, he could take hits from the crown's own version of Kirby's Super Abilities,
      despite how Kirby had short ago used them to overpower Magolor EX's Magic Barrier,
      which was invincible against attacks from Kirby, Meta Knight, King Dedede, and
      Bandana Waddle Dee, having been "a battle that went beyond limits." Otherwise
      see his AP, Kirby can take several hits from any enemy he defeats), regeneration
      and Ghost form/self-resurrection make him difficult to kill | Low Multiverse
      level (Can take blows from Void Termina in all his forms; The Star Allies Sparkler
      doesn't cover the bodies of its drivers. Can take attacks from Post-Magolor
      Epilogue Magolor), regeneration and Ghost form/self-resurrection make him difficult
      to kill
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: 'Superhuman (Completed an adventure without being able to dream, which made
      everyone in Dream Land feel restless and irritable. Fought King Dedede from
      the night until the sunset in the story of the first game, then the same happened
      sometime later [Pre-Star Allies], if Kirby had to first spend some time in Dedede''s
      castle as a Stage, with the windows showing it was still night when he reached
      Dedede. Kirby commonly fights notable, late-game enemies through several phases
      or "fake final battles" with little time between them, not getting exhausted
      until all threats have been dealt withKirby''s Dream Land 2''Kirby''s Dream
      Land 3''Kirby & The Amazing Mirror) | Superhuman normally (As before. Fought
      Queen Sectonia straight through the entire night, the change between a moonlit
      night and an evening sun intentionally indicating the passage of time; Previously
      chased non-stop a Taranza kidnapping King Dedede from the morning of the previous
      day mostly by running, hindered by many Stages and battles, climbing the Dreamstalk
      until reaching "the Heavens'' stratosphere" in Planet Popstar from an unknown
      starting point already in the sky.Kirby: Triple Deluxe Fights notable, late-game
      enemies through several phases or "fake final battles" with little time between
      them. Won Dedede''s Cake Royale tournament over time alongside Bandana Dee,
      which consisted mostly of physical confrontations, beating various Kirby clones
      as good as the original in the process time and again, growing stronger rather
      than showing exhaustion), Infinite as Ghost Kirby (Continues fighting after
      being defeated as Ghost Kirby. Has no health bar in-game, being undefeatable,
      whereas he''s tired & with little health upon coming back to life) | Superhuman
      (As before. Along other Star Allies, he always chased the Jamba Heart pieces
      several times across the Story Mode, covering some parts of several planets
      and moons, if they chased the pieces via a Warp Star while over Planet Popstar
      [Level 2 map] and between celestial bodies [Level 4 map]. Fights notable, late-game
      enemies through several phases or "fake final battles" with little time between
      them. Among a partner, Kirby fought & won sets of many battles in a row in the
      Buddy Fighters Tower, at best facing 48 battles against comparable enemies,
      growing stronger once rather than showing exhaustion), Infinite as Ghost Kirby
      (As before)'
    source_ids: *id002
    confidence: 0.95
  range:
    text: Below Standard Melee Range physically and with weapons (Kirby is 20 cm tall),
      up to Extended Melee Range with Elasticity (Assuming later gaining his Mouthful
      Mode didn't grant him any extra elasticity to his body. Also, the truck is likely
      to be bigger to an unknown degree; see Note 3 below), Standard Melee Range to
      Extended Melee Range with limited forms of Energy Projection and throwable weapons
      that doesn't extend much from his body, Tens of Meters via Star Spit and some
      Copy Abilities (In Air Ride, long-ranged attacks could quickly reach these distances),
      Planetary with shockwaves (Can make a crack across Planet Popstar), Interstellar
      by throwing things (Threw King Dedede into space. Presumably launched Marx from
      a moon to Nova, who was at interstellar distances. Would later be able bat a
      meteor lightyears away). Interdimensional via Pocket Reality Manipulation (Can
      manipulate at least some parts of his stomach dimension. Can keep several items
      in his stomach dimension as Ghost Kirby without issue, but if any one is ejected
      & kept in his mouth, the added weight will make Ghost Kirby unable to fly or
      move beyond spitting the item) and Dimensional Travel (Would later be able to
      use a Warp Star to travel to a specific place in Another Dimension and back)
      | As before. Higher physical range with some Boost Orbs (If they increase the
      range of his attacks), Extended Melee Range with Inhale, Tens of Meters with
      Scope Shot gun, Interstellar with meteor summoning | As before, Thousands of
      Kilometers via Extrasensory Perception (Around 2000 kilometers; Sensed King
      Dedede and Meta Knight's presences with an ominous power somewhat different
      than what they had before from outside the Buddy Fighters Tower, which surpassed
      orbit and had the latter two on top of it)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Below Average in general, Above Average in adventures & combat. Childish,
      innocent, overly friendly, and lazy outside of adventures. Very forgiving, but
      willing to kill anyone if necessary. Varies between being oblivious and competent
      depending on the activities. In adventures & combat: His best displays are shown
      in this context, being competent in adventures and a legend in combat. | As
      before, Genius about technology or via Toon Force Standard Tactics: (See clarifications
      here.) |-|Generally= *Implements Guards into battles, which Kirby should hold
      a notable understanding of when it''s prudent to use it or opt for other options.
      *Getting defeated by Kirby with no particular finishing move often leads to
      targets being thrown meters, kilometres, or even interstellar distances away.
      *Kirby has repeatedly summoned a Warp Star to better travel set distances faster
      or chase foes. *When fighting along allies, Kirby will share healing items via
      Face-to-face food transfer. *Will implement items if he has access to any. *Pre-Star
      Allies: As before. Adds in Dodges & Air Dodges in combat, and uses Space Jumps
      to travel faster short distances. *Can turn into Ghost Kirby to revive himself
      if needed to. *When fighting along allies, they can use Team Attacks, Kirby
      will revive/heal his allies using Revival Spell, or by grabbing their leaving
      souls & bringing them back to the ground to recreate their bodies (At least
      with fellow Kirbys). *Post-Star Allies: As before. Sometimes uses his sensing
      ability, particularly at a distance from foes, and has used it to confirm the
      location of someone he was trying to find. *Has implemented grabs into his moves
      to overcome enemies'' Guards & variants (like forcefields). *When fighting along
      allies, their bonds of friendship is likely to grow, thus making their stats
      grow over time. |-|In base= *His Inhale & Swallow are his most common combination
      of actions, followed by Inhale & Star Spit, using the latter in combat against
      foes he can''t inhale, and the former against foes he can easily deal with that
      way or on things to gain Copy Abilities. **Can use his Super Inhale to improve
      his Inhale if needed to. **Kirby will manually make use of a Copy Ability if
      given the chance. *Kirby has copied powers from others by colliding with them
      when using Inhale was less practical. *Post-Star Allies: As before. May be more
      likely to use a Copy Ability at will. |-|With a Copy Ability= Makes use of the
      moves the Copy Ability offers. | As before. | As before. Makes use of Helpers
      somewhat frequently. Combines elemental powers with allies if possible.'
    source_ids: *id002
    confidence: 0.95
