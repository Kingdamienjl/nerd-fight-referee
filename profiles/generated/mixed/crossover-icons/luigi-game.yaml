      value: 'Usually depicted as cowardly and a klutz, and he has somewhat of a phobia
        of ghosts. Most of his power-ups have a time limit or can be removed from
        an attack, though this is easily circumvented with the Bottomless Gloves.
        Lacks as much traction as Mario does when running, meaning he''ll occasionally
        slide along the ground for a second. | Dreamy Luigi and Luiginoids can only
        be usable in the Dream World. Notable Attacks/Techniques: |-|Common Attacks/Techniques=
        {{#tag:tabber| {{!}}-{{!}}Primary Offense= mario spin jump.png|Spin Jump.
        spin jump ml.png|Spin Jump (M&L Series). high jump ml.png|High Jump. luigi
        hammer.png|Hammer. super hammer.png|Super Hammer. ultra hammer.png|Ultra Hammer.
        Jump: Like Mario, Luigi''s main method of offense would be the use of his
        jumps. He will usually jump on his opponent and crush them with raw strength.
        Although his world-famous brother is far more notorious for his jumps, Luigi
        is notable for being able to jump higher than him. *Spin Jump: Luigi spins
        while jumping, allowing him to jump on spiky enemies and hazards such as buzzsaws
        and even Blarggs. This move can also allow Luigi to hover, slowly descend,
        deflect projectiles, and clear fogs and smoke. Using this move with the Fire
        or Ice Flower with make Luigi scatter fireballs or ice balls in multiple directions.
        *High Jump: The High Jump, also known as the Balloon Jump, is a move that
        Mario and Luigi can execute in the Mario & Luigi series. The function of the
        move is different in each game, but always serves the same purpose; to reach
        high places that are otherwise unreachable with a normal jump. Hammer: Like
        Mario, Luigi is also capable of effectively wielding a hammer for combat.
        Should his jumping attacks prove futile, he will resort to using this as a
        back-up. Applications can range from a simple swing and getting a First Strike,
        to reflecting projectiles, to an upgrade. *Super Hammer: An improvement over
        its predecessor, the Super Hammer allows for greater damage to be dealt and
        the ability to break objects its standard counterpart couldn''t achieve by
        itself. *Ultra Hammer: The Ultra Hammer is the third and final upgrade to
        the Bros. hammers. While it supposedly doesn''t deal more damage than the
        Super Hammer, it does allow for the Bros. to use the Cyclone Bros. technique.
        {{!}}-{{!}} Secondary Offense= thunderhand left.png|Thunderhand (Left). vicious
        vortex.png|Vicious Vortex. tornado swing.jpg|Tornado Swing. tornado ball.png|Tornado
        Ball. Mario zone speed.gif|Like Mario, Luigi can also use Zone Speed. Mario
        Galaxy spin.gif|Like Mario, Luigi can reflect projectiles at his enemies.
        Mario drill spin.gif|Like Mario, Luigi can spiral down like a drill. Inflicts
