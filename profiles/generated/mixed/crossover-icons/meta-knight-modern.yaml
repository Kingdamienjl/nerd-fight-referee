      value: 'Clumsy & goofy, even when serious (Though to a lesser extent, and it
        doesn''t stop him from fighting evenly & defeating foes Kirby may struggle
        with). Considers his own power, abilities & intelligence on a greater regard
        than those of many others, including people that may match or exceed him in
        those categories. Views his own chances of success as higher than what should
        be reasonable, all while slightly pleasing myself on his own superiority,
        getting shocked when things don''t go his way, easily leading to emotional
        responses such as anger, or sadness when fully defeatedRevenge of the King
        · Kirby Super Star Ultra''Kirby Battle Royale. May lack long-term thinking
        and understanding of what his actions do beyond the immediate benefit they
        bring him (Once stole all the food from Dream Land for himself & the population''s
        means to get more food, presumably not understanding how this would starve
        them. Scattered Mr. Star''s pieces and aimed to own them as prank, presumably
        not understanding the full harm this would cause Mr. Star in an intentionally
        malicious way). Bullies hisPlay Nintendo, King Dedede''s description own servantsKirby''s
        Epic Yarn & Kirby''s Extra Epic Yarn for no reason, if he actually cares about
        them. While Dedede has many extraordinary features, his ability to lead seems
        to rely mostly on a mix of his subjects'' low standards, their attachment
        or friendship to Dedede, and Dedede''s ability to pay them off, rather than
        true leadership and charisma. Notes: *Dedede is sometimes shown using mechs,
        weapons, and technology; As far as we know, and contrary to popular belief,
        he''s not the one creating any of them, and WoG has talked about his power-amplifying
