  attack_potency:
    text: 'Low Multiverse level (Helped by Kirby, Meta Knight, and Bandana Waddle
      Dee, their battle against Magolor EX "went beyond limits" [ie made them stronger],
      allowing them to defeat Extra Mode Magolor Soul, destroying the Master Crown15
      or 16 universes. Kirby''s Hammer Copy Ability has as its gimmick its higher
      power next to other regular abilities, and likewise Dedede is that strong in
      gameplay next to those, sharing his moves with the Hammer abilityDededetour!
      · Kirby: Triple Deluxe. Often seenNintendo Power issue 271 (September 2011),
      page 44 as powerful inDedede Clone''s Jpn. pause screen description · Kirby:
      Planet Robobot context that implyKirby of the Stars Wii Deluxe interview · Nintendo
      Dream issue of May, 2023 he''s being compared to the likes of Kirby, Meta Knight,
      and Bandana Dee. Knocked out a slightly tired KirbyMain Mode''s true final boss
      · Kirby: Triple DeluxeWhile he showed no signs of fatigue, Kirby was performing
      one of his most notable feats of stamina in that game, and could be argued to
      be slightly weaker when Dedede hit him.. In side content, which shows what Kirby
      and other characters can do, he can defeat the following: Phase 2 Magolor [a
      weaker form of Magolor with the same multiversal feat], Crowned Doomer https://imgur.com/r7NSTy8
      who obtained the power of the fragments of the crown, the Master Crown possessing
      the Red Fruit, the strongest version of Magolor SoulThe True Arena, updated
      version · Kirby''s Return to Dream Land Deluxe, and Dark Meta Knight), able
      to negate durability via Star Spit | Low Multiverse level (Can assist Kirby
      & 2 fellow Star Allies in the canonical defeats of Void Termina, Corrupt Hyness,
      the Retaliators Three Mage-Sisters [at once]Story Mode & Heroes in Another Dimension
      · Kirby Star Allies. On non-canon side content, and while assisted with 3 Star
      Allies, they can defeat Morpho Knight EX and the stronger incarnations of Void
      TerminaGuest Star ???? Star Allies Go! (If playing the Three Mage-Sisters''
      story) and The Ultimate Choice (Soul Melter & Soul Melter EX difficulties) ·
      Kirby Star Allies. In canon & with the ability to grow more powerful by deepening
      bonds with a friend, he and Meta Knight teamed up to battle 2v2 against Kirby
      and "his buddy" [Bandana Waddle Dee, Gooey or Magolor] a few times. The former
      team ultimately used an item to gain different power in their last, toughest
      battle, but even without it their own power being genuine and still being able
      to "undoubtedly" give Kirby & co. a "nice fight". Can defeat Shadow Kirby on
      side contentKirby Fighters 2), able to negate durability via Star Spit, Friend
      Hearts, and likely fire and freezing attacks'
    source_ids:
    - mediawiki-meta-knight-modern
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Massively FTL+ (Although slightly slower than them, Dedede''s consistently
      depicted as being able to keep up with Kirby and Meta Knight, when the latter
      is able to keep up with the Warp Star and the former kept up with those who
      could match said vehicle''s speed. Reacted & used his cannon to tag Mr. Star
      flying at incredible speeds, who can easily fly pass starsKirby''s Star Stacker,
      Super Famicom version. Repeatedly outran "Dimension Walls", space waves which
      were consuming interstellar parts of Another DimensionSee the AP of Magolor
      (Phase 2)/Magolor Soul or the Master Crown. This space waves were only consuming
      interstellar parts in the context of what was outrun, regardless of the scale
      of the whole feat., which were moving fast enough to get past stars & nebulae
      in the backgroundInter-dimensional rift areas · Kirby''s Return to Dream Land
      & Kirby''s Return to Dream Land Deluxe, as well as keeping up with a flying
      Lor Starcutter and Landia in the time a fainted Kirby woke up & they all escaped"Each
      to His Own World" cutscene · Kirby''s Return to Dream Land & Kirby''s Return
      to Dream Land Deluxe. Kept up in combat against the latter two and Magolor EX;
      Drew his hammer against Phase 1 Magolor while riding a Landia flying across
      Another Dimension''s Road"Final Battle EX" cutscene · Kirby''s Return to Dream
      Land & Kirby''s Return to Dream Land Deluxe, meaning that he was really to face
      Magolor like that and was reacting to the obstructed flight Landia just took
      while passing by stars & nebulaeLevel 8: Another Dimension · Kirby''s Return
      to Dream Land & Kirby''s Return to Dream Land Deluxe. In side content, which
      shows what Kirby and other characters can do, he can keep up with & dodge projectiles
      from several types of Doomers empowered by the Master Crown previously shown
      in their regular state to keep up with & obstruct Landia as he flew across Another
      Dimension''s Road, and he can defeat Crowned Doomer, the tyrant boss of the
      Doomers who should be comparable to those types of Doomers. Can defeat Dark
      Meta Knight in side content, reacting & dodging attacks as he was flying. Reacted
      and briefly outran a Jamba Heart piece flying towards him, which were suddenly
      scattered across the galaxy from its edge; Dedede is comparable to, and can
      join the Star Allies, who chased & kept up with Jamba Heart pieces multiple
      times. Can react riding a Friend Star for travel & in combat, when that vehicle
      is made by the energies & "the collective power of Kirby and Friends"KIRBY STAR
      ALLIES THE ORIGINAL ART BOOK, page 28, whereas a regular Warp Star can be made
      by a lone Kirby. Kirby & 3 Star Allies kept up in combat & defeated the Three
      Mage-Sisters, Hyness, and Void Termina, who in turn was able to keep up with
      an improved version of the Warp Star or the Friend Star, which Dedede can maneuver
      in combat. In side content, 4 Star Allies can defeat Morpho Knight EX, the stronger
      incarnations of Void Termina, and alone can defeat Shadow Kirby. Able to move
      faster with Invincible Candy, Boost Orbs & Power-Up Hearts for a limited amount
      of time)'
