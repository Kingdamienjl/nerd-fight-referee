  stamina:
    text: Superhuman. On par with Kirby and Meta Knight. Seemingly unaltered without
      being able to dream, which made everyone in Dream Land feel restless and irritable,
      even by the time Kirby completed most of his adventure and fought DededeKirby's
      Adventure. Fought Kirby from the night until the sunset in the story of the
      first gameSpring Breeze · Kirby Super Star Ultra, then the same happened some
      time later, if Kirby had to first spend some time in Dedede's castle as a level,
      with the windows showing it was still night when he reached Dedede. Capable
      of defeating Queen Sectonia, Shadow Dedede, and Dark Meta Knight in a gauntlet
      style fight | Superhuman. As before. Along other Star Allies, he can chase the
      Jamba Heart pieces several times across the Story Mode, covering some parts
      of several planets and moons, if they chased the pieces via a Warp Star while
      over Planet Popstar (Level 2 map) and between celestial bodies (Level 4 map).
      4 of any Star Ally can complete an adventure of several levels and bosses without
      any notable rest, ultimately defeating Zan Partizanne, Hyness (2 phases), and
      Void Termina (4 phases) one after another
    source_ids:
