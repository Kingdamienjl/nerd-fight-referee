  attack_potency:
    text: "Continent level (Any Blade Knight on Planet Popstar and outer space can\
      \ become a Helper and harm and defeat Iron Mams,Kirby Super Star & Kirby Super\
      \ Star Ultra if being less powerful themselves) | Continent level (Is a Helper\
      \ Blade Knight), possibly Low Multiverse level (Can clash swords with a Jamba\
      \ Heart piece-powered Meta Knight, sending him backwards. Any Star Ally/friend\
      \ can follow Kirby in a group of four in the canon defeats of Void Termina,\
      \ Corrupt Hyness, and the Retaliators Three Mage-Sisters [at once]. The four\
      \ used their energy and collective power to create a Friend Star, which fused\
      \ with four Heart Spears to create the Star Allies Sparkler, which was used\
      \ to help defeat Void Termina. In side content four random Star Allies can defeat\
      \ Marx, Morpho Knight EX, and the stronest versions of Void Termina. Although\
      \ Friend Dreams are more notable partners for Kirby due to most of them having\
      \ previously shown to be in his level and some still doing so afterwards. Still,\
      \ with the ability to grow more powerful by deepening bonds of friendship, which\
      \ repeatedly happened in Star Allies, Blade Knight could have become on a comparable\
      \ level to Void Termina, similar to how the initially unimpressive Twin Woods\
      \ used this mechanic to grow more powerful a few times to have great strength\
      \ in their last battle against Kirby. Friend Helpers are stated to be able to\
      \ finish the \"Guest Star\" adventure \"even without Kirby!\"\"Guest Star\"\
      \ Jpn. tutorial 1 \xB7 Kirby Star Allies Narration claimed that Kirby couldn't\
      \ lose against Void Termina because of his friends of the Stars assisting him),\
      \ able to negate durability with Friend Hearts, and likely via fire and freezing\
      \ attacks"
    source_ids:
    - mediawiki-meta-knight-classic
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Relativistic+ Combat Speed (Any Blade Knight on Planet Popstar and outer
      space can become a Helper; A Helper Blade Knight can dodge attacks from Iron
      Mams, Knuckle Joes, and Bandana Waddle Dee, who can punch Planet Popstar hard
      enough to quickly leave a crack in it visible from space within side content,
      which shows what Kirby and other characters can do. A Helper Blade Knight can
      dodge and block attacks from Simirrors, who can react to an incoming laser by
      using a reflective move at a close distance [0.64 c], and any Helper can react
      to & dodge those lasers across their adventures) | Relativistic+ Combat Speed
      (As before), possibly Massively FTL+ Combat & Travel Speed (Same reasoning as
