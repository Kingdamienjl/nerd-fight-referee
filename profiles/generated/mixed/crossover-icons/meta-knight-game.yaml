  range:
    text: "Below Standard Melee Range physically and with his sword, Standard Melee\
      \ Range to Extended Melee Range with limited forms of Energy Projection and\
      \ throwable weapons that doesn't extend much from his body, up to Planetary\
      \ length in destructive capacity (A fully changed & prepared strike can create\
      \ a thin crack going from one side of Planet Popstar to the opposite side of\
      \ the planet, explicitly incomparable to his AP by the end of itCrackity Hack\
      \ \xB7 Kirby's Return to Dream Land DeluxeNote that the destruction seen inside\
      \ Popstar continues offscreen before reaching the other side of the planet,\
      \ only visually reaching earth with some magma in it. The measure that goes\
      \ up to \"999.99\" both doesn't stand for anything and is just a point of reference\
      \ for the game rather than distance, as its highest value unevenly reaches a\
      \ much higher distance than anything lower.). Higher physical range with some\
      \ Boost Orbs (If they increase the range of his attacks), Tens of Meters with\
      \ Scope Shot gun, Interdimensional via Dimensional Travel (Via Warp Star [See\
      \ its Feats]) | As before, Interstellar, likely Galactic via Extrasensory Perception"
    source_ids:
    - mediawiki-meta-knight-game
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Genius. Among the Meta-Knights, they built the Halberd, a futuristic ship
      with enough power to harm an early Kirby and a speed possibly superior to him.
      The Meta-Knights created Heavy Lobster, which Meta Knight might have contributed
      on. Meta Knight is a capable leader, having the utmost respect and loyalty of
      his army of Meta-Knights, with whom he tried conquering Dream Land once to put
      an end to their lazy lifestyle, presumably only failing due to Kirby''s intervention
      (as Meta Knight alone is repeatedly shown as superior to everyone there besides
      the Pink Puffball). If the Kirby Personality Quiz is anything to go byThe Kirby
      Personality Quiz should be taken with a grain of salt, most of the info could
      be made up as it has different Copy Abilities from Kirby as different personalities,
      but a more solid effort was put into individual characters like Meta Knight.
      It being on the official Kirby website & posted in the official twitter while
      using renders of canon characters doesn''t necessarily mean it portrays the
      characters as they are in canon, but in general as they are across different
      continuities that they also advertise, being just some game for fun. Still,
      the info it gives is fitting to what the games show of Meta Knight., then he
      makes for a good leader with great determination who holds strong beliefs about
      pushing for higher ideals. He''s quick to figure out the nature or relevance
      of things, approaching them from multiple angles, but since he rarely lets his
      emotions show, people tend to think of him as aloof. Whatever he might dare
      to try, he can safely rely on his own beliefs and intuition. And he shows a
      brilliant mastery of the sword during battle. Often referred as a skilled swordsman,
      Meta Knight trains every day & never misses a chance to train, which gives him
      a remarkable amount of experience when around 1000 years happened at one point
      in the series. It would be no exaggeration to say that he is obsessed with power
      and training to become stronger, having resorted to go into an adventure to
      that would result on a wish being granted to him, to which he asked to fight
      the greatest warrior in the galaxy because his one wish is to become stronger,
      battle he won despite being seemingly outclassed in power with his opponent
      using improved versions of Meta Knight''s moves. His mostly non-canon modes
      portray him as training through the game, and he can keep training even with
      the galaxy in danger. He can assist or has assisted in the defeat of opponents
      with either some notable edge in power, competent combat skills, experience,
      complex attack patterns that require coordination to dodge, use abilities that
      give them a reasonable advantage mid-combat, or a combination of those factors,
      those being: Galacta Knight (In canon and side content), Metal General EX, Landia
      EX, Magolor EX, Magolor Soul (In canon and in side content against the stronger,
      more complext Magolor Soul of the updated The True Arena), Crowned Doomer (Side
      content), the Master Crown possessing the Red Fruit (Side content), a clone
      of Queen Sectonia (Side content), many Kirby clones as good as the original,
      and the original Kirby (Side content) | As before. Adding to that list of opponents:
      the Three Mage-Sisters, Hyness, Void Termina (Canon and side content), Morpho
      Knight (Side content), Kirbys with all kinds of Copy Abilities (Side content),
      Bandana Dees (Side content), Magolors (Side content), and Shadow Kirby (Side
      content) Standard Tactics: His regular moves occasionally mixed in with his
      special moves. Meta Knight keeps a certain set distance from his opponents as
      they approach or get away, making them harder to land attacks on him and staying
      close for him to land his moves. Many of his actions make use of high-speed
      against comparable, if somewhat slower opponents (Meta Knight may be putting
      extra effort for his attacks to come off faster) | As before, but with the available
      ability to use Friend Hearts, a notable appreciation for teamwork, and using
      Friend Powers (which may fuel his decision to use Friend Hearts on others, if
      alone. They are techniques often used by fellow Star Allies, but that doesn''t
      necessarily guarantee their use). Also incorporates grabs'
    source_ids:
    - mediawiki-meta-knight-game
    confidence: 0.6
    notes: auto_repair source extraction
