  intelligence:
    text: "Extraordinary Genius (Donatello is a scientific genius capable of engineering highly advanced\
      \ machines. He is also an expert biologist, chemist, and geneticist, as he was able to create the\
      \ first ever successful Retro-Mutagen. His intelligence is his greatest asset in battle due to his\
      \ analytical prowess. He is capable of performing mathematical calculations mid-battle, such as\
      \ to ricochet shuriken at nearby objects and/or surfaces, in order to make them bounce off objects\
      \ again and again in the exact directions he calculated previously to tag even the most mobile targets.\
      \ Donatello also possesses expertise in B\u014Djutsu due to years of training under Hamato Yoshi.\
      \ In combat, he twirls, swings and stabs his b\u014D in a manner similar to a spear. As Donatello's\
      \ fighting style relies more on defense than offense, he specializes in his b\u014D's versatile\
      \ nature to block as well as counter attack.)"
    source_ids: *id002
