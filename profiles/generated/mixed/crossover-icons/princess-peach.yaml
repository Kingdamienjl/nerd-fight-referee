      it''s all thanks to you! Thank you, Mario! We have to do something special for
      you... Listen, everybody, let''s bake a delicious cake...for Mario...|Princess
      Peach thanking Mario|smo peach head.png}} ==Summary== {{Nihongo|Princess Peach|ピーチ{{Ruby|姫|ひめ}}|Pīchi-Hime}}
      is a character in the critically acclaimed Super Mario series. In the series,
      she usually portrays the princess in distress and has been kidnapped by Bowser
      in almost every game. In the original game, she possessed strong white magic
      that would allow her to reverse the black magic of the Koopa clan, thus giving
      Bowser a reasonable answer to why he would kidnap the princess, as he was at
      the time using it to cast a spell on all of the Mushroom Kingdom''s residents.
      The other reason of course, is that the Koopa King has, like many others, a
      crush on the mushroom-princess, as he expresses many times in the series Mario
      and Luigi, the protagonists of the series, always seem to rescue the princess
      and save the Mushroom Kingdom when needed. Other characters also lend a helping
      hand, such as Yoshi, Toad, Wario and a cast of other characters in the Mario
      RPGs. That being said, she does sometimes join Mario and the others on their
      adventures (Super Mario Bros. 2, Super Mario RPG: The Seven Stars, Super Paper
      Mario, Super Mario 3D World, Super Mario Run, Super Mario Bros. Wonder and both
      Mario Plus Rabbids games) and she even has her own two games (Super Princess
      Peach and Princess Peach: Showtime!) where she saves the day single-handedly.
      She also sometimes manages to help Mario when she is kidnapped by sending him
      useful information and power-ups or supports him with her magic. She is also
      a regular in the racing and sports spin-offs as well as the Super Smash Bros
      series since Melee. ==Powers and Stats'
