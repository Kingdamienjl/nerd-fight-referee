        Armor=right|400px {{Quote|CONFIRMING ENERGY THAT by FAR EXCEEDS THE abilities
        of THE INVADER ARMOR, the comBAT power SUPPORT MACHINES THAT I HAVE created.
        The INFINITE POWER that THIS organic life form possESSES POSES A THREAT. …THE
        PROBABILITY of ME… BEING… AB… LE TO… ELIMINATE… THIS THREAT… is…?|See the
        original text here—Star Dream''s phase 3, last part Jap. pause description
        translated, Story Mode • Kirby: Planet Robobot}} {{!}}-{{!}}Star Allies Sparkler=center|550px
        {{Quote|The secret treasure “Twinkle Star Allies” was born from the kind Spears
        of the Heart. I want to save everyone in this galaxy…! The wish turns into
        a sparkling star and now opposes… the final enemy!!|See the original text
        here—Star Allies Sparkler''s regular Jap. pause screen description translated
        • Kirby Star Allies}} }} ==Summary== Kirby is the main protagonist of his
        eponymous series. He''s a happy-go-lucky, glutton and lazy individual living
        peaceably in Dream Land. He would jump into action when needed to, if he''s
        not participating in challenges from his friends, he may be opposing malevolent
        forces and ultimately facing menacing monstrosities that contrast his own
        friendly appearance and intentions. Kirby became a well-known hero in his
        and other universes, is respected as a warrior and considered to have infinite
        power, but by far, his biggest characteristic and strength is his sheer goodness;
        Kirby forges deep bonds with friends, allies in adventures and passersby he
        helps out, he''s eager to spend time solving the problems of other creatures,
        even strangers, and is quick to forgive characters who are full of themselves
        or who may even be evil, seemingly making some of them less wicked. These
        selfless acts usually result in Kirby getting rewarded in some way, a number
        of his final victories and achievements being attributed to it. Kirby has
        a rivalry with King Dedede and Meta Knight, 2 of his most notable friends,
        and the most significant and serious adventures Kirby has either indirectly
        relate to the Ancients or are directly caused by beings who are members of,
        or resemble, the Dark Matter species. ==Powers and Stats'
