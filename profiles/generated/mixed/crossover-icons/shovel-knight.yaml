- id: claim-weaknesses-717fe014
  section: weaknesses
  axis: weakness
  text: 'He is bound by the Code of Shovelry, and is an honorable fighter. Although
    in some cases he does play dirty, such as when he shoveled Plague Knight in the
    back after he had been defeated.Plague Of Shadows Shovel Knight boss fight Notable
    Attacks/Techniques: |-|Relics (Shovel Knight)= 723c98ae5ebe8f80a2404459691ad476cf627fec.png|Phase
    Locket Anchor.png|Throwing Anchor Propellerdaggerkeyart.png|Propeller Dagger Warhornkeyart.png|War
    Horn Fishinpolekeyartcrop.png|Fishing Rod * Flare Wand: A wand that Shovel Knight
    can whip out to shoot fireballs in front of him for at the cost of mana. * Phase
    Locket: An artifact found in The Lich Yard that was formerly Specter Knight''s
    Keepsake Locket, an artifact from his lost friend Luan. When used by Shovel Knight,
    it allows him to briefly become intangible. *Dust Knuckles: A pair of gauntlets
    that Shovel Knight can don to do a quick forward dashing attack, breaking through
    stone and dirt blocks while momentarily keeping him in the air. *Throwing Anchor:
    A ranged attack that allows Shovel Knight to throw a large anchor in the air to
    hit enemies above him. *Alchemy Coin: A projectile that slides on the ground and
    bounces off of walls, dealing light damage to enemies. It can transmute smaller
    enemies into riches that can be later collected. *Mobile Gear: A large block that
    can be thrown on the ground, which can be rode to traverse platforms quickly and
    deal damage to enemies while running them over. *War Horn: Clears a large area
    around Shovel Knight with a massive sound blast, instantly shattering stone blocks
    and one-shotting most smaller enemies. Even to bosses, it deals much more damage
    than his regular attacks, although it also consumes the most mana out of any of
    his abilities. *Propeller Dagger: A dagger that allows Shovel Knight to fly horizontally
    when stabbed forwards. *Fishing Pole: Allows the user to fish for objects off
    of cliffs; it can pull up shopkeepers, Troupples, treasures, and more. *Troupple
    Chalice: A vessel that allows the user to store ichor gifted to them by the Troupple
    King, which can each be consumed for different effects. **Ichor of Renewal: Restores
    Shovel Knight to full health. **Ichor of Boldne'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-ec6f873d
  section: abilities
  axis: hax
  text: 'Base=Superhuman Physical Characteristics, Weapon Mastery (Of his Shovel Blade),
    Hand-To-Hand Combatant (Can fistfight the likes of KratosShovel Of Hope Kratos
    boss fight and The BattletoadsShovel Of Hope Battletoads boss fight with Dust
    Knuckles and Toad Gear), Magic (Can use various magical Relics and can harvest
    magic from slain foesShovel Knight: Shovel Of Hope), Attack Reflection (Can reflect
    physical,Shovel Of Hope Plague Knight boss fightShovel Of Hope Tinker Knight boss
    fight magical,Shovel Of Hope Black Knight first boss fightShovel Of Hope Enchantress
    boss fight and certain elementalShovel Of Hope Mole Knight boss fight projectiles
    with his Shovel Blade), Regeneration (Mid-Low; Via Armor of Chaos), Fire Manipulation
    (Via Flare Wand), Intangibility (Immaterial; Via Phase Locket), Transmutation
    (Via Alchemy Coin), Limited Flight (Via Propeller Dagger), Sound Manipulation
    (Via War Horn), Healing (Via Ichor of Renewal, which restores health and magic),
    Magnetism Manipulation (Via Ichor of Fortune, which can draw valuables towards
    him), Limited Invulnerability (Via Ichor of Boldness, which makes him invincible
    for 10 seconds), Statistics Amplification (Via Dust Knuckles, which amplifies
    his strength), Energy Manipulation (Via Chaos Sphere, which launches a green energy
    ball that bounces around), Non-Standard Breathing (Type 2; Can breathe underwater
    in Treasure Knight''s stageShovel Of Hope Iron Whale stage), Damage Transferal
    (Via Chains, which allow Shovel Knight''s attacks to transfer between nearby enemies
    of the same type next to each other), Limited Creation (Via Gem Meter, which causes
    more gems to be obtained from encounters) |-|With Pocket Dungeon Relics= Limited
    Probability Manipulation (With Bomb Seed Bag, which causes the wielder to find
    more bombs, Gem Chain, which causes the wielder to find more gems from chains,
    and Gold Leaf Clover, which increases the chances of finding rare items), Enhanced
    Senses (With Snoutin'' Charm, which lets the user sense gems in blocks), Time
    Manipulation (With Chronos Glass, which freezes time at the beginning of a fight
    or when the board is nearly full), Life Absorption (With Desperation Talon, which
    lets the user''s fatal blows absorb health when at low health), Statistics Amplification
    (With Diamond Dust, which increases item damage and their durability, as well
    as Meal Ticket and Premium Meal Ticket, both of which increase health), Explosion
    Manipulation (With Dynamallet, which gives the next Chain an explosive effect),
    Resurrection and Summoning (With Fenix Feather, which revives the one holding
    it upon death, though only once. As this happens, a phoenix also appears and destroys
    everything on screen), Healing (With Divine Liquid, which causes 10+ Chains to
    recover all health), Rage Power (With Fury Horns. After scoring a fatal blow with
    a Chain, the next attack will inflict more damage), Damage Boost (With Five String,
    which inflicts extra damage every fifth hit, Power Pail, which inflicts extra
    damage at max Gem Meter, Obsidian Drill, which deals extra damage to all blocks,
    Single Glove, which inflicts extra damage to single foes, Swift Dagger, which
    causes the first strike of a battle to inflict extra damage, and Third Amulet,
    which causes every 3rd hit on the same foe to inflict extra damage), Fire Manipulation
    (With Fizzle Wand, which leaves a damaging trail following the user''s path),
    Holy Manipulation (With Divine Liquid, which inflicts extra damage to undead),
    Flight (With Nimbus Balloon, which allows one to hover just high enough to avoid
    floor hazards), Poison Manipulation (With Toad Totem, which causes attacks to
    poison foes), Limited Transmutation (With Too Big Bomb, which turns bombs into
    much bigger and more powerful ones), Empowerment (With Shockproof Socks, which
    inflicts extra damage upon taking ten steps), Resistance to Explosion Manipulation
    and Electricity Manipulation (With Bomb Seed Bag and Shockproof Socks, which give
    immunity to bomb explosions and electric attacks, respectively)'
