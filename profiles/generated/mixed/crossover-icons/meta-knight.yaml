  stamina:
    text: Superhuman. Without being able to dream, which made everyone in Dream Land
      feel restless and irritable, Meta Knight was seemingly unaltered, following
      Kirby in his adventure to toss items at him, command his knights to fight him,
      and lastly fighting him himself.Kirby's Adventure Consistently fights foes as
      powerful as Kirby for prolonged periods. Able to defeat President Haltmann,
      Sectonia Clone, Dark Matter Clone, and Galacta Knight in a gauntlet style fight
      | As before. 4 of any Star Ally can complete an adventure of several levels
      and bosses without any notable rest, ultimately defeating Zan Partizanne, Hyness
      (2 phases), and Void Termina (4 phases) one after another Fought to protect
      a town and kept a guard-like watch for enemies day and night for an unknown
      amount of days
    source_ids: *id002
    confidence: 0.95
  range:
    text: Below Standard Melee Range physically and with his sword, Standard Melee
      Range to Extended Melee Range with limited forms of Energy Projection and throwable
      weapons that doesn't extend much from his body, up to Planetary length in destructive
      capacity (A fully changed & prepared strike can create a thin crack going from
      one side of Planet Popstar to the opposite side of the planet, explicitly incomparable
      to his AP by the end of itCrackity Hack · Kirby's Return to Dream Land DeluxeNote
      that the destruction seen inside Popstar continues offscreen before reaching
      the other side of the planet, only visually reaching earth with some magma in
      it. The measure that goes up to "999.99" both doesn't stand for anything and
      is just a point of reference for the game rather than distance, as its highest
      value unevenly reaches a much higher distance than anything lower.). Higher
      physical range with some Boost Orbs (If they increase the range of his attacks),
      Tens of Meters with Scope Shot gun, Interdimensional via Dimensional Travel
      (Via Warp Star [See its Feats]) | As before, Interstellar, likely Galactic via
      Extrasensory Perception
