      value: 'At least Room level (Stronger than Mario who can casually break brick
        blocks with his hand) to Galaxy Level (Was empowered by the Grand Star. The
        Grand Star is the primary power source of the Galaxy Reactor, which also has
        enough power to create an entire galaxy) | Multiverse level (Empowered by
        the Dream Stone, which is made up of happy dreams created by various species
        with each dream being it''s own universe. More evidence to support this is
        that in Mario Party 5, the manual, Misstar, and Eldstar refer to Future Dream
        as a universe, additionally being called infinite in size. In Mario & Luigi:
        Dream Team, Dreambert refers to Mario''s world as the real world, while also
        constantly using the word "world" whenever talking about dream worlds. Giving
        us another comparison between two words. When fighting the Zeekeeper, he creates
        a portal that pulls Dreamy Luigi in. When going inside it, Dreambert states
        that he''s actually crossing dimensions during the battle. This fight takes
        place within a dream world, so he must have been referring to other dreams.
        It''s also shown that many stars and space exist within dream worlds, along
        with various constellations. In conclusion, every dream in the Dream Stone
        is an entire universe.) | Universe level+ (Comparable to Base Paper Mario
        in strength who is capable of defeating Dimentio who created Dimension D with
        a hand gesture and survived the destruction of World 6 Sammer''s Kingdom after
        the void reached it''s mature state.) | High Multiverse level+ (Empowered
        by the Pure Hearts along with Paper Mario and Paper Peach to defeat Super
        Dimentio who was empowered by the Chaos Heart.)'
