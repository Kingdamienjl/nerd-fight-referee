        rear end on the ground, which can cause many results. Bowser is no exception,
        as he''s also shown to perform a Ground Pound should the need arise. Poison
        Gas: Bowser will create a fog of poison gas that will damage and poison his
        opponents. He can also utilize poison attacks with his claws and bites. Terrorize:
        Bowser will summon a giant Boo to strike fear into his'
