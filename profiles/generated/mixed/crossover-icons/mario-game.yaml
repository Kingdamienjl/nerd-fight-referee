      value: 'Unknown Notable Attacks/Techniques: Jump: Mario jump on his opponent
        and crushes him/her with sheer strength. He can perform various jump techniques:
        *Spin Jump: Mario spins while jumping, allowing him to jump on spiky enemies
        and hazards such as buzzsaws. This move can also allow Mario to hover, slowly
        descend, deflect projectiles, and clear fogs and smoke. Using this move with
        the Fire or Ice Flower with make Mario scatter fireballs or ice balls in multiple
        directions. *Drill Spin: After using a Spin Jump or spinning in air, Mario
        will descend and spin much faster in a drill-like fashion with tremendous
        force. This attack does double damage on spiky enemies. *Super Jump Punch:
        Mario strikes the target multiple times with a punch while jumping. *Super
        Jump: Mario will jump multiple times on a single enemy at a quick rate. He
        can do this up to 100 times in a row. *Ultra Jump: This attack is not only
        more powerful than Super Jump, but it can attack multiple enemies at once.
        Pyrokinesis: Mario can manipulate fire and perform various fire techniques
        without a fire flower in some games. Some of his techniques includes: *Fireball:
        Mario will shoot a ball of fire from his hands. In Mario Kart: Double Dash,
        he can shoot up to five of them at once. *Firebrand: Taught by the Fire God.
        Mario charges fire energy in his palm and unleashes an explosive blast of
        flame on the enemies in close range. The fireballs from this move can be accumulated
        into a huge fireball for Mario to spike down on the target, inflicting a burn
        status upon the opponent. *Super Flame: Mario unleashes a barrage of large
        powerful fireballs from his fist. *Fire Swing: Mario swings the weapon so
        fast that it catches on fire and then strikes the target with it. The target
        is then cloaked in fire afterward. *Fire Strike: Mario''s Super Strike. He
        strikes the target with such speed and force, the receiving end will catch
        fire. *Fiery Metal Mario: Mario''s Mega Strike. He jumps incredibly high in
        the air, turning into a fiery Metal Mario and then delivers a kick that has
        tremendous re-entry force. Iron Hammer: Mario summons a giant iron hammer
        and hits the target with it. The force from the hit is powerful enough to
        leave a blazing trail on the target. Magic Weapon: Mario forges a weapon of
        pure energy in shape of a hockey stick. It''s only seen in Mario Sport Mix
        in a battle against the Behemoth. Mario Tornado: Mario horizontally spins
        like a tornado, trapping opponents in a series of hits if they get caught.
        Flip: Taught by Bestovius in Super Paper Mario. Mario flips into a realm called
        the "3D dimension", rending attack from enemies in the 2D realm useless and
        vice versa if he is in the 2D realm. However, he takes damage if he remains
        in the realm for long. Capture: Mario can use Cappy and throw his hat onto
        something to possess almost anything, from people, to animals, robots, objects,
        electricity itself, and even actual people in the promotional trailers. Heck,
        he possessed the Super Mario Odyssey logo and walked around, and could do
        so to letters and numbers on the screen. He can also seemingly possess the
        game and activate a cutscene in Odyssey, so the Capture ability is extremely
        powerful. Battle Cards: Mario can utilize cards with special effects to give
        himself an advantage in battle. Effects can range from increase his attack,
        defense, and speed, doing the exact opposite to his opponent, recovering health,
        nullifying damage, or stopping time. Spin Drill: Mario uses a drill to directly
        pierce through planets, dirt and enemies on his way (cannot drill through
        hard/un-drillable surfaces). Invisibility Hat: Mario can just slip on the
        Invisibility Hat to become completely invisible without any traces at all,
        and without any time limit. Power-ups: Mario can use several items which grant
        him several forms with special abilities which are stated in this list: *Fire
        Mario: Shoots fireballs of different sizes. The biggest ones are usually bigger
        than him. *Cape Mario: Float, fly, create earthquake by slamming the ground,
        slow descent, reflect objects and spin at enemies. *Superstar Mario: Similar
        to Cape Mario with additional super speed and invincibility *Tanooki Mario:
        Grows a tail to attack with, turn into an invincible statue, and fly *Raccoon
        Mario: Similar to Tanooki Mario but without the ability to turn into a statue.
        *Hammer Mario: Throw hammers and block fire when ducking *Metal Mario: Invincibility,
        destruction of enemies, walking underwater, no need for air for a few seconds
        *Vanish Mario: Intangibility and invisibility for a few seconds *Boo Mario:
