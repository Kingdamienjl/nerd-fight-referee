  intelligence:
    text: Gifted, possibly Genius in battle (While ordinarily a 10-year-old boy, Ash
      has shown his ingenuity in battles time and time again, creating complex strategies
      [such as having Pikachu stand on the ground with Iron Tail and move rapidly
      to generate shock waves from its sheer velocity to mitigate Bea's Hawlucha's
      Sky Attack] on the fly and admitting to having done no prior planning. His battle
      intelligence is such that a complex supercomputer exploded upon attempting to
      comprehend his battle data, having failed to do so. He has beaten trainers with
      highly trained Metagross who are as smart as a supercomputer. Has actively used
      terrain, his opponent's attacks and more to his advantage in unpredictable ways.
      Fought Diantha's Gardevoir and figured out a strategy to bypass her predictions
      skills on the spot. Beat Olympia's strategy by using perfect timing to use her
      own moves against her via positioning his Pokemon in the right way. Beat countless
      opponents with decades of Pokemon battle experience including the likes of the
      Frontier brains. Beat Sawyer by tricking him into slicing up logs, tossing them
      in the air in the process, used the logs as platforms and then used one of the
      chopped logs to precisely prevent Aegislash from using its shield, all mid-air
      within a few seconds at most as none of the logs fell to the ground by that
      point.) | Genius (Had surpassed his previous strategic thinking and finally
      became the World Champion. Surpassed Steven, Cynthia and Leon, who by that point
      had achieved great feats. Leon became a champion when he was still a kid and
      since then held the title without ever being defeated for about a decade. Leon
      had beaten Diantha with ease and surpassed all other Masters 8 Challengers except
      for Ash, who beat him with a team that he had recently trained, despite facing
      Leon's decade-long trained team)
