    - field: powers_and_abilities
      value: 'Powers Mario needs the assistance of the Star Spirits to use. ** Refresh:
        Mario summons Eldstar, who restores some health and stamina to the target,
        and cures status ailments such as poison. ** Lullaby: Mario summons Mamar,
        who sings a lullaby, putting foes to sleep instantly. ** Star Storm: Mario
        summons Skolar, who summons countless stars from the sky, which then rain
        down, spontaneously bombarding all foes. ** Chill Out: Mario summons Muskular,
        who charges energy before cursing all foes, lowering their Attack Potency.
        ** Smooch: Mario summons Misstar, who restores a solid chunk of an ally''s
        health. ** Time Out: Mario summons Klevar, who halts time for 30 seconds.
        ** Up & Away: Mario summons Kalmar, who transmutes his foes into lifeless
        stars before placing them in the sky. ** Star Beam: Mario summons all the
        Star Spirits, who summon one large, yellow beam of energy to remove any and
        all helpful status effects from foes as well as harm them. *** Peach Beam:
        Mario summons all the Star Spirits, who summon one large, pink beam of energy
        to remove any and all helpful status effects from foes as well as harm them.
        This attack is only usable when Mario has been empowered by wishes. * Sentient'
      source_id: character-stats-profiles-mario-composite
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: 'A decently powered Melee Hammer with a 50% chance of inflicting Honey.
        ** Hydrant Hammer: A decently powered Melee Hammer with a 50% chance of inflicting
        Honey as well as a 30% increase of damage towards bandits/thieves. ** Toad
        Tapper: A moderately powered Melee Hammer with a 50% chance of inflicting
        Bounce. ** Battle Gavel: A moderately powered Melee Hammer with a 50% chance
        of inflicting Honey. ** Sucker Puncher: A moderately powered Melee Hammer
        with a 60% chance of inflicting Bounce as well as a 30% increase of damage
        towards jumpers. ** Toxic Truncheon: A moderately powered Melee Hammer with
        a 60% chance of inflicting Honey as well as a 30% increase of damage towards
        jumpers. ** Peeper Reaper: A moderately powered Melee Hammer with a 60% chance
        of inflicting Bounce as well as a 30% increase of damage towards brutes. **
        Glamor Hammer: A greatly Melee Hammer with a 60% chance of inflicting Bounce.
        ** Sunset Slammer: A greatly powered Melee Hammer with a 60% chance of inflicting
        Honey. ** Grid Gavel: A massively overpowered Melee Hammer with a 60% chance
        of inflicting Bounce as well as a 10% increase of damage against stronger
        foes. * Invisibility Hat: Mario can just slip on the Invisibility Hat to become
        completely invisible without any traces at all, and without any time limit.
        * Power Drinks: Drinks Mario carries with him into battle that, when drank,
        have certain effects. ** Energizer: Doubles Mario''s attack potency. ** Bracer:
        Doubles Mario''s durability. ** Yoshi-ade: Doubles Mario''s attack potency
        and durability. ** Red Essence: Grants brief invincibility, as well as removing
        and granting immunity to all status ailments for a short while. * Peppers:
        Mario carries three types of peppers into battle with him. ** Red Pepper:
        Increases Mario''s attack potency. ** Green Pepper: Increases Mario''s durability.
        ** Blue Pepper: Increases Mario''s speed. * Time Rewind: Mario carries two
        weapons in large amounts into battle, allowing him to fiddle with time to
        an extremely high extent. Even more so than other time manipulators in the
        franchise. ** Retry Clocks: Once Mario is downed or even killed, a Retry Clock
        will activate, rewinding time back to the beginning of the fight. Mario and
        his foe get all their items they used back, and are restored to peak physical
        condition. The only difference is that Mario retains the memories of his defeat,
        while the enemy does not, allowing him to effectively save scum his way to
        victory--learning everything his foe will do beforehand. He can carry up to
        99 of these. ** Earlier Times: Work the exact same way as the Retry Clocks.
        Mario can also hold up to 99 of these, too. * Offensive RPG Items: Multiple
        offense-based items in Super Mario RPG. ** Sleepy Bomb: Explodes, putting
        foes to sleep. ** Bad Mushroom: Causes natural harm to a foe, and can potentially
        poison them. ** Freight Bomb: Explodes, doing damage and possibly halving
        attack potency and durability. ** Fire Bomb: Explodes, engulfing foes in searing
        flames. ** Ice Bomb: Explodes, engulfing foes in frigid ice. ** Rock Candy:
        Creates large shining stars that envelop the foe, doing enormous amounts of
        damage. ** Star Egg: Summons star allies that attack the foe. ** Pure Water:
