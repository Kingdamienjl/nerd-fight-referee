- id: claim-weaknesses-b5770aa9
  section: weaknesses
  axis: weakness
  text: 'Palutena is sometimes too playful and teasing for her own good, Can be taken
    by surprise (was defeated by Medusa''s surprise attack the first time around)
    and is prone to becoming a damsel in distress due to her own actions; for example,
    being captured by Medusa and then later being victim of the Chaos Kin she indirectly
    freed. Notable Attacks/Techniques: *Palutena Glam Blaster: A fierce attack Palutena
    uses to finish the Three-Headed Hewdraw if Pit doesn''t finish the last head quickly
    enough, killing it in one shot. *Cover Your Eyes!: Palutena raises her shield
    and charges her light power, then unleashes it blinds her target with light, if
    in range. This lasts for about three seconds. *Time for a Sacrifice!: Palutena
    shoots a large, slow-moving ball of teal light that hones in on her target. Palutena
    can shoot up to three in quick succession. *Kneel Before Me!: Palutena waves her
    staff and shoots three fast-moving columns of light across the stage. *Poor You!:
    Palutena launches a halo that resembles her own across the ground. The halo hones
    in on her target and chases it, and it additionally shoots its own light projectiles
    at her target, up to three times before evaporating. *This Might Sting!: When
    her target is nearby, Palutena raises her staff and zooms forward in a huge column
    of light, blazing toward her target at great speed, covering a great distance
    in an instant. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    {{Scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters Category:Kid
    Icarus Category:Adults Category:Air Users Category:Astral Projection Users Category:Clairvoyance
    Users Category:Creation Users Category:Damage Boost Users Category:Energy Projection
    Users Category:Extrasensory Perception Users Category:Female Characters Category:Flight
    Users Category:Forcefield Users Category:Fourth Wall Aware Characters Category:Fragrance
    Users Category:Game Bosses Category:Game Characters Category:Gods Category:Good
    Characters Category:Hackers Category:Healers Category:Homing Attack Users Category:Immortals
    Category:Leaders Category:Light Users Category:Life Users Category:Magic Users
    Category:Paralysis Users Category:Petrification Users Category:Platform Creation
    Users Category:Possessed/Brainwashed Characters Category:Power Bestowal Users
    Category:Power Nullification Users Category:Protagonists Category:Rulers Category:Shield
    Users Category:Staff Users Category:Telekinesis Users Category:Telepaths Category:Teleportation
    Users Category:Temperature Users Category:Transmutation Users Category:Weather
    Users Category:Attack Reflection Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
