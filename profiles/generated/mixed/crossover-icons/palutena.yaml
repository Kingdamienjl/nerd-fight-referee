- id: claim-powers-and-abilities-38855c9f
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Immortality (Type 1 - Gods are immortalKid
    Icarus Uprising; Chapters 19/20; Palm Weapon Conversation), Breaking the Fourth
    Wall (Often breaks the fourth wall to explain the games controls to Pit, points
    out the fact that Kid Icarus Uprising doesn't have hospitals like the NES game
    didKid Icarus Uprising; Chapter 4), Magic, Light Manipulation, Energy Projection,
    & Homing Attack (She can generate blinding flashes of light, fire energy bolts
    that home in on her target, fire beams of light and rapid fire energy shots, create
    a homing sphere of energy that shoots smaller energy shots, and she can surround
    herself in a massive beam of damaging light), Creation, Size Manipulation (Conjured
    several cages with little effort, said cages were also constructed to be the size
    of vegetables.Palutena's Revolting Dinner; Part 1), Telekinesis (Could move her
    cages without physical contact, threw an island at Pit), Summoning, Weapon Creation
    (Created a set of claws), Fire Manipulation (Projected flames from her claws.)
    Power Bestowal (Bestowed the power of flight to Pit), Healing (Created recovery
    orbs that heal Pit when he picks them upKid Icarus Uprising; Idols; Entry 337),
    Extrasensory Perception (Sensed that Medusas life-force was weaker than it was
    beforeKid Icarus Uprising; Chapter 9 can normally detect the presence of living
    beingsKid Icarus Uprising; Chapter 16), Telepathy (Frequently speaks to Pit telepathicallyKid
    Icarus Uprising; Chapter 1), Clairvoyance (Can see what's happening around Pit
    without being present,Kid Icarus Uprising; Chapter 2 is able to see and warm Pit
    of threats he's unable to seeKid Icarus Uprising; Chapter 3), Teleportation (Can
    teleport Pit from within a castle back to the heavens), Flight (Restricted Flight
    - Levitates during her fight with Pit), Paralysis Inducement & Teleportation Negation
    (When Medusa kept teleporting around, Palutena bound her legs to immobilize her,
    preventing her from teleporting), Astral Projection (Can create a massive projection
    of herselfKid Icarus Uprising; Chapter 18), Damage Boost (Can charge her power
    to release an attack far beyond her standard level of strength), Forcefield Creation
    (Created a barrier around her temple), Platform Creation (Created a platform beneath
    herself to walk on waterPalutena's Revolting Dinner; Part 2), Hacking (Hacked
    into the Lunar Sanctums control core to guide PitKid Icarus Uprising; Chapter
    13), Self-Petrification (Turned herself to stone so that the Chaos Kin could only
    get away with her soul and not her bodyKid Icarus Uprising; Idols; Entry 57),
    Transmutation (Turned Medusa into an ugly monster,Kid Icarus; Manual; Page 4 her
    powers can turn Pit back to normal if he's turned into an eggplant), Weather Manipulation
    (Created a rainstorm, opened up a path though storm cloudsKid Icarus Uprising;
    Chapter 14), Electricity Manipulation (Created a brief lightning strike moments
    before altering the weather.), likely Water Manipulation (Made a rainstorm that
    completely washed away vegetable monsters.), Air Manipulation (Can create powerful
    winds in an attempt to blow Pit off her templeKid Icarus Uprising; Chapter 20),
    Fragrance Manipulation (Coated Pit with monster pheromone to attract one of the
    Hewdraw heads), Temperature Manipulation (Can keep Pit cooler to prevent him from
    being set on fireKid Icarus Uprising; Chapter 10), Life Manipulation (She can
    briefly reduce Pits life energy by half), and Resistance to Soul Manipulation
    (Resisted having her soul eaten by the Chaos KinKid Icarus Uprising; Chapter 21)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
