- id: claim-weaknesses-29270e7c
  section: weaknesses
  axis: weakness
  text: 'Despite his overwhelming strength and brilliant tactics, Sephiroth is not
    invincible. Though renowned as the strongest, he does have important shortcomings
    as a warrior, most of the time that being himself: |-|Before Crisis & Crisis Core=
    Normally Sephiroth lacks a true weakness as a warrior, being not only powerful
    without equal, but also absolutely pragmatic and no-nonsense, always seeking to
    quickly take out enemies. However, after Sephiroth discovered his origins, following
    a long episode of traumatic events, his worn out mental state collapsed and his
    ego grew completely out of control, developing a superiority complex and level
    of arrogance that wasn''t there before. Rather than quickly winning his battles,
    Sephiroth became more focused on showing his superiority to his opponent, made
    worse given Sephiroth''s status as unmatched in battle: as he has never been pushed
    to the limit in a fight, he has complete confidence in his strength. This is such
    that even when absolutely enraged, Sephiroth will torture and humilliate his enemy
    to try put them in their place rather than dispatching them. |-|Final Fantasy
    VII= None notable. Despite implications that some of his actions were a spiteful
    revenge on a specific few, Sephiroth''s utmost priority are carrying out his plans
    of ascension, thus he fights seriously to ensure so, unlike before. |-|Advent
    Children= Sephiroth''s ego and sadism are stronger than ever, spending more time
    focused on making his enemy suffer and feel powerless rather than defeating them,
    reason why he dragged for hours a fight he could have won in moments. That said,
    this behaviour was directed at Cloud, who Sephiroth had a very personal vendetta
    against and whom Sephiroth had used to focus his hatred to strengthen his Spirit,
    so it''s possible that this lack of pragmatism is directed solely at that specific
    person. Notable Attacks/Techniques: Among the cast of Final Fantasy VII, Sephiroth
    is an unique case given the varied amount of power sources he has access to. While
    he began with the same limitations as most others, that is having to develop techniques
    using his Spiritual Energy and rely on Materia to use Magic, as the story progressed
    Sephiroth got access to new, unnatural powers in the form of Jenova''s abilities,
    the knowledge he obtained from the Lifestream and his ascension into a baneful
    and abnormal existence within the Planet, thus gaining an unmatched power and
    capabilities nobody in his world has. |-|Before Crisis / Crisis Core= Sephiroth_Energy_Blade.gif|Zanshin
    Sephy Thundaga.gif|Thundaga SephyOctaslashBetterQuality.gif|Octaslash Abilities
    used by Sephiroth during his days as a SOLDIER operative for Shinra. These are
    divided into three groups: Spiritual Energy techniques Sephiroth developed to
    complement his swordplay; Magic he accessed by utilizing Materia, still having
    that limitation; and a few psychic abilities developed as the legacy of Jenova
    began to awaken in him, which he quickly mastered by the moment he had to employ
    them in combat. During this time, despite his strength, Sephiroth was for bound
    by the same rules as most other people. {| cla'
