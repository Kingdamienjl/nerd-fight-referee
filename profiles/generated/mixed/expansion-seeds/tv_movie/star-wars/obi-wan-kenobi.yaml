        The Mandalore Plot **Blaster Combat: While considering the practice uncivilized,
        Obi-Wan is an incredibly gifted user of blasters, most notably participating
        convincingly as a Bounty Hunter Sniper sufficient enough to even fool Cad
        Bane.Star Wars: The Clone Wars: Season 4, Episode 17; The Box Standard Tactics:
        As a Jedi, Obi-Wan prefers a peaceful solution to any conflict he finds himself
        in, but is not by any means slow when it comes to being forced into combat.
        Obi-Wan in combat is always observing his surroundings, looking for better
        vantage points and places to turn the battle to his favor via terrain. Obi-Wan''s
        lightsaber combat style is focused on wearing his opponent out while expending
        as little energy as possible, allowing him to last in back to back fights
        without issue while his opponents tire themselves out on his indomitable defense,
        and will always take openings his opponents give him Obi-Wan is also not at
        all against using force powers in combat, throwing pieces of the arena at
        his opponents or spamming force pushes to overpower opponents, or causing
        natural disasters to incapacitate an opponent. While rarely possible, Obi-Wan
        when faced with an opponent his Precognition tells him he can overpower, he
        will attempt to disarm them with the force as soon as possible.Obi-Wan & Anakin
