  intelligence:
    text: 'Pre-Metamorphosis/Post-Metamorphosis= Genius (Despite his brutal and intimidating
      appearance, Al''s most dangerous asset is possibly his cunning mind, as it''s
      aided him in and out of his military career and life as Spawn. He''s tricked
      everyone from the start, including God, Satan, and entire armies of Heaven and
      Hell, and every move that he''s done was on purpose, even when he chose Jim
      Downing to be the second Spawn to carry out his plans. Being a noted well-experienced
      street fighter with mastery over thirteen forms of martial arts throughout his
      life and career, all including Judo, Jujitsu, Karate, Kung-Fu, Jeet Kune Do,
      Aikido, Taekwondo, Boxing, Brazilian Jujitsu, Hapkido, Muay Thai, Ninjutsu and
      American Karate, and possessing decades of military training (shown when he
      used such skill to outmaneuver the much stronger Tremor and baiting Cygor into
      attacking him by acting woundedSpawn Vol 1 #57 (January, 1997)), it''s no doubt
      that Spawn is a master of hand-to-hand combat. With a peak physical condition
      as a regular human (being so where he could avoid gunfire from several soldiers
      as a human), something he still retains after his death, he''s an exceptionally
      talented acrobat and athlete and in his early years showed great potential in
      someday becoming an Olympic athlete. As an intelligent man with a high interest
      in travel, Spawn can fluently speak ten languages including Japanese, Spanish,
      French, Chinese, Italian, Portuguese, Latin, Arabic, Persian, and Russian. His
      tactical knowledge is also shown to be quite impressive, being able to trick
      Redeemer with a dummy,Spawn Vol 1 #143 (February, 2005) find an explosive before
      it was set off, and lead a possessed by killer Billy Kincaid to the "Dead Zone"Spawn
      Vol 1 #85 (July, 1999) where his powers were useless. Not only that, but he''s
      also shown to be very keen and quick to pick up on his surroundings, evident
      when he could locate a tracking chip inside Cygor,Spawn Vol 1 #58 (February,
      1997) identify a gun by sound, and notice that the size of a crate of grenades
      was unusual.Spawn Vol 1 #55 (November, 1996) On top of it all, he''s also extremely
      skilled in stealth, being able to infiltrate a highly guarded military base
      and make his way through hundreds of soldiers and over his time as Spawn, Al
      has learned to control his suit to the fullest extentSpawn Vol 1 #128 (September,
      2003)) |-|God Spawn= Omniscient |-|King Spawn= Genius, quite possibly Nigh-Omniscient
      (Might be comparable to the likes of God and Satan)'
    source_ids: *id002
    confidence: 0.95
