- id: claim-weaknesses-50b2760f
  section: weaknesses
  axis: weakness
  text: 'Spawn has a limited power supply of necroplasm and each time he uses his
    powers, his counter drains; this causes him to primarily rely on his costume''s
    natural abilities in fights. He is weak to holy weapons and decapitation and if
    his suit is damaged enough, it can go wild and be unable to discern friend from
    foe.Spawn Vol 1 #31 (May 1995) His body still needs oxygen to breathe even with
    it composed of necroplasm,Spawn Vol 1 #33 (July, 1995) and while he can teleport,
    it''s proven to be painful for him. | Same as before, but no longer weak to holy
    weapons and decapitation. Spawn has no power in the Greenworld and all of his
    past haunts him, slowing him in combat, and he must abide by the laws there rather
    than those of Earth or Hell. In the Dead Zone, Spawn is rendered mortal and powerless
    and can easily die. | Unknown | None notable | None notable | Same as Post-Metamorphosis
    but is no longer weak to the Dead Zones as they all have been sealed; his necromancy
    only lasts for a short duration and is limited to a 200 ft radius. Feats: Note:
    *This profile DOES NOT include a key for Omega Spawn, as the storyline for the
    events of Image United where Al Simmons was reborn as Omega Spawn was never finished
    and is considered to possibly be non-canon. *Please do not attempt to scale Spawn
    to other Image Comics characters such as Savage Dragon; Erik Larsen mentioned
    a few times how these characters aren''t canon to each other. ** Also, please
    refrain from scaling Spawn to any characters from Marvel or DC, such as Superman
    or Spider-Man who appeared as cameos in issue 10 of the Spawn series; while instances
    such as this are canon to the Spawn continuity, they are not canon to the other
    verses in question and thus cannot be used to cross-scale. ==Notable Matchups==
