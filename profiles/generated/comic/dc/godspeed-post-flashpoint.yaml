    slows down with him, making the world seem almost frozen to him), Limited Flight, Free Movement &
    Surface Scaling (As seen hereThe Flash Vol 5 #44), Electricity Manipulation (Can fire bolts of electricity
    from his hands), Cloth Manipulation (Creates his suit with the Speed ForceThe Flash Vol 5 #6), Vibration
    Manipulation (Can phase through walls via vibrating into another frequencyThe Flash Vol 5 #3), Durability
    Negation & Intangibility (Can become intangible through vibratingThe Flash Vol 5 #5, can make others
    intangible as well), Time Travel & Dimensional Travel (As seen hereThe Flash Vol 5 #755), Life Steal
    & Speed Absorption (Can steal the speed off others and in turn also kill them), Energy Manipulation
    and Energy Projection (As seen here), Explosion Manipulation (As seen here), Limited Healing (Can
    heal other Speed Force users by connecting to them), Limited Air Manipulation (Can create vortexes
    by spinning his arms), Resistance to Speed Stealing (Cannot get his speed stolen as long as he is
    faster than the stealerThe Flash Vol 5 #4 ), Sleep Manipulation (Speedsters have a special metabolism
    that prevents things such as sleep gas to deal damage to them or affect themThe Flash (2016) #774)'
  source_ids: *id003
