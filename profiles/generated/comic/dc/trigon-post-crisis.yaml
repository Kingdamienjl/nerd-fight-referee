- id: claim-weaknesses-58892d32
  section: weaknesses
  axis: weakness
  text: 'Despite his vast power, Trigon cannot easily cross between dimensions except
    using astral projections. He needs to empower himself with billions of souls in
    order to do so. In order to utilize his reality warping to its fullest extent,
    Trigon needs to sleep. He can bypass this weakness by using some of his power
    to control others, as he did to Raven Notable Attacks/Techniques: * Death Stare:
    Trigon''s signature named attack involves firing powerful energy beams from one
    or more of his eyes. He can adjust the power and range of the attack at will,
    from pinpointing a single enemy to covering an entire world. Notes: Crisis on
    Infinite Earths did not serve to reboot New Teen Titans continuity, and the series
    continued on uninterrupted. It has been shown to be canon on more than one occasion,
    even decades later. Before making any changes to this page, please read and follow
    the Power-scaling Rules for Marvel and DC Comics. ==Notable Matchups== Victories:
    Losses: Inconclusive: {{discussions|Trigon Post-Crisis|Trigon (Post-Crisis)}}
