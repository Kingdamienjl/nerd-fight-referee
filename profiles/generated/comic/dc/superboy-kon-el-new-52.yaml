  intelligence:
    text: 'Genius. He was created to be the ultimate killing machine against metahumans, and as such,
      inside his mind, knowledge of science, history, war, and combat was embedded. While sleeping inside
      a VR where he was forced to "become" a hero and learn what it means to be good, Harvest forced him
      inside an even deeper VR where he was living as the original Kon and ravaging terror across the
      lands of Krypton. He might be a genius, he is still new to this life, and as such, very inexperienced
      in aspects of life that isn''t science or war. Despite not having seen antimatter before, he was
      able to recognise its structure immediately.Superman Vol 3 15 Upon a quick scan, was able to figure
      out what sort of technology Argo City had in it, and if it would be capable of helping them escape
      Krypton''s doom. He has the memories of the original Kon, who was one of the greatest monster Krypton
      had ever seen, and led armies of countless other clones to instil terror throughout his planet.
      When he learned that his powers did not work against Red, he improvised and managed to take her
      out by using his environment against her. When his powers weren''t working against another enemy,
      he started to think outside the box and scanned the man, finding weak spots in his body and attacked
      those. Figured out the power of an enemy mid-battle. He realised the only way to win is to let her
      "win" by stop fighting. Standard Tactics: Kon''s tactics changes often, depending on who he is battling.
      But most of it revolves around using his TK, however, in myriad of ways. For example, if he is fighting
      Superman like character, he will amplify himself and use brute force. But if he is battling someone
      with energy or psionic abilities, he will rely on other hax and not physicals - but will make use
      of it when necessary. Hikes to keep a distance between himself and the opponent so he isn''t disadvantaged.
      If he is disadvantaged and cannot affect people directly, he will use his environment against them.'
    source_ids: *id002
    confidence: 0.95
