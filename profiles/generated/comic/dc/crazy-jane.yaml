- id: claim-powers-and-abilities-05dcc999
  section: abilities
  axis: hax
  text: Longevity, Multiple Selves (Type 1; Confirmed 64 different personalities), Telekinesis (As Baby
    Doll), Bodily Weaponry (As Black Annis, she has sharp claws), Blood Manipulation (As Blood Of The
    Lamb), Pain Manipulation (As Butterfly Baby), Healing (As Crazy Jane, she can heal others. At the
    peak of her power, she can heal other superhumans and revert them back to human), Shapeshifting and
    Animal Manipulation (As Daddy, she can shapeshift into other people and can control large amount of
    insects), Telepathy and Social Influencing (As Dr. Harrison, she is able to telepathically suss out
    the childhood traumas of others. She also has the power to influence anyone who hears her voice),
    Vehicular Mastery (As Driver 8), Fire Manipulation and Flight (As Flaming Katy, she can cover her
    whole body in fire and fly), Teleportation (As Flit, can teleport herself and others by touching them),
    Superhuman Physical Characteristics (As Hammerhead, shown to be just as strong and fast as Robotman),
    Metal Manipulation (As Jill-In-Irons), Empathic Manipulation and Mind Manipulation(As Karen, she can
    cast love spells on others, making them fall for her. Can also make others do as she says), Precognition
    (As Lady Purple, she can see the future), Radiation Manipulation, Vibration Manipulation and Electricity
    Manipulation (As Lucy Fugue, she has radioactive bones and can channel lightning. Negative Man, Crazy
    Jane and Willoughby Kipling produced counter vibrations to slow down the Decreator to the point that
    it was destroying everything so slowly, it could barely notice it was happening at all), Automatic
    Translation (As Mama Pentecost, she can automatically solve any cryptogram and translate any language
    she hears), Resistance to Mind Manipulation (As Miranda, those who look at her station within her
    mind will have their own mind destroyed), Extrasensory Perception (As No One, she was able to sense
    the Fifth Horseman and the Painting before it was activated), Abstract Existence and Intangibility
    (As Rain Brain, can take on an abstract immaterial form which can't be touched due to being disconnected
    from reality), Ectoplasm Manipulation and Absorption (As Scarlet Harlot, she can create ectoplasm
    projections and absorb stray psychosexual energy), Explosion Manipulation (As Sex Bomb, she explodes
    when sexually aroused), Mind Manipulation (As Shy, she can look into people's mind and read their
    memory), Weapon Creation (As Silver Tongue, her vocalizations are actualized in silver font, and can
    then be used as edged weapons), Large Size and Fire Manipulation (Type 0 as Sun Daddy), Reality Warping
    and Breaking the Fourth Wall (As The Hangman's Beautiful Daughter, she has the power to physically
    activate her painting. Broke the Fourth Wall. At the peak of her ability, she was able to revert the
    Retcon-altered Justice League back to normal), Weapon Mastery (As The Nun, she can fight with knives
    and chainsaws), Resistance to Pain Manipulation (As The Sin Eater, she comes out as a defense when
    being tortured so Jane wouldn't feel any pain), Ice Manipulation (As the Snow Queen, she can create
    and shape ice), Surface Scaling (As The Wall Crawler)
  source_ids: *id003
  decisive: true
  status: unverified
