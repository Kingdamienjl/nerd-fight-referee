- id: claim-powers-and-abilities-e198990a
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Nigh-Omniscience (The Endless know everything
    but ignore it to make it bearable), Immortality (Types 1, 3 and 7), Reality Warping,
    Abstract Existence (Type 1. The Endless are wave functions--ideas, patterns, repeating
    motifs. They are not incarnations or manifestations of an abstraction, they are
    the abstraction in the most literal sense), Beyond-Dimensional Existence (Type
    3, Qualitative; Can traverse the Void which is beyond time and space to reach
    different CreationsLucifer Vol 1 #26, July 2002), Regeneration (High-Godly), Space-Time
    Manipulation (Molded her own reality from space existing outside the timeThe Sandman
    Special Vol 1 #1, November 1991), Soul Manipulation (Can absorb souls), Life Manipulation
    (Can give life), Death Manipulation (Can grant death with a touch. Touching her
    ankh is also lethal), Necromancy (Her ankh can turn people into living dead),
    Conceptual Manipulation (Type 1) (Can grant death to abstract beings like Destiny
    and Dream. Can also kill ideas), Incorporeality, Flight, Telekinesis, Teleportation,
    Telepathy, Magic, Energy Projection (Her ankh can shoot energy blasts), Beyond-Dimensional
    Existence (Type 2), Large Size (Type 10), Size Manipulation (Her height is variable),
    Shapeshifting (Can take on various forms), Black Hole Creation (Can create black
    holes), Dream Manipulation (Can enter and manipulate dreams), Dimensional Travel
    (Can transport others to her dimension and travel freely to other realms), Immortality
    Nullification (Can great death to immortals), Perception Manipulation (Only those
    she wants to, or are dying, can see her), Duplication (Can make duplicates of
    herself to experience mortal life), Telepathy (Can communicate telepathically),
    BFR (Can teleport others against their will), Time Travel (Can bring others with
    her), Cloth Manipulation (Can alter clothes to suit her needs), Precognition (Sees
    all possible futures), Animal Manipulation (Summoned a bird), Existence Erasure
    (Can completely vaporize opponents), Resurrection (Can grant others a return to
    life), Breaking the Fourth Wall (Can talk to the reader)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
