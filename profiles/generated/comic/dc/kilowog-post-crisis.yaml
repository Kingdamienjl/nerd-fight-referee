- id: claim-weaknesses-ffc135fb
  section: weaknesses
  axis: weakness
  text: GL Rings hold a limited charge and need to be replenished by a Power Battery every so often. If
    the user is stripped of his willpower, the Ring is useless. If a user is somehow overcome by fear,
    they will be unable to use the Ring and will become vulnerable to the color yellow. If a Green Lantern
    loses concentration (i.e. via being knocked around, illusions, constant speech), their power will
    be dampened and their constructs may weaken or fade completely.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
