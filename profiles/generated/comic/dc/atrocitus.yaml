- id: claim-powers-and-abilities-75abcc90
  section: abilities
  axis: hax
  text: 'Pre-Red Lantern=Superhuman Physical Characteristics, Longevity (Has lived for over a billion
    years), Magic, Clairvoyance, and Precognition (Had visions of the Blackest Night and Abin Sur''s death,Green
    Lantern 2005 #30 and learned of William Hand through ritual sacrificeGreen Lantern 2005 #32that allows
    him to see into the futureGreen Lantern 2005 #33Used this ability to find the location of The ButcherGreen
    Lantern 2005 #61), Preparation and Absorption (Built a cosmic Divining Rod which can locate and take
    away powers by absorbing them, and allows Atrocitus to use them through the deviceGreen Lantern 2005
    #34) |-|Red Lantern=All previous powers and abilities, Flight (His lantern ring grants him flight
    Blackest Night #0), Forcefield Creation ( His lantern ring grants him a forcefield), Absorption (Can
    absorb the blood of others into his ringGreen Lantern 2005 #36"), Immortality (Type 3, and 7; The
    Red Lanterns lack life signals which allowed them to surprise Hal Jordan, who previously scanned the
    entire planet with his ring and only found one lifeformGreen Lantern 2005 #37 Atrocitus states the
    Red Lantern rings replaced his corps hearts and beat in their place, which allowed him to survive
    his heart being extracted from his body and regeneratedGreen Lantern 2005 #47), Regeneration (Low-Mid;
    After having his heart torn out from his chest, he regenerated the wound moments later ), Blood Manipulation,
    Plasma Manipulation, Fire Manipulation, and Breath Attack ( A Red Lanterns blood is replaced with
    a napalm-like plasma that can beGreen Lantern 2005 #48 oprojected out of their mouthGreen Lantern
    2005 #58), Durability Negation and Corrosion Inducement (A Red Lanterns blood is a napalm-like plasma
    that can burn others and reduce them to bone in mere seconds. It can also act like an acid and melt
    othersFinal Crisis: Rage of the Red Lanterns), Extrasensory Perception (Can sense rage within others
    ,Green Lantern 2005 #50 and even the rage of the victims surrounding their murders), Empowerment and
    Rage Power (Atrocitus is empowered by the red light of the Emotional Spectrum known as rage. He and
    the other Red Lanterns also gain power the more their rage grows and from rage of othersGreen Lantern
    2005 #51), Accelerated Development (Type: Other & Physical Statistics; Atrocitus quickly grows in
    power like other Red Lanterns when their own rage builds and from the rage of others), Corruption
    (Type 1; Used his power to corrupt the Spectre and turn him into a Red Lantern, although it didn''t
    last long. Atrocitus can also infect others with his blood to communicate with themGreen Lantern Corps
    2006 #55), Energy Manipulation (Learned how to create constructs with the energy from his ring.Green
    Lantern 2005 #54 Can also project blasts from his ringBlackest Night #5), Weapon Creation (Created
    an axe and a spear using his energy), Summoning (Can summon his lantern), Sealing (Sealed the The
    Butcher inside his lantern), Dimensional Storage (Can store his lantern in a pocket dimension where
    all other lanterns are keptGreen Lantern 2005 #62), Self-Sustenance (Capable of surviving in space
    without oxygenGreen Lantern 2005 #63), Resistance to Corruption (Type 1; Atrocitus isn''t overtaken
    by the power of the Red Lantern ring and is still capable of speaking unlike the other Red Lanterns),
    Extrasensory Perception (The Red Lanterns lack life signals which allowed them to surprise Hal Jordan,
    who previously scanned the entire planet with his ring and only found one lifeform), Power Nullification
    (Saint Walker couldn''t douse the flames of Atrocitus, despite being able to do so against the power
    of the other Red Lanterns), Fire, Plasma, and Corrosion (Red Lanterns are uneffected by their own
    blood which is a napalm-like plasma that can burn others and reduce them to bone in mere seconds.
    It can also act like an acid and melt others)'
  source_ids: *id003
  decisive: true
