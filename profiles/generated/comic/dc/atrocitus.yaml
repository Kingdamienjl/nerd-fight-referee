      getting to know how to properly use his ring and Atrocitus even calls him a rookie) | Varies (Red
      Lanterns are empowered by the Red light of the Emotional Spectrum known as rage, and the more rage
      that grows within them and around them increases their power. When in the presence of beings with
      immense rage such as The Spectre and The Butcher, Atrocitus was powerful enough to contend with
      the later and harm the former), usually Galaxy level (Can harm a Green Lantern.Green Lantern 2005
      #45 Broke out of Sinestro and Hal Jordan''s constructs and harmed them both, requiring Saint Walker,
      Star Sapphire, and Indigo-1 to try and restrain him more than once57.43 ZettaFoe), up to Multiverse
