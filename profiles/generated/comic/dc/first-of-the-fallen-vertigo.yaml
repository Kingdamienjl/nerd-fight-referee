- id: claim-powers-and-abilities-a509bbe3
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, at least Genius Intelligence, possibly Nigh-Omniscience,
    Enhanced Senses (Should be able to see astral projections as weaker demons have been able to do soHellblazer
    Ch 10), Telepathy and Mind Manipulation (Spoke to Grendel from afar and turned him into a bloodlusted
    beastBeowulf Vol 1 2. Nearly tempted The Spectre into becoming his servantSpectre Annual Vol 2 1.
    Could show Constantine various fake eventsHellblazer Ch 122. Controlled a man into killing himselfHellblazer
    Ch 288), Shapeshifting (Shown hereHellblazer Ch 100), Immortality (Type 1, 4 and 7) and Resurrection
    (Upon "dying", the First will return to Hell, from which he can come back to EarthHellblazer Ch 42),
    Soul Manipulation and Non-Physical Interaction (Can take souls to Hell, though only after striking
    a deal with their owner or if they are destined to be. Shattered the souls of every being in his castleHellblazer
    Ch 79), Power Bestowal (Can bestow knowledge and turn others into demonsHellblazer Ch 96, as well
    as make them immortal or give them new bodiesHouse of Mystery Vol 1 225), Extrasensory Perception
    (Sensed Constantine's imminent deathHellblazer Ch 44), Flight (Shown here), Temperature Manipulation
    (The First's blood is boiling hotHellblazer Ch 45. Seared Constantine's wounds shut with a burning
    finger), Energy Manipulation (Can create cages of energy), Biological Manipulation, Healing and Disease
    Manipulation (Cured Constantine's lung cancer, then gave it back to him at a later date), Power Nullification
    (Removed Nergal's demonic status, reverting him to a humanHellblazer Ch 60), Clairvoyance (Can turn
    the damned of Hell into means of searching for beings on EarthHellblazer Ch 61), Natural Weaponry
    (Can tear beings apart with his nails), Dimensional Travel (Can move between Earth and Hell, as well
    as Limbo and likely other realmsHellblazer Ch 78), Sealing and Immortality Negation (Can seal beings,
    even devils of the same standing as him, as long as he knows their names, as well as permanently kill
    them despite their ability to normally resurrect), Cosmic Awareness (Knows the answers to all metaphysicsHellblazer
    Ch 81, and is eerily knowledgeable on the future as well as the actions of those he speaks toHellblazer
    Special. Knows of every single damned soulHellblazer Ch 212), Social Influencing (Drove a priest to
    insanity by telling him the truth about him and God), Poison Manipulation (Poisoned some wine when
    he was a mortalHellblazer Ch 95), Teleportation (Can teleport others and himself), Summoning and BFR
    (Summoned a demon to drag one of his servants to Hell), Dream Manipulation (Tormented Constantine
    with nightmares on multiple occasionsHellblazer Ch 123), Technology Manipulation (Used a television
    to show the past of Constantine's father), Illusion Creation (Made only Constantine see him among
    a crowdHellblazer Ch 121), Paralysis Inducement and Smoke Manipulation (Can paralyze people and make
    smoke leak from their orifices. Can also use that smoke to move them around), Death Manipulation (Killed
    a lesser demon with a touchHellblazer Ch 199), Fire Manipulation (Shown here), Sleep Manipulation
    (Woke up a soul from a state of torpor), Energy Projection (Can emit and shoot blue energy), Alternate
    Future Display (Shown hereHellblazer Ch 289), Density Manipulation (Made a flower become so heavy
    that Constantine couldn't lift itHellblazer Ch 290), Telekinesis (Lifted Constantine with a gesture),
    Extrasensory Perception (Demon Blood senses evilHellblazer Ch 92), minor Blood Manipulation (Demon
    Blood appears to subconsciously follow the owner's wishes, coagulating to prevent the reattachment
    of John Constantine after he cut it off in a crazed stateHellblazer Ch 268), Poison Manipulation (Demon
    Blood is lethal if drankHellblazer Ch 69), Resistance to Madness Manipulation and Empathic Manipulation
    (Unaffected by intercourse with a succubus, which leads men to addiction and insanity)
  source_ids: *id003
  decisive: true
  status: unverified
