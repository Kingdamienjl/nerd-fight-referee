- id: claim-powers-and-abilities-c4e3abb8
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Flight, Telepathy, Shapeshifting, Size Manipulation, Invisibility,
    Intangibility, Regeneration, Enhanced Senses, Illusion Creation (Telepathically defeated Despero by
    using illusions, and then put him into a coma), Possession, Astral Projection, Mind Manipulation,
    Memory Manipulation, Telekinesis, Weapon Creation, Fusionism, Duplication, Adaptation, Limited Vibration
    Manipulation (Thunderclaps drones away.Action Comics (2011) Annual #3), Absorption (Of DNA), Multiple
    Selves (J''onn split himself into multiple different beings long ago to experience Earth under the
    pretense of being actual humans, not knowing of their origin. Upon learning of an incoming Martian
    invasion of Earth, J''onn activated contacted them all telepathically and awakened their powers.Martian
    Manhunter (2019) #12), Limited Empathic Manipulation (Telepathic connection keeps Ultra calm.Justice
    League United #4), Memory Absorption (Absorbs John Jones being into himself. Martian Manhunter (2019)
    #12), Retrocognition (Reads psionic impressions of past events, and projects the images.Aquaman (2011)
    #36), Sleep Manipulation (Makes a woman peacefully fall asleep and extracts knowledge of how to operate
    a machine.Martian Manhunter (2015) #2), Perception Manipulation (Makes the Justice League think they''re
    in battle with him.Martian Manhunter (2015) #2), Durability Negation (Phases out an Amazo''s brain.Justice
    League (2018) #27 Joker controlling Martian Manhunter manages to attack Batman at a microscopic level.Justice
    League (2018) #6), Body Control, Extrasensory Perception (Has fourteen other senses aside from telepathy.Justice
    League (2018) #26) |-|Resistances=Resistance to Time Manipulation, Reality Warping, Mind Manipulation,
    Anti-Energy Attacks (Takes an anti-energy blast from Wildfire. Justice League (2018) #2), Biological
    Manipulation/Disease Manipulation (Body can resist pathogenic mutagens. Justice League (2018) #2),
    Ice Manipulation (Breaks free of his cells being told to freeze.Martian Manhunter (2018) #12), Madness
    Manipulation (Enters Atrocitus''s mind, feeling his rage and viewing his past.Red Lanterns #10), Temperature
    Manipulation/Magma Manipulation (Flies closer to the sun than any living beings been before according
    to Superman.Action Comics (2011) #34 Survives heat and lava up-close that was burning Mera from far
    away.Aquaman (2011) #36), Corruption (Resists the totality reverting and mutating his mind.Justice
    League (2018) #3), Pain Manipulation (Endures Mindhunter''s mental assault and torture for hours.Justice
    League (2018) #54-56), Poison Manipulation (Phases only an arm to avoid an attack and phases out his
    lungs to avoid breathing toxic spray.Justice League of America (2013) #3), Paralysis Inducement (Walks
    through a stasis field.Justice League United #2)'
