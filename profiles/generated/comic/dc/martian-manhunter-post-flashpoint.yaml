- id: claim-weaknesses-2615c398
  section: weaknesses
  axis: weakness
  text: 'Martians are much more vulnerable to fire than the average Earth human. At times this has been
    portrayed as physical, psychological, or a combination of the two. The effect of this is to strip
    any Martian of their powers as they involuntarily lose control of their body. Notes: *Before making
    any changes to this page, please read and follow the Power-scaling Rules for Marvel and DC Comics.
    *Martian Manhunter (J''onn J''onzz) was created by Joseph Samachson and Joe Certa, first appearing
    in Detective Comics #225. However, in the Prime Earth continuity, Martian Manhunter (J''onn J''onzz)
    first appeared as part of the New 52 DC Universe in Stormwatch (Volume 3) #1 by Paul Cornell and Miguel
    Sepulveda. *J''onn J''onzz is the older of two twins, whose name means light for light. ==Notable
    Matchups== Victories: Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} ==Note/Explanation==
    {{discussions|martian-manhunter|Martian Manhunter (Post-Flashpoint)}} Category:Characters Category:DC
