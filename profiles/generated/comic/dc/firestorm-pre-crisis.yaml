- id: claim-weaknesses-49513d8a
  section: weaknesses
  axis: weakness
  text: 'Needs to concentrate really hard to know what structure he needs to make. Cannot affect organic
    matter, and if he tries, he gets harmed by harmful energy feedback. If his components aren''t in unity,
    Firestorm can''t act Notable Attacks/Techniques *Molecular Reconstruction: Firestorm has one main
    ability which all others stem from. Firestorm can break down and reapply subatomic particles as well
    as break up the molecular structure of elements and rearrange them. To do this the element must know
    the exact elemental make-up of the object or human. *Density Control: Firestorm has complete control
    over molecules and as such can change the density of solids, liquids and gases to as light as hydrogen
    or as heavy as uranium. Although he has direct control over an object''s density he can use this ability
    on himself and only himself and affect living tissue to pass through objects. *Quark Vision: The ability
    to see extremely small objects and images down to the subatomic level. *Energy Manipulation: **Energy
    Projection: Firestorm can project massive amounts of different amount of energies. Naturally occurring
    energy projected by Firestorm are "Nuclear Blasts" however elements can project a number of different
    energies at will. **Energy Absorption: Firestorm can absorb massive amounts of energy as well as being
    able to absorb many different types of energy. Notes: *Although this character was unaffected by the
    Crisis, due to consistency, in both showings and in narrative tropes, the page is being split into
    both its Pre-Crisis and Post-Crisis incarnations *Before making any changes to this page, please read
    and follow the Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
