      value: 'Explanations about how the power or ability can be applied. ==Types
        of Gods== 1. Old God: The Old Gods of the First World were an ancient race,
        whose annihilation paved the way for the Gods of Earth and other worlds, as
        well as Apokolips and New Genesis in the Fourth World. 2. New God: The New
        Gods, beings born from the ashes and dust of the Old Gods millions of years
        after a long battle, reside within that of The Sphere of Gods otherwise known
        as The God Sphere. Though there are many more areas in the DC Omniverse where
        New Gods might be found, Apokolips and New Genesis are two of the most well-known.'
      source_id: character-stats-profiles-mister-miracle-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Radion: New Gods are vulnerable to a substance called Radion. Its source
        is unknown and its effects are toxic only in sustained amounts or after explosive
        exposure. The average New God can be slain by an application of Radion from
        a Radion blaster or bomb. More advanced beings such as Mister Miracle, protected
        by their mother box, armor, and sheer toughness have been known to take up
        to two hits and survive. Radion, must be hard to come by because if it was
        not, Darkseid would obviously equip more of his troops with it. ==Users==
        *Various inhabitants of Apokolips *Various inhabitants of New Genesis * Grail
        (Prime Earth) *The Highfather'
