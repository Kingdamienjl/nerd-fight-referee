- id: claim-weaknesses-f09acca8
  section: weaknesses
  axis: weakness
  text: 'Lightray is vulnerable to radion, a lethal substance to New Gods. It should
    be noted, however, that powerful New Gods like Kalibak are able to easily survive
    normal radion shots. Notable Attacks/Techniques: *Nova Burst: Described as "total
    solar power", Lightray channels a light aura around his body while charging at
    the enemy like a meteor. *Light Mirage Effect: Lightray manipulates light to create
    illusions realistic enough to fool Apokoliptian hunting dogs. Notes: *Before making
    any changes to this page, please read and follow the Power-scaling Rules for Marvel
    and DC Comics. *"Avatar" is a term specifically referring to an ability demonstrated
    by Pre-Flashpoint Darkseid and Highfather, and it was never stated that the lesser
    versions of New Gods were specifically created by them to interact with lower
    planes of reality. The term used by Grant Morrison to refer to these lower aspects
    of the New Gods is "emanation". * Like other New Gods, the Pre-Flashpoint emanation
    of Lightray was unaffected by Crisis on Infinite Earths, as the Fourth World universe
    was not destroyed and recreated. *The Post-Flashpoint emanations of New Gods have
    very different histories, power-sets, and power levels than the Pre-Flashpoint
    emanations. ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}}
    Category:DC Comics Category:Gods Category:Male Characters Category:Good Characters
    Category:Warriors Category:Cosmic Entities Category:Abstract Entities Category:Large
    Sized Characters Category:Self-Sustenance Users Category:Immortals Category:Incorporeal
    Characters Category:Geniuses Category:Enhanced Senses Users Category:Extrasensory
    Perception Users Category:Energy Projection Users Category:Light Users Category:Elemental
    Intangibility Users Category:Aura Users Category:Energy Users Category:Matter
    Users Category:Biology Users Category:Temperature Users Category:Fire Users Category:Creation
    Users Category:Invisibility Users Category:Illusionists Category:Portal Users
    Category:Dimensional Travel Users Category:Flight Users Category:New Gods Category:Characters
    Category:Nigh-Omnipresent Beings'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-feb4cfa1
  section: abilities
  axis: hax
  text: 'Pre-Flashpoint Emanation= *New God Physiology * All abilities granted by
    his Mother Box * Superhuman Physical Characteristics * Genius Intelligence * Immortality
    (Type 1, 4 - When gods die, they return to the Source, but sometimes have the
    power to escape it and return to life.) * Self-Sustenance (Type 1) * Enhanced
    Vision (Can see the entire electromagnetic spectrum) * Enhanced Hearing (States
    he would have heard Orion''s cry from across the galaxy) * Extrasensory Perception
    (Is in tune with all sources of energy and can detect anything registered by his
    sensitized photons) * Energy Projection and Light Manipulation (Can generate and
    control light beams, omnidirectional bursts, and shape light into constructs.
    Can blind enemies by covering their pupils with light) * Elemental Intangibility
    (Can phase by turning into light) * Aura (Can coat himself in light energy to
    increase his striking power) * Energy Manipulation (Can transmute harmful energy
    into harmless light. Intercepted an energy discharge and channeled it into Orion)
    * Matter Manipulation and Biological Manipulation (Using his light to manipulate
    atoms, Lightray can devolve living beings into basic life forms) * Heat Manipulation
    (Can absorb heat) * Fire Manipulation (Can channel the heat of suns to surround
    himself in fire, shoot fire blasts, as well as control external sources of fire)
    * Creation (Exploded debris into a new star) * Invisibility (Can fool even powerful
    sensors by turning invisible) * Illusion Creation (Can use light to make illusions)
    Resistance to: * Mind Manipulation (Amazing Grace''s mind control failed to work
    on him) * Life Force Absorption (Survived the Morrow Block''s planetary-scale
    life drain) * Extreme Cold and Cosmic Radiation (Can fly in space unharmed) |-|Post-Flashpoint
    Emanation= *New God Physiology * Superhuman Physical Characteristics * Immortality
    (Type 1) * Self-Sustenance (Types 1 and 2) * Flight * Light Manipulation (Carried
    Highfather''s sphere with tethers of light) * Portal Creation and Dimensional
    Travel (Can summon boom tubes) Resistance to: * Disease Manipulation (New God
    physiology makes them immune to disease) * Extreme Cold and Cosmic Radiation (Can
    fly unharmed in space) |-|Godhead= All previous abilities to a much greater degree,
    plus: * Abstract Existence (Type 1 - New Gods are living ideas from a platonic,
    archetypal world) * Self-Sustenance (Type 3) * Incorporeality * Large Size (Type
    9 - Godheads are large enough to fall over the entire multiverse)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
