    Barry should be capable of the same powers as Wally which includes the following: Durability Negation,
    Kinetic Energy Manipulation (Speed stealing and lending), Regeneration (High-Low), Limited Air Manipulation,
    Conceptual Manipulation (Type 2; Should be comparable to Wally West, who saved his children by taking
