- id: claim-weaknesses-85c97a56
  section: weaknesses
  axis: weakness
  text: 'Needs to focus to fight at full efficiency. Feats: *Could keep up with M''Onel, who has the same
    powers as Superman, possessed by an entity known as Redin Klerggh, and eventually defeat him: **First,
    Val managed to redirect Redin''s lunge using his own momentum against him. **Then, he managed to avoid
    a rapid-fire rush of heat vision beams, staying ahead of their path of fire while remaining impossible
    to predict, baiting Redin into getting rocks to collapse on him, angering him. **When this prompted
    Redin to lunge at him at full power again, Val redirected the tackle, which had enough momentum behind
    it to take Redin to a red sun solar system, where M''Onel''s body would be deprived of its powers.
    *Can spot the weak points of any substance even on the microscopic level. *Could immediately recognize
    that Mon-El had been possessed by the change in his body language. *Hurt a Daxamite with a kick, and
    was confident in fighting them even after an injury. *Easily overwhelmed Roy Harper. *Could keep up
    with Superboy with ease in a sparring match, repeatedly flooring him. *Knocked out Evolvo with ease.
    *Defeated fifty of the Earth''s most dangerous superpowered criminals all at once. *Could react to
    attacks with great precision while blindfolded even as a child. *Could hear a foe''s excited heartbeat
    from a kilometer of distance. *Smelled smoke and blood from far further than others could. Note: *Before
    making any changes to this page, please read and follow the Power-scaling Rules for Marvel and DC
    Comics. *This profile covers the Post-Zero Hour version of Karate Kid, who, together with the rest
    of his version of the "Reboot Legion", replaced the original ones in 1994, and is replaced by the
    Prime Legion versions in November 2004, following the Teen Titans/Legion of Super-Heroes crossovers.
    **As such, this version of Karate Kid should not be confused with the Pre-Zero Hour Karate Kid, Five
    Years Later/Batch SW6 Karate Kid, who is a time-displaced clone of the original Karate Kid (and as
    such technically the same individual) or Prime Legion Karate Kid. He should also not be confused with
    the Post-Rebirth version of the character or Karate Kid II (Real name Myg), Pre-Zero Hour Karate Kid''s
    successor. *While this Karate Kid''s abilities aren''t as fleshed-out as the original version, it
    is presumed that he is capable of hurting Kryptonian-tier enemies through the same methods as the
    first, as he has been shown to be far below their level of durability.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-5e4d7278
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts and Genius Combat Intelligence (Val Armorr
    is a master of all of Earth''s martial arts, as well as many more across the universeThe DC Comics
    Encyclopedia), Weapon Mastery (Val is extremely trained in the usage of weaponryTitans/Legion of Super-Heroes:
    Universe Ablaze Vol 1 2, alongside unarmed combat), Information Analysis (Can spot the weak points
    of any substanceTitans/Legion of Super-Heroes: Universe Ablaze Vol 1 4 even on the microscopic levelLegion
    of Super-Heroes Vol 4 125. Could immediately recognize that a fellow Legionnaire had been possessed
    by the change in his body languageLegion of Super-Heroes Vol 4 111), Pressure Points and Durability
    Negation (Can defeat foes by striking pressure points or nerve clustersLegion Worlds Vol 1 5. Can
    spot and strike the weak points of any substance), Acrobatics and Afterimage Creation (Leaped around
    all of a possessed Mon-El''s attacks), Precognition (Avoided all of a foe''s attacks by remaining
    one step ahead of them at all times, while at the same time preventing them from guessing his next
    move), Attack Reflection (Can redirect much stronger foes'' attacks utilizing their own momentum),
    Enhanced Senses (Even as a child, Val could react to attacks with great precision while blindfolded.
    Could hear a foe''s excited heartbeat from a kilometer of distanceLegion of Super-Heroes Vol 4 121.
    Smelled smoke and blood from far further than others could), Instinctive Action (Pulled off a particularly
    difficult move by closing eyes and not thinking about it at all, performing it on pure instinct),
    Stealth Mastery (Is part of the Legion of Super-Heroes'' stealth squad, with every other member having
    a power usable for concealing themselvesThe Legion Vol 1 34), Flight (Carries a Flight RingLegionnaire
    Vol 1 60), Underwater/Space Breathing (Types 3 and 4) and Resistance to Radiation Manipulation League
    Transuits can produce breathable atmospheres for the sake of moving in dangerous environments, and
    can even protect from the vacuum of spaceTeen Titans Vol 3 16)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
