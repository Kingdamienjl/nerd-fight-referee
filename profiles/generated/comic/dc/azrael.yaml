  intelligence:
    text: Likely Genius generally (Studied computer technology in the Gotham University,
      and has been shown to effectively apply this knowledge in combat situations,
      for instance, how he hacked a complex computer system using an electric fence
      and a wire from a defeated robot. His detective skills were complimented and
      even compared to Batman's by Alfred, although he dislikes detective work. Has
