  attack_potency:
    text: 'Building level (Stronger than anyone in the bat-family,Azrael: Agent of
      the Bat #93 defeated Bane on three separate occasions, and fought Deathstroke
      to a draw in a sword fight. Easily defeated Batman, knocked out Benny, a metahuman
      who took Nightwing''s blows with no damage whatsoever. Defeated Calibax, a metahuman
      who passively got stronger by absorbing the life force of others and currently
      had Deathstroke''s strength. Took out the Huntress with a garbage can. Was stated
      to be capable of taking out the entire Arkham Asylum at his best) Can ignore
      conventional durability with his gauntlet shots'
    source_ids:
    - vsbattles-azrael-dc-comics
    confidence: 0.9
  speed:
    text: Hypersonic+ (Faster than anyone in the Bat-family, and could keep up with
      Deathstroke. Batman admitted Azrael was faster than him. Protected Cassandra
      Cain from an explosion before she could react)
    source_ids:
    - vsbattles-azrael-dc-comics
    confidence: 0.9
