      armor, he's completely undamaged by Batman's blows. Can take gunfire with no
      damage. Protected Cassandra from an explosion that would've killed her, although
      he was hospitalized after that. A different person wearing his armor withstood
      a plane exploding)
    source_ids:
    - vsbattles-azrael-dc-comics
    confidence: 0.9
  stamina:
