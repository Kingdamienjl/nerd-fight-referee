    text: Genius (Slade is a great strategist and tactician. Always calculating his
      opponents' moves beforehand; he even singlehandedly defeated a JLA roster that
      lacked the "Big Three". He has been compared to Batman in terms of tactical
      methods. Even against metahumans, he has proven more than a match for them all
      at once with time to prepare. Roy Harper once claimed the Slade was, "The world's
      greatest tactician." Using his superior problem-solving skills, Deathstroke
      can work out a battle ahead of time for many possibilities and predict enemy
      movements and tactics after the battle has engaged by recalling and utilizing
      memorized mannerisms acquired through past experience on a moment's notice.)
    source_ids:
