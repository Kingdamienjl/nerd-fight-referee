- id: claim-weaknesses-e72fcd97
  section: weaknesses
  axis: weakness
  text: 'The Ragman cloak runs on a limited supply of souls that Rory needs to replenish by absorbing
    those of evildoers. Judging by the more complete look of his suit compared to his first foray as a
    superhero, however, he seems to have a lot at his disposal. Note: Before making any changes to this
    page, please read and follow the Power-scaling Rules for Marvel and DC Comics'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-1996378b
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Acrobatics and Martial Arts (Rory uses his suit''s tendrils
    to assist himself in performing acrobatic dodges and attacks, incorporating his special forces training
    into his fighting styleRagman Vol 3 2Ragman Vol 3 3), Regeneration (Up to Low-Mid: The Ragman suit
    allows Rory to heal at a faster pace, and even allowed him to regenerate from multiple impalement,
    albeit by expending multiple soulsRagman Vol 3 5Ragman Vol 3 6), Multiple Selves (All types: The Ragman
    suit lives in Rory, and contains all of the souls he absorbed, who can talk to him), Soul Manipulation
    (Can absorb evil souls, talk to them and even pull them out and back into their bodiesBatwoman Vol
    2 35Batwoman Vol 2 Annual 2), Body Control and Transformation (Ragman can change the shape of his
    own body, such as sprouting multiple tendrils, a shield or turning into a fish-like shape to fight
    underwaterRagman Vol 3 1Justice League Vol 4 66. However, there are limits to this, based on how many
    souls Ragman has taken, which will turn into patches on his outfit. He can also summon the Ragman
    outfit on at willBatwoman Vol 2 39), Flight, Spaceflight and Self-Sustenance (Type 1: Shown here),
    Teleportation (Shown hereBatwoman Vol 2 38), Astral Projection (Can enter an astral projection of
    sorts through his rags), Fire Manipulation (Can surround himself in flames), Enhanced Senses and Extrasensory
    Perception (Ragman has Demon Eyes all over his body, allowing him to see in all directions at once,
    see invisible demons and even spread his tendrils with those eyes on them to scout a large area without
    movingRagman Vol 3 4), Empowerment (By consuming souls, Ragman can increase his power), Weapon Creation
    (Can seemingly create spearsJustice League Vol 4 60), Summoning and Transformation (Can call upon
    demons to transformJustice League Vol 4 69)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
