      punches hurt more than Superman''sWonder Woman Vol 2 #214, can harm Superman
      and break out of Green Lantern''s constructsGreen Lantern Sinestro Corps Special
      Vol 1 #1. His slightest of movements can cause unimaginable power. He was eventually
      going to be the messenger of DarkseidFinal Crisis: Rogues Revenge Vol #3Infinite
      Universes)'
    source_ids: *id002
