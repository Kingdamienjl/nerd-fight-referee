      \ one during Death of Superman destroyed Booster Gold's forcefield.Booster Gold Vol. 2 #46, September\
      \ 2011 Easily defeatedJustice League America Vol 1 #69 Yellow Lantern Guy Gardner, who's superior\
      \ to his Green Lantern self,Guy Gardner Vol. 1 #14, November 1993 who was mostly unharmed from an\
      \ attack that killed multiple Guardians of The UniverseCrisis on Infinite Earths Vol. 1 #9, December\
      \ 1985Infinite Universes) | Multiverse level+ (Grew more powerful,DC Comics Justice League: The\
      \ Ultimate Guide, October 2017 overpowered Darkseid,Superman/Doomsday: Hunter/Prey Vol. 1 #1, April\
      \ 1994 even being regarded as unkillable by him, fought a mother-box equipped Superman and had an\
      \ upperhand. Became even more powerfulSuperman: Doomsday, March 2016 and defeated the Justice League\
      \ of America,Superman: The Doomsday Wars Vol. 1 #1, November 1998 including The Flash, Wonder Woman,\
      \ Martian Manhunter, Orion, Plastic Man, as well as Superman.Superman: The Doomsday Wars Vol. 1\
      \ #3, January 1999 Destroyed multiple Imperiex Probes,Adventures of Superman Vol. 1 #594, September\
      \ 2001 who were capable of defeating Justice League members, including Post-Clayface Absorption\
      \ Wonder Woman and Post-Circle of Fire Kyle RaynerOur Worlds at War Vol. 1 #1, September 2001Infinite\
      \ Universes) | Multiverse level+ (While his ability to feel emotions has affected his strength,Superman\
      \ Vol. 2 #175, December 2001 he still should be stronger than before, albeit not as his full potential,\
