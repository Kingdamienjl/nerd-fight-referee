  axis: weakness
  text: 'Headstrong and egotistical nature can be exploited. Requires to say Shazam
    in order to transform and transform back to his human form. Magical lightning
    used to transform him can be used transform him back to his human form as well.
    Notable Attacks/Techniques: *Lightning: By calling out the word "Shazam!", Black
    Adam can summon a mystic lightning bolt from above to strike at his location to
    devastate anyone that gets caught in it, however, due to the risk of turning back,
    he normally uses it as a finishing move or if he''s in a less-than-favourable
