- id: claim-weaknesses-003acaba
  section: weaknesses
  axis: weakness
  text: 'Uncontrollably discharges lightning when he becomes emotionally overwhelmed. Using the Speed
    Force excessively and recklessly can result in him being permanently trapped in it. He cannot alter
    the kinetic energy of objects that gain their speed from time manipulation. He also needs a massive
    amount of food to compensate for his greatly accelerated metabolism. Lacks complete control over his
    time manipulative powers. Feats: *Can perceive picoseconds *Accelerates far beyond light-speed to
    the point of entering the Speed Force *Beats Ultraman into submission, hitting him hundreds of thousands
    of times before he could react *Easily knocks out H.I.V.E. agents that were previously overpowering
    the Titans, including Donna Troy and Tempest *Harms Troia, an alternate future counterpart of Donna
    TroyTitans (Volume 3) #18'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
