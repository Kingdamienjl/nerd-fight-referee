- id: claim-weaknesses-28d77a5f
  section: weaknesses
  axis: weakness
  text: 'Normal human weaknesses Feats: *Intelligence **Brigade Executive Officer of the Corps of Cadets
    at West Point. Was an exceptional student. **Made black market deals with crooked former Marines to
    get equipment in her early days as a vigilante. **Knows about a Religion of Crime coven before Batman
    does. **Knows how to collect blood samples for DNA testing, and what to test for. **Gets a hostage
    to help defeat a kidnapper. **Studies the occult. **Can read footprints well enough to know there
    are no outliers. **Researches the legend of the Weeping Woman and uses meditation to figure out her
    weakness. **Finishes picking a lock without looking. *Strength **Throws a robber roughly six feet
    with one arm while sitting. Hits another with a volleyball pole, and smacks another with his bag of
    loot so hard that a bunch of jewels get stuck in his face. **Keeps a man braced against a wall with
    one foot. **Bench-presses 165 lbs (50 and 10 lb plates and a 45-lb bar). **Grapple-swings while carrying
    a woman in one arm. After landing, throws her what looks like ten or so feet, also one-handed. **Casually
    throws a knife hard enough that it gets stuck in a wooden door. **Punctures a fuselage with her gauntlet
    and holds a woman by the wrist. **Punches a shapeshifter so hard he changes back into a human. **Breaking
    a jaw and some ribs. *Speed and Agility **Kate was an All-State gymnast in high school. **A thug runs
    at her while aiming a gun. She hits him before he can fire. **Jumps out of a window into a pool several
    stories below, avoiding metal beams. **Lands on a man while he''s running. **Dodges a stab while drugged.
    **Jumps from one plane to another with only her cape as safety. **Leaps off her motorcycle into the
    back of a speeding van. *Durability and Endurance **Her first suit can tank bullets and has a gorget
    to block throat attacks. The cape can block bullets and knives. **Practically no-sells a kick to the
    face while drugged. **Only gets a bloody lip after a punch from a cyborg. **Her new suit can no-sell
    bullets. **Gets her head smashed into a door, only gets a small cut lip. **Takes a palm-strike to
    the jaw from Falchion, stands soon after. Note: Before making any changes to this page, please read
    and follow the Power-scaling Rules for Marvel and DC Comics. ==Gallery== Batwoman Render.png|Kotobukiya''s
    Batwoman ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions|Batwoman Kate Kane Post-Crisis|Batwoman
    (Kate Kane) (Post-Crisis)}} Category:Characters Category:DC Comics Category:Bat Family Category:Comic
    Book Characters Category:Female Characters Category:Grappling Users Category:Hook Users Category:Humans
    Category:Twins Category:Martial Artists Category:Thrown Weapon Users Category:Vigilantes Category:Heroes
    Category:Superheroes Category:Good Characters Category:Stealth Masters Category:Protagonists Category:Loyal
    Characters Category:Adults'
  source_ids: *id003
  decisive: false
  status: unverified
