  intelligence:
    text: Gifted. She was trained by the Armless Master in martial arts and by Wildcat
      in boxing and street-fighting. She is a dangerous, clever and resourceful fighter,
      known for precise, agile attacks and speedy getaways. Her formidable hand-to-hand
      combat skills are augmented by her cat-like speed, reflexes, balance, and flexibility.
      Catwoman has also mastered Dragon Style Kung Fu and Karate. Her skills are good
      enough to have fought off Batman, wounded him, and occasionally defeated him.
      Selina is also, most notably, a master thief possessed of great stealth and
      cunning. An expert at both low- and high-tech heists, she is Gotham City's finest
      cat-burglar, and has exceptional knowledge in computer science, as she is able
      to hack and breach past even the most complex and sophisticated security functions
      in a computer system.
