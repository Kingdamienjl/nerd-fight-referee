- id: claim-powers-and-abilities-d00769a8
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Martial Arts and Weapon Mastery (Honor is an extremely skilled
    assassin, renowned and proven to beThe Silencer Ch 12 one of the top agents of Leviathan,The Silencer
    Ch 4 Talia Al Ghul's elite assassin association comprised solely of metahumans, and is comparable
    to masterful fighters such as Deathstroke, Wonder WomanWonder Woman Vol 5 83, or BatmanThe Silencer
    Annual, capable of killing superpowered foes in mere seconds even after several years of inactivityThe
    Silencer Ch 1 and fight against large groups of cybernetically enhanced gunmenThe Silencer Ch 3 even
    while holding a conversationThe Silencer Ch 6 or only with her bare hands), Sound Manipulation (Silencer's
    primary ability is to cause zones in which there is no sound, which she can use to dispatch foes silently,
    confuse them or make them dizzy by affecting their inner ears), Weapon Control, Deconstruction, Matter
    Manipulation and Nanotechnology (Can instantly summon her suit on, which works by deconstructing her
    clothes into nanites, storing them within the object containing it and replacing them with the suitThe
    Silencer Ch 2. The nanites it's composed of can also be used for other tasksThe Silencer Ch 5, and
    their ability to deconstruct things can be used to morph matterThe Silencer Ch 7), Energy Projection
    (The bullets Silencer fires seem to be accompanied by energy blasts), Preparation (Silencer's house
    is protected by highly advanced, hidden technology), Light Manipulation and Explosion Manipulation
    (Has access to blinding flashbang marbles, which can also be used as explosivesNightwing Vol 4 49),
    Stealth Mastery (Partially thanks to her sound-negating abilities, Silencer was typically hired for
    stealthy assassinations, where she often tracked her targets unnoticed for days. With tactical use
    of her powers, Silencer can kill dozens of enemies without alerting her targetsThe Silencer Ch 14),
    Hacking and Technology Manipulation (The Nanode can be used to override and control technology), Enhanced
    Senses (Silencer's suit can sense heat signatures), Corrosion Inducement (Honor's nanites can eat
    through metal), Weapon Creation (Can form weapons out of her nanites, even huge, far more powerful
    ones with enough materialThe Silencer Ch 10), Surface Scaling (Honor's suit can shift to form micro-hooks
    that allow her to cling to surfaces), Acrobatics (Can quickly climb up a building and leap across
    rooftops through sheer acrobatic prowess), Explosion Manipulation (Planted explosives around a base
    she was ordered to destroy), Supernatural Willpower and Social Influencing (After being revived by
    a Lazarus Pit, which was expected to wipe her mind and memoriesThe Silencer Ch 13, Honor managed to
    cling onto them and maintain her identity, while perfectly fooling Talia and her subjects into thinking
    she was now a loyal pawn), Vibration Manipulation and Intangibility Negation (Honor's power works
    by dampening vibrations, as such she can use it to nullify phasing abilitiesThe Silencer Ch 16), Temperature
    Manipulation (Silencer's suit can shift its temperature to hide her from heat sensorsThe Silencer
    Ch 18), Vehicular Mastery (Took part inNightwing Vol 4 48 "the greatest motorcycle race in the universe"),
    Healing (Silencer's suit can product a healing spray potent enough to somewhat heal her from impalementWonder
    Woman Vol 1 750), Resistance to Light Manipulation (Her suit has a built in visor capable of blocking
    off blinding lights)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
