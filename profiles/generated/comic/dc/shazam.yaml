- id: claim-powers-and-abilities-c1b5bf45
  section: abilities
  axis: hax
  text: Transformation and Self-Age Manipulation. Blessed with the power to gain Superhuman
    Physical Characteristics, Superhuman Speed, Electricity Manipulation, Energy Projection
    (Can summon the bolt of Zeus as a weapon), Immortality (Type 1), Flight, Magic,
    Regeneration (Mid; regenerated from being turned inside out), Expert Hand-to-Hand
    Combatant, Self-Sustenance (Type 1 and 2; The ability to survive in space and
    without food, water, or air for extended periods of time), Incredible Mental Acuity
    and knowledge of all of human history, Information Analysis with Wisdom of Solomon
    (It allows him to know the powers of those he has never fought before), Power
    Nullification (His lightning can negate Mind Manipulation), Air Manipulation (Created
    a mini-tornado), Time Travel (Can travel back to the Big Bang), Resistance to
    Illusion Creation (Easily saw through an illusion from Shazam), Petrification
    (Resisted a beam that petrified Superman), Magic, Possession (Resisted the temptation
    of the Spear of Destiny) and Mind Manipulation (As shown here)
  source_ids: *id003
  decisive: true
  status: unverified
