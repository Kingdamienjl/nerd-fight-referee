- id: claim-weaknesses-180baed9
  section: weaknesses
  axis: weakness
  text: 'Without the power of Shazam, he is only a normal, if street smart, child.
    Many stories portray him as incredibly naïve and idealistic and is easily distracted
    due to his nature as a pre-teen boy, and he will revert back to being Billy if
    he is somehow forced to say "Shazam!". If Shazam turns back into Billy, and is
    incapable of voicing the magic word, such as by having a gag or a hand in his
    mouth, he will be unable to transform. Note: Before making any changes to this
    page, please read and follow the Power-scaling Rules for Marvel and DC Comics.
    ==Notable Matchups== Victories: Losses: Ben Tennyson (Ben 10) Ben''s Profile (Post-Revival
    of Iblis Shazam and Omniverse Ben were used. Ben had access to all his aliens
    except for Alien X. Speed was equalized and they fought in an empty Bellwood)
    Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} ==Notes/Explanations==
