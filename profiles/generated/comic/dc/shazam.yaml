  intelligence:
    text: Due to having the Wisdom of Solomon, Captain Marvel has access to a vast
      repository of scholarly knowledge of human history and has a photographic memory,
      allowing him to converse in virtually any human language and has a working knowledge
      of many fields of science and mathematics. In addition, his nearly infallible
      wisdom is supplemented by an incredible amount of experience, facing virtually
      every kind of foe during his solo adventures and time with the JSA and JLA,
      from aliens, to scientists, to deities and demigods who are able to wield power
      comparable to his, making him an excellent hand-to-hand combatant who is able
      to spar with the likes of Superman and Wonder Woman. However, due to being a
      child, he is often excitable, naïve, and easily distracted, which has gotten
      him into trouble on various occasions
    source_ids: *id002
    confidence: 0.95
