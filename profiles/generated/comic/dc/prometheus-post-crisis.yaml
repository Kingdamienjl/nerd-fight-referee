- id: claim-standard-equipment-f5d1926d
  section: equipment
  axis: equipment
  text: '*Computerized Helmet: It is connected to his brain and central nervous system. It allows him
    to download information databases directly into his brain while enhancing his memory capability. During
    a fight, the helmet will analyze the opponent. If they are in the database, it will recognize their
    attack patterns and weaknesses, giving Prometheus the countermeasures for the attack. Its lights can
    be struck at different rates, which will either hypnotize opponents or disorient them, and the neural
    chaff can affect directly other people''s brain, disrupting their thought proccess and making them
    relive memories. *Body Armor: It grants him self-propelled flight and enhanced physical prowess. The
    inside of the suit has nanobytes as defense against sizeshifters like The Atom. It also constantly
    feeds Prometheus with endorphins. *Cosmic'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-3d153914
  section: power_scale
  axis: battle_iq
  text: Extraordinary Genius (Prometheus is an expert in technology, biology, architecture, mathematics,
    literature, history, physics, and religion. He is preparations master, who has fought, maimed and
    killed several superheroes throughout the years. He encountered the Justice League three times and
    single-handedly incapacitated most of their members. He created his own equipment, including a helmet
    that turned his brain into a supercomputer, and combined the technology of the Cosmic Treadmill, Zeta
    Beams and a Time Pool to teleport several cities out of time and space, and made it resistant to magic)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-0178d527
  section: weaknesses
  axis: weakness
  text: 'Prometheus suffers from short-term memory and needs to use his helmet in order to mitigate it.
    The helmet can be hacked by people knowledgeable of its inner workings Notes: Before making any changes
    to this page, please read and follow the Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-2bbf178a
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Preparation, Nanotechnology, Weapon
    Mastery, Martial Arts, Master at Disguises, Explosion Manipulation (With bombs and missiles), Flight
    (His armor can manipulate its surrounding magnetic field and propel him to fly), Energy Projection,
    Light Manipulation (Can emit a blinding light from his armor), Electricity Manipulation (With his
    nightstick and gauntlets), Fire Manipulation (With incendiary grenades and Phosphurus darts), Illusion
    Creation (His suit is equipped with a chameleon device, which allowed him to steal Freddy Freeman's
    likeness and his voice mannerisms. Tricked Green Arrow into attacking Donna Troy), Hacking (Took control
    of Steel's armor with his nightstick), Mind Manipulation (By flickering his helmet lights at 10 cycles
    per second, he can hypnotize and disorient foes. His neural chaff affects the electricity on the brain,
    disrupting the opponent's concentration and affecting their willpower), Memory Manipulation (Forced
    Hal Jordan to remember his father's death), Sleep Inducement (Via hypnosis), Status Effect Inducement
    (Used a bacteria to mess with Jay Garrick's sensorial system), Teleportation, Dimensional Travel and
    BFR (Can teleport himself and banish foes to the Phantom Zone with the Cosmic Key), Weapon Creation,
    Forcefield Creation, Attack Reflection (Projected a shield capable of reflecting photon blasts), Information
    Analysis and Analytical Prediction (His helmet can predict when the opponent is going to strike and
    the angle of the attack. Can analize the opponent's weaknesses mid-battle if their information was
    ever downloaded into his brain), Limited Power Nullification (Via preparation), Limited Power Bestowal
    (Mutated Preston Payne and gave him the ability to shapeshift), Resistance to Telepathy (As shown
    here)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
