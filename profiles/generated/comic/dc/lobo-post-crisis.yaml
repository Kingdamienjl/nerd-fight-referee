- id: claim-weaknesses-30231316
  section: weaknesses
  axis: weakness
  text: 'Lobo is very arrogant and he can easily lose his patience. He takes delight
    in fighting and does not get along well in groups, whereas his comrades were often
    the target of his physical and verbal violence during his time in the L.E.G.I.O.N.
    He is usually drunk and not at 100% capability, and is also susceptible to manipulation
    from women. As an infallible man of his word, Lobo will never break a contract,
