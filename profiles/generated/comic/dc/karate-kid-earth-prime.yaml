- id: claim-weaknesses-99b14ce1
  section: weaknesses
  axis: weakness
  text: 'None notable Notes: *Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics. *This profile covers the Earth-Prime or "Prime Legion" version of
    Karate Kid, which replaced the Post-Zero Hour versions in November 2004, and was replaced by the original
    continuity version following Infinite Crisis in 2006. **As such, this version of Karate Kid should
    not be confused with the Pre-Zero Hour Karate Kid, Five Years Later/Batch SW6 Karate Kid, who is a
    time-displaced clone of the original Karate Kid (and as such technically the same individual) or Post-Zero
    Hour/Reboot Legion Karate Kid. He should also not be confused with the Post-Rebirth version of the
    character or Karate Kid II (Real name Myg), Pre-Zero Hour Karate Kid''s successor.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-beb869b9
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts (Karate Kid has received training from masters
    all around the worldThe Brave and the Bold Vol 3 5. Can fight againstLegion of Super-Heroes Vol 5
    12 massive groups of foes in close quartersSupergirl and the Legion of Super-Heroes Vol 1 22. Could
    fight evenly with Batman, though with the advantage of superior familiarity with the Flight Rings),
    Damage Boost (By achieving perfect focus, Karate Kid can perform incredible feats of strength), Acrobatics
    (Has developed a highly mobile style to fight while hoveringLegion of Super-Heroes Vol 5 2), Sleep
    Manipulation and Chi Manipulation (Can put others to sleep by affecting their ChakraLegion of Super-Heroes
    Vol 5 2), Instinctive Action (All of Karate Kid''s actions in combat are instinctive, for the sake
    of a faster combat paceLegion of Super-Heroes Vol 5 6), Body Control and Resistance to Status Effect
    Inducement (Karate Kid has total control over every part of his body, and is capable of resisting
    nauseating effects thanks to thisLegion of Super-Heroes Vol 5 40) Flight and Gravity Manipulation
    (Val is equipped with a Legion Flight Ring, which allows the user to fly freely by traversing through
    the universal gravity fieldLegion of Super-Heroes Vol 5 41, and has trained to fight in the conditions
    it createsLegion of Super-Heroes Vol 5 2), Damage Reduction (Legion uniforms are resistant to penetration
    and can diffuse and disperse impacts and energyLegion of Super-Heroes Vol 5 42), Air Manipulation
    and Aura (Flight Rings create an aura around the wearer that protects them from environmental effects
    and provides breathable airLegion of Super-Heroes Vol 5 41), Enhanced Senses (Flight Rings instill
    a subtle sense of nearby obstacles to the one using themLegion of Super-Heroes Vol 5 41. Carries hi-tech
    binocularsLegion of Super-Heroes Vol 5 43), Hologram Creation (Legion Rings can project hologramsLegion
    of Super-Heroes Vol 5 41), Resistance to Radiation Manipulation and Temperature Manipulation (Flight
    Rings allow the wearers to be in space without issueSupergirl and the Legion of Super-Heroes Vol 1
    16), Resistance to Transmutation and Matter Manipulation (Legion Flight Rings protect against the
    effects of the Phantom ZoneFinal Crisis: Legion of 3 Worlds Vol 1 1)'
  source_ids: *id003
  decisive: true
  status: unverified
