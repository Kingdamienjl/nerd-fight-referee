- id: claim-weaknesses-70b21ae8
  section: weaknesses
  axis: weakness
  text: Larry's continued use of the Negative Man is hampered by a potentially fatal restriction. If Trainor
    is ever separated from the energy being for more than one minute, he would lapse into a coma and eventually
    die. Trainor is always careful to recall the entity back to his person before the sixty-second time
    limit expires. But by now he has trained himself to last much longer before turning to his body at
    will. Phasing through biological material causes pain to the affected target. Lead is the only substance
    that he cannot phase through
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-0ac34178
  section: abilities
  axis: hax
  text: Radiation Manipulation (His body constantly emit radiation due to which he has to cover up his
    whole body with clothing and bandages), Longevity, Vehicular Mastery (Was formerly an air force test
    pilot), Flight (The Negative Spirit can help him fly), Mind Manipulation (Can transport himself and
    others to the minds of other people), Dimensional Travel and Zero-Dimensionality (The Negative Spirit
    can collapse itself infinitely and approach zero to reach the Negative Space, a place beyond existing
    and physicality), BFR (The Negative Spirit can send people into the Negative Space), Vibration Manipulation
    (Negative Man, Crazy Jane and Willoughby Kipling produced counter vibrations to slow down the Decreator
    to the point that it was destroying everything so slowly, it could barely notice it was happening
    at all), Immortality (Type 4) and Resurrection (After being killed by Candlemaker, the Negative Spirit
    was able to transfer the consciousness of Larry to a new body that it gave birth to), Empathic Manipulation
    (As Positive Man, Larry can project positive energy into the world), Social Influencing (Among the
    positive energy he can project, Larry can convince people to become infatuated with one another),
    Absorption (Can absorb thermal energy and convert it into an explosive discharge tied to his other
    thermal abilities), Density Manipulation (Can alter his density to phase through solid objects), Energy
    Projection (Can generate waves of intense heat, causing it to explode or tighten it into a concussive
    blast), Resistance to Conceptual Manipulation and Spatial Manipulation (Was injected by Space Fix
    which made him immune to plagues that can destroy words and meanings themselves. The same plague can
    also destroy the concept of space itself which makes movement impossible), Radiation Manipulation
    (The Negative Spirit is constantly protecting Larry from the radiation in his own body)
  source_ids: *id003
  decisive: true
  status: unverified
