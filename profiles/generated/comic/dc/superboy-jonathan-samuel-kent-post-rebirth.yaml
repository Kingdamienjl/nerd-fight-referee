  intelligence:
    text: Despite being called a "day-dreamer" and acting much like any other child his age, Jon has proven
      himself to be unusually intelligent at times, solving fairly complex 5th Grade math problems nearly
      instantly while he wasn't paying attention and tinkering with Kryptonian technology with his father's
      help. He is also capable enough to drive a tractor on his own, later applying those skills to ram
      a truck into Zade while the latter was fighting his father. However, his inexperience has left him
      with incomplete control over his powers and he lacks proper combat technique due to growing up in
      a normal household. However, his mastery over his powers is slowly growing in more recent issues,
      being able to sift through weeks worth of visual data in seconds and possessing much greater control
      over his heat vision. As of the Black Dawn arc, his control has greatly improved to the point that
      he rarely has problems using his powers.
    source_ids: *id002
    confidence: 0.95
