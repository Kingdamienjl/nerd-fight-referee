      Starfire, and the Titans Tomorrow versions of Conner Kent, Cassandra Sandsmark, and Bart Allen to
      containSuperman 2016 #38, but even then it needed to be sucked into hypertime by Savior to nullify
      itSuperman 2016 #38) and his Lazarus Energy amplification (Overpowered and weakened Ultraman. Far
      stronger than beforeAdventures of Superman: Jon Kent (2023) #2)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Massively FTL+ (Outraced his father at one point, who raced Wally West but was still being
