      briefly managed to run and hide from Lex Luthor while the latter was using a set of armour imbued
      with New God technology. Defeated five supervillains that were battling the Teen Titans before Kid
      Flash, who is on par with Barry Allen, could react. Kept pace with StarfireSuper Sons #2 2017)'
