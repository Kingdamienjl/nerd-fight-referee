- id: claim-powers-and-abilities-09bc9031
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Inorganic Physiology (Type 2; Similar to Preston Payne,
    his blood is more akin to mineral virus while the rest of his body is made of clayThe Outsiders Vol
    4 #22, His biosystem contains almost no trace of recognisable human biological materialBatman: Gotham
    Knights #70) **Self-Sustenance (Type 1 & 2; Came back offscreen from being launched into space by
    Mary Marvel, Does not need nutrients to survive anymoreBatman: Shadow of the Bat #88) *Skilled Hand-to-Hand
    Combatant (Said to be a fierce hand-to-hand combatantWho''s Who: The Definitive Directory of the DC
    Universe #5, was able to outmatch Robin in a fight) *Skilled Knife User (Has shown skill with a knife
    to be able to make it stand on his fingertips without supportDetective Comics Vol 1 #607 as well as
    implied to be a good knife throwerSecret Origins Vol 2 #44) *Social Influencing (Self-proclaimed as
    one of the greatest actors of our time and able to play the roles of almost anyone, Was able to trick
    Wonder Woman and Donna Troy when disguised as Superman and CheetahWonder Woman Vol 2 #161Wonder Woman
    Vol 2 #160 as well as many others in his other disguises, Manipulated Clayface IV into doing his bidding
    when he was part of the Mudpack), *Regeneration (At least High-Mid; Has quickly reconstituted his
    body from being sliced in halfTitans Vol 2 #29 and being blown upBatman Confidential #21, Likely Mid-High
    overtime; Was able to come back offscreen from having his whole body be eaten by Poison Ivy''s plants)
    *Body Control, Elasticity & Shapeshifting (Able to morph or shift his body in about any way possible)
    *Weapon Creation (Has shown to be able to create weapons from nets and hooks to hammers and chainsawsTitans
    Vol 2 #30) *Density Manipulation & Elemental Intangibility (Can control his density to make attacks
    pass through him or become extremely hard) *Size Manipulation (Able to grow in size to Type 0 normally
    at a moments notice and shrink to Type 1, up to Type 1 by absorbing people into himself) *Duplication
    (Able to make a bunch of decoy people out of himself each able to act on their own and with different
    personalitiesJoker''s Asylum II: Clayface) *Limited Earth Manipulation (Due to being mostly made out
    of clay) *Stealth Mastery & Camouflage (Able to disguise himself as parts of the ground to sneak on
    the Riddler and Mary MarvelCountdown #42) *Statistics Amplification, Power Mimicry & Absorption (Due
    being partial made of smectites, he can absorb properties at a greater rate than any other clay group,
    which was shown when he absorbed other clay types into his body, the power of deep quartz into his
    body or he absorbed the clay that made up Wonder Woman''s body, Absorbing people into himself can
    increase his power and size) *Poison Manipulation (Capable of expunging material classified as toxic
    waste if he consumes sewageArkham Reborn #2) *Disease Manipulation, Biological Manipulation & Corrosion
    Inducement (Similar to Preston Payne, with his Deadly Touch able to dissolve people into protoplasm
    by secreting a unique enzyme with a touch, also able to corrode through inorganic material such as
    dirt and stone as wellDetective Comics Vol 1 Annual #2) Resistance to *Earth Manipulation (Able to
    be immune to Geo-Force''s geokinesis due to being a force of nature unto himself) Same Powers and
    Resistances as Matt Hagen, Preston Payne and Sondra Fuller due to having their blood extracts injected
    into himBatman Vol 1 #550 Same powers as before *Electricity Manipulation (Due to absorbing the properties
    of deep quartz has gained to power of piezoelectricity which allows him the ability to electrocute
    peopleDetective Comics Vol 1 #735) *Heat Manipulation (Can send enough heat into the ground to fuse
    rubble together) *Fire Manipulation (Able to shoot out blasts of fire that can harm Batman as well
    as ignite his whole body with flames) Resistance to *Fire Manipulation (Shown to be unfazed when completely
    set alight on fireBatman: Shadow of the Bat #75) *Electricity Manipulation (Shrugged off being electrocuted)
    *Ice Manipulation (Was able to quickly break of being frozen by Mr. Freeze) For more details and further
    applications of Clayface''s powers, it is suggested to visit this blog.'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
