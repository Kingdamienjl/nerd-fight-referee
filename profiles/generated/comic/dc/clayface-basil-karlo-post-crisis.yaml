- id: claim-weaknesses-9c3580ca
  section: weaknesses
  axis: weakness
  text: 'Extreme cold or heat is good at turning his body''s fluidity into solid, allowing him to be temporarily
    subduedGotham City Sirens #24. Heat up to 1,000 degrees Celsius to his clay core undermines his basic
    cellular structure. Sufficiently powerful sonics is able to disrupt his metabolismArkham Reborn #3.
    Water can melt down his body structureDC Comics Presents: Batman. People that he has absorbed is able
    to be removed through certain poisonous gases. Crowbars are able to trigger PTSD within him, making
    him blind with rageGotham City Sirens #20.'
  source_ids: *id003
