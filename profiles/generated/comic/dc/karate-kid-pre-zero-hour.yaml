- id: claim-weaknesses-2e95f45b
  section: weaknesses
  axis: weakness
  text: "Often portrayed as quite hot-headed and full of himself.Superboy and the Legion of Super-Heroes\
    \ Vol 1 223 The power behind Super-Karate is fully reliant on precision, and even a small mistake\
    \ can completely nullify its effects. Does not feel pain due to his martial arts conditioning, and\
    \ due to this didn't even notice a potentially deadly laser blade wound for several hours, though\
    \ he seems capable of registering more common injuries and this has not been an issue for him in all\
    \ but one issue. Feats: Particularly notable feats are at the top of their list. Show/Hide Skill \u25BE\
    = (Most feats in this category are performed through \"Super-Karate\", Karate Kid's primary fighting\
    \ style, an incredibly powerful version of karate that Armorr is the only living individual to know,\
    \ having inherited it from his master. Reliant on striking weak spots for its most impressive feats,\
    \ these feats highlight Karate Kid's skill, not his physical strength) *The destruction caused by\
    \ Karate Kid's Super-Karate is fully reliant on precision, as even a small mistake can completely\
    \ nullify its effects. *By striking their weak point, destroys chains that were going to crush an\
    \ entire planet. *Slices off the arm of a monster who could harm Supergirl. *Has been able to find\
    \ weak points in virtually every single material he's tried. *Destroys gates built out of a super-tough\
    \ metal, with 30th century armors being far more durable than the 21st's. *Can chop through the armor\
    \ of 30th Century tanks. *Spots the weak point of a diamond cage and uses it to shatter the entire\
    \ thing. *Can cut through very durable alien tendrils with his bare hands. *Split a hollow monument\
    \ precisely down the middle.Superboy Vol 1 198 *Completely obliterates robots.Superboy Vol 1 214 *Kicks\
    \ a large hole through a wall. *Kicks through the pressure-resistant glass of a building at the bottom\
    \ of a deep river. *Finds a weak spot in a forcefield, though he doesn't get the time to strike it.\
    \ *While crying uncontrollably due to tear gas, accurately throws a poorly balanced ornamental shield\
    \ like a throwing star with enough precision to cut a rope.Karate Kid Vol 1 7 *In the heat of the\
    \ moment, splits a rock with such precision that both halves are sent flying into two different enemies'\
    \ faces.Adventure Comics Vol 1 361 *Crafts a dagger out of stone with his bare hands. *Carves a mural,\
    \ seemingly with his bare fingers. *Cuts down multiple trees with a single chop. *Can throw simultaneous\
    \ kicks and punches with no loss of precision. *Punches a column so that a section of it flies against\
    \ a stronger foe, knocking him out. *Climbs a wall by punching and kicking footholds into it.Karate\
    \ Kid Vol 1 11 *Val is a master of all forms of combat in the galaxy, including even the most mundane\
    \ such as brawling as well as armed martial arts, having trained in the usage of every single close\
    \ combat weapon. **Very capable of using weapons in combat, but typically chooses not to as they are\
    \ only a sideline to his super-karate, and the Legion of Super-Heroes forbids weapon usage. **Learns\
    \ fighting styles incredibly quickly, and trains for any specific combat situation, such as fighting\
    \ foes in heavy armor. **Has adapted certain moves to use them in conjunction with his Flight Ring.\
    \ **As he has studied martial arts of various worlds and cultures, Karate Kid's techniques are just\
    \ as effective against inhuman foes. *While confused and amnesiac, recognizes Batman's fighting style\
    \ instinctually. *Still confused and amnesiac, analyzes the injuries he's inflicted on Batman thoroughly.\
    \ *Helps the Legion fend off an army of aliens. *Defeats five goons surrounding him in a single motion.\
    \ *Highly proficient in the ninja arts of stealth. *When facing a foe unaffected by his blows due\
    \ to rubber-like composition, Karate Kid is able to bypass that by striking with a weapon.Adventure\
    \ Comics Vol 1 363 *After being injured, dodges an attack on pure instinct. *Fights an equally skilled,\
    \ armed and armored samurai with nothing but a barbell shaft. *Analyzes a foe's skill in the span\
    \ of a few seconds. *Spots a supernatural foe's weak point. *Pressure Points **Stops a car by hitting\
    \ it with a Super-Karate chop, despite seemingly not causing much damage. **Knocks out an alien mastodon\
    \ with a Super-Karate chop. **Knocks out Ultra Boy with a hit to the neck.Superboy Vol 1 205 **Karate\
    \ Kid and Robin paralyze a diamond foe with a joint pressure point attack. *Shockwaves **Through sheer\
    \ instinct, causes a shockwave powerful enough to negate another that would have destroyed Manhattan,\
    \ and destroys a tall building with the remaining energy. **Can cause an entire street to shake with\
    \ enough strength to cause others to fall over by stomping down on the ground. **Rescues Princess\
    \ Projectra from a hostage situation by collapsing the ground under her with a precise shockwave.Legion\
    \ of Super-Heroes Vol 3 31 *Holds **Lobakh-III Hold: A hold originally developed to allow normal police\
    \ to restrain super-villains. Karate Kid used it"
