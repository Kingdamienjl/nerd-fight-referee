  intelligence:
    text: 'At least Gifted. Val Armorr is a very clever individual who often acts as the Legion''s mission
      command and leader.Action Comics Vol 1 387 His intelligence manifests in many other fields other
      than his excellence in martial arts, as he is proficient in miscellaneous fine artsAdventure Comics
      Vol 1 362 such as painting, flower-arrangement or mural carving.Legion of Super-Heroes Vol 2 296
      Figured out how to pilot an alien spaceship before it could crash. Has showcased a high degree of
      clever, "on-the-moment" strategic thinking,Legion of Super-Heroes Vol 4 52 often keeping up with
      foes far stronger than him by constantly outwitting and outmaneuvering them, and thanks to his amazing
      self-control attained from martial arts practice, Karate Kid effectively never panics, not even
      briefly, and this cold, rational nature allows him to defeat equally skilled foes.Karate Kid Vol
      1 4 Trains the rest of the Legion in hand to hand combat. Extraordinary Genius. Karate Kid''s martial
      arts prowess is unparalleled through history, having mastered not just all fighting styles of Earth''s
      history, but all known alien ones too. His "Super-Karate" is considered an actual superpower by
      the 30th century''s governments despite effectively being just a highly advanced martial art, and
      so is his ability to find weak spots, which has allowed him to pull off ludicrous feats such as
      causing a shockwave powerful enough to overpower another that would have destroyed Manhattan Island
      or destroying gigantic energy chains that were going to crush an entire planet. Standard Tactics:
      While he is willing to put it aside in moments of extreme need, Val Armorr has a no-kill rule, and
      will as such pull his punches when needed, though he greatly enjoys combat, far more than the average
      superhero. Not above fighting dirty if necessary.'
    source_ids: *id002
