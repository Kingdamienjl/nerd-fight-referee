  attack_potency:
    text: Varies, Town level (Can cause her atoms to forcibly undergo nuclear fission in a suicidal attack,
      dissolving herself into a nuclear explosion capable of wiping out all of Midtown Manhattan according
      to the Never Man) to Universe level+ (The power wielded by Chrysalis is described as divine, and
      as being the greatest force in the Universe by Madame Atom, who planned to utilize it to reshape
      the entire world in another iteration of reality. Easily obliterated Astrolas, a semidivine mechanical
      being tasked with defending the Nameless Planet wherein the Shining Tower resides, and whom the
      Lords of Chaos and Order considered to be a fundamental cosmic force - and later effortlessly remade
      him after obtaining another identity. Far more powerful than Madame Atom, and alongside her managed
      to temporarily defeat Lord Crash, one of the Lords of Order responsible for maintaining the balance
      of reality itself - existing as a part of the cosmic dichotomy through which all universal drama
      unfolds - as well as the endless cycle of death and rebirth to which all of creation is drawn to,
      though their exact connection to it is left unclear. Reformed the parts of creation which she ravaged
      and threw into disarray while attempting to destroy it, becoming a mortal proxy for the Lords of
      Order to directly act upon reality). Up to Low Complex Multiverse level at the height of her power
      (Capable of manipulating her own intrinsic field to the extent of being able to fully affect, and
      eventually merge with, the Shining Tower, the metaphysical fount and pillar of creation which sustains
      and encompasses all of space and time, existing as the axis which the eternal cycle of existence
      revolves around, containing all possible universes which have ever existed and will exist. The Tower
      has additionally been described by the Lords of Order and Chaos to be a fundamental and non-contingent
      aspect of creation, upholding all concepts which exist within it, including the concept of a concept.
      By collapsing it, Caroline was going to obliterate absolutely everything in existence, encompassing
      it in boundless nothingness and leaving not even a void behind)
    source_ids: *id002
    confidence: 0.95
