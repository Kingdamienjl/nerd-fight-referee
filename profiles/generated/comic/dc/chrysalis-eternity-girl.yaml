- id: claim-weaknesses-92a9fe42
  section: weaknesses
  axis: weakness
  text: Became extremely apathetic, depressed and suicidal over the years, actively diving into self-destructive
    habits and searching for ways to end her own life, even being willing to end all of existence and
    destroy entire cities to accomplish this. Her powers are noted to be difficult to properly maintain
    and control, being at risk of going haywire in stressful situations. None Notable after changing her
    identity and leaving her old self behind.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-792ae6f4
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Immortality (Types 1, 2 and 3), Breaking the Fourth Wall
    (Became aware of her own status as a fictional character, existing as nothing but an intellectual
    property free to be utilized and rewritten by the writers, and gained conscience of the several reboots
    undergone by her story over the past decades. Can walk across the blank page itself and physically
    interact with the comic's panels), Enhanced Senses (Can directly see the interactions between individual
    atoms and particles both within herself and in the locations around her, describing everything as
    having no boundaries or distinction in her point of view, with "everything fading into everything"),
    Extrasensory Perception, Acausality (Type 1; Chrysalis exists upon the comic's blank page and was
    unaffected when the continuity reset after Retconn's attempts to erase it were thwarted), Cosmic Awareness,
    Self-Sustenance (Types 1, 2 and 3), Inorganic Physiology (Type 2), Intangibility, Incorporeality (In
    her most basic and primal state, she exists as nothing but a wave function, a self-perpetuating pattern
    of pure form and signals imprinted upon the universe, with Madame Atom stating that reality unfolds
    as if she simply wasn't there), Shapeshifting, Body Control (Has complete dominion over her own atomic
    structure and basic bodily functions, as well as her own intrinsic field in conjunction with those
    of other objects or people, with her influence extending even to completely metaphysical, abstract
    constants such as The Shining Tower. Could morph her own identity by tapping into her own basic nature
    as a wave function, leaving her previous self behind and becoming someone else entirely), Radiation
    Manipulation, Creation, Size Manipulation, Fusionism (Exists as nothing but a sentient intrinsic field
    operating and interacting with other intrinsic fields, which can be expanded and combined to other
    objects in order to merge with them. Was in the process of combining herself to the Shining Tower's
    structure, which is stated to be fully metaphysical and to span all concepts), Elemental Manipulation,
    Matter Manipulation, Portal Creation, True Flight, Energy Manipulation, Transmutation, Light Manipulation,
    Biological Manipulation, Explosion Manipulation, Reality Warping, Telekinesis, Plant Manipulation
    (Made vines sprout out of the ground), Resistance to Plot Manipulation (Has seemingly broken free
    of the narrative itself)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
