- id: claim-powers-and-abilities-6b8ded8d
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery (Could snipe monster dragonflies out of the
    air even while fighting others at the same time.Justice League Dark Vol 1 21 Able to fight through
    entire squads of robots and kill several enemies in a free-fall battle.Young Monsters in Love Vol
    1 1Frankenstein, Agent of S.H.A.D.E. Vol 1 10 Despite being plagued by hallucinations, Frank could
    defeat an elevator full of monsters in seconds.Frankenstein, Agent of S.H.A.D.E. Vol 1 12 Destroyed
    an entire Luftwaffe squadron in five minutesMen of War Vol 2 8), Vehicular Mastery (Defeated several
    Luftwaffe airplanes on his own plane before jumping off), Regeneration (High-Low. Reattached his hand
    after it was cut offThe Phantom Stranger Vol 4 4), Attack Reflection (Frankenstein''s sword can reflect
    attacksJustice League Dark Vol 1 30), Immortality (Type 1, 2, 3 and 7; Able to survive with his head
    and body torn apart, although he cannot regenerate from that level of damage.Justice League Dark Vol
    2 7 Stated he could survive even with his brain completely obliterated and could function even with
    his head removed from the body and dissectedGotham City Monsters Vol 1 6), Supernatural Willpower
    (Was chosen to be a Green Lantern, even over other heroes such as Animal Man, Swamp Thing and Black
    OrchidAnimal Man Vol 2 17), Extrasensory Perception (Could sense the presence of The RotFrankenstein,
    Agent of S.H.A.D.E. Vol 1 9), Limited Surface Scaling (Can climb vertical surfaces such as skyscrapers),
    Acrobatics (Rolled over a bison''s attack. Performed a spinning midair attack with a giant swordFrankenstein,
    Agent of S.H.A.D.E. Vol 1 14Frankenstein, Agent of S.H.A.D.E. Vol 1 15), Biological Manipulation (Frankenstein''s
    blood destroys viruses on contactFrankenstein, Agent of S.H.A.D.E. Vol 1 16), Animal Manipulation
    (Knows a whistle to control some demon monkeysGrayson Vol 1 17), Holy Manipulation (Frankenstein''s
    sword belonged to the Archangel Micheal, and has been used by Zauriel in the past) Energy Projection
    (Has used beam weaponsDark Nights: Death Metal The Last 52: War of the Multiverses), Fire Manipulation
    (Has used a flamethrower), Dimensional Travel and Flight (Can travel between dimensions and fly with
    Cloud-Packs), Illusion Creation (Can project a disguise over himself that makes him look like a normal
    personFrankenstein, Agent of S.H.A.D.E. Vol 1 11), possibly Fear Manipulation (Other S.H.A.D.E. agents
    have used a gun that shows the target their worst fear) Resistance to Empathic Manipulation, Power
    Nullification, Power Modification and Transmutation (Frankenstein''s unique body protected him from
    the effects of Epoch, which completely flips an aspect of everyone''s personality or powersetJustice
    League Dark Vol 1 17Justice League Dark Vol 1 15), Corruption and Empathic Manipulation (Temporarily
    withstood the influence of Pandora''s Box, which instantly drove heroes like Shazam and Wonder Woman
    to violence, and was affecting them even through their presenceJustice League Dark Vol 1 23), Soul
    Manipulation (Doesn''t have a soulGotham City Monsters Vol 1 1), Biological Manipulation (Completely
    immune to The Rot.Animal Man Vol 2 13 Bacteria cannot affect him), Life Manipulation (Immune to Black
    Bombs, which atomize every living being in range), Deconstruction (Survived the gap between extra-dimensions,
    which should have torn him down atom by atom), Fear Manipulation (Frank''s reaction to being forced
    to witness his worst fear, which gave an animal an instantaneous and deadly heart attack, was nothing
    more than mild annoyance), Temperature Manipulation (Wasn''t actually hurt by being flash-frozen,
    though it did immobilize him)'
