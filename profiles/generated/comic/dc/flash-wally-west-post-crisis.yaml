- id: claim-weaknesses-c73435f7
  section: weaknesses
  axis: weakness
  text: 'Various types of energy can affect him even while moving or functioning at superhuman speeds,
    as well as effectively diminish/cut off his connection to the Speed Force. Using the Speed Force excessively
    and recklessly can result in him being permanently trapped in it. He cannot alter the kinetic energy
    of objects that gain their speed from time manipulation. He also needs a massive amount of food to
    compensate for his greatly accelerated metabolism. Feats: * Wally escaped a black hole and outraced
    the explosion of Krypton and Zeta-Beams.The Flash Vol 2 #137 May 1998 *He reset every radio on earth
    in one sextillionth of a second. *He ran to the Heat Death of the Universe to defeat the Black Racer.
    *The Flash Feats Timeline Project'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-c3772610
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Superhuman Speed, Afterimage Creation, Intangibility, Durability
    Negation, Kinetic Energy Manipulation (Speed stealing and lending), Regeneration (High-Low, Can regenerate
    broken bones quickly, but it can be set wrongThe Flash 192), Limited Air Manipulation (Stops a tornado
    by heating up the air at the base of it and creates a cushion of air afterwardsThe Flash Vol 2 #176),
    Can travel through time and across timelines,The Flash Vol 2 #141 Conceptual Manipulation (Type 2,
    Saved his children by taking the Death Aspect of the speed force from themThe Flash Vol 2 #243), Matter
    Manipulation (His aura can control the speed of chemical reactions, and was able to "turn off" a black
    hole by manipulating its epicenterThe Flash Vol 2 #177), Statistics Amplification (Can speed up his
    Cerebral cortex to work at a hundred thousand times its normal speedThe Flash Vol 2 #187), Limited
    Immortality (Type 2, Can keep himself alive through sheer speedThe Flash Vol 2 #109. Type 4 & 8 Powerless
    Bart Allen died in a car crash but still managed to reignite the speedforce back to life, also bringing
    himself back to lifeFlash 2023 #29), Damage Reduction (Flash''s suit is designed to withstand the
    incredible accelerations he often undergoes,Flash Vol 1 136 and absorbs the energy of incoming blowsJLA
    Vol 1 17), Energy Manipulation (Can create a suit of Speed Force energy), Extrasensory Perception
    (Can see cloaked objectsThe Flash Vol 2 #194), Power Bestowal (Can give Speed Force energy to othersThe
    Flash: Rebirth #5), Biological Manipulation (Wally can speed up biological processesThe Flash: Iron
    Heights #1 and accelerate others'' metabolism and healing rate through this), Absorption (Can steal
    kinetic energyThe Flash Vol 2 #199), Paralysis Inducement (Immobilized InertiaAll Flash #1), Explosion
    Manipulation (Anything he phases through explodes), Vibration Manipulation, BFR (Can send something
    to its home dimension with vibrations), Non-Physical Interaction (Can vibrate in a way that allows
    him and things which pass through him to harm normally intangible objectsJLA: Heaven''s Ladder), Data
    Manipulation (Unravelled The Thinker into data), Acausality (Type 1; Was unaffected by the first Crisis
    playing out differently), Instinctive Action Existence Erasure and Death Manipulation (The Black Flash
    couldn''t kill him with a single touch. Tanked the concept of death from the Speed Force. Ran to the
    end of time, where even death ceases to exist on a conceptual level), Antimatter Manipulation (Was
    the sole piece of positive matter in all of existence), Black Hole Creation (Survived in the epicenter
    of a black hole), Power Absorption (His speed was incapable of being stolen.), Mind Manipulation (Thinks
    on a different frequency), Spatial Manipulation and Time Manipulation (Broke out of ambient matter,
    which functions as a 4-D barrier in space and time Was unaffected by Black Flash''s time corruption),
    Illusion Creation and Perception Manipulation (Can break out of and see through illusions), Life Manipulation
    (Easily blocked beams that would have stolen the life of everyone throughout a small portion of time
    and space), Intangibility (Can vibrate Martian Manhunter back to a Solid), Energy Manipulation and
    Electricity Manipulation (Flash''s brain was unaffected by a neural chaff that interfered with Green
    Lantern''s brain electricity), Limited Body Puppetry, and Dimensional Travel'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
