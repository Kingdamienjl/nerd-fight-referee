- id: claim-weaknesses-c59d15d6
  section: weaknesses
  axis: weakness
  text: 'Suffers from an existential crisis Notes: The possibility of upgrading Animal
    Man to Tier 1 has been discussed with regard to the description of (1) the Lifeweb,
    (2) scaling to Antagon (who may have pulled creation into the void), (3) creating
    a universe, as well as (4) the mention of Bohm''s theory of implicate order. However,
    it has been rejected due to the lack of direct evidence for how that information
    would justify a Tier 1 rating, as explained below (1) The Lifeweb is both described
    as containing mirrors that reflect ''higher dimensions'', and that it stretches
    to infinity, this has been theorized to indicate that there are an infinite amount
    of higher dimensions, but since neither the quality (what kind of dimension) nor
    quantity (how many dimensions) of those dimensions is expanded upon, it''s unusable
    for a Tier 1 rating. The Lifeweb ''stretching to infinity'' can refer to just
    a High 3-A scale, and alone isn''t evidence of infinite higher dimensions, as
    it''s perfectly plausible for an structure that stretches to infinity to contain
    a finite amount of higher dimensions. (2) It is unclear how powerful Antagon is,
    due to vagueness in the illustrations and language used to describe him. For this
    reason, scaling is not viable. Further, the full scale of the ''creation'' that
    Antagon would hypothetically be pulling into the void. Within the story it appears
    that the terms ''creation'' and ''universe'' are being used interchangeably, which
    further obfuscates the true scale of the feat. (3) Creating a universe is a powerful
    feat, but is nowhere near Tier 1 without additional evidence explaining what that
    universe entails, which is not provided in the story. This feat was used to justify
    his current tier, but not higher. (4) Bohm''s theory might suggest an effectively
    infinite, but not truly infinite, amount of geospatial dimensions, however, to
    use this for a Tier 1 rating would require considerably more specific in-story
    evidence applying it to DC, rather than just brief mention of Bohm in a single
    comic book, as it''s vastly inconsistent with other descriptions of DC cosmology.
    ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Reflist}}
