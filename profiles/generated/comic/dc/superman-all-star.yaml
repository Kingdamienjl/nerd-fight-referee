    text: Extraordinary Genius (As a Kryptonian, Superman is capable of processing
      and storing information far faster than any ordinary human being is able to.
      Superman has stated that his overexposure to the Sun tripled his intellectual
      capabilities. He is a skilled scientist and inventor, concocting a serum granting
      Kryptonian abilities and matching it with a person by analyzing their entire
      DNA sequence, leaving instructions on how to combined Kryptonian and human strands,
      coming up with a way to cure any human disease, and inventing a machine that
      converts thought into sounds and visuals, a suit that protects him from lethal
      red solar radiation, as well as a time telescope that enables him to speak with
      descendants many centuries into the future. Superman is also highly resourceful
      and quick-thinking, as he was able to build a rocket out of scraps with Zibarro
      in order to escape Bizarro-World. He also possesses remarkable deductive skills,
      answering the unanswerable question and has massive battle experience with all
      kinds of powerful beings. Outsmarted Luthor by using a gravity gun to force
      his metabolism to accelerate, depleting Luthor of his serum. Is destined to
      complete 12 super challenges, with his final challenge to repair the Sun and
      build an artificial heart for it)
