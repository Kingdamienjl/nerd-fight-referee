      \ level with Venom (Effortlessly broke Killer Croc\u2019s arm and one-shot him with a kick.Batman\
      \ Vol. 1 #489, February 1993 PhysicallyDetective Comics Vol. 1 #666, September 1993 superior to\
      \ Azrael. Stated to hit as hard as a Venom-amped Bird, who cracked Azrael\u2019s ribsAzrael #37,\
      \ January 1998)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "Superhuman movement speed (Hourman stated that normal humans can\u2019t move at speeds like\
      \ Bane). At least Supersonic+, possibly Hypersonic+ combat speed (Comparable to Batman and has fought\
      \ him multiple times. Dodged a kick from Azrael while injured. Easily caught a kick from Nightwing)"
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'At least Class 1, possibly Class 5 (Had an evenly matched grapple with BatmanBatman: Gotham
      Knights #35, January 2003), higher with Venom (Much stronger than his base self)'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Small Building level+ (Comparable to Batman and stronger than Nightwing), Building level with
      Venom (Much stronger than his base self. Superior to Azrael)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Small Building level+ (Can take hits from Batman. Tanked a kick from Nightwing), Building level
      with Venom (More durable than before. Took attacks from Azrael)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: "Superhuman (During his time in Pe\xF1a Duro, he did intense exercises every day: a thousand\
      \ push-ups, sit-ups and pull-ups and meditation for four hours instead of sleeping. He could continue\
      \ fighting despite taking several hits, stabs and slashes, he literally ignored having Batarangs\
      \ shot into his back and still survived being beaten down by Azrael. While in Blackgate Penitentiary,\
      \ he ran twenty miles every day for six months and swam through a thirty-knot current with no problem.\
      \ Escaped a prison hundreds of feet below the surface without showing signs of fatigue. Easily climbed\
      \ up a cliff in the middle of a hurricane with 120 mph windsAzrael #38, February 1998)"
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, Hundreds of Meters with firearms
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: "Genius. Bane was able to go from being illiterate to reading three books a day and learning\
      \ how to read in six languages. He read all of the books in the Pe\xF1a Duro library, of which there\
      \ were thousands, and read many more books that were smuggled in to him. He was able to single-handedly\
      \ deduce that Bruce Wayne was Batman. He is a master strategist and a student of every military\
      \ leader and conqueror in history. He was able to recognize a chess play even though he\u2019d never\
      \ seen a chessboard before,Batman: Bane of the Demon #2, April 1998 and merely a day later, he was\
      \ challenging Ra\u2019s Al Ghul in a game of chess.Batman: Bane of the Demon #3, May 1998 Ra's Al\
      \ Ghul regarded Bane as an equal to the greatest minds that he\u2019d ever known. He is also a skilled\
      \ chemist that could recreate Venom with only a little bit of help. Standard Tactics: Prior to and\
      \ during Knightfall, Bane rarely ever fought without Venom, but after Knightfall, he would never\
      \ use it. He is almost exclusively a hand-to-hand fighter that occasionally makes use of guns."
    source_ids: *id002
    confidence: 0.95
