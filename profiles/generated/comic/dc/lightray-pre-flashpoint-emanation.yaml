  section: abilities
  axis: hax
  text: '*New God Physiology * All abilities granted by his Mother Box * Superhuman Physical Characteristics
    * Genius Intelligence * Immortality (Type 1, 4 - When gods die, they return to the Source, but sometimes
    have the power to escape it and return to life.) * Self-Sustenance (Type 1) * Enhanced Vision (Can
    see the entire electromagnetic spectrum) * Enhanced Hearing (States he would have heard Orion''s cry
    from across the galaxy) * Extrasensory Perception (Is in tune with all sources of energy and can detect
    anything registered by his sensitized photons) * Energy Projection and Light Manipulation (Can generate
    and control light beams, omnidirectional bursts, and shape light into constructs. Can blind enemies
    by covering their pupils with light) * Elemental Intangibility (Can phase by turning into light) *
    Aura (Can coat himself in light energy to increase his striking power) * Energy Manipulation (Can
    transmute harmful energy into harmless light. Intercepted an energy discharge and channeled it into
    Orion) * Matter Manipulation and Biological Manipulation (Using his light to manipulate atoms, Lightray
    can devolve living beings into basic life forms) * Heat Manipulation (Can absorb heat) * Fire Manipulation
    (Can channel the heat of suns to surround himself in fire, shoot fire blasts, as well as control external
    sources of fire) * Creation (Exploded debris into a new star) * Invisibility (Can fool even powerful
    sensors by turning invisible) * Illusion Creation (Can use light to make illusions) Resistance to:
    * Mind Manipulation (Amazing Grace''s mind control failed to work on him) * Life Force Absorption
    (Survived the Morrow Block''s planetary-scale life drain) * Extreme Cold and Cosmic Radiation (Can
    fly in space unharmed) |-'
