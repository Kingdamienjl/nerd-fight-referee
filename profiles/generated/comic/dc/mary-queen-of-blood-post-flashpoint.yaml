- id: claim-powers-and-abilities-4b8669b6
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Regeneration (Low-Mid) and Immortality (Type 1, 3, 7 and
    8, The only way a vampire of Mary''s age can die is if she or her love choose toI, Vampire Vol 1 3.
    After being petrified and shattered by Andrew, she healed in a few secondsI, Vampire Vol 1 10), Transformation
    (Vampires can turn into mist, wolves, bats and werevolvesI, Vampire Vol 1 1), Flight (By turning into
    mist, she can easily move across long distances. She can also fly in her vampire form, as shown hereI,
    Vampire Vol 1 11), Cloth Manipulation (Can control the clothing she wears with enough precision and
    strength to block a thrown swordI, Vampire Vol 1 2), Power Bestowal & Corruption (Vampires can convert
    others through a bite,I, Vampire Vol 1 0 with the newly turned often becoming subservient to their
    sireI, Vampire Vol 1 6), Martial Arts and Weapon Mastery (Has fought evenly with Andrew many times
    in the past), Weapon Creation (Can summon weapons of various sorts out of nothing), Mind Manipulation
    (Vampires are capable of performing hypnosisI, Vampire Vol 1 5), Extrasensory Perception (Has a psychic
    connection with her progeny. Can also sense who the sire of other vampires is), Social Influencing
    (Vampires like Mary are incredibly charismatic, to the point of being able to convert foes into allies
    in minutes and turn experiences that should have been traumatic into treasured onesI, Vampire Vol
    1 14), Sleep Manipulation (Can knock out others with her mist formI, Vampire Vol 1 4), Enhanced Senses
    (Vampires can feel molecular disturbances in the air and pheromonesI, Vampire Vol 1 13. Can smell
    magicTrinity of Sin: Pandora Vol 1 13), Regeneration Negation (Mid, prevented amped vampires from
    growing back their headsI, Vampire Vol 1 7), Stealth Mastery (Vampires are naturally hard to notice,
    as they do not breathe or have a heartbeatTrinity of Sin: Pandora Vol 1 14), Self-Sustenance (Type
    1, doesn''t breathe)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
