  section: weaknesses
  axis: weakness
  text: 'Vampires are weakened by sunlight and holy water, although those have much less effect on her
    than the normal vampire, to the point that even anti-vampire equipment designed by Batman barely affects
    those at her level. Killing a vampire''s sire within the first 72 hours lifts the curse, turning them
    human again. Notes: Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics'
