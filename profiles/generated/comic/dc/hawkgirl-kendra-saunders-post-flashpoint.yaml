  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery (Possesses the skills of many of her previous
    lives, as well as her own. Also skilled in the usage of gunsDark Nights: Metal Ch 4), Acrobatics (Even
    without the empowerment of Nth Metal, she could easily perform acrobatic jumps in the middle of intense
    fights), Vehicular Mastery (Piloted a ship when sunk to microscopic sizes to protect Martian Manhunter''s
    nervous systemJustice League Vol 4 3), Flight and Spaceflight (Shown hereJustice League Vol 4 65),
    Energy Manipulation and Absorption (Nth Metal works by conducting mystical energyDark Days: The Forge.
    It can absorb energy attacks and be used to strike back with the same powerDark Nights: Metal Ch 5),
    Regeneration (Low-Mid. Carter Hall''s body heals faster thanks to the Nth Metal''s properties, quickly
    healing all wounds he''d suffered at the hands of Hawkwoman, and Kendra should share this ability
    as it is bestowed by his Nth MetalHawkman Vol 5 19), Vibration Manipulation (Nth Metal can cause shockwaves
    when clashing with other Nth MetalHawkman Vol 5 27), limited Physics Manipulation (Structures built
    of Nth Metal are said to defy the laws of physicsJustice League Vol 4 14), Non-Physical Interaction
    (Nth Metal can hurt ghostsBatman Eternal 24), Invulnerability Negation (Nth Metal is one of the only
    things that can nullify the invulnerability of Dark Multiverse beingsDark Nights: Metal Ch 3), Regeneration
    Nullification (High-Mid. The Nth metal prevented some alien creatures from regenerating, whereas previously
    they could grow back from just a detached head.Savage Hawkman Vol 1 1 This nullification happens on
    the cellular levelSavage Hawkman Vol 1 2), Limited Power Nullification (Nth Metal caused Morphicius''
    teleportation to fail, and then he used it to hinder Katar''s flight abilities. It also cancelled
    a century-long spellSavage Hawkman Vol 1 6), Limited Empowerment (The Nth Metal armor allowed Katar
    Hol to fight even when he''d otherwise collapse.Savage Hawkman Vol 1 10 It is also the source of Hawkgirl''s
    superhuman strength), Resistance to Poison Manipulation, Mind Manipulation and Morality Manipulation
    (Hawkgirl overcame a dose of Joker''s venom.Justice League Vol 4 6 Carter''s Nth Armor slowed down
    the effect of The Batman Who Laughs''s venom meant to turn him evilHawkman Vol 5 20 by suppressing
    his consciousness in favor of Sky Tyrant''sHawkman Vol 5 21 and eventually overpowered itHawkman Vol
    5 23), Disease Manipulation (Former incarnations of Hawkgirl as well as Hawkman''s were immune to
    the plague), Life Manipulation and Absorption (Absorbing Hawkgirl''s life essence is painful and difficult
    because of the Nth Metal''s properties. Also, each of the many reincarnations she lived through resides
    within her, and will be affected before he isHawkman Vol 5 26), Telepathy and Mind Manipulation (Was
    trained by Martian Manhunter to resist mental attacksJustice League Vol 4 56)'
  source_ids: *id003
  decisive: true
  status: unverified
