  axis: hax
  text: Superhuman Physical Characteristics, Master Hand-to-Hand Combatant, Genius Intelligence, Telepathy,
    Flight via Gravity Manipulation (Capable of levitating through manipulating gravity fields), Duplication
    (Can create holographic duplicates of himself), Invisibility (Via cloaking technology), Paralysis
