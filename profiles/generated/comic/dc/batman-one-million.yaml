- id: claim-weaknesses-05fb0afd
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attack/Techniques: *Batarangs: Just like the original, he wields boomerangs
    shaped like a bat. He has been seen with explosive and electric varieties. *Data-rangs: Similar to
    batarangs. However, instead of offense, these gadgets are used for tracking. They home in on targets,
    following them before phasing right through them with no harm. Instead, the data-rangs mark their
    genetic code, allowing Batman to always find them afterwards. *Circuit Buster: A multi-purpose tool
    capable of cutting through various materials, disabling security systems, starting up vehicles and
    trapping others in tesseract space. *Hard-Light Avatars: Batman can create avatars that retain his
    personality and intelligence, effectively allowing him to be in multiple places at once. While he
    goes to deal with other matters, the avatar can devote time and attention to solving other problems.
    *Telepathic Martial Arts: An attack developed by an alien species and learned by Batman. Its beam
    that attacks the target both physically and mentally, stunning their mind before striking their body.
    *Soul Technology: A small device that allows Batman to extract the psychoelectric field or soul of
    a person from their body. Note: Before making any changes to this page, please read and follow the
    Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
