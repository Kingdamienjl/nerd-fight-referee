- id: claim-powers-and-abilities-b135cf7d
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts (Could defeat much stronger foes when weakened),
    Natural Weaponry (Has sharp clawsHellblazer Ch 6), Animal Manipulation, Life Manipulation and Non-Physical
    Interaction (Can create hell-hounds who can see and hurt astral projectionsHellblazer Ch 10), Enhanced
