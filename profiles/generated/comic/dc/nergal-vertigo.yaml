    Can eat souls.Swamp Thing Vol 2 96 Can taste souls and determine things such as their ancestry and
    even their emotional qualities.Swamp Thing Vol 2 97 Immediately knew that a woman was dead upon seeing
    herHellblazer Ch 205), Life Manipulation and Necromancy (Fused together a group of skinheads into
    a monster), Transformation (Can take the appearance of a normal humanHellblazer Ch 8 as well as more
    monstrous onesHellblazer Ch 11), Elasticity (His tongue can stretch to great lengths), Power Bestowal,
    Healing and Disease Manipulation (With his blood), Transmutation (Could transform a pot of flowers
    into a glass orb), Possession (Possessed a little kid), Dimensional Travel (Brought a young girl and
    Constantine to Hell), Extrasensory Perception (Can feel people''s presence, even when they are in
    different realmsHellblazer Ch 12), Flight (Can sprout wings), Plant Manipulation (Can control Hell''s
    plantsSwamp Thing Vol 2 98), Supernatural Willpower (Endured ten thousand years of torture in Hell
    before becoming a demonHellblazer Ch 60), Precognition (Seemingly already knew he would come to deal
    with Constantine when the latter was just a childVertigo Secret Files: Hellblazer), Technology Manipulation
    (Made a car still work after it ran out of gas), Fire Manipulation and Vibration Manipulation (Manipulated
    the path of an explosion to protect Chas ChandlerHellblazer Ch 203), Healing (Restored a woman''s
    body to its default state after she was strangledHellblazer Ch 206), Empathic Manipulation (Being
    possessed by him cause Chas to become far more bitter and aggressive, bringing out all the bad parts
    of him to the surface), Absorption and Power Bestowal (Can drain others'' strength as he possesses
    themHellblazer Ch 207 or give it to themHellblazer Ch 208), Blood Manipulation (Kept a dead woman''s
    blood liquid for several hours), Soul Manipulation and Purification (Destroyed various wrathful spirits
    with a single sentence), Regeneration (High-Mid. Regenerated from a single speck of flesh), Perception
    Manipulation (Clouded the minds of some demonic guards), Preparation (His castle contains various
    hidden walkways only he knows of), Telekinesis (Lifted a man with magicHellblazer Ch 275), Energy
    Projection (Shown here), Extrasensory Perception (The Demon Blood senses evilHellblazer Ch 92), minor
    Blood Manipulation (John''s Demon Blood appears to subconsciously follow his wishes, coagulating to
    prevent the reattachment of his thumb after he cut it off in a crazed state.Hellblazer Ch 268 As the
    donor of it, Nergal should at least gave this much control over it), Poison Manipulation (Demon Blood
    is lethal if drankHellblazer Ch 69), Invulnerability and Resistance to Magic (Took over the body of
    his brother Stercorax,Hellblazer Ch 211 which cannot be pierced by any weapon or magic known to HellHellblazer
    Ch 209), Inorganic Physiology and Resistance to Biological Manipulation (Demons are not made of things
    such as cells and enzymes, but particles modern science cannot identifyHellblazer Ch 41)'
