- id: claim-powers-and-abilities-29e08d1f
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Regeneration (Low-Godly) and Immortality (Type 1, 3 and
    7: Has the same powers as Andrew who, after his body was taken over by Cain, reformed out of random
    debrisJustice League Dark Vol 1 8. Cain himself reformed out of dust after being killed, with it seemingly
    not being the dust of his own bodyI, Vampire Vol 1 8), Transformation (Vampires can turn into mist,
    wolves, bats and werewolvesI, Vampire Vol 1 1), Flight (Can hover normally or fly by turning into
    bats or mist), Cloth Manipulation (Much more powerful than Mary, who can control the clothing she
    wears with enough precision and strength to block a thrown swordI, Vampire Vol 1 2), Power Bestowal
    & Corruption (Vampires can convert others through a bite,I, Vampire Vol 1 0 with the newly turned
    often becoming subservient to their sireI, Vampire Vol 1 6), Martial Arts (Brawled with Andrew evenly),
    Weapon Creation (Can summon weapons of various sorts out of nothingI, Vampire Vol 1 3), Extrasensory
    Perception (Has a psychic connection with his progeny. Can also sense who the sire of other vampires
    isI, Vampire Vol 1 6), Social Influencing (Vampires like Cain are incredibly charismatic, to the point
    of being able to convert foes into allies in minutes and turn experiences that should have been traumatic
    into treasured onesI, Vampire Vol 1 14), Sleep Manipulation (Can knock out others with his mist formI,
    Vampire Vol 1 4), Enhanced Senses (Vampires can feel molecular disturbances in the air and pheromonesI,
    Vampire Vol 1 13. Can smell magicTrinity of Sin: Pandora Vol 1 13), Power Nullification, Regeneration,
    (Mid, far superior to Mary who prevented Cain''s vampires from growing back their heads), Stealth
    Mastery (Vampires are naturally hard to notice, as they do not breathe or have a heartbeatTrinity
    of Sin: Pandora Vol 1 14), Self-Sustenance (Type 1, doesn''t breathe), Magic, Absorption (Cancelled
    Constantine''s attempts at forming a magic seal. Passively drained the magic of nearby magicians such
    as ZatannaJustice League Dark Vol 1 7), Earth Manipulation (Can control dust), Deconstruction, Mind
    Manipulation (Andrew turned Cain''s vampires to dust and reformed them under his control), Energy
    Projection (Can fire blasts of energy, even AOE onesI, Vampire Vol 1 10), Memory Manipulation (Andrew
    wiped Gotham''s memories of the vampire apocalypse), Telekinesis (Andrew magically lifted a vampireI,
    Vampire Vol 1 9), Illusion Creation (Andrew made two people hallucinate their heads blowing up), Air
    Manipulation (Andrew hit Mary with a wind attack when she turned into mist), Petrification (Andrew
    petrified Mary, then shattered her), Forcefield Creation, Attack Reflection, Magic (Andrew can create
    large forcefields by using Zatanna''s backwards magic or just with his Energy Projection, and give
    them reflective propertiesI, Vampire Vol 1 15), Paralysis Inducement (Andrew froze two warring armiesI,
    Vampire Vol 1 11), Absorption (Andrew absorbed the darkness of every vampire nearby, curing themI,
    Vampire Vol 1 12), Empathic Manipulation, Statistics Amplification (Controlled all of Mary''s vampires,
    putting them into a state of bloodlust as well as giving them more strength and regeneration), Extrasensory
    Perception, Soul Manipulation (Sensed the souls inside Andrew and drew them outI, Vampire Vol 1 18)'
  source_ids: *id003
  decisive: true
  status: unverified
