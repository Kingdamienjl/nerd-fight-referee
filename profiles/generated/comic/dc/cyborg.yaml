- id: claim-powers-and-abilities-89c2a6d1
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Cyborgization, Flight, Weapon Creation,
    Technology Manipulation (He is connected to every single computer system on Earth,
    is capable of assimilating new terrestrial, extraterrestrial, or inter-dimensional
    technology with a touch or thought, and has assimilated Kryptonian technology
    as well as the Motherbox Technology of the New Gods that is connected through
    a series of portals and allows him to see into other worlds), Hacking (Can hack
    into and communicate through any technological device with a thought, even Lantern
    Power Rings. Connected to the Grid, a system on databases relating to nearly every
    superhuman on Earth. Took control over the Digital Universe and can analyze the
    entire Internet at once, including all of the Dark Net / Deep Web), Transformation
    (Capable of altering his Cybernetic Body at will to fulfill a variety of functions.
    After evolving, can turn any organic part of his body into machinery and also
    stretch his body beyond its limits), Energy Manipulation, Energy Projection (Energy
    Cannons), Absorption (Can tap into and absorb energy from any technology and power
    source he is connected to), Forcefield Creation (shown here), Ice Manipulation
    (Ice Cannon), Electricity Manipulation (Electric Cannon, Electromagnetic Pulse),
    Sound Manipulation (Can even affect Souls using White Noise Cannon), Regeneration
    (High, can reform destroyed limbs and create new organic body-parts from machinery
    as well as regenerate from practically nothing, capable of regenerating the nanites
    that make up his core structure), Tech-Based Healing (Hacked into the Technosapiens'
    systems and used his Regenerating Protocols to cure everyone on Earth who had
    been infected with their Cyber-Virus), Teleportation (through Boom Tube technology
    and others tubes called Hush Tubes that are silent enough that even Superman cannot
    hear them), Self-Sustenance (Can survive in space, abyssal waters, and without
    food or sleep), Enhanced Senses (Can listen to specific sounds miles away from
    his location)
  source_ids: *id003
  decisive: true
  status: unverified
