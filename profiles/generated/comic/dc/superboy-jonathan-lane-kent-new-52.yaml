    to the naked eye by manipulating light), Forcefield Creation (As shown here), Power Absorption and
    Life Absorption (As shown here. His power absorption is far better than Parasite), Time-Space Manipulation,
    Pocket Reality Manipulation (Due to traveling multiple times through time, his body now produces tachyon
    particles which feeds the universe itself. And because of that, Kon was kicked out of the universe
    by the universe itself as it was not sure how to contain him. Outside, he and Kon - whose body also
    produces tachyon energies - merged and their union was a catalyst that created a new mini/pocket universe.Superboy
    Vol 6 33Superboy Vol 6 34 However, Jon did almost all the work. When current Jon met his slightly
    earlier version, their touch - as well as the union between Kon and Jon, created a temporal shell
    around the N.O.W.H.E.R.E. facility, and created a new mini universe - in which countless Superboys
    from across the multiverse pouring into it. At the end, Jon killed his other self and destroyed the
    new reality, as well as the time barrier/temporal loop that was covering the facility.), Acausality
    (Type 3; Two versions, likely more, of Jon exists at the same time. One was brought back to the present
    by Harvest at an earlier point in time, and the other was slightly at a later time. While the two
    are the exact same, they had slightly different experiences, but ultimately, they are one and the
    same.), Energy Projection (As shown here), and Fusionism (Merged with Kon and other Jon). Resistance
    to Power Absorption (As shown here). All previous which has been enhanced greatly, plus; Multiple
    Selves (Type 1; there are three people inside one body), Incorporeality and Inorganic Physiology (Type
    1; is made of energy), Reality Warping (Can freely warp the reality of their new universe, As shown
    here). All previous, which has been enhanced,Jon without the limits of his human conscious and morality,
    and also not weakened by other external factors like normal Jon was, and as such, his abilities are
    far greater in comparison to the usual Jon. plus; Body Control and Elasticity (As shown here), Death
    Manipulation (As shown here), Darkness Manipulation (Has dark tendrils around him), Mind Manipulation
    (Broke apart their fusion. Mind controlled countless Superboyswho fought on his behalf like an army),
    Hive Mind (Type 1; As shown and explained here), Forcefield Creation (As shown here), Power Absorption,
    Absorption and Energy Manipulation (Used the Green Lantern ring to tap into a primal force of the
    universe and started draining it).
