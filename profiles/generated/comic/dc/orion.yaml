- id: claim-powers-and-abilities-ffa11c67
  section: abilities
  axis: hax
  text: 'Pre-Flashpoint Emanation= *New God Physiology * All abilities granted by his Mother Box * Superhuman
    Physical Characteristics * Genius Intelligence * Martial Arts (The finest warrior of New Genesis;
    Used superior skill to stomp Kalibak despite their equal physical strength) * Enhanced Senses (Can
    maneuver perfectly well without eyes by using his other senses and Mother Box) * Immortality (Type
    1, 4 - When gods die, they return to the Source, but sometimes have the power to escape it and return
    to life. Type 9 - the true Orion exists in a higher plane of reality) * Self-Sustenance (Type 1) *
    Flight * Regeneration (Mid on his own - Possesses a healing factor that quickly healed a damaged brain
    and organs; High using Mother Box) * Gravity Manipulation and Energy Manipulation (The Astro-Force
    controls the fundamental forces) * Energy Projection (Can channel the Astro-Force into both omnidirectional
    and focused blasts; Can also fire blasts from his hands without the Astro-Harness) * Danmaku (Can
    fire barrages of smaller Astro-Force blasts) * Forcefield Creation (Made a shield against Kalibak''s
    beam) * Attack Reflection (Can reflect energy attacks with a shield of Astro-Force) * Deconstruction
    (Disintegrated Slig by removing the binding force between his atoms) * Aura (Can enhance his physical
    attacks by cloaking himself in energy) * Magnetism Manipulation (Can telekinetically move massive
    objects by using Astro-Force to create a magna-lock) * Summoning (Can instantly summon his Mother
    Box as well as his dog Sturmer) * Spatial Manipulation (Contained the Oblivion Bomb which would have
    instantly collapsed all of space itself into a massive black hole; Sealed tears in reality) * Time
    Travel (Stated that any god can easily move through time) * Limited Reality Warping (Used the Astro-Force
    to reverse the reality warping caused by Darkseid''s attack on the Source) * Reactive Evolution (Adjusted
    to the Anti-Life fragment''s energy used by Darkseid so that it no longer effected him) * Instinctive
    Reaction (Defeated a squad of soldiers while unconscious, moving via instinct) * Astral Projection
    (Can project his face across the sky) * Body Control (Can grow claws when accessing his true power)
    Resistance to: * Life Drain (Unaffected by the Morrow Block''s planetary-scale life drain) * Reality
    Warping (Unaffected by the reality warping caused by Darkseid''s attack on the Source) * Existence
    Erasure (Resisted Darkseid''s Omega Beams) * Biological Manipulation (Slig could only superficially
    transform Orion with his mutating power) * Pain Manipulation (Used the Astro-Force to smother some
    of the effects of the Nerve Beam) * Telepathy (Martian Manhunter stated New Gods are hard to touch
    telepathically) * Fear Manipulation (Trained to resist all degrees of fear, such as Desaad''s fear
    machine) * Empathic Manipulation (Resisted Desaad''s spirit-breaking machine) * Electricity Manipulation
    (Resisted Mantis'' electric touch) * Illusion Creation (Dispelled Desaad''s disguise with a touch)
    * Extreme Cold and Cosmic Radiation (Can fly in space unharmed) With the Anti-Life Equation: * Power
    Bestowal (Bestowed his Anti-Life voice on Gedirath) * Resurrection (Returned Desaad to life) * Mind
    Manipulation * Empathic Manipulation * Soul Manipulation * Morality Manipulation (Put the entire world,
    including strong telepaths like Martian Manhunter, under his complete control, enslaving their souls)
    |-|Post-Flashpoint Emanation= *New God Physiology * Superhuman Physical Characteristics * Immortality
    (Type 1) * Self-Sustenance (Types 1 and 2Earth 2 Vol 1 Issue 8) * Flight * Energy Projection (Can
    fire blasts of Astro-ForceHal Jordan And The Green Lantern Corps Vol 1 Issue 48) * Portal Creation
    and Dimensional Travel (Can summon boom tubesHal Jordan And The Green Lantern Corps Vol 1 Issue 47)
    * BFR (Boom tubes can be used to banish targetsGreen Lantern New Gods: Godhead Issue 4) Resistance
    to: * Disease Manipulation (New God physiology makes them immune to diseaseGreen Lantern New Gods:
    Godhead Issue 16) |-|Godhead= All previous abilities to a much greater degree, plus: * Abstract Existence
    (Type 1 - New Gods are living ideas from a platonic, archetypal worldBatman Issue 702) * Self-Sustenance
    (Type 3) * Incorporeality * Large Size (Type 9 - Comparable in size to Godhead Darkseid, who was large
    enough to fall over the entire multiverseDC Universe 2008 Issue 0)'
