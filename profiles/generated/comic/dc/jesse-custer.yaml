  intelligence:
    text: Gifted (A former preacher, Jesse received a scholarly education through
      his mother and father and has extensive knowledge of the Bible. He was also
      taught how to effectively use most firearms and is an exceptional brawler due
      to his years with the psychotic gangster Jody, skills that have served him well
      against even supernatural foes, being able to follow and punch out vampires
      in close combat. He can also obtain additional information about his opponent
      by consulting Genesis. However, due to his mother's influence, he refuses to
      use the Word of God unless he has to, saving it as a last resort to prevent
      himself from relying on its power. By the end of the series, he created an elaborate
      plan where he manipulated the Saint of Killers that resulted in the death of
      God and the Heavenly Host.)
    source_ids:
    - vsbattles-jesse-custer-dc-comics
    confidence: 0.6
