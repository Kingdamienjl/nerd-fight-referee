- id: claim-powers-and-abilities-5e39fa6b
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Abstract Existence (Type 2. Mister Dark is the embodiment
    of all that is dark and evil, "the darkness that can never be entirely eliminated from any world"),
    Immortality (Types 1, 4, 6 and 8. As a fundamental force of existence, creation will not allow his
    loss, and even if killed his dark spirit simply manifests in a new host), likely Pain Manipulation(scaling
    to his reincarnation Leigh Douglas, who was able to inflict Bigby with pain), Enhanced Senses (Detected
    a Fable bird from far below it, sensed the North Wind through his invisibility. A wizard who likely
    scales far below Mister Dark was capable of sensing that there was not a single atom left of Bigby
    Wolf), likely Extrasensory Perception (can likely see patterns of magic and spells, scaling to Leigh
    Douglas, who was became his reincarnation, and to the North Wind, another Great Power who could perceive
    the mystical energies surrounding Rose Red), Nigh-Omnipresence (his true nature is the darkness in
    every universe throughout Fables, the North Wind - another Great Power - was present in every snowflake
    and every gust of wind in every world), possibly Duplication (scaling to the North Wind, who was capable
    of manifesting multiple - possibly infinite - bodies in different locations), Resistance Negation
    (Can use his victim's fear as a conduit for his spells to bypass any defenses they have), likely Soul
    Manipulation (his darkness was described as touching everyone's souls, likely similar to the North
    Wind who's wind "chills body and soul"), Dimensional Travel and Teleportation (Rode his horse between
    worlds, likely has the powers of the Witching Cloak which allows its wielder to teleport between worlds),
    Power Nullification (Used an Unravelling spell that nullified the powers of the Witching Cloak and
    the majority of spells within Fabletown, the effects of which included mind manipulation, sealing,
    statistics amplification or telekinesis, and spatial manipulation, and were created by extremely powerful
    and skilled spellcasters. Can likely block and deceive Clairvoyance, as Leigh Douglas - who learnt
    from him and became his reincarnation - was able to block and give a false reading to witches' tracking
    and detection spells), Darkness Manipulation (His presence alone brings darkness, plunging New York
    into eternal night and darkening Haven's borders), Summoning (Can summon sentient shadows to attack
    his victims, can summon his horse), Necromancy (Can summon "Witherlings", corpses of those who have
    died, using their teeth), Mind Manipulation (Can control minds, his arrival on earth awakened the
    inherent evil within all people, lessening self-control and increasing anger. Made a police officer
    admit he was sleeping with his partner's wife, which resulted in the partner shooting the officer
    and then himself. His presence makes people give into their darker impulses), Perception Manipulation
    (Made a massive castle in the middle of New York not be noticed by any mundane people), Transformation
    (Can change his horse into a car), BFR (Can trap people in his Bag of Endless Nightmares and Infinite
    Screams), Shapeshifting (Scaling to the Witching Cloak, which allows its user to shapeshift into other
    animals and people. Can alter his shape to transform his hands into large blades or himself into a
    snakelike monster), Invisibility (Scaling to the Witching Cloak, which allows its wielder to turn
    invisible), Paralysis (Passively froze the two treasure hunters who released him), Matter Manipulation
    (Passively caused the two treasure hunters who released him to decay to skeletons. Decayed Kay with
    a touch. Decayed a bird flying overhead with a gesture. Likely scales to the Witching Well that completely
    destroys that which falls in it, leaving behind only ghosts. His reincarnation Leigh Douglas caused
    Bellflower's knife to disintegrate with a bolt of black energy), Absorption (Scaling to the Witching
    Well which devours that which falls in it), limited Resistance to Sealing (Even while sealed, his
    darkness still seeped out and his power still influenced every world. Broke free of his gold containment
    statue), Resistance to Fear Manipulation (He is fear, and is immune to himself), and therefore likely
    Resistance to Darkness Manipulation, certain forms of Empathic Manipulation, and Decay
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
