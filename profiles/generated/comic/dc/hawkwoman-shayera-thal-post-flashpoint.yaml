- id: claim-powers-and-abilities-5462500e
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Genius Intelligence, Weapon Mastery and Martial Arts (Comparable
    to Hawkman in sheer skill, Shayera is an incredibly effective fighter with thousands of lifetimes
    of experiences behind her. She easily defeated Sky Tyrant, the evil Hawkman of Earth-3, without even
    going all out. She''s also very resourceful and quick-thinking, showing this trait when she rapidly
    thought to use her helm as a weapon when nothing else was availableHawkman Vol 5 25. Easily defeated
    Vandal Savage.Hawkman Vol 5 27 Thanagarians are a species naturally inclined to battleThe Savage Hawkman
    Vol 1 19) Energy Projection (Has access to a whole stock of Thanagarian energy guns among other weaponsNew
    Talent Showcase Vol 2), limited Telekinesis (Can seemingly recall her mace in her hand like HawkmanHawkman
    Vol 5 18), Acrobatics (Delivered a backflip kick to Sky Tyrant) Longevity (Was able to live to the
    40th Century even after being taken to the 1930''s, without reincarnatingHawkman Vol 5 29), Enhanced
    Senses (Thanagarians can see better than humans), Flight and Spaceflight (Other Hawkwomen and Hawkmen
    have shown this abilityJustice League Vol 4 65), Energy Manipulation and Absorption (Nth Metal works
    by conducting mystical energy.Dark Days: The Forge It can absorb energy attacks and be used to strike
    back with the same powerDark Nights: Metal Ch 5), Regeneration (Low-Mid. Carter Hall''s body heals
    faster thanks to the Nth Metal''s properties, quickly healing all wounds he''d suffered at the hands
    of Hawkwoman, and Shayera shares this ability as it is bestowed by the Nth MetalHawkman Vol 5 19),
    Vibration Manipulation (Nth Metal can cause shockwaves when clashing with other Nth MetalHawkman Vol
    5 27), limited Physics Manipulation (Structures built of Nth Metal are said to defy the laws of physicsJustice
    League Vol 4 14), Non-Physical Interaction (Nth Metal can hurt ghostsBatman Eternal 24), Invulnerability
    Negation (Nth Metal is one of the only things that can nullify the invulnerability of Dark Multiverse
    beingsDark Nights: Metal Ch 3), Regeneration Nullification (High-Mid. The Nth metal prevented some
    alien creatures from regenerating, whereas previously they could grow back from just a detached head.Savage
    Hawkman Vol 1 1 This nullification happens on the cellular levelSavage Hawkman Vol 1 2), Limited Power
    Nullification (Nth Metal caused Morphicius'' teleportation to fail, and then he used it to hinder
    Katar''s flight abilities. It also cancelled a century-long spellSavage Hawkman Vol 1 6), Limited
    Empowerment (The Nth Metal armor allowed Katar Hol to fight even when he''d otherwise collapse.Savage
    Hawkman Vol 1 10 It is also the source of Hawkwoman''s superhuman strength), Illusion Creation (To
    the people of the 1930s, Hawkwoman will have a different physical appearance), Resistance to Poison
    Manipulation, Mind Manipulation and Morality Manipulation (Thanks to her own Nth Metal armor, Hawkgirl
    overcame a dose of Joker''s venom.Justice League Vol 4 6 Carter''s Nth Armor slowed down the effect
    of The Batman Who Laughs''s venom meant to turn him evil,Hawkman Vol 5 20 by suppressing his consciousness
    in favor of Sky Tyrant''s,Hawkman Vol 5 21 and eventually overpowered itHawkman Vol 5 23), Disease
    Manipulation (Former incarnations of Hawkwoman as well as Hawkman''s were immune to the plague), Life
    Manipulation and Absorption (Absorbing Hawkwoman''s life essence is painful and difficult because
    of the Nth Metal''s properties. Also, each of the many reincarnations she lived through resides within
    her, and will be affected before she isHawkman Vol 5 26) All previous abilities minus Illusion Manipulation,
    Resurrection (Shayera has the ability to constantly reincarnate in an endless cycle across time and
    space and even universes,Hawkman Vol 5 7Hawkman Vol 5 5 bound to Hawkman''s oath to save as many lives
    as the ones he once took), limited Precognition (While in the process of reincarnating, Hawkwoman
    can catch glimpses of the future)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
