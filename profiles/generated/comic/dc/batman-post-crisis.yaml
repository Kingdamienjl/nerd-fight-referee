  durability:
    text: Small Building level+ (Bruce was not only trained in various disciplines
      but also ingrained with the vital skill of safeguarding his own body, treating
      self-protection as seriously as any other form of training. This meticulous
      conditioning allows him to endure injuries that would cripple or kill ordinary
      humans. Even with his suit nearly destroyed, [https://imgur.com/a/3q5ZN he survived
      multiple falls after being beaten nearly to death] by Bane. He has withstood
      blows from superhuman opponents such as Clayface on unprotected areas like [https://imgur.com/a/c34GO
      his jaw] and endured severe internal damage while continuing to fight. Despite
      heavy blood loss and exhaustion, Batman routinely [https://imgur.com/a/TymcdJX
      pushes himself to keep fighting until his body gives out]. His endurance further
      extends to resisting explosions and extreme impacts; the Batsuit itself greatly
      enhances his survivability. It has withstood [https://imgur.com/a/FEWkqjM massive
      blasts and collapsing debris], [https://imgur.com/a/sb09n6s explosions that
      obliterate several floors of a building], and [https://imgur.com/a/o1ovvDM direct
      RPG detonations]. Even without armor, Bruce's conditioning allows him to take
      bone-shattering impacts and remain functional.)
    source_ids:
    - vsbattles-batman-post-crisis-dc
    confidence: 0.6
  stamina:
    text: Superhuman (Batman's conditioning grants him exceptional endurance and recovery,
      allowing him to keep fighting under pain, exhaustion, or injury far beyond human
      limits. He has continued battling while poisoned, [https://imgur.com/a/hYPBoB5
      (against Biis after being drugged)], [https://imgur.com/a/RigOM8X severely weakened
      yet defeating Metalhead] and [https://imgur.com/a/XefGtHx Headhunter in succession],
      and [https://imgur.com/a/YVih5kk while doped and bleeding, fought the Riddler
      under the effects of Venom and still won]. Even when exhausted, he [https://imgur.com/a/TymcdJX
      keeps fighting despite blood loss, broken ribs, and internal trauma], and later
      survived being beaten nearly to death by Bane. Batman has fought prolonged battles
      while recovering from a spinal fracture [https://imgur.com/a/qIdGv7n (against
      Jean-Paul Valley)], and continued to fight off assassins while poisoned and
      severely weakened)
    source_ids:
    - vsbattles-batman-post-crisis-dc
    confidence: 0.6
  range:
    text: Standard Melee Range (Physically, Batman's hand-to-hand reach extends roughly
      one meter. He fights primarily using martial arts techniques involving punches,
      kicks, elbows, knees, and grapples against opponents of comparable size), Extended
      Melee Range (Can fight effectively with long melee weapons such as staffs and
      batons, which extend his reach up to two to three meters; commonly uses an [https://imgur.com/a/dUuHEM6
      electrified baton] and similar close-combat tools like escrima sticks.), Several
      Meters (Frequently throws [https://imgur.com/a/pwFZASB explosive Batarangs],
      [https://imgur.com/a/r50qWye flash grenades], and other projectiles such as
      smoke pellets, bolas, and tranquilizer darts, all of which can be accurately
      thrown several meters away.), Tens of Meters (Can precisely hit moving targets
      at considerable range with thrown Batarangs and specialized gadgets, even in
      low visibility conditions; his aim and control allow him to engage multiple
      targets across large open areas), Hundreds of Meters with firearms or advanced
      gadgets (Has used sniper-level grapnel guns, EMP emitters, and long-range surveillance
