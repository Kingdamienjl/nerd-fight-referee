  attack_potency:
    text: "Small Building level+ (Despite often being described as \"powerless\" compared\
      \ to his compatriots; Batman's strength is consistently highlighted throughout\
      \ his stories and qualifies as a [https://imgur.com/a/mpVV2 super-powered entity]\
      \ \u2014 [https://imgur.com/a/uGtT8 performing feats that no ordinary man is\
      \ capable of], such as destroying [https://imgur.com/a/5BFch5u walls] of concrete\
      \ and [https://imgur.com/a/qHIq9oW launching steel doors], but more impressively,\
      \ [https://imgur.com/a/VVsoFyk busting glass said to be capable of withstanding\
      \ a bazooka] and a [https://imgur.com/a/khGUdRR giant door that not even a cruise\
      \ missile could destroy]. Beating groups of trained, peak human characters,\
      \ is barely a challenge to him, as shown by his beating several of the [https://imgur.com/a/FwYMEun\
      \ world's greatest mercenaries while being injured]; [https://imgur.com/a/qcsfSal\
      \ a group of the most well-trained ninjas from the League of Assassins] while\
      \ poisoned; and even his [https://imgur.com/a/39ujqPP rogue gallery] right after\
      \ [https://imgur.com/a/UyAy9YW defeating Amygdala] casually all while holding\
      \ back. Batman is capable of defeating super-human characters like [https://imgur.com/a/1P1qgSX\
      \ Bane with his bare hands] and those who utilize Venom, a drug that increases\
      \ one's strength ten-fold, such as Lex Luthor, [https://imgur.com/a/56Qe7re\
      \ while amplified by Venom and liquid Kryptonite] and Killer Croc, whose already\
      \ superhuman was further bolstered through Venom, but [https://imgur.com/a/MRd1rag\
      \ received a beatdown from Batman all the same]), Unknown with Explosives (Though\
      \ they are treated as being far above himself, their power is wildly inconsistent),\
      \ Low Complex Multiverse level with preparation (Can create armors and robots\
      \ equal or superior to Superman and other members of the Justice League)"
