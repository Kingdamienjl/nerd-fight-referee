  section: weaknesses
  axis: weakness
  text: "Has a rule against killing humans (And other such life, such as Krptonians\
    \ or Martians) and will adhere to it to a fanatical degree even if killing would\
    \ prove an immediate solution, only ever extremely rarely coming close to crossing\
    \ the line, but never completely. Though he doesn't have any issue with killing\
    \ demons or other kind of undead. Notable Attacks/Techniques: *Martial Arts: Batman\
    \ is recognized as one of the greatest martial artists and close-combatants in\
    \ existence, having traveled across the world to master every possible form of\
    \ martial artBatman: Death Mask #1 and trained with the greatest warriors alive\
    \ to become a perfect crime-fighting machine.Batman Allies Secret Files and Origins\
    \ Even Superman has acknowledged him as one of the finest fighters he has ever\
    \ seen,The Batman Chronicles (1995) #7 while Atlantean warriors have stated he\
    \ is the greatest fighter on Earth.Superman/Batman (2003) #45 Nightwing affirmed\
    \ that there isn't a single nerve strike Bruce doesn't know,Batgirl (2000) #29\
    \ and Batman can analyze and adapt to an opponent's fighting style in just two\
    \ minutes.Batman: Gotham Knights #3 He has trained numerous allies, such as Mercy\
    \ Stone,Batman: Legends of the Dark Knight #37 Tim Drake,Robin (1993) #21 and\
    \ even Superman himself.Superman/Batman (2003) Annual #2 Batman mastered multiple\
    \ disciplines \u2014 Karate, Savate, Judo, Jiu-Jitsu, Aikido, Capoeira, Wushu,\
    \ and Wing Chun \u2014 blending them into his own hybrid style.Batman: Shadow\
    \ of the Bat #0Batman Confidential #14 It is stated that he is a master of every\
    \ known martial artJLA: Secret Files #1 and that he was trained in every form\
    \ of violent art, capable of incapacitating a person in 463 ways without drawing\
    \ blood.Batman: The Widening Gyre #4 He is also skilled with nearly every known\
    \ weaponSuperman/Batman (2003) #10 and proficient in Brazilian Jiu-Jitsu.Superman/Batman\
    \ (2003) #53 Batman's precision allows him to recognize fighting styles within\
    \ seconds, such as identifying Catwoman's karate background and defeating herBatman\
    \ (1940) #404 or detecting techniques originating from Kiribati.Detective Comics\
    \ (1937) #828 Having trained his mind and body to the peak of human perfection,52\
    \ (2006) #46 Bruce's discipline pushes human potential to its absolute limit.JLA:\
    \ Welcome to the Working Week His mentors include Wildcat,52 (2006) #23 Kirigi,Secret\
    \ Origins of the World's Greatest Super Heroes Chu Chin Li,Detective Comics (1937)\
    \ #599 Tsunemoto,Detective Comics (1937) #599 Henri Ducard,Secret Origins of the\
