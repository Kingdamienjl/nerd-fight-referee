  attack_potency:
    text: 'Varies (Larfleeze ring contains the entire power of his corps and its power
      depends on how many Orange Lanterns are within his lantern. When Larfleeze returned
      all his Orange Lanterns back into his lantern, his rings power increased to
      7839%, but when many of his Orange Lanterns were resurrected, the remaining
      few were easily destroyed by the Black LanternsGreen Lantern Vol 4 #48. It was
      also stated that the power source Larfleeze wields is at its strongest when
      only one individual mind is mainlined into one individual ringGreen Lantern
      Vol 4 #51), up to Low Complex Multiverse level (The Orange Lanterns released
      from his lantern slaughtered the Controllers who were stated to have once rivaled
      the Guardians of the Universe, and who stated themselves to be just as strong.
      One of his Orange Lantern constructs could eat and kill a Yellow Lantern, and
      more could tear a Green Lantern apart. Larfleeze himself stated Hal Jordan was
      no threat to him due to him having the entire power of his corps in his ring,
      and could harm and drew blood from Hal Jordan amplified by a Blue Lantern ring.
      Could also knock out Atrocitus. Fought Lex LuthorAction Comics #898. The Guardians
      of the Universe stated that the Orange Light nearly depleted their ranks the
      first time they faced it. They also feared its light even when together, which
      was shown capable of killing them without issue. The Guardians of the Universe
      stated that Larfleeze contains a power as threatening as Parallax5-D)'
