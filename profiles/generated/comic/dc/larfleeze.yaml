- id: claim-powers-and-abilities-0888c08e
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Longevity (Has lived for billions of
    years), Empowerment (Is empowered by Orange Light of the Emotional Spectrum),
    Greed Manipulation (Has control over the Emotional Spectrum Orange Light of Greed),
    Summoning (Can summon those he has killed as Orange Lantern corps constructs to
    attack others, and summoned the ControllersGreen Lantern Vol 4 #40 who he previously
    killed.), Necromancy (Can summon those he has killed as Orange Lantern corps constructs
    to attack others, and summoned the ControllersGreen Lantern Vol 4 #40 who he previously
    killed.), Duplication (After one of his Orange Lanterns killed the Green Lantern
    Gretti and ate his ring, Larfleeze replicated him and made him an Orange Lantern,
    and can do this to others by eating them), Energy Manipulation (One of his Orange
    Lanterns branded a Green Lantern, which later released a message from Larfleeze
    that was made up of energy. Created a sword using his energy, and other constructsGreen
    Lantern: Larfleeze Christmas Special), Weapon Creation (Created a sword using
    his energy), Enhanced Senses (Seemingly heard a Green Lantern speaking while approaching
    his sector from another, could smell the arrival of others on the surface of a
    planetGreen Lantern: New Guardians #11), Absorption (His Orange Lanterns could
    absorb the constructs of the Green Lanterns and the Guardians, as well as magic.
    Larfleeze absorbs the essence and soul of those he killsGreen Lantern: New Guardians
    #7), Intangibility and Nonexistent Physiology (Type 1; Aspect 1; His Orange Lanterns
    seemingly flicker in and out of existence, allowing attacks to pass through them),
    Immortality (Type 7 for his Orange Lanterns; They have no life readings and were
    stated to rise from the victim''s body like a spirit), Statistics Amplification
    (After returning his Orange Lanterns back into his lantern, Larfleeze became enraged
    and his emotion of greed reached high enough to increase his power ring to 7839%Green
    Lantern Vol 4 #42. Can even increase his rings power levels to 100,000%Blackest
    Night Vol 1 #5), Size Manipulation (After overcharging his ring, Larfleeze increased
    his size), Regeneration (Mid-Low; After being impaled through his stomach, his
    wound healed a short time laterGreen Lantern Vol 4 #57), Temperature Manipulation
    (Was going to melt the North Pole), Creation (His ring can make anything he imagines),
    Shapeshifting (Disguised one of his Orange Lanterns as a ringGreen Lantern: New
    Guardians #3), Clairvoyance (Knows everything that his Orange Lanterns know),
    Aura and Forcefield Creation (Created a protective aura around himself and StargraveLarfleeze
    #1), Information Analysis (His ring can tell him what time it is), Fire Manipulation
    (Produced flames powerful enough to knock out AtrocitusGreen Lantern Vol 4 #48,
    who is uneffected by his own blood which is a napalm-like plasma that burns even
    in spaceBlackest Night #0. Caused a massive explosion of fire), Self-Sustenance
    (Type 1; His protective aura allows him to survive in space without oxygen), Supernatural
    Willpower (Despite suffering intense torture by the other Orange Lanterns, Larfleeze
    refused to surrender to their will and become their slaveLarfleeze #5), Resistance
    to Mind Manipulation (The ring protects Lanterns from the Third Army''s conversion
    abilities, which broke down and decimated mindsGreen Lantern Annual Vol. 5 #1),
    Empathic Manipulation (Ophidian stated Larfleeze was the only being in the universe
    capable of resisting its temptations due to being a being of nothing but wantGreen
    Lantern Vol 4 #57), Biological Manipulation and Matter Manipulation (Due to their
    rings, Lanterns are stated to be resistant to the Third Army''s conversion abilities,
    which completely rewrite a persons organic matter, and extract the heart)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
