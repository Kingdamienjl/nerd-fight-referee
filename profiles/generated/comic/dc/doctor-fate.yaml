- id: claim-weaknesses-5dc6259a
  section: weaknesses
  axis: weakness
  text: 'If the helmet is removed, Kent loses all power from Nabu (though he can will his stolen vestments
    to fight back) as well as his memories as Fate. Eric and Linda Strauss''s versions are considered
    the weakest with no notable abilities and possess half the power when split. Notes: Doctor Fate when
    fully possessed by Nabu scales to the realms of the Sphere and in some cases transcends the denizens
    of the Sphere. However, through the power of belief the power that any Lord of Order, or any being
    for that matter, possesses is greatly enhanced. Hence why the attack potency and range of Nabu are
    Outerverse level+ and Outerversal+, but this is due to the potential being greater throughs those
    mediums and specific examples. However, his striking strength and durability shouldn''t reach that
    high, especially the latter, since anyone can do what they did during the war of magic and the Otherkind
    storyline. It is not intrinsic to their nature. This is classic Doctor Fate, not the current version.
    Before making any changes to this page, please read and follow the Power-scaling Rules for Marvel
    and DC Comics. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== ==Notes/Explanations==
