- id: claim-powers-and-abilities-563b21e9
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts, Flight, Enhanced Senses
    (Could see an invisible divine aura), Genius Intelligence, Mind Manipulation (Can
    hypnotize others and make her opponent unable to tell a lie with her Lasso of
    Truth), Regeneration (Mid-Low: Can regenerate from getting her arms broken by
    Doomsday), Illusion Creation (Can create illusions that modify her appearance),
    Dimensional Teleportation (Wonder Woman can leave the planet through meditation.
    She did this to rescue Artemis when she was in hell), Biological Manipulation
    with her Lasso of Truth (Can correct lies in genes), Electricity Manipulation
    (When she strikes her Bracelets of Submission together, she can channel Zeus''
    Holy Lightning), Master Hand-to-Hand Combatant, Weapon Mastery, Reality Warping,
    Absorption and Transmutation (Resisted and reversed Clayface''s attempt to break
    her back down into clay and absorb her), Self-Sustenance (Type 1; Vacuum Adaptation),
    Statistics Amplification & Aura when calling upon the power of the Godwave, Can
    speak with animals and easily learn new languages due to the blessings of Athena
    and Artemis, Purification (Type 3: Nullified the petrification effect on Hermes
    with purifying flames), Animal Manipulation (Diana commanded some crows to distract
    Superman), Non-Physical Interaction (Can interact with souls and abstract gods),
    Alternate Future Display (Altered Ares'' perception to make him see the future
    consequences of his actionsWonder Woman 1987 #6), Pressure Points, Weapon Control
    (Diana can control her invisible jet''s shape freelyJLA/Titans Vol 1 3 and spread
    it over planetary distances), Information Analysis (The Lasso can show Diana the
    pressure points of her target), Resistances to Magic, Telepathy, Illusion Creation,
    Radiation Manipulation, Poison Manipulation, and Disease Manipulation (The blessings
    of Demeter protect Wonder Woman from all known earthly poisons and illnesses)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
