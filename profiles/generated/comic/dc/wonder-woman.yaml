- id: claim-weaknesses-44f64394
  section: weaknesses
  axis: weakness
  text: 'Wonder Woman is weak to sharp objects such as spears, swords, bullets, etc.,
    she can only use the Godwave for a few minutes or she will go insane Notable Attacks/Techniques:
    *Godwave: With focused meditation and prayer, Diana can channel the power of the
    Godwave, one of the primordial cosmic forces of the DC Universe, greatly amplifying
    all of her abilities and shrouding her in a powerful divine aura. However, overuse
    of this ability will eventually render her insane, forcing her to use this sparingly.
    Notes: *Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics. *Her Pre-Clayface Absorption key consists of her
    first appearance in Wonder Woman Vol. 2 #1 (February 1987) to Wonder Woman Vol.
    2 #161 (October 2000). *Her Post-Clayface Absorption key consists of Wonder Woman
    Vol. 2 #162 (November 2000) and onward. Standard Tactics: Wonder Woman often holds
    back her full strength as to not kill or seriously injure her enemies. * Wonder
    Woman admits to weakening her punch (Wonder Woman Vol 1 600) * Amazonians don''t
    kill if they don''t have to. (Wonder Woman Vol 3 25) ** This obviously extends
    to far, far weaker opponents (Wonder Woman Vol 3 14) ** All the way to stronger
    characters, like Captain Nazi (Wonder Woman Vol 3 15) ==Notable Matchups== Victories:
    Losses: *Kai (Ninjago) Kai''s Profile (Staff of Elements Kai and Pre-Clayface
    Absorption keys were used. Speed was equalized. Fight took place in a jungle.
