power_scale:
  tier:
    text: ', higher with Size Manipulation'
    source_ids:
    - vsbattles-big-barda-dc-comics
    confidence: 0.6
  attack_potency:
    text: 'Low Complex Multiverse level (As the former leader of the Female Furies,
      Barda is a powerful New God capable of fighting Pre-Clayface Wonder Woman and
      fought alongside Post-Clayface Wonder Woman in a death matchSuperman/Batman
      Vol 1 #11, August 2004. Dealt grievous damage to Superman with her Mega Rod.
      She was able to fight the Female Furies and Lobo with physical force. She was
      able to hit Wonder Woman One Million so hard that the impact scale broke)'
    source_ids:
    - vsbattles-big-barda-dc-comics-post-crisis
    confidence: 0.6
  speed:
    text: Massively FTL+ (As a particularly powerful New God, she has proven herself
      to be as fast as Kryptonians like Superman as well as Amazons like Wonder Woman)
    source_ids:
    - vsbattles-big-barda-dc-comics-post-crisis
    confidence: 0.6
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Low Complex Multiverse level (Comparable to Wonder Woman. She was able to
      take hits from Lobo, Wonder Woman and is stronger than her husband, who is able
      to fight Superman. Barda is able to withstand hits from Stompa, who almost killed
      Wonder Woman)
    source_ids:
    - vsbattles-big-barda-dc-comics-post-crisis
    confidence: 0.6
  stamina:
    text: Superhuman (Barda's New God physiology allows her to operate for at least
      48 hours before tiring and can last in protracted battles against other New
      Gods like the Female Furies)
    source_ids:
    - vsbattles-big-barda-dc-comics-post-crisis
    confidence: 0.6
  range:
    text: Extended Melee Range with her Mega Rod, Tens of Meters with her Mega Rod's
      concussive blasts (Can rip through the hull of a warship), at least Intergalactic
      with Mega Rod (She teleported Lobo to another Galaxy), Interdimensional with
      her Mother Box (Can reach across space-time and into other universes)
    source_ids:
    - vsbattles-big-barda-dc-comics-post-crisis
    confidence: 0.6
  intelligence:
    text: Genius in combat, Gifted otherwise (Having been groomed from an early age
      to be the leader of Darkseid's Female Furies, Barda is a master of all weapons
      and forms of hand-to-hand combat, utilizing everything from swords, to clubs,
      to rifles and cannons with great proficiency and stalemating combatants as skillful
      as Wonder Woman. She was able to thoroughly trounce the combined forces of the
      Female Furies while fighting alongside Wonder Woman. In addition, like most
      New Gods, Barda is naturally more intelligent than most humans due to her exposure
      to the Source. This allowed her to help her husband Scott design and construct
      numerous dangerous traps for use in his death-defying acts)
    source_ids:
    - vsbattles-big-barda-dc-comics-post-crisis
    confidence: 0.6
