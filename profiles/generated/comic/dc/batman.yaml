  tier:
    text: '{{9-A}}. {{Unknown}} with Explosives, {{2-A}} with preparation Name: Bruce
      Wayne; Also known as Batman, The Dark Knight, The Caped Crusader, The World''s
      Greatest Detective, etc. Origin: DC Comics Gender: Male Age: 26 to 30 years
      old in early career, 46 to 48 years old during the end of New Earth period (His
      parents died June 26, 1976Batman Confidential #14The Legion #76 when he was
      8 years old.Secret Origins of the World''s Greatest Super Heroes When he was
      14 years old, he started to study and train to become the Batman,Batman: Shadow
      of the Bat #0 he went back to Gotham at the age of 25 and became the Batman
      at the age of 26, 18 years after his parents'' death.Batman (1940) #404 Despite
      the old age to act as a vigilante, Bruce was rejuvenated back to his young self,
      in terms of physical condition.Superman/Batman #40Batman (1940) #671 Classification:
      Human, Vigilante, Hero, Justice League Member, etc.'
    source_ids:
    - vsbattles-batman-post-crisis
    confidence: 0.75
    notes: auto_repair source extraction
  attack_potency:
    text: "Small Building level+ (Despite often being described as \"powerless\" compared\
      \ to his compatriots; Batman's strength is consistently highlighted throughout\
      \ his stories and qualifies as a super-powered entityChase (1998) #8 \u2014\
      \ performing feats that no ordinary man is capable of,Outsiders (2003) #50 such\
      \ as destroying wallsBatman (1940) #406 of concrete and launching steel doors,Batman\
      \ (1940) #613 but more impressively, busting glass said to be capable of withstanding\
      \ a bazookaThe Batman Chronicles (1995) #8 and a giant door that not even a\
      \ cruise missile could destroy.Batgirl (1940) #44 Beating groups of trained,\
      \ peak human characters, is barely a challenge to him, as shown by his beating\
      \ several of the world's greatest mercenaries while being injured;Batman: Legends\
      \ of the Dark Knight #189 a group of the most well-trained ninjas from the League\
      \ of Assassins while poisoned;The Batman Chronicles (1995) #8 and even his rogue\
      \ galleryBatman: Shadow of the Bat #4 right after defeating Amygdala casually\
      \ all while holding back.Batman: Shadow of the Bat #3 Batman is capable of defeating\
      \ super-human characters like Bane with his bare handsDetective Comics #736\
      \ and those who utilize Venom, a drug that increases one's strength ten-fold,\
      \ such as Lex Luthor, while amplified by Venom and liquid KryptoniteSuperman/Batman\
      \ (2003) #6 and Killer Croc, whose already superhuman was further bolstered\
      \ through Venom, but received a beatdown from Batman all the sameBatman: The\
      \ Dark Knight #1), Unknown with Explosives (Though they are treated as being\
      \ far above himself, their power is wildly inconsistent), Multiverse level+\
      \ with preparation (Can create armors and robots equal or superior to Superman\
      \ and other members of the Justice League)"
    source_ids:
