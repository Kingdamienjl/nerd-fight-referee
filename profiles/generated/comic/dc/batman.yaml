    confidence: 0.75
    notes: auto_repair source extraction
  speed:
    text: 'At least Supersonic+, possibly Hypersonic+ (By far one of the fastest DC
      street-level characters. Batman''s speed is praised by Nightwing, who is amazed
      by how fast he is,Batman (1940) #637 and NKVDemon II, who doubted Batman even
      being a human due to his speed.Aquaman (1991) #8 He consistently performs feats
      such as dodging point-blank gunfire,Batman (1940) #405 evading automatic fire
      from multiple shooters,Batman (1940) #406 and reacting to bullets from KGB Beast.Batman
      (1940) #418 He''s fast enough to intercept a moving car to save a civilian,Batman
      (1940) #405 outmaneuver Manhunters in close combat,Batman (1940) #415 and perceive
      both people and gunfire in slow motion.Batman: Odyssey (2010) #3; Batman (1940)
      #582 Outside combat, his vehicles like the Batmobile surpass 130 MPHGreen Lantern
      (2005) #9 and can evade tank shells.Detective Comics (1937) #696 Overall, his
      reflexes and movement speed consistently place him in the Subsonic to Supersonic
      range among street-tier characters.)'
    source_ids:
