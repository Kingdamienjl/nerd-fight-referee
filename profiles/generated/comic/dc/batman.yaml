  durability:
    text: 'Small Building level+ (Bruce was not only trained in various disciplines
      but also ingrained with the vital skill of safeguarding his own body, treating
      self-protection as seriously as any other form of training. This meticulous
      conditioning allows him to endure injuries that would cripple or kill ordinary
      humans. Even with his suit nearly destroyed, he survived multiple falls after
      being beaten nearly to deathDetective Comics (1937) #664 by Bane. He has withstood
      blows from superhuman opponents such as Clayface on unprotected areas like his
      jawJoker''s Asylum II: Clayface and endured severe internal damage while continuing
      to fight. Despite heavy blood loss and exhaustion, Batman routinely pushes himself
      to keep fighting until his body gives out.Batman (1940) #497 His endurance further
      extends to resisting explosions and extreme impacts; the Batsuit itself greatly
      enhances his survivability. It has withstood massive blasts and collapsing debris,Batman
      (1940) #437 explosions that obliterate several floors of a building,Batman (1940)
      #619 and direct RPG detonations.Batman: Poison Ivy Even without armor, Bruce''s
      conditioning allows him to take bone-shattering impacts and remain functional.)'
    source_ids:
    - vsbattles-batman-post-crisis
    confidence: 0.75
    notes: auto_repair source extraction
  stamina:
    text: "Superhuman (Batman's conditioning grants him exceptional endurance and\
      \ recovery, allowing him to keep fighting under pain, exhaustion, or injury\
      \ far beyond human limits. He has continued battling while poisoned, (against\
      \ Biis after being drugged),Batman: Sword of Azrael #3 severely weakened yet\
      \ defeating Metalhead and Headhunter in succession,Batman (1940) #486\u2013\
      487 and while doped and bleeding, fought the Riddler under the effects of Venom\
      \ and still won.Batman (1940) #490 Even when exhausted, he keeps fighting despite\
      \ blood loss, broken ribs, and internal trauma,Batman (1940) #497 and later\
      \ survived being beaten nearly to death by Bane. Batman has fought prolonged\
      \ battles while recovering from a spinal fracture (against Jean-Paul Valley),Batman:\
      \ Shadow of the Bat #30 and continued to fight off assassins while poisoned\
      \ and severely weakenedThe Batman Chronicles (1995) #8)"
    source_ids:
