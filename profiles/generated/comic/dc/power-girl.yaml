- id: claim-powers-and-abilities-b4f0034f
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Flight, Spaceflight, Martial Arts (Boxing and Karate), Dimensional
    Travel (Can travel to her home universe DC Comics Presents Vol 1 56(former power)), Genius Intelligence,
    Preparation (Being the CEO of a massive tech firm and a scientist herself, Kara has access to many
    futuristic technologies, however most of them are not combat-oriented), Empowerment (Yellow sunlight
    empowers her), Heat Vision (Hot enough to burn Black Adam''s hairJustice League of America Vol 1 25),
    BFR (Punched Wonder Woman into another countryWonder Woman Vol 3 41), Statistics Reduction, Ice Manipulation,
    Breath Attack (Power Breath can stop tsunamisPower Girl Vol 2 27. Frost Breath can reduce the durability
    of enemies, allowing her to one-shot them), Self-Sustenance (Types 1 and 2; Doesn''t need to sleepJSA
    Vol 1 63, foodJustice League: Generation Lost Vol 1 18, or oxygenThe Brave and the Bold Vol 3 7),
    Regeneration (Low; Heals at a faster rateJustice League Europe Vol 1 9), Sealing, minor Spatial Manipulation
    (Sealed a dimensional portalDC Comics Presents Vol 1 56), Enhanced Senses (Can ''look past the stars'',
    see fingerprints, and can see through walls and detect illusionsThe Brave and the Bold Vol 3 7Action
    Comics Vol 1 465Justice Society of America Vol 3 6. Can hear noises across a city, across the world,
    and can hear peoples heartbeatsPower Girl Vol 2 1Power Girl Vol 2 9), Underground Mobility (Can burrow
    undergroundWarlord Vol 1 122), Telekinesis (Made Black Canary flyBirds of Prey Vol 1 17 (former power)),
    limited Physics Manipulation (Contained an explosionPower Girl Vol 2 5), Hacking (Is a highly skilled
    and professional programmer), Accelerated Development (Learned Karate faster than any student of MongoPower
    Girl Vol 1 3), Supernatural Luck (For a period in the ''80s, Power Girl was jinxed to have terrible
    luck befall her and her friendsPower Girl Vol 1 1-5 (former power)), Acausality (Type 1; Survived
    the timeline being rewritten after Crisis of Infinite EarthsSuperman Vol 1 662), Sound Manipulation,
    Vibration Manipulation (Can utilize the Sonic Boom ClapPower Girl Vol 2 10), Supernatural Willpower
    (Despite being affected by the Fear Device, she powered through it), Berserk Mode (Can fly into a
    berserk mode that causes her to no longer hold back and use her entire strengthJustice League: Generation
    Lost Vol 1 18) |-|With equipment and preparations= With equipment and preparations: Cloth Manipulation,
    Underwater Breathing (Via her suitGreen Lantern/Power Girl), limited Clairvoyance via her Cellphone
    Earrings, Teleportation via J.L.I. Teleporters, Biological Manipulation, Nanotechnology (Via bio-ware
    and grey goo) |-|Resistances= Resistance to Magma Manipulation, Heat Manipulation (Unaffected by lavaAll-Star
    Comics Vol 1 58. Withstood heat-vision from a clone of Krypto the SuperdogPower Girl Vol 2 20), Electricity
    Manipulation (Resisted Mazin''s storm, which was said to be strong enough to tear apart buildingsPower
    Girl Vol 2 25), Ice Manipulation, Fire Manipulation (Unaffected by Ice''s ice and Fire''s fireJustice
    League: Generation Lost Vol 1 18), Fragrance Manipulation, Empathic Manipulation (Unaffected by ''seduction
    muskPower Girl Vol 2 5), Biological Manipulation (Immune to the Pregno-RayPower Girl Vol 2 8), Memory
    Manipulation (Remembered Maxwell Lord after being memory-wiped), Disease Manipulation (Resisted Plague''s
    attacks, which are lethal to humansWonder Woman Vol 1 292), Radiation Manipulation (Several forms
    of radiation either do not hurt her, or empower her), Pain Manipulation, Cold Manipulation (Doesn''t
    feel the cold and rarely feels painJSA Vol 1 63), Poison Manipulation (Cyanide doesn''t phase her)f'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
