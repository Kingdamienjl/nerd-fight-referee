    eyes to burn, cut, or cauterize. * Frost Breath: A frigid breath of cold air, capable of freezing
    entire structures. Notes: * Explicitly the same person after the Crisis of Infinite Earths. * Holds
    back as to not severely harm anyone.JSA: All-Stars Vol 1 2 ==Notable Matchups== Victories: Losses:
