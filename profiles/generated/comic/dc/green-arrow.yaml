  section: weaknesses
  axis: weakness
  text: 'Ollie is easily seduced by women, even cheating on his lover Black Canary,
    whom he loves dearly, without hesitation. He is also inherently sympathetic to
    marginalized groups, which while this is usually a strength that allows him to
    gain allies, has been used to manipulate him in the past. ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== : References in bold are Pre-Crisis
    showings. Ollie''s Pre-Crisis history is very much shown to be canonical to his
    Post-Crisis history, with the implication that the death of MLK and the Kennedy
    Brothers transformed him from his happy-to-lucky nature to his much more angry
    and politically charged self. However, his Pre-Crisis history will eventually
    be used to make a separate page to better account his showings during the Silver
