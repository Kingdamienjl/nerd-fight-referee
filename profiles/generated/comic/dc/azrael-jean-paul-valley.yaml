    confidence: 0.95
  attack_potency:
    text: 'Building level (Stronger than anyone in the bat-family,Azrael: Agent of the Bat #93 defeated
      Bane on three separate occasions, and fought Deathstroke to a draw in a sword fight. Easily defeated
      Batman, knocked out Benny, a metahuman who took Nightwing''s blows with no damage whatsoever. Defeated
      Calibax, a metahuman who passively got stronger by absorbing the life force of others and currently
      had Deathstroke''s strength. Took out the Huntress with a garbage can. Was stated to be capable
      of taking out the entire Arkham Asylum at his best) Can ignore conventional durability with his
      gauntlet shots'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Hypersonic+ (Faster than anyone in the Bat-family, and could keep up with Deathstroke. Batman
      admitted Azrael was faster than him. Protected Cassandra Cain from an explosion before she could
      react)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class 5 (Ripped off a cyborg's metal arm, overpowered Deathstroke in a sword lock,
      can easily break iron cuffs) to possibly Class 10 (Lifted an enormous tree off the ground)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Building level (In a single hit, takes down a Parasyte, who has taken repeated attacks from
      Nightwing)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Building level (Even without his armor, he took hits from Benny. With the armor, he's completely
      undamaged by Batman's blows. Can take gunfire with no damage. Protected Cassandra from an explosion
      that would've killed her, although he was hospitalized after that. A different person wearing his
      armor withstood a plane exploding)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Can fight several opponents for an extended period of time and ignore bullets),
      Infinite under the influence of the system (It entirely blocks all pain and takes away his requirement
      for food and rest)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, higher with various weapons
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Likely Genius generally (Studied computer technology in the Gotham University, and has been
      shown to effectively apply this knowledge in combat situations, for instance, how he hacked a complex
      computer system using an electric fence and a wire from a defeated robot. His detective skills were
      complimented and even compared to Batman's by Alfred, although he dislikes detective work. Has used
      his knowledge of chemistry to destabilize a matter erasing weapon. Extraordinary Genius in terms
      of combat, as the system provides him with six centuries worth of memories of skilled assassins
      just like himself, perfectly guides his movements and gives him skills said to be comparable to
      that of Batman's)
    source_ids: *id002
