  speed:
    text: 'Massively FTL+ (Ran along with the Big BangThe Flash Vol 2 #141 September
      1998), higher with kinetic energy transfer (Reset every radio on earth in a
      few zeptosecondsThe Flash Vol 2 #138 June 1998), up to Infinite with Speed Steal
      (Using Jesse Quick''s connection to the Speed Force, Wally became so fast that
      time did not move from his perspective, and he proceeded to fight Zoom in his
      locked timeThe Flash Vol 2 #200, September 2003); Immeasurable via running through
