    text: 'Varies with Speed (A Speedster''s power varies depending on howDark Crisis:
      Big Bang, December 2022 fastJLA Vol 1 #3 they''reThe Flash Vol 2 #148 May 1999
      moving.Convergence: Speed Force #2 Flashes often hold back their full speed,
      otherwise they may kill someone while going too fastDC Rebirth, The Flash Vol
      5 #7, November 2016), up to Low Complex Multiverse level (Consistently stated
      to have surpassed Barry Allen. Superior to Jay Garrick, who can briefly fight
      Black Adam.JSA (1999) #6 While weaker, can contend with a held back Zoom,The
      Flash Vol 2 #224 though he was eventually overwhelmed. In his early years, Wally
      could contend against a very early Professor Zoom, though is still overall weaker,
      and when Wally unblocked his mental barriers, Wally was capable of matching
      and eventually overwhelmed Thawne.The Flash Vol 2 #79 Later on, Wally was capable
      of fighting against a much more experienced Professor Zoom, who is consistently
      an equal to Pre-Crisis Flash. Easily toyed with and defeated Mongul.The Flash
      Vol 2 #102 Knocked out Flashpoint Wonder WomanConvergence: Speed Force #252
      Universes), higher with Speed Steal (Flash becomes stronger with Speed Steal.
      At the peak of his Speed Steal, it allowed him to match an out of control ZoomThe
      Flash Vol 2 #200). High Outerverse level with the Entire Speed Force (The Speed
      Force is one of the main multiversal forces, on a similar level to the Sphere
      of the GodsJustice League (2018) #37. Completely overwhelmed Cobalt Blue''s
      absorption abilities.The Flash Vol 2 #150 Should be comparable to Barry Allen
      who assisted Pandora in merging the New Earth, Wildstorm, and Vertigo universes.Flashpoint
      Vol 2 #5, October 2011 Also, the Speed ForceThe Flash Vol 6 #11, September 2024
      is said to be the Deep Change that all of Creation is emanated as a dreamThe
      Flash Vol 6 #11, September 2024 from that same force that transcends all levels
      of emanationsThe Flash Vol 6 #11, September 2024 of reality)'
