- id: claim-powers-and-abilities-09a84477
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Genius Intelligence, Immortality (Types
    1 and 2), Self-Sustenance (Types 1, 2, and 3), Flight, Energy Manipulation (Can
    surround his hands with energy and channel it into physical strikes), Energy Projection
    (Can fire energy blasts), Aura (Monitors can release a damaging energy aura in
    all directions), Absorption (Monitors can drain others of energy), Forcefield
    Creation (Monitors can make spherical barriers that can shield from mental damage),
    Time Stop (Monitors can stop time using chrono-paralyzers), Teleportation (Monitors
    can teleport themselves and others across dimensions), BFR (Monitors can forcefully
    teleport others away), Telepathy (Monitors can sense others'' hearts), Perception
    Manipulation (Monitors can go unnoticed by others), Sleep Manipulation (Monitors
    can put others to sleep), Biological Manipulation (Turned Ultraman into his vampire
    thrall) All previous abilities to a much greater degree, plus: Abstract Existence
    (Type 1; Monitors are archetypal inhabitants of Nil, a world within the Monitor
    Sphere, a plane of existence that vastly transcends the platonic, archetypal Sphere
    of the Gods), Beyond-Dimensional Existence, Large Size (Type 10), Incorporeality,
    Intangibility, Size Manipulation and Dimensional Travel (Can alter both his scale
    and pitch to enter lower dimensions and traverse the Multiverse), Plot Manipulation
    (Monitors "makes moments" in the story with their power)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
