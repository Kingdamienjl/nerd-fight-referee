- id: claim-powers-and-abilities-d6ec9af6
  section: abilities
  axis: hax
  text: 'Abilities granted by the Green Lantern Power Ring, Superhuman Physical Characteristics, Teleportation,
    Forcefields, Light Manipulation (His ring projects light), Energy Projection, Energy Manipulation,
    Non-Physical Interaction, Invisibility, Immortality (Type 1), Regeneration, Telepathy, Willpower Manipulation,
    Power Nullification, Matter Manipulation, Weather Manipulation (Manipulated cloudsAll-Star Squadron
    Vol 1 #40), Sound Manipulation (Created a megaphone to amplify his voiceJustice Society of America
    Vol 1 #3), Spatial Manipulation (Cleaved through the vibratory barrier between universes to travel
    through themGreen Lantern 1960 #40), Dimensional Manipulation (Uses his mastery of the Fourth DimensionAll-American
    Comics #23 to phase through thingsAll-American Comics #18), Intangibility (Can even make constructs
    and people inside them phase through things.All-Star Squadron #23 He does something similar again.All-Star
    Squadron #40 Made a ceiling intangible.All-Star Squadron #60 Phases through wallsBook of Fate #12),
    Animal Manipulation (Created bees to fight KyleGreen Lantern 1990 #140), Chain Manipulation (Chained
    up Gog to restrain him.Justice Society of America #22 Did the same to Kyle Rayner. Chained up ObsidianJSA
    1999 #50), Air Manipulation (Created a windmill to bully someone.All-American Comics #74 Created a
    vacuum to suck up someone''s itemsAdventure Comics #465), Ice Manipulation (Froze a wave that dwarfed
    buildingsGreen Lantern 1960 #40), Regeneration and Immortality Negation (High-Mid and Type 3, was
    the only one who could permanently destroy shadows that Earth-S Captain Marvel and Liberty Belle couldn''t,
    as they reformed endlessly from shardsAll-Star Squadron #52), Soul Manipulation (His fire can burn
    the soul.Green Lantern 1960 #108 Removed Krona''s soul from Hal, and return Hal''s spectral form to
    his body.DC First: Green Lantern/Green Lantern Can repair soul and body.JSA: Classified #39), Paralysis
    Inducement (Paralysed a man''s arm with the light.All-American Comics #26 Paralysed two guards.All-American
    Comics #23), Heat Manipulation (Shot rays that cut through a steel door like a hot knife through butter.All-American
    Comics #42 Melted machine gunsAll-American Comics #38), Aura (His aura is used as a cushion to protect
    him from attacks. He uses this to block hits from Earth-S Captain MarvelAll-Star Squadron #36), Forcefield
    Creation (The ring protected him from harm even though he was unconscious, and while Alan wasn''t
    wearing it because it detected his natural instinct for survival, and activated without conscious
    thought.Green Lantern 1960 #109-110 They can block hits from and restrain Power Girl and SupergirlSupergirl
    2005 #1), Water Manipulation (Created water to distract Kyle), Magnetism Manipulation (Magnetized
    guns to disarm peopleAll-Star Comics #37), Thread Manipulation (Created a netAll-Star Squadron #52),
    Memory Manipulation (Erased the memories of thugs.All-American Comics #23 Makes it so Batman will
    lose memories of the names of JSA membersBatman: Gotham Knights #10), Fire Manipulation (The flames
    can be felt by Hal Jordan even through his forcefield,Green Lantern 2005 #16 who can tank heat visionGreen
    Lantern 2005 #13 from Cyborg Superman. His flames burned ObsidianJSA #50), Matter Manipulation (Atomised
    something falling into the oceanSuperman 1987 #83), Purification (His purifying flames burnt the soul
    of an evil person as his ring cannot be used by someone evil. Detoxified toxic waste), Dimensional
    Travel, Portal Creation (Can create a trans-dimensional link to other universes to contact people.Green
    Lantern 1960 #45 Conjured up a portal.The Book of Fate #6 Travelled to HeavenJLA 1997 #29), BFR, Time
    Travel (Sent a man back to the future by piercing the curves of time and space.All-Star Comics #29
    Teleported himself and Batman 30 minutes into the past.Batman: Gotham Knights #10), Time Manipulation
    (Sped up time in Heaven, where time doesn''t pass, by thousands of years.JLA 1997 #29 Heaven transcends
    space and time.), Time Stop (Kept a body in stasis to prevent deteriorationJustice Society of America
    2007 #32), Information Analysis (Finds molecular traces of a capsule''s coating, and then traces an
    animal from it''s furAdventure Comics #465), Enhanced Senses (Used X-Ray to view Black Adam''s tumorJSA
    1999 #6), Extrasensory Perception (Sensed energy from far away.All-Star Squadron #50 Tracked an energy
    signature and followed its trailGreen Lantern 1960 #108), Invisibility Negation (Revealed Martian
    Manhunter while he was invisibleDC 2000 #1), Magic (The Starheart, his source of power, is an object
    that was formed when the Guardians sealed away magic to prevent it from threatening the universe.
    His magic can work on Fate,Fate #11 though barely.Fate #12 Fate is unaffected and untouched by other
    magic flamesFate #13), Standard Green Lantern resistances'
