- id: claim-weaknesses-fa57eb34
  section: weaknesses
  axis: weakness
  text: 'Objects made from wood or plant matter ignore his powers, either phasing through or outright
    breaking his constructs, and even objects only partially comprised of them are resistant (such as
    Solomon Grundy). His existence depends on his willpower. The Starheart is evil, and has the potential
    to corrupt him. Note: Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics.'
  source_ids: *id003
