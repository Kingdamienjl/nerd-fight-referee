- id: claim-weaknesses-2beb55ae
  section: weaknesses
  axis: weakness
  text: 'Storm''s power is affected by her emotions and her willpower. Overuse of
    her powers can cause extreme exhaustion. If she becomes enraged, she can cause
    devastating storms. Storm''s godhead powers vary based the amount of people that
    have faith in her. She formerly had severe claustrophobia, and is sometimes depicted
    as being very arrogant and aggressive. Notable Attacks/Techniques: -Electricity
    Manipulation: Storm''s most common method of offense, she can fire a real, natural
    lightning bolt from the sky, shoot lightning from her hands, create EMP''s, manipulate
    and perceive electromagnetic fields, screw with a person''s bio-electricity and
    generate electrolysis, allowing her to breathe underwater. She can even use cosmic
    lightning bolts in space. -Wind Manipulation: Uses the wind as a powerful attack.
    Her control over wind is powerful enough that Storm can instantly create large
    tornadoes and make vacuums that suck away the air. She also uses the wind to make
    herself fly and increase her physical strength. Her winds even managed to affect
    the Hulk. She can also use solar winds. -Flash Flood: Storm can instantly create
    a flood of water. -Flash Freeze: Manipulates the temperature to instantly freeze
    her opponent solid. -Humidity: Storm can increase the temperature to extremely
    high degrees. -Acid Rain: Storm is capable of causing acid rain to fall down on
    her enemies. -Hurricane: Storm can create large scale hurricanes. -Hail: Can rain
    hail down on her enemies. -Hydrogen Bomb: Storm gathers hydrogen into a particular
    area and then uses electricity within that area to ignite it, causing a massive
    explosion. -Atmospheric Pressure: Storm can affect the pressure of the atmosphere
    to her will. -Fog: She can make a fog thick enough to hide herself in. She can
    make it acid for offensive corrosive purposes. -Pressure Field: Storm can create
    a field of pressure around herself and use it as a shield. -Telepathy Protection:
    Storm''s electrical powers in combination with her will power gives her protection
    from telepathy. Notes: *Storm was capable of wielding a magical duplicate of Thor''s
    mystic Hammer Mjolnir, created by Loki. *Before making any changes to this page,
    please read and follow the Power-scaling Rules for Marvel and DC Comics. ==Notable
    Matchups== Victories: Losses: Inconclusive: ==References== {{Scroll box|{{Reflist|2}}}}
    ==Statistics Values== {{Discussions|Storm Marvel Comics|Storm (Marvel Comics)}}
