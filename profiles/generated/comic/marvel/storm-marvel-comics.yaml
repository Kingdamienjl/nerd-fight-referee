- id: claim-powers-and-abilities-e0cd7e2c
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Enhanced Senses (Is aware of sudden
    changes in ecology and can read air currents and rain patterns. Can also detect
    natural phenomena such as storms, hurricanes, and earthquakes, and has an innate
    connection to lifeforms all around Earth), Martial Arts (Has learned Muay Thai
    and Gidigbo from Black Panther, Kenjutsu and Krav Maga from Wolverine, and Tai
    Chi along with Hung Gar from Shang ChiStorm (2024) #12), Weather, Elemental, Energy,
    and limited Matter Manipulation (Storm is an Omega level Mutant whose dominant
    power is her weather manipulation that is the basis for the vast majority of Storm''s
    powers.House of X #1 Tapped into the life-support systems and micro-climates of
    multiple spaceships, using it to take down enemy ships.Black Panther Vol 7 #21
    Altered the climate of the entirety of the planet Mars/Arakko.Planet-Size X-Men
    #1 While grieving Wolverine''s death she started to freeze the helicopter she''s
    in and created a global aurora. She also remarked that she was trying not to set
    the atmosphere on fire.Storm Vol 3 #4 Stated that she is an energy manipulator
    in her fight with Vulcan and that the energy was circling between them looking
    for a weakness.X-Men: Red #2 Used power from the galactic core, which was composed
    of millions of suns, to purge herself of a Brood eggUncanny X-Men #165), Energy
    Projection and Energy Absorption (Contested and defeated Vulcan in a battle of
    wills as their energy was circling and building between them. Absorbed and channeled
    more magic than Magik, a sorcerer supreme, could safely control.Extraordinary
    X-Men #16 Absorbed Spectrum while fighting in defense of Wakanda.Black Panther
    Vol. 7 #24 Storm could absorb life force energy Magneto provided to recoverResurrection
    of Magneto #3), Adaptation (To her environment via her powers), Status Effect
    Inducement and minor Biological Manipulation (Capable of ripping the air from
    people''s lungs, controlling electrical impulses to induce seizures or fry brains,
    and freeze hearts and shatter veins.Wolverines #6 Sucked the humidity from MagnetoUncanny
    X-Men #113 ), Magnetism Manipulation and Electricity Manipulation (Tapped into
    the planet''s magnetic fields to throw flesh zombies away from it.Storm Vol 3
    #11 Gathered hydrogen atoms around Silver Surfer, then ignited them with lightning.Fantastic
    Four #545 Parted the Earth''s ozone layer and magnetic field to evaporate a huge
    wave.Storm Vol 3 #8 Generated an electromagnetic pulse.X-Treme X-Men #1 Ionizes
    fog she creates to disrupt communications.X-Treme X-Men #2 Killed Callisto with
    one punch by electrocuting her heart in her chest.Marauders Vol 1 #17 Taught Scarlet
    Witch a spell to generate electricity.Scarlet Witch (2023) #6 Can block incoming
    attacks by using lighting bolts as shieldsX-Men: Worlds Apart #4), Fire Manipulation,
    Temperature Manipulation (Subconsciously agitated air molecules heating up the
    roomStorm Vol 3 #1), Air Manipulation (Could generate strong enough winds to blow
    out the Human Torch''s flameContest of Champions #2 and knock the Hulk into the
    air.Incredible Hulk #444 Claims to be capable of leveling mountains. Capable of
    controlling solar winds.Uncanny X-Men #99 Controlled and dropped the air pressure
    within the surrounding area.S.W.O.R.D. Vol 2 #11 Can use her powers to suck the
    air out of her opponent''s lungs.X-Men: Worlds Apart #1 Can disorient opponents
    by manipulating the air in their ears, and create waves of fog large enough to
    engulf entire cities in order to conceal herselfX-Men: Worlds Apart #3), Water
    Manipulation and Ice Manipulation (Summoned a tidal wave against Cassandra Nova.X-Men
    Red Vol 1 #8 Created a monsoon to put out Pyro''s flames.Uncanny X-Men #178 Was
    shown casually creating blizzards.Uncanny X-Men #112Uncanny X-Men:First Class
    #2 Capable of flash-freezing rain.Uncanny X-Men #270 States that she''s just as
    much an omega level "hydrokinetic/cryomancer" as Iceman and wins in their past
    sparring matches and current fight.Marvel''s Voices: X-Men Froze a gun and the
    hands of its user and made the temperature drop 200 degrees, to the point where
    the gun''s user would need skin grafts due to the frostbiteX-Men: Worlds Apart
    #2), Summoning (Using a Yoruba spell taught to her by Doctor Voodoo, summons a
    massive energy octopus powerful enough to restrain multiple Storm godsStorm (2024)
    #7), Cosmic Awareness and Extrasensory Perception (Perceives the world as energy
    patterns, capable of sensing the Earth’s pain and likely has a similar relationship
