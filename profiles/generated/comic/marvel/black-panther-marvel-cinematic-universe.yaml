    Characters Category:Stealth Masters Category:Absorption Users Category:Vibration Users Category:Armor
    Users Category:Spear Users Category:Weapon Masters Category:Necklace Users Category:Revived Characters
    Category:Billionaires Category:Parents Category:Honorable Characters'
  source_ids: *id003
