- id: claim-standard-equipment-b32a8eb6
  section: equipment
  axis: equipment
  text: 'The Panther Habit, Wakandan Royal Ring, Kimoyo Beads, EMP beads, Implant, Vibranium Iklwa Dagger,
    Wakandan Short-Spear, Wakandan communicator, Royal Talon Flyer *Panther Habit: As the Black Panther,
    T''Challa dons a uniquely crafted Vibranium-weave combat suit that, like Captain America''s Shield,
    is lightweight, nigh-indestructible, and renders him immune to most physical damages, especially from
    collisions and conventional firearms, though the Habit was notably susceptible to the electrical charges
    of Black Widow''s Bite and Vibranium weaponry. After his return to Wakanda, T''Challa received an
    updated version of the Habit designed by Shuri to be more advanced than his traditional Habit, capable
    of absorbing and manipulating energy for various purposes. The updated version also facilitates an
    extreme ease of storage, due to being constructed from Vibranium nanites embedded in his necklace.
    The Panther Habit also included with sound absorbent shoes, letting T''Challa be unable to make noises
    while taking a step.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
