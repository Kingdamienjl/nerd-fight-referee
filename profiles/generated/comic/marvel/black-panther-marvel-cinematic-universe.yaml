- id: claim-weaknesses-e94da537
  section: weaknesses
  axis: weakness
  text: 'The necklace of his suit, for the rest of his suit is generated from it. The Nanotech Panther
    Habit weakens under sonic attacks. ==Notable Matchups== Victories: Namor (Marvel Cinematic Universe)
    Namor''s Profile (Enhanced Black Panther with his Nanotech Panther Habit and Dehydrated Namor are
    used, Fight takes place on the beach where Shuri and Namor fought) Losses: Tai Lung (Kung Fu Panda)
    Tai Lung''s Profile (Black Panther didn''t have his suit, Tai Lung didn''t have his sword and speed
    was equalized) Haruto Soma (Kamen Rider) Haruto''s Profile (Haruto was untransformed and T''Challa
    was depowered. Speed was equalized. The fight took place at the World Martial Arts Tournament arena)
    Inconclusive: ==References== {{reflist}} ==Notes/Explanations== {{scroll box|content=}} {{discussions|Black
    Panther Marvel Cinematic Universe|Black Panther (Marvel Cinematic Universe)}} Category:Characters
