  intelligence:
    text: 'Extraordinary Genius (Despite his less humble beginnings as a billionaire,
      Tony has always possessed a highly respectable intellect in the Marvel Cinematic
      Universe. Built a circuit board at age 4, an engine at 6, and graduated MIT
      summa cum laude at 17.Iron Man. Marvel Studios, 2008 Hacked the Pentagon’s firewall
      in high school on a dare. With a batch of Stark weapons and rudimentary tools
      to put them together, Tony built a miniature Arc Reactor in fairly short timespan,
      while the previous giant sized reactor that was the last "breakthrough" in 30
      years. A group of scientists, including William Ginter Riva, in a fully stocked
      lab with access to said reactor could not figure out how to replicate a miniature
      Arc Reactor. Created the A.I. systems J.A.R.V.I.S., F.R.I.D.A.Y., J.O.C.A.S.T.A.,
      T.A.D.A.S.H.I., and Karen.Spider-Man: Homecoming Cured Pepper Potts after she
      was infected by Extremis. Before J.A.R.V.I.S. could even tell him it was illegal,
      Tony hacked into several email accounts of suspected organized crime figures,
      as well as security cameras across New York while armoured.Iron Man: The Coming
      of Melter Built the War Machine suits used by James Rhodes as well as the Tech
      Suit and Iron Spider for Peter Parker.Spider-Man: Homecoming Constructed numerous
      weapons such as a taser, tranquilizer, and grenades made with what he could
      gather from a hardware store. Created a new element, which would later be used
      as an energy source for his armors. Built 35 armors superior to the one used
      in Infinity War in a time span of 5 years. Alongside Bruce Banner and Rocket
      Racoon, created the Iron Gauntlet, which is capable of utilizing the power of
      the Infinity Stones just as the Infinity Gauntlet can. Was able to stabilize
      time travel in a night after only learning of the Quantum Realm earlier. Earned
      Thanos’ respect in their one-on-one battle on Titan)'
    source_ids: *id002
    confidence: 0.95
