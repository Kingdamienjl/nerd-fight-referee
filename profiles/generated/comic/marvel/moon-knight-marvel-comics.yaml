  stamina:
    text: Base=Comparable to, if not greater than his classic self. Despite being
      beaten by Bushman and having multiple broken bones, he was able to get back
      up and overpower Bushman to the point of nearly killing him. After he and Marlene
      were attacked by the Taskmaster, despite his long term injuries and pain, he
      went after him in a plane and flew it through a building - he came out unscathed
      and beat Taskmaster. Fought the Zapata Brothers and then ran for a long time
      without getting tired. After fighting Bullseye for a bit, he swam for a long
      time to lure him into a warehouse. While fighting Mr Hyde, he was thrown into
      the sea. He came back from that and continued fighting until he defeated Hyde.
      After that, he swam to safety. Fought Madam Masque for a long period of time,
      even after being caught in a small explosion. Despite having no powers or help
      from Khonshu, and being damaged greatly, he was able to return to the fight
      against a demonic creature and defeated him with weapons. Despite getting shot
      near the rib cage, he continued fighting against an enemy and even dodged bullet
      in close range. Despite being poisoned, he was able to fight against and defeat
      a member of Khonshu's cult. Defeated Bushman, despite being shot and then fought
      the Sun King for a short time. Was imprisoned in a room for nearly 2 weeks,
      without food, and possibly without sleep. During the second week, he went into
      the pond of a poisonous dolphin and defeated it. He then continued to eat it's
      poisonous flesh. Went four days without food, and possible sleep too. After
      fighting the fake Black Spectre, he was shot by the real one. Despite the many
      wounds, he still continued to crawl on the ground and stop the villain's machine
      that was hurting people. He eventually killed himself to stop the machine. |-|Empowered
      by Khonshu=Higher than before |-|Phases of Moon Knight=Unknown (He now exists
      as a spirit)
    source_ids:
    - mediawiki-moon-knight-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Return of Moon Knight=Standard Melee Range, Extended Melee Range (With
      various short-ranged weapons like swords, Baton/Multi-Purpose Truncheon, and
      others. Has hypersonics powerful enough to deafen even the Hulk. With Wolverine-like
      claws for close-quarter combat. Equipment capable of producing great degree
      of light that can even blind the Hulk. Temporarily caused the Sentry to stun
      with his light equipment.) to Tens of meters with Equipment (Harmed and made
      Grey Hulk bleed with his crescents.), even higher with Guns, explosives, other
      long-range weapons, and planes such as Angelwing that he can use to attack others.
      |-|Jake Lockley=Standard Melee Range, Extended Melee Range (As before plus;
      Has a branded sword, which he used to incapacitated Deadpool with.) to Tens
      of meters with Equipment (Can shoot a large number of crescents at once, making
      it harder for his opponents to dodge it. Scanned a building with a flying crescent.
      A gun that shoots crescent darts. Can shoot two crescents at the same time connected
      by a wire to trap someone.), even higher with Guns, explosives, other long-range
      weapons, Angelwing (Recalled his Angelwing with a remote to attack an enemy.)
      and "Webs" (Built a strong thread to help him swing around the city like Spider-Man.)
      |-|Steven Grant=Standard Melee Range, Extended Melee Range to Tens of meters
      with Equipment, even higher with Guns, explosives, and other long-range weapons
      (As before) |-|Marc Spector''s Return=Standard Melee Range, Extended Melee Range
      (As before, plus: replica of Wolverine''s claws made by ex-S.H.I.E.L.D. agent.)
      to Tens of meters with Equipment, even higher with Guns, explosives, other long-range
      weapons, and "Captain America''s" Shield (Has a Captain America-like shield.
      Unlike Steve''s, this is made of zero point energy that he can throw to far
      distances. Made Count Nefaria bleed with a shield throw.) |-|Mr Knight Era=Standard
      Melee Range, Extended Melee Range to Tens of meters (As before) with Equipment,
      even higher with Guns, explosives, other long-range weapons, and vehicles/drones
      (Recalled his plane and crashed it into an enemy and killed him. A remote controlled
      self-flying equipment that lets him fly across the city. Has various weapons
      installed in it.=, such as regular rounds of bullets and a large number of smaller
      crescents thrown at an enemy. Shoots small missiles. Has a lot of drones that
      he can uses for various different functions, such as information collecting
      or to help save someone. Or carry Moon Knight to another location in case of
      an emergency.) |-|Priest of Khonshu=Standard Melee Range, Extended Melee Range
      to Tens of meters with Equipment and some hax - such as Summoning (As before.
      Summoned a "memory" of Khonshu to take down an extremely powerful villain a
      lot of heroes couldn''t do much against), even higher with Guns, explosives,
      other long-range weapons, and other equipment. Outerversal with Special Equipment
      (Universal Eternity level. Via the Ankh, Scarab, and Scepter, which allows the
      user to control and reshape time and reality, erasing things and people, including
      possibly concepts. In the end, a Moon Knight used it to undo all the changes
      Kang had done. Moon Knight used these artefacts to bring all other Moon Knights
      from across the time to one place. The Bracelets allows Marc to perceive and
      exist in a plane only Gods can tread in, which exists beyond space and time.)
      High Outerversal when empowered by Khonshu (With a fraction of Khonshu''s power,
      Marc destroyed a being capable of destroying the multiverse. Prayed to Khonshu,
      who opened a portal for him, so Marc can go and save his people from Zodiac.)
      |-|Post-Resurrection=Standard Melee Range, Extended Melee Range (With Ginnarr,
      the Hoarding Blade) to Tens of meters with Equipment and some hax - such as
      Summoning (Ginnarr has energy hax that extends in every direction), even higher
      with Guns, explosives, other long-range weapons, and other equipment. Outerversal
      with Special Equipment, High Outerversal when empowered by Khonshu |-|Phases
      of Moon Knight=Unknown (He now exists as a spirit), High Outerversal via Dimensional
      Travel (Can travel between Khonshu''s realm and mortal planes)'
    source_ids:
    - mediawiki-moon-knight-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'General= * Greater than his classic self due to experience. A very cunning
      and smart person, who finds a way to take advantage of his disadvantages. Helped
      build the technologies he uses regularly. He surrounds himself with capable
      and skilled people in different fields to make sure he has areas covered where
      he isn''t very knowledgeable, and also to get help whereMoon Knight Vol 4 24
      necessary. ** For example, Frenchie is a fantastic martial artists, weapons
      master and also an extremely smart and capable inventor who built most of his
      technology (for both current Moon Knight and his classic self). ** In addition,
      he also has Marlene, who is a strong martial artists and weapons user, as well
      as a detective. She was able to find the location/HQ of the Profiler and others
      who were trying to kill Marc and his allies. ** When he moved to another state,
      he recruited an ex-S.H.I.E.L.D. agent to develop replica weapons of a few heroes.
      ** When he set up the Midnight Mission, he surrounded himself with vampires
      and Tigra, whom he relied on multiple times to find and hunt down enemies. Soldier,
      another one in his team, was an ex-Hydra, who was good with technologyMoon Knight
      Vol 9 18, electronics, and bombs/diffusions. 8-Ball is a good pilot, engineer
      and good with technology/electronics as well. Both of whom helps Marc do things
      which he might not be able to do himself. * He is a specialist in small unit
      tactics, asymmetrical and conventional warfare and close combatMoon Knight Vol
      9 25. * Because of his reputation being ruined and authorities after him for
      breaking the law, Marc decided that he should "kill" himself publicly. He used
      his fight against Bullseye (and Thunderbolts) to blow up a warehouse and let
      himself die there publicly. He switched to his Jake Lockley personality to continue
      operating. * Became a "hero" for hire, infiltrated a gang to find information
      and help take them down. * Set up various identities in other countries in case
      he needs it. * Sometimes leaves his enemies alive if he thinks they might prove
      useful to him in the future. Whether it is to hire them as common thugs, or
      for their other specialities. Left a man alive who could capture ghosts because
