- id: claim-powers-and-abilities-5896f429
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Flight, Energy Manipulation (Can project any type of energy
    on the electromagnetic spectrum), Density Manipulation allows him for Intangibility/Phasing, Paralysis
    Inducement/Electricity Manipulation (Can use his phasing technique to become a glorified bug zapper),
    Durability Negation via Phasing (Affected internal organs), Non-Physical Interaction (Vision's phasing
    works on Wonder Man that is made of ionic energy, to a certain extent), Fusionism (Merged with Naferia.
    By fully phasing within a being, he can create a "merging"), Invisibility (Can render himself invisible
    while in disguise. Can lower his mass enough to become invisible), Enhanced Senses, Immortality (Type
    1), Self-Sustenance (Type 1, 2 and 3. He can survive in space and doesn't need to eat and sleep),
    Illusion Creation via Holograms, Technology Manipulation/Information Manipulation (Can broadcast data
    via Hologram projector), Photographic Memory (Able to record everything he see's), possibly Extrasensory
    Perception (Can somehow detect sentience and rage), Voice Manipulation (By perfect duplication of
    human voiceprints, he can make himself sound like any human he chooses along with machines), Matter
    Manipulation (By fully solidifying himself within a structure, he can disrupt the matter's molecules
    and destroy them), Energy Absorption (Vision is powered by solar energy, which he can absorb via jewel
    on his forehead. Capable of absorbing excess energy from people), Heat Vision (Can reach 1,062 degree
    centigrade beam) Light Generation (Blinded Thor), Shapeshifting/Duplication (Turned into a aircraft.
    Is a martial arts master. Cloned and turned into multiple robots. Tribal man. Countless types of robots),
    Hacking (Can remotely interface with computer systems, allowing him to infiltrate Ultron's computer
    systems), Regeneration (Mid-High, reformed after being reduced to dust), Resistance to Fire Manipulation
    (Unaffected by Kang-Amped Equinox's flames. While intangible, unaffected by a raging inferno), Sound
    Manipulation (Vision's audial receptors can leave him immune to certain types of sonic attacks, such
    as ultra-sonic shockwaves), Mind Manipulation (Vision's audial receptors can leave him immune Lorelei's
    hypnosis effect), Thermal/Temperature Manipulation (Unharmed by Crystal's maximum temperature attack),
    Poison Manipulation/Acid Manipulation (Intangibility renders him immune to acidic chemical cauldron),
    and Mind Control (Creates a frequency that disables Kree mind control. He is immune to all forms of
    mental takeover)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
