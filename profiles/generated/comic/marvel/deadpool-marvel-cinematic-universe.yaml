  stamina:
    text: Superhuman (The combination of Deapool's healing factor, self-destructive
      tendencies and reckless nature has basically made him unhealthily accustomed
      to even the most excruciating pain. After years and years of suffering, Deadpool
      has gotten used to stabbing, slashing,Absolute Carnage vs. Deadpool Vol 1 3
      gunshots, broken bones, maiming and much more, all the way to complete dismembering,
      confident that his regeneration shall inevitably take care of it all. Deadpool
      oftenly welcomes wounds and disregards danger out of sheer boredom, confidence,
      stupidity and will to taunt the opponent, but he oftenDeadpool Vol 9 8 utilizes
      such perk for unconventional strategy. Deadpool can take inhumanDeadpool Vol
      8 1 punishment before passing outDeadpool Vol 7 10 and can generally remain
      consciousDeadpool Vol 7 9 even when he should logically incapacitated, going
      as far as remaining awake when reduced to only his disembodied head. The quickness
      of his healing factor, and his tenacity which compensate for the eventuality
      of its absence, allow Deadpool to spring back to action after brief periods
      of time or simply push through damage and keep fightingDeadpool Vol 7 2 even
      in the most unlikely situations)
