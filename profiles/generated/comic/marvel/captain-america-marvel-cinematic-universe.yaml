    confidence: 0.95
  attack_potency:
    text: "Building level (Fought on par with Black Panther. Gave Spider-Man a black eye and was capable\
      \ of defeating him according to Iron Man. Fought against Red Skull, who can draw blood from him\
      \ despite being enhanced with a weaker version of the Super Soldier Serum. Harmed Winter Soldier.\
      \ Superior to Centipede soldiers who can blast open shipping containers. Can break reinforced glass\
      \ with no trouble. Destroyed a jeep by throwing a bike at it. Harmed his past version, though he\
      \ was eventually overpowered, he was likely holding back. Destroyed part of a highway pillar by\
      \ throwing Ultron into it. Can easily shatter Ultron Sentries0.83849 Tons of TNT), higher with Vibranium\
      \ Shield (Can severely damage Mark 46 Iron Man's arc reactor. Damaged Winter Soldier's Bionic Arm.\
      \ Cracked Ultron Prime's torso) | At least Multi-Continent level (Fought against and harmed Thanos.\
      \ On par with Post-Awakening Thor due to being imbued with his power via Mj\xF6lnir646.57085 Petatons)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "Subsonic (Can outrun cars with ease. Can jog 13 miles in 30 minutes very easily51 m/s), higher\
      \ combat speeds and reaction (Blocked gunfire from close range, is shown to fight at speeds upwards\
      \ of 71.1mph, 72.7mph, 73.9mph, and 79.5mph (35.53968m/s) with these speeds along with his skill\
      \ being enough to overwhelm Mark 46 Iron Man forcing him to use his AI to analyze his fight patterns\
      \ to begin to counter. Comparable to Spider-Man. Blocked a grenade launcher. Dodged blasts from\
      \ Ultron Sentries90.1925533m/s). Subsonic+ (Made use of M1911s253 m/s) to Supersonic+ attack speed\
      \ with guns (Has used guns like the FN SCAR and variants of the HK416 rifle714 m/s to 917 m/s) |\
      \ Subsonic combat and reaction speed (On par with Thor. Can keep up with Thanos90.1925533m/s), Supersonic\
      \ flight speeds (comparable to Thor), Massively Hypersonic+ summoning speeds with Mj\xF6lnir"
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 50 (Comparable to Winter Soldier and John Walker. Can rip the head off Ultron Sentries.
      Threw a bike several metres away. Lifted a large metal supporting beam. Bent a metal bar38.729637542
      Metric Tons) | Class P (On par with Thor. Forced Thanos to struggle with pushing away Stormbreaker
      from his neck14.836877 Trillion Metric Tons)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Building level, higher with Vibranium Shield | At least Multi-Continent level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Building level (Can no-sell terminal velocity dives into water from over thousands of feet.
      Endured hits from Winter Soldier's bionic arm. Survived a fall from the Triskelion and being sent
      flying through a bus after being hit by a grenade launcher. Withstood repulsor blasts from Ultron
      Prime. Survived a fall from a Project Insight helicarrier into the Potomac's waters. Withstood a
      grenade and subsequent fall from the building. Regularly no-sells high falls from buildings and
      whatnot with minimal discomfort. Withstood the Sanctuary II's missiles that destroyed the Avengers
      Compound. Got kicked through a thick stone block by Thanos. Comparable to Spider-Man). At least
      Multi-Continent level with Vibranium Shield (Endured multiple attacks from Thanos, who only destroyed
      half of the shield with his Double-Bladed Sword after multiple strikes) | At least Multi-Continent
      level (Withstood serious attacks from Thanos. On par with Thor)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Able to fight for extended periods of time without getting tired. Can keep fighting
      even after being seriously injured and may not even bother about it, such as when a Chitauri shot
      him in the abdomen. Can survive in thinner air)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range; Extended Melee Range to Tens of Meters with Vibranium Shield; Hundreds
      of Meters with most firearms | Kilometers with Lightning and Weather Manipulation; Planetary with
      Shockwaves and Hammer Throwing
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: "Gifted (Excellent tactician and possesses an excellent memory. Can mentally calculate the right\
      \ angle for his shield to return to himself in fights. Iron Man stated that Steve could have easily\
      \ outskilled an early Spider-Man, the latter of which was capable of easily defeating the Winter\
      \ Soldier and Falcon at the same time. Fought and briefly overwhelmed Thanos in combat when on equal\
      \ footing with him by using Mj\xF6lnir, though Thanos managed to eventually gain the upper hand)"
    source_ids: *id002
    confidence: 0.95
