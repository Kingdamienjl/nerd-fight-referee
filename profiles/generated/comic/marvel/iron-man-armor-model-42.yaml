- id: claim-weaknesses-f9e193a8
  section: weaknesses
  axis: weakness
  text: 'Tony can only use the armor''s shielding for a singular purpose, leaving him vulnerable if the
    opponent swiftly switches attack types. Feats: *Able to function in orbit *Escapes a Black Hole *Lifts
    and prevents the Quinjet from crashing. *Gets thrown through a Quinjet and comes back perfectly fine.
    *While weakened, the armor allows Tony to temporarily lift a large adamantium sentinel to prevent
    getting crushed. *Harms Superior Spider-Man with the Venom Symbiote with a punch. For further context,
    Superior Spider-Man was able to somewhat hold his own against the Avengers. *Claims to have an advantage
    against Doctor Doom in terms of armory. *Flies from New York to Los Angeles in two hours. *Takes a
    hit from a giant adamantium sentinel. *Blasts back two Extremis enhanciles. *Temporarily blasts back
    Red Onslaught. *Takes out Spider-Man with a single blast.Punisher War Zone #4 *Blasts away a reanimated
    Abomination. Note: Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
