  intelligence:
    text: 'At least Gifted, likely Genius. Emma Frost is highly skilled in electronic
      theory and electronics and has learned how to build devices that can amplify
      psionic energy and utilize psionic energy for various effects. Taught at Xavier''s
      school for mutants and at the Massachusetts school. Emma has experience as a
      member and leader of the X-Men, along with other teams. Emma is also a skilled
      businesswoman, being one of the heads of the Hellfire Trading Company/Hellfire
      Club. She also used to sit on the Quiet Council as a governing figure of Krakoa.
      Emma is an extremely powerful and learned telepath repeatedly stated to be on
      par with Charles Xavier. Emma also passively learns information through telepathic
      osmosis.Uncanny X-Men vol 1 #496'
    source_ids:
