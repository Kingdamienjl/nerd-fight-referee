- id: claim-weaknesses-2d891e63
  section: weaknesses
  axis: weakness
  text: 'Arrogant, carbonadium and the Muramasa sword can negate his regeneration, his lack of Adamantium-laced
    ligaments/cartilage means his bones can be disconnected at their joints. Notes: *Due to how wielders
    of sharp adamantium weaponry have consistently been depicted as capable of harming characters far
    above their tiers, we are forced to list separate ratings for them to accommodate this. We are well
    aware that this technically does not make sense, but it is likely the least bad available option to
    not ignore this ongoing plot convention. Please note that this does not remotely scale to their base
    statistics/raw energy outputs. *Before making any changes to this page, please read and follow the
