    Jeff!: Infinity Comic Vol 1 13) *Toon Force (The generally silly and comedic nature
    of many of Jeff''s stories has made him able to accomplish feats that would otherwise
    be impossible or even nonsensical. Aside from the achievements listed below, Jeff
    managed to swap his round sled with Captain America''s shield in a matter of moments,
    despite the two being located in totally different parts of the world and without
    letting the hero notice the change until the very last moment.It''s Jeff!: Infinity
    Comic Vol 1 4 Jeff could also somehow obtain a complete Infinity Gauntlet) **Hammerspace
    (Swallowed way too much food, some random objects and even the Infinity Gauntlet.It''s
    Jeff!: Infinity Comic Vol 1 10 A recurrent trope of his is the habit of ingurgitating
