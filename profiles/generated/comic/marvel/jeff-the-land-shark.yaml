    Comic Vol 1 17 Pulled out a wrist watch out of nowhere) **Elasticity (Jeff''s
    body took the shape of a large cheese wheel he had ingurgitated. Not yet satisfied,
    he was ready to swallow two moreIt''s Jeff!: Infinity Comic Vol 1 38) **Body Control
    (Pulled out pockets from the sides of his body) **Stealth Mastery (Stole Captain
