  intelligence:
    text: 'At least Average Jeff is usually portrayed as somewhat animalistic, but
      in actuality he should rather be compared to a clever child. Jeff has demonstrated
      time and time again the ability to grasp many human concepts and utilize tools
      such as money,It''s Jeff!: Infinity Comic Vol 1 37 telephones, costumesIt''s
      Jeff!: Infinity Comic Vol 1 3It''s Jeff!: Infinity Comic Vol 1 18 and pretty
      much any sort of everyday object and item.It''s Jeff!: Infinity Comic Vol 1
      11 Jeff also possesses good levels of ingenuity and creativity, which he uses
      to solve tasks, produce art and carry out many little exploits. Jeff feels a
      variety of tipically human emotions, such as altruism, sloth, resentfulness,
      justice and more. Apparently takes part in the household chores of his home
      and enjoys movies.It''s Jeff!: Infinity Comic Vol 1 22 Some of his compositions
      include a dress made of knotted flowers,It''s Jeff!: Infinity Comic Vol 1 5
      a few bricolage creationsIt''s Jeff!: Infinity Comic Vol 1 34 and state-of-the-art
      snow sculptures. Jeff could also utilize the Eye of Agamotto, Falcon''s Wings,
      Black Widow''s gauntlets, Hawkeye''s arrows and Iron Man''s Hulkbuster armor.It''s
      Jeff!: Infinity Comic Vol 1 33 Despite often fooling around, his resourcefullness
      lets him solve problems either by himself or with help from his many friends.
      Could read the label of a toy and understand that its manufacturer was M.O.D.O.K.
      While reduced to a minuscule size, Jeff used the magnifying effect of pair of
      glasses to make an ant believe he was bigger than he truly was.It''s Jeff!:
      Infinity Comic Vol 1 19 Used a portal-making device to trick the Hulk and steal
      his food multiple times.It''s Jeff!: Infinity Comic Vol 1 32 Intelligently used
      one of Doctor Strange''s magic items to save him from a monster.It''s Jeff!:
      Infinity Comic Vol 1 36 Appears to be a talented singer and supported Cosmo
      in his plan to recover the Infinity Stones from the Grandmaster, while also
      escaping from his capture.Infinity Paws: Infinity Comic Vol 1 8 Jeff has some
      degree of battle experience, having often supported his friends against various
      foes. WoG even states "nobody is [Jeff''s] owner, he''s not a pet, like he''s
      too, he''s just slightly too smart to be able to be anyone''s pet, so I like
      showing him sort of bouncing around the Marvel Universe, I think that''s one
      of his strengths as a character is that he can do that, and everyone just accepts
      it... He just sort of does what he wants and because everybody likes him, just
      sort of allows it."GateCrashers'
    source_ids:
    - vsbattles-jeff-the-land-shark-marvel-comics
    confidence: 0.6
