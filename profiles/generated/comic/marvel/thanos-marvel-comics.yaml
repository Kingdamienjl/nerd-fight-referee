- id: claim-weaknesses-5f927142
  section: weaknesses
  axis: weakness
  text: 'None notable | Needs to have the Infinity Gauntlet/gems to maintain his power. Subconsciously
    let himself be defeated for not finding himself worthy of his power, however, this did not stop him
    from accomplishing multiple victories before his downfall Notes: *Do not attempt to scale Thanos to
    characters using the Thanos Returns and Thanos Wins storylines by Donny Cates. Several of the feats
    performed by Old King Thanos were performed off-panel via unknown means, and several of the on-panel
    ones would be extreme outliers if used to scale the present-day Thanos. *Do not attempt to scale Thanos
    to other mainstream Marvel characters using the storylines The Infinity Siblings, The Infinity Conflict,
    and The Infinity Ending by Jim Starlin. These stories severely and repeatedly contradict the canon
    of not only the main Universe 616, but the entire Marvel Multiverse, and seem to be ignored by every
    other writer and narrative. Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
