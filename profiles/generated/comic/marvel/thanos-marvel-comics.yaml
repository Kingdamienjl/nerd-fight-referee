  text: 'By himself= *Superhuman Physical Characteristics **Immortality (Types 1 & 6) **Regeneration (Mid-Low)
    **Enhanced Senses (Likely detected & caught a rock being thrown at him without looking at it. Identified
    a Skrull being turned into another alien. Smelled Pip the Troll leaving his Sanctuary) *Genius Intelligence
    *Telepathy & Mind Manipulation (Had a mind war with Moondragon and won. Destroyed Pit the Troll''s
    mind. Mind controlled the Hulk) *Perception Manipulation & Madness Manipulation (Via Mind-Sync Time-Warp;
    Can alter the perception of others, attempting to drive them mad and make their minds his slaves)
    *Possession (Can upload his consciousness into the mind of a living target, overcoming it) *Magic
    *Hacking (Casually jamed Shi''ar''s sophisticated interstellar networks) *Energy Manipulation & Projection
    *Could completely stop Mjolnir being thrown at him by unknown means *Forcefield Creation (Has technology
    that allows him to activate invisible, normal or 3 personal forcefields. On his own able to use a
    forcefield around himself and on other things to keep them from others) *Summoning *TeleportationThe
    Infinity Revelation: pg. 12Avengers Annual #7: pg. 32 *Astral Projection *Petrification (Once petrified
    a Skrull, killing him) *Curse Manipulation (Cursed Deadpool with eternal life) *Flight (Can fly on
    his own) *Matter Manipulation (Can dissolve molecules) *Death Manipulation (Can give a permanent death
    to inhabitants of the Cancerverse, a universe where death does not exist) *Life Manipulation (Drained
    the life force of a being and bestowed it to another) *Healing (Healed a cleric) *Portal Creation
    (Created a portal that allowed him to travel to another point of existence) *Stealth Mastery (Demonstrated
    here. His armor also has a cloaking device) *Sealing (Attempted to seal Odin) *Paralysis Inducement
    (Can unleash blasts of paralyzing energy) Annihilation #2: pg. 5-6 *Formerly had Immortality (Type
    5) Resistance to: *Reality Warping (Was able to keep hold of himself after he entered the Nexus of
    Reality) *Mind Manipulation & Telepathy (While having the Mind Gem, Moondragon was unable to read
    his mind) *Black Holes (Survived being sucked inside a miniature black hole that collapsed on itself)
    *Hellfire Manipulation (Withstood an explosion of Hellfire from Cosmic Ghost Rider) *Matter Manipulation
    (Is unaffected by Corvus Glaive''s Glaive) Thanos #1: pg. 13 *Energy Manipulation (The energies Thanos
    imploy are strange and hard to manipulate) Annihilation #2: pg. 7 *Fear Manipulation (Resisted Cloak''s
    fear inducing powers.) *Possibly Pressure Points (Shruggs off a pressure strike that would kill most
    other beings) Warlock and the Infinity #8: pg. 18-19 |-|Infinity Gauntlet= All in base to an unfathomably
    greater extent, plus: *Precognition & Cosmic Awareness (Users of the gauntlet see time as a repeating
    loop; Whereas others experience the present, the users have already lived that before several times,
    only allowing themselves to make unimportant mistakes. This applies to characters as fast as several
    abstracts and a casual The Living Tribunal. It''s stated that every moment that ever was or will be
    cascades over the user) *Reality Warping **Spatial Manipulation **Time Manipulation **Mind Manipulation
    **Energy Manipulation **Soul Manipulation **Age Manipulation (Made the Runner more than a million
    years old and turned him into a baby) **Elemental Manipulation **Biological Manipulation (Blew up
    two of Death''s minions from the inside. Constantly tortured Nebula and Eros by altering their bodies)
    **Explosion Manipulation **BFR (Can trap people inside the Soul gem, can vanish others, etc.) **Creation,
    Life & Death Manipulation (Created life. Eliminated half of the universe) **Time Stop (Caused time
    to come to a standstill, froze Earth''s defenders in time) **Size Manipulation **Portal Creation (Created
    a portal between him and an enemy attack to avoid it, could open time portals which would pull opponents
    to the prehistoric past, etc.) **Time Travel **Transmutation (Turned Wolverine''s bones into rubber,
    turned "Thor" into glass, turned Nova into Toy Blocks) **Status Effect Inducement (Demonstrated here,
    here & here) **Absorption (Absorbed the combined attack of several cosmic beings) **Sealing (Imprisoned
    the cosmic beings, including Eternity) **Multilocation (Can ignore distance itself and appear in multiple
    places simultaneously) **Soul-based Morality Manipulation (Redirected Drax''s motivation to kill him
    towards the Silver Surfer) **Power Bestowal (Can give others Immortality and small portions of his
    power) **Cloth Manipulation (The gauntlet attacked Mephisto when he tried to steal it) **Non-Physical
    Interaction (Can harm abstract entities) **Access to all the powers the Infinity Gauntlet has (Only
    demonstrated using the ones listed earlier) Resistance to: *Sealing & BFR (Resisted Cloak''s pull
    into the dark dimension.Infinity Gauntlet Vol 1 5 ) *Empathic Manipulation (Rebelled against Mistress
    Love and Sire Ha'
