  intelligence:
    text: "Gifted (She managed to graduate at the top 10 percent of Summa Cum Laude.She-Hulk (vol. 1)\
      \ #1 As a lawyer she was able to win a court case that was rigged against her,The Savage She-Hulk\
      \ #18 defended Dark Art by pointing out that the arresting officer performed an illegal search,She-Hulk\
      \ (vol. 1) #1 laid down a strong defense for Jonathan Powers,She-Hulk (vol. 2) #29 threatened Superior\
      \ Spider-man with lawsuits,Mighty Avengers #5 defeated Matt Murdock in the trial of Captain America,She-Hulk\
      \ (vol. 3) #10 prevented Luke Cage from selling the Mighty Avengers name by writing safeguards into\
      \ the contract.Mighty Avengers #2 She is a skilled negotiator, as she was able to calm Scorpion\
      \ down before Spider-man got in the way,She-Hulk (vol. 1) #4 convinced Hercules to pay a super villain\
      \ he injured,She-Hulk (vol. 1) #9 convinced several soldiers not to fire on her for their own safety,She-Hulk\
      \ (vol. 2) #38 used a time paradox to create an opening.She-Hulk (vol. 2) #3 She is also a proficient\
      \ hand-to-hand combatant, trained by some of the greatest martial artists in the Marvel universe\
      \ such as Captain America and Gamora. A quick thinker, she tricked the Seeker into crushing himself,The\
      \ Savage She-Hulk #21 caused a pair of robots to crash into each other,Sensational She-Hulk in Ceremony\
      \ #2 saw through Mysterio's tricks,The Sensational She-Hulk #2 wrapped her fist in insulation to\
      \ defeat Electro,The Sensational She-Hulk #58 set the Ranger and Boomerang against each other,The\
      \ Sensational She-Hulk #59 snuck out of a SHIELD prison by changing back into Jennifer Walters,Marvel\
      \ Graphic Novel No. 18 \u2013 The Sensational She-Hulk convinced The Champion to remove his Infinity\
      \ Gem due to it qualifying as a weapon under Skardon Law,She-Hulk (vol. 1) #8 used Electro to defeat\
      \ Tiger Shark,She-Hulk (vol. 1) #6 and used Powderkeg to defeat Rhino,She-Hulk (vol. 1) #6 avoided\
      \ destroying a passenger plane by changing back into Jennifer Walters,She-Hulk (vol. 2) #32 tricked\
      \ Abomination into lowering his guard by belittling him,She-Hulk (vol. 2) #15 led several Red-Hulk\
      \ soldiers to fight each other,Fall of the Hulks: The Savage She-Hulks #3 used a robot's raygun\
      \ to destroy its companion,Mighty Avengers #8 and has years of experience fighting against all manner\
      \ of foes. She was able to easily dispatch several opponents much bigger than herself in human form.\
      \ She is a skilled pilot and mechanic, and created her own Wakandan suit along with T'Challa), High\
      \ Animalistic at peak rage."
    source_ids: *id002
    confidence: 0.95
