    here) *Electricity Manipulation (His boots are insulated, making him able to move
    through Fixer''s electric hall unharmedAvengers Unlimited: Infinity Comic 64)
    *Radiation *Adhesive Manipulation (Trapster''s glue could not stick on Captain
    America''s specially-trated shieldSpider-Man, Spider-Woman, Hulk, Captain America
    Vol 1 1) *Heat (His shield was unaffected even by Gladiator''s beams, which are
    hotter than a starFantastic Four Vol 1 250)'
