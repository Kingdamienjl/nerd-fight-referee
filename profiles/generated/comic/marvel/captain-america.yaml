- id: claim-weaknesses-9ee8e37f
  section: weaknesses
  axis: weakness
  text: 'He refuses to kill unless necessary; none notable otherwise. Feats: *Strength:
    **Broke himself out of a large block of ice. **Held up part of a fallen building
    with the help of his energy shield. **Closed the doors of a missile silo by manually
    turning the gear. **Stopped an elevator with his shield. **Destroyed an ice giant
    with a shield throw. **Changed the course of a fighter jet. **Forced a jet to
    change direction by messing with the wing flap. **Held up a lot of concrete, then
    made a man-sized hole in it with a single strike. **Knocked over a big statue
    while restrained. **Bench pressed 1100 pounds. **Pulled down a mini helicopter.
    **Broke several bolts or steel wires while restrained. *'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-aae6cb7e
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Genius Intelligence *Longevity (Ages
    slower than ordinary men. Spent 12 years in the Dimension Z but didn''t look a
    day older) *Enhanced Senses (Vision & Hearing: His sight and hearing are far superior
    to ordinary humans) *Precognition (Analytical Prediction: Possesses a "Well-Honed
    Sixth Sense" which allows him to instinctively react to his enemies'' movements,
    often moments before they occur) *Vehicular Mastery (Proficient inCaptain America
    Vol 1 259 driving motorcyclesCaptain America Vol 1 336) *Regeneration (Mid-Low:
    Healed from a bullet injury after a short duration. Mid overtime: Recovered from
