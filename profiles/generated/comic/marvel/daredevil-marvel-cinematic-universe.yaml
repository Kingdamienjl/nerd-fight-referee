- id: claim-standard-equipment-789bedc0
  section: equipment
  axis: equipment
  text: '* Armour Suit: Created by a designer named Melvin Potter, the suit is made of a light yet extremely
    durable material, with Murdock requesting it to be designed after the devil to reflect his devout
    Catholicism and be a symbol. The helmet is outfitted with a carbon nanotube-based alloy and red lenses
    in the eyeholes. The suit also included a pocket located on the left hip of the suit to allow Daredevil
    to store his Billy Club. After the Blip, Murdock would get his suits tailored by Luke Jacobson. These
    new suits function near identically to those made by Melvin Potter. * Billy Club: Created by Potter,
    it can be used as a short staff, or two individual sticks joined by a high tensile wire. Additionally,
    the sticks can be be separated. The Billy Club uses a special steel fibre composite cable that makes
    it nearly indestructible, allowing it to extend to a target or function as a grappling hook. Luke
    Jacobson would later upgrade the Billy Club to have a manrikigusari hidden inside of it.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
