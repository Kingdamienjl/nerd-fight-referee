- id: claim-weaknesses-95757257
  section: weaknesses
  axis: weakness
  text: 'Annihilus is extremely paranoid, and much of his powers depend on the Cosmic
    Control Rod. When he possessed the Quantum Bands, they never truly chose him,
    and if they made contact with a goodhearted individual, they would leave him.
    He is blunt and straightforward, favoring overwhelming force above all else. Note:
    Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics. ==References== {{reflist|2}} ==Gallery== Annihilus-Guardians
    of the Galaxy 2019.png ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions}}
    Category:Characters Category:Marvel Comics Category:Aliens Category:Antagonists
    Category:Comic Book Characters Category:Energy Users Category:Evil Characters
    Category:Flight Users Category:Immortals Category:Leaders Category:Male Characters
    Category:Matter Users Category:Regeneration Users Category:Telekinesis Users Category:Telepaths
    Category:Teleportation Users Category:Villains Category:Rage Users Category:Insects
    Category:Forcefield Users Category:Widowed Characters Category:Married Characters
    Category:Life Users Category:Absorption Users Category:Summoners Category:Resurrection
    Users Category:Mass Murderers'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
