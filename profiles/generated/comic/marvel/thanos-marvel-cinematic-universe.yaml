power_scale:
  tier:
    text: 'At least {{High 6-A}}, higher with the Double-Bladed Sword, {{4-C}} with
      the Reality Stone, {{Varies}} up to {{3-A}} with the Power Stone, at least {{3-A}}
      with the complete Infinity Gauntlet, {{Low 2-C}} Environmental Destruction with
      the Time Stone Name: Thanos Origin: Marvel Cinematic Universe Gender: Male Age:
      1000 years old at the time of his deathHere''s why ''Infinity War''s'' Thanos
      is the most compelling Marvel film villain yet Classification: Titan, The Mad
      Titan, The Dark Lord, Galactic Overlord, Universal Genocide'
    source_ids: &id002
    - mediawiki-1632354
    confidence: 0.95
  attack_potency:
    text: 'At least Multi-Continent level (Can fight those capable of harming him.
      Easily overpowered and knocked out Hulk. Dealt significant damage to Mark 50
      Iron Man. Easily crushed a replica of the Eye of Agamotto. His younger self
      overpowered Post-Awakening Thor, Mark 85 Iron Man and Captain America with Mjölnir.
      Should be far stronger than his subordinates, like Ebony Maw and Cull Obsidian646.57085
      Petatons), higher with the Double-Bladed Sword (Broke Captain America''s vibranium
      shield), Star level with the Reality Stone (The Aether can consume the Nine
      Worlds,Thor: The Dark World including Nidavellir and Muspelheim, which is a
      Dyson sphere around a starWhat we learned on the set of Thor: Ragnarok: From
      Jack Kirby to Planet Hulk), Varies (Stated to have variable power output depending
      on the size of the target) up to Universe level with the Power Stone (Stated
      to be a power source capable of destroying the universeGuardians of the Galaxy:
      The Junior Novel), at least Universe level with the complete Infinity Gauntlet
      (Threatened to shred the universe down to its last atom and then create a new
      one. The combined power of the Infinity Stones can give one the ability to decimate
      the universeThe Road to Avengers: Infinity War - The Art of the Marvel Cinematic
      UniverseDespite the Infinity Gauntlet being Low 1-C for using the combined power
      of all six of the Infinity Stones, it is unknown if Thanos would have been able
      to affect space and time with his snap. The least he would have been able to
      do, as he himself said, was shred the universe down to its last atom, and for
      this reason he scales to this feat.), Universe level+ Environmental Destruction
      with the Time Stone (Reckless manipulation of the Time Stone can break the space-time
      continuum,Doctor Strange (2016) causing irreparable harmGuidebook to the Marvel
      Cinematic Universe - Doctor Strange). Can ignore durability with many abilities'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Subsonic combat and reaction speed (Reacted to Captain Marvel flying in
      battle and threw his sword into the Quantum Tunnel before she could reach it.Avengers:
      Endgame Screenplay Can keep up with Post-Awakening Thor, Captain America with
      Mjölnir, and Mark 50 Iron Man. Blitzed Hulk), Massively Hypersonic+ attack speed
      with the Infinity Gauntlet (Threw meteors at these speeds)'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class P, likely higher (Overpowered Thor and nearly pushed Stormbreaker
      into his chest. Pushed through full-powered repulsor beams from Mark 85 Iron
      Man charged by Thor. Easily overpowered Hulk. Could throw Doctor Strange's whips
      around when the latter tried to restrain him)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At least Multi-Continent level (Broke parts of Mark 50 Iron Man. Drew blood
      from Thor and Hulk), higher with the Double-Bladed Sword
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'At least Multi-Continent level (While already badly wounded from Stormbreaker,
      he endured the power surge from the completed Infinity Gauntlet, which was stated
      by Rocket Raccoon to be of cosmic proportions beyond anything seen before, which
      would at least put it above the Power Stone’s world wipe. However, the second
      surge generated when Thanos snapped the completed Infinity Gauntlet to atomize
      the Infinity Stones, which was unquantifiable by value, nearly killed him, left
      half of his body burnt and took away his life essence.The Art of Avengers: Endgame
      Could hold the Power Stone in his bare hand. Endured attacks from Scarlet Witch
      when she was bloodlusted, albeit was eventually overwhelmed. Took numerous attacks
      from Thor, Captain America with Mjölnir, Mark 85 Iron Man, Captain Marvel and
      Hulk. Mark 50 Iron Man only drew a single drop of blood after a prolonged engagement),
      higher with armor, far higher with his Double-Bladed Sword (Blocked Mark 85
      Iron Man''s overloaded repulsor beams after absorbing Thor''s lightning, which
      equates to 3.071 Exatons), even higher with Energy Shields (Blocked an attack
      from Scarlet Witch with the Space Stone)'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Can simultaneously fight with Thor, Iron Man and Captain America
      for long periods of time. Kept fighting even after enduring a brutal assault
      by Scarlet Witch. Fought many heroes at the same time on Titan without signs
      of exhaustion)
    source_ids: *id002
    confidence: 0.95
  range:
    text: 'Extended Melee Range, higher with the Double-Bladed Sword, Kilometers with
      the Mind Stone (Its energy beams reached the borders of the Westview townWandaVision:
      Season 1 Episode 9 - The Series Finale), Planetary with Telekinesis (Able to
      pull Titan''s moon fragments while still on the planet), Stellar with with the
      Reality Stone (The Aether can consume the Nine Worlds, including Muspelheim,
      which is a Dyson sphere around a star), Varies up to Universal with the Power
      Stone (Stated to be a power source capable of destroying the universe), Universal
      with the complete Infinity Gauntlet (Turned half of all life in the universe
      into dust. His past self threatened to shred the universe down to its last atom
      and then create a new one. The combined power of the Infinity Stones can give
      one the ability to decimate the universe), Interdimensional with Portal Creation
      (Can create wormholes that facilitate interdimensional and space-time travel,
      credited to be a key that unlocks the door to myriads worlds across multiple
      dimensionsThe Art of Marvel''s The Avengers), Low Multiversal with the Time
      Stone (While time was being stopped on Earth, Doctor Strange used the Time Stone
      to also bring time to the Dark Dimension, which is another universe and an amalgamation
      of countless dimensions, trapping Dormammu in an inescapable time loop even
      though he has absolute control over the Dark Dimension and its reality.Marvel
      Website: Dormammu Reckless manipulation of the Time Stone can break the space-time
      continuum, causing irreparable harm)'
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Extraordinary Genius (Thanos is a cunning and ruthless individual with
      an intellect sharpened by centuries of experience. A brilliant strategist, commanding
      vast armies that have devastated countless worlds and destroyed empires across
      the galaxy, which earned him renown as one of the most fearsome warlords in
      the universe. A master tactician who manipulated events, such as Loki''s attack
      on New York and Ronan''s retrieval of the Orb to set the stage for his pursuit
      of all six Infinity Stones.Marvel Website: Thanos An incredibly skilled combatant,
      who easily outmaneuvered heroes such as Thor, Hulk, Iron Man, Doctor Strange
      and Captain America during their confrontations. Quickly and intuitively learned
      and mastered how to wield the Infinity Stones, being the real master of them,
      understanding their true power and capable of harnessing the Stones'' powers
      on a completely different level, unlike their previous owners.The Art of Avengers:
      Infinity War He found a way to time travel from 2014 to 2023 after obtaining
      Pym Particles, and reverse-engineered and mass-produced them alongside Ebony
      Maw.‘Avengers: Endgame’ directors just explained some of the movie’s biggest
      mysteries He is also an incredibly charismatic master manipulator who can bend
      even the most powerful beings to his will) Standard Tactics: Thanos'' fighting
      style greatly varies based on the version used and how many Infinity Stones
      he has. The two main versions that this profile covers are the one from Infinity
      War and the one from Endgame. *The first one is a honorable warrior, who prefers
      not to kill his opponents if not needed and will first try to incapacitate them,
      unless he sees them as a serious threat to his plans, in which case he won''t
      have problems killing the opponent if he has a chance to. It is unknown how
      he fight with his Double-Bladed Sword, but with the Stones he will try to quickly
      defeat the opponent with powerful attacks from his Power Stone or by incapacitating
      them with the Reality Stone and the Space Stone, but if that doesn''t work then
      he will go for more lethal attacks. When equipped with the Complete Gauntlet,
      his first move will be to snap his finger in order to destroy his opponent,
      deconstructing them and turning them into ashes. *The second one, instead, is
      much less honorable, being far more ruthless and sadistic with little regards
      towards anyone. He won''t have any problems with trying to kill his opponent
      even if they aren''t an immediate threat to him. This is reflected into his
      fighting style with the Double-Bladed Sword, since with it he will try to continuously
      attack the opponent, without giving them the time to counter-attack. He was
      never seen using the Stones singularly, except for the Power Stone which he
      used briefly against Captain Marvel. His first move when equipped with the Complete
      Gauntlet, instead, is to use it to destroy the whole Universe with a snap of
      his fingers.'
    source_ids: *id002
    confidence: 0.95
