- id: claim-standard-equipment-eba4b05a
  section: equipment
  axis: equipment
  text: 'Armor, Double-Bladed Sword (Formerly for his Sacred Timeline self), Infinity
    Gauntlet *The Infinity Gauntlet: A powerful gauntlet forged from Uru melted by
    the blazing power of a neutron star by the Dwarf King Eitri, under the strict
    command and supervision of Thanos himself under threat of death. With it, Thanos
    can collectively harness the power of all Six Infinity Stones, efficiently channeling
    and commanding their might without risk of misdirection or backfiring. **Power
    Stone: Directly linked with, and representing all Power in the Universe, the Power
    Stone grants Thanos immense, unrivaled power on a cosmic scale, allowing him to
    effortlessly tear apart the surface of worlds and moons, as well as destroy his
    enemies with blasts of cosmic energies. **Space Stone: Directly linked with, and
    representing all Space in the Universe, the Space Stone grants Thanos direct control
    over the fabric of Space itself, allowing him to telekinetically throw parts of
    Titan''s destroyed moon, levitate, and fold space to create portals so that he
    may instantaneously traverse across the universe. **Reality Stone: Directly linked
    with, and representing Reality itself, the Reality Stone grants Thanos the ability
    to mold and reshape the fabric of reality as he sees fit, allowing him to effortlessly
    transmute anything and anyone in his vicinity, create tangible illusions, and
    reform the entire landscape in which he''s in. **Soul Stone: Directly linked with,
    and representing the souls of all sentient beings in the Universe, the Soul Stone
    grants Thanos the power to manipulate the souls of his victims. **Time Stone:
    Directly linked with, and representing all Time in the Universe, the Time Stone
    grants Thanos direct control over the fabric of Time itself, allowing him to halt,
    revert, and accelerate its flow, as well as generate endless time loops. **Mind
    Stone: Directly linked with, and representing the minds of all sentient beings
    in the Universe, the Mind Stone grants Thanos the capability to influence and
    control the minds of his enemies. However, he has yet to demonstrate the Mind
    Stone''s powers in any meaningful way.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
