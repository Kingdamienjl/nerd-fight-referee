- id: claim-weaknesses-3c199e40
  section: weaknesses
  axis: weakness
  text: 'He must be able to move his hand to activate the Infinity Stones. Continuous
    usage of the Stones had a toll on his body, as his left arm has been permanently
    damaged Note: *As discussed and accepted in this thread, the Infinity Stones are
    stated to be powerful enough to impact a four dimensional being like Dormammu,
    even to the point of cowing him and halting his actions, therefore their hax must
    also be 4-D in order to being able to affect him. ==Gallery== Avengers Infinity
    War-Thanos uses Reality Stone.gif Avengers Infinity War-Strange transmutes vortex.gif
    Avengers Infinity War-Thanos absorbs and redirects fire.gif Avengers Infinity
    War-Thanos incapacitates Banner.gif Avengers Infinity War-Thanos nulls.gif ==Notable
