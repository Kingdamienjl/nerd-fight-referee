- id: claim-powers-and-abilities-342150f8
  section: abilities
  axis: hax
  text: 'Base= *Superhuman Physical Characteristics **Multiple Selves (Type 3; Cletus
    and Carnage coexist in a symbiotic relationship) **Enhanced Senses **Immortality
    (Type 3) ***Regeneration (Low-High; the Symbiote is in Cletus''s bloodstream and
    it can reform itself from a puddle of flesh or even a cell) *Surface Scaling (Can
    adhere to and climb nearly any surface) *Body Control, Shapeshifting, Transformation,
    Elasticity & Weapon Creation (The Carnage symbiote is able to restructure itself
    in various ways, such as tentacles, spikes, blades, or even wings, and can form
    a variety of disguises and shapeshift to resemble clothes and even other people)
    *Size Manipulation (Can also manipulate itself to a molecular size and back to
    normal size) *Stealth Mastery & Camouflage (Carnage''s stealth is effective enough
    to bypass the Spider-Sense of Spider-Man) *Thread Manipulation (Can produce organic
    webbing) *Flight (Carnage can grow a pair of wings and use them to fly) *Technology
    Manipulation (Symbiotes can bond to inorganic material, letting them interface
    with and augment machinery as sophisticated as a cyborg, the Ironheart Armor Model
    2,Venomized Volume 1 Issue 1 and a Kree Empire battleship.Venom: First Host Volume
    1 Issue 3 Carnage and its host possess the ability to physically enter into the
    Internet on a "molecular level" and travel between hard-wired computers through
    Ethernet cables) *Duplication (Symbiotes reproduce asexually and are able to create
    new Symbiote spawn from small pieces of their body or severed body partsVenom:
    Space Knight Volume 1 Issue 12) *Limited Reactive Evolution (When Kasady was taken
    into space by the Sentry, the Carnage symbiote was able to save his life by growing
    small sacks around his mouth that converted carbon dioxide into oxygen) *Mind
    Manipulation (By connecting one of his tendrils to someone''s brain, he can screw
    with their mind by sharing his own thoughts and driving them insane) *Madness
    Manipulation (Type 2) *Illusion Creation (Entered Eddie Brock and put him in an
    illusion, which he initially believed was real and falsely spent 2 weeks on, despite
    far less time really happening. Claimed he could make Eddie relive every horrific
    nightmare and fear for a whileVenom (2018) issues 23, 24 & 25) *Acrobatics (Hypermobility
    & All-Terrain Mobility) *Possession (Can spread his Symbiote to others and possess
    them) *Resistance Negation Resistances to: *Disease Manipulation *Poison Manipulation
    *Sound Manipulation *Fire Manipulation (Thanks to his Darkhold augmentations,
    he can now resist heat as hot as re-entry which is as hot as 1650 degrees Celsius)
    |-|Dark Carnage= All previous powers plus, *Mind Manipulation (Able to infect
    living things with ''Brain Symbiotes'' that place them under his control) *Resurrection
    (Able to reanimate corpses with Brain Symbiotes) *Sound Manipulation (Created
    a symbiote clone able to perfectly impersonate Eddie Brock), *Biological Manipulation
    (Able to control the bodies of those he infects with Brain Symbiotes, turning
    them into four-armed monsters) Resistance to: *Hellfire Manipulation (Was unfazed
    by Andrea Benton''s hellfire) |-|God Carnage= **All the Powers and Abilities of
    Knull (Defeated a variant of Knull and absorbed his strength, taking control of
    all Knull''s power)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
