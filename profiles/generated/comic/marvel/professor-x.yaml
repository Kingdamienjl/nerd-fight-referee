    Category:Memory Users Category:Illusionists Category:Psychometry Users Category:Humans Category:Mutants
    Category:Mutants (Marvel) Category:Geniuses Category:Wheelchaired Characters Category:Leaders Category:Adults
    Category:Astral Projection Users Category:Pain Users Category:Goo'
  source_ids: *id003
