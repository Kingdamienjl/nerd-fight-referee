- id: claim-weaknesses-5f163fb0
  section: weaknesses
  axis: weakness
  text: 'An unknown extra-dimensional monster caused him a degree of power loss. Although he cannot be
    hurt by any man made weapons (and possibly chemicals too), Dr. Emil Burbank created a device which
    can send certain commands into Hyperion''s mind, making him believe he is hurt. Since childhood, he
    was raised in a house which was no different than a prison, so he lacks real-world knowledge and information
    about certain things. His lack of social interaction can cause him to fallout easily with those he
    considers friend. Feats: *List of his feats'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-66a1a6f4
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Flight, Spaceflight, Atomic Vision (can emit powerful beams
    of energy from his eyes, capable of disintegrating humans and animals alike), Enhanced Vision (Can
    see the molecule structure of a chlorophyll, can see past walls and houses for many miles. With his
    X-Ray vision, he can unravel the human anatomy and look beyond their flesh. ), Super Hearing (He can
    hear even the faintest of the voices for over 50 miles and can filter through them easily.), Self-Sustenance
    (Types 1 and 3), Limited Electricity Manipulation (His battle with another hero caused the air to
    supercharge, which created storms and lightnings.), Heat Manipulation (He can manipulate heat with
    his Atomic Vision, allowing him to burn off things and people, as well cause sunburns.), Regeneration
    (High-Low: healed his burnt eyes in a very short timeframe.), Immortality (Type 1), Limited Telekinesis
    (Shown here) Resistance to: extreme cold (shown here), toxins (shown here), radiation (A powerful
    atomic bomb, which was designed to kill him, blew up in his face, but he survived it. Additionally,
    he was unaffected by a huge radiation explosion created by his teammate.), cosmic radiation and extreme
    temperature. Heat Manipulation and Fire Manipulation (He can withstand extreme heat temperatures of
    explosions and atmosphere reentry. Additionally, he fought Johnny Storm where he was unaffected by
    his fire.), Disease Manipulation (Cannot get sick), Limited Absorption (Resists being absorbed by
    the Shape, however, his power can be stolen.)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
