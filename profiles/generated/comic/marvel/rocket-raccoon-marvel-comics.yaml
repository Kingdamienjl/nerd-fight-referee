    six systems".Rocket Raccoon Vol 3 1 Despite this, he is worse with Earth guns, since they are too
    primitive for him) ** Vehicular Mastery (Rocket is an ace pilot,Guardians of Infinity Vol 1 4 capable
    of maneuvering spaceshipsAnnihilation: Conquest - Starlord Vol 1 4 of various types.Annihilators Vol
    1 2 He can also operate submarines,Rocket Raccoon Vol 2 10 motorcycles,Rocket Raccoon Vol 2 11 and
    animal mountsGuardians of Infinity Vol 1 2) ** Preparation (Rocket can create advanced weaponry from
