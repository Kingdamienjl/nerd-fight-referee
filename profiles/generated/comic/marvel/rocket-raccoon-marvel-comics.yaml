- id: claim-standard-equipment-38170513
  section: equipment
  axis: equipment
  text: '*Space Survival (Possesses various space suitsMarvel Tsum Tsum Vol 1 1) *Energy Projection (Possesses
    various weapons which can shoot an energy beamAvengers No Road Home Vol 1 2) *Flight (Via jetpacks)
    *Explosives (Rocket possesses bazookas,Annihilation: Conquest - Starlord Vol 1 2 grenades for both
    large-scale,Guardians of the Galaxy Vol 2 1 and cluster-bombsRocket Raccoon Vol 2 6) *Information
    Analysis (Can analyze for life signs,Guardians of the Galaxy Vol 2 25 and possesses tracking devices,Guardians
    Team-Up Vol 1 2 of multiple typesRocket Vol 1 2) *Paralysis Inducement (The Rampart Arms Phasic Cannon,
    when set at only 25% of its power, can paralyze a weakened Thanos long enough for them to eject him)
    *Via the Timely Inc. Shipment Processing and Analysis Device: **Automatic Translation (As shown hereAnnihilators
    Vol 1 1) **Information Analysis (Can give context and information on Rocket''s surroundings, oncoming
    threats and time to perish) ***Resistance to Illusion Creation (The device can figure out if something
    is artificial through analysisAnnihilators: Earthfall Vol 1 2) **Summoning and Water Projection (The
    Device can access Timely Inc.''s inventory to deliver objects as Rocket demands, and he uses it to
    modify a region''s atmosphere to create an instant monsoon) **Teleportation (Can teleport Rocket and
    Groot out of dangerous situations in Timely Inc. boxesAnnihilators Vol 1 3) **Rocket eventually modified
    the device such that it can move and act autonomously, and wield weaponsAnnihilators: Earthfall Vol
    1 3 *Possesses a phone-like device that can transmit across the galaxy.Guardians of the Galaxy Vol
    3 4 *Acid Manipulation and Resistance to Acid Manipulation via the Azalian Acid Capsules (The capsules
    bond to you as you burst it in your mouth, making you resistant to it while giving you acidic spit
    strong enough to melt metalHoward the Duck Vol 5 2) *Hacking (Nanolingos are microscopic bots that
    can transmit through spit into wiring and reform interfaces, allowing Rocket to easily hack into security
    systems) *Electricity Manipulation (Possesses weapons that project electricity blasts) *Status Effect
    Inducement (Possesses weapons that can stun opponents with a knockout beamAngela: Asgard''s Assassin
    Vol 1 5) *Solar Light Projection and Plant Manipulation (Rocket possesses grenades that can explode
    into bright flashes, all the while supplying nearby plant life with a burst of solar light and macronutrients
    to increase their growth rate exponentiallyGroot Vol 1 5) *Flamethrower (Creates oneRocket Raccoon
    Vol 3 5 from random shower devices in minutes) *Laser Projection and Heat Projection (Possesses a
    laser which can cut a hole through the glassAll-New Guardians of the Galaxy Vol 1 2) *Antimatter Manipulation
    (Possesses antimatter charges capable of blowing holes into ships) *Forcefield Creation (As shown
