- id: claim-powers-and-abilities-2fdfa8c4
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Magnetism Manipulation and Electricity Manipulation (Magneto
    is an Omega Level Mutant with power over the Electromagnetic spectrum.House of X #1 Generates a planetary
    EMPX-men 1991 #25), Expert Martial Artist, Matter Manipulation (Magneto draws power from the Earth''s
    Magnetic field and manipulates every molecule and atom in Colossus''s body.Uncanny X-men 1963 #212
    Magneto manipulates iron at the atomic levelX-men Legacy 2008 #256), Energy Manipulation and Projection
    (Magneto stalemates Doctor Doom in a blast struggle.Avengers The Children''s Crusade #4 Together,
    while he is dying, Magneto and Storm blast Uranos enough to make him bleedX-Men:Red 2022 #5), Energy
    Absorption (Magneto draws power from the Earth''s magnetic field and manipulates every molecule and
    atom in Colossus''s body. Magneto siphons energy from the earth to boost his power.Magneto 2014 #18
    Magneto absorbs energy that Storm provides to boost his own power and stay alive, it''s also mentioned
    that this process involves sharing life-forceX-men Red 2022 #6), Extrasensory Perception (Capable
    of perceiving energy and phenomenon across the Electromagnetic spectrum), Blood Manipulation, limited
    Power Nullification, and limited Biological Manipulation (Magneto overpowers Hercules by manipulating
    his blood.The Champions #16 Magneto freezes Sam, Storm and Bishop in place by gripping the iron fiber
    in their blood and Storm mentions they can''t activate their abilities, but Bishop''s still works
    because it''s passive.Uncanny X-men 1963 #304 Magneto uses blood manipulation to induce seizures and
    strokes.X-men Unlimited 1993 #2 Despite not having a heart, Magneto uses his blood control to keep
    himself alive. Can also use his helmet which blocks psychic powers to keep psychics from accessing
    their powersX-Men: Red 2022 #3), Flight (Magneto flies at high speeds into space.The Vision and Scarlet
    Witch 1985 #6), Forcefield Creation (Magneto shields from Cyclops, Colossus, and Wolverine.Uncanny
    X-men 1963 #150 Magneto shields himself from both Thor and She-Hulk.The X-men vs Avengers 1987 #2
    Magneto has shielded himself from a mental and physical attack from the Phoenix.Uncanny X-men 1963
    112), Technology Manipulation (Reconstructs and holds together the Dreaming Celestial, acting as it''s
    nervous systemUncanny X-Men 2012 #1), Limited Gravity Manipulation (Magneto reverses gravityNew Mutants
    #35), Invisibility (Magneto cloaks himself in magnetic energy, rendering him completely invisible
    and undetectable, even from those who can sense energyThe Vision and Scarlet Witch 1982 #4), Statistics
    Amplification (His power can be amplified by absorbing energy from others or planetary objects. Magneto
    can also amp his physical strength with a magnetic field.Uncanny X-men #87 Can increase his range
    with meditationUncanny X-men 1963 #21Uncanny X-men 1963 #22), Attack Reflection (His willpower is
    so strong he could deflect Karma''s psychic powers. Magneto sends Banshee''s scream back at himUncanny
    X-men 1963 #112), Temperature Manipulation (Capable of redirecting heatX-men 1991 #113), Non-Physical
    Interaction (Could manipulate and dissipate the Breakworld bullet despite it being intangible), Radiation
    Manipulation, limited Sound Manipulation (Sends Banshee''s attack back at him), Light Manipulation
    (Is capable of manipulating photons and turning Dazzler''s power back on herUncanny X-men 1963 #393),
    Resistances to Telepathy and Mind Manipulation (Magneto manages to fight on par with Xavier on the
    astral plane. Magneto senses Charles Xavier in his mind and evades psychic inquiry from Hope and Charles.X-men
    The Trial of Magneto #2 Magneto has shielded himself from a mental and physical attack from the Phoenix.
    His helmet is also resistant to psychic powers and he can create a new one if he has the metal to),
    Magnetism Manipulation and Electricity Manipulation, Temperature Manipulation (Capable of redirecting
    heat)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
