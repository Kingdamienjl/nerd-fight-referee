- id: claim-weaknesses-91b7297a
  section: weaknesses
  axis: weakness
  text: 'Manipulating energies instead of magnetism can take a toll on his body, When severely injured,
    his body is unable to withstand the strain of manipulating great amounts of magnetic forces. He is
    unable to manipulate vibranium. Notes: *Before making any changes to this page, please read and follow
    the Power-scaling Rules for Marvel and DC Comics *Marvel Comics: Magneto''s stats consistency is a
    blog that covers Magneto''s showings across his career. **As listed in the blog, there are solid individual
    cases where Magneto would scale to Quicksilver''s speed, just as there are other occasions where Quicksilver
    blitzes him or Magneto makes use of cheap tactics to tag Quicksilver. This alone makes dubious at
    best if they should scale, and the sheer number of characters slower than Quicksilver who scale to
    Magneto in speed make abundantly clear how Magneto is in their level instead. Feats: *Destroyed a
    Siberian town (High 7-C). ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{reflist|2}}
