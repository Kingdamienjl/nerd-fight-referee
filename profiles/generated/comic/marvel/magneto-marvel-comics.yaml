      metalAvengers Vol 4 issue 28), many of his attacks are reliant on Lifting Strength, higher by stealing
      the power of planetary objects (Siphoned energy from the sun and channeled more power from every
      planet within reach, growing stronger by the second, allowing him to match Bleeding Edge Iron ManAvX
      Vol 1 1)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Hypersonic combat speed and reactions (Repeatedly fought evenly against the X-Men, himself and
      them gaining the upper hand against each other several times; The X-Men include the likes of Cyclops,
      Wolverine, Jean Grey, Rogue, Beast, Nightcrawler, Psylocke, etc. Kept up with Namor, Havok, Red
      Hulk, Doctor Doom, a held-back Hercules & Thor, and a Hulk on this levelMach 8.23). Up to Massively
      FTL flight speed (Seized control of revolutionary magnetic rays that could travel from Earth to
      a planet in another galaxy and used them to return from said planet to Earth in less than a day.(The)
      Avengers Vol 1/(1963) issue 47 This situational feat shows he can control magnetic rays faster than
      himself and use them to fly at comparable speeds to them) and Massively FTL attack speed (Covered
      his body with the metal from the satellites around that allowed Iron Man to quickly siphon some
      of Jupiter's magnetic field and himself stole the same kind of power from the sun, then channeled
      more power from every planet within reach and grew stronger by the second)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class 1 (Lifted a massive portion of a broken wall to kill Red Skull. Can snap necks
