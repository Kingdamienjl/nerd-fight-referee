  axis: hax
  text: '*Superhuman Physical Characteristics *Genius Intelligence *Longevity (Ages
    slower than ordinary men. Spent 12 years in the Dimension Z but didn''t look a
    day older) *Enhanced Senses (Has a sight and hearing far superior to that of ordinary
    humans), Precognition (Possesses a "Well-Honed Sixth Sense" which allows him to
    instinctively react to his enemies'' movements, often moments before they occur)
