- id: claim-powers-and-abilities-446485c9
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Regeneration (Low-Mid; Immediately regenerates after getting
    his arm shot off.) **Self-Sustenance (Type 1; Can survive in space.) **Self-Molecular Manipulation
    & Body Control (Apocalypse explains his control over his body is so exact, that he can rearrange and
    restructures its molecular make up.X-Factor vol 1 #6) ***Non-Physical Interaction (Can adjust his
    molecules to match those of Kitty Pryde and harm her.Age of X-Man: Apocalypse and the X-Tracts #5)
    **Elasticity (Stretches his body to attack Beast. Knocked away Jane Foster.Generations: Unworthy Thor
    & The Mighty Thor) **Resurrection & Immortality (Types 1 & 3; Apocalypse confirms that as an External,
    he has the benefit of rebirth if he is killed.Excalibur vol 4 #12 So long as a trace of Apocalypse''s
    physical essence exists, Apocalypse can always come back. Even from a cell or a drop of blood can
    be enough to create a clone or turn a host body into something fit for Apocalypse''s soul.Cable and
    Deadpool vol 1 #27) *Statistics Amplification *Preparation *Shapeshifting (Apocalypse takes the appearance
    of normal-looking, princely, African male.Further Adventures of Cyclops and Phoenix #1 ) *Weapon Creation
    (Apocalypse fights through a vampire army while shifting his hands into various weapons.X-Men: Apocalypse
    vs Dracula #4 Apocalypse conjures a war hammer from nowhere.) **Weapon Mastery (Several including
    swords, axes, hammers, and maces.) *Adaptation (Apocalypse''s immune system quickly adapts to the
    Techno Organic virus that Sinister creates.Further Adventures of Cyclops and Phoenix #5) *Energy Manipulation
    & Projection (Regularly turns his arms into cannons. Can shoot beams from his eyes strong enough to
    harm Thor. Uncanny Avengers vol 1 #6 Apocalypse easily takes down Clan Akkaba mages with a single
    energy blast.) **Energy Absorption (Kinetic; energy from Celestial technology, and likely others)
    *Teleportation (Apocalypse teleports his Light Riders back to Manhattan from Kazakhstan.Age of X-Man:
    Apocalypse and the X-Tracts #4) *Astral Projection (Apocalypse astral projects to Captain Britain
    (Betsy Braddock) at the Braddock Lighthouse.Excalibur vol 4 #2) *Illusion Creation (Apocalypse creates
    an illusion of Genesis.Age of X-Man: Apocalypse and the X-Tracts #2 Showed the Hulk a projection of
    the past.Incredible Hulk vol 1 #456 ) *Flight (Apocalypse conjures jets on his boots to maneuver in
    space and dodge an energy blast from the High Evolutionary. X-Factor Annual vol 1 #3 Through telekinesis.Uncanny
    X-Men vol 1 #335) *Limited: **Air Manipulation (Apocalypse turns his hand into a large fan to suck
    up Unveil in her mist form before forming a blower to shoot Unveil in mist form at Eye Boy and Dazzler.
    ) **Life Manipulation (With help from the other Externals, transferred Candra''s life force energy
    from her body into a gemstone.) *Telepathy (Capable of communicating with Psylocke while she was in
    Otherworld.Excalibur vol 4 #1) *Possession (Apocalypse transfers his soul from his old deteriorating
    body to his new host.X-Men: Black- Juggernaut) *Telekinesis (Apocalypse telekinetically takes apart
    "the Finch" and puts it together attached to his body.X-Men: Black- Emma Frost Apocalypse seemingly
    cuts off Healers airways telekinetically.X-Factor vol 4 #4) *Extrasensory Perception (Apocalypse can
    sense the magical energies surging through the crystal stones created from long dead mutants.Excalibur
    vol 4 #4 Capable of sensing people through their psionic presence. Apocalypse can see people even
    when they are Invisible.) *Size Manipulation (Young Apocalypse increases his size and strength against
    an armed-group of Egyptian soldiers.Rise of Apocalypse #4 Apocalypse alters the size of his face and
    no-sells Loki''s blitz.X-Factor vol 1 #50) *Supernatural Willpower (Capable of resisting the Helm
    of Annihilation.X of Swords: Destruction) *Possession (Apocalypse transfers his soul from his old
    deteriorating body to his new hosts. ) *Deconstruction (Shown here.) *Low-Tier Sorcerer (Wrote a grimoire
    on everything he knows, also dissected Morgan Le Fay to study her magic.Excalibur vol 4 #6. Is shown
    engaging in ritual spells with his coven, the other Externals.Excalibur vol 4 #11 Selene notes Apocalypse''s
    skill in magic but claims he knew less than her.Immortal X-Men Vol 1 #1) **Forcefield Creation (Apocalypse
    conjures a force field to contain and protect Caliban.X-Factor vol 1 #25) **Healing (Apocalypse regrows
    Eye Boy''s hands.) *Technology Manipulation Resistance to: *Telepathy & Mind Manipulation (Manages
    to deflect Jean Grey''s telepathic assault.Further Adventures of Apocalypse and Phoenix #3) *Sound
    Manipulation (Takes Bei the Blood Moon''s "doom note".Excalibur vol 4 #15) *Temperature Manipulation
    (Says he is immune to and can resist cold to Iceman. Took an attack from Rogue using Sunfire''s powers.X-Men
    Vol 2 #186) *Electricity Manipulation (Apocalypse survives the combined lightning attacks of young,
    unworthy Thor and Jane Thor.) *'
