  intelligence:
    text: General= Above Average (As an agent of the FBI, Poindexter helped coordinate
      their missions such as transferring prisoners, guarding secure places, searching
      areas, and arresting suspects. He used his knowledge of FBI protocols to bypass
      security and ambush Kingpin at his wedding. He is skilled at tracking and gathering
      intel, such as when he stalked Julie Barnes) |-|Skill= {{Border|Scroll=yes|Visible=Yes|Content=
      Poindexter can fight opponents such as Daredevil and Kingpin, as well as quickly
      defeat a group of FBI agents with ease. After their first battle, Daredevil
      claimed that Bullseye was "as fast and as skilled as I've ever seen", which
      would make his skill comparable to the likes of Iron Fist, Elektra and Nobu.Daredevil,
      S3E7 Kingpin stated that he had never seen anyone with a talent like his, even
      after he previously admitted to being highly impressed with the Punisher's capacity
      for violence. He is able to throw edible forks, spoons, and knives at several
      agents at Wilson Fisk's wedding. He was even able to throw a gun backwards at
      Tammy Hattley's head while not looking and still managed to hit his target.
      Other items which he threw with deadly precision include plates, Kingpin's breakfast
      tray, Daredevil's billy club, fire extinguishers, a computer monitor, a trash
      can, a snow globe, the Bible, votive candles, a statue, rosary beads, a collection
      plate, beer bottles, a microphone, decorative bowls, Daredevil himself, broken
      glass shards and a paper clip. Poindexter is also able to pull off curve-shots
      and trick shots with an unerring amount of accuracy.}}
    source_ids: *id002
    confidence: 0.95
