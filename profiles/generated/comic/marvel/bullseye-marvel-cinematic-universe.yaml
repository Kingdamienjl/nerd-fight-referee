power_scale:
  tier:
    text: '{{9-A}} Name: Benjamin Poindexter, "Daredevil", Bullseye Origin: Marvel
      Cinematic Universe Gender: Male Age: Early 40''s as of Daredevil: Born Again
      (Was admitted into the Riviera Psych Institute on January 1st, 1997 when he
      was 12Daredevil, S3E6Marvel''s Daredevil Online Auction Lot #198: Benjamin ''Dex''
      Poindexter''s Recorder and Tapes with Medical Records and Transcripts) Classification:
      FBI agent (formerly), Kingpin''s mercenary (formerly)'
    source_ids: &id002
    - mediawiki-2988092
    confidence: 0.95
  attack_potency:
    text: Small Building level (Fought against Daredevil on multiple occasions.Daredevil,
      S3E10Daredevil, S3E13 Can kill people by throwing objects at them,Daredevil,
      S3E9 and has done so various times. Dented brick walls by throwing baseballs
      as a kid. Broke through a door. Tossed a computer monitor so hard that it sent
      Daredevil bracing with a chair back destroying a desk. Threw Daredevil through
      a window. Harmed Wilson Fisk in spite of him wearing his armour tuxedo0.08385
      Tons of TNT, 10% of this feat)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Subsonic travel speed34.3 m/s with higher combat and reaction speed (Fought
      with Daredevil. Took his gun apart and killed two Albanians before they could
      even react.Daredevil, S3E2 Dodged gunfire. Can throw objects with enough velocity
      to hurt the likes of Kingpin and Daredevil90.193 m/s), Varies, Transonic, up
      to Supersonic+ attack speed with weaponry (Uses weapons ranging from the Glock
      17 to the Colt Model 933Based on real equivalents: *Glock 17: Transonic (345.9311
