- id: claim-powers-and-abilities-ad871287
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts (Poindexter is a highly skilled combatant,
    having trained extensively in the United States Army and the FBI. His fighting style is comprised
    of Boxing, Karate, Jujitsu, Kali, Krav Maga, and Muay Thai) *Weapon Mastery *Marksmanship (Poindexter
    has extraordinary talent in marksmanship; he could wield firearms with superior accuracy and precision,
    and can even ricochet bullets to hit his intended targets) *Superhuman Precision (He can use practically
    any object as a lethal projectile, even when he was only a child, he could drill a hole into a brick
    wall by repeatedly throwing a baseball in the same spot. He later ricocheted a baseball off a pole
    into his coach''s head, killing him.Daredevil, S3E5 He was also able to use the deconstructed parts
    of his gun to kill two Albanian Syndicate members, and stationery supplies in the New York Bulletin
    Building, like staplers, pens, pencils, a hole punch, and a pair of scissors, which successfully impaled
    into Daredevil''s chest, even outpacing the perception of the latter''s superhuman senses. Killed
    a fly with a paper clipDaredevil: Born Again, S1E1) *Smoke Manipulation with Smoke Grenade (Bullseye
    threw smoke grenades into Josie''s Bar before springing an attack on the establishment)'
  source_ids: *id003
  decisive: true
  status: unverified
