      (A variant of the M4A1 Carbine, whose muzzle velocity ranges from 880 to 910
      m/s, with an average of 905.256 m/s) *Suppressed Smith & Wesson Model 952: Transonic
      (Average of 359.9688 m/s) *Sniper Rifle: Likely Supersonic (Unknown model) )'
    source_ids: *id002
    confidence: 0.95
