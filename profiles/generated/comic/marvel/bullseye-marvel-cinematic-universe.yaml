- id: claim-weaknesses-37fac53b
  section: weaknesses
  axis: weakness
  text: 'Has borderline personality disorder. Although he is far from helpless in close-quarters combat,
    he is more adept at ranged attacks and has a clear preference for them. Feats: *Richoceted a bullet.
    *Killed his coach with a ricocheted baseball as a kid. *Harmed Karen with beads of a broken necklace.
    *Jammed his Billy Club into a journalist''s neck. *Killed 2 FBI agents by bombarding them with silverware.
    *Incapacitated an FBI agent by throwing a gun at her head without even looking. *Killed 2 people by
    throwing glass bottles at their heads. *Took down a chandelier and harmed Fisk despite him wearing
    his bulletproof tuxedo. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{scroll
