    when they die, instead of going to Death''s domainStrange Vol 3 4 - including heaven and hell, Khonshu
    claims their souls and existence, keeping them in his domain as soldiers that he can send down to
    Earthly plane as either undead or as ghosts.Phases of the Moon Knight Vol 1 3 When Khonshu holds onto
    his Avatar after they die in his own dimension (without letting them enter Death''s domain), the avatars
    can also appear as spirits in the normal world.Phases of Moon Knight Vol 1 2 When Moon Knight''s mind
    and soul was pulled into an Asgardian weapon (an entire dimension of a Dragon), Khonshu was able to
    manifest in that dimension through his connection with Marc. Khonshu then defeated the dragon and
    claimed the sword for Marc.Moon Knight: Fist of Khonshu Vol 1 8 Got revived by Khonshu again when
    Nemean and Grand Mal killed him. Usually immune to Death''s touchMoon Knight: City of the Dead Vol
    1 1) *Subjective Reality, Power Nullification and Conceptual Manipulation (Type 1. Scaling to Moon
    Knight. Faith in oneself, or in another, can be transformed into subjective reality, which allows
    the user to do absurd things that defy logic. For example, Zodiac was able to hurt a vampire just
