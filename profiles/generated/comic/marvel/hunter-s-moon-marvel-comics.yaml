- id: claim-weaknesses-8617e712
  section: weaknesses
  axis: weakness
  text: 'When they are resurrected by Khonshu, they lose a bit of themselvesMoon Knight Vol 9 19. Too
    many resurrections ultimately lead them to become nothing but shells of themselves, then ultimately,
    just zombiesMoon Knight Vol 9 26. However, Yehya is fine with that and sees honour in it. Notable
    Attacks and Techniques: * Summoning: Can call upon Khonshu and manifest him wherever and whenever
    he is, even if he were stuck in a dimension of another God or celestial-like being. Summoned Khonshu
    to fight a new God on his behalf. Summoned a "memory" of Khonshu to take down an extremely powerful
    villain a lot of heroes couldn''t do much against. Fists of Khonshu can summon Khonshu directly into
    battle to assist them, be his true form or an avatar of lesser power. They can also summon the previous
    Fists of Khonshu to fight beside them. Summoned other Fists of Khonshu inside the mind of someone
    else) * Gift of Chorus: Was granted the memories and skills of previous Fists of Khonshu. *Gift of
    Chorus: Badr was granted the experiences, memories and skills of the previous Fists of Khonshu. *
    Like other Fists of Khonshu, they can stand atop moving vehicles without being affected by friction.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-162e479f
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Multiple Selves (Type 1 & 2 - With the Gift of Chorus,
    all of the previous Fists of Khonshu live within his mind and soul) *Martial Arts, Weapon Mastery
    and Acrobatics (All Fists of Khonshu are good with weapons, martial arts, and have good acrobatics
    skills that they utilise in their fights. Used his crescents to remove someone''s weapon.Moon Knight
    Vol 9 3 Beat up 8-Ball.Moon Knight Vol 9 1 Harmed Zodiac. Held back a horde of vampires for a while.Moon
    Knight Vol 9 14Moon Knight Vol 9 15Moon Knight Vol 9 17 Fought Nemean and Grand Mal, two superhumans,
    one of whom has an unbreakable skin, who scales to Marc - but ultimately lost due to due to being
    overwhelmed by a horde of vampires. Fought Werewolves alongside Marc.Moon Knight Vol 9 Annual 1 As
    shownVengeance of the Moon Knight Vol 2 4 here. Fought Marc Spector. Beat up some henchmen. Fought
    a large number of Sarnak thugs and then immediately after defeated him too. Fought Shroud alongside
    Tigra.Vengeance of the Moon Knight Vol 2 5 Used his acrobatics to save a fall from top of a building.
    Has access to the memories and skills of previous Fists of Khonshu that lives within him. Fought Vibro)
    *Magic (Fists of Khonshu can access Khonshu''s LunarBring on the Bad Guys: Doom Vol 1 1/Moon magic
    by praying to him. Knights of Khonshu uses the magic in different ways. Marc uses it to augment himself,
    whereas Yehya, for example, uses it more to heal as a priest.Moon Knight Vol 9 6 Marc used magic to
    "curse" a girl so she would be protected by Khonshu.Moon Knight: Black, White & Blood Vol 1 3 Pacts
    between mortals and gods are considered magicStrange Academy: Moon Knight Vol 1 1) *Healing (Through
    the ancient rites of Khonshu, he can healMoon Knight: Fist of Khonshu Vol 1 6 people) *Purification
    (Marc turned regular water in holy water to use against vampires. Sent demons to Dungeons Dimension
    through exorcismVengeance of the Moon Knight Vol 2 1) *Holy Manipulation (Marc turned regular water
    in holy water to use against vampiresMoon Knight Vol 9 18) *Immortality (Type 4 & 7), and Resistance
    to Soul Manipulation and Death Manipulation (Yehya was revived by Khonshu. All Knights of Khonshu
    - whether they are currently in his service or not - can be resurrected by him infinitely for as long
    as he needs them.Moon Knight Vol 9 11Moon Knight Vol 9 12 In addition, when they die, instead of going
    to Death''s domainStrange Vol 3 4 - including heaven and hell, Khonshu claims their souls and existence,
    keeping them in his domain as soldiers that he can send down to Earthly plane as either undead or
    as ghosts.Phases of the Moon Knight Vol 1 3 When Khonshu holds onto his Avatar after they die in his
    own dimension (without letting them enter Death''s domain), the avatars can also appear as spirits
    in the normal world.Phases of Moon Knight Vol 1 2 When Moon Knight''s mind and soul was pulled into
    an Asgardian weapon (an entire dimension of a Dragon), Khonshu was able to manifest in that dimension
    through his connection with Marc. Khonshu then defeated the dragon and claimed the sword for Marc.Moon
    Knight: Fist of Khonshu Vol 1 8 Got revived by Khonshu again when Nemean and Grand Mal killed him.
    Usually immune to Death''s touchMoon Knight: City of the Dead Vol 1 1) *Subjective Reality, Power
    Nullification and Conceptual Manipulation (Type 1. Scaling to Moon Knight. Faith in oneself, or in
    another, can be transformed into subjective reality, which allows the user to do absurd things that
    defy logic. For example, Zodiac was able to hurt a vampire just because he had faith in himself and
    became something "holy"Moon Knight Vol 9 29. In a similar sense, when Kang tried to remove traces
    of Khonshu and his Knights throughout all of time, but due to their faith, it did not work. Marc also
    remembered the original timeline, despite everything that had been changed and erasedMoon Knight Annual
    Vol 2 1) **Acausality (Type 1 - Kang tried to remove traces of Khonshu and his Knights throughout
    all of time, but due to their faith, it did not work. Marc also remembered the original timeline,
    despite everything that had been changed and erasedMoon Knight Annual Vol 2 1) **Resistance to Existence
    Erasure (Kang tried to erase Khonshu and his Knights, but due to their faith, it did not work. He
    did succeed in erasing all other heroes, howeverMoon Knight Annual Vol 2 1) *Mind Manipulation (Scaling
    to Sun King as they are both avatars of Egyptian deitiesMoon Knight Vol 8 192) *Blessed and Empowerment
    (Can get empoweredConan: Serpent War Vol 1 2 by Khonshu, increasing his strength as he sees fit. Moon
    Knights get additional power from Khonshu by praying to himPhases of the Moon Knight Vol 1 4. With
    a fractionConan: Serpent War Vol 1 1 of Khonshu''s power, Marc destroyed a being capable of destroying
    the multiverseConan: Serpent War Vol 1 4. Khonshu''s earlier hosts and avatars were empowered to the
    point that they could battle a younger Odin, Panther God, and Phoenix ForceAven'
