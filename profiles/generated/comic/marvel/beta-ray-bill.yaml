    his speed, strength, and durability to incredible levels. In this form, he is
    also covered in a sheath of energy and can fire energy blasts without using Stormbreaker.
    However, doing this shortens his lifespan. Note: *Before making any changes to
    this page, please read and follow the Power-scaling Rules for Marvel and DC Comics.
    *This profile only covers Beta Ray Bill with Stormbreaker, in the future it will
    be updated depending on how he handles the Twilight Sword. *His victory against
    Surtur should not be used as a justification for a higher level, since the fire
    giant was weakened and Surtur was superior in a fight on equal terms.Beta Ray
