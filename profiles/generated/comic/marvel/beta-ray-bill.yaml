- id: claim-weaknesses-effb36bd
  section: weaknesses
  axis: weakness
  text: 'Releasing his limiters lowers his lifespan Notable Attacks/Techniques: *Limiter Release: Releases
    the limiters on his cyborg power core, temporarily increasing his speed, strength, and durability
    to incredible levels. In this form, he is also covered in a sheath of energy and can fire energy blasts
    without using Stormbreaker. However, doing this shortens his lifespan. Note: *Before making any changes
    to this page, please read and follow the Power-scaling Rules for Marvel and DC Comics. *This profile
    only covers Beta Ray Bill with Stormbreaker, in the future it will be updated depending on how he
    handles the Twilight Sword. *His victory against Surtur should not be used as a justification for
    a higher level, since the fire giant was weakened and Surtur was superior in a fight on equal terms.Beta
    Ray Bill Vol 1 #5 * Additionally, there are special standards to be followed when scaling other characters
    to him, as listed in our Marvel Comics verse page. ==Notable Matchups== Victories: Jane Foster (Marvel
    Comics) Jane Foster''s Profile (3-C Beta Ray Bill and Jane Foster''s Thor key are used) Losses: Inconclusive:
