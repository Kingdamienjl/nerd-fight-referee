    Users Category:Energy Users Category:Heroes Category:Good Characters Category:Cyborgs Category:Healers
    Category:Aliens Category:Attack Reflection Users Category:Comic Book Characters Category:Magic Users
    Category:Flight Users Category:Weather Users Category:Temperature Users Category:Regeneration Users
    Category:Portal Users Category:Hammer Users Category:Blessing Users Category:Absorption Users Category:Self-Sustenance
    Users Category:Summoners'
  source_ids: *id003
  decisive: false
  status: unverified
