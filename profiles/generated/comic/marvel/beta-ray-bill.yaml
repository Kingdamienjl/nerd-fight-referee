- id: claim-powers-and-abilities-e1d2da81
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Blessed, Flight, Cyborgization (Normal), Transformation
    (Can transform between civilian and combat forms), Self-Sustenance (Type 1), Healing (HereThor V2
    083), Longevity, Energy Manipulation, Energy Projection, Absorption and Attack Reflection (Can projectStormbreaker:
    The Saga of Beta Ray Bill Vol 1 #1, absorb and redirect energy. Redirected a black hole cannon shot
    with StormbreakerStormbreaker: The Saga of Beta Ray Bill Vol 1 #2Guardians of the Galaxy Vol 5 6),
    Forcefield Creation (HereNova Vol 5 #13), Minor Holy Manipulation (Like Mjolnir, Stormbreaker is a
    holy weapon), Regeneration (Low), Fire Manipulation (Can summon the flames of MuspelheimNova Vol 5
    #16, which burns for whole years, are hotter than normal fire and cannot be put out by the nature
    of space, water or Thor''s stormsMighty Thor Vol 2 #18), Weather Manipulation, Portal Creation (Shown
    herePower Pack Vol 1 #15), Electricity Manipulation, Summoning (Can summon Lockjaw), Information Analysis
    (Stormbreaker can trackThor Vol 1 #358 energyThor Vol 1 #440, the Nova ForceNova Vol 5 #13 and can
    give him information about his opponentsStormbreaker: The Saga of Beta Ray Bill Vol 1 #1), Magnetism
    Manipulation (Shown hereThor Vol 1 Anual #16), Statistics Amplification With Limiter Release |-|Resistances=
    Resistance to Temperature Manipulation (Bill is unaffected by the cold of space or the heat of a starStormbreaker:
    The Saga of Beta Ray Bill Vol 1 #2), Gravity Manipulation and Radiation Manipulation (Survived getting
    sucked into a fake black hole, which he escaped with assistance), Pain Manipulation and Madness Manipulation
    (Type 1: The Cybortization process is extremely painful and left some crazy people who did not die
    by the extreme pain, and only Bill was able to survive it), possibly Corruption (Type 2; He was within
    Cancerverse Doctor Strange''s corruption wave but was unaffected, however, it is unclear if Strange
    was targeting him or notAnnihilation - Scourge Beta Ray Bill #1), likely Magic, Antimatter Manipulation
    and Vibration Manipulation (Stormbreaker should have the same resistances as Mjolnir)'
  source_ids: *id003
