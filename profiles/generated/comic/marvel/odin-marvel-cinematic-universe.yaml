- id: claim-weaknesses-eac2958e
  section: weaknesses
  axis: weakness
  text: 'His powers require him to often recharge his energies in a process known
    as the "Odinsleep", leaving him defenseless. Using dark energy nearly kills him
    and the person he is using it on Notable Attacks/Techniques: *The Odinforce: The
    Odinforce is the name for the immense Mystical and Cosmic energies by Odin, which
    grant him authority and superior power over all lesser Asgardians. Odin usually
    channels the Odinforce''s raw destructive power through Gungnir, though he is
    capable of wielding his energies without it. With the Odinforce, he can perform
    a variety of incredible feats, such as manipulating vast Magical energies, controlling
    Dark Magic, transmuting matter, etc. **The Odinsleep: Due to the Odinforce''s
    incredible power, Odin often requires to enter a state of deep slumber to recharge
    his energies, being left vulnerable as a mortal during the process. The Odinsleep''s
    duration varies, and tends to depend on Odin''s physical and mental states. Sometimes
    it lasts a single night, while others is lasts over weeks. However, even while
    in this state, Odin still remains fully aware of his surroundings, sensing events
    across the Nine Worlds. ==Notable Matchups== Victories: Losses: Inconclusive:
