- id: claim-standard-equipment-ea700a75
  section: equipment
  axis: equipment
  text: '*Gungnir: Gungnir is an immensely powerful magical spear that is used by
    the Kings of Asgard, serving as a symbol of Asgardian power and authority, which
    has been passed down to Odin by his father Bor. It is forged from Uru metal. While
    most effective under Odin''s hands, channeling his great power, Gungnir can be
    wielded in combat by lesser Asgardians such as Loki. The spear is capable of performing
    a variety of things, such as projecting a wide array of magical energies, manipulating
    matter, controlling the Bifrost and commanding The Destroyer. *Sleipnir: Odin''s
    faithful steed. A magical, eight-legged Asgardian horse which Odin has used as
    his mount in battles for thousands of years. *Hugin and Munin: Odin''s two raven
    familiars. Through their eyes, Odin can observe events that occur across the Nine
    Realms, such as when the two followed Thor to Earth during the Chitauri invasion,
    and watched over the Thunder God''s conflict with Loki.'
  source_ids: *id003
  decisive: false
