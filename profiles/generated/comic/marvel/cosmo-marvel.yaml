- id: claim-weaknesses-f0cea725
  section: weaknesses
  axis: weakness
  text: 'Powerful telepaths can see through his telepathic cloak, telepaths stronger than himself can
    block out his influence and disable him Feats: *His telepathy made the Annihilators wince in pain
    *Killed the Cancerverse Hulk by making him have a stroke *Knocked back zombies that were overwhelming
    a weakened Nova Prime *Put an enraged Thanos in a mental lock with the help of Mantis and Moondragon
    *Instantly scanned the entirety of Knowhere to find a bomb with a Psi-Shield blocking it that prevented
    him from finding it normally Note: Before making any changes to this page, please read and follow
    the Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-3eafc29c
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Longevity, Enhanced Senses (Superhuman sense of smell and
    hearing, as well as the ability to telepathically sense other strong-minded beings), Telepathy (Which
    also works on robots, such as Vision), Telekinesis (Can make telekinetic blasts, lift and throw things),
    Energy Projection (Can project psionic force bolts which have no physical effects but can affect a
    victim's mind so as to cause the victim pain or unconsciousness, force them to suffer from a stroke,
    or turn someone brain-dead), Forcefield Creation (Can create telekinetic barriers), Illusion Creation
    (Can create realistic and very detailed illusions and cause people to experience events which are
    not actually occurring), Perception Manipulation (Can alter the apparent physical appearance of himself
    and other people by altering the perceptions of those around him, such as making himself appear dead
    in someone's mind and manipulating the target of someone's attacks into a monster), Invisibility (Can
    make himself and others appear invisible, can mask his presence and the use of his abilities from
    being detected by other psions and psychic entities and can extend these defenses to others around
    him), Mind Manipulation (Can control the thoughts and actions of others such as forcing people to
    stop fighting, read minds, and telepathically sedate his victims so that, if already rendered unconscious,
    they remain so for as long as he continues to sedate them), Fear Manipulation (Can use his telepathy
    to make opponents experience their greatest fears), Resistance to Mind Manipulation (His telepathy
    is strong enough to grant him a passive resistance to Abyss' mental influence, which turns sentient
    life-forms into meat puppets under its control), Gravity & Radiation Manipulation (Survived being
    sucked into a fake black hole)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
