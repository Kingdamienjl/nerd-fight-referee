- id: claim-weaknesses-e770891c
  section: weaknesses
  axis: weakness
  text: 'Requires taking the Odin Sleep once a year to replenish his powers Feats:
    *Tore off the Tenth Realm from the World Tree and sealed it inside a universe-sized
    prison. *Created the Odinsword, stated to be capable of rending infinity when
    unsheathed by one unable to control it, and which was later stated to be able
    to end all things. *Fought Uthana Thoth, a being capable of preventing a universe
    from collapsing by focusing his power into a gravity engine, and ended the battle
    mostly unwounded despite being ganged up on. *His clash with Seth caused a shockwave
    that rippled across every plane of reality, and the ensuing battle was simultaneously
    waged on every plane of existence. *His battle with Seth tore at the fabric of
    the multiverse. *Drew on all the electromagnetic particles of the cosmos to imprison
    Surtur. *When he first obtained the complete Odinforce, the energy could shake
