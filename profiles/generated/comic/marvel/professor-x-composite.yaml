        Teamwork: |-|2004=The team operates with a strong emphasis on coordination
        despite differing personalities and levels of experience. They are led by
        Professor X, who monitors them remotely via Cerebro and communicates when
        necessary, offering guidance and oversight. Cyclops, serving as the field
        leader, issues tactical commands during missions and uses his Optic Blast
        for precision strikes or to control the battlefield’s layout. Storm supports
        the team with both offensive and defensive strategies through her weather
        manipulation, disrupting enemy formations or creating cover with fog, lightning,
        or wind gusts. Jean Grey’s telekinesis and telepathy serve as both support
        and subtle control, allowing her to lift teammates or objects to provide assistance
        in combat, she also acts as the team''s medical doctor. Wolverine functions
        best as a close-range brawler, and his healing factor allows him to take risks
        others can’t and draw enemy fire, engaging physically overwhelming opponents
        head-on. His aggressive nature occasionally clashes with Cyclops’ authority,
        but in the field, he instinctively protects his allies. |-|2006=After the
        deaths of Professor X and Cyclops, the X-Men operate under the field leadership
        of Storm. Though the team lacks the long-term cohesion of earlier lineups,
        being an impromptu assembly of veterans and younger members, their adaptability
        and shared urgency foster effective teamwork and coordination. Storm, like
        before, uses her weather manipulation to disable large groups of enemies,
        attacking with lightning strikes and providing cover with fog. Beast brings
        both physical prowess and tactical insight, frequently leaping into melee
        with superhuman agility and strength, he also acts as the creator of the team’s
        suits, vehicles, and equipment. Wolverine can work closely with Colossus,
        who throws him toward targets to allow Logan to quickly breach enemy lines.
        Colossus himself serves as a defensive powerhouse, shielding teammates from
        enemy fire and acting as a barrier for more vulnerable allies. Iceman creates
        defensive ice walls to control enemy flow or immobilize them by freezing.
        Shadowcat uses her phasing powers to make her teammates intangible and protect
        them from projectiles or prevent falls.'
