- id: claim-standard-equipment-c9c6c171
  section: equipment
  axis: equipment
  text: '*Recurve Bow: Kate''s initial primary weapon, gifted to her by her mother,
    Eleanor Bishop. *Hawkeye''s Recurve Bow: The iconic bow originally wielded by
    Clint Barton. When passing down the mantle of Hawkeye, Barton also gave this bow
    to Kate. It now acts as her primary weapon. *Quiver: A back quiver utilized by
    Bishop to carry her arrows. *Trick Arrows: As the new Hawkeye, Kate Bishop comes
    equipped with the same specialized arrows that Clint Barton utilized. These arrows
    come in a variety of forms, granting her a high degree of versatility and adaptability
    in battle.'
