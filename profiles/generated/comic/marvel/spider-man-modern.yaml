      value: Extraordinary Genius (With high enough general intelligence to match
        test scores with a younger Reed Richards, be a part of the Future Foundation's
        think-tank, and having experience fighting all kinds of opponents from street
        thugs to cosmic threats, Spider-Man has shown vast intellectual capability.
        He has handled topics like metaphysics, a topic that brings trouble to even
        Tony Stark, can solve quantum physics equations of the highest order, can
        assist Reed Richard on a ship from the year 3,141,592,653, and has made Reed
        Richards envious of his expertise in Biology. Spider-Man is also a very quick
        thinker on his feet, being able to disable Iron Patriot's armor during combat,
        once made a solution to dissolve mystical gold in minutes, can do weight distribution
        calculations on the fly, can find the correct trajectory to fall from orbit
        to Paris while freefalling, and can create a jammer in ten minutes to block
        enhanced senses as strong as his own. Reed Richards even once commented that
        if Spider-Man had devoted his life to science, he would have rivaled him)
      source_id: vsbattles-spider-man-modern-marvel-comics
