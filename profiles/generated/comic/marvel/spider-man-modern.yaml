      the fly, can find the correct trajectory to fall from orbit to Paris while freefalling,
      and can create a jammer in ten minutes to block enhanced senses as strong as
      his own. Reed Richards even once commented that if Spider-Man had devoted his
      life to science, he would have rivaled him)
