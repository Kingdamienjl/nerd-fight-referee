    - field: speed
      value: 'FTL+ combat, reaction, and movement speed (One of Spider-Man''s greatest
        attributes is his speed, being able to consistently outspeed and blitz characters
        with analytical prediction abilities, such as Daredevil''s sensesAmazing Spider-Man
        #438 and Domino''s luck powers,Contest Of Champions II #4 with both admitting
        they can barely keep track or even see him, the former even being able to
        perceive and react to events down to the nanosecond with his radar sense5.588c.
        Dazzler, who operates at the speed of light, claims to have never seen anyone
        move as fast as Spider-Man, and is shown to be capable of dodging her light
        blasts as well. His spider-like agility and mobility makes him hard to predict
        and hit, as he can weave through multiple snipers shots;Amazing Spider-Man
        #284 Avengers Mansion automatic defensesMarvel Knights: Spider-Man #2 and
        Fantastic Four''s defensesMarvel Team-Up #132, which should scale above Reed
        himself moving only slightly below the speed of light. Has caught Wolverine
