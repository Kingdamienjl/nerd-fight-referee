    - field: attack_potency
      value: 'Mountain level+ physically (Ripped off Dr. Octopus'' tentacle arms twice,
        tremendously holding back on both occasions as Dr. Octopus had never seen
        Parker''s unrestrained power. Dr. Octopus'' mechanical arms could withstand
        a nuclear bomb which levelled an island. Consistently holds back against even
        his most infamous foes, including Electro, who has absorbed all of the power
        in New York and powered a quantum particle engine which would have destroyed
        New York City345.631 Megatons. Equal in strength to Ben Reilly. Comparable
        to his Earth-1610 counterpart. Physically overpowered Richard Rider, who withstood
        being punched into orbit by Rhino. Should compare to his durability), higher
        with equipment, Large Mountain level with Web Punch (Was able to one-shot
        Tombstone despite not harming him at all with his prior attacksSpectacular
        Spider-Man #206 (1993)) | Large Mountain level (A symbol of Peter''s serious,
        bloodlusted strength. Stopped a blow from a completely bloodlusted, fully
        intent to kill Rhino, proceeding to beat him into unconsciousness in a couple
        of punches and web shots. Viciously beat down Kingpin while not intending
        to kill him. Did all of the latter with just his cloth suit. His symbiote
        suit should be comparable to Eddie Brock) | At least Mountain level+ physically
        (Stated himself to grow faster and stronger, though to what degree is unknown),
        higher with equipment (Has created various suits and weapons that upscale
        from his normal level of strength), Large Mountain level with Web Punch |
        At least Large Mountain level (Can easily stop Rhino when he''s charging.
        Capable of easily overpowering Doc Ock''s tentacles. Should be superior to
        his Mark III armor, which broke through an upgraded version of Doc Ock''s
        tentacle arms made from Carbonadium that were a foot thick with no leverage,
        where he normally requires extreme effort in order to break), at most Small
        Country level (The Mark IV should be significantly superior to the Iron Spider,
        which should be much stronger than earlier Iron Man armors)'
      source_id: character-stats-profiles-spider-man-modern-marvel
