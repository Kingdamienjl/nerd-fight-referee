- id: claim-powers-and-abilities-5150d903
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts Mastery (Has an exceptional mastery in Kung
    Fu due to the rigorous training in ancient Chinese martial arts he underwent since childhood) *Weapon
    Mastery (Is proficient with multiple weapons, including swords and nun-chucks) *Marksmanship (Is able
    to shoot with dual handguns that he used to channel his Chi with excellent marksmanship, sufficient
    enough to intercept a bullet fired at him with two of his own) *Acrobatics *Extrasensory Perception
    (Can feel a person''s inherent life force) *Emotion Reading (While helping Luke Cage in his fight
    against Bushmaster, Rand was able to feel the turmoil in Cage, how he was at war with himself and
    how it was putting his mind and body off balance) *Limited Animal Manipulation (When breaking into
    Joy Meachum''s home, Rand was able to stop her dog from attacking him by sending his own calm emotions
    into the dog through meditation, causing it to lay down and become uninterested) *Chi Manipulation
    (Under the tutelage of the Order of the Crane Mother, Danny Rand gained deep knowledge and understanding
    of Chi. Once gaining the power of the Iron Fist, Danny Rand could harness his own Chi to augment his
    physical and mental capabilities. Through the use of his Chi, Rand is capable of generating an "internal
    force" that removes the need for charging momentum) **Statistics Amplification (By channeling the
    Chi of Shou-Lao and focusing it into his hand and wrist, Rand can make his fist superhumanly powerful
    and resistant to injury and pain. When Rand uses the Iron Fist, his fist''s density and durability
    is seemingly on the level of Luke Cage''s extremely durable skin, as he can use his fist to deflect
    bullets and blades while sustaining no harm) **Vibration Manipulation (Danny Rand''s fist is able
    to release powerful waves of concussive force upon impact, sending not only his opponent flying backwards,
    but all those around them) **Enhanced Acrobatics (Can perform great acrobatic feats with his Chi,
    such as effortlessly flipping over a taxi cab, or taking two jumps to get up to a second-story balcony)
    **Enhanced Senses (By focusing on the living body of another, Danny Rand can sense impurities infecting
    the body. By using this practice, Rand was able to hold his hand and use his Chi to sense the poison
    that was affecting Colleen Wing) **Healing (Is capable of healing his wounds by channeling his Chi.
    When a bullet pierced his hand, he was able to regenerate the wound in a matter of seconds by summoning
    the Iron Fist. Also, by holding his hand over her body, Rand was able to use his Chi to burn the poison
    that was killing Colleen Wing) **Chi Absorption (Studying the ancient scrolls of the ritual, Danny
    Rand learned how to absorb Chi. While he has not used this technique on anyone yet, he has enough
    understanding to instruct Colleen Wing on how to use it) **Power Bestowal (Has the power to channel
    his Chi into his dual pistols, making the bullets glow)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
