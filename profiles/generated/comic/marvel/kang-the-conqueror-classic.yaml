- id: claim-weaknesses-d3157ee4
  section: weaknesses
  axis: weakness
  text: 'Used to have an overwhelming fixation towards defeating the Avengers. Notes: * Kang functionally
    has no optional equipment, since he can access anything in his possession, either by summoning or
    teleportation, as such there is no point in making said distinction. * Kang destroying the timeline
    during his fight with Ultron is attributed to Marvel Universe''s mechanics rather than Kang''s own
    feat, as such there should be no assumption that it''ll work on a standard universe.Avengers Vol 4
    1-6 * Before making any changes to this page, please read and follow the Power-scaling Rules for Marvel
    and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
