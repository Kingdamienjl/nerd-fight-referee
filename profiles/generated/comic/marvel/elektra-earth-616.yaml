      value: 'If Atom absorbs too much energy at once, he will be sent hurtling through
        time. Depending on the type of energy absorbed, he either goes forward or
        backwards | If his Armor get breached it can accidentally release enough energy
        to destroy an entire Universal space-time continuum Notable Attacks/Techniques
        *Quantum Field: By manipulating the Quantum Field, Captain Atom is able to
        control time, space, energy, and matter at will. His energy absorption is
        potent enough to overcome foes significantly more powerful than himself. *Big
        Bang: Captain Atom is also able to control incredible amounts of energy, being
        able to catalyze another Big Bang if he so wished. *Dilustel Armor: Captain
        Atom''s metallic shell, or "skin", is composed of a portion of the alien being
        known as Silver Shield, and is called Dilustel. Pieces of the alien''s metal
        body were used in the Captain Atom Project, Project Major Force and similar
        projects thereafter. Nathaniel is able to coat himself with the metal, either
        partially or totally. Atom''s symbiosis with the metal is such that even partially
        armored, he is able to access the Quantum Field. *Quantum Field Manipulation:
        Captain Atom''s metal skin is tied into the Quantum Field, which enables him
        to absorb and manipulate incredible amounts of energy for a wide variety of
        applications. As a result, he is able to create an exact replica of Earth,
        complete with life, with a thought, with ease. His power is such, that he
        went even further, and by simply thinking of it, he was able to instantaneously
        create an entire universe out of nothing, and just as easily destroyed an
        entire universe, but he has never used this level of power again as a result
        of him mentally limiting himself. Captain Atom is also able to absorb potentially
        harmful energy into himself, but absorbing too much can overload him and send
        him hurtling through time. Captain Atom can fire and control energy of any
        form. He commonly manipulates his energy into force field bubbles, or explosive
        ''bombs'', as well as simple blasts of kinetic force. While he usually aims
        with his hands, he is able to emit energy from any point on his body. Several
        times he has "detonated", releasing a massive amount of energy at once, destroying
        objects within an certain radius.'
