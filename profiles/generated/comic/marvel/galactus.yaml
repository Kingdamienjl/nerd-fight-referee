  attack_potency:
    text: 'Varies from High Universe level (Immensely more powerful than the likes
      of Silver Surfer and Thor, with the former being Galactus'' Herald and deriving
      his power from him, thus below even his hungry states) to Low Outerverse level
      (His power is deemed to rival Odin,Thor; Vol 1; #168Fantastic Four: World''s
      Greatest Comic Magazine #11 and the two stood evenly matched in direct confrontation.
      Fought against Agamotto to a standstill,Doctor Strange, Sorcerer Supreme #43
      with Agamotto himself being one-third of the Vishanti, who are comparable to
      Slorioth, a pan-dimensional entity whose totality is vast beyond what any single
      dimensionality could hope to contain,Secret Defenders #25 extending over all
      higher dimensions, of whichGhost Rider 2099 Vol. 1 #25 there isChildren of the
      Voyager #3-4 anSecret Wars II #2 infinite number."Fantastic Four Vol. 1 #51""Fantastic
      Four Unlimited #3" While sated by four planetsFantastic Four Vol. 1 #602 and
      well beyond his usual levels, he was able to defeat a Mad CelestialFantastic
      Four Vol. 1 #603 and force the remaining ones to merge into a single being to
      deal with him), Outerverse level when sufficiently fed (Fought against The In-Betweener
      to a standstill, being considered his cosmic equal and opposite and tending
      the balance between Eternity and Death just as the In-Betweener maintains the
      balance of Chaos and Order,Silver Surfer Vol. 3 #31 with them being considered
      "cornerstones of the great triangle that is the universe"Fantastic Four Vol.
      1 #257 and three parts of a shared essence. Absorbed Dormammu and the Flames
      of the Faltine, adding their power into his own), Outerverse level+ with Cosmic
      Devouring (Capable of consuming the Galactus Seed, a piece of the Multiversal
      Eternity itself,Fantastic Four Vol. 1 #600 considered his "eternal soul"Mighty
      Thor Vol. 1 #3 and "the heart of everything,"Mighty Thor Vol. 1 #2 which gave
      birth to YggdrasilDeadpool vs Gambit #5 when planted. Upon having his hunger
      amplified and "unconstrained by mind or morality," Galactus would be able to
      devour the entirety of the omniverse from the inside-out,Ultimates² #6 reducing
      Eternity to scraps and returning all of existence to The First FirmamentUltimates²
      #5) and the Ultimate Nullifier (The Ultimate Nullifier, at its peak capacity,
      is able to erase and recreate the Multiversal EternityFantastic Four Vol. 3
      #49) | Outerverse level+ (Comparable to other Multiversal Abstracts, being considered
      an inner working of the omniverse in the same vein as them and "the wellspring
      of the cosmos,"Ultimates #6 residing in the Superflow alongside themUltimates²
      #2) | Outerverse level+ (Stated to have become more powerful than he has ever
      been,Thor Vol. 6 #6 surpassing the power he had as the Lifebringer. The totality
      of his power being unleashed as a bomb was able to destroy the Black Winter,
      who destroyed the sixth iteration of EternityThor Vol. 6 #1 and is itself strongly
      implied to be the "all-death"Thor Vol. 6 #5 that came to be with the suicide
      of the Second CosmosDefenders: Beyond #2)'
