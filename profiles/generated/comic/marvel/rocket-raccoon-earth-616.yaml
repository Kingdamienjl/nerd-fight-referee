      \ by Adam Warlock through multiple walls and being thrown by the High Evolutionary.\
      \ Endured getting thrown a distance into a sign by Gamora. Survived without\
      \ notable damage an attack from Ronan's Cosmi-Rod which was also being empowered\
      \ by the Power Stone, while a casual attack was able to one-shot the Other,\
      \ who is stated by WoG to be very powerful even in comparison to Loki.The Problem\
      \ With Bringing Thanos Into \u2018Guardians of the Galaxy\u2019 Survived part\
