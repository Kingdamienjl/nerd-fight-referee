  attack_potency:
    text: 'At most Mountain level (Held his own against GamoraGuardians of the Galaxy
      (2014)), higher with weaponry and Preparation (His firearms can knock down KorgThor:
      Love and Thunder and are implied by Gamora to be more powerful than her Godslayer,Guardians
      of the Galaxy Vol. 2 which can kill an Asgardian, and should be comparable to,
      if not stronger than, that of Star-Lord''s. His explosives destroyed Ego''s
      energy constructs), far higher with the Hadron Enforcer (Stated to be powerful
      enough to destroy entire moons.Given the Guardians of the Galaxy movies are
      set in Andromeda, it is highly unlikely that Rocket had any knowledge regarding
      Earth''s moon (Which is the celestial body that defines the baseline for a Moon
      level rating) while making such statement. Furthermore, there is no proof that
      Rocket was referring to a moon whose size is as large as Earth''s, especially
      when his reference to an "average" moon likely does not resemble Earth''s. This
      reasoning was accepted on this thread Threatened to use it to destroy the Eclector)'
    source_ids:
    - vsbattles-rocket-raccoon-earth-616-marvel
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
