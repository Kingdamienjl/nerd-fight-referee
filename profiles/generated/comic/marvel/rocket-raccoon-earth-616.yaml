  intelligence:
    text: Extraordinary Genius (Due to the experiments performed on him by High Evolutionary,
      Rocket possesses an extremely heightened intellect. Even as a child he possessed
      remarkable intellect and could solve advanced mathematical equations. Could
      figure out the solution to why the High Evolutionary's artificial evolutionary
      chamber was inducing rage in the subjects, something even the High Evolutionary
      couldn't deduce. His intellect was remarkable enough that the High Evolutionary
      wanted to dissect Rocket's brain and study it further. Was noted by the High
      Evolutionary to be the only subject with the ability to be creative and invent
      instead of just using rote memorization. Could create a key card to escape his
      pen using nothing but individual parts he'd collected and hidden, and could
      later pilot a starship despite never having operated a spacecraft before. He
      escaped every prison he's been to. An expert with ranged weapons and explosives,
      exceptional engineer. Capable of creating a device strong enough to destroy
      a moon. Helped Tony Stark and Smart Hulk create the Nano Gauntlet, and noted
      that Tony was only a genius on Earth, implying himself to be of superior intelligence
      to him)
    source_ids:
