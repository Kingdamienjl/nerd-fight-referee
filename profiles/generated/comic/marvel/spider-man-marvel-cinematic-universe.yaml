    text: '{{Border|Scroll=Yes|Visible=No|Content= *Superhuman Physical Characteristics
      *Genius Intelligence *Martial Arts *Acrobatics (All-Terrain Mobility, Hypermobility
      & Self-Momentum; Has consistently shown expertise and mastery in acrobatics
      and inhuman mobility) *Stealth Mastery (Stayed undetected while in the same
      room where Herman Schultz and one of Toomes'' men were investigating, sticking
      to the bottom of a table and being able to shoot a Spider-Tracer onto the former.Spider-Man:
      Homecoming Went unnoticed by several criminals when sneaking onto a Ferry, allowing
      him to interfere with weapons deal. Along with Iron Man and the Guardians of
      the Galaxy, successfully remained undetected during the arrival of Thanos, who
      can fight while temporarily blindedAvengers: Infinity War) *Precognition (Detected
      Bucky throwing a billboard at him from behind. Dodged Shocker''s punch from
      behind him effortlessly.Spider-Man: Homecoming Sensed the arrival of a Q-Ship
      as well as its harmful intent. Picked up on the Guardians of the Galaxy''s ambush
      significantly before it happened. Was warned of his oncoming death by Thanos''
      snap. Even when his senses were briefly less potent, he detected Beck''s presence.Spider-Man:
      Far From Home Able to avoid gunfire from numerous drones firing at him from
      different directions all at once while having all his other senses overwhelmed
      by the drones'' advanced holographic technology. Easily intercepted the final
      sneak attack of Mysterio. Warned Peter when Norman Osborn''s Goblin persona
      was about to resurfaceSpider-Man: No Way Home) *Enhanced Senses (All of Peter''s
      senses were dialed up upon receiving his powers,Captain America: Civil War such
      as allowing him to see through lenses that would be too dark for a normal human
      to see through and subduing opponents from a distance without the need to look.
      Tony Stark claimed that Peter has night visionThe Wakanda Files: A Technological
      Exploration of the Avengers and Beyond) *Surface Scaling (Aside from his standard
      usage of wall-crawling, Spider-Man''s adhesivity can be utilized in combat as
      well. It''s strength can work against momentum to his advantage and can run
      up surfaces with ease) *Regeneration (Low; Healed his broken ribs and being
      shot in his right shoulder in a matter of a few hours. On the morning following
      the night he apprehended Vulture, Peter had healed from his wounds.Spider-Man:
      Homecoming Had completely recovered from his injuries earned from both Mysterio
      encounters over the course of his flight back to New York from London) * Instinctive
      Action & Self-Body Puppetry (Despite Dr. Strange removing his soul, Peter''s
      physical body continued to move a magical box away from the former''s grasp
      continuously, and his body continued to operate on its own as his soul was merely
      focusing on getting back into his body and not moving the magical box away from
      Strange) **Limited Self-Soul Manipulation (Solely moved his soul back into his
      body) *Web Creation (Via Web-Shooters) *Preparation (With enough time, he can
      create and customize his own suits. Worked on cures for a number of villains
      within a short amount of time) *Hacking & Technological Manipulation (Hacked
      his way out of the Damage Control Deep Storage Vault. With the E.D.I.T.H. glasses,
      which were shown to tamper with phones and delete pictures. Can control the
      Nanotechnology of the Iron Spider even when not using it, as well as when it
      was forcibly integrated into Doctor Octopus’ metal arms) *Information Analysis
      (With E.D.I.T.H.) *Summoning (With E.D.I.T.H., he can summon numerous Stark
      Drones to aid him in combat) *Danmaku (With E.D.I.T.H.) Resistance to: *Illusion
      Creation (His Spider-Sense can guide him through illusions and allow him to
      overcome them) }} |-|Tech Suits={{Border|Scroll=Yes|Visible=No|Content=All previous
      abilities plus: *Electricity Manipulation (With taser webs, can course electricity
      through his web lines. His Upgraded Suit increased the potency of the taser
      webs'' output) *Information Analysis (Karen can show Peter the strongest points
      of buildings and vehicles as well as its structural damage along with updates.
      She can also inform him on his current location. Spider-Man''s Reconnaissance
      Drone can locate optimal entry points and scan for specific vehiclesSpider-Man:
      Homecoming) *Enhanced Senses (Can use infrared vision and hear through walls
      from a further distance) *Vacuum Seal for his suit (Can enlarge his suit) *Flight
      (Gliding; Can sprout "web wings" from his armpits which enable him to glide
      in the air. In the Upgraded Suit, Spider-Man has shown enough proficiency to
      get the most mileage out of his gliding) *Heat Manipulation (His suit contains
      a built in heater to instantly heat up Peter should he become cold or wet, capable
      of drying him completely when drenched) *Sound Manipulation (The Tech Suit can
      deepen Peter''s voice for the sake of intimidation) Resistance to: *Fire Manipulation
      with the Upgraded Suit (Could continue fighting unfazed while on fire) }} |-|I'
