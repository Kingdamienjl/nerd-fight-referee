  intelligence:
    text: 'Extraordinary Genius (Created his web-shooters under a very limited budget.
      Created a more potent version of the suit provided to him by Tony Stark. Figured
      out a way to defeat Mysterio in the short timespan of a jet flight from the
      Netherlands to London. Shown to be multilingual. Identified the material of
      Falcon''s wings and how they worked by simply glancing at them. Built a makeshift
      bomb with a downed E.D.I.T.H. drone in the middle of combat. Much more intelligent
      than the likes of Ned Leeds, who could hack into the Stark Suit. Broke out of
      the Damage Control Deep Storage Vault with some assistance from Karen and a
      calculator, which was said to be "the most secure facility on the Eastern Seaboard".
      Understood the theoretical mechanics of the multiverse. Easily defeated the
      Winter Soldier and Falcon at the same time, with Iron Man personally commentating
      that his combat display in Berlin proved he had potential and was "the real
      deal". In an alternate universe where a zombie outbreak occurred during 2018,
      Spider-Man was able to immediately deduce based on sight alone that the escaping
      energy of the Infinity Stones was warping the fabric of reality,Marvel Zombies:
      1.03: Episode 3 despite the fact that he held extremely limited information
      on just the Mind Stone beforehand.What If...?: S1E5: What If... Zombies!? Tony
      considered Peter to be a candidate for MIT, which is a research university specialized
      in applied science and engineering where some of the brightest technological
      minds have worked.Ant-Man (2015) Acted as the lead strategist when working alongside
      his older counterparts against villains from their universes. Understood how
      the Mirror Dimension worked through advanced knowledge on geometry, trapping
      Doctor Strange within it despite the latter using multiple magical abilities
      against him. Successfully fixed Otto Octavius'' inhibitor chip after deducing
      how it was negatively affected him, with Norman Osborn calling Peter''s work
      "remarkable". Worked on cures to various supervillains'' powers, including Sandman''s
      abilities, in a matter of hours)'
    source_ids: *id002
    confidence: 0.95
