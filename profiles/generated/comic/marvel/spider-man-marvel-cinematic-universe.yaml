  stamina:
    text: Superhuman (Spent over two days awake in response to the tampering of Doctor
      Strange's spell bring multiple residents from other universes into his own.
      Early into this process, he would fight Doctor Octopus and Electro as well as
      send them and other villains to the Sanctum, web-swinging from location to location
      over long distances, escaped and trapped Doctor Strange, and worked for those
      he had rescued. During the latter half, he would receive a multitude of attacks
      from different supervillains, in which he has his ribs broken, was met with
      a Pumpkin Bomb explosion point-blank, and shot in the shoulder, yet still escaped
      the apartment where this all happened. Spider-Man then went on to create new
      cures with his older counterparts and battle the combined efforts of the villains,
      which lasted up until sunrise)
