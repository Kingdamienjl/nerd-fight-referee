- id: claim-weaknesses-8e9f1532
  section: weaknesses
  axis: weakness
  text: '80% deaf due to an injury sustained while in Crossfire''s captivity, but his hearing was restored
    during his rebirth on Franklin Richards'' Counter-Earth. He was again deafened by the Clown, who jammed
    Hawkeye''s own arrows into both of Hawkeye''s ears, causing damage to the middle and inner ears. He
    remains largely deaf, and used sign language, and lip reading to understand those around him, while
    using normal speech to communicate to them. He later started using hearing aids created by Tony Stark.
    *Accuracy/Skill: **Extremely rapid firing with high accuracy **Ricochets an arrow for a precision
    shot **Ricochets arrows off Cap''s shield to take down 3 bad guys **Shoots 5 arrows and takes down
    five bad guys **Fires 9 arrows at once and shoots off all the flags on the opposing team during flag
    football **Tags Taskmaster while simultaneously driving a motorcycle **3 arrows, 3 headshots **Throws
    a playing card hard enough to make a man choke **Flicks a coin through a car window **Tags a car''s
    radiator/engine while leaning out the window of a moving vehicle **Hits a bullseye and then splits
    his arrow **Throws 5 knives at once and pins his foe to the wall **While blind, throws an arrow and
    pins his brother to the wall **Uses a hair tie to flick a spoon and cause a chain reaction to knock
    down his target 1, 2 **Shoots an arrow down a gun barrel **Two arrows in a double-barreled shotgun
    *Strength: **Pushes a car off himself with one arm **Swing around on top of a car with one arm **Hawkeye
    smashes up a metal Aleph with his bow **Hawkeye''s bow is rated at 250 pounds. Crossfire and a large
    muscular man fail to pull the bowstring *Agility/Reflexes: **Mind controlled Hawkeye dodges knife
