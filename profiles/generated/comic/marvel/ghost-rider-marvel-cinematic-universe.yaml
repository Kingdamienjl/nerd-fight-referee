- id: claim-weaknesses-b5d1cd96
  section: weaknesses
  axis: weakness
  text: 'His transformation into Ghost Rider needs a few moments and can be stopped
    by impaling him, as proven by Morrow who impaled Reyes with a shard of carbon
    Notable Attacks/Techniques: Transformation: Robbie Reyes is able to transform
    into a skeletal humanoid engulfed in flames, with his flesh burning off to reveal
    his skeletal form. Even before transforming, a fiery orange glow can be seen in
    Reyes'' eyes when he uses his powers or at times when he is killing his victims.
    Reyes is able to use his powers to some degree without transforming. Whenever
    transforming or using the Ghost Rider''s powers, he sometimes lets out a monstrous
    roar. *Regenerative Healing Factor: Though he received a cut on his face while
    battling Quake, these injuries disappeared the next day without even a scar. After
    getting a burnt hole in his face due to Hellfire''s attacks and then transforming
    into Ghost Rider, he emerged afterward in his human form without any sign of being
    damaged at all. This means that transforming into Ghost Rider and then back to
    his human form can allow him to recover completely from damage instantly. Robbie
    has described himself as nearly impossible to kill. *Empathic Reading: Ghost Rider
    can look into someone''s eyes and see into their heart and soul, to see what kind
    of person they truly are. He can examine their mental and emotional characteristics
    and qualities to determine if they are evil and in need of punishment, such as
    a corrupt cop or a teacher who was secretly a pedophile. While this ability is
    usually how Ghost Rider is able to find his targets, he can also rule a good person
    out as a target, bypassing that person''s opinion of himself or herself. This
    was demonstrated by him having the opportunity to kill Quake, while she was even
    telling him to, only for him to see that she was a penitent woman who was trying
    to be good. Fire Manipulation: Reyes is able to control and generate fire. As
    Ghost Rider, he is resistant to fire and seemingly no flames are capable of burning
    either him or his clothing. He is able to imbue an object he touches with fire,
    using the object as a melee weapon, which he has done to objects such as pipes,
    tools, car parts, and even chains. He can do so even without transforming into
    Ghost Rider. His control over fire allowed him to form a ring of fire around the
    car he crashed into with his own flaming vehicle. He also caused his car to catch
    fire to make Quake fall off it as she pursued him, with his eyes glowing bright
    orange and him letting out a monstrous roar. Additionally, he was able to set
    his entire hand ablaze while transformed to incinerate Frederick by touching him,
    which he did again to other ghosts, even in his human form and once with his flaming
    chain. He also caused an entire room to be engulfed in fire to burn Santino Nogara
    to death. *Soul Burning: Ghost Rider is able to create fire from his hands capable
    of melting people or even intangible beings such as Ghosts to ashes. Those who
    had their soul burn by Ghost Rider can''t be healed. *Intangibility Cancellation:
    Unlike ordinary humans, Ghost Rider can touch the non-corporeal entities, and
    if the situation requires, hold them and completely incinerate them with his fire.
    He was able to grab Frederick by the arm and neck in his human form before transforming
    and burning Frederick into embers with his blazing hand, he was able to burn Vincent
    to embers with the Hellfire Chain, and he was able to to the same to Hugo with
    his touch, though in the latter events, he was able to do so without even transforming.
    Enchantment: Ghost Rider has the ability to infuse his power into inanimate objects.
    He has used this power to make his car the Hell Charger become nearly indestructible.
    R. Moore fired a rocket launcher straight at the hood, all the rocket did was
    launch the car into the air and engulf it in flames, but neither the explosion,
    the fire, or crashing from several stories up had any effect on the car. It has
    crashed into other cars and even had a head on collision with an invisible Quinjet
    at full speed, without any harm such as scratches or dents. Reyes can also project
    his fire through the car without damaging it. He had the car emit fire from the
    hood, to knock off Quake, who was on top off the roof trying to stop Reyes. His
    clothes are also completely immune to fire and seemingly indestructible, as Hellfire''s
    explosive ball and being inside an exploding building did nothing to them. *Hell
    Weapons & Vehicles: Any weapon, vehicle or object chosen will engulf in flames
    in the riders hands. He can do so even without transforming into Ghost Rider.
    *Hell Charger: The Hell Charger is a heavily modified car owned by Reyes. When
    he acts as the Ghost Rider, the car is able to emit flames from the engine and
    wheels, and is able to withstand attacks that would destroy a regular car. *Hellfire''s
    Chain: Is a simple, industrial high-tensile chain that can also be used as an
    effective weapon in battle. The chain can be used to'
