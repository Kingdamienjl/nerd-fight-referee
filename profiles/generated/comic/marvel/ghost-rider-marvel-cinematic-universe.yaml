    and cause constant hyperarousal that would cause cardiac arrest and kill the victim,
    but it didn't work on Robbie), Magic (Hellfire has strong counter-effects against
    the Darkhold's magic) and Dark Matter (Hellfire can destroy dark matter energy
    from hell)
