- id: claim-standard-equipment-3a29e6b3
  section: equipment
  axis: equipment
  text: '*Armor: He owns a black armor with yellow and red traits, with a sign of a red bird on the chest.
    Dane can summon the armor through a necklace by saying "Avalon". It is very tough and has resistant
    to fire. *Photon Sword: It is a sword made by Dane himself, that works by attacking the nervous system
    and is capable of transfering its energy to Dane''s arm to increase his strength. *The Sword of Light:
    A gift by the Lady of the Lake, after Dane was chosen as her representative of Earth. It is able to
    project the energy absorbed by the Shield of Night. *The Shield of Night: A gift along with the Sword
    of Light and Strider by the Lady of Lake. It is able to absorb energy and redirect it to the Sword
    of Light. *The Ebony Blade: It is a mystical blade forged by Merlin himself with the material of a
    star meteorite. It is virtually indestructible, can repel and absorb magic and energy attacks, is
    immune to phasing, and is as strong as Wolverine''s claws. It also has a bound with Dane himself,
    so if he even get disarmed, the blade will always get back to him. *Laser lance: It was created by
    Dane''s uncle after not being worthy to wield the Ebony Blade. Dane mainly uses it as when he needs
    to fight at range or doesn''t have other weapons, it is also able to spray a smokescreen. *Strider:
    This is Dane''s winged horse given by the Lady of Lake. He mainly ride Strider for transportation
    or when he fights in air. *Brazier of Truth: It is a brazier that Dane discovered in Garrett''s Castle,
    which contains the consciousness of Sir Percy of Scandia, the original Black Knight, and Whitman''s
    ancestor. He contacts with Dane to give him his advice and wisdom. The brazier can also be used to
    clean the stain of the Ebony Blade.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
