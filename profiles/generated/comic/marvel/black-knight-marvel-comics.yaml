- id: claim-weaknesses-c53861c3
  section: weaknesses
  axis: weakness
  text: 'Due to the fact that the Ebony Blade is linked with Dane, the evil acts that the wielder performs
    will taint the sword to seek more blood, pushing Dane to be more violent and making him to go bloodlusted.
    Note: Before making any changes to this page, please read and follow the Power-scaling Rules for Marvel
    and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-03abafb1
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Expert in Hand to Hand Combat and Master
    Swordsmanship (Frequently stated to be the greatest swordsman of all time). Resistance to Fire Manipulation
    (Unaffected by a dragon's firebreath) Magic (Basic), Berserk Mode (Anyone who gives into the temptation
    of the Ebony Blade would enter a state of bloodlust, going on a rampage), Curse Manipulation (Anyone
    who attempts to possess the ebony blade, without significant willpower, will activate the curse),
    Summoning (Can summon the blade back to him) and Limited Time Travel (Can teleport to the blade even
    if it's in the future). Resistance to Transmutation (The blade cannot be transmuted by Grey Gargoyle
    or Sersi) and Fire Manipulation (split flames of Firelord) Flight with his mechanical horses, Smoke
    Manipulation and Limited Poison Manipulation (Can spray out a thick cloud of smoke that has adverse
    effects to insects), Heat Projection (As shown here) and Technology Manipulation (With his ionic blasts,
    can fry circuits) with his Power Lance, Absorption with Power Drainers, and Energy Projection (As
    show here), Statistics Amplification (Can transfer the strength of his sword onto his fists), Limited
    Durability Negation (The sword attacks the nervous system of its opponents), Aura (Can set his sword
    to reflect specific energies prior) with his Photon Sword.
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
