    in hand to hand combat), Acrobatics (Trained extensively in weight lifting and acrobatics for greater
    strength and agility in his Giant Man state), Supergenius Intellect, Hacking (Hacked into the Eastern
    Bloc Security Network, has hacked into Ultron's security networks) and Preparation (Up to an extent
    that he created 10 billion Jocasta models to aid him) Insect Manipulation (Can control large populations
    of insects; Should have comparable strength to Scott Lang's helmet), Limited Mind Manipulation (Can
    scramble language centers of one's brain) and Space Travel Flight, Bioelectric Blasts (Said blasts
    are capable of damaging Namor), Matter Manipulation (Possesses a molecular disruptor) and Resistance
    to Ice Manipulation and Heat Manipulation (Was resistant to Equinox's thermokinesis) Flight, Acid,
    Gas and Fire Projection, Surface Scaling, Elasticity (All shown here) and Size Manipulation (As shown
    here) Pocket Reality Manipulation (Can create Pym Pockets, which are shrunk portions of time and space,
