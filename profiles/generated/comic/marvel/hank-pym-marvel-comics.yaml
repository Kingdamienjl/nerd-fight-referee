    Travel. Also made the Infinite Avengers Mansion), Sound Manipulation (Possesses a sonic extractor),
    Dimensional Travel using the Dimension Wave Inducer, Technology Manipulation (Can deactivate A.I.s
    using a neural inhibitor), Summoning (Can summon robots to assist him), Shapeshifting and Illusion
    Creation (Using Image Inducers), Extrasensory Perception (Can gauge magical energies with his Wasp
    Goggles), Tranquilizer Launcher (Able to pierce through skin and other such protections on a molecular
    level), Forcefield Creation (Created a forcefield capable of taking hits from Tiger Shark, and another
    capable of tanking blasts from the Wasp), Energy Projection with the Stinger and Homing Attack with
