power_scale:
  tier:
    text: 9-A physically, with Size Manipulation, usually 5-B up to 1-A at maximum size, 5-B with Bioelectric
      blasts and Sonic Disrupters
    source_ids: &id002
    - mediawiki-96574
    confidence: 0.95
  attack_potency:
    text: 'Small Building level physically (Has harmed EquinoxMarvel Team-Up Vol 1 59), Varies with Size
      Manipulation (When tapping into the Size growth axis of the Pym Particle, Hank also taps into the
      Strength axis as the two naturally mesh together, which powers several heroes such as Wonder Man
      and Vision. Scott Lang has also used the Strength axis in order to humiliate Doctor DoomFF Vol 2
      16), usually Planet level (Defeated a Titan that could harm Hercules alongside a few other titans,Avengers
      1963 Annual #23 although Hercules still outshines Hank in raw power. Has traded blows with Atlas,
      who explicitly utilizes the Strength axis of the Pym Particle and was going to kill Moonstone.Avengers/Thunderbolt
      vsol 1 #4 Has traded blows with a giant sized Absorbing Man, who is usually a common foe for Thor
      and Hulk, even after he absorbed the powers of Greithoth. His size manipulation could counter Vision''s
      density manipulation), up to Outerverse level at maximum size (At maximum size, Hank Pym is able
      to enter the Overspace, an entirely new realm of existence beyond time and space where Abstract
      Entities reside,Mighty Avengers Vol 1 30 which is a subsector of theResurrection of Magneto (Vol.
      1) #1; 2024 Mystery beyond the Omniverse), Planet level with Bioelectric blasts (Has harmed Namor)
      and Sonic Disrupter blasts (Has harmed Power Man, who uses the pym particle to a similar degree
      as Giant Man and has matched against Yellow Jacket as Atlas)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Hypersonic (Has reacted to and dodged a suprise attack from Tigra, has dodged arrows from HawkeyeWest
      Coast Avengers Vol 2 #36Mach 8.23), possibly Relativistic+ reactions (Has shrunk fast enough to
      dodge blasts of light from Doctor Spectrum, evaded radiation particles, shrunk out of the way of
      Radioactive Man''s blasts. Reacted to and nearly hit classic Quicksilver, who barely dodged the
      attack by inches, Quicksilver has also stated Giant Man''s reflexes are almost comparable to his
      own) Varies with Size Manipulation'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'Class 5 (He managed to overpower Equinox), Varies with Size Manipulation usually Class G (Easily
      restrained and overpowered the Vision. Although noticably weaker, he has restrained Namor and thrown
      him. once tore a large gun in half, caught a supermassive wrecking ball and threw it with one hand,
      tore off the top half of a skyscraper), possibly far higher (Held back Thor from attacking QuicksilverMighty
      Avengers #34)'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Small Building level, Varies with Size Manipulation, usually Planet level (Has traded blows
      with Dragon Man on multiple occasions.), up to Outerverse level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Small Building level (He can withstand attacks from comparable characters), Varies with Size
      Manipulation (The Pym Particle can increase the durability of it''s user), usually Planet level
      (Traded blows with an alternate-universe version of himself. Survived a shockwave created from a
      clash between an amplified Titania and empowered giant sized Absorbing Man,Avengers Academy #16
      Titania is a regular villain for She-Hulk and Absorbing Man is a regular villain for Thor. Has survived
      attacks from Graviton. Tanked a beam attack from the Vision.Avengers 1963 Annual #23 Survived getting
      thrown by Dragon Man), up to Outerverse level at maximum size (Took multiple hits from Eternity);
      at least Building level, possibly Large Building level with his jumpsuit (Took attacks from Tigra)
      and up to Planet level with forcefields (Created a forcefield capable of taking hits from Tiger
      Shark)'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman
    source_ids: *id002
    confidence: 0.95
  range:
    text: Varies with Size Alteration
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'At least Extraordinary Genius, likely Supergenius (He is one of the world''s foremost biochemists
      and also possesses considerable expertise in numerous scientific fields such as subatomic physics,
      robotics, cybernetics, programming, emergency medicine, optics, and entomology. Frequently acknowledged
      by his peers to have extraordinary intellect. Reverse-engineered a magical time machine, created
      by Doctor Doom, creating a tracking device for each fragment of the machine, also being stated as
      an expert on dimensional variances by a future Tony Stark.The Iron Age #1 Created the Infinite Avengers
      Mansion, a building with millions of floors and interdimensional gateways based on Quantum Physics,
      M Theory, 11th dimensional spacetime, and Wanda''s chaos magic. Used Pym Particles to shrink portions
      of space-time creating a miniature pocket sized labratory. Created Ultron by basing the artificial
      intelligence on his own mind and successfully programmed a virus to take down Ultron''s advance
      defenses. Officially considered the Scientist Supreme by Eternity. While not as intelligent as Reed
      Richards, he is the "mage of science," a man who pushes science to it''s absolute limits, making
      the impossible possible, taking science to the point of magic)'
    source_ids: *id002
    confidence: 0.95
