- id: claim-powers-and-abilities-65aac155
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Size Manipulation (From Small Size Type 8 to Large Size Type
    9; His body is able to produce Pym Particles naturally), Self-Sustenance (Types 1 and 2, when shrunk),
    Skilled Martial Artist (Although less skilled, he has fought with a wide variety of incredibly skilled
