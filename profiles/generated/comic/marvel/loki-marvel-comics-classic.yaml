  intelligence:
    text: Extraordinary Genius (Loki is a master of magics, potions, and science. Has created potions
      to grant powers to dangerous villains such as the Absorbing Man, built a scientific device capable
      of transmuting Thor into a frog, and has ensnared Reed Richards in "mathematical conundrums that
      render him unable to even comprehend anything beyond his own failing computations". A master schemer
      and manipulator, to the point that he manipulated Hela and Mephisto to strike his name from the
      Book of Hel so that his demise at the hand of The Void would result in his rebirth instead of permanent
      death. Engineered his own death at the hand of The Void, and before said death left behind a collection
      of complex clues in the form of a riddle for his reincarnated younger self to bring himself to a
      hidden chamber unknown to Thor, Heimdall, or even Odin. He had planned and made a deal with Mephisto
      so that during Odin's vulnerable state of the Odinsleep, he tricked Thor into killing him, so that
      his soul would possess the Allfather the moment Thor killed him. Went through a complex paradox
      involving time travel so that Thor would kill his own grandfather, Bor, resulting in his exile.
      In combat, Loki is equipped with millennia of experience battling many different kinds of foes across
      the universe, and is extremely skilled in weapon-wielding and magic)
    source_ids: *id002
    confidence: 0.95
