- id: claim-weaknesses-c987882f
  section: weaknesses
  axis: weakness
  text: 'Loki''s passionate hatred of Thor, lust for power, and his tendency to alienate himself through
    his ignoble actions greatly impede his ability to bring his well laid plans to fruition. It is possible
    he needs to cast a spell before receiving damage to regenerate from it, as when Thor broke Loki''s
    arm by surprise, he considered the broken arm could only heal naturally and not by magical aids, despite
    Loki reattaching his head, sliced off by Balder in the same storyline. Feats: See this respect thread
    Note: *This profile only covers the original Loki that debuted in Journey into Mystery #85 and met
    his demise in Siege. Other incarnations, such as Kid Loki and Ikol, will have their own profiles later.
    *Before making any changes to this page, please read and follow the Power-scaling Rules for Marvel
    and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
