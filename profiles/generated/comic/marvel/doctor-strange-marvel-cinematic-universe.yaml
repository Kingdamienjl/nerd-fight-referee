- id: claim-weaknesses-75d34c92
  section: weaknesses
  axis: weakness
  text: 'Rather arrogant and believes himself to be infallible, without his magic.
    The severe nerve damage in Strange''s hands makes it all but impossible to use
    them properly, suffering immense pain when punching enemies. He cannot use some
    spells or activate the Eye of Agamotto if his arms are restrained; however, he
    can still teleport and transmute without any hand gesture. The Runes of Kof-Kol
    can have incredibly dangerous side effects should a second party interfere with
    the spell while Strange performs it, in one case pulling in several individuals
    from across the multiverse at an alarming rate. ==Gallery== Avengers Infinity
    War-Strange BFRs Banner.gif Avengers Infinity War-Strange transmutes vortex.gif
    ==Notable Matchups== Victories: Voldemort (Harry Potter) Voldemort''s Profile
    (9-A+ Sorcerer Supreme Strange was used. Speed was equalized) Triborg (Mortal
    Kombat) Triborg''s Profile (Post-Blip Doctor Strange was used and darkhold was
    restricted. Starting distance was 10 meters and speed was equalized) Losses: Emily
    Kaldwin (Dishonored) Emily’s Profile (Infinity War Strange, only 9-A+ spells,
    took place in Dunwall, started 10 meters away, Speed was equalized) Minato Namikaze
    (Naruto) Minato''s Profile (Alive Minato and Post-Blip Strange were used. SBA
    otherwise) Inconclusive: ==Notes/Explanations== {{scroll box|content=}} {{discussions|Doctor
    Strange Marvel Cinematic Universe|Doctor Strange (Marvel Cinematic Universe)}}
