- id: claim-weaknesses-2b86183a
  section: weaknesses
  axis: weakness
  text: "Arrogant. Formerly had self-esteem and self-acceptance issues. ==Gallery== File:shulkie concept\
    \ art.jpeg|Concept Art ==Notable Matchups== |-|Victories= |-|Losses= *Saul Goodman (Breaking Bad)\
    \ Saul Goodman's Profile (Both were opposing counsel in a court case. She-Hulk was prosecution and\
    \ Saul was defense. Speed was Equalized) *Ditto (Pok\xE9mon) Ditto's profile (She-Hulk had prior knowledge\
    \ of what a Ditto is. The battle took place in the grass of a wild Pok\xE9mon route) *Cancerous Rodent\
    \ (ULTRAKILL) Rodent's profile (7-C Very Cancerous Rodent and Low 7-C She-Hulk are used. Speed Equalized)\
    \ *Toph Beifong (Avatar: The Last Airbender) Toph Beifong's Profile (Both were Low 7-C. Toph had metal\
    \ chains. Speed was Equalized) *Raven (Teen Titans) Raven's Profile (Battle was at a minecraft bedrock-only\
    \ superflat seed, 5 meters apart with speed equalized and limited prior knowledge; Raven's 7-C and\
    \ Class T spells were restricted and Jennifer's considered Low 7-C) *Barry Bee Benson (Bee Movie)\
    \ Barry's Profile (Match was the court case of Mr. Sansweet, Barry was defense and Jennifer was prosecution.\
    \ Both sides had a week of preparation time) *Hiromi Higuruma (Jujutsu Kaisen) Higuruma's Profile\
    \ (Higuruma defended Mr. Incredible and Jennifer defended Mr. Sansweet; Both had plain access to evidences\
    \ and 1 week to prepare besides plain knowledge of 1950's US Penal Code. The case happened outside\
    \ Deadly Sentencing) |-|Inconclusive= ==References== {{Reflist}} {{Discussions|She-Hulk Marvel Cinematic\
    \ Universe|She-Hulk (Marvel Cinematic Universe)}} Category:Characters Category:Marvel Cinematic Universe\
    \ Category:Female Characters Category:Fourth Wall Aware Characters Category:Lawyers Category:Live-Action\
    \ Characters Category:Mutates Category:Primary Protagonists Category:Protagonists Category:Rage Users\
    \ Category:Regeneration Users Category:Shockwave Users Category:Social Influencers Category:Transformation\
    \ Users Category:TV Characters"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
