  attack_potency:
    text: Small Building level physically (Punched Cable. Beat the Red Skull to death
      with his bare hands. Can easily destroy furniture with his blows and fight against
      entire armored convoys, even breaking part of their helmets), Planet level with
      powers (Shown to be comparable to a held-back ThorJourney into Mystery Vol 1/(1952)
      issue 109 & Hercules(The) Champions Vol 1 issue 16 & (The) New Mutants Vol 1
      issue 40 by way of tossing them or tossing objects at them. Blasted and harmed
      Red Hulk with metalAvengers Vol 4 issue 28), many of his attacks are reliant
      on Lifting Strength, higher by stealing the power of planetary objects (Siphoned
      energy from the sun and channeled more power from every planet within reach,
      growing stronger by the second, allowing him to match Bleeding Edge Iron ManAvX
      Vol 1 1)
    source_ids:
    - vsbattles-magneto-earth-616-marvel
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Hypersonic combat speed and reactions (Repeatedly fought evenly against
      the X-Men, himself and them gaining the upper hand against each other several
      times; The X-Men include the likes of Cyclops, Wolverine, Jean Grey, Rogue,
      Beast, Nightcrawler, Psylocke, etc. Kept up with Namor, Havok, Red Hulk, Doctor
      Doom, a held-back Hercules & Thor, and a Hulk on this levelMach 8.23). Up to
      Massively FTL flight speed (Seized control of revolutionary magnetic rays that
      could travel from Earth to a planet in another galaxy and used them to return
      from said planet to Earth in less than a day.(The) Avengers Vol 1/(1963) issue
      47 This situational feat shows he can control magnetic rays faster than himself
      and use them to fly at comparable speeds to them) and Massively FTL attack speed
      (Covered his body with the metal from the satellites around that allowed Iron
      Man to quickly siphon some of Jupiter's magnetic field and himself stole the
      same kind of power from the sun, then channeled more power from every planet
      within reach and grew stronger by the second)
