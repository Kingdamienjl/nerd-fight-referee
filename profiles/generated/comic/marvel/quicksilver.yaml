    systems), Weapon Mastery (Can briefly hold against Black Knight), Regeneration
    (Low), Intangibility (Can vibrate fast enough to phase through doors), Water Walking,
    Self-Perception Manipulation (Can seemingly change how fast he is perceiving surroundings),
    Minor Sound Manipulation (Can easily create sonic booms) Durability Negation (with
    molecular acceleration/destabilization), Vibration and Air Manipulation (Can create
    miniature cyclones with sheer speed), Electricity Manipulation (His breakneck
