- id: claim-weaknesses-82cc4ac7
  section: weaknesses
  axis: weakness
  text: 'Pietro struggles with episodes of mental illness, severe depression, and
    mental breakdowns, causing him to ruin his relationships through force and manipulation.
    His arrogance can leave him prone to attack (such as when he paused to gloat over
    the Ultron drone he defeated) and some of his movement patterns are predictable.
    He also seems to be incapable of running in the dark. Feats: * Travels from LA
    to Buenos Aires in around a minute and a half * While possessed by Cthon, crisscrosses
    the Earth in seconds * Outruns Black Bolt''s voice * Finds a city several miles
    away before Wanda''s hair is even affected by gravity * His speed flash boils
    water * Knocks out three low-level Olympians in one go * Staggers several Sentinels
    and sends one falling * Wrecks Mordred Notable Attacks/Techniques: * Molecular
    Acceleration/Destabilization: Through the course of his life as a mutant, his
    super-speed has granted him numerous abilities. One of the very peculiar ones
    was being able to vibrate his molecular structure at high speeds. Different writers
    used it for different purposes that were often absurd or completely ignored it
    to avoid obscurity. He has demonstrated the full effect which enables him to destabilize
    atomic matter by accelerating the target object''s molecule structure, often causing
    it to fall apart or explode usually by touching it. It is unknown if he can do
    this from a distance like his nephew Thomas Shepherd. * Cyclone: Quicksilver runs
    around his opponent in a circle of radius 10 feet to create a cyclone powerful
    enough to lift a grown man off his feet. * Flight: Quicksilver can achieve movement
    through the air by flapping his arms at a high velocity. * Restricted Time Travel:
    Quicksilver can travel forward or backward in time for a few hours during each
    visit. * Intangibility: Pietro also can use molecular destabilization to walk
    through solid objects. Notes: * Quicksilver cannot normally break his limits,
    even under stressful circumstances, which is why he needed help from Scarlet Witch
    and Synapse.Avengers Vol 1 688 * Before making any changes to this page, please
    read and follow the Power-scaling Rules for Marvel and DC Comics. ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== {{Reflist}} {{Discussions|Quicksilver
    Marvel Comics|Quicksilver (Marvel Comics)}} Category:Characters Category:Marvel
    Comics Category:Accelerated Development Users Category:Acrobats Category:Adults
