    text: At least Galaxy level (Inside the armor, survives attacks on this level
      either relatively fine or harmed while running the risk of being killed, but
      the armor itself is more durable. He can take blows from Iron Man, Hulk, and
      Thor), up to Multiverse level+, possibly Low Complex Multiverse level with magic
      (Easily blocked attacks from Morgan le Fay, who is superior to both Doctor Strange
      and Doom himself, and even when they pierced his shield they were so weakened
      from the shield that he was barely scathed. While probably amped by magic, took
      blows from a Hell-amped Mephisto. Should be comparable if not somewhat superior
      to Doctor Strange and Scarlet Witch. Took hits from Doctor Strange and Doctor
      Voodoo) and Technology/Preparation (Took concentrated attacks from 4 Mad Celestials
      for 27 minutes. Created a force field around the Earth that managed to temporarily
      halt Exitar, the most powerful of the Celestials. Took concentrated attacks
