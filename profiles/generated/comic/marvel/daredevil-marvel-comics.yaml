  stamina:
    text: Superhuman (Matt's stamina is similarly enhanced like his body is, since
      he was able to hold his breath underwater for longer periods of time. At peak
      capacity, he can physically exert himself for several hours before showing any
      signs of fatigue. Matt is exceptionally tolerant to pain. He has survived being
      knocked around in a car by Nitro, survived after slowing himself down during
      a multi-story fall and being hit by a car. He kept fighting after being immolated
      by Typhoid Mary while the same attack severely hurt Jessica Jones, who has superhuman
      durability. On one occasion, he was able to continue functioning for five days
      without any sleep, and on another he continued to function despite having suffered
      a gunshot through both his hands that also grazed his head. Daredevil has landed
      on the hood of a taxi uninjured following a controlled fall and was able to
      kick the windshield hard enough to penetrate it and strike the driver. After
      laying outside with no medical assistance, Daredevil passed away only to utilize
      his chi to supercharge his bodily healing with the help of Stick, regulating
      his heart and respiration to revive himself, sealing cuts, setting the bone
      in his right leg and healing other unspecified bone injuries. After being found
      and hospitalized, under demonic attack once more, he was strong enough to fend
      off the assault and actually run from his room to join the fight against demons
      invading New York City yet again. In this state, he was able to take on a demon
      that had formed from the structure of a subway train, walk against its blast
      of soul-attacking “hellfire,” then spear it with rebar, hurting and frightening
      the demon enough to force it to flee from him, before collapsing from exhaustion.
      Has a degree of mental training to control his senses, a testament to the level
      of skill it requires Matt to even function would be seen, when he fought Psylocke
      during the war between the Avengers and the X-Men, as she was overwhelmed when
      she tried to read his mind and found herself experiencing all the information
      he received through his superhuman senses, demonstrating the scale of psychological
      training required for Murdock to operate as a normal human)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range with martial arts; Tens of Meters with the billy club;
      Tens of Kilometers with his hearing and Radar Sense
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Gifted normally, Genius in combat (Murdock not only has exceptional physical
      abilities, but he also has an impressive legal background. As a highly skilled
      and accomplished lawyer, he specializes in criminal justice, and his legal career
      is a major pillar of his emotional stability and relentless fight against crime
      for which the Murdock law firm is known that they engage in free labor and an
      unwavering commitment to eat a wide range of social justice issues. Through
      his legal expertise, Murdock takes on complex cases, including rape, hate crimes,
      police brutality, wrongful death, medical malpractice, whistleblower and witness
      protection issues, workplace violence, corporate employment fraud, LGBT abuse
      and workplace include inequality, child and sexual abuse claims, victims of
      war crimes and terrorism, food safety claims, vehicle recalls, anti-GMO food
      bias, even environmental issues His tireless efforts in court make him a strong
      advocate for those who have been marginalized or victimized by societal injustices.
      In law school, Murdock showed a keen interest in the American constitution.
      He immersed himself in the intricacies of this important part of American democracy,
      further enriching his legal knowledge and accurately analyzing complex legal
      situations Murdock''s broad understanding of constitutional principles he takes
      a different view of upholding justice and protecting the rights of the innocent)
      Standard Tactics: Matt''s behavior during a fight will depend on the enemy he
      is facing. Dealing with human enemies, Matt will 100% of the time avoid killing
      that person, but that doesn''t mean he will hold back in any way. He can let
      loose against enemies where it wouldn''t make sense to hold back, such as when
      facing enemies wearing powerful armor or enemies equal to or stronger than him.
      Dealing with bandits and thieves, Matt will always aim in places where he knows
      it will hurt - but not kill. The level of pressure applied to each of his blows
      is different not only against varied enemies, but will also depend on the location
      hit.Daredevil Vol 6 Issue 2 When fighting against non-human enemies, such as
      animals, monsters, or the undead, Matt fights to kill.'
    source_ids: *id002
    confidence: 0.95
