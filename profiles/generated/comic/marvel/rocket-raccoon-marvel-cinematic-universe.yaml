power_scale:
  tier:
    text: 'At most {{7-A}}, higher with weaponry and Preparation, far higher with the Hadron Enforcer
      Name: Rocket Raccoon, Subject 89P13 Origin: Marvel Cinematic Universe Gender: Male Classification:
      Evolved and cybernetically enhanced Raccoon Age: Around his 30s'
    source_ids: &id002
    - mediawiki-13347
    confidence: 0.95
  attack_potency:
    text: 'At most Mountain level (Held his own against GamoraGuardians of the Galaxy (2014)), higher
      with weaponry and Preparation (His firearms can knock down KorgThor: Love and Thunder and are implied
      by Gamora to be more powerful than her Godslayer,Guardians of the Galaxy Vol. 2 which can kill an
      Asgardian, and should be comparable to, if not stronger than, that of Star-Lord''s. His explosives
      destroyed Ego''s energy constructs), far higher with the Hadron Enforcer (Stated to be powerful
      enough to destroy entire moons.Given the Guardians of the Galaxy movies are set in Andromeda, it
      is highly unlikely that Rocket had any knowledge regarding Earth''s moon (Which is the celestial
      body that defines the baseline for a Moon level rating) while making such statement. Furthermore,
      there is no proof that Rocket was referring to a moon whose size is as large as Earth''s, especially
      when his reference to an "average" moon likely does not resemble Earth''s. This reasoning was accepted
      on this thread Threatened to use it to destroy the Eclector)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Superhuman travel speed (Evaded gunfire while running) with Subsonic combat and reaction speed
      (Can keep up with Gamora), Massively Hypersonic+ flight speed with Aero-Rigs
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Above Average Human (At least stronger than Baby Groot. Can lift disproportionately
      large weaponry compared to his body)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At most Mountain level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: "At most Mountain level (Took a hit from Ego's energy construct, who attacked him with everything\
      \ he had.Marvel Website: Ego Withstood being bullrushed by Adam Warlock through multiple walls and\
      \ being thrown by the High Evolutionary. Endured getting thrown a distance into a sign by Gamora.\
      \ Survived without notable damage an attack from Ronan's Cosmi-Rod which was also being empowered\
      \ by the Power Stone, while a casual attack was able to one-shot the Other, who is stated by WoG\
      \ to be very powerful even in comparison to Loki.The Problem With Bringing Thanos Into \u2018Guardians\
      \ of the Galaxy\u2019 Survived part of the destruction of the New Avengers FacilityAvengers: Endgame),\
      \ higher with Energy Shields (Unaffected by explosions that destroyed Ego's energy constructs)"
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: At least Average
    source_ids: *id002
    confidence: 0.95
  range:
    text: Below Standard Melee Range, Hundreds of Meters with ranged weapons
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Extraordinary Genius (Due to the experiments performed on him by High Evolutionary, Rocket possesses
      an extremely heightened intellect. Even as a child he possessed remarkable intellect and could solve
      advanced mathematical equations. Could figure out the solution to why the High Evolutionary's artificial
      evolutionary chamber was inducing rage in the subjects, something even the High Evolutionary couldn't
      deduce. His intellect was remarkable enough that the High Evolutionary wanted to dissect Rocket's
      brain and study it further. Was noted by the High Evolutionary to be the only subject with the ability
      to be creative and invent instead of just using rote memorization. Could create a key card to escape
      his pen using nothing but individual parts he'd collected and hidden, and could later pilot a starship
      despite never having operated a spacecraft before. He escaped every prison he's been to. An expert
      with ranged weapons and explosives, exceptional engineer. Capable of creating a device strong enough
      to destroy a moon. Helped Tony Stark and Smart Hulk create the Nano Gauntlet, and noted that Tony
      was only a genius on Earth, implying himself to be of superior intelligence to him)
    source_ids: *id002
    confidence: 0.95
