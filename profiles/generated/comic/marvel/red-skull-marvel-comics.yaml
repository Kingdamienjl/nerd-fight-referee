    with holographic projector *Stealth Mastery (Killed a prisoner in a locked room
    in a tower without the superheroes, including Captain America, noticing) *Previously
    Telepathy, Mind Manipulation, and other abilities (In the past, his own brain
    was fused with that of Charles Xavier, giving him his powers) *Longevity *Enhanced
    Senses *Precognition *Regeneration (Low) *Resistance to Poison Manipulation, Mind
    Manipulation, Empathic Manipulation, Illusion Creation and Radiation Manipulation
    (Has the same powers as Captain America due to using a body cloned from him) |-|As
    Red Onslaught= Same as before in addition to: *Superhuman Physical Characteristics
    *Regeneration (Low-Godly. Regenerated from having its essence scattered across
    a dimension)Onslaught Unleashed #2 *Incorporeality *Flight *Possession (Can manifest
    new powers from the bodies of those that it possesses)Onslaught Reborn Issue 01
    *Absorption *Invisibility (Also by bending light around itself) *Illusion Creation
    *Forcefield Creation *Reality Warping (Can create holes in realityX-Man #19, contained
    Franklin RichardsCable Vol 1 #35, created a massive citadelIncredible Hulk Vol
    1 Issue 445) *BFR *Telepathy (Including Mind Control (Possessed Thor)Onslaught
    Reborn #3, Mind Manipulation (Can shut down minds), Memory Manipulation, Pain
    Manipulation, Manipulation of one''s perception of time), Telekinesis, Teleportation,
    Astral Projection, Sleep Induction (shown here)Uncanny X-Men Vol 1 #333 *Magnetism
    Manipulation (shown here)., Matter Manipulation (Atomic level) *Electricity Manipulation,
    Explosion Manipulation, Energy Manipulation and Projection (shown here, hereOnslaught:
    X-Men and here) *Earth Manipulation (Can create earthquakes and volcanoes) *Technology
    Manipulation *Ice Manipulation (Can freeze an area to near Absolute Zero) *Limited
    Gravity Manipulation (Can reverse gravity) *Limited Biological Manipulation (Can
    manipulate the iron in blood, causing bodies to freeze and denying access to certain
    abilities) *Statistics Amplification (Can amplify its physical abilities) *Enhanced
    Senses (Can perceive phenomena across the electromagnetic spectrum) *Spatial Manipulation
    (Can create wormholes) *Perception Manipulation (Can alter or take away senses)
    and Power Nullification (block the parts of the brain used to control superhuman
    powers) *Clairvoyance (Can sense things from another person''s perspective. Can
    communicate with animals, Can identify mutants via their distinct brainwaves,
    Can learn or teach languages and other complex information telepathically) *Resistance
    to Telepathy, Mind Manipulation, Life-Force Absorption and Density Manipulation'
