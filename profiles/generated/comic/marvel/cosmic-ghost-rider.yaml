- id: claim-powers-and-abilities-a3fce6e0
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Self-Sustenance (Type 1), Immortality (Types 1, 2, 3, 4 &
    7. Harmed others at his level with both his head and body disconnected & capable of operating even
    when reduced to a head), Regeneration (Low-Godly. Died, went to the Hell dimension, got his spirit
    trapped in a car on Earth and returned to his physical/"natural form" after getting free), Self-Resurrection,
    Dimensional Travel (Suggested to be able to go into the Hell dimension and back), Hellfire Manipulation
    (Destroyed the Annihilation Wave), Energy Projection (Blasted Thor and Thanos), Flight, Spaceflight
    via Hell Cycle, Explosion Manipulation, Fire Manipulation, Chain Manipulation (Restrained Thanos),
    Skilled Marksman, Mind Manipulation & Pain Manipulation (via Penance Stare), Stealth Mastery, Martial
    Arts, Possession (As a spirit, possessed Robbie Reyes' Hell Charger, Iron Man suits and a dead Alpha
    Celestial), Summoning (Can summon his bike with an arm gesture), Soul Absorption (Can absorb the souls
    of others to regain power and heal), Telekinesis (Used to deconstruct a spaceship), Resistance to
    Fire, Purification (Exorcism can never get rid of the Spirit of Vengeance), Soul Manipulation (Lacks
    a Soul), Madness Manipulation (Withstood Galactus ripping his mind to search for information, which
    would have made him insane if he wasn't already), Gravity Radiation Manipulation (Survived being sucked
    into a black hole and escaping with assistance). Time Stop & Time Travel (with the Time Stone)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
