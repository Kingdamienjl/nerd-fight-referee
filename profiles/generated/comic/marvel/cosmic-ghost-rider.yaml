- id: claim-standard-equipment-28a43f1f
  section: equipment
  axis: equipment
  text: '*Chains: Cosmic Ghost Rider wields chains forged from the bones of Cyttorak. They are so strong
    that even Thanos cannot break them once entangled. They are capable of being used like a whip and
    can tear through mutltiple opponents at once. *Hell Cycle: Like other Ghost Riders, Frank utilizes
    a bike. His, however, is futuristic and capable of traveling quickly through over ground, in the air
    and even in the vacuum of space. *Guns: He wields a pair of large handguns that shoot Hellfire. *Optional'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
