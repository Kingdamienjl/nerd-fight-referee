      value: 'Rather arrogant and believes himself to be infallible, without his magic.
        The severe nerve damage in Strange''s hands makes it all but impossible to
        use them properly, suffering immense pain when punching enemies. He cannot
        use some spells or activate the Eye of Agamotto if his arms are restrained;
        however, he can still teleport and transmute without any hand gesture. The
        Runes of Kof-Kol can have incredibly dangerous side effects should a second
        party interfere with the spell while Strange performs it, in one case pulling
        in several individuals from across the multiverse at an alarming rate. ==Gallery==
