- id: claim-weaknesses-69f5a516
  section: weaknesses
  axis: weakness
  text: 'The Venom symbiote, like all others of its kind, is extremely vulnerable to heat and sonic based
    attacks. They can cause the symbiote physical pain and discomfort, where as "more powerful" attacks
    might be completely ineffective. Notes: *It has not been shown throughout the comics whether Agent
    Venom has Precognition (Through the spider sense). It is implied that Agent Venom did not have it,
    since his powers came from the Venom symbiote that had formerly been bonded to Eddie Brock and Mac
    Gargan, neither of whom possessed the ability. *Before making any changes to this page, please read
    and follow the Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
