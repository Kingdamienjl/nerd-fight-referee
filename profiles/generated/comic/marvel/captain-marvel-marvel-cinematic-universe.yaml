      to see that version of me.|Captain Marvel to Monica Rambeau}} }} |-|Binary=right|360px {{Quote|Higher,
      further, faster, baby!|Carol Danvers}} ==Summary== Captain Carol Susan Jane Danvers, also known
      as Captain Marvel, is a former United States Air Force pilot who, upon being exposed to the energy
      of the Tesseract, obtained cosmic powers. She was made into a Kree-Human hybrid via a blood transfusion
      from Yon-Rogg, while having her memories removed, turning her into the Kree's weapon and a member
      of Starforce. During the Kree's war with the Skrulls, Danvers returned to Earth and began recalling
      her past, with help from Nick Fury and Maria Rambeau. Danvers also discovered that Yon-Rogg had
      been manipulating her for years, learning from Talos that the Skrulls were merely seeking to find
      a new home. With this information, Danvers unlocked her true powers and defeated the Kree invasion
      onto Earth that was being led by Ronan the Accuser, before setting off out to the far reaches of
      the galaxy to finish what her late mentor Mar-Vell had once started. ==Powers and Stats
