- id: claim-standard-equipment-8b1f14ad
  section: equipment
  axis: equipment
  text: '*Green Goblin: **Goblin Glider: The Green Goblin''s trademark glider, allowing for high-speed
    flight and maneuverability. **Pumpkin Bombs: The Green Goblin carries a variety of pumpkin bombs in
    his "Bag of Tricks", some of which contain different payloads, such as hallucinogenic gases, silent
    incendiary bombs or gas that would neutralize Spider-Man''s Spider-Sense. **Razor Bats: The Green
    Goblin can throw sharp bat-shaped projectiles that pierce targets. **Bag of Tricks: A bag that contains
    various unusual weapons, such as a toad that can unleash sonic screams, a crescent-shaped boomerang,
    among others. *Iron Patriot: **Uni-Beam: Like Iron Man armors, this armor wields a uni-beam. However,
    due to its star-shaped figure, the amount of energy and power able to be released was reduced, making
    the uni-beam overall weaker. This is shown when the uni-beam backfires on Norman when he tries to
    use it against Spider-Man.'
