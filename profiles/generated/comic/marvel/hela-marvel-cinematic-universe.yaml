      palace, which withstood Gungnir''s taps powerful enough to resonate across Asgard563.86
      Teratons of TNT), up to at least Multi-Continent level with Accelerated Development
      (After being knocked out by Post-Awakening Thor''s lightning, she was seething
      with enhanced power, to the point that it seemed like it had done nothing to
      her, now being able to harm Thor, badly injuring him and Valkyrie. Sliced through
      Skurge''s armor, which is made of Uru. Odin stated that by drawing her strength
      from Asgard, her powers will be limitless, becoming all-powerful646.57085 Petatons
      of TNT), up to Small Star level, possibly Solar System level with weaponry (Stabbed
      and drew blood from Eternal Flame Surtur with her large spikes while attacking
      with all her might68.033 Quettatons of TNT, possibly 3.13 KiloFoe) | Small Star
      level, possibly Solar System level (At one point, she was the most powerful
      warrior in all Nine Realms, being unmatched in every way and Odin''s most powerful
      weapon in the conquest, which would make her more powerful than the Tesseract
      and the Bifrost, the latter of which created a massive black holeMarvel.com
      - Loki''s profile upon explodingThor (2011), which caused significant solar
      lensingThe Avengers Prelude: Fury''s Big Week, whereas star-sized and even galaxy-sized
      black holes only cause minor solar lensing, likely making that black hole more
      massive than either)'
    source_ids: *id002
    confidence: 0.95
