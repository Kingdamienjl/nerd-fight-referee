  attack_potency:
    text: 'At least Large Country level+ (Considered the Casket of Ancient Winters
      as weak. While severely depowered, she destroyed Mjölnir with one hand and slammed
      Thor through Bifrost''s shards, breaking them. Later on Asgard, she defeated
