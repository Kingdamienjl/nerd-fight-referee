    moves to dodge his optic blastsX-Men 1991 #3), Biological Manipulation (Can stop someone''s heart
    and blood flow. Can shut off someone''s nerve ending and was stated to be able to "unplug" a person''s
    nervous systemX-Factor 1986 #14Uncanny X-Men 1963 #306New X-Men 2001 #118), Minor Blood Manipulation
    (Stopped the flow of blood from reaching Deadpool''s brain and can clot Fantomex''s blood to stop
    his bleedingCable Vol. 4 #11New X-Men vol. 1 #126), Paralysis Inducement (Stopped Spider-Man and Iron
    Man from moving with her powersMarvel Team Up 1972 #4Iron Man Annual #8), Technology Manipulation
    (Stopped a camera from working and froze the circuitry in Fitzroy''s glovesX-Factor 1986 #14Uncanny
    X-Men 1963 #281), Telekinesis and Minor Matter Manipulation (Stated to move objects as big as mountains
    and as small as air moleculesX-Men 1991 #96X-Man #55New X-Men 2001 #116New X-Men 2001 #148), Immortality
    & Regeneration (Types 2 & 3; Low-Godly. A younger past version of Earth-616 Jean Grey survived losing
    her body and being reduced to just her mind, before gathering enough psychic energy to pull her body
    back togetherVenomized (2018) #5), Flight (Can use her powers to fly herself and several peopleX-Factor
    1986 #25X-Factor 1986 #50), Energy Projection (Instances shown hereUncanny X-Men 1963 #98X-Men 1991
    #65Uncanny X-Men 1963 #270), Absorption and Statistics Amplification (Can absorb the psychic energies
    of others. This can be used to increase her powerUncanny X-Men Vol 1 #280Generations: Phoenix and
    Jean Grey), Forcefield Creation (Shown hereUncanny X-Men 1963 #242), Extrasensory Perception (Can
    sense brainwave activity and emotions. She can also sense someone stuck underground. Through seeing
    mental images and feeling sensations, she can sense a trap about to happenAstonishing X-Men 1999 #1Astonishing
    X-Men 1999 #1New X-Men 2001 #116Uncanny X-Men 1963 #97), Mind Manipulation (Can turn off someone''s
    mind. Hurt Juggernaut through his helmet. Breaks through mental barriers placed by OnslaughtUncanny
