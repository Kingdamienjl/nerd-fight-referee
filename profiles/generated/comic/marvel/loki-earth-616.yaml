    text: Planet level (Broke out of Apocalypse's restraints. Easily overwhelmed Eric
      Masterson Thor. His shake of pain made Asgard tremble while restrained far away
      from the Capital of the realm), High Universe level with magic (Blasted Beta
      Ray Bill, Eric Masterson Thor, and Dargo with a single energy blast. Defeated
      a team of X-Men with a single attack. Shattered Doctor Strange's shield. Knocked
      out Beta Ray Bill with one magical attack. Fought against a serious Silver Surfer.
      Weakened the magic of Nobilus, who was created with Thor's cell samples. Enchanted
      the air to create eruptions that could bring Thor down5-D). Several equipment
