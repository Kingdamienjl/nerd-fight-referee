- id: claim-powers-and-abilities-9a883820
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Faltinian/Dark Dimension Physiology & Flames (Albeit with
    her full Faltine physiology [such as Incorporeality] only being when she transforms into her Faltine
    form) *Master of Sorcery on the level of a Sorcerer Supreme **Psychometry (Clea used magic to show
    Valkyrie the backstory of The Hulk) **Teleportation/BFR (Clea casually made a truck disappear with
    a spell) **Summoning (An amnesiac Clea who was relatively inexperienced with her magics was capable
    of summoning a large amount of tentacles to attack a group of passersbyDoctor Strange Vol. 2 #22)
    **Petrification (With the Stone Prison of Umar) **Stealth Mastery (Clea used her magic to conceal
    Doctor Strange''s presence from Umar''s magic senses) **Time Manipulation & Existence Erasure (Clea
    made an attacking thug fade into thin air with a Spell of Temporal Vanishment) **Mind Manipulation
    (Dark Dimension inhabitants can erase the minds of others) **Stealth Mastery (Clea used a magic illusion
    to disguise herself as Oniri in order to deceive Umar, with Oniri himself being disguised as Clea)
    **Portal Creation & Dimensional Travel (By ripping a small hole in reality, Clea could use a "transtep
    jump" to travel from the Dark Dimension to EarthDoctor Strange: Sorcerer Supreme #67) **Body Puppetry
    (An amnesiac Clea who was relatively inexperienced with her magics forced a large group of people
    to bow down to her) **Forcefield Creation (Clea also defended Harvestman Doctor Strange with the Citadel
    of Cyriont) **Absorption (Clea casually absorbed a monster into herself, later releasing it against
    her enemies with said monster now being under her control) **Telekinesis (With just a gesture, Clea
    could telekinetically sweep up all the garbage in an alley and use it to pin three men to a brick
    wall. An amnesiac Clea easily fused a woman with the metal wall of her cell, killing her in the process)
    **Transmutation (Clea turned a small army of gangsters into snakes. An amnesiac Clea casually turned
    a man into a pig, and soon after turned multiple police officers'' guns into snakes) **Empathic Manipulation
    (While pretending to be unconscious, Clea telepathically used a Sympathy Spell to conjure a magic
    circuit that connected the psyches of Nick Fury, Pamela Hawley, and Morgana Blessing, routing them
    through Doctor Strange''s body.Doctor Strange Vol. 2 #51 Clea took Zelma Winston''s emotional bliss
    and gave it to a demon, briefly debilitating the demon long enough for it to be containedDoctor Strange
    Vol. 4 Annual #1) **Danmaku (With the Stymphalian Hurricane spellStrange (2022) #1 ) **Telekinesis
    (Using Faltine magic, telekinetically stopped dozens of bullets at once with easeStrange (2022) #3)
    **BFR (Casually sent Thaddeus Paine to the Dark Dimension) **Weapon Creation (Can create spears of
    energy called the Spines of Sal-Gotha, which can be used as projectiles, as well as swords of energy
    with Sarnios'' Storm of SwordsStrange (2022) #2) **Portal Creation (Used portals to redirect a revenant''s
    attack and sever his arms, and used a portal to behead a twisted clone of Black Bolt) **Fear Manipulation
    (Using her Faltine form and "the horrors of the Dark Dimension", scared a cannibal into revealing
    his boss''s headquarters despite the cannibal being unphased by a bloody beating from Moon Knight
    and the cannibal knowing that revealing the location would cost him his vital food sourceStrange (2022)
    #5 ) **Biological Manipulation & Deconstruction (Disintegrates a soldier''s flesh down to his bones
    with Dire''s Scourging Ray) **Petrification & Time Manipulation (Stated that she could turn a massive
    swarm of tendrils into stone, before opting to freeze a large number of people in timeNew Avengers
    (2025) #5) Resistance to: *Sorcery on the level of a Sorcerer Supreme *The Flames of the Faltine (Has
    fought Dormammu and Umar on multiple occasions)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
