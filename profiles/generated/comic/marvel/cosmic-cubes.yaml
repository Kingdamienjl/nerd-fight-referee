    would be able to use one to rewrite all reality into a world where the Nazis won World War 2 and rule
    the worldCaptain America Vol. 1 #446), Biological Manipulation, Matter Manipulation, Fusionism (Thanos
    used a Cosmic Cube to become the universe itself, turning his very spirit into its substanceCaptain
    Marvel Vol. 1 #33), Age Manipulation (Thanos attempted to age Captain Marvel to death using the Cube''s
    power), Higher-Dimensional Existence (Cosmic Cubes are stated to be omni-dimensional structures"Marvel
    Super-Villain Team-Up #17"), BFR (Red Skull hurled Captain America across a thousand dimensionsCaptain
    America Vol. 1 #115), Vibration Manipulation, Explosion Manipulation, Hellfire Manipulation (Red Skull
