- id: claim-powers-and-abilities-a1a6bc27
  section: abilities
  axis: hax
  text: 'Base= *Basic Magic (The Juggernaut''s abilities are derived from the mystical Crimson Gem of
    Cyttorak, making his powers magical in nature) *Superhuman Physical Characteristics **Self-Sustenance
    (All Types) **Immortality (Types 2 & 3Juggernaut Vol 1 Issue 1) **Regeneration (At least Mid; Upon
    having his powers back, he quickly came back from being reduced to his skeleton with nothing left,
    although decapitation can kill him) *Forcefield Creation (He can produce an incredibly durable invisible
    forcefield around himself that can drain inertia from thrown weapons to stop them before they reach
    him) *Energy Absorption *Transmutation (Can change his civies into his armor & helmet just by thinkingSpider-Man
    Vol 1 84 - "Nothing Stops the Juggernaut!". Turned a metal gauntlet into his helmetAmazing Spider-Man
    Vol 1 Issue 628) *Air Manipulation (Shown hereCyclops Vol 1 Issue 1 & here) *Shockwave Generation
    (Shown hereUncanny X-Men Vol 1 Issue 33) *Aura (Can exude an aura that slightly pushes things away
    from himX-Men Vol 1 Issue 131) *Social Influencing, Empowerment, & Blessed (Convinced Cyttorak into
    giving him more power, even after he defied Cyttorak''s wishes to kill the Blight-infested X-Men,
    and was implied to have won Cyttorak''s respectAmazing Spider-Man (2022) #68) *Supernatural Willpower
    & Resistance to Power Nullification (Managed to resist the Soulsword and power through being stabbed
    by it, even though it should have left him powerless and in so much pain that he''d be unable to move)
    Resistance to: *Telepathy and Mind Manipulation (With his helmet on. Professor X is unable to read
    his mindX-Men #12) *Ice Manipulation & Cosmic radiations (Can break out of being frozen and survive
    in spaceIncredible Hulk Volume 1 Issue 602, which is cold and filled with radiation) *Pain (Hardly
    ever bothered by pain in his fights, showed no discomfort upon being reduced to a skeleton) *Fire
    (Brushes off an infernoAmazing Spider-Man Vol 1 #230) *Electricity (Unharmed by a deadly jolt of electricityAmazing
    Spider-Man Vol 1 #229) *Sleep Manipulation (Unaffected by sleeping gas) *Sound Manipulation (Unaffected
    by Siryn''s sonic screamX-Force #3) *Corruption (Type 2), Mind Manipulation, & Soul Manipulation (Due
    to Cyttorak''s protection, he resisted the Blight, which infects people and rots their souls by turning
    them against their allies, and also makes them destroy that which they hold most dear) |-|Trion Juggernaut=
    All previous abilities, plus: *Matter Manipulation *Size-Shifting *Levitation *Energy Manipulation
    *Space-Time Manipulation (Broke down very fabric of space and time itself into another dimension)
    *Portal Creation'
  source_ids: *id003
