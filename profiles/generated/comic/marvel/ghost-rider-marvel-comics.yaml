- id: claim-weaknesses-549a3d3b
  section: weaknesses
  axis: weakness
  text: 'Using the "Damnation Stare" on demonic entities will cause their moral bankruptcy to contaminate
    the Rider bit by bit, making Blaze susceptible to Mephisto''s direct control the more he uses it on
    the escaped condemned. Can only transform through an act of will or when innocent blood is spilled.
    Any weaponry that''s blessed or forged in Heaven can harm or even kill the Ghost Rider and if the
    Spirit of Vengeance is separated from Johnny, he will lose his powers and become mortal again. Notable
    Attacks/Techniques: *Hellfire Manipulation: Ghost Rider possesses the ability to generate, control,
    and project mystical fire, or "hellfire" at will. Hellfire is an empyreal and supernatural flame that
    burns the soul of a person and can be used to burn their physical body. He can utilize this fire in
    various ways, including projecting it from his eyes, hands, mouth, or even channeling it from his
    body into his weapons like his shotgun, form walls of hellfire, and even create a motorcycle completely
    out of hellfire. *Mystical Chain Projection: Ghost Rider wields a mystical chain that is capable of
    growing in length, cutting through almost anything, and transforming into other weapons. He can also
    spew and project chains from his mouth or chest at will. *Penance Stare: Ghost Rider possesses the
    supernatural ability to cause any individual who stares into his eyes to see and feel every bit of
    pain they have ever inflicted on anyone in their entire lifetime. Note: *There are many versions of
    Ghost Rider, this profile deals with the Johnny Blaze version of Ghost Rider in the main 616 Marvel
    universe. *Before making any changes to this page, please read and follow the Power-scaling Rules
    for Marvel and DC Comics. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{Scroll
    box|content={{Reflist|2}}}} ==Notes== {{scroll box|content=}} {{Discussions|Ghost Rider Marvel Comics|Ghost
