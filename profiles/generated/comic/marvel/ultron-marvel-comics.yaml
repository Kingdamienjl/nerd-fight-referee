- id: claim-powers-and-abilities-b52b2d93
  section: abilities
  axis: hax
  text: 'Most Bodies= *Superhuman Physical Characteristics **Inorganic Physiology (Type 2) **Self-Sustenance
    (Types 1 & 2) *Genius Intelligence Varies depending on the model, has demonstrated the following powers;
    *Flight & Spaceflight *Enhanced Senses (Call tell if someone is lying based on listening to their
    heartbeat) *Energy Manipulation & Projection (Concussion Wrist Blasters, Eye beams, AOE blast, Traction
    Beams (shown here),Radiation Emitters (shown here) *Electricity Manipulation (shown here) *Sound Manipulation
    *Immortality (Type 6; Can transmit his memory and personality as data onto computer systems) *Shapeshifting
    (Can transform into energy) *Mind Manipulation *Matter Manipulation (Molecular; Can disintegrate things
    and reconstruct his body on the molecular level) *Regeneration (High) *Technology Manipulation *Homing
    Attack & Gravity Manipulation (High frequency pulsed magnetic graviton particle containment fields.
    Computer-assisted field control configures gravitons into various shapes which alter the local effects
    of gravity) *His molecular rearranger can be used for reconstructing or modifying his physical form
    *Radiation Manipulation (With radiation emitters and atomic fire) *Energy Absorption (Multi-spectrum
    resonating inducting antenna array converts electromagnetic radiation into electric energy for use
    or storage) *Body Control (Has total control over every atom in his own body) *Summoning (Roboticks,
    insect-like drones that can devour human flesh) *Transmutation (Can disintegrate matter and turn it
    into energy) *Explosion Manipulation (Created an explosion of energy that was strong enough to send
    the Avengers flying, Oneshots Vision with an ionic explosion) *Memory Manipulation (Can drain information
    from a target''s mind) |-|Ultron-19= All previous abilities, plus; *Power Nullification (Can depower
    machines with a touch) *Matter Manipulation (Sub-Atomic) *Hive Mind (Type 1) *Mind Manipulation &
    Weather Manipulation (Took control over Stark''s satellite, which could control weather, Can use this
    to create lightnings, which are powerful enough to hurt The Sentry) *Transmutation *Forcefield Creation
    (Durable enough to damage an Adamantium axe) *Hacking (Hacked into the SHIELD Helicarrier. Can cause
    a global EMP, disabling every electronic equipment on the planet) *Summoning (Has control over many
    of Iron Man''s suits, and can use them to help him in battle) *Attack Reflection (Reversed Wonder
    Mans'' Ion energy) *Technology Manipulation(Can jam cybernetic senses) Resistance to: *Technology
    Manipulation (Invisible to various forms of detection, including electron trail detectors and infra-image)'
  source_ids: *id003
  decisive: true
  status: unverified
