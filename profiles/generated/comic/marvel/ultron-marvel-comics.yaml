- id: claim-weaknesses-d9c3a3f4
  section: weaknesses
  axis: weakness
  text: 'Ultron''s non-adamantium components are much weaker than the rest of his body. His Adamantium
    body makes him susceptible to attacks based on electricity, magnetism, and Antarctic Vibranium (which
    dissolves atomic/molecular bonds within metals). Should he succeed to subjugate the human race, he
    might eventually act more human, be depressed and go mad over not knowing why he conquered the world
    in the first place. Claims to not believe in love, is unaware of his own love for Hank Pym and is
    emotionally unstable and easily exploitable when that or similar topics call his attention. Is nihilistic,
    doesn''t love himself, and once panicked & went into exile while remaining inactive due to being forced
    to love himself, if while fused with Hank Pym. Notable Attacks/Techniques: *Concussion Blasters: Laser
    channeled plasma beam with high and low-density plasma options. *Encephalo-beam: Located in the head
    cavity, the encephalo ray plunges its victims into a deathlike coma. It also allows Ultron to mesmerize
    and outright control his victims or implant subliminal hypnotic commands within their minds to be
    enacted at a later time. *Energy Absorption: Multi-spectrum resonating inducting antenna array convert
    electromagnetic radiation into electric energy for use or storage. *Program Transmitter: Located in
    his head cavity, the program transmitter can project Ultron''s entire 3.2 terabyte memory/personality
    system into some computer systems by means of a collimated, high bit-rate magnetic inductance beam.
    He can beam part or all of Ultron''s programming into remote locations such as computers or alternate
    robotic bodies. Ultron can often control other machines remotely even if he has not transplanted his
    consciousness into them. One recent Ultron model developed hive-mind technology, allowing him to animate
    and control hundreds of alternate Ultron bodies at the same time, becoming a robotic one-man army.
    Ultron has created a variety of robots and androids over the years, and while the more sophisticated
    ones typically turn against him sooner or later, they all feature subliminal programming which allows
    Ultron to manipulate them if need be (most notably a subliminal command to rebuild Ultron if he is
    destroyed). This subliminal programming was unwittingly passed down to the artificial life-forms created
    by Ultron''s creation, Alkhema, making them subject to Ultron''s influence as well. Notes: *Before
    making any changes to this page, please read and follow the Power-scaling Rules for Marvel and DC
    Comics. *Marvel Comics'' Official Handbook lists Ultron as comparable to Iron Man, though this claim
    is consistently contradicted in the actual comics and is therefore ignored. *Many of Ultron''s iconic
    and overpowered variants come from separate universes. This profile only covers Earth-616''s Ultron
    in the universe''s present state. ==Notable Matchups== Victories: Losses: Inconclusive: ==Notes/Explanations==
