- id: claim-weaknesses-1a2011f4
  section: weaknesses
  axis: weakness
  text: '*Appearance Limitation: Originally, it was clearly stated that Mystique''s
    powers were limited to appearances only; she could not assume the powers of the
    people she morphed into or alter her body to adapt to different situations. Although
    Mystique''s powers were enhanced, Mystique could never duplicate the powers of
    other superhumans, and she still cannot duplicate the powers of the person she
    imitates: for example, when she turned herself into a duplicate of Nightcrawler,
    she did not gain the ability to teleport. However, she can use her powers to mimic
    the powers of others; such as assuming the form of Sabretooth, and then using
    her powers to enhance her senses, strength, speed, agility, and naturally heal
    at an accelerated rate. *Unchangeable Body Ma'
  source_ids: *id003
