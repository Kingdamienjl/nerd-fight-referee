- id: claim-powers-and-abilities-c93c3802
  section: abilities
  axis: hax
  text: 'Avenger= Superhuman Physical Characteristics, Regeneration (Mid-Low; healed
    from a stab by Abomination.The Incredible Hulk (2008) Later regenerated from having
    his leg pierced by FenrisThor: Ragnarok), Vehicular Mastery (Can drive a QuinjetAvengers:
