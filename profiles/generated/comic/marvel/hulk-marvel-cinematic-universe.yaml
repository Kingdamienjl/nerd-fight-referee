    his rage increasesGuidebook to the Marvel Cinematic Universe - The Incredible
    Hulk), Vibration Manipulation (Via Thunderclaps), Transformation, Multiple Selves
    (Type 1; Hulk and Bruce Banner are separate personalitiesAvengers: Infinity War),
    Berserk Mode; Resistance to Alcoholism, Immunity to Disease Manipulation (Samuel
    stated that his DNA could make humanity immune to disease, which has been displayed
    as it mutates the person if his DNA is in their blood stream), Poison Manipulation
