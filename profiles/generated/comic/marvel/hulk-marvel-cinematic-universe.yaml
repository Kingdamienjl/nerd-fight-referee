- id: claim-weaknesses-bf8c16ca
  section: weaknesses
  axis: weakness
  text: 'As Banner, he can be killed just as easily as any normal human, as long as
    he isn''t given sufficient time to transform into the Hulk. Needs a heartbeat
    of 200 BPM to transform (formerly). His cells can be drained of their radiation,
    reverting him to Bruce Banner, though this is only temporary. As Hulk, he is mindless
    in his fighting style, causing him to be defeated by more skilled fighters such
    as Thanos | Incapable of utilizing boosts in power from his rage, having overcome
    his anger. His right arm was damaged after he used the Nano Gauntlet to bring
    back those wiped out by Thanos'' Snap, though he later managed to heal it ==Gallery==
    |-|Avengers= Hulk VS Thor HD Puny god |-|Age of Ultron= Avengers Age Of Ultron
    HulkBuster Protocol -(Iron Man) HulkBuster vs. Hulk 1080p ==Notable Matchups==
    Victories: *Red Hulk (Marvel Cinematic Universe) Red Hulk''s Profile (Avenger
    Hulk was used) * Hulk (Ultimate Marvel) Hulk''s Profile (7-A Avenger Hulk was
    used, and speed was equalized) Losses: *Wolverine (FOX''s X-Men) Wolverine''s
    Profile (Speed was equalized and both were in-character. 7-A Avenger Hulk and
    Post-Adamantium Wolverine were used) *Godzilla (MonsterVerse) Godzilla''s Profile
    (Speed was equalized, Gladiator Hulk and Base Godzilla were used, SBA otherwise)
