  striking_strength:
    text: right|340px {{Quote|Sending those creatures after her instead of myself was mercy. And in spite
      of your hypocrisies and insults, I have begged you to safely get out of my way. You have exhausted
      my patience, but I do hope you'll understand that even now, what's about to happen... This is me
      being reasonable.|Wanda to Strange before launching her attack on Kamar-Taj}} {{Quote|The Scarlet
      Witch is a being of unfathomable magic. She can rewrite reality as she chooses, and is prophesized
      to either rule or annihilate the cosmos.|Wong about the Scarlet Witch}} }} ==Summary== Wanda Maximoff
      emerged from the turmoil of Sokovia with her twin Pietro, both volunteering for HYDRA's experiments
      with the Scepter that awakened her telekinetic and telepathic abilities. Initially opposing the
      Avengers alongside Ultron, the siblings switched sides upon discovering his true agenda. Though
      Pietro fell in battle, Wanda found her calling as an Avenger. Her path led through the Avengers'
      Civil War to a period of hiding with Vision, until Thanos's quest for the Infinity Stones claimed
      both Vision's life and Wanda herself in the universal culling. Five years later, the Hulk's snap
      restored her to life, but the discovery of Vision's dismemberment by SWORD pushed her to her breaking
      point. Overwhelmed by grief, Wanda transformed Westview into a sitcom reality where she lived her
      perfect life with Vision and their twin sons. This incident attracted Agatha Harkness, who revealed
      Wanda's true identity as the Scarlet Witch - a being of mythical power. Though she ultimately freed
      Westview, the loss drove her to isolation and deeper study of her abilities. Corrupted by the Darkhold
      and discovering alternate universes where her children exist, Wanda pursued America Chavez's multiverse-traveling
      powers. Her desperate quest to reunite with her family put her in direct conflict with Doctor Strange
      and the Masters of the Mystic Arts, threatening the stability of the Multiverse itself. ==Powers
      and Stats
