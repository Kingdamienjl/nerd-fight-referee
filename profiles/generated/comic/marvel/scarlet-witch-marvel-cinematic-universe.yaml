- id: claim-weaknesses-395f6334
  section: weaknesses
  axis: weakness
  text: "Until Multiverse of Madness, despite being one of the most powerful Avengers offensively, Wanda's\
    \ defense was the weakest (excluding her shields) and had standard human weaknesses. From Age of Ultron\
    \ to Civil War, she was both the youngest and least experienced Avenger and is still in training and\
    \ hadn't even come close to discovering her true potential. She cannot defend herself against threats\
    \ she is not aware of. Destroying the Darkhold prevents Wanda from Dreamwalking, as the book is required\
    \ to do so. In Multiverse of Madness, she is mentally unstable. Note: ==Notable Matchups== Victories:\
    \ *Thor (Marvel Cinematic Universe) Thor's Profile (\"WandaVision\" Scarlet Witch and \"Post-Awakening\"\
    \ Thor was used.) *Thanos (Marvel Cinematic Universe) Thanos' Profile (Thanos had the Infinity Gauntlet\
    \ and was in his Endgame mindset, WandaVision Scarlet Witch was used; Speed was equalized) *Kai (Ninjago)\
    \ Kai's Profile (Post Releasement Kai and Multiverse of Madness Wanda were used. The Darkhold was\
    \ restricted. Speed was equalized. Fight took place in Kamar-Taj. Starting Distance: 10m) Losses:\
    \ *Cat Noir (Miraculous: Tales of Ladybug & Cat Noir) Cat Noir's Profile (WandaVision Scarlet Witch\
    \ and Cat Blanc were used; Speed was equalized) *Son Goku (Dragon Ball) Goku's Profile (Battle of\
    \ Gods Saga Goku and WandaVision Scarlet Witch were used, both were bloodlusted; Speed was equalized)\
    \ *Doctor Strange Supreme (Marvel Cinematic Universe) Strange Supreme's Profile (WandaVision Scarlet\
    \ Witch and Pre-Fusion Strange Supreme were used; Speed was equalized) *Sasuke Uchiha (Naruto) Sasuke's\
    \ Profile (Eternal Mangeky\u014D Sharingan Sasuke and Multiverse of Madness Scarlet Witch were used,\
    \ Sasuke was at 6-C; Speed was equalized) *Vegeta (DBS Manga) Vegeta's Profile (Granolah the Survivor\
    \ Saga Vegeta and Multiverse of Madness Scarlet Witch were used. Wanda was bloodlusted and had prior\
    \ knowledge of Vegeta's AP; Speed was equalized) *Jean Grey (FOX's X-Men) Jean's Profile (Both were\
    \ in-character and 6-A. Multiverse of Madness Scarlet Witch and Host of the Phoenix Force Jean Grey\
    \ were used; Speed was equalized) *The Sentry (Marvel Cinematic Universe) The Sentry's Profile (Speed\
    \ was equalized, both were bloodlusted and had preparation time. WandaVision Scarlet Witch and The\
