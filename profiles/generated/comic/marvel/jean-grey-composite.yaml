      \ self overpowered Post-Awakening Thor, Mark 85 Iron Man and Captain America\
      \ with Mj\xF6lnir. Should be far stronger than his subordinates, like Ebony\
      \ Maw and Cull Obsidian646.57085 Petatons), higher with the Double-Bladed Sword\
      \ (Broke Captain America's vibranium shield), Star level with the Reality Stone\
      \ (The Aether can consume the Nine Worlds,Thor: The Dark World including Nidavellir\
      \ and Muspelheim, which is a Dyson sphere around a starWhat we learned on the\
      \ set of Thor: Ragnarok: From Jack Kirby to Planet Hulk), Varies (Stated to\
      \ have variable power output depending on the size of the target) up to Universe\
      \ level with the Power Stone (Stated to be a power source capable of destroying\
      \ the universeGuardians of the Galaxy: The Junior Novel), at least Universe\
      \ level with the complete Infinity Gauntlet (Threatened to shred the universe\
      \ down to its last atom and then create a new one. The combined power of the\
