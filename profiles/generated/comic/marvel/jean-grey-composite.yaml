  range:
    text: 'Extended Melee Range, higher with the Double-Bladed Sword, Kilometers with
      the Mind Stone (Its energy beams reached the borders of the Westview townWandaVision:
      Season 1 Episode 9 - The Series Finale), Planetary with Telekinesis (Able to
      pull Titan''s moon fragments while still on the planet), Stellar with with the
      Reality Stone (The Aether can consume the Nine Worlds, including Muspelheim,
      which is a Dyson sphere around a star), Varies up to Universal with the Power
      Stone (Stated to be a power source capable of destroying the universe), Universal
      with the complete Infinity Gauntlet (Turned half of all life in the universe
      into dust. His past self threatened to shred the universe down to its last atom
      and then create a new one. The combined power of the Infinity Stones can give
      one the ability to decimate the universe), Interdimensional with Portal Creation
      (Can create wormholes that facilitate interdimensional and space-time travel,
      credited to be a key that unlocks the door to myriads worlds across multiple
      dimensionsThe Art of Marvel''s The Avengers), Low Multiversal with the Time
      Stone (While time was being stopped on Earth, Doctor Strange used the Time Stone
      to also bring time to the Dark Dimension, which is another universe and an amalgamation
      of countless dimensions, trapping Dormammu in an inescapable time loop even
      though he has absolute control over the Dark Dimension and its reality.Marvel
      Website: Dormammu Reckless manipulation of the Time Stone can break the space-time
      continuum, causing irreparable harm)'
    source_ids:
    - vsbattles-jean-grey-composite-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Extraordinary Genius (Thanos is a cunning and ruthless individual with\
      \ an intellect sharpened by centuries of experience. A brilliant strategist,\
      \ commanding vast armies that have devastated countless worlds and destroyed\
      \ empires across the galaxy, which earned him renown as one of the most fearsome\
      \ warlords in the universe. A master tactician who manipulated events, such\
      \ as Loki's attack on New York and Ronan's retrieval of the Orb to set the stage\
      \ for his pursuit of all six Infinity Stones.Marvel Website: Thanos An incredibly\
      \ skilled combatant, who easily outmaneuvered heroes such as Thor, Hulk, Iron\
      \ Man, Doctor Strange and Captain America during their confrontations. Quickly\
      \ and intuitively learned and mastered how to wield the Infinity Stones, being\
      \ the real master of them, understanding their true power and capable of harnessing\
      \ the Stones' powers on a completely different level, unlike their previous\
      \ owners.The Art of Avengers: Infinity War He found a way to time travel from\
      \ 2014 to 2023 after obtaining Pym Particles, and reverse-engineered and mass-produced\
      \ them alongside Ebony Maw.\u2018Avengers: Endgame\u2019 directors just explained\
      \ some of the movie\u2019s biggest mysteries He is also an incredibly charismatic\
      \ master manipulator who can bend even the most powerful beings to his will)\
      \ Standard Tactics: Thanos' fighting style greatly varies based on the version\
      \ used and how many Infinity Stones he has. The two main versions that this\
      \ profile covers are the one from Infinity War and the one from Endgame. *The\
      \ first one is a honorable warrior, who prefers not to kill his opponents if\
      \ not needed and will first try to incapacitate them, unless he sees them as\
      \ a serious threat to his plans, in which case he won't have problems killing\
      \ the opponent if he has a chance to. It is unknown how he fight with his Double-Bladed\
      \ Sword, but with the Stones he will try to quickly defeat the opponent with\
      \ powerful attacks from his Power Stone or by incapacitating them with the Reality\
      \ Stone and the Space Stone, but if that doesn't work then he will go for more\
      \ lethal attacks. When equipped with the Complete Gauntlet, his first move will\
      \ be to snap his finger in order to destroy his opponent, deconstructing them\
      \ and turning them into ashes. *The second one, instead, is much less honorable,\
      \ being far more ruthless and sadistic with little regards towards anyone. He\
      \ won't have any problems with trying to kill his opponent even if they aren't\
      \ an immediate threat to him. This is reflected into his fighting style with\
      \ the Double-Bladed Sword, since with it he will try to continuously attack\
      \ the opponent, without giving them the time to counter-attack. He was never\
      \ seen using the Stones singularly, except for the Power Stone which he used\
      \ briefly against Captain Marvel. His first move when equipped with the Complete\
      \ Gauntlet, instead, is to use it to destroy the whole Universe with a snap\
      \ of his fingers."
    source_ids:
    - vsbattles-jean-grey-composite-marvel-comics
    confidence: 0.6
    notes: auto_repair source extraction
