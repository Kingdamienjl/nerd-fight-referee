      \ he himself said, was shred the universe down to its last atom, and for this\
      \ reason he scales to this feat.), Universe level+ Environmental Destruction\
      \ with the Time Stone (Reckless manipulation of the Time Stone can break the\
      \ space-time continuum,Doctor Strange (2016) causing irreparable harmGuidebook\
      \ to the Marvel Cinematic Universe - Doctor Strange). Can ignore durability\
