      is one of the most formidable fighters on the planet. Hence, she was able to
      overpower thugs, Yakuza members, and highly skilled Hand ninjas, and gained
      the upper hand against her former mentor in a duel. Elektra was even able to
      help Daredevil fight Nobu Yoshioka, though she was defeated by the Hand leader
      relatively quickly. After her resurrection, Elektra's powers as the Black Sky
      further enhanced her already astounding skills. She was able to defeat dozens
