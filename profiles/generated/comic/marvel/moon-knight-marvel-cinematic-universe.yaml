      Marc took them on singlehandedly, killing them easily. Shown to be an effective
      wielder of firearms, spears, axes, as well as knives, both for close-quarters
      encounters and for ranged attacks. Outside of combat, Marc is capable of speaking
      Arabic quite well) |-|Jake Lockley= Gifted (Possesses Marc's lethal fighting
