      an extremely skilled mercenary, proving time and time again why Khonshu viewed
      him as a worthy candidate. Spector has commonly operated as an assassin and
      spy, taking on the missions expected of this role with relative ease. He earned
      training in the Marine Corp and displays elements of Boxing, Krav-Maga, Jiu-jitsu,
