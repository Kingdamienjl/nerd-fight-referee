  attack_potency:
    text: 'Large Country level when holding back (Consistently holds back his true
      power tremendously so he doesn''t accidentally kill his mortal allies, thus
      making him on par with them. See notes below), Hyperverse level normally (It
      is hinted that he shook the universe as a side effect of the launch of Mjolnir.
      Created a storm so powerful that its winds reached the Earth from Asgard, causing
      great destruction. Far superior to Thunderstrike and Dargo Ktor, who''s clash
      shook the cosmos, affecting all planes of reality. A singular universe in Marvel
      contains a multi-layered cosmology, comprised of a seemingly endless number
      of dimensions, each of which have shown to contain many higher-dimensional spaces
      themselves. Consistently shown as comparable to the Hulk), higher with the Thermo-Blast
      (More powerful than his base statistics, having bested Ego with it), High Hyperverse
      level at peak (Shattered the root of YggdrasilThor: Man of War Vol 1 #1. Shook
      Yggdrasil and all of the realms in its branches as a baby, of which there are
      infinite, as well as being infinitely larger than universal space-time continuums.The
      New Avengers 1,000,000 B.C. Vol 1 #1 Slightly dented Silver Surfer''s forehead
      with a headbuttMighty Thor Vol 2 #2, and Loki even commented that Thor had greater
      strength than Silver Surfer while fighting a serious Norrin. Shook countless
      worlds in his battle with Gorr. Comparable to other Herald level characters
      such as The Sentry) and Warrior''s Madness (The Warrior''s Madness amplifies
      Thor''s power ten-fold), up to Outerverse level with the God Blast (Defeated
      Zelia, who had twice the strength of Odin) | Outerverse level (With only an
      incomplete version of the Odin-Force, he fought against Knull, being his only
      rival at that timeKing in Black Vol 1 #3. Uses The Destroyer for physical training
      and was considered by the Super Celestial computer to be capable of killing
      the Phoenix ForceAvengers Vol 8 #51) | Outerverse level (Had the Power Cosmic
      in addition to the OdinforceThor Vol 6 #1). Up to High Outerverse level via
      Absorption and the God Blast (Completely drained an amplifiedThor Vol 6 #6 Galactus
      who stated that he was stronger than ever beforeThor Vol 6 #6, which should
      include Lifebringer Galactus. Made the Black Winter, who destroyed the Sixth
      MultiverseImmortal She-Hulk Vol 1 #, bleed with the God BlastThor Vol 6 #5,
      and later one-shot it after absorbing Galactus'' power, sacrificing it in the
      processThor Vol 6 #6) | High Outerverse level (Equal or superior to Those Who
      Sit Above In Shadow, as they directly referenced his strength when bargaining
      with him, acknowledged his power to the point of offering him to join them,
      and were unable to stop him when he declinedThor Vol 2 85)'
