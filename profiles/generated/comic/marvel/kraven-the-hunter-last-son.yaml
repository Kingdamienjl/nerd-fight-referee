  section: weaknesses
  axis: weakness
  text: 'Just like it was for his father, Kraven requires regular intake of the jungle serum in order
    to preserve his superhuman capabilities. His arrogance occasionally leads him to underestimate his
    opponents. Note: Before making any changes to this page, please read and follow the Power-scaling
    Rules for Marvel and DC Comics.'
