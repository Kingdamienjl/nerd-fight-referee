  stamina:
    text: Superhuman (Comparable to the original Kraven and likely superior due to his younger body. Even
      after having been brutally mauled by the Lizard, Kraven still had enough energy left in him to confront
      and murder his father, whom he thought being Spider-Man.Amazing Spider-Man Vol 5 22 Was stabbed
      over a dozen times in his battle against Deadpool and still kept fighting with absolute nonchalance;
      right at the end of said duel, Kraven was hit by an arrow and swallowed by a murderous Kraken, then
      he survived inside its belly and freed himself after undergoing a trip from Staten Island to Antarctica.
      Was knocked out by Elektra and came back to his senses in mere moments. Has undergone over two weeks
      of hunting in the harshness of the North Pole, outliving his dogs, feeding off of lichens alone
      and sleeping just a fitful of hours, until he finally slew an oversized polar bear with but his
      hands and a knife. Survived three hefty slashes from Wolverine and being subsequently chomped by
      the maw of a giant tyrannousaur; after that, he somehow made it back to the Arctic in spite of injuries
      and broken bones. Butchered a group of vampires and could still stand despite the severe wounds
      suffered)
    source_ids: *id002
    confidence: 0.95
