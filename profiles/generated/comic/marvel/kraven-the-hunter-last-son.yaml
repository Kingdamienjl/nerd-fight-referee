  name: 'Resistance to Diseases (The serum the Kraveninoff consume grants such boons) **Enhanced Senses
    (Should possess the same '
  description: 'Resistance to Diseases (The serum the Kraveninoff consume grants such boons) **Enhanced
    Senses (Should possess the same senses as his father as a result of the consumption of the same serum.
    Kraven has also employed his sense of smellAmazing Spider-Man Vol 5 20 to analyze his father''s emotions
    and his sense of taste to track down Beast) *Weapon Mastery and Martial Arts (Has been trained in
    combat by his father and managed to best all of his siblings.Amazing Spider-Man Vol 5 16 Has slain
    an abnormally smart ice bear with but his hands and a knife, all the while having undergone long journey
    which had granted him barely any food and sleep. Has pushed Deadpool to the edge in a duel, even managing
    to steal his sword and have him resort to receive aid from his Honor Guard. In another instance, Kraven
    has swiftly subdued an unarmed Deadpool. Has fought Elektra on equal terms and could even gain the
    upper hand, then losing only when the battle moved to a location more suited for Elektra''s superior
    stealth abilities. Matched Wolverine in combat, but was rapidly overwhelmed soon after. Could predict
    Lockjaw''s moves and capture him with ease. Briefly held his own against a swarm of feral Vermins,
    although he was eventually overwhelmed.Amazing Spider-Man Vol 6 33 Killed a whole group of some of
    the deadliest vampires in the world) **Superhuman Precision (Could strike the tire of a speeding car
    with a dart shot from a blowgun.Daredevil: Woman Without Fear Vol 1 1 Has impaled Beast''s tight with
    a javelin during a dinosaur stampede. Able to shoot multiple darts from his blowgun with precision
    while being hurled through the air) *Stealth Mastery (Has received complete training from his father
    and could hunt down the rest of his brothers. Lurked the streets of Monster Island for a week, murdering
    a dozen citizens without being found out until he willingly revealed himself. Has repeteadly bombarded
    Deadpool and his Honor Guard with multiple projectiles from a hidden spot, forcing the former to confront
    him alone.Deadpool Vol 8 3 Has taken incidental advantage of the war between Mutants and Eternals
    to creep around Krakoa and commit a carnage of mutants, take Beast hostage and seize control of the
    Shadow Room. Infiltrated into Oscorp, incapacitating its security personnel, causing a power outage
    and shutting down all its systems despite the multiple fail-safes installed to prevent such an occurrenceAmazing
    Spider-Man Vol 6 32) *Acrobatics (Should have inherited some of his father''s acrobatic skills as
    a result of the training received from him. Can perform powerful leaps with which he can soar through
    the air at breakneck speed, leap up buildings and deliver flying attacks.Mighty Valkyries Vol 1 2Mighty
    Valkyries Vol 1 3 Could break a fall by doing a handstand. Could evade Lockjaw''s charges and shoot
    his darts even in mid-air. Ran across the treetops of a jungle to chase the White TigerMarvel''s Voices
    Infinity Comic Vol 1 79) *Preparation (Should have been instructed in the art of trapping by his father
    and has made frequent use of hidden traps. Uses to scatter and hide weapons around locations in which
    he plans to confront his opponents. Before every hunt, Kraven performs accurate research on his targets''
    features and habits, as well as the characteristics of their habitat. Additionally, Kraven states
    to always perform mental training that prepares him for any kind of adverse situation. Has pursued
    the HulkCrypt of Shadows Vol 4 1 for months and learned his weaknesses) *Vehicular Mastery (Has competed
    in the Hell''s Backbone Rally, an extremely dangerous motorbike race for metahumans.Ghost Rider Vol
    10 5 Has rode a hard-light construct of a giant raptor of the Savage Land) *Magic and Limited Conceptual
    Manipulation (Has performed a ritual to transfer Norman Osborn''s sins from the Queen Goblin to a
    special spear crafted for the occasion. The sins represented the metaphysical manifestation of the
    Green Goblin''s persona, extracted from Norman Osborn by the revenant Sin-Eater''s demonic powers,Amazing
    Spider-Man Vol 5 50 and later inserted into Ashley Kafka''s body by the Beyond Corporation, turning
    her into the Queen Goblin.Amazing Spider-Man Vol 5 87 and 88 It is strongly suggested that Kraven
    possesses knowledge of his father''s rituals) *Social Influencing (Deception: Can imitate the calls
    of a thousand animals and has lured Spider-Man intro a trap by replicating the moans of a dying man.Amazing
    Spider-Man Vol 5 79 Played dead against the White Tiger, pretending to have been knocked out in order
    to eavesdrop a conversation between her and a group of Dark Elves, and then let her resume her quest
    without suspecting to still be in Kraven''s sight. Cohercion: Has taken hostagesDaredevil: Woman Without
    Fear'
