- id: claim-standard-equipment-0dee849f
  section: equipment
  axis: equipment
  text: "At least two knives and one spear. *Melee Weapons and Firearms: Sword, Blowgun, Assorted Blades,\
    \ Crossbow, Bolas, Sniper Rifle, Pistol, Grenades, Rocket Launcher. **Electric Fork: A melee weapon\
    \ shaped like a tuning fork whose sharp edges release electricity on contact. **Asgardian Bullets:\
    \ Ammunitions of dwarven-made steel. Kraven received them from Hela when she hired him to hunt down\
    \ the World-Eater Wolf. Even when fired by an Earthen rifle, such bullets could still knock down an\
    \ Asgardian such as Valkyrie and leave a superficial scar. **Jormungand Spear: A weapon of divine\
    \ nature produced by mounting one of the Midgard Serpent's teeth on a shaft created with Asgardian\
    \ magic. Hela provided it to Kraven so that he could ultimately hunt down the World-Eater Wolf M\xE1\
    nagarmr. The blades still brims with Jormungand's venom and is able to incapacitate even an immortal\
    \ being. *Empyrion Blade: A magical knife capable of capturing human souls once its blade is bathed\
    \ in monster blood. *Belt Tusks: Kraven has occasionally sported his father's characteristic belt,\
    \ which features a collection of tusks laced with toxins and antidotes. *Electrified Net: A traditional\
    \ trapping net hurled by hand which also electrocutes its victims. *Smoke Bombs: Palm-sized explosives\
    \ meant to disorient the target with smoke and light. *Darts: Small projectiles which inject powerful\
    \ tranquilizers. Kraven can launch dozens of them in a single volley on his own or through traps set\
    \ up beforehand. Some of them are potent enough to kill humans and knock out even twenty elephants\
    \ with even a single projectile. About fifteen darts imbued with a tranquilizer derived from cone\
    \ snail venom could take down a pod of humpback whales and slow down even the Hulk. *Poison Gas and\
    \ Mask: A harmful gas released by an unknown device. It spreads like fog and temporarily disrupts\
    \ those who breath it in. Kraven carries a protective mask that lets him unleash the gas even when\
    \ surrounded by enemies. *Arctic Gear: A set of equipment meant for traversing polar regions. It includes\
    \ heavy clothing that shield the body from the cold and ice axes to climb vertical surfaces. One of\
    \ Kraven's signature traits are the several traps he sets up in preparation for a hunt and during\
    \ his career he has displayed knowledge on a great number of them. *Nets: Classic tools used to capture\
    \ unaware preys and hold them suspended in the air. They trigger upon stepping on them or via commands\
    \ sent from a remote. *Darts: The aforementioned kind of poisoned projectile. Their launch can be\
    \ triggered in conjunction with the activation of other traps or as a result of a target passing across\
    \ a certain spot. *Explosives: Hidden bombs triggered remotely. Kraven has used them to surprise Spider-Man\
    \ and to perform a comfortable escape. *Chains: A tangle of colossal chains hidden on an elevated\
    \ spot and whose fall can be triggered by pulling a nearby rope. Kraven employed them to crush the\
    \ Moon Wolf and keep them downed enough long enough to execute them with his Asgardian rifle. Kraven\
    \ has also employed a set of smaller chains, two of which connected to bear traps, in order to immobilize\
    \ a sedated Hulk."
  source_ids: *id003
