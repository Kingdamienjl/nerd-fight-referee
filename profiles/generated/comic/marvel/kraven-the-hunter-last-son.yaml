    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Gifted (Kraven and his brothers have been personally trained and raised by the original Kraven
      with the purpose of becoming his perfect successors. When the time came for each of the clones to
      pursue their final quest, the one who will become known as "The Last Son of Kraven" accomplished
      the additional feat of single-handedly hunt down and kill all his other 86 siblings, thus proving
      himself the best among them. Kraven has then walked the same path of his father, journeying the
      world to seek the thrill of new challenges; he has slayed dinosaurs in the Savage Land,Giant-Size
      Amazing Spider-Man: Chameleon Conspiracy Vol 1 1 pushed his body''s limits hunting an abnormal polar
      bear in the North Pole,X-Force Vol 6 30 faced whale-like creatures underwater and claimed numerous
      other beasts as his prizes.X-Force Vol 6 31 Yearning to prove himself worthy of the life he was
      artificially given, Kraven also set off to hunt down out every last shadow of his predecessor and
      claim his right to exist.X-Force Vol 6 32 True to his moniker, Kraven possesses numerous skills
      and great knowledge related to hunting. He was able to not only accomplish great feats, but also
      preserve the reputation passed onto him by his late father. Aside from resuming his feud with Spider-Man,
      Kraven has challenged some of the greatest metahumans the world has to offer, including foes stronger
      than him. More than one of his targets would not have made it out alive from their confrontation
      with Kraven, had it not been for external influences or help, thus confirming the danger he poses
      once he sets his sight on a prey)'
    source_ids: *id002
    confidence: 0.95
