      \ Avengers5-D), up to Outerverse level via Summoning (Defeated Quoggoth by attacking its eyes,Unbeatable\
      \ Squirrel Girl Vol. 2 #7, June 2016 with Quoggoth being able to fight Shuma-Gorath, who was unable\
      \ to destroy it.Wolverine: First Class #12, April 2009 Was capable of commanding a massive group\
      \ of ghost squirrels who defeated Dormammu, who was in his own realm and claimed to be stronger\
