- id: claim-powers-and-abilities-af4a2cfe
  section: abilities
  axis: hax
  text: "By Herself= * Superhuman Physical Characteristics (She is a human with the proportional strength\
    \ and speed of a squirrel.Unbeatable Squirrel Girl Vol. 1 #1, March 2015 At the age of five, she was\
    \ capable of jumping high into a tree.Unbeatable Squirrel Girl Vol. 2 #16, March 2017 Leapt from the\
    \ gate of Avengers Tower to the chimney) ** Acrobatics (Stated that she was extremely nimble and had\
    \ \u201Csquirrel-agility\u201D, which allowed her to dodge blasts from M.O.D.O.K.GLX-Mas Special,\
    \ February 2006 Jumped through a laser security field,Unbeatable Squirrel Girl Vol. 1 #2, April 2015\
    \ and jumped over repulsor blasts from two Iron Man armors, doing a mid-air split in the process.\
    \ Rotated herself in mid-airUnbeatable Squirrel Girl Vol. 2 #6, May 2016) * Enhanced Senses (Claimed\
    \ to have good night visionUnbeatable Squirrel Girl Vol. 2 #33, August 2018) * Bodily Weaponry (She\
    \ has a retractable spike in each knuckle, small claws on each finger and sharp teeth. Her knuckle\
    \ spikes can shatter crystal,New Avengers Vol. 4 #1, December 2015 her finger claws can carve into\
    \ brickUnbeatable Squirrel Girl Vol. 2 #2, January 2016 and cut into reinforced tempered glass, and\
    \ she can bite with 1,085,000 pounds of pressure, allowing her to chew through a solid steel floor)\
    \ ** Surface Scaling (Her finger claws give her the ability to climb, and she has used them to climb\
    \ up the side of a building) ** Underground Mobility (Dug a tunnel underground to Mole Man\u2019s\
    \ home with her finger clawsUnbeatable Squirrel Girl Vol. 2 #10, September 2016) * Skilled Hand-to-Hand\
    \ Combatant (Has easily defeated A.I.M. soldiers, and groups of criminals. Fought and overwhelmed\
    \ Wolverine in a sparring matchNew Avengers Vol. 2 #15, October 2011) * Weapon Mastery (Casually flicked\
    \ an acorn with enough precision to knock out a criminal. Allene, her clone and literal equal,The\
    \ Unbeatable Squirrel Girl Beats Up the Marvel Universe!, December 2016 figured out how to use the\
    \ equipment of various heroes and villains, including the likes of Black Cat, Mysterio, Captain America,\
    \ Iron Man, Spider-Man and more before using them to take down the entire Marvel Universe) * Stealth\
    \ Mastery (Snuck into the S.H.I.E.L.D. Helicarrier. Disappeared from Wolverine\u2019s sight to silently\
    \ steal a security card from a sleeping guard, with Wolverine complimenting her performance afterwardsAll-New\
    \ Wolverine #7, June 2016) * Animal Manipulation and Summoning (Can talk like a squirrel, communicate\
    \ with them, and summon them to her, and she can summon squirrels around herselfUnbeatable Squirrel\
    \ Girl Vol. 1 #3, May 2015 or othersUnbeatable Squirrel Girl Vol. 2 #49, December 2019 to act as armor.\
    \ Could communicate with ghost squirrelsUnbeatable Squirrel Girl Vol. 2 #28, March 2018) ** Sound\
    \ Manipulation (Her squirrels were able to produce a scream capable of removing the Venom symbiote\
    \ from NightmareUnbeatable Squirrel Girl Vol. 2 #11, October 2016) * Social Influencing (Her reputation\
    \ was enough to make A.I.M. agents flee in terror. Was able to enrage Ratatoskr by taunting her,Unbeatable\
    \ Squirrel Girl Vol. 1 #8, October 2015 despite Ratatoskr being \u201Cthe ultimate troll\u201D with\
    \ \u201Cgod-tier smack talking\u201D.Unbeatable Squirrel Girl Vol. 1 #7, September 2015 Gave a speech\
    \ that was inspiring enough to force Ratatoskr to reinforce her mind control. Has successfully rehabilitated,\
    \ pacified and even befriended the likes of Kraven the Hunter, Galactus,Unbeatable Squirrel Girl Vol.\
    \ 1 #4, June 2015 Nightmare, Drax the Destroyer and Ratatoskr.Unbeatable Squirrel Girl Vol. 2 #46,\
    \ September 2019 Perfectly resolved the conflicts of seventy different alien species in a way that\
    \ left everyone satisfied.Unbeatable Squirrel Girl Vol. 2 #30, May 2018 Convinced Tony Stark to admit\
    \ his mistakes, with him considering rhetoric to be one of her superpowers.Unbeatable Squirrel Girl\
    \ Vol. 2 #40, February 2019 Was able to calm down a rampaging mutant tree lobster.Unbeatable Squirrel\
    \ Girl Vol. 2 #8, July 2016 Convinced several enraged villains to stop fighting her and leave.Unbeatable\
    \ Squirrel Girl Vol. 2 #48, November 2019 Claimed to have \u201Csorted out\u201D The One Below All,\
    \ and is implied to have encountered him more than once, although her wording makes it unclear if\
    \ she defeated him, or if she resolved their conflict through diplomacySquirrel Girl Infinity Comic,\
    \ April 2022) * Breaking the Fourth Wall (Has directly addressed the audience and acknowledged she\
    \ was in a comic bookG.L.A. #1, June 2005G.L.A. #2, July 2005G.L.A. #3, August 2005G.L.A. #4, September\
    \ 2005 on several different occasions. Acknowledged a reference to Jack KirbyMarvel Comics #1001,\
    \ November 2019) * Preparation (Allene booby-trapped her base to take down the Avengers, which included\
    \ Thor and Quicksilver at the time. She also created a complex plan to defeat every hero and villain\
    \ in the Marvel Universe, arranged for her squirrels to cause a blackout that encompassed half the\
    \ planet and rendered the entire planet without power within a week.) * Resistance to Fear M"
