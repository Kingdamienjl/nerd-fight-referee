- id: claim-standard-equipment-bb2efb91
  section: equipment
  axis: equipment
  text: '*Staff of One A magical staff that was once a magical being called One, he was turned into a
    staff by an ancestor of the Minoru family after being defeated making him a slave of the Minoru bloodline,
    One managed to add certain rules to the contract, like: **There is always a price for the user to
    pay. The price used to be blood but Nico later altered the contract and now everytime she uses a spell
    one drop of the One gets into Nico. **The user can''t repeat the same spell with the same words, but
    the user is allowed to use synonyms, the same word in different languages and add details to form
    a new spell **Every time Mars aligns with the Earth and the Sun, One can came out of the staff and
    plead his case to be released from the staff, also allows for the contract to be changed *Witch Arm:
    After losing her arm in the events of avengers arena Nico''s arm was replaced with her "witch arm"
    capable of calling the staff of one to her and functions as the staff if the staff is not in her physical
    possession at the time (i.e. if she dropped it or otherwise, as shown in "Mystic Arcana" someone else
    taking the staff from her would result in the staff attacking them though this was not always the
    case). Both of these materialize when she loses blood.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
