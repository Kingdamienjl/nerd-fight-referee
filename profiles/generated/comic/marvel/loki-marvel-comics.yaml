- id: claim-powers-and-abilities-ec28e9de
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Longevity, God Physiology & Asgardian
    Physiology, Lower-Level Sorcerer, Clairvoyance (With the Vapor of Uro), Telepathy,
    Shapeshifting (Turns into a fly. Turns into Thor to fool Lady Sif), Matter Manipulation,
    Transmutation, Resurrection, & Healing (Mid-High, possibly Low-Godly. Brought
    back Bor Burison from the dead by using his spirit that was found in the snow,
    turning the snow into a body for Bor. Reanimated Toothgnasher from the dead),Telekinesis
    & Memory Manipulation (With the Cosmic Transmuter, Loki turned Thor into a frog
    and erased the short-term memory of a woman right next to him), Mind Manipulation,
    Illusion Creation (Creates multiple illusory images of Lorelei to distract Thor),
    Perception Manipulation, Enhanced Senses, Life Manipulation, Forcefield Creation
    (Shown here), Reality Warping, Statistics Amplification and Reduction, Magnetism
    Manipulation, Fusionism, Possession, Plant Manipulation, Weather Manipulation,
    Element Manipulation (Fire Manipulation (Hurt Iron Man with a fire attack), Ice
    Manipulation (Created a wall of ice to block attacks), Electricity Manipulation,
    Earth Manipulation), Radiation Manipulation, Status Effect Inducement, Spatial
    Manipulation (Portal Creation, BFR, Sealing, Summoning, Teleportation [Teleports
    to Asgard]), Biological Manipulation, Petrification, Invisibility, Intangibility
    (Elemental, Phasing and Spatial), Astral Projection, Size Manipulation, Energy
    Manipulation (Energy Projection and Absorption), Explosion Manipulation, Flight,
    Soul Manipulation, Duplication (Creates many duplicates of himself to confound
    Surtur), Power Nullification, Power Bestowal, Power Absorption, Attack Reflection,
    Age Manipulation, Regeneration (At least Low-Mid, can casually re-attach his head
    after being decapitated by Balder), Immortality (Type 3), Can exist as an incorporeal
    soul, Combat Expertise, Weapon Mastery, Vehicular Mastery (Competed in the Hell's
    Backbone Rally, an extremely dangerous motorbike race for metahumansGhost Rider
    Vol 10 5), Resistance (to outer space conditions, Sealing, Power Absorption, Mind
    Manipulation, Empathic Manipulation, diseases, poisons, fire and heat). Durability
    and Speed Reduction via Capsules. Intangibility (Immaterial), Levitation, Elemental
    Intangibility Nullification, Life Manipulation, Healing , and Statistics Amplification
    via Norn Stones. Soul Swap via Living Mask. Reality Warping via Crystal of Transference.
    Size and Statistics Amplification via Enchanted Amulet. Enhanced Energy Projection
    via Battle Armour, Battle Axe, and a Copy of Mjolnir. Fire Manipulation via battle
    whip and Fire Sword, Resistance to Telepathy (Doctor Strange couldn't telepathically
    enter his mind)
