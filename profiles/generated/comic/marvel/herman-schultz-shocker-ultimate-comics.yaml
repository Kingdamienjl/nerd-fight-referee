  intelligence:
    text: 'Genius (In spite of his insignificant presence in the criminal community,Ultimate Spider-Man
      (2000) Annual #2 being regarded as a joke even by the police, Herman is a gifted engineer with a
      natural aptitude for mechanics, having designed and developed his Vibra-Shock Gauntlets from scratch;
      in fact, he can reproduce and improve his Gauntlets using only the resources available in Ryker''s
      Island Maximum Security Prison, proving his capability. By his admission, he studied "until [his
      eyes bled" at Massachusetts Institute of Technology (MIT) and was previously employed as a weapons
      manufacturer at the world-renown Roxxon Industries for multiple years], having been recognized for
      his talents; under Roxxon, he invented "rotating gyro splints that could take out a tank" and "compound
      geno-cycles that could paralyze a man", likely by himself, and later created his Vibra-Shock Gauntlets
      and his Shocker costume from within prison. However, because of his own clouded anger hubris, feeling
      slighted by the world and driven mad by his numerous humiliating defeats at the hands of Spider-Man,
      he rarely displays his intelligence, typically fleeing in fear upon facing defeatUltimate Spider-Man
      (2000) #35Ultimate Spider-Man (2000) Annual #1)'
