- id: claim-weaknesses-eb746498
  section: weaknesses
  axis: weakness
  text: Thor's tendency to hold back against foes of Earthly roots, as he fears his
    full might may destroy them, sometimes results in Thor being caught by surprise.
    His statistics amplification methods have severe drawbacks (Using Megingjord will
    later leave Thor in such an exhausted state he can barely walk, while the Warrior's
    Madness robs Thor of his ability to differentiate between friends and foes). He
    has sometimes been portrayed as susceptible to the charms of extremely beautiful
    evil women, in particular Amora the Enchantress. | Like Odin, Thor will have to
    enter a slumber called the Odinsleep once a year to replenish the Odinforce, which
    leaves him vulnerable to attacks. | Thor's Fate Manipulation cannot rewrite the
    past and could only destroy the future Fate that bound the Nine Worlds to the
    cycle of Ragnarok.
  source_ids: *id003
  decisive: false
