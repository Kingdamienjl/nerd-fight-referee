- id: claim-weaknesses-1271e6b9
  section: weaknesses
  axis: weakness
  text: 'Angela has been frequently depicted as vulnerable toAsgardians of the Galaxy (Vol. 1) #1; 2018
    Electricity Manipulation, presumably due to time spent in Heven, as the angels there are vulnerable
    to lightning.Original Sin (Vol. 1) #5.5; 2014 Notes: *Though the Queen of Hel storyline saw Angela
    needing to acquire power specifically to defeat Hela, her newfound strength was not a temporary amplification.
    Passing the three trials of Hel was depicted as requiring Angela to conquer her mental blocks to allow
    her latent power to manifest. She did gain an amplification in that storyline by picking up Hela''s
    crown after beating her and becoming the Queen of Hel for very brief moments, but that''s different
    from the power she gained to beat Hela in the first place. *Refrain from scaling Angela directly to
    Thor Odinson and Mjolnir. In their first fight, Thor was weakened and bloody due to previous clashes
    with the angels.Original Sin (Vol. 1) #5.3; 2014 In their second fight, Thor began by confirming that
    he was exhausted and unmotivated the first time they fought, and he nearly made quick work of Angela
    and defeated her before Odin stopped their battle. Their third fight saw Angela engage in a very brief
    clash with Unworthy Thor which saw no clear advantages or scaling. *Angela has been called an angel
    of Heven multiple times, but those instances were figurative speech for her commitment to the angels''
    values and customs, since she''s not an angel and is biologically an Asgardian as the daughter of
    Odin and Freyja.Original Sin (Vol. 1) #5.1; 2014 *Before making any changes to this page, please read
    and follow the Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
