- id: claim-standard-equipment-707c7211
  section: equipment
  axis: equipment
  text: '*Gravity gauntlets: Designed by Wasp, these gloves have technologies from Shela''s heists integrated
    as a part of them, including Repulsors, Tractor Beams, Gravity Dice and Nano-Glitter (Commonly referred
    by Shela as Rainbow Dust) *Escapade suit: A yellow Jumbo Carnation teflon-weave jumpsuit worn by Shela.
    *Optional: Heist equipment, which includes a body temperature-masking bracelet, an advanced lockpick
    known as a variegator and a hologram projector.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
