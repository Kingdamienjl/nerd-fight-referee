- id: claim-weaknesses-b09a8089
  section: weaknesses
  axis: weakness
  text: 'Shela requires focus to swap places, and the more intensive a swap is, the harder it is to perform
    and sustain. Her powers can also rarely backfire, if she is stressed, although this occurred early
    in her superhero career. She is required to act accordingly to whatever role she imitates to maintain
    the illusion, and can only swap within a swap once, having to wait until the first swap to wear off
    to return back to her body. Swapping has made things harder to remember who she is, and can cause
    her nightmares,Avengers Academy: Marvel''s Voices Infinity Comic Vol 1 3 and copying exceptionally
    strong targets can cause their personality to overwrite hers temporarily.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-b99b2dfe
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Acrobatics, Afterimage Creation (shown hereNew Mutants Lethal
    Legion Vol 1 2), Stealth Mastery (Is a competent thief with experience in heisting banks, expos and
    labs) and Martial Arts (Has received combat training under the Avengers Academy initiative). Her mutation
    gives her Teleportation, Damage Transferal, limited Self-Healing (Can swap places with another person,
    allowing her to switch position and swapping their injuries for a few hours. After a few hours the
    injuries are re-inflicted upon ShelaMarvel''s Voices: Pride Vol 2 1), Illusion Creation (Her swaps
    also allow her to take the role of another person, giving her the same authority or reputation as
    the person she swaps withNew Mutants Vol 4 31), Power Absorption (Can borrow other people''s powers
    and skills, leaving them powerless while she has them. Can use this to mortally wound people with
    their own powersNew Mutants Lethal Legion Vol 1 4), Shapeshifting (Can appear as the person she has
    swapped with to onlookers, if said garb is a part of the person''s identityNew Mutants Vol 4 32),
    Empathic Manipulation (If she swaps her role with a person, they become extremely distraught, confused
    and unable to protest against their condition) and limited Telepathy (Swapping can occasionally cause
    her to read inner thoughts and feelings of the host, if they have an unusual mindAvengers Academy:
    Marvel''s Voices Infinity Comic Vol 1 25). Her equipment grants her Flight (Via Flight Repulsors),
    Gravity Field Generation (Via Gravity Dice), Blinding Flashes (Via Rainbow Dust, which could overload
    mechanical security systems and knock people out), Electricity Projection (As shown here), Energy
    Projection and Telekinesis (Via Repulsors and Tractor BeamsAvengers Academy: Marvel''s Voices Infinity
    Comic Vol 1 13). Optional equipment gives her minor Temperature Manipulation (Possesses a bracelet
    which can mask body heat)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
