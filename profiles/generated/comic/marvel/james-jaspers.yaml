- id: claim-powers-and-abilities-b3cc53cf
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Reality Warping *Accelerated Development
    (Passive; Abilities. His main power is to warp reality and "it gets stronger all
    the time"Marvel Super-Heroes (UK) Vol 1 #387) *Subjective Reality & Creation (Created
    the Crazy Gang, which are Alice''s Adventures in Wonderland''s characters themselves.Marvel
    Super-Heroes (UK) Vol 1 #377 Created a flying teapot. Created The Fury) *Spatial
    Manipulation (Captain Britain notices that the inside of his teapot is way bigger
    than outsideMarvel Super-Heroes (UK) Vol 1 #388) *Physics Manipulation (The release
    of the Jaspers Warp caused the world to distort itself beyond rationalityMarvel
    Super-Heroes (UK) Vol 1 #386) *Gravity Manipulation, Causality Manipulation, Probability
    Manipulation & Law Manipulation (The Jaspers Warp is a "reality storm" that makes
    "gravity, cause and effect, probability and logic" go "haywire"Daredevils Vol
    1 7). Same as before, but vastly enhanced, in addition to: *Matter Manipulation
    & Transmutation (Turned his wine from white wine to red wine. Transmuted his room,
    deformed Vixen''s men and turned Vixen into a foxThe Mighty World of Marvel vol
    2 #8) *Size Manipulation (Grew so big he dwarfed planetsThe Mighty World of Marvel
    vol 2 #9) *Resurrection, Energy Manipulation, Time Manipulation, Memory Manipulation
    & Enhanced Reality Warping (Was changing reality so that Captain Britain could
    experience past moments of his life again just like an illusionThe Mighty World
    of Marvel vol 2 # 10) *Immortality (Types 2, 3, 4 & 6; Stayed alive while his
    skull was crushedX-Men: Die by the Sword Vol 1 #3 and his body dissected in halfX-Men:
    Die by the Sword Vol 1 #4. As long as his weakness is not exploited, he can create
    a new body for himself out of nothing) *Regeneration (High-Mid; Regenerated after
    being turned to a vaporized skeletonThe Mighty World of Marvel vol 2 # 11 more
    than once) *Body Control (Transformed himself into a multitude of forms during
    his fight with The FuryThe Mighty World of Marvel vol 2 # 12) *Invulnerability
    (Can negate all physical damage against himX-Men: Die by the Sword Vol 1 #1) *Power
    Bestowal, Biological Manipulation & Technology Manipulation (Can turn others into
    The Fury, although they''re weaker comparable to the real one).'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
