  attack_potency:
    text: 'Small Town level (Held his own against Valkyrie, but was ultimately overpowered
      and knocked out. Can kill Einherjar and fight Berserkers. His variants can fight
      evenly with each otherLoki: S1E6: For All Time. Always.), up to Country level
      with weaponry (Held his own against Thor with Gungnir and the Chitauri Scepter,
      though Thor was severely weakenedGuidebook to the Marvel Cinematic Universe
      - Thor: The Dark World in their second fight and it was implied that he held
      back during both.Thor Screenplay His daggers could harm a weakened Thor)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Superhuman travel speed (Ran from the Frost Beast over cracking ice) with
      Subsonic combat and reaction speed (Kept up with a holding-back Thor. Kept up
      with Captain America, reacting to his shield throw)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'At least Class K (Far stronger than any human, which would include Spider-Man.
      Threw around Tony Stark with one hand, the latter weighing 185 pounds [84KG],
      and easily overpowered Captain America, who weighs 240 pounds [109KG].Captain
      America: The Winter Soldier (2014) Snapped the neck of a Dark Elf soldier. Briefly
      matched and restrained Valkyrie.)'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Small Town level, up to Country level with weaponry
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Small Town level (Withstood attacks from Mark 6 and 7 Iron Man. Unharmed
      after being near the epicenter of the Bifrost explosion. Completely unaffected
      by Captain America's attacks. Took several hits from Valkyrie before being knocked
      out. Is bulletproof)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Held out long enough after being impaled in order to fake his
      death in front of Thor)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range; Extended Melee Range with Daggers, Gungnir, and the
      Chitauri Scepter; Hundreds of Meters with Energy Projection (Shot an energy
      blast from the Chitauri Scepter high into the sky)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (A master of manipulation and deceit, Loki is highly intelligent
      with immense knowledge and skill in wielding mystical artifacts, arcane lore,
      and human as well as alien technology. A highly-tactical thinker, Loki is able
      to manipulate opportunities and events in his favor, with his charm and powers
      of manipulation serving him to ally with anyone who suits his purposes. His
      cunning mind far exceeds Thor and Odin’s. Has moved worlds out of conviction
      and made bargains with beings who snuff out planets as an afterthought. Manipulated
      the entire Avengers and Asgard, faking his own death and impersonating Odin
      to rule the realm. An expert combatant who can skillfully wield a variety of
      weaponry, being able to contend with the likes of Valkyrie, Captain America
      and a holding-back Thor. Knew of secret pathways between worlds that even Heimdall
      himself was unaware of)
    source_ids: *id002
    confidence: 0.95
