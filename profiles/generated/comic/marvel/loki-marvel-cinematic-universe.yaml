- id: claim-powers-and-abilities-17a19def
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics (Comparable to Asgardians, who possess super strength, stamina,
    speed, durability, and reflexes.Marvel Website: Valkyrie His Frost Giant heritage makes him far stronger
    than any humanMarvel Studios Visual Dictionary), Self-Sustenance (Type 1; Survived the vacuum of spaceThor:
    The Dark World Prelude), Enhanced Senses (Caught an arrow without looking while flyingThe Avengers
    (2012)), Social Influencing (Loki is a highly-tactical thinker and master of manipulation and deceit,
    being able to manipulate opportunities and events in his favor, with his charm and powers of manipulation
    serving him to ally with anyone who suits his purposes.Marvel Website: Loki Has moved worlds out of
    conviction and made bargains with beings who snuff out planets as an afterthought.Phase One: Marvel''s
    The Avengers Manipulated the entire Avengers and Asgard, faking his own deathThor: The Dark World
    and impersonating Odin to rule the realm), Magic (Learned how to wield magic while growing up in Asgard,
    thanks to Frigga,Marvel Studios: Character EncyclopediaThor: The Dark World (deleted scene)Thor: The
    Dark World (The Book of the Film)Loki: S1E3: Lamentis eventually becoming the most powerful sorcerer
    in all of Asgard), Illusion Creation (Can create illusions. Could alter his attire, voice, and physical
    aspects in order to resemble another person, imitating Captain America, Odin, and an anonymous Einherji.
    Altered the appearance of Thor, making him look like Sif or without a hand, and of his cell in the
    Asgardian Dungeons. Conjured up an illusion of him seemingly dying from a wound inflicted by Kurse),
    Longevity (Frost Giants are long-lived beings), Ice Manipulation, Mind Manipulation (Manipulated Erik
    Selvig into researching the Tesseract), Memory Manipulation and Power Nullification (Separated Odin
    from his powers and removed his memories, who took a while to shake off his enchantments.Marvel Website:
    Odin Made Valkyrie relive painful memories), Teleportation, Telekinesis (Blasted everything around
    the cell through the airThor: The Dark World), Invisibility and Perception Manipulation (Can make
    himself "invisible" by tricking others'' minds. Can conceal his presence and that of others from Heimdall.
    Can choose certain individuals in a group to sense him, such as when he appeared before Thor but not
    on S.H.I.E.L.D. security cameras, and let Selvig listen to his persuasion while blocking Fury''s ability
    to do so), Duplication (Can cast duplicates of himself around Thor), Shapeshifting (Transformed into
    a snake), Transmutation (Once turned Thor into a frog), Expert Combatant, Weapon Mastery (An expert
    combatant who can skillfully wield a variety of weaponry, being able to contend with the likes of
    Valkyrie, Captain America and a holding-back Thor), Cloth Manipulation (Can change his clothes into
    his regular outfit), Regeneration (Low-Mid; Has rapid regeneration. Eventually got back up after being
    smashed multiple times by Hulk. Survived being stabbed through the torso), Limited Matter Manipulation
    & Summoning (Summoned the Casket of Ancient Winters to attack Heimdall and made it disappear with
    a wave of his hand after using it. Made the Tesseract materialize in his handAvengers: Infinity War),
    Creation (Can conjure daggers), possibly Astral Projection, Energy Manipulation and Levitation (Possesses
    these powers according to WoG, though he never showed them on screen), Resistance to Extreme Cold
    and Ice Manipulation (Is a Frost Giant, being unaffected by their freezing touch. Endured the cold
    of Jotunheim, a frozen world and chilling wasteland home that persists in an endless winter night.
    The vacuum of space is freezing cold,Marvel Website: Ebony Maw being able to freeze within a few seconds,Guardians
    of the Galaxy Vol. 2Guardians of the Galaxy Vol. 3 even by just being high in the atmosphereIron Man
    (2008))'
