- id: claim-weaknesses-941461a2
  section: weaknesses
  axis: weakness
  text: 'If Cul is deprived of fear to feed upon he will revert to a withered state. The full details
    are unknown, but it appears that if Cul himself feels fear, if the person he is fighting is not afraid
    of him, or if the masses he is feeding upon cease to fear him, his powers weaken. He was also destined
    to be slain by his nephew Thor (Although this weakness disappears after his rebirth) Note: *Thor needed
    a specific weapon that Odin wielded in order to kill Cul. We consider this sword, and a specific prophecy,
    to be the reasons why Thor could defeat his much more powerful uncle. *Before making any changes to
    this page, please read and follow the Power-scaling Rules for Marvel and DC Comics'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
