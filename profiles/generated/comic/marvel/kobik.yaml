- id: claim-weaknesses-73ce94e6
  section: weaknesses
  axis: weakness
  text: 'Naive, vulnerable to being tricked and manipulated, loses control of her powers when under high
    emotional duress. Feats: *Her tantrum is powerful enough to destroy the universe *Captures 2 teams
    of Avengers in a snow globe, then adds them to the population of Pleasant Hill *Transports Bucky back
    through his timeline, giving him the chance to "start again" *Recreates the Thunderbolts'' base *Turns
    2 women into copies of Maria Hill *Splits into copies of herself *Rewrites Dr. Selvig''s history *Rewrites
    Captain America''s history *Turns the star on Captain America''s uniform into a real star *Brings
    a cartoon character to life *Brings a dead bird back to life *Rewrites Graviton''s history, this process
    was replicated many, many times *Brings the Avengers and the inmates of Pleasant Hill into a bowling
    match *Frees Fixer from a time paradox he caused by killing his younger self **Reads Deadpool''s mind
    **Travels back in time **Teleports the Thunderbolt''s base to the North Pole **Teleports an alien
    horde back to their home planet **Levitates and throws Bucky Note: Before making any changes to this
    page, please read and follow the Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
