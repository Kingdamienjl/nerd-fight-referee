- id: claim-powers-and-abilities-02625c7a
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Weapon Mastery (Skilled marksman; Was
    able to predict the trajectory of Captain America's shield while it was thrown
    and they were not facing it and intercept it with an arrow. They and Cap was able
    to defeat thousands of Roxxon mercenaries by themselves in head-on combatUltimates
    Vol 4 5) and Stealth Mastery (Infiltrated an Oscorp Defense warehouse by themselves
    and sabotaged the cargo inside.Ultimates Vol 4 7) Their equipment includes trick
    arrows, which grant them Technology Manipulation (Said to possess arrows able
    to fry every electronic device in a 200 yard distance), Homing Attack (As shown
    here), Explosion Manipulation (Many of their arrows can explode), Sound Manipulation
    (They have arrows able to emit debilitating sounds as well as noise-cancelling
    arrowsUltimates Vol 4 10), Status Effect Inducement, Ice Manipulation, Acid Manipulation
    (Via knockout-gas, freeze and acid arrows respectively), Inertia Manipulation
    (Via inertia-cancelling arrow), Electricity Manipulation (Via industrial-taser
    arrows) and likely Biological Manipulation (Via neural-disruptor arrows). Enhanced
    Senses and Information Analysis via their mask (Can zoom in their view, and have
    a HUD which gives out targetting information of their target)
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
