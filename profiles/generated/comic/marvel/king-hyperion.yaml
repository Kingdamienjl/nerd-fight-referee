- id: claim-weaknesses-e7b74899
  section: weaknesses
  axis: weakness
  text: 'Due to his overall high level of power, Hyperion is extremely overconfident and self-assured.
    This has lead him to dropping his guard or not finishing off his opponent when he has the chance.
    While Hyperion can resurrect, his body requires daylight/solar energy to do so and will not revive
    until his body has fully healed. This process also takes an unspecified period of time. Extremely
    vulnerable to Argonite radiation Feats: *Shown to have killed Thor of an alternate universe *His Atomic
    Vision is powerful enough to harm himself *Kicked out Juggernaut''s knee *Fought two alternate versions
    of himself at the same time *Claims to have defeated multiple alternate versions of Thor, Hulk, Sentry
    and Blue Marvel'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-dff35544
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Flight (As shown hereThunderbolts Vol 1 #152 and here)
    *Energy Absorption and Non-Physical Interaction (Absorbs Solar energy to fuel his powers and has absorbed
    Holocaust''s energy formExiles Vol 1 #62) *Atomic Vision (Shown hereExiles Vol 1 #63) *Enhanced Senses
    which include Super Hearing, X-Ray VisionExiles Vol 1 #38 and Biological Sense *Air Manipulation (Creates
    a sandstorm by spinningExiles Vol 1 #64) *Ice Breath (Froze a giant wave with super-breath) *Regeneration
    and Resurrection (At least Mid-Low. Can heal a snapped neck in a few moments. High-Mid over time.
    Resurrected and regenerated his body from being little more than a head, shoulders, and a bit of torso)
    *Self-Sustenance (Type 1) *Heat Manipulation (Destroyed Vision''s body. Destroyed SentinelsExiles
    Vol 1 #39) *Underwater Breathing (Can survive underwater and even speak there) *Vibration Manipulation
    (Vibrated in a way that Blink could not teleport him away) Resistance to: *Fire Manipulation (Unaffected
    by fireExiles Vol 1 #44)'
  source_ids: *id003
  decisive: true
  status: unverified
