  attack_potency:
    text: 'Planet level (Can trade blows with and overpower the likes of the Thing.
      Fought and matched Iron Man''s Model 29 Armor1.23626 Yottatons), up to Large
      Planet level with Magic (Comparable to a Doctor Strange whose power was more
      than ten times that of Doom''s own armor, and has fought alongside him using
      magic on multiple occasions.12.36268 Yottatons One-shot Blue Marvel.Doctor Doom
      (2019) #3 Casually blocked the combined attacks of nearly a dozen Doombots at
      once, and proceeded to one-shot all of them at the same time with a magic attack),
      up to Galaxy level (Managed to absorb the power of the Silver Surfer.Fantastic
      Four #57 Can cut through Hulk''s skull with an adamantium chainsaw to perform
      brain surgery, and recreate the Destroyer by draining the Odinforce from a bunch
      of Asgardians. Can artificially emulate the Power Cosmic) to Low Outerverse
      level (After centuries of training under the Marquis of Death, he killed a Watcher
      with an "off-the-scale power source", it being an alternative dimension version
      of Uatu. Can channel the mystic energy that exists in vibranium to connect himself
      to every piece of vibranium on the planet, gaining power greater than that which
      he had when he held a Cosmic Cube,Doomwar #1 when said cube was used by Reed
      to defeat Doom with Galactus'' power, at a point where Doom was so powerful
      that he said he could "end all time -- all existence -- with a simple thought".Fantastic
      Four World''s Greatest #10 & 11 Through Power Absorption, he stole Galactus''
      power in the scale said before, siphoned the cosmic powers of a WatcherFantastic
      Four #373 [who should be on the same level as fellow Watchers like Uatu], turning
      it into an armor, and attempted to claim Uatu''s power for his own too.Fantastic
      Four #374 On one occasion, he managed to absorb the power of the Beyonder using
      a device in his armor. Was capable of absorbing the power of Franklin Richards,
      stating that it''d be enough to let him "attend to" the Celestials.Heroes Reborn:
      The Return #4 With heavily implied preparation, staggered Uatu with an energy
      blastFantastic Four: World''s Greatest Comic Magazine #6 Absorbed the Life Force
      power of Scarlet WitchAvengers: Children''s Crusade #7 & 8) with Optional Equipment,
      Absorption, or Preparation. Can ignore conventional durability in several ways.
      | Outerverse level (After the Molecule Man absorbed the power of The Beyonders,
      Doom was allowed to channel a part of it from which he was able to utilize enough
      to fight and overpower a user of The Infinity Gauntlet and kill Phoenix Force
      Cyclops with ease. Recreated Galactus to be Franklin Richard''s servant) | Large
      Planet level (As he was given Doctor Strange''s Sorcerer Supreme power, and
      due to further fueling his magic with millions of Latverian souls, he should
      naturally be far above his own standard magic capabilities. Effortlessly one-shot
      an alternate universe version of Hulk-Form Amadeus ChoSuperior Avengers (2025)
      #1. Casually overpowered all of Mark 74 Iron Man''s charged up and infinitely-looped
      energy with a finger12.36268 Yottatons)'
