  durability:
    text: 'Planet level (Inside the armor, survives attacks on this level either relatively
      fine or harmed while running the risk of being killed, but the armor itself
      is more durable. He can take blows from the Thing), to Large Planet level with
      forcefield against physical attacks (His forcefield can deflect up to 99.7-99.9%
      of incoming kinetic energy400 Yottatons-1.2 Ronnatons), up to High Universe
      level with Magic Defenses (Easily blocked a slash from Wolverine''s Adamantium
      claws), up to Low Outerverse level with Optional Equipment, Absorption, or Preparation
      (With heavily implied preparation, Doom''s forcefields managed to endure blasts
      from 4 Mad Celestials for roughly 27 minutes, although his shields were eventually
      overwhelmed.FF Vol. 1 #14 Took a blast from Uatu with no damage, stating that
      he''d put a "nigh impenetrable cosmic alloy" in his armor to protect himselfFantastic
      Four: World''s Greatest Comic Magazine #6) | Outerverse level (Tanked blows
      from Black Panther while the latter was wielding The Infinity Gauntlet) | At
      least Planet level (Tanked a blow from the Thing who was using a Stormbreaker
      containing the combined energies of multiple heroes at once), higher with the
      Eye of Agamotto (Could create a field of light around himself powerful enough
      to no-sell a blast from Dormammu), up to Large Planet level with forcefield
      against physical attacks and up to High Universe level with Magic Defenses (Should
      be equal to, if not superior to his base)'
    source_ids:
    - vsbattles-doctor-doom-earth-616-marvel
    confidence: 0.6
  stamina:
    text: Superhuman. Doom's willpower is one of his greatest assets, along with his
      intellect, allowing him to fight off legions of demons in Hell after losing
      his demonic mystic powers. He has even managed to survive the Marquis of Death
      turning his heart to stone and his blood to acid while killing his atoms, right
      before being tossed millions of years into the past and being torn limb from
      limb by Megalodons. He and Doctor Voodoo managed to fight against the forces
      of Nightmare for days without tiring.
    source_ids:
    - vsbattles-doctor-doom-earth-616-marvel
    confidence: 0.6
  range:
    text: 'Sorcerer Supreme #34) *Narrative Manipulation, possibly Existence Erasure,
      and BFR (Doom’s control over himself across every plane of existence allowed
      him to enter and even leave Gutterspace, along with resisting said realm trying
      to erase him from existence (the process is also implied here to erase them
      from existence).The Unbelievable Gwenpool (2016) #22-#23 Gutterspace is a plane
      outside of the very panels continuity of the multiverse, even encompassing things
      like fan works. Gwenpool, Gutterspace’s user, can also retcon herself, despite
      the fact she can''t be controlled by the authors. When Satana Hellstrom banished
      his soul to Hell, he quickly managed to recall the way out of Hell and have
      his soul return to his bodyDark Avengers (2012) #177) *Perception Manipulation
      & Information Manipulation (Type 1. Was the only one unaffected by Rhapsody,
      Marvel Girl, and the Five in One mentally transmitting the experience and knowledge
