    and reassembled the Pacific Fleet on an atomic level), Memory Wiping, BFR (Capable of forcing opponents
    out of the battlefield via teleportation), Mind Manipulation (Controlled a person and shut down a
    person's mind. Overpowers Psi-Shields of multiple guards), Astral Projection (His consciousness left
    his body), Teleportation (Via bodysliding), Forcefield Creation (Big and skin tight), Size Manipulation
    (Grew to a giant size), Regeneration (Mid; Lit up with bullets and healed later. Was shot in the head
    and healed. Low-Mid for his techno-organic body; can reattach limbs and regenerate from damage almost
    instantly), Self-Resurrection (Came back to life after he died), Transmutation (Turned a man's epidermis
    into fungi luminescence), Energy Projection (His cybernetic arm can project energy. He can also project
    telekinetic blasts and regularly wields futuristic laser weaponry), Heat Manipulation (Using finger
    torches), Electricity Manipulation (As shown here), Adaptation and Resistance to Telepathy (His physiology
    automatically adapts to external conditions, stated by Moira to be hard to read by even the best mutant
    telepaths). Optional Equipment grants him Time Stop (With time freeze grenades), Animal Manipulation
    (As shown here) and Illusion Creation (By using holograms)
