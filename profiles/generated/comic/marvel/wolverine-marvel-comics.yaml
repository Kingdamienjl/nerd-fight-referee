- id: claim-powers-and-abilities-35e97223
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Content= *Superhuman Physical Characteristics **Regeneration
    (Mid; Can regenerate from a bullet being shot in his eye, damaging a large portion of his skull and
    brain. And has regenerated cell by cell after being reduced to a near skeleton by Nitro''s self-destruction)
    **Bodily Weaponry (Unconventional; Possesses Adamantium claws) **Enhanced Senses (Wolverine possesses
    animal-like senses such as night vision as well as hearing and a sense of smell comparable to an actual
    wolverine''s. His senses always work at peak capacity and compensate for each other if one is disabled,
    making it extremely hard to actually impair him.Wolverine: Deep Cut Vol 1 1 Alyosha Kravinoff deems
    Wolverine''s senses superior to his ownSpider-Man: Get Kraven Vol 1 1 and those of his father. His
    senses also make him a good lie detector.Avengers Vol 4 9 He can even track a person from the lack
    of their scent) *Longevity & Immortality (Type 3) *Master Hand-to-Hand Combatant (Stated by Captain
    America to be one of the most skilled opponents he ever fought. Can clear the danger room at its maximum
    settings alone) **Pressure Points (As shown here. Knocked out Captain America by giving him an aneurysm)
    *Stealth Mastery (Can disappear before his opponents eyes. Infiltrated a UN conference and the Avengers
    Tower) *Weapon Mastery (Bested Silver Samurai, can beat several swordsmen blindfolded, and possesses
    impeccable aim) *Vehicular Mastery (Competed in the Hell''s Backbone Rally, an extremely dangerous
    motorbike race for metahumansGhost Rider Vol 10 5) *Instinctive Reaction (Can move without thinking,
    thanks to his instincts, training, reflexes and experience, states he can move faster than he thinks)
    *Rage Power (As explained here) **Berserk Mode (Possesses a "Berserker Rage" that renders him feral,
    fighting purely on instinct and becoming difficult for even the most powerful telepaths to control)
    *Resurrection (Can duel Death for the right to return to his body when he is killed) *Limited Temperature
    Manipulation (He has gained the ability to superheat his clawsWolverine: Infinity Watch Vol 1 4Hulkverines
    Vol 1 3Return of Wolverine Vol 1 2Merry X-Men Holiday Special Vol 1 1) Resistance to: *Mind Manipulation
    (As explained here. His feral psyche actively attacks an invader. Resists Emma Frost) *Pressure Points
    (As shown here) *Poison Manipulation (As shown here) *Radiation Manipulation, Disease Manipulation
    and Corruption (Resists spore, a disease which infected the Eternals, resists Contagion virus and
    can resist lycanthropy. The enzyme which induces vampirization can''t affect Wolverine unless his
    healing factor is first hindered by other woundsBlood Hunt: Wolverine Vol 1 3) *Possession (The metal
    of Wolverine''s adamantium skeleton is stated to provide special shielding from demonic situations
    like possessionWolverine (Vol. 2) #179; 2002) }}'
