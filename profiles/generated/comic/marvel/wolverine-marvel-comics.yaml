  intelligence:
    text: 'At least Gifted. Vindicator claims that it''s not Wolverine''s powers or fighting skills that
      make him dangerous, but rather his mind.Alpha Flight Vol 2 8 Thanks to his superhuman senses, Wolverine
      is considered to be one of the world''s most skilled trackersWolverine: Weapon X Files Vol 1 1 and
