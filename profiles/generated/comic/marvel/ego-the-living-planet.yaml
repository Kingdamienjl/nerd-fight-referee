- id: claim-weaknesses-0fe6367e
  section: weaknesses
  axis: weakness
  text: 'Has an extreme superiority complex and can be emotional if thwarted. If he''s deprived of sunlight
    for too long he becomes unstable and starts to fall apart. Feats: Show/Hide *Thor states that Ego''s
    power surpasses his own. *Knocked out Thor using just the energy contained within his mass. *Ego just
    by entering the solar system caused worldwide natural disasters on Earth. *Ego casually blew up Krylor
    in a fit of rage along with several other planets. *Ego nearly destroyed Silver Surfer at one point
    and defeated him at another. *Was disrupting the solar system just by being near it. *Restrained and
    consumed Thanos and the Black Order, Thanos admitting defeat after this, Thanos only winning by using
    Ego''s Galactus Engine against him directly on his core and forcing Ego to launch him into space to
    survive. *Ego Prime, a being formed from a small rock sample that was cut off of Ego, is unaffected
    by Thor''s attacks to the point that Thor''s attacks do no damage to and only make Ego Prime stronger,
    he easily beat Thor and Balder and restrained Hogun, it was stated that Thor and the other Asgardians
    on Earth can in no way beat Ego Prime in a fight, and Ego Prime would have killed Thor and the Asgardians
    if his powers didn''t end up getting drained at the last second. Notes: *Do not insert statistics
    for the version of Ego Prime that appeared in an Ultimates storyline with The First Firmament. It
    is considered as an extreme Plot-Induced Stupidity Outlier that he was able to hold his own against
    multiversal conceptual entities. *Before making any changes to this page, please read and follow the
    Power-scaling Rules for Marvel and DC Comics.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-4a691185
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Regeneration (Mid-High; Regenerated from crumbling to dust),
    Flight and Spaceflight, Large Size (Type 5, Is 6664 km in diameter), Cosmic Awareness, Immortality
    (Types 1 and 3), Self-Sustenance (Types 1, 2, and 3), Enhanced Senses (Detected Galactus even after
    he rendered himself invisible), Body Control (Can freely control and manipulate every part of his
    body to create things such as tentacles, organic sensors, massive super-volcanoes, and plant-like
    growths, and can shape his surface into the appearance of a dead, inhospitable world, or a paradise
    to lure unwary space travelers to his surface), Energy Projection (Eye Beams, Energy Waves), Energy
    Manipulation (Can create tentacles of pure energy), Absorption (Passively absorbs the life force of
    everything around him, His hair absorbs cosmic rays and solar energy, and he can absorbing stars directly,
    absorb matter from outside sources, and even absorb energy directly from Thor), Life Manipulation
    (Created living horses from his matter, Creates Anti-Bodies using Thor as a molecular model and he
    can create countless more in a heartbeat, Turned part of Galactus' ship into living beings), Matter
    Manipulation (Can manipulate the matter of his own body on a molecular level), Biological Manipulation
    (A small sample of Ego's body is capable of hyperaccelerating evolution on a new planet it is brought
    to, Mutated a group of people into monsters), Reactive Evolution (Capable of rapidly evolving by absorbing
    the life force of nearby creatures), Weather Manipulation (Can manipulate the weather on his body),
    Magnetism Manipulation (Ego uses a blast of electromagnetic energy to attack Galactus' ship), Astral
    Projection (Created a projection of himself to more easily talk to Thor and Galan), Memory Manipulation
    (Can read memories), Hair Manipulation (Can use his hair to attack and restrains enemies), Ice Manipulation
    (Can coat himself in a shield of ice instantly), Telekinesis (Telekinetically pulled Silver Surfer
    off of his board), Spatial Manipulation (Sealed himself and the Black Galaxy off from all other universes),
    Power Bestowal (Made a bunch of ants strong enough to fight Asgardians), Earth Manipulation (Caused
    the ground to swallow Thor), Telepathy (Can read minds), Size Manipulation (Made a bunch of ants giant,
    can potentially grow to the size of the Milky Way if he absorbs enough matter and energy), Heat Manipulation
    (Ego's internal temperature is almost too much for the Thing to handle, and he can freely control
    his body temperature to such a degree that rock turns red hot instantly), Electricity Manipulation
    (His brain is capable of generating electricity as a defense mechanism), Resistance to Mind Manipulation
    (When enraged his mind is too great for Professor X to calm on his own, forcing him to absorb all
    the psychic strength from everything and everyone he can find coupled with Surfer using the Power
    Cosmic to distract Ego and make his mind more susceptible to manipulation) and Possession (Ego not
    only resisted, but completely reflected and return possessed the Worldmind, corrupting the Worldmind
    in the process)
  source_ids: *id003
  decisive: true
