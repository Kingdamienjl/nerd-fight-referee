  attack_potency:
    text: Varies. At least Large Building level (Should at the very lowest be comparable,
      if not superior to his physical capabilities, which let him fight evenly with
      Morbius without using magic. Held his own in a hand-to-hand fight against a
      demonically-possessed Wolverine, who is stated to have his power amplified by
      those demons. Can fight those who can harm him) to Outerverse level with magic
      (Fought evenly with Nightmare, and could break his attack spell even while only
      in his astral form. Nightmare also views him as an equal in power, with Strange
      stating himself to be Nightmare's equal. Held his own against Dormammu even
      before becoming Sorcerer Supreme, and forced Dormammu to exert a large deal
      of energy during their battle despite being inferior in power, and as Sorcerer
      Supreme his most powerful sorcery could dispel a whirlwind which significantly
      drained Dormammu's power through its use. While inferior, held his own against
      Zom, who is stronger than Umar at her peak, Dormammu at his peak, or Eternity.
      When enraged, easily overpowered the mystic warlord Tiboro (even stating that
      he could kill Tiboro whenever he wanted if he so wished) and was willing to
      take on Umar as well without issue, with Tiboro himself being portrayed as comparable
      to Umar and also being entirely unafraid of the Dweller in Darkness, who is
      comparable to Nightmare), higher with certain Artifacts and Spells (Capable
      of channeling the power of, and summoning Cosmic Entities such as Lord Chaos
      and Master Order, having done so in order to overwhelm and imprison The In-Betweener,
      and can unite with Eternity himself, causing him to become “one-with-all” and
      feel in many more dimensions than four. Could forcibly merge himself with the
      demon Arioch - who claimed to be "not even finite" and completely dwarfed Mephisto
      and Satannish in power and scope, rendering them akin to "mice in a great temple"
      - allowing him to fight evenly against Shuma-Gorath. Temporarily achieved a
      balance of power against The Infinity Gauntlet by using the combined power of
      every single magical artifact in his possession)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'At least Infinite (Comparable to the Ancient One, who reacted to Umar''s
      Bolt of Bewilderment in a microsecond, and Baron Mordo whose power was used
      to fuel an incantation which sent him hurling across countless dimensions, at
      a speed which "defies mortal calculation". With the Scroll of Watoomb, he could
      instantly return after Adam Warlock sent him to the edge of the universe through
      the Infinity Gauntlet. Has fought and reacted to Mephisto on multiple occasionsInfamous
      Iron Man #12Doctor St'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Multi-Stellar (Could telekinetically hold and manipulate the black
      hole resulting from Stygyro's star-form exploding into a supernova, hurling
      it at the Wheel of Change. Even after becoming exhausted due to fighting in
      Hell for over two days and being nearly driven insane, Doctor Strange still
      had enough magical power to make an entire moon rise and explode), possibly
      Immeasurable at peak (Using all of his strength, Strange's Astral Form resisted
      the pull of a weakened Dormammu and was even pulling him into the Earth Dimension)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Large Building level (Fought evenly with Morbius without using magic. Held
      his own in a hand-to-hand fight against a demonically-possessed Wolverine, who
      is stated to have his power amplified by those demons), far higher with magic
      (Was able to stagger two Mindless Ones in the Dark Dimension with a kick)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Large Building level physically (Took hits from Morbius and a demonically-amplified
      Wolverine. While heavily disoriented, survived two buildings falling on him.Dr.
      Strange (2020) #2 Tanked a kick from a demonically possessed Silk who was twice
      as strong as usualThe Amazing Spider-Man Vol. 5 #51. Was sent flying across
      the world by a blow from a Zarathos-possessed Ghost Rider with only some blood
      from the mouth to show from it, from Ghost Rider Vol 9 #6), At least Galaxy
      level with Forcefields (The Crimson Bands of Cyttorak defended his physical
      body from a supernova at point-blank range. Can hold back the power of Borgo,
      a perfect clone of the Silver Surfer created out of the latter''s own energy.
      His invisible, automatic shields can protect him from Voltorg''s atomic lightning,
      which was claimed by Yandroth to have the power to "hurl stars from their paths",
      only leaving him stunned due to the impact of the blast), Up to Outerverse level
      at peak (Survived a psychic blow from Umar when she caught him off-guard after
      he momentarily put his magic shield down. Withstood beatings from the Mindless
      Ones in the Dark Dimension and blocked their beams with the Cloak of Levitation,
      during a period in time when the Mindless Ones were portrayed as a threat to
      Dormammu himself, Took a blast without any shielding from a serious and Hell-amplified
      Mephisto who was also amplified above his normal Hell-amplified self "a thousand-fold")
      and with his strongest forcefields (Strange''s forcefields managed to shield
      him from the battle between Dormammu and Eternity, one which Strange said threatened
      to destroy both Dormammu and Eternity and was also stated to have caused a "transdimensional
      holocaust", with Dormammu confirming Strange''s shields saving him from the
      clash. He and Clea using magic forcefields managed to shield against Dormammu''s
      attack which was further amplified by him drawing on the Dark Dimension for
      power, and they would''ve overpowered Dormammu together with their forcefields
      had Baron Mordo not sneak-attacked them. Blocked multiple attacks from a serious
      and Hell-amplified Mephisto who was also amplified above his normal Hell-amplified
      self "a thousand-fold"), higher with certain Artifacts and Spells (Capable of
      uniting his being with Eternity through the Eye of Agamotto, and vastly increase
      his magical abilities by merging with, or drawing power from beings as powerful
      as Arioch and Shuma-Gorath. Capable of imbuing his magic with the power of Cosmic
      Entities such as Lord Chaos and Master Order, allowing him to stand up to, and
      even overwhelm the likes of The In-Betweener)'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (He once fought supernatural forces for days on end without sleep.
      He fought an army for Doombots for days alongside Clea and Isaac Newton)
    source_ids: *id002
