  intelligence:
    text: Gifted. Being a martial arts master, Rand is proficient in many of Earth's
      forms of combat, including Kunlunquan, Shaolinquan, Fujian White Crane, Judo,
      Aikido, Wing Chun, Ninjutsu, Muay Thai, Karate, Boxing, and even loose street
      fighting tactics. Recently, he gained access to the knowledge, experience, and
      skills of all the Iron Fists before him. He's skilled in unique chi-based techniques,
      such as the "Drunken style" that masks him from such things as Spider-Man's
      Spider-Sense and Mister X's telepathic reflexes. He possesses a massive number
      of ways to kill a man, such as the Black-Black Poison Touch, which uses his
      chi to kill anyone in the close vicinity. Rand has also been trained in the
      use of almost all martial arts weapons, and can speak fluent in K'un-Lun, English,
      Chinese, and has a limited vocabulary in Japanese.
    source_ids:
    - vsbattles-iron-fist-earth-616-marvel
