- id: claim-powers-and-abilities-5ace97b3
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Expert Brawler (Fisk, despite having
    no formal combat training, is a very formidable opponent due to his size and pure
    muscle) *Multi-Lingualism (Speaks fluent Mandarin and Japanese, also understands
    some American Sign Language) *Genius Intelligence and Social Influencing (Social
    Position, Reputation, Instigating Fear, Deception, Charisma & Coercion; Fisk is
    an excellent manipulator and a cunning strategist. He managed to cause a fair
    deal of the criminal activity of Hell''s Kitchen for years without revealing his
    identity to the public. Even when he revealed himself, he fooled the public into
    supporting him and viewing Daredevil as a terrorist.Daredevil, S1E8 Whilst in
    Ryker''s Island, Fisk was able to maneuver himself from being a first-time inmate
    to being almost in control of the whole prison within a mere matter of months
    by eliminating his competition. Hence, Fisk was even able to persuade Frank Castle
    to kill Dutton for him, despite the fact that the Punisher usually went out of
    his way to avoid making deals with criminals.Daredevil, S2E9 From behind bars,
    Fisk was able to manage a deeply convoluted and long-term conspiracy; he purchased
    the Presidential Hotel through Vancorp with the foreknowledge that he would be
    held there by the FBI once he orchestrated an attempt on his own life in prison.Daredevil,
    S3E2 He also staged the death of Tammy Hattley''s son to look like a hit-and-run
    accident with the implication that a similar fate could befall her surviving daughter
    if she did not begin working for him, he had purveyors stop delivering to Nelson''s
    Meats and then, through Red Lion National Bank, offered them a fraudulent loan
    to save the business, in the process involving them in a criminal enterprise.Daredevil,
    S3E11 Fisk even canceled the health insurance of Ray Nadeem''s sister-in-law,
    forcing him to go into debt to pay for her treatment and ensuring he would be
    desperate enough to earn a promotion, and a raise, that he would be willing to
    accept virtually anything Fisk told him, to reap the benefits of a cooperation
    that, on its face, was simply too good to be true.Daredevil, S3E9 Hence, Fisk
    acquired the service of many FBI agents to do his bidding, including Benjamin
    Poindexter; upon their first meeting, Fisk was able to sense that he was not entirely
    mentally fit, and began to slowly manipulate him into working for him as an assassin.Daredevil,
    S3E3 Years later, he was covertly running the Tracksuit Mafia after he manipulated
    Ronin into killing their commander, William Lopez. Clint Barton mentioned that
    Fisk was willing to do anything to expand his criminal enterprise''s operation,
    and wanted to avoid crossing paths with him. In order to appeal to Maya Lopez,
    Fisk called for a replacement suit to hide his bloody clothes as to not scare
    Lopez; however, she saw his suit and did not care, allowing Fisk to realize her
    potentialHawkeye, S1E5)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
