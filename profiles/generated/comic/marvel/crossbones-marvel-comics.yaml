- id: claim-powers-and-abilities-2e53a5d8
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts (Can easily dispatch groups of opponents rapidlyCaptain
    America Vol 1 363. Is capable of keeping up with Captain America, with the latter oftenCaptain America:
    The Legend Vol 1 1 remarking on his skillCaptain America Vol 1 364, as well as other master martial
    artists such as Bucky BarnesCaptain America Vol 5 36, Sam WilsonAll-New Captain America Vol 1 1, DaredevilCaptain
    America Vol 1 376 or BullseyeCaptain America Vol 1 377. Crossbones is the best operative to have ever
    worked under Red SkullCaptain America Vol 1 375 and is reputed to be an even better fighter than himCaptain
    America Vol 1 393. Was reputed by Taskmaster to be skilled enough to teach his street-fighting styleCaptain
    America Vol 1 403 in his school even beforeCaptain America and Crossbones Vol 1 1 training under Red
    Skull''s orderCaptain America Vol 1 383. Capable of fighting skillfully even in the darkCaptain America
    Vol 1 408), Weapon Mastery (Accurately shot a leaping target in the ear from a distanceThunderbolts
    Vol 1 146. Rapidly pulled off a headshot on a distant opponentCaptain America Vol 1 362), Stealth
    Mastery (Snuck his way into John Jameson''s jetCaptain America Vol 1 361 after shadowing two teams,
    one led by Captain America and the other by Helmut Zemo, all across the world), Pressure Points (Capable
    of knocking out people in such a way that they stay unconscious for over a day. Can paralyze a target''s
    legs with a knife throwNFL Superpro Vol 1 8), Preparation (Laid down traps in preparation of a fight
    against Captain America, and, anticipating his possible loss, set up an explosive trap to lead him
    into), Explosion Manipulation (Has set up explosive traps and used bomb arrows), Flight (With jetpackCaptain
    America Vol 1 390), Nanotechnology (Has access to cameras tiny enough to fit unnoticed in a skin-tight
    costume and pass through sensors unnoticedCaptain America Vol 1 404), Torture Mastery (Crossbones
    is a master of torture and brainwashing capable of turning others into loyal underlingsCaptain America
    Vol 1 407, undoing mental programmingCaptain America Vol 5 15 or simply breaking the will of S.H.I.E.L.D.
    agents with his methodsCaptain America Vol 5 17), Sleep Manipulation (Has utilized tranquilizer gunsThunderbolts
    Vol 1 145), Electricity Manipulation (Has utilized tasers and electric bolasCaptain America Vol 9
    20), Fire Manipulation (Has utilized flamethrowersThunderbolts Vol 1 148), Underwater Breathing (Type
    3Fear Itself: The Fearless Vol 1 4), Damage Reduction (Crossbones'' outfit is bulletproofDaredevil
    Vol 6 19), Resistance to Information Analysis (Crossbones'' metabolism is so strong that Daredevil
    cannot use his super senses to anticipate his moves), Sleep Manipulation (Immune to normal sedativesMarvel
    Comics Presents Vol 1 129) and Fear Manipulation (Resisted the Sleeper''s wave of fear, which brought
    even the Avengers to their kneesFear Itself: The Fearless Vol 1 12)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
