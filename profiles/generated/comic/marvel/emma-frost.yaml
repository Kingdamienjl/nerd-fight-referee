    source_ids: &id002
    - mediawiki-2197
    confidence: 0.95
  attack_potency:
    text: 'Wall level+ in her base form (Easily outmatched BansheeGeneration X Vol. 1 #43, who has contended
      with AngelUncanny X-Men Vol. 1 #100, August 1976). At least Large Building level (Was capable of
      sending Jessica Jones flyingJessica Jones: Purple Daughter # 2), possibly Planet level in her diamond
      form (Managed to pierce her hand through Black BoltIVX #5). Can ignore durability with telepathy.
      | At least Planet level (Should be comparable to her fellow Phoenix Five members), at most Galaxy
      level (Easily harmed and defeated ThorAvX: VS #4, September 2012, although he was somewhat weakened
      due to being previously injured by the Phoenix Force) | High Universe level (Stronger than before.
      Should be comparable to Cyclops, as she had the other half of the Phoenix Force. Briefly fought
      with The HulkAvengers vs. X-Men #11, November 2012)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Hypersonic combat speed and reactions (Should be comparable to other mutants like Cyclops,
      Angel, and Jean Grey. Reacted to Black Bolt''s blitz.Mach 8.23) At least FTL transformation speed
      (Has transformed before Cyclops'' blasts could reach her.All-New X-Men vol 1 #41 After training
      to be able to transform even faster, she could transform before Black Bolt could harm her) | Massively
      FTL+ (4.2 million c) | Infinite'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Unknown | Unknown | Unknown
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Wall level+ in her base form. At least Large Building level, possibly Planet level in her diamond
      form | At least Planet level, at most Galaxy level (Could easily harm a slightly weakened Thor)
      | High Universe level (Comparable to her attack potency)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: "Wall level+ in her base form, Planet level in her diamond form (Withstood teen Cyclops\u2019\
      \ optic blast and was only briefly stunned.X-Men: Blue #9 Was only sent flying by an attack from\
      \ Colossus. Took no damage from Bleeding Edge Iron Man\u2019s repulsor blasts.Avengers vs X-Men\
