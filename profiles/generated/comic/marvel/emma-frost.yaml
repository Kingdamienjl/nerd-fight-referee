      \ most Galaxy level, higher with diamond form | High Universe level (Withstood a lightning strike\
      \ from Storm and a surprise attack from Phoenix Five Cyclops), higher with diamond form"
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: 'Unknown (Fought against and defeated the Uni-Mind alongside Xavier, Hope, and Exodus.A.X.E.:
      Judgement Day #1A.X.E.: Judgement Day #2Immortal X-Men #5) | Superhuman | Superhuman'
    source_ids: *id002
    confidence: 0.95
  range:
    text: 'Interplanetary with telepathy (Broadcasted Cyclops'' message to every mutant across the world.Uncanny
      X-Men vol 1 #500 Emma Frost telepathically linked the minds of everyone at the Hellfire Gala to
      the mutants on Mars as they terraform it into Planet Arakko, confirmed by Iceman who says the Gala
      can hear him.X-Men vol 5 #21Planet-Sized X-Men #1)'
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'At least Gifted, likely Genius. Emma Frost is highly skilled in electronic theory and electronics
      and has learned how to build devices that can amplify psionic energy and utilize psionic energy
      for various effects. Taught at Xavier''s school for mutants and at the Massachusetts school. Emma
      has experience as a member and leader of the X-Men, along with other teams. Emma is also a skilled
      businesswoman, being one of the heads of the Hellfire Trading Company/Hellfire Club. She also used
      to sit on the Quiet Council as a governing figure of Krakoa. Emma is an extremely powerful and learned
      telepath repeatedly stated to be on par with Charles Xavier. Emma also passively learns information
      through telepathic osmosis.Uncanny X-Men vol 1 #496'
    source_ids: *id002
    confidence: 0.95
