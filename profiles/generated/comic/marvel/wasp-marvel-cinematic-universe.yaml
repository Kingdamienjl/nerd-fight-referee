- id: claim-standard-equipment-1b47c1b8
  section: equipment
  axis: equipment
  text: '*Wasp Suit: The suit manipulates the wearer''s size and controls different
    kinds of ants. **Wasp''s Wings: By utilizing four artificial insect-like wings,
    Hope can fly at impressive speeds and maneuver with great agility with ease. **Wasp''s
    Stingers: The suit''s gauntlets are armed with various weapons and utilities.
    It can also fire energy bolts that are able to knock a grown man. ***Grappling
    Line: The gauntlets are equipped with a grappling line which can be used for traversal
    purposes. ***Pym Particles Discs: About the size of a coin and shaped like a triskelion-styled
    shuriken, the discs are filled with specified forms of Pym Particles. Targets
    impacted by Red Discs shrinks to the size of an insect. Targets impacted by Blue
