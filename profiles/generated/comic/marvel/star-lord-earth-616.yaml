      value: 'Sorcerer Supreme #50 Even Hell-Lords such as Mephisto himself, despite
        being pan-dimensional mystic entities infinitely transcendent of Earth, still
        have souls/spirits that can be affected by the Soul Gem.Silver Surfer/Warlock:
        Resurrection Vol. 1 #4 Souls within the Astral Plane are even referred to
        as being "higher parts"One World Under Doom #9 or "higher forms"Sorcerer Supreme
        (2025) #1 of their being compared to their physical bodies in the Earth dimension.
        In addition, the abstractions of sentient minds are represented as loci of
        informational potential within the infinite psychic matrix of the Astral Plane,
        indicating the Astral Plane to be an realm that is purely conceptional & informational
        in its nature. This is supported by how the Dominions state that one''s soul
        contains their literal base information.Resurrection of Magneto (2024) #1
        It is a metaphysical dimension layered on top of the mortal plane.Avengers
        Vol 1 #503 The Astral Plane is also stated to be "an unreal place" and a "cosmic
        in-between", and is the source of the energy source known as the Power Cosmic,
        as well as a place without time, distance, or physical law where finding something
        within this plane is as simple as dreaming it.Silver Surfer: In Thy Name #3
        In this realm, space is a byproduct of the imagination, and those adept in
        traversing the Astral Plane can ignore distance, conquer space, and be anywhere
        they wish with but a thought.The Mystic Hands of Doctor Strange This connection
        between souls/astral forms and the Power Cosmic is supported by how Galactus
        is capable of reconstituting himself even after having his physical form annihilated
        and reduced to cosmic energyDoctor Strange, Sorcerer Supreme #45Infinity War
        #4, which is described as a life force that basically serves as one''s soulAnnihilation
        #3. It is also the collective psyche as well as the twilight zone between
        physical reality and the archetypal plane,Dark Angel Vol 1 #15 which is likely
        in reference to it bordering of the realm of the conceptual beings known as
        the Abstracts. It is also stated to be an abstract dimension shaped by the
        minds of those present.Official Handbook of the Marvel Universe A to Z #12
        ; Mystic Dimensions - From the Journals of Ian McNee The astralDark Angel
        #12 worldDark Angel Vol. 1 #11/dimensionDark Angel #16 of inner spaceDark
        Angel #10 (with "astral world" being another term for the astral plane) even
        at its lowest is the twilight world of the unconscious, an ideo-plastic reality
        where ideas take form and the denied thoughts and feelings of humanity take
        gruesome shapeHell''s Angel Vol 1 #2 - August, 1992 as well as the twilight
        zone between the physical world and archetypal plane that can contain beings
        from higher causal realms. The astral plane is alsoX-Men: Legacy Vol. 2 #8
        the place where the ideas and dreams of humans are connected in every abstract
        way, call it the Psychosphere, call it Idea-Space, call it the MassMindX-Men:
        Legacy Vol 2 #21 - December 4, 2013 (with it being later furtherLegion of
        X (2022) #7 confirmedLegion of X (2022) #9 thatLegion of X (2022) #1 both
        Ideaspace and the MassmindLegion of X (2022) #8 are both just alternate names
        for the Astral Plane). It is the home of thoughts, minds, ideas, and dreams.
        At this level, physics don''t matter, this plane is beyond geography and beneath
        thought, the fight here is just a line between the real to the fiction, from
        the solid to the spirit, the level of the demigods. There are also worlds
        without shape. It is also described as a huge "storage room" with everything
        that could ever be, or ever was, or ever is, all being just toys inside of
        it.Astonishing X-Men Vol 4 #9 The Astral Plane also contains and exists entirely
        beyond physical space, and physical matter cannot survive in the Astral Plane
        without defensive mental technologies. It is also stated to be a realm of
        pure consciousness and mathematics. Also, the statement of the Astral Plane
        being the realm of "Idea, Thought, and Narrative" is supported by Xavier stating
        that, when he fought the Shadow King in a telepathic battle on the Astral
        Plane, the two telepaths fought each other using emotions, mathematics, sensations,
        and especially stories/narratives, creating "sagas and songs and ages and
        massacres",Astonishing X-Men Vol. 4 #5 further showing how the Astral Plane
        is a realm of pure ideas, abstractions, stories, and narratives that can be
