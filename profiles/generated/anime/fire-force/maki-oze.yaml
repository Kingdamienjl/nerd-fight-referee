- id: claim-weaknesses-17ef9249
  section: weaknesses
  axis: weakness
  text: 'None Notable Attacks/Techniques: Ignition Ability: Maki possesses Second
    Generation abilities, having adapted to Spontaneous Human Combustion by becoming
    able to control flames from a long distance. In doing so, she can handle herself
    against two Third Generations simultaneously, being able to extinguish and absorb
    their generated flames into a giant fireball. Maki''s abilities provide defense
    for her entire team, as she can reflect incoming fire attacks and use an opponent''s
    flames against them. While she''s unable to deflect or redirect a fire with too
    much driving force, she is still able to alter its shape in order to reduce its
    impact. Pusu_Pusu_Maki.png|Pusu Pusu Meramera-FF.png|Mera Mera Pusupusu_Comet.png|Pusu
    Pusu Comet Firestorm_ability_ENG.png|Firestorm Iron Owls: By placing her fire
    sprits (small fires she can control) into a pair of weapons designed by Vulcan,
    Maki is able to control the Iron Owls by making them float. Maki shows great skill
    using her weapons. Being able to use them either as weapons by crashing them into
    her foes at great speeds or as shields by crouching behind them. While the Owls
    are very durable their circuitry is susceptible to electronic attacks. ==Notable
    Matchups== Victories: Tamaki Kotatsu (Enen no Shouboutai) Tamaki''s Profile (Both
    were bloodlusted and started five meters away. Neither had prep time or knowledge
    of the other''s abilities) Losses: Inconclusive: {{Discussions}} Category:Characters
    Category:Enen no Shouboutai Category:Female Characters Category:Fire Users Category:Martial
    Artists Category:Protagonists Category:Firefighters Category:Anime Characters
    Category:Good Characters Category:Manga Characters Category:Humans Category:Teenagers'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
