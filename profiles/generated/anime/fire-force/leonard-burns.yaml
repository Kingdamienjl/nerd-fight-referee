- id: claim-weaknesses-7a63dba1
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: Ignition Ability: Leonard is a veteran
    who has made a name for himself through his abilities and he is known as Fire
    Incarnate. Burns'' pyrokinetic Ignition Ability is called Voltage Nova. Using
    it, he can burn the flames inside his body like a furnace to increase his physical
    abilities with thermal energy. Doing so, Leonard was able to push away the plasma
    on Arthur Boyle''s Excalibur back at him and redirect the flames of Shinra''s
    kicks by intercepting the kicks with his palms. Voltage Nova has multiple stages
    that he as he fights, with the amount and intensity of Burns'' heat and flames
    becoming stronger and stronger as time passes. Meaning that defeating him quickly
    is the best option as he will eventually become untouchable. Once Voltage Nova
    reaches the second stage the sheer force it creates is enough to prevent opponents
    from getting close to Burns. With some powerful attacks simply failing to pass
    through his aura or touching his body, unless they greatly enhanced with large
    amounts of speed and force. Additionally, Burns is able to deal a heavy concussive
    blow to his opponents through the use of this intense heat, without touching them
    simply by flexing his fingers or stamping his foot. Even by just heating his arm
    he is capable of killing an Infernal with a single blow. Leonard''s sturdy body
    allows him to land from extraordinary heights without repercussions, withstand
    critical attacks without flinching, continue fighting despite being in crippling
    pain and his speed grants him the ability to react to and deflect enemy attacks
    with ease. His strength and fighting experience is so great that it could rival
    Benimaru Shinmon. Benimaru himself wanted to fight him to see who is stronger
    Burns'' Ignition Ability.png|Fire Incarnate Voltage Nova.png|Voltage Nova ==Notable
    Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters
    Category:Enen no Shouboutai Category:Fire Users Category:Martial Artists Category:Enhanced
    Senses Users Category:Temperature Users Category:Statistics Amplification Users
    Category:Male Characters Category:Manga Characters Category:Anime Characters Category:Firefighters'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
