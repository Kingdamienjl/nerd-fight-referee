- id: claim-weaknesses-a35b59d9
  section: weaknesses
  axis: weakness
  text: 'He cannot fight if his sword is in his left hand. Can only create a lethal
    amount of plasma if the object he channels it through is ''swordly'' enough. He
    is only as strong as his knightly delusions. Notable Attacks/Techniques: *Violet
    Flash: Arthur swings at his opponent with immense speed, often dismembering them
    in one fell swoop. *No-Self: Arthur shuts his mind down and fights using only
    instinctive reactions. *Violet Flash - Earth Divider: Arthur slashes an immense
    strike which can cut the Earth in two. Arthur is a Third Generation, who has exceeded
    the abilities granted to him and is able to raise the temperature of the flames
    he creates, therefore allowing him to fabricate and control the fourth state of
    matter — plasma. Using this plasma sword, Arthur is able to cut through objects
    with great ease, as it has the same effects as plasma cutting. Arthur uses Excalibur
    exclusively in his right hand, otherwise, he''s known to lose all ability using
    the sword effectively. Excalibur has shown the proficiency of the ability to deflect
    and fend off against flames. With his Excalibur, Arthur is capable of easily cutting
    through metal, and generating electricity. He also possesses incredible raw physical
    strength, being capable of sending an opponent bigger than him in size flying
    with a single punch. ==Notable Matchups== Victories: Losses: *Kai (Ninjago) Kai''s
    Profile (Pilots-Season 16 Kai and Great Cataclysm & Star Ring Arthur were used;
    Battle took place in the Forest of Tranquility; Starting Distance was 5 meters;
    Speed was equalized; Kai had access to his Golden Sword and Arthur had access
    to Excalibur) Inconclusive: * Gerard Valkyrie (Bleach) Gerard Valkyrie''s Profile
    (Gerard''s Moon level key is used, Speed was equalized) ==References== {{scroll
    box|{{reflist|2}}}} {{Discussions}} Category:Characters Category:Enen no Shouboutai
