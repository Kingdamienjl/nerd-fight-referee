- id: claim-weaknesses-746c0c03
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: Ignition Ability: Benimaru is regarded
    as the strongest Fire Officer in the Special Fire Force. He possesses the rare
    trait of being a Second and Third Generation, which ultimately allows him to ignite
    his own flames willingly, but also control flames from an external source. Benimaru
    is known as "Asakusa''s King of Destruction" because of the devastating power
    that he is capable of unleashing. Benimaru predominantly uses matois (a flag that
    was used in the edo period by firemen to indicate fires) as a weapon of combat;
    igniting and controlling the flames on the flag. He can use the matoi as a pole
    to fly to long-distance areas, and by using his Second Generation ability, can
    control the flames of other ignited matoi and direct them to a certain place.
    He can control the direction and speed of bullets in the same fashion as Takehisa.
    Benimaru is also highly skilled in hand-to-hand combat, shown when he easily overpowered
    Maki Oze and Shinra Kusakabe. Benimaru is a practitioner of the iaido martial
    arts. Instead of using a sword, he can create a sharp blade of flames on the palm
    of his hand and strike his foes, a technique branching from his unique Iai Hand-Sword:
    First Form (居合手刀 壱ノ型, Iaido Shutō Ichi no Kata) fighting style. Utilizing his
    Iai Hand-Sword: Seventh Form, Benimaru creates a ring of fire behind him that
    he throws into his opponents. When using his ultimate technique, Benimaru unleashes
    a powerful blast of flames that creates a circular shape and resembles a crimson-colored
    moon, powerful enough to kill Haran who turned himself into a Demon Infernal.
    *Iai Hand-Sword: First'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
