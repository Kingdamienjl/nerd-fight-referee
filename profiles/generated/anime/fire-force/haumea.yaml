  section: weaknesses
  axis: weakness
  text: 'Her electricity is weak to plasma. Her control of a person has a limited
    range and will stop working when they leave the range. Notable Attacks/Techniques:
    *Motor Head: Using her electrical signals, Haumea can manipulate people''s nerves
    and control them. She can even stimulate the dopamine and beta-endorphin of a
    targeted individual. This results in heightened aggression and lowered inhibitions.
    However, she is unable to explicitly control how the subject of this simulation
    will actually react. *Radiohead: Using her electrical signals, Haumea is able
    to send thoughts and transmissions to her teammates from great distances. *Talking
    head: Haumea can interpret the electrical signals in the brains of others to read
    their thoughts and feelings. *Light of Despair: When fused with the Pillars and
