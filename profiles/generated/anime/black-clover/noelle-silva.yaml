- id: claim-weaknesses-4f7da855
  section: weaknesses
  axis: weakness
  text: 'Cannot control her abnormally large Magic Power so it tends to go awry. Using Water Dragon''s
    Roar drains all of her Magic Power at once | Her Spirit Dive only lasts for one minute Notable Attacks/Techniques:
    Noelle Sea Dragon''s Waterball.png|Sea Dragon''s Waterball Noelle Nest of the Sea Dragon.png|Sea Dragon''s
    Nest Noelle Cradle of the Sea Dragon.png|Sea Dragon''s Cradle Noelle Roar of the Sea Dragon.png|Water
    Dragon''s Roar Noelle Point-Blank Sea Dragon''s Roar.png|Point-Blank Sea Dragon''s Roar Water Magic:
    Noelle uses this magic attribute to generate and manipulate water. She primarily uses this magic to
    shoot waterballs toward her opponents. *Water Magic: Sea Dragon''s Waterball: Noelle creates a large
    swirling sphere of water at the end of her hand or wand or between her hands, and then launches the
    sphere at her target. The force behind the spell can form craters in the ground and propel people
    through the air. Multiple spheres can be generated simultaneously in an area near Noelle. *Sea Dragon''s
    Nest: Noelle creates a dome that repels and deflects incoming attacks. It is powerful enough to deflect
    an attack from Vetto, an individual said to exceed even a Mage Knight Captain in terms of sheer power.
    *Sea Dragon''s Cradle: Noelle creates a massive sphere of water which she can use to transport herself
    and her allies through even the deepest waters, weathering whirlpools and sea pressure unharmed. *Sea
    Dragon''s Roar: Noelle uses up all of her magical power to shape water into the form of a serpentine
    dragon and launch it at her opponent. This attack is powerful enough to tear off Vetto''s arm in addition
    to overpowering the attack he used to intercept it. *Water Creation Magic: Point-Blank Sea Dragon''s
    Roar: After piercing her opponent with a lance, Noelle creates a large dragon head, with Noelle in
    the dragon''s throat. The dragon''s mouth then slams shut on the opponent. Valkyrie Dre'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-afc8911e
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Accelerated Development (It is stated that some mages are
    able to learn new spells in the midst of disaster or crisis, and Noelle is one of them. Each spell
    Noelle has learned was in middle of a crisis), Acrobatics, Aura (Mages with large amount of Magic
    Power can induce an intense pressure in their surroundings), Enhanced Senses, Extrasensory Perception
    (People with Magic can sense the flow of Mana in their surroundings as well as other people''s Magic
    Power), Flight (Limited with a broom, True Flight with Valkyrie Dress), Forcefield Creation (With
    Sea Dragon''s Lair and Sea Dragon''s Cradle. Mages with large amount of Magic Power have a forcefield
    of Mana that naturally protects them from incoming attacks), Homing Attack, Magic (Attribute: Water
    Magic), Statistics Amplification via Reinforcement Magic (Noelle uses this form of magic to enhance
    her physical abilities), Water Manipulation, Fusionism (With Spirit Dive), Resistance to Heat Manipulation
    (Mana Skin allows even the average Magic Knights to run across the Yultim Volcano, a Grand Magic Region
    which can reduce a human into ashes), Power Nullification with Mana Skin (Was able to cast Sea Dragon''s
    Roar under the presence of an elf which neutralizes spells of those with a good magic control such
    as Finral), higher with Valkyrie Dress (Valkyrie Dress is unaffected by Compass Magic, which could
    neutralize Noelle''s spells despite having Mana Skin) and Sleep Manipulation with Mana Skin (Leopold
    was able to overcome the effects of Fragil''s Snow Magic, which puts her opponents to sleep)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
