- id: claim-weaknesses-be61d9b9
  section: weaknesses
  axis: weakness
  text: 'Dante is incredibly arrogant to the point of being narcissistic. He also
    revels in the malice of others, and will take measures to awaken their inner malice,
    even if it ends up strengthening them in the process. Notable Attacks/Techniques:
    Body Magic: Dante uses this magic attribute to manipulate his body''s tissues,
    allowing him to repair and alter his physique at will. Due to enhancement from
    his devil''s power, Dante''s self-healing is unnaturally quick and extensive,
    enabling him to survive decapitation and to regenerate his whole torso in seconds.
    This enhancement also stops his natural aging process. He can also greatly distort
    his body and form additional limbs. Dante heals his chest.png|Unnamed regeneration
    spell Dante''s monstrous transformation.png|Unnamed transformation spell Dante
    forms multiple arms.png|Unnamed additional limbs spell Dante Presence of the Demon
    King1.png|Presence of the Demon King Dante Evil God''s Pressure Craft1.png|Evil
    God''s Pressure Craft Dante warps space1.png|Unnamed space warping spell Dante_Black_Clover_-_Heavy_Infighting.png|Heavy
    Infighting Dante Heavy Infighting Gladiator.png|Heavy Infighting Gladiator Dante
    Gravity Singularity.png|Gravity Singularity Gravity Magic「重力魔法 Jūryoku Mahō」:
    Dante''s second magic attribute borrowed from his devil, Dante uses this magic
    attribute to manipulate the gravity in the area. He can weaken gravity to levitate
    himself and large objects or strengthen gravity to slam things into the ground
    with tremendous force. By increasing the pressure all around a target, Dante could
    immobilize a person in midair or condense and shape a large amount of material
    into an object. *Gravity Magic: Presence of the Demon King「重力魔法『魔王の御前』Jūryoku
    Mahō "Maō no Gozen"」: Dante dramatically increases the strength of gravity in
    his surroundings. Any objects in the area are slammed into the ground. This spell
    is capable of stopping a large projectile, bending magical light, and snapping
    trees in half *Gravity Magic: Evil God''s Pressure Craft「重力魔法『悪神の加圧技工』Jūryoku
    Mahō "Akujin no Kaatsu Gikō"」: Dante pulls a large rock up out of the ground and
    then uses immense gravitational pressure to compress the rock into the shape of
    a large sword. Dante can control the sword through telekinesis and can launch
    it at a target. *Gravity Magic: Heavy Infighting「重力魔法『ヘビーインファイト』Jūryoku Mahō "Hebī
    Infaito"」: Dante moves in close to his opponent and rapidly punches them. By manipulating
    gravity, Dante is able to increase the weight and speed of their punches and easily
    overwhelm the opponent. *Gravity Magic: Heavy Infighting Gladiator「重力魔法『ヘビーインファイトグラディエイター』Jūryoku
    Mahō "Hebī Infaito Guradieitā"」: Dante crafts a sword from compressed rock, moves
    in close to his opponents, and swings the sword rapidly. By manipulating gravity,
    Dante is able to increase the weight and the speed of their sword swings. *Gravity
    Magic: Gravity Singularity「重力魔法『重力特異点』Jūryoku Mahō "Jūryoku Tokuiten"」: Dante
    creates a small black hole that sucks in and destroys anything in a short range
    around it. Dante can control the singularity''s movement and launch it at an opponent.
    As the singularity moves away from Dante, it grows larger and the range of its
    destruction expands. The singularity can carve through mountains in seconds. Additionally,
    due to the immense gravity, the singularity warps spacetime, enabling it to bend
    incoming attacks, even ones capable of cutting through spacetime. Devil Power:
    Dante is the host of the highest-ranking devil, the Supreme Devil Lucifero. Since
    he is "Devil-Possessed", just like Asta, he is able to use the power of the devil
    to gain a forbidden power called Devil Power. Even increasing his Devil Power
    by 1% gives to the host, a phenomenal boost in power. Dante has shown to be able
    to use up to 80% of Devil Power, which changes to 100% when the Tree of Qliphoth
    is activated. Lucifero Dante''s Devil1.png|Dante''s Devil: Lucifero Reinforcement
    Magic: Dante uses this magic to increase his physical abilities, such as speed,
    defense and strength. *Mana Skin: The user increases his own durability by coating
    his body with mana. ==Gallery== Yami_Sukehiro_Vs_Dante_Black_Clover.png|Dante
    Vs Yami ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{scroll
    box|{{reflist|2}}}} {{Discussions}} Category:Characters Category:Male Characters
    Category:Humans Category:Adults Category:Demons Category:Possessed/Brainwashed
    Characters Category:Leaders Category:Antagonists Category:Primary Antagonists
    Category:Military Characters Category:Kings Category:Evil Characters Category:Villains
    Category:Criminals Category:Manga Characters Category:Anime Characters Category:Blade
    Users Category:Sword Users Category:Brawlers Category:Black Clover Category:Weapon
    Masters Category:Magic Users Category:Aura Users Category:Forcefield Users Category:Power
    Nullification Users Category:Gravity Users Category:Acrobats Category:Wing Users
    Category:Flight Users Category:Enhanced Senses Users Category:Extrasenso'
