- id: claim-powers-and-abilities-1b7f1c15
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Skilled Swordsman (Could match Yami
    until he uses quick-draw techniques), Acrobatics, Aura (Which grants him Power
    Nullification and Gravity Manipulation; Was able to erase Vanessa''s Mana. Mages
    with large amount of Magic Power are able to exert it in order to create an intense
    pressure in his surroundings), Black Hole Creation with Gravity Singularity (Can
    create a gravitational singularity out of sheer Gravity), Body Control with Body
    Magic (Dante can manipulate his body to expel one part of his body, modify the
    shape of his body and make extra arms), Durability Negation (with Gravity Magic
    : Presence of the Demon King), Enhanced Senses, Extrasensory Perception (People
    with Magic can sense the flow of Mana in their surroundings as well as other people''s
    Magic Power), Flight (True Flight), Forcefield Creation (Mages with large amount
    of Magic Power have a forcefield of Mana that naturally protects them from incoming
    attacks and even neutralize magic spells), Immortality (Types 1 Stated that he
    can''t age or deteriorate]; 2 Unaffected by having parts of his body missing]
    and 3), Magic (Attributes: Body Magic and Gravity Magic), Weapon Creation (Capable
    of morphing rocks into a sword), Size Manipulation (capable of growing a few meters),
    Regeneration (High-Mid: Regenerated from being cut to pieces by Jack''s "Lunatic
    Slash" and from having his entire torso being blown away by Yami''s Death Thrust),
    Spatial Manipulation (The pressure generated by his gravity his strong enough
    to warp space itself), Statistics Amplification (with Reinforcement Magic, Body
    Magic and Devil Power), Telekinesis, Teleportation (Has the ability to teleport
    by warping space), Unholy Manipulation (Dante lets the power of a demon flow within
    him to gain a phenomenal boost in power and abilities, and to transform into one),
    and Resistance to Heat Manipulation with Mana Skin (Mana Skin allows even the
    average Magic Knights to run across the Yultim Volcano, a Grand Magic Region which
    can reduce a human into ashes), Power Nullification with Mana Skin (Mana Skin
    allowed Noelle to cast Sea Dragon''s Roar under the presence of an elf), Regeneration
    Negation and Adaptation (100% Dante regenerated regardless of Jack''s Severing
    Magic, which adapted to his magic and bypassed his regeneration previously) and
    Sleep Manipulation with Mana Skin (Leopold was able to overcome the effects of
    Fragil''s Snow Magic, which puts her opponents to sleep)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
