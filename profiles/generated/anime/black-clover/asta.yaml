- id: claim-weaknesses-7e2c8b7a
  section: weaknesses
  axis: weakness
  text: Reckless with little regard for his own safety, but this has lessened somewhat over the course
    of the story. Asta is exceptionally naive at times and is rather merciful. He can swing the Demon-Dweller
    Sword faster, but can't hit as hard with it and vice versa. Base Anti-Magic, the one constantly flowing
    in the swords, is less effective against amorphous magic such as Fog, Smoke, and Sand Magic as they
    can simply flow back into position. The magic projectile function of the Demon-Dweller Sword requires
    time to charge and the actual type of projectile fired cannot be controlled by Asta. He can only enter
    his Black Asta Form three times a day and doing so places an incredible strain on his muscles and
    bones. {| cla
