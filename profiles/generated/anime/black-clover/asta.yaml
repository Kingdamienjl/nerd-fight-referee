  text: "{{Border|Scroll=No|Padding=Yes|Content= |-|Eye of the Midnight Sun Arc \u25BE= {{#tag:tabber|\
    \ {{!}}-{{!}}Base \u25BE= {{#tag:tabber| {{!}}-{{!}}Passive= *Superhuman Physical Characteristics\
