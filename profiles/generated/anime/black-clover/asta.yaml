  intelligence:
    text: "Outside of Battle= *Average: Asta is a teen that was given minimum education due to living\
      \ in the boondocks at the edge of the kingdom for most of his life and is thus fairly ignorant and\
      \ book dumb. |-|In Battle \u25BE= *Genius: Asta makes up for his intelligence with his strong combat\
      \ instincts, which borders on precognition at times, and his unique fighting style focused on unpredictability.\
      \ {{#tag:tabber| {{!}}-{{!}}Experience= *11 Years of training: Asta, just like Yuno, has been training\
      \ since the age of 5, sometimes individually, and sometimes while sparring with Yuno too. While\
      \ Yuno was training his magic, Asta training his physical abilities and his proficiency with weapons,\
      \ as he uses sticks as swords. 10 years later, he receives a grimoire of his own, and his Anti-Magic\
      \ sword. He then learned advanced swordsmanship from the Magic Teacher Fanzell Kruger. At the very\
      \ early stage of his training, days at most, Fanzell already considered him to be among his 3 best\
      \ students in battle, and even went so far as to put him in second place after Mars. *Constant exposure\
      \ to life or death situations: He also got his first real battle with his life on the line during\
      \ his training with Fanzell, as Fanzell was actually researched by the Special Assassination unit\
      \ of the Diamond Kingdom, which is considered as the kingdom with the best military force on the\
      \ continent. This Special Assassination unit was led by Mariella one of the greatest soldiers of\
      \ her Kingdom and Fanzell's third best student in battle. With a tag team with Fanzell, Asta managed\
      \ to defeat the Special Assassination unit without taking much hits. Several months afterward, Asta\
      \ took on more skilled and powerful foes such as Heath Grice and Mars, and after receiving advice\
      \ from experienced Magic Knight Captains such as Yami Sukehiro and Fuegoleon Vermillion, he has\
      \ become much calmer and level-headed in combat, focusing on the task at hand and maintaining his\
      \ composure while under pressure and make quick and effective decisions that turns the outcome of\
      \ the battle to his advantage such as during his fight against Valtos, where he let go of his two\
      \ swords despite being attacked from every directions and at the first opportunity, rushed at him\
      \ through one of the portals used to attack Asta from everywhere. Since then, Asta has been participating\
      \ in countless battles with his life and the lives of his friends at stake, and kept getting better\
      \ during each one of them. {{!}}-{{!}}Techniques= *Swordsmanship: Asta has been trained by none\
      \ other than Fanzell Kruger, an ex-commander of the Diamond Kingdom, a kingdom focused around science\
      \ and military power, and a former instructor of many now famous soldiers within the Diamond Kingdom,\
      \ which includes Mariella of the Assassination Unit and Mars and Ladros, two of the new Eight Shining\
      \ generals. His Swordsmanship skills also allows him to deflect several dozen of projectiles coming\
      \ at close range and from every directions despite the huge weight of his swords, thus while protecting\
      \ people. During his battle against Valtos, Asta even managed to deflect just as many projectiles\
      \ while doing flips and other sorts of acrobatics. Asta's skills grows better each day as he constantly\
      \ trains and surpasses his limits against more experienced opponents, he managed to assimilate Kiato's\
      \ fighting style, who is very proficient in swordsmanship, combining his sword skills with his dance\
      \ moves to mess with the sense of his opponents even if they have the ability to predict his movements,\
      \ a fighting style that has been acknowledged by Yami himself. Kiato's skills also allows him to\
      \ deflect the energy output of the opponent's attack, and therefore take the least amount of damage\
      \ possible from opponents such as Vetto, that are strong enough to blow his head off with a single\
      \ strike. {{!}}-{{!}}Creativity= *Creativity: Asta is known for his creativity, making use of his\
      \ sword in such ways that makes him unique and sometimes, like a proficient user of a totally different\
      \ type of weapon, which renders his actions unpredictable. In the Witches' Forest Arc, Asta couldn't\
      \ hit Ladros who flew dozens of meters above the ground. As deflecting his attacks was helpless,\
      \ he decided to let himself get hit by those attacks to create a smokescreen around him and then\
      \ throw one of his heavy swords akin to a javelin to stab him very close to the heart while he was\
      \ still up in the air, making him fall in critical condition but enough to survive the stab wound.\
      \ {{!}}-{{!}}Assimilation= *Fast Learner: Asta is a fast learner and takes any sort of advice to\
      \ become better, even implicit ones. During his battle against Patry, Asta learned Ki sensing in\
      \ his first attempt, even surprising Yami, and mastered it right after. His most impressive feat\
      \ is copying Magic with his magicless body, as he managed to perfectly mimic Kiato's dance magic\
      \ in the same battle he first witnessed it. {{!}}-{{!}}Analytical skil"
    source_ids: *id002
    confidence: 0.95
