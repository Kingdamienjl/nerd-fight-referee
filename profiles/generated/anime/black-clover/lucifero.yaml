- id: claim-weaknesses-2a936746
  section: weaknesses
  axis: weakness
  text: 'None notable as of now Notable Attacks/Techniques: Gravity Magic「重力魔法 Jūryoku
    Mahō」: Lucifero''s magic attribute, which he uses to manipulate the gravity in
    an area. He can weaken gravity to levitate himself and large objects or strengthen
    gravity to slam things into the ground with tremendous force. By increasing the
    pressure all around a target, Lucifero can immobilize a person in midair or condense
    and shape a large amount of material into an object. Lucifero should have access
    to the same spells as Dante, but has so far only shown one. *Gravity Magic: Presence
    of the Demon King「重力魔法『魔王の御前』Jūryoku Mahō "Maō no Gozen"」: Lucifero dramatically
    increases the strength of gravity in his surroundings. Any objects in the area
    are slammed into the ground. This spell is capable of stopping a large projectile,
    bending magical light, and snapping trees in half. When used by Lucifero in his
    half-manifested state, it is capable of knocking out a mage as powerful as Nozel
    instantly from its sheer intensity. Demon King Presence.PNG|Presence of the Demon
    King Reinforcement Magic: Lucifero uses this magic to increase his physical abilities,
    such as speed, defense and strength. *Mana Skin: Lucifero increases his own durability
    by coating his body with mana. ==Notable Matchups== Victories: Losses: Inconclusive:
    Ulquiorra Cifer (Bleach) Ulquiorra''s Profile (Segunda Etapa Ulquiorra and Fully
    Manifested Lucifero were used. Speed was equalized) {{Discussions}} Category:Characters
    Category:Male Characters Category:Demons Category:Leaders Category:Antagonists
