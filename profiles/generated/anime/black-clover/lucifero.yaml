    Users Category:Unholy Users Category:Possession Users Category:Statistics Amplification
    Users Category:Space Users Category:Teleportation Users Category:Rulers Category:Existence
    Erasure Users Category:Immortals Category:Regeneration Users Category:Durability
    Negation Users Category:Invulnerability Users Category:Black Hole Users Category:Corruption
    Users Category:Mind Users Category:Death Users Category:Information Analysis Users
    Category:Fantasy Characters'
