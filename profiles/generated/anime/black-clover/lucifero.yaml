- id: claim-powers-and-abilities-bec8d94f
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Devil Physiology *Overwhelming Aura
    (Mages with a large amount of Magic Power can exert it to induce an intense pressure
    in their surroundings. Lucifero''s Magic Power is vastly superior to Megicula
    and Zagred''s Magic Power, which Yami described as being in a completely different
    level) *Black Hole Creation *Durability Negation (With Gravity Magic: Presence
    of the Demon King) *Enhanced Senses *Extrasensory Perception (Those with Magic
    Power have the ability to sense the flow of Mana in their surroundings as well
    as other people''s Magic Power) *Flight (True Flight) *Forcefield Creation (People
    with a large amount of Magic Power have a forcefield of Magic Power that naturally
    protects them from incoming attacks) *Fusionism (Combined all of the lower-ranked
    devils from the first and second gates of the Tree of Qliphoth into one entity
    for him to manifest in) *Information Analysis (People with a great magic sensing
    have the ability to gauge the power or even the magic attribute of mages located
    miles away) *Magic (Attribute: Gravity Magic) *Magic Bullets *Magic Nullification
    via Forcefield Creation (Lucifero''s Magic Power is vastly superior to the elves,
    whom possess a field that can prevent mages from casting spells or exerting magic
    in their presence) *Non-Physical Interaction (Destroyed Dorothy''s spell that
    warps its target to Glamour World, a spell that lacked physical substance) *Spatial
    Manipulation *Statistics Amplification (With Reinforcement Magic, Mana Skin, and
    Heavy Infighting) *Telekinesis *Teleportation (Teleported away from Asta''s sword
    strike) *Body Control (Turned his upper wings into additional arms) |-|Resistances=
    *Cold Temperatures (Unaffected by the cold temperature of the Spade Kingdom) *Fire
    Manipulation (Mereoleona was completely unable to burn Lucifero) *Heat Manipulation
    (Unable to be burned by Mereoleona''s flames, which get exponentially hotter after
    each hit, higher with Mana Skin [Mana Skin allows even the average Magic Knights
    to run across the Yultim Volcano, whose ambient heat can reduce a human into ashes])
    *Cutting Attacks & Adaptation (Jack was completely unable to cut Lucifero, even
    though his blades adapt to their opponent in order to cut them) *Holy Manipulation
    (Unaffected by Yuno''s Saint Spirit of Zephyr, which destroys devils and has the
    same effects as regular Spirit of Zephyr. Nacht stated that only Anti-Magic works
    on him, implying that Saint Stage power doesn''t have an effect on him) *Mind
    Manipulation (Due to having a developed Magic Power, mages are unaffected by Neige''s
    Snow Magic, which controls the target. As a Supreme Devil, Lucifero possesses
    a tremendous amount of negative Mana, which can corrupt the mind and souls of
    its victims or users alike) *Pocket Reality Manipulation, Spatial Manipulation
    & BFR (Was unaffected by Dorothy''s attempt to send him to Glamour World) *Power
    Nullification (Superior to Dante, who could affect Asta with his space-warping
    gravity despite the latter having Anti-Magic and being resistant to spatial warping.
    Superior to Noelle, whose Mana Skin allowed her to cast a spell in the presence
    of an elf''s magic-nullifying spell) *Sleep Manipulation with Mana Skin (Superior
    to Leopold, whose Mana Skin allowed him to overcome the effects of Fragil''s sleep-inducing
    Snow Magic)'
  source_ids: *id003
  decisive: true
