- id: claim-weaknesses-96bb3f6d
  section: weaknesses
  axis: weakness
  text: Predator requires him to pick a target and find out what their ability is so he can conjure an
    exact counter to it, the more accurate his understanding the better counter Predator will be. Since
    it draws strength from the accuracy of Rihan's analysis from a state of complete ignorance, Predator
    is powerless against simple Enhancement and Emission attacks, also due to the target being the ability
    user themselves, who is likely to retaliate. Furthermore, it is at a disadvantage against opponents
    with counteractive or multiple abilities. As an added condition, Rihan must gather the required information
    by himself, since taking less risks and being told about the targeted ability by a third party would
    result in Predator being too weak to neutralise it. After it successfully counters a Nen ability,
    Rihan is unable to use any Nen for 48 hours. Zetsu involves keeping one's aura exclusively in the
    body, it makes a Nen user more vulnerable to physical and Nen attacks, because one doesn't have any
    aura on the outside of one's body to protect oneself.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-f0611840
  section: abilities
  axis: hax
  text: At least Peak Human Physical Characteristics, Nen Manipulation (Conjurer; Rihan is a proficient
    Nen User being able to use the basic and various advanced techniques), Subjective Reality and Reactive
