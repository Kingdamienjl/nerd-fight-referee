  intelligence:
    text: Average in general. Gifted in combat. (Uvogin is an immensely skilled fighter and Nen user.
      He has shown exceptional mastery over his Nen, being able to defeat four other highly skilled Nen
      users while paralyzed from the neck down. As he was part of the Troupe the moment it was founded,
      he has years of combat experience, evident with his ability to analyze his opponent's moves and
      also has a great deal of knowledge on how Nen works. He was able to surprise Kurapika with his strategy
      utilizing In and put up a good fight despite being outmatched. Outside of combat, however, his intelligence
      is nothing special. If anything, he's portrayed as one of the least intelligent Troupe members,
      usually taking a 'punch first ask questions later' stance, being unable to track the Nostrade family
      even with a computer by himself, with him needing Shalnark's help and immediately assuming that
      one of the Troupe members was a traitor the moment he saw an empty safe without stopping to think
