- id: claim-weaknesses-e5bba1be
  section: weaknesses
  axis: weakness
  text: As he possesses incredible brawn, it's only natural that he is also extremely overconfident, arrogant,
    and prideful. His pride stopped him from leaving Yorknew City to get revenge on Kurapika without any
    support, which led to his demise. His fierce and unwavering loyalty means that he would rather die
    than betray his comrades, and finally, as an Enhancer, Chrollo Lucilfer has stated that he is most
    vulnerable to Manipulators and Conjurers. Zetsu involves keeping one's aura exclusively in the body,
    it makes a Nen user more susceptible to physical and Nen attacks, because one doesn't have any aura
    on the outside of one's body to protect oneself.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-63fc6b48
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Nen Manipulation (Enhancer; Uvogin is one of the strongest
    Enhancers in the entire series, capable of wiping out hundreds of people with the greatest of ease
    and four other highly skilled Nen users while paralysed from the neck down), Proficient Hand-to-Hand
    Combatant (Stomped hundreds of mafia members sent after him, with Franklin Bordeau comparing the fight
    to a gorilla stomping ants), Weapon Mastery (Uvogin can use mere stones as weapons by combining them
    with his strength, he threw a stone which hit a sniper from hundreds of metres away), Sound Manipulation
    (Killed a Shadow Beast member by shouting. The Troupe members acknowledged that his shout would have
    hurt them too), Regeneration (Low. Healed his injuries from the fight with the Shadow beasts and his
    time as a hostage in a few hours. In general, Enhancers heal faster than other Nen types.), Immense
    Pain Tolerance (Did not flinch when Kurapika broke his nose and took a long beating from Kurapika),
    Minor Resistance to Poison Manipulation (Took longer for Rabid Dog's fast-acting paralysis poison
    to affect him)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
