  axis: weakness
  text: Tsezguerra has neglected basic training for years and only picked fights he was confident he could
    win, which lead to his physical abilities and instincts to wane over the years. Zetsu involves keeping
    one's aura exclusively in the body, it makes a Nen user more vulnerable to physical and Nen attacks,
    because one doesn't have any aura on the outside of one's body to protect oneself.
