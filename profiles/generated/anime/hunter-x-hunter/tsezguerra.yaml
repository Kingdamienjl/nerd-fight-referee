  intelligence:
    text: Gifted (As a Single-Star Jackpot Hunter, Tsezguerra must have made substantial contributions
      to his field of study. Tsezguerra is a highly observant and tactical man, rivalling Genthru in terms
      of strategy and planning. A capable leader and master of guerrilla tactics, he was able to distract
      the Bombers for 3 weeks straight in order to give Gon and Killua time to train, and successfully
      anticipated all of the Bomber's moves and came up with a variety of alternate scenarios. Tsezguerra's
      observation skills are also apparent, as he became suspicious of Genthru when the latter mentioned
      the Bomber in unconvincing circumstances, and, when Genthru was confirmed to be it, deduced that
      talking about it was part of the activation conditions of his ability. He was also the first to
      notice that Killua's hand were severely injured, and anticipated Genthru would replace Sub and Bara
      with two impostors while chasing him. Tsezguerra is also a skilled negotiator)
    source_ids: *id002
