- id: claim-weaknesses-bf5dc83d
  section: weaknesses
  axis: weakness
  text: Shoot has a timid personality and is often afraid of taking advantage of opportune times to attack
    an enemy. However, after witnessing Gon's unwavering determination in the palace invasion, he has
    shed this cowardly nature. By his own admission, Shoot does not like injuring people. Zetsu involves
    keeping one's aura exclusively in the body, it makes a Nen user more vulnerable to physical and Nen
    attacks, because one doesn't have any aura on the outside of one's body to protect oneself.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-44e13323
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Nen Manipulation (Manipulator; he is a proficient Nen user
    who can use all the basic and advanced techniques), Master Hand-to-Hand Combatant (Fought evenly with
    Killua Zoldyck), Limited Transmutation (Shoot can turn pocket-sized three-dimensional objects into
    imprints on the palm of his hand), Summoning (Shoot can conjure and manipulate three disembodied hands
    as well as a birdcage), Limited Flight (By standing on one of the hands, Shoot is able to fly at great
    speeds), Size Manipulation and Sealing (Through physical contact, Shoot can rob a target of specific
    body parts, corresponding to the area of impact, by shrinking them and teleporting them into his birdcage,
