- id: claim-powers-and-abilities-fb2213b9
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Nen Manipulator (Emitter; Knov is a veteran Nen user whose
    skill is regarded highly within the Hunter's Association. He is on par with Morel and should be superior
    to Knuckle and Shoot), Transmutation (Knov can transmute the shape of his aura into portals), Master
    Hand-to-Hand Combatant (Casually defeated Neferpitou's armed puppets with combat alone), Acrobatics
    (Knov can run across rooftops and jump from one another with ease), Stealth Mastery (Knov is an expert
    infiltrator as well. He managed to sneak into the Royal Palace, placed several portals and killed
    a soldier completely undetected, even by the Royal Guard themselves), Spatial Manipulation, Dimensional
    Storage, Portal Creation and BFR (Knov is able to create portals to an artificial Nen dimension, capable
    of storing objects and people, teleporting people to specific portals set by Knov, and transport and
    trap unsuspecting enemies in the dimension), possibly Spatial Manipulation, Law Manipulation and Sealing
    (Kurapika stated that it was a forte of Conjurers to create or detach a space and impose laws; this
    is the case for the Hide and Seek dimension in which only Knov can enter and exit at will with his
    master key. It is possible for Knov to close all the entrances to seal another within the dimension
    sealing others within), possibly Void Manipulation and Durability Negation with Scream (By opening
    a portal and wrapping it around an opponent, Knov can close the portal, sending whatever is between
    them into another dimension)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
