- id: claim-weaknesses-a0cd3ef4
  section: weaknesses
  axis: weakness
  text: "Brash and impulsive. Potclean\u2019s target only gains interest within a proximity of 100 meters\
    \ from Knuckle. Knuckle cannot damage his opponent and his opponent cannot damage him when Potclean\
    \ is active, however powerful attacks beyond Knuckle can pay back most if not all the interest accumulated\
    \ in one blow. Zetsu involves keeping one's aura exclusively in the body, it makes a Nen User more\
    \ vulnerable to physical and Nen attacks, because one doesn't have any aura on the outside of one's\
    \ body to protect oneself."
  source_ids: *id003
  decisive: false
  status: unverified
