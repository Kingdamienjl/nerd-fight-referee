  intelligence:
    text: Gifted in general, very skilled in combat (Killua was trained from birth to be one of the world's
      best assassins and was taught an array of assassination techniques, even those of a supernatural
      nature. Killua's intellect far exceeds what a normal boy his age should be capable of, and is smarter
      than most adults. He is also quite knowledgeable on various topics such as technology, gaming, etc.,
      suggesting part of his assassination training was general knowledge. He can formulate accurate predictions
      on his opponent's move and has proved capable of efficiently analyzing hostile capabilities and
      thought patterns. He can devise effective strategies in a matter of instants. Killua's years of
      experience can lead him to pick the best option, and he can keep his cool in dangerous situations.
      He is also highly observant and can pick up on details unnoticed at the subconscious level. Killua
      is capable of devising sophisticated tactics, running accurate simulations, and evaluating the success
      rate of each of them, even in the middle of a fight. His skills in evaluating the assets at his
      disposal and making the most of them are such that Gon and Biscuit were completely dependent on
      him to organize their Greed Island cards. Despite Knuckle being his senior and a combat veteran,
      Killua also presided over the strategic meeting before the invasion of the palace. Killua is skilled
      in various weapons and can improvise with tools of his environment and even turn others' weapons
      into their own demise, as seen against the various Chimera Ants and their attempt to ambush him.
      He even has great skill in using two yo-yos which earned praise from Shoot. He is also an outstanding
      talent in the field of Nen, being able to distribute it with a margin of error lower than 1%, which
      requires the most skill and experience. He is normally regarded as more talented than Gon when it
      comes to Nen control)
    source_ids: *id002
    confidence: 0.95
