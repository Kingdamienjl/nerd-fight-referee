  axis: hax
  text: Base Form (Before Mastering Nen)=Superhuman Physical Characteristics, Power Reading (Killua can
    estimate how powerful a target is with a glance), Master Hand-to-Hand Combatant (Killua is an exceptional
    melee fighter and master of many unarmed combat techniques), Pressure Points (He can knock people
    out with slight grazes to the neck), Acrobatics (Killua has demonstrated exceptional agility, balance,
    and coordination. He can fight extremely proficiently in mid-air), Weapon Mastery (Killua is implied
    to be adept with firearms, and is most adept with yo-yos that weigh fifty kilograms. He is also highly
    skilled at improvisation, as he was able to defeat Bopobo, a man many times larger and taller than
    him, with nothing but liquor and a spark of electricity), Stealth Mastery (Melody stated that Killua's
    footsteps are the quietest she has ever heard, Killua practiced shadowing since the age of three,
    and successfully tailed world-class Nen users such as Nobunaga and Machi without them knowing where
    he was), Accelerated Development (Much like Gon, Killua's potential is described as bottomless and
    terrifying. Intellectually, physically and with Nen, his talent can only be found in one in ten million.
    He can pick up new teachings near-instantly and is considered by his family to have the highest potential
    of them all. He easily caught up with and surpassed a dangerous Nen user such as Binolt after a few
    days of fighting, and during the match with Razor, Biscuit stated that she didn't reach Killua's level
    until she was in her late twenties. Hisoka and Razor also deem Killua to have extremely high potential),
    Body Control (Killua can dislocate and reset his joints on a whim, and can turn his hand into a claw),
    Afterimage Creation and Limited Illusion Creation With Rhythm Echo (Killua can create afterimages
    that can act as decoys, these afterimages can fool strong Nen users like the Bombers), Resistance
    to Electricity Manipulation and Poison Manipulation (Due to his brutal and rigorous training, Killua
    has developed resistance to both electricity and poison, not flinching after being shocked by one
    million volts of electricity and drinking Tonpa's laxatives without any ill effects. Later, he completely
    shrugged off poison from a Chimera Ant soldier), Immense Pain Tolerance (Killua can bear very intense
    physical pain without his physical or mental abilities being impaired. He was tortured by Milluki
    for several weeks straight, found it amusing, and eventually fell asleep. He can withstand one million
    volts of electricity and only feel mild pain. He was able to formulate a plan while being grievously
    wounded by the Ortho Siblings including several organs) |-|Base Form (After Mastering Nen) Heaven's
