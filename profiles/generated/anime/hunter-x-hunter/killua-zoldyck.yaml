- id: claim-weaknesses-951cfdc0
  section: weaknesses
  axis: weakness
  text: "Killua needs to charge himself by absorbing electricity in some manner, which he has done through\
    \ a tazer and electrical sockets, to use his Nen abilities. He can run out of electricity if he overuses\
    \ his Nen powers, forcing him to take additional time to charge up. Kanmuru (Godspeed) has a time\
    \ limit. Due to Illumi's needle, he was initially unwilling to fight those equal or greater to him\
    \ in strength and would retreat unless victory was guaranteed. However, after Killua removed the needle,\
    \ this weakness no longer applies. Zetsu involves keeping one's aura exclusively in the body, it makes\
    \ a Nen user more vulnerable to physical and Nen attacks, because one doesn't have any aura on the\
    \ outside of one's body to protect oneself. Notable Attacks/Techniques: |-|Assassination Techniques=\
    \ Muscle and Joint Control: Killua can dislodge his joints at will in less than a second. He demonstrated\
    \ this ability by dislocating his shoulders, elbows, wrists, and fingers to free himself from Machi's\
    \ strings. *Claws: Killua can turn his hands into a claw-like appearance and utilize them just like\
    \ claws. These claws are sharper than knives and can tear a limb easily. Rhythm Echo (\u80A2\u66F2\
    \u3057\u304D\u3087\u304F, Shikyoku): An assassination art, the Rhythm Echo is a motion that creates\
    \ an afterimage of the body through a varying cadence of steps. There is a total absence of noise\
    \ during the movement and multiple phantoms. Assassin Mode: Killua can enter a state of heightened\
    \ concentration in which he focuses entirely on killing the enemy, preventing himself from hesitating.\
    \ According to him, there is a sensible difference between his power in this state and with his usual\
    \ mindset. *The Snake Awakens (\u86C7\u6D3B (\u3060\u304B\u3064), Dakatsu): He moves his arms with\
    \ incredible speed and cuts everything which comes in contact with. |-|Nen= *Nen: As a Transmuter,\
    \ Killua's most efficient in changing the form of his Nen. As such, Killua developed a Hatsu in which\
    \ he transmutes his aura into electricity. This feat was both inspired and made possible by the years\
    \ of electric shocks he received as a child, both as training against torture and as punishment from\
    \ his older brother Milluki. Killua needs to charge himself by absorbing electricity through a socket\
    \ to use the ability. Killua can use all the basic and various advanced techniques. According to Wing,\
    \ he is a Nen User of outstanding talent being one in ten million. Killua is generally hailed as the\
    \ one with the best control out of the duo, to the point that by the time he confronted Razor he was\
    \ already capable of distributing his aura with a margin of error lower than 1%, which caused Biscuit\
    \ to comment that she reached his degree of mastery only in her late twenties. Despite his lack of\
    \ experience, he can accurately measure how much aura he should employ and in which area in a split\
    \ second, relying solely on the intuitive knowledge granted by his fearsome potential. He quickly\
    \ got ahead of Gon during their training on Greed Island, overcoming his inexperience with sheer insight.\
    \ **Lightning Palm (\u96F7\u638C\u30A4\u30BA\u30C4\u30B7 Izutsushi): As the name suggests, Killua\
    \ can shock an opponent by touching them with his palms. This does formidable damage and temporarily\
    \ paralyze even stronger opponents. **Thunderbolt (\u843D\u96F7\u30CA\u30EB\u30AB\u30DF Narukami):\
    \ Killua is also able to project large bolt of lightning from his hands, striking an opponent with\
    \ electricity from a distance which paralyzes them. **God"
  source_ids: *id003
  decisive: false
