    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range, higher with Nen techniques, Hundreds of Meters with
      weapons
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius combatant (Hisoka is easily one of the most devious and intelligent
      characters in the entire series. Hisoka is an expert tactician and schemer with
      excellent analytical abilities. Though at high personal risk, he succeeded in
      manipulating the Spiders into staying in Yorknew so he could fight Chrollo and
      to forge a fake prophecy in minutes, if not seconds, after receiving the original,
      perfectly replicating its style. While on Greed Island, he managed to trick
      Killua, although both he and Biscuit remained suspicious of him. His aptitude
      for reading others' character and finding common traits allowed him to create
      a personality-based system to determine Nen types. Although he admits it is
      unreliable, he has been correct every time he was seen resorting to it. Hisoka
      is also an exceptional strategist who can formulate winning plans at the very
      start of a confrontation. He frequently puts up an outlandish or even arrogant
      act to fool his opponents into believing he is careless, but he is laying traps
      in actuality. He excels not only at planning but also at picking apart enemy
      strategies, compiling all the available information, coming up with multiple
      hypotheses in mere seconds and the heat of battle, and rapidly adapting to new
      developments. He is a master hand-to-hand combatant, quickly making his way
      up to the 200th floor without a single use of Nen. He frequently defeats his
      foes with trickery, reflecting Gotoh's coins at him as a mere distraction before
      appearing from above and slicing his throat. He is also sadistic and ruthless
      in combat, never relenting unless he feels that he has something to gain from
      his target or if they have the potential to grow further. He even devised a
      successful plan to revive himself from the dead when he was cornered by Chrollo
      Lucifer, with the latter being one of the few characters in the series to make
      a fool of him.)
    source_ids: *id002
    confidence: 0.95
