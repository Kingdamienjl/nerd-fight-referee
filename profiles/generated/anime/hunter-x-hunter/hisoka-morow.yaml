- id: claim-powers-and-abilities-b438fdac
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Content= *Superhuman Physical Characteristics
    *Genius Intelligence *Enhanced Senses (Detected Kalluto Zoldyck while he was using
    Zetsu. Kalluto''s Zetsu was described as "flawless") *Master Hand-to-Hand Combatant
    (Hisoka can fight on par with Chrollo Lucilfer and can fight entire crowds. He
    is superior to the likes of Gotoh, who is in turn vastly superior to Canary, who
    at the age of 13 was able to singlehandedly defeat a group of armed bandits even
    without Nen) **Acrobatics *Nen Manipulation (Transmuter; Hisoka is an extraordinarily
    talented Nen user of prodigious talent. He can use the four basic and all of the
    advanced techniques. His aura is described as ominous and eerie even in Ten) **Limited
    Inorganic Physiology (Hisoka has replaced his lost hand, leg, and parts of his
    face with Bungee Gum and Texture Surprise) **Transmutation & Adhesive Manipulation
    (Hisoka can turn his aura into a sticky elastic substance called Bungee Gum) ***Surface
    Scaling (Hisoka can walk on walls with Bungee Gum) ***Resurrection (Hisoka can
    use Bungee Gum to restart his heart, resuscitating him) ***Attack Reflection (Hisoka
    can deflect projectiles back at his opponent. He was able to launch Razor''s ball
    right back at him and sent all of Gotoh''s coins back at him) **Limited Illusion
    Creation (With Texture Surprise, Hisoka can manifest imagery to change its appearance
    and texture. He claims he can replicate over 1,000 textures and can fool Nen users
    of the Spider''s calibre) *Accelerated Development (Battle; Hisoka is considered
    to be a Nen prodigy, learning the basic principles in a few weeks when it would
    take an average person a year to learn Ten. During his fight with Moritonio he
    displayed the ability to use Gyo despite never being taught that, and quickly
    developed his signature Nen ability, Bungee Gum, on the fly and defeated Moritonio
    with it) *Enhanced Fear Manipulation (His aura is described as disgusting and
    scary and his aura terrified Gon and Killua and would have killed them had Wing
    not got involved) *Weapon Mastery (Hisoka is highly adept with using playing cards
    as weapons and has never been shown to miss in the entire series. He was also
    able to create a makeshift flail and wielded it skilfully enough to harm Chrollo)
    *Stealth Mastery (Was able to remain hidden from Killua, Amane, and Tsubone, who
    are all highly skilled assassins. Snuck into the Hunter''s Association HQ and
    assassinated Teradein without being seen) *Immense Pain Tolerance (Was smiling
    despite having broken all of his fingers. Did not mind losing both arms to Kastro.
    Didn''t notice that his leg was blown off) }}'
  source_ids: *id003
  decisive: true
