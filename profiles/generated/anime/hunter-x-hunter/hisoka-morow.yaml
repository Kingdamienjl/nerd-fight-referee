- id: claim-weaknesses-f68508af
  section: weaknesses
  axis: weakness
  text: Overconfident, Cocky, and Sadomasochistic. Above all, Hisoka loves a good
    fight and will prolong it to have as much fun as possible. His love is so great
    that he is even willing to allow his opponents time to prepare in a fight against
    him. However, as of the Dark Continent arc, this no longer applies. After suffering
    a humiliating defeat at the hands of Chrollo, Hisoka has now stopped playing around
    and is currently on the rampage. Hisoka is also a sadomasochist and takes visible
    pleasure from feeling physical pain. His immense pain tolerance can be used against
    him, as Hisoka failed to notice his leg was blown off by Chrollo's Sun and Moon.
