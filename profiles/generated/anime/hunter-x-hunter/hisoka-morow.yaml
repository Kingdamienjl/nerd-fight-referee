  attack_potency:
    text: Multi-City Block level (Superior to Bonolenov. As the third strongest Troupe
      member physically, he should be comparable to Uvogin and Phinks. Hisoka was
      stated to have defeated a Troupe member at some point and killed Single-Star
      Blacklist Hunter Bushidora easily. He should be able to fight those who can
      hurt him. Defeated Gotoh, one of the strongest butlers of the Zoldyck family,
      relatively easily. Could fight relatively evenly with Chrollo Lucilfer despite
      being at a massive disadvantage. When scouting for potential opponents in the
      Hunter's Association, the only ones that interested Hisoka were the Zodiacs,
      and Kanzai has stated that each Zodiac is above the likes of Morel and Knov),
      up to Small Town level with Ryu and Ko
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Hypersonic+ with High Hypersonic reactions (Blitzed Gon in their fight in
      the Heaven's Arena. Far superior to Uvogin in terms of speed. Gotoh was unable
      to keep track of him. Can easily keep up with members of the Zoldyck family
      and stronger members of the Phantom Troupe)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class 100 (Physically stronger than Killua. Can casually tear off
      heads, Ranks third in arm-wrestling in the Troupe, behind only Uvogin and Phinks.
      Effortlessly lifted five humans and used them as a human hammer to fend off
      a crowd. Casually restrained Machi Komacine with his Bungee Gum), possibly Class
      K
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Multi-City Block level (Casually sent a large stone tile crashing explosively
      into an audience stand with a single kick, Can throw a ball with so much force
      that Razor's Nen puppets were forced to combine to catch it, even though each
      doll is strong enough to redirect Razor's pass. Easily slit Gotoh's throat open),
      up to Small Town level with Ryu and Ko
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multi-City Block level (Successfully caught and redirected a ball launched
      by Gon's Rock and redirected by Razor, Was relatively unscathed by an attack
      from Chrollo. Chrollo is capable of decapitating people with a single chop.
      Tanked an explosion that made a large crater in the Heavens Arena stadium),
      up to Small Town level with Ryu, Ko and Bungee Gum
    source_ids: *id002
