  intelligence:
    text: Extraordinary Genius (Meruem was able to speak before even being born. Meruem possesses immense
      memory and analytical skills, being able to learn and master nearly anything he comes across in
      a short period. He defeated world champions at various games just after reading a rule book and
      playing a few matches. He is capable of examining multiple scenarios in a matter of seconds. He
      excels at identifying his opponent's "rhythm," the unconscious bias that guides their choices, and
      at disrupting it or turning it against them, not only gaining insight into their thought process
      but also managing to exploit it for his benefit. Playing Gungi with Komugi elevated his pattern-recognition
      skills to an ability similar to precognition. Thanks to this faculty, he was able to penetrate Netero's
      otherwise impregnable defense, even predicting what body parts he would be able to cut off in advance)
    source_ids: *id002
