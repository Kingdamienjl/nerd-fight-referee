  stamina:
    text: Superhuman; Is unfathomably superior to any rookie Hunter, who can run 80 Kilometers across
      different terrains without breaking a sweat. Meruem defeated the Shogi and Go champions of East
      Gorteau without resting between matches and did not show the slightest hint of physical or mental
      fatigue even after playing Gungi with Komugi for three days straight. He was so engrossed in their
      games that he apparently ate nothing for six days and still seemed unaffected. As stated in durability,
      Meruem was able to take thousands of attacks from Netero with minimal damage to his person while
