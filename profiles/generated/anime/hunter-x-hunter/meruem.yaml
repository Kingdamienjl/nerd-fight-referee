- id: claim-weaknesses-c4ad50d4
  section: weaknesses
  axis: weakness
  text: "After meeting and making close bonds with Komugi, he slowly lost his cruel and violent nature\
    \ and was implied to try to coexist peacefully with humans. Zetsu involves keeping one's aura exclusively\
    \ in the body, it makes a Nen user more vulnerable to physical and nen attacks, because one doesn't\
    \ have any aura on the outside of one's body to protect oneself. | Same as before, Meruem suffers\
    \ poisoning from the Miniature Rose Bomb and will slowly die after an extended period because of it.\
    \ Notable Skills/Techniques: Nen: Meruem is the most powerful Nen user in the series, being able to\
    \ use all the basic and advanced techniques to vast degrees. He is an Emitter and likely highly proficient\
    \ in every single Nen category. However, due to his overpowering nature, he doesn't even need to create\
    \ his own Hatsu, which is unfortunate given his infinite potential. *Aura Synthesis: Meruem's initial\
    \ ability gives him strength through consumption. Meruem's aura grows every time he devours a user\
    \ of Nen, with their aura synthesizing to his own. Upon consuming two of his royal guards, Pouf and\
    \ Youpi, he gained some of their Hatsu. The amount of someone's body he needs to consume to do this\
    \ is unknown, although it is likely he must absorb much of their aura to obtain their Hatsu. After\
    \ Absorbing Shaiapouf and Menthuthuyoupi: *Metamorphosis: Meruem can give himself wings, extra eyes,\
    \ and limbs, and even recompose his entire body structure utilizing aura. *Rage Blast: Meruem can\
    \ use Menthuthuyoupi's ability to use \"Rage\" in a concentrated blast of aura. *Photon: He can use\
    \ and evolve Shaiapouf's ability of Spiritual Message. This secondary ability allows him to transmute\
    \ his aura into photons. Each photon maintains his aura, allowing Meruem to measure the shape, quality,\
    \ emotion, and other informational contents about the photons interact with. As stated by Welfin and\
    \ Shaiapouf, he can know everything vaguely, even lies. The precision of the information he can gather\
    \ depends on the number of photons directed at the object of interest. Meruem deploys these photons\
    \ in his En in a flash and then can instantly go to anything the photons reach. Note: It's possible\
    \ that after absorbing Pouf and Youpi, Meruem gained their powers, as he showed he is capable of using\
    \ some of their abilities on a much better scale. ==Gallery== Meruem appearence 2011.jpg|Meruem's\
    \ design in the anime 125 - Meruem retaliates.png|Meruem's aura Netero-x-Meruem-3.gif|Meruem vs. Netero\
    \ Meruem's En.png|Meruem's En Meruem knocking out Knuckle.png|Meruem incapacitating Knuckle Meruem's\
    \ aura synthesis.png|Aura Synthesis 130 - King's wings.png|Metamorphosis IMG 1260.PNG|Rage Blast Photons.jpg|Photon\
    \ ==Notable Matchups== Victories: *Shantae (Shantae (Verse)) Shantae's Profile (Speed was equalized.\
    \ Low 7-B form was used, Shantae had prior knowledge on Meruem, while Meruem had basic knowledge on\
    \ Shantae) *Gon Freecss (Hunter X Hunter) Gon's Profile (Speed was equalized. Pre-Rose Meruem and\
    \ Adult Gon was used) *Jed (Hunter X Hunter) Jed's Profile (Meruem had a basic knowledge of Jed's\
    \ blood) *Yuji Itadori (Jujutsu Kaisen) Yuji's Profile (Speed was equalized. Pre-Rose Meruem and Shinjuku\
    \ Yuji were used, starting range 20 meters) Losses: Inconclusive: *Twenty-Fifth Baam (Tower of God)\
    \ Twenty-Fifth Baam\u2019s Profile (Speed equalized and 7-B versions were used) ==References== {{Reflist}}\
    \ ==Notes/Explanations== {{discussions}} Category:Characters Category:Hunter X Hunter Category:Anime\
    \ Characters Category:Antagonists Category:Anti-villains Category:Aura Users Category:Berserkers Category:Biology\
    \ Users Category:Body Control Users Category:Chi Users Category:Chimera Ants Category:Clairvoyance\
    \ Users Category:Death Users Category:Devourers Category:Duplication Users Category:Empathic Manipulation\
    \ Users Category:Enhanced Senses Users Category:Energy Users Category:Fear Users Category:Flight Users\
    \ Category:Geniuses Category:Honorable Characters Category:Insects Category:Intangibility Users Category:Invisibility\
    \ Users Category:Kings Category:Leaders Category:Light Users Category:Longevity Users Category:Madness\
    \ Users Category:Male Characters Category:Manga Characters Category:Martial Artists Category:Mind\
    \ Users Category:Monsters Category:Neutral Characters Category:Non-Physical Interaction Users Category:Paralysis\
    \ Users Category:Photographic Memory Users Category:Poison Users Category:Power Absorption Users Category:Power\
    \ Bestowal Users Category:Primary Antagonists Category:Psychometry Users Category:Rage Users Category:Reformed\
    \ Characters Category:Royal Characters Category:Self-Destruction Users Category:Shapeshifters Category:Size\
    \ Users Category:Statistics Amplification Users Category:Stealth Masters Category:Stinger Users Category:Tail\
    \ Users Category:Telepaths Category:Teleportation Users Category:Transformation Users Category:Transmutation\
    \ Users Category:Villains Category:Wise Characters"
