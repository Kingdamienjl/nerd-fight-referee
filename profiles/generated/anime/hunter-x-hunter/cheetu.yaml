  section: weaknesses
  axis: weakness
  text: Extremely overconfident and relies far too much on sheer speed. His Nen abilities are virtually
    useless against opponents of comparable strength and skill. If he is caught in Tag, he can never use
    the ability again. Zetsu involves keeping one's aura exclusively in the body, it makes a Nen user
    more vulnerable to physical and Nen attacks, because one doesn't have any aura on the outside of one's
    body to protect oneself.
