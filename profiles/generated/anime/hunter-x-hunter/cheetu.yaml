  intelligence:
    text: Average (Thanks to his sheer speed, Cheetu is an incredibly dangerous hunter and fighter, even
      by Chimera Ant standards. However, his lethality is hampered greatly by his over-reliance on his
      speed. He is noted by Morel Mackernasey to be extremely foolish and reckless. Cheetu's overconfidence
      in his speed makes him feel like he has no need for planning or even focuses much on his opponents.
      He possesses little to no analytical skill and does not even pay attention to his surroundings,
      and is also unable to gauge his opponents' strength, as seen when he foolishly challenged Zeno Zoldyck
      to a fight. He also needed additional assistance from Shaiapouf in creating a Nen ability and has
      demonstrated a lack of insight and thought when creating a Nen ability as both of his abilities
      do not suit his fighting style. For example, the "Tag" ability has a play-time set at a maximum
      of 8 hours, which turns the game into a battle of patience rather than one of speed and urgency
      as he had intended; and it also does not help when Cheetu himself is highly impatient. Also, when
      he came up with the ability to conjure a "Crossbow and Claws" in the midst of battle as a desperate
      measure to keep his opponents from touching him to end his game of Tag, it did not cross his mind
      that the arrows move vastly slower than himself and are thus easily blocked by his opponent who
      has grown accustomed to his speed, which ultimately renders the ability pointless)
    source_ids: *id002
