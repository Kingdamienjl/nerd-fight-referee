  intelligence:
    text: Genius. Pariston is arguably one of the most intelligent characters of the series, matching
      Ging in terms of intellect. As a Triple-Star Hunter, he must have made significant contributions
      or made revolutionary breakthroughs in his field, and is one of the few Hunters to hold the prestigious
      Triple-Star ranking. During the 13th Chairman Election, he managed to rank first in all rounds but
      one, although he had a sizeable advantage, to begin with; nonetheless, that advantage was obtained
      by manipulating the Hunter Association during his three years as Vice Chairman without even Netero
      or the Zodiacs being capable of stopping him. He identified a path to victory for Ging in the election
      that the Boar himself seemed not to be aware of, namely making it about his son, as soon as the
      two spoke about Gon before the election even began. When Ging allowed Leorio to take his place in
      the race, however, Pariston was immediately able to spot his chance and waited for Leorio's friends
      to save Gon so he would have no motivation to become Chairman. His final attempt to win the election
      also proved Ging's prediction that he would keep stalling until the next Hunter Exam. He repeatedly
      outsmarted the other runner-ups, including Cheadle, whom he himself deems superior in terms of procedural
      skills, and surprised even Ging with his sudden abdication. He was the mastermind behind the admission
      of Beyond's followers into the Hunter Association. He is known for being extremely charismatic,
      and has very strong influence not just within the Hunter's Association but seemingly with world
      leaders as well.
    source_ids: *id002
    confidence: 0.95
