  intelligence:
    text: Gifted (Despite his struggles with academic proficiency, such as math, Gon
      is emotionally intelligent, figuring out Palm's entire personality traits from
      his few interactions with her thanks to his broad experience interacting with
      many different kinds of people throughout his travels — including women. Wing
      described his talent as one in ten million, learning and eventually mastering
      techniques like Ten in a matter of minutes, whereas Zushi, despite being a prodigy,
      takes weeks. Gon has proven to be remarkably cunning and skilled in combat.
      Gon defeated Riehlvet with relative ease by throwing a massive stone tile and
      using a person's natural psychology as an advantage to ambush them. During his
      battle with Gido, Gon was capable of determining the exact ruleset Gido gave
      his tops simply by watching one of them move on its own, quickly learning how
      to avoid them by using Zetsu, and dodging the patterns of the tops, which had
      previously been described as being incredibly complex and unpredictable even
      for Gido himself. Despite his hatsu's apparent weakness, Gon was capable of
      overcoming it by utilizing its overwhelming power and his opponent's knowledge
      to his advantage, luring them in as he charged a fake version of his Hatsu to
      counterattack the moment they attempted to break his stance. Gon has also repeatedly
      outwitted people with far more experience than him, such as Hisoka, a battle
      genius, and Knuckle, who has participated in over 5000 battles. Gon has often
      astounded allies and opponents alike with his astounding ability to think outside
      the box and find a new perspective to look at a problem and solve it. He demonstrated
      this ability twice during the Third Phase of the Hunter Exam, blowing out Sedokan's
      candle instead of looking after his own and choosing the long path to the goal
      only to break down the wall separating it from the short one sidestepping Lippo's
      forced choice. Instead of fighting Nobunaga, he applied his ostomy knowledge
      to find an alternative way of escape. He auctions off items to raise a profit
      before attending the auction as the buyer. Later, they seek to be hired by Battera
      instead of purchasing Greed Island. He also has a good memory, which allowed
      him to win the quiz to obtain the Ruler's Blessing. He is also fairly intuitive
      and, when intensely focused, has occasionally shown the ability to think faster
      than the likes of Killua and Morel by cutting out everything that is not relevant.
      Gon's exceptional capacity for lateral thinking extends to battle tactics, making
      him wholly unpredictable. He managed to surprise Netero three times during their
      ball game. He designed the plan that allowed Kurapika to abduct Chrollo. His
      willingness to take significant damage to land a critical hit would have allowed
      him to defeat Genthru without relying on Killua's plan had the latter not been
      saved by a lucky coincidence. When fighting Hollow and Bat, he used his good
      analytical skills to figure out how their coordinated attacks worked and overcome
      them)
