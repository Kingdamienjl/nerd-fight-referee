    the emission systems in Greed Island therefore he is the reason why most of the spell cards function.
    His presence alone intimidates all the other death row convicts to stay in line, with each prisoner
    being capable of using Nen as well), Flight (Causes all the flight spell cards to function), Energy
    Projection (Razor is an emitter. He is able to emit his aura in the form of a highly destructive red
    orb, he can also create and summon eight anthropomorphic Nen Beasts, which he calls Devils), Fusionism
    (Razor's Nen beasts can combine to create a more powerful beast), Teleportation and BFR (With the
    card Eliminate, Razor can banish people from Greed Island)
