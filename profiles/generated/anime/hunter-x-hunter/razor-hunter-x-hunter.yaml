      of fighting him. Casually destroyed a boat with a single spike. Ging Freecss acknowledged his strength,
      as did Biscuit Krueger and Hisoka. His ball throws are comparable to Gon's Rock. One of his Nen
      Beasts were able to harm Hisoka with a Shu-enhanced dodge-ball), up to Small Town level with Ryu
      and Ko (Wasn't damaged by Gon's Fully Charged Jajanken while guarding with Ryu)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Hypersonic with Hypersonic+ reactions (Razor is able to throw the ball so fast that the likes
      of Killua, Biscuit, and Hisoka have trouble keeping up)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 100
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Multi-City Block level (His throws are comparable to Gon's imperfect Rock. At full strength,
      he is able to match a full-powered Rock in power and required the combined efforts of Gon, Killua,
      and Hisoka to catch it. A ball redirected by Razor pushed Hisoka's Bungee Gum to its limits), up
      to Small Town level with Ryu and Ko
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Multi-City Block level, up to Small Town level with Ryu and Ko (Took little damage after receiving
      Nen powered dodge-ball from Gon and managed to redirect the ball after being hit by a full-powered
      Rock from Gon)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman. As a Game Master, he is deemed to be far superior to most Pro Hunters, who in turn
      are far superior to those who take the Hunter's Exam, which involves running over 80 kilometers
      across different terrains. Razor is a highly skilled sportsman, and excels at any sport, be it throwing,
      passing, catching, etc. Threw several balls at the same level of an imperfect Rock and used Ko at
      least three times without showing any signs of fatigue.
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range normally, higher with Nen Techniques, Dozens of Metres with Shu-enhanced
      objects, Planetary with Greed Island Systems and Eliminate Card (Razor is causes all the emission
      systems on Greed Island including the teleportation from anywhere on the varying continents onto
      Greed Island. Eliminate also teleports people from Greed Island to anywhere on the Azian Continent)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Above Average. He is an extremely skilled sportsman and Nen User. He is experienced enough to
      instantly determine which ones were the filler in Gon's alliance, and also realised why the group
      was throwing their matches the first time around. His skills are such that Biscuit was impressed
      by his timing and his technique, which were described to be perfect.
    source_ids: *id002
