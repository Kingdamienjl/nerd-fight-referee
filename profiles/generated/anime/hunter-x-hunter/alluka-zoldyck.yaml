- id: claim-powers-and-abilities-b8fd5a42
  section: abilities
  axis: hax
  text: 'Alluka is just a normal child while in this state, Multiple Selves (Type
    1; Nanika exists within her) Nanika (Something)=Possession (Nanika possessed Alluka),
    Nen Manipulation (Nanika''s Wish Granting is through Nen), Wish Granting (Nanika
    can grant wishes; the degree of wishes is limitless according to the Zodiacs,
    ranging from slightly levitating others to manipulating probability and reality):
    Telekinesis (Can levitate people in the air, crush them until only blood drops
    remain and wring them. The possible consequences of a wish to lift a powerful
    Nen contract could number in the tens of thousands being killed according to Illumi),
    Death Manipulation (Should her requests not be fulfilled, the person and their
    loved ones will die instantly. Nanika can also kill by being asked to), Creation/Summoning
    (Made a billion dollars rain from the sky), Healing (At least Low-Mid. Was able
    to heal a mangled Gon), Curse and Law, Negation (Lifted Gon''s Vow. Vows or Contracts
    by nature are stricter than Limitations), Teleportation (Teleported Illumi to
    another continent), Durability Negation (Many of Nanika''s abilities ignore conventional
    durability)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
