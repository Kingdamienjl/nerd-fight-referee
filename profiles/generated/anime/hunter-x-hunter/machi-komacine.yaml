    Killua despite being in complete darkness. Her eyes can adjust to complete darkness in a few seconds),
    Skilled Hand-to-Hand Combatant, Intuition (According to Chrollo and Nobunaga, Machi's hunches are
    often accurate. Her feeling that Uvogin was dead and that Gon and Killua were connected to the "Chain
    Dude" proved to be correct, even when Gon and Killua themselves did not know about Kurapika's involvement
    with the Phantom Troupe), Photographic Memory, Thread Manipulation, Limited Healing (Machi can completely
    re-attach severed limbs, down to each vein), Body Puppetry (She can use her threads like a puppeteer
    and control the movement of bodies), Body Control (Machi can contract her muscles to make it so that
    Killua couldn't reach her vital organs and to prevent him from retrieving his hand), Immense Pain
    Tolerance (Was unaffected by having multiple fractured ribs)
  source_ids: *id003
  decisive: true
