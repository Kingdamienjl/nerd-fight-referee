- id: powers-and-abilities-resistant-to-all-types-of-magic-and-remain-virtually-untouc
  name: 'resistant to all types of magic, and remain virtually untouched by them.
    File:ZeldrisGod2.png|Sealed Drole''s magic File:'
  description: 'resistant to all types of magic, and remain virtually untouched by
    them. File:ZeldrisGod2.png|Sealed Drole''s magic File:ZeldrisGod1.png|using his
    Demon King-granted power Hellblaze: Zeldris can generate the black purgatory fire
    of the Demon Clan, capable of nullifying the regeneration of immortals like Ban.
    Hellblaze can be coated on Zeldris'' body or weapon to enhance his strikes. He
    can generate large area-of-effect explosions, which he used to destroy Stigma''s
    Light of Grace tower. He can also shoot blasts of fire from his hands, which he
    used to attack Merlin through her viewing gem. The black fire cannot be put out
    normally, and was able to burn down the Fairy King''s Forest despite the Forest
    being immune to natural fire. File:ZeldrisHellblaze2.png|Fires a blast from his
    hand File:ZeldrisHellblaze5.png|Releases an area-of-effect explosion Ominous Nebula:
    is a technique of extreme concentration were Zeldris rotates his darkness at immense
    speeds, creating a vortex that surrounds and attracts all living beings around
    him. This power makes the air flow and creates a vacuum and everything that comes
    in contact with it is sliced at a god-like speed by pure reflexes, making this
    technique a Full React. Even Ludociel, the leader of the Four Archangels, states
    that the speed of this technique surpasses his Grace, Flash. Zeldris using Ominous
    Nebula.png|The vacuum draws people in... 0008-0009.png|then sends them away flying
    PhotoEditor-20190109000105.jpg|The Barrier of Darkness surrounding Zeldris Indura
    Transformation: As a demon with a power level over 50000, Zeldris has access to
    the Indura Transformation. Upon sacrificing six of his seven hearts, Zeldris can
    transform, considerably increasing his stats, but losing his original form and
    ability to reason. He has never used this ability, however, as it is a final resort.
    Sealing: Zeldris sealed away the Vampire Clan instead of killing them because
    of his relationship with Gelda. thumb|300x300px|centre|Sealed the Vampire Clan'
