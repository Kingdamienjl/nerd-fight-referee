  intelligence:
    text: 'General= Average (Shinji has had a fairly average experience regarding his formal education,
      with any shortcomings in school being the result of his emotional trauma or time spent serving NERV.
      Even so, he managed to recall Asuka''s brief explanation on thermal expansion during the battle
      with Sandalphon, immediately realizing what the latter had to do given the circumstances of that
      battle. Additionally, Shinji is a very talented cello player, continuing to practice despite no
      longer taking lessons) |-|Combat= Gifted (Although Shinji''s emotional trauma and avoidant tendencies
      were initial obstacles to his performance, he would quickly go on to prove his capability as the
      Third Child. Even during his second ever fight against an Angel, he had enough precision to dodge
      and catch Shamshel''s Whips of Light at a very close range, the likes of which had unpredictable
      and swift movements in combat. Upon becoming a pilot, he received training from NERV that would
      enable him to properly utilize the arsenal and unique abilities of the Evangelion. While operating
      an unarmed Unit-01, Shinji has displayed a high degree of agility in combination with hand-to-hand
      combat, allowing him to swiftly evade harm from, and overwhelm his opponents. Regarding armed combat,
      he wields a knife as well as handguns, assault rifles, and sniper rifles, to which he has shown
      noteworthy marksmanship, such as when he landed a multitude of shots into Matarael from an incredibly
      far distance away. After preparing for the battle against Israfel, Shinji could move in perfect
      sync with Asuka, both in and outside of their Evangelions. This ultimately led to them defeating
      the aforementioned Angel in under a minute) Standard Tactics: |-|Shinji Ikari= In the rare moments
      where Shinji has been "combative" outside of an Evangelion, he has a preference for attempting to
      choke out his opponents. |-|Evangelion Unit-01= Shinji uses the Pallet Rifle for most of Unit-01''s
      long ranged attacks. In certain scenarios where a one-handed firearm is preferred, such as when
      he was using a building as cover against Leliel, he will opt for using his handgun instead, and
      even attempted to use point-blank shots when the aforementioned Angel had gotten too close. In melee
      encounters, Unit-01 will take advantage of the Progressive Knife along with its excellent agility
      to utilize close-quarters combat. The A.T. Field is used for defensive and long-ranged offensive
      options. |-|Berserk Evangelion Unit-01= Enters a bloodlusted state in which Unit-01 becomes more
      feral, often tearing, crushing, and slicing the limbs of opponents before laying continuous, brutal
      blows as a follow up. However, this more violent state does not make Unit-01 a less effective fighter.
      Against Sachiel, the Eva still efficiently used its agility to close the distance and land a physical
      strike, as well as opting to erode the Angel''s A.T. Field. When fighting Zeruel, Unit-01 began
      eating the Angel to consume the S2 Engine. |-|God Evangelion Unit-01= Unit-01 still uses close-quarters
      combat, but now has access to and utilizes much greater abilities. While wielding the Spear of Longinus,
      he will fire off waves that can cause targets to explode or be petrified. Shinji can also use a
      now superior A.T. Field to form wings and nullify all forms of energy and matter. Using the Anti
      A.T. Field, Unit-01 has released enormous shockwaves and reduces life on a global scale to LCL.'
