- id: claim-weaknesses-32bd56d7
  section: weaknesses
  axis: weakness
  text: 'The speed of his Decay is much slower if he uses less than five fingers.
    Notable Attacks/Techniques: Decay: Tomura''s Quirk allows him to disintegrate
    whatever he touches with all five fingers. It will take effect whether the target
    is organic or not. The disintegration spreads quickly and will spread through
    the victim''s whole body if they don''t amputate the decaying body part. His Quirk
    can even spread beyond what he''s touching, allowing him to instantly disintegrate
    large groups of enemies. Because the Quirk has to touch a solid object to be activated,
    it is possible to counter it by manipulating fluids or particles, such as Snatch''s
    sand body. During his battle against Re-Destro, Tomura''s Quirk underwent what
    Re-Destro describes as a reawakening that bolsters the effectiveness and reach
    of Decay. Allowing him to not only whither away his targets without needing all
    five fingers, a feat displayed when Tomura used his two remaining digits to partially
    damage Re-Destro''s giant pointer after the latter destroyed three of Tomura''s
    own fingers on his left hand, albeit the effect was much slower and weaker compared
    to when Tomura uses all five of his digits. But to deteriorate anything his power
    touches even when it doesn''t directly connect with certain abstracts that he''s
    using it on, like when several people he never made physical contact with were
    disintegrated and again when nearly all of Deika City and everything in it was
    reduced to dust in one go using his one good hand. Shigaraki Weakened Decay.gif|Short-range
    Decay Shigaraki Full Power Decay.gif|Widespread Decay ==Notable Matchups== Victories:
    Losses: Inconclusive: {{Discussions|Tomura Shigaraki}} Category:Characters Category:Criminals
    Category:My Hero Academia Category:Male Characters Category:Manga Characters Category:Anime
    Characters Category:Evil Characters Category:Tragic Characters Category:Terrorists
    Category:Antagonists Category:Primary Antagonists Category:Villains Category:Humans
    Category:Leaders Category:Psychopaths Category:Brawlers Category:Martial Artists
    Category:Corrosion Users Category:Deconstruction Users Category:Acrobats Category:Supernatural
    Willpower Users Category:Fear Users Category:Social Influencers Category:Stone
    Walls Category:Misanthropes'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
