- id: claim-weaknesses-767b9f90
  section: weaknesses
  axis: weakness
  text: 'Overusing one aspect of his power will cause him to overheat or lower his body temperature to
    dangerous levels. Using his strongest ice attack will cause his body to freeze instantly, significantly
    reducing his overall speed. According to Stain, Shoto relies on his Quirk too much in-combat, which
    makes him a careless fighter, although this weakness has been mitigated over time. Phosphor requires
    intense concentration to maintain and time to build up, and losing his focus will cause the technique
    to deactivate. Feats: Created a massive ice structure that dwarfed a stadium, and melted it shortly
    after. Can freeze a whole lake in an instant. His firepower was stated to be on par with Endeavor''s
    by All Might. Is capable of resisting the extreme temperatures of his own Quirk. His Phosphor is capable
    of chilling down even Dabi''s intense Flashfire Fist, which are vastly superior to Endeavor''s. Notable
    Attacks/Techniques: Half-Cold Half-Hot: Shoto''s Quirk grants him the ability to generate fire with
    the left side of his body and ice with the right side of his body. Due to his grudge against his father,
    Shoto''s heavily prefers to use his powers over ice,My Hero Academia Vol. 22 Chapter 203 allowing
    him to freeze entire buildings and any inhabitants caught inside, in addition, to easily dispatching
    the Villain Alliance grunts sent to attack him.My Hero Academia Vol. 2 Chapter 14 The drawback to
    his Quirk arises from his need to maintain his own body temperature. Excessive use of his ice power
    causes Shoto to suffer from frostbite. As a result, the power of his ice attacks wanes if uses them
    for too long without rest. However, Shoto''s can easily solve this drawback with his firepower, using
    his fire to heal himself from the frostbite. *Heaven-Piercing Ice Wall: Shoto creates a humongous
    ice glacier with his powers to restrain or block a target with the sheer volume of ice. This was first
    used against Hanta Sero but proved effective against even Pro Heroes like Eraser Head. The main downside
    to this move is that the amount of ice rapidly lowers his body temperature, forcing him to use his
    fire powers again. He can control the size of the ice wall to some degree. When he used this technique
    against Dynamight, Shoto created a much more controlled version compared to when he attacked Cellophane
    with it. Shoto Todoroki tries to freeze Mr. Compress.gif|Shoto using his Heaven-Piercing Ice Wall
    against Mr. Compress Giant Ice Wall.gif|Shoto using this technique against Eraser Head (Anime) Giant
    Ice Wall.png|Shoto using this technique against Eraser Head (Manga) *Wall of Flames: Shoto uses his
    left side to generate a burst of flames that covers a large area. This is both a defensive and offensive
    attack similar to his Heaven-Piercing Ice Wall technique. It can be used to attack multiple opponents
    and create space between Shoto and his target. Wall of Flames.png|Shoto using his Wall of Flames against
    Real Steel *Flashfreeze Heatwave: Shoto cools the air around him with his ice powers, then switches
    to his fire and quickly heats and expands the air around him. This allows him to release an overheated
    blast. Izuku and Shoto''s final clash.gif|Shoto using his Flashfreeze Heatwave against Deku Flashfreeze
    Heatwave.png|Shoto using a weaker version of the attack to subdue villains *Flashfire Fist - Jet Kindling:
    A move learned from his father''s signature technique, Flashfire Fist. Shoto concentrates his flames
    into a white-hot point on his fist and punches the opponent. On contact, a violent explosion of flames
    burst out of Shoto''s arm, severely burning his target. Flashfire Fist - Jet Kindling.png|Shoto first
    using the technique against Shigaraki *Phosphor: Shoto circulates both halves of his Quirk throughout
    his body, merging the fire and ice into one ability. This Ultimate Move also serves as a basis for
    other moves Shoto uses. Flashfire Fist Phosphor.png|Shoto first using Phosphor against Dabi *Coldflame''s
    Pale Blade: Using the combination powers of Phosphor, Shoto throws a piece of the conjoined fire and
    ice at his opponent, launching them a great distance backward. Icebound Crash Coldflame Pale Blade.png|Icebound
    Crash *Great Glacial Aegir: Shoto builds up his fire and ice, rushes toward his opponent, hits them
