- id: claim-weaknesses-38c0ba55
  section: weaknesses
  axis: weakness
  text: "Hawks possesses a limited number of feathers, and it takes two days for them to regrow if he\
    \ uses them all. The more feathers he uses, the smaller his wings become, reducing his flight capability.\
    \ He stated that even his Fierce Wings can burn, though it\u2019s unclear whether this is an actual\
    \ weakness or if he was simply implying that they are otherwise difficult to destroy. The injuries\
    \ he sustained from Dabi's flames have weakened him, and he now requires prosthetics to reach his\
    \ former speeds."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
