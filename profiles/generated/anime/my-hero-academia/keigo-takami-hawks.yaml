  intelligence:
    text: Gifted (As the current No. 2 hero, Hawks is a highly skilled fighter, effortlessly taking down
      two Nomu, enemies that usually require several Pro Heroes to handle. He is an expert in the use
      of his Quirk, capable of saving 76 people falling from a destroyed building by sensing vibrations
      in the air and the movements of civilians, and he can accurately control countless feathers. Hawks
      is also highly skilled in deduction; when four heroes lost their Quirks, he deduced that their abilities
      weren't destroyed but stolen by someone with the same power as All For One. Additionally, Hawks
      is an expert in surveillance, having gathered sensitive information about the Hero Public Safety
