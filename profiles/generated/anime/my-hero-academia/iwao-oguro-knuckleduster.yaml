- id: claim-powers-and-abilities-2e7ed136
  section: abilities
  axis: hax
  text: 'O''Clock= Superhuman Physical Characteristics, Expert Hand-to-Hand Combatant
    (Able to outsmart foes as skilled as Stendhal. His skills were considered worthy
    to be copied by Number 6), Skilled Marksman, Acrobatics, Statistics Amplification
    (Overclock stimulates the brain and heightens his senses to the point that time
    itself appears to stand still. On top of that, his perception enables him to move
    at a high speed relative to everything around him, with the world appearing fully
    frozen. This grants him: Perception Manipulation, Sense Manipulation, Enhanced
    Senses, and Social Influencing. As a result of his heightened senses, he can hear,
    see, and think at hyper-speed. His senses are heightened to such an extent that
    he is able to read someone''s subconscious reactions and adjust their responses
    through verbal manipulation) All previous abilities except those he had with Overclock,
    plus: Preparation (When given time he is capable of carefully setting up plans
    and equipment to deal with his opponents), Durability Negation and Paralysis Inducement
    with Taser Knuckle (A powerful taser with enough voltage to stop a person''s heart
    with a direct hit, or bring them down with a slight graze to a limb), Limited
    Animal Manipulation (With pheromone cocktails that attracts bees), Explosion Manipulation
    and Fire Manipulation (Can acquire a variety of bombs, including a type of bomb
    that ignites a special fuel that burns at high temperatures and absorbs all the
    oxygen in the air)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
