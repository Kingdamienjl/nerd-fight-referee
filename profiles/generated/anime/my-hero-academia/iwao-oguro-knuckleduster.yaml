    text: Multi-City Block level+
    source_ids:
    - mediawiki-482933
    confidence: 0.95
  durability:
    text: Multi-City Block level+ (Can withstand the recoil of his own attacks. Withstood
      the Bat Villain crashing into his fist. Can take hits from people comparable
      to him, such as a younger Eraser Head)
    source_ids:
    - vsbattles-iwao-oguro-knuckleduster-my-hero-academia
    confidence: 0.6
  stamina:
    text: Superhuman (He still had enough stamina to fight after his heart was temporarily
      stopped by Kuin Hachisuka. Able to push through pain, to the point Eraser Head
      thought he had a durability-based Quirk)
    source_ids:
    - vsbattles-iwao-oguro-knuckleduster-my-hero-academia
    confidence: 0.6
  range:
    text: Standard Melee Range, up to Hundreds of Meters with Equipment (Has access
      to a sniper rifle and a grappling hook he can use to swing around buildings)
    source_ids:
    - vsbattles-iwao-oguro-knuckleduster-my-hero-academia
    confidence: 0.6
  intelligence:
    text: Above Average (Knuckleduster is a skilled brawler whose tenacity and fighting
      skill allow him to go toe-to-toe with Quirk users despite being Quirkless. Knuckleduster
      has great intuition and tactical knowledge. His hand-to-hand combat ability
      was complimented by the likes of Eraser Head, a specialist in hand-to-hand combat
      and initially mistook Knuckleduster's toughness for a stamina-enhancing Quirk.
      Knuckleduster also has great intuition and tactical knowledge. When fighting
      against Trigger-enhanced villains, he was able to deduce how their Quirks worked
      and the best way to counter them all while locked in a fight with them. He quickly
      figured Stendhal's way of fighting, as well as his state of mind. He formulated
      an elaborated plan that would allow him to defeat Kuin Hachisuka whilst also
      saving the life of his daughter, a plan that ended up succeeding)
    source_ids:
    - vsbattles-iwao-oguro-knuckleduster-my-hero-academia
    confidence: 0.6
