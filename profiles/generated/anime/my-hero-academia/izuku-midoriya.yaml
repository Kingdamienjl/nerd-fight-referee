- id: claim-stamina-99d4b90e
  section: power_scale
  axis: stamina
  text: Superhuman (Deku trains relentlessly, even making exercises during his classes.
    Despite his timid demeanor, Deku has an iron will and will continue to fight for
    as long as he needs to. At the start of his career, he was capable of thinking
    coherently with a broken arm and two shattered legs while falling at terminal
    velocities after obliterating an Executor Bot. Later on he was able to endure
    the agonizing pain of using the full force of One For All many times, when a single
    use of 100% is enough to break the bones in his arm, all while receiving a beating
    from Muscular. He regained his composure shortly after, being able to travel from
    the top of a small mountain to his camp and was still able to keep fighting until
    the crippling pain of his untreated wounds finally forced him to stop. He can
    battle with Pixie-Bob's Earth Beasts for eight hours straight) | Superhuman (Has
    proven to be able to use Full Cowl 100% for several minutes without outside help,
    and has shown to be capable of fully enduring the pain of his broken bones) |
    Superhuman (Can endure having the power of his own smashes being reflected back
    at his limbs, tearing his muscles apart. He kept fighting despite several gaping
    holes being made in his body by laser beams)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-range-25cb537d
  section: power_scale
  axis: range
  text: Standard Melee Range, Varies up to Tens of Kilometers with One For All (Can
    fire wind pressure of varying range depending on the power output. Can destroy
    giant boulders with 5% and 8%, and his 10% and 15% are even stronger. Can unleash
    large wind blasts with 20%, and create even tornadoes. His 100% was able to blew
    away a storm with an enormous shockwave, as well as create a tornado several kilometers
    tall. As strong as All Might, whose strikes could alter the weather), Hundreds
    of Meters with Blackwhip (Covered part of a city block in tendrils. Can easily
    swing around a large bridge)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-standard-equipment-bdafed24
  section: equipment
  axis: equipment
  text: His Hero Costume, which the Support Department specially made to resist wear
    and provide support to his arms and legs, as well as protection to his face with
    a mouthguard. Gamma Costume features upgraded gloves that give additional reinforcement
    to his arms, along with Iron Soles attached to his shoes that protect his feet
    and enhances his kicks with a "double impact". He later requests the Air Force
    Gloves from Hatsume which help him focus wind pressure to utilize it as a concentrated
    air blast. *Optional
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-f1be54dc
  section: power_scale
  axis: battle_iq
  text: Gifted (He has shown to be exceptionally intelligent on several occasions.
    He has also proven to be a quick learner, which has helped him figure out most
    of One For All's mechanisms in a short time period and work around its limitations.
    He has displayed sharp observation and analysis skills, coming up with a plan
    to escape dozens of villains when he was trapped on a boat. It's usually his intelligence
    that has helped him more than his Quirk. Gran Torino even complimented his intelligence,
    saying that Deku is the kind of person who thinks before he acts. His grades are
    one of the highest in his entire class, showing that his constant training with
    One For All doesn't interfere with his studies. Deku also possesses a borderline
    encyclopedic knowledge of heroes, including their Quirks and combat strategies,
    making him resourceful as a result. His time at U.A. High School has helped him
    develop his own signature Shoot Style, allowing him to fight on par against opponents
    with many years of experience) | Gifted (Deku has developed analytical skills
    that allowed him to accurately predict the movements of people like Lemillion,
    who was capable of casually outpacing the majority of Class 1-A. He has also proven
    to be an exceptional strategist, having laid out an entire plan to lure in and
    capture a group of villains who individually, were far stronger than Class 1-A,
    a plan that ended up succeeding) | Gifted (Developed extremely quick in order
    to keep up with Endeavor's training. He learned how to create multiple long-lasting
    Blackwhip strands in one week, when before he could barely hold even a single
    little Blackwhip strand together. Figured out the specifics of Flect Turn's Quirk
    easily and devised numerous forms to possibly get around it. Can deflect and easily
    avoid several homing arrows while carrying someone on his shoulder)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-39f08c2e
  section: weaknesses
  axis: weakness
  text: 'Using 100% of One For All''s power will break the bones of the limb it''s
    used in. While Deku has proven to be able to push through the pain due to his
    monumental stamina, he can only endure the effects of 100% for a few minutes before
    collapsing. Blackwhip can become uncontrollable if he doesn''t keep his emotions
    in check. One For All can potentially be stolen if the thief''s will is stronger
    than the user''s own will. While not harmful, operating at 20% of his power is
    painful enough to limit his movements a bit, making him predictable. He was only
    able to properly control Blackwhip in combat during his training with Endeavor.
    Notable Attacks/Techniques: |-|One For All= One For All: Deku''s Quirk grants
    him access to the accumulated energy of the eight bearers before him, giving him
    a large increase in power. Deku has shown to able to properly control certain
    percentages of One For All, utilizing it to increase his strength, durability,
    and speed. However, if Deku doesn''t distribute One For All evenly throughout
    his body, his limbs can be severely injured by the force of his movements. In
    addition to the physical strength, One For All can pass on the Quirks of the previous
    users, with their powers being vastly enhanced as a result. The first Quirk manifested
    by Deku was Blackwhip, and he has the potential to learn and control five more
    Quirks. *Detroit Smash: A super attack Deku replicated from All Might after inheriting
    One For All. This smash is a straightforward hit focusing One For All''s accumulated
    power into the fist. At 100% it was powerful enough to smash through every floor
    of a multi-story building and bust a hole in the roof. Deku has also demonstrated
    to be able to use this technique with weaker percentages. *Delaware Smash: Deku
    infuses One For All at full power on his fingers, and then flicks them to create
    a strong shockwave, with enough power to generate a fissure in a lake capable
    of dragging many enemies towards its center, making them unable to escape. It
    was later used against Shoto to break through his relentless waves of ice during
    the Sports Festival. **Delaware Smash Air Force: Deku uses his Air Force Gloves
    to fire a compressed air blast towards his opponent. It carries enough power to
    harm and stun Gentle in mid-air, giving Deku enough time to catch up. This technique
    requires at least 20% of One For All''s power to be used, and Deku can shoot up
    to four wind blasts at a time with one hand. *1,000,000% Delaware Detroit Smash:
    The strongest smash in Deku''s arsenal, which consists of activating One For All
    100% during an adrenaline rush and then striking his opponent with a full-swing
    attack. When performing the super move, Deku uses a full-handed Delaware Smash
    and follows with an extremely devastating Detroit Smash. At the climax of his
    battle against Muscular, Deku was able to overwhelm and launch him with enough
    force to create a massive crater on the side of a mountain. Detroit Smash.gif|Detroit
    Smash Delaware Smash.gif|Delaware Smash Delaware Smash Air Force.gif|Delaware
    Smash Air Force 1,000,000% Delaware Detroit Smash.gif|1,000,000% Delaware Detroit
    Smash |-|One For All: Full Cowl= One For All: Full Cowl: This technique allows
    him to wield up to 20% (initially 5%, which was then upgraded to 8%, and later
    to 10% and 15%) of One For All across his whole body, letting the energy flow
    through him instead of concentrating it in a one place. Full Cowl grants him enhanced
    strength, durability, mobility, and speed. It also prevents him from destroying
    his limbs whenever he uses this Quirk. In extreme cases, he can use Full Cowl
    up to 100% at the cost of severe damage to his body. *One For All: Full Cowl -
    5%: Deku''s first state of Full Cowl, developed with the help of Gran Torino.
    This power-up grants Deku enhanced superhuman strength, as well as a higher level
    of mobility that allows him to jump between buildings with ease. With this small
    percentage, Deku can break through steel walls and dodge even bullets. *One For
    All: Full Cowl - 8%: A level of One For All greater than 5%. This increase in
    all his stats allowed Deku to surpass Dynamight''s power and speed during their
    second battle. This boost in strength already makes Deku one of the strongest
    students in his school. *One For All: Full Cowl - 10-15%: At the time of his Hero
    Work-Studies in the Endeavor Agency, Deku manages to rise his normal limit of
    One For All from 8% to 10%, and up to 15%, far improving his physical capabilities
    to new heights, with him now being able to properly control Blackwhip, and using
    it in conjunction with his Air Force to defeat any kind of villains. *One For
    All: Full Cowl - 20%: First wielded against Overhaul, Deku exceeds his limits
    at the time and utilizes 20% of One For All''s power, distributing it across his
    body and giving him a significant boost in strength, enough to be able to produce
    strong shock waves with his attacks. As time went on, Deku was increasingly capable
    of using 20% without needi'
  source_ids: *id003
  decisive: false
  status: unverified
