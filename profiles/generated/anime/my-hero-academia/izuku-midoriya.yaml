  stamina:
    text: Superhuman (Deku trains relentlessly, even making exercises during his classes.
      Despite his timid demeanor, Deku has an iron will and will continue to fight
      for as long as he needs to. At the start of his career, he was capable of thinking
      coherently with a broken arm and two shattered legs while falling at terminal
      velocities after obliterating an Executor Bot. Later on he was able to endure
      the agonizing pain of using the full force of One For All many times, when a
      single use of 100% is enough to break the bones in his arm, all while receiving
      a beating from Muscular. He regained his composure shortly after, being able
      to travel from the top of a small mountain to his camp and was still able to
      keep fighting until the crippling pain of his untreated wounds finally forced
      him to stop. He can battle with Pixie-Bob's Earth Beasts for eight hours straight)
      | Superhuman (Has proven to be able to use Full Cowl 100% for several minutes
      without outside help, and has shown to be capable of fully enduring the pain
      of his broken bones) | Superhuman (Can endure having the power of his own smashes
      being reflected back at his limbs, tearing his muscles apart. He kept fighting
      despite several gaping holes being made in his body by laser beams)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, Varies up to Tens of Kilometers with One For All (Can
      fire wind pressure of varying range depending on the power output. Can destroy
      giant boulders with 5% and 8%, and his 10% and 15% are even stronger. Can unleash
      large wind blasts with 20%, and create even tornadoes. His 100% was able to
      blew away a storm with an enormous shockwave, as well as create a tornado several
      kilometers tall. As strong as All Might, whose strikes could alter the weather),
      Hundreds of Meters with Blackwhip (Covered part of a city block in tendrils.
      Can easily swing around a large bridge)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (He has shown to be exceptionally intelligent on several occasions.
      He has also proven to be a quick learner, which has helped him figure out most
      of One For All's mechanisms in a short time period and work around its limitations.
      He has displayed sharp observation and analysis skills, coming up with a plan
      to escape dozens of villains when he was trapped on a boat. It's usually his
      intelligence that has helped him more than his Quirk. Gran Torino even complimented
      his intelligence, saying that Deku is the kind of person who thinks before he
      acts. His grades are one of the highest in his entire class, showing that his
      constant training with One For All doesn't interfere with his studies. Deku
      also possesses a borderline encyclopedic knowledge of heroes, including their
      Quirks and combat strategies, making him resourceful as a result. His time at
      U.A. High School has helped him develop his own signature Shoot Style, allowing
      him to fight on par against opponents with many years of experience) | Gifted
      (Deku has developed analytical skills that allowed him to accurately predict
      the movements of people like Lemillion, who was capable of casually outpacing
      the majority of Class 1-A. He has also proven to be an exceptional strategist,
      having laid out an entire plan to lure in and capture a group of villains who
      individually, were far stronger than Class 1-A, a plan that ended up succeeding)
      | Gifted (Developed extremely quick in order to keep up with Endeavor's training.
      He learned how to create multiple long-lasting Blackwhip strands in one week,
      when before he could barely hold even a single little Blackwhip strand together.
      Figured out the specifics of Flect Turn's Quirk easily and devised numerous
      forms to possibly get around it. Can deflect and easily avoid several homing
      arrows while carrying someone on his shoulder)
    source_ids: *id002
    confidence: 0.95
