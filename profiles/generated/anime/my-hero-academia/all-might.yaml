      Weakened All Might. Since One For All cannot enhance speed and power separately,
      if Deku was slower than Weakened All Might at this moment, that means he was
      weaker than him as well. Note that Deku wasn''t using 100% when performing this
      feat because he was heavily tired and injured, and was said to be on his last
      legs.18.65 Teratons of TNT), higher with Plus Ultra (Can go beyond 100% of his
      power to surpass his enemies. Overpowered All For One with his United States
      of SmashMy Hero Academia Vol. 11 Chapter 94) | Country level (Can easily pierce
      through Rewind All For One''s muscles using "Blackwhip", harm him using "Shoot
      Style Smash", and stab through his abdomen with "Superacid Injection: Pinky".
      All For One in a younger and more fragile state could survive blasts from Dynamight''s
      Awakened ClusterMy Hero Academia Vol. 40 Chapter 406), higher with Equipment
      (His "Can''t Stop Twinkling" laser beam held All For One in place and requires
      far more energy than any of his other weapons), far higher with Self-Destruction
      (All Might believed this would be enough to revert All For One into a kindergartner,
      whereas it took numerous Cluster explosions from Dynamight to revert him into
      a babyMy Hero Academia Vol. 40 Chapter 409), Can ignore conventional durability
      (Can inject an acid so corrosive it was dissolving away All For One''s body.
      Can shoot a laser powerful enough to nearly burn All For One to nothing)'
