  intelligence:
    text: Gifted (All Might was the top-ranked hero in Japan due to his countless
      acts of heroism, having led multiple operations against massive villain organizations
      and saved innumerable lives during large-scale disasters. He is an expert in
      hand-to-hand combat with intelligence to match his strength, deducing that Nomu's
      Shock Absorption had a limit and overpowering it through repeated blows. Through
      his early career, he obtained enough experience to rival All For One's century
      worth of experience and ultimately defeat him. He personally designed the specifications
      for his Armored All Might suit with the sole purpose of fighting All For One,
      devising creative ways to employ its systems in combat. He was also able to
      successfully provoke All For One into fighting him, despite the villain fully
      knowing the manipulation and how counterproductive it was to his plans)
