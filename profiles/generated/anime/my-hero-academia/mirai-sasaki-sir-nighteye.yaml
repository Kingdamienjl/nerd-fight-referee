- id: claim-weaknesses-6fd36110
  section: weaknesses
  axis: weakness
  text: 'He can only use Foresight once a day at most. Notable Attacks/Techniques Foresight: Sir Nighteye''s
    Quirk activates by first touching a target and then making eye contact with them. Once these conditions
    have been met, Nighteye gains the ability to see the entirety of the target''s future, second by second,
    from one hour to even years beyond present time. Nighteye sees the future like frames of a film, and
    can only see the target from a third-person perspective and sometimes their surroundings. He can only
    activate his Quirk once per 24 hours and it has been shown that the future he sees is 100% accurate.'
  source_ids: *id003
