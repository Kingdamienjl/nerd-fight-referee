- id: claim-weaknesses-3a12183c
  section: weaknesses
  axis: weakness
  text: 'Dynamight has a short temper and is rather arrogant, causing him to forget
    the task at hand in favor of blowing up whatever agitated him,My Hero Academia
    Vol. 2 Chapter 8 however this thought process is completely rectified by the time
    of the Joint Training Arc. He has to keep himself hydrated and warm since he needs
    to sweat in order to produce his explosions, rendering his Quirk virtually powerless
    in extremely cold and dry conditions. Using his most powerful explosions in succession
    results in throbbing pain in his arms and shoulders. Notable Attacks/Techniques:
    Explosion: Dynamight''s Quirk allows him to secrete sweat similar to nitroglycerin
    from his palms and detonate it at will to create explosions. The more Dynamight
    sweats, the more powerful his explosions become. This essentially means that he
    will gradually grow in power through the course of the fight. Dynamight is also
    capable of using small explosions to propel himself and navigate through the air.
    If the situation warrants it, Dynamight is capable of making stronger explosions
    than he normally can, but at the cost of hurting his arms. This problem is addressed
    with the use of his Grenadier Bracers. *Explosive'
  source_ids: *id003
