    These can store Dynamight''s nitroglycerin-like sweat and can be used as regular
    grenades at a later time. These were first used during the Provisional Hero License
    Exam by Chargebolt.My Hero Academia Vol. 12 Chapter 107 *Knee Pads: Very blunt
    metal metallic attachments Dynamight''s knees. They were likely designed to increase
