- id: claim-weaknesses-38e3abbe
  section: weaknesses
  axis: weakness
  text: She can only transform her right arm into a rifle. Although she can increase the power/speed of
    her bullets, this puts her Rifle Arm in risk of jamming. The amount of bullets she can create depends
    on how long her hair is. Her heroic heart prevents her from using lethal force against some of her
    enemies, as noted by Deku that she could've shot him in the back to paralyze him but didn't, and the
    trajectory of her shot towards Overhaul was off by a little bit to avoid killing him.
  source_ids: *id003
  decisive: false
