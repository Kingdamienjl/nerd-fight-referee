  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Alchemy, Martial Arts (Trains regularly
    with his brotherChapter 9 who had initially never beaten him and considered him
    a much better fighter.Chapter 12 While Edward eventually managed to beat Alphonse,
    albeit with a sneak attack,Chapter 15 Alphonse still continued to grow in power,Chapter
    45 enough to compete with fighters such as Scar,Chapter 72 who could previously
    easily defeat him), Unconventional Astral Projection and Immortality (Type 9:
    Alphonse''s body resides beyond Truth''s Gate, and controls the suit of armor
    his spirit is bound to remotely,Chapter 44 and even the destruction of its blood
    seal would not actually "kill" Alphonse''s soul,Chapter 107 but simply force it
    to remain behind at the Gate of Truth), Self-Sustenance (All types. As a suit
    of armor, Alphonse cannot eat, breatheChapter 88 or sleepChapter 43), Inorganic
    Physiology (Type 2, while Alphonse has a consciousness, it resides in a different
    realm, and controls the suit of armor it is bound to remotely), Resistance to
    Pain Manipulation (Cannot feel pain), Chi Manipulation (Does not have ChiChapter
    33) and Extrasensory Perception (His soul could not be sensed by Fu and others
    who normally can), Unconventional Resistance to Mind Manipulation and similar
    abilities (Alphonse''s mind and body reside in a realm different from the one
    the armor he controls is in)'
  source_ids: *id003
  decisive: true
