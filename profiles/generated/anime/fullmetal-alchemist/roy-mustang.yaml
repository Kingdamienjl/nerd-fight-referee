- id: claim-powers-and-abilities-e2755026
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, likely Martial Arts and Weapon Mastery (As a member of the
    military who served in wars, Mustang should have received training in these subjects), Alchemy, Fire
    Manipulation, Explosion Manipulation and Air Manipulation (Mustang's fire alchemy works by creating
    sparks with his gloves, then changing the concentration of the oxygen in the air to favor the fire's
    expansionChapter 5. Mustang typically uses his fire alchemy to cause explosionsChapter 4, but can
    also shoot streams of fireChapter 93 and focus his attacks well enough to target an enemy's vital
    points such as their tongue of eyesChapter 94), Non-Physical Interaction (Fire Alchemy can affect
    gases such as the air and liquids such as waterChapter 38), Minor Healing (Knows healing alchemy,
    though he is not too skilled in it. Stopped his wounds from bleeding by cauterizing themChapter 39),
    Homing Attack (Roy can control the path of his attacks and direct them to specific parts of the enemy,
    such as their eyes or mouth)
  source_ids: *id003
