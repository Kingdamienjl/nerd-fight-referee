  text: Pride often underestimates his enemies. Cannot project his shadows under complete darkness and
    they will be temporarily dispelled by bright flashes of light. If killed enough times, Pride will
    run out of souls to regenerate, causing Pride to be reduced to a another much weaker and defenseless
    tiny fetus-like form, losing both his memories and powers or turn into dust killing him for good,
    although this weakness is somewhat circumvented by Pride being able to absorb souls to replenish his
    Philosopher's Stone energy.
  source_ids: *id003
