- id: claim-weaknesses-d55018c7
  section: weaknesses
  axis: weakness
  text: He is very lazy, and often holds back on his enemies out of being unwilling to go all out, allowing
    weaker enemies to throw him around and land free hits on him, though as the battle goes on he will
    get more frustrated and willing to fight. His reaction speed is inferior to his maximum movement speed,
    and as such he can only use it to move in one direction. Doesn't appear to have the same regenerative
    speed as his siblings, allowing for his enemies to deal more attacks while he's in a state of regeneration.
    If killed enough times, Sloth will run out of souls to regenerate, causing him to turn to dust, killing
    him for good.
  source_ids: *id003
  decisive: false
  status: unverified
