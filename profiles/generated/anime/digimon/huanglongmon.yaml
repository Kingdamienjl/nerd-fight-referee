- id: claim-weaknesses-3517aadc
  section: weaknesses
  axis: weakness
  text: "His armor can be pierced with weaponry made from the same ore as it, but with the extremely rarity\
    \ of such ore, and apparent difficulty forging it into weapons, this can barely be considered a weakness.\
    \ He has been sealed by a certain Angel Digimon in the past. Notable Attacks and Techniques: Overwrite:\
    \ All Digimon can rewrite their data, so that they are able to react to various situations that were\
    \ once problematic for it. This usually causes a gigantic increase in power and sometimes new skills\
    \ and resistances are gained. However, the more emotional the Digimon is, the more violent the overwrite\
    \ becomes. *Taikyoku: Continuously disassembles everything in the Digital World, throughout eternity,\
    \ into the two extremes of light and darkness, driving it into non-existence before long. *Raurava:\
    \ Imprisons its opponent in a B\u01CEo Y\xF9 and crushes it, completely erasing them. *B\u01CEo Y\xF9\
    : Throws an explosive crystal ball. *B\u01CEo Ch\u01D4 (Positron Pulse): Blast the foe with an anti-matter\
    \ attack. *B\u01CEo Chu\xED: Transforms its entire body into a mallet to smash the foe. *-Oukai: Generates\
    \ a gigantic typhoon of an earthflow on the scale of a natural disaster. *Kongou: Emits a wave from\
    \ its mouth which converts the opponent completely into metal, making them unable to move while their\
    \ body rusts, and unable to die until they have completely rusted away. *Kyokurin'o: Attacks his opponent\
    \ with the spiked band on his tail. *Seidouhou: Attacks the opponent with a metal ball marked with\
    \ the kanji for \"Bronze\". *Tekkousou: Attacks with his metal claws. *Phoenix Fire: Spews ultra-high-temperature\
    \ flames from its mouth. *Desolation Blast: Launches dozens of fireballs from his wings, which can\
    \ rain down on foes or destroy things above him. *Sonic Zephyr: Flaps its wings, creating a tremendous\
    \ shock wave. *Blazing Helix: Flaps its wings, releasing a spiral of high-temperature flames. *Kouen:\
    \ Releases a swirl of flames comparable to the prominences which jet out during a solar eruption.\
    \ *Vahnijvala: Bellows out a sound wave that puts those who hear it to sleep. *B\u01CEo G\u014Dng:\
    \ Fires many arrows of light from a crossbow. *Krish\u0144a: A poisonous roar that dissolves anything\
    \ it hits. *B\u01CEo Ku\xED: Spits out a poison-drenched halberd shaped like a cobra. *Adhomukha:\
    \ Blows into its trumpet shell to generate destructive ultrasonic waves or blast enemies with the\
    \ attacks the shell has absorbed. *B\u01CEo B\xE8i: Beats the enemy with its trumpet shell. *Mugen::\
    \ Displays an illusion which generates a dark mist around the opponent, destroying their spirit and\
    \ making them hallucinate. *Kokuhyo:: Generates massive black hailstones that rain on his targets\
    \ to crush and freeze them. *Soury\u016Bha:: Sends out two massive waves of water in the shape of\
    \ twin dragons to attack his opponent. *Krim\xED\u015Ba: Creates six copies of itself to seal its\
    \ opponent in a hexagram barrier before smashing them with its B\u01CEo Ch\u01D4. *Roku Bunshin: Creates\
    \ six clones of itself that tackle the opponent. *B\u01CEo Ch\u01D4: Leaps at the opponent to stab\
    \ them with its B\u01CEo Ch\u01D4. *Soukai: Looses intense thunderbolts from the sky, with divine\
    \ fury. *Aurora Force: Curls its body into a circle, generating an intense burst of lightning. *Lightning\
    \ Whip: Looses an intense thunderbolt. *Asipatravana: Spins like a tornado and slices at the enemies\
    \ with its B\u01CEo F\u01D4, or absorbs the enemy from a distance with its hands. *B\u01CEo F\u01D4\
    : Its hands turn into axes to attack. *Vedhaka: Disappears into a swirl of light in the sky from which\
    \ it fires 108 shining B\u01CEo Sh\u01D0, or breathes flames from its mouth. *B\u01CEo Sh\u01D0: Fires\
    \ the B\u01CEo Sh\u01D0 it creates from its hairs. *Vimohana: Strikes the ground with its B\u01CE\
    o B\xE0ng to create a large shock wave. *B\u01CEo B\xE0ng: Separates its tail into three nunchaku-like\
    \ sections and strikes the foe with it. Note: This profile does not cover his appearance in Digimon\
    \ Xros Wars, as Huanglongmon's appearance in that series was extremely downplayed and does not reflect\
    \ his full abilities."
  source_ids: *id003
