  intelligence:
    text: As one of the most ancient beings in the Digital World, Baihumon is extremely knowledgeable
      about its workings and is responsible for maintaining its harmony. Although he is the youngest of
      the Sovereigns, he is recognized as the strongest among them, implying that he is the most combat-ready
      of them all, attacking foes with spontaneously created balls of metal before tearing his foes apart
      with his claw and spiked tail ring. He is also pragmatic enough to simply turn his opponent into
      a bronze statue and leave them to rust away. However, he is also somewhat proud and arrogant, refusing
      to make allies under normal circumstances and underestimating his opponents as was the case with
      the D-Reaper.
    source_ids: *id002
    confidence: 0.95
