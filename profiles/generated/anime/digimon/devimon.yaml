    \ the opponent. *Raging Darkness: A darkness attack that lowers the opponent's\
    \ resistance to the powers of darkness. *Dark Whisper: Lowers the opponent's spirit\
    \ with sweet words of darkness. *Devil's Whisper: Tempts the opponent with words\
    \ of darkness to confuse them. *Crescent Leaf I: Cuts the opponent apart with\
    \ countless sharp leaves. *Giga Breath: Attacks the foe with a giant fireball.\
    \ *Evil Wing: Devimon can absorb the countless digital data with his wings that\
    \ he can rip up in the arena. *Hell's Contract: Sends a cloud of cursed Digimoji\
    \ at the enemy or summons up a cursed contract to confuse them. *Touch of Evil/Death\
    \ Claw: He can stick his arm into the ground and have it appear from behind the\
