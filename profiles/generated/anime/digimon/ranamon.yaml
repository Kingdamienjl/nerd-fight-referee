- id: claim-weaknesses-5111ca90
  section: weaknesses
  axis: weakness
  text: 'Vain, easy to anger Notable Attacks and Techniques: Overwrite: All Digimon
    can rewrite their data, so that they are able to react to various situations that
    were once problematic for it. This usually causes a gigantic increase in power
    and sometimes new skills and resistances are gained. However, the more emotional
    the Digimon is, the more violent the overwrite becomes. *Rain Stream (Drainin''
    Rain): She creates a cloud that pours down rain or a stream of water to crush
    the enemy.Digimon Reference Book; Ranamon *Jealousy Rain (Dark Vapor): She creates
    an acidic cloud that dissolves the enemy.Digimon Reference Book; Ranamon *Aqua
    Needle (Whipin'' Waves): She manipulates water to attack her foes. Digimon Frontier;
    Episode 15 *Nero Corso (Acid Ink): She sprays corrosive ink from her mouth.Digimon
    Reference Book; Calamaramon *Titanic Charge (Titanic Tempest): She hardens her
    mantle, spins like a drill, and then smashes into the enemy.Digimon Reference
    Book; Calamaramon'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
