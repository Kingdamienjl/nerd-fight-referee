  intelligence:
    text: "Supergenius. (Originally an Archangel that ruled over death, he served under Homeostasis and\
      \ was tasked with watching over the world. After his defeat and the loss of half of his body, he\
      \ gained vast knowledge by replacing the half of his body he lost with a part of the tree of Yggdrasil.\
      \ Orchestrated the beginning of story by creating the Xros Loaders, a Digivice with multiple functions\
      \ such as fusing Digimon into more powerful individuals on the level of the Royal Knights and Seven\
      \ Great Demon Lords, and summoning Humans with great potential while giving his younger brother\
      \ knowledge of the Xros Loader as well as the Shademon Larva, staging a play that depicted the rivalry\
      \ between hope and despair in order to test whether people can overcome the later. Created Tactimon's\
      \ \"Jatetsuf\u016Bjin-maru\" from the data of Susanoomon's \"ZERO-ARMS: Orochi\", a weapon that\
      \ can bisect the Digital World, the \"Jatetsuf\u016Bjin-maru\" having the power to overwhelm more\
      \ than 3 of the Royal Knights, even while sealed the \"Jatetsuf\u016Bjin-maru\" is comparable to\
      \ Lilithmon. Shouldn't be less knowledgable than his anime counterpart, who successfully created\
      \ the Dark Stone which could destroy all dimensions and merge them togetherDigimon Xros Wars: Episode\
      \ 45Digimon Xros Wars: Episode 52, due to both having gained their knowledge from the World Tree.)\
      \ Notable Attacks and Techniques: *Astral Snatcher: Rips a living Digimon's soul from its body with\
      \ his right arm, and sends it to heaven or hell as he pleasesDigimon Reference Book; Bagramon, or\
      \ even places it within another Digimon's bodyDigimon Xros Wars: Chapter 12 \"Xros Shape!! Enjoyment\
      \ In The Human World!?\". *Invisible Snake-eyes: Observes any location within the Digital world\
      \ using his ruby-eye, allowing him to instantly obtain any information he wants to knowDigimon Reference\
      \ Book; Bagramon. Can be used to control the mind and paralyze the body of the targetDigimon Xros\
      \ Wars: Chapter 12 \"Xros Shape!! Enjoyment In The Human World!?\". *Choujigen Storm: Generates\
      \ a dimensional storm anywhere within the Digital World through which he stretches his right arm\
      \ to attack the opponent. Can blow opponents to another dimensionDigimon Xros Wars: Episode 29."
    source_ids: *id002
    confidence: 0.95
