    all the powers of those effected by it), Conceptual Manipulation (Life and Death. Mother Eater also
    has the ability to destroy concepts entirely), Incorporeality. Weather Manipulation, Can summon avatars
    to fight alongside it, Resistance to Death Manipulation (The concept of death has no meaning to him
    and has complete control over life and death), Mind Manipulation, Soul Manipulation and Information
    Manipulation
