    3, and 5), Resurrection, Can create perfect clones of beings throughout history to fight alongside
    him. This includes the likes of the Royal Knights, Dexmon and Ogudomon, Forcefield Creation, Absorption,
    Attack Reflection, Energy Projection, Sealing, Telepathy, Acausality (Type 1 and 4; exists beyond
    the entirety of the Digital World including kernel), Space-Time Destruction and Creation, Information
    Manipulation and Power Nullification via Reformatting (Yggdrasil is able to reformat one's existence.
    He can do this to a point in which he can remove the special properties from the opponent in order
    to return them into a basic state of being. Essentially removing special characteristics from the
    targets), Existence Erasure and Power Nullification via Program X/Particle Worm (This erasure is so
    powerful that it even threatens the likes of Beelzemon who needed to gain the X-Antibody to survive
