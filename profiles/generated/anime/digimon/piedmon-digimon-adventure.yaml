      before turning them into helpless keychains. He is also skilled in close-combat, easily fighting
      WarGreymon and MetalGarurumon on even ground. However, due to his nature as a sadist, he becomes
      overconfident when he has the upper hand and becomes sloppy, allowing T.K. to get the Crest of Hope
      to Digivolve Patamon into MagnaAngemon.
