    intense punchDigimon Reference Book; Blastmon. *Diamond Hedgehog: Curls up his body and rolls around
    to squash foesDigimon Reference Book; Blastmon. *Crystal Breath: Absorbs sunlight into his body, then
    spews it out as a high-temperature, high-pressure laserDigimon Reference Book; Blastmon. *Gokujo Diamond
    Tail: Slams his tail into the ground, causing a shockwave, followed by a rain of crystal bulletsDigimon
    Xros Wars: Episode 13. *Final Zubagon Punch: Sunders the earth by smashing his fists into the groundDigimon
    Xros Wars: Episode 25. *Junjou Emerald Chop: Karate chops the enemyDigimon Xros Wars: Chapter 14 "Xross
    Dreams!! The Dreams that Can t Be Crushed!!". *Kenran Crystal Volcano: Causes an explosion of crystals
    below him, shooting him head-first towards the enemyDigimon Xros Wars: Chapter 15 "Xross Alliance!
    The Final Battle In Odaiba!!".'
