- id: claim-weaknesses-249a5ecd
  section: weaknesses
  axis: weakness
  text: 'Alphamon can only Digitalize of Soul to summon beings from other dimensions if it''s facing two
    or more beings at the same time Notable Attacks/Techniques: Overwrite: All Digimon can rewrite their
    data, so that they are able to react to various situations that were once problematic for it. This
    usually causes a gigantic increase in power and sometimes new skills and resistances are gained. However,
    the more emotional the Digimon is, the more violent the overwrite becomes. Base *Seiken Gradalpha:
    Draws out a convergence of light that was pierced into the center of a magic circle, and stabs it
    through the opponent. *Digitalize of Soul: Spreads the wings on its back and flies up high, then deploys
    a magic circle even larger than the sky, with which it summons a legendary monster from another dimension.
    However, for Alphamon to summon beings from other dimensions, it must be facing two or more beings
    at the same time. Under other conditions, Alphamon summons a magic circle to fire beams of green or
    purple energy. ENPBjMM.png OAoJM7r.gif OcCVzQS.gif WHftW6k.gif KGeOHMU.gif *Alpha InForce: Alphamon
    has access to this Ultimate Forces, allowing it to instantly replay the elapsed battle by rewind time.
    Thus Alphamon is able to return the state of the battle back to the beginning should it somehow be
    defeated and allowing Alphamon to learn from its previous battles. Alphamon is also able to use this
    ability offensively, instantly replaying its first attack an undefined number of times, this way the
    opponent never knows how many times he was hit, but will always be defeated as if it were the first
    attack. 967BGyi.png|Alphamon has a very powerful existence, because it has the Alpha Inforce that
    allows it to go backwards in time. QMhiz83.png|Its Alpha inForce allows it to take back the time that
    has elapsed in an instant! YCI6GTA.png PfHZvvi.gif *Sealing: Alphamon has sealed itself in the past.
    Alphamon can also seal the opponent after attacking the weakspots from the 12 Earthly Branches which
    can be difficult on its own, so Alphamon can ask someone else to help with part of the process while
    the sealing is being completed. *Power Nullification and Power Absorption: Alphamon has the ability
    to nullify its opponents'' abilities. When Death-X-mon was about to reformat the Digital World, Alphamon,
    to prepare the sealing process, nullified the entire event. Alphamon was also able to steal Culumon''s
    Light of Evolution, preventing other Digimon from receiving this power to evolve. *Character Reversal:
    Alphamon reverses its opponents'' characteristics, changing resistance into weaknesses and weaknesses
    into resistances. *Mental Charge Field: Boosts the power of Alphamon''s Magic based attacks. *Guard
    Break Field: Decrease the defense of the enemies. *Attack Break Field: Decrease the attack of the
    enemies. *Speed Break Field: Decrease the speed of the enemies. Ouryuken Mode *Ultimate-Battle-Blade-OURYUKEN:
    Swings the Ouryuken to crush the opponent with Alphamon''s and Ouryumon''s combined power. He can
    combine this ability with Digitalize of Soul to purge the opponent''s soul and seal them within the
    fabric of reality, never to awaken again. Standard Tactics: Being referred to as the "Aloof Hermit"
    and "The Lord of the Empty Seat", Alphamon rarely appears in combat and is often described as a legend.
    Therefore it is expected that Alphamon only manifests itself at the last moment of a major conflict,
    when only it can resolve the situation. However, when Alphamon appears, it quickly seeks to resolve
    conflicts. Having no hesitation in killing even allies, Alphamon uses its powers to brings wars to
    a close with its split-second assaults. Alphamon can freely use its dimensional powers to move through
    spacetime, thereby escaping any attack, or attacking the opponent by surprise, and is known for using
    magic circles to attack and defend . In its attacks, Alphamon usually uses Digitalize of Soul and
    blows the opponent right out of the flow of time. If its more conventional skills are not enough,
    Alphamon usually summons Ouryuken to assist in combat, tries to seal the opponent and sometimes Alphamon
    uses Alpha InForce both offensively and defensively Note: For a further explanation of the character''s
    background and abilities, check out this blog. And for an explanation of the feats and scaling involving
    the character, read this blog. ==Gallery== 0R8xxR8.gif D3lbIKz.gif KZmMY4V.gif Alphamon Artbook.png
    Alphamon Twitter Artwork.png Alphamon art.png Alphamon cs.png Alphamon Carform.png|Alphamons car form
    Chibi Alphamon.png|Alphamon''s NX form G5RLjb0.gif ND0Xe5F.gif 9NVlETx.gif NHoolP4.gif Pn3rTtP.gif
    0nXVw87.png|The intersection of its lightning-speed attacks blows the opponent right out of the flow
    of time! WbLuC1J.png|Its magic circle, written in Digimoji, provides it with well-rounded offense
    and defense! NDoCbRi.png|This illusory holy knight transcended space-time to save the world! vbD65ES.png|This
    transcendental warrior brings wars to a clo'
  source_ids: *id003
  decisive: false
