  name: 'Mob''s powers were a temporary power-up. Notable Attacks/Techniques: *Anti-Esper
    Dropkick: Reigen dropkicks his opponent '
  description: 'Mob''s powers were a temporary power-up. Notable Attacks/Techniques:
    *Anti-Esper Dropkick: Reigen dropkicks his opponent in the head with both feet.
    Seems to work best on very short opponents unless there''s a ledge he can jump
    from. *Anti-Possession Flying Knee: Reigen deflects a possessed person''s attack
    by grabbing his opponent''s head with both hands and kneeing them in the chest.
    Strong enough to not just knock out but also drive away evil spirits from the
    body. *Cheese Burger Tornado: Reigen spins his whole body and uses the momentum
    to hit the opponent''s face with a palm strike. *Digital Purification: Reigen
    uses photo editing software to remove any evidence of spirits from spirit photographs.
    *Evil Crushing Elbow: An elbow drop that makes electronics inaccessible. *Hypnosis
    Punch: Reigen uses a coin on a string to distract his opponent before suddenly
    punching them out of the blue. Actually dazed an esper with it. *Knee Strike:
    Reigen grabs the opponent by the back of their neck with both his arms and pushes
    their head down'
