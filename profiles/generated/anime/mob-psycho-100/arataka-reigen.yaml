      body actions. He has never lost an argument against an adult until recent times.
      He has constantly hidden his inability to exorcise ghosts and somehow always
      leaves his customers satisfied, with or without Mob's help. He was one of the
      few who were able to identify Mogami's tricks and lies during the Exorcism Arc.
