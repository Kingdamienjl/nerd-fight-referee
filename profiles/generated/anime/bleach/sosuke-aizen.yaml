- id: claim-powers-and-abilities-feb26f42
  section: abilities
  axis: hax
  text: "{{Border|Scroll=No|Visible=Yes|Content= |-|Normal Abilities \u25BE= {{#tag:tabber|Base={{Border|Scroll=Yes|Visible=No|Content=\
    \ *Soul Physiology & Soul Reaper Physiology (Soul: High-Tier/Soul Reaper: High-Tier) *Master Swordsmanship\
    \ & Master Hand-to-Hand Combatant (Aizen as a former captain of the Gotei 13 is a master swordsman\
    \ and martial artist.Bleach, Chapter 100: \"Flower on the Precipice\" Aizen has been trained in Zanjutsu\
    \ and Hakuda for decades as necessary to graduate the Soul Reaper Academy. Zanjutsu is the swordsmanship\
    \ style of Soul Reapers, and Hakuda is their martial arts style. Aizen is skilled enough to fight\
    \ with swordsmanship and martial arts masters such as Yoruichi, Kisuke, and Isshin all at once.Bleach,\
    \ Chapter 403: \"Deicide 5\" Aizen can also intertwine martial arts into his swordplay as well. Aizen\
    \ can additionally effortlessly outskill several highly trained captains of the Gotei 13 at once.Bleach,\
    \ Chapter 392: \"The Breaking Glaciers\" Aizen is precise enough to slice every piece of Zabimaru\
    \ apartBleach, Chapter 173: \"end of hypnosis5 (Standing to Defend You)\") *Genius Intelligence &\
    \ Preparation (Aizen is a genius fighter and strategist. Aizen can create modified Arrancar in preparation\
    \ for a specific opponent, and using them to specifically counter his opponent's abilitiesBleach,\
    \ Chapter 393: \"The Burnout Inferno\") **Social Influencing (Deception; Aizen is a master manipulator.\
    \ For decades, he deceived the entire Soul Society as to who he was and his true nature and intentions,\
    \ and continuously deceived and manipulated them for his own desires.Bleach, Chapter 79: \"Fourteen\
    \ Days for Conspiracy\"Bleach, Chapter 83: \"Come with Me\" Aizen can use a person's own admiration\
    \ towards him to make them his puppet and fully manipulate them.Bleach, Chapter 170: \"end of hypnosis2\
    \ (the Galvanizer)\" He manipulated Shinji Hirako, The Vizards, and the rest of the Soul Society in\
    \ elaborate ways to achieve his own ends.Bleach, Chapter -99: \"Turn Back the Pendulum 10\" His charm\
    \ allows him to place a target in a \"psychic cage' to ensure their cooperation.Bleach, Chapter 249:\
    \ \"Back to the Innocence\"Bleach, Chapter 314: \"Night Side of Abduction\"Bleach, Chapter 270: \"\
    WARning\" In battle, he can cause his opponent to despair through just his words. He does this through\
    \ forcing his opponent to question everything about themselves, whether that be their motivation for\
    \ fighting him, or very history and past achievementsBleach, Chapter 396: \"The Bite\") **Information\
    \ Analysis (Aizen can look at a person and know everything about them) *Reiatsu Concealing Cloak:\
