  section: equipment
  axis: equipment
  text: "Aizen's Hogyoku.jpg|Aizen holding the Hogyoku CajaNegaci\xF3n.png|Caja Negaci\xF3n Aizen Reiatsu\
    \ Concealing Cloak.jpg|Reiatsu Concealing Cloak Kyoka Suigetsu Equip.webp|thumb|Kyoka Suigetsu {{Nihongo|Hogyoku|{{Ruby|\u5D29\
    |\u307B\u3046}}{{Ruby|\u7389|\u304E\u3087\u304F}}|H\u014Dgyoku}}: A powerful object originally created\
    \ by Kisuke Urahara. Once equipped, Aizen is granted the ability of high-speed regeneration, and constant\
    \ evolution in the form of more powerful transformations. {{Nihongo|Caja Negacion|{{Ruby|\u53CD\u819C\
    \u306E\u532A|\u30AB\u30CF\u30FB\u30CD\u30AC\u30B7\u30AA\u30F3}}|Kaha Negashion}}: These cubes are\
    \ capable of sealing away an enemy from the battlefield for a very long time, even foes that are far\
    \ stronger, however the time limit for the stronger foes is much shorter than those on the same level\
    \ as him. Reiatsu Concealing Cloak: A cloak created by Urahara which hides the wearer's Reiatsu. Aizen\
    \ used this cloak to sneak up and attack Isshin Shiba. Aizen states it allows the wearer to blend\
    \ in with the air around them by incorporating Kid\u014D into the cloak, almost completely concealing\
    \ them from sight. {{Nihongo|Kyoka Suigetsu|{{Ruby|\u93E1|\u304D\u3087\u3046}}{{Ruby|\u82B1|\u304B\
    }}{{Ruby|\u6C34\u6708|\u3059\u3044\u3052\u3064}}|Ky\u014Dka Suigetsu}}: Aizen's Zanpakuto is his primary\
    \ means of close quarters combat and is a part of his soul imbued into an Asauchi. In its sealed form,\
    \ Aizen's Zanpakuto takes the form of a Katana with a green hilt accompanied with a green sheath.\
    \ The sword has two release states aside from its sealed state, that being its first release, Shikai,\
    \ and its second release, Bankai. Aizen's Shikai allows him to place anyone who witnesses its release\
    \ under hypnosis in which he can control all of their senses to create flawless illusions."
