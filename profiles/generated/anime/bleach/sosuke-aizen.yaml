    text: 'At least Small Planet level, possibly Multi-Solar System level (Aizen has among the highest
      combined Attack and Spiritual Pressure stats of all the Captains and consistently one-shots Captain
      class fighters with little effort, without even using a third of his power at times, in the Soul
      Society Arc.Bleach Official Bootleg: Bleach Color+Bleach Official Character Book SoulsBleach, Chapter
      174: "end of hypnosis6 (The United Front)" Aizen''s Spiritual Pressure is able to casually crush
      Grimmjow,Bleach, Chapter 245: "THE WAY WITHOUT ENEMIES" he''s superior to all the Espada,Bleach,
      Chapter 375: "EXecution, EXtinction"Bleach, Chapter 376: "EXecution, EXtinction 2" which is supported
      by Gin claiming Aizen''s immense power is what subjugated the Espada,Bleach, Chapter 390: "Beyond
      the Death Understanding" and the fact that the Espada are referred to as weak as pawns in comparison
      to Aizen. Aizen easily cuts down Shinji,Bleach, Chapter 387: "Ignited" and implies he is far superior
      to Striped Hollow Mask Ichigo, Aizen beats the dog out of Bankai Komamura, he drops Love and Rose,Bleach,
      Chapter 391: "The Blazing Glaciers" he nullifies Nigeki Kessatsu with his raw spirit energy, and
      then he one shots Shinji, Sui-Feng, Toshiro, and Shunsui. Downscales from Yamamoto for having survived
      a significant fraction of his Hado 96 explosion while being at the epicenterBleach Chapter 395Bleach
      Chapter 396 He claims his powers were superior to anyone''s in Soul Society, which the databooks
      support, and while this might not be literally true, as Aizen concedes inferiority to Yamamoto,
      it still indicates he is among the strongest people alive. Aizen also states he only was wary of
      Yamamoto and Zaraki''s potential,Bleach Spirits Are Forever With You implying that Unohana is below
      the likes of Aizen; furthermore, nerfed Squad 0 members didn''t even use the power of an entire
      Gotei squad,Bleach: Thousand-Year Blood War, Episode 26: "BLACK" meanwhile Aizen was capable of
      mopping the floor with the majority of the Gotei 13''s fighting force, making him superior to a
      Gotei 13 Squad, and thus superior to the nerfed power of a regular Squad 0 member1.1683 Zettatons
      possibly 20.08 TeraFoe) | At least Galaxy level (Casually repelled Anti-Hierro Armored Yoruichi,
      Kisuke, and Isshin, and is so powerful that Isshin cannot even perceive his power,Bleach, Chapter
      406: "Deicide 8 end of the Chrysalis age" which would logically place him among the full power of
      Squad 0 Captains, and once he gets serious, he effortlessly dispatches of Yoruichi, Kisuke, and
      Isshin1.2267 YottaFoe) | At least Galaxy level (To display his power surpasses reason, Aizen destroyed
      the Kototsu) | At least Galaxy level (He easily mutilates Gin, as he finally transcends Hollows
      and Soul Reapers and the Hogyoku had granted Aizen''s wish of evolving to the level of god, otherwise
      known as the level of the Soul King3.68 YottaFoe) | At least Galaxy level (Was able to burn a casual
      post-Dangai training Ichigo''s arm with a Fragor, and has transcended everything, surpassing even
