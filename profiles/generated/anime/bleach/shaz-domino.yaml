- id: claim-weaknesses-93518ed2
  section: weaknesses
  axis: weakness
  text: 'As a Quincy, Shaz doesn''t have anti-bodies against Hollows, making them poisonous to his very
    existenceBleach: Chapter 552. Shaz''s "The Viability" can''t be turned off, meaning he can never stop
    regenerating if he''s damaged, so if he''s placed within scenarios which he''s dealt constant damage
    he''d continue to regenerate from that, regardless if he wishes to or not. Blut Vene and Blut Arterie
    use two different Reishi systems, so they cannot be used at the same time. When using medallion, its
    user need to be sufficiency powerful to wield itBleach: Chapter 510 and the power stolen by medallion
    is weaker than the original unless the Quincy in question takes the time and effort to master itBleach:
    Chapter 504. They''re also incapable of using Voltstandig while having an absorbed BankaiBleach: Chapter
    554.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
