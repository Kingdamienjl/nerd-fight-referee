- id: claim-powers-and-abilities-7f569587
  section: abilities
  axis: hax
  text: "*Soul Physiology and Hollow Physiology (Soul: High-Tier - Is a Fraccion-Class Arrancar who acts\
    \ as a personal servantBleach: Chapter 297: Page 7 for Nelliel Tu Odelschwanck | Hollow: Low-Tier\
    \ Arrancar - Is an Arrancar of low evolutionary scale) *Hand-to-Hand Combatant and Expert Swordsman\
    \ (Pesche is an experienced and competent fighter; given his life as a Hollow, which requires constant\
    \ battles for survival from predators trying to devour the soul of anything it can sink its teeth\
    \ in, to prey who defend themselves against aggressors. This \"born through bloodshed\" existence\
    \ has reinforced Pesche's capabilities tremendously. As he is a Fracci\xF3nes class Arrancar, his\
    \ inherent capabilities with his swordsmanship and hand-to-hand abilities would be comparable with\
    \ other similarly classed contemporaries and adversaries) *Breath Attack and Organic Manipulation\
    \ (With Infinite Slick - Pesche can spew out viscous liquid from his mouth, this liquid is incredibly\
    \ slippery and will limit the amount of friction an object hasBleach: Chapter 256: Page 14. This effect\
    \ can be used to cause bladed attacks to become dull and ineffectiveBleach: Chapter 256: Page 15.\
    \ It can make standing on platforms impossible because of how slippery the liquid isBleach: Chapter\
    \ 256: Pages 16-17 or cause objects to become too slick that it's incredibly hard to grasp them without\
    \ them slipping out of your handBleach: Chapter 295: Page 11) *Conditional Fusionism and Damage Boost\
    \ (When fighting alongside his friend, Dondochakka Birstanne; they can fuse their ceros togetherBleach:\
    \ Chapter 296: Page 21 to increase its potency with Cero Sincr\xE9ticoBleach: Chapter 297: Pages 7-8)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
