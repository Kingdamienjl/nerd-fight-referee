  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Content= *Soul Physiology & Soul Reaper Physiology
    (Soul: High-Tier/Soul Reaper: High-Tier) **Fire Manipulation & Limited Heat Manipulation
    (With Hado #31: Shakkaho, Renji releases a condense ball of red-hot Reiryoku from
    his palm,Bleach, Chapter 275: "The United Front 2 (Red & White)" burning and vaporizing
    everything in his way) *Zanpakuto: Master Swordsmanship (As an lieutenant of the
    Gotei 13, Renji is an extremely capable swordsman, having train countless decades
    on swordsmanship alone, using this knowledge within combat Renji can fight on
    par with similarly experienced swordsman like Ichigo KurosakiBleach, Chapter 96:
    "Bloodred Conflict") **Bone Manipulation, Creation & Limited Large Size (Type
    1; Renji''s Bankai: Hihio Zabimaru creates a large, bone snake which Renji freely
    controls through manipulating the tail of it,Bleach, Chapter 141: "Kneel to the
    Baboon King" this snake is massive, easily being compared to the towering pillars
    in Soul Society which tower of the houses and homes around them) **Energy Manipulation
    & Energy Projection (Renji can project his Reiryoku through his BankaiBleach,
    Chapter 210: "Turn the True Power On" or through his hands with KidoBleach, Chapter
    248: "Alive and Back Here Once Again") *Information Analysis (Renji''s goggles
    can read someone''s "rear conformity and nerve union rate"Bleach, Chapter 51:
    "Death 3") Resistance to: *High Temperatures (Is able to bathe in Tenjirō Kirinji''s
    hot spring, and without protection the water can cause the spiritual being''s
    bodies to erode and rupture from exposure to the watersBleach, Chapter 520: "Killers
    Not Dead") *Mind Manipulation & Empathic Manipulation (Possesses Oken clothing,
    which allows the wearer to resist Pepe''s The Love SchriftBleach, Chapter 595:
    "Rubb-Dolls 2") }}'
