    text: "Gifted (Grimmjow is a highly perceptive fighter. He was able to discern\
      \ from simple observation, during his first fight with Ichigo, that his Bankai\
      \ enhanced Getsuga Tensh\u014D was damaging his body. He also notes that Ichigo\
      \ was capable of 2 to 3 more of those attacks at best. Upon his second fight\
      \ with Ichigo, he makes note that Ichigo was straining to use his Hollowfication,\
      \ for as soon as his mask came off his breathing instantly became heavier. However,\
      \ he notes that it may not be so simple as that, denoting that it may have something\
