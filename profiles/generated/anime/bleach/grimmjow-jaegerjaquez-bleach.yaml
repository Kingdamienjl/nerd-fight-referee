  attack_potency:
    text: "Large Country level (As an Espada, Grimmjow would be stronger than the\
      \ Privaron Espada, such as DordoniBleach Chapter 250Bleach Chapter 251Bleach\
      \ Chapter 254Bleach Official Character Book 2 Masked, since Nnoitra claims the\
      \ current Espada are stronger than the previousBleach Chapter 292, which is\
      \ supported by the databooks which claim the Espada are above all other ArrancarBleach\
      \ Official Character Book 2 Masked, and the power of the Espada make the Fraccion's\
      \ pale in comparisonBleach Chapter 209; additionally, the Espada are ranked\
      \ according to their power, making Grimmjow stronger than ZommariBleach Official\
      \ Character Book 2 MaskedBleach Official Character Book 3 Unmasked. Grimmjow\
      \ punches a hole in RukiaBleach Chapter 204, he casually tosses around Shikai\
      \ IchigoBleach Chapter 209, and Bankai IchigoBleach Chapter 211. Grimmjow is\
      \ weaker without both arms, and once he gets his power back he kills an off-guard\
      \ LuppiBleach Chapter 240. With 1-arm Grimmjow is able to physically withstand\
      \ the fight with a Hollow Mask IchigoBleach Chapter 231Bleach Chapter 232, then\
      \ he beat down Bankai Ichigo and Rukia once Ichigo's Hollow Mask shattersBleach\
      \ Chapter 233Bleach Chapter 235, Masked confirms that Grimmjow was Ichigo's\
      \ superior throughout the majority of their first two fightsBleach Official\
      \ Character Book 2 Masked389.4 Teratons), higher with Cero (Capable of lessening\
      \ the Cero of UlqiorraBleach Chapter 278 and tearing through Bankai Ichigo's\
      \ Black Getsuga Tensh\u014DBleach Chapter 280), Continent level+ with Gran Rey\
      \ Cero (Gran Rey Cero is the most powerful enhanced version of the CeroBleach\
      \ Official Character Book 2 Masked, making it a greater amplification than Cero\
      \ Oscuras which is 10xBleach Official Character Book 3 Unmasked, it was calculated\
      \ to be this strong but scales higher via powerscaling3.894 Petatons), higher\
      \ with Resurreccion (In Resurreccion, Grimmjow is able to clash withBleach Chapter\
      \ 281 and harm a Hollowfied Bankai IchigoBleach Chapter 282, eventually gaining\
      \ the upper handBleach Chapter 283, and even after Ichigo steels his resolve\
      \ thanks to Orihime's cheers, Grimmjow is able to still harm Ichigo after becoming\
      \ enragedBleach Chapter 285), Multi-Continent level with Cero Oscuras (All Espada\
      \ can use this technique in their release formsBleach Chapter 346 which amplifies\
      \ their normal Cero by 10x38.94 Petatons), higher with Gran Rey Cero (It is\
      \ the ultimate Cero, it was calculated to be this strong but scales higher via\
      \ powerscaling), far higher with Desgarr\xF3n (Desgarr\xF3n is Grimmjow's strongest\
      \ attackBleach Chapter 285, which is confirmed by MaskedBleach Official Character\
      \ Book 2 Masked and UnmaskedBleach Official Character Book 3 Unmasked) |-|Thousand-Year\
      \ Blood War"
    source_ids:
    - mediawiki-grimmjow-jaegerjaquez-bleach
    confidence: 0.75
    notes: auto_repair source extraction
