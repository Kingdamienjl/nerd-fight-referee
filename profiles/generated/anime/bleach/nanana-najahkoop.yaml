- id: claim-weaknesses-9743cf3f
  section: weaknesses
  axis: weakness
  text: "As a Quincy, NaNaNa doesn't have anti-bodies against Hollows, making them poisonous to his very\
    \ existence.Bleach: Chapter 552 Blut Vene and Blut Arterie use two different Reishi systems, so they\
    \ cannot be used at the same time. When using medallion, its user need to be sufficiency powerful\
    \ to wield itBleach: Chapter 510 and the power stolen by medallion is weaker than the original unless\
    \ the Quincy in question takes the time and effort to master it.Bleach: Chapter 504 They're also incapable\
    \ of using Voltstandig while having an absorbed Bankai.Bleach: Chapter 554 {| class=\"mw-collapsible\
    \ mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
    \ | colspan=\"2\" style=\"text-align: left; |Notable Attacks and Techniques: |- | The Underbelly.gif|The\
    \ Underbelly *: NaNaNa's Schrift \"The Underbelly\" allows him to poke holes within the Reiatsu of\
    \ his opponent, during so immobilizes them completely until they run out of Reiatsu. This immobilization\
    \ effect was strong enough to affect someone on Sosuke Aizen's level. * Essentially the Quincy version\
    \ of the Shinigami Flash Step and Arrancar Sonido.Bleach: Chapter 349 The Quincy creates platforms\
    \ of Reishi under their feet to swiftly move around the battlefield.Bleach: Chapter 122 *: NaNaNa\
    \ uses a bow as his primary weapon. It resembles his Vollst\xE4ndig, consisting of 3 orange rings\
    \ with a trio of spikes on either end. **: From each of the three rings of his bow, NaNaNa can simultaneously\
    \ fire three Heilig Pfeil, allowing him to fire a volley of nine arrows in one attack. *: An advanced\
    \ Quincy technique which grants one inhuman defensive and offensive capabilities, however it can't\
    \ boost both offensive and defensive simultaneously.Bleach: Chapter 499 **: The defensive form of\
    \ Blut, which grants the user a boost in defense by strengthening their skin in a similar fashion\
    \ to an Arrancar's Hierro. Additionally, Blut Vene can be used to stop blood loss due to injury.Bleach:\
    \ Chapter 112 **: The offensive form of Blut which grants the user inhuman attack power. This technique\
    \ is the only thing capable of ensuring a Quincy's attacks can significantly damage a Bankai-wielding\
    \ Shinigami.Bleach: Chapter 498 *: Vollst\xE4ndig's basic Reishi Absorption ability pushed to the\
    \ absolute limit. This allows the user to absorb the Reishi that composes spiritual and living beings,\
    \ an absolute subordination of Reishi.Bleach: Chapter 493 Destroying the Stern Ritter's Halo is the\
    \ only way to stop it. *: An advanced Quincy technique created for injured/old Quincy in order to\
    \ control their limbs with strings of Reishi like a puppet. Broken bones and severed tendons mean\
    \ nothing to this as the strings will control the limbs until the body/limb is entirely destroyed.Bleach:\
    \ Chapter 124 *: A teleportation ability used by members of the Wandenreich, this technique can be\
    \ used by manifesting the user's shadows in front of them,Bleach: Chapter 484 creating a portal that\
    \ acts as a gate between the Schatten Bereich and other dimensions. The size of these portals can\
    \ be extended to allow many others to pass through.Bleach: Chapter 511 *: A device possessed by select\
    \ members of the Wandenreich military, including all Sternritter which allows one to steal a Shinigami's\
    \ Bankai or any power that is fundamentally similar to a Shinigami's Bankai |}"
