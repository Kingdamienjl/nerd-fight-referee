- id: claim-weaknesses-f267ca9a
  section: weaknesses
  axis: weakness
  text: "He has lost his left arm, and his physical strength has diminished with age (although he is still\
    \ formidable in hand-to-hand combat and swordsmanship). He is somewhat arrogant and prefers to avoid\
    \ stepping onto the battlefield unless he has to (which led many of the Lieutenant-class Shinigami\
    \ to sustain severe injuries in combat when he could have easily wiped out most of Aizen's army).\
    \ He is also stubborn about his opinions and will not heed advice that goes against them unless he\
    \ sees it with his own eyes (such as Mayuri's warning about the Wandenreich). {| class=\"mw-collapsible\
    \ mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
    \ | colspan=\"2\" style=\"text-align: left; |Notable Attacks and Techniques: |- | : A Shinigami movement\
    \ technique that allows the user to move faster than the eye can follow. As speed is the main factor,\
    \ it is best characterized by how fast one can get from point A to point B in the least amount of\
    \ steps. Ikkotsu.gif|Ikkotsu Sokotsu.gif|S\u014Dkotsu Hitotsume Nadegiri.gif|Hitotsume: Nadegiri Onibi.gif|Onibi\
    \ *: The Shinigami art of hand-to-hand combat. Yamamoto is a master of Hakuda who can easily fight\
    \ foes several times his size and stop most of the punches from a multi-armed opponent explicitly\
    \ designed to counter his abilities. **: A single punch powerful enough to easily destroy most of\
    \ Wonderweiss' abdomen while sending him flying through several buildings. **: A powerful two-fisted\
    \ punch strong enough to wreck Wonderweiss' body. *: **: A mixture of Zanjutsu and Yamamoto's Shikai,\
    \ Nadegiri is a concentrated slash of Ry\u016Bjin Jakka's flames to cleanly cut the enemy with fire.\
    \ **: Yamamoto performs a powerful thrust with a blunt weapon, creating a large, gaping, cylindrical\
    \ hole in a target. Ruujin Jakka.gif|Ry\u016Bjin Jakka J\u014Dkaku Enj\u014D.gif|J\u014Dkaku Enj\u014D\
    \ Taimatsu.gif|Taimatsu Ennetsu Jigoku.gif|Ennetsu Jigoku : The initial release of a Shinigami's Zanpakut\u014D\
    . It is activated by a command while declaring the name of the Zanpakut\u014D Spirit. It changes the\
    \ shape of the Zanpakut\u014D and/or grants special abilities. *: Yamamoto's Zanpakut\u014D and the\
    \ oldest and one of the most powerful Zanpakut\u014D in Soul Society. Normally taking the form of\
    \ a simple wooden cane, its outer peels away to reveal an ornate katana when it's time for combat.\
    \ Upon being activated with the command , a massive wave of fire and spiritual pressure is released\
    \ from the blade that can be felt from miles away by the spiritually attuned. A single swing of this\
    \ blade can emit waves of fire that can instantly reduce the surroundings to ash and reach as far\
    \ as the clouds. Even a captain of the Gotei 13 would be hard-pressed to be able to resist an indirect\
    \ attack from these flames. Unlike other Zanpakut\u014D, Ry\u016Bjin Jakka's effects do not dissipate\
    \ if it is somehow resealed, allowing the fire to rage on until they run out of fuel. **Will-o'-the-Wisp:\
    \ A technique to emanate heat towards a subject in a concentrated area to burn a hole into the target.\
    \ It can be used despite not being in Shikai. **: Yamamoto creates a massive wall of flame that surrounds\
    \ the target and imprisons them. This technique is potent enough to immobilize Aizen, Gin, and T\u014D\
    sen for a significant amount of time. **: Yamamoto torches his surroundings with a single swing of\
    \ his blade, burning them until nothing remains but ashes. He can manipulate these flames with enough\
    \ precision to only strike those he chooses and increase or decrease their intensity at leisure. **:\
    \ A time-consuming ability that involves creating massive pillars of fire that close in on the target\
    \ and engulf them in flames. Though Yamamoto can use this technique to cover a much wider area than\
    \ Karakura Town, he is just as vulnerable to the fire as his enemies are. Yamamoto Activates Bankai.gif|Bankai\
    \ Bankai Zanka no Tachi.gif|Zanka no Tachi Zanka no Tachi East.gif|Zanka no Tachi, East: Kyokujitsujin\
    \ Zanka no Tachi West.gif|Zanka no Tachi, West: Zanjitsu Gokui Zanka no Tachi South.gif|Zanka no Tachi,\
    \ South: Kaka J\u016Bmanokushi Dais\u014Djin Zanka no Tachi North Tenchi Kaijin1.gif|Zanka no Tachi,\
    \ North: Tenchi Kaijin *: The ultimate and final release to a Zanpakut\u014D. The difference in power\
    \ between Shikai and Bankai is generally around 5-10 times more powerful. Even though Bankai is the\
    \ final stage of a Zanpakut\u014D, it does not mean the Shinigami's growth ends there. A Bankai, especially\
    \ one that has been recently obtained, can evolve even further as its Shinigami also strengthens.\
    \ **: Yamamoto's Bankai compresses all of Ry\u016Bjin Jakka's flames into the blade itself, radically\
    \ changing its properties. **: Upon release, Zanka no Tachi's flames are concentrated along the blade,\
    \ instantly eradicating anything it touches from existence. **: Yamamoto is surrounded by the raging\
    \ flames, which can reach over 15,000,000\xB0 Celsius and instantly vaporize any attacks directed\
    \ at him. Unless Yamamoto consciously chooses to reveal it, this heat is undetectable. The flame armor\
    \ makes it difficult to"
