- id: claim-powers-and-abilities-c72e15b1
  section: abilities
  axis: hax
  text: '*Soul Physiology & Hollow Physiology (Soul: High-Tier/Hollow: High-Tier Arrancar)
    *Expert Swordsman and Marksman (As the Primera Espada,Bleach: Chapter 339 Starkk
    is extremely skilled within combat, especially with his pistolsBleach: Chapter
    372 and swords.Bleach: Chapter 374 Being able to fight on par with other similarly
    skilled opponents of the Gotei 13 like Shunsui Kyoraku. This level of skill is
    also compounded on by the fact Starrk has existed for centuries doing nothing
    but fighting and consuming other hollows, granting him a level of experience which
    is only contended with by the highest of Soul Reaper and Hollow combatants) *Resurrección:
    Los Lobos **Weapon Creation, Enhanced Energy Manipulation & Limited Fusionism
    (Los Lobos is activated after fusing with Lilinette,Bleach: Chapter 361 this fusion
    grants Starrk two pistols which have the capability of firing ceros.Bleach: Chapter
    362 Starrk can discard these weapons and instead create swords from his Reiryoku,
    doing so through the bandoleers on his back) **Enhanced Energy Projection & Danmaku
    (Cero Metralleta allows Starrk to shoot hundreds of ceros out of his guns, Starrk
    directly states he can shoot out a thousand ceros in a instant but was interrupted
    by Shunsui Kyoraku before he could do such a thingBleach: Chapter 363) *Enhanced
    Soul Manipulation, Transformation, Homing Attack, Explosion Manipulation, Limited
    Fire Manipulation & Duplication (Given his aspect of death being "Solitude",Bleach:
    Chapter 356 Starrk can tear pieces of his own soul out and transform them into
    things. Doing so to create Lilinette, while in a more combat applicable sense
    he can create spiritual wolves.Bleach: Chapter 373 He can create a plethora of
    these wolves and everytime these wolves are damage they''ll regenerate and then
    split into even more wolves. These wolves will home onto Starrk''s opponents mercilessly
    until they latch onto them, after which, they proceed to explode and release a
    massive pillar of flaming Reishi) Resistance to: *Extrasensory Perception ( 2
    Layers; Using Sonído allows the user to bypass Extrasensory PerceptionCan''t Fear
    Your Own World: Vol 1: Chapter 9 of even captain level opponents) *High Temperatures
    (Resisted the heat of Love''s Shikai TengumaruBleach: Chapter 372)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
