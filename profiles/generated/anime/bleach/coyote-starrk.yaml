- id: claim-weaknesses-c7c6757b
  section: weaknesses
  axis: weakness
  text: 'Starrk is extremely lazy and often doesn''t finish off his opponents. Summoning
    his wolf pack seals away his pistols. {| class="mw-collapsible mw-collapsed" align="center"
    border="1" cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; |Notable Attacks/Techniques: |- | Starrk Reiatsu.gif|Starrk releasing his
    Reiatsu Starrk Cero2.gif|Starrk firing a Cero without any pose GranRayCero.gif|Gran
    Rey Cero CeroOscuras.gif|Cero Oscuras YammysBala.gif|Bala *{{Nihongo|Cero|{{Ruby|虚閃|セロ}}|Sero}}:
    A powerful blast of concentrated spiritual energy fired in a laser like fashion
    that only Hollows, Arrancars, and Visoreds can use. The power, force, speed, and
    blast area of the Cero is dependent on the strength, spiritual power, and sometimes
    skill of the user. **{{Nihongo|Gran Rey Cero|{{Ruby|王虚の閃光|グラン・レイ・セロ}}|Guran Rei
    Sero}}: A much more powerful Cero only accessible to the Espada. By mixing their
    blood with a Cero, the Espada can discharge a blast that can distort space and
    is powerful enough to destroy Las Noches. **{{Nihongo|Cero Oscuras|{{Ruby|黒虚閃|セロ・オスキュラス}}|Sero
    Osukyurasu}}: A powerful Cero that can only be used by the Espada in their Resurrección.
    This Cero is powerful enough to destroy Las Noches as well. *{{Nihongo|Bala|{{Ruby|虚弾|バラ}}|Bara}}:
    An Arrancar ability similar to Cero, except it''s weaker and 20 times faster.
    *{{Nihongo|Descorrer|{{Ruby|解空|デスコレール}}|Desukorēru}}: A technique used by Arrancar
    to travel between Hueco Mundo and other worlds, creating a spiritual pathway called
    a Garganta with a gesture, walking through this portal to arrive at their destination
    in an instant. *{{Nihongo|Hierro|{{Ruby|鋼皮|イエロ}}|Iero}}: A defensive technique
    used by Arrancar that toughens their skin by reinforcing it with condensed Reiryoku,
    allowing an Arrancar to confront an armed Shinigami with their bare hands. All
    Arrancar use this ability in some form to gain their supernatural toughness, but
    even an exceptionally powerful Hierro can be bypassed by focusing one''s Reiryoku
    to a finer, sharper point. *{{Nihongo|Pesquisa|{{Ruby|探査神経|ペスキス}}|Pesukisu}}:
    A perception technique used by Arrancar, which sends out a pulse that detects
    nearby sources of Reiatsu and gauging their power. *{{Nihongo|Sonído|{{Ruby|響転|ソニード}}|Sonīdo}}:
    A technique used by Arrancar that allows for high-speed movement, effectively
    analogous to the Flash Step used by Soul Reapers, and used in bursts to traverse
    distances quickly and fight at these high speeds. Multi-Ceros.gif|Starrk firing
    multiple Cero at Shunsui Cero Metralleta.gif|Starrk firing Cero Metralleta Colmillo2.gif|Starrk
    using Colmillo Wolf Pack.gif|Starrk''s wolf pack Exploding Wolves.gif|Starrk''s
    wolves exploding upon biting Love *{{Nihongo|Resurrección: Los Lobos|{{Ruby|帰刃|レスレクシオン}}「{{Ruby|群狼|ロス・ロボス}}」|Resurekushion・Rosu
    Robosu}}: The Arrancar equivalent of a Shikai/Bankai, this form allows an Arrancar
    to unleash their true power as a Hollow. Starrk''s Resurrección. Unique for an
    Arrancar, Starrk''s true power is not sealed within a Zanpakutō, but within the
    form of another Arrancar, Lilinette Gingerbuck, who is both a distinct being and
    a part of Starrk. By releasing his power with the command Kick About, Starrk transforms
    Lilinette into a pair of pistols, gaining part of her mask and new clothing lined
    with fur, ultimately resembling a gunslinger. In this form, Starrk can fire Cero
    from his pistols, with the right firing more powerful blasts, while the left is
    weaker but can shoot much faster, so fast that Starrk claimed he could fire 1,000
    Cero at once. His physicals are greatly increased as well. **{{Nihongo|Cero Metralleta|{{Ruby|無限装弾虚閃|セロ・メトラジェッタ}}|Sero
    Metorajetta}} Starrk lifts one of his pistols and fires a barrage of Cero from
    its barrel and around it, so much so that they seem to combine into one massive
    blast. He can continuously keep up this barrage and adjust his aim while firing
    and without stopping. **{{Nihongo|Colmillo|{{Ruby|刃牙|コルミージョ}}|Korumījo}}: Starrk
    can materialize a pair of spiritual energy swords vaguely resembling the katana
    he wields prior to his Resurrección. **Wolves: Starrk can summon a massive pack
    of wolves, seemingly numbering in the hundreds, and each materialized from a part
    of Starrk and Lilinette''s shared souls. These wolves obey Starrk''s commands
    and will chase down their targets, biting onto them once they get close enough
    before exploding with brutal force. |} ==Notable Matchups== Victories: Losses:
    Inconclusive: ==References== {{Scroll box|{{Reflist|2}}}} ==Notes/Explanations==
