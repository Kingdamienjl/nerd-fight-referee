  attack_potency:
    text: At least Large Country level (Capable of clashing with and harming NnoitoraBleach
      Chapter 291Bleach Chapter 295, albeit the databooks state that Nel only got
      the upper hand due to Nnoitora being caught off guard by her sudden adult appearanceBleach
      Official Character Book 2 Masked389.4 Teratons), Continent level with Cero Doble
      (Capable of harming NnoitoraBleach Chapter 291Bleach Chapter 292, Cero Doble
      functions by combining Nelliel's Cero with her opponents, which can result in
      doubling the Cero's potencyBleach Official Character Book 2 Masked), Continent
      level+ with Gran Rey Cero (Gran Rey Cero is the most powerful enhanced version
      of the CeroBleach Official Character Book 2 Masked, making it a greater amplification
      than Cero Oscuras which is 10xBleach Official Character Book 3 Unmasked, it
      was calculated to be this strong but scales higher via powerscaling3.894 Petatons),
      at least Continent level with Resurrección (Broke through Nnoitora's blade and
      pierced his shoulderBleach Chapter 296, and Nnoitora praised Nelliel for her
      ResurrecciónBleach Chapter 297778.8 Teratons), Multi-Continent level with Cero
      Oscuras (All Espada can use this technique in their release formsBleach Chapter
      346 which amplifies their normal Cero by 10x7.788 Petatons), higher with Gran
      Rey Cero (It is the ultimate Cero, it was calculated to be this strong but scales
      higher via powerscaling) |-|CFYOW Novel
