      Chapter 375, he bisects HiyoriBleach Chapter 377, he''s able to harm Bankai
      IchigoBleach Chapter 400Bleach Chapter 401, Gin broke Ichigo''s Striped Hollow
      Mask, but it is more brittle than it should be, implying its durability is hamperedBleach
      Chapter 405, and Gin is able to stab and disintegrate Third Fusion AizenBleach
      Chapter 414; however, Aizen keeps his spiritual pressure low such that humans
      can sense himBleach Chapter 412Bleach Chapter 417, meaning Aizen would be intentionally
      making himself weaker than his Second Fusion3.8945 Exatons), at least Moon level
      with Buto Renjin (Amplifies his attack power by 10xBleach Official Character
      Book 3 Unmasked38.9448 Exatons)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Hypersonic+ (Able to fight against Tōshirō Hitsugaya, who has the same mobility
