- id: claim-powers-and-abilities-2d9638b2
  section: abilities
  axis: hax
  text: "*Soul Physiology and Fullbringer Physiology (Soul: High-Tier/Fullbringer: High-Tier) *Expert\
    \ Hacker (Hacked into the bank of his father's company) *Pocket Reality Manipulation, Limited Reality\
    \ Warping and Information Manipulation (Type 2 - Yukio's Fullbring, Invaders Must Die's main ability\
    \ is the creation of pocket dimensions, within these pocket dimensions Yukio gains tons of new and\
    \ powerful abilities/effects to use against his opponentsBleach: Chapter 448, within these dimensions\
    \ he's basically god and can manipulate anything and everything within them, even the foundations\
    \ which make up these dimensionBleach: Chapter 466) *Limited Size Manipulation and Spatial Manipulation\
    \ (Yukio can control the sizes of his pocket dimensions, being able to expand them or shrink them\
    \ to the point he completely destroys the dimension and everything within it) *Sealing (Yukio can\
    \ seal people within smallBleach: Chapter 446 pocket dimensions with SaveBleach: Chapter 447, after\
    \ which he can either keep them sealed away or place them within a larger pocket dimension) *Limited\
    \ Time Manipulation (Yukio can fast-forward time within his pocket dimensions, causing days worth\
    \ of time to have passedBleach: Chapter 452 despite the fact it has only been a couple hours at most\
    \ outside the pocket dimension) *Duplication and Illusion Creation (Yukio can create digital clones\
    \ of himself and othersBleach: Chapter 471) *Limited Gravity Manipulation (Yukio can raise the gravity\
    \ within his pocket dimensions to at least 4.5GBleach: Chapter 449) *Limited Weather Manipulation\
    \ and Limited Temperature Manipulation (Yukio can manipulate the weather within his pocket dimensions,\
    \ allowing him to change things like the temperature, changing it to at least 48.2 Celsius) *Limited\
    \ Wind Manipulation (Yukio can manipulate the wind pressure within his pocket dimensions, increasing\
    \ it to an unknown amount and bringing it down to at least -0.5) *Limited Causality Manipulation and\
    \ Disease Manipulation (Yukio can place \"viruses\" into his past, allowing him to negate abilities\
    \ that try to interfere with his past like Tsukishima's Book of The EndCan't Fear Your Own World:\
    \ Vol 2: Chapter 14) *BFR (Yukio can forcefully send beings into his pocket dimensions) *Law Manipulation,\
    \ Limited Power Nullification and Limited Sound Manipulation (Yukio can create \"Rules\" within his\
    \ pocket dimensions that are enforced upon you with or without your consent, such as creating a cage\
    \ that's completely soundproof and couldn\u2019t be broken out of even by Orihime who can reject the\
    \ \u201CPhenomena of Existence\u201D itselfBleach: Chapter 451) *Life Manipulation (Yukio can manipulate\
    \ the life-force of those inside his pocket dimensions, such as making Ichigo\u2019s and Ginjo\u2019\
    s health-meters the same) *Creation and Summoning (Yukio can create things from nothingness while\
    \ inside his pocket dimensions) *Data Manipulation (Yukio can create constructs made of Data withBleach:\
    \ Chapter 463 Invaders Must Die) *Likely Death Manipulation (Yukio implies he can cause Ichigo\u2019\
    s death within his dimension through creating a rule which states \u201CYou Die\u201D) *Forcefield\
    \ Creation (Yukio can create a digital shield with Invaders Must Die) *Stealth Mastery (Yukio\u2019\
    s Fullbring conceals the spiritual pressures of those inside his pocket dimensions) *Tracking (Yukio\
    \ can place tracking-bugs on his opponents to follow their locationBleach: Chapter 454) *Explosion\
    \ Manipulation (Yukio can create missiles that explode on contactBleach: Chapter 464) *Resistance\
    \ to Extrasensory Perception when using Bringer Light ( 2 Layers;Using Bringer Light makes the user\
    \ harder to sense via Reikaku, due to the fact it disturbs the surrounding reiatsu and reishi to a\
    \ minimal degreeBleach Chapter 432, Bleach Can't Fear Your Own World Chapter 9)"
  source_ids: *id003
  decisive: true
  status: unverified
