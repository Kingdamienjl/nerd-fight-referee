    \ such as Gremmy ThoumeauxCFYOW Volume 2, Page 213) *Fire Manipulation, Passive Heat Manipulation,\
    \ Limited Radiation Manipulation, Self-Sealing, Existence Erasure, Durability Negation & Necromancy\
