    \ **Master Swordsman & Master Marksman *Enhanced Matter Manipulation (Yhwach can reconstruct an object\
    \ such as his chair into footstools for his useBleach Chapter 485) *Forcefield Creation, Corrosion\
    \ Inducement & Body Puppetry (Yhwach can extend his Blut outwards to create a protective barrier with\
    \ Blut Vene Anhaben. Anything that comes into contact with his body is corroded. He can extend his\
    \ Blut even further when someone touches him, allowing him to take their bodyBleach Chapter 607) *Enhanced\
    \ Light Manipulation & Deconstruction (Should scale to Royd Lloyd who can use Kirchenlied: Sankt Zwinger,\
    \ a Quincy spell that creates a formation of light that tears apart anything that steps in it. It\
    \ is the ultimate offensive and defensive Quincy spellBleach Chapter 508) *Danmaku & Enhanced Explosion\
