- id: claim-weaknesses-76a1fa95
  section: weaknesses
  axis: weakness
  text: "Blut Vene and Blut Arterie cannot be used at the same time. Notable Attacks/Techniques Master\
    \ Archer: As the \"sole member of the Kurosaki clan\", Masaki has inherited the skill and experience\
    \ of the previous generations of the Kurosaki bloodline, making her an extremely skilled and experienced\
    \ markswoman, she's capable of releasing arrows with extreme precision and swiftness as she was able\
    \ to \"fight\" an opponent much faster than herself. Reishi Manipulation: As a Quincy she primarily\
    \ absorbs spiritual energy from the atmosphere, and combines it with her own spiritual energy to form\
    \ weapons. She has an easier time collecting this energy in environments with higher concentrations\
    \ of Reishi such as in Soul Society or Hueco Mundo. Hirenkyaku Practitioner: Masaki should be capable\
    \ of using this Quincy high-speed technique. Spiritual Awareness: As a Quincy, Masaki can sense Hollows\
    \ at a significant distance. Great Spiritual Power: Masaki has displayed a great amount of spiritual\
    \ energy. Blut: An advanced Quincy technique which grants inhuman defensive and offensive capabilities,\
    \ however it can't boost both offence and defense simultaneously. Additionally, Blut vene can be used\
    \ to stop blood loss due to injury. Blut Vene: The defensive form of Blut, which grants the user a\
    \ boost in defense by strengthening their skin in a similar fashion to an Arrancar's Hierro. Blut\
    \ Arterie: The offensive form of Blut, which grants the user inhuman attack power. This technique\
    \ is the only thing capable of ensuring a Quincy's attacks can significantly damage a Bankai-wielding\
    \ Shinigami Spirit Weapon: Heilig Bogen (\u795E\u8056\u5F13 (\u30CF\u30A4\u30EA\u30C3\u30D2\u30FB\u30DC\
    \u30FC\u30B0\u30F3), Hairihhi B\u014Dgun; German for \"Holy Bow\", Japanese for \"Sacred Bow\"): Like\
    \ most Quincy, Masaki uses a bow as her primary weapon. * Heilig Pfeil (\u795E\u8056\u6EC5\u77E2 (\u30CF\
    \u30A4\u30EA\u30C3\u30D2\u30FB\u30D7\u30D5\u30A1\u30A4\u30EB), Hairihhi Pufairu; German for \"Holy\
    \ Arrow,\" Japanese for \"Sacred Destruction Arrows\"): By further condensing Reishi, Masaki is capable\
    \ of forming spiritual arrows. * Licht Regen: Masaki charges the reishi in her bow to fire countless\
    \ amounts of arrows upon her foes."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
