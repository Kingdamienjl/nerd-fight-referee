  intelligence:
    text: "Gifted (Beneath her ditzy personality and childish demeanor, Orihime is surprisingly a very\
      \ bright girl. Among Ichigo\u2019s group, she has the second best grades overall, only behind Uryu\
      \ Ishida, and has the third best grades in Karakura High School entirely.Bleach Chapter 35: Can\
      \ You Be My Enemy? Despite the constant struggles of her life, she is able to maintain a steady\
      \ academic standing and leave school with practically little resistance. Having experienced many\
      \ battles and having trained with Ichigo\u2019s teachers, she possesses a similar amount of knowledge\
      \ on the many aspects of the Bleach world from Urahara and many others. She is also very deductive\
      \ and analytical, having entered the Visored\u2019s base of operations on her own despite it being\
      \ blocked off, deducing there was a forcefield by seeing the animals move near the shield and using\
      \ her Shun Shun Rikka to breach it by seeing how it\u2019s similar to her powers.Bleach Chapter\
      \ 225: Slip Into My Barrier In the final battle against Yhwach, Orihime looked into Ichigo\u2019\
      s eyes before he charged in recklessly and read his face to see that he had a greater plan in mind\
      \ than just mindlessly swingingBleach Chapter 675: BLOOD FOR MY BONE.)"
