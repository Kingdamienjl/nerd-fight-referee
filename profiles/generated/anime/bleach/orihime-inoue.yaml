    1: Chapter 1) *Barrier Creation (All of Shun Shun Rikka''s abilities are begot through forcefields
    generated by the Fullbring) Resistance to: *Memory Manipulation (Orihime can remember memoriesBleach,
    Chapter 49: "unchained" that had been erased by RukiaBleach, Chapter 6: "Microcrack) *Limited Extrasensory
