    Manipulation (Orihime''s Fullbring, Shun Shun Rikka''s main ability is the "Rejection of Phenomenon"
    of anything her forcefields interact with, such ability contains many powerful effects and applicationsBleach,
    Chapter 240: "regeneration.") **Limited Law Manipulation (Shun Shun Rikka''s main ability of the rejection
    of phenomena violates divine law set by the gods) **Likely Enhanced Existence Erasure (Orihime can
    reject the phenomenon of one''s existence itself, returning them into a state of non-existenceBleach,
    Chapter 249: "Back to the Innocence", but given Orihime''s kind and caring nature she hasn''t tangibly
    demonstrated this ability in the story yet) **Possibly Regeneration Negation (High, possibly Mid-Godly;
    Shun Shun Rikka could''ve possibly erased the Hogyoku from existence and left it completely destroyed,
    despite the fact it possesses the same level of regeneration as Sosuke Aizen) **Power Nullification
    (Orihime can reject the phenomenon of attacks that interact with her Saten KesshunBleach, Chapter
    43: "Princess and Dragon, Part 3: Six Flowers") **Deconstruction (Atomic; Orihime can reject the "Union
    of Matter" within an object with Koten Zanshun) *Limited Enhanced Invisibility & Intangibility (Orihime
    is given a bracelet by Ulquiorra that makes it so only Arrancar can see her, thus making her invisible
    to Shinigami who have layered sensing, and it also grants her the ability to phase through matter
    as wellBleach, Chapter 237: "goodbye, halcyon days") *Limited Instinctive Reaction (Shiten Koshun
    is a shield that diffuses the impact of an attack and at the same time automatically responds with
    an attack of its ownBleach, Chapter 449: "Not be a Drug") *Healing (Orihime can reject the phenomenon
    of wounds from someone or something, doing so completely heals the object''s physical and spiritual
