- id: claim-powers-and-abilities-2d94864e
  section: abilities
  axis: hax
  text: "*Soul Physiology and Hollow Physiology (Soul: High-Tier - Is a Privaron Espada, which are previous\
    \ members of the Espada that fell out of grace after more powerful and evolutionarily superior Hollows\
    \ where introduced. Even with this however, they are more spiritually incline compared to Fracci\xF3\
    nes classed Arrancar given their previous tenure as an Espada | Hollow: Low-Tier Arrancar - Is an\
    \ Arrancar of high evolutionary scale, being a previous Espada before his dismissal from the organization)\
    \ *Expert Hand-to-Hand Combatant (Gantenbainne is an experienced and competent fighter; given his\
    \ life as a Hollow, which requires constant battles for survival from predators trying to devour the\
    \ soul of anything it can sink its teeth in, to prey who defend themselves against aggressors. This\
    \ \"born through bloodshed\" existence has reinforced Gantenbainne's capabilities tremendously. As\
    \ he is a Fracci\xF3nes class Arrancar, his inherent capabilities with his swordsmanship and hand-to-hand\
    \ abilities would be comparable with other similarly classed contemporaries and adversaries. Gantenbainne\
    \ is able to skillfully clash evenly with Yasutora Sado in his fight with him, doing so on multiple\
    \ occasionsBleach: Chapter 259: Pages 13-15Bleach: Official Character Book 2 Masked: Page 171) *Electricity\
    \ Manipulation and Explosion Manipulation (Gantenbainne can collect and discharged electrical spiritual\
    \ energy from the prongs of his punch daggers;Bleach: Chapter 259: Page 17 which acts as an increase\
    \ in his natural attacking power, and releases a large explosion when usedBleach: Chapter 259: Page\
    \ 15) *Enhanced Energy Projection and Damage Boost (While in his Resurrecci\xF3n, Gantenbainne can\
    \ combine his fist together and release an attack with all of his spiritual energy imbued within it,\
    \ shaped in the form of a dragon made of lightBleach: Chapter 261: Pages 9-10)"
  source_ids: *id003
  decisive: true
  status: unverified
