- id: claim-weaknesses-1124fe48
  section: weaknesses
  axis: weakness
  text: "As a Quincy, Robert doesn't have anti-bodies against Hollows, making them poisonous to his very\
    \ existenceBleach: Chapter 552. Blut Vene and Blut Arterie use two different Reishi systems, so they\
    \ cannot be used at the same time. When using medallion, its user needs to be sufficiency powerful\
    \ to wield itBleach: Chapter 510 and the power stolen by medallion is weaker than the original unless\
    \ the Quincy in question takes the time and effort to master itBleach: Chapter 504. They're also incapable\
    \ of using Voltstandig while having an absorbed BankaiBleach: Chapter 554. Notable Attacks/Techniques\
    \ * Hirenkyaku: Essentially the Quincy version of the Shinigami Shunpo and Arrancar Sonido.Bleach:\
    \ Chapter 349 The Quincy creates platforms of Reishi under their feet to swiftly move around the battlefield.Bleach:\
    \ Chapter 122 * Blut: An advanced Quincy technique which grants one inhuman defensive and offensive\
    \ capabilities; however, it can't boost both offensive and defensive simultaneouslyBleach: Chapter\
    \ 499. ** Blut Vene: The defensive form of Blut, which grants the user a boost in defense by strengthening\
    \ their skin in a similar fashion to an Arrancar's Hierro. Additionally, Blut Vene can be used to\
    \ stop blood loss due to injuryBleach: Chapter 112. ** Blut Arterie: The offensive form of Blut which\
    \ grants the user inhuman attack power. This technique is the only thing capable of ensuring a Quincy's\
    \ attacks can significantly damage a Bankai-wielding ShinigamiBleach: Chapter 498. * thumb|200px|\
    \ * Robert's Sklaveri Sklaveri: Vollst\xE4ndig's basic Reishi Absorption ability pushed to the absolute\
    \ limit. This allows the user to absorb the Reishi that composes spiritual and living beings, an absolute\
    \ subordination of ReishiBleach: Chapter 493. Destroying the Stern Ritter's Halo is the only way to\
    \ stop it. * Rans\u014Dtengai: An advanced Quincy technique created for injured/old Quincy in order\
    \ to control their limbs with strings of Reishi like a puppet. Broken bones and severed tendons mean\
    \ nothing to this as the strings will control the limbs until the body/limb is entirely destroyedBleach:\
    \ Chapter 124. * Shadow: A teleportation ability used by members of the Wandenreich, this technique\
    \ can be used by manifesting the user's shadows in front of themBleach: Chapter 484, creating a portal\
    \ that acts as a gate between the Schatten Bereich and other dimensions. The size of these portals\
    \ can be extended to allow many others to pass throughBleach: Chapter 511. * Medallion: A device possessed\
    \ by select members of the Wandenreich military, including all Sternritter which allows one to steal\
    \ a Shinigami's Bankai or any power that is fundamentally similar to a Shinigami's Bankai"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
