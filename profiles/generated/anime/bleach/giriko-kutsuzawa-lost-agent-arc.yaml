- id: claim-weaknesses-b0ec5355
  section: weaknesses
  axis: weakness
  text: "Once a contract has been implemented and a timer has been set, Giriko cannot interfere with it\
    \ without causing severe damage to himself and othersBleach: Chapter 436: Page 11. Conditions which\
    \ are more complex don't produce as powerful effects compared to more simpler conditions. Note: In\
    \ these scans, Giriko proclaims himself to be the strongest, which can be argued to include those\
    \ he knows the strength of, like Sh\u016Bkur\u014D Tsukishima. The issue with taking this statement\
    \ at face value is that Giriko shouldn't be assumed a credible source, as evidence of him being one\
    \ is unfounded. The statement is only supported by Giriko uttering it and then someone, outside of\
    \ Giriko himself, extrapolating from that utterance a slew of conclusions which aren't directly proven\
    \ by the text. Because of this issue, Giriko's statement is assumed hyperbolic, and is unusable for\
    \ scaling purposes."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-91495fbb
  section: abilities
  axis: hax
  text: '*Soul Physiology and Fullbringer Physiology **(High-Tier - While Giriko isn''t a soul, causing
    him to lack the benefits of having a spiritual composition, he still has spiritual strength that shouldn''t
    be underestimated. Giriko is spiritually strong enough to stand in the presence of Kenpachi Zaraki
    without suffering adverse consequences) **(Low-Tier - Is a member of Xcution, but isn''t among the
    strongest of the group) *Time Manipulation, Law Manipulation, and Fire Manipulation (Giriko''s Fullbringer,
    Time Tells No Lies, calls upon the "God of Time" for assistance. By utilizing the deity''s power,
    Giriko can set specific terms and timers on particular objects. Once these conditions are set and
    the timer has started counting down, nothing can deactivate it without suffering severe consequences.
    If one is foolish enough to try and break the conditions set by Giriko, while in the timeframe designated
    by him, they will be consumed by the flames of timeBleach: Chapter 436: Pages 8-10) **Homing Attack
    (Time Tell No Lies can materialize a set of numbers which home onto his opponentsBleach: Chapter 457:
    Pages 2-3) **Statistics Reduction and Death Manipulation (After acquiring Time Tells No Lies, Giriko
    decided to see how far the extent of its power is. He started by seeing if he can kill someone with
    just his eyesight alone, and his unlucky target was his very own wife. Gradually, she grew weak and
    eventually collapsed and died before himBleach: Chapter 471: Page 6) **Transformation and Statistics
    Amplification (Giriko can transform himself and gain drastically increased physical stats by setting
    conditions and terms desiring an "increase of strength." This can further be enhanced by simplifying
    his desires, such as only desiring an increase in strength and nothing elseBleach: Chapter 463: Page
    15) *Unconventional Fire Manipulation (Time Tell No Lies was responsible for Giriko''s Grandfather
    and his Great-Grandfather remaining unharmed by the constant housefires that plagued the familyBleach:
    Chapter 471: Page 4) *Resistance to Extrasensory Perception when using Bringer Light ( 2 Layers; Using
    Bringer Light makes the user harder to sense via Reikaku, due to the fact it disturbs the surrounding
    reiatsu and reishi to a minimal degreeBleach Chapter 432, Bleach Can''t Fear Your Own World Chapter
    9)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
