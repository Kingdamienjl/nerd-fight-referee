    \ around to start levitating upwardsBleach: Chapter 589) *Kuten Ky\u014Dkoku: **Attack Reflection\
    \ (The partial release of his Zanpakut\u014D, Kuten Ky\u014Dkoku can reflect attacks back to his opponentsCan't\
    \ Fer Your Own World: Chapter 14) *Enraky\u014Dten: **Power Mimicry (His Zanpakut\u014D, Enraky\u014D\
    ten can mimic other Zanpakut\u014D's apperances and can also use their powers when he witnesses them.\
    \ Tokinada can mimic and utilize several Zanpakut\u014D powers at onceCan't Fear Your Own World: Chapter\
    \ 21Can't Fear Your Own World: Chapter 22) Enraky\u014Dten's Copied Zanpakut\u014D"
