    \ whilst still being able to utilize Kido and escapeCan't Fear Your Own World: Chapter 23) *Kid\u014D\
    : **Air Manipulation (With Had\u014D #58: Tenran - Tokinada generates a massive tornado from his blade\
    \ to attack his foeBleach: Chapter 323) **Smoke Manipulation (With Bakud\u014D #21: Sekienton - Tokinada\
    \ generates a large cloud of red smoke to obscure the vision of the targetBleach: Chapter 360) **Healing,\
    \ Energy Manipulation & Projection (Kaid\u014D is a technique that can heal fatal woundsBleach: Chapter\
