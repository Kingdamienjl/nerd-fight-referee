- id: claim-weaknesses-5c1c8998
  section: weaknesses
  axis: weakness
  text: "Tokinda enjoys torturing his enemies instead of outright killing them, can only use other Zanpakut\u014D\
    \ powers provided he has knowledge about them, every time he uses the power of Enraky\u014Dten it\
    \ shaves away at his soul until he dies, the powers of the Zanpakut\u014Ds he is using is proportionate\
    \ to his reiatsu making some weaker than others such as Ry\u016Bjin Jakka not being as hot as Yamamoto's\
    \ {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"\
    1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align: left; |Notable Attacks and Techniques:\
    \ |- | : A Shinigami movement technique which allows the user to move faster than the eye can follow.\
    \ As speed is the main factor of the technique, the method is best characterized by how fast one can\
    \ get from point A to point B in the least amount of steps. *: Spells casted by Shinigami with strong\
    \ enough Reiryoku and Reiryoku control. Kid\u014D is divided into mainly three categories: Had\u014D\
    \ for attacks, Bakud\u014D for battle support and Kaid\u014D for healing. The spells are ranking from\
    \ 1-99 with 1 being the weaker and easier spells to cast and 99 being the most powerful and difficult\
    \ to cast. Skilled users can cast Kid\u014D without the need of an incantation; however, casting without\
    \ incantation does reduce the Kid\u014D's effectiveness less than a third of it's full potential.\
    \ **: A long, white piece of cloth is spun around to incorporate targets within its coils. It teleports\
    \ the targets to another location. **: As the caster places the palms of their hands down on the ground,\
    \ red smoke bursts forth from the point of contact, engulfing the surrounding area and briefly obscuring\
    \ the visions of whomever is within the smoke. **: Upon pointing at their target, the caster generates\
    \ 6 prongs of Reiatsu that close in on the target to immobilize them in place. It restricts all movements.\
    \ **: The caster generates a chain of Reiatsu that wraps around the target to immobilize them. **:\
    \ The caster generates eight orbs of continuous generation of Reiatsu around the target with a ninth\
    \ on the target to immobilize them. **: Upon activation, the caster generates a barrier that is capable\
    \ of the complete nullification of any Had\u014D of the level 89 or lower. However, this barrier is\
    \ not solely limited to Had\u014D as it can nullify the effects of abilities that are similar to Had\u014D\
    . **: Yamamoyo points at his target with his index finger, a small amount of energy is dispelled from\
    \ the tip of the index finger with enough force to thrust a considerable amount of kinetic force at\
    \ a target, which is pushed back a few feet from the practitioner. **: Tokinada gathers high-density\
    \ spiritual energy, which they discharge from both hands. Alternatively, Tokinada points at the intended\
    \ target with their index finger and generates a concentrated bolt of lightning to use against the\
    \ target. **: An electric current is run through any object Tokinada touches, which damages anything\
    \ or anyone which is in contact with the object the current runs through. **: A Kid\u014D net which\
    \ can be accompanied with Red Flame Cannon, which has entangled his opponents, resulting in a large\
    \ explosion around all of them. **: Generating high-temperature flames, Tokinada discharges it from\
    \ one or both hands. The practitioner generates and fires an orb of crimson red energy on his palm\
    \ or finger. The orb can be small, medium, or large, depending on the level of power being used. The\
    \ destructive power released by the blast can vary between a simple explosion to a pillar of energy,\
    \ and in both instances, the spell causes concussive as well as burn damage. **: Raising their Zanpakut\u014D\
    \ horizontally in front of them, Tokinada generates a yellow orb, which widens itself along the length\
    \ of his sword. Once it is fully charged, it fires a wide, horizontal arc of yellow energy at the\
    \ target. One's hand can be used as a catalyst for the spell instead of a Zanpakut\u014D, but it produces\
    \ a shorter arc. **: Blue flames are discharged from the palm of his hand at his target and generates\
    \ a torrent of blue energy before firing it. The energy moves like a direct blast or a large wave\
    \ of energy, dependent on the amount of power which is placed into it. **: An advanced form of Had\u014D\
    \ #33: S\u014Dkatsui, it has twice the effectiveness. Generating blue energy with his index and middle\
    \ fingers, Tokinada makes a pushing motion with both of his palms to push the gathered energy toward\
    \ the target in a concentrated blast. It is essentially a doubled version of S\u014Dkatsui because\
    \ the user fires two bursts of blue energy with much greater potency than the single shot variety.\
    \ **: Tokinada fires an oblong blast of purple energy from their hand which completely incinerates\
    \ a target upon contact. **: Tokinada thrusts his hands outward, causing objects around him to levitate\
    \ and throwing them toward the destination which he chooses. The technique is precise enough to counter\
    \ opposing flying objects. **: Levitating his sheathed Zanpakut\u014D in front of him, Tokinada lightly\
    \ hit"
