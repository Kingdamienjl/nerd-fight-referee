  description: 'however the time limit for the stronger foes is much shorter than
    those on the same level as him. Senescencia: Baraggan''s aspect of death as an
    Espada is aging. He possesses abilities based around time manipulation due to
    it. *Time Dilation Field: A field that surrounds Baraggan that slows the time
    around him. It prevents surprise attacks and slows all attacks while leave the
    attacker open for a counter. *Age Acceleration: Baraggan can rapidly accelerate
    the aging of whatever he touches. It is rapid enough to accelerate the aging of
    Suì-Fēng''s arm to a point of being brittle enough to instantly break. Resurrección:
    The Arrancar equivalent of a Shikai/Bankai'
