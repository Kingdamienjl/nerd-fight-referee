- id: claim-weaknesses-0bfcdbf1
  section: weaknesses
  axis: weakness
  text: 'The barrier he uses to protect himself from the effects of his ability can
    be negated if his Respira somehow enters his own body. Notable Attacks/Techniques:
    Cero: A powerful blast of concentrated spiritual energy fired in a laser like
    fashion that only Hollows, Arrancars, and Visoreds can use. The power, force,
    speed, and blast area of the Cero is dependent on the strength, spiritual power,
    and sometimes skill of the user. *Gran Rey Cero: A much more powerful Cero only
    accessible to the Espada. By mixing their blood with a Cero, the Espada can discharge
    a blast that can distort space and is powerful enough to destroy Las Noches. *Cero
    Oscuras: A powerful Cero that can only be used by the Espada in their Resurrección.
    This Cero is powerful enough to destroy Las Noches as well. Bala: An Arrancar
    ability similar to Cero, except it''s weaker and 20 times faster. Sonído: The
    Arrancar equivalent of Shunpo; however, is more akin to teleporting as the character
    completely disappears from senses from point A to point B. Hierro: An ability
    that allows Arrancars to harden their skin with Reiyroku to defend against incoming
    attacks. Pesquisa: An energy sensing technique that allows Arrancars to sense
    any foes nearby and gauge how strong they are. Descorrer: An Arrancar technique
    that allows them to travel between Hueco Mundo and the Living World. Caja Negacion:
    These cubes are capable of sealing away an enemy from the battlefield for a very
    long time, even foes that are far stronger, however the time limit for the stronger
    foes is much shorter than those on the same level as him. Senescencia: Baraggan''s
    aspect of death as an Espada is aging. He possesses abilities based around time
    manipulation due to it. *Time Dilation Field: A field that surrounds Baraggan
    that slows the time around him. It prevents surprise attacks and slows all attacks
    while leave the attacker open for a counter. *Age Acceleration: Baraggan can rapidly
    accelerate the aging of whatever he touches. It is rapid enough to accelerate
    the aging of Suì-Fēng''s arm to a point of being brittle enough to instantly break.
    Resurrección: The Arrancar equivalent of a Shikai/Bankai, this form allows an
    Arrancar to unleash their true power as a Hollow. Arrogante: Baraggan''s Resurrección
    that is released upon the command Decay. His person is entirely shrouded in a
    dark cloak and his body is transformed to a skeleton with a crown. It grants new
    abilities and further amplifies his previous abilities. *Respira: Baraggan generates
    a miasma that spreads outwards to rapidly age everything caught in it or making
    contact with it. It can even affect inanimate objects or energy projections like
    Kidō. The aging is rapid enough to near-instantly skeletonize Suì-Fēng''s arm
    despite Shinigami being able to live over thousands of years. *Gran Caida: Barragan
    summons a large axe to fight his enemies in close range. File:Senescencia.gif|Senescencia
    File:Respira.gif|Respira File:Gran Caída.gif|Gran Caída ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{Scroll box|{{Reflist|2}}}} ==Notes/Explanations==
    {{scroll box|content=}} {{discussions}} Category:Characters Category:Bleach Category:Age
    Users Category:Anime Characters Category:Antagonists Category:Arrancar Category:Aura
    Users Category:Axe Users Category:BFR Users Category:Chi Users Category:Corrosion
    Users Category:Dimensional Travel Users Category:Durability Negation Users Category:Energy
    Users Category:Enhanced Senses Users Category:Espada Category:Evil Characters
    Category:Extrasensory Perception Users Category:Flight Users Category:Forcefield
    Users Category:Invisibility Users Category:Kings Category:Male Characters Category:Manga
    Characters Category:Non-Physical Interaction Users Category:Paralysis Users Category:Portal
    Users Category:Power Nullification Users Category:Soul Users Category:Space Users
    Category:Spirits Category:Status Effect Users Category:Time Users Category:Transformation
    Users Category:Villains Category:Weapon Masters Category:Blade Users Category:Weapon
    Users'
