  name: 'this form allows an Arrancar to unleash their true power as a Hollow. Arrogante:
    Baraggan''s Resurrección that is release'
  description: 'this form allows an Arrancar to unleash their true power as a Hollow.
    Arrogante: Baraggan''s Resurrección that is released upon the command Decay. His
    person is entirely shrouded in a dark cloak and his body is transformed to a skeleton
    with a crown. It grants new abilities and further amplifies his previous abilities.
    *Respira: Baraggan generates a miasma that spreads outwards to rapidly age everything
    caught in it or making contact with it. It can even affect inanimate objects or
    energy projections like Kidō. The aging is rapid enough to near-instantly skeletonize
    Suì-Fēng''s arm despite Shinigami being able to live over thousands of years.
    *Gran Caida: Barragan summons a large axe to fight his enemies in close range.
    File:Senescencia.gif'
