- id: claim-powers-and-abilities-9e849f32
  section: abilities
  axis: hax
  text: '*Soul Physiology and Hollow Physiology (Soul: High-Tier/Hollow: High-Tier
    Arrancar) *Expert Axemanship (As the Segunda Espada and the previous king of Hueco
    Mundo, Baraggan is an extremely skilled and experienced swordsman, being capable
    of wielding his axe with great precision and timing, but given Baraggan''s boastful
    nature and heavy reliance on his Senescencia he rarely shows off his skill) *Immortality
    (Type 2 - Baraggan can survive after having half of his head blown offBleach:
    Chapter 370) *Self-Sustenance (All Types - Baraggan had most if not all of his
    skin, muscles and internal organs aged awayBleach: Chapter 357, including his
    brain while in Resurreccion but can still function perfectly without them) *Passive
    Time Dilation (Given Baraggan''s aspect of death being "Senescencia"Bleach: Chapter
    356, Baraggan can control and manipulate time within a localized area, doing so
    granting him a couple extremely powerful effects, one of them being a passive
    time dilation field that constantly exudes from his body, this field slows the
    movements of anything that''s trying to interact with him, allowing him to react
    to the attacks of others who would be normally faster than him) *Passive Corrosion
    Inducement, Durability Negation, and Age Manipulation (via Time Manipulation)
    (Barragan''s Resurrección - Arrogante greatly increases the aging properties of
    his base Senescencia to whole different level, with his base form being able to
    age anything he touches, even those of Shinigami who can live for thousands of
    years, this amplified form is applied through a thick, miasmic cloud of black
    vapor, this mist is passively generated by Baraggan and can be exuded either from
    his mouthBleach: Chapter 359 or hands, this vapor can instantly corrode and age
    everything with a life-span, be it inorganic objects like stone or steel, or even
    the bodies of captain-level Shinigami) *Possible Limited Willpower Manipulation
    (Baraggan directly states that he can age "Will and Freedom" but given Baraggan''s
    untimely death he wasn''t able to show off such ability) *Forcefield Creation
    (Baraggan passively exudes a barrier that protects his outside form from his aging
    mist, this barrier doesn''t apply to his insides thoughBleach: Chapter 371) *Limited
    Weapon Creation (Baraggan created Gran Caída from nothingnessBleach: Chapter 360)
    |-|Resistances= *Extrasensory Perception (Using Sonído allows the user to bypass
    Extrasensory PerceptionCan''t Fear Your Own World: Vol 1: Chapter 9) *Limited
    Unconventional Age Manipulation (Barragan passively exudes a barrier that protects
    his outside form from his aging mist, but this barrier doesn''t apply to his insides)
    *Limited Resistance to Information Analysis and Power Mimicry (Roka Paramia is
    unable to replicate Barragan''s RespiraBleach Novel - Spirits Are Forever With
    You; Volume 2; Chapter 18 despite the former being able to replicate any ability
    that she has gathered information on)'
