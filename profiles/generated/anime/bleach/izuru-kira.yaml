    \ and Healing (Izuru is proficient in Kaido, this technique can heal near-fatal\
    \ woundsBleach: Chapter 525 and restore lost Reiryoku at the cost of the user's\
    \ own reservesBleach: Chapter 382), Density Manipulation (Izuru's Zanpakuto -\
    \ Wabisuke's main ability is the multiplication of the weight of something it\
    \ has striked, doing so by 2x everytime, using this Izuru can greatly increase\
    \ the weight of anythingBleach: Chapter 169, usually using this within combat\
    \ to do stuff like cutting the sword of someone multiple times over, to the point\
    \ the person can't even wield their blade at all given the added weight, against\
    \ beings with regeneration capabilities that are above his natural ability to\
    \ nullify he will strike their body countless times to the point the person's\
    \ frame can't take the weight anymore, forcing them down onto their knees and\
    \ causing all of their bones to break and muscles to tear for as long that weight\
    \ effect is still appliedBeginning of the Revive of Tomorrow), Air Manipulation\
    \ (With Had\u014D 58 - Izuru generates a massive tornado from his blade, he usually\
    \ uses this when he's up against flying enemies to bring them down to his levelBleach:\
    \ Chapter 323), Forcefield Creation and Limited Sealing (With the Bakud\u014D\
    \ 39 and 73 - Izuru generates a barrier constructed through his Reiryoku around\
    \ him, blocking outside attacks from hitting himBleach: Chapter 322, with Bakudo\
    \ 73 Izuru can seal people within these diamond-shape barriers as wellBleach:\
    \ Chapter 337)"
