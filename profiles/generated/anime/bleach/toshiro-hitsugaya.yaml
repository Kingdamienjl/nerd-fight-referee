    Rukia''s Sode no Shirayuki which manipulates the temperature around her to generate
    iceBleach, Chapter 568: "HEAR, FEAR, HERE 2", with said ice being able to reach
    Absolute Zero levels of coldnessBleach, Chapter 567: "DANCE WITH SNOWWHITE") *Enhanced
    Non-Physical Interaction (Element & Energy; Shikai Hyōketsu freezes the four elements
    [earth, water, fire and wind in the space that the opponent currently occupies],
    this even froze Gerard''s Heilig Bogen which is entirely composed of energy) *Enhanced
    Aura (Explosive; Toshiro''s aura while an adult has greatly increased, causing
    anyone or anything that tries to touch him to become frozen) Likely Resistance
    to: *Absolute Zero & Power Nullification (Toshiro while in his adult form passively
    exudes temperatures that are equal to the one''s generated by his ice) }}'
