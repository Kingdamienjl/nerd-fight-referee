  intelligence:
    text: Genius. Perhaps the most astonishing trait of Toshiro is his intellect and
      natural talent. He is the most gifted prodigy the Soul Society has had since
      Gin Ichimaru, entering the Soul Reaper Academy on his first try despite his
      young age, graduating from the academy in a single year with the highest written
      and performance scores in each of his classes, joining the Gotei 13 shortly
      afterwards, and then becoming the youngest Soul Reaper to ever reach the rank
      of captain. He has been called many things due to this. Renji and Iba have called
      him a child genius, and Ichimaru has called him the embodiment of the "heavenly
      white angel that blesses Soul Society once a century". In terms of intellect,
      Toshiro is equally impressive. He was the first to suspect Ichimaru of treason,
      and saw that there was more to Rukia's execution than what was being said. Shunsui,
      one of the strongest Soul Reaper in history, states that because he is a genius,
      within 100 years, Toshiro could surpass him. Despite his age, Toshiro has great
      instinct and intuition in battle. He is generally aware of everything in his
      presence, and is also able to see through most deceptions. For example, he discerned
      that Gin Ichimaru was more than he seemed, although he was not yet sharp enough
      to realize it was all part of Aizen's plot. As a captain, he is a capable leader.
      He is given missions from Captain-Commander Yamamoto to lead teams into the
      Human World many times to deal with threats. For example, Toshiro led the team
      sent by Soul Society that reinforced Ichigo's group against the Arrancar. In
      battle, he has great instincts against incoming danger, such as from his reaction
      to Harribel's initial attack after releasing. After losing his Bankai to the
      Sternritter Cang Du, Toshiro was forced to come up with several creative and
      unorthodox methods of using his limited Shikai capabilities, such as combining
      his Zanpakutō powers with Matsumoto's Haineko to create vacuum ice blades, creating
      a wall made of thin, interwoven ice threads and even generating a field of icy
      mist.
    source_ids: *id002
    confidence: 0.95
