    text: 'Genius (One of Gin''s most remarkable and dangerous assets is his magnificent
      intelligence, deception, and manipulative capabilities. He graduated from Shino
      Academy in only 1 year while being around the same age as Byakuya Kuchiki, another
      gifted captain, while both were children, being placed as a seated officer afterwards.Bleach:
      Turn Back The Pendulum 4 His ability of gathering and applying information is
      exceptional, learning the true workings of Aizen''s Kyoka Suigetsu without being
      exposed to it, something no other member of the Soul Society has ever done,
      in addition to exploiting it for his master plan.Bleach: Chapter 414 His deception
      and manipulation are two of his greatest weapons, as he was able to deceive
      the Soul Society into believing that he fully sided with Aizen, allowing him
      to get into his inner circle without trouble, and even hid his Bankai''s true
      ability even from Aizen himself by lying as well as being capable of hiding
      its basic abilities through unnecessary information and mass destruction.Bleach:
      Chapter 400 He is able to completely hide his emotion and killing intentBleach:
