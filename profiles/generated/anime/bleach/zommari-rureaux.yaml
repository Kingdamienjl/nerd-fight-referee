    \ capable of fighting on par with Byakuya KuchikiBleach: Chapter 299), Weapon Control and Limited\
    \ Organic Manipulation (Zommari can levitate his sword when transforming into his Resurrecci\xF3n,Bleach:\
    \ Chapter 300 this also causes pink goo to shoot out from the sword, which proceeds coat Zommari's\
    \ entire body), Body Puppetry, Limited Durability Negation and Danmaku (Zommari's Resurrecci\xF3n\
    \ - Brujer\xEDa grants Zommari the ability of \"Amor\", this ability is brought about through Zommari's\
    \ aspect of death being \"Ecstasy\",Bleach: Chapter 356 what Amor allows Zommari to do is take control\
    \ over any object through marking it with his \"eyes\", he has about fifty of these eyes and he can\
    \ use all fifty at the same time,Bleach: Chapter 301 the \"marking\" of an object is through applying\
    \ an almost invisible stamp which is shot out through these eyes, Zommari can also completely bypass\
    \ the need to mark all the limbs of someone's body to fully control their movements through only marking\
    \ the head of the person), Enhanced Afterimage Creation (With Gemelos Son\xEDdo - Zommari can create\
    \ 5 life-like afterimages of himself with his brand of Sonido, these afterimages are so real that\
    \ cutting them causes blood to shoot out from their wounds), Resistance to Extrasensory Perception\
    \ ( 2 Layers; Using Son\xEDdo allows the user to bypass Extrasensory PerceptionCan't Fear Your Own\
    \ World: Vol 1: Chapter 9 of even captain level opponents)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
