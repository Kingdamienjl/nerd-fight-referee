- id: claim-powers-and-abilities-b5706916
  section: abilities
  axis: hax
  text: "Soul Physiology and Shinigami Physiology (Soul: High-Tier/Shinigami: High-Tier), Master Hand-to-Hand\
    \ Combatant (Fought and exchanged blows equally with Sui FengBleach: Chapter 157), Afterimage Creation\
    \ (With Utsusemi - Yoruichi can create a duplicate of herself that looks exactly like her and bleeds\
    \ when cutBleach: Chapter 118; she creates this clone from an article of clothing), Transformation\
    \ (Yoruichi can transform into a black catBleach: Chapter 116), Barrier Creation (Created barriers\
    \ around the Mimihagi to protect it from Yhwach's attacksBleach: Chapter 618), Statistics Amplification,\
    \ Energy Projection and Electricity Manipulation (With Shunk\u014D, Yoruichi coats dense lightning-based\
    \ kido onto her arms and legs Chapter 158, granting her the ability to generate massive blasts of\
    \ lightning, it also greatly increases her attacking powerBleach: Chapter 663 and speedBleach: Chapter\
    \ 656), Limited Power Nullification (With Hanki - Yoruichi can destroy the kido attacks of others\
    \ through generatingBleach: Chapter 159 an equal but opposite amount of force of kido from her palm),\
    \ Corrosion Inducement (Yoruichi possess a set of ball-shaped throwables which causes those struck\
    \ by them to melt and dissolveBleach: Chapter 619), Supernatural Willpower (Despite being in a state\
    \ where she should have died, Yoruichi was able to power through the pain and talk with AskinBleach:\
    \ Chapter 662), Resistance to Poison Manipulation (Askin is surprised that Yoruichi was still alive\
    \ after being hit by Gift Bad and comments that anyone else would have been dead by then), Sleep Manipulation\
    \ (Yoruichi was not knocked out after being hit with Gift Ball, which can cause people to go unconscious\
    \ moments after contactBleach: Chapter 635), and Limited Paralysis Inducement (Yoruichi was able to\
    \ kick Urahara in the face after being hit by Gift Bad. However, she was not able to completely resist\
    \ it and needed Urahara's help to move again)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
