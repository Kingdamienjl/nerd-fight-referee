  axis: hax
  text: "Soul Physiology, Shinigami Physiology (Soul: High-Tier/Shinigami: High-Tier), Multiple Selves\
    \ and Hollow Physiology (All Types/Hollow: Low Tier Arrancar - After being HollowfiedBleach Chapter\
    \ -99 by Sosuke Aizen, Hachigen's soul became inhabited by a Hollow, giving Hachigen access to multiple\
    \ Hollow techniques such as CeroBleach Chapter 236), Summoning, Statistics Amplification and Transformation\
    \ (Visored's can summon their Hollow Mask at willBleach Chapter 185 that grant them Hollow powers\
    \ and personalities for a limited time, whilst also greatly boosting their statisticsBleach Chapter\
    \ 236 to a level even beyond a BankaiBleach Chapter 383Bleach Chapter 384), Enhanced Healing, Energy\
    \ Manipulation and Energy Projection (Kaido can heal fatal woundsBleach: Chapter 525 and restore lost\
    \ Reiryoku at the cost of user\u2019s own reservesBleach: Chapter 382), Expert Swordsmanship (As a\
    \ former member of the Gotei 13, Hachigen is a well trained swordsmanBleach: Chapter 220), Barrier\
    \ Creation, Energy Manipulation and Space-Time Manipulation (Hachigen possesses a power similar to\
    \ Orihime Inoue that he dubs \"Time-Space Regression\" that he uses to repair things), Invisibility,\
    \ Illusion Creation, and Enhanced Senses and Extrasensory Perception Negation (The Hachgyo Sogai blocks\
    \ the area that it covers from other's perceptions, including Soul ReapersBleach Chapter 225), Sealing,\
    \ Paralysis Inducement, Cloth Manipulation, Summoning, Creation, and Limited Iron Manipulation (Seals\
    \ his opponent using metal bars and cloth using Bakudo spells such as Bakudo 99Bleach Chapter 218),\
    \ Forcefield Creation, Limited Durability Negation, Teleportation (Hachi can use multiple Kido to\
    \ create offensive barriers he can throw at his opponentBleach Chapter 658 or teleport inside themBleach\
    \ Chapter 370), Resistance to Extrasensory Perception when using Sonido while Hollowified (The Vizards\
    \ are capable of using Sonido when they are HollowifiedKubo's Club: 400, allowing them to make it\
    \ difficult for their opponents to detect themBleach Can't Fear Your Own World, Vol. 2 Chapter 9)"
  source_ids: *id003
  decisive: true
  status: unverified
