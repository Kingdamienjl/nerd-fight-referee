- id: claim-weaknesses-b4961106
  section: weaknesses
  axis: weakness
  text: "He has genuine overconfidence. He also tends to think too much during actual\
    \ battles. Notable Attacks and Techniques: *: A Shinigami movement technique which\
    \ allows the user to move faster than the eye can follow. It consists of three\
    \ stages, Joritsu, Bakkyaku, and Shunpo-The concept of posture or stance in martial\
    \ arts, it involves how a practitioner maintains balance, which is crucial for\
    \ effective technique execution. -The concept of withdrawing or pulling back the\
    \ leg in martial arts, it often refers to a specific leg or technique in various\
    \ martial arts.Klub Outside Q&A A570. As speed is the main factor of the technique,\
    \ the method is best characterized by how fast one can get from point A to point\
    \ B in the least amount of steps. *: The initial release to a Shinigami's Zanpakut\u014D\
    . It is activated by a command while declaring the name of the Zanpakut\u014D\
    \ Spirit. It changes the shape of the Zanpakut\u014D and/or granting special abilities.\
    \ Tenjiro's release command is \"Heavenly Flash!\". **: Kirinji uses the light\
    \ that Kinpika radiates to momentarily blind his enemies, and it also seems to\
    \ give him an increase in striking power. thumb|200px|Kirinji summons water *Hot\
    \ Spring Water Manipulation: Tenjiro is capable of summoning and manipulating\
    \ hot spring water from his hot springs to burn and drain opponents of their Blood\
    \ on contact and reiatsu or heal and revitalize allies. *: Spells cast by Shinigami\
    \ with strong enough Reiryoku and Reiryoku control. Kid\u014D is divided into\
    \ mainly three categories: Had\u014D for attacks, Bakud\u014D for battle support\
    \ and Kaid\u014D for healing. The spells are ranking from 1-99 with 1 being the\
    \ weaker and easier spells to cast and 99 being the most powerful and difficult\
    \ to cast. Skilled users can cast Kid\u014D without the need of an incantation;\
    \ however, casting without incantation does reduce the Kid\u014D's effectiveness\
    \ less than a third of its full potential."
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-57c029f4
  section: abilities
  axis: hax
  text: "*Soul Physiology & Shinigami Physiology (Soul: High-Tier/Shinigami: High-Tier)\
    \ *Immortality (Types 1, 2, 3, 4 & 8; The life essence of each Royal Guard member\
    \ is linked to the Reimyaku of the Soul King Palace and therefore they are able\
    \ to be revived by calling their name as long as the Soul King Palace itself continues\
    \ to existBleach: Can't Fear Your Own World, Prologue 1. The Royal Guard can survive\
    \ fatal injuries without initially regeneratingBleach, Chapter 611: \"Reio's Death\"\
    ) **Regeneration (Mid; The Royal Guard can regenerate from the utter destruction\
    \ of their torsos and being decapitated, though they need someone to call their\
    \ name to do this possibly Mid-Godly; As stated above, Squad Zero can be revived\
    \ as long as their castles in the Royal Palace are intact. Because of this, it\
    \ is possible they could regenerate from the complete destruction of their body\
    \ and soul, which would also result in their mind being destroyed) **Resurrection\
    \ (Squad Zero can be revived as long as their castles remain intact, though they\
    \ need someone else to call their names to revive them) *Master Spearman & Master\
    \ Martial Artist (Kirinji as a member of the Royal Guard is a highly skilled combatant\
    \ with centuries of experience) *Genius Intelligence *Water Manipulation, Corrosion\
    \ Inducement, High Temperature Manipulation and Blood Manipulation (Kirinji can\
    \ manipulate the hot springs water in the Soul King's palace offensivelyBleach:\
    \ Chapter 588 or to replace the blood of his comradesBleach: Chapter 602) *Kinpika:\
    \ **Minor Light Manipulation (When releasing his Shikai, Kirinji's Zanpakut\u014D\
    \ exudes a bright lightBleach: Chapter 588) *Healing & Energy Projection (Kirinji\
    \ taught Unohana Kaido.Bleach: Chapter 517 This technique can heal fatal woundsBleach:\
    \ Chapter 525 and restore lost Reiryoku at the cost of user's own reserves.Bleach:\
    \ Chapter 382 Kirinji can even use Kaido to heal his own body in the midst of\
    \ a battle) Resistance to: *High Temperatures & Corrosion Inducement (Able to\
    \ bathe in his own hot spring, and without protection, the water can cause the\
    \ spiritual being's bodies to erode and rupture from exposure to the watersBleach:\
    \ Chapter 519) *Mind Manipulation & Empathic Manipulation (Possesses an Oken,\
    \ which allows those who possess it to resist Pepe's Love Schrift)Bleach: Chapter\
    \ 595"
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
