- id: claim-weaknesses-5e2b8e5d
  section: weaknesses
  axis: weakness
  text: "Blut Vene and Blut Arterie use two different reishi systems, so they cannot\
    \ be used at the same time. The Zombie does not work on living Quincies, and Giselle's\
    \ zombies are controlled by her blood in their system, or on their body, so if\
    \ this blood is lost or somehow replaced, they will no longer be under her control.\
    \ When using a medallion, its user needs to be sufficiently powerful to wield\
    \ it and the power stolen by the medallion is weaker than the original unless\
    \ the Quincy in question takes the time and effort to master it. Quincy are unable\
    \ to activate their Vollst\xE4ndig after they stole power with the medallion.\
    \ {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"\
    1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align:\
    \ left; |Notable Attacks and Techniques: |- | File:The Zombie.gif|The Zombie File:Zombie\
    \ Army.gif|Giselle's army of zombified Shinigami File:582Giselle's bow.png|Giselle's\
    \ Heilig Bogen *: Giselle's Schrift which enables her to turn anyone splashed\
    \ with her blood into a corpse that obeys her every command. Further, she can\
    \ heal others with her ability by manipulating dead bodies and reforming them,\
    \ as well as healing via blood and turning 'fresh' corpses into more powerful,\
    \ intelligent zombies. The amount of blood needed for zombification depends on\
    \ the amount of Reiatsu. For those with low Reiatsu, she only needs a drop of\
    \ blood, but those with high Reiatsu, she needs to put her blood directly into\
    \ the heart to spread to all parts of the body, this is why zombified individuals\
    \ with high Reiatsu have reddish skin. **Healing: The Zombie also allows Giselle\
    \ to heal herself and her allies using the flesh of the deceased, implanting it\
    \ into their body to restore lost limbs and lethal injuries, such as being stabbed\
    \ through the heart. She can also easily reattach her zombie's limbs. *: An advanced\
    \ Quincy technique which grants one inhuman defensive and offensive capabilities,\
    \ however it can't boost both offensive and defensive simultaneously. **: The\
    \ defensive form of Blut, which grants the user a boost in defense by strengthening\
    \ their skin in a similar fashion to an Arrancar's Hierro. Additionally, Blut\
    \ Vene can be used to stop blood loss due to injury. **: The offensive form of\
    \ Blut which grants the user inhuman attack power. This technique is the only\
    \ thing capable of ensuring a Quincy's attacks can significantly damage a Bankai-wielding\
    \ Shinigami. *: Essentially the Quincy version of the Shinigami Flash Step and\
    \ Arrancar Sonido. The Quincy creates platforms of Reishi under their feet to\
    \ swiftly move around the battlefield. *: An advanced Quincy technique created\
    \ for injured/old Quincy in order to control their limbs with strings of Reishi\
    \ like a puppet. Broken bones and severed tendons mean nothing to this as the\
    \ strings will control the limbs until the body/limb is entirely destroyed. *:\
    \ A teleportation ability used by members of the Wandenreich, this technique can\
    \ be used by manifesting the user's shadows in front of them, creating a portal\
    \ that acts as a gate between the Schatten Bereich and other dimensions. The size\
    \ of these portals can be extended to allow many others to pass through. File:Giselle\
    \ Sklaveri.gif|Giselle's Sklaverei File:Azhalbiora.gif|Giselle's Quincy: Vollst\xE4\
    ndig, Azhalbiora File:Dancing Dead Boys Club.gif|Dancing Dead Boys Club File:Munchy\
    \ Munchy Babies.gif|Munchy Munchy Babies *: The Wandenreich's improvement on the\
    \ Letz Stile, with all the advancements and none of the drawbacks. It allows the\
    \ user to absorb Reishi from their environment at a rate beyond their limits.\
    \ This can be used for more powerful attacks, wings for faster flight, enhancing\
    \ the effects of Schrift (including access to Schrift abilities), and a near-endless\
    \ supply of fuel for abilities like Blut, Hirenkyaku and Heilig Pfeil. **: Vollst\xE4\
    ndig's basic Reishi Absorption ability pushed to the absolute limit. This allows\
    \ the user to absorb the Reishi that composes spiritual and living beings, an\
    \ absolute subordination of Reishi. Destroying the Stern Ritter's Halo is the\
    \ only way to stop it. **: Giselle generates several cartoonish skeletal figures\
    \ to attack her opponents with. **: Forming skull-like constructs in front of\
    \ her hands, Giselle charges towards her opponent. |}"
