      mopping the floor with the majority of the Gotei 13''s fighting force, making
      him superior to a Gotei 13 Squad, and thus superior to the nerfed power of a
      regular Squad 0 member1.1683 Zettatons possibly 20.08 TeraFoe) | At least Galaxy
