      casually crush Grimmjow,Bleach, Chapter 245: "THE WAY WITHOUT ENEMIES" he''s
      superior to all the Espada,Bleach, Chapter 375: "EXecution, EXtinction"Bleach,
      Chapter 376: "EXecution, EXtinction 2" which is supported by Gin claiming Aizen''s
      immense power is what subjugated the Espada,Bleach, Chapter 390: "Beyond the
      Death Understanding" and the fact that the Espada are referred to as weak as
      pawns in comparison to Aizen. Aizen easily cuts down Shinji,Bleach, Chapter
      387: "Ignited" and implies he is far superior to Striped Hollow Mask Ichigo,
      Aizen beats the dog out of Bankai Komamura, he drops Love and Rose,Bleach, Chapter
      391: "The Blazing Glaciers" he nullifies Nigeki Kessatsu with his raw spirit
      energy, and then he one shots Shinji, Sui-Feng, Toshiro, and Shunsui. Downscales
      from Yamamoto for having survived a significant fraction of his Hado 96 explosion
      while being at the epicenterBleach Chapter 395Bleach Chapter 396 He claims his
      powers were superior to anyone''s in Soul Society, which the databooks support,
      and while this might not be literally true, as Aizen concedes inferiority to
      Yamamoto, it still indicates he is among the strongest people alive. Aizen also
      states he only was wary of Yamamoto and Zaraki''s potential,Bleach Spirits Are
      Forever With You implying that Unohana is below the likes of Aizen; furthermore,
      nerfed Squad 0 members didn''t even use the power of an entire Gotei squad,Bleach:
