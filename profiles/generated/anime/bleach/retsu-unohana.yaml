- id: claim-powers-and-abilities-c81336f3
  section: abilities
  axis: hax
  text: 'Soul Physiology and Shinigami Physiology (Soul: High-Tier/Shinigami: High-Tier),
    Master Hand-to-Hand Combatant (Unohana is skilled in interweavingBleach: Chapter
    524 martial arts into her swordplay), Master Swordswoman (As the first Kenpachi,
    and one of the oldest and most experienced swordswomen in the Gotei 13, Unohana
    is a master of the sword. Unohana has fought for several centuries and has mastered
    several forms of sword fighting. She was so skilled in fighting that she had no
    equal amongst the hundreds of Rukongai criminalsBleach: Chapter 523. Her skill
    and knowledge of sword styles and combat is so extensive, she titled herself “Yachiru,”
    which translates to “8000 styles” as a symbol of how many sword styles she mastered.
    Unohana is capable of out fighting the likes of Kenpachi Zaraki and “killing”
    him several times in their sword fight), Summoning, Flight, Limited Animal Manipulation,
    Acid Manipulation and Healing (True Flight - Unohana’s Shikai creates a large
    sting ray like creature that she can control and use to fly. The stomach acids
    of this creature can heal the injuries of several people at onceBleach: Chapter
    154), Enhanced Healing, Statistics Amplification, Durability Negation, Blood Manipulation
    and Corrosion Inducement (Unohana’s Bankai creates a fountain of blood from its
    BladeBleach: Chapter 527. This blood has shown the ability to “melt” away the
    skin, muscles and tendons of someone, leaving only bones and eyeballs behind),
    Further Enhanced Healing, Energy Manipulation and Energy Projection (After being
    trained by Tenjiro KirinjiBleach: Chapter 517, Unohana became a master in KaidoBleach:
    Chapter 526. This technique can heal fatal woundsBleach: Chapter 525 and restore
    lost Reiryoku at the cost of user’s own reservesBleach: Chapter 382. Unohana can
    even use Kaido to heal her own body in the midst of a battle)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
