- id: claim-powers-and-abilities-2a8f4ef7
  section: abilities
  axis: hax
  text: "*Soul Physiology and Hollow Physiology (Soul: High-Tier/Hollow: High-Tier Arrancar) *Expert Swordsman\
    \ (As the Noveno Espada and a being which has absorbed the skills and experiences of countless hollows,\
    \ Aaroniero is an extremely skilled and experienced swordsman, this is compounded on by the fact he\
    \ has absorbed the skill level and experience of Kaien Shiba, a lieutenant of the Gotei 13 which was\
    \ considered a prodigy at Zanjutsu, the swordsman art within The Soul SocietyBleach: Chapter 83) *Absorption,\
    \ Power Absorption, Limited Power Nullification and Shapeshifting (Soul, Memories, Skill and Powers\
    \ - Aaroniero's Zanpakuto is completely unique among the Espada, with it not being a sword but rather\
    \ a set of tentacles which are biologically attached to his left arm,Bleach: Chapter 267 this appendage\
    \ allows Aaroniero to absorbed the spiritual energy, powers, thoughts, memories and experiences of\
    \ dead Hollows, this ability is referenced by Aaroniero as \"ultimate evolution\" since he can constantly\
    \ get stronger and \"evolve\" the more hollows he kills and eats, this even extends to souls which\
    \ have been consumed by hollows and aren't in themselves hollows like Kaien Shiba, absorbing all of\
    \ his experience, memories, power and even his Zanpakuto, Aaroniero's tentacles also have the added\
    \ bonus of destroying a Zanpakuto every singular night if it's touched by one of his tentacles,Bleach:\
    \ Chapter 135 finally Aaronerio can shapeshift his appearance and spiritual energy signatures to match\
    \ anything he has absorbed, like changing his appearance to that of Kaien Shiba to completely fool\
    \ Rukia Kuchiki,Bleach: Chapter 263 someone who possesses the ability to read the different types\
    \ of spiritual ribbons with Reiraku,Bleach: Chapter 35 Aaroneiro's Resurrecci\xF3n - Glotoner\xED\
    a allows Aaroniero to access all the abilities he has absorbed and use them all at the same time)\
    \ *Size Manipulation (Aaroniero's Resurrecci\xF3n greatly increases his size) *Possession and Fusionism\
    \ (Aaroniero has all the abilities of Metastacia after consuming its body, with Metastacia having\
    \ the ability to fuse with and possess anyone that was invaded by its tentaclesBleach: Chapter 136)\
    \ *Water Manipulation (Aaroniero has access to the Zanpaktou of Kaien Shiba, which is called Nejibana,\
    \ Nejibana allows Aaroniero to create and manipulate waterBleach: Chapter 265) *Telepathy and Limited\
    \ Information Analysis (Aaroniero can telepathically send data of his opponent to other Espada instantly\
    \ with Ninshiki DokiBleach: Chapter 269) *Extrasensory Perception (2 Layers; Using Son\xEDdo allows\
    \ the user to bypass Extrasensory PerceptionCan't Fear Your Own World: Vol 1: Chapter 9 of even captain\
    \ level opponents)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
