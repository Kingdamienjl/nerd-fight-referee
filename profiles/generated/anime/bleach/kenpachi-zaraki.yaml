- id: claim-powers-and-abilities-345a270e
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Content= *Soul Physiology & Soul Reaper Physiology
    (Soul: High-Tier/Soul Reaper: High-Tier) *Master Swordsman & Adept Hand-to-Hand
    Combatant (As a captain of The Gotei 13, specifically the Captain of the 11th
    divisionBleach, Chapter 103: "Dominion", which is the main combat unit of the
    entire military structure of Soul SocietyBleach, Chapter 120: "Shake Hands with
    Grenades", Kenpachi''s is extremely skilled and experience in all forms of full-frontal
    combat, be it with swordsBleach, Chapter 525: "Edges" or with handsBleach, Chapter
    307: "Bite it, Slash it", having train countless decades on both aloneBleach,
    Chapter 114: "Everything Relating to the Crumbling World" and had countless battles
    against opponents, Kenpachi has become one of the most skilled swordsman within
    the entirety of Soul SocietyBleach, Chapter 526: "The Battle", allowing him to
    fight on part with and then eventually outskill the likes of Retsu Unohana, someone
    with far more experience than KenpachiBleach, Chapter 524: "The Drop" and someone
    who knows 8,000 different sword stylesBleach, Chapter 523: "words of origin",
    this level of skill is enhanced by the fact Kenpachi has insane levels of reflexes
    and instinct, allowing him to dodge attacks through touch alone after having all
    of his main senses,Bleach, Chapter 147: "Countdown to the End: 3 (Blind Light,
    Deaf Beat)" alongside his spiritual pressure senses removed by Tosen''s Bankai)
    *Space-Time Manipulation (Kenpachi''s battle with Cien caused a hole within space-timeBleach:
    Spirits Are Forever With You Vol 2) *Possibly Enhanced Non-Physical Interaction
    (Elemental, 2 Layers; Kenpachi is stated to probably be capable of cutting "Air",
    allow him to damage Azashiro who can phase through the attacks of Captain-class
    Soul Reapers who can interact with Spirit Ribbons which are intangible to regular
    Soul Reapers who can interact with intangible souls like Pluses) *Instinctive
    Reaction (Kenpachi reflexively reacts towards attacks that are comparable to him
    in speed, even after having all of his senses and ability to sense spiritual energy
    removed by Tosen''s Bankai, Kenpachi was able to reflexively react towards his
    attacks through feeling his blade cross his skin and instinctively moving out
    of the way.) *Passive: **Illusion Creation & Pain Manipulation (Kenpachi''s Reiatsu
    is able to put people under illusions which feel like "you were being tripped
    over a mountain of needles"Can''t Fear Your Own World: Vol 2: Chapter 14) **Deconstruction
    (Molecular; Kenpachi''s Reiatsu is stated to cause Reishi to burn and crumble
    away) **Spatial Manipulation (Kenpachi''s Reiatsu caused the walls of the Garganta
    to crack apart) *Nozarashi: **Spatial Manipulation (Kenpachi can cut through space
    while in ShikaiBleach, Chapter 578: "The Undead 5", this effect should extend
    to his Bankai as well) ***Durability Negation (Spatial; Through Nozarashi Kenpachi
    can cut through space itself, Kenpachi''s sword while in Bankai should contain
    this effect as well) *Bankai: **Berserk Mode & Enhanced Statistics Amplification
    (While in Bankai, Kenpachi becomes a mindless monster whose only purpose is to
    cut and kill his opponentBleach, Chapter 669: "Blade II", his Bankai also greatly
    increase the speed and attacking power of Kenpachi, allowing him to cleave through
    opponents casually which were massively stronger than him previously while in
    ShikaiBleach, Chapter 668: "Bigger, Faster, Stronger") Resistance to: *Durability
    Negation (Kenpachi''s Reiatsu is able to harden his organs to protect against
