  intelligence:
    text: Gifted (Despite his seeming disregard for any strategy and his self-admitted
      aversion to thinking, Kenpachi has regularly displayed more understanding than
      one would expect. Even Byakuya was impressed by Kenpachi's ability to understand
      things he has no personal experience with. He is very adept at finding and exploiting
      weaknesses in his opponents' techniques, and likewise at adjusting to his opponent's
      attack patterns and battle methods to better counter them. This was demonstrated
      when he was subdued by Kaname Tōsen's Bankai, leaving him with only his blade
      and sense of touch, which prompted him to let Tōsen strike him simply so he
      could catch his opponent. He is also deceptively insightful, able to notice
      subtle traits in people and see what drives a person's actions; he correctly
      singled out Kaname Tōsen and Gin Ichimaru as the only captains who are afraid
      to die. He possesses sharp intuition towards incoming danger, which allowed
      him to repeatedly dodge Tōsen's assault while still affected by his Bankai.
      While claiming not to have any common sense, Kenpachi can still theorize, as
      he deduced that Gremmy Thoumeaux's The Visionary only works on one target at
      a time and all effects on a previous target will disappear.)
    source_ids: *id002
    confidence: 0.95
