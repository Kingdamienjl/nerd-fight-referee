  intelligence:
    text: Genius, Despite his laid-back attitude, Shunsui has repeatedly shown himself
      to be a perceptive and insightful man. According to Yamamoto, even when he was
      younger, Shunsui has always had an eye for seeing the true character of anyone
      he meets. He was also one of the few people to suspect that Aizen was hiding
      something. In battle, Shunsui has proven to be very adept at noticing and understanding
      details in an opponent's skills or attack patterns. During his battle against
      Chad, he quickly determined the basics behind Chad's Reiryoku blasts, warning
      him about those kinds of techniques, and even explaining that his energy blasts
      would eventually use up his life energy. Shunsui has also proven himself very
      persuasive. Shortly after becoming Captain-Commander, he was able to convince
      Central 46 to agree to all his new requests.
