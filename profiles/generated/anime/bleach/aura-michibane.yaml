    Fear Your Own World Chapter 13), Statistics Reduction and Status Effect Inducement (Aura can diminish
    the physical ability, disturb the reiatsu and dull the weapon of an individual that makes contact
    with her FullbringBleach Can''t Fear Your Own World Chapter 10), Elemental Manipulation (Was able
    to form water and magma dragonsBleach Can''t Fear Your Own World Chapter 13), Blood Manipulation (Aura
    can form dragons by using a spurt of blood, these dragons can also swallow peopleBleach Can''t Fear
    Your Own World Chapter 13), Matter Manipulation (Atomic - Aura can manipulate the soul of nitrogen
    to make things such as a barrier for herselfBleach Can''t Fear Your Own World Chapter 13, she can
    utilize Fullbring to rearrange her body at the molecular levelBleach Can''t Fear Your Own World Chapter
    23, and can also subjugate the reishi of kidoBleach Can''t Fear Your Own World Chapter 13), Barrier
    Creation (Controlled the soul in Nitrogen in order to create a barrierBleach Can''t Fear Your Own
    World Chapter 13), Intangibility (She can manipulate her body at the brain and blood cell level to
    turn into smokeBleach Can''t Fear Your Own World Chapter 10, 13, she can also phase through her enemies
    attacksBleach Can''t Fear Your Own World Chapter 19), Enhanced Invisibility (Can make herself invisibleBleach
    Can''t Fear Your Own World Chapter 10), Resistance to Extrasensory Perception (When she disperses,
    she cannot be sensedBleach Can''t Fear Your Own World Chapter 10), Limited Resistance to Extrasensory
    Perception when using Bringer Light (Using Bringer Light makes the user harder to sense, due to the
    fact it disturbs the surrounding reiatsu to a minimal degreeBleach Chapter 432, Bleach Can''t Fear
    Your Own World Chapter 9)'
