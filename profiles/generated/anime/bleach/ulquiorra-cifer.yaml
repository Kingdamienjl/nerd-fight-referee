  attack_potency:
    text: At least Continent level+ (As an Espada, Ulquiorra would be stronger than
      the Privaron Espada, such as DordoniBleach Chapter 250Bleach Chapter 251Bleach
      Chapter 254Bleach Official Character Book 2 Masked, since Nnoitora claims the
      current Espada are stronger than the previousBleach Chapter 292, which is supported
      by the databooks which claim the Espada are above all other ArrancarBleach Official
      Character Book 2 Masked, and the power of the Espada make the Fracción's pale
      in comparisonBleach Chapter 209; additionally, the Espada are ranked according
      to their power, making Ulquiorra stronger than NnoitoraBleach Official Character
      Book 2 MaskedBleach Official Character Book 3 Unmasked. Only three people in
      the World of the Living can combat Ulquiorra, which likely included Kisuke and
      YoruichiBleach Chapter 191Bleach Chapter 193Bleach Chapter 194Bleach Chapter
      198, Ulquiorra is also capable of gaining the upper hand against both Kisuke
      and Yoruichi while they protect OrihimeBleach Official Character Book 2 Masked,
      prior to Ichigo's final fight with Grimmjow, Ulquiorra completely overwhelms
      a Hollowfied Bankai IchigoBleach Chapter 270Bleach Chapter 271. Ulquiorra can
      casually press and cut through a Black Getsuga from post-final Grimmjow fight
      Bankai IchigoBleach Chapter 339Bleach Chapter 340, upon getting angry, he easily
      overwhelms this IchigoBleach Chapter 341Bleach Chapter 342, and Ichigo needs
      to enhance his Hollowfied strikes with a Black Getsuga in order to press UlquiorraBleach
      Chapter 3443.8945 Petatons), Multi-Continent level with Gran Rey Cero (Gran
      Rey Cero is the most powerful enhanced version of the CeroBleach Official Character
      Book 2 Masked, making it a greater amplification than Cero Oscuras which is
      10xBleach Official Character Book 3 Unmasked, it was calculated to be this strong
      but scales higher via powerscaling38.9448 Petatons), at least Multi-Continent
      level with Resurrección (His Resurrección is noteable for its offensive abilityBleach
      Official Character Book 3 Unmasked, he is stronger than Resurrección Nnoitora,
      can cut off a Hollowfied Bankai Ichigo's head and utterly overpowers IchigoBleach
      Chapter 345Bleach Chapter 347. His Resurrección multiplies his power by 10x,
      as the releases of Espada numbered 4 are up are considered stronger than Cero
      Oscuras and considered to be similar in strength to the Gran Rey CeroBleach
      Chapter 34538.9448 Petatons), higher with Cero Oscuras (All Espada can use this
      technique in their release formsBleach Chapter 346 which amplifies their normal
      Cero by 10x, and Ulquiorra completely shattered Ichigo's Hollow Mask, which
      Uryu sensed occurBleach Chapter 347389.4479 Petatons), far higher with Gran
      Rey Cero (It is the ultimate Cero, it was calculated to be this strong but scales
      higher via powerscaling), at least Multi-Continent level with Segunda Etapa
      (Ulquiorra effortlessly overpowers Uryu and OrihimeBleach Chapter 349, Uryu
      describes Ulquiorra's Segunda Etapa as unlike anything he's ever encounteredBleach
      Chapter 348, which would include Ulquiorra's Resurrección Cero Oscuras, and
      this is consistent as now Ulquiorra can shatter Ichigo's Hollow Mask with mere
      physical strikes, eventually killing IchigoBleach Chapter 348389.4479 Petatons),
      higher with Cero Oscuras (Cero Oscuras is a 10x increase to regular Ceros3.8945
      Exatons), far higher with his strongest attacks (Gran Rey Cero is the ultimate
      Cero, and Ulqiorra's Lanza del Relampago is his hardest attack to control, forcing
      a Full Hollow Ichigo to sharpen his claws to crush it, and even cut through
      that Ichigo's horn while he was off guardBleach Chapter 351Bleach Chapter 352,
      it was calculated to be this strong but it scales higher via powerscaling)
