- id: claim-weaknesses-f43f897c
  section: weaknesses
  axis: weakness
  text: 'Ulquiorra has difficulty controlling Lanza del Relámpago''s trajectory. {|
    class="mw-collapsible mw-collapsed" align="center" border="1" cellpadding="1"
    cellspacing="1" style="width:100%" | colspan="2" style="text-align: left; |Notable
    Attacks/Techniques: |- | UlquiorrasCero.gif|Ulquiorra using a Cero GranRayCero.gif|Gran
    Rey Cero CeroOscuras.gif|Ulquiorra using the Cero Oscuras UlquiorraBala.gif|Ulquiorra
    killing Shinigami with his Bala Ulquiorra Descorrer.gif|Ulquiorra using Descorrer
    Ulquiorra Regeneration.gif|Ulquiorra''s regenerative abilities SolitaVista.gif|Ulquiorra
    using Solita Vista *{{Nihongo|Cero|{{Ruby|虚閃|セロ}}|Sero}}: A powerful blast of
    concentrated spiritual energy fired in a laser like fashion that only Hollows,
    Arrancars, and Visoreds can use. The power, force, speed, and blast area of the
    Cero is dependent on the strength, spiritual power, and sometimes skill of the
    user. **{{Nihongo|Gran Rey Cero|{{Ruby|王虚の閃光|グラン・レイ・セロ}}|Guran Rei Sero}}: A much
    more powerful Cero only accessible to the Espada. By mixing their blood with a
    Cero, the Espada can discharge a blast that can distort space and is powerful
    enough to destroy Las Noches. **{{Nihongo|Cero Oscuras|{{Ruby|黒虚閃|セロ・オスキュラス}}|Sero
    Osukyurasu}}: A powerful Cero that can only be used by the Espada in their Resurrección.
    This Cero is powerful enough to destroy Las Noches as well. *{{Nihongo|Bala|{{Ruby|虚弾|バラ}}|Bara}}:
    An Arrancar ability similar to Cero, except it''s weaker and 20 times faster.
    *{{Nihongo|Descorrer|{{Ruby|解空|デスコレール}}|Desukoreru}} A technique used by Arrancar
    to travel between Hueco Mundo and other worlds, creating a spiritual pathway called
    a Garganta with a gesture, walking through this portal to arrive at their destination
    in an instant. Ulquiorra can use multiple Garganta as screens to show other locations.
    *{{Nihongo|Hierro|{{Ruby|鋼皮|イエロ}}|Iero}}: A defensive technique used by Arrancar
    that toughens their skin by reinforcing it with condensed Reiryoku, allowing an
    Arrancar to confront an armed Shinigami with their bare hands. All Arrancar use
    this ability in some form to gain their supernatural toughness, but even an exceptionally
    powerful Hierro can be bypassed by focusing one''s Reiryoku to a finer, sharper
    point. *{{Nihongo|High-Speed Regeneration|{{Ruby|超|ちょう}}{{Ruby|速再生|そくさいせい}}|Chōsoku
    Saisei}}: An ability possessed by most Hollows, which allows them to rapidly recover
    from wounds. Abandoned by most Hollow and Arrancar in favor of more power, Ulquiorra
    has retained his regenerative ability, which is enough to quickly heal lost limbs
    and his lost eyes, but it cannot regenerate his brain and other internal organs.
    *{{Nihongo|Pesquisa|{{Ruby|探査神経|ペスキス}}|Pesukisu}}: A perception technique used
    by Arrancar, which sends out a pulse that detects nearby sources of Reiatsu and
    gauging their power. Ulquiorra is particularly skilled in the use of this technique,
    allowing him to instantly determine how powerful an opponent is with a single
    glance and comprehend the flow of their energy. *{{Nihongo|Solita Vista|{{Ruby|共眼界|ソリタ・ヴィスタ}}|Sorita
    Visuta}}: Ulquiorra can replay events he has seen for others by removing and crushing
    his eye, which turns to dust and flows around those he wishes to share the vision
    with, relaying his sight and feelings. *{{Nihongo|Sonído|{{Ruby|響転|ソニード}}|Sonīdo}}:
    A technique used by Arrancar that allows for high-speed movement, effectively
    analogous to the Shunpo used by Shinigami, and used in bursts to traverse distances
    quickly and fight at these high speeds. Ulquiorra Reiatsu.gif|Ulquiorra''s Reiatsu
    in his released state Luz De La Luna.gif|Ulquiorra using Luz de la Luna Latigo.gif|Ulquiorra
    using Latigo LanzaDelRelámpago.gif|Ulquiorra using Lanza del Relámpago *{{Nihongo|Resurrección:
    Murciélago|{{Ruby|帰刃|レスレクシオン}}「{{Ruby|黒翼大魔|ムルシエラゴ}}」|Resurekushion・Murushierago}}
    The Arrancar equivalent of a Shikai/Bankai, this form allows an Arrancar to unleash
    their true power as a Hollow. Ulquiorra''s Resurrección is named Murciélago. It''s
    release command is Enclose, and, when released, Ulquiorra grows a pair of large
    bat wings and his Hollow mask grows into a helmet with two horns, Ulquiorra can
    use these wings for flight. His physicals are greatly enhanced as well as the
    addition of new abilities **{{Nihongo|Luz de la Luna|{{Ruby|月光線|ルス・デ・ラ・ルナ}}|Rusu
    de ra Runa}} Ulquiorra can manifest javelins from his own energy, using them either
    as incredibly powerful projectiles or as a melee weapon in close quarters combat.
    **{{Nihongo|Resurrección: Segunda Etapa|{{Ruby|刀剣解放第二階層|レスレクシオン・セグンダ・エターパ}}|Resurekushion
    Segunda Etapa}}: Uniquely among all the Espada, Ulquiorra has reached a second
    released state, which renders him even more powerful than before, shedding his
    robe to reveal his slender, pale torso while his arms and legs are covered in
    thick, black fur. He grows a long, whip-like tail, and his mask disappears, leaving
    him with a pair of large, bat-like ears. ***{{Nihongo|Lanza del Relámpago|{{Ruby|雷霆の槍|ランサ・デル・レランパーゴ}}|'
