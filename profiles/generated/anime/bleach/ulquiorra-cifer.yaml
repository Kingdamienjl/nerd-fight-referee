- id: claim-powers-and-abilities-a0400a44
  section: abilities
  axis: hax
  text: '*Soul Physiology & Hollow Physiology (Soul: High-Tier/Hollow: High-Tier Arrancar)
    **Regeneration (Low-Mid; Ulquiorra can regenerate lost eyeballsBleach: Chapter
    198 and lost limbs like armsBleach: Chapter 351) *Master Swordsman & Expert Hand-to-Hand
    Combatant (As the Cuatro Espada, Ulquiorra is an extremely skilled swordsman and
    hand to hand combatantBleach: Chapter 340, being able to seamlessly incorporate
    punchesBleach: Chapter 278 and kicks into his sword play, while with purely his
    swordsmanship capabilities Ulquiorra is able to casually outskill the likes of
    Ichigo Kurosaki on multiple occasions, this level of skill is also compounded
    on the large experience gap that Ulquiorra usually has against his opponents,
    centuries of nothing but fighting against hollows has given Ulquiorra a level
    of experience that only a few can match) *Telepathy (Ulquiorra can tear out and
    crush his eyeball to transmit what he has seen recently to others) *Resurrección:
    Murciélago **Limited Weapon Creation, True Flight, Enhanced Explosion Manipulation
    & Enhanced Statistics Amplification (Murciélago transforms the physical appearance
    of Ulquiorra while granting him greatly increases physical statsBleach: Chapter
    345, the ability of natural flight through his wingsBleach: Chapter 346 and the
    ability to create energy-based weapons and attacks, primarily creating lances
    which can be used like a regular weapon or can be thrown to generate a large explosion,
    Ulquiorra also has another, completely unique Resurrección that only he has, with
    it being called Segunda EtapaBleach: Chapter 348, this transformation is massively
    above Ulquiorra''s previous transformation, greatly increasing everything about
    Ulquiorra, be it his stats, attacking power, and even his energy creation ability)
    Resistance to: *Extrasensory Perception ( 2 Layers; Using Sonído allows the user
    to bypass Extrasensory PerceptionCan''t Fear Your Own World: Vol 1: Chapter 9
    of even captain level opponents) *High Temperatures (Completely tanked the heat
    created by Ichigo''s Getsuga Tensho)'
  source_ids: *id003
  decisive: true
  status: unverified
