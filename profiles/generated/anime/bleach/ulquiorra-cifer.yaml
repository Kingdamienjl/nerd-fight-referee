  intelligence:
    text: Gifted. Ulquiorra is an incredibly skilled swordsman and hand-to-hand combatant,
      striking with lethal precision in combat. He is very perceptive and capable
      of analyzing his opponents accurately and calmly even when in the midst of combat,
      quickly deducing an opponent's skills and abilities and figuring out their strengths
      and weaknesses, so that he can best exploit them. His intelligence and insight
      are such that Aizen respects him for them, and sent him to determine Ichigo's
      power and threat level.
