- id: claim-weaknesses-8d3bd313
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Purification: Creates purple balls
    of energy that purify souls and destroy bodies on a molecular level. *Purification
    (Touch): Much stronger version of the above ability, requires physical touch,
    and great evils (like Magatsuhi) are affected by it. *Spiritual Immobilization:
    Freezes a target in place and can make them invisible; requires physical touch.
    *Mayose: The Mayose is a high-level mystical spell cast on a twig that can only
    be performed by a highly skilled and experienced priestess with exceedingly strong
    and powerful spiritual power and knowledge. The twig grows into a huge tree that
    reaches the clouds once it is enchanted with a special spell, works as a form
    of telepathy. *Shikigami Creation: She is able to create human-like Shikigami
    that she uses to perform various tasks for her, they can contain any of her power
    and any of her abilities. *Invisibility: Can turn herself invisible to those who
    cannot see the Netherworld (e.g: Monks) *Resurrection: Can revive individuals
    at the cost of her own life. *Shinidamachu Command: Can command the dead, these
    snake spirits also increase her power over time and can steal souls of the living
    to make them mindless slaves. Also allows Kikyo flight, although this drains her
    spiritual energy quickly. ==Notable Matchups== Victories: Losses: Inconclusive:
    {{Discussions|KikyC58D|Kikyō}} Category:Characters Category:Inuyasha Category:Absorption
    Users Category:Anime Characters Category:Bow Users Category:Chi Users Category:Female
    Characters Category:Flight Users Category:Forcefield Users Category:Healers Category:Immortals
    Category:Magic Users Category:Manga Characters Category:Priests Category:Regeneration
    Users Category:Resurrection Users Category:Soul Users Category:Telepaths Category:Tragic
    Characters Category:Undead Category:Bead Users'
  source_ids: *id003
  decisive: false
  status: unverified
