- id: claim-weaknesses-a8863a91
  section: weaknesses
  axis: weakness
  text: 'Normal human weaknesses, has feelings for Inuyasha, hates to fight, Shikon
    no Tama brings despair and misfortune to whoever possesses it. Notable Attacks/Techniques:
    * Sacred arrows: Kagome can infuse her spiritual powers into her arrows, which
    allows the arrows to penetrate demonic forces, break through barriers, destroy
    spells, and purify objects such as the Shikon Jewel. * Arrows of Purification:
    When Kagome infuses her intensely strong spiritual powers into one of her arrows,
    she can purify even the strongest and most powerful demon-based attacks such as
    Kagura''s air-based blasts as well as the Wind Scar itself. * Enhanced Kyūdō Skills
    and Reflection: Kagome uses a basic short bow as a weapon. If she infuses her
    spiritual powers into the bow, she can deflect an enemy''s attack. After receiving
    the sacred longbow from Mount Azusa, Kagome has the power and ability to strike
    evil spirits or the user''s intended target bypassing others, if the opponent
    should happen to be using a hostage as a shield, the arrow will bypass the hostage
    and hit the enemy instead. * Sacred Wind Scar: This attack is a combination of
    Inuyasha''s Wind Scar and Kagome''s Sacred arrow. It consists of Kagome firing
    a Sacred Arrow, followed by Inuyasha''s Wind Scar. It can also be performed when
    Inuyasha uses the Wind Scar before Kagome fires her arrow. * Sacred Backlash Wave:
    This attack is a combination of Inuyasha''s Backlash Wave and Kagome''s Sacred
    Arrow. It consists of Kagome firing one of her Sacred Arrows into the center of
    Inuyasha''s Backlash Wave, creating a very powerful attack. This technique is
    only shown in the movies. ==Notable Matchups== Victories: Losses: Inconclusive:
    {{Discussions}} Category:Characters Category:Inuyasha Category:Manga Characters
    Category:Anime Characters Category:Movie Characters Category:Protagonists Category:Primary
    Protagonists Category:Good Characters Category:Female Characters Category:Humans
    Category:Teenagers Category:Priests Category:Bow Users Category:Telepaths Category:Soul
    Users Category:Forcefield Users Category:Schoolgirls Category:Married Characters
    Category:Adventurers Category:Heroes Category:Time Travelers Category:Aura Users
    Category:Enhanced Senses Users Category:Possession Users Category:Chi Users Category:Morality
    Users Category:Purification Users Category:Energy Users Category:Game Characters
    Category:Adults Category:Parents Category:Bead Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
