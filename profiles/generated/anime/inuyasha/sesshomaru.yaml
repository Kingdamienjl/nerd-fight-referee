  attack_potency:
    text: At least Continent level (Able to harm Inuyasha with ease. Vaporized the
      top of a mountain while handling the Tessaiga,InuYasha manga; Chapter 60 superior
      to Tessaiga mastered Inuyasha, managed to subjugate Tokijin and match Inuyasha
      wielding Tessaiga with it), can ignore conventional durability with Meidō |
      At least Continent level, likely higher (Far surpassed both Inuyasha and Inu
      no Taisho and is the most powerful character at the end of the series. Far superior
      to Osama Kirin who stopped a meteor the size of a country)
    source_ids: *id002
    confidence: 0.95
