  intelligence:
    text: "High. He is very knowledgeable of the Feudal Era and demons, is a highly skilled and dangerous\
      \ combatant, is a capable schemer and can be highly cunning in combat. Due to his long years of\
      \ pursuing power, Sessh\u014Dmaru is very intelligent and experienced in the feudal era. Sessh\u014D\
      maru is able to come to the correct conclusion towards any given mystery in his quest for power\
      \ once he attains the basic understanding of the situation. In the flashback of the third movie,\
      \ Sessh\u014Dmaru was able to correctly deduce that his father was testing him when asked if he\
      \ had someone to protect but denied it due to his pride. By having the Unmother lull Inuyasha into\
      \ an illusion of his real mother, Sessh\u014Dmaru eventually figured out that the black pearl was\
      \ hidden in Inuyasha's right eye. Once he was told of Tenseiga's true nature as a cast off of Tessaiga\
      \ to contain the Meido Zangetsuha, Sesshomaru immediately deduced the correct conclusion that the\
      \ Great Dog Demon intended for Sessh\u014Dmaru to master the technique before giving it to Inuyasha\
      \ by putting Tessaiga's power assimilation ability into the equation. Eventually, after seeing how\
      \ Magatsuhi survives a decapitation by his true form, Sessh\u014Dmaru deduced that the demon is\
      \ a spirit possessing Naraku's flesh and struck it with Tenseiga. Though despite Sessh\u014Dmaru's\
      \ above average intellect, it has been shown that his pride can get in the way that in turn leads\
      \ to an undesirable outcome which his own mother pointed that he was still naive despite his age.\
      \ Standard Tactics: Sessh\u014Dmaru uses whatever means at his disposal."
    source_ids: *id002
    confidence: 0.95
