  text: "Currently= Sesshomaru and Tenseiga.jpg|Tenseiga Bakusaiga.jpg|Bakusaiga Blackpearl.jpg|Black\
    \ Pearl *Demonic Armor: Sessh\u014Dmaru wears a form of armor over his kimono that can supposedly\
    \ regenerate itself over time if it was ever damaged in battle. This is shown when Inuyasha broke\
    \ it during their initial battle over Tessaiga within their father's corpse and after the battle,\
    \ Sessh\u014Dmaru is shown wearing the armor perfectly intact when he faced against the samurai army\
    \ despite not having made any attempts at repairing or replacing the damaged portion. *Tenseiga: Sessh\u014D\
    maru wields the Tenseiga (\u5929\u751F\u7259), a powerful y\u014Dkai sword forged from one of his\
    \ father's fangs by the bladesmith T\u014Dt\u014Dsai. This sword was revealed to have been cast off\
    \ of Tessaiga after T\u014Dga acquired the Meid\u014D Zangetsuha (\u51A5\u9053\u6B8B\u6708\u7834 Meid\u014D\
    \ Zangetsuha, \"Dark Path of the Dawn Moon's Wave) technique, which Sessh\u014Dmaru later developed\
    \ and passed on to Inuyasha. T\u014Dga passed the sword on to Sessh\u014Dmaru in the hope that it\
    \ would help him to develop compassion, as Sessh\u014Dmaru had formerly been concerned solely with\
    \ acquiring more power. Tenseiga cannot harm the living, but is allegedly capable of saving a hundred\
    \ lives in a single stroke and was able to bring back someone from the dead, albeit once. The sword\
    \ can also cut spiritual entities (ghosts, spirits, and messengers of the Underworld). In extreme\
    \ cases, the Tenseiga can also protect Sessh\u014Dmaru from potentially lethal attacks by emitting\
    \ a black mist-like barrier. The protective barrier is capable of blocking the Kaze no Kizu from the\
    \ Tessaiga and the Gokury\u016Bha from the S\u014D'unga. However, in neither case was the barrier\
    \ completely effective, as both attacks still managed to harm Sessh\u014Dmaru to a certain extent.\
    \ The sword normally emits a blue aura when in use and possesses a will of its own that Sessh\u014D\
    maru can sense. After Tenseiga was broken by Zero, Sessh\u014Dmaru entrusts the pieces of the sword\
    \ to Towa, knowing she has a kind enough heart to properly utilize such a gift. *Bakusaiga: Bakusaiga\
    \ is Sessh\u014Dmaru's current signature weapon. Bakusaiga manifested itself in the hand of Sessh\u014D\
    maru's fully regenerated left arm during his battle with Magatsuhi. Its creation signified Sessh\u014D\
    maru's graduation into a full-fledged Daiy\u014Dkai, which had long been compromised by his obsession\
    \ with Tessaiga. T\u014Dt\u014Dsai commented that his ability to manifest his own blade suggested\
    \ that his strength and power had surpassed that of his father and connoted his growth through the\
    \ many trials he endured to emerge as a Daiy\u014Dkai. Bakusaiga ultimately served as the product\
    \ of this \"rite of passage.\" *Black Pearl: A demon relic which provides its bearer with a gateway\
    \ to \"the other side\". |-|Briefly= Sesshomaru Wields Nintojo.jpg|Sessh\u014Dmaru wields Nint\u014D\
    j\u014D. Inuyasha and Tessaiga Sword.jpg|Tessaiga *Staff of Two Heads: Sessh\u014Dmaru briefly wielded\
    \ the \"Staff of Two Heads\", the weapon which Jaken wields. It can produce long streams of flame,\
    \ and generate large floods of water.InuYasha anime; Episode 79 For some reason, Sessh\u014Dmaru knew\
    \ where to find this weapon, and he gave it to his future ward, Jaken. It is with this that Jaken\
    \ was able to help him track down the Tessaiga. The old man head can spew fire whenever Jaken wishes.\
    \ When close to the grave of T\u014Dga, the old man's head laughs. But when at the wrong place, the\
    \ woman shrieks.InuYasha anime; Episode 5 *Tessaiga: The Tessaiga is the first sword created by T\u014D\
    t\u014Dsai using the Great Dog Demon's fang, and is Inuyasha's signature weapon. Believing that the\
    \ sword was his by right, Sessh\u014Dmaru attempted on many occasions to steal it from his half-brother,\
    \ only to be thwarted each time. After a time however, he acquired a number of other weapons which\
    \ blunted his desire for Tessaiga, until he was able to give up his desire for the weapon completely\
    \ upon the acquisition of Bakusaiga. Tessaiga produces an energy barrier which prevents full-blooded\
    \ y\u014Dkai from touching it. Attempting to push past the barrier severely burns the entity in question.\
    \ Despite this, Sessh\u014Dmaru has revealed that he is capable of enduring the effects of the barrier\
    \ for short periods of time. *Human arm (with a shard of the Shikon no Tama embedded within it) *Hive\
    \ of the Saimy\u014Dsh\u014D *Y\u014Dkai arm |-|Formerly= right|thumb|T\u014Dkijin *T\u014Dkijin:\
    \ T\u014Dkijin was a sword crafted by the evil sword smith Kaijinb\u014D from the fangs of Goshinki\
    \ as part of Sessh\u014Dmaru's continued efforts to obtain Tessaiga or a sword matching it in power.\
    \ It is shown to capable of matching Tessaiga in power as the fangs of Goshinki were capable of breaking\
    \ the original Tessaiga before being reforged by T\u014Dt\u014Dsai using Inuyasha's fang. Eventually\
    \ in Sessh\u014Dmaru's battle against M\u014Dry\u014Dmaru, he broke it while attempting to penetrate\
    \ the y\u014Dkai's absorbed shell. Sessh\u014Dmaru did not bother to have it repaired because it did\
    \ not have the power to defeat M\u014Dry\u014Dmaru and he resolved to find a replacement sword. Although\
    \ a powerful sword in its own right, the T\u014Dkijin is apparently capable of dr"
