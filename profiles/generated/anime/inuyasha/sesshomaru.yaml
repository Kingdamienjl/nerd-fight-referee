    confidence: 0.95
  durability:
    text: At least Continent level (Should be more durable than Tessaiga mastered
      Inuyasha, who survived his own redirected Kaze no Kizu) | At least Continent
      level, likely higher
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman. Even the much weaker half breed Inuyasha can fight with injuries
      which even the hardiest of normal humans can't survive. Like him, Sesshomaru
      can fight with injuries such as being impaled clean through the torso, multiple
      fist sized holes in his torso, severe blood loss, being poisoned with enough
      toxins to wipe out a whole village of normal humans | Superhuman
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range when using swords in close combat, Tens of Meters with
      poison whip, Hundreds of Meters with Ki based attacks from his swords.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'High. He is very knowledgeable of the Feudal Era and demons, is a highly
      skilled and dangerous combatant, is a capable schemer and can be highly cunning
      in combat. Due to his long years of pursuing power, Sesshōmaru is very intelligent
      and experienced in the feudal era. Sesshōmaru is able to come to the correct
      conclusion towards any given mystery in his quest for power once he attains
      the basic understanding of the situation. In the flashback of the third movie,
      Sesshōmaru was able to correctly deduce that his father was testing him when
      asked if he had someone to protect but denied it due to his pride. By having
      the Unmother lull Inuyasha into an illusion of his real mother, Sesshōmaru eventually
      figured out that the black pearl was hidden in Inuyasha''s right eye. Once he
      was told of Tenseiga''s true nature as a cast off of Tessaiga to contain the
      Meido Zangetsuha, Sesshomaru immediately deduced the correct conclusion that
      the Great Dog Demon intended for Sesshōmaru to master the technique before giving
      it to Inuyasha by putting Tessaiga''s power assimilation ability into the equation.
      Eventually, after seeing how Magatsuhi survives a decapitation by his true form,
      Sesshōmaru deduced that the demon is a spirit possessing Naraku''s flesh and
      struck it with Tenseiga. Though despite Sesshōmaru''s above average intellect,
      it has been shown that his pride can get in the way that in turn leads to an
      undesirable outcome which his own mother pointed that he was still naive despite
      his age. Standard Tactics: Sesshōmaru uses whatever means at his disposal.'
    source_ids: *id002
    confidence: 0.95
