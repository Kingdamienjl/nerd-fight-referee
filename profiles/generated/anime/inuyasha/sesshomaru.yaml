- id: claim-weaknesses-6bb2b811
  section: weaknesses
  axis: weakness
  text: "His pride and arrogance (Which also prevents him showing his more affectionate side at times,\
    \ making it difficult for people to properly understand him). In his his True Daiy\u014Dkai Form,\
    \ he seems to lack the agility of his humanoid form, in addition to having limited defensive capabilities\
    \ (as he cannot use any weapons while transformed) and speculated by Jaken that Sessh\u014Dmaru loses\
    \ some of his reasoning abilities while in this form (though there is no direct evidence to prove\
    \ this). The Tenseiga can only revive someone once, and can be possessed by Naraku when containing\
    \ a fragment of Kanna's mirror. *Physical Trauma: Major physical injuries such as stab wounds and\
    \ dismemberment can cause Sessh\u014Dmaru pain and also slow him down. However, this is more or less\
    \ momentary as he can rapidly recover from most injuries so long as he hasn't been weakened by other\
    \ means such as spiritual power or purification methods. *Poison: While normally able to nullify most\
    \ poisons because of his own brand of poison, Sessh\u014Dmaru can be incapacitated with extremely\
    \ powerful miasma; for example, the miasma of the y\u014Dkai spirit of the Shikon Jewel, Magatsuhi,\
    \ was able to severely burn Sessh\u014Dmaru on contact. *Spiritual Power: Sessh\u014Dmaru is susceptible\
    \ to the effects of spiritual power, albeit he has demonstrated a great deal of resistance to holy\
    \ or spiritual energies. For example, he was able to enter Mt. Hakurei's powerful purification barrier\
    \ without being purified, although the barrier did weaken him somewhat while it was in effect. In\
    \ another instance, Sessh\u014Dmaru caught one of Kagome's sacred arrows barehanded to no ill-effect;\
    \ any other y\u014Dkai would have been severely injured, if not outright purified. Even holy attacks\
    \ coming from multiple trained and powerful monks (e.g. Ungai and his men) had no long-lasting effect\
    \ on Sessh\u014Dmaru. Feats: Show/Hide |-|Transformation= ===Youkai"
  source_ids: *id003
  decisive: false
  status: unverified
