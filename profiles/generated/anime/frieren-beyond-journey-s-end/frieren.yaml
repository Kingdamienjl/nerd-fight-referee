  intelligence:
    text: Extraordinary Genius *Is an expert in magic, vegetation, strategy, and trade. *Is an extraordinary
      mage who's only lost to another mage 11 times in her 1,000+ year lifetime. *Has incredibly extensive
      knowledge on magic, and aided humans in developing and advancing the "Zoltraak" human killing magic
      which was extremely innovative and bypassed all magical defenses in its time. She then advanced
      it even further by creating her own much stronger version which is especially harmful to demons.
      *Frieren passively hides her true magic capacity to deceive enemies into thinking they have more
      mana than her or are stronger; to the point where demons weren't aware of her true amount of mana
      for thousands of years, despite the fact that she regularly fought demons and has such a large demon-slaying
      reputation among them that most demons she's encountered know who she is just by looking at her.
      *Can analyze and find ways around the curse magic of Sages of Destruction, who possess magic which
      transcends intellect and reason, and is stated to be practically impossible to understand in its
      principles. *Analyzed the principles behind Di Agolze, which is considered the ultimate curse that
      not even the Goddess's magic can dispel. *Is called a Prodigy of magic even by demons who dedicate
      centuries to training their magical abilities. *Her instincts as a mage are impeccable, she instantly
      knew that an opponent she had never faced before could reflect magic just by looking at them, and
      deciphered the magic's mechanics instantly and found a way around it, all within a few seconds.
      *Can Copy the magic techniques of others by looking at and analyzing them. *Could outsmart a perfect
      clone of hers which doesn't have a mind of its own, but imitates the actions of Frieren's mind exactly.
      *Believes she could decipher the ancient monuments of the goddess, which have never been deciphered
      since the beginning of recorded history.
    source_ids: *id002
    confidence: 0.95
