- id: claim-powers-and-abilities-3b06c951
  section: abilities
  axis: hax
  text: '*Standard Magical Abilities *Extraordinary Genius Intelligence *Longevity *Mana Manipulation
    (Can focus mana in specific parts of her body to increase her durability in those areas) *Extrasensory
    Perception (via Mana detection. Can sense curse magic which is normally imperceptible and invisible.
    Can sense the killing intent within mana) *Healing (At least Low, Although she can''t use advanced
    healing, she can use some priest magic) *Limited Enhanced Senses (Has magic which grants limited x-ray
    vision) *Information Analysis (Can use magic to diagnose illnesses and use her knowledge of said illness
    to treat it. Can likely use Autopsy Magic to discover one''s cause of death. Can decipher the mechanics
    behind magic instantly just by looking at it) *Transmutation (Commoner Magic) *Plant Manipulation
    (Via Flower Beds Magic) *Purification (Type 1 & Type 3; purified polluted water. Can restore herself
    and even entire cities from being transmuted into gold) *Stealth Mastery/Invisibility (Passively suppress
    her magic to appear as weak. Can suppress her magic to the point of not being sensed anymore, Can
    use attacks which cannot be perceived by even seasoned mages as magic) *Power Mimicry (Copied Mana
    Strike) *Sealing (Sealed the demon Qual, and removed the seal after 80 years. Can cast powerful seals
    that won''t be undone until she perishes) *Ice Magic, Lightning Magic, Fire Magic *Power Nullification
    (Can cast a powerful Anti-Magic spell) *Pocket Reality Manipulation (Via Her Suitcase) *Homing Attacks,
    Magic Resistance Negation, Limited (Magical) Durability Negation & Damage Boost (1 Layer; Can generate
    seeking magical beams with Zoltraak which can bypass magical defences, who''s anti-human or anti-demon
    variants can be used to even greater effect against their specialized target. An additional piercing
    property can be combined to such attacks to further increase lethality by increasing the density of
    magic to fit a smaller more compact beam) *Forcefield Creation & Resistance to Magic, Magic Resistance
    Negation, & Limited (Magical) Durability Negation (1 Layer; Can generate omnidirectional shield spells
    through modern defense magic which was developed in order to counter the magic-bypassing property
    of Zoltraak) *Magic Projection (Can fire concentrated destructive beams of magic with Zolraak and
    Mana Strike which further concentrates mana into a maximally efficient piercing blast, trading power
    at the cost of the bypassing property of Zoltraak) *Limited Mind Manipulation and Memory Manipulation
    (Although she isn''t particularly strong with mental magic, she is confirmed to have it and be able
    to use memory magic) |-|Resistances= *Mind Manipulation, Memory Manipulation, Paralysis Inducement
    (Restraint Magic is ineffective on Frieren due to her immense magic power and Hypnosis Magic can''t
    break through her mental defense) *Sleep Manipulation (Resisted the effects of a curse which put Stark
    to sleep within a few minutes, for hours) *Limited Transmutation (Could think and act when turned
    into gold, which wasn''t the case for anyone else)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
