- id: claim-weaknesses-8c861cdf
  section: weaknesses
  axis: weakness
  text: "When casting a spell Frieren's mana detection is interrupted for a fraction of a second. Standard\
    \ Mage Weakness Notable Attacks/Techniques: |-|Commoner magic= *De-rusting bronze magic: *Mold elimination\
    \ magic: *Shaved ice magic: Commoner magic that allows the caster to generate shaved ice. *Warm tea\
    \ magic: *\"Turning sweet grapes into sour\" magic: *Finding lost accessoires magic: Spell that allows\
    \ the user to seek out lost accessoires. *Clothes Transparency magic: Spell that makes clothes transparent.\
    \ *Magic to pull someone of a bottomless quagmire: *Stubborn old stain removal magic: *Bird Capturing\
    \ Magic: A magic that can capture any bird-like creature. The magic has a range of 50 centimeters.\
    \ *Treasure Chest Analysis Magic: Mik'heit: A magic spell that can analyze treasure chests to see\
    \ if they are fakes filled with traps or real treasure chests full of treasures. *Sacrificial Treasury\
    \ Door Lock Magic: A binding spell of the highest class that won't disappear until the caster perishes.\
    \ |-|Defensive magic= *Defense Magic: To counter Zoltraak, this defense magic was developed. Mages\
    \ can create hexagons that possess great resistance against magic. However, the resistance can be\
    \ bypassed by using magic to manipulate physical things and delivering enough force. This weakness\
    \ also only applies to the controlling of the physical and not the conjuring of the physical through\
    \ magic. |-|Offensive magic= *Human Killing Magic: Zoltraak: The first piercing magic in history,\
    \ developed by Qual, one of the Seven Sages of Destruction under the Demon King. It is a piercing\
    \ attack which can negate the protections provided by equipment and defensive magic which have resistance\
    \ to magic attacks. After Qual was sealed, Zoltraak was heavily studied and analyzed. Ultimately,\
    \ Zoltraak was incorporated into mankind's magic system to the point that today, it is simply considered\
    \ as basic offensive magic which any competent mage could use. **Demon Killing Magic: Zoltraak: Zoltraak\
    \ was greatly improved by Frieren in a way that's specialized in killing demons, making it far more\
    \ lethal to demons and bypassing their resistances to a standard Zoltraak or offensive magic. *Destructive\
    \ Lightning Magic: J\xFCdrajil'm *Hell's Inferno Magic: Wohlzanvel *Mana Strike: An extremely destructive\
    \ magical attack which can even break through Freiren's magical defenses. |-|Magic Visualization=\
    \ *Magic Visualization: Magic as a concept is freeform and allows for anything that the user truly\
    \ believes in and visualizes to be realized. So if a mage believes their magic barrier or mana itself\
    \ is enough to protect them from a magic spell, then it will protect them. Mages often times lose\
    \ or gain powers and abilities based on their feelings and beliefs. So if a mage has resistance to\
    \ ice magic, but then suffers from a change in terrain which might help an ice magic user, they could\
    \ lose that resistance in that moment, because of their waning confidence. They also momentarily gain\
    \ powers in much the same way, and if they believe they can penetrate or break through something,\
    \ they often times will. ==Notable Matchups== Victories: Chrollo Lucilfer (Hunter X Hunter) Chrollo\u2019\
    s Profile (Starting distance of 200 meters) Losses: Van Hohenheim (Fullmetal Alchemist) Hohenheim's\
    \ Profile (Base Frieren used, starting distance was 100 meters, and Frieren's Hypersonic+ was restricted)\
    \ Futaba Yozakura (Mission: Yozakura Family) Futaba's Profile (Tanpopo Saga Futaba was used. Starting\
    \ distance was 150 meters) Inconclusive: Alastor (Hellaverse) Alastor's profile (Base Alastor was\
    \ used. Starting distance was 10 meters. Speed was equalized) {{Discussions}} Category:Characters\
    \ Category:Frieren: Beyond Journey's End Category:Deconstruction Users Category:Durability Negation\
    \ Users Category:Electricity Users Category:Elves Category:Energy Users Category:Enhanced Senses Users\
    \ Category:Extrasensory Perception Users Category:Female Characters Category:Fire Users Category:Geniuses\
    \ Category:Healers Category:Ice Users Category:Information Analysis Users Category:Invisibility Users\
    \ Category:Longevity Users Category:Magic Users Category:Manga Characters Category:Memory Users Category:Mind\
    \ Users Category:Plant Users Category:Pocket Reality Users Category:Power Mimicry Users Category:Power\
    \ Nullification Users Category:Primary Protagonists Category:Protagonists Category:Purification Users\
    \ Category:Resistance Negation Users Category:Sealing Users Category:Stealth Masters Category:Transmutation\
    \ Users Category:Anime Characters Category:Fantasy Characters Category:Staff Users Category:Cloth\
    \ Users Category:Heroes Category:Adults Category:Good Characters"
