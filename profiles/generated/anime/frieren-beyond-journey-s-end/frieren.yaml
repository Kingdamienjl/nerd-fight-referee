  description: "resistance to magic attacks. After Qual was sealed, Zoltraak was heavily studied and analyzed.\
    \ Ultimately, Zoltraak was incorporated into mankind's magic system to the point that today, it is\
    \ simply considered as basic offensive magic which any competent mage could use. **Demon Killing Magic:\
    \ Zoltraak: Zoltraak was greatly improved by Frieren in a way that's specialized in killing demons,\
    \ making it far more lethal to demons and bypassing their resistances to a standard Zoltraak or offensive\
    \ magic. *Destructive Lightning Magic: J\xFCdrajil'm *Hell's Inferno Magic: Wohlzanvel *Mana Strike:\
    \ An extremely destructive magical attack which can even break through Freiren's magical defenses.\
    \ |-|Magic Visualization= *Magic Visualization: Magic as a concept is freeform and allows for anything\
    \ that the user truly believes in and visualizes to be realized. So if a mage believes their magic\
    \ barrier or mana itself is enough to protect them from a magic spell, then it will protect them.\
    \ Mages often times lose or gain powers and abilities based on their feelings and beliefs. So if a\
    \ mage has resistance to ice magic, but then suffers from a change in terrain which might help an\
    \ ice magic user, they could lose that resistance in that moment, because of their waning confidence.\
    \ They also momentarily gain powers in much the same way, and if they believe they can penetrate or\
