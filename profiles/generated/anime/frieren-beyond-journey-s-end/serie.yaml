- id: claim-weaknesses-549e4758
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques: Magic (also known as Spell) is the supernatural ability\
    \ realized through the consumption of onemage's mana. Described as a world of visualization, meaning,\
    \ its manifestation, effectiveness, and efficiency depend on the user's ability to visualize. If the\
    \ user can visualize their magic strongly enough, it will manifest accordingly; conversely, a lack\
    \ of visualization can impact its effectiveness. And as a mage who has pretty much every grimoire\
    \ or spell ever known, Serie can undoubtedly capable of casting a variety of magic/spells. These are\
    \ some of the spells or magic: *Mana Strike: A spell that Serie uses to attack Macht. Simply, it's\
    \ an attack that is concentrated burst of mana. *Soul Track: As showcased in the series, Serie can\
    \ also utilize Soul Track. She uses this spell to attack Macht's defense. Soul Track is a powerful\
    \ offensive spell that can penetrate/negate protective and defensive magic. *MistelzilaCurse Reversal\
    \ Magic (\u546A\u3044\u8FD4\u3057\u306E\u9B54\u6CD5\u30DF\u30B9\u30C6\u30A3\u30EB\u30B8\u30FC\u30E9\
    , Noroi-gaeshi no Mah\u014DMisutiruj\u012Bra): The ancient spell from the Mythical Era that disregards\
    \ all logical analysis. A magic that reflects anything it perceives to be a curse. *FearveliaSpell\
    \ Transfer Magic (\u9B54\u6CD5\u3092\u8B72\u6E21\u3059\u308B\u9B54\u6CD5\u30D5\u30A3\u30FC\u30A2\u30F4\
    \u30A8\u30EA\u30A2, Mah\u014D o J\u014Dto suru Mah\u014DF\u012Bavueria): It is a magic Serie uses\
    \ to share her magical knowledge (grimoire) with chosen mages. It transfers her learned magic to them,\
    \ but she loses that knowledge afterwards. This magic also instantly imparts a deep understanding\
    \ of the transferred spell, saving the recipient from spending much time learning it. ==Notable Matchups==\
    \ Victories: Losses: Inconclusive: ==References== {{Scroll box|{{Reflist|2}}}} {{Discussions}} Category:Characters\
    \ Category:Frieren: Beyond Journey's End Category:Manga Characters Category:Longevity Users Category:Plant\
    \ Users Category:Enhanced Senses Users Category:Telekinesis Users Category:Energy Users Category:Energy\
    \ Projection Users Category:Resistance Negation Users Category:Deconstruction Users Category:Durability\
    \ Negation Users Category:Forcefield Users Category:Reality Warpers Category:Magic Users Category:Homing\
    \ Attack Users Category:Summoners Category:Accelerated Development Users Category:Elves Category:Anime\
    \ Characters Category:Fantasy Characters Category:Female Characters Category:Adults"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-16238206
  section: abilities
  axis: hax
  text: '*Standard Magical Abilities *Longevity (An Elf''s lifespan is nearly infinite.Vol.6 Ch.53 - Era
    of Humans She''s older than Frieren who has lived for more than a thousand years) *Plant Manipulation
    (Via Flower Bed Magic. She was the one who taught little Flamme this magicVol.6 Ch.53 - Era of Humans)
    *Enhanced Senses (Observed Frieren''s actions merely by sitting on her throneVol.6 Ch.45 - Water Manipulation
    Magic)* *Telekinesis (Can levitate a paper scrollVol.6 Ch.53 - Era of Humans) *Enhanced Instincts
    (Her instincts are always correct. While she interviews exam participants, she can accurately judge
    whether they qualify as first-class mages. Her judgment is not solely based on visual observation;
    in fact, she can discern their capabilities and characteristics even without direct visual contact.
    Instantaneously, she can identify if a participant standing before her is merely a clone, pinpoint
    the location of his real body, and discern his current activitiesVol.7 Ch.58 - Series Instincts) *Mana
    Manipulation (Can contantly limiting her mana outputVol.6 Ch.57 - Third Stage Exam) *Magic Reflection
    (Reflected Macht''s magicVol.10 Ch.93 - Great Barrier) *Mana Projection (Can shoot a beam of concentrated
    mana,Vol.10 Ch.93 - Great Barrier) *Magic Projection, Homing Attacks, Magic Resistance Negation, Limited
    (Magical) Durability Negation & Damage Boost (1 Layer; Can generate seeking magical beams with Zoltraak
    which can bypass magical defences, who''s anti-human or anti-demon variants can be used to even greater
    effect against their specialized target. An additional piercing property can be combined to such attacks
    to further increase lethality by increasing the density of magic to fit a smaller more compact beam)
    *Forcefield Creation & Resistance to Magic, Magic Resistance Negation, & Limited (Magical) Durability
    Negation (1 Layer; Can generate omnidirectional shield spells through modern defense magic which was
    developed in order to counter the magic-bypassing property of Zoltraak) *Power Bestowal (Via FearveliaSpell
    Transfer MagicVol.10 Ch.96 - Master and Apprentice) |-|Resistances= *Mana Detection (Can easily enter
    the transmuted El Dorado without being detected by MachtVol.10 Ch.93 - Great Barrier) *Transmutation
    Magic (Via MistelzilaCurse Reversal Magic. Unaffected by Macht''s MagicVol.10 Ch.93 - Great Barrier)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
