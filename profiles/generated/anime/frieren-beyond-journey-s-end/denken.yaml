- id: claim-weaknesses-1e08379c
  section: weaknesses
  axis: weakness
  text: 'Standard Mage Weakness Notable Attacks/Techniques: |-|Defensive magic= *Defense Magic: To counter
    Soul Track, this defense magic was developed. Mages can create hexagons that possess great resistance
    against magic. However, the resistance can be bypassed by using magic to manipulate physical things
    and delivering enough force. This weakness also only applies to the controlling of the physical and
    not the conjuring of the physical through magic. ** Mistel''zila: A kind of defense magic which deflects
    and/or reflects anything that the user considers a curse. Curses being magic techniques that can sedate,
    petrify, or transform living and nonliving matter. |-|Offensive magic= *Human Killing Magic: Soul
    Track: The first piercing magic in history, developed by Qual, one of the Seven Sages of Destruction
    under the Demon King. It is a piercing attack which can negate the protections provided by equipment
    and defensive magic which have resistance to magic attacks. After Qual was sealed, Soul Track was
    heavily studied and analyzed. Ultimately, Soul Track was incorporated into mankind''s magic system
    to the point that today, it is simply considered as basic offensive magic which any competent mage
    could use. |-|Magic Visualization= *Magic Visualization: Magic as a concept is freeform and allows
    for anything that the user truly believes in and visualizes to be realized. So if a mage believes
    their magic barrier or mana itself is enough to protect them from a magic spell, then it will protect
    them. Mages often times lose or gain powers and abilities based on their feelings and beliefs. So
    if a mage has resistance to ice magic, but then suffers from a change in terrain which might help
    an ice magic user, they could lose that resistance in that moment, because of their waning confidence.
    They also momentarily gain powers in much the same way, and if they believe they can penetrate or
    break through something, they often times will. ==Notable Matchups== Victories: Losses: Inconclusive:
    {{Discussions}} Category:Characters Category:Frieren: Beyond Journey''s End Category:Attack Reflection
    Users Category:Light Users Category:Fire Users Category:Staff Users Category:Cloth Users Category:Magic
    Users Category:Elders Category:Humans'
