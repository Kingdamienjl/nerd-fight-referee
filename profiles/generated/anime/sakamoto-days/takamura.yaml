- id: claim-powers-and-abilities-2cc6552e
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Enhanced Senses (Awareness: Despite his old age, he has
    incredible situational awareness, acting almost instinctively to danger. Deflects two bullets with
    his blade while his opponent blitzes behind him, then removes the man''s trigger finger before impaling
    his throat without even looking behind himself) *Master Swordsman (Takamura utilizes some form of
    iaijitsu wherein he re-sheathes his sword every few swings; Sakamoto tries to take advantage of this
    and halt his draw, to which Takamura manually flings off his sheathe. His sword skill is so high that
    he is able to keep both Nagumo and Sakamoto at bay in a 2v1 enacted from his blind spot by utilizing
    his sheathe) **Superhuman Precision (Slashed Gaku''s arm off so cleanly the muscle tissue was still
    alive, so it could be reconnected easily. His cuts are so sharp that he can deliberately cut off his
    own arm and then re-attach it with zero issue to extricate himself from problematic situations) **Instinctive
    Action (Takamura cuts on instinct, reacts to a fly buzzing by him, killing it and in the process slashing
    the vehicle he''s in horizontally in half, as well as dismembering the highway street sign uprights
    to either side of the vehicle) *Aura (Overwhelming: Emits a palpable bloodlust; a high-tier assassin
    can tell Takamura is strong just by this aura) *Social Influencing **Reputation and Instigating Fear:
    He is widely feared as one of the strongest assassins in history, as well as being a member of the
    Order. Chases down Gaku and slashes apart the floor; of note, the assassin-killer ''Slur'', who had
    been dismantling the entire assassin world of Japan, outright refuses to engage. Takamura at this
    point and opts for running. Slur states that Gaku is probably the only person in the world to ever
    survive a fight with Takamura; Slur goes on to further speculate that Takamura is like a mythical
    character for the assassin world, and that literally nobody has any intel on him whatsoever. *Stealth
    Mastery (Slur speculates that Takamura is like a mythical character for the assassin world, and that
    literally nobody has any intel on him whatsoever. Is skilled enough to be able to sneak up on Nagumo
    without his noticing and blitz him) *Body Control (Can reattach his limbs because his cuts are so
    sharp that he can deliberately cut off his own arm and then re-attach it with zero issue to extricate
    himself from problematic situations) *Analytical Prediction and Information Analysis (Whilst skidding
    away from a kick, manages to position his sword perfectly to bisect an incoming projectile from his
    blind-spot) *Fear Manipulation (Fear Inducement: After his death, it''s shown that his personality
    and force of will are so potent that even a copy of his personality in Uzuki''s mind is so powerful
    it cannot be contained. The personality of another top tier assassin in Uzuki''s mind has to take
    over just to keep Takamura at bay long enough for Uzuki''s allies to flee)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
