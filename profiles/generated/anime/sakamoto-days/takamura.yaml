- id: claim-weaknesses-6c37388e
  section: weaknesses
  axis: weakness
  text: 'Standard human weaknesses. Feats: Strength *Blocks a heavy blow with just the hilt of his katana.
    **His opponent, Gaku, is pretty strong for reference. *Follows with an immediate slash that removes
    Gaku''s fingers and one ear, as well as cutting through a swath of the building *With one arm, halts
    a heavy overhead smash from Gaku that craters the ground beneath him slightly. Durability *Pursues
    Slur and Gaku only to be caught out by a bomber who kills himself; the explosion blows an enormous
    hole in the building, but Takamura is just fine in its wake. *Is entirely unharmed by a roundhouse
    kick from Sakamoto that sends him flying through a museum wall and crumples the side of a bus. *Unharmed
    by a kick from Sakamoto that sends him flying upward through a level of a building. *Continues to
    be unharmed by kicks, getting smacked away by Gaku mid-air and using his sword to halt his momentum.
    Speed *Removes a man''s arm so fast that the man outright asks "What just happened" before reacting
    to the pain; Takamura proceeds to slash him into three pieces before anyone can react. *Blocks a bullet
    with the hilt of his katana from melee range. **Proceeds to cut down the one who fired the bullet
    so rapidly that the only motion seen is him re-sheathing his blade. *Slashes apart two goons before
    they can react, dicing their weapons as well as decapitating them in the process. *While re-sheathing
    his sword, slashes apart Gaku''s weapon when it''s inches from his face before destroying an enormous
    portion of the building; for reference, Gaku is an absurdly casual bullet timer. *Deflects two bullets
    with his blade while his opponent blitzes behind him, then removes the man''s trigger finger before
    impaling his throat without even looking behind himself. *Is immediately attacked by Gaku while performing
    the above, and simply removes Gaku''s weapon arm; when Gaku kicks it at him, Takamura easily blocks
    the projectile. *Deflects a close-range handgun bullet with his sword hilt before using a barely-unsheathed
    blade to open someone''s carotid artery. *After dropping into a 3v1 against Sakamoto, Uzuki and Nagumo,
    all 3 simultaneously react to prevent Takamura drawing his sword; he simply blocks with his sheathe
    and forces them into range with a single swipe. **Of note, Uzuki aka X was hit by the swipe. *Interrupts
    his own swing mid-strike to fully redirect and attack Sakamoto, interrupting a sneak attack from behind.
    *Blitzes behind Sakamoto from a large distance and proceeds to obliterate most of an enormous pillar
    in one swing. *Continues to veritably clown Sakamoto in speed by unendingly dodging and retaliating
    to his every strike. **After Sakamoto attempts to wear down his katana by assaulting it repeatedly,
    Takamura reacts in close-range melee to sharpen his katana on Sakamoto''s handgun bullets. *After
    revealing he can talk, blitzes Usuki and ends up bisecting Haruma, a confidante of his. Swordsmanship
    and Skill *Walks into a room of mafioso and slashes down their leader before anyone can react; when
    taking out the next two goons, he removes the first''s arms in such a way that the man ends up shooting
    himself in the head, and then simply splits the next one''s head in half. *Proceeds to cut apart two
    other goons who decide to shoot him simultaneously. *Reacts to a fly buzzing by him, killing it and
    in the process slashing the vehicle he''s in horizontally in half, as well as dismembering the highway
    street sign uprights to either side of the vehicle. *Briefly interferes in Sakamoto''s fight against
    Apart, slashing apart the base support of Tokyo Tower at a distance to stabilize it after Apart started
    making the center of the tower tilt. *Emits a palpable bloodlust; a high-tier assassin can tell Takamura
    is strong just by this aura. *Has enough control of his sword to be able to open a door from the opposite
    side, slicing through the door and opening the handle with the blade. *Chases down Gaku and slashes
    apart the floor; of note, the assassin-killer ''Slur'', who had been dismantling the entire assassin
    world of Japan, outright refuses to engage. Takamura at this point and opts for running. *Slur states
    that Gaku is probably the only person in the world to ever survive a fight with Takamura; Slur goes
    on to further speculate that Takamura is like a mythical character for the assassin world, and that
    literally nobody has any intel on him whatsoever. *Is skilled enough to be able to sneak up on Nagumo
    without his noticing and blitz him. *Utilizes his sheathe extensively, such as blocking Sakamoto''s
    axe-kick and redirecting it into the ground for a block. *single retaliatory swing blasts apart most
    of the museum he''s fighting in, notably shaking the entire building. *Takamura utilizes some form
    of iaijitsu wherein he re-sheathes his sword every few swings; Sakamoto tries to take advantage of
    this and halt his draw, to which Takamura manually flings off his sheathe. *Slashes apart the building
    level beneath him to access Sakamoto and catch'
