- id: claim-powers-and-abilities-58308b42
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Master Martial Artist, Expert Acrobat, Instinctive Reaction,
    Enhanced Senses (Rion Akao states that Nagumo does everything with coordination and skill, which makes
    him a deadly combatant. This was made evident in his fight against Gaku; despite being outmatched
    in physical ability, Nagumo was able to defeat him with his combat skill and trickery. His combat
    skill was stated by Slur to be among the top two in the Order. Hypermobility, All- Terrain Mobility
    - Nagumo can perform highly acrobatic parkour movements passively and in fights. Even in rough or
    slippery battlefields Nagumo is still able to move with the same dexterity) *Weapon Mastery (Nagumo
    can use firearms with great proficiency. He ranked 4th place in the top 10 greatest shooters of all
    time at the JCC, having scored 84 points. He was able to decapitate Minimalist with ease, and kill
    multiple assassins in one swift motion before they could even react) *Preparation (Information Preparation
    - The JCC gives them information on all of their targets before they kill them) *Master of Disguise
    (Disguised himself as Konomi''s mom "in an instant" to trick Higichi after he attempted to kidnap
    them) *Genius Intelligence (Nagumo was a part of the intelligence-gathering department during his
    younger days at the JCC. He is a highly perceptive individual, quickly able to deduce Kindaka''s theory
    of a spy existing within the JAA''s organization without the latter even saying anything, and was
    also able to quickly notice that Erio Muto, a JAA executive, was a spy working for Slur. His intellect
    and planning is partly what makes him such a deadly fighter, as he''s able to stay one step ahead
    of his opponent through deception and schemes) *Accelerated Development **Training - Nagumo is an
    ex-member of the Order and one of the strongest assassins in Japan. As a student Nagumo was one of
    the three greatest prospects to ever step foot into the JCC alongside Taro Sakamoto and Rion Akao.
    Kindaka a founding member of the Order stated that the three of them could be future leaders of the
    assassin world. *Extrasensory Perception (Can sense the bloodlust of people with killing intent, which
    he used to find an assassin in an elevator by stealing someones wallet creating a distraction to make
    them reveal themselvesSakamoto Days 108) *Social Influencing **Deception: Nagumo is a master of deception
    in combat and uses a ceramic invisible blade to impale opponents before they can realize it. Nagumo
    believes the key to killing is "deception", despite claiming to abhor it. **Charisma: Nagumo is extremely
    charming to women, similar to Sakamoto although to a higher scale than him. *Information Analysis
    (Identifies Kindaka by his old picture by identifying the frontal bone, eye socket, nasal bone and
    ethmoid boneSakamoto Days 109. Could tell Kindaka got faster after he got speed blitzed by himSakamoto
    Days 110) *Status Effect Inducement (Can instantly knock out opponents to immobilize them) *Technique
    Mimicry and Precognition (Hid in disguise as Minimalist''s reflection, meaning he had to predict and
    copy all of his movements at the exact moment he did them for it to work) |-'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
