- id: claim-powers-and-abilities-005b540d
  section: abilities
  axis: hax
  text: 'Alive= {{#tag:tabber|Base= * Superhuman Physical Characteristics (Itachi,
    much like all Shinobi, is capable of using Chakra to enhance his strength to superhuman
    levelsItachi Shinden: Book of Bright Light; Chapter 1, Page 28) * Genius Intelligence
    * Photographic Memory (Itachi could memorize any scene with a mere glanceItachi
    Shinden: Book of Dark Night; Chapter 4, Page 51) * Preparation (Itachi, given
    enough preparation time, was able to completely control everything that occurred
    in his fight with Sasuke, meticulously plotting every detail such that he could
    remove Orochimaru from him. Even Sasuke''s own hidden contingency plans were themselves
    merely parts of Itachi''s preparation.Naruto Chapter 401 Having already foresaw
    Obito''s attempt to approach and recruit Sasuke, Itachi planted Amaterasu within
    Sasuke''s eye as a post-mortem trap to be activated when Sasuke sees Obito''s
    Sharingan, which prompted Obito to praise Itachi''s ability to plan ahead and
    openly admit that he''d be dead had Itachi known more about his abilities.Naruto
    Chapter 397 As a countermeasure in case Sasuke decides to harm Konoha in any way,
    Itachi planted a crow that had access to Shisui Uchiha''s Kotoamatsukami within
    Naruto and programmed it to emerge when Naruto comes in contact with Itachi''s
    Mangekyō Sharingan, which he knew Sasuke would implant into himself, and bestow
    upon its target the command to "protect Konoha"Naruto Chapter 550) * Social Influencing
    **Instigating Fear (In his fight against Nemui during the Chūnin Exams, he was
    capable of easily and completely reading Nemui''s personality. He was able to
    understand his motivations and fears with very minimal contact and information.
    He then used that understanding to devise a plan meant to manipulate Nemui into
    gradually opening his eyes and falling prey to Itachi''s Genjutsu, which he then
    tailored specifically to break Nemui''s will and make him give up on being a Shinobi.Itachi
    Shinden: Book of Bright Light; Chapter 3, Page 113Itachi Shinden: Book of Bright
    Light; Chapter 3, Page 114Itachi Shinden: Book of Bright Light; Chapter 3, Page
    115Itachi Shinden: Book of Bright Light; Chapter 3, Page 116Itachi Shinden: Book
    of Bright Light; Chapter 3, Page 117Itachi Shinden: Book of Bright Light; Chapter
    3, Page 118Itachi Shinden: Book of Bright Light; Chapter 3, Page 119Itachi Shinden:
    Book of Bright Light; Chapter 3, Page 120 Orochimaru feared him so much that he
    abandoned his plans and left the Akatsuki,Naruto Chapter 140; Page 5 deeming the
    pursuit of Itachi''s body ''out of the question''.Naruto Chapter 344 Itachi’s
    very existence—and the fact that he remained alive—served as a powerful deterrent,
    compelling Danzō and the elders to honor their agreement and ensure Sasuke’s protectionNaruto
    Chapter 401; Pages 6-7) **Social Position and Reputation (Itachi is one of the
    most respected and accomplished ninja within the Shinobi world. As one of Konoha''s
    best Jōnin by far, he is deemed as an ''elite'',Naruto Chapter 114 with even the
    mere possibility of facing off against a Tokubetsu Jōnin being considered a tall
    order by most.Naruto Chapter 184Naruto Chapter 186 As a member of the Akatsuki,
    he is a feared and respected criminal recognized for his skillSha no Sho: Page
    196) **Deception (Itachi is incredibly skilled in looking into the hearts of his
    opponents and using it against them through deception. Against Kabuto, Itachi
    was able to confuse him by lying to him about how he was able to track his location,
    claiming he was responsible for this, when it was actually Nagato''s doing.Naruto
    Chapter 580 As a spy and a double agent,Naruto Chapter 590; Page 10 he was extremely
    adept at lying to and deceiving people.Naruto Chapter 581; Pages 10-12 He deceived
    Sasuke into believing he was a power-hungry madman intent on stealing his eyes,
    when in truth, he was carefully orchestrating their battle to free Sasuke from
    Orochimaru''s Curse Mark and awaken the power of the Mangekyō Sharingan within
    himNaruto Chapter 401) **Coercion (Itachi was able to force Obito into postponing
    his plans to attack Konoha by striking a pact with him. By agreeing to help Obito
    massacre the Uchiha clan, he was able to force him to leave both Sasuke Uchiha
    and the rest of Konoha beNaruto Chapter 590) **Leadership (Itachi, by the young
    age of thirteen, was the leader of his own Anbu squad,Naruto Chapter 142 commanding
    groups of the most highly skilled ninja within his village. Itachi demonstrated
    exceptional leadership and strategic brilliance, quickly analyzing the situation
    and coordinating with Naruto and Bee to exploit Edo Nagato’s weaknesses, with
    his calm decisiveness being key to securing their victoryNaruto Chapter 551) *
    Enhanced Senses (Enhanced Awareness, Extra Senses, & Enhanced Vision - Shinobi
    possess an extraordinary intuition and heightened awareness—almost like a sixth
    sense—that enables them to detect threats far beyond the reach of their ordinary
    senses or direct line of sight.Gaara Hiden: A Sandstorm MirageN'
