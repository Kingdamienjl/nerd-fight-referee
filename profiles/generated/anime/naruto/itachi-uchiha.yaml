  stamina:
    text: 'Part I= Superhuman. Immensely superior to his sick self due to lacking
      the terminal illness that severely hampered his stamina and chakra reserves.Naruto
      Chapter 389Naruto Chapter 401 Even as an 8 year old child, Itachi had marvelous
      stamina. He was able to seriously spar with Shisui for about 7 hours. Overall,
      they sparred for 35 rounds, with each round taking roughly 9 minutes, with 3
      minute breaks between each round.Itachi Shinden: Book of Bright Light; Chapter
      2, Page 90Itachi Shinden: Book of Bright Light; Chapter 2, Page 91Itachi Shinden:
      Book of Bright Light; Chapter 2, Page 92 During the Chūnin Exams, when he was
      10, he was able to continuously dodge and evade Nemui for well over 10 minutes
      straight without even breaking a sweat.Itachi Shinden: Book of Bright Light;
      Chapter 3, Page 113Itachi Shinden: Book of Bright Light; Chapter 3, Page 114Itachi
      Shinden: Book of Bright Light; Chapter 3, Page 115Itachi Shinden: Book of Bright
      Light; Chapter 3, Page 116Itachi Shinden: Book of Bright Light; Chapter 3, Page
      117Itachi Shinden: Book of Bright Light; Chapter 3, Page 118Itachi Shinden:
      Book of Bright Light; Chapter 3, Page 119Itachi Shinden: Book of Bright Light;
      Chapter 3, Page 120 Itachi also has a very high tolerance towards pain, not
      even flinching when he was stabbed in his stomach.Itachi Shinden: Book of Dark
      Night; Chapter 5, Page 68 During the Uchiha massacre, when he was only 13, he
      could use his Mangekyō Sharingan for an extended period, and unleashed powerful
      and very chakra taxing techniques such as Tsukuyomi and Amaterasu several times
      that night, in addition to him running around and killing at least dozens of
      his clansmen.Itachi Shinden: Book of Dark Night; Chapter 6 During the events
      of Part I, he was able to use Tsukuyomi twice and Amaterasu once, in addition
      to a number of other techniques such as a Shadow Clone, which cuts his chakra
      reserves in half, and Suiton Jutsu.Naruto Chapter 142Naruto Chapter 147Naruto
      Chapter 148 |-|Part II= Superhuman. His stamina had certainly diminished greatly
      due to his terminal illness reaching its peak, and his death drawing near.Naruto
      Chapter 389Naruto Chapter 393Naruto Chapter 394Naruto Chapter 401 However, even
      in this state he has considerable chakra and endurance. Even though it''s still
      a very chakra taxing technique to maintain, he''s almost always got his Sharingan
      activated. Itachi is capable of partaking in the Nine Phantom Dragons Seal Jutsu,
      which is a Jutsu designed to extract a Bijū from its Jinchūriki and requires
      the 9 participants to be constantly awake and supplying chakra for 3 full days.Naruto
      Chapter 255 During his time supplying chakra for this sealing Jutsu, Itachi
      was also capable of supplying 30% of his total chakra to a clone of himselfNaruto
      Chapter 260 that he used to battle Naruto and Kakashi for a relatively extended
      period of time.Naruto Chapter 256Naruto Chapter 257Naruto Chapter 258Naruto
      Chapter 259Naruto Chapter 260 Before his fight with Sasuke, when his illness
      was at its absolute peak, he had a serious sparring match with Kisame, where
      he had to use several of his Jutsu and Dojutsu in quick succession.Naruto Shippuden:
      Ultimate Ninja Storm Generations Then he had to fight Sasuke, which entailed
      him using several Genjutsu to start with. He then used Tsukuyomi against Sasuke,
      which greatly exacerbated the effects of his illness.Naruto Chapter 388Naruto
      Chapter 389 After suffering injuries and burns during the fight, he was forced
      to use Amaterasu during an extended altercation, which took a massive further
      toll on him. Then, in order to survive Kirin, he was forced to activate the
      Susano''o. Then he had to use it again in order to battle and seal Orochimaru
      and survive Sasuke''s onslaught, until he finally succumbed to his illness and
      chakra depletion, and died. It should also be noted that in addition to the
      pain caused by his terminal illness reaching its final stages, the Susano''o
      also caused Itachi excruciating pain during its use,Naruto Chapter 466 and he
      went through the entire fight while suffering from immense pain. |-|Edo Tensei=
      Infinite. Edo Tensei have an infinite chakra supply,Naruto Chapter 591 that
      is to say their chakra reserves will refill indefinitely and continuously, meaning
      that they can keep fightingNaruto Chapter 662 without fail or succumbing to
      physical limitations like fatigue, pain, or debilitating injuries. In this form,
      Itachi was rid of any and all physical ailments he was afflicted with in life,
      such as his illness and blindness. He can continuously use Mangekyō Sharingan
      techniques with seemingly zero drawbacks to his eyesight and his stamina, and
      can freely use the Susano''o without any obvious side effects.'
