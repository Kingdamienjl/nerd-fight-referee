- id: claim-powers-and-abilities-59a158b2
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Statistics Amplification (Shinobi are capable of enhancing\
    \ their physical capabilities with the use of chakra. The Shunshin no Jutsu allows Shinobi to greatly\
    \ enhance their speed by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto\
    \ Chapter 71), Surface Scaling and Water Walking (By focusing chakra at the soles of their feet, Shinobi\
    \ can scale and cling to vertical surfaces, and even walk on waterNaruto Chapter 18Naruto Chapter\
    \ 90), Afterimage Creation, Stealth Mastery, and Speed Enhancement (The Substitution Jutsu allows\
    \ its user to instantly replace themselves with a nearby object such as a tree log, plant, person,\
    \ or clone at the exact moment they are attacked. The Jutsu works even if the user is physically restrained\
    \ or observed by characters as observant as Sharingan or Sage Mode users. This creates the optical\
    \ illusion of the user being hit, which confuses the opponent and gives them an opening to flee or\
    \ counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter 374Naruto Chapter 580Naruto Chapter\
    \ 674), Minor Illusion Creation and Duplication (With the Clone TechniqueRin no Sho, Page 220, Shinobi\
    \ can create illusionary duplicates of themselves that have no physical substance), Shapeshifting\
    \ (With the Transformation Technique, Shinobi can transform themselves into other people, animals,\
    \ plants, and even inanimate objects, such as weapons), Paralysis Inducement (With the Temporary Paralysis\
    \ TechniqueRin no Sho, Page 176, Shinobi can completely paralyze their targets from close to mid range),\
    \ Self-Sustenance (Type 2. Can survive without the need for food and water), Martial Arts, Expert\
    \ Swordsmanship and Shurikenjutsu, Acrobatics, Chakra Manipulation, Air Manipulation, Water Manipulation,\
    \ Fire Manipulation, Earth Manipulation, Limited Wood Manipulation, Sealing Techniques, Status Effect\
    \ Inducement (Via binding seals), Summoning, Resistance to Madness Manipulation (Type 1) and Transmutation,\
    \ Curse Manipulation (Possesses Hashirama's cells) Enhanced Sight (The Sharingan provides its user\
    \ with an incredible clarity of perceptionNaruto Chapter 26. This allows the user to easily keep trackNaruto\
    \ Chapter 27Naruto Chapter 49 of fast moving targets with astonishing clarity. This clarity of vision\
    \ also allows the user to easily perceive and decipherNaruto Chapter 333 hand seals at great speedsNaruto\
    \ Chapter 361, read lipsNaruto Chapter 246, and perceive pencil movements in order to mimic themNaruto\
    \ Chapter 41. The Sharingan can also see chakraNaruto Chapter 361 as different colors, even through\
    \ certain solid obstaclesNaruto Chapter 579, and even perceive invisible individualsNaruto Chapter\
    \ 242 and entitiesNaruto Chapter 551. The Sharingan also allows its user to focus their vision and\
    \ act like a microscope, allowing it to see objects on a cellular levelNaruto Chapter 361 and clearly\
    \ perceive virusesBoruto Chapter 41), Analytical Prediction (The Sharingan allows its user to clearly\
    \ anticipate their opponent's next moves and flawlessly counter themNaruto Chapter 49. A fully matured\
    \ Sharingan can even see a clear visual image of the opponent's next movesNaruto Chapter 230, allowing\
    \ for efficient evasion and counterattacks without any wasted movements), Information Analysis and\
    \ Power Mimicry (The Sharingan has the ability to \"discern the reality behind any technique\" and\
    \ then reflect it upon its caster.Naruto Chapter 12 This enables the user to read the way a foe weaves\
    \ seals and determine the change in chakra nature and the range of the attack from the color of chakra.Shan\
    \ no Sho, page 45 The Sharingan's ability to acquire and decipher this informationRin no Sho, pages\
    \ 192-193 allows its user to instantly understand, memorize, and mimic the opponent's NinjutsuNaruto\
    \ Chapter 15Naruto Chapter 26, GenjutsuNaruto Chapter 141, and TaijutsuNaruto Chapter 67Naruto Chapter\
    \ 68 with nearly perfect accuracy. The Sharingan's ability to see chakra also allows its user to assess\
    \ the opponent's remaining energy levels and their next movesNaruto Chapter 390Naruto Chapter 641),\
    \ Empowerment (The Sharingan is awakened and evolved through the awakening and development of the\
    \ user's negative emotions, such as hate, grief, or disappointment. The deeper the hatred or pain,\
    \ the more powerful the Sharingan becomesNaruto Chapter 619), Minor Light Manipulation (The Sharingan\
    \ shines in the darkNaruto Chapter 301), Illusion Reflection (The Sharingan has the ability to decipher\
    \ an opponent's genjutsu, mimic it, and reflect it back at its user with the Demonic Illusion: Mirror\
    \ Heaven and Earth ChangeNaruto Chapter 141Naruto Chapter 12T\u014D no Sho, page 274), Illusion Nullification\
    \ (Sharingan users can break free ofNaruto Chapter 141 andBoruto Chapter 3 nullifyNaruto Chapter 478\
    \ genjutsuSasuke Shinden, Chapter 3Sasuke Shinden, Chapter 4), Minor Astral Projection (The Sharingan\
    \ allows its user to project themselves into a target's inner consciousness with a mere gazeNaruto\
    \ Chapter 308Naruto"
