- id: claim-powers-and-abilities-b2d74378
  section: abilities
  axis: hax
  text: "\u014Ctsutsuki Physiology (\u014Ctsutsuki), Superhuman Physical Characteristics, Acrobatics,\
    \ Chakra Manipulation, Longevity, Telepathy, Astral Projection, Energy Projection, Mind Manipulation,\
    \ Energy Absorption, X-ray Vision with the Byakugan, Statistics Amplification (Can enhance his physical\
    \ capabilities and speed with chakra), Duplication (Can create shadow clones who can use his techniques,\
    \ act as decoys and distractions, among other things), Enhanced Senses (The Byakugan grants him the\
    \ ability to see chakra, nearly 360\xB0 vision, and the ability to see vast distances and the chakra\
    \ pathway system), Puppet Manipulation (Can control thousands of puppets that can attack targets,\
    \ shoot energy blasts, and perform a variety of other tasks), Limited / Selective Intangibility (His\
    \ orb also possesses intangible properties, as it can go through targets without directly causing\
    \ them harm), Extrasensory Perception (Can sense changes and happenings in the Earth all the way from\
    \ the Moon), Dream Manipulation (Entered Boruto's dream and communicated with him, but this is likely\
    \ not combat applicable), Spatial Manipulation (Smoothed away a distortion in space-time), Cosmic\
    \ Awareness and Precognition (could sense the Otsutsuki from interstellar distances and cross-dimensionally,\
    \ also predicted the eventual arrival of the Otsutsuki and appears to know Boruto's fate and destiny),\
    \ Self-Sustenance (Type 1. Can survive in space), Resistance to Cosmic Radiations and Ice Manipulation\
    \ normally, Resistance to Illusion Creation with the Byakugan All previous abilities enhanced, Flight,\
    \ Telekinesis, Air Manipulation, Fire Manipulation, Water Manipulation, Earth Manipulation, Electricity\
    \ Manipulation, Yin-Yang Manipulation, Gravity Manipulation (Can control attractive and repulsive\
    \ forces to a limited extent), Weapon Creation (Toneri can create weapons by combining his chakra\
    \ with the Truth Seeking Balls provided to him by his transformation), Matter Manipulation (The Truth\
    \ Seeking Balls are superior to Onoki's Dust Release, which turns targets to dust on a molecular level,\
    \ even before Yin-Yang Release is applied to it), Reality Warping (The TSBs are partially comprised\
    \ of Yin-Yang Release, which is capable of altering reality in a variety of ways) which allows for:\
    \ Existence Erasure (Can erase Ninjutsu, people, and matter), Transmutation (The TSB can be altered\
    \ into different states of matter, energy attacks, Chakra Receivers, and more), Shapeshifting and\
    \ Size Manipulation (The TSB can be morphed into a variety of shapes and sizes), Limited Telekinesis\
    \ (The TSB can be freely controlled telekinetically, up to a 70 meter radius), and Limited Power Nullification\
    \ (The Truth Seeking Balls negate and erase all Ninjutsu they come into contact with, which includes\
    \ energy and elemental based attacks, Edo Tensei, and Dust Release to name a few, with the exception\
    \ of those imbued with natural energy and space time ninjutsu), Resistance to Deconstruction, Existence\
    \ Erasure (Users of Six Paths chakra are unaffected by the effects of the Truth Seeking Balls) and\
    \ Power Nullification (Users of Six Paths chakra can bypass the nullification effects of the Truth\
    \ Seeking Balls and the attacks of Six Paths chakra users can bypass the nullification effects of\
    \ the Truth Seeking Balls)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
