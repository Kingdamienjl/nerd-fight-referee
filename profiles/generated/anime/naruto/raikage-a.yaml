      \ Zetsu100 Megatons), Country level with V1 Lightning Release Chakra Mode (Consistently\
      \ overpowered KCM Naruto and sent him flying with his punches, with Naruto even\
      \ praising his strength. He threatened to kill NarutoNaruto Chapter 5417 Teratons),\
      \ higher with V2 Lightning Release Chakra Mode (Far stronger than before due\
      \ to his speed increasing, which also greatly increases his punching power.\
      \ During one of Gy\u016Bki's past rampages, A was able to chop off his horn,\
      \ drop him to the ground, and make him wince in pain.Naruto Chapter 494 The\
      \ Raikage, or \"A\", is the strongest Shinobi in Kumogakure.Jin no Sho, page\
      \ 142 A is also confirmed to have the highest battle power in his village,Jin\
      \ no Sho, page 202-203 which includes Killer B and Gy\u016Bki. Upon entering\
      \ his V2 Lightning Armor, Karin stated that the Raikage's chakra is \"at Bij\u016B\
      \ level\". At his full power, Killer B stated that he was capable of killing\
      \ KCM NarutoNaruto Chapter 544), far higher with \u014Cnoki's enhancement (Easily\
      \ punched through Madara's Humanoid Susano'o, breaking its ribs and sending\
