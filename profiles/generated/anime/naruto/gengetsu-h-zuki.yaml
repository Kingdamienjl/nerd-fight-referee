- id: claim-powers-and-abilities-a5b06ab4
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Acrobatics, Chakra Manipulation, Flight with J\u014Dki B\u014D\
    i, Fire Manipulation, Oil Manipulation, Water Manipulation, Earth Manipulation, Electricity Manipulation,\
    \ Heat Manipulation, Steam Manipulation, Explosion Manipulation and Limited Weather Manipulation (The\
    \ Second creates an oil clone filled with water. When it moves, the oil on the surface heats up and\
    \ the water inside evaporates. This then causes a massive steam explosion. The air blown up by the\
    \ explosion eventually cools which creates hail. The hail cools the clone down prepping it for another\
    \ explosion. It can essentially perform an infinite number of explosions), Yin Manipulation, Yang\
    \ Manipulation, Statistics Amplification (Shinobi are capable of enhancing their physical capabilities\
    \ with the use of chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance their speed by focusing\
    \ chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and\
    \ Water Walking (By focusing chakra at the soles of their feet, Shinobi can scale and cling to vertical\
    \ surfaces, and even walk on waterNaruto Chapter 18Naruto Chapter 90), Minor Illusion Creation and\
    \ Duplication (With the Clone Technique,Rin no Sho, Page 220 Shinobi can create illusionary duplicates\
    \ of themselves that have no physical substance), Shapeshifting (With the Transformation Technique,Rin\
    \ no Sho, Page 220 Shinobi can transform themselves into other people, animals, plants, and even inanimate\
    \ objects, such as weapons), Paralysis Inducement (With the Temporary Paralysis Technique,Rin no Sho,\
    \ Page 176 Shinobi can completely paralyze their targets from close to mid range), Explosion Manipulation\
    \ with J\u014Dki B\u014Di, Illusion Creation with Summoning Technique All previous abilities in base,\
    \ *Regeneration (Low-Godly - Edo Tensei are capable of regenerating from the complete destructionNaruto\
    \ Chapter 517 page 8 and 9 of their bodiesNaruto Chapter 561. It's stated that as long as the soul\
    \ remains, the Edo Tensei will keep coming back to lifeNaruto Chapter 120Naruto Chapter 518) *Immortality\
    \ (Types 1, 2, 3, 4, 7 and 8 - Edo Tensei are corpses possessed by a soul brought back from the Pure\
    \ Land. They are incapable of feeling pain along with being able to survive grievous injuries such\
    \ as bisectionNaruto Chapter 523 and dismemberment.Naruto Chapter 520 page 21 Edo Tensei will keep\
    \ coming back so long as their soul remains bound to the Edo realmNaruto Chapter 120Naruto Chapter\
    \ 518) *Inorganic Physiology (Type 1 - Edo Tensei bodies are comprised of dust and ash enveloping\
    \ an already deceased corpse shaping it into the revived person the caster choosesNaruto Chapter 119)\
    \ *Self-Sustenance (Types 1, 2 and 3 - The Edo Tensei are the souls of the dead the caster wants to\
    \ reanimate, the caster uses an already dead body to house the revived soulNaruto Chapter 520) *Instinctive\
    \ Action (Edo Tensei are programed to automatically counter enemy jutsuNaruto Chapter 547 along with\
    \ their bodies moving of its own accordNaruto Chapter 548) *Resistance to Mind Manipulation, Empathic\
    \ Manipulation and Emotion Detection (Even though Edo Tensei are able to retain their consciousness\
    \ when brought back from the afterlife, the controller can suppress their free willNaruto Chapter\
    \ 119 Page 16 binding their mind and shutting off all emotionNaruto Chapter 522)"
  source_ids: *id003
  decisive: true
  status: unverified
