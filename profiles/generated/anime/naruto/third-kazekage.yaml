- id: claim-weaknesses-31092acc
  section: weaknesses
  axis: weakness
  text: 'Nothing notable Notable Attacks/Techniques Jiton (Magnet Release): An advanced chakra nature
    which allows the user to control metals with their chakra. *Iron Sand Drizzle: it is a gunshot-like
    attack which uses Iron Sand hardened into minuscule grains to attack simultaneously across a vast
    range. *Iron Sand Wall: The Third Kazekage uses his iron sand to create a defensive wall. *Iron Sand
    Gathering Assault: is a technique which gathers a great volume of Iron Sand and compresses it into
    a high-density shape. *Iron Sand World Method: This technique uses Iron Sand to create a gigantic
    sphere of branching spikes. The user first creates two masses of Iron Sand of opposing magnetic fields
    and then merges them together. This causes the magnetic forces to instantly increase and the repellent
    force created by the two opposing magnetic fields scatters the Iron Sand across a vast area.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-28d08973
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, Chakra Manipulation, Air Manipulation, Earth
    Manipulation, Water Manipulation, Magnetism Manipulation, Statistics Amplification (Shinobi are capable
    of enhancing their physical capabilities with the use of chakra. The Shunshin no Jutsu allows Shinobi
    to greatly enhance their speed by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter
    24Naruto Chapter 71), Surface Scaling and Water Walking (By focusing chakra at the soles of their
    feet, Shinobi can scale and cling to vertical surfaces, and even walk on waterNaruto Chapter 18Naruto
    Chapter 90), Minor Illusion Creation and Duplication (With the Clone TechniqueRin no Sho, Page 220,
    Shinobi can create illusionary duplicates of themselves that have no physical substance), Shapeshifting
    (With the Transformation TechniqueRin no Sho, Page 220, Shinobi can transform themselves into other
    people, animals, plants, and even inanimate objects, such as weapons), Paralysis Inducement (With
    the Temporary Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely paralyze their targets
    from close to mid range), Iron Sand Manipulation (Can manipulate iron sand through magnetic force
    and also nullify opposing puppets by clogging their joints with sand), Danmaku (Via Needle Sphere),
    Limited Durability Negation with Iron Sand Shower (Can throw microscopic grains of iron sand), Flight
    (with iron sand wings) All previous abilities in base, *Regeneration (Low-Godly - Edo Tensei are capable
    of regenerating from the complete destructionNaruto Chapter 517 page 8 and 9 of their bodiesNaruto
    Chapter 561. It's stated that as long as the soul remains, the Edo Tensei will keep coming back to
    lifeNaruto Chapter 120Naruto Chapter 518) *Immortality (Types 1, 2, 3, 4, 7 and 8 - Edo Tensei are
    corpses possessed by a soul brought back from the Pure Land. They are incapable of feeling pain along
    with being able to survive grievous injuries such as bisectionNaruto Chapter 523 and dismemberment.Naruto
    Chapter 520 page 21 Edo Tensei will keep coming back so long as their soul remains bound to the Edo
    realmNaruto Chapter 120Naruto Chapter 518) *Inorganic Physiology (Type 1 - Edo Tensei bodies are comprised
    of dust and ash enveloping an already deceased corpse shaping it into the revived person the caster
    choosesNaruto Chapter 119) *Self-Sustenance (Types 1, 2 and 3 - The Edo Tensei are the souls of the
    dead the caster wants to reanimate, the caster uses an already dead body to house the revived soulNaruto
    Chapter 520) *Instinctive Action (Edo Tensei are programed to automatically counter enemy jutsuNaruto
    Chapter 547 along with their bodies moving of its own accordNaruto Chapter 548) *Resistance to Mind
    Manipulation, Empathic Manipulation and Emotion Detection (Even though Edo Tensei are able to retain
    their consciousness when brought back from the afterlife, the controller can suppress their free willNaruto
    Chapter 119 Page 16 binding their mind and shutting off all emotionNaruto Chapter 522)
  source_ids: *id003
  decisive: true
  status: unverified
