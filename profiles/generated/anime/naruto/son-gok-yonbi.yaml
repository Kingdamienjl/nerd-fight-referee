- id: claim-powers-and-abilities-31687d69
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Large Size (Type 1), Chakra Manipulation, Aura, Incorporeality\
    \ (Although the Bijuu transform into physical matter and give themselves normal biological bodies,\
    \ they are primarily made entirely out of energy and have been shown to exist in this state. As they\
    \ are masses of energy in this state, they are impossible to kill by normal means), Immortality (Type\
    \ 1 - Bijuu are beings made of pure ChakraNaruto Chapter 256Naruto Chapter 467, and as such should\
    \ not be capable of dying from old age as creatures that physiologically exist as pure life forceNaruto\
    \ Chapter 90), Resurrection (Mid-Godly - Bijuu will resurrect even if their minds, bodies, and souls\
    \ have been completely erasedBoruto: Two Blue Vortex Chapter 10, this is shown when Kurama resurrected\
    \ from the complete destruction of his chakra via a process akin to Nuclear FusionBoruto: Naruto Next\
    \ Generations Chapter 55. The deceased Bijuu will however revive after a completely indeterminable\
    \ amount of time has passed in a random place.), Immortality (Type 4 - A \"Kernel\" will sprout to\
    \ bring a Bijuu back to life even if their body and soul have been completely destroyedBoruto Two\
    \ Blue Vortex Chapter 10), Enhanced Chakra Manipulation (Bij\u016B can easily transfer their chakra\
    \ to whomever they chooseNaruto Chapter 572) Limited Telepathy (Bij\u016B can telepathically communicate\
    \ with other Bij\u016B and their jinch\u016BrikiNaruto Chapter 471), Breath Attack, Fire Manipulation\
    \ (With Fire Release. Son Goku can breathe green flamesNaruto Chapter 467Naruto Episode 205), Earth\
    \ Manipulation (With Earth Release), Magma Manipulation (With Lava Release, which allow the user to\
    \ create and manipulate molten rock, both in liquid and solid states. Son Gok\u016B can create volcanoesNaruto\
    \ Chapter 566), Chakra Projection and Explosion Manipulation (With Bijuudama. Bij\u016B can gather\
    \ and balance positive black chakra and negative white chakra and form it into a dense sphereNaruto\
    \ Chapter 519 that they can fire as it is, as a destructive wave that detonates on impact,Naruto Chapter\
    \ 414 swallow it to fire as a focused beamNaruto Chapter 294Naruto Chapter 295), Vibration Manipulation\
    \ with Bij\u016B Shockwave, Non-Physical Interaction with Tailed Beast Chakra Arms (Tailed Beast Chakra\
    \ Arms users can physically interact with intangible objects like their soul when it's halfway extracted\
    \ from them), Resistance to Paralysis Inducement, Body Puppetry, and Possession (Bij\u016B and Jinch\u016B\
    riki are capable of resistingNaruto Chapter 444Naruto Chapter 567 the binding effects and control\
    \ of the Rinnegan's Black Receivers)"
  source_ids: *id003
