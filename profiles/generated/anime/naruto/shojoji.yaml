    no Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and Water Walking (By focusing
    chakra at the soles of their feet, Shinobi can scale and cling to vertical surfaces, and even walk
    on waterNaruto Chapter 18Naruto Chapter 90), Afterimage Creation, Stealth Mastery, and Speed Enhancement
    (The Substitution Jutsu allows its user to instantly replace themselves with a nearby object such
    as a tree log, plant, person, or clone at the exact moment they are attacked. The Jutsu works even
    if the user is physically restrained or observed by characters as observant as Sharingan or Sage Mode
    users. This creates the optical illusion of the user being hit, which confuses the opponent and gives
    them an opening to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter 374Naruto
    Chapter 580Naruto Chapter 674), Minor Illusion Creation and Duplication (With the Clone TechniqueRin
    no Sho, Page 220, Shinobi can create illusionary duplicates of themselves that have no physical substance),
    Shapeshifting (With the Transformation TechniqueRin no Sho, Page 220, Shinobi can transform themselves
    into other people, animals, plants, and even inanimate objects, such as weapons), Paralysis Inducement
    (With the Temporary Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely paralyze their
    targets from close to mid range), Limited Elasticity (Shojoji can unusually "stretch" his mouth to
    easily devour a human headBoruto Chapter 13Boruto Chapter 14 and even entire bodies in mere secondsBoruto
    Episode 147), Enhanced Shapeshifting, Voice Mimicry, Memory Absorption and Power Mimicry (Shojoji
    can devour his target's form, memories and abilities, perfectly assuming his identity and voice, which
    is done by consuming the target's living brainBoruto Chapter 13), Air Manipulation (Can release a
    sharp wave of compressed wind from his handsBoruto Chapter 14), Forcefield Creation and Attack Reflection
    (Can create a reflective barrier of wind that repels any attacks it detectsBoruto Chapter 14) Weapon
    Creation (Can manifest a sword from his shadow), Electricity Manipulation, Shadow Manipulation, Power
    Mimicry (With Moon Shadow Technique. The shadows have the same strength, speed, durability and techniques
    as his victims), Body Control (The shadow can manipulate their form into other shapes, including morphing
    their arms into spears) and Limited Energy Absorption (The shadows do not have a separate source of
    energy, but rather draw their energy from the target they were spawned from)
