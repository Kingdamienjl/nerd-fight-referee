- id: claim-standard-equipment-eec692ac
  section: equipment
  axis: equipment
  text: "* Kurosawa: Kurosawa (literally meaning: Black Swamp) is the name of Mifune's sword. The sword\
    \ is fairly long and thin, and has a rectangular hand-guard and a long hilt wrapped in bandages. Mifune\
    \ has shown great skill and dexterity in wielding the sword, performing Iaid\u014D with the blade.\
    \ He also used it to slash open Ibuse's head when the salamander swallowed him. From Mifune's various\
    \ exploits with this blade, Kurosawa became a very revered weapon. * Sword: Mifune used an unnamed\
    \ sword when he first faced Hanz\u014D."
  source_ids: *id003
  decisive: false
  status: unverified
