- id: claim-weaknesses-2ce723df
  section: weaknesses
  axis: weakness
  text: 'Orochimaru needs a new host once every three years to continue his body-switching
    technique. He frequently overextends himself because of his extreme arrogance
    and pride. Notable Attacks/Techniques: As one of the Sannin and a former member
    of Akatsuki, Orochimaru is one of the most powerful shinobi in history, showing
    a genius that few could match since childhood. Even Tsunade regretted that they
    were on opposite sides and that he was "dead" during the Fourth Shinobi World
    War. At his full power, Orochimaru could toy with the likes of Sasori, an influential
    member of Akatsuki, as well as defeat the Fourth Kazekage and later his own teacher,
    the Third Hokage, albeit he lost the use of his arms to the latter. Despite this,
    he was still strong enough to fight Naruto''s four-tailed form evenly to a stalemate,
    and Sasuke openly admitted that his defeat of Orochimaru was only because of the
    Sannin''s body rejecting him. Ninjutsu: Wishing to obtain all of the techniques
    in the world, Orochimaru has a vast arsenal of techniques at his disposal, ranging
    from simple offensive ones, which nonetheless become deadly when performed by
    him, to higher ranking, more complicated ones. Even at a young age, he was able
    to utilise his former master''s signature Shuriken Shadow Clone Technique. Orochimaru
    also exhibited mastery with the Transformation Technique, as he was able to view
    Sasuke''s battle with Yoroi Akadō during the Chūnin Exams, undetected. He was
    also able to pose as the Fourth Kazekage for weeks, fooling the entire village
    of Sunagakure, including its elite shinobi and the ones closest to the dead Kazekage.
    When conducting experiments, he is also capable of utilizing medical ninjutsu
    and would make use of the chakra scalpel. In terms of defensive techniques, Orochimaru
    uses both Summoning: Rashōmon and Summoning: Triple Rashōmon, in which he summons
    a varying number of large demonic gates that are capable of enduring even the
    most intense forms of damage. Orochimaru can also use a technique to avoid injury,
    and another to temporarily paralyze an opponent. Orochimaru''s trademark trait
    is his affinity with snakes, in addition to impacting the appearance and composition
    of his pure form, and granting him the ability to extend his limbs to abnormal
    lengths and to take on snake-like traits in battle, causing him to learn several
    snake-related skills, including learning Sage Mode. His snake-related techniques
    have been referred to as the Power of the White Snake. One such ability is being
    able to summon giant snakes to fight alongside him in battle, made possible by
    the summoning contract tattooed on his arm. This allows him to summon snakes within
    his vicinity, as opposed to having to place his hand on a surface. If need be,
    Orochimaru can morph into a giant snake, despite being slightly smaller in size
    than his larger ones. His signature summon was Manda, a colossal snake which was
    described as the largest in the world, with immense fighting capabilities. With
    Hidden Shadow Snake Hands, Orochimaru can instantly call forth snakes from his
    sleeves and mouth to attack his opponents in large numbers with venomous bites.
    A stronger variation of this technique was the Many Hidden Shadow Snake Hands,
    in which the summoned snakes grow noticeably in both numbers and size, as well
    as a variety wherein the snakes had sword blades sticking out from their mouths.
