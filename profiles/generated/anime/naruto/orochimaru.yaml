- id: claim-powers-and-abilities-a17f7e79
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, Social Influencing (Reputation
    - Is one of the “three great ninja of Konoha. The abilities of these individuals
    are considered to be in a different category than those of ordinary shinobi, so
    much so that akatuski withdrew), Chakra Manipulation and Absorption via touch,
    Master Hand-to-Hand Combatant, Weapon Mastery (Can also extend and remotely control
    Kusanagi), Genius Intelligence, Curse Manipulation (Via the Curse Mark), Sealing,
    Explosion Manipulation with explosive tags, Fire Manipulation, Air Manipulation,
    Electricity Manipulation, Water Manipulation, Wood Manipulation, Earth Manipulation
    (Can travel underground and phase through his surroundings to avoid damage and
    launch surprise attacks, while remaining undetected), Limited Telekinesis (Can
    move his sword without the need for physical contact), Transformation (Can transform
    into a giant eight-headed snake), Immortality (Types 3 and 6), Regeneration (At
    least Low-Mid; able to heal from being bisected and from having his arm ripped
    off, up to High-Mid with body replacement technique), Immense Pain Tolerance (Endured
    losing an arm, laughed off getting ripped in half, and withstood being stabbed
    by Sasuke all while suffering from the pain caused by his illness which he got
    after losing part of his soul), Summoning (Can summon snakes to wrap around targets,
    bind and constrict them, inflict damage on them with their poisonous fangs (and
    blood of his true form is toxic), track targets by their heat and smell, use as
    shields to defend himself from harm, among other things), Body Control (Can stretch
    and lengthen parts of his body. Able to create snakes from inside of his body
    and use them to attack. Can "shed his skin" and create a new body for himself,
    allowing him to get rid of all previous damage inflicted on him), Necromancy (Capable
    of resurrecting the dead as near-immortal zombies under his control, however,
    he needs preparation for this, and it is not useful in general combat), Fear Manipulation
    and Explosive Aura (Made Sasuke contemplate suicide due to his killing intent,
    and paralyzed Sakura from moving. His aura worked on Kakashi, who could resist
    Zabuza's aura, and made him envision his own death. Was able to scare Kabuto out
    of fighting him with his aura alone. His aura caused damage to the environment
    during his battle against Hiruzen), Resurrection (He can be revived any number
    of times through the Evil Releasing Method, provided there are enough cursed seals
    and DNA. However this requires outside help and is not useful in general combat),
    Possession (Able to transfer his soul to someone else's body, gaining all their
    abilities and powers), Statistics Amplification (Shinobi are capable of enhancing
    their physical capabilities with the use of chakra. The Shunshin no Jutsu allows
    Shinobi to greatly enhance their speed by focusing chakra in their feetRin no
    Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and Water Walking
