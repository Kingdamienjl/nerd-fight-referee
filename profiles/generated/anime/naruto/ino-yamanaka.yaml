- id: claim-powers-and-abilities-4ac572d5
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, Chakra Manipulation, Statistics
    Amplification (Shinobi are capable of enhancing their physical capabilities with
    the use of chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance their
    speed by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto
    Chapter 71), Surface Scaling and Water Walking (By focusing chakra at the soles
    of their feet, Shinobi can scale and cling to vertical surfaces, and even walk
    on waterNaruto Chapter 18Naruto Chapter 90), Afterimage Creation, Stealth Mastery,
    and Speed Enhancement (The Substitution Jutsu allows its user to instantly replace
    themselves with a nearby object such as a tree log, plant, person, or clone at
    the exact moment they are attacked. The Jutsu works even if the user is physically
    restrained or observed by characters as observant as Sharingan or Sage Mode users.
    This creates the optical illusion of the user being hit, which confuses the opponent
    and gives them an opening to flee or counterattackNaruto Chapter 6Naruto Chapter
    54Naruto Chapter 374Naruto Chapter 580Naruto Chapter 674), Enhanced Senses, Extrasensory
    Perception (Can detect and track down targets through their chakra signatures,
    and also detect changes in another person's chakra), Possession (Can possess a
    target and take control of their actions), Limited Hair Manipulation (Showed to
    be skilled at chakra control, as seen when she used her own cut hair to bind a
    target), Minor Illusion Creation and Duplication (With the Clone Technique,Rin
    no Sho, Page 220 Shinobi can create illusionary duplicates of themselves that
    have no physical substance), Shapeshifting (With the Transformation Technique,Rin
    no Sho, Page 220 Shinobi can transform themselves into other people, animals,
    plants, and even inanimate objects, such as weapons), Paralysis Inducement (With
    the Temporary Paralysis Technique,Rin no Sho, Page 176 Shinobi can completely
    paralyze their targets from close to mid range) All previous abilities, Healing
    All previous abilities, Earth Manipulation, Water Manipulation, Telepathy (Can
    communicate telepathically with people, convey memories and feelings to them)
    All previous abilities, Enhanced Extrasensory Perception (Can instinctively detect
    a person's chakra signature without first molding chakra and also determine the
    potency of a chakra), Mind Reading (Can extract memories from people and learn
    their true nature and determine whether they are under the influence of someone
    else)
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
