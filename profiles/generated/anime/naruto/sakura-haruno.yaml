- id: claim-powers-and-abilities-ad43523c
  section: abilities
  axis: hax
  text: "{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Abilities \u25BE= {{#tag:tabber| Part\
    \ 1={{Border|Scroll=Yes|Visible=No|Content= * Superhuman Physical Characteristics (All Shinobi, are\
    \ capable of using Chakra to enhance their strength to superhuman levels.Naruto Chapter 5) * Martial\
    \ Arts (All Shinobi are trained to be highly proficient in Taijutsu. Even in the Ninja Academy, they\
    \ are trained in Hand-to-Hand combat and perform drills regularlyNaruto Shippuden Chapter 538 to perfect\
    \ their Taijutsu.) ** Pressure Points Strikes (Shinobi are taught a technique that allows them to\
    \ painlessly knock people outKakashi Retsuden: The Sixth Hokage and the Failure Boy; Chapter 3 with\
    \ a simple neck chop in the Academy.) * Acrobatics (Hyper-mobility, All-Terrain Mobility, Self-Momentum\
    \ & Surface Running; All Shinobi are extremely agile, and can jump to great heightsNaruto Chapter\
    \ 538. Additionally, they can all travel around by jumping across tree branches.Naruto Chapter 185)\
    \ * Chakra Manipulation ** Energy Manipulation & Energy Projection (One can \"mold chakra\" through\
    \ the two component energies of physical and spiritual energy,Naruto Chapter 90 one can then project\
    \ it in a myriad of different ways through the Chakra Points around the body. Shinobi do this particularly\
    \ in the use of ninjutsu.Sha no Sho, Page 156 Additionally, chakra users are also capable of emitting\
    \ raw chakra as well, usually through their hands or feet.Naruto Chapter 101) ** Statistics Amplification\
    \ (Shinobi are capable of enhancing their physical capabilities with the use of chakra. The Shunshin\
    \ no Jutsu allows Shinobi to greatly enhance their speed by focusing chakra in their feet.Rin no Sho,\
    \ Page 197Naruto Chapter 24Naruto Chapter 71) ** Surface Scaling & Free Movement (Water Walking -\
    \ By focusing chakra at the soles of their feet, Shinobi can scale and cling to vertical surfaces,\
    \ and even walk on water.Naruto Chapter 18) ** Power Nullification, Mind Manipulation & Soul Manipulation\
    \ (Shinobi can typically break free from and nullify non-ocular Genjutsu by intentionally disrupting\
    \ the flow of chakraSha no Sho, Page 301 within their bodies.) ** Empowerment (Chakra allows its users\
    \ to gain dramaticNaruto Chapter 1 boosts to their statisticsNaruto Chapter 133Naruto Chapter 134\
    \ when they experience powerfulNaruto Chapter 619 surges in emotionNaruto Chapter 460 or resolve.)\
    \ * Superhuman Precision, Marksmanship & Danmaku (All Shinobi are taught and trained to master Shuriken,\
    \ Kunai, and many other ninja weapons in the Academy.Itachi Shinden: Book of Bright Light; Chapter\
    \ 1, Page 38Naruto Chapter 4) ** Smoke Manipulation (With the use of smoke bombs, which are a standard\
    \ part of a Shinobi's basic toolkit.T\u014D no Sho, Page 195) ** Explosion Manipulation (Explosive\
    \ tags, also known as letter bombs, are a standard part of a Shinobi's basic toolkit.) ** Light Manipulation\
    \ (Flash bombs are a standard part of a Shinobi's basic toolkit.) ** Poison Manipulation (With the\
    \ use of poison gas bombs, which are a standard part of a Shinobi's basic toolkit.) * Afterimage Creation,\
    \ Stealth Mastery & Speed Enhancement (The Substitution Jutsu allows its user to instantly replace\
    \ themselves with a nearby object such as a tree log, plant, person, or clone at the exact moment\
    \ they are attacked. The Jutsu works even if the user is physically restrained or observed by characters\
    \ as observant as Sharingan or Sage Mode users. This creates the optical illusion of the user being\
    \ hit, which confuses the opponent and gives them an opening to flee or counterattack.Naruto Chapter\
    \ 6Naruto Chapter 54Naruto Chapter 374Naruto Chapter 580Naruto Chapter 674) * Shapeshifting (With\
    \ the Transformation Technique, Shinobi can transform themselves into other people, animals, plants,\
    \ inanimate objects and even ninjutsu.Rin no Sho, page 220) * Paralysis Inducement (With the Temporary\
