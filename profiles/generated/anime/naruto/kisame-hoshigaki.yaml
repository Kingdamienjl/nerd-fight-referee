    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: 'Mountain level (He was able to outmuscle Asuma.Naruto Chapter 141 He overpowered
      Might Guy, forcing him to enter the 6th Gate.Naruto Chapter 257Naruto Chapter
      258 He was able to trade blows with Sick Itachi before his battle with Sasuke.Naruto
      Shippuden: Ultimate Ninja Storm Generations Comparable to Killer B). Varies
      with Chakra Absorption, up to Country level with Water Style and Samehada |
      Country level (Has power comparable to that of a Jinchūriki, and was able to
      overwhelm B), Varies with Chakra Absorption'
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'At least Mountain level (He withstood a kick from Rock Lee and Neji''s
      Air Palm without suffering any damage.Naruto Chapter 256 He withstood multiple
      attacksNaruto Chapter 143Naruto Chapter 505Naruto Chapter 506 from Might Guy
      without suffering any damage. He withstood being headbutted by Killer B), likely
      higher (As a 30% clone, he survived 6th Gate Guy''s initial kickNaruto Chapter
      258which begins Asakujaku.Naruto: Sha no Sho, page 224 He survived 7th Gate
      Guy''s Hirudora, albeit being greatly weakened by it, Guy required another punch
      to knock Kisame outNaruto Chapter 507). Varies with Chakra Absorption, Country
      level with Samehada (Samehada was able to somewhat withstand Version 2 B''s
      Lariat, unlike KisameNaruto Chapter 471) | Country level (Kisame should have
      comparable durability to Samehada after fusing with it, especially because it
      had absorbed more of B''s chakra by that point.Naruto Chapter 472 In a weakened
      fusion state, with Samehada not cooperating with him, he was able to take a
      body flicker punch from KCM Naruto, though it caused him to bleed profuselyNaruto
      Chapter 505)'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman Kisame's chakra reserves were constantly stated to powerful and
      massive throughout the series. The first case emphasising Kisame's chakra was
      Nagato (Pain) stating that Kisame had the largest amount of chakra in the Akatsuki,
      this is significant because the Akatsuki contained chakra monsters like Nagato
      himself. Kisame's chakra reserves initially with a 30% clone were said to be
      greater than anyone Neji had ever seen before since Naruto. In this weakened
      state, he was able to create a massive amount of water as far as the eye could
      see in his battle against Team Guy with just a fraction of his chakra, and this
      is stated in Sha no Sho to be because of his enormous chakra reserves, comparable
      to that of Naruto, which makes the scale of his ninjutsu is incredible.Sha no
      Sho, Page 167 Karin stated his chakra was humongousNaruto Chapter 380, page
      14 when Kisame approached Hebi. Kisame's chakra volume were comparable to those
      of jinchūriki. Chojuro stated that Kisame had jinchūriki-level chakra volumeNaruto
      Chapter 468, page 9 which when fused with Samehada resulted in him becoming
      like a bijū, outputting jinchūriki-like power, when cautioning the Gokage of
      him. Kisame was able to absorb all of Killer B's chakra, including almost all
      of Gyūki's chakra ,Naruto Chapter 472, page 13 without going insane or dying.Naruto
      Chapter 471, page 11 This replicates a similar feat to Kinkaku and Ginkaku whereas
      others who attempted to eat the Gyūki's chakra meat through his tentacles died.Naruto
      Chapter 529, page 4 Kisame has a high pain tolerance. When Bee's Lariat blew
      his chest open, he shrug it off by smiling and sarcasm. When captured on Turtle
      Island, he bit off his own tongue in order to avoid giving up intel, and willingly
      allowed himself get eaten alive by sharks without making a single noise)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, Several Meters with Samehada, Kilometres with Suiton,
      Interdimensional with Summoning
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'At least Above Average Despite seeming to be merely quick-tempered, bloodthirsy
      and bellicose, Kisame has been shown to be very observant and tactical, in truth,
      a more analytical thinker. He realised Killer B''s tactics very quickly whilst
      battling him and was able to counter him. He attacked B''s comrades to trick
      B into melee range. He managed to fake his own death in order and infiltrate
      Kumogakure undetected where he was able to gather intel for the Akatsuki. The
      sensors in Kumogakure couldn''t detect him because he shared the same chakra
      signature with Samehada, and he was only foiled when Naruto spontaenously gained
      the ability to sense emotions after gaining control over Kurama''s chakra and
      entering Bijū Chakra Mode.Naruto Chapter 505 Before he committed suicide, he
      placed a trap within a scroll that had intelligence on the Shinobi Alliance
      to make sure it could still be delivered to his allies even after his death.
      Kisame has shown the intelligence to dissect and understand the mechanics of
      how his opponents'' abilities work whilst fighting. He was able to analyse Bee''s
      Lightning Style mid-combat, which he deduced was more piercing than Wind Style
      on average. He deduced and explained the mechanics of Asakujaku after seeing
      it just a second time. Standard Tactics: Kisame is naturally bloodlusted'
    source_ids: *id002
    confidence: 0.95
