power_scale:
  tier:
    text: '{{7-A}} physically, {{Varies}} with Chakra Absorption, up to {{6-B}} with
      Water Style and Samehada | {{6-B}}, higher with Chakra Absorption'
    source_ids: &id002
    - mediawiki-3395
    confidence: 0.95
  attack_potency:
    text: 'Mountain level physically (Easily fended off multiple attacks from Killer
      B and Sabu. Blocked Bee''s bladed thrust with Samehada and matched his headbuttNaruto
      Chapter 470. He outmuscled Version 1 Bee with support from Samehada, throwing
      the rushing Bee over his shoulderNaruto Chapter 471100 Megatons), Varies with
      Chakra Absorption (Samehada has the ability to shave off chakra from Kisame''s
      opponents and store it within itself; Kisame then gains access to all of this
      stolen chakra either through direct physical contact or by fusing with the blade.Naruto
      Chapter 471 Additionally, his Suiton: Daikōdan no Jutsu can absorb chakra from
      his opponents techniques in order to simultaneously weaken their attack while
      growing larger and strongerNaruto Chapter 507), up to Country level with Samehada
      and Water Style (He was able to defeat Rōshi, who was utilizing Son Gokū''s
      power, using Samehada and Water Style.Sha no Sho, Page 183 He pushed Might Guy
      to activate the 6th GateNaruto Chapter 258 even with a 30% clone of himself.
      Later on Kisame stalemated 6th Gate Guy''s Asakujaku with a Thousand Feeding
      Sharks, and pushed Guy to the 7th Gate,Naruto Chapter 506 though he lost to
      Guy''s Hirudora. Kisame is also superior to Suigetsu Hōzuki, and being a superior
      Water Release user he should be capable of a similar or greater output to Tate
      Eboshi, especially with techniques such as the Great Shark Bullet that surpass
      Tate Eboshi in size. Gyūki told B that he should go into Biju State because
      of the threat Kisame posedNaruto Chapter 4717 Teratons) | Country level (Kisame
      can fuse with Samehada making him far more powerful, noted as being his true
      power and reason for his moniker "Tailed Beast without a Tail".Jin no Sho, page
      179 According to the Elders of the Hidden Mist, when Kisame fuses with Samehada
      it combines his jinchuriki-level chakra volume with Samehada, he becomes like
      a bijū, outputting jinchūriki-like power,Naruto Chapter 468 with the scale of
      reference for jinchūriki in the Hidden Mist being Yagura Karatachi), higher
      with Chakra Absorption (Kisame can get stronger by absorbing chakra from his
      opponents with Samehada and then gaining access to all of this stolen chakra.Naruto
      Chapter 471 During his battle against Killer B, Kisame absorbed a massive amount
      of chakra from Bee to the point Gyūki was almost completely drained. Gyūki stated
      that Kisame was capable of killing Bee, which he almost did with the ease. He
      completely overwhelmed Bee and drove him to near death. White Zetsu posing as
      Kisame even thought Bee was quite disappointingNaruto Chapter 472)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: At least Sub-Relativistic (A weakened clone of his was able to keep up with
      Might Guy. He was able to battle evenly against base Killer B) | Relativistic
