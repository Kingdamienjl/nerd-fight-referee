- id: claim-powers-and-abilities-12003050
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Preparation, Social
    Influencing (Social position and Reputation. He was made deputy-commander of the
    Fourth Division and chief-strategist of the entire Allied Shinobi Forces, the
    Seventh Hokage's right-hand man, and became the eight Hokage), Acrobatics, Statistics
    Amplification (Shinobi are capable of enhancing their physical capabilities with
    the use of chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance their
    speed by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto
    Chapter 71), Surface Scaling and Water Walking (By focusing chakra at the soles
    of their feet, Shinobi can scale and cling to vertical surfaces, and even walk
    on waterNaruto Chapter 18Naruto Chapter 90), Fire Manipulation, Earth Manipulation,
    Shadow Manipulation and Body Puppetry (He can manipulate his shadow to restrain,
    control, or attack targets), Afterimage Creation, Stealth Mastery, and Speed Enhancement
    (The Substitution Jutsu allows its user to instantly replace themselves with a
    nearby object such as a tree log, plant, person, or clone at the exact moment
    they are attacked. The Jutsu works even if the user is physically restrained or
    observed by characters as observant as Sharingan or Sage Mode users. This creates
    the optical illusion of the user being hit, which confuses the opponent and gives
    them an opening to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto
    Chapter 374Naruto Chapter 580Naruto Chapter 674), Information Analysis and Photographic
    Memory (Figures out how Hidan's ritual works, after memorizing it), Minor Illusion
    Creation and Duplication (With the Clone TechniqueRin no Sho, Page 220, Shinobi
    can create illusionary duplicates of themselves that have no physical substance),
    Shapeshifting (With the Transformation TechniqueRin no Sho, Page 220, Shinobi
    can transform themselves into other people, animals, plants, and even inanimate
    objects, such as weapons), Paralysis Inducement (With the Temporary Paralysis
    TechniqueRin no Sho, Page 176, Shinobi can completely paralyze their targets from
    close to mid range) Supernatural Willpower (Ada acknowledged Shikamaru's attempt
    to resist her charm)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
