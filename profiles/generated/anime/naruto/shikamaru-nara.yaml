- id: claim-weaknesses-7fba16c9
  section: weaknesses
  axis: weakness
  text: 'Very lazy until Asuma died, currently lacks powerful attacks. His Shadow
    Manipulation technique consumes large amounts of chakra and can be overpowered
    with enough physical force or chakra absorption. Notable Attacks/Techniques: *Kagemane
    no Jutsu: Allows Shikamaru to extend his shadow. Once it comes into contact with
    the opponent''s shadow, they are forced to imitate Shikamaru''s movements. Can
    work on multiple targets. This technique can only work for a limited amount of
    time. *Kage Kubi Shibari no Jutsu: Shikamaru''s extended shadow takes the shape
    of a hand and can restrain the opponent or snap their neck. Stronger opponents
    can overpower this technique. *Kagemane Shuriken no Jutsu: Taking advantage of
    Asuma''s chakra knives, Shikamaru will store his shadow chakra in the blades.
    He will target his opponent''s shadow with sharp objects and can "capture" them
    similar to Kagemane no Jutsu. *Kage Nui no Jutsu: Shikamaru creates multiple shadow
    tendrils that are no longer bound to the ground like his other techniques. The
    tendrils have a piercing effect and can be used to restrain an opponent and even
    pick up objects and throw objects. ==Gallery== File:Shikamaru1.png|Pre-Timeskip
    Shikamaru. File:Tumblr inline nemnu2YbvB1rpq66e.png|The last Shikamaru. Shikiamaru415d.PNG|Adult
    Shikamaru. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    {{scroll box|content={{reflist|2}}}} ==Notes/Explanations== {{discussions}} Category:Characters
    Category:Naruto Category:Anime Characters Category:Humans Category:Geniuses Category:Heroes
    Category:Good Characters Category:Male Characters Category:Manga Characters Category:Ninjas
    Category:Parents Category:Duplication Users Category:Shapeshifters Category:Acrobats
    Category:Surface Scalers Category:Paralysis Users Category:Statistics Amplification
    Users Category:Afterimage Users Category:Stealth Masters Category:Free Movement
    Users Category:Illusionists Category:Kunai Users Category:Shuriken Users Category:Wire
    Users Category:Bomb Users Category:Knife Users Category:Weapon Masters Category:Kids
    Category:Teenagers Category:Adults Category:Married Characters Category:Leaders
    Category:Boruto Category:Chi Users Category:Energy UsersCategory:Extrasensory
    Perception Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
