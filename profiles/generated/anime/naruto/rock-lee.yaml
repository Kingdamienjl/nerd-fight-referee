- id: claim-weaknesses-ff83e202
  section: weaknesses
  axis: weakness
  text: 'Limited to Taijutsu, opening too many gates wears out his body, has an extremely
    low tolerance towards alcohol. Notable Attacks/Techniques: *{{Nihongo||木ノ葉旋風|Konoha
    Senpū|extra2="Leaf Whirlwind"}}: A whirlwind-like spinning kick. *{{Nihongo||表蓮華|Omote
    Renge|extra2="Front Lotus"}}: Lee sends the opponent flying into the air and crashes
    them into the ground. *{{Nihongo||表蓮華|Hachimontonkō|extra2="Eight Inner Gates"}}:
    Lee can open 6 of the 8 gates, giving him a huge power and speed boost for a given
    time. *{{Nihongo||裏蓮華|Ura Renge|extra2="Reverse Lotus"}}: Lee knocks his opponent
    up into the air, hits them around a few times, and sends them crashing back down
    to the ground. *{{Nihongo||酔拳|Suiken|extra2="Drunken Fist"}}: Lee gets a small
    power-up when he consumes alcohol. Based on Jackie Chan''s drunken fist. ==Notable
    Matchups== Victories: Morgiana (Magi) Morgiana''s Profile (Base Morgiana and Part
    1 Lee were used, Lee had knowledge of Morgiana beforehand, and speed was equalized)
    Neji Hyūga (Naruto) Neji''s Profile (Chūnin Exams Preliminary keys were used)
    Yuji Itadori (Jujutsu Kaisen) Yuji’s Profile (Vs Mahito Arc Yuji and Part I Lee
    were used. Lee could open the first gate. Fight took place in a football arena
    sized boxing ring and speed was equalized) Losses: Jotaro Kujo (JoJo''s Bizarre
    Adventure) Jotaro Kujo''s Profile (Chunin Exams Rock Lee and Part 3 Jotaro Kujo
    were used. They start 5 Meters away from each other and takes place in the Chunin
    Exams arena. Rock Lee can use the Eight Gates and Jotaro has access to his Time
    Stop. Speed was equalized) Vinsmoke Sanji (One Piece) Sanji''s Profile (Chunin
    Exams Rock Lee and East Blue Saga Sanji were used. Rock Lee started with the Gates.
    Speed was equalized) Sasuke Uchiha (Naruto) Sasuke''s Profile (Chunin Exams Rock
    Lee and Chūnin Exams Finals to Konoha Crush were used. Rock Lee started with the
    First Gate and could increase the number of Gates) Inconclusive: ==References==
