  text: Base= Superhuman Physical Characteristics, Acrobatics, Adept Kunai/Shuriken
    User, Infrared Vision and Enhanced Hearing (Possesses infrared ray detection and
    a hearing sense for low frequency waves within his body), Wind Manipulation, Lightning
    Manipulation, Duplication (Can create illusionary clones with no substance), Afterimage
    Creation, Stealth Mastery, and Speed Enhancement (The Substitution Jutsu allows
    its user to instantly replace themselves with a nearby object such as a tree log,
    plant, person, or clone at the exact moment they are attacked. The Jutsu works
    even if the user is physically restrained or observed by characters as observant
    as Sharingan or Sage Mode users. This creates the optical illusion of the user
    being hit, which confuses the opponent and gives them an opening to flee or counterattackNaruto
    Chapter 6Naruto Chapter 54Naruto Chapter 374Naruto Chapter 580Naruto Chapter 674),
    Statistics Amplification (Shinobi are capable of enhancing their physical capabilities
    with the use of chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance
    their speed by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter
    24Naruto Chapter 71), Surface Scaling and Water Walking (By focusing chakra at
    the soles of their feet, Shinobi can scale and cling to vertical surfaces, and
    even walk on waterNaruto Chapter 18Naruto Chapter 90), Can stretch his limbs and
    roughly change his body shape, Regeneration (Low, healed a small cut. Low-Mid
    over-time, regenerated a new arm over-time), Absorption (Can absorb natural energy
    to greatly increase the power of all his abilities), Self-Sustenance (Type 2),
    Can summon snakes, Healing abilities, Can use curse techniques, Paralysis Inducement
    (via lightning style and likely paralysis jutsu), Sealing (can seal people's movements),
    Transformation with Sage Mode (Can expose his special body fluids to natural energy
    to gain increased physical capabilities [strength, speed, stamina, reflexes, perception
    and durability] and the ability to perform various shape-shifting feats), Limited
    Resistance to Transmutation (Due to Mitsuki's heightened immune system, he was
    able to slow down the affects of Hashirama's cells turning him into a tree) |-|Sage
    Transformation/Sage Mode= Ali previous abilities, Aura (He has a cyan chakra shroud
    that forms into ethereal snakes around his body), Enhanced Senses and Extransensory
    Perception with Sage Mode (Can sense chakra around him and can sense attacks without
    the need to see them), Limited Petrification and Transmutation (Opponents who
    absorb excess amounts of natural energy from him without the ability to properly
    balance it will subsequently be turned to stone and into a frog), Energy Absorption
    (Can passively absorb natural energy), Energy Manipulation (Can manipulate natural
    energy and combine it with chakra to create senjutsu chakra), Statistics Amplification
    (With senjutsu chakra the user's physical strength, speed, stamina, reflexes,
    perception, and durability are enhanced, and their ninjutsu, genjutsu, and taijutsu
    become more powerful)
