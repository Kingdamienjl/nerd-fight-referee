- id: claim-weaknesses-422807cd
  section: weaknesses
  axis: weakness
  text: "It will die if the host does. Like all Tailed Beasts, it can't properly focus its power without\
    \ a Jinchuriki's aid and thus throws around its power randomly. Notable Attacks and Techniques: *:\
    \ **: Shukaku can use Wind and Earth Release nature transformations to rapidly fire wind bullets with\
    \ enough force to level entire forests. **: Likewise, it can combine its wind abilities with sand\
    \ in order to produce a mass of fast-moving sand bullets. *Sealing: Shukaku is the only Tailed Beast\
    \ that can use cursed seals from its markings, creating a magnetic field to bind his targets. **:\
    \ Using a large quantity of sand, Shuhaku covers his enemy with several successive layers of the material,\
    \ before compressing it into the form of a huge pyramid which serves to imprison the target upon its\
    \ completion. *Tailed Beast Shockwave: A tailed beast uses its massive chakra reserve to turn anything\
    \ from a roar or a wave into a powerful force of pressure and destruction. *: The Tailed Beast Bomb\
    \ is the ultimate technique of a Tailed Beast and its Jinch\u016Briki. To form the attack, they gather\
    \ both positive black chakra, and negative white chakra, then shape it into a sphere. The ball can\
    \ be fired differently, either in a spherical form, which can be detonated for a wave explosion or\
    \ launched to form a dome-shaped blast which flattens and erases everything around it, or as a concentrated\
    \ beam of energy which gives it explosive penetrative power."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-1abad334
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics **Incorporeality (Although the Tailed Beasts transform into\
    \ physical matter and give themselves normal biological bodies, they are primarily made entirely out\
    \ of energy and have been shown to exist in this state. As they are masses of energy in this state,\
    \ they are impossible to kill by normal means) **Large Size (Type 1) *Chakra Manipulation **Enhanced\
    \ Senses & Extrasensory Perception (Able to detect chakra from great distances) **Nature Transformation:\
    \ ***Air Manipulation (Is able to utilize Wind Release jutsu such as Air Bullets) ***Magnetism Manipulation\
    \ (Can utilize Magnet Release) **Energy Projection (Can fire Tailed Beast Bombs) *Sand Manipulation\
    \ **Inorganic Physiology (Type 1) & Elemental Intangibility (Shukaku is made of sand) **Sealing (Can\
    \ utilize its Cursed Marks along with sand to create F\u016Binjutsu such as sealing pyramids) *Limited\
    \ Telepathy (Can communicate with the other Tailed Beasts and their Jinch\u016Briki through thought)\
    \ *Immortality (Type 1 - Bijuu are beings made of pure ChakraNaruto Chapter 256Naruto Chapter 467,\
    \ and as such should not be capable of dying from old age as creatures that physiologically exist\
    \ as pure life forceNaruto Chapter 90) *Resurrection (Mid-Godly - Bijuu will resurrect even if their\
    \ minds, bodies, and souls have been completely erasedBoruto: Two Blue Vortex Chapter 10, this is\
    \ shown when Kurama resurrected from the complete destruction of his chakra via a process akin to\
    \ Nuclear FusionBoruto: Naruto Next Generations Chapter 55. The deceased Bijuu will however revive\
    \ after a completely indeterminable amount of time has passed in a random place.) **Immortality (Type\
    \ 4 - A \"Kernel\" will sprout to bring a Bijuu back to life even if their body and soul have been\
    \ completely destroyedBoruto Two Blue Vortex Chapter 10) *Possession (Is able to possess his own Jinch\u016B\
    riki when they fall asleep) *Non-Physical Interaction with Tailed Beast Chakra Arms (Tailed Beast\
    \ Chakra Arms users can physically interact with intangible objects like their soul when it's halfway\
    \ extracted from them) Resistance to: *Paralysis Inducement, Body Puppetry & Possession (Tailed Beasts\
    \ and their Jinch\u016Briki are capable of resistingNaruto Chapter 444Naruto Chapter 567 the binding\
    \ effects and control of the Rinnegan's Black Receivers)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
