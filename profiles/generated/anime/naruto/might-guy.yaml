  section: abilities
  axis: hax
  text: Base= Superhuman Physical Characteristics, Expert Martial Artist, Weapon Mastery (Highly skilled
    in wielding Nunchaku), Acrobatics, Statistics Amplification (Shinobi are capable of enhancing their
    physical capabilities with the use of chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance
    their speed by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71),
    Surface Scaling and Water Walking (By focusing chakra at the soles of their feet, Shinobi can scale
    and cling to vertical surfaces, and even walk on waterNaruto Chapter 18Naruto Chapter 90), Electricity
    Manipulation, Body Control (Via the Eight Gates), Afterimage Creation, Stealth Mastery, and Speed
    Enhancement (The Substitution Jutsu allows its user to instantly replace themselves with a nearby
    object such as a tree log, plant, person, or clone at the exact moment they are attacked. The Jutsu
    works even if the user is physically restrained or observed by characters as observant as Sharingan
    or Sage Mode users. This creates the optical illusion of the user being hit, which confuses the opponent
    and gives them an opening to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter
    374Naruto Chapter 580Naruto Chapter 674), Analytical Prediction (Via tracking enemy movements by observing
    their feet), Statistics Amplification (via the Eight Gates), Summoning, Minor Illusion Creation and
    Duplication (With the Clone TechniqueRin no Sho, Page 220, Shinobi can create illusionary duplicates
    of themselves that have no physical substance), Shapeshifting (With the Transformation TechniqueRin
    no Sho, Page 220, Shinobi can transform themselves into other people, animals, plants, and even inanimate
    objects, such as weapons), Paralysis Inducement (With the Temporary Paralysis TechniqueRin no Sho,
    Page 176, Shinobi can completely paralyze their targets from close to mid range), Genjutsu Nullification
    (Shinobi can typically break free from and nullify non-ocular genjutsu by intentionally disrupting
    the flow of chakraSha no Sho, Page 301 within their bodies), Supernatural Willpower (Can endure the
    8 Gates' effects) |-|Sixth Gate= All previous abilities, Fire Manipulation and Danmaku with Morning
    Peacock (Can produce a series of rapid punches that ignite his hands through air friction) |-|Seventh
    Gate= All previous abilities, Vibration Manipulation and Air Manipulation with Daytime Tiger (Can
    launch concentrated air pressure at opponents that violently expands on contact) |-|Eighth Gate= All
    previous abilities, Pseudo-Flight (Able to kick the air to move around with the Eighth Gate), Vibration
    Manipulation and Air Manipulation with Evening Elephant (Can create powerful shock-waves of air with
    his punches, that can be used from a distance), Limited Spatial Manipulation with Night Guy (He distorted
    space with his speed)
