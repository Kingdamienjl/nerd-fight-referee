      of Tsunade's by ChiyoNaruto Chapter 265Naruto Chapter 26953.15 Megatons) | At
      least Country level (Stated to be capable of killing Kabuto in a single blow,
      and could keep up with an amped Kabuto while exhausted and crippled by her Hemophobia.Naruto
      Chapter 164 Once she got over her hemophobia, she was able to draw blood from
      Orochimaru and beat him around, even while heavily injured.Naruto Chapter 169
      She then easily incapacitated Manda,Naruto Chapter 170 and defeated Orochimaru
      with a single blow, forcing him to retreat.Naruto Chapter 171 The Sannin were
      stated to be capable of defeating each other.Naruto Chapter 91 The Sannin were
      said to be equal to the Gokage.Kai no Sho, page 89 She is hailed as the world's
      strongest Kunoichi,Naruto Chapter 172 which should make her in a similar realm
      of power as Mei Terumi. Completely unfazed by the prospect of fighting the Fourth
      RaikageNaruto Chapter 5444 Teratons), far higher with Byakugō (Madara stated
      that she is stronger than the Raikage.Naruto Chapter 577 She was able to shatter
      Madara's Susano'o ribcage with a kick, and then punched straight through Madara
      himself.Naruto Chapter 577 She was able to shatterNaruto Chapter 578 multiple
      of Madara's Susano'o blades.Naruto Chapter 588 She was capable of fighting Madara's
      Humanoid Susano'o clones, and could slam one of them into the ground with a
      punchNaruto Chapter 588)
    source_ids: *id002
    confidence: 0.95
