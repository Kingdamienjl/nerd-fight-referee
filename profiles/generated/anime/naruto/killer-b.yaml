- id: claim-powers-and-abilities-a13260ce
  section: abilities
  axis: hax
  text: "{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Base= *Superhuman Physical Characteristics\
    \ **Regeneration (Mid-Low; Killer B can heal from the damage that is dealt to his body upon entering\
    \ Tailed Beast State, which peels off his skinNaruto, Chapter 413: Pages 20-21Naruto, Chapter 419:\
    \ Pages 13-16) *Acrobatics *Chakra Manipulation **Fire Manipulation, Water Manipulation & Vibration\
    \ Manipulation via Lightning Manipulation **Statistics Amplification (Shinobi are capable of enhancing\
    \ their physical capabilities with the use of chakra. The Bodyflicker Jutsu allows Shinobi to greatly\
    \ enhance their speed by focusing chakra in their feetRin no Sho, Page 197Naruto, Chapter 24Naruto,\
    \ Chapter 71) **Surface Scaling & Water Walking (By focusing chakra at the soles of their feet, Shinobi\
    \ can scale and cling to vertical surfaces, and even walk on waterNaruto, Chapter 18Naruto, Chapter\
    \ 90) **Minor Illusion Creation & Duplication (With the Clone Jutsu,Rin no Sho, Page 220 can create\
    \ ink clones that bind their target) **Shapeshifting (With the Transformation Jutsu,Rin no Sho, Page\
    \ 220 Shinobi can transform themselves into other people, animals, plants, and even inanimate objects,\
    \ such as weapons) **Paralysis Inducement (With the Temporary Paralysis Jutsu,Rin no Sho, Page 176\
    \ Shinobi can completely paralyze their targets from close to mid range) *Jinch\u016Briki: **Multiple\
    \ Selves (All Types; As a Jinch\u016Briki) **Limited Telepathy (Can communicate with the other Tailed\
    \ Beasts through thought) **Genjutsu Nullification (Jinch\u016Briki who have gained the cooperation\
    \ of their Tailed Beast can be broken free from genjutsuNaruto, Chapter 413Naruto, Chapter 549 with\
    \ the help of their Tailed Beast) **Transformation (Can partially or fully transform into his Tailed\
    \ Beast to greatly improve his overall statistics) **Sealing & Status Effect Inducement (Can blind\
    \ targets and obscure their vision with ink) *Samehada: **Expert Swordsmanship & Chakra Absorption\
    \ (Samehada can consume nearly any form of Chakra) |-|Jinch\u016Briki Cloak=All previous abilities\
    \ enhanced, can expand his chakra to make it act as a Forcefield around him plus: *Non-Physical Interaction\
    \ (Soul; Tailed Beast Chakra Arms users can physically interact with intangible objects like their\
    \ soul when it's halfway extracted from them) Resistance to: *Paralysis Inducement, Body Puppetry\
    \ & Possession (The Tailed Beast and their Jinch\u016Briki are capable of resistingNaruto, Chapter\
    \ 444Naruto, Chapter 567 the binding effects and control of the Rinnegan's Black Receivers) |-|Tailed\
    \ Beast Mode=All previous abilities significantly enhanced plus: *Energy Projection (Can fire Tailed\
    \ Beast Bombs) *Air Manipulation (Can generate powerful tornadoes by spinning his tentacles rapidly)\
    \ *Large Size (Type 1) *Regeneration (Limited Low-Mid; Gy\u016Bki's limbs regrow after being chopped\
    \ off or burned.Naruto, Chapter 415: Pages 4-5Naruto, Chapter 419: Pages 14-15Naruto, Chapter 555:\
    \ Page 9 The regeneration appears to be limited to his tails/tentacles only, as one of the horns cut\
    \ off by the Fourth Raikage didn't completely regrow even after several years) }} |-|Base"
