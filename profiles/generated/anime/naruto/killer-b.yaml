- id: claim-weaknesses-a052681e
  section: weaknesses
  axis: weakness
  text: "Unlike Naruto, he needs to fully transform into Gy\u016Bki to use his Tailed Beast Bomb. Notable\
    \ Attacks and Techniques: *Kenjutsu: While carrying only two swords in his youth, B has greatly developed\
    \ his swordsmanship in adulthood. Possessing a unique style, he holds seven blades in between his\
    \ left armpit, both elbows, right leg, stomach, the right side of his neck, and in his mouth. As strange\
    \ as it appears, B is very skilled in this style, easily pressuring his enemies with unpredictable\
    \ swings from various angles like hip-hop dance. When he finds an opening, he can quickly impale his\
    \ opponent with several blades. *{{Nihongo|Nature Transformation|{{Ruby|\u6027|\u305B\u3044}}{{Ruby|\u8CEA\
    |\u3057\u3064}}{{Ruby|\u5909|\u3078\u3093}}{{Ruby|\u5316|\u304B}}|Seishitsu Henka}}: B is capable\
    \ of using Lightning, Fire, Water, and Yang Release nature transformations. With lightning, he has\
    \ displayed the ability to flow lightning-natured chakra through his blades to increase their cutting\
    \ power. B's skill with Lightning Release can charge a sharp but weak pencil-point to pierce straight\
    \ through a large tree trunk and even through the ground. As stated by Kisame, B does this by increasing\
    \ the vibration frequency of his lightning chakra high enough to surpass the standard penetrative\
    \ force of Wind Release techniques. **{{Nihongo|Lightning Style: Lariat|{{Ruby|\u96F7|\u3089\u3044\
    }}{{Ruby|\u9041|\u3068\u3093}}\u30FB{{Ruby|\u96F7\u7282\u71B1\u5200|\u30E9\u30EA\u30A2\u30C3\u30C8\
    }}|Raiton: Rariatto}}: A powerful taijutsu technique whereby the user charges at their opponent, striking\
    \ them with a Lariat move, which can be coated in chakra. A successful strike can blow away a target's\
    \ entire chest with a direct hit, which may not kill them right away, but will ultimately kill them\
    \ if they are not treated. *{{Nihongo|Tailed Beast Bomb|{{Ruby|\u5C3E|\u3073}}{{Ruby|\u7363|\u3058\
    \u3085\u3046}}{{Ruby|\u7389|\u3060\u307E}}|Bij\u016Bdama}}: The user collects a lot of Yin and Yang\
    \ chakra which is compacted into a spherical shape, which can be fired directly through the mouth,\
    \ or digested which is then fired in the form of a massive energy blast. ==Notable Matchups== Victories:\
    \ *Six Paths of Pain (Naruto) Pain's Profile (Six Paths of Pain were used) Losses: Inconclusive: ==References==\
    \ {{Scroll box|content={{Reflist|2}}}} ==Statistics Values== {{Scroll box|content=}} ==Notes/Explanations==\
    \ {{Scroll box|Content=}} {{Discussions}} Category:Characters Category:Naruto Category:Absorption\
    \ Users Category:Acrobats Category:Adults Category:Air Users Category:Anime Characters Category:Chi\
    \ Users Category:Duplication Users Category:Electricity Users Category:Energy Users Category:Fire\
    \ Users Category:Forcefield Users Category:Free Movement Users Category:Good Characters Category:Humans\
    \ Category:Illusionists Category:Ink Users Category:Large Sized Characters Category:Male Characters\
    \ Category:Manga Characters Category:Multiple Selves Users Category:Ninjas Category:Non-Physical Interaction\
    \ Users Category:Paralysis Users Category:Rappers Category:Regeneration Users Category:Sealing Users\
    \ Category:Shapeshifters Category:Soul Users Category:Statistics Amplification Users Category:Status\
    \ Effect Users Category:Surface Scalers Category:Sword Users Category:Telepaths Category:Transformation\
    \ Users Category:Vibration Users Category:Water Users Category:Weapon MastersCategory:Extrasensory\
    \ Perception UsersCategory:Knife Users Category:Dual Wielders Category:Tail Users Category:Horn Users\
    \ Category:Tentacle Users"
