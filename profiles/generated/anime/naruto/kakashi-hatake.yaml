- id: claim-powers-and-abilities-b9b55a0a
  section: abilities
  axis: hax
  text: "Base= Superhuman Physical Characteristics, Social Influencing (Reputation - Named \u201Cthe copy\
    \ ninja\u201D and \"Kakashi of the Sharingan\" for having the record of having copied over a 1000\
    \ jutsu through the possession of his Sharingan), Supernatural Willpower (Endured Itachi Uchiha torturing\
    \ him for at least 72 hours in Tsukiyomi without going mad, although he was put in a coma from the\
    \ effects), Genius Intelligence, Chakra Manipulation, Statistics Amplification (Shinobi are capable\
    \ of enhancing their physical capabilities with the use of chakra. Able to open the first gate. The\
    \ Shunshin no Jutsu allows Shinobi to greatly enhance their speed by focusing chakra in their feetRin\
    \ no Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and Water Walking (By focusing\
    \ chakra at the soles of their feet, Shinobi can scale and cling to vertical surfaces, and even walk\
    \ on waterNaruto Chapter 18Naruto Chapter 90), Expert Hand-to-Hand Combatant, Lightning Manipulation,\
    \ Enhanced Smell and Hearing, Afterimage Creation, Stealth Mastery and Speed Enhancement (The Substitution\
    \ Jutsu allows its user to instantly replace themselves with a nearby object such as a tree log, plant,\
    \ person, or clone at the exact moment they are attacked. The Jutsu works even if the user is physically\
    \ restrained or observed by characters as observant as Sharingan or Sage Mode users. This creates\
    \ the optical illusion of the user being hit, which confuses the opponent and gives them an opening\
    \ to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter 374Naruto Chapter 580Naruto\
    \ Chapter 674), Explosion Manipulation with explosive tags, Minor Illusion Creation and Duplication\
    \ (With the Clone Technique,Rin no Sho, Page 220 Shinobi can create illusionary duplicates of themselves\
    \ that have no physical substance. Can also create Shadow Clones, lightning clones that can perform\
    \ the same function, on top of paralysing opponents on contact, and water clones), Shapeshifting (With\
    \ the Transformation Technique,Rin no Sho, Page 220 Shinobi can transform themselves into other people,\
    \ animals, plants, and even inanimate objects, such as weapons), Paralysis Inducement (With the Temporary\
    \ Paralysis Technique,Rin no Sho, Page 176 Shinobi can completely paralyze their targets from close\
    \ to mid range), Weapon Mastery (Expert in the use of kunai, shuriken, and other ninja weaponry. As\
    \ an adult, he can channel lightning into them to further increase their sharpness, cutting power,\
    \ and may paralyze the target), Water Manipulation (Kakashi can use Water Wall and Water Dragon Blast\
    \ no Jutsu), Fear-inducing aura (Exposed to Kakashi's aura, Sasuke wanted to kill himself), Earth\
    \ Manipulation, Sealing (Could seal Sasuke's curse mark with his blood), Summoning (Can summon different\
    \ weapons of varying sizes, and dogs that assist in tracking and espionage, and can restrain targets,\
    \ leaving them open and vulnerable to attack), Genjutsu Nullification (Shinobi can typically break\
    \ free from and nullify non-ocular genjutsu by intentionally disrupting the flow of chakraSha no Sho,\
    \ Page 301 within their bodies), Resistance to Fear Manipulation and Madness Manipulation (Type 3:\
    \ Unfazed by Zabuza's aura) |-|Sharingan= Enhanced Sight (The Sharingan provides its user with an\
    \ incredible clarity of perception.Naruto Chapter 26 This allows the user to easily keep trackNaruto\
    \ Chapter 27Naruto Chapter 49 of fast-moving targets with astonishing clarity. This clarity of vision\
    \ also allows the user to easily perceive and decipherNaruto Chapter 333 hand seals at great speeds,Naruto\
    \ Chapter 361 read lips,Naruto Chapter 246 and perceive pencil movements in order to mimic them.Naruto\
    \ Chapter 41 The Sharingan can also see chakraNaruto Chapter 361 as different colors, even through\
    \ certain solid obstacles,Naruto Chapter 579 and even perceive invisible individualsNaruto Chapter\
    \ 242 and entities.Naruto Chapter 551 The Sharingan also allows its user to focus their vision and\
    \ act like a microscope, allowing it to see objects on a cellular levelNaruto Chapter 361 and clearly\
    \ perceive virusesBoruto Chapter 41), Analytical Prediction (The Sharingan allows its user to clearly\
    \ anticipate their opponent's next moves and flawlessly counter them.Naruto Chapter 49 A fully matured\
    \ Sharingan can even see a clear visual image of the opponent's next moves,Naruto Chapter 230 allowing\
    \ for efficient evasion and counterattacks without any wasted movements), Information Analysis and\
    \ Power Mimicry (The Sharingan has the ability to \"discern the reality behind any technique\" and\
    \ then reflect it upon its caster.Naruto Chapter 12 This enables the user to read the way a foe weaves\
    \ seals and determine the change in chakra nature and the range of the attack from the color of chakra.Shan\
    \ no Sho, page 45 The Sharingan's ability to acquire and decipher this informationRin no Sho, pages\
    \ 192-193 allows its user to instantly understand, memorize, and mimic the opponent's Ninjutsu,Naruto\
    \ Chapter 15Naruto Chapter 26 Genjutsu"
