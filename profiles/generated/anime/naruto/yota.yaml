- id: claim-powers-and-abilities-f71db72f
  section: abilities
  axis: hax
  text: Weather Manipulation (A natural power of his clan, Yota possess the unusual ability to manipulate
    the weather regardless of the natural atmosphere he was in, being able to manifest many different
    weather effects, effectively turning them into powerful attacks or defences), Water Manipulation,
    Energy Absorption and Empathic Manipulation (When sad, Yota manifests rain, being able to make it
    rain everywhere around him or direct it at a single person if he wants to. The rain has the effect
    of absorbing people's vitality, weakening them and making them sad. Once produced in terms of offence
    and defence, he could summon varying sizes of very powerful, pressurised, water trenches to either
    block incoming attacks, restrain, or crush his opponents. He could even create huge water bubbles
    that attacks opponents with concussive force. Coming from many different directions, each of his attacks
    could manifest from anywhere within his vicinity, seemingly coming from thin air. While submerged,
    Yota has demonstrated the ability to manipulate the water surrounding him to force his targets away
    from him, or increase his speed within it), Ice Manipulation (When happy, Yota manifests snow, being
    able to turn a simple snowfall into a powerful blizzard, enabling him to near instantly freeze everything
    around him, including people), Electricity Manipulation (When angry, Yota manifests lightning, being
    able to produce large bolts of purple lightning. The lightning could be directed from anywhere, to
    anywhere the enemy is, and in rapid succession. Should the lighting ever connect, it is powerful enough
    to instantly kill the target. However, if Yota wills it, the lightning can completely obliterate the
    target, even if it is the latter himself), Air Manipulation (When he whistles, he can fully manipulate
    the direction and intensity of wind. He could summon anything from a concentrated tornado, to several
    whirlwinds. Each of these attacks have the offensive capabilities to slash and wound the intended
    target), Light Manipulation (Yota can manipulate sunlight at will, making the sun shine brightly,
    causing flowers to bloom quickly around him), Telepathy (Yota can telepathically communicate with
    others, and also connect the minds of those he chooses), Memory Manipulation and Limited Durability
    Negation (Can erase anyone's memory by touching them. By doing so, the targets are knocked out and
    once awakened, they have no recollection of targeted memories. However, Yota can restore the target's
    memories by flicking them on the forehead), Immortality (Types 1, 2, 3 and 7), Inorganic Physiology
    (Type 1), Self-Sustenance (Types 1, 2 and 3), Regeneration (Low-Godly. Edo tensei can regenerate from
    the damage caused by Deidara's C0, which vaporizes targets, as many times as he wanted. Can regenerate
    as long as his soul remains),Naruto Chapter 518 Resistance to Death Manipulation, Age Manipulation
    and Disease Manipulation
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
