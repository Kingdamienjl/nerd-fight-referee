- id: claim-standard-equipment-acd43e1e
  section: equipment
  axis: equipment
  text: '*Triple-Bladed Scythe: The Triple-Bladed Scythe is the primary weapon of
    Akatsuki-member Hidan. Its main purpose is to aid him in collecting blood for
    his curse ritual. Because of this, it is designed not so much to kill the target,
    but to wound them, no matter how big or small the wound. The three blades get
    smaller from top to bottom, giving the scythe a larger range despite decreasing
    its lethality. The scythe is attached to a long metal cable, wound around two
    spools on Hidan''s left hip. This cable is strong enough to block kunai and allows
    Hidan to further increase the scythe''s range by swinging it through the air.
    The scythe can split up and it has various other functions that were never shown.
    Due to its large size, Hidan claimed that it greatly inhibits his attack speed,
    and it makes him the slowest member in Akatsuki. Despite this, he is remarkably
    nimble in manipulating it, even being capable of using the scythe to deflect incoming
    shuriken. *Retractable Spear: This weapon is used by Hidan mostly in his Jashin
    rituals. The spear is a retractable cylinder that can be extended to its full
    size quickly. It is regularly used as Hidan''s main killing move during his ritual,
    by stabbing himself in the heart. Hidan''s rituals are usually long due to him
    liking to toy with his opponent, such as stabbing himself in several different
    areas of his body, to make them suffer before finishing them off. Hidan may also
    use it for combat, although this has only been shown to be used as a last resort
    when his Triple-Bladed Scythe was unavailable to him. He is shown to hide at least
    two of these spears in his Akatsuki cloak.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
