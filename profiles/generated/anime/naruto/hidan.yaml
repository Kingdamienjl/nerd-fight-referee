- id: claim-weaknesses-264c7da6
  section: weaknesses
  axis: weakness
  text: 'The Death Controlling Possessing Blood requires two special conditions to
    function: the user drawing an insignia of Jashin on the ground with their own
    blood and standing at the center of it, and ingesting the blood of their intended
    victim. If these two conditions are not met, the damage to Hidan would not be
    shared with his victim. Hidan is unable to move his body if it is separated from
    his head, such as by decapitation, thus rendering him helpless unless the head
    is reattached to the body. Although unable to die from most causes, Hidan can
    still die from malnutrition. Notable Attacks/Techniques: *Jujutsu: Jujutsu (literally
    meaning: Curse Technique) are a type of techniques that harm the enemy by cursing
    them. They work similar to juinjutsu, however, the user doesn''t have to apply
    a seal on the enemy to curse them. **Curse Technique: Death Controlling Possessed
    Blood: The Curse Technique: Death Controlling Possessed Blood is the exclusive
    jujutsu technique of Hidan and his primary method of killing his opponents under
    Jashinism. The technique requires two special conditions: One being that Hidan
    must have drawn an insignia of Jashin on the ground in his own blood, to which
    he must remain in the centre for the technique to function properly. The other
    being him to acquire and ingest the blood of his intended victim. Once ingested,
    his skin then turns black with white markings which makes him look like a skeleton,
    a symbol of absolute death. This serves as the link between him and his victim.
    Once his sacrificial ritual takes place, the victim''s body is linked with Hidan''s
    curse until he either steps or is forced out of the circle. Any kind of injury
    that Hidan inflicts upon himself (or the injury they inflicted on him) is reciprocated
    on his target, be it a mere scratch to a pierce in the heart. If Hidan is forced
    to step out of the circle, the link is temporarily broken and the victim is set
    free, but only as long as Hidan has stepped out of the circle''s reach. Basically,
    this technique makes Hidan a living voodoo doll. 1267.gif|Jashin Ritual with Kakuzu
    1265.gif|Jashin Ritual with Yugito 1268.gif|Hidan vs Asuma 1264.gif|Hidan vs Kakashi
    1269.gif|Hidan vs Orochimaru and Kakuzu (Storm Revolution) 1270.gif|Hidan (Naruto
    Shippuden: Ultimate Ninja Storm 4) ==Notable Matchups== Victories: Losses: Zabuza
    Momochi (Naruto) Zabuza''s Profile Inconclusive: ==References== {{scroll box|content={{reflist|2}}}}
