  intelligence:
    text: Gifted. He is a great strategist and tactical in combat. He was quickly
      able to deduce how Gaara's sand works and mixed his clay in Gaara's sand when
      he destroyed his arm. During his battle against Sasuke, he managed to trick
      him on a few occasions, such as trapping him between his C2 dragon in the sky
      and the landmines buried underneath the ground by Tobi, and again when he lured
      him into his C4 attack at point-blank. He often uses tricks, misdirection and
      calculated gambles to get his explosives in range of an opponent. He is a genius
      in creating new types of bombs and weapons.
