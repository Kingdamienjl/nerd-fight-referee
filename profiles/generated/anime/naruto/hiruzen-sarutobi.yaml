- id: claim-weaknesses-960a90c2
  section: weaknesses
  axis: weakness
  text: 'Due to his old age, both his physical stamina and chakra reserves were lacking
    compared to his earlier years. Has been repeatedly accused of being too soft and
    forgiving, which allowed Orochimaru to escape and eventually force Hiruzen to
    sacrifice himself to stop the rogue Sannin. | Abilities and weapons that disrupt
    ninjutsu like the Truth-Seeking Balls can break apart Hiruzen''s form and prevent
    him from regenerating. Notable Attacks/Techniques: Hide/Show Manga Flame Dragon
    Bullet.jpg Hiruzen Flame Dragon Bullet.gif Fire Release: The nature transformation
    governing the use of fire, it is most frequently performed by molding chakra in
    one''s stomach before releasing it in its completed form as fire from the mouth
    and lungs, but can also be applied in other forms such as smoke, ash, gunpowder,
    and in the use of explosive tags. *Fire Release: Flame Dragon Missile: Hiruzen
    kneads his chakra into flames and releases it as a dragon-shaped missile that
    he can manipulate at will to home in on his opponents from multiple directions.
    Alternatively, he can release it as a single stream of fire that can quickly spread
    across a particular location. Manga Earth Release Earth Style Wall.jpg Hiruzen
    Earth Wall.gif|Anime Depiction Earth Release: The elemental release governing
    the manipulation of the earth and ground, being frequently used in the creation
    of sturdy physical barriers due to this release''s ability to affect the density
    and hardness of earth and rock. *Earth Release: Earth Style Wall: Hiruzen creates
    a wall of solid stone to act as a barrier or to confine a target within, growing
    as high as a small building if enough chakra is put into it. Hiruzen''s use of
    this technique was powerful enough to completely divert an oncoming Water Release
    technique utilized by Tobirama Senju after the latter had been revived by Orochimaru''s
    use of the Impure World Reincarnation technique. Hiruzen Shadow Clone Technique.gif|Shadow
    Clone Technique Manga Shuriken Shadow Clone Technique.jpg|Shuriken Shadow Clone
    Technique Hiruzen Shuriken Shadow Clone Technique.gif|Anime Depiction Manga Five
    Release Great Combo Technique Resave.png|Five Release Great Combo Technique Five
    Release Great Combo Technique.gif|Anime Depiction Shadow Clone Technique: Hiruzen
    can create physical clones of himself that can fight independently of him and
    even perform their own techniques. However, the clones can be dispersed instantly
    if struck with a sufficiently powerful blow. *Shuriken Shadow Clone Technique:
    Hiruzen applies the Shadow Clone Technique to shuriken that he has already thrown,
    quickly multiplying their numbers to turn a small handful into a veritable barrage
    in an instant. This can be applied to both normal shurikens as well as the much
    larger fuma shuriken. *Five Release Great Combo Technique: After creating four
    shadow clones of himself, Hiruzen and his clones each perform a massive display
    of one of the five basic elemental natures from multiple directions to either
    nullify an oncoming attack or overwhelm a single target from all sides. This technique
    was powerful enough to completely match a similar technique used by Zetsu-controlled
    Yamato during the Fourth Great Shinobi War. Monkey King Enma Summoning.jpg|Summoning
    Enma Summoning Monkey King Enma.gif|Anime Depiction Manga Transformation Adamantine
    Staff.jpg|Transformation: Adamantine Staff Transformation Adamantine Staff.gif|Anime
    Depiction Dead Demon Consuming Seal.gif|Dead Demon Consuming Seal Summoning Technique:
    The Summoning Technique is a space-time ninjutsu that can summon weapons, familiars,
    tools, and other targets across vast distances by using blood as a sacrifice.
    Like most ninja, Hiruzen can only summon creatures with whom he has a contract
    with. Besides, Hiruzen has demonstrated the ability to counter the use of this
    technique by others, halting the summoning of the Fourth Hokage through the Impure
    World Reincarnation Technique while battling Orochimaru. *Monkey King: Enma: Hiruzen''s
    trusted ally and long-time contract holder, Enma is a mighty familiar who is proficient
    in both the use of ninjutsu and taijutsu, being able to fight independently of
    Hiruzen if necessary. **Transformation: Adamantine Staff: Enma transforms into
    a staff of unparalleled hardness to be used as a weapon in combat, proving sufficiently
    strong and sturdy to shatter the wood constructs created by Hashirama Senju and
    the branches of the Ten-Tails with ease even while acting independently of Hiruzen.
    Enma can extend and expand at will in this form to catch foes off guard as well
    as manifest his limbs to grasp and claw at enemies. However, although Enma is
    incredibly durable in this form, he isn''t invulnerable, as the Sword of Kusanagi
    used by Orochimaru proved sharp enough to cut him. **Adamantine Prison Wall: Enma
    multiplies his staff form to form a protective cage around Hiruzen. Supposedly
    being "impossible to break," it proved sufficiently durable to protect Hiruzen
    from the Wood Release technique'
