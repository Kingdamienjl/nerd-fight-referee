- id: claim-weaknesses-ef83c1c4
  section: weaknesses
  axis: weakness
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Base=Minato can only teleport things he
    or his Chakra are directly touching. Objects of larger sizes require more Chakra to teleport them.
    The Reaper Death Seal inevitably results in the casters death, and their soul being sealed within
    the belly of the Reaper. Certain bodies cannot contain sufficiently powerful objects, making sealing
    something inside of them physically impossible. Sensory Ninja can be reverse tracked by other skilled
    sensors.Naruto, Chapter 464: "The Power of Darkness...!!" Gamakure Jutsu leaves the user especially
    vulnerable to sensory-type ninja at the exact moment they exit the barrier space.Sha no Sho, Page
    238 |-|Sage Mode=Failure to perfectly manipulate Sage Chakra, will result in acquiring additional
    frog-like features when using Sage Mode. To enter Sage Mode, one has to stay perfectly still while
    they absorb Nature Energy and convert it into Senjutsu chakra, which is extremely impractical in combat.
    Sage Mode also has a very short time limit, only lasting for five minutes at most. Finally, if one
    fails to balance the Nature Energy intake with their own chakra, and absorb an excessive amount of
    Nature Energy, they will be permanently turned into a frog statue. Minato, despite his lack of frog-like
    features, which is indicative of perfect control over Sage Chakra, has admitted to the form not being
    his forte. This is because he never truly overcame these weaknesses. The Sage Arts take a long time
    for him to build up the necessary natural chakra, and he additionally has a severely limited amount
    of time with it. It was for these reasons that he rarely used the form in combat. These many drawbacks
    can be overcome through the use of the great elder Sages, Fukasaku and Shima. Fusing with Fukasaku
    and/or Shima allows Sages to do battle in Sage Mode without having to worry about standing still to
    collect Nature Energy, since Ma and/or Pa are constantly doing it for their summoner. This also allows
    one to stay in Sage Mode for far longer periods of time than what would normally be possible. Additionally,
    having them on his shoulder, balancing his Nature Energy intake, also eliminates the possibility of
    taking in too much energy and irreversibly turning into a frog. |-|Kurama Link Mode=None notable }}
    == Standard Tactics == {{Border|Scroll=yes|Visible=Yes|Padding=Yes|Content= *Base: Minato''s fighting
    style focuses on utilizing his blinding speed to end battles as quickly as possible. In order to accomplish
    this, Minato will often immediately rush at his opponent by amplifying his speed with the Bodyflicker
    Jutsu, taking the initiative by being first to strike. Minato may also decide to throw dozens of his
    Kunai knives all around the battlefield to give himself multiple vantage points to teleport to using
    his Flying Raijin Jutsu, and multiple angles to attack from. Using this strategy, in addition to his
    once-in-a-generation genius, Minato can take killing positions on his enemy in just a brief few exchanges
    with deafening precision, and use a well placed Kunai strike or Rasengan to defeat the enemy in one
    blow. He can also use teleportation in rapid succession to overwhelm his enemy from all directions,
    or wipe out large groups of enemies in an instant. In addition to using Kunai, Minato will also use
    manually apply the Flying Raijin seals manually to catch his opponents by surprise if they figure
    out he is using his Kunai to teleport. For defensive purposes, Minato will use his Flying Raijin Jutsu
    to either evade attacks outright, or redirect his opponents attacks away from the battlefield, or
    even right back at them with the Flying Raijin: Guiding Thunder technique. Facing an opponent with
    summons or large sized opponents would prompt Minato to either summon Gamabunta to aid him in battle,
    typically by using the Summoning: Food Cart Destroyer Jutsu to crush his larger adversary, or use
    Sealing Jutsu such as the Four Symbol Seal to confine the enemy. *Sage Mode: Despite the increase
    in power and versatility afforded to him by this form, Minato''s tactics in this form are limited
    by its short duration and long charge up time. In order to make the most of the form while it lasts,
    Minato opts for quick singular attacks by teleporting in and attempting to land a single devastating
    blow with his Sage Art: Rasengan as quickly as possible. *Kurama Chakra Mode: With the aid of Kurama
    significantly boosting his combat ability, Minato''s fighting style outside of his avatar functions
    virtually the same as it did in his base form. One such example of this is his use of the Rasen Flash
    Super Circle Dance Howl Stage Three technique, where, much like his base form, he takes advantage
    of the Shadow Clone Jutsu to help him spread Kunai around his opponent and encircle them with rapid
    teleportation. In addition to his regular techniques being amplified, Minato makes wonderful use of
    the abilities granted to him by being Kurama''s host, such as conjuring a'
