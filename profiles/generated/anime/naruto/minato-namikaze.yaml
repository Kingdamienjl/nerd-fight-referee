    \ displayed in a variety of ways. He was able to create a variety of Ninjutsu in his own style,Rin\
    \ no Sho, principal among these many Ninjutsu he invented was the Rasengan. After a single encounter\
    \ with the Tailed Beasts, Minato knew he needed a new technique to combat these powerful foes. He\
    \ was able to observe their main technique just once, and later break down its mechanics enough to\
    \ perfectly replicate it for human form, in the Rasengan. He used the principle of kneading Chakra\
    \ to match ones internal whorls to mimic the Tailed Beast's process of matching black and white Chakra\
    \ ratios. Minato's incredible Ninjutsu prowess extends beyond merely creating new techniques, his\
    \ ability to break down Ninjutsu's mechanics and rework them extends to improving existing Ninjutsu\
    \ as well. With the Flying Raijin Jutsu, Minato evolved the technique beyond its creator Tobirama's\
    \ limits. Creating several supplementary techniques for it like the Flying Raijin: Guiding Thunder,Jin\
    \ no Sho a Ninjutsu that combines the principles of the Flying Raijin with the barrier structure of\
    \ the Uzumaki sealing techniques he learned from Kushina. His improvements on the Flying Raijin were\
    \ so vast that Boruto, a prodigy decades into the future, could not match Minato's skill with Space-Time\
    \ Ninjutsu.Boruto: Two Blue Vortex, Chapter 4: \"The Awakening\" Minato has further improved the Uzumaki\
    \ sealing arts in his own way similar to the Flying Raijin. At an extremely young age, Minato evolved\
    \ the Uzumaki sealing techniques that he was learning rapidly in his own style, a feat of Ninjutsu\
    \ mastery that caused Kurama to compare Minato's talent to Hashirama, the most famous figure in the\
    \ Shinobi world. Minato's ability to break down techniques forms the"
