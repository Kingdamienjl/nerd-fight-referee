  intelligence:
    text: Genius {{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= In addition
      to his already superior intellect, Sasuke also shows an understanding of various
      scientific fields such as gravity (Deva Path), space (Amenotejikara), electromagnetism
      (Lightning Release), and atomic science (Earth Style), as they are needed to
      perform the jutsu. His knowledge of these fields is superior to that of other
      ninjas, including those who are familiar with the individual fields. He is also
      capable of creating jutsu that are related to the Lorentz theory, which is an
      advanced scientific theory in the field of physics introduced by Hendrik Antoon
      Lorentz. While Naruto is also shown to be highly intelligent in the understanding
      of chakra and its mechanism, many people, including opponents, consider Sasuke
      to be the more intelligent of the two ninjas. Naruto often relies on Sasuke
      to analyze the jutsu used by the opponent and break it down, even though he
      is also highly familiar with the mechanism of chakra. Sasuke’s innate intelligence
      is regarded to be even more impressive than the analysis capabilities granted
      by the Sharingan. What is particularly noteworthy is that even in its initial
      form, the Sharingan is capable of performing very complex calculations—such
      as calculating the trajectory of multiple incoming attacks and calculating the
      most effective method of evading them simultaneously. Moreover, Sasuke is regarded
      to possess the capacity for formulating and implementing complex strategies
