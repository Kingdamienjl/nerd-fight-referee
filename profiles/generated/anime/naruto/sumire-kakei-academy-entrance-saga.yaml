- id: claim-powers-and-abilities-f8e6e3dd
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Acrobatics, Chakra Manipulation, Skilled Hand-to-Hand Combatant,\
    \ Skilled Shuriken Wielder, Summoning, Forcefield Creation, Water Manipulation, Statistics Amplification\
    \ (Shinobi are capable of enhancing their physical capabilities with the use of chakra. The Shunshin\
    \ no Jutsu allows Shinobi to greatly enhance their speed by focusing chakra in their feetRin no Sho,\
    \ Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and Water Walking (By focusing chakra\
    \ at the soles of their feet, Shinobi can scale and cling to vertical surfaces, and even walk on waterNaruto\
    \ Chapter 18Naruto Chapter 90), Afterimage Creation, Stealth Mastery, and Speed Enhancement (The Substitution\
    \ Jutsu allows its user to instantly replace themselves with a nearby object such as a tree log, plant,\
    \ person, or clone at the exact moment they are attacked. The Jutsu works even if the user is physically\
    \ restrained or observed by characters as observant as Sharingan or Sage Mode users. This creates\
    \ the optical illusion of the user being hit, which confuses the opponent and gives them an opening\
    \ to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter 374Naruto Chapter 580Naruto\
    \ Chapter 674), Minor Illusion Creation and Duplication (With the Clone TechniqueRin no Sho, Page\
    \ 220, Shinobi can create illusionary duplicates of themselves that have no physical substance), Shapeshifting\
    \ (With the Transformation TechniqueRin no Sho, Page 220, Shinobi can transform themselves into other\
    \ people, animals, plants, and even inanimate objects, such as weapons), Paralysis Inducement (With\
    \ the Temporary Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely paralyze their targets\
    \ from close to mid range), Sealing (can seal people's movements with String Light Formation) Superhuman\
    \ Physical Characteristics, Large Size (Type 1), Chakra Manipulation, Energy Constructs, Intangibility\
    \ (Nue is naturally intangible, appearing in its tangible state only when summoned by the user), Emotion\
    \ Detection (Can sense the negative emotions in an individual), Empathic Manipulation (After absorbing\
    \ the energy of a target, they begin to show exhibit negative emotions, such as anger and depression),\
    \ Possession (Can possess people through their negative emotions. Once it possesses someone, it preys\
    \ on their emotions, making them give in to their darkest impulse leaving the victims themselves unaware),\
    \ Absorption and Statistics Amplification (Can absorb chakra and use it as sustenance and strengthen\
    \ itself), Self-Destruction (Can use the collected chakra to self-destruct in a powerful explosion),\
    \ Regeneration (Low-Mid. Can regenerate lost limbs), Wood Manipulation (Being produced from the genetic\
    \ material of Hashirama Senju, Nue is able to produce a diluted Wood Release, able to produce plant\
    \ life to aid in its acquiring of chakra), Portal Creation and Dimensional Travel (Is able to use\
    \ Space\u2013Time Ninjutsu to teleport), Power Bestowal (Granted an individual the ability to manipulate\
    \ paper, and allowed Metal the ability to open the first gate)"
  source_ids: *id003
  decisive: true
  status: unverified
