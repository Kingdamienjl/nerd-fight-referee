      heavily pressure Sasuke, who struggled to dodge his attacks and went as far
      as to call him a monster), even higher with One Tail (Even faster than before,
      to the point of Sasuke needing to predict his movements beforehand with the
      Sharingan just to avoid death) | Subsonic+ (At least as fast as before) with
      Massively Hypersonic reaction speed (Managed to react to CS2 Kimimaro''s charge
      and erected a shield to intercept him.Naruto, Chapter 216: "Halbert and Shield...!!"
      Reacted to CS2 Kimimaro''s tail swipe and blocked it with his sand. Reacted
