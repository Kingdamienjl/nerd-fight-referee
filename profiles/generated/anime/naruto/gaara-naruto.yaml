  speed:
    text: 'Subsonic+ (Superior to Temari, and could push her aside before she can
      reactMach 0.831), High Hypersonic+ with the Sand Shield (The Sand Shield blocked
      Yashamaru''s explosivesNaruto, Chapter 131: "The Name Gaara...!!", which makes
