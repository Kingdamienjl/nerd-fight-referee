  attack_potency:
    text: 'City Block level physically (Easily sent Temari flying and drew blood from
      herNaruto, Chapter 125: "The Time of Awakening"), Multi-City Block level with
      Sand (Gaara uses the same sand for offense and his absolute defense. Easily
      overpowered First Gate Rock Lee while just toying with himNaruto, Chapter 84:
      "The Genius of Hard Work!!"), higher with Partial Transformation (Sasuke described
      him as a "monster,"Naruto, Chapter 127: "To Feel Alive...!!" and Gaara completely
      overpowered him, with Sasuke stating that he''d be dead if he couldn''t dodge
      his attacks with the SharinganNaruto, Chapter 128: "Exceeding One''s Limits...!!")
      | City Block level physically (At least as strong as he was during the Chūnin
      Exams), Mountain level with Sand (Intercepted an attack from KimimaroNaruto,
      Chapter 212: "Danger Danger Danger!!". Crushed Kimimaro with his Sand Funeral,
      forcing him to use CS1 and create an extra layer of bones to surviveNaruto,
      Chapter 215: "Gaara of the Sand") | At least City Block level physically (Should
      be much stronger than he was before the time skip18.5809 Tons), Mountain level
      (Easily crushed Deidara''s armNaruto, Chapter 248: "The Sand Strike Back...!!".
      Casually raised a massive amount of sand from the desertNaruto, Chapter 249:
      "The Kazekage Stands Tall...!!"139.225 Megatons) | At least City Block level
      physically (At least as strong as before), Country level with Sand (He uses
      his sand for both offense and defense. Consistently matched Rasa''s Gold Dust
      even though it greatly outweighs his sand.Naruto, Chapter 546: "Kage Showdown!!"Naruto,
      Chapter 547: "Valued Treasures!!") | At least City Block level physically (At
      least as strong as before), Country level with Sand (He uses his sand for both
      offense and defense. He was able to hold the Gedo Statue''s chakra chain and
      stop it from pulling Shukaku, forcing Madara to dematerialize itNaruto, Chapter
      660: "One''s True Heart"7 Teratons)| At least City Block level physically (Should
      be much stronger than he was prior to the time skip), Country level with Sand
      (At least as strong as before. Covered and saved the entire Sunagakure village
      from multiple meteors that were falling toward the village with his sand, and
      wasn''t tired after that) | At least City Block level physically (At least as
      strong as his younger self), at least Country level (His sand is stronger than
