  intelligence:
    text: "Extraordinary Genius (Amado is an exceptionally intelligent man with exceedingly advanced knowledge\
      \ in science and technology, with Kawaki describing him as a technological geniusBoruto: Naruto\
      \ Next Generations, Chapter 42. His brilliance was even recognised by Isshiki, who sought him out\
      \ for help in his plansBoruto: Naruto Next Generations, Chapter 75. Even Katasuke T\u014Dno, Konoha's\
      \ lead scientist and a recognised genius himself, openly acknowledged Amado's talents as well beyond\
      \ his ownBoruto: Naruto Next Generations, Chapter 25. While his true capabilities remain unknown,\
      \ Amado is shown to be a very methodical and knowledgeable man. Well-prepared, he skilfully uses\
      \ a variety of technology to prevail. He is also shown to be a proficient tactician and deceiver,\
      \ planning several steps ahead, such as pretending to plant an explosive collar device on Shikadai\
      \ to use him as a leverage to fool Shikamaru and KonohaBoruto: Naruto Next Generations, Chapter\
      \ 48. He also came up with a successful plan to force Isshiki \u014Ctsutsuki to reincarnate in Jigen's\
      \ body and simultaneously remove Kawaki's K\u0101ma,Boruto: Naruto Next Generations, Chapter 47\
      \ which even earned him Isshiki's praise. Likewise, Amado is adapt in seeing through deceptions,\
      \ able to notice details that are out of place in a situation and determine the truthBoruto: Two\
      \ Blue Vortex, Chapter 5. As head of Kara's research and development division, Amado has been credited\
      \ with the development of all of its fearsome Shinobi-ware and cyborgs, including weapons that could\
      \ counter an individual's regenerative abilities, devices that could absorb, store, and release\
      \ absorbed ninjutsu, a powerful virus capable of incapacitating those who are exposed to it,Boruto:\
      \ Naruto Next Generations, Chapter 41 and was even able to modify Kawaki, Delta, and Code down to\
      \ the circulatory and nervous systems, implanting an extremely high level of Shinobi-Ware in the\
      \ form of microscopic scientific ninja tools throughout their entire bodies. He single-handedly\
      \ greatly augmented the various abilities of the Inners and likewise created cyborgs whose power\
      \ exceeded Jigen, prompting him to order their immediate disposal. Amado managed to transplant Shibai's\
      \ DNA to graft his shinjutsu onto others. With these capabilities, he also provided Jigen with the\
      \ means to improve the chances of candidates being compatible with K\u0101maBoruto: Naruto Next\
      \ Generations, Chapter 27. His understanding of the K\u0101ma even allowed him to recreate Isshiki's\
      \ K\u0101ma to implant on Kawaki after the extinguishing of Isshiki's soulBoruto: Naruto Next Generations,\
      \ Chapter 66. He could also clone humans. Using Jiraiya's DNA, he created a perfect clone the legendary\
      \ Sannin in his prime in Koji Kashin. He also created a drug that weakens the Byakugan in the hopes\
      \ of defeating Isshiki, and was useful in stopping Momoshiki from reincarnating in Boruto's body.\
      \ In the anime, his technological prowess was such that he could even revive the recently deceased\
      \ DeepaBoruto: Naruto Next Generations, Episode 181."
    source_ids: *id002
    confidence: 0.95
