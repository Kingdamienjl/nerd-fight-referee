- id: claim-standard-equipment-f542bc5c
  section: equipment
  axis: equipment
  text: "*Special Glasses: They are Scientific Ninja Tools in the form of glasses with an integrated computer\
    \ system. The lenses of these glasses are transparent displays that have the ability to reflect digital\
    \ images in the user's field of vision, making it easier to view the information provided by them.\
    \ Additionally, these glasses can have a wireless connection with other Scientific Ninja Tools, enhancing\
    \ the integration between the devices. Amado's glasses have a wireless connection with Koji Kashin's\
    \ spying toad. The toad, which acts as a surveillance camera, can transmit everything it sees to the\
    \ glasses in real time, even if it is in another space-time. Upon receiving the transmission, the\
    \ glasses emit an alert that flashes on its display, allowing Amado to position them pointing at a\
    \ wall where the image will be projected. *Sonic Tunic Fork: It is a Scientific Ninja Tool in the\
    \ form of a tuning fork used by Amado, who carries it hidden under the sleeve of his shirt or the\
    \ cuff of his pants and slides it out to activate it. The device emits high-frequency sound waves\
    \ that stun those who hear them, preventing them from fighting and maintaining techniques that require\
    \ concentration to remain active, such as the Shadow Imitation Technique. It is especially useful\
    \ for self-defense, as it is the first resource Amado uses when his physical integrity is threatened.\
    \ *Explosive Collar: It is one of the Scientific Ninja Tools in Amado's arsenal. It is an explosive\
    \ collar that can be attached around the target's neck to take them hostage, with the possibility\
    \ of remotely detonating it with a simple voice command. According to Amado, only he is capable of\
    \ disarming it and he could supposedly program it to self-destruct in approximately 48 hours. Amado\
    \ also produced a fake copy that he used to take Shikadai hostage. Although identical to the real\
    \ one, it did not have the capability to explode. *Anesthesia: Anesthesia is a chemical substance,\
    \ or a compound of them, capable of blocking or temporarily removing the target's sensitivity or creating\
    \ a reversible state of unconsciousness, either locally or generally. Amado uses a benign drug in\
    \ needles in his gloves that causes victims to immediately faint upon contact with it. *Byakugan Weakening\
    \ Drugs: This is a drug developed by Amado to weaken the powers of a Byakugan. The drug emerged as\
    \ a byproduct of a series of efforts by the scientist in his attempt to eliminate Jigen. The drug\
    \ was administered to Kawaki, on whom Amado performed applications to slow down the Otsutsuki Transformation\
    \ process. Later, Boruto uses the medicine to delay the Karma unpacking process. Since the Byakugan\
    \ has its roots in the Otsutsuki Clan, Amado believes that weakening it could reduce the Otsutsukiification\
    \ of the young Uzumaki\u2019s cells. After a period of continuous use of the medication, Boruto noticed\
    \ that the unpacking process of Momoshiki's data was halted, allowing him to use Karma without apparent\
    \ risks. Later, the boy was able to access a new phase of his transformation, being capable of manifesting\
    \ the Byakugan in his left eye and being fully aware of his actions. Despite this, after a short time,\
    \ the young man began to experience severe chest pains and fainted shortly after, losing consciousness\
    \ again and having his body controlled by Momoshiki. *Custom Sealing Jutsu Cuffs: Special handcuffs\
    \ created by Amado that not only restrain the individual but also prevent them from using any type\
    \ of jutsu."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
