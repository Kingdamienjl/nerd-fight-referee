- id: claim-weaknesses-af6e3b75
  section: weaknesses
  axis: weakness
  text: 'Madara tends to be arrogant, as he is frequently reluctant to use his full
    power. The Sharingan''s ability to copy Ninjutsu, Genjutsu, and Taijutsu is limited
    by the user''s physical condition,Rin no Sho, pages 192-193 that is to say that
    the user needs to be physically capable of performing the technique they are trying
    to replicate. They need to meet any physical or chakra amount prerequisites the
    technique in question may have. This ability is also incapable of replicating
    Kekkei Genkai, due to either not possessing the genetic predisposition and/or
    having the necessary chakra natures. Naturally, the user also needs to actually
    see the technique they are attempting to copy, meaning they cannot copy something
    they did not see or is obscured from their line of sight. In fact, the same can
    be said for essentially all of the Sharingan''s abilities; they are sight based
    abilities, so if the opponent can obscure the user''s vision using extremely thick
    mist/dustNaruto Chapter 26 or blind them, the Sharingan''s abilities will be rendered
    useless. Likewise if the opponent is too fast for the Sharingan to visually keep
    track of them, they will be safe from its abilities. Sharingan Genjutsu requires
    eye contact, so if the opponent is able to avoid eye contact or is blind, they
    will be able to avoid Sharingan Genjutsu entirely. Finally, the Sharingan''s predictive
    capabilities can be somewhat circumvented by attacks that have little to no pattern,
    such as Naruto''s chakra armsNaruto Chapter 231 that emerge from any part of his
    body and attack instinctively. The Susano''o causes its user immense pain "in
    every cell in their body". | He remains vulnerable to physical attacks and attacks
    infused with natural energy in his Six Paths Sage Technique form. His Limbo clones
    can be can be seen with the Rinnegan and sensed with Six Paths Senjutsu. Attacks
    imbued with Six Paths chakra can interact with Limbo clones normally. The Limbo
    clones need to return to Madara''s body after a set amount of time, but the recharge
    period is very brief. Notable Attacks/Techniques: Hide/Show Sharingan (Mirror
    Wheel Eye): The Sharingan is a dōjutsu kekkei genkai, which appears in some members
    of the Uchiha clan. The Sharingan''s abilities consist of two parts: the "Eye
    of Insight" (Dōsatsugan) and the "Eye of Hypnotism" (Saimingan). The first of
    the Sharingan''s powers is being able to see chakra flow. The Sharingan itself
    gives color to chakra, allowing the wielder to differentiate them. They are also
    able to tell if a person is under a genjutsu because the person''s chakra flow
    would be irregular. The Sharingan''s second-most prominent ability grants the
    user an incredible clarity of perception, allowing them to easily recognize genjutsu
    and different forms of chakra, though not to the same extent as the Byakugan.
    This also allows the user to pick up on subtle details, enabling them to read
    lip movements or mimic something like pencil movements. As the Sharingan evolves,
    gaining more tomoe, this ability extends to being able to track fast-moving objects
    before finally giving some amount of predictive capabilities to the user, allowing
    them to see the image of an attacker''s next move from the slightest muscle tension
    in their body and counter-attack or dodge without any wasted movement. The Sharingan''s
    third and most well-known ability is that it grants the user the ability to copy
    almost any technique that he or she witnesses, apart from other kekkei genkai
    techniques. The user can memorize ninjutsu, genjutsu, and taijutsu with near-perfect
    accuracy, allowing the user to use the techniques as their own, or even modify
    them to create their own new techniques. In order to reproduce a copied technique,
    however, one must have the necessary skill or ability to perform them. In addition
    to physical skill and kekkei genkai techniques, the Sharingan cannot reproduce
    techniques dependent on other factors, such as summons that the user has not signed
    a contract with. The Sharingan''s final commonly-used ability is capable of inducing
    a unique brand of hypnosis that involves suggesting actions and thoughts to the
    opponent through genjutsu cast by simple eye contact between both parties. More
    advanced Sharingan users can take the hypnosis ability even further to the point
    where a powerful summon or even a tailed beast may be controlled. In a similar
    manner, one can enter a jinchūriki''s subconscious to effectively suppress the
    tailed beast''s chakra. *Genjutsu: Sharingan: It is simply the generic use of
    genjutsu as employed by Sharingan wielders. By establishing direct eye contact
    with the intended opponents, the user can lock them within a genjutsu of their
    choosing in order to achieve various effects. These effects range from inducing
    instantaneous, but temporary, paralysis or unconsciousness in an opponent to forcefully
    extracting any valuable information that they possess or controlling their actions.
    *Izanagi: Izanagi is a genjutsu that is cast on the user inste'
