power_scale:
  tier:
    text: '{{6-B}}, higher with Sage Mode, up to {{High 6-A}} with Wood Style, far
      higher with Sage Art: Wood Style | {{6-B}}, higher with Sage Mode, up to {{High
      6-A}} with Wood Style, far higher with Sage Art: Wood Style'
    source_ids:
