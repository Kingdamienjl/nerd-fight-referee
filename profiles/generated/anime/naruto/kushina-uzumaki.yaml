- id: claim-powers-and-abilities-6ba4dc6a
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Longevity *Acrobatics (Hypermobility & Surface Running;
    All shinobi are capable of performing incredible feats of acrobatics far better than most peak humans)
    *Chakra Manipulation **Statistics Amplification (Shinobi are capable of enhancing their physical capabilities
    with the use of chakra. The "Teleportation" Jutsu allows Shinobi to greatly enhance their speed by
    focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71) **Surface Scaling
    & Free Movement (Water Walking; By focusing chakra at the soles of their feet, Shinobi can scale and
    cling to vertical surfaces, and even walk on waterNaruto Chapter 18Naruto Chapter 90) **Afterimage
    Creation, Stealth Mastery & Speed Enhancement (The Substitution Jutsu allows its user to instantly
    replace themselves with a nearby object such as a tree log, plant, person, or clone at the exact moment
    they are attacked. The Jutsu works even if the user is physically restrained or observed by characters
    as observant as Sharingan or Sage Mode users. This creates the optical illusion of the user being
    hit, which confuses the opponent and gives them an opening to flee or counterattackNaruto Chapter
    6Naruto Chapter 54Naruto Chapter 374Naruto Chapter 580Naruto Chapter 674) **Paralysis Inducement (Via
    Paralysis Jutsu) **Duplication (Can create illusionary clones with no substance) **Statistics Amplification
    (Can enhance her physical capabilities with chakra) **Shapeshifting (Can transform into animate and
    inanimate objects with Transformation Jutsu) **Adamantine Sealing Chains: ***Healing, Sealing, Forcefield
    Creation & Chain Manipulation (Can create the Adamantine Sealing Chains out of her chakra) ***Power
    Nullification (Orochimaru states that the Adamantine Sealing Chains can seal the chakra of a target,
    completely neutralizing them) *Weapon Mastery (Can utilize weaponry like kunai, shuriken, and exploding
    tags) **Explosion Manipulation (With Explosive Tags) *Non-Physical Interaction (Via forcefield creation
    and sealing)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
