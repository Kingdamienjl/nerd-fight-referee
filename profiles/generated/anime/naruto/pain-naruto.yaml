power_scale:
  tier:
    text: '{{Varies}} from {{7-B}} to {{6-B}}, higher with Shinra Tensei, far higher
      with Chaotic Shinra Tensei, even higher with Chibaku Tensei | {{6-B}}, higher
      with Shinra Tensei, far higher with Chaotic Shinra Tensei, even higher with
      Chibaku Tensei'
    source_ids: &id002
    - mediawiki-4252
    confidence: 0.95
  attack_potency:
    text: 'Varies (Pain''s power varies depending on how many bodies are active at
      a time and how far they are from Nagato ) from City level+ (Even with 6 bodies
      active and being far away from Nagato, Pain can easily overpower Kakashi, Chōza,
      and Choji with his Shinra Tensei. With less bodies active, he was able to trade
      blows with base Naruto, although he wasn''t at full capacity yet53.15 Megatons)
      to Country level (His Rain Tiger at Will technique is this powerful, and he
      can easily maintain it for long periods of time over Amegakure without draining
      himself. Casually caught a punch from Sage Mode Jiraiya. Sage Mode Jiriaya admitted
      that the three Pains he was facing could kill him if he fought them simultaneously.Naruto,
      Chapter 378: "One to One...!!" The Animal Path could stab and wound Sage Mode
      Jiraiya, and his dog and bird summons were capable of matching Gamaken, who''s
      equal to GamabuntaSha no Sho, page 657 Teratons), higher with Shinra Tensei
      (He easily dissipated Sage Mode Naruto''s Rasenshuriken with 3 bodies active,
      and later replicated the feat with one body active while heavily exhausted.Naruto,
      Chapter 441: "Rasen-Shuriken vs. Almighty Push!!" He easily sent Sage Mode Naruto
      and his clone flying, which caused the clone to disperse and the original to
      groan in pain, with a casual Shinra Tensei. Casually one-shot Gamabunta and
      Gamaken with a massive Shinra Tensei, sending both flying outside the village
      and breaking all of their bones), far higher with Chaotic Shinra Tensei (When
      Nagato focuses his power on the Deva Path, his Shinra Tensei is dramatically
      enhanced), even higher with Chibaku Tensei (His Chibaku Tensei is calculated
      to be this powerful. It should be stronger than himself. It was also capable
      of overpowering KN6 Naruto and his Tailed Beast Bomb7 Teratons, possibly 14.9
      Teratons) |-|Edo Tensei'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: At least Sub-Relativistic (He is fast enough to react to Sage Mode NarutoNaruto
      Chapter 433, can consistently keep up with Kakashi’s Raikiri strikesNaruto Chapter
      422Naruto Chapter 423, and was able to respond to a charge from Six-Tailed NarutoNaruto
      Chapter 4380.028 c) | At least Relativistic (He is capable of reacting to and
      keeping up with Nine-Tails Chakra Mode NarutoNaruto Chapter 5510.14 c)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class T (Comparable to Sage Mode Naruto) | At least Class T (Stronger
      than the Six Paths of Pain)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: 'Varies from City level+ (He was able to stab Kakashi. Traded blows with
      base Naruto) to Country level (With two Pains left, the Preta Path was able
      to hurt Sage Naruto with a punch. Once he was the last Pain remaining, the Deva
      Path was able to pull and stab Pa, who was previously capable of trading blows
      and sparring with Sage Mode Naruto. He then easily overpowered and stabbed base
      Naruto, who was previously capable of trading blows with him when more Pains
      were active. The Asura Path ripped off Sage Mode Jiraiya''s armNaruto, Chapter
      379: "Jiraiya''s Decision") | Country level (Far more powerful than the Six
      Paths of Pain. He was overpowering Nine-Tails Chakra Mode Naruto in a soul tug
      of war, and easily held down Killer B)'
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Varies from City level+ (Scales from his striking strength and his peak,
      where he could somewhat withstand his own Shinra Tensei) to Country level (He
      withstood a kick from Sage Mode Naruto while having 3 bodies active, albeit
      he was sent flying by it. He later survived a kick from Sage Mode Naruto while
      extremely low on chakra and fatigued. The Human Path survived a kick from Sage
      Mode Jiraiya, albeit his eyes were permanently injured, and later on casually
      caught a punch from Jiraiya. The Preta Path momentarily caught Jiraiya''s Massive
      Rasengan before absorbing it. He withstood the recoil of his own Shinra Tensei,
      and even the partial explosion of KN6 Naruto''s Tailed Beast BombNaruto, Chapter
      438: "The Seal Destroyed!!") | Country level (Even while frail and sickly, he
      easily the initial impact of V2 B''s Lariat before absorbing it)'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: 'Superhuman (Has a large reserve of chakra), Infinite (Edo Tensei have an
      infinite chakra supply,Naruto, Chapter 591: "Risk" that is to say their chakra
      reserves will refill indefinitely and continuously, meaning that they can keep
      fightingNaruto, Chapter 662: "A True Ending" without fail or succumbing to physical
      limitations like fatigue, pain, or debilitating injuries)'
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range physically, Tens of Meters to Thousands of Kilometers
