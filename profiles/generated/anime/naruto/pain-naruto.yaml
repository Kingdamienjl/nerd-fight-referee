  striking_strength:
    text: 'Varies from City level+ (He was able to stab Kakashi. Traded blows with
      base Naruto) to Country level (With two Pains left, the Preta Path was able
      to hurt Sage Naruto with a punch. Once he was the last Pain remaining, the Deva
      Path was able to pull and stab Pa, who was previously capable of trading blows
      and sparring with Sage Mode Naruto. He then easily overpowered and stabbed base
      Naruto, who was previously capable of trading blows with him when more Pains
      were active. The Asura Path ripped off Sage Mode Jiraiya''s armNaruto, Chapter
      379: "Jiraiya''s Decision") | Country level (Far more powerful than the Six
      Paths of Pain. He was overpowering Nine-Tails Chakra Mode Naruto in a soul tug
      of war, and easily held down Killer B)'
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Varies from City level+ (Scales from his striking strength and his peak,
      where he could somewhat withstand his own Shinra Tensei) to Country level (He
      withstood a kick from Sage Mode Naruto while having 3 bodies active, albeit
      he was sent flying by it. He later survived a kick from Sage Mode Naruto while
      extremely low on chakra and fatigued. The Human Path survived a kick from Sage
      Mode Jiraiya, albeit his eyes were permanently injured, and later on casually
      caught a punch from Jiraiya. The Preta Path momentarily caught Jiraiya''s Massive
      Rasengan before absorbing it. He withstood the recoil of his own Shinra Tensei,
      and even the partial explosion of KN6 Naruto''s Tailed Beast BombNaruto, Chapter
      438: "The Seal Destroyed!!") | Country level (Even while frail and sickly, he
      easily the initial impact of V2 B''s Lariat before absorbing it)'
