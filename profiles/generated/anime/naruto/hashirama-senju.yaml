power_scale:
  tier:
    text: '{{6-B}}, higher with Sage Mode, up to {{High 6-A}} with Wood Style, far
      higher with Sage Art: Wood Style | {{6-B}}, higher with Sage Mode, up to {{High
      6-A}} with Wood Style, far higher with Sage Art: Wood Style'
    source_ids: &id002
    - mediawiki-4090
    confidence: 0.95
  attack_potency:
    text: 'Country level (Should be stronger than he was as an Edo Tensei, as the
      Hokage were only revived at near their full strength. Sage Mode Madara implied
      that he only had the edge over Hashirama and Tobirama because they were weakened
      by the Edo Tensei. He is the only one who was capable of matching and defeating
      Madara Uchiha.7 Teratons), higher with Sage Mode (Is much stronger than his
      base form,Sha no Sho, Page 279 as Sage Mode is stated to dramatically enhance
      one''s Ninjutsu, Genjutsu and Taijutsu.), up to Multi-Continent level with Wood
      Style (His Wood Dragon is capable of physically restraining full power Kurama.Naruto,
      Chapter 607: "It Doesn''t Matter to Me" His Wood Golem is comparable to Kurama,Jin
      no Sho, Page 299 and can easily catch his Tailed Beast Bomb.63.28 Petatons),
      far higher with Sage Art: Wood Style (Far stronger than before due to Sage Mode.
      His Wood Golem was also able to contend with Madara''s Perfect Susanoo when
      he was weaker as an Edo Tensei. His Shinsu Senju is unfathomably more powerful
      than the Wood Golem, and is capable of matching the Majestic Attire: Susano''o''s
      Evil Disturbance Waltz and greatly damaged the Nine-Tails empowered Perfect
      Susano''o''s armor.314.84 Petatons)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: At least Relativistic, likely far higher (He was able to summon the Rashomon
      Gates in time to shield himself from Madara's attack and was able to react to
      his Susanoo sword swings.>0.14 c), FTL with Sage Mode (Given that he battled
      Eternal Mangekyo Sharingan Madara for an extended period, it's reasonable to
      assume he managed to land at least some hits.)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'At least Class T physically (Superior to his Edo Tensei form, as he had
      only been revived at near full strength. Has raised his Wood Golem from the
      ground, and finally has clashed equally with Madara Uchiha.1.32195 Billion Metric
      Tons), at least Class E with Wood Style (His Wood Dragon Jutsu was still able
      to restrain Kurama at full power, requiring him to unleash a Tailed Beast Bomb
      to destroy it. Successfully restrained the Majestic Attire Susano''o in place,
      forcing Madara to rely on sheer brute force to break free.), far higher with
      Sage Art: Wood Style (Sage Mode greatly enhances one''s ninjutsu. Easily tore
      Kurama out of the Majestic Susano''o before proceeding to seal him.)'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: 'Country level (Traded blows with Madara numerous times throughout their
      youth, with Madara admitting that Hashirama was stronger than him), higher with
      Sage Mode (Far stronger than before due to Sage Mode.), up to Multi-Continent
      level with Wood Style (His Wood Golem is physically comparable to Kurama, and
      can easily catch its Tailed Beast Bomb, which had previously shattered his Wood
      Dragon.), up to Multi-Continent level with Sage Art: Wood Style (Far stronger
      than before due to Sage Mode as his Shinsu Senju is capable of effortlessly
      manhandling Kurama.)'
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Country level (Comparable to Madara, and is capable of enduring a full
      day of fighting against him, usually coming out on top.), higher with Sage Mode
      (Far more durable than before due to Sage Mode), up to Multi-Continent level
      with Wood Style (His Wood Golem is comparable to Kurama and superior to Madara''s
      Wood Dragon, which is at most comparable to his own, also withstood an assault
      from Tailed Beast state Naruto. His Wood Style: Wood Expulsion Jutsu was capable
      of enduring Kurama''s Tailed Beast Bomb exploding.), higher with Quintuple Rashomon
      (Was capable of changing the trajectory of the Majestic Attire: Susano''o''s
      Evil Disturbance Waltz without getting destroyed.), Multi-Continent level with
      Sage Art: Wood Style (Far more durable than before due to Sage Mode)'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: 'Superhuman (Is stated to have more chakra than Kurama Chakra Mode Naruto
      enhanced by Kurama Mode Minato''s chakra,Naruto, Chapter 644: "I Know" who could
      maintain and create thousands of shadow clones, distribute said chakra to thousands
      of shinobi all while simultaneously battling the reanimated Kage, the Jinchuriki,
      Ten-Tails Obito and Madara Uchiha. Hashirama has been shown to fight Madara
      and Kurama simultaneously for days at the Valley of the End, using multiple
      large-scale techniques the entire time. His endurance far exceeds even legendary
      shinobi like the Third Raikage, who fought ten thousand shinobi non-stop for
      three days and three nights.Naruto, Chapter 553: "The Battlefield!!" Hashirama
      can also enter Sage Mode, further boosting his already existing enormous amount
      of chakra.) |-|Edo Tensei'
    source_ids: *id002
    confidence: 0.95
  range:
    text: 'Standard Melee Range with Taijutsu, Extended Melee Range with weapons,
      Tens of Meters with Shuriken, Kilometers with Rashomon Gates (Spread the gates
      out over an entire mountain range.), Varies, up to Tens of Kilometers with Wood
      Style (Many of Hashirama''s Wood Style jutsu can span over mountain rangesNaruto,
      Chapter 575: "A Will of Stone")'
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Gifted (Despite his goofy and undignified personality, Hashirama is a highly
      capable combative and political strategist. He developed the Hidden Village
      system that finally ended clan warfare that claimed thousands of lives.Naruto,
      Chapter 625: "My True Dream" He built the villages political and economic structure
      from the ground up. He did this by acting as a symbol for the foundational principles
      he created. These principles were so well conceived, that even with their flaws,
      they still served to protect the village even in its most trying times, for
      decades to follow, such as the Uchiha rebellion. He was able to broker international
      peace agreements between hostile and emerging nations through his conviction.
      He was a highly gifted Shinobi who mastered many complex Ninjutsu, Genjutsu,
      and even the field of Senjutsu, one of the Shinobi world''s most esoteric techniques.
      He was so skilled in Senjutsu, he managed to overcome its most major flaw, its
      long charge time, by being able to instantly enter the form.Jin No Sho His mastery
      over the complex field of Medical Ninjutsu surpassed his Granddaughter Tsunade''s
      by leaps and bounds. He is also an incredibly gifted and charismatic leader,
      one who was able to rally the armies of the entire world and boost their morale
      in the face of an insurmountable adversary. In addition to his sheer charisma,
      he leads by producing complex strategies on the fly that can be easily understood
      and executed by both the highly skilled and legendary Shinobi, and the common
      foot soldier. He instinctively coordinated a plan with the other Hokage to scout
      out Ten-Tails Jinchuriki Obito''s new powers by taking advantage of their immortal
      Edo bodies.)'
    source_ids: *id002
    confidence: 0.95
