- id: claim-powers-and-abilities-7c182f45
  section: abilities
  axis: hax
  text: Magic, Extrasensory Perception (Can sense someone's life-force, and can see spirits), Non-Physical
    Interaction (Can interact with spirits), Longevity (Heavily implied to live for several hundreds years
    and to know Skull Knight for that amount of time), Elemental Manipulation (Can manipulate all four
    elements with the help of elementals), Water Manipulation (With the help of water elementals Undines),
    Fire Manipulation (With Salamanders, the fire elementals. Can manipulate flames in various ways, such
    as summoning little fire elementals by turning her hair into them or summoning the Wheel of Fire spirit.
    Summoned a massive wall of fire that even Grunbeld couldn't do anything against), Earth Manipulation
    (With Gnomes, the earth elementals), Air Manipulation (With Sylphs, the air elementals. Can summon
    large winds and air slashes), Mind Control (Can manipulate person's "od" [life-force] to confuse them
    and change their attentions. She can also hypnotize them or change their behaviour. Should also be
    able to summon Barytes, that can produce depression and obsession in a target), Summoning (Can summon
    various elementals and spirits. Superior to Schierke who summoned many dirt golems that can regenerate
    unless their weak points are destroyed), Danmaku and Hair Manipulation (Can use hair as a catalyst
    to project the power of fire elementals and can send it as multiple projectiles), Memory Manipulation
    (Superior to Schierke, who could erase one of Guts' memories), Empowerment (Witch magic is most powerful
    during full moon), Deconstruction (With the help of Rotting Root Lord, which can instantly decay any
    opponent. However, it is not combat applicable without prep, as she needs to visit him in the astral
    plane and ask him for help), Healing (Should be able to use healing magic), Paralysis Inducement (Scaling
    to Schierke, who could paralyze a man by tapping her wand on his forehead), Limited Plant Manipulation
    (Can make plants grow quickly, superior to Schierke who can use plants in several ways), Light Manipulation
    (Can generate light from her wand), Darkness Manipulation (Scaling to Schierke who could engulf another
    witch in darkness to blind her), Telepathy (Can telepathically communicate with people over long distances.
    Can also read someone's memories and talk to animals), Astral Projection (Can separate her astral
    form from physical body), Limited Sealing (Over curses. Along with Schierke could weaken Casca's and
    Guts' Brands of Sacrifice with a seal), Forcefield Creation (Can create astral barriers that incinerate
    opponents upon contact), possibly Gravity Manipulation (Should be able to summon Barytes, elementals
    of weight, that can make objects heavy and make the sky dark)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
