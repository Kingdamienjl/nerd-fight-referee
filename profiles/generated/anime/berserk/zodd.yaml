  durability:
    text: "Zodd's durability is exceptional; he is able to endure several lighting\
      \ strikes from Ganishka, an attack which kills several of his fellow apostles\
      \ yet which he is able to mostly shrug off. In addition, Zodd shows incredible\
      \ pain tolerance; reacting to his arm being cut off with mere amusement. If\
      \ damaged or grievously injured, Zodd can regenerate and heal his wounds well-nigh\
      \ instantly. When his arm is severed while battling Guts and Griffith, Zodd\
      \ merely picks it up and reattaches it to the bloody stump before the wound\
      \ is fused and healed within moments. He was also badly slashed across the abdomen\
      \ during his confrontation with Guts upon the Hill of Swords, but the wound\
      \ vanished within seconds. However, this is only possible if Zodd can physically\
      \ reattach the severed piece of himself; for instance, he is unable to regenerate\
      \ his horn after it is metaphysically cut off. === Flight === In his released\
      \ form, Zodd can generate wings which allow him to fly and rip apart flesh.\
      \ These wings sprout out of, or are absorbed into, Zodd's back in accordance\
      \ with his will. == Portrayal == * {{lang|ja|{{wp|Kenji Utsumi}}}}: Berserk\
      \ 1997 anime, Berserk: Millennium Falcon Arc - Flowers of Oblivion Chapter,\
      \ Berserk: Millennium Falcon Arc - Holy Evil War Chapter * {{lang|ja|{{wp|Kenta\
      \ Miyake}}}}: Berserk: The Golden Age Arc, Berserk 2016 anime, Berserk Musou\
      \ * {{lang|en|{{wp|Peter Lurie}}}}: Berserk: Millennium Falcon Arc - Flowers\
      \ of Oblivion Chapter * {{lang|en|{{wp|David Brimmer}}}}: Berserk 1997 anime,\
      \ Berserk: The Golden Age Arc * {{lang|en|Imari Williams}}: Berserk 2016 anime\
      \ == Notes == * According to the Berserk Official Guidebook, Zodd is estimated\
      \ to be 220 cm (7 ft, 3 in) and 165 kg (364 lb) in his normal form, and 350\
      \ cm (11 ft, 4 in) and 1001 kg (2207 lb) in his released form. {{BOG notice}}\
      \ * According to the Kentarou Miura and Yuji Kaku Interview, Zodd was born out\
      \ of the idea of realistically drawing the monsters present in the illustrations\
      \ of religious works of the Middle Ages. Additionally, Miura stated that Zodd's\
      \ nudity came from Kazuo Koike or Ry\xF4ichi Ikegami's manga works, equating\
      \ \"a naked guy\" to \"a strong guy\". * Many mercenaries regard Zodd as a \"\
      god of the battlefield\".{{qref|e2}}{{qref|e128}} * Guts and Griffith are the\
      \ only men in 300 years who have wounded Zodd.{{qref|e5}} * Zodd appeared in\
      \ Diablo Immortal as a boss during the Diablo x Berserk crossover event. ==\
      \ References == {{References}} == Appendices == {{Navbox/Evil}} Category:Golden\
      \ Age Arc Characters Category:Conviction Arc Characters Category:Millennium\
      \ Falcon Arc Characters Category:Fantasia Arc Characters Category:Apostles cs:Zodd\
      \ de:Zodd es:Zodd fr:Nosferatu Zodd pl:Nosferatu Zodd pt-br:Nosferatu Zodd ru:\u041D\
      \u043E\u0441\u0444\u0435\u0440\u0430\u0442\u0443 \u0417\u043E\u0434\u0434"
    source_ids:
    - fandom-berserk-zodd
    confidence: 0.75
    notes: auto_repair source extraction
