- id: claim-powers-and-abilities-cea744ee
  section: abilities
  axis: hax
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Human Griffith= *Superhuman
    Physical Characteristics *Weapon Mastery & Martial Arts (Could dislocate Guts''
    arm in their first battle and force him into a submissive position.Berserk - Prologue
    Chapter 14 Swiftly deflected Guts'' sword and defeated him with one strike.Berserk
    - Prologue Chapter 12 Could parry Guts'' strikes with one handBerserk - Prologue
    Chapter 13) **Acrobatics (Hypermobility; Easily countered Guts'' attack by jumping
    on his swordBerserk - Prologue Chapter 13) *Genius Intelligence **Social Influencing
    (Social Position- His position as the leader of the famed Band of the Hawks, combined
    with his almost "mythical status", allows him to get help from others when he
    is in need, even in a near-death state.Berserk - Chapter 59 Instigating Fear-
    Can cause people to feel anxious and scared with just a glare.Berserk - Chapter
    13 Deception- Was able to successfully lie to his entire army and the government
    of Midland into thinking that he had nothing to do with the murder of both the
    king''s brother, Julius, and the Queen of Midland. Leadership- Is able to inspire
    and command his men in extremely difficult situations, even when death seems inevitable.Berserk
    - Chapter 25 Is such a good leader that he convinced many people, both in his
    army and within the government of Midland, that he was a godlike figure through
    his leadership abilities alone.Berserk - Chapter 23 Charisma- His charisma is
    nearly irresistible by many, and allows him to draw in a great army. His whole
    band of mercenaries was charmed by him.Berserk - Prologue Chapter 16 Coercion-
    Blackmailed Minister Fosse into helping him assassinate the Queen of Midland by
    kidnapping and threatening to kill his daughterBerserk - Chapter 32) *Extreme
    Pain Tolerance (Laughed off being repeatedly whipped by the King of MidlandBerserk
    - Chapter 60) *Blessed (Protection; Griffith is the Idea of Evil''s chosen one
    and he is blessed by it''s protection. The Idea of Evil manipulated Fate, Causality
    and Probability to give birth to Griffith and ensure he arrived to the Eclipse.Berserk
    - Chapter 83 Under the Idea of Evil''s protection Griffith is unable to receive
    any mortal wound, such as the poisoned arrow which was shot at him and was fated
    to miss. He can still lose fights and be damaged, however. This protection even
    saved him from killing himselfBerserk - Chapter 72) **Supernatural Luck (When
    a poisoned arrow was shot at him, it hit his Behelit. His life is protected by
    CausalityBerserk - Chapter 9) Crimson Behelit'
