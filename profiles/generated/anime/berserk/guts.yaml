- id: claim-weaknesses-308d5f3c
  section: weaknesses
  axis: weakness
  text: 'Bloodthirsty and sadistic to a fault at times. Suffers from PTSD that makes
    him fear to be touched intimately | Is cursed by the Brand of Sacrifice and will
    be attacked by Tidal Wave of Darkness during the night. Can''t swim with his steel
    arm | The Berserker Armor does not heal wounds, only delaying the effects of damage
    taken. The Berserker Armor also removes his subconscious limiters, causing his
    body to harm and eventually destroy itself. Now suffers from even more severe
    PTSD Notes: *While there are claims that Dragon Slayer negates durability by attacking
    the soul, this is not true, nor are claims it outright possesses a busted degree
    of regeneration negation (this argument commonly phrased as something to the effect
    of "Dragon Slayer kills with a scratch"). Its power is more along the lines of
    creating wounds that will never fully recover, and even if healed or regenerated,
    they will open up again. This isn''t full-blown regeneration negation but will
    function as such when it comes to more debilitating injuries. *Guts'' Probability
    Manipulation is likely not quite as effective in a VS match as it is in-story,
    as many of the times he''s survived were due to outside help. While still otherwise
    applicable and even potentially highly effective, this does limit his potential
    options for a bailout with luck hax. *It is advised for the OP to choose between
    Guts during Griffith''s retrieval and Post-Eclipse Guts when making matches with
    his second ({{9-A}}) key. Former version of Guts is already 9-A, however the latter
    is even stronger with the Dragon Slayer and his hand-cannon. If it''s not specified,
    by SBA Guts is at his strongest, therefore at the Post-Eclipse state. ==Gallery==
