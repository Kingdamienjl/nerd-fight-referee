- id: claim-powers-and-abilities-31c88740
  section: abilities
  axis: hax
  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Beginning of the Golden
    Age={{Border|Scroll=Yes|Visible=No|Content= *Superhuman Physical Characteristics
    **Possibly Regeneration (Low, Likely Not-Combat Applicable; After his and Griffith''s
    first fight with Nosferatu Zodd, Guts healed from his injuries significantly faster
    than Griffith, despite being the more wounded of the two) *Master Swordsman (Guts
    has carved his own effective sword style that mainly utilizes greatswords) **Limited
    Air Manipulation (By swinging his sword broad-side first, he can alter the air
    pressure in its trajectory to create gusts powerful enough to knock away Silat''s
    urumi) *Competent Hand-to-Hand Combatant *Enhanced Senses (Defended himself and
    several others from a professional assassin sniping them in near-total darkness,
