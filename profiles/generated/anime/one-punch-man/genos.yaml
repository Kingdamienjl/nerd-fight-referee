  intelligence:
    text: "Gifted (Genos exhibits commendable intelligence, attaining a flawless score on the Hero Exam\
      \ \u2013 a test with a significant written component \u2013 and swiftly rising to the rank of S-Class\
      \ Hero. He is a seasoned warrior, boasting a track record of obliterating numerous monsters and\
      \ criminal organizations single-handedly. Genos has shown several times to be extremely intelligent\
      \ and resourceful while in battle: Using G4s size against itself to melt it from the inside and\
      \ then utilizing his surroundings to generate steam and dissipate the light lasers of G4s true form.\
      \ Against Face Ripper, after seeing that the monster was equipped with extremely tough blades that\
      \ could resist his Incineration Cannons and cause considerable damage to his arms, he purposefully\
      \ allowed him to strike at his reinforced head, shattering the blade and leaving Face Ripper wide\
      \ open for a counterattack. After his encounter with Speed-O\u2019-Sound Sonic Kuseno installed\
      \ a super adhesive dispenser on his feet to deal with speedsters, begrudgingly he accepted and used\
      \ it, which was crucial for defeating Awakened Cockroach. During his brief tussle with Garou he\
      \ let himself be struck into the ground so he could hide his arm in the rubble and fire an Incineration\
      \ Cannon, narrowly missing his target due to Garou\u2019s incredible reflexes and instincts. Against\
      \ Elder Centipede he created a smoke barrier with his Incineration Cannons and then led the giant\
      \ insect to look up before suddenly dissipating the smoke away with his boosters, blinding Elder\
      \ Centipede momentarily with the sunlight. His willingness to improve his battle tactics and adapt\
      \ to any situation, even if it hurts his ego, makes him a formidable and versatile foe)"
    source_ids: *id002
    confidence: 0.95
