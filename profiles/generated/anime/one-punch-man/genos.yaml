- id: claim-standard-equipment-ec0e0b72
  section: equipment
  axis: equipment
  text: "His Core, a special device that supplies energy for all his functions. Various attachments and\
    \ upgrades, including: *{{Nihongo|Incineration Cannons|{{Ruby|\u713C\u5374|\u3057\u3087\u3046\u304D\
    \u3083\u304F}}{{Ruby|\u7832|\u307B\u3046}}|Sh\u014Dkyaku-h\u014D}}: Genos' palms are equipped with\
    \ special cannons that release streams of heat and flame on command. A blast from his palms was enough\
    \ to completely vaporize the House of Evolution and part of a mountain behind it. *Anti-Saitama Arms:\
    \ A special pair of arms with even more cannons built into the forearms and fists, allowing him to\
    \ unleash even more powerful and wide-ranged blasts. *Arms Mode A prototype weapon system that Genos\
    \ carries with him in the form of a suitcase. It allows Genos to move the core position to one of\
    \ his shoulders, allowing him to channel energy directly into one of his arms for even greater output.\
    \ *G4 Arms: A pair of arms created from the parts of the G4 robot, these greatly increase Genos' power\
    \ and speed, allowing him to keep up with Speed-o'-Sound Sonic and giving him enough power to casually\
    \ dispatch multiple Demon-level monsters in a short timeframe. *Boosters: Genos is equipped with several\
    \ boosters that allow him to fly for short periods as well as hover across the ground at high speed\
    \ with incredible acceleration and maneuverability. *Sensors: Genos has multiple built-in sensors\
    \ that act as a radar and allow him to scan the environment to find and track his opponents in and\
    \ out of combat. However, they can still be fooled by sufficiently fast opponents (such as Saitama)\
    \ and are limited by Genos's own reaction time. *Adhesive Gel: A tool Genos gained after his fight\
    \ with Sonic to deal with opponents faster than him. The gel is exceptionally sticky, preventing fast\
    \ opponents from moving and allowing Genos to defeat them. *Detachable arms: During his fight with\
    \ Garou, his hands are upgraded to be detachable and are armed with a remote-controlled rocket booster.\
    \ It is also loaded with restraining strings to restrain opponents. *Arm-Blade: Genos's arms are armed\
    \ with razor-sharp blades."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
