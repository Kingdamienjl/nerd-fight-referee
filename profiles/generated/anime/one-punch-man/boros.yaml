- id: claim-weaknesses-1713a9f9
  section: weaknesses
  axis: weakness
  text: 'Meteoric Burst burdens his body immensely, tiring him out with prolonged
    use. If he runs out of energy, he will no longer be able to regenerate, use energy
    attacks or Meteoric Burst. Notable Attacks/Techniques: right|270px *{{Nihongo|Energy
    Bullets|エネルギ{{Ruby|弾|だん}}|Enerugi-dan}}: One of Boros'' special techniques in
    which he condenses a massive amount of his latent energy and shoots it out of
    the chest in his eye. This was power enough to turn a large portion of his ship
    into dust. *{{Nihongo|Meteoric Burst|メテオリックバースト|Meteorikku Bāsuto}}: Boros'' trump
    card, which he resorts to when he wishes to settle a fight quickly. Meteoric Burst
    gains speed and strength beyond the body''s limit by releasing latent energy as
    a propulsive force. However, it puts an immense burden on his body, similar to
    anaerobic exercise. In this form, Boros'' kick had enough power to send Saitama
    to the moon at relativistic speeds. *{{Nihongo|Collapsing Star Roaring Cannon|{{Ruby|崩|ほう}}{{Ruby|星|せい}}{{Ruby|咆|ほう}}{{Ruby|哮|こう}}{{Ruby|砲|ほう}}|Hōsei
    Hōkōhō}}: An advanced version of his energy bullet in which Boros summons all
    the latent energy in his body, releasing it all into one final beam, which is
    capable of wiping out the earth''s surface. This attack is Boros'' final resort,
    and was so dangerous that Saitama countered it with his very first Serious Punch.
