- id: claim-weaknesses-d861ceac
  section: weaknesses
  axis: weakness
  text: 'Lelouch is incredibly arrogant, and his penchant for theatrics and overcomplicated
    plans can backfire on him. He is physically inept, unable to run fast for long
    periods and easily exhausted by physical labor (however, by the middle of the
    second season, he seems to have gained a bit of physical ability as he was able
    to hold onto Shirley when she fell off the roof of a building). The Geass requires
    eye contact and can only be used once per target. When the Geass becomes uncontrollable,
    he must remove his contacts to use them. All Knightmares have limited ammo and
    energy reserves. Notable Attacks / Techniques: - Gea'
  source_ids: *id003
  decisive: false
  status: unverified
