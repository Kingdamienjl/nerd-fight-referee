  intelligence:
    text: Suzaku is one of the world's top Devicers, a man capable of piloting a machine
      like the Lancelot Albion, which was so advanced that it was thought that no
      living human could pilot it properly. An expert combatant and martial artist,
      trained since his youth, Suzaku is capable of rapidly adapting to combat situations
      and making the most of his armaments even as he's just gotten them. Notably,
      in his third fight with Kallen's Guren Type-02, Suzaku baited out the Radiant
      Wave Surger and sacrificed his arm to destroy it, robbing her of her strongest
      weapon in moments. Even when pitted up against superior machines, Suzaku's sheer
      skill allows him to keep up and compensate for his own Knightmare's inferior
      specs.
