- id: claim-intelligence-d2e3ba54
  section: power_scale
  axis: battle_iq
  text: Suzaku is one of the world's top Devicers, a man capable of piloting a machine
    like the Lancelot Albion, which was so advanced that it was thought that no living
    human could pilot it properly. An expert combatant and martial artist, trained
    since his youth, Suzaku is capable of rapidly adapting to combat situations and
    making the most of his armaments even as he's just gotten them. Notably, in his
    third fight with Kallen's Guren Type-02, Suzaku baited out the Radiant Wave Surger
    and sacrificed his arm to destroy it, robbing her of her strongest weapon in moments.
    Even when pitted up against superior machines, Suzaku's sheer skill allows him
    to keep up and compensate for his own Knightmare's inferior specs.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-fec7b4b3
  section: weaknesses
  axis: weakness
  text: 'Suzaku is legitimately self-destructive and suicidal (yet incapable of actually
    going through with it due to the effects of his Geass). The original Lancelot
    lacks a cockpit ejection system, meaning that if it''s badly damaged or about
    to be destroyed, Suzaku has no recourse. All Knightmares have a limited supply
    of ammunition and energy. Notable Attacks / Techniques: * Kurukurukick: Suzaku''s
    signature technique, a flying, spinning kick that he even uses when piloting a
    Knightmare. Its actual name is the Hinoboru-ryu Makoto-ichi-shiki Hurricane Kick.
    * "Live": During their encounter on Shikine Island, Lelouch used his Geass to
    command Suzaku to "live". This command prevented Suzaku from ever fulfilling his
    death wish, causing him to suddenly prioritize his own self-preservation whenever
    he''s put into deadly situations, much to his distress. In time, however, he learned
    how to utilize his "curse" to his advantage, letting it kick in during high-pressure
    fights so that he can go past his limits, even pushing his Knightmares to new
    heights. It can even clue him in when an opponent is too dangerous for him to
    defeat. ==Notable Matchups== Victories: Losses: Blake Belladonna (RWBY) Blake''s
    Profile (Starting distance was 10 meters, speed was equalized, both characters
    have prior knowledge, Lancelot Suzaku and Post-Haven Blake used) Inconclusive:
    ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters
    Category:Code Geass Category:Super Robot Wars Category:Acrobats Category:Anime
    Characters Category:Antagonists Category:Body Control Users Category:Energy Projection
    Users Category:Enhanced Senses Users Category:Flight Users Category:Forcefield
    Users Category:Gun Users Category:Humans Category:Information Analysis Users Category:Knife
    Users Category:Knights Category:Large Sized Characters Category:Loyal Characters
    Category:Male Characters Category:Martial Artists Category:Matter Users Category:Mecha
    Category:Military Characters Category:Pilots Category:Primary Protagonists Category:Protagonists
    Category:Soldiers Category:Statistics Amplification Users Category:Sword Users
    Category:Teenagers'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
