- id: claim-powers-and-abilities-623a43c8
  section: abilities
  axis: hax
  text: 'Pre-Timeskip=Superhuman Physical Characteristics, Absolute Mastery with Rokushiki
    (He has mastered all six styles of Rokushiki. Encompasses versatile combat techniques),
    Acrobatics, Afterimage Creation, Pseudo-Flight (Via Geppou), Statistics Amplification
    (Via Soru, Tekkai, and Seimei Kikan: Kami-e Bushin), Body Control and Damage Reduction
    (Kami-e and Tekkai), Enhanced Senses (Zoan users gain the senses of their respective
    animal), Limited Biological Manipulation via Seimei Kikan, Air Manipulation (Via
    Rankyaku and Flying Shigan), Transformation and Bodily Weaponry (Ate the Neko
    Neko no Mi, Model: Leopard, a Zoan-type Devil Fruit which allows him to transform
    into a leopard and a giant leopard-human hybrid), Attack Reflection (via Tekkai:
    Utsugi), Minor Durability Negation (via Rokuogan), Haki (Kenbunshoku, Busoshoku),
    Resistance to Animal Manipulation (Zoans are immune to Tama''s Kibi Dangos) |-|Post-Timeskip=All
    previous abilities plus, Haki (Kenbunshoku, Intermediate Busoshoku), Regeneration
    (A faster recovery rate is granted to awakened Zoan users, allowing them to recover
    from injuries more quickly)'
