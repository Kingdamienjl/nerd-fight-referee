- id: claim-weaknesses-186bf976
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit user weaknesses and using Tekkai requires him to stay
    sufficiently still. Due to being a carnivorous Zoan, Lucci is much more violent
    and blood-thirsty and can be more easily provoked. Notable Attacks/Techniques:
    |-|Devil Fruit= Lucci ate the Neko Neko no Mi (Cat Cat Fruit): Model Leopard,
    which allows him to transforms into a leopard and into an human-leopard hybrid
    form. As a Zoan user, Lucci''s physical abilities are greatly enhanced, and due
    to being a physical combatant, he can use this fruit''s power to the fullest.
    Neko_Neko_Leopard.gif|Lucci in his hybrid form Lucci_Leopard.gif|Lucci in his
    animal form |-|Rokushiki= A special, superhuman martial arts style. {{#tag:tabber|
    {{!}}-{{!}}Geppou= Also known as Moon Step, allows the users to actually jump
    off the air itself, allowing them to stay in the air for much longer than usual.
    CP9 members can use this technique to cross great distances without ever touching
    the ground, or set themselves up for swift, aerial attacks. (Lucci showed a variant
    of Geppo, where he combines it with Soru to create the three-dimensional movement
    Kamisori. *Kamisori ("Razor"): A combination of Geppo and Soru, where Lucci uses
    Soru in a zigzag motion in midair, allowing extremely fast movements in three
    dimensions. Geppou.gif|Geppou Lucci_Kamisori.gif|Kamisori {{!}}-{{!}}Tekkai= Also
    known as Iron Mass, hardens the users'' muscles to the level of iron, in order
    to nullify damage taken from attacks. However, it can be broken by strong enough
    forces. *Tekkai "Utsugi" (Iron Ma'
  source_ids: *id003
