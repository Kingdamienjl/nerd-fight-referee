- id: claim-weaknesses-35c5af98
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques: Haki: There are normally two types of Haki regular people\
    \ can tap into: the Kenbunshoku Haki which allows individuals to sense the presence of others, and\
    \ Bus\u014Dshoku Haki which allows individuals to create an invisible armor around them. There is\
    \ however a third type of Haki, Ha\u014Dshoku Haki, that only a few individuals can use. Rayleigh\
    \ is one of these people. *Ha\u014Dshoku Haki (Color of the Conquering King): Rayleigh is certainly\
    \ a master with this ability. He taught Luffy how to properly utilize it and can selectively knock-out\
    \ individuals and ignore others caught within his aura, sparing them. He's displayed arguably the\
    \ strongest level of application with this power. He also one a few who are capable of using the advanced\
    \ application of this type of Haki, able to \"infuse\" his body or objects with Haoshoku Haki to increase\
    \ his attack power, signified by thin streams of black lightning emanating from his body during Blackbeard\
    \ raid on Amazon Lilly. In the anime, he incapacitates several Blackbeard pirates in the area Like\
    \ Zoro did with the Beast pirates and Shanks did with the Kid pirates.One Piece Vol. 59 Chapter 579\
    \ center|400px *Bus\u014Dshoku Haki (Color of Armaments): Rayleigh should be advanced with this type\
    \ of Haki, capable of covering his weapon and body completely with Busoshoku: Koka. He taught Luffy\
    \ everything he knows about this type of Haki, thus should be capable of Luffy's level of application,\
    \ and more. center|400px *Kenbunshoku Haki (Color of Observation or Mantra): Rayleigh should be advanced\
    \ with this type of Haki, fully explaining its capabilities to Luffy, and teaching him all that he\
    \ knows about it. He also has knowledge of the advanced application of this type of Haki and how high-level\
    \ users can see into the future. ==Gallery== Silvers rayleigh the dark king by bodskih-dbcd714.png\
    \ ==Notable Matchups== Victories: Marco (One Piece) Marco's Profile Losses: Dracule Mihawk (One Piece)\
    \ Mihawk's Profile (Speed was Equalized, starting distance 100 meters) Kozuki Oden (One Piece) Oden's\
    \ Profile Shanks (One Piece) Shanks' Profile (Prime Rayleigh was used) Inconclusive: ==References==\
    \ {{Reflist}} ==Notes and Explanations== {{discussions}} Category:Characters Category:One Piece Category:Accelerated\
    \ Development Users Category:Adaptation Users Category:Adults Category:Animal Users Category:Anime\
    \ Characters Category:Attack Reflection Users Category:Aura Users Category:Chi Users Category:Durability\
    \ Negation Users Category:Empathic Manipulation Users Category:Extrasensory Perception Users Category:Forcefield\
    \ Users Category:Good Characters Category:Haki Users Category:Humans Category:Male Characters Category:Manga\
    \ Characters Category:Martial Artists Category:Non-Physical Interaction Users Category:Pirates Category:Precognition\
    \ Users Category:Sailors Category:Statistics Amplification Users Category:Sword Users Category:Teachers\
    \ Category:Telepaths Category:Weapon Masters Category:Weapon Users"
  source_ids: *id003
  decisive: false
  status: unverified
