- id: claim-weaknesses-f59af9c1
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit users weaknesses. Her Devil Fruit''s abilities don''t
    work on someone who isn''t attracted to her (Example: Luffy), or is feeling an
    emotion far superior at the time they would feel lust for her (Momonga was able
    to not be affected during the time she used her powers due to feeling the pain
    from stabbing himself more than his lust for her) Notable Attacks/Techniques:
    Haki: There are normally two types of Haki regular people can tap into: the Kenbunshoku
    Haki which allows individuals to sense the presence of others, and Busōshoku Haki
    which allows individuals to create an invisible armor around them. There is however
    a third type of Haki, Haōshoku Haki, that only a few individuals can use. Hancock
    is one of these people. * Haōshoku Haki (Color of the Conquering King): Hancock
    is stated to be capable of utilizing Haoshoku Haki. She''s been shown to use it
    making animals her servants. * Busōshoku Haki (Color of Armaments): Hancock has
    displayed the ability to harm Luffy''s Rubber body and Smoker''s smoke body with
    blunt force and projectiles, and like the residents of her island capable of applying
    hardening to her pet snake, meaning she is at least proficient with it * Kenbunshoku
    Haki (Color of Observation or Mantra): She sensed both Luffy and the Heart Pirates
    were alive deep underwater despite other Kenbunshoku Haki users being unaware,
    and continued to track their movement while still underwater. Mero Mero no Mi
    (Love Love Fruit): A Paramecia-type Devil Fruit that Hancock was forcibly fed
    as a young woman, it grants her the ability to incite lust and perversion in others
    as well as the ability to turn her foes to stone should they fall for her charms.
    Anyone who experiences any sort of "dirty thoughts" towards her will be susceptible
    to this Devil Fruit''s powers, as the Fruit itself amplifies those feelings in
    order to affects the targets. During this time, Hancock''s petrified victims will
    have their consciousness frozen, as if time had stopped around them, preventing
    them from making any sort of action unless Hancock willingly releases them from
    this state. However, sufficient concentration, being blind or blindfolded (and
    thus unable to experience Hancock''s beauty), or simply lacking any sort of affection
    for Hancock can nullify these effects. On the other hand, she can also petrify
    her foes with her physical attacks as well as her techniques, regardless of whether
    or not the target feels lust for her, even working on inanimate objects or machines
    like Pacifistas. But this use of her powers will only affect the area struck rather
    than the entirety of the target''s body. *Mero Mero Merrow: Hancock''s signature
    technique, she forms a heart shape with her hands to fire a heart-shaped beam
    that applies her Devil Fruit''s effects to anyone in range. However, as with the
    Devil Fruit''s normal functions, this technique can be resisted by focusing on
    something other than Hancock (such as a powerful emotion or self-inflicted pain)
    or simply by not feeling any sort of affection for her (as if the case with Luffy)
    ** Awaken: Hancock blows a kiss at a person or persons previously turned to stone
    by Mero Mero Merrow, which causes small hearts that wash over them and restore
    them to their normal state. center|thumb|300px *Pistol Kiss: Hancock blows a kiss,
    creating a heart-shaped bullet to fire at her victim by aiming it with her index
    finger. This attack doesn''t petrify her opponent, but instead has enough force
    to pierce the opponent. When first seen on Amazon Lily, Boa Hancock send the bullet
    flying with enough force that it immediately pierced through Luffy''s rubber body,
    despite the latter constantly displaying the ability to bounce bullets off of
    his body with ease. center|thumb|300px *Slave Arrow: Hancock breathes in deeply
    and blows a kiss, creating a giant heart that detonates to unleash a barrage of
    hundreds of arrows that petrify anything they strike, freezing them in place whether
    or not they were in motion. As such, this can also be used defensively, stopping
    cannonballs in their tracks. *Perfume Femur: Hancock performs a handstand before
    performing a series of spinning kicks that utilize her Devil Fruit''s power to
    petrify anything she strikes, turning her foes to stone upon contact before smashing
    them with the force of her kicks. However, this technique''s effects only apply
    to the portions of the body Hancock strikes, leaving the rest of the victim unharmed.
    center|300px ==Gallery== 4AC2A07F-93D6-42B9-8827-E90C0741CBEB.png Boa hancock
    the pirate empress by bodskih-dbcd4hb.png ==Notable Matchups== Victories: Bugby
    (Lilo & Stitch) Bugby''s Profile (Speed was equalized) Son Goku (Toei) (Dragon
    Ball) Son Goku''s Profile (BoZ Goku was used and speed was equalized) Shinobu
    Oshino (Monogatari) Shinobu''s Profile (Kiss-Shot was used and speed was equalized)
    Yamato (One Piece) Yamato''s Profile Satoru Gojo (Jujutsu Kaisen) Gojo''s Profile
    (Speed was equalized) Rouge the Bat (Sonic the Hedgehog) Rouge''s Pr'
