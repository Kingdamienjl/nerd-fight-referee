  intelligence:
    text: Gifted (As the captain of the Kuja Pirates and a member of the Seven Warlords
      of the Sea, Hancock is an immensely talented and capable combatant, easily demolishing
      scores of Pacifistas with her decades of experience in hand-to-hand combat and
      the use of her Devil Fruit's abilities. She is also one of the few people in
      the world able to use all three forms of Haki, allowing her to easily anticipate
      her foes' attacks and crush them with her superior technique. As such, even
      the highest echelons of the World Government, including the Admirals, are wary
      of her power and influence. Her prowess was proven during the Whitebeard War,
      where she was one of the only combatants to leave the battlefield completely
      unscathed, despite clashing with both the Whitebeard Pirates and the Marines
      during the conflict. However, her confidence in her beauty and strength has
      also made her rather arrogant, often looking down upon others with reckless
      abandon. In addition, her love for Luffy drives many of her actions, which nearly
      led her to leap into the fray against the Admirals despite the political upset
      it would cause.)
