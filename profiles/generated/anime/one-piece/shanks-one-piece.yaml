  range:
    text: 'Extended Melee Range with his saber, At least Kilometers with Flying Slashes
      (Shanks has superior destructive force and sword skills compared to Dressrosa
      Arc Zoro,One Piece Vivre Card Databook #0002One Piece Vivre Card Databook #0085
      which are crucial for executing flying slashes.One Piece Vol. 48 Chapter 467
      Thus, it can be inferred that Shanks can produce flying slashes greater than
      Zoro), Thousands of Kilometers with Kenbunshoku and Haoshoku Haki (He sensed
      Admiral Ryokugyu''s presence at the Flower Capital while he himself hadn''t
      entered Wano yet, and he struck him with Haoshoku Haki from this distanceOne
      Piece Vol. 104 Chapter 1054One Piece Vol. 104 Chapter 1055)'
    source_ids:
