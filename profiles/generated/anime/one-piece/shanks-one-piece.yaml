  intelligence:
    text: 'Gifted in general. Astoundingly skilled Combatant (He is a highly accomplished
      fighter with nearly four decades of battle experience. He sailed under the Great
      Pirate crew of the Roger Pirates in the New World since he was one year old,One
      Piece Volume 4000000000 where he fought against elites from Marine Headquarters
      and many great pirate crews of the age,One Piece Vol. 96 Chapter 966 including
      the Golden Lion Pirates and the Whitebeard Pirates.One Piece Vol. 0 Chapter
      0One Piece Vol. 45 Chapter 434 After spending 14 years as an apprentice pirate
      under Roger, he formed his own crew, the Red Hair Pirates. Through his exploits,
      he ascended to become a Great Pirate and eventually an Emperor of the Sea, ruling
      over vast territories and commanding many pirate fleets.One Piece SBS Volume
      104 His exceptional skill in swordsmanship earned him the recognition as a Great
      Swordsman,One Piece Red: Grand Characters a title befitting the prowess of a
      master swordsman both in name and actuality.One Piece Vivre Card Databook #0002
      His skill was on par with that of Dracule Mihawk, the best in the world. Even
      after losing his arm, he remained Mihawk''s last worthy foe.One Piece Vivre
      Card Databook #0085 In contrast, other Great Swordsmen, such as Vista,One Piece
      Vivre Card Databook #0606 couldn''t even alleviate his boredom.One Piece Deep
      Blue: Characters World Additionally, his combat skills garnered recognition
      from Kaidou,One Piece Vol. 99 Chapter 1001 as he was one of the few capable
      of truly going toe to toe with him.One Piece Vol. 103 Chapter 1037)'
    source_ids:
    - mediawiki-shanks-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
