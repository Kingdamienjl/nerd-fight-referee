  attack_potency:
    text: 'Small Planet level (Casually neutralized a magma punch from Akainu.One
      Piece Vol. 59 Chapter 579 Was stated by the Gorosei to be one of the few people
      who can stop Blackbeard.One Piece Vol. 60 Chapter 594 When he offered to fight
      Blackbeard during the Marineford War, he declined and decided to leave, believing
      it was too soon for him and his crew to take on Shanks.One Piece Vol. 59 Chapter
      580 Alongside his crew, he stopped Kaidou and King from reaching MarinefordOne
      Piece Vol. 55 Chapter 533One Piece Vol. 59 Chapter 580One Piece Vivre Card Databook
      #13089.042 Zettatons), Planet level with Conqueror''s Haki Infusion (Is stated
      to be an equal to and clashed with Old Whitebeard, resulting in the heavens
      being split.One Piece Vivre Card Databook #0017One Piece Vol. 45 Chapter 434
      With Conqueror''s Haki alone, he paralyzed Admiral Ryokugyu in fear, with his
      Haki being remarked upon as monstrous by both Jinbe and Luffy.One Piece Vol.
      104 Chapter 1055 His Divine Departure technique one-shot both Eustass Kidd and
      Killer.One Piece Vol. 107 Chapter 1079 Kaidou acknowledged him, alongside other
      legendary pirates, as one of the few capable of truly going toe-to-toe with
      him,One Piece Vol. 99 Chapter 1001 with Luffy only receiving the same acknowledgment
      after prompting Kaidou to use Shuron Hakke.One Piece Vol. 103 Chapter 1037 Dorry
      and Brogy remarked that Joyboy''s strongest Haoshoku Haki might even be stronger
      than Shanks'' own,One Piece Vol. 110 Chapter 1123 praise they didn''t give to
      the Gorosei or Luffy when they experienced it,One Piece Vol. 110 Chapter 1111
      implying that Shanks'' Haki surpasses that of the Gorosei and Gear 5th Luffy59.44
      Zettatons)'
