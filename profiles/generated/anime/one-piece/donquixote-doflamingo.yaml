  stamina:
    text: Superhuman (Has displayed monstrous endurance, comparable of that to Monkey
      D. Luffy. Shrugged off one of Luffy's Red-Hawks, which sent an explosion through
      his torso, and an injection attack from Law that went through his stomach. Despite
      both attacks wounding him to some extent, they had no noticeable effect on his
      fighting ability. Doflamingo stayed conscious after having taken Law's Gamma
      Knife to his chest, which resulted in an explosion completely destroying all
      of Doflamingo's organs, sending smoke and blood out of his mouth--fatally injuring
      him without leaving any exterior wounds. This was then followed up with a kick
      from Luffy to the same location, and Law electrocuting him, but Doflamingo was
      capable of standing up merely seconds later despite the damage and pain while
      only having started patching his organs up with Sufuku Sagyo and continued his
      fight against Luffy. He shrugged off many attacks after this, and later withstood
      attacks from Gear 4th Bound Man Luffy and even outmatched Luffy in a battle
      of attrition, as Luffy fell unable to move due to utilizing Gear Four too much,
      while Doflamingo was still capable of fighting with only moderate lapses while
      Luffy required some time to recover. After all of this, it took the effort of
      Luffy's strongest attack to keep Doflamingo down--resulting in both passing
      out. Doflamingo was later seen having a casual talk with Tsuru, only having
      a bandage on his forehead and being in good condition otherwise [though it is
      unknown if he woke up soon after his fight with Luffy, or a couple of days after
      the fight])
    source_ids: *id002
    confidence: 0.95
  range:
    text: Tens to Hundreds of Meters with physical strikes (Destroyed three palace
      towers with the shock-wave of his kick, with the shockwave going off panel).
      Kilometers with Conqueror's Haki (The Haki clash with Luffy engulfed the entire
      Flower Hill), Tens of Kilometers with threads (Overheat destroyed one of the
      buildings in Dressrosa while Doflamingo was somewhere between Dressrosa and
      Green-bit. He encased the entirety of Dressrosa in his Bird-Cage). At least
      Kilometers with Observation Haki (Was overseeing the events transpiring on the
      Flower Hill)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Genius (A man obsessed with having power, Doflamingo seizes every opportunity
      for his own personal gain. He is a tactical genius and the head of a worldwide
      criminal empire, manipulating the royalty of Dressrosa to conquer the country
      in a single night while retaining widespread popularity as its king, selling
      black market goods to entities around the world, including two of the Four Emperors
      without the World Government''s knowledge while abusing his position as the
      king of a nation and a member of the Shichibukai to maintain political immunity.
      Wily and perceptive, he instantly saw through Trafalgar Law''s plan to unseat
      him as a Shichibukai, planting false information in newspapers and manipulating
      events to successfully capture Law by pitting him against both an Admiral and
      Doflamingo himself while trapping Monkey D. Luffy within the Dressrosa''s Corrida
      Coliseum with the promise of the Mera Mera no Mi to keep the Straw Hats from
      interfering. In battle, he is extremely well-versed in the use of his Devil
      Fruit, using his threads to quickly repair himself from Law''s Gamma Knife despite
      being brought to the verge of death and going on to prove himself superior to
      Luffy in hand-to-hand combat and the use of his Devil Fruit, forcing the latter
      to utilize Gear Fourth to gain an advantage. He is also pragmatic enough to
      utilize his Birdcage technique as soon as he was outed by the Straw Hats and
      Law, using monetary rewards and promises of mercy to turn potential enemies
      against each other and buy additional time for himself. After killing his father
      at the age of 10, Doflamingo developed psychological damage to the point where
      he would begin to smile and laugh uncontrollably.) Standard Tactics: Following
      the theme of his personality and Devil Fruit ability, Doflamingo approaches
      combat in a mocking, yet shrewd manner. He takes heavy advantage of his opponent''s
      temper, and the range in which he can use his collective abilities. *In combat,
      his first instinct is to aggravate his opponent in order to disrupt their mood
      and lure them into attacking recklessly, or dropping their guard all together.
      Upon being successful, Doflamingo generally capitalizes on this by using his
      ability to take control of his opponent''s body, with the intention of either
      maiming or even killing them. He''s most comfortable while in control of engagements,
      and usually keeps his abilities a mystery before surprising his target with
      sudden attacks from varying angles. If his opponent is highly aggressive, this
      works into his favor, as he will make it seem he is forced to rely on defense,
      when he is truly using his powers of observation and strings to blind-side his
      opponent when they least expect it. As a result, Doflamingo is most effective
      when working as a defensive combatant through trickery and brutality. **However,
      if his efforts are countered through the discovery of his abilities and his
      opponent''s ability to circumvent them, he is forced to fight head-on, which
      is not his typical form of fighting, and thus his weakest. While he is still
      highly effective as the aggressor in the fight, he has been seen receiving grazing
      strikes from Trafalgar Law despite being victorious, and has taken several blows
      from Monkey D. Luffy due to underestimating his fighting ability and strength.
      Upon being angered, Doflamingo has been seen overextending, leaving himself
      open to counter attack, but this does not guarantee that an opponent will successfully
      injure him, as he can still use his Busoshoku Haki to defend himself without
      resorting to movement.'
    source_ids: *id002
    confidence: 0.95
