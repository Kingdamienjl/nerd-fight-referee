      \ could take a Phoenix Brand from Marco None of Marco or Sanji's attacks prior to him awakening\
      \ could deal lasting damage to him), far higher with Bus\u014Dshoku Haki (Blocked attacks from Pre-Exoskeleton\
      \ Diable Jambe SanjiOne Piece Vol. 101 Chapter 1023)"
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Jack, a fellow All-Star fought continuously for five days against two equal opponent
