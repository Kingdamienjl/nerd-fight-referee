- id: claim-powers-and-abilities-c5fb2602
  section: abilities
  axis: hax
  text: Pre-Timeskip= Superhuman Physical Characteristics, Expert Boxer and Proficient
    Grappler, Cyborgization (Has altered his body with cybernetic functions to a great
    extent.), Genius Intelligence (An extremely able shipwright and carpenter. Made
    himself a cyborg), Enhanced Senses (Franky always had good hearing which has allowed
    him to evade sneak attacks from behind & above.) , Hair Manipulation (Can use
    his sideburns as projectiles), Transformation (Franky Kentaurus, unknown if he's
    still able to do this), Weapon Mastery (Proficient nunchucks user and marksman,
    has a vast weapon arsenal within his body), Fire Manipulation (Can shoot fireballs
    from his mouth), Statistics Amplification (Can increase his physical strength
    by using cola as fuel), Air Manipulation (Can fire powerful air blasts), Has built
    - in artillery Explosion Manipulation (Can fire rockets and cannonballs from his
    arms), Construction (Can construct an entire bridge within seconds, created a
    staircase during his fight with Oars), Preparation (Given time and prep he can
    upgrade his body with varying features), Resistance to Extreme Heat (Tanked Usopp's
    Fire Bullet to the hand and chest) and Piercing Weaponary (His cybernetics grant
    him an iron body) |-|Post-Timeskip= Same as before to a greater degree, Vehicular
    Mastery, Energy Projection, Explosion Manipulation, Heat Manipulation, Light Manipulation
    (Can shoot laser beams that explode upon contact and can instantly melt steel
    or generate light from his chest. The Franky Shogun can create a V-shaped projectile
    made out light with a sword swing), Resistance to Gas Manipulation and Fire Manipulation
    with Franky Shogun, Electricity Manipulation (Can generate electricity with his
    Strong Hammer)
