- id: claim-weaknesses-bc9ece05
  section: weaknesses
  axis: weakness
  text: 'His back is not made of steel; this has been shown to be exploited a few
    times in the series. Strength slightly decreases if he uses up cola. Some attacks
    require cola to be used. Can only carry 3 bottles of cola at a time | Still powered
    by cola, though can hold much more due to his upgraded body Notable Attacks/Techniques:
    |-|Pre-Timeskip= *BF-36: Cyborg Tactics: After Franky turned himself into a cyborg,
    he originally labeled himself as BF-36 (Battle Franky 36, his thirty-sixth creation
    of the same name, which allowed him to develop a battle style he called Cyborg
    Tactics. center|The man of men. Head: Franky''s head is one of the clearer signs
    that he is, in fact, a Cyborg. With various aspects such as an exposed metal nose
    and a three pointed chin which is called a "Butt Butt Chin", it clearly shows
    that he is indeed a cyborg. Aside from these, however, Franky has also made some
    modifications to it so that his head can perform a number of functions. *Fresh
    Fire: Franky takes a deep breath and breathes fire like a flamethrower. *Master
    Nail: Franky takes a deep breath as he does with Fresh Fire, but shoots out nails
    instead of flames. By flailing his head about, Franky can fire the nails in multiple
    directions. *Franky Triangle Jacker: Along with the majority of his hair, his
    sideburns have also been modified in the form of razor sharp weapons which he
    can shoot at the opponent. The sideburns grow back immediately after they’ve been
    removed. Shoulder: Functions that Franky can perform with his modified shoulders.
    *Franky Destroy Ho (Franky Destroy Cannon): Franky lowers his shirt to reveal
    the two holes in his shoulders which then form into the cannons. This function,
    however, causes him to dislocate his shoulders and hurts Franky in the process.
    **Tsuiseki Hodan (Chaser Bullets): Despite its name, these bullets do not home
    in on a target. Franky simply just chases an opponent with his cannons firing.
    Arms: Franky''s forearms have been modified to a size considerably larger than
    an ordinary human''s. They both house a large number of weapons. The right arm
    is used mostly to deliver devastating melee attacks while the left arm is used
    mostly to deliver ranged attacks. *Coup de Vent (Wind Cannon): Franky connects
    both of his arms together with a "T" shaped pipe then aims the remaining end of
    the pipe at his opponent. He then sucks massive amounts of air into his abnormally
    large arms (thus making them grow even larger) and when he reaches critical mass
    he fires a cannonball of compressed air at his opponent. Franky is able to adjust
    the power when he uses this function. **70mm Kokei 0.2 Cola Ho Coup de Vent (70mm
    caliber, 0.2 Cola Cannon Small Wind Blow): A small version of Coup de Vent only
    using two-tenths of a cola. **70mm Kokei 1.5 MAX Cola Power Coup de Vent (70mm
    caliber, 1.5 MAX Cola Power Wind Blow): A super-powerful form of Coup de Vent,
    using one and a half colas. *Franky Boxing: Primarily used when he is running
    low on cola. Basically, standard boxing maneuvers. *Strong Right: Franky is able
    to separate and fire his chained right forearm like a rocket at an opponent and
    reel it back in for further damage as well as recovery. *Strong Hammer: First,
    Franky removes the skin on his right hand. With it removed, Franky can deliver
    a punch which he calls Strong Hammer. **Ultimate Hammer: An apparently stronger
    variation of the Strong Hammer attack that has so far been used in conjunction
    with Franky Kentaurus. After capturing his opponent in Centaur mode, Franky uses
    this function to bash his opponent''s face in at point blank range. *Weapons Left:
    Franky holds his left arm straight out in front with his palm facing the opponent,
    his arm then rotates inward and his wrist opens like a door hinge. The hole in
    his left hand opens up to reveal a gun sight that Franky can aim with. Franky
    is then capable of shooting a cannon ball. *Beans Left: Franky twists his left
    arm inwards without moving his left hand at all and exposes four small holes in
    his wrist that shoot rapid-fire explosive pellets at his opponent, like a machine
    gun. *Hoshi Shield (Star Shield): Franky expands his left forearm into a circular,
    shield-like state. *Ouch Finger: Franky opens the tip of his left pointer finger
    and fires a bullet from it like a pistol. *Hakugeki Ho (Trench Mortar): With Anti-Monster
    Shells threaded into his left arm like a Gatling gun, Franky fires at an opponent
    at point blank range with his left arm. Chest: After the fight between Franky
    and Luffy, it is revealed that Franky built a refrigerator in the area where his
    intestines should be. This is the core of all of Franky''s cyborg body as it is
    used to store fuel to power up all of his different functions. Up to three bottles
    of fuel can be stored here and the amount of fuel that is depleted is dependent
    on the strength of the function itself. Also, the smaller amount of fuel, the
    less Franky''s total strength is. Legs: Functions that Franky can perform with
    his modifi'
