- id: claim-powers-and-abilities-c2e14e56
  section: abilities
  axis: hax
  text: 'Tier: High 6-C, higher with Sparkling Valkyrie Name: Vinsmoke Ichiji, epithet "Sparkling Red"
    Origin: One Piece Gender: Male Age: 21 Classification: Genetically Modified Human, Prince of the Germa
    Kingdom and a Commander of the Germa 66 Powers and Abilities: Superhuman Physical Characteristics,
    Expert Hand-to-Hand Combatant, Cyborgization (Partial), Statistics Amplification and Pseudo-Flight
    with his boots, Energy Projection, Light Manipulation, Danmaku, Durability Negation, Heat Manipulation
    (with Sparking Valkyrie), Explosion Manipulation (with Sparking Red), Regeneration (High-Low: [https://imgur.com/a/vlbhKBh
    Germa possesses incredible regenerative skin, allowing them to heal from wounds that completely pierce
    their bodies, dislocated jaws and even many broken bones]), has a bullet-proof cape, Resistance to
    Fire (With his Raid-Gear Equip), Blades and Blunt Force Trauma ([https://imgur.com/a/h9rPIHI Via their
    exoskeleton which grants them "iron bodies"]), Madness Manipulation, Mind Manipulation and Soul Manipulation
    via Willpower (Through sheer willpower they can resist losing their mind when absorbing shadows through
    the Kage Kage no Mi. Shadows belonging to strong willed people are difficult to control, allowing
    them to rebel against Moria''s pact which usually immediately submits a shadow to his supremacy and
    orders. Spiritual energy is contained within one''s soul/life; this energy is represented by the fighting
    power or the Haki itself. Those with strong souls, which are homologous to shadows, resist the effects
    of Brook''s soul manipulation) Attack Potency: Large Island level (Drew blood from Perospero with
    a regular punch), can bypass durability to an extent through the heat of Sparkling Valkyrie ([https://youtu.be/hpuR1MMDu0M?t=91
    Impaled] Oven dozens of times, who is immune to his own heat and has the [https://imgur.com/a/i3nfoTu
    toughest body] out of Big Mom''s children) Speed: At least Relativistic+ (Tagged Perospero), likely
    Speed of Light movement and attack with Sparking Valkyrie (Functions similarly to light beams and
    should be capable of moving at such speeds. Given that Ichiji''s younger brother Niji is stated to
    move at light-speed with his Henry Blazer attack, it''s reasonable to suggest he too can move with
    such speed) Lifting Strength: At least Class T (Comparable to his siblings), higher with Raid Suit
    (His raid suit greatly increases his Lifting Strength) Striking Strength: Large Island level Durability:
    Large Island level (Scaling from his AP), higher with Raid Suit Stamina: Superhuman (Fought an entire
    war in four hours and didn''t seem tired in the least. Even after getting mowed down by a hail of
    candy-coated bullets, which could penetrate his normally invulnerable skin, he showed no emotion and
    continued to fight his opponents effectively) Range: Standard Melee Range, Several Meters with shockwaves
    and energy attacks Standard Equipment: Shape Memory Armor Intelligence: Gifted (As a member of the
    Vinsmoke family, Ichiji is an expert assassin and a skilled military commander. A portion of Germa
    66, under Ichiji and Niji''s command, was able to end a two-year war in four hours, thoroughly annihilating
    the side they were hired to fight. In addition to this he is a very capable hand to hand combatant.)
    Weaknesses: None notable Notable attacks/Techniques: *Sparking Red: Ichiji possesses an ability that
    has given him the name "Sparking Red". He can release blasts of potent light energy from his hands
    which pierce through his opponents. He can also unleash this energy when he punches to deal explosive
    blows that are powerful enough to break Charlotte Perospero''s "Candy Wall", and to make the "special
    Paramecia" type Mochi Mochi no Mi user Charlotte Katakuri split in half. **Black Bug: A combination
    attack between Ichiji, Niji, and Yonji. The three utilize their abilities and hit a single target
    with three synchronized strikes. It was first used to break Perospero''s Candy Wall to allow Caesar
    Clown to escape from the Big Mom Pirates. **Sparking Figure: Ichiji punches his target and creates
    a powerful explosion. It was first used against Katakuri when he blocked Caesar''s escape, and it
    was powerful enough to split him in half. **Sparking Valkyrie: Ichiji releases several energy beams
    from his hand in quick succession, which pierce through anyone they strike and can easily hit multiple
    people close together at once. [https://vignette.wikia.nocookie.net/onepiece/images/d/d4/Ichiji_Attacks_Oven.png/revision/latest?cb=20180316054231
    The beam is even strong enough to severely injure Charlotte Oven and cause him to cough up blood].'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
