- id: claim-powers-and-abilities-290f5352
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Master Hand-to-Hand Combatant, Haki
    (Intermediate Kenbunshoku, Initial Busoshoku), Transformation (Ate the Bird Bird
    Fruit: Model Phoenix which enables him to transform into a hybrid man/phoenix
    or completely into a phoenix), Fire Manipulation (Can control blue fire that has
    healing abilities in him and in others, and can also shoot fireballs at people.
    His phoenix flames have "special properties" allowing them to repel regular flames.
    This allowed him to harm Prometheus who''s pure fire; block King''s Fire Bullets
    with his wing and Kaidou''s Bolo Breath with the Undying Thistle), Body Control
    (Turned the wing King cut into a fireball and took control over it. Transformed
    his wing into a barrier), Flight, Immortality (Type 2 in zoan forms. Type 3 via
    phoenix flames), Regeneration (At least Mid, likely Mid-High, as he regenerated
    his head after it was blown to bits by Kizaru, and should likely scale above all
    of the damage in the verse that can be regenerated from), Natural Weaponry, Heat
    Manipulation (Can heat people''s bodies up), Resistance to Animal Manipulation
    (Zoans are immune to Tama''s Kibi Dangos), Extreme Heat (Unfazed by the ambient
    heat let off from Akainu''s magma even in base. Although he did get injured forcing
    him to regenerate, his Undying Thistle still managed to stop Kizaru''s Yasakani
    no Magatama explosions from going any further. Blocked a magma punch from Akainu
    meant to kill Luffy in Hybrid Mode), Madness Manipulation, Mind Manipulation and
    Soul Manipulation via Willpower (Through sheer willpower they can resist losing
    their mind when absorbing shadows through the Kage Kage no Mi. Shadows belonging
    to strong willed people are difficult to control, allowing them to rebel against
    Moria''s pact which usually immediately submits a shadow to his supremacy and
    orders. Spiritual energy is contained within one''s soul/life; this energy is
    represented by the fighting power or the Haki itself. Those with strong souls,
    which are homologous to shadows, resist the effects of Brook''s soul manipulation)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
