- id: claim-weaknesses-e5ca235f
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit users weaknesses. His healing powers have their limits.
    Notable Attacks/Techniques |-|Devil Fruit= right|300px Tori Tori no Mi, Model:
    Phoenix: Marco ate a Devil Fruit referred to as a Mythical Zoan type, which is
    an immensely unique type of Zoan Devil Fruit said to be even rarer than Logia.
    His Devil Fruit enables him to transform into a phoenix. It is because of this
    ability that he is identified as "Marco the Phoenix". Using the power of his Devil
    Fruit, Marco is capable of regenerating from virtually any attack like a phoenix
    being reborn, as well as healing others around him. * Fujiazami (不死薊 Fujiazami,
    literally meaning "Immortal Thistle"): A defensive move that has Marco, in his
    phoenix form, jump in front of someone he wishes to shield from an attack. While
    midair, he forms a protective swirl of fire in front of him, out of his wings,
    in order to block the attack in question. Being Marco''s first-seen technique,
    Fujiazami was used by him (but not named) when protecting Whitebeard from Kizaru
    during the Summit War, warding off the admiral''s Yasakani no Magatama. It was
    named during the battle at Onigashima when Marco used the technique to block King''s
    Andon attack, protecting a bandaged-up Roronoa Zoro. The move''s name is a pun
    on fujiazami (富士薊), the name of the Japanese Fuji thistle. The Viz manga calls
    the technique Undying Thistle. * Hoo-in (鳳凰印 Hōō-in, literally meaning "Fenghuang
    Seal"): While midair, Marco readies his phoenix talons in front of him, then delivers
    an extremely forceful, two-legged kick to a target. This move, when first shown
    by Marco, was strong enough to knock back the Queen Mama Chanter, an enormous
    ship. Later when used against Queen the Plague, the attack dealt a powerful blow
    to the latter''s brachiosaurus neck, making the All-Star cough up blood and question
    if he had been hit by some shockwave. The technique''s name contains the Japanese
    name for the fenghuang (hōō), an immortal bird originating in Chinese mythology
    that is often compared to the Western phoenix, being sometimes called "Chinese
    phoenix" (despite mythological similarities between the two being only superficial).
    The VIZ manga calls this move Phoenix Brand. * Nashi no Tsubute (鳳梨礫 Nashi no
    Tsubute, literally meaning "Pineapple Stone"): Marco transforms his arms into
    phoenix wings and swirls them around, thereby spreading his flames to a potential
    multitude of people, setting them on fire in order to heal them. The technique
    was first seen being used by Marco to counteract the "Ice Oni" virus in numerous
    infected at Skull Dome''s Live Floor, keeping the flames at just the right temperature
    to slow the virus'' effects. However, it is noted that the flames cease to work
    the moment the affected run out of physical stamina. The technique''s name is
    a pun: the kanji include an antiquated Japanese word for pineapple, hōri (鳳梨),
    which plays on Marco''s likeness to said fruit (as mentioned in-story) and in
    itself contains the kanji hō (鳳) for "feng" (a fenghuang''s male aspect); however,
    the furigana indicate the reading Nashi no Tsubute (梨の礫), which is an idiom that
    literally means "tossing the pear", referring to a lack of reply after asking
    something (the "nashi" for "pear" sounds the same as "nashi" for "nothing"). In
    the VIZ manga, the technique is called Phoenix Pyreapple. * Bluebird (青炎雁 Burūbādo,
    literally meaning "Blue-Flamed Goose"): An attack where Marco uses his outstretched
    index and middle fingers to make a dense, flaming swirl of phoenix feathers in
    front of him, remotely shaping it into a large fireball that he, upon uttering
    the attack''s name, launches straight toward an enemy in a thrust-like, concussive
    attack. When first shown performing this technique, Marco used one of his cut-off
    wings as a medium to produce the feathers, and the resulting attack was able to
    send the All-Star King flying back with immense force. The bluebird is a passerine
    bird named for the blue color of its plumage. The attack''s name may also reference
    (given the kanji for "goose") how in Chinese myth, especially per ancient texts,
    the fenghuang is said to bear various animal resemblances, including having the
    breast of a goose. In the VIZ manga, the attack is also called Bluebird. * Ongle
    (鶴爪 Onguru, literally meaning "Crane Claw"): A melee attack similar to Hoo-in,
    where Marco uses a phoenix leg to powerfully kick an opponent, but this time uses
    a single leg, with its four sharp talons doing slashing damage. This kick, when
    first shown by Marco, proved strong enough to send Queen the Plague flying with
    great force, while gashing his face. Ongle is French for "nail". The attack''s
    name may also (given the kanji) play on how the fenghuang is said, per modern
    descriptions, to be the composite of various birds, including having a crane''s
    legs. The VIZ manga calls the attack Crane Talons. |-|Haki= Haki: There are normally
    two types of Haki regular people can tap into: the Kenbunshoku Haki which allows
    individuals t'
