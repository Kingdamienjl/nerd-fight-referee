- id: claim-weaknesses-c0576c38
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit users weaknesses. The main weakness of this Devil Fruit power is that it
    cannot create gold and that its power is thus directly proportional to the amount of gold present
    in its user''s surroundings. Furthermore, the user can only manipulate gold that they have previously
    touched, and contact with sea water will instantly nullify that effect: gold constructs will crack
    and crumble, and the user will need to touch the gold once more before being able to manipulate it
    again'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
