- id: claim-weaknesses-04285dd9
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit users weaknesses. He leaves his body defenseless when he uses his astral
    projection. Notable Attacks/Techniques: Yomi Yomi no Mi (Revive-Revive Fruit or Underworld-Underworld
    Fruit): A Paramecia type Devil Fruit which enhances the user''s soul to the point where they can come
    back to life after dying once, remain alive until their body is sufficiently damaged, and to use several
    other soul-based abilities. The power that allows him to live in the human world is not organs nor
    muscles: it is his soul. *Astral Projection: A new ability Brook demonstrated after the time skip.
    Brook is able to separate his body and soul, and move his soul everywhere he wants to, even through
    walls. When Brook is in Spectral form he both visible and audible to people. It is currently unknown
    as to how far the extent can Brook maintain this separation of his soul from his body. *Soul Energy:
    After two years of training, Brook has mastered the use of this Devil Fruit to the extent of knowing
    its true nature. He reveals that in order for his soul to remain here in this world, it produces a
    unique and powerful energy that is almost physical in form. He has also mastered the energy his soul
    emits to the extent that he can reattach his bones by using this energy such as when he is beheaded
    he then attaches his head back with the help of it. *Chills of the Underworld: Through his soul, Brook
    is able to summon the very cold of the underworld, which he utilizes in conjunction with his sword,
    Soul Solid, to generate freezing attacks. Music: Brook''s devotion to music not only helped him to
    pass the lonely days during his long isolation but also serves as a combat tool. *Nemuriuta Flanc
    (Lullaby Parry): Brook swipes his weapon over his violin like a fiddle and plays a soothing melody
    which makes his opponents fall asleep. *Party Music: Brook uses his music to hypnotize his opponents
    into believing they are at a night festival. This way, his opponents not only drop their guards, but
    they are also made vulnerable to suggestions. Fencing Style: Brook uses an unnamed form of swordsmanship
    that resembles classical fencing. It specializes in speed and thrusting techniques. *Hanauta Sancho:
    Yahazu Giri (Three-Verse Humming: Arrow-Notch Slash): A high-speed technique where Brook swiftly cuts
    his opponent(s) as he approaches them and then re-sheats his blade. *Requiem la Banderole: Performed
    much the same as Yahazu Giri, except Brook executes a lateral slash against the opponent''s chest.
    *Aubade Coup Droit (Dawn Serenade: Right-Handed Strike): A ranged thrusting technique that creates
    a highly compressed blast of air. *Prelude: Au Fer (Prelude: After): A technique intended to disarm
    the opponent by destroying whatever weapon they might be wielding at close range. *Gavotte Bond en
    Avant (Gavotte: Leap Forward): A thrusting technique in which the user propels himself forward in
    order to strike an opponent. *Swallow Bond en Avant (Swallow Leap Forward): An aerial version of Gavotte
    Bond en Avant. *Polka Remise (Polka Continuation): A combination technique in which the user delivers
    several consecutive thrusts against the opponent. *Quinte Tierce Fantasia (Fifth Parry and Third Parry
    Fantasy): Typically used in conjunction with Party Music, Brook uses a swift draw-and-sheathing technique
    while his opponents are still under the influence of the hypnotic nature of the musical technique.
    *Kasuriuta: Fubuki Giri (Pastoral Song: Blizzard Slash): Combining Hanauta Sancho: Yahazu Giri and
    his Devil Fruit ability, Brook does the same thing Yahazu Giri does but he sheaths his sword from
    top to bottom and the streak mark he creates with his "chilled" sword freezes the opponent''s blood.
    thumb|center|400px|Kasuriuta: Fubuki Giri (Pastoral Song: Blizzard Slash) *Winds of Hades: Brook uses
    his Soul Solid in conjunction with his Devil Fruit ability to fire freezing winds at his opponent.
    ==Gallery== One Piece Soul King Brook New World English Dub Brook Post TS.png Brook by_bodskih-dbcd5jq.png
    Brook by bodskih-dbcd52t.png|Brook when he was human ==Notable Matchups== Victories: Madara Uchiha
    (Naruto) Madara''s Profile (Alive Madara and Onigashima Raid Brook were used, speed was equal, Sunano''o
    was restricted, battle location was Konoha 20 meters apart from each other) Charlotte Perospero (One
    Piece) Perospero''s Profile (Battle was in Minecraft''s infinite Superflat world) Ulti (One Piece)
    Ulti''s Profile (Battle was in Minecraft''s infinite Superflat world) Losses: Vivica (Miraculous:
    Tales of Ladybug & Cat Noir) Vivica''s profile (Pre-Timeskip Brook and Desperada were used. Speed
    was equalized) Inconclusive: Sans (Undertale) Sans'' Profile (Post-Timeskip Brook was used, and speed
    was equalized) ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters
    Category:One Piece Category:Adults Category:Air Users Category:Anime Characters Category:Astral Projection
    Users Category:Blade Users Category:Body Control Users Category:Broadw'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-8f45f2ce
  section: abilities
  axis: hax
  text: 'Pre-Timeskip= Superhuman Physical Characteristics, Adept Swordsman (Specializes in fencing),
    Water Walking, Immortality (Types 2 and 7; Unaffected by having his head and other body parts detached),
    Soul Manipulation and Resurrection (Ate the Yomi Yomi no Mi, a Paramecia type Devil Fruit which allows
    the user to come back to life and allows the user to access other soul-based abilities), Inorganic
    Physiology (Type 1), Sleep Manipulation (Via Nemuriuta: Flanc), limited Regeneration (Mid-Low; Can
    regenerate wounds such as large cracks on his skull by drinking milk), Statistics Amplification (Speed;
    can enhance his speed to the point where he can blitz those who can normally keep up with him via
    Yahazu Giri and similar moves), Possibly Empathic Manipulation when playing music (Uses music to inspire
    cultists to fight for themselves), Immunity to Water Absorption (Due to being a skeleton), Resistance
    to Electricity Manipulation (Due to not having flesh. He also covered himself in lightning to attack
    Oars without showing major damage) and Extreme Temperatures (Was unbothered by the cold side of Punk
    Hazard even in his normal attire and survived getting caught in a Pacifista laser explosion although
    was badly injured) |-|Post-Timeskip= Same as before, Astral Projection (Can separate his soul to move
    individually of his body), Body Control (Can reattach his head and other body parts), Ice Manipulation
    (Able to freeze objects and people by channeling the power of his soul through his sword [Soul Solid,
    the "Freezing Sword"]), Non-Physical Interaction (Capable of affecting and damaging Big Mom homies
    such as Zeus and Prometheus), Spiritual Awareness, Large Size (Type 0; is approximately 2.77 m), Air
    Manipulation (Can generate wind blades with sword slashes and thrusts, can also use this in conjunction
    with his freezing ability), Durability Negation (Can freeze the blood flow of opponents, affecting
    them internally. Can hit the soul), Broadway Force, Mind Manipulation when playing music (Able to
    hypnotize people with music: forcing them to sleep, create illusions in their minds, etc.), Resistance
    to Madness Manipulation, Mind Manipulation and Soul Manipulation via Willpower (Through sheer willpower
    they can resist losing their mind when absorbing shadows through the Kage Kage no Mi. Shadows belonging
    to strong willed people are difficult to control, allowing them to rebel against Moria''s pact which
    usually immediately submits a shadow to his supremacy and orders. Spiritual energy is contained within
    one''s soul/life; this energy is represented by the fighting power or the Haki itself. Those with
    strong souls, which are homologous to shadows, resist the effects of his own soul manipulation)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
