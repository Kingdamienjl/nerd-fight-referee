- id: claim-powers-and-abilities-bcaf6d08
  section: abilities
  axis: hax
  text: Alabasta Saga= Superhuman Physical Characteristics, Genius Intelligence, Small
    Size (Type 0 normally; roughly 90 cm tall), Transformation (Can transform into
    various human/reindeer hybrid forms and a humanoid form), Enhanced Senses, Limited
    Information Analysis (Brain Point allows him to identify any possible weaknesses
    his target has, allowing him to effectively capitalize on them), Can speak with
    other animals, Natural Weaponry, Statistics Amplification (His Devil Fruit increases
    his physical abilities, and he can further enhance his stats with various transformations),
    Enhanced Jumping (Can jump and leap to incredible lengths with Jumping Point),
    Skilled Doctor (Skilled enough to nurse a heavily injured Zoro back to health
    despite him having injuries that would kill any other man), High Resistance to
    Cold Temperatures, Resistance to Animal Manipulation (Zoans are immune to Tama's
    Kibi Dangos) |-|Skypiea Arc= Same as before, Minor Adaptation (Adapted to the
    oxygen shortage) |-|Enies Lobby Arc to Thriller Bark Arc= Same as before, Berserk
    Mode (With Monster Point), Large Size (Type 0, via Monster Point) |-|Dressrosa
    Saga to Wano Country Saga= Same as before except for Berserk Mode, Skilled Martial
    Artist (Kung Fu Point enables him to become significantly more adept and skilled
    in martial arts), Underground Mobility with Horn Point, Resistance to Madness
    Manipulation, Mind Manipulation and Soul Manipulation via Willpower (Through sheer
    willpower they can resist losing their mind when absorbing shadows through the
    Kage Kage no Mi. Shadows belonging to strong willed people are difficult to control,
    allowing them to rebel against Moria's pact which usually immediately submits
    a shadow to his supremacy and orders; Also after the Timeskip he dominated the
    Monster Point, which in the past had made Chopper mentally insane and out of control.
    Spiritual energy is contained within one's soul/life; this energy is represented
    by the fighting power or the Haki itself. Those with strong souls, which are homologous
    to shadows, resist the effects of Brook's soul manipulation)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
