- id: claim-weaknesses-06edb27a
  section: weaknesses
  axis: weakness
  text: 'Mihawk only uses as much power as he deems necessary, and will thus not go
    all out if his opponent does not impress him. Notable Attacks/Techniques: Haki:
    There are normally two types of Haki regular people can tap into: the Kenbunshoku
    Haki which allows individuals to sense the presence of others, and Busōshoku Haki
    which allows individuals to create an invisible armor around them. There is however
    a third type of Haki, Haōshoku Haki, that only a few individuals can use. It is
    unknown if Mihawk is one of these people. *Kenbunshoku Haki (Color of Observation
    or Mantra): Mihawk''s full level of application with this type of Haki is unknown,
    but he should be at least proficient as he was the one who directly taught Roronoa
    Zoro and brought him to that level, he''s capable of sensing the presence of a
    single desired target across a battlefield and being able to predict attacks from
    his opponents. *Busōshoku Haki (Color of Armaments): Mihawk''s application with
    this type of haki is advanced, having taught Roronoa Zoro how to utilize it, and
    showing vast knowledge on its application. He''s extremely proficient with Goken
    allowing his sword to cut through the thickest steel when he wishes and at the
    same time for it not the cut the thinnest of paper. He is capable of creating
    Black Blade''s that cannot be damaged, granting any sword unparalleled hardness
    and has shown the aptitude to permanently alter them to this state. Black Blade
    Arc Moon: (Kokuto Kogetsu) Mihawk''s swings are able to generate compressed air
    blades that slice apart the landscape even if the target dodges, throwing them
    off balance. Black Blade First Day: (Kokuto Saku) Mihawk lures his opponent in
    by holding Yoru with two hands behind his back. Should his opponent approach,
    he meets their attack with a downward slash in hopes of cutting their arms off.
    Black Blade One Flash: (Kokuto Issen) Mihawk swings Yoru once, cleaving apart
    everything in its path. This technique is powerful enough to cleave apart Aokiji''s
    iceberg by accident after missing Luffy. Black Blade Savage Star: (Kokuto Arahoshi)
    Mihawk leaps into the air while gripping his sword in a downward position, descending
    to impale his target with great force. Earth-Crawling Slash'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
