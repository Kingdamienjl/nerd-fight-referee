  attack_potency:
    text: Large Mountain level (Can overpower the likes of Fukurou with his physical
      might. While weakened, he matched Fukurou. When revitalized he broke through
      his Tekkai. Together with Usopp, he created a combined attack that harmed Oars.
      Could injure Oars alongside Chopper, although it was aimed at a weak point in
      the jaw1.87 Gigatons), higher with Coup de Vent (Knocked out Fukurou. Knocked
      Monster Point Chopper into the Water. Could send a Pacifista flying) | Island
      level (Could fight against Senor Pink, who can hurt him), higher with Franky
      Shogun (Stronger than his base. Easily overwhelmed Baby 5 and Buffalo with his
      Shogun and could dispatch them with minimal effort), the Radical Beam can bypass
      durability to an extend (Fried Ikaros who took a punch from Franky Shogun. Blew
      up a shock-absorbing door that could block Sanji's kicks) | At least Island
      level (Implied to be superior to the likes of Usopp and Nami, as he fought in
      the fort while they were hidingOne Piece Vol. 97 Chapter 977), Country level
      with General Franky (Stopped Full Zoan Sasaki's charge and slammed him into
      a wall, then drew blood from him with a kick, and scarred his chest with a Shori
      no V-FlashOne Piece Vol. 99 Chapter 1004. Fought him off screen for a long period
      of time), far higher with General Cannon (Badly injured Hybrid Form Sasaki and
      sent him flyingOne Piece Vol. 101 Chapter 1019), the Radical Beam can bypass
      durability to an extent (When aiming at Big Mom, she was forced to shield herself
      with a Homie. One-shot a Number. Knocked out Hybrid Sasaki, who he complimented
      for his toughness) | Moon level (Oneshot Vice Admiral Red King and broke his
      steam-powered arm with Strong RightOne Piece Vol. 110 Chapter 1112. Was noted
      by Borsalino to have grown strongerOne Piece Vol. 109 Chapter 1104. Alongside
      Bonney, Luffy, and Sanji sent St. Marcus Mars flying past the horizonOne Piece
      Vol. 110 Chapter 1119188.362 Exatons), can bypass durability to an extent through
      the sheer heat of their lasers with Franky Radical Beam (Would have dealt significant
      damage to S-Shark if his beam landedOne Piece Vol. 105 Chapter 1065.Damaged
      St. Jaygarcia Saturn3.014 Zettatons)
    source_ids:
