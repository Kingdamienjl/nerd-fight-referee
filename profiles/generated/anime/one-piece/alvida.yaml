- id: claim-weaknesses-9cdbf640
  section: weaknesses
  axis: weakness
  text: "Standard Devil Fruit users weaknesses Notable Attacks and Techniques Sube Sube no Mi (Smooth-Smooth\
    \ Fruit): Paremecia Devil-Fruit. Alvida's main usage of this fruit's power is to allow attacks to\
    \ slip off her, rendering her untouchable and immune to conventional damage. She can also use the\
    \ slipperiness to reduce friction, allowing her to slide at considerable speed, given the right boost.\
    \ *Sube Sube Spur (\u30B9\u30D9\u30B9\u30D9\u30B7\u30E5\u30D7\u30FC\u30EB Sube Sube Shup\u016Bru?,\
    \ literally meaning \"Smooth Smooth Track\"): Alvida is able to slide down from an incline with her\
    \ and slides along the ground at about the same speed as Buggy's Bara Bara Car."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
