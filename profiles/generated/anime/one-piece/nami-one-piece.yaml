- id: claim-weaknesses-eb0bac6b
  section: weaknesses
  axis: weakness
  text: 'She cannot control the trajectory of her lightning, potentially hurting allies
    and foes at the same time. | None notable. Notable Attacks/Techniques |-|Clima-Tact=Each
    piece of the Clima-Tact has a button and is capable of creating a bubble of air
    each with its own different properties. When the pieces are combined together
    in certain combinations and activated by a button located on a piece connected
    within the combination, they produce a variety of different results. Some of these
    results are useful in a combat situation, however some are best left to interpretation.
    Basics *Heat Ball: Produced from the "Heat Pole" when air is blown into the end
    of it, the Heat Ball is a red bubble of heated air that comes out of the other
    end of the pole and drifts along in the air. It heats up the temperature of the
    area surrounding it. *Cool Ball: Produced from the "Cool Pole" when air is blown
    into the end of it, the Cool Ball is a blue bubble of cold air that comes out
    of the other end of the pole and drifts along in the air. It cools down the temperature
    of the area surrounding it. *Thunder Ball: Produced from the "Electric Pole" when
    air is blown into the end of it, the Thunder Ball is a yellow bubble of electrified
    air that comes out of the other end of the pole and drifts along in the air. It
    electrifies the air of the area surrounding it. Battle Uses *Cyclone Tempo: Nami
    puts the "Heat Pole" and "Cool Pole" together like an X on the top of the "Electric
    Pole". She swings it like a bat, and the X detaches from the "Electric Pole" spinning
    towards her opponent. When the X hits, the hot and cold airs collide and create
    a massive wind that''ll blow her opponent away. The the X will return to Nami
    like a boomerang. *Mirage Tempo: Nami use the "Cool Ball" in a dry and hot environment
    to change the air density and create a mirage of herself. The extreme difference
    in temperature causes major light refraction, allowing Nami to disappear and create
    an illusory copy of herself. *Thunderbolt Tempo: Nami first uses "Rain Tempo"
    and "Sprinkler" to moisten the air. She then uses "Cool Ball" to make the air
    cooler. Afterwards, she uses "Heat Ball" to suck up the moisture. The heated air
    then rises and collides with the cold air. The air then condenses and creates
    a cloud. Nami then continues to enlarge the cloud by producing more "Heat Balls"
    and "Cool Balls." Finally, she uses a "Thunder Ball" to electrify the cloud. Soon
    after, a powerful lightning bolt strikes her opponent. *Tornado Tempo: The only
    function that Usopp apparently installed in the Clima-Tact to be used in battle
    and not devised by Nami. He explains that this attack can only be used once and
    should be used only when the situation calls for it. Nami first combines the three
    pieces together into a T. In a bright flash from each end, two clockwork doves
    burst out and ensnare her opponent. The T then starts to spin rapidly until it
    finally shoots the captured enemy with extreme centrifugal force. After that,
    the doves become unusable and the function cannot be used again unless they are
    reinstalled. *Fog Tempo: By creating a "Cool Ball" and using it against a fire
    user, a massive fog is created due to the water vapor in the air increasing in
    density from the rapidly heating cold air. The fog is used to blind the opponent
    so that Nami can easily land an attack on them. |-|Perfect Clima-Tact= The upgraded
    form of the Clima-Tact. On each piece, there is now a ball containing what can
    be assumed to be a Dial. All of its offensive uses are basically several times
    stronger than they were before and there is now next to no indication of it having
    any useless functions to hinder Nami down. Perfect Clima-Tact Battle Uses All
    moves Nami could previously use with the first Clima-Tact are upgraded with the
    Perfect Clima-Tact. *Thunderbolt Tempo: With the Perfect Clima-Tact, the lightning
    created is now larger and strikes multiple times. Unfortunately due to its increased
    range and power, the lightning strikes everything and everyone within its attack
    zone. *Thunder Charge: Nami creates a "Thunder Ball" on the ball end of a piece.
    With the "Thunder Ball" on the tip, she can then perform "Swing Arm". *Swing Arm:
    After charging the piece with electricity with Thunder Charge, Nami twirls the
    piece on its connecting socket with the rest ofstaff. After several spins, she
    swings the electrified piece at the enemy for a powerful electric attack. *Cool
    Charge: Nami creates a "Cool Ball" on the ball end of a piece. With the "Cool
    Ball" on the tip, she can then perform an upgraded version of "Mirage Tempo".
    **Mirage Tempo: Nami is still able to create mirages to distract opponents, however,
    with the Perfect Clima-Tact, she is able to do more. Using the "Cool Ball" located
    on the staff, created by "Cool Charge", she is able to cloak herself in a blanket
    of air to make herself invisible. ***Mirage Tempo: Fata Morgana: An further upgraded
    version of the "Mirage Tempo" technique that creates'
  source_ids: *id003
  decisive: false
