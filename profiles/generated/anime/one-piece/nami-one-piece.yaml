- id: claim-powers-and-abilities-2c7ce89f
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Enhanced Senses (Can sense changes in
    the weather), Genius Intelligence, High Staff Proficiency, Stealth Mastery, Acrobatics,
    Technomagic (via Clima-Tact), Weather Manipulation, Illusion Creation (She can
    spawn mirages of herself), Air Manipulation, Water Manipulation (Can create rain
    and fog), Electricity Manipulation (Can create lightning bolts), Heat Manipulation
    (Can create hot air), Cold Manipulation (Can create cool air), Social Influencing
    (Tricked several pirates into giving away their shipOne Piece Chapter 8. Used
    seduction to make Johnny and Yosaku let their guard downOne Piece Chapter 50,
    and tricked Sanji into giving her a free drinkOne Piece Chapter 46. Extorted Igaram
    and ZoroOne Piece Chapter 110One Piece Chapter 111. Negotiated with Kureha, and
    got her to waive her fee and discharge her earlyOne Piece Chapter 152. Sanji could
    not kick Mr.2 when he shape-shifted into Nami''s form despite knowing it wasn''t
    actually herOne Piece Chapter 188 and previously having been able to kick Mr.2
    when he was transformed into UsoppOne Piece Chapter 187. Nami could calm down
    Lola and even made her fight on her sideOne Piece Chapter 454. Made people she
    had just stolen from forgive herOne Piece Chapter 596), possibly Empathic Manipulation
    via Happiness Punch (Via Happiness Punch, Nami can knock out anyone who looks
    at herOne Piece Chapter 213 by causing a nosebleed, which even works on other
    womenOne Piece Chapter 936) | Same as before, Vehicular Mastery, Minor Adaptation
    (Adapted to the oxygen shortage) | Same as before, Stronger Weather Manipulation,
    Invisibility (via Mirage Tempo) | Same as before, Barrier Creation (Can create
    barriers out of sea clouds), Cloud Manipulation (Can use sea clouds to attack
    enemies and create roads capable of supporting a boat), Chain Manipulation and
    Intangibility (via Black Ball: Raiun Rod), Homing Attack, Snow Manipulation (via
    Snow Cloud) | All previous abilities, stronger Weather Manipulation, Limited Size
    Manipulation (Applies only to her upgraded Sorcery Clima Tact), Elemental Intangibility
    and Lightning Absorption (Applies only to Zeus), Flight (via riding on top of
    Zeus), Statistics Amplification (Can make Zeus stronger with her Clima-Tact),
    Homing Attacks (Zeus followed Ulti until he hit her), Statistics Enhancement (Via
    absorption of souls), Spiritual Possession (Zeus took over Nami''s Clima-Tact
    after leaving his lighting form), Immortality for Zeus (Type 3, 5, and 6), Immunity
    to Biologic Manipulation (No biology to manipulate), Resistance to Electricity
    (The Climatact doesn''t conduct the electricity of its lighting attacks back at
    Nami nor from Wanda''s Electro), Madness Manipulation, Mind Manipulation and Soul
    Manipulation via Willpower (Through sheer willpower they can resist losing their
    mind when absorbing shadows through the Kage Kage no Mi. Shadows belonging to
    strong willed people are difficult to control, allowing them to rebel against
    Moria''s pact which usually immediately submits a shadow to his supremacy and
    orders. Spiritual energy is contained within one''s soul/life; this energy is
    represented by the fighting power or the Haki itself. Those with strong souls,
    which are homologous to shadows, resist the effects of Brook''s soul manipulation)'
  source_ids: *id003
  decisive: true
