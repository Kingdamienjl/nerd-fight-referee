  attack_potency:
    text: 'Moon level (Defeated all of the Scabbards with ease.One Piece Vol. 99 Chapter
      996 Matched a furious Oden blow for blow 25 years ago when he was younger and
      weakerOne Piece Vol. 96 Chapter 971188.362 Exatons), up to Small Planet level
      with Conqueror''s Haki Infusion at full power (Clashed and split the skies with
      Big Mom for several daysOne Piece Vol. 94 Chapter 9523.014 Zettatons), Moon
      level in Zoan Forms (His Vivre Card states that his already high physical abilities
      get improved even further in his Hybrid Form.One Piece Vivre Card Databook #0944
      He was stated to be one of the few people that can stop Blackbeard,One Piece
      Vol. 60 Chapter 594 implying he would be able to clash with the Tremor-Tremor
      Fruit, the strongest Paramecia Devil Fruit. His presence kept Admiral Ryokugyu
      away from Wano.One Piece Vol. 104 Chapter 1055 Was called a dreaded monster
      by BlackbeardOne Piece Vol. 92 Chapter 925 and Big Mom.One Piece Vol. 87 Chapter
      871 With just one blow in Hybrid Mode, he injured Law in spite of him using
      CurtainOne Piece Vol. 100 Chapter 1010188.362 Exatons), up to Small Planet level
      with Conqueror''s Haki Infusion at full power (Completely incapacitated Luffy
      with Conqueror of Three Worlds Ragnaraku.One Piece Vol. 100 Chapter 1009 Badly
      hurt Law and Zoro with Thunder Bagua. Defeated a post- Haki bloom Luffy with
      Gears.One Piece Vol. 100 Chapter 1013 The full output of his Conqueror''s Haki
      far surpasses that of YamatoOne Piece Vol. 102 Chapter 1026One Piece Vol. 102
      Chapter 1027 and Rooftop Luffy.One Piece Vol. 100 Chapter 1014 Continuously
      clashed with Gear 2nd + Gear 3rd Luffy by the End of the Onigashima Raid.One
      Piece Vol. 103 Chapter 1036 His Haki was stated to be getting stronger midway
      through his battle with Luffy.One Piece Vol. 103 Chapter 1037 His Kundali Dragon
      Swarm matched Luffy''s Roc Gatling. Grew in strength to overpower Gear 4th:
      Snakeman.One Piece Vol. 103 Chapter 1042 At the peak of his Drunk state, he
      became able to go blow for blow against Gear 5th Luffy using Conqueror''s Haki
      Infusion.One Piece Vol. 103 Chapter 1046 Fought with Shanks prior to MarinefordOne
      Piece Vol. 55 Chapter 533One Piece Vol. 59 Chapter 58024.112 Zettatons), Planet
      level with Bulked Form (Killed Gear 4th: Boundman Luffy with Thunder Bellow
      Bagua, matching his Over Kong Gun.One Piece Vol. 103 Chapter 1043 Harmed Gear
      5th Luffy through his double Armament Haki defense and sent him flying into
      the cloudsOne Piece Vol. 104 Chapter 104759.44 Zettatons), far higher with Flame
      Dragon Torch (Matched Gear 5th Luffy''s Gum-Gum Bajrang Gun with his Rising
      Dragon: Flame Bagua for a long period of time prior to its decompressionOne
      Piece Vol. 104 Chapter 1048-1049)'
