    notes: auto_repair source extraction
  intelligence:
    text: Genius (Nico Robin is extremely intelligent with extensive knowledge of
      the world, especially in regard to historical matter, remarkably insightful
      and very experienced in the use of her Devil Fruit ability. A child prodigy,
      she passed her archaeological exams to become a certified scholar at the young
      age of 8, and also taught herself to read the ancient texts on the poneglyphs.
      She learned these skills on her own by researching in the library of Ohara,
      done without any help from Professor Clover or the rest of her adult colleagues.
      As the Vice President of Baroque Works, her intellect along with her leadership
      had been 'invaluable' to the organization, according to Crocodile himself. Due
      to living most of her life on the run from the Marines and the World Government,
      she is a skilled and battle-hardened combatant, being able to hold her own against
      opponents that are faster and stronger than she is)
    source_ids:
    - mediawiki-nico-robin-one-piece
    confidence: 0.6
