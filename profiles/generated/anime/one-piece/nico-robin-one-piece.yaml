  stamina:
    text: Superhuman (Has handled many armed soldiers with her hands with no showings
      of fatigue and was stabbed by Crocodile and survived. Fought Yama and took several
      attacks from his Axe Dials in order to protect Skypiea's ruins. After repeatedly
      beaten by Spandam while trapped in seastone handcuffs (which included his elephant
      sword Funkfreed in its animal form driving her hard enough into a wall to leave
      a crater), once freed she went on to beat him up and help fight off over 200
      marine officers. She was stabbed in the shoulder with a giant ice pick by Monet
      and showed no signs of being hurt throughout the rest of the arc. Protected
      Rebecca from Diamante's Death Enjambre while being severely injured in the process)
    source_ids:
