- id: claim-powers-and-abilities-9a25d362
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Genius Intelligence, Master in Bōjutsu
    (The Art of Using a Staff), Acrobatics, Electricity Manipulation (Ate the Goro
    Goro no Mi), Limited Light Manipulation (via Lightning Flash), Paralysis Inducement,
    Electrical Aura, Elemental Intangibility, Inorganic Physiology (Type 1. While
    he''s turned into electricity), Flight (Via Logia Dispersion), Fusionism (Can
    merge with solid matter,One Piece Vol. 30 Chapter 280 like gold or wood for defense
    or traveling purposes), Weather Manipulation, Regeneration (High; only in logia
    form), Haki (Intermediate Kenbunshoku; With the Goro Goro no Mi in conjunction
    with Haki, Enel can pick up electromagnetic waves, allowing him to overhear conversations
    and everything around him: this has extended the range of his Mantra to cover
    roughly all of Skypiea), Metal Manipulation and Heat Manipulation (Can use the
    heat of electricity to melt and shape metals in weapons format.One Piece Vol.
    30 Chapter 280 Able to instantly turn a fence to ash with his heated up spearOne
    Piece Vol. 30 Chapter 281), Transformation (Via Amaru), Body Control (Can reanimate
    his heart and control internal organs due to cardiac and electromagnetic waves
    from his brainOne Piece Vol. 29 Chapter 275), Self-Sustenance (Type 1; Can survive
    in the vacuum of spaceOne Piece Cover Story Chapter 428-474, "Enel''s Great Space
    Flight"), Spaceflight (With his Ark Maxim), Resistance to Electricity Manipulation
    (All Logias are resistant to their respective elements), Heat Manipulation (Unaffected
    by the heatOne Piece Vol. 30 Chapter 280 he produces to shape the gold), Radiation
    Manipulation (Is Unaffected by the radiation in spaceOne Piece Cover Story Chapters
    428-474, "Enel''s Great Space Operations")'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
