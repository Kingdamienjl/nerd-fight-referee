- id: claim-weaknesses-1ff7b601
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit users weaknesses, the Gomu Gomu no Mi (Rubber) can nullify
    his Logia Dispersion without Haki, his lightning-based attacks are ineffective
    on rubber. Loss of composure nullifies his Observation Haki. Notable Attacks/Techniques:
    |-|Haki= Haki: There are normally two types of Haki regular people can tap into:
    the Kenbunshoku Haki which allows individuals to sense the presence of others,
    and Busōshoku Haki which allows individuals to create an invisible armor around
    them. However, Enel only has demonstrated one: *Kenbunshoku Haki (Color of Observation
    or Mantra): Enel is a practiced hand with Kenbunshoku Haki. He is capable of using
    it in conjunction with his devil fruit power to make sonic waves akin to that
    of a radar to detect everything within his range, with no need to focus on a single
    target. He is capable of spreading his field of vision over the entire region
    of Skypeia, easily tens of kilometers, and he is capable of sensing the intentions
    and emotions of his opponents with some focus. He has not shown the ability to
    see into the future in any sense, and as such he is susceptible to attacks and
    evasions that are made without the intention of harming him. For example, he cannot
    predict an attack that ricochets from its initial target and bounces toward him.
    |-|Goro Goro no Mi (Rumble-Rumble Fruit)= The Goro Goro no Mi is a Logia-type
    Devil Fruit that allows the user to create, control, and transform into electricity
    at will, making the user a Lightning Human (Kaminari Ningen). It was eaten by
    Enel. It was mentioned by Nico Robin to be one of the fruits with the reputation
    of being ''invincible''. He is also able to regulate the voltage of his electricity,
    with a maximum of 200 million volts. center|300px *1, 5 Million, 10, 20, 30, 50,
    60 Million, 100, Max 200 Million Volt Vari (Electrical Discharge): Enel releases
    various levels of his electric energy, eventually becoming a living body of lightning.
    The maximum-power attack, 200 Million Volts, is about the same voltage as a usual
    bolt of lightning. *Sango (Lightning): Enel unleashes a massive charge of electricity
    from his hand that forms a wide blast used to devastate large areas with no specific
    target in mind. *El Thor (Judgment of God): Mostly used to destroy targets from
    long range, Enel focuses a large cluster of electricity above his target, then
    uses it to send a huge and powerful lightning bolt crashing down from the sky,
    frying the unlucky target. He can also use this attack to launch a massive thunder
    stream from his hand. Named after Thor, the Norse God of Thunder.center|300px
    *Kari (Electric Light): Enel heats the air around him with his Goro Goro no Mi
    powers until it explodes in a thunderclap. This is used to avoid and neutralize
    non-material attacks. *Lightning Flash: Enel can use his electrical powers to
    generate light bright enough to blind opponents. *30,000,000 Volt Hino (Thunder
    Bird): Enel creates a giant hawk shaped blast of lightning that he shoots from
    one of the drums on his back. center|300px *30.000.000 vol Kiten (Lightning Beast):
    Enel creates a giant wolf-shaped blast of lightning. *60,000,000 Volt Julungul
    (Lightning Dragon): With his golden staff, Enel taps the top two drums he wears
    on his back. A giant dragon shaped blast of lightning emerges from the two drums
    much stronger than the Hino or Kiten attacks. *Gloam Paddling (Thunder Metallurgy):
    Enel uses his electrical powers to heat and melt nearby metal and then reshape
    it into anything he desires. During his battle with Luffy he used this technique
    to change his gold staff into a trident. *200,000,000 Volt Amaru (Thunder God):
    Enel transforms into a gigantic Raijin looking thunder god made of pure electricity.
    He can fire giant lightning blasts from his hands and is supposedly at his strongest.
    center|300px |-|With Arc Maxim= *Raigo (Thunder Greeting or Advent of Thunder):
    Enel''s most powerful attack. He combines his own electric powers with the Ark
    Maxim to create a huge spherical cloud filled with electricity. The ball has enough
    power to destroy an entire island. center|300px *Deathpiea: A thunderstorm is
    created by Enel''s powers combined with the Ark Maxim. Using these storm clouds,
    Enel can rain lightning down on the land below him. *Mamaragan (Heavy Thunder):
    The thunderstorm created by Deathpiea showers lightning everywhere. The lightning
    bolts are much larger and more powerful than normal lightning bolts and one is
    enough to burn down an entire village. center|300px ==Gallery== Enel god of skypiea
    by bodskih-dbcd4pf.png ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    {{Scroll box|content={{Reflist|2}}}} ==Notes and Explanations== {{Scroll box|content=}}
    {{Discussions}} Category:Characters Category:One Piece Category:Male Characters
    Category:Antagonists Category:Primary Antagonists Category:Electricity Users Category:Chi
    Users Category:Manga Characters Category:Anime Characters Category:Sailors Category:Intangibility
    Use'
  source_ids: *id003
