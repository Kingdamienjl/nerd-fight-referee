  attack_potency:
    text: 'Small Planet level (Was brought to Egghead Island as St. Jaygarcia''s protection
      despite Cipher Pol being presentOne Piece Vol. 107 Chapter 1078, meaning he
      should be at least on the level of the Gorosei and above Rob Lucci. Harmed Sanji
      through his Exoskeleton. Was a match for Gear 5 LuffyOne Piece Vivre Card Databook
      #0001, being able to clash with him for an extended period of timeOne Piece
      Vol. 108 Chapter 1094. Rob Lucci believed that he could kill the Straw Hat Crew
      with Borsalino''s help despite having witnessed Luffy''s power firsthandOne
      Piece Vol. 106 Chapter 1076. Borsalino''s light clones can harm Gear 5 Luffy
      and pressure him into retreating momentarily3.014 Zettatons), higher with Acceleration
      (Knocked Luffy out of his Snakeman form with just a single hit. Can similarly
      increase the power and speed of lasers by charging them, which allowed him to
      deal significant damage to Gear 5 Luffy), Can ignore conventional durability
      with Heat (Capable of punching holes through Whitebeard using his light beams)'
    source_ids:
