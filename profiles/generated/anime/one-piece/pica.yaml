- id: claim-weaknesses-a524f286
  section: weaknesses
  axis: weakness
  text: "Standard Devil Fruit weaknesses. Pica is weak minded when people laughs about his voice and tends\
    \ to lose control starting a rampage. His powers relies on the amount of stone the environment has.\
    \ Notable Attacks/Techniques Ishi Ishi no Mi (Stone-Stone Fruit): A Paramecia-type Devil Fruit. The\
    \ Devil Fruit's primary ability is the power to merge and assimilate with any form of stone. This\
    \ allows the user to take control of anything made of stone that they come in contact with. While\
    \ under the user's control, the stone gains a surprising level of flexibility and dexterity it otherwise\
    \ would not have, as seen by Pica's ability to stretch and reshape in a surprising manner of ways.\
    \ In Pica's case, he can control the Dressrosa castle as if it were his own body, as it is entirely\
    \ made of stone. It appears that the strength of this particular fruit is directly proportional to\
    \ the amount of stone in the user's environment. Because of this, at sufficient amounts, the user\
    \ can withstand having pieces of their body destroyed to no end. *: After assimilating with a large\
    \ mass of stone, Pica produces tentacles out of the stone and directs them towards the target in an\
    \ attempt to crush them. Pulpo is the Spanish word for \"octopus\". *: After assimilating a vast stone\
    \ area, Pica makes a multitude of giant stone spikes erupt from it. *: Pica creates two horizontal\
    \ pillars of stone with spikes on the end that he slams together around an opponent, crushing and\
    \ stabbing them. *: Pica creates a replica of his head out of stone and uses it to bite an opponent.\
    \ Haki (Ambition): A mysterious power which originates from an individual's spirit. Haki is separated\
    \ into three categories, or \"colors\": Kenbunshoku Haki, which grants users a sixth sense of the\
    \ world around them and limited precognitive abilities; Busoshoku Haki, which allows the user to use\
    \ their spirit as armor to defend against attacks or to make their own attacks more potent; and Haoshoku\
    \ Haki, a rare type of Haki only one in a million can use which grants the user the ability to overpower\
    \ the will of others. *Bus\u014Dshoku Haki (Color of Armaments): Outside of the basic usage of applying\
    \ invisible armor to one's self and their weapon, and being capable of harming those with Elemental\
    \ Intangibility similar to that of a Logia Devil Fruit User, Pica has shown some proficiency with\
    \ applying Busoshoku Haki. He is capable of applying Busoshoku: Koka to his entire body, greatly enhancing\
    \ his striking power and durability. *Kenbunshoku Haki (Color of Observation): Pica is confirmed to\
    \ utilize this form of Haki, but his level of application is never stated, nor implied. He should\
    \ be capable of at least a basic usage of the ability."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
