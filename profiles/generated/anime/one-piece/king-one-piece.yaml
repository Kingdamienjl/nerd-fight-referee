    source_ids: &id002
    - mediawiki-4580820
    confidence: 0.95
  attack_potency:
    text: 'Moon level (The strongest Beast Pirate next to KaidouOne Piece Vivre Card
      Databook #1308, which means his base is superior to Queen and Jack''s bases,
      who fought on equal terms for twelve hours without losing against Base Nekomamushi,
      who could disarms Base Kaido, after fighting for several hours without losing
      against Base Inuarashi, who is equal to Nekomamushi, respectively. In the past,
      easily overpowered RaizoOne Piece Vol. 96 Chapter 970. Cut off Full Zoan Marco''s
      wing with his swordOne Piece Vol. 100 Chapter 1006 and matched Sanji''s kicksOne
      Piece Vol. 98 Chapter 988. Fought against Post Mink Medicine Busōshoku Zoro
      as an equal at the start of their fight, even overpowering him in one exchange
      of blows. Could combat Marco one-vs-one offscreen for 30 minutes, eventually
      outlasting and defeating him188.362 Exatons. Stated that Zoro and Sanji needed
      their respective power ups to defeat King and Queen), higher in Zoan Forms (Overpowered
      Sanji, and although he failed to split him in half like he claimed to do because
      of the durability of the Raid Suit, he wounded him through it. His Hybrid Form
      sent Zoro flying with a slash and a clash, and cut Hybrid QueenOne Piece Vol.
      102 Chapter 1027. Overpowered Zoro''s Ul-Tora Gari with a single Imperial Archer,
      with the impact of his attack making Zoro cough up blood.), even higher with
      Armament Haki (Quickly overwhelmed, pushed back, and injured ZoroOne Piece Vol.
      102 Chapter 1032), far higher with Self-Destruction (Zoro said that if he didn''t
      block with Armament Haki, he would''ve diedOne Piece Vol. 102 Chapter 1033),
      or Omori Karyudon (King was confident that it''d kill Zoro despite the latter
      having matched King in all his previous states)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: FTL (Tagged Marco and kept up with Roronoa Zoro), higher in Zoan Forms (Faster
      than before), even higher with Flames-Off (With his lunarian flame turned off,
      his speed increases greatly)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class P (Stronger than Jack and Queen. Should be at least on the
      level of Post-Mink Drug Zoro, as he was able to block attacks from and even
      knock him away with his strikes), higher with Zoan Transformation (His Hybrid
      Form could easily send Roronoa Zoro flying with a single wing at the start of
      their fight)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Moon level, higher in Zoan Forms, even higher with Armament Haki
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Moon level (Tanked both a Bluebird attack and a kick from Marco. Emerged
      with no injuries after fighting Marco offscreen for 20 minutes. Base Zoro''s
      direct stab to his stomach, as well as an Ittoryu Iai: Shi Shishi Sonson couldn''t
      even phase him. Completely unharmed by his own self-destruction, which would''ve
      killed Zoro had the latter not used Busōshoku Haki to defend himself188.362
      Exatons with Flames On), Small Planet level in Zoan Forms (Far more durable
      than before. Blocked Zoro''s Black Rope Dragon Twister with his wings without
      suffering any damage, when a similar Enma-Unleashed attack had previously overpowered
      Full Zoan Kaidou''s Dragon Twister and cut through his scales. Even without
      the flames on his back, his Zoan Form''s durability should still be superior
      to his Zoan form''s AP and far above his no-flame base durability due to his
      Dinosaur body giving him an incredibly tough hide3.014 Zettatons with Flames
      On, 188.362 Exatons with Flames Off)'
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Jack, a fellow All-Star fought continuously for five days against
      two equal opponent that had rest periods along with their entire army, and afterwards
      left to engage in a battle where he came to blows with Admirals and Vice Admirals,
      sinking half their fleet before being declared dead. King managed to fight Marco
      on an almost-equal level for an extended period of time, eventually outlasting
      him while emerging unexhausted himself. He also managed to fight Zoro without
      exhaustion for the majority of the fight, and even after taking heavy damage
      from Zoro's Haoshoku Infused and En-Ō Santōryū attacks when his flames were
      off, he was still able to go toe-to-toe with Zoro until the end of the fight)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Several Meters due to sheer size and his sword; Tens of Meters in Zoan form
      and with Projectiles, Kilometers with Deep Pride Stake and Self-Destruction
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Above Average (As a commander of a Yonko's crew and right-hand man directly
      under Kaido, King is a very experienced leader of men, as shown by his reining
      in the excesses of his two associates Jack and Queen, and is capable of undertaking
      generally smart decisions under pressure, such as directly intervening to prevent
      the Big Mom Pirates from entering Wano without being ordered to do so. He has
      also fully mastered his Pteranodon Devil Fruit. He is also skilled in combat,
      as he was able to go toe-to-toe with the swordsman Roronoa Zoro and, in the
      past, easily bested Raizo of the Nine Scabbards in combat. Is also a skilled
      battlefield commander, as he was able to coordinate the Beast Pirates while
      fighting Marco, and in the past assisted Kaido in his conquest of Wano)
    source_ids: *id002
    confidence: 0.95
