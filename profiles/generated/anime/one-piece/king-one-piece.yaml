- id: claim-weaknesses-c305211c
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit weaknesses. When the flames on his back are lowered,
    his durability decreases in return for his speed increase. Rather arrogant, albeit
    not to a crippling extent. If his face is revealed, he will slightly lose control
    and attack everything around him. When he uses Omori Karyudon, he has to temporarily
    drop the flames on his back, leaving him momentarily vulnerable should someone
    get past his attack. His Hybrid form and Imperial Pride Stake also apparently
    force him to drop the flames on his back, although even without Lunarian flames
    his Zoan form is still incredibly durable. Notable Attacks/Techniques: |-|Fire
    Manipulation= Befitting his epithet, King is endowed with the natural ability
    to "ignite" (発火 hakka) his body, allowing him to create and control fire in both
    his humanoid and pteranodon forms. Using the fire he conjures, King can boost
    the power of his melee attacks, such as by throwing a flaming punch or kicking
    with a flaming leg. He can can launch bullet-like flame projectiles from a distance,
    set his surroundings aflame, and is able to unleash massive explosions from his
    body which he can choose to do once his opponent is in close proximity. His back
    flame is the secret behind his tremendous durability as a lunarian, and should
    he let them go out, his durability will decrease, though it will also give him
    a boost to his physical movement speed. At their strongest, King''s flames are
    so potent that they appear to take on the consistency of magma. His most powerful
    seen fire techniques involve King channeling fire into his sword in order to generate
    large, superhot dragons made of pure flame to burn whatever they are sent flying
    against. *Imperial Flame ({{Ruby|炎皇|アンドン}} Andon, literally meaning "Flame Emperor"):
    King creates a fireball over his open palm, then forms a fist to throw a powerful,
    flame-clad punch straight at his opponent. *Imperial Flaming Wings ({{Ruby|火龍皇|かりゅうドン}}
    Karyūdon, literally meaning "Fire Dragon Emperor"): An attack where King ignites
    his sword''s blade and, from its tip, produces a large, whirling, serpentine dragon
    made of fire—described by Zoro as being akin to magma. King then sends this dragon
    flying against a single or multiple enemies in order to incinerate them. **Extra
    Large Imperial Flaming Wings ({{Ruby|御守 火龍皇|おおもり かりゅうドン}} Ōmori Karyūdon, literally
    meaning "Assisting Guardian Fire Dragon Emperor"): A more powerful version of
    Karyudon, creating a larger fire dragon with which to attack and immolate his
    opponent. The technique''s true potential was never witnessed because, when King
    used it against Zoro, the latter was able to simply slice the dragon apart using
    his "King of Hell Three Sword Style". Imperial Flame.png|Imperial Flame Karyudon.png|Imperial
    Flaming Wings Omori Karyudon.png|Extra Large Imperial Flaming Wings |-|Devil Fruit=
    Dragon-Dragon Fruit, Model: Pteranodon: An Ancient Zoan Devil Fruit. It allows
    the user to transform into a giant pteranodon and pteranodon hybrid at will. The
    transformation increases King''s physical capabilities, particularly his strength
    and durability, while also giving him the power of flight. *Imperial Archer ({{Ruby|丹弓皇|タンキュウドン}}
    Tankyūdon, literally meaning "Vermilion​ Bow Emperor"): A melee attack where King
    flies toward his opponent in his hybrid pteranodon form, then hits them with a
    sweeping strike of one of his wings. *Imperial Deep Pride Stake ({{Ruby|貂自尊皇|テンプラウドン}}
    Tenpuraudon, literally meaning "Proud Marten Emperor"): A powerful melee attack
    used by King in his full pteranodon form. He pulls back on his head crest with
    one arm, stretching his face flat and causing his beak to retract into his face.
    He then lets go of the crest to let his head fling forward at extreme speed, almost
    like a slingshot, over a distance several times the length of his body, to strike
    his opponent with massive force (presumably using his beak to pierce them). When
    using this technique against Zoro, he was unable to block the attack and compared
    it to a laser beam. *Imperial Slings And Arrows ({{Ruby|刃裏双皇|バリゾウドン}}, Barizōdon,
    meaning "Blade Back Twin Emperor"): An attack where King, while in flight, employs
    both his pteranodon wings like blades, using their forward-most edge to launch
    what seems to be a series of destructive, elliptic air projectiles. Imperial Archer.png|Imperial
    Archer Imperial Deep Pride Stake.png|Imperial Deep Pride Stake Barizodon.png|Imperial
    Slings And Arrows |-|Haki= Haki: There are normally two types of Haki regular
    people can tap into: the Kenbunshoku Haki which allows individuals to sense the
    presence of others, and Busōshoku Haki which allows individuals to create an invisible
    armor around them. There is however a third type of Haki, Haōshoku Haki, that
    only a few individuals can use. It''s currently unknown if King is one of these
    people. *Busōshoku Haki (Color of Armaments): King has displayed proficient levels
    in applying this type of Haki. He''s capable of covering his entire katana with
    Bu'
  source_ids: *id003
  decisive: false
  status: unverified
