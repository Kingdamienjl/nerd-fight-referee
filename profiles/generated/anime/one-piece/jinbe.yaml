- id: claim-weaknesses-5781cf7d
  section: weaknesses
  axis: weakness
  text: 'Weaker on land than in the water, as he cannot fight at his full potential.
    Notable Attacks/Techniques: |-|Fishman Karate (Gyojin Karate)= A martial art that
    is practiced by certain members of the fishman race. While deadly enough on land,
    Fishman Karate has a number of devastating underwater moves designed to be suitable
    with the Fishmen strength and speed along with the mobility that goes while under
    water and, in some cases, a fishman''s personal adaptation (fins, teeth, etc.).
    The secret of Fishman Karate is mastery of the water in the user''s direct vicinity,
    using its power to send powerful waves impacting the water within the opponent''s
    body. *Karakusagawara Seiken (Arabesque Tile True Punch): Jinbe punches at a fair
    distance from the intended target(s), so instead of the fist connecting, it uses
    the water vapor in the air to release a shock wave that sends them flying. This
    move has a delayed effect, as the shock wave takes a while to affect the opponent(s).
    *Gosenmaigawara Seiken (Five Thousand Tile True Punch): A stronger version of
    the Senmaigawara Seiken. It is used like an uppercut, rather than a straight punch,
    sending the opponent flying skywards. *Gyojin Jujutsu: Mizugokoro (Fishman Way
    of Yielding: Water Heart): An underwater technique that Jinbe initiates by first
    performing a bowl-shaped gesture with his webbed hands (one hand over the other)
    while underwater right before giving the water itself around him a mighty yank.
    This allows Jinbe to physically grab and redirect currents as if he were manipulating
    cloth. **Kairyu Ipponzeoi (Sea Current Lifter): An underwater technique performed
    after Mizugokoro. Jinbe heaves the current upward, where it erupts from the ocean
    surface as a towering stream of water. Jinbe could apparently generate multiple
    water streams like these if necessary. *Yarinami (Spear Wave): A technique used
    on a body of water''s surface. Jinbe heaves a spear-shaped burst of water with
    enough force to punch a hole in solid structures. **Yarinami: Murasame: A variation
    of the Yarinami technique, but instead of throwing a single burst of water, Jinbe
    launches tens of smaller projectiles to his target. *Samehada Shotei (Sharkskin
    Palm Block): A simple palm block with enough force behind it to block stuff. *Samegawara
    Seiken (Shark Tile True Fist): A powerful straight punch that is strong enough
    to send the opponent reeling. *Uchimizu (Water Shot): Jinbe hurls a simple droplet
    of water at his opponent, which can become a deadly bullet with the kinetic force
    created by his immense fishman strength. *Nanasenmaigawara Mawashigeri (Seven
    Thousand Tile Roundhouse Kick): Jinbe performs a very strong roundhouse kick.
    *Kairagi (Shark Skin): Jinbe takes a defensive stance and imbues his arms with
    haki to receive an incoming attack. *Gyojin Karate Ougi: Buraikan (Fishman Karate
    Ultimate Technique: Mighty Reliant Piercing): The most powerful technique of Fishman
    Karate, Jinbe hurls a pack of water in his hands and shoots a powerful water shock
    wave that pierces through his opponent''s body. Gyojin Karate.gif|Karakusagawara
    Seiken Gosenmaigawara Seiken.gif|Gosenmaigawara Seiken Gyojin Juujutsu.gif|Gyojin
    Juujutsu: Mizugokoro Karyuu Ipponzeoi.gif|Kairyu Ipponzeoi Yarinami.gif|Yarinami
    Yarinami Murasame.gif|Yarinami: Murasame Samehada Shotei.gif|Samehada Shotei followed
    by Samegawara Seiken Vagabond Drill.gif|Gyojin Karate Ougi: Buraikan |-|Haki=
    There are normally two types of Haki regular people can tap into: the Kenbunshoku
    Haki which allows individuals to sense the presence of others, and Busōshoku Haki
    which allows individuals to create an invisible armor around them. There is however
    a third type of Haki, Haōshoku Haki, that only a few individuals can use. Jinbe
    is one of these people. *Busōshoku Haki (Color of Armaments): Jinbe has shown
    the capacity to apply Busoshoku: Koka to both of his arms for extended periods.right|250px
    ** Kiragi Glaze (Shark Skin): Jinbe hardens his arms with Busoshoku Haki before
    crossing them in a defensive position to tank a heavy blow such as successfully
    withstanding an attack from a crazed Big Mom. *Kenbunshoku Haki (Color of Observation):
    Jinbe could sense haki blast from far away. ==Notable Matchups== Victories: Charlotte
    Cracker (One Piece) Cracker''s profile Trafalgar Law (One Piece) Trafalgar Law''s
    Profile (Dressrosa Arc Law was used) Losses: Sarada Uchiha (Naruto) Sarada Uchiha''s
    Profile (Jinbe''s first key was used and Sarada''s last key was used) Inconclusive:
    Sanji (Post-Timeskip) (One Piece) Sanji''s Profile (Fishman Island Arc Sanji was
    used and speed equalized, fight took place at Marineford) ====Notes==== {{scroll
    box|content=}} {{Discussions}} Category:Characters Category:One Piece Category:Shichibukai
    Category:Anime Characters Category:Fish Category:Male Characters Category:Durability
    Negation Users Category:Martial Arts Champions Category:Chi Users Category:Sailors
    Category:Pirates Category:Martial Artists Category:Water Users Category:Animal
    Use'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-ad0f7c6d
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Master Martial Artist, Underwater Breathing
    (Type 2), Bodily Weaponry, Water Manipulation, Statistics Amplification (Strength
    and speed of fishmen is increased when underwater), Animal Manipulation (Has the
    ability to communicate with whale sharks over very long distances), Vehicular
    Mastery (Masterful helmsman), Immense Willpower, Haki (Intermediate Kenbunshoku,
    Intermediate Busoshoku), Limited Durability Negation, Attack Reflection and Shockwave
    Generation with Fishman Karate, Regeneration and Damage Boost (Mid-Low; As a Shark
    Fishman, he can regenerate his teeth and each time he does so, it become more
    stronger than before), Rage Power (Can boost his power in a fit of rage), Resistance
    to Heat Manipulation, Madness Manipulation, Mind Manipulation and Soul Manipulation
    via Willpower (Through sheer willpower they can resist losing their mind when
    absorbing shadows through the Kage Kage no Mi. Shadows belonging to strong willed
    people are difficult to control, allowing them to rebel against Moria's pact which
    usually immediately submits a shadow to his supremacy and orders. Spiritual energy
    is contained within one's soul/life; this energy is represented by the fighting
    power or the Haki itself. Those with strong souls, which are homologous to shadows,
    resist the effects of Brook's soul manipulation)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
