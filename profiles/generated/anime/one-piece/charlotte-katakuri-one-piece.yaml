power_scale:
  tier:
    text: '{{High 6-C}}, up to {{6-B}} with Edged Mochi and Awakening, higher with
      Buzz Cut Mochi Name: Charlotte Katakuri Origin: One Piece Gender: Male Age:
      48 Classification: Pirate, Commander, Marksman, Human, Special Paramecia Devil
      Fruit User'
    source_ids:
    - mediawiki-charlotte-katakuri-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Large Island level (As "the perfect man," Katakuri is considered to be
      the Charlotte family''s greatest masterpieceOne Piece Vol. 88 Chapter 882 and
      the strongest of the 3 Sweet CommandersOne Piece Vol. 87 Chapter 879, making
      him far superior to Cracker and Smoothie), up to Country level with Edged Mochi
      (Could harm Luffy through his Armament Haki defense, to the point to cause him
      pain when clashing. Clashed with Gear 4th: Snakeman Luffy, overcoming his Haki
      defense throughout the battleOne Piece Vol. 89 Chapter 89517.25 Teratons) and
      Awakening (Dealt severe damage to Gear 4th: Boundman LuffyOne Piece Vol. 88
      Chapter 884 with his Power Mochi fistsOne Piece Vol. 88 Chapter 885. Could harm
      Luffy through his Armament Haki defenseOne Piece Vol. 89 Chapter 894), higher
      with Buzz Cut Mochi (Knocked Gear 4th: Snakeman Luffy out for 10 minutes after
      hitting him with it twiceOne Piece Vol. 89 Chapter 896)'
    source_ids:
    - mediawiki-charlotte-katakuri-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'FTL (Faster than Gear 2nd Luffy and can keep up with Snakeman Luffy), higher
      with Buzz Cut Mochi (Blitzed Gear 4th: Snakeman Luffy''s Jet Culverin. Luffy
      had to resort to his fastest technique - King Cobra - in order to pull of a
      dual-exchange), far higher reactions with Future Sight (Intercepted Gear 4th:
      Boundman Luffy''s Kong Gun and Rhino Schneider before they could hit him. Viewed
      Snakeman Luffy''s attacks as moving in slow motion as he dodged them. Activated
      Armament Haki to protect himself from Luffy''s Black Mamba technique and effortlessly
      weaved through his barrage)'
    source_ids:
    - mediawiki-charlotte-katakuri-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Large Island level, Country level with Busōshoku Haki (Tanked many blows
      from Snakeman Luffy. Withstood a brief beating from Bound-Man Luffy, but was
      visibly injured and sent flying from the assault)
    source_ids:
    - mediawiki-charlotte-katakuri-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Was unfazed after receiving injuries via blunt trauma from Gear
      4th Luffy, and could continue a marathon fight with him for hours while using
      both Kenbunshoku and Busoshoku Haki nonstop without the need to rest, remaining
      invigorated. During the fight, he also endured a fatal injury, impaling himself
      completely through the side of his torso, damaging his intestines and stomach
      to some extent, and causing severe bleeding while only showing small signs of
      pain and fatigue before fighting again)
    source_ids:
    - mediawiki-charlotte-katakuri-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range to several meters due to his size. Hundreds of meters
      using his Paremecia Powers. At least tens of meters with his Jelly Beans
    source_ids:
    - mediawiki-charlotte-katakuri-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (Possesses a high level of fighting ability. Displays creative and
      effective ways to immediately turn a situation into his favor, such as using
      his power to make earplugs for him and his entire family while Big Mom's screams
      were causing everyone to be stunned. Or when he used his power to plug up Bege's
      cannons. He focuses on efficiency, aiming to destroy any possible threats before
      they can do anything. He was initially sensitive about his abnormal jaw and
      teeth and would become enraged should anyone mock him or call him a monster,
      but during his fight with Luffy, he began to embrace his monstrous appearance.
      He is very honorable when it comes to fighting opponents that make an impression
      on him, not tolerating an interference from his family that results him gaining
      an upper-hand against Luffy--leading him to impale himself in the side with
      his spear in order to equalize Luffy's handicap and went out of his way to KO
      his nearby allies for the interruption)
    source_ids:
    - mediawiki-charlotte-katakuri-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
