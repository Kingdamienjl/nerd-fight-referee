- id: claim-powers-and-abilities-95c093e5
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Large Size (Type 0; 3.82 meters) * Master Swordsman *
    Haki (Advanced Haoshoku, Intermediate Kenbunshoku, Advanced Busoshoku) * Supernatural Willpower (Held
    onto a chain pulled by the Moby Dick and faced the many dangers and climates of the New World ocean
    with no protection for three days. Spent 1 hour in boiling oil which temperature exceeded 700 Degrees
    of heat, while lifting the 9 Scabbards the entire time) * Regeneration (Mid-Low over time; Recovered
    from being severely injured after a night time of sleep), Air Manipulation (Able to send air slashes
    with his swords) * Extrasensory Perception and Telepathy (Can hear the "Voice of All Things") * Social
    Influencing (Women get attached to Oden''s charisma even if he commits outrageous actions and the
    women who were kidnapped by him when he formed a harem when he was 15, stayed willingly with him.
    He also made people want to follow his lead and his charisma turned Kuri, a district full of infamous
    thieves, into a peaceful land) * Enhanced Senses (Heard Toki being attacked at a cove while he was
    at the sea and successfully found her) Resistance to * Energy Absorption (Tamed the sword Enma, which
    drains its user''s Haki with a few uses) * Cold Temperatures (Danced half-naked every day for 5 years
    despite the cold weather and showed no signs of coldness) * Heat Manipulation (Withstood boiling oil
    temperature that exceeded 700 Degrees in his body for an entire hour, at the same time that he exerted
    force to lift the 9 Scabbards) * Madness Manipulation, Mind Manipulation and Soul Manipulation with
    Willpower (Through sheer willpower they can resist losing their mind when absorbing shadows through
    the Kage Kage no Mi. Shadows belonging to strong willed people are difficult to control, allowing
    them to rebel against Moria''s pact which usually immediately submits a shadow to his supremacy and
    orders. Spiritual energy is contained within one''s soul/life; this energy is represented by the fighting
    power or the Haki itself. Those with strong souls, which are homologous to shadows, resist the effects
    of Brook''s soul manipulation) * Limited Power Nullification and Stamina Absorption (Scaling to other/lesser
    Haoshoku Haki users who can resist the effects of Seastone to different extents)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
