- id: claim-standard-equipment-78419e1e
  section: equipment
  axis: equipment
  text: '*Enma: As one of 21 Wazamono and a masterpiece made by the legendary blacksmith Shimotsuki Kouzaburou,
    Enma is among the best swords in the world. Enma was seen as an extremely difficult sword to handle,
    with Oden being the only one to have tamed it. This is due to Enma''s distinctive quality of extracting
    Ryuo (Armament Haki) from its user in excessive quantities, forcing attacks much more powerful than
    intended. *Ame no Habakiri: As a masterpiece by Tenguyama Hitetsu, one of Wano''s greatest blacksmiths
    and one of 21 O Wazamono, Ame no Habakiri is an extremely powerful sword comparable to Enma. According
    to the creator, it can "cut through even the heavens".'
  source_ids: *id003
