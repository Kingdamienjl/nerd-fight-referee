- id: claim-weaknesses-30cdb04f
  section: weaknesses
  axis: weakness
  text: "Standard Haki Weaknesses Notable Attacks/Techniques *Voice of All Things: Like Roger and Luffy,\
    \ Oden had the ability to hear the \"Voice of All Things\", which his son also inherited. On the trip\
    \ to Fish-Man Island, he could hear the voices of the Sea Kings alongside Roger, and could also hear\
    \ a voice while nearing Zou. *Haki (\u8987 \u6C17): Haki is a latent power in any living thing in\
    \ One Piece. It basically consists of three types: The Armament Haki, Observation Haki and the Conqueror's\
    \ Haki (Conqueror's Haki is only exclusive for some special individuals, something Oden is). Oden\
    \ was one of the very small number of people in the world who could use all three types of Haki. His\
    \ Haki was so powerful that he could easily wield the sword Enma, which drains away its wielders Haki\
    \ at a near fatal rate. **Armament Haki (\u6B66\u88C5\u8272\u306E\u8987\u6C17 Bus\u014Dshoku Haki):\
    \ Oden was an extremely powerful master of Armament Haki, which is known as It is most noted as he\
    \ was the only samurai who tamed the Meito, Enma, despite its dangerous Haki-draining properties,\
    \ which even Kin'emon, the Nine Red Scabbards' Leader feared, displaying his supreme mastery compared\
    \ to Zoro whose entire arm was emaciated after a single slash wielding Enma. Even at age 18, Oden\
    \ was masterful in using Armament Haki, as he imbued both his swords (Ame no Habakiri and Enma) hardening\
    \ them, letting him cleanly bisect the enormous Mountain God in a single slash. At age 29, Oden hardened\
    \ his swords and then clashed against one of the 12 Saijo O Wazamono, Murakumogiri, which belonged\
    \ to Edward Newgate, an immensely powerful Armament Haki master in his own right. A true testament\
    \ to his prowess, at age 39, Oden was able to wound the nigh-indestructible Kaido while in his dragon\
    \ form, giving him a permanent scar whereas Luffy using Boundman couldn't even damage him. **Observation\
    \ Haki (\u898B\u805E\u8272\u306E\u8987\u6C17 Kenbun-shoku no Haki): This haki works similarly to a\
    \ sensor, the user is able to see or feel people's aura, being able to anticipate their attacks and\
    \ capture them even from great distances. In other stages, this haki provides the user with the ability\
    \ to even see the future. **Conqueror's Haki (\u8987\u738B\u8272\u306E\u8987\u6C17 Ha\u014D-shoku\
    \ no Haki): Oden possessed the ability to use Conqueror's Haki, a very rare type of Haki whose users\
    \ are said to have the qualities of a king. In his initial encounter with Edward Newgate 30 years\
    \ ago, the sudden clash between both of them created a notable effect similar to lightning, as well\
    \ as released a shockwave, this is also shown during his clash against Kaido. While not directly shown\
    \ in the manga, Oden uses its more common effect at least once, making a bunch of Kaido's henchmen\
    \ faint. *Oden Nitoryu (Oden's Two Sword-Syle): Oden was an immensely skilled and powerful swordsman,\
    \ having developed his own variation of Nitoryu, which Oden himself called as Oden Nitoryu. He had\
    \ immense prowess and ambidexterity in dual-wielding the legendary swords, Enma and Ame no Habakiri.\
    \ **Togen Shirataki (Paradise White Waterfall): Oden hardens both his swords using Armament Haki and\
    \ then delivers a diagonal slash with each one of them at the same time. This technique has immense\
    \ power and range, as seen when Oden used the technique to bisect the massive Mountain God in half.\
    \ When performing it in the anime, Oden not only imbues his swords' blade, but also their hilts and\
    \ his own arms. **Shimi Daikon (Great Spirit of Samurai): Oden imbues his swords with an extra amount\
    \ of Armament Haki, then charges the opponent with the swords crossed behind his own head, then uncrosses\
    \ them in a single motion, eventually unleashing the Armament Haki and cutting into them at once.\
    \ Each sword wears a long Armament Haki blade extension as a result of this technique. **Gan Modoki\
    \ (Gun Imitating Demon): After hardening his swords with Armament Haki, Oden crosses his swords and\
    \ charges forward, slicing anyone in his path. When Oden used this technique, he was able to defeat\
    \ several members of the Roger Pirates at once. **Togen Totsuka (Paradise Ten Hands): Oden hardens\
    \ his swords using Armament Haki, then leaps toward his opponent, and performs an X-shaped slash powerful\
    \ enough to give the nigh-invincible Kaido his permanent scar. When performing it in the anime, Oden\
    \ not only imbues his swords' blade but also his own arms. OdenBusoshokuHaki.gif|Armament Haki OdenHaoshokuHaki.gif|Conqueror's\
    \ Haki OdenTogenShirataki.gif|Togen Shirataki OdenShimiDaikon.gif|Shimi Daikon GanModokiOden.gif|Gan\
    \ Modoki OdenTogenTotsuka.gif|Togen Totsuka"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
