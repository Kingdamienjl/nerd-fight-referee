- id: claim-weaknesses-c5523e3a
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit users weaknesses. His Devil Fruit ability has a defined
    area of effect, requires various gestures to activate his powers, and his power
    is physically exhausting, especially when he uses its awakened techniques. His
    Devil Fruit ability is less effective against opponents with stronger Haki. Notable
    Attacks/Techniques: |-|Ope Ope no Mi (Operation-Operation Fruit)= A Paramecia
    type Devil Fruit, this fruit allows its user to create a spherical space or "room",
    where the user has complete control over the placement and orientation of the
    objects inside. Gives user minor to major control of space inside this room. Room
    (ROOM（ルーム）, Rūmu): The precursor of all abilities of Ope Ope no Mi, where the
    user creates a spherical space in which he can manipulate anything in various
    ways; it is not possible to perform any of the other techniques of the fruit outside
    this spherical area. The creation of the ROOM occurs from the formation of a small
    circle around the user''s hand, which then expands and forms the ROOM itself.
    The size of the ROOM can turn from a few meters to completely bypass buildings
    and mountains, although larger ROOMs require more stamina to be maintained. The
    color of the ROOM is transparent with only its boundaries visible through a light
    blue aura, thus allowing the user to keep their ROOM unnoticeable to enemies if
    they expand it beyond the line of sight. The size of the Room can be changed to
    being enough to envelope a few dozen people to big enough to encompass an entire
    mountain with room to spare (pun totally intended). *Amputate (アンピュテート, Anpyutēto):
    Law typically uses his Devil Fruit powers together with his swordsmanship, making
    his sword a "scalpel" of sorts while his powers are active. This makes his Room
    slashes akin to spatial slicing, as they ignore the defenses of an opponent and
    appear to take effect instantaneously in the direction of his cut within the Room.
    On the flip-side, while able to dismember people, his Room slashes doesn''t cause
    any actual harm. Nothing has been shown the ability to stop this outside of highly
    developed haki or sea-stone. *Shambles (シャンブルズ Shanburuzu): Within the space created
    from Room, Law can separate the pieces of those targets and rearrange those pieces
    to his liking, causing massive confusion to his opponents. Law can also use this
    to re-direct incoming projectiles. He can use this ability to swap the consciousness
    of those within his Room and even use it to swap places with an object or another
    person in a sort of teleportation. *Mes (メス, Mesu): Law is able to expel a heart
    from his opponent''s body. Though this temporarily incapacitates the victim, it
    doesn''t cause any lethal harm. Has so far only shown the capacity to do this
    within close proximity. *Scan (スキャン, Sukyan): The user scans people inside the
    ROOM by channeling his sword with the energy of the fruit and radiating his blade,
    using it as an X-ray machine. This allows him to see the location of items anywhere
    in the scanned person, selectively pushing away any item that the individual may
    be carrying. *Injection Shot (インジェクション）ショット, Injekushon Shotto): While aiming
    at their target, the user rushes toward them with the sword extended, in order
    to stab them. Once the sword catches the target, the user "fires" it as a weapon,
    causing the victim to bleed in the targeted spot and pushes them at a medium distance.
    Ope no Mi''s main ability to cut objects at a distance can be accomplished with
    this technique, piercing the target without having to touch it with the sword,
    although the attack can be blocked by reaching the side of the blade. *Radio Knife
    (ラジオナイフ, Rajio Naifu): An advanced version of Amputate. The user charges his sword
    with electricity in a manner similar to Counter Shock and then cuts off his enemy
    quickly, which results in the target being separated into several linear pieces
    while also being electrocuted. The cut itself, as occurs regularly with the fruit''s
    abilities, is not harmful; however, if it differs from normal by preventing the
    target from being able to retake the split parts of his body, becoming a counterattack
    to abilities able to bypass the regular amputation techniques of Ope Ope no Mi.
    *Tact (タクト, Takuto): The user uses his ability to levitate an object within the
    ROOM in a telekinetic manner. To use this technique, the user performs a lifting
    motion with the index finger (pointing up). The power of this technique seems
    to neglect the weight and volume of the object inside the ROOM, proving powerful
    enough to lift a Navy warship. It is also possible to use Takt to ascend rocks
    from the ground to impale enemies. **Sterben (死の刀ステルベン Suteruben): After using
    Tact on his sword, Law makes it spin and launches it towards the enemy. *Counter
    Shock (カウンターショック, Kauntā Shokku): Law puts both hands to his opponent''s chest
    and seemingly sends a surge of electricity through them in a manner similar to
    a reverse defibrillator, keeping in tune with the operating roo'
