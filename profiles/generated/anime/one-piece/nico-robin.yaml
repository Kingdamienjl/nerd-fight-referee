- id: claim-weaknesses-b5808621
  section: weaknesses
  axis: weakness
  text: "Standard Devil Fruit users weaknesses. She feels anything her duplicate limbs feels, will take\
    \ damage to her real body if they\u2019re attacked, can't create limbs where there is not enough room\
    \ and while each part is capable of that part\u2019s normal movements, the body part itself is bound\
    \ to where it was sprouted from, and typically remains stationary when using her powers though she\
    \ doesn't have to. Because of her reverence for history and the past, she refuses to fight in places\
    \ where there are ancient artifacts and leaves herself vulnerable to her opponent\u2019s attacks.\
    \ She can only fly for 5 seconds (though this was before the timeskip, it hasn't been confirmed if\
    \ she's improved her flight time or not after her training). Notable Attacks/Techniques: right|300px\
    \ Hana Hana no Mi (Flower-Flower Fruit) is a Paramecia-type Devil Fruit, this fruit allows the user\
    \ to replicate and sprout pieces of their body multiple times from the surface of any object or living\
    \ thing. The fruit's major strength, as demonstrated by Nico Robin, is the ability to sprout multiple\
    \ body parts on any surface including the user's own body, except seastone. With this ability the\
    \ user can take on many attackers by using many sprouted limbs. Since the user is practically the\
    \ only one who knows where their limbs will sprout out, they have the element of surprise on their\
    \ side. Another strength is that the user can also create body parts like an eye in order to gather\
    \ information. Aside from the standard Devil Fruit weaknesses that a user falls prey to, the user\
    \ of the Hana Hana no Mi has some weaknesses unique to themselves. The user will gain damage to their\
    \ body if the extra limbs are attacked and can feel the pain. According to Oda, the user has a radius\
    \ of 200 Hana Hanas in which they can extend parts of their body. |-|Pre-Timeskip Techniques= *Clutch:\
    \ Robin sprouts multiple arms on an opponent, one pair forcing them on the ground backwards, one pair\
    \ hold the foe up at their back, and a final pair grabs the upper body. The pairs at the upper body\
    \ and legs pull, brutally cracking the foe's back. The power of the attack increases with more arms.\
    \ center|300px *Dos Fleur: Grab: Sprouting two arms on her target\u2019s legs, Robin proceeds to grab\
    \ her male target's \"treasure\" and squeezes them, causing the target unbearable pain and bringing\
    \ them to their knees in agony. *Tres Fleur: Robin sprouts three arms to attack her opponent. She\
    \ first used this against Pell in his half-falcon form to cut off his mobility and cause him to crash.\
    \ *Cinco Fleur: Robin sprouts five arms from a tree in the form of a vine. She used this technique\
    \ to swing away from an oncoming giant snake. *Seis Fleur: Twist: Robin sprouts six arms around her\
    \ foe\u2019s body and twists it around. *Seis Fleur: Sl"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
