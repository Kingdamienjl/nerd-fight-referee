- id: claim-weaknesses-52be5415
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit users weaknesses. Fujitora is blind, although this is
    circumvented with the use of Kenbunshoku Haki. Notable Attacks/Techniques: Haki:
    There are normally two types of Haki regular people can tap into: the Kenbunshoku
    Haki which allows individuals to sense the presence of others, and Busōshoku Haki
    which allows individuals to create an invisible armor around them. There is however,
    a third type of Haki, Haōshoku Haki, that only a few individuals can use. Fujitora
    is not one of these people. *Busōshoku Haki (Color of Armaments): Fujitora has
    displayed at least an adept level of application of this type of Haki, capable
    of applying Busoshoku: Koka to his sword. *Kenbunshoku Haki (Color of Observation
    or Mantra): Fujitora is highly advanced with this type of Haki. He is capable
    of sensing the presense of meteors, clouds, and others over tens to possibly hundreds
    of kilometers away. He can read people''s intentions and is capable of seeing
    the future to some degree. Gravito (Gravity Sword): Fujitora''s signature technique.
    Fujitora can manipulate the gravitational forces by channeling his Devil Fruit''s
    ability through his sword. He can send the gravitational forces by swinging or
    just simply moving his sword. The direction of the gravitational forces can be
    upwards, downwards, or sideways. He has been shown to only use one at a time so
    far. It was first used against the thugs of the Donquixote Pirates by manipulating
    gravitational forces downwards. However, this technique wasn''t named until his
    fight against Sabo. Fujitora-defense.gif|Upwards Fujitora-downwards.gif|Downwards
    Fujitora-gravito.gif|Levitating Fujitora-ataking.gif|Attacking *Meteor: Fujitora
    can attract meteors and cause them to fall down around his area. He can pull down
    single meteors or several at once and can direct them to a point hundreds of meters
    from himself. *Moko (Ferocious Tiger): Fujitora generates immense levels of gravitational
    forces around him that push out horizontally, which knock away anything including
    his enemies, buildings, trees, and whatever else that is unfortunate enough to
    be in the attack radius. The force is so strong that it easily destroys the ground
    and buildings, reducing them to rubble. ==Notable Matchups== Victories: Losses:
    Sanji (One Piece) Sanji''s Profile (Post Vinsmoke Awakening Sanji was used) Inconclusive
    ==Notes and Explanations== {{scroll box|content=}} {{Discussions|Fujitora|Issho
    (Fujitora)}} Category:Characters Category:One Piece Category:Anime Characters
    Category:Antagonists Category:Blind Characters Category:Chi Users Category:Enhanced
    Senses Users Category:Forcefield Users Category:Gravity Users Category:Haki Users
    Category:Humans Category:Leaders Category:Male Characters Category:Manga Characters
    Category:Military Characters Category:Sailors Category:Soldiers Category:Sword
    Users Category:Weapon Masters Category:Disabled Characters Category:Adults'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
