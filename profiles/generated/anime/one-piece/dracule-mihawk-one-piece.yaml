  intelligence:
    text: At least Above Average in general. Astoundingly skilled in combat. Mihawk
      is famous for being the best swordsman in the world, having displayed masterful
      feats of skill such as deflecting bullets with minimal effort. He is very calculating
      and possesses pinpoint accuracy with his strikes, capable of fully stopping
      Zoro's Oni-giri just by positioning a small blade at the right angle to intercept
      the three-bladed attack. He is skilled enough to emerge from the battlefield
      of Marineford without receiving a scratch, let alone receiving a direct hit
      despite coming to blows with a number of commanders under the Whitebeard crew,
      showcasing his impeccable skill as a swords-master. He is among one of the few
      individuals who has developed a Black-Blade (The other being Ryuma, many years
      ago), which is a feat that many highly acclaimed swordsmen who possess a mastery
      of Haki have failed to accomplish, such as Kozuki Oden, who was incapable of
      evolving his own weapons into Black-Blades.
    source_ids:
    - mediawiki-dracule-mihawk-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
