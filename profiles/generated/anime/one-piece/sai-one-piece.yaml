- id: claim-weaknesses-c2f6b91a
  section: weaknesses
  axis: weakness
  text: "None notable Feats: *Bent & Intercepted the Legendary Don Chinjao's Eight Impacts Fist Secret\
    \ Technique: Drill Dragon Drill Nail with a Haki Infused Bujaogen Notable Attack/Techniques Haki:\
    \ There are normally two types of Haki regular people can tap into: the Kenbunshoku Haki which allows\
    \ individuals to sense the presence of others, and Bus\u014Dshoku Haki which allows individuals to\
    \ create an invisible armor around them. There is however, a third type of Haki, Ha\u014Dshoku Haki,\
    \ that only a few individuals can use. Sai is not one of these people. * Bus\u014Dshoku Haki (Color\
    \ of Armaments): Sai has shown proficiency with this type of Haki, normally being able to apply Busoshoku:\
    \ Koka on parts of him limbs, but having been shown capable of momentarily applying it to his entire\
    \ body with some effort. As the 13th head of the Happo Navy, Sai has been trained extensively in the\
    \ Hasshoken style. Upon successfully bending his grandfather and predecessor's legendary drill-shaped\
    \ head with his own technique, Chinjao comes to recognize Sai has awakened his true powers and bestows\
    \ him the true secrets of the Hasshoken technique. His usage of the style is focused on his leg, which\
    \ has inherited the ultimate technique. thumb|300px *Bujaogen (\u6B66\u811A\u8DDF\uFF08\u30D6\u30B8\
    \u30E3\u30AA\u30B2\u30F3\uFF09 Bujaogen, literally meaning \"Military Leg Heel\"): Sai kicks his target\
    \ while emitting the Hasshoken shock wave. This allows him to shatter defense while kicking through\
    \ his target. It was first used against an unnamed gladiator during Block C's match but was not named\
    \ until he used it (along with Busoshoku Haki) to block his grandfather's Kiryu Kirikugi, which was\
    \ able to bend even Chinjao's legendary drill-shaped head. thumb|300px *Hasshoken Ogi: Kiryu Kirikugi\
    \ (\u516B\u885D\u62F3\u5965\u7FA9 \u9310\u9F8D\u9310\u91D8 Hassh\u014D-ken \u014Cgi: Kiry\u016B Kirikugi,\
    \ literally meaning \"Eight Impacts Fist Secret Technique: Drill Dragon Drill Nail\"): The Hasshoken\
    \ secret technique bestowed upon his leg upon proving his might against his predecessor. Sai performs\
    \ cartwheels while imbuing his leg with Busoshoku Haki, and then performs a kick with vibrations emitting\
    \ from said leg. Chinjao claimed that with this, Sai should be able to break apart the layers of ice\
    \ in the same manner how Chinjao did 30 years back. This technique was first used when Chinjao bestowed\
    \ him the Hasshoken's secret technique upon his leg, defeating Lao G and sending a massive shock wave\
    \ linear to the kick, as well as creating a fissure along the ground."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
