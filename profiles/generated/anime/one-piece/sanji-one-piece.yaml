  intelligence:
    text: 'Above Average in general. Gifted in combat tactics. Genius in cooking.
      Sanji is a master fighter and cook. As a child, Sanji had limited experience
      in combat and only knew basic swordplay. However, his mentor, the retired pirate
      Red-Leg Zeff, trained him intensively in both fighting and cooking, transforming
      him into a highly skilled fighter equipped with swift and powerful kicksOne
      Piece Vol. 6-7 Chapters 53 and 54 that would later become his trademark. While
      Sanji''s love for cooking was always his top priority, Zeff shared his passion
      for the culinary arts and recognized the importance of keeping his hands unharmed
      for cooking. To accommodate this, Zeff trained Sanji to become a fighter who
      solely uses his legs, thus, developing the unique "Black-Leg Style" of fighting.
      With this style, Sanji''s legs became his most lethal weapon, and his swift
      and agile movementsOne Piece Vol. 7 Chapter 60 allow him to strike his opponents
      from unexpected angles.One Piece Vol. 7 Chapter 61 Thanks to Zeff''s teachings,
      Sanji was able to balance his love for cooking and his newfound skills in combat,
      becoming an expert in both fields. Today, Sanji''s Black-Leg Style is renowned
      and feared by his opponents, and his culinary skills are admired and appreciated
      by his enemies and crewmates alike.One Piece Yellow: Grand Elements Page 83
      Sanji''s fighting style is a unique combination of his culinary expertise and
      combat training, and he demonstrates this with every single attack he has in
      his arsenal. Sanji''s ability to translate his love for cooking into his fighting
      style is showcased through his creative use of food-related names for his techniquesOne
      Piece Vol. 10 Chapter 86 and the clever incorporation of cooking techniques
      into his attacks.One Piece Yellow: Grand Elements Page 80 Each attack that Sanji
      unleashes is a reference to either a cooking technique or the name of an animal''s
      body part, highlighting his mastery of both combat and culinary arts. For instance,
      Sanji''s attack called "Collier" is named after the French word for "collar"
      and is a reference to the neck of an animal. In this attack, Sanji uses his
      opponent''s own momentum against them by using their attack as a springboard
      to launch himself into a powerful kick, striking their neck with great force
      and accuracy.One Piece Red: Grand Characters Page 121 The technique is highly
      effective in taking down opponents and showcases Sanji''s clever use of animal
      anatomy in his fighting style. Sanji''s fighting style not only incorporates
      his cooking knowledge but also his unique flair and creativity. He often uses
      unconventional techniques and improvises in the heat of battle, making his fighting
      style unpredictable and highly effective. One such example is "Party Table Kick
      Course." This attack involves Sanji launching himself into the air and rapidly
      spinning, delivering multiple kicks to his opponents in a circular motion, like
      a spinning table. The attack is not only visually impressive but also highly
      effective, capable of taking out multiple opponents at once. This attack demonstrates
      Sanji''s ability to think outside the box in combat and utilize his surroundings
      to gain an advantage. Sanji''s ability to accurately target specific points
      on an opponent''s body with his kicks is a testament to his mastery of the Black-Leg
      Style. He can deliver powerful blows in precise areas, such as the head or vital
      organs, in order to deal maximum damage.One Piece Red: Grand Characters Page
      120 An example of this is Sanji''s "Parage Shot" attack, where he utilizes his
      knowledge of human anatomy, delivering a series of kicks to different parts
      of his opponent''s face, altering their bone structure. The attack''s name,
      derived from the French term "Parage" meaning "equal footing," highlights Sanji''s
      ability to level the playing field and take down opponents with ease. Sanji
      has also shown the remarkable ability to incorporate others'' techniques into
      his own fighting style, allowing him to continuously develop and enhance his
      skills. One example of this is when he observed the fighting style of Wanze
      and Bon Clay, and was able to adopt bits of their individual version to help
      create his Diable Jambe. Sanji''s fighting style is not limited to just his
      legs, he also possesses exceptional knife skills which he considers to be the
      soul of a chef. His proficiency with blades is evident as he can accurately
      cut and prepare meals with high level skill. In fact, during his encounter with
      Wanze on the Sea Train, Sanji showcased his knife skills by using them to battle
      his opponent and emerged victorious, reducing Wanze''s Ramen Kenpo Armor into
      exact 1.4 millimeter thin noodles. The name "Diable Jambe" means "Devil Leg"
      in French, and it perfectly captures the essence of Sanji''s fighting style.
      Sanji''s love for cooking and passion for fighting come together in this technique,
      as he uses his expertise in both areas to create a powerful and unique attack
      capable of cooking the insides of his opponents'
