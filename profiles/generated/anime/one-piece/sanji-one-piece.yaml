      Baratie, Sanji went on to fight Gin, with the latter landing many significant
      hits,One Piece Vol. 7 Chapter 61 resulting in Sanji breaking several ribs. Despite
      being in this state, Sanji was still able to fight and dodge attacks swiftly
      and without issue. During Arlong Park, Sanji was blindsided by Kuroobi, getting
      up shortly after.One Piece Vol. 10 Chapter 84 Sanji was able to survive a brutal
      assault from Kuroobi underwater (where the latter''s strength was doubled),
      which included Sanji''s organs being crushed by water pressure.One Piece Vol.
      10 Chapter 86 While in this condition Sanji was able to easily outmaneuver and
      mercilessly decimate Kuroobi. After taking a beating by Bon Clay due to him
      looking like Nami, having a hole kicked through his shoulder,One Piece Vol.
      21 Chapter 188 and having broken bones, Sanji was able to clash evenly with,
      and eventually get the better of him and win.One Piece Vol. 21 Chapter 189 Sanji
      has been shown to be able to take durability negating attacks with little difficulty
      as shown in Skypiea, where he took several hits from Satori''s Impact Dial,One
      Piece Vol. 27 Chapter 247 which utilizes shockwaves to target internal organs,
      recovering mere moments later.One Piece Vol. 27 Chapter 250 The Reject Dial,
      which works identical to the Impact Dial, with the former being stronger, was
      able to do this when landed on Giant Jack.One Piece Vol. 32 Chapter 296 Shortly
      after, Sanji was shown taking the full power of Enel''s El Thor,One Piece Vol.
      30 Chapter 284 having enough willpower to stay standing. In Enies Lobby, Sanji
      fought Kalifa, which resulted in the former being left as a bloody mess.One
      Piece Vol. 42 Chapter 403 After that, he faced off against Jabra. During their
      fight, Sanji took several Zoan Enhanced Six Powers attacks,One Piece Vol. 43
