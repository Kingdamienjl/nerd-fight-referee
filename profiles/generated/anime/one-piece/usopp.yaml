- id: claim-powers-and-abilities-c2bbdac5
  section: abilities
  axis: hax
  text: 'Alabasta Saga=Superhuman Physical Characteristics, Weapon Mastery (Mainly
    fights with the various gadgets and gears he has acquired or created over the
    years. He is a very accomplished and extremely skilled sniper), Stealth Mastery,
    Social Influencing (Is an adept liar, which can be useful in certain situations.
    Although many of his lies are outrageous, they''ve been shown to be a useful distraction
    at times; especially against gullible opponents. At times, it even succeeds as
    a deterrence albeit for a short period of time until his enemies figure out his
    bluff. He often incorporates his bluffs into his arsenal with mixed results),
    Minor Status Effect Inducement (Via Egg Star and Tabasco Star), Sense Manipulation
    (Egg Star can be used to "disable" someone''s sense of smell), Enhanced Sight
    (Via goggles), Smoke Manipulation (Via Smoke Star), Fire Manipulation (Via Fire
    Star), Limited Sound Manipulation (Via his chalkboard), Explosion Manipulation
    (Via Gunpower Star) |-|Skypiea Saga=Same as before, Minor Adaptation (Adapted
    to the oxygen shortage), Acrobatics, Surface Scaling (Via the Octopakutsu), Impact
    Absorption, Shockwave Generation, Minor Durability Negation and Attack Reflection
    (Via an Impact Dial), Limited Light Manipulation (Via Flash Dial), Gas Manipulation
    (Via Flavor Dial, can store smells and aromas, along with other types of gas,
    such as explosive and flammable ones), Preparation (With enough preparation he
    can make good strategies) |-|Enies Lobby Saga to Thriller Bark Arc=Same as before
    to an enhanced scale, Organic Manipulation (Via Oil Star and Sticky Star) |-|Dressrosa
    Saga=Same as before, Haki (Initial Kenbunshoku), His creations and engagements
    guarantee him: Plant Manipulation (Via Pop Green seeds), Shockwave Generation
    (Via Impact Wolf), Sleep Manipulation (Via Hissatsu Bakusui-Bosh), Fragrance Manipulation
    (Via Pop Green Rafflesia), Resistance to High and Low Temperatures (Barely fazed
    by Punk Hazard''s environment)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
