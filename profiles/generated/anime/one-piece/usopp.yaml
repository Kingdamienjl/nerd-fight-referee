- id: claim-weaknesses-ab9d0a94
  section: weaknesses
  axis: weakness
  text: 'Scared all the time, which often limits his potential | His inclination to
    fear is less apparent in battle after the timeskip, as he is more confident in
    himself and his abilities. Notable Attacks/Techniques: |-|Pre-Timeskip= *Hissatsu
    Shuriken Ryuu Seigun: Usopp fires a chain of several attached Shuriken which,
    when fired, separate into a large spread of shuriken to cover a wider radius.
    *Hissatsu Sakuretsu Saboten Boshi: Usopp fires a green pellet that explodes on
    impact and showers the victim with quills. *Hissatsu Kayaku Boshi: Usopp fires
    a highly explosive pellet filled with gunpowder. As Sogeking, this is called Sogeking
    Gunpowder Star. *Atlas Suisei: Usopp shoots four high speed Kayaku Boshi with
    smoke tails which converge together and hit a target. The arcs the four shots
    make resemble the horns of an Atlas Beetle. *Kaen Boshi: Usopp fires a pellet
    containing flammable substances, he sometimes throws bottles with flammable substances
    in them at the opponent just prior to this attack to increase the damage. *Hissatsu
    Fire Bird Star: Usopp fires what can be assumed to be a very strong Kaen Boshi
    in the shape of a massive phoenix, it also seems to summon a massive ring of fire
    once it makes contact. *Usopp Hammer: Using an ordinary work hammer, Usopp bashes
    his opponent on the head. Can be repeated many times for a stronger attack. *Usopp
    Pound: Usopp uses a massive and intimidating "5-Ton Hammer" to strike a target.
    Actually just two frying pans, a metal sheet and a stick – weighing 2 kg combined.
    *Usopp Golden Pound: A technique in which Usopp uses a "10-Ton Hammer". The hammer
    is almost identical to the five-ton hammer in appearance, but it is much larger.
    While the hammer looks intimidating, it is actually a giant balloon on a stick.
    *Impact Dial: A Dial that absorbs any blows directed to it and can release them
    back at the attacker. Usopp can thus use this to absorb a powerful blow such as
    Luffy''s Gomu Gomu no Bazooka and release it back at the original source or any
    other opponent. The downside is that the recoil from the released energy is akin
    to the original blow. |-|Post-Timeskip= *Haki: There are normally two types of
    Haki regular people can tap into: the Kenbunshoku Haki which allows individuals
    to sense the presence of others, and Busōshoku Haki which allows individuals to
    create an invisible armor around them. There is however a third type of Haki,
    Haōshoku Haki, that only a few individuals can use. Usopp is not one of these
    individuals **Kenbunshoku Haki: Usopp has only begun realizing his potential with
    this form of Haki. He was capable of sensing the presense of Luffy, Law, and Sugar
    from several kilometers away, but only with intense focus and determination. *Hissatsu
    Midoriboshi: Devil: Using Pop Greens, Usopp creates a large carnivorous plant
    which attacks his enemies. *Firework Flowers Usopp uses pop greens to create a
    small firework effects, the heat of which is said by Nami to be "searing". *Exploding
    Pine Cones Usopp shoots out a pinecone that detonates, creating many sphere-like
    explosions. *Midori Boshi: Bamboo Javelin: Usopp fires a large number of fast
    growing bamboo seeds. The bamboo shoots up out of the ground and injures the enemy.
    *Hissatsu Midori-Boshi: Skull Exploding Gra'
