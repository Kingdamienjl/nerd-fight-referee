  stamina:
    text: Superhuman (Has an immensely high endurance and recovery speed. Capable
      of lasting in brawls for nearly a dozen hours with no rest. During his more
      serious fights, Luffy has suffered life-threatening injuries that gave him severe
      internal bleeding and damage to his organs, and he could continue fighting with
      only moderate lapses. He only stops fighting when it is physically impossible
      for him to even move. He took several strikes from Rob Lucci that affected all
      of his organs and left him in a large puddle of his own blood, yet he could
      stand back up shortly after and withstand the same attack immediately after.
      After the Marineford War, Luffy suffered from severe physical and mental trauma
      due to the loss of his brother, his life-threatening injuries, and having to
      use adrenaline-based drugs more than once to keep fighting, only to merely pass
      out and go on a rampage several hours later immediately after going through
      surgery, and being in perfect condition some time after. During his fight with
      Charlotte Katakuri, Luffy had only slept for a few hours for the last days,
      and was vomiting blood, barely conscious, and taking a beating, yet could continue
      fighting quite effectively, which surprised his opponent. He is capable of fighting
      for over 13 hours despite having suffering severe injuries all over his body
      and shrugging off a fatal injury that tore off one side of his torso. Able to
      persevere with highly lethal poison coursing through his veins and with grave
      wounds. His endurance can be nearly completely restored instantly if he eats
      meat. Despite dying during his battle with Kaidou, he was revived by his Gear
      5th and was able to keep fighting, and even after taking many more hits from
      Kaidou and losing his Gear 5th form due to being on the verge of death, he managed
      to recover by beating his heart to the beat of a drum)
    source_ids:
    - vsbattles-luffy-gear-5-one-piece
    confidence: 0.75
  range:
    text: Tens of Kilometers (Luffy should be able to reach much further distances
      than his younger self. The range of his Haōshoku and Kenbunshoku Haki is much
      greater than ever before. Could split the skies in a Conqueror's Haki clash
      with Hybrid Kaidou25,628 Meters)
    source_ids:
    - vsbattles-luffy-gear-5-one-piece
    confidence: 0.75
  intelligence:
    text: Above Average in general. Genius combatant. He has displayed a myriad of
      different qualities of intelligence ranging from unique creativity to quickly
      comprehending difficult situations and events. This was born from his training
      with his grandfather Monkey D. Garp, and his upbringing with his foster brothers
      Portgas D. Ace and Sabo. Alongside Garp, Luffy learned how to survive. Alongside
      Ace and Sabo, Luffy learned how to fight. Raised in the harsh environment of
      Mount Culubo with his brothers, he got stronger and smarter every passing day.
      After the timeskip, he trained with the legendary Silvers Rayleigh and learned
      Haki, but he also learned how to use his abilities more efficiently. Luffy is
      extremely innovative and creative. As a child under the age of 6 years old,
      Luffy was forced to learn how to survive by getting thrown in ravines, being
      left in the wild alone and tied to balloons. Because of that, he taught himself
      how to hunt and cook meat to survive, showing his unnatural growth. When his
      ship was about to crash into Laboon, he shot a cannonball into the whale and
      used the recoil of its shockwave to stop his ship from colliding into Laboon.
      Luffy has been shown several times to create techniques on the spot by copying
      things that he has seen, whether it be an attack or an object. After seeing
      Genzo's pinwheel, Luffy made a technique inspired by it, where he uses all the
      force and weight of a sea beasts' huge body and spins it in a pinwheel formation
      to defeat several foes. He has great situational awareness, noticing a pole
      outside of a building in which he could stretch to dodge a plethora of daggers
      from Buggy. He used a rock in the ground to block a stab from Kuro. He threw
      a ship's mast at Krieg and stabbed Laboon with his own as well. He also stretches
      to retreat from fights occasionally, like when he took a small break from his
      raid on Enies Lobby to gain high ground in order to scout his enemies and his
      location, or when he grappled the top of Krieg's ship in order to dodge an explosion.
      He also noticed Buggy in a sandstorm and using him as a human shield in the
      heat of battle with the greatest swordsman in the world. He used a piece of
      a mirror in his hair to reflect Foxy's Noro Noro beams. During the wedding in
      Whole Cake Island, he planned to put a mirror inside a cake and thought of the
      plan to superimpose his image on a bunch of animals to use as a diversion to
      confuse Big Mom and her children. While fighting Rob Lucci, he showcased this
      to a far superior extent, using large throwable objects like boxes to block
      his field of vision. He was capable of reading his fighting style, switching
      from long range to short range and vice versa whenever he preferred to use a
      specific ability, whether it was the close range tekkai and shigan or the long
      range soru and rankakyu. Luffy created his own fighting style using the Gum-Gum
      Fruit, which consists of several different types of techniques ranging from
      regular strikes to slams, deflecting attacks, making opponents dizzy, using
      snap-back attacks that redirect the force of opponents to use back at them,
      and more. He has a prodigious aptitude for battle and keenly seizes the developments
      of fights to his advantage and doesn't waste any movements during battle. He's
      learned to mix that fighting style with Haki to bring out the best of his abilities.
      He created Gear 2nd, a transformation activated by manually doping his blood
      by pumping his legs and speeding up the blood flow, and Gear 3rd, a technique
      activated by pumping oxygen throughout his bones, both techniques taking advantage
      of his rubber body. Later in Dressrosa, he created Gear 4th, a transformation
      activated by blowing air into Luffy's muscles and covering them with Haki. Over
      the timeskip, Luffy developed a technique known as "Red Hawk", which is a tribute
      to his late brother who manipulated fire, where he could move his arm fast enough
      even while underwater for friction to light his arm on fire and burn victims
      from the inside. Luffy has the attitude of surpassing his enemies instead of
      just defeating them. This is attributed to his ability of reading the emotions
      of others, dubbed an "Absorptive power", allowing him to do many things from
      anticipating attacks to copying techniques by sight alone. He fights enemies
      by meeting them at full strength, and he uses their fighting style as food for
      growth. He was capable of copying the Soru technique just by seeing it once,
      even though the movement was superior to his reaction speed. He was able to
      dodge Blueno's attack from fresh out of a portal by anticipating his direction
      of movement. Luffy is capable of switching back and forth from his regular strikes
      and rubber attacks. He is great at guarding barrage attacks, like when he blocks
