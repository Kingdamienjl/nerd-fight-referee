  durability:
    text: 'At least Island level, possibly Small Country level (Took multiple Haōshoku
      Infused blows from Hybrid Kaidou, such as Ragnarok and Gundari Ryuseigun), higher
      with Busōshoku Haki (More durable than in his Base State. Blocked a Bolo Breath
      from Hybrid Kaidou with his hand. Can block numerous attacks from Hybrid Kaidou),
      far higher with Gear 4th: Boundman (Far more durable than before. Took Kaidou''s
