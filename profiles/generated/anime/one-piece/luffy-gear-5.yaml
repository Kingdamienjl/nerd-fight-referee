  attack_potency:
    text: At least Island level, possibly Small Country level (Should at least scale
      above a calc like this one, Using Busōshoku Haki, he is able to severely injure
      Dragon Kaidou. His Haōshoku Infusion clashed evenly and separated the heavens
      alongside Hybrid Kaidou's Haōshoku Infusion. Same Kaido who is relative to Yonkos
      like Whitebeard that can possibly shake the entire earth via vibrations from
      his quake fruit), far higher with Gears (His Gear 2nd matched Drunk Hybrid Kaidou
      with a headbutt. His Elephant Gun knocked down Dragon Kaidou. His Roc Gun damaged
      Hybrid Kaidou. His Roc Gatling clashed evenly against Kaidou's Gundari Ryuseigun.
      His Jet Culverin drew blood from and knocked back Base Kaidou. Gear 5th is Luffy's
      Awakening and grants him far greater physical strength than before, allowing
      him to make Dragon Kaidou bleed by slamming him into the ground), even higher
      with Strongest Attacks (His Over Kong Gun could seriously hurt Dragon Kaidou.
      Pummeled Hybrid Kaidou using his Hydra), far higher with Bajrang Gun (Luffy
      creates a colossal fist and launches it at high speed. Combines Busōshoku Emission,
      Haōshoku Infusion, Gear 4th's compression, and Gear 5th's expansion to match
      and eventually overpower Flame Dragon Kaidou's Kaen Daiko, allowing Luffy to
      punch Kaidou hard enough to break his horn and send him flying deep into the
      earth, ultimately defeating him, and causing an underwater volcanic eruption)
    source_ids:
    - character-stats-profiles-luffy-gear-5-one-piece
    confidence: 0.8
  speed:
