- id: claim-powers-and-abilities-1745d3d9
  section: abilities
  axis: hax
  text: 'Tier: High 6-C, higher with Winch Green Name: Vinsmoke Yonji, epithet "Winch Green" Origin: One
    Piece Gender: Male Age: 21 Classification: Human, Prince of the Germa Kingdom and a Commander of the
    Germa 66 Powers and Abilities: Superhuman Physical Characteristics, Skilled Hand to Hand Combatant,
    Cyborgization (Partial), Body Control (with Winch Guillotine), Statistics Amplification and Pseudo-Flight
    with his boots, Regeneration (High-Low: [https://imgur.com/a/vlbhKBh Germa possesses incredible regenerative
    skin, allowing them to heal from wounds that completely pierce their bodies, dislocated jaws and even
    many broken bones]), Resistance to Fire (with his Raid-Gear Equip), Blades and Blunt Force Trauma
    ([https://imgur.com/a/h9rPIHI Via their exoskeleton which grants them "iron bodies"]), Madness Manipulation,
    Mind Manipulation and Soul Manipulation via Willpower (Through sheer willpower they can resist losing
    their mind when absorbing shadows through the Kage Kage no Mi. Shadows belonging to strong willed
    people are difficult to control, allowing them to rebel against Moria''s pact which usually immediately
    submits a shadow to his supremacy and orders. Spiritual energy is contained within one''s soul/life;
    this energy is represented by the fighting power or the Haki itself. Those with strong souls, which
    are homologous to shadows, resist the effects of Brook''s soul manipulation) Attack Potency: Large
    Island level (Physically the strongest Germa Sibling, which makes him stronger than Niji, Ichiji,
    and Reiju), higher with Winch Green (Should be comparable to his siblings'' techniques) Speed: At
    least Relativistic+ (Tagged Daifuku''s Genie) Lifting Strength: At least Class T (Comparable to his
    siblings), higher with Raid Suit (His raid suit greatly increases his Lifting Strength. Subdued Charlotte
    Daifuku''s genie) Striking Strength: Large Island level, higher with Winch Green Durability: Large
    Island level (Scaling from his AP), higher with Raid Suit Stamina: Peak Human Range: Standard Melee
    Range Standard Equipment: Shape Memory Armor Intelligence: Gifted (As a member of the Vinsmoke family,
    Yonji is an expert assassin and a skilled military commander. In addition, he is an expert hand-to-hand
    combatant.) Weaknesses: Unwilling to help those in need. Very callous and stingy person Notable Attacks/Techniques:
    thumb|300px *Winch Green: Yonji''s bodily modifications have given him the title "Winch Green". He
    wears a device on his right forearm that can extend, allowing him to grab faraway objects and opponents.
    His hand possesses immense punching and gripping strength, allowing him to shatter objects as large
    as Charlotte Yuen''s massive staff orb and to grip the large heads of Yuen and Charlotte Daifuku''s
    genie with overwhelming strength. It is unknown if his left arm has the same abilities. **Black Bug:
    A combination attack between Ichiji, Niji, and Yonji. The three utilize their abilities and hit a
    single target with three synchronized strikes. It was first used to break Charlotte Perospero''s Candy
    Wall to allow Caesar Clown to escape from the Big Mom Pirates. **Winch Danton: Yonji grabs the back
    of his opponent''s head and swings them around, extending his forearm to increase the swing''s range
    and cause the opponent to hit other opponents and slam them into buildings with enough force to demolish
    them.'
  source_ids: *id003
  decisive: true
  status: unverified
