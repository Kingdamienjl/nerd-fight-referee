- id: claim-weaknesses-052bc975
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit user weaknesses. Even though he''s a fishman, he can''t move while submerged.
    Jack is extremely reckless (Attacked a Marine convoy that housed an Admiral, 3 Vice Admirals, a shipment
    of marines, and a former Fleet Admiral), loves destruction to the point that he refuses reasoning.
    Notable Attacks and Techniques Elephant-Elephant Fruit, Model: Mammoth: A Zoan Devil Fruit. The full
    mammoth form granted by this fruit gives Jack a massive frame, significantly increasing his already
    abnormal size. Jack can level buildings with a single swing of his trunk and leave imprints of his
    feet on the ground just by stepping on it. However, the user is extremely heavy and slow in this form,
    leaving him unable to dodge high-speed attacks.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
