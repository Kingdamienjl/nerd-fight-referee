- id: claim-powers-and-abilities-719c77f7
  section: abilities
  axis: hax
  text: 'Tier: High 6-C, higher with Poison Name: Vinsmoke Reiju, epithet "Poison Pink" Origin: One Piece
    Gender: Female Age: 24 Classification: Genetically Altered Human, Princess of the Germa Kingdom and
    a Commander of the Germa 66 Powers and Abilities: Superhuman Physical Characteristics, Expert Hand
    to Hand Combatant, Cyborgization (Partial), Poison Manipulation (Can integrate poison into her physical
    attacks), Regeneration (High-Low: [https://imgur.com/a/vlbhKBh Germa possesses incredible regenerative
    skin, allowing them to heal from wounds that completely pierce their bodies, dislocated jaws and even
    many broken bones]), Statistics Amplification and Pseudo-Flight with her boots, Has a bullet-proof
    cape, Durability Negation (Can send poison through people''s bodies), Poison Absorption (Capable suck
    the poison out of people) Resistance to Fire Manipulation (with her Raid-Gear Equip), Poison Resistance
    (Capable of eating highly toxic poison into her body with no consequences), Blades and Blunt Force
    Trauma ([https://imgur.com/a/h9rPIHI Via their exoskeleton which grants them "iron bodies"]), Madness
    Manipulation, Mind Manipulation and Soul Manipulation via Willpower (Through sheer willpower they
    can resist losing their mind when absorbing shadows through the Kage Kage no Mi. Shadows belonging
    to strong willed people are difficult to control, allowing them to rebel against Moria''s pact which
    usually immediately submits a shadow to his supremacy and orders. Spiritual energy is contained within
    one''s soul/life; this energy is represented by the fighting power or the Haki itself. Those with
    strong souls, which are homologous to shadows, resist the effects of Brook''s soul manipulation) Attack
    Potency: Large Island level (Although Yonji blocked her attack, she still sent him flying into the
    sea, and she shouldn''t be too inferior to him. Should be comparable to Ichiji), higher with Poison
    (Can coat her attacks in poison. Forced Charlotte Smoothie to drop Nami by kicking her) Speed: At
    least Relativistic+ (Kept up with her siblings during their blitz on the Charlotte family, while Yonji
    tagged Daifuku and Ichiji tagged Perospero) Lifting Strength: At least Class T (Comparable to her
    brothers. With a single hand, she grabbed a rampaging Luffy who was wreaking havoc in Whole Cake Chateau
    and effortlessly pulled him towards her), higher with Raid Suit (Her raid suit greatly increases her
    Lifting Strength) Striking Strength: Large Island level, higher with Poison Durability: Large Island
    level (Scaling from her AP), higher with Raid Suit (Scaling off of her AP) Stamina: Unknown Range:
    Standard Melee Range, Several Meters to Tens of Meters with poison. Standard Equipment: Shape Memory
    Armor Intelligence: Gifted (As a member of the Vinsmoke family, Reiju is an expert assassin and a
    skilled military commander. In addition to this she is a very capable hand to hand combatant) Weaknesses:
    Nothing notable Notable Attacks/Techniques: * Poison Pink: Reiju possesses an ability that has given
    her the name "Poison Pink". She is capable of sucking poison out of people through mouth-to-mouth
    contact and consuming it, while suffering no ill effect from the poison. She even considers the poison
    from the skin of the Armored Stonefish to be a delicacy, going as far as sucking the poison out of
    Luffy, just for the "treat". **Pink Hornet: Reiju releases a stream of toxic smoke from her mouth,
    which pierces through opponents, and leaves them poisoned.'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
