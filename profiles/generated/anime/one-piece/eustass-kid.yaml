- id: claim-powers-and-abilities-fce997f4
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Magnetism Manipulation (Can attract
    and repel metal at will) * Weapon Mastery * Haki (Haoshoku, Intermediate Kenbunshoku,
    Intermediate Busoshoku) * Cyborgization (Has a mechanical arm) * Body Control
    * Regeneration (Low; Was able to heal his body from serious injuries by just working,
    eating and sleeping) * Limited Levitation (Requires a magnetic object to pull
    himself towards) * Electricity Absorption (Faraday Cages can hold lightning based
    beings) * Metal Manipulation (He can manipulate metal to become as armor, create
    cages, weapons, etc.) * Damage Boost (by adding more metal to his attacks) Resistance
    to * Limited Power Nullification and Stamina Absorption (Has been shown to been
    capable of moving regardless of being affected by varying densities of Seastone,
    while low densities have been shown to completely incapacitate and drastically
    weaken others and stopping them from using their abilities) * Electricity Manipulation
    with Punk Rotten (His Punk Rotten casually blocked a lightning bolt from Zeus
    and forced the latter to move around it to attack Kidd) * Madness Manipulation,
    Mind Manipulation and Soul Manipulation via Willpower (Through sheer willpower
    they can resist losing their mind when absorbing shadows through the Kage Kage
    no Mi. Shadows belonging to strong willed people are difficult to control, allowing
    them to rebel against Moria''s pact which usually immediately submits a shadow
    to his supremacy and orders. Spiritual energy is contained within one''s soul/life;
    this energy is represented by the fighting power or the Haki itself. Those with
    strong souls, which are homologous to shadows, resist the effects of Brook''s
    soul manipulation)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
