- id: claim-weaknesses-2c7f47ee
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit users weaknesses. The main weakness of the fruit seems
    to be its dependence on the surrounding environment, which must contain metal
    in order for the fruit''s powers to be used. He''s a bit reckless and gets easily
    provoked. The scrap metal of his constructs is nowhere near as durable as he is,
    making it very easy for enemy attacks to destroy his constructs. His Awakened
    attacks and his Damned Punk both take a heavy toll on his stamina. Notable Attacks/Techniques:
    Jiki Jiki no Mi: A Paramecia-type Devil Fruit which allows the user to manipulate
    magnetic forces and control metal with them. It enables the user to generate magnetic
    fields that can either attract or repel metallic objects to and from their body
    as they please and gives the user a sufficient degree of control over their magnetism
    to accumulate a large amount of metallic objects on their body and form them into
    specific shapes; the user can then move these masses around very fluidly. This
    has been seen repeatedly with Kid, who has accumulated metal objects on his body
    to form normally-functioning apparatuses like mechanical arms, Gatling guns, and
    even exoskeleton-like fighting machines. Objects assembled with magnetism can
    maintain their structural integrity even after being separated from the user''s
    body. Since the majority of these creations consist of random pieces of scrap
    metal held together purely by magnetism, attacks that damage these creations typically
    do little against the user as they can just reform them with ease. *Repel: Kid
    holds out his open-palmed hand in front of a metal object approaching him and
    repels it back in the direction it came from. Kid can also repel a person if he
    covers a portion of their body in metal (which can include even his own prosthestic
    arm) beforehand, letting the repelled metal covering push them away. *Punk Gibson:
    Kid attracts metal pieces to his right arm to form a massive, makeshift arm. He
    then leaps into the air and slams his open metal palm into his opponent, crushing
    them. *Punk Pistols: Kid forms a giant harpoon gun out of metal pieces around
    his right arm, from which he is capable of rapidly firing metal spears at a target
    akin to a Gatling gun. *Punk Rotten: Kid attracts a large quantity of metal from
    his surroundings and shapes it in the form of a gigantic skull-faced demon-like
    golem made of scrap. The demon is composed of a floating torso with two disembodied
    arms, with Kid seating himself on its back and controlling it from there. Because
    it is made of random pieces of scrap metal, the demon can break down and be rebuilt
    as many times as Kid wants with his magnetic abilities, without major consequences
    to him. **Punk Vise: After forming Punk Rotten, Kid makes the golem crush a target
    with both of it''s hands. **Slam Gibson: Kid uses his golem''s arms to grab his
    opponent and slam them to the ground. *Punk Corna Dio: Eustass Kid uses his magnetic
    powers to pull in as much metal as possible and create a massive metal bull (even
    larger than the already-huge Big Mom), which he then has ram into his target.
    When he used this against a life-amplified Big Mom, the bull proved capable of
    breaking her bones with sheer blunt force, although it was destroyed when Big
    Mom blocked it with a large stone wall attached to her back. *Damned Punk: Eustass
    Kid makes a giant railgun using his magnetic powers, and proceeds to fire a giant
    laser that has the power to push Big Mom through the ground. This attack was strong
    enough to make Big Mom bleed and scream in pain, although it seems to exhaust
    Kid. *Awakening: Devil Fruit powers can, in rare occasions, be "awakened" (覚醒
    kakusei), increasing the abilities of the user. The details of how a Devil Fruit
    can be awakened are so far unknown, but the increased abilities have been seen
    to allow significantly more power, as well as new abilities, at the cost of exhausting
    the user. The effects of the awakening depend on the class of the Devil Fruit.
    For Paramecia-class powers, awakening can allow the power to affect even the surrounding,
    as opposed to the user''s body. Eustass Kid, with the Jiki Jiki no Mi, is confirmed
    to have awakened his Devil Fruit and has the ability to assign magnetic fields
    to any target he wishes, in effect making them living magnets. He also has the
    ability to "assign" a magnetic field to two different objects (one with an "S"
    on it and the other with an "N" on it) to make two objects magnetically pinned
    to each other. Haki: There are normally two types of Haki regular people can tap
    into: the Kenbunshoku Haki which allows individuals to sense the presence of others,
    and Busoshoku Haki which allows individuals to create an invisible armor around
    them. *Haoshoku Haki (Color of Conqueror): While not demonstrated, Kaido stated
    that Kid has this ability. *Kenbunshoku Haki (Color of Observation or Mantra):
    Kid has been shown to be adept in this ability as he could sense Luffy''s Haoshoku
    haki while the latter was on Onigashima''s'
  source_ids: *id003
  decisive: false
