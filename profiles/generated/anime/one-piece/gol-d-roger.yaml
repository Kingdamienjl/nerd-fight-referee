    center; background-color: #610000; color: #FFD700" " | Notible Attacks/Techniques
    |- |Haki: There are normally two types of Haki regular people can tap into: the
    Kenbunshoku Haki which allows individuals to sense the presence of others, and
    Busōshoku Haki which allows individuals to create an invisible armor around them.
    There is however a third type of Haki, Haōshoku Haki, that only a few individuals
    can use. Roger is one of these people. center|330px *Observation Haki: He''s one
    of the few users of the rare ability that allows its users to hear ''The Voice
    of All Things'' like Luffy. *Armament Haki: Roger''s one of the best Armament
    users shown to date, able to imbue his sword with Haki with Ryuo. Therefore, he''s
    able to use the rest of the abilities that come with its use. *Conqueror''s Haki:
    During his clash with Whitebeard 28 years ago they created a Conqueror''s Clash
    that generated a massive air blast around the island they were fighting in, proving
