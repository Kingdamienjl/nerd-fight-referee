  section: weaknesses
  axis: weakness
  text: Standard Devil Fruit users weaknesses. However, he can circumvent his weakness to water by using
    his candy to put a surface between him and the water. His candy is weak to fire and heat (such as
    Luffy's Red Hawk and Sulong Carrot's lightning), and will melt away. Is very smug and arrogant when
    he is winning, something which cost him his arm when his gloating let Pedro detonate his bombs and
    later led to his defeat when he mocked an injured Nekomamushi instead of killing him when he had the
    upper hand.
  source_ids: *id003
