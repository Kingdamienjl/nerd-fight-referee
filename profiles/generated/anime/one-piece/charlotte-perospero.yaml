  axis: hax
  text: Superhuman Physical Characteristics, Weapon Mastery, Haki (Kenbunshoku, Busoshoku), Candy Manipulation
    (Can create, manipulate and reshape any type of candy), Transmutation (Can turn others into candy
    by licking them), Forcefield Creation (Can create large barriers from candy), Resistance to Madness
