- id: claim-weaknesses-fb70bbe9
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit users weaknesses. If someone has her Vivre Card, a strong
    aura prevents Homies ("humanized" inanimate objects and non-sentient beings) from
    attacking that person, unless she''s very close to that said person. She can give
    into her cravings which lead her into a crazed bloodlust for what she wants to
    eat, which makes her unable to distinguish from friend or foe; due to being a
    picky eater in this state, she can get even weaker if she hasn''t eaten for a
    while (around 8 hours or so) until she gets a hold of the food she wants at the
    moment. Big Mom cannot steal the life of people who do not feel fear of death.
    Her body loses its toughness when she is in a psychological crisis. Zeus is so
    gluttonous towards thunderclouds that he would betray her for the person who fed
    him. Due to Prometheus being an animated, concentrated flame, he''s weak against
    water, unless he gets big enough to not be affected by it; but if he does get
    really big, his movements become sluggish. For a short while, Big Mom cannot control
    her Homies when the memories of the people who possessed the souls previously
    come rushing in. Her Homies need to be commanded verbally where they can hear
    her. Notable Attacks/Techniques: Soru Soru no Mi (Soul Soul Fruit): A Paremecia
    type Devil Fruit, this Devil Fruit allows her to interact with souls of sapient
    beings by taking a part or the entirety of their lifespans and then transferring
    them to other objects or non-sapient beings which "humanize" them. However, she
    is neither able to transfer the souls to corpses nor some other sapient individual.
    *Homies are objects and animals that have been anthropomorphized by Big Mom''s
    Soru Soru no Mi. Her Devil Fruit allows her to infuse the shards of a human''s
    soul into non-living objects which causes them to gain a life of their own and
    in animals, it gives them the ability to talk and behave like humans. They primarily
    exist in Totto where many homies happily serve their creator. Prometheus (Original).png|Prometheus
    the Sun Zeus (Original).png|Zeus the Cloud NapoleonN.png|Napoleon ProZeusCombat.png|Prometheus
    and Zeus in combat NapoleonS1.png|Napoleon as a longsword NapoleonS2.png|Napoleon
    as a cutlass *Prometheus (The Sun): Prometheus is one of three homies that possesses
    a soul fragment of Big Mom herself. He has the power to transform into a miniature
    Sun, and enhance Big Mom''s attacks with flame. He can carry Big Mom through the
    air and even fuse with her hair, giving it a blazing appearance. For being a ball
    of concentrated flame, he is immune to physical attacks even if they’re imbued
    with Busōshoku Haki. He can also sense Napoleon’s whereabouts. **Heavenly Feuer
    (天上の火 (ヘブンリーフォイアー) Hebunrī Foiā?, literal meaning "The Heavens'' Fire"): Big Mom
    grabs Prometheus and throws it at her target, creating a large, fiery explosion.
    It is powerful enough to hurt someone who is wearing a fire-resistant suit. *Zeus
    (The Thunder-cloud): Zeus is one of three homies that possesses a soul fragment
    of Big Mom herself. He has the power to transform into a thundercloud, fire lightning
    from his body, and enhance Big Mom''s attack with lightning. He can also carry
    Big Mom through the air, though his intelligence is ridiculously low. **Raitei
    (雷霆 Raitei?, literally meaning "Thunderbolt"): Big Mom summons Zeus around her
    left hand and then slams it down on her opponent, striking them with a massive
    bolt of lightning. **Zeus Breeze Tempo (ゼウスブリーズテンポ Zeusu Burīzu Tenpo?): Under
    the right conditions when Zeus eats Weather Eggs and significantly increases in
    size and a gust of wind is sent into him, a massive thunderbolt comes down and
    deal massive amounts of damage. *Napoleon (The Bicorne): Napoleon is one of three
    homies that possesses a soul fragment of Big Mom herself. He has the power to
    transform from a mere hat into a sword. He can also change the form of his blade,
    as well as the length. He can also ignite his blade with flames. He also can relay
    information from other homies telepathically. **Ikoku (威国 Ikoku, literally meaning
    "Mighty Nation"): Big Mom swings Napoleon with such force that she creates a shockwave
    that eradicates everything in its path. Big Mom refers to the attack as Spear
    of Elbaf. **Cognac ("Emperor''s Sword"): Napoleon in its cutlass form increases
    in size, and is ignited with flame. ***Shatter Sword: Big Mom swings Cognac into
    her opponent with great force, burning and slicing them. *Incarnations: The incarnations
    (化身, Keshin) are large, black, humanoid blobs who collect the Totto Land residents''
    biannual payment of a month''s worth of their lifespan. They are made from pieces
    of Big Mom''s own extremely powerful soul, and are themselves capable of extracting
    other people''s souls. They are intelligent enough to be capable of human speech
    and understand basic orders. *Weather Manipulation: Big Mom can manipulate and
    control the weather with Zeus the thunder cloud and Prometheus the sun, both being
    Homies. *Soul Pocus (魂への言葉 (ソウル・ポーカス) Sour'
