- id: claim-weaknesses-175fe40b
  section: weaknesses
  axis: weakness
  text: 'Can be reckless to the point of being suicidal at times. | His punches can
    be too strong for his body to handle, leading to his skin to tear and his bones
    to break. Can be killed if the one meter long and 10 centimeters wide area of
    his nape where his body resides is cut. The transformation can only be maintained
    for a limited time. Constant, wide-scale use of his Hardening can overwhelm him
    and make him weak. Repeated transformations in a short period of time lead to
    decreased control over the Titan form, diminished Titan size and power, and increase
    the risk of being absorbed into the titan itself and becoming a Pure Titan (Though
    these weaknesses appear to have diminished significantly after the time skip).
    Does not fully know how to use the powers of the Founding Titan. Founding Titan
    can only be activated if Eren makes physical contact with someone of royal blood
    (though weakness appears to have been circumvented since meeting Ymir Fritz) |
    His Founding Titan abilities can be deactivated if Zeke is killed. | His real
    head is inside the mouth of the titan, and can be easily slain if someone gets
    inside. Notable Attacks/Techniques: *Regeneration: Eren''s Titan form has demonstrated
    the ability to automatically heal any injury sustained in battle and also to regenerate
    entire limbs. His healing factor is fast enough to heal an entire lost hand in
    mere seconds to an entire arm in minutes. As with all Titan Shifters, Eren''s
    Titan form can regenerate entirely so long as his human body is undamaged. While
    in his human state, Eren can also regenerate entire lost limbs. After the time
    skip, Eren has demonstrated a mastery of this ability to the extent that he can
    restrain the regeneration of certain body parts, such as restraining regeneration
    on his left leg in order to disguise himself as an injured soldier. *Hardening:
    Eren''s Titan form has the ability to harden its body into a crystal-like structure
    which serves as a highly durable armor. By concentrating this ability in a specific
    area, such as his fists, Eren can increase the durability of his hardened limbs
    to the point of being able to break the Armored Titan''s armor without damaging
    his own. After the time-skip, Eren showed improved hardening abilities that allowed
    him to harden more of his skin, and the ability to harden fast enough to block
    the hardening web of the War Hammer Titan before its spikes could penetrate through
    his neck to his nape and kill him. Eren also has the ability to create a web of
    pillars that originate from his Titan body. The hardened pillars are incredibly
    durable, capable of preventing a cave-in, as well as shielding Squad Levi from
    the heat of Rod Reiss'' Titan form. The constructs, as well as Eren''s Titan,
    also retain their durability and hardened state even after he has been separated
    from his Titan body. *Creation: Ability provided by the powers of the War Hammer
    Titan, it allows the user to form objects from the ground, using the hardening
    ability. These objects can range from weapons such as a giant war Hammer, as well
    as large spike formations to coat the battlefield and attack the opponent from
    below. Eren can also manipulate his own Hardening with this ability, allowing
    him to grow massive spikes from his own body. *Remote Operation: Using the powers
    of the War Hammer Titan, Eren can create a body of a Titan to be remotely controlled
    from a distance, enabling him to regenerate his entire Titan body without sustaining
    any damage to his human form, as well as circumventing the typical weakness of
    the Titan''s nape. This is done by encasing himself in a hardening barrier and
    creating a cable of flesh from which he creates the Titan. *Founding Titan: With
    the power of the Founding Titan that Grisha Yeager stole from the Reiss family,
    Eren possesses the ability to control nearby Titans, causing them to relentlessly
    attack his chosen target. However, this ability can only be used while Eren is
    in contact with a Titan of royal blood. ==Notable Matchups== Victories: Losses:
    *Gon Freecss (Hunter X Hunter) Gon''s Profile (Post-Rumbling Titan Eren and Start
    of Chimera Ant Arc Gon were used. Speed was equalized) *Denji (Chainsaw Man) Denji''s
    Profile ("Post-Broadcast" Denji and "Post-Timeskip (Season 4)" Eren were used.
    Battle took in Marley. Speed was Equalized) *Homelander (The Boys) Homelander''s
