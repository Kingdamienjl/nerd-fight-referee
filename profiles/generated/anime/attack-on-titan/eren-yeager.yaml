- id: claim-powers-and-abilities-df381716
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Content= |-|Human= *Superhuman Physical Characteristics
    *Regeneration (Low-Mid) *Martial Arts (Eren is known for being one of the best
    martial artists in the series. During his time in the cadet corps, learning hand-to-hand
    combat was regular, and Annie taught him many of her martial art skills. Eren
    then excelled in hand-to-hand combat, ranking first place in the cadet corps,
    albeit likely due to Annie slacking off) *Skilled Swordsman *Social Influencing
    (Eren has influenced multiple people, changing their views and encouraging them
    to fight; notably, the 104th, including Jean. As a disguised soldier in Marley
    he encourages Falco, gaining his trust while manipulating and convincing him to
    send letters to Marley''s postal service. He persuades Ymir, who has been a slave
    for 2,000 years, to finally make her own choice) *Transformation (Into a Titan)
    *Clairvoyance (Can see the past in his dreams through the memories of the Attack
    Titan''s previous inheritors. Like all inheritors of the Nine Titans, its power
    allows the current user to view the memories of the previous holders. Eren has
    viewed his father''s memories multiple times, such as his entire life in Marley,
    images of Faye’s dead body, his killing of the Royal Family as the Attack Titan,
    Grisha confronting and begging to them beforehand, how he passed on both the Founding
    and Attack Titan to Eren. Can move back and forth freely through memories, as
    he travelled through his father''s memories) *Telepathy (Has a psychic link with
    all of Attack Titan''s previous inheritors, as stated by Zeke. This connection
