  intelligence:
    text: 'At least Gifted (During his time in the 104th Cadet Corps, Eren trained
      extensively in hand-to-hand combat, eventually becoming skilled in martial arts
      to the point that he had the best scores for hand-to-hand combat of the entire
      104th graduate squad. He received training with Reiner and Annie, which diversified
      his skill set to include the use of punches, throws, grapples, and submission
      locks. This skill carries over to his Titan form and has allowed him to defeat
      opponents larger than himself, such as the Armored Titan, besting him in fighting
      skill throughout all of their clashes. Reiner himself was capable of fighting
      against multiple simple-minded, past War Hammer Titans during the Battle of
      Heaven and Earth with remarkable finesse. After the time-skip, Eren has become
      a master manipulator, convincing Falco to deliver his letters to a postal service
      in order to notify his friends to infiltrate Marley, and then convincing his
      own father via the Paths into killing Frieda, all to ensure he would inherit
      the Attack and Founding Titans, and also activate the Rumbling) Feats: Show/Hide
