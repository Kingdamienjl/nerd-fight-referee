      planks by stomping them, and was able to stab a grown man so hard that the knife
      entered his back, pierced his heart and came out of his chest, however she is
      still notably inferior to Levi and Kenny. Rated 10 in Combat in the INSIDE &
      OUTSIDE guidebook), at least Building level with Swords (Superior to Reiner
      who cut off three fingers of the Female Titan), City Block level+, possibly
      Multi-City Block level with Swords boosted with ODM gear (Stronger than Eren
      and Hange, who both cut open The Colossal Titan. Damaged the Female Titan and
      both Ymir's and Porco Galliard's Jaw Titans), higher with Thunder Spears (Capable
      of shattering the Armored Titan's Hardened skin and damaged the War Hammer Titan)
