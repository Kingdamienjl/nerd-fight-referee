      Attack on Titan Gender: Male Age: 30''s Classification: Human, Ackerman'
    source_ids: &id002
    - mediawiki-7086
    confidence: 0.95
  attack_potency:
    text: At least Small Building level, likely far higher physically (Due to his
      Awakened Power as a result of being a member of the Ackerman Clan, Levi can
      partly manifest power comparable to that of a Pure Titan. Can harm Titans with
      kicks with assistance of ODM. Stronger than Mikasa Ackerman. Rated 11 in Combat
      in the INSIDE & OUTSIDE guidebook), at least Building level with Swords (Superior
      to Mikasa), City Block level+, possibly Multi-City Block level with Swords boosted
      with ODM gear (Stronger than Eren and Hange, who both cut open The Colossal
      Titan. Severely damaged and slashed completely through flesh of the Female Titan
      and Jaw Titan. Stomped the Beast Titan three times and was capable of slashing
      his arm to pieces), higher with Thunder Spears (Capable of shattering the Beast
      Titan's hardening and Armored Titan's hardened skin, and damaged the War Hammer
      Titan)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Superhuman, Subsonic with 3D Maneuver Gear (101 m/s), with at least Supersonic
      combat speed, short-burst speed, and reactions (Blitzed the Female Titan and
      the Beast Titan multiple times before they could react. Sliced the Jaw Titan's
      jaw muscles before he even knew he had been damaged. While in a crippled injured
      state he was capable of clashing against a past Jaw Titan's claw attacks)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 1 (Would need to be able to lift 7.1 times his body weight to be able
      to handle the force exerted on his body by the 3D gear, and since he weighs
      65KG according to the Attack on Titan Guidebook, this equals [461.5KG]. Described
      as humanity's strongest, making him stronger than Mikasa and everyone else in
      the Survey Corps)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At least Small Building level, likely far higher
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least Small Building level, likely far higher (Can survive the energy
      exerted on his body by the impact of landing at high speeds on solid surfaces
      with the 3D Maneuver Gear, which would yield 331,532.5 Joules. Took an attack
      from a weakened Female Titan but twisted his ankle. Took a Thunder Spear at
      point-blank range and survived, though with severe injuries)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Can use Vertical Maneuvering Equipment for hours despite it
      being known to be a taxing device to use in addition to remaining conscious
      after grazing blows from the Female Titan)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range. Extended Melee Range with blades, Several Meters with
      projectile blades, Tens of Meters with Vertical Maneuvering Equipment
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted. Due to being a member of the Ackerman clan, Levi has inherited the
      combined skill of every Ackerman that lived before him from his connection to
      the Path of the Ackermans. Renowned as "Humanity's Strongest Soldier," Levi
      is widely respected as the best user of Vertical Maneuvering Equipment. He has
      demonstrated such mastery with the Vertical Maneuvering Equipment that he was
      able to incapacitate the Female Titan on his own and subdued the Beast Titan
      on two separate occasions. Levi also uses a distinctive fighting style that
      involves holding his right sword backhanded with the blade facing out and being
      behind him instead of in front of him. By doing this, the blades cut in a circle
      around him, giving him the ability to utilize spinning attacks, which allows
      him to maintain momentum for relentless strikes while also enabling him to use
      his stamina and strength efficiently. Aside from his extraordinary battle skill,
      Levi has shown a profound ability to quickly analyze situations and make calculated
      decisions in the heat of battle, which has given him the ability to save himself
      and his comrades on many occasions, as seen when he understood fighting the
      Female Titan was a lost cause due to her hardening abilities and saved Mikasa
      when she recklessly tried to attack the titan's nape.
    source_ids: *id002
    confidence: 0.95
