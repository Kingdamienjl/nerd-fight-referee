      unleashing his hidden potential once again, which Vegeta previously admitted
      to be greater than his and Goku's powers, Gohan could easily overwhelm and ragdoll
      Super Saiyan 2 Goku. Requested Goku to fight him at full-strength, which prompted
      Goku to turn Super Saiyan Blue. Clashed evenly with Super Saiyan Blue Goku and
      forced him to use Kaioken to defeat him. Was stated by the narrator to have
      power that rivaled Goku's. Overpowered Koichiarator, who was able to take hits
      from Goku and Vegeta in their Super Saiyan Blue forms. Was able to trade blows
      with Super Maximum Light Speed Mode Dyspo in the Tournament of Power) | Low
      Multiverse level (Blocked a test punch from Base Piccolo and matched a suppressed
