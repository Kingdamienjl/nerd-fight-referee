      File:BrolyHatesEveryone.ogg ==Summary== {{Nihongo|Broly|ブロリー|Burorī}} is the
      fabled Legendary Super Saiyan, an extraordinary class of Saiyan that only appears
      once every thousand years bearing immense power. Born with an extraordinary
      power level of 10,000, Broly was stabbed by King Vegeta in his youth, who feared
      that he would be a threat to the throne and left for dead alongside his father,
      Paragus. But due to his extreme, latent power, Broly survived the assassination
      attempt and then the destruction of Planet Vegeta at Frieza's hands, escaping
      alongside his father and carrying a deep-seated hatred for another young Saiyan
      named Kakarot, who had ruined the few moments of normal life he had with his
      incessant crying. ==Powers and Stats
