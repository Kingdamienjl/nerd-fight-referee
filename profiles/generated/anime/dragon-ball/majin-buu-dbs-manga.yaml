    by any being lesser than a "God") Superhuman Physical Characteristics, Martial Arts Mastery, Longevity,
    Multiple Selves (Types 1, 2 & 3; Shares the body with Majin Buu and can take control at any time),
    Transformation (Can turn Majin Buu''s body into his original one and and is able revert the process
    as he wants), Acrobatics, Flight, Self-Sustenance (Type 1), Ki Manipulation (Master Level), Magic,
    Clairvoyance (Via Far-Seeing Arts), Enhanced Senses (Able to see far distances across the universe),
    Ki Sensing (Can locate others by reading their ki), Life Manipulation, Matter Manipulation, Physics
    Manipulation and Creation (As a Supreme Kai, he can create celestial bodies), Shockwaves Generation,
