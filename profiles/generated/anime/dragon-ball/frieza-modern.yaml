    notes: auto_repair source extraction
  attack_potency:
    text: 'Low Multiverse level, possibly higher (Is an organic being from the Planet
      Mobius. Dr. Eggman Robotnik''s ancestors, including the echidnas, evolved their
      physical strength to fight Mammoth Mogul''s almost limitless power gifted by
      the Chaos Emerald''s infinite energy,Sonic & Knuckles: Mecha MadnessMogul refers
      to a single Pre-Harmony Chaos Emerald empowering him as ‘near-limitless’. His
      strength greatly increased from his bonding with one, which individually contain
      infinite energy. By comparison- as described by echidna scientists prior to
      the Great Harmony- 11 Chaos Emeralds together were considered to achieve truly
      "limitless" power. with Chaos Emeralds being superior to the ore that powered
      Ultimate Annihilator. Can easily one shot SWATbots. Took hits from roboticized
      Dr. Eggman Mach 2, that knocked out Robo-Snively with one punch. Fought rage-powered
      Sonic on equal footing on 3 separate occasions), lower when organic (Even after
      becoming weaker after losing his robotic body, Dr. Eggman was still capable
      of at least somewhat hurting Sonic) His machines varies in Low Multiverse level,
      possibly higher (The Eggs-O-Skeleton matched Silver Sonic v1.0, who could squash
      Sonic with a stomp, with both of them being directly powered by Death Egg Mark
      1. Overwhelmed and beaten up Sonic the Hedgehog with the Egg Beater, which was
      stated to be the most powerful Mech Eggman built to date. Forced Sonic to go
      Super with the Egg Destroyer Battlesuit) to Complex Multiverse level (Can rewrite
      all of reality with the Super Genesis Wave. Fought with Super Sonic and Super
      Armor Mega Man with the Egg-Wily Machine X7-D), can bypass conventional durability
      in plenty of ways'
    source_ids:
    - vsbattles-frieza-modern-dragon-ball
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Unknown travel speed, Infinite reactions and combat speed (Robotnik Prime
      fought Sonic the Hedgehog [Prime] to the death faster than the explosion of
      the Ultimate Annihilator,Sonic Super Special issue #6; "For Whom the Bell Tolls"
      which blast reached beyond the infinite universe to reach all other Zones, infinite
      universes, in the infinite multiverse,Sonic Super Special issue #10; "Zone Wars:
      A Tale of Two Hedgehogs"The Complete Sonic Comic Encyclopedia; pg 134 with Dr.
      Eggman later on consistently being able to keep up with both of them. Dodged
