    limits of one''s body to greatly increase in strength, and it can be fired as
    blasts of energy or used to create defensive barriers. *Double Buster: A Full
    Power Energy Wave used against Goten in the World Martial Arts Tournament. It
    is the first energy attack Kid Trunks used in the series. *Big Tree Cannon: This
    attack is similar to Vegeta''s Final Flash, though scaled down in power. Trunks
    first performed it as Mighty Mask while fighting Android 18. *Fusion Dance: Can
