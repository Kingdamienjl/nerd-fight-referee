    text: Gifted (As the dictatorial ruler of much of Universe 7, Frieza is a clever
      and crafty commander who kept his iron grip on his territory by terror and strategic
      military deployment. In combat, he is an extremely skilled hand-to-hand combatant
      capable of fighting on par with the likes of Goku, even when playing around.
      He is well-versed in using ki, replicating and improving upon Krillin's Kienzan
