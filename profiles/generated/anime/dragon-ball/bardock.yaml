- id: claim-weaknesses-b56e946b
  section: weaknesses
  axis: weakness
  text: 'Though it is possible that Bardock trained the weakness away, he can become weakened and disoriented
    if his tail is grabbed or removed. He needs a moon in order to transform and cannot control himself
    as a Great Ape. Notable Attacks/Techniques: Ki: The martial artist''s fighting power and life force,
    a tangible energy derived from the user''s vigor, courage, and mind. It can be used in several ways,
    such as to surpass the limits of one''s body to greatly increase in strength, and it can be fired
    as blasts of energy or used to create defensive barriers. Along with his Saiyan blood, Ki acts as
    the source of Bardock''s incredible power and abilities. *Riot Javelin: Bardock''s signature attack,
    in which he gathers his ki into the shape of a sphere and launches it at his opponent. Saiyan Physiology:
    The physiology of a Saiyan, an aggressive warrior race of conquerors. Saiyans have the natural ability
    to control ki and fly. In addition, while his lifespan is comparable to a human''s, Bardock will remain
    at his peak strength for much longer. One of the most powerful abilities of a Saiyan is their ability
    to grow stronger and stronger through combat, allowing Bardock to constantly push his own limits during
    a fight and rise to higher and higher peaks in power. This ability grants a substantial boost in power
    when Bardock is badly injured, allowing him to reach a new level of power once he recovers. *Great
    Ape: When exposed to the full moon''s light, as long as he still has his tail, Bardock will transform
    into the Great Ape, a massive, gigantic monkey with far greater power. **Super Saiyan: The famous,
    legendary transformation of a Saiyan that allows them to greatly surpass their limits and reach the
    fabled state that is Super Saiyan. ==Gallery== File:Bardock manga colors.png|Bardock in the original
    manga. ==Notable Matchups== Victories: Losses: * Future Gohan (Dragon Ball) Future Gohan''s Profile
    (Base Post Zenkai Father of Goku Bardock and Manga Base Future Gohan were used. Speed was equalized
    and fight took place on Earth.) Inconclusive: ==References== {{scroll box|content={{reflist|2}}}}
