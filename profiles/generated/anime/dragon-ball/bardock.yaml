- id: claim-powers-and-abilities-d453c1cb
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics **Bodily Weaponry (Conventional; Via Saiyan TailDragon Ball:\
    \ Episode 34 \u2014 Cruel General Red) **Limited Space Survival (Saiyans are capable of surviving\
    \ and fighting in the depths of space,Dragon Ball Z: Episode 11 \u2014 Terror on ArliaDragon Ball\
    \ Z: Bardock \u2014 The Father of GokuDragon Ball Z: Episode 111 \u2014 Fight With PiccoloDragon Ball\
    \ Z: Broly \u2014 The Legendary Super Saiyan though not indefinitelyDragon Ball Z: Episode 105 \u2014\
    \ Mighty Blast of Rage) **Limited Longevity (Known intergalactically as the \"warrior race of the\
    \ universe\", Saiyans have evolved to remain young and battle-ready for decadesDaizenshuu 4 \u2014\
    \ World Guide: Racial Groups) ** Enhanced Senses (Awareness, Telescopic Vision & Smell; Saiyans have\
    \ exceptional senses, allowing them to locate small, distant objects by tracking their smell and see\
    \ clearly over long distances.Dragon Ball: Episode 16 \u2014 Find That Stone!Dragon Ball: Episode\
    \ 3 \u2014 The Nimbus Cloud of Roshi Saiyans can sense people throughout a village, even when they\
    \ are hidingDragon Ball: Episode 4 \u2014 Oolong the Terrible) ** Radiation Absorption & Empowerment\
    \ (Saiyans can absorb Blutz Waves into their bodies, which not only allows them to transform into\
    \ the Great Ape and Golden Great Ape for power boosts, spontaneously transforming without their Tails,\
    \ but also acts as literal energy for them to siphon and be empowered byDragon Ball GT: Episode 35\
    \ \u2014 Goku's Ascension) **Transformations (Can transform into a Great Ape, increasing his capabilities\
    \ drastically. Capable of changing into a Super Saiyan, which makes him even stronger than the form\
    \ of Great Ape) ***Large Size (Type 1) ***Breath Attack ***Light Manipulation (Super Saiyan forms\
    \ can generate light in pitch-black conditionsDragon Ball Z: Episode 223 \u2014 Next Up, Goku) *Master\
    \ Martial Artist **Acrobatics *Ki Manipulation (Master Level) **Flight **Explosion Manipulation (Capable\
    \ of detonating ki attacks) *Accelerated Development (Battle; Physical Stats, Abilities & Other -\
    \ Saiyans grow more powerful every time they fight and can become stronger in the midst of combat,\
    \ vastly increasing in strength whenever they are mortally injured,Dragon Ball Z: Episode 49 - The\
    \ Prince Fights Back and even upon being revived from the deadDragon Ball Z: Episode 102 \u2014 Duel\
    \ on a Vanishing Planet) *Information Analysis & Ki Sensing (Via Scouter; Can locate others by reading\
    \ their ki) *Precognition (Bardock can see into the long-term future through uncontrollable visions)\
    \ *Rage Power Resistance to: *Radiation Manipulation (Should be capable of absorbing over 17 Million\
    \ Blutz Waves to transform into a \u014Czaru without ill effects.Dragon Ball Z: Episode 31 \u2014\
    \ Saiyan Sized Secret Capable of fighting in the upper atmosphere, where radiation levels are exceedingly\
    \ highDragon Ball Z: Bardock \u2014 The Father of Goku) *Heat Manipulation, Electricity Manipulation,\
    \ Harsh Temperatures, Ice Manipulation, Sleep Inducement & Gravity Manipulation (As a Saiyan, he should\
    \ scale to Ginyu Arc Goku's innate endurance and natural defences) Limited Resistance to: *Poisons\
    \ (Should have a superior immune system to humans such as Launch, Roshi and Krillin, who survived\
    \ what typically would be fatal pufferfish poisoningDragon Ball: Episode 16 \u2014 Find That Stone!)"
