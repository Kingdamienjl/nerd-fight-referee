    \ Buu, and Kid Buu) ** Flight ** Breath Attack ** BFR (Shown here) ** Shockwaves Generation ** Danmaku\
    \ (Via Human Extinction Attack) ** Self-Destruction (Via Revenge Death Bomber) ** Ki Sensing (Can\
    \ locate others by reading their Ki) ** Dimensional Travel, Sound Manipulation, Portal Creation &\
    \ Space-Time Manipulation (At this level of power he can create dimensional rifts and destroy space-time\
    \ and pocket dimensions with his energy) * Air Manipulation (Can exhale with enough force to cause\
    \ severe, powerful winds) ** Attack Reflection (Deflecting the Transfiguration Beam with his Breath)\
    \ * Power Mimicry (Buu can copy techniques after seeing them once, copying Goku's Kamehameha and Kibito\
