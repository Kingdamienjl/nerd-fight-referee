  intelligence:
    text: Average, Above Average in combat (In modern times, Spinal lacks memory and
      purpose, and the only thing he can do is fighting. Back when he was alive, Spinal
      was considered a legendary warrior, and he retained his skill even after being
      resurrected. He is an excellent swordfighter and possesses several supernatural
      abilities to make his style even deadlier. He won the first Killer Instinct
      tournament and entered the second, where he lost. Even as Gargos' henchman in
      the ancient era, Spinal remains a formidable warrior, having the potential to
      defeat his own master and Kim Wu. Apparently he was a pirate in life, and his
      KI2 version should have some knowledge related to his profession)
