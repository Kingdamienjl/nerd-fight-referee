- id: claim-weaknesses-f6fe064a
  section: weaknesses
  axis: weakness
  text: 'Though physically some of the strongest in the universe, the Ginyu Force''s arrogant members
    priorities can provide roadblocks for overall efficiency. Performing their poses are of such personal
    importance that the loss of a Guldo had Recoome more worried about how their team pose would need
    to be altered. Aside from this, members have a habit of betting candy on fights and playing Rock-Paper-Scissors
    to decide the order they should fight in. Notable Team Attacks/Techniques: *Purple Comet Hurricane:
    By combining Burter''s Blue Hurricane with Jeice''s Red Magma, the two of them speed past their opponent
    multiple times before launching an array of ki blasts at their target while circling them. *Together
    We Are The... Ginyu Force!: The team''s signature group pose.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
