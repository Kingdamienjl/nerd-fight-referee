  range:
    text: 'Standard Melee Range; Planetary with ki blasts Teamwork: Due to constantly going from one mission
      to an other over the years, all members of the Ginyu Force have a great deal of experience as a
      unit and understand one another''s abilities very well. For example, when retrieving the Dragon
      Balls from Vegeta, Gohan, and Krillin, Ginyu effectively had Guldo and Burter use their signature
      abilities to nab them before they could react. Each member are loyal to their leader, never hesitating
      to follow Ginyu''s orders. The team as a whole are never seen fighting as one, often having one
      or two members attack a set of opponents at once. That said, Jeice and Burter share a close bond,
      as their attacks are the most synchronized of the group and will communicate with each other via
      Scouters should they be further apart. Ginyu and Jeice have also displayed coordination together,
      either attacking an opponent together, or splitting off so that Ginyu can take on a majority of
      enemies while Jeice deals with just one.'
    source_ids: *id002
    confidence: 0.95
  intelligence:
