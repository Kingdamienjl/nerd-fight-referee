  intelligence:
    text: Above Average overall, Gifted in combat strategy (Hit lives up to his title
      of "Never-Miss Hit", having gone over a thousand years without failing in a
      single assassination and killing his targets with a single blow. Though his
      skills mostly lie in the realm of assassination, leaving him lacking when it
      comes to non-lethal combat, Hit is an extremely skilled martial artist all the
      same, relying on his precision and finesse. His casual stance in battle, with
      his hands tucked into his pockets, allows him to conceal the movements of his
      fists in conjunction with his Time-Skip, leaving opponents incapable of properly
      reacting to his attacks as he suddenly strikes their vital points before they
      realize he's throwing a punch. Hit's no-nonsense approach to combat is incredibly
      effective, as he quickly and efficiently dispatches any threat with brutal yet
      graceful ease. He is also a gifted strategist when it comes to combat, as he
      skillfully lured Dyspo to the edge of the fighting stage and nearly made him
      drop out if not for Kunshi coming to his rescue; later he easily deceived Dyspo
      again, by using fake muscle movements, to make Dyspo unable to discern if he
      used Time-Skip or not, thus confusing Dyspo in battle. When he fought Jiren
      he constantly memorized Jiren strikes on his body, allowing him to land a successful
      blow and activate his Time Cage ability to suspend Jiren in time, despite the
      massive difference in strength)
