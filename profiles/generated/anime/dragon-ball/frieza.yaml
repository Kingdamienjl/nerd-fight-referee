      to Vegeta after his Zenkai boosts, and Ginyu Saga Goku even with Kaioken x4>540c), Massively FTL+
      combat speed in his Second Form (Kept up with Piccolo>1080c), higher combat speed in his Third Form
      (Easily toyed with and blitzed Piccolo>2160c), far higher combat speed in his Final Form at 50%
