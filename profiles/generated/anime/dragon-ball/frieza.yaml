      and dissipated Goku's Kaio-ken x20 Kamehameha with a single hand at 50%), higher at 100% (Traded
      blows with Super Saiyan Goku) | Large Star level (Much stronger than before)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Small Star level in his First Form, higher in his Second Form (Traded blows with Piccolo), far
      higher in his Third Form, Large Star level in his Final Form (Tanked a Kaioken x20 Kamehameha from
      Goku with only light injuries at 50% of his power, and went on to survive his Spirit Bomb), higher
      at 100% (Traded blows with Super Saiyan Goku) | Large Star level
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Frieza's endurance is extraordinary, as demonstrated in his long, painful battle
      with Goku. Even after taking a Spirit Bomb head-on, Frieza still had enough stamina to keep on going
      and fight against Goku as a Super Saiyan, powering up to 100% and matching him in power. However,
      due to Frieza's inexperience with the form, at 100%, Frieza's ki is rapidly drained. Even so, he
      can endure being severely injured during his fight with Goku and ultimately even being cut in half
      and blasted into Namek after being completely drained of ki, going on to survive its explosion)
