- id: claim-weaknesses-b1f427a7
  section: weaknesses
  axis: weakness
  text: Goku seeks strong opponents and therefore will allow his opponents to reach
    their full power for the sake of a good fight. Kaioken strains his body, causing
    him intense pain and exhaustion if he overuses it. His Spirit Bomb requires a
    long charge-up period, during which time he is vulnerable. Incapable of using
    Instant Transmission beyond a few meters due to his Child Body without amplification.
