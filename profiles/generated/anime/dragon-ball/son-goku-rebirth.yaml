  intelligence:
    text: 'Average generally. Extraordinary Genius in Combat: Although he lacks knowledge
      when it comes to things that aren''t related to fighting, Goku is a master of
      prodigal skill when it comes to martial arts, with years of experience fighting
      against powerful opponents with a plethora of abilities. As a child, he was
      able to beat martial artists on such a level as Grandpa Gohan, who was stated
      to be an unparalleled master in all martial arts on Earth, with martial arts
      in Dragon Ball exceeding real life towards Dan/Level 30 where there is only
      10. In his battle with Master Roshi, was able to copy and improve upon a technique
      on sight, later in that same battle once faced against the Sui-Ken, a martial
      art he couldn''t copy because he had never experienced inebriation, Goku generated
      and created his own style known as the "Crazy Fist" in response to perfectly
      counter it off the top of his head, with these styles even specifically noted
      to be a variation of Kenpo. At this point should be so skilled he''s beyond
      22nd World Tournament Roshi and Tien, the former of which having such mastery
      his movements, energy, and breathing have no ineffiency, and the latter being
      able to detect this merely via observation of scant attacks whilst his future
      foe was suppressed. Learned predictive movements and enemy reading in merely
      three days and was able to immediately apply it in combat. His skill when it
      comes to combat and the usage of Ki allows him to replicate other Ki-based techniques
      after seeing them once, and learned the training of the mind within a day, which
      takes battles that are dead even in all physical abilities, except stamina,
      which was above Goku''s, as well as all techniques go from even to utter defeats
      of the enemy. Eventually learned to make absolutely zero unnecessary movements,
      which is shown by creating absolutely no sound from bells that react to the
      tiniest movement. Honed his mind, body, and spirit in conjunction with each
      other for his martial arts. Should be more skilled than and effective at copying
      than Vegeta, who was able to replicate the Energy Sensory of the Z-Fighters
      by merely battling them, and their methods aren''t detectable by any known conventional
      means. He was the first to realize how much energy the Super Saiyan transformations
      unnecessarily drained and despite the drawback was the first to master the Super
      Saiyan state, making it highly efficient and subsidizing the need to reach a
      higher grade, which decreases speed as a side effect. He is a genius in combat
      and is capable of devising new applications of his techniques on the fly, such
      as using Kamehameha with his feet, and Goku''s training with King Kai was directly
      noted to be worth thousands of years of his prior accomplishments, experience,
      and skill. As a Saiyan, he has a natural sense for battle and adapts to it quickly.
      He as able to go toe to toe with Cell, a being created by the genius scientist
      Dr. Gero to be the ultimate warrior, taking the DNA and footage of every fighter
      on Earth and on Namek, copying their techniques, their mannerisms, and their
      skills to create him, including Goku himself, also having knowledge on how he
      approaches battle as well, down to real-time strategy, something that despite
      using an advanced supercomputer capable of creating machines that can destroy
      planets, stars, solar systems, genetic engineering, cellular alteration, hybrid
      creation, infinite energy reactors, and more still took about 20 years. Cell
      was even noted by others to perfect the martial arts and techniques of those
      who comprised him such as Tien''s Multiform Technique, removing their flaws,
      and yet Goku was able to face four copies of Cell whilst their physical ability
      was identical off of his own raw battle intelligence and skill. When Goku fought
      Androids 13, 14, and 15, who were made by the Backup Supercomputer, they had
      his full combat data on his fighting styles to predict him, and yet he could
      easily match them. Should be more skilled and rigorous in improving technique
      in training than Piccolo, who regularly utilizes perfect copies of himself to
      train with to hone all of his capabilities to their utmost extent. Fought and
      saw through all of the moves of the Sigma Force, who had combat data on all
      of his capabilities that allowed them to evade and punish all of his movements
      as well as knowledge of all their fighting styles. Goku is capable of seeing
      the holes, flaws, and errors in techniques and fighters after seeing or hearing
      of them, such as when he took advantage of the weaknesses within the Multiform
      Technique after experiencing a single beatdown, how he noticed Hachiyack''s
      sudden weakness at the 15 second mark of his Revenger Cannon Attack, the gap
      in the Thunder Flash and exploited it to take advantage of an opening, Frieza''s
      inability to sense Ki to create openings in his defenses, or Cell''s perfected
      combat to lure and lead the four fighters into a means of which he can defeat
      all at once. Identified that it wasn''t Haze'
    source_ids:
    - mediawiki-son-goku-rebirth
    confidence: 0.6
    notes: auto_repair source extraction
