- id: claim-weaknesses-5ba2e691
  section: weaknesses
  axis: weakness
  text: "None notable | Requires time to charge up Energy of Destruction attacks. Notable Attacks/Techniques:\
    \ *Justice On and Justice Tornado: After jumping onto his opponent's shoulder (Justice On) Toppo begins\
    \ spinning at an extremely high speed to disorientate them (Justice Tornado). *Justice Crusher: While\
    \ his adversary is distracted Toppo grabs their arm and dislocates their shoulder. *Justice Flash:\
    \ Toppo extends one arm, grabs it with another then unleashes a barrage of Ki blasts from his fingertips.\
    \ *Justice Rear Naked Choke: Toppo grapples his opponent from behind and starts to squeeze them until\
    \ all of their bones are broken or until they are rendered unconscious. *Hakai: Due to his status\
    \ as a God of Destruction Candidate, possessing a God of Destruction's full power, Toppo is capable\
    \ of erasing nearly anything with little effort, although he must charge this energy before using\
    \ it. By extending one of his hands in front of him and uttering \"Hakai\", Toppo causes the object\
    \ he focuses on to disintegrate, potentially erasing them from existence entirely. This is even shown\
    \ to work on spirits/souls, as it was used to kill Dr. Mashirito, who was a ghost. Toppo can also\
    \ use this energy to form an aura, erasing any attacks that get near him and making him extremely\
    \ difficult to damage. ==Notable Matchups== Victories: Kefla (Dragon Ball) Kefla's Profile Losses:\
    \ Goku Black (Dragon Ball) Goku Black's Profile (Super Saiyan Ros\xE9 Goku Black and Base Toppo were\
    \ used) Hit (Dragon Ball) Hit's Profile (Universal Survival Saga Hit and Base Toppo were used. Both\
    \ were bloodlusted) Inconclusive: ==References== {{Reflist}} == Notes/Explanations == {{Reflist}}\
    \ {{discussions}} Category:Characters Category:Dragon Ball Category:Acrobats Category:Aliens Category:Anime\
    \ Characters Category:Aura Users Category:Chi Users Category:Danmaku Users Category:Energy Users Category:Existence\
    \ Erasure Users Category:Extrasensory Perception Users Category:Flight Users Category:Forcefield Users\
    \ Category:Good Characters Category:Heroes Category:Homing Attack Users Category:Leaders Category:Manga\
    \ Characters Category:Martial Artists Category:Neutral Characters Category:Non-Physical Interaction\
    \ Users Category:Power Nullification Users Category:Space Users Category:Telekinesis Users Category:Antagonists\
    \ Category:Revived Characters Category:Acausal Characters Category:Corrosion Users Category:Soul Users\
    \ Category:Void Users Category:Causality Users Category:Dimensional Travel Users Category:Sound Users"
  source_ids: *id003
  decisive: false
