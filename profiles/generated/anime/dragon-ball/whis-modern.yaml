        Kirby series of video games named after him. The series has been running for
        over two decades, and nearly thirty titles have been released under Kirby's
        name, most of which are developed by HAL Laboratory, Inc. or published by
        HAL for co-developing studios. Kirby has been featured in his own anime series,
        many manga publications in several countries, and even an educational video
        co-starring Mario. The Kirby series is frequently merchandised by Nintendo,
        although most of its products are only released in Japan. Kirby lives in his
        dome-shaped home in Dream Land, a country on his home planet Planet Popstar.
        His adventures take him throughout Dream Land and occasionally into local
        star systems for various reasons, and he has saved his homeland many times.
