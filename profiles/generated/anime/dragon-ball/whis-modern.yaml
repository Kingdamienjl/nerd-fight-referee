        through the opponent and their attacks without being neither harmed nor stopped.
        ThunderHornBreaker.gif|Horn Breaker CallOfTheSky.gif|Call of the Sky {{!}}-{{!}}Throws=
        Thunder has access to two specific throws. With the first, he sweeps the opponent''s
