        the overall backstory have been made, and the references to Thunder''s age
        and the time which has passed point at him being younger. Combat Traits: |-|Notable
        Attacks/Techniques= {{#tag:tabber| {{!}}-{{!}}Command Attacks= *Horn Breaker:
