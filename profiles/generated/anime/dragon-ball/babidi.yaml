- id: claim-weaknesses-a9c5c922
  section: weaknesses
  axis: weakness
  text: 'Physically rather frail. Most of his spells require him to be able to speak (Buu stopped him
    from using his sealing spell by grabbing him by the throat). Word of God is that his forcefields are
    weaker against physical attacks than energy-based ones, pointing out how Piccolo was able to break
    it with his blows despite it protecting him from Buu and Vegeta''s explosive waves. Notable Attacks/Techniques
    *Manipulation Sorcery: By manipulating the evil in people''s hearts, he can take control of their
    minds, giving them a significant increase in power in the process. This can be resisted, however -
    the more good there is a person''s heart, the easier it is to resist. It is completely useless against
    those that are pure of heart. *Explosion Sorcery: Babidi can use a spell to explode beings or just
    make their heads explode. He uses this twice; once to explode Spopovich after he and Yamu have outlived
    their usefulness and once to explode the head of a human who gave him useless information. Since he
    never tried to use it to defend himself from Piccolo, it can be assumed it only works on weaker beings.
    *Teleportation: Babidi can teleport himself or others across interstellar distances (although he is
    also capable of transporting the entrance to the next level of his spaceship with them, possibly creating
    some kind of dimensional portal). *Telekinesis: Babidi has used this to make people explode. *Wizard
    Barrier: Babidi creates a forcefield. Feats: *Took over the mind of Dabura, a being stronger than
    Shin. *Could survive for an extended period of time with one arm and no legs. *Was able to teleport
    those on his spaceship across the cosmos. *Was able to survive Majin Buu''s and Majin Vegeta''s explosive
    waves with his barrier. *Easily killed Spopovich. Note: Babidi thinks of Bibidi as his father, but
    is really a clone created through magic. Him being Bibidi''s son was retconned.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-f4aa34af
  section: abilities
  axis: hax
  text: "Longevity, Flight, Magic, Telekinesis, Teleportation, BFR, Forcefield Creation, Explosion Manipulation\
    \ (Caused the head of a human who gave him useless information to explode), Mind Manipulation (Only\
    \ works on those with evil in their hearts), Statistics Amplification (Boosts the power of those he\
    \ controls), Sealing (Only for Majin Buu), Reality Warping, Telepathy, Limited Energy Absorption (With\
    \ Energy-Suction Device, must physically stab his target to drain them), Information Analysis (With\
    \ Energy Meter, can read people's Ki in Kili), Limited Clairvoyance (Can view people with his Crystal\
    \ Ball, but cannot use it to learn a person's location), Power Bestowal (Can give characters type\
    \ 2 immortality), Blood Manipulation and Limited Durability Negation (Magic; Via Explosion Sorcery,Daizenshuu\
    \ 4 \u2013 World Guide: Grapple which transmitted thoughts into the opponent causing the blood within\
    \ to convulse,Daizenshuu 7 \u2013 Dragon Ball Encyclopedia: Special Attack Dictionary rapidly swell\
    \ the body thus ultimately triggering an explosionDragon Ball Z - Chapter 253)"
  source_ids: *id003
  decisive: true
