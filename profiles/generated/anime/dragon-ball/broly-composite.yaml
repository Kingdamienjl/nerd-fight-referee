    text: 'Solar System level (Easily superior to Toeiverse 100% Frieza) | High Universe
      level (Destroyed large portions of the South Area even when restrained. This
      is backed up several times throughout the movie. It is also implied that Broly
      would later destroy the Northern Area. Each quadrant has infinite galaxies,
      making this feat High 3-A) | High Universe level (Much stronger than before,
      stated to be a threat to the universe itself, which is endless in size. Easily
      stomped Toeiverse Goku, Gohan, Vegeta, Future Trunks, and Piccolo) throughout
      their entire fight and became even stronger after his Zenkai leading up to Second
      Coming) | High Universe level (An upgraded version of Broly) | High Universe
      level (Was confident in taking on non-canon Super Saiyan 3 Goku and Vegeta at
      the same time) | High Multiverse level+ (Easily fought on par with Super Saiyan
      4 Xeno Goku, Super Saiyan 4 Xeno Vegeta, Super Saiyan 3 Beat, Super Saiyan 3
      Note, and Super Pikkon, with the heroes struggling heavily against him) | Multiverse
      level (Easily fought with non-canon Super Saiyan Blue Goku and Vegeta from Age
      779 at the same time. Knocked out Super Saiyan Blue Vegeta with little trouble.
      Could land a few blows on God Fusion Goku, but was outclassed) Speed]: Massively
      FTL+ | Massively FTL+ (Moved across the South Quadrant in a short period of
      time, which should put him at this speed) | Massively FTL+ (Much faster than
      before) | Massively FTL+ (Faster than before) | Massively FTL+ | Immeasurable
