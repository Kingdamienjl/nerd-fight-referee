  intelligence:
    text: 'Academically, Chi-Chi was the one who tutored Gohan since his youth and
      pushed him to become a scholar, meaning she should have comparable, if not superior
      intellect. In terms of combat, she is incredibly proficient in martial arts,
      having trained under her father the Ox-King, who previously studied under the
      invincible Turtle Hermit as his #2 disciple, second to Grandpa Gohan, since
      childhood. After training for years on end, waiting for her reunion with Goku,
      her skills became so refined that Roshi himself considered her to be a master
      of martial arts, praising her ability and even stating her style and technique
      resembled his own. In between the Cell Games and the Buu Saga, she also taught
      her son Goten kumite and the basics of martial arts, enough to impress the adolescent
      Gohan.'
    source_ids: *id002
