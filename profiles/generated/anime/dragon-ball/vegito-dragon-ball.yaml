  stamina:
    text: Superhuman (As a fusion of Vegeta and Goku, Vegito should have comparable
      stamina. He never tired in his "fight" against Buu, and his fusees have withstood
      extreme punishment and kept on fighting. However, given that his fusion can
      only last for an hour at most, his stamina is irrelevant as he will eventually
      defuse. As a jawbreaker, his stamina should be the same if not even higher due
      to Inorganic Physiology)
    source_ids:
