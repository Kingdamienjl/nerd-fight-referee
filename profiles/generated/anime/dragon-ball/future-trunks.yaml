  attack_potency:
    text: "Small Star level (After three years of solo training,Dragon Ball Z Side Story, \"TRUNKS THE\
      \ HISTORY - The Lone Warrior\" Trunks grew at least as strong as Future Gohan, despite previously\
      \ being outmatched by Gohan as a Super Saiyan, with Gohan even believing Trunks could surpass himself\
      \ in months training together. By the time of Frieza's invasion, Trunks was \"comparable to\" or\
      \ \"as strong as\" GokuDragon Ball: Le Manga de L\xE9gende / Dragon Ball: El Manga Legendario -\
      \ \"No. 32\" after his training on Yardrat), Large Star level as a Super Saiyan (After transforming,\
      \ Trunks' energy was misidentified as that of Super Saiyan Goku's.Dragon Ball Z Chapter 137 Sparred\
      \ equally with Goku. Exerting \"overwhelming strength\",Dragon Ball Extreme Battle Collection: Round\
      \ 2 Trunks instantly defeatedDragon Ball Volume \u2018F\u2019'Dragon Ball Z Chapter 138 and completely\
      \ erased Mecha Frieza,Dragon Ball Z: Resurrection 'F (2015)Dragon Ball Super: Super Hero (2023)\
      \ leaving Frieza's body beyond repair and reducing him to atoms,Dragon Ball Ch\u014Dzensh\u016B\
      \ 4: Super Encyclopedia - \"Character Dictionary\" leaving behind no trace. Displaying \"no mercy\"\
      \ and \"no hesitation\",Dragon Ball Super Exciting Guide: Character Volume - \"Character Collection\"\
      \ he single-handedly killed King Cold with \"one strike at the heart\", achieving a \"perfect victory\"\
      . Could survive against the Future Androids within three years of training, despite Future Gohan\
      \ being easily defeated) | Small Star level+, Large Star level as a Super Saiyan (Even after three\
      \ years of training,Dragon Ball Z Chapter 142 Trunks is \"not so different\" from Goku,Dragon Ball\
      \ Z Chapter 161 but is weaker than Vegeta.Dragon Ball Z Chapter 162 Could \"put up a decent fight\"\
      \ against the Future Androids) | Star level, Large Star level as a Super Saiyan (He was an immediate\
      \ threat to Semi-Perfect CellDragon Ball Chapter 380), far higher as a Super Saiyan Grade 2 (Far\
      \ superior to Semi-Perfect Cell with Super Saiyan Grade 2), even higher as a Super Saiyan Grade\
      \ 3 (Perfect Cell said that Trunks' Super Saiyan Grade 3 had greater raw power than his suppressed\
      \ stateDragon Ball Chapter 387, but Cell was much swifter, and had better coordination) | Star level,\
      \ Large Star level as a Super Saiyan (Held his own against a Cell Jr.)"
