  attack_potency:
    text: At least Multi-Solar System level (Far stronger than Tagoma, and easily
      defeated Super Saiyan Gohan with a barrage of Death Beams340 ExaFoe), Low Multiverse
      level in Final Form (Clashed with Base Goku3 Universes), higher as Golden Frieza
      (Slightly stronger than Super Saiyan Blue Goku, and managed to gradually overpower
      him before his stamina dropped) | Low Multiverse level (Eliminated Final Form
      Frost and easily overpowered the likes of Jimizu. Fought and matched Base Dyspo),
      higher as Golden Frieza (Equal to Super Saiyan Blue Goku at the start of the
      Tournament of Power. Fought Base Toppo alongside Android 17. Managed to eliminate
      Super Maximum Light Speed Dyspo with the help of Gohan and harmed them with
      his laser cage) | Low Multiverse level (Confirmed to have gotten much stronger
      since the Tournament of Power), higher as Golden Frieza (Somewhat fought and
      held his own against Super Saiyan Broly for an hour, and his attacks were sometimes
      staggering Broly and occasionally forcing him to dodge, which makes him far
      stronger than Super Saiyan Blue Goku and Super Saiyan Blue Vegeta, who with
      a combined surprise attack couldn't do any damage to Broly6 Universes)
    source_ids:
