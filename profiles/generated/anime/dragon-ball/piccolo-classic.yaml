  intelligence:
    text: Genius (Piccolo is an incredibly skilled and experienced fighter, growing
      further in wisdom and knowledge after fusing with Nail and then Kami. He is
      a strategic, careful fighter, playing dead to bait Goku into dropping his guard
      in their first fight, and acting like he was defeated to get information after
      Cell absorbed some of his energy and disabled his arm. He's also quite skilled
      at judging the strength and abilities of others and analyzing their abilities,
      quickly detecting that Vegeta's new power boost was insufficient against Final
      Form Frieza, that Goku wasn't at his best when he was fighting Android 19 and
      that Vegeta would be outlasted and defeated by Android 18)
