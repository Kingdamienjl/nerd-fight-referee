- id: claim-weaknesses-119afe4a
  section: weaknesses
  axis: weakness
  text: 'Yamcha can''t survive in the vacuum of space. Quite cocky and arrogant which
    Word of God states led to his death during the battle with the Saiyans. Notable
    Attacks/Techniques: Ki: The fighting power and life force of a martial artist,
    a tangible energy derived from the user''s vigor, courage, and mind. It can be
    used in a number of ways, such as to surpass the limits of one''s body to greatly
    increase in strength, and it can be fired as blasts of energy or used to create
    defensive barriers. *Kamehameha: The signature technique of the Turtle School,
    which Yamcha learned from Master Roshi. Charged and fired with both hands, it
    is a simple but powerful technique. *Wolf Fang Fist: Yamcha''s trademark attack.
    It is a very fast series of powerful punches, swipes, and kicks. Before the attack,
    a wolf''s howl can be heard, along with an aura around Yamcha. **Blinding Wolf
    Fang Fist: A one-hit variant of the Wolf Fang Fist. **Neo Wolf Fang Fist: An upgraded
    version of the Wolf Fang Fist. *Spirit Ball: One of Yamcha''s signature moves.
    He produces a concentrated ball of energy from his palm and is able to precisely
    control its directional pattern using two fingers to guide it. **Extra Large Spirit
    Ball: A much more powerful version of the Spirit Ball and is even bigger than
    Yamcha himself. ==Notable Matchups== Victories: *Omni-Man (Invincible) Omni-Man''s
    Profile (Cell arc Yamcha was used, battle took place on Planet Namek, Starting
    Distance was 10 meters, speed was equalized) Losses: Inconclusive: ==References==
