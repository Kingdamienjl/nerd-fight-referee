        while sparring with them. *Kiai: An invisible blast of Ki from the palm, used
        by Whis against Goku in Resurrection ‘F’. *Warp: A transportation technique
        used by Whis to allow himself and Beerus to travel between realms, and also
        through time. Using this technique Whis can move faster than anyone else in
        the universe. *I Won''t Let You!: Whis uses Pressure Point Attacks to render
        his opponents unconscious. He uses this when he karate chops Beerus at the
