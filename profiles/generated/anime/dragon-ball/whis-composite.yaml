    - field: weaknesses
      value: 'Due to Angel Law, Whis must remain neutral in mortal affairs, siding
        with neither good nor evil. He is strictly prohibited from fighting, interfering,
        or assisting in battles as it will result in him being erased by Grand Priest
        Notable Attacks/Techniques: *Afterimage Technique: Whis moves so quickly that
        he leaves an image of himself behind. Used to avoid Goku and Vegeta''s attacks
        while sparring with them. *Kiai: An invisible blast of Ki from the palm, used
        by Whis against Goku in Resurrection ‘F’. *Warp: A transportation technique
        used by Whis to allow himself and Beerus to travel between realms, and also
        through time. Using this technique Whis can move faster than anyone else in
        the universe. *I Won''t Let You!: Whis uses Pressure Point Attacks to render
        his opponents unconscious. He uses this when he karate chops Beerus at the
        end of the movie. Named in Battle of Z. **Strike of Revelation: Whis rushes
        at the opponent with Rapid Movement before appearing behind them to instantly
        incapacitate them for brief moment through a karate chop to the neck. *Mastery
        of Self-Movement: In this state, Whis''s body is capable of subconsciously
