      to Gotenks after his training in the Hyperbolic Time Chamber who is stated to
      be stronger than Vegeta), higher via Vice Shout (The Vice Shout is described
      as "only being usable to those with a high power level" which would imply that
      Super Buu became stronger when using this technique), Outerverse level+ with
      Gotenks absorbed1 layer (stated that he became the strongest Majin of all times,
