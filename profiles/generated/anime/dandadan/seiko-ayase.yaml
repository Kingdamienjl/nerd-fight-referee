- id: claim-powers-and-abilities-6194ee7a
  section: abilities
  axis: hax
  text: "Base= Superhuman Physical Characteristics, Aura, Skilled Fighter, Extrasensory Perception (Can\
    \ see and sense spirits. Perceiving the danger far from her. She can see Okarun in Astral form, while\
    \ many other psychic or spiritual people are unable to see), Clairvoyance with Crystal Ball (Augur\
    \ Idol Shoma correctlyDandadan, Chapter 3), Forcefield Creation, Fire Manipulation, Limited Paralysis\
    \ Inducement (Using the slidable pencil tip at the top of Nessie, Seiko draws a large circle on the\
    \ ground and places a charm nail to create a barrier. When the charm nail is placed within the drawn\
    \ circle, Seiko can create a barrier that protects her from any evil spirits that might attack her.\
    \ When placed on the outside of the drawn circle, Seiko can trap the evil spirit and leave them at\
    \ her mercy. The lethality of the barrier can increase if more than one nail is placed on the ground.\
    \ Seiko was also able to use the barrier for offense by placing one on a brick and using it as a throwing\
    \ weapon to stop a possessed Okarun from eating MomoDandadan, Chapter 3), Sealing (Disabling a curse\
    \ with an TalismanDandadan, Chapter 3), Non-Physical Interaction, Purification (Type 2. A harisen\
    \ that is capable of driving out evil spirits sealed within a personDandadan, Chapter 11), Reality\
    \ Warping (Seiko is able to harness the Power of Words, referring to the power to alter reality through\
    \ one's words that are said with conviction behind themDandadan, Chapter 85), Blessed (Her barrier-building\
    \ power came from the gods of the land)\u200B |-|Resistances= Resistance to Soul Manipulation (Clothing\
    \ that act somewhat like bulletproof vests for spirit mediums when trying to protect oneself from\
    \ evil spiritsDandadan, Chapter 4), Energy Manipulation & Aura Manipulation (People and yokai with\
    \ paranormal abilities or spiritual power are able to survive being eaten by a yokai. When an ordinary\
    \ person is eaten by a yokai, it causes their aura, which is the battery needed to sustain life, to\
    \ disappear and results in their death)"
  source_ids: *id003
  decisive: true
  status: unverified
