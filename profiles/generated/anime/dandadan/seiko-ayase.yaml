  section: weaknesses
  axis: weakness
  text: 'Her Barrier magic is borrowing the power of the god that lives in this region. She can use the
    power of other realms by borrowing power from the gods of that realm and staying in the region for
    3 days to give thanks to the gods. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
