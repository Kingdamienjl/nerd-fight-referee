- id: claim-standard-equipment-b074b7bc
  section: equipment
  axis: equipment
  text: '*Nessie + Charm Nails: Using the slidable pencil tip at the top of Nessie, Seiko draws a large
    circle on the ground and places a charm nail to create a barrier. When the charm nail is placed within
    the drawn circle, Seiko can create a barrier that protects her from any evil spirits that might attack
    her. When placed on the outside of the drawn circle, Seiko can trap the evil spirit and leave them
    at her mercy. The lethality of the barrier can increase if more than one nail is placed on the ground.
    Seiko was also able to use the barrier for offense by placing one on a brick and using it as a throwing
    weapon to stop a possessed Okarun from eating Momo. *Talisman: Talisman that are capable of warding
    off evil spirits from a residential area. Seiko is shown to have placed at least two around her home.
    *Nessie: Seiko wields a bat with the words "Power of Nessie" engraved as her signature weapon. The
    bat gets its name from the Loch Ness Monster after Seiko asked Momo in the past as to who she thought
    was the strongest creature in the world was in order demonstrate how to use the Power of Words on
    a sandbag. Coupled with Seiko''s impressive strength, the bat can cause great damage to opponents,
    and with the Power of Words applied, she can send her targets flying effortlessly with one swing.
    The bat also has a slidable pencil tip used for Seiko''s barrier magic. *Crystal Ball: A crystal ball
    that she uses to perform her clairvoyance ability. *Spirit Medium Robes: Clothing that act somewhat
    like bulletproof vests for spirit mediums when trying to protect oneself from evil spirits. *Harisen:
    A harisen that is capable of driving out evil spirits sealed within a person.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
