- id: claim-weaknesses-1680a7d3
  section: weaknesses
  axis: weakness
  text: 'The body of each warrior from the Organization has an incurable midline incision which needs
    to be stitched regularly to prevent their internal organs from spilling out. Like Deneve, Helen is
    not as strong as Clare or Miria, she often only acts as a distraction when facing much stronger foes.
    She often makes frivolous decisions amid a precarious situation. Notable Attacks/Techniques: *Stretching
    Appendages: She can stretch her limbs to extraordinary lengths and use it as a projectile and control
    the angle and change the trajectory etc. Her arm has shown the elasticity needed to hold down huge
    monsters and regain the shape and the strength to tear through buildings as well as aiding her in
    reaching targets and doing multiple damages. *Tornado Sword: In conjunction with her stretching powers,
    Helen can twist her appendages and release the resulting force as a drill. ==Notable Matchups== Victories:
    Losses: Inconclusive: {{discussions}} Category:Characters Category:Claymore Category:Anime Characters
    Category:Chi Users Category:Demons Category:Elasticity Users Category:Female Characters Category:Good
    Characters Category:Heroes Category:Hybrids Category:Manga Characters Category:Martial Artists Category:Monster
    Girls Category:Shapeshifters Category:Sword Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
