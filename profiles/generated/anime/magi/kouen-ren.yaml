- id: claim-weaknesses-07be1598
  section: weaknesses
  axis: weakness
  text: 'Overusing his magoi reverts him back to base. Feats: Has created volcanoes (City level) Notable
    Attacks/Techniques: right|300px|Astaroth Astaroth: Kouen''s most used vessel. Kouen can equip Astraoth,
    which then gives Kouen an overall increase in power, flight and fire attributes and fire and heat
    absorption. * Explosive Sword: His sword explodes and implodes whatever it strikes, being large enough
    to destroy 6 black djinn *Extreme Magic: A metal vessel user''s strongest attack. *Astor Inqerad (Flying
    White Flash Dragon from Purgatory): Kouen summons a giant white dragon that has inextinguishable flames.
    right|300px|Agares Agares: Kouen''s second vessel. Kouen can equip Agares, which then gives Kouen
    an overall increase in power, flight and earth attributes. *Earth Manipulation: Kouen can manipulate
    the earth to throw massive pillars or shoot out large earth spikes *Volcanos: Kouen can pull out earth
    pillars that can create volcanoes with Agares that cause massive damage and also work as great recharger
    for his fire based vessel. Phoenix: One of Kouen''s vessels. There isn''t much known about this metal
    vessel other than it can heal and has the ring of admonition. *The Ring of Admonition: Using Phenex''s
    power Kouen puts inside the target''s body an Egg that is warmed by target''s bloodlust. In the moment
    the enemy has concrete intention and confidence, the egg cracks to create magic ring around his head
    and isolate bloodlust from his body. If the target is trying to move while the nerves are being sealed,
    the curse may leave him in agony *Organ/Limb Transfer: Kouen can transfer organs or limbs from one
    person to another ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions}} Category:Characters
    Category:Magi Category:Absorption Users Category:Acausal Characters Category:Anime Characters Category:Curse
    Users Category:Earth Users Category:Energy Users Category:Explosion Users Category:Fire Users Category:Flight
    Users Category:Healers Category:Humans Category:Magic Users Category:Male Characters Category:Manga
    Characters Category:Mind Users Category:Royal Characters Category:Sealing Users Category:Summoners
    Category:Sword Users Category:Weapon Masters Category:Adults Category:Weapon Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
