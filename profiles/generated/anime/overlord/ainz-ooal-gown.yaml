  intelligence:
    text: 'Gifted (An expert strategist in combat, Ainz always tries to fight with knowledge of his enemy,
      and doesn''t underestimate his opponents. Unless he knows for sure that the enemy is no threat,
      he will usually start the battle with instant death spells like Grasp Heart, and will be quick to
      use his other powerful abilities depending on the situation.) Standard Tactics: As an arcane magic
      caster, Ainz does his best to fight his opponents at range, only tending to close the distance when
      he has frontliners covering for him or a spell requires him to be closer. As a necromancer, Ainz
      is able to summon many kinds of undead which he will use to support himself in battle, such as by
      summoning undead to act as his frontliners, distractions, damage support, etc.Overlord; Vol 3; Chapter
      5Overlord; Vol 14; Chapter 4 Ainz won''t just rely on his summons to protect him, and makes sure
      to cast buffs whenever he can, being proficient in applying buffs himself even in the middle of
      combat.Overlord; Vol 13; Chapter 5 When engaged in a proper fight Ainz will start with his Time
      Stop spell, knowing full well how important Time Stop countermeasures are, as well as being able
      to use it as a chance to investigate his opponent''s potential weaknesses.Overlord; Vol 7; Chapter
      4Overlord; Vol 9; Chapter 4Overlord; Bonus Volume; Chapter 2Overlord; Bonus Volume; Chapter 4Overlord;
      Volume 9 Author''s Thoughts Excerpt Unless his opponent is one which he believes to have resistance
      to Instant Death effects by default, such as an Undead or Golem, Ainz will likely follow up with
      one of his Instant Death abilities due to Necromantic abilities being his specialty, with his favorite
      being Grasp Heart.Overlord; Vol 9; Chapter 4 However, Ainz is also largely reactionary, using whatever
      spells and tactics fit the situation and what he wants to accomplish, such as attempting to use
      the less conventional spell Greater Break Item on Riku''s various weapons in the midst of combat,
      or repeatedly using Perfect Unknowable for hit and run tactics during his fight against Wrath and
      the doppelganger Pleiades to deplete their numbers.'
    source_ids: *id002
    confidence: 0.95
