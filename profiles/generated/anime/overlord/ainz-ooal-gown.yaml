- id: claim-weaknesses-bec24417
  section: weaknesses
  axis: weakness
  text: "Ainz is naturally susceptible to the holy and fire elements, but can negate one of those weaknesses\
    \ depending on his choice of gear. Because of class restrictions, Ainz normally cannot equip most\
    \ weapons and armor, but he can get around this restriction by using gear made by Create Greater Item\
    \ or by using Perfect Warrior to temporarily change into a warrior class. He takes extra damage from\
    \ bludgeoning attacks, and The Goal of All Life is Death has a cooldown of exactly 100 hours. Additionally,\
    \ Ainz\u2019s spells can be interrupted by enemy attacks unless he uses the Silent Magic modifier\
    \ Notable Attacks/Techniques: |-|Racial Abilities and Traits={{#tag:tabber| Racial Abilities and Traits=\
    \ *Ability Damage \u2163 *Arcane Vision/See Invisibility *Acid Immunity *Black Halo *Bludgeoning Vulnerability\
    \ \u2164 *Cold Immunity *Create High Tier Undead (up to 4/day): Ainz can create upper tier undead\
    \ with this skill, though the highest level they would be is level 70. However, if he divides it up\
    \ into just two uses, he can create undead that roughly reach level 90, such as an Eternal Death or\
    \ Eyeball Corpse.Overlord; Vol 12; Chapter 1 *Create Middle Tier Undead (up to 12/day): Ainz can create\
    \ middle tier undead with this skill, such as a Death Knight, Jack the Ripper, or Soul Eater. *Create\
    \ Low Tier Undead (up to 20/day): Ainz can create low tier undead such as Wraiths or Bone Vultures\
    \ by using this skill. *Dark Soul *Dark Wisdom: Allows the user to learn a single spell from the corpse\
    \ of an individual. This allows Ainz to know far more spells than is usually possible; he can even\
    \ learn and use holy spells. *Dark Vision: Allows uninhibited sight even in total darkness. *Despair\
    \ Aura I: Causes Fear. *Despair Aura II: Causes Panic. *Despair Aura III: Causes Confusion. *Despair\
    \ Aura IV: Causes Insanity. *Despair Aura V: Causes Instant Death. *Doubled Damage from Fire *Eating,\
    \ Drinking, and Breathing are Unnecessary *Electrical Immunity *Good, Light, and Holy Vulnerability\
    \ \u2163 *Heal from Negative Energy *High Tier Magic Immunity III: Nullifies all spells 6th tier and\
    \ below. *High Tier Physical Immunity III: Nullifies all attacks that are below level 60. *Immunity\
    \ to Critical Hits *Immunity to Death Effects *Immunity to Disease Effects *Immunity to Energy Drain\
    \ Effects *Immunity to Mind-Affecting Effects *Immunity to Paralysis Effects *Immunity to Poison Effects\
    \ *Immunity to Sleep Effects *Negative Energy Touch: Ainz can inflict negative energy on anything\
    \ he touches with this skill, causing damage to opponents and lowering their speed and strength. Acquired\
    \ by Elder Lich level up. Can toggle On/Off. *Negative Protection *Piercing Damage Resistance V *Resistance\
    \ to Necromancy *Slashing Damage Resistance V *Speak Evil Tongues *Turn Resistance III: Protects Ainz\
    \ from Turn effects, which can dominate and disintegrate undead *Undead Blessing: Allows Ainz to sense\
    \ other undead beings. *Unholy Protection *Vulnerability to Holy and Good Consecrated Areas II {{!}}-{{!}}\
    \ Undead Summons= ==High Tier Undead== Doom Lord: A level 70 melee specialized undead. It wears a\
    \ rusted crown atop its head, with a blood-stained cape hanging off his back. Its full plate armor\
    \ is adorned with multiple scythe-like curved blades, carrying a War Scythe wreathed in Negative Energy.\
    \ Its health is constantly decreasing, a penalty for the unthinkably high agility for its level. ===Skil"
