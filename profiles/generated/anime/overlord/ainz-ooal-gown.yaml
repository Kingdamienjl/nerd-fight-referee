  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Immortality (Types 1 and 7) *Self-Sustenance (Types 1,\
    \ 2 and 3) *Aura (Via Despair Aura) *Master Swordsmanship *Stealth Mastery *Preparation *Non-Physical\
    \ Interaction (Can cause damage to intangible and incorporeal targets with magic and magic weapons)\
    \ *Social Influencing (Is noted to be extremely charismatic and regularly makes people overestimate\
    \ his intelligence, though this is entirely unintentional and usually unknown to him. His charisma\
    \ made Neia Baraja incredibly worshipful of him) *Enhanced Senses (Can see through invisibility.Overlord;\
    \ Vol 11; Chapter 2 Possesses Dark Vision, allowing him to see clearly in darkness.Overlord; Vol 2;\
    \ Chapter 1) *Extrasensory Perception (The skill Undead Blessing allowed Ainz to sense all the undead\
    \ within the Frozen PrisonOverlord; Vol 3; Chapter 3) *Invulnerability (Unaffected by non-magical\
    \ attacks,Overlord; Vol 8; Side Story 2Overlord; Vol 13; Chapter 5 though environmental damage such\
    \ as an avalanche circumvents it.Overlord; Bonus Volume; Chapter 4 All physical attacks from those\
    \ under level 60 are nullified.Overlord; Vol 1; Chapter 5 Unaffected by piercing damage, such as being\
    \ stabbedOverlord; Vol 14; Chapter 4) *Limited Intangibility (Having a resistance to Movement Hindrances/Physical\
    \ Impediments allows one to pass through restricting material such as a net) *Power Nullification\
    \ (The skill High-Tier Magic Immunity nullifies all spells from the 6th tier and below.Overlord; Bonus\
    \ Volume; Chapter 1) *Statistics Reduction (1 Layer Via The Staff of Ainz Ooal Gown (Despair Aura)\
    \ ~ Despair Aura I reduces the stats of those affected. The spell Slow reduces the speed of the target.\
    \ Negative Energy Touch reduces the strength and speed of targetsOverlord; Vol 10; Chapter 3) *Resurrection\
    \ (Can resurrect others. One of his rings allows him to resurrect at least once) *Healing (Has Healing\
    \ Potions in his inventory) *Dimensional Storage (Ainz has a pocket dimension, his inventory, where\
    \ he can store items within and retrieve them) *Clairvoyance (The Mirror of Remote Viewing can display\
    \ an image of specific regions. Has several scrolls that contain Divination spells, such as Locate\
    \ Object, Detect Locate, and Clairvoyance) *Empathic Manipulation, Fear Manipulation (1 Layer Via\
    \ The Staff of Ainz Ooal Gown ~ Despair Aura I inflicts the Fear status. Despair Aura II inflicts\
    \ Panic, causing those afflicted to want to flee from the caster at all costs, unable to take any\
    \ combative actions against themOverlord; Vol 10; Chapter 3) *Madness Manipulation (1 Layer Via The\
    \ Staff of Ainz Ooal Gown ~ Despair Aura IV inflicts insanity on a foe which can only be removed by\
    \ a third party) *Reality Warping (With Shooting Star he can cast Wish Upon A StarOverlord; Vol 3;\
    \ Chapter 3) **Purification (Ainz can use Wish Upon A Star to remove status effects) **Power Absorption\
    \ (Ainz could use Wish Upon a Star to steal Nfirea\u2019s Talent) |-|Spel"
