- id: claim-weaknesses-4b34d32c
  section: weaknesses
  axis: weakness
  text: 'None notable Feats: *Is Meta Knight''s choice weapon to fight Kirby with. *Meta Knight used the
    sword to defeat King Dedede. *Kirby uses the sword to defeat Dark Mind. *Dark Meta Knight''s copy
    is a huge threat to Meta Knight, Kirby, and King Dedede. *Deals devastating damage to Dark Matter
    in Kirby Quest. *Meta Knight used the sword to single-handedly defeat powerful foes like Dyna Blade,
    Galacta Knight, Susie, President Haltmann, clones of Dark Matter and Queen Sectonia, and Morpho Knight.
    *Meta Knight assists Kirby in defeating Francisca, Flamberge, Zan Partizanne, Hyness, and Void Termina
    with it. Notable Attacks/Techniques: ===Skill set from Master (Ability)=== *Sword Slash: A simple
    sword slash. *Multi Sword Slash: The wielder swings the sword many times in quick succession. *Up
    Thrust: The wielder points the sword upwards before stabbing everything above. *Sword Spin: The wielder
    spins vertically in the air with the sword. *Drill Rush: The wielder drills forward at amazing speeds.
    *Sword Beam: The wielder fires a powerful beam from Galaxia. *Down Thrust: The wielder drops down
    sword first. *Sword Slide: The wielder slides forward, sword extended. *Final Cutter: The wielder
    leaps in the air, flips, and slams the sword down, creating a shockwave. Every part of this move is
    powerful. ===Knightmare'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
