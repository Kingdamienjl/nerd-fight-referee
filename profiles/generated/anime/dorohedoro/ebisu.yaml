- id: claim-weaknesses-06ec5611
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Taiyaki Time: Ebisu takes a taiyaki
    out of his sack and consumes it, healing himself and applying a regeneration buff
    for a short time. *Fishing For Snappers: Ebisu tosses his fishing rod out and
    fishes an assortment of both Sunrise Snappers and Golden Snappers out of the ground.
    **Furry Fandango: Ebisu dances, which causes the fish to line up, and after charging
    for a few minutes, cause a line of water explosions to burst in a straight line
    across from them unless they are killed first. *Pawstorm: Ebisu takes a moment
    to charge, before he thrusts his paw forward and a series of paw-shaped bursts
    explode randomly on the battlefield. *Tail Tornado: Ebisu turns and swirls his
    tail at his opponent, creating a vortex of shadow mana in a straight line from
    his tail. ==Notable Matchups== Victories: Losses: Inconclusive: {{discussions}}
    Category:Characters Category:Male Characters Category:Game Characters Category:Video
    Game Characters Category:Game Bosses Category:Dragalia Lost Category:Dragons Category:Cats
    Category:Claw Users Category:Bodily Weaponry Users Category:Enhanced Senses Users
    Category:Longevity Users Category:Magic Users Category:Darkness Users Category:Non-Physical
    Interaction Users Category:Summoners Category:Animal Users Category:Water Users
    Category:Healers Category:Space Users Category:Portal Users Category:BFR Users
    Category:Power Bestowal Users Category:Statistics Amplification Users Category:Life
    Users Category:Purification Users Category:Playable Characters Category:Fantasy
    Characters'
  source_ids: *id002
  decisive: false
  status: unverified
  policy_flags:
