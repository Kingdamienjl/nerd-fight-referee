- id: claim-powers-and-abilities-8bd7ebb1
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Small Size (Type 0. Is 0.7 meters tall)\
    \ *Flight (Levitation) *Intangibility (Cannot be hit by normal and fighting type\
    \ moves) *Non-Physical Interaction (Can interact with and even severely harm Ghost-types\
    \ who are unaffected by normal type attacks) *Shadow Manipulation *Earth Manipulation\
    \ *Light Manipulation *Energy Projection (Power Gem creates a damaging ray of\
    \ light that sparkles like gemstones) *Absorption (Can absorb the fear of othersPok\xE9\
    mon Ruby/Sapphire/Emerald/Omega Ruby/Alpha SapphirePok\xE9mon Diamond/Pearl/Platinum/Brilliant\
    \ Diamond/Shining PearlPok\xE9mon Black/White/Black 2/White 2Pok\xE9mon X and\
    \ YPok\xE9mon Scarlet and Violet or even their life energyPok\xE9mon Sun/Moon/Ultra\
    \ Sun/Ultra Moon in order to sustain themself based on their Pok\xE9dex Entries)\
    \ *Sound Manipulation (Many of its attacks are done through the use of sound)\
    \ *Statistics Reduction (Growl lowers the target's attack. Memento causes the\
    \ user to faint at the cost of severely reducing their target's attacking capabilities.\
    \ Screech lowers the target's defenses) *Status Effect Inducement (Via Confuse\
    \ Ray) *Social Influencing (Mean Look pins the target with a dark, arresting look\
    \ preventing them from fleeing. Growl makes an opponent lower their attack by\
    \ cutely growling at them) *Damage Boost (Hex deals more damage against opponents\
    \ inflicted with a status effect) *Damage Transferal (Via Destiny Bond which causes\
    \ the opponent to faint when the user does) *Curse Manipulation (Via Curse) *Durability\
    \ Negation (Curse inflicts a curse at the target at the cost of the user's health.\
    \ Said curse deals a proportionate amount of damage after a period of time and\
    \ will continue until the target perishes. Pain Split adds the total amount of\
    \ health between the user and the target before sharing it equally, often harming\
    \ the target regardless of defenses. Perish Song creates a melody which will knock\
    \ out all those who hear it in a certain period of time, including the user) *Power\
    \ Nullification (Imprison temporarily prevents the target from using any moves\
    \ that the user is capable of. Grudge completely removes the power points of a\
    \ move that knocks out the user, effectively disabling it) *Power Modification\
    \ (Via Skill Swap and Wonder Room) *Power Mimicry (Me First allows the user to\
    \ steal the target's next offensive move and use it against them, increasing its\
    \ power by 50%. Skill Swap allows the user to swap their passive ability with\
    \ the target's) *Air Manipulation (Via Ominous Wind which creates a gust of repulsive\
    \ wind) *Statistics Amplification (Nasty Plot raises the user's Special Attack\
    \ when used. Ominous Wind has a chance to increase the user's various stats when\
    \ used. Psych Up allows the user to copy any stat changes of the target) *Aura\
    \ (Dark Pulse allows the user to project their own aura to damage enemies) *Sleep\
    \ Manipulation and Mind Manipulation (Can put targets to sleep via Hypnosis) Resistance\
    \ to: *Poison Manipulation (Only takes 1/2 damage from Poison-Type attacks) *Acid\
    \ Manipulation *Bug-Type (Only takes 1/2 damage from Bug-Type attacks) All previous\
    \ abilities except Small Size greatly enhanced *Greater Statistics Reduction (Mystical\
    \ Fire lowers the target's special attack) *Magic (Are known to perform spells\
    \ and incantations) *Pain Manipulation and Illusion Creation (Their cry can inflict\
    \ headaches and hallucinations on those who hear it) *Probability Manipulation\
    \ (Their chants are capable of bringing either luck or misfortune on those who\
    \ hear itPok\xE9mon Legends: Arceus. Lucky Chant prevents the user's opponents\
    \ from landing critical hits) *Empathic Manipulation (Can cause people to fall\
    \ in love or bring them happiness) *Fire Manipulation *Plant Manipulation *Homing\
    \ Attack (Magical Leaf creates several leaves that chase down the target) *Light\
    \ Manipulation (via Dazzling Gleam which damages opposing Pok\xE9mon by emitting\
    \ a powerful flash) *Dimensional Travel (Phantom Force causes the user to vanish\
    \ to an unknown location before reappearing to attack)"
  source_ids: *id002
  decisive: true
  status: unverified
