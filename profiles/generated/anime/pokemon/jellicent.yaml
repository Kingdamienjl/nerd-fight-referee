- id: claim-powers-and-abilities-4e52d8c5
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Underwater Breathing (Type 1) *Intangibility\
    \ (Cannot be hit by normal and fighting type moves) *Non-Physical Interaction\
    \ (Can interact with and even severely harm Ghost-types who are unaffected by\
    \ normal type attacks) *Shadow Manipulation *Water Manipulation *Poison Manipulation\
    \ (Their Pok\xE9dex entry indicates that they often use their venomous stingers\
    \ to incapacitate preyPok\xE9mon Black/White/Black 2/White 2Pok\xE9mon X and YPok\xE9\
    mon Omega Ruby/Alpha SapphirePok\xE9mon Ultra Sun/Ultra MoonPok\xE9mon Sword and\
    \ Shield) *Paralysis Inducement (Their venom is known to have paralytic properties)\
    \ *Status Effect Inducement (Via Confuse Ray) *Air Manipulation and Statistics\
    \ Amplification (Via Ominous Wind which creates a gust of repulsive wind and has\
    \ a chance to increase the user's various stats when used) *Regeneration (Low.\
    \ Recover allows the user to regenerate their cells) *Body Control (Acid Armor\
    \ allows the user to liquefy and reform their own body) *Durability Negation (Pain\
    \ Split adds the total amount of health between the user and the target before\
    \ sharing it equally, often harming the target regardless of defenses) *Damage\
    \ Transferal (Via Destiny Bond which causes the opponent to faint when the user\
    \ does) *Weather Manipulation (Via Rain Dance, Mist, and Damp) *Power Nullification\
    \ (Frillish may temporarily disable a move that has damaged them) *Illusion Creation\
    \ (Night Shade causes a target to see a frightening mirage which causes them harm)\
    \ *Absorption (Of nutrients via Absorb, energy via Strength Sap, and water via\
    \ Water Absorb) *Healing (After absorbing water, Frillish is able to heal themself)\
    \ *Statistics Reduction (Strength Sap weakens the target and heals the user based\
    \ on how strong the target was) *Limited Biological Manipulation (Absorb works\
    \ by absorbing the nutrients of the target) Resistance to: *Poison Manipulation\
    \ *Acid Manipulation *Steel-Type *Water Manipulation *Bug-Type *Statistics Reduction\
    \ (Mist cloaks the user and their allies in mist which keeps them safe from their\
    \ opponents' attempts at lowering their statistics) *Bone Manipulation (Boneless)\
    \ All previous abilities greatly enhanced"
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
