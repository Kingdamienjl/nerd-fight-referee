    \ at the cost of lowering one of its other stats. *Frighten: A Conquest ability.\
    \ Glalie's terrifying face makes any enemy within sight-range have their speed\
    \ lowered. *Frostbite: A Conquest ability. If an opponent. touches Glalie, it\
    \ can backfire and freeze him or her. *Refrigerate: Mega Glalie's ability. Glalie's\
