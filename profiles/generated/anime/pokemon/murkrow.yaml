- id: claim-powers-and-abilities-b65d37c4
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Small Size (Type 0. Is 0.5 meters tall)\
    \ *Bodily Weaponry Beak and claws, used through moves like Peck and Night Slash\
    \ *Non-Physical Interaction (Can interact with and even severely harm Ghost-types\
    \ who are unaffected by normal type attacks) *Supernatural Luck (Super Luck increases\
    \ the chances of landing a critical hit) *Flight (True Flight) *Darkness Manipulation\
    \ *Air Manipulation *Sound Manipulation (Many of its attacks are done through\
    \ the use of sound) *Mind Manipulation and Purification (Via Psycho Shift which\
    \ allows the user to transfer their status effects onto their target through the\
    \ power of suggestion) *Illusion Creation (Night Shade causes a target to see\
    \ a frightening mirage which causes them harm) *Statistics Amplification and minor\
    \ Afterimage Creation (Via Double Team by moving rapidly, the user makes illusory\
    \ copies of itself to raise its evasiveness) *Social Influencing (Mean Look pins\
    \ the target with a dark, arresting look preventing them from fleeing. Swagger\
    \ and Flatter angers and flatters the target respectively while also confusing\
    \ them. Taunt allows the user to taunt their target into only attacking them.\
    \ Torment allows the user to torture the target into not using the same move twice)\
    \ *Durability Negation (Perish Song creates a melody which will knock out all\
    \ those who hear it in a certain period of time, including the user) *Healing\
    \ (Via Roost) *Statistics Reduction (Haze removes all stat changes from targets\
    \ and allies. Feather Dance covers the target in a large amount of feathers, lowering\
    \ their attack. Screech lowers the target's defenses) *Status Effect Inducement\
    \ (Via Swagger, Flatter, and Confuse Ray) *Aura (Dark Pulse allows the user to\
    \ project their own aura to damage enemies) *Attack Reflection (Foul Play allows\
    \ the user to turn the target's strength against them) *Power Mimicry (Via Mirror\
    \ Move which copies the last move the opponent has used in battle) *BFR (Whirlwind\
    \ blows the target away forcing another Pok\xE9mon out in a trainer battle and\
    \ ending the battle against wild Pok\xE9mon) Resistance to: *Darkness Manipulation\
    \ (Only takes 1/2 from Dark-Type and Ghost-Type attacks) *Telekinesis (Completely\
    \ immune to Psychic-Type moves) *Ground-Type (Completely immune to Ground-Type\
    \ moves) *Plant Manipulation (Only takes 1/2 from Grass-Type attacks) *Sleep Manipulation\
    \ (Via Insomnia) All previous abilities of Murkrow except Small Size greatly enhanced\
    \ *Greater Statistics Amplification (Moxie allows Honchkrow to grow in strength\
    \ every time they take down an opponent) *Summoning (Honchkrow can summon more\
    \ than a hundred of Murkrow with a single cryPok\xE9mon Diamond/Pearl/Platinum/Brilliant\
    \ Diamond/Shining PearlPok\xE9mon Black/White/Black 2/White 2Pok\xE9mon X and\
    \ YPok\xE9mon Sun/Moon/Ultra Sun/Ultra MoonPok\xE9mon Legends: ArceusPok\xE9mon\
    \ Scarlet and Violet)"
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
