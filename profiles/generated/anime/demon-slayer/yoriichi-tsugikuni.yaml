  intelligence:
    text: Genius (As a child prodigy, Yoriichi is extremely intelligent. Despite not speaking for most
      of his childhood, his first words were very clear and pronounced. He also displayed maturity beyond
      his age as he noticed his mother's illness and helped her till her death. As another testament to
      his keen intellect, he could immediately use the Transparent World in combat despite never fighting
      before, being able to intuitively figure out that the lungs of people will expand before they attack
      and that he needed to watch their bone movement, muscle contraction, and blood flow, which he used
      to his advantage instantly amid battle. Even with just the knowledge of how to hold a sword properly
      and go into a stance, he was able to instantly overpower a trained sword instructor, causing him
      to go unconscious and cause many injuries all over his body. His unique intellect brought about
      the "Golden Age of the Demon Slayers" as he invented the Breathing Styles and he was able to modify
      the original Breathing Technique to suit the abilities of others by adapting them to their individual
      strengths. Furthermore, he was able to surmise that Muzan's weaknesses were his 12 organs and he
      could create an entirely new technique in that split second to overwhelm him)
    source_ids: *id002
    confidence: 0.95
