power_scale:
  tier:
    text: 'At least {{Low 7-B}}, likely far higher Name: Muzan Kibutsuji Origin: Demon Slayer: Kimetsu
      No Yaiba Gender: Male. Can vary with Shapeshifting. Age: At least over 1000 years old. Tamayo''s
      drug had the age of his body increase by 9000 years within 5 hours. Classification: Human (Formerly),
      Demon, King of Demons, The First Demon, The Progenitor of Demons'
    source_ids: &id002
    - mediawiki-2993136
    confidence: 0.95
  attack_potency:
    text: 'At least Small City level, likely far higher (Is incomparably stronger than the Upper Ranks,
      which includes Nakime who can stabilize the entire Infinity Castle and Gyutaro who can destroy the
      entire Entertainment District. Even while weakened and aged he easily created a large crater in
      the groundKimetsu no Yaiba, Chapter 194: "Burn Scars" and has consistently held back marked Gyomei,
      Sanemi, Giyu, Obanai, Mitsuri, Zenitsu, Inosuke and Kanao at the same time and later one-shot all
      of them after getting serious.>2.9333 Megatons), can ignore conventional durability with the blood
      coating his physical attacks (If his blood enters someone''s body, their cells will be destroyed
      causing rapid meltingKimetsu no Yaiba, Chapter 184: "Leaving the Battlefront" and vaporization.),
      Varies with Demons'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'At least Relativistic, likely far higher (Even when drugged, his attacks are hard for Tanjiro,
      Giyu, Obanai and Mitsuri to dodge and counter, the latter of whom could dodge real lightning. As
      soon as he unleashed his thigh whips, he blitzed the entire Marked Hashiras alongside, Zenitsu,
      Inosuke and Kanao TsuyuriKimetsu no Yaiba, Chapter 191: "Which One of Us is the Demon?" with the
      latter even commenting him as being "too fast". At full power, he should be far faster than any
      of the Upper Rank demons, including even Kokushibo.>0.258 c)'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'At least Class K (Is far superior to Gyomei and Kokushibo, with the latter before his Slayer
      Mark awakening could push a huge boulder.Kimetsu no Yaiba, Chapter 134: "Repetitive Action">399.7
      Metric Tons)'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At least Small City level, likely far higher
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Varies (The durability of demons fluctuates depending on what parts of their body they reinforce,
      with their necks most often prioritized.), At most Small City level (Survived the Ubuyashiki Mansion
      explosion, and only received damage due to the Scarlet Crimson Iron sand-forged makibishi. His bonewhip
      tentacles withstood numerous attacks by several Marked Hashiras.), likely higher (Demons can reinforce
      a part of their body above the extent of their own Blood Demon Art. Albeit, Muzan neglected his
      own durability due knowing that he is unkillable by any Nichirin swords), and with Flesh Shield
      (Can briefly stave off the sun for a moment. Tanked attacks from Sanemi, Giyu and Obanai.), regeneration
      makes him incredibly difficult to kill
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Infinite (Demons don't tire)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Tens of Meters with Whips and Shockwaves (Casually killed a crow flying far away with a suddenly
      formed and dismissed arm whip.); Up to Interdimensional with Telepathy and Dimensional Infinity
      Fortress (Demons are distributed throughout Japan, with Muzan being aware of their actions and location.
      He can also control demons and is able to abruptly teleport himself and all Lower and Upper Ranks
      into the Dimensional Infinity Fortress regardless of their location while in a different dimension.)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius (Lived for over a millennia and gained further experience from the telepathic link with
      demons he control. Using five brains at a time was stated to boost his intelligence. As a human
      he was skilled at reading the negative emotions of others and was able to manipulate his five wives
      to commit suicide. Was able to evade the Demon Slayer Corps for hundreds of years when he didn't
      want to be found despite the leaders of the corps possessing Extrasensory Perception and Analytical
      Prediction, and used demons to create distractions somewhere far away when he wanted to hide something
      from the corps. Is a master chemist, and enjoys importing goods, learning foreign languages, and
      studying newly invented machines. Able to impersonate rich and influential individuals and blend
      in with human society. Able to create networks for information gathering and to secure funding using
      the different identities he assumed, without the humans he commands and manipulates being aware
      he is a demon.)
    source_ids: *id002
    confidence: 0.95
