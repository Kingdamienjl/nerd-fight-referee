    demon for half a day within moments) *Fear Manipulation & Paralysis Inducement
    (Able to withstand aura that causes fear and paralysis) }} |-|Entertainment District
    Arc=All previous abilities significantly enhanced plus * Greater Battle Spirit
    (Overwhelming & Fear-inducing; Similar to Rui, who can cause dyspnea and make
    the air feel heavy and thick) *Transformation & Statistics Amplification *Blood
    Manipulation (Fought with her head and all her limbs separated by solidifying
    her blood, then dragged her head and limbs back to her body) |-|Swordsmith Village
    Arc=All previous abilities enhanced |-|Sun Immunity=All previous abilities enhanced
    plus: **Greater Battle Spirit (Similar to Gyutaro, who can produce an intense
    bloodlust that causes chills) **Adaptation (Adapted to the demons'' weakness against
    sunlight after getting briefly burned by it) }}'
