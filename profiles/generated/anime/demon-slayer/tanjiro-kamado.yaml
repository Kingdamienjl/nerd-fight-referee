  attack_potency:
    text: 'Small Building level (Defeated the Hand Demon0.00841 Tons), higher with
      Constant Flux (Was able to cut through Rui''s unenhanced threads when he previously
      couldn''t.), Building level with the Hinokami Kagura (Cut through a web of Rui''s
      most durable Blood Demon Art-enhanced threadsKimetsu no Yaiba: Anime, Episode
      19: "Hinokami"Kimetsu no Yaiba, Chapter 40: "Hinokami" when he is normally unable
      to cut through one of his weaker threads, and nicked his neck which is even
      more durable than his threads.Kimetsu no Yaiba: Anime, Episode 19: "Hinokami"Kimetsu
      no Yaiba, Chapter 40: "Hinokami"0.358 Tons)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: 'Supersonic+ (During his training to become a Demon Slayer, he parried several
      knives thrown at him at point blank.Kimetsu no Yaiba: Anime, Episode 3: "Sabito
      and Makomo" Comparable to Post-Demon Slayer Training Zenitsu who blitzed the
      Spider Demon Brother,Kimetsu no Yaiba, Chapter 34: "Robust Blade" and could
      somewhat keep up with Rui who as a member of the Twelve Kizuki should be significantly
      faster than the lesser Slasher Demon who ran across an entire railroad track
      in less than a second.Kimetsu no Yaiba: Anime, Episode 27: "Flame Hashira Kyojuro
      Rengoku">Mach 3.64), higher with the Hinokami Kagura (Can keep up with Rui)'
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: 'Class 5 (Comparable to Inosuke. Can lift a few large rocks at once), At
      least Class 25 with Hinokami Kagura (Should be comparable to Rui, who is completely
      superior to the Spider Demon Father that easily swung an enormous tree.Kimetsu
      no Yaiba, Chapter 35: "Scattered">16.3 Metric Tons)'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Small Building level, higher with Constant Flux, Building level with the
      Hinokami Kagura
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Small Building level (Survived blows from the Hand Demon) |-|Post-Rehabilitation
      Training
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: 'Superhuman (Constantly keeps pushing himself to the limits of his stamina,
      much higher than previously), higher with the Hinokami Kagura (The same skill
      allowed his sickly father to dance from sunset to sunrise out in the snow while
      barely clothed, with his father saying that he could dance forever, though this
      is likely hyperbolic) | Superhuman (Endured extremely taxing training for seven
      days non-stop with no food, no sleep, and only a small amount of water from
      rain,Kimetsu no Yaiba, Chapter 104: "Kotetsu" later drained for even greater
      stamina, was also getting injured frequently during the training session. Fought
      Lower Rank-level demons in the Dimensional Infinity Fortress for nearly 5 hoursKimetsu
      no Yaiba, Chapter 139: "Falling"Kimetsu no Yaiba, Chapter 140: "The Final Battle
      Begins"Kimetsu no Yaiba, Chapter 193: "A Difficult Door Begins to Open" on top
      of fighting Akaza.) | Infinite (Demons don''t tire)'
    source_ids: *id002
    confidence: 0.95
  range:
    text: Extended Melee Range, Several Meters with Total Concentration Breathing
      and Breathing Styles | Extended Melee Range, Tens of Meters with Shockwaves,
      Tendrils and Energy Projection
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted in general, Genius combatant (Tanjiro is highly analytical and sagacious,
      with a natural aptitude and innate intuition in various areas. He can create
      strategies on the fly to defeat vastly superior opponents, even at the cost
      of his own life. After seeing it once, Tanjiro can analyze a fighting style,
      even in constantly shifting environments, without any advantages. He has an
      explosive growth rate and can adapt quickly to any opponent. Tanjiro is especially
      good at using his opponent's abilities against them. He can deduce their powers
      rapidly by picking up subtle phrases and words throughout their fights, even
      if the opponent offers no specific details. He can develop new skills and breathing
      styles, which he can utilize effectively after using them once. Tanjiro can
      also combine techniques despite needing to be fully proficient. For instance,
      he combined the Water Breathing and the Hinokami Kagura to save Hinatsuru from
      Gyutaro. Later, he used it again during the Dimensional Infinity Fortress Arc
      to slay dozens of demons. Tanjiro has also shown proficiency in hand-to-hand
      combat, even though he has no prior martial arts training. He can hold his own
      and instantly adapt to Inosuke's animalistic, unarmed fighting style. Giyu,
      who encountered Tanjiro for the first time, was impressed by Tanjiro's plan
      to attack him by surprise, charging him unarmed and attempting to bring him
      down with a pre-thrown hatchet. Although the attack failed, Giyu was impressed
      by Tanjiro's plan, especially considering he was a rookie.) | Animalistic (Is
      only driven by Muzan's final will to eradicate the Demon Slayer Corps)
    source_ids: *id002
    confidence: 0.95
