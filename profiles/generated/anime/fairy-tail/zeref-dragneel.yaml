- id: claim-weaknesses-138880b7
  section: weaknesses
  axis: weakness
  text: 'His magic will go out of control as long as he values life. After the Grand Magic Games Arc,
    it is shown that he no longer feels the need to value life, and that as long as the world continues
    to reject him, he will reject the world, making the drawback of him losing control of his magic no
    longer an issue. The Curse of Contradiction can sometimes cause Zeref to have contradictory thoughts.
    Notable Attacks/Techniques: |-|Ankhseram Black Magic= Ankhseram Black Magic: It is a Black Art that
    allows Zeref to produce a dark matter that kills any living thing it touches. This Magic seems to
    be uncontrollable at times, causing it to burst out randomly, killing anything within a certain radius
    around him. However, when Zeref forgets the value of and no longer cares about human life, he can
    fully control this Magic, and become the ruthless, cold-hearted Zeref spoken of in legend. Certain
    Magic Items can protect people from Ankhseram Black Magic, such as Natsu Dragneel''s scarf. This Magic
    also appears, contrary to the nature of the Black Arts, unable to be learned, as Zeref only gained
    this curse-like Magic by upsetting the ancient God of life and death, Ankhseram, who apparently bestowed
    this upon Zeref due to his making light of the connections between life, death, and people in his
    race to bring his brother back to life. The side effect of this Magic is both immortality and the
    inability to age, and it is also said that no matter what, Zeref can not be killed, even if he loses
    his head. Owing to his status as an immortal, if Zeref has gone at least a short amount of time with
    receiving damage occurring in successive intervals, his wounds heal without a trace. *Death Predation:
    Zeref creates a dark wave that kills everything in the his immediate vicinity. *Darkness Orb: Zeref
    creates a ball of dark mass and throws it, which destroys everything in its path. *Judgement of Darkne'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
