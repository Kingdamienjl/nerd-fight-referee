power_scale:
  tier:
    text: '{{5-A}} | {{Low 2-C}}'
    source_ids: &id002
    - mediawiki-13765
    confidence: 0.95
  attack_potency:
    text: 'Large Planet level (Stated to be the strongest human in the history of the magic world.Fairy
      Tail Vol 25 Chapter 209 Stated to have power that rivals theFairy Tail Movie: Phoenix Priestess
      Phoenix, who has the power to destroy the world.Fairy Tail Movie: Phoenix Priestess Stronger than
      Battle Form August and Dragon Form Irene. Stated to wield powerful magic and be much stronger thanFairy
      Tail 100 Years Quest Vol 6 Chapter 53 X793 Pre-Elentear Fire Dragon King Mode Natsu. Easily killed
      Larcade) | Universe level+ (Infinitely stronger than his Base Form after absorbing Fairy Heart and
      Time Magic from the Space Between Time, the former of which being stated to have infinite magic
      power and was capable of subjugating "space, time, and everything" to his control. With Neo Eclipse,
      Zeref was going to erase the current timeline and recreate it with his own to relive his life. His
      Dark Blast Inferno should be superior in power to Neo Eclipse as he exerted far more effort when
      casting the spell)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: FTL (Faster than both Battle Form August and Dragon Form Irene) | FTL+ (Should be much faster
      than End of X792 Dragon Force Natsu)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class T (Stronger than Battle Form August and Dragon Form Irene) | At least Class T
      (Much stronger than his Base Form)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Large Planet level (Comparable to his Attack Power. Stronger than Battle Form August, Dragon
      Form Irene, and X793 Pre-Elentear Fire Dragon King Mode Natsu) | Universe level+ (Comparable to
      his Attack Power)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Large Planet level (Comparable to his Attack Power. Took an attack from Fire Dragon King Mode
      Igneel's Power Natsu without blocking,Fairy Tail Vol 55 Chapter 465 but is overall weaker) | Universe
      level+ (Comparable to his Attack Power)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman normally, Infinite with Fairy Heart (Took a full powered attack from Fire Dragon
      King Mode Igneel's Power Natsu without blocking it and kept standing, even after taking severe injuries
      from the attack. As an immortal, Zeref is incredibly hard to injure and it is practically impossible
      to do any lasting damage to him, which allows him to survive all kinds of critical injuries, being
      able to recover immediately from severe burn wounds or even decapitation, and overtime, he is capable
      of regenerating from the complete physical destruction of both his body and soul. Fairy Heart is
      an infinite source of magic power that will never run out)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Hundreds of Kilometers (Capable of controlling and effecting the Space Between Time when it
      was well over 100 Kilometers away. His Ankhseram Black Magic would have spread out and effected
      all of Aldoron's body), Universal+ with Neo Eclipse (Neo Eclipse was going to erase the entire timeline
      and create a new one)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Extraordinary Genius (Zeref possesses centuries worth of knowledge, having mastered all of the
      Black Arts known in the world, and he himself has also developed many new advanced magics. As a
      child, he was able to invent the R-System, which was a device that had the power to revive the dead.
      He was also able to create the Eclipse Gate, which allowed the user time travel, as well as create
      thousands of his own race of demons known as the Etherious. Zeref was also able to form the Alvarez
      Empire, a massive Empire that is made up of around 730 guilds and is one of the most powerful nations
      in the world. Zeref was also capable of effortlessly transforming Irene back into a Human Form,
      which Irene was incapable of figuring out, even after 400 years of trying. Zeref managed to understand
      and gain complete control over the concept of time itself and the Space Between Time, which is also
      a concept. Zeref also managed to develop Neo Eclipse, which was a spell that had the power to reset
      the time itself back at least 400 years. Zeref is also an excellent tactician, being able to repeatedly
      outsmart and outmaneuver Mavis and her strategies during the war between Ishgar and Alvarez. Zeref
      is also a very skilled hand-to-hand combatant, being able to fight and match Natsu, who is known
      for being one of the best brawlers in the series. Zeref is likely the smartest person in the entire
      Fairy Tail world that we have met so far)
    source_ids: *id002
    confidence: 0.95
