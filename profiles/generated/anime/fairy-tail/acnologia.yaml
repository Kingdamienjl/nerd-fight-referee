    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Large Planet level (Much stronger than Human Form Selene, Base Zeref, Battle
      Form August, and Dragon Form Irene), Universe level+ with Dragon Form (Much
      stronger than his Human Form. Stronger than Fairy Heart Form Zeref and the Sealed
      Dragon Forms of the Five Dragon Gods) | Universe level+ (Much stronger than
      his previous Dragon Form, due to absorbing the Space Between Time, which has
      much more magic than his previous Dragon Form), higher with Dragon Form (Stated
