      Dragon Form, due to absorbing the Space Between Time, which has much more magic
      than his previous Dragon Form), higher with Dragon Form (Stated to be the strongest
      character in the series.ANN Connect: Hiro Mashima Interview and Fan Q&A Much
      stronger than his Human Form. Acnologia was going to use space-time magic to
      rise above the limits of space and time and destroy the world)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: FTL (Faster than Base Zeref and Battle Form August), Massively FTL with
      Dragon Form (Much faster than his Human Form. Should be much faster than X793
      Post-Dogramag Labyrinth Dragon Force Natsu) | Massively FTL (Faster than his
      previous Dragon Form), higher with Dragon Form (Much faster than his Human Form)
    source_ids: *id002
    confidence: 0.95
