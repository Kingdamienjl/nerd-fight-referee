    source_ids: *id002
    confidence: 0.95
  durability:
    text: Large Planet level (Comparable to both his Attack Power. Much more durable
      than Human Form Selene), Universe level+ with Dragon Form (As a Dragon, his
      Durability is way above his Attack Power due to having incredibly durable scales.
      More durable than Fairy Heart Form Zeref. Tanked a point blank Fire Dragon's
      Roar from Igneel) | Universe level+ (Comparable to his Attack Power), higher
      with Dragon Form (As a Dragon, his Durability is considerably above his Attack
