- id: claim-weaknesses-5c367ea7
  section: weaknesses
  axis: weakness
  text: 'Should be weak to Dragon Slayer Magic in his Dragon Form. Acnologia also suffers from motion
    sickness as a result of his Dragon Slayer Magic, which causes him to become severely nauseous while
    riding transportation. Acnologia cannot eat the Magic created from his own Dragon Slayer Magic to
    replenish his stamina. After consuming the Space Between Time, his separated body and soul parts are
    linked to each other, and should one part be restrained, so will the other. Notable Attacks/Techniques:
    Arcane Dragon Slayer Magic: As one of the first humans who entered the Dragon King Festival, Acnologia
    was also among the first Dragon Slayers brought into existence. Acnologia''s Dragon Slayer Magic has
    no specific element as consuming and soaking in the blood of countless dragons has enabled him to
    replenish himself with any type of Magic, earning him the title of the Arcane Dragon. Over time, as
    Acnologia slew many Dragons, he eventually turned into a Dragon due to the extensive overuse of his
    Lost Magic. Acnologia, contrary to the legends surrounding him, did not entirely become a Dragon and
    has retained the ability to enter and exit his mighty Dragon Form at will. Acnologia''s Dragon Slayer
    Magic also allows him to reap the souls of Dragons, leaving them in a half-dead state. *Arcane Dragon''s
    Roar: Similar to other Dragons and Dragon Slayers, Acnologia can perform a Dragon''s Roar, which takes
    the form of a massive breath attack of pure Magic that creates a huge explosion on impact. Said blast,
    while he was a Dragon, was potent enough to "completely eradicate" the entirety of Tenrou Island and
    imprint a giant crater into the ocean. *Arcane Dragon''s Light Plunge: Acnologia creates a destructive
    energy blast from the palm of his hand. *Arcane Dragon''s Hegemony: Acnologia releases a tremendous
    burst of magic from his body. *Eternal Flare: Acnologia casts starry lights in the sky, which rain
    down in a massive radius as beams with an intense destructive force that create huge explosions on
    impact. Acnologia Transformation.gif|Acnologia''s Dragon Form Acnologia Dragon Roar.gif|Arcane Dragon''s
    Roar Acnologia Finger Beam.gif|Arcane Dragon''s Light Plunge Acnologia Explosion.gif|Arcane Dragon''s
    Hegemony Acnologia Eternal Flare.gif|Eternal Flare Time Magic: After consuming the Space Between Time,
    Acnologia is able to wield this Caster Magic, which gives him control of space and time. With this
    power, he could teleport the seven Dragon Slayers into his world with a Rift in Space and Time. By
    warping the Dragon Slayers into his world, he could trap them in crystal-like pillars that allow him
    to balance his own Magic Power. This power was so great that it would eventually enable Acnologia
    to surpass space and time. Acnologia Post SBT.gif|Acnologia after absorbing the Space Between Time
    Acnologia Absorbs Wendy.gif|Acnologia sending the Dragon Slayers into the Space Between Time Acnologia''s
    Soul.gif|Acnologia''s Human Form within the Space Between Time Dragon Slayer Pillars.gif|The Dragon
    Slayers trapped in crystal-like pillars ==Gallery== Acnologia at the cave.png Acnologia in Dragon
    Cry.png Dragon Slayers Vs Acnologia.gif ==Statistics Values== {{scroll box|content=}} ==Notable Matchups==
