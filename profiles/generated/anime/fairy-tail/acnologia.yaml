    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Capable of defeating two armies of thousands of dragons alone
      and emerging as the only survivor. Even dragons of Igneel's caliber have a hard
      time harming Acnologia in any significant way, with Acnologia enduring Igneel's
      enormous fire breath strike and emerging unscathed. Has shown no signs of exhaustion
      from any of his battles. He can also eat magic to restore his magic power and
      stamina)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Thousands of Kilometers
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Gifted (Has had hundreds of years of experience in battle and has knowledge
      of many different kinds of magic, being able to identify Irene as a High Enchanter
      almost immediately. He was able to find out how to transform into a Human Form
      on his own, which Irene was incapable of figuring out, even after 400 years
      of trying. Acnologia is a master of hand-to-hand fighting and magic. He often
      uses his Dragon Slayer Magic in conjunction with punches and kicks to devastating
      effect. He was able to single-handily take on Natsu, Gajeel, Wendy, Laxus, Cobra,
      Sting, and Rogue at the same time with little difficulty, being able to beat
      them all down even while they all worked together to fight him. However, after
      consuming the Space Between Time, his body and soul are separated, but are still
      linked to each other. While the soul retains his personality and intellect,
      the body transforms into a beast whose one goal is destruction. Still, the body
      can immediately detect and eliminate what it perceives as a threat)
    source_ids: *id002
    confidence: 0.95
