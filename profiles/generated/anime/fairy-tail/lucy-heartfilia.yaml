- id: claim-weaknesses-5ae3f62d
  section: weaknesses
  axis: weakness
  text: "Gemini can only transform into people whose power is comparable to or weaker than Lucy's. Star\
    \ Dress Mix uses up a lot of magic power. Notable Attacks/Techniques: Celestial Spirit Magic: Lucy's\
    \ Spatial Magic lets her summon Celestial Spirits\u2014magical beings from the Celestial Spirit World\u2014\
    using Gate Keys. Summoning causes the Keys to glow gold. Once contracted, Spirits are called forth\
    \ on specific days to fight alongside Lucy and perform tasks. Spirits vary in power and specialization,\
    \ some better suited for specific (not always combat) roles. Aquarius, for example, manipulates water,\
    \ generating powerful waves to overwhelm foes, while Taurus excels in melee combat. As sentient beings,\
    \ Spirits may act independently, even disobeying Lucy. Celestial Spirit Mages can acquire rare Gold\
    \ Keys, unlocking the \"Ecliptic Zodiac\" gates, and common Silver Keys. While Silver Keys are plentiful,\
    \ only twelve Gold Keys exist, each tied to an astrological sign. Lucy boasts a remarkable collection\
    \ of ten Gold and five Silver Keys. Summoning multiple or powerful Spirits quickly drains Lucy's magical\
    \ energy. Summoning five Ecliptic Zodiac Spirits in a single day highlights her magical strength.\
    \ *Force Gate Closure: Lucy can forcibly close a Celestial Spirit's gate, returning them to the Celestial\
    \ Spirit World against their will. She first demonstrated this when Sherry Blendy's magic controlled\
    \ Taurus, forcing him to attack Lucy. This ability is considered a significant achievement for a Celestial\
    \ Spirit Mage. It's theorized that if a Spirit is absorbed by another being, forcibly closing the\
    \ gate might also send the absorber to the Celestial Spirit World. *Multiple Summons: Lucy has developed\
    \ the advanced ability to summon multiple Celestial Spirits simultaneously, even summoning all five\
    \ of her Gold Keys and one Silver Key (Plue) at once\u2014a feat that greatly astonished Loke. However,\
    \ the immense magical energy required limited the duration of this summoning to mere seconds. After\
    \ unlocking her Second Origin, Lucy gained significantly greater control, effortlessly maintaining\
    \ two Spirits' gates during her fight with Flare. This allows her to combine her Spirits' abilities\
    \ for new and more powerful attacks, and even enhance their power with her own magic. During the Tartaros\
    \ arc, Lucy employed a forbidden technique by opening three gates simultaneously. *Recompense Summoning:\
    \ This technique, usable only by Celestial Spirit Mages with sufficient magical energy to open at\
    \ least three Ecliptic Zodiac gates simultaneously, allows the one-time summoning of the Celestial\
    \ Spirit King\u2014the most powerful Spirit. To save her friends, Lucy sacrificed Aquarius's key,\
    \ fulfilling the requirement of sacrificing a Spirit with whom she shared a deep bond. This sacrifice\
    \ enabled her to summon the Spirit King and destroy Plutogrim. Lucy Celestial Spirit Magic.gif|Summoning\
    \ Force Gate Closure.gif|Force Gate Closure Lucy Multiple Summons.jpeg|Multiple Summons Lucy Summons\
    \ Celestial Spirit King.gif|Recompense Summoning |-|Aquarius= Aquarius, \"The Water Bearer\", is a\
    \ Celestial Spirit that is one of the 12 Golden Zodiac Keys. Her key was owned by Lucy Heartfilia\
    \ until she sacrificed it to summon the Celestial Spirit King. Nevertheless, Lucy still holds a part\
    \ of her original key. Her key is currently in Guiltina. *Water Magic: Aquarius uses Water Magic as\
    \ her primary source of combat. Using her Magic, she can control water through her urn to hit opponents\
    \ with great force, usually done via giant waves of water or through variations of beam attacks. She\
    \ is a powerful Celestial Spirit; even after Loke, a \"combat specialist\", became one of Lucy Heartfilia's\
    \ Celestial Spirits, Lucy considers Aquarius as strong as him or possibly even above his level of\
    \ strength. **Torrent: Aquarius absorbs water inside her urn and then hurls it at her target with\
    \ tremendous force. It was strong enough to effortlessly throw a yacht a hundred miles away in the\
    \ sea back to the shore. **Bubble Shot: A stream of giant bubbles is released from Aquarius's urn,\
    \ which hits the opponent with great force multiple times. **Water Pillar: Aquarius swings her urn\
    \ towards the target creating a massive pillar of water that strikes the target from below. Aquarius\
    \ prop.png|Aquarius Aquarius Torrent.gif|Torrent Aquarius's Bubblebeam.gif|Bubble Shot Water Pillar.gif|Water\
    \ Pillar |-|Taurus= Taurus, \"The Golden Bull\", is a Celestial Spirit that is one of the 12 Golden\
    \ Zodiac Keys. His key is currently owned by Lucy Heartfilia. *Master Axemanship Specialist: Taurus,\
    \ a melee-focused Celestial Spirit, wields an axe with exceptional skill. Despite his sometimes comical\
    \ clumsiness stemming from his\u2026 proclivities, he's a master axeman. His attacks are not only\
    \ devastating, capable of shattering most defenses due to his raw power, but also surprisingly swift,\
    \ allowing him to engage opponents immediately upon summoning. Furthermore, Taurus exhibits uncanny\
    \ precision: he flawlessly intercepted a barrage of M"
  source_ids: *id003
  decisive: false
  status: unverified
