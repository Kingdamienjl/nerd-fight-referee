- id: claim-weaknesses-9161c670
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: Requip: The Knight: Requip is a
    type of Spatial Magic and Erza''s signature form of Magic, over which she possesses
    great mastery. It is a type of Magic that allows her to swap weapons, armor, and
    clothes at will. Her particular form of Requip is called The Knight. She is noted
    for her ability to Requip extremely fast and is the only sword Mage known to be
    capable of Requipping weapons and armor while fighting. She is said to have over
    100 different armors, which made her and her immense strength well known throughout
    her place of residence, Magnolia Town, and throughout the entire Kingdom of Fiore,
    earning her the epithet "Titania." The Knight.gif|Requip: The Knight |-|Heart
    Kreuz Armor= Heart Kreuz Armor: Made by the popular fashion brand Heart Kreuz
    specifically for her, this is Erza''s casual armor, which she is mostly seen wearing.
    This armor sports a breastplate now composed of a single piece of metal, decorated
    by curved lines and by a deformed version of Heart Kreuz''s mark, with the cross''
    right arm extending to the right part of Erza''s chest, and the added mark of
    Fairy Tail located under the cross itself, which is now lacking the brand''s name.
    Erza Heart Kreuz Armor Model 1.jpeg|Heart Kreuz Armor Model 1 Erza New Armor.png|Heart
    Kreuz Armor Model 2 Erza Heart Kreuz Armor Model 3.png|Heart Kreuz Armor Model
    3 |-|Heaven''s Wheel Armor= Heaven''s Wheel Armor: Plated armor covers her chest,
    with a large metal flower over it, and she wears a large billowing skirt that
    has metal plating in the upper area. Her stomach and neck are uncovered, and she
    has large metal wings that appear to be made of individual blades, as well as
    a wing-like headpiece. Erza can summon plenty of swords (Roughly more than 200)
    and launch weapons at her opponent(s) in a variety of different ways. The armor
    is meant to be used for facing multiple opponents. *Blumenblatt: Erza will requip
    a mass amount of swords and then charge at her opponent and slice them with two
    of her swords. Then she will fly past her enemy and send the swords she Requipped
    into the enemy simultaneously. *Circle Sword: Erza requips swords and has them
    circle her by using the "Dance, My Blades" command. The swords then begin spinning
    rapidly around Erza. She sends them flying towards her opponent(s) in a disc formation
    at first. Upon impact, the swords separate and fly in different directions dealing
    great damage. *Trinity Shot: While in her Heavens Wheel Armor, Erza slashes the
    opponent in a delta formation. *Pentagram Sword: While using the Heaven''s Wheel
    Armor, the user slashes the swords in the shape of a pentagram to attack the target.
    Erza HW armor.png|Heaven''s Wheel Armor Erza New Blumenblatt.gif|Bumenblatt Circle
    Sword.gif|Circle Sword Trinity Shot.gif|Trinity Shot Pentagram Sword.gif|Pentagram
    Sword |-|Black Wing Armor= Black Wing Armor: This armor is black with silver trimming
    and silver crosses in several places. It has a revealing silver-edged breastplate
    and plates flanking her hips that reach down to her waist guard. The waist-guard
    leaves the front of Erza’s body exposed, with her groin covered by a dark imbuement.
    She has large plates guarding her legs. She has two wings with black metal "arms"
    acting as the wings'' leading structure, but the parts used to fly are composed
    of a membrane-like material. Erza''s hair is tied in a ponytail. This armor increases
    Erza''s offensive capabilities. She uses it in conjunction with any number of
    weapons to deal her enemy great damage. *Moon Flash: Erza rushes past her target,
    slashing them in a cross pattern. Erza - Black Wing Armor.png|Black Wing Armor
    Moon Flash.gif|Moon Flash |-|Flame Empress Armor= Flame Empress Armor: This armor
    is dark red predominantly, but also sports orange and black parts, with the first
    ones being shaped like flames and the second resembling Dragon’s limbs. It consists
    of three parts: the revealing breastplate with Dragon-like wings attached to it,
    the orange gauntlets, and the Dragon claw-shaped greaves. Erza’s hair is tied
    into a pair of high, long pigtails. This armor lowers the destructive power of
    flame attacks by 50%. This armor also allows the user to use Fire Magic. *Flame
    Slash: While in the Flame Empress Armor, the user charges the sword''s blade with
