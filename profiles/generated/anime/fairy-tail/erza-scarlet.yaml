  stamina:
    text: 'Superhuman (Has been shown to fight multiple opponents without resting
      and continue fighting despite taking severe and life-threatening injuries. With
      the aid of her Adamantine Armor, she was able to take the brunt of the Magical
      Convergent Cannon: Jupiter on herself, and then go on to easily defeat Aria,
      an S-Class Mage, and stand up against Jose Porla, the Phantom Lord Guild Master
      and a member of the Ten Wizard Saints, after receiving only a very brief amount
      of time for rest. While clad in her Heaven''s Wheel Armor, she was capable of
      taking on the counter effect of 200 Lacrima orbs from Laxus'' Thunder Palace
      even though the effect of one of the orbs is enough to endanger someone''s life.
      She was also able to survive the highly-damaging Terra Clamare twice and still
      managed to continue to fight and defeat Azuma. Was still able to join the battle
      against Hades after being exhausted in her fight with Azuma. She experienced
      no pain from having her Second Origin unlocked, despite the process involved
      in unlocking one''s Second Origin being excruciatingly painful. In addition,
      during the third day of the Grand Magic Games of X791, Erza was able to fight
      and defeat 100 powerful monsters, including one which was said to be so powerful
      that even a Ten Wizard Saint might not be able to beat it. She continued to
      fight Kyoka even after taking several attacks from her when her own body was
      so sensitive that even a breath could make her cry in pain. Was able to propel
      herself into the air and destroy Irene''s Deus Sema, even after she had broken
      most of her bones. Was able to move and headbutt Irene despite having most of
      her bones broken and while a sword was impaled through her body)'
