  intelligence:
    text: Gifted (Erza is an infamously powerful mage, having become an S-Rank Mage
      of Fairy Tail at the tender age of fifteen, and regularly takes on S-Class Missions
      described as being so dangerous that a single mistake could mean instant death.
      While she's skilled with various weapons, she prefers the use of swords, being
      capable enough to use both a conventional and reverse grip, and can even wield
      blades with her toes when restrained. She is also an expert hand-to-hand combatant,
      interspersing it into her swordplay to catch foes off guard, easily grapple
      both Natsu and Gray, the former of whom is an equally infamous brawler. Furthermore,
      she also possesses a keen intellect, being able to figure out why the people
      of Galuna Island were changing into Demons after only a brief period on the
      island, and could also methodically figure out the mechanics behind Midnight’s
      Reflector Magic after being struck by it only a few times)
