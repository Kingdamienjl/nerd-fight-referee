- id: claim-powers-and-abilities-614f5ce3
  section: abilities
  axis: hax
  text: In X784= Superhuman Physical Characteristics, Extrasensory Perception, Magic,
    Empowerment (Her emotions directly translate into magic power and her strength
    grows exponentially more powerful as said emotions get stronger), Limited Absorption
    (All Mages passively absorb Ethernano from the atmosphere to regenerate their
    Magic Power), Blessed (Those with the Fairy Tail Guild emblem are granted greater
    magic power and protection from death while on Tenrou Island), Summoning (Can
    summon various magical armors and weapons through her Requip Magic), Dimensional
    Storage (Can store various weapons and armor within her own pocket dimension),
    Weapon Control (Can control and lift weapons with her mind), Weapon Mastery and
    Expert Markswoman (Extremely skilled with a variety of weapons. Defeated Eclipse
    Sagittarius in an archery match. Was able to hit the Phoenix in the head from
    a distance with a bow and arrow, in which Makarov stated Erza was the only one
    capable of doing so, despite Gray, who is an expert marksman, being present),
    Acrobatics (Can jump on falling debris while rapidly changing her momentum and
    move along vertical surfaces while performing mid air flips), Danmaku (Via Heaven's
    Wheel Armor), Attack Amplification (Via Black Wing Armor), Fire Manipulation (Via
    Flame Empress Armor), Strength Amplification (Via Giant Armor), Holy Manipulation
    (Via Giant Armor and Holy Hammer. The Giant Armor's Lance is effective against
    evil. The Holy Hammer keeps “evil” at bay), Light Manipulation (Via Morning Star
    Armor), Energy Projection (Via Morning Star Armor), Lightning Manipulation (Via
    Lightning Empress Armor), Water Manipulation (Via Sea Empress Armor), Limited
    Flight (Via Several Armors), Speed Amplification (Via Flight Armor), Resistance
    to Illusion Creation (Via Artificial Eye), Petrification (Via Artificial Eye),
    Fire Manipulation (Via Flame Empress Armor), High Temperatures (Via Flame Empress
    Armor), Lightning Manipulation (Via Lightning Empress Armor), Sound Manipulation
    (Via Robe of Yūen. It’s stated that the Robe of Yūen can mitigate sound based
    attacks), and Water Manipulation (Via Sea Empress Armor), Limited Resistance to
    Spatial Manipulation (Was able to block and defend against Ikaruga's Mugetsu-ryu
    attacks) and Durability Negation (Was able to block and defend against Ikaruga's
    Mugetsu-ryu attacks), Possible Resistance to Life Absorption (Was able to resist
    the effects of Aria's Zero) |-|In X791= Same as before, Power Nullification (Via
    Holy Hammer and Nakagami Armor. The Holy Hammer can nullify all the effects "Real
    Nightmare", which includes abilities such as Transmutation, Age Manipulation,
    Biological Manipulation, Time Manipulation, Attack Reflection, Matter Manipulation,
    Magic Absorption, Memory Manipulation, Mind Manipulation, Sense Manipulation,
    and Madness Manipulation. The Nakagami Armor can dispel and negate magic), Supernatural
    Willpower (Resisted her Wedding Dress from being nullified by Coordinator due
    to her desperation of wanting to get married), Limited Adaptation (Was capable
    of adapting to the loss of her five senses by developing her 6th or 7th SenseFairy
    Tail Vol 58 Chapter 404), Instinctive Reaction (Was able to accurately fight Kyôka
    and react to her attacks, despite losing all five of her senses), Resistance to
    Real Nightmare (The Holy Hammer protects Erza from all the effects of "Real Nightmare",
    which includes abilities such as Transmutation, Age Manipulation, Biological Manipulation,
    Time Manipulation, Attack Reflection, Matter Manipulation, Magic Absorption, Memory
    Manipulation, Mind Manipulation, Sense Manipulation, and Madness Manipulation),
    Pain Manipulation (Experienced no pain from having her Second Origin unlocked,
    despite the process involved in unlocking one's Second Origin being excruciatingly
    painful. She was able to withstand dozens of Kyôka’s slashes despite each slash
    sending pain into Erza that is equivalent to a large portion of her Abdomen being
    blown off, and she was able to withstand it without flinching), and Power Nullification
    (Via Wedding Dress Armor. Resisted Coordinator's attempts at nullifying her Requip)
    |-|In X792= Same as before, Stealth Mastery (Via Ataraxia Armor and her normal
    physicals. She can attack someone with cuts so swift, that they are undetectable.
    Created several large magic circles without Swan noticing), Limited Power Mimicry
    (Was able to copy Swan’s footwork technique, which allowed her to set up a multi-step
    spell during the midst of battle), Vibration Manipulation (Was able to copy Swan’s
    footwork technique), Extra Limited Power Nullification (Was able to copy Swan’s
    footwork technique), Free Movement (Was able to copy Swan’s footwork technique),
    Air Manipulation (Via Wind God Armor), Fear Inducement (Was able to strike fear
    into Neinhart's Historia of the Dead and make them disappear just by glaring at
    them)
