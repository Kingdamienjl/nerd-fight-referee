- id: claim-weaknesses-613a0480
  section: weaknesses
  axis: weakness
  text: 'Gray cannot eat the ice created from his own Devil Slayer Magic to replenish his stamina. Iced
    Shell sacrifices the user''s life. Lost Iced Shell completely erases the user''s existence. Notable
    Attacks/Techniques: |-|Ice-Make= Ice-Make: A form of Molding Magic that allows the user to create
    ice at his will and to shape it into objects. In Gray''s case, he uses Static Ice-Make, meaning he
    can shape his ice into inanimate things or weapons. Ice-Make is a highly versatile form of Magic,
    coming in useful both in battle, for offensive and defensive purposes, and outside of it. Specializing
    in it and having been practicing it for years, Gray possesses extreme mastery over it, capable of
    creating countless amounts of objects for a multitude of uses. Also, according to him, Ice-Make allows
    the user to produce virtually anything, granting the user an unmatched creation capability. As an
    Ice-Make user, Gray is an individual resistant to cold and can take damage from ice and snow-based
    attacks without sustaining a major injury and is either entirely immune to snow-based attacks such
    as Eve Tearm''s Snow Magic or is more resilient to it than other people. Gray can also freeze and
    reshape Juvia, a Water Magic user, into various Ice-Make creations in her liquid form. *Ice-Make:
    Lance: Gray extends his arms forward, creating long, curved ice lances that he shoots toward his enemy,
    impaling them. This makes for a powerful ranged attack. **Ice-Make: Freeze Lancer: Gray creates larger
    ice lances that he attacks his enemy with. *Ice-Make: Shield: Gray creates a large shield made of
    ice in front of him, whose shape is vaguely reminiscent of a flower, which shields everything behind
    it. Initially, Gray''s shield was identical in appearance to Ur''s. When fighting Rufus, however,
    it took a new unique shape, reminiscent of both Ur''s and Lyon''s shield. *Ice-Make: Hammer: Gray
    creates a big ice hammer that floats above his opponent before dropping on them with great force.
    The first time Gray used this against Lyon, he was blocked. **Ice-Make: Ice Hammer: Gray creates a
    giant spiked hammer made out of ice and hammers it onto the target. **Ice-Make: Ice Impact: Gray creates
    an intricately-designed hammer made of ice, which he brings down onto the targeted area, creating
    a high impact. *Ice-Make: Floor: Gray freezes the floor, making anyone in the area slip. Gray can
    also freeze water with this spell and slide on the resultant floor. *Ice-Make: Knuckle: Freezing the
    ground under his opponent, Gray creates a tower made of large ice fists which strike his opponent.
    *Ice-Make: Saucer: Gray creates a large, spinning ice disk, capable of cutting through like a buzz-saw,
    which he launches at his target. *Ice-Make: Fishnet: Gray releases an icy wind from his hands, which
    takes on a fishnet-like shape, and allows him to freeze his opponent. *Ice-Make: Arrows: Gray creates
    one or more arrows out of ice, which are subsequently shot at high speed to enemies through the use
    of an ice bow. **Ice-Make: Super Freeze Arrow: Using "Ice-Make: Ice Geyser" and standing on top of
    the resulting ice formation, Gray can rise up to a high point to shoot his arrow; after the shot,
    the speed of the projectiles increases with gravity and air pressure, making this attack much deadlier
    than usual. The first time Gray used this was to defeat Racer. *Ice-Make: Battle Axe: Gray creates
    an ax out of ice for melee combat and swings it around him. The first time he used this was against
    Juvia, but it was ineffective. *Ice-Make: Sword: Gray creates a sword out of ice for melee combat.
    The blade is very durable, capable of cutting and parrying other weapons as if it were made of metal.
    **Ice-Make: Cold Excalibur: Gray creates a massive great-sword out of ice for melee combat. As with
    its smaller version, the weapon is powerful and sharp; also, its slashes seem capable of leaving behind
    large wakes of ice which can damage the opponents. **Ice-Make: Ice Bringer: Gray generates two swords
    of ice in his hands and rapidly moves them forward in an X motion to slash his opponent. *Ice-Make:
    Ice Geyser: Freezing the ground before him, Gray creates a tower of ice spikes that impales opponents,
    greatly damaging them. The first time Gray used this was to attack Lyon, but he failed. **Ice-Make:
    Ice Wall: An alternative version of "Ice-Make: Ice Geyser," which freezes the opponent instead of
    impaling them. *Ice-Make: Prison: Gray creates a large square cage out of ice to trap opponents. The
    first time he used this was to stop Lyon''s ice animals from attacking him. *Ice-Make: Clone: Gray
    creates a copy of himself made out of ice. The replica is perfectly identical to him, being revealed
    as made of ice only after a close, careful inspection, and thus coming in useful to avoid enemy attacks
    or create a distraction for Gray to attack on his own. Gray has shown the capability to form at least
    two copies at a time. *Ice Blade: Seven Slice Dance: After creating ice blades jutting back from both'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-bfc32903
  section: abilities
  axis: hax
  text: 'In X784= Superhuman Physical Characteristics, Enhanced Senses, Extrasensory Perception, Magic,
    Empowerment (His emotions directly translate into magic power and his strength grows more powerful
    as said emotions get stronger), Limited Absorption (All Mages passively absorb Ethernano from the
    atmosphere to regenerate their Magic Power), Blessed (Those with the Fairy Tail Guild emblem are granted
    greater magic power and protection from death while on Tenrou Island), Awakened Power (Achieved Unison
    Raid, which is so difficult that even dedicating your entire life to achieving it isn''t enough to
    use it), Ice Manipulation, Weapon Creation (Can form weapons with Ice-Make Magic), Weapon Mastery
    and Expert Marksman (Skilled at many kinds of weaponry that he can make with Ice-Make Magic. Pinpoint
    and hit Racer with a arrow from a great distance), Platform Creation (Via Ice-Make: Platform. He is
    capable of creating platforms in mid air), Non-Physical Interaction (Can freeze Fire Magic), Stealth
    Mastery, Danmaku (Via Ice-Make Unlimited: One Sided Chaotic Dance and Ice Make: Arrows), Temperature
    Manipulation, Forcefield Creation (Via Ice-Make: Rampart and Ice-Make: Shield), Duplication (Via Ice-Make:
    Clone), Rage Power, Limited Flight (Via Ice Make: Kite), Sealing (Via Iced Shell), Shapeshifting (Iced
    Shell turns the user''s body into ice to seal away the target), Vehicular Mastery (Rode a motorcycle
    through a forestry terrain all while being able to cast spells and dodge attacks as well as avoid
    multiple trees all whilst in the midst of combat and going at high speeds), Resistance to Cold Temperatures
    and Fire Manipulation (Was able to withstand and take only minor burns from Fukuro''s Fire.Fairy Tail
    Vol 11 Chapter 89 Was completely unaffected by Rufus''s Fire Magic.Fairy Tail Vol 36 Chapter 306 Devil
    Slayer Ice was unable to be melted or affected by X791 Base Natsu''s FireFairy Tail Vol 40 Chapter
    343) |-|In X791= Same as before, Devil Slayer Magic (His Magic is especially effective against demons
    and those with demon-like properties, bypassing their defenses), Breath Attack, Absorption (Can consume
    ice to replenish his magic reserves), Limited Power Mimicry (Slayers are able to acquire new powers
    by absorbing their element. Copied Invel''s True-Ice Kamui), Resistance to Ice Manipulation (Devil
    Slayers are resistant to their own element), Earth Manipulation (Devil Slayer Ice is unaffected by
    Virgo''s Diver MagicFairy Tail Vol 41 Chapter 347), and Curse Manipulation (Devil Slayers are resistant
    to all types of curses. This includes curses with Sense Manipulation, Pain Manipulation, Necromancy,
    Body Puppetry, Soul Absorption, Poison Manipulation, Magic Nullification, Weather Manipulation, Elemental
    Manipulation, Plant Manipulation, Conceptual Manipulation (Type 2), Existence Erasure and Attack Deflection)
    |-|In X792= Same as before, Acrobatics (Can perform various flips and dodges mid air), Afterimage
    Creation (Created several after images while dodging mid air), Likely Absolute Zero (Copied Invel''s
    True-Ice Kamui, which is stated to have a cold that surpasses Absolute Zero, however the validity
    of this statement is questionable due to it coming from a Weekly Shonen Magazine editor''s noteFairy
    Tail Chapter 497), Limited Memory Manipulation (Via Lost Iced Shell. Lost Iced Shell removes Gray''s
    existence from the memories of everyone who knew him), Resistance to Likely Absolute Zero (Gray was
    unable to be completely frozen by Invel''s Freezing), Corruption (Gray was able to withstand the corrupting
    effects of Devil Slaying Magic and save Lucy from the Book of END''s corruption), and Mind Manipulation
    (Temporarily broke free of Invel''s Ice Lock), Earth Manipulation (The ice produced by a devil slayers
    is unaffected by Virgos diver magic)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
