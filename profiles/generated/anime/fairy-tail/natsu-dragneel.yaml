  stamina:
    text: Superhuman (Has been shown to fight multiple opponents without resting and
      continue fighting despite taking severe and life-threatening injuries. Battled
      Gajeel and kept fighting him despite having his arm broken and being pierced
      by many shards of iron. He battled Cobra for an extended period while being
      affected by his poison. Battled Zero and ultimately defeated him despite sustaining
      many grievous injuries prior to their fight. Used several consecutive spells
      against Gildarts, and even after being hit by his Disassemble Spell, he managed
      to use his Dragon Slayer Secret Art without showing any signs of exhaustion.
      Battled Acnologia alongside his guild with little time to rest and without fully
      healing his injuries from his previous fights. Kept fighting without issue even
      after being hit internally by several explosions from Guttman's Rupture Magic.
      Continued to fight even after being hit by many attacks from Imitatia that targeted
      his vital spots that caused him intense pain and left him unable control his
      body. Blocked one of Sting Eucliffe's strongest attacks, Holy Nova, with a single
      hand, and emerged completely unscathed from the enormous explosion that followed
      the impact. Battled Future Rogue without issue despite him being brutalized
      prior to their fight. Kept fighting Jackal without issue, even after being hit
      by many of his explosions. He can also eat fire and other magics to restore
      his magic power and stamina)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Kilometers to Interdimensional (His Lightning Fire Dragon's Roar reached
      across Tenrou Island.Fairy Tail Season 7 Episode 215 His magic power effected
      and merged 12 separate pocket dimensions into oneFairy Tail Season 7 Episode
      215)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Average normally, Gifted in combat (Natsu is a bull-headed, hot-blooded,
      and reckless youth with a short attention span and poor common sense. He is
      often regarded as an idiot by those close to him and rarely ponders over the
      little details before charging into a fight. However, Natsu has been shown to
      be rather smart when it comes to people's emotions as he is often able to understand
      someone's mood just by looking at their actions and inflections. As well, on
      many occasions, Natsu has displayed a certain level of maturity and seriousness
      when the situation demands. Nevertheless, Natsu is an extremely skilled hand-to-hand
      combatant and magic user, often using his Dragon Slayer Magic in combination
      with punches, kicks, and even headbutts, to combat his opponents to great effect.
      He was skilled enough to be recognized as one of the guild's best brawlers and
      was a candidate to become an S-Rank Mage. Natsu has also shown to be an extremely
      gifted analyst when it comes to combat, as he was able to read and memorize
      the fine details of Sting's fighting style after clashing with him for only
      a few minutes at best, which allowed him to completely overwhelm and dominate
      him in hand-to-hand combat. As well, Natsu has shown himself to be an excellent
      leader, spearheading improvised tactics against powerful foes like Dorma Anim
      and being the head figure in the assault on Hades)
    source_ids: *id002
    confidence: 0.95
