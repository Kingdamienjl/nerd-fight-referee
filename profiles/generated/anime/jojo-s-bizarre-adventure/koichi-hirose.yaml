- id: claim-weaknesses-1a3654e7
  section: weaknesses
  axis: weakness
  text: 'Act 2 and Act 3 can only put down one kana at a time. Echoes 3 Freeze lasts
    only if the target remains within 5 meters of ACT3. Any damage done to either
    ACTs will reflect back onto Koichi. Notable Attacks/Techniques: Koichi Act 1 Soundmaker.gif|Act
    1: Sound Generation Koichi Act 2 Soundmaker.gif|Act 2: Sound Effects Koichi Act
    3 3 Freeze.gif|Act 3: 3 Freeze *Echoes: Koichi''s Stand. Rare among Stands, Echoes
    has three distinct forms called "Act"s that he may call upon alternatively. Act
    1 is a small, reptilian-like Stand with a large head, small arms, long tails,
    and wheels as "legs". Act 2 is somewhat the same, but it has a small body with
    legs, and a longer tail. Act 3 is completely different, being a short, green-and-white
    humanoid Stand with vulgar vocabulary. **Sound Generation: Echoes Act 1 can write
    a sound effect in Katakana on anything, from human flesh to the ground, and have
    that sound repeat itself over and over with increasing volume. Echoes can shoot
    sound effects from both its tail and hands. This ability seems to allow it to
    also transfer words. **Sound Effect: Echoes'' second form increases its sound
    abilities beyond its first form''s capabilities. When the kana is written on an
    object, touching it activates the effect of the sound (ex. if the sound word hyoo
    ("whoosh") is written, it creates a gust of wind with increasing force). **3 Freeze:
    Act 3 rapidly punches its target before attributing a "freezing" or stopping effect
    by greatly increasing the effect of gravity upon the target, said gravity is enough
    to sink cars into solid concrete and have something with the mass of a human hand
    shatter solid ground upon impact. The effect was enough to make Sheer Heart Attack
    cave in the ground around it, of which the perceived weight of it was 40-50 kilograms
    when reflected back onto Yoshikage Kira. == Gallery== Koichi Key Art.png|Part
    IV Key Art img chara.png|Part V Key Art L 5189f1a345971.jpg|Koichi in All Star
    Battle HiroseKoichi jojoeohhhhh.png|Koichi in Eyes of Heaven ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}}
    {{Discussions}} Category:Stand Users Category:JoJo''s Bizarre Adventure Category:Characters
    Category:Male Characters Category:Teenagers Category:Manga Characters Category:Sound
    Users Category:Anime Characters Category:Game Characters Category:Good Characters
    Category:Explosion Users Category:Multiple Selves Users Category:Aura Users Category:Extrasensory
    Perception Users Category:Flight Users Category:Non-Physical Interaction Users
    Category:Invisibility Users Category:Incorporeal Characters Category:Intangibility
    Users Category:Transformation Users Category:Afterimage Users Category:Stone Walls'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-ae5e2a04
  section: abilities
  axis: hax
  text: Koichi=Superhuman Physical Characteristics, Extrasensory Perception (Can see
    ghosts and souls among some other supernatural forces that are normally otherwise
    invisible), Aura, Multiple Selves (Type 2; Echoes is a spiritual entity derived
    from Koichi's soul and, notably with Act 3, is a completely sentient being with
    a personality of its own), and Summoning (Of his Stand) |-|Echoes Act 1/2/3=Extrasensory
    Perception (Can see ghosts and souls among some other supernatural forces that
    are normally otherwise invisible), Incorporeality (Stands are the incorporeal
    manifestations of one's vital energy, and can only be harmed by other Stands),
    Non-Physical Interaction (Stands can interact with ghosts and other Stands), Selective
    Intangibility, Invisibility (Stands can only be seen by other Stands and Stand
    Users), Transformation (Can change between Acts at will), Aura, Flight (Within
    its effective range) with all three Acts. Sound Manipulation, Telepathy (Can project
    noises into people's heads) with Act 1. Superhuman Physical Characteristics, Text
    Manipulation (Uses Kanji to apply the imprinted onomatopoeia's effects), Wind
    Manipulation, Explosion Manipulation, Heat Manipulation, can apply Elasticity
    with Act 2. Superhuman Physical Characteristics, Superhuman Speed, Afterimage
    Creation, Gravity Manipulation, Minor Shockwave Generation (Can generate minor
    bursts of air pressure through its movement) with Echoes Act 3
  source_ids: *id003
  decisive: true
  status: unverified
