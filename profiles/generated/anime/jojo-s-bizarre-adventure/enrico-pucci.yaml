    Perception (Capable of seeing ghosts and souls among some other supernatural forces that are normally
    otherwise invisible), Flight (Within its effective range), Acid Manipulation (Whitesnake can exude
    a corrosive acid that slowly melts those afflicted), Sleep Manipulation (Can lull people into a sleep),
    Dream Manipulation (Trapped Jotaro and Jolyne in an advanced hallucination they accepted as reality,
    even choosing specific things to show them within the dream), Illusion Creation (Can cast illusions,
    and use these illusions to disguise itself), Soul Manipulation (Whitesnake or Pucci can extract portions
    of a person's spirit as a tangible Disc, containing either their memories or their Stand, putting
    victims into a coma and killing them without life support), Limited Death Manipulation (If a Disc
    is inserted into a dying person, the original bearer will begin to die as well), Mind Manipulation
    (He can insert Discs on others to control minds), Clairvoyance (It can see through beings that have
    a Disc inserted), Biological Manipulation (Can command organisms with his Disc's, including to literally
    explode. Gave a colony of plankton sentience), Sense Manipulation (Whitesnake can use Discs to remove
    and bestow senses), Sound Manipulation (Used a normal Disc on someone to reproduce music), Power Bestowal
    (A Stand Disc can be inserted into someone else to grant them the Stand contained within, or force
    harmful abilities into them), Invisibility (A Stand can only be seen by other Stand user), Incorporeality
    (Stands are the incorporeal manifestations of one's vital energy, and can only be harmed by other
    Stands), Non-Physical Interaction (Stands can interact with ghosts and other Stands), Selective Intangibility,
    Aura, Stealth Mastery, Surface Scaling & Adhesive Manipulation (Can change its body's consistency
    into that of goop, allowing it to stick to walls) |-|C-Moon=Superhuman Physical Characteristics, Extrasensory
    Perception (Capable of seeing ghosts and souls among some other supernatural forces that are normally
    otherwise invisible), Levitation (Grants Pucci the ability to invert gravity, allowing him to propel
    himself off of surfaces and float without any external force), Gravity Manipulation (C-Moon makes
    Pucci the center of reverse gravity, repelling all objects away from him), Selective Intangibility,
    Invisibility (Stands can only be seen by other Stands and Stand Users), Incorporeality (Stands are
    the incorporeal manifestations of one's vital energy, and can only be harmed by other Stands), Non-Physical
    Interaction (Stands can interact with ghosts and other Stands), minor Time Acceleration (Passively
    accelerates time in a localized area around him), Age Acceleration (Aged half of a baby's body into
    an adult and egg yolk into partially-formed chicks), Limited Resistance to Time Stop (Pucci could
    see and think in Jotaro's time stop) |-|Made in Heaven=Acrobatics, Made in Heaven has Superhuman Physical
    Characteristics, Afterimage Creation (Both it and Pucci through the effects of the acceleration),
