- id: claim-powers-and-abilities-04111971
  section: abilities
  axis: hax
  text: "The A.Phex Brothers=Superhuman Physical Characteristics, Transformation (Similar to other rock\
    \ humans they are able to turn themselves into a rock), Resistance to heat and cold (While in this\
    \ form they can sustain temperatures as high as 950 \xB0C and as low as -240 \xB0C), Immortality (Type\
    \ 2, Scaling to Tamaki Damo. One of them survived being stabbed in the head by a tree branch), Extrasensory\
    \ Perception (Capable of seeing ghosts and souls among some other supernatural forces that are normally\
    \ otherwise invisible), Aura, and Summoning (Of their Stands) Schott No.1=Deconstruction, Matter Manipulation,\
    \ Transmutation, Limited Body Control (Can break down things he touches with his left hand into a\
    \ rocky substance and rebuild them with his right hand. Can change the shape of the things he rebuilds\
    \ freely and can even do it with liquids and gases) Schott No.2=Extrasensory Perception (Much like\
    \ its user), Incorporeality (Stands are the incorporeal manifestations of one's vital energy, and\
    \ can only be harmed by other Stands), Poison Manipulation, Corrosion Inducement, Pain Manipulation\
    \ (Releases a poisonous gas that can instantly eat through flesh and make Josuke convulse from pain\
    \ with only a small dose. A higher dose can instantly break a body into pieces)"
  source_ids: *id003
  decisive: true
  status: unverified
