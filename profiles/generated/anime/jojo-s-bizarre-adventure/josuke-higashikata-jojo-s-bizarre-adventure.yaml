power_scale:
  tier:
    text: '{{9-B}}, at least {{9-A}} with Crazy Diamond, {{High 8-C}} while enraged
      | {{9-B}}, at least {{8-C}} with Crazy Diamond, {{High 8-C}} when enraged'
    source_ids:
    - mediawiki-josuke-higashikata-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Wall level (Elbowed Koichi so hard he flew through the air and burst through
      a metal door), at least Small Building level with Crazy Diamond (Significantly
      above Echoes Act 2), Large Building level+ while enraged (Power increases with
      anger. While he failed to visibly harm him, he managed to break through a casual
      Star Platinum's guard with several blows and surprised Jotaro with his power).
      | Wall level, at least Building level with Crazy Diamond (Stated to have gotten
      much stronger as Part 4 progressed. Comparable with Red Hot Chili Pepper and
      forced him to drain Morioh of power in order to surpass Crazy Diamond. Managed
      to briefly contend with an amplified Akira Otoishi before being overpowered.
      While at his limit, he dealt critical damage to Killer Queen to a less but comparable
      degree as Star Platinum), Large Building level+ when enraged, can ignore conventional
      durability by fusing people with other objects.
    source_ids:
    - mediawiki-josuke-higashikata-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Peak Human with at most Relativistic+ reactions (Could manifest Crazy Diamond
      before a bullet hit him at point-blank range. Could react to Red Hot Chili Pepper
      emerging from a wire at lightspeed, though is demonstrably slower than him.
      Can consistently react to Bad Company). At least Relativistic+, possibly Speed
      of Light with Crazy Diamond (Could throw a punch and strike Red Hot Chili Pepper
      before he exited a wire, despite the Stand moving at the speed of light. While
      slower, it could contend with an empowered Red Hot Chili Pepper), up to FTL
      (Crazy Diamond's speed is directly proportional to the distance it is from Josuke,
      with it increasing or decreasing relative to how far away it is from its user,
      being able to surpass Red Hot Chili Pepper in speed while at point-blank range),
      far higher while enraged (Continuously out-sped Killer Queen, who was slower
      than, but comparable to his base state. Jotaro made note of his speed while
      he was furious). Varies, up to FTL with Restoration (Could restore Okuyasu's
      body after it was taken away at light-speed, restoring him back before Red Hot
      Chili Pepper could reach his destination, despite Red Hot Chili Pepper moving
      at the speed of light).
    source_ids:
    - mediawiki-josuke-higashikata-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Wall level, possibly higher (Took a hit equal to that of his Stand's own
      attack). At least Small Building level, Large Building level+ while enraged.
      | At least Building level with Crazy Diamond (Forced Red Hot Chili Pepper to
      drain Morioh of power to defeat Crazy Diamond. Took multiple blows from an empowered
      ), Large Building level+ when enraged.
    source_ids:
    - mediawiki-josuke-higashikata-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman. (Josuke can take severe punishment and keep on fighting, withstanding
      being hit by several of Killer Queen's explosions and pushing onwards, despite
      having wood fragments jammed into his stomach and leg, making it hard for him
      to walk)
    source_ids:
    - mediawiki-josuke-higashikata-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Standard Melee Range physically, Crazy Diamond has an effective manifestation
      range of 1-2 MetersJoJo''s Bizarre Adventure: Diamond is Unbreakable Chapter
      27, Standard Melee Range physically, upon utilizing Restoration the objects
      in question will take the shortest path to become full again (Though it doesn''t
      apply to things that have been erased or vanished from the worldJoJo''s Bizarre
      Adventure: Diamond is Unbreakable Chapter 31), at least Tens of Meters with
      projectiles (Can flick things like bullets 50-70m before outside conditions
      affect accuracyJoJo''s Bizarre Adventure: Diamond is Unbreakable Chapter 63;
      hit Bug-Eaten from 60 meters awayJoJo''s Bizarre Adventure: Diamond is Unbreakable
      Chapter 64)'
    source_ids:
    - mediawiki-josuke-higashikata-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: At least Above Average. (Josuke's years of experience with his Stand have
      left him a skilled and inventive fighter, much like his father. He uses Crazy
      Diamond's ability to restore objects creatively, to form containers to trap
      opponents, create hazards by breaking down various materials, dodge attacks
      by restoring debris stuck in his wounds to its rightful place, pulling him along,
      and to fire perfectly accurate projectiles by restoring them to a bit of the
      original structure stuck on his target.)
    source_ids:
    - mediawiki-josuke-higashikata-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
