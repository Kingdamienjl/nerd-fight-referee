- id: claim-weaknesses-95045a0a
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Spice Girl: Spice Girl is a pink, humanoid Stand with
    various mathematical symbols on various spots of her body. She has her own consciousness in protecting
    and helping Trish, using melee attacks alongside its ability for this purpose. **Softening: When Spice
    Girl makes direct contact with an object, she can make it soft to the point of it being indestructible.
    Even moving objects, such as bullets or projectiles, can become soft and even lose some kinetic energy
    from their movement (though not entirely). This indestructibility is only limited to Spice Girl herself.
    These softened objects become elastic like rubber and cannot be pierced, punctured, or broken through;
    this proves useful for cushioning blows and impacts. When returned back to normal by Spice Girl, any
    attempted damage at the softened object can be thrown back to the source. Spice Girl herself is exempt
    from the reflection, however. She is capable of softening things to break them apart as well. ==Notable
    Matchups== Victories: Goyle (Blood Lad) Goyle''s profile (Speed Equalized) Losses: Jolyne Cujoh (Jojo''s
    Bizarre Adventure) Jolyne''s Profile Inconclusive: ==References== {{scroll box|content={{reflist|2}}}}
    {{discussions}} Category:Characters Category:Female Characters Category:JoJo''s Bizarre Adventure
    Category:Manga Characters Category:Humans Category:Stand Users Category:Protagonists Category:Good
    Characters Category:Heroes Category:Matter Users Category:Invisibility Users Category:Incorporeal
    Characters Category:Non-Physical Interaction Users Category:Flight Users Category:Invulnerability
    Users Category:Attack Reflection Users Category:Elasticity Users Category:Aura Users Category:Extrasensory
    Perception Users Category:Summoners Category:Intangibility Users Category:Afterimage Users Category:Multiple
    Selves Users Category:Orphans'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-da876abd
  section: abilities
  axis: hax
  text: Peak Human Physical Characteristics, Extrasensory Perception (Capable of seeing ghosts and souls
    among some other supernatural forces that are normally otherwise invisible), Multiple Selves (Type
    2; Spice Girl is a spiritual entity derived from Trish's soul and is cognizant, even able to give
    Trish advice and act on its own will), Aura, and Summoning (Of her Stand). Spice Girl has Superhuman
    Physical Characteristics, Afterimage Creation (Its attacks often leave numerous afterimages), Extrasensory
    Perception (Much like her user), Matter Manipulation (Can soften objects to the point of Invulnerability,
    Elasticity and reflecting any damage taken by a softened object), Invisibility (Only other Stand Users
    can see Stands), Incorporeality (Stands are the incorporeal manifestation of one's vital energy and
    can only be harmed by other Stands), Non-Physical Interaction (Stands can interact with ghosts and
    other Stands), Selective Intangibility, Flight, Aura
  source_ids: *id003
  decisive: true
