- id: claim-weaknesses-dda51e32
  section: weaknesses
  axis: weakness
  text: 'Joseph must maintain a steady breathing rhythm to utilize Hamon, and if his breathing is cut
    off, he will be incapable of creating anymore Hamon. His ultimate technique drains all of his current
    Hamon, leaving him vulnerable for a brief time. As he ages, Joseph becomes increasingly stubborn and,
    as a result of neglecting his Hamon training, is less skillful in its use. Notable Attacks/Techniques:
    Clackervolley.gif|Joseph''s use of the clackers Josephgun.gif|Joseph gunning down Straizo Secrettech.gif|The
    secret technique of the Joestar family *Hamon: Joseph was born with the ability to use the Hamon,
    also known as Sendo and the Ripple, thanks to his heritage, being the grandson of Jonathan Joestar
    and the son of Lisa Lisa. Drawing from the light of the sun and the steady breathing of its user,
    Hamon energy is used to combat beings of darkness such as zombies, vampires, and the Pillar Men. A
    user of Hamon can channel it through all sorts of objects, animate or inanimate, to reach a target.
    Liquids conduct Hamon especially well, but as it is reliant on the user''s breathing, if this is cut
    off, the Hamon cannot be utilized. While Hamon is primarily a weapon against enemies weak to sunlight,
    it can be just as deadly against humans, as it can be used to kill a human being by stopping their
    heart if they aren''t strong enough to take it. **Clackers: In an attempt to come up with a technique
    able to harm even the Pillar Men, Joseph developed a style of combat centered around toy clackers.
    When infused with Hamon the clackers become dangerous weapons, capable of storing and building Hamon
    through repeated swinging and clacking whilst violently discharging when coming in contact with an
    object. **Rebuff Overdrive: Joseph focuses large amounts of his Hamon into the points of his elbows
    whilst delivering a powerful strike, causing it to be more effective than any ordinary attack due
    to the energy being channelled into a single point. It''s capable of piercing the skin of even the
    Pillar Men, who are already durable enough to resist and ignore most Hamon based attacks. **Ultimate
    Hamon Overdrive: Presumably Joseph''s ultimate attack, as the name would suggest. Joseph focuses all
    of his Hamon into one point and attacks a foe with it, this allowed him to overpower and shatter Kars''
    bone blade, which he himself previously assumed that he had no chance of deflecting it despite succeeding
    in doing exactly that with this technique. As a downside to its power, Joseph becomes vulnerable temporarily
    due to utilizing all of his Hamon into this technique. **Zoom Punch: Just like his grandfather, Joseph
    uses the natural rejuvenation and pain nullification associated with Hamon to temporarily dislocate
    his shoulder and arm in order to extend his reach and strike opponents from a distance. **Hamon Hair'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-c8143ee0
  section: abilities
  axis: hax
  text: '{{#tag: tabber| Battle Tendency= {{#tag:tabber| {{!}}-{{!}}Pre-Training= *Superhuman Physical
    Characteristics *Genius Intelligence *Acrobatics *Afterimage Creation (His attacks can leave afterimages)
    *Vehicular Proficiency (Has demonstrated the ability to pilot and drive a variety of vehicles) *Weapon
    Mastery (Has displayed proficient skill with a variety of weapons) & Expert Marksmanship (Has displayed
    exceptional aim) *Body Control *Statistics Amplification (Empowers his body with the Hamon breathing
    technique and energy, amplifying his body and physical prowess) *Vibration & Energy Manipulation (Through
    a unique breathing technique, Hamon users can draw out vibrations from their blood flow and create
    energy waves with the properties of sunlight, capable of transferring it towards objects and people.
    This can be used to harm any opponent weak to sunlight through contact with any living or non-living
    thing charged with Hamon) *Durability Negation (via Hamon) *Regeneration Negation (High-Mid, but only
    against opponents weak to sunlight) *Water Manipulation *Magnetism Manipulation *Mind Control *Biological
    Manipulation *Healing (Of himself and others) *Information Analysis *Regeneration (Mid-Low, comparable
    to Jonathan who can heal a broken neck and broken bones) *Analytical Prediction (Can predict what
    his enemies will say and do) *Aura *Accelerated Development (Training; Has a high amount of innate
    talent, surpassing even those with over a decade of training within just three weeks) *Limited & Minor
    Self-Sustenance (Types 2 & 3; Hamon can delay the onset of hunger, thirst and bodily functions while
    in use) {{!}}-{{!}} Post Training= *All previous abilities enhanced *Martial Arts (Eventually mastered
    the Sendo technique, the way of the hermit. Is also a capable close-quarters combatant) *Enhanced
    Vibration & Energy Manipulation (After his training, Joseph could shown techniques that require years
    or even decades to learn, and was praised by the Pillarmens for learning this much of Hamon in two
    weeks) *Instinctive Reaction (His body acted subconsciously to defend itself in a life or death situation)
    }} {{!}}-{{!}}Stardust Crusaders= {{#tag: tabber|{{!}}-{{!}}Base= All previous abilities, a bit weaker
    than his Post-Training self due to not training Hamon, Capable of communicating through his Stand,
    Stand User abilities. {{!}}-{{!}}Hermit Purple= Hermit Purple has general Stand abilities, Clairvoyance,
    Technology Manipulation, Mind Reading & Telepathy }} }} |-|Resistances= *Poison (Can eject poisonous
    substances out of his body) *Pain Dampening (The Hamon breathing technique dampens pain significantly)'
  source_ids: *id003
  decisive: true
