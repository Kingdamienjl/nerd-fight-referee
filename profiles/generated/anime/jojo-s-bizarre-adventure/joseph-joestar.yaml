  intelligence:
    text: Genius (Joseph's greatest weapon is his cunning and resourceful mind, which he uses to deceive
      and mislead his opponents by any means necessary. He can quickly analyze them and take note of every
      small detail to accurately guess their recent activities, and even more impressively, predict their
      next words. This allows him to easily psych out and confuse his opponents, many of whom underestimate
      Joseph due to his casual demeanor. In combat, Joseph makes use of everything available to him in
      his surroundings in addition to stage magic tricks such as prestidigitation to catch his opponents
      off guard, with attacks from unexpected angles and with any tool available. Oftentimes, he uses
      multiple tricks, intending one to be caught before it goes off, with a more subtle one waiting for
      its moment underneath. When possible, he prepares for fights ahead of time, heavily arming himself
      in wait for his fight with Straizo and immediately gunning him down and using his sleight-of-hand
      tricks to hit him with clusters of grenades. Joseph has absolutely no problem fighting dirty and
      excels in thinking on the spot and will not hesitate to simply run away if all else fails. Upon
      seeing a technique once, Joseph will attempt to formulate a counter to it, as seen when he countered
      Straizo's Space Ripper Stingy Eyes. He has even outsmarted the brilliant Pillar Men, who can comprehend
      complex technology and learn new languages within seconds, including strategic geniuses like Esidisi
      and Wamuu. His mind isn't the same in his old age, but Joseph still remains clever as always)
    source_ids: *id002
    confidence: 0.95
