- id: claim-weaknesses-85d2569e
  section: weaknesses
  axis: weakness
  text: 'Any damage taken by Sex Pistols will reflect back onto Mista; if all Sex
    Pistols die, Mista will also die. Not very proficient in hand-to-hand combat.
    Sex Pistols cannot be used properly if he is out of bullets. Sex Pistols can get
    into arguments with one another and fight. Mista will avoid anything related to
    the number 4 as he thinks it brings bad luck. Mistagiorno.gif|Mista and Giorno
    teaming up in Eyes of Heaven Naramista.gif|Mista and Narancia teaming up in Eyes
    of Heaven Notable Attacks/Techniques *Sex Pistols: Sex Pistols is a group of six
    small, yellow humanoid Stands similarly shaped like bullets. They are numbered
    1, 2, 3, 5, 6, and 7, each with their own personality and flair. Their only main
    way of attacking is by kicking the bullets Mista fires, each of the six usually
    maintaining a position for a specific bullet. They also help Mista reload when
    he is out of available bullets. **Bullet Trajectory Control: When Mista fires
    a bullet, Sex Pistols will ride the bullet or be next to the bullet. It can then
    rebound the bullet in a different direction for a more precise shot. This can
    usually result in a constant volley of bullet rebounds with numerous bullets at
    once. ==Gallery== Unit Guido Mista.png Unit Guido Mista (Login Bonus).png It''s
    not an enemy Stand.gif|Narancia, Mista and Abbacchio beating a civilian ==Notable
    Matchups== Victories: Hol Horse (JoJo''s Bizarre Adventure) Hol Horse''s Profile
    (Speed was equalized) Yoshikage Kira (JoJo''s Bizarre Adventure) Kira''s Profile
    (Both started 15 meters apart, Speed was equalized, and the Yoshikage Kira key
    was used) Harry Potter (Wizarding World) Harry''s Profile (Starting distance was
    100 meters, both characters have no LoS, and speed was equalized) Losses: Kiritsugu
    Emiya (Fate/Zero) Kiritsugu''s Profile (Kiritsugu without Avalon or prep was used)
    Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}}
    Category:Characters Category:JoJo''s Bizarre Adventure Category:Anime Characters
    Category:Aura Users Category:Energy Users Category:Extrasensory Perception Users
    Category:Flight Users Category:Gangsters Category:Good Characters Category:Gun
    Users Category:Homing Attack Users Category:Incorporeal Characters Category:Intangibility
    Users Category:Invisibility Users Category:Male Characters Category:Manga Characters
    Category:Multiple Selves Users Category:Non-Physical Interaction Users Category:Stand
    Users Category:Teenagers Category:Vigilantes Category:Weapon Masters Category:Weapon
    Users Category:Loyal Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-e1ff01e8
  section: abilities
  axis: hax
  text: Superhuman Speed and Durability, Expert Marksman, Extrasensory Perception
    (Capable of seeing ghosts and souls among some other supernatural forces that
    are normally otherwise invisible), Supernatural Luck (Several gunmen at point-blank
    range could not hit him due to his luck), Multiple Selves (Type 2; Sex Pistols
    is a collection of six spiritual entities all derived from Mista's soul, all of
    which being cognizant and having a unique personality), Aura, and Summoning (Of
    his Stand). Sex Pistols can control the trajectory of bullets, and has Superhuman
    Physical Characteristics, Extrasensory Perception (Much like their user), Homing
    Attack, Flight, Incorporeality (Stands are the incorporeal manifestations of one's
    vital energy, and can only be harmed by other Stands), Selective Intangibility,
    Non-Physical Interaction (Stands can interact with ghosts and other Stands), Invisibility
    (Stands can only be seen by other Stands and Stand Users), Energy Imbuement (Capable
    of imbuing his bullets with Stand energy, allowing his bullets to hit non-corporal
    Stands like Beach Boy)
  source_ids: *id003
