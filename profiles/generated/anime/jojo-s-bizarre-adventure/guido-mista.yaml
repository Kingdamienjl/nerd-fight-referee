  lifting_strength:
    text: 'right|400px {{Quote|I''m good at assassinations. That''s my thing. It''s
      the best bet we have as long as we have Sex Pistols!|Guido Mista}} ==Summary==
      Guido Mista is a major character in JoJo''s Bizarre Adventure Part V: Vento
      Aureo. He joins the Neopolitian gang Passione after his vigilantism almost gets
      him sent for twenty years in prison, but is saved by Bruno Bucciarati. He becomes
      involved in the week-long mission of protecting Trish Una and eventually to
      assassinate the Boss of Passione himself. ==Powers and Stats'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Athlete level, Building level with Sex Pistols (Must kick with the same
      amount of force as the fired bullet to keep it at a constant speed)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Wall level (Survived falling from a 7th floor onto the ceiling of a car.
      Has consistently taken the impact of his own bullets, always being perforated
      by them), Building level with Sex Pistols
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Continued to shoot Ghiaccio completely as he was being shot
      back. Endured severe injuries from having 5 of his 6 Stands killed for several
      minutes before being healed)
    source_ids: *id002
