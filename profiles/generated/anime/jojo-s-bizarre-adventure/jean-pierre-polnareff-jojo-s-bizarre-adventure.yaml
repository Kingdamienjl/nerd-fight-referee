power_scale:
  tier:
    text: '{{10-A}}, likely {{High 8-C}} with Silver Chariot Name: Jean Pierre Polnareff
      Origin: JoJo''s Bizarre Adventure Part III: Stardust Crusaders Gender: Male
      Age: 22 in Part III, 36 in Part V Classification: Human, Stand User'
    source_ids:
    - mediawiki-jean-pierre-polnareff-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Athlete level, likely Large Building level with Silver Chariot (Skewered
      through DIO's head and was even stated by DIO himself that with just a split
      second longer and a little more force he could have heavily damaged him, DIO
      having survived multiple blows from Star Platinum and should be close to his
      previous peak back in Part 1. Initially fought Magician's Red; Even dispelling
      his strongest attack. Could hold his ground against Anubis. During the middle
      of Part 3, Jotaro stated Chariot itself to be "the kind of opponent that you
      really have to fight all-out" and implied that in an all out fight, either him
      or Polnareff would need to dieJoJo's Bizarre Adventure chapter 197 / Stardust
      Crusaders chapter 84. An enraged Chariot snapped the neck of Vanilla Ice and
      repeatedly impaled and tossed him around while severely weakened, him being
      a Vampire created by DIO. Kicked Cream away who can crack Chariot's own armor)
    source_ids:
    - mediawiki-jean-pierre-polnareff-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Peak Human (Could outrun Enya who he claimed was faster than Flo-Jo), at
      least Massively FTL with Silver Chariot (Could consistently tag Hanged Man and
      intercepted and out-sped Hanged Man at point-blank range. Deflected multiple
      of The Sun's Light-Ray Energy simultaneously. Despite not being quite as fast
      as Star Platinum, Jotaro stated that Silver Chariot is the fastest Stand he
      fought up to that point, and that he couldn't go easy on Chariot, otherwise
      he might end up dead, deflected a punch from a held back Mid-Part 3 Star Platinum.
      Could react to and deflect strikes from Anubis, including one encroaching on
      Star Platinum. Knocked out Kakyoin while he was mid-attack. Could intercept
      and parry an attack from Star Platinum), higher after shedding its armor
    source_ids:
    - mediawiki-jean-pierre-polnareff-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: Athlete level, likely higher (Can withstand his own attacks), likely Large
      Building level with Silver Chariot (Can withstand the force of his own blows.
      Took a Cross Fire Hurricane with its armor on; Muhammad Avdol's strongest attack)
    source_ids:
    - mediawiki-jean-pierre-polnareff-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman. Polnareff could keep his ability going (as well as continuing
      engaging in combat and running around a city, jumping from buildings, with a
      minuscule amount of rest) after severe bodily harm (Half of his foot, half his
      hand and his thigh all being consumed by Cream's void on top of minor damage
      like a skinned cheek and elbow as well as a presumably fractured arm)
    source_ids:
    - mediawiki-jean-pierre-polnareff-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Standard Melee Range physically. Extended Melee Range with Silver Chariot.
      It has an effective manifestation range of a little over 1 MeterJoJo''s Bizarre
      Adventure: Stardust Crusaders Chapter 81, possibly up to 2 Meters (Short-Distance
      Power type with a C in RangeJoJo-A-Go!Go!: Section 6; Diavolo claimed it couldn''t
      have moved beyond two metersJoJo''s Bizarre Adventure: Golden Wind Chapter 132
      and stated to be up to 2 meters in supplementary materialJoJo-A-Go!Go!: Section
      6), at least Tens of Meters while enraged (Shocked Vanilla Ice at being able
      to move such a distanceJoJo''s Bizarre Adventure: Stardust Crusaders Chapter
      127 and covered half of DIO''s art roomJoJo''s Bizarre Adventure: Stardust Crusaders
      Chapter 130, a distance measuring over 30 meters in lengthJoJo''s Bizarre Adventure:
      Stardust Crusaders Chapter 128), Extended Melee Range physically (Attacks with
      a rapier), HigherJoJo''s Bizarre Adventure: Stardust Crusaders Chapter 81 when
      he shoots the sword'
    source_ids:
    - mediawiki-jean-pierre-polnareff-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (In Part V, he showed astonishingly good hacking abilities. Shown
      be to a capable fighter and very versatile in a number of situations. Is also
      fluent in French, Italian and presumably English)
    source_ids:
    - mediawiki-jean-pierre-polnareff-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
