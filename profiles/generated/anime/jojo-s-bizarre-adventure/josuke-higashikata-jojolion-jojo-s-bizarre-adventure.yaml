power_scale:
  tier:
    text: '{{9-B}}, {{8-C}} with Soft & Wet Name: Josuke Higashikata (Adoptive), referred
      as "Jousuke" in the end of the manga. Originally Josefumi Kujo & Yoshikage Kira.
      Origin: JoJo''s Bizarre Adventure: JoJolion Gender: Male Age: Estimated 19 Classification:
      Human, Fusion, Stand User'
    source_ids:
    - mediawiki-josuke-higashikata-jojolion-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Wall level (Comparable to Josefumi Kujo, who could incapacitate theJoJo''s
      Bizarre Adventure: JoJolion Chapter 53 A.Phex Brothers and later did so himself,JoJo''s
      Bizarre Adventure: JoJolion Chapter 45 slammed Ojiro hard enough to break a
      tableJoJo''s Bizarre Adventure: JoJolion Chapter 6 and knocked him out cold,JoJo''s
      Bizarre Adventure: JoJolion Chapter 6 kicked Born this Way,JoJo''s Bizarre Adventure:
      JoJolion Chapter 13 can kick through planks of woodJoJo''s Bizarre Adventure:
      JoJolion Chapter 28 and punched Joushu hard enough to make him vomit and fall
      unconsciousJoJo''s Bizarre Adventure: JoJolion Chapter 1). Building level with
      Soft & Wet (Killed Tamaki Damo; Shattering his skull.JoJo''s Bizarre Adventure:
      JoJolion Chapter 55 Can wound Yotsuyu Yagiyama who withstood Sheer Heart Attack.
      Smashed Born this Way''s helmetJoJo''s Bizarre Adventure: JoJolion Chapter 15),
      can ignore durability with his bubbles and Go Beyond'
    source_ids:
    - mediawiki-josuke-higashikata-jojolion-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
