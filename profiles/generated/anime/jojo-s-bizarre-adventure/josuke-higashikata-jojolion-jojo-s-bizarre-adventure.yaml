  stamina:
    text: 'Superhuman. Josuke has shown high pain tolerance and the ability to continue
      fighting despite massive injuries or ailments that includes, being poisoned,JoJo''s
      Bizarre Adventure: JoJolion Chapter 5 being spiked through the back of the head,JoJo''s
      Bizarre Adventure: JoJolion Chapter 13 smashed with objectsJoJo''s Bizarre Adventure:
      JoJolion Chapter 27 and pierced with numerous needles,JoJo''s Bizarre Adventure:
      JoJolion Chapter 28 part of his leg melted through,JoJo''s Bizarre Adventure:
      JoJolion Chapter 46 having his liver gouged out only to simply attach it back
      several minutes later,JoJo''s Bizarre Adventure: JoJolion Chapter 55 punctured
      by a Calamity through the head, chest and leg,JoJo''s Bizarre Adventure: JoJolion
      Chapter 90 and much more with only extreme bodily damageJoJo''s Bizarre Adventure:
      JoJolion Chapter 92 being the closest to incapacitating Josuke. In one notable
      instance, he could withstand being asphyxiated, spewing asbestos out of every
      orifice, multiple flesh wounds, a chunk taken out of his leg, struck with debris,
      impaled through the shoulder, his blood drained and more and still managed to
      go across town to finish off his foe in short order without any rest.JoJo''s
      Bizarre Adventure: JoJolion Could run around the town of Morioh for a prolong
      period of time while being chased constantlyJoJo''s Bizarre Adventure: JoJolion
      Chapter 60JoJo''s Bizarre Adventure: JoJolion Chapter 61JoJo''s Bizarre Adventure:
      JoJolion Chapter 62'
    source_ids:
    - mediawiki-josuke-higashikata-jojolion-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Standard Melee Range. Soft & Wet has an effective manifestation range of
      at least a few meters (Close-Distance with a D in Range;JoJoveller Page 302
      Never seen straying away from Josuke), Varies with bubbles between Tens of Meters
      to at least several Kilometers (Could keep a bubble manifested across town),
      at least Several Meters with Spin Bubbles (Filled a room with them,JoJo''s Bizarre
      Adventure: JoJolion Chapter 98 can fire them from his fingertips at least several
      metersJoJo''s Bizarre Adventure: JoJolion Chapter 104). At least a few Kilometers
      with Go Beyond (Could take Paisley Park''s path and stay manifested several
      kilometers away from Josuke and hit its targetJoJo''s Bizarre Adventure: JoJolion
      Chapter 105JoJo''s Bizarre Adventure: JoJolion Chapter 106)'
    source_ids:
    - mediawiki-josuke-higashikata-jojolion-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Gifted. Josuke is an extremely proficient tactician in a fight. He is able
      to use his Stand to various effects, and predict his opponents'' next moves
      easily. Josuke is a methodical individual, having quickly deduced Born this
      Way''s powers via simple experimentation, as well as taking advantage of Les
      Feuilles''s characteristics despite seeing them in action only recently, Josuke
      is also adept at using his environment to his advantage or using objects within
      his vicinity against his foes as well, atop of exploiting his foes behavior
      and goading them into a disadvantageous situation.JoJo''s Bizarre Adventure:
      JoJolion Chapter 103 Josuke was also able to think up a plan and successfully
      pull it off while accounting for the fact he likely would, and did, lose his
      memories of making such a plan and crucial aspects to said plan in the first
      place.JoJo''s Bizarre Adventure: JoJolion Chapter 10 Out of combat, Josuke is
      thorough in his investigation, being careful about covering his tracks. He has
      also displayed proficient skill in mathematics, having easily solved a trigonometry
      problem given to him by Joushu within mere moments,JoJo''s Bizarre Adventure:
      JoJolion Chapter 18 to further that, Josuke has demonstrated amazing analytical
      and spatial skills, Josuke has demonstrated amazing analytical and spatial skills,JoJo''s
      Bizarre Adventure: JoJolion Chapter 2 capable of deducing the,JoJo''s Bizarre
      Adventure: JoJolion Chapter 2 measurements,JoJo''s Bizarre Adventure: JoJolion
      Chapter 2 lengths,JoJo''s Bizarre Adventure: JoJolion Chapter 3 andJoJo''s Bizarre
      Adventure: JoJolion Chapter 3 distancesJoJo''s Bizarre Adventure: JoJolion Chapter
      7 of various things at just a glance, he also picked up on the fact that Dolomite
      wasn''t talking to him directly from the way he spoke.JoJo''s Bizarre Adventure:
      JoJolion Chapter 65'
    source_ids:
    - mediawiki-josuke-higashikata-jojolion-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
