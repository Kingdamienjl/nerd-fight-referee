  intelligence:
    text: 'Genius (A very competent analyzer of the situations around him, and a skilled
      tactician and leader. Giorno is always calm and analyzes foes, friends, passersby
      and the environment around to have a read on situations. He can speculate or
      make deductions of what is not shown in plain sight, or just detect traps, abnormalities,
      and weaknesses. He has used this mid-combat to set up traps to give himself
      an idea of what his foes were doing and what they would do, silently acting
      in response. Fugo, who has genius level intellect, has made multipleJoJo''s
      Bizarre Adventure: Golden Wind Chapter 46 accountsJoJo''s Bizarre Adventure:
      Golden Wind Chapter 63 of the impressive way Giorno thinks and acts. It is noteworthy
      that a part of the downsides he perceives in foes are due to Stands having specific
      gimmicks that, although powerful, are not perfect and may have some feature
      that can be exploited to overcome them, which is still impressive for him to
      deduct. Some of these complicated stand abilities that he figured out are Illuso''s
      and Melone''sJoJo''s Bizarre Adventure: Golden Wind Chapter 64JoJo''s Bizarre
      Adventure: Golden Wind Chapter 65 stand abilities. He also figured out that
      Diavolo was possessing one of the team with limited information.JoJo''s Bizarre
      Adventure: Golden Wind Chapter 141 He can creatively maneuver around a variety
      of diverse situations by using the many options given by the abilities of his
      Stand, or by instructing his partners to use their powers properly. He took
      over the powerful mafia known as Passione after killing its leader, which requires
      dealing with a number of managements, and aiming to end its selling of drugs)'
    source_ids:
    - mediawiki-giorno-giovanna-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
