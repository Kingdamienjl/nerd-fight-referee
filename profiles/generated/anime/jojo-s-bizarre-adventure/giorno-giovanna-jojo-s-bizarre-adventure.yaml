  attack_potency:
    text: 'Street level (Narancia jumped this high while he was in Giorno''s bodyJoJo''s
      Bizarre Adventure: Golden Wind Episode 37); Building level with Gold Experience
      (Was able to damage Black Sabbath,JoJo''s Bizarre Adventure: Golden Wind Chapter
      13 who incapacitated Echoes ACT3,JoJo''s Bizarre Adventure: Golden Wind Chapter
      14 who in turn was able to take hits from Killer Queen. Weaker than, but can
      still contend with Sticky Fingers,JoJo''s Bizarre Adventure: Golden Wind Chapter
      6 who staggered King CrimsonJoJo''s Bizarre Adventure: Golden Wind Chapter 81JoJo''s
      Bizarre Adventure: Golden Wind Chapter 82), can ignore durability with most
      abilities | Street level; at least Large Building level+, likely far higher
      with Gold Experience Requiem (Virtually invincible in JoJo, not having any of
      its stats measured, while Stands like The World and Star Platinum - the later
      being called the strongest Stand in the world -, can have their stats measured.
      Said to exceed all existing Stands in attack power,JoJo A-Go!Go!: Gold Experience
      Requiem Page 2 which puts it above all Stands, including Red Hot Chili Pepper
      while powered by Morioh''s energy. Diavolo thought it to be a power-up and described
      Gold Experience to be able to attack with incredible power,JoJo''s Bizarre Adventure:
      Golden Wind Chapter 147 could effortlessly pierce King Crimson''s hand and completely
      dismantled it)'
    source_ids:
    - mediawiki-giorno-giovanna-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Peak Human, with at most Massively FTL reactions (Tore off his own arm
      to counter Sticky Fingers.JoJo''s Bizarre Adventure: Golden Wind Chapter 8 Dodged
      a strike from Black Sabbath outside of the shadeJoJo''s Bizarre Adventure: Golden
      Wind Chapter 12 as well as a grab. Moved his body in order to get struck by
      Aerosmith.JoJo''s Bizarre Adventure: Golden Wind Chapter 89 Activated his ability
      on a bullet kicked by Sex PistolsJoJo''s Bizarre Adventure: Golden Wind Chapter
      122); at most Massively FTL with Gold Experience (Despite being a bit slower
      than Sticky Fingers, Gold Experience was able to not only have a fist fight
      with him, reacting and matching his attacks, but also intercept one of his attacks)
      | Peak Human, with at most Massively FTL reactions; at least Massively FTL,
      likely far higher with Gold Experience Requiem (Is the evolved form of Gold
      Experience, keeping its powers and powering up its stats. While near Diavolo
      and in his sight, managed to break free of its Gold Experience "shell" and move
      to another location without being noticed before King Crimson could finish it
      off. Flicked a pebble at such speeds that Diavolo couldn''t perceive the attack,
      barely managing to avoid the brunt of it.JoJoveller: Gold Experience Requiem
      Page 2 Mista claimed he couldn''t really see or understandJoJo''s Bizarre Adventure:
      Golden Wind Chapter 149 what Giorno did to Diavolo in reference to the beatdown
      that defeated him, if maybe in part), Infinite for its Return to Zero (Ranked
      "None" in Speed on its Stand stats,JoJo''s Bizarre Adventure: Golden Wind Chapter
      149 (in-between Stand stats) those being referenced in the JOJO-A-GO!GO! guidebook
      as it stated that its ability "is impossible to compare with the existing Stand(s)
      and measuring rod(s)";JoJo A-Go!Go!: Gold Experience Requiem Page 1 By comparison,
      Notorious B.I.G. and Made in Heaven are ranked "∞" on their speed, with the
      latter having briefly been able to achieve infinite speed [See note 4 below])'
