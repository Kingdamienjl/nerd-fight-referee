- id: claim-weaknesses-88fe16cb
  section: weaknesses
  axis: weakness
  text: 'Any damage taken by Moody Blues will reflect on Abbacchio. When using Chronological Rebroadcasting,
    Moody Blues cannot attack. Notable Attacks/Techniques: *Moody Blues: Moody Blues is a blue humanoid
    Stand notable for the digital timer placed on its forehead. Its appearance changes as it uses its
    ability, but has used melee attacks before. **Chronological Rebroadcasting: Moody Blues can transform
    itself to mimic another person or object and their actions as they were in a time before using the
    ability. There are no limits to how far back it can go as long as Abbacchio is aware of what action
    he is trying to mimic. This ability can also be used as a disguise to make Moody Blues appear as someone
    else from a rewind. ==Gallery== It''s_not_an_enemy_Stand.gif|Narancia, Mista and Abbacchio beating
    a civilian ==Notable Matchups== Victories: Baldi (Baldi''s Basics in Education and Learning) Baldi''s
