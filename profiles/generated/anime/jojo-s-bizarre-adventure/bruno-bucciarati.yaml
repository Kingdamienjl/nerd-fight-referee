- id: claim-powers-and-abilities-7c2b0b4b
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Extrasensory Perception (Capable of seeing ghosts and souls
    among some other supernatural forces that are normally otherwise invisible, after becoming blind he
    perceives the world using the souls of other people), Lie Detection (Can taste sweat and determine
    whether someone is speaking the truth), Immortality (Type 2 and 7. Is a zombie, although he will eventually
    die permanently when he runs out of life energy given to him by Giorno), Aura, Summoning (Of his Stand),
    limited Resistance to Biological Manipulation (Due to being undead, he is not affected by Green Day's
    ability), Pain Manipulation (As a zombie he cannot feel pain). Sticky Fingers has Superhuman Physical
    Characteristics, Afterimage Creation (Its attacks often leave numerous afterimages), Extrasensory
    Perception (Much like its user), Flight (Within its effective range), the ability to open zippers
    in almost anything solid (and can enter a pocket dimension within said object, allows Bruno the ability
    to do this as well), Matter Manipulation, and Deconstruction (Can use his zippers to separate objects
    into multiple pieces), Limited Body Control (Can use its zipper ability on his limbs to greatly extend
    his reach), Limited Spatial Manipulation (Objects that are separated by his zippers can still be connected
    with each other if he wants them to), Incorporeality (Stands are the incorporeal manifestations of
    one's vital energy, and can only be harmed by other Stands), Non-Physical Interaction (Stands can
    interact with ghosts and other Stands), Selective Intangibility, Invisibility (Stands can only be
    seen by other Stands and Stand Users), Aura, Fusionism and Limited Healing (Put back Abbacchio's severed
    hand in place), Limited Surface Scaling (Can use his zippers to move across surfaces)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
