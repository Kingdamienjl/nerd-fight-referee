  intelligence:
    text: Gifted. A high ranking member of Passione, heavily relied upon due to his trustworthiness and
      reliability to get tasks done. Bruno has a surprising amount of ingenuity, making exceptional use
      of his seemingly mundane ability, turning something that would seem weak and useless on paper into
      a extremely dangerous, lethal and versatile power, making use of it in a wide variety of ways both
      in and outside of battle. He's also quite analytical and has shown time and time again to have the
      capacity to figure out a foe's weaknesses and to exploit them, how they fight and make use of their
      abilities and even how much of a priority they are to take out based on their actions and personality.
      Bruno has also shown the qualities of a leader, able to formulate plans and how to best make use
      of his fellow gang member's abilities for their missions. At one point he was also given complete
      management over a variety of operations through Naples and was expected to do so without issue,
      though he never got the chance to show how good he'd have been at managing said tasks.
    source_ids: *id002
