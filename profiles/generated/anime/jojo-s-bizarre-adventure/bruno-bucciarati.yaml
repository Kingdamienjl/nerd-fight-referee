    Category:Summoners Category:Body Control Users Category:Non-Physical Interaction Users Category:Invisibility
    Users Category:Incorporeal Characters Category:Intangibility Users Category:Flight Users Category:Fusionism
    Users Category:Portal Users Category:Matter Users Category:Deconstruction Users Category:Space Users
    Category:Healers Category:Leaders Category:Loyal Characters Category:Gangsters'
