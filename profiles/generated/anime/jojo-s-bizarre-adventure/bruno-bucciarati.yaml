- id: claim-weaknesses-6188bdd9
  section: weaknesses
  axis: weakness
  text: 'Any damage taken by Sticky Fingers will reflect onto Bruno. Bruno can only activate his ability
    through direct contact. Unzipping himself can be fatal if it disconnects him from his heart Notable
    Attacks/Techniques: Sticky Fingers Bruno Zippers.gif|Zippers Sticky fingers powa (temporary).gif|Creating
    an opening through a wall Bruno_Punch_Ari_1.gif|Sticky Fingers launching its fist Ez8.gif|Arrivederci
    Ezgif-2-f51b16396c8f_2.gif|Bruno utilizing Sticky Fingers Ez12.gif|Bruno decapitating Zucchero Bruno_3gif.gif|Attacking
    pillars and reattaching Trish''s hand Bruno_4_gif.gif|Bruno retrieving a phone from his zippers *Sticky
    Fingers: Sticky Fingers is a large, blue-and-white humanoid Stand with zipper themed decor on various
    parts of its body. It uses melee attacks in conjunction with its zipper-based abilities. **Zippers:
    Anything Bruno or Sticky Fingers touches can add a zipper onto that object. From that point, Bruno
    can then zip and unzip that object to any extreme to the point of detaching, reattaching or closing
    off pieces of one object. If Bruno unzips a solid object, it also equally unzips the opposite side
    of it, such as a wall or a body. If a living person or object is unzipped, Bruno can freely damage
    them from the inside if he wishes. If said living person or object is detached, any damage or pain
    taken by the original source will reflect onto them as if they were still connected. Bruno can unzip
    himself to manipulate his body for various purposes, such as detach limbs to extend his range or separate
    his body to dodge attacks. **Unknown Dimension: Sometimes, when Bruno unzips a surface, it will lead
    to a dark, unknown area. Bruno states that he does not know where this is or where it leads to, but
    it can be used as a hiding spot or a gateway to other areas. ==Notable Matchups== Victories: Jolyne
    Cujoh (JoJo''s Bizarre Adventure) Jolyne''s Profile Josuke Higashikata (JoJo''s Bizarre Adventure)
    Josuke''s Profile (Note: Speed was equalized) Losses: Jotaro Kujo (JoJo''s Bizarre Adventure) Jotaro''s
    Profile (Pre-DIO''s World Jotaro was used and they started 15 meters apart from each other) Yoshikage
    Kira (JoJo''s Bizarre Adventure) Kira''s Profile Noriaki Kakyoin (JoJo''s Bizarre Adventure) Kakyoin''s
    Profile Narciso Anasui (JoJo''s Bizarre Adventure) Anasui''s Profile (Speed equalized, in character)
    Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters
    Category:JoJo''s Bizarre Adventure Category:Stand Users Category:Humans Category:Primary Protagonists
