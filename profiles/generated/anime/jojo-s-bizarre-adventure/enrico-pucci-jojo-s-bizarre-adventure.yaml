  tier:
    text: '{{10-B}}; at least {{8-C}} with Whitesnake | {{Unknown}} with C-Moon, {{7-B}}
      Environmental Destruction | At least {{8-C}} with Made in Heaven, {{Varies}}
      with Time Acceleration, {{Low 2-C}} Environmental Destruction through Universal
