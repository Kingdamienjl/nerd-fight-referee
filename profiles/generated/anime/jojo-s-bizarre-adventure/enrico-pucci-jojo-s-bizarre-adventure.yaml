    notes: auto_repair source extraction
  attack_potency:
    text: Human level; at least Building level with Whitesnake (Stronger than Planet
      Waves; Caused far greater damage to Stone Free beyond what these attacks did,
      taking her arm clean off and a chunk of her abdomen. Could tear apart Foo Fighters,
      punch a hole through Narciso Anasui, chop off Weather Report's leg and more.
      Despite not being a Power Type and not suited to one on one exchanges, he's
      exceptionally powerful, beyond most Stands physically) | Unknown with C-Moon
      (Not noticeably strong, although its punches are noted to still be quite dangerous,
      and were able to deflect the bullets that Ermes shot; its abilities ignore conventional
      durability), City level Environmental Destruction (C-Moon's control over gravity
      affects all things in a 3 kilometer radius) | At least Building level+ with
      Made in Heaven (Easily killed Jotaro and Ermes, as well as Jolyne), Varies with
      Time Acceleration (As time speeds up, the destructive power of inanimate objects
      also increases. This does not apply to Pucci himself, but it would apply to
      his throwing knives and various other objects), Universe level+ Environmental
      Destruction through Universal Reset (Made in Heaven will accelerate time until
      the universe is reset)
    source_ids:
    - mediawiki-enrico-pucci-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Average Human, likely Massively Hypersonic with at most FTL reactions (Has
      reacted to Jolyne Cujoh on multiple occasions, Stone Free, Diver Down and more.
      Can react to bullets); at most FTL with Whitesnake (Boasts excellent speed.
      Fast enough to attack Jotaro in the moment they were preoccupied despite them
      being aware of his presence and take his Disc before he or Star Platinum could
      retaliate back, intercepted Foo Fighters' bullets, can keep up with a progressive
      Stone Free and is much faster than her normally in close quarters) | At most
      FTL with C-Moon (Can keep up with Stone Free and barely dodging an attack and
      could fight her, reacted to Diver Down. Can deflect bullets) | Average Human,
      at most FTL, likely higher reactions normally, Varies (Can easily blitz Jolyne,
      Jotaro, Anasui, and Ermes all at once and continuously increases his speed),
      eventually Infinite with Time Acceleration (It will eventually accelerate time
      into infinity and his speed stat is listed as Infinite to reflect that)
    source_ids:
    - mediawiki-enrico-pucci-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
