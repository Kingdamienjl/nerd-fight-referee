power_scale:
  tier:
    text: '{{High 8-C}}, higher with Space Ripper Stingy Eyes | Likely {{High 8-C}}, At least {{High 8-C}}
      with The World | At least {{High 8-C}}. At least {{High 8-C}} with The World.'
    source_ids: &id002
    - mediawiki-2443
    confidence: 0.95
  attack_potency:
    text: "Large Building level (Stated to be one of the most powerful beings in the verse, whether this\
      \ applies to his Part 1 self or later on is unknown though. Furthered his power by drinking the\
      \ blood of numerous innocents throughout the Part, to the point where even while casual, he was\
      \ shown to be at least several times stronger than when he first turned, being stated to be 5 times\
      \ stronger than Pre-Deep Pass Overdrive Jonathan and Will Anthonio Zeppeli combined.\u22484 Tons\
      \ of TNT Much stronger than Tarkus, Bruford, Jack the Ripper and Wang Chan), higher with Space Ripper\
      \ Stingy Eyes (Capable of effortlessly defeating Jonathan Joestar), can ignore conventional durability\
      \ with Vaporization Freezing. | Likely Large Building level (Should be near to his peak during Part\
      \ 1. Consistently deflected Emerald Splash, even with just one finger). At least Large Building\
      \ level+ with The World (The World has overwhelming power with its physical capabilities far exceeding\
      \ Star Platinum's initial capabilities and completely matching it blow for blow7.83 Tons of TNT,\
      \ with no other Stand managing to replicate such a feat throughout the entire series. Dio claimed\
      \ it was the most powerful Stand which would include the likes of Whitesnake and the rest of his\
      \ allies, stated to be one of the strongest Stands in the whole world alongside Star Platinum and\
      \ claimed to be one of the most powerful). | At least Large Building level (Much stronger than before\
      \ due to Joseph Joestar's blood, claiming it was the most powerful that body has ever been. Overpowered\
      \ Star Platinum, in conjunction with The World). At least Large Building level+ with The World (The\
      \ more familiar DIO becomes with Jonathan's body, it's likely The World's fighting capabilities\
      \ increase as well. Demonstrably stronger than he was initially against an enraged Star Platinum,\
      \ even breaking through his guard at maximum output. With DIO, they overpowered Star Platinum)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively FTL (Should have around the same speed as his Stardust Crusaders self. Immensely superior
      to his minions225.15 c) | Massively FTL (Could casually and consistently deflect the Emerald Splash
      multiple times, seeing it as if it was in slow motion. Stopped time after being skewered but seemingly
      before Silver Chariot could greatly damage him. Managed to react to an enraged Star Platinum's punch).
      At least Massively FTL with The World (Faster than an initial Star Platinum; Out-speeding him and
      matching him in a contest of speed and moreover surpassing him. DIO claimed his speed is far greater
      than that of Star Platinum and that he's slow comparatively) | At least Massively FTL reactions
      (At least equal, if not greater than he was before in regards to speed, blocked a strike from an
      enraged Star Platinum). At least Massively FTL with The World (His fighting capabilities likely
      increased and is faster than an enraged Star Platinum, having matched him and at maximum output
      he could cross-counter with Star Platinum at its peak)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: At least Class K, possibly Class M (Superior to Tarkus511.16 Metric Tons) | At least Class K,
      likely Class M (Much stronger than he was before, claimed to be the strongest he's ever been) |
      At least Class K, possibly Class M with The World (Comparable to Star Platinum)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Large Building level | Likely Large Building level, At least Large Building level+ with The
      World | At least Large Building level, At least Large Building level+ with The World
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Large Building level (Should be able to withstand the power of his own attacks. Far more durable
      compared to Tarkus, could tank blows from Jonathan Joestar who's his equal) | Likely Large Building
      level (Should be near his peak during Part 1. Took only superfluous damage from Emerald Splash).
      At least Large Building level+ with The World (Capable of withstanding the force of his own blows
      explicitly. Matched Star Platinum's attacks and took hits from him. Just like Star Platinum, The
      World should outclass nearly any other Stand in durability) | At least Large Building level (His
      body is far stronger; Could tank multiple blows from an enraged Star Platinum, something he couldn't
      do previously against an even weaker Star Platinum), At least Large Building level+ (Much like DIO,
      The World's capabilities increased. Could now briefly match an enraged Star Platinum, something
      it couldn't do prior)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Dio can keep on fighting even when badly injured) | Superhuman, but lower than before
      as he has gone nearly a century without proper nourishment and the body of Jonathan actively resists
      him | Superhuman (Claims that after drinking Joestar blood, this is the strongest he has felt)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, Hundreds of Meters with Space Ripper Stingy Eyes | Standard Melee Range,
      Several Meters with The World (Its maximum range is 10 meters, though it weakens the further it
      strays from DIO), Hundreds of Meters with Space Ripper Stingy Eyes, at least Several Meters with
      throwing knives, High Universal with Time Stop (Due to manipulating time, it is a Range-Irrelevant
      ability that affects the whole world through all the space)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius (Although he is arrogant and full of himself, Dio is a cunning, pragmatic opponent who
      is willing to do anything necessary to succeed in a fight, no matter how underhanded he has to be.
      He experiments with his powers, not just his vampiric ones but the limits of his Stand, pushing
      himself further and further in search of strength, which he uses to brutal effect in fights. With
      The World, DIO does not pull any punches, moving to finish fights as quickly as possible by stopping
      time and unleashing a lethal strike, though he can be goaded into actually fighting against an opponent.
      When fighting against Jotaro, DIO utilized everything at his disposal to defeat him, throwing knives
      at him from a safe distance to test the limits of his ability to move in stopped time before cautiously
      making sure he was dead. Even then, DIO's next move was to decapitate him anyway, just to be safe.
      Before he became a vampire, he was skilled in hand-to-hand combat and had knowledge in Law)
    source_ids: *id002
    confidence: 0.95
