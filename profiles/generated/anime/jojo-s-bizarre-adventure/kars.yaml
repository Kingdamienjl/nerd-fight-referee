- id: claim-weaknesses-59591b3b
  section: weaknesses
  axis: weakness
  text: 'Kars will be turned to stone by overexposure to sunlight and is vulnerable
    to light-based attacks, which circumvent his regeneration | Thanks to his newfound
    powers, Kars is extremely overconfident. He cannot properly adapt to the vacuum
    of space, which will immobilize him, leaving him to drift in the void forever
    Notable Attacks / Techniques: Kars saving a dog.gif|Kars saving a dog Kars cut.gif|Kars''
    saber slicing 600RPM armored bullets Kars slice mk.gif|Casually bisecting Cyborg
    Stroheim Kars hamon mk.gif|Kars'' Hamon vaporizing Joseph''s flesh Kars lava mk.gif|Kars
    creating armor and slicing off Joseph''s arm Kars punch mk.gif|Kars falling 175
    meters and ricocheting himself to avoid harming flowers Kars-ultimate.gif|Showcasing
    his control over his genetic structure Kars flight mk.gif|Kars dodging and deflecting
    heavy artillery fire with oiled shells Jojo animal transformation.gif|Kars transforming
    the fired shells into other organisms vulcano.gif|Kars tanking a massive explosion
    *Pillar Man: Kars is one of the four remaining Pillar Men, the ancient and extremely
    powerful beings who once ruled the Earth and created vampires, for use as a food
    source. While humanoid in appearance, Pillar Men have incredibly unusual biologies,
    with the most obvious sign of their inhuman nature being their horns. They can
    control their bodies with exceptional versatility, such as transforming their
    skeletal structure for combat purposes and flattening themselves and their organs.
    Like the vampires he created, Kars is an immortal being, but he is also weak to
    sunlight, which will turn him to stone, as well as to Hamon, which can be used
    to destroy his body completely. **Absorption: Each of a Pillar Man''s cells produces
    a highly caustic digestive acid that can quickly break down a victim on a cellular
    level on contact, making even the slightest touch potentially fatal. Esidisi was
    able to utilize this ability to replace an arm destroyed by Hamon. This is not
    effective on Hamon users, however, as Kars'' cells instinctively avoid the danger
    this presents. **Biological Possession: Even if reduced to merely a nervous system,
    a Pillar Man can invade the body of an opponent and take control of them. **Light
    Mode: Kars'' "mode" granted by the usage of the Stone Mask to unlock his own heightened
    capabilities. In his case, this allows him to grow bladed appendages, covered
    in tiny, shark-like teeth, which can reflect exceptionally bright light to blind
    his opponents. These blades are also exceptionally sharp, and can easily cut through
    multiple layers of steel. **Regeneration: Pillar Men have regenerative capabilities
    superior to the already exceptional regeneration of vampires, which Straizo utilized
    to pull his body back together after he was blown apart by grenades. center|thumb|400px|Kars''
    abilities as the Ultimate Lifeform *The Ultimate Life'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-47d60106
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= |-|Base= *Superhuman
    Physical Characteristics **Genius Intelligence (A genius even among the Pillar
    Men, who can learn new languages and comprehend complex machinery in seconds)
    **Acrobatics (Hypermobility, All-Terrain Mobility, & Self-Momentum; Shown here)
    **Afterimage Creation **Enhanced Senses (Hearing, Touch & Smell; Kars accurately
    deciphered how many people were in a room by feeling their heat signatures. He''s
    comaparable to Wamuu, who can read the movements of the wind through his horn,
    and detect the presence of other living beings just by their breathing. Kars''
    senses should also be far superior to Santana''s) **Self-Sustenance (Type 1; Pillar
    Men should be capable of surviving without oxygen like Stone Mask Vampires and
    Kars was implied to have used the Stone Mask on himself. Can survive for millennia
    incased within stone and as just a brain) **Immortality (Types 1, 2, 3 & 6; Pillar
    Man can survive after being reduced to just a nervous system by Hamon and still
    be able to possess other bodies while reduced to this state) **Regeneration (High-Mid;
    A Pillar Man''s regeneration is superior to that of normal vampires, like Straizo,
    who regenerated from being blown apart by grenades. Comparable, if not superior
    to Santana, a weaker and less-evolved Pillar Man who''s life functions could only
    be ceased if his body is shredded into 1 cm squared pieces. Possibly Mid-High;
    Even the dust from their body is alive and can reassemble itself, though whether
    this is the true limit of their healing ability or something that can only be
    done if sufficient body mass is already present is unknown) **Bodily Weaponry
    (Conventional; Creates blades from his flesh and bone) **Body Control (Like vampires,
    Pillar Men can easily control their physiology, with Kars being able to grow bladed
    appendages from his limbs. He should be comparable, if not superior to Santana,
    a weaker and less-evolved Pillar Man, who can control tiny pieces of his body
    independently) **Elasticity (Pillar Men can stretch their bodies and contort them
    beyond recognition) *Blade Mastery *Biological Manipulation *Bone Manipulation
    (Capable of manipulating his skeletal structure, even creating blades out of hardened
    flesh and bone) *Acid Manipulation & Absorption (Kars'' cells release a digestive
    acid that quickly dissolves victims on a cellular level on contact, allowing him
    to absorb other lifeforms) *Light Manipulation (His shining blades produce blinding
    light, can emit light even without his blades) *Possession (Pillar Men are able
    to invade bodies and control them. When reduced to a nervous system, Esidisi was
    able to invade Suzi Q''s body and control her) |-|The Ultimate Life'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
