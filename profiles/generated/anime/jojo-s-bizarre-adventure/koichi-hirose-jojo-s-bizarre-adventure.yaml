  tier:
    text: '{{10-B}}, {{Unknown}} with Echoes Act 1, {{9-A}} with Echoes Act 2, at
      least {{9-A}} with Echoes Act 3 Name: Koichi Hirose Origin: JoJo''s Bizarre
      Adventure: Diamond is Unbreakable Gender: Male Age: 15 (Part IV), 17-18 (Part
      V and Thus Spoke Rohan Kishibe), 22 (Louvre) Classification: Human, Stand User,
      Student'
