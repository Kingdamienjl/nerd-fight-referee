    notes: auto_repair source extraction
  attack_potency:
    text: Human level, Unknown with Echoes Act 1 (Act 1 punches aren't meant to hurt,
      but to apply his ability), Small Building level with Echoes Act 2 (With the
      SFX of an explosion, Act 2 made an explosion of this size. He can also ignore
      durability with SFX), at least Small Building level with Echoes Act 3 (Stated
      to be stronger than Act 1 and Act 2. Can still ignore durability with SFX)
    source_ids:
    - mediawiki-koichi-hirose-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At most Relativistic+ reactions (Could follow, albeit barely, RHCP moving
      through the wires, could warn Josuke of RHCP's approach despite it moving at
      light speed), Average Human with Echoes Act 1 (Tamami Kobayashi dodged an attack
      of it), at least Subsonic, possibly Relativistic+ with Echoes Act 2 (Could move
      like a blur from Koichi's point of view), Relativistic+ with Echoes Act 3 (Far
      faster than before, could effectively blitz Koichi, though is demonstrably slower
      than Killer Queen, though he did manage to react to his stomp)
    source_ids:
    - mediawiki-koichi-hirose-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
