    source_ids:
    - mediawiki-koichi-hirose-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Standard Melee Range physically (157cm tallJoJo''s Bizarre Adventure: Diamond
      is Unbreakable Chapter 38, though is generally depicted as a much shorter).
      Echoes Act 1 has an effective manifestation range of 50 metersJoJo''s Bizarre
      Adventure: Diamond is Unbreakable Chapter 33JoJo''s Bizarre Adventure: Diamond
      is Unbreakable Chapter 46JoJo''s Bizarre Adventure: Diamond is Unbreakable Chapter
      49), Below Standard Melee Range to Extended Melee Range physically (Short arm
      reach but has a long tailJoJo''s Bizarre Adventure: Diamond is Unbreakable Chapter
      22), Higher with SFX (Can form and launch SFXJoJo''s Bizarre Adventure: Diamond
      is Unbreakable Chapter 34) | Act 2 has an effective manifestation range of 50
      meters (Went this far tracking KiraJoJo''s Bizarre Adventure: Diamond is Unbreakable
      Chapter 91), Below Standard Melee Range to Extended Melee Range physically (Smaller
      but generally the same size as ACT 1JoJo''s Bizarre Adventure: Diamond is Unbreakable
      Chapter 35), Tens of Meters with Tail Projectile (Shot it at a rock spire from
      about this distanceJoJo''s Bizarre Adventure: Diamond is Unbreakable Chapter
      37), Varies with SFX (Dependent on the SFX, from small localized effects to
      large widescale effectsJoJo''s Bizarre Adventure: Diamond is Unbreakable Chapter
      35JoJo''s Bizarre Adventure: Diamond is Unbreakable Chapter 36) | Act 3 has
      an effective manifestation range of 5 meters (Stated to be of a D (5m) in its
      statsJoJo''s Bizarre Adventure: Golden Wind Chapter 15), Three Freeze has an
      effective range of 5 meters (Stated to only work within 5 meters against KiraJoJo''s
      Bizarre Adventure: Diamond is Unbreakable Chapter 94), Below Standard Melee
      Range to Standard Melee Range physically (Same height as Koichi)'
    source_ids:
    - mediawiki-koichi-hirose-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average (Echoes Act 3 shows the ability to be fully sentient despite
      following Koichi's orders, can act on its own and pick the optimal route to
      fulfill an order given to it by Koichi, appears to be of comparable intelligence
      with Koichi himself although it's quite foul-mouthed in contrast to its user,
      speaks in slang more often than not)
