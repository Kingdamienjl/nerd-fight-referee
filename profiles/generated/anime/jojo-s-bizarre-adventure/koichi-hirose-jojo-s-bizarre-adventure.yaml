  durability:
    text: Average Human level, Unknown with Echoes Act 1, Small Building level with
      Echoes Act 2 (Should be able to withstand his own explosion, and should be more
      durable than Yukako, who took the explosion at point blank range), at least
      Small Building level with Echoes Act 3 (More durable than Act 1 and Act 2)
    source_ids:
    - mediawiki-koichi-hirose-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Lasted a few minutes after being punched through the gut by
