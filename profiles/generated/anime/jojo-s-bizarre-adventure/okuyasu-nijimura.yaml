    Characters Category:Heroes Category:Space Users Category:Manga Characters Category:Anime
    Characters Category:Comic Relief Characters Category:Protagonists Category:Teenagers
    Category:Game Characters Category:Male Characters Category:Teleportation Users
    Category:Aura Users Category:Extrasensory Perception Users Category:Summoners
    Category:Flight Users Category:Delinquents Category:Tragic Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-a561dbd9
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Extrasensory Perception (Capable of
    seeing ghosts and souls among some other supernatural forces that are normally
    otherwise invisible), Aura, and Summoning (Of his Stand). The Hand has Superhuman
    Physical Characteristics, Extrasensory Perception (Much like its user), Spatial
    Elimination and Existence Erasure (Anything scraped by The Hand''s right hand
    is erased), Flight (Within its effective range, can also replicate flight via
    erasing space in rapid succession) & Pseudo-Teleportation (Via erasing space),
    Statistics Amplification & Reduction (As a Short-Distance StandJoJo-A-Go!Go!:
    Section 36, its capabilities are inversely proportional to the range it operates
    withinJoJo-A-Go!Go!: Standology), Selective Intangibility, Incorporeality (Stands
    are the incorporeal manifestations of one''s vital energy, and can only be harmed
    by other Stands), Non-Physical Interaction (Stands can interact with ghosts and
    other Stands), Invisibility (Stands can only be seen by other Stands and Stand
    Users), Aura'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
