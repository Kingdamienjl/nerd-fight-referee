- id: claim-weaknesses-17042e89
  section: weaknesses
  axis: weakness
  text: 'Not very smart. Any damage taken by The Hand will reflect back onto Okuyasu.
    The Hand has blinders that limit its peripheral vision Notable Attacks/Techniques:
    tumblr oxab2hpQOf1wxbjq5o2 400.gif|Okuyasu summons The Hand tumblr o5osecxeTZ1sfay15o1
    500.gif o.gif|The Hand cuts space BothUnfinishedGreyhounddog-max-1mb.gif|Mimicking
    Teleportation *The Hand: The Hand is a large, white-and-blue humanoid Stand with
    two discs on its right hand and various decor based on money on its collarbone.
    It only attacks using melee attacks, but specficially its right hand. *Spatial
    Elimination: The Hand generates energy with the bumps in its right hand, and when
    swiping, erases a general vicinity of space in the direction swiped. It can erase
    air, space in-between two objects, and even objects entirely or partially. However,
    some force is applied on nearby object, to where it will pull onto objects together
    to "clean up" and make it seem as though no space has been erased. This also allows
    Okuyasu to travel in short distances per swipe, or "teleporting". ==Gallery==
    Unit Okuyasu Nijimura.png Unit Okuyasu Nijimura (Custom Campaign).png Unit Okuyasu
    Nijimura (Gotcha now, bastard!).png ==Notable Matchups== Victories: Brain Unglaus
    (Overlord) Brain''s Profile (speed was equalized. 3 meter of distance and both
    bloodlusted) Losses: Weiss Schnee (RWBY) Weiss'' Profile (Okuyasu has Intel and
    is bloodlusted. Speed is equalized) Joshu Higashikata (JoJo''s Bizarre Adventure)
    Joshu''s Profile Ashley Stillons II (Parahumans (Verse)) Ashley''s Profile (Both
    had minor prior knowledge and speed was equalized) Noriaki Kakyoin (JoJo''s Bizarre
    Adventure) Kakyoin''s Profile (Both started 15 meters apart, and speed was equalized)
    Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}}
