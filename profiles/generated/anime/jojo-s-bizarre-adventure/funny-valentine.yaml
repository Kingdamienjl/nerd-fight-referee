- id: claim-powers-and-abilities-1327c918
  section: abilities
  axis: hax
  text: Funny Valentine=Superhuman Physical Characteristics, Extrasensory Perception
    (Capable of seeing ghosts and souls among some other supernatural forces that
    are normally otherwise invisible), Expert Marksman (He's a good shot with his
    pistol, shooting Axl in the neck and intentionally missing his vitals), Social
    Influencing (Charisma; Resourceful at making promises in order to keep situations
    under his control. Is noted to be charming and held a 91% approval rating as President),
    Stealth Mastery (When using D4C's abilities), Aura, and Summoning (Of his Stand.
    The latter two powers are only present in the Valentine with D4C, the rest of
    the powers are shared by all alternative versions of himself) |-|D4C=Superhuman
    Physical Characteristics, Afterimage Creation (Its attacks can leave numerous
    afterimages), Flight (Within its effective range), Invisibility (A Stand can only
    be seen by other Stand users), Incorporeality (Stands are the incorporeal manifestations
    of one's vital energy, and can only be harmed by other Stands), Non-Physical Interaction
    (Stands can interact with ghosts and other Stands), Selective Intangibility, Dimensional
    Travel and Portal Creation (Valentine can use D4C to travel between infinite &
    "neighbors"/similar dimensions), BFR (Valentine can use D4C to transport others,
    even just parts of their body and projectiles), Limited Possession and Immortality
    (Type 6; He can transfer his Stand and his memories to an alternate version of
    himself if he is lethally injured), Pseudo-Summoning (Using D4C, Valentine can
    manually bring his alternate selves for help in combat, or other allies, such
    as Diego Brando from Another Universe), Pseudo-Transmutation (By causing someone
    to come near an alternate version of themself, both will collapse into Menger
    Sponges and be completely obliterated; this is not an ability of D4C, but a simple
    fact of the world, and Valentine himself is immune), Pseudo-Intangibility (Valentine
    can use his dimensional doors to phase through objects and other beings) and Aura
    |-|Corpse Parts=As before, Clairvoyance, Telepathy, Spatial Manipulation (Warped
    space), Resistance to Transmutation, Disease Manipulation & Mind Manipulation
    with Corpse Parts (The Holy Corpse allows the holders to resist Scary Monsters
    and similar abilities) |-|Love Train=All previous abilities minus the Corpse Parts,
    Flight (He can fly using Love Train), Passive Probability Manipulation and Attack
    Reflection (Love Train can redirect/misfortune meant for him to someone else in
    the Earth, while leaving only good fortune behind), Absorption, Annihilation &
    Passive BFR (Love Train draws in its surroundings and transports them elsewhere
    as part of its misfortune-deflecting effects, things that are drawn in are annihilated
    and vanish from the world), Transmutation (Turns things that make contact with
    Love Train into misfortune itself and sends it elsewhere), Passive Biological
    Manipulation (Love Train can move injuries to other parts of a target's body to
    make even scratches lethal strikes), Spatial Manipulation (His ability works by
    entering a flat gap in space created by the union of the Corpse Parts), Body Control
    (Can flatten himself against the ground and move through Love Train), Fusionism
    (Love Train can draw objects into others and fuse them), Valentine took a Cream
    Starter from an alternate Hot Pants, which has Biological Manipulation and can
    be used to spray flesh as a projectile and use it in a number of ways) on top
    of Healing
  source_ids: *id003
  decisive: true
  status: unverified
