    other Stand Users can see Stands) *Incorporeality (Stands are the incorporeal
    manifestations of one''s vital energy, and can only be harmed by other Stands)
    *Non-Physical Interaction (Stands can interact with ghosts and other Stands) *Selective
    Intangibility *Flight (Within its effective range) *Aura *Power Bestowal (Allows
    Johnny to fire nails like bullets and grant him access to the spin) {{!}}-{{!}}Act
    2= Same as before, but enhanced, plus: *Homing Attack (Has homing nail bullets
    powered by the Golden Rotation that upon impact leaves a hole that will chase
    an intended target for several seconds) **Damage Transferal & Durability Negation
    (The holes can move damage from objects and targets to something else and the
    holes themselves negate durability) {{!}}-{{!}}Act 3= Same as before, plus: *Spatial
    Manipulation & Portal Creation (Can create holes or "portals" by shooting himself
    to reach a boundary between dimensions, while utilizing these portals Johnny can
    reach Small Size (Type 9) as well as control his body parts freely) *Limited Dimensional
    Travel (Can allow Johnny to hide between the boundaries of dimensions, the holes
    themselves could enter Love Train), also acts as a temporary case of Dimensional
    Storage with ACT3. The holes resist BFR) }} |-|Act 4 & The Infinite Rotation=
    Same as the previous Act''s with the addition of: *Superhuman Physical Characteristics
    *Afterimage Creation (Its attacks often leave numerous afterimages) *Dimensional
    Bypassing/Spatial Manipulation *Dimensional Travel (Can hide within the holes,
    the Infinite Rotation''s damage followed Funny Valentine through numerous alternate
    dimensions) *Enhanced Homing Attack *Biological Manipulation, Deconstruction &
    Matter Manipulation (Deconstructed and altered many of Valentine''s bodies, deconstructed
    a chariot, "each cell of" Valentine''s bodies were being affected), indefinite/infinite
    attacking with with ACT4 and the Infinite Rotation) *Gravity Manipulation (With
    the Infinite Rotation), Soul Elimination & Resistance Negation (Using the Infinite
    Rotation''s power of gravity, Johnny can force the target and their soul to obey
    the laws of physics) *BFR (Eventually sends those effected to another dimension)
    *Power Bestowal & Life Manipulation (Created Les Feuilles) *Body Control & Elasticity
    (Can move its head in all directions as if on a pivot and flatten and spread its
    body as if it was a 2D image on surfaces) ACT4 itself has Resistance to: *Time
    Stop (Could move and speak in Alternate Diego''s Time Stop) *BFR & Probability
    Manipulation (Bypassed Love Train''s redirection of misfortune onto other areas
    of the world)'
