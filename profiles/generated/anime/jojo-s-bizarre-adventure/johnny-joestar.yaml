  text: 'Johnny= *Superhuman Physical Characteristics *Extrasensory Perception (Capable
    of seeing ghosts and souls among some other supernatural forces that are normally
    otherwise invisible) *Skilled Marksman *Can fire regenerative nail bullets. *Aura
    *Limited Acrobatics *Multiple Selves (Type 2; Tusk is a spiritual entity and Guardian
