- id: claim-weaknesses-6893712e
  section: weaknesses
  axis: weakness
  text: 'Paraplegic; Johnny cannot fire nail bullets if there are no nails left on
    him that haven''t regrown. | No longer paraplegic although he still can''t walk
    and move normally. Using the Golden Rotation will require longer times for his
    nails to grow back (about a minute upon firing). | Same as before. Using the Golden
    Rotation will require longer times for his nails to grow back. | Can walk normally
    now, Act 4 could only initially be called out by utilizing the energy generated
    by a horse''s movement; without a horse, Johnny cannot use the Infinite Rotation
    (though this has been resolved before by mimicking the movement of one). The Infinite
    Rotation can transfer to Johnny if whatever is affected by it touches him. Notable
    Attacks/Techniques: *Tusk ACT1: Act 1 is a small, pink Stand with an animal-like
    appearance and stars plastered all over its body. It does not physically attack
    or do anything, but it has carved messages into Johnny''s arm and occasionally
    whispers to him. **Nail Bullets: Johnny incorporates the Spin into his fingernails,
    spinning them to become razor sharp and capable of firing them like bullets. They''ve
    easily cut through flesh and caused fatal wounds on people and Stand Users in
    just a few shots, and are more accurate and precise than standard bullets. Shooting
    one of these nail bullets will cost the removal of the nail fired, but will grow
    back after a short time. *Tusk Act 2: Act 2 is slightly larger than Act 1, gaining
    a lower torso among being bigger in general. It has the same colors and still
    does not attack physically. **Golden Rotation Bullets: Johnny incorporates the
    second lesson of the Spin, which involves a more advanced technique involving
    seeing targets and object like a golden rectangle, giving more powerful and accurate
    aureal rotation. These shots, once they make impact, leave a hole. These holes
    can travel among different surfaces and leave a trail as they do so. Shots act
    like homing missiles as they track down the object Johnny wishes to attack. Despite
    longer times for his nails to regrow, consuming herbs or tea can shorten these
    times of regrowth. Johnny can use the holes to move damage off himself onto something
    else or move the damage from one target to another. The holes created by this
    Stand can bypass dimensional walls and resist BFR and Spatial Manipulation. *Tusk
    Act 3: Act 3 is a bigger Stand with arms, legs, and spikes added on the ends of
    its limbs, finished with a large head and mohawk. It has the same colors and still
    does not attack physically. **Through the Hole: When Johnny shoots himself with
    the Golden Rotation bullet, he will be able to create an infinite hole for the
    area that is shot. These holes act like portals, which can be located separately
    and far away from Johnny. From this point, any part of his body that was shot
    will be removed from Johnny''s body and moved to that location. If anything other
    than Johnny is sucked into that hole, it will be destroyed. Johnny can temporarily
    hide within the infinitely small space within these portals and move said portals
    manually. *Tusk Act 4: Act 4 is a larger, more humanoid Stand with drapes hanging
    down from its chest to its ankles, of which contains mostly nothing when pulled
    back, and a horseshoe on its head. It uses melee attacks in conjunction with the
    Infinite Rotation. **Super Spin (Infinite Rotation): The Super Spin is obtained
    in conjunction of a consistently moving object and the aid of the Golden Rectangle.
    In Johnny''s case, Slow Dancer creates a Golden Rectangle with its natural running
    speed, further enforced with Johnny''s legs inside of the stirrups of the saddle.
    This results in a more enhanced version of the Spin, in which the energy it produces
    is nigh-limitless, or "infinite" that can pierce through dimensions and bypass
    defenses, regardless of if it''s physical based or something along the lines of
    dimensional walls. Johnny can also create an instant shortcut to activating this
    by galvanizing his horse with a steel ball and transferring the horse''s sudden
    energy to himself although he''s since been seen activating Act 4 without such
    requirements. ***When a nail bullet that is imbued with the Infinite Rotation
    hits a target, it immobilizes it and infinitely spins them from the inside-out.
    They will spin forever in the same place, no matter if they are moved to another
    location (in which they are forced back to their original position) or another
    universe. In addition, those that are shot are pulled deeper and deeper underground
    and sent to another dimension, possibly the infinitely small boundary between
    dimensions. If the shot is missed, the shot will not disappear and will instead
    follow the target, even if it initially hits something else. ACT4 has the power
    to move things instantaneously and the energy from the Infinite Rotation is eternal
    and will last forever, to such an extent that a brand new Stand can manifest from
    Act 4''s power even after death. ***The effects of the Infinite Rotat'
