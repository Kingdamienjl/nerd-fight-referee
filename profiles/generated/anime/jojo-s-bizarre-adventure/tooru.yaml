power_scale:
  tier:
    text: '{{10-A}}, {{Unknown}}, likely {{8-C}} with Wonder of U Name: Toru, also
      known as "Satoru Akefu" Origin: JoJo''s Bizarre Adventure: JoJolion Gender:
      Male Age: Unknown, appears physically 17 to 19, although he is at least 87 years
      old. His alias is stated to be 89 years old. Classification: Rock Human, Stand
      User, Head Doctor & Part-Time Medical Student and Calamity given form.'
    source_ids:
    - vsbattles-tooru-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Athlete level. Unknown, likely Building level with Wonder of U (Managed
      to block Josuke''s Spin attacks. Doesn''t physically fight, though he attempted
      to strangle KaatoJoJo''s Bizarre Adventure: JoJolion Chapter 108), its primary
      ability ignores conventional durability'
    source_ids:
    - vsbattles-tooru-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Athletic Human. At least Average Human (Has been shown and stated to walk
      at the speed one would expect of an 89 year old man when in view of someone),
      likely much higher (Has moved like a blur when out of sight,JoJo''s Bizarre
      Adventure: JoJolion Chapter 96 seemingly even blitzing his targets) with Relativistic+
      combat speed and reactions with Wonder of U (Could avoid a point blank attack
      rushJoJo''s Bizarre Adventure: JoJolion Chapter 84 from Soft & Wet, twice,JoJo''s
      Bizarre Adventure: JoJolion Chapter 89 has consistently reactedJoJo''s Bizarre
      Adventure: JoJolion Chapter 105 to Josuke''s attacks with little issue, only
      ever being taken aback when distracted)'
    source_ids:
    - vsbattles-tooru-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: 'Wall level, possibly higher, higher while transformed (By virtue of being
      a rock human; survived being launch through the air after being hit by Josuke''s
      SpinJoJo''s Bizarre Adventure: JoJolion Chapter 106 and smashed against a vehicle,
      with any damage he took seeming to have come from JosukeJoJo''s Bizarre Adventure:
      JoJolion Chapter 106), Unknown, likely Building level with Wonder of U (Managed
      to block Josuke''s Spin attacks.JoJo''s Bizarre Adventure: JoJolion Chapter
      105 Was choked byJoJo''s Bizarre Adventure: JoJolion Chapter 100 Rai Mamezuku,
      though he didn''t take any noticeable damage and was fine immediately after.
      Has only been hurt by attacks that have negated durability)'
    source_ids:
    - vsbattles-tooru-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: 'Superhuman (Was able to endure having a hole blown through the side of
      his head with little issue,JoJo''s Bizarre Adventure: JoJolion Chapter 103 was
      able to survive getting a hole blown through his chest, only to get up and continue
      walking and eventually sprinting into a runJoJo''s Bizarre Adventure: JoJolion
      Chapter 106 and survived, at least briefly, having a hole blown through his
      neck.JoJo''s Bizarre Adventure: JoJolion Chapter 106 Wonder of U has been shown
      to be an automatic Stand that can be kept up for days at a time, tracking numerous
      targets at once, likely infinite due to its nature as a Automatic Long Distance
      Stand and the fact that its the Calamity itself, which is endless and will continue
      foreverJoJo''s Bizarre Adventure: JoJolion Chapter 108 unless the prerequisites
      are no longer met. Was more or less unhindered by having a chunk taken out of
      its head and could continue to function after having a hole blown through its
      torsoJoJo''s Bizarre Adventure: JoJolion Chapter 106 and losing his headJoJo''s
      Bizarre Adventure: JoJolion Chapter 108)'
    source_ids:
    - vsbattles-tooru-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Standard Melee Range for Toru; Standard Melee Range; Extended Melee Range
      with cane; At least Several Kilometers with manifestation and effective range
      (Has appeared at opposite ends of Morioh at the same timeJoJo''s Bizarre Adventure:
      JoJolion Chapter 103), likely far higher (Is the Calamity itself, a force that
      permeates through the world.JoJo''s Bizarre Adventure: JoJolion Chapter 108
      Endless Calamity has been implied to have drawn in weather like typhoons from
      the seaJoJo''s Bizarre Adventure: JoJolion Chapter 99JoJo''s Bizarre Adventure:
      JoJolion Chapter 100 and has shown to be able to effect things over 10,000 meters
      away,JoJo''s Bizarre Adventure: JoJolion Chapter 103 likely far higherJoJo''s
      Bizarre Adventure: JoJolion Chapter 100 (Is a natural law that permeates throughout
      the world and is implied to be able to draw in Calamities from across Earth)'
    source_ids:
    - vsbattles-tooru-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Gifted (Toru has shown an understanding of some technology to an extent.JoJo''s
      Bizarre Adventure: JoJolion Chapter 90 Most notably, Toru, by virtue of being
      the Head Doctor, has a vast understanding of medical sciences, medicines, anatomy,
      biology and various ailments, even being able to deduce issues and problems
      one may be having with little beyond just a glance, even if said issue isn''t
      overtly obvious.JoJo''s Bizarre Adventure: JoJolion Chapter 83 Toru has been
      shown to be quite cunning and manipulative, managing to separate his foes, create
      a sense of distrust and possible tension between them to an extent, manipulating
      their actions to ultimately have them lure him to his goal while keeping up
      his Stand attack, all the while drawing attention away from himself as the enemy
      and even gaining the trust of one of his primary foes. His Stand, Wonder Of
      U has shown good analytical skills, being able to deduce someone opened and
      touched a Locacaca fruit jar, by them off handily calling it a fruit as opposed
      to something else.JoJo''s Bizarre Adventure: JoJolion Chapter 97 Wonder Of U
      is also shown to be quite cautious, always staying just out of range of his
      foes and avoiding any possible traps they may have laid, always analyzing the
      situation and what his best route of action would be, even retreat if it''s
      optimal and safest route to victory. Is also adept at creating scenarios in
      order to have his foes "pursue" him, even if it''s just as simple as appearing
      in their line of sight but just out of range, thus activating his ability) Standard
      Tactics: Toru usually hides or is located completely out of sight, often at
      a great distance, making an effort to draw attention away from himself to the
      point his foes even think of him as a ally while his Stand, Wonder Of U, tricks
      his foes into "pursuing him" which can range from simply appearing in their
      line of sight and running away or creating entire situations that will lure
      those into wanting to come after him, of course simply thinking about defeating
      the Stand will activate the ability so it isn''t overly difficult to do. If
      backed into a corner, Toru will try and get his foes to approach him, in order
      to get them into the flow of the Calamity.JoJo''s Bizarre Adventure: JoJolion
      Chapter 108 The Stand itself is quite cautious as well and analytical.'
    source_ids:
    - vsbattles-tooru-jojo-s-bizarre-adventure
    confidence: 0.6
    notes: auto_repair source extraction
