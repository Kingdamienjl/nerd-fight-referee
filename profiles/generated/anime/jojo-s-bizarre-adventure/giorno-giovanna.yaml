  section: abilities
  axis: hax
  text: 'Giorno= *Superhuman Physical Characteristics *Extrasensory Perception (Capable of seeing ghosts
    and souls among some other supernatural forces that are normally otherwise invisible) *Aura *Summoning
    (Of his Stand) *Genius Intelligence *Supernatural Willpower (As a stand user, Giorno can withstand
    punishment to his own soul. He has also willingly broke off his own limbs for his allies as well as
    being able to fight and kill Cioccolata whilst sustaining major injuries.JoJo''s Bizarre Adventure:
    Golden Wind Chapter 123) *Stealth Mastery (Giorno was able to steal a prison guard''s wallet in the
    middle of his body search without her noticing.JoJo''s Bizarre Adventure: Golden Wind Chapter 9 He
    has also performed many transmutations without the target realizing, such as against PolpoJoJo''s
    Bizarre Adventure: Golden Wind Chapter 16 and Ghiaccio.JoJo''s Bizarre Adventure: Golden Wind Chapter
    76) *Charismatic (Bruno states how Giorno has a talent for getting people to accept him. Fugo''s trust
    in Giorno cannot be ''expressed in mere words''. Giorno''s more of a leader to Mista then Bruno, despite
    being a newbie. Mista also states how Giorno has been guiding him this whole time without either of
    the two realizing it.JoJo''s Bizarre Adventure: Golden Wind Chapter 17JoJo''s Bizarre Adventure: Golden
    Wind Chapter 46JoJo''s Bizarre Adventure: Golden Wind Chapter 76JoJo''s Bizarre Adventure: Golden
    Wind Chapter 75) *Minor Body Control (Can tuck all of his ear into his ear holeJoJo''s Bizarre Adventure:
    Golden Wind Chapter 1JoJo''s Bizarre Adventure: Golden Wind Chapter 10) *Possibly Limited Minor Soul
    Manipulation (Can freely move his soul between and coexist in both his and Narancia''s bodies,JoJo''s
    Bizarre Adventure: Golden Wind Chapter 136 even being able to speak through both bodies at the same
    time.JoJo''s Bizarre Adventure: Golden Wind Chapter 136 Though he can only do this with those who
    have passed away) *Multiple Selves (Type 2; Gold Experience Requiem is spiritual entity derived from
    Giorno''s soul, is cognizant and is able to act on its own willJoJo''s Bizarre Adventure: Golden Wind
    Chapter 148) *Resistance to: **Disease Manipulation (Vaccinated himself with the blood of an animal
    immune to the Purple Haze virus,JoJo''s Bizarre Adventure: Golden Wind Chapter 46 surviving its increasing
    infection) |-|Gold Experience= *Superhuman Physical Characteristics *Extrasensory Perception (Much
    like its user) *Aura *Statistics Amplification & Reduction (As a Short-Distance Stand,JoJo''s Bizarre
    Adventure: Golden Wind Chapter 7JoJo''s Bizarre Adventure: Golden Wind Chapter 123 Gold Experience''s
    capabilities are inversely proportional to the range it operates withinJoJo-A-Go!Go!: Standology)
    *Incorporeality (Stands are the incorporeal manifestations of one''s vital energy, and can only be
    harmed by other Stands) *Non-Physical Interaction (Stands can interact with ghosts and other Stands)
