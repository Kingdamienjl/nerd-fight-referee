  intelligence:
    text: Extraordinary Genius (Each Pillar Man possesses an exceptional capacity
      for intelligence and learning above that of any regular human, allowing them
      to grasp complex machinery and technology within seconds and learn modern languages
      nearly just as quickly. This, combined with his willingness to do anything in
      order to win, is what makes Kars such a deadly opponent. When possible, rather
      than fight one-on-one, Kars relies on misdirection to trick and catch his opponents
      by surprise, and fights carefully, methodically, and observantly. Furthermore,
      Kars was one of the greatest minds of the already brilliant Pillar Men, creating
      the Stone Masks and using them on himself to unlock his true potential, and
      then proceeding to use his newfound abilities to slaughter the rest of his kind
      alongside Esidisi. After evolving to become the Ultimate Lifeform, Kars was
      able to instantly use the Hamon flawlessly despite having never done so before.
      His IQ is 400)
