- id: claim-weaknesses-51f2626a
  section: weaknesses
  axis: weakness
  text: "Any damage taken to Magician's Red will reflect back onto Avdol. His life detection ability can\
    \ be trumped by certain attacks or abilities that leave no trace of their presence (Such as with Vanilla\
    \ Ice) Notable Attacks/Techniques: Jojo cqc.gif|Magician's Red in action Red bind mk2.gif|Red Bind\
    \ Jojo cfr.gif|Cross Fire Hurricane Jojo cf.gif|Cross Fire Hurricane Special Jojo mr flame.gif|Magician's\
    \ Red Vs. Silver Chariot Life sense jojo.gif|Life Detector MagicianRed.gif|Avdol manifesting Magician's\
    \ Red MRFast.gif|Magician's Red avoiding blows from Silver Chariot RestrainAvdol.gif|Avdol demonstrating\
    \ that he has the strength and ability to overcome and restrain even someone like Iggy *Magician's\
    \ Red: Magician's Red is a humanoid Stand with the body of a red bird. It is capable of using melee\
    \ attacks, but its more preferred to use its ability or its ability mixed with melee attacks. Since\
    \ its body is composed of flames, any fire attacks put onto Magician's Red will have no effect. **Flame\
    \ Manipulation: Magician's Red's main ability is pyrokinesis. It can project flames that are visible\
    \ only to Stand users, but have the strength to produce this much force. It can evaporate metal and\
    \ incinerate objects in mid-air. There is no limit to the shape or form of the flames Avdol produces.\
    \ **Cross Fire Hurricane: Magician's Red's signature attack. It fires a set of flames in the shape\
    \ of an ankh, strong enough to bury itself several meters into the ground before rising underneath\
    \ the enemy still in tact. ***Cross Fire Hurricane Special: An advanced form of the Crossfire Hurricane,\
    \ it is made to cover a wider radius and fire more ankh-shaped flames repeatedly. Avdol has acknowledged\
    \ there is no limit to how long he can use this attack. **Red Bind: Magician's Red uses its flexible\
    \ flames to wrap an opponent around with a stream of fire. Once trapped, Avdol can trap them on top\
    \ of surfaces and burn the oxygen around the opponent, essentially suffocating them and leaving them\
    \ helpless. **Life Detection: The flames of Magician's Red produce a psychic energy that is capable\
    \ of detecting movement, breathing and even Stand energy within a 15 meter radius. It forewarns Avdol\
    \ of an incoming opponent or reveals one in hiding. ==Gallery== {{Scroll box|content= File:JoJo's\
    \ Bizarre Adventure Stardust Crusaders OST - Fire Shaman File:JoJo's Bizarre Adventure Stardust Crusaders\
    \ Destination OST - Scorching Flames File:Hiroaki \"TOMMY\" Tominaga - Fire of Soul File:Heritage\
    \ For The Future - Avdol Theme All Star Battle OST - HELL2U (Avdol Theme) File:JoJo's Bizarre Adventure\
    \ Eyes of Heaven OST - Muhammad Avdol Battle BGM thumb|right|335 px }} ==Notable Matchups== Victories:\
    \ Josuke Higashikata (JoJo's Bizarre Adventure) Josuke's Profile (This was end of Part 4 Josuke being\
    \ used) Pet Shop (JoJo\u2019s Bizarre Adventure) Pet Shop\u2019s Profile (Both were 8-C, speed was\
    \ equalized) Losses: Inconclusive: ==References== {{scroll box|content={{reflist|2}}}} {{Discussions}}\
    \ Category:JoJo's Bizarre Adventure Category:Stand Users Category:Fire Users Category:Characters Category:Male\
    \ Characters Category:Protagonists Category:Good Characters Category:Heroes Category:Game Characters\
    \ Category:Manga Characters Category:Anime Characters Category:Extrasensory Perception Users Category:Size\
    \ Users Category:Body Control Users Category:Intangibility Users Category:Incorporeal Characters Category:Invisibility\
    \ Users Category:Humans Category:Adults Category:Flight Users Category:Aura Users Category:Summoners\
    \ Category:Explosion Users Category:Cross Users Category:Farmers"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-6897cfc2
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Extrasensory Perception (Capable of seeing ghosts and souls
    among some other supernatural forces that are normally otherwise invisible), Capable of communicating
    through his Stand, Aura, and Summoning (Of his Stand). Magician's Red has Superhuman Physical Characteristics,
    Extrasensory Perception (Capable of seeing ghosts and souls among some other supernatural forces that
    are normally otherwise invisible as well as through his Life Detection), Flight (Within its effective
    range), Size Manipulation, Body Control (Can manipulate the flames attached to his body), Selective
    Intangibility, Incorporeality (Stands are the incorporeal manifestations of one's vital energy, and
    can only be harmed by other Stands), Non-Physical Interaction (Stands can interact with ghosts and
    other Stands), Invisibility (Stands can only be seen by other Stands and Stand Users), Fire Manipulation
    (Can generate and manipulate flames with high proficiency. The flames are considered a part of his
    stand, and therefore share the same properties the stand has; non-Stand users merely feel the heat
    and see the generated heat waves), Explosion Manipulation, Aura
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
