- id: claim-weaknesses-da1907e2
  section: weaknesses
  axis: weakness
  text: 'Any damage taken by Soft & Wet will reflect back onto Josuke (For example,
    if the Stand gets cut, Josuke will gain the same cut in the same location). Soft
    & Wet''s absorption ability can''t be used on Josuke himself.JoJo''s Bizarre Adventure:
    JoJolion Chapter 5JoJoveller Page 302 Soft & Wet''s bubbles must make contact
    with an object in order to "steal" something from it. While initially unaware
    of Go Beyond and unable to control its trajectory, Josuke has since learned how
    to aim it slightly, albeit only at point-blank range.JoJo''s Bizarre Adventure:
    JoJolion Chapter 108 Josuke won''t bring himself to harm the likes of children,
    even if it puts himself in danger.JoJo''s Bizarre Adventure: JoJolion Chapter
    63 Notable Attacks/Techniques *Soft & Wet: Soft & Wet is a Stand, Josuke''s Spirit
    given formJoJo''s Bizarre Adventure: JoJolion Chapter 17 with a humanoid-mechanical
    appearance. It attacks in conjunction with melee attacks and the use of its bubbles.
    It is a fusion of Josefumi''s original Soft & Wet and Kira''s Killer Queen, eventually
    awakening the properties of both. JoJo Soft & Wet Gif 1.gif|Manifesting. Soft
    & Wet JoJoveller 1.png| JoJolion Soft & Wet Rush 1.gif|An attack rush. Josuke
    8 Gif 3.gif|Melee Attacks. Josuke 8 Gif 2.gif|Grabs. **Bubble: Soft & Wet or Josuke
    himself can spawn and manipulate soap bubbles that are, in reality, thin cords
    of that spin at incredibly high speeds,JoJo''s Bizarre Adventure: JoJolion Chapter
    70 and can do so with varying amounts, up to hundreds at a time. The bubbles in
    question are extremely versatile with several supernatural properties and abilities
    but at their most basic application can be used in such ways such as using it
    as a magnify lens,JoJo''s Bizarre Adventure: JoJolion Chapter 43 filling up a
    dangerous wound,JoJo''s Bizarre Adventure: JoJolion Chapter 13 bubbleJoJo''s Bizarre
    Adventure: JoJolion Chapter 67 platforms,JoJo''s Bizarre Adventure: JoJolion Chapter
    68 to raise objects,JoJo''s Bizarre Adventure: JoJolion Chapter 62 launch himself
    or foesJoJo''s Bizarre Adventure: JoJolion Chapter 32 at high speeds,JoJo''s Bizarre
    Adventure: JoJolion Chapter 28 store objectsJoJo''s Bizarre Adventure: JoJolion
    Chapter 46 and launch them at high speeds,JoJo''s Bizarre Adventure: JoJolion
    Chapter 75 place bubbles within bubbles,JoJo''s Bizarre Adventure: JoJolion Chapter
    75JoJo''s Bizarre Adventure: JoJolion Chapter 76 as protection against various
    things such as; blades,JoJo''s Bizarre Adventure: JoJolion Chapter 11 a sign with
    a sharp point,JoJo''s Bizarre Adventure: JoJolion Chapter 12 poison gas,JoJo''s
    Bizarre Adventure: JoJolion Chapter 46 contact based abilitiesJoJo''s Bizarre
    Adventure: JoJolion Chapter 62 such as Dolomite''s infectious and mind controlling
    Blue Hawaii including blocking a spray of blood,JoJo''s Bizarre Adventure: JoJolion
    Chapter 61 bubbles large enough to envelop him and allies and protect from extreme
    atmospheric pressure,JoJo''s Bizarre Adventure: JoJolion Chapter 74 impacts and
    pressure,JoJoveller Page 302 even impacts such as being hit by a vehicleJoJo''s
    Bizarre Adventure: JoJolion Chapter 86 notably storing the energy and Calamity
    effects from said impact and transferring them to someone else, saving himself
    from guaranteed instant death, etc. Josuke''s bubbles have also demonstrated an
    ability relating to fusionism as his absorption ability can bind things together,JoJo''s
    Bizarre Adventure: JoJolion Chapter 50 allowing him to instantly graftJoJo''s
    Bizarre Adventure: JoJolion Chapter 50 plants togetherJoJo''s Bizarre Adventure:
    JoJolion Chapter 51 as Josefumi and even seemingly having fused his gouged liver
    back into his body,JoJo''s Bizarre Adventure: JoJolion Chapter 55 and much more.
    **Plundering: Soft & Wet''s main ability lies within its bubbles. If a bubble
    pops or makes contact near something, it can "steal" something from it and store
    it within the bubble allowing him to manipulate the nature or substance he took
    and either release it or store it,JoJoveller Page 302 including multiple properties
    at onceJoJo''s Bizarre Adventure: JoJolion Chapter 16 or even just part of something
    opposed to the whole of it.JoJo''s Bizarre Adventure: JoJolion Chapter 5 To be
    exact, this ability can be used to absorb and manipulate, but isn''t limited to,
    sounds; takes the sound away from a condo wall as he smashes it,JoJo''s Bizarre
    Adventure: JoJolion Chapter 4 the sound from a smashed windowpane,JoJo''s Bizarre
    Adventure: JoJolion Chapter 5 of a lightswitch being turned on,JoJo''s Bizarre
    Adventure: JoJolion Chapter 9 the sound of a fridge opening and closing,JoJo''s
    Bizarre Adventure: JoJolion Chapter 10 banging and crashing,JoJo''s Bizarre Adventure:
    JoJolion Chapter 16 his own voice to fool a foeJoJo''s Bizarre Adventure: JoJolion
    Chapter 10 and is able to use this for long range communication and when he otherwise
    wouldn''t be able to speak.JoJo''s Bizarre Adventure: JoJolion Chapter 32 Effects
    on the body such as; Removing one''s eyesightJoJo''s Bizarre Adventure: JoJolion
    Chapter'
