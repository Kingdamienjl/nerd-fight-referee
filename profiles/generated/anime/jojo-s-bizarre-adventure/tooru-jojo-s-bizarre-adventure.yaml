    \ a state in which he can resist temperatures as high as 950 \xB0C and as low as -240 \xB0CJoJo's\
    \ Bizarre Adventure: JoJolion Chapter 46 along with high pressure and impacts.JoJo's Bizarre Adventure:\
    \ JoJolion Chapter 81 Has shown the ability to instantly harden only certain parts of his flesh and\
    \ back unlike most Rock HumansJoJo's Bizarre Adventure: JoJolion Chapter 101) ***Longevity (Rock Humans\
    \ age much slower than Humans, with some appearing within their early 20s despite being nearly a century\
    \ old. Estimated average lifespan is 240 years oldJoJo's Bizarre Adventure: JoJolion Chapter 46) **Stealth\
    \ Mastery (Can transform into a rock-like state in where he has almost no scent, body heat vanishes,\
    \ breathing is halted with little respiration, his pulse drops to one to two pules per three minutes\
    \ and electrical activity ceases almost entirelyJoJo's Bizarre Adventure: JoJolion Chapter 46) **Immortality\
    \ (Type 2; Scaling off of Tamaki Damo. Had a chunk taken out of his head and wasn't phased.JoJo's\
    \ Bizarre Adventure: JoJolion Chapter 103 Survived having a hole blown through his torsoJoJo's Bizarre\
    \ Adventure: JoJolion Chapter 106 and neck.JoJo's Bizarre Adventure: JoJolion Chapter 106 Could briefly\
    \ survive being blown to bits and being reduced to dust before dying JoJo's Bizarre Adventure: JoJolion\
    \ Chapter 108) *Social Influencing *Extrasensory Perception (Ghosts & Soul; Capable of seeing ghosts\
    \ and souls among some other supernatural forces that are normally otherwise invisible) *Aura & Summoning\
    \ (Of his Stand Wonder Of U) **Multiple Selves (Types 1 & 2; Wonder Of U is a completely sentient\
    \ individual that can perform tasks and partake in roles separate from the main body, is Calamity\
    \ given form JoJo's Bizarre Adventure: JoJolion Wonder of U Arc) *Minor Clairvoyance (Is aware of\
    \ what his Stand is seeing, hearing and experiencing even at great distancesJoJo's Bizarre Adventure:\
    \ JoJolion Wonder of U Arc) |-|Wonder of U= {{Border|Scroll=Yes|Visible=No|Content= *Superhuman Physical\
    \ Characteristics **Regeneration (At least Mid; Regenerated his head being completely destroyed and\
    \ several body wounds over the course of several minutes,JoJo's Bizarre Adventure: JoJolion Chapter\
    \ 108 possibly Mid-High; Toru was reduced to dust,JoJo's Bizarre Adventure: JoJolion Chapter 108 which\
    \ may have possibly reflected back to Wonder of U, resulting in the Stand reforming from dust over\
    \ the course of several minutes) *Abstract Existence (Type 2; Is the Calamity itself,JoJo's Bizarre\
    \ Adventure: JoJolion Wonder of U Arc an energy form of a law of the world that will never go awayJoJo's\
    \ Bizarre Adventure: JoJolion Wonder of U Arc and allows Toru to control Calamity through Wonder of\
    \ U) **Incorporeality (As a Stand, Wonder of U is also a manifestation of Calamity Energy and \"Disaster\"\
    \ taken formJoJo's Bizarre Adventure: JoJolion Wonder of U Arc) **Immortality (Types 1, 2, eventually\
    \ 7 & possibly 8; Is a law of the worldJoJo's Bizarre Adventure: JoJolion Wonder of UJoJo's Bizarre\
    \ Adventure: JoJolion Chapter 108 and will exist even after his user's death,JoJo's Bizarre Adventure:\
    \ JoJolion Chapter 108 can survive and function even with lethal wounds,JoJo's Bizarre Adventure:\
    \ JoJolion Chapter 108 and seemingly will exist as long as the calamity does) *Afterimage Creation\
    \ (Attacks can leave several afterimagesJoJo's Bizarre Adventure: JoJolion Chapter 103) *Levitation\
    \ (Demonstrated the ability to levitate and move through the air, though he rarely ever does soJoJo's\
    \ Bizarre Adventure: JoJolion Chapter 108) *Extrasensory Perception (Capable of seeing ghosts and\
    \ souls among some other supernatural forces that are normally otherwise invisible) *Selective Intangibility\
    \ & Invisibility (Is a Stand and is capable of phasing,JoJo's Bizarre Adventure: JoJolion Chapter\
    \ 98 even able to directly enter into someone's bodyJoJo's Bizarre Adventure: JoJolion Chapter 108.\
    \ As a Stand, it can even appear invisible to Stand Users and those who have yet to activate the Calamity,JoJo's\
    \ Bizarre Adventure: JoJolion Chapter 93 is visible to even normal people while disguised as the Head\
    \ DoctorJoJo's Bizarre Adventure: JoJolion Wonder of U Arc) *Non-Physical Interaction (Intangibility\
    \ [Immaterial] & Ghosts; Capable of interacting with other Stands and ghosts) *Aura *Surface Scaling\
    \ (Constantly shown throughout the arc clinging to walls and other vertical surfacesJoJo's Bizarre\
    \ Adventure: JoJolion Wonder of U Arc) *Social Influencing (Charisma; Can influence and manipulate\
    \ others into disadvantage scenarios through his ingenuity. Successfully infiltrated society and passes\
