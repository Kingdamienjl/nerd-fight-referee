  intelligence:
    text: 'Gifted (Toru has shown an understanding of some technology to an extent.JoJo''s Bizarre Adventure:
      JoJolion Chapter 90 Most notably, Toru, by virtue of being the Head Doctor, has a vast understanding
      of medical sciences, medicines, anatomy, biology and various ailments, even being able to deduce
      issues and problems one may be having with little beyond just a glance, even if said issue isn''t
      overtly obvious.JoJo''s Bizarre Adventure: JoJolion Chapter 83 Toru has been shown to be quite cunning
      and manipulative, managing to separate his foes, create a sense of distrust and possible tension
      between them to an extent, manipulating their actions to ultimately have them lure him to his goal
      while keeping up his Stand attack, all the while drawing attention away from himself as the enemy
      and even gaining the trust of one of his primary foes. His Stand, Wonder Of U has shown good analytical
      skills, being able to deduce someone opened and touched a Locacaca fruit jar, by them off handily
      calling it a fruit as opposed to something else.JoJo''s Bizarre Adventure: JoJolion Chapter 97 Wonder
      Of U is also shown to be quite cautious, always staying just out of range of his foes and avoiding
      any possible traps they may have laid, always analyzing the situation and what his best route of
      action would be, even retreat if it''s optimal and safest route to victory. Is also adept at creating
      scenarios in order to have his foes "pursue" him, even if it''s just as simple as appearing in their
      line of sight but just out of range, thus activating his ability) Standard Tactics: Toru usually
      hides or is located completely out of sight, often at a great distance, making an effort to draw
      attention away from himself to the point his foes even think of him as a ally while his Stand, Wonder
      Of U, tricks his foes into "pursuing him" which can range from simply appearing in their line of
      sight and running away or creating entire situations that will lure those into wanting to come after
      him, of course simply thinking about defeating the Stand will activate the ability so it isn''t
      overly difficult to do. If backed into a corner, Toru will try and get his foes to approach him,
      in order to get them into the flow of the Calamity.JoJo''s Bizarre Adventure: JoJolion Chapter 108
      The Stand itself is quite cautious as well and analytical.'
    source_ids: *id002
    confidence: 0.95
