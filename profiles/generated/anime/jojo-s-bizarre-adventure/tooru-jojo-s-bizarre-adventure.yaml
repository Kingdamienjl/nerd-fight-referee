- id: claim-weaknesses-545db77c
  section: weaknesses
  axis: weakness
  text: 'Toru in his rock like state can be asphyxiated much quicker if fully submerged in a liquid if
    he lacks sufficient oxygen.JoJo''s Bizarre Adventure: JoJolion Chapter 33 Toru, due to being a rock
    human, likely occasionally hibernates for 30-90 days out of the year, the length of a hibernation
    and how long between each hibernation can vary between individuals. While "pursuing" the Head Doctor
    will activate the ability automatically, if the Stand/User is made to come to the target instead,
    the ability won''t activate,JoJo''s Bizarre Adventure: JoJolion Chapter 92 stated multiple times (Though
    actions that the target performs upon their arrival that can be classified as "pursuing" will still
    activate the ability). Abilities that can transcend the logic of the calamities, such as the SpinJoJo''s
    Bizarre Adventure: JoJolion Wonder of U Arc can ignore his defenses and can harm him if not outright
    kill him (Though the characters attempting to use them will still be subjugated to the Calamity, making
    inflicting damage still quite dangerous and difficult). The flow of the Calamity can be temporarily
    disrupted if Toru takes heavy damage somehow,JoJo''s Bizarre Adventure: JoJolion Chapter 108 though
    only briefly. Those who know of the Stand''s true nature will see its true form, not that of its adopted
    appearance.JoJo''s Bizarre Adventure: JoJolion Chapter 101 Actions that don''t count as "Pursuing"
    or an "Attack" won''t be subjugated to the flow of the Calamity and he can be approached if there''s
    zero will to "attack",JoJo''s Bizarre Adventure: JoJolion Chapter 107 though actions taken afterwards
    or consequences from said harmless actions do count and if those harmless actions were done with intent
    of an "attack" even if not explicitly one in and of itself, will be caught in the Calamity accordingly.JoJo''s
    Bizarre Adventure: JoJolion Chapter 108 Damage taken be either Toru or the Stand is shared between
    both, though the damaging and killing of Toru doesn''t effect Wonder of U permanently.JoJo''s Bizarre
    Adventure: JoJolion Chapter 108 Allergic to mango.JoJo''s Bizarre Adventure: JoJolion Chapter 46 {|
    cla'
