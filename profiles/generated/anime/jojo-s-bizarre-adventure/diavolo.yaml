- id: claim-powers-and-abilities-d1e509a0
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|content= |-|Doppio= * Extrasensory Perception
    (Capable of seeing ghosts and souls among some other supernatural forces that
    are normally otherwise invisible) * Aura & Summoning (Of Epitaph and King Crimson''s
    arms) * Multiple Selves (Type 2; His body contains two souls, that of Doppio and
    that of Diavolo, and he can switch at will, changing his physical proportions
    as well) * Precognition (Epitaph shows its user visions of up to Dozen-odd seconds
    into the future when used. The future it sees is guaranteed to occur) King Crimson''s
    arms have: * Superhuman Physical Characteristics * Invisibility (Only other Stand
    Users can see Stands) * Incorporeality (Stands are the incorporeal manifestation
    of one''s vital energy and can only be harmed by other Stands) * Non-Physical
    Interaction (Stands can interact with ghosts and other Stands) * Selective Intangibility
    |-|Diavolo= Same as before, as well as being able to use the full King Crimson,
    which has: * Superhuman Physical Characteristics * Afterimage Creation (Its attacks
    often leave afterimages) * Incorporeality (Stands are the incorporeal manifestations
    of one''s vital energy, and can only be harmed by other Stands) * Non-Physical
    Interaction (Stands can interact with ghosts and other Stands) * Invisibility
    & Selective Intangibility * Extrasensory Perception (Much like its user) * Time
    Erasure, Spatial Manipulation, & Causality Manipulation (King Crimson can erase
    up to a dozen-odd seconds of time, removing space in the process. With this, it
    allows him to erase all the process of the actions done in the erased time, leaving
    only its results) * Aura }}'
