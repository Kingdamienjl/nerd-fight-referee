- id: claim-weaknesses-35376638
  section: weaknesses
  axis: weakness
  text: 'Doppio= Doppio needs "permission" from Diavolo to use King Crimson. Epitaph''s
    forecasts cannot be avoided, though they can be dealt with using the knowledge
    they grant. Any damage King Crimson''s arms takes will be reflected onto Doppio.
    |-|Diavolo= Any damage King Crimson takes will be reflected onto Diavolo. It takes
    a few seconds for Diavolo to regain control over his body. Notable Attacks/Techniques:
    Doppio''s use of precognition.gif|Doppio using Epitaph Diavolo using Epitaph with
    Time Erase-Golden Wind Opening 2 Diavolo version.gif|Diavolo using Epitaph within
    Erased Time in an opening of the anime Diavolo using Epitaph with Time Erase against
    GER.gif|Diavolo using Epitaph within Erased Time against Gold Experience Requiem
    King Crimson: Diavolo''s Stand, a perpetually scowling humanoid Stand that operates
    at close ranges. It possesses incredible strength, befitting of a close-range
    Stand, and rather than deliver barrages of punches, it typically finishes off
    opponents with only a single, overwhelmingly powerful blow. *Epitaph: A sub-stand
    that takes the form of a pink bud of flesh on King Crimson''s forehead with the
    same sour expression. Both Diavolo and Doppio can use the Stand to see up to Dozen-odd
    seconds in the future, allowing them to see what happens around them. Rather than
    the process of the events, Epitaph shows the final result, and whatever it forecasts
    cannot be avoided - it can, however, be dealt with using the knowledge it grants.
    By the end of Part V, during a Time Erasure, Epitaph directly shows what will
    happen after it, in that location being King Crimson successfully perforating
    his opponent with his arm, after events that reverted him back to before his Time
    Erasure, his forecasts still showed him what was meant to happen after his Time
    Erasure. Additionally, albeit non-canon, the extended version in the second opening
    of the anime portrays Diavolo as being able to use Epitaph within Time Erasure
    too. JoJo''s Bizarre Adventure All-Star Battle-Diavolo''s “Pinnacle of Eternity!”.gif|Diavolo
    using King Crimson in All-Star Battle Diavolo erasing 0.5 seconds of time.gif|King
    Crimson erasing 0.5 seconds of time The Boss kidnaps Trish.gif|Diavolo kidnapping
    Trish unnoticed Fortuneteller holds Diavolo''s hand and the latter replaces it
    with the hand of the former, without Fortuneteller noticing it.gif|Replacing his
    hand with someone else''s unnoticed Anime King Crimson''s forecast & no one can
    remember.gif|Diavolo during Erased Time Anime King Crimson''s results & positioning.gif|Diavolo
    positioning himself behind Bruno *Time Erasure: King Crimson''s signature ability,
    which allows it to "erase" a period up to Dozen-odd seconds in length. During
    this period, Diavolo can see all actions (human or otherwise) that would have
    taken place from its activation to the end superimposed onto the world around
    him. Whilst everyone is unable to change their fate, Diavolo can freely move around
    as he pleases, often putting himself in a better position based on the aforementioned
    actions (though, it''s important to note that Diavolo not only never interacts
    with others but is also exempt from attacks as well). Once the time is up, everyone
    else finds themselves where they would''ve been at the end of their actions, but
    with no memory of the time Diavolo "erased". Note that actions he was originally
    fated to carry out, such as removing all of the evidence within a hotel room and
    escaping, will still occur when he erases time, despite no longer carrying said
    actions out himself. This is what allowed the actions of Trish being kidnapped
    and Narancia''s death to still occur without anyone actually seeing Diavolo, keeping
    his identity a secret and confusing his enemies in the process. In a couple of
    occasions, against dangerous opponents, Diavolo was able to throw his blood at
    the eyes of his opponents to blind their sight, thus reinforcing his killing blow
    against them. Jacketoff.gif|Doppio transforming into Diavolo in the manga Doppio
    to Diavolo.gif|Doppio transforming into Diavolo in All Star Battle Doppiodiavolo.gif|Doppio
    transforming into Diavolo in the anime Split Personality: Vinegar Doppio and Diavolo
    are two separate souls inhabiting the same body. While Doppio is unaware that
    they share the same body and thinks that Diavolo is another person, Diavolo is
    aware and is dominant due to that, being able to freely switch between Doppio
    and himself. Diavolo can give Doppio permission to use King Crimson''s arms and
    Epitaph if need be. Doppio hallucinates random objects as "phones" (Frogs, cigarettes,
    Ice cream, etc) to talk with Diavolo, which allows Diavolo to give tips to Doppio
    during battle and inform him about things he may be aware of. When Diavolo takes
    control over Doppio, may it be by just a bit or completely, Doppio''s body bulks
    up considerably until Diavolo is fully emerged. Both Doppio and Diavolo have their
    own souls and it is unknown who was born first and who the original is, although
    there are many hint'
