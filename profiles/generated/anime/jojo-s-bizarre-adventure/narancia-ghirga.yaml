    \ *Aerosmith: Aerosmith is a small Stand with the build of a blue model fighter plane. It attacks\
    \ with bullets fired from guns within the plane and occasionally a missile dropped from the center.\
    \ Despite its size, the damage of these projectiles is far greater than their real life counter parts.\
    \ The propeller itself can be used like a blade to slice enemies as a last resort. **Carbon Dioxide\
    \ Detection: Aerosmith has a radar that Narancia can view at any time. It detects all forms of carbon\
    \ dioxide in his radius, varied by size level and activity level. The sensitivity of the amount of\
