  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Extrasensory Perception
    (Capable of seeing ghosts and souls among some other supernatural forces that
    are normally otherwise invisible), Multiple Selves (Type 2; Hierophant Green is
    a spiritual entity derived from Kakyoin's soul and is implied to have a mind of
    its own), Capable of communicating through his Stand, Aura, and Summoning (Of
    his Stand). Hierophant Green has Superhuman Physical Characteristics, Extrasensory
    Perception (Much like its user), Flight (Within its effective range), Possession
    & Body Puppetry, Elasticity, Body Control, Size Manipulation (Can shrink down
    to a microscopic level), Energy Projection, Resistance to Memory Manipulation
    (Resisted Death 13's ability to make people forget and remembered everything that
    happened in the dream world), Danmaku, Selective Intangibility, Incorporeality
    (Stands are the incorporeal manifestations of one's vital energy, and can only
    be harmed by other Stands), Non-Physical Interaction (Stands can interact with
    ghosts and other Stands), Invisibility (Stands can only be seen by other Stands
    and Stand Users), Aura
