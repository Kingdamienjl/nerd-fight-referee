- id: claim-weaknesses-46eca7c9
  section: weaknesses
  axis: weakness
  text: 'Any damage taken to Hierophant Green will reflect back onto Kakyoin, though
    this can be circumvented when Hierophant Green is in its unraveled form Notable
    Attacks/Techniques: Emerald splask.gif|The Emerald Splash Ezkak3.gif|The 20 Meter
    Emerald Splash''s tripwires activating Ezkak4.gif|The 20 Meter Radius Emerald
    Splash Ezkak1.gif|Hierophant Green utilizing its tendrils Ezkaktog.gif|Impaling
    Tower of Grey after luring it into a trap Ezkak2.gif|Taking over Death 13''s body
    Kak7.gif|Kakyoin using Hierophant Green to swing between buildings Ezkakheight.gif|Kakyoin
    shrinking his Stand to a microscopic scale *Hierophant Green: A medium-sized,
    lime-green humanoid figure Stand with a gel-like body composition. It does not
    perform melee attacks, instead using its abilities and body to its advantage.
    **Coiled Body: Hierophant Green''s body looks natural, but it''s composed of interconnected
    membranes that can stretch and unwind the Stand''s body. This also means that
    damage can be avoided by simply unraveling its own body since it does not hurt
    Kakyoin if it does so. ***Tentacles: Hierophant Green can extend tentacles from
    its membranes as a means to detect movement, creating a large web that extends
    up to twenty meters across. If an object comes into contact with a tentacle, its
    location is immediately given away to Kakyoin. These tentacles are also capable
    of identifying stands and were even able to identify Steely Dan''s stand, The
    Lovers, out of a crowd of its copies. ***Marionette Control: Hierophant Green''s
    tentacles can enter another person''s body and control them from the inside out.
    This also protects Hierophant Green and leaves the victim as a meat shield of
    sorts. **Emerald Splash: Hierophant Green''s main ability. Energy is stored into
    the palms of its hands, then released as small, emerald shards which shoot out
    in multiple directions, covering a wide radius. This can alternatively be focused
    into a smaller radius when necessary. The shards are sharp enough to damage sturdy
    objects and easily pierce through flesh. Kakyoin can also set up any of Hierophant
    Green''s tentacles to release an emerald splash towards an enemy that touches
    them. ==Gallery== Kakyoin PPP.gif|Kakyoin as he appears in Jojo''s Pitter Patter
    Pop ==Notable Matchups== Victories: Dio Brando (JoJo''s Bizarre Adventure) Dio''s
    Profile (Part 1 Dio was used, and speed was equalized) Bruno Bucciarati (JoJo''s
    Bizarre Adventure) Bruno''s Profile Okuyasu Nijimura (JoJo''s Bizarre Adventure)
    Okuyasu''s Profile (Both started 15 meters apart, and speed was equalized) Jotaro
    Kujo (JoJo''s Bizarre Adventure) Jotaro''s Profile (Battle was a best of 3 match
    of SSB Melee as Fox on Final Destination, competitive rules playing on a Nintendo
    Gamecube, with the original controls of the console in good condition, Jotaro
    had 5 minutes of preparation in training mode) Losses: Jolyne Cujoh (JoJo''s Bizarre
    Adventure) Jolyne''s Profile (Speed was equalized) Fifteen (Katana ZERO) Fifteen''s
    Profile (Speed was equalized) Inconclusive: Jean Pierre Polnareff (Jojo’s Bizarre
    Adventure) Polnareff’s Profile (Both started 15 meters apart, and speed was equalized)
