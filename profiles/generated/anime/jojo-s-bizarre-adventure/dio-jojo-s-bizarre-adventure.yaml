      higher with Space Ripper Stingy Eyes (Capable of effortlessly defeating Jonathan
      Joestar), can ignore conventional durability with Vaporization Freezing. | Likely
      Large Building level (Should be near to his peak during Part 1. Consistently
      deflected Emerald Splash, even with just one finger). At least Large Building
      level+ with The World (The World has overwhelming power with its physical capabilities
      far exceeding Star Platinum's initial capabilities and completely matching it
