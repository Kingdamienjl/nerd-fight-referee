  intelligence:
    text: Genius (Although he is arrogant and full of himself, Dio is a cunning, pragmatic
      opponent who is willing to do anything necessary to succeed in a fight, no matter
      how underhanded he has to be. He experiments with his powers, not just his vampiric
      ones but the limits of his Stand, pushing himself further and further in search
      of strength, which he uses to brutal effect in fights. With The World, DIO does
      not pull any punches, moving to finish fights as quickly as possible by stopping
      time and unleashing a lethal strike, though he can be goaded into actually fighting
      against an opponent. When fighting against Jotaro, DIO utilized everything at
      his disposal to defeat him, throwing knives at him from a safe distance to test
      the limits of his ability to move in stopped time before cautiously making sure
      he was dead. Even then, DIO's next move was to decapitate him anyway, just to
      be safe. Before he became a vampire, he was skilled in hand-to-hand combat and
