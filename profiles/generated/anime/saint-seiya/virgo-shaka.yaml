- id: claim-weaknesses-d894e98f
  section: weaknesses
  axis: weakness
  text: "Very arrogant. Agyo requires him to be still and in meditation Notable Attacks/Techniques: *Tenkuuhaja\
    \ Chimimouryou (Heaven Supremacy on Evil Spirits of Rivers and Mountains): Summons evil spirits to\
    \ attack the enemy soul. *Tenma Kofuku (Demon Pacifier): Expands his Cosmos in an enormous blast,\
    \ one strong enough to destroy a large part of the Cancer Temple. Deals more severe damage to evil\
    \ beings. *Khan: A powerful barrier that nearly halted the attacks of three gold saints. This barrier\
    \ can also deflect attacks. *Buddha's Hand: This move gives the illusion of thinking you are moving,\
    \ but in reality, you are trapped in the hand of Buddha, unable to escape. *Rikud\u014D Rinne (Transmigration\
    \ to the Six Paths or Six Sams\u0101ras): A possibly illusionary technique in which Shaka sends his\
    \ opponent to one of the six Dharma's rebirth realms. *Tenbu Horin (Treasures of Heavens): Shaka's\
    \ most powerful technique. It reveals the truth of the Universe; Impermanence. H\u014Drin is the Japanese\
    \ translation of the sanskrit Buddhist word for \u0927\u0930\u094D\u092E\u091A\u0915\u094D\u0930.\
    \ This means dharmachakra (pl. dharmachakras). Dharmachakras is the Buddhist Wheel of Law, and Shaka\
    \ is the Buddha turning the Wheel of Laws to bring causality to a halt. \u201CThe Wheel of Laws\u201D\
    \ is a symbolic representation of the Cycle of Samsara. The images within the Tenbu Horin are Dharmachakras,\
    \ The various \"Wheels of Life\" or \"Dharma Wheels.\" The hub of the wheel represent the three poisons\
    \ of ignorance, attachment and aversion. The second layer represents karma (Cause and Effect). The\
    \ third layer represents the six realms of cyclic existence. The fourth layer represents the twelve\
    \ links of dependent origination (Causality). The fierce figure holding the wheel represents impermanence.\
    \ A Dharma Wheel with four spokes symbolizes the Four Noble Truths. When the wheel has eight spokes,\
    \ it represents the Eightfold Path. Twelve spokes symbolize the Twelve Links of Dependent Origination\
    \ (Causality). Once you are trapped by the stopping of causality. Your five basic senses, and the\
    \ sixth senses will then be removed. *Athena Exclamation: An attack which is equal to the force of\
    \ the Big Bang, only usable by three Saints working together. *Agyo: it is an immense light generated\
    \ by Shaka, the light of the birth of the universe. ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ {{Discussions}} Category:Characters Category:Saint Seiya Category:Anime Characters Category:Demigods\
    \ Category:Transcendent Beings Category:Psychics Category:Telepaths Category:Spirits Category:Manga\
    \ Characters Category:Telekinesis Users Category:Soul Users Category:Flight Users Category:Cosmo Users\
    \ Category:Teleportation Users Category:Gold Saints Category:Power Nullification Users Category:Matter\
    \ Users Category:Illusionists Category:Energy Users Category:Light Users Category:Pocket Reality Users\
    \ Category:Armor Users Category:Acausal Characters Category:Perception Users Category:Extrasensory\
    \ Perception Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
