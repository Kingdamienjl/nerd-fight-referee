- id: claim-weaknesses-0d08a99a
  section: weaknesses
  axis: weakness
  text: 'He has a evil side that may take control of him but likely never in a battle
    | None notable. Notable Attacks/Techniques: *Galaxian Explosion: An extremely
    concentrated and potent wave of destructive Cosmo. At its'' full power, its''
    force is said to be comparable to the destruction of the stars and planets of
    the Milky Way, sometimes leaving even Gold Saints completely overwhelmed by it.
    *Another Dimension: Another powerful technique of Gemini Saga. Concentrating his
    Cosmos within the palm of his hands, Saga warps space and time, opening a tear
    between universes that sucks and transports the opponent to an unknown and inescapable
    dimension. *Demon Emperor''s Fist: With a quick movement of hands, the Gemini
    Saint "splits" the air, opening a tear within the atmosphere. Then, through the
    vacuum opened by his fist, a thin, minuscule beam of energy moves at light speed,
    until it "pierces" the opponent''s brain. This technique directly attacks the
    mind, allowing the Gemini Saint to manipulate actions and thoughts through suggestion.
    ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters
