  intelligence:
    text: Gifted normally, Genius in combat (Even before becoming a ghoul, Kaneki was a highly intelligent
      young man. After being tortured by Yamori, Kaneki embraced his Ghoul instincts, becoming a vicious
      fighter who can effortlessly tear apart entire ranks of Investigators and casually take down two
      S-Rank Ghouls, Yamori and Ayato, in quick succession, earning a SS-Rank designation for his acts.
      His bookish nature along with his tendency to be a quick learner, serves him well, picking up advanced
      martial arts in weeks by studying several books and later becoming an expert in using his Kagune
      and Quinque simultaneously under Arima's tutelage. He is capable of "reading" his opponents, carefully
      watching them to predict their motions and mimic their techniques. He soon becomes one of the most
      skilled fighters in the series, disarming Arima even after he began using a SSS-Rank Quinque made
      from Yoshimura's Kagune and defeating Eto in single combat. In his Dragon form, however, he doesn't
      seem to act consciously and attacks whatever is in his sight)
    source_ids: *id002
    confidence: 0.95
