- id: claim-weaknesses-22d6ca55
  section: weaknesses
  axis: weakness
  text: 'Due to her immortality, Makima has gained a habit of allowing attacks to hit her regardless of
    any consequences which was eventually exploited by Denji to defeat her with a chainsaw created out
    of Power''s blood which was able to impede her diffusive regeneration by having it continuous run
    amok inside of her. Her downfall was also aided by the fact, that she only bothered to remember people
    and devils by their scents as opposed to their appearances, and won''t bother memorizing the scents
    of those she views as mere pawns or objects, which allowed Denji to successfully ambush her in their
    final confrontation after he temporarily separated from Pochita. Her damage transference contract
    itself can also be bypassed by injuring/killing her without violent intent, which was a loophole that
    Denji was able to figure out to put her down permanently by cannibalizing her in what he describes
    as an act of love, and wanting "to be one with her". Her abilities as the Control Devil are not perfect
    as an influx of strong emotions have been shown to be able to break free from Makima''s control as
    seen with Angel. Feats: Physica'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
