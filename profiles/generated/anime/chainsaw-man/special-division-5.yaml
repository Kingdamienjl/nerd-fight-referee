- id: claim-weaknesses-f3fcad60
  section: weaknesses
  axis: weakness
  text: 'Standard Devil/Hybrid Weaknesses. All team members are under the influence of Makima, causing
    them to keep a cool head and focus on the battle instead of their worries or thoughts. Notable Team
    Attacks/Techniques: {| class="mw-collapsible mw-collapsed" align="center" border="1" cellpadding="1"
    cellspacing="1" style="width:100%" | colspan="2" style="text-align: center; background-color: #000000;
    color: #ffffff" |Movesets and Abilities |- | *Katana Hybrid: Also known as Samurai Sword, by removing
    his left hand from his body, he''s capable of transforming into the Katana Hybrid.Chainsaw Man Chapter
    36 As a hybrid, he''s capable of manifesting large katanas from both of his arms as well as his head.
    **Sword-Draw Dash: Katana Man is capable of dashing forward at incredible speeds, almost seemingly
    like teleportation to his opponent, while slashing at his opponent as he goes by them when he crouches
    down low and prepares to unleash his katanas.Chainsaw Man Chapter 26 **Bomb Hybrid: Also known as
    Reze, she''s able to transform into the Bomb Hybrid by pulling a pin on her neck, much like a grenade.Chainsaw
    Man Chapter 44 As her the name suggests she''s capable of: ***Explosion Creation: Reze is capable
    of creating massive explosions out of her arms and legs as well as capable of sending out explosive
    projectiles. ****Explosive Propulsion: By releasing continuous and consecutive explosions from her
    arms and legs, Reze can travel through the air. ****Self-Detonation: Reze is able to turn any part
    of her body into bombs even if they''re disconnected from her which acts as remote explosives. ***Torpedo
    Transformation: Reze can transform her limbs into torpedoes, which are able to enhance her punches
    and kicks to become more devastating. **Bow Hybrid: Also known as Quanxi, she can transform into the
    Bow Hybrid through pulling an arrow out of her right eye socket. As the Bow Hybrid, she can fire a
    multitude of powerful arrows from her hand crossbows. **Flamethrower Hybrid: Also known as Barem Bridge,
    he''s able to become the Flamethrower Hybrid by putting his thumb behind his teeth.Chainsaw Man Chapter
    87 He''s able to transform both his arms into flamethrowers to scorch his opponents when transformed.
    **Longsword Hybrid: Also known as Miri Sugo, by removing his right hand from his body, he''s able
    to transform into the Longsword Hybrid. Similar to Katana Man, he''s capable of manifesting swords
    from both of his arms as well as his head. **Spear Hybrid: By pulling a spear from his nape, he''s
    capable of transforming into the Spear Hybrid . When transformed, he''s able to manifest spears which
    he can throw with extreme accuracy. **Whip Hybrid: By snapping her fingers to mimic the sound of a
    whiplash, she''s able to transform into the Whip Hybrid. As a hybrid, instead of having normal hands,
    her arms end instead are whips which can be used to attack its enemies. |} Note: This page is based
    on the first iteration of Special Division 5, which is separate from the team shown in Part 2 of the
    Chainsaw Man manga.'
