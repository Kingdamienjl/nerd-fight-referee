  range:
    text: 'Standard Melee Range up to Interdimensional with Makima''s control Teamwork: Special Division
      5''s attacks are coordinated with Makima''s command. They immediately start by transforming into
      their devil forms and then simultaneously attacking the opponent. Their attacks can range from swords
      and katanas to explosions of varying potency, whips, flamethrowers, and high-speed arrows. Their
      attacks are designed to simultaneously overwhelm and damage the opponent as much as possible by
      using their most lethal moves in the right scenarios or getting their opponent airborne and defenseless
      while also catching them off guard whenever they can. If the moment is right, Makima will intervene
      utilizing her telekinesis to either kill the opponentChainsaw Man Chapter 90 or shoot the opponent
      into space. If at any point the opponent defeats all the hybrids in the division, Makima will begin
      to attack on her own, summoning new controlled minionsChainsaw Man Chapter 76Chainsaw Man Chapter
      89Chainsaw Man Chapter 93 or various weapons, which could end the match instantly, or forcing the
      opponent into lethal scenarios.'
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Unknown up to At least Genius. The leader of the division, Makima, is an extraordinarily intelligent
      individual while being the leader of multiple devil extermination units and having years of experience
      leading devil hunters against various foes. True to her nature as the Control Devil, manipulation
      and methodical calculations are core parts of her mastermind. She meticulously planned everything
      that happened to Denji throughout Part 1, including the deaths of both Power,Chainsaw Man Chapter
      82 and Aki, to eventually break him. Even without her Control powers, she manipulated Denji into
      trusting and falling for her,Chainsaw Man Chapter 2Chainsaw Man Chapter 96 even after her reveal
      as the mastermind of his undoing. She also manipulated almost every member of the Public Safety
      Devil Hunters, merging Special Division 1, 2, 3, and 4 under her control,Chainsaw Man Chapter 28
      to create a scenario where Denji would offer himself to her with no resistance, even against the
      likes of Kishibe, who, despite his suspicions, decided not to interfere until it was too late. Possibly
      Omniscient with the Cosmos Devil. The Cosmos Devil's mind contains the sum of all the knowledge
      of the universe. Unknown up to Genius. (Members of this division include extremely professional
      combat and battle geniuses, including skilled assassins and trainees. Examples include Reze, a trained
      assassin from the Soviet Union,Chainsaw Man Chapter 52 who can easily compete with and defeat another
      armed assassin who held some of the Typhoon Devil's powerChainsaw Man Chapter 41 by outmaneuvering
      him and placing him in a stranglehold.Chainsaw Man Chapter 43 She also put Aki, one of Kishibe's
      trainees, on the defensive and completely outskilled Denji, who at the time had received daily special
      combat training from Kishibe,Chainsaw Man Chapter 29 one of the most skilled close-quarters-combat
      practitioners shown in the series. Kishibe is skilled enough to briefly keep up with Quanxi, another
      hunter skilled enough to be regarded as able to win against anyone else in the world in pure bare-knuckle
      fighting,Chainsaw Man Chapter 54 and who is also in Special Division 5. People such as Katana Man
      are able to match Chainsaw Man in combat and would have likely defeated him in a fight if it weren't
      for his cheeky battle tactics. The leader of the team, Makima, has displayed her many years of experience
      leading devil hunters against other foes. This can be seen during her fight with a weakened Pochita,
      despite him retaining knowledgeChainsaw Man Chapter 1 of Denji's special training with Kishibe.
      In fights, she has shown to smartly use combinations of her abilities and the environment to best
      counter her opposition. An example can be seen with her use of the Zombie Devil to counter Power's
      internal blood manipulation or with her making Chainsaw Man into a public hero, stripping him of
      the power that devils receive by being feared.)
    source_ids: *id002
    confidence: 0.95
