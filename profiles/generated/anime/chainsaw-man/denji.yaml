  durability:
    text: While in his Hybrid form, Denji's physical durability is increased to inhuman
      levels. He can fall from great altitudes and punch Devils through walls, without
      receiving any injuries. He also has survived a point-blank blast from the Bat
      Devil that destroyed a building behind him,{{Ref|m|8|11 - 14}} multiple explosions
      from Reze, being on fire for extended periods of time and being near the Typhoon
      Devil's tornado, which has been shown to be strong enough to lift cars. His
      head and chainsaws are far more durable than the rest of his body, due to being
      made of metal, and being capable of deflecting bullets.{{Ref|m|28|9}} **Augmented
    source_ids:
    - fandom-chainsaw-man-denji
    confidence: 0.75
    notes: auto_repair source extraction
  stamina:
    text: 'Denji was capable of fighting the Eternity Devil for approximately three
      days. As long as Denji continues to drink blood to recover from his injuries,
      he is essentially a perpetual motion machine.{{Ref|m|19|1-19}} **Chainsaw Manifestation:
      As part of his transformation Denji grows fully-functional chainsaws from his
      arms, legs, feet and head. These chainsaws are extremely effective at cutting
      Devils'' flesh, allowing Denji to sever limbs{{Ref|m|8|2}} and bifurcate his
      enemies. They are also very effective at cutting other materials, such as stone
      and concrete,{{Ref|m|94|3 - 6}} however they have shown to be incapable of cutting
      through metal.{{Ref|m|78|11}} The chainsaws in his legs and feet are not usually
      active, however, Denji can employ them just by willing it. Just like the rest
      of his body, these chainsaws are regenerated every time Denji pulls his cord
      and fully transforms. *** Chainsaw Retraction: If he needs the full use of his
      arms and legs to do certain tasks while in his Hybrid form, Denji''s chainsaws
      can be retracted into his body, allowing him to perform mundane actions such
      as grabbing objects.{{Ref|m|8|7 - 8}} While Denji can willingly retract his
      chainsaws, they can also be retracted automatically based on his instincts alone.
      ***Chain Entanglement: Denji is able to disconnect his chains from his chainsaws
      to use them in combat. He can wrap his chains around his opponent''s body and
      then pull them closer to him. Denji can also wrap his chains around objects
      to cut them, throw them or do both.{{Ref|m|94|3 - 6}} If Denji''s arms get torn
      off but are still connected to his body, he can still use his chain like body
      tissue to wrap his enemies around. The chains can also be used as grapple hooks,
      allowing Denji to wrap them around a target and then pull his body closer to
      said target.{{Ref|m|94|13 - 14}} ***Chain Grappling: In his combined form, Denji
      is capable of using the chains connected to his chainsaws as grappling tools
      even when the limb wielding them has been severed. By extending the chains from
      a detached arm, he can latch onto surfaces or targets to propel himself away
      or drag his body across the ground. This is shown when Denji fires a chain from
      his severed arm to escape while retreating from Yoru.{{Ref|m|228|2 - 6}} *Devil
      Transformation: After surrendering his contract with Pochita, Denji transformed
      into a Full Devil. In this form, Pochita displays incredible speed and strength,
      easily defeating multiple Hybrid Devils in a matter of seconds. Though he has
      been shown to have taken damage, and even been incapacitated by being sent to
      Hell and blasted into Space, these acts merely delayed him for a few minutes
      before he returned unscathed. His immense power is further highlighted in Hell,
      where it is implied that he defeated every Devil residing there. Makima stated
      that he has killed her 26 times in this form. This form seems to lack Denji''s
      personality and awareness, though it has been shown to retain some memories
      and frequently acts in accordance with them. After being defeated by Makima
      to save Kobeni and later rescued by Power, Denji transformed back to normal
      and regained consciousness. During Denji''s stay in the world the Aging Devil
      created he was still transformed into his Full Devil form, thus his stomach
      was connected to Pochita who was still in the real world, which allowed for
      Pochita to make Denji barf up people and Devils or for them to escape from his
      mouth. *Blood Consumption: Denji is able to heal completely from nearly any
      fatal injury, and in some instances recover from death, so long as he consumes
      a sufficient amount of blood. After losing his arm to Bat Devil, Denji''s arm
      re-attached itself after he received a blood transfusion.{{Ref|m|11|1 - 2}}
      With his fight against Santa Claus, he consumed one of her doll''s blood to
      keep fighting while still being on fire. ** Nigh-Immortality: Due to being a
      Hybrid, Denji is immortal and nearly unkillable. He can survive getting shot,
      being thrown from buildings and taking all kinds of injuries that would kill
      most Devils. Even if he dies, as long as someone pulls the cord on his chest,
      Denji can come back to life in perfect condition. Even after being decapitated,
      being cursed by the Curse Devil and having most of his body blown up, Denji
      still managed to come back to life with no lasting damage. **Body Duplication:
      As a full Devil, he regenerated from just his heart after he ripped Pochita
      out and threw it from space. After noticing this method of regeneration, he
      is able to remove Pochita from his body and regenerate it as a separate entity
      that talked just like Denji, which allowed him to fool Makima, using the rest
      of Power''s blood to seemingly keep himself alive without a heart while the
      duplicate fought. ===Devil Contracts === * Chainsaw Devil Contract: In exchange
      for living a "normal life", Pochita became Denji''s heart and turned him into
      a Hybrid. All of his Hybrid abilities are originated from this contract. *Blo'
    source_ids:
    - fandom-chainsaw-man-denji
    confidence: 0.75
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range physically, Extended Melee Range with Equipment and
      Chainsaws, Up to Tens of Meters with Chains (Can use the chains from his chainsaws
      to wrap around his opponents from afar)
    source_ids:
    - vsbattles-denji-chainsaw-man
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Despite never receiving a proper education, Denji is very perceptive when
      it comes to ascertaining his enemies'' weaknesses and how to exploit them. Denji
      was trained under Kishibe, who he refers to as "master" later on in the story,
      who teaches him various strategies. This is shown in the fight against Katana
      Man where Denji deceives Katana Man by making him think that Denji can only
      manifest chainsaws in his arms. Denji also managed to incapacitate Reze by using
      her weakness against water and defeat Santa Claus by abusing her weakness towards
      fire and light. In the time between Parts 1 and 2 Denji has continued developing
      his skills, such as learning to use his neck cables to reattach his head and
      legs after being dismembered and learning to resist mental attacks by damaging
      his own brain with his chainsaws as seen in the fight against the Falling Devil.
      *Swimming: After meeting Reze, Denji learned how to swim. He managed to use
      this skill to his advantage during his fight against her.'
    source_ids:
    - fandom-chainsaw-man-denji
    confidence: 0.75
    notes: auto_repair source extraction
