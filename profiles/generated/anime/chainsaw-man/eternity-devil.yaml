- id: claim-powers-and-abilities-a77e625b
  section: abilities
  axis: hax
  text: '*BFR via Pocket Reality Manipulation & Spatial Manipulation (It is able to
    create an infinite looping dimension inside structures like a building or a floor
    of a building which would then become its stomach, trapping anything within it.
    Any door or window that leads to outside of the floor or building will loop back
    to the opposite door or window. It can''t die if its heart is still not destroyed,
    its main body is in another pocket dimension thus you can''t reach it through
    conventional means, though there is a chance to escape if it decides to appear.
    Induce enough pain on the Devil which is its only known weakness and it will eventually
    surrender its heart to youChainsaw Man Chapter 15Chainsaw Man Chapter 17Chainsaw
    Man Chapter 18Chainsaw Man Chapter 19) **Gravity Manipulation (It is able to change
    the direction of gravity within its pocket-realmChainsaw Man Chapter 17) **Time
    Manipulation (Time does not flow inside this pocket-realmChainsaw Man Chapter
    15) **Size Manipulation (It can grow larger over time from the fear of the victims
    inside its pocket-realmChainsaw Man Chapter 17) *Shapeshifting (Capable of shapeshifting
    its body freely like a mass of living meat Chainsaw Man Chapter 16 Chainsaw Man
    Chapter 19) *Large Size (At least Type 1, a single floor of a hotel is its stomachChainsaw
    Man Chapter 17) *General Devil Physiology (Devil) **Enhanced Immortality (Type
    8, It can''t die if its heart is still not destroyed Chainsaw Man Chapter 18)
    *General Devil Resistances Everything the same as before but weaker due to being
    Death''s pawn as well as not having consumed Gun Devil''s flesh *Enhanced Pocket
    Reality Manipulation (Can create a possibly infinite dimension with a looping
    structure though this could provide infinite resources of any kind for the victims
    if the place contains anyChainsaw Man Chapter 114) **Enhanced BFR (Unlike in Part
    1, the Eternity Devil now does not show up anymore thus you couldn''t even possibly
    hurt it, removing its only known weaknessChainsaw Man Chapter 114Chainsaw Man
    Chapter 115) *Large Size (Type 0, is considerably taller and larger than AsaChainsaw
    Man Chapter 117) Part 1 (w/ The Gun Devil''s Flesh)'
  source_ids: *id002
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
