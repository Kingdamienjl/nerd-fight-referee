- id: claim-weaknesses-cbe16d0f
  section: weaknesses
  axis: weakness
  text: "The Aging Devil\u2019s greatest vulnerability lies in its own realm, \"Aging\u2019s World\".\
    \ While this Devil can trap others there indefinitely, it also loses access to its own powers upon\
    \ entering. When Denji\u2019s group manages to pull the Aging Devil into its own pocket dimension,\
    \ the Devil is forced to negotiate, since it cannot use its abilities inside that domain. The Aging\
    \ Devil\u2019s apathy and arrogance causes him to underestimate opponents and grow easily annoyed,\
    \ allowing determined adversaries, like Pochita and the others, to exploit its complacency and force\
    \ it into disadvantageous situations."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-a07ff103
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *General Devil Physiology (Primal-Fear) **Regeneration (At\
    \ least High-Mid, likely at least Mid-High; Was able to regenerate despite being relentlessly torn\
    \ apart, shredded to ribbons and brutally dismembered by Pochita\u2019s chainsaws, enduring repeated\
    \ decapitations and grotesque mutilation without ceasing. Likely possesses regeneration on par with\
    \ Falling Devil's avatarsChainsaw Man Chapter 122Chainsaw Man Chapter 125Chainsaw Man Chapter 126Chainsaw\
    \ Man Chapter 131) *Pocket Reality Manipulation (The Aging Devil created their own \"world,\" a separate\
    \ reality from what is considered the \"real world.\"Chainsaw Man Chapter 184 This world was established\
    \ for the purpose of experimenting on humans. The contents and rules of this world are listed below.)\
    \ **BFR (\"Aging's World\" was created to discover concepts that are innate to humans, which can only\
    \ be unlocked by reaching the culmination of thought. They believe they can reveal more of these unseen\
    \ concepts if humans are allowed to live longer For this reason, they have not created an exit, meaning\
    \ anyone who is sent to this realm will be trapped with no means of escape.) **Power Nullification\
    \ (All devil abilities or powers are nullified within \"Aging\u2019s World,\"Chainsaw Man Chapter\
    \ 181 and this restriction applies even to the Aging Devil themselfChainsaw Man Chapter 190) **Power\
    \ Bestowal (Within the realm of Aging, you cannot die or experience hunger or thirst. Even if you\
    \ attempt to end your own life, you will not perish) *Clairvoyance, Portal Creation, Size Manipulation\
    \ & Dimensional Travel (They are able to manifest mirrors that connect both Earth and Hell, allowing\
    \ them to see through these mirrorsChainsaw Man Chapter 173 and even use them to travel between dimensions.\
    \ They can also manipulate the size of the mirrors, enabling them to pass through without difficulty.Chainsaw\
    \ Man Chapter 178 Furthermore, they are able to increase the size of their body while punching in\
    \ a different dimension, resulting in larger and more impactful blows) **Cosmic Awareness (Is able\
    \ to see and hear through their mirrors, detecting communication from multiple locations while understanding\
    \ what is being requested of them. They can acknowledge a Devil Hunter\u2019s request simply by noticing\
    \ the hunter glance at a mirror.Chainsaw Man Chapter 180 They are constantly aware of everything occurring\
    \ in their world and its inhabitantsChainsaw Man Chapter 185) *Time Manipulation (Possesses the ability\
    \ to stop time at will and the objects it functions on. By utilizing this ability, they can effortlessly\
    \ halt an intercontinental bullet from the Gun Goddess, observe the frozen bullet, and comment on\
    \ a frozen Yoru,Chainsaw Man Chapter 179 whom they then sent to their dimension) *Age Manipulation\
    \ & Telekinesis (They are able to age their target through physical contact, causing the Gun Goddess\u2019\
    s bullet to crumble into dust in mere seconds. They can also use this ability at a distance with a\
    \ simple gesture, all while forcing their opponent back into their dimension through the supposed\
    \ exitChainsaw Man Chapter 189) *Transmutation (With just a touch of their finger, they can transmute\
    \ opponents into treesChainsaw Man Chapter 187) *Biological Manipulation & Durability Negation (While\
    \ contracted with humans, in exchange for full control over their bodies, they can sacrifice their\
    \ hosts' organs to induce cancerous growths inside an opponent\u2019s body, causing numbness and forcing\
    \ the body to fall apartChainsaw Man Chapter 186)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
