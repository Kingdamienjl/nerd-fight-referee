- id: claim-weaknesses-5bbf1ad5
  section: weaknesses
  axis: weakness
  text: 'None notable. Notable Attacks/Techniques *Octopus Devil Contract: Yoshida has a contract with
    the Octopus Devil for an unknown price. **Tentacle Summoning: By crossing his middle and index fingers,
    he can summon the Octopus Devil''s tentacles which protrude from ink clouds. can summon multiple of
    these to attack small groups or bind them. Yoshida can summon them to wrap himself for protection
    or use them to catch him from falling to his death.Chainsaw Man Chapter 61Chainsaw Man Chapter 67Chainsaw
    Man Chapter 63 **Ink: By saying "Ink", any tentacles he has summoned will produce a large black smokescreen
    which can blind his opponents and cloak his movements.Chainsaw Man Chapter 61 **Grab: By saying "Grab",
    Yoshida can summon a tentacle directly out the palm of his hands to grab onto objects far away, **Swallow:
    By sacrificing a heart and then saying "Swallow", Yoshida can summon the entire Octopus Devil to swallow
    his opponents.'
  source_ids: *id003
  decisive: false
