- id: claim-weaknesses-a576b6d6
  section: weaknesses
  axis: weakness
  text: "Fake Chainsaw Man\u2019s greatest liability is his dependence on live hostages for both offense\
    \ and defense when using Flesh-Graft. When he swells his arms by fusing Pseudo-Chainsaw People into\
    \ them, the victims\u2019 screams are meant to paralyze compassionate foes, but an opponent willing\
    \ to ignore or quickly neutralize those captives can strike while his enlarged limbs are still heavy\
    \ and less agile. Likewise, the conscious civilian embedded over his heart protects that vital point\
    \ only against enemies who hesitate to kill innocents, a ruthless attacker can pierce the core directly.\
    \ He fights exclusively at melee range and has never displayed ranged devil techniques or leg-mounted\
    \ chainsaws."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-83004873
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *General Devil Physiology (Devil) **Absorption & Regeneration
    (Low-Mid, possibly Mid; By absorbing the Pseudo-Chainsaw People under his control into his body, he
    can regenerate and restore both of his severed armsChainsaw Man Chapter 202 Can likely regenerate
    by pulling his chainsaw cord,Chainsaw Man Chapter 203 however, is entirely dependent on how much blood
    he has in his body.Chainsaw Man Chapter 9 He can possibly reattach his head to his body by pulling
    his chainsaw cord, similar to his original counterpartChainsaw Man Chapter 128) * Transformation (Possesses
    a contract with the Fire Devil, granting him the ability to transform into the embodiment of his justiceChainsaw
    Man Chapter 205) **Cyborgization, Bodily Weaponry & Chainsaw Creation (Partial, Unconventional; Once
    transformed, he''s partially turned into a literal chainsaw; growing chainsaw blades out his head
    and arms.) **Instinctive Action & Immortality (Enhanced Type 3; Capable of fighting and delivering
    strikes directly to Chainsaw Man, even after having their head removed from their body.Chainsaw Man
    Chapter 204) **Enhanced Statistics Amplification (With the Fire Devil within him, he grows stronger
    with each additional contract it possessesChainsaw Man Chapter 148) *Multiple Selves (Type 1 & 3;
    Shares his body with the Fire Devil; who was under the guise as the Justice Devil) **Limited Information
    Analysis (The Fire Devil is able to provide him with the location and the identity of certain devils
    even if they may look like normal peopleChainsaw Man Chapter 196) *Summoning (Able to control and
    summon "Pseudo-Chainsaw Devils" to his location in order to block attacks or absorb into himself for
    further power and replacement limbs) **Mind Manipulation & Body Puppetry (Possesses the ability to
    control the body movements of Pseudo Chainsaw Men and Fire Devil contractees, using them as shields
    to protect himself, and can also allow them to regain consciousness) *Enhanced Senses (Somehow managed
    to parry a shot from Yoru''s Gun Gauntlet, despite it being an invisible projectileChainsaw Man Chapter
    200) *Martial Arts (Has some experience in the areas of karate and boxingChainsaw Man Chapter 197)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
