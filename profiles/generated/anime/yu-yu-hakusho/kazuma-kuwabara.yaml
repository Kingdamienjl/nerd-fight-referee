- id: claim-weaknesses-d119e97e
  section: weaknesses
  axis: weakness
  text: 'Kuwabara is a bit too straightforward as a fighter and can be a bit dumb sometimes. Notable Attacks/Techniques:
    *Spirit Sword: Kuwabara''s signature technique. He forms a sword out of his own spirit energy. He
    can use to strike his foes and repel enemy attacks. He can also manipulate his energy to extend the
    spirit sword which enables him to propel himself among other things. He''s also been shown to use
    it to make works of art such as the "Spirit Sword Monster Beast Donut." He was also shown to be capable
    of creating two Spirit Swords during his training with Hiei and Kurama while prepping for the Dark
    Tournament. *Spiritual Strike: Kuwabara eventually learns how to channel his Spirit Sword in a way
    where it functions like a whip. He used it to counter Rinku''s Yo Yos as well as retrieve his Sword
    of Trials from Elder Toguro. *Spirit Sword Shards: Kuwabara creates multiple throwing knives made
    of spirit energy that scatter in multiple directions similar to Yusuke''s Spirit Guns. He once used
    this technique against Elder Toguro. *Spirit Flyswatter: Translated as Giant Spirit Energy Staff,
    using the The Trial Sword, translates as Sword of Trials, he briefly received from Suzuka, Kuwabara
    was able to form his Spirit Sword into a more racket like shape. This significantly increased its
    power and grant it the area of effect required to cover Elder Toguro''s entire body. However, it did
    not finish him. *Dimension Sword: The most powerful version of Kuwabara''s Spirit Sword. Upon his
    full tapped out power''s awakening, he gains the ability to tear apart pocket dimensions, psychic
    territories, and cut through spatial barriers. This includes the Kekkai barrier used to prevent stronger
    demons from leaving Makai. He can also use it to slice distances in half later on, basically creating
    teleportation portals in the process. ==Notable Matchups== Victories: Jaune Arc (RWBY) Jaune''s Profile
    (Speed Equalized, 8-C versions used) Losses: Inconclusive: Vanilla Ice (JoJo''s Bizarre Adventure)
    Vanilla''s profile (Speed Equalized, Both Bloodlusted) {{Discussions}} Category:Characters Category:Yu
    Yu Hakusho Category:Sword Users Category:Anime Characters Category:Manga Characters Category:Protagonists
    Category:Male Characters Category:Good Characters Category:Teenagers Category:Heroes Category:Telepaths
    Category:Enhanced Senses Users Category:Precognition Users Category:Martial Artists Category:Dual
    Wielders Category:Chi Users Category:Energy Users Category:Energy Weapon Users Category:Space Users
    Category:Portal Users Category:Astral Projection Users Category:Weapon Creation Users Category:Aura
    Users Category:Rage Users Category:Statistics Amplification Users Category:Durability Negation Users
    Category:Accelerated Development Users Category:Extrasensory Perception Users Category:Non-Physical
    Interaction Users Category:Delinquents'
  source_ids: *id003
  decisive: false
  status: unverified
