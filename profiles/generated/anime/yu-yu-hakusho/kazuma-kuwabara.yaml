weaknesses:
- id: weaknesses-kuwabara-is-a-bit-too-straightforward-as-a-fighter-and-can-be-a-bit-d
  name: 'Kuwabara is a bit too straightforward as a fighter and can be a bit dumb
    sometimes. Notable Attacks/Techniques: *Spirit'
  description: 'Kuwabara is a bit too straightforward as a fighter and can be a bit
    dumb sometimes. Notable Attacks/Techniques: *Spirit Sword: Kuwabara''s signature
    technique. He forms a sword out of his own spirit energy. He can use to strike
    his foes and repel enemy attacks. He can also manipulate his energy to extend
    the spirit sword which enables him to propel himself among other things. He''s
    also been shown to use it to make works of art such as the "Spirit Sword Monster
    Beast Donut." He was also shown to be capable of creating two Spirit Swords during
    his training with Hiei and Kurama while prepping for the Dark Tournament. *Spiritual
    Strike: Kuwabara eventually learns how to channel his Spirit Sword in a way where
    it functions like a whip. He used it to counter Rinku''s Yo Yos as well as retrieve
    his Sword of Trials from Elder Toguro. *Spirit Sword Shards: Kuwabara creates
    multiple throwing knives made of spirit energy that scatter in multiple directions
    similar to Yusuke''s Spirit Guns. He once used this technique against Elder Toguro.
    *Spirit Flyswatter: Translated as Giant Spirit Energy Staff'
  source_ids: *id002
