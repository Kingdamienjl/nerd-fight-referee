    Attacks/Techniques: *Spirit Sword: Kuwabara''s signature technique. He forms a sword out of his own
    spirit energy. He can use to strike his foes and repel enemy attacks. He can also manipulate his energy
    to extend the spirit sword which enables him to propel himself among other things. He''s also been
    shown to use it to make works of art such as the "Spirit Sword Monster Beast Donut." He was also shown
    to be capable of creating two Spirit Swords during his training with Hiei and Kurama while prepping
