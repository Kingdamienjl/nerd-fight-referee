- id: claim-weaknesses-e27c097d
  section: weaknesses
  axis: weakness
  text: 'His regeneration and immortality will be severely weakened if he leaves Earth. Notable Attacks/Techniques:
    *Hakkei Martial art: It is an attack on pressure points and meridians in some styles of Chinese martial
    arts used which is said to incapacitate or sometimes cause a delayed or even immediate death to an
    opponent. The points of attack used in hakkei correspond to the same locations as acupuncture points
    and other Chinese healing arts. A practitioner of hakkei is supposedly capable of inflicting serious
    harm to an individual by disrupting their chi or energy flow with their own, causing injury or death.
    *Master Swordsmanship Specialist: Due to his identity of being an evil persona of Shouyou, Utsuro
    is an expert at swords as he was able to take on Sougo, Nobume, and Kagura all at the same time. Utsuro
    stated that Gintoki had fought against his sword style before and claimed that Gintoki could not beat
    his style since he never did it before. *Master Hand-to-Hand Combat: He is also very adept in hand-to-hand
    combat as he used the same open-palm strikes as Oboro against Gintoki and Sougo to cause serious damage
    to their bodies. *Physical Attributes: Utsuro was shown to have great physical strength, speed, agility,
    senses, and reflexes. Due to his identity of being an evil persona of Shouyou, Utsuro possesses even
    greater strength and physical attributes. *Immortality: Affected by the power of Altana /Ryumyaku,
    Utsuro is an absolute immortal; unable to die, age, rot, immune to all illnesses, diseases, disorder,
    poisons, toxins, spells, and will rapidly heal/regenerate from any and all injuries no matter how
    destructive and be restored to perfect health and condition. He can completely and perfectly heal
    and regenerate from all wounds, including lost limbs, lost organs, decapitation, even complete incineration
    and cannot be killed: as shown when he was forced to be executed by Gintoki and had his body burned,
    he came back to life after being beheaded, and incinerated. He can also concentrate the Altana somewhere
    on his body, if he loses such part (as an arm for example), he is able to regenerate from that piece.
    ==Notable Matchups== Victories: Losses: Inconclusive: {{Discussions}} Category:Characters Category:Gintama
    Category:Humans Category:Evil Characters Category:Villains Category:Immortals Category:Male Characters
    Category:Manga Characters Category:Regeneration Users Category:Weapon Masters Category:Martial Artists
    Category:Sword Users Category:Power Bestowal Users Category:Mind Users Category:Anime Characters Category:Antagonists
    Category:Primary Antagonists Category:Samurai Category:Leaders Category:Multiple Selves Users Category:Durability
    Negation Users Category:Aura Users Category:Paralysis Users Category:Air Users Category:Extrasensory
    Perception Users Category:Pressure Point Users Category:Absorption Users Category:Enhanced Senses
    Users Category:Resurrection Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-42727fcc
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Immortality (Types 1, 2, 3, 4, 6 and 8; Reliant on Altana),
    Self-Sustenance (Type 2), Regeneration (Mid-High; Came back after being completely incinerated many
    times, likely one of them being turned into ashes, possibly Low-Godly; Stated to be able to recreate
    his body as much as he wants by absorbing the Altana of Earth), Enormous Pain Tolerance, Master Swordsmanship,
    Master Hand-to-Hand Combatant, Hakkei Martial Artist, Power Bestowal (Able to grant immortality),
    Mind Manipulation, Corruption (Type 1) and Possession (Utsuro's blood also contain a piece of his
    consciousness, enabling him to possess and control anyone who has taken it), Aura, Paralysis Inducement
    (The fight between him and Umibouzu made Abuto paralyzed, unable to move, while totally not focusing
    on him at all), Air Manipulation (Able to create shockwaves), Extrasensory Perception (Able to locate
    anyone who has even a single speck of fear to him), Multiple Selves (Type 1 and 2), Pressure Points,
    Durability Negation, Absorption (Absorbed planet's energy, granting him Immortality. He can absorb
    as much energy as he pleases, and recreate his body at will), Enhanced Senses (Experienced with having
    his eyes shut and able to adapt to being in a cell of complete darkness for a decade, able to sense
    other people while blinded), Resurrection (Resurrected after the events of the Silver Soul Arc, reborn
    as a baby. Not combat applicable), Resistance to Enhanced Senses, Precognition, Clairvoyance (Pluto
    couldn't read his attacks and mind), Disease Manipulation (Forests overflowing with Altana were able
    to cure any disease), Regeneration Negation (When on earth, even though he was cut by an Altana Sword,
    his regeneration was not negated), Biological Manipulation and Poison Manipulation
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
