    incinerated many times, likely one of them being turned into ashes) * Explosion
    Manipulation (With explosives) * Pressure Points, Poison Manipulation and Paralysis
    Inducement (Via needles - He attacks the Pressure Points of the human body to
    paralyse them and cause them to bleed profusely) * Time Manipulation, Time Travel
    (With Aliens clock which can go forward/backwards and stop in time, Travel back
    in time to change some events) |-|Resistances= Resistance to *Poison Manipulation
    and Paralysis Inducement (Able to move after being hit by Oboro''s needles) *Pain
    (Has ungodly pain tolerance capable of fighting despite being full of injuries
    and broken bones and tired seen in his fight against Hosen, Kamui, Utsuro, Takasugi
    and in wars) *Analytical Prediction (Bansai couldn''t keep up with Gintoki because
    he couldn''t see his sword or rhymth) *Fear Manipulation (Batou states that breakfast
    and death is the same for Gintoki and as he was about to cut Gintoki''s head he
    was thinking of what to eat in the morning for breakfast) *Plot Manipulation (Resisted
    Kintoki''s self-destruction, which would destroy the settings of Gintama to turn
    into romance manga) *Mind Manipulation (Wasn''t affected by the mindhax of Kintoki,
    which affected the entire Gintama setting) *Precognition, Telepathy, Clairvoyance
    and Enhanced Senses (Pluto couldn''t read his movements, Even when he says he
    can read minds, Pluto possesses an eye that can see through his opponent''s mind,
    intention, movement, and even past)'
