- id: claim-weaknesses-b66d76f2
  section: weaknesses
  axis: weakness
  text: 'The memories of his sensei Shouyou Yoshida Feats: * Master Swordsmanship: He''s an excellent
    swordsman, being a perfect equal to Gin despite the other''s own capabilities and skill. Although
    he usually strays from battling, he can take on armies by himself and can win battles without wounds.
    Charisma: Most of Takasugi''s subordinates, including his closest, seem to have been won over by Takasugi''s
    words, not actions. He recruited most of his men by finding those with similar ideas to him and brought
    up his goal of destruction to them, promising to assist if they desired the same. Despite how outlandish
    the goal is, there is not a single person who doubts his power. ==Notable Matchups== Victories: Losses:
