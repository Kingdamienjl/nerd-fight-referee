- id: claim-weaknesses-b8bb21a0
  section: weaknesses
  axis: weakness
  text: 'Like all Cursed Spirits, he is weak to Positive Cursed Energy Notable Attacks/Techniques *Cursed
    Cockroaches: Kurourushi could produce and control countless swarms of real cockroaches reinforced
    by its cursed energy. These man-eating cockroaches could strip all the flesh off a group of humans
    in seconds. This feeds Kurourushi''s endless appetite and stimulates parthenogenesis. A single cockroach
    is not a real threat but a full swarm can be a serious issue even to a jujutsu sorcerer. **: A cursed
    technique that conjures flying insect curses that carry large sacs filled with a liquid substance
    that gets released when destroyed. The substance gets into the target''s eyes to impair their vision.
    *: Flesh devoured by the cursed cockroaches stimulated Kurourushi''s parthenogenesis process, granting
    it the ability to produce more cockroaches. Additionally, Kurourushi used this to reproduce an identical
    yet entirely new cursed spirit offspring. In order to preserve Kurourushi''s existence, the cursed
    energy from the parent was passed on to the child when it died.'
  source_ids: *id003
  decisive: false
  status: unverified
