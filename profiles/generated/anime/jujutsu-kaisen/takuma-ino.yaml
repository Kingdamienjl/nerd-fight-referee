- id: claim-weaknesses-3656add9
  section: weaknesses
  axis: weakness
  text: 'If Ino''s mask is removed, his cursed technique becomes undone and there are severe after-effects
    after Kirin''s pain sedation wears off. Notable Attacks and Techniques: *: By covering his face with
    a mask, Ino becomes a medium that can summon and channel the abilities of four Auspicious Beasts.
    **: Launches the horn of the one-horned sheep Kaichi. After being launched, the horn follows the target.
    **: Envelops the user with cursed energy water and uses its elasticity for defense. When used on the
    feet, this ability allows for unique footwork. **: Secretes a drug directly into the sorcerer''s brain,
    blocking the sensation of pain. **: Nobody has ever seen Ryu and lived to tell the tale (According
    to Ino)'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
