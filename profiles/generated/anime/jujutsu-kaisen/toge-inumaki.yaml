- id: claim-weaknesses-3c7c7249
  section: weaknesses
  axis: weakness
  text: "Can only communicate through rice ball ingredients.Jujutsu Kaisen: Volume 0, Chapter 1 His throat\
    \ gets damaged from extended use of his technique, especially on stronger opponents. Notable Attacks/Techniques:\
    \ Cursed Speech: Toge possesses the \"Snake & Fangs\" seal of the Inumaki clan on his tongue and around\
    \ both sides of his mouth. This allows Toge to infuse his words with cursed energy to improve the\
    \ spirit of his commands, forcing all those who hear it to obey. This power can target all livings.\
    \ The more demanding is the command, the more of a toll it pays on Toge's body. Weaker curses can\
    \ be exorcised with powerful commands without backlash, but even less powerful words will consume\
    \ more energy and stamina when used against opponents with more cursed energy than Toge. Communication\
    \ devices and voice amplifiers, such as cellphones and bullhorns, do not disrupt Toge's technique,\
    \ allowing him to project his words and their effects over a longer distance if need be. Some of the\
    \ Commands: 00002-022.webp|\"Explode\" 0002-026.webp|\"Get twisted\" 0002-038.webp|\"Get crushed\"\
    \ 0003-039.webp|\"Crumble away\" 0017-021.webp|\"Don't move\" 0043-014.webp|\"Sleep\" 0043-013.webp|\"\
    Return\" 0046-017.webp|\"Blast away\" *\"Explode\" causes Toge's target to violently explode. He used\
    \ it to effortlessly exorcise a swarm of weak curses. *\"Get Twisted\" or \"Twist\" forces an appendage\
    \ of a curse to twist to the point of complete disfigurement. He used this in an attempt to exorcise\
    \ a Grade 2 curse, though it avoids fatal damage. *\"Get Crushed\" causes the target to implode until\
    \ they're flattened out. Toge used this to finish off the aforementioned Grade 2. *\"Crumble Away\"\
    \ or \"Plummet\" creates a small field of intensely heavy gravity that crushes the target until they're\
    \ violently sent underground. Toge used this in an attempt to kill Suguru Geto. *\"Don't Move\" or\
    \ \"Stop\" completely immobilizes Toge's target or any of their attacks. He first used \"Don't Move\"\
    \ to stop Aoi Todo and then repeatedly commanded Hanami to stop in their fight. *\"Sleep\" instantly\
    \ sends whoever hears the command into a deep sleep. Toge used this to incapacitate Kasumi Miwa over\
    \ the phone. *\"Return\" can forcibly dispel a Shikigami. He used this command to return Megumi's\
    \ Divine Dog after using it for tracking purposes. *\"Run Away\" forces Inumaki's target to flee the\
    \ area. He used this to command his allies to run away from Hanami's approach. *\"Blast Away\" is\
    \ a powerful command that creates an explosive impact of great concussive force strong enough to send\
    \ a special grade curse crashing up the side of a temple. *\u201CDie\u201D is a powerful command which\
    \ steals the life of the target ==Notable Matchups== Victories: Losses: Inconclusive: ==References==\
    \ {{scroll box|content={{Reflist|2}}}} ==Notes== {{Discussions|Toge Inumaki}} Category:Sound Users\
    \ Category:Explosion Users Category:Paralysis Users Category:Sleep Users Category:Body Puppetry Users\
    \ Category:Durability Negation Users Category:Sorcerers Category:Jujutsu Kaisen Category:Characters"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-ca7a94e5
  section: abilities
  axis: hax
  text: 'Base= *Cursed Energy Manipulation (Basic Sorcerer: He is Semi-Grade 1 SorcererJujutsu Kaisen,
    Chapter 38) *Supernatural Willpower (Has strong will to push his limits beyond his normal capabilities
    & fight against opponents who are massively stronger than him and has no chance of victory.Jujutsu
    Kaisen, Chapter 46) *Martial Arts & Acrobatics (Jujutsu Sorcerer are trained with Martial ArtsJujutsu
    Kaisen: Fanbook & can perform acrobatic moments. Shown hereJujutsu Kaisen: Volume 0, Chapter 2 & hereJujutsu
    Kaisen, Chapter 44) |-|Cursed Speech= *Sound Manipulation (By imbuing curse energy in sound, Toge
    is able to curse his words and create cursed words to enforce certain commands such asJujutsu Kaisen:
    Volume 0, Chapter 2) *Power Nullification (Can forcibly dispel Megumi Shikigami with "return"Jujutsu
    Kaisen, Chapter 43) *Explosion Manipulation (As shown hereJujutsu Kaisen: Volume 0, Chapter 2) *Paralysis
    Inducement (Can force people to stop movingJujutsu Kaisen, Chapter 17) *Sleep Manipulation (Can put
    people to sleepJujutsu Kaisen, Chapter 43) *Body Puppetry (Can force people to moveJujutsu Kaisen,
    Chapter 44) *Shockwave Generation (Can blast people away by saying "blast away") *Likely Gravity Manipulation
    (Can crush people by saying "get crushed"Jujutsu Kaisen: Volume 0, Chapter 4) *Likely Life Stealing
    (Like Yuta Toge should be able to make targets explode by saying "die" stealing the life from the
    target.Jujutsu Kaisen: Volume 0, Chapter 4) *Likely Durability Negation (Words such as "die", "get
    crushed", "get twisted", and "crumble/plummet" have been shown to ignore conventional durability.)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
