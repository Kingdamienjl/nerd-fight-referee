  text: '{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|Volume 0 ▾= {{#tag:tabber|
    {{!}}-{{!}}Base= *Cursed Energy Manipulation (Advanced Sorcerer; Noted to have
    grown significantly in terms of Jujutsu usage in less than a year''s time, being
    able to heal others with Reversed Curse Technique, utilizing Rika''s inconceivably
    large reserve of Cursed Energy, and having high-grade reinforcement) **Regeneration
    & Healing (Low-Mid; Capable of utilizing Reverse Cursed Technique, and restored
    Maki''s mangled legJujutsu Kaisen 0, Chapter 4: "Bright Darkness") **Power Mimicry
    (Yuta''s Cursed Technique Copy is the ability to copy other individuals'' Innate
    Techniques by Rika consuming a part of the users'' bodyJujutsu Kaisen, Chapter
    180: "Sendai Colony, Part 7" along with how valuable that part of the body consumed
    is to its user.Jujutsu Kaisen, Chapter 267: "Inhuman Makyo Shinjuku Showdown,
    Part 38") **Enhanced Senses (Yuta and Rika''s vision are shared, allowing them
    to see what each other seeJujutsu Kaisen, Official Fanbook) **Energy Projection
    (Can release a burst of Cursed Energy) **Black Flash (Utilized Black Flash against
    Suguru Geto) **Corruption (Type 2, Non-Combat Applicable; At first it was thought
    that Rika had cursed Yuta, but after further investigation, it was revealed that
    Yuta had cursed Rika, turning her into a Cursed Spirit after death, and corrupting
    her soul, creating a master and servant bond) *Weapon Mastery (Trained by Maki
    Zenin in sword fighting, and learned how to imbue Cursed Energy in a sword) *Acrobatics
    (Hypermobility; Showcases incredible dexterity in his movements.) *Involuntary
    Summoning (Rika will manifest whenever Yuta is threatened) **Cursed Energy Manipulation
    (Cursed Spirit) **Dimensional Storage (Able to store objects in sacs) **Creation
    (Created a microphone for Yuta) **Flight (Shown to always be levitating and can
    fly freely) {{!}}-{{!}}Copied'
