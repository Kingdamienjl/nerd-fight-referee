  striking_strength:
    text: '**Spatial Manipulation (Limitless grants the user control over space at
      an atomic level, requiring precise control of Cursed Energy.) ***Teleportation
      via Spatial Compression (Is implied to have achieved a degree of teleportation,Jujutsu
      Kaisen, Chapter 76: "Premature Death" which functions by compressing the space
      between two coordinatesJujutsu Kaisen, Chapter 226: "Inhuman Makyo Shinjuku
      Showdown, Part 4") ***Forcefield Creation & Mathematics Manipulation (By manifesting
      the naturally occurring infinity into reality,Jujutsu Kaisen, Chapter 14: "Assault"
      Gojo can converge space as an infinite series of fractions, causing objects
      that approach him to slow down and never reach their target.Jujutsu Kaisen,
      Chapter 69: "Hidden Inventory, Part 5" This idea of infinity is taken from Zeno''s
      paradoxes, particularly the Achilles paradox. Akin to the way Achilles will
      never catch the tortoise due to the potential, infinite amounts of finite space
      separating them, or how the real number one will never touch the actual number
      two due to the infinite amount of fractions that separate them, the opponent
      will never touch Satoru due to the infinity between them) ***Physics Manipulation
      & Gravity Manipulation (Cursed Technique Lapse: Blue is the byproduct of Gojo
      amplifying the amount of Cursed Energy poured into Limitless, thus bringing
      negative numbers and negative distance into reality, forcing real space to compensate
      and fill in the area, and drawing everything toward the impossibility like a
      force of attraction) ****Damage Boost (Performing the incantations of a technique
      raises its outputJujutsu Kaisen, Chapter 235: "Inhuman Makyo Shinjuku Showdown,
      Part 13") **Flight (Shown to be able to fly, likely through an application of
      Limitless) **Free Movement (Water Walking; Satoru can walk on water and even
      extend the ability to those he chooses,Jujutsu Kaisen, Chapter 15: "Domain"
      likely through Infinity) **Mathematics Manipulation & Physics Manipulation (By
      pouring positive energy generated by the Reverse Cursed Technique into the Limitless
      technique, the divergence of Infinity is activated and, in turn, causes an ability
      that attracts to become one that violently repels, Cursed Technique Reversal:
      Red.Jujutsu Kaisen, Chapter 74: "Hidden Inventory, Part 10" By combining the
      polar opposite infinities of Red and Blue,Jujutsu Kaisen, Chapter 75: "Hidden
      Inventory, Part 11" Gojo can create Hollow Technique: Purple,an imaginary mass
      which he fires at his opponents.) ***Energy Projection (Cursed Technique Reversal:
      Red can be fired as a beam of energy) ***Shockwave Generation (Satoru can cast
      Red in the form of a shockwave) ***Damage Boost (Red can output twice the normal
      amount of Cursed Energy and deal more damage than what Gojo does normallyJujutsu
      Kaisen, Chapter 84: "The Shibuya Incident, Part 2") *Unlimited Void: **Domain
      Expansion (Type 1), which has Mind Manipulation, Soul Manipulation, Perception
      Manipulation, Information Manipulation (Type 1) & Paralysis Inducement (Unlimited
      Void is a metaphysical territory that forces the targets to feel everything,
      suppressing their thought process and actions altogether by inputting an infinite
      amount of information into them. This effect is powerful enough to put a high-level
      cursed spirit like Jogo into a catatonic state, unable to process anything,
      and render regular humans unconscious, requiring two months of rehabilitation
      to heal from, despite only being subjected to only 0.2 seconds worth of the
      information stream.Jujutsu Kaisen, Chapter 89: "The Shibuya Incident, Part 7"
      Unlimited Void can also affect soulsJujutsu Kaisen, Chapter 230: "Inhuman Makyo
      Shinjuku Showdown, Part 8") }}}} }} {{Border|Visible=No|Content= |-|Volume 0'
