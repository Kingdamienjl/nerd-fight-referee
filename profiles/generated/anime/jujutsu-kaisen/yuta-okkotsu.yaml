    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Gifted (A special Grade Sorcerer, Yuta grasped the basics of Jujutsu with
      only several months experience, and even advanced techniques, such as Reversed
      Curse Technique, in the heat of battle against a more tenured opponent in Suguru
      Geto. He was also trained in kenjutsu by Maki Zenin, executing it against other
      fighters superbly. Three months after the Night Parade of a Hundred Demons,
      he became second only to Satoru Gojo in Jujutsu, mastering a Domain Expansion,
      and demonstrated much more refined usage of Cursed Energy) Standard Tactics:
      Given Yuta''s many abilities he tends to go with physical combat, relying on
      his physical prowess in swordplay, and hand-to-hand combat in order to attack
      his foes. Rika will often accompany Yuta in her Partial Manifestation, effectively
      making the fight now a two-on-one, shamelessly jumping the opponent with a relentless
      assault. When forced onto his backend, or when fighting a sufficiently powerful
      enough opponent, Yuta will place a ring onto his finger, allowing for Rika''s
      Full Manifestation. Yuta''s first move after summoning Rika fully is usually
      Cursed Speech, often the command "Don''t Move" after concealing his mouth and
      sending Rika as a diversion, to force his opponents to either take the time
      to cover their ears at the last second, leaving them open for a physical barrage.
      Furthermore, in this five minute state, he is able to use his Domain.'
    source_ids: *id002
    confidence: 0.95
