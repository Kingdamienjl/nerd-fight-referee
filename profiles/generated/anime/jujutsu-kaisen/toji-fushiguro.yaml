- id: claim-powers-and-abilities-8048cc7e
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics (Toji''s Heavenly Restriction reduced his curse energy to
    zero, something never seen in the Jujutsu world and allowed him to reach a height greater than sorcerers
    own superhuman physical strength to the point he was deemed superhuman compared to sorcerersJujutsu
    Kaisen: Chapter 77) **Enhanced Senses & Analytical Prediction (His regular senses are sharp to the
    point he can pick up on human odors and footprints.Jujutsu Kaisen: Chapter 73 His eyes should also
    be similar to Maki''s who can see the differences in temperature and density of air, she is also able
    to predict how one will move based off thisJujutsu Kaisen: Chapter 197. Maki was able to out-predictJujutsu
    Kaisen: Chapter 151 Naoya) ***Extrasensory Perception (Able to see curses which are invisible to the
    naked eye) **Acrobatics (Hypermobility & Self-Momentum; Similar to Maki who can react mid airJujutsu
    Kaisen: Chapter 197) **Free Movement (Water Walking; Ran across water like it was normalJujutsu Kaisen:
    Chapter 110) **Likely Regeneration (At most Low-Mid; Should be able to heal internal damage similar
    to MakiJujutsu Kaisen: Chapter 195) *Stealth Mastery (Both Maki and Toji can use their lack of cursed
    energy to move around undetectedJujutsu Kaisen: Chapter 71, something which Kenjaku acknowledgedJujutsu
    Kaisen: Chapter 239. Toji also, professionally is a for hire assassin and notes how prior to Satoru
    Gojo, no one ever was aware of his presenceJujutsu Kaisen: Chapter 71 and refers to himself as the
    invisible manJujutsu Kaisen: Chapter 73 having infiltrated the JJH) *Skilled Hand-to-Hand Combatant
    *Acausality (Type 4; Having escaped from Cursed Energy completely thanks to his Heavenly Restriction,
    Toji was deemed an anomaly.Jujutsu Kaisen: Chapter 145 Through the power of restriction, he had escaped
    fate which allowed him to break Tengen, the Star Plasma Vessel and the Six Eyes from their destinies
    with them being connected by fate) *Information Analysis (Comparable to Heavenly Restricted Maki whose
    categorical distinctions between stimuli types stopped existing, and extended her sensory range vastly
    beyond her bodies'' natural range to sense through her environment, effectively "seeing the souls
    of inanimate objects" after her enlightenment) *Preparation (Has access to the Zen''in Clan''s cursed
    tools storage. Fights more effectively when given the time to strategize against an opponent) *Inventory
    Curse: Dimensional Storage (The Inventory Curse is capable of storing objects within itself such as
    weapons, other curses, and people) **Limited Insect Manipulation & Summoning (Via Flyheads) **Weapon
    Mastery (Swordsman, Three Section Staffs User, Chain User) ***Cursed Tools: Limited Cursed Energy
    Manipulation (Cursed Tools are capable of attacking and killing cursed spirits who are the manifested
    forms of images, emotions, and information stemming from collective human awareness and perceptions
    related to various phenomena) ***Inverted Spear of Heaven: Power Nullification (The Inverted Spear
    of Heaven forcibly stops Cursed TechniquesJujutsu Kaisen: Chapter 71) ***Soul Split Katana: Soul Manipulation
    & Durability Negation (The Soul Split Katana bypasses the toughness of substances to attack the soul,
    even being done to inanimate objectsJujutsu Kaisen: Chapter 198) ***Chain of a Thousand Miles: Limited
    Size Manipulation (The Chain of a Thousand Miles can keep extending so long as the other end isn''t
    seen) ***Playful Cloud: Statistics Amplification (The Playful Cloud''s power varies based on the userJujutsu
    Kaisen Chapter 110) Puppet of Carnage: *Unconventional Instinctive Action (While in this form, Toji
    fights instinctually, attacking the strongest around ignoring anyone weakerJujutsu Kaisen: Chapter
    110) |-|Resistances= Resistance to: *Cursed Energy Manipulation (Basic Sorcerer Resistances; Toji''s
    body has built up a natural resistance to cursesJujutsu Kaisen: Chapter 77 due to Heavenly Restriction)
    *Extreme Heat (Heavenly Restriction can allow Maki to resist the fire from Jogo due to inborn physical
    toughnessJujutsu Kaisen: Chapter 144) *Limited Analytical Prediction & Extrasensory Perception (Toji
    has zero Cursed Energy therefore making it harder to read his moves in combat as we see with GojoJujutsu
    Kaisen: Chapter 71) *Limited Homing Attack & Forcefield Creation (Energy Sensing; Due to having no
    Cursed Energy, Barrier Techniques treat Toji as a building allowing him to ignore a Domain Expansion''s
    homing capability and can''t be trapped inside one unless he consentsJujutsu Kaisen: Chapter 198)
    *Soul Manipulation & Possession (Toji''s body information is powerful enough that it overwrote the
    soul of another and allowed him control insteadJujutsu Kaisen: Chapter 98) *Information Analysis (People
    with zero Cursed Energy cannot be targeted by the sure-hit of a Domain Expansion)'
