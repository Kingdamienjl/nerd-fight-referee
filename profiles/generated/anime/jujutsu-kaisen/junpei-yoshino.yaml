- id: claim-weaknesses-6d5d3b89
  section: weaknesses
  axis: weakness
  text: "Junpei Yoshino faced significant challenges in his life, including struggles with his emotions\
    \ and the consequences of certain events. Junpei's dejection allowed Mahito to manipulate him, pushing\
    \ him from indifference to hate and revenge. This blinded Junpei to Mahito's true nature. Notable\
    \ Attacks and Techniques: *: A large jelly-fish like shikigami capable of paralyzing targets with\
    \ a unique poison that covers the skin in black spots that burn the victim as if they were being stung.\
    \ Moon Dregs also has a pair of spiked stingers that can pierce through flesh. When faced with an\
    \ adversary capable of neutralizing the poison, the shikigami acts as a shield that protects the user\
    \ from physical hits and can attack using sharp spikes. It\u2019s possible to adjust the size of the\
    \ shikigami and the potency of the poison, so that it terrorizes the target as it slowly spreads through\
    \ their body."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
