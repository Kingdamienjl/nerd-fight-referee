- id: claim-powers-and-abilities-348e133a
  section: abilities
  axis: hax
  text: '*Cursed Energy Manipulation (Cursed Spirit) **Domain Expansion (Type 1) (Hanami possess the ability
    to cast Domain Expansion. The cannot-miss ability of the domain is the beam that is charged with Hanami''s
    left armJujutsu Kaisen Chapter 51) **Plant Manipulation & Illusion Creation (Hanami''s Technique allows
    them to manifest the illusions of cursed plants into reality. While they appear to be manipulating
    Cursed Energy, they''re actually creating the Cursed plants they control with Cursed Energy. Any plant
    or wood attack can be erased from reality just as quickly as it manifested. This ability arms Hanami
    with a wide variety of cursed plants, each with different capabilities. These include wooded skewers
    that can pierce sorcerers, branches that can bind them, roots that emerge from the ground, etc.Jujutsu
    Kaisen Chapter 49) **Energy Absorption (Can launch cursed buds that feeds on the energy of whoever
    it attaches toJujutsu Kaisen Chapter 47Jujutsu Kaisen Chapter 51) **Life Absorption & Energy Projection
    (Their left arm can siphon the life-force of nearby plants, converting them into Cursed Energy, allowing
    them to release a massive blast of energyJujutsu Kaisen Chapter 51) **Power Nullification (Domain
    Amplification neutralizes all cursed techniques it comes into contact with; however, rather than remaining
    in a designated space, it covers the user like an auraJujutsu Kaisen Chapter 84Jujutsu Kaisen Chapter
    171Jujutsu Kaisen Chapter 225) **Mind Manipulation (Can create a circle of flowers around their opponents
    with a curse that can seemingly take the will of fighting from the opponentsJujutsu Kaisen Chapter
    15Jujutsu Kaisen Chapter 49) **Stealth Mastery (Capable of erasing their presenceJujutsu Kaisen Chapter
    15) *Skilled Hand-to-Hand Combatant (Can keep up with Todo and Yuji and keep fighting them in close
    combatJujutsu Kaisen Chapter 51)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
