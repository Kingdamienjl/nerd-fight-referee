- id: claim-weaknesses-0c52b743
  section: weaknesses
  axis: weakness
  text: 'Charles''s ability to see the future relies on visual confirmation with his eyes. To counter
    this, opponents can exploit his vulnerability by repeatedly attacking his blind spots, preventing
    him from confirming and utilizing his foresight effectively. Notable Attacks and Techniques: *: Charles
    possesses a cursed tool called G Warstaff, a spear with a pen-shaped tip. By drawing his opponent''s
    blood into the pen, he fulfills the condition for "ink." Charles can then mark his opponents with
    a manga panel, allowing him to peer into their near future, starting with one second. As G Warstaff
    collects more blood and fills with ink, Charles gains the ability to see further into the future.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
