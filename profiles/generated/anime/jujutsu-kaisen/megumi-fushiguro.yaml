- id: claim-powers-and-abilities-5f5b9ba7
  section: abilities
  axis: hax
  text: '*Cursed Energy Manipulation (Advanced Sorcerer) **Domain Expansion (Type
    1), which has Duplication & Enhanced Summoning (Chimera Shadow Garden allows him
    to conjure the various kinds of Shikigami Megumi has at his disposal to an even
    greater effect. This would also allow him to mask himself within the shadows and
    and perform sneak attacks,Jujutsu Kaisen Chapter 58 as well as being able to use
    those shadows to make duplicates of himself and their Shikigami.Jujutsu Kaisen
    Chapter 171 As an added bonus, the user''s potential is expanded to 120%Jujutsu
    Kaisen Chapter 171) *Skilled Hand-to-Hand Combatant *Darkness Manipulation & Summoning
    (The Ten Shadows Technique allows Megumi to summon Shikigami using shadows as
    an intermediary and he is able to half summon them as well. Megumi is also capable
    of utilizing the darkness in various ways such as hiding in his opponents shadow
    in order to perform a sneak attack, hiding in the shadows himself in order to
    avoid attacks, or drag other people into the shadows in order to stun and immobilize
    their movements) **Nue: Flight, Paralysis Inducement, & Electricity Manipulation
    (Is able to fly and generate lightning. Nue''s electrical wings can also induce
    paralysisJujutsu Kaisen Chapter 36) **Max Elephant: Water Manipulation (Is able
    to spew mass amounts of water from its trunkJujutsu Kaisen Chapter 44) **Mahoraga:
    Adaptation & Reactive Evolution (It only needs to experience a phenomenon a single
    time for its adaptation process to begin. Repeated exposure to the phenomenon
    shortens this adaptation process considerably so. Mahoraga''s evolution never
    fully stops even after fully adapting to the technique already as it will always
    continue to develop new adaptations, obtaining more ways to bypass the technique)
    **Fusionism: (Megumi is able to combine his Ten Shadows Shikigami together to
    conjure up beings such as The Well''s Unknown AbyssJujutsu Kaisen Chapter 17)
    *Weapon Mastery (Proficient user of Tonfas, competent user of swords)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
