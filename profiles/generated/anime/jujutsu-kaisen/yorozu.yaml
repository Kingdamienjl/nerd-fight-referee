- id: claim-weaknesses-19176ff4
  section: weaknesses
  axis: weakness
  text: 'Creating something from nothing uses a lot of cursed energy, making this technique energy-inefficient
    compared to other cursed techniques Notable Attacks and Techniques: * Binding Vows are contracts created
    through cursed energy that an individual can make with one''s self or another person. The act of abiding
    by the rules and restrictions agreed upon in these contracts can result in a greater power or the
    achievement of a goal, but breaking a binding vow has uncanny repercussions. Can make Pact with Sukuna
    for wedding him if he loses the fight. She also created a cursed tool with a binding vow for her life.
    *: Is a special type of cursed technique that takes cursed energy and reverses it into positive energy.
    It is a very complex technique and is mainly used to heal human bodies. *: "Yorozu Innate Technique"
    Depending on her familiarity and training, Yorozu could re-create any substance she recognized including
    one of Sukuna''s original Cursed Tools, the Kamutoke. **: Having constructed several kinds of combat
    equipment, Yorozu used her experience to develop a liquid metal as her primary weapon on her way to
    becoming a veteran sorcerer. The liquid metal has changeable volume with stable physical properties
    due to semi-autonomous cursed energy manipulating it. **: Yorozu used liquid metal to create flesh
    armor specialized in appropriating numerous insect bio functions. She saw a solution to her cursed
    technique''s weakness in the efficiency of insects. Yorozu deemed an insect''s carapace was the ultimate
    armor and the ideal subject for construction. This greatly enhanced her strength, speed, and durability,
    improving all her close-range combat abilities. She could also manage mid-range combat by continuing
    to control liquid metal outside the armor. **: Under normal circumstances, a perfect sphere is thought
    to be impossible to create. Yorozu was able to do so by shaping it from liquid metal. Shapes become
    more circular and have more points the more sides they have so a perfect sphere would have an infinite
    number of infinitely small points which would cause it to exert infinite pressure on any object that
    comes into contact with it, due to the infinitely small contact area, no matter how infinitesimal
    the amount of force applied is. It moved towards Yorozu''s target at a moderate speed and was sure
    to hit if she embedded the attack in her domain''s guaranteed hit. ** Yorozu''s domain is a mostly
    blank space, although with several oversized, organic structures floating within it that resemble
    the disembodied brains and ganglia of insects. The sure-hit effect of the domain applies to Yorozu''s
    constructed items, particularly her True Sphere, hence destroying anything caught in the domain instantly
    should Yorozu will it.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
