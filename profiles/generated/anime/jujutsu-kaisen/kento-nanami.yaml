  section: abilities
  axis: hax
  text: '*Cursed Energy Manipulation (Advanced Sorcerer - Is a Grade 1 Sorcerer) ** Black Flash (Has landed
    four consecutive Black Flashes) **Statistics Reduction & Limited Durability Negation (His Ratio Technique
    forcibly creates a weak point on a target, allowing him to cleave through weak opponents even with
    a dull machete and inflict significant damage on stronger opponents.Jujutsu Kaisen: Chapter 20 This
    technique is applicable on non-living objects tooJujutsu Kaisen, Chapter 23) **Limited Self-Sealing
    & Limited Statistics Amplification (His Overtime Binding Vow limits his output to 80-90% while on
    an 8 hour shift so that he can raise his output to 110-120% when working overtimeJujutsu Kaisen Official
    Fanbook) *Skilled Hand-to-Hand Combatant & Weapon Mastery (Nanami is capable of fighting unarmed and
    with his macheteJujutsu Kaisen: Volume 0) *Acrobatics (Can perform acrobatic maneuversJujutsu Kaisen:
    Chapter 107) *Supernatural Willpower (Capable of fighting at the verge of deathJujutsu Kaisen, Chapter
    120 after his body was stabbed several times, causing him to lose an eye before sustaining severe
    burn woundsJujutsu Kaisen, Chapter 108 Jujutsu Kaisen, Chapter 109 Jujutsu Kaisen, Chapter 111)'
  source_ids: *id003
