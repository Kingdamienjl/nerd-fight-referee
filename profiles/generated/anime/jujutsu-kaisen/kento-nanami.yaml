- id: claim-weaknesses-f70ef31d
  section: weaknesses
  axis: weakness
  text: "Using 100% of his power while on the clock limits him to 101% in Overtime. Notable Attacks and\
    \ Techniques: *{{Nihongo|Ratio Technique|{{Ruby|\u5341|\u3068\u304A}}{{Ruby|\u5283|\u304B\u304F}}{{Ruby|\u546A\
    |\u3058\u3085}}{{Ruby|\u6CD5|\u307B\u3046}}|T\u014Dkaku Juh\u014D}} Nanami's Innate Technique can\
    \ create a number line with 10 divisions on a target and forcibly create a weak spot at the ratio\
    \ point of seven to three. The target's lines don't have to match up with the target's length or wingspan.\
    \ Nanami can freely choose which part to divide, including the subjects, head, torso, arms, and legs.\
    \ This technique is also applicable to non-living objects. **{{Nihongo|Collapse|{{Ruby|\u74E6|\u304C\
    }}{{Ruby|\u843D|\u3089}}{{Ruby|\u74E6|\u304C}}{{Ruby|\u843D|\u3089}}|Garagara}}: An extension of the\
    \ Ratio Technique that creates a sizeable weak point in the surrounding environment, allowing Nanami\
    \ to destroy it with a single blow and channel cursed energy into the resulting rubble, turning it\
    \ into a weapon. *{{Nihongo|Showing One's Cards|{{Ruby|\u60C5|\u3058\u3087\u3046}}{{Ruby|\u5831|\u307B\
    \u3046}}\u306E{{Ruby|\u958B|\u304B\u3044}}{{Ruby|\u793A|\u3058}}|J\u014Dh\u014D no Kaiji}}: A Binding\
    \ Vow that increases the user's cursed energy output and effectiveness of their technique in exchange\
    \ for vocally divulging how their Cursed Technique functions. *{{Nihongo|Overtime|{{Ruby|\u6642|\u3058\
    }}{{Ruby|\u9593|\u304B\u3093}}{{Ruby|\u5916|\u304C\u3044}}{{Ruby|\u52B4|\u308D\u3046}}{{Ruby|\u50CD\
    |\u3069\u3046}}|Jikangair\u014Dd\u014D}}: Nanami's signature Binding Vow with himself. Nanami limits\
    \ the amount of Cursed Energy he can output when he's officially on the clock working an 8 hour shift\
    \ for Jujutsu High. Once he goes beyond his usual shift and overtime hours begin, Nanami's Cursed\
    \ Energy swells to a great degree and grants him a boost in fighting power. *{{Nihongo|Black Flash|{{Ruby|\u9ED2\
    |\u3053\u304F}}{{Ruby|\u9583|\u305B\u3093}}|Kokusen}}: A phenomenon that creates spatial distortion\
    \ when a user connects with an impact of Cursed Energy within 0.000001 seconds of a physical hit causing\
    \ their Cursed Energy to flash black and deal greater damage. Note: Even though it is stated several\
    \ times that the Black Flash raises the power of the attack by ^2.5. This is not consistent with the\
    \ verse. Many times several characters are able to resist a Black Flash, even if in theory the attack\
    \ is ^2.5 stronger. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{scroll\
    \ box|content={{Reflist|2}}}} {{discussions|Kento Nanami}} Category:Characters Category:Jujutsu Kaisen\
    \ Category:Anime Characters Category:Curse Users Category:Durability Negation Users Category:Energy\
    \ Users Category:Enhanced Senses Users Category:Humans Category:Male Characters Category:Manga Characters\
    \ Category:Martial Artists Category:Non-Physical Interaction Users Category:Statistics Amplification\
    \ Users Category:Weapon Masters"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
