- id: claim-weaknesses-68800354
  section: weaknesses
  axis: weakness
  text: 'After a Domain Expansion, Uro''s Innate Cursed Technique burns out and becomes harder to use
    for a short period of time. Notable Attacks and Techniques: *: Binding Vows are contracts created
    through cursed energy that an individual can make with one''s self or another person. The act of abiding
    by the rules and restrictions agreed upon in these contracts can result in a greater power or the
    achievement of a goal, but breaking a binding vow has uncanny repercussions. *: Takako''s unique cursed
    technique grants her control over the sky, turning it into a tangible surface for various applications.
    Apart from casual levitation and an alternative to clothing, she employs this ability strategically
    in battle. By distorting space similar to a lens, she can defensively alter the shape of opponent
    attacks. Notably, Takako can break the sky''s surface, likened to thin ice, to deliver impactful blows
    that bypass the opponent''s guard, causing substantial destruction. This versatile technique combines
    defensive maneuvers with powerful offensive strikes, showcasing Takako''s tactical prowess in combat.
    **: Takako Uro''s offensive technique involves striking the surface of the sky rather than directly
    targeting her opponent. By doing so, she can bypass the opponent''s guard and send them airborne.
    The Thin Ice Breaker represents an enhanced version of this tactic, where Takako not only hits the
    sky''s surface but shatters it, unleashing a powerful concussive force to blast her opponent. This
    strategic approach allows her to create a disruptive and impactful attack, exploiting the indirect
    nature of her cursed technique. **: Takako possess the ability to cast Domain Expansion but the details
    of her innate domain and her can''t miss function are entirely unknown. When she used it at the same
    time as Yuta and Ryu, the barrier came apart before any of their domains were fully realized. Note:
    "Healing" and "Transformation" abilities are not applicable in combat for anyone except Sukuna and
    Angel, as Uro & others have already utilized these powers once. This capability can only be employed
    once on the vessel. Takako''s controlled surfaces lack the ability to crush opponents.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
