    confidence: 0.95
  attack_potency:
    text: "At most Building level normally (Nanami considers Yuji's raw strength to be superhuman, to\
      \ the point that his punch reinforced with weak Cursed Energy is still 20% stronger than the average\
      \ Jujutsu Sorcerer, allowing him to accomplish feats that no ordinary human could do such as busting\
      \ through a wall.Jujutsu Kaisen, Chapter 5: \"Start\" Megumi after fighting Todo and training with\
      \ Maki thinks Yuji can win against any of the other Jujutsu High students in a fight where Cursed\
      \ Energy isn't involvedJujutsu Kaisen, Chapter 33: \"Kyoto Sister-School Goodwill Event \u30FC Team\
      \ Battle, Part 0\"), up to City Block level with Cursed Energy (The delayed second impact in Yuji's\
      \ punches comes from his main source of Cursed Energy which is demonstrably stronger than the initial\
      \ hit from his reinforced fist)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "Superhuman travel speed normally (Can run 50 meters in 3 secondsJujutsu Kaisen, Chapter 1:\
      \ \"Ryomen Sukuna\"), Subsonic combat and reaction speed with Cursed Energy (Is one of the fastest\
      \ students in the Goodwill Event, as none of the Kyoto students can land a hit on him,Jujutsu Kaisen,\
      \ Chapter 35: \"Kyoto Sister-School Goodwill Event \u30FC Team Battle, Part 2\" having his speed\
      \ complimented by Todo,Jujutsu Kaisen, Chapter 34: \"Kyoto Sister-School Goodwill Event \u30FC Team\
      \ Battle\" a pure physical fighter)"
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 5 (Casually threw a shot put ball 30 meters with enough force to bend a metal goalpost
      and also jumped to the fourth story of his school), higher with Cursed Energy
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At most Building level normally (Knocked around a Grade 2 curse with his punches but ultimately
      couldn't harm it due to his lack of Cursed Energy control), City Block level with Cursed Energy
      (When enraged, he was able to punch an off-guard Mahito hard enough to cause his nose to bleed and
      then later in their fight, bruised his face with several headbutts before breaking his jaw with
      a kick)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: "At most Building level normally (Withstood hits from a Grade 2 Curse with almost no injuries,\
      \ something that almost killed Megumi and survived multiple attacks from the Finger Bearer while\
      \ it was toying with him including being blasted through a double layered wallJujutsu Kaisen, Chapter\
      \ 7: \"Fearsome Womb, Part 2\"), City Block level with Cursed Energy (Withstood an attack from Todo\
      \ that blew him threw multiple trees. Took a punch in the gut from TodoJujutsu Kaisen, Chapter 36:\
      \ \"Kyoto Sister-School Goodwill Event \u30FC Team Battle, Part 3\" impressing him with his toughness)\
      \ |-|Kyoto Goodwill Event to Shibuya Incident={{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content=All\
      \ previous abilities excluding Damage Boost (Divergent Fist due to his enhanced usage and compatibility\
      \ of his body and Cursed Energy), plus: *Black Flash (Can use Black FlashJujutsu Kaisen, Chapter\
      \ 48: \"Black Flash\") *Further Acrobatics (Hypermobility & Self-Momentum; Could avoid Ko-guy and\
      \ twist within mid-air against itJujutsu Kaisen, Chapter 87: \"The Shibuya Incident, Part 5\" and\
      \ perform side hand flips. Able to perform jumpsJujutsu Kaisen, Chapter 92: \"The Shibuya Incident,\
      \ Part 10\" to get up to a building) *Improved Martial Arts (Able to handle four arms in close combat\
      \ and even overwhelm Ko-guy and is higher in skill than it. Was also complimented by Mei Mei in\
      \ skill without a cursed technique and compared to Atsuya Kusakabe) *Thread Manipulation (Can skillfully\
      \ wield threads to bind his opponents and bring them closer to himselfJujutsu Kaisen, Chapter 93:\
      \ \"The Shibuya Incident, Part 11\") }}"
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: 'Superhuman (Yuji possesses immense stamina and pain tolerance even compared to other sorcerers,
      which combined with his naturally high toughness makes him incredibly difficult to put down. He
      fought against the Special Grade Finger Bearer even after the latter cut his hand offJujutsu Kaisen,
      Chapter 6: "Fearsome Womb" and was able to endure several other hits from the spirit despite the
      immense damage they dealt. Was relatively unaffected from Todo repeatedly kicking him in the head.
      Fought Choso for an extended period of time despite having his armJujutsu Kaisen, Chapter 101: "The
      Shibuya Incident, Part 19" and gut pierced early on. Later in the battle when Choso destroyed his
      liver with Blood Meteorite, Yuji almost immediately regained composure and continued fighting. Fought
      Mahito for about 22 minutes,Jujutsu Kaisen, Chapter 120 & 133 during which he nearly got his skull
      cracked open, got hit by a Black Flash and survived a subsequent beating from MahitoJujutsu Kaisen,
      Chapter 126: "The Shibuya Incident, Part 43" as well as being repeatedly cut up by him. Could have
      continued fighting after taking a deep slash from Yuta''s sword. Walked through a swarm of Sukuna''s
      Dismantle. Yuji also possesses substantial Cursed Energy reserves having the remnants of Sukuna''s
      cursed energy as well as the energy of Death Painting Wombs 4 to 9.Jujutsu Kaisen, Chapter 220:
      "Self-Purification, Self-Constraint" This was shown during the Shinjuku Showdown where he was able
      to heal several lethal attacks with Reverse Cursed TechniqueJujutsu Kaisen, Chapter 252: "Inhuman
      Makyo Shinjuku Showdown, Part 24" and later used a Domain ExpansionJujutsu Kaisen, Chapter 264:
      "Inhuman Makyo Shinjuku Showdown, Part 36")'
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range normally, Tens of Meters with Wire (The wire he used against Awasaka was
      shown being the length of several floors), Projectiles (Threw a shotball 30 meters away) and Domain
      Expansion (His domain's barrier was the size of a building)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: "General Knowledge=Below Average (Yuji is dumb.Jujutsu Kaisen, Chapter 271: \"From Now On\"\
      \ He has the second lowest classroom learning abilities of the Jujutsu High students and is not\
      \ good at math. He is however the best at cooking among the first year trio and a good singer. Needed\
      \ to use his fingers to count to fiveJujutsu Kaisen, Chapter 230: \"Inhuman Makyo Shinjuku Showdown,\
      \ Part 8\") |-|In Combat=Gifted (Yuji is a very proficient fighter being capable of combating cursed\
      \ spirits even before his training as a sorcerer. He was later trained in combat by GojoJujutsu\
      \ Kaisen, Chapter 12: \"Pushing Forward\" and grew further in skill during his fight with Todo.\
      \ Fought evenly with Choso in CQC despite only using one hand. Has repeatedly used environmental\
      \ terrain to his advantage, such as to evade attacks from Mahito and Yuta or to catch Todo by surprise\
      \ via swinging over a tree branch. Was trained in Karate by his grandfather) |-|In Jujutsu=At least\
      \ Gifted (Yuji has experienced tremendous growth as a sorcerer due to Sukuna constantly performing\
      \ high level Jujutsu with his body. Was taught by Todo how to properly control his cursed energy,Jujutsu\
      \ Kaisen, Chapter 37: \"Kyoto Sister-School Goodwill Event \u30FC Team Battle, Part 4\" with his\
      \ understanding of cursed energy being deepened further by his use of Black Flash. In his fight\
      \ with Choso he learned to control Divergent Fist, a technique initially born from bad habit, gaining\
      \ more fluid control over cursed energy. Although no Jujutsu sorcerer can use Black Flash at will\
      \ Yuji is so skilled with the move that it appears like he is doing that, with Mahito needing to\
      \ plan around the possibility of him using it to win. Yuji also possesses extensive knowledge of\
      \ the soul due to being Sukuna's vessel and later reading through Yuki's soul research. Was taught\
      \ barrier techniques by Kusakabe, allowing him to use Simple Domain and later Domain Expansion,\
      \ the pinnacle of Jujutsu sorcery)"
    source_ids: *id002
    confidence: 0.95
