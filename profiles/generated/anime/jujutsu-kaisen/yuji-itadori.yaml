    strength and speed, and can utilize any environmental Terrain in his fightsJujutsu Kaisen, Chapter
    4: "Girl of Steel") *Non-Physical Interaction & Enhanced Senses (Yuji can see cursed spirits that
    are invisible to the human eye and was able to Interact with them) *Weapon Mastery (Yuji is proficient
    with a knife that he uses to fight against curses) **Limited Cursed Energy Manipulation (With Slaughter
    Demon, Yuji can exorcise Cursed Spirits and make up for his lack of Cursed Energy Manipulation) *Cursed
    Energy Manipulation (Basic Sorcerer; He is Grade 2 SorcererJujutsu Kaisen, Chapter 21: "Young Fish
    and Reverse Punishment, Part 3") *Damage Boost (Divergent Fist delivers two blows in one strikeJujutsu
    Kaisen, Chapter 20: "Young Fish and Reverse Punishment, Part 2") *Enhanced Non-Physical Interaction
    & Extrasensory Perception (Soul; Harmed Mahito''s soul by physically punching him due to learning
    to perceive the contours of the soulJujutsu Kaisen, Chapter 27: "What If") *Limited Sealing (Yuji''s
    body works like a cage for SukunaJujutsu Kaisen, Chapter 213: "Fearsome Womb, Part 5") **Multiple
    Selves (Type 2; His body houses Sukuna''s soul in addition to his own) *Supernatural Willpower (Even
    though his hand was cut off and injured badly. Had enough will to continue fight against an stronger
