- id: claim-weaknesses-2a7b3895
  section: weaknesses
  axis: weakness
  text: "He can be impetuous and hot-headed at times. After a Domain Expansion, one's\
    \ Innate Technique becomes unstable and unusable after some time. Notable Attacks/Techniques:\
    \ * Disaster Flames: Jogo's Innate Cursed Technique. It allows Jogo to manipulate\
    \ and create highly concentrated volcanic flames and can be applied to: shoot\
    \ heat rays from his palms or head, create mini volcanoes and create large lava\
    \ hands to lift skyscrapers. **{{Nihongo|Ember Insects|{{Ruby|\u706B|\u304B}}{{Ruby|\u792B\
    |\u308C\u304D}}{{Ruby|\u87F2|\u3061\u3085\u3046}}|Karekich\u016B}}: Jogo can release\
    \ a large quantity of flying insects like curses that explode on impact. **{{Nihongo|Maximum:\
    \ Meteor|{{Ruby|\u6975|\u3054\u304F}}{{Ruby|\u30CE|\u306E}}{{Ruby|\u756A|\u3070\
    \u3093}}\u300C{{Ruby|\u9695|\u3044\u3093}}\u300D|Gokunoban\u30FBIn}}: Jogo's Maximum\
    \ Application of his technique. Jogo can create a large meteor from his application\
    \ of his technique to destroy a portion of Shibuya. **{{Nihongo|Domain Expansion:\
    \ Coffin of the Iron Mountain|{{Ruby|\u9818|\u308A\u3087\u3046}}{{Ruby|\u57DF\
    |\u3044\u304D}}{{Ruby|\u5C55|\u3066\u3093}}{{Ruby|\u958B|\u304B\u3044}}\u300C\
    {{Ruby|\u84CB|\u304C\u3044}}{{Ruby|\u68FA|\u304B\u3093}}{{Ruby|\u9244|\u3066\u3063\
    }}{{Ruby|\u56F2|\u3061}}{{Ruby|\u5C71|\u305B\u3093}}\u300D|Ry\u014Diki Tenkai\u30FB\
    Gaikan Tecchisen}}: Jogo's ultimate application of his technique. Jogo can create\
    \ a large mountain in his domain which traps his opponents and nullifies an opponent's\
    \ technique. The temperature of his domain is so hot that an average sorcerer\
    \ would burn to shreds. The Domain's selling point is its Can't Miss attack which\
    \ will always hit the opponent. * {{Nihongo|Domain Amplification|{{Ruby|\u9818\
    |\u308A\u3087\u3046}}{{Ruby|\u57DF|\u3044\u304D}}{{Ruby|\u5C55|\u3066\u3093}}{{Ruby|\u5EF6\
    |\u3048\u3093}}|Ry\u014Diki Ten'en}} Jogo possesses an anti-domain technique which\
    \ is a form of power nullification. Jogo used this to nullify Gojo's technique.\
    \ Moreover, Domain Amplification can be used as a counter against Domain's of\
    \ other opponents. However, Jogo can't use his Innate Technique whilst using this.\
