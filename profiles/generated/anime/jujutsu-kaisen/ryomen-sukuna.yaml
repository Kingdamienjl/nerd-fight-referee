  intelligence:
    text: "Genius (Having earned the moniker of the \"King of Curses,\" Sukuna is a brilliant sorcerer,\
      \ possessing a deep and vast understanding and knowledge of cursed techniques, curses, binding vows,\
      \ cursed tools, and reverse cursed technique, including where precisely the part of the brain that\
      \ supports domains is located. In the Golden Age of Jujutsu during the Heian Era, Sukuna was feared\
      \ as the most powerful sorcerer, defeating both Sun-Moon-Stars and the Five Empty Generals, the\
      \ most elite of the Fujiwara Clan's Subjugation Units and leaving a lasting impact on history. His\
      \ \"Strongest Sorcerer in History\" title reflects his unparalleled ability with Jujutsu. He is\
      \ able to utilize Mahoraga to allow for more strategically effective attacks against Gojo by using\
      \ him to bypass Infinity. Sukuna constantly switched between Domain Amplification and an innate\
      \ technique, to which Kashimo had claimed that if Gojo did not have the Six Eyes, Sukuna's Cursed\
      \ Energy control would likely exceed his.Jujutsu Kaisen, Chapter 225: \"Inhuman Makyo Shinjuku Showdown,\
      \ Part 3\" Sukuna's ability to quickly deduce and counter cursed techniques is unparalleled, as\
      \ seen in his battle against Mahoraga in which he solved how his adaptation worked, surpassing the\
      \ previous wielder of the Six Eyes and the Limitless, who was defeated by the Shikigami. Even when\
      \ completely overwhelmed by Gojo in their first meeting, Sukuna quickly began deducing the nature\
      \ of the sorcerer's innate technique, being implied to be aware of Gojo's enhanced punches. Even\
      \ Satoru Gojo, the strongest jujutsu sorcerer of the modern age and a natural genius himself, acknowledges\
      \ Sukuna's formidable skills as a sorcerer. Additionally, Sukuna quickly grasped the potential of\
      \ Megumi's cursed technique in their brief battle, eventually forming a binding vow with Yuji to\
      \ seize Megumi's body. Later, during a confrontation with Hana Kurusu, Sukuna manipulated Megumi's\
      \ memories to make her believe he was in control, leading to a critical injury when she embraced\
      \ him. In his battle with Gojo, he began to see how Mahoraga adapted to Gojo's Infinity and used\
      \ Mahoraga as a baseplate to create a technique to bypass it, achieving a feat he never thought\
      \ was possible with his Cursed Technique in one try\u2014courtesy of the model given to him by the\
      \ Shikigami\u2014while also using a binding vow that allowed him to cast it with no hand signs.\
      \ He copied the concept of soul splitting from being turned into a cursed object by Kenjaku, and\
      \ the ability to refresh his cursed technique burnout after only seeing Gojo do it once. Sukuna\
      \ holds the strongest Domain Expansion in the entire verse, having an Open Barrier Domain with power\
      \ superior to that of Kenjaku, a feat known to be divine as Open Barrier Domains require the user\
      \ to alter space itself around them by manifesting the domain in reality, stated to be akin to \"\
      painting without a canvas\")"
    source_ids: *id002
    confidence: 0.95
