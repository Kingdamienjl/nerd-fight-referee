    \ or brain can completely stopJujutsu Kaisen, Chapter 188: \"Tokyo No. 2 Colony, Part 7\" him from\
    \ using Cursed Energy and Reverse Cursed Technique. One can target the neck to stop the application\
    \ of Reverse Cursed TechniqueJujutsu Kaisen, Chapter 239: \"Foolish Survivor!!\" from the neck down\
    \ as well. After Domain Expansion, his Cursed Technique is burnt out and requires a short durationJujutsu\
    \ Kaisen, Chapter 130: \"The Shibuya Incident, Part 47\" to recover. However, this can be negated\
    \ by Sukuna forcefully destroying the right cerebral cortex of his brain with Cursed Energy and healing\
    \ it with Reverse Cursed Technique, though this is extremely risky. Sukuna can be diffused from his\
    \ vesselJujutsu Kaisen, Chapter 199: \"Resentful Names\" through purification, effectively killing\
    \ him. Attacks to his soul also disrupt the attunement of his and his vessel's physical form. Sukuna\
    \ must make direct contact with his targets for Cleave to inflict fatal wounds (outside of his Domain).\
    \ Domain Amplification and his Innate Technique cannot be used at the same time,Jujutsu Kaisen, Chapter\
