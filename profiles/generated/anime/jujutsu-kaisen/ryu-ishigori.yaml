- id: claim-weaknesses-96a4ed48
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks and Techniques: *: Binding Vows are contracts created through cursed\
    \ energy that an individual can make with one's self or another person. The act of abiding by the\
    \ rules and restrictions agreed upon in these contracts can result in a greater power or the achievement\
    \ of a goal, but breaking a binding vow has uncanny repercussions. *Highest Cursed Energy Output:\
    \ Ryu holds the record for the highest cursed energy output in Jujutsu history, recognized by Kenjaku.\
    \ Yuta's cursed energy output falls short, and Ryu, unimpressed by Yuta's Output. Ryu reinforces his\
    \ body with cursed energy to enhance physical strength. His attacks release potent bursts of cursed\
    \ energy, surpassing the toughness of individuals with more overall cursed energy, like Yuta and Rika.\
    \ He is hailed as having the Highest Cursed Energy output of all Culling Game players. *Veritable\
    \ Cannon: Ryu's Innate Cursed Technique makes him create cannons from any part of his body and fire\
    \ cursed energy blasts. **: Ryu's pompadour-styled hair is also in the shape of a cannon, with a distinct\
    \ opening at the front. His cursed technique allows him to take advantage of his high cursed energy\
    \ output by firing cursed energy beams from his hair. He can fire several at once, and each beam carries\
    \ incredible destructive force. Furthermore, his energy discharge maintains its full strength even\
    \ after releasing a Domain Expansion, a trait nobody else has. **: Ryu's signature move is Granit\xE9\
    \ Blast, a focused beam of highly concentrated cursed energy. At maximum strength, it has the destructive\
    \ force to obliterate multiple city blocks. **: Ryu demonstrated the ability to initiate a domain\
    \ expansion, but specifics about his innate domain and its unique features, including a \"can't miss\"\
    \ function, remain undisclosed. During a joint attempt with Yuta and Takako, the barrier disintegrated\
    \ before any of their domains could fully manifest, leaving mysteries surrounding Ryu's abilities.\
    \ Note: Kenjaku's acknowledgment of Ryu's prowess, although significant, should be approached with\
    \ a degree of skepticism, given the lack of direct verification on his part. Healing and Transformation\
    \ abilities are not applicable in combat for anyone except Sukuna and Angel, as Ryu & others have\
    \ already utilized these powers once. This capability can only be employed once on the vessel."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
