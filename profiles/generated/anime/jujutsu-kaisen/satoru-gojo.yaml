  stamina:
    text: 'Superhuman (Even as a teenager, Gojo was able to keep using Limitless for
      around two days while staying up all night. He remained functional despite being
      stabbed off guard with a katana by Toji, even holding the blade in place and
      using Blue to get the assassin away from him. During his fight with Toji, he
      was seemingly physically drained yet still able to cast a Maximum Output: Blue.
      Even after Gojo was stabbed through the throat, cut up, and punctured in the
      head by Toji, he was still able to focus on performing Reverse Cursed Technique.
      Later on, it is stated by Yuta that Gojo''s expense of Cursed Energy is infinitesimally
      close to zero due to the Six Eyes,Jujutsu Kaisen, Chapter 140: "Execution" allowing
      him to effectively never run out of Curse Energy, even compared to Yuta, whose
      Cursed Energy reserve is larger than that of Gojo and described by others as
      boundless in relation to their own.Jujutsu Kaisen, Chapter 90: "The Shibuya
      Incident, Part 8"Jujutsu Kaisen, Chapter 174: "Sendai Colony" The fact that
      Yuta has more Cursed Energy than Gojo is presented as an impressive feat, implying
      his is also considerably large. Moreover, Yuta''s aura was mistaken for that
      of Gojo, implying that their reserves are comparableJujutsu Kaisen, Chapter
      139: "Hunter") |-|Present'
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range physically; Up to Extended Melee Range with Infinity;
      Up to at most Two Hundred Meters with Domain Expansion (Gojo increased the size
      of Unlimited Void in an attempt to engulf Malevolent Shrine's range); Kilometers
