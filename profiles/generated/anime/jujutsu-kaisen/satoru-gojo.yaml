  striking_strength:
    text: '**Spatial Manipulation (Limitless grants the user control over space at
      an atomic level, requiring precise control of Cursed Energy) ***Passive Forcefield
      Creation & Self-Mathematics Manipulation (By manifesting the naturally occurring
      infinity into reality,Jujutsu Kaisen, Chapter 14: "Assault" Gojo can converge
      space as an infinite series of fractions, causing objects that approach him
      to slow down and never reach their target.Jujutsu Kaisen, Chapter 69: "Hidden
      Inventory, Part 5" This idea of infinity is taken from Zeno''s paradoxes, particularly
      the Achilles paradox. Akin to the way Achilles will never catch the tortoise
      due to the potential, infinite amounts of finite space separating them, or how
      the real number one will never touch the actual number two due to the infinite
      amount of fractions that separate them, the opponent will never touch Satoru
      due to the infinity between them) ***Further Mathematics Manipulation (Cursed
      Technique Lapse: Blue is the byproduct of Gojo amplifying the amount of Cursed
      Energy poured into Limitless, thus manifesting something like ''natural negative
      numbers'' into physical reality. In other words, Gojo creates negative distance.
      The result is a magnetic-like effect where objects are pulled toward a single
      point as real space corrects this impossibility, which is likened to the fiction
      of having ''minus one apple,'' by filling the gap) ****Damage Boost (Performing
      the incantations of a technique raises its Cursed Energy outputJujutsu Kaisen,
      Chapter 235: "Inhuman Makyo Shinjuku Showdown, Part 13") **Flight (Shown to
      be able to fly, likely through an application of Limitless) **Free Movement
      (Water Walking; Satoru can walk on water and even extend the ability to those
      he chooses,Jujutsu Kaisen, Chapter 15: "Domain" likely through Infinity) }}
      {{!}}-{{!}}Post-Awakening={{Border|Scroll=Yes|Visible=No|Content= *Regeneration
      (Mid; Used Reverse Cursed Technique to return from the verge of death after
      being stabbed through the throat, cut down the torso, stabbed through the thigh
      four times, and punctured in the head. At full throttle, Gojo''s Reverse Cursed
      Technique healed him as fast as the rapid-firing slashes of Malevolent Shrine
      were damaging him) *Instinctive Action (He can subconsciously tune Infinity
      and keep Reverse Cursed Technique running to preserve his brain at all timesJujutsu
      Kaisen, Chapter 76: "Premature Death") *Limitle'
    source_ids: *id002
    confidence: 0.95
  durability:
