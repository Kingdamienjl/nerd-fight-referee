  intelligence:
    text: 'Genius (Satoru is a natural genius who is able to do anything he tries,Jujutsu
      Kaisen, Volume 1 Extra Pages be it sorcery or otherwise normal hobbies and practical
      life skills. His talent is held in high regard even in the new generation, to
      the point that it is used as a hallmarkJujutsu Kaisen, Chapter 246: "Inhuman
      Makyo Shinjuku Showdown, Part 18" to compare brilliant characters like Hiromi
      Higuruma, who himself is repeatedly stated to be a talented genius.Jujutsu Kaisen,
      Chapter 225: "Inhuman Makyo Shinjuku Showdown, Part 3"Jujutsu Kaisen, Chapter
      247: "Inhuman Makyo Shinjuku Showdown, Part 19" Gojo has shown a heightened
      mastery in various aspects of Cursed Energy, from the understanding of Domains
      and Barriers to regular Cursed Techniques. Satoru was able to use his experience
      in the Prison Realm to replicate its barrier, which is the size of a handheld
      object, and his advanced barrier knowledgeJujutsu Kaisen, Chapter 262: "Inhuman
      Makyo Shinjuku Showdown, Part 34" allowed Yuta to narrow the sure-hit effect
      of his domain to a single target. He also has a heightened understanding of
      the soul, being aware that it is intertwined with the body.Jujutsu Kaisen, Chapter
      91: "The Shibuya Incident, Part 9" Even as a child, he completed the basics
      of Jujutsu training and regularly fought Cursed Spirits. With only mere records
      to work with, Satoru was able to learn to control and master the Limitless technique,
      which is a troublesome effort even for those who bear the Six Eyes.Jujutsu Kaisen,
      Chapter 262.2: "Inhuman Makyo Shinjuku Showdown, Part 34.2" At a young age,
      Gojo was able to unlock the ability to expand his innate domain, even with his
      technique being complex and incredibly difficult to handle—so much so, that
      he isn''t able to narrow the target of its sure-hit effect, despite Yuta being
      able to do so with his own domain because of the former''s advanced barrier
      knowledge. Satoru is quite tactical and capable of figuring out his opponent''s
      plan with minimum information. He has also shown to be extremely adaptable to
      any enemy he has ever faced so far, knowing precisely what to do to counter
      their techniques and find ways to defeat them. Gojo is among the greatest hand-to-hand
      combatants in the series, if not the best) {| cla'
    source_ids: *id002
