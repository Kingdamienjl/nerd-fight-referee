  description: 'Has a habit of neglecting to plan ahead Feats: Show/Hide ====STRENGTH:==== * Took normal
    men out with ease. * Did a jump kick and went REALLY far. * Broke out of this dogpile. * Held on to
    Faye''s ship while she flew around. * Kicked this guy into the bar counter. * Dented this pipe. *
    Sent these guys flying. * Knocked over this large animatronic. * Flipped this guy. ====MARKSMANSHIP:====
    * Shot this tiny bottle out of the air. * Shot this guy right between the eyes. * Hit this guy on
    a balcony. * Disarmed this kid. * Headshot * Shot another guy who is really high up and also it was
    night time. * Hit a guy from far away with a shotgun while running. * Disarmed a guy from across a
    convenience store. PILOT ABILITY: * Caught Ain with his ship. * Avoided some debris. * Caught this
    guy with his ship. * Hit the car just right so that he only hits the engine. * Flew through a narrow
    tunnel and also guided a giant ship through it. * Avoided lasers. * Some fancy maneuvers. * This asteroid
    field was his bitch. * Took out some other ships and avoided enemy fire. * Evaded some missiles and
    bullets. * Fancy flying * More fancy flying ====ENDURANCE:==== * No sold a punch from some goon. *
    Took a bullet in the stomach and kept on going. * Fell two stories onto his head and survived. (and
    this was after he got shot) * Survived the backblast of an explosion. * Did it again. * Took a pretty
    nasty fall and was fine. * Fought Viscious evenly after taking a throwing knife to the shoulder. (and
    this was after he had cleared an entire building of goons) ====COMBAT ABILITY/REFLEXES:==== * Spike
    explained how he fights. * Danced circles around this chump. * Avoided gunfire. * Fought evenly with
    Hakim who is a very good fighter. * Fought evenly with Vicious who can do shit like this. * Fought
    evenly with Viscious again. * Aim dodging * Casually dodged knife strikes. * like water * LIKE WATER
    * Took on a large group of thugs. * "HI" * Evaded yet more bullets. * Impressive fight with Vincent.
    * Beaten this guy up. * Aim dodged gunfire at extremely close distance. * Fought better than an experienced
    military officer. * Beaten the shit out of Vincent. * Reacted to Vincents surprise attack. ====AGILITY:====
    * Chased Hakim. * Kept up with a train on foot. ==Explanations== Spike has many talents and abilities'
