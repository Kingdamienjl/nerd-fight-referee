- id: claim-powers-and-abilities-5a1de5a3
  section: abilities
  axis: hax
  text: 'Pre Time-Skip= *Martial Arts *Scythe User *Acrobatics *Soul Wavelength & Meister (Has a GrigoriSoul
    Eater: Chapter 63 soul, a unique soul only 1 in 50 million have. Can manipulateSoul Eater: Chapter
    59 her soul with Soul''s assistance to spread it out, purifying the madness from other''s souls) *Improved
    Enhanced Senses (By focusingSoul Eater: Chapter 59 more, Maka could precisely sense Arachne''s soul
    webbing across her castle) *Blood Manipulation **Statistics Amplification, Transformation (The Black
    Blood inside of SoulSoul Eater: Chapter 60 can be used to strengthen and create strong clothing for
    her) *Purification, Durability Negation, Magic Nullification, Non-Physical Interaction (Type 2 - Anti-Demon
    WavelengthsSoul Eater Super Guidebook: How to Make a Death Scythe have an exorcising effect on "demons"
    or demonic like entities such as witches. The wavelength can also destroySoul Eater: Chapter 60 madness
    itself, cutting through Arachne''s madness form and killing a clown. Techniques like Witch-hunt or
    Devil-hunt can easily cut through witches, "demons", or Asura''s clownsSoul Eater: Chapter 43 and
    evaporateSoul Eater: Chapter 83 Black Blood) *Enhanced Senses & Information Analysis (Soul Vision
    - Emotion Vision - Inside Vision - Power Sensing - Meisters and Demon Weapons are able to see soulsSoul
    Eater: Chapter 16 and see them to different degrees from simply being able to see one''s soul to being
    able to tell one''s personality off of their soul as Stein doesSoul Eater: Chapter 2 with it being
    regarded as an impressive skill. They can also tell the kind of power one has as Maka did with Gopher
    by seeing his soulSoul Eater: Chapter 64. Soul Wavelengths also give off one''s emotional state as
    wellSoul Eater: Chapter 65. It can also allow Meisters to tell what speciesSoul Eater: Chapter 47
    the soul response is from. Soul Responses can be felt from dozensSoul Eater: Chapter 103 of meters
    as well) *Flight (Can fly by channeling her GrigoriSoul Eater: Chapter 63 wavelength through Soul
    to create wings) *Statistics Amplification (Can bolster her own power and that of her allies with
    a Soul Melody or by tapping into Madness) *Regeneration (Low-Mid, Black Blood seals virtually any
    non-lethal wound and can even save Maka from being impaled through the chest or brain) *Madness Manipulation
    (Can instill madness into others) *Empathic Manipulation (Can nullify''s one bloodlust to the point
    of making them unwilling to even defend themselves) Resistance: *Madness of Fear (Anti-Demon Wavelengths
    can resistSoul Eater: Chapter 83 the madness aura from Crona''s Black Blood which Maka described as
    intenseSoul Eater: Chapter 83. She managed to resist Arachne''s and Kishin Asura''s madness manipulation
    and can extend this resistance to a large group of people) |-|Time-Skip= *Improved Soul Wavelength
    (Soul HackSoul Eater: Chapter 100 can take control of other''s abilities controlled by their soul)
    **Greater Power Nullification & Soul Manipulation, Statistics Reduction, Thread Manipulation (Soul
    AdagioSoul Eater: Chapter 76 - Through Soul, they can use Arachne''s power of placing parts of their
    soul wavelength around the area to cause one''s power to be nullified as they move through it, effectively
    slowing down one''s soul wavelength) *Blood Manipulation **Improved Sound Manipulation & Madness Manipulation
    (Type 3 - Soul with the influence of Black Blood can now propagateSoul Eater: Chapter 84 madness through
    sound and attack with sound itself. They can also just shoot sound and surroundSoul Eater: Chapter
    88 themselves with sound) **Statistics Amplification, Transformation (Black Blood Full BlastSoul Eater:
    Chapter 111 transforms Maka''s clothing, donning a black dress and changing Soul into a piano scythe)'
