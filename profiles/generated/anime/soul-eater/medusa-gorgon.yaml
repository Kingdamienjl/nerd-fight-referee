- id: claim-powers-and-abilities-f96de141
  section: abilities
  axis: hax
  text: '*Genius Intelligence *Martial Arts (Is a close combat witch, capable of overwhelming
    Stein through her vector plating) *Acrobatics *Flight *Soul Wavelength **Immortality
    & Possession, Regeneration, Greater Soul Manipulation (Types 2, 3 & 6 - High-Mid
    - Similar to her sister, MedusaSoul Eater: Chapter 30 can split her soul up into
    many pieces and reform it into another person. Though this regeneration is possible
    due to the massive boost in magic power from Asura''s wavelength) *Shapeshifting
    (Can quickly change her new body to match the appearance of her old one) *Longevity
    (Witches live for much longer like Medusa & Arachne living for hundreds of years)
    *Magic, Empathic Manipulation, Corruption (Type 1 - Magic is a pollutingSoul Eater:
    Chapter 46 substance, causing nature itself to "cry", causing anguish in it and
    can transform animals of the Amazon River into monsters. The Pull of MagicSoul
    Eater: Chapter 51 dominates witches, instinctively driving them always to want
    destruction due to the almost limitless amount of energy they have. Magic can
    be used to strengthen one''s body through coating) **Stealth Mastery, Forcefield
    Creation (Witches can use Soul ProtectSoul Eater: Chapter 6, a high-level spell
    that surrounds their soul with a spell, making their wavelengths disappear and
    camouflages their soul to make it seem like a normal human''s. Furthermore, Stein,
    a master Meister couldn''t sense through it. Soul ProtectSoul Eater: Chapter 97
    acts as a barrier and shuts in and blocks out any signal, allowing them to shut
    in the Kishin''s madness wavelength and their own) **Shapeshifting, Animal Manipulation
    (Witches souls have the ability to transformSoul Eater: Chapter 26, allowing them
    to turn into animals or insects specific to them) **Limited Spatial Manipulation,
    Enhanced Senses (Spatial Awareness - Is able to specifically set up where a spell
    will materialize through the Calculation SpellSoul Eater: Chapter 15 & 72, which
    requires extensive mathematic calculations and precise positioning within space.
    It can also be used to link to other worlds such as the worlds in Eibon''s book
    or the Witches world. Magic Sensing - Witches can sense magic attacks such as
    Medusa sensing Arachne''s invisible spider threadsSoul Eater: Chapter 54) **Energy
    Projection & Energy Manipulation (Through her magic, she can manifest vector arrows
    and other arrows to do several abilities) ***Vector Manipulation (Can forcibly
    move someone in a specific direction or increase the kinetic energy of an attack)
    ***Magical Deconstruction (Can break downSoul Eater: Chapter 46 magic via vector
    arrows) ***Damage Boost (Vector BoostSoul Eater: Chapter 46 doubles power on those
    its placed on) ***Non-Physical Interaction (With Vectors: Medusa''s vectors can
    interact with pure madness) ***Light Manipulation (Can create balls of lightSoul
    Eater: Chapter 47 with her vector arrows) ***Homing Attack & Danmaku (Can fire
