  section: equipment
  axis: equipment
  text: '*Snakes: Medusa''s body contains a vast number of snakes who are loyal to
    her. **Light Serpent: Snakes that are normally concealed on her arms as tattoos,
    sending them shooting forward in order to bite the opponent. *Black Clown: The
    Black Clown is a Man-made Clown created by the Witch, Medusa Gorgon. It is created
    with the Black Blood and has the ability to change into a sword but also is autonomous.
    *Purple Clown: A small artificial clown that was created by Medusa as a by-product
    in her experiments to create the Black Clown. She has the Purple Clown perform
    Madness Fusion with one of her Light Serpents to augment it and others with more
    power.'
  source_ids: *id002
  decisive: false
  status: unverified
