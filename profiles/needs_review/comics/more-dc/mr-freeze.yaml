    - field: powers_and_abilities
      value: 'In his first two keys, Freeze boasts: * Superhuman Physical Characteristics
        (See Attack Potency, Speed, Lifting Strength, and Durability) * Genius Intelligence
        (See Intelligence) * Weapon Mastery (with his Cold Gun and his future suit''s
        cold arm cannons) * Preparation (Prepared a reverse-fusion bomb in "Deep Freeze"
        and a massive cold gun in "Heart of Ice") * Longevity (Freeze''s aging has
        almost completely halted, and after decades hasn''t aged a day, as seen in
        Batman Beyond''s "Meltdown") * Self-Sustenance (Type 2, and seemingly Type
        3) * Energy Projection, Ice Manipulation, and Light Manipulation (The blasts
        from his laser-powered Cold Gun (and the blasts from his future suit''s arm
        cannons) freeze essentially anything they touch in a matter of moments - technically,
        this is moreso a direct effect of the gun''s blasts utilizing Temperature
        Manipulation) * Paralysis Inducement via Freezing (Freezing his foes holds
        them in place, incapacitating them without necessarily harming them) * Resistance
        to Extreme Cold/Ice Manipulation (Due to his chemically-altered body, not
        only is Freeze immune to the adverse effects of extreme cold, he thrives in
        extremely cold temperatures) With Optional Equipment, he can utilize: * Flight
        (with a Helicopter) * Natural Weaponry (Conventional: His Polar Bears have
        fangs and claws) In his Batman Beyond appearance, he retains his prior abilities,
        possibly sans Immortality and Self-Sustenance due to his transplant into another
        body.'
      source_id: character-stats-profiles-mr-freeze-more-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: At least Small Building Level physically (Upscaling from 0.095 Tons -
        Overtly stronger than Batman, easily tossing him and restraining him with
        one arm. Effortlessly kicked locked doors off their hinges. Grant Walker,
