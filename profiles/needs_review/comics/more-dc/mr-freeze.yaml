    - field: weaknesses
      value: 'Cannot survive more than an hour without his suit and helmet. His glass
        helmet is his weak spot. His body must remain in cold temperatures or he will
        die if removed from his suit. Notable Attacks/Techniques: *Freeze Shattering-
        Mr. Freeze uses his ice based weaponry to freeze a foe into a solid block
        of ice. He than breaks the ice block, causing the foe''s body to shatter.
        This can be used as a form of Durability Negation, provided his freezing abilities
        would even work on the foe. If the ice block is not shattered, the person
        will remain trapped until they either thaw out or freeze to death. Even normal
        humans can last a while, though they will die after some time. Note: Before
        making any changes to this page, please read and follow the Power-scaling
