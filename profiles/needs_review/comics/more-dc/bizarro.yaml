    - field: attack_potency
      value: "Large Planet Level (Downscaling from 1.03 Ronnatons - Fought and overwhelmed\
        \ Wonder Woman, ragdolling her with his blows, and is strongly implied to\
        \ be comparable to Giganta. While not nearly as strong due to his cellular\
        \ deterioration, he is still a clone of Superman, and can give him some slight\
        \ pause - however, Superman holds back in all of their encounters in deference\
        \ to the fact that Bizarro is not truly evil, just easily misled (even the\
        \ scuff marks on Supes after their fight in \u201CDead Reckoning\u201D can\
        \ easily be dismissed as dirt from the walls the two slammed through rather\
        \ than damage) and still wins handily every time, alongside ample scaling\
        \ and statements proving that Superman is head-and-shoulders above his failed\
        \ clone in terms of strength. See here for my reasoning as to why DCAU Superman\
        \ is not Low Complex Multiversal)"
      source_id: character-stats-profiles-bizarro-more-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
