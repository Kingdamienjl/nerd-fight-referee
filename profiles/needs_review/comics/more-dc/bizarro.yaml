        Senses (Possesses super-hearing, as seen when he heard the growling of an
        (underground) alien creature from an incredible distance away) *Energy Projection
        and Heat Manipulation (with Heat Vision - Bizarro can use heat vision as a
        huge burst of energy or for precision work, such as sealing a crack in metal)
        *BFR (Threw a crane across Metropolis. Tossed an ICBM far into the sky) *Resistance
        to Cosmic Radiations (Wasn''t affected by the radiations of outer space when
        Mxyzptlk teleported him there, only its lack of air) *He may have more abilities,
        but due to the fact that his genetic structure is shown to deviate wildly
        from Superman''s, we cannot be certain he possesses every ability normal Kryptonians
        do.'
      source_id: character-stats-profiles-bizarro-more-dc
      provider_id: character_stats_profiles
