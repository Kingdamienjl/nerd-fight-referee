    - field: durability
      value: Large Planet Level (Downscaling from 1.03 Ronnatons - Should be capable
        of withstanding his own physical power. Took blows from Wonder Woman and shook
        them off. Survived a half-kiloton blast with no notable injury)
      source_id: character-stats-profiles-bizarro-more-dc
