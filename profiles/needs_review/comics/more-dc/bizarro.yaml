    - field: powers_and_abilities
      value: '*Superhuman Physical Characteristics (See Attack Potency, Speed, Lifting
        Strength, and Durability) *Flight (Can freely fly at incredible speeds) *Enhanced
        Senses (Possesses super-hearing, as seen when he heard the growling of an
        (underground) alien creature from an incredible distance away) *Energy Projection
        and Heat Manipulation (with Heat Vision - Bizarro can use heat vision as a
        huge burst of energy or for precision work, such as sealing a crack in metal)
        *BFR (Threw a crane across Metropolis. Tossed an ICBM far into the sky) *Resistance
        to Cosmic Radiations (Wasn''t affected by the radiations of outer space when
        Mxyzptlk teleported him there, only its lack of air) *He may have more abilities,
        but due to the fact that his genetic structure is shown to deviate wildly
        from Superman''s, we cannot be certain he possesses every ability normal Kryptonians
        do.'
      source_id: character-stats-profiles-bizarro-more-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "Large Planet Level (Downscaling from 1.03 Ronnatons - Fought and overwhelmed\
        \ Wonder Woman, ragdolling her with his blows, and is strongly implied to\
        \ be comparable to Giganta. While not nearly as strong due to his cellular\
        \ deterioration, he is still a clone of Superman, and can give him some slight\
        \ pause - however, Superman holds back in all of their encounters in deference\
        \ to the fact that Bizarro is not truly evil, just easily misled (even the\
        \ scuff marks on Supes after their fight in \u201CDead Reckoning\u201D can\
        \ easily be dismissed as dirt from the walls the two slammed through rather\
        \ than damage) and still wins handily every time, alongside ample scaling\
        \ and statements proving that Superman is head-and-shoulders above his failed\
        \ clone in terms of strength. See here for my reasoning as to why DCAU Superman\
        \ is not Low Complex Multiversal)"
      source_id: character-stats-profiles-bizarro-more-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: At least Relativistic+, almost certainly FTL combat speed and reactions
        (Upscaling from 0.53c - Speed-blitzed Wonder Woman on two separate occasions,
        and kept up (to some extent) with a holding-back Superman, though when utilizing
        his full speed (to protect Lois Lane) Superman is shown capable of blitzing
        him), with at least Supersonic, if not Hypersonic flight speed (Quickly caught
        up to a ballistic missile in its boost phase, though the missile had clearly
        not reached its 7km/s burnout speed yet since the boosters were still going)
      source_id: character-stats-profiles-bizarro-more-dc
