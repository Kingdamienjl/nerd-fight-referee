        of different amount of energies. Naturally occurring energy projected by Firestorm
        are "Nuclear Blasts" however elements can project a number of different energies
        at will, such as Kryptonite energy. **Energy Absorption: Firestorm can absorb
        massive amounts of energy as well as being able to absorb many different types
        of energy. Most commonly the elements and energies associate with life and
        the human body are absorbed. **Forcefield Creation: Firestorm can create energy
        shields and energy forcefields to deflect and stop attacks, like energy beams
        and punches *Quark Vision: The ability to see extremely small objects and
        images down to the subatomic level. *Self-Sustenance: Elements tied to the
        Firestorm Matrix can survive in space unaided, never need to eat to sustain
        life and never truly need another element to be processed or broken down by
        their bodies. Notes: *Before making any changes to this page, please read
        and follow the Power-scaling Rules for Marvel and DC Comics. *At emotional
        equilibrium, the chances of a Big Bang are near zero. If agitated, the chances
