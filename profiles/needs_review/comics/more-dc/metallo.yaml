        \ scales Metallo to Superman - that being Metallo matching Superman in strength\
        \ in their first fight and implying he\u2019s even stronger than him, and\
        \ the Batman-Superman.com statement that he can match Superman blow for blow.\
        \ However, another look at Metallo\u2019s actual feats shows that he isn\u2019\
        t actually this strong. For reference, Superman is at \u201Cpeak strength\u201D\
        \ for most of STAS, JL Season 2, and JLU. The biggest anti feat for Metallo\
        \ is his battle with Superman in the episode \u201CAction Figures.\u201D During\
        \ this, Superman initially shows up wearing a Kryptonite-resistant suit, meaning\
        \ Metallo\u2019s Kryptonite doesn\u2019t affect him. This enables him to outmaneuver\
        \ Metallo and swat him aside with one punch. Metallo then caused rocks to\
        \ fall in order to rip a hole in the suit, Superman\u2019s chest is being\
        \ exposed to Metallo\u2019s Kryptonite, which obviously weakens him slightly\
        \ due to the small surface area of the exposure. However, even while slightly\
        \ exposed to this Kryptonite, the Man of Steel fights evenly with a bloodlusted\
        \ Metallo. This would imply Metallo is only about as powerful as a somewhat\
        \ weakened Superman - and things like him being even in a contest of strength\
        \ with Martian Manhunter (who Superman scales far above) and not even denting\
        \ Steel\u2019s armor with killing-intent blows (whereas Galatea, who is only\
        \ slightly stronger than Supergirl, could rip it apart) only further prove\
        \ that point. To that end, his feats against Superman in \u201CSuperman\u2019\
        s Pal\u201D and \u201CHeavy Metal\u201D are basically all when Superman has\
        \ already been weakened by his Kryptonite beams - and the fact that Metallo\
        \ could struggle evenly with him during their first encounter can be easily\
        \ explained by the fact that Superman didn\u2019t know John Corben had become\
        \ a robot, and likely assumed he was just a human who had acquired powers"
