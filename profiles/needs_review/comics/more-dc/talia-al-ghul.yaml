        following him. Is the most cunning of Batman''s foes) If given preparation
        time, Ra''s can utilize: *Summoning (Can summon Haahk) *Poison Manipulation
        (Uses a poisonous snake that incapacitates Batman) *Electricity Manipulation
        (His underling has an electricity gun) *Energy Projection (Wields an energy
        blaster) *Paralysis Inducement (His underlings use bola) *Power Absorption
        (The staff absorbed much of Superman''s strength) *Explosion Manipulation
        (His underlings used a bomb) *Statistics Amplification (The climax of The
        Demon Reborn involved Ra''s using the staff and machinery to absorb Superman''s
        strength into himself) *Flight (His underlings are shown using hovercrafts)'
      source_id: character-stats-profiles-talia-al-ghul-more-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Small Building Level (Scaling to 0.095 Tons - Harmed Batman with a kick,
        sending him flying, and dueled with him, the two of them clashing blades evenly
        several times. Broke the B:TAS-era Batrope, which could restrain the likes
        of Ubu - Ubu is this strong), higher with his sword - with Preparation, Ra's
