    - field: attack_potency
      value: Wall Level physically (Upscaling from 17 Kilojoules - By the time he
        begins operating as Hawkman, fighting supervillains on a regular basis, considering
        his athletic build, he should at least be stronger than Doctor Destiny), at
        least Small Building Level (Upscaling from 0.095 Tons - With his Nth Metal
        Axe, sliced through the same type of restraint that was being used to handily
        restrain Hawkgirl. An Nth Metal spear, used by Hawkman, could slice and pierce
        through mummies which could tank strikes from Batman), very unlikely far higher
        with Nth Metal Weapons (Carter was capable of slicing apart a solid Shadow
        Thief's arm, with Shadow Thief's solid parts, as of "Ancient History," being
        capable of tanking beams from a desperate Green Lantern - however, this would
        imply that Carter, a human who is shown to be a one-shot-difference weaker
        than Hawkgirl, can produce greater force by swinging a random sword than Hawkgirl
        can by swinging an Nth Metal Mace - an idea that is wildly inconsistent and
        on-its-face ridiculous) - See Note for an explanation as to why I don't think
        Carter's struggling with Shadow Thief scales him to ST's physicals.
      source_id: character-stats-profiles-hawkman-more-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Relativistic+ reactions and combat speed (Scaling to 0.53c - Tagged the
        Shadow Thief and evenly swordfought with him - Shadow Thief could react to
        and dodge Lantern Beams (which move at the Speed of Light) after they were
        fired, and has tagged Batman and Hawkgirl, as well as Vixen. Reacted and weaved
        around obstacles while desperately flying to save the Absorbacron. Saved Hawkgirl
        from the fired darts of a booby trap), with Hypersonic+ flight speed (Flew
        in tandem with Hawkgirl, who had incentive to fly at full speed in order to
        save Batman from the collapsing tomb)
      source_id: character-stats-profiles-hawkman-more-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: "Wall Level (Upscaling from 17 Kilojoules - Scaling to his AP as per\
        \ Newton\u2019s Third Law), possibly higher (Taking a half-hearted hit from\
        \ Shadow Thief isn't really an indisputable durability feat for Carter, because\
        \ ST has incentive to not do Carter serious harm, as the two are halves of\
        \ a whole and thus inextricably linked)"
      source_id: character-stats-profiles-hawkman-more-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Normal Human Weaknesses. Note: Simply put, Carter is a normal human
        and his Nth Metal is never referenced as something that enhances his strength.
        And yet, he''s shown capable of physically overpowering Shadow Thief - Shadow
        Thief being shown capable of casually shattering chains that Hawkgirl couldn''t
        break while attempting to muscle out of and defeating Green Lantern in "Ancient
        History" - this is at total odds with the fact that Carter is a normal human,
        and in fact can''t even stay conscious after a single hit from Hawkgirl. The
        obvious rationale for this is that Shadow Thief, who is later revealed to
        be Carter''s literal other half, is likely more susceptible to Carter''s attacks
        than the attacks of others, as Carter could quite literally force ST back
        into his soul in that same episode. The only alternative explanation is that
        for some reason, this normal human, with his bare hands, is substantially
        stronger than the woman who knocked him out in a single hit prior, as well
        as equal to or stronger than a Green Lantern Ring. That alternative explanation
        is, obviously, completely ludicrous, and so Occam''s razor dictates that Carter
        cannot be thought of as actually scaling to Shadow Thief, especially not with
        base physicals. Note 2: Bruce Timm has stated that the original DCAU tie-in
        comics are not canon, with the only tie in comics that have statements to
        the contrary (other than Batman: The Adventures Continue, which has so many
        continuity issues that it''s essentially impossible to argue it''s canon)
        being Justice League Infinity, the Batman and Harley Quinn tie in comics,
        and specifically the first annual of Batman Adventures. Ergo, I only consider
        those three comics canon. Category:Goulden1998 Category:Tier 9'
      source_id: character-stats-profiles-hawkman-more-dc
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
