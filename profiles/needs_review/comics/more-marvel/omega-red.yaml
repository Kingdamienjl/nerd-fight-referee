    - field: weaknesses
      value: 'Given his nature as a serial killer,Marvel vs. Capcom: Official Complete
        Works Rossovich is known to kill indiscriminately,X-Men: Children of the Atom
        Manual making his behaviour predictable to some degree. Notable Attacks/Techniques:
        |-|Command Normals= *Ground Tentacles: Omega Red injects his tendrils into
        the ground, which then surface up at a further distance in order to sneakily
        strike his opponents. *Air Dash: While airborne, Omega Red can briefly charge
        forwards. |-|Throws= *Throw: Omega Red grabs the opponent with both hands
        and slams them into the ground. *Back Throw: Omega Red grabs the opponent
        with both hands, flips them backwards over his head, and slams them into the
        ground. *Air Throw: While airborne, Omega Red grabs the opponent with both
        hands and slams them towards the ground. *Back Air Throw: While airborne,
        Omega Red grabs the opponent with both hands, spins them around, and plummets
        them into the ground. |-|Special Attacks= *Omega Strike: Omega Red shoots
        both his tentacles into the ground and kicks in his direction of choice. He
        can either kick straight forwards, diagonally upwards, or directly upwards.
        *Carbonadium Coil: Omega Red sends a tentacle at the opponent, restraining
        them. This attack can be aimed forwards, diagonally upwards, or directly upwards.
        While his opponent is restrained, Omega Red has multiple followups to choose
        from. This technique can be used aerially, with the directions available being
        forwards, diagonally downwards, and directly downwards. All variants of Carbonadium
        Coil can all be performed in the air as well. **Death Factor: Omega Red drains
        the opponent of their vitality, healing himself in the process. **Energy Drain:
        Omega Red drains the opponent of their Hyper Meter, taking it for himself
        in the process. **Coil Throw: After draining the opponent of their vitality
        or energy, Omega Red lifts them up into the air. He can choose to slam them
        straight into the ground in front of or behind him, or send his opponent flying
        straight upwards. |-|Hyper Combos= *Omega Destroyer: Omega Red whips his tentacles
        in all directions, relentlessly flailing anything it comes into contact with
        *Carbonadium Smash: While airborne, Omega Red dashes forward and unleashes
        a barrage of attacks on his opponent. He finishes off the Hyper Combo by restraining
        the opponent in his tentacles and slamming them into the ground behind him.
