        \ on him. Stayed conscious and battle-ready (only groaning in pain) after\
        \ a direct hit from Shriek's sound blasts, which can blast apart walls, send\
        \ police vehicles flying back, and turn large machinery to scrap metal. Got\
        \ up immediately after an energy blast that burst through a roof, sending\
        \ Batman into the roof of a car hard enough to crumple it. Withstood attacks\
        \ from the Invulnerable Man, who could punch apart a wall. Only groaned in\
        \ pain when hit with a portion of a blast that could have \"wiped out a small\
        \ infantry.\" Can withstand being pulled through metal machinery by Mad Stan.\
        \ Shook off a fiery explosion from King\u2019s card bomb. Survived flying\
        \ into a water tank with enough force to destroy it. Took a punch from Ace\
