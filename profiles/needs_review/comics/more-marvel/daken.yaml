    - field: powers_and_abilities
      value: 'Without his suit, he possesses: * Superhuman Physical Characteristics
        (See Attack Potency, Speed, and Durability) * Superhuman Athleticism (Can
        leap higher than any IRL human possibly can - even prior to receiving any
        training, he could leap above the shoulders of someone roughly his height
        from a standing position) * Acrobatics (Presumably due to training by Bruce
        Wayne, Terry demonstrates the ability to do complex flips and other such acrobatic
        maneuvers, for the purposes of traversing his environment, avoiding enemy
        attacks, simply getting his bearings after an attack, and facilitating his
        own attacks. Even before receiving any training, he could leap and swing around
        a lamppost to kick a member of the Jokerz) * Hand-to-Hand Combat Mastery (Terry
        employs an acrobatic fighting style with many leaping attacks and spinning
        roundhouse kicks, as well as using his wings to dive at foes and incorporating
        his gadgets and suit enhancements to catch foes off guard, such as blasting
        foes away with the propulsion jets on his feet. Far from just being an improvised
        style, Terry''s style of combat exists on a foundation of substantial skill
        and training, having been instructed in close combat by martial arts masters
        such as Bruce Wayne, Kairi Tanaga, etc - allowing him to go toe-to-toe with
        many powerful and skilled combatants. On more than one occasion, has contended
        with and defeated Curare with both combat skill and ingenuity - Curare is
        the "jewel in the crown" of the Society of Assassins, who are so wildly skilled
        that not a single one of them has ever failed to kill their target - that
        is, until Batman II foiled Curare in her debut episode. Can fight and defeat
        both Dee-Dee Twins simultaneously - said twins being noted experts in CQC.
        Used a creative, momentum-based throw on a training droid. Caught a sword
        between his palms, a maneuver that requires great skill and hand-eye coordination)
        * Weapon Mastery (Demonstrates profound marksmanship with Batarangs, such
        as when he hit one of Shriek''s gauntlets from a distance, sliced through
        Mad Stan''s detonator cable from across a room, disarmed Jack, etc. Often
        uses his gadgets in very creative ways - in example, he has used his wrist
        grapnels as a kind of trip-wire, used his jet boots to push an enemy far away,
        etc. Presumably due to training, Terry also demonstrates skill with bo-staff
        like weapons) * Stealth Mastery (Likely due to instruction by Bruce Wayne,
        Terry can disappear on people without a single sound just as his predecessor
