    - field: weaknesses
      value: 'Normal Human Weaknesses. His suit is far stronger than he is, and he
        is essentially rendered helpless if it''s somehow hacked or locked from the
        outside. Note: Bruce Timm has stated that the original DCAU tie-in comics
        are not canon, with the only tie in comics that have statements to the contrary
        (other than Batman: The Adventures Continue, which has so many continuity
        issues that it''s essentially impossible to argue it''s canon) being Justice
        League Infinity, the Batman and Harley Quinn tie in comics, and specifically
        the first annual of Batman Adventures. Ergo, I only consider those three comics
        canon. Category:Goulden1998 Category:Tier 9'
