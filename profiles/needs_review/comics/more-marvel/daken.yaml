    - field: speed
      value: "Hypersonic (Scaling to Mach 8.7 - Fought and largely kept pace with\
        \ a revived, bloodlusted Joker - considering Joker\u2019s revived self is\
        \ \"sleeker\" and \u201Cdeadlier\u201D than his original body, it\u2019s doubtful\
        \ he\u2019s notably slower. Has dodged speed-of-sound vibratory waves from\
        \ Shriek so many times it's almost comical - one notable instance being the\
        \ time he moved both himself and Bruce Wayne out of the way of a blast so\
        \ quickly it couldn't even graze either of them, this being so notable because\
        \ the wave was seemingly less than a meter away from Terry before he even\
        \ began to move. Expertly piloted the flying Batmobile even whilst it was\
        \ cruising at a blistering speed of Mach 3, and piloted it to evade air-to-air\
        \ missiles. Consistently keeps up with, dodges attacks from, and lands hits\
        \ on Curare, who has several feats of dodging and deflecting gunfire after\
        \ it\u2019s fired. Dodged a blast of electricity from Queen, which moves at\
        \ Supersonic speeds in open air, and later dodged another blast of electricity\
        \ from a different foe. Evaded gunfire from a member of the Jokerz after it\
        \ was fired. Avoided a bazooka rocket by cutting the cable holding him up\
        \ in the nick of time. Repeatedly tagged a snake splicer who could dodge tranquilizer\
        \ rifle rounds. Dodged blowgun darts from Stalker, which can move this fast.\
        \ Blocked thrown knives, which can move this fast, if not faster considering\
        \ they were being thrown by a superhumanly strong synthoid. In one embarrassing\
        \ antifeat, was tagged by the tongs of a taser), possibly as high as Relativistic+\
        \ reactions and combat speed (Scaling to 0.53c - As mentioned prior, should\
        \ scale to present-day Joker. Evaded blasts from a laser that destabilized\
        \ particles, on one occasion outright dodging it after it was fired. Can dodge\
        \ blasts and beams of X-Ray radiation (as implied by the fact that the radiation\
        \ originates from medical treatments and the fact that it can be reflected\
        \ by a reflective surface) from Blight after they\u2019re fired - radiation\
        \ moving at close to lightspeed in open air, as it is simply electromagnetic\
        \ waves. Dodged a blast from Mr. Freeze, which (for reasons discussed on his\
        \ profile) are likely super-chilling laser beams. During \u201CFuture Shock,\u201D\
        \ dodged Static\u2019s electric bolts after they were fired, with this calc\
        \ asserting that he reacted 3.6x faster than one of Static\u2019s bolts -\
        \ since said bolts move at Mach 2441.7, for Terry to have reacted this fast\
        \ would constitute a reaction at about 1 percent lightspeed. Similarly, Bonk\
        \ (who Terry has no problem landing attacks on) could also dodge one of Static's\
        \ electric bolts. Was able to evade the targeting of a laser cannon), with\
        \ at least Subsonic flight speed with Jet Propulsion (Saved a woman from a\
        \ subway train at close range. Casually caught up to a cruise liner), and\
        \ at least Superhuman running speed (Ran at some appreciable percent of the\
        \ speed of a bazooka rocket) - Terry's suit is never shown to increase his\
        \ speed, and nothing suggests he grew faster as he aged. His Optional Equipment\
        \ has the following speeds: * Supersonic with the flying Batmobile (Can fly\
        \ at a top speed of Mach 3), with at least Subsonic speed with missiles *\
        \ Superhuman with the Bat-Sub (Should be at least comparable to the HMS Ambush,\
        \ which can move at approximately 35 mph), with Subsonic speed with Torpedoes\
        \ (Likely as fast as IRL present-day torpedoes) * Speed of Light attack speed\
        \ with Mr. Freeze's Cold Gun (This cold gun is laser-powered, meaning it's\
        \ a laser which has a cooling effect)"
