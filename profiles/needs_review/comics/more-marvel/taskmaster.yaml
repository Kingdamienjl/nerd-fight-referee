    - field: weaknesses
      value: 'Spider-Man''s various suit powers either have a limited duration or
        can only be used once before they must recharge. The Spider Armor-MK III suit
        cannot reflect sniper rounds. When using the Undies Suit''s One-Hit Kill ability,
        Spider-Man can also die in a single blow. His Spider-Sense can''t help him
        avoid opponents fast enough to blitz him. | The symbiote suit is weak to sound
        based attacks, however this weakness is removed once Peter gets the Anti-Venom
        suit. Notable Attack/Techniques: *Spider-Sense: Thanks to his Spider-Sense,
        Peter can be warned of incoming danger and attacks before they occur.Marvel''s
        Spider-Man (2018)Marvel''s Spider-Man 2 (2023) This ability is especially
        useful in preventing himself and others from being harmed. Regarding combat,
        his Spider-Sense''s warnings will differentiate between attacks that need
        to be blocked or dodged when the other option would not work. *Web-Shooters:
        Spider-Man''s iconic and main gadget. Mounted on each wrist, Spider-Man can
        use them to create web lines to maneuver around or interact with his environment.
        Capable of rapid firing shots of webbing to ensnare enemies. *Impact Web:
        This gadget fires out a more intense projectile of webbing than the standard
        Web-Shooters. The Impact Web''s effect is comparable to multiple shots from
        the Web-Shooters and has a more powerful knockback when hitting enemies. Hence,
        a single shoot can fully bind a target to the wall or ground. Also, should
        an affected target collide with another, it will also ensnare and bind them
        as well. *Spider-Drone: A small, multi-limb drone. Spider-Man can deploy them
        to aid him in combat. The drone provides support with a small energy blaster
        that is used to attack and stun enemies. It can also be used for reconnaissance
        due to its small size and the ability for Spider-Man to see through its eyes.
        *Electric Web: This modification provides a small electric charge to each
        of Spider-Man web shots before they fire. This can be used to power certain
        electronic conduits. When used on enemies, it will temporarily stun them with
        the electricity arcing to other enemies near, stunning them as well. *Web
        Bomb: A proximity-triggered explosive that instantly ensnares all enemies
        in detonation range with webbing. Can be stuck to walls or objects. *Trip
        Mines: A small device that can be attached to walls or even an enemy. Once
        it detects an enemy, it hits them with a web line and slams them into whatever
        it was originally attached to, binding them to it with webbing. *Concussive
        Blast: This gadget emits a powerful sonic wave in front of Spider-Man, causing
        nearby enemies to be blown backwards with great force. *Suspension Matrix:
        When deployed, this device emits a gravity field that leaves enemies suspended
        in the air and vulnerable. Suit'
