    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Genius Intelligence, Martial Arts,
        Self-Sustenance (Type 1: Can survive falling through space), Social Influencing,
        Longevity (Frost Giants tend to live for around 5000 years), Magic (The backbone
        of most of Loki''s arsenal. Was taught magic by Frigga and is one of the most
        accomplished sorcerers in Asgard), Energy Projection (Frequently uses green
        energy blasts), Illusion Creation, Shapeshifting and Duplication (Can create
        convincing holographic projections of objects and others, and duplicate himself
        or take the appearance of others down to their molecular structure. Loki has
        explained that these powers are separate), Telekinesis, Perception Manipulation
        (Made himself invisible to Heimdall. Made an illusion of himself visible to
        Thor, but not on S.H.I.E.L.D. security cameras. A projection of himself was
        visible to Selvig but not for Nick Fury.), Mind Manipulation, Mind Control
        and Memory Manipulation (His Sacred Timeline self read all of Valkyrie''s
        memories of her fight against Hela. Learned enchantment from Sylvie, which
        works on beings as powerful as Alioth), Non-Physical Interaction (His magic
        was able to interact with Alioth, who is created from tears in reality and
        consumes time and space directly), Regeneration (Low-Mid: Should compare to
        his Sacred Timeline self. Survived a brutal beating from the Hulk), Summoning
        and limited Matter Manipulation (Summoned his daggers to hand. Summoned the
        Casket of Ancient Winters and then unsummoned it by waving his hand. Unsummoned
        a sword he had been given by Kid Loki.), Cloth Manipulation and Creation (Frequently
        conjures clothes and other miscellaneous equipment), Darkness Manipulation
        (Manipulated the appearance of his shadows and could use them to physically
        restrain X-5. Notably, one of these manipulable shadows was formed by a clone
        of himself), Local BFR (Teleported a man out of a building and into a cage),
        Telepathy, Dimensional Travel, Power Bestowal (All according to Word of God)'
      source_id: character-stats-profiles-morbius-more-marvel
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: 'At most Large Star level (Compares to characters like Heimdall who can
        destroy Dark Elf Harrows that are powered by black holes, and Doctor Strange''s
        most casual magic, that can dispel a 0.3 FOE black hole. Is physically the
        same Loki that can fight Brunnhilde (Valkyrie), albeit briefly. Is Sylvie''s
        equal. Even with his magic completely negated, he is still vastly more powerful
        than every TVA Minutemen, with multiple required to restrain him) | Low Complex
        Multiverse level (At least Sixth-Dimensional: Completely transcendent of time
        itself, which includes the hyper-time of places like the End of Time and the
        TVA, where regular Time Manipulation does not work. His Time Stop is so powerful
        that it works at the End of Time. Destroyed the Temporal Loom with magic,
        a device capable of causing an explosion so potent it can delete an infinitely
        expanding Multiverse and the TVA as a failsafe for the Sacred Timeline. Weaved
        together the Multiverse into an Yggdrasil structure, which is infinite and
        further expanding with infinite more branches every second. Scales to his
        durability.)'
      source_id: character-stats-profiles-morbius-more-marvel
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Superhuman with at least Relativistic+ Combat Speed (Vastly above Captain
        America who can react to Repulsor Blasts. Can fight other versions of himself)
        | Inaccessible, likely Immesurable (Capable of moving in a temporally decayed
        TVA that left a void. Is not governed by time in at least two dimensional
        axes), Omnipresent within the Multiverse (The branches are directly tied to
        his magic)
      source_id: character-stats-profiles-morbius-more-marvel
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: At most Large Star level (Endured attacks from Sylvie, a variant of himself)
        | Low Complex Multiverse level (Spaghettification does not affect him, which
        can fully erase the TVA leaving absolutely nothing behind. Unaffected by the
        Temporal Loom's explosion or holding branches containing whole timelines.)
      source_id: character-stats-profiles-morbius-more-marvel
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Slightly carefree and arrogant, though these mellow down as the series
        continues, Destroyed the Temporal Loom with magic and directly tanked the
        explosion. He Who Remains stated the Loom was a failsafe device, made to explode
        if overloaded with branches, deleting all bar the Sacred Timeline. This is
        a Low 1-C explosion, as it can account for infinite expansion which continues
        without stopping., Loki would then pull all the branches, each containing
        entire timelines which branch themselves into new timelines endlessly, into
        an Yggdrasil, physically manipulating them and sending his magic through all
        of them to revive the Multiverse. This is a 5-D feat bare minimum., Loki is
        completely above time, Regular time, inside universes of the multiverse, where
        time travel is possible, The enhanced time, of realms outside the multiverse,
        including the domain of the TVA and the End of Time. Time here is fully linear,
        yet Loki can easily time travel to change events in the past and can use time
        stop at the End of Time, which should not be possible based on regular rules
        stated by both Mobius and Ouroboros., Loki having such power over time, in
        both the Multiverse, results in God Loki being 6-D in Low 1-C., To expand
        on this: Spaghettification (See Note 1), a temporal decay phenomena that can
        wipe even the TVA leaving a void of complete nothingness, is ineffective against
        Loki. Based on established cosmology, this is 6-D durability, confirming even
        severe breakdowns in hypertime cannot affect him even remotely., This is also
        Inaccessible, likely Immesurable speed, as Loki could move in said void.,
        Further supplementing this feat is that Loki can fully stop spaghettification
        and even reverse it, spaghettification is a phenomena in Loki which occurs
        in either two circumstances: extreme temporal radiation, or the decay of space-time.
        This causes reality and beings in that reality to deconstruct into spaghetti-like
        tendrils, hence the namesake. The most impressive part of this is that, after
        the ending of episode 5, Loki is completely'
      source_id: character-stats-profiles-morbius-more-marvel
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
