    - field: weaknesses
      value: 'As demonstrated by the Choke, an extremely specific frequency of sound
        can nullify his mutant abilities for a few minutes. Struggles with his own
        schizophrenia. The schizophrenia shouldn''t be much a problem as in the last
        season, the last few episodes he has shown to be able to have a better control
        over himself Notable Attacks/Techniques: *Telepathy: This was one of his first
        abilities, that he gained control of. This ability allows his read the minds
        of others and control them. As he gained more control, his power grew to new
        heights. David was able to mentally overpower the Shadow King and force it
        out of its current host, forcing it to flee. Because of the strength of his
        mind, other mutants with powers that deal with the mind may meet some sort
        of resistance and prevent those powers from successfully being used on him
        such as when he blocked Ptonomy Wallace from using his memory manipulation
        powers on him. **Illusion Creation: David can create telepathic illusions,
        and influence multiple people at once. **Astral Projection: Using his psychic
        abilities, David is able to enter the Astral plane. In the Astral plane, time
        is vastly slowed down, allowing the user, to communicate with other telepaths
        on this plane. He is able capable of using the Astral Plane in combat against
        other telepaths, like the Shadow King. *Matter Manipulation: As part of his
        power, David is capable of manipulating and altering matter. When the Shadow
        King was in control of his body, he was able to fuse soldiers with the environment
        using this ability. When confronting the men that took his sister Amy, David
        was able to make the ground "melt" then put it back to his normal state so
        that the soldiers were imprisoned in the ground. *Teleportation: This ability
        allows David to travel long distances in an instant. David is capable of teleporting
        others along with him. This power first manifested while in the MRI, when
        due to fear, he teleported the entire machine. This ability is usually accompanied
        by a glow of energy, before he teleports. *Reality Warping: He is capable
        of altering reality using his immense psychic power. Despite being one of
        his most powerful abilities, it is this one that he has the least control
        over. When someone else was in his body, they were capable of casually removing
        every door from his mental institution. This is an incredibly dangerous ability,
        and if used carelessly could have severe negative consequences. *Telekinesis:
        He is able to move objects using this ability. As he gained more control over
        his abilities, his strength grew. He went from simply flinging kitchen appliances,
        to being able to casually put a large amount of soldiers in a pile. **Telekinetic
        Levitation: David levitates into the air, and flies towards his opponent as
        he did when he confronted the Shadow King. *Energy Manipulation: He is capable
        of manipulating energy, as a defense. When he was going to be electrocuted,
        he was able to send the electricity back burning his interrogators. By snapping
        his fingers David can create a flash of light that disintegrates human bodies.
        **Energy Field Generation: While charging at the Shadow King, David was able
        to generate a blue hued bubble of energy around himself, to protect himself
        from the impact. *Sound Dampening: He was able to completely remove all sound
        from an entire house and the surrounding area outside of it, making the entire
        space completely silent. *Time Manipulation: After being shot at by bullets,
        David temporarily froze time. Allowing him and others to move freely in the
        Astral plane. *Electricity Manipulation: David was able to generate arcs of
        lightning from his body, while running towards the Shadow King. *Clairvoyance:
        David is able to see things happening in other places, he was able to see
        that his sister was in distress, while he was sitting alone on a dock. Note:
        The creator of the series has stated multiple times that Legion is not a part
        of the X-Men film universe. ==References== {{scroll box|content={{reflist|2}}}}
