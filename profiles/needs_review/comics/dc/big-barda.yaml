      value: "Very slow-witted and overconfident. Weak to electricity. Note: Kalibak\
        \ could be argued to scale to Superman due to their battle in \u201CFather\u2019\
        s Day,\u201D where he put up a decent fight against him, appearing to struggle\
        \ evenly with the Man of Steel. Even putting aside the fact that the fight\
        \ ends with Superman appearing to get serious (as in, tap into more of his\
        \ full strength) and utterly steamrolling Kalibak, there\u2019s ample feats\
        \ and scaling that demonstrate that Superman is consistently far more powerful\
        \ than Kalibak, to the extent that I personally don\u2019t agree with scaling\
        \ Kalibak to Superman\u2019s true strength. Firstly, every single other encounter\
        \ between Kalibak and Superman ends with Kalibak getting stomped - \u201C\
        Apokolips Now\u201D shows a fatigued, beat-to-hell Superman knocking Kalibak\
        \ out with one punch, \u201CLegacy\u201D shows Superman three-shotting Kalibak,\
        \ and \u201CHereafter\u201D shows Superman, once more, defeating Kalibak in\
        \ a single blow. Secondly, Lobo - who as explained in his page does not scale\
        \ to Superman\u2019s full strength - utterly stomped Kalibak during \u201C\
        Hereafter\u201D without breaking a sweat. Thirdly, Darkseid, who is equal\
        \ to Superman, considers Kalibak a weak disappointment. Note 2: Bruce Timm\
