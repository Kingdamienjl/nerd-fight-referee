- id: claim-range-1f03978e
  section: power_scale
  axis: range
  text: Extended Melee Range with her Mega Rod, Tens of Meters with her Mega Rod's
    concussive blasts (Can rip through the hull of a warship), at least Intergalactic
    with Mega Rod (She teleported Lobo to another Galaxy), Interdimensional with her
    Mother Box (Can reach across space-time and into other universes)
  source_ids: *id003
  decisive: false
  status: unverified
