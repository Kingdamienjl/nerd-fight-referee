- id: claim-standard-equipment-09c82fa6
  section: equipment
  axis: equipment
  text: '* Apokolilptian Armor: Barda retained her Apokoliptian armor after escaping
    to Earth, using it to supplement her already impressive durability, being able
    to withstand attacks from other New Gods and their weaponry. * Mega Rod: Barda''s
    signature weapon, a virtually indestructible rod with the functional components
    of a Mother Box. As a result, it is a powerful melee weapon that can easily clash
    with weapons like Wonder Woman''s sword without suffering damage and can project
    powerful concussive blasts across a wide range that can tear through the hulls
    of armored warships and force back entities as durable as Superman. * Mother Box:
    A sentient supercomputer kept on Barda''s person at all times, its most well-known
    usage is its ability to create "Boom Tubes" that can transport Barda virtually
    anywhere she desires, between planets, solar systems, and even universes. They
    can also manipulate the gravitational constant of the surrounding area, allow
    Barda to survive in inhospitable conditions like the vacuum of space, manipulate
    and evolve non-sentient machines, heal Barda and sustain her in the face of life-threatening
    injuries, and transfer energy from one place to another. * Aero Discs: Special
    devices that can defy gravity, Big Barda can stand upon them in order to simulate
    flight, being able to maneuver through the air freely while using them.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-bc72f84f
  section: power_scale
  axis: battle_iq
  text: Genius in combat, Gifted otherwise (Having been groomed from an early age
    to be the leader of Darkseid's Female Furies, Barda is a master of all weapons
    and forms of hand-to-hand combat, utilizing everything from swords, to clubs,
    to rifles and cannons with great proficiency and stalemating combatants as skillful
    as Wonder Woman. She was able to thoroughly trounce the combined forces of the
    Female Furies while fighting alongside Wonder Woman. In addition, like most New
    Gods, Barda is naturally more intelligent than most humans due to her exposure
    to the Source. This allowed her to help her husband Scott design and construct
    numerous dangerous traps for use in his death-defying acts)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-0eab1fd9
  section: weaknesses
  axis: weakness
  text: 'Like all New Gods, Barda is vulnerable to Radion, a substance that can potentially
    bypass her natural durability if weaponized against her in the form of a blaster
    or a bomb. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
