    Category:Immortals Category:Gods Category:Healers Category:Flight Users Category:Gravity
    Users Category:Warriors Category:Heroes Category:Married Characters Category:Justice
    League Members Category:New Gods Category:Armor Users Category:Disc Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-5152bbfc
  section: abilities
  axis: hax
  text: '* New God Physiology * Superhuman Physical Characteristics * Weapon Mastery
    * Master Hand-to-Hand Combatant * Immortality (Type 1 and 4 - When gods die, they
    return to the Source, but sometimes have the power to escape it and return to
    life) * Gravity Manipulation with her Mega Rod and, Portal Creation with her Boom
    Tube and Mega Rod * Flight with her Aero Discs and Mega Rod * Energy Manipulation,
    Technology Manipulation, and Healing with her Mother Box * Energy Projection with
    her Mega Rod * Forcefield Creation with her Mega Rod Resistance to: * Disease
    Manipulation (Due to her New God physiology, Barda is virtually immune to all
    earthly diseases), can survive in space with her Mother Box * Telepathy with her
