    - field: weaknesses
      value: 'Optimus sometimes holds back | None notable | His forcefield can be
        weakened by cryostasis Notable Attacks/Tehniques: * Hand-To-Hand Combat Expirience
        and Skills ** Salat (As seen in The Last Knight) ** Medival Styled Combat
        ** Wrestling ** Grappeling ** Judo ** Metallikato * Heat-Based Weaponry (Optimus
        possesses multiple heat based weaponry, ranging from swords to hooks. These
        weapons are hot enough to slice through Cybertronian armor) * Long ranged
        Weaponry (ptimus can either dual wield or single wield Ion Blasters as his
        primary form of long range attack) * Parachutes (Optimus can deploy parachutes
        when falling from tall heights) * Protoforming (Optimus can shed his outer
        armor as a means of travelling through space as a protoform) * Jet Thrusters
        (Within Jetpower Mode; Capable of being used not only for flight, but as shoulder
        mounted blasters against opponents) * Trailer Weapons Pack (Optimus now possesses
        a far greater variety of weapons, ranging from knuckle dusters, chainsaws
        and shoulder mounted guns. Also possesses more variety of long range weaponry
        * Forcefield (Possesses a powerful Forcefield that not even DoTM Megatron
        could break through, capable of even resisting his Life Drain The Forcefield
        completely wraps his entire body * Flight Tech (When up against opponents
        stronger or much larger than himself, Optimus will deploy the Flight Tech,
        granting him flight and increasing his attack power) * Matrix of Leadership
        (An ancient relic designed to power a star harvester. It is also capable of
        reviving other Transformers) * Temenos Sword (A weapon belonging to the Knights
        of Cybertrons, strong enough to cut through opponents as strong if not stronger
        than Optimus) * Heat-Based Weaponry (Optimus possesses heat based weaponry
        such as arm mounted blades. These weapons are hot enough to slice through
        Cybertronian armor) * Vector Shield (Used primarily as Optimus main form of
        defense and long range weapon. Has a built in blaster that can be used against
        opponents from a distance) Notes: - "Base Prime does not scale to The Fallen,
        the Jetpower upgrade was easily toren apart" first of all, he does, Optimus
        was barely phased by his attacks and The Fallen only mananged to knock him
        back and not to mention he was being jumped by The Fallen AND Megatron all
        at same time, second, Jetpower''s arsenal was rendered useless to The Fallen
        as he tanked every gunfire from it and yes he did tore it apart, that wouldn''t
        mean nothing as of my previous statement, third, the movie databook already
        confirms their power levels, fourth, The Fallen feared coming to Earth with
        Prime on it, b4 you say he was just catious, that is just a stupid claim,
        The Fallen knew very well of what Prime is capable of (As he casually ripped
        off The Fallen''s face and pierced through him like Omni-Man did to Immortal)
        and all other Primes aswell, that is pretty much a bloodlinked conclusion.
        "Jetpower received no damage and was sent at least 2 meters away by Megatron''s
        blaster cannon, yet in the forest fight before Jetpower upgrade and RoTF,
        OP was sent flying multiple meters away by that same cannon", do I need to
        mention OP was literally 3v1-ing some of the strongest Decepticons and was
        heavily weakened when he received the shot?- - Strength of the verses Cybertronians''
        and Decepticons'' weaponry aren''t linearly ranked and that''s consistent.
        Optimus'' blasters which have a yield of 3 kilotons of TNT and Iron Hide''s
        blasters have yield strength of 10 to 12 kilotons of TNT, that would mean
        Iron Hide''s blasters are stronger than Prime''s even tho Iron Hide is far
        inferior than Prime. Strength of the weapons isn''t stated to be so linear,
        weapons can be stronger or weaker than the wielder of a different rank, the
        gaps between other guns can be wide in comparison. There''s also no reason
        for standard weaponry even beyond your average Cybertronian gun to be stronger
        than Prime himself, unless it''s explicitly stated to be on another caliber.
        Also, Prime''s Energon Blades seem to be of Prime''s known speciality, hell
        even the Blades to more significantly more damage than his blasters, this
        is for 2007/DoTM Optimus, also it''s important to point out that characters
        like Demolisher could be killed by 10-12 kilotons of TNT of firepower, making
        him a low tier of the verse. B4 you say "Well why did such a high tier being
        like OP struggled against an such a weak opponent? Surely they''re not as
        strong as you claim." that is just false af, considering the strength of the
        characters from a narrative standpoint, OP and IH never struggled with Demolisher,
        bro ran the moment he was interrogated and was also MASSIVE in height, yet
        was put down by guns that scale significatly less than their wielders, that
        is not an anti-feat to high tier characters, neither is it a flaw in the scale.
