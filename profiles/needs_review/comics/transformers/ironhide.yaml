        weapons are hot enough to slice through Cybertronian armor) * Long ranged
        Weaponry (ptimus can either dual wield or single wield Ion Blasters as his
        primary form of long range attack) * Parachutes (Optimus can deploy parachutes
        when falling from tall heights) * Protoforming (Optimus can shed his outer
        armor as a means of travelling through space as a protoform) * Jet Thrusters
        (Within Jetpower Mode; Capable of being used not only for flight, but as shoulder
        mounted blasters against opponents) * Trailer Weapons Pack (Optimus now possesses
        a far greater variety of weapons, ranging from knuckle dusters, chainsaws
        and shoulder mounted guns. Also possesses more variety of long range weaponry
        * Forcefield (Possesses a powerful Forcefield that not even DoTM Megatron
        could break through, capable of even resisting his Life Drain The Forcefield
        completely wraps his entire body * Flight Tech (When up against opponents
        stronger or much larger than himself, Optimus will deploy the Flight Tech,
        granting him flight and increasing his attack power) * Matrix of Leadership
        (An ancient relic designed to power a star harvester. It is also capable of
        reviving other Transformers) * Temenos Sword (A weapon belonging to the Knights
        of Cybertrons, strong enough to cut through opponents as strong if not stronger
        than Optimus) * Heat-Based Weaponry (Optimus possesses heat based weaponry
        such as arm mounted blades. These weapons are hot enough to slice through
        Cybertronian armor) * Vector Shield (Used primarily as Optimus main form of
        defense and long range weapon. Has a built in blaster that can be used against
        opponents from a distance) Notes: - "Base Prime does not scale to The Fallen,
