        Optimus can heal from more minor injuries and was able to heal from the hole
        in his chest overtime) * Longevity (Optimus has been alive for thousands of
        years) * Space Survival * Martial Arts (Optimus has been shown to be a very
        capable combatant, taking on hordes of decepticons on his own, as well as
        using several Earth based Martial Arts moves. Optimus was trained by Sentinel
        Prime, who is considered one of Cybertron''s greatest warriors) * Weapon Mastery
        (Optimus is capable of utilizing a wide array of weapons, ranging from different
        types of guns to melee weapons like Axes, Swords and Chainsaws) * Temperature
        Manipulation (Via Optimus prime''s heat based weaponry) * Explosion Manipulation
        (With weaponry) * Acrobatics (All-Terrain Mobility & Hypermobility; Shown
        to be quite agile, with him often being able to perform several parkour stunts,
        such as here) * Enhanced Senses & Information Analysis (Cybertronians can
        typically scan and analyse their surroundings) * Adaptation (Can scan new
        vehicles for disguises) * Social Influencing ** Charisma, Social Position
        and Leadership (Optimus is an inspiring leader, being able to inspire even
        the more pessimistic Autobots like Crosshairs) * Extrasensory Perception (Optimus
        sensed the presence of Megatron within Galvatron''s body) Following Resistances
        on: * Biological Manipulation, Poison Manipulation & Disease Manipulation
        (Due to his Cybertronian physiology, he should be immune to biological attacks)
        * Temperature Manipulation (Capable of tanking Earth''s re-entry, which would
        have a temperature of 3000 degrees F) * Cosmic Radiations (Cybertronians can
        easily move through the harsh vacuum of space undeterred) Jetpower Mode: All
        previous abilities on an enhanced scale including the following: * Fusionism
        (Merged with Jetfire) * Flight (Capable of flying due to Jetfire''s parts)
        * Enhanced Large Size (Type 0; With his added armor, Optimus is now 40 feet)
        * Bodily Weaponry (Artificial; His back thrusters function as cannons) DoTM-TLK:
        All previous abilities without Jetpower Mode on an enhanced scale including
        the following: * Forcefield Creation (Capable of creating a forcefield around
        himself) * Statistics Amplification (Via Stealth Force; Also able to mount
        several weapons or the Flight Tech upon himself to add onto his power) * Flight
        (With the Flight Tech. As of AoE, Optimus now has rocket boosters that allow
        him flight to space) * Resurrection & Life Manipulation (With the Matrix of
