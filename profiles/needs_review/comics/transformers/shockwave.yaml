    - field: weaknesses
      value: "None notable Notable Attacks/Techniques: |-|Shockwave= Shockwave has\
        \ been shown to turn off all higher functions of his brain during a situation\
        \ he deems completely illogical. The only functions that remain are anger\
        \ and knowledge of fighting. While this \"rage\" protocol was active, he was\
        \ able to make short work of Grimlock, and the other Dinobots. |-|Shockwave\
        \ (Regenesis)= *Ore-1 Ore-1 grants Shockwave absolute control over time itself,\
        \ allowing him to travel towards all points in time as well as shift others\
        \ through time, reverse and forward time and warp reality to his will. Shockwave\
        \ used the power of Ore 1 to forward the universe to its death. *Ore-2 Ore-2\
        \ grants Shockwave the power over death. It causes a localized decaying effect\
        \ and anything it comes into contact with will instantly drain the life off\
        \ of its targets. It also functions similarly to the death powers of Nova\
        \ Prime, Galvatron and the D-Void. *Ore-3 Launched some 600,000 years ago,\
        \ Ore-3 landed on the planet Prion and took root, seeding the planet with\
        \ its unique ore. Exactly what the ore does is unclear, but it may have some\
        \ control over mass shifting, and allows Shockwave to change its size. *Ore-4\
        \ As part of his Regenesis project, Shockwave seeded Caminus with Ore-4 600,000\
        \ years ago. Ore-4 is capable of controlling gravity, allowing Shockwave to\
        \ increase it to crush opponents or use it as a means of levitation. Shockwave\
        \ can also use Ore-4 to bend light in order to make himself invisible. *Ore-5\
        \ One of Shockwave's Regenesis ores, Ore-5, \"Combination\", was seeded on\
        \ the planet Devisiun. Exactly what the ore does is unclear, but it presumably\
        \ involves combining things in some fashion, likely merging with other bots.\
        \ *Ore-6 Ore 6 allows Shockwave to absorb heat and energy on a planetary scale,\
        \ being able to reduce a planet into a cold, freezing state. Ore 6 and Ore\
        \ 8 allows Shockwave full control of all potential energy sources in the universe.\
        \ Absorbed massive amounts of energy from the dead universe. *Ore-7 Ore-7\
        \ is a variety of energon possessed with mysterious powers of transmutation.\
        \ This allows Shockwave to convert materials into another form, such as converting\
        \ organic matter into metal and raw energy. It also allows him to heal himself\
        \ from grievous wounds, and create immunities to diseases. *Ore-8 Ore 8 emits\
        \ highly unstable radioactive energy, allowing anyone who is exposed to it\
        \ be driven insane by it. It can also cause illusions to those affected by\
        \ it. It is very unstable and highly explosive. Ore 6 and Ore 8 allows Shockwave\
        \ full control of all potential energy sources in the universe. *Ore-9 Ore-9\
        \ is capable of warping space. This allows Shockwave to move anywhere he wants\
        \ throughout the universe, as well as warp objects through space and to different\
        \ locations. *Ore-10 Ore-10 is a crystalline energon derivative, capable of\
        \ literally \"fueling deception\" by reprogramming the minds of Cybertronians.\
        \ This allows Shockwave to bend minds to his own will. *Ore-11 One of Shockwave's\
        \ Regenesis ores, Ore-11, \"Evolution\", generated on the planet Eukaris.\
        \ Exposure to the ore is capable of mutating the Cybertronian body into a\
        \ monstrous\u2014but highly resilient and versatile\u2014new form. This would\
        \ allow Shockwave to adapt to a new situation as he sees fit. *Ore-12 Ore-12,\
        \ \"Protection,\" is a variety of energon. When properly \"bonded\" to the\
        \ body of a living being, it becomes a symbiotic suit of crystalline armor,\
        \ capable of changing shape to accommodate the needs of its wearer while providing\
        \ protection from even the harshest of environments. *Ore-13 Ore-13 is the\
        \ last of a series of artificially-created energon-derived ores seeded throughout\
        \ the galaxy by Decepticon scientist Shockwave as part of his Regenesis project.\
        \ Taking root on the planet Earth, Ore-13 boosts the power of The Transformers\
        \ to extreme levels, leading those who later discovered it to term it \"Ultra-Energon\"\
        ; Shockwave favored the more prosaic name of \"Power Itself\" when christening\
        \ the various ores after their different effects. It is not without drawbacks,\
        \ however: while it will grant a user massively enhanced strength and durability,\
        \ the more its power is drawn upon, the faster it burns out, leaving a user\
        \ at risk of sudden de-powering in mid-combat. *Ore-14 Ore-14 is a variety\
        \ of energon. It has the power to \"resurrect\" The Transformers and even\
        \ entire cities, as well as heal others and himself from the most grievous\
        \ of wounds."
