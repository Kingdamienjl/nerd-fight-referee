        of the Regenesis OresThe Transformers Spotlight: Shockwave, physic defying
        energy sources that went combined together, could collapse the universe entirely.
        With these ores, Shockwave enacted the Regenesis plan, a plan that would allow
        Shockwave to absorb the Universe into himself and fuel Cybertron for all eternity.
        Shockwave was renowned as Jhiaxus'' greatest studentThe Transformers Spotlight:
        Doubledealer. In his days as a senator, he managed to come into contact with
        the Omega GuardiansThe Transformers: More Than Meets The Eye #11, and advanced,
        higher dimensional civilization. Even in his early years, Shockwave would
        predict an energon shortage in the futureThe Transformers (2014) #17, and
        would attempt to manufacture a self-regenerating energy source, but never
        had the opportunity to fully test it. Shockwave would be responsible for the
        creation of the Phase SixersThe Transformers: More Than Meets The Eye #14.
        Helped build Megatron''s new body despite limited resources, even giving it
        a space bridge. While under the guise of Onyx, Shockwave would manufacture
        a plan that would sacrifice all of Cybertron''s colony worlds to Unicron,
        so that he may poison Unicron with the magical Talisman and restart the Cybertronian
        empire under his own image from scratchTransformers: Unicron #3. Once commandeered
        a WarworldThe Transformers: More Than Meets The Eye #6. Distributed Megatron''s
        gun in an area he knw would create the most chaosThe Transformers (2009) #15.
        Prior to his empurata, Shockwave was a well accomplished Senator. Shockwave
        announced the founding of the Jhiaxian Academy of Advanced TechnologyThe Transformers
        (2014) #17, and for years, would use the academy as a secret safe haven for
        OutliersThe Transformers: More Than Meets The Eye #11, Cybertronians with
        abilities not aligned to their alt modes. During his senate year, he would
        begin looking for suitable candidatesThe Transformers (2014) #17 for who would
        be most suitable to lead CybertronThe Transformers: More Than Meets The Eye
        #11. Alongside Orion Pax, Shockwave would uncover a secret plot by the senate
        to frame the Decepticons for terrorismThe Transformers: More Than Meets The
        Eye #10. By replacing their lost memories with data of the Autobots and Decepticons
        of Cybertron, Shockwave convinced the amnesiac Maximals that they were all
        combatants in the Great War, remaking them into copies of key players in the
        conflict and even rebuilding one of their number into a copy of himself. After
        conditioning them, he pitted the "Autobots" and "Decepticons" against one
        another in a series of simulated wargames for his tactical benefitRevolutionaries
        #5. Using his knowledge of the future, Shockwave would then shape and manipulate
        Cybertronian history to his image, ensuring that certain events would come
        to pass all while posing as Onyx Prime for millions for years while remaining
        undetectedOptimus Prime #18. Healed Orion Pax from his woundsThe Transformers:
