        \ out of their minds, Resurrection (Dialga, an aspect of Arceus brings back\
        \ to life someone who had been been erased from time), Space-Time Manipulation,\
        \ Time Travel, Time Stop (Stops a wave of spatial distortion in its tracks\
        \ that was annihilating all matter in its path, not even the Creation Trio\
