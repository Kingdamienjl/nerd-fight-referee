    - field: speed
      value: "Arceus immediately strikes the foes with great force, which is virtually\
        \ impossible to properly react to. * Gravity: Arceus pins its foe down by\
        \ rapidly increasing gravity around its target. * Refresh: Arceus cleanses\
        \ itself, removing any inhibitory status effects such as paralysis, burns,\
        \ and poison. * Perish Song: Arceus lets out a melody that instantly incapacitates\
        \ all who hear it (including Arceus itself) after a set amount of time. *\
        \ Earth Power: Arceus shifts the earth under its target to release a massive\
        \ upheaval of energy. * Recover: Arceus concentrates its internal energies,\
        \ quickly healing most wounds. * Future Sight: Arceus prepares a powerful\
        \ psychic attack which strikes the opponent later on. It ignores moves like\
        \ Protect and Detect, meaning barriers and precog don't help against it. Future\
        \ Sight has a second ability that allows the user to see into the future.\
        \ * Cosmic Power: Arceus absorbs a cosmic power to boost its defense and special\
        \ defense. * Punishment: Arceus physically strikes the opponent with a dark\
        \ attack that increases in power the more the opponent boosts their stats.\
        \ * Hyper Voice: Arceus lets off an extremely loud roar that damages the opponent.\
        \ It also bypasses moves like Substitute. * Natural Gift: Arceus attacks by\
        \ drawing power from its held berry. The Type and power are dependent on the\
        \ berry in question. This also consumes the berry. * Seismic Toss: The target\
        \ is thrown using the power of gravity. It inflicts damage equal to the user's\
        \ level. * Hyper Beam: Arceus fires off a destructive beam of energy. Unlike\
        \ most Pok\xE9mon it doesn't appear to need to recharge afterwards. * Outrage:\
        \ Arceus rampages and attacks for a while. If there are multiple opponents\
        \ each series of attacks will be directed at a random one. This leaves Arceus\
        \ confused afterwards. * Shadow Claw: Arceus slashes at its opponent with\
