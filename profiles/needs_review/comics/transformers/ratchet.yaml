  section: equipment
  axis: equipment
  text: Flight (Via Levitator/Jetpack), Non-Standard Breathing (Can breathe in space,
    poisonous environments, or underwater indefinitely via O2 Mask), Fire Manipulation,
    Ice Manipulation and Absolute Zero (Via Cryoshot/Freeze Omega Mod/Zero-Kelvin
    Diode Nanoswarmers), Electricity Manipulation, Plasma Manipulation, Transmutation
    (Has 8 different guns that transforms enemies into animals, or even snowmen. The
    bigger the enemy, the longer it takes), Forcefield Creation (Has numerous barriers
    such as the Tesla Shield, which allows Ratchet to stop all attacks from hurting
    him for a brief time), Healing and Regeneration (Low; Can restore damage he has
    taken by collecting Nanotech), Life Manipulation (Healing Mod can steal vitality
    from enemies and give it to Ratchet), Decoy Creation (Can deploy a dummy of himself
    to distract enemies), Sound Manipulation (Taunter sends out a very irritating
    sound that attracts any enemy), Disguise Generation (Can use Hologuise to become
    an exact copy of a robot in the eyes of everyone else), Hacking (Via Hacker/Infiltrator/Trespasser
    and other devices), Summoning (Can call upon a horde of Nano-Swarmers or Netherbeasts
    to assist him), Energy Absorption (Many armor sets like the Mega-Bomb armor can
    absorb enemy damage and turn it into an extremely powerful attack), Interdimensional
    Travel (Aphelion comes with a Grav-o-metric Warp Drive to travel between galaxies
    in an instant. Dimensionator allows Ratchet to travel between dimensions), Mind
    Control (Hypno-matic can take control of certain robots in order to reach places
    Ratchet otherwise couldn't. Can also do this to normal enemies with the Vox Industries
    Brainwash mod), Minor Gravity Manipulation/Surface Scaling (Via Gravity Boots),
    Temporary Invulnerability (Can become completely invincible for a short time by
    breaking open an Inferno Crate), Statistics Amplification and Damage Reduction
    (Infernox Crates also boost the OmniWrench's power of Ratchet's wrench. Can augment
    his defense up to 96% damage reduction via Chameleon and Stalker Armor sets),
    Fear Manipulation (Nightmare Box deploys an image so horrifying, it makes enemies
    either run in fear or focus on destroying it immediately), Phasing (Stalker armor
    and Defragmenter allows Ratchet to fire projectiles or attack with strikes that
    pass through enemies), Size Manipulation (Shrink Ray either makes enemies incredibly
    tiny, make Ratchet a towering giant or shrink himself), Weather Manipulation (Thundersmack
    summons storm clouds to zap enemies with lightning), Time Manipulation (Zoni Gun
    allows Ratchet to slow time to a crawl), Infection (Upon hitting an enemy, Infecto
    Bomb infects their mind and forces them to turn on their allies, before eventually
    dying to the infection itself), Crystal Manipulation (Crystallix armor generates
    a mass of crystals upon performing a Hyper Strike with OmniWrench to damage foes),
    Sludge Manipulation and Corrosion Inducement (Sludge Mk. 9 armor coats any projectiles
    in corrosive sludge to slow down the attack's speed), Attack Reflection (Refractor
    can reflect all laser-based attacks back to an enemy), Explosion Manipulation
    (Several of Ratchet's weapons can turn enemies into walking bombs which explode
    on-contact with another enemy. Some of the enemies he transmutes and his Mega-Bomb
    armor can spread explosions around the area), Invisibility (Chameleon Armor allows
    Ratchet to almost become invisible while moving), Poison Manipulation (Acid Mod/Sludge
    Mk. 9 armor/Nano-swarmers are capable of inflicting enemies with poison), Shockwave
    Manipulation (Box Breaker allows Ratchet to unleash a powerful shockwave that
    destroys all nearby breakable objects), Teleportation (Via Warp Pad), Matter/Antimatter
    Manipulation, Black Hole Creation, Durability Negation (OmniWrench can phase through
    an enemy and infect them with poison and fire to destroy them from the inside
    via Stalker armor), BFR (Rift Ripper and Suck Cannon can remove enemies either
    by warping them to another dimension or sucking them into a storage unit)
