        *Notable Attacks : Bombs: Bomberman wields a wide variety of Bombs, being
        capable of creating them upon a whim. He eventually learns the abilities to
        control their movement and detonate his regular bombs. Fire Bomb: The most
        common type of bomb variant. Creates a cross of flame when it explodes, doing
        more damage than the Normal Bomb. Navarm Bomb: An upgraded version of the
        Fire Bomb which uses napalm. Overall, just a stronger, more explosive version
        of the Fire Bomb. Water Bomb: A bomb that creates a gushing torrent of water
        upon detonation. Useful for putting out fires. Ice Bomb: A bomb made of ice
        which creates a blast of cold, capable of freezing its victims solid. Wind
        Bomb: This bomb creates four gusts of wind, which don''t deal any actual damage.
        Instead, they push people they come into contact with away from the epicenter.
        Rubber Bomb: When kicked or thrown, rubber bombs will bounce in a straight
        line (and back, if they hit a wall) until detonation, making them dangerous
        in their mobility. Bait Bomb: This bomb attracts (non-intelligent) enemies,
        such as animals or non-sapient robots, to it before exploding. Its explosion
        is weaker than that of a normal bomb. Remote Bomb: These bombs come with remotes,
        which lets Bomberman decide when to detonate them. Pierce Bomb: Has the same
        range and power as a Normal Bomb but is able to blast through multiple walls
        in each direction at once instead of just one each. Mine Bomb: Functions as
        a landmine. Thunder Bomb: This one releases a bolt of lightning when it detonates,
        shocking everyone around it. Salt Bomb: A bomb that explodes into a cloud
        of salt. Useful for fighting slug enemies, or people with open cuts. Bead
        Bomb: Marble-sized bombs that can be rolled before detonating. Have smaller,
        weaker explosions, but high range. Light Bomb: This bomb releases a flash
        of blinding light, which actually freezes time for a brief moment at the epicenter.
        Homing Bomb: A Fire Bomb that follows the opponent after it is used. Dangerous
        Bomb: This is a special type. Created when two moving bombs collide, Dangerous
        Bombs are massive weapons with enormous destructive potential. When they blow,
        the explosion is big enough to cover almost an entire battlefield. Gravity
        Bomb: Once they explode, Gravity Bombs create black holes, which can one-shot
        most foes and destroy otherwise. Memory Cartridges: Modeled after the Prototype
        Bomber (a legendary Bomber with unlimited expandability), Bomberman can intake
        the Memory Cartridges of any robot throughout the universe and instantly master
        their abilities. ATLAS/P-Body Bomber Memory Cartridge: Bomberman masters the
        portal creating capabilities of the ATLAS Bomber and the P-Body Bomber. Arbiter
        Bomber Memory Cartridge: Bomberman masters the sword creating and wielding
        capabilities of Arbiter Bomber. Raiden Bomber Memory Cartridge: Bomberman
        masters the ninja running capabilities of Raiden Bomber. Vic Viper/Vicviper
        Zero Bomber Memory Cartridge: Bomberman masters the jetting speed boosting
        capabilities of Vic Viper Bomber and Vic Viper Zero Bomber. Ebisumaru Bomber
        Memory Cartridge: Bomberman masters the Line Bombing capabilities of Ebisumaru
        Bomber. Anubis/Jehoty Bomber Memory Cartridge: Bomberman masters the teleportation
        capabilities of Anubis Bomber and Jehoty Bomber. Dracula Bomber Memory Cartridge:
        Bomberman masters the cursing capabilities of Dracula Bomber that allow him
        to create spell circles that reflect Bombs and other attacks. Goemon Bomber
        Memory Cartridge: Bomberman masters the Line Bombing capabilities of Goemon
        Bomber. Simon Belmont Bomber Memory Cartridge: Bomberman masters the whip-creating
        and wielding capabilities of Simon Belmont Bomber. Pyramid Head Bomber Memory
        Cartridge: Bomberman masters the sword creating and wielding capabilities
        of Pyramid Head Bomber, enshrouding him with a dark, gaseous aura. Alucard
        Bomber Memory Cartridge: Bomberman masters the mist transformation that is
        used by Alucard Bomber. Caesar Bomber Memory Cartridge: Bomberman masters
        the head-jet using capabilities of Caesar Bomber. Grunt Bomber Memory Cartridge:
        Bomberman masters the Plasma Pistol creating and wielding capabilities of
        Grunt Bomber. Naked/Solid Snake Bomber Memory Cartridge: Bomberman masters
        the stealth and invisibility capabilities of Naked Snake Bomber and Solid
        Snake Bomber. Bill/Lance Bomber Memory Cartridge: Bomberman masters the firearm
        creating and wielding capabilities of Bill Bomber and Lance'
