  intelligence:
    text: Academically, Casey isn't particularly bright, often having to be tutored
      by April O'Neal and in general, Casey seems to lack "conventional smarts". However,
      on the field, Casey is a reasonably skilled fighter, who, while not on the same
      level as the Turtles, can competitively fight them on relatively equal grounds.
      This can be seen in his roughly equal brawls with Raph and Donny. Even before
      becoming friends with the Turtles and training with them, Casey was capable
      of members of the Purple Dragons in combat, quickly defeating them. He could
      even match Kraang and Foot Bots.
