    - field: intelligence
      value: 'Tech Genius and Gifted warrior (Donatello and his brothers have been
        granted natural human-like intelligence, which developed over the year it
        took them to complete their mutation. Master Splinter then taught them all
        he knew about ninjutsu and the human world over the course of thirteen years,
        after which they concluded their training. Donatello in particular dedicated
        his life to self-made scholarly activities and a pursuit of any form of knowledge,
        with a particular interest for history, literature, computer science, biology
        and several other scientific fields, most notably in relation to technology,
        his greatest love. As the tech expert of the quartet, Donatello has accomplished
        several extraordinary feats. He and April figured out a way to shut down Stockman''s
        computer system under great pressure. Circumvented the security system of
        the TCRI building and disabled a magnetic lock. Did countless repairsTeenage
        Mutant Ninja Turtles Vol 1 11 in Casey''s farm, while also devising a water
        wheel to power the electric system and installing a wood stove. Has partially
        defused an atomic bomb. Once gained access to the Foot''s HQ planimetrics,
        he devised a wayTeenage Mutant Ninja Turtles Vol 1 20 to infiltrate it which
        succeeded almost entirely. Donatello has accumulated a hoard of technological
        artifactsTMNT: Teenage Mutant Ninja Turtles Vol 4 9 overtime in order to conduct
        his researches, including the robotic remains of Baxter Stockman, which he
        has repairedDonatello: The Brain Thief Vol 1 1 and with whom he is implied
        to having had several discussions about scientific matters. Among his inventions
