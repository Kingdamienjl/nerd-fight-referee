        of the TMNT Vol 2 24 physical subjects and energyTales of the TMNT Vol 2 49
        signatures,Donatello: The Brain Thief Vol 1 3 usually as a security system
        for their underground lair in the sewers. Even if Utrom technology was initially
        beyond his understanding,Teenage Mutant Ninja Turtles Vol 1 7 he nonetheless
        proved fundamental in helping Leatherhead build a Transmat. After the Utrom
        integrated within human society, Donatello finally had his chance to thoroughly
