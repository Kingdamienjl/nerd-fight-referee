    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Wall level physically, Building level with magic (Defeated Kingsley Shacklebolt
      in open combat, who could fight Voldemort with the help of Minerva McGonagall
      and Horace Slughorn. Killed Nymphadora Tonks, a very accomplished and capable
      Auror. Defeated Fenrir Greyback, a fellow powerful Death Eater. Fought Hermione,
      Ginny and Luna Lovegood at the same time. Was the last Death Eater standing
      apart from Voldemort himself, despite wielding a wand which she had most likely
      not won the allegiance of. Created a shockwave that blew up the Great Hall of
      Hogwarts), some spells ignore conventional durability.
    source_ids:
    - vsbattles-bellatrix-lestrange-harry-potter
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Athletic Human with Subsonic reactions via power-scaling (Kept pace with\
      \ Molly Weasley. Blitzed several snatchers and defeated them before they could\
      \ even draw their wands), Speed of Light attack speed via Lumos Solem (Lumos\
      \ Solem is a charm that creates a blinding flash of sunlight used to defend\
      \ against the Devil's Snare. Bellatrix should know this spell, as it\u2019s\
      \ implied to be taught in basic herbology to defend against the Devil's Snare\
      \ and advanced charms class, and first years like Hermione have showcased this\
      \ spell)"
    source_ids:
    - vsbattles-bellatrix-lestrange-harry-potter
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Athletic Human by herself. Class 5 with spells (Should be comparable, if
