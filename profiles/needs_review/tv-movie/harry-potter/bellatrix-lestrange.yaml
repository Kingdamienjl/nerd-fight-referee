- id: claim-weaknesses-aea7eb86
  section: weaknesses
  axis: weakness
  text: 'Mental Illness, fierce and dangerous temper, Arrogance Notable Attacks and
    Techniques: * Avada Kedavra: She unleashes a green energy bolt that instantly
    kills the target upon impact. However, sufficiently fast opponents can dodge it
    and it can be stopped by throwing another object (or victim) in the way * Crucio:
    She curses the opponent to feel unspeakable amounts of pain, usually incapacitating
    the target unless they possess unusually high resistance to pain. Continued exposure
    can fry the victim''s nerves and damage their brain, leaving them clinically insane
    or in a vegetative state. * Fiendfyre: Bewitched Flame of abnormal size and heat,
    infused with dark magic, capable of seeking out living targets, can''t be extinguished
    by water ==Gallery== Bella2.jpg Bellatrix2-op.jpg Enhanced-buzz-13010-1381366337-4.jpg
