    - field: intelligence
      value: Genius (Voldemort is regarded as the most powerful, skilled, and dangerous
        Dark Wizard to have ever lived, even surpassing Grindelwald. Albus Dumbledore
        was the only wizard considered superior to Voldemort. He was able to mastermind
        two of the most destructive wars in British wizarding history, effortlessly
        overwhelming the entirety of the British wizarding community. He was a child
        prodigy at magic, possessing perfect control of his abilities despite the
        lack of knowledge or training and his absence of a wand. Later, Dumbledore
        declared him the most gifted and brilliant student to ever attend Hogwarts,
        having earned an 'Outstanding' on all of his O.W.L. and N.E.W.T. exams. As
        an adult, Voldemort traveled the world and became a tremendously powerful
        wizard of unmatched skill. He performed feats of magic thought to be impossible,
        and his accomplishments completely eclipsed any Dark Wizard that came before
        him. His magical prowess was so great that Dumbledore admitted that even the
        most powerful protective charms and spells couldn't keep him out if he was
        at full power. The combined efforts of all the professors in Hogwarts could
        not hold Voldemort off for long. Voldemort was extremely talented at every
        branch of magic, be it potions, transfiguration, or charms. However, his greatest
        affinity was the Dark Arts, and he managed to push the boundaries further
        than any other wizard to have ever lived. He is the only known wizard to have
        successfully created not one but seven different Horcruxes, a feat that both
        astonished and disgusted many other powerful wizards. He was also the only
        wizard capable of necromancy. He could implement several powerful defenses
        for each of his horcruxes, one of which was a curse that was so powerful it
        would have killed Dumbledore in minutes had Snape not intervened. Voldemort
        was a master of the three unforgivable curses; his affinity for the Killing
        Curse was so strong that he killed enough people to acquire an army of Inferi.
        His Cruciatus Curse was strong enough to break through a powerful memory charm.
        Furthermore, his Imperius was strong enough to control someone for over half
        a year. Voldemort also invented the ability to fly, defying the law of magic
        that stated objects could only fly with a charm. Outside of magic, Voldemort
        was also considered to be extraordinarily charismatic, gaining the trust and
        admiration of everyone in Hogwarts except for Dumbledore himself and manipulating
        several people, including his teachers. He successfully convinced Quirrell
        to serve him despite him holding but a fraction of his original power, earned
        Ginny Weasley's trust, and successfully framed Hagrid and Aragog for the murder
        of Myrtle. He was a highly successful salesman with his charisma, being the
        best employee Borgin and Burkes ever hired. With his encyclopedic knowledge
        of magical artifacts, he procured several priceless treasures that he would
        turn into Horcruxes. Voldemort was a born leader, and even before he left
        Hogwarts, he was already in command of a group of 'friends' that would later
        be known as the Death Eaters. With less than forty members, they nearly dominated
        the entire population of magical Britain in the first wizarding war. Despite
        his incredible ingenuity in virtually every aspect of magic, his extreme arrogance
        and megalomania usually hamper his intellect)
      source_id: vsbattles-lord-voldemort
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Voldemort is highly arrogant and sadistic. He has some exploitable peculiarities,
        such as an obsession with magical artifacts, places significant to him, and
        the number seven. He has no understanding of love, which makes it hard for
        him to read the minds of others while they are feeling it and often leads
        to him failing to understand others. He is obsessively afraid of death and
        will be reduced to a fraction of his former strength in a spiritual form if
        his body is destroyed while his Horcruxes remain; if all of them are destroyed,
        he can be killed for good. When he does acquire the Elder Wand, it does not
        acknowledge Voldemort as its true master and thus cannot be used effectively.
        His arrogance often leads to him making unwise tactical decisions. Notable
        Attacks / Techniques: Dark Arts: Voldemort is a master of the Dark Arts, considered
        by many to be the greatest Dark Wizard. He has extensive knowledge of curses
        and other sinister spells that even Albus Dumbledore would hesitate to perform.
        The curses were highly dangerous, causing Dumbledore''s health to fail when
        he put on Marvolo Gaunt''s ring and was exposed to the curse, almost killing
        him instantly. Even a jinx cast on the position of Defence Against the Dark
        Arts at Hogwarts was a spell that Dumbledore could not reverse. * Fiendfyre:
        A mighty bewitched flame animated by magic, capable of tracking targets. It
        cannot be extinguished by water, even enchanted waters, and takes on the shape
        of animals as it rages in an attempt to annihilate its target. Its flames
        are so intense that it is one of the few things that can destroy a Horcrux.
        While the spell is difficult to control, a Dark Wizard as experienced and
        knowledgeable as Voldemort can shape the flames more easily. * Legilimency:
        The art of invading the minds of others through magic and then sifting through
        the mind to gain access to helpful information, a skill that Voldemort is
        a master of, using it even in combat to learn his opponents'' future actions
        before they perform them. His power in this is so great that he can affect
        the entire population of Hogwarts simultaneously, communicating telepathically
        and causing great pain to some of them. It''s also implied he can use it to
        influence, control, and even break the minds of others. He is also well-versed
        in Occlumency, the art of closing one''s mind off a mental attack. * Necromancy:
        Voldemort can animate his victims as the undead beings known as Inferi, similar
        to zombies but not identical. He has, over the years, gathered a sizeable
        army of these undead. * Taboo: A curse that designates a certain keyword as
        taboo, revealing the locations of any who speak it to Voldemort and his allies.
        He has cast this spell on his own name, making it extremely risky for any
        to say it. * Cruciatus Curse: With the incantation Crucio, Voldemort can subject
        a target to extreme, torturous pain, so intense that they can be driven into
        insanity by prolonged exposure to its effects. The curse is powerful enough
        that it can break Memory Charms. * Imperius Curse: This spell, with the incantation
        Imperio, can be used to control others, putting them into a pleasant, dreamlike
        state where they will carry out Voldemort''s intent. * Killing Curse: The
        most deadly curse of all, the Killing Curse (also known by its incantation,
        Avada Kedavra) is a favorite of Voldemort''s, who makes liberal use of it
        in combat. When used, it fires a green bolt of energy that will kill any living
        thing it touches, causing them to drop dead without any injury, though Voldemort
        described it as ripping his soul from his body when it backfired. While lethal,
        the bolt can be dodged, blocked with inanimate objects, and countered through
        sacrificial protection, nullifying its effects. ==Notable Matchups== Victories:
        Losses: The Courier (Fallout) The Courier''s profile (Speed was equalised,
        both were 6 metres apart. Both were allowed up to tier 8-C equipment) Kamijou
        Touma (Toaru Majutsu no Index) Kamijou Touma''s Profile Eragon (The Inheritance
        Cycle) Eragon''s Profile (Speed was equalized and Eragon''s equipment was
        restricted to his sword) Randall Flagg (The Dark Tower) Randall''s profile
        (Speed was equalized) Maple (Itai no wa Iya nano de Bougyoryoku ni Kyokufuri
        Shitai to Omoimasu) Maple''s Profile Doctor Strange (Marvel Cinematic Universe)
        Doctor Strange''s Profile (9-A+ Sorcerer Supreme Doctor Strange was used.
        Speed was equalized and both had prior knowledge) Palpatine (Star Wars) Palpatine''s
        Profile (Endor Palpatine was used, and speed was equalized) Emily Kaldwin
