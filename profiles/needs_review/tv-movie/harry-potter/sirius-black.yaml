  attack_potency:
    text: Wall level physically (Rammed Antonin Dolohov with his shoulder. Harmed
      Lucius Malfoy with his punches), Building level with magic (Matched Antonin
      Dolohov in a duel, who defeated Mad-Eye Moody and Remus Lupin. Fought equally
      against Bellatrix Lestrange, and only died due to his recklessness) | At least
      Small Building level, likely Building level (Was able to fight Remus Lupin in
      his werewolf form)
    source_ids:
    - vsbattles-sirius-black-harry-potter
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Athletic Human with Subsonic combat speed and reactions (Comparable to\
      \ other wizards. Was described to be a blur when duelling Dolohov), Speed of\
      \ Light attack speed via Lumos Solem (Lumos Solem is a charm that creates a\
      \ blinding flash of sunlight used to defend against the Devil's Snare. Black\
      \ should know this spell, as it\u2019s implied to be taught in basic herbology\
      \ to defend against the Devil's Snare and advanced charms class, and first years\
      \ like Hermione have showcased this spell) | Superhuman (German shepherds can\
      \ run up to 30 mph)"
    source_ids:
    - vsbattles-sirius-black-harry-potter
    confidence: 0.6
    notes: auto_repair source extraction
