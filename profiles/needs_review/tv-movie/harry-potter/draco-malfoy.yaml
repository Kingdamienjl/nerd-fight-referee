    - field: weaknesses
      value: 'Harry needs glasses to see clearly and has terrible eyesight without
        them. Harry''s scar hurts when he''s near Voldemort due to him being a Horcrux.
        Notable Attacks/Techniques: List of Spells used by Harry: *Accio: This charm
        summons an object to the caster, potentially over a significant distance.
        It works in two ways; either by casting the charm and then naming the object
        desired or by pointing your wand at the desired object during or immediately
        following the incantation to "pull" the target toward the caster; in either
        case, the caster must concentrate on the object they wish to summon for the
        charm to succeed. The caster doesn''t necessarily need to know the target''s
        location if they say the name of the summoned object. *Aguamenti (Water-Making
        Spell): Produces a fountain or jet of water from the wand tip. *Arania Exumai:
        Blasts away Acromantulas and, presumably, all other arachnids. *Ascendio:
        Lifts the caster. *Confringo: Causes anything it touches to explode and presumably
        combust. *Crucio (Cruciatus Curse): Inflicts intense pain on the target; the
        pain is comparable to driving hot knives into the victim. It cannot be cast
        successfully by a person doing so out of pure spite or anger; one must want
        to cause the victim pain. *Defodio: This spell allows the caster to gouge
        out large chunks of the target. *Depulso (Banishing Charm): This spell makes
        the target fly toward a specific location; it is the opposite of the summoning
        charm. *Diffindo (Severing Charm): Rips, tears, shreds, or more generally
        physically damages the target. *Entomorphis: Transforms the target into an
        insectoid for a short time. *Episkey: Used to heal relatively minor injuries,
        such as broken bones and cartilage. *Erecto: Used to erect a tent or other
        structure. *Expecto Patronum (Patronus Charm):thumb|245px|Harry summoning
        Patronus This charm is a defensive spell which will conjure a spirit-like
        incarnation of their positive emotions to defend against dark creatures; it
        can also send messages to other witches or wizards. It seems one''s Patronus
        will take the form of something important to the caster, and can change when
        one has undergone a period of heightened emotion. *Expelliarmus (Disarming
        Charm): Causes whatever the victim is holding to fly away, knocks out an opponent
        if used too forcefully. *Feather-light charm: Makes something lightweight.
        *Furnunculus (Pimple Jinx): Covers the target in boils (or pimples). *Imperio
        (Imperius Curse): Places the subject in a dream-like state, in which he or
        she is utterly subject to the will of the caster. However, those who are strong-willed
        may learn to resist it. *Inflatus (Inflatus Jinx): Inflates objects (living
        or dead). *Langlock: Glues the subject''s tongue to the roof of their mouth.
        *Levicorpus: The victim is dangled upside-down by their ankles, sometimes
        accompanied by a flash of light (this may be a variant of the spell). *Liberacorpus:
        Counteracts Levicorpus. *Locomotor Mortis (Leg-Locker Curse): Locks the legs
        together, preventing the victim from moving the legs in any fashion. *Lumos
        (Wand-Lighting Charm): Creates a narrow beam of light that shines from the
        wand''s tip, like a torch. *Lumos Maxima: Shoots a ball of light at the place
        pointed if the Wand is swung. *Muffliato (Muffliato): This spell fills peoples''
        ears with an unidentifiable buzzing to keep them from hearing nearby conversations.
        *Nox (Wand-Extinguishing Charm): Turns off the light produced by Lumos. *Periculum:
        Creates red sparks/flares to shoot from the user''s wand. *Point Me (Four-Point
        Spell): Causes the caster''s wand to act as a compass, and point North. *Protego
        (Shield Charm):thumb|245px|Harry casting Shield Charm The Shield Charm causes
        minor to moderate jinxes, curses, and hexes to rebound upon the attacker.
        *Protego Totalum: Casts a shield charm over a small area that will not let
        anything pass through, except for the Unforgivable Curses: Avada Kedavra,
        Imperio, and Crucio. *Reducio (Shrinking Charm): Makes an enlarged object
        smaller. *Reducto (Reductor Curse): Breaks objects. In stronger usages, disintegrates
        them. *(Refilling Charm): Refills whatever the caster points at with the drink
        originally in the container. *Relashio (Revulsion Jinx): A spell used to make
        the subject release whatever it is holding or binding. *Rennervate: revives
        a stunned person. *Reparo (Mending Charm): Used to repair objects. *Repello
        Muggletum (Muggle-Repelling Charm): Keeps Muggles away from wizarding places
        by causing them to remember important meetings they missed and to cause the
        Muggles in question to forget what they were doing. *Rictusempra (Tickling
        Charm): Causes an extreme tickling sensation that, in the case of Draco Malfoy,
        made him drop to the floor laughing. *Riddikulus: A spell used when fighting
        a Boggart, "Riddikulus" forces the Boggart to take the appearance of an object
        the caster is focusing on. Best results can be achieved if the caster is focusing
        on something humorous, with the desire that laughter will'
