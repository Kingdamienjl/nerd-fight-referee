        \ to hibernate. However, Draco claims that coffee helps alleviate the symptoms.\
        \ ** Dragonewt Skin: Her scales are stronger than steel, able to block cutting\
        \ weapons and even deflect bullets. ** Prehensile Tail: Draco can use her\
        \ tail to grab things, as seen when she used to hold Miia\u2019s arms in place.\
        \ It\u2019s size makes it able to support her body weight but makes her unable\
        \ to sleep on her back. If someone forcefully pulls it, it can come off like\
