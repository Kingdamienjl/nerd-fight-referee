  attack_potency:
    text: Wall level; Building level with magic (Fought Voldemort with Horace Slughorn
      and Kingsley Shacklebolt. Duelled with Severus Snape evenly, though he was holding
      back. According to Poppy Pomfrey, the group of Aurors would not have stood a
      chance against McGonagall in broad daylight), higher in her prime (Was likely
      over a hundred years old during the events of the Second Wizarding War and was
      noted to be old). Some spells also ignore conventional durability
    source_ids:
    - vsbattles-minerva-mcgonagall-harry-potter
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Athletic Human with Subsonic combat speed and reactions (Kept up with Voldemort),\
      \ Speed of Light attack speed via Lumos Solem (Lumos Solem is a charm that creates\
      \ a blinding flash of sunlight used to defend against the Devil's Snare. McGonagall\
      \ should know this spell, as it\u2019s implied to be taught in basic herbology\
      \ to defend against the Devil's Snare and advanced charms class, and first years\
      \ like Hermione have showcased this spell)"
    source_ids:
