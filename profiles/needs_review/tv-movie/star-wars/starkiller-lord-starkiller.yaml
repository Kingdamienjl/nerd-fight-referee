    - field: weaknesses
      value: 'Darth Vader is vulnerable to electric attacks of sufficient strength
        due to being a cyborg, and he cannot use Force Lightning (He can shield himself
        with the force and also modify his suit against this but strong enough electric
        attacks can still kill him, such as Darth Sidious''), his suit acts as a life
        support system and he will die if removed from it, the control panel on his
        chest is a weak-spot that can easily be damaged Notable Attacks/Techniques:
        *Force Barrier: Both an offensive and defensive Force power that creates a
        barrier or wall of Force energy around the intended target, be itself, friend,
        or foe. Depending on the strength of the individual, the barrier could only
        withstand a few attacks before collapsing. Could shield himself from Starkiller''s
        explosion that was visible from outside the Deathstar even in his damaged
        state from being hit with TK blasts, machinery, and their explosions. *Force
        Healing: Accelerates the body''s natural healing process at a rapid pace.
        Master practitioners of the art can even heal themselves from fatal injuries
        in a short time (like being cooked alive, punctured lungs, etc). *Dun Moch:
        A Sith technique, it involves probing the mind of the opponent then using
        the info for psychological warfare to erode their will. Experienced practitioners
        can work on experienced force users who are capable of blocking their mind
        out from probes. *Force Choke: Possibly his most used technique, he applies
        his telekinesis to crush an opponent''s throat (or other body parts if he
        chooses). Usually used to kill insubordinate underlings. Interestingly it
        only requires line of sight to use, as Vader displayed over several kilometers
        the ability to Force Choke Imperial Officers such as Admiral Ozzel. *Force
        Scream: An enraged scream that causes devastation to any that were unfortunate
        enough to be in close proximity who weren''t strong enough to survive, he
        used this in episode III despite the weakened state he was in after the fight
        and pain of surgery to shake the room and crush machinery in it. He threatened
        to bring down the Jedi Temple while choking out an Inquisitor (dark sider)
        till he stopped. He also shook a building to its foundation while in a Hangar
        with Typho. All of this in his early years (during ROTS era months after the
        events on Mustafar). *Force Stun: Vader locks his targets in catatonic paralysis.
        *Kinetite: Described as molding "Force energized lightning" into a sphere
        of restrained kinetic energy that can be thrown at an enemy. Instead of burning
        or electrocuting its target like most forms of Force lightning, it acts as
        a solid projectile. *Lightsaber Combat: Vader is a master of all forms of
        lightsaber combat, specializing in the Shien and Djem So lightsaber styles,
        and is also proficient with the Shii-Cho, Makashi, Soresu, Ataru, Niman, and
        Juyo forms. Can also use his saber as a boomerang to decapitate opponents.
        *Memory Manipulation: He can rip into the mind of his opponent to gain info
        like he did in episode VI in his final duel with his son or learn new things
        such as a new language (called drain knowledge). He can project images of
        his opponent''s fears, torturing them to a point they''re left in a vegetative
        state for a while. He can access the memories of people to see, hear and feel
        what they did (including the force signature felt) to better understand things
        as shown with the force user Tesla. Can scramble the minds of non-force sensitives
        at least since even Darth Maul was trained to do that. *Mental Domination/Defense:
        Can bend the will of opponents to do his bidding, has even killed a Toydarian
        (beings famous for their ability to resist force suggestions) by inflicting
        mental pain on it. Can create mental blocks like experienced force users to
        prevent the mind from being probed or scrambled and can also trace telepathic
        trails left behind by telepaths who may have planted something in his mind,
        a high-level telepath, however, can leave no trails. *Pyrokinesis: Vader,
        at a young age, accidentally used this power to burn an opponent from the
        inside of their body. *Telekinesis: Vader can use this through the Force to
        put his mind literally over matter, capable of blasting opponents, shielding
        himself or disarming people, its limits are only those of the creativity that
        Force User has. *Telepathy: Can easily manipulate others mentally with the
        Force to trick, deceive, maim or even kill outright. Can also use this power
        externally or internally when it comes to illusion creation, manifestation,
        and manipulation. *Tutaminis: Through the Force, Vader can draw potentially
        harmful energy into his body and diffuse it or channel it away completely.
        He most likely employed this ability when Starkiller attacked him for an extended
        period of time with Force Lightning. Note: This profile only covers Anakin
        Skywalker after he became Darth Vader. The Sith Lords Respect Thread - Information
        on various Sith Lords powers, abilities, feats, and backgrounds as well on
        the Force'
