    - field: weaknesses
      value: "Nothing notable | Driven insane after 300 years of combating Vitiate's\
        \ mental assault and power draining. Notable Attacks/Techniques: *Empathy:\
        \ Capable of picking out feelings, emotions, and behaviors with the Force;\
        \ Revan can also use this to send mental pictures or impressions into his\
        \ allies or enemy\u2019s minds; works across interstellar space and can be\
        \ used to sense stress points or areas of danger or psychic whiplashes from\
        \ major events. *Balance of the Force: As a being who has experienced the\
        \ natures of both the Dark and Light Sides of the Force; Revan is capable\
        \ of summoning and producing Force energy intertwined between both aspects\
        \ that can incapacitate his enemies with it. Due to its nature of combining\
        \ both light and dark, this ability is as useful as the dark side technique\
        \ Force Destruction, but far less destructive (Its destructive potential is\
        \ partially limited by the Light Side) *Force Healing: Accelerates the body's\
        \ natural healing process at a rapid pace. Master practitioners of the art\
        \ can even heal themselves from fatal injuries in a short time (like being\
        \ cooked alive, punctured lungs, etc). *Lightning: An offensive Force technique\
        \ that uses Force energy to produce electricity with one or two hands that\
        \ stream outward from the fingertips, its speed is usually great enough to\
        \ catch an opponent off-guard even when prepared, and can be used either in\
        \ bursts or simply torrent out in a gush of agony on its victim. *Telekinesis:\
        \ Revan can use this through the Force to put his mind literally over matter,\
        \ capable of blasting opponents, shielding himself or disarming people, its\
        \ limits are only those of the creativity that Force User has. *Telepathy:\
        \ Can easily manipulate others mentally with the Force to trick, deceive,\
        \ maim or even kill outright. Can also use this power externally or internally\
        \ when it comes to illusion creation, manifestation, and manipulation. *Tutaminis:\
        \ Can use this ability to protect himself from direct harm or disperse energy\
        \ and attacks. Revan was skilled enough with this power that he could even\
        \ contain and redirect Force Lightning conjured by the Darth Nyriss (Which\
        \ itself was powerful enough to plow through her own Force Barrier and reduce\
        \ her body to ash instantly) and survive Vitiate's Force Lightning, albeit\
