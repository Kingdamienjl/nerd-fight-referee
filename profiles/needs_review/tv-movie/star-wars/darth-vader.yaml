      Darth Vader actually became stronger with his connection to the dark side becoming
      more powerful.[Book] Star Wars: El Lado Oscuro[Website] starwars.com/news/charles-soule-powerful-first-arc-marvel-darth-vader
      Fought Kirak Infil''a, who is more powerful than any Jedi Vader ever faced before,[Website]
      marvel.com/comics/issue/63682/darth_vader_2017_3 although he was quickly overpowered.
      5 years after Revenge of the Sith, the injuries that had deformed Darth Vader''s
      body, leaving him broken, perfected his spirit, strengthening his connection
      to the Force. During the events of Obi-Wan Kenobi, it is said that Darth Vader
      is at his prime[Website] http://lrmonline.com/news/deborah-chow-and-natalie-holts-interesting-take-on-darth-vader/.
      Should heavily upscale from High-Republic Jedi knights, who stopped debris that
      destroyed moons in the Great Hyperspace Disaster) | City level+ (Has since reached
      the start of his "prime" by the time of Rebels. Can casually wreck an AT-AT
      Walker with telekinesis and destroy large freighters. Overwhelmed Obi-Wan Kenobi
