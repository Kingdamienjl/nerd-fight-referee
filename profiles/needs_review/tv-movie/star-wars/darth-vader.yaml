- id: claim-weaknesses-b44782a1
  section: weaknesses
  axis: weakness
  text: "Darth Vader cannot use Force Lightning, his suit acts as a life support system\
    \ and he will die if removed from it, the control panel on his chest is a weak-spot\
    \ that can easily be damaged. Feats: |-|Force feats= *Destroyed a forest with\
    \ the Force.[Comic Book] Star Wars: Darth Vader (2020) #33 *Destroyed a building\
    \ with the Force. *He sense a blaster shot and blocked it.[Comic Book] Star Wars:\
    \ Darth Vader (2015) #1 *With his body restrained and unable to gesture, he telekinetically\
    \ controlled one of Cyn's team members to carry out a massacre.[Comic] Star Wars:\
    \ Darth Vader - Black, White & Red #2 *Chocking an Imperial officer through a\
    \ transmission, while the latter was on a Star Destroyer and Vader was on Cymoon\
    \ 1, without visual contact and seemingly without even gesturing.[Comic] Star\
    \ Wars (2015) #3 *Casually chocking many people in a room and simultaneously crushing\
    \ a Twi'lek's heart.[Novel] Star Wars: Tarkin *Used Force Stasis to freeze an\
    \ explosive and Inquisitors.[Comic] Star Wars: Darth Vader (2017) #2[Comic] Star\
    \ Wars: Darth Vader (2017) #20 *Commands an organic ship to fly into the sun.[Comic]\
    \ Star Wars: Darth Vader (2015) #25 *Commands a hive-mind to drag it's master\
    \ into lava.[Comic] Star Wars Adventures: Return to Vader\u2019s Castle (2019)\
    \ #5 |-|Lightsaber skill= *Destroyed a wing starfighter by throwing his lightsaber.[Comic\
    \ Book] Doctor Aphra #25 *Blocked blaster shots at close range. *Blocked two attacks\
    \ at once while facing away.[Comic Book] Star Wars: Darth Vader (2015) #18 *Blocks\
    \ multiple blaster bolts.[Comic Book] Star Wars: Darth Vader (2015) #4 *Casually\
    \ deflects fire from army with big turrets and soldiers.[Comic] Star Wars: Darth\
    \ Vader - Black, White & Red #3 |-|Fights/Battles= *He faced an army of rebels\
    \ alone.[Comic] Star Wars: Vader Down #1 *He single-handedly faced and defeated\
    \ the Ender Beast.[Comic] Star Wars: Vader: Dark Visions #1 *Singlehandedly suppressed\
    \ a world of droids that had run wild for decades and upgraded themselves to be\
    \ a thousand times deadlier than any Security Droid.[Comic] Star Wars: Age of\
    \ Rebellion - Darth Vader #1 *Singlehandedly completed the invasion of a moon\
    \ where rebel operations were being conducted. Notable Attacks/Techniques: *Force\
    \ Barrier: A defensive Force power that creates a barrier or wall of Force energy\
    \ around the intended target, be itself, friend, or foe. Depending on the strength\
    \ of the individual, the barrier could only withstand a few attacks before collapsing.\
    \ Vader has demonstrated considerable prowess with the power, even protecting\
    \ his TIE Fighter by causing multiple Proton Torpedoes to veer off course and\
    \ explode in front of him and protecting himself from the destruction of the largest\
    \ weapons factory in the galaxy. *Force Scream: Darth Vader unleashes a Force-enhanced\
    \ scream. He used this power in Episode III, despite the weakened state he was\
    \ in after his fight with Obi-Wan and pain of surgery, to shake the room and crush\
    \ machinery in it. *Telekinesis: Darth Vader can use this through the Force to\
    \ put his mind literally over matter, capable of blasting opponents, shielding\
    \ himself, or disarming people, its limits are only those of the creativity that\
    \ Force User has. Darth Vader has demonstrated considerable prowess with the power,\
    \ even pulling freighters out of the sky and crushing AT-AT. *Telepathy: Can easily\
    \ manipulate others mentally with the Force to trick, deceive, maim, or even kill\
    \ outright. Darth Vader has a considerable mastery for the power, able probe for\
    \ hidden thoughts in the minds of others, and learn them for himself. *Force"
