    - field: attack_potency
      value: 'Moon level (Although far weaker than his ROTS counterpart, Anakin is
        a powerful Jedi, even at his beginning stages. He is considered to have "exceptional
        skills" by Mace WinduAttack of the Clones and showed an impressive performance
        against Count Dooku. Anakin is relative to AOTS Obi-Wan considering how he
        showed a better performance against Dooku than with him, who fought and defeated
        TFM Darth Maul, the same Sith that killed Qui-Gon Jinn.The Phantom Menace
        Qui-Gon Jinn was invited to join the Jedi High CouncilStar Wars: Master and
        Apprentice, making him superior to the High Republic Jedi Knights who stopped
        debris that destroyed moons in the Great Hyperspace DisasterStar Wars: The
        High Republic (Light of the Jedi)) | Star level (Anakin has grown significantly
