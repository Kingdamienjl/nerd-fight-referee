      Kenobi. Should be more powerful than High-Republic knights, who stopped debris
      that destroyed moons in the Great Hyperspace Disaster[Book] Star Wars: The High
      Republic (Light of the Jedi)79.374534198801868001 Megatons) | At least City
      level+ (Vastly more powerful than before,[Website] StarWars.com | The Official
      Star Wars Website: Anakin Skywalker even being one of the strongest Jedi in
      history,[Book] Star Wars Character Encyclopedia: Updated and Expanded. and having
      superior strength in the Force.[Biography] Skywalker: A Family at War Surpassed
      Darth Tyranus at his peak. Declared by Palpatine to have a power that nearly
      rivalled his own.[Book] Star Wars: The Secrets of the Sith His powers increased
      after tapping into the Dark Side. After killing the Separatist leaders, his
      anger and hate made him stronger, transforming him into a full-fledged Sith
      and becoming more powerful than the Jedi who had long held him back[Paperback
      Book] Los Angeles Times: Star Wars: The Skywalker Saga and Beyond)'
