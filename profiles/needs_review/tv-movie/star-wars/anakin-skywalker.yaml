- id: claim-weaknesses-e2ca4c04
  section: weaknesses
  axis: weakness
  text: 'Arrogance and fear for the lives of those he loves led to his ultimate corruption
    into Darth Vader, drifts towards the Dark Side when angered, making him very impulsive
    and conflicted. Notable Attacks/Techniques: *Form V (Shien/Djem So): The fifth
    form of Lightsaber combat, Shien/Djem So. The Djem So variant of Form V was based
    on defending with solid blocks and parries, then immediately countering with strong
    counterattacks and ripostes, and was geared toward and created for lightsaber-to-lightsaber
    combat, although it was nonetheless reasonably useful for blaster deflection.
    Anakin Skywalker was a known user of Djem So, both during his initial stint as
    a Jedi and later when he subsequently fell to the Sith. The Shien variant of Form
    V allowed the utilization of an unconventional reverse grip, which Ahsoka Tano
    was known to prefer and use during battles. *Form IV (Ataru): Anakin is extremely
    skilled in Ataru. Like Yoda and Qui-Gon Jinn, he specialized in the Ataru lightsaber
    form, a fast-paced and physically taxing form utilizing acrobatics to overwhelm
    an opponent''s defenses. Although the form''s weak points include prolonged combat,
    confined spaces, and compromised defense, Anakin made modifications allowing the
    form to be make it far more effective in defending against incoming projectiles
    or range attackers. *Force Barrier: A defensive Force that allows the users to
    create a barrier of energy around the target. Depending on the strength of the
    user, the wall could only withstand a few attacks before collapsing. *Telekinesis:
    Anakin can use the Force to put his mind literally over matter, capable of blasting
    opponents, shielding himself, or disarming people. Furthermore, the user''s creativity
    is the limit of the power''s capabilities. *Mind Trick: The Force has a substantial
    impact on the feeble-minded, a fact Force users sometimes exploit. For example,
    a skilled Jedi may utilize the Force to implant a suggestion into the others they
    come into contact with, urging them to follow the Jedi''s orders. Anakin has a
    considerable mastery of the power, able to probe for hidden thoughts in the minds
    of others and learn them for himself. *Force'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
