    - field: weaknesses
      value: 'Developed a severe depression while in his exile, since it took him
        20 years to, once again, understand and learn self-forgiveness. A large part
        of his actions in the order is limited by his pedagogy, being the first teacher
        of basically all younglings, or by the Council, whose blindness was exploited
        by Sidious, resulting in the Empire and the end of the order. Notable Attacks/Techniques:
        *Force Barrier: A defensive Force power that creates a barrier or wall of
        Force energy around the intended target, be itself, friend, or foe. Depending
        on the strength of the individual, the barrier could only withstand a few
        attacks before collapsing. *Telekinesis: Yoda can use this through the Force
        to put his mind literally over matter, capable of blasting opponents, shielding
        himself or disarming people, its limits are only those of the creativity that
        Force User has. Yoda has demonstrated considerable prowess with the power,
        even matching the telekinetic might of Darth Sidious. *Telepathy: Can easily
        manipulate others mentally with the Force to trick, deceive, maim, or even
        kill outright. Yoda has a considerable mastery for the power, able probe for
        hidden thoughts in the minds of others, and learn them for himself. ==Notable
