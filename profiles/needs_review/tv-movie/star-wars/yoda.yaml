- id: claim-weaknesses-c56a375c
  section: weaknesses
  axis: weakness
  text: 'Developed a severe depression while in his exile, since it took him 20 years
    to, once again, understand and learn self-forgiveness. A large part of his actions
    in the order is limited by his pedagogy, being the first teacher of basically
    all younglings, or by the Council, whose blindness was exploited by Sidious, resulting
    in the Empire and the end of the order. Notable Attacks/Techniques: *Force Barrier:
    A defensive Force power that creates a barrier or wall of Force energy around
    the intended target, be itself, friend, or foe. Depending on the strength of the
    individual, the barrier could only withstand a few attacks before collapsing.
    *Telekinesis: Yoda can use this through the Force to put his mind literally over
    matter, capable of blasting opponents, shielding himself or disarming people,
    its limits are only those of the creativity that Force User has. Yoda has demonstrated
    considerable prowess with the power, even matching the telekinetic might of Darth
    Sidious. *Telepathy: Can easily manipulate others mentally with the Force to trick,
    deceive, maim, or even kill outright. Yoda has a considerable mastery for the
    power, able probe for hidden thoughts in the minds of others, and learn them for
    himself. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    {{scroll box|content={{reflist|2}}}} {{Discussions}} Category:Characters Category:Star
    Wars Category:Movie Characters Category:Cartoon Characters Category:Book Characters
    Category:Game Characters Category:Male Characters Category:Chi Users Category:Mind
    Users Category:Heroes Category:Good Characters Category:Protagonists Category:Geniuses
    Category:Comic Book Characters Category:Aliens Category:Martial Artists Category:Wise
    Characters Category:Telepaths Category:Telekinesis Users Category:Energy Users
    Category:Forcefield Users Category:Matter Users Category:Sword Users Category:Science
    Fiction Characters Category:Cane Users Category:Jedi Category:Longevity Users
    Category:Teachers Category:Survivors Category:Honorable Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-c5fcb73d
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Small Size (Type 0: Is 66cm tall) *Jedi\
    \ Grand-Master (Is known as the wisest and most powerful Jedi of his timeUltimate\
    \ Star Wars, New Edition - p38Star Wars The Skywalker Saga - Official Collector's\
    \ Edition - p38Star Wars Galactic Maps - p15Star Wars Workbook - 2nd Grade Readings\
    \ - p17 with some even saying that his connection with the Force is stronger than\
    \ any other Jedi\u2019sStar Wars: The Clone Wars - Official Collector's Edition\
    \ - p15, having a midichlorian count only surpassed by Anakin Skywalker) **Enhanced\
    \ Telepathy (Effortlesly read Anakin Skywalker's thoughts during and after a meditationStar\
    \ Wars - Brotherhood: Chapter 50 p310 & 311, apparently knew about Master Elzar's\
    \ decision to refuse a place in the council before everyone elseStar Wars The\
    \ High Republic - Temptation Of The Force (Chapter 47) and later counseled Ezra\
    \ BridgerUltimate Star Wars, New Edition - p39, Rey SkywalkerStar Wars - Absolutely\
    \ Everything You Need To Know Updated - p17 and Mace WinduMace Windu: The Glass\
    \ Abyss- Chapter 29 without being in the same solar system that they were, with\
    \ the latter having his mind read in an instant and not even knowing how Yoda\
    \ did it. Obi-Wan Kenobi, who was also in exile but hiding mostly in Tatooine,\
    \ still got counseling, meditation and training with YodaStar Wars: Dawn Of The\
    \ Rebellion - The Visual Guide - p42) **Force Spirit (Became one after dying,\
    \ due to learning how to do so, with Qui-Gon) **Healing (With his presence, Yoda\
    \ instantly heals himself and allies around him. When the ability is activated,\
    \ he will also break out of any immobilizing effect[Game] Star Wars Battlefront\
    \ II) **Enhanced Astral Projection and Minor Crystal Manipulation (When Luke focused\
    \ on a green Kyber crystal, he saw a small chunk of a swamp and Yoda in it. After\
    \ they talked, Luke left that meeting and a Force Spirit Obi-Wan talked to Yoda,\
    \ then the scene changes back to LukeStar Wars (2020) #035: Droid Factory - p14~18)\
    \ **Absorption and Attack Reflection (Yoda is able to absorb massive amounts of\
    \ energy, which he can either distribute harmlessly through his body or reflect\
    \ back to the assailant) *Weapon Mastery (Master of all lightsaber stylesStar\
    \ Wars - Absolutely Everything You Need To Know Updated - p17, trounced Dooku\
    \ in a blur of acrobatics and flurry of saber strikesStar Wars - The Lightsaber\
    \ Collection p82 was overwhelming Darth Sidious with his swordplay, in such way\
    \ that Sidious couldn't defeat himStar Wars: The Complete Visual Dictionary, New\
    \ Edition - p41. Taught lightsaber fighting, being the main teacher or not, to\
    \ 20.000 JediStar Wars - Absolutely Everything You Need To Know Updated - p16,\
    \ including some of the most impressive fighters in the galaxy, such as DookuStar\
    \ Wars II - Attack Of The Clones, AhsokaStar Wars Rebels \u2014 \"Shroud of Darkness\"\
    , Obi-WanStar Wars V - The Empire Strikes Back and LukeStar Wars V - The Empire\
    \ Strikes Back) *Social Influencing (Has taken sudden peace-making missions in\
    \ many occasions during the High-Republic times, achieving since that time a fame\
    \ of a great diplomatStar Wars Character Encyclopedia, Updated and Expanded -\
    \ p282. With the guidance of the force, has suddenly arrived at the Vagadarr system\
    \ and in a short period of time has pacified a war between the tribes thereUltimate\
    \ Star Wars, New Edition - p39, was the pivotal beggining of the negotiations\
    \ to cease slavery in PijalStar Wars: Master & Apprentice - Chapter 32 and was\
    \ even given the prestigious title of 'Defender of the Home Tree' by the wookies\
    \ of KashyyykStar Wars: The Complete Visual Dictionary, New Edition - p24) *Acrobatics\
    \ (A signature of his is how acrobatic he is, helping his Ataru be so impressive\
    \ and overwhelmingDK Readers L2 - Star Wars Lightsaber Battles -p24. Used it to\
    \ overwhelm Sidious and Dooku in lightsaber fighting. His Prequel's self didn't\
    \ need the cane, used it only to fool around his padawans, showing off his acrobatic\
    \ moves outta nowhere and then acting like he needed the cane again, when he needed\
    \ it only after a while in his exile\"The First Lesson\" \u2014 From a Certain\
    \ Point of View) *Longevity (Members of Yoda's species are still children at 50\
    \ standard years old, and they can live for up to several centuries, with Yoda\
    \ himself living up to 900 years) *Enhanced Vehicular Mastery (Could easily pilot\
    \ Anakin's shipClone Wars S6-Ep 11 - VoicesClone Wars S6-Ep13 - Sacrifice, which\
    \ moves at 118MGLT, making it one of the fastest ships in the entire galaxyStar\
    \ Wars Super Graphic - p58 \"The Fastest Ships In The Galaxy\", despite usually\
    \ leaving the piloting to his soldiers. It is possible that this feat was achieved\
    \ without the help of R2-D2, who would have remembered the way to Dagobah when\
    \ Luke was reaching there, making this feat even more impressive due to even the\
    \ greatest pilots usually relying on Astromech droids for navigation) *Genius\
    \ Intelligence (Reffered to as the wisest of all the Jedi orderUltimate Star Wars,\
    \ New Edition - p38Star Wars The Skywal"
