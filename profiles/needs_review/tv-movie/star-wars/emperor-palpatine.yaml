    source_ids: *id002
    confidence: 0.8
  range:
    text: 'Extended melee range with lightsaber. Galactic with Force powers (Briefly
      Force Choked Darth Tyranus from interstellar distances across Coruscant and
      Serenno while talking with him via hologram.The Lost One-Star Wars: The Clone
      Wars Sensed the death of Kanan Jarrus on Lothal and sensed the very planet''s
      fate changing while on Coruscant. Attempted to warp post Jedi training Luke''s
      mind while he was on Coruscant and Luke was far in the Outer Rim territories).
      Galactic to Interdimensional with Sith Magic (Capable of affecting targets across
      the galaxy with Sith Magic, as proven from when he used it on Yoda on Moraband
      while still on Coruscant. Used Sith Magic to reach into the "World Between Worlds"
      [which is a separate pocket of reality from the normal physical space and time
      of the universe and connects all normal space and time] in an attempt to capture
      Ahsoka Tano and Ezra Bridger). Galactic and Interdimensional with Force sense'
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Extraordinary Genius. True to his title, Darth Sidious was a master of
      subterfuge and guile, smoothly navigating galactic politics into the position
      of Supreme Chancellor despite the cutthroat competition and rampant corruption
      in the Senate at the time. As Supreme Chancellor he successfully commissioned
      the creation of the Clone Army and seized emergency powers to consolidate his
      position while simultaneously running the Separatist Alliance with the Jedi
      none the wiser, thus paving the path for the Jedi''s extermination with the
      galaxy-spanning Clone Wars. His promises of power also successfully turned many
      of the greatest Jedi to the Dark Side, including Count Dooku and Anakin Skywalker,
      making them feared symbols of the Sith while disposing of them as necessary.
      His ruthlessness and cunning as a political strategist were only matched by
      his incredible mastery of the Dark Side of the Force. Spending decades studying
      the most arcane and forbidden arts of both the Jedi and the Sith, he was a master
      of virtually every Force ability while developing new abilities to use at his
      leisure, becoming so powerful that he was a nexus of the Dark Side itself and
      utilizing techniques wielded by the greatest Sith Lords in history to become
      the mightiest of them all. Despite treating it as a mere game, Sidious was also
      a nearly unrivaled lightsaber duelist. Having mastered every form of lightsaber
      combat, he cut down several of the finest duelists in the Jedi Order with a
      single stroke each while facing multiple Jedi Masters at a time, including the
      mighty Mace Windu, and easily fended off the likes of Darth Maul and Savage
      Opress simultaneously. Effortlessly blending his mastery of the two arts in
      combat, he tended to lull his foes into a false sense of security by underperforming
      before cutting them down with his full strength or simply electrocuting them
      with his powerful Force Lightning. Sidious is also a tactical genius, single-handedly
      preventing the Imperial fleet from losing ground against the rebel forces through
      his use of battle meditation, coordinating the movements of hundreds of ships
      and countless starfighters single-handedly from his throne in the Death Star
      II. He also supplemented his already staggering genius with his mastery of foresight,
      allowing him glimpses into the future to overtake his opponents and plan for
      potentially dangerous events, even laying the ground for his return after his
      death in the Legends continuity. However, for all of his brilliance, he suffered
      from a critical flaw of the Sith: overconfidence. Sidious underestimated Windu''s
      ability to match him in lightsaber combat and was thus horribly scarred when
      Windu reflected Sidious'' Force Lightning. He also failed to account for Vader''s
      paternal instincts during his confrontation with Luke Skywalker aboard the Death
      Star, leading to Sidious'' death when his sadism led Vader to betray Sidious
      and throw him into the reactor core'
    source_ids: *id002
    confidence: 0.8
