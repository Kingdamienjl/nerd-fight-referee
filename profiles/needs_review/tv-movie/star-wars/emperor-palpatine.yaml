      value: 'Sidious is rather overconfident (As pointed out by Luke) | Some powers
        are only available to his reborn forms (his clone bodies). His clone bodies
        rapidly deteriorated over time due to his incredible power, lasting only a
        day or two by the time of his final death. This process also gradually deteriorated
        Sidious'' mind. After his last physical body was destroyed he will eventually
        descend into perpetual madness Notable Attacks/Techniques: *Tutaminis: Tutaminis
        is a set of Force abilities related to energy absorption. Designated as one
        in a family of Control abilities, tutaminis techniques are related to the
        idea that, through the Force, Force users can draw potentially harmful heat
