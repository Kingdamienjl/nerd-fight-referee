    - field: intelligence
      value: 'Genius (Obi-Wan has a long history of amazing diplomacy, to the point
        where he has swayed entire planets and armies to his side, to the point where
        he is referred to as "The Negotiator. Obi-Wan is one of the most decorated
        generals of the Clone Wars, constantly outwitting General Grievous'' many
        ploys and plans, and doing the same to some ploys by Count Dooku.) *Combat
        Skill: For more information about Lightsaber Combat forms, see this blog.
        For more information about Jedi training, see this blog **Lightsaber Combat:
        Obi-Wan is perhaps the most advanced user of Form III, otherwise known as
        Soresu, in Jedi History, managing to have an almost perfect win-loss record
        against General Grievous, who can successfully teach all seven primary forms
        of lightsaber combat.Star Wars: Card Trader (Set: Base Series 1, Card: Magnaguard
        - Separatists) Obi-Wan is borderline untouchable to Blaster Bolts,Obi-Wan
        Kenobi Comic Issue #3 as that is his chosen lightsaber form''s entire point,
        to the point where he is even comparable to Yoda when it comes to reflecting
        bolts as he is one of the few survivors of the Battle of Geonosis. Comparable
        to Darth Vader, whom while surrounded by blaster-carrying rebels, was completely
        untouched by any of them through sheer skill.Star Wars: Vader Down #1 **Hand-to-Hand
        Combat: While much less proficient in hand to hand than he is with his lightsaber,
        Obi-Wan is still capable of fighting others with his fists, including generals
        and The Mandolorian Pre VislaStar Wars: The Clone Wars: Season 2 Episode 12;
        The Mandalore Plot **Blaster Combat: While considering the practice uncivilized,
        Obi-Wan is an incredibly gifted user of blasters, most notably participating
        convincingly as a Bounty Hunter Sniper sufficient enough to even fool Cad
        Bane.Star Wars: The Clone Wars: Season 4, Episode 17; The Box Standard Tactics:
        As a Jedi, Obi-Wan prefers a peaceful solution to any conflict he finds himself
        in, but is not by any means slow when it comes to being forced into combat.
        Obi-Wan in combat is always observing his surroundings, looking for better
        vantage points and places to turn the battle to his favor via terrain. Obi-Wan''s
        lightsaber combat style is focused on wearing his opponent out while expending
        as little energy as possible, allowing him to last in back to back fights
        without issue while his opponents tire themselves out on his indomitable defense,
        and will always take openings his opponents give him Obi-Wan is also not at
        all against using force powers in combat, throwing pieces of the arena at
        his opponents or spamming force pushes to overpower opponents, or causing
        natural disasters to incapacitate an opponent. While rarely possible, Obi-Wan
        when faced with an opponent his Precognition tells him he can overpower, he
        will attempt to disarm them with the force as soon as possible.Obi-Wan & Anakin
        (2016)'
