      Fought Darth Maul alongside Qui-Gon Jinn and consistently forced the Sith back,
      and later entered a short duel with him one-on-one while amplified by rage.
      Qui-Gon Jinn stated that Kenobi at this point would make an exceptional Jedi
      Knight and quickly surpass him. Should be more powerful than High-Republic knights,
      who stopped debris that destroyed moons in the Great Hyperspace DisasterStar
      Wars: The High Republic (Light of the Jedi)), higher when guided by the Force,
      much higher with Empowerment and Rage Power | City level+ with Force Amplification
      and Telekinesis (Far more powerful than before due to training, and has become
      a Jedi master, whom are some of the most powerful of the order,Star Wars: The
      Secrets of the Jedi along with Qui-Gon Jinn''s statement that Obi-Wan would
      surpass him at this point. Obi-Wan during the clone wars was a frequent opponent
      of General Grievous,Star Wars: The Clone Wars: Season 1 Episode 4; Destroy MalevolenceStar
      Wars: The Clone Wars: Season 2 Episode 9; Grievous IntrigueStar Wars: The Clone
      Wars: Season 3, Episode 2; ARC Troopers usually having the upper hand on the
      good general. Fought Count Dooku on multiple occasions, though Obi-Wan always
      had the help of Anakin Skywalker.Star Wars: The Clone Wars: Season 6 Episode
      10; The Lost One Fought Clone Wars Darth Maul on multiple occasions,Star Wars:
      The Clone Wars: Season 4 Episode 22; Revenge and injured Savage Opress'' knee
      with a kick, who could grossly overpower other Jedi. Repeatedly outmatched Asajj
      Ventress throughout the Clone Wars,Star Wars: The Clone Wars (General) who could
      help Obi-Wan fight Maul and Savage), higher when guided by the Force, much higher
      with Empowerment and Rage Power | At least City level+ with Force Amplification
      and Telekinesis (Fought and defeated General Grievous near the end of the Clone
      Wars. Telekinetically stalemated Anakin Skywalker during their duel on Mustafar,
      who was declared by Palpatine to have a power that nearly rivalled his own.[Book]
      Star Wars: The Secrets of the Sith His powers increased after tapping into the
      Dark Side.[Website] StarWars.com | The Official Star Wars Website: Anakin Skywalker
      After killing the Separatist leaders, his anger and hate made him stronger,
      transforming him into a full-fledged Sith and becoming more powerful than the
      Jedi who had long held him back[Paperback Book] Los Angeles Times: Star Wars:
