  intelligence:
    text: 'At least Gifted (Darth Maul, despite his silent brutish appearance in The
      Phantom Menace, is an incredibly capable and intelligent manipulator, even pulling
      stunts over on Sheev Palpatine and The Jedi,Star Wars: The Clone Wars (General)
      and successfully out-strategizing both General Grievous and Count Dooku at the
      same time,Star Wars: Darth Maul; Son of Dathomir: Issue #2 with Sheev Palpatine
      eventually coming to fear Maul as a potential threat to the Republic. Even by
      the time of the Phantom Menace, Maul is one of the most highly trained Sith
      in the order''s history,Star Wars The Complete Visual Dictionary New Edition
      which includes in the art of manipulation and scheming.The Star Wars Book Maul
      ruled a large crime syndicate for multiple years in The Empire known as the
      Crimson Dawn, successfully piloting it until his deathSolo: A Star Wars Story)
      *Combat Skill: Maul as a combatant has consistently been able to fight multiple
      foes at once, or overwhelm singular foes such as Savage Opress. Maul''s most
      notable trait is being able to keep up with Obi-Wan Kenobi during the Clone
      Wars, and usually overwhelmed the Jedi''s borderline indomitable defense, to
      the point where he can put up a fight against foes like Darth Vader. Standard
      Tactics: Maul is a very aggressive fighter who focuses on rush down tactics
      in combat against other swordfighters, and force powers on those without blades
      to duel him with, however, Maul notably varies his tactics depending on the
      opponent, being willing to be defensive, casual, or spamming force powers if
      he feels he needs to.Star Wars: The Clone Wars Season 7 Episode 11; ShatteredStar
      Wars: The Clone Wars Season 7 Episode 12; Victory and Death'
    source_ids:
    - vsbattles-darth-maul-star-wars
    confidence: 0.6
    notes: auto_repair source extraction
