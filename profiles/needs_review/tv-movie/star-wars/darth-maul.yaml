    overwhelmed the Jedi''s borderline indomitable defense, to the point where he
    can put up a fight against foes like Darth Vader. Standard Tactics: Maul is a
    very aggressive fighter who focuses on rush down tactics in combat against other
    swordfighters, and force powers on those without blades to duel him with, however,
    Maul notably varies his tactics depending on the opponent, being willing to be
    defensive, casual, or spamming force powers if he feels he needs to.Star Wars:
    The Clone Wars Season 7 Episode 11; ShatteredStar Wars: The Clone Wars Season
    7 Episode 12; Victory and Death'
