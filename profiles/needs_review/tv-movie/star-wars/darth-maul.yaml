- id: claim-weaknesses-cf692f74
  section: weaknesses
  axis: weakness
  text: "Darth Maul can be extremely overconfident when he feels he has the upper\
    \ hand, thus is how he lost to Obi-Wan Kenobi on Naboo, Ahsoka Tano on Mandalore,\
    \ and Old Ben Kenobi on Tatooine. | As before | As before, plus Maul's cybernetic\
    \ legs are malfunctioning | As before, though his legs seem to be fixed Notable\
    \ Attacks/Techniques: *Form VII (Juyo): Known as the Way of the Vornskr and the\
    \ Ferocity Form, Juyo is the seventh of the seven forms of Lightsaber combat,\
    \ known as the most vicious form. Developed for the purpose of one-on-one duels,\
    \ Juyo was a ferocious, chaotic style with a heavy focus on offense. Relying upon\
    \ bold, direct, and unpredictable attacks, Juyo uses powerful movements with great\
    \ force to overpower and outmatch opponents. Requiring intense focus and drawing\
    \ upon Maul's emotions, Juyo's strength grows as Maul's rage intensifies. While\
    \ Maul's primary form is Juyo, he also has knowledge of other forms. *FORM II:\
    \ MAKASHI Promotes precision and discipline over strength or power. Often used\
    \ in duels. Developed very quickly after Form I, Makashi was the preeminent Form\
    \ used in lightsaber dueling. While Shii-Cho could be very open and emotionally\
    \ driven, Makashi was precise and controlled, very formal. Created after the rise\
    \ of the Sith, it fell out of fashion when the Sith were defeated at Ruusan, and\
    \ was treated as little more than a training style. However, a true master of\
    \ Form II, such as Count Dooku, was a very dangerous opponent. *FORM III: SORESU\
    \ The most defensive form. Includes using the lightsaber as a shield against blaster\
    \ fire. Developed as the Jedi became focused on blocking blaster and projectile\
    \ weapons, Soresu was the first lightsaber Form of the modern age. Largely a defensive\
    \ technique, it reflected the Jedi\u2019s role as peacekeepers. It had few offensive\
    \ techniques, and focused on the Jedi surviving long enough for the opponent to\
    \ make a mistake. While effective, it needed to be studied with a complementary\
    \ attack Form. ==Notable Matchups== Victories: Losses: General Anakin Skywalker\
    \ (Star Wars) Anakin's Profile (Season 6 Clone Wars Anakin and Clone Wars Darth\
    \ Maul were used. Speed was equalized and both were their canon counterparts)\
