    - field: weaknesses
      value: 'Is physically human and reaching the limitations of elderly age. Notable
        Attacks/Techniques * Force Lightning: Being the first dark side user seen
        on screen using this ability, Darth Sidious is not only a professional with
        this power but is renowned as the greatest Sith lightning force user in galactic
        history. * Force Drain: While it can be argued on Sidious being superior to
        Darth Nihilus''s force drain, it should be noted that he is a master of this
        ability, and when he uses it, most jedi would fall down dead on the floor
        over such drainage from their power onto the evil Sith lord. * Resurrection:
        On many occasions after Star Wars Episode VI: Return of the Jedi, Sidious
        was able to come back more than twice being reborn. * Form VII: Juya: A undeniably
        aggressive and violent light saber form of combat that is specially a dark
        boost for Darth Sidious in battle. * Form VI: Nimen: A great adversary of
        help for Darth Sidious''s unpredictability in combat with a single or multiple
        range of enemies. * Form V: Shien: The most balanced lightsaber of Sidious
        swordsmen skills that works in a usual same time event of offensive and defensive.
        * Form IV: Ataru: Sidious can make the most devastating acrobatic offensives
        that would be a mortal blow on the opponent. * Form III: Soresu: Darth Sidious
        has used this form to it''s fullest potential in defending himself against
        the most offensive Jedi duelist ever being Grand Master Yoda. * Form II: Makashi:
        Amazingly despite Sidious vicious and aggressive uses of all the other forms
        of lightsaber forms of combat, he can use this elegant old french maneuver
        very well towards his enemies. * Form I: Shii-Cho: With Darth Sidious having
        so much knowledge in using these skills, he knew Shii-Cho so well that even
        one of the greatest Shii-Cho swordsmen Kit Fisto completely failed in competing
        with Sidious in light saber combat.) Note: The reason why Darth Sidious isn''t
        scaled to the valley of Jedi statement of being capable to do supernovas within
        a thought is because we don''t know for sure how exactly they were able to
        conjure up a supernova within a thought.Category:Finiznot Category:Tier 4
        Category:Tier 7 Category:Tier 8 Category:Tier 5 Category:Tier 6 Category:Tier
        2'
