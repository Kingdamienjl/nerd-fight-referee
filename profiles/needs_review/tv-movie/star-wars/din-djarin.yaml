        gadgets, such as tech built into its helmet visor which grants infrared vision.
        * Kom''rk: The vambrace Din Djarin wears one on each arm. They are equipped
        with various gadgets and weaponry: ** Fibrecord thrower: A metallic whip that
        throws itself instantly when used. It is also equipped with a grappling hook
        and can thus be used to climb higher surfaces or pull targets closer. Both
        Kom''rk used by Din Djarin are equipped with one. ** Vibro-knife: Sheathed
        in his boot, Din Djarin can automatically draw this vibrating knife to his
        hand thanks to his armor, he can then use it for close-combat or to throw
        it at targets. ** Flamethrower: Capable of reaching a few meters, it can be
        used, in both Kom''rk, consistently for around 20 seconds, it can malfunction
        and outright stop after heavy usage. ** Whistling Bird missiles: Small missiles
        made of Beskar that home into targets while doing some pirouettes; they penetrate
        a target and explode inside their bodies. Described and proven to be effective
        against multiple enemies, these missiles are also rare, and thus not often
        used in battle. * Sticky bombs: Bombs that stick on surfaces before blowing
        up within a seemingly adjustable timeframe and variable yield. * Flash charges:
