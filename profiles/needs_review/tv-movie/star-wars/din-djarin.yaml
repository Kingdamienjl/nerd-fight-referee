- id: claim-powers-and-abilities-97942708
  section: abilities
  axis: hax
  text: "{{Border|Scroll=No|Visible=Yes|Padding=Yes|Content= |-|By Himself= * Superhuman\
    \ Physical Characteristics * Combat Mastery (Regularly defeats Stormtroopers even\
    \ when they're in groups of 3 or 4S2-E4: The Siege S3-E7: The Spies , outmaneuvered\
    \ Moff Gideon in their first encounter (though the episode later reveals the latter\
    \ benefited from such loss, leaving unclear if it was on purpose) S2-E8: The Rescue\
    \ and despite being tired and hurt, he could put up some fight on their second\
    \ meeting S3-E8: The Return , explored the weakness of the Scorpenek Droid's shield\
    \ Book Of Boba Fett Ep. 7: In The Name Of Honor, won a duel against Paz Vizsla\
    \ S3-E1: The Apostate and is shown to be on par with Bo-KatanS3-E7 The Spies,\
    \ The Armorer S3-E5: The Pirate, FennecS2-E6: The Tragedy and Boba Fett Book Of\
    \ Boba Fett Ep. 6: From The Desert Comes A Stranger. Single-handedly defeated\
    \ a Darktrooper S2-E8 The Rescue, many times more resistant than a regular Droid.\
    \ Could react to and get Ahsoka Tano at gun point S2-E5: The Jedi ) * Stealth\
    \ Mastery (Displayed on The Sin & The Prisoner. Could surprise Fennec S1-E5: The\
    \ Gunslinger, regularly sneaks around highly secured facilities, both from the\
    \ New Republic S1-E6: The Prisoner and from The EmpireS2-E4: The Siege, without\
    \ much effort despite some of them being watched by cameras and filled with soldiers\
    \ S1-E3: The Sin and security droids) * Weapon Mastery (Besides doing great with\
    \ improvisational environments S1-E4: The Sanctuary , Din Djarin is skillfull\
    \ in wielding basically any weapon that he got in his hand, be it a lance S2-E5:\
    \ The Jedi , a sword S3-E6: Guns For Hire, a knife S3-E1: The Apostate or any\
    \ type of blasters Book Of Boba Fett Ep. 6: From The Desert Comes A Stranger S2-E7:\
    \ The Believer, no matter the range of the weapon. With the skills he possess\
    \ with those weapons he is able to at least compare \u2013 when not be superior\
    \ to \u2013 other skillfull contemporary fighters such as Boba Fett Book Of Boba\
    \ Fett Ep. 6: From The Desert Comes A Stranger , Moff Gideon S2-E8: The Rescue\
    \ S3-E8: The Return , Paz Vizsla S3-E1: The Apostate, Bo-Katan Kryze S3-E7: The\
    \ Spies and The Armorer S3-E5: The Pirate ) * Enhanced Vehicular Mastery (A Skilled\
    \ pilot, Din Djarin basically understands how to pilot every vehicle he's seen\
    \ inside, ranging from old republic models (one of the tools he uses to not be\
    \ successfully intercepted by either New Republic and Empire's guards) to the\
    \ most up to date ships S2-E7: The Believer, to the point where he knew piece\
    \ by piece what to get and how to assemble said parts to get his new custom spaceship\
    \ Book Of Boba Fett Ep. 5: The Return Of The Mandalorian, the 8th fastest ever\
    \ recorded. His knowledge extends to speeder bikes S1-E5: The Gunslinger and other\
    \ land vehicles S2-E7: The Believer that he can use either regularly or in battle\
    \ situations Book Of Boba Fett Ep.7: In The Name Of Honor) * Animal Handling (Can\
    \ regularly tame the animals that he rode S1-E2: The Child) * Hacking (Din Djarin\
    \ has shown more than once that he can bypass the security system both from the\
    \ New Republic and from the Empire, by invading highly secured facilities of those\
    \ organizations and hijacking the cameras and/or the self-destruction systems\
    \ with rather ease S1-E6: The Prisoner) * Social Influencing (Din Djarin's story\
    \ is filled with moments where he solves the problems that appear in front of\
    \ him by understanding people's views and opinions on said matter S1-E5: The Gunslinger\
    \ S2-E1: The Marshal S3-E6: Guns For Hire, which usually seem uncharacteristic\
    \ from the mask and armor that sometimes is rather intimidating for those who\
    \ know about the existence of Mandalorians or is on the bounty hunter market (specially\
    \ because Din Djarin is pretty known in the galaxy due to his proficiency as a\
    \ bounty hunter) Book Of Boba Fett Ep. 5: The Return Of The Mandalorian) |-|Weaponry=\
    \ {{#tag:tabber| {{!}}-{{!}}Seasons 1 and 2={{Border|Scroll=Yes|Visible=No|Content=\
    \ * Explosion Manipulation with Relby-v10 micro grenade launcher * Enhanced Senses\
    \ (Manually via Amban sniper rifle, helping not only his vision but also being\
    \ able to hear distant conversations S1-E3: The Sin) * Contact-based Electricity\
    \ Manipulation via Amban sniper rifle (This weapon works with electricity, and\
    \ can be used at close-range S1-E2: The Child sending discharges when triggered\
