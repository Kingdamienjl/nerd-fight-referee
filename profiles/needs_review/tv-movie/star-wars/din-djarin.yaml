        * IB-94 blaster pistol: A gun that shoots focused high-penetration plasma
        bolts. Mando is particularly good with it both in accuracy and on quickdraws.
        * Amban phase pulse sniper rifle: A rifle that instantly disintegrates targets,
        which are usually the size of humans. The two-pronged bayonet part at the
        end of the barrel can be used to electrocute targets on contact. The rifle
        has scopes and instruments that can be used to detect targets through thick
        permacrete walls and even make Mando hear distant sounds/conversations. *
        Jetpack: A device on his back that he can control manually or apparently with
        thoughts. It lets him fly quickly or moderately at choice, and at considerable
        heights. * Darksaber: The Darksaber is an ancient and unique black'
