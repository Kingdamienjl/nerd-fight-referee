- id: claim-weaknesses-dc5bb9c2
  section: weaknesses
  axis: weakness
  text: '* Occasionally, Din Djarin can actively let others hit his armor without
    trying to dodge or block, he can even approach attacks so that they may end faster
    (The latter is also to harm more attackers using physical blows while weaker than
    his Beskar is durable. Mando has a solid idea of the durability of his armor and
    it thus advances the passing of battles to do all this, especially when facing
    many foes at once)S2-E1: The Marshal. * Sufficiently powerful shots or attacks
    can briefly stun him. * Following his Mandalorian code, he refuses to remove his
    helmet in front of others, even when mortally wounded and with others offering
    to heal him. His firm belief in the creed can lead him to acting out of his own
    and not pay proper attention to details, getting him into trouble S3-E2: The Mines
    Of Mandalore * Most of the time that Din Djarin had with the Darksaber he couldn''t
    use it properly, although there''s a brief moment before he gives it away that
    he is shown using it correctly, so it shouldn''t be a factor anymore. S3-E6: Guns
    For Hire Notable Attacks/Techniques File:Mando''s_Enhanced_Senses-Chapter_4_Sanctuary.gif|Heat
    detection File:Mando_finding_a_sewer_behind_stuff-Chapter_8_Redemption-The_Mandalorian.gif
    File:Mando''s_sticky_bomb-The_Mandalorian-The_Sin.gif|Sticky bomb File:2_of_Mando''s_bombs_vs_Outland_TIE_fighter-Chapter_8_Redemption-The_Mandalorian.gif|2
    bombs File:Mando''s_flamethrower-The_Mandalorian-The_Sin.gif|Flamethrower File:Mando''s_flamethrower_2-The_Mandalorian-The_Sin.gif
    File:Mando''s_Fibrecord_thrower-Chaper_2_The_Child-The_Mandalorian.gif|Fibrecord
    thrower File:Mando''s_grap_hook-The_Mandalorian-The_Sin.gif File:Mando_burning_a_droid_&_pulling_other_into_the_fire-The_Prisoner-The_Mandalorian.gif
    File:Mando_trying_to_hang_a_target-The_Prisoner-The_Mandalorian.gif File:Mando''s_fibercord_whip-The_Marshal-The_Mandalorian.gif
    File:Mando''s_vibroknife-The_Marshal-The_Mandalorian.gif|Vibroknife File:Mando''s_homing_missiles-The_Mandalorian-The_Sin.gif|Whistling
    Bird missiles File:Mando''s_Whistling_Bird_missiles-The_Marshal-The_Mandalorian.gif
    * Beskar''gam: Din Djarin wears an armor made mostly of Beskar, metal durable
    enough to withstand blaster shots. The armor is equipped with several diverse
    gadgets, such as tech built into its helmet visor which grants infrared vision.
    * Kom''rk: The vambrace Din Djarin wears one on each arm. They are equipped with
    various gadgets and weaponry: ** Fibrecord thrower: A metallic whip that throws
    itself instantly when used. It is also equipped with a grappling hook and can
    thus be used to climb higher surfaces or pull targets closer. Both Kom''rk used
    by Din Djarin are equipped with one. ** Vibro-knife: Sheathed in his boot, Din
    Djarin can automatically draw this vibrating knife to his hand thanks to his armor,
    he can then use it for close-combat or to throw it at targets. ** Flamethrower:
    Capable of reaching a few meters, it can be used, in both Kom''rk, consistently
    for around 20 seconds, it can malfunction and outright stop after heavy usage.
    ** Whistling Bird missiles: Small missiles made of Beskar that home into targets
    while doing some pirouettes; they penetrate a target and explode inside their
    bodies. Described and proven to be effective against multiple enemies, these missiles
    are also rare, and thus not often used in battle. * Sticky bombs: Bombs that stick
    on surfaces before blowing up within a seemingly adjustable timeframe and variable
    yield. * Flash charges: Devices that create an intense light which can briefly
    incapacitate the sight of targets. The few hundreds of meters that this light
    reaches makes it perfect to disorient foes, which Mando has used to approach into
    a more preferable combat range. File:Mando''s_Amban_sniper_rifle-The_Mandalorian-The_Sin.gif|Using
    the Amban sniper rifle to disintegrate targets File:Mando''s_Amban_sniper_rifle_2-The_Mandalorian-The_Sin.gif
    File:Mando''s_electricity_manipulation-The_Mandalorian-The_Sin.gif|Using the Amban
    sniper rifle to electrocute a target File:Mando''s_electricity_manipulation-Chapter_1-The_Mandalorian.gif
    File:Mando''s_Amban_phase_pulse_sniper_rifle-The_Marshal-The_Mandalorian.gif File:Mando_using_his_jetpack_Fibrecord-Chapter_8_Redemption-The_Mandalorian.gif|Jetpack
    * IB-94 blaster pistol: A gun that shoots focused high-penetration plasma bolts.
    Mando is particularly good with it both in accuracy and on quickdraws. * Amban
    phase pulse sniper rifle: A rifle that instantly disintegrates targets, which
    are usually the size of humans. The two-pronged bayonet part at the end of the
    barrel can be used to electrocute targets on contact. The rifle has scopes and
    instruments that can be used to detect targets through thick permacrete walls
    and even make Mando hear distant sounds/conversations. * Jetpack: A device on
    his back that he can control manually or apparently with thoughts. It lets him
    fly quickly or moderately at choice, and at considerable heights. * Darksaber:
    The Darksaber is an ancient and unique black'
