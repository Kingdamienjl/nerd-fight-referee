    - field: weaknesses
      value: 'Suffers continuous mental conflict over his Light Side nature conflicting
        with his desire for more power in the Dark Side of the Force. Notable Attacks/Techniques:
        *Telekinesis: Kylo Ren can use this through the Force to put his mind literally
        over matter, capable of blasting opponents, shielding himself or disarming
        people, its limits are only those of the creativity that Force User has. Kylo
        Ren has demonstrated considerable prowess with the power, even halting the
        movement of a blaster bolt in mid-air. *Telepathy: Can easily manipulate others
        mentally with the Force to trick, deceive, maim, or even kill outright. Kylo
        Ren has a considerable mastery for the power, able probe for hidden thoughts
        in the minds of others, and learns them for himself. *Tutaminis: Through the
        Force, Kylo Ren can draw potentially harmful energy into his body and diffuse
        it or channel it away completely. Kylo Ren demonstrated this power when he
        used the Force to block several of Rey''s lightsaber strikes with his bare
        hands. *Force Stasis: Force Stasis was an ability of the Force to forcibly
        halt things headed in a Force-user''s direction, from people up to and including
        blaster bolts. Note: ==Notable Matchups== Victories: Lord Helmet and Megamaid
        (Spaceballs) Lord Helmet''s Profile, Megamaid''s Profile (Supremacy is commanded
        by Kylo Ren circa Rise of Skywalker. Megamaid is commanded by Lord Helmet.
        Both ships have all their carried craft, troops and screening ships. Battle
