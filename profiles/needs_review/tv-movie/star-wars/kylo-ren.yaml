- id: claim-powers-and-abilities-5a36545e
  section: abilities
  axis: hax
  text: 'Pre-Rise of Skywalker= *Superhuman Physical Characteristics (With Force Amplification)
    *Force Sensitive (Sith Acolyte) *Enhanced Senses (Senses Luke''s presence on Dagobah
    even decades after his training there) *Extrasensory Perception (Can sense others
    power in the force, also senses Rey''s pain) *Telekinesis (Pulls an officer into
    a choke) *Status Effect Inducement (Immobilized Rey) *Sleep Manipulation (Put
    Rey to sleep with a wave of his hand) *Forcefield Creation (Uses a barrier to
    survive the crash landing of a ship) *Memory Manipulation (Entered Del''s head
    and easily "broke" his memories) *Enhanced Vehicular Mastery (Kylo shows considerable
    piloting skills during his attack of the Raddus, and his ship is the 4th fastest
    ever recorded) *Rage Power & Damage Reduction (with FRENZY; Kylo Ren enters a
    frenzied rage and leaps from enemy to enemy, striking them with his lightsaber
    and reducing damage dealt to him[Game] Star Wars Battlefront II) |-|Rise of Skywalker=All
    previous abilities, plus: *Healing (Used Force Healing on Rey and saved her, sacrificing
    his own life) |-|Resistances= *Resistance to Mind Manipulation (Resists Rey''s
    Mind Trick)'
  source_ids: *id003
  decisive: true
