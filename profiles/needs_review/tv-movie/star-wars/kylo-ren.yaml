  intelligence:
    text: Gifted (Though young, Kylo Ren has very high intelligence, He was the best
      student at Luke's Jedi academy, and because he is very gifted, he was able to
      surpass the other apprentices in the various areas of the Jedi training. Voe
      attempted to beat him in lightsaber combat, meditation, and other Jedi techniques,
      but she never succeeded. He was a dedicated Jedi apprentice and used to practice
      calligraphy, the art of fancy handwriting that was abandoned long ago by the
      people of that time, in order to record his observations of the lessons. He
      was both the commander of the First Order military forces and leader of the
      Knights of Ren. He also seems to know every Stormtrooper by number, which is
      impressive considering the vast number of them which exist. Skilled and experienced
      combatant. Considered "unstoppable" on the battlefield of the new trilogy era)
    source_ids:
