    - field: weaknesses
      value: 'Some of his more powerful techniques might end up draining Luke of his
        stamina or health with repeated uses Notable Attacks/Techniques: *Alter: Using
        the Force to cloak himself in a different form through the usage telepathy
        against others (invasive or external), Luke has repeatedly maintained this
        ability even against advanced recording and surveillance equipment and dense
        population centers on planets such as Coruscant. Later on, he can perform
        such a skill to the extent with his experience and power that it comes subconsciously
        to him and no longer stre *Battle Meditation: A Force ability which considerably
        boosted the morale, stamina, and overall battle prowess of an individual''s
        allies while simultaneously reducing the opposition''s combat-effectiveness
        by eroding their will to fight. With the Force, one could coordinate entire
        fleets of ships, allowing them to perform at maximum efficiency, acting as
        a single entity with the ability to counter every enemy move quickly and effectively.
        Though ideal for meditating large-scale conflicts, battle meditation was equally
        effective when employed for the benefit of one''s comrades in small skirmishes,
        attacks, and duels. *Emerald Lightning/Electric Judgement: A Force generated
        blast of electric currents/lightning that can instantly knock out its targets
        or kill them on contact depending on the user''s intended output. *Empathy:
        Capable of picking out feelings, emotions, and behaviors with the Force; Luke
        can also use this to send mental pictures or impressions into his allies or
        enemy''s minds; works across interstellar space and can be used to sense stress
        points or areas of danger or psychic whiplashes from major events. *Flow-walking:
        Used to look into the past and the future. It is unknown if Luke is able to
        use it in the same ways as Darth Caedus. He has only shown the ability to
        look into the past. *Fold Space: An Aing-Ti Force technique that transmits
        an object through the Force to any location Luke deems, ignoring space and
        time to do so. *Force Barrier: Both an offensive and defensive Force power
        that creates a barrier or wall of Force energy around the intended target,
        be itself, friend, or foe. Depending on the strength of the individual, the
        barrier could only withstand a few attacks before collapsing. *Force Blast:
        Luke Skywalker projects concentrated blasts of pure Force energy at objects
        or opponents. Luke''s particular variant of this power takes the form of golden
        flames. *Force Harmony: A Light side Force power that allowed several Force-users
        to join their Force energies together in a pure and powerful manifestation
        of the light side. Bathing them in light side energies, the ability protected
        users from dark side powers and could sever opponents from the dark side entirely.
        When used by Luke+his sister+unborn Anakin Solo it severed Darth Sidious from
        his Force Storm that can destroy fleets and Palpatine''s connection to the
        dark side was quite strong as well. *Force Healing: Accelerates the body''s
        natural healing process at a rapid pace. Master practitioners of the art can
        even heal themselves from fatal injuries in a short span of time (like being
        cooked alive, punctured lungs, etc). *Force Illusion: Using the White Current
        (the Force) to place a physical or external illusion in real world rather
        than use a invasive illusion via Telepathy; Luke taught his students how to
        cloak Yavin IV with this power and placed a large starship under a Force Illusion
        that lasted longer than a year (the minimum) while he was still a novice under
        Fallanassi teachings. Currently he has reached a state that allows him to
        use Force Illusions even on starfighters and starships while they are going
        at combat speeds in the middle of a dogfight to such a level that it seemed
        like they "teleported" from one place to another when he created a copy of
        the Jade Shadow and cloaked the real one at the same time. *Force Immersion:
        An advanced technique of the Fallanassi which invokes the White Current (the
        Force) to render its invoker completely invisible, to the point of being undetectable
        by electronic, Force-based or other means. Luke could use this to such an
        extent that it seemed like he died when he used it. *Force Light: Harnesses
        raw light side energy to either contain or destroy dark entities. The technique
        is rather broad in application and usage. *Light Side: During one of Luke''s
        first battles with the dark side or Force-being known as Abeloth, he used
        the Force to gain an energy or golden light that countered Abeloth''s own
        Force powers and seemingly allowed him to absorb or steal away her own powers
        temporarily, as well as boosting his own powers both psychically and physically.
        *Force Stealth: A power that was used by highly skilled Force-sensitives to
        mask their Force alignment (Light or Dark), their ability to use the Force,
        or even their entire presence from other Force-sensitives. *Force Stun: Luke
        Skywalker locks an enemy in catatonic paralysis. *Ionize: Allow'
