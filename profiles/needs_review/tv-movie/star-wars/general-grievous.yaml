- id: claim-powers-and-abilities-e0c06897
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= *Superhuman Physical
    Characteristics *Self-Sustenance (Type 1) *Weapon Mastery & Martial Arts (Was
    trained by Count Dooku in Jedi Arts, making him a master of many of the classic
    forms of the Jedi arts,Ultimate Star Wars, New Edition even being able to quickly
    adapt to an opponent''s fighting style. His cyborg implants grant him fighting
    prowess equal to that of a Jedi) *Cyborgization (Normal; The only organic parts
    left is his brain, parts of the spine, eyes, and vital organs such as his heart
    and lungs. Everything else is cybernetics) **Self-Sustenance (Types 1 & 2; Do
    to being a Cyborg, Grievous lacks the need to eat or breath) *Body Control & Additional
    Limbs (Can divide each of his arms into two. Can completely rotate his hands,
    being able to use his lightsabers like helicopter propellers at higher speeds
    than how he normally attacks) *Acrobatics & Surface Scaling (Can leap great distances,Star
    Wars: Age of Republic - General Grievous and has repeatedly shown to be able to
    climb & mobilize on walls and ceilings) *Self-Magnetism Manipulation (His talons
    are stated to be magnetic) *Limited Thread Manipulation (Has a grapple line built
    into his right wristStar Wars: The Complete Visual Dictionary New Edition) *Plasma
    Manipulation, Energy Projection and Heat Manipulation (Through blaster weaponry,
    which fires plasma energy that melts through targets) Resistance to: *Cosmic Radiation
    (Stated to be able to survive a vacuum, launched himself out to space without
    any harmful effects) *Extreme Heat, Plasma Manipulation & Energy Projection (Despite
    his insides being caught on fire and later on, exploding, his body remained unscathed,
    even after getting hit with blaster shots) *Poison Manipulation (Due to being
    a Cyborg, he is immune to poison and toxins) }}'
