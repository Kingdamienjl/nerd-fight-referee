    means of victory in combat, including involving innocents in the crossfire as
    well as using his Magnaguards to attack his opponents from behind as he continued
    to press on them from the front. However, he is quite arrogant and self-assured
    and sometimes underestimates his targets once he has the upper hand and will fail
    to counter for outside factors, such as Hondo Ohnaka using a starfighter to intervene
    in Grevious'' battle with Ahsoka Tano.'
