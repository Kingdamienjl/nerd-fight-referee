  durability:
    text: 'City level+ ([https://youtu.be/xaBiygfkudk?t=242 Took a kick from Obi-Wan],
      Feared as a Jedi hunter, his collection of dozens of lightsabers proved his
      effectiveness in combat, easily adapting to various Jedi tactics before going
      in for the kill. He is also a skilled pilot and marksman, often clashing with
      Republic forces in his own starfighter and with blaster weaponry when necessary.
      even overwhelming multiple Jedi at once. stated to be a Major Force in the clone
      wars, both in strategy and combat, can use his lightsabers to lethal effectiveness.
      [https://cdn.imgchest.com/files/84466b8a08ba.jpg Is said to be a Brilliant Military
      Strategist] they are not actual names Grievous gives to his tactics. In-game,
      Grievous would only 2 lightsabers, Thrust Surge allows him to use all 4 arms,
      rushing forward as he stabs with 4 lightsabers at once. The damage is unblockable
      in-game, representing how difficult it would be to block such an assault. Grievous
      would sometimes use a similar tactic in canon. ** Unrelenting Advance: A technique
      Grievous often implements in combat, he uses his cybernetics to spin his lightsabers
      in 2 hand like helicopter propellers, forming both a shield of sorts, and an
      incoming assault that would be difficult to defend against, all while leaving
      2 other arms free. Even Obi-Wan reacts initially shocked to the speed of the
      spinning blades, if he is able to defend against the move. ** Claw Rush: A technique
      Grievous often uses across his life, if rarely in combat. Uses his cybernetics
      to crawl through the ground at high speed, bending his legs backwards and using
      all 4 arms, resembling a spider. A simple pirouette puts his body back to normal
      when he finishes. In this state, Grievous can hold himself in walls, roofs,
      and unstable terrain. While defeated, Grievous managed to escape and run over
      a merciful Obi-Wan once using this move, likely helped by the unpredictability
      of this contortion. And Grievous is portrayed as being able to damage comparable
      foes by running over them with this technique in one game. *Lightsaber skills:
      Despite his lack of Force-sensitivity, Grievous was highly skilled in lightsaber
      combat and a highly gifted duelist. He was one of the greatest lightsaber duelists
      of his time, as he killed dozens of Jedi, from Padawans to Jedi Masters. He
      was personally trained by Count Dooku, and was able to utilize not only his
      hands but also his feet when wielding lightsabers. Grievous was one of the few
      warriors in the Galaxy to know all seven major forms of lightsaber combat (Form
      I/Shii Cho, Form II/Makashi, Form III/Soresu, Form IV/Ataru, Form V/Shien/Djem
      So, Form VI/Niman, and Form VII/Juyo), and the only being among these that was
      not Force-sensitive. Grievous was a master of Jar''Kai; he was one of the deadliest
      practitioners of the style. ==Feats== *[https://youtu.be/ciMbuvfSQtk?si=osB9DxYLW-6p8XBw
      Contended] [https://youtu.be/JeuZz6J5tvc?si=7po4lDg9fi-1zPnx with Obi-wan Kenobi]
      [https://youtu.be/xaBiygfkudk?si=_OUrfnus2IdOiMGU multitudes] [https://youtu.be/eB_8kemA0ts?si=4e_9ynf2NnZm7bCb
      of times.] *[https://youtu.be/2tddAJyQSqk?si=Ip3hjDMwEWB_zDx4 Fought and defeated
      Ahsoka in their first encounter] *[https://youtu.be/CK5vWgib5Fk?si=SBqmatba5PccIZIZ
      Evenly fought against Ahsoka in their second encounter] *[https://imgur.com/gallery/general-grievous-vs-darth-maul-I3nmBga
      Briefly fought with] [https://imgur.com/gallery/general-grievous-vs-darth-maul-2-ohverWi
      Darth Maul, two times] *[https://youtu.be/Ki4va8PQyjg?si=XEsML2x8dPntXRCH&t
      Contended with Kit Fisto] *[https://youtu.be/mtkGzqVqsUk?si=WHdsbcYn1wcHZo9y
