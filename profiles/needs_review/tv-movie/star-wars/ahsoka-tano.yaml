    - field: intelligence
      value: Unknown (Even in her early days as a Padawan, Ahsoka was unusually talented
        at lightsaber combat. Preferring an unorthodox reverse-hand grip as per the
        ancient version of Form V, she managed to single-handedly defeat three MagnaGuards
        and later went on to duel with infamous assassin Asajj Ventress as well as
        the infamous Jedi Hunter, General Grievous. Her skills only grew during her
        time in the order, switching to the Jar'Kai two sword style and surviving
        a second clash with Grievous even after he began using four swords at once.
        She is also a talented wielder of the Force, being so advanced in the use
        of telekinesis and Force Speed that her master, Jedi Knight Anakin Skywalker,
        sometimes forgot how young she was. Seventeen years after leaving the Jedi
        Order, she has honed her skills to mastery, casually defeating two Inquisitors,
        dueling former Sith Lord Darth Maul on even ground, and putting up a respectable
        fight against Darth Vader. In addition, the executive director of Rebels went
        so far as to say that Ahsoka's overall might was only rivaled by Vader and
        Sidious, further emphasizing the degree of her power and skill)
      source_id: vsbattles-ahsoka-tano-star-wars
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'By the end of the series, Ahsoka has become overly reliant on her second
        lightsaber and thus will be significantly hampered should she somehow be unable
        to retrieve it | None notable l| None notable. Notable Attacks/Techniques:
        * Bleeding: Bleeding is the process that a Dark Side Adept used the Force
        to bend a kyber crystal to their will. Any kyber crystal could be bled, including
        their own if they were a former light side practitioner and kept their lightsaber.
        This process was accomplished by the individual pouring rage, hate, and pain
        into the crystal via the Force until the crystal turned crimson, resulting
        in the bloodshine lightsabers associated almost exclusively with dark side
        adepts. Some Sith believed that the proper method was to take a kyber crystal
        or crystals from a Jedi''s lightsaber and bleed it. After defeating the Sixth
        Brother, Ashoka manage to "heal" the effects of bleeding on a kyber crystal,
        by using the light side of the Force, thus changing the crystal''s color again.
        This allowed her to create her white lightsabers. * Telekinesis: Ahsoka can
        use this through the Force to put her mind literally over matter, capable
        of blasting opponents, shielding herself or disarming people, its limits are
        only those of the creativity that Force User has. Ahsoka showcased impressive
        telekinetic prowess even as a Padawan. She has crushed numerous LR-57 combat
        droids by bringing a large wall down on them, collapsed a several storey tall
        ice-cliff with the aid of six younglings, has blasted back Asajj Ventress,
        and has even blasted back the infamous General Grievous despite being somewhat
        exhausted. * Telepathy: Can easily manipulate others mentally with the Force
        to trick, deceive, maim or even kill outright. Can also use this power externally
        or internally when it comes to illusion creation, manifestation, and manipulation.
        Ahsoka has exhibited command of the Jedi power "Mind Trick". * Force Vision:
        A Force ability which grants the user the ability to witness past or future
        events in the form of psychic visions. They can be random and uncontrollable.
        A Force Adept could have a vision while asleep, in a meditative trance, or
        even when touching an object of some significance. Although once common, the
        ability had grown rare during the waning years of the Galactic Republic. Through
        this ability, Ahsoka had glimpses of attempts on the life of Senator Padme
        Amidala by bounty hunter Aurra Sing days in advance and also had glimpses
        of Ziro the Hutt, the one who hired Sing to assassinate Amidala. * Force Jump:
        Although a power common to most trained Force Adepts, it should be noted that
        Ahsoka is especially skilled with it. This makes sense since she is a Form
        IV Ataru specialist which places emphasis on speed & agility (including leaping
        ability). She has proven herself capable of just about keeping up with the
        likes of Anakin Skywalker and Plo Koon with this ability (themselves masters
        of Force Jump). She has also used this ability against a distracted Darth
        Vader - leaping towards him at high velocity and badly damaging his helmet
        with a lightsaber strike. ==Notable Matchups== Victories: Thanos (Fortnite)
        Thanos'' Profile (Clone Wars Season 1-6 Ahsoka was used and speed was equalised)
        Losses: Obi-Wan Kenobi (Star Wars) Obi Wan''s profile (This was Kenobi in
        Revenge of the Sith and Ahsoka during the Siege of Mandalore, canon versions
        were used and speed was equalized) Inconclusive: {{Discussions}} Category:Characters
