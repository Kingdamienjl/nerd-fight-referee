  intelligence:
    text: Unknown (Even in her early days as a Padawan, Ahsoka was unusually talented
      at lightsaber combat. Preferring an unorthodox reverse-hand grip as per the
      ancient version of Form V, she managed to single-handedly defeat three MagnaGuards
      and later went on to duel with infamous assassin Asajj Ventress as well as the
      infamous Jedi Hunter, General Grievous. Her skills only grew during her time
      in the order, switching to the Jar'Kai two sword style and surviving a second
      clash with Grievous even after he began using four swords at once. She is also
      a talented wielder of the Force, being so advanced in the use of telekinesis
      and Force Speed that her master, Jedi Knight Anakin Skywalker, sometimes forgot
      how young she was. Seventeen years after leaving the Jedi Order, she has honed
      her skills to mastery, casually defeating two Inquisitors, dueling former Sith
      Lord Darth Maul on even ground, and putting up a respectable fight against Darth
      Vader. In addition, the executive director of Rebels went so far as to say that
      Ahsoka's overall might was only rivaled by Vader and Sidious, further emphasizing
      the degree of her power and skill)
    source_ids:
    - vsbattles-ahsoka-tano-star-wars
    confidence: 0.6
    notes: auto_repair source extraction
