        a second clash with Grievous even after he began using four swords at once.
        She is also a talented wielder of the Force, being so advanced in the use
        of telekinesis and Force Speed that her master, Jedi Knight Anakin Skywalker,
        sometimes forgot how young she was. Seventeen years after leaving the Jedi
        Order, she has honed her skills to mastery, casually defeating two Inquisitors,
        dueling former Sith Lord Darth Maul on even ground, and putting up a respectable
        fight against Darth Vader. In addition, the executive director of Rebels went
