- id: claim-powers-and-abilities-e972841b
  section: abilities
  axis: hax
  text: "{{Border|Scroll=No|Visible=YeS|Content= |-|Base= {{Border|Scroll=No|Visible=YeS|Content=\
    \ *Superhuman Physical Characteristics and Statistics Amplification (For Force-users,\
    \ it is relatively simple to use the Force to imbue their own bodies with energy\
    \ and strength, enabling them to make leaps otherwise considered impossible, move\
    \ at high speeds, overcome their own physical limitations, perform feats of dexterity\
    \ and acrobatics, shrug off the effects of fatigue, and master physical strength\
    \ far beyond the capabilities of most sentient beings are equally feasible[Rulebook]\
    \ Force and Destiny Core Rulebook) *Enhanced Senses, Extrasensory Perception and\
    \ Clairvoyance (With Sense Powers; Trained Force-sensitives possess heightened\
    \ vision, hearing, and smell, allowing them to perceive things that would otherwise\
    \ be impossible without artificial aids.[Book] Jedi vs. Sith: The Essential Guide\
    \ to the Force (real-life book) - Page 65 They can gather information about their\
    \ surroundings, detect hidden beings, see in complete darkness, and even through\
    \ barriers. Their instincts are finely tuned to sense when something is wrong,\
    \ and they are able to feel disturbances in the Force) *Instinctive Action (The\
    \ Force controls the user's actions, but also obeys his commands[Film] Star Wars:\
    \ Episode IV \u2013 A New Hope) *Precognition (Force sensitives can see things\
    \ before they happen[Film] Star Wars: Episode I The Phantom Menace) *Telepathy\
    \ (Trained Force sensitives can read emotions and see images of another person's\
    \ mind) *Weapon Mastery (with Lightsabers) *Telekinesis and Durability Negation\
    \ (It is able to push things with Force Push, grab and throw things with Force\
    \ Grip, and push everything around with Repulse.[Game] Star Wars: The Force Unleashed\
    \ 2 Force Grip can attack a target internally, grabbing an organ, collapsing the\
    \ trachea, moving the brain, squeezing the heart, etc[Rulebook] Star Wars Core\
    \ Rulebook Revised[Sourcebook] Tales of The Jedi Companion[Rulebook] Star Wars\
    \ Saga Edition Core Rulebook[Book] The Complete Star Wars Encyclopedia) **Forcefield\
    \ Creation (With Force Shield; Creates a bubble of telekinetic energy around the\
    \ force-sensitive, protecting them from harm[Book] Saga Edition The Force Unleashed\
    \ Campaign Guide - Page 86) **Deconstruction (Repulse is capable of disintegrating)\
    \ *Mind Manipulation, Status Effect Inducement, Empathic Manipulation, Memory\
    \ Manipulation, Perception Manipulation and Illusion Creation (Able to use Mind\
    \ Trick to confuse and enrage targets. Mind Trick can be control the will of others,\
    \ obliterate their memories and replace them with false ones, override their senses,\
    \ and generate illusions[Book] Jedi vs. Sith: The Essential Guide to the Force\
    \ (real-life book)) *Energy Manipulation, Attack Reflection and Absorption (He\
    \ is able to use Tutaminis to reflect, redirect, and absorb energy attacks launched\
    \ at him[Book] The Jedi Path: A Manual for Students of the Force (real-life book)\
    \ - Page 26) *Electricity Manipulation (It is capable of using Force Lightning\
    \ to electrify targets) *Damage Boost (It is capable of increasing the damage\
    \ of its powers when charging them[Game] Star Wars: The Force Unleashed) *Rage\
    \ Power (with Force Fury; which greatly increases his powers) *Perception Manipulation\
    \ and Paralysis Inducement (with Force Stun; can overload an enemy's senses and\
    \ freeze them in place[Book] Revenge of The Sith Prima Game Guide[Game] Star Wars:\
    \ Knights of the Old Republic) *Stealth Mastery, Light Manipulation, Sound Manipulation\
    \ and Resistance to Extrasensory Perception (with Force Stealth; which manipulates\
    \ light and sound waves to render the Force-sensitive invisible, as well as making\
