- id: claim-weaknesses-eee8bb7b
  section: weaknesses
  axis: weakness
  text: 'Possibly prone to insanity due to being potentially an unstable accelerated
    Force using clone of the original Starkiller | None notable Notable Attacks/Techniques:
    *Force Barrier: Both an offensive and defensive Force power that creates a barrier
    or wall of Force energy around the intended target, be it self, friend, or foe.
    Depending on the strength of the individual, the barrier could only withstand
    a few attacks before collapsing. *Force Lightning: An offensive Force technique
    that uses Force energy to produce electricity with one or two hands that stream
    outwards from the fingertips, its speed is usually great enough to catch an opponent
    off-guard even when prepared, and can be used either in bursts, or simply torrent
    out in an a gush of agony on its victim. His greatest display of this power came
    from his Clone who was capable of super charging the Fusion Accelerator Cannon
    enough to destroy an Imperial Star Destroyer. *Force Stealth: A power that was
    used by highly skilled Force-sensitives to mask their Force alignment (Light or
    Dark), their ability to use the Force, or even their entire presence from other
    Force-sensitives. *Telekinesis: Galen Marek can use this through the Force to
    put his mind literally over matter, capable of blasting opponents, shielding himself
    or disarming people, its limits are only those of the creativity that Force User
    has. He most famously used this power to alter the trajectory of a falling Imperial
    Star Destroyer. *Telepathy: Can easily manipulate others mentally with the Force
    to trick, deceive, maim or even kill outright. Can also use this power externally
    or internally when it comes to illusion creation, manifestation and manipulation.
    *Tutaminis: Through the Force, Galen Marek can draw potentially harmful energy
    into his body and diffuse it or channel it away completely. His skill with this
    power was great enough to contain several seconds worth of a non-serious Darth
    Sidious'' Force Lightning. Notes: *Lord Starkiller is non-canonical to the Legends
    timeline and is a result of a "What if?" scenario in which Galen Marek fell to
    the Dark side and accepted the offer of Darth Sidious to replace Darth Vader as
    his new apprentice ==Notable Matchups== Victories: Losses: Inconclusive: ==Notes/Explanations==
