      \ implies that Aragorn is the greatest mortal of the War of the Ring by stating\
      \ that among mortals, \"not even Aragorn\" could withhold the One Ring from\
      \ SauronLetters of Tolkien: Letter 246), possibly Small City level to Mountain\
      \ level, likely far higher (Aragorn possesses a greater share of the N\xFAmen\xF3\
      rean blessings than any named character for the past 2,000 years.The Nature\
      \ of Middle-Earth, Part One: Time and Ageing, XVIII ELVISH AGES & N\xDAMEN\xD3\
      REANThe Nature of Middle-Earth, Part Two: Body, Mind, and Spirit, X NOTES ON\
      \ \xD3R\xCB This should put him above lesser N\xFAmen\xF3reans/D\xFAnedain such\
      \ as Boromir the Steward, who is stated to have inspired fear in the Witch-King\
      \ and is implied to have survived a direct duel with the Nazg\xFBl. The Unfinished\
      \ Tales note that, had Aragorn been present during the attack of the Nine upon\
      \ Sarn Ford, the D\xFAnedain might have been able to fend them off, implying\
      \ his comparability to them. Further manuscripts of the \"Hunt for the Ring\"\
      \ state the Witch-King feared Aragorn as a \"great power\"Unfinished Tales,\
      \ Part Three: The Third Age, IV: THE HUNT FOR THE RING (i) Of the Journey of\
      \ the Black RidersThe Lord of the Rings : A Reader's Companion: Hunt for the\
      \ Ring). At least Large Mountain level, possibly High Universe level with And\xFA\
      ril (And\xFAril is the reforged sword of Elendil, Narsil, which was used during\
      \ the Last Alliance during a duel against Sauron, while the broken weapon would\
      \ later be used to cut off the finger of the Dark Lord. Even after its reforging,\
      \ the narration notes that the blade is just 'as deadly as of old', with Sauron\
      \ still fearing the blade even after thousands of years have passedThe Lord\
      \ of the Rings: The Return of the King, Book Five, II The Passing of the Grey\
      \ CompanyThe Lord of the Rings: The Return of the King, Book Five, VI The Battle\
      \ of the Pelennor Fields)"
