  attack_potency:
    text: "At least Wall level+, possibly Small Building level (Superior to virtually\
      \ every mortal warrior0.00487 tons of TNT, possibly 0.00974 tons of TNT that\
      \ participated in the War of the Rings, being unharmed in all major battles,\
