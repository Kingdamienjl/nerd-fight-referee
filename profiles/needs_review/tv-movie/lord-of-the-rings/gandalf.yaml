  intelligence:
    text: "Extraordinary Genius (As one of \"The Wise\" and a member of the White\
      \ Council, Gandalf is capable of accurately predicting the future with great\
      \ accuracy through his experience, knowledge, and wisdom alone.The Peoples of\
      \ Middle-earth, \"VIII. The Tale of Years of the Third Age\"The Nature of Middle-Earth:\
      \ Footnotes, Part Two, IX \xD3sanwe-kenta These deductions are more accurate\
      \ the closer the predicted future is, and as Gandalf possesses more wisdom than\
      \ Radagast, who is also one of \"The Wise\", he should be more accurate than\
      \ some of his peers. Gandalf possesses thousands of years of knowledge and experience\
      \ about many things in Arda and once knew every spell invented in tongues of\
      \ the Orcs, Dwarves and Elves. He has great insight into the peoples, creatures,\
      \ fauna and events of Middle-Earth. A very skilled combatant and leader, being\
      \ a key instrument in his two thousand year struggle against Sauron, with his\
      \ skills as a strategist and tactician being evident from his exploits in the\
      \ War of the Ring) | Extraordinary Genius (Ol\xF3rin was said to have been the\
      \ wisest of the Maiar.Silmarillion: VALAQUENTA He should thus be wiser than\
      \ the likes of Melian or E\xF6nw\xEB. Moreover, he should be at least as intelligence,\
      \ if not more intelligent than his form as Gandalf, for it is said that the\
      \ knowledge of the Istari was largely relearned from their time as uninhibited\
      \ Maiar and not new knowledge) | Possibly Nigh-Omniscient (The Ainur acted as\
      \ the origin to all that which existed within E\xE4, having sung all the concepts\
      \ which constitute the world during the Anulindal\xEB. However, Eru himself\
      \ withheld some knowledge about his creation from the Ainur)"
    source_ids:
    - vsbattles-gandalf-lord-of-the-rings
    confidence: 0.6
