    - field: weaknesses
      value: 'Following the creation of the One Ring, its destruction will reduce
        Sauron to permanent impotency. Otherwise, Prior to the War of the Last Alliance,
        Sauron is not weakened if he does not wear the One Ring, following the War,
        he needs the Ring to regain his power, he will be reduced to complete powerlessness,
        If the One Ring is destroyed, then he will be reduced to complete powerlessness,
        None notable (BONUS) Fatal Flaw: Like his master before him, Sauron has a
        high sense of delusion, and he is highly ignorant of the nature of beauty
        and good, due to his pure evil nature. Furthermore, Sauron had long since
        lost all sense of right and wrong, and did not value concepts or judge ideas
        by good or evil, only by power. He believed every single creature that existed,
        from the lowest lifeforms to the highest beings, were all power hungry and
        greedy, therefore it never occurred to him that his enemies would seek to
        actually destroy the One Ring. This is ultimately what led to his downfall'
