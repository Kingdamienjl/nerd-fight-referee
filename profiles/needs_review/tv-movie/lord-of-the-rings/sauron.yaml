  intelligence:
    text: "Extraordinary Genius (An extremely skilled craftsman and blacksmith, as\
      \ well as a master manipulator and trickster. Sauron was acknowledged for his\
      \ wisdom by Gandalf, while narration would compare the greatest of Saruman's\
      \ works in Isengard nothing more than a \"child's model\" and a \"slave's flattery\"\
      .The Lord of the Rings: The Fellowship of the Ring, Book Two, II The Council\
      \ of ElrondThe Lord of the Rings: The Two Towers, Book Three, VIII The Road\
      \ to IsengardNotes on motives in the Silmarillion. (i) Sauron was also said\
      \ to possess a mind that was similar to Saruman in thought, enabling him to\
      \ comprehend the White Wizard, understand him, and accurately predict his moves\
      \ and motivations. As such, Sauron should be comparable to \"The Wise\" in intelligence,\
      \ being capable of accurate foresight of the future by sheer deduction alone.The\
      \ Nature of Middle-Earth: Footnotes, Part Two, IX \xD3sanwe-kenta Sauron successfully\
      \ tricked the Eregion Elves into forging the rings of power, tricked N\xFAmenor\
      \ into attacking Valinor, spread the worship of Melkor and made entire nations\
      \ worship him as a God) | Possibly Nigh-Omniscient (The Ainur acted as the origin\
      \ to all that which existed within E\xE4, having sung all the concepts which\
      \ constitute the world during the Anulindal\xEB. However, Eru himself withheld\
      \ some knowledge about his creation from the Ainur)"
    source_ids:
