    \ of Tolkien: Letter 211) |-|Prior to entering E\xE4= All previous abilities on\
    \ an unfathomably higher extent including: *Powers and Resistances of the Ainur\
    \ (Abilities and Resistances of the Greater Maiar from \"Prior to entering E\xE4\
    \") Resistance to: *Mind Manipulation *Soul Manipulation due to verse-wide resistances."
