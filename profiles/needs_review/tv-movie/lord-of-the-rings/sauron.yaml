  attack_potency:
    text: "High Universe level (Described as Morgoth's greatest named servant in regards\
      \ to might, making him superior to both Gothmog and Ancalagon the Black.Silmarillion:\
      \ VALAQUENTA As chief among Morgoth's Maiar, he is almost certainly one of the\
      \ Greater Maiar, something supported by descriptions of Sauron as a \"greater\
      \ spirit\" across notes, and due to his feats of combatting Huan. Huan slew\
      \ a Silmaril empowered Carcharoth, and Sauron combatted him while in a weakened\
      \ state due to Luthien's abilities.Morgoth's Ring: PART FIVE. Text VIIISilmarillion:\
      \ Chapter 19 OF BEREN AND LUTHIEN This is especially notable as Silmarils were\
      \ created with the light of the Two Trees, the greatest creation of Yavanna,\
      \ and have been depicted harming the likes of a diminished MorgothSilmarillion:\
      \ Chapter 9 OF THE FLIGHT OF THE NOLDOR), can ignore conventional durability\
      \ with Soul Manipulation (Ainur can directly influence the f\xEBar/soul to attack\
      \ it directlyThe Nature of Middle-Earth, Part Two: Body, Mind and Spirit, XIII\
      \ SpiritSilmarillion: AINULINDAL\xCBMorgoth's Ring: Notes on motives in the\
      \ Silmarillion (iii)) | High Universe level, higher with the One Ring (Was said\
      \ to have grown stronger by the Second Age, to the point were he became \"greater\"\
      \ than Morgoth was at the end of the First Age.Morgoth's Ring: PART FIVE. Text\
      \ VII With the creation of the One Ring, it is said that his powers were enhanced\
      \ even furtherLetters of Tolkien: Letter 131), can ignore conventional durability\
      \ with Soul Manipulation | At least Large Mountain level, possibly High Universe\
      \ level (The Downfall of Numenor was said to have drained a lot his power, to\
      \ the extent that he had not yet fully recovered by the time of the Last Alliance.Letters\
      \ of Tolkien: Letter 211 However, he should still be above the likes of Ancalagon\
      \ the Black, as it was said that the powers of the One Ring were untouchable\
      \ by the latter's flames.The Lord of the Rings: The Fellowship of the Ring,\
      \ Book One, II The Shadow of the Past Moreover, as he still possessed the One\
      \ Ring, which contained much of his \"strength and will\", it is possible that\
      \ he is still comparable to his earlier keysSilmarillion: OF THE RINGS OF POWER\
      \ AND THE THIRD AGE), can ignore conventional durability with Soul Manipulation\
      \ | At least Mountain level, likely far higher (Despite being severely weakened,\
      \ Sauron was still capable of casually performing this feat as a mere message.The\
      \ Lord of the Rings: The Two Towers, Book Four, VIII The Stairs of Cirith Ungol\
      \ Was far above the likes of Gandalf the White, with the latter admitting that\
      \ \"black is mightier still\"The Lord of the Rings: The Two Towers, Book Three,\
      \ V The White Rider), can ignore conventional durability with Soul Manipulation\
      \ | Outerverse level (The Ainur in their origin are residents of the \"primary\
      \ creation\", with the difference between a primary and a secondary world being\
      \ described as the difference between reality and \"myth and fairy-story\".\
      \ In this state, they resided in a world of purely will and awareness outside\
      \ the space-time of E\xE4 once it was created, with the Ainur being described\
      \ as beyond the bounds and limits of time and space)Letters of Tolkien: Letter\
      \ 181The Nature of Middle-Earth, Part Three: The World, it's Lands, and its\
      \ Inhabitants, III Powers of the Valar, possibly High Outerverse level+ (Sub-creators\
      \ of the primary world, the creators of stories and myth within the primary\
      \ reality, are described as possessing \"no bounds, but the laws of contradiction\"\
      \ in their capacity as \"writers\". As the \"highest created beings\" created\
      \ by Eru, the Ainur are potentially similar existences to these sub-creators,\
      \ with the Ainur possessing \"special 'sub-creative' powers\" as Eru grants\
      \ them certainty that their creations are given reality, unlike the writers\
      \ who do not possess this certainty)Letters of Tolkien: Letter 153"
    source_ids:
    - mediawiki-7814
    confidence: 0.6
    notes: auto_repair source extraction
