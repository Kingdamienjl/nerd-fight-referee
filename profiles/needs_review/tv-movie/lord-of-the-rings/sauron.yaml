    \ fainted at the \"horror of his approach despite her being resilient to the fear\
    \ that Morgoth's eyes can evoke.\"The Silmarillion, Chapter 19: OF BEREN AND L\xDA\
    THIEN It is even described that Sauron eventually achieved Morgoth's feat of being\
    \ able to either drive the f\xEBa/soul out of the body or reduce it to impotence\
    \ with terror alone) *Poison Manipulation with The Black Breath (Superior to the\
    \ Nazg\xFBl, having granted them their powers) *Weapon Mastery *Metal Manipulation\
    \ (Magically superior to the Witch-King) *Fire Manipulation *Electricity Manipulation\
    \ *Necromancy *Status Effect Inducement *Intangibility and Invisibility (As a\
    \ Maia, his \"true nature\" exists in the Unseen World, even while confined to\
    \ E\xE4; Sauron also possesses Incorporeality at least in spirit form) *Flight\
    \ *Analytical Prediction (More intelligent than Saruman, who can accurately predict\
    \ the future through logical deduction) *Transmutation *Genius Intelligence *Mind\
    \ Manipulation (Has control over the One Ring and its vast military) *Acausality\
    \ (Type 2; Changes to past/future cannot alter the \u201CMusic in being\u201D\
    ; applies verse-wide)Morgoth's Ring: PART FIVE. III *Possession (It is said that\
    \ Sauron could possess bodies of those who willingly let him in and taught others\
    \ the sameMorgoth's Ring: OF RE-BIRTH AND OTHER DOOMS OF THOSE THAT GO TO MANDOS.(33))\
    \ Resistance to: *Mind Manipulation (The barrier of Unwill prevents even Sauron\
    \ without consentThe Nature of Middle-Earth, Part Two: Body, Mind, and Spirit,\
