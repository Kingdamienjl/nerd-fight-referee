        \ than Radagast, who is also one of \"The Wise\", he should be more accurate\
        \ than some of his peers.Unfinished Tales: Part Four, II The Istari Has thousands\
        \ of years of knowledge and experience about many things in Arda. As the creator\
        \ of a new race of Uruk, inventor of a form of \"blasting fire\", and more,\
        \ his technical knowledge was immense. As a Maia of Aul\xEB, he was an incredibly\
        \ skilled craftsman, and whilst inferior to Sauron, he was said to have been\
        \ the most knowledgeable in the Dark Lord's work from among the Istari, even\
        \ creating a Ring of his own) | Extraordinary Genius (Curumo should be at\
        \ least as intelligence, if not more intelligent than his form as Saruman,\
        \ as it is detailed that the knowledge of the Istari was largely relearned\
        \ from their time as uninhibited Maiar and not new knowledge) | Possibly Nigh-Omniscient\
        \ (The Ainur acted as the origin to all that which existed within E\xE4, having\
        \ sung all the concepts which constitute the world during the Anulindal\xEB\
        . However, Eru himself withheld some knowledge about his creation from the\
        \ Ainur)"
