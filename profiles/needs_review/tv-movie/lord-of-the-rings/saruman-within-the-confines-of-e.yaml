    - field: intelligence
      value: "Extraordinary Genius (As one of \"The Wise\" and the Leader of the White\
        \ Council, Saruman is capable of accurately predicting the future with great\
        \ accuracy through his experience, knowledge, and wisdom.The Peoples of Middle-earth,\
        \ \"VIII. The Tale of Years of the Third Age\"The Nature of Middle-Earth:\
        \ Footnotes, Part Two, IX \xD3sanwe-kenta These deductions are more accurate\
