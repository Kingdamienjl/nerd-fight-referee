  attack_potency:
    text: "Unknown | At least Small City level, possibly Mountain level, likely far\
      \ higher (As the head of his order, Saruman is described as the most powerful\
      \ of the Five Istari, placing him above the likes of Gandalf the Grey or Radagast\
      \ the Brown.THE PEOPLES OF MIDDLE-EARTH, PART TWO. XIII LAST WRITINGS. THE FIVE\
      \ WIZARDS.The Lord of the Rings: The Fellowship of the Ring, Book One, II The\
      \ Shadow of the Past As he is also the head of the White Council, he may also\
      \ scale above the likes of Galadriel, with Gandalf the Grey emphasising that\
      \ it was by \"the devices of Saruman\" that they were able to drive Sauron from\
      \ Dol Guldur.The Lord of the Rings: The Fellowship of the Ring, Book Two, II\
      \ The Council of Elrond However, the language used here also imply his value\
      \ came from his indirect influence, rather than his might) | At least Mountain\
      \ level (He should be comparable to his peer Ol\xF3rin, who should be far superior\
      \ to his state as Gandalf the White)Unfinished Tales: Part Four, II The Istari,\
      \ at most High Universe level (It is said that the Maiar who constituted the\
      \ order of the Istari were mighty for even members of the \"angelic people\"\
      , being peers of Sauron in the past.Unfinished Tales, Part Four: II: THE ISTARI\
      \ However, it is unknown how much weaker Sauron was during this time, meaning\
      \ it is uncertain whether he would classify as a Greater Maiar while he was\
      \ their peer or not), can ignore conventional durability with Soul Manipulation\
      \ (Ainur can directly influence the f\xEBar/soul to attack it directly)The Nature\
      \ of Middle-Earth, Part Two: Body, Mind and Spirit, XIII SpiritSilmarillion:\
      \ AINULINDAL\xCBMorgoth's Ring: Notes on motives in the Silmarillion (iii) |\
      \ Outerverse level (The Ainur in their origin are residents of the \"primary\
      \ creation\", with the difference between a primary and a secondary world being\
      \ described as the difference between reality and \"myth and fairy-story\".\
      \ In this state, they resided in a world of purely will and awareness outside\
      \ the space-time of E\xE4 once it was created, with the Ainur being described\
      \ as beyond the bounds and limits of time and space)Letters of Tolkien: Letter\
      \ 131Letters of Tolkien: Letter 181The Nature of Middle-Earth, Part Three: The\
      \ World, it's Lands, and its Inhabitants, III Powers of the Valar, possibly\
      \ High Outerverse level+ (Sub-creators of the primary world, the creators of\
      \ stories and myth within the primary reality, are described as possessing \"\
      no bounds, but the laws of contradiction\" in their capacity as \"writers\"\
      . As the \"highest created beings\" created by Eru, the Ainur are potentially\
      \ similar existences to these sub-creators, with the Ainur possessing \"special\
      \ 'sub-creative' powers\" as Eru grants them certainty that their creations\
      \ are given reality, unlike the writers who do not possess this certainty)Letters\
      \ of Tolkien: Letter 153"
