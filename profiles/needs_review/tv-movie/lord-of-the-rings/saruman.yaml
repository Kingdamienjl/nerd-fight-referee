    - field: weaknesses
      value: "Saruman is rather arrogant and became powerless once completely removed\
        \ from his position. Notable Attacks/Techniques: As a Maia, Saruman has many\
        \ potent elemental abilities. He is also a powerful sorcerer. Magic: \u200B\
        Being a powerful sorcerer, Saruman has access to many spells and the Words\
        \ of Command, powerful spells that are much more dangerous than normal magic.\
        \ His magical power is comparable, and possibly superior to Gandalf the Grey\
        \ (Though inferior to the White), who, at his peak, knew every spell invented\
        \ by Orcs, Dwarves and Elves, with the exclusion of men being presumably do\
        \ to their inability to use magic. *Words of Command: The Words of Command\
        \ are powerful spells, much more dangerous than normal ones. The first recorded\
        \ use of a Word of Command was when Gandalf used it to close a door, with\
        \ the Balrog using his own magical knowledge to try and open, leading to its\
        \ destruction. Words of Command may be connected to the Anulindale, where\
        \ the entire world was shaped by words strung together in song, with the Words\
        \ of Command possibly being extensions or continuations of the music. If so,\
        \ this may be the only way to change the original music accept for by the\
        \ actions of man, making it one of the most potent forms of magic in Lord\
        \ of the Rings. The spells Gandalf referred to may be Words of Command, with\
        \ men not needing any do to being able to work outside the music without needing\
        \ Words of Command, which might work as a sort of cheat code. *Spellcraft:\
        \ Spellcraft is not an official term, yet rather the best term to capture\
        \ the art of creating spells via potions and metals. Examples of spellcraft\
        \ include the Plantiri, magical stones crafted in Valinor; Durin's door, an\
        \ ithildin door crafted by Celebrimbor; the Rings of Power, magic rings that\
        \ grant invisibility to those who use them, which where crafted by the Elves\
        \ of Eregion; and the Silmirals, magic jewels crafted by F\xEBanor. As shown\
        \ above, spell craft usually revolves around using and/or creating magical\
        \ substances runes and other, more obscure forms of magic. Being a servant\
        \ of Aul\xEB, Saruman was likely very skilled in this art; specfically in\
        \ the use of runes. Powers of the Ainur: As a Maia, Saruman has access to\
        \ wide variety of potent and devastating supernatural abilities, for the Ainur\
        \ were created as elemental spirits, and each have divine authority and absolute\
        \ control over a certain aspect of nature. Each and everyone of the Ainur\
        \ is also able to manipulate magical energies and reality to serve their needs,\
        \ and take any form they wish, even intangible and non-corporeal spiritual\
        \ forms. *Elemental Manipulation: As one of the Ainur, it was highly likely\
        \ that Saruman had authority and control over one aspect of nature, though\
        \ that aspect was neither confirmed nor specified. However, given his mind\
        \ of metal and gears, power over machines and stone is not far fetched for\
        \ him. *Foresight/Hindsight: The Ainur can see the past and the future (Though\
        \ the latter is fallible). As a memeber of the White Council, knowledge of\
        \ the future would be very useful to Saruman, or knowledge of the past for\
        \ that matter. *Empathy: The Ainur are surrounded by an a powerful aura, which\
        \ can affect those around them, bringing joy and presumably sorrow to those\
        \ near him: \"In Beleriand King Thingol upon his throne was as the lords of\
        \ the Maiar, whose power is at rest, whose joy is as an air that they breathe\
        \ in all their days, whose thought flows in a tide untroubled from the heights\
        \ to the deeps.\" *Shapeshifting: As one of the Ainur, it was highly likely\
        \ that Saruman possessed the famous Ainur ability to transform and reshape\
        \ the form of one's body, appearing in whatever form he desired. They can\
        \ also appear as inanimate objects, such as when Yavanna appeared as a tree.\
        \ *Spirit"
      source_id: mediawiki-8324
      provider_id: vsbattles
      authority: high
      confidence: 0.75
