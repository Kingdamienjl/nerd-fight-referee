  intelligence:
    text: Average (Jason is capable of effectively tracking and killing his victims,
      using any number of weapons and tools as deadly weapons, and setting up basic
      traps. While mentally handicapped and emotionally stunted, Jason did well in
      school when he was young. His intelligence was further enhanced after he was
      empowered and resurrected by Freddy in Freddy vs. Jason vs. Ash. As a human,
      Jason had outmaneuvered the police and lived off the land for years, remaining
      an urban legend. After years of bloodshed, Jason has grown into an apex predator
      in terms of combat and stealth, demonstrated by him massacring platoons of mercenaries
      and soldiers, beating Ash twice, and even methodically killing a group of extremely
      well-trained peak human space marines one by one aboard their own ship. His
      ability to improvise is exemplified by battles where he's used a helicopter
      rotor as a massive machete, summoned or used firearms against enemies, downed
      helicopters on two separate occasions by throwing objects at them, escaped restraints
      and swapped places with a dead soldier to ambush his comrades, and his general
      pinpoint accuracy with just about anything he can throw, such as when he threw
      a machete through a victim's heart from several feet away while on fire, headshot
      a pilot aboard a helicopter from hundreds of feet away with a severed head,
      throwing his machete at a branch that had caught rotors in order to kill a woman
      standing in water below it, Bodies possessed by the mask are shown to be intelligent
      enough to use firearms and more complex tactics. In The Experiment, Jason is
      shown driving a van. After Jason curbstomped several of his men, security chief
      Estep believed he was against professional soldiers) | Same as before (However,
      as an addition his nanomachines can give Jason new skills to help him if needed)
    source_ids:
    - mediawiki-6051
    confidence: 0.6
    notes: auto_repair source extraction
