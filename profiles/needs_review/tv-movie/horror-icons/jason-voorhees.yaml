- id: claim-powers-and-abilities-fa833ada
  section: abilities
  axis: hax
  text: "Human \u25BE= {{#tag:tabber| {{!}}-{{!}}Part II= *Peak Human Physical Characteristics\
    \ *Stealth Mastery *Weapon Mastery (Shown to be skilled in a large variety of\
    \ weaponry; from spears to corkscrews) *Resurrection and Accelerated Development\
    \ (Jason can bring himself back to life from fatal injuries and events such as\
    \ drowning.Friday the 13th Part II: Novelization When he comes back Jason's strength\
    \ is also increasedFriday the 13th Part VI: Novelization Jason grows stronger,\
    \ more skilled, and more knowledgeable with each kill or the more damage he takes)\
    \ *Regeneration (Mid-Low, likely High-Low; Has never suffered a broken bone and\
    \ regenerated damage from maggots eating his body while he was underwater for\
    \ an unknown period of time) *Pain Inhibition (Noted as never crying or yelling\
    \ as a child. Even when his collar bone was sliced through he uttered no sound)\
    \ {{!}}-{{!}}Parts III & IV= All previous abilities to a greater degree *Superhuman\
    \ Physical Characteristics *Weapon Mastery (Shown to be skilled with ranged weapons\
    \ like harpoon gunsFriday the 13th Part III) *Regeneration (Mid-Low, likely High-Low;\
    \ Healed after being slashed through the shoulderFriday the 13th Part II and having\
    \ an axe imbedded in his face. As with his strength, its likely Jason's regeneration\
    \ increases in potency with each resurrection) * Possibly Resurrection (The script\
    \ and film for Part IVFriday the 13th Part IV implied Jason was coming back from\
    \ his head injury before Tommy further injured him) }} |-|The Curse of Jason Voorhees=\
    \ *Immortality (Type 2 and 6; Can survive fatal wounds and still get up and can\
    \ jump from body to body if needed, though Jason requires physical contact for\
    \ both forms of possession) *Power Bestowal (People possessed by Jason's spirit\
    \ grow both in size and strengthFriday the 13th: Road Trip) in addition to gaining:\
    \ **Superhuman Physical Characteristics (Increases the person's strength to the\
    \ point where they can shatter bones and withstand normally lethal wounds) **Weapon\
    \ Mastery (As with Jason normally his possessed bodies are lethally skilled in\
    \ a variety of weapons) *Mind Manipulation (His heart hypnotizes others into eating\
    \ it, transferring his soul into them.Friday the 13th Part IX His mask is capable\
    \ of mentally compelling others to put it on) *Possession (Can possess those who\
    \ eat his heart and transfer his spirit into others in these hosts. While in the\
    \ body it begins to rot and once he leaves a host's body, it quickly dissolves.\
    \ Those wearing his mask are possessed by the spirit of Jason, though unlike eating\
    \ his heart they are capable of resisting him to a degree.Friday the 13th: Jason's\
    \ Curse Capable of possessing inanimate objects like statues, mechanical bats\
    \ and carousel poniesFriday the 13th: The Carnival) **Technology Manipulation\
    \ (Capable of controlling and possessing various pieces of statues, cars, electronics\
    \ and items) *Illusion Creation (Could create an undead illusion of a woman's\
    \ brother) * Limited Corruption (Type 1; People infected by Jason's spirit have\
    \ their bodies rot and break down) **Possibly Weather Manipulation (Rain instantly\
    \ appeared to douse Tommy Jarvis's light when he attempted to set Jason on fire.\
    \ Jason's death triggered a brief burst of lightning. When Jason was struck with\
    \ the Kandarian Dagger, a violent thunderstorm instantly appeared. Jason's resurrection\
    \ in Freddy vs Jason seemed to trigger a thunderstorm in Hell) |-|Undead= All\
    \ previous abilities to a greater degree *Self-Sustenance (Types 1, 2, and 3)\
    \ *Weapon Mastery (Shown to be incredibly accurate with polearms,Jason X his machete,Freddy\
    \ vs Jason dartsFriday the 13th Part VI and arrows) *Immortality (Types 2, 3,\
    \ 4, 6, and 7; Can survive lethal injuries such as being set on fire, impaled,Friday\
    \ the 13th Part VII and shot all over his body, is capable of regeneration, is\
    \ ultimately an undead being, can possess others, has come back from dying) *Regeneration\
    \ (Low-Mid; can regenerate from seemingly lethal wounds such as having his heart\
    \ destroyedFreddy vs Jason vs Ash, having most of his torso blown up by a grenade,\
    \ and even being dissolved in toxic waste;Friday the 13th: Special however, he\
    \ does not always regenerate and typically does not need to) *Resurrection (Able\
    \ to resurrect himself as long as his curse isn't fulfilled, including being fully\
    \ decapitated.Freddy vs Jason vs Ash: Nightmare Warriors Jason has escaped hell\
    \ on multiple occasions, both physically and spiritually ) * Likely Teleportation.Friday\
    \ the 13th Part VIII (Jason can manifest wherever violence and sex are) Resistances\
    \ to: *Extreme temperatures *Electricity Manipulation (Endured being shocked with\
    \ 500,000 volts for several minutes) *Holy Manipulation (Even after being stabbed\
    \ with the Kandarian Dagger and being assaulted with holy light, it still took\
    \ several demons to drag Jason to hell) *Pain (Does not react to being set on\
    \ fire, impaled, having a shovel break over his head, or any other wounds) |-|Deadite\
    \ Jason (FvJvA - Jason X) = All previous abil"
