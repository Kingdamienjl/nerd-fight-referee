    - field: intelligence
      value: 'At least Genius *While possessing an opthalmologist in Blind Date, Freddy
        was able to accurately diagnose the cause of Alicia Norris''s blindness and
        perform surgery on her in extremely sub-optimal conditions, one he states
        would ordinarily require multiple doctors *In Suffer the Children, Freddy
        showed scientists how to create a miracle drug that could bestow superpowers.
        *In Virtual Terror, it''s implied Freddy similarly manipulated a company into
        creating a portal between the Dreamscape and the Real World *Freddy possesses
        much knowledge in the supernatural, such as knowledge on the Astral Plane,
        the strange time dilation that exists within the Dreamscape and the Many-Worlds-like
        structure it follows, Hell, the Necronomicon, and many other sorts of magical
        rituals/lore. *Freddy states that he reads extensively in-between his killing
        sprees and writes books about his victims. He notably uses this knowledge
        to tailor victims'' deaths in Twice Burned to their idols. *While most likely
        nerfed mentally, he should still possess some portion of what he knows in
        the Dream World, effectively giving him lifetimes worth of information to
        draw on. *Freddy proved to be a very inventive fighter and quick on his feet
        against Jason, battering him with wrestling moves, using gas canisters like
        missiles to knock him away, raining rebar down to impale him, and attempting
        to smash a huge piece of construction equipment into him. Even while getting
        cut to shreds, Freddy turned the tables on Jason by slicing his fingers off
        when he went for the finishing blow, then hacking away at Jason with his own
        machete before he could regain his bearings. *While impersonating a doctor,
        Freddy psychoanalyzed Alex; first theorizing that she did so as a way of symbolically
        releasing her internal pain and getting attention to be nurtured; then, in
        accordance with another theory he read in a medical journal, diagnosed that
        she did so out of sexual frustration for her status as a virgin. *Diagnosed
        another teenager with ADHD after identifying symptoms exhibited by him. *While
        stalking a student interested in the matter, Freddy posed as Jack the Ripper
        and recreated the situation for her (with her as a streetwalker.) *In Fatal
        Games, while possessing Johnny, Freddy memorized Springwood''s underground
        tunnel system to navigate unseen *It''s implied that the Tales of Terrors
        books are written by him as part of his personal library, thus his memory
        is perfect as he''s able to write down everything that happened in a given
        killing spree, every word of dialogue, every victim''s thoughts and feelings,
        etc, even while operating in the Real World. *In Virtual Terror, Freddy terrorizes
        a young man named Keith. Keith''s friend group consists of: Mario, his best
        friend, a boy whose previously been linked to gang activity, and who''s also
        stolen Keith''s previous girlfriend Carrie; Pam, who Mario has also recently
        seduced; Mel, an eccentric young man who he befriends but isn''t part of the
        group; and Carrie. Freddy gives Keith a premonition through the poster and
        further haunts him with a dream that shows Mario betraying him and being evil
        to plant distrust between the two. Skrag is a local delinquent who has been
        threatening Mario that he''ll expose his trysts with Pam, and, after a fight
        between the two at the dinner, he is killed by Freddy (possessing Keith),
        implicating Mario as the prime suspect. Skrag''s girlfriend Sandra later calls
        Keith to arrange a meeting to discuss Mario, convinced that he''s the killer.
        Mel calls shortly afterwards to tell him some critical information about the
        poster that gave Keith a premonition, and Keith informs him that he''ll be
        visiting Sandra before meeting up with him. Freddy possesses Keith to kill
        Sandra and plants a false memory in his head of getting ghosted by Sandra,
        letting him go to meet Mel none the wiser. Freddy would possess Keith to kill
        Mel that same day and steal his bear traps, planting them in a slope at the
        park, anticipating that Pam would go there to clear her head later as part
        of his plan. When Sandra''s body is discovered, Pam reveals her affair with
        Mario to give him an alibi, and the group is split apart. With Freddy having
        planted the idea in Keith that Mel is the killer since he''s the only one
        who knew about the meeting with Sandra, Keith comes to his senses to unite
        the group to go after Mel, and he rants on the phone that he has a magical
        poster and that Pam was in danger. With Pam''s location acquired from his
        friends, Freddy possesses Keith to stalk Pam in the park and push her down
        the slope full of traps he''d set after killing Mel. Keith, back in his body,
        is assaulted by Mario, who''d arrived at the park shortly afterwards, as Freddy
        had predicted. Keith convinces Mario that Mel is the killer via the bear traps
        at the scene, and the two go after him. As predicted, Mario insists on dealing
        with Mel alone, leaving Keith in the car to be possessed by Freddy, who promptly
        runs him down with the car after M'
