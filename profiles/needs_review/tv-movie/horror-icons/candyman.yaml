- id: claim-weaknesses-6277ad0c
  section: weaknesses
  axis: weakness
  text: 'Has a God complex and displays narcissism. Vulnerable to fire, which was
    used to defeat him in the first film. Will cease to exist if his legend is forgotten
    or if the paintings and mirror containing his soul are destroyed. Destroying the
    mirror in the second film vanquished him for a while, and his paintings were destroyed
    in the third film, defeating him permanently. ==Notable Matchups== Victories:
    Losses: Inconclusive: {{Discussions}} Category:Characters Category:Candyman Category:Antagonists
