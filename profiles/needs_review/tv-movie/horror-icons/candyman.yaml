- id: claim-powers-and-abilities-dfd15bf6
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Immortality (Types 1, 4, 7, and 8, is
    a ghost, came back after seemingly being vanquished at the end of the first film,
    his soul is bound to two sets of objects; a set of paintings and a mirror, and
    he will continue to resurrect overtime until they are both destroyed), Self-Sustenance
    (Types 1 and 2), Regeneration (Mid-Low, rapidly healed from being stabbed in the
    throat and having his cheek clawed open), Insect Manipulation (Controls a massive
    horde of bees that live within his body), Teleportation, Telekinesis, Flight,
    Invisibility and Resistance to Extrasensory Perception (Can turn invisible and
    is passively imperceptible to cameras and other recording or tracking devices),
    Intangibility (Can phase through walls as a ghost and is unable to be harmed by
    most conventional weapons due to his lack of organs and his body being filled
    with bees), Telepathy (Mentally assaulted a woman and made her see images in her
    mind), Illusion Creation (Here), Electricity/Chain Manipulation (Tortured someone
    by electrifying a chain they were bound to), Minor Light Manipulation (Forced
    a light to go out), Dream Manipulation (Can enter and manipulate dreams, Was said
    to have caused a child to suffer nightmares, which the child later confirmed)
  source_ids: *id004
  decisive: true
  status: unverified
