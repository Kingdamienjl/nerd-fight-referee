    Category:Immortals Category:Intangibility Users Category:Invisibility Users Category:Light
    Users Category:Male Characters Category:Murderers Category:Primary Antagonists
    Category:Regeneration Users Category:Sadists Category:Self-Sustenance Users Category:Serial
    Killers Category:Telekinesis Users Category:Telepaths Category:Teleportation Users
    Category:Undead Category:Hook Users'
  source_ids: *id004
  decisive: false
  status: unverified
