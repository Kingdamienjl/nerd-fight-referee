    - field: weaknesses
      value: "Predators evolved to breathe a slightly different atmosphere than Earth's\
        \ and often require breathing apparatuses to breathe properly, though these\
        \ are not necessary for survival. Their blood glows in the dark, making it\
        \ easy to track them by it in low-light conditions. A Predator's cloaking\
        \ systems short-circuit when exposed to water. Their code of honor makes many\
        \ Predators reluctant to fight those that cannot fight back, or those that\
        \ are ill or pregnant. They dislike using their advanced, high-powered weaponry\
        \ against worthy prey unless necessary, often handicapping themselves by abandoning\
        \ their ranged weapons and even armor to better enjoy a hunt or honor a skilled\
        \ foe, though there are those that lack such morals. Since their Bio-Masks\
        \ use infrared to see, Predators cannot see things with low temperatures.\
        \ Notable Weapons and Technology: A full list of Yautja technology and weapons\
        \ can be seen here and here Predator Bio-masks.png| Various Bio-Masks Celtic's\
        \ Bio-Mask.webp|Celtic's Bio-Mask Elder Predator Bio-Mask.webp|An Elder Predators\
        \ Bio-Mask - Bio-Mask: In addition to simple protection, the Predator's unique\
        \ visor provides many functions, such as a breathing apparatus, a translator,\
        \ voice mimicry systems, audio and visual recorders, the ability to zoom in\
        \ on distant objects and targets, and the Plasmacaster targeting systems.\
        \ The Bio-Mask has many different systems that perform various tasks that\
        \ aid in a hunt, such as predicting and anticipating strikes, calculating\
        \ the trajectory for killshots, picking up brain waves to help alert the user\
        \ for danger, identifying a\u200B\u200B weapon and its ammunition. Of these\
        \ systems, the best known and most used are their imaging systems, which allow\
        \ Predators enhanced sight through a number of different settings, such as\
        \ thermal and ultraviolet vision, electromagnetism-based sight, tech vision\
        \ that allows them to spot and analyze mechanical systems, and neuro vision\
        \ allowing for the analysis of a target's emotional state, among many others\
        \ that have not yet been fully demonstrated. Predator Combi stick extended.webp|A\
        \ fully extended Combistick FVPlasmacaster2.webp|Plasmacaster concept art\
        \ Smart Disc BTS-P2.webp|A Smart Disc Pred Plasma gun.webp|A Plasma Pistol\
        \ Predator Dissolving Acid.png|Concept art of Dissolving Acid Predator Falcon.png|\
        \ Bird-like spying drone used by Predators Predator Netlauncher1.webp|The\
        \ Netgun used by Predators Pred ShurikenPNG.webp|Predator Shuriken replica\
        \ from Slideshow Collectibles"
