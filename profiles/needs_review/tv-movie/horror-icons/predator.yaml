    - field: weaknesses
      value: "Predators evolved to breathe a slightly different atmosphere than Earth's\
        \ and often require breathing apparatuses to breathe properly, though these\
        \ are not necessary for survival. Their blood glows in the dark, making it\
        \ easy to track them by it in low-light conditions. A Predator's cloaking\
        \ systems short-circuit when exposed to water. Their code of honor makes many\
        \ Predators reluctant to fight those that cannot fight back, or those that\
        \ are ill or pregnant. They dislike using their advanced, high-powered weaponry\
        \ against worthy prey unless necessary, often handicapping themselves by abandoning\
        \ their ranged weapons and even armor to better enjoy a hunt or honor a skilled\
        \ foe, though there are those that lack such morals. Since their Bio-Masks\
        \ use infrared to see, Predators cannot see things with low temperatures.\
        \ Notable Weapons and Technology: A full list of Yautja technology and weapons\
