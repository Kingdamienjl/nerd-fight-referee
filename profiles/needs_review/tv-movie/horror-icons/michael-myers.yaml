        to trick her and approach her in deadly silence. Michael can play dead after
        taking attacks that would kill most people, allowing his targets to become
        vulnerable and open for a killing blow. Often kills the power and disables
        landlines before entering locations to murder his victims. Had enough foresight
        to drag a large tree onto a road, blocking off an escape route for his victims.
        Killed every single officer in a police station by himself, despite lacking
        any form of combat training) Standard Tactics: Michael Myers is an emotionless,
        mute serial killer who feels no remorse when killing people or animals. This
        enables Michael to be a brutal killer and sometimes mutilate his victims.
