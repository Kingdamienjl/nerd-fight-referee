    - field: intelligence
      value: 'Above Average (Michael is rather cunning despite his simple, brutal
        method of killing. In his first escape, Michael mastered driving in seconds
        and later memorized Haddonfield''s layout to effectively travel across town.
        He utilizes his skill in stealth to sneak up on and kill unsuspecting victims.
        After being stabbed in the eye and chest by Laurie, he pretended to be dead
        to trick her and approach her in deadly silence. Michael can play dead after
        taking attacks that would kill most people, allowing his targets to become
        vulnerable and open for a killing blow. Often kills the power and disables
        landlines before entering locations to murder his victims. Had enough foresight
        to drag a large tree onto a road, blocking off an escape route for his victims.
        Killed every single officer in a police station by himself, despite lacking
        any form of combat training) Standard Tactics: Michael Myers is an emotionless,
        mute serial killer who feels no remorse when killing people or animals. This
        enables Michael to be a brutal killer and sometimes mutilate his victims.
        Michael usually uses a kitchen knife to carry out his murders, but he can
        also use other weapons he finds. Michael utilizes the element of surprise
        and his natural talent in stealth, stealthily approaching his target in deadly
        silence.'
      source_id: vsbattles-michael-myers-horror-icons
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'As Thorn is the entity that controls Michael, it will cause him to suddenly
        become inactive whenever resting. A ritual can also be performed to separate
        Thorn from Michael, depriving him of his power. Note: This profile covers
        Michael Myers in the Thorn Timeline. The movies in this timeline are Halloween,
        Halloween II, Halloween 4: The Return of Michael Myers, Halloween 5: The Revenge
        of Michael Myers, and Halloween: The Curse of Michael Myers. ==Gallery== Michael2.jpg|Michael
        in Halloween II (1981) Michael2-4.png|Ditto 6aafd206bc624f77ab7471b382622977.jpg|Michael
