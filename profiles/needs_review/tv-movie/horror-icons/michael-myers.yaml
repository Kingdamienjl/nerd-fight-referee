    Halloween 4: The Return of Michael Myers, Halloween 5: The Revenge of Michael
    Myers, and Halloween: The Curse of Michael Myers. ==Gallery== Michael2.jpg|Michael
    in Halloween II (1981) Michael2-4.png|Ditto 6aafd206bc624f77ab7471b382622977.jpg|Michael
