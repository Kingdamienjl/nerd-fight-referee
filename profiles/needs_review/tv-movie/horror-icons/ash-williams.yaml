  attack_potency:
    text: Wall level+ (Has slain and killed Deadites that can punch through wooden
      walls. Held a door against the Kandarian Demon, who has split apart small trees
      and flipped over cars. Broke out of a Deadite-possessed Doctor's grip, who could
      punch through a metal table, which should be on this level), higher with Mechanical
      Gauntlet (Superior to his normal arm. Casually crushed an iron goblet, has easily
      overpowered and killed multiple Deadites with it, and it held against a sword-wielding
      Evil Ash). Ignores conventional durability with Kandarian Dagger
    source_ids:
    - mediawiki-11640
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Superhuman (Outran The Kandarian Demon that was gaining on him while Ash
      was on horseback, and has kept up with a car) with Supersonic combat speed and
      reactions (Can dodge his own boomstick shots fired at him, and can keep up with
      the Deadites, who are also capable of reacting to the shots of Ash's boomstick)
    source_ids:
    - mediawiki-11640
    confidence: 0.6
    notes: auto_repair source extraction
