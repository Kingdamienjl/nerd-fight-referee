  section: weaknesses
  axis: weakness
  text: "Somewhat mentally unstable, and sometimes he doesn\xB4t take things seriously.\
    \ Extremely arrogant ==Gallery== JpzZ2rT.jpg ==Notable Matchups== Victories: Rick\
