      value: "*Arrogance. ** Pennywise, given its many years of manipulating humans,\
        \ thinks very highly of itself and underestimates humans, which was what lead\
        \ to its downfall. ** This extends to the point where it gives itself titles\
        \ like the \"Eater of Worlds\". *The Ritual of Ch\xFCd. ** The Ritual of Ch\xFC\
        d is a battle of wills and belief, a tribal ritual that can be used to kill\
        \ or Pennywise. *** It requires a group of up to seven people, but it can\
        \ still work with a lesser amount of people like six. *** It requires the\
        \ castors to truly believe that Pennywise can be killed, which might be difficult\
        \ to do if they saw its regenerative capabilities beforehand. *** It requires\
        \ each person to sacrifice/destroy a \"token\", which is any item that relates\
        \ to their childhood, usually something that ties into their trauma or anxiety.\
        \ Each person present must also get over the fear/anxiety that said token\
        \ represents. *** Also requires all present to repeatedly say a chant, \"\
        Turn light to dark\", while holding hands in a circle surrounding the vessel\
        \ used to contain Pennywise. *** It also needs to be performed in Pennywise's\
        \ lair, where he has a significant advantage. *** If so much as one of these\
        \ rules are broken, the ritual will not work. *Strong Belief. ** Pennywise\
        \ is a monster that thrives in situations where one questions what is real\
        \ and fake, so genuine belief is very effective against it. ** Simply believing\
        \ that it isn't real is enough to temporarily negate its powers and cause\
        \ it to go away, allowing for a safe escape. ** Strong enough belief, along\
        \ with some courage, in general makes Pennywise more vulnerable. A good example\
        \ of this would be Eddie's encounter with Pennywise in the pharmacy, where\
        \ Eddie almost choked Pennywise to death because of this. Another example\
        \ is in the climax, where Eddie was able to harm Pennywise at his peak with\
        \ a sharp pole by believing it will harm him. ** At the end of It: Chapter\
        \ Two, its own belief was used against it. By relentlessly insulting the clown,\
        \ the Losers Club were able to make it feel small, thus greatly weakening\
        \ it to a point they can easily rip him apart, negating his immortality and\
        \ pain tolerance. *** This is most likely a result of The Ritual of Ch\xFC\
        d,It can be considered that Eddie was actually Richie's token the whole time.\
        \ Richie throughout both films is insecure about his homosexuality (With there\
        \ being many moments where he hides his sexuality and lies about it), and\
        \ has a secret crush on Eddie. In the final battle between the Losers and\
        \ Pennywise, It kills Eddie. Afterwards, Richie truly realizes how much he\
        \ loved him and is willing to show it without regret, and only after this\
        \ point in the battle, the Losers were able to insult Pennywise to death as\
        \ beforehand, this approach did absolutely nothing. *Collective Bravery. **\
        \ Courage, especially courage shared among several people, can overcome Pennywise.\
        \ *** This doesn't actually prevent Pennywise from attacking, and Pennywise\
        \ has been known to use the Deadlights when faced with a fearless foe. *Hibernation.\
        \ ** Pennywise has a hibernation cycle that lasts for 27 years, and during\
        \ this time, it is vulnerable. *Love. ** Love from another person, such as\
        \ in the form of a kiss, can break those under the effects of the Deadlights\
        \ free. *Fear. ** Pennywise rarely goes immediately for the kill, because\
        \ he wants to inspire fear within his victims first. ** This is because fear\
        \ makes the flesh of his victims taste better to him, akin to putting salt\
        \ on meat. *** Pennywise isn't required to scare people in order to kill them,\
        \ as there have been moments where he killed and devoured people that weren't\
        \ afraid of him, like Victoria. ==Gallery== Pennywise- Welcome to Derry345.jpg|Pennywise\
        \ in IT: Welcome to Derry ==Respect Threads== *Pennywise (2000s Movies)/Gewsbumpz\
        \ dude ==Notable Matchups== Victories: Jason Voorhees (Friday The 13th) Jason's\
        \ Profile (Speed was equal. Undead Jason was used and Pennywise was restricted\
        \ to his 9-B forms) Vecna (Stranger Things) (IT (2017)) Vecna's Profile (Speed\
        \ wass equalized. The fight was in Derry, Maine. Pennywise had his meat cleaver.\
        \ Both had 1 minute of prep time and prior knowledge. Vecna was in his post-abyss\
        \ key. They started 15 meters away from each other. SBA assumed otherwise)\
        \ Losses: Megamind (Megamind) Megamind's Profile (Speed was equalized. Megamind\
        \ had access to his equipment. 8-A and Low 7-B equipment is restricted. Pennywise\
        \ was in the Well House and Megamind was in his car parked outside.) Inconclusive:\
        \ ==References== {{Reflist|2}} ==Explanations== {{Discussions|Pennywise Movies}}\
        \ Category:Characters Category:Movie Characters Category:Monsters Category:Psychopaths\
        \ Category:Horror Characters Category:Eldritch Horrors Category:Social Influencers\
        \ Category:Shapeshifters Category:Size Users Category:Flight Users Category:Sound\
        \ Users Category:Surface Scalers Category:Reality Warpers Category:Illusionists\
        \ Category:Enhanced Senses Users Category:Mind Users Category:Empowerment\
        \ Users Cat"
