- id: the-deadlights-summary-before-the-physical-universe-existed-there-was-a-great-multiverse-that-contained-a-countless-infinity-of-worlds-known-as-the-macroverse-maturin-was-a-benevolent-cosmic-force-of-creation-that-appeared-as-a-giant-turtle-carrying-everything-on-its-back-while-the-deadlights-were-a-formless-and-malevolent-force-of-destruction-endless-spheres-of-orange-light-that-simply-waited-to-feed-at-some-point-in-this-timeless-history-before-maturin-withdrew-into-its-shell-it-vomited-the-universe-and-the-deadlights-took-advantage-of-this-and-began-searching-for-food-inside-this-small-egg-through-an-extension-of-the-todash-darkness-spreading-across-the-worlds-there-they-found-humanity-filled-with-appetizing-exotic-fears-and-sensory-terrors-as-a-perfect-food-source-the-deadlights-translated-themselves-into-reality-came-to-the-world-and-went-into-hibernation-during-the-ice-age-creating-a-destructive-meteor-like-impact-eventually-humanity-built-the-town-of-derry-over-the-crash-site-and-every-twenty-seven-years-it-would-awaken-from-hibernation-and-feed-on-the-mostly-child-residents-of-derry-usually-taking-the-shape-of-their-greatest-fears-in-order-to-extract-and-consume-the-most-delicious-terror-from-them-powers-and-stats
  name: The Deadlights}} ==Summary== Before the physical universe existed, there was
    a great multiverse that contained a countless infinity of worlds, known as the
    Macroverse. Maturin was a benevolent cosmic force of creation that appeared as
    a giant turtle carrying everything on its back, while the Deadlights were a formless
    and malevolent force of destruction, endless spheres of orange light that simply
    waited to feed. At some point in this timeless history, before Maturin withdrew
    into its shell, it vomited the universe, and the Deadlights took advantage of
    this and began searching for food inside this small egg through an extension of
    the Todash Darkness spreading across the worlds. There they found humanity, filled
    with appetizing exotic fears and sensory terrors, as a perfect food source. The
    Deadlights translated themselves into reality, came to the world, and went into
    hibernation during the Ice Age, creating a destructive meteor like impact. Eventually
    humanity built the town of Derry over the crash site, and every twenty seven years
    it would awaken from hibernation and feed on the mostly child residents of Derry,
    usually taking the shape of their greatest fears in order to extract and consume
    the most delicious terror from them. ==Powers and Stats
