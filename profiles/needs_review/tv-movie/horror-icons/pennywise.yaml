  name: The face of the clown in the stormdrain was white, there were funny tufts
    of red hair on either side of his bald head, and there was a big clown-painted
    smile painted over his mouth. If George had been inhabiting a later year, he would
    have surely thought of Ronald McDonald before Bozo or Clarabell. He was wearing
    a baggy silk suit with great big orange buttons. A bright tie, electric-blue,
    flopped down his front, and on his hands were big white gloves, like the kind
    Mickey Mouse and Donald Duck always wore.
