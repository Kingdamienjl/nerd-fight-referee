        as much fear as possible within its victims/meals, regularly utilizing vulnerabilities
        like fears, traumatic experiences, deceased loved ones, memories, and more
        to its benefit. Alongside this, Pennywise is meticulously manipulating all
        of Derry, Maine so it can easily get away with its kills, not only receiving
        little to no intervention from local authorities, but from the rest of the
        world, making so the wider public news doesn't pick up on Pennywise's heinous
        actions. Pennywise is also a talented schemer that is adept in manipulation,
        such as using the form of a clown to lure in kids like George, and convinced
        Henry Bowers to hunt down the Losers Club.
