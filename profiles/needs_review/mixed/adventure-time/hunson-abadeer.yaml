- id: claim-powers-and-abilities-22a6484d
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Enhanced Senses, Magic, Soul Manipulation,
    Absorption (Gets more powerful the more souls he eats. Marceline inherited this
    ability from him), Regeneration (At least Mid), Shapeshifting, Body Control, Transmutation,
    Biological Manipulation, Weather Manipulation, Energy Manipulation, Precognition
    (Scanned the "Wheel Of Future Time" and saw the secrets of Finn's soul), Void
    Manipulation (Erased a page in his book, was going to erase the existence of Ooo
    from the universe), Teleportation, Necromancy, Size Manipulation, Power Absorption,
    Power Bestowal, Power Nullification, Age Manipulation, Portal Creation and Time
    Travel (Can create a portal to the past or the future), BFR (Can create a portal
    to a bottomless pit), Life Manipulation (Gave life to his book), Death Manipulation
    (If you read the final chapter of his book you will die), Fire Manipulation, Empathic
    Manipulation, Madness Manipulation, Mind Manipulation, Fear Manipulation, Telepathy,
    Darkness Manipulation, Hair Manipulation, Sealing (Sealed someone in his book),
    Text Manipulation, Reality Warping (The end of his book was warped; is a very
    powerful user of The Cosmic Imagination), Curse Manipulation, Invisibility, Forcefield
    Creation, Healing, Flight, Duplication, He has been said to be "The Source Of
    All Evil", Non-Physical Interaction (Even without his powers was capable of fighting
    ghosts that even Marceline Abadeer couldn't touch), Time Manipulation, Self-Sustenance
    (Type 1 & 2; Existed before food and air, and do not require it to live), Acausality
    (Type 1 & 4; Existed before time and nothingness, and shouldn't be affected by
    changes in the past when they predate time itself, or any effect of time on them
    at all. Due to living beyond anything and nothing, primordial beings should operate
    on a different and irregular system of cause and effect than regular causality),
    Immortality (Type 1, 2, 3 and possibly Type 5. Not even Death can kill him, and
    Marceline said that he's "deathless"; he existed even before time among the Primordial
    Monsters; Existed before the concept of aging), Resistance to Void Manipulation
    (As a primordial monster that existed before time inside of an endless void, an
    "All-Encompassing Void' before the creation of the Multiverse used to be his natural
    environment. The Lich says that the primordial monsters predated time, anything,
    and nothing), Immunity to Soul Manipulation as he doesn't have a soul.
