- id: claim-powers-and-abilities-71e80297
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Body Control (Jake's main ability usually
    called "Stretchy Powers" allows him to manipulate any part of his body in countless
    of ways. He can stretch himself extensively and also grow or reduce the size and
    mass of any of his limbs or even organs. He can shapeshift and create weapons.
    He can completely control his own blood within himself. He can alternate between
    his usual yellow form and his blue shapeshifter form. He can grow wings to fly
    and he can even extend this power to creating entirely new personalities that
    are not him but part of him), Non-Physical Interaction (Slow-danced with his subconscious.
    Can fight with ghosts. Can redirect the soul of a lobster to make a sandwich),
    Instinctive Reaction (Can use magic while asleep), Dream Manipulation (He can
    use his dreams to communicate with his brother Jermaine, he can use his imagination
    to 'do anything' within dreamscapes such as creating food), Regeneration (Low-Mid.
    He regenerated a large hole in his torso), Enhanced Senses (Could smell the exact
    location of the Enchiridion from smelling the ground and can track the Enchiridion
    with his nose. Can smell the materials of a bed), Minor Reality Warping (Using
    his imagination). Resistance to Mind Manipulation (Adam Muto confirmed that when
    Jake put on Ice King's Crown during the events of Thank You, he suffered none
    of the debilitating effects due to his own magic powers), Heat Manipulation (Can
    shove his hands in a pool of lava. Could withstand the heat from Eye Demons, which
    could melt steel weapons. He's fine after getting hit by magic wands that melt
    buildings. Survives being burned by lava. Stood in PB's burning room which melted
    PB's body), Cold Manipulation (His fur makes him resistant to the Ice Kingdom's
    cold. Can use his body to sled on the snow in the Ice Kingdom, whereas Finn was
    turned into ice by sledding on the same snow. Can be repeatedly frozen by the
    Ice King and is perfectly fine when the ice breaks. Unaffected by a cold spell
    that froze a prison), Poison Manipulation (Was bit by his imagined snakes and
    didn't immediately die from their poison. Takes a large amount of poison from
    scorpions in a maze, requiring even more scorpions to affect him. By expanding
    his body to larger sizes, he can resist poison. He stretched his liver to be 51
    times his size when Me-Mow attempted to kill him with poison that would kill a
    dog 50 times his size), Transmutation (Was beating back his lump infection with
    sheer willpower), Death Manipulation (Can survive the Lich's death mist poured
    down his throat, which instantly killed Old Man Prismo) | Reality Warping, Telekinesis
    and Transmutation as a Wizard.
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
