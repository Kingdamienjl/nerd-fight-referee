  intelligence:
    text: Extraordinary Genius {{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content=
      Princess Bubblegum is extremely talented in dozens of different fields, creating
      several different inventions given preparation, leading a kingdom singlehandedly
      as a child, and even some combat skill. In the field of Biology, she singlehandedly
      created her own sentient and intelligent gum relatives as a child. As she got
      older, She created the entire population of the candy kingdom. She created Goliad
      and Stormo, two immortal psychic candy sphinxes enhanced from the DNA of herself
      and of Finn, and she created the Lemongrabs who she dubbed as "failed experiments".
      She created probes full of candy spores meant for seeding new planets with their
      own candy kingdom. She created a new heart for the Ice King in 15 minutes out
      of Ricardio's sinews, some toffee, and some maracas, and she was capable of
      curing Marceline's vampirism. She created an artificial soul, and she created
      a serum capable of resurrecting dead candy people. She genetically engineered
      a candy person to be fireproof. She invented a serum that makes whoever ingests
      it sweat cleaning detergents. She also created seeds that grow into candy crops,
      a cure for the common cold, and also edible fire. In the field of Mechanical
      Engineering, she made a pea-shooting taser and grenades that produced an entire
      butterscotch lake. As she got older, she goes on a spree of creating new technology.
      In robotics, she created the Gumball Guardians and the Rattleballs robots. She
      created a robotic replica of herself for a candy person to marry. She created
      robot arms for both Shoko and Finn and a vampire sensor. She created self replicating
      nanites that can make muffins when given a recipe. She created an aura visualizer
      that can make the aura of people appear on the material plane. She invented
      a limited time travel sphere which works by logging the molecules of an object
      and reversing the logged action, transferring the molecules back to the time
      that which the user wishes. She invented a hovercouch, hoverpacks, exploration
      vehicles, and even rocket ships. She can identify the origins of technology,
      determining that the origin of Susan's cranial implant and the extraction ship
      are both of human origin. She has created many serums and weapons that are useful
      in battle. In her youth, she made a pea-shooting taser and grenades that produced
      an entire butterscotch lake. She created growth and shrinking serums. She made
      a Multi-Mode Gun which shoots bolts of energy, turns victims into batteries,
      a tunneling mode that digs into the ground, and also an unnamed mode which holds
      people in place. She has created a wrist-mounted rocket launcher and paralyzing
      potions. She created a device which turns smoke inside of a room to rain clouds.
      She invented suits that can protect people from radiation, and also from the
      heat of the Flame Kingdom. She also made an antidote for Zanoit poisoning. She's
      invented large forcefields able to defend from Larvo, a GOLB monster, and Flame
      Princess's attacks. She has made large holographic maps and communication necklaces,
      snow gear, deep sea diving gear, invisibility suits. Her scientific knowledge
      stretches out to the magical realm as well. She created a sweater that resisted
      the magic of the Lich. She analyzed Magic Man's time bubble and Maja the Sky
      Witch's protective spell. She used her knowledge of the components of real world
      candy in order to fuel her candy elemental powers. She is shown to have used
      magic to create bread from scratch. Her other achievements consist of making
      direct cheese from a cow, creating a tomato by combining an octopus and a balloon
      in a teleporter, turning BMO, a living video game console, into an instrument.
      She also speaks German and Korean. She was able to use very minor clues to locate
      Hambo inside of Maja's mansion. She was also able to use a machine to hook an
      atom of cheese. She also has combat knowledge, using grappling techniques to
      disarm (ripping off the arms of) Ricardio, and accuracy good enough to hit a
      Varmint in their head with a thrown knife. }}
    source_ids:
    - vsbattles-princess-bubblegum-adventure-time
    confidence: 0.6
    notes: auto_repair source extraction
