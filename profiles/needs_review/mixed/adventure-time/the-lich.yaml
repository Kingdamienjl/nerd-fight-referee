- id: claim-weaknesses-1324314c
  section: weaknesses
  axis: weakness
  text: 'As a being of death, the Lich is weak to life-based powers. This can be seen
    in the episode "Escape from the Citadel" in which a small dab of the Citadel Guardian''s
    blood completely incapacitated the Lich, causing him to devolve into a being of
    love (Sweet P). Magic Users suffer from M.M.S., Magic, Madness, and Sadness. They
    are driven crazy to the point of insanity. Note: According to the Adventure Time
    Encyclopedia, Hunson Abadeer admits the Lich is his only real rival ==Notable
    Matchups== Victories: Losses: Acererak (Dungeons and Dragons) Acererak''s Profile
    (The Lich has optional equipment) Inconclusive: ==References== {{Reflist}} {{Discussions|The
