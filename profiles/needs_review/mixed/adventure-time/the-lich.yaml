- id: claim-powers-and-abilities-1596ae8d
  section: abilities
  axis: hax
  text: 'Passive: *Superhuman Physical Characteristics **Immortality (Types 1, 2,
    3, 4, 5, 6 and 7; Almost impossible to kill permanently according to P.W. because
    he can find a new host very fast. Type 1; Existed before the concept of aging.
    Type 5; Primordial Monsters existed long before the concepts of life and death
    as well as existence itself) **Self-Sustenance (Type 1, 2, 3; Existed before food
    and air, and do not require it to live) **Large Size (Type 1; Towers over Finn
    and Jake and comparable to Billy in size) **Regeneration (Low-Godly; After being
    completely destroyed, he managed to return to his old form) ***Matter Manipulation,
    Cloth Manipulation, Bone Manipulation **Enhanced Senses (Although it is in the
    form of a hand, it can hear, see and feel things that are happening around it)
    **Acrobatics (After opening the portal to the time room, he can easily jump and
    maneuver on the floating/rotating platforms) *Extrasensory Perception (Wizards,
    unlike normal people, can see spirits and other kinds of beings) *Non-Physical
    Interaction (He can touch the New Death, which is an astral being and which Finn
    cannot touch) *Acausality (Type 1, 3, & 4; Existed before time and nothingness,
    and shouldn''t be affected by changes in the past when they predate time itself,
    or any effect of time on them at all. Infinite Liches exist across the multiverse,
    one for each universe, all of whom are implied to be connected via the mind. Due
    to living beyond anything and nothing, primordial beings should operate on a different
    and irregular system of cause and effect than regular causality) **Hive Mind (Type
    1), Cosmic Awareness *Beyond-Dimensional Existence (Type 1; Primordial Monsters
    exists beyond the plane of mortal existence by existing in the void) *Free Movement
    (He can walk on water) *Supernatural Willpower (He can continue to fight without
    caring about having his hand cut off by the grass sword and his face burned by
    the Gumball Guards) *Statistics Amplification (Drinking acid and chemical-like
    things strengthens it, It strengthens itself by absorbing radiation from the power
    well) *Instinctive Action (He burned down the room because he was uncomfortable
    with Jake''s music) Activated: *True Flight *Social Influencing (He forced the
    New Death to kill his father) *Preparation (In order to use the full power of
    the Enchiradion, the gems must be gathered) **Possibly Power Bestowal (He told
    Finn that if he gave The Enchiradion to him, he could make him live forever) **Portal
    Creation, Dimensional Travel (He created a portal and went to the Time Room) *Transformation
    (Turn into liquid to escape his sap prison and transform into gas/smoke after
    Finn & Jake hit him afterward) *Telepathy, Mind Manipulation (Passive; The Lich
    can influence beings like Finn around him just by his presence.) *Magic **Madness
    and Sadness Manipulation (All Wizards are given M.M.S., which is a disease which
    provides the user with Magic abilities, Madness, and Sadness, driving them insane.
    When a Magic User''s powers are absorbed/transferred to another host, the new
    host is inflicted by M.M.S., driving the new host crazy) **Clairvoyance (Wizards
    can see things happening at different locations that he is not present at, like
    a crab''s movements in a faraway pool) **Precognition and Retrocognition (Wizards
    can see visions from the past and the future) **Matter, Energy and Reality Manipulation
    (It was stated that The Elementals created and destroyed by wielding their imaginations
    upon the Matrix of Matter and Energy, Elementals were stated to be equal to the
    Wizards, who can potentially "create and destroy as they please" on a cosmic scale
    by tapping into the power of The Cosmic Imagination) **Electricity Manipulation,
    Teleportation, Forcefield Creation, Minor Biological Manipulation, Size Manipulation,
    Healing, Information Analysis, Body Puppetry (These are the most basic abilities
    of a Wizard) **Light Manipulation, Sound Manipulation, Energy Manipulation and
    Matter Manipulation (All Wizards use the power of their imagination to manipulate
    light, sound, energy, and matter, and because of that, they can influence the
    fundamentals of the Material world) **Perception Manipulation (Can change a person''s
    perception of them to change their appearance of Low Self-Esteem to Self-Confidence,
    even giving enemies the thought that they the wizard in question is capable of
    defeating them) **Law Manipulation, Data Manipulation, Physics Manipulation, Causality
    Manipulation and Probability Manipulation (With False Thuthology, they can make
    2 opposite propositions true by altering physical laws, being able to falsify
    data, making the opponent genuinely believe they are correct) **Reality Warping,
    Mind Manipulation and Subjective Reality (All magic is created by manipulating
    The Cosmic Imagination) **Creation and Conceptual Manipulation (Type 1; The Origin
    of Wizardry is at the Core of Creation, and Wizards can create or destroy as they
    wish, tapping into the Power of The Cosmi'
