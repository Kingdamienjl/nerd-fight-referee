    - field: weaknesses
      value: 'She gets weaker and severely burns in sunlight and if she receives too
        much she will die. She also goes feral if she doesn''t feed on a regular basis.
        As a vampire, she has the stereotypical vampire weaknesses, Vampire Stakes,
        Holy Water, and Garlic | Loses her Nightosphere powers when her amulet is
        removed. Notable Attacks/Techniques: *Soul sucking: Marceline stated the only
        power her demon heritage granted her was the ability to suck souls, like her
        father. This allowed her to gain the specific abilities of vampires she had
        killed. She can also suck out still living souls, which she demonstrated jokingly
        on Jake when they were hunting vampires in "Stakes". *Levitation: She has
        the ability to float and even to fly with careful control and rapid speed.
        She can even sleep while floating, as shown in "Marceline''s Closet". She
        obtained this power from The Fool. *Pyrokinesis: She can light fire with only
        her mind, as seen in "Evicted!" when she lit up all the candles in the tree-house.
        *Telekinesis: She can move things using her mind, as shown in "Evicted!" and
        "Daddy''s Little Monster". She likely obtained this power from Vampire King.
        *Invisibility: She can turn invisible, as seen in "Heat Signature", "Bad Little
        Boy", "Red Starved", and "Princess Day". She obtained this power from The
        Empress. *Necromancy: She can raise spooky scary skeletons, as seen in "Henchman".
        *Rapid healing: She heals quickly from injuries, at least damage from sunlight,
        as shown once she was returned to the shade in "Henchman". Also in "What Was
        Missing" she was exposed to the sunlight in this episode, she quickly retreated
        and the wounds healed. She obtained this power from The Moon. *Shape-shifting:
        She has the ability to shape-shift into numerous monstrous forms, including
        a bat, a wolf, a reptilian creature, and a large tentacled monster. She appears
        to be able to preserve her clothing, even after changing into large forms
        that would cause it to break: in many appearances, the clothing disappears
        until she returns to her humanoid form, whereas in "Sky Witch", she performs
        numerous transformations while still wearing her outfit. She obtained this
        power from The Hierophant. ==Notable Matchups== Victories: Losses: Inconclusive:
