- id: claim-standard-equipment-847190fd
  section: equipment
  axis: equipment
  text: '| center|400px"Scarlet", also known as The Golden Sword of Battle is Finn''s
    original and arguably most iconic sword. The blade is noticeably worn and chipped,
    with several scratch marks. During the events of The Real You, Finn accidentally
    turned the sword into a 4-Dimensional version of itself after he accidentally
    created a 4-Dimensional black hole that was sucking in all of Ooo, it is implied
    that the blade has been lost ever since.center|400pxThe Demon Blood Sword was
    a sword passed down by Finn''s adoptive father, Joshua. It is a very large and
    imposing broad sword made with the blood from the demon Kee-Oth. The sword was
    obviously very important to both Finn and Joshua, considering that Joshua hid
    it away in a dungeon for Finn to discover. Eventually, Finn destroyed the sword
    in an attempt to save The Ice King and Abracadaniel.center|400pxThe Grass Sword
    was a sword Finn received during The Blade of Grass. Despite its rather puny appearance,
    the Sword has proven to be quite powerful. Being able to cut pretty much anything
    without much effort. The sword would later turn out to be cursed and could never
    be "unequipped". Finn quickly accepts this fact and becomes quite skillful with
    using it. During the events of Escape from the Citadel, Finn looses his arm and
    doesn''t use the Grass Sword up until the events of The Comet, in which he uses
    it to defeat Orgalorg the World Breaker.center|400px|alt=The Finn Sword was the
    sword Finn used after the Demon Blood Sword was shattered. It is a distinctly
    white and spherical sword that doesn''t appear to be like anything in Ooo. The
    blade was actually Finn from an alternate period of time-space, who was tricked
    by Prismo into resurrecting him. As such, the Sword is fully sentient and houses
    a small pocket dimension in which "Finn 2" lives in. The Sword was scarcely used
    in combat, but it was depicted as being powerful in its own right. When under
    the control of Bandit Princess, the Sword destroyed a portion of the Box Kingdom
    and Spiky Village and could even clash against the Grass Sword, however that would
    eventually be its undoing. The Sword would later become Fern the Human.center|400px|alt=The
    Small Sword is a rapier-like blade that Finn is first seen using in "Do No Harm".
    The small sword Finn uses looks very similar to his teacher, Rattleballs''s, sword.
    The blade is very thin and is meant to be a weapon used to stab, although it is
    capable of slashing if needed. He uses this weapon after the formation of Fern,
    since his 2 main swords, his Grass Sword and Finn Sword, can no longer be used.center|400px|alt=The
    Night sword was created by Peppermint Butler in "Marcy & Hunson." It is said to
    be very powerful, as it contains dark magic from the Nightosphere provided directly
    by Hunson Abadeer. Peppermint Butler states that the sword will serve Finn better
    than his old cursed Grass Sword. It can shackle/negate the powers of other beings.
    It has a demonic eyeball and a compass in the middle of it. A thousand years into
    the future, it is in the possession of a giant, bearded Sweet P. |}'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-b93d544f
  section: power_scale
  axis: battle_iq
  text: Gifted. Finn the Human doesn't seem like the most intelligent person in the
    series, but his intelligence ranges far in combat and in regular situations. In
    combat, Finn is an incredibly talented and gifted fighter. Without formal training,
    he has mastered several different martial arts styles that he employs against
    his enemies. He is proficient in several forms of combat, including hand-to-hand,
    magic, and swordsmanship. When it comes to hand-to-hand combat, Finn uses a myriad
    of different techniques ranging from disarming techniques, full-body holds dubbed
    the "Chokey Brokey Style", and using his acrobatics as well. In his battle with
    Tiffany, he used a combination of holds, then he kicked his blade out of his hand
    and proceeded to hit him in the face with a barrage of punches. While fighting
    Why-wolves, he lures them to a well and does a flip when they enter his position,
    then he spikes them into a well while airborne. With his swordsmanship, he dispatched
    several Gladiator Ghosts casually, using different methods ranging from weapon
    binding to chest bumps, and spin kicks another's head off. He also has unnatural
    accuracy, throwing a sword with such precision that it cut off 3 heads of a pair
    of Gladiator Ghosts, and throwing his sword and other objects at enemies with
    great precision. He quickly comprehends how to use different weapons, shown when
    he got the grass sword and adapted to its sentient nature, or when he understood
    his Pink Sweater's resistance to magic and used it to pull out the Lich's face.
    His swordsmanship got astronomically better in Season 5 after being trained by
    the master swordsman Rattleballs, who originally said that his swordsmanship was
    extremely poor. Finn is a very quick thinker. His fear of the ocean forbade him
    from swimming underwater, so he knocked himself out in order to sink to the bottom
    of the ocean. As he couldn't use a zombie serum on a group of zombies, he covered
    himself in the antidote and jumped in the crowd. He is shown to use his enemies'
    possessions in battle, shown when he used the Ice King's jacket and a giant ogre's
    large dollar to glide in the air. While trying to free himself from the Business
    Men's robot, he comes up with a plan for Jake to rapidly expand and block their
    suction machine via overeating and stretching. After finding out there was multiple
    enemies in a hostage situation, he found a way to quickly, quietly, and efficiently
    dispatch all of them, with one of his methods being to lure one into a room and
    ambush it while they were off guard. Finn's intellect reaches to outside of battle
    as well, except for mathematics. He is cunning, creating a fake Demon Blood Sword
    infused with grape juice and holy water in order to kill Kee-oth. He built a catapult
    used to send Jake across a river with spare trash. He figured out the curse of
    the Frog Monster and the mystery of Tree Trunks' stolen apples. Knows how to pick
    locks
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
