        Style" and other mixed-improvised Martial Arts), Limited Surface Scaling (Can
        crawl along walls and climb structures with little leverage), Non-Physical
        Interaction and Limited Soul Manipulation (Can interact with and harm ghosts
        and other spectral entities), Stealth Mastery (Effortlessly blended into Jake''s
        shadow and was indistinguishable from it), Social Influencing (Is naturally
        charismatic, much like his father, and can convince others to follow him rather
        easily), Indomitable Will (Trudged through the Hall of Egress for months,
        possibly years, resisted the mind manipulating abilities of both Goliad and
        the Lich. Destroyed Evil Guy''s illusion through sheer will to do the right
        thing and was unaffected by Fight King''s bloodlust magic), Enhanced Senses
        and Instinctive Reaction, (Learned to see without sight from the Hall of Egress),
        Possible Statistics Amplification and Emotional Manipulation (Seems to accomplish
        his best feats when overcome with emotion, such as when he destroyed the Lich''s
        physical form with the power of liking someone a lot. Gets stronger as he
        builds fury), Regeneration (Mid-Low: Regularly recovers from injuries such
        as severe burns and massive bruises), Limited Body Control, possibly Elasticity
        (Can bend his body in unnatural ways and seemingly extend his limbs), Sound
