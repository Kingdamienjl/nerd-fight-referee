  intelligence:
    text: Gifted. Finn the Human doesn't seem like the most intelligent person in
      the series, but his intelligence ranges far in combat and in regular situations.
      In combat, Finn is an incredibly talented and gifted fighter. Without formal
      training, he has mastered several different martial arts styles that he employs
      against his enemies. He is proficient in several forms of combat, including
      hand-to-hand, magic, and swordsmanship. When it comes to hand-to-hand combat,
      Finn uses a myriad of different techniques ranging from disarming techniques,
      full-body holds dubbed the "Chokey Brokey Style", and using his acrobatics as
      well. In his battle with Tiffany, he used a combination of holds, then he kicked
      his blade out of his hand and proceeded to hit him in the face with a barrage
      of punches. While fighting Why-wolves, he lures them to a well and does a flip
      when they enter his position, then he spikes them into a well while airborne.
      With his swordsmanship, he dispatched several Gladiator Ghosts casually, using
      different methods ranging from weapon binding to chest bumps, and spin kicks
      another's head off. He also has unnatural accuracy, throwing a sword with such
      precision that it cut off 3 heads of a pair of Gladiator Ghosts, and throwing
      his sword and other objects at enemies with great precision. He quickly comprehends
      how to use different weapons, shown when he got the grass sword and adapted
      to its sentient nature, or when he understood his Pink Sweater's resistance
      to magic and used it to pull out the Lich's face. His swordsmanship got astronomically
      better in Season 5 after being trained by the master swordsman Rattleballs,
      who originally said that his swordsmanship was extremely poor. Finn is a very
      quick thinker. His fear of the ocean forbade him from swimming underwater, so
      he knocked himself out in order to sink to the bottom of the ocean. As he couldn't
      use a zombie serum on a group of zombies, he covered himself in the antidote
      and jumped in the crowd. He is shown to use his enemies' possessions in battle,
      shown when he used the Ice King's jacket and a giant ogre's large dollar to
      glide in the air. While trying to free himself from the Business Men's robot,
      he comes up with a plan for Jake to rapidly expand and block their suction machine
      via overeating and stretching. After finding out there was multiple enemies
      in a hostage situation, he found a way to quickly, quietly, and efficiently
      dispatch all of them, with one of his methods being to lure one into a room
      and ambush it while they were off guard. Finn's intellect reaches to outside
      of battle as well, except for mathematics. He is cunning, creating a fake Demon
      Blood Sword infused with grape juice and holy water in order to kill Kee-oth.
      He built a catapult used to send Jake across a river with spare trash. He figured
      out the curse of the Frog Monster and the mystery of Tree Trunks' stolen apples.
      Knows how to pick locks
    source_ids:
    - vsbattles-finn-the-human-adventure-time
    confidence: 0.6
    notes: auto_repair source extraction
