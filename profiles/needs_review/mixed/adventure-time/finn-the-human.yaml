    - field: powers_and_abilities
      value: 'Base= Superhuman Physical Characteristics, Acrobatics, Martial Arts,
        Weapon Mastery (Skilled with a variety of weapons, mainly blades, even in
        skill with Fern, the literal incarnation of the Grass Sword, which was so
        precise and perfect in its movements that Tree Trunks was able to immediately
        identify it as cursed and unnatural. Trained under Rattleballs and was able
        to replicate his technique to some extent, is proficient in "Chokey Brokey
        Style" and other mixed-improvised Martial Arts), Limited Surface Scaling (Can
        crawl along walls and climb structures with little leverage), Non-Physical
        Interaction and Limited Soul Manipulation (Can interact with and harm ghosts
        and other spectral entities), Stealth Mastery (Effortlessly blended into Jake''s
        shadow and was indistinguishable from it), Social Influencing (Is naturally
        charismatic, much like his father, and can convince others to follow him rather
        easily), Indomitable Will (Trudged through the Hall of Egress for months,
        possibly years, resisted the mind manipulating abilities of both Goliad and
        the Lich. Destroyed Evil Guy''s illusion through sheer will to do the right
        thing and was unaffected by Fight King''s bloodlust magic), Enhanced Senses
        and Instinctive Reaction, (Learned to see without sight from the Hall of Egress),
        Possible Statistics Amplification and Emotional Manipulation (Seems to accomplish
        his best feats when overcome with emotion, such as when he destroyed the Lich''s
        physical form with the power of liking someone a lot. Gets stronger as he
        builds fury), Regeneration (Mid-Low: Regularly recovers from injuries such
        as severe burns and massive bruises), Limited Body Control, possibly Elasticity
        (Can bend his body in unnatural ways and seemingly extend his limbs), Sound
        Manipulation (Can autotune his voice due to swallowing a tiny computer, can
        incapacitate others with a ''power shriek''), Astral Projection, Limited Fire
        Manipulation (Can ignite his hands) Acausality (Type 1: Unaffected by interacting
        with his past self), Limited Precognition (Had visions of the Finn Sword before
        he obtained it), Retrocognition (Saw his past lives), Limited Mind Manipulation
        (Can actively seal away memories that make him upset as if they never happened
        and can ''turn off'' Imagination), Immortality (Type 5: Destined to always
        reincarnate in another form), Negation of Nonexistent Physiology, Acausality,
        Regeneration (Mortally wounded Primordial Monsters such as the Lich and Orgalorg,
        who predate the duality of existence and non-existence, space and time, life
        and death. Temporarily prevented the Lich from reforming), Abstract Existence
        (Type 2: Is the physical form of the concept of righteousness and hope), Summoning,
        Animal Manipulation, and Weapon Creation (Knows how to summon Hunson Abadeer,
        can also summon swords with The Ring and a swarm of butterflies, which act
        as his Astral Beast. Can summon a goblin wizard to attack his enemies with
