- id: claim-weaknesses-98ba9385
  section: weaknesses
  axis: weakness
  text: 'Up to Season 5, Finn has serious thalassophobia, or fear of the ocean. Particularly
    tense battles can put Finn in a very violent attitude, making his moment-to-moment
    thinking suffer. Has very little control, or even awareness over his powers or
    true nature. ==Notable Matchups == Victories: Marcy Wu (Amphibia) Marcy''s Profile
    (Everything above 9-A was restricted, speed was equalized, and starting distance
    was 10 meters) Losses: Raven (Teen Titans) Raven''s Profile (Starting distance
    was 20 meters, Finn had access to any equipment, Speed was equalized.) Inconclusive:
