    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: Save The World: *B.A.S.E.:
        A large mechanical structure that the Ice King can place down on floor tiles.
        Structures attached to B.A.S.E. up to a distance of four segments out are
        structurally reinforced. B.A.S.E. must be placed down in order to use Frozen
        Castle. **Frozen Castle: Enemies standing on B.A.S.E. are "snared," or slowed
        by 15% of their speed. Enemies that damage a structure reinforced by B.A.S.E.
        are frozen in place for four seconds. Freezing has a cooldown of 15 seconds.
        *Kinetic Overload: Melee attacks resulting in knockbacks or staggers result
        in an area of effect energy attack that deals 25 damage to nearby enemies.
        (For reference, the Player has 100 health.) After melee critical hits, melee
        impact damage is increased by 10% for 5 seconds. This stacks with up to five
        additional critical hits, meaning damage can be boosted up to 150% of what
        it normally is. *Bull Rush: The Ice King charges forward with a shield in
        hand. Any enemies hit by this attack are "collected" on the shield, which
        knocks them back after Bull Rush ends or the Ice King collides with a wall.
        Does a base of 156 physical damage, which is enough to kill an unshielded
        Player in one hit. See the gallery for a visual clarification of what this
        entails. *D.E.C.O.Y.: The Ice King deploys a D.E.C.O.Y., which distracts any
        nearby opponents for a period of 6 seconds. *R.O.S.I.E.: The Ice King deploys
        an automated turret that can shoot up to 7 rounds a second. R.O.S.I.E. has
        150 ammo and deals 69 points of physical damage per shot. ==Notable Matchups==
