      value: "PersonalitiesBen debated with Bellicus and Serena in Universe vs. Tennyson,\
        \ where they agreed to let Ben use Alien X at his whim on exchange for letting\
        \ them argue in peace alone, whcih stays that way as an episode later in Weapon\
        \ XI Ben turns into Alien X and immidietely gains Control and moves freely.\
        \ My ally DJ, write on his scale that \"Derrick James Wyatt said he has now\
        \ easier time debating with them but not full access, which is not true not\
        \ only becouse he's not a writer and Has no validity & canonicity, but Alien\
        \ X's mindspace happens in real time, so they couldn't possibly debate as\
        \ Ben after immidetaly, and moved freely, and even the slightest movement\
        \ requires an agreement, even a single gesture would have to have atleast\
        \ seconds to approved yet Ben moved his hand to block Leander's blast before\
        \ It reached.\" But I personally think it could go either direction as the\
        \ show has demonstrated them being able to manipulate and recreate time plus\
        \ state that they had their first conversation with Ben outside of time, something\
        \ Ben didn't remember. My ally DJ also states, \"Alien X weaknesses listed\
        \ by DJW aren't canon, for explenation read notes/explenations here\" but\
        \ on my own cosmology scale, I had concluded to the idea that an omnipotent\
        \ being could realistically make his avatar be weaker or stronger if they\
