        \ other two to take any action; even the slightest movement requires a 2-1\
        \ vote. This weakness becomes irrelevant in Omniverse during the episode 'Universe\
        \ v. Tennyson'. When Ben is put on trial for violating the Multiverse Preservation\
        \ Act, he chooses a Tetramand trial by combat against the Galactic Gladiator\
        \ to prove his innocence. Ben persuades both Bellicus and Serena to cooperate\
        \ and, as he phrases it, 'give him the keys to Alien X'. They agree in exchange\
