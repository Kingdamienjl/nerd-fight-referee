        \ Serena and Bellicus overriding Ben (as seen when they agreed to disable\
        \ the Omnitrix\u2019s function to stop Ben from detransforming) to do the\
        \ needful or argue eternally with Ben after Ben tries to stop them from harming/killing\
        \ anyone. To avoid speculative or unknown actions, Alien X is treated as having\
        \ full internal cooperation. He should be piloted either by Ben in full control\
        \ (e.g., Ben 10 Omniverse Universe vs. Tennyson) or as a Standard Celestial\
        \ Sapien. Notable Attacks/Techniques: AlienXRealityManip.gif|Reality Warping/Time\
        \ manipulation Axsurviving.gif|Tanking the destruction of the entire Universe\
        \ Alienxrecreating.gif|Recreating the entire Universe with a thought Alienxgalaxy.gif|Creating\
        \ a galaxy-sized black hole/Self Duplication bellicus serena.png|Bellicus\
        \ and Serena (The two personalities of Alien X inside his hidden pocket dimension)\
        \ AXvsrooters.gif|Mind-controlling/Telekinetically moving the Rooters and\
        \ Amalgam kids Alien X is a Celestialsapien. His powers are his thoughts,\
