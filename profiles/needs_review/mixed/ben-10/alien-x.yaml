    - field: weaknesses
      value: 'Arrogant, He considers Grandpa max to be Ben''s source of real strength
        and his biggest weakness, despite being evil still somewhat showing remorse
        towards his grandfather. He is amped by 11 Omnitrices. ripping them out would
        result in him being weakened. Feats: * Casually defeated an alternate timeline
        Ben tennyson who tried fighting him as Cannonbolt and stole the Omnitrix *
        Easily harmed and defeated Reboot Prime Ben''s Rath * Easily defeated Reboot
        Prime Ben''s Humungousaur * Killed many alternate timeline Ben Tennyson and
        Gwen as well * Easily harmed and defeated Alternate timeline Ben''s Big Chill
        * Alien X was pretty easily able to keep up with Chromastone and Ampfibian
        used by alternate timeline Bens * Alien X was able to keep up with several
        alternate timeline Bens and their aliens to the point everyone admitted "they
        are in trouble" and "we didn''t make a scratch" forcing them to change their
        strategy and steal Alien X''s omnitrices Notable Attacks/Techniques: As a
        Celestialsapien, Alien X is the most powerful alien that Ben Tennyson has
        encountered, and he has displayed several abilities. The most notable used
        by him throughout the battle are the following: *Teleportation: Alien X through
        the battle teleported faster than anyone can hit him, often showing up behind
        the enemies and surprising them with his attacks *Telekinesis: Alien X used
        Telekinesis to throw around his enemies and several gigantic pieces of land
        and objects. It works via hand gesture or by moving his head as shown against
        Rath from a distance and can slam opponents and has shown thought based telekinesis
        just by looking at Max, crushing them on the ground as shown against ampfibian.
        *Energy Projection: Alien X is capable of shooting green energy beams from
        his eyes and hands Note: Despite being a pure Celestialsapien, which would
        make him superior to Alien V, who is a hybrid, Alien X was also unlocked due
        to an error in the Omnitrix hence being an incomplete transformation. Alien
        X during his fight with several Ben Tennysons across the alternate dimensions,
        in the end gave up and proceeded to explain his actions for going rogue and
        killing Ben Tennysons across several dimensions as he did not want them to
        suffer the same fate he did when he lost his grandfather in front of him by
        the hands of Vilgax, after which he submitted himself to Maximilian Tennyson
        (an alternate timeline plumber/intergalactic police officer) in hopes of starting
        a better life. Alien X considers Granpda Max in every Ben 10 Reboot timeline
        to be "Ben''s real strength and his biggest weakness". Prior to his submission,
        he was holding his own against several alternate timeline Ben Tennysons and
        giving them a very tough time in combat. Although whether he has separate
        personalities like classic Alien X is unknown, but there are strong indications,
        as he does refer to himself as "we are infinite" and "now it is our turn".
        It''s implied that Alien X gets stronger with the amount of Omnitrixes. He
        gained 11 Omnitrices throughout the moive which he has on his body, which
        could be a possible explanation for him losing to four arms after he lost
        all the Omnitrices, despite dominating several Bens in combat prior when amped.
