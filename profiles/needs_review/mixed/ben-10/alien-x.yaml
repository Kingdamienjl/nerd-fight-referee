    - field: weaknesses
      value: 'Though he has mastered multiple personalities, Ben still needs to confront
        them. Vulnerable to life absorption, though the person who absorbs his power
        may gain multiple personalities. Punished if the Multiversal Preservation
        Act is broken. Feats: * Survived the destruction of the universe, which contains
        many space-time dimensions, by the Annihilargh. * Recreated the universe in
        near perfect detail with a thought. * Defeated the Galactic Gladiator, another
        Celestialsapien, in a Tetramand Trial of Combat arena battle by creating a
        galaxy-sized black hole. * Breached the a forcefield said to be impossible
        to breach by Contumelia, 5th dimensional beings, which was withholding the
        energy from an Annihilargh creating a universe in a void of nothingness. *
        Celestialsapiens are stated many times to be the strongest species in Ben
        10. Notes: # The Forge of Creation exists outside of the main Omniverse, so
        affecting the "entire" omniverse may not be referring to it, though it could
        be based on context. For example, complete space-time destruction would not
        include the Forge, but complete Omniversal destruction might. # Dimensional
        tiering in Ben 10 is unquantifiable apart from a few vague statements, so
        Tier 1 is purely tentative. Furthermore, the Contumelia field may not be protecting
        Contumelia, but the rest of the ship and the other ship''s inhabitants. #
        There is nothing to suggest Atomic-X is close to Alien X in power, as is with
        other Biomnitrix fusions which have consistently shown to be weaker. For further
        context, if Ben 10K was aware of the time bomb, he would know Atomic-X was
        not the solution and could have used a Clockwork fusion. # Though both Atomix
        and Gwen are described as the "greatest powers," Alien X does not exist only
        in one dimension or entirely inside the omnitrix, so those statements do not
        contradict Alien X being the greatest power. # Many of Alien X''s anti-feat
        statements are directly contradicted or have shaky points, therefore statements
        I choose to use for scaling have little contradiction and/or are used to explain
        in-show events. # Please ask for my permission to edit this page if desired.
