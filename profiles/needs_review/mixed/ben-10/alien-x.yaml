- id: claim-weaknesses-e6aa0129
  section: weaknesses
  axis: weakness
  text: "Alien X needs to wait for both of his main personalities, Serena and Bellicus,\
    \ to make decisions before he can take action. It's worth noting that they act\
    \ swiftly, without discussing the method, as long as they both agree, though this\
    \ weakness disappeared in Omniverse series. Other members of his species will\
    \ punish him if he violates the Multiverse Preservation Act. He is susceptible\
    \ to energy and life absorption. Feats: *Alien X was able to use his reality warping\
    \ powers and reverse the flood. *Recreated \"The Universe\" with a thought.Ben\
    \ 10: Omniverse, \"So Long, and Thanks for All the Smoothies\" *Mind-controlled\
    \ the Amalgam kids and Rooters which includes (Manny, Helen, Alan, Swift, Leander\
    \ and Phil) *Defeated the Galactic Gladiator in a Tetramand Trial of Combat arena\
    \ battle by creating a galaxy-sized black hole.Ben 10: Omniverse Episode 58 -\
    \ Universe vs. Tennyson *During his fight with the Galactic Gladiator, Alien X\
    \ casually destroyed planets by flying into them. *Survived the destruction of\
    \ \"the universe\" that was caused by the Annihilarrgh. Notes: *Ben Tennyson cannot\
    \ time out as Alien X *Standard Battle Assumptions (SBA) grant characters a \"\
    willingness to win\" and cause them to perceive their opponent as an enemy. Consequently,\
    \ all three of Alien X's personalities are considered functional for matches.\
    \ However, due to the conflicting temperaments of Ben and Serena/Bellicus, their\
    \ specific actions could be interpreted as unpredictable, ranging from Serena\
    \ and Bellicus overriding Ben (as seen when they agreed to disable the Omnitrix\u2019\
    s function to stop Ben from detransforming) to do the needful or argue eternally\
    \ with Ben after Ben tries to stop them from harming/killing anyone. To avoid\
    \ speculative or unknown actions, Alien X is treated as having full internal cooperation.\
    \ He should be piloted either by Ben in full control (e.g., Ben 10 Omniverse Universe\
    \ vs. Tennyson) or as a Standard Celestial Sapien. Notable Attacks/Techniques:\
    \ AlienXRealityManip.gif|Reality Warping/Time manipulation Axsurviving.gif|Tanking\
    \ the destruction of the entire Universe Alienxrecreating.gif|Recreating the entire\
    \ Universe with a thought Alienxgalaxy.gif|Creating a galaxy-sized black hole/Self\
    \ Duplication bellicus serena.png|Bellicus and Serena (The two personalities of\
    \ Alien X inside his hidden pocket dimension) AXvsrooters.gif|Mind-controlling/Telekinetically\
    \ moving the Rooters and Amalgam kids Alien X is a Celestialsapien. His powers\
    \ are his thoughts, enabling him to warp reality, time, and space with ease, even\
    \ his thoughts can become real. According to the creator of the Omnitrix Azmuth,\
    \ \"Alien X can do anything\". Alien X is capable of effortlessly piercing through\
    \ the Contumelia's extradimensional field as Skurd made a Celestialsapien sword\
    \ to perform this feat, this was considered impossible by Contumelia and Maltruant.\
    \ Celestialsapiens themselves are behind the Universe and art style changes in\
    \ Ben 10 franchise. *Existence Erasure: When team Tennyson visited the Forge of\
    \ Creation, It was learned that Celestialsapiens knew about their existence and\
    \ could wipe them as Kevin stated: \"They could just blink and we'd be gone\"\
    . *Body Puppetry Alien X made the Amalgam Kids fight each other. *Telekinesis:\
    \ Alien X used telekinesis to target and throw Amalgam kids. *Duplication: Alien\
    \ X can make several duplicates of himself and used them to attack the Galactic\
    \ Gladiator. *Black Hole Creation: Alien x created a Black Hole to beat Galactic\
    \ Gladiator. *Attack Reflection: Reflected the attack of Leander, Able to oppose\
    \ Psyphon's attack. ==Gallery== Ben 10 Omniverse - Alien X recreates the universe\
    \ Ben 10 Omniverse- Alien X VS Galactic Gladiator Omniverse- Kevin Joins Servantis\
    \ - Ben 10 - Cartoon Network ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ ==References== {{Scroll box|content={{Reflist|2}}}} ==Notes/Explanations== {{Scroll\
