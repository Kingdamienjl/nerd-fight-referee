    - field: weaknesses
      value: "Alien X needs to wait for both of his main personalities, Serena and\
        \ Bellicus, to make decisions before he can take action. It's worth noting\
        \ that they act swiftly, without discussing the method, as long as they both\
        \ agree, though this weakness disappeared in Omniverse series. Other members\
        \ of his species will punish him if he violates the Multiverse Preservation\
        \ Act. He is susceptible to energy and life absorption. Feats: *Alien X was\
        \ able to use his reality warping powers and reverse the flood. *Recreated\
        \ \"The Universe\" with a thought.Ben 10: Omniverse, \"So Long, and Thanks\
        \ for All the Smoothies\" *Mind-controlled the Amalgam kids and Rooters which\
        \ includes (Manny, Helen, Alan, Swift, Leander and Phil) *Defeated the Galactic\
        \ Gladiator in a Tetramand Trial of Combat arena battle by creating a galaxy-sized\
        \ black hole.Ben 10: Omniverse Episode 58 - Universe vs. Tennyson *During\
        \ his fight with the Galactic Gladiator, Alien X casually destroyed planets\
        \ by flying into them. *Survived the destruction of \"the universe\" that\
        \ was caused by the Annihilarrgh. Notes: *Ben Tennyson cannot time out as\
        \ Alien X *Standard Battle Assumptions (SBA) grant characters a \"willingness\
        \ to win\" and cause them to perceive their opponent as an enemy. Consequently,\
        \ all three of Alien X's personalities are considered functional for matches.\
        \ However, due to the conflicting temperaments of Ben and Serena/Bellicus,\
