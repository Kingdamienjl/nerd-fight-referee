    - field: weaknesses
      value: 'Magic and Manna attacks are useless against a focused Geochelone Aerio
        like Terraspin, its unknown wheter the same would work against anyone who''s
        resistant to Magic, life force or type 2 abstract energy, but always worth
        a discussion. Charmcaster is mentally semi-atable, It can either be her advantage
        for her to fight more aggresively and with her stronger power, but could also
        likely break her down like for example Azula from Avatar in her final Agni
        Kai, It was also a disatdvantage like when she got cocky in the alternate
        timeline and got beaten by Gwen even tho she can and did kill her, and when
        she was tricked by Ben into kicking herself into her own bag. Notable Attacks/Techniques:
        * Adficio potentia: It is a spell that allows the caster to shoot multiple
        beams of mana from their hands. Potentia means "power" in Latin. * Necte artes
        magicas: It is a spell that conjures mana handcuffs on its target''s arms
        * Abrogo necterendum: Can remove magic handcuffs. Ambrogo means "remove" in
        Latin. * Amplus Mica: It is a spell that allows the caster to expel a magical
        powder. Whatever the powder touches becomes a pile of flowers. Amplus means
        "large" and mica means "grain" in Latin * Cabals And Stratagens, Flots And
        Floys. Powerful Sorcerers Turned Into Toys. The Ancient, The Classic, Once
        Proud But Now Tragic. Come Bring Me The Soul Of The Father Of Magic. I Summon
        The Mighty Bezel!: A spell use to summon master of magic Bezel, He is the
        most powerful sorcerer of all time. He was changed by Charmcaster into a totem
        and put in her bag after which she uses his powers to boost hers. * Declam
        Baccura: It is a spell that allows the caster to load objects or move things
        telekinetically * Effervo: It is a spell that a caster can use to manipulate
        any flower and propel to a speed so fast that can cut through tough objects
        such as stone. * Eradico: It is a spell which releases several energy beams
        from the caster''s hand and encases the opponent in a large sphere of mana
        or destroys them with an internal explosion. Charmcaster''s use of this spell
        was different. When she used it the stone monster started to crack, then it
        exploded, while Gwen creates beams which creates a big mana sphere around
        the target. Eradiko is Latin for "to root out, destroy, obliterate, to get
        rid of".Platnica Sorensae: It is a spell that reanimates dead squids * Perturbo:
        It is a group spell that allows its two users to combine their energy to create
        a bridge * Reptilicus: It is a spell that changes a staff into a snake. "Reptilicus"
        means "snake" in Latin * Saduuca: Uses it to control any weapons nearby.''
        * Transfera Identica: It is a spell that swaps the bodies of two targets *
