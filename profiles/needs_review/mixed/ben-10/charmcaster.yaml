    - field: attack_potency
      value: "VariesMana and Magic spell output is not fixed and each spell is fueled\
        \ with a different amount of energy depending on spellcaster\u2019s subconscious\
        \ emotions, willpower, intent, and objective at the moment. While the canon\
        \ statement regarding subconcious triggers was originally made in reference\
        \ to the Charms of Bezel, this rule clearly applies to her magic in general.\
        \ Not only the pop-up appeared while casting a spell, but this universal application\
        \ is consistently proven throughout the series, as Gwen's power is shown to\
        \ be significantly stronger when she is deeply motivated, yet noticeably weaker\
        \ when she is emotionally indifferent. Additionally, she frequently holds\
        \ back to avoid excessive collateral damage or seriously harming opponents.\
        \ Her magic is directly tied to her mental state and the surrounding mana\
        \ available in the environment, meaning she can naturally produce far greater\
        \ power in areas rich with life and energy like forests than in artificial\
        \ urban settings with less ambient mana. Because her spells are circumstance-dependent\
        \ rather than mechanically constant, not every attack is performed with the\
        \ same level of power, creating a completely valid in-universe explanation\
        \ for why Gwen\u2019s power level fluctuates so heavily throughout the series.\
        \ (Magic users' power depends on their emotions, intentions, and it's power\
        \ can be leved by the user So not every single magic attack is equally powerfull\
        \ even tho they come from the same source]), up to Brown Dwarf level+ with\
        \ Magic (Had an even beam clash with young Gwen3.40 Quettatons, and should\
        \ be more skilled than her since she has more experience. Was about to absorb\
        \ all of Charms of Bezel and betrayed Hex, and should be comparable to him),\
        \ can ignore with Magic (Via varies mentioned in powers and abilities) | Varies,\
        \ up to Multi-Solar System level2.488975379 Exafoe, possibly Low Complex Multiverse\
        \ level5-D (Constantly comparable to Gwen, once even absorbed all of her power,\
        \ even killing her in a alternate timeline, she one shotted Ghostfreak and\
        \ kept up with more experienced Semi-Anodite Gwen, with enough rage she could\
        \ no sell Hex's blast who was at his library, she one shotted Addwaitya, Darkstar,\
        \ Hex and Bezel, and then absorbed their power, bullied Blossomed Swampfire,\
        \ with Conceptual Manipulation Mana users can control over a true name of\
        \ thing itself, which influence and reshape reality. When a being\u2019s true\
        \ name is altered, every documented account of that being, whether written\
        \ or digital, is changed as well. Mana users can write word/rune of things\
        \ that hold the literal power of things itself, as well should be superior\
        \ to creator of Book of Archamada which can create spells by writing them\
        \ down with no rules), can ignore with Magic (Via varies mentioned in powers\
        \ and abilities) | Varies, up to Low Complex Multiverse level, possibly Outerverse\
        \ levelThe Greater Universe in Ultimate Alien and Omniverse (Charmcaster in\
        \ base has a wide variety of standard equipment and boosts during that era,\
        \ while in Legerdomain she's boosted enough to hurt Addwaitya, who possessed\
        \ the Alpha Rune at the time. She killed and absorbed the souls/Mana of every\
        \ being in Legerdomain, which contains all of mana in existence and permeates\
        \ all of nature, and traded it to Dagon. She could kill the Trio and overpower\
        \ Chromastone's Absorption, who can absorb a part of Dagon's essence. She\
        \ possesses the Staff of Ages, which is the strongest magic talisman in the\
        \ nine realms, and can be held only by the ultimate magic user. It is also\
        \ the strongest in Hex's collection, while his library contains artifacts\
        \ and books that make him unbeatable against all magic users and make him\
        \ \"All-Powerful\", and she could still keep up with him. Even without the\
        \ Alpha Rune, she has complete power over Legerdomain and manipulates it.\
        \ She can do anything with it by knowing its true name, and can also shake\
        \ the entire dimension with her scream. Later, in Omniverse, she became the\
        \ strongest sorceress in existence, and absorbed all of the power of the strongest\
        \ magicians in the verse: Hex, Gwen, Michael, Addwaitya, and Bezel. Bezel\
        \ is the greatest manipulator of mana ever known and holds no rules over magic,\
        \ making his magic skills at least comparable to Anodites and Dagon. He also\
        \ created charms of Bezel which can alter reality, absolutely annihilated\
        \ Darkstar, and is constantly stated by the team to be unbeatable), Outerverse\
        \ level with Alpha Rune (It is the secret true name of magic itself, embodying\
        \ and governing mana as a fundamental concept that permeates all of nature\
        \ and encompasses the true names of everything, including space and time,\
        \ granting them their essence and allowing them to exist independently, making\
        \ mana a concept not bound by space or time but one that underlies and defines\
        \ them; as its origin and regulator, the Alpha Rune acts as the core sigil\
        \ stabilizing Legerdomain, a realm composed entirely of mana with its own\
        \ flow of time and distinct physical laws, from which all magi"
