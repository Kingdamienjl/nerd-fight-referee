        \ positions of both Vilgax and the Forever Knights) * Extroadinary Genius\
        \ Intelligence ** Social Influencing (Deception, she tricked Hex into believing\
        \ she misses him and wants to return to their family relationship, Charisma,\
        \ Seduced Kevin which let her manipulate his mind) * Magic and Mana Manipulation\
        \ (Gwen's magical powers are of alien descent from her grandmother Verdona,\
        \ a member of a free-spirited alien race of pure energy beings known as Anodites,\
        \ from the planet Anodyne. Though she technically did not inherit these powers,\
        \ she shares a \"knack\" for manna manipulation, referred to by Verdona as\
        \ \"the spark\". This is possibly because Verdona manipulated manna in her\
        \ human form. Gwen's powers are enhanced when she is given an excess of manna,\
