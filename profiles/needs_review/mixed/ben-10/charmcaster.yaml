      value: "Base= * Superhuman Characteristics and Physiology ** Enhanced Senses\
        \ (sensed The Trio from a far distance, possibly Neutral Vision - Should be\
        \ comparable to Gwen'sdad, who is able to see Verdona in her invisible form.\
        \ Enhanced Awareness - Gwen sensed Ben and Kevin's presence even without her\
        \ powers, detected DNAliens hideout by locking onto their life energy signature\
        \ on the gun they left. Vision [Soul & Neutral Vision] & Mind/Aura Reading\
        \ - She can sense other's aura to see wheter they're lying or not) ** Enhanced\
        \ Extrasensory Perception & Cosmic Awareness (1-A Detection and Awareness;\
        \ Mana users can detect someone's mana as a form of dowsing, allowing them\
        \ to track them down by either following their mana trail, detecting residual\
        \ mana left on their belongings, or by becoming \u201Cattuned to the cosmic\
        \ mana\u201D. Sensing a mana also grants the user awareness of what the tracked\
        \ person is doing at that very moment. Dowsing can even be used to identify\
        \ someone, as demonstrated with Dr. Victor Valadis. Dimensional, Telescopic,\
        \ X-Ray, Neutral, Soul, Multiple Vision; Users can use Mana Sensor to see\
        \ invisible beings and dimension, invisible mana, behind walls, great distances,\
        \ and many different places at once. Technology Detection; By exploiting the\
        \ incompatibility between mana and high-tech machines, the users can send\
        \ out a wave of manna to intentionally disrupt a nearby piece of high-tech\
        \ machinery) *** Irrelevant perception and reaction speed (Mana sensor need\
        \ to travel a physical distance when searching for something, as shown here.\
        \ Can search the entire universe in few second) *** Clairvoyance (Enhanced\
        \ Sight; Mana users can detect someone's mana as a form of dowsing, allowing\
        \ them to track them down. Psychic Navigation; Mana users can find out someone's\
        \ location by making a small ball which shown for them a mental map of the\
        \ surrounding area and the area's contents. Visual Linking; Mana users can\
        \ know someone's location by connecting their mind with him. Mana users can\
        \ link their minds with another person's mind, allowing them to see the past\
        \ of this person and track him.) *** Psychometry (Mana sensor can analysed\
        \ the entire area instantly and found everyone who were present there instantly)\
        \ *** Telepathy (1 Layer; Mana user can use telepathy to connect with other\
        \ beings. Mana users, like Gwen can read and see Kevin's memories, who can\
        \ resist Servantis' mind reading.) *** Perception Manipulation, Mind Manipulation,\
        \ Hive Mind (Type 2; Mana users can share their mind with other beings, allowing\
        \ them to see and track the person who shared their mind. Mana users can link\
        \ their minds with another person's mind, allowing them to see the memories\
        \ of the person they are linked to.) *** Self-Perception Manipulation (Mana\
        \ user can enhance their vision, as shown here and here.) *** Information\
        \ Analysis (1 Layer; Mana users can read aura to know a lot of things about\
        \ him, like how he works, if he's lying, or if he's evil and dangerous. Mana\
        \ users can use Mana Sensor to know if there anyone was affected by spells,\
        \ mind control, or something else. It seen in \"Ultimate Aggregor\", Users\
        \ can read NRG's suit, which it seen before can resist Mana Sensor.) * Instinctive\
