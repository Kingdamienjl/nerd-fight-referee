- id: claim-weaknesses-19e8dc6b
  section: weaknesses
  axis: weakness
  text: 'Charmcaster was unable to resist Ben when he was in the form of Cannonbolt
    as she has slower speed compared to Ben''s tougher alien forms such as Swampfire.
    Her staff can bring objects to life or momentarily control them, but this backfired
    one time during her fight with Kevin) Feats: *In Original, She switched the bodies
    of Gwen with herself *In Alien Force, She was able to seduce Kevin and stole Gwen''s
    powers *In Ultimate Alien, Charmcaster killed Ben, Gwen and Kevin and used their
    souls to bring her deceased father back (Using Alpha Rune''s Powers) *In Omniverse,
    She took revenge on her enemies and turned them into stone statues Notable Attacks/Techniques:
    MANA Blast.gif|Mana blast AbsorptionCaster.gif|Absorption ForcefieldCaster.gif|Forcefield
    *Adficio potentia: It is a spell that allows the caster to shoot multiple beams
    of mana from their hands. Potentia means "power" in Latin. *Necte artes magicas:
    It is a spell that conjures mana handcuffs on its target''s arms. *Abrogo necterendum:
    Can remove magic handcuffs. Ambrogo means "remove" in Latin. *Amplus Mica: It
    is a spell that allows the caster to expel a magical powder. Whatever the powder
    touches becomes a pile of flowers. Amplus means "large" and mica means "grain"
    in Latin. *Cabals And Stratagens, Flots And Floys. Powerful Sorcerers Turned Into
    Toys. The Ancient, The Classic, Once Proud But Now Tragic. Come Bring Me The Soul
    Of The Father Of Magic. I Summon The Mighty Bezel!: A spell use to summon master
    of magic Bezel, He is the most powerful sorcerer of all time. He was changed by
    Charmcaster into a totem and put in her bag after which she uses his powers to
    boost hers. *Declam Baccura: It is a spell that allows the caster to load objects
    or move things telekinetically. *Effervo: It is a spell that a caster can use
    to manipulate any flower and propel to a speed so fast that can cut through tough
    objects such as stone. *Eradico: It is a spell which releases several energy beams
    from the caster''s hand and encases the opponent in a large sphere of mana or
    destroys them with an internal explosion. Charmcaster''s use of this spell was
    different. When she used it the stone monster started to crack, then it exploded,
    while Gwen creates beams which creates a big mana sphere around the target. Eradiko
    is Latin for "to root out, destroy, obliterate, to get rid of". *Exciase: To put
    a forcefield around the enemies. *Exige animas omnibus: It is a spell that removes
    the soul from a target. It can be used on multiple targets with the help of a
    large machine. *Falloon Quarca Daminigan: It is a spell that forces in a doors
    in any building. *Hatrium Securitatum: It is a spell that creates a forcefield
    around a building. *Htrae: It is a spell that open door to Ledgerdomain. *Meus
    Manus Manus: It is a spell that telekinetically summons a staff into its caster''s
    hand. *Notgnihsaw Amikay: It is a spell that vanishes armor off a person. A powdered
    substance is required to cast this spell. *Oktoom: It is a spell that animates
    a car to attack someone. *Oktoom eradico: It is a spell that animates a giant
    sculpture. *Platnica Sorensae: It is a spell that reanimates dead squids. *Perturbo:
    It is a group spell that allows its two users to combine their energy to create
    a bridge. *Reptilicus: It is a spell that changes a staff into a snake. "Reptilicus"
    means "snake" in Latin. *Saduuca: Uses it to control any weapons nearby. *Tempestas:
    It is a spell that conjures a geyser of water. *Transfera Identica: It is a spell
    that swaps the bodies of two targets. *Transformatio Dedyeste: It is a spell that
    creates a circle of mana resembling a shield. Anything that passes through the
    circle is transfigured into flower petals. *Trihant turba cum panis et circensum:
    It is a spell that creates fireworks. *Unsquiera Despariot: It is a spell that
    destroys containment spells. *Vaktusa Magnus Stupritrato: It is a spell that transforms
    its caster into a dragon. *Velieris Mihi. Occultus! Velieris Meus Amicitia. Occultus:
    It is a spell that conjures a domed shield. *Vita: Summons several rock monsters.
    *Vitalis Eruptum: Uses a spell that rapidly grows seeds into vines that attack
    a target. *Ab-ri du-an pad libir digir kun gukin: Used this along with the power
    of Alpha Rune to bring her deceased father back. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== {{Reflist|2}} {{Discussions}} Category:Characters
