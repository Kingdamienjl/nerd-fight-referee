        \ Magic is the manipulation of energy that governs one's whatness. Magic is\
        \ not as difficult as it seems. One can only know the secret true names of\
        \ things. Understandably, magic does not work as well on Earth as it does\
        \ in Legerdomain, the dimension from which all the magic in the universe flows.\
        \ Many species have been confirmed to be able to do Magic. And overall theoretically\
        \ any sapient species can potentially learn to manipulate man"
