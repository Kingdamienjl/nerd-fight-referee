    - field: weaknesses
      value: Any energy, DNA, or powers Aggregor absorbs will dissipate over time
        or through excessive use, so he is required to recharge. This was demonstrated
        by Kevin, who lost his Pyronite and Tetramand attributes after some time.
        Whenever Aggregor absorbs the DNA of other lifeforms, he only gains one-tenth
        of their abilities. Furthermore, absorbing energy or powers causes him to
        become insane. Being drained of the absorbed energy, DNA, or powers will restore
        his sanity, though it leaves him exhausted. Aggregor is vulnerable to electricity,
        such as that generated by an Amperi. Ultimate Aggregor is also vulnerable
        to power absorption, as shown when Ultimate Kevin absorbed and drained his
        powers, leaving him in his human form. == Notes == == Statistic Values ==
