    - field: speed
      value: "**Almost all characters should scale to 2.4868226738722998e16c (Massively\
        \ FTL+) combat and reaction speed, because most characters, including humans\
        \ and non-speedsters, can dodge the Tachyon Cannon after it has been fired.\
        \ This cannon shoots tachyon-based attacks, which are fast enough to travel\
        \ from Earth to the opposite edge of the galaxy in seconds. And most of characters\
        \ should scale to those non-speedsters, who could on numerous instances react\
        \ to, and keep up with speedsters in combat like Kuphulu, Ra'ad, Looma, Dr.\
        \ Viktor, Rojo, and more; Furthermore, semi-speedsters, such as Buzzshock\
        \ or Heatblast should be higher, as demonstrated when Heatblast blitzed Megawatts\
        \ at point-blank range, an entity the main cast can otherwise barely perceive,\
        \ semi-speedsters usually can blitz the main cast, but don't quite reach speedster\
        \ level. Finally, true speedsters should scale to the peak of 2.4868226738722998e16c\
        \ (Massively FTL+) since they are narratively established as the fastest characters\
        \ and scale directly to Feedback, who successfully outspeeded the Tachyon\
        \ Cannon at point-blank range after it fired and performed a backflip. Even\
        \ though non-speedsters can often keep up with them, most often than not they're\
        \ far higher than that, and completely blitz them. **While open to interpretation,\
        \ a compelling case can be made for characters in the franchise possessing\
        \ Immeasurable reaction speed based on several examples: Eon\u2019s beams\
        \ traverse time-warps, connecting separate timeline points and bypassing standard\
        \ linear causality, these attacks, which operate in intermediate dimensions\
        \ between timelines, cannot be measured by normal distance-over-time metrics,\
        \ which XLR8 and Ultimate Swampfire could dodge point blank; the only other\
        \ thing that could traverse it was previously mentioned 5-D Mana, which breached\
        \ the space-time barrier of the Null Void, an inescapable, endless extradimension,\
        \ which previously required an entire mechanized drill powered to destabilize\
        \ the realm just to achieve a similar feat. Because these attacks completely\
        \ ignore the restrictions of linear time, it is highly significant that characters\
        \ like XLR8 dodged them twice after they were fired. In a similar vein , Gravattack\
        \ managed to intercept the Time Beast mid-travel while it was moving, which\
        \ can travel through a hyper-timeline to a point before the concept of time\
        \ even began. Additionally, Big Chill froze the entire endless expanse of\
        \ the Null Void in seconds, and both Big Chill and Fasttrack successfully\
        \ attacked the Esoterica mid-travel or before they could transition between\
        \ dimensions, a process that requires moving through realms desynchronized\
        \ from time and mana. Although all these feats are valid within their respective\
        \ contexts, every character involved is fundamentally a 3-D being, and it\
        \ is physically impossible for a 3-D entity to perceive or dodge an attack\
        \ that transcends 4-D space-time mechanics, leaving these high-end scales\
        \ open to individual interpretation. **Several characters have Immeasurable\
        \ speed for various reasons, Contumelia and Naljians are Immeasurable due\
        \ to their higher dimensional physiology, below I'll mention all the stronest\
        \ characters, and several high tiers have Irrelevant speed for various reasons,\
        \ for details check pages of: Dagon, Professor Paradox, Omnitrix, Chronosapiens,\
        \ Alpha Rune, Annihilarrgh, Breach, Rex, Celestialsapiens and Map of Infinity,\
        \ most noticably for transcending or outspeeding Annihilarrgh which created\
        \ all of time, or Space Beyond and Paradox's plane which is a plane of nothingness.\
        \ **Few characters like Dagon, Dagongax, Breach, and Celestialsapiens are\
        \ Omnipresent for their respective reasons {{!}}-{{!}}"
