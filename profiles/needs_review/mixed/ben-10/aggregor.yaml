        \ Varies, up to High Outerverse level+ with Power Absorption | Multi-Solar\
        \ System level (After absorbing all power from The Andromeda 5, consisting\
        \ of P'andor, Bivalvan, Andreas, Galapagus and Ra'ad, he absorbed the energy\
        \ of the entropy pump, and shown no concern for tanking it, making him this\
        \ strongAP = 13,88616 Petafoe Dura = 25,45796 Petafoe (Water Hazard's and\
        \ Terraspin's durability is far superior to their AP), he absolutely oblitirated\
        \ Humungousaur and then soloed Gwen, Kevin and Max, one shotted Addwaitya,\
        \ who took no damage from Ultimate Humungousaur), at least Low Complex Multiverse\
        \ levelAggregor is repeatedly described as having the power to destroy the\
        \ universe, with statements such as being \u201Cbent on destroying the universe,\u201D\
        \ having \u201Cthe power to destroy the entire known universe,\u201D or being\
        \ \u201Ca being capable of destroying the universe.\u201D Because these claims\
        \ appear multiple times and come from reliable in story sources, it is reasonable\
        \ to accept that after absorbing the combined power of the Andromeda Five,\
        \ Aggregor gains the capability to destroy the universe. However, this does\
        \ not necessarily mean that his normal attacks scale to this. The statements\
        \ only confirm that he has the potential to destroy the universe, while the\
        \ series never shows the method or specific attack through which this would\
        \ happen. In actual fights, all of Aggregor\u2019s demonstrated attacks are\
        \ grounded, and none of them display universal scale, and it's not just AP\u2260\
        DC, there's no proof he induced that much attack potency in his normal attacks.\
        \ This suggests that the statements refer to a latent or maximum potential\
        \ rather than the power behind every attack he uses in battle. Because of\
        \ that, scaling other characters to the universe simply because they fight\
        \ or damage Aggregor would be logically flawed, since it assumes that harming\
        \ him requires matching a level of power he has never visibly used in combat.\
        \ It would also conflict with the much smaller feats consistently shown throughout\
        \ the series. As a result, the only characters who could reasonably scale\
        \ to this potential level are those clearly superior to him or those who directly\
        \ inherit his power, such as Ultimate Kevin after absorbing him, or someone\
        \ indirectly stated to be stronger like Way Big, and even then characters\
        \ who merely fight or injure them should not automatically be considered universal\
        \ since the statement refers to undiscobered capacity. And everything here\
