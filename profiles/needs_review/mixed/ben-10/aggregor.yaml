    aliens without any restriction of their powers thanks to his technology the aliens:
    Absorbed all the powers of Terraspin, NRG, Water Hazard, Armodrillo, and AmpFibian.)
    *Dimensional Travel (with Map of Infinity Capable off travelling to the Forge
    of Creation which is outside "The Universe") |-|Resistance= *Mana *Poison Manipulation
    *Extreme Cold and Cosmic Radiation (Can fly in space)'
  source_ids: *id004
  decisive: true
  status: unverified
