  intelligence:
    text: 'Extraordinary Genius (Gwen, which is considered smart from a young age,
      capable of programming her laptop to search and find a pattern between the locationsBen
      10: Ultimate Alien, "Girl Trouble" and activation times of the Dimension 12
      portalsBen 10: Ultimate Alien, "Girl Trouble" to determine where and when Computron''s
      minions would appearBen 10: Ultimate Alien, "Girl Trouble". In another instance,
      Gwen''s computer smarts are superior to Kevin, considered she can assist Eunice
      in programmingBen 10: Ultimate Alien, "Simian Says" a genetic alteration pulse
      against the Xenocite infestation on AranhascimmiaBen 10: Ultimate Alien, "Simian
      Says". She even can combine her computer expertise with her knowledge of magic,
      as she was able to develop an algorithm to predict the next true name of LegerdomainBen
      10: Ultimate Alien, "Enemy of My Frenemy". Stated to be the brain of team. She
      can solve the calculus question to predict the next location of Dagon''s teleporting
      shrine in 30 secondsBen 10: Ultimate Alien, "A Knight to Remember". When she
      was kid, she had a 4.2 GPABen 10, "Ghostfreaked Out". She always trying to think
      ahead and calculate the consequences, even as the voice of reason in team. She
      devised a plan to stop the MegawattsBen 10, "Tourist Trap" by using the world''s
      largest thermometer as a lightning rod to ground themBen 10, "Tourist Trap".
      And when they were fighting against the storm monster, Gwen was able to devise
      a plan to stop him by making Heatblast reach supernova-level heat in order to
      evaporate the entire beingBen 10, "Monster Weather". When they were trapped
      in the Omnitrix and didn''t know about it, she was able to know that they had
      teleported into another universeBen 10: Destroy All Aliens and understand how
      it workedBen 10: Destroy All Aliens. She reads a lot of Mystery books, so she
      knows how to look for clues. Gwen is much smarter and technically gifted than
      Ben, especially with computers. She has great gymnastics and martial arts skills)'
    source_ids: *id002
    confidence: 0.8
