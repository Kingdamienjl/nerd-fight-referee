        \ her bend the fate to her favour), Varies with Magic and Mana attacks (Her\
        \ power is dependent on subconciouss emotions, the area, and spell's dedicationMana\
        \ and Magic spell output is not fixed and each spell is fueled with a different\
        \ amount of energy depending on Gwen\u2019s subconscious emotions, willpower,\
        \ intent, and objective at the moment. While the canon statement regarding\
        \ subconcious triggers was originally made in reference to the Charms of Bezel,\
        \ this rule clearly applies to her magic in general. Not only the pop-up appeared\
        \ while casting a spell, but this universal application is consistently proven\
        \ throughout the series, as Gwen's power is shown to be significantly stronger\
        \ when she is deeply motivated, yet noticeably weaker when she is emotionally\
        \ indifferent. Additionally, she frequently holds back to avoid excessive\
        \ collateral damage or seriously harming opponents. Her magic is directly\
        \ tied to her mental state and the surrounding mana available in the environment,\
        \ meaning she can naturally produce far greater power in areas rich with life\
        \ and energy like forests than in artificial urban settings with less ambient\
        \ mana. Because her spells are circumstance-dependent rather than mechanically\
