    - field: powers_and_abilities
      value: "Base= * Superhuman Characteristics and Physiology * Acrobatics (Hypermobility;\
        \ She has enhanced reflexes, allowing her to dodge attacks with ease. She\
        \ is highly acrobatic, able to execute a backward somersault in mid-air. All-Terrain\
        \ Mobility - Gwen can synchronize her martial arts with her mana manipulation\
        \ abilities. Able to dodging multiple lasers in air. Self-Momentum - She can\
        \ jump high in the air. She can jump and dodge far above normal humans and\
        \ catch him. She can jumping from one high-building to another. Able to do\
        \ a backflip twice) * Weapon Mastery (Expert in various types of weapons like\
        \ Sumo Bow, Mana blade, Shuriken and DNA repair Gun) * Stealth Mastery (While\
        \ keeping her hero identity a Lucky Girl, she often demonstrated a high level\
        \ of stealth, even managing to hide in Hex's library without him knowing,\
        \ and she can sneak behind enemies) * Greatly Expert Martial Artist (She is\
        \ a capable gymnast and martial artist. She has black belt on Judo. She effortlessly\
        \ beat up at least four aliens. She can synchronize her martial arts with\
        \ her mana manipulation abilities. She is expert martial artist. She stated\
        \ that she has three years of cotillion experience and nine years of judo\
        \ experience) * Immortality (Type 1; Anodites are technically biologically\
        \ immortal, as she is able to manipulate her crafted body's age at will, and\
        \ Verdona comment on how she supposed in \"human time\" she hadn't seen her\
        \ son in a while further hinted at her race's extended lifespan), * Extroadinary\
        \ Genius Intelligence (Wrote a spell that uses a predictive decryption algorithm\
        \ on the computer to figure out the true name of Legerdomain before it changes.\
        \ She can solve the calculus question to predict the next location of Dagon's\
        \ teleporting shrine in 30 seconds) ** Preparation (Education - Gwen was able\
        \ to invent a technique can use with mana abilities after she was inspired\
        \ by the idea from old movie.) * Magic and Mana Manipulation (Gwen's magical\
        \ powers are of alien descent from her grandmother Verdona, a member of a\
        \ free-spirited alien race of pure energy beings known as Anodites, from the\
        \ planet Anodyne. Though she technically did not inherit these powers, she\
        \ shares a \"knack\" for manna manipulation, referred to by Verdona as \"\
        the spark\". This is possibly because Verdona manipulated manna in her human\
        \ form. Gwen's powers are enhanced when she is given an excess of manna, such\
        \ as in Legerdomain. Mana is life energy present in all that lives, it's the\
        \ substance of magic itself, which permaetes through out all of nature. Magic\
        \ is the manipulation of energy that governs one's whatness. Magic is not\
        \ as difficult as it seems. One can only know the secret true names of things.\
        \ Understandably, magic does not work as well on Earth as it does in Legerdomain,\
        \ the dimension from which all the magic in the universe flows. Many species\
        \ have been confirmed to be able to do Magic. And overall theoretically any\
        \ sapient species can potentially learn to manipulate manna through study\
        \ and practice. Anodites, in particular, have a strong innate capacity for\
        \ manipulating manna, and thus by extension magic, in all its forms. If one\
