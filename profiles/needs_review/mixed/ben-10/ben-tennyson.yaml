    - field: intelligence
      value: 'Above Average. (Ben is sometimes childish and cocky, and likes to have
        fun but has defeated many of his enemies by outsmarting them (He was able
        to figure out the Weatherheads'' storm on his own and defeated them and even
        resisted High Override''s possession. Furthermore upon meeting Azmuth Ben
        earned his trust to be a true hero, and even impressed Azmuth by succeeding
        his trial. Ben defeated Hex who is a 10,000 year old magician and was amplified
        by dozens of magic books, Ben''s creativity allowed him to outsmart and defeat
        warlord Vilgax the conqueror of planets throughout the galaxy and was able
        to hold his own against Agent Six who is titled "Sixth deadliest man on the
        planet". Ben has been shown to quickly understand things such as using XLR8
        to figure out that Bug brothers were created from a nuclear experiment and
        after finding out Weatherheads do not have human emotions he used this as
        an advantage against them, Ben also used King Koil''s hypnosis against him.
        Ben is capable of driving his racing cart and has taken part in multiple street
        races. He realized by simply hitting the watch is not gonna solve the issue
        by the end of the series, he learned to use the watch better from the creator
        of the device Azmuth. As he can now use shortcut functions, he used it to
        unlock new aliens such as Goop and Way Big to save the day. He used Diamondhead
        against King Koil since he can only see thermal heat. Alien X who has killed
        alternate timeline who has flat out killed many Ben Tennysons and Gwen, considers
        reboot prime Ben to be far more impressive than the ones he defeated) Feats:
        *Stayed awake for 24 hours. To him justice never sleeps, and he saved the
        day numerous times, dubbing this as Ben 24. *Ben was trapped in a fear dimension
        where is worst nightmare came true to haunt him by the magican Hex, He overcame
        those with his bravery and overcame his fear and defeated Hex. *Defeated Vilgax
        and the Weatherheads at the same time. *Defeated Alien V. *Ben was not hypnotized
        from Zombobo''s hypno machine. *Broke free from the illusion world of Zombozo
        by concentrating enough. *Defeated High Override and overcame his mind control
        (Who was amplified by the entire Fulmini army.) *Resisted King Koil''s Hypnosis.
        *Defeated Steam Smythe multiple times. * Defeated many wrestlers during a
        wrestling tournament and held his own against Iron Kyle. * Ben''s resilience
        to not give up when Earth was being attacked by Vilgax and he was trapped
        in outerspace in a prison dimension, Ben proved the Azmuth the creator of
        the omnitrix he deserves the device and even passed his trail of test, Azmuth
        noted his will to sacrifice teaching him shortcut ability when using Omnitrix.
        Ben then went back to Earth and saved the day.'
      source_id: vsbattles-ben-tennyson-ben-10
      provider_id: vsbattles
      authority: high
      confidence: 0.75
