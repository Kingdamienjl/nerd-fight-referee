    - field: powers_and_abilities
      value: 'Photographic Memory (Ben was able to remember a set of runes in Ledgerdomain
        despite only looking at them once), Superhuman Physical Characteristics, Acrobatics
        (Ben casually dodged attacks from Attea while untransformed), Vehicular Mastery
        (Ben has his own car and can drive presumably as well as Kevin, so much so
        that he offered to teach Gwen how to drive) Biological Manipulation, Shapeshifting
        and Power Mimicry (Can change his dna in order to turn into different species
        of aliens, as well as the DNA of other beings with the DNA Repair function),
        Resurrection Type: Physical via the Omnitrix failsafe (The Omnitrix could
        revive Ben as Diamondhead even after Vilgax killed him), Self-Destruction
        via the Omnitrix self destruct sequence, Duplication via turning into Echo
        Echo and then turning back into a human, Teleportation (The Omnitrix and it''s
        user can be teleported to Primus should Azmuth call them) Reality Warping
        (Ascalon allows it''s user to create whatever universe they imagine), Portal
        Creation (Sir George used Ascalon to create a portal), Superhuman Physical
        Characteristics, Air Manipulation (Ascalon can be used to make whirlwinds),
        Attack Reflection (Can reflect the attacks of Esoterica), Biological Manipulation
        and Power Nullification (Detransformed Ben), Madness Manipulation (Ascalon
        can bring Madness Manipulation to anyone that wields it), Weapon Control (Sir
        George can call Ascalon back to him), Flight with the Hoverboard, Statistics
        Amplification via the Potis Altiare, Time Travel via the Time Cycles Possession
        (Ghostfreak was unable to possess him), Mind Control as Whampire, Biological
        Manipulation (The Omnitrix prevent Ben from being mutated)'
