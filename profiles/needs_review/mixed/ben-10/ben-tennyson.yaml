- id: claim-weaknesses-d4e80eee
  section: weaknesses
  axis: weakness
  text: "All the weaknesses that the Omnitrix has. As a 10-year-old, Ben was very\
    \ immature and could be quite overconfident. While he became more mature and less\
    \ overconfident in Alien Force and Ultimate Alien, this resurfaced in Omniverse.\
    \ Ben is allergic to peanuts and is afraid of peacocks. As a child, he had a fear\
    \ of clowns. Although he got over this, it resurfaced in Omniverse. Feats: *Ben\
    \ with Omnitrix can change the DNA of people throughout the entire galaxy by mixing\
    \ them with random species or altering it. *He can change the DNA of anyone by\
    \ firing a beam from the Omnitrix itself, and can resist being biologically manipulated,\
    \ as an extradimensional deity named Dagon transformed all creatures on Earth\
    \ into Esotericas to worship it, but the Omnitrix protected Ben. *Ben defeated\
    \ Vilgax, who fought Ectonurite/ghost alien army for weeks on his planet tirelessly.\
    \ Yet Ben defeated him and outskilled him in one on one battle. Vilgax is a 200\
    \ year old intergalactic warlord who has \u201CConquered 10 planets and crushed\
    \ heroes of those 10 planets\u201D, even after absorbing the power of 10 different\
    \ heroes from ten different planets and conquering their home world he failed\
    \ to defeat Ben as Ben defeated him using Diamondhead. *Ben led his team and defeated\
    \ Highbreed Alien invasion by changing their DNA on an intergalactic range with\
    \ the Omnitrix. The Highbreed is an alien technologically advanced alien race\
    \ that destroyed planets and conquered a galaxy with their enormous size warships,\
    \ yet Ben with his great thinking alone defeated them. *Ben has defeated geniuses\
    \ such as Dr. Animo, by figuring out his plan in the Null Void. *Ben also has\
    \ a good memory, as he was able to remember magic words to open the gate of Ledgerdomain.\
    \ *Ben resisted mind manipulation from Decoy Queen as he broke out of Hypnosis\
    \ Twice, while as a Nanomech. Notable Attacks/Techniques: *Activate Mode: The\
    \ Omnitrix's default mode, allowing Ben to transform into an alien recorded within\
    \ for 10 to 20 minutes. However, once this time is up, Omnitrix will go into \"\
    Recharge Mode\", locking itself down for a minimum of five minutes in order to\
    \ prevent incorrigible damage to the user's DNA. However, the Omnitrix can instantly\
    \ recharge in the face of sudden, mortal danger in order to protect its wielder.\
    \ *Capture/Scan Mode: When the Omnitrix detects new DNA not present in its records,\
    \ it can copy the DNA of the new sample by making direct contact with the alien\
    \ or by scanning the alien with a visor under the watch's face. *Self-Destruct\
    \ Mode: Ben can order the Omnitrix to destroy itself with the voice command, \"\
    Omnitrix Self Destruct in (time): Command code: 000 - Destruct 0\". After activation,\
    \ the Omnitrix charges energy while counting down until it explodes, with the\
    \ power of the explosion being proportionate to the amount of time spent charging.\
    \ The Omnitrix can gather enough energy in thirty seconds to blast off the arm\
    \ of Vilgax, but can unleash a ripple of energy that can destroy the entire universe\
    \ if allowed to charge for a few days. *Master Control: Under certain circumstances,\
    \ Ben has access to the Omnitrix's Master Code, allowing him to remain transformed\
    \ indefinitely and transform into any alien in the Omnitrix he is aware of with\
    \ a simple thought. *DNA Manipulation: In addition to allowing Ben to take up\
    \ the form of other aliens, the Omnitrix can alter the biological makeup of others\
    \ and repair damaged genetic structures. Ben used this function to cure the severe\
    \ genetic damage caused by Xenocyte parasitism, removing the parasite in the process.\
    \ He later applied the traits of numerous aliens onto the Highbreed in order to\
    \ remedy the genetic stagnation they caused through their own inbreeding. Note:\
    \ This page is about Ben Tennyson as a human with the Omnitrix. His alien transformations\
    \ are in separate profiles shown in the gallery below. ==Gallery== {| class=\"\
    mw-collapsible mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"1\"\
    \ cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align: center;\
    \ background-color: #000000; color: #ffffff\" |Aliens |- | Alien X UAF Render.png|Alien\
    \ X|link=Alien X Ampfibian by piper12345a d49tpgd-pre.png|AmpFibian|link=AmpFibian\
    \ Arctigah22.png|Arctiguana|link=Arctiguana Armodrillo big.png|Armodrillo|link=Armodrillo\
    \ Astrodactyl omniverse.png|Astrodactyl|link=Astrodactyl 5a9449cf9fc609199d0feef9.png|Atomix|link=Atomix\
    \ Ball weevil omniverse official.png|Ball Weevil|link=Ball Weevil Big chill render.png|Big\
    \ Chill|link=Big Chill Blitzwolfer official.png|Blitzwolfer|link=Blitzwolfer 144-1444491\
    \ bloxx-is-the-omnitrixs-dna-sample-of-a.png|Bloxx|link=Bloxx Brainstorm.png|Brainstorm|link=Brainstorm\
    \ Bullfrag (Omniverse).png|Bullfrag|link=Bullfrag Buzzshockinomniverse.png|Buzzshock|link=Buzzshock\
    \ Cannonbolt omniverse poise.PNG.png|Cannonbolt|link=Cannonbolt UltimateAlienChamAlien.png|Chamalien|link=Chamalien\
