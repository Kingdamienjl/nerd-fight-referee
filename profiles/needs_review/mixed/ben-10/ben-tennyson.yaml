    - field: powers_and_abilities
      value: "Explenations == == Notes == 1) Even tho I find all the arguments for\
        \ Immeasurable Reaction speed valid as there's several, all/most of these\
        \ characters are fully bount by 3D existence and have no way of their attacks\
        \ being higher than their existence like Clockwork or Feedback, and can only\
        \ do that occasionaly, so take It as you will, I interpret It as a highball,\
        \ open for suggestions in the comments. 2) BenEon is a transformation Ben\
        \ Prime has never transformed into, he was used by Ben in Race Against Time\
        \ Timeline, which is a different but equally canon and valid timeline, In\
        \ community discussions, BenEon holds the same status as Spitter, since neither\
        \ has been used by Ben Prime. Although it is stated that Spitter was unlocked\
        \ by Teen Ben, and the Chronians were indeed retconned, BenEon is still listed\
        \ as a Chronian on the Wiki. Furthermore, this transformation was the climax\
        \ of the movie, and its events are mentioned in the main canon. This means\
        \ that whether Eon is a Chronian or a human with powers, he is a scannable\
        \ alien and is very likely an existing transformation. 3) The Omnitrix was\
        \ unaffected by the Chronosapien Time Bomb's explosion, whereas every other\
        \ Ben and their Omnitrices were destroyed. The fact that it is now wielded\
        \ by No Watch Ben has no negative impact on it. The Time Bomb destroyed every\
        \ timeline and everything originating from them, except for the present one.\
        \ Following this logic, Ben's clothes and similar items should remain intact,\
        \ as they are not biologically attached to him. 4) Attacks & Techniques mentioned\
        \ only for Prime Ben. 5) Ben's aliens grow 10x stronger every 10 years, these\
        \ two clips explaining it very well. 6) It should be noted that Clockwork's\
        \ powers and Ben's knowledge of how to use him efficiently develop consistently\
        \ over time. From his first appearance in Inspector 13, through Catch a Falling\
        \ Star, The Eggman Cometh, The Ultimate Enemy, Jolts from the Past, and Many\
        \ Happy Returns, Clockwork is consistently treated as a non-combatant and\
        \ a pretty defenseless alien. It isn\u2019t until Ben Again, when Paradox\
        \ shows Ben how to use Clockwork to fix a multiversal crisis, that things\
        \ change. From that point onward, every time Ben uses Clockwork, he treats\
        \ him like the powerhouse he is meant to be. This shows that his growth in\
        \ utilizing Clockwork happens in-universe. Theoretically, this means that\
        \ Ultimate Alien Ben unlocking him didn't mean much initially, as he was likely\
        \ limited only to age acceleration and time retrospection. 7) Ben debated\
        \ with Bellicus and Serena in Universe vs. Tennyson, where they agreed to\
        \ let Ben use Alien X at his whim on exchange for letting them argue in peace\
        \ alone, whcih stays that way as an episode later in Weapon XI Ben turns into\
        \ Alien X and immidietely gains Control and moves freely, Derrick James Wyatt\
        \ said he has now easier time debating with them but not full access, which\
        \ is not true not only becouse he's not a writer and Has no validity & canonicity,\
        \ but Alien X's mindspace happens in real time, so they couldn't possibly\
        \ debate as Ben after immidetaly, and moved freely, and even the slightest\
        \ movement requires an agreement, even a single gesture would have to have\
        \ atleast seconds to approved yet Ben moved his hand to block Leander's blast\
        \ before It reached. 8) Cosmology Page. == Notes == == Statistic Values ==\
