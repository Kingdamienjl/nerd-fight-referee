    - field: weaknesses
      value: 'Ben can often be very arrogant and egotistical, although these traits
        were rectified with UAF and Omniverse. The Omnitrix more often than not gives
        him the wrong alien, however, by the end of the series Ben is able to admit
        that the watch actually does give him the right alien for job even when he
        wants something else. Ben''s hubris often leads to him choosing aliens who
        usually aren''t suited for the situation such as Humungousaur or Four Arms,
        but this was rectified in UAF and Omniverse where Ben tends to try and choose
        more than just the same aliens from time to time Notable Attacks/Techniques:
        |-|Full Battery Mode = right|320px The Omnitrix''s default state, allows the
        user to access the Codon Stream and change their DNA, appearance and abilities
        into that of an alien''s for over 10 minutes. The alien in question is the
        absolute prime of that alien''s species, with the Omnitrix data dumping info
        about the alien into the user''s mind upon transformation, instantly informing
        them on how to use the transformation even if they''ve never used them before.
        The Omnitrix interface is green during this mode |-|Recharge Mode = right|320px
        The state the Omnitrix enters in after the 10 minute time limit is over, this
        function was not present in the Recalibrated Omnitrix and the Ultimatrix,
        as they ran on a more energy based system. The Omnitrix interface is red during
        this mode |-|Capture Mode = right|320px The Omnitrix detects new samples of
        alien DNA and scans them in order to add them to the Omnitrix''s data storage,
        giving the user new transformations in the process. The Omnitrix is interface
        is yellow during this mode |-|Recalibation Mode = right|320px The Omnitrix
        reboots and updates itself after years of not being used, obtaining a new
        appearance, interface and different set of aliens in the process. The Omnitrix
        interface is blue during this mode |-|Self Destruct Mode = right|320px The
        Omnitrix builds up an explosive charge over a certain period of time in order
        to destory itself, this charge can even destroy the entire universe if left
        to build up for several days. The Omnitrix interface is orange during this
        mode |-|Master Control = right|320px Gives the user full control of the Omnitrix
        and all it''s capabilites, such as allowing the user to ignore the time limit
        and remain an alien for as long as they want, and even giving them the option
        to transform just by thinking instead of hitting the dial. |-|Lifeform Lock
        = right|320px Allows for the user to stay as a specific alien for a very long
        period of time, negating the recharge function but not quite having the same
        functionality as the Master Control feature. |-|Universal Translator = right|320px
        Allows for the user to translate any alien languages in the user''s range
        |-|Anti-Death Failsafe = right|320px Prevents the user from dying by turning
        them into the alien needed for that specific situation |-|Anti-Removal Failsafe
        = right|320px The Omnitrix releases an energy feedback to repel anyone trying
        to forcibly remove it from the user''s wrist |-|Artificial'
      source_id: character-stats-profiles-ben-tennyson-ben-10
