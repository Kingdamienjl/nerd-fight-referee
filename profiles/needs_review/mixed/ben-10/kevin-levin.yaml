        be unable to change back to his human form. Absorbing too much energy can
        cause him to become insane. Osmosians when absorbing powers from another being
        only get 1/10th of their powers, requiring special means to gain their full
        power. |-|Transforming Kevin=Kevin needs to focus to shift into another alien
        and the transformation is not instantaneous like Ben's. He can only be Human
        for a few minutes. Multiple shifts can turn Kevin back into human in the middle
        of a fight. Becoming too angry can cause him to mutate and unable to change
        back. |-| Original Series Kevin 11=Is mentally unstable due to absorbing too
        much energy. Is unable to revert back to his human form. Kevin only has 1/10th
        of the aliens powers in this form, requiring to combine them to make up for
        the loss of strength. |-| Omniverse Flashback Kevin 11=Absorbing too much
        power left him mentally unstable. Only has 1/10th of the alien's power in
        this form, however he has more control than before, able to turn back into
        human once he's calmed down. Is weak to Argit's quills. |-|Alien Force and
        Ultimate Alien and Omniverse=Same as his Original Series key. Cannot fully
        armor his body if he has an insufficient amount of his desired material to
