    - field: intelligence
      value: 'Above Average (Kevin is a bully who seems to enjoy causing other people
        misery, taking sadistic joy in inflicting pain and suffering. He is also incredibly
        arrogant, believing himself to be better with the Antitrix than Ben is with
        the Omnitrix despite having had it for a far lesser period of time, and is
        determined to prove this by destroying Ben. Kevin loathed to believe that
        he could need help with anything, which caused him to initially reject Forever
        Knight''s offer of recruitment. He built the Antitrix after Vilgax sent him
        the plan through a tech) Feats: *When Ben Tennyson was stuck in space and
        Vilgax invaded the Earth Vilgax as Bootleg was able to harm him.Ben 10 vs
        the Universe Movie *After merging with Glitch Kevin was able to combat Anti-Vilgax
        who absorbed his Antitrix and became a fusion of multiple mutated aliens and
        fought him for the entire day until Ben returned to Earth from space during
        the end of the film. *Built the Antitrix.This One Goes to 11 *Kevin harmed
        Four arms with various aliens.King of the Castle'
