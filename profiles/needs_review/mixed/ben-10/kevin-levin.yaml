  attack_potency:
    text: Human level physically (Is physically just a child), Varies with Absorption
      (Was kicked out for demolishing his parents' house, caused an arcade machine
      to release all of its coins, exploded a keypad after loading it with electricity,
      after absorbing the electricity from a power outlet, he uses it to turn on and
      force a forklift to ram into a SWAT soldier at full speed, absorbed electricity
      from a light, then used it to power a change in the train tracks, overloaded
      all the lights in a section of a subway by channeling electricity to a train
      track switch, could fire off blasts of energy/electricity that shatter concrete)
      | Varies up to at least Brown Dwarf level, at most Solar System level118.28
      Ronnatons, 104.226 GigaFoe (Can transform into any of the 10 original aliens
      of the omnitrix, including Four Arms and Diamondhead) | At least Brown Dwarf
      level, at most Solar System level (His strength is 1/10th of the combined strength
      of the 10 original aliens of the Omnitrix. Can fight Ben's stronger aliens such
      as Four Arms and Diamondhead. Traded blows with Vilgax albeit he was eventually
      overpowered) Higher when Combining powers (Combining alien powers allows him
      to make up for not having the alien's full power. Combining Stinkfly Goo and
      Heatblast fire allows him to knock back Technorg after all his projectiles failed
      to affect him. Combining Four Arms strength, XLR8 Speed and Diamondhead durability
      allowed him to do "One Mean Punch" which destroyed Technorg metal arm the first
      time and defeated him the second time) | Solar System level (Much stronger than
      his previous mutation, stating "This batch is even better than the last one!".
      Has 1/10th of the combined strength of all 10 additional aliens in the Omnitrix,
      including 11 year-old Way Big, bragged that he could destroy everyone present
      with one upchuck blast), at most higher | Solar System level physically (His
      punch gave Darkstar a black eye, who has survived hits from Echo Echo, Spidermonkey,
      Jetray, and Humungousaur), higher when armored (Fought Diamondhead and broke
      some of his diamond shields, doing it again with negative Diamondhead. Capable
      of fighting Chromastone and Swampfire. Can flinch Ragnarok), even higher with
      certain materials (Kevin can absorb weak materials like wood and strong materials
      like metal and the Sword of Ascalon. Broke Diamondhead's shield with a metal
      construct, but Diamondhead later no sold a strike from his rock construct. Can
      effortlessly cut through NRG's armor with Taydenite armor) | Solar System level
      (Is as strong as he is when armored) | Solar System level+ (Has 1/10th the combined
      strength of the entire active playlist of the Ultimatrix and every Ultimate
      form used so far. Easily defeated Ultimate Aggregor and then absorbed all of
      the power of the Andromeda aliens that Aggregor had absorbed, with him absorbing
      more power later on) | Solar System level (Traded blows with and defeated Swampfire.
      Possesses the power of at least seven physically strong aliens, making him 1.7x
      stronger than his base form), Varies, at most Complex Multiverse level, likely
      Hyperverse level with Energy Absorption (Has Feedback's powers, who contained
      the blast of the Annihilargh, a device created by 5-Dimensional beings known
      as the Contumelia. Kevin has Feedback's powers, but hasn't shown any feats on
      this level6-D, likely 25-D)
