- id: claim-weaknesses-dced3882
  section: weaknesses
  axis: weakness
  text: 'Original Series=Has limits to the amount of energy he can absorb before running
    out. Becoming too angry can make him disfigure his body and he will be unable
    to change back to his human form. Absorbing too much energy can cause him to become
    insane. Osmosians when absorbing powers from another being only get 1/10th of
    their powers, requiring special means to gain their full power. |-|Transforming
    Kevin=Kevin needs to focus to shift into another alien and the transformation
    is not instantaneous like Ben''s. He can only be Human for a few minutes. Multiple
    shifts can turn Kevin back into human in the middle of a fight. Becoming too angry
    can cause him to mutate and unable to change back. |-| Original Series Kevin 11=Is
    mentally unstable due to absorbing too much energy. Is unable to revert back to
    his human form. Kevin only has 1/10th of the aliens powers in this form, requiring
    to combine them to make up for the loss of strength. |-| Omniverse Flashback Kevin
    11=Absorbing too much power left him mentally unstable. Only has 1/10th of the
    alien''s power in this form, however he has more control than before, able to
    turn back into human once he''s calmed down. Is weak to Argit''s quills. |-|Alien
    Force and Ultimate Alien and Omniverse=Same as his Original Series key. Cannot
    fully armor his body if he has an insufficient amount of his desired material
    to absorb. Shown here. This weakness disappears or is less of an issue in Omniverse,
    where he is seen fully armoring himself with small objects. Kevin also has better
    control over his powers in Omniverse. After getting a "Brain Zap" from Servantis''
    he''s able to remain completely sane even after absorbing Ben''s aliens, only
    faking his insanity to trick Servantis''. In Omniverse, Kevin is also able to
    revert back to his human state after he succeeded at breaking Servantis'' mind
    control over the Amalgam Kids. |-|Mutant State (Alien Force)=Kevin is incapable
    of absorbing matter in this state, so he is unable to become stronger via absorbing
    stronger materials. Otherwise, none notable. |-|Ultimate Kevin=Same as his Original
    Series key. Is mentally unstable due to absorbing too much energy. Aside from
    the power of the Andromeda 5, all the other powers he absorbed are only 1/10th
    of the original. Doesn''t know the full capabilities of his powers as shown Ben
    had to remind him he had Big Chill powers. |-|Omniverse Kevin 11=Kicking his legs
    can send him flying in an undesired direction. He only has 1/10th of the powers
    he absorbed. ==Gallery== Taydenite Kevin.png|Taydenite Kevin File:Kevin break''s
