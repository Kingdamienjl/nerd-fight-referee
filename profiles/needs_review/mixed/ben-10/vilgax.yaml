- id: claim-weaknesses-e57f89a2
  section: weaknesses
  axis: weakness
  text: 'Enhancing his strength causes him great pain. If Vilgax is in his true form
    and becomes too weak, he cannot change back into his humanoid form | None notable
    | With Dagon absorbed, he also gains all his weaknesses | With Malware absorbed,
    he also gains all his weaknesses Note: While it''s true that Vilgax swiftly defeated
    full-sized Humungousaur in his fight with Ben in the Ben 10 Alien force: Vengeance
    of Vilgax, we consider it to be an outlier due to how easily he was defeated by
    Diamondhead moments after, and that he has been shown to be struggling against
    base Humungausaur several times later on in the show. Feats: *In the original
    series, Vilgax cracked one of the heads of Mount Rushmore after boosting his muscles.
    *In Alien Force, Vilgax killed Chromastone with his sword. *In Ultimate Alien,
    Lucubra Vilgax was able to harm Sir George with his new powers. * In Ultimate
