- id: claim-powers-and-abilities-c89df0ee
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= *Superhuman Physical
    Characteristics *Enhanced Senses (Possesses extraordinary sensesThe Official Handbook
    of the Invincible Universe) ** Vision: His vision is superior at night in comparison
    to humans, allowing him to see clearly in near total darkness. His visual acuity
    in normal light allows him to see at 80 feet what most humans can see at 10 feet.
    ** Hearing: His hearing is so sensitive that he can clearly hear changes in acoustic
    pressure of -10 deciBels. Battle Beast can detect the tiniest variances in sound,
    distinguishing differences of as little as one-tenth of a tone. He can hear sounds
    at great distances, four to five times farther away than humans. ** Smell: His
    sense of smell is about 14 times stronger than a human''s. ** Whiskers: His whiskers
    can aid with navigation and sensation and detect very small shifts in air currents
    enabling him to know he is near obstructions without actually seeing them. *Space
    Survival (Can survive in space for long periods of timeInvincible #55/#73) *Bodily
    Weaponry (Conventional; Sharp teeth and claws) *Martial Arts and Weapon Mastery
    (Battle beast is a superbly trained warrior and highly skilled hunter, whose abilities
    have been honed to "the peak of perfection". He has attained nearly unparalleled
    proficiency in the use of all known hand wielded weapons and combat apparatus,
    having mastered all known fighting systems as well as his own unique hand to hand
    and armed combat styles) *Portal Creation (Likely through technological means,
    Battle Beast can create a portal to his spaceshipSkybound X #25 within range)
    *Flight via jetpack (Seen hereInvincible #75) *Telepathy via C.O.P earpiece (Alien
    technology allows him to speak telepathically with others using equivalent technology
    in spaceInvincible #71. Without it, the discussion works only one way) Resistance
    to: *Heat (Withstood atmospheric re-entry unscathedInvincible Vol. 21: Modern
    Family) }}'
  source_ids: *id003
