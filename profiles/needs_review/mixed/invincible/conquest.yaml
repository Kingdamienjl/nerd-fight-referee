        statements from the A - K Handbook of the Invincible universe. Not only is
        the idea that Viltrumites cannot immediately achieve near-light to FTL speeds
        on the atmosphere of a planet without damaging it repeatedly contradicted
        [I.E El Chupacabra dodging electricity which canonically moves at 60,000 miles
        per second, Cho blitzing the Immortal to Antartica before the latter can even
        throw a punch, Mark and Conquest fighting 5 minutes faster than what G.D.A
        satellites can detect, etc etc.], but statements from both issues of the Invincible
        Handbook were not all written by Robert Kirkman, rather a team of multiple
        writers, few of whom are involved with writing for the main run of Invincible.
        While the Handbook is still usable for context and exposition not given elsewhere
        in the series and/or that is not inherently contradicted by the comic's storyline,
        any implication that Viltrumites must first "accelerate" in the vacuum of
        space or require the usage of "space warps" to achieve FTL speeds or travel
        intergalactic distances is an idea not present or shown anywhere to be true
        in the source material for either the comics or TV adaptation of Invincible.
