        and even served as the Oracle for an unknown amount of time, which would require
        her to use her sensing across dozens of kilometers at a time), Damage Boost
        (Via Critical Hits which can double the damage of any given attack), Healing
        (Via Healing Potions), Fire Manipulation (Edna's affinity as a Magi is fire,
        allowing her to produce and manipulate fire in all its forms), Explosion Manipulation
        (Via Flame Strike, which explodes on-contact), Transformation (Pushed to extreme
        emotions that fill her heart with Darkness, Edna will transform to a demonic
        form, however, she can also transform at will with some time, albeit with
        unknown mental effects on herself) As before, but enhanced, plus better Damage
        Boost (Via Fire Empress mode, Edna boosts the damage of her flame by 30%,
        her DoT fire by 50%, and grants her various other boost to damage for skills),
        Limited Transformation/Flight (Via Fire Dash, where Edna transforms into a
        ball of flame and dashes forward), Energy Absorption (Via Energy Leech, which
        leeches energy from the opponent to restore Edna's mana) Same as before, but
        Massively enhanced Fire Manipulation, (Completely immune to her own fire,
        and the fire of others), Statistics Reduction (Can resist attempts to freeze
        her[slow her speed]), Ice Manipulation (Can resist being frozen solid in a
        block of Ice, and as she has natural mana, is immune to being frozen solid
        by Elze's Ice Storms, which can freeze unprotected individuals instantly),
        Extreme Heat (Casually Withstood fighting on an Active Volcano(although she
        was uncomfortable doing so), Completely immune to the heat of her own fire,
        which can easily overwhelm anyone in close proximity to her with heat), Electricity
