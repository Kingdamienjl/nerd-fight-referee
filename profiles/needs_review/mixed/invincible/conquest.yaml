      value: Superhuman Physical Characteristics, Martial Arts (Believed herself to
        be capable of taking on Alaster in unarmed combat, and was directly stated
        to incorporate Martial Arts into her fighting style), Magic, Extrasensory
        Perception/Information Analysis (Edna, as a Magi/Witch, is capable of sensing
