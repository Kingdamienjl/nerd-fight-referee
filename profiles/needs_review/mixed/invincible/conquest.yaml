    - field: weaknesses
      value: 'Conquest is sadomasochistic, he loves battle as well as inflicting pain
        on others, even to the point of requesting opponents to try and resist him.
        The Smart Atoms of Viltrumites cannot withstand high temperatures for long
        periods of time, with prolonged exposure weakening their durability as the
        atomic bonds are ripped apart. He has a sensitive equilibrium in his ears
        that help him maintain flight. This can be exploited with pinpoint high frequency
        sound waves that will cause him intense pain with even higher waves giving
        him hallucinations and can even place him into a coma. As a Viltrumite, he
        is vulnerable to the Scourge Virus, though he eventually recovered, the virus
        severely negated his powers causing him to lose both his right eye and arm
        in the midst of a battle. The Klaxus Plant will poison and weaken him. ==Notable
