    - field: intelligence
      value: 'Gifted generally, very skilled in combat (Led the Viltrum Empire for
        thousands of years and kept it''s stranglehold on the galaxy even with their
        dwindling numbers. After his exile, he set in motion the Viltrumite universal
        conquest again all by himself after conquering Thraxa and producing rapid-aging
        offsprings to build a giant army from the ground up, as well as training them.
        In order to be made regent, Thragg was trained from birth and educated in
        all manners of combat.Invincible #76 Matched combat genius Battle Beast in
        a brutal fight that lasted days until eventually defeating him. Although his
        record also includes major strategic failures such as ordering the Great Purge
        that forced Viltrumites to slaughter one another for days while he remained
        protected, resulting in the deaths of children, scientists and other useful
        members of the species, later claiming the survivors were the strongest when
        many lived by attacking in groups or through less honorable means. He reduced
        rebel planets by large percentages in minutes without examining technology
        that had nearly killed Viltrumites. He ignored repeated advice from Thaedus,
        Kregg regarding Talescria and Nolan about Earth. After the Scourge Virus nearly
        extinguished the race he doubled down on pure violence, having already lost
        valuable minds in the Purge. He murdered scientists to hide that Nolan and
        Mark were the true heirs of Argall, attempted to eliminate them in secret
        and lost the support of his own people when the truth emerged. He created
        the Thraxa hybrid army primarily out of desperation after exile rather than
        careful long-term planning, producing genetically weaker offspring used as
        disposable forces. In the final battle against Mark he allowed the fight to
        continue into the Sun, relying on pride and brute strength until he was consumed
        by it.)'
      source_id: vsbattles-thragg-invincible
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'The Smart Atoms of Viltrumites cannot withstand high temperatures for
        long periods of time, with prolonged exposure weakening their durability as
        the atomic bonds are ripped apart. Pinpoint high frequency sound waves can
        disrupt a Viltrumite''s inner ears and highly sensitize equilibrium, disrupting
        their flight, causing intense pain or potentially death. The Scourge Virus
        is a specially engineered virus that infects Viltrumites and severely hampers
        their strength and invulnerability, usually resulting in death. The Klaxus
        Plant will poison and weaken the species. ==Gallery== Thragg Vol 1 129.webp|Aura
