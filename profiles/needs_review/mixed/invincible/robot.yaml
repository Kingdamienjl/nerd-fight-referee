    - field: weaknesses
      value: Although Robot possesses great intelligence, he appears to struggle with
        social signals, like when he nonchalantly disclosed to the Guardians the unethical
        way he obtained his cloned body or his failure to grasp Amanda's perspective
        in their relationship. However, it was later shown that Robot has learned
        to share himself in more meaningful ways, Robot started performing hero duties
        in the field instead of the safe distance his original self had previously
        kept. This placed him in a tough spot since he had rarely had to concern himself
        with risking his own life previously, and his experience as a hero at that
        moment felt similar to a video game. Hence, Robot was unfamiliar with the
        sensation of fear and was unsure how to manage it adequately. This interfered
