    - field: intelligence
      value: "General= At least Average (Possesses high school level education) |-|Combat=\
        \ At least Gifted (Has fought on par with and come out on top against several\
        \ different Viltrumites, which are a race of aliens possessing thousands of\
        \ years of combat experience, proficiency in martial arts techniques and melee\
        \ weapon usage, and have ample experience fighting as well as overtaking various\
        \ different alien civilizations, including Thragg, who in turn matched Battle\
        \ Beast. He also demonstrates the ability to learn and adapt his approach\
        \ during high-pressure battles. This skill eventually allows him to overcome\
        \ other Viltrumite warriors, like Conquest, by using his arrogance and predictability\
        \ against him, he stops holding back and eventually choking him to death.\
        \ While his brawling style made him a reckless but effective fighter, he later\
        \ grows to become a competent commander who leads the Combined Coalition forces\
        \ to victory against Thragg\u2019s ranks and manages to outmaneuver alien\
        \ diplomats. Yet, despite his tactical brilliance, Mark\u2019s tactical prowess\
        \ is often undermined by his rash decisions and overall lack of emotional\
        \ control. He is manipulated by Cecil Stedman more than once, becomes a victim\
        \ of Robot\u2019s scheme, and is constantly in danger of his moral fiber being\
        \ compromised due to his adherence to his personal code, such as when he allowed\
        \ Angstrom Levy and later Dinosaurus to live, with disastrous consequences\
        \ for Earth\u2019s security)"
