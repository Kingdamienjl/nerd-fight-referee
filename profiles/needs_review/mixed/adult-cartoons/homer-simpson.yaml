- id: claim-weaknesses-ca3987de
  section: weaknesses
  axis: weakness
  text: 'Homer is incredibly lazy and extremely unhealthy, being consistently portrayed
    as a binge drinking, overeating, accident-prone daredevil who will blatantly refuse
    healthy foods such as oatmeal and fruit in favor of fatty meals. His physical
    abilities and skills tend to vary greatly; at times, he is too weak to even kill
    a fly by punching it and can find it difficult to run to the smallest distances
    before passing out from exhaustion. He also has a low IQ of 55, particularly due
    to the crayon lodged in the frontal lobe of his brain as well as many other factors
    which include his alcohol problem, exposure to radioactive waste, and repetitive
    cranial trauma. ==Gallery== 250px-Evolution_of_Homer.jpg|Homer''s design over
    the years c869332ee58c935e7e8e9c4f98c79d7f.jpg HomerStranglesBart.jpg|The first
