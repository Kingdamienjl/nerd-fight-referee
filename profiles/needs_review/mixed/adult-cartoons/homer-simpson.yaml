    especially the first season, and has had many jobs that would require a good resume
    and 188 different jobs within the first 400 episodes. *When he and Bart were imprisoned
    in Japan for a seemingly short amount of time, became experienced in Japanese
    culture, taking part in a kabuki play of the 47 Ronin, hours of origami, flower
    orientation, and meditation, including speaking fluent Japanese and learning the
    secret of inner peace.Season 10, Episode 23: Thirty Minutes over Tokyo *Is surprisingly
    good at naming different dog breeds.Season 28, Episode 22: Dogtown *Seems to be
    knowledgeable of Supreme Court justices.Season 4, Episode 6: Itchy & Scratchy:
    The Movie *After enrolling in a course that taught him strategies for workplace
    success, improved his job as a safety inspector by investigating problems at the
    Springfield Nuclear Power Plant and tricked Mr. Burns into briefly making him
    the CEO by releasing a canary free, who Burns has made the legal owner of the
    plant in order to avoid any consequences of wrongdoing. *A skilled chess savant,
    having learned to play from a master for years to beat his competitive father.
    *Has been able to accomplish things that defy all logic and reason whatsoever,
    such as making cornflakes and milk burst into flames,Season 7, Episode 17: Homer
    the Smithers a lie detector explode with a simple answerSeason 8, Episode 10:
    The Springfield Files and causing a nuclear meltdown in a testing van, despite
    no fissionable materials being present in it at the time. *Has shown to be capable
    of quick-thinking, like when he hot-wired Marge''s car in a moment,Season 10,
    Episode 15: Marge Simpson in: ''Screaming Yellow Honkers'' slipped out of his
    shirt to avoid a detective''s grip,Season 14, Episode 8: The Dad Who Knew Too
    Little used a frozen corpse as a sled to ride down the Murderhorn rather than
    climbing all the way back, and stopped the out-of-control monorail by tying a
    giant "M" to a rope and using it as a makeshift anchor.Season 4, Episode 12: Marge
    vs. the Monorail *Predicted his every move before taking a shot that would make
    him forget the previous 24 hours.Season 19, Episode 9: Eternal Moonshine of the
    Simpson Mind *Predicted the Rapture, convincing God to turn back time and restore
    Moe''s tavern.Season 16, Episode 19: Thank God It''s Doomsday |-|Craftsmanship/Engineering=
    *Handcrafted the Wonder Bat from a single tree branch struck by lightning that
    allowed the Nuclear Power Plant softball team to go unmatched.Season 3, Episode
    17: Homer at the Bat *Created a makeshift bomb out of pop rocks and a fresh soda
    can. *Built a miniature class two plutonium fission reactor that could destroy
    the entire tri-city area, and a fully sentient robot albeit without legs, out
    of scrap parts. *Brewed his own rye, gin, beer, cognac, 12 year old scotch, and
    pina colada in his basement to smuggle through the Springfield prohibition, having
    built a underground pipe system that leads beer hidden in hollow bowling balls
    to Moe''s bar. *Somehow built a fully functioning microbrewery out of Lego bricks.Season
    25, Episode 20: Brick Like Me *Built a suit of bear armor, which was completely
    bullet-proof.Season 15, Episode 5: The Fat and the Furriest *Made a dummy of himself
    so perfect that it not only fooled Mr. Burns, but also earned a promotion to a
    corner office before it proceeded to burn down. |-|Fighting'
