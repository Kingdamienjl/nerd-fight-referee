  intelligence:
    text: 'Genius Although Bart struggles with linear education and usually gets bad
      grades in school due to his ADHD, he is actually incredibly intelligent and
      only acts dumb out of fearing failure,Season 37, Episode 6: Bart ''N'' Frink
      having recurrently shown higher levels of intelligence with his social commentary
      and clever thinking, as well as showing great adaptability and remarkable excellence
      when something genuinely interests him, that allowed him to outperform gifted
      students like Lisa Simpson, Martin Prince, and Kyle Williams, including clown
      schoolSeason 34, Episode 21: Clown v. Board of Education and chemistry, learning
      to transmutate an entire treetop into rock candy, or create a massive school-sized
      explosion of Elephant Toothpaste, all in a short period of time.Season 29, Episode
      10: Haw-Haw Land Bart is a polyglot, learning and adapting to foreign languages
      and cultures in superhumanly short periods of time, once becoming fluent in
      Spanish over the course of a single flight to Brazil,Season 13, Episode 15:
      Blame It on Lisa became fluent in French after only listening to his abusive
      caretakers for 2 monthsSeason 1, Episode 11: The Crepes of Wrath and became
      experienced in Japanese culture, taking part in a kabuki play of the 47 Ronin,
      hours of origami, flower orientation, meditation, including speaking fluent
      Japanese and learning the secret of inner peace.Season 10, Episode 23: Thirty
      Minutes over Tokyo Is fluent in Cantonese,Season 12, Episode 16: Goo Goo Gai
      Pan ItalianSeason 35, Episode 12: Lisa Gets an F1 and Latin.Season 16, Episode
      21: The Father, the Son, and the Holy Guest Star Bart is a skilled combatant
      and fighter, having learned six additional forms of unarmed combat from his
      training at the military academy and aced his firearms training at the same
      time, and passed USAF drone simulations.Season 27, Episode 8: Paths of Glory
      He also learned how to pull off MMA moves from only watching the sportSeason
      21, Episode 3: The Great Wife Hope and pressure point self defense techniques
      from Wayne Slater, a former CIA agent, that allowed him to easily take down
      his bullies with nerve pinches or to torture information out of people.Season
      23, Episode 1: The Falcon and the D''ohman He has also evenly matched Principal
      Skinner in stick on stick combat,Season 18, Episode 3: Please Homer, Don''t
      Hammer ''Em who is a former green beret of the army. He is also a very skilled
      strategist; as mentioned earlier, he recruited and trained a militia. Bart is
      incredibly skilled at manipulation and influencing people, having consistently
      outsmarted Sideshow Bob''s plans by playing on his theatricality and ego to
      let him live long enough for the police to arrive, frequently manipulated his
      mother''s overprotectiveness for his own benefit, manipulated Krabappel and
      Skinner into a multi-day long feud to prolong the school strike,Season 6, Episode
      21: The PTA Disbands created a fake wedding to trick people into leaving free
      giftsSeason 15, Episode 16: The Wandering Juvie and manipulated people into
      rioting at a bank. He also utilized the "Art of War" to trick and bend Homer
      to his will so he could take him to a game convention,Season 29, Episode 15:
      No Good Read Goes Unpunished helped extort a US Senator to get an air traffic
      bill from getting passed,Season 14, Episode 14: Mr. Spritz Goes to Washington
      and successfully evaded and outsmarted the entire FBI under his SeatMiser identity,
      even tricking Lisa into believing he was innocent.Season 37, Episode 8: The
      Day of the Jack-up Bart also has a strong business sense, as shown by the fact
      that he started his own T-shirt shop,Season 16, Episode 5: Fat Man and Little
      Boy an animated web series,Season 13, Episode 18: I Am Furious (Yellow)Season
      21, Episode 14: Angry Dad: The Movie and a casino in his treehouse,Season 5,
      Episode 10: $pringfield (Or, How I Learned to Stop Worrying and Love Legalized
      Gambling) even running a successful business that traded Boblox items into eventually
      real money using a glitch in the game. In many possible futures, he has become
      either a owner of his own custom sports bike shop,Season 27, Episode 9: Barthood
      a demolition worker,Season 6, Episode 19: Lisa''s Wedding or a Supreme Court
      Justice.Season 4, Episode 6: Itchy & Scratchy: The Movie'
    source_ids:
    - vsbattles-bart-simpson-adult-cartoons
    confidence: 0.6
    notes: auto_repair source extraction
