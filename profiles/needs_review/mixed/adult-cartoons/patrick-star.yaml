    \ from an external source, he can be tricked to attack himself. Notable Attacks/Techniques:\
    \ * The Pit Punch: The Pit Punch is a technique where Patrick lifts his arm. A\
    \ green fist forms around Patrick's armpits, and launches. Used in the episode\
    \ Patrick-Man!. * Morning Breath: Patrick inhales deeply and then releases his\
    \ \"morning breath\", which is a stench that is so foul, it causes the opponent\
