  section: abilities
  axis: hax
  text: 'By Himself= *Superhuman Physical Characteristics *Weapon Mastery (has shown
    skill using Rick''s various guns and weaponry) *Vehicular Mastery *Social Influencing
    (Reputation - As the "One True Morty" he can lead Mortys from different realities
    as a united forceRick and Morty Season 1 Episode 10, Close Rick-Counters of the
    Rick Kind. Charisma - He was able to use reverse psychology to make Rick invent
    stuff for himRick and Morty Season 4 Episode 8, The Vat of Acid Episode) *Nanotechnology
    & Transformation (Capable of turning into a carRick and Morty Season 2 Episode
    6, The Ricks Must Be Crazy and a boatRick and Morty Season 7 Episode 6, Rickfending
    Your Mort) *Hacking (Consistently disarms Rick''s Neutrino BombsRick and Morty
    Season 1 Episode 1, PilotRick and Morty Season 3 Episode 4, Vindicators 3: The
    Return of Worldender) Resistances *Fire Manipulation, High Temperatures, Magma
    Manipulation (Survived being covered and drowning in molten lava) *Mind Manipulation,
    Empathic Manipulation (Morty along with Rick were completely and entirely immune
    to the Easter Bunny''s mind control telling them to kiss each other,Rick and Morty
    Season 8 Episode 4, The Last Temptation of Jerry which, while on a lower effect,
    had previously gotten an entire bar to have sex with one another. Morty also was
    immune to this effect, even when the Easter Bunny ejected a large amount of this
    power, and was unaffected when "In The Butt-Guy" became the Easter Bunny and generated
    a gigantic mind control explosion) |-|With Equipment and Technology= {{#tag:tabber|{{!}}-{{!}}Technology=
    * Antimatter Manipulation (With several weapons that are able to shoot antimatter,Rick
    and Morty Season 2 Episode 2, Mortynight Run allowing Morty to kill targets that
    cannot be killed by normal attacks) *Space Cruiser *Empathic Manipulation with
    the Love PotionRick and Morty Season 1 Episode 6, Rick Potion #9 * Precognition
    (With Death Crystals, Users can see how he will die in the future, allowing him
    to make the decisions that will keep him alive. After committing serious crimes,
    Morty managed to make the entire world forgive him by following the guidance of
    the crystal and emitting the precise tones and frequencies necessary for absolutionRick
    and Morty Season 4 Episode 1, Edge of Tomorty: Rick Die Rickpeat) * Adhesive Manipulation
    (Morty sticked a bully into a wall with Rick''s technology) * Biological Manipulation
    and Matter Manipulation (Is capable of manipulating the very DNA of beings) *Summoning
    (Using the Meeseeks Box, he can summon countless Meeseeks, each dedicated to fulfilling
    his every wish, can summon Planetina with the Elemental RingsRick and Morty Season
    5 Episode 3, A Rickconvenient Mort) *Dimensional Travel, Portal Creation, BFR,
    Teleportation (With Rick''s Portal Gun and Hollaluog Armour) *Elemental Manipulation
    **Fire, Water, Air, Earth, Ice Manipulation with Elemental Rings * Sealing (Sealed
    one of his bullies inside of a grenade) * Immortality (Types 4 & 6) Resurrection
    (With Rick''s Operation Phoenix. Rick seems to have back up datas of Morty in
    case he dies) *Many more with Preparation - Should be capable of making Rick build
    stuff for him {{!}}-{{!}}Hollaluog Armour= *Dimensional Travel, Portal Creation,
