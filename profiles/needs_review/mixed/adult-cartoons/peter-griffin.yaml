  intelligence:
    text: 'Varies, Below Average normally, Above Average in his best showings (Peter''s
      exact intelligence is very inconsistent and depends on the joke or plot, but
      is usually low. In the episode Petarded, it''s revealed that he''s legally mentally
      handicapped. In the same episode, he clearly struggled when playing a children''s
      edition of Trivial Pursuit, as he had difficulties with simple questions such
      as "Say the word ''what''" and "What color is a firetruck?"; and Brian stated
      Peter once thought he was locked inside of his own car and couldn''t simply
      open the car door from the inside even without the keys.Family Guy; S4, Ep 6.
      Once forgot how to sit down.Family Guy; S4, Ep 8. Has an incredibly short attention
      span, to the point where even Chris Griffin has pointed it out in Long John
      Peter. He attacked his own reflection on the patio door mirror because he thought
      it beat up Brian,Family Guy; S9, Ep 4. and mistook a toaster for a computer.Family
      Guy; S14, Ep 5. He is also very immature and lacks common sense. However, he
      is surprisingly highly knowledgeable in some areas. He is a talented hand-to-hand
      combatant, and is experienced in using guns. He was able to build a panic room
      by himself.Family Guy - Season 4, Episode 27: Untitled Griffin Family History
      He can perfectly play the piano while drunkFamily Guy; S2, Ep 20. He is also
      fluent in SanskritFamily Guy - Season 12, Episode 17: The Most Interesting Man
      in the World and knows sign language.Family Guy - Season 3, Episode 22: When
      You Wish Upon a Weinstein Once faked his own death successfully.Family Guy;
      S10, Ep 6. Quite proficient in Spanish)'
    source_ids:
    - vsbattles-peter-griffin-adult-cartoons
    confidence: 0.6
    notes: auto_repair source extraction
