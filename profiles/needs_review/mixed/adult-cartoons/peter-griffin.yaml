    - field: weaknesses
      value: 'Peter isn''t much of a strategist in battle and is quick to rush into
        the fight without thinking, his variable stats can also be a problem if he
        isn''t focused, due to his immaturity and intelligence this can become a problem,
        Peter''s cutaway setups can also be a issue if not used correctly or against
        opponents who can follow him through them or steal them from him, while this
        has been shown to be a very rare issue it''s still possible with the right
        hax. Notable Attacks/Techniques: |-|Family Guy= cutaway.gif|Peter using a
        cutaway setup to teleport into the Drunken Clam roadhouse.gif|Peter busting
        down the drive through pay area fart.gif|Peter stalling Joe with a fart bellyparry.gif|Peter
        parrying the Choir boy''s attack signofthecross.gif|Peter blocking the Choir
        boy''s attacks stowthehymnals.gif|Peter blocking the Choir boy''s kicks holykick.gif|Peter
        using the holy kick *Cutaway Setup: Can setup a cutaway to do several things,
        whether it be creating an event he wants to happen, travelling through time,
        teleporting etc. *Roadhouse Kick: A powerful kick can bust down structures.
        *Farting: When used correctly it can stall foes or make them throw up. *Belly
        Parry (Unofficial name): Parries his opponent with his large belly. *Sign
        of the Cross: blocks his opponent''s attacks with a cross pattern. *Stow the
        hymnals: acts the same as Sign of the Cross but for lower attacks. *Holy Kick
        (Unofficial name): Summons holy light and kicks his opponent. |-|American
        Dad vs Family Guy: Kung Fu 2= light punch.gif|Peter using the Light Punch
        light kick.gif|Peter using the Light Kick fierce punch.gif|Peter using the
        Fierce Punch fierce kick.gif|Peter using the Fierce Kick axe handle.gif|Peter
        performing an Axe-Handle doublekick.gif|Peter using the double kick attack
        (the name is misleading) blueangel.gif|Peter using the Blue Angel attack bottle
        throw.gif|Peter throwing his Pawtucket Patriot-Ale bottle headbutt2.gif|Peter
        performing a Headbutt blockfg.gif|Peter blocking Ryu''s Hadouken ipecac finisher.gif|Peter
        finishing off Brian *Light Punch: Fast way of punching enemies. *Light Kick:
        Fast way of kicking enemies. *Fierce Punch: Slower but stronger punch. *Fierce
        Kick: Slower but stronger kick. *Axe Handle: Deals a lot of damage. *Double
        Kick: Deals a lot of damage, Peter though will perform an uppercut for some
        odd reason. *Blue Angel: Peter farts a bubble and lights it on fire resulting
        in a fire fart. *Bottle Throw: Peter drinks and throws a bottle at his opponent.
        *Headbutt: Peter headbutts his opponent. *Block: Allows Peter to block any
        oncoming attack or projectile. *Ipecac Finisher:Peter uses this to vomit on
        his enemies finishing them off. |-|Family Guy: Video Game!= punchfg.gif|Peter
        punching kickfg.gif|Peter kicking jump kick.gif|Peter performing a Jump Kick
        pimp slap.gif|Peter slapping Ernie rufus special.gif|Peter using the Rufus
