        causing destruction with Charge food frenzy.gif|Peter using Food Frenzy *Punch:
        Standard punch. *Kick: Standard kick. *Jump Kick: Attacks a foe wrestling
        style. *Pimp Slap: Gives his opponent several slaps showing them who''s boss.
        *Rufus Special: Deals a lot of damage while showing off some funky moves.
        *Two-Fisted Slash: Deals big damage. *Leg Sweep: Deadly move with long range.
        *Uppercut: Deals a lot of damage. *High Kick: Sends foes flying. *Headbutt:
