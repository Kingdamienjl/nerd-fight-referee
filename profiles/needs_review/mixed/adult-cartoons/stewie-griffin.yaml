power_scale:
  tier:
    text: '{{9-A}} | Varies with weaponry, from at least {{9-A}} with standard weaponry,
      to {{8-A}} with his rocket launcher. Up to {{Low 2-C}}'
    source_ids: &id002
    - mediawiki-543750
    confidence: 0.95
  attack_potency:
    text: "Small Building level+ (Is physically one of the stronger Griffins, right\
      \ next to Peter. Went toe-to-toe with Brian, knocked down Lois with a chair\
      \ so hard that it broke, and fought Penelope. Brutally injured Brian. His evil\
      \ double smashedS9 Ep 12 the Kool-Aid Man's glass with one hit. Capable of hurting\
      \ himself) | Varies with weaponry, from at least Small Building level+ with\
      \ traditional firearms and standard weaponry (Guns in the verse are frequently\
      \ shown to be capable of harming himself and the rest of the Griffin family,\
      \ and he has a massive arsenal at his disposal. Has created numerous weapons\
      \ with the intentions to kill his mother), to Multi City Block level with his\
      \ rocket launcher (Created a massive explosion and killed a giant lizard). Up\
      \ to Universe level+ with his return pad and time machine (By overloading the\
      \ return pad\u2019s reactor, he accidentally created the big bang and a space-time\
      \ continuum. By turning the chronological gauge of his time machine backward,\
      \ it can reverse the flow of time on a universal scale)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Subsonic+, likely Supersonic (Faster than Brian, Is able to dodge point-blank
      shotgun shots)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class K (Comparable to his father. Lifted a grown man with his feet and
      easily pushed around other men)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Small Building level+
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Small Building level+ (Can take hits from Brian. Survived getting punched
      by Peter. Survives a great number of explosions on a semi-regular basis. Survived
      getting hit by a bus and getting run over by the Griffin family's car while
      already suffering a major head injury. Also survived an explosion that obliterated
      an airplane. Was fine after being in an intense helicopter crash. Can tank point-blank
      rocket launcher shots)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Can still go on in a fight even after receiving several fatal
      wounds all over his body)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range, higher with weapons | Universal+ (He can travel to
      different timelines)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Extraordinary Genius (Usually regarded as the smartest character in the
      series. Invents gadgets that far surpass modern technology on a daily basis,
      such as a mind control device, a weather-controlling device, a hypnosis machine,
      a multiverse traveler, a device that can swap bodies, and most importantly,
      a time machine. Also incredibly skilled in martial arts and an expert in marksmanship
      and weaponry. However, due to being a baby, he somewhat lacks common sense.
      For example, he has no idea how to use a toilet, had no idea what trick-or-treating
      was, and believed that Peter had actually disappeared during a game of peekaboo)
    source_ids: *id002
    confidence: 0.95
