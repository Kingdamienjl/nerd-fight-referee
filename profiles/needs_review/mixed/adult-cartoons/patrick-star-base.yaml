- id: claim-powers-and-abilities-39a8aaa3
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Toon Force * Immortality (Types 2,
    3, 4, and 7; Regardless of how Patrick dies, he will always come back, which has
    been proven by the canonical instructions, as well as Patrick being capable of
    better assessing situations after he reappears from dying) * Regeneration (Low-Godly;
    came back from SpongeBob erasing the entire universe. Regenerated from his entire
    body popping into nothingness after turning himself into a bubble. In Karate Star,
    Patrick fully acknowledged the fact he can regenerate, informing SpongeBob that
    starfish "have limbs that can grow new bodies") * Duplication (An amputated limb
    can grow into a new Patrick) * Ice Manipulation (Froze the Earth upon getting
    a severe brainfreeze) * Immersion * Madness Manipulation (Type 3 with the lyrics
    of Patrick''s song; It made multiple people in Bikini Bottom go crazy, because
    the lyrics were so horrible, and also made one of the artists in a band lose their
    eyes when reading and caused a band to die when singing the song) * Instinctive
    Reaction (Survived his entire life with his brain turned off. Went to SpongeBob''s
    location and attacked him while he was asleep) * Elasticity * Dream Manipulation
    (Like SpongeBob, he can invade, destroy, and control dreams at will) * Underwater
    Breathing (Type 1) * Self-Sustenance (Type 2; he and Spongebob survived being
    stranded in the wilderness for a year without consuming food and water in To Save
    a Squirrel) * Accelerated Development (Training - Intelligence; Can rapidly increase
    his intelligence by reading books as revealed in "Library Cards". Became great
    in Karate just by Spongebob teaching him in 1 or 2 days as seen in "Karate Star".
    In "Driven to Tears", he instantly got a driver''s license despite barely being
    productive, let alone not being in boating school) * Non-Physical Interaction
    (Was able to interact with Rube, despite him being non-existent. Can harm The
    Flying Dutchman. Physically caught air from a balloon) * Acausality (Types 1,
    3, and 4; Both he and SpongeBob interacted with their baby selves with no problems.
    Can operate in various comic panels at once as well as manifest in the real world)
    * Self-Age Manipulation (In "Pineapple Fever", Patrick aged himself just from
    sheer thought, with his aging rate speeding up 30 years per second. Was instantly
    back to his normal age by the next scene) * Time Travel (Can utilize time cards
    to go through time. Can travel into earlier comic panels) * Breaking the Fourth
    Wall (Went to the real world with SpongeBob, Squidward and Mr. Krabs. Physically
    tore through the episode''s storyboard and script in Chum Bucket List. Removed
    an entire group of characters by reusing a background from an earlier scene in
    The Commode Episode) * Life Manipulation (Can make living beings out of sand)
    * Fragrance Manipulation * Breath Attack (Via his "morning breath") * Martial
    Arts (Defeated and became a world-wrestling champion; although it appears he was
    not aware of what he did in the following scenes, it was later proven that he
    really was. Cited by SpongeBob as being a "genius" in karate and can compete with
    him in a fight) * Transmutation (Turned a pumpkin monster into a pumpkin pie)
    * Enhanced Senses (In "Scavenger Pants", despite being 20,000 leagues away, both
    Patrick and SpongeBob can see what it looked like in every detail. Found the lost
    air of a popped balloon. Watched Gary appear in Medieval Times) * Dimensional
    Travel (Traveled to another dimension, which is confirmed by Sandy as she stated
    that "her head was in another dimension") * Soul Manipulation (Can kill inanimate
    objects to take their souls) * Limited Body Control (Created "Patback") *Telekinesis
    (Beat himself up without moving a muscle) * Matter Manipulation (He and SpongeBob
    hugged each other so tightly to the point where they merged, then did this until
    they merged with the entire city with a molecular structure "bound by positively
    charged ionic energy") * Flight (Shown a few times) * Telepathy (Read SpongeBob''s
    mind in "Big Pink Loser") * Social Influencing (Made his own slogan for the Chum
    Bucket, which attracted customers across Bikini Bottom, despite the fact that
    the Chum Bucket is a well known terrible restaurant and the food is poisonous)
    * Berserk Mode * Stealth Mastery (Sneaks into Squidward''s house undetected on
    a daily basis. At the end of Spy Buddies, Spongebob and Patrick revealed themselves
    to be in several perfect disguises of their friends) * Small Size (Type 1) * Possession
    (As a ghost) * Teleportation and Size Manipulation (As shown here) * Shapeshifting
    (Shown here) * Projectile Reflection (Macho Star Spin reflects projectiles) *
    Stun Inducement (Macho Smash stuns enemies on the ground) {{!}}-{{!}}With'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
