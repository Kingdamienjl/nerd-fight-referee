    - field: weaknesses
      value: 'Zero is overconfident and hates relying on power-ups, making him hesitant
        to use his Black Zero form. While this doesn''t typically impede on his fighting
        capabilities, mentioning Zero''s past can anger or disturb him, as Zero is
        fully aware of his original purpose as Wily''s final creation. Zero also holds
        some regret over having killed Iris in the past, but he seems to eventually
        heal from that, now only being jaded as a result of the Maverick Wars. Notable
        Attacks/Techniques ==Notes and Possible FAQ== The Day of Sigma''s Canonicity:
        While the Day of Sigma isn''t consistent with the original X series, it can
        be watched in the Mega Man X Legacy Collections and is described as an animated
        short feature exploring the beginning of Sigma''s rebellion. It''s likely
        that Capcom put this in the Legacy Collections to give some further background
        behind how the X series began, as Maverick Hunter X is a remake of X1. For
        the purposes of this page, however, it is assumed that events play out very
        similarly, and that we are expected to ignore inconsistencies like the fate
        of Doctor Cain, and how Sigma got his scars. Any information from the Day
        of Sigma can be ignored however, if you wish to do so. This is merely part
        of the page creator''s interpretation. Wait, why''s DiVE mentioned here? DiVE
        is... Somehow canon. The game''s plot revolves around restoring the franchise''s
        canon after the Robot Destroy Program begins screwing the plot of the franchise
        up and the original characters such as RiCO, ViA, and iCO trying to find their
        place as characters in the Mega Man series. Additionally, staff from Capcom
        Japan such as illustrator Keisuke Mizuno supervised the game and intended
        to expand the world of the X series. Many characters featured in the game''s
        story are also basically just their canon counterparts, and it doesn''t disturb
        the canon of the series by having everything undone in the end since the Player
        corrected the Deep Log''s errors and returned the world to its normal state
        (ala Sonic ''06). ==Gallery== To be added. ==Others== Notable Victories: Notable
        Losses: Inconclusive Matches:'
