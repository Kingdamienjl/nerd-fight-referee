        \ the WDO\u2019s creed to solve mysteries with \u2018a perfect solution through\
        \ a perfect deduction\u2019, requiring him to \u2018discard emotions\u2019\
        . Though having a perfect track record in his work, he struggles to find solutions\
        \ where everyone can be happy, which led him to erase his memories in order\
        \ to help Kanai Ward. *Should be similar to Makoto as his original, who feels\
        \ the need to bear everything on his shoulders independently which can eventually\
        \ cause him to cave under pressure. }} |-|Pact with Shinigami= *Yuma shares\
        \ his mind, body and soul with Shinigami. This means that once fully synchronised,\
        \ they share their state of consciousness where if one is asleep or knocked\
        \ out, the other will also be (Though this usually relates to Yuma as Shinigami\
        \ is a spirit). Both Yuma and Shinigami are also connected by a spiritual\
        \ chain, which physically prevents them from separating too far from one another.The\
        \ exact limit of this chain is shown to be fairly inconsistent, and it's length\
        \ is potentially controlled by Shinigami to some extent. Within the real world,\
        \ it has shown to be fairly short, spanning a few meters or even to the point\
        \ that Shinigami can even rein Yuma in. However in the Mystery Labyrinth,\
        \ although they are always close to one another, the two can be separated\
        \ much further. Despite this, Shinigami has also been shown to be forcibly\
        \ pulled along this chain in both the real world and the Mystery Labyrinth.\
        \ *Yuma is unable to directly tell anyone about his contract with Shinigami,\
        \ otherwise it is immediately broken. Shinigami also claims Yuma\u2019s body\
        \ will also be drained of all its blood, though this could be a joke. *Although\
        \ Yuma can access the Mystery Labyrinth whenever he asks Shinigami to, he\
        \ requires sufficient Solution Keys (gathered by collecting evidence and observations\
        \ of the targeted crime scene) in order to navigate it otherwise he is at\
        \ risk of being stranded within the Labyrinth as his soul is absorbed into\
        \ it. This will render him braindead in the real world. There is also a time\
        \ limit for how long Yuma can take when navigating the Mystery Labyrinth before\
        \ his soul is absorbed. Though it possibly varies, Yuma has been able to stay\
        \ within a Labyrinth for over three hours. |-|Coalescence= *Coalescence requires\
        \ two conditions in that Yuma must be holding the person's hand in order to\
        \ share their abilities, as well as be given conscious consent in some form\
