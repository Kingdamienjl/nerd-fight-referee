    - field: weaknesses
      value: 'Does not fight as effectively underwater as on land or air, as he was
        being overpowered by Godzilla and would have been killed. Notable Attacks
        and Techniques: *Bio-Electrical Nature: Ghidorah''s dermal layer is covered
        with traces of gold which act as a conductor that carries bioelectrical currents
        throughout his body. He has electro-receptor molecular biology and can conduct
        electrical currents, make water vapor heat up to extreme levels, and create
        localized storm systems, otherworldly tempests of thunder and lightning. He
        can also fire bolts of lightning from the tips of his wings. *Energy Drain:
        Ghidorah has shown the ability to bite down onto power-lines and add the power
        to himself, significantly boosting his strength. He is also able to siphon
        the life force of his opponents through his bite, attempting to do so to Godzilla
        during their fight in Boston before being drawn away by the ORCA. *Gravity
        Beams: Ghidorah can shoot gravity beams (concentrated beams of electricity)
        from his mouths. Much like how Godzilla''s dorsal plates glow whenever he''s
        about to release his atomic breath, Ghidorah''s throats glow before he fires
        his gravity beams. The beams are golden in color, and they are more than powerful
        enough to obliterate humans, buildings, and aircraft. These gravity beams
        are so powerful, that when Mothra was struck by all three at once, she was
        immediately incinerated. *Hurricane Winds: Ghidorah has hyper-tensile muscle
        tendons in his wings that are capable of generating hurricane-force winds
        while in flight. *Regeneration: Ghidorah is able to regenerate one of the
