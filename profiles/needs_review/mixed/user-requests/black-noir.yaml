      value: 'Above Average normally, Gifted combatant (Noire has shown to have proficiency
        in her swordfighting, a form of combat she has been doing for many years.
        She is incredibly nimble, as she was able to continously evade the Lastation
        army, causing them to lose sight of her entirely and safely making her way
        to the heart of Lastation, even when they had brought in reinforcements to
        ensure that she doesn''t escape, had the area completely surrounded, and found
        a piece of cloth that tipped the soldiers off. Fought and defeated K-Sha twice
        in battle; K-Sha is a highly militaristically skilled soldier, having been
        tutored by the Order ever since she was young to be an elite soldier, demonstrating
        expertise over her arsenal of weapons. In the first fight, Noire had defeated
        Gold Form K-Sha alone in her HDD Form, with Noire admitting that K-Sha was
        stronger than her, and K-Sha saying that she would give it her all before
        the fight began. In the second fight, she and Uni defeated Gold Form K-Sha,
        and both of them were in their Human Forms despite the large strength gap
        with K-Sha''s Gold Form being boosted by the Gold Crystal. She can lead her
        own armies into battle when necessarySisters VS Sisters - Chapter 2. Whilst
        Noire was corrupted, she was able to fight against the party of VII alongside
        the other corrupted Goddesses up to that point, which was comprised of 12
        members. Most of the party consists of skilled fighters who have shown to
        be able to outclass or match each other in combat, including K-Sha, Nepgear
        (who has shown to be similarly proficient in combat as Neptune, being able
        to defeat other Goddesses such as Uni and Rom and Ram, as well as defeat CFW
        Magic twice over, whom could easily defeat the four Guardian Goddesses as
        well as an entire party (which consists of characters such as MarvelousAQL
        and Hyper Dimension Falcom) with little to no effort), C-Sha (a true martial
        artist who was able to take on Blanc and eventually win, as well as Rom and
        Ram, fighting the latter two at the same time), the Ultra Dimension Neptune
        (a proficient swordfighter who was capable of battling against both Nepgear
        and Vert without putting in too much effort, being there simply to stall the
        twoVII - Hyper Dimension Neptunia G: The Golden Leaders, Reconstructors of
        Gamindustri - Vert''s Story), Uzume (a naturally talented fighter, demonstrating
        implicitly comparable dexterity and battle prowess to Neptune, alongside being
        able to frequently clash with and consistently live against the Dark Goddess
        and routinely fending off the monsters of Zero Dimension for several years,
        being Zero Dimension''s only proper fighter, with a concept established as
        early as mk2 that fighting with raw power alone is an unviable fighting strategy
