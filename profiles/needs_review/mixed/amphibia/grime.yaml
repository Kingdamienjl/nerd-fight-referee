        \ Users Category:Life Users Category:Plant Users Category:Wood Users Category:Transmutation\
        \ Users Category:Body Control Users Category:Absorption Users Category:Telekinesis\
        \ Users Category:Portal Users Category:Statistics Amplification Users Category:Surface\
        \ Scalers Category:Teleportation Users Category:Weapon Users"
