      value: Genius. In school, Marcy Wu has always received straight A's except for
        Gym. When Marcy Wu was in Amphibia, she has shown that she is a resourceful
        analyst and a tactician as she quickly adapted to researching new environments,
        rapidly learning the science and society of Amphibia. Throughout her time
        in Amphibia, Marcy Wu has demonstrated her knowledge in technology, geometry,
        curse, illusion, Amphibian physiology, Amphibia history, chemistry, non-native
        languages, infrastructure, sculpture, architecture, magic, Flipwart and her
        skill in archery, trap evasion, puzzle solving, music. The Core has considered
