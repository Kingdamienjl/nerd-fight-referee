- id: claim-intelligence-821e4aaa
  section: power_scale
  axis: battle_iq
  text: 'Genius. In school, Marcy Wu has always received straight A''s except for
    Gym. When Marcy Wu was in Amphibia, she has shown that she is a resourceful analyst
    and a tactician as she quickly adapted to researching new environments, rapidly
    learning the science and society of Amphibia.{{refn|group=Note|A notable example
    is that Marcy Wu has successfully stole the golden egg from the giant crab, and
    she is the first person performed the feat and "the trial is designed to assess
    how potential Night Guards handle failure in the face of an impossible mission".}}
    Throughout her time in Amphibia, Marcy Wu has demonstrated her knowledge in technology{{refn|group=Note|Marcy
    Wu has researched on the Calamity Box and the Calamity Gems during her time in
    Amphibia, and found the usage method of the Calamity Box and that specific tonal
    motifs is required to calibrate the target location, and she has deduced Earth''s
    musical signature. Marcy Wu has researched on Frobo, found that Frobo has "surprisingly
    complex and sophisticated engineering", and successfully fixed Frobo after Marcy
    Wu accidentally caused the explosion and electrocution while tooling around in
    Frobo''s circuitry. Marcy Wu deduced that the energy contained in the shards of
    Calamity Gems could only support one final portal. After returning to the Earth,
    Marcy Wu shared her knowledge in Calamity Box technology to Terri, an interdimensional
    portal scientist, and had a conversation with Terri about their speculation on
    the energy containing in Calamity Gems.Marcy''s Journal: A Guide to Amphibia;
    Entry 124}}, geometry{{refn|group=Note|Marcy Wu calculated the trajectory to land
    a direct hit on the giant cobra with a trebuchet and her "college-level geometry
    skills". Marcy Wu has triangulated the tracking beam from the First Temple through
    the green Calamity Gem, and therefore determined the location of the Second Temple,
    which is in the Amphibian Arctic.Marcy''s Journal: A Guide to Amphibia; Entry
    75}}, curse{{refn'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
