    - field: weaknesses
      value: 'Very clumsy, careless to her allies and surroundings while focusing
        on a task. It should be noted that while Marcy Wu''s clumsiness is a noticeable
        trait, it is possible that Marcy Wu''s clumsiness is more of a running gag,
        Isn''t used to her powers and as such can only last in this form for a short
        period of time, still extremely clumsy. It should be noted that while Marcy
        Wu''s clumsiness is a noticeable trait, it is possible that Marcy Wu''s clumsiness
        is more of a running gag, which is supported by her agility feats during her
        time in Amphibia. Note 1: In the episode "The Hardest Thing" the rate at which
        the moon is approaching Amphibia differs from scene to scene, as such this
        page simply uses the highest end speed for said feat. Note 2: Some of Marcy
        Wu''s items lack definitive official name and therefore this profile is not
        a reliable source of the official names of Marcy Wu''s items. Note 3: Several
        feats of Marcy Wu are not included in this profile. The following contents
        are said feats and the reasons why they are not included:, Polly''s inner
        bones were visible to the audiences. Later, when Marcy Wu stated that Sprig
        is still alive after Sprig was eaten by the queen of Barbari-Ants, inside
        the body of the queen of Barbari-Ants, is visible to the audiences. It is
        likely for audience convenience rather than Marcy Wu having X-Ray Vision.,
        When Sprig was eaten by the queen of Barbari-Ants, Sprig was contacted with
        the acid of the queen of Barbari-Ants. After returning to Wartwood, Sprig
        coughed up the acid from the acid of the queen of Barbari-Ants and the acid
        instantly dissolved the ice cream as well as the container of ice cream.Amphibia,
        Season 2, Episode 11b, "Return to Wartwood" As Marcy Wu was willingly eaten
        by the queen of Barbari-Ants to rescue Sprig, it is likely that Marcy Wu contacted
        with the acid of the queen of Barbari-Ants as well. Because Marcy Wu''s actions
        inside the body of the queen of Barbari-Ants is not well-shown from the audiences''
        perceptive, Marcy Wu having, Resistance to Acid Manipulation may not have
        direct and strong evidence. * Technically, Marcy Wu, as one of the Calamity
        Trio, did have the energy contained inside the Calamity Gems after she was
        transported to the Amphibia by the Calamity Box and before she unknowingly
        returned said energy to the Calamity Gems. While it is possible that Marcy
        Wu could access to the abilities of the Calamity Gems, the demonstration of
        potential usage of the energy from the Calamity Gems during the said time
        are rare and vague, similar to Marcy Wu''s two friends at that time. Therefore,
        this profile does not include the abilities of the Calamity Gems in Marcy
        Wu''s base key. Note 4: While it is shown that Marcy Wu consistently playing
        with a handheld game console, resembling Nintendo Switch, before she was in
        Amphibia, it is not shown that Marcy Wu had the handheld game console during
        her time in Amphibia. Therefore, the console is neither considered as Marcy
        Wu''s Standard Equipment nor her Optional Equipment.'
