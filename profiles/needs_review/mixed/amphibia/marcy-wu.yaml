  name: Marcy WuAmphibia; Season 3; Episode 18; "The Hardest Thing"}} ==Summary==
    Marcy Regina Wu is a character from Amphibia. She appeared in the city of Newtopia
    when the Calamity Box sent her to Amphibia, where she quickly became chief of
    the Newtopian Knight Guard serving directly under King Andrias. When she reunited
    with Anne, they set out on an expedition to recharge the Calamity Gems and return
    home. ==Powers and Stats
