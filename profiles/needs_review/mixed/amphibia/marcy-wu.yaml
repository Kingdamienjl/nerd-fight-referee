      long time, which is supported by the statement that she "put [her] plan into
      motion" in the morning, the record that the giant crab eats in the afternoon
      (1:00 PM), Marcy''s Journal: A Guide to Amphibia; Entry 10 and the plan which
      includes luring the giant crab with its favorite food.}} The night before Marcy
      Wu''s journey to the First Temple, she spent the whole night "replaying every
      platformer, RPG, and gacha game [she has] on [her] phone",Marcy''s Journal:
      A Guide to Amphibia; Entry 64 and her extensive gaming didn''t negatively affected
