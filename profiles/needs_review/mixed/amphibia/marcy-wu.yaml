        to assess how potential Night Guards handle failure in the face of an impossible
        mission".}} Throughout her time in Amphibia, Marcy Wu has demonstrated her
        knowledge in technology{{refn|group=Note|Marcy Wu has researched on the Calamity
        Box and the Calamity Gems during her time in Amphibia, and found the usage
        method of the Calamity Box and that specific tonal motifs is required to calibrate
        the target location, and she has deduced Earth''s musical signature. Marcy
        Wu has researched on Frobo, found that Frobo has "surprisingly complex and
        sophisticated engineering", and successfully fixed Frobo after Marcy Wu accidentally
        caused the explosion and electrocution while tooling around in Frobo''s circuitry.
        Marcy Wu deduced that the energy contained in the shards of Calamity Gems
        could only support one final portal. After returning to the Earth, Marcy Wu
        shared her knowledge in Calamity Box technology to Terri, an interdimensional
        portal scientist, and had a conversation with Terri about their speculation
        on the energy containing in Calamity Gems.Marcy''s Journal: A Guide to Amphibia;
        Entry 124}}, geometry{{refn|group=Note|Marcy Wu calculated the trajectory
