    Technically, Marcy Wu, as one of the Calamity
  description: 'Resistance to Acid Manipulation may not have direct and strong evidence.
    * Technically, Marcy Wu, as one of the Calamity Trio, did have the energy contained
    inside the Calamity Gems after she was transported to the Amphibia by the Calamity
    Box and before she unknowingly returned said energy to the Calamity Gems. While
    it is possible that Marcy Wu could access to the abilities of the Calamity Gems,
    the demonstration of potential usage of the energy from the Calamity Gems during
    the said time are rare and vague, similar to Marcy Wu''s two friends at that time.
    Therefore, this profile does not include the abilities of the Calamity Gems in
    Marcy Wu''s base key. Note 4: While it is shown that Marcy Wu consistently playing
    with a handheld game console, resembling Nintendo Switch, before she was in Amphibia,
    it is not shown that Marcy Wu had the handheld game console during her time in
    Amphibia. Therefore, the console is neither considered as Marcy Wu''s Standard
    Equipment nor her Optional Equipment. ==Gallery== ===Costumes=== Marcy_Wu_SJMS_uniform.png|Marcy
