    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Acrobatics & Martial Arts (Bolin
        possessed remarkable agility, allowing him to evade Dai Li attacks while escaping
        the Earth Queen''s temple. He also demonstrated skill in wrestling and grappling
        during a high-stakes tiebreaker match against a veteran Black Quarry earthbender.
