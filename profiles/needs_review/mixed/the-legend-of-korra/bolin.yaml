        Influencing (Charisma; Bolin possessed a strong business sense, recognized
        by both Asami and Varrick, alongside great charisma as a public speaker. Varrick
        capitalized on this by casting him as the star of his propaganda films, turning
        Bolin into the poster boy for the Southern rebellion. Later, these social
        skills proved invaluable in his role as a presidential aide, where he excelled
        at charming visitors and smoothing political inroads for Zhu Li), Earthbending
        (As a pro-bender, Bolin developed an agile, "light on his feet" earthbending
        style, which relied less on traditional rooted stances. Despite this, he retained
        the brute strength needed for conventional earthbending, such as lifting boulders,
        summoning walls, and helping the Beifong sisters topple a building. Using
        pro-bending discs, he could hold his own against multiple opponents, even
        taking down three waterbenders at once. Bolin also possessed exceptional aim
        and precision, allowing him to pull off ricochet shots, fire rapid-fire chunks
        to stop a speeding motorcycle, and accurately strike P''Li''s third eye with
        a tiny pebble), Chi Manipulation (Bending is manipulation of inner-chi), Non-Physical
        Interaction (Bending can interact with spirits), Lavabending& Weapon Creation
        (Although Bolin discovered his rare lavabending ability by accident, he could
        immediately stop an oncoming lava flow. Despite his lack of experience, he
        quickly mastered phase-changing earth and held his own against the veteran
        Ghazan by blending pro-bending agility with traditional earthbending. By 174
        AG, Bolin''s mastery had grown exponentially: he could summon massive waves
        and extended streams of lava, turn molten rock back into earth effortlessly,
        and even lavabend while handcuffed or using his feet. Furthermore, he demonstrated
        high-level precision by maintaining lava in a rapidly spinning disc to slice
