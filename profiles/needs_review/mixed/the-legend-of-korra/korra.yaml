- id: claim-weaknesses-69399b52
  section: weaknesses
  axis: weakness
  text: 'Korra cannot firebend during a solar eclipse and cannot waterbend during
    a lunar eclipse. Was incredibly hot-headed in her teen years. Notable Attacks/Techniques:
    Waterbending: Korra has demonstrated a high level of skill in waterbending - She
    is capable of creating large walls of ice, powerful water whips, and water waves
    strong enough to push back opponents of enormous size. She can also launch herself
    high into the air and maintain the height on a gigantic waterspout easily, fight
    off several aerial attacks with various water attacks, and propel herself plus
    another person through the water at high-speeds to avoid attacks. While she was
    taught both Northern and Southern waterbending, Korra also picked up the ability
    to bend like Republic City''s waterbenders, using a more direct approach with
    her attacks. *Healing - Korra can use water to treat injuries and certain diseases,
    a special ability possessed by some waterbenders taught to her by Katara. However,
    this ability has not been shown to be applied during combat. *Spiritbending -
    Korra is capable of pacifying dark spirits and sending them back to the spirit
    world by using this rare waterbending technique. Earthbending: Korra has also
    achieved great mastery in earthbending, regularly using traditional earthbending
    in combat, while also utilizing pro-style earthbending, attacking more akin to
    a firebender with light footwork and quick jabs. Her prowess is great enough to
    easily take control of earth targets levitated by other earthbenders, launching
    enemies many feet into the air and throwing large boulders at her opponents. She
    can also synchronize her earthbending with another person to increase the versatility
    and control of her bending. *Metalbending - Being the first known Avatar to be
    capable of metalbending, Korra is quite talented at its use. She can effectively
    manipulate metal to a point where she can rip through obstacles made of metal
    and both deflect and redirect incoming metalbending attacks. Firebending: Fire
    is one of Korra''s most used elements. Due to the fact that she relies on offensive
    maneuvers when under pressure, Korra uses fire more than any other element. She
    has learned various advanced techniques such as the breath of fire and continuous
    fire streams. Against other firebenders, she can easily deflect and disperse the
    enemies'' attack. She can produce daggers made out of fire in each hand for close-range
    combat and is able to propel herself through the air with firebending in short
    bursts, and use these bursts to run along walls. Airbending: Unlike with the other
    three elements, Korra had great difficulties learning how to airbend, only unlocking
    it after previously having had her other elements blocked temporarily. However,
    in the following years, she became proficient in the art. She has shown great
    power in her offensive use of airbending, although her style of airbending varies
    dramatically from other airbenders, employing straightforward offensive movements
    similar to firebending while lacking the more characteristic circular and spiraling
    movements. Korra is able to effective glide with airbender staffs and can used
    more advanced techniques, such as the air scooter. Avatar State: Similar to the
    other Avatars, Korra can enter the avatar state, which vastly enhances her bending
    abilities and range. Although not being able to access the power of her previous
    incarnations any more, Korra still possesses great power while utilizing it and
    can enter it at will, although it may also get triggered as a self defense mechanism
    or as a response to extreme emotional reactions. If the Avatar dies while in the
    avatar state, the Avatar cycle ends with no new Avatar being born. Korra also
    possesses the ability to bend large amounts of spirit energy while in the avatar
    state and restore people''s bending, after theirs was taken away by a bloodbender.
    Hand-to-Hand Combat: Korra possesses impressive body strength and is adept at
    martial arts, being able to lift and throw even heavy people and objects. She
    is also very agile and can easily dodge incoming attacks by leaping out of their
    way. Her punches and kicks are strong enough to directly knock out close-range
    attackers. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
