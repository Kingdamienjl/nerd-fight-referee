  name: Korra}} ==Summary== Korra is the current incarnation of the Avatar and immediate
    successor of Avatar Aang. Born and raised in the Southern Water Tribe, where she
    mastered Waterbending, Earthbending, and Firebending, she later relocated to Republic
    City to attain a similar proficiency with Airbending under the tutelage and guidance
    of Tenzin as well as overcome her aversion to the spiritual aspects of the bending
    arts. With the assistance of Aang's spirit, Korra gained the ability to Energybend
    and after connecting with her past lives, she gained the capacity to enter the
    Avatar State at will, marking her transition into a fully realized Avatar. ==Powers
    and Stats
