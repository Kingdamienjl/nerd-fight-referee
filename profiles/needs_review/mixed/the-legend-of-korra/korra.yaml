        \ can adjust their output depending on the situation, meaning their attacks\
        \ do not consistently possess the same potency. This is consistently demonstrated\
        \ throughout the series, as bending attacks from the same character can produce\
        \ vastly different effects depending on their application. During Aang\u2019\
        s fight against Ozai, some bending attacks primarily serve to knock Ozai back,\
        \ while others can cause significantly greater damage or be lethal, meaning\
        \ Ozai\u2019s durability should not automatically scale to the Avatar State\u2019\
        s AP, and remains a Glass Cannon. Likewise, Azula\u2019s lightning can pierce\
        \ Toph\u2019s earth wall, while other attacks can be blocked by her earthbending,\
        \ demonstrating that neither her attacks nor Toph\u2019s defenses operate\
        \ at a fixed level of effectiveness. Toph lifting the library is still a valid\
        \ 7-C feat, but it does not mean every small rock she throws afterward carries\
        \ equivalent energy. Furthermore, scaling a material\u2019s durability from\
