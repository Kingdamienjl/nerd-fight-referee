    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Martial Arts & Acrobatics (Unalaq
        was a highly agile and capable fighter, able to hold his own against younger,
        athletic benders such as Mako and Bolin. He also overcame attacks from his
        brother, claiming to be too strong for him), Social Influencing & Genius Intelligence
        (Status; Unalaq held immense political and cultural power as the respected
        Head Chief of the Northern Water Tribe. Later, he leveraged this power to
        temporarily occupy and rule over the Southern Water Tribe as well. He was
        secretly a high-ranking member of the anarchistic society known as the Red
        Lotus, Manipulation; Unalaq was a master strategist who used cold, logical
        arguments to systematically isolate Avatar Korra. By highlighting the failures
        of her father, Tonraq, and her mentor, Tenzin, he ripped apart Korra's attachment
        to her guides. He successfully groomed her into trusting him, using her unique
        Avatar abilities to open the Northern and Southern Spirit Portals for his
        own endgame, Deception; For decades, Unalaq maintained a flawless public facade
        as a pious, spiritual leader while secretly plotting to release the spirit
        of chaos, Vaatu. He was capable of hiding massive, world-altering conspiracies
        without his family, his nation, or global authorities ever suspecting his
        true malicious intent. He also notoriously framed his own brother, Tonraq,
        to secure his spot as Chief, Leadership; He possessed exceptional governance
        and military authority, successfully commanding the elite military forces
        of the Northern Water Tribe. His absolute control over his military allowed
        him to orchestrate a full-scale civil war between the sister tribes and station
        troops as an occupying force in the South, Charisma; He possessed a calm,
        deeply convincing demeanor that commanded immediate respect. His persuasive
        charm was so potent that it extended beyond humans; he managed to befriend
        Wan Shi Tong, the ancient Spirit of Knowledge who notoriously hated humans.
        Through this relationship, he gained access to the Spirit Library to study
        the rare lore surrounding Vaatu and Harmonic Convergence), Waterbending (Unalaq
        was a highly powerful waterbending master, being able to engage in combat
        using only a minimal amount of water. When deprived of other sources of water,
        Unalaq was able to effectively utilize a water skin in battle. His move set
        ranged from strong torrents, water spouts, and unleashing multiple ice daggers
        in rapid succession. His water attacks were strong enough to shatter boulders
        and earth shields summoned by earthbenders), Chi Manipulation (Bending is
        used by manipulating inner-chi), Non-Physical Interaction (Bending can interact
        with spirits and souls), Icebending (Waterbenders are highly skilled at manipulating
        water and instantly turning it into solid ice. Unalaq himself excelled at
        this, quickly adapting and changing the physical state of water mid-battle
        to catch his opponents off guard), Vapor Manipulation (Waterbenders are skilled
        at manipulating, and turning water into steam), Healig & Regeneration (Low;
        Unalaq is a spiritbending, which is a more advanced technique of healing),
        Free Movement (Waterbenders can surf and travel on water), Sealing (Can freeze
        people), Weapon Creation (Waterbenders are skilled at creating ice weapons
        during battle, he himself could create large water whips), Elasticity & Additional
        Limbs (Should be comparable to Ming-Hua, he himself could use her technique
        to a lower extend), Enhanced Swimming & Underwater Breathing (Type 2; Waterbenders
        can swim and breathe underwater by creating airbubbles), Ice Breath (Waterbenders
        can freeze water with their breath), Pseudo-Flight (He could use water-spout,
        a high-master technique to effectively fly), Water Absorption (Comparable
        to Korra), Forcfield Creation (Via ice constructs), Empowerment (Water benders
        are boosted severaly at night, and incomparably higher during the full moon),
        Purification, Corruption, Non-Physical Interaction (Souls), Existence Erasure
