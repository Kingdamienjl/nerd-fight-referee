        * Bent the four nations. == Notable Attacks/Techniques and Gallery == {| class="mw-collapsible
        mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:80%"
        | colspan="2" style="text-align: left; |Bending |- | |-|Waterbending= Korra
        waterbends.gif|Waterbending Korra icebends.gif|Icebending Korra snowbends.gif|Snowbending
        Korra spiritbends.gif|Spiritbending Korra healing.gif|Healing Waterbending:
        Korra is a natural prodigy who mastered the physical forms of waterbending
        at a very young age, allowing her to whip, stream, create massive waves, tidal
        surges, water walls, and high-pressure cutting streams by relying on the concept
        of flow to redirect an opponent''s energy against them, making it perfect
        to utilize for mid-range combat, battlefield control, pushing back multiple
        enemies, and blocking incoming physical attacks. Icebending: Korra seamlessly
        integrates phase-shifting into her offensive combat style by instantly freezing
        water, shooting ice spears, creating defensive ice shields, and flash-freezing
        targets through the manipulation of water molecule temperatures, which allows
        her to immobilize agile opponents, create temporary cover, trap limbs, and
        deliver lethal piercing attacks. Snowbending: Korra uses this specialized
        environmental bending to alter terrain during arctic battles by creating localized
        snowstorms, manipulating snow drifts, creating soft landing pads, and throwing
        compressed snowballs through the control of fluid, semi-solid water crystals,
        which she utilizes to obscure enemy lines of sight, cushion falls, or create
        slippery terrain to disrupt enemy footwork. Spiritbending: Korra learned this
        rare variation from Unalaq to balance volatile spirits by purifying dark spirits
        into light, calming enraged entities, and destroying corrupted spiritual energy
        by wrapping a glowing stream of spiritual water around a target to balance
        positive and negative energy, which is utilized exclusively to pacify spiritual
        threats, cleanse corrupted areas, or safely neutralize dark spirits without
        physical harm. Healing: Korra was trained by Katara to become a highly capable
        combat medic who can close physical wounds, ease internal pain, soothe burns,
        and perform diagnostic energy scanning by using water as a catalyst to open
        blocked chi pathways and accelerate the body''s natural cellular healing process,
        which is best utilized after battles to restore injured allies, treat burn
        injuries, or stabilize critical wounds. |-|Earthbending= Korra earthbends.gif|Earthbending
        Korra metalbends.gif|Metalbending Earthbending: Korra uses a highly aggressive,
        pro-bending influenced style to launch large boulders, construct dense rock
        walls, shatter terrain, and launch herself into the air by manipulating the
        terrestrial minerals around her through sharp, grounded movements that emphasize
        raw physical force, which is best utilized to break enemy lines, create instant
        defensive cover, and dominate close-to-mid-range combat encounters. Korra
        can manipulate loose soil and desert terrain to create blinding dust storms,
        soften hard ground to cushion heavy impacts, shape shifting quicksand traps,
        and propel sand-sailers by adapting her rigid movements into fluid, sweeping
        motions, which is utilized to impair enemy visibility, control battlefield
        traction, and navigate treacherous desert landscapes. Metalbending: Korra
