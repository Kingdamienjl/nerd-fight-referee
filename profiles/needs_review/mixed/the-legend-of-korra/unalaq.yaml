        \ automatically upscaling to the bender's strongest attacksBending AP is not\
        \ fixed, as the amount of chi invested into each attack varies depending on\
        \ the bender\u2019s intent, objective, and technique. Since bending is a martial\
        \ art, benders can adjust their output depending on the situation, meaning\
        \ their attacks do not consistently possess the same potency. This is consistently\
        \ demonstrated throughout the series, as bending attacks from the same character\
        \ can produce vastly different effects depending on their application. During\
        \ Aang\u2019s fight against Ozai, some bending attacks primarily serve to\
        \ knock Ozai back, while others can cause significantly greater damage or\
        \ be lethal, meaning Ozai\u2019s durability should not automatically scale\
        \ to the Avatar State\u2019s AP, and remains a Glass Cannon. Likewise, Azula\u2019\
        s lightning can pierce Toph\u2019s earth wall, while other attacks can be\
        \ blocked by her earthbending, demonstrating that neither her attacks nor\
        \ Toph\u2019s defenses operate at a fixed level of effectiveness. Toph lifting\
        \ the library is still a valid 7-C feat, but it does not mean every small\
        \ rock she throws afterward carries equivalent energy. Furthermore, scaling\
        \ a material\u2019s durability from an attack it survived, then using that\
        \ durability to upscale other destruction feats involving the same material,\
        \ risks circular scaling. AP \u2260 DC, but this does not mean every bending\
        \ attack possesses the same AP regardless of its demonstrated effects. Rather,\
        \ chi expenditure and intent provide an in-universe explanation for why attack\
        \ potency varies between attacls. While characters can scale to one another\
        \ through consistently matching comparable attacks, such as Zuko and Azula,\
        \ blocking, destroying, or surviving an isolated, relatively weak bending\
        \ attack does not automatically scale a character to the bender\u2019s maximum\
        \ output. Each attack should therefore be evaluated according to its own demonstrated\
        \ potency and circumstances, with its AP calculated individually where possible\
        \ (For example, the kinetic energy of this specific attack by Toph is about\
