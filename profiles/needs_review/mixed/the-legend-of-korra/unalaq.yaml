      value: 'Small Building level physically (She''s an athletic strong woman, stronger
        than Aang Team''s durability who resisted a fall0.0497 Tons , as well Aang
        physically destroying boulders, and iroh doing a similiar thing.) Varies with
        Bending (Each bending attack scales on it''s own, here attack potency refers
        to her greatest capacityBending in Avatar is essentially telekinetic manipulation
        of elements, meaning a bender controls and moves existing matter rather than
        generating a fixed level of power, the strength of any given attack depends
        on how much mass is being moved and the speed, force, or temperature applied
        to it, so the energy output varies from attack to attack instead of being
        constant, as a result each technique operates on its own scale of kinetic
        or thermal energy, which is why benders demonstrate variable attack potency
        rather than a single consistent level of powerAt its core, bending is the
        telekinetic manipulation of existing matter. The power behind an attack depends
        on factors such as how much material is being moved, how fast it''s moving,
        and how much force, pressure, or temperature is being applied to each individual
        one. Since those variables constantly change, the AP of bending attacks naturally
        varies from one technique to another. Take Toph lifting the library, for example.
        That feat shows that she can exert enough force to move an enormous mass under
        specific circumstances. It doesn''t mean she applies even a comparable amount
        of force to her every attack, If she launches a small boulder, the energy
        of that attack should be determined by the mass and velocity of that specific
        boulder, not by the highest feat she has ever performed elsewhere in the series.
        This distinction is especially important because Avatar attacks are composed
        of real-world materials with real-world properties. Rocks are still rocks.
        Water is still water. Ice is still ice. If a calculation for a particular
        earthbending attack only yields Wall level based on the amount of rock involved
        and its speed, then that attack should remain Wall level, each attack can
        be calculated and scaled on its own. The fact that the same bender performed
        a much larger feat elsewhere does not automatically increase the energy contained
        within every smaller attack A small rock surviving an attack would then be
        used to upscale the durability of rock itself, which would in turn be used
        to upscale future destruction feats involving rock. At that point, you end
        up with a circular scaling loop where the material''s durability is derived
        from the feat, and the feat''s value is then derived from the material''s
        durability. The series itself consistently portrays different attacks from
        the same characters as having vastly different levels of power. Aang can shatter
        huge amounts of stone with certain attacks, while many other airbending attacks
        fail to significantly damage rocks, structures, or even people. During the
        fight against Ozai, air and water attacks do not suddenly become equally powerfull
        simply because Aang is using them. Likewise, Azula can destroy large structures
        with some firebending attacks, but she clearly cannot blast through a normal
        earth wall with another avarage attack a scene later - Toph is not manipulating
        the rocks durability here. The most straightforward explanation is that different
        attacks contain different amounts of energy, not that every rock, wall, tree,
        and human in the setting has the durability to withstand it, since half of
        them can half the time be undamaged by it. Toph''s library feat is remarkable
        because of the enormous mass she was able to move, not because it proves she
        can output that same level of energy through every single rock she throws
        afterward. The scale of the feat is inseparable from the amount of matter
        involved. Because of that, it makes far more sense to evaluate individual
        attacks based on their size, mass, velocity, and force rather than assume
        that every attack automatically carries the same power as the character''s
        greatest feat. For that reason, variable AP is arguably how the entire bending
        system operates. Evaluating attacks individually is therefore much more consistent
        with how bending is portrayed than assuming every attack scales to the strongest
