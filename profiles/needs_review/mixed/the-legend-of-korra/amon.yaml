        utter fearlessness, which was exhibited when he was nearly blasted by Korra's
        firebending, overcoming Tarrlok's bloodbending, and chasing after Korra following
        her escape from Tarrlok's hideout. He is clever and composed, as well as a
        convincing orator. He has a high command of the art of public speaking, knowing
        how to mystify and terrify his audiences and enemies alike, inspiring loyalty
        with each word and gaining widespread following for his cause. He is a strong-willed
        individual in possession of a high level of self-control, making him an extremely
        formidable opponent. His calm composure never wavers; when Korra escaped her
        prison and fired large missiles of ice at him, Amon did not hesitate to chase
        after her, but he remained composed when he lightly scolded his subordinates
        for underestimating her, which he had warned against)
