        \ he's superior to his father who could bend over 80 people simoltonously\
        \ without moving anything, and knocked them all unconcious, Tarrlock did the\
        \ same) *** Chi-Manipulation & Bending Removal (Amon developed his bloodbending\
        \ and chi-blocking knowledge so far, he learned to replicate the energybending"
