      value: "* Superhuman Physical characteristics **Martial Arts & Acrobatics (Amon\
        \ epitomized versatility in many ways. He concealed his bending abilities\
        \ through masterful hand-to-hand combat skills and the art of chi-blocking.\
        \ His prowess proved great enough to defeat even the most powerful of benders.\
        \ He also demonstrated his agility as a nimble fighter, allowing him to maneuver\
        \ gracefully and evade bending assaults with ease, even at close-range. He\
        \ also supplemented his hand-to-hand skills with minor applications of his\
        \ bloodbending in order to better defend and redirect enemy assaults. Apart\
        \ from his combat skills, Amon had extreme physical resilience that allowed\
        \ him to recover from a point-blank lightning bolt shot by Mako in mere seconds\
        \ and subdue him with bloodbending.) ** Genius Inteligence & Social Influencing\
        \ (Beyond his combat skills, Amon was a master strategist and charismatic\
        \ manipulator. He successfully masqueraded his bloodbending as a spiritual\
        \ gift, maintaining this facade even in battle to incite hatred toward benders.\
        \ He was politically savvy, choosing not to make Korra a martyr early on,\
        \ and even used makeup to fake a facial scar to legitimize his backstory of\
        \ being victimized by a firebender. As the leader of the Equalists, Amon proved\
        \ to be a brilliant tactician, repeatedly outmaneuvering the Metalbending\
        \ Police and the United Forces. He excelled in psychological warfare and terrorist\
        \ tactics, using intimidation and the manipulation of non-bender resentment\
        \ to maintain a constant edge over his enemies.) * Chi-Blocking & Pressure\
        \ Points (Amon is a master of chi-blocking, and has a whole army of Chi-Blockers\
        \ shocholared by him, it's a martial art that allows to block another bender's\
        \ chi paths, making them unable to bend for several minutes, it also induces\
        \ feeling of weakness and usually passing out) * Chi Manipulation (Bending\
        \ is mastery over manipulating chi) * Waterbending (Amon was a highly powerful\
        \ waterbending master. His brother, Tarrlok, noted that he had never encountered\
        \ a bender as strong as Amon. From a young age, Amon was a waterbending prodigy\
        \ and excelled under the tutelage of his father Yakone, who continually praised\
        \ Amon for his abilities and skill, especially in comparison to the less talented\
        \ Tarrlok. Amon was capable of launching himself out of a body of water on\
        \ a gigantic water spout and propelling himself over the surface at a speed\
        \ exceeding that of Mako's fire blasts) ** Ice Manipulation (Nearly all waterbenders\
        \ are highly skilled at manipulating water's state, turning it into ice for\
        \ various reasons, as well snow) ** Underwater Breathing, Enhanced Swimming,\
        \ Semi-Flight & Water Walking (Type 2; He created a giant water vortex without\
        \ any arm movement, he used it for semi-flight and later dipped into water,\
        \ swimming away from Republic City in moments) ** Binding (Waterbenders can\
        \ freeze opponents) ** Water Weaponry (Can make additional limbs and weapons,\
        \ like other waterbenders) ** Temperature Manipulation (Can manipulate temperature\
        \ of water) ** Vipor Manipulation (Superior to Katara and Aang, who bent clouds)\
        \ ** Ice Breath (Superior to Katara) ** Forcfield Creation (Via ice constructs)\
        \ ** Empowerment (Water benders are boosted severaly at night, and incomparably\
        \ higher during the full moon) ** Non-Physical Interaction (Bending can interact\
        \ with spirits) ** Bloodbending (4 Layers; Mastered psychic bloodbending under\
        \ Yakone, enabling him to bend at any time without a full moon through sheer\
        \ focus. He could effortlessly manipulate, levitate, or incapacitate multiple\
        \ targets simultaneously and even resist high-level bloodbending from others.\
        \ His mastery allowed him to subtly alter opponents' movements in combat without\
        \ revealing he was a bender. Amon\u2019s most lethal technique was \"severing\"\
        \ a person's bending connection, which he famously did to Lin Beifong, by\
        \ using bloodbending to permanently block their chi paths. This mirrored the\
        \ effects of energybending and was medically irreversible, baffling even masters\
        \ like Katara. The only way to restore a victim's bending is through true\
        \ energybending, though the process does not affect elements that have not\
        \ yet been unlocked.) *** Body Control & Bloodbending Resistance (4 Layers;\
        \ Katara said she's resistant to Hama's bloodbending beacause of her superior\
        \ bending strength, Amon performed the same feat against his brother Tarrlock,\
        \ who's the third greatest bloodbender of all time, and thus should be resistant\
        \ to anyone who would ever try to bloodbend him. Superior to Kyoshi who could\
        \ freeze someone's body fluids) *** Body Puppetry & Paralysis Inducement (Amon\
