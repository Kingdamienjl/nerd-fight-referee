        \ someone's chi field makes your bending stronger than anything they can perform]\
        \ and because of this he was already the greatest bloodbender in the series\
        \ in both skill and raw bending power, surpassing any other waterbending feat),\
        \ can ignore conventional durability (Via directly manipulating person\u2019\
        s bod"
