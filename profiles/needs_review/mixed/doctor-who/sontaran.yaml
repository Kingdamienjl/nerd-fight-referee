    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Energy Projection, Explosion Manipulation,
        Mind Manipulation, Healing, Resurrection | Same as before, plus Spaceflight,
        FTL Travel, Dimensional Travel, Time Travel, Forcefield, Light Manipulation
        (Can produce hardlight holograms), Invisibility, Duplication, Biological Manipulation
        (Can gene-splice soldiers to give them various traits and memories), Radiation
        Manipulation, Memory Manipulation (Cam transfer memories to clones), Metal
        Manipulation with Cordolaine Field (Can force copper to expand), Earth Manipulation
        and Fusionism with the Warsong (The Warsong is designed to terraform whole
        planets and integrate beings into itself), Air Manipulation, Resistance to
        Heat Manipulation and Radiation Manipulation
      source_id: vsbattles-sontaran-doctor-who
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: 'Small Building level (Far stronger than the Time Lords and hail from
        a world with significantly higher gravity; one soldier knocked out a Judoon
        Soldier, who are physically comparable to Ogrons and served as their direct
        rivals in the past. Sontaran blasters can vaporize Banes, who are far larger
        and more robust than humans, and destroy walls) | Multi-Continent level (Sontaran
        cannons can produce ten billion megatons of nuclear fire. Later into their
        war with the Rutans, both sides could destroy small planetoids and devastate
        planets by self-destructing) to Planet level (Mere battle spheres contain
        enough armament to reduce planets to "less than dust", eschatomic warheads
        can destroy planets. According to The Doctor, Staal''s flagship could "blast
        [the Earth] out of the sky"), possibly Solar System level (Rearranged their
        solar system to make their homeworld its central body. Their war with the
        Rutans has obliterated whole star systems) Power Source: Unknown Industrial
        Capacity: A single cloning facility can produce up to a million Sontarans
        in four minutes, and a single planet contains hundreds, if not thousands of
        factories, which is substantiated by The Doctor''s claim that an Earth-sized
        planet could create billions of clones. Seemingly produce enough weapons and
        ships to keep up with their enormous population of Sontarans, in addition
        to their war-effort against the Rutans. Military Prowess: The Sontarans are
        a military-based civilization, who are at almost constant war with the Rutans
        for thousands, if not millions of years. According to Linx, the Sontaran Military
        Academy have hatchings of a million cadets at each muster parade, allowing
        them to sustain enormous casualties on all battle fronts. Fleets are capable
        of performing extremely complex manoeuvres, and even 4-D pincer movements
        in conjunction with the Rutans.'
      source_id: vsbattles-sontaran-doctor-who
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Probic vent at the back can stun/knock out a Sontaran if it\u2019s with\
        \ a blunt object or kill with a sharp object. Notable Attacks/Techniques:\
        \ *Hypnosis: The Sontarans had a form of hypnosis that allowed to control\
        \ people. *Cloning: The Sontarans' primary technological advance is in the\
        \ mass-production of clones and programmed with all the basic knowledge of\
        \ warfare. They can also create a clone of a non-Sontaran, though they need\
        \ to be kept the clone in a machine to keep it alive. *ATMOS: Atmospheric\
        \ Emission System that reduces the C02 levels in a car to 0%. This was used\
        \ as a way to convert Earth\u2019s atmosphere in a breeding planet for the\
        \ Sontarans. The gas became lethal to humans at 80% density. This also gave\
        \ Sontarans complete control of the car. *Teleports: The Sontarans have teleport\
        \ technology in form of cubes like stations that could be placed in key locations.\
        \ They also could place devices onto objects to teleport them. *Deadlock Technology:\
        \ The Sontarans were able to deadlock their teleports preventing the doctor\
        \ from using them. The could also cars preventing anyone from getting in or\
        \ out of them. *Cordolaine Field: A field around a Sontaran that caused metallic\
        \ copper to expand; when the copper was in the jacket of a bullet, it became\
        \ jammed in the gun's barrel, rendering it useless. ==Notable Matchups== Victories:\
        \ Losses: Inconclusive: Category:Characters Category:Doctor Who Category:Civilizations\
        \ Category:Clones Category:Poison Users Category:Time Users Category:Warriors\
        \ Category:Military Characters Category:Honorable Characters Category:Aliens\
        \ Category:Spaceships Category:Antagonists Category:Male Characters Category:Time\
        \ Travelers"
      source_id: vsbattles-sontaran-doctor-who
      provider_id: vsbattles
      authority: high
      confidence: 0.75
