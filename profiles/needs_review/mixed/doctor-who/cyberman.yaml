    - field: stamina
      value: 'Superhuman (Cybermen are part-mechanical lifeforms) Power Source: Varies,
        the Cybermen have used a multitude of technologies to power themselves and
        their forces throughout their history. Some of these technologies are portable
        neural generation units on individual Cybermen, harvesting the energies of
        a whole planet, or using fragments of the time-vortex itself in the far future.
        Industrial Capacity: Varies, although normally high. The Cybermen have been
        known to invade planets covertly, building up their forces by converting other
        lifeforms while strategically creating technology with whatever resources
        they could find. The Cybermen are developed enough to become an intergalactic
        civilization and experimented with primitive time-travel, although not on
        the level as Daleks or the Time Lords. Military Prowess: Varies, although
        normally high. Cybermen are organized under a leadership hierarchy with a
        strong emphasis on surviving, adapting, and converting other lifeforms. Able
        to covertly conquer and wage war against many human and alien civilizations
        throughout history. Cybermen space-fleets enable the Cybermen to spread throughout
        the universe as an overwhelming military force, converting or destroying many
        planets and star systems. The Cybermen are formidable enough in battle that
        they were able to endanger humanity in the far future to the point that at
        least a whole galaxy had to be destroyed so they could not advance further
        and even then the Cybermen secretly survived. It has been stated that had
        the Cybermen perfected their time-travel technology, they would be able to
        overwhelm both the Daleks and the Time Lords.'
      source_id: vsbattles-cyberman-doctor-who
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: Cybermats, laser guns, Cybermites, Sleeper Darts
      source_id: vsbattles-cyberman-doctor-who
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Extraordinary Genius (Function on a logic-based hive mentality, continuously
        adapting and upgrading themselves with science to survive, have created multiple
        plans to covertly conquer or destroy whole planets, strategic enough to wage
        war on many human and alien civilizations throughout history, stated to be
        a large technologically-advanced space-faring civilization with a presence
        throughout the universe although this depends on version of Cybermen). The
        Cyberium was an AI that contained all the knowledge and history of the Cybermen
        in the far future. The Cyber-Mainframe was a network used by parallel-universe
        Cybermen to connect and share knowledge with other parallel-versions of themselves
        throughout the multiverse) Notable Attacks/Techniques: *Upgrading: The mk7
        Cybermen of the post Cyber-Wars have shown a tendency to develop an immunity
        to certain attacks/weapons used against them numerous times. That upgrade
        is then patched to all other Cybermen in a matter of seconds. *Cybermats:
        Silverfish-shaped cyborgs that are rodent sized and used the Cybermen as advance
        guards, plague carriers and energy thieves. **Cybermites: Cybermites are insect-like
        robots created a millennia after the Cyber Wars ended. They are designed as
        spies for reconnaissance and intelligence, attacking enemies in large swarms,
        repairing damaged Cybermen, harvesting salvageable material, and to partially
        convert victims. *Stealth: Cybermen usually make a loud noise when marching
        towards foes, however it seems that they can put their boots on silent. *Independent
        Body Parts: If a Cyberman was to have its head or arm detached, it would still
        be able to operate that part of the body; even the main body itself can operate
        without a head. *Sleeper Darts: When the head of a Cyberman is detached from
        the main body, it can shoot sleeper darts at foes.'
      source_id: vsbattles-cyberman-doctor-who
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Some sufficiently advanced weapons can destroy them (including a Dalek''s
        laser), with earlier models affected by any contact with gold or cleaning
        liquids. Can be outsmarted by more intelligent opponents. Fire and heat may
        melt the exoskeleton. In ''Death In Heaven'' it is shown that Cybermen can
        be controlled using a remote controller, although this was part of the Master''s
        plan. Cybermen mostly lack individuality and are unable to feel emotions due
        to an emotional inhibitor which keeps the organic brain from going insane
        and causing the Cyberman''s body to self destruct from emotional overload.
