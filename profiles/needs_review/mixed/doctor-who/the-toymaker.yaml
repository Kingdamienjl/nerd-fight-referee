- id: claim-weaknesses-c92a48e7
  section: weaknesses
  axis: weakness
  text: 'Bound by the laws of conduct set down by the Grace. His own power can be
    used against him. Rather insane. Note: The statement about that "The Toymaker
    is responsible for most conflicts with The Doctor''s other villains" and "everything
    are stories created by him" are from the short story Trick or Treat from the Doctor
    Who anthology Tales of Terror, and were exposed by the Doctor to be a lie, so
    these statements are invalid. ==Notable Matchups== Victories: Losses: Inconclusive:
    {{Discussions}} Category:Characters Category:Doctor Who Category:TV Characters
    Category:Book Characters Category:Gods Category:Cosmic Entities Category:Reality
    Warpers Category:Time Users Category:Telepaths Category:Telekinesis Users Category:Higher-Dimensional
    Beings Category:Space Users Category:Energy Users Category:Dream Users Category:Tricksters
    Category:Transcendent Beings Category:Guardians Category:Male Characters Category:Great
    Old Ones (Dr Who) Category:Concept Users Category:Comic Book Characters Category:Immortals
    Category:Illusionists Category:Science Fiction Characters Category:Invulnerability
    Users Category:Enhanced Senses Users Category:Primary Antagonists Category:Sadists
    Category:Psychopaths Category:Eldritch Horrors Category:Omnipresent Beings Category:Sealing
    Users Category:Nigh-Omniscient Beings Category:Immersion Users Category:Technopaths
    Category:Power Nullification Users Category:Magic Users Category:Memory Users
    Category:Narcissists Category:Fourth Wall Aware Characters Category:Fate Users
    Category:Game Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
