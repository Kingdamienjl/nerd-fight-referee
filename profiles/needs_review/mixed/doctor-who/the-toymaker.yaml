  range:
    text: High Complex Multiversal
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: "Nigh-Omniscient (In spite of being extremely immature and insane, the Celestial\
      \ Toymaker knows of every species in the entire universe and all details of\
      \ their history. Knows even of the plans others have made against him, and has\
      \ outsmarted the likes of the Doctor. Managed to outsmart The Doctor's TARDIS.\
      \ Has played and stalemated games with other elder gods, only having been ever\
      \ stalemated with Fenric) Standard Tactics: The Celestial Toymaker rarely ever\
      \ starts any battle by actually killing, preferring to torment his opponent\
      \ for as long as possible with \u201Cgames\u201D and trickery, although said\
      \ trickery often involves fates worse than death. Should he want to get rid\
      \ of an opponent right away, he will usually mind control them."
    source_ids: *id002
    confidence: 0.95
