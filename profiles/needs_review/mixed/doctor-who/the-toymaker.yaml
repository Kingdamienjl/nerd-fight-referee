  attack_potency:
    text: High Complex Multiverse level (Considered the most powerful of the Great
      Old Ones, equal to The Black Guardian and The White Guardian, part of The Six-Fold
      God. Superior to all Time Lord technology. Embodies the concept of illusions
      on a multiversal scale which contains up to 11 dimensions. Mere servants created
      by him are able to break through the TARDIS defences and force their way into
      the flying TARDIS)
    source_ids: *id002
    confidence: 0.95
  speed:
