    confidence: 0.95
  attack_potency:
    text: High Complex Multiverse level (Considered the most powerful of the Great
      Old Ones, equal to The Black Guardian and The White Guardian, part of The Six-Fold
      God. Superior to all Time Lord technology. Embodies the concept of illusions
      on a multiversal scale which contains up to 11 dimensions. Mere servants created
      by him are able to break through the TARDIS defences and force their way into
      the flying TARDIS)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Omnipresent (Guardians of time exist as fundamental parts of reality, should
      exist in a similar nature to the black guardian, who exists as chaos all across
      time. Stated that guardians "were the universe")
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Immeasurable
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: High Complex Multiverse level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: High Complex Multiverse level (Incapable of being injured by the time lords
      or other great old ones) abstract existence makes him hard to kill
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Infinite
    source_ids: *id002
    confidence: 0.95
  range:
    text: High Complex Multiversal
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: "Nigh-Omniscient (In spite of being extremely immature and insane, the Celestial\
      \ Toymaker knows of every species in the entire universe and all details of\
      \ their history. Knows even of the plans others have made against him, and has\
      \ outsmarted the likes of the Doctor. Managed to outsmart The Doctor's TARDIS.\
      \ Has played and stalemated games with other elder gods, only having been ever\
      \ stalemated with Fenric) Standard Tactics: The Celestial Toymaker rarely ever\
      \ starts any battle by actually killing, preferring to torment his opponent\
      \ for as long as possible with \u201Cgames\u201D and trickery, although said\
      \ trickery often involves fates worse than death. Should he want to get rid\
      \ of an opponent right away, he will usually mind control them."
    source_ids: *id002
    confidence: 0.95
