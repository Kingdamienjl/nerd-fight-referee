- id: claim-powers-and-abilities-fd8d1375
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Incorporeality, Immortality (Types 1,\
    \ 5, 8, and 9), Acausality (Types 1 and 4), Abstract Existence (Type 1, embodies\
    \ the concept of illusions), Self-Sustenance (Types 1, 2, and 3), Conceptual Manipulation\
    \ (Type 1, can interact with abstract beings like the red guardian. Planned on\
    \ making Fenric into his \u201Ctoy\u201D but ultimately stalemated him in a game),\
    \ Telepathy, Mind Manipulation (Has brainwashed countless mortals into being his\
    \ \"toys\"), Memory Manipulation (Made Ace forget The Doctor), Shapeshifting,\
    \ Technology Manipulation (Can turn lights on and off at will, has created cursed\
    \ Arcade Games), Power Nullification (Shut off the TARDIS' functions), Soul Manipulation\
    \ (Sealed the Doctor\u2019s \u201Cessence\u201D, [In this case meaning disembodied\
    \ consciousness] inside a doll), Reality Warping (Stated that \u201CThe Guardians\
    \ could bend reality, fashion space and time to their whims\u201D) Fate Manipulation\
    \ (Can control the fate of lesser beings into being his puppets without controlling\
    \ them directly), Creation (Can create and destroy universes that serve as his\
    \ \u201Ctoyrooms\u201D at will), Cosmic Awareness, Space-Time Manipulation, Dream\
    \ Manipulation, Dimensional Manipulation, Higher-Dimensional Existence, Large\
    \ Size (Type 10), Illusion Creation, Telepathy, Telekinesis, Energy Manipulation,\
    \ Invulnerability, Biological Manipulation and Life Manipulation (Can turn humans\
    \ into dolls and reanimate them), Transmutation (Rendered The Doctor invisible\
    \ and intangible), Forcefield Creation and Attack Reflection (Created forcefields\
    \ that defend himself from harm or can reflect attacks back at people), Sealing\
    \ (Can trap people in realms, this was even capable of working on The Doctor's\
    \ TARDIS), Power Bestowal, Immersion (Can trap people in fictional realms such\
    \ as board games), Regeneration (High-Godly, can regenerate from conceptual weapons),\
    \ Either Existence Erasure or Causality Manipulation (Scaled from the White Guardian),\
    \ Madness Manipulation (Type 3), Magic, Physics Manipulation, Law Manipulation,\
    \ Fourth Wall Awareness, Resistance to Conceptual Manipulation, Probability Manipulation,\
    \ Time Manipulation, Gravity Manipulation, Light Manipulation, Energy Absorption,\
    \ Sealing, Extrasensory Perception, Perception Manipulation, Biological Manipulation,\
    \ Weather Manipulation, Magnetism Manipulation, Illusion Creation, Dimensional\
    \ Manipulation, Spatial Manipulation, Age Manipulation, Air Manipulation, Sound\
    \ Manipulation, Technology Manipulation, Mathematics Manipulation, Matter Manipulation,\
    \ BFR, Time Stop, Void Manipulation, and Law Manipulation"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
