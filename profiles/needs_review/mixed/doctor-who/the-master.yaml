    - field: standard_equipment
      value: '*Keyblade: Through channeling one''s strength of heart, the user can
        summon a Keyblade to use in battle. Through the use of the Keyblade, the user
        is granted increased strength, speed, durability, and increased magical power,
        as well as access to special abilities, such as turning his Keyblade into
        a Keyblade Glider. The Master of Masters possesses what is now Master Xehanort''s
        Keyblade, which is noted to be incredibly ancient and has the Master''s eye
        inlaid in the tip, allowing him to see the future through it. *Black Coat:
        A magically enchanted coat that allows the wearer to pass through the Corridors
        of Darkness safely, warding off corrupting influences and preventing the power
        of Darkness from encroaching one''s mind and soul. It is also useful for stealth,
        as the hood completely obscures one''s face and blends in the with the shadows
        created by the Corridors of Darkness.'
      source_id: mediawiki-5054851
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Despite being known for his incredibly eccentric demeanor, the Master
        is also known for his incredible abilities as a Keyblade Master, being revered
        with awe by his apprentices, who are all incredibly powerful Keyblade Masters
        in their own rights. He has a keen understanding of both Light and Darkness,
        creating the Chirithys from Darkness and wearing the Black Coat that would
        later be utilized by many other characters in the series. His eye also allows
        him to see the future, allowing him to maintain an advantage against his opponent
        if he so chooses
