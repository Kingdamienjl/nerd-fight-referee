    - field: weaknesses
      value: "They cannot move when they are being directly observed. Often tend to\
        \ toy with prey, need to feed to become stronger/faster (although this makes\
        \ them less likely to toy with their prey), mirrors and paradoxes. Two or\
        \ more angels observing each other can never move again. Feats: *The Lady\
        \ Liberty Angel travelled from its normal position to Tudor City in seconds\
        \ in an episode *Somewhat feared by the Time Lords themselves *Conquered planets\
        \ (In large numbers) Notable Attacks/Techniques: *Quantum Locking: When observed\
        \ by a living creature (at least self-aware) the Angel would turn into a harmless\
        \ stone like creature. *Touch: When a Weeping Angel touches the victim, it\
        \ will send the victim through time and space allowing the victim to live\
        \ themselves to death. The Angel will feed on the remaining time energy of\
        \ the victim's life. *Neck Snap: If the Angel was already well fed, then the\
        \ Angel could just snap the neck of its victim. *Absorption: Angels can absorb\
        \ many types of energy like Radiation and Electrical energy to feed on and\
        \ to give them a combat advantage (turning out lights, draining power from\
        \ doors etc.) *Images: If anyone was to record or take an image of an Angel,\
        \ that would become an Angel in of itself. *Eyes of an Angel: When looking\
        \ into the eyes of an Angel for too long the Angel would infect a victim's\
        \ visual centres, creating an image in their mind. This would allow the victim\
        \ to be mentally influenced (Count down the victims time remaining or hallucinate\
        \ that a limb was petrified) until the Angel became fully grown at which point\
        \ it would escape the victim's body, killing them (the victim could temporarily\
        \ stop this by closing their eyes). *Replication: An Angel had the power to\
        \ spread its powers to an ordinary statue by touching it. Note: Weeping Angel\
        \ haven't been killed by conventional means before. ==Notable Matchups== Victories:\
