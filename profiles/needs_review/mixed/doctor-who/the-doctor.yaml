  attack_potency:
    text: Small Building level (Fought The Master, who can harm him, on various occasions,
      even outmatching the latter in combat. Punched down a steel door, continuously
      struck a twenty-foot thick Azbantium wall, a mineral 400 times harder than diamond,
      to the point where it eventually shattered, even after breaking his hand in
      the attempt), at least City level with Sonic Screwdriver (The War Doctor, Tenth
      Doctor and Eleventh Doctor's three sonic screwdrivers destroyed a Dalek) and
      Time War Gun (Destroyed a Skaro Degredation, which have reinforced armor capable
      of withstanding their own attacks. Threatened to atomize Alice Obiefune), was
      going to kill the Dalek in Van Statten's Museum. Solar System level, likely
      far higher during regenerations (The Eleventh Doctor's regeneration destroyed
      a Dalek Saucer) | High Complex Multiverse level with Preparation (Acquired The
      Moment, the Time Lord's most powerful creation, and would have obliterated Gallifrey
      and the Daleks. The Key to Time grants its wielder the full power of The Six-Fold
      God), can bypass durability with various equipment (The 2Dis is capable of expanding
      or contracting the spatial dimensions of an object, rendering it 2nd or 3rd
      dimensional, the De-Mat Gun rewrites a target's history, erasing their physical
      form from existence) | Low Complex Multiverse level (Absorbed and even controlled
      the Time Vortex, which has been proven to be 5-D) | High Complex Multiverse
      level (Absorbed the power of Lux Aeterna and fought with the Quantum Archangel,
      causing her serious harm in the process, although he was eventually overpowered)
      | High Hyperverse level (Gained the power of the Glory. Fought against The Master
      who's comparable to him)
    source_ids: *id002
    confidence: 0.8
