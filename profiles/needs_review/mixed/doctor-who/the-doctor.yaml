  intelligence:
    text: 'Supergenius. Knows incredible amounts of things about the universe (Claims
      to be able to speak every language in the universe, and is capable of easily
      deducing equipment to its point of origin). Can know the details of objects
      just by tasting/smelling them, and can tell where he is in the universe by looking
      at the alignment of stars. He has created various equipment/weapons out of nothing
      but junk on several occasions. Has a very in-depth knowledge on Earth history
      (Because of traveling their lots) and has picked up many skills from various
      historic people in his travels. On several occasions various incarnations has
      fought, defeated, and outsmarted beings such as the Eternals and Guardians of
      Time Standard Tactics: Generally avoids using the sonic screwdriver or guns
      in combat unless absolutely necessary. Usually relies on non-lethal incapacitation
      methods, such as taking away his opponents powers, trapping them inside mirrors,
      trapping them in a time loop, etc.'
    source_ids: *id002
