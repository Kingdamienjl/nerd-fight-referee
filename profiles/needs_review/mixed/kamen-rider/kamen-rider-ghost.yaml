      value: 'Ghost Driver: Transformation device, Ghost Eyecons: Transformation trinkets.
        They also granted the ability to observe the Gamma when Takeru was alive.,
        Ghost Gadgets: Ghost''s Support Robots and Gan Gun Saber mode-accessing devices,
        Eyecon Driver G: Grateful Damashii transformation device Weapons, Gan Gun
        Saber: Ghost''s main weapon that he uses in most of his forms. This weapon
        has seven different modes. In blade mode, the Gan Gun Saber is a double bladed
        sword. Made with Quantum Solid, the Quantum Blade is a blade that can decompose
        any substance that comes in contact with it. It is able to cut almost anything
        on Earth. The Quantum Divider is a frame that can create an energy shield
        that increases durability drastically. Because of this, Ghost can use the
        Gangun Saber as a shield. The Decider Grip is a part of the sword that controls
        center of gravity. This allows Ghost to stabilize weapon behavior, allowing
        him to make accurate and precise attacks no matter the hindrance. When Ghost
        aligns the Energy Eye Crest with the Ghost Driver, he can activate an Omega
        Drive, a special move which is used to finish off enemies. When using an Omega
        Drive, it applies the power of the Eyecon Ghost is currently using to the
        weapon. (Omega Drive descriptions apply to all the weapon''s modes). Gan Gun
        Saber can turn into a gun. When it is a gun, it can shoot out energy bullets
        charged with electromagnetic force. Ghost can also decide how the bullet is
        fired by adjusting the output. It can range from high speed, continuous shooting,
        to shooting out many bullets at once, to a charged shot that explodes on contact.
        The gun has an aim assist that corrects and adjusts aim, allowing precise
        shooting. Gan Gun Saber can split into two one-sided swords. This form is
        mostly used in, but not limited to Musashi Damashii. using to the weapon.
