- id: claim-weaknesses-db927398
  section: weaknesses
  axis: weakness
  text: Very clumsy on a daily basis, though this has never become present in combat
    as a Kamen Rider. While he has no problems destroying different types of monsters,
    Emu generally prefers not to kill his opponents. For example, Kiriya stated that
    Emu was not an ideal candidate to take down Genm God Maximum as he would not have
    the willingness to kill Kuroto, despite Emu possessing more than enough power
    to do so as Hyper Muteki. However, his kindness did not prevent him from killing
    both Johnny Makishima (Gamedeus Machina) and Kaisei Mogami (Bikaiser), proving
    that his kindness also has limits.
  source_ids: *id003
  decisive: false
