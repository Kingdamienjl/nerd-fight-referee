    \ of virus ever due to being the first patients of Game Disease before Zero Day,\
    \ including diseases that are different from normal ones), Biological Manipulation\
    \ and Transmutation (He is unaffected by the Gamedeus Virus turning people into\
    \ Bugster Virus) *Limited Resistance to Time Stop (Can resist time stop for a\
