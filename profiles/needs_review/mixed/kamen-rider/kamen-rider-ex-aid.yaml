- id: claim-powers-and-abilities-495cbf5a
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Multiple Selves (Type 1; due to the\
    \ Bugster Virus in Emu's DNA, he has two different personalities, Emu himself\
    \ and Genius Gamer M, which can be separated when using Mighty Brothers XX) *Acrobatics\
    \ *Hand to Hand Combat *Weapon Mastery *Statistics Amplification (In at least\
    \ one occasion, the spontaneous activation of Emu's Bugster infection allows him\
    \ to exert great physical strength) *Gashat Creation (As Patient Zero of the Bugster\
    \ Virus, the progenitor of all the Rider Gashats and Bugsters as stated by Hiiro,\
    \ he can use the Bugster Virus in him in conjunction with certain blank Gashats\
    \ to create new, stronger forms for himself) *Resistance to Disease Manipulation,\
    \ Resistance Negation, Data Manipulation, Status Effect Inducement and Existence\
    \ Erasure (He is immune to every strain of virus ever due to being the first patients\
    \ of Game Disease before Zero Day, including diseases that are different from\
    \ normal ones), Biological Manipulation and Transmutation (He is unaffected by\
    \ the Gamedeus Virus turning people into Bugster Virus) *Limited Resistance to\
    \ Time Stop (Can resist time stop for a few seconds) *Transformation with Gamer\
    \ Driver and Rider Gashats *Game Area (Upon activation of their Gashats, Ex-Aid\
    \ Riders can generate their Game Areas) *Creation (Gamer Driver users can materialize\
    \ Gashacon Weapons or Vehicles) *Deconstruction and Corrosion Inducement (Enemies\
    \ that come in contact with Gashacon Breaker\u2019s hammer or blade is decomposed.\
    \ Enemies that come in contact with Gashacon Keyslasher\u2019s attacks are decomposed)\
    \ *Light Manipulation (Ex-Aid\u2019s sword slashes is accompanied by laser wires\
    \ that decompose enemies on contact. Gashacon Keyslasher can create a long blade\
    \ of light and can shoot light bullets and beams) *Vibration Manipulation (The\
    \ Gashacon Breaker can make high-pressure shockwaves that can incapacitate enemies.\
    \ Gashacon Keyslasher\u2019s Axe can create vibrations that can crush armors with\
    \ ease) *Fusionism (Gashacon Keyslasher can read up to two Gashats. If it reads\
    \ two, it combines the effects of the inserted Gashats) *Power Nullification and\
    \ Resistance to Reality Warping and Time Rewind with Save (With the \"Save\" Energy\
    \ Item, Ex-Aid characters are able to \"save\" their \"progress\", allowing them\
    \ to not only resist the changing of reality and time caused by Cronus' Reset\
    \ ability, but also cancel it) *Resistance to Hacking (Gamer Drivers have an automatic\
    \ battle communication program that is able to connect to Genm Corp. They then\
    \ send out bug fixes that the Gamer Driver automatically downloads) All previous\
    \ abilities *Non-Physical Interaction (Can see and interact with Kamen Rider Ghost,\
    \ who's an incorporeal being) *Energy Manipulation (Most of his attacks and weapons\
    \ are energy-based) *Enhanced Senses (Ex-Aid is able to see microscopic things\
    \ such as viruses. Sender Ear Enhances his hearing) *Explosion Manipulation *Underwater\
    \ Breathing Type 3 with Air Fresh Guard *Acrobatics (Ex-Aid has a built-in spring\
    \ that enhances jumping and high movement actions) *Density Manipulation (By injecting\
    \ air into the armor, Ex-Aid can become lighter, increasing his mobility) *Damage\
    \ Reduction (Ex-Aid\u2019s armor is made with a soft material that has excellent\
    \ shock absorption that mitigates damage) *Accelerated Development (Mech Lifeguard\
    \ allows Ex-Aid\u2019s durability to get higher when his health is lower) *Purification\
    \ (Ex-Aid can run a disinfecting program that heavily damages viruses and diseases.\
    \ He also has an air filter that filters out dangerous substances) *Statistics\
    \ Amplification (Ex-Aid can temporarily inject an armor strengthening agent throughout\
    \ the body. Furthermore, by activating closing and pulling the lever, Ex-Aid can\
    \ activate a special move that boosts AP significantly) *Fissionism (By hitting\
    \ a separation pulse the same time as an attack, Ex-Aid can separate a person\
    \ from the Bugster Virus) *Information Analysis (Ex-Aid\u2019s React Signal allows\
    \ him to capture and identify surrounding moving bodies and automatically sets\
    \ tracking markers. The radar map on the internal monitor shows the captured enemies,\
    \ allies, and the positions of energy items. Ex-Aid also has a built in camera)\
