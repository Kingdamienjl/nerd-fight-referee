    \ on contact. Gashacon Keyslasher can create a long blade of light and can shoot\
    \ light bullets and beams) *Vibration Manipulation (The Gashacon Breaker can make\
    \ high-pressure shockwaves that can incapacitate enemies. Gashacon Keyslasher\u2019\
    s Axe can create vibrations that can crush armors with ease) *Fusionism (Gashacon\
    \ Keyslasher can read up to two Gashats. If it reads two, it combines the effects\
    \ of the inserted Gashats) *Power Nullification and Resistance to Reality Warping\
    \ and Time Rewind with Save (With the \"Save\" Energy Item, Ex-Aid characters\
