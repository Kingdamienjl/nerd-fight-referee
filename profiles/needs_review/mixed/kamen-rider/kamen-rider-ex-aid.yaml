    \ changing of reality and time caused by Cronus' Reset ability, but also cancel\
    \ it) *Resistance to Hacking (Gamer Drivers have an automatic battle communication\
    \ program that is able to connect to Genm Corp. They then send out bug fixes that\
    \ the Gamer Driver automatically downloads) All previous abilities *Non-Physical\
    \ Interaction (Can see and interact with Kamen Rider Ghost, who's an incorporeal\
    \ being) *Energy Manipulation (Most of his attacks and weapons are energy-based)\
    \ *Enhanced Senses (Ex-Aid is able to see microscopic things such as viruses.\
    \ Sender Ear Enhances his hearing) *Explosion Manipulation *Underwater Breathing\
    \ Type 3 with Air Fresh Guard *Acrobatics (Ex-Aid has a built-in spring that enhances\
    \ jumping and high movement actions) *Density Manipulation (By injecting air into\
    \ the armor, Ex-Aid can become lighter, increasing his mobility) *Damage Reduction\
    \ (Ex-Aid\u2019s armor is made with a soft material that has excellent shock absorption\
    \ that mitigates damage) *Accelerated Development (Mech Lifeguard allows Ex-Aid\u2019\
