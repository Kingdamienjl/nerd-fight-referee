    \ (Upon activation of their Gashats, Ex-Aid Riders can generate their Game Areas)\
    \ *Creation (Gamer Driver users can materialize Gashacon Weapons or Vehicles)\
    \ *Deconstruction and Corrosion Inducement (Enemies that come in contact with\
