- id: claim-standard-equipment-ea2272c9
  section: equipment
  axis: equipment
  text: '*Cyclotron: A belt, created by George Karizaki, that transforms Ryunosuke
    and Hideo into Kamen Rider Century. It is able to separate people''s consciousness
    and store it inside. It also has the ability to time travel them into either the
    past or the future. After becoming complete, its abilities work on bodies as well
    as minds and consciousnesses. *Dest Cyclone: A saw-blade construct that Century
    makes. It can is used offensively, defensively or as utility. It is incorporated
    into Century''s rider punch and rider kick.'
  source_ids: *id003
  decisive: false
  status: unverified
