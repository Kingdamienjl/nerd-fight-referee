- id: claim-powers-and-abilities-908d6604
  section: abilities
  axis: hax
  text: 'Genius IntelligenceKamen Rider: Beyond Generations, Intangibility (Ryunosuke''s
    consciousness is in the present while his body is in the future. This means that
    his "body" cannot interact with anything besides talking and using Cyclotron Driver''s
    abilities), Possession (Ryunosuke possessed Hideo''s body to become Century Break),
    Teleportation, Mind Manipulation and Fissionism (Ryunosuke''s Cyclotron Driver
    can separate the minds and consciousness of people from their body. The Cyclotron
    Driver can also send people''s consciousnesses into the past or the future), Time
    Travel (Cyclotron can time travel himself or other people''s consciousnesses),
    Ryunosuke w/Complete Cyclotron=Everything in Ryunosuke before completed Century
    minus intangibility, BFR (Ryunosuke can break a person into particles and store
    it into the Cyclotron then release them elsewhere), enhanced Time Travel (Ryunosuke
    can also transport bodies now), Matter Manipulation and Absorption (Ryunosuke
    can break a person''s body into red particles and store it in the Cyclotron) Hideo
    w/Complete Cyclotron=Everything in Ryunosuke w/Complete Cyclotron Superhuman Physical
    Characteristics, Weapon Mastery, Acrobatics, Martial Arts, Genius Intelligence,
    Energy Manipulation, Enhanced Senses, Explosion Manipulation, Statistics Amplification
    (Can become far stronger while activating Rider Punch and Rider Kick. While in
    his particle state, he can boost himself to great speeds that blitzed multiple
    foes), Possession (Ryunosuke possessed Hideo''s body to become Century Break),
    Time Travel (Cyclotron can time travel people''s consciousnesses), Weapon Creation
    (Century can make the Dest Cyclone, a saw blade construct), Forcefield Creation
    (Century can use their Dest Cyclone like a barrier), Pseudo-Teleportation, Intangibility
    (Century can make themselves into particles to phase through objects), Mind Manipulation
    and Fissionism (Century can separate the minds and consciousness of people from
    their body. The Cyclotron Driver can send people''s consciousnesses into the past
    or the future), Platform Creation (Century can use Dest Cyclone as a platform),
    Durability Negation (Century was able to damage the Cripser Stamps inside Diablo''s
    body who was holding him off with a forcefield that is unbreakable), Berserk Mode,
    Resistance to Fire Manipulation (Century easily swatted away Diablo''s violet
    fireballs) Century (Complete)=Everything in Century Break minus berserk mode,
    BFR (Century can break a person into particles and store it into the Cyclotron
    then release them elsewhere), enhanced Time Travel (Century can also transport
    bodies now), Matter Manipulation and Absorption (Century can break a person''s
    body into red particles and store it in the Cyclotron)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
