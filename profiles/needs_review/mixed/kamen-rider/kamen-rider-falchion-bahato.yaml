    - field: powers_and_abilities
      value: "Transformation, Weapon Mastery, Martial Arts (Takumi's main fighting\
        \ style is street brawler, with wild swings and rapid punches and kicks. As\
        \ the series progressed though, his experience slowly allowed him to develop\
        \ into a formidable fighter), Vehicular Mastery, Stealth Mastery (Vanished\
        \ out of an Orphnoch's sight after it briefly looked away from him, leaving\
        \ it confused even with the enhanced senses that Orphnochs are known to possess.Kamen\
        \ Rider 555, Episode 8 Remained hidden from a group of Orphnochs from an extended\
        \ period of time alongside Yuji KibaKamen Rider 555, Episode 21), Resistance\
        \ to Mind Manipulation through Supernatural Willpower (Can wear the Delta\
        \ Driver without suffering its side effects) All previous abilities, Superhuman\
        \ Physical Characteristics, Acrobatics, Enhanced Senses (Ultimate Finder visor\
        \ gives Faiz night vision, that can see in the night time as if it is day,\
        \ and x-ray vision. He has a sense of smell that is 1 million times stronger\
        \ than humans and hearing that can here a needle drop 5km away, which are\
        \ both freely adjustable.), Perception Manipulation (The Faiz Gear has an\
        \ arithmetic system that makes him able to process things as fast as a supercomputer.)\
        \ Energy Manipulation (Faiz can producing an energy drill around his foot\
        \ while executing the deathblow. In Axel form, Faiz can either shoot multiple\
        \ energy drills to one enemy, or shoot individual ones to multiple enemies),\
        \ Energy Projection with Faiz Phone (Allows Faiz to fire a continuous beam\
        \ of Photon Energy), Summoning (He can summon the Jet Sliger, a combat motorcycle\
        \ which Faiz used to travel, and the Auto Vajin, a motorcycle mecha which\
        \ help him in combat), Deconstruction (Photon Blood is an energy source that\
        \ is able to disintegrate anything it touches into ash. It flows within Faiz's\
        \ suit and can be used when Faiz activates his weaponry), Durability Negation\
        \ (When Faiz uses Crimson Smash, he can phase through enemies, destroying\
        \ them from the inside), Gravity Manipulation (The Faiz Edge allows Faiz to\
        \ fires an anti-gravity pulse along the ground, immobilizing ground-based\
        \ enemies by levitating them in the air, and overcharge the energy in the\
        \ blade, allowing it to perform more powerful cuts) and Explosion Manipulation\
        \ (His attacks have a tendency of causing explosions), Information Analysis\
        \ (The Global Feeler are the antennas which communicates with the Eaglesat\
        \ which collects information and downloads new programsKamen Rider Zukan),\
        \ Heat Manipulation with the Faiz Edge (It\u2019s Medium Mode can possibly\
        \ incinerate OrphnochsKamen Rider Zukan), Light Manipulation with the Faiz\
        \ Edge (Should be comparable to the Kazia Blaygun who\u2019s blade is described\
        \ as light based. The Faiz Phone\u2019s Blaster Form can shoot out light bulletsKamen\
        \ Rider Zukan), Underwater Breathing (Type 3) and Resistance to Fragrance\
        \ Manipulation (The Full Metal Lung has a built-in oxygen tankKamen Rider\
        \ Zukan and the Extreme Regulator is a device that supplies oxygen in harsh\
        \ environments with low oxygen such as water and toxic gasesKamen Rider Zukan),\
        \ Likely Purification (Type 1; Faiz\u2019s Extreme Regulator should be similar\
        \ to Kaixa\u2019s which can purify toxins), Resistance to Fear Manipulation\
        \ (Can fight alongside Delta, who inspires fear into others through his mere\
        \ presence), Electricity Manipulation and Deconstruction (Withstood the Dragon\
        \ Orphnoch's 10,000 volt lightning and was unaffected by his ability to deconstructKamen\
        \ Rider Zukan) All previous abilities, Statistics Amplification (Can greatly\
        \ increase his speed in this form) All Base Faiz abilities, Greater Enhanced\
        \ Senses (Faiz's sight is upgrade to the point he can see the molecular structure\
        \ of targets, can see in complete darkness, and has better x-ray vision. His\
        \ hearing is now upgrade so that he can hear a pin needle drop from 30km away.),\
        \ Flight (Photon Field Floater releases constant waves of Photon energy to\
        \ give Faiz Blaster flying capacities), Energy Manipulation (The Exceed Charge\
        \ of the Faiz Blaster fires a powerful and large blast of Photon Energy at\
        \ the target, and the Photon Breaker, where Photon Blood pools to create a\
        \ giant bladed construct of the blade, sharp enough to cleave through a train\
        \ car. While in Photon Breaker Mode, the Faiz Blaster can shoot a stream of\
        \ energy and perform a similar, but more powerful Exceed Charge called Super\
        \ Strengthen Crimson Smash), Deconstruction through Enhanced Heat Manipulation\
        \ (The energy running through his body is comparable to the energy from the\
        \ Faiz Edge\u2019s Medium Mode. It is possible to incinerate Orphnoch with\
        \ a single touchKamen Rider Zukan), Light Manipulation with the Faiz Blaster\
        \ (The blade of the Faiz Blaster is described as light basedKamen Rider Zukan.\
        \ Can also shoot photon bullets), Resistance to Fire Manipulation and Density\
        \ Manipulation (The armor can withstand heat comparable to the surface of\
        \ the sun as well as depths as deep as 2500 metersKamen Rider Zukan)"
