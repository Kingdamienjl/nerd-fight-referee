- id: claim-standard-equipment-95ae2256
  section: equipment
  axis: equipment
  text: "*SB-555B Faiz Driver: Takumi\u2019s transformation device which allows him\
    \ to transform into Kamen Rider Faiz. The driver is equipped with a multitude\
    \ of weapons and attachments that Faiz could use as weapons. **SB-555P Faiz Phone:\
    \ A device which is used in conjunction to transform the user into Faiz. The phone\
    \ can turn into its blaster form which can shoot in two modes, single and burst.\
    \ Single is used for persisted shooting while burst fire 3 consecutive shots.\
    \ It could also potentially summon Kamen Rider Delta\u2019s Jetslinger. **SB-555C\
    \ Faiz Shot: A digital camera tool which is used to increase Faiz\u2019s striking\
    \ strength. Takumi could also use the Faiz Shot as a normal camera. Having a 2000x\
    \ zoom feature, can shoot videos, capture pictures and see in both night and x-ray\
    \ vision. Although it\u2019s main used is to use it \u201CKnuckle Mode\u201D **SB-555H\
    \ Faiz Pointer: A digital torch device which can be attached to Faiz\u2019s foot\
    \ to shoot a laser to hit a target upwards of 2 kilometers away. Once it makes\
    \ contact with a target, the laser will turn into a hardlight cone for Faiz to\
    \ perform his finisher, the Crimson Smash. It can also be attached to the Faiz\
    \ Phone as a scope to increase its accuracy. *SB-555V Auto Vajin: The Auto Vajin\
    \ is Faiz\u2019s main bike. It can travel at a maximum speed of 380 km/h and a\
    \ maximum output of 450 horsepower. It\u2019s handle can be pulled to release\
    \ the Faiz Edge. The Auto Vajin can also transform into an humanoid mecha with\
    \ it\u2019s Battle Mode. **Battle Mode: The Auto Vajin\u2019s mecha form. It can\
    \ fly and has a maximum output of 2,500 horsepower. It\u2019s main way of fighting\
    \ is by shooting with the Buster Wheel, a gatling gun which shoots 96 12mm bullets\
    \ per second. The Buster Wheel can also be used as a shield. **SB-555H Faiz Edge:\
    \ A laser sword which comes from the Auto Vajin. The Faiz Edge has 4 modes, Low,\
    \ Medium, High and Ultimate. It also can emit energy waves which creates an anti-gravity\
    \ field around the target to prevent them from moving. *SB-555W Faiz Axel: A wristwatch\
    \ which Takumi uses to transform into Faiz\u2019s upgraded form, Faiz Axel. Faiz\
    \ Axel gives Takumi a massive increase to his speed, boosting it to the point\
    \ where Faiz Axel is 1000x times faster than normal Faiz. *SB-555T Faiz Blaster:\
    \ A trunk box shaped object that Takumi uses to transform into Faiz\u2019s final\
    \ form, Faiz Blaster. It can use photons in various ways which is shown in it\u2019\
    s two modes, Buster and Breaker. Buster mode sends its photon energy to the barrel,\
    \ allowing the user to shoot light bullets. The Breaker mode sends the photon\
    \ energy to the blade, giving it power 15 times that of the Faiz Edge."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
