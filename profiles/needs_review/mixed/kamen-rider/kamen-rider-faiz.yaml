  intelligence:
    text: 'Gifted (Fighting mainly with the Faiz Gear, the weakest but most versatile
      and least taxing of the three Rider Gears, Takumi managed to make the most of
      the suit''s numerous functions, weapons and forms, allowing him to respond to
      a variety of situations and take on a number of Orphnochs successfully. In a
      universe in which the Orphnochs won the battle against humanity, Faiz was skilled
      enough to fight off multiple Riotroopers at once and defeat against the likes
      of Psyga, despite the latter being a skilled fighter wielding a superior DriverKamen
      Rider 555: Paradise Lost)'
