      \ do in other forms), Energy Projection (The Medagabryu allows him to perform\
      \ the Strain Doom blast), Void Manipulation (The Medagaburyu Axe has the ability\
      \ to damage, if not completely destroy, the Core Medals of the other Greeed.\
      \ The Core Medals itself are forms of artificial life and manifestations of\
      \ desire, the Purple Core Medals are antithesis to and can completely erase\
      \ other Core Medals), Enhanced Senses (With the Taka Eye, OOO can identify a\
      \ human 8km away and distinguish objects 0.02 mm close to him. He also has night\
