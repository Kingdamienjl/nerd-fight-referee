      \ control, being forced into the form by the Purple Medals themselves which\
      \ stuck him in a raging state, though even before OOO gained complete control\
      \ over the form, he was able to call upon these Medals consensually and even\
      \ detransform from Putotyra when Ankh reached out to him. He continues to become\
      \ stronger throughout the series, being able to catch up with the Greeed who\
      \ continue to gain more power overtime), Summoning (OOO can summon Candroids\
      \ from the Ride Vendor), Electricity Manipulation (The Denkiunagi Candroid can\
      \ release electric shocks), Supernatural Willpower (OOO refused to attack Ankh\
      \ even when his body was possessed by Goda, causing his body to stop moving),\
      \ Limited Resurrection (OOO could use his own death to reconstruct Ankh's Core\
      \ Medal, bringing him back to life), Spatial Manipulation and Durability Negation\
      \ with Medajaribur (Can use Medajaribur to fire waves of energy and slice through\
      \ not only targeted opponents, but the fabric of reality itself), Regeneration\
      \ (Mid-Low; The OOO armor has a quick regeneration function. He can repair light\
      \ damage in a blink of an eye. Varies, depending on how many Cell Medals one\
      \ has, Low-High at most with Greeed powers), Damage Reduction (OOO armor minimizes\
      \ damage dealt to it), Summoning (While OOO could originally only summon the\
