- id: claim-powers-and-abilities-b6f696c4
  section: abilities
  axis: hax
  text: "* Kamen Rider Physiology ** Vehicular Mastery (Could quickly master Road\
    \ Sector, while the world's greatest racers failed to)' * Longevity (Gorgom Mutants\
    \ can live for 50,000 yearsKamen Rider Black Episode 2 Monster Party) * Limited\
    \ Acausality (Type 1; The future self of RX was unaffected by his past being reversed\
    \ into Black, however, he would disappear if his past self ever diesKamen Rider:\
    \ Run All Over the World) * Extrasensory Perception (Can sense bloodlust from\
    \ his enemiesKamen Rider Black Episode 18 Sword Saint Bilgenia!!) * Electricity\
    \ Manipulation (Kotaro could survive electricity enough to kill a normal humanKamen\
    \ Rider Black Episode 1 Black!! Transformation) * Madness Manipulation (Type 1;\
    \ Resisted Flea Mutant's Coward Hormone, which drives people insane and turn them\
    \ mentally unstableKamen Rider Black Episode 4 The Devil's Laboratory) * Sound\
    \ Manipulation (Endured for prolonged time the destructive sound waves from Cicada\
    \ MutantKamen Rider Black Episode 8 The Devil's Trill) * Morality Manipulation\
    \ (Unaffected by being exposed to Tortoise Mutant's light, which causes humans\
    \ to return to their evil instinctsKamen Rider Black Episode 15 The Targeted Bizarre\
    \ Academy) * Status Effect Inducement (Paralysis; Overpowered Bishum's binding\
    \ stareKamen Rider Black Episode 45 Suspicious Flower Bishum's Death) * Space-Time\
    \ Manipulation, Time Stop, Age Manipulation and Causality Manipulation (Can take\
    \ slashes from the Satansaber, who cuts through space-time.Satansaber Zukan Profile\
    \ Kotaro is immune to Cobra Mutant's time manipulation, which can freeze time,\
    \ accelerate and rewind time, to the point that it changes the weather, and even\
    \ reverse people and objects, such as turning cars into wagons, modern clothes\
    \ to feudalistic clothes, or people's agesKamen Rider Black Episode 41 The Dangerous\
    \ Time Thief) * Void Manipulation (Could move in a place beyond time and spaceKamen\
    \ Rider Black Episode 41 The Dangerous Time ThiefMamoru Fukuzawa Zukan Profile)\
    \ * Mind Manipulation (Could resist Centipede Mutant's videos and eye flashes,\
    \ which emits a special wavelength that directly affects cranial nerves, turning\
    \ the targets into slavesKamen Rider Black Episode 39 The Idol's Evil Power) All\
    \ previous abilities enhanced. * Statistics Amplification (Can increase the destructive\
    \ power of his techniques with the KingstoneKamen Rider Black Zukan Profile) *\
    \ Enhanced Acrobatics (Can jump up to 30 metersKamen Rider Black Zukan Profile)\
    \ * Energy Manipulation (His power stripes empowered by the Kingstone can release\
    \ energy directly and escape from the bondage of enemiesKamen Rider Black Zukan\
    \ Profile) * Non-Standard Breathing (Type 1; His lungs store compressed air to\
    \ allow underwater activity for 10 minutesKamen Rider Black Zukan Profile) * Enhanced\
    \ Senses, Extrasensory Perception and Clairvoyance (Awareness, Hearing, Vision\u3010\
    Telescopic, Night, X-Ray, Soul & Neutral\u3011; Multi-Eye has a telescope to see\
    \ up to one kilometer ahead, broadsight for wide field of vision, noctovision\
    \ to see through dark areas,Kamen Rider Black Zukan Profile and can perform clairvoyance\
    \ and partial magnification functions.Kamen Rider Official Data File Alert Point\
    \ detecs atmospheric changes and blinks when it senses the presence of enemies,\
    \ being able to detect hidden foes. His sensitive ears can hear whispers from\
    \ 500 meters away, while also catching normal speech and sound waves.Kamen Rider\
    \ Black Zukan Profile Multi-Eye can also see through mutant's shapeshifting,Kamen\
    \ Rider Black Episode 39 The Idol's Evil Power possession,Kamen Rider Black Episode\
    \ 42 Tokyo - Big Monster Gathering or invisible lasersKamen Rider Black Episode\
    \ 43 The Monster Farm's Duel!) ** Information Analysis and Precognition (Multi-Eye\
    \ can instantly detect enemy weaknesses. Rider Sensor's red part mesures temperature,\
    \ and the silver part detects air flow and humidity to analyze the position and\
    \ movement of enemiesKamen Rider Black Zukan Profile) * Instinctive Action (Vital\
    \ Charger's mechanisms will work regardless of the will of Kamen Rider BlackVital\
    \ Charger Zukan Profile) * Life Manipulation and Soul Manipulation (As a Century\
    \ King, he should be able to remove the Kingstone of another,Kamen Rider Black\
    \ Episode 51 Gorgom's Last Day which is both the lifeKamen Rider Black Zukan Profile\
    \ and soulKamen Rider Black RX Episode 2 Covered in Light! RX of a Century King)\
    \ * Pressure Points and Status Effect Inducement (Rider Chop attacks the enemy's\
    \ vital points with the fingertips or weakens the power to stun the opponentKamen\
    \ Rider Official Data File) * Afterimage Creation (Leaves afterimages upon releasing\
    \ a Rider Punch or Rider KickKamen Rider Black Episode 17 Kyoko's Strange Dream)\
    \ * Fire Manipulation and Explosion Manipulation (Upon releasing a finisher against\
    \ his enemy, it turns the target to catch fire and then explode) * Summoning (Can\
    \ summon his machines Battle HopperKamen Rider Black Episode 1 Black!! Transformation\
    \ and Road Sector,Kamen Rider Black Episode 13 Mama's the Monster Raisi"
