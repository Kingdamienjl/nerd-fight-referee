    \ *Analytical Prediction (The Red EyesTV Asahi are able to overlay information\
    \ to visualize landing point and predicted trajectory) *Danmaku (Magnum Users\
    \ have been shown to constantly bombard enemies with bullets, whether it be from\
    \ their gunbarrels from their armor, and/or from the Magnum Shooter 40XKamen Rider\
    \ Geats Episode 1. The Gunslinger Arms, the forearm armor that house the Armored\
    \ Guns, specialises in handling the Magnum Shooter 40X, enabling ultrafast firing\
    \ by reducing the lag down to seven decimal places. The Magnum Shooter 40X itself\
    \ can fire up to 200,000 shots per minute, or 3333 shots a second, during rapid\
    \ fire.) *Homing Attack (Magnum Users' bullets can home in onto their opponents,\
    \ which complement the danmaku aspect of MagnumKamen Rider Geats Episode 12) *Electro-Magnetism\
    \ Manipulation (The Magnum Shooter 40XTV Asahi uses electromagnetic properties\
    \ to fire its shots) *Forcefield Creation (Can form barriers from his Gunslinger\
    \ ArmsKamen Rider Geats Episode 6) -Optional"
