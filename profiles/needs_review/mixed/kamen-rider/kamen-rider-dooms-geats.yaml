      source_id: mediawiki-4892355
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: 'While this Ace should also have whatever the current Ace has, these
        are what he has shown to use:, Desire Driver: Ace''s transformation driver,
        allowing him to turn into Kamen Rider Geats. The Driver has two insertion
        slots for any Raise Buckles to power Geats with their respective abilities.,
        ID Core (Dooms Geats): An item used to uniquely identify the Kamen Rider,
        which in this case is Dooms Geats. It contains his spark, ID Core (Dooms Geats),
        Buckles: Buckles are items that Riders can use to attach to the Desire Driver,
        giving them new abilities as well as summoning their respective gear., Dooms
        Geats: After witnessing his mother in a deteriorating state, his rage awakened
        his spark powers, thereby creating the Boost Mark III buckle that allows him
        to assume its respective form. After accepting himself, he''s able to split
        this buckle to fully activate its true power, Dooms Geats Buckle, Unnamed
        Weapon: A powerful weapon almost identical to the Geats Buster QB9 that is
        used in Geats''s Mark IX form. Like the Geats Buster QB9, it can interchange
        between two different modes, that being the Railgun Mode and Blade Mode respectively.
        Although, despite the different modes, both modes allow him to fire 900,000
        shots per minute, Geats Riders can use two standard buckles at once to mix
        and match between forms and abilities. As an example, Geats'' default form
        is the MagnumBoost form, utilising Magnum as his upper armor and Boost as
        the lower armor., A Revolve-On technique allows Geats Riders to reverse the
        position of the buckles as a part of their mix and match (e.g: BoostMagnum).,
        The stronger buckle dictates the overall stats of the Rider. For example,
        using Monster Buckle with any other buckle would still have Geats use Monster''s
        stats.'
      source_id: mediawiki-4892355
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Extraordinary Genius, Likely Supergenius, Nigh-Omniscient in True Form
        Ace is a methodical, sharp-witted strategist and the undefeated champion of
        the DGP that spanned 2,000 years across at least four known incarnations of
        himself. He is a master of long-term planning, being capable of reclaiming
        his memories and thereby returning back to the DGP without his prior memories,
        deciphering the Jyamato language with minimal clues to solve a mind-boggling
        puzzle, and deducing complex conspiracies about him from behind his back within
        seconds. His foresight is unparalleled, having manipulated the DGP over several
        lifetimes to secure the power of Boost Mark II. Upon awakening his spark,
        he is able to utilise his newfound Creation powers, granting him the ability
        to manipulate future technology and restructure the universe. His conceptual
        abilities are now fundamental to the world''s preservation, allowing him to
        materialize ID Cores and grant Rider powers at will. For example, he was able
        to bestow Neon''s Rider Power to her by overriding the Gya-Go ID Core into
        hers despite Kamen Riders not being able to use different corresponding ID
        Cores. A Kamen Rider''s power is linked to their fundamental universe, without
        it, a universe would fall apart. Ace has been able to warp his own timeline
        to his own image as well as override Suel''s existence despite it being in
        a higher dimension He then planned his own ascension into true godhood immediately
        after awakening his powers.Kamen Rider Geats Episode 49 - Daybreak I: Here
        Comes The Highlight!) In his true form, he would be comparable to the Golden
        Fruit Bearer, who had merged with all of existence within the Kamen Rider
        Multiverse. Over the course of 2000 years, Ace has never lost a DGP and retains
        his knowledge and skills obtained over those years. Has shown to be an expert
        marksman and is proficent is numerous weapons such as greatswords, katanas,
        shields, and hammers. Very early into the shows run, Ace was able to match
        Revice down to a stalemate. Ace himself is far more skilled than Tycoon, who,
        over the course of a few weeks, went from someone who had no combat experience
        to going to and to with Kenzan. This would put Ace within the level of highly
        skilled Riders such as Saber and Zero-One. The former being able to compress
        hundreds of years of swordsmanship and the latter being able to predict hundreds
        of trillions of combat data, both being able to do so within a few seconds.'
      source_id: mediawiki-4892355
      provider_id: vsbattles
      authority: high
      confidence: 0.75
