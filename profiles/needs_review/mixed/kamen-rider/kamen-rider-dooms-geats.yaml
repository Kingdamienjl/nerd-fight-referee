- id: claim-standard-equipment-0498d18a
  section: equipment
  axis: equipment
  text: 'While this Ace should also have whatever the current Ace has, these are what
    he has shown to use: *Desire Driver: Ace''s transformation driver, allowing him
    to turn into Kamen Rider Geats. The Driver has two insertion slots for any Raise
    Buckles to power Geats with their respective abilities. *ID Core (Dooms Geats):
    An item used to uniquely identify the Kamen Rider, which in this case is Dooms
    Geats. It contains his spark, and can be inserted into any other Driver as long
    as he has the ID Core. DesireDriver.png|Desire Driver IDCoreDoomsGeats.png|ID
    Core (Dooms Geats) *Buckles: Buckles are items that Riders can use to attach to
    the Desire Driver, giving them new abilities as well as summoning their respective
    gear. **Dooms Geats: After witnessing his mother in a deteriorating state, his
    rage awakened his spark powers, thereby creating the Boost Mark III buckle that
    allows him to assume its respective form. After accepting himself, he''s able
    to split this buckle to fully activate its true power, resulting in the two Boost
    Mark IX buckle from the combined Mark III one. Used from Yearning Arc onwards.
    DoomsGeatsBuckle.png|Dooms Geats Buckle *Unnamed Weapon: A powerful weapon almost
    identical to the Geats Buster QB9 that is used in Geats''s Mark IX form. Like
    the Geats Buster QB9, it can interchange between two different modes, that being
    the Railgun Mode and Blade Mode respectively. Although, despite the different
    modes, both modes allow him to fire 900,000 shots per minute. Note: *Geats Riders
    can use two standard buckles at once to mix and match between forms and abilities.
    As an example, Geats'' default form is the MagnumBoost form, utilising Magnum
    as his upper armor and Boost as the lower armor. *A Revolve-On technique allows
    Geats Riders to reverse the position of the buckles as a part of their mix and
    match (e.g: BoostMagnum). *The stronger buckle dictates the overall stats of the
    Rider. For example, using Monster Buckle with any other buckle would still have
    Geats use Monster''s stats.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
