  intelligence:
    text: 'Extraordinary Genius, Likely Supergenius, Nigh-Omniscient in True Form
      Ace is a methodical, sharp-witted strategist and the undefeated champion of
      the DGP that spanned 2,000 years across at least four known incarnations of
      himself. He is a master of long-term planning, being capable of reclaiming his
      memories and thereby returning back to the DGP without his prior memories, deciphering
      the Jyamato language with minimal clues to solve a mind-boggling puzzle, and
      deducing complex conspiracies about him from behind his back within seconds.
      His foresight is unparalleled, having manipulated the DGP over several lifetimes
      to secure the power of Boost Mark II. Upon awakening his spark, he is able to
      utilise his newfound Creation powers, granting him the ability to manipulate
      future technology and restructure the universe. His conceptual abilities are
      now fundamental to the world''s preservation, allowing him to materialize ID
      Cores and grant Rider powers at will. For example, he was able to bestow Neon''s
      Rider Power to her by overriding the Gya-Go ID Core into hers despite Kamen
      Riders not being able to use different corresponding ID Cores. A Kamen Rider''s
      power is linked to their fundamental universe, without it, a universe would
      fall apart. Ace has been able to warp his own timeline to his own image as well
      as override Suel''s existence despite it being in a higher dimension He then
      planned his own ascension into true godhood immediately after awakening his
      powers.Kamen Rider Geats Episode 49 - Daybreak I: Here Comes The Highlight!)
      In his true form, he would be comparable to the Golden Fruit Bearer, who had
      merged with all of existence within the Kamen Rider Multiverse. Over the course
      of 2000 years, Ace has never lost a DGP and retains his knowledge and skills
      obtained over those years. Has shown to be an expert marksman and is proficent
      is numerous weapons such as greatswords, katanas, shields, and hammers. Very
      early into the shows run, Ace was able to match Revice down to a stalemate.
      Ace himself is far more skilled than Tycoon, who, over the course of a few weeks,
      went from someone who had no combat experience to going to and to with Kenzan.
      This would put Ace within the level of highly skilled Riders such as Saber and
      Zero-One. The former being able to compress hundreds of years of swordsmanship
      and the latter being able to predict hundreds of trillions of combat data, both
      being able to do so within a few seconds.'
    source_ids: *id002
    confidence: 0.8
