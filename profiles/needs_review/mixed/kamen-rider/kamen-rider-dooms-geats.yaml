- id: claim-powers-and-abilities-233d75f0
  section: abilities
  axis: hax
  text: "This Ace is the future version of Ace Ukiyo, and therefore should possess\
    \ every ability the current Ace has, including: *Kamen Rider Physiology \u25BE\
    \ *Weapon Mastery (Is able to use any Raise Buckles given by the Desire Grand\
    \ Prix efficiently, no matter how unconventionalRider Geats Episode 2 - Encounter\
    \ I: Treasure Hunting and Thievery theyRider Geats Episode 2 - Encounter I: Treasure\
    \ Hunting and Thievery areKamen Rider Geats Episode 3 - Encounter II: Zombie Hunting.\
    \ He is also proficient with a katana, although it is likely that he retains the\
    \ skill of his previous incarnation from Japan's Sengoku Era.) *Vehicular Mastery\
    \ (Could do thisKamen Rider Geats Episode 1 - Daybreak F: Invitation to the Rider)\
    \ *Martial Arts (Has mastered every fighting style due to reincarnating across\
    \ various eras and remembering all of them) *Superhuman Precision (Did thisKamen\
    \ Rider Geats Episode 19 - Divergence III: Vote! Who Is the Dezastar! without\
    \ the analytical abilities of the Magnum Buckle) *Preparation (Has shown to have\
    \ various plans just in case a certain scenario would ever occurs, such has him\
    \ being eliminated from the DGP and losing his memories as a result, or getting\
    \ a boost in power by gaining the resolve to protect others. These plans can take\
    \ weeks, months, and even centuries before being completed) *Supernatural Luck\
    \ (The Ace of Luck, who is a fragment of Ace, experiences an unnatural amount\
    \ of luck. Accidentally kicking rocks down to hit his attackers, falling down\
    \ on a floaty to cushion his fall, and being saved randomly by a passing by Sae\
    \ Ganaha, who has been MIA ever since her elimination from the DGPKamen Rider\
    \ Geats: 4 Aces and the Black Fox) * Instinctive Action (Despite having his intelligence\
    \ taken away by Mela, the other versions of Ace are capable of operating to some\
    \ capacity. The Ace of Hearts was even able to fight and defeat Mela despite the\
    \ latter obtaining his original version's intelligence and skill) *Spark (Transcended\
    \ God Of Genesis; Ace transcended the the cycle of life and death after getting\
    \ killed by Tsumuri, becoming a true deity)\u25BE *Supernatural Willpower (Determination\
    \ is Ace's greatest aspect, his determination to meet his mother and find the\
    \ truth about the DGP is what made him go through several incarnations for over\
    \ 2000 years.Kamen Rider Geats Episode 28 - Lamentation IV: Bonding LaserBoost!\
    \ Ace of Heart, one of the four iterations of Ace who possessed Ace's determination\
    \ to fight, is the one who defeated Mela, the Godkiller who stole his power, his\
    \ intelligence, and his luck. Ace's own unwillingness to let go of his memories\
    \ of his mother unconsciously activated his powers of reality warping, causing\
    \ him to reincarnate into a new individual upon each death while retaining all\
    \ of the memories from his previous livesKamen Rider Geats Episode 38 - Yearning\
    \ F: The Nine-Tailed White Fox!. Although his main motivation has been accomplished,\
    \ his willpower remains his stronger asset) *Creation & Restoration (Ace is also\
    \ able to create anything out of thin air, and reconstruct broken objects back\
    \ to pristine conditions. Geats can weaponize this in combat by breaking through\
    \ floors and reconstructing them in such a way that it can trap his opponents,\
    \ among many other methods. This ability is broad due to being derived from the\
    \ reality-warping aspects of Spark) * Law Manipulation (3 Layers; Should be equal\
    \ to the Ace from the future, whose law manipulation is superior to Buffa and\
    \ every other Spark user to date. Buffa was able to overwrite the law manipulation\
    \ of the Goddess of Creation to retain the powers of the Jyamashin, a form where\
    \ he's completely invulnerable to any attacks and abilities from any Kamen Riders\
    \ throw at him. Said form aided in the creation of the stronger Plosion Rage form,\
    \ by combining said power with his dormant Jyamashin abilities, without having\
    \ to lose his humanity from the latter power set. Despite being considered a Kamen\
    \ Rider, this Ace is able to damage Buffa in his Plosion Rage form [as seen by\
    \ the sparks produced from his attacks, signifying damage done], and his Spark\
    \ would've been enough to erase his power, had it not been for the current Ace\
    \ intervening) *Time Manipulation (Can reverse the flow of time, which he usually\
    \ uses in tandem with his creation and restoration abilities.Kamen Rider Geats\
    \ Episode 43 - Genesis V: My Name is Gya-Go! He can also stop time, as seen in\
    \ his fight against Jyamato GazerKamen Rider Geats: Final Stage) **Minor Sound\
    \ Manipulation by Breaking the Fourth Wall (Ace can also shush the opening song\
    \ of the series as it was playing during their fight, while simultaneously stoppoing\
    \ time around him long enough for him to counterattack Suel Gazer) *Social Influencing\
    \ (Reputation; Known as \u201CThe Star of the Stars of the Stars\u201D and is\
    \ a worldwide super celebrity. Has a mass following of peopleRider Geats Episode\
    \ 2 - Encounter I: Treasure Hunting and Thievery, and due to his wish, everyone\
    \ on Earth knows his status) *Acausality (Type 1; N"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
