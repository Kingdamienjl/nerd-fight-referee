        \ be killed to preserve their existence for the next battle), Self-Sustenance\
        \ (Type 2 & 3), Shapeshifting and Power Mimicry (Chalice Rouzer can transform\
        \ the user into other Undeads), Sealing (Can seal other Undead), Extrasensory\
        \ Perception (Scales to Hajime), Transformation (With Blay Buckle), Resistance\
        \ to Explosion Manipulation (Comparable to other Undeads who couldn\u2019\
        t explode even after a finisher) All human abilities, Sealing with Common\
        \ Blank cards, Statistics Amplification (By himself, Kenzaki can gain more\
        \ power for the sole purpose of protecting others. Slash Lizard can increase\
        \ the Blay Rouzer's power. Beat Lion increases the power of punches. Tackle\
        \ Boar increases the power of tackles. Mach Jaguar enhances speed. Kick Locust\
        \ increases the power of flying sidekicks), Rage Power (His hatred towards\
        \ Hajime was stated to have been converted into fighting strength, causing\
        \ his fusion rates to rise), Empathic Manipulation (The rising of Kenzaki's\
        \ fusion rate through hatred passively caused Hajime to become enraged, prompting\
        \ him to start fighting), Regeneration (Mid-Low; Blade's armour can self-repair\
        \ and such was the case after receiving an attack that left a large opening\
        \ on its helmet) Electricity Manipulation via Thunder Deer (Supplements the\
        \ next attack with electricity), Transmutation and Attack Reflection via Metal\
        \ Trilobite (Transmutes body into organic metal to reduce damage. This increases\
        \ his durability to the point where attacks will outright bounce right from\
        \ Blade's body), Magnetism Manipulation (With Magnet Buffalo as it allows\
        \ him to temporarily have control over magnetism), Time Stop (Via Time Scarab\
        \ as it can freeze time in place in a certain radius) and Explosion Manipulation\
        \ (His attacks have a tendency of causing explosions), Damage Boost through\
        \ Gravity Manipulation (The Hammer Shell uses gravitational energy to increase\
        \ the attack power of his attack), Enhanced Senses (His Organscope has a 500x\
        \ zooming function, a fluoroscopic function, and a high-sensitivity night-vision\
        \ function. The Organ Sonar can hear objects from 5 km away), Information\
        \ Analysis (The Trident Feeler G is capable of capturing information that\
        \ Kenzaki needs. He was able to measure Hajime's power), Reactive Power Level\
        \ (After measuring Hajime's power, Kenzaki was able to increase his power,\
        \ causing a spike in the Rider System), Summoning (Can call the Blue Spader\
