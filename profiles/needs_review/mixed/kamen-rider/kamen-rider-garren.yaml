        \ All powers of Ace Form enhanced, Flight All powers of Ace Form enhanced,\
        \ Can activate all Spade's Rouze Cards which they fused in this form, Energy\
        \ and Light Manipulation (With Royal Straight Flush), Fire, Air and Ice Manipulation\
        \ (When using Four Card), Time Manipulation (With Time Scarab that allows\
        \ him the power to control the time within a certain radius), Immortality\
