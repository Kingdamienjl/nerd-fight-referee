    - field: intelligence
      value: Gifted (Was originally a researcher of BOARD's who graduated from the
        Sazahaibu University. In the novel, Tachibana is revealed to have become the
        head of BOARD, now using the company's resources to help others. As a Kamen
        Riders, Tachibana fought against Undead alongside Blade and gained a lot of
        experience. In Blade, the riders react to how strong their opponents are.
        As Kenzaki described it, when he first fought Chalice, he instantly knew that
        Chalice was a war machine. Kenzaki adapted to Chalice's fierce fighting style
        and held his own against him and Metal Trilobite. This should apply to Garren
        too. Garren has defeated many high level Undeads such as Giraffa Undead and
        Peacock Undead. He was comparable to Kamen Rider Chalice at times and has
        defeated Kamen Rider Leangle numerous times. He also defeated Cerberus Undead,
        who overpowered Giraffa Undead, alongside Blade, Chalice and Leangle)
