    - field: standard_equipment
      value: "Garren Buckle: Tachibana\u2019s henshin device which allows him to transform\
        \ into Kamen Rider Garren After transformation, attached to the belt is his\
        \ personal weapon, the Garren Rouzer, Rouze Card: Allow Garren to perform\
        \ special attacks., Bullet Armadillo: A Rouze Card of the 2 of Diamonds, the\
        \ Armadillo Undead. It is used to enhance Garren\u2019s shooting attacks,\
        \ allowing him to kill previously comparable enemies in a few shots., Upper\
        \ Frog: A Rouze Card of the 3 of Diamonds, the Frog Undead. It is used to\
        \ enhance Garren\u2019s striking strength with a fiery uppercut, knocking\
        \ back enemies a fair distance and dealing massive damage., Rapid Pecker:\
        \ A Rouze Card of the 4 of Diamonds, the Pecker Undead. It is used to greatly\
        \ increase the fire rate with the Garren Rouzer., Drop Whale: A Rouze Card\
        \ of the 5 of Diamonds, the Whale Undead. It is used to enhance his dropkicks,\
        \ allowing him to greatly damage comparable, if not superior, characters like\
        \ Chalice., Firefly: A Rouze Card of the 6 of Diamonds, the Firefly Undead.\
        \ It is used to supplement the Garren Rouzer\u2019s attacks with fire., Rock\
        \ Tortoise: A Rouze Card of the 7 of Diamonds, the Tortoise Undead. It is\
        \ used to transmute his body into stone. It\u2019s likely comparable to Blade\u2019\
        s Metal Trilobite., Scope Bat: A Rouze Card of the 8 of Diamonds, the Bat\
        \ Undead. It is used to enhance Garren\u2019s senses as well as his accuracy.\
        \ His vision is increased to the point where he\u2019s capable of tracking\
        \ light bullets., Gemini Zebra: A Rouze Card of the 9 of Diamonds, the Zebra\
        \ Undead. It is used to create a copy of the user., Thief Chameleon: A Rouze\
        \ Card of the 10 of Diamonds, the Chameleon Undead. Its power is to copy an\
        \ opponent\u2019s form or attack. Since the Chameleon Undead was capable of\
        \ turning invisible, Garren is possibly also able to turn invisible., Rouze\
        \ Absorber: Like Kenzaki\u2019s Rouze Absorber, it is a device which is attached\
        \ to Garren\u2019s wrist, it holds a maximum of three Rouze Cards, a category\
        \ Jack, and King. These cards are capable of enhancing the user\u2019s armour,\
        \ Blade and Garren used this to change their Ace forms into Jack Form. Garren\
        \ can further enhance this by using the Queen and King cards to evolve into\
        \ King Form., Fusion Peacock: A Rouze Card of the Jack of Diamonds, the Peacock\
        \ Undead. It is used with the Absorb Serpent card to transform the user into\
        \ their Jack Form., Absorb Serpent: A Rouze Card of the Queen of Diamonds,\
        \ the Serpent Undead. It is used with the Fusion Eagle card to transform the\
        \ user into their Jack Form. However, Tachibana could also be used with the\
        \ Evolution Giraffe card to evolve into King Form., Evolution Giraffe: A Rouze\
        \ Card of the King of Diamonds, the Giraffe Undead. Tachibana would use it\
        \ with the Absorb Serpent card to evolve his armor into its King Form. While\
        \ he does have the two components to achieve King Form, it is unlikely that\
        \ he could be due to his Fusion Level being not as high as someone like Kenzaki.,\
        \ Garren Rouzer: His personal weapon, the Garren Rouzer is a gun which converts\
        \ stored energy into light bullets. The back end of the gun acts as a tray\
        \ which holds cards which contain the power of Undeads, monsters that Garren\
        \ has defeated previously. The Garren Rouzer is capable of using up to 3 Rouze\
        \ Cards at a time., Garren Rouzer (Enhanced Type): The personal weapon of\
        \ Garren\u2019s within his Jack Form. This version of the Garren Rouzer is\
        \ all around superior to the normal version, although it now has a blade under\
        \ the muzzle."
