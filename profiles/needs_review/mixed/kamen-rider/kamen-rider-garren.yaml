- id: claim-powers-and-abilities-81877cb5
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Transformation with Garren Buckle, Weapon\
    \ Mastery, Martial Arts All previous abilities, Acrobatics, Explosion Manipulation\
    \ (His attacks have a tendency of causing explosions), Sealing with Common Blank\
    \ cards, Statistics Amplification via Bullet Armadillo (Increases the power of\
    \ the Garren Rouzer's shots), Upper Frog (Increases the power of uppercuts), Rapid\
    \ Pecker (Increases the Garren Rouzer's rate of fire) and Drop Whale (Increases\
    \ the power of drop-kicks), Fire Manipulation via Fire Fly, Transmutation and\
    \ Attack Reflection via Rock Tortoise (Transmutes body into organic stone to reduce\
    \ damage and is comparable to Blade's Metal Trilobite), Enhanced Senses (Like\
    \ Blade, Garren\u2019s Organscope has a 500x zooming function, a fluoroscopic\
    \ function, and a high-sensitivity night-vision function. The Organ Sonar can\
    \ hear objects from 5 km away), higher via Scope Bat, Duplication via Gemini Zebra,\
    \ Power Mimicry, Shapeshifting, and Possibly Invisibility via Thief Chameleon\
    \ (Copies an opponent's form or attack. The Chameleon Undead was able to turn\
    \ invisible and Garren should be able too), Light Manipulation (The bullets fired\
    \ from his gun are described as light bullets), Regeneration (Mid-Low; Like Blade,\
    \ Garren\u2019s armor has a self-healing function and should be comparable to\
    \ Blade\u2019s own regeneration), Damage Boost thorough Gravity Manipulation (The\
    \ Hammer Shell uses gravitational energy to increase the attack power of his attack),\
    \ Information Analysis (The Info Feeler A is capable of capturing information\
    \ that Tachibana needs), Summoning (Can call the Red Rambus by communicating it\
    \ with brainwaves), Magnetism Manipulation through the Red Rambus (The Red Rambus\
    \ emits a strong magnetic force), Resistance to Temperature Manipulation (The\
    \ Mithril Armor Leather is capable of keeping the user\u2019s body temperature\
    \ uniform under any circumstances), Fragrance Manipulation (His Cure Regulator\
    \ is a device that filters all toxins), Electricity Manipulation (Scales to Blade,\
    \ although to a lesser degree), Poison Manipulation (Was unfazed by the Titan\
    \ Undead\u2019s poison, only being affected by its mind control), Limited Resistance\
    \ to Mind Manipulation (Reisted the Titan Undead\u2019s mind control longer than\
    \ Kenzaki) All former powers of Ace Form enhanced, Flight All powers of Ace Form\
    \ enhanced, Can activate all Diamond's Rouze Cards which they fused in this form,\
    \ Energy and Light Manipulation (With Royal Straight Flush), Fire, Air and Ice\
    \ Manipulation (When using Four Card), Immortality Negation (Types 2 and 8; Comparable\
    \ to Blade, who killed Jashin 14 along with the Albino Joker), Greater Enhanced\
    \ Senses (King Form\u2019s hearing is twice as much as Ace Blade), Pseudo-Flight\
    \ through Density Manipulation (The Gravity Generator controls the weight of Blade\
    \ and can allow simple flight), Forcefield Creation (The King Rouzer can release\
    \ an energy barrier to protect it from external shocks), Temperature Manipulation\
    \ and Vibration Manipulation (Garren's gun should be comparable to the King Rouzer,\
    \ which emits high-frequency vibrations and heat radiation. His armor passively\
    \ emits heat), Magnetism Manipulation (Garren's gun should be comparable to the\
    \ King Rouzer, which, is fixed to Blade\u2019s hand by magnetic force by using\
    \ the internal magnet unit), Greater Resistance to Electricity Manipulation (Able\
    \ to resist Trial D's electricity)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
