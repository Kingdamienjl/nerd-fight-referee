    endless barrages of light bullets), Existence Erasure (Arc's demon power can be
    increased in several ways, creating attacks that can return all substances to
    nothing), Deconstruction (Legend Arc's light bullets can erase everything around
    it), Flight in Legend Arc, Danmaku, Resistance to Damage Reduction (Arc's Dark
    Emperor Stone makes sure his demonic power is always at it's utmost power), Self-Destruction
