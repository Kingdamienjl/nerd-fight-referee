- id: claim-powers-and-abilities-790ebbec
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Transformation with Ixa Belt and Ixa\
    \ Knuckle, Energy Manipulation, Weapon Mastery, Enhanced Senses via Hunting Glass\
    \ (The eyes that possess a 180\xB0 field of view in front, and can capture and\
    \ record enemy movement. It also contains a type of night vision scope function\
    \ that can even see in darkness with zero visibility, or see through a 5 meter\
    \ thick iron plate) and GPS Bit (Allow him to know location of the target), Purification\
    \ via Poisona Filter (Type 1; Can purify all toxins to supply safe air to the\
    \ wearer), Underwater Breathing via Masker Regulator (Type 3; Can dive into underwater\
    \ up to 6 hours), Self-Sustenance (Type 1; Can survive being in space), Light\
    \ Manipulation via Sol Flasher (The light bars on the shoulders. Energy can be\
    \ concentrated here to be used as a flash grenade. The amount of light is 3 million\
    \ candela. The intensity of the flash can lead to blindness in ordinary people\
    \ with a single shot, making it even more effective against Fangires, who dislike\
    \ light) and finishers (Generates the background of the Sun to blind foe), Statistics\
    \ Amplification (Kamen Rider Ixa can amplify his power several tens of times),\
    \ Vibration Manipulation (The blade of the Ixa Calibur vibrates 30,000 times per\
    \ second. The Powered Ixa can vibrate 12 million times per second), Energy Absorption\
    \ (Ixa Caliber can absorb energy to deprive the opponent of power), Deconstruction\
    \ with Powered Ixa (Can crush objects on the molecular level), Soul Destruction\
    \ (Can destroy a Fangire's soul and body), Explosion Manipulation (His attacks\
    \ have a tendency of causing explosions), Summoning with Fuestles, Electricity\
    \ Manipulation (Via Multi-Electro Terminal, it can generate electromagnetic waves\
    \ with 500 million volts of electricity to shock the target) and Information Analysis\
    \ (Via Analyse Eye, it can analyse targets and determines their weaknesses) with\
    \ Ixa Knuckle, Sound Manipulation with the Garulu Saber, Resistance to Space Radiation\
    \ and Temperature Manipulation (Survived being in space), Existence Erasure (Survived\
    \ the Darkness Moon Break) and Gravity Manipulation (Can operate the Ixalion which\
    \ can produce a strong enough G Force to make ordinary humans faint), Fire Manipulation\
    \ (The armor can withstand heat of 2000 \xB0 C), Fear Manipulation (Can fight\
    \ against and alongside base and Emperor Kiva) All of previous abilities enhanced,\
    \ plus Light Manipulation and Energy Projection via Ixariser (Generation via \"\
    Masker Pack\" The silver section of the Ixariser which can create up to 3500 light\
    \ energy bullets), Statistic Amplification (The Rising Armor can release a substance\
    \ called the Guardian Cobalt which strengthens the suit by 30%), Fire Manipulation\
    \ (Ixalizer has a flamethrower mode), Ice Manipulation (Ixalizer can fire freezing\
    \ gas), Information Analysis (Ixalizer can analyze enemies), Light Manipulation\
    \ (Ixalizer can create laser nets to trap opponents), Damage Reduction (An invisible\
    \ barrier that mitigates damage to the utmost limit is located on Ixa\u2019s head)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
