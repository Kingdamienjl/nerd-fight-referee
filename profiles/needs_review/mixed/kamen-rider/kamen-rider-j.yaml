- id: claim-standard-equipment-5529f836
  section: equipment
  axis: equipment
  text: "J-Spirit === The J-Spirit (J\u30B9\u30D4\u30EA\u30C3\u30C8, Jei Supiritto)\
    \ is Kamen Rider J's transformation belt. It takes the form of a rhinestone belt\
    \ buckle placed on Kouji's waist upon his transformation and revived by the Earth\
    \ Spirits. It is powered by a sacred crystal gem in its center, given to Kouji\
    \ by the female Earth Spirit. This gem channels the holy J Power energy from the\
    \ life force and spiritual energy of the planet Earth and its life forms. By channeling\
    \ J Power, Kouji can transform into his Rider form and by drawing an even larger\
    \ amount of J Power, can change into his Jumbo Formation giant form. Kouji can\
    \ also use J Power from his belt to transform his motorcycle into the J-Crosser.\
    \ KRJ-J-Spirit.png|J-Spirit"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
