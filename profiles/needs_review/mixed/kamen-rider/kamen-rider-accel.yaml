  name: Resistance to Age Manipulation, Fear Manipulation, Madness Manipulation, Life
    Manipulation, Empathic Manipulation, & Ene
  description: "Resistance to Age Manipulation, Fear Manipulation, Madness Manipulation,\
    \ Life Manipulation, Empathic Manipulation, & Energy Absorption (Ryu Terui has\
    \ special physiology/characteristics that let him resist mental attacks from Dopant.\
    \ Age Dopant age manipulation wave that turn the person it touch old, it didn\u2019\
    t have an effect on RyuKamen Rider W episode 43-44. Terror Dopant Fear and Madness\
    \ Manipulation makes the target of his power shake and tremble in fear and madness.\
    \ Ryu states it has no effect on him, and Terror Dopant acknowledges his special\
    \ characteristicKamen Rider W episode 45-46. Ryu is stated to resist mental attack\
    \ from Utopia Dopant, shown barely clinging to life because of the special constitution\
    \ of his body to resist Utopia\u2019s Dopant ability to absorb people\u2019s hope\
    \ and emotion necessary for living. Philips states if he doesn\u2019t resist Dopant\
    \ mental power, the result would be worse. People like Saeko Sonozaki died to\
    \ Utopia\u2019s dopant power due to lacking Ryu\u2019s resistanceKamen Rider W\
    \ episode 48) All previous abilities, improved Transformation (Aside from transformation\
    \ via Gaia memory and Accel Driver, Kamen Rider Accel can turn into a motorcycle),\
    \ Enhanced Senses (Via Protective Frame, Ace Feeler, Face Flasher, and Gaia Sonar),\
    \ Non-Standard Breathing (Type 2: Aero Lung let Kamen Rider Accel operate for\
    \ 15 hours even in oxygen-free space), Purification (Type 1: Accel Regulator has\
    \ a filtering function that cleanses the body of any toxins and makes it breathable),\
    \ Flight (In Accel Turbuler Form), self Temperature Manipulation (via Accel\u2019\
    s Radiator Lung that forcibly inhales air to cool the intense thermal energy generated\
    \ by Gaia memory. This allows Terui Ryu to operate the body that has become the\
    \ accelerator without stress), Energy Manipulation, Heat Manipulation (Allows\
    \ the Engine Blade to execute heated slashes or fire an energy projectile), Electricity\
    \ Manipulation (Allows the Engine Blade to perform electrically charged slashes\
    \ or fire a bolt of electricity), Fire Manipulation (In AccelTurbuler Form), Smoke\
    \ Manipulation (Can create a wave of hot steam), Transformation with Gaia Memories\
    \ (Can both dawn a Kamen Rider suit and turn himself into a bike), Fusionism (Bike\
    \ Form can combine with various other units), Explosion Manipulation (Can cause\
    \ the enemy to explode via various finishers) All previous abilities, minus Flight\
    \ and Fusionism and in addition Statistics Amplification (Can increase his speed\
    \ further in Trial Form), Afterimage Creation (His speed consistently shown to\
    \ leave trail of afterimage behind) All previous abilities from Accel memory enhanced,\
    \ minus Fusionism, plus improved Flight (Using the booster on his back and legs,\
    \ Kamen Rider Accel Booster form can freely fly in the air)"
