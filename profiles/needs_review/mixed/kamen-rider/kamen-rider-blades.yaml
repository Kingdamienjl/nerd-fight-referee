        \ \u201DPeter Fantasista\u201D. Rintaro uses this along with Lion Senki to\
        \ transform into Kamen Rider Blades, Lion Fantasista. If used with Lion Senki\
        \ and Tenkuu no Pegasus, Fantastic Lion can be achieved., Tenkuu no Pegasus:\
        \ Rintaro's Wonder Ridebook containing the power of the God-Beast \u201DTenkuu\
        \ no Pegasus\u201D. Rintaro uses this along with Lion Senki to transform into\
