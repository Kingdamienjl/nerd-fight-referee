- id: claim-powers-and-abilities-c8db7e9b
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Transformation, Martial Arts, Weapon
    Mastery, Acrobatics, Preparation, Vehicular Mastery, Explosion Manipulation, Portal
    Creation (With Book Gate, Rintaro can make a portal to the Sword of Logos Northern
    Base, anywhere on Earth, and Wonder World), Energy Manipulation, Water Manipulation,
    Holy Manipulation and Purification (of the Seiken are Holy weapons that is strong
    against evil. Blades' water can purify wicked entities) Non-Physical Interaction
    (with Seiken), Accelerated Development (Nagare gets sharper as it generates more
    water. By scanning Wonder Ride Books with the Singan Reader, Nagare and Blades
    can speed read the entire story and lore of it thus acquiring its powers and wisdom.),
    Animal Manipulation and Summoning (Rintaro can summon and control Lion Senki,
    Fighting Fairy and Tenkuu no Pegasus), Fissionism (With Touma's guidance, Rintaro
    learned how to separate a human body from a Megid body), Power Nullification (Rintaro
    can use Nagare to cause attacks to dissipate), Supernatural Willpower (Blades
    broke free of Solomon's body control through willpower), Resistance to Corrosion
    Inducement, Gravity Manipulation All of Civilian Abilities but to a higher extent,
    Transformation (Blades' statistics change depending on what form he uses. For
    example, Lion Fantasista is superior to Lion Senki in every parameter. Similarly,
    Fantastic Lion is superior to Lion Fantasista. Blades can turn into a Water Pegasus),
    Regeneration (Low-Mid), Enhanced Senses (Lion Senki sharpens Blades' hearing and
    vision, allowing him to catch prey with a keen sense of perception.), Statistics
    Amplification (Blades can temporarily speed up with the Mane Mail. By activating
    a special ability, Blades can boost his AP significantly), Damage Reduction (With
    armor that stretches from the front to the back reminiscent of a flowing coat,
    parries all impacts and resistance), Water Walking (Blades in the ending song
    is shown to be able to stand on water), Gravity Manipulation via Peter Fantasista,
    Flight via Tenkuu no Pegasus, Illusion Negation (Blade's Peter Fan Mask can dispel
    illusions), Attack Reflection (Blades can reflect attacks by flapping his wings),
    Intangibility (Blades can turn into water), Durability Negation (Blades can turn
    into water and hit the enemy from the inside), Resistance to Acid Manipulation
    (Nagare was unaffected by acid that could melt concrete.), Sound Manipulation
    (Blades' ears were hurt by a noise coming from a Megid that could make a human
    faint but did not faint), Spatial Manipulation, Electricity Manipulation, Air
    Manipulation, Darkness Manipulation, Energy Manipulation, Light Manipulation,
    Ice Manipulation, Deconstruction, Matter Manipulation, Explosion Manipulation
    All of Civilian Abilities and Base Forms/Wonder Combos but to a higher extent,
    Enhanced Senses (Blades can see beyond the distant horizon (25+ km) and has a
    wider viewing angle. His hearing is enhanced so that it acts like a radar that
    can map out enemies as well as hidden ones. He can capture multiple enemies' movements
    at the same time), Transformation (By hitting a lever on the King Lion Daisenki
    Ridebook, Blades can transform into a lion), Damage Reduction (Blade's Breaking
    Doyle can dispel impacts and resistances because the armor is covered with Holy
    Water), Statistics Amplification (By scanning Wonder Ridebooks into the King Lion
    Booster, Blade's attacks can get increasingly stronger), Fusionism (Blades' attacks
    with the King Lion Booster can combine the characteristics of the scanned Wonder
    Ridebooks) All of Civilian Abilities and Base Forms/Wonder Combos but to a higher
    extent, far higher Acrobatics (Blades has the combined athletic ability of 100
    great ice beasts), Ice Manipulation, Absolute Zero (Blades and Suiseiken Nagare
    produces absolute zero ice and snow, which is able to shatter everything into
    diamond dust), Temperature Manipulation (Blades can create a field of cold air,
    transforming everything into pure ice.), Enhanced Senses (Blades can see beyond
