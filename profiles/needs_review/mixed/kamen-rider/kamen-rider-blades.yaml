- id: claim-standard-equipment-f710f687
  section: equipment
  axis: equipment
  text: "* Suiseiken Nagare: Nagare is Blades's personal sword. This sword was made\
    \ by holy water over several years. Rintaro inherited this sword from his master\
    \ after he died when facing Zooous. * Seiken Swordriver: Blades's transformation\
    \ device. It has 3 slots to put Wonder Ridebooks in to get different powers. *\
    \ King Lion Booster: Kamen Rider Blades, King Lion Daisenki's weapon. It is mounted\
    \ on Blades's left wrist. It has the characteristics of combining the powers of\
    \ Wonder Ridebooks and infusing it with Blades. The more Ridebooks are scanned,\
    \ the stronger the attacks get. * Kaenken Rekka (Optional): The sword of fire\
    \ and Kamen Rider Saber's main weapon. Blade briefly dual-wielded Nagare and Rekka\
    \ to defeat Zooous. * Lion Senki: Rintaro's Primary Wonder Ridebook containing\
    \ the power of the Animal \u201CLion Senki\u201D. Rintaro uses this to transform\
    \ into Kamen Rider Blades, Lion Senki. * Peter Fantasista: Rintaro's Wonder Ridebook\
    \ containing the power of the Story \u201DPeter Fantasista\u201D. Rintaro uses\
    \ this along with Lion Senki to transform into Kamen Rider Blades, Lion Fantasista.\
    \ If used with Lion Senki and Tenkuu no Pegasus, Fantastic Lion can be achieved.\
    \ * Tenkuu no Pegasus: Rintaro's Wonder Ridebook containing the power of the God-Beast\
    \ \u201DTenkuu no Pegasus\u201D. Rintaro uses this along with Lion Senki to transform\
    \ into Kamen Rider Blades, Lion Pegasus (This form was never used in the show).\
    \ If used with Lion Senki and Peter Fantasista, Fantastic Lion can be achieved.\
    \ * Gatrikephone/Ride Gatriker: Rintaro's Wonder Ridebook that can change into\
    \ the Ride Gatriker. As a phone, Gatrikephone is a phone that has information\
    \ analysis and many information apps that help Blades. As a bike, it can be used\
    \ for combat. It has two machine guns that can fire 200 bullets per second, moved\
    \ at 223 km/h, and move in rough and corrosive roads. It also has a light attack\
    \ that passes through matter. * King Lion Daisenki: Rintaro's Wonder Ridebook\
    \ that was made by the combined powers of Lion Senki, Peter Fantasista and Tenkuu\
    \ no Pegasus. This was used to give Blades his first major upgrade form, King\
    \ Lion Daisenki. By flipping a switch, Blades can turn into a lion. * Tategami\
    \ Hyoujuusenki: Rintaro's Wonder Ridebook that is used to transform him into his\
    \ final form. After solidifying his resolve to protect his loved ones, the Northern\
    \ Base's fragment of the Almighty Book responded by transforming into the Tategami\
    \ Hyoujuusenki Ridebook. The book contains the power of hundred of beasts as well\
    \ as the combine knowledge of all previous Seiken users."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
