    - field: standard_equipment
      value: 'Vision Driver: The transformation device of the higher-ups of the Desire
        Grand Prix. A Fingerprint authentication is used to identify the person in
        order to login and transform. Despite this, certain abilites can be used without
        the need for authentication., Providence Card: The transformation card that
        needs to be swiped and read for the transformation to take place., GM Riders:
        A small platoon of Keibi (Security) Riders that Girori has placed under his
        mind control due to their original plans to raid the DGP and get their wishes
        forcibly granted. There are five members in this squad he commands., Buckles:
        Buckles are items that Riders can use to attach to the Desire Driver, giving
        them new abilities. While Girori himself is unable to use them, he can still
        provide their powers to his GM Riders:, Armed Water, Armed Claw, Armed Arrow,
        Armed Propeller, Armed Drill, Armed Hammer, Armed Shield, Boost, Zombie, Fever
        Slots, Geats Riders can use two standard buckles at once to mix and match
        between forms and abilities. As an example, Geats'' default form is the MagnumBoost
        form, utilising Magnum as his upper armor and Boost as the lower armor., A
        Revolve-On technique allows Geats Riders to reverse the position of the buckles
        as a part of their mix and match (e.g: BoostMagnum)., The stronger buckle
        dictates the overall stats of the Rider. For example, using Monster Buckle
        with any other buckle would still have Geats use Monster''s stats.'
      source_id: vsbattles-kamen-rider-glare-kamen-rider
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Above Average (Due to being a future human, he should be knowledgeable
        on the high-tech technology utilised in the DGP, such as the buckles and drivers,
        as well as the metaverse as a whole. He is able to keep up a disguise as a
        concierge, fooling almost every participant and hiding them from his true
        role in the DGP. The various games he has concocted for the DGP during the
        conspiracy arc have been for the elimination of Ace Ukiyo while still abiding
        by the rules. He even managed to remove him from the competition at one point
        for a short amount of time.) As a combatant, Girori is a terrifying adversary
        to go up against. He has effortlessly defeated Kamen Rider Punkjack, who has
        been trained under the DGP Security Faction. He has also gone up against Kamen
        Rider Geats, Tycoon and Na-Go without much issue, where both Geats and Tycoon
        were in their strongest forms. This fight was prematurely stopped by Niram,
        however. Standard Tactics: Girori has the tendency to use his hypnorays to
        subjugate his enemies under his control either immediately, or early on, depending
        on who he''s fighting. Should he have no qualms to let his opponents live,
        he will do whatever it takes to kill the opposition. Meanwhile, GM Riders
        are used to provide support in combat, or hound his enemies to his desirable
        location.'
      source_id: vsbattles-kamen-rider-glare-kamen-rider
      provider_id: vsbattles
      authority: high
      confidence: 0.75
