  intelligence:
    text: 'Above Average (Due to being a future human, he should be knowledgeable
      on the high-tech technology utilised in the DGP, such as the buckles and drivers,
      as well as the metaverse as a whole. He is able to keep up a disguise as a concierge,
      fooling almost every participant and hiding them from his true role in the DGP.
      The various games he has concocted for the DGP during the conspiracy arc have
      been for the elimination of Ace Ukiyo while still abiding by the rules. He even
      managed to remove him from the competition at one point for a short amount of
      time.) As a combatant, Girori is a terrifying adversary to go up against. He
      has effortlessly defeated Kamen Rider Punkjack, who has been trained under the
      DGP Security Faction. He has also gone up against Kamen Rider Geats, Tycoon
      and Na-Go without much issue, where both Geats and Tycoon were in their strongest
      forms. This fight was prematurely stopped by Niram, however. Standard Tactics:
      Girori has the tendency to use his hypnorays to subjugate his enemies under
      his control either immediately, or early on, depending on who he''s fighting.
      Should he have no qualms to let his opponents live, he will do whatever it takes
      to kill the opposition. Meanwhile, GM Riders are used to provide support in
      combat, or hound his enemies to his desirable location.'
    source_ids: *id002
    confidence: 0.8
