- id: claim-powers-and-abilities-8c5d2b24
  section: abilities
  axis: hax
  text: '*Kamen Rider Physiology **Weapon Mastery (Scales to Ace, who is able to use
    any Raise Buckles given by the Desire Grand Prix efficiently, no matter how unconventional
    theyKamen Rider Geats Episode 2 areKamen Rider Geats Episode 3) *Spark (Basic
    User) *Avatar Creation, Self-Higher-Dimensional Manipulation, Self-Information
    & Data Manipulation, & Non-Combat Applicable Immortality Type 9 (Notable members
    of the DGP staff come from the far future, where they are made up of information
    and data living in a 4-D metaverse. In order to interact with the era they visit,
    they design avatars specialised for them depending on the specific era. When these
    avatars are completely destroyed, their true version briefly appear before returning
    to their dimension. These avatars can always be redesigned again, though the time
    taken is unknown.) *Acausality (Type 1; Touching an ID Core allowsKamen Rider
    Geats Episode 1 the user to retain their memories of the previous worldKamen Rider
    Geats Episode 2. Due to his position as a DGP Game Master and the lack of an ID
    Core, he can remember past games without needing a Desire Driver.) *Portal Creation
    & Time Travel (Vision Driver users can open portals that can be used to travel
    into any point in the past or future. Anyone who can enter the portal is able
    to do so, regardless of whoever opened it). *Limited Teleportation (Can teleport
    to the DGPKamen Rider Geats Episode 3, as well as other sectors that normal participants
    are forbidden from entering. Additionally, the Game Master Vision Driver allows
    him to teleport to the Goddess of Creation''s chambers.) *Morality Manipulation
    & Empathic Manipulation (Dropping out from the DGP will cause anyone to lose the
    desire for their wishKamen Rider Geats Episode 4, this can usually be reversed
    by touching the ID Cores. However, due to Girori''s status as a DGP Game Master,
    he does not need to do this. He should also be immune to the effects of the Grand
    End, which is the permanent erasure of the knowledge on the DGP''s existence at
    a global scaleKamen Rider Geats Episode 38) *Analytical Prediction (Riders competing
    in the DGP can react to shots from Magnum Users, despite the abilities provided
    by the Magnum Buckle. Dapaan in his Magnum Form wasn''t able to land a single
    hit on GeatsKamen Rider Geats Episode 3) *Poison Manipulation, Acid Manipulation,
    Deconstruction, Disease Manipulation & Body Puppetry via Biological Manipulation
    (Riders are able to survive Poison Charges from Zombie Buckle Users without suffering
