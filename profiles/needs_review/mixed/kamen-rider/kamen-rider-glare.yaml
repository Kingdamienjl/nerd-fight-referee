- id: claim-standard-equipment-c9589a7a
  section: equipment
  axis: equipment
  text: '*Vision Driver: The transformation device of the higher-ups of the Desire
    Grand Prix. A Fingerprint authentication is used to identify the person in order
    to login and transform. Despite this, certain abilites can be used without the
    need for authentication. *Providence Card: The transformation card that needs
    to be swiped and read for the transformation to take place. *GM Riders: A small
    platoon of Keibi (Security) Riders that Girori has placed under his mind control
    due to their original plans to raid the DGP and get their wishes forcibly granted.
    There are five members in this squad he commands. *Buckles: Buckles are items
    that Riders can use to attach to the Desire Driver, giving them new abilities.
    While Girori himself is unable to use them, he can still provide their powers
    to his GM Riders: **Armed Water **Armed Claw **Armed Arrow **Armed Propeller **Armed
    Drill **Armed Hammer **Armed Shield **Magnum **Boost **Zombie **Ninja **Monster
    **Beat **Fever Slots **Command Twin Note: *Geats Riders can use two standard buckles
    at once to mix and match between forms and abilities. As an example, Geats'' default
    form is the MagnumBoost form, utilising Magnum as his upper armor and Boost as
    the lower armor. *A Revolve-On technique allows Geats Riders to reverse the position
    of the buckles as a part of their mix and match (e.g: BoostMagnum). *The stronger
    buckle dictates the overall stats of the Rider. For example, using Monster Buckle
    with any other buckle would still have Geats use Monster''s stats.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
