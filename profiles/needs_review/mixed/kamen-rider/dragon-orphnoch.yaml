- id: claim-powers-and-abilities-e3631d19
  section: abilities
  axis: hax
  text: Peak Human Physical Characteristics, Transformation, Enhanced Senses (Orphnoch's
    have their senses enhanced to a superhuman level), Martial Arts, Acrobatics, Elasticity
    (Like all Orphnochs, Kitazaki can stretch his fingers), Deconstruction (Kitazaki
    can turn anything he touches or anything that touches him into ash. He has a ranged
    version as shown when he releases a red fume that deconstructs anything that comes
    into contact with it), Smoke Manipulation, Energy Manipulation and Energy Projection,
    Resistance to Mind Manipulation through Supernatural Willpower (Can wear the Delta
    Driver without suffering its side effects), Fear Manipulation (Unfazed when fighting
    Delta who inspired fear by his presence alone) Superhuman Physical Characteristics,
    Statistics Amplification via Dragon Form (Can keep up with Faiz's Axel Form which
    is a 1000x speed amp) Superhuman Physical Characteristics, Weapon Mastery, Light
    Manipulation (Delta can shoot light bullets produced from Photon Blood), Limited
    Self-Sustenance, Underwater Breathing (Type 3; Delta Lungs have 3 hours of oxygen
    supply), Additional Enhanced Senses (Delta has a 180 degree field of view, night
    vision and x-ray vision), Summoning (By saying "3821" into the Delta Phone, he
    can summon Jet Slinger), Absorption (Delta can absorb impact and release it),
    Danmaku via Jet Slinger, Flight via Jet Slinger, Explosion Manipulation (His attacks
    have a tendency of causing explosions), Information Analysis (The Global Feeler
    are the antennas which communicates with the Eaglesat and Hawkeye satellites.
    Comparable to Faiz's Global Feeler), Deconstruction (Delta uses Photon Blood which
    can deconstruct enemies), Resistance to Electricity Manipulation and Deconstruction
    (Scales to other Riders who survived his deconstructing ability)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
