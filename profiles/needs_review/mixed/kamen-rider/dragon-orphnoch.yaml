- id: claim-standard-equipment-ddc666db
  section: equipment
  axis: equipment
  text: '*SB-333B Delta Driver: Kamen Rider Delta''s transformation item. Much like
    Faiz''s driver, it cannot be destroyed by the power of an atomic bomb. *SB-333P
    Delta Phone: The walkie-talkie-shaped control unit of the Delta Gear and the grip
    of the Delta Blaster. *SB-333DV Delta Mover: The digital camcorder-shaped view-screen
    and the main portion of the Delta Blaster. *Delta Blaster: The combination of
    Delta Phone and Mover. This is Delta''s gun and his primary weapon. It has different
    modes that can shoot streams or bursts of light. When Mihara says "check" into
    the phone, he can use Lucifer''s Hammer. *SB-VX0 Jet Slinger: Jet Slinger is Delta''s
    rider vehicle. It is a large motorcycle with a hovering function allowing it to
    fly. It can also bombard the enemy with missles.'
