    device until Kuroto takes it back. When Ex-Aid renders Kuroto powerless from being
    a Rider any more, Parado took it from him and kill him. **Gashacon Sparrow: Zombie
    Gamer Level X''s weapon taken from Kamen Rider Lazer Chambara Bike Gamer Level
    3, until Ex-Aid renders Kuroto powerless from being a Rider any more and the Gashat
    is taken back to Emu. **Gashacon Sword: Brave''s primary blade weapon that Genm
    steals until Brave Level 50 takes it back. **Trick Flywheels: Sports Action Gamer
    Level 3''s personal weapons. **Gashacon Bugvisor II: Sidearm weapon used in Genm
    Action Gamer Level 0 to replace his lost Gashacon Bugvisor. **Gashacon Breaker:
    Genm Action Gamer Level 0 and Zombie Action Gamer Level X-0''s personal weapon.
    **Gashacon Key Slasher'
