        \ get stronger in response to the wind Storm Halberd produce), Transmutation\
        \ (Agito can transform a random motorcycle into Machine Tornador), Fire Manipulation\
        \ and Temperature Manipulation in Flame Form (This form can produce 7000 degrees\
        \ celsius flames to attack the enemy), Regeneration Negation (High-Mid; Destroyed\
        \ Moripes Octopus who can regenerate from small pieces), Summoning (His other\
        \ forms can summon their signature weapons with his belt), and Explosion Manipulation\
        \ (His attacks have a tendency of causing explosions), Damage Reduction with\
        \ Shock Silver, Resistance to Explosion Manipulation (Got directly hit by\
        \ Another Agito's Assault Kick, but did not explode), Paralysis Inducement\
        \ (Agito was unaffected from being struck by Auguis Maskurus\u2019s Judgement\
        \ Wand which paralyzes the nerves of an opponent), Petrification (He was unaffected\
        \ by Anguis Femineus\u2019s Evileye Whip which causes petrification), Mind\
        \ Manipulation and Sleep Manipulation (Unaffected by Pisquis Arapima\u2019\
        s hypnosis and Sleep Inducement. Controlled G3-X\u2019s Perfect A.I which\
        \ ignores the user\u2019s will and makes the user berserk), Temperature Manipulation\
        \ (Equus Noctis can evaporate the body fluids of people by touch which mummifies\
        \ its victims, but Agito was unaffected by it), Electricity Manipulation and\
        \ Fire Manipulation (Hydrozoa Ignio summons a lightning strike that is supposed\
        \ to ignite a person but it only startled Agito instead), Absorption (Agito\
        \ was unaffected by Equinus Famelicare\u2019s shurikens which absorbs the\
