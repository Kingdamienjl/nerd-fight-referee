- id: claim-standard-equipment-7b5cc641
  section: equipment
  axis: equipment
  text: "*HDVC: A micro-camera located on G3\u2019s helmet that sends video information\
    \ to the G3 unit. *Guard Accelerator: The right handle for Guard Chaser. It is\
    \ used as a baton. *GM-01 Scorpion: G3\u2019s personal gun. It has 72 bullets\
    \ that are fired with liquified gas and electromagnetic force. The scope has a\
    \ video capturing device to send information to the G-Trailer. It has a magnet\
    \ grip that sticks to G3\u2019s hand. *GG-02 Salamander: A grenade launcher that\
    \ is attached to GM-01. It has three high powered grenades. One shot can defeat\
    \ a low level Lord. *GS-03 Destroyer: A blade that is mounted onto G3\u2019s right\
    \ arm. It vibrates 2 million times per second. There is a freezing unit to stop\
    \ the blade from overheating. It can be used continuously for 30 minutes. *Guard\
    \ Chaser: G3\u2019s police bike and is a storage for G3\u2019s weapons. It can\
    \ move at 350 km/h. It can track enemies and measure the speed in which the enemy\
    \ is moving. The headlights have an infrared sensor and night vision camera. It\
    \ has a Protective agent called \u201CMagna BTR\u201D that can repair a flat tire\
    \ instantly. It is environmentally friendly and does not pollute. *G-Trailer:\
    \ G3\u2019s mobile base. It is where the G3 suit is repaired. The G3 trailer is\
    \ operated by Ozawa and Omuro. G3 along with Ozawa, a genius who developed the\
    \ G3, G3-X, and G4 systems, and Omuro, who is the technician, are called the G3\
    \ unit. The G3 unit communicates with each other on everything, including strategies,\
    \ whereabouts of enemies, conditions of equipment, etc. *GA-04 Antares: A wire\
    \ anchor hook that is to bind enemies or to hook onto objects. It can extend up\
    \ to 100m. It can be also used as a weapon and a shield, exclusive only to the\
    \ G3-X *GX-05 Cerberus: G3-X\u2019s main weapon is a gatling gun that can fire\
    \ 30 shots per second. It has a total of 120 bullets with 2 additional magazines.\
    \ (GX Launcher Mode) - By attaching the GX bullet and GM-01 Scorpion to the GX-05\
    \ Cerberus, the gatling gun becomes a launcher. One shot from this weapon is equivalent\
    \ to Kamen Rider Agito\u2019s Rider Kick, exclusive only to the G3-X *GK-06 Unicorn:\
    \ A knife for close ranged combat. This weapon was able to withstand El of the\
    \ Wind and El of the Earth\u2019s attacks which even Shining Caliber couldn\u2019\
    t withstand, exclusive only to the G3-X"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
