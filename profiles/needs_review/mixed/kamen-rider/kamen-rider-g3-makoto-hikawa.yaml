- id: claim-powers-and-abilities-9d1a95d0
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Hand-to-Hand Combat, Weapon Mastery,\
    \ Explosion Manipulation with GG-02 Salamander and GX Launcher, Statistics Amplification\
    \ via G-Buckle (Briefly amps strength), Information Analysis (The G-COM has access\
    \ to the Metropolitan Police Department\u2019s library, a pop-up display to search\
    \ information, a notepad to store information to use in this helmet, and a GPS\
    \ system with a tracking system), Enhanced Senses (G3 has wide vision, night vision,\
    \ electron microscope and can see 5 km away), Limited Radiation Manipulation (G3\u2019\
    s antenna can send and receive radio waves from the G-Trailer), Electromagnetic\
    \ Manipulation (GM-01\u2019s bullets are fired with electromagnetic force), Vibration\
    \ Manipulation and Possibly Durability Negation with GS-03 Destroyer (Its blade\
    \ vibrates at an ultra-high frequency which can cut through any substance), Resistance\
    \ to Temperature Manipulation (G3 can withstand 2000 degree Celsius flames and\
    \ cold with G3's inner jacket), Electricity Manipulation and Fire Manipulation\
    \ (Hydrozoa Ignio can summon lightning that ignites its targets, yet it only did\
    \ minor damaged to G3) All previous abilities improved, Limited Damage Reduction\
    \ (Has airbags to reduce interior damage), Enhanced Statistics Amplification (The\
    \ power heart of Kamen Rider G3-X contains a built-in high-power compact generator.\
    \ Converts the power supplied from the battery to tens of times the output) and\
    \ Enhanced Senses (Has 3x the vision of G3), Underwater Breathing and Purification\
    \ Type 1 (G3-X\u2019s mask can turn Carbon Monoxide and poisonous gas to Oxygen),\
    \ Analytic Prediction (G3-X has a built-in AI which can create near perfect calculations,\
    \ as the perfect AI in G3-X\u2019s trial run was replaced with a lesser AI. Said\
    \ calculations exceeds the wearer\u2019s combat capabilities) and Instinctive\
    \ Reaction (If the user were not able to control G3-X AI, then it will act on\
    \ its own free will instead), Resistance to Mind Manipulation and Sleep Manipulation\
    \ (Unaffected by Pisquis Arapima\u2019s hypnosis and Sleep Inducement), Vibration\
    \ Manipulation (G3-X puts his arm in the GS-03 Destroyer, which can vibrate 2\
    \ million times per second, to provide additional power)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
