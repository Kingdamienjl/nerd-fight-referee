        \ 18-card capacity., K-Touch: Diend's device that allows him to transform\
        \ into Complete Form., Rider Cards: Gives access to Diend to power-up his\
        \ attacks and summon any Kamen Riders, depending on which card used., Attack\
        \ Rides: Diend has several Attack Ride cards which he utilizes via the Diendriver.\
        \ The following attacks are performed through the Diendriver itself., Diend\
