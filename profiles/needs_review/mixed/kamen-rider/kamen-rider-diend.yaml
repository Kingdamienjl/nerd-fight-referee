- id: claim-standard-equipment-4fd6cd19
  section: equipment
  axis: equipment
  text: "*Diendriver: Kaito's primary weapon and transformation device. *Diend Belt:\
    \ A belt is worn around Diend's waist which resembles the Decadriver, with its\
    \ card scanner replaced with an empty casing which portrayed Diend's insignia.\
    \ Said casing can be removed to insert his K-Touch. *Card Holder: A card holder\
    \ which Diend use to contain his Rider Cards, similarly to Decade's Ride Booker.\
    \ It is stored on the left side of his Diend Belt and has a maximum 18-card capacity.\
    \ *K-Touch: Diend's device that allows him to transform into Complete Form. *Rider\
    \ Cards: Gives access to Diend to power-up his attacks and summon any Kamen Riders,\
    \ depending on which card used. *Attack Rides: Diend has several Attack Ride cards\
    \ which he utilizes via the Diendriver. The following attacks are performed through\
    \ the Diendriver itself. **Diend Blast: Grants the Diendriver rapid fire capabilities.\
    \ Unlike Decade's version, Diend's shots can arc, curve, and seemingly track targets.\
    \ **Barrier: Allows the Diendriver to project a shield. **Crossattack: Causes\
    \ two summoned Riders to perform their finishing attacks against one target. **Invisible:\
    \ Allows Diend to turn invisible. **Illusion: Creates multiple copies of Diend,\
    \ with each copy being capable of fighting. Narutaki gives this card to Kaito\
    \ in the World of Amazon, on the condition that he defeats Decade. **Gekijyouban:\
    \ Summons the eight Riders that make up Diend Complete Form. \"Gekijouban\" translates\
    \ to \"Movie Version\" (\u5287\u5834\u7248 Gekij\u014Dban), as movie riders are\
    \ used in the attack. It is similar to the Decade's Televikun card."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-2005873e
  section: power_scale
  axis: battle_iq
  text: Above Average (Daiki is a treasure hunter who travels the A.R. Worlds in search
    of treasures and can sometimes able to pickpocket from out of sight, even a past
    version of himself was able to steal the Kurosaki family's pistol heirloom from
    Daiki)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-7fb0ae87
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Acausality (Type 2; Upon the creation\
    \ of the Another Diend Ridewatch, his history was left unaltered and his memories\
    \ stayed in tact), Acrobatics, Transformation, Limited Transmutation (Riders are\
    \ shown to transfer Rider power to the shape they wish), Time Manipulation Negation\
    \ (2 layer; As a Kamen Rider Chou Den O Trilogy Episode Yellow SingularityKamen\
    \ Rider zukan~Singularity, he can negate the fluctuations of time Novel Kamen\
    \ Rider Den-O: Deneb Kanjinchou. Negated Swartz's time stop field and his own\
    \ just by touching him Kamen Rider Zi-O episode 48), Space-Time Manipulation (Can\
    \ break Aurora Curtain with his rider templates, Diend driver Kamen Rider Decade\
    \ episode 11), Expert Martial Artist, Portal Creation, Dimensional Travel and\
    \ Time Travel (Like Tsukasa, Daiki can travel within worlds or through time via\
    \ Dimensional walls). Resistance to Time Manipulation (As a Singularity, he should\
    \ be unaffected by the fluctuations of time including time alteration and time\
    \ freezing) All of the previous powers, Weapon Mastery, Homing Attack (Diendriver\
    \ marks the target at the time of the shooting and guides energy bullets to hit\
    \ the target. If the target somehow escapes, the bullets' trajectories will change,\
    \ allowing them to land on opponents), Summoning (Diend can summon copies of past\
    \ Kamen Riders), Space-Time manipulation (Having cracked the space-time with Final\
    \ Form Ride Kiva Kamen Rider Decade episode 11), Invisibility, Energy Projection,\
    \ Transformation (Diend also possesses Final Form Ride cards with which he can\
    \ transform certain Kamen Riders, whether they are summoned by him or the real\
    \ thing), Explosion Manipulation (His attacks have a tendency of causing explosions),\
    \ Spatial Manipulation (His Rider Card Holder is an infinite holder of Rider Cards,\
    \ due to a connection with the Klein Bottle), Limited Flight (Can float by blowing\
    \ microwaves from tesla bands attached from each limbs), Elemental Manipulation\
    \ (Earth, water, wind, fire, light and darkness; The Diend Belt is stated to contain\
    \ the elements listed above), Enhanced Senses (His vision and hearing are the\
    \ exact same as Decade's), Sound Manipulation (Can shoot his screams s high-frequency\
    \ bullets), Light Manipulation (Can fire light bullets from the Diend Driver),\
    \ Resistance to Extreme Temperatures and Absolute Zero (Like Decade, his Divine\
    \ Armor can withstand temperatures varying from -273\u2103 to 6000\u2103) and\
    \ Explosion Manipulation (Scales to Decade who crosscountered Kamen Rider Ultimate\
    \ Kuuga's finishers) Same as before plus Soul Manipulation and Deconstruction\
    \ (Can burn the body and soul of the wicked who looked at the armor)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
