  attack_potency:
    text: 'Wall level70.8 Kilojoules as Ace Ukiyo (Could fight off a group of Jyamatos
      as a teen. The Ace of Strength was able to causally crush two bowling balls
      with his handsGeats Extra: Geats Anime Another Grand Prix), Large Building level4.87
      Tons of TNT with Magnum Shooter and as Kamen Rider Geats (Geats has the highest
      affinity with Magnum, and thus, is stronger than other Magnum users that don''t
      share said affinity; Geats Riders'' base power is 33x lesser than that of their
      Boost Time States), City Block level14.6 Tons of TNT with Standard Boost Forms
      (Boost Users have their stats multiplied by several times), Multi-City Block
      level160.7 Tons of TNT with Boost Time (Boost Time allows Boost Users to further
      increase their stats by more than 10 times. Casually created this explosion,
      who one shotted Kamen Rider Shiro and overpowered Kamen Rider Buffa), Small
      Town level+4.67 Kilotons with Monster (Could one shot the Saboten Knight Jyamato
      which would''ve required this much energy. The Saboten Knight Jyamato had previously
      no sold attacks from Tycoon, Neon and BuffaKamen Rider Geats Episode 8 - Encounter
      VII: Trump Card Ninja), Town level14.01 Kilotons when using Boost and Monster
      together (Boost multiplies Monster''s stats by several times), Large Town level154.11
      Kilotons with Monster Boost Time (Boost Time multiplies Monster & Boost''s stats
      by more than 10 times); Varies, up to Complex Multiversal level7-D with Desire
      Empowerment (All Geats Riders should be able to equalise their overall stats
      with Kamen Rider Revice, allowing them to fight against those from his series.
      Ace himself fought against Revice, resulting in a stalemate. Revice and others
      are comparable to Kamen Rider Jeanne. Scales to Kamen Rider Tycoon who has fought
      alongside Kamen Rider ZX)'
    source_ids:
    - mediawiki-5002666
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
