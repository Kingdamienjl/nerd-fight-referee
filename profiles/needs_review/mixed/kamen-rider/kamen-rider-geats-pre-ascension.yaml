  stamina:
    text: Superhuman (In his tenure as the undefeated Desire Deity of every DGP participated
      throughout his many lives, Ace has always been able to defeat waves upon waves
      of foes without breaking a sweat, as seen everytime he has to go up against
      armies of Jyamatos. In single combat, he is able to keep being on the upper
      hand against Kamen Rider Buffa in their fight for several hours, until it became
      night time. Like his peers, he's able to continue fighting despite suffering
      from heavy injuries before or during fights, even after he had been forcibly
      detransformed. Neon and Keiwa has commented on his superhuman stamina, stating
      that he had never shown any signs of fatigue up until the introduction of the
      Boost Mark II buckle. After awakening his spark, any stamina-related issues
      can be alleviated by his spark abilities)
    source_ids:
    - mediawiki-5002666
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range with fists; Extended Melee Range with melee weapons;
      Hundreds of Meters Magnum Shooter 40X (Normal Mode) and other ranged weapons/attacks;
      Kilometers with Magnum Shooter 40X (Sniper Mode/Machine Gun Mode); Tens of Kilometers
      with Command Twin Toron Cannon, Planetary with Irina Geats Ears (Non-Combat,
      Information Analysis), Interdimensional with Spark (Awakened onwards; his spark
      powers can affect the 4-D metaverse from the far future)
    source_ids:
    - mediawiki-5002666
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Extraordinary Genius (Up to Lamentation Arc), likely Supergenius (Yearning
      & Genesis Arc Onwards) |-|Normal= Ace is a methodical, sharp-witted strategist
      and the undefeated champion of the DGP that spanned 2,000 years across at least
      four known incarnations of himself. He is a master of long-term planning, being
      capable of reclaiming his memories and thereby returning back to the DGP without
      his prior memories, deciphering the Jyamato language with minimal clues to solve
      a mind-boggling puzzle, and deducing complex conspiracies about him from behind
      his back within seconds. His foresight is unparalleled, having manipulated the
      DGP over several lifetimes to secure the power of Boost Mark II. (Yearning &
      Genesis Arc Onwards) Upon awakening his spark, he is able to utilise his newfound
      Creation powers, granting him the ability to manipulate future technology and
      restructure the universe. His conceptual abilities are now fundamental to the
      world''s preservation, allowing him to materialize ID Cores and grant Rider
      powers at will. For example, he was able to bestow Neon''s Rider Power to her
      by overriding the Gya-Go ID Core into hers despite Kamen Riders not being able
      to use different corresponding ID Cores. A Kamen Rider''s power is linked to
      their fundamental universe, without it, a universe would fall apart. Ace has
      been able to warp his own timeline to his own image as well as override Suel''s
      existence despite it being in a higher dimension He then planned his own ascension
      into true godhood immediately after awakening his powers.Kamen Rider Geats Episode
      49 - Daybreak I: Here Comes The Highlight!) |-|Combat= Over the course of 2000
      years, Ace has never lost a DGP and retains his knowledge and skills obtained
      over those years. Has shown to be an expert marksman and is proficent is numerous
      weapons such as greatswords, katanas, shields, and hammers. Very early into
      the shows run, Ace was able to match Revice down to a stalemate. Ace himself
      is far more skilled than Tycoon, who, over the course of a few weeks, went from
      someone who had no combat experience to going to and to with Kenzan. This would
      put Ace within the level of highly skilled Riders such as Saber and Zero-One.
      The former being able to compress hundreds of years of swordsmanship and the
      latter being able to predict hundreds of trillions of combat data, both being
      able to do so within a few seconds. Standard Tactics: Ace has no set tactics
      thanks to his versatility. Although, due to the nature of the Desire Grand Prix
      and the circulation of Buckles, he would normally use the most recent or the
      most powerful buckle he has at the time even against basic enemies. Depending
      on the buckle used, Ace''s fighting style changes. *With Magnum, Ace usually
      uses the Magnum Shooter to overwhelm his opponents at a distance and would perform
      various acrobatic moves to gain better control over the battlefield, though
      he''s not afraid to transition into close quarters combat. *With Boost, Ace
      would fight with hand to hand while also amplifying his attacks with fire. He
      also has the tendency to use another buckle in tandem with Boost. *Due to the
      Command Twin Buckle''s initial energy requirement, Ace is forced to fight with
      just a sword, though he can still use other buckles in tandem. Once filled,
      he will have full access to the Command Twin Buckle, which has two modes; the
      Jet Mode provides Ace with high speed flight while the Cannon Mode allows Ace
      to attack at far distances with two shoulder mounted cannons. *In his Boost
      Mark II form, he usually overwhelms his opponents with blinding speed, and can
      alternate between normal form and fox form. *Due to losing fatigue very quickly,
      he is usually forced to transform into his Laser Boost form, where he uses his
      gravity vector manipulation to lift himself and/or his opponents up in the air
      or sideways, before shooting them with the Laser Raise Riser. Beyond that, he
      employs the same tactics as his Boost Mark II form. *Boost Mark III utilises
      his three tails, at which they warp the space of his opponents before creating
      a black hole at the warped spot. These tails can "corrupt" his surroundings
      and use the debris to protect himself or to traverse the area. *Geats in his
      Mark IX form employs a mix of every previous standard tactics available, while
      also using his awakened/God Of Genesis spark to warp reality to favour him.
      He plays a more supportive role when he pairs/teams up with his other fellow
      riders, opting to give buffs and let them cut their own path while still providing
      presence and all in all being a genuine threat.'
