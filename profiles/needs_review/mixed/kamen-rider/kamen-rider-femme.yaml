    \ (Ryuki Riders were directly hit by Ouja\u2019s Venosaber, which inflicts poison\
    \ onto its targets, but weren't affected), Fragrance Manipulation via mask, Paralysis\
    \ Inducement (Ryuki Riders have resistance to Evil Whip), Limited Resistance to\
    \ Deconstruction/Possibly Existence Erasure (Ryuki Riders can stay in Mirror World\
