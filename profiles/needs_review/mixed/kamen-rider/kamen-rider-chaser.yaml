- id: claim-standard-equipment-27089158
  section: equipment
  axis: equipment
  text: '*Break Gunner: Transformation device and personal weapon to transform into
    Mashin Chaser. Used as weapon only when reborn as Kamen Rider Chaser. It is used
    has a gun and knuckles. There is a slot that car insert Viral Cores and Shift
    Cars to infuse their powers into the weapon. *Mach Driver Honoh: Chase''s transformation
    device to transform into Kamen Rider Chaser. There is a slot to insert Signal
    bikes to use their powers. If Chaser taps on the button on the Mach Driver Honoh,
    he can amplify or use his abilities that corresponds to the Signal Bike currently
    in use. *Signal Bikes: Gives access to Kamen Rider Chaser''s forms and powers,
    depending on which bike is used. *Shift Cars: Gives access to Mashin Chaser and
    Kamen Rider Chaser''s powers, depending on which car is used. *Shift Speed Prototype:
    When Chaser uses this car, his speed is significantly increased. *Viral Cores:
    Gives access to Mashin Chaser''s forms and powers, depending on which car is used.
    As Protodrive, it allowed him to read the memories of the Roidmude the Core came
    from, provided it wasn''t severely damaged *Signal Axe: Chaser''s primary weapon.
    Signal Axe is a high vibration axe that is able to cut through anything it touches.
    By inserting a Signal Bike or Shift Car, it can infuse the powers of it into the
    axe.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
