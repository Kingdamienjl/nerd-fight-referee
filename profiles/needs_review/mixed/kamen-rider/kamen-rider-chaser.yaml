- id: claim-powers-and-abilities-3922a1d4
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, Inorganic Physiology, Transformation,
    Energy Manipulation (Chaser has many forms of energy attacks. He can also convert
    heat into energy), Martial Arts, Weapon Mastery, Data Mimicry (Only once for each
    Roidmudes, they can copy a human data to create their human form), Shapeshifting
    (Using Viral Cores to create weapon-based from animals for combat), Damage Reduction
    (Chaser's Violet Guard is an energy shield generator that covers the whole body.
    Chaser's armor also greatly reduces physical and energy damage. Furthermore, Chaser
    is coated in special particles that form a shield film. Chaser's head is the most
    defensive part of his body with a multi-layered that protects against armor-piercing
    attacks), Light Manipulation (Chaser's Wing Sniper shoots out arrows of light),
    Flight (Via Bat Viral Core that allows to give him the wings to flight), Enhanced
    Senses (Chaser's feet has sensors that can detect traces left by the target. Chaser's
    Shuttered Eye can see the internal structures of the opponent. The Reactor Eye
    has excellent responsiveness, instantly captures moving body reactions and heat
    source reactions, and instantly grasps the surrounding situation), Hacking (It
    is possible to intercept communication data and wireless conversations that fly
    within a radius of 10 km. It is also possible to paralyze the enemy's communication
    function by emitting jamming radio waves), Precognition (Based on the attack data
    received from the enemy, the Nemesis Module can create a battle pattern that can
    give the most effective damage and propose it Chaser), Information Analysis (Chaser's
    Shuttered Eye can find out structural weaknesses of the opponent), Electromagnetic
    Manipulation (Chaser can use electromagnetism to raise the kinetic ability of
    Chaser's body, giving Chaser a higher damage output and higher mobility), Durability
    Negation (Chaser's attacks causes shock waves which damages the opponent's interior),
    Stealth Mastery (Chase is able to sneak up to enemies without making a noise),
    Statistics Amplification (Chaser can use electromagnetism to raise his physical
    abilties. Chaser can also increase the durability of damaged or weak points),
    Damage Boost (By instantaneously increasing the strength of his body or releasing
    all of his stored energy, Chaser can deal attacks that are stronger than normal.
    By using these methods, Chaser can destroy shield functions on a instant), Deconstruction
    (Chaser can decompose energy and heat that comes into contact with him. He can
    then release the said decomposed energy outwards), Absorption (Chaser can absorb
    energy and heat from objects he is in contact with), Time Manipulation and Gravity
    Manipulation (Can create Heavy Acceleration/Slowdown that slows down time in the
    field he generated. Later on in the series, this was upgrade to Super Heavy Acceleration
    which can slow riders who have resistance to the original Heavy Acceleration),
    Self-Destruction (Can self-destruct for a last ditched effort), Resistance to
    Time Manipulation and Gravity Manipulation (Roidmudes have Core Driviars which
    make them are not affected by their own Heavy Acceleration/Slowdown) All abilities
    from Roidmude and Mashin Chaser plus more potent Time Manipulation and Gravity
    Manipulation (Can use Super Heavy Acceleration which can slow riders who have
    resistance to the original Heavy Acceleration), Summoning (Chaser can summon Ride
    Chaser, Signal Axe, and Ride Booster Blue), higher Enhanced Senses (20km radius
    opposed to Mashin Chaser's 10km), higher Damage Reduction (The built-in high-performance
    shock absorber virtually nullifies damage from physical attacks. Armor attached
    to the arms of the Chaser has the ability to deploy a protective shield. A high-powered
    shield generator is built into the armor, forming an energy shield that covers
    the entire body, dramatically increasing its defensive capabilities), Awakened
    Power (A protective suit that covers the Chaser's entire body has the ability
    to strengthen physical abilities beyond their limits by eliminating wastefulness
    in movement through localized automatic expansion and contraction and electrical
    stimulation of the transformer), Fusionism Negation, Durability Negation (A high-frequency
    vibration generator is built into the blade of Signal Axe, allowing it to cut
    through any object in an instant), Vibration Manipulation (Chaser's armor has
    the ability to generate directional shock waves. A high-frequency vibration generator
    is built into the blade of Signal Axe), Statistics Amplification (When the finisher
    is activated, Chaser's power is increased. When using Zoom Chaser, Chaser gets
    significantly faster), Flight via Ride Booster Blue, Upgraded Resistance to Time
    Manipulation (Core Driviar-ONE has the power to countered Super Heavy Acceleration),
    Vibration Manipulation
