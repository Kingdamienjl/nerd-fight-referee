- id: claim-standard-equipment-0f59a508
  section: equipment
  axis: equipment
  text: "Calibur Arc, End of Solomon Arc, and Storious Arc= Raimeiken Ikazuchi: Ikazuchi\
    \ is Espada's personal sword. It is forged by holy lightning over several years.\
    \ Kento inherited this sword after Kyoichiro Shinsen's death. Kento abandoned\
    \ Ikazuchi during Legeiel/Zooous and a majority of the Solomon Arc. Gatrikephone/Ride\
    \ Gatrike: Kento's Wonder Ridebook that can change into the Ride Gatriker. As\
    \ a phone, Gatrikephone is a phone that has information analysis and many information\
    \ apps that help Blades. As a bike, it can be used for combat. It has two machine\
    \ guns that can fire 200 bullets per second, moved at 223 km/h, and move in rough\
    \ and corrosive roads. It also has a light attack that passes through matter.\
    \ Lamp do Alangina: Kento\u2019s Primary Wonder Ridebook containing the power\
    \ of the Story \u201CLamp do Alangina\u201D. Kento uses this to transform into\
    \ Kamen Rider Espada, Lamp do Alangina. Needle Hedgehog: Kento\u2019s Wonder Ridebook\
    \ containing the power of the Animal \u201DNeedle Hedgehog\u201D. Kento uses this\
    \ along with Lamp do Alangina to transform into Kamen Rider Espada, Lamp do Hedgehog.\
    \ If used with Lamp do Alangina and Tri-Cerberus, Golden Alangina can be achieved.\
    \ Tri-Cerberus: Kento\u2019s Wonder Ridebook containing the power of the God-Beast\
    \ \u201DTri-Cerberus\u201D. Kento uses this along with Lamp do Alangina to transform\
    \ into Kamen Rider Espada, Lamp do Cerberus (This form was never used in the show).\
    \ If used with Lamp do Alangina and Needle Hedgehog, Golden Alangina can be achieved.\
    \ Ankokuken Kurayami:Kurayami is Calibur's personal sword. It has been sharpened\
    \ in the depths of darkness over many years. Kento inherited this sword after\
    \ Kamijou Daichi's death. He used Kurayami in Legeiel/Zooous Arc and a majority\
    \ of Solomon Arc. Jaaku Dragon: Kento\u2019s Primary Wonder Ridebook containing\
    \ the power of the God-Beast \u201CJaaku Dragon\u201D. Kento uses this to transform\
    \ into Kamen Rider Calibur, Jaaku Dragon. Jaou Dragon: Kento's Wonder Ridebook\
    \ containing the power of the God-Beast \u201CJaou Dragon\u201D. Kento uses this\
    \ to upgrade into Kamen Rider Calibur, Jaou Dragon. Jaou Dragon has a property\
    \ of sealing Seikens."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
