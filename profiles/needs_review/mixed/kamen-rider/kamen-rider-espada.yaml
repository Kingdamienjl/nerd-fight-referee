- id: claim-powers-and-abilities-fbb8cbee
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Acrobatics, Preparation, Genius Intelligence,\
    \ Martial Arts, Weapon Mastery, Vehicular Mastery, Portal Creation (With Book\
    \ Gate, Kento can make a portal to the Sword of Logos Northern Base, anywhere\
    \ on Earth, and Wonder World), Transformation, Energy Manipulation, Explosion\
    \ Manipulation, Non-Physical Interaction (with Seiken), Precognition (Kurayami\
    \ gives the user visions of possible futures. He foresaw multiple fights and outcomes\
    \ of each fight. When he gave up Kurayami, he still saw visions but not to the\
    \ extent that it ruins his life), Supernatural Willpower (Espada broke free of\
    \ Solomon\u2019s body control, through sheer willpower.), Power Nullification\
    \ (Kento can use Ikazuchi or Kurayami to cause attacks to dissipate), Holy Manipulation\
    \ (All of the Seiken are Holy weapons that is strong against evil), Damage Boost\
    \ (When Kento is fighting alongside Kamen Rider Kenzan, their strength is multitudes\
    \ stronger), Limited Resistance to Existence Erasure (Kento resisted Kurayami's\
    \ Existence Erasure long enough for him to become Calibur), Resistance to Electricity\
    \ Manipulation, Corrosion Inducement, Gravity Manipulation All of Civilian Abilities\
    \ but to a higher extent, Electricity Manipulation, Regeneration (Low-Mid), Animal\
    \ Manipulation and Summoning (He can summon and control a magical carpet, Lamp\
    \ do Alangina, Tri Cerberus, and Needle Hedgehog), Enhanced Senses (Comparable\
    \ to Saber and Blades. Espada has Night Vision. With the Needle Hedgehog Mask,\
    \ Espada can sense any danger coming his way.), Afterimage Creation (Espada is\
    \ fast enough to leave afterimages), Status Effect Inducement (Espada\u2019s Psyplasma\
    \ Visor can emit a gaze so bright, it can momentarily impair the enemies' movement\
    \ and can numb the opponents' eyes), Durability Negation (Needle Hedgehog's attacks\
    \ grow needles inside the enemy piercing their insides. The quills can extend,\
    \ piercing the opponents from the inside out.), Statistics Amplification (Espada\
    \ can amplify his speed enough to blitz opponents with similar speed to him. By\
    \ activating a special ability, Espada can boost his AP significantly.), Reactive\
    \ Power Level (Ikazuchi gets stronger as it generates more lightning), Empowerment\
    \ (Ikazuchi's lightning energizes the user's life.), Danmaku (Espada can shoot\
    \ out thousands of needles from Needle Hedgehog), Body Control (Espada can grow\
    \ thousand of quills all over his body.), Cloth Manipulation (Espada can use Catena\
    \ Cloak to bind enemies. He can also use Arcana Shade to dispel attacks.), Statistics\
    \ Amplification (Espada's Tri-Cerberus can triple his offense), Resistance to\
    \ Acid Manipulation, Spatial Manipulation (Espada can tank Calibur's Kurayami),\
    \ Air Manipulation, Darkness Manipulation, Energy Manipulation, Sound Manipulation,\
    \ Light Manipulation, Deconstruction, Matter Manipulation, Explosion Manipulation\
    \ All of Civilian Abilities but to a higher extent, Darkness Manipulation, Teleportation,\
    \ Enhanced Senses (Comparable to Saber and Blades. Calibur has Night Vision. Calibur\
    \ can see through the eyes of the dragons he summon in Jaou Dragon.), Damage Boost\
    \ (Kurayami\u2019s power and sharpness increases as it faces the light), Spatial\
    \ Manipulation (Kurayami can cut through space), Animal Manipulation and Summoning\
    \ (Calibur can summon and control Jaaku Dragon and the Jaou Dragons), Statistics\
    \ Amplification (By activating a special ability, Calibur can boost his AP significantly),\
    \ Corruption and Existence Erasure (Those who have been corrupted by Kurayami's\
    \ Darkness will have their very existence erased), Paralysis Inducement through\
    \ Curse Manipulation (Calibur's darkness can put a curse that paralyzes the opponent.),\
    \ Status Effect Inducement (Calibur\u2019s Jaaku Sole can bind an opponent\u2019\
    s actions by stepping on their shadow. He can also bind people with his darkness\
    \ manipulation which, significantly damages the opponent.), Absorption and Attack\
    \ Reflection (Kurayami can absorb and negate incoming energy attacks. He can also\
    \ send the attack back at the opponent. Calibur Jaou Dragon can do the same thing\
    \ but to a higher extent and without the need of Kurayami.), Damage Reduction\
    \ (Calibur\u2019s scales and armor can minimize damage.), Deconstruction (Calibur\u2019\
    s attacks can crush anything into ashes in Jaou Dragon), Flight via Levitation\
    \ (Jaou Dragon), Sealing (Calibur can seal the powers of other Seikens in Jaou\
    \ Dragon), Stealth Mastery (Calibur can completely blend into darkness), Explosive\
    \ and Elemental Aura (Calibur can make an aura of darkness), Resistance to Acid\
    \ Manipulation, Spatial Manipulation, Electricity Manipulation, Air Manipulation,\
    \ Darkness Manipulation, Energy Manipulation, Sound Manipulation, Light Manipulation,\
    \ Deconstruction, Matter Manipulation, Explosion Manipulation"
