  attack_potency:
    text: 'Wall level for Fighters (Dogma Fighters are cybernetically enhanced humans
      who are far beyond human strength, being able to quickly kill adult humans with
      a single strike. They are also able to fight each other, who in turn can survive
      explosions), Large Star level+ (Bodyguards are shown to be on a higher rank
      that General Megarl, and should be stronger than him. Are able to contain Dogma
      Kaijins) | Large Star level+ (Many Kaijins are shown to be a great threat even
      for the might and martial arts skill of Kamen Rider Super-1, sometimes forcing
      him to resort to their own specific weaknesses to have a chance) Power Source:
      They utilize many elements derivated of nuclear weaponry, magic from different
      types, chemistry, and cyber-engineering, considering they were able to rebuild
      Kamen Rider Super-1''s structure. Industrial Capacity: Can produce Kaijins containing
      dangerous and extraordinary abilities, such as electricity capable of matching
      Super-1''s 300 million volts beam, hypnotics, precognition and illusion masters,
      and even monsters that can invade alter dreams through special types of cells
      and bacteria. They can also produce mass-destruction weapons that have the potential
      of consuming Earth, such as the X-9 Cell. Military Prowess: DogmaFighter.jpg|Dogma
      Fighters Dogma_Bodyguards.jpg|Dogma Bodyguards'
