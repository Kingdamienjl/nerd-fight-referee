- id: claim-standard-equipment-3f5b4421
  section: equipment
  axis: equipment
  text: "*Den-O Belt: Ryotaro\u2019s Henshin belt that allows him to transform into\
    \ Kamen Rider Den-O. By pressing the colored buttons and scanning with the Liner\
    \ Pass, Ryotaro can transform or switch into all his forms. Attached to the belt\
    \ is the DenGasher, Ryotaro\u2019s personal weapon. *Rider Pass: A device to scan\
    \ on the belt, allowing Ryotaro to transform. *Climax Cellphone K-Taros: An attachment\
    \ for the Den-O Belt which allows Ryotaro to access his Climax Forms and his Liner\
    \ Form. It also has the ability to to contact the Taros throughout time. *DenGasher:\
    \ Ryotaro\u2019s personal weapon, a four piece set which can be connected to create\
    \ various weapons which match the many forms of Den-O. It can take the form of\
    \ a sword, rod, ax, gun, boomerang, or a hatchet. New Den-O has also shown to\
    \ be able to create a naginata and Den-G has created a Jitte. *DenKamen Sword:\
    \ Liner Form's primary weapon, a large sword with a blade in the shape of a clock\
    \ hand, created by the Taros for Ryotaro thanks to Ryutaros' drawing, serving\
    \ as a means of communication from the Den-Liner. Once the Rider Pass is inserted\
    \ into the blade, Den-O assumes Liner Form to use the sword's full power. The\
    \ four Tar\u014Ds are then (humorously) united at a single point. By pulling the\
    \ Delta Lever, the faces on the front of the sword will rotate 90 degrees, allowing\
    \ Ryotaro to access various finishers corresponding to the face used. *The DenLiner:\
    \ The DenLiners are a set of 4 bullet trains, each corresponding to their own\
    \ rider forms and having their unique weapons. Each train can be used separately\
    \ but is usually fused into a singular train, using all of the DenLiner\u2019\
    s abilities at once. It\u2019s most frequently used ability is the ability to\
    \ go forwards and backwards in time. *Machine Den-Bird: Ryotaro\u2019s Rider Machine,\
    \ the Denbird. It\u2019s main use is to control the DenLiner but Ryotaro could\
    \ eject the motorcycle out of the head of the DenLiner. *Optional Equipment **KingLiner:\
    \ Like other Liners, the KingLiner is a bullet train which can travel through\
    \ time. It can be used to connect to other Liners or use it\u2019s Station Mode\
    \ to create a makeshift terminal for Liners. The KingLiner is shown to superior\
    \ to the DenLiner and is armed with blue lasers near the sides of the Liner."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
