      value: "Often relies on the Imagin to fight while using his body as a vessel,\
        \ as he trained more with the others he learned to fight more by himself,\
        \ shown when he gained access to Liner Form. Although he became more capable\
        \ at fighting alone, Ryotaro seems to still work best with the other Taros\
        \ through teamwork. Extremely unlucky to the point that he managed to lodge\
        \ himself in a tall tree while on his bike after losing control and going\
        \ up a fallen sign. Plat Form does not have sufficient armor and pales in\
        \ comparison to the abilities of the other forms making it the weakest form.\
        \ Due to the nature of Climax Form, the Tar\u014Ds need to work as a unit\
