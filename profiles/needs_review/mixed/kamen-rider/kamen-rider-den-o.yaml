- id: claim-weaknesses-a201f1cf
  section: weaknesses
  axis: weakness
  text: "Often relies on the Imagin to fight while using his body as a vessel, as\
    \ he trained more with the others he learned to fight more by himself, shown when\
    \ he gained access to Liner Form. Although he became more capable at fighting\
    \ alone, Ryotaro seems to still work best with the other Taros through teamwork.\
    \ Extremely unlucky to the point that he managed to lodge himself in a tall tree\
    \ while on his bike after losing control and going up a fallen sign. Plat Form\
    \ does not have sufficient armor and pales in comparison to the abilities of the\
    \ other forms making it the weakest form. Due to the nature of Climax Form, the\
    \ Tar\u014Ds need to work as a unit to fight, and their strengths are incorporated\
    \ into Climax Form."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-d7af4086
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics while possessed by Imagin, Acausality\
    \ (Type 1, As a Singularity Point, he exists independently of time itself, and\
    \ be unaffected by changes after a timeline paradox. This makes him invulnerable\
    \ against time manipulators. This includes an immunity to losing his memories\
    \ and powers upon the creation of Another Den-O), Martial Arts, Weapon Mastery,\
    \ Vehicular Mastery, Social Influencing (While possessed by Urataros, he is easily\
    \ capable of convincing and charming others), Broadway Force (While possessed\
    \ by Ryutaros, his dancing will cause those around Ryotaro to join in against\
    \ their will. This can even be used to drive those under the control away from\
    \ their current location), Summoning (While possessed by Ryutaros, his dancing\
    \ will bring in a group of people who often dance alongside him even if they're\
    \ not in the area at the moment), Size Manipulation against Imagins (While possessed\
    \ by Sieg, he is capable of shrinking Imagin down to where they are comparable\
    \ in size to a candy), Multiple Selves (Type 1) while possessed by Imagin, Time\
    \ Travel with DenLiner, Limited Telepathy with the Taros', Transformation, Limited\
    \ Resistance to Possession (As a Singularity Point, he can suppress an Imagin's\
    \ will when it takes over their body and is not tempted by the free wish an Imagin\
    \ can grant. As long as he is conscious, he can expel the Imagin from his body\
    \ and send it back to the Train of Time) All previous abilities, Superhuman Physical\
    \ Characteristics, Acrobatics, Energy Manipulation (Many of his attacks are energy-based),\
    \ Explosion Manipulation (His attacks have a tendency to cause explosions. The\
    \ DenLiner can also create explosions through it's weapons), Electricity Manipulation,\
    \ Empathic Manipulation (The secretes adrenaline to increase physical performance),\
    \ Enhanced Senses (Can see in . Can also ), Homing Attack (The can detect and\
    \ track targets), Attack Reflection (Part 3 of the DenGasher can repel enemy attacks.\
    \ Parried the Scorpion Imagin\u2019s attack), Non-Physical Interaction (Parried\
    \ the bullets, which were made of light), Underwater Breathing (Type 3) in Rod\
    \ Form (His can produce both oxygen and hydrogen), Weather Manipulation in Gun\
    \ Form (Gun Form can summon storms), Large Size (Type 2) for the DenLiner (Has\
    \ a max length of 185 meters, 312 meters when combined with the KingLiner) Magnetism\
    \ Manipulation (The DenLiner can create a to increase it movement speed), Light\
    \ Manipulation (The DenLiner can fire and a from Ikazunchi\u2019s mouth), Aura\
