- id: claim-powers-and-abilities-6e607236
  section: abilities
  axis: hax
  text: '*Kamen Rider Physiology **Enhanced Senses (Due to being incorporated with
    a grasshopper''s genes, he most likely possessed the same characteristics of one.
    Grasshoper''s sensory organs: the compound eye and antenna can provide a greater
    field of vision, as well as other information such as light intensity, humidity,
    vibration, wind velocity, and so on. Should be comparable to other Kaijins, who
    can sense Black Sun''s presence over great distancesKamen Rider Black Sun; Ep.
    1) **Non-Physical Interaction (Should be comparable to Shadowmoon, who can deflect
    Bishum''s air gust.Kamen Rider Black Sun; Ep. 6 He could also physically grasp
    Shadowmoon''s telekinesis force) *Bodily Weaponry (He possesses sharp claws and
    spines on both hands, and he can bite foes with his jaws.Kamen Rider Zukan: Kamen
    Rider Black Sun He can also utilize the grasshopper legs that sprouted from his
    back as a swordKamen Rider Black Sun; Ep. 5) *Regeneration (Mid-Low; He likely
    regenerated the wound that Spider Kaijin had stabbed him in the back. He likely
    regenerated after being stabbed in the abdomen by Shadowmoon) *Forcefield Creation
    and Statistics Amplification (The Century King Sun Driver can generate a special
    magnetic field that surrounds the abdomen and increases the driver''s output.
    It is also capable of amplifying the "Vital Photon," the root of life found in
    all living things, and manifesting the power of fusion and evolution beyond the
    lineage) *Limited Body Control (When the grasshopper legs are removed from his
    back, the internal muscles tighten and stiffen, transforming it into the sturdy
    and linear shape of a blade) Same as before, plus: *Damage Reduction (Ex Shell
    Armor''s super-hardened skin acts as an exoskeleton, minimizing or nullifying
    internal damage from opponent strikes) *Energy Manipulation (He can focus the
    "Vital Photon" life force into his fist and leg at once by performing "Vital Charge"
    to increase the strength of his attacks. He could also imbue Century King Black
    Blade with the same energy, giving it greater cutting power) *Additional Enhanced
    Senses (Black Eyes have a broad field of vision and can focus to see clearly from
    800 meters away. He can detect even the smallest quantity of light, allowing him
    to function correctly even in dark places. The Sensor Antennae on his head can
    detect subtle changes in the environment, such as air currents and temperature,
    as well as the source of the attack, allowing for swift evasion and defense) *Extrasensory
    Perception (Alarm Points are extra sensory organs that enable him to identify
    events that the naked eye cannot detect, such as presence hiding in shadows and
    murderous intent, as well as approaching dangers) *Minor Light Manipulation (He
    has the ability to emit light through his eyes and the Sun Line that runs through
    his body) Likely the same abilities as Black Locust Kaijin and the original Creation
    King, which includes: *Telekinesis (He possesses psychic ability that allows him
    to freeze, push, pull, and crush opponentsKamen Rider Black Sun; Ep. 7) *Immortality
    (Type 2; After being ripped from his body, his heart continues to beat and moves
    toward KotaroKamen Rider Black Sun; Ep. 10) *Biological Manipulation (His heart
    somehow managed to forcibly turn Kotaro into the next Creation King) *Organic
    Manipulation (The Creation King has the power to secrete a rare extract that can
    be used as a material for Heat Haven,Kamen Rider Zukan: Creation King (Giant Locust
    Kaijin)Kamen Rider Zukan: Heat Haven a substance that can activate Kaijin''s abilities,
    heal, inhibit aging, or even create new Kaijin) *Light Manipulation & Information
    Analysis (The Eternal Lights can quickly detect obstacles on the runway and warn
    the pilot of danger through the instruments) *Telepathy (The Synchronizer can
    synchronize with the pilot''s sensory organs to read the pilot''s intentions and
    assist in enabling more intuitive driving) *Limited Absorption (The Driver''s
    Seat are equipped with shock-absorbing material) *Body Control (The Reinforced
    Armor can be replaced with new armor once every few years due to the use of metabolic
    materialsKamen Rider Zukan: Battle Hopper)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
