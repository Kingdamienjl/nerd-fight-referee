- id: claim-standard-equipment-669c4c03
  section: equipment
  axis: equipment
  text: "Century King Sun Driver === The Transformation Belt Century King Sun Driver\
    \ (\u5909\u8EAB\u30D9\u30EB\u30C8 \u4E16\u7D00\u738B\u30B5\u30F3\u30C9\u30E9\u30A4\
    \u30D0\u30FC, Henshin Beruto Seiki \u014C San Doraib\u0101) is a transformation\
    \ device worn by Kotaro Minami. The belt is comprised of several parts, including:\
    \ *Raging Band, the belt that creates a specific magnetic field around the abdomen\
    \ in order to increase the driver's output. *Vital Circuit, special biological\
    \ circuits formed within the Century King Sun Driver. It optimizes the flow of\
    \ Vital Photons, the source of life in all living beings' bodies, and instantly\
    \ amplifies their strength. The Kaijin transformation process combines the Vital\
    \ Circuits of other species into the human body, radically altering the creature's\
    \ body structure. *Variable Cell, a special material that makes up all parts of\
    \ the Century King Sun Driver, is a form of artificial cell capable of complex\
    \ mechanical shape memory and spreading throughout the body as cell fragments.\
    \ *Energy Reactor is the central unit functions as a detonator and reactor, generating\
    \ the power required for transformation and battle. If the Kingstone is present\
    \ within, the output will increase and a peculiar power may appear."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
