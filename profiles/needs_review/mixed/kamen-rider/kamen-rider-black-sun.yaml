        biological circuits formed within the Century King Sun Driver. It optimizes
        the flow of Vital Photons, the source of life in all living beings' bodies,
        and instantly amplifies their strength. The Kaijin transformation process
        combines the Vital Circuits of other species into the human body, radically
        altering the creature's body structure., Variable Cell, a special material
        that makes up all parts of the Century King Sun Driver, is a form of artificial
        cell capable of complex mechanical shape memory and spreading throughout the
        body as cell fragments., Energy Reactor is the central unit functions as a
        detonator and reactor, generating the power required for transformation and
        battle. If the Kingstone is present within, the output will increase and a
