- id: claim-powers-and-abilities-fb276b32
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Genius Intelligence *Weapon Mastery
    *Martial Arts *Possession and Mind Manipulation (Can possess any living being
    to carry out his plans) *Hacking (Able to hack the GPS on a stolen motorcycle,
    and steal the completed Sclash System data from Sento''s computer) *Matter Manipulation
    (Manipulated a tablet computer into a rod-shaped item that he used as a back scratcher)
    *Biological Manipulation (Using a cloud of steam from his hand, he can change
    a person''s face) *Memory Manipulation (Erase Sento''s memory) *Body Control (Can
    liquefy and scatter his genes, thus ensuring his survival) *Teleportation *Fire
    Manipulation (Can shoot a crimson flare from his hand) *Breaking the Fourth Wall
    *Information Analysis (He can determine a person''s Hazard Level) *Self-Sustenance
    (Type 1) All General Abilities, *Fire Manipulation *Energy Manipulation (He can
    also create an energy cobra projection through his suit to attack or capture targets)
    *Enhanced Senses *Smoke Manipulation with Transtream Gun *Electricity Manipulation
    *Ice Manipulation and Biological Manipulation with Transtream Gun Rifle Mode (Can
    shoot electricity, icy mist and transforming anybody who comes in contact with
    it into a Smash) *Homing Attack when using Transtream Gun''s finishers *Information
    Analysis and Regeneration (His helmet can analysis battle data in real-time and
    performs emergency repair a damaged part of the suit automatically) *Poison Manipulation,
    Paralysis Inducement and Deconstruction (He has extendable venomous tendrils that
    can shoot out and stab victims, injecting them with venom capable of either paralyzing,
    killing, or even disintegrating them) *Damage Reduction (BS Face Guard can nullify
    the damage) *Statistics Amplification (Cobra Chest Armor increases the user''s
    fighting ability, accelerates the user''s movement speed and attack power) *Stealth
    Mastery and Paralysis Inducement (Hide Seeker Shoes suppress sound for stealth
    attacks, as well as release special steam and deliver kicks with paralyzing effect)
    Kamen Rider Evol Phase 1,2,3= All Bloodstalk abilities enhanced, plus: *Rage Power
    *Gene Manipulation (Can scatter his cells to manipulate his army such as Lost
    Smash or copy of Remocon Bro''s & Engine Bro''s, or ensure his survival) *Aura
    Generation (Can generate a special aura to increase his strength or movement speed)
    *Enhanced Fire Manipulation in Phase 2 *Enhanced Superhuman Speed in Phase 3 *Telekinesis
    (Menace Rush Arms can manipulate a special aura that can move objects at will
    or detain his opponents) *Durability Negation and Spatial Manipulation (EVO Xeno
    Vader Shoes can ignore the armor of a target and strike destructive energy into
    the opponent''s internal organs. Evol can also manipulate nearby space to perform
    kick attacks) *Teleportation and Shapeshifting (EVO Material allows warp teleportation,
    and can change each part into a more aggressive shape to increase the power of
    its attacks) Kamen Rider Evol Phase 4 (Black Hole)= All Phase 1,2,3''s abilities
    enhanced, plus: *Black Hole Creation *Statistics Amplification (The special core
    in his chest armor "Catastrophe Reactor" can increase more combat ability up to
    50 times) *Gravity Manipulation (EVO Vector Rope can control the surrounding gravity
    and also be weighted and accelerated when performing normal combat moves) *Void
    Manipulation and Forcefield Creation (Void Chest Armor can deploy a space shield
    of emptiness that a normal human being cannot recognize, nullifying enemy attacks)
    *Body Puppetry (Catastrophe Reactor has the power to forcibly suspend all existing
    life activities within the influence range) All previous abilities significantly
    enhanced, plus: *Absorption (Can absorb a planet to increase his power and create
    new weapons via a black hole) *Enhanced Teleportation (Can now teleport to another
    planet) Resistance to Gas Manipulation, Fragrance Manipulation, Biological Manipulation
    (Those exposed to Nebulas Gas would immediately be converted into a Smash) and
    minor Memory Manipulation (Transformed into a Smash will caused the victims to
    suffer with short-term memory loss)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
