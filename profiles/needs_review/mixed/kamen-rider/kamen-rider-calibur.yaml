- id: claim-powers-and-abilities-16529704
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Weapon Mastery, Martial Arts, Acrobatics,\
    \ Energy Manipulation, Holy Manipulation (All of the Seiken are Holy weapons that\
    \ is strong against evil), Darkness Manipulation, Teleportation, Transformation\
    \ (Daichi can transform into Calibur Jaaku Dragon or Calibur Jaou Dragon. His\
    \ stats on Jaou Dragon far surpasses that of Jaaku Dragon.), Explosion Manipulation,\
    \ Regeneration (Low-Mid), Non-Physical Interaction (with Seiken), Enhanced Senses\
    \ (Comparable to Saber and Blades. Calibur has Night Vision. Calibur in Jaou Dragon\
    \ can see through the eyes of the dragons he summon.), Precognition (Kurayami\
    \ gives the user visions of possible futures), Power Nullification (Calibur can\
    \ cancel out and cause attacks to dissipate.), Damage Boost (Kurayami\u2019s power\
    \ and sharpness increases as it faces the light.), Spatial Manipulation (Kurayami\
    \ can cut through space.), Animal Manipulation and Summoning (Calibur can summon\
    \ and control Jaaku Dragon and the Jaou Dragons.), Paralysis Inducement through\
    \ Curse Manipulation (Calibur's darkness can put a curse that paralyzes the opponent.),\
    \ Corruption and Existence Erasure (Those who have been corrupted by Kurayami's\
    \ Darkness will have their very existence erased), Statistics Amplification (By\
    \ activating a special ability, Calibur can boost his AP significantly.), Status\
    \ Effect Inducement (Calibur\u2019s Jaaku Sole can bind an opponent\u2019s actions\
    \ by stepping on their shadow. He can also bind people with his darkness manipulation\
    \ which, significantly damages the opponent.), Absorption and Attack Reflection\
    \ (Kurayami can absorb and negate incoming energy attacks. He can also send the\
    \ attack back at the opponent. Calibur Jaou Dragon can do the same thing but to\
    \ a higher extent and without the need of Kurayami.), Damage Reduction (Calibur\u2019\
    s scales and armor minimizes damage), Deconstruction (Calibur\u2019s attacks can\
    \ crush anything into ashes in Jaou Dragon), Flight via Levitation (Jaou Dragon),\
    \ Sealing (Calibur can seal the powers of other Seikens in Jaou Dragon), Stealth\
    \ Mastery (Calibur can completely blend into darkness), Explosive and Elemental\
    \ Aura (Calibur can make an aura of darkness), Resistance to Fire Manipulation,\
    \ Electricity Manipulation, Corruption, Spatial Manipulation, Air Manipulation,\
    \ Darkness Manipulation, Energy Manipulation, Sound Manipulation, Deconstruction,\
    \ Fire Manipulation, Absolute Zero, Corrosion Inducement, Matter Manipulation,\
    \ Gravity Manipulation, Explosion Manipulation"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
