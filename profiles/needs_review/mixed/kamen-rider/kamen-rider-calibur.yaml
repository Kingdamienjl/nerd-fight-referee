- id: claim-standard-equipment-19287399
  section: equipment
  axis: equipment
  text: "Ankokuken Kurayami: Kurayami is Kamijo\u2019s personal sword. It is forged\
    \ in the depths of darkness over several years. Kurayami has the property of absorbing\
    \ attacks from opponents and throwing them back at them. It can also cut through\
    \ space if wielded by a skilled swordsman. Jaaku Dragon: Kamijo\u2019s Primary\
    \ Wonder Ridebook containing the power of the God-Beast \u201CJaaku Dragon\u201D\
    . Kamijo uses this to transform into Kamen Rider Calibur, Jaaku Dragon. Jaou Dragon:\
    \ Kamijo's Wonder Ridebook containing the power of the God-Beast \u201CJaou Dragon\u201D\
    . Kamijo created this Ridebook after gaining enough battle data from the Megids\
    \ and the other riders. Kamijo uses this to upgrade into Kamen Rider Calibur,\
    \ Jaou Dragon."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
