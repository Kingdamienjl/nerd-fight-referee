  axis: equipment
  text: "Ankokuken Kurayami: Kurayami is Sophia\u2019s personal sword. It is forged\
    \ in the depths of darkness over several years. Kurayami has the property of absorbing\
    \ attacks from opponents and throwing them back at them. It can also cut through\
    \ space if wielded by a skilled swordsman. It also gives the user Jaaku Dragon:\
    \ Sophia\u2019s Primary Wonder Ridebook containing the power of the God-Beast\
    \ \u201CJaaku Dragon\u201D. Sophia uses this to transform into Kamen Rider Calibur,\
    \ Jaaku Dragon. Jaou Dragon: A Wonder Ride Book that is made for Kurayami. It\
    \ is used by multiple Kamen Rider Caliburs but Sophia has never used it."
  source_ids: *id003
  decisive: false
