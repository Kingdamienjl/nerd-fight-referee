        \ is able to disintegrate anything it touches into ash. It flows within Faiz's\
        \ suit and can be used when Faiz activates his weaponry), Durability Negation\
        \ (When Faiz uses Crimson Smash, he can phase through enemies, destroying\
        \ them from the inside), Gravity Manipulation (The Faiz Edge allows Faiz to\
