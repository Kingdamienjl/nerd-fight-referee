  section: equipment
  axis: equipment
  text: '*Diendriver: Kaito''s primary weapon and transformation device. *Diend Belt:
    A belt worn around Diend''s waist which resembles the Decadriver, with its card
    scanner replaced with an empty casing which protrayed Diend''s insignia. Said
    casing can be removed to insert his K-Touch. *Card Holder: A card holder which
    Diend use to contain his Rider Cards, in a similar manner to Decade''s Ride Booker.
    It is stored on the left side of his Diend Belt and has a maximum 18-card capacity.
    *K-Touch: Diend''s device that allows him to transform into Complete Form. *Rider
    Cards: Gives access to Diend to power-up his attacks and summon any Kamen Riders,
    depending on which card used.'
  source_ids: *id003
