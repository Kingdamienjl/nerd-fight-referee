  intelligence:
    text: Supergenius (It has been stated that Sento has the "highest IQ of all the
      Heisei Riders", surpassing even that of Kuroto Dan. Sento is a genius in several
      fields of science and can create several Rider devices. Created the copies of
      alien devices [Evol Trigger and Evol Driver] such as the Build Driver and Hazard
      Trigger, mastering the usage of in his technology a Gas that warps Physics and
      Space-Time. For example, the Sky Wall notably had Bugster Viruses in them which
      is not found in Build's Universe, but rather Ex-Aid's. Came up with a way to
      safely harness the power of the Hazard Trigger, a feat of intelligence not even
      his previous self, Takumi Katsuragi, could manage to figure out. Incredibly
      skilled in combat, showing a finesse in the use of his Fullbottle abilities
      as well as weaponry, which allows him to often overwhelm his opponents. Cultivated
      and activated inert Evolt Cells despite Evolt being a completely alien life
      form. When he was Takumi Katsuragi, he helped Kaisei Mogami develop both the
      Kaiser System and the Enigma which allowed the user to travel through parallel
      universes, or combine them to cause their ultimate destruction. Fixed two Time
      Mazines, which are time travelling mechas, without any prior knowledge on they
      worked, effortlessly repairing and figuring out how to use them within minutesKamen
      Rider Heisei Generations Forever)
