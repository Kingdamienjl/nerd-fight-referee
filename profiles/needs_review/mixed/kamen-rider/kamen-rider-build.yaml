    - field: range
      value: 'Standard Melee Range to 1500 meters Teamwork: Team Build''s coordination
        with each other is impeccable with only a short time knowing each other. The
        main set of members that go into combat are the Kamen Riders and preparation
        is mainly done by Sento, Sawa, and Misora. When Build achieved Genius Form,
        he was able to communicate a battle strategy with the others without directly
        communicating. This made their coordination even greater as now, they could
        form team strategies in the middle of battle. If one of them falls, it only
        motivates the others to be stronger, reaching higher magnitudes among their
        Hazard Levels. For example: When Grease died and Rogue was the only one left
        standing after Build and Cross-Z de-transformed, Rogue was able to spike his
        Hazard Levels to over 50x his original powerKamen Rider Build Episode 48.
        For the Kamen Riders, they can use and pass around the 60 Full Bottles in
        their possession. For example, Rogue currently has the Phoenix Bottle, but
        if Build needs it to transform into PhoenixRobo Form, Rogue will pass it to
        Build. If any of the Riders need to defend themselves, Build could pass them
        the Diamond Full Bottle. Kamen Rider Build, the leader, serves as the strategist
        of the group. He creates items that improve his teammates'' arsenals or counters
        their enemies completely. Build also comes up with strategies that have led
        them to overcome enemies who had major advantages over them. With enough data
        and knowledge, he can debunk enemy plans and make counter-strategies that
        have toppled other extraordinary geniuses and master manipulators. Kamen Rider
        Cross-Z is physically the strongest of Team Build. With strong enough feelings,
        his Hazard Level can raise far higher than any of the other Kamen Riders which
        allows him to overcome those who were initially stronger than him. Build and
        Cross-Z share a brain and brawn relationship that complements each other perfectly.
        If either of them are down and demotivated, one of them can give the other
        a speech that motivates them to do better. This can result in the both of
        them being revitalized and raising their Hazard Levels. Kamen Rider Grease
        is the moral compass of the team, but also the most likely to go into a fighting
        frenzy. Additionally, he is the veteran of the team. Grease''s Hazard Level
        significantly increase if his friends are in danger, especially Misora. If
        Misora is there to witness him fight, his Hazard Level spikes. While Build
        is level-headed, Grease and Cross-Z are both hot-headed and chaotic in battle.
        This doesn''t mean they cannot follow Build''s strategies, be reasoned with,
        or lose any form of competency. Cross-Z and Grease at times try to out do
        each other, resulting in them drawing out each other''s Hazard Levels. Against
        enemies, Kamen Rider Rogue is the most brutal and cold member of Team Build.
        When all is lost, he is the one to step up and risk his life to fight in the
        worst of situations. As a result, his Hazard Level spikes significantly. When
        pressured, he can save Team Build through BFR. As someone who survived a battle
        royale, Gentoku''s capable of focusing his rage and emotions against all odds,
        thus increasing his Hazard Level to defeat much stronger foes. Since he is
        a political figure, previously attempting to surpass his now deceased father,
        another large Hazard Level spike increase can occur when defending his country.
        Kamen Rider Mad Rogue is the most cunning and tricky of the team. He was able
        to trick multiple geniuses throughout the show. With his trickery, he was
        able to deceive Evolto and the members of Team Build into thinking that he
        was on the former''s side, but turned on him at the very end. When fighting,
        Mad Rogue is the most unhinged of the group, yet is by far their fastest learner.
        Utsumi was capable of easily becoming one of the strongest Riders in the series
        as early as his first appearance. Sawa is the spy of the group, easily capable
        of gathering information on seemingly anything Team Build needed. When the
        team is needs specific information, she goes undercover and acquires the desired
        intel quite casually. Misora is an internet celebrity that goes by the nickname
        of Mii-Tan. As an internet celebrity, she can request things online and her
        fans will grant her the request without a second thought. For example, she
        told her fans to identify an unknown fugitive and they managed to do so within
        seconds. As Vernage, Misora gains an immense amount of power, capable of fighting
        alongside the Kamen Riders temporarily.'
