  section: equipment
  axis: equipment
  text: 'Devices *Build Driver: Transformation device *Fullbottles: Transformation
    trinkets *Hazard Trigger: Build''s power up device, used to upgrade into a Hazard
    Form by attaching it to the Build Driver *Build Phone: Personal smartphone that
    can transform into his Rider Machine *Fullbottle Holder: Carrying straps for Fullbottles
    Weapons *Handheld Weapons **Drill Crusher: Build''s drill-like weapon. **Hawk
    Gatlinger: Build''s gatling gun-like weapon accessed by any form that uses the
    Taka[3] or Gatling Fullbottles. Also used by RabbitTank Sparkling Form. **4Koma
    Ninpoutou: Build''s katana-like weapon accessed by any form that uses the Ninjya
    or Comic Fullbottles. Also used by RabbitTank Sparkling Form. **Kaizoku Hassyar:
    Build''s bladed bow-like weapon accessed by any form that uses the Kaizoku or
    Densya Fullbottles. Also used by RabbitTank Sparkling Form. **Fullbottle Buster:
    Build''s personal chainsaw-like and cannon-like weapon, accessed by any form that
    uses the FullFull RabbitTank Bottle. Also used by Genius Form. *Suit-equipped
    weapons **Rabbit Foot Shoes: Build''s rabbit-like spring shoe accessed by any
    form that uses the Rabbit Fullbottle. **Tank Roller Shoes: Build''s tank-like
    tread shoe accessed by any form that uses the Tank Fullbottle. **Muscle Glove:
    Build''s gorilla-like gauntlet accessed by any form that uses the Gorilla Fullbottle.
    **BLD Prism Glove: Build''s diamond-like glove accessed by any form that uses
    the Diamond Fullbottle. **Solstall Wings: Build''s hawk-like wings accessed by
    any form that uses the Taka Fullbottle. **Onmitsu Scarf: Build''s ninja scarf
    accessed by any form that uses the Ninjya Fullbottle **Giant Scratcher: Build''s
    panda-like gauntlet accessed by any form that uses the Panda Fullbottle. **Space
    Ride Arm: Build''s rocket-like missile accessed by any form that uses the Rocket
    Fullbottle. **Spine Knuckle: Build''s hedgehog-like tekko accessed by any form
    that uses the Harinezumi Fullbottle. **Multi Deluge Gun: Build''s fire engine-like
    hose accessed by any form that uses the Shoubousha Fullbottle. **Gold Lio Gauntlet:
    Build''s lion-like gauntlet accessed by any form that uses the Lion Fullbottle.
    **Long Range Cleaner and Trash Converter: - Build''s vacuum cleaner-like weapons
    accessed by any form that uses the Soujiki Fullbottle. **Bind Master'
