- id: claim-standard-equipment-e8dc928c
  section: equipment
  axis: equipment
  text: "*Ank Point: The unique transformation belt Kino Kaoru uses to transform into\
    \ Another Agito. It's worn around the waist and channels the \"Alter Force\" and\
    \ houses Kino's Agito power. *Typhoon: Mido-Rider's transformation belt. By spinning\
    \ the windmill device within the center via wind energy, energy is produced, allowing\
    \ transformation and deathblows. *Dark Hopper: Another Agito\u2019s Rider machine.\
    \ It is a dirt bike that is able to move 390 km/h. The Dark Eyes of Dark Hopper\
    \ has night-vision, 360 vision and x-ray vision that can see through 15 m of substances.\
    \ Dark Hopper can give Another Agito all the information it receives. I can jump\
    \ 10 m into the air and can glide. It can also produce a smokescreen to obstruct\
    \ the enemies\u2019 sight. It can climb 80 degree slopes to get through rough\
    \ terrain."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
