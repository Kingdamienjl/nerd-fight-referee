        \ enemies by levitating them in the air, and overcharge the energy in the\
        \ blade, allowing it to perform more powerful cuts) and Explosion Manipulation\
        \ (His attacks have a tendency of causing explosions), Information Analysis\
        \ (The Global Feeler are the antennas which communicates with the Eaglesat\
        \ which collects information and downloads new programsKamen Rider Zukan),\
        \ Heat Manipulation with the Faiz Edge (It\u2019s Medium Mode can possibly\
