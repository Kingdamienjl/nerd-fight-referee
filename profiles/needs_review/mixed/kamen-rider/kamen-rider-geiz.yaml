- id: claim-powers-and-abilities-0d51747a
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Acrobatics, Transformation with Ziku\
    \ Driver and Ridewatches, Weapon Mastery, Hand to Hand Combat, Extrasensory Perception\
    \ (Can detectKamen Rider Zi-O novel the existence of Another RiderKamen Rider\
    \ Zi-O, Episode 33), Soul Manipulation and Conceptual Absorption via Blank Ridewatch,\
    \ Non-Physical Interaction (Can directly interact with Rider power in its incorporeal\
    \ formKamen Rider Zi-O, Episode 24), Limited Transmutation (Can shape Rider power\
    \ in the form he wish), Energy Manipulation (Most of his attacks are energy-based),\
    \ Enhanced Senses (Indication Butterfly is a visual device that gathers sensors\
    \ with a viewing angle of 300 \xB0 in a compound eye shape, can react greater\
    \ than normal human), Information Analysis (Gee Signal and D-Battle Sensor are\
    \ devices that gathers enemy's data and predicts enemy's movement in real time),\
    \ Analytical Prediction (His D-battle sensor in helmet can captures information\
    \ related to time and predicts the timing of enemy attacks and avoidance), Vibration\
    \ Manipulation and Durability Negation (His axe Zikan Zax can cut all materials\
    \ by propagating the resonance vibration created by feeding high-pressure energy\
    \ to the entire blade), Power Mimicry and Statistics Amplification when using\
    \ Rider Armor (Can use main ability of previous heisei riders by equip Rider Armors\
    \ and increase capabilities as same as the original one), Regeneration with Adjustrike\
    \ Suit (Automatically repairs minor damages), Time Travel with his Time Majin,\
    \ Minor Resistance to Time Stop (4 layers; Remain his consciousness in layered\
    \ time stop field of TsukuyomiKamen Rider Zi-O, Episode 49, move his body with\
    \ limited extent), Conceptual Absorption (He's able to remain power even if it's\
    \ taken) *Ghost Armor: All of Ghost's abilities including Summoning, Soul Manipulation\
    \ (Can summons Parka Ghosts, a soul of heroic spirits, to assist him in combat),\
    \ Abstract Existence (Type 1), Nonexistent Physiology (Nature Type 1 & 3, Aspect\
    \ Type 1 & 3), Intangibility, Invisibility, and Flight via Ghost Armor. *Drive\
    \ Armor: All of Drive's abilities including Enhanced Speed and Vehicle Manipulation\
    \ (Can launch Shift Cars to attack the enemy also can move with super speed with\
    \ based on Kamen Rider Drive) via Drive Armor. *Faiz Armor: All of Faiz's abilities\
    \ including Homing Attack and Deconstruction, Night Vision and limited X-Ray Vision\
    \ (with Ultimate Finder Indication Butterfly) via Faiz Armor, Paralysis Inducement\
    \ via Faiz phone. *Wizard Armor: All of Wizard's abilities including Magic (Can\
    \ use Fire-based magic attack which based on original rider, Wizard), Chain Manipulation\
    \ (Can creates magical chain to bind enemy), Ice Manipulation (Can shoot arrow\
    \ of ice to freeze the enemy), Size Manipulation (Can grow the size of his leg\
    \ to attack enemy), Damage Reduction, Extrasensory Perception, Power Nullification\
    \ and Forcefield Creation (Can create magical barriar) via Wizard armor. *Genm\
    \ and Ex-Aid Armor: All of Genm and Ex-Aid's abilities including Vehicular Combat\
    \ (He can summon a bike as a weapon or transport) and Game Area Creation via Genm\
    \ Armor. Video Game Physics and Game Area Creation via Ex-Aid Armor. *Build Armor:\
    \ All of Build's abilities including Empowerment and Reactive Power Level with\
    \ rising of Hazard Level. Resistance to Gas Manipulation, Fragrance Manipulation,\
    \ Biological Manipulation, Limited Memory Manipulation, Mind Manipulation *Bilibili\
    \ Armor: Pseudo-Flight and Empathic Manipulation via Bibiru Armor (Changes his\
    \ Ghost Ridewatch into Bibiru Ridewatch by his phasmophobia, and uses his fear\
    \ performing a surprise attack), Self-Sustenance (Type 1) Superhuman Physical\
    \ Characteristics, Weapon Mastery, Hand to Hand Combat, Energy Manipulation, Enhanced\
    \ Senses with Indication Spartan, Information Analysis with D-Battle Sensor, Regeneration\
    \ with Boosted Strike Suit (Restore damage automatically), Mode Switching (Geiz\
    \ Revive can switch 2 modes), Statistics Amplification with Regicide Time Arms\
    \ and Legs (Increase more punching and kicking power), Enhanced Strength, Defense\
    \ with Goretsu Mode. Super Speed and Flight with Shippu Mode. Time Manipulation\
    \ (Revive Gouretsu's power compresses time to strengthen Geiz's power and robustness,\
    \ while Revive Shippu's power expands time itself to boost Geiz's speed), Time\
    \ Manipulation Negation via Time Manipulation, Self-Sustenance (Type 1), Immortality\
    \ Negation (Type 4 and 8; Can defeat Another Riders without needing the corresponding\
    \ Rider power). Resistance to Time Manipulation (Effortlessly moving in Heavy\
    \ Acceleration of the Roimudes that slow down the flow of timeKamen Rider Zi-O,\
    \ Episode 47) All powers in Base Forms key with greater extend and powers of all\
    \ past secondary Heisei Kamen Riders before him (G3 - Cross-Z), plus Summoning\
    \ (Can summon all Secondary Riders' weapons), Immortality Negation (Type 4 and\
