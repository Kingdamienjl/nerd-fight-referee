- id: claim-powers-and-abilities-814fea39
  section: abilities
  axis: hax
  text: "Transformation, Martial Arts, Weapon Mastery, Extrasensory Perception (Can\
    \ sense the exact location of a Mirror Monster from a far distance) | All previous\
    \ abilities, Superhuman Physical Characteristics, Enhanced Senses (Imperer can\
    \ see 10 km and hear 18km away, has infrared vision, and night vision), Limited\
    \ Telepathy (The Zippet Thread transmitted user's will to contract monster), Acrobatics,\
    \ Dimensional Travel and Immersion (Can travel to the Mirror World through any\
    \ reflectable surface), Explosion Manipulation (His attacks have a tendency of\
    \ causing explosion), Information Analysis (Ryuki Riders can accurately detect\
    \ and track an enemy\u2019s position, and can use the battle information gained\
    \ by their Contract Monsters and vice versa. Contract Monsters can record the\
    \ characteristics of Mirror Monsters), Purification (Type 1; Ryuki Riders' masks\
    \ purifies poisonous gases and other dangerous substances), Summoning with Advent\
    \ (Can summons Gazelle-type Mirror Monsters and weapons), Resistance to Density\
    \ Manipulation (Ryuki Riders can withstand water pressure up to 10,000m in the\
    \ deep sea), Poison Manipulation (Ryuki Riders were directly hit by Ouja\u2019\
    s Venosaber which has poison but wasn't affected), Fragrance Manipulation via\
    \ mask, Paralysis Inducement (Ryuki Riders have resistance to Evil whip), Limited\
    \ Resistance to Deconstruction/Possibly Existence Erasure (Ryuki Riders can stay\
    \ in Mirror World for 9 minutes 55 sec. The Mirror World is said to turn organisms\
    \ other than mirror monsters into particles in a short time after they invade,\
    \ and eventually erase their existence)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
