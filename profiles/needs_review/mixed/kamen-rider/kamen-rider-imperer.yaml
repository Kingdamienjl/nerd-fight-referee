- id: claim-standard-equipment-15624940
  section: equipment
  axis: equipment
  text: '*Gigazelle: Imperer''s Contract Monster. Because Zelle-type Mirror Monsters
    travel in packs, Imperer has a numbers advantage with Megazelles, Omegazelles,
    Magazelles, and Negazelles. *V-Buckle: A buckle that holds Imperer''s Advent Cards,
    the source of his power. *Gazelle Visor: Imperer''s Ride Visor, a knee brace that
    Imperer uses to activate his Vent Cards. *Gazelle Stab: A horned gauntlet conjured
    by the Spin Vent card.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
