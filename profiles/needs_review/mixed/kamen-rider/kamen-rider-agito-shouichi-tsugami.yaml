- id: claim-standard-equipment-a89a0997
  section: equipment
  axis: equipment
  text: "*Machine Tornador: Machine Tornador is a motorcycle that communicates with\
    \ Agito. In Bike Mode, it can drive at 430 km/h. It has automatic driving and\
    \ X-Ray Vision. When the Lord of Darkness gave some of his power to Machine Tornador,\
    \ he gained access to Slider Mode. In this mode, Machine Tornador is able to fly\
    \ at 720 km/h. In Slider Mode, Agito can perform \u201CDragon Breath\u201D, \u201C\
    Rider Break\u201D and \u201CHalberd Break\u201D. *Altering: Agito's transformation\
    \ belt. By pressing both the buttons (called Lumbar Switches) of the sides of\
    \ the belt, an energy called \"Alterforce\" is supplied to Shouichi granting him\
    \ the powers of Agito. If Agito presses the left button, he will assume Storm\
    \ Form and summon the Storm Halberd from the Philosopher Stone located at the\
    \ center of his belt. If he presses the right button, he will assume Flame Form\
    \ and summon Flame Saber. If he presses both buttons again, he can go into Trinity\
    \ Form, summoning both Storm Halberd and Flame Saber. If he equips the \"Dragon's\
    \ Nail\" piece to his belt, he can transform into Burning Form or Shining Form.\
    \ In some transformations, he is shown to be able to change forms even without\
    \ pressing the buttons. *Storm Halberd: Agito Storm Form's personal naginata.\
    \ This weapon can generate strong winds by swinging it around and after a few\
    \ spins, it can generate a storm. The stronger the winds, the more powerful Storm\
    \ Halberd and Agito Storm Form gets. If enough power is generated, \"Halberd Spin\"\
    \ can be performed. When used in conjunction with Flame Saber, \"Firestorm Attack\"\
    \ can be performed. *Flame Saber: Agito Flame Form's personal sword. This weapon's\
    \ power is increased in proportion to the temperature of the blade. The heat generated\
    \ from Agito Flame Form's Alterforce can be sent to the Flame Saber. When the\
    \ horns are unfolded, Flame Saber's power is fully released raising Flame Saber's\
    \ temperature to 7000 degrees Celsius and \"Saber Slash\" can be performed. When\
    \ used in conjunction with Storm Halberd, \"Firestorm Attack\" can be performed.\
    \ It is possible to summon two Flame Sabers for Agito Flame Form to use. By releasing\
    \ both the Flame Saber's power, \"Double Saber Slash\" can be performed. *Shining\
    \ Caliber: Agito Burning Form and Shining Form's personal weapon. Shining Caliber\
    \ is the strongest weapon in Agito's weapon that have two modes. In Burning Form,\
    \ Agito will use it's \"Single Mode\", a naginata type weapon. If this weapon\
    \ generates enough power, \"Burning Bomber\" can be performed. In Shining Form,\
    \ Agito will use it's \"Twin Mode\", a dual-wielding sword mode which has the\
    \ power of light and fire. If this weapon generates enough power, \"Shining Clash\"\
    \ can be performed."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
