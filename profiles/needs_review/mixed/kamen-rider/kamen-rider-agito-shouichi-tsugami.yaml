        \ Destroyed El of Water\u2019s soul who can revive through Lord of Darkness)\
        \ in Shining Form, Resistance to Corrosion Inducement (Sterio Dextera\u2019\
        s miasma is able to melt a target into foam. Agito was hit by Sterio Sinistra\u2019\
        s miasma who is comparable)"
