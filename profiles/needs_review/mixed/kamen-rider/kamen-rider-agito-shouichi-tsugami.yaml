- id: claim-powers-and-abilities-c6bb720a
  section: abilities
  axis: hax
  text: "Kamen Rider Physiology, Acrobatics (Has very good reflexes and is agile in\
    \ combat/ Storm Form excels this in speed and jumping prowess), Martial Arts (Shouichi\
    \ fought with the air of an ancient, mystic warrior with graceful movements and\
    \ elegant attacks and poses, showed he was worthy of being the power of Agito\
    \ and an extension of the Overlord of Light), Enhanced Senses (Agito's hearing\
    \ is dozens of times greater than humans. Can adjust hearing if there are loud\
    \ sounds in the way, 200 degree vertical and 225 degree horizontal field of vision,\
    \ able to distinguish a human face from 10 km away, X-Ray Vision, and has Night\
    \ Vision. Flame Form can accurately capture invisible enemies and enemies moving\
    \ at high speeds, he accurately landed a Saber Slash against Corvus Crocchio who\
    \ was flying at 340 km/h, can see and can hear a whisper 30km away), Extrasensory\
    \ Perception (Agito can detect whenever a Lord attacks. He saw that El of the\
    \ Water was possessing a girl when no one else could), Summoning (Machine Tornador\
    \ via communication), Flight (via riding Machine Tornador Slider Mode), Air Manipulation\
    \ and Damage Boost in Storm Form (He get stronger in response to the wind Storm\
    \ Halberd produce), Transmutation (Agito can transform a random motorcycle into\
    \ Machine Tornador), Fire Manipulation and Temperature Manipulation in Flame Form\
    \ (This form can produce 7000 degrees celsius flames to attack the enemy), Regeneration\
    \ Negation (High-Mid; Destroyed Moripes Octopus who can regenerate from small\
    \ pieces), Summoning (His other forms can summon their signature weapons with\
    \ his belt), and Explosion Manipulation (His attacks have a tendency of causing\
    \ explosions), Damage Reduction with Shock Silver, Resistance to Explosion Manipulation\
    \ (Got directly hit by Another Agito's Assault Kick, but did not explode), Paralysis\
    \ Inducement (Agito was unaffected from being struck by Auguis Maskurus\u2019\
    s Judgement Wand which paralyzes the nerves of an opponent), Petrification (He\
    \ was unaffected by Anguis Femineus\u2019s Evileye Whip which causes petrification),\
    \ Mind Manipulation and Sleep Manipulation (Unaffected by Pisquis Arapima\u2019\
    s hypnosis and Sleep Inducement. Controlled G3-X\u2019s Perfect A.I which ignores\
    \ the user\u2019s will and makes the user berserk), Temperature Manipulation (Equus\
    \ Noctis can evaporate the body fluids of people by touch which mummifies its\
    \ victims, but Agito was unaffected by it), Electricity Manipulation and Fire\
    \ Manipulation (Hydrozoa Ignio summons a lightning strike that is supposed to\
    \ ignite a person but it only startled Agito instead), Absorption (Agito was unaffected\
    \ by Equinus Famelicare\u2019s shurikens which absorbs the target\u2019s life\
    \ energy), Deconstruction (The El of the Ground\u2019s sand can turn people into\
    \ ash. Agito was hurt by it, but didn\u2019t turn to ash), Limited Resistance\
    \ to Transmutation (Agito in his human form was hit by a needle from Ericius Riqueur.\
    \ This needle immediately turns humans into water but Agito resisted it long enough\
    \ for Kino to give him an emergency surgery to pull the needle out) All previous\
    \ abilities enhanced plus Rage Power (Burning Form power increases as Agito becomes\
    \ more enraged), Empowerment (Burning Form can absorb the light of the sun and\
    \ transform into Shining Form), Light Manipulation (Shining Caliber has the power\
    \ of light and can make Shining Field), Soul Destruction and Immortality Negation\
    \ (Type 4; Destroyed El of Water\u2019s soul who can revive through Lord of Darkness\
    \ Kamen Rider Agito Great Encyclopedia 2) in Shining Form, Resistance to Corrosion\
    \ Inducement (Sterio Dextera\u2019s miasma is able to melt a target into foam.\
    \ Agito was hit by Sterio Sinistra\u2019s miasma who is comparable)"
  source_ids: *id003
