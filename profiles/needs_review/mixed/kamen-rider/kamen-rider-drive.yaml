  name: resistant to damage with its mutiple layers of armor, taking no damage from
    enemies stronger than Drive and remains unsc
  description: 'resistant to damage with its mutiple layers of armor, taking no damage
    from enemies stronger than Drive and remains unscratched. Its durability is higher
    than Drive himself. It resists heat and pressure. It can also operate underwater.
    Its main method of attack is either ramming the enemy or shooting at them with
    its energy blasts from its front cannons. Tridoron can transform into two different
    modes. Its Wild Mode can pass rough terrain and its Technic Mode has hands for
    various purposes. *Mach Driver Honoh (Optional): Temporary belt-based transformation
    device. Used when he does not have Drive Driver. *Shift Cars: Shift Cars are sentient
    small cars that gives access to Drive''s forms and powers, depending on which
    car is used. They also allow Shinnosuke/Drive to move normally during a Slowdown.
    They also assists Drive in battles by attacking enemies or defending Drive. The
    Shift Cars can take on people on Drive''s level. *Shift Car Holder: Carrier strap
    for the Shift Cars. *Handle Sword: Drive''s high vibration energy sword that lets
    it cuts things with ease. It is stored in the Tridoron and can be summoned by
    Drive by calling for it. When a shift car is inserted into it, it can activate
    a finisher infused with the shift car''s powers along with the stored energy inside
    kept in the sword. When Drive turns the handle, the sword''s built up kinetic
    energy is released, making it turn abruptly. The sudden movements often catches
    Drive''s enemies off guard. This is also the reason why this sword is extremely
    hard to master. *Door Gun: Drive''s gun that is also used as a shield. In addition
    to precise shooting, the door gun''s bullets can cancel out the enemy''s projectiles.
    Furthermore, it can alter the properties and reflect energy based attacks. Much
    like the Handle Sword, it is stored in the Tridoron and can be summoned by Drive
    by calling for it. When a shift car is inserted into it, it can activate a finisher
    infused with the shift car''s powers along with the stored energy inside kept
    in the gun. It has a lock system that prevents it from being used by other people
    besides Drive. The coating on the Door Gun is called SO-1, which reduces damage
    on all physical attacks. *Trailer Cannon: A cannon that is used primarily by Drive
    Type Formula. It can also be summoned and used by any of Drive''s other forms
    if he wishes. It is a sentient trailer that assists Drive by shooting out light
    that is capable of melting armor. Its body has multi-layer armor that is extremely
    resistant to attacks and can be used as a shield. As a cannon, it can shoot out
    high energy bullets or beams. If you load the Trailer Cannon with Shift Cars (Up
    to 3. Two in the Container Barrel, one in the Shift Landing Slot), you can amplify
    its power if the cars go into the Container Barrel and infused the power of the
    Shift Car if the car goes into the Shift Landing Slot. When Drive is shooting
    with the Trailer Cannon, the Framing Gear Grip works with Drive''s sensors to
    predict enemy movement. *Tire Specific Items **Justice Cage: Drive''s jail cell-based
    item via the Justice Hunter Tire and one of Type Tridoron People Saver''s items.
    It is a shield that can nullify attacks. If it is thrown, it can be transformed
    into a large cage that traps enemies. The bars of the cage also nullifies attacks.
    **Drum Shields: Drive''s slot machine wheel-based items via the Dream Vegas Tire
    and Type Tridoron American Dream''s weapon. The shields repel ranged attacks and
    absorb energy attacks. **Monster/Rush Fang: Drive''s car boot-based items via
    the Massive Monster Tire and one of Type Tridoron Tough Guy''s weapons. Monster
    can be clamped onto the enemy to deal massive damage to armored enemies. Drive
    can also make large energy versions of Monster. **Rumble Smasher: Drive''s drill-based
    item via the Rumble Dump Tire and one of Type Tridoron Koujigenbar''s items. It
    is a drill that can easily drill through rocks and defensive enemies. It is not
    recommended for Drive to use this Shift Car in Type Speed as Drive cannot control
    its power in this form. However, it can be perfectly used in stronger forms such
    as Type Wild, Type Deadheat, and Type Tridoron. **Cure Quicker: Drive''s first
    aid kit-based item via the Mad Doctor Tire and one of Type Tridoron People Saver''s
    items. Mad Doctor can heal wounds and cure poisons albeit with a painful procedure.
    Drive at times'
