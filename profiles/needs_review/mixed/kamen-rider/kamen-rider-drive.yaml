      corrupt Nira who had framed Shinnosuke into a criminal in which both the public
      and the police force believed. Shinnosuke with everyone besides his friends
      against him, was able to make his way into a heavily guarded Police Station,
      faked his death with dimension cab, and exposed Nira to the public. Krim is
      an inventor that invented sentient robots called Roidmudes. He created the Drive
