- id: claim-powers-and-abilities-8bfa86b8
  section: abilities
  axis: hax
  text: "Transformation, Expert Marksman (Daisuke is able to throw things with impeccable\
    \ accuracy, as shown when he once throws his cosmetic brushes and it lands between\
    \ the glasses and eyes of a robber when he is driving. As Kamen Rider Drake, He\
    \ often combines gunplay with gentle movements to attack and defeat his enemies),\
    \ Martial Arts, Acrobatics All previous abilities, Superhuman Physical Characteristics,\
    \ Energy Projection, Enhanced Senses with O Signal and Compound Eye, Explosion\
    \ Manipulation (His attacks have a tendency of causing explosions), Statistics\
    \ Amplification with Clock Up (It boosts his speed greatly), Underwater Breathing\
    \ (Type 2), Enhanced Senses (FTL Vision), Damage Reduction and Resistance to Temperature\
    \ Manipulation (All Kabuto Rider\u2019s armor is impact resistant and can absorb\
    \ the impact of a large explosion), Durability Negation via Deconstruction (Finishers\
    \ can cause atomic collapse), Cosmic Awareness (A Rider\u2019s O Signal can sense\
    \ disturbances in the time-axis), Vibration Manipulation (All Kabuto Riders are\
    \ equipped with the Rider Palm which emit high frequencies and can hit enemies\
    \ moving freely in space-time), Light Manipulation (Can shoot light bullets) Limited\
    \ Teleportation via Spatial Manipulation (All Zectors can move in similar manner\
    \ to teleportation by cuts through the space), Self-Sustenance (Type 1) and Resistance\
    \ to Cosmic Radiation (Scales to Kabuto and Caucasus, who are able to survive\
    \ in space), Extreme Temperatures and Absolute Zero (Their suit can withstand\
    \ temperatures of 5000 C and Absolute Zero), Deconstruction (Riders can survive\
    \ each others finishers, which causes atomic collapse)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
