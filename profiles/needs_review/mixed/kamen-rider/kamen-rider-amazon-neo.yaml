  intelligence:
    text: Despite being 1 year old, Chihiro knows perfect Japanese, how to fight in
      both hand-to-hand combat and swordplay, as well as firearms. Also has an accelerated
      growth, having the appearance of a teenager while only being 1 year old), Enhanced
      Senses (Weaker Amazons, like Mamoru, was able to single out a Class B Amazon
      in an apartment complex full of Class E Amazons Kamen Rider Amazons, Season
      1, Episode 3. In Season 2, Jin was confident in his ability to fight against
      the Jellyfish Amazon, who was invisible, with his smell and hearing alone. His
      Amazon Eyes an catch objects kilometers away even if it's moving at high speeds.
      Should scale to Haruka who could see the invisible Jellyfish AmazonKamen Rider
      Amazons, Season 2, Episode 10), Stealth Mastery (Was able to escape from Jin
      multiple times), Berserk Mode (When under mental stress, Chihiro can enter his
      Origin form which is much stronger than his baseKamen Rider Amazons, Season
      2, Episode 9), Absorption (Can convert heat and wind to stockpile energy with
      his Converted Lungs), Natural Weaponry, Disease Manipulation and Biological
      Manipulation (By consuming or absorbing even a small amount of Chihiro's cells
      would result in turning into an Amazon. It is highly contagious as a dislocated
      arm was able to infect a river causing mass infection), Statistics Amplification
      (Can increase his strength after consuming enough protein), Limited Reactive
      Evolution (His Wilder Skin can harden itself to the situation to prevent damage
      from enemies), Vibration Manipulation (His Neo Amazon Sword should be comparable
      to Haruka's, which can vibrate 100,000 times per secondKamen Rider Zukan), Regeneration
      (Low-Mid; Tachibana stated that Chihiro's regeneration was better than that
      of most Amazons and even suggests that he could regrow lost limbsKamen Rider
      Amazons, Season 2, Episode 4. Quickly regenerated from brain damageKamen Rider
      Amazons, Season 2, Episode 11, higher with greater amounts of protein), Immortality
      (Type 3; Has regeneration that is superior to that of Haruka's. Iyu had damaged
      Chihiro to the point where she believed he was dead, yet Chihiro quickly recoveredKamen
      Rider Amazons, Season 2, Episode 3), Summoning (Can call the Jungleder with
      amplified brain waves), Body Control (Can protrude spikes from his bodyKamen
      Rider Amazons, Season 2, Episode 12), Durability Negation (Possesses arm cutters
      similar to Alpha, whose arm cutter can directly target internal organs), Damage
      Reduction (Biologically superior to Alpha, who's Amazon Cells could protect
      his core and cancel out damage), Resistance to Fire Manipulation (Biologically
      superior to Alpha, who survived the HP Bomb's intense flamesKamen Rider Amazons,
      Season 2, Episode 13)
    source_ids: *id002
    confidence: 0.8
