        \ Cerberus (Yellow): A Rouse card that belongs to Kamen Rider Glaive, with\
        \ the artificial Undead Cerberus sealed. By loading the Glaive Buckle, Shiruma\
        \ is able to transform into Kamen Rider Glaive., Mighty Gravity: A Rouze Card\
        \ of the artificial Undead Cerberus. Mighty Gravity\u2019s ability is to increase\
        \ the sharpness of the Glaive Rouzer, enhancing its overall power., Albino\
        \ Joker: A Rouse card with an albino joker sealed on it. It isn't appearing\
        \ in the play., Glaive Rouzer: The personal weapon of Kamen Rider Glaive.\
