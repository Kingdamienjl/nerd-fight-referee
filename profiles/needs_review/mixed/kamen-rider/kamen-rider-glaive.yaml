- id: claim-powers-and-abilities-218f496b
  section: abilities
  axis: hax
  text: "Peak Human Physical Characteristics to Superhuman Physical Characteristics,\
    \ Enhanced Senses (Undeads are attracted to each other by instinct), Regeneration\
    \ (Mid-Low; Survive from any physical injuries, no matter how grave they may be),\
    \ Immortality (Type 1, 2 and 8; Undeads bodies cannot aged or damaged in normal\
