    \ truly killed to be preserved for the next battle), Self-Sustenance (Type 2 &\
    \ 3), Martial Arts, Weapon Mastery, Energy Manipulation and Energy Projection\
    \ (Blood Face: it emits a heat wave that emits red light and blows away surrounding\
    \ objects), Undead Manipulation (Albino Antenna: gives instructions to his subordinate,\
    \ Albi Roach, and manipulates it freely), Shapeshifting and Power Mimicry, Hacking,\
    \ Sealing (Can seal others Undead), Surface Scaling (He could move freely, sticking\
    \ to ceilings and walls), Extrasensory Perception, Resistance to Explosion Manipulation\
    \ (Comparable to other Undeads who couldn\u2019t explode even after a finisher)\
    \ All previous abilities, Superhuman Physical Characteristics, Transformation,\
    \ Acrobatics, Information Analysis (Owl Shield: An inner antenna can obtain information\
    \ necessary for the operation of the lidar at any time), Enhanced Senses (His\
    \ Organscope has a 500x zooming, macro function, X-ray fluoroscopy, and high-sensitivity\
    \ night vision (starlight scope). The Organ Sonar can distinguish the sound of\
    \ falling needles and ultrasonic waves from 5km away), Underwater Breathing (Type\
    \ 3; His Cure Regulator has an oxygene maker and can generate and stock 10 hours\
    \ of oxygen in water or vacuum conditions), Light Manipulation (Tartaros Frame:\
    \ A 2cm thick armor made of highly compressed Orihalcon platinum. It is sensitive\
    \ to the computer crisis built into the head and emits light), Damage Boost through\
    \ Gravity Absorption (Various of equipments on his armor has ability to absorb\
    \ gravitational energy and enhance his punching, kicking power like Golden Bangle,\
    \ Gravity Regret, Hammer Shell), Vibration Manipulation and Heat Radiation Manipulation\
    \ via Glaive Rouzer (By adding high-frequency vibration and high heat radiation\
    \ to the tip, the blade exhibits even greater sharpness), possibly Durability\
    \ Negation (by polishing the mysterious metal Orichalcum Platinum to the limit,\
    \ Glaive Rouser can cut through all solid matter on earth), Sealing with Common\
    \ Blank cards, he can active various abilities of Undeads in a single card (Mighty\
    \ card) including Statistics Amplification via various Amplification card , Electricity\
    \ Manipulation via Thunder Deer (Supplements the next attack with electricity),\
    \ Magnetism Manipulation (With Magnet Buffalo as it allows him to temporarily\
    \ have control over magnetism), Time Stop (Via Time Scarab as it can freezes time\
    \ in place in a certain radius), Explosion Manipulation, Flight (Via Float Dragonfly),\
    \ Air Manipulation (Via Tornado Hawk that supplements the next attack with wind),\
    \ Vine Manipulation (Via Bio Plant that creates vines for lashing and binding),\
    \ Healing via Recover Camel (Can reuse Rouze Cards via Shuffle Centipede), Ice\
    \ Manipulation via Blizzard Polar, Transmutation and Elemental Intangibility via\
    \ Gel Jellyfish (Transmutes body into organic fluid to reduce damage), Attack\
    \ Reflection via Rock Tortoise (Transmutes body into organic stone to reduce damage\
    \ and is comparable to Blade's Metal Trilobite), Poison Manipulation via Poison\
    \ Scorpion, Smoke Manipulation via Smog Squid. Resistance to Fragrance Manipulation\
    \ (Cure Regulator is a device that filters all toxins), Electricity Manipulation\
    \ (Scales to Blade, although to a lesser degree) All previous abilities, Fusionism,\
    \ Large Size (Type 1; His height is 50m), Fire Manipulation, Thunder and Weather\
    \ Manipulation"
