    - field: intelligence
      value: Genius (The Albino Joker deceived Tachibana and the other riders by hiding
        from them to avoid being sealed like other undead. He then disguised himself
        as Junichi Shimura, a good-natured and skilled young guy with a strong sense
        of justice, in order to earn their trust. This qualified him as Kamen Rider
        Glaive and made him the leader of the new-generation Riders, being claimed
        to be their next saviour. All of these schemes were proven to be successful,
        with him easily outwitting the others and making them have distrust over each
        other, which end up assisting him into attain the power of Jashin 14 and take
        over the world. His final plot would have been almost been fully succeeded
        if Hajime's sacrifice hadn't weakened him and allowed Blade to defeat him.
        Besides that, He also showed to be very efficient at using technology or simply
        his own powers/weapons, being very efficient and calculative in that regard,
        with him even surprising blade and his allies when they realize how strong
        Glaive became in such a short period of time.)
