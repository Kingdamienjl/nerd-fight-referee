- id: claim-standard-equipment-805dbd07
  section: equipment
  axis: equipment
  text: "*Glaive Buckle: Shimura\u2019s henshin device which allows him to transform\
    \ into Kamen Rider Glaive. *Rouse Cards: Various Cards which hold the power of\
    \ previously defeated Undeads. By sliding it across the blade of the Glaive Rouzer,\
    \ Shimura is able to use the powers of each respective card. **Change Cerberus\
    \ (Yellow): A Rouse card that belongs to Kamen Rider Glaive, with the artificial\
    \ Undead Cerberus sealed. By loading the Glaive Buckle, Shiruma is able to transform\
    \ into Kamen Rider Glaive. **Mighty Gravity: A Rouze Card of the artificial Undead\
    \ Cerberus. Mighty Gravity\u2019s ability is to increase the sharpness of the\
    \ Glaive Rouzer, enhancing its overall power. **Albino Joker: A Rouse card with\
    \ an albino joker sealed on it. It isn't appearing in the play. *Glaive Rouzer:\
    \ The personal weapon of Kamen Rider Glaive. The front of the blade acts as a\
    \ tray which holds cards which contain the power of Undeads, monsters that Glaive\
    \ has defeated previously. *Death Scythe: The personal weapon of Shimura as Albino\
    \ Joker"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
