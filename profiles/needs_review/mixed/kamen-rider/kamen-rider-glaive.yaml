      value: "Glaive Buckle: Shimura\u2019s henshin device which allows him to transform\
        \ into Kamen Rider Glaive., Rouse Cards: Various Cards which hold the power\
        \ of previously defeated Undeads. By sliding it across the blade of the Glaive\
