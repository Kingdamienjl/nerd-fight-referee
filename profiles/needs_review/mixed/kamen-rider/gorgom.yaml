  attack_potency:
    text: "Large Island level to Large Island level+ (Mutants such as the Earwig Mutant\
      \ are powerful enough to empower the Ultra Quartz earthquake device, that is\
      \ capable of sinking Tokyo.Kamen Rider Black Episode 16 Friend!! Crossing the\
      \ Sea Gorgom Mutants varies from individual to individual, being able to harm\
      \ Kamen Rider Black, and sometimes even overpower and defeat him) | Solar System\
      \ level, possibly higher (The power of a Creation King is enough to destroy\
      \ multiple planets and stars at once, and also has the power to control the\
      \ universe) Power Source: Varies. Gorgom utilizes mainly biological and ancestral\
      \ magic and energy to create the Mutants, with the organization often stealing\
      \ or using resources from humankind to create advanced structures. Industrial\
      \ Capacity: Gorgom can produce not only Mutants, but through human technology,\
      \ they're able to create devices that warps time and space itself, links to\
      \ the cyberspace, weather changing devices, or machines that can extract life\
      \ force itself. Military Prowess: *Mutants Gorgom's Mutants (\u602A\u4EBA, Kaijin)\
      \ are genetically altered half-beast humans possessing long life that lasts\
      \ 50,000 years. For Gorgom's human members, being transformed into a Mutant\
      \ is the ultimate reward for their loyalty. Each Mutant is based on an animal\
      \ or plant lifeform. center|400px Notable Individuals: CreationKingG.jpeg|Creation\
      \ King DaromG.jpeg|thumb|High Priest Darom BaraomG.jpeg|High Priest Baraom BishumG.jpeg|High\
      \ Priestess Bishum BilgeniaG.jpeg|Bilgenia ShadowMoonG.jpeg|Shadow Moon *Creation\
      \ King The Creation King (\u5275\u4E16\u738B, S\u014Dsei\u014D), additionally\
      \ named the King of All Creation, is the leader of Gorgom, and was unseen for\
      \ much of the series. It is one of the most powerful being that had been living\
      \ for the past 50,000 years, and with power capable of destroying Earth itself.\
      \ In its weakened state, the Creation King was a giant floating heart. It communicated\
      \ with the Priests and the two Century Kings via telepathy. He was killed by\
      \ Black Sun after being stabbed by his own Satansaber. *High Priest Darom High\
      \ Priest Darom (\u5927\u795E\u5B98\u30C0\u30ED\u30E0, Daishinkan Daromu) is\
      \ the leader of the High Priests, answering only to the Creation King and his\
      \ successors. He has a pale, white face. Like his fellow High Priests, Darom\
      \ possesses several powerful psychic abilities, being able to shoot beams from\
      \ his fingers to attack his foes, control subjects, and convert chosen humans\
      \ into members of Gorgom. *High Priest Baraom High Priest Baraom (\u5927\u795E\
      \u5B98\u30D0\u30E9\u30AA\u30E0, Daishinkan Baraomu) is one of the High Priest\
      \ having a stone-like green face. He can discharge deadly laser beams from his\
      \ robotic hands. He is usually in charge of the deployment of Gorgom's Mutants.\
      \ *High Priest Bishum High Priestess Bishum (\u5927\u795E\u5B98\u30D3\u30B7\u30E5\
      \u30E0, Daishinkan Bishumu) is the lone female High Priest. She can discharge\
      \ laser beams from her eyes. After losing her powers from the \"Stone of Earth\"\
      \ within her to revive Shadow Moon, Bishum is reborn as Grand Mutant Bishum\
      \ (\u5927\u602A\u4EBA\u30D3\u30B7\u30E5\u30E0, Daikaijin Bishumu), a white-haired\
      \ purple pterosaur-like form. In this form, she still has her usual powers and\
      \ she can spin around to create twisters. *Bilgenia Sword Saint Bilgenia (\u5263\
      \u8056\u30D3\u30EB\u30B2\u30CB\u30A2, Kensei Birugenia), Gorgom's warrior, made\
      \ his first appearance in episode 18. He was born 30,000 years ago on a day\
      \ of a solar eclipse, just like Kohtaro & Nobuhiko. However, a Kingstone was\
      \ never given to him because the Creation King didn't favor him and therefore\
      \ he could not become the next Creation King. This made him angrily trying to\
      \ revolt against him and resulted with the Creation King sealing him in a coffin.\
      \ The Creation King ordered the three High Priests to release Bilgenia after\
      \ they kept failing to retrieve the Kingstone from Kohtaro. He was both a pain\
      \ for Kamen Rider Black as well as to Gorgom, until he was killed by Shadow\
      \ Moon after his awakening. *Shadow Moon Formerly known as Nobuhiko Akizuki,\
      \ he was abducted and brainwashed by Gorgom, while his brother, Kotaro Minami\
      \ escaped. He is awakened by the organization after the High Priests sacrifices\
      \ their Stones to give life energy enough to Shadow Moon. After he kills Bilgenia,\
      \ he becomes the new ruler of Gorgom, and orchestrated the majority of plans\
      \ against Kamen Rider Black. He eventually manages to kill Black Sun in combat,\
      \ but initially refuses to take his Kingstone, something he would regret later\
      \ as Whale Mutant resurrects Kamen Rider. He is finally defeat and killed by\
      \ Black Sun in a final combat, with Shadow Moon mentioning that he would return\
      \ to defeat him."
