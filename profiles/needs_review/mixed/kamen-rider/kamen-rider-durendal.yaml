- id: claim-powers-and-abilities-4f0aea5b
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Transformation, Acrobatics, Martial\
    \ Arts, Weapon Mastery, Portal Creation (With Book Gate, Rintaro can make a portal\
    \ to the Sword of Logos Northern Base, anywhere on Earth, and Wonder World.),\
    \ Explosion Manipulation, Energy Manipulation, Holy Manipulation (All of the Seiken\
    \ are Holy weapons that is strong against evil), Enhanced Senses (Durendal has\
    \ a radar that has similar sensory organs as marine life. He also has night vision\
    \ due to being able to see in deep waters.), Non-Physical Interaction (with Seiken),\
    \ Regeneration and Creation (Low-Mid), Supernatural Willpower, Underwater Breathing\
    \ (Type 3. Durendal's breathing apparatus lets him dive in water for a long time.),\
    \ Time Manipulation and Causality Manipulation (Durendal\u2019s Ocean History\
    \ allows him to move through time in a space separate from the passage of time,\
    \ called \"Erased Time\", and erase it when he comes out. As a result, this ability\
    \ is able to erase the time of everyone in range of the ability. He is unable\
    \ to interact with any substances in \"Erased Time\".), Reactive Power Level (Kaiji\u2019\
    s sharpness increases as time passes.), Animal Manipulation (Durendal has the\
    \ abilities and memories of those that have been carved into the oceans over time.),\
    \ Weather Manipulation (Durendal can freely manipulate the moisture in the atmosphere),\
    \ Free Movement (Durendal is able to move in all sorts of terrain easily, including\
    \ rough terrain and high-loaded areas.), Resistance to Spatial Manipulation, Electricity\
    \ Manipulation, Air Manipulation, Darkness Manipulation, Energy Manipulation,\
    \ Sound Manipulation, Light Manipulation, Deconstruction, Fire Manipulation, Absolute\
