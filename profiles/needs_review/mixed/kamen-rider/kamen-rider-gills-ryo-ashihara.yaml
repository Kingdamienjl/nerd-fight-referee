- id: claim-standard-equipment-74381012
  section: equipment
  axis: equipment
  text: "*Meta Factor: Transformation belt for Gills *Gills Raider: Gills Raider is\
    \ a living dirt bike that has a free will and can communicate with Gills. It can\
    \ move at 360km/h. The bike has a self-healing function to restore itself from\
    \ almost complete destruction. As long as it has one of two Genome Stones remaining,\
    \ it can regenerate. It can create an invisible energy field. Its Demon Claw can\
    \ vibrate 2.5 million times per second. Anything within 3 meters of Demon\u2019\
    s Claw can be cut by it even if it doesn\u2019t touch. It can stick to and run\
    \ on 80 degree steep slopes."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-4d81d705
  section: power_scale
  axis: battle_iq
  text: Gifted (Eventually Managed to master his skills and complicated abilities
    after his metamorphosis, going from an unstable Agito to a cunning one in battles.
    Has fought alongside and against Agito and G3 and has beaten them a handful of
    times. Gills provides a wild but versatile combat style that allows him to come
    off as unpredictable even for other Riders, despite them having the chance to
    analyze Ryo's stand, they still can't predict his movement, Aside from this, Ryo
    is a professional and gifted Swimmer, with him having his abilities for the sport
    being praised by his teachers and other classmates, he also has been shown working
    as a rather Experienced and Effective mechanic.)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-122b36e7
  section: weaknesses
  axis: weakness
  text: Ryo's body will began to undergo accelerated cellular decay after the transformation.
    Though, after dying a second time and being resurrected by Mana Kazaya, Ryo discovered
    that his body chemistry was also altered and is now able to accommodate the transformation.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-b22f9bbc
  section: abilities
  axis: hax
  text: "Transformation, Martial Arts, Vehicular Mastery | All previous abilities,\
    \ Superhuman Physical Characteristics, Acrobatics, Berserk Mode, Enhanced Senses\
    \ (Gills can see a sign 20 km away, has X-Ray Vision, and Night Vision. This is\
    \ enhanced further as Exceed Gills), Extrasensory Perception (Gills can detect\
    \ whenever a Lord is going to attack), Natural Weaponry (He is armed with blades\
    \ on his wrists and heels. He is also able to extend tentacles from his wrists\
    \ and open his faceplate, revealing the Demon Fang Crusher jaws), Explosion Manipulation\
    \ (His attacks have a tendency of causing explosions), Regeneration (Low-Mid),\
    \ Information Analysis (Gills can instantly spot an enemy\u2019s weakness via\
    \ the Wiseman Orve), Light Manipulation (Gill\u2019s Wiseman Orve can emit a light\
    \ that blinds enemies), Mind Manipulation (Gill\u2019s Wiseman Orve can emit hypnotic\
    \ waves to hypnotize people), Energy Absorption (Gill\u2019s Live Arms can absorb\
    \ energy), Sound Manipulation (Gills can emit ultrasonic waves using Demon\u2019\
    s Fang Crusher), Transmutation (Gills can transform a dirt bike into Gills Raider),\
    \ Summoning (Gills can summon Gills Raider), Body Control as Exceed Gills (He\
    \ can extend clawed tentacles from behind his shoulders to restraining his enemy),\
    \ Resistance to Explosion Manipulation (Was hit by G3-X's GX-05 Cerberus's rocket\
    \ and did not explode, though it should be noted that G3-X was still stronger),\
    \ Paralysis Inducement (Gills was struck by Auguis Maskurus\u2019s Judgement Wand\
    \ which paralyzes the nerves of an opponent but was not affected), Absorption\
    \ (Gills was unaffected by Equinus Famelicare\u2019s shurikens which absorbs the\
    \ target\u2019s life energy), Deconstruction (The El of the Ground\u2019s sand\
    \ can turn people into ash. Gills was hurt by it, but didn\u2019t turn to ash)\
    \ The Gills Raider possesses the following"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
