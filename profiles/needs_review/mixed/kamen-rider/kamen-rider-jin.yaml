- id: claim-powers-and-abilities-40367f76
  section: abilities
  axis: hax
  text: "Humagear Physiology (Type 2), Hand to Hand Combat and Gun Mastery (In the\
    \ Alternate Timeline, he was able to go toe to toe with Black Woz), Analytic Prediction,\
    \ Resistance to Poison Manipulation, Deconstruction, Status Effect Inducement\
    \ (Scaling from other Riders who can tank Horobi\u2019s Acid Analyzer which is\
    \ a poison that can destroy the enemy at the molecular level or block the movement\
    \ of organisms. Tanked attacks from Zero-One Metal Cluster Hopper which can destroys\
    \ object on molecular level), Madness Manipulation (Type 2 and 3), Aura and Fear\
    \ Manipulation (Unaffected by Ark\u2019s presence which is able to knock out the\
    \ entire A.I.M.S. Unit (14:00) and managed to instilled fear into Kamen Rider\
    \ Valkyrie (7:10) who have enough willpower to fight off the A.I. chip in her\
    \ brain that induce pain and make her subservient to Gai), Pain Manipulation,\
    \ Electricity Manipulation (Completely unaffected by ForceRiser's electric shock),\
    \ Limited Resistance to Possession (Temporarily resisted Ark\u2019s attempt to\
    \ control him) Superhuman Physical Characteristics, Hand to Hand Combat, Weapon\
    \ Mastery, Transformation with MetsubouJinrai ForceRiser and Progrise Keys, Hacking\
    \ (Via Zetsumeriser. By inserting a Progrise Key, it hacks the user to transform\
    \ into a Magia unwillingly, also able to hack Zero-One's Driver by touching it),\
    \ Energy Manipulation (Many of his attacks are energy-based attacks), Statistics\
    \ Amplification (Each Progrise Key can increase it's user's capabilities), Enhanced\
    \ Senses with Falcon Scope (Has excellent telephoto and target tracking capabilities,\
    \ without missing a locked-on target, also he able is to deliver a homing kick\
    \ that strikes the target from a high altitude), Information Analysis (The helmet\
    \ can analyze flying objects, weather, and the ground), Summoning when using Progrise\
    \ Key (Summon an energy construct for transformation), Resistance to Radio Wave\
    \ (Jin's suit can reduce the reflection of radio waves and the emission of infrared\
    \ rays), Flight with Scrambler (The wings on his back that allow him to fly) All\
    \ abilities of Flying Falcon key enhanced, plus Fire Manipulation and Resistance\
    \ to Heat Manipulation, Transformation with Zaia Slashriser and Progrise Keys"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
