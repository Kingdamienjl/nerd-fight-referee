- id: claim-powers-and-abilities-8d03d054
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts, Weapon Mastery, Preparation,
    Explosion Manipulation, Transformation, Energy Manipulation, Acrobatics (Despite
    his heavy armor, Buster is still able to perform athletic movements), Portal Creation
    (With Book Gate, Ogami can make a portal to the Sword of Logos Northern Base,
    anywhere on Earth, and Wonder World.), Earth Manipulation, Accelerated Development
    (Ogami could only wield Gekido briefly when he was 17, but when he saw Haruka
    get hurt, he was able to fully wield it.Separate Volume Kamen Rider Saber Manga:
    Kamen Rider Buster: Chapter 3 By scanning Wonder Ride Books with the Singan Reader,
    Gekido and Buster can speed read the entire story and lore of it thus acquiring
    its powers and wisdom. Gekido has the characteristic to increase its sharpness
    when it hits harder targets; the harder the target, the sharper it becomes.),
    Air Manipulation (Buster''s Gekidou is strong enough to create nigh-invisible
    slashes of air, every time it is swung), Non-Physical Interaction with Seiken,
    Low-Mid Regeneration, Holy Manipulation (All of the Seiken are Holy weapons that
    is strong against evil), Statistics Amplification (Buster can increase his durability
    by adjusting his Gorikikko Generator on his joints. By using a Wonder Ridebook
    and accessing a Wonder Combo, Buster can increase all his stats), Power Nullification
    (Buster''s Warring God Shell protects Buster''s whole body from all sorts of attacks.
    Buster''s Gekido also is designed to disperse external force.), Size Manipulation
    (Buster can manipulate the size of Gekido.), Plant Manipulation, Danmaku, Resistance
    to Spatial Manipulation, Electricity Manipulation, Air Manipulation, Darkness
    Manipulation, Energy Manipulation, Sound Manipulation, Light Manipulation, Deconstruction,
    Fire Manipulation, Absolute Zero, Vibration Manipulation, Corrosion Inducement,
    Ice Manipulation, Matter Manipulation, Gravity Manipulation, Explosion Manipulation'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
