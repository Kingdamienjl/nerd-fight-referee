- id: claim-standard-equipment-29341314
  section: equipment
  axis: equipment
  text: "Dogouken Gekidou: Gekido is Buster's personal sword. It is forged by holy\
    \ sand over several years. If he activates one of his finishers, he is able to\
    \ one shot monsters comparable to himself. Even if Buster was not attacking for\
    \ real and someone blocked the attack, the force of it is able to knock someone\
    \ out for several days. Genbu Shinwa: Ogami's Primary Wonder Ridebook containing\
    \ the power of the God-Beast, \u201CGenbu Shinwa\u201D. Ogami uses this to transform\
    \ into Kamen Rider Buster, Genbu Shinwa. If Buster inserts this into a slot on\
    \ Gekidou, he can activate his special attacks (For example: Grand Judgement Cut).\
    \ Jackun to Domamenoki: Ogami's Wonder Ridebook containing the power of the Story\
    \ \u201DJackun to Demamenoki\u201D. Ogami uses this along with Genbu Shinwa to\
    \ transform into Kamen Rider Buster, Genbu Jackun."
  source_ids: *id003
  decisive: false
  status: unverified
