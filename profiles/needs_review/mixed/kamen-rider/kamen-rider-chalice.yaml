      \ he also has wide knowledge about the Battle Fight and Stone of Sealing. In\
      \ the beginning, Hajime takes on the form of Mantis Undead, who is in turn Kamen\
      \ Rider Chalice. Chalice is described as a \u201Cwar machine\u201D even among\
      \ other Undeads which granted him the nickname, \"Chalice the Legendary\". Once\
      \ Hajime realized his true nature as Joker Undead, his instincts reemerged.\
      \ This made him fight to his best potential, which surpasses Chalice and every\
      \ other Undead, making him the most skilled Undead in the series. In Wild Form\
      \ or Joker Undead, He is capable of matching Blade in his King Form)"
