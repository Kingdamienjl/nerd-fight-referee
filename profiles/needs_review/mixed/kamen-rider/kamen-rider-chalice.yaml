- id: claim-powers-and-abilities-0e275434
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Enhanced Senses (Undeads are attracted\
    \ to each other by instinct), Regeneration (Mid-Low; Heals physical injuries,\
    \ no matter how grave they may be), Immortality (Types 1, 2, and 8; Undeads bodies\
    \ cannot age or damaged in normal means, their immortality is granted by the Stone\
    \ of Sealing as they can't be truly killed to be preserved for the next battle),\
    \ Self-Sustenance (Types 2 & 3), Martial Arts, Weapon Mastery, Energy Manipulation,\
    \ Shapeshifting and Power Mimicry (Chalice Rouzer can transform the user into\
    \ other Undeads), Hacking (Somehow, he can break the security system of CR when\
    \ touching the control panel and open the door), Sealing (Can seal others Undead),\
    \ Limited Law Manipulation (A Joker Undead can destroy the world or a pocket dimension\
    \ when it is the only Undead remaining in that worldspace. In the original series,\
    \ Hajime made Darkroaches spawn and eventually swarm almost all of Japan due to\
    \ being the final Undead left in the Battle Fight, In Kamen Rider Zi-O, Joker\
    \ Undeads spawn instead due to Another Blade taking both Joker Undead powers from\
    \ Kenzaki and Hajime, Comparable to Kenzaki, who in Kamen Sentai Gorider, effortlessly\
    \ destroys Kamen Rider Genm's Game World, with playing cards as a visualisation\
    \ to its destruction.), Extrasensory Perception (Could sense that Kenzaki had\
    \ entered his King Form), Resistance to Explosion Manipulation (Comparable to\
    \ other Undeads who couldn\u2019t explode even after a finisher) All previous\
    \ abilities, Acrobatics, Flight (Via Float Dragonfly), Air Manipulation (Via Tornado\
    \ Hawk that supplements the next attack with wind), Vine Manipulation (Via Bio\
    \ Plant that creates vines for lashing and binding), Sealing with Common Blank\
    \ cards, Statistics Amplification (Via Chop Head \u2013 Increases the power of\
    \ karate chops and Drill Shell \u2013 Increases leg strength and power behind\
    \ drill kicks), Attack Reflection via Reflect Moth (Enables the user to repel\
    \ enemy attacks), Explosion Manipulation (His attacks have a tendency of causing\
    \ explosions), Healing (Via Recover Camel), Regeneration (Mid-Low; His armor can\
    \ be restored by a natural recovery system. It is likely comparable to Blade and\
    \ Garren\u2019s regeneration. Higher with Recover Camel), Power Nullification\
    \ (The Shadow Breast generates a \u201CShield Force\u201D to nullify attacks),\
    \ Underwater Breathing (Type 3; The Misty Regulator can produce oxygen even when\
    \ underwater), Enhanced Senses (Can detect movement 5 km away), Information Analysis\
    \ (Can detect the weak points in a person\u2019s armor), Vibration Manipulation\
    \ (The blades of his bow can vibrate 3 million times a second. While is his Wild\
    \ Form, he can generate shockwaves through his antenna and bow), Temperature Manipulation\
    \ and Light Manipulation (His bow fires a high-heat energy light arrow), Summoning\
    \ (Should be comparable to Blade and Garren who could communicate their bikes\
    \ through brain waves. Can control the Shadow Chaser at will), Possible Surface\
    \ Scaling through the Shadow Chaser (Can possibly run on vertical walls), Resistance\
    \ to Electricity Manipulation (Scales to Blade, although to a lesser degree) All\
    \ previous abilities enhanced which fused all of the Hearts Suit Rouze Cards in\
    \ this form, Sound Manipulation (The Sonic Crusher Hyper generates ultrasonic\
    \ waves that shatter objects)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
