    - field: standard_equipment
      value: "Chalice Rouzer: Hajime\u2019s transformation device which allows him\
        \ to transform into Kamen Rider Chalice. After transformation, attached to\
        \ the belt is a container which holds his Rouze Cards, Rouze Card: Various\
        \ Cards which hold the power of previously defeated Undeads. By sliding it\
        \ across the ironsights of the Chalice Arrow, Hajime can use the powers of\
        \ each respective card., Spirit: A Rouze Card of the 2 of Hearts, the Spirit\
        \ Undead. It is used for Hajime to assume the form of a human., Chop Head:\
        \ A Rouze Card of the 3 of Hearts, the Hammerhead Undead. It is used to increase\
        \ the user\u2019s power, sending it through a karate chop., Float Dragonfly:\
        \ A Rouze Card of the 4 of Hearts, the Dragonfly Undead. Hajime had used this\
        \ to transform the Dragonfly Undead, although Blade has shown to be able to\
        \ use this to fly., Drill Shell: A Rouze Card of the 5 of Hearts, the Shellfish\
        \ Undead. It is used to increase the user\u2019s power, sending it through\
        \ a spinning drill kick., Tornado Hawk: A Rouze Card of the 6 of Hearts, the\
        \ Hawk Undead. It is used to supplement attacks with wind. It can also be\
        \ used by creating a tornado around Chalice to give him Pseudo-Flight., Bioplant:\
        \ A Rouze Card of the 7 of Hearts, the Plant Undead. It is used to create\
        \ vines to lash and bind enemies., Reflect Moth: A Rouze Card of the 8 of\
        \ Hearts, the Moth Undead. It is used to repel attacks, the Moth Undead has\
        \ used this to reflect Blade\u2019s lightning., Recover Camel: A Rouze Card\
        \ of the 9 of Hearts, the Camel Undead. It is used to increase the user\u2019\
        s healing ability while also recovering their physical strength., Shuffle\
        \ Centipede: A Rouze Card of the 10 of Hearts, the Centipede Undead. It allows\
        \ the user to reuse any previous Rouze Cards., Fusion Wolf: A Rouze Card of\
        \ the Jack of Hearts, the Wolf Undead. Unlike Blade or Garren, Chalice uses\
        \ the Fusion wolf card to transform into the Wolf Undead., Absorb Orchid:\
        \ A Rouze Card of the Queen of Hearts, the Orchid Undead. Just like the Fusion\
        \ Wolf Rouze Card, this would\u2019ve transformed Chalice into the Orchid\
        \ Undead., Evolution Paradoxa: A Rouze Card of the King of Hearts, the Paradoxa\
        \ Undead. Similar to Blade\u2019s Evolution Caucasus, it allows Chalice to\
        \ transform into Wild Chalice, a form which rivals Blade\u2019s King Form,\
        \ Chalice Arrow: His personal weapon when in his base form. The Chalice Arrow\
        \ is a bow-like weapon which fires high heat light arrows. The Chalice Arrow\u2019\
        s sides can expand to make the bow into a double-edged sword, both blades\
        \ vibrate 3 million times per second. The handle can scan Rouze Cards, cards\
        \ which hold the power of Undeads, monsters that Chalice has defeated previously.\
        \ The Chalice arrow is capable of using up to 3 Rouze Cards at a time., Wild\
        \ Slasher: Two pairs of sickle-shaped weapons used by Wild Chalice. Both blades\
        \ vibrate 3 million times per second, both sickles can also be attached to\
        \ the Chalice Arrow to increase its powers and also allow the use of Wild\
        \ Cyclone and Wild Slash., Wild: A composite Rouze Card that Chalice can only\
        \ use, Wild allows Chalice to perform his finisher, the Wild Cyclone and Wild\
        \ Slash. Both attacks being comparable, if not superior, to King Blade\u2019\
        s Royal Straight Flush due to the finisher using 13 Rouze Cards compared to\
        \ the Royal Straight Flush\u2019s 5."
