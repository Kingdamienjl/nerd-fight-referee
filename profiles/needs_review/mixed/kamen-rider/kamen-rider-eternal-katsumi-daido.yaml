    - field: standard_equipment
      value: 'Lost Driver: The Lost Driver is a second generation Memory Driver belt
        originally used by Kamen Rider Skull, Maximum Slots: In addition to the Maximum
        Slots on the Lost Driver and the Eternal Edge, Kamen Rider Eternal Blue Flare
        has a series of Maximum Slots on belts around his chest, right arm, for a
