- id: claim-standard-equipment-a2268e92
  section: equipment
  axis: equipment
  text: '*Lost Driver: The Lost Driver is a second generation Memory Driver belt originally
    used by Kamen Rider Skull *Maximum Slots: In addition to the Maximum Slots on
    the Lost Driver and the Eternal Edge, Kamen Rider Eternal Blue Flare has a series
    of Maximum Slots on belts around his chest, right arm, and left leg, for a total
    of 26 for every T2 Gaia Memory. *T2 Eternal Memory: Kamen Rider Eternal''s primary
    Gaia Memory, used for the transformation and Maximum Drives. This unique Gaia
    Memory has power over other Gaia Memories, neutralizing the original Gaia Memories
    use and allows Eternal to access the power of the other T2 Gaia Memories without
    transforming with them. *T2 Unicorn Memory: One of the 26 T2 Gaia Memories. Used
    to create an energy drill around his fist for a Rider Punch Maximum Drive. He
    used only this memory once to defeat Kamen Rider Joker. *T2 Zone Memory: One of
    the 26 T2 Gaia Memories. Used to gather the other T2 Memories in one place when
    placed into the Maximum Slot on the Lost Driver. *Eternal Edge: Eternal''s primary
    combat knife, summoned through the powers of the Eternal Memory.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-675f54f6
  section: power_scale
  axis: battle_iq
  text: Gifted (Was the leader of NEVER, which were a highly efficient mercenary company
    of superhumans that could casually take on terrorists groups as well as Quarks,
    who were psychic powered soldiers created by Foundation X. Easily took down Mina,
    an Elite Quarks member that made short work of the other NEVER members, in close-quarters-combat.
    Planned to destroy Futo City whilst leaving it's inhabitants turned into Necro-Over
    and came very close to succeeding, only being stopped due to Double and Accel
