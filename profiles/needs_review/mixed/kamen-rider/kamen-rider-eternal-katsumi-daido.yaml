    - field: powers_and_abilities
      value: 'Kamen Rider Physiology, Immortality (Type 7; As a Necro-Over, he is
        essentially undead, allowing him to shrug off physical trauma), Transmutation
        via Preparation (Was going to initiate the X-Bicker, that would have turned
        all of Futo City into Necro-Overs upon being killed by the resulting explosion),
        Immunity to Willpower Manipulation (Necro-Overs possess no willpower, preventing
        the Utopia Dopant from absorbing it from Daido) All previous abilities, plus:
        *Power Nullification with Eternal Edge (Upon activating Eternal Requiem, Eternal
        disables, deactivates and neutralizes any unique abilities the opponents have
        within range. These include the T1 Gaia Memories, whose respective abilities
        they hold are conceptual in nature and holds anything on Earth, whether it
        is living beings, substances, phenomena, events, and concepts) **Status Effect
        Inducement (Upon activation of Eternal Requiem, a number of status effects
        are inflicted upon the opponent) ***Exhaustion (When effected by Eternal Requiem,
        Kamen Rider W, Kamen Rider Accel, and the Fang Memory were rendered unable
        to properly stand up) ***Paralysis Inducement (Temporarily paralyzed both
        Kamen Rider W and Kamen Rider Accel before forcefully de-transforming them)
        *Energy Manipulation with T2 Unicorn Memory *Telekinesis with T2 Zone Memory
        *Explosion Manipulation (His attacks have a tendency to cause explosions)
        *Resistance to Analytical Prediction (While fighting as Eternal, the Eyes
        Dopant, which could predict the actions of others based one having several
        different views of one''s muscles in accordance to what they would, Katsumi''s
        attacks became unpredictable) All previous abilities, plus: *Fire Manipulation
        (The Accel Memory can cover its user in flames and the Heat Memory allows
        the utilization of fire based attacks) *Air Manipulation, Absorption and Statistics
        Amplification (The Cyclone Memory can manipulate powerful winds. It also allows
        users to absorb the wind and use its energy to increase their strength and
        mobility) *Flight (The Bird and Nasca Memories grant it''s users wings) *Shapeshifting
        (The Dummy Memory lets its user assume any form) *Weapon Creation (The Fang
        Memory can let its user sprout blades from parts of their body) *Biological
        Manipulation (The Gene Memory grants the ability to alter the genetic makeup
        of anything its user touches) *Ice Manipulation, Absolute Zero, and Duplication
        (The Iceage Memory grants ice based attacks that freeze at absolute zero,
        as well as form clones from ice) *Elasticity/Body Control, Illusion Creation,
        and Summoning (The Luna Memory allows its user to stretch limbs at will for
        a variety of attacks as well as cast illusions. With the T2 Luna Memory specifically,
        the Luna Dopant could create swarms of T2 Masquerade Dopants) *Thread Manipulation,
        Body Puppetry, and Sound Manipulation (The Puppeteer Memory allows its user
        to gain control over inanimate objects with special strings and utilize a
        flute that produces supersonic waves) *Energy Projection (The Trigger Memory
        grants its user the ability to fire energy based shots via firearms) *Weather
        Manipulation and Electricity Manipulation (The Weather Memory can create small
        storms capable of producing lightning) *Information Analysis and Negation
        (The Xtreme Memory grants incredible analytical capabilities and negate High-Mid
        regeneration) *Mind Manipulation and Status Effect Inducement (The Yesterday
        Memory can force a target to repeat their actions from the previous day before
        going into a comatose state, however this ability clearly takes a solid amount
        of preparation that cannot be applicable in combat normally) *Space-Time Manipulation
        (His Eternal Maximum Drive can destroy space-time of several Another Worlds
        and even Aurora Curtain)'
