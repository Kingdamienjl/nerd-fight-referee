        primary Gaia Memory, used for the transformation and Maximum Drives. This
        unique Gaia Memory has power over other Gaia Memories, neutralizing the original
        Gaia Memories use and allows Eternal to access the power of the other T2 Gaia
        Memories without transforming with them., T2 Unicorn Memory: One of the 26
        T2 Gaia Memories. Used to create an energy drill around his fist for a Rider
        Punch Maximum Drive. He used only this memory once to defeat Kamen Rider Joker.,
        T2 Zone Memory: One of the 26 T2 Gaia Memories. Used to gather the other T2
        Memories in one place when placed into the Maximum Slot on the Lost Driver.,
        Eternal Edge: Eternal''s primary combat knife, summoned through the powers
