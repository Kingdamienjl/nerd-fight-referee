- id: claim-powers-and-abilities-91625e09
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Martial Arts, Vehicular Mastery and\
    \ Weapon Mastery (As a former policeman and Motorcycle Brigade leader, Shintaro\
    \ is an excellent motorcyclist and marksman, utilizing powerful weaponry such\
    \ as firearms to destroy Yummy), Acrobatics, Transformation, Summoning (Can summon\
    \ Candroids from his Rider Vendor. By inserting 1000 cell medals into The Birth\
    \ Driver, he can summon CLAWS: Scorpions) All previous abilities, Flight (With\
    \ Cutter Wing), Energy Projection (The Breast Cannon is a powerful energy cannon\
    \ that can be charged up to multiple levels of power by using additional Cell\
    \ Medals and then release a powerful blast of energy), Fusionism (Combine the\
    \ six Birth CLAWs units, they create the CLAWs Sasori, an autonomous scorpion-like\
    \ assault droid. It can move freely across the water and burrow underground, even\
    \ with a passenger such as OOO. It can also split apart into its components and\
    \ reform to create the illusion of being destroyed. Offensively, the CLAWs Sasori\
    \ is capable of extending both of its arms and its tail on tethers like the combined\
    \ Crane and Drill Arms and can utilize a Cell Burst-like attack which fires an\
    \ array of various colored lasers from the tip of its stinger), Explosion Manipulation\
    \ (Like Kamen Rider OOO, can cause various enemy to exploded via Finishers), Statistics\
    \ Amplification (The Birth System stores and amplifies surplus energy when Birth\
    \ is in an emergency situation. Birth\u2019s Protect Matter system enables Birth\
    \ to double his defence whenever he uses a cell medal), Damage Reduction (The\
    \ Birth Tech Guard has shock absorption), Information Analysis (The Hound\u2019\
    s Nose Gear can determine the presence of toxic gases and hallucinogenic components.\
    \ The U Flasher is where various types of visual information are analyzed and\
    \ integrated. The Master Server is an organization that reads thoughts and intentions\
    \ from the wearer\u2019s brain waves, analyzes data from enemies, processes information,\
    \ monitors physical functions and provides combat support. The Multiband Echo\
    \ can match voice print patterns), Enhanced Senses (The U Flasher is equipped\
    \ with multiple visual sensor groups such as RGB Cameras, Infrared rays and Geomagnetic\
    \ sensors. Birth\u2019s Multiband Echo can hear ultrasonic waves up to 30,000\
    \ Hz.), Limited Durability Negation (Birth\u2019s Drill Arm can break the bonds\
    \ between Cell Medals), Surface Scaling with Caterpillar Legs, Summoning (Birth\
    \ can summon his weapons by inserting cell medals into the Birth Driver), Purification\
    \ (Type 1) and Resistance to Fragrance Manipulation (The Birth Intake filters\
    \ and detoxifies most poisonous gases that exist in nature as well as toxins that\
    \ are man made), Transmutation and Deconstruction (Tanked Gamel's attacks, who\
    \ can turns humans and objects into a pile of Cell Medals with just a touch, without\
    \ taking said effects) All previous abilities, Statistics Amplification (Birth-Day\u2019\
    s power can be amplified if more Cell Medals are inserted into the Birth Driver)\
    \ All previous abilities enhanced"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
