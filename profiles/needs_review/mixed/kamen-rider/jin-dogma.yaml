  attack_potency:
    text: "Wall level (Should be stronger than the Dogma Fighters. Can kill humans\
      \ in casual strikes) | Large Star level+ (Stronger than Dogma Kingdom Kaijins.\
      \ They were able to replicate Kamen Rider Super-1 into a robot, who is as powerful\
      \ as the original, and KomaThunder was able to destroy itKamen Rider Super-1\
      \ Episode 37 Big Arm Top Monster! Deathmatch at the Lighthouse!!) Power Source:\
      \ Being far more advanced than Dogma Kingdom. Utilizing electricity, magic,\
      \ magnetism, and even control of time, among with many other supernatural energy\
      \ sources. Industrial Capacity: Portrayed as much more advanced than Dogma Kingdom,\
      \ their production capacity is also on a whole new level. Jin Dogma was shown\
      \ to produce monsters that can control time, send people to pocket dimensions\
      \ and higher-dimensional spaces, such as the four-dimensional world of Utopian,\
      \ or even successfully create a robotic replicate of Kamen Rider Super-1, include\
      \ his Five Hands, something that Dogma Kingdom failed to do. Military Prowness:\
      \ JinFighters.jpg|Jin Fighters JinDogmaKaijins.jpg|Some of the Jin Dogma Kaijins\
      \ *Jin Fighters Jin Fighters (\u30B8\u30F3\u30D5\u30A1\u30A4\u30BF\u30FC, Jin\
      \ Fait\u0101) are Jin Dogma's main grunt soldiers. They were previously from\
      \ the Dogma Kingdom, and passed through brainwashing after its fall. They became\
      \ more advanced and powerful, and no longer emit a electronic sound during movement.\
      \ The normal Jin Fighters wears the classic silver mask, while Doctor Ghost's\
      \ Jin Fighters wears a golden mask. *Kaijins The Jin Dogma Kaijins are cybernetic\
      \ monsters created from alien technology that are based off inanimate objects.\
      \ They are more powerful than the Dogma Kingdom monsters. Most of them are machines,\
      \ while addicting to human movements, while others appears to be more close\
      \ to cyborgs. Each one of the four Jin Dogma executives are responsible for\
      \ leading a certain number of monsters with personalities and missions in common.\
      \ Notable Individuals: MarshalDemon.jpg|Marshal Demon PrincessYokai.jpg|Princess\
      \ Yokai CommanderOnibi.jpg|Commander Onibi DoctorGhost.jpg|Doctor Ghost StaffOfficerWitch.png|Staff\
      \ Officer Witch *Marshal Demon Marshal Demon/Satan Snake (\u60AA\u9B54\u5143\
      \u5E25\uFF0F\u30B5\u30BF\u30F3\u30B9\u30CD\u30FC\u30AF, Akuma Gensui/Satan Sun\u0113\
      ku) is the master of Terror Macro and the leader of the Jin Dogma, a coldhearted\
      \ cyborg fight who praises the glory of cybernetics. After his servants were\
      \ killed by Kamen Rider Super-1, he transformed into Satan Snake to fight Kamen\
      \ Rider Super-1. He is the owner of the Lightning Sword and in monster form\
      \ can have the eyes of his snake heads fire red explosive lasers. He was destroyed\
      \ by Super-1 with his own Lightning Sword (\u7A32\u59BB\u96FB\u5149\u5263, Inazuma\
      \ Denk\u014Dken). *Princess Yokai Princess Yokai/Satan Doll (\u5996\u602A\u738B\
      \u5973\uFF0F\u30B5\u30BF\u30F3\u30C9\uFF70\u30EB, Y\u014Dkai \u014Cjo/Satan\
      \ D\u014Dru) is one of the Four Jin Dogma Executives, wearing a butterfly mask,\
      \ she has no interest in Jin Dogma's affairs (preferring to giving herself a\
      \ cosmetic makeover) and her plans if any are seemingly less destructive and\
      \ violent in nature, typically involving children. Her monster form is a human\
      \ vampiric doll that can shoot mental strings enabling her to control her victims\
      \ in the manner of a puppet. She was destroyed by Super-1's Super Rider Horizon\
      \ Kick. *Commander Onibi Commander Onibi/Onibibinba (\u9B3C\u706B\u53F8\u4EE4\
      \uFF0F\u30AA\u30CB\u30D3\u30D3\u30F3\u30D0, Onibi Shirei/Onibibinba) is one\
      \ of the Four Jin Dogma Executives, and a quick-tempered individual, wielding\
      \ a flame looking rod in battle and sometimes riding a horse. Jin Fighters in\
      \ his command can sometimes turn into fireballs. In his monster form he wields\
      \ a scythe. He can turn one of his arms into a flamethrower (Kaen-Hosha) that\
      \ apart from burning can blind his enemies, and his shoulder is mounted with\
      \ a bazooka used to perform the (Onibi Bazooka-Ho) attack. He was destroyed\
      \ by Super-1's Super Rider Horizon Kick. *Doctor Ghost Doctor Ghost/Gold Ghost\
      \ (\u5E7D\u970A\u535A\u58EB\uFF0F\u30B4\u30FC\u30EB\u30C9\u30B4\u30FC\u30B9\u30C8\
      , Y\u016Brei Hakase/Gorudo G\u014Dsuto) is one of the Four Jin Dogma Executives.\
      \ Depicted as an eccentric figure and genius scientist. His monster form lets\
      \ him hypnotize people by showering golden confetti in the air (Ogon Ame - Golden\
      \ Rain). He can generate holographic clones of himself faraway. Said clones\
      \ can fire blue plasma bolts that create actual explosions. One of his hands\
      \ is a claw in monster and human form. He is destroyed by Super Rider's Sky\
      \ Continual Kick. *Staff Officer With Staff Officer Witch/Majoringa (\u9B54\u5973\
      \u53C2\u8B00\uFF0F\u30DE\u30B8\u30E7\u30EA\u30F3\u30AC , Majo Sanb\u014D/Majoringa)\
      \ is one of the Four Jin Dogma Executives, and a voluptuous sorceress. Assuming\
      \ the form of Majoringa, she can telekinetically displace objects (like rocks)\
      \ and spray corrosive pollen. She was destroyed fighting Super-1 with the Lightning\
      \ Sword while praising Jin Dogma with her last breath."
