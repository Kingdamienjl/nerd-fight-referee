    - field: standard_equipment
      value: 'Sengoku Driver: Transformation device for Gaim., Genesis Core: Essential
        to access the Jimber Arms., Senyo Joint: Essential to access Kiwami Arms.,
        Lockseeds: Gives access to Gaim''s Arms changes, depending on which lock is
        used, Orange Lockseed: Gaim''s primary Lockseed that he uses to equip himself
        with the Orange Arms, arming him with the Daidaimaru sword., Pine Lockseed:
        Gaim''s Lockseed that he uses to equip himself with the Pine Arms, using the
        Pine Iron flail as his weapon., Ichigo Lockseed: Gaim''s Lockseed that he
        uses to equip himself with the Ichigo Arms, armed with the Ichigo Kunai.,
        Suika Lockseed: Gaim''s Lockseed that he uses to equip himself with the Suika
        Arms exosuit., Banana Lockseed: Kamen Rider Baron''s Lockseed that Gaim borrows
        to equip himself with the Banana Arms, using the Bananaspear as his weapon.,
        Donguri Lockseed: Kamen Rider Gridon''s Lockseed that Gaim borrows to equip
        himself with the Donguri Arms, using the Donkachi mallet as his weapon., Durian
        Lockseed: Kamen Rider Bravo''s Lockseed that Gaim borrows to equip himself
        with the Durian Arms, using the saw-toothed Duri Noko swords as his weapon.,
        Lemon Energy Lockseed: Kamen Rider Duke''s Energy Lockseed which Gaim obtained
        and uses with his Orange Lockseed and the Genesis Core to assume the form
        of Gaim Jimber Lemon Arms with use of the Sonic Arrow used by New Generation
        Armored Riders., Cherry Energy Lockseed: Kamen Rider Sigurd''s Energy Lockseed
        which Gaim obtained and uses with his Orange Lockseed and the Genesis Core
        to assume the form of Gaim Jimber Cherry Arms., Peach Energy Lockseed: Kamen
        Rider Marika''s Energy Lockseed which Gaim obtained and uses with his Orange
        Lockseed and the Genesis Core to assume the form of Gaim Jimber Peach Arms.,
        Kachidoki Lockseed: Gaim''s penultimate Lockseed that he uses to equip himself
        with the Kachidoki Arms and is armed with the DJ Gun., Kiwami Lockseed: Gaim''s
        ultimate Lockseed that he uses with the Kachidoki Lockseed to transform himself
        into Gaim Kiwami Arms with access to every weapon possessed by the Armored
        Riders., Lock Vehicles: Vehicles that unfold from special Lockseeds:, Sakura
        Hurricane: Gaim''s main Rider Machine. A motorcycle that enables the rider
        dimensional travel to Helheim Forest, able to be move at Subsonic speed (top
        speed is 245.0 km/h via movie data.)., Dandeliner: Gaim''s second Rider Machine.
        This machine can fly and has a weapons system within the front. It is lost
        during the final battle against Kaito Kumon to an evolved Seiryu Inves., Tulip
        Hopper: Gaim''s third Rider Machine, which can disguise themselves and the
        riders as regular red tulips for sneak attacks and defensive traps, and form
        an incredibly hard defense by folding into their Lockseed forms. It fires
        a laser from a tulip emblem in-between the guns, which created a Crack. It
        also has a turbine in the front below the laser, allowing it to blow away
        most anything. On the locking arm is a scanning lens, designed to help search
        for targets., Rose Attacker: Gaim''s unused Rider Machine, which is given
        to Decade to get Shu Aoi escape with him while Gaim prevents Fifteen from
        taking his son away from the lighthouse where Saki Aoi is.'
      source_id: mediawiki-26942
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted (Kouta is a surprisingly skilled combatant, proving to be a very
        capable Armoured Rider time and time again. Despite struggling early into
        his first fight given the abruptness of it, he was able to adjust fast enough
        to where he could pull off advanced weapon maneuvers and block a large Inves'
        attacks twice without actually seeing them. Avoided turret fire from Tulip
        Hoopers that surrounded and outnumbered him. Came out victorious during his
        assault on Yggdrasil Tower, in which he avoided numerous enemy projectiles
        at once, strategically destroyed the tower's security systems, and took out
        an army of Kurokage Troopers. Has fought evenly with Baron and defeated him
        twice during one-on-one duels. In their final battle, Gaim cleverly landed
        the killing blow by breaking apart Kaito's sword and using the broken piece
        to pierce him. Even when fighting without lethal intent, Kouta was superior
        to, and bested Mitsuzane in combat while the latter was fighting as Zangetsu
        Shin. Almost earned an early victory against the Overlord known as Demushu,
        only being interrupted by Marika, with Baron pointing out this interruption
        was a foolish decision; Overlords are intelligent enough to read and understand
        books written in unfamiliar languages just for the sake of "killing time".
        Could fight on par with Bujin Gaim, an alternate version of himself that viewed
        as the strongest amongst the other feudal lords known as Bujin Riders, having
        dominated them to achieve his goal of conquering the world. After gaining
        access to a larger arsenal through Kiwami Arms, Kouta was capable of masterfully
        wielding weapons he had never used before. His quick thinking allowed him
        to act fast enough to summon his Dandeliner mid-fall, as well as react to
        an opponent lunging at him after teleporting, managing to create a spear and
        block just in time. Kouta has often showcased notable adaptation capabilities
        when piloting vehicles, capable of expertly driving a prototype vehicle totted
        as "the latest tech". When driving the Sakura Hurricane while being chased,
        he sliced through a tree without looking, causing it to fall into the way
        of his pursuer. The first time piloting a Tulip Hopper, Gaim managed to outmaneuver
        and outsmart four Kurokage Troopers operating their own with notable finesse,
