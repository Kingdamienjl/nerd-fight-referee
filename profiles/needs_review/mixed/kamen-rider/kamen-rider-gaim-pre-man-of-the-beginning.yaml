- id: claim-standard-equipment-b260d787
  section: equipment
  axis: equipment
  text: '*Sengoku Driver: Transformation device for Gaim. **Genesis Core: Essential
    to access the Jimber Arms. **Senyo Joint: Essential to access Kiwami Arms. *Lockseeds:
    Gives access to Gaim''s Arms changes, depending on which lock is used **Orange
    Lockseed: Gaim''s primary Lockseed that he uses to equip himself with the Orange
    Arms, arming him with the Daidaimaru sword. **Pine Lockseed: Gaim''s Lockseed
    that he uses to equip himself with the Pine Arms, using the Pine Iron flail as
    his weapon. **Ichigo Lockseed: Gaim''s Lockseed that he uses to equip himself
    with the Ichigo Arms, armed with the Ichigo Kunai. **Suika Lockseed: Gaim''s Lockseed
    that he uses to equip himself with the Suika Arms exosuit. **Banana Lockseed:
    Kamen Rider Baron''s Lockseed that Gaim borrows to equip himself with the Banana
    Arms, using the Bananaspear as his weapon. **Donguri Lockseed: Kamen Rider Gridon''s
    Lockseed that Gaim borrows to equip himself with the Donguri Arms, using the Donkachi
    mallet as his weapon. **Durian Lockseed: Kamen Rider Bravo''s Lockseed that Gaim
    borrows to equip himself with the Durian Arms, using the saw-toothed Duri Noko
    swords as his weapon. **Lemon Energy Lockseed: Kamen Rider Duke''s Energy Lockseed
    which Gaim obtained and uses with his Orange Lockseed and the Genesis Core to
    assume the form of Gaim Jimber Lemon Arms with use of the Sonic Arrow used by
    New Generation Armored Riders. **Cherry Energy Lockseed: Kamen Rider Sigurd''s
    Energy Lockseed which Gaim obtained and uses with his Orange Lockseed and the
    Genesis Core to assume the form of Gaim Jimber Cherry Arms. **Peach Energy Lockseed:
    Kamen Rider Marika''s Energy Lockseed which Gaim obtained and uses with his Orange
    Lockseed and the Genesis Core to assume the form of Gaim Jimber Peach Arms. **Kachidoki
    Lockseed: Gaim''s penultimate Lockseed that he uses to equip himself with the
    Kachidoki Arms and is armed with the DJ Gun. **Kiwami Lockseed: Gaim''s ultimate
    Lockseed that he uses with the Kachidoki Lockseed to transform himself into Gaim
    Kiwami Arms with access to every weapon possessed by the Armored Riders. *Lock
    Vehicles: Vehicles that unfold from special Lockseeds: **Sakura Hurricane: Gaim''s
    main Rider Machine. A motorcycle that enables the rider dimensional travel to
    Helheim Forest, able to be move at Subsonic speed (top speed is 245.0 km/h via
    movie data.). **Dandeliner: Gaim''s second Rider Machine. This machine can fly
    and has a weapons system within the front. It is lost during the final battle
    against Kaito Kumon to an evolved Seiryu Inves. **Tulip Hopper: Gaim''s third
    Rider Machine, which can disguise themselves and the riders as regular red tulips
    for sneak attacks and defensive traps, and form an incredibly hard defense by
    folding into their Lockseed forms. It fires a laser from a tulip emblem in-between
    the guns, which created a Crack. It also has a turbine in the front below the
    laser, allowing it to blow away most anything. On the locking arm is a scanning
    lens, designed to help search for targets. **Rose Attacker: Gaim''s unused Rider
    Machine, which is given to Decade to get Shu Aoi escape with him while Gaim prevents
    Fifteen from taking his son away from the lighthouse where Saki Aoi is.'
