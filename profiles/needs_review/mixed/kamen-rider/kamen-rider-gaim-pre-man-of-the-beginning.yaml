    and can even override other Overlords'' manipulation over the flora) *Transmutation
    (If an Overlord breaks the skin of a human being in an attack, their victims will
    have the plants from Helheim sprout from their wounds, causing intense pain, and
    likely mutates them into Inves) *Matter Manipulation (He can turn a broken Lockseed
    back into its fruit form, before restoring its intact state) *Portal Creation
    (He can open countless Cracks to summon Inves from the Helheim Forest) *Regeneration
    (Low-Mid, Got stabbed in abdomen and was still able to recover shortly afterwards)
    *Statistics Amplification (He can further increase his abilities when eating the
    Fruit of Helheim) **Resistance to: ***Dream Manipulation (Broke through Redyue''s
    mental illusion) ***Mind Manipulation and Soul Manipulation (Sengoku Driver offers
    protection against the Saver System which brings the entire human population''s
    spirit and mind to a higher dimension. Armored Riders were still able to maintain
    their ego and did not melt with the rest of the worldKamen Rider Gaim novel; Chapter
    4) All previous abilities, plus: *Enhanced Acrobatics (His acrobatic abilities
    are enhanced further when changing forms) *Enhanced Senses (Pulp Eye is a myriad
    of small camera eyes is arranged radially and can be caught far beyond the human
    visual range. Byakugo Signal has a property of reacting to electromagnetic waves,
    magnetic force, various radio waves, and acts as a sensor) *Information Analysis
    (Peak Stem measures the wearer''s biological information including heart rate,
    physical and mental damage) *Damage Reduction (The armor absorbs impact from jumping
    and the recoil of kicking, it can also reduce damage by repelling each other through
    electromagnetic force) *Purification (Type 1; The mouth purify toxic substances
    from outside for clean air) *Energy Manipulation and Energy Projection (Many of
    his attacks are energy-based) *Flight with Suika Arms (Gyro Mode which allowed
    him to flight) *Forcefield Creation (Can encase the opponent in a barrier to constrict
    them ) *Dimensional Travel with Sakura Hurricane (Allows Gaim to travel to Helheim)
    *Durability Negation with Daidaimaru (The sword can cut through chemical bonds)
    *Summoning (Can summon and control Inves from another dimension via Lockseeds
    initially) *Explosion Manipulation (Can cause enemy to exploded via various Finishers)
    *Limited Attack Reflection and Magnetism Manipulation (Pine Arm''s Spine sleeves
    are designed to deflect enemy attacks as well as damage people that come in contact
    with it. The Boost Core on Pine Iron generates a magnetic field for Gaim to maneuver
    it better) *Danmaku (Strawberry Arms can make a large energy Starberry that explodes
    into many Strawberry Kunais) **Resistance to Poison Manipulation (The mouth serves
    as purificator which remove toxic substances from the air) All previous abilities,
    plus: *Magic and Energy Manipulation (His armor is made of magical gems that prevent
    attacks by magic power and energy waves) *Homing Attack (WizarSwordGun can fire
    a magical bullet which can home to the target), and all the powers of Flame Styles
    Wizard (Wizard Lockseed contains the powers of the Bujin Wizard, which is an alternate
    version of the original Flame Styles Wizard) All previous abilities enhanced,
    plus: *Statistics Amplification (Jimba Arms can increase Gaim''s power to higher
    level) *Enhanced Damage Reduction (The head contains multiple armors via stacking
    metal plates and can parries attack dealt to the head) *Enhanced Senses with Jimber
    Peach Arms (Allows Gaim to hear from a great distance. Because of this, it can
    be used to sense an enemy''s location. However, it is unable to handle higher-pitched
    sound waves) *Speed Amplification (Can increase his speed with Jimber Cherry Arms)
    All previous abilities enhanced, plus: *Statistics Amplification (Gaim''s central
    armor amplifies the energy of Kachidoki Lockseed. The Kachidoki Leg and Fists
    has mechanisms that amplifies his strength) *Damage Reduction (Gaim''s armor invalidates
    damage) *Gravity Manipulation (Can project a field of anti-gravity with the flags
    on his back) All previous abilities enhanced, plus: *Weapon Creation (Can summon
    and utilize either any of the thirteen basic Arms Weapons, any of the three weapons
    with an attachment slot for the Lockseeds, or the Kagematsu Shin simply by accessing
    their power through the Kiwami Lockseed) *Telekinesis (He can control and fire
    off the summoned weapons as projectiles against the enemy) *Enhanced Damage Reduction
