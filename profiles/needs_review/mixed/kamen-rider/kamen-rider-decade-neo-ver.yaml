- id: claim-powers-and-abilities-0f94fd30
  section: abilities
  axis: hax
  text: Should be the same as his past self that include Superhuman Physical Characteristics,
    Genius Intelligence, Social Influencing, Extrasensory Perception, Immortality
    (Type 1 and 8; As long as the memories of his existence lives on within the minds
    of people, he will never truly die. He can go so far as to return from being erased
    from history and being becoming fictional), Martial Arts, Telepathy (Manage to
    talk with Mitsuzane inside Saver's own realm and convince him to not give up by
    showing images of Riders fighting across existence), Weapon Mastery, Acrobatics,
    Portal Creation, Dimensional Travel and Time Travel (Using his Dimensional Walls,
    Tsukasa can travel to parallel universes and travel through time. Invaded Saver's
    own realm to rescue Mitsuzane), Passive Space-Time Manipulation, Reality Warping
    and Existence Erasure (Should has same powers as his past self. Claimed that he
    could destroy the world with only 50% of his power), Resurrection (If people still
    remember him, he can recreate his existence), Regeneration (High-Godly; Plot and
    Concept; he can regenerate after death with the memories of his fellow even though
    he has no story of his own), Acausality (Type 1, 2, and 4; Was completely unaffected
    by the multiple changes in history during the events of Zi-O. Is a Singularity
    Point and is incapable of having his history altered, on top of having no future
    to look forward to. Is completely detached from the fate of every universe in
    the multiverse), Conceptual Manipulation (type 1-Destruction; Erased the power
    of Ghost from the Ghost Ridewatch), Resistance to Possession (Was eventually capable
    of pushing Urataros, Kintaros, and Ryutaros out of his body at once), Causality
    Manipulation (Was unaffected by changes in the timeline), Fate Manipulation (As
    a Singularity Point, he lacks a discernable future to alter), Conceptual Power
    Nullification and Conceptual Power Absorption (His dimensional powers are tied
    to his existence and can't be taken from him), Memory Manipulation (Held all his
    memories even after his powers were taken by an Another Ridewatch), Existence
    Erasure (3 layers, Is completely resistant to Another Ridewatches, unaffected
    by Ohma Zi-O rewrote the timeline), Reality Warping, Dimensional Manipulation,
    and Fusionism (Unfazed by Saver's merging with all existence and transcending
    it, even travel to Saver's realm to rescue MitsuzaneKamen Rider Gaim novel; Chapter
    4), Void Manipulation (Unaffected by Ohma Zi-O's destruction/creation power that
    erases whole space-time to nothingness) All previous abilities, Transformation
    (Can transform into various Riders before him), Invisibility (Can turn invisible),
    Duplication (Can make 3-6 copies of himself that are identical to him and can
    use his abilities), Shapeshifting (Can turn into other Kamen Riders), Energy Manipulation
    (Most of his weapons has energy-based attacks), Statistics Amplification (Can
    amp his attacks to greater extent, such as Dimension Kick, Dimension Slash and
    Dimension Blast, which strong enough to one-shot enemies that overpower him),
    Technology Manipulation (The Machine Decader can assume the form of a respective
    Rider's motorcycle), Immortality Negation (Type 5; Can kill Undeads, who can't
    die and need to be sealed), Can enters Mirror World, 4th wall awareness, Power
    Mimicry (Can copy powers with his cards), BFR (Can send his enemies into dimensional
    rifts), Soul Manipulation (Destroyed a Fangire's body and soul), Spatial Manipulation
    (His Rider Card Holder is an infinite holder of Rider Cards, due to a connection
    with the Klein Bottle), Enhanced Senses (Can detect radio frequencies and greatly
    enhanced eyesight) All previous abilities, Enhanced Senses, Extrasensory Perception,
    Statistics Amplification, Non-Physical Interaction (With Ghost abilities, he is
    able to contact with an abstract and nonexistent being like the Great Eye), Incorporeality,
    Abstract Existence (type 1), Nonexistent Physiology (Nature 1 & 3, Aspect 1 &
