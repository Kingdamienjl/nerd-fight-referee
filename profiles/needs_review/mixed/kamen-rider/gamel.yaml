- id: claim-standard-equipment-7006f2f8
  section: equipment
  axis: equipment
  text: '*Cell Medals: An silver O Medals and come from the Greeed, making up their
    bodies and those of the Yummy. Cell Medals can feature the front side of any Core
    Medal (including from the special black, purple, and orange sets), usually one
    from the Greeed who produced it but with no needed correlation once Yummies start
    accumulating them; their backs feature an X, though some shots show them as having
    the same horizontal bars as Core Medals. These Medals are a manifestation of human
    desire that hold tremendous power, and can be generated by Yummies absorbing targets
    of human desire.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
