    of a spoiled child that makes him unable to work well with others normally and
    more childish than the hyperactive Kazari)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-962c5fd4
  section: weaknesses
  axis: weakness
  text: Once Greeed start taking damage, they began to 'bleed' Cell Medals and even
    Core Medals if enough damage is sustained. If Greeed Core Medals is reduced to
    one they will be forcibly reverting back to their much more vulnerable human form.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-0be7a536
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Regeneration (Varies depending on how
    much Cell Medals he had, Low-High at most), Creation (Like Uva and other Greeed,
    Gamel can create Yummy by inserting Cell Medal into a host in order to create
    a monster to carrying out the will of their host's desire to the extreme degree
    and creating more Cell Medals in the process. However, unlike other Greeed, Gamel
    can't create Yummy out of human host. He is using his own desire to create Yummy,
    meaning that he can't create more Cell Medal for himself. But his Yummy will be
    much stronger from the start unlike other Greeed due to the desire already being
    realized), Inorganic Physiology (Type 2; Greeed body are made of Cell Medals,
    thus lacking of any organic part), Immortality (Type 1, 3 and 8; As long as he
    have enough Cell Medal and the Core Medal that is housing his conscious is intact.
    He can continue to revive and regenerate himself), Body Control (Can turn his
    body into a mass of Cell Medals, them reforming it back to his original state),
    Transformation (Can transform into looking like a human in order to blend in with
    the society), Possession (If a Greeed body is destroy but the Core Medal housing
    their conciousness is intact, they can possessed nearby human.), Absorption and
    Statistics Amplification (Greeed can absorbed Cell Medals or even Core Medals
    in order to become stronger and even healing themselves), Resistance to Perception
    Manipulation (Greeed sense are naturally dulled out, their taste are nonexistent,
    vision is static, and unable to feel human emotions) and Soul Manipulation (Greeeds
    are the beings made from mass of cell medals, which are nothing but crystalized
    "desires" and have no soul of their own. Their consciousness is held inside the
    core medals, which act as their prime power source) All previous abilities enhanced
    plus Transmutation (Able to instantly turn anything he touch into a pile of Cell
    Medals to both organic and inorganic thing), Gravity Manipulation (Share this
    ability with OOO's Sagouzo Form. While enrage he is passively causing everyone
    near him to be pinned by heavy gravity), Rage Power, Limited Sound Manipulation
    (His scream knocked both OOO and Birth out of their transformation and even short
    circuiting nearby electricity appliances), Possibly able to use Water Manipulation,
    and Intangibility due to having Mezool's Core Medals
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
