    machine. *As Kamen Rider Gattack: **Rider Belt: Transformation Belt for Gatack
    **Gatack Zecter: Transformation device for Gatack. **Gatack Double Calibur: A
    twin-sword cutter, when coupled as a joint, makes a device that can pinch the
    opponent in a hinge type and grips the enemy firmly with three pairs of protrusions
    on the inner blade, similar to a stag beetle''s mandible. **Gatack Extender: Gatack''s
    personal machine that can change into two modes: Masked Mode and Ex Mode. **Hyper
    Zecter: Transformation device for Gatack to become Hyper Form.'
