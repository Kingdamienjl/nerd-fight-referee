- id: claim-powers-and-abilities-867c5b02
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, Martial Arts, Weapon Mastery,
    Magic (Kosuke can use his spells without transforming), Weapon Mastery, Transformation
    (With Beast Driver), Flight (Via Falco Mantle Ring that grants him the ability
    to fly. He can use this ability while he is not transformed), Camouflage (Via
    Chameleo Mantle Ring that gives him the ability to camouflage into his surroundings
    and become invisible. He can use this ability while he is not transformed), Cloth
    Manipulation (Via Dress Up Wizard Ring), Size Manipulation (Via Small Wizard Ring
    that can decrease user's size to become smaller), Absorption (Can absorb the mana
    of defeated Phantoms to regain his strength), Summoning (With Chimarise Mantle
    Ring he can summon the Beast Chimera in an Underworld. If Beast summons Beast
    Chimera while in Beast Hyper, he will revert back to his original form), Portal
    Creation (Via Engage Wizard Ring he can create a portal at Phantom-caused Gate
    to send him into their Underworld) All previous abilities, Enhanced Senses (With
    Sensing Rod as it strengthens the sixth sense of instinct, allowing Beast to detect
    danger and react accordingly; Via Wild Ears as it can catch sounds that ordinary
    people cannot hear and can 'sense' the source of the sound and the distance towards
    it), limited Underwater Breathing (With Life Crusher as it grant him type 3 thanks
    to its ability to store oxygen, allowing Beast to work underwater for a limited
    time), Energy Manipulation (Most of his attacks are energy-based), Energy Projection
    (Via Dice Saber), Water Manipulation, Animal Manipulation (Via Dice Saber), Power
    Nullification (With Sorcerium in his Armor which is a magical metal that disable
    any magical attack), Super Swimming Speed and Healing (With Dophin Mantle Ring
    that creates water-element magical energy to cure injuries or poisons and gives
    him incredible swimming speed), Statistics Amplification (With Buffa Mantle Ring
    that enhance his physical strength and endurance), Resistance to Poison Manipulation
    (Via Life Crusher as any air that is taken in is filtered to remove toxic compounds)
    All of previous abilities enhanced plus, Resistance to Statistics Reduction with
    Mirage Magnum (Via Task Pointer which preventing decrease the magical power of
    the magical bullets) Earth Manipulation and Gravity Manipulation (With Wizard's
    Land Dragon Wizard Ring)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
