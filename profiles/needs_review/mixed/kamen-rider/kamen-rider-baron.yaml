- id: claim-powers-and-abilities-55a7a3da
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Weapon Mastery, Analytical Prediction
    (Without even looking, Kaito landed a ranged attack on an Overlord attempting
    a teleporting attack from behind), Transformation, Martial Arts, Acrobatics, Supernatural
    Willpower (Fought through the pain of using the Ringo Lockseed) All previous abilities,
    Enhanced Senses (Should be comparable to Kamen Rider Gaim (Pre-Man of the Beginning)
    due to being in the system: Pulp Eye is a myriad of small camera eyes is arranged
    radially and can be caught far beyond the human visual range. Byakugo Signal has
    a property of reacting to electromagnetic waves, magnetic force, various radio
    waves, and acts as a sensor. Banana Spear has telescopic function), Information
    Analysis (Peak Stem measures the wearer''s biological information including heart
    rate, physical and mental damage), Damage Reduction (The armor absorb impact from
    jumping and the recoil of kicking, it can also reduce damage by repelling each
    other through electromagnetic force), Purification (Type 1; The mouth purify toxic
    substances from outside for clean air), Energy Manipulation and Energy Projection
    (Many of his attacks are energy-based), Forcefield Creation (Can make a shield
    out of banana projections to defend against attacks), Dimensional Travel (With
    Rose Attacker), Summoning (Can summon and control Inves from Helheim via Lockseeds
    initially), Explosion Manipulation (Can cause enemy to exploded via various Finishers),
    Resistance to Poison Manipulation (The mouth serves as purificator which remove
    toxic substances from the air) All previous abilities, Spatial Manipulation and
    Durability Negation with Medajaribur (Can use Medajaribur to fire waves of energy
    and slice through not only targeted opponents, but the fabric of reality itself),
    and all the powers of OOO Tatoba Combo (Said to have the power of the Tatoba Combo
    in every part of his body) All previous abilities enhanced, Enhanced Senses (With
    Jimber Signal the updated Byakugou Signal acts as a sensor on multiple signals),
    Homing Attack (Can fire energy arrows that track enemies after being fired) All
    previous abilities enhanced, Regeneration (Low-Mid; Gained increased health regeneration,
    allowing him to take lethal damage and still able to recover shortly afterward.
    Although he has a limit that is lower than Kouta), Transformation and Body Control
    (He can transform into a dark red smoke that can interact with anything within
    its mass, such as lifting opponents off the ground), Telekinesis (He uses this
    to stop Gaim projectiles and destroy them on atomic level), Plant Manipulation
    (An Overlords can control Helheim flora and using nearby Helheim vines for attacking
    their enemy), Attack Reflection (He can absorb energy blasts and redirect them),
    Transmutation (If they break the skin of a human being in an attack, the victims
    will have the plants from Helheim sprout from their wounds, causing intense pain,
    and likely mutating them into Inves), Portal Creation (He can open countless cracks
    to summon Inves from the Helheim Forest)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
