- id: claim-standard-equipment-18dbef54
  section: equipment
  axis: equipment
  text: '*Transformation devices: **Sengoku Driver: Primary transformation device
    for Baron. **Genesis Drive: Secondary transformation device for Baron. (disabled
    by Professor Ryoma''s self-destruct fail-safe) *Lockseeds: Gives access to Baron''s
    Arms changes, depending on which lock is used: **Banana Lockseed: Baron primary
    Lockseed that he uses to equip himself with the Banana Arms, arming him with the
    Bananaspear lance. **Mango Lockseed: Baron''s secondary Lockseed that he uses
    to equip himself with the Mango Arms, using the Mango Punisher Warhammer as his
    weapon. **Lemon Energy Lockseed: Kamen Rider Duke''s Energy Lockseed which Baron
    obtained and uses with his Genesis Driver to become the New Generation Rider Baron
    Lemon Energy Arms, with use of the Sonic Arrow. **Ringo Lockseed: A forbidden
    Lockseed that Baron once used to become Baron Ringo Arms, arming him with the
    Sword Bringer and Apple Reflecter shield. *Lock Vehicles **Rose Attacker: Kamen
    Rider Baron''s main Rider Machine. **Dandeliner: Kamen Rider Baron''s second Rider
    Machine. *Guronbaryamu: A sword that Baron uses in his Overlord form.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
