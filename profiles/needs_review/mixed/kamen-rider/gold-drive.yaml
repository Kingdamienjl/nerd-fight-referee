    text: Genius, Narcissistic and arrogant, Banno is completely convinced of his
      genius and is motivated by his god complex and desire to control everything.
      Despite boasting the glories of his intellect, most of Banno's greatest works
      of self-proclaimed genius are ripoffs of the products of Krim's genius, such
      as the Roidmudes' Core Driviars, the mind uploading technology he used to preserve
      himself as an AI, and the Banno Driver being reverse-engineered from the Drive
      Driver. The extent of this shamelessness is best shown in how he plagiarizes
      not just Krim's work, but Krim himself, via having Roidmude 004 copy Krim's
      data to use the latter's scientific genius to complete the Sigma Circular.
