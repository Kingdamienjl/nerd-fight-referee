- id: claim-standard-equipment-fa9e4bb7
  section: equipment
  axis: equipment
  text: 'Device *Banno Driver: Belt-based transformation device *Shift Brace: Bracelet-based
    weapon-selecting device (used to activate Signal Bikes or Shift Cars). Gold Drive
    has a jet-black version of it. *Shift Cars: Gives access to Gold Drive''s forms
    and powers, depending on which car is used *Signal Bikes: Gives access to Gold
    Drive''s secondary powers, depending on which bike is used (stolen from Mach)
    Weapon *Zenrin Shooter: Gold Drive''s gun weapon. Stolen from Kamen Rider Mach
    during their first battle. *Door-Ju: Gold Drive''s second gun weapon originally
    used by the second Drive. Stolen during Drive''s first fight with Gold Drive along
    with the Brake Gunner. *Break Gunner: Gold Drive''s third gun weapon originally
    used by Chaser. *Handle-Ken: Gold Drive''s sword weapon. Stolen from Drive during
    their second fight. *Shingou-Ax Gold Drive''s ax weapon. Stolen from Chaser during
    his final encounter.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-7bf565dc
  section: power_scale
  axis: battle_iq
  text: Genius, Narcissistic and arrogant, Banno is completely convinced of his genius
    and is motivated by his god complex and desire to control everything. Despite
    boasting the glories of his intellect, most of Banno's greatest works of self-proclaimed
    genius are ripoffs of the products of Krim's genius, such as the Roidmudes' Core
    Driviars, the mind uploading technology he used to preserve himself as an AI,
    and the Banno Driver being reverse-engineered from the Drive Driver. The extent
    of this shamelessness is best shown in how he plagiarizes not just Krim's work,
    but Krim himself, via having Roidmude 004 copy Krim's data to use the latter's
    scientific genius to complete the Sigma Circular.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-6fd41763
  section: abilities
  axis: hax
  text: As Data (Tablet)=Genius Intelligence, Data Manipulation (Can perform numerous
    abilities which generate from data), Energy Manipulation (Mapulates from data
    to release energy tentacles which coat electric shocks, contact at the target),
    Healing (Can create an advanced cure), Forcefield Creation, Technology Manipulation
    (Can manipulate surrounding technology to his liking, even shown capable of controlling
    the whole Drive Pit's system), Levitation As Data (Banno Driver)=All of Tablet
    Key abilities plus Mind Control and Memery Overwrite (Able to attach himself to
    other Roidmudes and override their will to take control of their bodies) All previous
    abilities, Transformation with Banno Driver, Superhuman Physical Characteristics,
    Energy Manipulation, Weapon Mastery, Resistance to Slowdown, Heavy Acceleration,
    Hand to Hand Combat, Acrobatics, Data Manipulation (Activates the red ignition
    key to briefly steal his opponent's weapon, data and support device), Forcefield
    Creation, Electricity Manipulation and Paralysis Inducement (Can trap his enemies
    in an electromagnetic wave), Teleportation (Can teleport himself and other passengers
    by transforming their particles into data strips) All previous abilities massively
    enhanced
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
