        at the bottom of her sash. *Double Kick: After being knocked down, Mai performs
        a handstand kick to surprise the opponent. *Sankaku Tobi ("Triangle Jump"):
        Mai briefly adheres onto a wall and jumps off of it. *Ukihane ("Floating Feather"):
        Upon leaping in the air, Mai drops on the opponent knee-first. *Koukaku no
        Mai ("Dance of the Crimson Crane"): Mai slides forward to kick the opponent
        low, then performs a half-cartwheel to kick them in the midsection. *Homura
        Niren ("Blazing Doublet"): Mai knees the opponent up front, then strikes them
        with a somersault kick which knocks them far away. *Yumihari no Mai ("Dance
        of the Half-Moon"): Mai spins in mid-air while wielding her fans in both her
        hands, slashing the opponent multiple times. {{scroll box|content= RyuNoMai.gif|Ryu
        no Mai MaiDoubleKick.gif|Double Kick SankakuTobi.gif|Sankaku Tobi Ukihane.gif|Ukihane
        KoukakuNoMai.gif|Koukaku No Mai HomuraNiren.gif|Homura Niren YumihariNoMai.gif|Yumihari
        no Mai }} |-|Throws= *Fuusha Kuzushi ("Windmill Crumbler"): Mai does a handstand,
        clutches the opponent''s neck between her ankles and tosses them away. *Yume
        Zakura ("Dream Cherry Blossom"): Mai catches an airborne opponent, plants
        her feet in their midsection and drives them crashing down. *Shiranui Gorin
        ("Shiranui Strong Confront"): Mai grabs the opponent by the head, positions
        herself vertically over them and flips them over. *Yume Kachou ("Dreamy Flower-Butterfly"):
        Mai catches an airborne opponent, pushes them down with her knees and falls
        upon them to plant her fans into their body. FushaKuzukuKai.gif|Fusha Kuzuku
        Kai YumeZakura.gif|Yume Zakura ShiranuiGorin.gif|Shiranui GorinFootage by
        Fighting Game Move Lists YumeKachou.gif|Yume Kachou |-|Special Attacks= *Kachousen
        ("Butterfly Folding Fan"): Mai throws one of her fans as a spinning projectile.
        *Midare Kachousen ("Dishevelled Butterfly Folding Fan"): Mai throws three
        fans at the same time, covering a larger area. *Ryuuenbu ("Dragon Flame Dance"):
        A fiery version of the Ryu no Mai. *Hissatsu Shinobi Bachi ("Deadly Ninja
        Bee"): Mai attacks with a cartwheel kick and then leaps forward to elbow the
        enemy. *Musasabi no Mai ("Dance of the Flying Squirrel"): Mai spins on herself
