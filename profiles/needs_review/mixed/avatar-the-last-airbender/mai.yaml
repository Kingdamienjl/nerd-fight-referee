        ("Heat Haze Dance"): Mai summons two flaming duplicates of herself which circle
        around her for a while. Alternatively, she claps her hands together and generates
        a pillar of fire around herself. *Riotous Fan: Mai uppercuts her opponent
        five times with her fans, tossing them upward, and then she storms the opponent
        with a barrage of fan strikes. *Sayo Chidori ("Evening Plover/Thousand Birds"):
        Mai swings one of her fans in front of her to slash the opponent. *Hana Arashi
        ("Blossom Storm"): A light and quicker version of the homonymous super attack.
        Mai rises in the air while spinning with her fans outstetched, slashing at
        the opponent multiple times. {{scroll box|content= KachoSen.gif|Kachousen
        MidareKachoSen.gif|Midare Kachousen RyuEnbu.gif|Ryuuenbu HissatsuShinobuBachi.gif|Hissatsu
        Shinobi Bachi MusasabiNoMai.gif|Musasabi no Mai KageroNoMai.gif|Kagerou no
        Mai (v.I) KageroNoMai2.gif|Kagerou no Mai (v.II) RiotousFan.gif|Riotous Fan
        SayoChidori.gif|Sayo Chidori HanaArashi.gif|Hana Arashi }} |-|Super Attacks=
        *Chou Hissatsu Shinobu Bachi ("Super Deadly Ninja Bee"): A scorching version
