        in the air, Mai drops on the opponent knee-first. *Koukaku no Mai ("Dance
        of the Crimson Crane"): Mai slides forward to kick the opponent low, then
        performs a half-cartwheel to kick them in the midsection. *Homura Niren ("Blazing
        Doublet"): Mai knees the opponent up front, then strikes them with a somersault
        kick which knocks them far away. *Yumihari no Mai ("Dance of the Half-Moon"):
        Mai spins in mid-air while wielding her fans in both her hands, slashing the
        opponent multiple times. *Fuusha Kuzushi ("Windmill Crumbler"): Mai does a
        handstand, clutches the opponent''s neck between her ankles and tosses them
        away. *Yume Zakura ("Dream Cherry Blossom"): Mai catches an airborne opponent,
        plants her feet in their midsection and drives them crashing down. *Shiranui
        Gorin ("Shiranui Strong Confront"): Mai grabs the opponent by the head, positions
        herself vertically over them and flips them over. *Yume Kachou ("Dreamy Flower-Butterfly"):
        Mai catches an airborne opponent, pushes them down with her knees and falls
        upon them to plant her fans into their body. FushaKuzukuKai.gif|Fusha Kuzuku
