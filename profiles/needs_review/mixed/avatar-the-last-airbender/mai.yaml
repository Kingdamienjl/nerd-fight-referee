        \ Weaponry) and Hens\u014Djutsu (Disguise and Illusions). :* Taijutsu: The\
        \ Taijutsu part of the Shiranui-ryuu Ninjutsu is the acrobatic martial arts\
        \ that Mai specialises in. It is all about speed and agility that lets Mai\
        \ quickly jump in at the opponent and beat them down at the expense of being\
        \ left wide open if her attacks miss. Mai's martial arts techniques are often\
        \ enhanced by her pyrokinetic abilities. :* Shurikenjutsu: The Shurikenjutsu\
        \ part of the Shiranui-ryuu Ninjutsu allows Mai to expertly throw her fans\
        \ with accuracy that lets her hit opponent's that are a fair distance away\
        \ from her. :* Hens\u014Djutsu: The Hens\u014Djutsu part of the Shiranui-ryuu\
        \ Ninjutsu allows Mai to fully disguise herself as someone else or to completely\
        \ change her wardrobe in an instant. It has also allowed Mai to conjure illusions\
        \ such as a fake baby. * Pyrokinesis: Mai is able to naturally generate flames\
        \ from her body, these flames can be used as an extended fire wave that comes\
        \ out after Mai's techniques, make a large explosion or pillar of flames to\
        \ hit an opponent nearby, set her Steel Fans on fire in order to increase\
        \ the damage they deal to an opponent or to envelope Mai herself in flames\
        \ to enhance the damage her physical strikes deal and to make it so an opponent\
        \ can't touch her without getting burned. * Lightning Manipulation: Although\
        \ rare, Mai has shown the ability to conjure lightning from the sky to strike\
        \ the area around her. * MAX Mode: MAX Mode is a power-up all fighters can\
        \ access. In exchange for their Super Meter depleting quickly over time, the\
        \ fighter gets enhanced strength and durability for a limited amount of time\
