- id: claim-powers-and-abilities-5c7da603
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Acrobatics (Nimbly evaded Team AvatarATLA\
    \ Book Three: Fire - The Day of Black Sun, Part 2: The Eclipse), Expert Martial\
    \ Artist and Combatant (Can outfight Suki in close combat.ATLA Book Two: Earth\
