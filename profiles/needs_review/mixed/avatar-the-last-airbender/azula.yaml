      value: "Superhuman Physical Characteristics, Martial Arts & Acrobatics (Azula\
        \ is highly skilled in hand-to-hand combat and acrobatics, able to evade and\
        \ counter opponents like Zuko and Suki without bending while using precise\
        \ technique to redirect attacks and disarm them. Her agility is exceptional,\
        \ allowing her to run on walls, perform mid-air flips, and consistently dodge\
        \ attacks from both Avatar Aang and Toph Beifong, with Aang even noting she\
        \ was too fast to hit, and combined with her weapon use and strength (such\
        \ as holding a full planche), this makes her a dangerous fighter even without\
        \ bending.), Genius intelligence & Social Influencing (Azula\u2019s intelligence\
        \ is as lethal as her bending, defined by strategy, manipulation, and rapid\
        \ adaptation. Highly educated in military history from childhood, she could\
        \ recall Sozin\u2019s tactics and apply them to modern warfare. Her strategic\
        \ skill is proven by her trapping Zuko and Iroh, tracking the Avatar, and\
        \ instantly mimicking Aang\u2019s wind kick as a firebending move. Her peak\
        \ achievement was the Ba Sing Se coup, where she stole the Kyoshi Warriors'\
        \ identities, infiltrated the palace, and manipulated the Dai Li to seize\
        \ the city. During the Day of Black Sun, she successfully stalled Team Avatar\
        \ until the eclipse ended, neutralizing their invasion. A master liar, she\
        \ even deceived Toph\u2019s seismic sense and could accurately read others'\
        \ motives. Even during her mental breakdown, her tactical instincts allowed\
        \ her to exploit Zuko\u2019s lightning redirection by targeting Katara. Practically,\
        \ she used lightning to clear pests and utilized her knowledge of chi-blocking\
