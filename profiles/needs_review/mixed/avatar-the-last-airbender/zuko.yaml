    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics, Martial Arts & Acrobatics (Zuko\
        \ was a highly skilled martial artist and swordsman even without relying on\
        \ firebending, trained in dual broadswords and close-quarters combat from\
        \ a young age. He frequently combined swordsmanship with firebending in combat,\
        \ using precise movements and agility to pressure opponents, and was skilled\
        \ enough to fight evenly against elite fighters like Azula and multiple enemies\
        \ at once. His physical abilities were also exceptional, showing high agility\
        \ through wall-running, flips, rapid evasive movements, and acrobatic leaps\
        \ during battles, while his endurance and toughness allowed him to continue\
        \ fighting through heavy injuries and exhaustion.), Weapon Mastery (Master\
        \ of his dao blades that he usually wears around with himself, being trained\
        \ by Master Piandao, who's a member of the white lotus and the greatest swordsman\
        \ of his time), Social Influencing (As a leader, Zuko also displayed charisma\
        \ and good public speaking. His speech to redeem the name of the Fire Nation\
        \ at his coronation was warmly embraced, not only by his own people but by\
        \ people of the other nations as well. Despite a very tumultuous start, Zuko\
        \ eventually came to be regarded as an excellent, benevolent Fire Lord, with\
        \ his actions in helping create Republic City being recognized for many years.),\
        \ Stealth Mastery (Snuck up to multiple heavily guarded places as the blue\
        \ spirit, helped Katara snuck up to her mother's killer), Firebending & Explosion\
        \ Manipulation (Zuko\u2019s firebending evolved massively throughout Avatar:\
        \ The Last Airbender, progressing from a talented but emotionally unstable\
        \ fighter into one of the strongest and most refined firebenders of his era.\
        \ Early on, he struggled against Azula, but after traveling the Earth Kingdom\
        \ and training under Iroh, his techniques became far more precise and efficient,\
        \ allowing him to create concentrated blasts with two fingers, charge attacks\
        \ into massive explosions of fire, form fire whips capable of smashing crystal\
        \ pillars, and combine firebending with swordsmanship. After learning the\
        \ ancient Sun Warrior art \u201CThe Dancing Dragon\u201D alongside Avatar\
        \ Aang, Zuko abandoned rage as his source of power and developed a much more\
        \ fluid, balanced style based on fire as life and energy rather than destruction,\
        \ which drastically improved his control and combat ability. This growth became\
        \ especially clear in his later fights with Azula, where he could evenly match\
        \ or overpower her attacks, block her blue flames directly, create enormous\
        \ charged blasts, propel himself through the air with jets of fire, and even\
        \ generate a fire tornado during their Agni Kai under Sozin\u2019s Comet.\
        \ Zuko also mastered lightning redirection after failing to generate lightning\
        \ himself due to inner turmoil, using the technique to absorb lightning through\
        \ one arm, guide it safely through his body, and release it through the other,\
        \ successfully redirecting attacks from both Fire Lord Ozai and Azula. After\
        \ becoming Fire Lord, his firebending remained extremely powerful and controlled,\
        \ with feats such as melting metal chains instantly, overwhelming groups of\
        \ soldiers alone, generating dragon fire with green and purple flames, and\
        \ still remaining a capable fighter even in old age.), Chi Manipulation (Bending\
        \ works by manipulating your own chi), Lightning Redirection (Zuko was taught\
        \ by Iroh to redirect lightning shot at him. Although he struggled at first,\
        \ he eventually mastered the technique and used it several times. The technique\
        \ works by catching the incoming lightning with one hand, channeling it safely\
        \ through the body\u2019s internal energy pathway [passing through the stomach\
        \ area], and then releasing it out of the other hand), Rainbow Fire (Zuko\
        \ is the first human bender in history to bend rainbow fire of the dragons,\
        \ and created a vortex out of it), Weapon Creation (He could create daggers\
        \ out of fire, whips and should be superior to a guy who created a dragon\
        \ made of fire), Forcefield Creation (Could shield himself from an explosion\
        \ with fire), Jet Propulsion (Zuko used fire propulsion for semi-flight),\
        \ Heat Manipulation (Firebenders can manipulate heat without necessarly bending\
        \ fire, he used that technique twice to not feel cold of the blizzard), Breath\
        \ Attack (Can firebend with mouth), Attack Reflection (Can reflect fire attacks\
        \ back), Non-Physical Interaction (Bending can intterract with spirits)"
