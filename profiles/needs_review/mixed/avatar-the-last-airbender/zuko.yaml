- id: claim-weaknesses-c3c053aa
  section: weaknesses
  axis: weakness
  text: 'A solar eclipse disables Firebending, Sozin''s Comet only passes by once
    per every 100 years. Hot-headed and often lets his temper get the best of him
    (No longer a weakness after he joined Aang and his Gang). Notable Attacks/Techniques:
    Firebending: Firebending is one of the four main elements, it is only element
    which produces the element. With Firebending, Zuko can use a range of different
    techniques. *Lightning Redirection: Zuko redirects lightning by channeling it
    from the points of his fingers out the next. This ability is derived from Iroh''s
    studies on the water tribe. *Dragonfire: After becoming Fire Lord, Zuko learned
    how to generate multicolored flames similar to the fire that the dragons Ran and
    Shaw created around him and Aang. ==Gallery== Fire Lord Zuko.png|Zuko, crowned
    Fire Lord at the end of Book 3: Fire Lord Zuko.png|Zuko, as he appears in The
