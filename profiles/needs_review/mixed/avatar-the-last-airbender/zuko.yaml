    - field: powers_and_abilities
      value: "Base= * Superhuman Characteristics and Physiology * Immortality (Type\
        \ 4; The Avatar Cycle is a process where, upon the Avatar's death, Raava is\
        \ reborn into another human the instant she leaves the body. Reincarnation\
        \ follows a specific order: Fire, Air, Water, and Earth. This means that when\
        \ Aang died, he was reborn as a Water Avatar (Korra). However, if an Avatar\
        \ is killed while in the Avatar State, the cycle is broken and ceases to exist.\
        \ Type 9; Through meditation he can enter the spirit world, where he cant\
        \ be seen or interracted with from mortal plane, but he can't bend there)\
        \ * Acrobatics (Even without bending, Aang was exceptionally agile, using\
        \ acrobatic movements to evade attacks rather than striking back. This was\
        \ best seen in his fight against Hide and later against firebending soldiers\
        \ in Yu Dao, where he won simply by outmaneuvering his opponents. His style,\
        \ rooted in the pacifist philosophy of the Air Nomads, mirrors the martial\
        \ art Baguazhang, which focuses on circular footwork and harmony over destruction)\
        \ * Gliding Proficency (Aang could use his glider staff with great skill as\
        \ well, using it as a method of transport and sometimes for attack, defense,\
        \ or bending.) * Non-Physical Interaction (Can interract with Spirits, Abstracity\
        \ and Concepts) * Astral Projection (Through meditation he can enter the spirit\
        \ world, where he cant be seen or interracted with from mortal plane, but\
        \ he can't bend there) * Bending (As the Avatar, can bend all four elements\
        \ with impressive skill in less than a year. Although he did not fully master\
        \ every element, he became the first known Avatar to use lightning redirection\
        \ and seismic sense. While most Avatars learn of their identity at sixteen,\
        \ Aang became a fully realized Avatar at the biological age of twelve (Only\
        \ in terms of mastering the avatar state, he hasn't mastered all the elements),\
        \ making him the youngest to do so (though chronologically the oldest at 112\
        \ years) ** Enhanced Senses & Chi Manipulation (Using his chakra with the\
        \ roots around him, Aang eventually became deeply connected to other individuals\
        \ and located them. He used this ability to find Appa and Momo in the Foggy\
        \ Swamp. Chi is the internal life energy present in all living beings that\
        \ serves as the fundamental fuel for bending, requiring a bender to channel\
        \ this energy through pathways in their body and extend it outward to manipulate\
        \ the elements; however, this flow can be interrupted by emotional blockages\
        \ or physical strikes to pressure points, a technique known as chi blocking.)\
        \ ** AIrbending (By age twelve, Aang became the youngest airbending master\
        \ in history (later getting that title taken by his graunddaughter - Jinora)\
        \ by mastering thirty-five tiers of the art and inventing the \"air scooter\"\
        \ technique. Though he eventually learned all four elements, air remained\
        \ his signature style, allowing him to create powerful tornadoes and deflect\
        \ heavy objects with ease. Despite his immense power\u2014which was magnified\
        \ in the Avatar State to the point of eroding rock\u2014his pacifist nature\
        \ led him to use airbending primarily for defense, evasion, and mobility.\
        \ Over time, his skills evolved significantly, and as an adult, he could maintain\
        \ massive air scooters for high-speed travel while standing upright. Aang\
        \ also ensured the survival of his culture by passing his complete knowledge\
        \ and techniques down to his son, Tenzin.) *** Semi-Flight (Aang utilized\
        \ a specialized glider-staff to harness air currents, allowing him to achieve\
        \ sustained flight and perform complex aerial maneuvers. While he required\
        \ this tool to stay aloft, his expertise enabled him to dodge attacks mid-air\
        \ and travel vast distances by precisely manipulating the wind beneath his\
        \ wings.) *** Superspeed, Surface Scaling & Water Walking (Aang can use his\
        \ airbending to make him as fast as the wind, allowing him to run on walls\
        \ and water) *** BFR (Can use it to yeet people miles away without having\
        \ to deal with them) *** Air Scooter (Air scooter is a technique he created,\
        \ that allows you to create a sphere of air, which he can use to quick travel,\
        \ and scale walls) *** Forcefield Creation (Could block an explosion) ***\
        \ Breath Attack (Can airbend from his mouth, can cause powerful sneezes) ***\
        \ Air Absorption (Better than Zaheer who can absorb air from people to suffocate\
        \ them, tho that absoluely out of character for him as an extreme pacifist)\
        \ *** Air Spout (Can use air vortxes for semi flight for himself or others)\
        \ *** Object Attacks (Can propulse stuff trough air vortexes) *** Shockwave\
        \ Creation *** Enahnced Senses (Can detect danger through airflow) **Waterbending\
        \ (Although Aang initially showed greater natural talent in waterbending than\
        \ Katara, his lack of focus allowed her to surpass him and become a master\
        \ under Pakku, later serving as his teacher, early in training Aang demonstrated\
        \ prodigious skill such as creating a massive wave on his first attempt, yet\
        \ despite his capability waterbending was among his least used elements in"
