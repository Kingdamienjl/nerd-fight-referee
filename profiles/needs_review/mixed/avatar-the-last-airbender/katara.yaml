        cloud of freezing mist. *Ice Shield: Katara is able to freeze water in front
        of them, creating a shield of ice. *Ice Spear: The ice spear is a waterbending
        move that involves freezing a stream of water into a spike and firing it at
        the intended target. This move was used by Katara when she was about to strike
        down Yon Rha. *Water Cloak: Katara can use water as a form of armor with tentacle-like
        arms. The bender can use these arms to grab objects or enemies, whip enemies,
        blast enemies with water, and freeze them. If a waterbender has less water
        available, he or she can simply form the arms instead of the entire cloak.
        *Water Wall/Water Shield: Katara can mold water into a variety of shapes and
        can be used to deflect an attack, trap opponents in a viscous body, reshaped
        and propelled at attackers before they can recover, or solidified into a shield
        of ice. This diversity and ability to swiftly change to suit the situation
        is what makes the waterbender''s defense so adaptable. Although usually protective,
        the shield needs some type of compression or else it will not be effective.
        *Water Whip: The water whip is a commonly used move that involves creating
        a lashing tendril of water to swipe at an opponent. The shape, size, and length
        are all determined by a waterbender''s control, and more powerful benders
        can create larger whips, or ones of greater finesse. The whip can be sharpened
        into a blade that can slice through metal with relative ease. *Wave: By moving
        a large mass of water without separating it from its original source, Katara
        can create waves of nearly any size. She can do this by using an upward movement
        that raises the source, which they subsequently send away in their desired
        direction. This can be used to sweep opponents away or even as a form of transport,
        with the bender surfing on the crest of the wave. This same process can be
        used to propel waterborne crafts. *Bubble: Katara is able to cross large bodies
        of water by creating a bubble around herself and their fellow travelers, maintaining
        a supply of air for their journey. *Ice Dagger: Much like ice claws, ice daggers
        form on Katara''s fingers and shoot at high speeds away from him or her. Katara
        used these against Master Pakku. *Ice Dome: A highly advanced technique, as
        demonstrated by Katara while fighting against Zuko in the Spirit Oasis, a
        waterbender may surround a foe in a sphere of water and freeze it, trapping
        their opponent inside. *Ice Prison: This technique covers an opponent in a
        prison made of ice. By finely controlling the position of the person within,
        this technique can restrict the motions of an opponent''s hands, thus rendering
        them powerless. Katara utilized this move to incapacitate Azula during Sozin''s
        Comet. *Ice Ramp: Katara can manipulate ice as a means of short transportation
        for themselves or others. *Maelstrom: In a large body of water, a waterbender
        can create a gigantic whirlpool. This technique was executed by Aang and Katara
        while fighting the serpent. *Multiple Water Whips: An advanced waterbending
