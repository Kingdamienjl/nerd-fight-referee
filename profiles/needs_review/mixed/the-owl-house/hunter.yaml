      confidence: 0.75
    - field: intelligence
      value: At least Genius (Having accumulated massive amounts of Insight throughout
        their journey, The Hunter is a veritable genius intelligence-wise, obtaining
        wisdom about reality and the Eldritch Truth that the Choir, Byrgenwerth scholars,
        The Healing Church, and the School of Mensis combined were never able to achieve
        without going collectively mad, devolving into beasts, mutating into nightmarish
        abominations, or becoming brain dead. Their level of Insight is such that
        by the end of their journey their mind has reached the point of ascending
        to a higher plane of thought and transcending the human mind entirely, becoming
        that of a Great One. In addition they demonstrate a high degree of knowledge
        regarding the various tools of the Workshop, including being able to conduct
        numerous ancient chalice rituals, extract arcane essence from artifacts, and
        repair and upgrade all of their highly complex trick weapons despite having
        no prior knowledge on how to do any of these things) Gifted (The Hunter is
        a highly skilled and experienced combatant, able to wield a wide variety of
        weapons, each with their own unique combat styles, to their maximum efficiency
        even after just obtaining them, including weapons that are traditionally considered
        too awkward or cumbersome for most Hunters to use such as the Gatling Gun
        and Church Cannon, and bizarre nontraditional weapons, such as the Logarius
        Wheel, Amygdalan Arm, and Kos Parasite. They can equally wield weapons that
        statistically require a high degree of skill to wield properly such as the
        Rakuyo and Simon's Bowblade, as well as utilize a wide variety of arcane Hunter
        Tools despite having no prior arcane knowledge. The Hunter is even capable
        of fighting unhindered when their vision is completely obstructed by headpieces
        such as the Blindfold Cap, Gold Ardeo, Enlarged Head, and Harrowed Hood, and
        are skilled enough with the weapons in their arsenal that they can even use
        the transformations of their weapons as lethal forms of attack. Throughout
        their journey The Hunter displays the capacity to outmatch numerous veteran
        Hunters including Simon, Seeker of Secrets, Brador, the Church Assassin, Valtr,
        Master of the League, Retired Hunter Djura, Eileen the Crow, Alfred, Hunter
        of Vilebloods, Henryk, the Old Hunter, Bloody Crow of Cainhurst, and Lady
        Maria of the Astral Clocktower, all of whom are recognized as highly skilled
        fighters in their own right with decades of combat experience under their
        belt. The Hunter is skilled to the point of being able to best Gehrman, the
        First Hunter, whose skill in combat and fighting style is the basis for the
        fighting styles used by all Hunters, in single combat)
      source_id: mediawiki-3823581
