      confidence: 0.75
    - field: stamina
      value: Superhuman (Able to take on hordes upon hordes of enemies with little
        to no rest in-between without any signs of exhaustion. Constantly shrugs off
        being stabbed, slashed, crushed, thrown, bitten, shot, poisoned, electrocuted,
        burned, and impaled. Unfazed by injuries as severe as having their eyes gauged
        out, being impaled through the torso, having organs ripped out, and having
        their skull pierced. Can shrug off the effects of Frenzy, which causes those
        affected to have their blood violently erupt out of multiple points on their
        body in solidified spears of Frenzied Coldblood. Can outlast characters such
        as the Amygdala, who can rip its own arms off and use them as weapons and
        not even flinch, and Lady Maria, who can stab herself through the torso twice,
        letting out vast quantities of her own blood in the process, and continue
        fighting as though uninjured. The Hunter also possesses numerous items and
        runes that significantly bolster their stamina)
      source_id: mediawiki-3823581
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: 'Whirligig Saw, Hunter Axe: One of the trick weapons of the workshop,
        commonly used on the hunt. Retains the qualities of an axe, but offers a wider
        palette of attacks by transforming. Boasts a heavy blunt attack, leading to
        high rally potential., Kirkhammer: A trick weapon typically used by Healing
        Church hunters. On the one side, an easily handled silver sword, on the other,
        a giant obtuse stone weapon, characterized by a blunt strike and extreme force
        of impact., Ludwig''s Holy Blade: A trick weapon typically used by Healing
        Church hunters. It is said that the silver sword was employed by Ludwig, the
        first hunter of the church. When transformed, it combines with its sheath
        to form a greatsword., Rifle Spear: A trick weapon crafted by the workshop
        heretics, the Powder Kegs. A prototype weapon serving as a simple firearm
        and spear, possibly created in imitation of a lost Cainhurst weapon. Lacks
        any notable functions, saving that it is the only trick weapon with an attached
        gun., Saw Cleaver: One of the trick weapons of the workshop, commonly used
        in the hunting business. This saw, effective at drawing the blood of beasts,
        transforms into a long cleaver that makes use of centrifugal force. The saw,
        with its set of blood-letting teeth, has become a symbol of the hunt, and
        only grows in effectiveness the more grotesquely transformed the beast., Saw
        Spear: One of the trick weapons of the workshop, commonly used by those who
        dedicate themselves to the hunt. This saw, effective at drawing the blood
        of beasts, transforms into a medium-range spear. The saw, with its set of
        blood-letting teeth, has become a symbol of the hunt, and only grows in effectiveness
        the more grotesquely transformed the beast., Stake Driver: A trick weapon
        fashioned by the workshop heretics, the Powder Kegs. Favored by the retired
        hunter Djura. The stake driver, with its queerly complex design, violently
        drives thick stakes into the flesh of foes. The stake driver allows for high-damage
        critical attacks, but is difficult to use and leaves its wielder wide open,
        but none of this should bother a mere Powder Keg., Threaded Cane: One of the
        trick weapons of the workshop, commonly used by hunters on their duties. Sufficiently
        deadly as a rigid bladed cane, but also serves as a whip when its blade is
        split into many. Concealing the weapon inside the cane and flogging the beasts
        with the whip is partly an act of ceremony, an attempt to demonstrate to oneself
        that the bloodlust of the hunt will never encroach upon their soul., Tonitrus:
        A unique trick weapon contrived by Archibald, the infamous eccentric of the
        Healing Church workshop. Striking this peculiar iron morning star flail like
        a match generates the same blue sparks that blanket a darkbeast., Beast Claw:
        A beastly weapon originally wielded by Irreverent Izzy. Crafted by chiseling
        the long bones of an undead darkbeast and fastening them to the weapon, the
        bones are still alive, grant its wielder a spurt of beastly power. As flesh
        is flayed and blood is sprayed, the beast within awakens, the wielder of this
        weapon surges with both strength and feverish reverie., Beast Cutter: A trick
        weapon used by Old Hunters. This thick iron cleaver slices through the toughest
        of beast, allowing one to lash it in the fashion of a heavy whip. This crude
        weapon relies on brute force and is regrettably inelegant, suggesting that
        the hunts of the earliest hunters made for horrific affairs, painted in sanguine
        black and reds., Beasthunter Saif: A trick weapon used by the old hunters.
        A second blade is found inside the curve of the main one. In its initial form
        the saif can be wielded like a long curved sword, its blade is contracted
        allowing for quick, repeated stabs. Although this trick weapon allows for
        adaptive combat, it was later replaced by saws and similar weapons that were
        more effective at disposing of beasts., Bloodletter: The demented hunter weapon
        brandished by Brador, the Healing Church assassin. The Bloodletter assumes
        its true and terrifying form after it draws upon blood from the inner reaches
        of one''s body and soul. This is the o'
      source_id: mediawiki-3823581
