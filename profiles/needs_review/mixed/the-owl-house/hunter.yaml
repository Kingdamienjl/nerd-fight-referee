    - field: intelligence
      value: 'Above Average (Has been described as a child prodigy among the members
        of the Emperor''s Coven. The Emperor''s Coven is a coven that only excepts
        the most skilled and prestigious witches. Once they enter the Emperor''s coven,
        witches are they subjected to intense training for their magic skills. Matched
        Amity in combat, despite using a new staff and being very tired. Despite his
        young age, is easily able to contend with adult witches) Standard Tactics:
        Hunter typically battles by repeatedly using his Pseudo Teleportation to avoid
        attacks and get close to targets. Once he gets close, he then attempts to
        strike the target with his staff. He also occasionally uses ranged magic attacks.'
