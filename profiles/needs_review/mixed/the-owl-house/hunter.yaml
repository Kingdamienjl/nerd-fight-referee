    - field: powers_and_abilities
      value: Carries the Sigma Virus within him, Power Mimicry (Zero, like most Mega
        Man/Rockman characters, copies the abilities of those he defeats. Though,
        Zero differs in the fact that some of the powers he gains are techniques that
        he can use with his Z-Saber. However, there are occasions where Zero gains
        abilities like X would.), Superhuman Physical Characteristics, Martial Arts
        (In X8, Zero can use the Kaiser Knuckle, which allows him to perform hand-to-hand
        combat. Most notably, he uses several techniques from Street Fighter in place
        of his usual Z-Saber techniques), Time Stop (Dark Hold is a time stop.), Elemental
        Manipulation (Via his many techniques he learns from defeating Mavericks),
        Fire Manipulation, Ice Manipulation, Absolute Zero, Inorganic Physiology,
        Immortality Types 1, (Zero is a robot and cannot die of natural causes), Limited
        Flight (Can air-dash. As Awakened Zero, this limitation very likely does not
        apply, as he is shown to be hovering in cutscenes and before the Awakened
        Zero boss fight in X5), Teleportation (Not applicable in combat. Zero, and
        most Mega Man characters, teleport to the stages or areas that they will be
        going through), Danmaku (Via Rakuhouha, Messenkou/C-Flasher, and Rekkoha),
        Dimensional Travel (Can teleport in and out of Cyberspace), Non-Physical Interaction,
        Soul Manipulation, and Information Manipulation (Can collect Nightmare Souls
        upon defeating Nightmare viruses. DNA souls are the DNA Data of reploids manifested
        as a soul, which are likened to that of a human soul), Accelerated Development
        (Keeps up with X, who has the capability to become stronger through combat),
        Surface Scaling (Can slowly slide down walls as opposed to falling down, certain
        parts allow him to fall even slower), One Hit Kill with Genmu Zero, in full.
      source_id: character-stats-profiles-hunter-mixed
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: 'Low Multiverse level (Scales to most relevant characters in the series,
        such as X and Sigma. The latter being not only being superior to but also
        being able to replicate a feat performed by Techno, who overwrote all of the
        data in the Mother Computer which contains several Cyberspaces based on levels
        present in X1 and X2. Cyberspaces are also compared to Deep Logs, which are
        also referred to as universes. Zero shares an energy signature with the Zero
        Virus, which was so strong that it merged Zero Space into the real world.
        Zero Space is comprised of four different dimensions (representing each Zero
        Space stage). Not only does Zero actively benefit from the Zero Virus, but
        at least as Awakened Zero, Alia states that his energy is far stronger than
        that of Zero Space itself.)Statistics Note: At minimum 4-27 universes, likely
        far higher., possibly Low Complex Multiverse level (Scales to the Sigma Virus,
        which is an evolved version of the Robot Destroy Program that was originally
        sealed away with Zero, which infested the entirety of the Deep Log, which
        caused data from the totality of the Mega Man franchise to become mixed up
        with one another. The Deep Log is depicted as being "3-D" in relation to the
        "2-D" universes representing the games that the Deep Log contains)'
