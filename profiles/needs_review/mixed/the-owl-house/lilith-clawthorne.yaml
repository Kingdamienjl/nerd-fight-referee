    - field: powers_and_abilities
      value: '* Superhuman Physical Characteristics *Acrobatics & Martial Arts (Lilith
        has shown to be gifted in fighting. Being good at close range and long range
        combat. Can easily and expertly use her own body like shifting the shape of
        her wings and natural body as weapons. Can use a combination of all her moves
        to trap her enemies in combos.) * Extrasensory Perception (Should be able
        to sense powerful beings like Pyron. Pyron released his energy pulse across
        the planet only for several lifeforms reacting to it.Darkstalkers Graphic
        File) * Enhanced Senses (Should be able to transverse to pit black areas.The
        Vampire/Darkstalkers Plot Guide Able to see Pyron, who is stated to not be
        visible to the naked eye.) *Soul Absorption (It is generally said that the
        succubus race absorbs the spirit of the opposite sex and uses it as their
        own energy source.) *Fragrance Manipulation & Mind Manipulation (Their body
        odor causes their blood vessels to dilate and causes a large amount of perspiration.
        If a man is confronted by a succubus, unless they have a very strong mind,
        they would instantly be under her spell.) *Dream Manipulation (Comparable
        to Morrigan, who can steal dreams.) *Petrification (Self-Inflicted; Should
        be comparable to Morrigan, who can turn herself into stone to resist Demitri''s
        powers.) * Death Manipulation (Should be comparable to Morrigan, who can turn
        people into skeletons with a kiss.Night Warriors Darkstalkers Revenge Succubus''
        blood and saliva has a powerful lustful effect. A human would instantly die
        the moment they come in contact with it.) * Animal Manipulation & Summoning
        (Summons bats to be able to fly with and use as attacks.) *Longevity (The
        succubus race lives about 400 years. Roughly ten years after they are born,
        they gain their adult appearance and keep this beautiful form until they die.
        Their beautiful appearance is kept intact even when they are old.) *Hair Manipulation
        (Comparable to Morrigan, who can use her hair to attack.) * Natural Weaponry
        (Her wings serves as bodily weaponry.) * Teleportation (Can teleport.Darkstalkers
        3) * Flight (Should be able to fly like Morrigan.) * Soul Manipulation (Darkstalkers
        can collect souls. Should be comparable to Morrigan, who can take away souls.)
        * Dimensional Storage (Can pull objects out of nowhere.) * Non-Physical Interaction
        (Souls, Spirits, & Energy; Lilith can hold souls. Most characters can interact
        with Pyron. Pyron is a shapeless spiritual being made up of pure energy. Can
        interact with Bishamon, who''s body is mostly made up of spirits to the point
        he didn''t even need a human form. Was described as a evil spirit.) * Aura,
        Madness Manipulation, & Corruption (Passive; To fight against these creatures,
        having a fit body, martial arts skills and fire arms are not enough. It impossible
        for a class C creature to kill an entire army of first class elite soldiers.
        A strong mind/spirit is needed to keep one self from losing their own sanity
        is needed. And a dark heart is needed so that they are not poisoned with the
        aura that the creatures give off.) * Cloth Manipulation (Can change her clothes
        instantly.) * Duplication (Can create clones of herself.) * Shapeshifting
        (Can shapeshift her own wings.) * Ice Manipulation, Fire Manipulation, & Electricity
        Manipulation (Can set the opponent on fire, electrified, and freeze them.)
        *Resistance to ** Aura, Madness Manipulation, & Corruption (Can resist these
        abilities from other Darkstalkers.) **Corrosion Inducement & Poison Manipulation
        (The main land within Makai is called "Matairiku/The demon land". The earth
        is the color of blood, a never ending pitch black deep fault, forests move
        with eerie movements, cave''s that are filled with poisonous miasma, poisonous
        marshes that would melt even the bones. Lilith should be relative to Morrigan
        who lived here.) **Absolute Zero, Heat Manipulation, & Fire Manipulation (The
        sea which lies to the east of Matairiku is called, "Daimakai/Great Sea of
        Evil". And the sea which lies to the west of Matairiku is called, "Daimasou/Great
        Ocean of Evil". The Daimakai is filled with flames at a temperature of 10,000
        degrees Celsius. The Daimasou is filled with ice at absolute zero. At the
        point where these sea meet lies a crack that is 200km wide. It is filled with
        constant storms and lightning. Several hundred trillion Makai creatures live
        in this world and each of them build up their own society and territories.
        A human would not even last a day in the harsh world of Makai.)'
