    - field: weaknesses
      value: 'Needs Jedah''s powers for some of her abilities. She may possesses the
        same weakness as Morrigan and being dependant on stimulation, her own or by
        absorbing the liquid produced by the brain of others while dreaming. She could
        die within two days if she does not feed or receive a stimulation. Sunlight
        gives her troubles. A strong mind/spirit can resist the madness-inducing effect
        of her aura and a dark heart can resist the corruption. A man with a very
        strong mind can resist the effects of her body odor. {| class="mw-collapsible
        mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
        | colspan="2" style="text-align: left; " |Notable Attacks/Techniques: |- |
        * Light Punches: Lilith will do weak punches at the enemy. She can do this
        standing, in the air, or crouching. She will use things like her wings on
        her head to attack. * Medium Punches: Lilith punches with more range and damage
        than her Light Punch attacks. Lilith shapeshift her wings into 2 blades. Striking
        at the enemy while in the air. Lilith hunches over and shifting her wings
        into 2 sharp blades while crouching. * Heavy Punches: Lilith uses her wings
        and shifts them into multiple long range spikes to strike at the enemy. Lilith
        uses her wings as spinning blades while in the air. Lilith while crouching
        will spin around while shifting her wings into a long range blade. * Light
        Kicks: Lilith does a weak kick to the enemy. Lilith uses her knee while in
        the air to hit the enemy. Lilith while crouching will kick the enemy. File:LilithStaningPunch.gif
        File:JumpingLightPunch.gif File:Crocuhinglightpun.gif File:StanindgMediumPunch.gif
        File:LilithMediumAir.gif File:CrochingMediumPunch.gif File:StandingHeavyPunch.gif
        File:JumpingHeavyPunch.gif File:CrocuchHeavyPunch.gif File:StandLightKick.gif
        File:JumpLightKick.gif File:CrouchLightKick.gif File:StandMediumKick.gif File:JumpMediumKick.gif
        File:CrouchMediumKick.gif File:StandHeavyKick.gif File:JumpHravyKick.gif File:CrouchHeavyKick.gif
        File:SoulFlash.gif File:Lilith-shadowblade1.gif File:Lilith-spinattack.gif
        File:Lilith-darkstalkers-bow-and-arrow-special-move-jedah.gif File:Lilith-darkstalkers3-throw-jedah.gif
        File:Lilith-fly.gif File:Lilith-vs-morrigan-darkstalkers3.gif File:Lilithshowtime.gif
        * Medium Kicks: Same as Light Kicks except with more force and range. * Heavy
        Kicks Lilith will use her and turn into blades. She will then kick the enemy
        using these blades. * Soul Flash: Shoots out a green bird like projectile
        at the enemy. Can alter the speed of the projectile and can be done in the
        air. * Shining Blade: Lilith jumps up at the enemy and turns her wings into
        a blade. Striking them in a uppercut fashion. * Merry Turn: Lilith spins forward
        while her wings are blades. * Mystic Arrow: Lilith grabs the enemy and shoots
        them away by turning her wings into 2 arms and a bow. * Toe Pierce: Lilith
        basically stomps on the enemy. * Throws: If Lilith grabs the enemy on ground,
        she will send them away by swinging her bladed wings at them. If done in the
        air, she will grab them mid-air and do a flip and throw them o the ground.
        * Splendor Love: Lilith summons a bunch of bats while flying. Does damage
