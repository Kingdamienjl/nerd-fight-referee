    - field: attack_potency
      value: Multi-City Block level+ (Physically comparable to Amity, Willow, and
        Gus. Comparable to her durability), likely Large Mountain level with Magic
        (While considerably weaker, she is still capable of contending with the likes
        of Lilith while she is holding back. Fought on par with a casual Belos and
        damaged his mask, making her superior to the Greenthumb Gauntlet's creation
        magic, as well as Principal Bump, who should scale to this. Should be superior
        to King and Hooty) | At least Multi-City Block level+ (Much more physically
        powerful than before. Is able to easily damage Blight Industries Abominations
        with the strikes of her ice-glyph batons, which are typically this powerful.
        Comparable to Amity and Warden Wrath, as well as the contestants of the Bonesborough
        Brawl), Large Mountain level with magic (Much stronger than before, having
        trained for a considerable amount of time even at the beginning of the season.
        Created an ice glacier of this size as well as many other structures of similar
        magnitude, which require this much energy. Can contend with Titan Trappers,
        making her superior to King, who destroyed the Titan Trapper portal in a shockwave
        which split clouds and subsequently caused the entire island to collapse.
        Briefly fought off a notably more powerful Belos, who was impressed at her
        quickly increasing intuition and skill in Glyphs which took him years to figure
        out, despite being "decades away from defeating him". Can fight off Harpy
        Eda and easily defeated Kikimora alongside Amity, who should scale to her
        Abomaton's fire blast, which was this powerful. Took on and defeated an Abomaton
        of likely equal power earlier in the season alongside Amity as well), Island
        level with Glyph Combos (At least 4x as powerful as normal magic, based off
        of Lilith's glyph and Eda's "superglyph", which notably combine the power
        of four different Glyph attacks simultaneously) | Town level (Comparable to
        Hunter and Vee. Briefly was able to fend off a Belos-possessed Hunter whilst
        explicitly holding back), Country level with Stringbean (Created a blast visible
        from a considerable distance just by awakening her Palismen, and immediately
        did this by accident afterwards. Comparable to Harpy Eda and King at the height
        of their magic, who could assist her whilst she had been given the powers
        of the Boiling Isles titan by fending off a Belos-possessed Titan from "cleansing"
        the Boiling Isles. Managed to harm the Collector with a bite from Stringbean,
        despite being overall far weaker), up to Small Planet level with Glyph Combos
        (Comparable to Harpy Eda and King) | At least Planet level (Possesses the
        full remainder of the Boiling Isles' Titan's magical powers. The Titan was
        likely responsible for illuminating distant stars to form the Ice Glyph in
        the night sky for Luz to see, which would require this much energy, and would
        already be this powerful just by virtue of it's sheer size. Demonstrably more
        powerful than Titan Belos, and was able to rip him off of the Titan's heart.
        Immediately created a storm cloud that covered the entire Boiling Isles with
        boiling rain to kill Belos once and for all), possibly Galaxy level (According
        to the Collector, fully grown titans are "stronger than anybody", which would
        include himself. The Collector's pocket reality bedroom, which contains a
        starry night sky and nebulae, is stated to be the size of a Galaxy, and was
        able to effortlessly manipulate constellations to tell the story of his past
        with the Archivists)
      source_id: character-stats-profiles-lilith-clawthorne-the-owl-house
