- id: claim-powers-and-abilities-8ed0fbba
  section: abilities
  axis: hax
  text: 'Base Luz= Superhuman Physical Characteristics, Social Influencing (Caused
    the prisioners to turn against the guardOwl House; S1, E1), Weapon Mastery (Used
    a toy sword as if it was realOwl House; S1, E2, wielded a flail while fighting
    GrometheusOwl House; S1, E16), Limited Broadway Force (Through montages). With
    Glyphs Magic: Light Manipulation (Light glyphOwl House; S1, E4), Ice Manipulation
    (Ice glyphOwl House; S1, E12), Plant Manipulation (Plant glyphOwl House; S1, E16),
    Fire Manipulation (Fire glyphOwl House; S1, E17), Invisibility (Invisibility GlyphOwl
    House; S2, E3), Air Manipulation, Water Manipulation, Petrification, Summoning
    (Wind glyph, water fountain glyph, petrefication glyph, monster arm glyphOwl House;
    S2, E15), Limited Flight (With safety hover glyphOwl House; S2, E14) and Teleportation
    (As shown hereOwl House; S3 E2), Weapon Creation (Created a bat with ice glyphOwl
    House; S2, E14), Explosion Manipulation (Created an explosion with fire glyphOwl
    House; S2, E16), Purification (Type 2; Cancelled the Collector''s mind manipulation).
    With palisman Energy Projection (As shown here), Flight (As shown here), Weapon
    Control (Able to control her staff), Animal Manipulation and Automatic Translation
    (Able to control, talk and understand her Palisman). With Witch''s Wool: Resistance
    to Magic (As shown hereOwl House; S1 E18) |-|Titan Luz= Same as before, plus:
    Forcefield Creation (Can create shieldsOwl House; S3, E3), Purification (Type
    1; Can purify what was corrupted by BelosOwl House; S3, E3), Self-Sustenance (Type
    1; Can breathe in spaceOwl House; S3, E3), Bodily Weaponry (Has claws on her hands
    and feets), Sound Manipulation (Used Titans''s wail with King), possibly Weather
    Manipulation and Corrosion Inducement (May have started the rain that dissolves
    Belos'' body)'
