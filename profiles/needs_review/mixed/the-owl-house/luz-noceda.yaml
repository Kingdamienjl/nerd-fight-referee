- id: claim-weaknesses-2b610161
  section: weaknesses
  axis: weakness
  text: "Glyphs don't work in areas with no magic. Unwilling to use petrification\
    \ magic under normal circumstances | The power given by the Titan is only temporary\
    \ Notable Attacks/Techniques: *Glyphs: Through various glyph symbols drawn on\
    \ sheets of paper, Luz can activate elemental spells, such as turning papers into\
    \ light orbs, erecting pillars of ice or plant matter, and setting objects on\
    \ fire. These spells change their effects to match the needs of the user. She\
    \ can combines these glyph symbols to generate new spells. |-|Standard Glyphs=\
    \ *Light Spell: This spells allows Luz to turn small objects such as pieces of\
    \ paper, and leaves into small balls of light. These balls can be easily moved\
    \ and are typically used to illuminate dark areas. These can also be used offensively\
    \ to temporarily blind opponents. The amount of light generated depends on the\
    \ glyph's size. *Ice Spell: This spells allows Luz to generate ice for a variety\
    \ of effects. She can create ice pillars, that are capable of launching herself\
    \ or others long distances through the air. These pillars are capable of blocking\
    \ projectile attacks. She can create icicles of varying sizes and even create\
    \ small weapons with them. The spell has also shown the ability incapacitate opponents\
    \ through freezing them. *Plant Spell: This spells allows Luz to create vines.\
    \ These vines can be used to bind opponents. They can also be used as ranged method\
    \ of stealing objects. *Fire Spell: This spell allows Luz to generate fire. She\
    \ can use it to launch streams of fire, that can be used offensively or as a form\
    \ of propulsion. The Fire glyph can also be used to set things ablaze, and generate\
    \ fiery explosions. |-|Glyph Combinations= *Invisibility Spell: Upon activation,\
    \ this glyph makes Luz (and anyone/anything making physical contact with her)\
    \ invisible. The spell ends once the user breathes. *Mist Spell: When mixing the\
    \ fire and Ice glyph, she can generate a thick mist, that is capable of obscuring\
    \ her from the sight of others. The properties of the mist can be altered through\
    \ inserting different objects into it. For example, if sleeping nettles are inserted\
    \ into the spell circle, then the mist will induce sleep. *Safety Hover: While\
    \ airborne or falling, this spells allows Luz and (anyone touching her) to momentarily\
    \ float above the ground before making contact with it. Affectively, nullifying\
    \ any damage she would take from the fall. *Wind Spell: Creates a small tornado\
    \ that is capable of picking up leaves *Water Fountain: Creates a small fountain\
    \ of water. *Petrification Spell: This spell allows Luz to turn opponents into\
    \ stone. The petrified being is then brittle enough to break apart with a mere\
    \ touch. *Monster Hand: This spells summons a clawed monster hand made of goo.\
    \ The hand acts on it's own accord and Luz has no control over it. *Teleportation:\
    \ This spell allows for those who are standing on the glyph to be transported\
    \ to a location of the creator's choosing. ==Notable Matchups== Victories: Amity\
    \ Blight (The Owl House) Amity's Profile Losses: Marcy Wu (Amphibia) Marcy Wu's\
    \ Profile (Luz Noceda was in her base key and everything above 8-B is restricted.\
    \ Marcy Wu was in her base key and was 8-B. Speed was equalized) M\xF4nica (Turma\
    \ da M\xF4nica Jovem) (Turma da M\xF4nica) M\xF4nica's Profile (Speed was equalized,\
    \ luz had prior knowledge, optional equipment restricted, first keys were used,\
    \ starting distance was 30ft and out of sight, and the battle took place in the\
    \ mushroom kingdom from mario) Inconclusive: ==References== {{Scroll box|content={{reflist|2}}}}\
    \ {{discussions}} Category:Characters Category:The Owl House Category:Female Characters\
