- id: claim-weaknesses-2494a584
  section: weaknesses
  axis: weakness
  text: "His most defining trait by far is his narcissism. Belos has a holier than\
    \ thou mentality and is fully convinced that his genocidal crusade against witches\
    \ is a righteous task that would free humanity from evil. Belos\u2019s form is\
    \ melty and unstable, and he must consume Palismen in order for him to hold his\
    \ humanoid stature. Notable Attacks/Techniques: *Glyphs: Philip could draw and\
    \ create glyphs after learning it from his natural surroundings. He has also had\
    \ these glyphs etched on his skin and arms, apparently as his research in glyph\
    \ magic. However, this had malignant side effects on his body, resulting in his\
    \ arms pulsating and swelling whenever the glyphs try to activate, thus intensifying\
    \ the physical injuries he sustains. **Plant Glyph: By drawing the glyph, Philip\
    \ can grow plants. **Ice Glyph: By drawing the glyph, Philip can make ice. **Fire\
    \ Glyph: By drawing the glyph, Philip can make fire. **Light Glyph: By drawing\
    \ the glyph, Philip can create small orbs of light. **Teleportation: By etching\
    \ a tetrameric set of glyph combinations on the ground, Philip could transport\
    \ himself and anything standing on it to where he wished. ==Notable Matchups==\
    \ Victories: Losses: Inconclusive: ==References== {{Reflist}} {{Discussions}}\
    \ Category:Characters Category:The Owl House Category:Villains Category:Antagonists\
    \ Category:Emperors Category:Primary Antagonists Category:Leaders Category:Social\
    \ Influencers Category:Magic Users Category:Light Users Category:Ice Users Category:Plant\
    \ Users Category:Cartoon Characters Category:Fire Users Category:Teleportation\
    \ Users Category:Telepaths Category:Petrification Users Category:Shapeshifters\
    \ Category:Bodily Weaponry Users Category:Body Control Users Category:Earth Users\
    \ Category:Mind Users Category:Telekinesis Users Category:Summoners Category:Humans\
    \ Category:Evil Characters Category:Narcissists Category:Sociopaths Category:Dragons\
    \ Category:Fantasy Characters Category:Geniuses Category:Tyrants Category:Staff\
    \ Users Category:Witch Hunter"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-02abf368
  section: abilities
  axis: hax
  text: Philip Wittebane=Superhuman Physical Characteristics, Social Influencing,
    Magic, Light Manipulation, Ice Manipulation, Plant Manipulation, Fire Manipulation,
    Teleportation (Via glyphs) |-|Emperor Belos=Same as before to a greater extent,
    Body Control, Bodily Weaponry, Shapeshifting (Belos' unknown condition causes
    him to transform into sludge or a sludge-like appearance. Has shown control over
    his shapeshifting, however, and has used it to reshape his distended limbs into
    sharp blades and spikes), Artificial Magic (Does not perform basic spells like
    the spell circle and achieves magic through an apparatus, such as use of his mechanical
    staff or other devices. In spite of this, Belos is an adept in the practice, achieving
    a vast amount of skill, power, and knowledge with artificial magic that he is
    described as the most skilled and powerful Witch to ever live. Belos' magic seems
    unaffected by Luz's cape made of Witch's Wool supposedly capable of deflecting
    all magic), Telekinesis (Frequently uses telekinesis to move objects and people
    without touching them, signified by his gloves glowing red), Summoning (Belos
    is able to summon and command fleshy tendrils to bend and form claws. Summoned
    a massive worm-like creature during his fight with Luz), Teleportation (Shown
    to be capable of disappearing by melting into the floor to avoid attacks), Telepathy
    (Luz, Willow, and Gus heard his reprimanding voice when they were in the castle's
    artifact display), Earth Manipulation (Able to raise sharp spikes of rock up from
    the ground), Mind Manipulation (When Lilith presented her sister Eda in her cursed
    Owl Beast form, Belos hit Eda with some kind of spell from his staff which made
    Eda regain consciousness), Petrification (Turned one of the old Golden Guards
    into Stone and tried to do the same to Luz)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
