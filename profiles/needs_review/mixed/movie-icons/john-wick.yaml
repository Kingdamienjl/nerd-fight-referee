    - field: intelligence
      value: Gifted (John was a successful hitman and marine, immensely skilled with
        firearms and melee combat. As a professional assassin, John is highly proficient
        in casing out, devising, and performing killings. He is also quite spatially
        conscious in battle situations, making use of the environment, weapons held
        by dead enemies, and even pencils. He is also shown to be fluent in several
        languages, including English, Russian, Italian, Hebrew, Indonesian, and American
        Sign Language. He seems to have some degree of medical knowledge, including
        human anatomy and physiology, as well as basic first aid)
      source_id: vsbattles-john-wick-movie-icons
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'John is past his prime due to five years of retirement from the world
        of assassination. He is a very vindictive person and seems to have anger management
        issues. Mourns deeply for his wife and dog. Will do whatever it takes to accomplish
        his mission, even if it means breaking the rules and landing himself in tough
        situations. Has no regard for his health and will keep pushing through even
        when heavily wounded. Though his suit is impenetrable by most handgun bullets,
        they still can''t absorb the full kinetic energy, thus making bullet-blocking
        a rather painful experience unless he uses it as a shield. Feats: Show/Hide
        Hand-to-hand Combat * Killed three men with only a pencil. * Took out 2 Russian
        mafia gangsters with no gun. * Defeated Ms. Perkins, another lethal hit-woman
        in a fight after a shootout resulting in a stab wound and several broken bones.
        * Killed another trained hitman despite being wounded, hit by a car, and handcuffed.
        * Despite all the injuries sustained throughout the film, he was capable of
        killing the mafia godfather in a fight. Gun Feats * Was highly proficient
        with pistols, assault rifles, snipers, and shotguns (see the entire movie).
        * Was able to outshoot eleven men breaking into his house with near-perfect
        accuracy, including shooting a man behind a wall, calculating when and where
        people will jump from cover and mixes kung fu into the bunch. * Killed 24
        men guarding the son in a nightclub with scary precision and timing. Feats
        in this include overpowering two larger men, and reloading a pistol just in
        time to finish a kill, tackled a man to the ground, and managed to fend off
        attackers, twice. * Took out six armed men despite being completely out in
        the open in a church. * and then proceeded to defeat eight armed guards from
        behind an SUV. * Stealthily infiltrated a mafia safe house and managed to
        take out the guards and snipers using their own guns and murdered the Iosef.
        * Killed and ran over nine guards with a pistol while driving. Endurance *
        Walked away from being beaten with a baseball bat after waking up. * Continued
        to fight and walk after being shot twice (wearing a bulletproof vest), stabbed
        in the side and dropped off a balcony. * Defeated Perkins after being punched
        repeatedly in stab wound. * Was fully capable of killing after being hit by
        a car (not seen in this scene but see H2H feat for next scene). * Survived
        another car crash (see dock shootout). Accuracy/Reflexes * According to this
        infograph by George Hatzis, John Wick''s accuracy is an astounding 87%, only
        less than two dozen rounds fired are ever missed in the movie, and apparently,
        this is only rusty John Wick. * Wick was able to carefully predict and sense
        when enemies are approaching with near peak human reflexes, seen in the house,
        club, and church shootout especially. * Was able to stop a car on a dime in
        front of a dump truck. Notoriety/Fear * A chop shop owner refused to ''fix''
        Wick''s stolen car because he knew who it belongs to, risking his own life
        to get the thieves out too. * Struck fear into Russian godfather by the near
        mention of his name. * Godfather had high respect/fear with Wick, said that
        he was also responsible for their rise to power because of the number of bodies
        he buried in an impossible task for freedom. * Had mutual respect with veteran
        mafia gangster, the only mafioso he doesn''t kill in the film. * Police, or
        at least a police officer, turned a blind eye on Wick''s killings due to his
        status. * Was able to have Continental owner(?) provide intel despite it breaking
        the criminal underworld laws. * Name widely known in criminal underworld (see
        the film). * Threatened Godfather into telling where his son is. * Marcus,
        a veteran hitman, frequently helped out in life-saving situations with Wick
        out of mutual respect (see interrogation scene and Perkins fight scene for
        examples). * Not related to Wick but Marcus went out on his terms too. * Gave
        this chilling speech. ==Gallery== File:NegativeHauntingGrouse-size_restricted.gif
