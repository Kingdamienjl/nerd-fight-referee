      value: '* Mechanical Limitations: Despite all of RoboCop''s technological advances,
        he is still mostly a machine thus mechanical maintenance is essential requiring
        servicing and tune ups from time to time. * Organic Vulnerabilities: What
        few organic systems still comprise Murphy''s body, require a daily intake
        of proteins, fats, minerals and carbs to feed his remaining organs, he has
        no digestive system thus he must be "fed" intravenously. Along with blood-cleansing,
        periodic viral and bacterial-screening, anti-inflammatory corticoids, hormones
        and antibiotic protocols to maintain the organics left inside the bionics.
        Without such protocols, the organs and brain would starve without nutrients
        could become infected and necrotic and cease activity within him. * Invasive
        Programming: Being mostly machine RoboCop is subject to core programming,
        namely that he cannot arrest or harm OCP individuals, even so by virtue of
        sheer force of will despite threatening shut down, Alex was able to shoot
