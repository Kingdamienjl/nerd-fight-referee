        Artists Category:Drivers Category:Leaders Category:Weapon Masters Category:Married
        Characters Category:Tragic Characters Category:Cyberpunk Characters Category:Science
        Fiction Characters Category:Computer Users Category:Disabled Characters'
      source_id: vsbattles-robocop-alex-murphy
