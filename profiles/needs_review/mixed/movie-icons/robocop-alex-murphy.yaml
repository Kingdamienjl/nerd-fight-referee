    - field: weaknesses
      value: '* He moves quite slowly on foot - at the pace of an average human. He
        is also exceptionally heavy. * Still limited to mechanical maintenance, which
        means he needed servicing and tune-ups from time to time. * His remaining
        human tissue and organs can be a liability and needed to be monitored as well.
        * His power pack has enough charge for only 24 hours. Prolonged combat and
        sustaining too much damage can drain it quickly. (can be remedied with the
        flightpack doubling as a recharging station) * His programming prevents him
        from targeting children. * In the wrong hands, he can be programmed to be
        incompetent, corrupted, or a dangerous threat to society. * RoboCop occasionally
        had flashbacks of his previous life as Alex J. Murphy, which caused him to
        have "dreams" when he was in his recharging state. This sometimes caused him
        to sleepwalk or wake up in shock. * His fourth directive, "Any attempt to
        arrest a senior officer of OCP results in shutdown", but this was eventually
        overcome by being deleted in the third film. Feats: ===Strength=== * [Grip]
