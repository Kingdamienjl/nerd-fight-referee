- id: claim-intelligence-8adc00a6
  section: power_scale
  axis: battle_iq
  text: 'Is a skilled and somewhat cunning combatant when he needs to be and his computerized
    brain affords him outstanding processing power. Standard Tactics: DPD protocols
    | Fundamental to his operational limits were RoboCop''s "Prime Directives," a
    set of rules, unbreakable and unbendable, that RoboCop is bound to uphold: #"Serve
    the public trust" #"Protect the innocent" #"Uphold the law" #"Never oppose an
    OCP Officer" (Was removed later on in RoboCop 3)'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-4acb55d0
  section: weaknesses
  axis: weakness
  text: '* He moves quite slowly on foot - at the pace of an average human. He is
    also exceptionally heavy. * Still limited to mechanical maintenance, which means
    he needed servicing and tune-ups from time to time. * His remaining human tissue
    and organs can be a liability and needed to be monitored as well. * His power
    pack has enough charge for only 24 hours. Prolonged combat and sustaining too
    much damage can drain it quickly. (can be remedied with the flightpack doubling
    as a recharging station) * His programming prevents him from targeting children.
    * In the wrong hands, he can be programmed to be incompetent, corrupted, or a
    dangerous threat to society. * RoboCop occasionally had flashbacks of his previous
    life as Alex J. Murphy, which caused him to have "dreams" when he was in his recharging
    state. This sometimes caused him to sleepwalk or wake up in shock. * His fourth
    directive, "Any attempt to arrest a senior officer of OCP results in shutdown",
    but this was eventually overcome by being deleted in the third film. Feats: ===Strength===
    * [Grip] 400 foot-pound grip. Stated to be capable of "breaking every bone in
    your body".RoboCop * [Grip] Bet a gun barrel. * [Grip] Broke a chain in his grasp.RoboCop
    2 * [Pushing] Overpowered the arm of ED-209. * [Pushing] Pushed against Robocop
    2''s arm. For reference Robocop 2 was strong enough to flip an armored car. *
    [Striking] Reached through a wall and pulls a guy through it. * [Striking] Clothslined
    a guy halfway across a convenient store through a glass door. * [Striking] Broke
    down a large, locked door after several pushes. * [Striking] Punched through a
    metal door.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-5a237cf3
  section: abilities
  axis: hax
  text: Alex Murphy= *Martial Arts *Vehicular Mastery *Marksmanship |-|RoboCop= *All
    of his former skills to a much greater extent *Superhuman Physical Characteristics
    *Cyborgization *Immortality (Type 2) *Bodily Weaponry (His data spike) *Enhanced
