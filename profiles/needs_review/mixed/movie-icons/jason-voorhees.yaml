      value: 'Weak against fire and even fears it. Those who wear his mother''s sweater
        will be attacked and harmed less. Notable Attacks/Techniques: * Weapon Attacks:
        Standard stabs and slashes, as well as a basic weapon throw * Statistics Amplification:
        After being defeated the first day, he grows in power and most notably speed.
        This is later increased the second day after being defeated. Jason''s stats
        increase with each defeat according to the game itself * Life Energy Drain:
        Much like common enemies like wolves, zombies, bats, and crows, Jason likely
        can steal life force energy through touch * Zombie Creation: Seemingly turns
        those he has killed into zombies through unknown means. He also doesn''t seem
        to be able to control said zombies, who are described as mindless * Regeneration:
        Regenerates from all counsellors attacks (though this is done after he retreats)
