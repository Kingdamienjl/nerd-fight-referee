    - field: weaknesses
      value: 'Freddy is overconfident and tends to toy with his prey. Under normal
        conditions, Freddy cannot manifest his control over dreams in the real world,
        and his influence is limited to Springwood. He can be pulled into the real
        world, weakening him as he lacks access to his power over his dreams. He can
        be defeated by laying his remains to rest in hallowed ground. In the real
        world, he is vulnerable to crosses, holy water, and reflections, which remind
        him of all the pain and torment he''s forced on others, as well as fire, which
        was used to kill him. He can only truly exist and utilize his powers as long
        as he is feared; otherwise, he will lose much of his influence. If the Dream
        Demons that grant him his powers leave or are forcibly stripped away from
        him, he will lose many of his powers and will be left vulnerable to death.
        | After fusing with the Necronomicon, Freddy will invariably, inevitably have
        all of his powers stripped away from him by his Dream Demons, leaving him
