  range:
    text: Standard Melee Range, higher with various firearms.
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Gifted (Normally, a T-1000''s learning aptitude is restricted, but when
      set to "write" instead of "read" mode, they can adapt to and develop almost
      human personalities. They are also able to quickly adapt to and use technology/weapons/vehicles,
      especially those within Skynet''s database on modern technology. Terminators
      are made to perfectly blend into and interact with society, as well as understand
      its norms to better integrate or even ascend to a higher position in it, such
      as impersonating a police officer. They use detective skills to find their targets
      multiple times over the course of their films, using all types of resources
      such as police records, a target''s family or guardians to influence their targets
      actions or predict their next course of action to intercept them) Standard Tactics:
      To find a target, uses various means, such as accessing police records, talking
      to relatives of a target, and interacting with society, mimicking other organisms
      to achieve this goal and/or to get closer to their target. In combat, often
      abuses its liquid body to allow nothing to impede it as it continues its attack,
      such as passing through gates, growing limbs to operate a helicopter, or inhibit
      the movements of its foes to gain the upper hand'
    source_ids: *id002
    confidence: 0.95
