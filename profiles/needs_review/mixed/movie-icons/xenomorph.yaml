    \ Profile (1 Fully Grown Xenomorph & 1 Fully Grown Demogorgon was used. Speed\
    \ was equal) *Punished V2 (Mullet MadJack) Punished V2's Profile (Adult Xenomorph\
    \ is used. Both are 30 meters apart. Speed Equalized and the battle takes place\
    \ here) |-|Losses= *Iron Man (Marvel Comics) Iron Man's Profile (Iron Man was\
    \ in his Mark 3 suit, Xenomorph Queen was used, speed was equalised) *Stormtrooper\
