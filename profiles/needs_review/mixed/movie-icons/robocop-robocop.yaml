    - field: standard_equipment
      value: 'SIG-Sauer P226, Heckler & Koch P9S, police armor | Auto-9 machine pistol,
        Tactical Ordinance grenades, Cobra Assault Cannon, Weapon Arm (includes a
        submachine gun, flame thrower, and smart bomb launcher with anti-tank warhead),
        Data Spike, Flightpack File:Auto-9.png|Auto-9 File:GunArm.png|Gunarm * Auto-9:
        RoboCop''s primary weapon, the Auto-9, remained stored in a mechanical holster
        which deployed from RoboCop''s right leg. It was also modified so it would
        not fire unless RoboCop was the one using it. * Terminal strip: RoboCop''s
        terminal strip was a sharp, spike-like device that protruded from RoboCop''s
        right fist. This device could be used by RoboCop to interface with a corresponding
        data port in order to download information from the police database and compare
        the information he gathered from his missions with the police database. This
        device was also used to kill Clarence Boddicker; having pinned RoboCop under
        a pile of scrap metal, the cyborg waited for Boddicker to approach and then
        stabbed Boddicker in the throat, killing the crime lord. * Gunarm/Machine
        gun/rocket launcher: By the time he faced the Urban Rehabilitators, RoboCop
        was outfitted with a gun arm. To use it, RoboCop removed his left hand and
        replaced it with the weapon assembly. It contained a 9mm machine gun, a flamethrower,
        and a small missile launcher with a projectile potent enough to destroy an
        armored vehicle. * Flightpack/recharging station: In his fight against the
        Rehabs, RoboCop used a flight pack. It also doubled as a replenishing system
        for when his battery system was low on power. The jetpack allowed Murphy to
        overcome his relatively limited mobility for tactical advantage in combat.
        File:I006739.jpg|Detroit Police Cruiser * Detroit Police Cruiser: Quick, nimble
        and able to take a lot of punishment, Detroit Police cruisers are cars used
        while officers are on patrol. As well as the usual red & blue lights, they
        have spotlights, nudge bars and no hub caps. They have been painted matte
        black paint and display the OCP logo on their side doors. The Detroit Police
        cruisers were modified first generation Ford Tauruses. In the original script,
        the cruisers were ultra-quick, ultra-advanced, twin jet turbine-powered vehicles,
        packed with electronics and sensor equipment, which proved far too expensive
        to render on screen. : Can Summon/Pilot: Detroit Police Cruiser (1986/1989
        Ford Taurus LX [DN5]), 1986 Harley-Davidson FXSTC Softail Custom'
