        art, but not invulnerable; .50 caliber or larger could penetrate or kill.
        * 2.0 Suit: The 2.0 suit was almost identical to the 3.0 suit, but instead
        of being black, it was covered in desert digital camouflage and featured numbers
        on the chest. * 2.1 Suit: Like the 2.0, the 2.1 suit was almost identical
        to the 3.0, but featured a forest digital camouflage. * 2.2 Suit: Unlike the
        other suits, the 2.2 suit is not identical to the 3.0 suit but the 1.0 suit.
        It has a dark green and beige camouflage. * 2.3 Suit: The 2.3 is also identical
        to the 3.0, but featured a navy blue camouflage. * 3.0 Suit: The black RoboCop
        3.0 suit was used at the demand of Raymond Sellars. It became heavily damaged
        after RoboCop fought Antoine Vallon''s criminals and became even more damaged
        after he fought OmniCorp''s soldiers and ED-209s. After killing Sellars, the
        damage included a missing arm, a broken visor and a large hole on the right
        side of his chest. His 3.0 body was later replaced with the 1.0, likely due
        to the heavy damage. Sometime later, RoboCop was again equipped with the 3.0
        suit after being repaired. File:Bike 01.jpg|C-1 * C-1: A motorcycle produced
        by OmniCorp in 2028. It was notably used by RoboCop as his primary vehicle.
        It is based on the Kawasaki Z 1000 SX modified. The C-1 maxes out at 248 mph
        (397 km/hr) but recommends sub-200 mph for optimal handling. Its liquid-hydrogen
        cooled 16-valve engine and 6-speed transmission system generates 197 horsepower
        with fluid mesh. Solid strut forged wheels include brakes and rotor assembly
        inside wheel face. Dura-Polymeric technology reduces hydroplaning while ensures
        durability for on and off-road pursuit. Radial glo-lighting optional. Embedded
        in the C-1 tail unit, OmniCorp C-series tracking technology enhances remote
        balance and navigation while empowering in-motion repairs. Override switch
        triggers pilotless riding functionality. Carbon-tensile shielded for blast
        resistance, all vehicles are sculpted from the latest O-Force material. C-1
