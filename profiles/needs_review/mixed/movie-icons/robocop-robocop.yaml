    confidence: 0.95
  attack_potency:
    text: At least Wall level (Pulled a criminal through a wall, and then proceeded
      to punch him out of the window. Knocked down a reinforced door, and then took
      down a whole group of skilled shooters who were shooting at him all at once.
      Damaged RoboCain who previously withstood a large fall and has tanked several
      shots from the Cobra Assault Cannon. Has punched through a steel door, which
      would yield this much), higher with Cobra Assault Cannon (It generates this
      much energy in a single round) and Gunarm (Can destroy a tank)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Average Human movement speed with Supersonic attack speed and reactions
      (Dodged ED-209's missiles many times despite being badly damaged. Has caught
      bullets in mid flight with his fingers). Subsonic travel/flight speed with vehicles
      and Flightpack
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: Class 10 (Matched RoboCain who flipped an APC, which weighs 7.37 tons)
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: At least Wall level (Sent a criminal flying into a refrigerator, breaking
      the glass. Intercepted a blow from RoboCain, who is strong enough to knock away
      and damage RoboCop himself with physical blows. This indicates that RoboCop
      himself is not too far off in strength. Also ripped apart some of the armor
      plates of RoboCain, who has durability comparable to his own, with his bare
      hands)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least Wall level (Withstood two indirect rocket hits without notable
      damage, survives a large gas explosion, being punched through a thick concrete
      wall, which would require this much energy. Is mostly impervious to conventional
      small arms fire)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (Can continue fighting so long as his power pack has charge,
      can fight for a maximum of up to 24 hours on a full charge), Unknown with a
      recharging station
    source_ids: *id002
    confidence: 0.95
  range:
    text: Hundreds of Meters
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: 'Fundamental to his operational limits were RoboCop''s "Prime Directives,"
      a set of rules, unbreakable and unbendable, that RoboCop is bound to uphold:
      #"Serve the public trust" #"Protect the innocent" #"Uphold the law" #"Never
      oppose an OCP Officer" (Was removed later on in RoboCop 3)'
    source_ids: *id002
    confidence: 0.95
