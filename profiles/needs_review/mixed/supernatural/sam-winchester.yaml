  intelligence:
    text: Gifted. Sam has vast amounts of knowledge on the Supernatural and the occult,
      even more than his brother Dean, who refers to him as a "encyclopedia of weirdness".
      As such, he is usually the one to do research on their hunts, and is capable
      of reading and memorizing texts, chants and spells in foreign languages such
      as Latin. Like his brother, Sam has in-depth knowledge in how police, fire departments
      and various government agencies operate, and is capable of evading and impersonating
      as them. He is very skilled in criminal acts, such as lock picking, computer
      hacking, and car jacking, and is generally a computer expert. He also went to
      Law School and is an excellent Poker Player.
    source_ids:
    - vsbattles-sam-winchester-supernatural
