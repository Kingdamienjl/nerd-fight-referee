    - field: weaknesses
      value: "Aleister is cursed to a life of failure, and Spiritual Tripping requires\
        \ that the target has a mind. It's in-character for Aleister to keep the magic\
        \ recoil of all his spells contained to his body, so his strongest spells\
        \ cause him internal damage. He needs his heart to regenerate Notable Attacks/Techniques:\
        \ ===Base=== *Blasting Rod: A spell that originally belonged to Allan Bennett,\
        \ Aleister's friend, and teacher. While Bennet and Aleister disguise it as\
        \ a silver staff with the effect of sending the target\u2019s refined magic\
        \ power out of control to knock them unconscious without harming them, the\
        \ true meaning of Blasting Rod is a support spell that, when called, amplifies\
        \ the power/effect of Aleister's magic to 10 times that which the target believes\
        \ it to be. Because the targets expectation of the power output will usually\
        \ rise with every use so does that power. If for example, the target, after\
        \ the range of the attack was increased by 10 times after the first use, expects\
        \ the range to be that long, the range will be increased by 100 times of the\
        \ original value the next time it is used. This weapon is what would enable\
        \ a human-like Aleister to even match a Magic God in battle if they expect\
        \ his power to be comparable to theirs. This spell can even be used on Aiwass\
        \ if Aleister has summoned it. *Abracadabra: One of the great achievements\
        \ of Aleister Crowley, based on the most famous magic phrase in the world.\
        \ It's often included in magic charms and magic circles rather than incantations,\
        \ where its effect of curse reversal allows one to use it as a protective\
        \ charm to divert enemy curses or even send them back towards them. **I supply\
        \ lightning for thy death: Aleister can also use Abracadabra as a curse-reversal\
        \ circle to capture, slightly twist and redirect one of the countless curses\
        \ that fly around the world at all times and aim it at a target of his choosing\
        \ by drawing out an upside-down triangle with the same letters arranged in\
        \ a regular fashion. Since the curse is not his, he doesn't have to refine\
        \ magical power and thus cannot be traced back to him. *Karma: A complex spell\
        \ developed by Aleister, developed from multiple sources of magic, both Western\
        \ and Eastern. **Shadow Blade: First a large shadow gathers under the opponent\
        \ and stabs them, leaving a black shadow blade in their torso. However, this\
        \ shadow blade does not cause physical harm or even cause much discomfort\
        \ to the victim after they recover from the initial shock. Instead, the shadow\
        \ sword is a magic sword, the symbolic weapon meant to guide the summoning\
        \ ceremony. While it is primarily something like an amulet that drives out\
        \ negative power and protects the spell user, \u2018drive out\u2019 also means\
        \ to \u2018divert or guide in a convenient direction\u2019. So if used correctly\
        \ it can be used for summoning. Since Aleister is aware of IB, he developed\
        \ the sword to be broken. If the sword is broken the shards will scatter everywhere,\
        \ tearing the victim from within. **Karmic Beast: 2 skeleton-like 4-legged\
        \ magic beasts summoned by the shadow blade. One is made of chains with a\
        \ handcuff as its skull while the other is made of chains with a bicycle gear\
        \ as its skull. The handcuff-beast is viewed as a ring and symbolizes the\
        \ female. The gear-beast is viewed as the sun and symbolizes the male. Both\
        \ beasts emit a strange rainbow-colored light. The beasts are tough enough\
        \ to not be damaged when rammed with a ton truck at full speed. The two beasts\
        \ will continue to spawn as long as the shadow blade that summons them is\
        \ intact. ***Karmic Retribution: If destroyed, a vague haze surrounds the\
        \ person who destroyed it. This is based on the concept of karmic retribution,\
        \ the idea that your own actions invite the result you receive, using the\
        \ simplest karma, the karma of killing. The more beasts a person kills, the\
        \ heavier and thicker the karma they bear grows. If the target tries to destroy\
        \ or remove the karma they have received without taking care of the source\
        \ of the spell, their karma will also increase as they bear the \"karma of\
        \ killing karma\". ***Magic Interference: The handcuff beast represents binding\
        \ and stagnation and the gear represents acceleration. The karmic beasts can\
        \ use this symbolism to interfere with spells being casted and send them out\
        \ of control as long as the spells are based on colors. *Spiritual Tripping:\
        \ A technique through which Aleister conveys his meditation to someone else\
        \ by connecting his body to the target's just like a voodoo doll and links\
        \ their movements, allowing him to affect their perception and enter their\
        \ mind. To use it Aleister forms various gestures relating to a weapon and\
        \ three specific numbers appear from his palm in succession before a weapon\
        \ appears in his hands. This paints a picture of the \u201Cweapon\u201D in\
        \ the target\u2019s brain and creates a foothold for influencing them. The\
        \ weapon is illusory and only visible to the actual target/s, but it will\
        \ cause them real damage while leaving anyone and anything else completely\
        \ untouched. Anyo"
