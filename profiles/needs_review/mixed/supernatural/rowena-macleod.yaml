    - field: weaknesses
      value: "Standard Human Weaknesses, Power Sealing, Iron Binding, Witch-Killing\
        \ Spell, Requires Chanting to use many of her Spells Notable Attacks/Techniques:\
        \ *Defigere Et Depurgare: A spell which, through the utilization of a Hex\
        \ Bag, is capable of killing lesser demons, who are literally Non-Corporeal\
        \ Souls. *Attack Dog Spell: Through a Hex Bag, and the incantation \"Impetus\
        \ bestiarum\", the target is overcome by pain and quickly loses their consciousness.\
        \ They then act like a mindless beast, attacking anyone besides the caster.\
        \ With the Book of the Damned, this spell can affect even angels. *Gaelic\
        \ Obliteration Spell: An offensive spell, which requires Rowena to paint herself\
        \ with various Gaelic sigils, and then speak the following chant: \"A spiorad\xED\
        \ an tsaoil, \xE9istig\xED liom! D\xEDothaigh an fear seo! D\xEDothaigh go\
        \ luaithreach \xE9!\" Afterward, the sigils will emit blinding violet lights,\
        \ and a wave of magical energy will obliterate the target, reducing them to\
        \ ashes. *Diminishing Spell: Rowena's most powerful spell, and the most complicated\
        \ to produce. Firstly, Rowena must be supported by at least 4 other powerful\
        \ witches, who must prepare a concoction of various, mostly unknown ingredients\
        \ (Such as coals, owl feathers, yarrow roots, and the jaw bone of pig). Said\
        \ concoction must be placed inside a bowl, which is laid on top of a complex\
        \ sigil, and a hoodoo is later placed atop the mixture and ignited. All the\
        \ witches must simultaneously speak the word \"Attenuare\", and pour all their\
        \ magical powers into the spell. Finally, Rowena will be capable of casting\
        \ a wave of powerful purple lightning, which will weaken and damage the target\
        \ from inside out. Notably, this was capable of harming The Darkness' vessel,\
        \ albeit proved completely ineffective against her true self. Note: Some of\
        \ Rowena's offensive abilities have been shown to affect beings such as Crowley,\
        \ the King of Hell, Fallen Seraph Castiel and even The Darkness, when enhanced\
        \ by a coven of witches (Albeit barely). As these, especially the last two,\
        \ are huge outliers and do not remotely translate to her demonstrated AP,\
        \ they aren't used. ==Notable Matchups== Victories: Losses: Inconclusive:\
