    - field: weaknesses
      value: 'Items, weapons, and magic that are considered "holy" such as holy swords
        and light magic - although it was noted that light is not particularly effective
        against him as he''s a half devil - are especially effective against Devils
        like Vali. He is somewhat arrogant and Reduce is ineffective against Ddraig,
        Ophis, and Great Red Notable Attacks/Techniques: ValiActivatingBalanceBreaker.gif|Activating
        Balance Breaker Divine Dividing Weakens Kokabiel.gif|Divide White Dragon Emperor''s
        Light WingsDIVINE DIVIDING: Vali''s Sacred Gear. It holds the soul of the
        legendary White Dragon Emperor, Albion. It allows him to halve the power of
        anyone he makes contact with every ten seconds, gaining the deducted power
        for himself. In the event that he absorbs power beyond his limit and capabilities,
        it is expelled from the wings of light situated in his back. Its ability to
        halve also extends to emotions, as shown when a past possessor of the Divine
        Dividing halved and reduced the hatred, grudges, and feelings of resentment
        of the past possessors of the Boosted Gear. *Armour of the White Dragon EmperorDIVINE
        DIVIDING: SCALE MAIL: The Balance Breaker of Divine Dividing. Vali becomes
        covered in a white, full-body Dragon Armor with various jewels on it. In this
        form, the ten second limit of Divide is overridden. **Half Dimension: This
        allows Vali to halve and compress the size of both living and non-living things
        in his surroundings without any need for direct contact. He has shown the
        ability to affect space with this move, halving and distorting space, and
        sealing his targets in a spatial distortion. He can also use it to halve and
        diminish the power of attacks directed towards him, rendering them weak enough
        to be easily deflected, or weak enough that they simply disappear harmlessly.
        **Reflect: Vali reflects any attack directed at him back to the opponent.
        *Dragon of SupremacyJUGGERNAUT DRIVE: It is a forbidden move unique to the
        Boosted Gear and Divine Dividing. The Juggernaut Drive temporarily removes
        the seal placed on the Heavenly Dragons granting the user immense power. The
        Juggernaut Drive, however, causes the user to lose sanity while having their
        lives devoured by the power. However, Vali is able to avoid this using his
        large amount of demonic powers as an alternative source of power instead of
        his lifespan; however, if used for extended periods of time, it will eventually
        cause him to go berserk. *Silver Dragon of the Highest SupremacyEMPIREO JUGGERNAUT
        OVERDRIVE: Vali gained access to this form after completely sealing off the
        thoughts of the past possessors of the Divine Dividing. Also known as the
        Silver Dragon of the Highest Supremacy, the color of his armor changes to
        silver-white and he emits an enormous amount of energy and is capable of crushing
        his surroundings without moving. It is noted to be similar to, but different
        from Juggernaut Drive, and is an enhanced version of it. **Compression Divider:
        Vali compresses his target repeatedly until they become so small that they
        cannot become any smaller and vanish entirely from existence in a few seconds.
        It is able to compress all matter and is said to be capable of compressing
        even dreams. *Diabolos Dragon Lucifer: A form Vali obtained after Ophis''
        blessing allowed him to tap into his latent power inherited from the original
        Lucifer and combine it with Albion''s power. His armor becomes composed of
        silvery-white and jet black tones. **Satan Compression Divider: An enhanced
        form of Compression Divider. Vali projects silvery white and jet black streams
        of light that instantly compress his targets over and over again, until they
        are completely eliminated. It is able to compress thousands of targets at
        once. **Satan Lucifer Smasher: An enhanced version of the Longinus Smasher,
        Vali releases a massive continuous stream of silvery white and jet black projectiles
        that can easily destroy a large area. **Reduce: Vali releases a special type
        of poison that is able to cut down the blood, bones, organs, and soul of the
        target. It is ineffective on inorganic objects. **Fairies of the White Dragon
        EmperorDIVIDING WYVERN FAIRY: Vali summons twelve wyverns from his wings.
        They act as extensions of his power and are able to use his abilities such
        as Divide, Reflect, Reduce, Half Dimension, as well as to turn their bodies
        into cannons to release large amounts of powerful energy. Note: Vali''s light
        speed statements were accepted in these threads because of the consistency
        of the statements and the fact that a much slower character in the form of
