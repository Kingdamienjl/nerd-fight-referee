      value: Vali is considered to be an incredibly skilled combatant and is the most
        talented wielder of the Divine Dividing of all time, attaining the Balance
        Breaker at a young age. He also possesses exceptional talent in magic, completely
        mastering Norse magic, which is described to be the most advanced and complicated
        system of magic in a remarkably short period of time. Additionally, he is
        capable of grasping the attack patterns of opponents after clashing with them
        a few times and is stated to be a better genius than the likes of Gressil,
        who can continually adapt to opponents while simultaneously improving his
        combat style.
