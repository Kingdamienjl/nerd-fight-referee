    notes: auto_repair source extraction
  attack_potency:
    text: Town level (According to Uriel, he and Castiel could have obliterated a
      town. An angel's mere cries of pain can produce ripple effects of strange incidents;
      Samandriel, a seemingly lesser angel, created destructive tornadoes across Nabraska
      while being tortured by Crowley. Should be superior to weak angels such as Hael,
      and could overpower Zachariah's men even after falling from Heaven) | Town level
      (Can easily overpower groups of regular angels such as Duma and her henchmen,
      and was capable of outmatching Eremiel in a fight and throwing him across a
      room. Overpowered both Efram and Jonah while bound in cuffs and mentally weakened
      by a spell. Fought against, and defeated Kabaiel, a Grigori, and could manhandle
      his Apocalypse World counterpart without effort, the latter being a version
      of himself who never became a Seraphim or fell from Heaven. Tossed aside a Leviathan
      with telekinesis, and was able to fight off a group of them by catching them
      off-guard, though he was forced to run away afterwards) | At least Town level
      (Immensely more powerful than his weakened self, possessing his complete grace
      alongside unbroken wings), possibly City level (Implied to be capable of creating
      thunderstorms), far higher when empowered by souls (Strengthened himself with
      50,000 Human Souls as part of a deal with Crowley, each of which was compared
      to a nuclear reactor. Could briefly banish Raphael from Heaven with a blast
      of white light, though he was still no match for the Archangel in direct combat).
      At least Multi-Galaxy level, possibly Universe level with Heaven's Weaponry
      (Gained possession of all the weapons of Heaven, whose collective power was
      enough to strike fear in Raphael and cause him to flee) | Universe level (Obliterated
      Raphael with a snap of fingers, and claimed to be capable of destroying Hell
      if he so desired. The sheer power of the souls absorbed by him was causing his
      vessel to rapidly melt over a span of days, whereas it was later shown to be
      able to hold even beings as powerful as Lucifer for months before starting to
      show negligible signs of decay)
    source_ids:
    - vsbattles-castiel-supernatural
    confidence: 0.6
    notes: auto_repair source extraction
