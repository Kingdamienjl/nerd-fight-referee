  tier:
    text: '{{7-C}} | {{7-C}} | At least {{7-C}}, possibly {{7-B}}, far higher when
      empowered by souls. At least {{3-B}}, possibly {{3-A}} with Heaven''s Weaponry
      | {{3-A}}'
    source_ids:
