  intelligence:
    text: 'Gifted (Dean possesses extensive knowledge on the supernatural and occult.
      He is well-versed in how police, fire departments, and various government agencies
      operate and conduct investigations, and knows how to both impersonate and evade
      them effectively, having done the latter for over a decade. Dean is an expert
      in escape, evasion, hand-to-hand combat, marksmanship, and stealth. He is also
      alarmingly skillful in many areas frowned upon by the law: lock picking, breaking
      into security systems, carjacking, etc. With preparation time, he is very dangerous,
      having once exorcised 30 demons at once, and has defeated far more powerful
      opponents such as Eve and Dick Roman, through trickery)'
