- id: claim-weaknesses-442d0397
  section: weaknesses
  axis: weakness
  text: 'Sufficient damage to her physical form can revert her back to her vulnerable
    gem form which can be broken and destroyed Notable Attacks/Techniques: Yellow
    Diamond Zap.gif|Her electricity destabilizing Peridot Aura Projection Yellow n
    Blue.gif|Projecting her aura to attack Steven *Aura Projection: The Diamonds can
    project an aura around them that they can control, they can either radiate it
    from their entire bodies or emit it from specific parts of their bodies, usually
    their hands. Yellow''s aura is represented as yellow clouds of electricity. She
    can use this as an offensive ability in both the physical and mental plane, as
    seen when she was able to focus her aura and attack Steven as he was projecting.
    **Electrokinesis: Yellow''s aura takes the form of a powerful electrical current
    that form currents around her body and can be projected from her fingertips. These
    electrical bolts can deal significant physical damage but also destabilizes a
    Gem''s form in a manner almost exactly like a Gem Destabilizer. It can be focused
    to cut through thick surfaces. *Transmutation with Biological Manipulation and
    Size Manipulation: Yellow can permanently alter the physical form/shape of Gems
    in any way she wishes, and can also use this ability on individuals like Steven
    who are half-Gem, half-organic. This ability also extends to Size Manipulation
    to such an extent that she can grow Garnet to a size even larger than her own
    tremendous stature. ==Notable Matchups== Victories: Losses: Inconclusive: {{scroll
    box|content={{reflist|2}}}} {{Discussions|Yellow Diamond|Yellow Diamond}} Category:Characters
    Category:Cartoon Characters Category:Steven Universe Category:Antagonists Category:Primary
    Antagonists Category:Shapeshifters Category:Immortals Category:Aliens Category:Regeneration
    Users Category:Giants Category:Gems Category:Leaders Category:Size Users Category:Energy
    Users Category:Tyrants Category:Villains Category:Adaptation Users Category:Electricity
    Users Category:Reformed Characters Category:Genderless Characters Category:Neutral
    Characters Category:Pocket Reality Users Category:Aura Users Category:Large Sized
    Characters Category:Deconstruction Users Category:Astral Projection Users Category:Sealing
    Users Category:BFR Users Category:Body Control Users Category:Biology Users Category:Fusionism
    Users Category:Self-Sustenance Users Category:Corruption Users Category:Humanoid
    Characters'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-4ad2c3b9
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Gem Physiology (Grants Regeneration (High-Mid),
    Immortality (Types 1 and 3), Shapeshifting, Size Manipulation, Body Control, Biological
    Manipulation, Fusionism, Self-Sustenance (Types 1, 2, and 3), Automatic-adjustment
    to different strengths of gravity, Pocket Reality Manipulation (All Gems have
    a pocket dimension of infinite size contained within their gemstone), Sealing
    (Via Bubbles), and BFR (Via Bubbles), Large Size (Type 1), Electricity Manipulation,
    Deconstruction (Able to destabilize Gems), Aura (Allows her to detect and harm
    entities on the astral plane, as well as to possibly enhance her physical attack
    power as we saw Blue Diamond do in "Reunited"), Healing (can fix and restore shattered
    gems even if they still have small pieces missing), Transmutation (can permanently
    alter the physical form of Gems which are inorganic as well as that of Gem/Human
    Hybrids), Size Manipulation (can permanently alter the size of Gems as well as
    Gem/Human Hybrids), Corruption (Type 2) (When combined with Blue and White she
    is able to corrupt an entire planet's worth of Gems). Resistance to Empathic Manipulation
    (Resisted Blue Diamond's emotion wave better than other gems) and Telepathy (Steven
    struggled to get near her in his Astral Projection form due to her aura)
  source_ids: *id004
  decisive: true
