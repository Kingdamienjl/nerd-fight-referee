  attack_potency:
    text: At least Large Town level (Able to fight with Garnet, Amethyst and Pearl,
      though they were out of practice). Ignores conventional durability against Gems
      with Gem Rejuvenator (Was described by Bismuth as a weapon that resets Gems
      to the way they were made). Unknown with Gem Injector (According to Peridot,
      it would take 41 hours for the Gem Injector to destroy all life on Earth, though
      damaging or attempting to remove the injector would accelerate this process
      significantly and Spinel is capable of manually accelerating the process so
      that the Injector injects all of its bio-poison instantly)
