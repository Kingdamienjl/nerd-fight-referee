- id: claim-weaknesses-7653619e
  section: weaknesses
  axis: weakness
  text: "Sufficient damage to her physical form can revert her back to her vulnerable\
    \ Gem form which can be broken and destroyed. Notable Attacks/Techniques: *Body\
    \ Control: Throughout the movie, Spinel uses her unique body control to take advantage\
    \ of the fights she's in. Against the Crystal Gems, she wrapped her body around\
    \ her surroundings and used them to quickly launch herself into a spot where she\
    \ could poof Garnet, Amethyst and Pearl. ==Notable Matchups== Victories: Jasper\
    \ (Steven Universe (verse)) Jasper\u2019s Profile Losses: Katsuki Bakugo (My Hero\
    \ Academia) Dynamight's Profile (Endeavor Agency Arc Dynamight is used, speed\
    \ was equalized, starting distance was 10 meters, Gem Injector and Howitzer Impact\
    \ were restricted) Inconclusive: {{discussions}} Category:Steven Universe Category:Characters\
    \ Category:Cartoon Characters Category:Gems Category:Villains Category:Regeneration\
    \ Users Category:Shapeshifters Category:Biology Users Category:Fusionism Users\
    \ Category:Self-Sustenance Users Category:Adaptation Users Category:Pocket Reality\
    \ Users Category:Sealing Users Category:BFR Users Category:Body Control Users\
    \ Category:Size Users Category:Elasticity Users Category:Memory Users Category:Tragic\
    \ Characters Category:Scythe Users Category:Acid Users Category:Poison Users Category:Reformed\
    \ Characters Category:Technology Users Category:Clowns Category:Humanoid Characters"
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-fa64c79c
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Gem Physiology (Grants Regeneration (High-Mid),
    Immortality (Types 1 and 3), Shapeshifting, Size Manipulation, Body Control, Biological
    Manipulation, Fusionism, Self-Sustenance (Types 1, 2 and 3), Adaptation (Automatic-adjustment
    to different forces of gravity), Pocket Reality Manipulation (All Gems have a
    pocket dimension of infinite size contained within their gemstone), Sealing (Via
    Bubbles) and BFR (Via Bubbles)), Body Control, Elasticity (Can wrap and stretch
    various parts of her body. Made her arm and fist large enough to slam Steven into
    the Gem Injector from above clouds), Skilled Scythe User (She showed extremely
    high amounts of skill when wielding the Gem Rejuvenator), Memory Manipulation
    with Gem Rejuvenator (Can reset Gems to their original state), Poison Manipulation
    and Acid Manipulation with Gem Injector (Injects planets with a bio-poison that
    kills all organic life it comes in contact with and is caustic enough to melt
