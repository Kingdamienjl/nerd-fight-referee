    - field: weaknesses
      value: 'Sufficient damage to her light-construct form can cause it to dissipate
        (Refered to as "poofing"), leaving her gemstone vulnerable (Though gems have
        shown the ability to recover in mere seconds without problems if they don''t
        make any alterations to their form) Notable Attacks/Techniques: *Shapeshifting:
        In combat Spinel typically makes use of her shapeshifting abilities, which
        she can utilize to a far greater extent than other gems, effortlessly stretching
        and twisting her body in all sorts of ways, keeping her movements unpredictable.
        Spinel can twist her entire body to spin like a top, squish, stretch and morph
        her body to avoid attacks, increase the size of her fists for striking power,
        and even spin her legs to achieve flight Note: Some people may try to argue
        that Steven Universe characters'' speed caps below light speed due to Pearl''s
        statement in "Adventures in Light Distortion" about gems being unable to move
        faster than light because of their light construct bodies/forms. However this
        is the only instance where this concept is brought up and there are multiple
        blatant instances of gems moving faster than light without any effects on
        their forms, such as Lapis Lazuli''s feats of flying to Homeworld from Earth
        starting in "Ocean Gem" and to the edge of the galaxy and back starting in
        "Raising the Barn," both of which would get MFTL+ results even when low-balled
        to a ludicrous degree, or the numerous times gems have utilized ships moving
        at FTL speeds, such as the gem Warship piloted by Jasper and Peridot traveling
        to Earth from Homeworld in at most a few days in "The Message," Peridot warping
        to Earth from Homeworld in seconds, requiring speeds many trillions to even
        quadrillions of times greater than that of light, and Aquamarine''s ship traveling
        from Earth to Homeworld in minutes in "Stuck Together," even the episode with
        Pearl''s statement that supposedly debunks FTL Steven Universe has a contradictory
        feat, as the Roaming Eye traveling to the Asteroid Belt in the time it did
        would have required moving at FTL+ speeds, which also had no adverse effects
        on the gems'' forms. So overall, due to the series showing numerous instances
        of gems being perfectly fine moving at FTL speeds, Pearl''s singular statement
        holds no actual weight to it and should be ignored. Note 2: Similar to the
        previous note, arguments have commonly been made for the durability of a gem''s
        stone being far below their body''s durability due to Amethyst''s gem being
        cracked by a lengthy fall in the episode "An Indirect Kiss," however similar
        to the case with FTL gems, this is one of the only instances of this (Which
        is very likely just PIS, as Amethyst''s gem being cracked was required to
        move the plot of the episode forward by giving the Crystal Gems a reason to
        go to Rose''s fountain) whereas there exist multiple instances of gems'' stones
        enduring and often being undamaged by blows that cause harm to their constructs,
        such as Lapis and Jasper tanking the explosion of the Gem Warship, which damaged
        their bodies but left their gems unscathed, or when Bismuth hit Lapis in her
        back (Directly where her gem is located) hard enough to poof her with a single
        hit, yet didn''t leave any damage on her gem. ==Other== {{scroll box|content=}}
        Category:Soupywolf5'
