        instead of relying on her martial art skills and enhanced physical prowess
        as a method of dealing with the minor threats through forceful punches and
        kicks. She also is a skilled wrestler, easily defeating all her human challengers
        in the Beach City Underground Wrestling league. Her fighting style can sometimes
