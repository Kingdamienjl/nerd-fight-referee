    - field: intelligence
      value: Above Average (More through experience than actual intelligence. She
        is the least intelligent of the Crystal Gems) Standard Tactics Out of the
        Crystal Gems, Amethyst is the least likely to rely on her weapon in combat,
        instead of relying on her martial art skills and enhanced physical prowess
        as a method of dealing with the minor threats through forceful punches and
        kicks. She also is a skilled wrestler, easily defeating all her human challengers
        in the Beach City Underground Wrestling league. Her fighting style can sometimes
        be considered reckless and foolhardy; in "Monster Buddies", she used her whip
        to pull the Centipeetle Mother towards her, knocking her and the other Crystal
        Gems down.
      source_id: mediawiki-555136
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Enough damage to her physical form can revert her back to her vulnerable\
        \ gem form which can be broken and destroyed. She tends to fool around while\
        \ fighting. When she shrinks, the gem doesn\u2019t shrink with her. NewWhip.png|Amethyst's\
        \ whip. Amethyst spike weapon.png|Amethyst's upgraded whip. Notable Attacks/Techniques:\
        \ *Whip Morning-Star/Whip Proficiency: Amethyst is very skilled with her whip,\
        \ and mixes very well with her immense strength. She uses her whip to lash\
        \ at opponents and cause damage that is strong enough to easily split a dumpster\
        \ in half. Her lashes are sometimes so precise that they cut through objects\
        \ in a clean line. Occasionally, she uses her whip to grab onto objects or\
        \ lift them and throw them at the enemy. Amethyst can throw her whip to entangle\
        \ or bind her target from afar. As of \"Bismuth\", Amethyst's whip has been\
        \ upgraded to a morning star. It is also implied by Bismuth that her whip\
        \ is unusual among Quartzes. **Whiplash: Amethyst can send waves of purple\
        \ energy along her whip or whips to create an immense explosion. **Slicing:\
        \ Amethyst's whip is able to slice through solid metal. In \"Too Far\", her\
        \ whip cleanly sliced through an Injector. **Electrocute: Amethyst ensnares\
        \ an enemy in her whip and shoots electricty down her whip, shocking enemies.\
        \ *Shape-shifting: While all Gems are capable of shapeshifting, Amethyst is\
        \ particularly skilled at it, specializing in transformations. Her proficiency\
        \ is high enough where she was able to transform herself into a fully-functional\
        \ helicopter to transport the other Crystal Gems in \"Message Received\".\
        \ **Wrestling: Amethyst is a skilled wrestler, easily defeating all her human\
        \ challengers in the Beach City Underground Wrestling league. She also does\
        \ this by shapeshifting. *Enhanced Digestion: Amethyst can eat glass, plastic,\
        \ paper, etc. and can digest it without getting sick or disgusted. However,\
        \ she can still get food poisoning, but won't die from it. *Hair-Blade: Amethyst\
        \ can use her hair to slash at an enemy with such potency it severs the claw\
        \ of the Crab Gem Monster. *Spin Dash: Amethyst can rapidly roll into a ball-like\
        \ shape to attack enemies, but it is smaller than Jasper's. **Homing"
      source_id: mediawiki-555136
      provider_id: vsbattles
      authority: high
      confidence: 0.75
