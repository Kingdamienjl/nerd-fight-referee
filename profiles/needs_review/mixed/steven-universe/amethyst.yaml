        and mixes very well with her immense strength. She uses her whip to lash at
        opponents and cause damage that is strong enough to easily split a dumpster
        in half. Her lashes are sometimes so precise that they cut through objects
        in a clean line. Occasionally, she uses her whip to grab onto objects or lift
        them and throw them at the enemy. Amethyst can throw her whip to entangle
        or bind her target from afar. As of "Bismuth", Amethyst''s whip has been upgraded
        to a morning star. It is also implied by Bismuth that her whip is unusual
        among Quartzes. **Whiplash: Amethyst can send waves of purple energy along
        her whip or whips to create an immense explosion. **Slicing: Amethyst''s whip
        is able to slice through solid metal. In "Too Far", her whip cleanly sliced
        through an Injector. **Electrocute: Amethyst ensnares an enemy in her whip
        and shoots electricty down her whip, shocking enemies. *Shape-shifting: While
        all Gems are capable of shapeshifting, Amethyst is particularly skilled at
