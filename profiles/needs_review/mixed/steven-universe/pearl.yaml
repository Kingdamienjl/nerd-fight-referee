        in "Jail Break" and later shown in "Friend Ship", able to interface and control
        Gem technology such as the Gem Warship and, to a greater extent, Peridot''s
        escape pod. When she interfaces with Gem-tech, her eyes become overlapped
        with what looks like a programming code. *Water-Walking: Pearl can walk on
        water, an ability she shares with Opal, Lion, and Lapis Lazuli. *Photokinesis:
        Pearl can use her gemstone to light up dark places. She shares this ability
        with Garnet and Peridot. *Levitation: Pearl temporarily levitates to battle
        Sugilite in "Coach Steven". She shares this ability with the other two remaining
        Crystal Gems. *Pocket Dimension: As shown in "Library" Pearl is able to store
        objects in a pocket dimension located within her gemstone. She can also send
        people to this pocket dimension. **Item Summon: Pearl has the ability to materialize
        different items out of her gemstone. The three items summoned so far were
        police tape in "Lars and the Cool Kids", the Mirror in "Mirror Gem" and bandages
        in "Sworn to the Sword". *Holographic Projection: Pearl can project holographic
        images from her gemstone, which she uses mainly as a visual aid when lecturing
        Steven. While most of the holograms seem to be intangible, some, like Holo-Pearl,
        are able to interact with solid matter. Furthermore, the holograms can function
        without Pearl''s presence for up to two weeks, implying that her holograms
        can live independently. In "Chille Tid", it is shown Pearl''s dreams are projected
        as holograms as she sleeps. **Self-Duplication: Aside from Holo-Pearls, which
        is projected through her gemstone, Pearl can also replicate herself several
        times into hologram-esque clones of herself, as seen in "Beach Party". *Psammokinesis:
        Pearl is shown manipulating a small amount of sand to create figurines in
        "Giant Woman". It is currently unknown how much sand she can control at one
        time. This ability has only been shown once so far. *Nephelokinesis: In "Sworn
        to the Sword", Pearl can channel clouds in the direction of her choice, able
        to gather clouds surrounding the arena around her to create a fine mist, reducing
        visibility and able to quickly dissipate. Additionally, in "Mr. Greg", Pearl
        forms overhead clouds into depictions of herself, Rose and Greg during the
        song "It''s Over Isn''t It". ==Others== Notable Victories: Notable Losses:
        Inconclusive Matches: Category:StoneKillerz12 Category:Tier 7 Category:Tier
