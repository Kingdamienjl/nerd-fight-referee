- id: claim-weaknesses-3b3eaf2f
  section: weaknesses
  axis: weakness
  text: 'Enough damage to her physical form can make her unfuse back into Ruby and
    Sapphire. Further damage to them will revert them back to their vulnerable gem
    forms which can be broken and destroyed. If her emotional state becomes unstable,
    she will revert to Ruby and Sapphire (which is harder than it sounds as she is
    the most stable gem fusion), and possesses little problem-solving skills outside
    of combat. Her future vision loses effectiveness if the current timeline becomes
    extremely improbable, or she is unaware of important factors. Garnet''s Future
    Vision is also less effective without her visor, which helps her to refine what
    she sees with it. Notable Attacks/Techniques: Garnet''s Gauntlets PNG.png|Garnet''s
    debut Gauntlets NewGauntlets.png|Garnet''s post-regeneration Gauntlets BrassedGauntlets.png|Garnet''s
    Spiked Brass Knuckles 1568932862657.png|Garnet''s Gauntlets from "Change Your
    Mind" onwards. *Gauntlet Proficiency: When channeling the collective power of
    the universe through her gemstones, Garnet can summon a pair of gauntlets. Garnet
    is highly proficient when using her gauntlets and is extremely skilled in hand-to-hand
    combat. She can deal massive strikes that can easily shatter the earth and deliver
    swift blows with lightning speed. **Rocket Gauntlet: Garnet takes aim with her
    gauntlets and shoots them as projectiles in "Watermelon Steven". In "Reformed",
    after Garnet launches her gauntlets, her hands are detached from her body, and
    her gemstones are moved to the stubs of her arms. **Weapon Size Augmentation:
    Garnet can increase the size of her gauntlets, easily quadrupling their size,
    and deal increased damage at the cost of reduced speed. This was hinted during
    "Garnet''s Universe". Being an imaginary story, that means Steven knew about that
    power before the real debut. **Deflection: Garnet can use her gauntlets as shields
    as seen in "Onion Trade" to deflect a volley of Dave Guys. They are also used
    in "Catch and Release" to block Peridot''s electrokinetic discharge in Amethyst''s
    whip, although it is unknown whether Garnet simply prevented the electric current
    using her gauntlets or absorbed it with her electrokinesis. **Sonic Gauntlets:
    As seen in "Gem Harvest", Garnet can pound her gauntlets into something and create
    a sonic wave strong enough to make something, such as carrots, fly out of the
    ground. **Quake: Garnet smashes her fists into the ground, causing an earthquake
    to knock enemies back. **All or Nothing Garnet has a 50% chance of dealing MEGA
    damage, 50% chance of dealing no damage. *Photokinesis: In "It Could''ve Been
    Great", Garnet can be seen using Photokinesis along with Pearl and Peridot. This
    might be a power that every Gem can use. *Item Summon: Garnet has the ability
    to materialize different items out of her gemstone(s), similarly to Pearl. In
    "Serious Steven", she summoned the key to the Pyramid Temple. Who she inherited
    this ability from is unknown. *Future Vision: Garnet can see multiple future outcomes
    and probabilities with her third eye (Sapphire''s eye) as revealed in "Future
    Vision". This includes extremely unlikely and ridiculous outcomes, as a considerable
    amount of her available visions depict Steven''s (and possibly other individuals'')
    demise at the hands of mundane tasks or objects on a regular basis. The ability
    does take some time to use, as she has been shown in a thinking position when
    activating it. During that time, someone can alter the future, as seen in "Marble
    Madness", when Steven ruined the plan to learn about Peridot by going up to her
    while Garnet was still using future vision. This power comes from Sapphire, as
    confirmed in "Keystone Motel", although it is yet to be seen whether Sapphire''s
    prediction abilities are more accurate than Garnet''s. Her future vision seems
    to operate at will and with only specific details that she is looking for, as
    in "Cry for Help" when her future vision overlooked Pearl''s actions and their
    consequences, Garnet only noticed that Peridot was in none of the potential futures.
    Garnet''s future vision differs from Sapphire''s in that Sapphire constantly sees
    one long-term future while Garnet searches through multiple short-term futures.
    However, if the current timeline steers in a way that is far too improbable, or
    Garnet is unaware of important factors, she will not be able to use it as effectively.
    Garnet''s visor helps her refine her Future Vision so that it becomes clearer
    for her to read. This was explained in a stated to be canon OK K.O. crossover
    episode. **Temporary Power Transfer: In "Winter Forecast" and "Jail Break", it
    is shown that she can temporarily pass on her future vision ability to others
    through lip contact. While Garnet has only been seen using lip-to-forehead contact
    to transfer her power, it is unknown if this is the only method. As she has only
    been seen sharing her power with Steven, her affection could say bias on how she
    chooses to transfer the power. It is shown in "Future Boy Zoltron" that she is
    able to trans'
  source_ids: *id003
  decisive: false
  status: unverified
