    - field: weaknesses
      value: 'Early in the series, Steven had little control over his powers and could
        further lose control due to their reliance on his emotions, causing his abilities
        to not work and his shields to weaken if his state of mind/emotional state
        is poor, his half-human nature means he cannot use many of his gem abilities
        to the same extent as other gems, and they put much more strain on his body
        comparatively. Shield Proficiency: Due to possessing his mother''s gemstone,
        Steven can summon Rose''s shield. Steven is able to summon his shield at will
        with little effort at any moment he requires it and increase its size at will.
        Steven can summon his shield as many times as he wants without tiring, even
        summoning more than one and dual wielding shields, and he is able to use it
        in conjunction with his protective bubble as an added method of defense. The
        shield is remarkably durable, able to withstand a charged shot from the Gem
        Warship, and has reflective properties strong enough to reflect a laser fired
        from a scanning Robonoid. Projectile Shield: Steven can throw his shield as
        a projectile with great speed and power, weaponizing it as a ranged attack
        with enough accuracy to temporarily stun opponents. He can boomerang his shield
        off of several targets, causing it to return to his hand, and his shield has
        razor-sharp edges and can cut through substances as tough as solid rock before
        returning to him. Shield Vibration: On certain occasions when Steven''s shield
        is hit, it emits an audible vibration that disables magical constructs, such
        as Lapis''s water clones and Holo-Pearls. Shield Dash: Steven dashes towards
        his opponent and knocks them back with his shield, can run through multiple
        enemies and stun enemies. Bubble Shield: Steven can summon an incredibly durable
        bubble forcefield that encases him and others that he is protecting. Steven
        is capable of summoning it reflexively, can expand his bubble to push away
        enemies and break free from being trapped inside a solid object, and can can
        "pop" his bubble to knock surrounding enemies back. Besides the bubble offensively
        popping, Steven''s bubble has shown the ability to grow larger and smaller.
        The bubble can generate its own internal atmosphere, allowing Steven to survive
        in the bubble for hours underwater despite it being air-tight, and Steven
        is even able to breathe inside one he had just generated in the vacuum of
        space. He can also project his bubble around others and can create multiple
        bubbles in this way. Shape Alteration: Steven can change the size of his bubble,
        as well as change its shape from a sphere into a variety of other shapes -
        for instance, causing sharp spikes to appear along its surface, or stretching
        it to encompass and protect other people. Bubble Helmet: Steven can create
        a small bubble around his head to breathe in an oxygen-less atmosphere or
        protect his head from damage. Bubble Gloves: Steven can create small, hard
        bubbles around his fists like boxing gloves, enhancing the strength of his
        punches and his ability to block attacks. Shapeshifting: Steven possesses
        some level of the natural shapeshifting abilities typical of Gems, being able
        to transform parts of his body into cats and stretch various parts of his
        body at will. However, despite having more control over this power than initially,
        he can only do this for a certain amount of time and his half-human nature
        puts more of a strain on his body than it would a Gem. As of Future he shows
        that he can completely transform into a Gem monster many times his size and
        height. Fluctuating'
