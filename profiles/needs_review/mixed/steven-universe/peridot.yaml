- id: claim-weaknesses-f8d8cd83
  section: weaknesses
  axis: weakness
  text: 'Prefers using traps and technology to outright combat, she struggles to use
    technology that is less advanced than current Gem technology, and is physically
    the weakest Gem seen so far without her Limb Enhancers. She is an Era 2 Peridot,
    meaning she is not able to perform powers such as shapeshifting unlike other gems
    Notable Attacks/Techniques: *Photokinesis: "It Could''ve Been Great" Peridot is
    shown using her gemstone to project a green light, like a flashlight. It is the
    first natural Gem ability she has been shown to use. She shares this ability with
    Garnet and Pearl. *Ferrokinesis: In "Too Short to Ride", it is shown that Peridot
    can levitate and control metallic objects. The extent of Peridot''s powers, whether
    she manipulates magnetism or just the metal, is still unknown, though given as
    she was able to use the ability on her tablet without damaging the device''s circuitry,
    magnetism appears unlikely. It is possible this ability is what made her so proficient
    with her limb enhancement''s fingers, particularly the ''finger copter'' ability.
    In "Beta" she can hold up an entire one-man band of metal instruments (though
    drops them after concentrating on playing the harmonica). In "Earthlings", once
    properly motivated, she proves capable of using this to throw a piece of scrap
    metal with enough force to impale the now corrupted Jasper through the chest,
    poofing her. In "The New Crystal Gems", Peridot is shown to have more control
    over this ability, being able to lift up trucks and other cars. It requires some
    physical and mental strain on her part, but once the vehicle has been lifted off
    of the ground, her ferrokinesis makes it effectively weightless. In "Room For
    Ruby", Peridot is seen casually using this power to raise an umbrella over her
    and Lapis'' head, and raise a trash can lid up to Lapis while she, Steven, and
    Pumpkin are standing on it, showing she has mostly mastered this ability. The
    exact maximum she can lift with this ability is unknown, but she has shown capable
    of lifting several tons with little effort. *Bubbling: As revealed in "Kindergarten
    Kid", Peridot is able to bubble objects. Her bubbles are lime green and are sent
    to The Barn instead of being sent to the Burning Room inside the Temple, because
    the Barn is where Peridot considers home. Current Additional Tools *Earth Tablet:
    A gift from Steven (who received it from Greg), she uses it to explore the media
    and express her feelings shown by "Too Short to Ride", she also said it is something
    to love, for she no longer has advanced gem technology. **Tablet Throw: Peridot
    uses her ferrokinesis to launch her tablet at enemies, causing an explosion upon
    impact. *Attack Drones: Built sometime before "Gem Harvest", Peridot created attack
    drones to defend the barn in case of invasion. Each is a spherical turret, moving
    a propeller and controlled by remote. Their design is similar to Peridot''s Flask
    Robonoid; whether these are new drones made from their design, or simply modified
    robonoids is unknown. *Pericannon: Peridot builds a "Pericannon" that shoots projectiles
    constantly at enemies. Can build up to 3. **Molten Core: When activated, all Pericannons
    become supercharged and deal extra damage for 5 seconds. Works by Peridot sending
    a pulse out from her body which activates the Molten Core. *Landmine: Peridot
    builds a landmine that when stepped on, explodes dealing damage. Can build multiple
    landmines. Former Additional Tools *Limb Enhancers: Mechanical body extensions
    Peridot has worn since her debut until the Crystal Gems catch her in "Catch and
    Release". **Anatomical Separation: Peridot can separate sections of her limb enhancers
    by touching a lime-colored button at the zone she wants to remove. **Blaster:
    Peridot can transform her fingers of her right arm into a blaster which can charge
    and fire an electrified energy ball which explodes on impact. Charging it for
    a second produces a shot powerful enough to blast through the ceiling of the Ancient
    Gem Colony Ship. Charging it for several seconds produces a large shot which can
    knock down a thick stone pillar, and has enough recoil to knock Peridot onto her
    back. **Holographic Interface: Peridot can project a holographic touchscreen from
    the fingers of her right hand, in which she can control and connect to different
    forms of Gem technology. **Tractor Beam: Peridot can produce a light-green tractor
    beam from her left hand to move objects/people. **Wall-Scaling: Peridot can freely
    run up vertical walls without falling. **Helicopter Fingers: Peridot can expand
    the fingers of either hand and spin them rapidly enough to fly. *Gem Destabilizer:
    In "Jail Break", Peridot wields a Gem Destabilizer, an extremely potent but non-lethal
    tool used to subdue enemy Gems. *Robonoids: Peridot can control different types
    of spherical robots known as Robonoids. There are three types of known Robonoids:
    Flask, Plug and Hand. They can perform multiple functions, such as fixing a Warp
    Pad and activating Kindergarten.'
  source_ids: *id004
