    - field: intelligence
      value: Above Average (Being a Quartz Gem, Jasper was naturally created for combat.
        According to Peridot, a certified Kindergartener skilled enough to identify
        the type of Gem that emerged from a particular exit hole with a glance, Jasper
        is a superior specimen even among her own kind and is considered the greatest
        Quartz produced on Earth. She is also strong of will, able to mentally overwhelm
        Lapis if she had stopped using all of her concentration to subdue her even
        for a second), Animalistic when corrupted (Due to her mind being torn, Jasper's
        intelligence is now that of a mindless animal)
      source_id: vsbattles-peridot-mixed
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Sufficient damage to her physical form can revert her back to her vulnerable\
        \ gem form which can be broken and destroyed. Very reckless and self-loathing\
        \ due to her origins. Willing to abandon her morals for the sake of winning\
        \ at any cost. Her corruption leads her to lose all hopes of intelligence.\
        \ Notable Attacks/Techniques: *Crash Helmet Proficiency: By gathering her\
        \ resolve and thirst for battle, Jasper can summon her weapon; a tangerine,\
        \ crystalline helmet. The helmet acts both as a weapon and armor; a hammer-like\
        \ protrusion in the front of the helmet allows her to use it to charge, slam,\
        \ and headbutt her opponent, while a clear orange-tinted visor extends down,\
        \ covering the upper part of her face. The sturdiness of the helmet rivals\
        \ that of Garnet's gauntlets, as Jasper was shown continuously countering\
        \ her attacks. *Martial Arts: Further reflecting the similarities between\
        \ herself and Amethyst, Jasper is likewise prone to mixing up her weapon-based\
        \ attacks with martial arts moves, such as grappling, throwing, or simply\
        \ punching her opponent. Due to the nature of her weapon, the two styles mix\
        \ seamlessly and combine into a powerful, but ultimately reckless fighting\
        \ style with immense collateral damage. **Headbutting: As the name implies,\
        \ Jasper shows she can headbutt without her weapon. This version, although\
        \ weaker without her helmet, still has the potential to knock out a human\
        \ being, as seen with Steven in \"The Return\". *Comet Charge: Jasper can\
        \ lunge at her foes with alarming speed and power. Evidence shows as the attack\
        \ breaks through layers of a hard gemstone. While she performs this attack,\
        \ a fiery aura forms around her. *Spin Dash: Jasper can rapidly roll in a\
        \ ball-like shape to attack enemies. While Amethyst was shown to have this\
        \ ability as well, it seems that Jasper's version is more powerful, and is\
        \ more of a threat than Amethyst's. Jasper can also use the technique to dash\
        \ across a spacious room and plunge into the air. *Gem Destabilizer: Homeworld\
        \ Gems, in addition to their summonable weapon, seem to carry a personal defense\
        \ weapon known as Gem Destabilizers \u2014 extremely potent, non-lethal tools\
        \ used to subdue enemy Gems. Jasper is seen using this weapon on Garnet in\
        \ \"The Return\". She attempts to use it again in \"Jail Break\", but Garnet\
        \ pried it from her hand and broke it immediately afterward. *Corruption:\
        \ As of \"Earthlings Part 2\" Jasper has become corrupted after fusing with\
        \ another corrupted quartz to retain her dignity. This form of Jasper makes\
        \ her a lot bigger and more monstrous, as well as it makes Jasper completely\
        \ lose control of herself. Corruption also seems to strip gems of some of\
        \ their basic powers. They are unable to summon their weapons or use warp\
        \ pads and other Gem structures, such as a door to a spaceship. ==Notable\
        \ Matchups== Victories: Doomsday (Superman: Doomsday) Doomsday's Profile (Speed\
        \ was equalized) Losses: Spinel (Steven Universe) Spinel's Profile Inconclusive:\
        \ {{Discussions}} Category:Characters Category:Cartoon Characters Category:Steven\
