      stay within the Turbo Megazord fighting Pharaoh from sunset until morning without
      any rest and didn't tirePower Rangers Turbo Episode 10; Glyph Hanger)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range physically, Extended Melee Range with the Turbo Blade,
      Hundreds of Meters with the Turbo R.A.M. (Can hit targets up to 700 yards which
      translate to 640 meters), Kilometers with Auto Blaster and the Turbo Hand Blasters
      (Should be superior to older powers), Hundreds of Kilometers with the Turbo
      Navigator and the Mountain Blaster Turbozord (The Turbo Navigator can scan and
      blast down foes across the entirely of Angel Grove which translates to 196km^2.
      The Turbozord should be superior to that)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'At least Genius (As the Blue Ranger he should be this smart. He is stated
      to be as smart as any Ranger that appeared before him. Justin is a prodigy that
      got into high-school at the age of 12Power Rangers Turbo Episode 3; Shift Into
      Turbo, Part III. He was able to create his own rally-kid car in a night. Justin
      was able to quickly de-activate the Blue Senturion the moment he opened the
      control panelPower Rangers Turbo Episode 13; The Millennium Message. While fighting
      Elgar, Justin was able to use his opponent''s weapons to his own advantage making
      Elgar''s sword cut his chainsPower Rangers Turbo Episode 21; The Wheel of Fate.
      Was able to rewire Divatox''s freezing machinePower Rangers Turbo Episode 25;
      When Time Freezes Over. The Rangers were able to build a very advanced magnet
      that would pull Divatox''s spaceship in outer space towards earthPower Rangers
      Turbo Episode 29; Clash of the Megazords) Standard Tactics: The Rangers are
      always cautious of their opponents and their abilities, trying to figure them
      out and formulate a strategy against themPower Rangers Turbo Episode 9; Built
      for Speed. Justin engages into close combat with his weapons aiding him in battle.'
    source_ids: *id002
    confidence: 0.8
