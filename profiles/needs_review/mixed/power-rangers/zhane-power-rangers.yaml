- id: claim-standard-equipment-55be6bf0
  section: equipment
  axis: equipment
  text: 'right|350px SuperSilverizerBlaster.webp|Blaster mode SuperSilverizerSword.webp|Sword
    mode Silver Cycle.webp|Motorcycle mode Galaxy Glider.webp|Galaxy Glider mode right|350px
    right|350px * Digimorpher: The morpher that Zhane uses to transform into the Silver
    In-Space Power Rangers. It has 12 buttons that Zhane can press to activate its
    various uses. By entering 2-5-8-0 they transform into Power Rangers. By entering
    2-5-9 the Ranger can summon his Galaxy Glider/Silver Cycle. The code 1-4-8 connects
    the Silver Ranger with the computer D.E.C.A.. The code 5-0-6 creates a communication
    signal. It is to be noted that Zhane never used any of these combinations other
    than the standard 2-5-8-0 since he can access their equipment normally without
    the use of the Astro Morpher but it is an option they have in case its needed.
    * Super Silverizer: Zhane''s personal weapon. It is used primarily in his fights
    and can freely switch between its gun mode and sword mode. The gun mode shoots
    continuous blasts of energy at the opponent and the sword mode is used to slash
    the opponent like a sword. At full power the sword mode creates big energy slashes
    that destroy the opponent similar to a finisher. * Silver Cycle: Zhane''s personal
    vehicle. It is used to traverse through all kinds of terrains and it has 2 modes,
    the motorcycle mode and the Galaxy Glider mode. The motorcycle mode also contains
    laser blasters. The Galaxy Glider mode is used to fly around and chase fast enemies
    in the ground, sky or space. The Galaxy Glider can also be called mid-battle to
    damage enemies. * Galactic rover: A dune buggy vehicle that can shoot energy blasts
    and is strong enough to easily kill and destroy Darkonda * Mega Winger: Zhane''s
    personal Zord that change between Warrior mode and Spaceship mode'
  source_ids: *id003
  decisive: false
