- id: claim-powers-and-abilities-87b1c899
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Martial Arts (Zhane is a great martial
    artists that can match and beat aliens and even impressing the rest of the Power
    Rangers. Knows over 20 martial arts techniques and was able to excel in armed
    forces and rose in the ranks. Comparable to Andros) *Acrobatics (Alongside Andros
