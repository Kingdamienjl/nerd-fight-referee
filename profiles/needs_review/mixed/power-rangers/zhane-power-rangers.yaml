    the Rangers use to fly in the sky or in outer space, skilled enough to pilot through
    dense and deep forestsPower Rangers In-Space Ep14; The Barillian Sting, through
    enemy spacecrafts in spacePower Rangers In-Space Ep1; From Out of Nowhere Part
    I and through towns with gravity far superior to that of earthPower Rangers In-Space
    Ep16; Flashes of Darkonda. He can also pilot the Galactic Rover which is a high
    powered dune buggy vehiclePower Rangers In-Space Ep40; The Impenetrable Web. He
    can pilot highly advanced computer systems like Zords) *Stealth Mastery (Infiltrated
    Astronema''s base together with AndrosPower Rangers In-Space Ep30; Dark Specter''s
    Revenge, Part II. Disappeared from everyone''s sight during a small explosion)
    *Weapon Mastery (Has mastery over the Super Silverizer which is both a blaster
    and a saber. The Rangers can use any object as a weapon. Comparable to Andros
    and has clashed swords with Darkonda and Ecliptor) *Transformation (Into the Silver
    In-Space Ranger) *Telekinesis (Much like Andros. Zhane can move objects with his
    mind) *Supernatural Willpower (Brought himself back to life after dyingPower Rangers
    In-Space Ep20; Survival of the Silver) *Extrasensory Perception (He can see visions
    of people when they are in dangerPower Rangers In-Space Ep21; Red with Envy) *Accelerated
    Development (Battle and Training; The Power Rangers constantly train to get stronger
    and faster, measurably soPower Rangers Unlimited: Heir to Darkness. They are capable
    of increasing their strength mid-combat to one shot enemies who were previously
    overpowering themPower Rangers In Space Episode 24; Zhane''s Destiny. Despite
    not being able to do a single damage to Red Ecliptor, the Rangers later into the
    fight were able to heavily damage him and defeat him) Resistances=Extreme Heat
    (The Rangers can operate on planet without their suits. planet is hot enough to
    affect people like Elgar who can bath in lava with no issues) *Morphin Grid Energy
    (Ranger Physiology/Silver Ranger) *Teleportation (Capable of teleportingPower
    Rangers In-Space Ep12; The Great Evilyzer) *Spatial Manipulation (The Rangers
    can break space with their punchesPower Rangers In-Space Ep5; Never Stop Searching)
    * Super Silverizer ** Attack Reflection (Should be able to reflect attacks like
    every other weapon in the arsenal of the Rangers) ** Energy Projection (Gun mode
    shoots continuous energy blasts and Sword Mode creates big energy slashes) **
    Power Nullification (Comparable to the Astro Blaster which is capable of projecting
    a beam that nullifies effects that reprogram devices or living beingsPower Rangers
    In-Space Ep12; The Great Evilyzer) * Standard Power Ranger Resistances * Poison
    Manipulation (Their suit protect them from the poisonous breath of CrocotoxPower
