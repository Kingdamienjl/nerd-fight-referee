  intelligence:
    text: "Extraordinary Genius (Darkonda is a cunning individual who always plots\
      \ something behind the scenes. He finds classic traps like an ambush to be \"\
      predictable\" and \"old fashioned\" as he always finds more creative plans.\
      \ Managed to get into Astronema's ship catching everyone off-guard as nobody\
      \ should be able to do so. Darkonda has been everywhere and has seen everything,\
      \ this extended knowledge can be used against his opponents in order to create\
      \ plans utilizing relics and extraterrestrial objects or use them for diplomacy\
      \ and information tradingPower Rangers In-Space Ep16; Flashes of Darkonda. Darkonda\
      \ is knowledgeable when it comes to science as he is able to do various experiments\
      \ in his lab such as creating Crocotoxes. Darkonda is also good at planning\
      \ and deceiving others as he was able to fool the entire KO35 colony on Centauri\
      \ b to gain their trust and become a general so he can plant a fake energy source\
      \ to trap the Rangers and make them look like the bad guys so they can be destroyed.\
      \ Darkonda is a warlord and a war criminal, being responsible for many of the\
      \ United Alliance of Evil\u2019s atrocities, including the dark sciences of\
      \ cloning and bio-reprogramming that programmed Astronema and created the Psycho\
      \ Rangers. Despite being a sadist and a psychopath, Darkonda has a keen mind\
      \ for tactics and problem solving) Genius (Darkonda is a tactical mind that\
      \ can keep up and with some of the universe's greatest fighters and outsmart\
      \ them such as Ecliptor, Zhane the Silver In-Space Ranger and Andros the Red\
      \ In-Space Ranger)"
    source_ids: *id002
    confidence: 0.8
