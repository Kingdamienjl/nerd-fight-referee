  name: Resistance to Time manipulation (The energems completely trascend the space-time
    itself, this allows the rangers to comp
  description: 'Resistance to Time manipulation (The energems completely trascend
    the space-time itself, this allows the rangers to completely bypass time as seen
    from them not being effected by time travel or making them forever young as time
    does not pass for them), Resistance to Space Radiation (Fine being in space),
    Resistance to Memory Manipulation (Zenowing kept his memories after he touched
    the dark energem), Limited Resistance to Morality Manipulation and Corruption
    (while he was effected by the mailicious energy of the dark energem he was still
    able to somewhat keep a small piece of his kidness, after he sees a heroic movement
    he can completely snap out of it), Resistance to Absorption (The energem allows
    one to break free from absorption), to Ice Manipulation (The energem prevent the
    rangers from being frozen), to Paralysis Inducement (Took an energy slash from
    Doomwing that was able to paralyze Riley making incapable of movement and thus
    knocking him out for an entire day) and to Fear Manipulation through Supernatural
    Willpower (All rangers are capable of resisting the fear powers of Bones through
    their will and bravery) All previous plus Enhanced Skills and Acrobatics (When
    a ranger morphs, their skill are heavily enhanced to the point even a person who
    is horrible at martial arts can become a "Lethal Weapon", destroyed Doomwing in
    combat despite the latter mastering all of Zenowing''s combat skills), Explosion
    Manipulation (His pose triggers explosions), Magma Manipulation (Like all the
    other Dino Charge rangers, his pose can Trigger Volcanic Eruptions), Shockwave
    Creation (His attacks create shockwaves Super Dino Charge episode 14), Light Manipulation
    (The Silver Dino Charge Rangers can cover himself in light), Statistics Amplification
    (He can also increase his speed to the point of blitzing Doomwing. He can also
    cover his punches in energy to amplify their power Super Dino Charge episode 14),
    Regeneration Negation (Mid-High: Permanently killed Doomwing who regenerated after
    being disintegrated), Limited Durability Negation (The finishers of the Power
    Rangers can make weakened or weaker opponents explode into nothing), Transformation
    (Can transform his Titano zord to the Titano Charge Megazord), Resistance to Deconstruction
    (Similar to the other Dino Charge rangers, he can take Goldar Maximu''s energy
    attacks which can deconstruct Sledge), Resistance to Heat Manipulation (The suit
    of the dino charge rangers protect the user from heat, Tyler while extremely weakened
    was ok inside a volcano) and to Electricity Manipulation (All rangers were fine
    after they took a blast which included 10 million gigavolts worth of electricity)'
