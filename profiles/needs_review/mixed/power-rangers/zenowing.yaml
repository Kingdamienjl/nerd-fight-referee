- id: claim-powers-and-abilities-d4c803ab
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Longevity (As old as Lord Arcanon and
    Sledge), Magic (capable of using magic), Healing via Titano Saber (Was able to
    heal riley), Power Bestowal via Titano Saber (Gave the power of "Prism Slash"
    to Riley), Purification (Purified the dark energem), Summoning (Can summon his
    zord, the Titano Zord), Enhanced Senses (Was able to sense the Silver Energem),Super
    Dino Charge episode 15 Energy Projection (Can send energy attacks), Invisibility
    (Made an entire world invisible Mighty Morphin Power Rangers issue 35), Acrobatics
    (All the rangers are very acrobatic), Energy Manipulation (Some of his attacks
    are energy based such as "Prism Slash"), Flight (Can use his wings to fly and
    is able to fly in space as well), Self-Sustenance (type 1: Fine being in space),
    Explosion Manipulation (Some of his attacks cause explosions), Weapon Mastery
    (The titano saber), Martial Arts and Genius Intelligence (Zenowing is an incredibly
    intelligent scientist, capable of building Zords and advanced spaceships capable
    at flying at Massively FTL speeds. He is also incredible skilled and he can keep
    up with Lord Arcanon himself and seemingly somewhat outskill and Doomwing who
    mastered all of Zenowing''s skills, also keep in mind that zenowings techniques
    are so complex and hard to learn that even master swordmans like Riley cant hope
    to learn it in his entire life), Transformation (Can transform into the Silver
    Ranger), Acausality (Type 1), Immortality (Type 1) and Resistance to Time manipulation
    (The energems completely trascend the space-time itself, this allows the rangers
    to completely bypass time as seen from them not being effected by time travel
    or making them forever young as time does not pass for them), Resistance to Space
    Radiation (Fine being in space), Resistance to Memory Manipulation (Zenowing kept
    his memories after he touched the dark energem), Limited Resistance to Morality
    Manipulation and Corruption (while he was effected by the mailicious energy of
    the dark energem he was still able to somewhat keep a small piece of his kidness,
    after he sees a heroic movement he can completely snap out of it), Resistance
    to Absorption (The energem allows one to break free from absorption), to Ice Manipulation
    (The energem prevent the rangers from being frozen), to Paralysis Inducement (Took
    an energy slash from Doomwing that was able to paralyze Riley making incapable
    of movement and thus knocking him out for an entire day) and to Fear Manipulation
    through Supernatural Willpower (All rangers are capable of resisting the fear
    powers of Bones through their will and bravery) All previous plus Enhanced Skills
    and Acrobatics (When a ranger morphs, their skill are heavily enhanced to the
    point even a person who is horrible at martial arts can become a "Lethal Weapon",
    destroyed Doomwing in combat despite the latter mastering all of Zenowing''s combat
    skills), Explosion Manipulation (His pose triggers explosions), Magma Manipulation
    (Like all the other Dino Charge rangers, his pose can Trigger Volcanic Eruptions),
    Shockwave Creation (His attacks create shockwaves Super Dino Charge episode 14),
    Light Manipulation (The Silver Dino Charge Rangers can cover himself in light),
    Statistics Amplification (He can also increase his speed to the point of blitzing
    Doomwing. He can also cover his punches in energy to amplify their power Super
    Dino Charge episode 14), Regeneration Negation (Mid-High: Permanently killed Doomwing
    who regenerated after being disintegrated), Limited Durability Negation (The finishers
    of the Power Rangers can make weakened or weaker opponents explode into nothing),
    Transformation (Can transform his Titano zord to the Titano Charge Megazord),
    Resistance to Deconstruction (Similar to the other Dino Charge rangers, he can
    take Goldar Maximu''s energy attacks which can deconstruct Sledge), Resistance
    to Heat Manipulation (The suit of the dino charge rangers protect the user from
    heat, Tyler while extremely weakened was ok inside a volcano) and to Electricity
    Manipulation (All rangers were fine after they took a blast which included 10
    million gigavolts worth of electricity)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
