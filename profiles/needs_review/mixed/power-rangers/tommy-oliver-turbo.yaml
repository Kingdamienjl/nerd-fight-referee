- id: claim-standard-equipment-7d4a25ea
  section: equipment
  axis: equipment
  text: 'right|350px AutoBlasterRender1.png|Normal mode AutoBlasterRender2.png|Turbo
    mode TurboNavigatorRender.png|Turbo Navigator TurboNavigatorDefenderModeRender.png|Turbo
    Navigator Defender mode AutoBlasterDefenderRender.png|Auto Blaster Defender right|350px
    right|350px Turbo R.A.M.=right|350px right|350px right|350px *Turbo Morpher: The
    Turbo Morpher is the personal Morpher of the Turbo Rangers. It materializes on
    their wrists whenever they need to transform. The Ranger puts the Turbo key within
    the Turbo Morpher shouting "Shift into Turbo" which activates the transformation
    sequence. *Auto Blaster: The average blaster in the arsenal of the Turbo Rangers.
    It is used regularly by the Turbo Rangers in almost all scenarios. The gun has
    2 modes, the Normal mode and the Turbo mode the latter which is used to increased
    the power of the blaster to shoot supercharged blasts. It can also combine with
    the Turbo Navigator to form the Auto Blaster Defender. *Turbo Navigator: As the
    name suggest the Turbo Navigator is a device used by the Turbo Rangers that allows
    them to scan and detect energies, extrasterrestials and devices let that be in
    this dimension or another. The Turbo Navigator also has te function of analyzing
    and scanning properties of anything its connected to. The Navigator can also switch
    to Defender mode which allows it to shoot energy blasts and create energy constructs
    that can bind others. Furthermore it can also combine with the Auto Blaser to
    create the Auto Blaster Defender which can create homing energy blasts. *Turbo
    Blade: The Turbo Blade is the common sword in the Turbo arsenal and it''s used
    by all the Turbo Rangers. It is made by the strongest steel and its virtually
    indestructible, its defense is good enough to increase the confidence of the Turbo
    Rangers during combat. The handle that it has on the back can be pulled for an
    extra power boost. *Turbo Lightning Sword: The personal weapon of the Red Turbo
    Ranger, weighting at 30lbs, it is a sword that can discharge electricity with
    each attack and can charge itself in order to unleash a devastating attack on
    its opponents. It is forged of Titanium alloys and can cut through 3" of solid
    steel. The Sword can also be fully charged to unleash a devastating blow. *Turbo
    R.A.M.: The Turbo R.A.M. which stands for Robotic Arsenal Mobilizer is a race
    car that has the five weapons of the Power Rangers on top. The R.A.M. can transform
    into the cannon mode which lets the Rangers to combine their five weapons'' strength
    into a single powerful attack that destroys the monsters in a single hit. The
    Turbo RAM is 70 inches long and its top speed is 310 miles per hour with the range
    of 700 yards. *Red Turbo Cart: The Turbo Carts are used by the Turbo Rangers in
    order to chase down enemies and can go up to 200 miles per hour with the max speed
    breaking the sound barrier. The Red Turbo Cart has tracking system that allows
    it track down and mark enemies up to 20 miles and can freely switch between 2
    weapon systems, the rapid-fire energy blast system and the missile system depending
    on the distance of the enemy. The Carts also become the cockpits of the Turbozords.
    *Red Lightning Turbozord: The most powerful weapon in a Turbo Ranger''s arsenal
    is without a doubt their zord. Tommy pilots the Red Lightning Turbozord, the strongest
    and most advanced Zord ever built at the time. Its functions should be at least
    comparable to the zords of the past.'
