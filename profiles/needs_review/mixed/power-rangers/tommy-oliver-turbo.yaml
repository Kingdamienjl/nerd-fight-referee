      fought with the Blue Senturion and used his acrobatics effectively combining
      them with the environment around him. During combat the Rangers can use their
      extensive knowledge on physics and chemistry to figure out how to deal with
      abilities of their opponents. The Rangers have been able to use the weapon of
      their opponents to their advantage to get out of tricky situationsPower Rangers
