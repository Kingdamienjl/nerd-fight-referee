      Rangers were able to easily take down Havoc''s elite soldier squad that was
      trained expertly on underwater and land fightsPower Rangers Turbo Episode 26;
      The Darkest Day. The Turbo Rangers can counter and fight enemies thanks to the
      sounds they make, without the need of seeing them. Should be comparable to Rangers
      such as T.J.) Standard Tactics: The Rangers are always cautious of their opponents
      and their abilities, trying to figure them out and formulate a strategy against
      themPower Rangers Turbo Episode 9; Built for Speed. Tommy will use his weapons,
      mostly his swords, for close combat and his blasters for ranged combat although
      it is common for him to start blasting his opponent even if his opponent lacks
      the means of ranged capabilities. Tommy as said above, studies his opponent
      making him plan ways of fighting his opponent as he learns them.'
    source_ids: *id002
