- id: claim-powers-and-abilities-ed4acfcd
  section: abilities
  axis: hax
  text: 'Should be the same as his past self that include * Superhuman Physical Characteristics
    * Martial Arts and Pressure Points (As good as JasonMighty Morphin Power Rangers
    S1 Ep17; Green with Evil, Part I: Out of Control) ** Acrobatics (The power rangers
    even while unmorphed are extremely acrobatic allowing them to dodge range attack
    spam with sheer skill Power Rangers Zeo Episode 6; Rangers in the Outfield) **
    Vehicular Mastery (Capable of riding trucks Power Rangers Zeo Episode 28 aswell
    as his bike Power Rangers Zeo Episode 31) ** Stealth Mastery (Got into Santa''s
    workshop without any monster seeing himMighty Morphin Power Rangers S3 Ep16; I''m
    Dreaming of a White Ranger) ** Power Mimicry and Analytical Predictions (The Rangers
    are implied to be able to predict attacks based on the footwork of the opponent
    Mighty Morphin Power Rangers S1 Ep48, their fighting style also includes anticipating
    attacks Saban''s Go Go Power Rangers issue 5. More details on the intelligence
    section) ** Weapon Mastery (Better than JasonMighty Morphin Power Rangers S1 Ep26;
    Gung Ho!) * Transformation (Into the Red Turbo Ranger) * Social Influencing (Tommy
    is charismatic enough that everyone looks up to himMighty Morphin Power Rangers
    S3 Ep26; Rita''s Pita) * Teleportation (All Power Rangers can teleport Power Rangers
