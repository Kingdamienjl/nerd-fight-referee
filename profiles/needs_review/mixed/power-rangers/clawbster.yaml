- id: claim-powers-and-abilities-c21b4836
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Dark Magic (All their powers and abilities
    are magical in nature), Martial Arts (Easily overpowered the Rangers in combat
    Power Rangers Mystic Force episode 4), Bodily Weaponry (His claws), Enhanced Senses
    (Monsters in Mystic Force were able to feel the Gatekeeper Power Rangers Mystic
    Force episode 11 and track down sound Power Rangers Mystic Force episode 18 and
    magic dimensions away), Energy Projection and Danmaku (Can create a barrage of
    energy blasts ), Fire Manipulation and Explosion Manipulation (Can shoot fire
    balls which explode ), Petrification (Petrification lazer eyes ), Self-Sustenance
    (Type-1: All monsters of the underworld are fine in outer-space) and Non-Physical
    Interaction (Comparable to Koragg and other monsters of the underworld) Fire Manipulation
    and Electricity Manipulation (Should be capable of taking attacks of the rangers
    like the other warriors of the Underworld), Radiation Manipulation, Ice Manipulation
    and Poison Manipulation (Monsters of the Underworld are resistant to outer-space
    effects and those of the RPM world MMPR issue 28 MMPR issue 30) and Petrification
    Nullification (Udonna''s magic cannot nullify the petrification spell ), Sleep
    Manipulation (monsters outside of earth are immune to gasses including sleeping
    ones Power Rangers Operation Overdrive Magazine issue 51), Mind Manipulation (monsters
    of the underworld are immune to the DJ hypnotic music Power Rangers Mystic Force
    episode 8), Power Nullification and Power Absorption (Since everyone has their
    power connected to magic, they are never without magic, they just have to believe
    in what ther magic is connected to and they will have their powers restored Power
    Rangers Mystic Force episode 32), Deconstruction and possibly Existence Erasure
    (Monsters higher than Leelee, who is not even a true underworld being, can survive
    a forcefield that wipe others out of existencePower Rangers Mystic Force episode
    13)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
