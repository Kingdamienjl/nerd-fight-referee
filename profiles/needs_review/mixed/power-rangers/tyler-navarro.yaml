    - field: standard_equipment
      value: 'As a Power Ranger, Tyler has access to a large arsenal of varied weapons,
        armors and other tools. These pieces of equipment include:, Dino Charger:
        A rather powerful tool in combat. While this item can''t be used as a direct
        attack the different chargers can be used to either summon various Zords in
        combat or gain powers and/or new pieces of gear to use in battle., Dino Cycle
        Charger: Summons a dinocycle, which is a faster alternative than walking.,
        Dino Armor X Charger: One of the most consistent Dino Chargers to be used
        by the Rangers. This charger conjures up an additional piece of armor., T-Rex
        Super Charger: This Dino Charger allows Tyler to access his T-Rex Super Charge
        mode, which greatly enhanced his abilities in nearly every regard. Additionally,
        this mode allows Tyler to augment his Ranger Armor even more by gaining powers
        from various Zords to add to his own., Dino Saber: The Dino Saber is the Rangers
        primary tool for melee combat when they''re not relying on hand-to-hand martial
        arts. The Saber is remarkably powerful, being able to match that of Slides
        sword and mortally wound high ranking generals. Additionally, the Saber can
        be powered up with Dino Chargers to release a powerful slash that almost always
        finishes off the enemy., Dino Blaster: A rather powerful weapon, the Dino
        Blaster is a handgun-like-laser that shoots small, but surprisingly damaging
        blast that can hurt even generals., T-Rex Smasher: An immensely powerful hammer-like
        add-on that increases Tylers strength considerably. This weapon was strong
        enough to easily shatter asteroids and even injure Sledge., Ranger suit: The
        suit of the Ranger. The material is a self-assembling nano-fiber formed with
        an intercellular shape memory alloy'
      source_id: mediawiki-552708
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Unknown (Tyler is simple-minded and somewhat dimwitted, so much so that
        Koda is occasionally depicted as the more "able" of the two intellectually.
        This is shown in his poor spelling and is probably due to Tyler not going
        to school since he was a kid. None the less, Tyler has proved himself time
        and time again to be a more than capable leader and expert martial artist,
        being able to match Fury, a being who has literally millions of years worth
        of combat experience, blow for blow. Additionally, Tyler was shown to be a
        decent in the arts of subterfuge, as shown in his stealthy assault on Sledge's
        ship)
      source_id: mediawiki-552708
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Consistently dodges lasers, Traded blows and nearly defeated several
        of Lord Sledges henchmen while unmorphed., Kept pace with Ice Age, Completely
