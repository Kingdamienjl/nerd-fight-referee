  name: Resistance to Time manipulation (The energems completely trascend the space-time
    itself, this allows the rangers to comp
  description: 'Resistance to Time manipulation (The energems completely trascend
    the space-time itself, this allows the rangers to completely bypass time as seen
    from them not being effected by time travel or making them forever young as time
    does not pass for them), Martial Arts (Tyler was repetitively shown to be a great
    fighter even while unmorphed, he is capable to engaging in combat with the most
    dangerous criminals in the universe including people like fury who are extremely
    skilled in their own right), Size Manipulation (Can change the size of his Zord
    so he can transform into the T-Rex Super Dino Charge Ranger), Gas Manipulation
    (With his Dino Gas Charger he can make his zord release a deadly gas), Explosion
    Manipulation (Some of his attacks can cause explosions), Energy Projection (Some
    of his attacks are energy based), Fusionism (Can fuse his zord with other zords
    in order to form megazords, he can combine his Morpher with his Saber to create
    the Dino Blade Blaster and can combine all the Ranger''s weapons into the Dino
    Spike using the Dino Spike Charger), Flight (Can summon the Plesio Zord which
    allows him to fly), Acrobatics (All the rangers are very acrobatic), Weapon Mastery
    (The Dino Charge Morpher and the Dino Saber), Fire Manipulation (With Dino Blaze
    Charger he can make his zord breath fire), Heat Manipulation (His Dino Blaze Charger
    is a hot beam that melts ice), Stealth Mastery (Was able to sneak into Sledge''s
    ship without anyone noticing him Dino Charge episode 20), Summoning (Can summon
    his motocycle, the Dino Cycle and his zords), Statistics Amplification (The energem
    can amplify one''s stats), Information Analysis (His communicator contains a map
    and a scanner that traces alien biosights, his motorcycle, the Dino Cycle also
    tracks down energy), Transformation (Can transform into the Red Dino Charge Ranger
    and the T-Rex Super Dino Charge Ranger) and Resistance to Ice Manipulation (The
    energem prevent the rangers from being frozen) to Fear Manipulation through Supernatural
    Willpower (All rangers are capable of resisting the fear powers of Bones through
    their will and bravery), to Absorption (The energem allows rangers to break free
    from absorption) and to Sleep Manipulation (Resisted the Dino Hypnotize Charger
    that was designed to put him to sleep) All previous plus Enhanced Skills and Acrobatics
    (When a ranger morphs, their skill are heavily enhanced to the point even a person
    who is horrible at martial arts can become a "Lethal Weapon", effortersly destroyed
    Badussa, kept up with Snide and Doomwing despite the latter mastering all of Zenowing''s
    skills and even threw hands with Sledge at his prime), Self-Sustenance (Type 1:
    All rangers can breath in space), Instinctive Reaction (The Rangers when they
    morph know the ideal skill moves in a fight before they even do them, it''s a
    preset instinct. Thanks to that instinct the Rangers can also hit enemies without
    the need of seeing them Saban''s Go Go Power Rangers issue 2 Power Rangers Lost
    Chronicles), Underground Mobility (Upon activating X armor mode he can dig underground
    for surprise attacks and such), Transformation (Can transform other Zords like
    the Plesio Zord into Megazords), Limited Durability Negation (The finishers of
    the Power Rangers can make weakened or weaker opponents explode into nothing),
    Magma Manipulation (His pose triggers volcanic eruptions), Explosion Manipulation
    (His pose triggers explosions), Statistics Amplification and Transformation (Can
    transform into Dino Drive mode which doubles the Ranger''s and the Zord''s powers
    although the mode is activated only while inside a zord, Super Dino Drive mode
    amplifies their power even further. The dino chargers increase the power of the
    morpher allowing the Rangers to create their finishers), Summoning (Upon using
    the Dino Armor X Charger he can activate Dino Steel mode which allows him to summon
    his personal weapon, the T-Rex Smasher) and Resistance to Space Radiation (All
    rangers are fine in space), to Deconstruction (Similar to the other DC rangers,
    he can take Goldar Maximu''s energy attacks which can deconstruct Sledge), to
    Electricity Manipulation (All rangers were fine after they took a blast which
