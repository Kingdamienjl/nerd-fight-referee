- id: claim-standard-equipment-bcacce40
  section: equipment
  axis: equipment
  text: 'As a Power Ranger, Tyler has access to a large arsenal of varied weapons,
    armors and other tools. These pieces of equipment include: *Dino Charger: A rather
    powerful tool in combat. While this item can''t be used as a direct attack the
    different chargers can be used to either summon various Zords in combat or gain
    powers and/or new pieces of gear to use in battle. **Dino Cycle Charger: Summons
    a dinocycle, which is a faster alternative than walking. **Dino Armor X Charger:
    One of the most consistent Dino Chargers to be used by the Rangers. This charger
    conjures up an additional piece of armor. **T-Rex Super Charger: This Dino Charger
    allows Tyler to access his T-Rex Super Charge mode, which greatly enhanced his
    abilities in nearly every regard. Additionally, this mode allows Tyler to augment
    his Ranger Armor even more by gaining powers from various Zords to add to his
    own. *Dino Saber: The Dino Saber is the Rangers primary tool for melee combat
    when they''re not relying on hand-to-hand martial arts. The Saber is remarkably
    powerful, being able to match that of Slides sword and mortally wound high ranking
    generals. Additionally, the Saber can be powered up with Dino Chargers to release
    a powerful slash that almost always finishes off the enemy. *Dino Blaster: A rather
    powerful weapon, the Dino Blaster is a handgun-like-laser that shoots small, but
    surprisingly damaging blast that can hurt even generals. *T-Rex Smasher: An immensely
    powerful hammer-like add-on that increases Tylers strength considerably. This
    weapon was strong enough to easily shatter asteroids and even injure Sledge. *
    Ranger suit: The suit of the Ranger. The material is a self-assembling nano-fiber
    formed with an intercellular shape memory alloy'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
