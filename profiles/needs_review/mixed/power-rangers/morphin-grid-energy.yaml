- id: claim-powers-and-abilities-30b25896
  section: abilities
  axis: hax
  text: "By transforming into a Ranger, special energy enters the Ranger depending\
    \ on the color of the suit, this means either the Ranger have some special traits\
    \ or the special energy give them special abilities beyond the abilities of the\
    \ standard Ranger Red Ranger \u25BE= *Social Influencing (Red Ranger Exclusive;\
    \ Due to their connecton to the Grid, the Red Rangers embody nobliness and inspire\
    \ the entire team as great leaders and fighters, keeping the spirit of the team\
    \ alive and motivating them in hard times. They are legends across all dimensions\
    \ and time) Blue Ranger \u25BE= *Genius Intelligence, Analytical Prediction &\
    \ Possibly Information Analysis (Blue Ranger Exclusive; Due to their connection\
    \ to the Grid, they embody the ability of the grid to create very new complex\
    \ technologies using millennium years of knowledge from their research. They can\
    \ use mathematic calculations to predict attacks but also use it to calculate\
    \ the timing of attacks as well as the distance, their ability of utilizing all\
    \ the information around em can allow them to think of ways to win a right before\
    \ a single punch can be thrown) Pink Ranger \u25BE= *Enhanced Acrobatics (Pink\
    \ Ranger Exclusive, Due to their connection to the Grid, the Pink Rangers have\
    \ light armor and are light on their feet which allows them to dodge attacks and\
    \ flip and dance around the battlefield. Granting them much better acrobatic movement\
    \ than the rest of the Rangers ) Black Ranger \u25BE= *Social Influencing (Black\
    \ Ranger Exclusive; Due to the connection to their Grid they are social charmers\
    \ and can unite teams and the bonds between people) Yellow Ranger \u25BE= *Enhanced\
    \ Speed, Intelligence & Skill Amplification (Yellow Ranger Exclusive; Due to the\
    \ Grid energy the Yellow Rangers are way faster than the average rangers allowing\
    \ them to deal multiple hits to an enemy from every angle with the enemy might\
    \ not being able to understand where damage even came from. The Yellow Rangers\
    \ are also quick thinkers and adapt to any scenario, let it be in dangerous situations\
    \ or combat allowing them to be the soul of the team) White Ranger \u25BE= *Social\
    \ Influencing, Self-Sustenance (Type 3), Infinite Stamina & Resistance to: Power\
    \ Modification (White Ranger Exclusive; The White Rangers have incredible understanding\
    \ of the concept of the Morphin grid and an incredible connection to the Morphin\
    \ grid and the white light, this gives the white rangers the ability to remain\
    \ fine from abilities that modify the power of the suits Mighty Morphin Power\
    \ Rangers issue 42 but also makes them unable to feel tired or even need stuff\
    \ like eating, drinking or resting.Mighty Morphin Power Rangers issue 40 The White\
    \ Rangers are highly admirable and shine in combat to the point of being historical\
    \ figures across history) Green Ranger \u25BE= Resistance to: *Sleep Manipulation,\
    \ Matter Manipulation (Atomic) & Power Nullification (Green Ranger Exclusive;\
    \ Due to unique nature and connection to the Morphin Grid, they can resist the\
    \ Morph EMP which floods a target's system with charged ion particles which disrupt\
    \ the flow and absorption of the Morphin energy,Mighty Morphin Power Rangers issue\
    \ 100 it is also capable of knocking others out unconsciousMighty Morphin Power\
    \ Rangers issue 6) Gold Ranger \u25BE= Resistance to: *Enhanced Durability, Stamina\
    \ & Damage Reduction (Gold Ranger Exclusive; Due to their connection to the Morphin\
    \ Grid, the Gold Rangers can withstand a massive amount of punishment and still\
    \ continue fighting. They are the main protectors in a Ranger team and their protective-forcefield\
    \ and durability are much higher than that of an average Ranger) Silver Rangers\
    \ \u25BE= *Enhanced Healing, Regeneration & Enhanced Senses (Silver Rangers Exclusive;\
    \ Due to their connection to the Morphin Grid they are more knowledgeable of the\
    \ healing factor that the Grid provides and have sharp eyes and quick reflexes\
    \ giving them senses much superior to that of a standard ranger) Purple Ranger\
    \ \u25BE= *Rage Power & Statistics Amplification (Purple Ranger Exclusive; Due\
    \ to their connection to the Morphin Grid, the Purple Rangers get their powers\
    \ from emotions and feelings, their power can overall grow by connection to their\
    \ emotions and feelings. ) Orange Ranger \u25BE= *Enhanced Intelligence (Orange\
    \ Ranger Exclusive; Due to their connection to the Grid, the Orange Energies enhance\
    \ their mind capabilities to allow them to formulate all the creative ideas they\
    \ come up with)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
