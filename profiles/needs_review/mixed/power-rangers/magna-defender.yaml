- id: claim-standard-equipment-c41b616f
  section: equipment
  axis: equipment
  text: 'right|70px right|350px * Magna Sword/Blaster: The Magna Sword is the primary
    weapon used by the Magna Defender. The sword has the ability to alternate between
    its default state and a blaster, which is activated by bending the hilt of the
    sword back and twisting the forked ends to become a trigger and handle. The Magna
    Blaster fires several blasts in one shot, eliminating one or several enemies,
    a quick pump of the weapon recharges it. When in sword mode, he can charge it
    with Grid Energy to create a very powerful slash that destroys enemies with a
    single strike. * Double Blades: When the Magna Defender transforms into the Mega
    Defender, his Magna Sword transforms into two blades that are used to fight his
    enemies in close combat'
  source_ids: *id003
  decisive: false
  status: unverified
