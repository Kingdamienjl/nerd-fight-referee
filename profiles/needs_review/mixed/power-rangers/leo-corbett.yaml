    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (After fighting against Stingwingers, Leo was slammed in his
      back by a mace but he was able to shrug it off like nothing and go continue
      to fight against Mutantrum and then have a deadly showdown with Furio. Even
      with hurt legs the Rangers can do their acrobatics and engage in combat with
