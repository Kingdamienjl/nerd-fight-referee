      be active and willing to fight. Despite being slashed in his arm, Leo was able
      to continue fighting. The Rangers can fight for hours upon hours with little
      breaksPower Rangers Lost Galaxy Ep19; The Lost Galactabeasts, Part 1)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range to Extended Melee Range by himself and with melee weapons,
      Hundreds of Meters with ranged attacks (The Lost Galaxy Powers are created to
      be far more advanced and superior to futuristic weaponry which can at least
      reach 300-400 meters), Thousands of Kilometers with the Lights of Orion (The
      Lights could nullify an ice spell across all of Terra Venture), Planetary with
      Power Nullification (Nullified Furio's petrification across the whole planet
      of Mirinoi)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Gifted (Leo is a quick thinker that uses his brain in order to outsmart
      his enemies. Was able to see through Damon's card technique. Scored very high
      on the entrance test to be part of the Terra Venture leadership crew. Made a
      plan on the fly to steal the transdaggers by switching the Quasar Sabers with
      a set of fake ones while also perfectly acting like the real ones were stolen
      by Furio. Learned quickly how to ride a horse by himself despite being bad at
      itPower Rangers Lost Galaxy Ep11; Silent Sleep) Leo can use his combat skills
      in tandem with the environment around him, being able to weaponize it. Capable
      of memorizing fighting styles and matching them with people who use them and
      even completely copying them perfectly. The fighting skill of the Rangers was
      compared to the peak of Loyax who is a warrior who fought and won in all the
      corners of the universe for centuries making his name be feared by everyonePower
      Rangers Lost Galaxy Ep27; Loyax' Last Battle with super advanced computers even
      analyzing the fighting capabilities of the Rangers to surpass all of humanity
      as well as most of the universe. Leo was able to find a strategy to trick Chameliac's
      computer after fighting him once. His skill heavily increases to match threats
      that dwarf him in fighting capabilities, adapting to their powers and skill
      every time they fight including Furio, Treacheron, Deviot and Villamax)
    source_ids: *id002
    confidence: 0.8
