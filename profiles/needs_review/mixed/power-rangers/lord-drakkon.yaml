- id: claim-weaknesses-b1974f88
  section: weaknesses
  axis: weakness
  text: 'Lord Drakkon tends to highly underestimate his opponents, due to his god
    complex preventing him from seeing the potential threats before him. His biological
    structure is heavily weakened to the point of approaching failure due to the sheer
    strain of maintaining so many power sets at once after he absorbed white ranger,
    the samurai, and Zeo''s Powers. Notes: As Power Rangers as a verse is under massive
    revisions, should be noted that the profile should not be used in vs matches till
    the revisions end'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
