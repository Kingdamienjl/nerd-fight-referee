    back at the them as well as heal any negative affect the opponent has caused on
    itMighty Morphin Power Rangers S1 Ep10), Deconstruction (Its attacks far upscale
    those of the Rangers and the other Zords. The Power Sword finisher disintegrate
    the opponent, even those with resistancesMighty Morphin Power Rangers S1 Ep11),
    Flight (Can fly to an extentMighty Morphin Power Rangers S1 Ep37), Electricity
    Manipulation (Can strike others with lightning. The Power Sword creates bolts
    of electric energyMMPR scripts), Temperature Manipulation (By spinning it can
