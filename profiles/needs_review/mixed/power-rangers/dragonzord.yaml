- id: claim-powers-and-abilities-25e03623
  section: abilities
  axis: hax
  text: 'Those of the Green Mighty Morphin Ranger plus Morphin Grid Energy (Zord Physiology/Green
    Ranger), Martial Arts (A Zord can use martial art moves Mighty Morphin Power Rangers
    S1 Ep1 and is capable of being formidable in combat even without being controlled
    by a Ranger Mighty Morphin Power Rangers S1 Ep32), Bodily Weaponry (Tail, claws,
    jaw and finger missiles), Enhanced Senses and Information Analysis (The zords
    contain the I/O sensors that stream their environmental readings, analyze them
    through computations and presents them to the user allowing them to take the correct
    balance and movement .Mighty Morphin Power Rangers issue 2 They contain targeting
    systems Super 7 Super Cyborg toyline and danger sensors .Saban''s Go Go Power
    Rangers Back To School Zords also can sense others hundred of kilometers away
    Mighty Morphin Power Rangers S1 Ep21 and analyze invisible energies .Mighty Morphin
    Power Rangers S1 Ep36 The Zords contain mega-receptors and contains information
    about the status of the Zord . The Zords thanks to their sensors, can do energy
    and power readings allowing them to locate objects and such .Mighty Morphin Power
    Rangers issue 4 The Power Readings also allow them to know about powers and abilities
    that are about to be activated .Saban''s Go Go Power Rangers issue 12 The Zords
    can analyze others and their internal functions as well as their current status
    .Saban''s Go Go Power Rangers issue 11 The Zords contain radars and sensors that
    allow em to scan and track down others . The Dragonzord has analyzers, scanners
    and radars across the entire planet or even beyond, they can also sense Morphin
    Grid energy .Mighty Morpin Power Rangers issue 16 The Zords can analyze voice
    patterns .Mighty Morphin Power Rangers issue 23 By being the state-of-art and
    the greatest machine to that point of time, should be superior to Zordon''s and
    Edenoi''s oldest machines that contain vision modes of Ultraviolet, infrared ,Mighty
    Morphin issue 10 thermal Saban''s Go Go Power Rangers issue 18 and possibly much
    more), Non-Physical Interaction (The Zords can physically destroy Rita''s mimic
    putty which can allow everything to phase through it and also be resistant to
    physical damage due to its physiology, even bypassing the Non-Physical Interaction
    of the power weapons Saban''s Go Go Power Rangers issue 8), Flight (Zords can
    traverse space Mighty Morphin Power Rangers issue 7), Instinctive Action (The
    Zords and the Rangers have a battle instinct .Saban''s Go Go Power Rangers issue
    9 That allows the Zords to guide the moves of the Rangers on the instinct level
    and vice versa ), Immortality (Types 1 and 2; The Zords reside in a metaphysical
    plane of pure Grid energy and never age .Power Rangers RPG The Zords can also
    function as pieces Mighty Morphin Power Rangers Rita Repulsa''s attitude adjustment),
    Underwater Breathing (Type 2; The Dinozords can function Underwater Mighty Morphin
    Power Rangers S1 Ep60), Statistics Amplification (The Zords contain systems that
    give them more power Mighty Morphin Power Rangers S1 Ep3), Free Movement (The
    Zords have an underwater mode that allows them to walk on water Mighty Morphin
    Power Rangers issue 4), Teleportation (Passive; The Zords have a new protection
    system which will passively teleport them to their protection base, when near
    destruction, to regenerate Mighty Morphin Power Rangers S1 Ep39), Healing, Power
    Nullification and Statistics Amplification (The Dragon Dagger can increase and
    restore its stamina Mighty Morphin Power Rangers S1 Ep21 and power ,Mighty Morphin
    Power Rangers S1 Ep36 it can also nullify any negative affect placed on it Mighty
    Morphin Power Rangers S1 Ep29) Resistances=Those of Tommy plus Fire Manipulation
    (Scales to the Tyrannosaurus Dinozord), Space-Time Manipulation (Attacks from
    Rita''s monsters can completely shatter space-time and reach out into voids, the
    Zords can tank those attacks Mighty Morphin Power Rangers S1 Ep2), Extreme Temperatures
    (Scales to the Triceratops Dinozord that can pierce through Earth''s mantle Power
    Rangers Collectible Card Game #24), Hacking and Technology Manipulation (The Zords
    have systems that can overpower and nullify abilities that take control of the
    Zords .Mighty Morphin Power Rangers S2 Ep1 Billy created a device that protects
    the Zords from Pirantishead''s and Zedd''s abilities to control any machine Mighty
    Morphin Power Rangers S2 Ep2 Mighty Morphin Power Rangers S2 Ep3) All previous
    plus those of the Dinozords (Minus Tyrannosaurus Dinozord) plus Air Manipulation
    via Drill Staff (Can spin its drill-staff fast enough to block gasses , it can
    also generate winds Mighty Morphin Power Rangers S1 Ep24) Resistances=All previous'
