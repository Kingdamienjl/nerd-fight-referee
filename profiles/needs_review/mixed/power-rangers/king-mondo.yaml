  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Longevity, Genius Intelligence, Inorganic
    Physiology (Type 2), Magic, Martial Arts (Superior to beings like the Rangers,
    Zeo episode 50 and comparable to Zedd himself Zeo episode 1), Enhanced Senses
    (All the robots of the Machine Empire can sense intrusions Zeo episode 2), Information
    Analysis (All machines of the empire have screens inside of them that they can
    use multiple ways such as analyzing weapons, characters and the area around them
    and increase their accuracy Zeo episode 6), Teleportation (He can teleport Zeo
    episode 34), Weapon Mastery (As showcased here Zeo episode 34) Summoning (Should
    be able to summon Cogs like every other monster), Light Manipulation (While teleporting
    Zeo episode 34), Electricity Manipulation (Can shoot electricity from his fingers,
    Zeo episode 34 King Mondo can use his staff to create electricity attacks so powerful
    they can inflict great damage on the red ranger Zeo episode 21), Explosion Manipulation
    (His attacks can create explosions Zeo episode 21), Forcefield Creation (Can create
    forcefields Zeo episode 20), Power Nullification (His forcefields can nullify
    teleportation abilities Zeo episode 20), BFR (King Mondo can force his teleportation
    on others allowing him to BFR, Zeo episode 20 he BFR''ed the christmas decoration
    in another part of the planet earth, Zeo episode 49 BFR''ed his Plant Monsters
    from earth to the moon Zeo episode 11 and was able to BFR Rita''s monster, Impursonator
    to a planet 8 lightyears away from earth Zeo episode 47), Danmaku (King Mondo
    can also use his electricity in the way of danmaku, creating huge AoE and exploding
    the area he is fighting Zeo episode 22), Size Manipulation (King Mondo has the
    power to change the size of himself and others Zeo episode 50), Smoke Manipulation
    (When he is angry he can produce smoke Zeo episode 49), Power Bestowal (Gave more
    power to his Plant Monster Zeo episode 11), Limited Acausality (Type 1: Should
    scale to his son who like Tommy Oliver is capable of keeping his memories while
    in a time loop and making him act accordingly Zeo episode 43). Resistance to Fire
    Manipulation (Superior to his monsters who are not affected by the Sun''s heat
    Zeo episode 3 and earth''s atomsphere Zeo episode 22), Electricity Manipulation
    (Superior to his monsters who can take his electricity attacks Zeo episode 11)
    and Deconstruction (Enemies and villains of the Zordon era can take attacks from
    the In-Space blasters which deconstruct anyone that they hit Power Rangers Issue
    20) In addition to his general abilities, he gets the following with Damocleus
    Sword: Statistics Amplification (Can amplify King Mondo''s stats, King Mondo gets
    stronger with each second that it passes while holding it Zeo episode 34), Transformation
    (Transforms King Mondo to Super King Mondo Zeo episode 34), Paralysis Inducement
    (Capable of withstanding attacks from the Blade Blaster which immobilizes and
    stuns the targetMighty Morphin Power Rangers French Magazine #17), Energy Projection
    and Danmaku (Using the Damocles sword, King Mondo can create a barrage of energy
    lazers to damage his opponent Zeo episode 34)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
