    (Magic can Power Rangers Mystic Force episode 4 effect Power Rangers Mystic Force
    episode 7 technology), Weapon Mastery and Martial Arts (At least comparable to
    Koragg), Enhanced Senses (Sensed the Gatekeeper ,Power Rangers Mystic Force episode
    11 the monsters of the underworld can sense magic), Statistics Amplification (He
    gets stronger the more dark magic and energy he generates ), Darkness Manipulation
    (His attacks can be darkness based Power Rangers Mystic Force episode 12), Non-Physical
    Interaction (Comparable to Koragg and other monsters of the underworld), Attack
    Reflection (His sword reflected the fire attacks of the Mystic Dragon ), Mind
    Manipulation (Used his magic to try to mind control Koragg Power Rangers Mystic
    Force episode 2), Energy Manipulation (Can engulf his sword in blue energy ),
    Power Bestowal (Gave more powers to Necrolai, granting her new abilities ), Damage
    Boost (Can increase his damage output by engulfing his already energized sword
    in Dark energy), Self-Sustenance (Type 1: All monsters of the underworld are fine
    in space), Large Size (Type 1) and Size Manipulation (Like the rest of the monsters
    of the Underworld, Morticon can increase his size), Telekinesis (All magicians
    have those powers), Weather Manipulation (Used his dark magic to create a storm
    over Briarwood ), Explosion Manipulation (His attacks can create explosions),
    Shockwave creation (His attacks generate shockwaves), Life Manipulation (Has a
    spell to bring objects to life Power Rangers Mystic Force Magazine issue 32),
    Deconstruction possibly Existence Erasure (can turn opponents into nothingness
    after imbuing his sword with dark energy Power Rangers Mystic Force episode 10)
    and Regeneration Negation (Mid-High: Stated himself that he would destroy Necrolai
    with her running from him in fear , Necrolai possesses similar regeneration Power
    Rangers Mystic Force episode 9 to that of Koragg) Fire Manipulation and Electricity
    Manipulation (Laughed at the attacks of the Power Rangers), Poison Manipulation
    and Radiation Manipulation (The monsters of the underworld are immune to the negative
    effects of the RPM world outside the dome city of corinth but also fine in space
    MMPR issue 28 MMPR issue 30), Ice Manipulation, Matter Manipulation, Deconstruction
    and possibly Existence Erasure (Took attacks from Udonna''s magic which can freeze
    you, dissolve you and presumably remove your existence without a trace.Power Rangers
    Mystic Force episode 1 Should also survive attacks from the Solaris Knight which
    can reduce others to magical light particles Power Rangers Mystic Force episode
    15), Teleportation (Due to him having immense power, a very great amount of energy
    is needed for him to be teleportated away ), Mind Manipulation (monsters of the
    underworld are immune to the DJ hypnotic music Power Rangers Mystic Force episode
    8), Sleep Manipulation (monsters outside of earth are immune to gasses including
    sleeping ones Power Rangers Operation Overdrive Magazine issue 51), Power Nullification
    and Power Absorption (Since everyone has their power connected to magic, they
    are never without magic, they just have to believe in what ther magic is connected
    to and they will have their powers restored Power Rangers Mystic Force episode
    32)'
