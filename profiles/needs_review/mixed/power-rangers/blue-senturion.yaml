    shots, it can also create a singular energy beam that splits into many beams to
    create a barrage of energy attacks. The baton mode is used in close combat and
    it is powerful enough to create a wave of explosive attacks. The Synergizer is
    also capable of electrocuting its foes. * Senturion Cycle: The Blue Senturion''s
