- id: claim-powers-and-abilities-667f85a8
  section: abilities
  axis: hax
  text: Summoning (Can summon his zord, the ptera zord. He can also summong his Gold
    Ptera Saber aswell as his Gold Ptera Morpher), Weapon Mastery (Gold Prera Saber
