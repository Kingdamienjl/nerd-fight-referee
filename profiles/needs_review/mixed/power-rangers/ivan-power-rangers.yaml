- id: claim-standard-equipment-9c851da0
  section: equipment
  axis: equipment
  text: 'As a Power Ranger, Ivan has access to a sizable arsenal of varied weapons,
    armors and other tools. These pieces of equipment include: *Gold Energem. The
    Energems are an immeasurably powerful artifact that monsters from all corners
    of the universe desire. Just a single Energem''s power can overpower powerful
    aliens such as Heckyl. While the full power of the Energems are unknown, they
    were said to have transcended space and time and wielders of them are a threat
    to "the past, present and future". In the Rangers position, these Energems don''t
    seem to enhance their strength to such levels, but they are used as a source of
    seemingly infinite energy. *Dino Charger. While not a weapon per say, the Dino
    Charger is an invaluable tool for the Rangers. It can be used to gain new weapons
    or gear on the fly and to summon their respective Zords. **Dino Cycle Charger.
    Summons a dinocycle, which is a faster alternative than walking. Rarely used in
    combat, but it has been shown to clear large distances of lad in no time. **Dino
    Armor X Charger. One of the most consistent Dino Chargers to be used by the Rangers.
    This charger conjures up an additional piece of armor that seems to power up their
    Megazords. *Gold Ptera Saber. A stronger alternative than the basic Dino Saber.
    The Gold Ptera Saber is a powerful weapon indeed, being able to conjure and disperse
    large storms with simple techniques. The Sword can be empowered by up to three
    Dino Chargers, with all three it can unleash Lightning Final Strike'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-bfb546da
  section: power_scale
  axis: battle_iq
  text: Gifted (As a Knight, Ivan received a grade of combat training and experience
    that is initially above the Rangers and as such, he's able to match blades with
