    the legendary knight of Zandar, his skills even while unmorphed are on par with
    people like Fury who are extremely skilled on their own right), Transformation
    (Can transform into the Gold Dino Charge Ranger), Acausality (type 1), Immortality
    (type 1) and Resistance to Time Manipulation (The energems completely trascend
    the space-time itself, this allows the rangers to completely bypass time as seen
    from them not being effected by time travel or making them forever young as time
    does not pass for them), Resistance to Absorption (The energem was able to allow
    him to break free from Fury's absorption), to Ice Manipulation (The energem prevent
    the rangers from being frozen) and to Fear Manipulation through Supernatural Willpower
    (All rangers are capable of resisting the fear powers of Bones through their will
    and bravery) All previous plus Explosion Manipulation (His pose triggers explosions
    liek the other Dino Charge Rangers), Enhanced Skills and Acrobatics (When a ranger
    morphs, their skill are heavily enhanced to the point even a person who is horrible
    at martial arts can become a "Lethal Weapon", he can throw hands with Badussa,
    Snide and Sledge), Instinctive Reaction (The Rangers when they morph know the
    ideal skill moves in a fight before they even do them, it's a preset instinct.
    Thanks to that instinct the Rangers can also hit enemies without the need of seeing
    them Saban's Go Go Power Rangers issue 2 Power Rangers Lost Chronicles), Magma
    Manipulation (His pose also triggers volcanic erruptions like the other Dino Charge
    Ranger), Limited Durability Negation (The finishers of the Power Rangers can make
    weakened or weaker opponents explode into nothing), Weather Manipulation (His
    pose can spawn storms), Flight (He can use his wings to fly), Transformation (Can
    transform his Ptera zord to the Ptera Charge Megazord), Self-Sustenance (Type
    1) (All rangers can breath in space), Resistance to Deconstruction (Similar to
    the other Dino Charge rangers, he can take Goldar Maximu's energy attacks which
    can deconstruct Sledge), to Heat Manipulation (The suit of the dino charge rangers
    protect the user from heat, Tyler while extremely weakened was ok inside a volcano),
    to Electricity Manipulation (All rangers were fine after they took a blast which
    included 10 million gigavolts worth of electricity) and to Space Radiation (All
    rangers are fine in space)
  source_ids: *id003
  decisive: true
