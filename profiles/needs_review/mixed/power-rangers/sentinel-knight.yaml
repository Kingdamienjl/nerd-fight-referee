    (Absorbed the Excelsior Power Rangers Operation Overdrive episode 21), Teleportation
    and BFR (Can teleport himself and others), Cosmic Awareness (Instantly sensed
    and teleported to the location of the Corona Aurora after it got found despite
    being away from earth Power Rangers Operation Overdrive episode 1), Self-Sustenance
    (Type 1: Can breath in space like almost every other villain and ranger ), Fusionism
    and Telekinesis (telekinetically fused the powers of the two jewels of the Corona
    Aurora Power Rangers Operation Overdrive episode 12), Time Travel and Dimensional
    Travel (By manipulating the Grid he can travel to the era of SPD but also should
    be capable of meeting teams such as RPM but is also capable of bringing those
    rangers to the main timeline''s present), Underwater Breathing (Type 2: Scaling
    to the Operation Overdrive Rangers) and possibly Non-Physical Interaction (Can
    possibly scale to the Excelsior) Superhuman Physical Characteristics, Inorganic
    Physiology (Type 1: He is a sword), Acrobatics and Martial Arts (Similar to the
    Rangers), enhanced Explosion Manipulation (Can explode the Fearcats Power Rangers
    Operation Overdrive episode 28 who previously resisted the explosion abilities
    of the finishers Power Rangers Operation Overdrive episode 14), Statistics Amplification
    and Energy Manipulation (Can amplify his punches and kicks with energy to create
    his finishers his energy blast attacks also work as a finisher. He can also increase
    his combat speed Power Rangers Operation Overdrive episode 22), Regeneration Negation
    (Mid-High: Mack using his powers can destroy Kamdor for good Power Rangers Operation
    Overdrive episode 30 who can regen from exploding into nothing), Size Manipulation
    (Can increase his size to that of a Megazord), Transformation and Flight (Can
    transform back into Excelsior which also grants him flight Power Rangers Operation
    Overdrive episode 24), Power Bestowal (Via Excelsior he can give his powers to
    the Red Operation Overdrive Ranger Power Rangers Operation Overdrive episode 25),
    Cosmic Awareness, Underwater Breathing (Type 2) and Self-Sustenance (Type 1) (Same
    as before) and Non-Physical Interaction (The Excelsior is said to be able to harm
    the spiritual form of the Knight Power Rangers Operation Overdrive episode 21)
    Absorption (The Sentinel Knight is too strong for the Fearcats to absorb Power
    Rangers Operation Overdrive episode 23), Fire Manipulation, Ice Manipulation,
    Poison Manipulation, Density Manipulation and Radiation Manipulation (Should have
    similar resistance to those of the Rangers)'
