  attack_potency:
    text: 'At least Building levelUpscales from 0.59 Tons of TNT (Killed Naqib, who
      survived his own explosive powers, and that was stated to be superior to and
      could easily destroy the M1 Abrams and the B-2 Stealth.The conversation that
      Madelyn Stillwell (Senior Vice President of Hero Management at Vought International)
      and Robert Singer (U.S. Secretary of Defense) had during S1E8: Stillwell: What
      is Lockheed Martin''s number one product? Singer: Sorry? Stillwell: Its top
      seller. You should know this, you served on their board of directors. Singer:
      The Patriot missile. Stillwell: Correct. Northrop? Singer: B-2 Stealth. Stillwell:
      General Dynamics? Singer: Tomahawk and the M1 Abrams. Stillwell: Billions of
      dollars of bleeding-edge hardware. Do you know what all of that is as of today?
      A worthless pile of shit. Because Naqib and other super terrorists like him
      can flick away that junk like flicking a flea. So it doesn''t matter where heroes
      really come from. Frankly, it doesn''t even matter how the enemy got the Compound
      V. What matters is they''ve got it. It is a whole new world now. And there is
      only one company that has the product to fight back. My company. My product.
      This was in an attempt to get the Supes into the military forces, which ultimately
      succeeded. Eventually, in S2E1, Noir is sent to kill Naqib. Fought and ultimately
      defeated Kimiko, injuring her to the point where Frenchie thought she was dead,
      who was implied could withstand a fire blast from Lamplighter.The Boys; Season
      2; Episode 6; "The Bloody Doors Off" Easily overwhelmed Starlight multiple times,
      if in part by higher skill, throwing her through concrete walls and columns.The
      Boys; Season 2; Episode 7; "Butcher, Baker, Candlestick Maker" Though restrained
      by Maeve, the latter found it easier to exploit Noir''s allergy rather than
      take him down in direct combat.)'
