- id: claim-standard-equipment-ccebb7ac
  section: equipment
  axis: equipment
  text: "*Sleep Manipulation (with halothane and sedativesThe Boys; Season 4; Episode\
    \ 3; \"We'll Keep the Red Flag Flying Here\". Slept a woman with propofol. He\
    \ also roofied M.M. once) *Remote Listening (Via covert listening devices) *Limited\
    \ Electricity Manipulation (With electric cattle prod, which packs enough voltage\
    \ to drop a water buffalo) *Explosion Manipulation (Via C4 explosives) *Limited\
    \ Smoke Manipulation and Minor Fire Manipulation (With M34 White Phosphorous grenadesThe\
    \ Boys; Season 1; Episode 3; \"Get Some\") *Limited Ice Manipulation (Froze Ezekiel's\
    \ arm with liquid nitrogen) *Biological Manipulation and Power Bestowal with Temp-V\
    \ (Was given some by Maeve) and Compound V (Stole it from a baby's IV once and\
    \ took some from Frenchie's desk on a different occasion, with the idea of curing\
    \ his cancer, but instead it ended up giving powers to his tumor) **Healing (Mid-Low.\
    \ Upon using it, Compound V healed A-Train's compound fracture, while Temp-V healed\
    \ Butcher's bullet wounds from his fight with Gunpowder and Hughie's broken arm)\
    \ ***Limited Resurrection (Despite Hughie's dad being officially declared as brain\
    \ dead, Compound V could bring him back to life. However, he did so with severe\
    \ mental disturbance, akin to that of advanced dementia) *Limited Disease Manipulation\
    \ with the Supe Virus (The virus was specifically developed to only affect supesGen\
    \ V; Season 1; Episode 6; \"Jumanji\", binding to the V receptorsThe Boys; Season\
    \ 5; Episode 3; \"Every One of You Sons of Bitches\", and killing them in about\
    \ 30 seconds. This means that those without modern compound V in their system\
    \ are immune to its effects. Though, while V-One users are stated to be immune\
    \ due to the different molecular structure compared to modern V, they can still\
    \ suffer from the effects of the virus and be incapacitated, but they will recover\
    \ not long after) **Biological Manipulation (Can cause the rapid and widespread\
    \ development of boils and blisters and induce violent vomiting. Has also the\
    \ potential to deteriote the body to the point of skin, muscles and bones to fall\
    \ off) ***Limited Blood Manipulation (Can cause massive internal hemorrhaging,\
    \ turning blood black likely due to it mixng with stomach acid) **Pain Manipulation\
    \ (Kimiko stated that the pain caused by the virus made her feel like she \"wanted\
    \ to die\" and described it as \"agony\"The Boys; Season 5; Episode 2; \"Teenage\
    \ Kix\", being visible uncomfortable just by having the virus on her leg, despite\
    \ her showing no discomfort while getting shot or when getting her arm ripped\
    \ off) **Limited Power Nullification (Even on small doses, the virus was capable\
    \ of supressing a supe's powers) |-|Empowered By Temp-V= Same as his Pre Compound\
    \ V Base, plus: *Superhuman Physical Characteristics **Resistance to Piercing\
    \ Damage (Certain supes, unlike others, have been shown to be completely impervious\
    \ to low caliber bullets from pistolsThe Boys; Season 2; Episode 8; \"What I Know\"\
    Gen V; Season 1; Episode 1: \"God U\" and assault riflesThe Boys; Season 1; Episode\
    \ 1; \"The Name of the Game\"The Boys; Season 1; Episode 3; \"Get Some\"Gen V;\
    \ Season 1; Episode 5; \"Welcome to the Monster Club\", and can even withstand\
    \ shots from anti-materiel rifles, albeit with moderate painThe Boys; Season 1;\
    \ Episode 7; \"The Self-Preservation Society\". In addition, this supes may also\
    \ be highly resistant to cuts from ordinary weapons and saws, requiring specialized\
    \ saws to get through their skinThe Boys; Season 2; Episode 6; \"The Bloody Doors\
    \ Off\") **Enhanced Hearing (All Supes have a wider range of hearing than humans,\
    \ and it's comparable to that of dogsGen V; Season 1; Episode 2: \"First Day\"\
    ) **Regeneration (Low. It was stated that all supes heal faster than humansThe\
    \ Boys; Season 3; Episode 7; \"Here Comes a Candle to Light You to Bed\"Amazon\
    \ Prime's X-Ray Trivia) **Reactive Evolution (Godolkin stated that under the right\
    \ amount of pressure, a supe can \"level-up\", becoming more powerfulGen V; Season\
    \ 2; Episode 2: \"Justice Never Forgets\") **Temperature Manipulation and Energy\
