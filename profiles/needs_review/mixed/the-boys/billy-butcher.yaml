  axis: hax
  text: "{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= |-|Base/By Himself=\
    \ {{#tag:tabber|{{!}}-{{!}}Pre Compound V= *Peak Human Physical Characteristics\
    \ *Expert Hand-to-Hand Combatant (Is a former SAS agent and is referred to as\
    \ an expert in hand-to-hand combatThe Boys' Season 2 Finale Digital Cover. Butcher's\
    \ fighting style seems to be based on boxing, mostly involving punches, but also\
    \ mixing in headbutts and elbow strikes, and sometimes going for neck grabs or\
    \ straight up choking his opponent) *Weapon Mastery (Was shown to be skilled in\
    \ the use of multiple weapons, mainly firearms and his trusty crowbar, and is\
    \ skilled enough to use a baby with laser eyes as a weapon) *Stealth Mastery (Entered\
    \ both Raynor'sThe Boys; Season 1; Episode 2; \"Cherry\" and Stillwell's housesThe\
    \ Boys; Season 1; Episode 8; \"You Found Me\" without leaving any trace. Infiltrated\
    \ Raynor's office without anyone noticingThe Boys; Season 1; Episode 4; \"The\
    \ Female of the Species\". Broke into Mallory's car, who only noticed him because\
    \ she was the one to teach him how to do itThe Boys; Season 2; Episode 2; \"Proper\
    \ Preparation and Planning\") *Pickpocketing (Stole a card key from a nurse's\
    \ pocket without her noticing. Stole Hughie's keys while hugging him without Hughie\
    \ noticingThe Boys; Season 4; Episode 1; \"Department of Dirty Tricks\". Stole\
    \ Firecracker's keys) *Social Influencing (Leadership, Deception, Instigating\
    \ Fear, & Coercion; His character bio states that he \"is as charming as he is\
    \ cunning\" and that he \"can talk almost anyone into anything, either through\
    \ a smile or brute force \u2013 or sometimes both\". Skilled at manipulating people,\
    \ mostly through blackmailing. Convinced Stan Edgar that he had evidence about\
    \ Homelander's sonThe Boys; Season 2; Episode 5; \"We Gotta Go Now\", and later\
    \ persuaded him into giving information about Homelander's whereaboutsThe Boys;\
    \ Season 2; Episode 8; \"What I Know\". Convinced both Frenchie and M.M. to work\
    \ with him even after previous problems working together, twice. Frenchie firmly\
    \ believes that the team needs Butcher to succeed in their missions. Intimidated\
    \ Vogelbaum and made him testify against Homelander and Vought, despite Hthe danger\
    \ this would put his family in, leaving him completely horrified by the threatThe\
    \ Boys; Season 2; Episode 7; \"Butcher, Baker, Candlestick Maker\". Mesmer was\
    \ terrified the moment he spotted Butcher) *Preparation (Typically tries to gather\
    \ information before his missions or confrontations, like talking to Mallory to\
    \ find out a potential weakness of Homelander or when he studied about Payback's\
    \ past before facing Gunpowder. Build an explosive-vest to use on Mallory as a\
    \ way to threaten Homelander. Prepared himself alongside the rest of the team\
    \ with weapons in order to kill The Seven according to what they know of their\
    \ powers and weakness. Later, they readied themselves with a plan to save Ryan.\
    \ During Season 3, he always made sure to inject himself with Temp-V before fights)\
    \ *Vehicular Mastery (Drove his car through the front of Hughie's store to hit\
    \ Translucent while avoiding Hughie. Knows how to drive a yacht and an speed boat)\
    \ {{!}}-{{!}}Post Compound V= {{#tag:tabber| {{!}}-{{!}}Season 4= Same as before,\
    \ plus: *Multiple Selves (Type 3; After developing brain cancer due to the overuse\
    \ of Temp-V, and taking Compound V in order to try and cure himselfThe Boys; Season\
    \ 4; Episode 4; \"Wisdom of the Ages\", Billy ended up mutating his tumor, giving\
    \ it superpowers and sentience, much like Sun-Hee's pancreatic cancer, which acted\
    \ independently from her decisionsThe Boys Presents: Diabolical; Season 1; Episode\
    \ 7; \"John and Sun-Hee\") **Conditional Regeneration (Mid-Low; Only when the\
    \ tumor helps Butcher, such as healing the injuries of the tumor bursting out\
    \ of Billy's body after saving him from Ezekiel or after Butcher accepted his\
    \ deal) **Limited Instinctive Action (The tumor killed Ezekiel, without Butcher's\
    \ conscious decisionThe Boys; Season 4; Episode 5; \"Beware the Jabberwock, My\
    \ Son\") {{!}}-{{!}}V'd Up Tumor= *Superhuman Physical Characteristics (It absorbed\
    \ the Compound V from Butcher's system), Body Control, Bodily Weaponry, Additional\
    \ Limbs and Elasticity (Malignant tumors empowered by V can produce multiple stretchy\
    \ tendrils, which showcase superhuman strength, speed and durabilityThe Boys;\
    \ Season 4; Episode 8; \"Season Four Finale\") *Limited Biological Manipulation\
    \ (Is the cancerous tumor that's spreading through Butcher's bodyThe Boys; Season\
    \ 4; Episode 6; \"Dirty Business\", and after Butcher accepted his \"deal\", it\
    \ stopped debilitating him, going from being hospitalized, days away from dying\
    \ to fully recovered) **Limited Perception Manipulation (Caused Billy to see hallucinations\
    \ of his deceased wife Becca, as well as a former colleague of his named Joe Kessler)\
    \ **Limited Memory Manipulation (Altered Billy's memories surrounding Kessler's\
    \ death, which led to Billy believing he was alive) {{!}}-{{!}}Season 5= After\
    \ his \"deal with Kessler\", Billy now has full control o"
