  attack_potency:
    text: 'At least Building levelUpscales from 0.59 Tons of TNT (Drew blood from
      Stormfront with her strikes, who could withstand multiple hits from Queen Maeve.
      Hurt Noir with a kick. Fought with the shapeshifter, who could hurt Kimiko,
      who was implied to be able to survive Lamplighter''s fire blast, which previously
      vaporized a hole in a metal door. Can casually punch holes in brick walls as
      a workout), higher with light blasts (Held off A-Train, forcing him to dodge
      her blasts. Blasted a 6-inch thick metal door, meant to contain other supes
      and that she couldn''t previously break without electricity, off its hingesThe
      Boys; Season 2; Episode 7; "Butcher, Baker, Candlestick Maker". Sent Black Noir
      flying by firing at point-blank range, and even from afar she could hurt Stormfront
      and knock back and disarm Soldier Boy, though she remains far weaker than the
      latter. One shotted a Temp-V empowered Hughie while most likely holding backThe
      Boys; Season 3; Episode 6; "Herogasm". Knocked out Dogknott with one blastGen
      V; Season 2; Episode 1: "New Year, New U" and could later kill him after he
      was injured enough. Blasted The Deep and sent him flying dozens of metersThe
      Boys; Season 5; Episode 8; "Blood and Bone"), up to Large Building level+ with
      enough electricityUpscales from 7.615 Tons of TNT (After absorbing a huge amount
      of energy, she managed to knock down Soldier Boy, somewhat hurting him)'
    source_ids:
    - vsbattles-starlight-the-boys
    confidence: 0.9
    notes: auto_repair source extraction
  speed:
