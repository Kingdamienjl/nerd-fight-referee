  intelligence:
    text: 'Above Average (Stated that, prior to joining The Seven, she was doing investigations
      on her own to find criminals, utilizing a police scanner. On multiple occasions,
      she has managed to turn the tables on her foes by quickly utilizing information
      she has against them, as detailed in her Social Influencing feats. Carefully
      selected her words when confronted by an angry Homelander after she disobeyed
      a direct order from him to kill Hughie, avoiding getting killed for being dishonest.The
      Boys; Season 2; Episode 4; "Nothing Like It in the World" Starlight is also
      highly competent with the usage of her powers, wielding her powers effectively
      both in and out of combat) Standard Tactics: Starlight''s main choice of attacking
      during a fight is with her light blasts, either from a distance or at close
      range.The Boys; Season 1; Episode 2; "Cherry" Despite this, she is shown to
      be more than capable of hand-to-hand combat, and can mix her physical attacks
      with her light blasts.'
