  intelligence:
    text: Average (Aside from his skill in hand-to-hand combat, he frequently demonstrated
      the ability to coordinate attacks with his kaiju allies, including Rodan, Anguirus,
      Jet Jaguar, and King Caesar. He was also able to kill Hedorah by powering the
      Giant Electrodes constructed by the JSDF with his atomic breath. The Showa Godzilla
      in particular seems to possess human intelligence and is capable of abstract
      thought and communicating with other kaiju. This is demonstrated first in Ghidorah,
      the Three-Headed Monster, where Godzilla holds a conversation with Mothra and
      Rodan, which Mothra's Shobijin translate. Godzilla also is shown "talking" to
      Anguirus in Godzilla vs. Gigan, [https://youtu.be/HKJgSMQY2yM their conversation
      taking the form of speech bubbles in the Japanese version, and garbled speech
      in the film's English dub])
    source_ids:
    - mediawiki-87304
    confidence: 0.6
    notes: auto_repair source extraction
