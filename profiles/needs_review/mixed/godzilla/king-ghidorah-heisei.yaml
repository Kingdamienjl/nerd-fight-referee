    \ triple Laser Beam, from its Gravity Laser Cannon. *: Mecha-King Ghidorah is\
    \ equipped with four electrified capture cables, called Godzilla Capture Devices,\
    \ and a large Machine Hand which he can use to restrain Godzilla. These are strong\
    \ enough for Mecha-King Ghidorah to be able to fly over large distances with Godzilla\
    \ in tow, as seen in Godzilla vs. King Ghidorah. *: With the time machine KIDS\
    \ built into him and serving as his escape pod, Mecha-King Ghidorah is able to\
    \ perform independent Time Warps, allowing him to arrive in the year 1992 from\
