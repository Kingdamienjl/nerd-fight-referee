  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Longevity (Titans are millions of years\
    \ old and can remain dormant for extremely long periods of time without aging\
    \ significantly. Monarch states that creatures like Godzilla originated from a\
    \ time when the Earth was far more radioactive than it is today and survived by\
    \ retreating deep underground and beneath the oceans, where they absorbed radiation\
    \ from the planet\u2019s core for millions of yearsGodzilla (2014)), Large Size\
    \ (Type 2; 103.02 meters tall), Underwater Breathing (Type 2), Enhanced Senses,\
    \ Bodily Weaponry (Claws and jaws), Camouflage, Can create EMP waves, Vibration\
    \ Manipulation (Prime's powerful legs create thunderous steps which generate loud\
    \ seismic disturbances), Echolocation/Sound Manipulation (Prime can emit a sonic\
    \ a powerful roar, the MUTOs utilize echolocation to communicate, find a source\
    \ of radiation and locate one another), Radiation Manipulation/Absorption (Titans\
    \ naturally generate, absorb, feed on, and withstand massive amounts of radiation.\
    \ Monarch explains that Godzilla and other Titans evolved in an era where Earth\u2019\
    s radiation levels were much higher and that they consume radiation as a food\
    \ source, later adapting to absorb geothermal radiation from the planet\u2019\
    s core. Their bodies can store and emit dangerous radioactive energy without harm,\
    \ and they actively seek out nuclear energy sources to sustain themselves or reproduce),\
    \ Asexual Reproduction (However she needs a suitable host for her babies), Underground\
    \ Mobility (She was designed to dig according to her creator. Prime was able to\
    \ claw and tunnel through the Earth's crust with ease, with her underground travels\
    \ often being mistaken as natural seismic activity), Additional Limbs and Temperature\
    \ Manipulation (Her spikes are superheated), Resistance to Radiation (Titans evolved\
    \ in a prehistoric era where Earth\u2019s radiation levels were far higher than\
    \ today and naturally survive by absorbing and feeding on radiation without suffering\
    \ harm), Extreme Heat, and Fire"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
