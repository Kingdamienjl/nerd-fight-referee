  name: '... And now conducting it through his tail to lift and throw M.O.G.U.E.R.A
    away SGGvSG3.gif'
  source_field: keys
- id: spacegodzilla-using-the-corona-beam-to-damage-godzilla-in-multiple-spots-energy-manipulation-spacegodzilla-can-channel-and-absorb-energy-from-the-crystals-that-he-creates-and-from-outer-space-itself-by-channeling-it-through-his-shoulder-crystals-with-this-he-has-access-to-a-practically-limitless-amount-of-power-to-absorb-energy-from-outer-space-while-on-earth-though-other-than-needing-for-his-shoulder-crystals-to-be-intact-he-needs-to-use-a-large-structure-as-some-sort-of-satellite-like-the-fukuoka-tower-additionally-spacegodzilla-is-capable-of-channeling-energy-through-his-limbs-allowing-him-to-strike-with-more-powerful-physical-blows-corona-beam-spacegodzilla-can-fire-an-orange-energy-beam-with-electric-like-likely-solar-properties-from-its-mouth-named-after-one-of-the-atmospheric-layers-in-a-star-he-can-control-the-path-the-beam-takes-midair-allowing-him-to-bypass-an-enemy-s-potential-defenses-gravity-tornado-spacegodzilla-can-telekinetically-lift-objects-his-opponents-and-himself-by-generating-energy-from-his-crystal-shoulders-a-creature-affected-by-the-gravity-tornado-is-unable-to-break-free-or-in-godzilla-s-case-to-move-until-spacegodzilla-stops-lifting-them-or-throws-them-somewhere-sggvsg7-gif
  name: 'SpaceGodzilla using the Corona Beam to damage Godzilla in multiple spots
    *Energy Manipulation: SpaceGodzilla can channel and absorb energy from the crystals
    that he creates and from outer space itself by channeling it through his Shoulder
    Crystals: with this, he has access to a practically limitless amount of power.
    To absorb energy from Outer Space while on Earth though (other than needing for
    his Shoulder Crystals to be intact), he needs to use a large structure as some
    sort of satellite, like the Fukuoka Tower. Additionally, SpaceGodzilla is capable
    of channeling energy through his limbs, allowing him to strike with more powerful
    physical blows. **Corona Beam: SpaceGodzilla can fire an orange energy beam with
    electric-like, likely solar properties from its mouth (Named after one of the
    atmospheric layers in a star). He can control the path the beam takes midair,
    allowing him to bypass an enemy''s potential defenses. *Gravity Tornado: SpaceGodzilla
    can telekinetically lift objects, his opponents, and himself by generating energy
    from his crystal shoulders. A creature affected by the Gravity Tornado is unable
    to break free (or in Godzilla''s case, to move) until SpaceGodzilla stops lifting
    them or throws them somewhere. SGGvSG7.gif'
  source_field: keys
- id: spacegodzilla-using-the-gravity-tornado-to-throw-godzilla-into-a-building-sggvsg10-gif
  name: SpaceGodzilla using the Gravity Tornado to throw Godzilla into a building.
    SGGvSG10.gif
  source_field: keys
- id: spacegodzilla-generating-crystals-from-the-ground-sggvsg8-gif
  name: SpaceGodzilla generating crystals from the ground SGGvSG8.gif
  source_field: keys
- id: spacegodzilla-using-the-homing-ghost-against-godzilla-crystal-generation-spacegodzilla-can-create-giant-crystals-by-making-them-sprout-from-the-ground-they-act-as-sources-of-energy-that-can-be-absorbed-by-spacegodzilla-through-his-shoulder-crystals-he-can-also-use-those-crystals-to-make-some-sort-of-prisons-where-he-can-trap-his-opponents-much-like-he-did-with-little-godzilla-homing-ghost-spacegodzilla-can-use-the-crystals-that-he-creates-as-missiles-capable-of-exploding-on-contact-to-launch-at-the-opponent-those-can-either-be-launched-straight-at-the-target-or-made-rain-from-the-sky-once-up-in-the-air-while-they-travel-at-a-slow-pace-the-sheer-quantity-in-which-they-are-launched-makes-them-difficult-to-dodge-sggvsg2-gif
  name: 'SpaceGodzilla using the Homing Ghost against Godzilla *Crystal Generation:
    SpaceGodzilla can create giant crystals by making them sprout from the ground.
    They act as sources of energy that can be absorbed by SpaceGodzilla through his
    Shoulder Crystals. He can also use those Crystals to make some sort of prisons
    where he can trap his opponents, much like he did with Little Godzilla. **Homing
    Ghost: SpaceGodzilla can use the crystals that he creates as missiles capable
    of exploding on contact to launch at the opponent: those can either be launched
    straight at the target or made rain from the sky once up in the air. While they
    travel at a slow pace, the sheer quantity in which they are launched makes them
    difficult to dodge. SGGvSG2.gif'
  source_field: keys
- id: spcegodzilla-reflecting-an-atomic-breath-with-the-photon-reactive-shield-sggvsg9-gif
  name: SpceGodzilla reflecting an Atomic breath with the Photon Reactive Shield SGGvSG9.gif
  source_field: keys
- id: spacegodzilla-using-the-photon-hurricane-sggvsg4-gif
  name: SpaceGodzilla using the Photon Hurricane SGGvSG4.gif
  source_field: keys
- id: the-photon-hurricane-disrupting-m-o-g-u-e-r-a-aura-spacegodzilla-produces-an-aura-capable-of-causing-electrical-disturbances-photon-reactive-shield-spacegodzilla-is-capable-of-creating-a-crystal-like-forcefield-capable-of-blocking-and-deflecting-energy-attacks-like-godzilla-s-atomic-breath-photon-hurricane-a-ring-shaped-electromagnetic-wave-that-spacegodzilla-can-emit-to-disrupt-electrical-instruments-he-used-this-attack-on-m-o-g-u-e-r-a-along-with-his-corona-beam-to-make-it-incapable-of-fighting-him-while-he-was-flying-toward-earth
  name: 'The Photon Hurricane disrupting M.O.G.U.E.R.A. *Aura: SpaceGodzilla produces
    an aura capable of causing electrical disturbances. **Photon Reactive Shield:
    SpaceGodzilla is capable of creating a Crystal-like forcefield capable of blocking
    and deflecting energy attacks like Godzilla''s Atomic Breath. **Photon Hurricane:
    A ring-shaped electromagnetic wave that SpaceGodzilla can emit to disrupt electrical
    instruments. He used this attack on M.O.G.U.E.R.A., along with his corona beam,
    to make it incapable of fighting him while he was flying toward Earth.'
  source_field: keys
