      fly at Mach 3Toho Kingdom - SpaceGodzilla), Massively FTL+ flight speed in space
      (SpaceGodzilla was born inside a black hole and later traveled from that location
      to the Asteroid Belt within a short timeframe190,000 c), Massively FTL+ attack
