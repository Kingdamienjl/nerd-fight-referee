- id: claim-weaknesses-1db82bdd
  section: weaknesses
  axis: weakness
  text: "None notable | He is susceptible to infection from the Anti-Nuclear Energy\
    \ Bacteria | Draining his nuclear reactor heart of nuclear energy fast enough\
    \ will incapacitate him. Destroying the \"second brain\" in his lower torso paralyzes\
    \ him, leaving him helpless. | Absorbing too much radiation at once will turn\
    \ him into his Burning form | Absorbing radiation accelerates his meltdown/burning,\
    \ having his temperature brought down enough can potentially stop the meltdown,\
    \ though the immense radiation will still be present. Feats: *Fought the Military\
    \ numerous times *Destroyed the Super X *Caused huge amounts of damage to Multiple\
    \ Cities *Destroyed the Super X2 *Fought and mortally wounded Biollante (resulting\
    \ in her death) *Fought and eventually killed King Ghidorah *Fought and took down\
    \ Mecha-King Ghidorah (But was defeated as well in the process) *Took down both\
    \ Battra and Mothra individually, but was defeated by them both when they joined\
    \ forces *Fought and took down Rodan *With his Spiral Fire Ray, destroyed MechaGodzilla\
    \ II *Alongside MOGUERA, killed SpaceGodzilla *Fought the Super X3 *Fought Destoroyah\
    \ *Via Meltdown, made Tokyo uninhabitable until Godzilla Junior absorbed his energy\
    \ Notable Attacks and Techniques: Atomic Breath and Derivates \u25BE= *: A powerful\
    \ beam of atomic energy fired from Godzilla's mouth. The temperature of Godzilla's\
    \ standard Atomic Breath in the Heisei series is 500,000\xB0 Celsius. *Energy\
    \ Transference: The King of the Monsters was able to instill his energy in others,\
    \ similar to how Fire Rodan did to save Godzilla after his spinal brain was destroyed.\
    \ This power was first attempted on Godzilla Junior in a small amount but was\
    \ not enough to save the younger monster. Later, while going into meltdown mode,\
    \ Godzilla transferred the last of his energy which was able to heavily mutate\
    \ and resurrect Junior into a reborn Godzilla. Spiral Heat Ray \u25BE= *: This\
    \ version of Godzilla's atomic breath is typically portrayed as much more powerful\
    \ than his normal atomic breath and is wrapped in an electrical spiral. It is\
    \ used by Godzilla in Godzilla vs. King Ghidorah to decapitate King Ghidorah's\
    \ middle head after his normal atomic breath was shown having little to no effect\
    \ on his enemy. The Spiral heat ray is still blue but is surrounded by a purplish\
    \ spiral of energy. Before Godzilla fires the spiral breath, his dorsal plates\
    \ are surrounded in blue electricity. *: A red and more powerful version of Godzilla's\
    \ atomic ray that was gained after Godzilla absorbed Fire Rodan's life energy.\
    \ It has a temperature of 1,200,000\xB0 Celsius, hot enough to burn Godzilla's\
    \ mouth. *: In Godzilla vs. SpaceGodzilla, Godzilla uses runaway cosmic energy\
    \ he absorbed after the destruction of Space Godzilla's shoulder crystals to fire\
    \ a version of the spiral heat ray called the Nuclear Fusion Heat Ray. This beam\
    \ only reaches a temperature of 900,000\xB0 Celsius but demonstrates even more\
    \ destructive power than the Hyper Uranium Heat Ray as it destroys both SpaceGodzilla\
    \ and M.O.G.U.E.R.A. in three blasts along with a large portion of Fukuoka. *:\
    \ Burning Godzilla's default beam weapon, presumably a stronger form of the Spiral\
    \ Fire Ray used by his previous form. *: The strongest Red Spiral Ray used by\
    \ Burning Godzilla, near the end of his battle against Destoroyah when Godzilla's\
    \ body was melting down, his unstable radiation boosting the beam's power significantly.\
    \ It is said to increase infinitely in power the more Godzilla uses it. Nuclear\
    \ Pulse and Variations \u25BE= *Nuclear Pulse: An omnidirectional attack where\
    \ Godzilla emits atomic energy from every inch of his body. He can also use this\
    \ move to channel energy into his physical attacks. *Infinite Burning Pulse: Near\
    \ the end of his battle against Destoroyah when Godzilla's body was melting down,\
    \ his unstable radiation boosts the nuclear pulse's power significantly. It releases\
    \ energy bursts through Godzilla dorsal spines."
