    \ MOTHERSHIP * Laser Gun: is a type of directed-energy weapon that uses lasers\
    \ to inflict damage * Katana: is a type of Katana but more durable to the point\
    \ it can redirect lasers. * Xilien Fighter: is a fighter ship utilized by the\
    \ Xiliens. * UFOs \u03B1, \xDF and \u03B3: are a trio of Xilien transport ships.\
    \ * Mothership: is the main ship used by the Xiliens in Godzilla Final Wars. The\
    \ mobile base of operations for the Xiliens in their invasion of Earth, the Mothership\
    \ released several UFOs which attacked the planet's military forces and released\
    \ the army of monsters under the aliens' control. It was eventually boarded by\
    \ the crew of the Gotengo, who defeated the Controller of Planet X and his men\
    \ after which the ship self-destructed."
