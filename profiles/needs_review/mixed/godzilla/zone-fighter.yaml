- id: claim-powers-and-abilities-afc4e08e
  section: abilities
  axis: hax
  text: "By Himself\u25BE= Superhuman Physical Characteristics, Superhuman Speed,\
    \ Space Survival (Can survive in the vacuum of space), Enhanced Senses, Martial\
    \ Arts, Acrobatics, Weapon Mastery, Vehicular Mastery, Regeneration (At least\
    \ High-Low; Peacelandians can regenerate their organs over timeZone Fighter -\
    \ Episode 02: \"Attack! Destro-King\"), Hacking, Telepathy, Transformation, Cloth\
    \ Manipulation (As shown here), Plasma Manipulation (With Maser Gun), and Summoning\
    \ (Godzilla, Smokey, and the Mighty Liner) All previous powers but far greater,\
    \ plus Large Size (Type 1; 62 meters), Underwater Breathing (Type 2), Cyborgization,\
    \ Flight, Statistics Amplification (Can increase his physical prowess with Meteor\
    \ Jet), Energy Manipulation/Projection, Danmaku, Teleportation, Immersion (As\
    \ shown here), Weapon Creation and Explosion Manipulation (With Meteor Missile\
    \ Might), Minor Physics Manipulation (Can use his static electricity to electrify\
    \ wood), Electricity Manipulation, Power Nullification (Nullified Dorola's reality-warping\
    \ powers with Meteor Proton Cut), Smoke Manipulation, Empathic Manipulation, and\
    \ Ice Manipulation/Durability Negation (With Meteor Freezer, The Meteor freezer\
    \ ability was able to destroy barakidons cellular structure), Forcefield Creation\
    \ (Can create 3 different types of energy barriers), Attack Reflection (With Meteor\
    \ Reflection Barrier), Pocket Reality Manipulation (Zone Fighter also has his\
    \ own dimension, which he uses to keep Smokey in) and Limited Magnetism Manipulation\
    \ Resistance to Radiation, Explosion Inducement, Fire, Attack Reflection (Here),\
    \ Illusion Creation, Extreme Cold/Extreme Heat (His skin can withstand temperatures\
    \ from -150 degrees to 1,000 degrees), Acid/Corrosion Inducement (Able to resist\
    \ acidic Mist), Durability Negation, Electro-Magnetism Manipulation and Extreme\
    \ Gravity (Survived point-blank shots from King Ghidorah's Gravity Beams, that\
    \ can destroy the Gravity of an opponent by breaking them apart, likely on a Sub-Atomic\
    \ level since physics and gravity work on that level) All the abilities of his\
    \ base form, plus all of Smokey and Mighty Liner abilities"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
