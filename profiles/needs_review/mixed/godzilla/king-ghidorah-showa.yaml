    - field: powers_and_abilities
      value: 'In Ghidorah, the Three-Headed Monster, while encased in the meteorite,
        King Ghidorah had the ability to generate what appeared to be magnetic fields
        that varied in strength from time to time. While it was never stated directly
        what purpose they served, it was stated that they were somehow connected to
        his powers. In Zone Fighter, King Ghidorah seems to retain his control over
        gravity/magnetism, managing to suspend several cars midair above a research
        institute, though how he achieves such a feat goes unexplained., Meteor Transformation:
        The creature was able to incase itself in a meteor that had magnetic properties.
        This was done when the creature first came to Earth, and crash-landed in this
        form. To change back, the three-headed monster becomes engulfed in flames
        as its body takes shape. Later, the second King Ghidorah appeared in this
        form next to Gigan, transforming into its normal form in space before continuing
        to Earth., Flight: King Ghidorah can fly up to speed of Mach 3 in the Earth''s
        atmosphere by flapping his gigantic wings. He exceeds this speed and reaches
        a speed of 640,700,000 c while flying through space.'
      source_id: mediawiki-4297
      provider_id: vsbattles
      authority: high
      confidence: 0.75
