- id: claim-powers-and-abilities-56ed6b11
  section: abilities
  axis: hax
  text: 'Small Size (Type 3; 0.1 millimeters in size), Enhanced Senses, Accelerated
    Development/Adaptation & Reactive Evolution (Battle; Physical Stats & Abilities
    - Grows stronger every time he fights and can become stronger in the midst of
    combat), Space Survival (Can survive in the vacuum of space. As an alien life
    form Hedorah does not require oxygen to survive, but rather thrives on inhaling
    toxic pollutants), Inorganic Physiology (Type 1; Made out inorganic material/pollution),
    Underwater Breathing (Type 2; Can live underwater), Regeneration (Low-High), Radiation
    Manipulation, Resistance to Radiation, Cold, Pain (Hedorah cannot feel any pain),
    and Bone Manipulation (Boneless) All prior abilities minus Small Size, plus: Superhuman
    Physical Characteristics, Immortality (Type 2; Even when badly injured it can
    reanimate), Multiple Selves (Type 3), Can fire chunks of its acidic body, Corrosion
    Inducement (His body has a corrosive effect), Can disperse into water and pollution,
    Acrobatics, Able to absorb pollution to increase his size and power. Increases
    in toxicity as he absorbs more pollution, Duplication/Fusionism (Hedorah is a
    hive organism, composed of multiple smaller Hedorahs having joined together) All
    previous abilities highly enhanced, plus: Resistance to Extreme Heat, and Fire
    All previous abilities highly enhanced, plus: Flight, Able to change back and
    forth between Flying form and Final form, Able to combine with other Hedorah''s
    and change form and size, Smoke Manipulation/Poison Manipulation (Poisonous Black
    Smoke; Spreads sulfuric acid mist in Flying form), Energy Manipulation/Projection,
    Extreme Heat Generation/Light Manipulation and Explosion Generation (Explosive
    Crimson Ray which is 100,000 degree Celcius heat, Red Light) All previous abilities
    highly enhanced minus flight, plus able to discharge vast quantities of sludge'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
