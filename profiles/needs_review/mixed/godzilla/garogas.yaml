    SPACE STATION Garoga_Spacer.jpg|GAROGA SPACER Garoga_car_02.jpg|GAROGA CAR * Garoga
    Nuke: is a world mass destruction weapon created by the alien race of The Garogas
    (See Garoga Nuke). * Garoga Compactor: is one of the strongest Garogas weapons
    designed to kill Zone Fighter once and for all (See Garoga Compactor). * Garoga
    Space Station: In their bid for conquest, the Garoga aliens constructed a giant
    space station. Acting as their central command, the space fortress was heavily
    staffed. Among the personnel were both those militant and those in the science
    department (See Garoga Space Station). * Garoga Spacer: Concealed deep within
    Fourth-Dimensional space, the Garoga''s fleet of fighter craft were formidable
    weapons of Terror seemingly being held in reserve for some later stage of the
    invasion. Called out to repel the invasion of Peacelandians into their dimension,
    the craft engaged in a massive dogfight with Mighty Liner- with only the Zone
    Family craft emerging from the battle unscathed (See Garoga Spacer). * Garoga
    Car: Used in furtive missions by the Garoga Agents (See Garoga Car).'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-c68156c9
  section: abilities
  axis: hax
  text: "By Themselves\u25BE= Superhuman Physical Characteristics, Immortality (Type\
    \ 1; They can never die), Space Survival (Can survive in the vacuum of space),\
    \ Self-Sustenance (Type 2; Can survive without food), Genius Intelligence, Enhanced\
    \ Senses, Martial Arts, Acrobatics, Weapon Mastery, Vehicular Mastery, Shapeshifting/Transformation\
    \ (Shown here), Cloth Manipulation, Danmaku, Animal Manipulation (Can command\
    \ different alien kaiju from different planetsZone Fighter - Episodes 01 to 26),\
    \ Body Control (They can remove their antennas and use they as a weapon), Fusionism,\
    \ Energy Manipulation/Projection, Minor Elasticity (Antenna elasticityZone Fighter\
    \ - Episode 01: \"Destroy the Terror-Beast Missile!\"), Technology Manipulation\
    \ (They can control technology with a hand held deviceZone Fighter - Episode 02:\
    \ \"Attack! Destro-King\"), Teleportation (They can teleport themselvesZone Fighter\
    \ - Episode 03: \"Strike! Garoga's Subterranean Base\"), Immersion (Shown hereZone\
    \ Fighter - Episode 04: \"Invasion! The Giant Garoga Army - Enter Godzilla\"),\
    \ Resistance to Radiation, Extreme Heat, Fire and Cold All the abilities of his\
    \ base form, plus all of Grotogauros abilities With Equipment\u25BE= All the abilities\
    \ of his base form, plus Corruption (Type 1; Can turn humans into Garogas via\
    \ an elixirZone Fighter - Episode 14: \"Frenzy! The Garoga Junior Attack Squad\"\
    ), Danmaku, Telepathy/Mind Control (With Mind control deviceZone Fighter - Episode\
    \ 16: \"Terrifying Assault! Garoga Robot\"), Information Analysis, Electricity\
    \ Manipulation, Explosion Generation/Creation and Construction (They have missiles\
    \ which can instantly construct underground bases), Paralysis Inducement (Paralysis\
    \ inducement helmetsZone Fighter - Episode 05: \"Shoot Down King Ghidorah!\"),\
    \ Sleep Manipulation/Status Effect Inducement (They have a sleep agentZone Fighter\
    \ - Episode 07: \"Zone Family's Critical Moment!\"), Poison Manipulation/Durability\
    \ Negation (They have a deadly poison), Smoke Manipulation/Size Manipulation and\
    \ Sealing (The Garogas can shrunk the Terror-Beasts and seal them in devices),\
    \ BFR (The Garogas have a device that can be used to BFR people to the \u201C\
    negative fourth dimension\u201D), Dimensional Manipulation (Garogas also have\
    \ the fourth-dimensional net. Which has many different uses. It can fired from\
    \ a gun to send car-sized objects into the fourth dimension), Pocket Reality Manipulation\
    \ (The Garogas also have their own dimension, which they use to hide spaceships)\
    \ All the abilities of his base form, plus Transformation/Camouflage (Can disguise\
    \ their cars as regular trucks) and Portal Creation/Dimensional Travel (These\
    \ cars can open portals to other dimensions) All the abilities of his base form,\
