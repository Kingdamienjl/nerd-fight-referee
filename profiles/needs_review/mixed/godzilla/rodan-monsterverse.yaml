- id: claim-powers-and-abilities-bfe5b582
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Longevity (Titans are millions of years\
    \ old and can remain dormant for extremely long periods of time without aging\
    \ significantly. Monarch states that creatures like Godzilla originated from a\
    \ time when the Earth was far more radioactive than it is today and survived by\
    \ retreating deep underground and beneath the oceans, where they absorbed radiation\
    \ from the planet\u2019s core for millions of yearsGodzilla (2014)), Immortality\
    \ (Type 3; Can regenerate lethal wounds), Large Size (Type 1 in height; 46.9 meters\
    \ tall. Type 2 for wingspan; 265.5 meters), Flight, Heat Manipulation (Rodan possesses\
    \ an internal volcanic combustion system, causing him to radiate heat, the temperature\
    \ of which can reach up to 1200\xB0C), Air Manipulation (Can generate giant shockwaves\
    \ while flying that can level entire cities), Bodily Weaponry (Beak and claws),\
    \ Radiation Manipulation/Absorption (Titans naturally generate, absorb, feed on,\
    \ and withstand massive amounts of radiation. Monarch explains that Godzilla and\
    \ other Titans evolved in an era where Earth\u2019s radiation levels were much\
    \ higher and that they consume radiation as a food source, later adapting to absorb\
    \ geothermal radiation from the planet\u2019s core. Their bodies can store and\
    \ emit dangerous radioactive energy without harm, and they actively seek out nuclear\
    \ energy sources to sustain themselves or reproduce), Camouflage, Regeneration\
    \ (Low-Mid; Regenerated after being stabbed by Mothra), Inorganic Physiology (Type\
    \ 1; Rodan's body is made out of lava), Earth Manipulation/Magma Manipulation\
    \ (The novelization reveals that Rodan can make volcanoes erupt by simply flying\
    \ over them), Resistance to Radiation (Titans evolved in a prehistoric era where\
    \ Earth\u2019s radiation levels were far higher than today and naturally survive\
    \ by absorbing and feeding on radiation without suffering harm), Magma Manipulation\
    \ and Heat Manipulation"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
