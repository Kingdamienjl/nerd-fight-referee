    field_candidates:
    - field: powers_and_abilities
      value: 'right, 50pxStar Powers are passive abilities that often increase statistics
        or increase the utility of pre-existing abilities of Brawlers or even introduce
        new passive abilities. Every Brawler has two Star Powers unique to themselves.
        Only one Star Power can be equipped by a Brawler at a time., Gears: right,
        50pxGears are passive abilities that are often times only statistic amplifications
        that last for a long time. There are 6 Super Rare Gears, which every Brawler
        has access to. That''s the Speed Gear, which makes Brawlers move faster by
        15% when moving in bushes, the Damage Gear that boosts a Brawler''s damage
        by 15% when they are under half their health, the Health Gear that makes Brawlers
        heal 50% more each second, the Vision Gear that allow Brawlers to see enemies
        hiding in bushes for two seconds after hitting them, the Shield Gear that
