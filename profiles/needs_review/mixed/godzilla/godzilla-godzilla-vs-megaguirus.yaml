- id: claim-weaknesses-6b04b563
  section: weaknesses
  axis: weakness
  text: "None notable \u200BFeats: *\u200BDefeated and killed Megaguirus (GxM) Notable\
    \ Attacks and Techniques: Notable Attacks and Techniques: *: Like other incarnations\
    \ of Godzilla, this Godzilla possesses the character's signature atomic breath.\
    \ This Godzilla's atomic breath is more or less identical to that of the Godzilla\
    \ from the previous film. Godzilla's dorsal fins glow orange and begin giving\
    \ off intense heat, then Godzilla unleashes a fiery orange beam from his mouth.\
    \ The beam has incendiary properties, producing fiery explosions upon striking\
    \ surfaces or other monsters *Bite/Dorsal Spines Slash: Megaguirus is an insanely\
    \ fast being for its size. Supersonic+ by all accounts. Godzilla was able to adapt\
    \ to that speed. Catching Megaguirus' stinger attack via the jaws, and slicing\
    \ off Megaguirus left claw with the back spines. *Mega-Jump: Godzilla then jumps\
    \ high into the air and body-slams Megaguirus. *Prehensile tail/Tail Fling: When\
    \ Megaguirus tries to attack Godzilla from behind, he uses his prehensile tail\
    \ to grab her stinger, then pins her stinger into the ground. Godzilla then jumps\
    \ high into the air and body-slams Megaguirus. *Heat Manipulation: The dorsal\
    \ plates create a tremendous amount of heat when the atomic ray is being prepared."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-68c6378e
  section: abilities
  axis: hax
  text: Border|||Content= Godzilla Physiology,This Godzilla is an alternate version
    of the original Godzilla. Large Size (Type 1; 55 meters), Self-Sustenance (Type
    1; Though technically a reptile and not an amphibian, Godzilla has an amphibious
    lifestyle. He spends half of his life in water and the other on land. Godzilla
    can remain completely submerged underwater for long periods, and Kyohei Yamane
    suggests that he survived for millions of years living inside a deep underwater
    cavern.Godzilla (1954) This idea is supported by official artwork of the 1954
    Godzilla living with other Godzillas underwater before a huge explosion destroys
    his habitat, killing his companions and burning and enraging Godzilla, and drawing
    him to the surfaceDefinitive Edition Godzilla Introduction (14th Edition). Shogakukan.
    20 November 1996. p. 54. ISBN 4-09-220142-7.), Skilled in Hand-to-Hand Combat,
    Acrobatics, Body Control (Prehensile tail), Energy Projection (Mainly nuclear
    energy, but he can also project electricity and other kinds of energy), Underground
    Mobility (Able to burrow)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
