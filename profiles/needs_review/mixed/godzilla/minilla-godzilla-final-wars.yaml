- id: claim-weaknesses-29cffddd
  section: weaknesses
  axis: weakness
  text: 'Is too young, and so has no combat experience Notable Attacks and Techniques:
    right|400px right|400px *: Minilla learned to use a true atomic breath in Son
    of Godzilla. Initially, despite his best attempts, he couldn''t fire the atomic
    breath as Godzilla demonstrated to him. After Godzilla stepped on his tail, he
    managed to fire it and later fired it on his own as his father slept. Minilla
    later used his atomic breath to assist his father during the battle against Kumonga.
    Minilla was shown firing an atomic ray at the very end of Godzilla: Final Wars.
    *Smoke Ring: Minilla''s main weapon is atomic smoke rings. These smoke rings,
    while significantly weaker than his father''s atomic breath, can interact with
    physical objects and tighten around opponents to injure or even strangle them.
    *Size Shifting: Minilla demonstrated he could grow rapidly in Godzilla: Final
    Wars, going from 1.6 to 20 meters in a matter of seconds.'
