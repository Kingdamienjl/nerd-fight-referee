- id: claim-weaknesses-49d18566
  section: weaknesses
  axis: weakness
  text: '*A relevant aspect of his anatomy is a "second brain", a ganglion that controls
    the agile movement of the lower body, presenting a vulnerability. *Introduction
    of cadmium in his organism negatively impacts his internal energy generator, diminishing
    the efficiency of his stomach nuclear reactor which Godzilla converts energy to
    sustain his abilities. *Godzilla is sensitive to light due to his nocturnal nature,
    making him enraged or confused when exposed to strong lights. Feats: *Melted nearby
    transmission towers with his Atomic Breath, which yielded this much.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-282a6bcc
  section: abilities
  axis: hax
  text: "Godzillas have many abilities, which can vary from monster to monster, including\
    \ flight, project energy-based attacks, and the ability to sense other monsters.\
    \ However, all Godzillas share a few of the same abilities. These include: *Superhuman\
    \ Physical Characteristics **Longevity (Godzilla has prehistoric origins, awakened\
    \ by nuclear tests [https://streamable.com/95omp presenting the sole sample originating\
    \ from the age of the dinosaurs], and is believed to have lived on Earth around\
    \ 60 to 200 million years ago) **Large Size (Type 1; [https://www.tohokingdom.com/kaiju/godzilla54.htm\
    \ The Godzillas' height generally is around 50 meters tall]) **Non-Standard Breathing\
    \ (Types 1 & 2) & Self-Sustenance (Type 2; Though technically a reptile and not\
    \ an amphibian, Godzilla has an amphibious lifestyle. He spends half of his life\
    \ in water and the other on land. Godzilla can remain completely submerged underwater\
    \ for long periods with ease, and [https://streamable.com/95omp Kyohei Yamane\
    \ suggests that he survived for millions of years living inside a deep underwater\
    \ cavern]. Godzilla can casually live in the depths of underwater caves in the\
    \ South Pacific, where light is scarce, and as a result, he developed a natural\
    \ ability to see in the darkness by adapting through the conditions of this ambient\
    \ of low luminosity]) ***Instinctive Action (Godzilla\u2019s brain contains the\
    \ same magnetic material as the homing instinct of migratory birds, allowing him\
    \ to align with the magnetic axis of Earth) **Regeneration (At least Mid-Low;\
    \ Has regeneration from his G-Cells, which have the ability to quickly heal him\
    \ from wounds) ***Immortality (Type 3) *Absorption (Energy [Nuclear, Radiation,\
    \ Thermal]) & Adaptation ([https://streamable.com/95omp After being hit by a hydrogen\
    \ bomb, instead of succumbing to the explosion, Godzilla rather survived and absorbed\
    \ the energy generated by the blast], Dr. Kyohei Yamane proposed that Godzilla\
    \ is a species who lived between the Jurassic and Cretaceous periods, which according\
    \ to the idea, he would have evolved from marine reptiles to land-based mammals\
    \ over time) **Accelerated Development (Other [Absorption, Exposure, Mutation]\
    \ - Physical Statistics, Abilities, Other [Metabolism]; Mere footprints from Godzilla\
    \ contains strong amounts of Strontium-90, given his exposure to extreme amounts\
    \ of radioactivity, however, his vital functions weren't affected at all, and\
    \ the radiation had made Godzilla to develop notable mutations in his body, granting\
    \ him a set of new abilities such as his Vapor Breath and radioactivity, those\
    \ where results from repeated hydrogen bomb tests at Godzilla's location) *Camouflage\
    \ (In his native environment, his dark skin helps him blend in with the dark depth\
    \ ocean.) *Radiation & Magnetism Manipulation ([https://streamable.com/95omp Godzilla\
    \ is a prehistoric creature],), likely Small City level (Said to be capable of\
    \ destroying mountains with his tail, which should be this strong), Island level+\
    \ via Atomic Breath"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
