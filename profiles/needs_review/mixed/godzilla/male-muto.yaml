    \ significantly. Monarch states that creatures like Godzilla originated from a\
    \ time when the Earth was far more radioactive than it is today and survived by\
    \ retreating deep underground and beneath the oceans, where they absorbed radiation\
    \ from the planet\u2019s core for millions of yearsGodzilla (2014)), Large Size\
    \ (Type 1), Echolocation (The MUTOs utilize echolocation to communicate, find\
    \ a source of radiation and locate one another), Can create EMP waves, Enhanced\
    \ Senses, Natural Weaponry (Claws and jaws), Radiation Manipulation/Absorption\
    \ (Titans naturally generate, absorb, feed on, and withstand massive amounts of\
    \ radiation. Monarch explains that Godzilla and other Titans evolved in an era\
    \ where Earth\u2019s radiation levels were much higher and that they consume radiation\
    \ as a food source, later adapting to absorb geothermal radiation from the planet\u2019\
    s core. Their bodies can store and emit dangerous radioactive energy without harm,\
    \ and they actively seek out nuclear energy sources to sustain themselves or reproduce),\
    \ Additional Limbs, Flight, Camouflage, Underwater Breathing (Type 2), Underground\
    \ Mobility (Upon hatching, the Male MUTO immediately burrowed into the sea as\
    \ a Larva), Resistance to Radiation (Titans evolved in a prehistoric era where\
    \ Earth\u2019s radiation levels were far higher than today and naturally survive\
    \ by absorbing and feeding on radiation without suffering harm) and Electricity"
  source_ids: *id003
  decisive: true
