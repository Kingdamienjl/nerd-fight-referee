- id: claim-weaknesses-5b2985e5
  section: weaknesses
  axis: weakness
  text: 'None notable | After the climactic battle of Godzilla Against Mechagodzilla,
    Godzilla was left with a large chest wound that didn''t fully heal, and became
    scarred over the events of the following film. This wound became a weak point
    in Godzilla. In addition, this Godzilla displays very little strategy or complex
    thought while fighting, and appears to rely mainly on animal cunning and instinct.
    Feats: *Caused huge amounts of damage to Multiple Cities and Settlements *Fought
    the Military numerous times *Fought Kiryu and Mothra (Kiryu Saga) Notable Attacks
    and Techniques: *: As with past incarnations, the Kiryu Saga Godzilla''s trademark
    ability is his atomic breath. As he charges the beam, Godzilla''s dorsal fins
    flash and glow blue, after which Godzilla launches a superheated blue beam from
    his mouth. This Godzilla''s atomic breath is extremely powerful, capable of leveling
    entire city blocks or destroying JSDF vehicles upon impact. Even Kiryu proved
    extremely vulnerable to Godzilla''s atomic breath, as direct hits were able to
    knock him out of commission several times.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
