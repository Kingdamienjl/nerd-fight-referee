    the other on land. Godzilla can remain completely submerged underwater for long
    periods, and Kyohei Yamane suggests that he survived for millions of years living
    inside a deep underwater cavern.Godzilla (1954) This idea is supported by official
    artwork of the 1954 Godzilla living with other Godzillas underwater before a huge
    explosion destroys his habitat, killing his companions and burning and enraging
    Godzilla, and drawing him to the surfaceDefinitive Edition Godzilla Introduction
    (14th Edition). Shogakukan. 20 November 1996. p. 54. ISBN 4-09-220142-7.)
