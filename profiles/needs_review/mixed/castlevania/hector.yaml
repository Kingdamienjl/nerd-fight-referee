    - field: powers_and_abilities
      value: '{{Scroll box|1=*Vampire Physiology *Dark Magic (Dracula is highly well-versed
        and trained in the arts of magic: In addition to his inventions being extremely
        scientifically advanced, Dracula has also applied magic into his inventions
        and is indicated to have been the one who created and enchanted his castle
        himself) *Energy Manipulation *Elemental Manipulation (Dracula has tremendous
        control over the elements, particularly fire. He can transform his body into
        flames and project himself through fires in any location. He can manifest
        fire anywhere, even in the sky, and his power over the elements was such that
        he was able to easily destroy Targoviste with sheer elemental attacks, releasing
        thunderstorms, tornadoes and meteors. When fighting the trio at the end, Dracula
        manifested a huge burning ball of molten lava-like fire. It was powerful enough
        that Sypha could not deflect it without aid from Trevor and Alucard) *Astral
        Projection (Dracula has displayed the ability to magically send a projection
        of himself, which he can do in either the form of fires or flocks of crows)
        *Statistics Amplification (Scale to his son, who could use his high speed
        technique) *Master of Martial Arts (Unlike ordinary vampires, Dracula wielded
        extraordinary power and mastery as a martial artist and accomplished this
        degree of power using only the power of his body and his millennia worth of
        experience. His physical powers and skills were beyond extraordinary, and
        he has been seen to have a methodical but savage fighting style, landing powerful
        blows with pinpoint accuracy and using his reflexes to easily deflect attacks
        from even the most talented of fighters. Even opponents at range were unsafe
        as he could instantly scale walls and kill with perfectly aimed punches and
        slashes. His skills allowed him to single-handedly slaughter many merchants
        and vampires effortlessly, instantly overtake and severely injure Alucard,
        quickly overpower Trevor Belmont armed with his whip, and even while weakened
        by having been attacked by the Morning Star whip and his fireball deflected
        back at him, he could still outfight Alucard for the majority of their altercation)
        *Fire Manipulation (Can create firestorms, capable of attacking with giant
        Fire Balls) *Electricity Manipulation (Can release Lightning with a wave of
        his hand) *Air Manipulation (Can create huge tornados and mix them with fire)
        *Earth Manipulation (Can provoke small earthquakes) *Weather Manipulation
        (Can easily create thunderstorms, firestorms, bloodstorms) *Blood Manipulation
        (Can create a bloodstorms) *Beast Mastery ((Has mastery of various sorts of
        demonic beasts, such as hellish bats and ravens) *Shapeshifting (Can manifest
        as a pillar of fire, as flaming clouds, or as swarms of bats / ravens) *Regeneration
        Negation (Up to at least Low-Mid: Even after sleeping in his coffin for one
        year, Alucard has yet to regenerate from the wounds Dracula left him with)
        *Summoning (Able to summon armies of demons from the guts of Hell) *Weapon
        Control (Scale to his son who can move his sword to cover him during battle
        and he can call it from many meters away) *Teleportation (Dracula possesses
        a magical device that he can interact with to teleport his castle, which he
        can control the impact released to either be soft or capable of explosive
        force that could easily heavily damage cities. He also displayed the ability
        to use mirrors as portals, transporting Isaac to the dessert he came from)}}
        |-|Resistance={{Scroll box|1=Resistance to: *Fire Manipulation (Unharmed by
        Sypha''s Fire Magic, was capable of enduring his own Fire Ball without damage)
        *Holy Manipulation & Heat Manipulation (Survived a hit from the Morning Star)
        *Extreme Cold (As stated by Hector, Vampires don''t feel any cold) *Transmutation,
        Necromancy and Corruption (Type 2: As the lord of vampires, he''s unaffected
        by other human magics, which should let him resist Devil Forgemaster magic
        just like Carmilla did when she fought Isaac)}}'
