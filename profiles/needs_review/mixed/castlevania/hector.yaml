    - field: intelligence
      value: "Recognized as Achilles\u2019 greatest rival, Hector is undoubtedly the\
        \ mightiest warrior of Troy. He managed to kill Achilles\u2019 close friend\
        \ Patroclus and stalemate Aias the Great in single combat. He only lost to\
        \ Achilles due to a paper-thin difference in skill, demonstrating tremendous\
        \ skill with both the sword and spear against some of the greatest heroes\
        \ of Greece and allowing him to be summoned either as a Saber-class or Lancer-class\
        \ after ascending to the Throne of Heroes as a result and is even stated to\
        \ be one of three foes Achilles himself never wants to fight ever again. Hector\
        \ possesses great leadership and tactical abilities as the high-commander\
        \ of the Trojan forces. He easily betrayed the expectations of the gods through\
        \ his unorthodox and pragmatic tactics, even turning the tide against the\
        \ invading Greek forces despite their overwhelming superior numbers and great\
        \ warriors. Although he maintains a facade as a lazy and lackadaisical man,\
        \ he is actually extremely perceptive, using his dying breaths to expose Achilles'\
        \ weakness to the Trojans, and it was even said that he would not have been\
        \ deceived by the Trojan Horse and potentially won the war for the Trojans\
        \ had he been alive and if not for Achilles being present in the war."
      source_id: vsbattles-hector
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Cannot fight in Spirit form. Has to retrieve Durindana after using it\
        \ as a throwing spear. Notable Attacks/Techniques: ===Noble Phantasm=== Durindana.png|Spear\
        \ Durindana FGO.gif|Durindana: Ultimate Unbroken Spear {{Quote|If you want\
        \ to stop this, you should either bring Achilles\u2019 or Aias\u2019 shield,\
        \ Durindana Pilum!|Hector using his Noble Phantasm}} Durindana: Hector's favored\
        \ weapon, originally a golden sword famed for its brilliant golden hue and\
        \ unbreakable constitution. Hector modified it into a spear due to the advantage\
        \ of using it as a projectile. After his death, it lost its function as a\
        \ spear and became the famed sword of the knight Roland, Durandal: Ultimate\
        \ Unbroken Hallow. As a Servant, Hector can modify the length of its hilt\
        \ and grip at will, allowing him to utilize it as both a sword and his throwing\
        \ spear regardless if he was summoned as a Saber or Lancer. * Durindana Pilum:\
        \ Ultimate Unbroken Spear: Hector's legendary throwing spear, said to have\
        \ been able to pierce through anything. After extending the handle, Hector\
        \ calls the spear's True Name as the base of the weapon ignites to propel\
        \ the spear as he flings it into his chosen target, culminating in a powerful\
        \ explosion. This attack proved powerful enough to not only pierce the God\
        \ Hand of the mighty Heracles, but also the resilient skin of the infamous\
        \ Minotaur, who is even stronger than Heracles himself in both strength and\
        \ durability, during the Okeanos singularity. When used while he was alive,\
        \ it even managed to pierce all but the final layer of the original Rho Aias,\
        \ a powerful shield said to be an absolute defense against all projectiles.\
        \ However, he has to retrieve the spear afterward, forcing him to fight barehanded\
        \ until he does so. * Durindana Spada: Ultimate Unbroken Sword: The original\
        \ form of Durindana. It is a simple sword with no outstanding attributes aside\
        \ from its unbreakable nature, where it simply deals a great amount of damage\
        \ due to the quality of the weapon. ===Class Skills=== Magic Resistance: An\
        \ innate ability that grants protection against magical effects. Unlike the\
        \ Resistance effect that merely rejects Magical Energy, this ability cancels\
        \ the spells altogether. Hector\u2019s B-rank Magic Resistance negates spells\
        \ with a chant below three verses, making it difficult for even High-Thaumaturgy\
        \ and Greater Rituals to affect him. Riding: The ability to ride mounts. Due\
        \ to his B-Rank in this skill, Hector can ride any sort of mount with above\
        \ average skill except for members of the Phantasmal Species. ===Personal\
        \ Skills=== Disengage: The ability to break away from combat. Hector's guerrilla\
        \ tactics give him a relatively high B-Rank in this skill, allowing him to\
        \ return the conditions of a fight back to what they were at the beginning.\
        \ Military Tactics: The tactical knowledge used for battles where armies are\
        \ mobilized. Due to Hector's keen leadership and tactical knowledge during\
        \ the Trojan War he gains a bonus modifier to his Anti-Army Noble Phantasms.\
        \ Thus improving the effectiveness of Durindana Pilum. Due to holding off\
        \ the Achaean Army\u2019s siege for many years, Hector receives a particularly\
        \ sharp bonus when engaging in a battle of attrition. Proof of Friendship:\
        \ A skill representing Hector's skill as a diplomatic politician, he can temporarily\
        \ suppress the fighting spirit of those who aren't suffering from mental illness\
        \ in order to conduct a conversation with them and potentially form an alliance\
        \ to end the battle. ==Notable Matchups== Victories: Losses: Inconclusive:\
