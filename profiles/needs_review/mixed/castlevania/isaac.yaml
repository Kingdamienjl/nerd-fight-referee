        useful abilities to support Isaac such as healing, poison powder, lullaby
        and invisible magic. **Battle-Type: There are several different shapes of
        this type, such as the golem, skullknight, samurai-like, liquid golem, etc.
        they''re useful to fight in combat. **Bird-Type: The flying creatures in shape
        of birds or dragons. The Bird-Type is stronger than the Fairy-Type but weaker
        than the Devil-Type or Battle-Type. It''s very agile, giving it an advantage
        over ground enemies. They can easily defeat light enemies by juggling them
        but suffer against armored or heavy enemies. **Mage-Type: The wizard-like
        Innocent Devils. They are the only true magic-users of the Innocent Devils
        by casting elemental magic and time stop. **Devil-Type: The winged-devil.
