    Item Crash Maria Egg Item Crash.gif|Egg Item Crash Maria Cardinal Item Crash.gif|Suzaku
    Item Crash Maria Cat Item Crash.gif|Byakko Item Crash Maria Dragon Item Crash.gif|Seiryuu
    Item Crash Maria Turtle Item Crash.gif|Genbu Item Crash *Chi Ball: Maria''s most
    rudimentary magical attack. She charges her magical energies and releases them
    in the form of an energy ball. *Guardian Knuckle: Maria focuses her magical power
    and manifests a guardian spirit, which will dash towards her opponent and assault
    them with an intense flurry of rapid punches. Alternatively, she can focus all
    of her magical power on one fist and release it in the form of a single yet devastating
    energized fist. *Magical Songbook: Maria can use a songbook in combat, releasing
    magical soundwaves that destroy all nearby enemies. *Magical Egg: Maria raises
    a magical egg. Her powers cause it to hatch open, releasing numerous birds the
    fly towards her enemies. *Martial Arts: By age 17, Maria Renard had mastered her
    skills in physical combat and was no longer the clumsy, amateurish brawler she
    was as a child. With strength and technique nearly rivaling that of Richter Belmont,
    she can perform a variety of offensive moves: **Kick: Maria prioritizes attacking
    with her legs, and as such, will use a variety of kicking techniques in combat.
    **Drop Kick: A devastating dash kick performed by Maria, in which she leaps forward
    at full speed and hits her opponent with a spinning kick. **Jump Kick: While leaping
    high in the air, Maria can propel herself downwards with a dashing kick. **High
    Jump: Maria propels herself numerous feet into the air, plowing through any enemies
    that stand in her way and allowing her to reach higher areas. **Rolling'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
