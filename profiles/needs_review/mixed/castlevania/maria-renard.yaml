        bring protection, and for generations, they have been the symbol of the Renard
        Family. Maria''s doves serve primary offensive purposes, manifesting on her
        palms and gracefully flying to their nearby target, causing light damage.
        *Cardinal: Maria summons vermillion birds of fire which fly from her hands
