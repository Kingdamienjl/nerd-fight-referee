    himself in a fire aura, which enhances his physical power to deliver devastating
    punches and kicks **Golden Aura: Trevor covers himself ina golden aura, which
    greatly enhances his durability *Item Crashes: Trevor is capable of performing
    what is known as an Item Crash, a devastating combination of his Magical strength
    with his arsenal of Sub-Weapons. Each weapon has its own Item Crash, all unique
    yet equally devastating. **Blade Serpent: The Dagger''s Item Crash. Trevor unleashes
    a torrent of Silver Daggers that swarm onto his enemies, dashing through the air
    with a serpent-like pattern. **Destruction: The Axe''s Item Crash. Trevor joins
    both hands above his head, summoning a gigantic axe and slamming it onto the ground,
    provoking a quake that pushes all enemies away from him. **Grand Cross: The Holy
    Cross'' Item Crash. Trevor floats and releases immense magical power in the form
