    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: * Belmont Clan: Trevor is a
        descendant of the legendary Belmont Clan. The Belmonts are renowned as the
        most powerful Vampire Hunters of all, and it is their destiny to face the
        Vampire King Dracula every century. As a Belmont, Trevor possesses incredible
        superhuman abilities which allow him to defeat most creatures of the Night
        with ease. * Holy Magic: As a Belmont, Trevor possesses control over Holy
        Magic. This trait has been present in the Belmont Clan since its inception,
        though its potency became greatly increased as a result of the marriage ancestor
        Trevor and the witch Sypha Belnades. Ever since then, the Belmonts have displayed
        great offensive magical powers, and the wizards of the Belnades Clan have
        been their close allies in Vampire-hunting. Years after marrying Sypha, Trevor
        demonstrated a great improvement in his magical powers, both in variety and
        potency. ** Flaming Fist: Trevor covers himself in a fire aura, which enhances
        his physical power to deliver devastating punches and kicks ** Golden Aura:
        Trevor covers himself ina golden aura, which greatly enhances his durability
        * Item Crashes: Trevor is capable of performing what is known as an Item Crash,
        a devastating combination of his Magical strength with his arsenal of Sub-Weapons.
        Each weapon has its own Item Crash, all unique yet equally devastating. **
        Blade Serpent: The Dagger''s Item Crash. Trevor unleashes a torrent of Silver
        Daggers that swarm onto his enemies, dashing through the air with a serpent-like
        pattern. ** Destruction: The Axe''s Item Crash. Trevor joins both hands above
        his head, summoning a gigantic axe and slamming it onto the ground, provoking
        a quake that pushes all enemies away from him. ** Grand Cross: The Holy Cross''
        Item Crash. Trevor floats and releases immense magical power in the form of
        a pillar of light. Soon after, giant crosses manifest which begin swirling
        around the pillar, destroying all nearby enemies. ** Energy Wave: The Holy
        Water''s Item Crash. Trevor casts his Holy Water onto the ground, producing
        holy flames that chase his opponent. ** Time Stop Lv.2: The Stopwatch''s Item
        Crash. Allows Trevor to stop time for a longer period of time. * Combat'
      source_id: character-stats-profiles-trevor-belmont-mixed
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
