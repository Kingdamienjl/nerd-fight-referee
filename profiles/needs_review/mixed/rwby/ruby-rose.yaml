        She can take on entire hordes of Grimm on her own and walk away without a
        scratch and utilize the different functionalities of Crescent Rose, such as
        the massive recoil from the rifle aspect of the weapon and the weapon's transformative
        capabilities, in tandem with each other and her Semblance in order to maintain
        an edge over her opponent. She is also extremely knowledgeable regarding weapons,
        having designed and built Crescent Rose from scratch during her time at Signal
        Academy, and being able to name every individual part of her weapon. She is
        capable of analyzing a weapon she's never seen before down to the function
        and the material it's made of just by looking at it once, even when suffering
        from severe stage fright)
