- id: claim-weaknesses-00e9bbd4
  section: weaknesses
  axis: weakness
  text: 'Aura= Continual damage to her Aura will cause it to decay to the point where
    she can be left open to more significant damage. Aura''s durability is cumulative;
    it will deplete with each attack she takes and can be brought down by characters
    of similar strength. Semblances drain Aura by a small amount and without it they
    cannot be used until it is recharged. Constant exposure to extreme temperature
    can drain the user''s Aura. |-|Silver Eyes= Ruby has yet to master the powers
    of the Silver Eyes, currently requiring focus or a strong emotional state in order
    to use them properly, with outside factors such as battlefield chaos being enough
    to cause her powers to fail completely by breaking her concentration. Prior to
    Volume 7 Ruby was unable to use Silver Eyes willingly at all, only demonstrating
    the ability to utilize them involuntarily in situations where people she cares
    about have been or are in danger of being killed, such as after witnessing Pyrrha
    being murdered in front of her or Cinder almost killing Jaune, the former resulting
    in her being left unconscious for several days with no recollection of what happened
    prior, though this may have been due to the magnitude to which the ability was
    used, as when she saved Jaune the ability was far less powerful. |-|Unarmed Combat=
    Ruby is heavily reliant on her scythe in combat and is inept at unarmed combat,
    limiting her to extremely basic techniques such as punches, kicks, and headbutts
    if disarmed and forced into close quarters combat. However, Ruby has demonstrated
    some clever techniques to work around this, such as using her Semblance to knock
    opponents off guard or to enhance the power of her strikes. Notable Attacks/Techniques:
    *Crescendo: Ruby spins her scythe in a circle and damages enemies, pulling enemies
    closer with each hit and smashing enemies back with the final strike. *Reap: Ruby
    jumps into the air and spins downwards with her scythe, damaging the ground and
    using the debris as projectiles to damage enemies. center|250px *Petal Burst:
    Ruby''s Semblance, an ability which allows her to move at a much greater speed
    than what she is normally capable of, appearing as nothing but a red blur leaving
    rose petals in its wake. She is capable of using this ability in midair as a means
    of flight, using it to repeatedly change directions in mid-air and attack at high
    speeds, and to create powerful whirlwinds that can suck in and knock away objects
    and foes caught by it and envelop her enemy in a tornado-like rush of air. She
    also exhibited the ability to seemingly transform into three separate clusters
    of rose petals, allowing her to flow around an opponent and their attacks before
    reforming. It is later revealed by Penny that Ruby''s Semblance allows her to
    disassemble herself at a molecular level and reassemble at a chosen location.
    With practice, she has proven able to do the same with anyone she is in contact
    with. This allows her to go around obstacles or through paths that she would not
    otherwise fit. **Petal Burst+: Thanks to her training under Harriet in Atlas,
    Ruby''s Semblance evolved further, allowing her to move at even higher speeds,
    while also rendering her momentarily invulnerable while her Semblance is active.
    center|250px * Silver Eyes: A mysterious and powerful ability Ruby inherited from
    her mother, Summer. The Silver Eyes manifest as blindingly bright light emitted
    from Ruby''s eyes. It was revealed that this energy originates from the God of
    Light, which is able to destroy the creations of the God of Darkness, such as
    the Grimm. Effects include petrifying them typically, but also sometimes disintegrates
    them or paralyzes them. While she couldn''t activate this ability without experiencing
    immense loss, as of Volume 6 she has learned how to control and activate them,
    using it to turn the Leviathan into stone. ==Gallery== Ruby Rose.png|Ruby Rose
    in Blazblue: Cross Tag Battle Ruby 3.png|Ruby in the manga Dcl4nzw-9d5d748a-24ac-4779-8989-24c81da2260b.png|Ruby''s
    official design in RWBY: Amity Arena Amity arena website ruby rose.png|Ruby Rose
    in RWBY: Amity Arena Rwby bilibili ruby rose.png|Ruby in the Bilibili Mobile Game
    Ruby Combat Ready Cards 01.jpg|Ruby in RWBY: Combat Ready ==Notable Matchups==
    Victories: *Superman (DC Universe) Superman''s Profile (Post-Beacon/Haven was
    used. Speed was equalized. Fight took place in Central City, New York) *Scout
    (Team Fortress) Scout''s profile (Speed was equalized; Gravel War Scout and Beacon
    Ruby were used. Fight started in Scout''s effective range and took place on 2Fort)
    Losses: *Penny Polendina (RWBY) Penny''s profile (Atlas versions were both used.
    Penny can''t use her Maiden powers, fight takes place in Amity Colosseum and both
    were 50 meters apart) *Weiss Schnee (RWBY) Weiss'' Profile (Beacon versions of
    both were used) *Mori Jin (The God of High School) Mori''s Profile (Match was
    a 1v2 with Ruby Rose and Weiss Schnee on the same team. Mori Jin was in his National
    Competition Arc key. Ruby Rose and Weiss Schn'
