      value: Above Average, Gifted Combat-Wise (Though not particularly standing out
        academically, Ruby is a combat prodigy, having been allowed to attend Beacon
        Academy two years early by Professor Ozpin due to her skill in wielding Cresent
        Rose, with him even stating that it would take someone with skill comparable
