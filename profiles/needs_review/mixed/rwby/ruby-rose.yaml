        with each attack she takes and can be brought down by characters of similar
        strength. === In-Verse Moveset === *Crescent Rose: Ruby''s weapon, a large
        Scythe/High-Caliber Sniper Rifle hybrid that she wields with expert proficiency.
        The Crescent Rose possesses a converting frame, allowing Ruby to transform
        from a compact storage mode, a rifle mode, and an expanded scythe mode. The
        weapon''s rifle mode takes the form of a medium-length, bolt-action rifle.
        In this form, the absence of the scythe makes for more effective use of the
        rifle component. In its fully expanded scythe mode, Crescent Rose makes for
        a deadly mid-to-close-range bladed melee weapon. This form also doubles as
        a long-barrel sniper rifle for long-range shots without giving up the melee
        capabilities of the scythe. The Crescent Rose''s rifle has a massive recoil,
        but instead of compensating for it, Ruby harnesses it to enhance her mobility
        in combat, firing shots to propel herself short distances, simultaneously
        attacking and evading opponents, and using it to launch herself through the
        air. In melee combat, Ruby can fire a shot immediately before a swing, using
        the recoil to increase the force and speed of her attack. She can also embed
        the scythe''s blade into the ground to prevent the weapon''s recoil from throwing
        off her aim with the sniper rifle component, allowing for rapid, accurate
        shots. If needed, the bottom of the shaft can unfold to add more cutting power
        in a close-range fight while also rotating the barrel of the rifle, enabling
        the recoil to rotate Ruby instead of launching her forward, increasing the
        slicing power drastically. **Dust Ammunition: Crescent Rose is able to use
