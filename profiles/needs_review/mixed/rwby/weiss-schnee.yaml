    - field: weaknesses
      value: 'She is usually stubborn and prideful on several occasions. Has not yet
        mastered her summoning. Continual damage to her Aura will cause it to decay
        to the point where she can be left open to more significant damage. Aura''s
        durability is cumulative; it will deplete with each attack she takes and can
        be brought down by characters of similar strength. Semblances drain Aura by
        a small amount and without it they cannot be used until it is recharged. Constant
        exposure to extreme temperature can drain the user''s Aura. | Stronger summons
        such as the Arma Gigas take a few seconds to be fully summoned (Though she
        can summon parts of them instantly). Notable Attacks/Techniques: 6268382-2897562327-60316.gif|Default
        Glyphs Weissglyphsword.gif|Channeling through Myrtenaster C7207a6f61b41abffa444a845507f970eeaaa6e1
        00.gif|Ice Field Cecc35ec0f20564f8cfe34d49f01a086.gif|Ice Augmentation Tumblr
