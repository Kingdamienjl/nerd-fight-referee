  axis: hax
  text: 'Beacon Arc=Superhuman Physical Characteristics, Aura (Able to use her Aura
    for numerous purposes), Forcefield Creation (Aura can be used as a full-body forcefield),
    Statistics Amplification (Can use Aura to enhance her striking power), Enhanced
    Senses (Can use her Aura to sharpen her senses), Regeneration (Low), Extrasensory
    Perception (Her Aura allows her to sense things around her), Acrobatics, Weapon
    Mastery (Expert rapier user, skilled blade-wielder and markswoman), Accelerated
    Development (Training [Physical Statistics and Abilities; Even Huntsmen in Training
    are able to rapidly develop in short periods of time, becoming significantly stronger
    and faster and evolving their abilities through short periods of training]), Forcefield
    Creation, Vector Manipulation, Limited Time Manipulation,Volume 2 Chapter 4 Explosion
    Manipulation,Made her Glyph explode Light Manipulation,Volume 2 Chapter 11 and
    Gravity ManipulationVolume 1 Chapter 8 (Via Semblance), Dust Manipulation (Includes
    IceWhite Trailer, FireVolume 5 Chapter 2, AirVolume 3 Chapter 4, Earth, Electricity,
    and Plant), Stunning, Status Effect Inducement (Can restrain and flash-freeze
    others), Weapon Creation (Can make swords out of ice), Homing Attack, Energy Projection,
    Healing, Summoning, Resistance to Extreme Heat and Cold (Aura protects the user
    from sub-zero temperatures, allowing them to be encased in ice without being cold,
    walk through a blizzard in casual clothingRWBY Volume 6 Episode 5, and traverse
    the kingdom of Atlas, which resides in Remnant''s North Pole,RWBY: World of Remnant,
    Episode 11: Atlas without wearing any protective gear, as well as extreme heat
    up to and including the heat of flames,RWBY Volume 2 Episode 11, being blasted
    with steamRWBY Volume 3 Episode 4 being struck by lightning for an extended period
    of time,RWBY Volume 3 Episode 2RWBY Volume 5 Episode 13RWBY Volume 8 Episode 3
    and being submerged in lava without being burnedRWBY Volume 3 Episode 5) |-|Post
    Beacon Onwards=All previous plus Limited Teleportation (Can teleport her summonsVolume
    5 Chapter 2), Size Manipulation (Able to change the size of her summonsVolume
    5 Chapter 4), and Healing (Can both heal and restore her Aura using various items)'
  source_ids: *id004
  decisive: true
  status: unverified
  policy_flags:
