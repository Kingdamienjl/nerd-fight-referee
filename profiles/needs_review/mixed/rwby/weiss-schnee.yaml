        Manipulation Gravity Glyph.gif|Gravity Field PitifulNeatLabradorretriever-small.gif|Restraint
        Glyphs EarlyUntriedAnophelesmosquito-size restricted.gif|Time Dilation Weisstimedilationglyph.gif|Time
        Dilation 2 Weiss Schnee (RWBY) vs. Lancers.gif|Summoning *Glyphs: Weiss''
        Semblance is Glyphs, which is the hereditary Semblance of the Schnee family.
        Her Glyphs have a variety of effects on objects, monsters, and people, but
        she often uses her Glyphs for propulsion, as they can control motion, with
        the basic Glyph type exerting push forces on other objects and acting as a
        solid surface. **Glyphs+: Thanks to her training under Winter in Atlas, Weiss''
        Semblance evolved further. Alongside her other Glyph abilities, using her
        enhanced Semblance, Weiss can now cause the Dust Glyphs she creates to shatter
        into a flurry of Dust-infused shards that damage those around it. In addition,
        Weiss'' is able to utilize her Dust much more efficiently, with each Glyph
        using half as much Dust as it used to. **Default Glyphs: Weiss'' default Glyph
        allows her to create a seemingly solid force, allowing Weiss to push whatever
        is within their influence. This Glyph usually appears white or pale blue.
