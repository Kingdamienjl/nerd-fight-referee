- id: claim-weaknesses-86cde129
  section: weaknesses
  axis: weakness
  text: 'She is usually stubborn and prideful on several occasions. Has not yet mastered
    her summoning. Continual damage to her Aura will cause it to decay to the point
    where she can be left open to more significant damage. Aura''s durability is cumulative;
    it will deplete with each attack she takes and can be brought down by characters
    of similar strength. Semblances drain Aura by a small amount and without it they
    cannot be used until it is recharged. Constant exposure to extreme temperature
    can drain the user''s Aura. | Stronger summons such as the Arma Gigas take a few
    seconds to be fully summoned (Though she can summon parts of them instantly).
    Notable Attacks/Techniques: 6268382-2897562327-60316.gif|Default Glyphs Weissglyphsword.gif|Channeling
    through Myrtenaster C7207a6f61b41abffa444a845507f970eeaaa6e1 00.gif|Ice Field
    Cecc35ec0f20564f8cfe34d49f01a086.gif|Ice Augmentation Tumblr inline nvd79vYVy21ria1bj
    500.gif|Ice Sword 6286752-9590243645-giphy.gif|Ice Manipulation Gravity Glyph.gif|Gravity
    Field PitifulNeatLabradorretriever-small.gif|Restraint Glyphs EarlyUntriedAnophelesmosquito-size
    restricted.gif|Time Dilation Weisstimedilationglyph.gif|Time Dilation 2 Weiss
    Schnee (RWBY) vs. Lancers.gif|Summoning *Glyphs: Weiss'' Semblance is Glyphs,
    which is the hereditary Semblance of the Schnee family. Her Glyphs have a variety
    of effects on objects, monsters, and people, but she often uses her Glyphs for
    propulsion, as they can control motion, with the basic Glyph type exerting push
    forces on other objects and acting as a solid surface. **Glyphs+: Thanks to her
    training under Winter in Atlas, Weiss'' Semblance evolved further. Alongside her
    other Glyph abilities, using her enhanced Semblance, Weiss can now cause the Dust
    Glyphs she creates to shatter into a flurry of Dust-infused shards that damage
    those around it. In addition, Weiss'' is able to utilize her Dust much more efficiently,
    with each Glyph using half as much Dust as it used to. **Default Glyphs: Weiss''
    default Glyph allows her to create a seemingly solid force, allowing Weiss to
    push whatever is within their influence. This Glyph usually appears white or pale
    blue. Weiss can stand on this Glyph, using it as a platform for various acrobatic
    movements, including breaking a free-fall and quickly reversing her motion by
    kicking off of it mid-air, as well as instantly amplifying the speed of objects
    both through the air and over surfaces. She can also use this Glyph to create
    a barrier. When directly channeled through Myrtenaster, the white setting instead
    creates what can best be described as a ''finishing move'', causing enormous damage
    to foes. When used on the Arma Gigas, it appeared to disintegrate into ice shards
    after being hit with this move. **Dust Glyphs: Using Myrtenaster, Weiss can modify
    her Glyphs to give them added effects. Weiss is also able to confer these enhancements
    upon other people. ***Ice: Weiss can utilize her Glyphs to manipulate what shape
    her ice will take. She can launch towards a foe using a circling motion of Myrtenaster''s
    blade, send out a wave or field of ice from the blade to trap or immobilizing
    a foe, augment projectile attacks so that they explode into ice crystals on impact,
    create large barriers of ice, ice daggers, giant ice swords, and can even use
    her Glyphs to manipulate ice in her surroundings. As of Volume 6, Weiss can use
    ice Glyphs directly on her opponent, using them to freeze their body itself so
    thoroughly that attacking it causes them to physically shatter. **** Pierce: Weiss
    uses a glyph to propel herself forward, freezing the enemy on contact as well
    as any in the immediate area. ***Gravity: A black Glyph with several different
    properties. Gravity Glyphs demonstrate a pulling property, and when used on a
    solid surface it allows Weiss or anyone on it to stick to it and not fall off,
    even if that surface is vertical or even upside-down. When used in mid-air, this
    Glyph can amplify the speed anything sent through it so it moves several times
    faster than its initial velocity. Weiss can also combine this Glyph with her default
    Glyph to create a mid-air platform that she can stand on at any angle, and can
    manipulate to change her trajectory instantly to the point that so much as touching
    the glyph with her finger will propel her in the opposite direction. Gravity Glyphs
    can also be used offensively to create a low or anti-gravity field to make enemies
    float in midair and allows Weiss to throw them around while they are in said field,
    as well as create Glyphs in front of her to repel opponents and underneath the
    opponent to launch them into the air. Weiss can also augment her physical attacks
    with this Glyph, allowing her to deal increased damage with her slashes, as well
    as trap enemies inside of a Glyph to restrain them. ***Hard Light: When combined
    with her Glyphs, Weiss can create numerous light blue glyphs that fire energy
    projectiles that curve through the air and strike her opponent as well as create
    restraints to'
