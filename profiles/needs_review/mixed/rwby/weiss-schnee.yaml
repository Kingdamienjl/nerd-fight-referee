  intelligence:
    text: Gifted (Considered to be the smartest member of Team RWBY, as the heiress
      of the Schnee Dust Company, Weiss was raised from youth to strive to be the
      best in all she did. As such, she took her time at Beacon more seriously than
      her teammates, taking notes even when the topic is not related to the knowledge
      she seeks. When in combat, Weiss remains calm and tactical, fighting with precision
      and coordination. As a testament to her skills, Weiss was listed as the top
      ranking of the sparring class during the events of the Vytal Festival. Weiss
      can move quickly and is creative on the battlefield, particularly with Ice Dust,
      although she is proficient in several different elements. She can use them both
      on their own and incorporate them into her Glyphs and can rapidly switch between
      several different elements in rapid succession without faltering. Weiss also
      mastered summoning in a relatively short time despite being completely unable
      to do so and believing she was incapable of doing so prior)
