        In addition, Weiss'' is able to utilize her Dust much more efficiently, with
        each Glyph using half as much Dust as it used to ** Default Glyphs: Weiss''
        default Glyph allows her to create a seemingly solid force, allowing Weiss
        to push whatever is within their influence. This Glyph usually appears white
        or pale blue. Weiss can stand on this Glyph, using it as a platform for various
        acrobatic movements, including breaking a free-fall and quickly reversing
        her motion by kicking off of it mid-air, as well as instantly amplifying the
        speed of objects both through the air and over surfaces. She can also use
        this Glyph to create a barrier. When directly channeled through Myrtenaster,
        the white setting instead creates what can best be described as a ''finishing
        move'', causing enormous damage to foes. When used on the Arma Gigas, it appeared
        to disintegrate into ice shards after being hit with this move. ** Dust Glyphs:
        Using Myrtenaster, Weiss can modify her Glyphs to give them added effects.
        Weiss is also able to confer these enhancements upon other people. *** Ice:
        Weiss can utilize her Glyphs to manipulate what shape her ice will take. She
        can launch towards a foe using a circling motion of Myrtenaster''s blade,
        send out a wave or field of ice from the blade to trap or immobilizing a foe,
        augment projectile attacks so that they explode into ice crystals on impact,
        create large barriers of ice, ice daggers, giant ice swords, and can even
        use her Glyphs to manipulate ice in her surroundings. As of Volume 6, Weiss
        can use ice Glyphs directly on her opponent, using them to freeze their body
        itself so thoroughly that attacking it causes them to physically shatter.
        **** Pierce: Weiss uses a glyph to propel herself forward, freezing the enemy
        on contact as well as any in the immediate area. *** Gravity: A black Glyph
        with several different properties. Gravity Glyphs demonstrate a pulling property,
        and when used on a solid surface it allows Weiss or anyone on it to stick
        to it and not fall off, even if that surface is vertical or even upside-down.
        When used in mid-air, this Glyph can amplify the speed anything sent through
        it so it moves several times faster than its initial velocity. Weiss can also
        combine this Glyph with her default Glyph to create a mid-air platform that
        she can stand on at any angle, and can manipulate to change her trajectory
        instantly to the point that so much as touching the glyph with her finger
        will propel her in the opposite direction. Gravity Glyphs can also be used
        offensively to create a low or anti-gravity field to make enemies float in
        midair and allows Weiss to throw them around while they are in said field,
        as well as create Glyphs in front of her to repel opponents and underneath
        the opponent to launch them into the air. Weiss can also augment her physical
        attacks with this Glyph, allowing her to deal increased damage with her slashes,
        as well as trap enemies inside of a Glyph to restrain them. *** Hard Light:
        When combined with her Glyphs, Weiss can create numerous light blue glyphs
        that fire energy projectiles that curve through the air and strike her opponent
        as well as create restraints to suspend her foe in midair. *** Time Dilation:
        Weiss can utilize her Glyphs in conjunction with Lightning Dust to create
        a time dilation field, which speeds up the user''s actions. ** Summoning Glyphs:
        A Glyph unique to the Schnee family, Weiss can summon avatars of the foes
        that she has defeated in combat and bring them to fight for their side. She
        has shown to be proficient enough to be able to summon creatures such as a
        Boarbatusk and the Arma Gigas. She can also cause her summons to teleport
        and use her glyphs as surfaces to jump off, as demonstrated in "Dread in the
        Air". She is capable of manipulating the size of her summons, as seen in "Unforeseen
        Complications".'
