        her teammates, taking notes even when the topic is not related to the knowledge
        she seeks. When in combat, Weiss remains calm and tactical, fighting with
        precision and coordination. As a testament to her skills, Weiss was listed
        as the top ranking of the sparring class during the events of the Vytal Festival.
        Weiss can move quickly and is creative on the battlefield, particularly with
        Ice Dust, although she is proficient in several different elements. She can
        use them both on their own and incorporate them into her Glyphs and can rapidly
        switch between several different elements in rapid succession without faltering.
