    around her), Accelerated Development (Training [Physical Statistics and Abilities;
    Even Huntsmen in Training are able to rapidly develop in short periods of time,
    becoming significantly stronger and faster and evolving their abilities through
    short periods of training]), Vehicular Mastery (Can pilot airships), Awakened
    Power (The intense anger she felt at the abuse from her step-family caused her
    Semblance to unlock), Heat Manipulation and Explosion Manipulation (Via Semblance),
    Magma Manipulation, Danmaku, and Weapon Creation (Via controlling and deploying
    Dust), Power Absorption (Can absorb a Maiden''s power using the Beetle, though
    only after breaking their Aura shield), Resistance to Extreme Heat and Cold (Aura
    protects the user from sub-zero temperatures, allowing them to be encased in ice
    without being cold, walk through a blizzard in casual clothing,RWBY Volume 6 Episode
