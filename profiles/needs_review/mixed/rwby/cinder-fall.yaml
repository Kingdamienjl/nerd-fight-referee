    her striking power), Enhanced Senses (Can use her Aura to sharpen her senses),
    Regeneration (Low), Extrasensory Perception (Her Aura allows her to sense things
    around her), Accelerated Development (Training [Physical Statistics and Abilities;
    Even Huntsmen in Training are able to rapidly develop in short periods of time,
    becoming significantly stronger and faster and evolving their abilities through
    short periods of training]), Vehicular Mastery (Can pilot airships), Awakened
    Power (The intense anger she felt at the abuse from her step-family caused her
    Semblance to unlock), Heat Manipulation and Explosion Manipulation (Via Semblance),
    Magma Manipulation, Danmaku, and Weapon Creation (Via controlling and deploying
    Dust), Power Absorption (Can absorb a Maiden''s power using the Beetle, though
    only after breaking their Aura shield), Resistance to Extreme Heat and Cold (Aura
    protects the user from sub-zero temperatures, allowing them to be encased in ice
    without being cold, walk through a blizzard in casual clothing,RWBY Volume 6 Episode
    5 and traverse the kingdom of Atlas, which resides in Remnant''s North Pole,RWBY:
    World of Remnant, Episode 11: Atlas without wearing any protective gear, as well
    as extreme heat up to and including the heat of flames,RWBY Volume 2 Episode 11
    being blasted with steam,RWBY Volume 3 Episode 4 being struck by lighting for
    an extended period of time,RWBY Volume 3 Episode 2RWBY Volume 5 Episode 13RWBY
    Volume 8 Episode 3 and being submerged in lava without being burnedRWBY Volume
    3 Episode 5) {{!}}-{{!}} Post Beacon Onwards=All previous plus Enhanced Power
    Absorption (After receiving a Shadow Hand to replace her lost arm, Cinder can
    now siphon Maiden powers directly, bypassing Aura shields entirely), Elasticity
    (Can stretch her Shadow Hand long distances), and Regeneration (Low-Mid; If cut
    off, her Shadow Hand can grow back, though this causes immense pain)}} |-|Maiden'
