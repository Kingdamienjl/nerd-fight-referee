- id: claim-weaknesses-ffe53c5a
  section: weaknesses
  axis: weakness
  text: 'Continual use of her Aura will cause it to decay to the point where she can
    be left open to more significant damage. Aura''s durability is cumulative; it
    will deplete with each attack she takes and can be brought down by characters
    of similar strength. Semblances drain Aura by a small amount and without it they
    cannot be used until it is recharged. Constant exposure to extreme temperature
    can drain the user''s Aura. | Due to the nature of her Shadow Hand, she cannot
    protect it with Aura. She is also weak to Silver Eyes. Notable Attacks/Techniques:
    *Scorching Caress: Cinder''s Semblance allows her to super heat objects and alter
    their shape. She primarily uses this to super heat powders such as sand and dust
    into glass and hurl them at enemies, as well as alter her clothes, seen in Volume
    2. She can also use it to heat and reform broken objects such as her glass weapons
    and arrows. Cinder is first seen using her Semblance in Volume 1 when she causes
    the ground underneath Ruby Rose and Glynda Goodwitch to explode. **Midnight: Cinder''s
    Weapon is a Dust-created, glass-based weapon with multiple forms. The weapon consists
    of a pair of blades which combine to form a bow. In Sword mode, the weapon is
    a single-handed weapon similar to a European seax or a Moorish scimitar. The blade
    is broad and has multiple cutting edges, although the blades must be relatively
    light to enable the user to keep them balanced when using them in their designed
    dual-wielding form. In Bow mode, the weapon uses a straight bow design with a
    handgrip built into the frame and is capable of producing multiple broadhead-tipped
    arrows that detonate on impact. The arrows are able to reform themselves if something
    should shatter them before they hit their target. *Magic: After stealing the powers
    from Amber, Cinder became the new Fall Maiden, allowing her to perform various
    supernatural feats without the use of Dust. These include changing the weather,
    controlling the elements, flying, creating forcefields, and drastically increasing
    her strength and durability. **Conjured'
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-8a2385ba
  section: abilities
  axis: hax
  text: 'Base={{#tag:tabber|Beacon Arc=Superhuman Physical Characteristics, Weapon
    Mastery (Skilled swordswoman and archer), Skilled Hand-to-Hand Combatant, Aura
