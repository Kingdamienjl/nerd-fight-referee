- id: claim-weaknesses-b484f619
  section: weaknesses
  axis: weakness
  text: "She is na\xEFve, she hiccups when she's lying, and is vulnerable to magnetism\
    \ due to her physiology. Continual use of her Aura will cause it to decay to the\
    \ point where she can be left open to more significant damage. Aura's durability\
    \ is cumulative; it will deplete with each attack she takes and can be brought\
    \ down by characters of similar strength. Constant exposure to extreme temperature\
    \ can drain the user's Aura. Notable Attacks/Techniques: * Floating Array: An\
    \ array of weapons that Penny wields that consist of a gun-blade-looking weapon\
    \ that can split itself into numerous thin, floating blades that are apparently\
    \ controlled by wire cables and are stored in a small backpack. The blades can\
    \ be deployed as a single blade from the back and can further separate. Penny\
    \ is shown to be able to manipulate the blades through thin, string-like cables\
    \ attached to the blades. Penny can also relocate rapidly using these cables,\
    \ by embedding the blade(s) into an immovable object and then reeling the connecting\
    \ cables in to pull herself towards them. The cables are also shown to be extremely\
    \ strong, as seen when Penny embeds the blades into a Bullhead's body and pulls\
    \ the craft down. The blades can be brought together to form a circular ring that\
    \ is spun to fire a powerful green laser that is capable of splitting into many\
    \ smaller beams. This attack is powerful enough to slice through metal with ease\
    \ and take down two attacking aircraft by cutting them apart. The blades can also\
    \ form several smaller rings that can also shoot several smaller laser beams.\
    \ Penny can also use these smaller ring configurations as thrusters to maneuver\
    \ herself around the battlefield. She can also make all of them mini-rifles and\
    \ shoot individual beams. CwPBpc0.png|Floating Array Ezgif-7-3e23c898d7.gif|Sword\
    \ Control Ezgif-7-9d59dd014f.gif|Shield and Grapple Cables Ezgif-7-1cb2c8662a.gif|Lasers\
    \ Ezgif-3-b12c73c4b3.gif|Combined Laser Ezgif-7-41cf26aad8.gif|Laser Thrusters\
    \ * Magic: As the Winter Maiden, Penny is the bearer of a magical power that has\
    \ existed in Remnant for millennia. With it, she has the ability to control the\
    \ elements. Her preferred one is wind, which she favors in combat. However, she\
    \ has also used ice as well as fire. Due to being an android, Penny learned how\
    \ to use her powers more quickly than other Maidens and easily copied attacks\
    \ she had seen from them.RWBY Volume 8 Directors' and Writers' Commentary Chapter\
    \ 3 At the end of Volume 8, she passed on her powers to Winter Schnee. Ezgif-7-dbc5dd899b.gif|Wind\
    \ Manipulation Ezgif-7-a17d3bac7f.gif|Weather Manipulation/Ice Manipulation Ezgif-7-99c6b17d30.gif|Weather\
    \ Manipulation/Lightning Manipulation Ezgif-7-9a83b1f3f1.gif|Ice Manipulation\
    \ Ezgif-7-21b3b34498.gif|Ice Swords Ezgif-7-2f67db9da9.gif|Stone Swords ==Notable\
    \ Matchups== Victories: Ruby Rose (RWBY) Ruby's Profile (Atlas versions were both\
    \ used. Penny can't use her maiden powers, fight takes place in Amity Colosseum\
    \ and both were 50 meters apart) Aerisi Kalinoth (Dungeons and Dragons) Aerisi\
    \ Kalinoth's Profile (Atlas Penny used, speed was equalized, Penny had prior knowledge,\
    \ and starting distance was 30 meters) Snow Godzilla (Shinkalion) Snow Godzilla's\
    \ Profile (Atlas Penny used and speed was equalized) Losses: Ralts (Pok\xE9mon)\
    \ Ralts' Profile (Starting distance was 30 meters, speed was equalized, Ralts'\
    \ ability was Trace, Atlas Penny and Ralts were used) Inconclusive: ==References==\
