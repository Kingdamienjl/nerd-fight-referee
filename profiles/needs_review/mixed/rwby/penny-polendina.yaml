    - field: intelligence
      value: Genius As an android created by the Atlas Military, Penny is an overwhelmingly
        skilled fighter. During the Vytal Festival she effectively made it to the
        semifinals on her own despite the competitors being some of the most skilled
        fighters that the four Huntsmen Academies had to offer, with her other teammates
        only being there as stand-ins so she would have a team by the rules of the
        tournament.RWBY Volume 3 Episode 5 She is skilled enough to match Pyrrha Nikos
        in combat and even put her on the defensive and disarm her, with Penny only
        definitively losing the fight due to Emerald Sustrai using her Semblance to
        manipulate Pyrrha's already poor mental state into accidentally using her
        Semblance to dismember her.RWBY Volume 3 Episode 9 After being reconstructed
        and upgraded in Atlas, Penny's skill capacity was further increased to the
        point that she could match Cinder Fall in combat alongside Winter Schnee,
        only being outmatched when Cinder utilized her Maiden powers,RWBY Volume 7
        Episode 13 later beating Cinder in a one-on-one fight when both had their
        respective Maiden powers.RWBY Volume 8 Episode 5 Penny also fought and outmatched
        four of the five Ace-Ops simultaneously, with them being forced to fall back
        at the end of their fight.RWBY Volume 8 Episode 3 In addition, despite having
        the Maiden powers for the shortest time out of any character, Penny had a
        near instant proficiency with them due to being an android, allowing her to
        learn how to use her powers more quickly than other Maidens and easily copying
        attacks she had seen from other Maidens like Cinder and Fria.RWBY Volume 8
        Directors' and Writers' Commentary Chapter 3 She also possesses an internal
        knowledge bank, as well as access to networked ones. Penny possesses a masterful
        level of skill in wielding her weapon of choice, Floating Array, a highly
        complex series of remotely controlled swords directed by communicating with
        each blade in order to manipulate them.RWBY Volume 8 Episode 5 She can manipulate
        each individual blade with just a thought or a wave of her hand, altering
        the configurations and formations of the blades at will to counteract incoming
        threats, easily utilizing it as a close, mid, and long range melee weapon
        and a directed energy weapon for overwhelming offensive purposes, as well
        as a shield and grappling cables to enhance her defense and mobility and thrusters
        to enhance her mobility and physical capabilities simultaneously.RWBY Volume
        1 Episode 16 She can utilize multiple forms of Floating Array simultaneously,
        attacking with a mix of swords and lasers from multiple angles as a means
        of keeping an opponent constantly off balance, and can attack with enough
        precision as to cut a Bullhead in half with her lasers without harming any
        of the passengers.
