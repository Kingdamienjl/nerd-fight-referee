    - field: weaknesses
      value: 'Naive and socially inept, hiccups when she''s lying, and is vulnerable
        to magnetism due to her physiology. Continual damage to her Aura will cause
        it to deplete to the point where she can be left open to more significant
        damage. Notable Attacks/Techniques: * Floating Array: An array of weapons
        that Penny wields that consist of a gun-blade-looking weapon that can split
        itself into numerous thin, floating blades that are apparently controlled
        by wire cables and are stored in a small backpack. The blades can be deployed
        as a single blade from the back, and can further separate. Penny is shown
        to be able to manipulate the blades through thin, string-like cables attached
        to the blades. Penny can also relocate rapidly using these cables, by embedding
        the blade(s) into an immovable object and then reeling the connecting cables
        in to pull herself towards them. The cables are also shown to be extremely
        strong, as seen when Penny embeds the blades into a Bullhead''s body and pulls
        the craft down. The blades can be brought together to form a circular ring
        that is spun to fire a powerful green laser that is capable of splitting into
        many smaller beams. This attack is powerful enough to slice through metal
        with ease, and are seen to take down two attacking aircraft by cutting them
        apart. The blades can also form several smaller rings that can also shoot
        several smaller laser beams. Penny can also use these smaller ring configurations
        as thrusters to maneuver herself around the battlefield. She can also make
        all of them mini-rifles and shoot individual beams.'
      source_id: character-stats-profiles-penny-polendina-rwby
      provider_id: character_stats_profiles
      authority: high
