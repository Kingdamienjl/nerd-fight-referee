- id: claim-powers-and-abilities-bfcd8578
  section: abilities
  axis: hax
  text: 'Beacon Arc= Superhuman Physical Characteristics, Aura (Able to use her Aura
    for numerous purposes), Forcefield Creation (Aura can be used as a full-body forcefield),
    Statistics Amplification (Can use Aura to enhance her striking power), Enhanced
    Senses (Can use her Aura to sharpen her senses), Regeneration (Low), Extrasensory
    Perception (Her Aura allows her to sense things around her), Martial Arts (Skilled
    Hand-to-Hand Combatant), Accelerated Development (Training [Physical Statistics
    and Abilities; Even Huntsmen in Training are able to rapidly develop in short
    periods of time, becoming significantly stronger and faster and evolving their
    abilities through short periods of training]), Analytical Prediction (Capable
    of reading her opponents movements in battle, even knowing what moves they''d
    use next), Vehicular Mastery (Owns Bumblebee a sports motorcycle, and can operate
    a hover transport), Absorption (Via Semblance), Energy Projection, Limited Fire
    Manipulation, Pseudo-Flight (Can propel herself using Ember Celica), Shockwave
    Generation, Resistance to Extreme Heat and Cold (Aura protects the user from sub-zero
    temperatures, allowing them to be encased in ice without being cold, walk through
    a blizzard in casual clothingRWBY Volume 6 Episode 5, and traverse the kingdom
    of Atlas, which resides in Remnant''s North Pole,RWBY: World of Remnant, Episode
    11: Atlas without wearing any protective gear, as well as extreme heat up to and
    including the heat of flames,RWBY Volume 2 Episode 11, being blasted with steamRWBY
    Volume 3 Episode 4 being struck by lightning for an extended period of time,RWBY
    Volume 3 Episode 2RWBY Volume 5 Episode 13RWBY Volume 8 Episode 3 and being submerged
    in lava without being burnedRWBY Volume 3 Episode 5) |-|Post Beacon Onwards= All
    previous abilities, Explosion Manipulation (The upgrades to Ember Celica allow
    for the use of sticky grenades, which she can detonate after being released),
    Heat Manipulation (When combined with Combustion Dust, her Semblance produces
    extreme heat, which is powerful enough to melt any metal), and Healing (Can both
