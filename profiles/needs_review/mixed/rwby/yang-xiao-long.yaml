  intelligence:
    text: Above Average generally, Gifted in combat (Though often seen as hot-headed
      and easy to anger, Yang is a highly skilled fighter, being able to outmatch
      groups of enemies and Grimm much larger than herself in hand-to-hand combat.
      Her fighting style is much more aggressive than that of her teammates, bearing
      resemblance to a combination of boxing and kickboxing. However, her style is
      representative of her personality, as her anger, one of her main assets in a
      battle, can sometimes lead her to act predictably. After losing her arm in an
      encounter with Adam Taurus and gaining a mechanical replacement, she spent several
      months receiving one on one combat training from her father, a professional
      Huntsman, as well as learning how to balance her driven and positive nature
      without overconfidence or agitation. Eventually, she learned to not overly rely
      on her Semblance, instead only activating it as a last resort. When fighting
      the Ace-Ops, she coordinated her attacks with Blake Belladonna and refrained
      from using it until the end to destroy the ground Elm Ederne had anchored herself
      to and deliver the finishing blow. Even when she does use it, rather than absorbing
      blows to her body as she once did, she now instead deflects or absorb blows
      with her forearms, as she did in her fight against Adam. This allows her to
      use her Semblance more effectively and puts less risk in her Aura breaking)
    source_ids:
    - vsbattles-yang-xiao-long-rwby
