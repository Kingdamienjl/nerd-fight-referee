- id: claim-weaknesses-871b8fc3
  section: weaknesses
  axis: weakness
  text: 'Hot-headed. According to the writers Yang has slight difficulty against those
    who kick more often than not [However, this is only a minor inconvenience that
    hasn''t resulted in any significant issues in combat]. Continual damage to her
    Aura will cause it to decay to the point where she can be left open to more significant
    damage. Aura''s durability is cumulative; it will deplete with each attack she
    takes and can be brought down by characters of similar strength. Semblances drain
    Aura by a small amount and without it they cannot be used until it is recharged.
    | Same weaknesses related to her Aura. Suffers from PTSD from losing her arm [Which
    manifests as her left arm shaking]. Constant exposure to extreme temperature can
    drain the user''s Aura. Notable Attacks/Techniques: 300px|right * Burn: Yang has
    the ability to absorb energy from the damage she has taken, and redirect it twice
    as hard at her opponent, effectively making her stronger with each hit she takes.
    She can save up the energy to use later for an even more devastating attack. Her
    ability also causes her eyes to change color from lilac to red, which is a "side-effect"
    of her Semblance, though it does occasionally happen outside of combat. When using
    her Semblance, she draws power from her hair. However, Yang''s Semblance does
    not grant her invincibility and she does take damage from her opponents, as shown
    when Adam Taurus cuts her right arm off with Wilt and Blush. Although a powerful
    Semblance, Yang is unable to power it up without taking damage first, and fighters
    well-versed in dodging attacks can potentially bypass it entirely, rendering the
    added power useless. In early volumes her anger also caused her to unintentionally
    activate her Semblance, even if she is not in battle, though after the Fall of
    Beacon this is no longer an issue. **Flaming Halo: Thanks to the aid of Cye Ayu
    in Atlas, Yang gained the ability to enhance her Semblance with Combustion Dust,
    further increasing its power even when used in small bursts, and generating a
    blast of atomic heat capable of melting through any metal. *Quake: Yang strikes
    the ground, creating a shockwave that knocks enemies back and shatters the ground
    beneath her. *Sunbreaker: Yang unleashes a devastating uppercut, launching herself
    off the ground and knocking anyone hit into the air. ==Gallery== YangBlaz.png|Yang
    Xiao Long in Blazblue: Cross Tag Battle 0fb2668ff05b4686a00e58c63b758d4c-removebg.png|Yang
    in the manga Dcl4o1q-fac53390-5167-4320-a7aa-9d4ccbe098e0.png|Yang Xiao Long in
    RWBY: Amity Arena Rwby bilibili yang xiao long.png|Yang in the Bilibili Mobile
    Game Yang Combat Ready Cards 06.jpg|Yang in RWBY: Combat Ready ==Notable Matchups==
    Victories: Losses: *Adam Taurus (RWBY) Adam''s Profile (Volume 6 Yang, battle
    took place at the Amity Colosseum and both had prior knowledge) *Reze (Chainsaw
