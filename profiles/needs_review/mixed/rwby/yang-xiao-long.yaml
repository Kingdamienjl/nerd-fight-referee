    - field: intelligence
      value: Above Average generally, Gifted in combat (Though often seen as hot-headed
        and easy to anger, Yang is a highly skilled fighter, being able to outmatch
        groups of enemies and Grimm much larger than herself in hand-to-hand combat.
        Her fighting style is much more aggressive than that of her teammates, bearing
        resemblance to a combination of boxing and kickboxing. However, her style
        is representative of her personality, as her anger, one of her main assets
        in a battle, can sometimes lead her to act predictably. After losing her arm
        in an encounter with Adam Taurus and gaining a mechanical replacement, she
        spent several months receiving one on one combat training from her father,
        a professional Huntsman, as well as learning how to balance her driven and
        positive nature without overconfidence or agitation. Eventually, she learned
        to not overly rely on her Semblance, instead only activating it as a last
        resort. When fighting the Ace-Ops, she coordinated her attacks with Blake
        Belladonna and refrained from using it until the end to destroy the ground
        Elm Ederne had anchored herself to and deliver the finishing blow. Even when
        she does use it, rather than absorbing blows to her body as she once did,
        she now instead deflects or absorb blows with her forearms, as she did in
        her fight against Adam. This allows her to use her Semblance more effectively
        and puts less risk in her Aura breaking)
      source_id: vsbattles-yang-xiao-long-rwby
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Hot-headed. According to the writers Yang has slight difficulty against
        those who kick more often than not [However, this is only a minor inconvenience
        that hasn''t resulted in any significant issues in combat]. Continual damage
        to her Aura will cause it to decay to the point where she can be left open
        to more significant damage. Aura''s durability is cumulative; it will deplete
        with each attack she takes and can be brought down by characters of similar
        strength. Semblances drain Aura by a small amount and without it they cannot
        be used until it is recharged. | Same weaknesses related to her Aura. Suffers
        from PTSD from losing her arm [Which manifests as her left arm shaking]. Constant
        exposure to extreme temperature can drain the user''s Aura. Notable Attacks/Techniques:
        300px|right * Burn: Yang has the ability to absorb energy from the damage
        she has taken, and redirect it twice as hard at her opponent, effectively
        making her stronger with each hit she takes. She can save up the energy to
        use later for an even more devastating attack. Her ability also causes her
        eyes to change color from lilac to red, which is a "side-effect" of her Semblance,
        though it does occasionally happen outside of combat. When using her Semblance,
        she draws power from her hair. However, Yang''s Semblance does not grant her
        invincibility and she does take damage from her opponents, as shown when Adam
        Taurus cuts her right arm off with Wilt and Blush. Although a powerful Semblance,
        Yang is unable to power it up without taking damage first, and fighters well-versed
        in dodging attacks can potentially bypass it entirely, rendering the added
        power useless. In early volumes her anger also caused her to unintentionally
        activate her Semblance, even if she is not in battle, though after the Fall
        of Beacon this is no longer an issue. **Flaming Halo: Thanks to the aid of
        Cye Ayu in Atlas, Yang gained the ability to enhance her Semblance with Combustion
        Dust, further increasing its power even when used in small bursts, and generating
        a blast of atomic heat capable of melting through any metal. *Quake: Yang
        strikes the ground, creating a shockwave that knocks enemies back and shatters
        the ground beneath her. *Sunbreaker: Yang unleashes a devastating uppercut,
        launching herself off the ground and knocking anyone hit into the air. ==Gallery==
