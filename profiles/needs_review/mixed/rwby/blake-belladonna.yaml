    - field: intelligence
      value: 'Gifted (Having been a member of the White Fang at a young age, Blake
        is very skilled in multiple forms of combat, mostly using Gambol Shroud in
        slashing through hordes of enemies with startling speed and deflecting incoming
        gunfire with the sword and sheathe alone. She is also well adept in using
        her weapon as a conduit for her Aura: generating shockwaves with her swings
        to augment her blows. She can use her weapon in gun and sickle mode to their
        fullest effect in tandem with her combat skills against multiple Grimm and
        enemies, as well as her Semblance to trick her opponents, like she did against
        Roman Torchwick by combining her Semblance with multiple Dust ammunition and
        pinned him down. She is the stealthiest of team RWBY as she is skilled in
        espionage and trickery, which she has used on various missions. She also has
        extensive book knowledge from her reading and studying. After the Fall of
        Beacon, Blake has developed leadership skills, inspiring the Faunus in Menagerie
        to stand against Adam Taurus)'
      source_id: mediawiki-9467
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Continual use of her Aura will cause it to decay to the point where
        she can be left open to more significant damage. Aura''s durability is cumulative;
        it will deplete with each attack she takes and can be brought down by characters
        of similar strength. Semblances drain Aura by a small amount and without them
        they cannot be used until it is recharged. Constant exposure to extreme temperature
        can drain the user''s Aura. Afraid of dogs. Notable Attacks/Techniques: Tumblr
        inline okipomgHK11tbmjie 500.gif|Blake''s Semblance Ice Dust.gif|Ice Dust
        Blake Combat Ready Cards 05.jpg|Fire Dust Balkebhorizontalblade.gif|Blade
        Beam *Shadow: Blake''s Semblance allows her to create Shadow-clones. These
        clones can be used by Blake to either distract, shield, or hide herself from
        the enemy for a brief amount of time. These copies are not just illusions
        and have some substance to them, as Blake has demonstrated the ability to
        jump off of them and use them to exert force on herself as a means of reaching
        greater heights. It is unknown exactly how long a shadow copy can appear for
        or how far away from Blake they can exist. So far, they have only appeared
        in Blake''s immediate area, normally right next to her. **Shadow+: Thanks
        to the probability-manipulating Semblance of Mikado Lem, Blake''s Semblance
        evolved further, allowing her to create up to two full, solid, physical copies
        of herself capable of fighting alongside her. Creating two clones at once
        does not expend any more Aura than a normal clone previously required. ==Gallery==
