- id: claim-powers-and-abilities-fddd1a1d
  section: abilities
  axis: hax
  text: 'Beacon Arc= Superhuman Physical Characteristics, Aura (Able to use her Aura
    for numerous purposes), Forcefield Creation (Aura can be used as a full-body forcefield),
    Statistics Amplification (Can use Aura to enhance her striking power), Enhanced
    Senses (Can use her Aura to sharpen her senses. Being a Faunus gives her enhanced
    hearing and grants her night vision), Regeneration (Low), Extrasensory Perception
    (Her Aura allows her to sense things around her), Acrobatics, Weapon Mastery (Expert
    blade-wielder and markswoman), Accelerated Development (Training [Physical Statistics
    and Abilities; Even Huntsmen in Training are able to rapidly develop in short
    periods of time, becoming significantly stronger and faster and evolving their
    abilities through short periods of training]), Stunning, Darkness Manipulation,
    Duplication (Via Semblance), Energy Projection, Dust Manipulation (Can enhance
    both her attacks and Semblance with Dust, which include Fire, Ice, Gravity, and
    Earth Manipulation), Flash-Freezing (Via Ice Dust), Resistance to Extreme Heat
    and Cold (Aura protects the user from sub-zero temperatures, allowing them to
    be encased in ice without being cold, walk through a blizzard in casual clothingRWBY
    Volume 6 Episode 5, and traverse the kingdom of Atlas, which resides in Remnant''s
    North Pole,RWBY: World of Remnant, Episode 11: Atlas without wearing any protective
    gear, as well as extreme heat up to and including the heat of flames,RWBY Volume
    2 Episode 11, being blasted with steamRWBY Volume 3 Episode 4 being struck by
    lighting for an extended period of time,RWBY Volume 3 Episode 2RWBY Volume 5 Episode
    13RWBY Volume 8 Episode 3 and being submerged in lava without being burnedRWBY
    Volume 3 Episode 5) |-|Post Beacon Onwards= All previous plus Enhanced Duplication
    (Her Semblance now produces solid copies, allowing her to either use them as decoys
    or fight together), and Healing (Can both heal and restore her Aura using various
    items)'
