- id: claim-weaknesses-3bb8c17b
  section: weaknesses
  axis: weakness
  text: 'Continual use of her Aura will cause it to decay to the point where she can
    be left open to more significant damage. Aura''s durability is cumulative; it
    will deplete with each attack she takes and can be brought down by characters
    of similar strength. Semblances drain Aura by a small amount and without them
    they cannot be used until it is recharged. Constant exposure to extreme temperature
    can drain the user''s Aura. Afraid of dogs. Notable Attacks/Techniques: Tumblr
    inline okipomgHK11tbmjie 500.gif|Blake''s Semblance Ice Dust.gif|Ice Dust Blake
    Combat Ready Cards 05.jpg|Fire Dust Balkebhorizontalblade.gif|Blade Beam *Shadow:
    Blake''s Semblance allows her to create Shadow-clones. These clones can be used
    by Blake to either distract, shield, or hide herself from the enemy for a brief
    amount of time. These copies are not just illusions and have some substance to
    them, as Blake has demonstrated the ability to jump off of them and use them to
    exert force on herself as a means of reaching greater heights. It is unknown exactly
    how long a shadow copy can appear for or how far away from Blake they can exist.
    So far, they have only appeared in Blake''s immediate area, normally right next
    to her. **Shadow+: Thanks to the probability-manipulating Semblance of Mikado
    Lem, Blake''s Semblance evolved further, allowing her to create up to two full,
    solid, physical copies of herself capable of fighting alongside her. Creating
    two clones at once does not expend any more Aura than a normal clone previously
    required. ==Gallery== Blake Belladonna (BlazBlue Cross Tag Battle, Character Select
    Artwork).png|Blake Belladonna in BlazBlue: Cross Tag Battle Manga Blake.png|Blake
    in the Manga Amity arena website blake belladonna.png|Blake Belladonna in RWBY:
    Amity Arena Rwby bilibili blake belladonna.png|Blake in the Bilibili Mobile Game
    Blake Combat Ready Cards 02.jpg|Blake in RWBY: Combat Ready ==Notable Matchups==
    Victories: *Suzaku Kururugi (Code Geass) Suzaku''s Profile (Starting distance
    was 10 meters, speed was equalized, both characters have prior knowledge, Lancelot
