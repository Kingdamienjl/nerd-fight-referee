  intelligence:
    text: 'Gifted (Having been a member of the White Fang at a young age, Blake is
      very skilled in multiple forms of combat, mostly using Gambol Shroud in slashing
      through hordes of enemies with startling speed and deflecting incoming gunfire
      with the sword and sheathe alone. She is also well adept in using her weapon
      as a conduit for her Aura: generating shockwaves with her swings to augment
      her blows. She can use her weapon in gun and sickle mode to their fullest effect
      in tandem with her combat skills against multiple Grimm and enemies, as well
      as her Semblance to trick her opponents, like she did against Roman Torchwick
      by combining her Semblance with multiple Dust ammunition and pinned him down.
      She is the stealthiest of team RWBY as she is skilled in espionage and trickery,
      which she has used on various missions. She also has extensive book knowledge
      from her reading and studying. After the Fall of Beacon, Blake has developed
      leadership skills, inspiring the Faunus in Menagerie to stand against Adam Taurus)'
    source_ids:
    - vsbattles-blake-belladonna-rwby
    confidence: 0.6
    notes: auto_repair source extraction
