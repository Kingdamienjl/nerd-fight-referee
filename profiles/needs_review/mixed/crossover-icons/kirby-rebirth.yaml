        when he planned to use the Omnitrix with his Bioid army to conquer the earth.
        Gave Kevin 11 the idea to combine his abilities to make up for them not being
        at full power. Evaded both Vilgax and Kevin 11 for a long period of time in
        the Null Void after having access to the Omnitrix's Master Control for only
