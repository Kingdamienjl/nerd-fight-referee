        \ not holding back), likely Universe level (After Magolor's defeat, the universe\
        \ itself began crumbling. Is also able to push back a wave that could destroy\
        \ the universe. Defeated Dark Tarzana, who was massively superior to Parallel\
        \ Landia, almost the final boss, who in turn, was also massively superior\
        \ to Landia EX. Kirby himself has also been stated on three different occasions\
        \ to have infinite power. However, the third statement is sketchy\u2014you\
        \ can't be near infinite. You're either infinite or you're not\u2014this is\
        \ why these statements are taken as 3-A feats rather than High 3-A ones. The\
        \ closest thing from tier 3 to infinite is 3-A) to Universe level+ (Battled\
        \ and defeated Master Hand and Crazy Hand. The former created the Smash Bros.\
        \ universe. And when either one is defeated, the universe ceases to exist.\
        \ Dark Mind is possibly superior to both of the Hands, due to upping their\
        \ position as well as difficulty. Defeated Marx Soul, who created a universe\
        \ with countless stars. Said universe ceases to exist after his defeat. After\
        \ Magolor's defeat, it seems as though the universe's fabric is tearing. Defeated\
        \ Dark Mind, who is not only superior to Master Hand and Crazy Hand, but nearly\
        \ conquered both the Mirror Dimension and Dream Land. The Mirror Dimension\
        \ is a universe with an innumerate amount of stars, and Dark Mind not only\
        \ corrupted it, but can manipulate its entirety), possibly Multi-Universe\
        \ level (Defeated Soul of Sectonia and King D-Mind. The former is the result\
        \ of Queen Sectonia consuming four Miracle Fruits. Just one transforms Kirby\
        \ into Hypernova Kirby. Except the original name for Kirby's transformation\
        \ is Big Bang Kirby. The name can be trusted due to official biographies describing\
        \ it as the Big Bang. The first line reads \"\u3068\u3064\u3058\u3087 \u3042\
        \u3089\u308F\u308C\u305F \u5149\u304B\u304C\u3084\u304F\" = \"Suddenly appeared\
        \ light shining.\" The second line reads \"\u304D\u305B\u304D\u306E\u5B9F\"\
        \ = \"The fruit of the morning.\" Finally, the third line depicts \"\u305D\
        \u306E\u5B9F\u3067 \u3048\u305F\" = \"It was captured in the real world.\"\
        \ Thus, the name and description support it. The Big Bang created the universe\u2014\
        consuming four of them would be the power of four universes. The latter was\
        \ a form of Dark Mind's, which, upon his defeat, cracked and shattered the\
        \ Black Mirror. Since there is a parallel version of Landia [who come from\
        \ another universe], Susie gets sucked into another dimension and she has\
        \ slipped between dimensions, arriving in a dimensional rift, and King D-Mind\
