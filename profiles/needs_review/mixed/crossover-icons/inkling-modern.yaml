  intelligence:
    text: Supergenius. Korrok's instance in "Shit Narnia" is intelligent enough to
      predict and foresee the outcome of any action and discern the correct path in
      every situation, always knowing what to do. The lesser biological supercomputers
      that this instance was originally a part of were ten times more powerful than
      modern supercomputers,John Dies at the End, page 394 and Korrok far surpassed
      the intelligence of these, becoming sapient. He predicted the exact conditions
      surrounding Dave and John's appearance in his universe twenty years before they
      arrived. "Largeman" stated that the combined intelligence of all the human minds
      across all of history could not even equal one node of Korrok's neural web,
      describing his intelligence as the continued melding of a billion geniuses.
      Whenever a human of great intelligence appeared within "Shit Narnia", they were
      fed to Korrok, and their intellects absorbed into his own cosmic consciousness.
      He has shared extremely advanced technology with his underlings in many universes,
      showing them how to transport and travel across alternate universes.
    source_ids:
    - mediawiki-inkling-modern
    confidence: 0.6
    notes: auto_repair source extraction
