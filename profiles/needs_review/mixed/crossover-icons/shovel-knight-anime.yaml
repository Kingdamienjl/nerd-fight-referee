    - field: weaknesses
      value: 'He is bound by the Code of Shovelry, and is an honorable fighter. Although
        in some cases he does play dirty, such as when he shoveled Plague Knight in
        the back after he had been defeated.Plague Of Shadows Shovel Knight boss fight
        Notable Attacks/Techniques: Relics (Shovel Knight)= 723c98ae5ebe8f80a2404459691ad476cf627fec.png|Phase
        Locket Anchor.png|Throwing Anchor Propellerdaggerkeyart.png|Propeller Dagger
        Warhornkeyart.png|War Horn Fishinpolekeyartcrop.png|Fishing Rod * Flare Wand:
        A wand that Shovel Knight can whip out to shoot fireballs in front of him
        for at the cost of mana. * Phase Locket: An artifact found in The Lich Yard
        that was formerly Specter Knight''s Keepsake Locket, an artifact from his
        lost friend Luan. When used by Shovel Knight, it allows him to briefly become
        intangible. *Dust Knuckles: A pair of gauntlets that Shovel Knight can don
        to do a quick forward dashing attack, breaking through stone and dirt blocks
        while momentarily keeping him in the air. *Throwing Anchor: A ranged attack
        that allows Shovel Knight to throw a large anchor in the air to hit enemies
        above him. *Alchemy Coin: A projectile that slides on the ground and bounces
        off of walls, dealing light damage to enemies. It can transmute smaller enemies
        into riches that can be later collected. *Mobile Gear: A large block that
        can be thrown on the ground, which can be rode to traverse platforms quickly
        and deal damage to enemies while running them over. *War Horn: Clears a large
        area around Shovel Knight with a massive sound blast, instantly shattering
        stone blocks and one-shotting most smaller enemies. Even to bosses, it deals
        much more damage than his regular attacks, although it also consumes the most
        mana out of any of his abilities. *Propeller Dagger: A dagger that allows
        Shovel Knight to fly horizontally when stabbed forwards. *Fishing Pole: Allows
        the user to fish for objects off of cliffs; it can pull up shopkeepers, Troupples,
        treasures, and more. *Troupple Chalice: A vessel that allows the user to store
        ichor gifted to them by the Troupple King, which can each be consumed for
        different effects. **Ichor of Renewal: Restores Shovel Knight to full health.
        **Ichor of Boldness: Makes Shovel Knight invincible for 10 seconds. **Ichor
        of Fortune: Draws treasures towards Shovel Knight magnetically. *Stalwart
        Plate: Shovel Knight''s default armor. *Final Guard: Causes Shovel Knight
        to drop half as much treasure upon death. *Conjurer''s Coat: Decreases defense.
        However, it allows the wielder to absorb mana from defeated foes. *Dynamo
        Mail: Allows Shovel Knight to store energy in his weapon after performing
        two consecutive shovel drops, executing a powerful charged slash. *Mail of
        Momentum: Negates knockback from enemy attacks, although it makes stopping
        and controlling movements slightly more difficult. *Ornate Plate: As the shop
        puts it, "Flashy! Acrobatic! Useless!" *Armor of Chaos: Changes Shovel Knight''s
        attacks into a more combo/rapid attack style, and allows him to collect health
        and mana drops from enemies. *Toad Gear: Similarly allows Shovel Knight to
        preform swift combos, as well as morph parts of the armor into fists and feet
        for an extra melee attack. Also allows him to strike a sick pose. *Drop Spark:
        At full health, allows the user to send sparks travelling across platforms
        that damages enemies. *Trench Blade: Greatly enhances digging speed, allowing
        even large piles of dirt to be upheaved in one shovel. *Charge Handle: Allows
        the user to execute a powerful charge attack by holding the shovel behind
        them, before unleashing an enhanced melee strike. ==Gallery== File:Main Theme
