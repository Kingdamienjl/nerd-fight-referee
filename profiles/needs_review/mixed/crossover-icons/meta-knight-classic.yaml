    - field: weaknesses
      value: 'Meta Knight prefers chivalrous combat, often refusing to fight his foe
        if they have no means of fighting back such as a sword. He flees when his
        mask breaks for unknown reasons. He sometimes seems to need to defeat or at
        least clobber his foes for a time before using his special abilities. Notable
        Attacks and Techniques: *Meta Quick: Meta Knight increases his speed. *Knight
        Call: Meta Knight summons a Blade or Sword Knight to aid him in battle. *Heal:
        Meta Knight replenishes his health. *Mach Tornado: Meta Knight creates powerful
        tornadoes in his immediate vicinity, heavily damaging all who are caught within.
        In some cases this tornado is localized around Meta Knight, simultaneously
        damaging foes and protecting him from attack. *Galaxia Darkness: Meta Knight
        swings his cape at his opponent, paralyzing them and covering the surrounding
        area in pitch-black darkness should it connect. After a few seconds, the target(s)
        caught by the cape are sent flying by an immensely powerful slash while other
        foes are merely damaged by a far more minor attack. *Drill Rush: Meta Knight
        drills into the target with Galaxia. *Shuttle Loop: Meta Knight uppercuts
        with his sword, travels in a loop and glides. *Meta Multithrust: Meta Knight
        swiftly jabs the target multiple times. Category:Paleomario66 Category:Tier
        2'
