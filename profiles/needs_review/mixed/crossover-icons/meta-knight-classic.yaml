      value: '|-|Maxim Tomato=Heals all of his health when eaten. |-|Various food
        items=Heal varying amounts of his health. |-|Invincible Candy=When collected,
        Blade Knight becomes invincible and faster for a short time, and almost any
        enemy he touches will be instantly defeated, or at least damaged. |-|Dream
        Rod= When picked up and used Blade Knight summons one of the following Dream
        Friends to assist him, some options coming in as a small team: *Bandana Waddle
        Dee *King Dedede *Meta Knight *"Rick & Kine & Coo" *Marx *Gooey *Adeleine
        & Ribbon *Dark Meta Knight *Daroach *Magolor *Taranza *Susie *The Three Mage-Sisters
        |-|Star Allies Sparkler= The Final Weapon in Star Allies, used to take out
        Void Termina. The Star Allies Sparkler fires projectiles from the tip, fly
        around quickly and efficiently, and spin counterclockwise to avoid all damage
        on a relative scale (Sparkler Turn). Kirby canonically took the lead in the
        center of the Sparkler while his friends rode in the tail. Still, the leader
        can be rotated to imbue the shots with a different element depending on the
        leader (the technique is called Rider Switch). The Sparkler can fire different
        homing projectiles with varying power depending on charge time. An uncharged
        shot is called the Sparkler Comet, and it fires a star shaped projectile.
        A charged shot is called the Sparkler Starshot, and it fires a projectile
        shaped like two intertwining stars. The strongest attack is called Team Star
        Allies!, which, if everyone who''s riding charges together and releases at
        the same time, fires a giant laser at the opponent. Blade Knight uses this
        item on his own when used in The Ultimate Choice of Star Allies. |-|Power-Up
