        the target. **Plasma Cannon: A large double handed blaster that shoots plasma,
        it has unlimited ammo. **Sniper Rifle: A standard sniper rifle that can kill
        most enemies in one shot. **Grenade: A grenade that creates an explosion that
        kills on a 12 feet radius. **Sensor Bomb: A bomb that works as a mine, if
        something passes near it, it explodes. *Vehicles: *Arwing *Landmaster'
