        \ Time Slow to reduce Mega Man\u2019s speed by half. He also went up against\
        \ Elec Man, whose Thunder Beam can short-circuit robots, making it extremely\
        \ dangerous. *On his second outing, Mega Man would go up against Quick Man,\
        \ who is significantly faster than him by a large margin, defeating him. *On\
