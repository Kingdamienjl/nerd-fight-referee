      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Mega Man is powered by sunlight, so spending large amounts of time underground\
        \ without an alternate source of power can be potentially dangerous, but this\
        \ is usually a non-issue in most combat situations. His copied weapons have\
        \ limited ammunition. The Double Gear System is noted to put a strain on robot\
        \ systems. He is rather gullible and na\xEFve at times due to his natural\
        \ programming, having been fooled by Wily's robotic duplicate of Dr. Light,\
        \ a ruse that Proto Man saw through in an instant) Notable Attacks/Techniques:\
        \ Pre-Stardroid Invasion weapons and techniques= Mega Buster: An ambidextrous\
        \ arm cannon built by Dr. Light. It fires energy bullets made of highly compressed\
        \ solar energy. Mega Man 4, Mega Man 8 and Mega Man & Bass shows that it can\
        \ be used while having another weapon equipped. *New Mega Buster: The most\
        \ frequently used variation of the Mega Buster. It allows him to charge solar\
        \ energy to increase the power and size of his shots, attacking with a Charge\
        \ Shot. *Super Mega Buster: A modification made by Dr. Cossack. The charge\
        \ shot gets more power having a larger projectile and shorter charge time,\
        \ but if Mega Man suffers damage while charging a shot, the charged energy\
        \ will be lost and he will need to charge again. There's a variant of this\
        \ weapon that doesn't lose charged energy after receiving a hit, but a fully\
        \ charged shot knocks Mega Man back a little. Slide: Mega Man performs a fast\
        \ slide along the ground, allowing him to dodge attacks more easily and go\
        \ through narrow spaces. Bladed"
      source_id: mediawiki-pit-classic
      provider_id: vsbattles
      authority: high
      confidence: 0.75
