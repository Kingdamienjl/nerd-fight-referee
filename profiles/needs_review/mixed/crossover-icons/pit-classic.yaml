    - field: standard_equipment
      value: '*Energy Tank: A can that fully restores Mega Man''s health. He can carry
        up to nine of them at a time. *Weapon Tank: A can that instantly refills either
        one of Mega Man''s Special Weapons or all weapons at once. He can carry up
        to nine at a time. *Super Tank: A can that instantly heals Mega Man and refills
        all of his weapons. Only one can be carried at a time. *Mystery Tank: A can
        with various mysterious effects. It can heal Mega Man and refill all of his
        weapons. If Mega Man uses the Mystery Tank with all health and weapons filled
        up, all enemies within a certain radius from him will turn into 1-Ups/Spare
        Bodies. Only one can be carried at a time. *Magnet Beam: An item that allows
        Mega Man to create an straight beam of adjustable length that can be used
        as a platform. The beam disappears after a while. *Items 1, 2 and 3: Three
        different platforms that can slowly rise up, fly in a straight path, and climb
        up walls respectively. *Carry: A single stationary platform that appears under
        Mega Man if he is in mid-air, or slightly ahead of him if he is standing on
        the ground at the time of use. It disappears after a while. *Sakugarne: A
        pogo stick-like jackhammer robot. Mega Man does several jumps while riding
        him, dealing considerable damage to enemies he jumps on. *Wire: Mega Man fires
        a claw attached to a wire. When it hits a surface, it will retract, reeling
        Mega Man in. *Balloon: A balloon on top of a propeller that Mega Man can stand
        on. It slowly goes up like Item-1. *Super Arrow: An arrow with a suction cup
        for a head that is fired forward. It either disappears when hitting an enemy,
        dealing damage, or sticks to walls, working as platforms that Mega Man can
        climb. There''s a short delay between it being fired and going forward, during
        which Mega Man can climb it and go along with it. *Mega Ball: An explosive
        ball that can be kicked to damage enemies and bounces on walls. Mega Man can
        jump on it, making it blow up and boosting him up. This can be done mid-air
        several times, effectively giving Mega Man several extra jumps. *Rush: Mega
        Man''s canine companion, which can transform into several vehicles, fire energy
        from it''s mouth, use an holographic projector, bombard enemies from above
        with explosives, supply Mega Man with healing items and has a good sense of
        smell. *Eddie: An item transportation robot created to carry items for Mega
        Man. He can also fly with a jet engine or propeller and drop bombs. *Beat:
        A bird-type combat support robot that attacks by ramming into opponents. He
        can also save Mega Man from long falls and provide him with a temporal forcefield
        that let''s him no sell several attacks that would otherwise damage him. *Tango:
        A feline robot build to assist Mega Man in the battle against the Stardroids.
        He attacks by bouncing on the ground while spinning at high speeds. Optional'
      source_id: vsbattles-pit-classic
      provider_id: vsbattles
      authority: high
      confidence: 0.75
