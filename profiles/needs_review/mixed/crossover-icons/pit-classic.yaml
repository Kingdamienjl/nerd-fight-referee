        \ and countering opponent fighting styles in short amounts of time. He's also\
        \ good at figuring out enemy weaknesses. He is able to instantly analyze and\
        \ master any Special Weapon he acquires and has navigated through Wily's series\
        \ of death traps and puzzles to foil him time and again, even defeating advanced\
        \ robots designed to conquer other planets. {| class=\"fandom-table\" !Aspect\
        \ !Feats |- |Vs. Stat Differences | *On his very first outing, Mega Man would\
