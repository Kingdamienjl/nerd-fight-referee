    - field: attack_potency
      value: 'At most Large Star level (Compares to characters like Heimdall who can
        destroy Dark Elf Harrows that are powered by black holes, and Doctor Strange''s
        most casual magic, that can dispel a 0.3 FOE black hole. Is physically the
        same Loki that can fight Brunnhilde (Valkyrie), albeit briefly. Is Sylvie''s
        equal. Even with his magic completely negated, he is still vastly more powerful
        than every TVA Minutemen, with multiple required to restrain him) | Low Complex
        Multiverse level (At least Sixth-Dimensional: Completely transcendent of time
        itself, which includes the hyper-time of places like the End of Time and the
        TVA, where regular Time Manipulation does not work. His Time Stop is so powerful
        that it works at the End of Time. Destroyed the Temporal Loom with magic,
        a device capable of causing an explosion so potent it can delete an infinitely
        expanding Multiverse and the TVA as a failsafe for the Sacred Timeline. Weaved
        together the Multiverse into an Yggdrasil structure, which is infinite and
        further expanding with infinite more branches every second. Scales to his
        durability.)'
      source_id: character-stats-profiles-inkling-marvel-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: Superhuman with at least Relativistic+ Combat Speed (Vastly above Captain
        America who can react to Repulsor Blasts. Can fight other versions of himself)
        | Inaccessible, likely Immesurable (Capable of moving in a temporally decayed
        TVA that left a void. Is not governed by time in at least two dimensional
        axes), Omnipresent within the Multiverse (The branches are directly tied to
        his magic)
      source_id: character-stats-profiles-inkling-marvel-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: At most Large Star level (Endured attacks from Sylvie, a variant of himself)
        | Low Complex Multiverse level (Spaghettification does not affect him, which
        can fully erase the TVA leaving absolutely nothing behind. Unaffected by the
        Temporal Loom's explosion or holding branches containing whole timelines.)
      source_id: character-stats-profiles-inkling-marvel-comics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Slightly carefree and arrogant, though these mellow down as the series\
        \ continues | None Feats for God Loki: *Destroyed the Temporal Loom with magic\
        \ and directly tanked the explosion. He Who Remains stated the Loom was a\
        \ failsafe device, made to explode if overloaded with branches, deleting all\
        \ bar the Sacred Timeline. This is a Low 1-C explosion, as it can account\
        \ for infinite expansion which continues without stopping. *Loki would then\
        \ pull all the branches, each containing entire timelines which branch themselves\
        \ into new timelines endlessly, into an Yggdrasil, physically manipulating\
        \ them and sending his magic through all of them to revive the Multiverse.\
        \ This is a 5-D feat bare minimum. *Loki is completely above time, which includes\
        \ two axes: **Regular time, inside universes of the multiverse, where time\
        \ travel is possible, and new possibilities branch to become new timelines.\
        \ **The enhanced time, a \u201Chypertime\u201D per se, of realms outside the\
        \ multiverse, including the domain of the TVA and the End of Time. Time here\
        \ is fully linear, and impossible to manipulate, yet Loki can easily time\
        \ travel to change events in the past and can use time stop at the End of\
        \ Time, which should not be possible based on regular rules stated by both\
        \ Mobius and Ouroboros. **Loki having such power over time, in both the Multiverse,\
        \ and realms transcendent where hypertime is fixed, results in God Loki being\
        \ 6-D in Low 1-C. *To expand on this: Spaghettification (See Note 1), a temporal\
        \ decay phenomena that can wipe even the TVA leaving a void of complete nothingness,\
        \ is ineffective against Loki. Based on established cosmology, this is 6-D\
        \ durability, confirming even severe breakdowns in hypertime cannot affect\
        \ him even remotely. **This is also Inaccessible, likely Immesurable speed,\
        \ as Loki could move in said void. **Further supplementing this feat is that\
        \ Loki can fully stop spaghettification and even reverse it. Notes: #For those\
        \ confused by \"Spaghettification\", spaghettification is a phenomena in Loki\
        \ which occurs in either two circumstances: extreme temporal radiation, or\
        \ the decay of space-time. This causes reality and beings in that reality\
        \ to deconstruct into spaghetti-like tendrils, hence the namesake. The most\
        \ impressive part of this is that, after the ending of episode 5, Loki is\
        \ completely immune to spaghettification despite it being capable of affecting\
        \ even the TVA, which operates on different, higher temporal rules. #Loki\
        \ should not be compared to Minutemen at his full power. The only reason B-15\
        \ could one-shot Loki was because he was severely weakened from the Battle\
        \ of New York and gravely underestimated the Minutemen due to arrogance. They\
        \ can only threaten Loki, if even, due to the TVA's magic dampeners which\
        \ prevent the use of any magic, and the use of Time-sticks that can prune\
        \ opponents. Do not compare Minutemen to Loki's peak. ==Others== Notable Victories:\
        \ Notable Losses: Inconclusive Matches: Category:ThyFluffyDolphin Category:Tier\
        \ 1 Category:Tier 4 Category:Tier Low 1-C Category:Tier High 4-C"
