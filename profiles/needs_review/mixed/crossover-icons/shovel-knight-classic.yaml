      value: "Kilometers to Planetary (Thor can reach these ranges) | Kilometers to\
        \ Planetary | Hundreds of meters (Spider-Man's webs can reach these ranges)\
        \ | Planetary (Iron Man's satellites can reach these ranges) Teamwork: The\
        \ first members of Avengers initially clashed in regards to decision making,\
        \ though they were able to pull together rather effectively. Each member stays\
        \ in contact with one another through technological means, consistently giving\
        \ updates on the situation. Iron Man tends to use his aerial mobility to both\
        \ chase and trail away enemies, either leading them into obstacles or Hawkeye's\
        \ line of fire. Black Widow settles on close quarters combat as well as using\
        \ the weapons and resources of her enemies against them. With Steve's strength\
        \ and Natasha's agility, Captain America has used his Shield to boost Black\
        \ Widow into the air to deal with aerial opposition. As the strongest opponents\
        \ on the team, Hulk and Thor rely on directly physical combative measures,\
        \ combating threats possessing raw power that the others simply cannot fight\
        \ themselves. That said, Hulk tends to be far more aggressive and reckless\
        \ while Thor has the added benefit of range through lightning should he feel\
        \ the need to utilize it, and may incorporate nearby objects into his fighting\
        \ style. Captain America acted as the primary strategist during The Battle\
        \ of New York, as he quickly deduced the skill of each Avenger despite limited\
        \ knowledge of their combat history. The Avengers has displayed great functionality\
        \ in pairs, performing team attacks without directly communicating. These\
        \ cases involve Captain America utilizing his shield to reflect Iron Man's\
        \ repulsor blasts into surrounding opponents, or Thor and Hulk using a large\
        \ chunk of metal as a nail which they \"hammered\" into the Leviathan. The\
        \ founding Avengers are now fairly close\u2014knit, with their previous strategies\
        \ further strengthened, displaying greater synergy. Each member considers\
        \ each other friends and even the Hulk has attained greater restraint thanks\
        \ to the group's efforts. Newest recruits Scarlet Witch and Quicksilver, while\
        \ being inexperienced, are loyal to the team and its causes. Quicksilver may\
        \ go as far as to sacrifice himself for the sake of his teammates. Wanda and\
        \ Vision possess useful mind based attacks, which at the very least can act\
        \ as a means to delay an opponent's response. Iron Man, Thor, and Vision can\
        \ combine their energy based attacks to wear down stronger and more durable\
        \ opponent. After the Civil War, original Avengers were left split up. As\
        \ such the remaining Avengers War Machine and Vision are slightly distant\
        \ from the main team. Iron Man and Spider-Man remain on the same page regarding\
        \ strategies in combat, and while Peter mostly follows Stark's direction,\
        \ Tony does take into consideration the younger hero's thoughts on tactical\
        \ approaches. Coincidentally, each of the team members during this time period\
        \ had fought on the same side during Civil War. That said, they have no experience\
        \ specifically working in this format. The team is fairly effective and close-knit,\
        \ with the exception of members like Nebula, and somewhat War Machine, who\
        \ due to relatively recent events are somewhat aloof and distant from the\
        \ rest of the team. That said, Rhodes and Nebula work competently together,\
        \ with it being suggested the two have handled missions as a duo previously.\
        \ Tony, Bruce, and Rocket are the most technologically experienced members\
        \ of the team and will work with each other in creating advanced equipment\
        \ such as the Nano Gauntlet. Bruce has managed to attain control of the Hulk,\
        \ allowing himself to now utilize his incredible power in combination with\
        \ his admirable intellect. Ant-Man acts as an excellent unit for sneaky retrievement\
        \ based tasks due to his ability to shrink in size. As Giant-Man, Scott becomes\
        \ one of the strongest members on the team, surpassing the Hulk in raw power."
