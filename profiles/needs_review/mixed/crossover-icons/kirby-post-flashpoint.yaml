        survive normal radion shots. When Darkseid was shot and weakened by the radion
        bullet he was already dying. Moreover, in order to fully incarnate in a lower
        plane of reality by possessing a human body, a noble soul must be corrupted,
        otherwise the process is not fully successful. Feats: Show/Hide |-|Base= *
        Used his energy to create Stayne, a being that proved to be a perfect match
        against Takion, and possessed all his powers * His anger scared the Lords
        of Chaos * Disintegrated Agogg, a being capable of easily overwhelming base
        Orion * Played around with John Stewart and his Darkstar team for exercise
        (Darkstars are the equals of Green Lanterns) * Wiped Vundabar from existence
        * Darkseid is so powerful that time collapses when he''s removed from his
        proper place in the timestream * Absorbed energy from Excalibur and stated
        he could accidentally destroy his servants that way - said servants were comparable
        to Pre-Crisis Kryptonians. He also absorbed energy from the Wand of Mentachem
        and Orb of Orthanax, as well as from Mordru, the Time Trapper (Controller),
        and the entire Sorcerers'' World * While weakened, controlled 3,000,000,000
        Daxamites at once * While weakened, used Omega Beams to swap Daxam and Apokolips
        (which resided in the mortal universe at the time) * While weakened, no-sold
        Pre-Crisis Mon-El''s attack before beating him instantly * While weakened,
        completely stomped the Legion with a myriad of abilities * Omega Beams easily
        caught Lightray and sent him hurtling through infinity * Omega Beams were
        able to cause the Spectre (Hal Jordan) pain before he began powering through
        them * Did not even move when Mantis blasted him with the full power of a
        Green Lantern ring * Slew other pantheons of gods and stole their power *
        Darkseid''s consciousness remained active and able to channel power despite
        his body having been destroyed/trapped in limbo |-|Godhead= * Won the war
        in heaven against New Genesis * [While dying] Broke the Orrery of Worlds across
        all of time and nearly dragged all its contents into a Multiversal singularity
        (that was explicitly Darkseid''s own singularity, not something that happened
        to already be there) that was one with Darkseid * [While dying] Created an
        endless number of realities to torture Shilo Norman * [While dying] Charged
        Batman with enough Omega radiation to destroy time Notable Attacks/Techniques:
        |-|Pre-Flashpoint Emanation= Omega Effect: Uxas was reborn as Darkseid when
        he absorbed the full power of the Omega Effect from the Infinity Pit. Thanks
        to the Omega energies he gained incredible power and a wide array of abilities.
        * Omega Beams: Darkseid''s signature technique involves firing a thin, red
        energy beam from each eye. These beams, also known as "Finder Beams", are
        extremely fast and home in on their target, passing through physical barriers
        if needed. Once contact is made, they can either erase the target from existence,
        a technique called the total wipeout, or transport them through time and space
        according to Darkseid''s will. He can also use them to recreate dead beings,
        or paralyze his target while probing their weakness. * Omega Sanction: Also
        known as the Life Trap, the Omega Sanction can take two completely different
        forms depending on Darkseid''s intent. The first simply sends his target back
        in time, forcing them to live out their life in the past. The second, stated
        by Grant Morrison to happen when Darkseid decides on being crueler than normal,
        was only displayed by Godhead Darkseid. It traps the victim in a never-ending
        series of horrible realities that force them to live out worse and worse lives,
        until their soul breaks. * Energy Absorption: Darkseid is an immensely powerful
        energy absorber, capable of completely draining the energies of powerful beings
        like Mordru and all of Sorcerers'' World to help restore his own power. His
        absorption is so powerful that he ordered his servants to get away from him
        lest they be killed, and some of his servants were capable of taking on Pre-Crisis
        Kryptonians and Daxamites. Boom Tubes: Darkseid can summon boom tubes at will,
        as well as control the paths of others'' boom tubes. These portals can transport
        their user throughout space and between dimensions. They automatically adjust
        the size of their user to be suitable for their destination, which is why
        Darkseid appears human-sized rather than star-sized when travelling to the
        mortal universe. Telepathy: Darkseid has incredibly powerful telepathic abilities.
        He can forcefully drain information out of his target''s mind as well as control
        others with his will. While in a weakened state during the Great Darkness
        Saga, he controlled three billion Daxamites at once. Avatars: Darkseid can
        create duplicate bodies from portions of his energy that can function autonomously.
        They are significantly weaker than his real body but otherwise'
