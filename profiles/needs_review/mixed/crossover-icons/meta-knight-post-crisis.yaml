        due to his kind and good-hearted nature. He vows to never kill or seriously
        harm, and thus, almost never goes ''all out''. *Superman admits to holding
        back against his enemiesSuperman Vol 2 #153, February 2000 *Superman goes
        through great care not to hurt people, and only goes hard against people who
        can take it.Action Comics Vol 1 #831, November 2005 **Note: This doesn''t
