        time in Dedede''s castle as a Stage, with the windows showing it was still
        night when he reached Dedede. Kirby commonly fights notable, late-game enemies
        through several phases or "fake final battles" with little time between them,
        not getting exhausted until all threats have been dealt withKirby''s Dream
        Land 2''Kirby''s Dream Land 3''Kirby & The Amazing Mirror) | Superhuman normally
        (As before. Fought Queen Sectonia straight through the entire night, the change
        between a moonlit night and an evening sun intentionally indicating the passage
        of time; Previously chased non-stop a Taranza kidnapping King Dedede from
        the morning of the previous day mostly by running, hindered by many Stages
        and battles, climbing the Dreamstalk until reaching "the Heavens'' stratosphere"
        in Planet Popstar from an unknown starting point already in the sky.Kirby:
        Triple Deluxe Fights notable, late-game enemies through several phases or
        "fake final battles" with little time between them. Won Dedede''s Cake Royale
        tournament over time alongside Bandana Dee, which consisted mostly of physical
        confrontations, beating various Kirby clones as good as the original in the
        process time and again, growing stronger rather than showing exhaustion),
        Infinite as Ghost Kirby (Continues fighting after being defeated as Ghost
        Kirby. Has no health bar in-game, being undefeatable, whereas he''s tired
        & with little health upon coming back to life) | Superhuman (As before. Along
        other Star Allies, he always chased the Jamba Heart pieces several times across
