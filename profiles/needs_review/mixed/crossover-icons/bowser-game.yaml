    - field: weaknesses
      value: 'While in his enraged state his durability drops by half. He can sometimes
        lack foresight which causes him to make mistakes and overlook crucial details
        in his plans. Highly arrogant and narcissistic. Notable Attacks/Techniques:
        bowser fire breath.png|Fire Breath. bowser fire storm.gif|Fire Storm. bowser
        fire breath barrage.gif|Fire Breath Barrage. fury blast bowser.png|Fury Blast.
        Fire: What this reptilian tyrant is known for. It is Bowser''s signature attack
        and he is able to make use of this with a multitude of diverse applications:
        *Fire Breath: Bowser''s signature attack and probably the most skilled fire
        breather in the series as he is able to breathe fire in various ways. Bowser
        will breathe fire either in large streams or individual large fireballs. He
        also uses this move to make a fiery rain and breath different colored fire
        that has unique effects such as breathing blue fireballs that homes onto his
        target. Bowser have occasionally shown to be even embed his physical attacks
        such as claw swipes and tail whips with fire. *Fire Storm: Bowser breathes
        a large stream of fire that acts as a whip. Hitting opponents with it cause
        them to be cloaked in fire, run uncontrollably, and reverse their normal movements.
        *Fire Breath Barrage: Bowser''s Special Shot in Mario Tennis Aces. First,
        he roars and begins breathing a stream of flames on his racket, setting it
        on fire. He then jumps high and quickly spins in the air while leaving trails
        of fire before hitting the ball. *Fury Blast: An enhanced version of his normal
        Fire Breath. This version of his iconic attack is only used by Fury Bowser,
        in which he unleashes a large stream of fire in a single direction of his
        choosing. bowser ko punch.gif|K.O. Punch. bowser shockwaves.gif|Shockwaves.
        fury bowser.png|Fury. K.O. Punch: Bowser will charge up his fist with some
        form of energy before unleashing a devastating punch on his opponent. Dashing
        Punch: Bowser will slide forwards as if he were on ice at high speeds while
        holding his fist out. Spiked Shell: Like the Koopa Troopas, Bowser can retreat
        into his shell and start spinning around at high speeds and ramming into the
        opponent. Spike Shot: Bowser will either shoot spikes from his claws or shell
        at his opponent. Shockwaves: Bowser will stomp or hit the ground so hard,
        he will generate shockwaves. The shockwaves will occasionally have an electric
        or fiery effect. Fury: A double-edged status alignment that activates when
        Bowser takes several hits, glowing red and roaring upon activation. All of
        his attacks will double in power but he also receives double the damage from
        his opponents as well. bowser crush.gif|Bowser Crush. illusion hat.gif|Illusionary
        Hats. bowser gravity.gif|Gravity Inversion. Magic: Alongside his usual tactics
        for combatting his foes, Bowser is also no stranger to using magic to achieve
        what he desires. *Transmutation: A personal favorite of his, Bowser will cast
        a spell on his target(s) that will change them into helpless stone bricks,
        blocks, plants, frogs, apples, or even obedient monsters, being able to affect
        entire populations of a country at once with the spell with ease. *Bowser
        Crush: Bowser will create a giant green Mechakoopa to stampede over his opponents.
        *Illusionary Hats: Bowser will create illusionary hats to throw at his opponent,
        despite being illusions they can physically harm anyone they touch. *Gravity
