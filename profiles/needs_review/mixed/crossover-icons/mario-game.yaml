    - field: speed
      value: "left|350px As some of the lowest feats the series' lowest-tiers are\
        \ scaled to, there is outspeeding lightning and running the planet's equator\
        \ in fifteen seconds, which is Mach 7,781. The former is a 2-D Mario feat,\
        \ and the latter is an M&L feat. Once again, Mario is very inconsistent here\
        \ because he mostly scales to others. But surprisingly, Mario has plenty of\
        \ his own speed feats. He took action after being fired from the Bye Bye Cannon\
        \ at sub-relativistic speeds, and in Super Mario 64, doubled Koopa the Quick's\
        \ speed, which reached Mach 1, the speed of sound, making him supersonic in\
        \ that game. However, that's an immense low-end, and is never used in any\
        \ of the profiles. Atop of this, Mario has accomplished feats such as remaining\
        \ unfazed in close proximity to black holes in Mario Party 5, Mario Party\
        \ 6 (which is also the gif and the only one where he isn't necessarily \"\
        unfazed\"), Mario Party 8 and Mario Party 9. However, all four of these black\
        \ holes give him different speeds. MP5 and MP8 are regular black holes in\
        \ regular proximities; the latter might be an immensely powerful quasar that's\
        \ bursting with energy, but that shouldn't change things other than it being\
        \ a bigger black hole. The MP6 black hole is quite impressive, as the red\
        \ strips are actually light beams flying past the characters are they struggle.\
        \ So they're dozens of times faster than light in the game; in MP9, they're\
        \ far faster though. The black hole in that game is enormous and sucks planets\
        \ across gaps akin to solar systems within seconds. It should be massively\
        \ faster than light+. Many characters accomplish these feats, and it's scaled\
        \ to their Mario Party keys. Not to mention two MFTL+ feats in those games.\
        \ In Mario Party 3, the characters battle Millennium Star, who flew from the\
        \ center of the universe to Earth in seconds, and in Mario Party 9, Bowser\
        \ and Bowser Junior keep up with the Mini-Stars, which flew out of a black\
        \ hole in less than a second, and began soaring back to their original placements\
        \ across the universe. And most of these have just been Mario Party feats,\
        \ as you've likely noticed. Mario, Peach, Bowser, Geno and Mallow all defeat\
        \ Culex, who was\u2014as pointed out above\u2014crossing between dimensions\
        \ and inside a dimensional rift, outside of time and space. This makes him\
        \ infinite in speed. The characters kept up with him, but they also maintained\
        \ their own movements within the same dimensional rift. This makes them infinite\
        \ in speed. It should also be brought up that Dreamy Luigi flew out to a distant\
        \ constellation in less than a second, making him massively faster than light+.\
        \ And Antasma, Zeekeeper, Mario, Luigi and Dreamy Bowser all scale to this\
        \ as well. Like they need it, though; Zeekeeper tore and moved inside a dimensional\
        \ rift, as did Giant Dreamy Luigi, which scales to everyone at the end of\
        \ the day. Antasma for keeping up with Mario empowered by Dreamy Luigi, Giant\
        \ Dreamy Luigi for keeping up with Zeekeeper and moving in the rift on his\
        \ own, Mario for fighting Antasma after he'd stolen Dreamy Luigi from him\
        \ and powered himself up utilizing Dreamy Luigi and for impressing Zeekeeper\
        \ with his speed, Luigi for scaling to Mario and Dreamy Bowser, and Dreamy\
        \ Bowser for not only being superior to Antasma and a contender with Zeekeeper,\
        \ but for being able to keep up with Mario. The scaling works out really well,\
        \ making all the main characters in Dream Team consistently around the same\
        \ levels of power and speed, with a few understandable acceptions, such as\
        \ Bowser's Minions. And while not nearly as impressive, Dreamy Luigi also\
        \ flew out into the Sun in less than a second, making him around 500x faster\
        \ than light. Mario also swam past a sea of stars in Super Paper Mario, crossing\
        \ millions of lightyears in seconds. And in Super Mario Galaxy 2, he gains\
        \ the best MFTL+ feat within the franchise. In the beginning of the game,\
        \ prior to Bowser kidnapping Peach, as well as Mario getting involved, Bowser\
        \ tagged Starship Mario with his meteors, and was keeping up with it. Whilst\
        \ it was being piloted by a very skilled flyer, nonetheless. Starship Mario\
        \ crosses each world in the game in ten seconds, which are entire universes.\
        \ This means it can cross 9.1 billion lightyears in a second. The screen does\
        \ not remain static, it actually moves\u2014so the ship is indeed crossing\
        \ it. Later on in that game, Mario keeps up with Bowser, and even dodges the\
        \ same meteors that tagged Starship Mario. Thus, Mario, in Super Mario Galaxy\
        \ 2, could fight, move and react at speeds capable of crossing 9.1 billion\
        \ lightyears in one second! This makes Mario 287,174,160,000,156,544 times\
        \ faster than light. With something like the speed quadrupling Rainbow Star,\
        \ Mario would be 1,148,696,640,000,626,176 times faster than light. Characters\
        \ like Elvin Gadd walked overseas and over hills in three seconds, which is\
        \ at speeds of Mach 6,534.343277. And remember: he walked that speed, making\
        \ him at a higher exertion of speed, sub-relativistic. Many characters are\
        \ faster"
