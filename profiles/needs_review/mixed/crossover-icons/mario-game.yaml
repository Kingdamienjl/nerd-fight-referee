    - field: weaknesses
      value: "Sometimes lets his anger get the better of him Notable Attacks/Techniques:\
        \ *Fire Breath: Bowser's signature attack and probably the most skilled fire\
        \ breather in the series as he is able to breathe fire in various ways. Bowser\
        \ will breathe fire either in large streams or individual large fireballs.\
        \ He also uses this move to make a fiery rain and breath different colored\
        \ fire that has unique effects such as breathing blue fireballs that homes\
        \ onto his target. *Fire Storm: Bowser breathes a large stream of fire that\
        \ acts as a whip. Hitting opponents with it causes them to be cloaked in fire,\
        \ run uncontrollably, and reverse their normal movements. *Shockwave: Bowser\
        \ will stomp or hit the ground so hard, he will generate shockwaves. The occasionally\
        \ shown have an electric or fiery effect. *Spinning Shell: Bowser withdraws\
        \ into his shell and starts spinning at high speed, occasionally being able\
        \ to hover. This move is used for both offensive and defensive purposes. *Spike\
        \ Ball: Bowser withdraws into his shell and takes the shape of a spiky ball,\
        \ rolling at high speed and being able to climb walls. *One KO Punch: Bowser\
        \ will lean back and build power into his fist and then rushes to the target\
        \ to deal the killing punch. He uses this move to finish off Dark Bowser.\
        \ *Fury: A double-edge status alignment that activates when Bowser taken several\
        \ hits, glowing red and roaring upon activation. All of his attacks will double\
        \ in power but he also receives double the damage from his opponents as well.\
        \ *Poison Gas: Bowser will create a fog of poison gas that will damage and\
        \ poison his opponents. He can also utilize poison attacks with his claws\
        \ and bites. *Terrorize: Bowser will summon a giant Boo to strike fear into\
        \ his opponents. This will cause damage and inflict the Fear status on his\
        \ opponents. *Crusher: Bowser will make a giant jagged rock spire up from\
        \ the ground beneath his foes. *Bowser Crush: Bowser will create a giant green\
        \ Mechakoopa to stampede over his opponents. *Dark Magic: Although not used\
        \ frequently, Bowser is noted to be skilled user in dark magic. A few notable\
        \ skills ranges from be able to transform people into blocks and shrinking\
        \ his opponents, to turning an entire island into a book and teleporting himself\
        \ or his target. *Superclaw Bowser: Bowser's Megastrike. His claw and spikes\
        \ will extend, his hair turns to fire, and his eyes glow yellow-white as his\
        \ skin turns to red-black. Then he strikes the target at terrifying speeds.\
        \ *Magic Weapon: Bowser will forge a weapon made of pure energy in shape of\
        \ a hockey stick. This move is only seen in Mario Sport Mix. Note: There are\
        \ more scans that support Dreamy Bowser being 2-B below: Translation: \"\u3088\
        \u3046\u3053\u305D\u3001\u30D5\u30E5\u30FC\u30C1\u30E3\u30FC\u30FB\u30C9\u30EA\
        \u30FC\u30E0\u3078! \u3053\u3053\u306F\u300E\u3046\u3061\u3085\u3046\u306E\
        \u30E6\u30E1\u300F\u304B\u3089\u3046\u307E\u308C\u305F\u305B\u304B\u3044\u3058\
        \u3083\u3002\" Welcome to Future Dream! This is a world born from the \"dream\
        \ of the universe\". - Mario Party 5 Translation: \"\u3060\u308C\u3082\u304C\
        \u3082\u3064\u3001\u3046\u3061\u3085\u3046\u3078\u306E\u3042\u3053\u304C\u308C\
        \u3002 \u305D\u3093\u306A\u3001\u306F\u3066\u306A\u3044\u30E6\u30E1\u306E\u306A\
        \u304B\u3067 \u30EF\u30AF\u30EF\u30AF\u3057\u3066\u3044\u304F\u306E\u3058\u3083\
        \u305E!\" \"Everyone admires the universe. We are so excited to be inside\
        \ an endless dream!\" - Mario Party 5 Ending cutscene - Mario Party 5 All\
        \ of the dreams are in parallel sized orbs with Future Dream being a single\
        \ insignificant speck in the totality of it all. Ending cutscene - Mario Party\
