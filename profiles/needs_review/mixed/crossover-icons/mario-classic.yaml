      value: "left|350px The Marioverse is well-renowned for their magical prowess,\
        \ including magical attacks, the ability to heal, amplify stats, transmute\
        \ people or items into mushrooms or even scarecrows, and so on. As a matter\
        \ of fact, the characters are even stated to specialize in magic, and many\
        \ characters\u2014like Kamek, Bowser, Shadow Queen and Dimentio\u2014have\
        \ dozens of abilities that pertain to their magic, including but not limited\
        \ to: cloning, transmutation (of course), curses (such as Kamek's dust curse,\
        \ where dust will never clear from what he curses, allowing him to cloak his\
        \ foe in dust for eternity), creation, reflection manipulation, mind control,\
        \ summoning, and so on. Outside of magic, though, the characters still have\
        \ dozens of haxxy abilities. Even a Goomba has telekinesis, and Hammer Bros.\
        \ have the ability to double durability and manipulate musical magic, as well\
        \ as some having the power to get even stronger through anger alone. Enemies\
        \ like Buzzy Beetles are immortal, and Shy-Guys are undead. left|360px right|300px\
        \ Antasma is ridiculously broken when it comes to dream manipulative abilities.\
        \ First, he has nightmare inducement, nightmare embodiment, nightmare affinity,\
        \ nightmare imprisonment, sleep inducement through his nightmare inducement\
        \ (essentially putting you to sleep by inducing you to have a nightmare) and\
        \ dream manipulation. What does this equate to? Well, say you're having a\
        \ good dream. Antasma can manipulate your dream into featuring him. He can\
        \ then induce you to have a nightmare about him, in which he embodies the\
        \ entire nightmare. He can then trap you within that nightmare, and gain power\
        \ from that nightmare. Heck, he's had foes fall asleep within their dream,\
        \ causing them to have double nightmares, gaining double the power every second.\
        \ Ridiculous, right? He even has an immunity to sleep manipulation. Mid-high\
        \ tiers, like King Boo, have the ability to manipulate matter on a subatomic\
        \ scale, casually materializing and dematerializing structures, which then\
        \ contain pocket realms within them that are the size of a universe with legitimate\
        \ celestial bodies. His matter powers are so strong, that the things he decides\
        \ to materialize are real, and very much detailed, but... not always real\
        \ real. And the things he dematerializes vanish without a trace. He can even\
        \ tear apart and put back together characters' atoms flawlessly, like he did\
        \ in Dark Moon to Luigi. Speaking of King Boo, he has the ability to trap\
        \ foes within lifeless paintings for eternity, killing his foe without actually\
        \ killing them. A power that counters even resurrection or immortality! And\
        \ he is also the master of illusory, being so skilled that his illusions can\
        \ be real, yet not be. It's very complex... and some of his illusions include\
        \ moving within a picture that is otherwise dead, scrambling said picture\
        \ even though he's not actually present (when at the same time, he is), and\
        \ even screwing the picture up so badly that a supercomputer crashes. He can\
        \ transmute things into mere frogs, and his lightning has one hit kill capabilities.\
        \ Overall, one the most haxxed characters in the franchise is King Boo, with\
        \ energy manipulation, data manipulation, ally affinity with Boos, reflection\
        \ manipulation, teleportation, reality warping, telekinesis, force-field generation,\
        \ fog generation, size manipulation, shapeshifting, corruption manipulation,\
        \ absolute darkness, regeneration on a low-godly scale and so much more. King\
        \ Boo doesn't have the highest level of regen, though. That goes to Wart,\
        \ of all people, who has regenerated from being erased along with the worlds\
        \ he was in. High-godly regeneration. Heck, Bowser, the main antagonist, was\
        \ revealed to have infinite self-resurrection in TTYD, that is just shy of\
        \ being resuscitation, essentially making it impossible to beat him without\
        \ something akin to BFR. But the verse gets more insane in terms of hax. Let's\
        \ take a gander at two games: Dance Dance Revolution Mario Mix, and Super\
        \ Paper Mario. Starting with the former: *Music Manipulation (Anyone who had\
        \ possession of or was in the same vicinity of a Music Key had the power of\
        \ music transmitted into their souls, and can tap into its power for a variety\
        \ of abilities as long as they're skilled enough, including all of the following\
        \ powers after this one), Mind Control (Waluigi was going to use it to hypnotize\
        \ anyone who didn't have the same dancing abilities as him), Chaos Inducement\
        \ (The Music Keys could rain chaos and discord down, destroying everything\
        \ and everyone), Broadway Force (The second Mario started dancing, things\
        \ like snowmen, fire itself, plates, and flaming wooden logs started dancing\
        \ with him), Pyrokinesis (Mario and Luigi's dancing styles are \"hot,\" and\
        \ can melt things like giant Freezies by generating and shooting fire pretty\
        \ easily), Telekinesis (Could sail a boat across a river), Summoning (Summoned\
        \ a rocket from nowhere to attack Bowser), Statistics Amplification (Using\
        \ the power of dancing, he could increase his speed"
