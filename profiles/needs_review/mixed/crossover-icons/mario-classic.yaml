      value: "7 feat accomplished in Mario & Luigi: Dream Team would be Mario and\
        \ Luigi's KE generated from their speed and mass in the Bye Bye Cannon. This\
        \ feat is large town level, and is used as the basis for scaling Bowser's\
        \ Minions, since even Goombas can take hits from the Bye Bye Cannon, and Goombas\
        \ are the weakest enemies in Bowser's army. Many characters have destroyed\
        \ exact replicas of themselves, such as Bowser destroying Dark Bowser (whom\
        \ of which literally devoured and copied bits of Bowser's DNA), Mario defeating\
        \ Dreamy Mario (whom of which is his \"superior\" self that is unbound by\
        \ natural laws), Mario defeating Doopliss (whom of which literally stole his\
        \ body and his own name), the Heroes of Light defeating Shadoo (whom of which\
        \ created copies of the heroes after studying them in 200 battles), Mario\
        \ and Luigi defeating Memory M and Memory L (whom of which are copies created\
        \ inside of Bowser's brain, specifically made to match every single attribute\
        \ of the Bros.), etc. So, many characters are very impressive in that, either\
        \ their power cannot be perfectly copied, or they simply can increase their\
        \ powers in response to certain needs. Which also seems to be the case in\
        \ many other instances as well... The characters in the franchise vary their\
        \ powers greatly\u2014like the wizard Kamek, who went from creating a mountain\
        \ level tornado, to blasting Mario across the universe with one magical attack\
        \ in Super Mario Galaxy. Of course, there are other characters like King Boo,\
        \ who could materialize the mansion in the original Luigi's Mansion, which\
        \ contained five universe-sized realms inside, and then, in the sequel, the\
        \ Paranormal Dimension relied on his power, so when Luigi captured King Boo,\
        \ the Paranormal Dimension\u2014along with its other universe-sized zones\u2014\
        ceased to exist. This is also similar with Black Jewel, whose defeat collapsed\
        \ his realm, turning it into an empty void\u2014no time, nor any space. Mario\
        \ villains are normally the characters that get the most power, which then\
        \ scales to Mario and his cohorts, if he has any at the time. This is why\
        \ Mario normally ends up inconsistent, what with so many differently powered\
        \ villains to be scaled to. That is also why all characters\u2014except a\
        \ select few, such as characters that only appeared in one to three games\u2014\
        have multiple keys. So they can have their power documented within their many\
        \ appearances. One of the most impressive series of games, feats-wise, would\
        \ be the 3-D Mario games. This is without counting the RPGs, Mario Party and\
        \ Paper Mario, which have far better feats. Within Super Mario 64, Bowser,\
        \ without the utilization of the Power Stars, created his own individual worlds\
        \ within the walls and paintings of the castle. Thus, he created his own space-times\
        \ within them, as they are separate. They are also compared to as \"parallel\
        \ worlds\" of sorts by Mario, so they are all their own universes. And Bowser\
        \ created them practically instantaneously. left|330px right|330px This means\
        \ this is a 2-C feat for creating several space-time continuums that are universal\
        \ in scale. Then came along Super Mario Sunshine, with a tropical island resort.\
        \ Shadow Mario is the main villain here, who turns out to be Bowser Junior\
        \ in disguise. By cursing the island, Shadow Mario creates the Secret Levels,\
        \ which have seemingly infinite voids, and endlessly expanding stars in the\
        \ backgrounds. Thus, he created ten space-time continuums that are universe-sized,\
        \ if not more if the infinite voids are taken as truly infinite, rather than\
        \ just immensely vast, making them 2-C in this game. Finally, the Super Mario\
        \ Galaxy games come along, and give us very consistently high-end Mario characters,\
        \ plus some of the most ridiculous finite speed feats in the series to date.\
        \ There are countless galaxy level beings known as \"Luma\" within the first\
        \ Galaxy game alone. The first Galaxy game introduced some amazing attack\
        \ potency feats, such as Bowser creating an entire galaxy in the heart of\
        \ the universe, and creating a reactor which would stabilize this galaxy,\
        \ and allow him to rule every corner of the universe with that galaxy as his\
        \ throne. Of course, Mario and Luigi intervene, as Bowser kidnaps Peach and\
        \ takes her to the very center of the universe to rule alongside him. After\
        \ Mario invades the galaxy and defeats Bowser through physical combat for\
        \ one of the only times outside of the RPGs, the Koopa falls into a star,\
        \ seemingly killed. Mario then frees the last Grand Star that had been powering\
        \ the reactor, but unfortunately, this destabilizes the reactor. The reactor\
        \ then collapses on the weakened Bowser, forming a supermassive black hole.\
        \ This black hole begins consuming everything around it, and begins sucking\
        \ Mario, Peach, Luigi and everyone else inside. The Lumas then sacrifice themselves\
        \ to hold off the black hole, as Rosalina\u2014a character Mario assisted\
        \ throughout the game, and who returned the favor by taking him and his team\
        \ of Toads and Luigi to Bowser's galaxy\u2014then shields the heroes. The\
        \ black hol"
