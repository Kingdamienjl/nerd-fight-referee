        destination, being able to move even those who can withstand and somewhat
        resist the gravitational pull of a black hole, he can also alter his own gravity
        to achieve the same effects. *Endless Distance: Bowser will distort and manipulate
        the very fabric of space itself to create what seems to be an infinite amount
