        of Super Star with rainbow effects * Vanish Cap: Grants temporary intangibility
        * Metal Cap: Transforms into Metal Mario with increased weight and invulnerability
        * Wing Cap: Enables flight for limited duration * Hammer Suit: Throws hammers
