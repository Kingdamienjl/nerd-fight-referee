    - field: speed
      value: 'MFTL+ (Can be seen dodging lightning in the Mario & Luigi games, consistently
        evading lasers and other high-velocity projectiles. His reflexes extend to
        reacting to and moving faster than energy-based assaults, often operating
        on a scale beyond conventional physical limits. In Super Mario Galaxy and
        its sequel, Mario travels between planets and galaxies in seconds, demonstrating
        genuine faster-than-light travel capabilities. When piloting the Star Diver
        in Mario & Luigi: Paper Jam, he maneuvers at approximately Mach 375 while
        simultaneously dodging attacks. In Mario & Luigi: Superstar Saga, Mario dodges
        Cackletta''s lightning attacks with precision, showing massively hypersonic
        reaction times. In Paper Mario: The Thousand-Year Door, he reacts to celestial
        attacks that cross vast cosmic distances nearly instantaneously. During his
        battle with Count Bleck and Super Dimentio in Super Paper Mario, he demonstrates
        dimensional travel speeds, moving between planes of existence in moments.
        In Mario Party 5, he keeps pace with objects moving through the Dream Depot,
        which connects multiple dream universes. Mario has also outpaced meteors in
        various games, which travel between celestial bodies in seconds. Additionally,
        his traversal across multiple dimensions and timelines in titles like Super
        Paper Mario and Mario & Luigi: Dream Team further emphasizes his superluminal
        movement capabilities. When empowered by cosmic artifacts like the Pure Hearts
        or Star Spirits, his speed increases even further, allowing him to move effectively
        in environments where conventional physics and space-time operate differently,
        can even outswim a black hole)'
      source_id: character-stats-profiles-mario-classic
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: 'High Hyperversal to Low Outerversal (Mario has withstood and survived
        attacks and environments that affect entire universes and realities. His resilience
        is demonstrated through battles against cosmic and reality-warping entities
        such as Super Dimentio, Count Bleck, and the Shadow Queen, each capable of
        universal to outerversal-level destruction and reality manipulation. Mario''s
        durability extends to surviving the collapse and reshaping of dimensions,
        as well as enduring powerful magical and elemental attacks that surpass typical
        physical limitations, firmly placing him between the low tiers of hyperversal
        and outerversal durability. He''s even been able to travel through the Dream
        Depot, Subcon, and other forms of dimensional travel. In Super Mario Galaxy,
        he survived the collapse and recreation of the entire universe, demonstrating
        his ability to withstand cosmic-scale events. When facing the Void in Super
        Paper Mario, he endured its reality-erasing properties that were consuming
        all dimensions and planes of existence. Mario withstood direct attacks from
        the Chaos Heart, an artifact capable of destroying all worlds and dimensions.
        He survived being blasted interdimensionally from The Void to Flipside, showing
        his resilience against forces that transcend conventional space-time. In Paper
        Mario: The Thousand-Year Door, he endured attacks from the Shadow Queen who
        could reshape reality at will and created the Crystal Stars which contained
        the essence of the heavens. When facing Dreamy Bowser in Mario & Luigi: Dream
        Team, he withstood attacks from an entity who had absorbed the Dream Stone,
        which contained countless dream universes. In Super Paper Mario, he survived
        being sent to the Underwhere (the Mario universe''s afterlife) and returned,
        demonstrating resilience against death itself. When powered by the Pure Hearts,
        his durability increased to the point where he could withstand attacks from
        Super Dimentio, who had transcended all dimensional limitations. Mario has
        also demonstrated immunity to conceptual attacks when properly equipped, such
        as resisting fate manipulation from the Dark Prognosticus. His durability
        transcends conventional physical and dimensional limitations, allowing him
        to operate in environments where the fundamental laws of reality differ from
        normal space-time, including higher planes of existence like The Overthere.
        This consistent pattern of surviving attacks from entities that threaten multiple
        dimensions and planes of existence firmly establishes his durability at High
        Hyperversal to Low Outerversal levels)'
      source_id: character-stats-profiles-mario-classic
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Limited Long-Range Combat, Dependence on Items and External Magic, Vulnerability
        to Status Effects, Limited Strategic Planning, Power-Up Time Limits, Reliance
        on External Guidance Core Techniques: * Jump: Mario''s signature move, can
        damage most enemies by landing on them * Long Jump: Extended horizontal leap
        covering greater distance * Triple Jump: Three consecutive jumps of increasing
        height * Wall Jump: Rebounds off walls to reach higher areas * Backflip: High
        vertical jump performed from a standing position * Ground Pound: Mid-air downward
        slam that breaks blocks and damages enemies * Spin Jump: Rotating jump that
        allows Mario to bounce off certain hazards * Side Somersault: Quick sideways
        flip for evasion and positioning * Cap Throw: Throws Cappy to hit distant
        enemies or capture them * Cap Jump: Bounces off thrown cap for extra height
        and distance * Dolphin Dive: Fast forward dive that can be performed underwater
        or on land * Tornado Spin: Rapid spinning attack from Super Mario Galaxy *
        Dive: Forward diving move for quick movement * Roll: Fast rolling maneuver
        for quick traversal and dodging * Crouch Jump: Lower jump with reduced hitbox
        for tight spaces * Cappy Capture: Takes control of enemies and objects by
        throwing his cap at them * Cappy Homing Throw: Targets enemies automatically
        with cap throw * Upward Cap Throw: Throws cap upward to hit aerial enemies
        * Downward Cap Throw: Throws cap downward for ground enemies * Spin Throw:
        Spinning throw that hits enemies in a circular area * Handstand Jump: Jump
        performed from a handstand position * Somersault: Forward flip for mobility
        and attack * Breakdance Sweep: Spinning low attack that hits surrounding enemies
        * Backward Somersault: Backward flip for evasion and positioning * Flutter
        Jump: Extended hover after jump (with certain power-ups) * Spin Drill: Drilling
        motion that can pierce through certain surfaces * Gravity Jump: Special jump
        that changes gravity direction in certain areas Power-Up Transformations:
        * Super Mushroom: Increases size and grants an extra hit point * Fire Flower:
        Grants pyrokinesis through fireballs * Ice Flower: Enables cryokinesis through
        ice balls that freeze enemies * Gold Flower: Transforms enemies and objects
        into coins * Penguin Suit: Grants ice powers and improved swimming ability
        * Super Acorn: Transforms into Flying Squirrel Form for gliding * P-Acorn:
        Grants unlimited Flying Squirrel flight * P-Wing: Provides unlimited flight
        for a level * Propeller Mushroom: Enables high vertical propeller jumps *
        Super Bell: Transforms into Cat Mario with climbing and scratching abilities
        * Double Cherry: Creates multiple copies of Mario * Super Leaf: Transforms
        into Raccoon Mario with tail attacks and limited flight * Tanooki Suit: Full
        raccoon abilities plus statue transformation * Frog Suit: Enhances swimming
        abilities and underwater movement * Boomerang Flower: Throws boomerangs that
        collect items and damage enemies * Super Star: Temporary invincibility and
        increased speed * Mega Mushroom: Giant growth with invincibility and destruction
        abilities * Mini Mushroom: Shrinks Mario, allowing access to small passages
        and water walking * Rock Mushroom: Transforms into a boulder for rolling attacks
        * Cloud Flower: Creates cloud platforms and enables limited flight * Spring
        Mushroom: Transforms into a spring for high bounces * Boo Mushroom: Transforms
        into Boo Mario with intangibility and flight * Bee Mushroom: Transforms into
