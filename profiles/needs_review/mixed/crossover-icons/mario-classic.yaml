    - field: attack_potency
      value: 'Low to High Hyperversal (Mario can injure Dreamy Bowser, who has absorbed
        the Dream Stone, granting him power over an infinite number of dimensions.
        The Dream Stone contains the power of countless dreams, with each dream being
        its own universe with unique space-time, effectively making Dreamy Bowser
        a multidimensional entity), High Hyperversal (Was capable of harming Super
        Dimentio, who is a force capable of erasing all worlds, dimensions, timelines,
        and possibilities. Mario defeats him, indicating that Mario''s power surpasses
        this level of reality-warping. Super Dimentio had merged with the Chaos Heart,
        which was stated to be capable of destroying all existence including higher
        planes like The Overthere), Low Outerversal (Capable of harming Shadow Queen
        in Thousand Year Door, who was an ancient demon with the power to manipulate
        and reshape reality itself. She created the Crystal Stars, artifacts that
        hold the essence of the heavens and possess the ability to remake the planet
        according to her will. With the Pure Hearts, Mario transcended conventional
        dimensional limitations, gaining power that exists beyond the multiverse itself
        and operates on a conceptual level, allowing him to counter the Chaos Heart
        which threatened the fundamental structure of all reality. Mario has also
        interacted with and affected Platonic concepts that exist in his universe,
        as evidenced by references to Plato''s "The Republic" being canonical truth
        in his world, suggesting he can affect abstract, aspatial and atemporal Forms
        when at his peak power), Outerversal (When wielding the Star Rod after it
        was empowered by the wishes of Princess Peach and the Star Spirits, Mario
        was able to defeat Bowser who had harnessed cosmic wish-granting power capable
        of reshaping the fundamental laws of reality. In Paper Mario: The Origami
        King, Mario was able to defeat King Olly, who had the power to fundamentally
        transform the nature of reality itself by folding the very fabric of existence,
        transcending conventional dimensional limitations. Mario has consistently
        demonstrated the ability to defeat entities that operate beyond standard dimensional
        physics, placing him firmly in the outerversal category when at full power)'
      source_id: character-stats-profiles-mario-classic
      provider_id: character_stats_profiles
      authority: high
