      value: At least Gifted. |-|General= As the ruler of Mushroom Kingdom, Peach
        has retained vast amounts of knowledge about its history and artifacts, such
        as the [https://youtu.be/dirMrpwDxK8?list=PL-NDBvF6NZ8_9hwcjmVVfSsQztobpSzv1&t=839
        the Dark Star]. Even when captured sometimes, [https://youtu.be/2fj0AzxGX5M?t=87
        she'll send informative letters about enemies that either Mario and/or Luigi
        may encounter]. [https://youtu.be/xNxRP7SJxzM?t=546 She has] [https://youtu.be/A9XOoaN_biw?t=236
        also shown] [https://youtu.be/8xEl2QcWNMU?t=76 great competency] [https://youtu.be/z5WjyheOJv4?t=125
        in a] [https://youtu.be/T5q69hpB1pQ?t=104 variety of] [https://youtu.be/ZhY7eLoMfIQ?t=384
        sports] [https://youtu.be/5-QMdOmxwOc?t=9 and is shown to be capable of taking
        on a doctor's role]. [https://youtu.be/scT6TmJMJ-0?t=10 Even as a baby]. [https://youtu.be/8b9-1K3r80I?t=1009
        Peach has also strategically aided her party in besting both forms of Culex
        alongside other members of her party], who is a timeless overlord made of
        pure evil [https://youtu.be/8b9-1K3r80I?t=1077 that was capable of constantly]
        [https://youtu.be/8b9-1K3r80I?t=923 one-shotting members of the party during
        their fight], [https://imgur.com/a/BS6TzOO and was the strongest enemy to
        oppose them at that point.] |-|Combat= While not necessarily as much of a
        skilled fighter as Mario, Peach has still shown herself to be in a comparative
        league. Notable examples including [https://youtu.be/Epn4GcMwkgc?t=130 her
        defeating the likes of King Boo], who'd regularly capture Mario within his
        paintings, [https://youtu.be/GYIjvFY3mqo?t=351 and Bowser], a longtime nemesis
        of Mario who has amassed entire armies on an even galactic scale in the past
        and [https://youtu.be/Utvj76F07C8?t=7 can occasionally gain the upper-hand
        on the latter]. [https://youtu.be/BaaPwQ_H7vY?t=302 And Jinx], a dojo sensei
        and master martial artist [https://youtu.be/mwAq8OWJvUk?t=538 who committed
        every move of the party's to memory].
