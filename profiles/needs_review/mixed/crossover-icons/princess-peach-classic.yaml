        \ and bend her energy into multiple attacks. **Sphere: Peach forms a sphere\
        \ of energy above her head, and throws it at her foe, which then homes in\
        \ on the foe. The sphere can sometimes split into multiple, which all then\
        \ home in on the foe. **Weapon: Peach forges a weapon of pure energy. Most\
        \ notable is a hockey stick, which she can use to smack foes with. *Royal\
        \ Gaze: The second Peach lays eyes on someone, her reaction speed multiplies\
