    - field: weaknesses
      value: 'Normally extremely pacifistic and a bit too gentle and kind for her
        own good, which prevents her from fighting back and actually using her powers
        and skills most of the time. However, her Ensembles in Princess Peach: Showtime
        ignore this weakness completely {| class="mw-collapsible mw-collapsed" align="center"
        border="1" cellpadding="1" cellspacing="1" style="width:100%" | colspan="2"
        style="text-align: left; |Notable Attacks and Techniques: |- | |-|Common Attacks
        and Techniques= {{#tag:tabber| -Physical Attacks= peach slap glove.png|Slap
        Glove peach parasol move.png|Parasol peach war fan.png|War Fan peach frying
        pan.png|Frying Pan 8jikny.gif|Royal Strike princess kiss.gif|Princess Kiss
        Slap: Peach''s most common method of attack, should she opt for getting physical
        with her foes. Parasol: A weapon just a grade above her normal slap attacks.
        Outside of slapping, the Parasol is Peach''s preferred method of attack with
        weapons. War Fan: An intermediate weapon between Parasol and Frying Pan. Peach
        can time her attack just right to swing it horizontally for further damage.
        Frying Pan: Peach''s most powerful weapon within Super Mario RPG. Royal Strike:
        Peach''s Super Strike. She charges herself with pink-like energy then drill
        kicks the target, leaving a heart trail after the strike. Princess Kiss: Peach
        jumps up as she sprouts wings and a giant crown that looks like a halo. She
        curls up in a protective position before releasing a flash from her wings
        launching the ball towards the goal with maximum speed. This has a re-entry
        effect. - Magic= therapy peach.gif|Therapy come back peach.gif|Come Back mute
        power peach.gif|Mute sleepy time peach.gif|Sleepy Time psych bomb peach.gif|Psych
        Bomb Magic: Unbeknownst to many of her peers, Peach possesses the ability
        to use magic. Its potency being powerful enough to warrant precautionary measures
        by Bowser during his takeover in Super Mario Bros., and the apprehension by
        Fawful, who needed her power to unseal the Dark Star. *Therapy: Heals herself
        or allies and removes negative status conditions. *Come Back: Revives a fallen
        ally. *Mute: Disable her opponent''s moves and powers. *Sleepy Time: Puts
        her opponents to sleep. *Psych Bomb: Causes a rain of bombs to shower all
        over her opponents to deal massive damage. *Wishing Power: A unique power
        that can be used to strengthen or weaken beings. It can also be converted
        into other powers such as telekinesis or a pink laser. - Vibes= vibes in spp.jpg|Vibes
        joy spp.png|Joy rage spp.png|Rage gloom spp.png|Gloom calm spp.png|Calm Vibes:
        Vibes are emotions forced on any living thing appearing in the game Super
        Princess Peach. In this title, as the playable character, Princess Peach can
        freely use one of four of types of vibe: Joy, Rage, Gloom, and Calm. *Joy:
        Joy is one of Peach''s vibes in Super Princess Peach. It allows Peach to fly
        in the air and reach high platforms. However, in some areas of the game, she
        is unable to use it as wind will stop her, or else she would be able to skip
        a puzzle in the level. *Rage: Rage is one of the vibes that Princess Peach
        can use during the events of Super Princess Peach. While active, fire will
        appear all over Peach, making her invincible and destroying anything that
        she touches as well as scaring away a flock of Fangs. It also lights up dark
        areas, lights lamps, fuels hot-air balloons, and pushes down switch buttons,
        springs in the battle against Wiggler, and angry-faced rocks. However, Peach
        will not be able to jump very high. *Gloom: Gloom is one of the vibes that
        Princess Peach can use in Super Princess Peach, which causes her to start
        crying. Her tears turn into strong spouts, which can be used to grow plants
        and spin water wheels. Her streaming tears sparkle when they hit the ground,
        the wall or the ceiling. She can also run faster and jump higher, allowing
        her to cross blue Donut Blocks and outrun a fast-moving swarm of Blindfold
        Boos. It is used to defeat some bosses such as Petey Piranha. She can also
        use this to strike a cluster of fragile blocks all at once. *Calm: Calm is
        one of Princess Peach''s vibes in Super Princess Peach. When activated, it
        will gradually restore Peach''s HP. Peach can move around normally while the
        vibe is in effect. The process stops when she reaches her maximum HP, depletes
        the Vibe Gauge, or is attacked by an enemy. The vibe cannot be activated when
        Peach is at full health. - Other Techniques= ground pound plumber.jpg|Mario
