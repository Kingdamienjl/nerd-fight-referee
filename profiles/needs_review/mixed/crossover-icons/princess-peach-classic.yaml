    - field: weaknesses
      value: 'Normally extremely pacifistic and a bit too gentle and kind for her
        own good, which prevents her from fighting back and actually using her powers
        and skills most of the time. However, her Ensembles in Princess Peach: Showtime
        ignore this weakness completely {| class="mw-collapsible mw-collapsed" align="center"
        border="1" cellpadding="1" cellspacing="1" style="width:100%" | colspan="2"
        style="text-align: left; |Notable Attacks and Techniques: |- | |-|Common Attacks
        and Techniques= {{#tag:tabber| -Physical Attacks= peach slap glove.png|Slap
        Glove peach parasol move.png|Parasol peach war fan.png|War Fan peach frying
        pan.png|Frying Pan 8jikny.gif|Royal Strike princess kiss.gif|Princess Kiss
        Slap: Peach''s most common method of attack, should she opt for getting physical
        with her foes. Parasol: A weapon just a grade above her normal slap attacks.
        Outside of slapping, the Parasol is Peach''s preferred method of attack with
