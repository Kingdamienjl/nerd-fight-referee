    - field: attack_potency
      value: "At least Small Building level+ (As a direct reincarnation of the Isu\
        \ Odin with incredibly high-enough concentrations of Isu DNA to be able to\
        \ easily handle the Yggdrasil supercomputer and understand all of its functions\
        \ and work mechanisms, she should easily be equal in strength to other Sages\
        \ like Bartholomew Roberts, Fran\xE7ois-Thomas Germain, direct Isu descendants\
        \ like Kassandra, Alexios and Pythagoras, and should at least be comparable\
        \ to the Isu themselves in terms of physical and combat prowess. Also traded\
        \ blows with and fought a lengthy battle against the Abbasid Hidden One Basim\
        \ Ibn Ishaq, another Norse Isu Sage and the direct reincarnation of Loki,\
        \ who could easily leap several meters into the air and shouldn't be much\
        \ weaker than his Staff of Hermes-equipped self, who in turn would be at the\
        \ very least equal to Layla Hassan. Later holds her own against Kassandra\
        \ in the crossover stories DLC,Assassin's Creed Valhalla (2020)- A Fated Encounter:\
        \ Tossing and Turning effectively stalemating each other, Kassandra later\
        \ further complimented Eivor to be quite strong, with Eivor herself stating\
        \ that she had Kassandra effectively cornered in their first fight, with Kassandra\
        \ herself later stating that she and Eivor were of similar strength, based\
        \ on their resistance to the Piece of Eden wreaking havoc on the Isle of Skye\
        \ but not affecting them, confirming it again by later saying that their first\
        \ fight had \"taken a lot out of her\" and that she wasn't sure if she was\
        \ ready for a second fight, with Eivor herself complimenting Kassandra to\
        \ have \"kept her on her toes as well\")"
      source_id: vsbattles-pit-anime-crossover-icons
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: Hypersonic (Can easily catch arrows in mid-flight with her bare hands
        while being mere centimeters away from the arrow-tip, and then shoot them
        back at her foes, and many of her bosses, especially Kjotve the Cruel and
        other high-ranking Zealots of the Order of the Ancients, who are much taller
        and bulkier than her, can do the same feat as her, with Eivor easily managing
        to best them in combat. Can also keep up with Basim, who can replicate the
        same feats as her to a much greater degree and from even closer distances
        from the bow), higher with speed amps (Can move much faster than her base
