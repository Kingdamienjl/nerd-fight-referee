    - field: powers_and_abilities
      value: 'right|236x236px Pit can use Powers in battles for different effects
        like shooting massive lasers, turning enemies into eggplants, barriers, boosting
        his speed, strength or durability, etc. But every power has a time limit on
        its use and a limited number of uses. Some notable Powers include: * Aries
        Armor: Pit greatly reduces the amount damage he takes from oncoming attacks
        while also protecting him from any status or knockback effects. * Autoreticle:
        Pit automatically locks onto foes, preventing him from losing sight of them
        and making him more accurate. * Black Hole: Pit generates a massive gravity
        well that draws foes in, nullifying their freedom of movement if they are
        not able to escape in time. * Blind: Pit blinds all nearby enemies. * Bumblebee:
        Pit vanishes into thin air to dodge oncoming attacks before reappearing behind
        his opponent while priming an attack. * Brief Invincibility: A power that
        renders Pit invulnerable to any form of damage for a few seconds. * Counter:
        Pit eliminates the knockback effect of enemy attacks and automatically counters
        any attack he receives for a limited amount of time. * Effect Recovery: Pit
        dispels status effects like poison and paralysis. * Eggplant/Tempura Attack:
        Pit''s next attacks temporarily convert the opponent into an eggplant or piece
        of tempura with legs, leaving them unable to do anything but run away. * Explosive
        Flame: Pit unleashes a powerful fireball that erupts into a massive explosion.
        * Health Recovery: Pit quickly heals his minor wounds. * Idol Transformation:
        After he spends enough time weakening an opponent, Pit can turn them into
        an inanimate idol, effectively killing them. * Instant Death Attack: After
        activation, Pit''s attacks have the ability to instantly kill those that aren''t
        resistant to such abilities. * Interference: Pit plants a beacon that disrupts
        the powers of his foes, preventing them from using their special powers. *
        Invisible Shots: Pit''s attacks become invisible. * Libra Sponge: After activation,
        Pit gains attack power proportional to the damage he receives while this ability
        is active. * Mega Laser: Pit unleashes a powerful laser with a wide area of
        effect and extremely long range, dealing heavy damage to any foes caught in
        its path. * Meteor Shower: Pit causes a deluge of shooting stars to reign
        down on his foes to crush and burn them. * Petrify Attack: Pit''s next attacks
        temporarily petrify the target, rendering them incapable of fighting back.
        * Pisces Heal: Pit quickly recovers from an attack that would have otherwise
        finished him. * Playing Dead: Pit temporarily stops his vital signs and masks
        his presence, feigning death in the process. He is then able to get up and
        become completely invisible and intangible to sneak up on targets. * Power
        Thief: After activation, Pit''s next attacks can temporarily steal the powers
        of others, allowing him to use them for a limited time. * Quick Charge: Pit
        greatly increases the rate at which his weapons charge, allowing him to fire
        them off far more rapidly than normal. * Reflect Barrier: Pit generates a
        barrier that reflects any incoming projectile, but he can still shoot his
        own projectiles through it. * Slip Shot: Pit enhances his attacks to pass
        through walls. * Transparency: Pit turns transparent, becoming invisible to
        the naked eye. * Warp: Pit teleports to a nearby location. * Weaken Attack:
        Pit halves his opponent''s effective maximum health, dealing heavy damage
        that will not heal. * Weak-Point Reticle: Pit instantly locates and locks-on
        to weak points in his opponent''s equipment and defenses. Eggplant-attack-kid-icarus.png|Eggplant
        Attack Explosive-flame-kid-icarus.png|Explosive Flame Mega Laser.jpeg|Mega
        Laser Meteor-shower-kid-icarus.png|Meteor Shower ReflectBarrier.jpg|Reflect
        Barrier * Special Attacks: Pit is able to use various special techniques after
        spending enough time in combat, unleashing devastating attacks that deal massive
        damage to all foes in Pit''s line of sight and shooting down all incoming
        projectiles to ensure the attack''s completion. Armspecialattack.jpg|Special
        Attack with Arm Weapons Bladespecialattack.jpg|Special Attack with Blades
        Bowspecialattack.jpg|Special Attack with Bows Clawspecialattack.jpg|Special
        Attack with Claws Orbitarsspecialattack.jpg|Special Attack with Orbitars Palmspecialattack.jpg|Special
        Attack with Palm Weapons Pit Angel Ring.gif|Angel Ring Palutena''s Army Final
        Smash.gif|Palutena''s Army * Angel Ring: Pit''s Side Special Attack in Super
        Smash Bros. Brawl, he rapidly spins Palutena''s Bow in his hands, stunning
        and continuously dealing damage to foes and deflecting oncoming projectiles.
        * Palutena''s Army: Pit''s Final Smash in Super Smash Bros. Brawl, which was
        later referenced in Kid Icarus: Uprising. Pit summons the centurions of Palutena''s
        Army as a giant projection of Palutena''s likeness appears in the distance.
        Dozens of centurions will then swarm his foes, ramming into Pit''s targets
        at high speeds to deal heavy damage and knockback but'
