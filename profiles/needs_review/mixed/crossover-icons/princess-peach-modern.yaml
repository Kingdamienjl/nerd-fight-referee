    - field: intelligence
      value: ''''''' ''''''[[Genius Intelligence|Genius]]'''''', likely ''''''[[Genius
        Intelligence|Extraordinary Genius]]'''''' (Although mostly known as a [https://youtu.be/p1eq-ITfUBA?t=5547
        plumber], Mario is a genuine polymath whose knowledge and practical mastery
        spans an unusually wide range of subjects and disciplines, several of which
        already exceed ordinary real-world human limits, so he can excel in white-collar
        occupations, including physician and CEO of a highly successful toy company.
        Because of this breadth, he''s excelled in numerous sports such as [https://youtu.be/h2gTSZEjEGA?t=403
        basketball]Mario Sports Mix, [https://youtu.be/e35ENwUi8Mo?t=556 soccer]Super
        Mario Strikers, [https://youtu.be/QtUHRYpXjGE?t=6736 tennis], [https://youtu.be/jhuxhb5mrvc?t=412
        golf], [https://youtu.be/I06Dfm3z5W4?t=225 baseball], [https://youtu.be/SCQ2UoMmDNo?t=285
        bike riding], [https://youtu.be/DMemGcYvpW0?t=90 football], [https://youtu.be/0zOf4HSfWQ0?t=298
        hockey], [https://youtu.be/0T5vWcSpJEY?t=340 dodgeball], [https://youtu.be/dG_06S2harg?t=171
        rifleman], and [https://youtu.be/7LACr-H0bNc?t=442 driving], and has taken
        up careers including [https://youtu.be/UBHJhla8TO4?t=9 carpentry], [https://youtu.be/-7F-7MtkHD0?t=14
        construction/demolition], [https://youtu.be/AbKUA7pb5RQ?t=42 soldier], [https://youtu.be/J3QKdt1Lvn4?t=127
        brewery worker], [https://youtu.be/RlJ4YKsyZ3g?t=240 cement factory worker],
        [https://youtu.be/UCFZDa4Gmyg?t=156 artist], [https://youtu.be/HRR78fLJcmI?t=43
        referee], [https://youtu.be/GN8Fydge0nw?t=116 archaeologist], [https://youtu.be/eltR6LUsEuc?t=7
        chef], [https://youtu.be/zxhNV1lM37E?t=19 animal trainer], [https://youtu.be/3e4Qgl2e_T0?t=1870
        pilot], and [https://youtu.be/3e4Qgl2e_T0?t=752 submarine captain]. He can
        do a variety of things like [https://imgur.com/7i2IxiI play the guitar]Super
        Mario Odyssey, [https://imgur.com/PUjKUfP quickly repair a clear pipe with
        Luigi], and [https://imgur.com/xgXdzQ8 pilot a helicopter capable of lifting
        a giant gold statue of Peach]. As Dr. Mario, he could formulate his own megavitamins/pills,
        which are said to cure anything, including the colored viruses, which are
        lethal enough that a Shayde in Super Paper Mario claimed to have died from
        them. These same megavitamins were sought by a scientist, researcher, robotics
        engineer, and archaeologist, as well as [https://www.mariowiki.com/Mad_Scienstein
        Mad Scienstein], who needed them to treat a cold [https://youtu.be/Z8xsZPRj5mY?t=1962
        that he himself could not cure]. On the engineering side, Mario designed [https://youtu.be/GmOJN-zq6yg
        functioning robots] as far back as Donkey Kong Junior and later created the
        Mini-Marios, autonomous units that [https://youtu.be/6QzQ_G9ME3s?t=681 fight
        Donkey Kong and other enemies] throughout the Mario vs. Donkey Kong series.
        He also displays abnormal linguistic understanding with species such as [https://youtu.be/oVFqOQ4Yclw?t=138
        Yoshis], [https://youtu.be/HfkZtwKWqCI?t=480 Chain Chomps], and [https://youtu.be/IzhuT8MHWtI?t=87
        Shroobs], who don''t speak like the Mario Bros. or other human characters.
        Mario should have learned the Yoshi language through a lifetime of close contact
        with them, since nothing indicates that they formally taught it to him. Despite
        interacting with Chain Chomps almost exclusively in combat, he can still parse
        meaning from their combat utterances. Since the Shroobs only ever fought him,
        he understood a complex dead language after hearing only a few phrases across
        several days of battle. Beyond ordinary vehicles and aircraft, he has operated
        weaponized mechs, [https://www.youtube.com/watch?v=7TqDdENYbTg&t=918s cars],
        [https://www.youtube.com/watch?v=MfvMI7tb25Q&t=1647s spaceships while avoiding
        meteors], [https://www.youtube.com/watch?v=shzHRML9-sI&t=1061s bobsleds] [https://www.youtube.com/watch?v=7TqDdENYbTg&t=1791s
        down icy paths], [https://www.youtube.com/watch?v=c-ki9KoViuc&t=2117s a Koopa
        shell sled across an icy track], [https://www.youtube.com/watch?v=7TqDdENYbTg&t=96s
        tanks], and [https://www.youtube.com/watch?v=7G-uJAmqzRA&t=15961s various]
        [https://youtu.be/X8ZQueu40qs?t=2282 other vehicles] and [https://www.youtube.com/watch?v=LHJ2W7ryJuo&t=1500s
        unconventional aircraft]. Mario is also an experienced fighter and expert
        combatant who has battled and defeated a diverse array of foes using magic,
        unnatural powers, wildly different technologies, and multiple fighting styles.
        That expertise extends back to infancy, when he was already capable of piloting
        vehicles, skillfully using power-ups and weapons, and confronting an entire
        alien race that invaded his planet. He expertly utilizes a wide array of tools
        and weapons, including [https://youtu.be/Ip5oAXDsPVs?t=243 hammers], [https://youtu.be/g-QARJAvqmM?t=39
        swords], [https://youtu.be/30DyYkoNH9Q?t=50 Koopa Shells], [https://youtu.be/GmOJN-zq6yg?t=17
        robots], [https://youtu.be/yohLgD_bvYU?t=894 blasters], and more, with the
        Hammer as his greatest specialty. He has defeated [https://www.mariowiki.com/Jinx
        Jinx], a dojo sensei and master combatant who challenges him up to three times
        at increasing difficulty; Jinx was so impressed that he [https://youtu.be/MqXudczFB8U?t=565
        incorporated Mario''s fighting style into his training], renamed his dojo
        after the plumber, and made Mario the master. Alongside Luigi, he can also
        fight [https://www.mariowiki.com/Bowser_Memory_ML Bowser Memory M and Bowser
        Memory L], identical copies of the Bros. as Bowser "fondly" remembers them.
        In addition, after [https://youtu.be/mMVedbY2wJo?t=407 quickly mastering the
        Firebrand] and [https://youtu.be/HivgbWsOrOc?t=267 learning and mastering
        Bros. Moves in a short timespan] with Luigi, he can [https://youtu.be/jb6PsdSs64k?t=26
        immediately apply that knowledge in combat], and then [https://youtu.be/kkU0JxDQU0M?t=19
        improved the techniques further] [https://youtu.be/GmYcs0KbW5k until their
        properties changed entirely], and has also [https://youtu.be/dRDZxYwBe48?t=406
        been trained specifically to uncover hidden talents and powers]. He outsmarted
        archaeologists and scientists on Pi''illo Island by solving the mystery that
        had left them stumped, [https://youtu.be/HxJrKVcti0E?t=186 navigated the Forest
        of Illusion, which was stated to require using his brain to solve its most
        perplexing puzzles]Super Mario World, and has completed trials such as The
        Perfect Run, Tubular, The Impossible Pack, and similar challenges in which
        he cannot take a single hit. Thanks to his telepathic bond with Luigi as an
        infant, Mario was able to lead the Yoshis to the place where his brother was
        kidnapped, and even at such a young age, he is capable of performing most
        of the aforementioned feats as well as ones of similar magnitude. Overall,
        Mario''s various accomplishments have made him famous worldwide)'
