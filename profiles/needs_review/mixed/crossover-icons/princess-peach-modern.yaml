        |-|Common Attacks/Techniques= {{#tag:tabber| -Jump= Mario jump.png|Mario is
        well renowned for his jumps, using it for multiple situations. double jumping
        mario.png|The Double Jump. sm64 triple jump.gif|Mario performing the Triple
        Jump. 106px-Expanded Triple Jump SM64.gif| An advanced version of the triple
        jump that makes Mario invincible. Mario spin jump.gif|The Spin Jump allowing
        Mario to cross certain hazards. Mario spin jump 2.gif|Mario using the spin
        jump to attack his opponent. Mario sunshine spin.gif|Mario using his spin
        with FLUDD to shoot water in multiple directions. super jumping mario.png|The
        Super Jump. ultra jumping mario.png|The Ultra Jump. Mario blazing wall jump.gif|A
        wall jump technique Mario can perform without any walls. Jumping: The standard
        Jump is Mario''s most commonly used move. While it was originally only used
        to evade obstacles in the original Donkey Kong game, it has been Mario''s
        primary method of attacking since Super Mario Bros. Depending on the type
        of game, Mario and other characters jump for a variety of different purposes:
        *Jump: When Mario performs an ordinary jump, he makes a fist in the air and
        splits his legs at the same time. In the early games, Mario keeps his legs
        split when landing on enemies to stomp them. In later games, Mario commonly
        lands on enemies using his boots. *Double Jump: The Double Jump is a move
        useable by every playable character in the Super Mario series since Super
        Mario 64, used to gain a higher altitude. This move is incorporated into the
        Triple Jump *Triple Jump: The Triple Jump is a special move used in the Super
        Mario games since Super Mario 64 (except Super Mario 3D Land, Super Mario
        3D World, and Super Mario 3D World + Bowser''s Fury). This jump is even higher
        than the Double Jump, and Mario front-flips during it. With Mario, there is
        a special addition to the Triple Jump. Should Mario perform the Triple Jump
        successfully, the third consecutive jump will render him invincible during
        its duration. *Spin Jump: Mario spins while jumping, allowing him to jump
        on spiky enemies and hazards such as buzzsaws. This move can also allow Mario
        to hover, slowly descend, deflect projectiles, and clear fogs and smoke. Using
        this move with the Fire or Ice Flower with make Mario scatter fireballs or
        ice balls in multiple directions. *Super Jump: The Super Jump is a special
        attack used by Mario in Super Mario RPG: Legend of the Seven Stars. He learns
        the attack at Level 6. When Mario uses his Super Jump, he can jump on one
        enemy multiple times. If the player does a Timed Hit right before Mario stomps
        the enemy, Mario keeps jumping until the player makes a mistake or they hit
        100 consecutive jumps. Super Jump uses 7 FP and has a Magic Power rating of
        45. *Ultra Jump: Ultra Jump is Mario''s fifth magic attack in Super Mario
        RPG: Legend of the Seven Stars. It is more powerful than Mario''s Super Jump
        and it can attack multiple enemies. *Blazing Wall Jump: Mario''s special move
        where he can execute wall jumps without any walls. - Hammer= Mario hammer.gif|Mario''s
        main weapon. He is highly proficient with the hammer. Mario hammer dizzy.gif|Mario
