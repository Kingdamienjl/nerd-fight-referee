  speed:
    text: "Massively FTL+ (Stated that his speed is \"second to none\"In-game Jpn.\
      \ pause description \xB7 Kirby's Return to Dream Land / \"unrivaled\"Official\
      \ Kirby's Return to Dream Land Deluxe microsite / \"unmatched\"In-game Jpn.\
      \ pause description \xB7 Kirby's Return to Dream Land Deluxe in the context\
      \ of an adventure alongside Kirby, King Dedede & Bandana Dee; Their Travel,\
      \ Reaction & Combat Speeds are otherwise shown to be comparable there. His flight\
      \ and reactions could keep up with Warp Stars. * In Kirby Air Ride his flight\
      \ can keep up with Warp Stars and other comparable vehicles during races where\
      \ the participants can attack each other, tagging each other or dodging those\
      \ attacks. * In the Meta Knightmare Ultra sub-game of Super Star Ultra he can\
      \ go on some of the same adventures as Kirby, replacing Kirby's use of Warp\
      \ Stars for his own flight, maneuvering at seemingly equal speeds. * In Kirby's\
      \ Return to Dream Land & Kirby's Return to Dream Land Deluxes opening he briefly\
      \ kept up with a Warp Star. Though it might not have flown at full speed.; Can\
      \ quickly react, dodge obstacles, and attack foesKirby Air Ride while flying,\
      \ and keep up with those who can react, dodge, ride, clash and keep up with\
      \ him while flying, if commonly their Travel Speed on the ground is slightly\
      \ inferior. Himself can do those things alongside or against alternative Meta\
      \ Knights flying, and keep up with opponents who do the same. Quickly able to\
      \ fly from a planetoid near Nova's summoning point, at galaxy's end, back to\
      \ Popstar, which is at the edge of the universe. Shown flying at faster than\
      \ light speeds several times. Repeatedly outran \"Dimensional Walls,\" space\
      \ waves which were consuming interstellar parts of Another Dimension,See the\
      \ AP of Magolor Soul or the Master Crown. These space waves were only consuming\
      \ interstellar parts in the context of what was outrun, regardless of the scale\
      \ of the whole feat. which were moving fast enough to get past stars & nebulae\
      \ in the backgroundInter-dimensional rift areas \xB7 Kirby's Return to Dream\
      \ Land & Kirby's Return to Dream Land Deluxe, as well as keeping up with a flying\
      \ Lor Starcutter and Landia in the time a fainted Kirby woke up & they all escaped\"\
      Each to His Own World\" cutscene \xB7 Kirby's Return to Dream Land & Kirby's\
      \ Return to Dream Land Deluxe. Kept up in combat against the latter two and\
      \ Magolor EX; Drew his sword against Phase 1 Magolor while riding a Landia flying\
      \ across Another Dimension's Road\"Final Battle EX\" cutscene \xB7 Kirby's Return\
      \ to Dream Land & Kirby's Return to Dream Land Deluxe, meaning that he was really\
      \ to face Magolor like that and was reacting to the obstructed flight Landia\
      \ just took while passing by stars & nebulaeLevel 8: Another Dimension \xB7\
      \ Kirby's Return to Dream Land & Kirby's Return to Dream Land Deluxe. In side\
      \ content, which shows what Kirby and other characters can do, he can keep up\
      \ with & dodge projectiles from several types of Doomers empowered by the Master\
      \ Crown previously shown in their regular state to keep up with & obstruct Landia\
      \ as he flew across Another Dimension's Road, and he can defeat Crowned Doomer,\
      \ the tyrant boss of the Doomers who should be comparable to those types of\
      \ DoomersThe True Arena \xB7 Kirby's Return to Dream Land Deluxe. Comparable\
      \ to, and can join, the Star Allies who chased and kept up with Jamba Heart\
      \ pieces multiple times, which were suddenly scattered across the galaxy from\
      \ its edge. Can react riding a Friend Star for travel & in combat, when that\
      \ vehicle is made by the energies & \"the collective power of Kirby and Friends\"\
      KIRBY STAR ALLIES THE ORIGINAL ART BOOK, page 28, whereas a regular Warp Star\
      \ can be made by a lone Kirby. Kirby & 3 Star Allies kept up in combat & defeated\
      \ the Three Mage-Sisters, Hyness, and Void Termina, who in turn was able to\
      \ keep up with an improved version of the Warp Star or the Friend Star, which\
      \ Meta Knight can maneuver in combat. In side content, 4 Star Allies can defeat\
      \ Morpho Knight EX, the stronger incarnations of Void Termina, and alone can\
      \ defeat Shadow Kirby. Can move faster via Meta Quick, Heal or certain items\
      \ for a limited amount of time)"
