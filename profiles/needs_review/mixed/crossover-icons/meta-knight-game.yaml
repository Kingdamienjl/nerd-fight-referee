        Meta Knight replenishes his health. *Mach Tornado: Meta Knight creates powerful
        tornadoes in his immediate vicinity, heavily damaging all who are caught within.
        In some cases this tornado is localized around Meta Knight, simultaneously
        damaging foes and protecting him from attack. *Galaxia Darkne'
