        Book|The Meta-Knights created]] [[Heavy Lobster]], which Meta Knight might
        have contributed on. Meta Knight is a capable leader, having the utmost respect
        and loyalty of his army of [[Meta-Knights]], with whom he tried conquering
        Dream Land once [https://youtu.be/5T9VMH34L3Y?t=26 to put an end to their
        lazy lifestyle], presumably only failing due to Kirby''s intervention (as
        Meta Knight alone is repeatedly shown as superior to everyone there besides
        the Pink Puffball). If the Kirby Personality Quiz is anything to go byThe
        Kirby Personality Quiz should be taken with a grain of salt, most of the info
        could be made up as it has different Copy Abilities from Kirby as different
