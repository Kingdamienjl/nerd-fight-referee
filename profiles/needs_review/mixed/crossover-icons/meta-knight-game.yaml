    - field: weaknesses
      value: "Meta Knight prefers chivalrous combat, often refusing to fight Kirby\
        \ if he doesn't have a sword (Although he does not extend this treatment to\
        \ others, and might be invested on his development as a warrior). He flees\
        \ when his mask breaks for unknown reasons. He sometimes seems to need to\
        \ defeat or at least clobber his foes for a time before using his unique abilities.\
        \ Many of his powers require him to use his sword ===Notable Attacks/Techniques:===\
        \ Note that there is no distinction between his keys in this section. |-|Regular\
        \ Galaxia moves= Kirby Star Allies-Meta Knight's Knight Beam.gif|Knight Beam\
        \ Kirby Planet Robobot-Meta Knight's Knight Spin.gif|Knight Spin Meta Knight's\
        \ Knight Spin-Kirby Star Allies.gif|Knight Spin Kirby Super Star Ultra-Meta\
        \ Knight's Moon Shot.gif|Moon Shot Kirby Squeak Squad-Meta Knight's Fire Moon\
        \ Shot.gif Kirby's Extra Epic Yarn-Meta Knight's Triple Homing Moon Shots.gif|Three\
        \ homing Moon Shots Meta Knight shoots 3 Moon Shots-Kirby and the Forgotten\
        \ Land.gif Meta Knight shoots consecutive Moon Shots-Kirby and the Forgotten\
        \ Land.gif Meta Knight shoots wide Moon Shots-Kirby and the Forgotten Land.gif\
        \ Galaxia is Meta Knight's sword, being notably more powerful than other blades\
        \ in the verse and giving access to the owner several powers, including many\
        \ different tornado attacks, elemental manipulation, and various other diverse\
        \ abilities. Galaxia also seems to be sentient, being able to fight on its\
        \ own. Other characters like Kirby and Magolor Soul have imitated Galaxia\
        \ when generating their swords, presumably to assimilate its might in the\
        \ latter's case, and likely for fun in the former case. It is said to contain\
        \ infinite power, which can be hyperbolic or maybe refer to an ability to\
        \ become stronger along Meta Knight, in context. *Overhead Slash: Slashes\
        \ forwards. **Knight Beam: When at full health, Meta Knight is capable of\
        \ slashing a sword beam, an energy projectile that advances a few meters.\
        \ Using Overhead Slash results in it. **Meta Triple Slash: Continues Overhead\
        \ Slash by keep swinging his sword 1 or 2 more times. *Meta Multithrust: Swiftly\
        \ jabs the target multiple times. It can be a continuation of Meta Triple\
        \ Slash. **Decisive Slash: Ends the slashes with a final swing. It can give\
        \ a Moon Shot. *Knight Spin: Meta Knight quickly swings his sword in a pitch\
        \ movement while mid-air. Meta Knight can infuse energy on the tip of his\
        \ sword to very slightly increase the move's range. *Guard: Blocks with his\
        \ sword to protect himself against attacks on the ground or mid-air. He does\
        \ this in the middle of battle or as an quick reaction to an attack. *{{Nihongo|Moon\
        \ Shot|\u30E0\u30FC\u30F3\u30B7\u30E7\u30C3\u30C8}} / Crescent Shot (Made\
        \ up in translation): When Meat Knight holds up his sword and then slashes\
        \ it, he shoots a curved energy beam. This is similar to slashing Knight Beams,\
        \ except he's capable of slashing this beam at any time he wants, and it does\
        \ more damage than an ordinary Knight Beam. It sometimes slightly homes into\
        \ the target, and it has many variations and/or Meta Knight has other attacks\
        \ that look similar: **He can shoot a fiery & bigger version of it, and can\
        \ do that consecutively up to 3 times. He also seems to be able to do something\
        \ similar with blue fire. **He can shoot Moon Shots that intensely home into\
        \ a target. **He can shoot multiple Moon Shots consecutively after a brief\
        \ charge. **He can shoot Moon Shots wide enough to occupy most of the battlefield\
        \ (Meta Knight being 20cm) that leave bats flying around. The bats likely\
        \ aren't alive. Meta Knight shoots 4 homing waves-Kirby and the Forgotten\
        \ Land.gif Kirby Squeak Squad-Meta Knight's Green Electricity.gif Kirby's\
        \ Extra Epic Yarn-Meta Knight's Drill Rush.gif|Piercing Slash (Extra Epic\
        \ Yarn) Star Allies-Meta Knight's Shuttle Loop.gif|Shuttle Loop (Star Allies)\
        \ *Down Thrust: Points his sword to the ground as he plummets downwards, being\
        \ able to move laterally a bit. **He has a similar move that he charges a\
        \ bit to shoot 4 energy waves around himself that home into targets. *Up Thrust:\
        \ Thrusts his sword into the air. *Piercing Slash/Lunging Slice: After running,\
        \ lunges with his sword advancing forward. *Meta Chop: Slashes forward with\
        \ his sword while mid-air. **Meta Upper: Makes a small uppercut with his sword.\
        \ *Electricity Manipulation: Unnamed technique, Meta Knight, briefly raises\
        \ his sword to generate green electricity that he extends to his surroundings.\
        \ *Fire Manipulation: Can use fire versions of Moon Shot. In Epic Yarn and\
        \ its remake, Extra Epic Yarn, he can involve his sword (which isn't Galaxia\
        \ at the time) with energy whose colors vary in each of his phases but appears\
        \ to be fire, this allows him to reach great distances. *{{Nihongo|Spiral\
        \ Sword|\u30B9\u30D1\u30A4\u30E9\u30EB\u30BD\u30FC\u30C9}}: A move Kirby copied\
        \ from Galaxia in the \"Master\" Copy Ability. The user drills forwards with\
