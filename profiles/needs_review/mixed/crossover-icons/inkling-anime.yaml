        in combat being able to use a large variety of weapons and taking part in
        turf wars just for fun. Inklings also see humans have very little intelligence
        despite human''s being able to create capsules to seal Judd for thousands
        of years along with Commander Tartar who stores all of humanity''s knowledge
        and was able to build a weapon with the power to destroy the world. New Agents
        in the New Squidbeak Splatoon are also able to adapt very quickly being complimented
        on how good they are multiple times) ==703px== Unable to swim in the water,
        Ink inhibits the movement of Inklings that do not have a matching color, They
        are extremely vulnerable in their squid form outside of ink, Ink cannot be
        used on glass ==703px== *Ability Doubler: Doubles the effect of other abilities.
        *Bomb Sniffer: Allows Inklings to easily spot opponents'' bombs as skull icons
        that can be seen even through walls. *Cold Blooded: Shortens the duration
        of any position-tracking effects inflicted on the Inkling. *Comeback: Improves
        ink efficiency, ink recovery rate, mobility, and Special Gauge fill rate for
        the first twenty seconds after regenerating. *Drop Roller: Allows the Inkling
        to roll after performing a Super Jump or when jumping back to the Ink Jet''s
        starting point. *Haunt: Tracks the opponent that splatted the Inkling. *Ink
        Resistance Up: Mitigates the negative effects of touching the opponent''s
        ink on the ground, including reduced jump height, reduced movement speed,
        and accumulation of damage. *Last-Ditch Effort: Boosts ink recovery rate and
        weapon ink efficiency for the last 30 seconds of battle. *Ninja Squid: The
        Inkling does not leave ripples while swimming in ink on horizontal surfaces
        and ramps. However, swim speed is slowed slightly. This ability does not affect
        swimming on a vertical surface. *Object Shredder: Increases the damage its
        user deals to objects, weapons, and barriers. *Opening Gambit: Boosts run
        speed and swim speed for the first 30 seconds of a fight. *Recon: The Inkling
        can see where their opponent is and what weapons they have. *Respawn Punisher:
        Increases the amount of time it takes for an enemy Inkling to regenerate and
        the amount of Special Gauge that is lost. *Stealth Jump: the Inkling can make
        Super Jumps without telegraphing their landing position. *Super Jump: An ability
        that Inklings have that allows them to jump very high in the air in order
        to land somewhere else. *Tenacity: Causes the Special Weapons gauge to fill
        faster the less allies the Inkling has. *Thermal Ink: Shows the location of
