        Abilities (Inkling''s have a variety of Special Weapons such as Ink Armor
        and Bubbler that can protect them from attacks that would normally one-shot
        them. Agent''s in the New Squidbeak Splatoon can equip multiple sets of armor
        that can let them take multiple attacks that would normally one-shot them.
        The Defense Up ability can increase Inkling''s Durability), at least Multi
        Continent level, likely far higher with forcefields (Inkling''s Spawn Point''s
        forcefield isn''t damaged at all by Pearl''s Princess Cannon) ==File:Mariostamina.png==
        Very High (Goggles and Rider fought the Octarian army who stole the Zapfish
        and Great Zapfish and rescued the Great Zapfish in the span of a whole day
        and were not tired in the end) ==703px== Varies from Extended Melee to up
        to Hundreds of Meters ==File:Mariostandardequip.png== Assorted melee weapons,
