    - field: intelligence
      value: 'Below Average in general, Above Average in adventures & combat. Childish,
        innocent, overly friendly, and lazy outside of adventures. Very forgiving,
        but willing to kill anyone if necessary. Varies between being oblivious and
        competent depending on the activities. In adventures & combat: His best displays
        are shown in this context, being competent in adventures and a legend in combat.
        | As before, Genius about technology or via Toon Force Standard Tactics: (See
        clarifications here.) |-|Generally= *Implements Guards into battles, which
        Kirby should hold a notable understanding of when it''s prudent to use it
        or opt for other options. *Getting defeated by Kirby with no particular finishing
        move often leads to targets being thrown meters, kilometres, or even interstellar
        distances away. *Kirby has repeatedly summoned a Warp Star to better travel
        set distances faster or chase foes. *When fighting along allies, Kirby will
        share healing items via Face-to-face food transfer. *Will implement items
        if he has access to any. *Pre-Star Allies: As before. Adds in Dodges & Air
        Dodges in combat, and uses Space Jumps to travel faster short distances. *Can
        turn into Ghost Kirby to revive himself if needed to. *When fighting along
        allies, they can use Team Attacks, Kirby will revive/heal his allies using
        Revival Spell, or by grabbing their leaving souls & bringing them back to
        the ground to recreate their bodies (At least with fellow Kirbys). *Post-Star
        Allies: As before. Sometimes uses his sensing ability, particularly at a distance
        from foes, and has used it to confirm the location of someone he was trying
        to find. *Has implemented grabs into his moves to overcome enemies'' Guards
        & variants (like forcefields). *When fighting along allies, their bonds of
        friendship is likely to grow, thus making their stats grow over time. |-|In
        base= *His Inhale & Swallow are his most common combination of actions, followed
        by Inhale & Star Spit, using the latter in combat against foes he can''t inhale,
        and the former against foes he can easily deal with that way or on things
        to gain Copy Abilities. **Can use his Super Inhale to improve his Inhale if
        needed to. **Kirby will manually make use of a Copy Ability if given the chance.
        *Kirby has copied powers from others by colliding with them when using Inhale
        was less practical. *Post-Star Allies: As before. May be more likely to use
        a Copy Ability at will. |-|With a Copy Ability= Makes use of the moves the
        Copy Ability offers. | As before. | As before. Makes use of Helpers somewhat
        frequently. Combines elemental powers with allies if possible.'
