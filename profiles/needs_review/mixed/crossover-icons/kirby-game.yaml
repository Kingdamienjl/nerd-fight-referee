        \ text here\u2014Star Allies Sparkler's regular Jap. pause screen description\
        \ translated \u2022 Kirby Star Allies}} }} ==Summary== Kirby is the main protagonist\
        \ of his eponymous series. He's a happy-go-lucky, glutton and lazy individual\
        \ living peaceably in Dream Land. He would jump into action when needed to,\
        \ if he's not participating in challenges from his friends, he may be opposing\
        \ malevolent forces and ultimately facing menacing monstrosities that contrast\
        \ his own friendly appearance and intentions. Kirby became a well-known hero\
        \ in his and other universes, is respected as a warrior and considered to\
        \ have infinite power, but by far, his biggest characteristic and strength\
        \ is his sheer goodness; Kirby forges deep bonds with friends, allies in adventures\
        \ and passersby he helps out, he's eager to spend time solving the problems\
        \ of other creatures, even strangers, and is quick to forgive characters who\
        \ are full of themselves or who may even be evil, seemingly making some of\
        \ them less wicked. These selfless acts usually result in Kirby getting rewarded\
        \ in some way, a number of his final victories and achievements being attributed\
        \ to it. Kirby has a rivalry with King Dedede and Meta Knight, 2 of his most\
        \ notable friends, and the most significant and serious adventures Kirby has\
        \ either indirectly relate to the Ancients or are directly caused by beings\
        \ who are members of, or resemble, the Dark Matter species. ==Powers and Stats"
