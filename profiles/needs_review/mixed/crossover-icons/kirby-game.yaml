    - field: weaknesses
      value: "Her defeat sends her to Another Dimension. Only battles with her armor\
        \ Note: While it is possible for President Parallel Susie and Parallel Susie\
        \ to be the same character, this is rather unlikely: * Parallel Susie keeps\
        \ fighting Team Kirby after their battle with Pres. Parallel Susie, not having\
        \ her skin color, title, armor, or symbol on it. * Pres. Parallel Susie having\
        \ gained power after wandering through dimensions isn't a genuine confirmation\
        \ of them being the same as much as it is a justification for Pres. Parallel\
        \ Susie to be more powerful than Parallel Susie, or even just more powerful\
        \ than in her first battle with Team Kirby, in which she was merely said to\
        \ be \"an invader from another world\" and being \"apparently some kind of\
        \ president...\". Pres. Parallel Susie holds no relationship with Parallel\
        \ Susie stated on any description of the game nor the official Twitter, which\
        \ also presented her as her own character in the times it made posts about\
        \ her. * If anything, several things presumably indicate a notable difference\
        \ between both Susies. Pres. Parallel Susie is a president. Pres. Parallel\
        \ Susie is not tied to King D-Mind, the boss of the Black MirrorMagolor's\
        \ Exclusive Information 9th \u2022 Team Kirby Clash Deluxe Jpn. site's dimension,\
        \ due to not having his symbol in her armor; Pres. Parallel Susie instead\
        \ has her own symbol, one used for things related to Another Dimension (Used\
        \ on the Lor Starcutter, and the logo of the Heroes in Another Dimension mode\
        \ in Kirby Star Allies). Pres. Parallel Susie can travel across dimensions\
        \ and on Another Dimension on her own, but the reason Parallel Susie connected\
        \ with Another Dimension is because of somebody using an item to made that\
        \ happen in order to summon her from the dimension she came fromInterview\
        \ in the Nintendo DREAM magazine, issue of August 2017; Another Dimension\
        \ is the space between dimensions, sometimes used to transport characters\
        \ from 1 reality to another reality. The use of Another Dimension to transport\
        \ someone doesn't necessarily mean a target being moved across Another Dimension\
        \ originates from Another Dimension itself. ** In other words, Pres. Parallel\
        \ Susie presumably originates from Another Dimension, or at worst comes from\
        \ an unknown dimension, whereas Parallel Susie originates from Black Mirror's\
        \ dimension. ==Gallery== Nonrender President Parallel Susie-Super Kirby Clash.png|Pres.\
