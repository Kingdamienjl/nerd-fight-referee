        Bowser will place a curse on his target that will allow him to control their
        movements, having been shown to make them take steps they didn''t mean or
        want too, or force them to turn around and walk in the opposite direction.
        ground pound plumber.jpg|Mario ground-pounding. Ground Pound: Introduced in
