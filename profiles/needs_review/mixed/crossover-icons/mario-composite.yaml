    - field: attack_potency
      value: "Unknown, likely Wall level. Mario can swing the Hammer with enough force\
        \ to obliterate fireballs. | At least Country level to Multi-Continent level.\
        \ Mario has defeated a number of foes that threaten massive regions. In Super\
        \ Mario Bros., Mario defeated Bowser, who altered the Mushroom Kingdom with\
        \ his dark magic. Other characters like Tatanga and Wario in the Super Mario\
        \ Land games should be similar since they threatened other lands like Sarasaland\
        \ or Mario Land by controlling them, as seen in their separate manuals. In\
        \ Super Mario Bros. 3, Mario are capable of toppling the Sledge Brothers.\
        \ The manual for the game states that they're capable of shaking the earth.\
        \ Characters like Bowser should definitely be superior to that. | At least\
        \ Universe level, possibly Multi-Universe level. (Mario defeated Wart, who\
        \ invaded and altered the entire world of Subcon. He also scales to the 8-bits,\
        \ in which the manual consistently states these enemies can create evil dreams\
        \ and destroy good ones. However, it's unclear if it actually means entire\
        \ universes or just basic attacks.) | Ranges from Galaxy level to Universe\
        \ level+. (Mario has consistently defeated foes who are capable of imprisoning\
        \ the Power Stars. Rosalina has clearly stated in Super Mario Galaxy that\
        \ Power Stars are one of the many afterlife transformations of Lumas. These\
        \ same Lumas can also transform into planets, comets, stars, or even galaxies.\
        \ Mario is also capable of defeating foes with Grand Stars, which are responsible\
        \ for keeping the Lumas alive. Since Mario is constantly physically toppling\
        \ characters this powerful in the 3D genre, Mario should be Galactic at bare\
        \ minimum. However, this isn\u2019t his absolute potential. Mario has commonly\
        \ taken on Bowser, who was able to tank a universe consuming black hole at\
        \ point-blank range in Super Mario Galaxy. In Super Mario Galaxy 2, the Grand\
        \ Star Bowser wielded was responsible of creating a massive black hole that\
        \ covered the entirety of a singular universe. He even scales to Rosalina,\
        \ who, despite being able to dwarf Mario in terms of powers and abilities,\
        \ has still shown that she can get hurt from standard enemies around his level,\
        \ as seen in Super Mario 3D World. Rosalina has shown to have the ability\
        \ to manipulate the time-space continuum to her own liking, such as resetting\
        \ it entirely in Super Mario Galaxy.) | Multi-Continent level in Mario & Luigi:\
        \ Superstar Saga. Mario is capable of defeating foes who are capable of altering\
        \ or forming massive regions. Bowletta stated that she who was going to combine\
        \ the Mushroom Kingdom and the BeanBean Kingdom into one singular country.\
        \ The Mushroom Kingdom is absolutely enormous, as it is home to numerous different\
        \ worlds, as seen in numerous other Mario games. It's big enough to be considered\
        \ a continent. The BeanBean Kingdom is stated to be equal in size, so it's\
        \ likely that Bowletta was going to form an even bigger country. Island level\
        \ in Mario & Luigi: Partners in Time. Mario defeated the Elder Princess Shroob,\
        \ who was able to form an entire storm that spread across the Mushroom Kingdom\
        \ with her power alone. At least Universe level in Mario & Luigi: Bowser's\
        \ Inside Story. Mario is able to harm Chakron, a being who is one with all\
        \ physical matter within the universe. Chakron also stated himself that the\
        \ Dark Star a cosmic threat, whom Mario defeated. Bowser was capable of defeating\
        \ the Dark Bowser, a being with double the power of the Dark Star and Dark\
        \ Fawful. Mario defeated Bowser in the same game. Ranges from Universe level\
        \ to Multiverse level in Mario & Luigi: Dream Team. Mario was capable of defeating\
        \ Antasma, who is vastly superior to Dreamy Luigi. One of Dreamy Luigi's abilities\
        \ allowed him to control time itself. He even overpowered the even stronger\
        \ Dreamy Bowser, who had the power of every single dream. Dreams are obviously\
        \ universes, as we see Mario enter them. There are hundreds of inhabitants\
        \ on Pi'illo Island, so it makes perfect sense for it to be Multiversal at\
        \ bare minimum. However, people like Metal875 go deeper into this feat. Universe\
        \ level+ in Mario & Luigi: Paper Jam. Mario scales to Paper Mario, who is\
        \ capable of creating an entire realm. He was also able to defeat Paper Bowser,\
        \ who scales to Paper Mario for obvious reasons."
