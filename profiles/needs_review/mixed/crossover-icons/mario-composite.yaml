        robots], [https://youtu.be/yohLgD_bvYU?t=894 blasters], and more, with the
        Hammer as his greatest specialty. He has defeated [https://www.mariowiki.com/Jinx
        Jinx], a dojo sensei and master combatant who challenges him up to three times
