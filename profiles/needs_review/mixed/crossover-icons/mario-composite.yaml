        engineer, and archaeologist, as well as [https://www.mariowiki.com/Mad_Scienstein
        Mad Scienstein], who needed them to treat a cold [https://youtu.be/Z8xsZPRj5mY?t=1962
        that he himself could not cure]. On the engineering side, Mario designed [https://youtu.be/GmOJN-zq6yg
        functioning robots] as far back as Donkey Kong Junior and later created the
        Mini-Marios, autonomous units that [https://youtu.be/6QzQ_G9ME3s?t=681 fight
        Donkey Kong and other enemies] throughout the Mario vs. Donkey Kong series.
        He also displays abnormal linguistic understanding with species such as [https://youtu.be/oVFqOQ4Yclw?t=138
        Yoshis], [https://youtu.be/HfkZtwKWqCI?t=480 Chain Chomps], and [https://youtu.be/IzhuT8MHWtI?t=87
        Shroobs], who don''t speak like the Mario Bros. or other human characters.
        Mario should have learned the Yoshi language through a lifetime of close contact
        with them, since nothing indicates that they formally taught it to him. Despite
