        \ Land games should be similar since they threatened other lands like Sarasaland\
        \ or Mario Land by controlling them, as seen in their separate manuals. In\
        \ Super Mario Bros. 3, Mario are capable of toppling the Sledge Brothers.\
        \ The manual for the game states that they're capable of shaking the earth.\
        \ Characters like Bowser should definitely be superior to that. | At least\
        \ Universe level, possibly Multi-Universe level. (Mario defeated Wart, who\
        \ invaded and altered the entire world of Subcon. He also scales to the 8-bits,\
        \ in which the manual consistently states these enemies can create evil dreams\
        \ and destroy good ones. However, it's unclear if it actually means entire\
        \ universes or just basic attacks.) | Ranges from Galaxy level to Universe\
        \ level+. (Mario has consistently defeated foes who are capable of imprisoning\
        \ the Power Stars. Rosalina has clearly stated in Super Mario Galaxy that\
        \ Power Stars are one of the many afterlife transformations of Lumas. These\
        \ same Lumas can also transform into planets, comets, stars, or even galaxies.\
        \ Mario is also capable of defeating foes with Grand Stars, which are responsible\
        \ for keeping the Lumas alive. Since Mario is constantly physically toppling\
