        \ minimum. However, this isn\u2019t his absolute potential. Mario has commonly\
        \ taken on Bowser, who was able to tank a universe consuming black hole at\
        \ point-blank range in Super Mario Galaxy. In Super Mario Galaxy 2, the Grand\
