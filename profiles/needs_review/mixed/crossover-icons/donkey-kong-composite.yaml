    - field: weaknesses
      value: 'Notable Attacks/Techniques: *Giant Punch: Charges then releases a very
        powerful punch which can move mountain sized moons *Thunderclap: A term used
        to refer to a large shockwave created by a character with super strength violently
        clapping their hands together. Donkey Kong claps hard enough to create a sound
        wave to attack his opponents. The sound waves travel around him or in front
        of him. These attacks can be incredibly destructive, sometimes equalling nuclear
        bombs or hurricanes. *Barrels: Donkey Kong can summon and throw barrels at
        his opponents. *Barrel Roll: Donkey Kong will roll his entire body toward
        his opponents. *Barrel Cannon Blast: Donkey Kong summons a barrel cannon and
        hops into it. The cannon will fire Donkey Kong at such force that anything
        hit by him will be set on fire while flying. *Ground Pound: Donkey Kong creates
        an earthquake by slapping the ground. *Strong Kong: Donkey Kong jumps into
        a Donkey Kong Barrel and turns invincible for a few seconds. *Going Bananas:
        After eating a certain amount of bananas, Donkey Kong becomes faster and invincible
        for a limited period of time. He has a similar variant called Crystal Star
        in DK: Jungle Climber which also grant him flight. This version activates
        when he collected jewels. *Spinning Kong: Whirls around like a helicopter,
        good for moving horizontal distances. *Simian Slam: Donkey Kong jumps into
        the air and comes crashing down on his back side. It has stronger variations
        including the Super Simian Slam and Super Duper Simian Slam. *Thunder Wham:
        Donkey Kong slams onto the ground, creating a dome-like shock wave that even
        tilts the field. *Ultra Barrel DK: Donkey Kong is equipped with a special
        Ultra Barrel rockets that enables him to fly extremely fast into the point
        he causes fire to surround himself. *Wild Move: While being equipped with
        rocket barrels, Donkey Kong performs a boost dash that destroys obstacles
        and attack enemies in it''s path. *Magic Weapon: Donkey Kong forges a weapon
        of pure energy in shape of a hockey stick. It''s only used once in Mario Sport
        Mix in a fight against the Behemoth. *Power Fist Strike: Donkey Kong''s Super
        Strike. He charges with green and yellow lightning then makes an electrical
        strike by punching the target with anger. *Bongo Donkey Kong: Donkey Kong''s
        Megastrike. He jumps into the air and he gathers electricity in his arms and
        claps at the target with tremendous re-entry force.'
