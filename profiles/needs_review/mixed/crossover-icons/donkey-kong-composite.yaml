        throw barrels at his opponents. *Barrel Roll: Donkey Kong will roll his entire
        body toward his opponents. *Barrel Cannon Blast: Donkey Kong summons a barrel
        cannon and hops into it. The cannon will fire Donkey Kong at such force that
        anything hit by him will be set on fire while flying. *Ground Pound: Donkey
        Kong creates an earthquake by slapping the ground. *Strong Kong: Donkey Kong
