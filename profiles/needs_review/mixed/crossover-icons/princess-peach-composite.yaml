      value: 'Mario doesn''t always think things through before jumping straight into
        things. Sometimes his cocky and brash personality gets to him. (Though there
        times where he strategizes, as seen in the RPG games.) Power-ups usually wear
        off by receiving a deadly blow. Some also have a time limit. Despite being
        able to breathe in space, he can''t breathe in water. (Although this is quite
        inconsistent) When he doesn''t have his cap on, he becomes slightly weaker.
        (But again, this is inconsistent) CURRENTLY REVISING NOTE: The reason I''m
        separating the 2D games from the 3D games is not only because they play completely
        differently, but the amount of power both genres have displayed are so far
        apart. It''s not like it really matters anyway, because I''m separating different
        parts of the whole franchise. Also, Super Mario Bros. 2 is separated from
        the other 2D games mainly because I would consider that game to be almost
        entirely irrelevant to the other 2D games. There are tons of different characters,
        places, and power levels that we never see in any other 2D game. Category:SKeLeTrust
