        \ thrusts it forward at her opponent. If the opponent is shielding themselves\
        \ with a forcefield, this attack deals far more damage to the shield, often\
        \ causing them to break. This attack deals more damage the longer she holds\
        \ her stance before attacking. *Dancing Blade: Lucina attacks with the Parallel\
        \ Falchion in rapid succession, up to four times. She can substitute her forward\
        \ attacks with either high or low strikes, allowing her to mix up her fighting\
        \ style on the fly. *Dolphin Slash: Lucina performs a high-speed uppercut\
        \ slash with her blade. *Counter: Lucina takes on a defensive stance in preparation\
        \ of an attack. When she is hit by the opponent, she is able to block it and\
        \ immediately perform a counterattack. The power of this attack is dependent\
        \ on the power of the attack she is countering, with the power being greater\
        \ the stronger the oncoming attack is. *Critical Hit: Lucina holds her Parallel\
