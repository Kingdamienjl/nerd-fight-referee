    - field: weaknesses
      value: "Like many ultras from M78, he is limited to 3-minutes on planets with\
        \ an atmosphere similar to that of Earth's (Typically ignored for plot reason)\
        \ Notable Attacks/Techniques: * Transformation: Hideki Go can transform into\
        \ Ultraman Jack through willpower, provided Jack allows it. This is mainly\
        \ represented by Go raising or waving one arm above his head to summon Ultraman\
        \ Jack. In moments of desperation, Hideki can transform instantly. There are\
        \ also times when Hideki Go attempts to transform but is blocked due to Jack\
        \ refusing to transform under those circumstances. * Spacium Beam: Ultraman\
        \ Jack's signature technique. When Jack positions his arms in a plus sign\
        \ (+)\u2014right arm vertical, left arm horizontal\u2014he can fire a powerful\
        \ beam from his right hand capable of destroying opponents in one hit. * Ultra\
        \ Slash: A sharp ring of Spacium energy launched from Jack\u2019s hand. It\
        \ can easily cut through monsters. * Ultra Shot: A plasma beam fired from\
        \ Jack\u2019s hand, similar to Zoffy\u2019s M87 Beam. Jack extends his right\
        \ hand forward and places his left hand on his right arm. He also has a variant\
        \ that reduces a corpse to bones. * Ultra Eye Light: Beams of light fired\
        \ from Jack\u2019s eyes to attack enemies. * Ultra Rocket Bullets: Light bullets\
        \ fired from Jack's fingertips. Used against Varricane. * Cinerama Shot: An\
        \ \u201CL\u201D-shaped beam attack that can destroy monsters in a single shot.\
        \ * Ultra Frost: Jack can spray a freezing mist from his hand. * Stop Beam:\
        \ Using both hands, Jack releases a ray of light that holds the enemy in place.\
        \ * Slice Hand: Jack uses his hand to decapitate a monster. * Ultra Hurricane:\
        \ Jack lifts the opponent, throws them into the air, and finishes with a Spacium\
        \ Beam. Used to defeat Zetton Gen. 2. * Ultra Barrier: A barrier technique.\
        \ It can stop a tsunami with energy waves, but doing so severely drains his\
        \ energy, allowing Seamons to easily defeat him. * Fluoroscopic Beam: Ultraman\
        \ Jack can fire a beam from his eyes to reveal invisible enemies. == Others\
