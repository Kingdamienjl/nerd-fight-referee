    - field: weaknesses
      value: 'Standard Trophy Fighter weaknesses. Movements are hindered significantly
        when he carries someone in his mouth. Some of his more powerful moves will
        leave him open for attacks if he misses. Can have copy abilities knocked off
        of him if he gets hit hard enough. Feats: *One-shot the Subspace Gunship by
        flying through it with the Dragoon. *Defeated Petey Piranha, who held Peach
        and Zelda hostage and wielded their cages as weapons. *At one point in the
        Subspace Emissary, Kirby swallowed a badge that allows a fighter to be revived
        in the case of all fighters being defeated. Even after Kirby, alongside the
        entire cast, was defeated and turned into trophies by Tabuu in the first encounter,
        the badge still activated from inside Kirby''s stomach, reviving him and allowing
        him to revive the rest of the cast alongside a newly revived Ness, Luigi,
        and King Dedede, who also had badges placed on their trophies earlier on.
        *Comparable to Fox and Diddy Kong, who were able to react to and dodge Rayquaza''s
        thunderbolts, which fall down in pillars in a similar fashion to cloud-to-ground
        lightning. Kirby''s able to defeat Rayquaza as well. There''s also the fodder
        enemy known as the Spaak, a sentient floating thundercloud that fires balls
        of lightning. Notable Attacks/Techniques: Kirby Neutral B SSBU.gif|Inhale:
        Kirby''s Neutral Special Kirby Side B SSBU.gif|Hammer Flip: Kirby''s Side
        Special Kirby Final Smash SSBU.gif|Ultra Sword: Kirby''s Final Smash *Inhale:
        This allows Kirby to swallow opponents and copy their powers. Unlike his canon
        counterpart, Smash Kirby supposedly cannot kill people by devouring them on
        the spot, as when he "Swallows" them, they simply end up back outside of him.
        Kirby can also use this to swallow projectiles and spit them back out, or
        even carry opponents around in his stomach. *Final Cutter: Kirby leaps upward
        with his sword and follows up with a downward slash, creating a shockwave
        of energy when he collides with the ground. *Hammer Flip: Kirby whips out
        a hammer and slams it into the opponent''s face. Strikes twice in midair,
        and can be charged to increase the power of the attack. While charging, Kirby
        has minor resistance to flinching and overcharging it for too long will cause
        him to start accumulating damage to himself. *Stone: Kirby turns his body
        into a ridiculously heavy object that supposedly weighs 100 tons (As one of
        the randomly decided animations for it features a 100 ton weight) and falls
        down onto the opponent. Can also be used for trapping opponents by pounding
        them into the ground from sheer force. *Ultra Sword: Kirby dons a green cap
        and wields a giant sword. He then swings the sword, trapping nearby opponents,
        and slashes the character multiple times. After slicing the opponent multiple
        times, the sword grows bigger, and Kirby finishes with a powerful blow, which
        sends the targets flying at a fair distance. Note: For an extended list of
        Kirby''s Smash-exclusive abilities, go here. ==Gallery== Kirby-Super Smash
        Bros. Ultimate mural.png ==Notable Matchups== Victories: Losses: Inconclusive:
