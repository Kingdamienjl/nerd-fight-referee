    - field: intelligence
      value: 'Below Average in general, Above Average in adventures & combat. Childish,
        innocent, overly friendly, and lazy outside of adventures. Very forgiving,
        but willing to kill anyone if necessary. Varies between being oblivious and
        competent depending on the activities. In adventures & combat: His best displays
        are shown in this context, being competent in adventures and a legend in combat.
        | As before, Genius about technology or via Toon Force Standard Tactics: (See
        clarifications here.) *Implements Guards into battles, which Kirby should
        hold a notable understanding of when it''s prudent to use it or opt for other
        options. *Getting defeated by Kirby with no particular finishing move often
        leads to targets being thrown meters, kilometres, or even interstellar distances
        away. *Kirby has repeatedly summoned a Warp Star to better travel set distances
        faster or chase foes. *When fighting along allies, Kirby will share healing
        items via Face-to-face food transfer. *Will implement items if he has access
        to any. *Pre-Star Allies: As before. Adds in Dodges & Air Dodges in combat,
        and uses Space Jumps to travel faster short distances. *Can turn into Ghost
        Kirby to revive himself if needed to. *When fighting along allies, they can
        use Team Attacks, Kirby will revive/heal his allies using Revival Spell, or
        by grabbing their leaving souls & bringing them back to the ground to recreate
        their bodies (At least with fellow Kirbys). *Post-Star Allies: As before.
        Sometimes uses his sensing ability, particularly at a distance from foes,
        and has used it to confirm the location of someone he was trying to find.
        *Has implemented grabs into his moves to overcome enemies'' Guards & variants
        (like forcefields). *When fighting along allies, their bonds of friendship
        is likely to grow, thus making their stats grow over time. *His Inhale & Swallow
        are his most common combination of actions, followed by Inhale & Star Spit,
        using the latter in combat against foes he can''t inhale, and the former against
        foes he can easily deal with that way or on things to gain Copy Abilities.
        **Can use his Super Inhale to improve his Inhale if needed to. **Kirby will
        manually make use of a Copy Ability if given the chance. *Kirby has copied
        powers from others by colliding with them when using Inhale was less practical.
        *Post-Star Allies: As before. May be more likely to use a Copy Ability at
        will. Makes use of the moves the Copy Ability offers. | As before. | As before.
        Makes use of Helpers somewhat frequently. Combines elemental powers with allies
        if possible.'
      source_id: vsbattles-kirby-classic-crossover-icons
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Naive outside of combat. Despite his age, Kirby''s still young. Unlike
        fellow warriors in the series, outside of their adventures Kirby''s lazy and
        relaxes with mundane activities. His ability to rest is bestowed by the Fountain
        of Dreams, and if something were to happen to it everyone in Dreamland will
        eventually be restless and irritable. Often celebrates victory after notable
        battles, having been taken by surprise while doing so even at a point in time
        when he had the ability to sense his enemies. Note 1: Kirby would be missing
        a "Pre-Magolor Soul battle" Key after defeating Drawcia, given its short duration
        and little differences between other Keys. Kirby would be 4-A in this Key;
        Despite canonically having help from the player to mobilize and defeat Drawcia,
        Kirby would scale to her as his tackles against Drawcia should come from his
        own power, much like Meta Knight and King Dedede can defeat Drawcia while
        harming her with their sword and hammer respectively. These heroes could also
        survive magical attacks from her and trade blows with comparable foes. The
        few new powers & abilities from this Key Kirby would have are cited under
        "As of Kirby: Squeak Squad" in the prior "Pre-Canvas Curse" Key, and additionally,
        the latter game also presents mechanics Kirby always had, only cited under
        "Kirby: Squeak Squad. Note 2: Information exists that could better clarify
        many feats and events in the series via Jap. guides, which are inaccessible
        for free. Note 3: Forgotten Land happens in a place called New World that
        uses its own language, and the game purposely left all the information needed
        to figure it out.www.nintendo.com/whatsnew/ask-the-developer-vol-4-kirby-and-the-forgotten-land-part-3/
        Among all the things shown in that language, it''s proven that the New World
        uses real human measurements. One inhabitant has been portrayed with a human
        actress, established to have existed in the setting of that world.Kirby 30th
        Anniversary Music Festival and its associated sources of information As such,
        the New World''s structures are scaled down in gameplay so that Kirby (whose
        20 cm) can properly interact with them in an engaging way. Kirby''s size hasn''t
        increased or been retconned; the apparent scaling with his body next to the
        New World''s structures is just a technicality that''s not even consistent
        within that game. ==Notable Attacks/Techniques:== === No Copy'
