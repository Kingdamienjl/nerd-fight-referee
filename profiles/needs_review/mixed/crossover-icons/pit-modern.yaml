power_scale:
  tier:
    text: "At least {{9-A}}, higher with Hidden Blade and melee weapons Name: Eivor\
      \ Varinsdottir, The Wolf-Kissed Origin: Assassin's Creed Valhalla Gender: Female\
      \ (S\xFDnin is also female) Age: 20-23 during the events of Song of Glory. 26-31\
      \ during the events of the main game (Valhalla takes place between 873-878 CE).\
      \ 32-35 during the events of Wrath of the Druids (The Wrath of the Druids DLC\
      \ takes place between 879 to 882), 38-39 during the Siege of Paris DLC (The\
      \ Siege took place between 885-886 CE), 42 during the events of The Last Chapter\
      \ Classification: Human reincarnation of the Isu Odin, Sage, Viking, Drengr\
      \ of Sigurd Styrbjorn, eventually the jarlskona of Ravensthorpe"
    source_ids:
    - vsbattles-pit-modern-crossover-icons
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "At least Small Building level+ (As a direct reincarnation of the Isu Odin\
      \ with incredibly high-enough concentrations of Isu DNA to be able to easily\
      \ handle the Yggdrasil supercomputer and understand all of its functions and\
      \ work mechanisms, she should easily be equal in strength to other Sages like\
      \ Bartholomew Roberts, Fran\xE7ois-Thomas Germain, direct Isu descendants like\
      \ Kassandra, Alexios and Pythagoras, and should at least be comparable to the\
      \ Isu themselves in terms of physical and combat prowess. Also traded blows\
      \ with and fought a lengthy battle against the Abbasid Hidden One Basim Ibn\
      \ Ishaq, another Norse Isu Sage and the direct reincarnation of Loki, who could\
      \ easily leap several meters into the air and shouldn't be much weaker than\
      \ his Staff of Hermes-equipped self, who in turn would be at the very least\
      \ equal to Layla Hassan. Later holds her own against Kassandra in the crossover\
      \ stories DLC,Assassin's Creed Valhalla (2020)- A Fated Encounter: Tossing and\
      \ Turning effectively stalemating each other, Kassandra later further complimented\
      \ Eivor to be quite strong, with Eivor herself stating that she had Kassandra\
      \ effectively cornered in their first fight, with Kassandra herself later stating\
      \ that she and Eivor were of similar strength, based on their resistance to\
      \ the Piece of Eden wreaking havoc on the Isle of Skye but not affecting them,\
      \ confirming it again by later saying that their first fight had \"taken a lot\
      \ out of her\" and that she wasn't sure if she was ready for a second fight,\
      \ with Eivor herself complimenting Kassandra to have \"kept her on her toes\
      \ as well\")"
    source_ids:
    - vsbattles-pit-modern-crossover-icons
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Hypersonic (Can easily catch arrows in mid-flight with her bare hands while
      being mere centimeters away from the arrow-tip, and then shoot them back at
      her foes, and many of her bosses, especially Kjotve the Cruel and other high-ranking
      Zealots of the Order of the Ancients, who are much taller and bulkier than her,
      can do the same feat as her, with Eivor easily managing to best them in combat.
      Can also keep up with Basim, who can replicate the same feats as her to a much
      greater degree and from even closer distances from the bow), higher with speed
      amps (Can move much faster than her base state and also see the whole world
      in slow motion, including her foes)
    source_ids:
    - vsbattles-pit-modern-crossover-icons
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: null
    source_ids: []
    confidence: 0.0
  striking_strength:
    text: null
    source_ids: []
    confidence: 0.0
  durability:
    text: At least Small Building level+ (Easily took many hits from Basim Ibn Ishaq,
      who should at the very least be comparable to, if not weaker than his Staff-equipped
      self, who in turn is at the very least equal to a Staff-amped Layla. High falls
      from enormous cliffs exceeding 53 meters in height are of little to no concern
      to her. Later trades blows on equal ground with Kassandra, who by this point
      has already obtained the Staff of Hermes, and after the fight she further compliments
      Eivor for her strength, with Kassandra herself later stating that she and Eivor
      were of a similar strength which allowed them to resist the curse on the island
      stemming from a Piece of Eden, on praising Eivor for a third time she outright
      stated that Eivor had "taken a lot out of her" in their first fight, stating
      that she wasn't sure if she was ready for a second confrontation, with Eivor
      also stating that Kassandra kept her on her toes as well)
    source_ids:
    - vsbattles-pit-modern-crossover-icons
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman. Has no problems climbing high fjords in Norway and powering
      through multiple river raids in a single day, and withstood extensive torture
      from Kjotve's forces in her childhood. Survived being viciously bitten by a
      wolf in the neck as a mere child before proceeding to kill it with one axe swing
      while bleeding out and hallucinating. Can also swim in freezing Norwegian waters
      for long periods without suffering the risks of hypothermia or even frostbite.
    source_ids:
    - vsbattles-pit-modern-crossover-icons
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: "Standard melee range. Extended melee range with most normal melee weapons.\
      \ Several meters with Gungnir (Gungnir can easily extend its length to engage\
      \ several enemies at once while being a distance away from them). Hundreds of\
      \ meters with arrows. S\xFDnin can pinpoint targets upto several kilometers\
      \ away from her."
    source_ids:
    - vsbattles-pit-modern-crossover-icons
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted. Possesses incredible combat prowess and is skilled with dual-wielding
      multiple weapons at the same time no matter how disproportionate and unconventional
      they may seem, even being able to fight with two shields on both of her hands
      or even with a longsword in one hand and a spear in another. Could easily gain
      new skills by merely reading Books of Knowledge without ever having to train
      for them. Possesses all the memories of Odin, and after uncovering all of them,
      she effortlessly recognized Gungnir as Odin's spear, and managed to easily operate
      the Yggdrasil Supercomputer as if she had done it before. Is a great and cunning
      strategist, being able to easily forge alliances with local territorial leaders
      by winning them over with her charisma, partly owed to her immense talent in
      poetry and flyting.
    source_ids:
    - vsbattles-pit-modern-crossover-icons
    confidence: 0.6
    notes: auto_repair source extraction
