        in 2012) Classification: Genetically Engineered Dinosaur, hybrid of T-rex,
        Velociraptor (Jurassic Park), Carnotaurus, Giganotosaurus, Majungasaurus,
        Rugops, and Therizinosaurus as well as modern animals like cuttlefish, an
        unspecified species of tree frog, and a pit viper snake'
      source_id: mediawiki-pit-modern
      provider_id: vsbattles
      authority: high
