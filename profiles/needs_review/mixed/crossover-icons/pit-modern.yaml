    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Camouflage, Enhanced Senses (Thermal
        Vision), Body Control (Ability to control her body temperature), Large Size
        (Type 0, Type 1 in terms of length; Confirmed by Jack Ewins that when she
        is fully grown, she is 6.7 meters tall and 16.9 meters long), Bodily Weaponry
        (Claws and teeth), Loud Sound Generation (The Indominus Rex, as it can roar
        up to 160 decibels. 160 decibels sounds can also cause hearing loss or the
        rupture of eardrums), Limited Body Control (In the Jurassic Park universe,
        the dinosaurs were engineered to be all female as a form of population control.
        However, due to the inclusion of frog DNA to fill in genetic gaps, some dinosaurs
        could change sex and reproduce)
      source_id: mediawiki-pit-modern
      provider_id: vsbattles
      authority: high
      confidence: 0.75
