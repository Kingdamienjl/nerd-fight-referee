    - field: standard_equipment
      value: 'Various weapons listed here *On the ground: **Blaster: It shoots blaster
        bolts and has unlimited ammo, if charged up it can release a large blast that
        can send people flying in the air. **Gatling gun: A standard gatling gun that
        fires bullets at high speeds. **Machinegun: A standard machinegun that fires
        bullets at high speeds. **Homing Launcher: Shoots a missile that locks onto
        the target. **Plasma Cannon: A large double handed blaster that shoots plasma,
        it has unlimited ammo. **Sniper Rifle: A standard sniper rifle that can kill
        most enemies in one shot. **Grenade: A grenade that creates an explosion that
        kills on a 12 feet radius. **Sensor Bomb: A bomb that works as a mine, if
        something passes near it, it explodes. *Vehicles: *Arwing *Landmaster'
      source_id: vsbattles-fox-mccloud-game-crossover-icons
      provider_id: vsbattles
