    - field: intelligence
      value: 'Genius, likely Extraordinary Genius (Despite his timid nature, he is
        a combatant expert and a master plumber with decades of experience under his
        belt. He''s capable of driving and operating a multitude of vehicles/aircrafts,
        fighting off an entire alien invasion as an infant, and becoming incredibly
        skilled in paranormal investigation and engineering. He''s shared most of
        the same occupations as his brother, such as plumbing and doctoring. In Mario
        & Luigi: Superstar Saga, he was able to quickly master the Thunderhand technique,
        despite only obtaining it moments prior. Like Mario, Luigi was also able to
        complete The Perfect Run, Tubular, the Impossible Pack, and many more)'
      source_id: mediawiki-luigi-game
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Usually depicted as cowardly and a klutz, and he has somewhat of a phobia
        of ghosts. Most of his power-ups have a time limit or can be removed from
        an attack, though this is easily circumvented with the Bottomless Gloves.
        Lacks as much traction as Mario does when running, meaning he''ll occasionally
        slide along the ground for a second. | Dreamy Luigi and Luiginoids can only
        be usable in the Dream World. Notable Attacks/Techniques: |-|Common Attacks/Techniques=
        -Primary Offense= mario spin jump.png|Spin Jump. spin jump ml.png|Spin Jump
        (M&L Series). high jump ml.png|High Jump. luigi hammer.png|Hammer. super hammer.png|Super
        Hammer. ultra hammer.png|Ultra Hammer. Jump: Like Mario, Luigi''s main method
        of offense would be the use of his jumps. He will usually jump on his opponent
        and crush them with raw strength. Although his world-famous brother is far
        more notorious for his jumps, Luigi is notable for being able to jump higher
        than him. *Spin Jump: Luigi spins while jumping, allowing him to jump on spiky
        enemies and hazards such as buzzsaws and even Blarggs. This move can also
        allow Luigi to hover, slowly descend, deflect projectiles, and clear fogs
        and smoke. Using this move with the Fire or Ice Flower with make Luigi scatter
        fireballs or ice balls in multiple directions. *High Jump: The High Jump,
        also known as the Balloon Jump, is a move that Mario and Luigi can execute
        in the Mario & Luigi series. The function of the move is different in each
        game, but always serves the same purpose; to reach high places that are otherwise
        unreachable with a normal jump. Hammer: Like Mario, Luigi is also capable
        of effectively wielding a hammer for combat. Should his jumping attacks prove
        futile, he will resort to using this as a back-up. Applications can range
        from a simple swing and getting a First Strike, to reflecting projectiles,
        to an upgrade. *Super Hammer: An improvement over its predecessor, the Super
        Hammer allows for greater damage to be dealt and the ability to break objects
        its standard counterpart couldn''t achieve by itself. *Ultra Hammer: The Ultra
        Hammer is the third and final upgrade to the Bros. hammers. While it supposedly
        doesn''t deal more damage than the Super Hammer, it does allow for the Bros.
        to use the Cyclone Bros. technique. - Secondary Offense= thunderhand left.png|Thunderhand
        (Left). vicious vortex.png|Vicious Vortex. tornado swing.jpg|Tornado Swing.
        tornado ball.png|Tornado Ball. Mario zone speed.gif|Like Mario, Luigi can
        also use Zone Speed. Mario Galaxy spin.gif|Like Mario, Luigi can reflect projectiles
        at his enemies. Mario drill spin.gif|Like Mario, Luigi can spiral down like
        a drill. Inflicts double damage on spiky enemies. Mario double kick.gif|Like
        Mario, Luigi can execute a double kick. Mario magic weapon.gif|Like Mario,
        Luigi can create an energy-composed weapon. Thunderhand: Taught by the Thunder
        God. Luigi gathers lightning in his hand and discharges it at his target for
        critical damage. This ability can also lower defense and attack power. There
        are also many applications for this particular power, as showcased in the
        Bros. Attack combos. Tornado Swing/Ball: Luigi creates and launches a tornado
        by spinning around and then either throwing an object, with Tornado Ball,
        or striking his target, with Tornado Swing. Vicious Vortex: A move used in
        Super Mario Strikers. This move is Luigi''s Super Strike. He strikes a karate
        pose with a green vortex surrounding him before kicking the target. Zone'
