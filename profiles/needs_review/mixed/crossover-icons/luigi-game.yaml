    - field: weaknesses
      value: 'Varies but usually cowardly and clumsy. Has a phobia of ghosts. Notable
        Attacks/Techniques: *Thunderhand: Taught by the Thunder God. Luigi''s gathers
        lightning in his hand and discharges it at the target for critical damage
        which can lower defense and attack power. There''s a similar variant used
        in his Megastrike called "Thunder Luigi" which has a re-entry effect upon
        the object he strikes his lightning with. *Super Jump: Crouches down and rocket
        jumps into the air, damaging anything in his path. He has a similar variant
        called Super Jump Punch that delivers a powerful flaming uppercut in the first
        strike. *Green Missile: After charging up, he horizontally launches himself
        while exploding his target on contact. *Fireballs: Luigi shoots green fireballs
        that can defy gravity. He can launch up to five at once in Mario Kart: Double
        Dash. *Luigi Cyclone: Luigi can make a cyclone by throwing(Tornado Ball),
        kicking (Vortex Luigi), swinging a weapon at an object(Tornado Swing), or
        horizontally spinning himself. *Negative Zone: Luigi creates a zone with varying
        negative effects to his opponents such as slowing down, continuous damage,
        or falling asleep. *Luiginary Possession: With this power, Dreamy Luigi can
        possess just about anything. He has entered and altered people, objects, and
        even concepts like gravity and time itself. It is only really limited to Luigi''s
        imagination, which he doesn''t let run wild too often, unfortunately.'
