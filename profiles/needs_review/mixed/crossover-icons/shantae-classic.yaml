    - field: weaknesses
      value: "She is naive and can be tricked by highly intelligent people, Hair Whip:\
        \ Shantae\u2019s main weapon is the long tuff of purple hair attached to her\
        \ head. Amazingly she can swing this ponytail like a large whip-like weapon\
        \ to damage her opponents. Despite the ridiculous nature of these attacks,\
        \ the speed and power of them are clearly superhuman, allowing her to easily\
        \ destroy humanoid monsters, bust through armored opponents, and damage several\
        \ story high monsters with little effort. Shantae can also reflect some projectiles\
        \ with her hair whip, such as cannonballs, giving it some defensive properties,\
        \ Light Magic: As a half genie, Shantae contains the ability to use \u201C\
        light magic\u201D, a benevolent form of magic super effective against those\
        \ who use an eviler derived \u201Cdark magic\u201D(for example the Pirate\
        \ King at the end of the pirates curse game used dark magic). Shantae typically\
        \ manifests this magic through physical transformations or spells, which she\
        \ can activate with magic belly dances. Her light magic can also be manifested\
        \ through her hair during attacks for more direct dark magic enemy beat downs.,\
        \ Fire Manipulation: Shantae can manipulate fire with the help of magic. She\
        \ has 3 different uses for this. These are a magic spell that creates a large\
        \ fireball about the size of Shantae\u2019s body and sends in horizontally\
        \ along the air towards opponents, A powerful magic spell that creates 3 balls\
        \ of flame simultaneously and sends them horizontally away in a fan pattern\
        \ and a magic spell that produces a constant stream of fire akin to that of\
        \ a flamethrower., Fighter Moves: Having received training from Bolo, Shantae\
        \ can perform various martial arts techniques such as back dashes, aerial\
        \ recoveries and several types of kick attacks (Power Kick, Drill Kick, Uppercut\
        \ Kick), Transformations: Shantae can change her physical form into several\
        \ different ones with the use of her belly dancing. These forms resemble animals\
        \ and mythical creatures. Each different transformation provides different\
        \ abilities exclusive to them. These include... right, Monkey Belly dance:\
        \ A belly dance transformation that allows Shantae to transform into a monkey.\
        \ It\u2019s great for climbing up walls or fitting through tight spaces. After\
        \ collecting a talisman or totem called the monkey claw, Shantae can attack\
        \ opponents with her claws in this form, and perform a powerful horizontal\
        \ head-butt by flinging herself off a wall. right, Mermaid Belly dance: This\
        \ belly dance transforms Shantae into a mermaid, perfect for underwater exploration\
        \ and maneuvering. Shantae initially couldn\u2019t attack in this form, but\
        \ after gaining a separate talisman/relic called the mermaid bubble, she gained\
        \ the ability to spit large explosive bubbles from her mouth as an attack.\
        \ Due to being fish like, she can\u2019t move well on dry land in this form,\
        \ though nega Shantae (an evil counterpart of Shantae created when Risky took\
        \ control of her genie half in the Risky\u2019s revenge with a magic lamp)\
        \ could jump in midair and spin while rapidly shooting bubbles as an offensive\
        \ mermaid attack on dry land. Given nega-Shantae was a copy of the real one,\
        \ Shantae could likely perform the same maneuver. right, Elephant belly dance:\
        \ A belly dance that transforms Shantae in a large elephant. This form is\
        \ notably slow and bulky but has enhanced strength that can allow Shantae\
        \ to charge through large stone blocks/boulders with ease. After collecting\
        \ a separate talisman/relic called the elephant tote, she can also perform\
        \ a powerful ground pound move in this form as well. Her dark half nega Shantae\
        \ could quasai teleport into the air to attempt to crush opponents multiple\
        \ times with stomps during her boss fight. Given nega-Shantae was a copy of\
        \ the real one, Shantae could likely perform the same maneuver. right, Spider\
        \ belly dance: A belly dance that transforms Shantae into a large spider,\
        \ which can climb up walls for extra maneuverability. After Shantae collects\
        \ a talisman or relic called spider venom, she gains the ability to use venom\
        \ based projectile attack in this form. right, Harpy belly dance: A belly\
        \ dance that transforms Shantae into a harpy, which can fly freely through\
        \ the air with no restrictions. This allows for greater mobility and air superiority\
        \ over the enemy. After collecting a talisman or relic called the harpy\u2019\
        s claw, Shantae gains the ability to attack with the claws on her feet in\
        \ this form. right, 220px Tinker bat belly dance: A belly dance used to take\
        \ on the form of the common minions used by Risky Boots, the tinker bats.\
        \ This form allows Shantae to climb on walls, ram into objects at forces comparable\
        \ to the elephant transformation and attack opponents with a sword cutlass\
        \ like weapons. right, 220px Crab belly dance: In this form, Shantae gains\
        \ the ability to freely move along surfaces underwater and descend slowly\
        \ like a parachute in open water. Shantae also gains the ability to tuck into\
        \ he"
