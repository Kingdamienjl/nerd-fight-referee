    - field: durability
      value: At least Small Building level+ (Easily took many hits from Basim Ibn
        Ishaq, who should at the very least be comparable to, if not weaker than his
        Staff-equipped self, who in turn is at the very least equal to a Staff-amped
        Layla. High falls from enormous cliffs exceeding 53 meters in height are of
        little to no concern to her. Later trades blows on equal ground with Kassandra,
        who by this point has already obtained the Staff of Hermes, and after the
        fight she further compliments Eivor for her strength, with Kassandra herself
        later stating that she and Eivor were of a similar strength which allowed
        them to resist the curse on the island stemming from a Piece of Eden, on praising
