    - field: stamina
      value: Superhuman. Has no problems climbing high fjords in Norway and powering
        through multiple river raids in a single day, and withstood extensive torture
        from Kjotve's forces in her childhood. Survived being viciously bitten by
        a wolf in the neck as a mere child before proceeding to kill it with one axe
        swing while bleeding out and hallucinating. Can also swim in freezing Norwegian
        waters for long periods without suffering the risks of hypothermia or even
        frostbite.
      source_id: vsbattles-pit-game-crossover-icons
      provider_id: vsbattles
