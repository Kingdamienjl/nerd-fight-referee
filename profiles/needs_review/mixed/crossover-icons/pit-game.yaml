        Barrier * Special Attacks: Pit is able to use various special techniques after
        spending enough time in combat, unleashing devastating attacks that deal massive
        damage to all foes in Pit''s line of sight and shooting down all incoming
        projectiles to ensure the attack''s completion. Armspecialattack.jpg|Special
        Attack with Arm Weapons Bladespecialattack.jpg|Special Attack with Blades
        Bowspecialattack.jpg|Special Attack with Bows Clawspecialattack.jpg|Special
        Attack with Claws Orbitarsspecialattack.jpg|Special Attack with Orbitars Palmspecialattack.jpg|Special
        Attack with Palm Weapons Pit Angel Ring.gif|Angel Ring Palutena''s Army Final
        Smash.gif|Palutena''s Army * Angel Ring: Pit''s Side Special Attack in Super
