    - field: weaknesses
      value: 'Power-ups are lost after sustaining a deadly blow. Can also act out
        in "dumb" ways. Notable Attacks/Techniques: *Magic: Peach has multiple abilities
        linked to her magic. **Therapy: Peach heals herself or an ally, also removing
        negative status effects from them. **Come Back: Peach resurrects a fallen
        ally. **Mute: Negates any magic her foe can use. **Sleepy Time: Peach summons
        a horde of sheep, which force her foe to sleep. **Psychic Bomb: Peach summons
        a rain of bombs. *Peach Bomber: Peach launches her rear-end forward, which
        induces an explosion upon contact, blasting the foe away. *Megastrike: Peach
        utilizes tremendous re-entry force and magic to send a metal soccerball through
        the air with re-entry force of its own and splitting into six. *Ground Pound:
        A butt slam. *Energy Attacks: Peach can manipulate and bend her energy into
        multiple attacks. **Sphere: Peach forms a sphere of energy above her head,
        and throws it at her foe, which then homes in on the foe. The sphere can sometimes
        split into multiple, which all then home in on the foe. **Weapon: Peach forges
        a weapon of pure energy. Most notable is a hockey stick, which she can use
        to smack foes with. *Royal Gaze: The second Peach lays eyes on someone, her
        reaction speed multiplies itself several times over, making the character
        look nearly frozen, and allowing Peach herself to move at much greater speeds,
        allowing her to effortlessly land attacks she normally couldn''t. *Protection:
        Should Peach take a hit, and should Peach have allies, her magic commences
        and splits the force of the attack between her and all her allies, that way
        she doesn''t have to bear the blunt force alone. *Boomshots: Peach has many
        Boomshots she carries around. They do their job best in close quarters. **Blue
        Flame: A weak and basic Boomshot. **Big Top: A weak Boomshot with a 40% chance
        of inflicting Burn, lighting the foe aflame. **Crown Jewel: A decently powered
        Boomshot with a 40% chance of inflicting Freeze, freezing the foe solid. **Barracuda:
        A decently powered Boomshot with a 40% chance of inflicting Burn. **Block
        Blaster: A decently powered Boomshot with a 40% chance of inflicting Freeze
        as well as a 10% damage increase against smaller enemies. **Royal Rabbid:
        A decently powered Boomshot with a 40% chance of inflicting Burn as well as
        a 30% damage increase against knights. **Razzle Dazzle: A decently powered
        Boomshot with a 50% chance of inflicting Freeze. **Lavanator: A decently powered
        Boomshot with a 50% chance of inflicting Burn. **Kanagawa Powa: A moderately
        powered Boomshot with a 50% chance of inflicting Freeze. **Nasty Yella Fella:
        A moderately powered Boomshot with a 50% chance of inflicting Burn. **Bullion
        Bill: A moderately powered Boomshot with a 50% chance of inflicting Freeze
        as well as a 10% damage increase against tougher foes. **Smackerel: A greatly
