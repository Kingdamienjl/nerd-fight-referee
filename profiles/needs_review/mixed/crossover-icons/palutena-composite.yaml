    - field: weaknesses
      value: "Extremely arrogant. He's been shown to not kill opponents because of\
        \ this on several occasions. Some of his abilities get nullified of a character\
        \ has a Phantom Ruby prototype. Notable Attacks/Techniques: *Energy Spear:\
        \ Infinite shoots a lance of powerful energy which then explodes upon contact\
        \ with whatever it hits. *Null Space Rift: Infinite shoots out a small, black\
        \ energy sphere, which expands and begins inhaling like a black hole, erasing\
        \ whatever it consumes from existence. *Hypercube: Infinite summons red cubes,\
        \ using them to home in on an enemy or rising them as walls or even using\
        \ them as road blocks and such. If they touch the enemy, they will be transported\
        \ into a virtual reality. *Red Hellzone: If Infinite's foe is hit by his Hypercube,\
        \ they are injured and transported here, to a virtual recreation of reality\
        \ where Infinite can make anything happen, and where things are even more\
        \ dangerous. Infinite can activate different versions of this \"virtual reality,\"\
        \ and doesn't need to hit an enemy to activate it, either. *Virtual Reality\
        \ Clones: Infinite can create four characters using his Phantom Ruby illusions:\
        \ Shadow the Hedgehog, Chaos 0, Zavok, and Metal Sonic. These virtual versions\
        \ of the characters share the same exact build and all the same exact powers\
        \ as their original. Infinite can create an infinite amount of these clones,\
        \ too. **Virtual Shadow the Hedgehog: An exact replica of Shadow the Hedgehog,\
        \ retaining his powers of Chaos and the ability to turn into Super Shadow.\
        \ He has the ability to use all his spinning abilities, accompanied with Chaos\
        \ Control, Chaos Blast, and all his other Chaos powers. Finally, Virtual Shadow\
        \ can turn into Virtual Super Shadow if he gets the Chaos Emeralds, which\
        \ enables Super Shadow's actual abilities, like Spear of Light and Chaos Arrow.\
        \ **Virtual Chaos 0: An exact replica of Chaos 0, retaining his ability to\
        \ manipulate water and water body as well as the ability to turn into Perfect\
        \ Chaos. Due to being made of water, Virtual Chaos 0 has a sort of liquid\
        \ intangibility, can stretch his limbs, and of course, with each progressing\
        \ Chaos Emerald, he'll gain forms, like the original Chaos 0. **Virtual Zavok:\
        \ An exact replica of Zavok, retaining his ability to manipulate magnetic\
        \ fields, and thus completely destroy robots, mind control them, and manipulate\
        \ them. Virtual Zavok can also turn giant like the original, breathe fire,\
        \ and all that stuff. **Virtual Metal Sonic: An exact replica of Metal Sonic,\
        \ retaining his ability to scan enemies and replicate certain powers, bring\
        \ up the indestructible black shield, and turn into Neo Metal, Metal Madness\
        \ and Metal Overlord. Of course, Virtual Metal Sonic can also fly like his\
        \ original counterpart, too. Note: Credit goes to Metal for the Intelligence,\
        \ Range, Notable Attacks/Techniques\u200B\u200B\u200B\u200B\u200B\u200B sections.\
        \ I would also like to credit him for most of the information on the Powers\
        \ and Abilities section, as well as give huge credits to MasterOfTheJetBlackDragon\
        \ for the enormous amounts of scans for the feats and abilities."
