    - field: powers_and_abilities
      value: Superhuman strength, speed, reflexes, agility and durability, Perception
        Manipulation (Takes control of a person's visual and depth perception, allowing
        it to directly feed information to the brain, which enables Infinite to create
        illusions of entire worlds so complex it mimics many aspects of reality to
        a perfect extent. It's so powerful to the point that the illusions become
        real, and when in this illusion reality, if you're hurt, then you are harmed
        both physically and mentally in reality. This can be pushed to inducing Mental
        Breakdowns), Mental Hallucination Inducement (Can induce hallucinations via
        touch that can either bring about feelings of pleasure or torment), Flight,
        Energy Manipulation, Teleportation, Time Travel (The Phantom Ruby warped Sonic
        to Stardust Speedway, but in the past, as the past version in Sonic CD is
        green), Dual Warping (He has it on a limited scale, but Infinite is fully
        capable of manipulating virtual reality and reality itself at the same time,
        making something entirely real yet fake; making entire worlds, loopholes in
        time, and so on. Infinite can thus create, erase and redesign just about anything
        as he sees fit, turning something fake into something real, and vice versa.
        He can create virtual reality clones of himself, Shadow the Hedgehog, Chaos
        0, Zavok and Metal Sonic that all contain the same build and same powers as
        their real counterpart, making it virtually impossible to tell apart, and
        so on), Creation (Can create just about any illusion he pleases thanks to
        the Phantom Ruby, including celestial objects such as stars), Light Manipulation,
        Size Manipulation, Void Manipulation (Using Null Space, he can effectively
        erase things from existence, sending them to a space devoid of anything at
        all. Multiple Final Smashes create large voids), Dimensional Travel, Gravity
        Manipulation, Attack Reflection, Rectangular Constructs, Enhanced Swordsmanship
        (Prior to Sonic Forces' events, Infinite possessed a red sword, which he was
        a master at wielding. Multiple characters in Smash Bros. also wield swords),
        Resistance to Scanning (Tails--a mechanical genius--designed a machine that
        could scan things, and Infinite was immune to this), Battlefield Removal (Using
        Null Space and Triforce of Wisdom. Other Final Smashes like Grand Cross and
        Mega Legends can also be used for this purpose. Fire Manipulation (Final Smashes
        like Mario Finale, Triple Finish, and Roy's Critical Hit all grant this ability.
        Mario's Forward Smash, Mr. Game & Watch's Forward Smash, and Ridley's Forward
        Smash further show usage of this), Bow Manipulation (All Links wield a bow.
        The Ancient Bow and Arrow Final Smash also grants this ability), Sleep Manipulation
        (Using Peach Blossom and Daisy Blossom), Electricity Manipulation (Both Pikachu's
        and Pichu's Volt Tackle grant this ability. Most of their moveset shows further
        usage of this ability), Summoning (Using Infernal Climax, Petey Piranha, and
        NES Zapper Posse), Sealing (Young Link's Triforce Slash and Toon Link's Triforce
        Slash grant this ability), Soul Manipulation, Statistics Amplification (As
        a spirit, he enhances the powers of the fighters), Resistance to Gravity Manipulation,
        Enhanced Swimming and Invulnerability (These abilities are all granted with
        specific support spirits).
