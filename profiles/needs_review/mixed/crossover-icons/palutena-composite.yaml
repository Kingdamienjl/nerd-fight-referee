    text: High Multiverse level+ (Sega stated that Infinite is the strongest Sonic
      villain to ever appear in the Sonic Franchise, which makes him stronger than
      the likes of Solaris, who is described to be a Super-Dimensional lifeform, which
      makes Solaris on a higher level of existence than that of Illumina, who dreamed
      Maginaryworld into existence, a world in which the dreams of beings across multiple
      dimensions coalesce together becoming reality, turning into entire worlds and
      universes of their own. Maginaryworld also contains a realm known as the Fourth
      Dimension Space 4th Dimension, where all the infinite dreamworlds are stored.
      The manuals for the game also confirm that Eggman knew of the Maginaryworld's
      existence and that the Maginaryworld is a dimension. Infinite is also empowered
      by the Phantom Ruby, which was stated to be capable of breaking the boundaries
      of dimensions. In additon to this, The Phantom Ruby was implied by Eggman to
      be superior to the Master Emerald, which can control the seven Chaos Emeralds,
      which gave enough power to Sonic, Shadow and Silver to defeat Solaris) | High
      Outerverse level (Much like the other Smash Bros Fighters, Infinite is superior
      to Master Hand, who is considered to be the embodiment of creation that created
      the Super Smash Bros. verse, where infinite timelines are constantly being created
      in the Smash Bros. Universe, where it is stated that the fighters are actively
      trying to "become real" and are viewed as toys in the real world, where it includes
      Mario, who fought beings that can destroy the Dream Depot, which is infinite-dimensional.
      Comparable to the other Smash Bros. Fighters, who can harm the likes of Galeem
      and Dharkon, where said two are considered above the likes of Master Hand and
      Crazy Hand)
