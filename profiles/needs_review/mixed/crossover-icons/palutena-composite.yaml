      value: High Multiverse level+ (Sega stated that Infinite is the strongest Sonic
        villain to ever appear in the Sonic Franchise, which makes him stronger than
        the likes of Solaris, who is described to be a Super-Dimensional lifeform,
        which makes Solaris on a higher level of existence than that of Illumina,
        who dreamed Maginaryworld into existence, a world in which the dreams of beings
        across multiple dimensions coalesce together becoming reality, turning into
        entire worlds and universes of their own. Maginaryworld also contains a realm
        known as the Fourth Dimension Space 4th Dimension, where all the infinite
        dreamworlds are stored. The manuals for the game also confirm that Eggman
        knew of the Maginaryworld's existence and that the Maginaryworld is a dimension.
        Infinite is also empowered by the Phantom Ruby, which was stated to be capable
        of breaking the boundaries of dimensions. In additon to this, The Phantom
        Ruby was implied by Eggman to be superior to the Master Emerald, which can
        control the seven Chaos Emeralds, which gave enough power to Sonic, Shadow
