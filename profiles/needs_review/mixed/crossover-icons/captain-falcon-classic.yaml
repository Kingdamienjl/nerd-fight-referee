        Punch: Captain Falcon''s neutral special (and his most iconic move) charges
        a burning punch for a few seconds, while he yells his move name. Captain Falcon
        then striking the opponent, and he can change direction of the punch which
        will cause greater damage depending on the angle *Raptor Boost: Captain Falcon''s
        side special, he covers his arm in fire and lunges forwards, and uppercutting
        an opponent and launching them into the air *Falcon Dive: Captain Falcon''s
        up special, he leaps upward and grabs any opponent near him. If this happens,
        the opponent will explode and Captain Falcon will be pushed upward, and will
        be able to use this move again. This move also can grab shielded opponents
        *Falcon Kick: Captain Falcon performs a flaming fire kick, launching himself
        forward and shouting "Falcon Kick!" while doing so. If Falcon Kick is used
        in midair, he will launch himself downwards at a diagonal angle. *Knee Smash:
        Captain Falcon performs a midair knee strike. If the knee hits the opponent
        at the right angle, the opponent is knocked back greatly. *Blue Falcon: Captain
        Falcon screams come on! and summons his vehicle, the Blue Falcon, which flies
        through an area right in front of him. If any opponents are hit by the Blue
        Falcon while he summons it, they are transported to a racetrack where Captain
        Falcon runs them over at high speeds. ===Custom Moves=== *Falcon Dash Punch:
        Captain Falcon dashes towards his enemy while charging a Falcon Punch, releasing
        it at the end of his dash. This variation of Falcon Punch does less damage
        than the original. *Mighty Falcon Punch: Captain Falcon releases a less-powerful
        version of the standard Falcon Punch that has a much higher area of effect,
        though this attack leaves him vulnerable for longer than normal *Heavy Raptor
        Boost: Captain Falcon performs a Raptor Boost that has a slow-starting process
        and travels less distance, but does more damage and allows him to ignore knockback
        from weak attacks. *Wind-up Raptor Boost: Captain Falcon steps back before
        charging at the enemy with a Raptor Boost. The charge is faster in midair
        and leaves him less vulnerable to attack. *Explosive Falcon Dive: A stronger
        variation of Falcon Dive, but it takes longer to charge and Captain Falcon
        doesn''t jump as high compared to the original. *Falcon Strike: Captain Falcon
        jumps up and performs an explosive uppercut, damaging opponents above him.
        This move is faster than the original Falcon Dive and makes Captain Falcon
        much faster in the air. However, he cannot grab opponents. *Lightning Falcon
        Kick: Captain Falcon performs a faster variant of the standard Falcon Kick
        that deals significantly less damage and takes longer to charge, but it pierces
        through opponents and paralyzes them for a short moment. *Falcon Kick Fury:
