    - field: weaknesses
      value: 'He cannot leave Subspace on his own will and his attacks can leave him
        vulnerable. If his wings are broken, the Off Waves become weaker. Notable
        Attacks/Techniques: *Shark Blade - Tabuu transforms into a wide, somewhat
        shark-shaped blade, which flies horizontally across the stage. This attack
        is capable of breaking shields if it is not blocked using a perfect shield.
        *Diving Slash - Tabuu teleports high above one side of the stage, turns his
        arm into a blade of energy, and then dives at the player in a set curved arc.
        *Golden Bracket - Tabuu transforms into an energy cage (resembling two glowing
        yellow brackets) and flies across the stage, grabbing the character and slamming
        him/her/it into the floor. *Chain of Light - Tabuu produces a golden chain
        (similar to what he used to bind Master Hand) and throws it in front of him
        in an attempt to catch the enemy. If he succeeds, he will swing the enemy
        around before smashing them into the ground. *Electrical Shield - Tabuu teleports
        right next to the enemy. The purple sphere inside his torso splits into several
        fragments, which fly in circles around him for a short time while emitting
        electricity. This attack has a decent range, but leaves Tabuu wide open for
        projectile related attacks. *Rapid Chop - Tabuu teleports behind the enemy
        and repeatedly slashes the area in front of him, creating visible purple slashes.
        With this attack, Tabuu leaves himself wide open to projectiles. *Pinpoint
        Explosion - From one side of the stage, Tabuu makes a pointing gesture. Five
        locations along a line leading to the enemy''s current location will flash
        once and explode after about two seconds. This attack can be easily avoided.
        *Ghost Projection - Tabuu splits himself in half and shoots out many ghost
        images of himself in all directions, which explode after achieving a certain
        distance. These afterimages explode when they make contact with the ground.
        They can also be destroyed. *Dragon Laser - Tabuu appears on the side of the
        stage and manifests a dragon head, which floats beneath Tabuu as it spits
        out a powerful laser. *Bullet Rain - Tabuu appears in a random area in the
        air and fires a barrage of small bullets, finishing with a huge energy sphere.
        Easily avoided by keeping a safe distance from him. *Shuriken Boomerang -
        Tabuu appears on one side of the stage and throws a huge, circular, three-bladed
        shuriken, which flies across the stage like a boomerang before he catches
        it. *Off Waves - Tabuu teleports a good distance away from the opponent and
        unfolds his wings. He then releases some shockwaves that are capable of reverting
        the fighters into their trophy forms. Even after he was weakened from Sonic''s
        attack, these were capable of dealing major damage to his enemies. This is
        likely to be his most powerful attack. *Eye Lasers - Tabuu grows to a size
        so large that only his head appears on the side of the screen. He then fires
        a red laser from each eye, and only the lasers'' endpoints do damage. *Teleport
        - Tabuu teleports around the battlefield and appears around the enemy. He
        also sometimes teleports behind the enemy and uses one of his attacks. Tabuu
        makes a distinctive sound on his final teleport. *Explosive Teleport - Tabuu
        teleports around, leaving a red explosion in the place he just teleported
        from. Note #1: The names for most of the attacks in the Notable Attacks/Techniques
        section all come from Tabuu''s page on ssbwiki. Extra details about these
        attacks and their effects in the game itself can also be found there. The
        only names that are official are the Chain of Light and the Off Waves. ==Explanations==
        To clarify, the reason why I say Tabuu only somewhat scales to the fighters
        is the fact that he was only ever a threat due to his hax and he never demonstrated
        a solid feat showing superior attack potency to any of the fighters. Tabuu''s
        feats of repelling Master Hand and Ganondorf aren''t really solid when we
        consider the fact that Master Hand was weakened due to the Chains of Light
        and that Ganondorf never successfully landed a blow on his shield so we can''t
        that scales to him either. ==Others== Notable Victories: Notable Losses: Inconclusive
        Matches: Category:MasterOfTheJetBlackDragon Category:Tier 2'
