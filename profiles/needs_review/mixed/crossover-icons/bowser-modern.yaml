        chef], [https://youtu.be/zxhNV1lM37E?t=19 animal trainer], [https://youtu.be/3e4Qgl2e_T0?t=1870
        pilot], and [https://youtu.be/3e4Qgl2e_T0?t=752 submarine captain]. He can
        do a variety of things like [https://imgur.com/7i2IxiI play the guitar]Super
        Mario Odyssey, [https://imgur.com/PUjKUfP quickly repair a clear pipe with
        Luigi], and [https://imgur.com/xgXdzQ8 pilot a helicopter capable of lifting
        a giant gold statue of Peach]. As Dr. Mario, he could formulate his own megavitamins/pills,
