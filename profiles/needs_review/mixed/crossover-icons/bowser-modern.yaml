        lethal enough that a Shayde in Super Paper Mario claimed to have died from
        them. These same megavitamins were sought by a scientist, researcher, robotics
        engineer, and archaeologist, as well as [https://www.mariowiki.com/Mad_Scienstein
        Mad Scienstein], who needed them to treat a cold [https://youtu.be/Z8xsZPRj5mY?t=1962
        that he himself could not cure]. On the engineering side, Mario designed [https://youtu.be/GmOJN-zq6yg
        functioning robots] as far back as Donkey Kong Junior and later created the
        Mini-Marios, autonomous units that [https://youtu.be/6QzQ_G9ME3s?t=681 fight
        Donkey Kong and other enemies] throughout the Mario vs. Donkey Kong series.
        He also displays abnormal linguistic understanding with species such as [https://youtu.be/oVFqOQ4Yclw?t=138
        Yoshis], [https://youtu.be/HfkZtwKWqCI?t=480 Chain Chomps], and [https://youtu.be/IzhuT8MHWtI?t=87
        Shroobs], who don''t speak like the Mario Bros. or other human characters.
        Mario should have learned the Yoshi language through a lifetime of close contact
        with them, since nothing indicates that they formally taught it to him. Despite
        interacting with Chain Chomps almost exclusively in combat, he can still parse
        meaning from their combat utterances. Since the Shroobs only ever fought him,
        he understood a complex dead language after hearing only a few phrases across
        several days of battle. Beyond ordinary vehicles and aircraft, he has operated
        weaponized mechs, [https://www.youtube.com/watch?v=7TqDdENYbTg&t=918s cars],
        [https://www.youtube.com/watch?v=MfvMI7tb25Q&t=1647s spaceships while avoiding
        meteors], [https://www.youtube.com/watch?v=shzHRML9-sI&t=1061s bobsleds] [https://www.youtube.com/watch?v=7TqDdENYbTg&t=1791s
        down icy paths], [https://www.youtube.com/watch?v=c-ki9KoViuc&t=2117s a Koopa
        shell sled across an icy track], [https://www.youtube.com/watch?v=7TqDdENYbTg&t=96s
        tanks], and [https://www.youtube.com/watch?v=7G-uJAmqzRA&t=15961s various]
        [https://youtu.be/X8ZQueu40qs?t=2282 other vehicles] and [https://www.youtube.com/watch?v=LHJ2W7ryJuo&t=1500s
        unconventional aircraft]. Mario is also an experienced fighter and expert
        combatant who has battled and defeated a diverse array of foes using magic,
        unnatural powers, wildly different technologies, and multiple fighting styles.
        That expertise extends back to infancy, when he was already capable of piloting
        vehicles, skillfully using power-ups and weapons, and confronting an entire
        alien race that invaded his planet. He expertly utilizes a wide array of tools
        and weapons, including [https://youtu.be/Ip5oAXDsPVs?t=243 hammers], [https://youtu.be/g-QARJAvqmM?t=39
        swords], [https://youtu.be/30DyYkoNH9Q?t=50 Koopa Shells], [https://youtu.be/GmOJN-zq6yg?t=17
        robots], [https://youtu.be/yohLgD_bvYU?t=894 blasters], and more, with the
        Hammer as his greatest specialty. He has defeated [https://www.mariowiki.com/Jinx
        Jinx], a dojo sensei and master combatant who challenges him up to three times
        at increasing difficulty; Jinx was so impressed that he [https://youtu.be/MqXudczFB8U?t=565
        incorporated Mario''s fighting style into his training], renamed his dojo
        after the plumber, and made Mario the master. Alongside Luigi, he can also
        fight [https://www.mariowiki.com/Bowser_Memory_ML Bowser Memory M and Bowser
        Memory L], identical copies of the Bros. as Bowser "fondly" remembers them.
