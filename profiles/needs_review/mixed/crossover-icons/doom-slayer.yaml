    - field: intelligence
      value: '{{{content| Combat Genius. After being trained by one of the best High
        Rankers of the Ha Family, Ha Jinsung, Baam has mastered close-range combat
        with martial arts, displaying knowledge and skill of various fighting styles,
        although it is unknown what schools or types of arts he was taught by Jinsung,
        using shinsoo to enhance his skills to great effect. But even without shinsoo,
        because of his knowledge in fighting, he was almost able to battle on par
        with Aleksai Amigochaz. During the one year timeskip that leads up to the
        Hell Train Arc, Baam visited a number of martial art dojos and families in
        the Middle Area and learned their martial arts by enduring their strikes and
        blows, mastering them to the extent that he is able to mix and merge together
        the individual skills of hundreds of martial arts he knows and performs the
        skills simultaneously, leaving even someone of Daniel Hatchid''s level astonished
        with his skill, causing him to admit Baam''s fighting skills were quite impressive.
        Kaiser later commented on his fighting skills as being astonishingly refined,
        performing several swift and accurate martial arts moves that forced her to
        dodge and eventually even managed to restrain her arm with one leg to stop
        her from switching from Fenryl while dodging her sword strikes to deliver
        the finishing blow. He even fended off some of Data Zahard''s attacks in close-range
        after training with Data Eduan. In addition to improving his shinsoo control,
        the 2 years of intensive training he underwent, especially under the martial
        arts specialist Ha Chai, also allowed Baam to improve his skill in hand-to-hand
        combat considerably, his fighting style mixing both martial arts attacks along
        with shinsoo, able to seamlessly conjure projections of shinsoo and aim it
        at the enemy and their attacks to intercept them, improving his efficiency
        even further. At that point, Baam already displayed sufficient skill in unarmed
        combat to be able to successfully fight against Rankers, as shown when he
        skillfully fended off the attacks of R''s Twin in close-range off while simultaneously
        being able to deliver Piercing Techniques to eventually defeat him, and later
        on despite being physically outclassed by Pan, Baam was still skilled enough
        to be able to fight him off and eventually overtake him when he had been pushed
        back to deliver the Piercing Technique that finished Pan off. Though not known
        to use a sword before, apart from when he used Arie''s Swordsmanship with
        the Power of Souls to take down Hoaqin, upon acquiring the ability to transform
        his hand into the blade-like parts of Red Thryssa, Baam was shown to be quite
        skilled enough to be able to immediately make expert use of it, fending off
        assaults from Rankers of the level of Gado and Daleet effectively, even breaking
        the latter''s needle upon getting close, and quickly defeating Charlie, an
        elite Ranker, in close-combat, causing Charlie to admit Baam''s skill with
        the sword was quite impressive and made him much better in close-combat. He
        even briefly fended off White''s swordsmanship with the blade of Red Thryssa,
        exchanging and blocking some blows. }}}'
