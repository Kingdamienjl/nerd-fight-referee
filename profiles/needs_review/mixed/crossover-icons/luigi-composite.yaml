    - field: weaknesses
      value: "Has phasmaphobia (The morbid fear of ghosts) and his Power-ups are lost\
        \ after sustaining a deadly blow. Can act brash at times. Notable Attacks/Techniques:\
        \ *Jumping: Luigi's most iconic power. He was naturally born with a gifted\
        \ power in this department. He can casually leap 35 feet into the air and\
        \ beat Mario's distance by a foot. At his best, he can theoretically leap\
        \ 85 feet into the air and beat Mario's distance by four feet. **Spin Jump:\
        \ Renders Luigi immune to spiky foes and objects, such as buzzsaws. It also\
        \ slows Luigi's descent drastically, and if combined with Fire or Ice Flowers,\
        \ can spread-shot fireballs or iceballs. **Super Jump Punch: If connected\
        \ at the very beginning of this leap, it'll set foes aflame and send them\
        \ rocketing into the air reaching the double digits of feet. If connected\
        \ anywhere else, does no damage at all. **Scuttle: Luigi kicks his feet, extending\
        \ his jump height and distance by a tiny bit and slowing his descent a tiny\
        \ bit. **Super Jump: As Paper Luigi, he can crunch himself down like a pancake,\
        \ then spring upwards with a powerful uppercut that also sends him nearly\
        \ 100 feet into the air. *Elemental Manipulation: Luigi has come in control\
        \ of various elements throughout the games. **Electrokinesis: Luigi's most\
        \ proficient element. He can summon lightning bolts that have heat of 30,000\xB0\
        C and that cause craters. He can also shoot off balls of electricity and by\
        \ touching someone, can paralyze their entire body. **Pyrokinesis: Luigi can\
        \ throw the basic Fireball and spread-shot it into five, just like Mario.\
        \ It's weaker, however. Being at least 7,500,000\xB0C. **Cyrokinesis: Luigi\
        \ can throw a basic iceball that freezes the foe solid upon contact. **Aerokinesis:\
        \ Luigi can throw tornadoes and hit something, encasing it in a tornado via\
        \ Tornado Swing. *Green Missile: Luigi fires forward, bashing into a foe.\
        \ Nine times out of ten, this becomes the \"Crit Missile.\" The Crit Missile\
        \ fires Luigi forward with twice the speed and power of the regular Green\
        \ Missile, PLUS a fire effect. *Luigi Cyclone: Luigi twirls around extremely\
        \ quickly, capturing foes within an onslaught of slaps. *Megastrike: Luigi\
        \ makes use of tremendous re-entry force and blasts a metal soccerball w/\
        \ lightning, splitting it into six and giving it re-entry force of its own.\
        \ *Ground Pound: An ass slam. *Star Spin: One of Luigi's stronger attacks.\
        \ This can draw in items Luigi might need, improves his swimming capabilities,\
        \ and deflects projectiles. Said projectile will then home back in towards\
        \ the area from whence it came. **Star Pound: A combination of the Star Spin\
        \ and Ground Pound. This homes in on foes. *Plumb-Fu: An ancient form of karate\
        \ that plumbers use. Can even be used underwater normally, despite the buoyancy.\
        \ *Energy Attacks: Luigi can manipulate and bend his energy into multiple\
        \ attacks. **Sphere: Luigi forms a sphere of energy above his head, and throws\
        \ it at his foe, which then homes in on the foe. The sphere can sometimes\
        \ split into multiple, which all then home in on the foe. **Weapon: Luigi\
        \ forges a weapon of pure energy. Most notable is a hockey stick, which he\
        \ can use to smack foes with. *Luiginary Possession: With this power, Dreamy\
        \ Luigi can possess just about anything. He has entered and altered people,\
        \ objects, and even concepts like gravity and time itself. It is only really\
        \ limited to Luigi's imagination, which he doesn't let run wild too often,\
        \ unfortunately. *Team Attacks: These attacks are effectively executed with\
        \ the help of Mario. Thus, they are preferably used only for tag team battles\
        \ pitting the two on the same team. In spite of this, it doesn't mean they're\
        \ impossible to use individually. Even then, a few require outside help from\
        \ characters besides Mario. These cover attacks involving Luigi. **Bros. Attacks:\
        \ Attacks used in Superstar Saga, Dream Team and Paper Jam. ***Bounce Bros.:\
        \ Luigi bounces off Mario\u2014who launches him upwards as well with his hands.\
        \ The latter then dashes forward and leaps upwards, latching onto Luigi\u2019\
        s legs as the two spin upside-down and crash into the enemy\u2019s head. ****Advanced\
        \ Bounce Bros.: Luigi jumps up as Mario immediately grabs his legs and flips\
        \ them upside-down, flying forwards. Luigi launches them back up again as\
        \ the two separate and stomp two enemies at once. ***Knockback Bros.: Luigi\
        \ spins behind Mario, who spins in front of him. Luigi then pulls out his\
        \ Hammer and thwacks Mario in the head, making him small. He then reels his\
        \ Hammer back and launches Mario forward in a ball, hitting the foe and landing\
        \ before returning to normality. ****Advanced Knockback Bros.: Luigi spins\
        \ behind Mario, who spins in front of him. Luigi then pulls out his Hammer\
        \ and thwacks Mario in the head, making him small. He then reels his Hammer\
        \ back and launches Mario forward in a ball, hitting the foe and returning\
        \ to the green plumber, who then begins to rapidly swing, launching Mario\
        \ back into the enemy over and over. The process repeats until they fail.\
        \ ***Thunder Bros.:"
