      value: Gifted (As the Goddess of Light and Protector of Humanity, she has watched
        over the Human World for an indeterminate amount of time and is generally
        considered very wise and knowledgeable. She has access to all of the Powers
        in Pit's arsenal and can use them at will while Pit himself is limited to
        a handful at a time. In addition, she has held her own against the likes of
        Pit on one occasion and has a tendency to plan out most of his battles by
        directing him throughout his adventures. She is also a capable strategist,
        leading her military forces (albeit, which consist mostly of Pit) to victory
        on countless occasions and repeatedly analyzing her foes' abilities, strengths,
        and weaknesses to find openings. Like Pit, she also has knowledge of Nintendo's
        other properties and the fourth wall, mentioning them off-handedly on numerous
        occasions and giving Pit counsel and advice when he does battle at her temple)
