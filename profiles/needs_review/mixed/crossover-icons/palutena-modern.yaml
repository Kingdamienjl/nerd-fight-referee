    - field: weaknesses
      value: 'Palutena is sometimes too playful and teasing for her own good, Can
        be taken by surprise (was defeated by Medusa''s surprise attack the first
        time around) and is prone to becoming a damsel in distress due to her own
        actions; for example, being captured by Medusa and then later being victim
        of the Chaos Kin she indirectly freed. Notable Attacks/Techniques: *Palutena
        Glam Blaster: A fierce attack Palutena uses to finish the Three-Headed Hewdraw
        if Pit doesn''t finish the last head quickly enough, killing it in one shot.
        *Cover Your Eyes!: Palutena raises her shield and charges her light power,
        then unleashes it blinds her target with light, if in range. This lasts for
        about three seconds. *Time for a Sacrifice!: Palutena shoots a large, slow-moving
        ball of teal light that hones in on her target. Palutena can shoot up to three
        in quick succession. *Kneel Before Me!: Palutena waves her staff and shoots
        three fast-moving columns of light across the stage. *Poor You!: Palutena
        launches a halo that resembles her own across the ground. The halo hones in
        on her target and chases it, and it additionally shoots its own light projectiles
        at her target, up to three times before evaporating. *This Might Sting!: When
        her target is nearby, Palutena raises her staff and zooms forward in a huge
        column of light, blazing toward her target at great speed, covering a great
