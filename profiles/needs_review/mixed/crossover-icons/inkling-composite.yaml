power_scale:
  tier:
    text: '{{8-C}} with anti-personnel blaster cannons, {{8-C}}, up to {{8-A}} with
      mass-driver cannon Name: All Terrain Tactical Enforcer (AT-TE) Origin: Star
      Wars Classification: Armored assault vehicle Users: Galactic Republic (Grand
      Army of the Republic), Galactic Empire (Imperial Army), Alliance to Restore
      the Republic Length: 22.02 metres Height: 9.57 metres Material: Armor plating
      made of durasteel and various composite materials Prerequisite for use: Trained
      crew of 7 (1 pilot, 1 spotter/co-pilot, 5 gunners) (This excludes additional
      complement of 20 to 30 additional soldiers and two AT-RT units) Terrain: Ground'
    source_ids:
    - mediawiki-inkling-composite
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "Building level+ with laser cannons (Armed with Maad-21 heavy laser cannons,\
      \ which should be somewhat comparable to the Maad-38 heavy laser cannon on the\
      \ AT-DP walker1.5845 tons of TNT, or 6.6294 gigajoules), Building level+ up\
      \ to Multi-City Block level with mass-driver cannon (Variable yield weapon whose\
      \ potency depends on the type of shell being fired and the power setting chosen.\
      \ On the lower end of the scale, a single shot surpassing the power of a Class-A\
      \ Thermal Detonator can obliterate a trio of fully shielded Droidekas. On the\
      \ higher end of the scale, shots can ravage the unshielded engines of capital\
      \ ships and blast through the \u201Cneck\u201D section of an AT-AT with one\
      \ shot, proving that they completely eclipse starfighter grade laser cannons.\
      \ During the Second Battle of Geonosis, fire from several AT-TEs collapsed a\
      \ Geonosian Droid Factory)"
    source_ids:
    - mediawiki-inkling-composite
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Superhuman travel speed (55 to 60 km/h15.2777 to 16.6667 m/s), Relativistic+
      up to Speed of Light attack speed with blaster weaponry (Most energy weapons,
      including Blasters, Laser Cannons and Turbolasers, direct invisible beams at
      lightspeed. The bolt seen when a weapon is fired is actually a pulse of plasma
      traveling along the beam at less than lightspeed"Naval Weapons and Equipment".
      Star Wars Encyclopedia. De Agostini Publishing, 20210.9c to 1c)
    source_ids:
    - mediawiki-inkling-composite
    confidence: 0.6
