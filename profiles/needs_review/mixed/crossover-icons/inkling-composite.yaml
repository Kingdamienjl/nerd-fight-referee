    - field: intelligence
      value: Gifted (Inklings are hard-wired for battle, to the point that they have
        been described as having no room in their mind for anything other than fashion
        and battle. Every Inkling is skilled with a wide variety of weapons, and Inklings
        regularly participate in mock wars on a daily basis, often multiple times
        a day, to test their skill in combat. Despite their seeming single-mindedness,
        Inklings are actually highly intelligent, even going so far as to refer to
        humans as primitive beings with little intelligence, with said humans having
        been advanced enough to create functional cryogenic pods that were able to
        work for 10,000 years)
      source_id: vsbattles-inkling-composite-crossover-icons
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Unable to swim in water, Ink inhibits the movement of Inklings that
        do not have a matching color, They are extremely vulnerable in their squid
        form outside of ink, Ink cannot be used on glass Notable Attacks/Techniques:
        *Ability Doubler: Doubles the effect of other abilities. *Bomb Sniffer: Allows
        Inklings to easily spot opponents'' bombs as skull icons that can be seen
        even through walls. *Cold Blooded: Shortens the duration of any position-tracking
        effects inflicted on the Inkling. *Comeback: Improves ink efficiency, ink
        recovery rate, mobility, and Special Gauge fill rate for the first twenty
        seconds after regenerating. *Drop Roller: Allows the Inkling to roll after
        performing a Super Jump or when jumping back to the Ink Jet''s starting point.
        *Haunt: Tracks the opponent that splatted the Inkling. *Ink Resistance Up:
        Mitigates the negative effects of touching the opponent''s ink on the ground,
        including reduced jump height, reduced movement speed, and accumulation of
        damage. *Last-Ditch Effort: Boosts ink recovery rate and weapon ink efficiency
        for the last 30 seconds of battle. *Ninja Squid: The Inkling does not leave
        ripples while swimming in ink on horizontal surfaces and ramps. However, swim
        speed is slowed slightly. This ability does not affect swimming on a vertical
        surfaces. *Object Shredder: Increases the damage its user deals to objects,
        weapons, and barriers. *Opening Gambit: Boosts run speed and swim speed for
        the first 30 seconds of a fight. *Recon: The Inkling can see where their opponent
        is and what weapons they have. *Respawn Punisher: Increases the amount of
        time it takes for an enemy Inkling to regenerate and the amount of Special
        Gauge that is lost. *Stealth Jump: the Inkling can make Super Jumps without
        telegraphing their landing position. *Super Jump: An ability that Inklings
        have that allows them to jump very high in the air in order to land somewhere
        else. *Tenacity: Causes the Special Weapons gauge to fill faster the less
        allies the Inkling has. *Thermal Ink: Shows the location of opponents to the
        Inkling for 12 seconds after directly damaging them with their primary weapon,
        but only while the opponent and the Inkling are a few meters apart. Enemies
        are located with a white silhouette, and the further away the enemy is, the
        brighter the silhouette will be. *Automatic: **Sploosh-o-matic: A mid-damage,
        close-range shooter with a high rate of fire. It features the highest damage
        output per second in its class, at the cost of having the shortest range.
        **Splash-o-matic: A low-damage, close-range shooter with a high rate of fire.
        It features near-perfect accuracy, the best among all automatic shooters.
        **Splattershot Jr.: The first weapon given to the Inkling. It is a low-damage,
        close-range shooter with a high rate of fire. Its fire rate and ink efficiency
        ensure that new Inkling will be able to accomplish something. **Aerospray:
        A low-damage, close-range shooter with a high rate of fire. It has the widest
        shot spread and the fastest firing rate in its class, allowing it to excel
        at covering turf. **Splattershot: A mid-damage, mid-range shooter with a middling
        rate of fire. Has no real weaknesses and can adapt to any situation. **.52
        Gal: A high-damage, mid-range shooter with a slow rate of fire. This weapon
        suffers from low accuracy. **N-ZAP: A low-damage, mid-range shooter with a
        fast rate of fire. **Dual Squelcher: A low-damage, long-range shooter with
        a middling rate of fire. **Splattershot Pro: A mid-damage, long-range shooter
        with a slow rate of fire. Notably, this weapon has very high ink consumption.
        **.96 Gal: A high-damage, long-range shooter with a slow rate of fire. As
        a trade-off for its power and range, this weapon suffers from low accuracy,
        and it consumes more ink per shot than any other weapon in its class. **Jet
        Squelcher: A low-damage, long-range shooter with a slow rate of fire. It has
        the longest range in its class. *Blasters: **Luna Blaster: A high-damage,
        close-range blaster with a middling rate of fire. **Blaster: A high-damage,
        close-range blaster with a slow rate of fire. **Range Blaster: A high-damage,
        mid-range blaster with a slow rate of fire. **Rapid Blaster: A mid-damage,
        long-range blaster with a fast rate of fire. **Rapid Blaster Pro: A mid-damage,
        long-range blaster with a middling rate of fire. **Clash Blaster: A low-damage,
        close-range blaster with a fast rate of fire. *Burst-Fire/Semi-Automatic:
        **L-3 Nozzlenose: A low-damage, mid-range shooter. It is burst-fire, firing
        three bullets after a pull of the trigger. Well-timed button presses are required
        to maintain an optimal rate of fire. **H-3 Nozzlenose: A mid-damage, long-range
        shooter. It is burst-fire, firing three bullets after a pull of the trigger.
        **Squeezer: A shooter with two firing modes, semi-automatic and fully automatic.
        Pulling the trigger once will squirt out a single long range, low spread,
        high-power ink shot. Holding the button leads to successive low range, high
        spread, lower-powered'
