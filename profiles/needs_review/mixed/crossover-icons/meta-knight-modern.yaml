        tornadoes in his immediate vicinity, heavily damaging all who are caught within.
        In some cases this tornado is localized around Meta Knight, simultaneously
        damaging foes and protecting him from attack. *Galaxia Darkness: Meta Knight
        swings his cape at his opponent, paralyzing them and covering the surrounding
        area in pitch-black darkness should it connect. After a few seconds, the target(s)
