  stamina:
    text: "Superhuman. On par with Kirby and Meta Knight. Seemingly unaltered without\
      \ being able to dream, which made everyone in Dream Land feel restless and irritable,\
      \ even by the time Kirby completed most of his adventure and fought DededeKirby's\
      \ Adventure. Fought Kirby from the night until the sunset in the story of the\
      \ first gameSpring Breeze \xB7 Kirby Super Star Ultra, then the same happened\
      \ some time later, if Kirby had to first spend some time in Dedede's castle\
      \ as a level, with the windows showing it was still night when he reached Dedede.\
      \ Capable of defeating Queen Sectonia, Shadow Dedede, and Dark Meta Knight in\
      \ a gauntlet style fight | Superhuman. As before. Along other Star Allies, he\
      \ can chase the Jamba Heart pieces several times across the Story Mode, covering\
      \ some parts of several planets and moons, if they chased the pieces via a Warp\
      \ Star while over Planet Popstar (Level 2 map) and between celestial bodies\
      \ (Level 4 map). 4 of any Star Ally can complete an adventure of several levels\
      \ and bosses without any notable rest, ultimately defeating Zan Partizanne,\
      \ Hyness (2 phases), and Void Termina (4 phases) one after another"
    source_ids:
    - mediawiki-meta-knight-modern
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: "Below Standard Melee Range physically (A little more than twice as big\
      \ as Kirby, who is 20cm tall), Standard Melee Range to Extended Melee Range\
      \ with limited forms of Energy Projection and throwable weapons that doesn't\
      \ extend much from his body, Kilometers or Tens of Kilometers via spitting (8\
      \ to 14.5 kilometers; Spat Kirby into Planet Popstar's atmosphere), up to Planetary\
      \ length in destructive capacity (A fully changed & prepared strike can create\
      \ a thin crack going from one side of Planet Popstar to the opposite side of\
      \ the planet, explicitly incomparable to his AP by the end of itCrackity Hack\
      \ \xB7 Kirby's Return to Dream Land DeluxeNote that the destruction seen inside\
      \ Popstar continues offscreen before reaching the other side of the planet,\
      \ only visually reaching earth with some magma in it. The measure that goes\
      \ up to \"999.99\" both doesn't stand for anything and is just a point of reference\
      \ for the game rather than distance, as its highest value unevenly reaches a\
      \ much higher distance than anything lower.. Higher physical range with some\
      \ Boost Orbs (If they increase the range of his attacks), Interdimensional via\
      \ Dimensional Travel (Via Warp Stars [See their feats]), Tens of Meters with\
      \ Scope Shot gunKirby's Return Dream Land"
    source_ids:
