      value: "A technique Meat Knight can access to with at least another known ally\
        \ with similar control over energy, such as every Star Ally. **In Return to\
        \ Dream Land & its remaster when piggybacking an ally or more, they can briefly\
        \ charge energy to use a special attack, the more allies charging energy,\
        \ the more powerful the attack will be. The form of the attack depends on\
        \ the ally below, which is shooting it. Meta Knight uses his sword to launch\
        \ a giant beam with the form of Galaxia that can pass through enemies. Meta\
        \ Knight & all other allies in-game (Kirby, King Dedede, and Bandana Dee)\
        \ can use their Team Attack to push back and warp the waves of space that\
        \ were consuming interstellar parts of Another Dimension. **[https://youtu.be/RWQQQAb49TE?t=210\
        \ In Star Allies] when piggybacking an ally or more, they can briefly charge\
        \ energy to shoot an energy beam (without using Galaxia). The more allies\
        \ charging energy, the more powerful the attack will be. Given that the partner\
        \ can be another Meta Knight, this is a power he can do on his own. *Duplication\
        \ (2\xB0 variant): In Star Allies and [https://imgur.com/MsrDY9O thanks to\
        \ being under the influence of a] Jamba Heart, Meta Knight gained the ability\
        \ to turn into a mass of energy, split into up to 4 masses of energy, have\
        \ each turn back into a Meta Knight and attack targets like that, each duplicate\
        \ having a comparable strength, durability and the same abilities as the unsplitted\
        \ Meta Knight, each performing different actions. As of Fighters 2 Meta Knight\
        \ showed to have maintained this power. *Telekinesis: As of Star Allies and\
        \ while under the influence of a Jamba Heart, which was amping him, Meta Knight\
        \ could infuse rocks with energy to control them with gestures, throwing them\
        \ into certain direction of the battlefield. He could also generate a sphere\
        \ of energy to send at targets and trap them inside for a while on contact.\
        \ As of Fighters 2, Meta Knight showed that he could still infuse things with\
        \ energy to manipulate them, ripping off rocks from the floor. He potentially\
        \ also maintains his ability to trap targets in energy. *Grab: Grabs a target\
        \ and kicks it away ahead or behind him. right|300px *[https://imgur.com/a/qP8Cnmj\
        \ Ghost form]: Once dead, he can transform into a ghost, his only objective\
        \ in this state is to bring himself back to life. In-game, he can't be destroyed\
        \ or defeated by others who can harm ghosts as Meta Knight's health is already\
        \ gone. Meta Knight doesn't have access to the moves he had with his body\
        \ but presumably maintains his resistances, his mobility is also slightly\
        \ slower than when alive. There is no limit to the amount of times Meta Knight\
        \ can access this form when dying. This form was originally only used by Kirby\
        \ as 1 of his Copy Abilities, but since Fighters 2 it was no longer said to\
        \ be a Copy Ability and became a transformation several characters could use\
        \ (meaning that they have no reason to share other powers the Ghost ability\
        \ has), the reason why they can be defeated during canon plots without using\
        \ this is due to the cartoonish nature of the verse and this power. **Flight:\
        \ As a ghost, Meta Knight naturally floats and can fly around at will.right|300px\
        \ **Attack, Double Attack & Tackle: A slap (or slaps), charged slaps and a\
        \ tackle forward respectively. Managing to land any attack against living\
        \ opponents will result in Meta Knight's body being quickly recreated, though\
        \ he would be with low \"health\". Although this presumably works by way of\
        \ absorbing some of the health/life of a target (hence it needs to be hit)\
        \ the process can technically be done through having an item hitting the target\
        \ or firing energy at them, meaning that physical contact isn't necessary.\
        \ **Vanish: Disappears, becoming invisible and intangible even to other characters\
        \ in Ghost form. Meta Knight can move but not attack like this, and re-appear\
        \ at will. ===Optional"
