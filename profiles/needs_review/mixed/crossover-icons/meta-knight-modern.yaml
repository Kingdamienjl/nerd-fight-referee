      value: ''''''' ''''''Genius''''''. Among the [[Meta-Knights]], [https://imgur.com/a/AZ41NCf
        they built the] [[Halberd]], a futuristic ship with enough power to harm an
        early Kirby and a speed possibly superior to him. [[User blog:Eficiente/Kirby:
        Translations for guides & books#Kirby of the Stars Super Deluxe 100% Strategy
        Book|The Meta-Knights created]] [[Heavy Lobster]], which Meta Knight might
        have contributed on. Meta Knight is a capable leader, having the utmost respect
        and loyalty of his army of [[Meta-Knights]], with whom he tried conquering
        Dream Land once [https://youtu.be/5T9VMH34L3Y?t=26 to put an end to their
        lazy lifestyle], presumably only failing due to Kirby''s intervention (as
        Meta Knight alone is repeatedly shown as superior to everyone there besides
        the Pink Puffball). If the Kirby Personality Quiz is anything to go byThe
        Kirby Personality Quiz should be taken with a grain of salt, most of the info
        could be made up as it has different Copy Abilities from Kirby as different
        personalities, but a more solid effort was put into individual characters
        like Meta Knight. It being on the official Kirby website & posted in the official
        twitter while using renders of canon characters doesn''t necessarily mean
        it portrays the characters as they are in canon, but in general as they are
        across different continuities that they also advertise, being just some game
        for fun. Still, the info it gives is fitting to what the games show of Meta
        Knight., [https://kaialone.tumblr.com/post/624538997886255104/official-kirby-personality-quiz-results
        then he makes for a good leader with great determination who holds strong
        beliefs about pushing for higher ideals. He''s quick to figure out the nature
        or relevance of things, approaching them from multiple angles, but since he
        rarely lets his emotions show, people tend to think of him as aloof. Whatever
        he might dare to try, he can safely rely on his own beliefs and intuition.
        And he shows a brilliant mastery of the sword during battle]. Often referred
        as a skilled swordsman, [https://imgur.com/a2yPFR4 Meta Knight trains every
        day] & [https://imgur.com/jJtu92B never misses a chance to train], which gives
        him a remarkable amount of experience when around 1000 years happened at one
        point in the series. [https://imgur.com/a/9bvp1QE It would be no exaggeration
