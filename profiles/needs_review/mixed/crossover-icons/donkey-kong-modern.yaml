    - field: standard_equipment
      value: 'Barrels: Barrels (also called Plain Barrels, Wooden Barrels, Normal
        Barrels, or Regular Barrels) are objects that can be used in a variety of
        ways, most commonly as projectiles that can be thrown to attack other characters.,
        Coconut Shooter: The Coconut Shooter (also known as the Coconut Cannon, and
        called the Coconut Gun in the DK Rap) is the personal weapon of Donkey Kong
        in Donkey Kong 64. It resembles a hollowed-out log with a twig sticking out
        of it, the twig is possibly the weapon''s crosshair. As the name implies,
        the Coconut Shooter shoots out coconuts. He is limited to 50 Coconuts for
        ammo., Bongos: Bongos are drum-like instruments first encountered in the game
        Donkey Kong 64, however, they have become much more used in the Donkey Kong
        franchise since then. In Donkey Kong 64, a pair of Bongos can be purchased
        by Donkey Kong from Candy Kong in Candy''s Music Shop. With these bongos Donkey
        Kong is able to use the special attack, "Bongo Blast". The attack sends out
        soundwaves that can defeat any nearby enemies, if Bongo Blast is used on a
        Bongo Blast Music Pad then it will cause an event to occur., Orange Grenades:
        An orange, also known as an Orange Grenade, is an explosive fruit and collectible
        weapon that appears in every level of Donkey Kong 64. It looks like a regular
        orange but has a grenade pin on top. He is limited to 20 Oranges., Bananas:
        Bananas are the ubiquitous items appearing in every Donkey Kong Country and
        Donkey Kong Land game to date. They work similarly to the Coins from the Super
        Mario franchise. In these games, for every one hundred bananas collected,
        the player is granted an extra life. Banana Bunches, which are worth ten regular
        bananas, appear very frequently as well. In Donkey Kong Country, bananas and
        Banana Bunches are common within Bonus Areas, even having a type specifically
        featuring them, "Collect the Bananas!". Throughout the game, Donkey Kong can
        sometimes reveal a Banana Bunch by using Hand Slap in a specific location.
        Additionally, hoards of bananas can be seen in the boss areas. Bananas can
        also be used to heal Donkey Kong should he be injured., Power Star., Power
        Star: Collectible items debuting in Super Mario 64, Power Stars are mythical
        artifacts that usually act as a means for level progression. However, they''ve
        also showcased a variety of different powers throughout the series and remain
        among the more recognizable objects in Super Mario., Optional'
      source_id: vsbattles-donkey-kong-modern-crossover-icons
      provider_id: vsbattles
