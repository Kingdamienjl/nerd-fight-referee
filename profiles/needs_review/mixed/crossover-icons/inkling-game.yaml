        **Rapid Blaster: A mid-damage, long-range blaster with a fast rate of fire.
        **Rapid Blaster Pro: A mid-damage, long-range blaster with a middling rate
        of fire. **Clash Blaster: A low-damage, close-range blaster with a fast rate
        of fire. *Burst-Fire/Semi-Automatic: **L-3 Nozzlenose: A low-damage, mid-range
        shooter. It is burst-fire, firing three bullets after a pull of the trigger.
        Well-timed button presses are required to maintain an optimal rate of fire.
        **H-3 Nozzlenose: A mid-damage, long-range shooter. It is burst-fire, firing
