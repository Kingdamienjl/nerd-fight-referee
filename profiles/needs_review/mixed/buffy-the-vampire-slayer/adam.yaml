    - field: powers_and_abilities
      value: "Base \u25BE= *Superhuman Physical Characteristics *Regeneration (Low-Mid;\
        \ She is stabbed in the back with a sword and resumes fighting shortly after.\
        \ She said that her regeneration ability is as fast as angel) *Martial Arts\
        \ and Weapon Mastery (As with every Slayer, Buffy possessed a natural proficiency\
        \ with virtually all forms of weaponry and unarmed combat styles, and in addition\
        \ to this she had years of combat training to hone in her skills using various\
        \ martial arts (particularly jiu jitsu and aikido). With zero training and\
        \ effort, Buffy effectively uses official weapon maneuvers and styles to defeat\
        \ Giles on the first day of quarter staff training. Trained for years by Giles.\
        \ She was trained by Angel, a 200+ year old vampire. She uses a hybrid combat\
        \ form. She has thousands of years of slayer combat experience, martial arts\
        \ skill and knowledge) *Marksmanship (She shot a fly with a needle she threw\
        \ from her mouth) *Accelerated Development (When a potential slayer becomes\
        \ a slayer, she has the combat experience, knowledge, and martial arts mastery\
        \ of all previous slayers. Buffy soon becomes strong enough to defeat the\
        \ characters she was beaten up badly) *Enhanced Senses (Hears somebody scream\
        \ from a building away, Locates an invisible attacker, She senses the trio\
        \ following her, Buffy beats them easily when Buffy and The Trio are invisible,\
        \ Buffy felt the three invisible demons silently enter the room and turned\
        \ just in time to thwart her attack) *Extrasensory Perception (Slayers can\
        \ sense the vampires around them if they focus), Healing (Slayer blood can\
        \ cure Killer of the Dead poison) *Instinctive Action (Slayers have instincts\
        \ that help them. Each new Slayer subconsciously inherits the memories and\
        \ skill of her predecessors, giving them an instinctual ability to fight before\
        \ even being called) *Acrobatics (Buffy often uses acrobatics in her fights)\
        \ *Attack Reflection with Scythe (The scythe can reflect attacks, as seen\
        \ here and here) *Precognition (Has premonitions) *Electricity Manipulation\
        \ (She resists enough electricity to kill a human. Grabs a magical spear discharging\
        \ electricity and pulls it from her attacker. She resists the 12,000 volt\
        \ shot of the Taser blaster. The Taser Blaster can leave even super soldiers\
        \ unconscious for hours) *Mind Manipulation (Resists Dracula's hypnosis. Resists\
        \ the Master's hypnosis after her resurrection. Resists Lothos's hypnosis)\
        \ *Poison Manipulation (The Watchers Council Special Operations Team prepare\
        \ a sedative powerful enough to knock out someone twice the size of the average\
        \ man to subdue her. Faith, another slayer, was able to fight Angelus with\
        \ a mystical poison in her blood) Enjoining Spell \u25BE= All previous abilities\
        \ enhanced, plus *Magic (Buffy had the ability to cast powerful magic spells,\
        \ which she used to negate Adam's attacks and ultimately destroy his radioactive\
        \ uranium power core) *Forcefield Creation (Buffy was able to access the ability\
        \ of projecting a powerful field of manipulated energy, conjuring a barrier\
        \ to block Adam's bullets) *Void Manipulation (Buffy was able to access the\
        \ ability of making objects vanish, which she used to destroy Adam's power\
        \ core \u2014 it immersed in white light and disappeared) *Transmutation (Buffy\
        \ was able to access the ability of transforming objects \u2014 she transformed\
        \ one of Adam's rockets into three doves) *Technology Manipulation (Buffy\
        \ had the ability to manipulate technology and technological constructs. With\
        \ a wave of her hand, she caused Adam's weapon arm to morph back into a regular\
        \ demon arm) *Telekinesis (Buffy had the ability to make objects fly into\
        \ the air with telekinesis, as seen by how she made Adam's power core hover\
        \ into the air before destroying it) All previous resistances enhanced Twilight's\
        \ Empowerment \u25BE= All abilities of her base key enhanced, plus *Flight\
        \ (Buffy gained the ability to fly with Twilight's empowerment) *Dimensional\
        \ Travel (Can travel between Earth and Twilight) *Reality Warping (Can shape\
        \ Twilight to their will) *Light Manipulation (Her body radiates light) *Self-Sustenance\
        \ (Type 1; Can operate and breathe in space) *Portal Creation (Can create\
