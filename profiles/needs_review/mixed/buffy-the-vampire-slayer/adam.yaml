    - field: weaknesses
      value: "The \"core\" of an Angel, once breached, means the absolute certainty\
        \ of death for the Angel involved. In the aftermath of triggering an \"Impact\"\
        , it appears that Adam reverts into an embryonic state that is virtually defenceless\
        \ to assault, and requires to \"fuse\" with the body of another life form\
        \ to survive (though it is more likely to have been the side-effect of the\
        \ incapacitation of its \"S\xB2 Engine\" rather than the natural occurrence).\
        \ Notable Attacks/Techniques: A.T. Field: The intangible light of the soul\
        \ in the physical world, A.T. Fields are possessed by all living beings on\
        \ NGE-Earth and are one of the major aspects of the human psyche that defines\
        \ someone as \"individual\" and \"protect\" them from the intrusion of another's\
        \ feelings. However, the Evangelion Units and the Angels are unique in the\
        \ ability to generate A.T. Fields that are corporeal and occasionally visible\
        \ to the naked eye, possibly due to a large amount of innate energy contained\
        \ in their souls. Their A.T. Fields mostly function as a physical defence:\
        \ a forcefield consisting of concentric octagonal yellow lines. The barrier\
        \ is almost perfect, only being temporarily disrupted from its active state\
        \ by incredibly energetic weapons (such as military-grade positron beams and\
        \ \"N\xB2 Weapons\") or erosion by another corporeal A.T. Field that is superior\
        \ in strength. If left alone after initial disruption, the A.T. Field will\
        \ revive its durability almost instantly as long as the user is still alive,\
        \ making it a regenerative barrier. The transition from a dormant A.T. Field\
        \ to an active Field is indicated by a slight atmospheric blurring. Adam should\
        \ possess all of the heightened capabilities of Tabris, given that its salvaged\
        \ soul is the reason behind Kaworu's incredibly powerful \"A.T. Field\" in\
        \ the first place. *Cruciform Explosion: Adam is known to possess this technique,\
        \ due to the fact that at least the majority of the Evangelion Units are modelled\
        \ out of the \"First Angel\"'s blueprints and DNA. This cross-shaped energy\
        \ attack towers above the surrounding landscape, reaching kilometers at least\
        \ in height and has the destructive capacity to generate at least megatons\
        \ of energy in output. Chamber & Doors of Guf [Hebrew] (Chamber & Doors of\
        \ the Celestial Body): While the context of \"Guf\" within the NGE continuity\
        \ has never been clearly defined, it is heavily implied that the Chamber of\
        \ Guf represents a separate dimension (similar to the Dirac sea) which functions\
        \ as a \"storehouse\" for unborn souls, while the Doors of Guf are apertures\
        \ which manifest on Adam's palms and function as simple \"gateways\" between\
        \ the Chamber and the physical universe. Adam essentially stores the necessary\
        \ souls inside for bestowing life on to its children/creations, indicating\
        \ to have given birth to the Angels with this method, before sealing the Doors\
        \ up when the supply of souls was extinguished. It is likely that the mass\
        \ soul removal effect intended out of a standard \"Anti A.T. Field\" is to\
        \ provide a new supply of souls to Adam's \"Chamber of Guf\". Anti A.T. Field:\
        \ Evangelion Units with the possession of a \"S\xB2 Engine\" and sufficiently\
        \ intelligent Angels are capable of inverting the dimensional values of their\
        \ own \"A.T. Field\", triggering a tremendous explosion of energy entering\
        \ well into the gigaton range even for the weakest users. An \"Anti A.T. Field\"\
        \ projection also has the added ability of dematerializing all \"A.T. Fields\"\
        \ (intangible or corporeal) within its area-of-effect, resulting in the dissolution\
        \ of regular organic matter into LCL fluid (affectionally referred to as orange\
        \ tang) and the mass removal of souls from the physical form. Beings composed\
        \ of an alternative type of matter (such as synthetics or the elusive particle-wave\
        \ matter seen in the NGE-verse) are unaffected by the dissolution/soul-removal\
        \ half of an \"Anti A.T. Field\" projection. In the case of the \"First Angel\"\
        , its \"Anti A.T. Field\" has enough power to affect the entirety of Earth's\
        \ surface, and even when its \"S\xB2 Engine\" (The power which the \"Anti\
        \ A.T. Field\" generates from) collapses and greatly weakens its power, Adam\
        \ still manages to completely obliterate the continent of Antarctica and wipe\
        \ out all lifeforms (Even microbes and bacteria) in the surrounding Southern\
        \ Ocean, rendering it as a permanent \"dead sea\". Regeneration: Adam possesses\
        \ the ability to recover or revive lost portions of its body. While it does\
        \ not demonstrate the ability in the flashback sequences to \"Second Impact\"\
        \ (as the organ that enables regenerative capabilities, the \"S\xB2 Engine\"\
        , had been critically damaged), Adam is known to have survived the enormous\
        \ explosion by regressing into an embryonic state, fossilized in frozen bakelite,\
        \ and the Director's Cut edition of Episode 23 from the original TV series\
        \ may imply that the \"First Angel\" was very gradually regenerating into\
        \ its original form. ==Gallery== The Wings of Light.jpg Embryonic form of\
        \ Adam.jpg ==Notable Matchups== Victories: Losses: Inconclusive: ==References"
