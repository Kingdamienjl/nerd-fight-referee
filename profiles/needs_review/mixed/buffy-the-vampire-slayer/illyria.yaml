      confidence: 0.75
    - field: weaknesses
      value: "In contrast to her strength as a mage and Master, Illya gets tired quickly\
        \ while running, and she must spend half a day sleeping everyday. She also\
        \ has a very childish nature, and acts more like a kid than a 18 years old\
        \ girl. Notable Attacks/Techniques: illyacontrol.gif|Illya controlling her\
        \ Familiars. illyafamiliar.gif|Illya creating her familiars. ilyadegen.gif|Illya\
        \ turning her Zelle familiar into Degen. *Magecraft: Illya is stated to be\
        \ the most skilled Master in history, and her body is made up of 70% magic\
        \ circuits, giving her a huge amount of mana at her disposal. This also allows\
        \ her to control Berserker, a Servant who is usually able to cancel the control\
        \ of Command Spells. Illya's Magic Circuits are also her Command Spell that\
        \ show themselves as a red pattern all over her body when she generates magical\
        \ energy. Just like her mother Irisviel, Illya can make familiars from her\
        \ hair. The name of the technique is Engel Rid: Angel's Poem. The bird's name\
        \ is Storch Ritter: Knight of Stork. The Ibis that shoots bullets is Z\xE4\
        hre, and she can also transform them into a sword called Degen. Illya's familiars\
        \ are autonomous beings that can protect Illya, follow their enemies automatically,\
        \ take hits from Rin's Gandr shots, and dodge Rin's attacks. They can also\
        \ fly and shoot blasts of magical energy. Illya can easily create up to four\
        \ without any issue, and she can change their shape into swords. *Transference\
        \ of Consciousness (\u610F\u8B58\u306E\u8EE2\u79FB): Illya's Transference\
        \ of Consciousness allows her to send other people's consciousness into objects.\
        \ This ability works by connecting the nerve that goes from a person's eyes\
        \ to his/her brain to a non-living object instead of that person's eyes. This\
        \ allows that person to gather information from the point of view of the object\
        \ affected by this power. Some applications of this magic are far-sight and\
        \ possession. Illya can also use this power to send her consciousness into\
        \ a familiar or a doll that can move. If said familiar or doll is destroyed,\
        \ Illya's body will get her consciousness back. However, the familiars used\
        \ today are usually weak, and they are only good as messengers, so Illya wouldn't\
        \ be able to let them fight for her. And even if she transfers her consciousness\
        \ into a familiar or doll, she will disappear if her original body grows old\
        \ and dies. This ability has some other limitations: first of all, Illya has\
        \ to touch the person she wants to use this ability to. The success rate of\
        \ transferring someone's consciousness is usually low, so Illya doesn't usually\
        \ use this ability as an attack. The reason why Illya didn't have trouble\
        \ using it against Shirou was that Shirou didn't resist, and both the trees\
        \ and the walls that hosted Shirou's consciousness belonged to Illya. Another\
        \ limitation is that the consciousness of the person affected by Illya's magic\
        \ will be forced to return if the original body is stimulated in any way.\
        \ So if Illya starts to harm her opponent's body, that body will call its\
        \ consciousness back when it senses danger, even if the consciousness is unaware.\
        \ It is also impossible to connect two living beings with this power, which\
        \ can only link a living being with a non-living object. *Dress of Heaven:\
        \ Illya's Dress of Heaven is a magical artifact passed down by the Einzberns.\
        \ It is the heart that controls the Greater Grail and has the magic to materialise\
        \ the soul for a few seconds. The dress is pure white, but made of gold. It\
        \ is inlaid with seven \"rings\" said to control all creation, and the souls\
        \ of others. The seven holes in the dress are the seven transformed rings,\
        \ and they are designed to light up one by one every time a Servant's soul\
        \ is harvested. Since any human who touches the dress will be turned to gold,\
        \ its management must be handled by spirits, demi-humans, or homunculi. Illya's\
        \ personal maid, Leysritt, is also part of the Dress of Heaven, and her role\
        \ is to be a Mystic Code that can boost Illya. The moment that the Dress of\
        \ Heaven materializes, Leysritt ceases to exist."
      source_id: character-stats-profiles-illyria-buffy-the-vampire-slayer
      provider_id: character_stats_profiles
      authority: high
