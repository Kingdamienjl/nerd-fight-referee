    - field: attack_potency
      value: 'Universe Level+ (Illya is much stronger than Rin, and she would have
        killed her if Rin hadn''t been saved by Emiya. Rin was able to fight and eventually
        overpower MedeaFate/stay night: Unlimited Blade Works Season 2 Episode 5,
        whose magic is a dimensional transcendence above that of the mage who originally
        summoned her during the Fifth Holy Grail WarFate/stay night: Unlimited Blade
        Works Season 2 Episode 2; said mage was a 3-D being with 3-D power, making
        Medea''s magic 4-D. Illya''s Degen can also easily shatter Rin''s forcefields,
        which are powerful enough to block Caster''s light bullets, further supporting
        that Illya is stronger than Medea. Rin also managed to take off one of Berserker''s
        lives using four jewelsFate/Stay Night Fate Route Day 11. Illya herself implied
        to be able to kill Berserker 10 timesFate/stay Night Visual Novel - Fate Day
        03 - Bad End 02) | Outerverse Level (Illya''s Dress of Heaven is stated to
        have the power to control all creationFate/side material - Encyclopedia: Dress
        of Heaven [Armament], p. 067, which would include realms like Moon Cell, a
        place with no concept of "time" and "distance", the Outer God''s world, a
        place beyond all possible dimensions, the Throne of Heroes, a place transcending
        space and time and with no concept of "time". The Throne of Heroes is also
        a higher level of existence than the aforementioned Moon Cell. Illya''s Dress
        of Heaven can also control the Greater Grail, which uses the power of 6 Servants
        to cut a hole through the "Swirl of the Root", and subsequently fixes the
        "Swirl of the Root" with the Holy GrailFate/stay night Visual Story Guidebook;
        page 18. The "Swirl of the Root" is a place free from all binary oppositions,
        a power that governs dimensional theory, and the coordinate that''s considered
        to be the beginning and the demise of all creation. It''s also the seat of
        God, where everything is remembered and created. Even a small portion of the
        Root, like the hole created by the Holy Grail, is transdual, meaning it transcends
        stuff like space and non-space, existence and non-existence, and so on)'
