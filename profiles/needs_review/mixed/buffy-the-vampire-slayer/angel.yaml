    - field: powers_and_abilities
      value: "Base \u25BE= Superhuman Physical Characteristics, Enhanced Senses, Regeneration\
        \ (Low-mid), Immortality (Types 1, 3 and 7; Vampires' bodies are already dead.The\
        \ Harvest They have eternal life and can regenerate wounds that are fatal),\
        \ Blood Drinking, Martial Arts and Weapon Mastery (Angel was a highly skilled\
        \ combatant and generally fought unarmed, using circular attacks such as spinning\
        \ kicks and back hands. His fighting style takes from Karate, Hapkido, Taekwondo,\
        \ Muay Thai, Brazilian JiuJitsu, Wushu, Boxing, Wrestling and Tai Chi. In\
        \ addition to his proficiency in many forms of martial arts, he mastered many\
        \ varieties of weapons, favoring broadswords and sometimes axes. He was even\
        \ more dangerous without a soul, when he would fight with no remorse. During\
        \ his lifetime, Angel successfully stood up to and defeated a wide variety\
        \ of powerful and skilled opponents, including Buffy Summers, Faith Lehane,\
        \ Marcus Hamilton, Riley, and Connor, amongst others Additionally, Angel beat\
        \ Spike on numerous occasions, only losing to his prot\xE9g\xE9 once in their\
        \ century plus association. Following Darla being sired by Drusilla, a cold,\
        \ ruthless and driven Angel was shown to have single-handedly defeated around\
        \ twenty vampires and demons in one fight. Angel was also able to physically\
        \ dominate The Beast, forcing the demon to its knees before finally succumbing\
        \ to The Beast's strength), Acrobatics (Angel often uses acrobatics), Self-Sustenance\
        \ (Type 1 and 2; Vampires do not breathe and can survive for an indefinite\
        \ period of time without feeding.), Empathic Manipulation (Vampire bites trigger\
        \ the pleasure centers of the victim, meaning most don't even fight back when\
        \ they're being bitten. Angel exploits this to calm down Willow who's been\
        \ taken over by dark magic), Telepathy (He has a psychic bond with those he\
        \ transforms), Immense Pain Tolerance (Vampires can feel pain, but don't hold\
        \ back because of it), Stealth Mastery (Infiltrates Wolfram & Hart despite\
        \ the heavy security and vampire detectors. Sneaks into Lilah's office and\
        \ behind her without getting noticed), Multilingualism, Photographic Memory\
        \ (Can mentally recreate a scene from last night, recalling the actions of\
        \ the people present including where they were seated. Recalls a specific\
        \ code he saw months ago), Social Influencing (In an elaborate ruse to get\
        \ information out of Faith, Angel pretends to be his evil counterpart Angelus\
        \ to gain her trust. Impersonates a detective to enter a crime scene. Impersonates\
        \ a well-known vampire to infiltrate a bank heist), Multiple Selves (Type\
        \ 2; Angel, Angelus (the soulless and evil version of Angel) and the demon\
        \ share the same body.), Perception Manipulation (As a vampire, he should\
