    - field: intelligence
      value: Gifted (Angel was an extremely intelligent vampire. He could speak many
        languages fluently, including English, Korean, Tibetan, Greek, Latin, Italian,
        Spanish, French, Belarusian, Romanian and German. He also had strong leadership
        abilities and was adept at strategic planning. Despite having lost his soul,
        Angel had an impressive ability to manipulate the emotional states of others,
        using psychological tactics to attack the Scooby Gang and Angel Investigations.
        He demonstrated these skills most notably by causing Drusilla to lose her
        mind. Angel also had experience with magic. He was capable of casting spells,
        exorcisms, and dispelling spells, but preferred to rely on the expertise of
        others rather than perform them himself if the option was available. He also,
        with the wisdom of age, possessed a great knowledge of demonology and history,
        sometimes rivaling that of Giles and Wesley in these matters. He also had
        a photographic memory and never forgot anything he saw)
