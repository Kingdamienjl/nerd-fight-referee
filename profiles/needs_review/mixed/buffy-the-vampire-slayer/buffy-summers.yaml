  intelligence:
    text: At least Above Average (Although she was sometimes considered a dumb blonde
      by others, Buffy frequently showed herself to be quite intelligent, possessing
      strong leadership skills and having a natural flair for tactical planning. Prominent
      examples of Buffy's intelligence included her near-perfect S.A.T. score, her
      defeat of Zachary Kralik by using his dependency on anti-psychotic medication
      against him, her quick deduction of the Buffybot's true nature, her rapid deduction
      of Riley's affiliation to the Initiative based on weeks of evidence, and her
      immediate realization of Katrina Silber's true murderer upon hearing her name
      at the police station, leading an army with supernatural powers. As with every
      Slayer, Buffy possessed a natural proficiency with virtually all forms of weaponry
      and unarmed combat styles, and in addition to this she had years of combat training
      to hone in her skills using various martial arts (particularly jiu jitsu and
      aikido). With zero training and effort, Buffy effectively uses official weapon
      maneuvers and styles to defeat Giles on the first day of quarter staff training.
      Trained for years by Giles. She was trained by Angel, a 200+ year old vampire.
      She uses a hybrid combat form. She has thousands of years of slayer combat experience,
      martial arts mastery and knowledge)
    source_ids:
    - vsbattles-buffy-summers-buffy-the-vampire-slayer
    confidence: 0.6
    notes: auto_repair source extraction
