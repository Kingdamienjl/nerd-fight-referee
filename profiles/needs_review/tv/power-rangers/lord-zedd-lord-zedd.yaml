  stamina:
    text: Superhuman (Was able to walk and speak after being blasted by powerful magic
      from the Zeo Crystal's defense barrier that left him skinless and shattered
      some of his organs.Mighty Morphin issue 10 Stated to have experience so much
      pain for thousands to million of years, pain that is beyond human comprehension,
      that allow him to endure any pain. As seen he can still talk and somewhat walk
      even in a near-death state after being mercilessly stabbed and beaten by Mistress
      Vile and the vessel. The pain that pure electrical voltage causes, frying someone
      like an egg, is nothing compared to the pain that Zedd has endured. Zedd will
      still live and thrive despite all the pain inflicted to him. His endurance is
      far superior to that of humans like Jason or Tommy and other monsters like Goldar.
      Zedd rarely rested in his conquest of over thousand eons, needing to sleep only
      once in 100 years to enhance his energies and rest.)
