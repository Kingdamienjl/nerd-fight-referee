    - field: standard_equipment
      value: 'Dark Blade: Darkonda''s personal weapon of darkness that he uses to
        utilize dark energies. It can also create powerful energy and electricity
        blasts, Barillian Bugs: Bugs that bite others, injecting poison into them
        that will turn them into Barillian Bugs although the process will take a few
        hours.'
      source_id: vsbattles-karone-power-rangers
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: "Extraordinary Genius (Darkonda is a cunning individual who always plots\
        \ something behind the scenes. He finds classic traps like an ambush to be\
        \ \"predictable\" and \"old fashioned\" as he always finds more creative plans.\
        \ Managed to get into Astronema's ship catching everyone off-guard as nobody\
        \ should be able to do so. Darkonda has been everywhere and has seen everything,\
        \ this extended knowledge can be used against his opponents in order to create\
        \ plans utilizing relics and extraterrestrial objects or use them for diplomacy\
        \ and information tradingPower Rangers In-Space Ep16; Flashes of Darkonda.\
        \ Darkonda is knowledgeable when it comes to science as he is able to do various\
        \ experiments in his lab such as creating Crocotoxes. Darkonda is also good\
        \ at planning and deceiving others as he was able to fool the entire KO35\
        \ colony on Centauri b to gain their trust and become a general so he can\
        \ plant a fake energy source to trap the Rangers and make them look like the\
        \ bad guys so they can be destroyed. Darkonda is a warlord and a war criminal,\
        \ being responsible for many of the United Alliance of Evil\u2019s atrocities,\
        \ including the dark sciences of cloning and bio-reprogramming that programmed\
        \ Astronema and created the Psycho Rangers. Despite being a sadist and a psychopath,\
        \ Darkonda has a keen mind for tactics and problem solving) Genius (Darkonda\
        \ is a tactical mind that can keep up and with some of the universe's greatest\
        \ fighters and outsmart them such as Ecliptor, Zhane the Silver In-Space Ranger\
        \ and Andros the Red In-Space Ranger)"
      source_id: vsbattles-karone-power-rangers
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Speed Amplification/Teleportation: Darkonda can heavily increase his
        speed at blur speeds while teleporting around, he uses this ability to overwhelm
        the opponent as well as to create tactical plans., Electricity Manipulation:
        Darkonda''s main way of attacking. He can project powerful electricity blasts
        from his eyes, hands or Dark Blade, Shapeshifting: Darkonda can freely shapeshift
        as any being he wants with no restrictions, Size Manipulation: He can freely
        change the size of any being he wants including himself, even to the size
        of the Megazord which stands at 100 meters'
      source_id: vsbattles-karone-power-rangers
      provider_id: vsbattles
      authority: high
