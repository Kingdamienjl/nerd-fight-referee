    - field: standard_equipment
      value: As a Power Ranger, Ivan has access to a sizable arsenal of varied weapons,
        armors and other tools. These pieces of equipment include:, Gold Energem.
        The Energems are an immeasurably powerful artifact that monsters from all
        corners of the universe desire. Just a single Energem's power can overpower
        powerful aliens such as Heckyl. While the full power of the Energems are unknown,
        they were said to have transcended space and time and wielders of them are
        a threat to "the past, present and future". In the Rangers position, these
        Energems don't seem to enhance their strength to such levels, but they are
        used as a source of seemingly infinite energy., Dino Charger. While not a
        weapon per say, the Dino Charger is an invaluable tool for the Rangers. It
        can be used to gain new weapons or gear on the fly and to summon their respective
        Zords., Dino Cycle Charger. Summons a dinocycle, which is a faster alternative
        than walking. Rarely used in combat, but it has been shown to clear large
        distances of lad in no time., Dino Armor X Charger. One of the most consistent
        Dino Chargers to be used by the Rangers. This charger conjures up an additional
        piece of armor that seems to power up their Megazords., Gold Ptera Saber.
        A stronger alternative than the basic Dino Saber. The Gold Ptera Saber is
        a powerful weapon indeed, being able to conjure and disperse large storms
        with simple techniques. The Sword can be empowered by up to three Dino Chargers,
        with all three it can unleash Lightning Final Strike
      source_id: vsbattles-evox-power-rangers
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted (As a Knight, Ivan received a grade of combat training and experience
        that is initially above the Rangers and as such, he's able to match blades
        with the likes of Fury and other powerful monsters earlier than the Rangers.
        As he joins forces with the Rangers, his experience only grows richer. He
        becomes a much more well-rounded fighter, with enhanced hand-to-hand combat
        and skill with the Crossbow. Scientifically, Ivan is behind the times on several
        subjects ["I still can't believe the Earth is round"], but has shown to be
        a fairly quick learner. Occasionally, he's been shown having a higher level
        of common sense than his fellow Rangers, catching on to the power of whatever
        monster Sledge or Heckyl sent after them)
      source_id: vsbattles-evox-power-rangers
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Swordsmanship. Ivans most distinctive skill is his mastery over the sword.
        Even before becoming a formal Power Ranger, he was a knight trained in the
        arts of the blade and could match swords with Fury out of sheer skill alone.
        He's almost always shown fighting with his Ptera Dino Saber. His Lightning
        Final Strike technique depicts him blitzing an enemy at max speed holding
        the blade., Weather Manipulation. A theme of many of Ivans attacks is they
        involve weather in some capacity. He can create and end raging storms with
        simple sword slashes. Several techniques also involve lightning bolts.
      source_id: vsbattles-evox-power-rangers
      provider_id: vsbattles
      authority: high
      confidence: 0.75
