- id: claim-weaknesses-7ed86524
  section: weaknesses
  axis: weakness
  text: 'He''ll periodically transform into Snide, though this was resolved by the
    end of the series. His rather foppish attitude sometimes makes him take battles
    less seriously, though he''ll always get serious if the situation calls. Notable
    Attacks/Techniques: * Energy Blast. Heckyls main from of attack is his Energy
    blast. These attacks can vaporize even high ranking guards without any issue and
    can match even the Energems in terms of damage output [though is ultimately weaker].
    Despite his impressive strength, even among the hard hitters of the series, Heckyl
    is typically outmatched by the stronger antagonist such as Lord Arcanon and even
    Sledge. * Ranger suit: The suit of the Ranger. The material is a self-assembling
    nano-fiber formed with an intercellular shape memory alloy ==Notable Matchups==
    Victories: Losses: Inconclusive: ==References== Category:Characters Category:Male
    Characters Category:Aliens Category:Villains Category:Evil Characters Category:Good
    Characters Category:Heroes Category:Tokusatsu Characters Category:Science Fiction
    Characters Category:Protagonists Category:Antagonists Category:Primary Antagonists
    Category:Transformation Users Category:Energy Projection Users Category:Energy
    Users Category:Power Rangers Category:Criminals Category:Reformed Characters Category:Tattoo
    Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
