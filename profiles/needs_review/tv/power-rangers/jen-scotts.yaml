    - field: weaknesses
      value: '*Wolfsbane: As a Werewolf, Scott can be weakened or killed by exposure
        to wolfsbane, depending on the species and the method of exposure. Inhalation
        of purple wolfsbane has been shown to disable Scott''s accelerated healing
        ability, which thereby causes Scott''s asthma to return and has been shown
        to provoke him terrible hallucinations. Nordic Blue Monkshood is fatal to
        Werewolves while Yellow Wolfsbane can weaken, sedate and even kill Werewolves
        as well, depending on the method of exposure and potency. The only known ways
        to cure wolfsbane poisoning of a Werewolf or other were-creature are burning
        out a wound caused by a wolfsbane-laced weapon or applying to the wound the
        ashes of the strain the Werewolf was exposed to. However, yellow wolfsbane
        poisoning can be treated by surgically slicing open the chest of the poisoned
        Werewolf and allowing the yellow wolfsbane gas to come out in the form of
        a cloud. *Letharia Vulpina: As a canine were-creature, Scott, like other Werewolves,
        Werecoyotes, and Kitsune, can be weakened by exposure to letharia vulpina,
        otherwise known as "wolf lichen" because of its toxic effects toward the canine
        species. *Electricity: As a Werewolf, Scott can be weakened or killed by exposure
        to electricity, depending on the level of voltage used. Lower voltages will
        disable his healing ability and prevent him from transforming, while higher
        voltages can severely slow or even stop Scott''s heart completely. For this
        reason, electricity, typically in the form of cattle-prod tasers, are one
        of the most common weapons Werewolf hunters use against their prey. However,
        this weakness has also been used to Scott''s advantage, as Kira''s electrokinesis
        applied to Scott''s heart allowed him to fake his own death to try to lure
        out the Benefactor. Since becoming a True Alpha, Scott''s ability to tolerate
        electricity has increased tremendously, to the point that he was able to break
        through strong chains despite being shocked by Araya and Severo Calavera at
        the highest level of their generator. He was also able to run out of Eichen
        House with Kira, who had lost control of her powers due to the telluric currents
        there and was producing hundreds of lightning bolts that had hit and burned
        Scott; this level of electrical shock was enough to previously put Isaac in
        the hospital for several days, while Scott was able to recover within hours.
        *Full Moon: Though being a were-creature is considered a gift in the supernatural
        world due to the increased speed, stamina, and healing that it provides, it
        also comes with a price, which is that the Werewolf, Werecoyote, or Werejaguar
        is beholden to the phases of the moon. During a full moon, werecreatures without
        training will become overcome with a rabid anger that will cause them to attack
        any living creature they come upon, which is why they all must learn control
        to avoid exposure and harm to innocent civilians. The full moon will make
        a Werewolf stronger, but it will also make them more rabid and chaotic, which
        makes them easily hunted by supernatural hunters. This has become less of
        a weakness for Scott, now that he has learned to maintain his humanity during
        full moons, but under certain conditions, Scott is still capable of losing
        control during this time. *Lunar Eclipse: During the phase of a lunar eclipse
        where the moon is completely covered in the earth''s umbral shadow, a Werewolf
        or other were-creature will lose all of their powers, including their super
        strength, accelerated healing, and shapeshifting abilities, making them vulnerable
        to anyone seeking to take advantaged of this weakness and harm or kill them.
        *Modified Canine Distemper Virus: One of the assassins in the Deadpool, The
        Chemist, created a modified version of the canine distemper virus that could
        sicken both humans and any canine shapeshifter, such as Werewolves, werecoyotes,
        and kitsunes. Scott, Kira, Malia, and Stiles were all exposed to the virus
        at the PSATs, and the former three nearly died from its effects. However,
        consuming wild purple reishi mushrooms are known to cure a the virus and prevent
        those who ingest it from being infected in the first place. *Loud Noises:
        As a Werewolf with heightened senses, Scott is vulnerable to sounds at certain
        frequencies. For example, the Argent hunters are known for using ultrasonic
        emitters that produce an extremely high-pitched noise that only animals and
        people with supernaturally enhanced senses can hear. Conversely, there are
        also certain subsonic, low-pitched sounds that can be used against werecreatures
        as well, as a group of Deadpool assassins used in Perishable. Sounds at this
        low frequency can cause Scott and other werecreatures to become incredibly
        disoriented, woozy, nauseous, and unable to control their bodies, to the point
        that others have mistaken them for being drunk. In this state, they are unable
        to defend themselves due to the sounds making them weak and unable to stand,
        walk, talk, or see clearly. *Guilt: Guilt has been shown to be'
