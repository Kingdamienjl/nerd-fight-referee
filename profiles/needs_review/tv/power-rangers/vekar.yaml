        skilled enough to pilot through dense and deep forestsPower Rangers In-Space
        Ep14; The Barillian Sting, through enemy spacecrafts in spacePower Rangers
        In-Space Ep1; From Out of Nowhere Part I and through towns with gravity far
        superior to that of earthPower Rangers In-Space Ep16; Flashes of Darkonda.
        He can also pilot the Galactic Rover which is a high powered dune buggy vehiclePower
        Rangers In-Space Ep40; The Impenetrable Web. He can pilot highly advanced
        computer systems like Zords), Stealth Mastery (Infiltrated Astronema''s base
        together with AndrosPower Rangers In-Space Ep30; Dark Specter''s Revenge,
        Part II. Disappeared from everyone''s sight during a small explosion), Weapon
        Mastery (Has mastery over the Super Silverizer which is both a blaster and
        a saber. The Rangers can use any object as a weapon. Comparable to Andros
