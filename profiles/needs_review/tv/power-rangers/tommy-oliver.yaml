- id: claim-standard-equipment-4cddb046
  section: equipment
  axis: equipment
  text: Every Ranger power he's had came with a Wrist Communicator | Dragon Dagger,
    Dragon Shield, and the Sword of Darkness | Shiba Sword | Brachio Staff As the
    Green Ranger, he wields a Power Morpher w/ the Dragon Power Coin, his protective
    Dragon Shield armor and golden arm bands, Blade Blaster, Mega Heater and the Dragon
    Dagger which summons his Dragonzord. As the White Ranger, he has a Power Morpher
    which uses either the Tiger Power Coin or the Falcon Ninja Coin, the White Shark
    Cycle, and he also wields a multi-lingual, sentient, flying, laser-shooting sword
    named Saba that can summon his Thunderzord the White Tigerzord. As a Ninja Ranger
    he pilots either the White Ninja Falconzord or the White Shogunzord. His White
    Ninja Ranger form can also escape death using duplicates and white energy blasts.
    As the Zeo Ranger V, he carried the Zeo Crystal-powered Zenonizer to morph, a
    Zeo Power Pod Sword and Zeo Laser Pistol, the Red Power Sword, piloted the Zeo
    Jet Cycle V and Defender Wheel, and controlled the Zeo Zord 5-Phoenix, Red Battlezord
    and Super Zeozord 5. As the Red Turbo Ranger, he's powered by the Turbo Morpher,
    Turbo Key and Super Zeo Crystal. He wields the Auto Blaster, Turbo Blade, Turbo
    Navigator and Turbo Lightning Sword. He can use his Turbo Cart and Lightning Cruiser
    for transportation and the Red Lightning Turbozord. As the Black Dino Ranger,
    he is powered by the Brachio Morpher and Black Dino Gem which grants invisibility,
    carries the Brachio Staff, pilots the Raptor Rider and Dino ATV, and can power
    up into his Super Dino Mode. His Zords include the Brachiozord, Cephalazord, Dimetrozord,
    Stegozord, Parasaurzord and Ankylozord.
  source_ids: *id004
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
