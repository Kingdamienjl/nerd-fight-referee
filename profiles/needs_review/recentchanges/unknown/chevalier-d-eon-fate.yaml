  intelligence:
    text: Despite their relatively recent legend, d'Eon's tales as a famous dragoon
      commander, plenipotentiary minister, and spy have given them a place on the
      Throne of Heroes as a truly notable figure. Although they prefer honorable combat
      where they get to showcase their skill in swordplay, they're also skilled in
      the arts of diplomacy and subterfuge, having infiltrated the Russian Empire
      for long stretches of time without arousing any suspicions about their identity
      or gender. In addition, their skill with a rapier is so great that it is practically
      mesmerizing, weakening, and paralyzing foes with dazzling skill before going
      straight for a finishing blow.
    source_ids:
    - vsbattles-chevalier-d-eon-fate-unknown
    confidence: 0.6
    notes: auto_repair source extraction
