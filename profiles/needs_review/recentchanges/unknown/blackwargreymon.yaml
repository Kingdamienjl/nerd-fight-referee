    \ its power implies. As a result, a series of coincidences will occur that will\
    \ guarantee MetalGreymon's victory no matter what odds it faces. *Touch of Evil:\
    \ It can stick his arm into the ground and have it appear from behind the opponent,\
    \ grabbing them and allowing MetalGreymon to brainwash them. *Necro Magic: Hurls\
