  axis: weakness
  text: "Vaccine Digimon. Water and Ice based attacks. Notable Attacks/Techniques:\
    \ *Spitfire Blast: Shoots multiple fireballs from its mouth. *Dramon Claw: Slashes\
    \ the foe with claws engulfed with the flames of a dragon. *Wolkenapalm I: Causes\
    \ an explosion of fire to appear from under the opponent. *Guard Charge: Boosts\
    \ durability by 10%. Can stack. *Dragon's Wrath: Passively boosts its AP by 15%.\
    \ *Giga Breath: Releases a large fireball at the opponent. *Death Cannon: Launches\
    \ a large ball of darkness at the opponent. *Destruction Cannon I: Launches a\
    \ small ball of darkness at the opponent. *Black Blast: Releases an energy ball\
    \ of darkness at the opponent. *Duplication: Can duplicate itself countless times\
    \ in mere moments. *Blood Eye: Releases a power from its eyes that confuses the\
    \ opponent's mind. *BB Burner: Spews out all of the fire stored in its mouth in\
    \ one shot. Greymon(Virus)= *Mega Flame: Fires a gigantic ball of flame from its\
    \ mouth at the opponent. *Bit Fire: Breathes out multiple blue fire balls at the\
    \ opponent. *Meteor Fall I: Drops a large meteor on the opponent(s). *Hit Charge:\
    \ Increases its accuracy. Greymon (Virus) Inherited Skills= *Power Energy I: Releases\
    \ a blast of low level non-elemental magic at the opponent. *Burst Flame I: Burns\
    \ the opponent with low level fire magic. *Pummel Whack: Releases energy from\
    \ its fist in the shape of a beast head. *Comet Hammer I: Drops a bunch of large\
    \ boulders on top of the opponent. *Heal: Slightly heals itself or allies. *Tiny\
    \ Twister: Damages the foe with a small typhoon. *Wind Claw I: Slashes the foe\
    \ with blades of wind. *Sonic Void I: Blasts the foe with low level wind magic.\
    \ *Magical Fire: Shoots a spiral of ethereal flames.\u200B\u200B\u200B\u200B\u200B\
    \u200B 10% chance of increasing attack potency by 10%. *Phantom Hurricane: Creates\
    \ a large phantom tornado. *Phantom Fire: Fires a phantom blue fireball. *Mental\
    \ Charge: Increases Magical power by 10%. Greymon(Virus) X= *Mega Burst: Enhances\
    \ the explosive power of Mega Flame to its limit within its mouth and fires it.\
    \ *Blader Tail: Tears the enemy to pieces with the tip of its tail. MetalGreymon\
    \ (Virus)= *Giga Destroyer: Shoots organic missiles from a hatch in its chest.\
    \ *Revenge Flame: Unleashes a wave of fire from its Trident Arm as well as instantly\
    \ countering any attack. *Metal Slash: It uses its left arm to slash the enemy.\
    \ *Trident Arm: Launches its Trident Arm, which is attached to a cable. *Awesome\
    \ Quake I: Creates a small scale earthquake to damage the opponent. MetalGreymon\
    \ (Virus) Inherited Skills= *Atomic Burst: Wraps its body in light, like a barrier\
    \ and then charges into the opponent. Those who suffer this technique are disassembled\
    \ into digital data composed of \"0\"s and \"1\"s, the smallest units of data,\
    \ and never return to their original state. *Miracle Creation: Due to the properties\
