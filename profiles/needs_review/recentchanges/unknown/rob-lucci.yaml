    - field: weaknesses
      value: "Cannot swim and becomes immobilized if more than half of his body is\
        \ covered in water. Busoshoku Haki and seastone nullify his Devil Fruit power\
        \ and his resistance to blunt impact, making him vulnerable like regular people.\
        \ During Dressrosa, excessive usage of Gear 4th would render Luffy incapacitated\
        \ for 10 minutes, barely able to move and having no access to Haki, but during\
        \ Whole-Cake arc, Luffy only suffers from having no haki usage for 10 minutes.\
        \ Gear 4th greatly increases Luffy's metabolism, making his body burn calories\
        \ much faster and greatly lower how long he can remain in combat. Gear 4th\
        \ Tankman Full Version can only be utilized when Luffy has consumed a sufficient\
        \ amount of calories. Notable Attacks/Techniques: Haki: There are normally\
        \ two types of Haki regular people can tap into: the Kenbunshoku Haki which\
        \ allows individuals to sense the presence of others, and Bus\u014Dshoku Haki\
        \ which allows individuals to create an invisible armor around them. There\
        \ is however a third type of Haki, Ha\u014Dshoku Haki, that only a few individuals\
        \ can use. Luffy is one of these people. *Ha\u014Dshoku Haki (Color of the\
        \ Conquering King): Luffy is the standard for Proficient Haoshoku Haki use.\
        \ He is capable of generating a massive aura that can cover over several kilometers\
        \ with such intensity that the air seemingly discharges electricity when coming\
        \ into contact with any resistance. *Bus\u014Dshoku Haki (Color of Armaments):\
        \ Luffy has displayed a high level of proficiency with Busoshoku Haki. He's\
        \ capable of covering a large portion of his body with Busoshoku: Koka on\
        \ a whim, and at his highest intensity, can cover almost all of his body at\
        \ once. He has somehow found a way to harmonize the armored defense of Koka\
        \ with his Rubber body, forcing almost all physical force to bounce straight\
        \ off. **Busoshoku: Koka (Color of Armaments: Hardening): This technique somehow\
        \ uses Bus\u014Dshoku Haki to drastically harden his body (or parts of it).\
        \ How exactly it works is currently unknown. When Luffy uses it, the arm he\
        \ applies it on becomes black and shiny, much like vulcanized rubber. *Kenbunshoku\
        \ Haki (Color of Observation or Mantra): Luffy has displayed some proficiency\
        \ of Kenbunshoku Haki. By the start of Wholecake Arc, he was capable of seeing\
        \ premonitions of the future without the need to focus intensely while also\
        \ displaying several kilometers of range with the ability--sensing targets\
        \ from a large distance away. By the end of Whole-cake, Luffy can see several\
        \ seconds into the future while focusing intensely, matching the likes of\
        \ Charlotte Katakuri in this field. Rokushiki: A special, superhuman martial\
        \ arts style used primarily by members of Cipher Pol #9. It consists of six\
        \ special techniques: Kami-e, Geppou, Rankyaku, Shigan, Soru and Tekkai. *Soru:\
        \ By kicking the ground at least 10 times in the blink of an eye, Luffy propels\
