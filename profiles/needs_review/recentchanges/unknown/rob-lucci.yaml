- id: claim-weaknesses-e7b932a2
  section: weaknesses
  axis: weakness
  text: 'Standard Devil Fruit user weaknesses and using Tekkai requires him to stay
    sufficiently still. Due to being a carnivorous Zoan, Lucci is much more violent
    and blood-thirsty and can be more easily provoked. Notable Attacks/Techniques:
    Lucci ate the Neko Neko no Mi (Cat Cat Fruit): Model Leopard, which allows him
    to transforms into a leopard and into an human-leopard hybrid form. As a Zoan
    user, Lucci''s physical abilities are greatly enhanced, and due to being a physical
    combatant, he can use this fruit''s power to the fullest. Neko_Neko_Leopard.gif|Lucci
    in his hybrid form Lucci_Leopard.gif|Lucci in his animal form lucci 0.1.gif|Awakening
    Transformation Sequence lucci 1.gif|Awakening Transformation Sequence 2 lucci
    2.gif|Awakening Transformation Sequence 3 A special, superhuman martial arts style.
    Also known as Moon Step, allows the users to actually jump off the air itself,
    allowing them to stay in the air for much longer than usual. CP9 members can use
    this technique to cross great distances without ever touching the ground, or set
    themselves up for swift, aerial attacks. (Lucci showed a variant of Geppo, where
    he combines it with Soru to create the three-dimensional movement Kamisori. *Kamisori
    ("Razor"): A combination of Geppo and Soru, where Lucci uses Soru in a zigzag
    motion in midair, allowing extremely fast movements in three dimensions. Geppou.gif|Geppou
    Lucci_Kamisori.gif|Kamisori Also known as Iron Mass, hardens the users'' muscles
    to the level of iron, in order to nullify damage taken from attacks. However,
    it can be broken by strong enough forces. *Tekkai "Utsugi" (Iron Mass: "Deutzia"):
    This form of Tekkai is used entirely as a counter instead, where the purpose is
    not to absorb damage from the attack, but to transfer the shock of the attack
    back to the attacker, which can lead to broken bones in a normal human body. Lucci_Tekkai.gif|Tekkai
    Also known as Finger Gun, is a close-quarter combat technique, in which the user
    pushes their finger into a certain target at a very high speed, leaving a wound
    similar to a bullet wound. His Shigan''s shape is derived from the shape of the
    finger, hence the hit of Shigan will have more of an impact on Luffy''s rubber
    body (which normally reflects bullets) if it is sharper than the round bullet
    and resembles more modern bullets. *Shigan "Oren" ("Finger Gun: ''Yellow Lotus''"):
    A rapid-fire version of the normal Shigan technique that hits the enemy multiple
    times. *Tobu Shigan ("Flying Finger Gun"): A projectile version of Shigan that
    fires a sharp compressed air shockwaves from the finger thrust enabling the user
    to injure someone without getting close. **Tobu Shigan "Bachi" ("Flying Finger
    Gun: ''Plectrum''"): Similar to "Rankyaku", this technique is able to pierce Luffy''s
    rubber body. Unlike all other versions, this type of Shigan is launched by flicking
    instead of jabbing. *Shigan "Madara" ("Finger Gun: ''Speckles''"): Similar to
    Shigan Oren, but is performed with both hands instead of one and in half-leopard
    form (meaning that his fingers are clawed), this makes for the ultimate Shigan
    barrage. *Shugan ("Hand Gun"):A version of Shigan where Lucci extends all five
    of his fingers to stabs the opponent with his whole hand. **Shugan: "Oren" ("Hand
    Gun: ''Yellow Lotus''"): A rapid-fire version of Shugan that hits the opponent
    several times similar to Shigan Oren. **Shugan: "Madara" ("Hand Gun: ''Speckles''"):
    Similar to Shugan Madara, Lucci performs Shugan with both hands in a very rapid
    barrage of attacks Lucci_Shigan.gif|Shigan Shigan_Ouren.gif|Shigan Ouren Shigan_Bachi.gif|Tobu
    Shigan Bachi Shigan_Madara.gif|Shigan Madara Shugan.gif|Shugan Shugan Oren.gif|Shugan
    Oren Shugan Madara.gif|Shugan Madara Also known as Storm Leg, is a powerful projectile
    technique, in which the users start by kicking at very high speeds and strength,
    sending out a sharp compressed air blade that can slice objects and greatly damage
    a human body. However, it has been shown that almost any length of the appendage
    (such as a tail or neck) at high velocities are also capable of this move. *Rankyaku
    "Ran" ("Storm Leg: ''Riot/War''"): A rapid-fire technique, where Lucci launches
    multiple Rankyaku with both legs. *Rankyaku "Hyobi" ("Storm Leg: ''Leopard Tail''"):
    Used in half-leopard form. Rob Lucci creates a large, powerful Rankyaku in the
    shape of a swirl, which is launched at the enemy like a razor blade. *Rankyaku
    "Gaicho" ("Storm Leg: ''Victorious Bird''"): Lucci creates a large Rankyaku in
    the shape of a bird, but instead of using his legs, he uses his claws in his half-leopard
    form. Rankyaku.gif|Rankyaku Rankyaku_Hyoubi.gif|Rankyaku Hyoubi Rankyaku_Gaishou.gif|Rankyaku
    Gaishou Also known as Shave, allows the users to move at extremely high speeds
    in order to avoid attacks, as well as to attack at higher speeds and with greater
    power. It was revealed that the principle of this move was to kick off the ground
    at least ten times in the blink of an eye. Lucci_Soru.gif|Soru Also known as Paper
    Drawing, m'
