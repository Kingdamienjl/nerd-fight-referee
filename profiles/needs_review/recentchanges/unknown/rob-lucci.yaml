    - field: weaknesses
      value: "Standard Devil Fruit users weaknesses. Gear 2nd puts an excessive strain\
        \ on his body. Extremely susceptible to hypnosis. Gear 3rd's post-usage renders\
        \ him smaller for the same time he used the ability. As having so many shadows\
        \ puts strain on his body and mind, he can only maintain Nightmare Luffy's\
        \ Form for 10 minutes Notable Attacks/Techniques: * Gomu Gomu no Mi * Rokushiki\
        \ * Haki Gomu Gomu no Mi (Rubber Rubber Fruit): A Paramecia type Devil Fruit,\
        \ this fruit turns the user\u2019s body into rubber. The fruit's major strength,\
        \ as demonstrated by Luffy, is that the person's body can stretch like rubber\
        \ even when the ability user himself is nullified. It also makes them almost\
        \ entirely immune to blunt attacks, including hand-to-hand combat, bullets\
        \ or even cannonballs (this mechanic is further explained here). Thanks to\
        \ Luffy's own creativity both in and out of combat, this fruit has consistently\
        \ proven itself to be among the most formidable, versatile, and unpredictable\
        \ within the Paramecia class. The user's rubber-like body also allows the\
        \ user to survive falls from heights and collisions that would kill a normal\
        \ person. The user's ability to stretch and twist like rubber to extreme lengths\
        \ not only makes him immune to injuries that originate from such, but it also\
        \ allows him to even rebound, that can give him a great advantage in or out\
        \ of battle. Stretching also allows the user to drastically increase the range\
        \ of what would otherwise be considered a powerful close-range attack, turning\
        \ it into a devastating mid-range or long-range attack. A stretched limb can\
        \ also be used to store potential energy like a stretched spring, increasing\
        \ the velocity by stretching his arm back resulting in increased power. Combined\
        \ with Haki, his power is increased even more. Owing to rubber-like natural\
        \ insulating properties, the user is also immune to electrical attacks and\
        \ is also able to hit an electric Logia user without Haki. Additionally the\
        \ user is immune to the electricity produced by Electro. * Regular Techniques\
        \ * Gears * Gun and Artillery Themed Attacks * Other Weapon Themed Attacks\
        \ * Other Concepts and Themed Attacks * Rapid Fire Attacks * Defensive Techniques\
        \ * Improvised Moves The known normal Devil Fruit based attacks so far that\
        \ are named after guns and various other artillery, that Luffy has used, are\
        \ as follows: * Gomu Gomu no Pistol (\u30B4\u30E0\u30B4\u30E0\u306E\u9283\u30D4\
        \u30B9\u30C8\u30EB Gomu Gomu no Pisutoru, literally meaning \"Rubber Rubber\
        \ Pistol/Gun\"): Luffy's signature attack; he stretches his arm back then\
        \ throws a devastating punch. In other words, it is a standard straight punch,\
        \ augmented with stretching. This attack can be used from short to long range.\
        \ Luffy would typically increase the striking reach of fist by 'charging up'\
        \ by means of first repeatedly swinging his un-stretched punching arm around\
        \ before using the spinning force to both stretch his arm to its limits, and\
        \ to maximize the hitting power. ** Gomu Gomu no Pistol \"Shot\" (\u30B4\u30E0\
        \u30B4\u30E0\u306E\u9283\u30D4\u30B9\u30C8\u30EB\uFF62\u6563\u5F3E\uFF63\u30B7\
        \u30E7\u30C3\u30C8 or \uFF62\u6563\u5F3E\uFF63\u30B7\u30E7\u30C3\u30C8\u30AC\
        \u30F3 Gomu Gomu no Pisutoru Shotto or Shottogan, literally meaning \"Rubber\
        \ Rubber Pistol/Gun: 'Buckshot'\"): Starts off as an ordinary Pistol attack,\
        \ after which Luffy \"twangs\" his stretched arm, causing his fist to connect\
        \ multiple times. This was first seen being used against Crocodile after Luffy\
        \ wet his own body with water. * Gomu Gomu no Bullet (\u30B4\u30E0\u30B4\u30E0\
        \u306E\u9283\u5F3E\u30D6\u30EC\u30C3\u30C8 Gomu Gomu no Buretto, literally\
        \ meaning \"Rubber Rubber Gun Bullet\"): Luffy stretches one arm, far behind\
        \ him while running, then snaps it back to deliver a short-distance, one-fisted\
        \ powerful blow to an opponent. * Gomu Gomu no Rifle (\u30B4\u30E0\u30B4\u30E0\
        \u306E\u56DE\u8EE2\u5F3E\u30E9\u30A4\u30D5\u30EB Gomu Gomu no Raifuru, literally\
        \ meaning \"Rubber Rubber Rotating Bullet\"): Similar to the Gomu Gomu no\
        \ Bullet, but Luffy twists his arm around as he stretches it behind him and\
        \ hits the opponent at close range, massively increasing the velocity of the\
        \ punch as twisting the arm stretches the arm even further without having\
        \ to draw it back any longer which also saves the amount of time the kick-back\
        \ takes. * Gomu Gomu no Bazooka (\u30B4\u30E0\u30B4\u30E0\u306E\u30D0\u30BA\
        \u30FC\u30AB Gomu Gomu no Baz\u016Bka, literally meaning \"Rubber Rubber Bazooka\"\
        ): Luffy stretches both his arms far back, and then hurls them forward, striking\
        \ his opponent with both instantaneously with a double open palm strike with\
        \ both hands, that frequently sends the recipient(s) flying off the other\
        \ direction. This is usually used as a finishing move, he often prefers to\
        \ do it at point-blank range, sometimes running up to his opponent as he's\
        \ charging it. ** Gomu Gomu no Cannon (\u30B4\u30E0\u30B4\u30E0\u306E\u653B\
        \u57CE\u7832\u30AD\u30E3\u30CE\u30F3 Gomu Gomu no Kyanon, literally meaning\
        \ \"Rubber Rubber Siege Cannon): Luffy builds up speed and momentum with a\
        \ long series of quick punches similar to Gomu Gomu no Gatling, stopping just\
        \ short of the target(s) at first, and finishes with a single double-palm\
        \ blow similar to Bazooka. A powerful technique that can pierce strong armor,\
        \ and, in combination with Zoro's Three-Swords Style, is devastating enough\
        \ to puncture a hole through a massive tidal wave. * Gomu Gomu no Bow Gun\
        \ ("
