    - field: durability
      value: Island level (More durable than the other members of CP9. Completely
        unphased from a barrage of punches from a struggling Water 7 Luffy, and he
        blocked a kick from an enraged kick from Water 7 Sanji, He withstood a punch
        to the face from Gear 2nd Luffy, though this still visibly injured him and
        sent him flying a fair distance), higher with Tekkai (Tanked a Gomu Gomu no
        Gatling Gun from Luffy and a punch from Franky), far higher in Hybrid Form
        (Took numerous attacks from Gear 2nd Luffy with minimal damage despite Gear
        2nd being capable of thrashing Lucci in his Base Form), even higher with Hybrid
        Tekkai (Although he was nearly defeated by it, he could take a punch from
        Gear 3rd Luffy and remain conscious enough to fight him in Gear 2nd again)
        | Moon level (Should be at least as durable as Kaku, who withstood being hit
        by the Frontier Dome's laser defense at 72% power. Stussy needed to use sea
        prism stone to weaken Lucci in order to incapacitate him188.362 Exatons),
        Small Planet level in Hybrid Form (As a physical fighter, he can withstand
        the force of his own physical attacks3.014 Zettatons), far higher with Awakening
        (Fought against Enma unleashed Zoro for an extended period of time, taking
        several attacks from him without going down. Could take a few attacks from
        Gear 5th Luffy before eventually losing), even higher with Armament Haki (Withstood
