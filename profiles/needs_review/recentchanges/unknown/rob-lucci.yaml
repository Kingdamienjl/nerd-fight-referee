        membersOne Piece Vol. 39 Chapter 373. Matched Luffy's Gum Gum Bazooka with
        a weaker attackOne Piece Vol. 43 Chapter 41018.7 Gigatons) far higher in Hybrid
        Form (Fought Gear 2nd Luffy for an extended period of timeOne Piece Vol. 44
