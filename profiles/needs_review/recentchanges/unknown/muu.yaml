- id: claim-powers-and-abilities-898b23c3
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Likely Weapon Mastery (While alive,\
    \ M\u016B carried a pair of swords with him, implying that he was skilled in kenjutsuNaruto:\
    \ Chapter 525: Page 22) *Acrobatics *Chakra Manipulation **Statistics Amplification\
    \ (Shinobi are capable of enhancing their physical capabilities with the use of\
    \ chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance their speed\
    \ by focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto\
    \ Chapter 71) **Surface Scaling and Water Walking (By focusing chakra at the soles\
    \ of their feet, Shinobi can scale and cling to vertical surfaces, and even walk\
    \ on waterNaruto Chapter 18Naruto Chapter 90) **Minor Illusion Creation and Duplication\
    \ (With the Clone TechniqueRin no Sho, Page 220, Shinobi can create illusionary\
    \ duplicates of themselves that have no physical substance) **Shapeshifting (With\
    \ the Transformation TechniqueRin no Sho, Page 220, Shinobi can transform themselves\
    \ into other people, animals, plants, and even inanimate objects, such as weapons)\
    \ **Paralysis Inducement (With the Temporary Paralysis TechniqueRin no Sho, Page\
    \ 176, Shinobi can completely paralyze their targets from close to mid range)\
    \ *Extrasensory Perception (As a sensor type, he can sense chakraNaruto Chapter\
    \ 554, even over a distance of several kilometres and discern the similarity between\
    \ chakra signatures belonging to close relativesNaruto Chapter 525, and distinguish\
    \ chakra from different populationsNaruto Chapter 547) *Water Manipulation, Limited\
    \ Light Manipulation, Invisibility and Aura Suppression (With Dustless Bewildering\
    \ Cover, M\u016B can utilize water vapour to bend the light around himself, essentially\
    \ making him invisible and completely erasing his presenceJun no Sho, Page 296.\
    \ Having neither a physical form nor detectable chakra while the technique was\
    \ active, he can't be detected by chakra detection or heightened sensesNaruto\
    \ Chapter 524Naruto Chapter 525) *Limited Gravity Manipulation, Density Manipulation\
    \ and Flight (Can reduce the gravity of his body and of the atmosphere itself,\
    \ making his body much lighter and allowing him to fly) *Deconstruction and Power\
    \ Nullification (Molecular - Particle Style is considered an indefensible Jutsu\
    \ given its effect of molecularly decomposing anything it comes in contact with,Jin\
    \ no Sho: Page 259 be it Ninjutsu or Ninja Tools, by dismantling the atomic bonds\
    \ that hold the molecules together.Naruto: Chapter 466Naruto: Chapter 546Naruto:\
    \ Chapter 552Naruto: Chapter 575 Sequentially, anything that is decomposed by\
    \ Particle Style is further decimated by its ability to eliminate residual \"\
    root materials\" that weren't completely dispersed by the initial phase of Particle\
    \ Style\u2019s decomposition) *Fissionism (With Fission Technique, M\u016B can\
    \ split himself into two duplicates to help escape a lethal blow, but at the cost\
    \ of reducing his power by halfNaruto Chapter 558) *Earth Manipulation, Fire Manipulation,\
    \ Air Manipulation and Electricity Manipulation (M\u016B wielded all five elemental\
    \ nature transformationsJin no Sho, Page 118. Earth, Fire, and Wind Releases are\
    \ simultaneously activated by him through Dust ReleaseNaruto: Chapter 525: Page\
    \ 22-23, while Lightning Release was not used by him on screen) All previous abilities\
    \ when alive, plus: *Regeneration (Low-Godly - Edo Tensei are capable of regenerating\
    \ from the complete destructionNaruto Chapter 517 page 8 and 9 of their bodiesNaruto\
    \ Chapter 561. It's stated that as long as the soul remains, the Edo Tensei will\
    \ keep coming back to lifeNaruto Chapter 120Naruto Chapter 518) *Immortality (Types\
    \ 1, 2, 3, 4, 7 and 8 - Edo Tensei are corpses possessed by a soul brought back\
    \ from the Pure Land. They are incapable of feeling pain along with being able\
    \ to survive grievous injuries such as bisectionNaruto Chapter 523 and dismemberment.Naruto\
    \ Chapter 520 page 21 Edo Tensei will keep coming back so long as their soul remains\
    \ bound to the Edo realmNaruto Chapter 120Naruto Chapter 518) *Inorganic Physiology\
    \ (Type 1 - Edo Tensei bodies are comprised of dust and ash enveloping an already\
    \ deceased corpse shaping it into the revived person the caster choosesNaruto\
    \ Chapter 119) *Self-Sustenance (Types 1, 2 and 3 - The Edo Tensei are the souls\
    \ of the dead the caster wants to reanimate, the caster uses an already dead body\
    \ to house the revived soulNaruto Chapter 520) *Instinctive Action (Edo Tensei\
    \ are programed to automatically counter enemy jutsuNaruto Chapter 547 along with\
    \ their bodies moving of its own accordNaruto Chapter 548) *Resistance to Mind\
    \ Manipulation, Empathic Manipulation and Emotion Detection (Even though Edo Tensei\
    \ are able to retain their consciousness when brought back from the afterlife,\
    \ the controller can suppress their free willNaruto Chapter 119 Page 16 binding\
    \ their mind and shutting off all emotionNaruto Chapter 522)"
