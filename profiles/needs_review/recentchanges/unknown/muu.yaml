    - field: weaknesses
      value: "Dividing himself cuts his power in half, and cannot use more complex\
        \ Nature Transformations. Notable Attacks/Techniques: *Earth Release: **Light-Weight\
        \ Rock Technique: Contrary to its counterpart, this technique reduces one's\
        \ gravity, making it much lighter. The atmosphere, along with their body,\
        \ can be lightened in order to take flight and increasing their manoeuvrability.\
        \ With enough practice, the user can control their flight through the sky\
        \ with specific bodily movements. However, a consequence of using this technique\
        \ on oneself or another individual is a decrease in the physical force of\
        \ the affected person's attacks. *Water Release: **Dustless Bewildering Cover:\
        \ The Dustless Bewildering Cover technique utilises water vapour to bend the\
        \ light around the user essentially making them invisible. This technique\
        \ allows the user to completely erase their presence, causing them to have\
        \ neither a physical form nor detectable chakra while the technique is active.\
        \ As such, they cannot be detected through traditional means such as chakra\
        \ detection or through heightened senses. *Dust Release: Dust Release (Viz:\
        \ Particle Style) is a nature transformation kekkei t\u014Dta, a combination\
        \ of earth, wind, and fire. To perform Dust Release, users form a small three-dimensional\
        \ object (e.g. a cube, a cone, etc.) out of chakra in their hands. The object\
        \ expands once released by the user and moves astonishingly fast at its target;\
        \ anything that passes through it (or that is passed through by it) is disintegrated\
        \ on a molecular level. Because of the sheer destructiveness of Dust Release,\
        \ its users are usually unmatched in a fight and they can easily fend off\
        \ countless enemies. For this reason, the best way to combat one Dust Release\
        \ user is with a second Dust Release user. **Detachment of the Primitive World\
        \ Technique: The user uses Dust Release to create a structure, with a sphere\
        \ located at its centre, between the palms of his hands. The structure expands\
        \ rapidly in size when being propelled towards its intended target and traps\
        \ them inside its confines. The sphere then seems to explode with a tremendous\
        \ amount of force, while the exterior walls of the structure effectively restrict\
        \ the size of the blast radius, resulting in the destruction of everything\
        \ and anyone caught within as they are pulverised into minute particles of\
        \ dust. The technique isn't limited to just affecting physical matter; it\
        \ can also affect chakra-based defences, witnessed from \u014Cnoki's use of\
        \ it to destroy Madara Uchiha's Susanoo. The resulting damage that this technique\
        \ can produce varies considerably, depending on the initial shape of the created\
        \ structure. For example, when fabricated in the form of a cube, the structure\
        \ possesses a relatively small blast radius, minimising the possibility for\
        \ collateral damage. However, the conical version was implied to be enough\
        \ to potentially destroy an entire island. Additionally, it is possible to\
        \ produce a much larger variant of the cube-shaped technique, which was large\
        \ enough to destroy twenty-five Susanoo-clad wood clones in an instant. This\
        \ cube can also be split into two after being activated, allowing for other\
        \ techniques to be directed between the two halves. When two similar techniques\
        \ of approximately equal power collide, the pair merge into a single large\
        \ spherical explosion; where everything caught within the substantial blast\
        \ radius is completely pulverised. *Fission Technique: The Fission Technique\
        \ is a highly advanced ninjutsu which allows M\u016B to literally split his\
        \ own body into two identical \u2014 yet entirely independent \u2014 duplicates\
        \ of himself. Unlike clone techniques that only appear to be similar, the\
        \ ability is instead a physical separation and so does not require hand seals\
        \ to activate, making it faster in comparison as a result. This also means\
        \ that even if one is incapacitated, the other remains completely unaffected\
        \ as neither can truly be regarded as the original. Because the duplicates\
        \ cannot be dispelled like normal clones, they will be unable to reunite if\
        \ one is sealed. This poses a great risk to M\u016B as his chakra reserves\
        \ are also halved in the process. In doing so, he is left unable to use more\
        \ taxing techniques like his Dust Release kekkei t\u014Dta. *Sensing Technique:\
        \ The Sensing Technique allows sensor type shinobi to mould chakra and change\
        \ it to the sensor type. This enables them to detect and track down targets\
        \ through their chakra signatures. The range of this technique varies between\
        \ sensors. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==\
        \ ==Notes/Explanations== Category:Naruto Category:Characters Category:Manga\
        \ Characters Category:Anime Characters Category:Male Characters Category:Antagonists\
        \ Category:Kages Category:Invisibility Users Category:Duplication Users Category:Fire\
        \ Users Category:Earth Users Category:Water Users Category:Electricity Users\
        \ Category:Ninjas Category:Flight Users Category:Air Users Category:Immortals\
        \ Category:Acrobats Category:Regeneratio"
