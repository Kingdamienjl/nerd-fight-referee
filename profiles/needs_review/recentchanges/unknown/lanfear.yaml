- id: claim-weaknesses-35e06450
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: Channeling the One Power: Lanfear
    is one of the most powerful channelers ever to exist, comparable in strength to
    both Ishmael and Rand al'' Thor. A full explanation of channeling the One Power
    and the numerous abilities it grants is found here, and an explanation of the
    True Power is found here. Below is a list of Power-related abilities most relevant
    to Lanfear specifically: *Balefire: A weave that erases whatever it touches from
    existence, matter, and soul, retroactively removing it from time. The more power
    is used to weave the balefire, the farther back in time the target is removed
    from. Using balefire too much actively destabilizes reality around the user. In
    the War of Power at the end of the Age of Legends, the entire Pattern nearly unraveled
    from its use. *Incurable Wounds: Through the use of the True Power, Ishamael can
    inflict wounds that are completely incurable through the use of the One Power.
    They also never stop inflicting pain. Characters over the course of the series
    feel what Rand does, and are surprised that he can continue to function with a
    wound constantly causing him enough pain to leave any normal man weeping uncontrollably.
    *Shadow Cloak: Using the True Power Lanfear activates a full-body, shadowy shield.
    Ishmael used it to completely no-sell a blast from Rand that could "make the seas
    burn and eat mountains." *Transformation, she is capable of changing her appearance
    to take whatever form she desires, enough so to hide from Rand on multiple occasions.
    Tel''aran''rhiod Manipulation: Lanfear was one of the forsaken Dreamwalkers, and
    can access the world of dreams while sleeping as well as travel there in the flesh
    via a Gateway-like portal made using the Power. She should be comparable to Ishmael
    who demonstrated extreme skill and knowledge of Tel''aran''rhiod, able to fire
    off extremely rapid, non-stop attacks against Rand al''Thor, including but not
    limited to: pressure on every point of Rand''s body, 1000x gravity, placing him
    in a vacuum, making the air around him stone, and creating "unseen maws" to "rip
    [Rand]''s mind from his body, to tear away his soul". ==Notable Matchups== Victories:
    Losses: Inconclusive: Category:Characters Category:The Wheel of Time Category:Air
    Users Category:Antagonists Category:Biology Users Category:Book Characters Category:Creation
    Users Category:Dimensional Travel Users Category:Dream Users Category:Earth Users
    Category:Electricity Users Category:Energy Users Category:Enhanced Senses Users
    Category:Existence Erasure Users Category:Extrasensory Perception Users Category:Female
    Characters Category:Fire Users Category:Flight Users Category:Forcefield Users
    Category:Ice Users Category:Illusionists Category:Light Users Category:Magic Users
    Category:Metal Users Category:Mind Users Category:Plant Users Category:Portal
    Users Category:Power Nullification Users Category:Reality Warpers Category:Soul
    Users Category:Sound Users Category:Temperature Users Category:Time Users Category:Water
    Users Category:Weapon Creation Users Category:Weather Users Category:Fantasy Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
