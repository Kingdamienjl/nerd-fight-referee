    notes: auto_repair source extraction
  intelligence:
    text: 'Gifted (Despite his goofy and undignified personality, Hashirama is a highly
      capable combative and political strategist. He developed the Hidden Village
      system that finally ended clan warfare that claimed thousands of lives.Naruto,
      Chapter 625: "My True Dream" He built the villages political and economic structure
      from the ground up. He did this by acting as a symbol for the foundational principles
      he created. These principles were so well conceived, that even with their flaws,
      they still served to protect the village even in its most trying times, for
      decades to follow, such as the Uchiha rebellion. He was able to broker international
      peace agreements between hostile and emerging nations through his conviction.
      He was a highly gifted Shinobi who mastered many complex Ninjutsu, Genjutsu,
      and even the field of Senjutsu, one of the Shinobi world''s most esoteric techniques.
      He was so skilled in Senjutsu, he managed to overcome its most major flaw, its
      long charge time, by being able to instantly enter the form.Jin No Sho His mastery
      over the complex field of Medical Ninjutsu surpassed his Granddaughter Tsunade''s
      by leaps and bounds. He is also an incredibly gifted and charismatic leader,
      one who was able to rally the armies of the entire world and boost their morale
      in the face of an insurmountable adversary. In addition to his sheer charisma,
      he leads by producing complex strategies on the fly that can be easily understood
      and executed by both the highly skilled and legendary Shinobi, and the common
      foot soldier. He instinctively coordinated a plan with the other Hokage to scout
      out Ten-Tails Jinchuriki Obito''s new powers by taking advantage of their immortal
      Edo bodies.)'
    source_ids:
    - vsbattles-hashirama-senju-unknown
    confidence: 0.6
    notes: auto_repair source extraction
