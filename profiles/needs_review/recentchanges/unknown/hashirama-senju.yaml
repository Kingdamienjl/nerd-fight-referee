    text-align: left; \" |Notable Attacks/Techniques: |- | Tumblr n8lwak1Ajv1ryyqmmo1\
    \ 500.gif|Wood Style, Deep Flowering Forest Bloom Dcfd749db481bc866db655a25894689ed8db332e\
    \ hq.gif|Wood Style Hidden Jutsu: Deep Forest Emergence Madara-wood-daragon-animeipics1\
    \ (1).png|Wood Style, Wood Dragon Jutsu Giant Wood Human.png|Wood Style: Wood\
    \ Golem Jutsu Tumblr mi6bk6dlYt1robctgo1 500.gif|Wood Style: Wood Expulsion Jutsu\
    \ Tumblr n7f6l5yf8s1s307p6o1 500.gif|Sage Art, Wood Style Sage Art Wood Release\
    \ True Several Thousand Hands-animeipics.PNG|Sage Art, Wood Style: Shinsu Senju\
    \ - Veritable Thousand-Armed Kannon *: An advanced nature Kekkei Genkai that combines\
    \ earth and water-based chakra natures to create wood or complete trees. This\
    \ ability can also be used to grow other aspects of trees, such as seeds or flowers.\
    \ Wood Style techniques can be produced from anywhere, including the user's body,\
    \ as the user's chakra is converted into a source of life. **: The user creates\
    \ a clone of themselves made out of wood. The clone more durable than the regular\
    \ shadow clones, and it can merge with plants and trees. It also can travel far\
    \ distances from the user and can communicate with the original. **: The user\
    \ creates a dense forest of flowering trees over a significantly larger area (calculated\
    \ to be over a kilometer). The pollen produced by these flowers is then released\
    \ into the atmosphere and, when inhaled, renders any afflicted target unconscious.\
    \ **: The user forces trees to grow on any surface, creating a dense forest anywhere\
    \ they choose. A small plant can grow into a forest in an instant. By generating\
    \ chakra, the user maneuvers it as they see fit for attack and defense; furthermore,\
    \ this technique even allows them to capture the enemy simultaneously. With their\
    \ tremendous life force, the trees can pierce through earthen walls and extend\
    \ their branches at their prey instantly. **: The user creates a gigantic dragon\
    \ with a tengu-like face, can easily restrain targets as strong as BM Naruto's\
    \ full Tailed Beast State and survive being struck by Madara Uchiha's Susano'o\
    \ Swords, and is used to drain the chakra from a target. The only counters are\
    \ to destroy the head of the dragon. **: The user creates a gigantic wood statue\
    \ to combat a similar-sized opponent such as Madara's Final Susanoo or the Tailed\
    \ Beasts. It is durable and fast enough to catch a Tailed Beast Bomb from Kurama\
    \ and survive its explosion with Wood Style: Wood Expulsion Jutsu. **: The user\
    \ creates a gigantic shield of wood with the face of Avalokite\u015Bvara, which\
    \ is strong enough to block Kurama's standard Tailed Beast Bomb blast. **: The\
    \ user creates several gigantic hands in an attempt to restrain a target. *: When\
