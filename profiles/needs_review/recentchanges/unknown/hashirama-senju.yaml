    notes: auto_repair source extraction
  stamina:
    text: 'Superhuman (Is stated to have more chakra than Kurama Chakra Mode Naruto
      enhanced by Kurama Mode Minato''s chakra,Naruto, Chapter 644: "I Know" who could
      maintain and create thousands of shadow clones, distribute said chakra to thousands
      of shinobi all while simultaneously battling the reanimated Kage, the Jinchuriki,
      Ten-Tails Obito and Madara Uchiha. Hashirama has been shown to fight Madara
      and Kurama simultaneously for days at the Valley of the End, using multiple
      large-scale techniques the entire time. His endurance far exceeds even legendary
      shinobi like the Third Raikage, who fought ten thousand shinobi non-stop for
      three days and three nights.Naruto, Chapter 553: "The Battlefield!!" Hashirama
      can also enter Sage Mode, further boosting his already existing enormous amount
      of chakra.)'
    source_ids:
    - vsbattles-hashirama-senju-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Standard Melee Range with Taijutsu, Extended Melee Range with weapons,
