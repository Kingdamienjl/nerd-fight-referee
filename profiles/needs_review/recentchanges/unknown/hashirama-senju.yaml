        trying times, for decades to follow, such as the Uchiha rebellion. He was
        able to broker international peace agreements between hostile and emerging
        nations through his conviction. He was a highly gifted Shinobi who mastered
        many complex Ninjutsu, Genjutsu, and even the field of Senjutsu, one of the
        Shinobi world''s most esoteric techniques. He was so skilled in Senjutsu,
