    - field: weaknesses
      value: "Sage Mode lasts a few minutes and exhausts him. Notable Attacks/Techniques:\
        \ * Mokuton (Wood Release): An advanced nature kekkei genkai that combines\
        \ earth and water-based chakra natures to create wood or complete trees. This\
        \ ability can also be used to grow other aspects of trees, such as seeds or\
        \ flowers. Wood Release techniques can be produced from anywhere, including\
        \ the user's body, as the user's chakra is converted into a source of life.\
        \ ** Mokuton Bushin no Jutsu (Wood Clone Technique): The user creates a clone\
        \ of themselves made out of wood. The clone more durable than the regular\
        \ shadow clones, and it can merge with plants and trees. It also can travel\
        \ far distances from the user and can communicate with the original. ** Mokuton:\
        \ Kajukai K\u014Drin (Advent of a World of Flowering Trees): The user creates\
        \ a dense forest of flowering trees over a significantly larger area (calculated\
        \ to be over a kilometer). The pollen produced by these flowers is then released\
        \ into the atmosphere and, when inhaled, renders any afflicted target unconscious.\
        \ ** Mokuton Hijutsu: Jukai K\u014Dtan (Secret Jutsu: Nativity of a World\
        \ of Trees): The user forces trees to grow on any surface, creating a dense\
        \ forest anywhere they choose. A small plant can grow into a forest in an\
        \ instant. By generating chakra, the user maneuvers it as they see fit for\
        \ attack and defense; furthermore, this technique even allows them to capture\
        \ the enemy simultaneously. With their tremendous life force, the trees can\
        \ pierce through earthen walls and extend their branches at their prey instantly.\
        \ ** Mokuton: Mokury\u016B no Jutsu (Wood Release: Wood-Dragon Technique):The\
        \ user creates a gigantic dragon with a tengu-like face, can easily restrain\
        \ targets as strong as BM Naruto's full Biju Mode and survive being struck\
        \ by Madara Uchiha's Susano'o Swords, and is used to drain the chakra from\
        \ a target. The only counters are to destroy the head of the dragon. ** Mokuton:\
        \ Mokujin no Jutsu (Wood Release: Wood Human Technique):The user creates a\
        \ gigantic wood statue to combat a similar-sized opponent such as Madara's\
        \ Final Susanoo or the Biju. It is durable and fast enough to catch a Bijudama\
        \ shot from Kurama and survive its explosion with the Mokuton: H\u014Dbi no\
        \ Jutsu. ** Mokuton: H\u014Dbi no Jutsu (Wood Release: Wood Expulsion Technique):\
        \ The user creates a gigantic shield of wood with the face of Avalokite\u015B\
        vara, which is strong enough to block Kurama's standard Bijudama blast. **\
        \ Mokuton: Hotei no Jutsu (Wood Release: Laughing Buddha Technique): The user\
        \ creates several gigantic hands in an attempt to restrain a target. * Senp\u014D\
        : Mokuton (Sage Art: Wood Release): When the user balances with their chakra\
        \ reserves with Natural Energy, they create a new chakra called Sage Chakra.\
        \ When this happens, their ninjutsu, taijutsu, and genjutsu all gain a tremendous\
        \ leap. Moreover, the user also gains increased speed, strength, and durability.\
        \ ** Senp\u014D: Mokuton: Shin S\u016Bsenju (Sage Art: Wood Release: True\
        \ Several Thousand Hands): The user creates a colossal statue of a praying\
        \ Senju Kannon or Avalokite\u015Bvara, armed with several rows of gigantic\
        \ arms on its back. The size of the figure dwarfs even Kurama and the surrounding\
        \ mountains. ** Ch\u014Dj\u014D Kebutsu (Top Transformed Buddha): The user\
        \ unleashes their Shin Susenju at the target in a barrage of gigantic punches.\
        \ ** Senp\u014D: My\u014Djinmon (Sage Art: Gate of the Great God): The user\
        \ creates several gigantic Torii which drop down on the target with tremendous\
        \ force, pinning them to the ground. It's strong enough to restrain even the\
        \ Juubi in its Muscular form. * Doton (Earth Release): One of the basic elemental\
        \ nature transformation techniques and allow the user to manipulate the surrounding\
        \ earth for offensive and defensive purposes or create it; be it dirt, mud,\
        \ or rock. * Suiton (Water Release): One of the basic elemental nature transformation\
        \ techniques that allow the user to manipulate pre-existing water, or create\
        \ their own, by turning their chakra into water. It takes much more skill\
        \ to make the water than to control what is already available and expel it\
        \ from their mouths. One of the most versatile of the five essential chakra\
        \ natures, Water Release techniques, can change shape and state. * Kokuangyo\
        \ no Jutsu (Bringer-of-Darkness Technique): This technique exerts a hallucinatory\
        \ effect upon the eyesight, effectively blinding the opponent. Although it\
        \ negates sight, it does not stop the other senses."
