  attack_potency:
    text: 'Country level (Should be stronger than he was as an Edo Tensei, as the
      Hokage were only revived at near their full strength. Sage Mode Madara implied
      that he only had the edge over Hashirama and Tobirama because they were weakened
      by the Edo Tensei. He is the only one who was capable of matching and defeating
      Madara Uchiha.7 Teratons), higher with Sage Mode (Is much stronger than his
      base form,Sha no Sho, Page 279 as Sage Mode is stated to dramatically enhance
      one''s Ninjutsu, Genjutsu and Taijutsu.), up to Multi-Continent level with Wood
      Style (His Wood Dragon is capable of physically restraining full power Kurama.Naruto,
      Chapter 607: "It Doesn''t Matter to Me" His Wood Golem is comparable to Kurama,Jin
      no Sho, Page 299 and can easily catch his Tailed Beast Bomb.63.28 Petatons),
      far higher with Sage Art: Wood Style (Far stronger than before due to Sage Mode.
      His Wood Golem was also able to contend with Madara''s Perfect Susanoo when
      he was weaker as an Edo Tensei. His Shinsu Senju is unfathomably more powerful
      than the Wood Golem, and is capable of matching the Majestic Attire: Susano''o''s
      Evil Disturbance Waltz and greatly damaged the Nine-Tails empowered Perfect
      Susano''o''s armor.314.84 Petatons)'
    source_ids:
    - vsbattles-hashirama-senju-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
