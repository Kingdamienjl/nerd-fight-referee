    - field: weaknesses
      value: "None notable Notable Attacks/Techniques: *Parasite Creation: Sphinx\
        \ has the ability to create parasites that take over a living target's body\
        \ and turns them into \"zombies\".\"So, this is the essence of the zombies.\
        \ They\u2019re parasites... no, parasitic creatures?\" Re:Zero Tanpenshuu\
        \ Volume 4, Pride and Prejudice and Zombies, Section 5. While their manner\
        \ of creation is unknown, these creatures completely follow Sphinx's will\
        \ and seek to create a \"paradise\" for her.\"Well, that\u2019s because our\
        \ maker is our maker. Our real parents... to be exact, our maker is the incentive\
        \ that allowed us to be reborn. To make a paradise where our maker could be\
        \ at peace\u2014\u2014that is the mission that has been bestowed upon us.\"\
        \ Re:Zero Tanpenshuu Volume 4, Pride and Prejudice and Zombies, Section 10.\
        \ They initially form in a host's body as a living tentacle-like appendage\
        \ that is capable of physical movement. Upon taking control of a host's body,\
        \ the host is killed, and the parasites are able to use the leftover brain's\
        \ intellect and thought processes.\"Ah, who knows. The speed of our growth\
        \ is very fast. At first, we may be corpses that are only able to move once\
        \ the brains are rotted, but that leaves hosts that have their intellect and\
        \ thought process intact...\" Re:Zero Tanpenshuu Volume 4, Pride and Prejudice\
        \ and Zombies, Section 10. While it is unknown if their process of taking\
        \ over human hosts is selective, they have only been observed to take over\
        \ adult males despite being able to nest themselves within women and children,\
        \ with the exception of one female host who was established as the parasites'\
        \ queen. They also have the ability to take over non-human animal hosts, such\
        \ as rats. Similarly to Sacrament of the Immortal King's effects, the zombies'\
        \ bodies slowly decompose over time after being taken over.\"They were trying\
        \ to stick their rotting arms and feet back on to their bodies, trying to\
        \ restore it to the way it was before.\" Re:Zero Tanpenshuu Volume 4, Pride\
        \ and Prejudice and Zombies, Section 3. Although it is unknown if there is\
        \ a limit on how many parasites can be created, it is possible for more than\
        \ two thousand of them to exist at the same time,Exceeding the likes of a\
        \ hundred, two hundred, a thousand, and two thousand, the mice that surrounded\
        \ the captive girl in the dark were tremendous in numbers, standing still\
        \ without letting out a single cry. Re:Zero Tanpenshuu Volume 4, Pride and\
        \ Prejudice and Zombies, Section 15. with each one loyal to Sphinx's desires.If\
        \ anything, it was the opposite. \u2014\u2014The mice did not view her as\
        \ prey, but they were venerating her as something special. That was the loyalty\
        \ that was directed towards a queen, what could only be established by the\
        \ dominance of their instinct, which was an impossible evil that was brought\
        \ to fruition. The mice, having lost their free will, gazed at the girl with\
        \ eyes that were identical to a corpse. Re:Zero Tanpenshuu Volume 4, Pride\
        \ and Prejudice and Zombies, Section 15. *Sacrament of the Immortal King (\u4E0D\
        \u6B7B\u738B\u306E\u79D8\u8E5F Fushiou no Hiseki): Sacrament of the Immortal\
        \ King is an ancient curse art created by an unknown Witch long ago.\"It was\
        \ one of the exceptional magics, supposedly created by a witch who held the\
        \ world in thrall, before the knowledge was lost.\" Re:Zero Ex Light Novel\
        \ Volume 1, Felix Argyle's Curse, Section 8. The curse, when cast correctly,\
        \ will allow the user to reanimate corpses of the dead and make them do their\
        \ bidding.\"Put briefly, it allowed the user to control corpses according\
        \ to their will.\" Re:Zero Ex Light Novel Volume 1, Felix Argyle's Curse,\
        \ Section 8. Sadly, the technique to properly cast the curse has been long\
        \ lost to time, and only an incomplete incantation exists which was transcribed\
        \ in an old and withered book regarded as the most important heirloom of House\
        \ Argyle.\"Look at this! This is the text describing the Sacrament of the\
        \ Immortal King, that has been passed down in our house. Biehn dug in his\
        \ bag and pulled out a worn book.\" Re:Zero Ex Light Novel Volume 1, Felix\
        \ Argyle's Curse, Section 11. Originally, the curse was thought to be capable\
        \ of fully reviving a dead person, and there are legends of the aforementioned\
        \ Witch being supposedly capable of bringing back people exactly as they were\
        \ before their demise.\"The Witch who invented the spell had been said to\
        \ be able to bring the dead back, looking exactly as they had in life...\"\
        \ Re:Zero Ex Light Novel Volume 1, Felix Argyle's Curse, Section 8. Effectively,\
        \ the written chunks of the curse's full passage is incapable of producing\
        \ anything more than walking corpses with no soul of their own,\"Though the\
        \ flesh is revived, the soul does not reside within it. Reconstructing the\
        \ Sacrament of the Immortal King is indeed difficult.\" Re:Zero Ex Light Novel\
        \ Volume 2, Fifth Stanza, Section 3. creating \"Corpse Soldiers\" whose flesh\
