- id: claim-powers-and-abilities-317a7225
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Regeneration (High-Low: Able to reattach
    limbs and survive a sword through the brain) *Resurrection & Immortality (Types
    1, 2, 3, 4, 7 & 8, the Flower will not permit her to die. More resilient than
    the other Intoners who could withstand multiple stabs to vital organs without
    dying. She can regenerate from wounds that would normally kill. If she is ever
    killed or is too injured, she is immediately resurrected where she stood with
    the flower crafting her a new body. Zero is a corpse being kept alive by the Flower''s
    magic, with her brain, heart, and body being kept in motion by it. It should be
    noted the Flower is not a physical presence that can be physically destroyed or
    pulled out but an entity that will persist even if Zero''s body is destroyed and
    can warp reality with what has been described as a "reprogramming ability") *Extrasensory
    Perception (All characters demonstrate an ability to sense things in the environment)
    *Power Bestowal (Intoners are able to bestow power on another. These individuals
    become Disciples) *Statistics Amplification & Invulnerability (Intoner Mode greatly
    enhances speed and strength. When in Intoner Mode, only another Intoner can hurt
    her) *Magic, Forcefield Creation (Via magic) *Telekinesis (Intoners share identical
    magic, and Disciples can channel the magic of their respective Intoner; One is
    able to bind Zero telekinetically, and Octa is able to channel Armisael to bind
    One) *Attack Reflection (Can send spells and projectiles flying back at the the
    enemy) *Non-Physical Interaction (Able to interact with souls) *Sound Manipulation
    with Necromancy & Soul Manipulation (Intoners are gifted with a magic known as
    the Power of Song. The mere sound of their voice can cast various types of magic
    including wielder of Song which can raise the dead) *Mind Manipulation (Can force
    others to do their bidding and even rewrite their memories, Three is able to force
    Octa to summon Armisael) *Transmutation (Turned doves into the Disciples, humans
    of considerable magical ability to seal the power of the other intoners) *Summoning
    (Can use the power of Song to summon angels and Daemons to fight on her behalf)
    * Multiple Selves (Type 3, The Flower is a parasite that feeds off of Zero, until
    it can fully grow, and destroy everything) *Magic *Immunity to Poison (Can still
    feel the effects of poison but will not be killed by it. In Ending B, while her
    body does go numb after being exposed to Raphael''s poison she suffers no other
    physical effects)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
