  intelligence:
    text: At least Genius (As a world-renowned femme-fatale Fujiko has had a lot of
      experience in countless fields throughout her half of century of thievery. She's
      casually infiltrated countless organizations and companies not only with her
      charm but also her surprisingly vast skillset. A multilinguist, an masterful
      driver in any craft, businesswoman, fashionista, Fujiko's skills allows her
      to constantly find a profit to be made anywhere in the world, be it from wars,
      thievery, coercion, or more legitimate means like being a caregiver (with maybe
      a dash of thievery). Her most impressive trait however is her expertise in chemistry
      as outside of Lupin III himself she is often cited as the most knowledgeable
      character in this category. Constantly utilizing different chemicals and poisons,
      most of her equipment is self made with her being smart enough to easily figure
      outFujiko Mine's Lie any type of poison being used by an opponent. Is consistently
      able to outsmart and backstab Lupin on various occasions and outsmarted Leonardo
      Da Vinci, being considered worthy to live in the "new world" where only the
      best of the best would be allowed)
