- id: claim-powers-and-abilities-7156741a
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Genius Intelligence *Enhanced Senses\
    \ (Capable of fighting highly skilled assassins in heavy smoke *Longevity (Should\
    \ be around the same age as Lupin) *Preparation *Acrobatics, Stealth Mastery,\
    \ and Unconventional Shapeshifting with Limited Sound Manipulation (Has decades\
    \ of working alongside and against Lupin III as master thief, resulting in her\
    \ being able to avoid capture with general ease.Part 4, Episode 26: World Dissection,\
    \ Part 2 Is highly skilled in acrobatics to the point of accomplishing insane\
    \ featsONE COLLECTION of agility. Can perfectly mimic the voice of other people\
    \ and disguise herself.Part 4, Episode 22: From Japan with Love as them perfectly\
    \ with her often always changing her own appearance to not be noticed. Is skilled\
    \ enough to fake being aged up and down at will2000 Carat Tears) *Limited Damage\
    \ Reduction (Disguises are capable of tanking hits for the user, preventing some\
    \ types of elemental damage from effecting them as they are torn offChasing the\
    \ Hidden Treasures of Tokugawa) *Social Influencing **Deception, Coercion, and\
    \ Charisma (1 Layer; She has an extremely long history of manipulating and backstabbing\
    \ men. As a master seductress there are few, if any men who don't fall for her\
    \ charms. She was even able to seduce Bincam so hard that he believed he was victim\
    \ to a type of mind control drug, despite him being both resistant to such tactics\
    \ and being artificially created with no concept of love.Fujiko Mine's Lie Was\
    \ able to convincingly fake her death with no prior planning while being recorded\
    \ to a massive audiencePart 4, Episode 18: The Murdering Marionette) *Photographic\
    \ Memory (Great thieves are capable of instantaneously memorizing their environments\
    \ and scenarios down to the smallest of detailsLupin III vs Cat's Eye) *Vehicular\
    \ Mastery (Can fly planes, drive motorcycles, helicopters, and even drive a car\
    \ backward and in heavy smokeThe Fuma Conspiracy) *Weapon Mastery and Marksmanship\
    \ *Expert in Hand to Hand Combat, Pressure Points, and Paralysis Inducement (Can\
    \ hit a pressure point that paralyses the victim and knocks them outTWCFM Episode\
    \ 2) *Sleight of Hand (By helping a magician in training, Fujiko gained the capabilities\
    \ of using magic tricks in order to deceive peoplePart 4, Episode 5: The Magician's\
    \ Left Hand) **Teleportation and Duplication (Fujiko was shown to survive being\
    \ lit ablaze by fire arrows unharmed, despite being clearly hit by them) **Likely\
    \ Telekinesis (While she hasn't shown the capability to do so herself, she should\
    \ know how to levitate and control small objects) *Mind Manipulation with hypnosis\
    \ *Unconventional Multiple Selves (Type 1; Characters in the franchise gain unique\
    \ thought patterns and cognizance for each language they are fluent in, with Fujiko\
    \ knowing English, Japanese, Italian, and French) *Non-Physical Interaction and\
    \ Breaking the Fourth Wall (Capable of physically interacting with and effecting\
    \ 4th Wall objects like the screen.Resurrection of Mamo Should be capable of accomplishing\
    \ similar feats to Zenigata and Lupin) **Probability Manipulation (Is capable\
    \ of changing probability by shooting 4th wall objectsThe Invitation from Zenigata)\
    \ **Hammerspace (Is capable of concealing large items on her person, such as a\
    \ hang glider.I'm a Super hero\uFF5E Was able to hide a gun, grappling hook, and\
    \ a piece of lipstick despite wearing practically nothingTWCFM Episode 1) *Self-Sustenance\
    \ (Type 1; Capable of surviving in space with nothing to protect her) *Elasticity\
    \ (Scales to the rest of the cast, who are can survive being flattenedZenigata\
    \ is the Main Character 4) *Dimensional Travel and Immersion (The cast are capable\
    \ of physically breaking into a digital world) *Danmaku and Spatial Manipulation\
    \ (By utilizing their agility Fujiko is capable of blitzing comparable opponents\
    \ from every direction, scales to the rest of the gang who can do the same with\
    \ team tactics. Shown to break through space during her Kizuna) Resistance to\
    \ *Fire Manipulation (Was shown to survive being lit ablaze with no injury. Was\
    \ unaffected by Mamo's magical flames) *Ice Manipulation (Survived being completely\
    \ frozen) *Electricity Manipulation (Endured being shocked by the holographic\
    \ projector going haywirePart 2, Episode 63: A Trap For a Trap!) *Limited Mind\
    \ Manipulation (Partially resisted being brainwashed by a machine) *Limited Radiation\
    \ Manipulation (Survived being exposed by a massive amount of Uranium 238, enough\
    \ to kill a man in four days in \"The Hemingway Paper Mystery\") *Social Influencing\
    \ and Mind Manipulation (After half a century of manipulating men worldwide, Fujiko\
    \ has grown extremely adverse to anyone trying to dissuade her from her gains.\
    \ Thanks to her fluency in multiple languages, she should have a similar, albeit\
    \ inferior, resistance to outside influence as Lupin III) *Extreme Cold and Cosmic\
    \ Radiation (The cast is capable of surviving and swimming in space with nothing\
    \ but their normal attire and a bowl on their heads) *Trans"
