power_scale:
  tier:
    text: At least , likely far higher
    source_ids:
    - vsbattles-the-roaring-knight-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: At least Planet level, likely far higher (Vastly superior to any other enemy
      so far, capable of severing Tenna's arms and leaving him in a fatal state with
      a single attack. Easily overpowered Undyne. Should be scaling from their durability,
      making them generally superior to Omega Flowery. Stated from Seam to be an impossible
      opponent to defeat, with the Voice from the beginning of the game and the credits
      of Chapter 4 also saying that it's guaranteed the Delta Warriors would lose
      a fight against them, something that was displayed from them actually defeating
      the Delta Warriors on several occasions with few or even a single attack in
      Chapters 3 & 4 even if they have equipped the Shadow Mantle, leaving Kris and
      Susie severely injured and turning Ralsei into a pile of fluff, thus making
      them far superior to even a Ralsei's "FireShock" powered up by the YellowHatVastly
      upscales from 859.6 Zettatons of TNT x 1.2 or 1.0315 Yottatons)
    source_ids:
    - vsbattles-the-roaring-knight-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At least FTL, likely far higher (It is much faster than the Delta Warriors,
      to the point of it easily one-shotting them before they can even react. Faster
      than Susie, as shown by it easily dodging her attacks. Can accelerate in its
      "bird" form and has proven to be able to move faster than FloweryVastly upscales
      from 2.47 c)
    source_ids:
    - vsbattles-the-roaring-knight-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class G (Far superior to every enemy ever encounter so far, including
      TennaUpscales from 159 Million Tons)
    source_ids: &id002
