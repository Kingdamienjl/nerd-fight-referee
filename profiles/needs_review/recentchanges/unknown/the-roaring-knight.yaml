        current line of sight that can negate their regeneration. If the opponent
        faints from the Knight''s normal attacks, their regeneration will be negated
        too. *Red Wind: The Knight controls a red wind that pushes the opponent back,
        slowing them down or pushing them away completely. *Swords Barrier: The Knight
        can create a barrier of swords around the entire area, preventing the Delta
        Warriors from dodging it. *Da'
