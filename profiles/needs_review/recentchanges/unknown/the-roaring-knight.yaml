        attack sworddance1 (Deltarune).gif|Tracking Swords File:Knight attack sworddance2
        (Deltarune).gif|Tracking Swords Phase 2 File:Knight attack bisect1 (Deltarune).gif|Box
        Splitter File:Knight attack bisect3 (Deltarune).gif|Box Splitter Phase 3 File:Knight
        attack swordhall1A.gif|Sword Tunnel Start File:Knight attack swordhall2 (Deltarune).gif|Sword
        Tunnel Phase 2 File:Knight attack swordhall1B (Deltarune).gif|Sword Tunnel
        End File:Knight attack dice (Deltarune).gif|Rotating Slash File:Knight attack
        dice3 (Deltarune).gif|Rotating Slash Phase 3 *Star Storm: The Knight sends
        forth a purple cone from its palm, emitting several six-pointed stars that
        grow over time. After a short while, it stops, causing the stars to reverse
        direction for about a second before each explodes into six shards that travel
        a short distance at a slow speed. Three of six shards travel and last shorter.
        **Phase 2: Some stars explode later, and all shards last the same distance
        and duration. **Phase 3: Each star only explodes into two shards; however,
        after a short while, each shard turns red and shoots toward the opponent one
        at a time. *Tracking Swords: A sword appears from a cardinal or intercardinal
        direction centered on the opponent and moves with them. After a short period
        (initially about 1 second, but shortening as the attack progresses) it turns
        red, freezes, disappears, and creates a white slash. This repeats 10 times,
        with the swords progressively increasing in speed. **Phase 2: A large circle
        of swords contracts and expands while moving around the opponent, allowing
        for much less space to dodge the octodirectional swords. **Phase 3: Same as
        the base, but the swords appear and fire at a much faster rate. *Box Splitter:
        The Knight cleaves the Bullet Board in two in an orthogonal direction (deviating
        by a few degrees), splitting it in half, pushing both halves away, and causing
        fast and slow tooth-like projectiles to emit from the cut. The projectiles
        come at two different speeds, and no more than two adjacent projectiles can
        have the same speed. The Bullet Board then fuses back together before the
        Knight cleaves it again. This repeats 7-8 times, choosing the same orthogonal
        direction (with different deviations). **Phase 2: The Knight can switch the
        direction it cleaves each time it does so. **Phase 3: The Knight can switch
        the direction it cleaves each time it does so and can choose to cleave in
        a diagonal direction. If The Knight chooses to cleave diagonally, projectiles
        emit from the center and radiate outward. *Sword Tunnel: Swords from the top
        and bottom sides quickly slide forward and can shift up or down in tandem,
        turning red when the opponent is too close to them. At the end of the attack,
        the swords scatter around the edge of the screen and project red warning lines
        showing their trajectory before flying across the Bullet Board. **Phase 2:
        Instead of appearing in a straight line, the swords change the angle they
        come from in a counterclockwise manner. **Phase 3: Same as the base version,
        but the gap between the swords is smaller. *Rotating Slash: The Knight slashes
        six times, creating rotating red lines that quickly freeze and create white
        slashes. Each individual slash typically increases the amount of red lines,
        starting at one and ending at four. **Phase 2: The Knight starts at three
        lines and switches to four after two slashes. **Phase 3: The Knight starts
        at three lines and switches to four after one slash. In addition, it makes
        several rotating slashes centered in the center of the Bullet Board after
        its initial six slashes, this time slashing much faster and having most of
        the front of its body covered in the trail from its sword slashing. *Star
        Tractor: The Knight glows for a moment before the Bullet Board expands and
        the Knight begins to exude an aura that attracts stars and the opponent towards
        it, while maintaining some distance from bullets and enemies. The Knight will
        then release the stars back towards the foe and cut the box in half. *SWOON:
