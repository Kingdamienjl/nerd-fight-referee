    notes: auto_repair source extraction
  intelligence:
    text: 'Unknown, at least Above Average (While the Knight''s true intelligence
      has yet to be revealed, it seem to be capable of plotting and manipulation.
      It''s likely the one who calls Kris, planning the next Dark Fountain at the
      church and Undyne''s sacrifice for the next week, also ordering Kris to keep
      Susie away from the guitar that has the code to the shelter. It ordered Kris
      to manipulate Tenna into saying that it was the Knight itself who appeared and
      told him that if he kept the Delta Warriors busy, he could have ALL the people
      he wanted to watch him) *Combat Skill: The Knight is a very capable combatant
      who shows skill in swordsmanship, managing to defeat Kris and their party with
      ease, showing itself superior to them.'
    source_ids:
    - vsbattles-the-roaring-knight-unknown
