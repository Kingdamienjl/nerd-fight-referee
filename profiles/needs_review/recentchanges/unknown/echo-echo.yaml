        Forcefield Creation, Durability Negation, Vibration Manipulation & Sonic Combustion
        Manipulation (Echo Echo can scream at audible to ultrasonic frequencies capable
        of shattering steel, redirecting projectiles in mid-flight, blowing up multiple
        Laser Lances, and even damaging Taydenite at the right frequency. Echo Echo
        can also transmit sound waves through speakers, such as cellphones which can
        be used as a weapon for the person on the other line. Echo Echo also has the
        power of audiokinesis, meaning he can control and manipulate sound. Echo Echo
        can use this power to amplify other sounds. Echo Echo can use his sonic screams
        to create a force field, as well as sonic waves. Can detect vibrations in
        the ground, as seen when he touched Kevin, who had absorbed Varsidium that
        caused him to vibrate when struck by Gwen''s mana. The Sonic Blast is bypassing
        life form''s durability and directly harming them. He can also use echolocation)
        * Duplication, Decoy Creation & Duplication Bestowal (Echo Echo has the ability
        to create an unknown number of exact duplicates of himself. These clones act
