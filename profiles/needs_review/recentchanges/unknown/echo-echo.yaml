- id: claim-weaknesses-d4df8b2b
  section: weaknesses
  axis: weakness
  text: 'Echo Echo has a fragile body that can be destroyed easily in battle, as shown
    when Ultimate Kevin destroyed several Echo Echos with Jetray''s neuroshock blasts
    | Ultimate Echo Echo''s containment suit is made of metal, so he can be magnetized.
    His Sonic Discs are vulnerable to electricity Feats: *Defeated Argit *Defeated
    Decka *Was able to defeat Helen *His Sonic waves can push small airships *With
    his clones threw a spaceship *Echo Echo was able to hold his own against a giant
    worm creature *Ultimate Echo Echo survived nuclear fusion grenade in outerspace
    *Ultimate Echo Echo nearly killed Ultimate Kevin Notable Attacks/Techniques: Echo
    Echo: *Wall of Sound: Echo Echo rapidly duplicates in a straight line formation
    and the Echo Echos let loose simultaneous sonic screams. *Echo Chamber: Echo Echo
    duplicates in a circle formation around his opponent and the Echo Echos let loose
    simultaneous sonic screams from all directions. Ultimate Echo Echo: *Sonic Doom:
    Ultimate Echo Echo multiplies his sonic disks, which surround the opponent in
    a circle formation, and release powerful sonic blasts from all directions. Both:
    *Sonic Shields: both can create strong shields/force fields out of soundwaves.
    Echo Echo''s are strong enough to take hits from Thunderpig, and can disperse
    the shield in the form of an AOE sound attack, while Ultimate Echo Echo''s can
    contain a small nuclear bomb and can easily deflect projectiles thrown at him.
    ==Gallery== Duplicationecho.gif|Duplication 099e964b-2ac4-4313-97b7-54d17eecafe0.gif|Echo
    Chamber attack Sonic disc.gif|Ultimate Echo Echo Sonic discs SDuE.gif|Ultimate
    Echo Echo Sonic Doom ==Notable Matchups== Victories: Losses: Gravattack (Ben 10)
    Gravattack''s Profile (Base Key was used, Battle took place in Bellwood) Inconclusive:
    ==Notes/Explanations== Category:Characters Category:Ben 10 (Classic) Category:Aliens
    Category:Ben 10 Aliens Category:Cartoon Characters Category:Duplication Users
    Category:Flight Users Category:Forcefield Users Category:Good Characters Category:Heroes
    Category:Male Characters Category:Self-Sustenance Users Category:Sound Users Category:Statistics
    Amplification Users Category:Transformations (Ben 10) Category:Vibration Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-0340eb4a
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Small Size (Type 0) *Inorganic Physiology
    (Type 1) (Echo Echo is made up of Silicon) *Sound Manipulation (Uses his sound
    attack in create ways to harm enemies and deflect attacks) *Attack Reflection
    (Can redirect projectiles using his sound attack) *Limited Immortality (Type 6;
    Capable of transferring his consciousness into another clone after being destroyed
    by Ultimate Kevin) *Duplication (Echo Echo has the ability to duplicate himself.
    The clones are not linked to each other in any way, allowing entire groups to
    be knocked out or die without harming the rest, Ben keeps a copy in the trunk)
    *Limited Vibration Manipulation and Statistics Amplification (Can channel vibrations
    to enhance his sonic screams. Can detect vibrations in the ground, As seen when
    he touched Kevin, who had absorbed Varsidium that caused him to vibrate when struck
    by Gwen''s mana) *Forcefield Creation (Can use his sonic screams to generate a
    forcefield) *Acrobatics (Via sound propulsion) *Resistance to Ice Manipulation,
    Limited Paralysis Inducement and Cosmic Radiation (Echo Echo was able to move
    and changed himself to his ultimate form when he was stuck in an ice block. Ultimate
    Echo Echo survived nuclear fusion grenade in outerspace. All abilties and resistances
    provided by the Omnitrix) All previous abilities, Resistances and the following
    *Self-Sustenance (Type 1) *Spaceflight (Can breathe and fly in the vacuum of space)
    *Durability Negation (the Sonic Blast is bypassing the Life Form''s durability
    and directly harming them) *Transformation (Can transform from his Base form to
    his Ultimate form) *Empowerment (Ultimate Form increase the aliens strengths and
    abilites) *Resistance (All abilities and resistances provided by the Omnitrix)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
