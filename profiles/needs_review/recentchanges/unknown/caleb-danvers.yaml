- id: claim-weaknesses-f4465f56
  section: weaknesses
  axis: weakness
  text: 'Standard human weaknesses. The Power is extremely seductive and addictive
    for its users and if the user overuses his powers he could burn-out, and prematurely
    age, no matter how strong the user is. | One of the negatives to ascending is
    that when the user achieves this, The Power becomes their very life. Thus, when
    one uses it too much, they age prematurely each time until they burn out their
    body through over-usage, and if one wills their power away, they will die instantly.
    Notable Attacks/Techniques *The Power: The Power refers to a warlock''s aptitude
    for magic. The Power remains dormant within the male user until his 13th birthday,
    Caleb Danvers described his "taste" of The Power as a kind of test. This matures
    when Ascension occurs on a warlock''s 18th birthday, at apparently the exact moment
    of their birth (11:12 PM in Caleb''s case, as shown in the film). It is a painful
    and frightening process for the warlock, as his body is overwhelmed with new power.
    A warlock''s ascended power is described as being a thousand times stronger than
    their pre-ascension abilities, and therefore extremely seductive. One of the other
    negatives to ascending is that when the user achieves this, The Power becomes
    their very life. Thus, when one uses it too much, they age prematurely each time
    until they burn out their body through over-usage, and if one wills their power
    away, they will die instantly. When their powers are activated, their eyes turn
    pitch black and a wave of gold sparks rush through them. **Telekinesis: Telekinesis
    is the most visible of a warlock''s abilities. This allows them to perform a variety
    of effects that defy gravity; ranging from falling from great heights without
    harming themselves to flying or even the levitation of various objects, such as
    paper. They can use this ability offensively by creating concussive blasts powerful
    enough to knock people a few feet away. This also gives them the ability to teleport
    their balls into another''s mouth, as Chase demonstrates during his fight in the
    burning barn. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    Category:Characters Category:Male Characters Category:Teenagers Category:Telekinesis
    Users Category:Good Characters Category:Primary Protagonists Category:Flight Users
    Category:Martial Artists Category:Magic Users Category:Statistics Amplification
    Users Category:Air Users Category:Astral Projection Users Category:Teleportation
    Users Category:Fire Users Category:Extrasensory Perception Users Category:Clairvoyance
