        through over-usage, they will die instantly. Notable Attacks/Techniques, The
        Power: The Power refers to a warlock''s aptitude for magic. The Power remains
        dormant within the male user until his 13th birthday, Caleb Danvers described
        his "taste" of The Power as a kind of test. This matures when Ascension occurs
        on a warlock''s 18th birthday, at apparently the exact moment of their birth
        (11:12 PM in Caleb''s case, as shown in the film). It is a painful and frightening
        process for the warlock, as his body is overwhelmed with new power. A warlock''s
        ascended power is described as being a thousand times stronger than their
        pre-ascension abilities, and therefore extremely seductive. One of the other
        negatives to ascending is that when the user achieves this, The Power becomes
        their very life. Thus, when one uses it too much, they age prematurely each
        time until they burn out their body through over-usage, they will die instantly.
        When their powers are activated, their eyes turn pitch black and a wave of
        gold sparks rush through them., Telekinesis: Telekinesis is the most visible
