    - field: weaknesses
      value: "Creating large land formations exhausts him. Notable Attacks/Techniques:\
        \ Mokuton (Wood Release): *An advanced nature kekkei genkai that combines\
        \ earth and water-based chakra natures to create wood or complete trees. This\
        \ ability can also be used to build other aspects of trees, such as seeds\
        \ or flowers. Wood Release techniques can be produced from anywhere, including\
        \ the user's body, as the user's chakra is converted into a source of life.\
        \ *Moku Bunshin no Jutsu (Wood Clone Technique): The user creates a clone\
        \ of themselves made out of wood. The clone is more durable than the regular\
        \ shadow clones, and it can merge with plants and trees. It can also travel\
        \ far distances from the user and communicate with the original. *Mokuton:\
        \ Daijurin no Jutsu (Wood Release: Great Forest Technique): This jutsu transforms\
        \ the user's arm into big trees. The trees will expand rapidly and fork out\
        \ to deliver damage or trap an opponent. The ends of the wood can be transformed\
        \ into stakes for increased damage. *Mokuton: Jukai K\u014Dtan (Wood Release:\
        \ Deep Forest Emergence): After performing the correct seals, the user can\
        \ convert their chakra into life energy to turn an area into a vast forest\
        \ in a matter of seconds. *Mokuton: Mokusatsu Shibari no Jutsu (Wood Release:\
        \ Wood Smothering Bind Technique): In a similar manner to Wood Release: Great\
        \ Forest, the user will transform their arm into a tree, creating multiple\
        \ branches which will rapidly grow around the target and restrain their movement.\
        \ *Mokuton: Mokuj\u014Dheki (Wood Release: Wood Locking Wall): This jutsu\
        \ creates wooden pillars that rise from the ground and curve, locking together\
        \ when they meet to create a dome-like shield. This technique is useful for\
        \ defense against stronger attacks. *Mokuton: Shich\u016Br\u014D no Jutsu\
        \ (Wood Release: Four-Pillar Prison Technique): The user creates four large\
        \ wooden pillars that rise out of the ground, along with many other slightly\
        \ smaller wooden shafts to create a large cage around the target to restrain\
        \ them. Doton (Earth Release): *One of the basic elemental nature transformation\
        \ techniques. It allows the user to manipulate the surrounding earth for offensive\
        \ and defensive purposes or create it, be it dirt, mud, or rock. These techniques\
        \ can alter the landscape on a large scale, and solid earth barriers are commonly\
        \ used as a defense. Some earth jutsu can even adjust hardness and weight\
        \ properties. *Doton: Dory\u016B J\u014Dheki (Earth Release: Earth-Style Rampart):\
        \ This technique allows the user to create a gigantic rampart that rises out\
        \ of the terrain. The amount of earth used can be increased with more chakra,\
        \ and the landforms will take shape according to the user's will. *Doton:\
        \ Dory\u016Bkatsu (Earth Release: Earth Flow Divide): After performing the\
        \ correct hand seals, the user can manipulate the surrounding earth to tear\
        \ the landscape apart and create large chasms. *Doton: Dory\u016Bheki (Earth\
        \ Release: Earth-Style Wall): The user can create a large solid wall of earth\
        \ and rock to instantly rise from the ground between them and the enemy as\
        \ a reliable form of defense. Suiton (Water Release): *One of the basic elemental\
        \ nature transformation techniques that allow the user to manipulate pre-existing\
        \ water, or create their own, by turning their chakra into water. It takes\
        \ a much higher skill to create the liquid than controlling what is already\
        \ available and expelling it via the mouth. One of the most versatile of the\
        \ five essential chakra natures, Water Release techniques can change the shape\
        \ and state. *Suiton: Hahonry\u016B (Water Release: Tearing Torrent): This\
        \ technique creates water that rapidly spins in the user's hand. The rotating\
        \ water can be blasted at a close melee range to inflict damage upon a target\
        \ or defend against fire attacks. *Suiton: Takitsubo no Jutsu (Water Release:\
        \ Waterfall Basin Technique): A water manipulation used for altering the terrain.\
        \ The user creates a water spring, resulting in a wave-like water current.\
        \ This technique can be combined with Earth Release: Earth-Style Rampart to\
        \ form a waterfall. ==Notable Matchups== Victories: Losses: Inconclusive:\
