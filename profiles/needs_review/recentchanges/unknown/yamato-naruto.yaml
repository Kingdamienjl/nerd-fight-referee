        \ others), Limited Sealing (He is able to suppress the power of a tailed beast),\
        \ Afterimage Creation, Stealth Mastery, and Speed Enhancement (The Substitution\
        \ Jutsu allows its user to instantly replace themselves with a nearby object\
        \ such as a tree log, plant, person, or clone at the exact moment they are\
        \ attacked. The Jutsu works even if the user is physically restrained or observed\
        \ by characters as observant as Sharingan or Sage Mode users. This creates\
        \ the optical illusion of the user being hit, which confuses the opponent\
        \ and gives them an opening to flee or counterattackNaruto Chapter 6Naruto\
