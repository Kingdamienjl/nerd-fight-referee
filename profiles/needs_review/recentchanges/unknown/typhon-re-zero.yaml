- id: claim-weaknesses-077bdc2f
  section: weaknesses
  axis: weakness
  text: 'Her Authority of Pride cannot affect inanimate objects or beings that lack
    the ability to think. Notable Attacks/Techniques: *Authority of Pride: Typhon''s
    Authority can break apart her target''s body if she determines that they are evil
    or guilty, either by observation, admission, or reading their heart. Typhon activates
    her Authority by thought, often while questioning her target''s sins, and then
    her target shatters like glass, the cracks spreading throughout their body until
    they are reduced to fine dust. This gruesome mutilation will bring no pain with
    it if the target is not a sinner. The Authority of Pride is so overwhelmingly
    powerful that Typhon''s fighting strength is considered third among the seven
    Witches of Sin, surpassing Daphne of Gluttony and Echidna of Greed. ==Notable
    Matchups== Victories: Losses: Inconclusive: ==References== ==Notes and Explanations==
