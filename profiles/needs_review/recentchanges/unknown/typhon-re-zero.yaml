        the capacity to think, either by touch or from a distance, and even making
        contact with her results in the same fate. The aftereffects of this Authority
        depends on whether the victim of Typhon is guilty or innocent: If it is the
        former, then the victim will feel unimaginable pain, and if it is the latter,
        the victim will not feel any kind of pain, but will still have their body
        shatter apart like glass. The Authority of Pride also allows Typhon to determine
        whether a person is feeling guilty or not, or whether they are good or evil,
        by just touching them. The downside of this ability is that Typhon cannot
        use it on mindless objects, so stuff like weapons or mindless automatons like
        the Centipede Coffin owned by Daphne cannot be affected by it. Category:Morning
        Star TM Category:Tier 10 Category:Tier 1'
