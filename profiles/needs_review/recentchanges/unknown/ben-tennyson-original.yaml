- id: claim-weaknesses-6bf6b722
  section: weaknesses
  axis: weakness
  text: "All the weaknesses that the Omnitrix has. As a 10-year-old, Ben was very\
    \ immature and could be quite overconfident. While he became more mature and less\
    \ overconfident in Alien Force and Ultimate Alien, this resurfaced in Omniverse.\
    \ Ben is allergic to peanuts and is afraid of peacocks. As a child, he had a fear\
    \ of clowns. Although he got over this, it resurfaced in Omniverse. Feats: *Ben\
    \ with Omnitrix can change the DNA of people throughout the entire galaxy by mixing\
    \ them with random species or altering it. *He can change the DNA of anyone by\
    \ firing a beam from the Omnitrix itself, and can resist being biologically manipulated,\
    \ as an extradimensional deity named Dagon transformed all creatures on Earth\
    \ into Esotericas to worship it, but the Omnitrix protected Ben. *Ben defeated\
    \ Vilgax, who fought Ectonurite/ghost alien army for weeks on his planet tirelessly.\
    \ Yet Ben defeated him and outskilled him in one on one battle. Vilgax is a 200\
    \ year old intergalactic warlord who has \u201CConquered 10 planets and crushed\
    \ heroes of those 10 planets\u201D, even after absorbing the power of 10 different\
    \ heroes from ten different planets and conquering their home world he failed\
    \ to defeat Ben as Ben defeated him using Diamondhead. *Ben led his team and defeated\
    \ Highbreed Alien invasion by changing their DNA on an intergalactic range with\
    \ the Omnitrix. The Highbreed is an alien technologically advanced alien race\
    \ that destroyed planets and conquered a galaxy with their enormous size warships,\
    \ yet Ben with his great thinking alone defeated them. *Ben has defeated geniuses\
    \ such as Dr. Animo, by figuring out his plan in the Null Void. *Ben also has\
    \ a good memory, as he was able to remember magic words to open the gate of Ledgerdomain.\
    \ *Ben resisted mind manipulation from Decoy Queen as he broke out of Hypnosis\
    \ Twice, while as a Nanomech."
