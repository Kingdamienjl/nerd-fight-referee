- id: claim-powers-and-abilities-13d360f9
  section: abilities
  axis: hax
  text: "Base \u25BE= *Superhuman Physical Characteristics *Immortality (Type 3 &\
    \ 8; The Omnitrix prevents Ben from dying, even if it means restoring Ben's entire\
    \ body from being shattered, incinerated, or destroyed on a quantum level) *Supernatural\
    \ Willpower (His will is so strong that he cannot be controlled by Lord Transyl's\
    \ powers, Zs'Skayr had problems possessing Ben via him resisting it.) *Skilled\
    \ Fighter (As shown here) *Photographic Memory (He remembered the Ledger Domain's\
    \ name just looking at it) *Vehicular Mastery (As shown here) *Acrobatics (Hypermobility\
    \ & All-Terrain Mobility; Evaded attacks from Kevin while jumping across floating\
    \ rocks in the Null Void. Disarmed Manny while dodging lasers from his gun) *Breaking\
    \ the Fourth Wall (Intervened during the intro sequence) *Social Influencing (Leadership,\
    \ Fear Inducement, Social Position, & Charisma; Lead a large group of his friends\
    \ against the Highbreed's DNAlien army. Threatened Driscoll to get him to surrender.\
    \ Instilled fear into Alan and scared Pakmar. Is considered famous to the point\
    \ where others use his popularity for charity. Is repeatedly shown on news channels\
    \ and swarmed by fans and reporters, and has used this fame to win a court case\
    \ and get free Smoothies. Was able to charm his way out of getting shot) *Limited\
    \ Stealth Mastery (While keeping his hero identity a secret, he often demonstrated\
    \ a high level of stealth, even managing to sneak past Max Tennyson on one occasion)\
    \ *Flight (Can fly at unbelievable speeds on his Hoverboard) *Space Survival (The\
    \ Plumber suit can helps Ben, Gwen and Kevin survive in space and on other planets\
    \ without any ill effects) *Underwater Breathing via Plumber suit (The Plumber\
    \ suit can help Ben breath underwater) *Electricity Manipulation (Could survive\
    \ a hit from Buzzshock's electric attack) *Possibly Heat Manipulation (Physically\
    \ interacted with Alan Albright, a Pyronite, without feeling discomfort from his\
    \ heat) *Mind Manipulation (Mildly resisted hypnosis from Big Chill's predator)\
    \ *Madness Manipulation (Type 2) Corruption (Type 1: Unaffected by Ascalon's side\
    \ effects as Vilgax tried convincing him to destroy all evil with Ascalon's power\
    \ but failed and Ascalon was unable to drive Ben into madnessBen 10: Ultimate\
    \ Alien, \"The Ultimate Enemy: Part 2\") With the Omnitrix \u25BE= *Transformation\
    \ *Power Mimicry (The Omnitrix is able to record the DNA of any species its wielder\
    \ has not encountered before, recording it and allowing the user to take the form\
    \ of the newly recorded species) *Biological Manipulation (Ben was able to use\
    \ the DNA recorded in the Omnitrix to modify the Highbreeds' DNA and biological\
    \ structures, instilling them with the traits of other species to remedy the genetic\
    \ damage caused by their inbreeding) *Self-Destruction (Can set the Omnitrix to\
    \ self-destruct) *Duplication (By transforming into Echo Echo and duplicating\
    \ himself before changing back, Ben can create at least two other copies of himself,\
    \ albeit while his personality traits are divided up amongst them) *All Resistances\
    \ of Omnitrix (While transformed) With Ascalon \u25BE=All abilities and resistances\
    \ of Ascalon, plus: *Attack Reflection (Reflected the Dagonax's energy blast)\
    \ Post-Absorbed Power \u25BE= All abilities and resistances of Dagon With Skurd\
    \ \u25BE= *Transformation (Skurd can shift his limbs into those of other aliens)\
    \ *Flight & Spaceflight *Time Travel (As Shown Here) *Age Manipulation (Deaged\
    \ Timebeast) *Forcefield Creation (It created a forcefield during time travel)\
    \ *Missile Projection (As Shown here) *Thread Manipulation (Can deploy nets for\
    \ capture) *Time Manipulation (Was unaffacted by Time Beast's attack, As shown\
    \ here, Was unaffacted by Malturant's timestop) With Equipment \u25BE= Plumber\
    \ Badge; *Clairvoyance & Extrasensory Perception (Plumber Badges can create a\
    \ holographic map that can pin-point the location of another Plumber Badge with\
    \ a flashing dotBen 10: Alien Force, \"Everybody Talks About the Weather\". It\
    \ can even track other badges in spaceBen 10: Ultimate Alien, \"Eye of the Beholder\"\
    . Plumber Badges will flash red and produce sounds when radiation is detectedBen\
    \ 10: Ultimate Alien, \"Too Hot to Handle\".) *Telepathy (Plumber Badges have\
    \ a two-way communication system with other badges and the Omnitrix. They can\
    \ also communicate with the Plumber Headquarters, and can provide video feedBen\
    \ 10: Omniverse, \"Blukic and Driba Go to Mr. Smoothy's\") *Automatic Translation\
    \ (Plumber Badges have a Universal Translator, which allows them to translate\
    \ any language into any otherBen 10: Ultimate Alien, \"Escape From Aggregor\"\
    ) *Power Bestowal, Technology Manipulation & Minor Light Manipulation (Plumber\
    \ Badge can enhanced the gun's laser blasts and changed their color to greenBen\
    \ 10: Ultimate Alien, \"The Ultimate Enemy: Part 1\".) *Hacking (Plumber Badge\
    \ can use to hack DNAlien base and access to itBen 10: Alien Force, \"Max Out\"\
    . Plumber Badge can also deactivate the automated self-destruct on board Cooper's\
    \ shipBen 10: Ultimate Alien, \"Prisoner Number"
