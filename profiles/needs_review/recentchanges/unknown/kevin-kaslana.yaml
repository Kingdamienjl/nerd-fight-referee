- id: claim-weaknesses-5661cc3b
  section: weaknesses
  axis: weakness
  text: 'None notable {| class="mw-collapsible mw-collapsed" align="center" border="1"
    cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; |Notable Attacks/Techniques: |- | *: The ability possessed by MANTIS soldiers
    to transform into their respective Honkai Beasts, greatly enhancing all of the
    abilities inherited from the Honkai Beast genes implanted during the meta-morph
    surgery. As the subject of Project CHIMERA, Kevin is host to countless Honkai
    Beast gene donors as opposed to the one donor given to all other MANTIS soldiers.
    The list of known donors are as follows: ** Kevin''s initial gene donor, which
    granted him the ability to create and control ice to counter the flames of the
    Herrscher of Fire. ** One of the gene donors for the testing phase of Project
    CHIMERA. ** A Honkai Beast from the Sea of Quanta. **: A giant serpentine Honkai
    Beast adapted to the Sea of Quanta, which was Kevin''s preferred form during his
    imprisonment, and was thus the source of his nickname "The Serpent" prior to being
    revealed as the leader of World Serpent. **Mexicatl: A Honkai Beast split among
    a number of Quantum Shadows each named after a deadly sin, all of which are connected
    to a single Umbreist core. **: A phoenix-like Honkai Beast that was also the primary
    donor for Hua. It grants control over flames and an extremely powerful regeneration
    ability. One of Kevin''s more powerful donors, as Hua using Active Honkai Reaction
    was able to force Kevin himself into also using Active Honkai Reaction to defeat
    her. *: The power of the Herrscher of Finality. Kevin shouldered this authority
    bit by bit during the final stages of Project Stigma, and by the time of his final
    battle with Kiana, Mei and Bronya, had shouldered enough of the authority for
    his strongest form to have surpassed the Previous Era''s Herrscher of Finality.
    * The beast manifested from the crystallization of Earth''s history and the Chimera
    of the hundred-over Honkai Beasts that compose Kevin''s MANTIS genes. Each of
    its arms holds a form of core that represents an era, from the Paleozoic, the
    Mesozoic, and the Cenozoic. Its large body''s attacks are supported by floating
    objects known as Shadows of Era Annihilation. **: Each of This Worldly Beast''s
    arms holds an Era Core with different abilities. They each are named after an
    era of Earth''s history, from the Paleozoic to the Cenozoic. ** This Worldly Beast
    is supported by dozens of these Shadows of Era Annihilation, which are highly-mobile
    crystals that fly and teleport around to target Kevin''s opponents. **: Crystallizations
    of Earth''s history taking the form of Honkai Beasts. Each Era Core manifests
    a different kind of Honkai Beast, with the Paleozoic crystals taking the form
    Remnants, the Mesozoic crystals taking the form of the more common silicon-based
    Honkai Beasts, and the Cenozoic crystals taking the form of Zombies. * Kevin''s
    strongest Active Honkai Reaction form. By the time of the final battle, it is
    stated that he had surpassed the Previous Era''s Herrscher of Finality in this
    form. In this form, he is equipped with two long weapon handles that float around
    him and that can manifest either blades or bolas. **: Kevin manifests a large
    crystal blade at the end of one or both of his handles to attack with furious
    speed and precision. **: Kevin manifests large crystal fragments to form a form
    of cross between a club and a bola on the end of one of his handles to attack
    with extreme bludgeoning force. **Giver''s Termination: Kevin forms a domain of
    Imaginary Refraction to trap his opponents in with him and slowing down their
    movements while inside said domain using his control over matter, before attacking
    with his blades. **Pioneer''s Constraint: Kevin strikes with the Leviathan Bolas
    and, presumably using the Binding Authority, seals off his targets'' ability to
    attack, evade, use their weapon''s ability, and use their special abilities. Even
    those capable of breaking these constraints must spend time to break them individually.
    **Chimera''s Marks: Kevin wreathes the Chimera Blades in fire and attacks rapidly.
    **Consenter''s Rules: Kevin massively increases the size of one of the Leviathan
    Bolas to smash down and crush his target, with the Bola breaking from the force
    of the impact, with the grounded fragments attacking those that come close. **Irrefutable
    Suppression: Kevin channels the power of Project Stigma and creates an extremely
