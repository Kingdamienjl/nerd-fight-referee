        of attack), Time Slow (with time fractures, which massively slow down time
        to the point of appearing completely immobile, and that Mei can make last
        for 3 seconds from her perspective), Limited Deconstruction (prior to gaining
        control over her powers, Mei disintegrated anything she touched), Limited
        Weapon Creation (can create lightning sword constructs that attack alongside
        her) and Power Bestowal (can lend others her Thunder Authority to use in her
        stead), aerial manipulation (able to control wind, such as creating whirlwinds
        and tornadoes), size manipulation (can grow to the size of her blades, allowing
        for a greater area of effect for her swords), non-physical interaction (randomly
        interacts with Honkai and Spirits, all of which are conceptual in nature and
        lack physicality; Can even harm Void Beings and living possibilities), Quantum
        Manipulation (Honkai energy is powerful enough to alter matter on a quantum
        scale), Perception Manipulation (Through use of Honkai Energy, Mei can interfere
        with one''s perceptions), Life Manipulation (Honkai Energy can take the life
        of opponents), Disease Manipulation (Honkai Energy is capable of infecting
        opponents on a scale comparable to disease ), Barrier Creation (Can summon
        ethereal barriers with Raikiri), Illusion Casting (Shadow Dash allows Mei
        to create "illusions" with her powers, of which she can harm opponents), Time-Space
        Manipulation, Law Manipulation, Physics Manipulation (Honaki Energy in large
        quantities is capable of causing reality warps that can also alter the laws
        of reality and physics, and even phenomena such as parallel worlds)., Striker
        Fulminata: All previous abilities except for Herrscher powers to a greater
        extent. Enhanced Electricity Manipulation and Paralysis Inducement (with her
        Striker Fulminata battlesuit and MagStorm, the latter of which is stated to
