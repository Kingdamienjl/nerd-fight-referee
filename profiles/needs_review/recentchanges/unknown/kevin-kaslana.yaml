  axis: hax
  text: "Herrschers have all the powers of their Divine Keys for these reasons: not\
    \ only Divine Keys are weapons forged with the core of a Herrscher, but we are\
    \ also told that Herrschers can do everything that their respective Divine Keys\
    \ can, likely to a greater extent as the 2nd Divine Key - Cosmic Juggernaut was\
    \ \u201Conly\u201D able to replicate the powers of the Herrscher of Void to a\
    \ lesser extent since Otto considered the Herrscher better when he saw the performance\
    \ of the two. Furthermore, we have also been told that Herrscher cores are not\
    \ at their full potential without their Herrscher.All Herrscher of Finality abilities\
    \ and resistances scale to Outerversal as per this crt Base \u25BE= *Honkai Energy\
    \ (High-level) *Immortality (Types 1 & 3; Like all MANTISes, Kevin can live indefinitely)\
    \ *Superhuman Physical Characteristics *Master Martial Artist, Swordsman, Marksman\
    \ & Honkai Energy (Herrscher Authority) (Wields the Judgement of Shamash as his\
    \ primary weapon, which possesses a dual pistol form and a greatsword form; he\
    \ was the MOTH's top soldier prior to undergoing his Meta-Morph surgery) **Greatly\
    \ Enhanced Matter Manipulation, Energy Manipulation & Heat Manipulation (Up to\
    \ Atomic; Kevin can control fire by manipulating heat energy at a molecular level.\
    \ Kevin's Authority can melt ice at absolute zero temperatures,Collection: Enemies\
    \ - Diabolic Kevin and should be comparableElysian Realm Chapter I: In the Infinite\
    \ ShadowElysian Realm - Expand: ELF Typewriter to Kalpas' flames, which are so\
    \ strong that they are capable of burning and destroying the entire Elysian Realm.Honkai\
    \ Impact 3rd; Story Chapter XXX: Marcia Funebre Kevin's flames partially bypass\
    \ elemental resistancesHonkai Impact 3rd - Honkai Weekly Trivia: Azure Empyrea)\
    \ **Fire Manipulation, Status Effect Inducement & Explosion Manipulation (1.000.000.000\xB0\
    \ Celsius; His basic attacks can deal fire damage, ignite his enemiesValkyrie,\
    \ Kiana Kaslana: Herrscher of Flamescion - SkillsHonkai Impact 3rd; Valkyrie Menu\
    \ - Ignite and cause explosions. Kevin wields the Judgment of ShamashDivine Key;\
    \ Chapter 2: Jizo MitamaHonkai Impact 3rd; Weapons - Judgment of Shamash and its\
    \ transformations. The Blade in its Might of An-Utu state, which Kevin can casually\
    \ wield with no damage to himself has a radiance on par with supernovaHonkai Impact\
    \ 3rd; Weapons - Might of An-Utu by themselves) **Space-Time Manipulation & Durability\
    \ Negation (The Authority of Fire can burn space-times, pocket dimensionsSecond\
    \ Eruption; Chapter 60: The MANTIS and through space-time warping) **Plasma Manipulation\
    \ (Kevin has the ability to manipulate plasma,Honkai Impact 3rd - Winter RhapsodyWorld\
    \ Serpent; Chapter 1: Awakening allowing her to perform feats such as shooting\
    \ beams of super-heated plasmaSecond Eruption; Chapter 36: Fenghuang Down) **Summoning\
    \ (The core of the Herrscher of Flames can summon Honkai beasts insideHonkai Impact\
    \ 3rd; Story Chapter XXV: Set Tomorrow Ablaze the Theather of Domination, a higher-dimensional\
    \ realm) *Ice Manipulation (Parvati's genes grants him the ability to control\
    \ ice) *Aura (Fear-inducing; Kevin's gaze was able to instill an instinctive fear\
    \ in Kiana from several miles awayHonkai Impact 3rd; Story Chapter XV: The Prodigal\
    \ Girl Returns) *Extreme Cold Aura (When he isn't suppressing his cold, his aura\
    \ is enough to instantly freeze a battlefield-sized portion of the oceanHonkai\
    \ Impact 3rd; Story Chapter XV: The Prodigal Girl Returns) *Enhanced Senses &\
    \ Extrasensory Perception (Was able to see and hear Kiana from several miles away\
    \ after attempting to sense her Honkai energyHonkai Impact 3rd; Story Chapter\
    \ XV: The Prodigal Girl Returns) *Transformation (By activating his Meta-Morph\
    \ ICHOR, he can trigger Active Honkai Reaction) *Summoning (He can summon and\
    \ manipulate Quantum Shadows using Mexicatl) *Limited Power Absorption (Effortlessly\
    \ extracted the Herrscher of Reason's Core from inside Bronya's body after she\
    \ was already exhausted) *Limited Space-Time Manipulation (He can break out of\
    \ pocket dimensions) *Forcefield Creation, Higher Dimensional Manipulation (At\
    \ least 5D) & Space-Time Manipulation (Can create Imaginary Barriers by warping\
    \ the fabric of space-time It should be noted that the 5D rating for Kevin's Imaginary\
    \ barrier comes from this thread, as imaginary barriers exist upon one extra spatial\
    \ dimension relative to the user. This means 5D range is required to bypass the\
    \ barrier.) *Energy Manipulation (Can channel all of the power that goes into\
    \ his later forms into a single attack using Shamash, but this leaves him unable\
    \ to continue fighting and apparently risks his life) *Regeneration (At least\
    \ Mid, likely High-Mid; Due to having a more potent version of Garuda's regeneration)\
    \ *Honkai Energy (All MANTIS soldiers are inherently highly-resistant to Honkai\
    \ energy due to inheriting the traits of their Honkai Beast gene donors) *Gravity\
    \ Manipulation & Black Hole Creation (Kevin was able to resist Su's black holes\
    \ and was unaffected by their gravitational pulls.) *D"
