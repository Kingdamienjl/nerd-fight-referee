      ZERO. Followed Adventure Sonic and often caught up to him no matter where he
      ran) to Massively FTL+ (Easily keeps up with the likes of Adventure Gemerl even
      when it's fused with the Eggmobile, which flew to the Nonaggression Zone.),
      higher with the Amy Dash ([https://imgur.com/yiANMhx Amy can utilize the Amy
      Dash, her own variation of the Spin Attack], a technique that allowed Sonic,
      Tails Nine, and Renegade Knuckles [https://imgur.com/zMhZa2V?r to blitz] [https://imgur.com/CLgsXJP?r
      a group of Eggforcers] that were [https://cdn.imgchest.com/files/6fa15317d45f.mp4
      initially blitzing them]) and with Power Cores | Massively FTL+ (Aided Elise
      in escaping Dr. Eggman's Egg Carrier. Can react to and compete with other Riders
      on their Extreme Gear. Fought against clones of Shadow, Zavok, Metal Sonic and
      Chaos 0. [https://cdn.imgchest.com/files/8fb8745fed20.jpg Able to swing at and
      strike Badniks while being carried and thrown at high speeds by Sonic]), higher
      with the Amy Dash and Boost | Varies (Powered by the seven Chaos Emeralds, which
      possess immense chaotic energies with [https://imgur.com/a/2NsUxzT fluctuating
      power levels], with Amy able to harness varying levels of positive energy);
      Massively FTL+ (Far faster than her base even when using the Boost) to Infinite
      (Superior to the Double Boost between Sonic and the Rookie, which allowed them
      to cross through the entirety of Null Space through sheer speed. Should be superior
      to Shatter Sonic), potentially up to Immeasurable at her peak (Should potentially
      be able to access the full power of the Chaos Emeralds, which enabled Super
      Sonic to hit Solaris before the latter could react) | Immeasurable (Comparable
      to Hyper Sonic, Tails, and Knuckles, as she's empowered by the Super Emeralds
      and thus far superior to any Super Form)
    source_ids: *id002
    confidence: 0.95
