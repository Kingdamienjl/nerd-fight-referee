  attack_potency:
    text: Brown Dwarf level (Capable of [https://imgur.com/re7oAzx fighting and harming
      the likes of] Classic Sonic and Classic Knuckles Can [https://imgur.com/CRewo12
      harm and destroy] Adventure Mecha Knuckles. Fought Adventure Team Sonic alongside
      the rest of Adventure Team Rose (Comparable to Team Sonic, who defeated the
      Babylon Guardian in Sonic Riders) to possibly High Universe level (Severely
      dazed Storm with [https://imgur.com/lOh6SVh a single swing of her Piko Piko
      Hammer], and [https://imgur.com/wy8OMik?r threw an Ark of the Cosmos at his
      face hard enough to knock him out]) to Low Multiverse level (Defeated a [https://imgur.com/9pZWQPq
      Phantom Ruby clone of Modern Metal Sonic with a single hit of her Piko Piko
      Hammer]. Heavily mutilated Zombot Rough [https://cdn.imgchest.com/files/e9e7247d1d6e.webp
      with one swing from her Piko Piko Hammer], [https://cdn.imgchest.com/files/6fcb65be379f.jpg
      with even ordinary Zombots being highly durable]. Took part in [https://cdn.imgchest.com/files/bf4b73380397.jpg
      a combined assault with the likes of Modern Tails, Tangle, and others] to fight
      Giga Omega. [https://imgchest.com/p/m9yx5q6p37q Used a Heavy-Egg Hammer's own
      weapon to destroy it with a single swing] while receiving minimal aid from Silver.
      Handled [https://imgchest.com/p/6eyr36eogyp a swarm of Crabmeats and deflected
      a strike from a crab mecha], with Crabmeats [https://cdn.imgchest.com/files/025d7d95166f.jpg
      being able to strike down Modern Sonic and temporarily incapacitate him]), higher
      with Boost | Varies (Amy is [https://cdn.imgchest.com/files/3bc6611cb46f.mp4
      empowered by the] Chaos Emeralds, with Amy being able to harness varying levels
      of positive energy); Low Multiverse level (Comparable to the likes of Super
      Tails and Super Ray. Should be superior to the Paradox Prism), potentially up
      to Complex Multiverse level at her peak (Should likely be capable of achieving
      the same level of power [https://imgchest.com/p/qb4zbbaxd4j used by Classic
      Super Sonic], as she can tap into a Hyper transformation) | Complex Multiverse
      level (Far superior to Super Amy)
    source_ids: *id002
    confidence: 0.95
  speed:
    text: FTL (Can [https://imgur.com/ZXO3vNs keep up with Classic Knuckles]), higher
      combat and reaction speed with Hyper Mode (Hyper Mode is a combat speed speed
      augmentation bestowed by the power of a Chaos Emerald, which can grant [https://cdn.imgchest.com/files/07589f4a2ba9.jpg
