- id: claim-powers-and-abilities-9db42468
  section: abilities
  axis: hax
  text: 'The power of the Wisps'' Hyper-Go-On Energy, which Amy can harness in a multitude
    of ways by temporarily absorbing a Wisp. Each Color Power is dependent on what
    Wisp Amy absorbs, as each has their own unique set of abilities for him to tap
    into. *Black Bomb: Using the power of a Black Wisp, Amy becomes a living and incredibly
    dense bomb. She is then able to roll over enemies or induce widespread explosions
    by detonating herself without causing self-harm, which can grow in size and power
    depending on how many enemies she''s trampled or destroyed. *Blue Cube: Using
    the power of a Blue Wisp, Amy transforms into a perfectly shaped blue cube. When
    transformed into the Blue Cube, she can emit destructive shockwaves by slamming
    into the ground that spread out for a sizeable distance in all directions. *Crimson
    Eagle: Using the power of a Crimson Wisp, Amy turns into a crimson-colored eagle-like
    figure. As the Crimson Eagle, she is able to achieve flight and soar through the
    air unhindered as well as being capable of performing a dash attack. *Cyan Laser:
    Using the power of a Cyan Wisp, Amy transforms into a cyan laser beam. As the
    Cyan Laser, she gains the same properties as that of a real laser, allowing her
    to move as a living beam of light. When hitting any surfaces as the Cyan Laser,
    she can bounce off them as if they were reflective surfaces. When hitting enemies,
    it causes great damage. *Green Hover: Using the power of a Green Wisp, Amy turns
    into a green hovercraft. As the Green Hover, she gains the power of flight, allowing
    him to fly leisurely through midair and deal damage to enemies on contact while
    transformed. *Gray Quake: Using the power of a Gray Wisp, Amy transforms into
    a grey iron ball with yellow eyes. As the Gray Quake, her body density is greatly
    increased, making her so heavy that jumping or falling down on the ground can
    create destructive shockwaves. The Gray Quake also possesses some form of adhesive
    properties, allowing Amy to scale walls despite his weight in this form. *Ivory
    Lightning: Using the power of an Ivory Wisp, Amy transforms into a living, straw-colored
    lightning bolt. As the Ivory Lightning, Amy gains the same properties as that
    of a real lightning bolt. Associated with this form, she can move at lightning-fast
    speeds and with acrobatic movements as living electricity. She can also obtain
    electrokinetic abilities in this form, giving her the ability to either form threads
    of electricity that she can use to either electrocute enemies or connect himself
    to targets as tethers. *Jade Ghost: As the Jade Ghost, Amy is able to turn herself
    invisible and enables her to move around without being visibly detected by opponents.
    The Jade Ghost also makes him intangible, thus allowing her to pass through obstacles
    and avoid unwanted attacks. In addition, the Jade Ghost allows Amy to hover slightly
    above ground when using its power. It can even render Amy intangible to those
    with Non-Physical Interaction. *Magenta Rhythm: Using the power of a Magenta Wisp,
    Amy turns into a large magenta-colored eighth note. When in this form, she is
    able to bounce on air, allowing her to move through mid-air in semi-flight. *Orange
    Rocket: Using the power of an Orange Wisp, Amy turns into a stubby orange rocket
    with six fins arranged in a regular hexagon on the rear. As the Orange Rocket,
    she can create powerful jet propulsion from her back to launch themselves forward
    through midair at staggering speeds that also damages anything caught in her way.
    *Pink Spikes: Using the power of a Pink Wisp, Amy turns into a hot pink spiky
    ball. As the Pink Spikes, she gains long, razor-sharp and extremely durable spikes
    on her body. By inserting these spikes into a surface, she can stick perfectly
    firm to it that allows her to climb up walls and along ceilings. The spikes can
    also be used offensively by using them to pierce opponents. It can also be used
    to augment her signature Spin Attack, making it much more powerful than normal.
    *Red Burst: Using the power of a Red Wisp, Amy turns into a red fireball that
    constantly gives off an aura of flames. As the Red Burst, Amy obtains pyrokinetic
    abilities. She is able to form a shield of flames around herself that instantly
    incinerates anything it touches, and she can create explosions of fire by combusting
    into flames without inflicting harm on herself. These explosions can be channeled
    to shoot Amy higher into the air or be charged up to trigger large-scale and powerful
    explosions that destroy nearly anything within its range. In addition, Amy''s
    speed increases while using Red Burst. *Violet Void: Using the power of a Violet
    Wisp, Amy turns into a fast-moving, ghastly and smoky black orb with violet outlines.
    As the Violet Void, Amy essentially becomes a living black hole and can warp space
    and time to draw objects into herself from a distance and make them vanish without
    a trace. Because of the Violet Void smoke-like makeup, Amy is granted a degree
    of intangibility, allowin'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
