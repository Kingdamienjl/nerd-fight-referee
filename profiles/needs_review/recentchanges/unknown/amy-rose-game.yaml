- id: claim-standard-equipment-8a9dd451
  section: equipment
  axis: equipment
  text: 'AmyPikoPikoHammer.webp|The Piko Piko Hammer AmyWarriorFeather.webp|The Warrior
    Feather AmyLongHammer.webp|Amy wielding the Long Hammer AmyGirlJabBattle.webp|Amy
    wearing her own pair of Boxing Gloves LargePikoPikoHammer.webp|Amy wielding the
    Heavy Piko Piko Hammer FortuneCardTheMaster.webp|An example of one of Amy''s Fortune
    Cards Ugc goal balloon.webp|An example of one of the balloons *Piko Piko Hammer:
    Amy''s signature melee weapon which she can pull out from her hammerspace, capable
    of delivering powerful blows with little effort, function as a propellor or witch-broom
    for flight, launch powerful shockwaves that can stir up miniature tornados of
    pink hearts, and unleashing massive releases of pink energy. Multiple back-ups
    of the Piko Piko Hammer exist in her hammerspace and can be pulled out at anytime.
    *Warrior Feather: An upgrade accessory that can be attached to Amy''s headband
    which allows her to perform the Spin Hammer Attack. *Long Hammer: A longer variant
    of the Piko Piko Hammer, meant to extend the reach of her hammer-based attacks
    so she can damage opponents from further distances. *Explosive Gift Boxes:Several
    bombs disguised as neatly-wrapped giftboxes which Amy can materialise out from
    nowhere. *Boxing Gloves: Amy''s own personal pair of boxing gloves which she uses
    when performing her Girl Jab, Girl Straight and Girl Upper attacks. *Heavy Piko
    Piko Hammer: A larger variant of the Piko Piko Hammer meant to pack more power
    than the standard Piko Piko Hammer. *Fortune Cards: A deck of 78 magical cards
    which Amy can use as a wheel for travelling on ground or gliding mid-air, as melee
    weapons, or as cards to let read the near future. *Balloons: Balloons that can
    be materialised from nowhere and are used to gain height or slow her descent.
    Optional'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-45897193
  section: power_scale
  axis: battle_iq
  text: At least Average, Genius Combatant and Tactician (Amy has shown the capacity
    to be an excellent strategist and tactician, such as [https://imgchest.com/p/wl7lllmqp7x
    quickly and efficiently giving orders to citizens of a town so they could repel
    the first wave of a Badnik attack]. She was also at the forefront of the Restoration,
    [https://imgchest.com/p/a846qqgbgyx handling evacuation efforts across several
    locations during the Metal Virus plague]. Amy Rose is a gifted fighter with her
    Piko Piko Hammer, being capable of fighting both against and alongside Sonic competently,
    and also boxercises. Could best the likes of [https://imgur.com/a/6w9qP8p Mirror
    Fighter and Metal Sonic in under 1 minute each and the E-Mech in Hyper Mode within
    17 seconds] during Sonic the Fighters. Constantly fought and trained Emerl as
    he gained more Chaos Emeralds and awoken more of his ancient combat data, [https://www.youtube.com/watch?v=wqfxViAIizo&t=240s
    even being able to train with him after he acquired all 7 Chaos Emeralds] during
    Sonic Battle.)
