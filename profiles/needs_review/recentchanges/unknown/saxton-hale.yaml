    on Earth could stop the Yeti. Likely a hyperbole, but still gives an idea about
    how strong the Yeti is. *Apparently is still able to fight the Scout and the Heavy
    even after being weakened. *Destroys several Grey Mann robots. *Casually punches
    at 2751 PSI. *Fights a Lion while getting his hair cut. *Caused the extinction
    of a species of Sharks in Indonesia. *Became a Boss character, and an unofficial
    tenth class, in the Beat Saxton Hale game mode. *Defeated the God of the Azstec
    underworld. Durability *Doesn''t even flinch when the Yeti is biting his arm.
    *Jumps out a plane with no injuries. Intelligence/Skill *Lead a troop of Girl
