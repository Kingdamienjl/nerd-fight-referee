power_scale:
  tier:
    text: ', higher with Monster Form'
    source_ids: &id002
    - mediawiki-3041
    confidence: 0.8
  attack_potency:
    text: Galaxy level (Copied Shadow's physicality through his shadow, and was able
      to beat him after a fight. Later, he fought Shadow alongside his partners. Harnessing
      the power of a Chaos Emerald, Mephiles was able to launch the aforementioned
      three with shockwaves. Impaled 06 Sonic in one strike), higher with Monstrous
      Form (His fist can smash Shadow and his laser can burn him)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively FTL+ (Can fly at the same pace as an "inhibited" Modern Shadow
      can skate during '06248,836,724 c), higher with Darkness Empowerment (Rematerializing
      his body after hiding in the shadows makes him faster)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Multi-Stellar (Should be comparable to Modern Shadow), higher with
      Monstrous Form
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Galaxy level, higher with Monstrous Form
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Galaxy level (Withstood Modern Omega's arm cannon and machine gun fire.
      Can take attacks from a Chaos Boost Shadow), higher with Forcefields (Can stonewall
      Modern Shadow's Homing Attack & Chaos Attacks), Monstrous Form (Tough enough
      that Shadow is unable to hurt him except from his weakspot, the light core)
      and Boost, up to Complex Multiverse level Damage Transferal with Rings (Having
      enough Rings shields damage from those as strong as Void and Tethered Supreme6-D).
      Regeneration makes him difficult to kill, and he can also avoid physical harm
      by hiding in an person's shadow.
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Never shown to get tired during the events of the '06)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, Hundreds of Meters with his ranged attacks and abilities
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Genius (Was able to manipulate the entire cast of Sonic the Hedgehog in
      a gambit to restore himself to his true form, Solaris)
    source_ids: *id002
    confidence: 0.8
