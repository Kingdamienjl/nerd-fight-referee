- id: claim-powers-and-abilities-7249d14f
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Size Manipulation/Large Size (Can
    vary in height, varying as just taller than the average human, to reaching the
    height of large treesVictor Surge Instagram) **Additional Limbs (Has various tendrils
    which appear to come out of it''s back and arms) **Body Control (Via tendrils)
    *Stealth Mastery *Social Influencing/Mind Manipulation (Instigating Fear, Charisma
    - Convinced a group of children to follow it and kill people for it, with it''s
    mere silence alone described as horrifying and comforting.Let the children...
    Made someone kill and cannibalize the corpse for it) **Fear Manipulation (Causes
    people to become paranoid, sending shivers down people''s spine and make them
    paranoid that they''re being watched) *Shapeshifting (Never keeps the same appearance
    for very long) *Intangibility (Described as being a dark fog, his body is described
    as moving like a meaty black smoke and a shapeless figure in photos) *Clairvoyance
    (Slenderman functions on a metaphysical territoriality, causing it to learn more
    of someone the more they''re aware of it) **Teleportation (Can appear in people''s
    location if they''ve seen photos or know about it,Slender Man House Call this
    effect can even extend to simply thinking about Slender Man.Best Not Known Caused
    33 patients and staff of the woodview mental hospital to compeltely vanish) *Invisibility
    (Was not able to be seen by Gloria Cready until after she took a photo of herself
    in a mirror) *Technology Manipulation (Caused an entire house to lose power. Photos
    with The Slender Man in them have distortions and deformities in them) *Weather
    Manipulation (Caused fog levels to rapidly riseSteinmen Woods) *Sound Manipulation
    (Made the forest two hunters were in emit murmuring, humming, and children laughter)
    *Madness Manipulation (Type 3; Staring at photos of it will cause people to puke,
    staring at Slender Man causes nausea and splitting headaches. Its presence and
    figure has been described to ''fight over comprehension''. Likely the reason Gloria
    Cready was put into a mental rehabilitation hospital after the encounter with
    it.The Wilks Estate An unknown survivor of one of Slenderman''s attacks became
    heavily suicidal, begging to be murderedRetribution) **Pain Manipulation (Simply
    having the barest knowledge on Slender Man causes pressure in people''s mind)
    *Memory Manipulation (twists and warps memories it can find within people''s minds)
    *Likely Fire Manipulation (Very likely the cause of the library fire happening
    one week after fourteen children went missingStirling City) *Possibly Multilocation
    (Type 2; Each Slender Man incident is possibly a different Slender Man, noting
    to ''taste'' different) *Unconventional Resistance to Memory Manipulation (Amnestics
    which can completely wipe the memory of a person''s gender, favorite food and
    favorite color, among other things are not able to completely wipe memories of
    Slender Man)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
