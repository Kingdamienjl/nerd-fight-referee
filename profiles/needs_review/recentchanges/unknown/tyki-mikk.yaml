- id: claim-powers-and-abilities-cae0cb5e
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Dark Matter Abilities *Martial Arts
    *Longevity (Noah are directly stated to age much slower then humans) *Immortality
    (Types 4 and 8: Reliant on his Noah Memory of Pleasure (Non-Combat Applicable)
    *Limited Mind Manipulation & Telepathy (Noah can telepathically control all Akuma,
    this control allows Noah to manipulate the thoughts and actions of Akuma, to the
    point of being able to force Akuma to do things which they wouldn''t normally
    do like self-destructDGM: Chapter 25) *Extrasensory Perception & Enhanced Senses
    (Noah can sense others around their vicinity and see normally invisible things
    like Souls) *Causality Manipulation & Enhanced Intangibility, Flight & Durability
    Negation (As the Noah of "Pleasure", Tyki Mikk can "choose" what he interacts
    with or not, allowing him to do things such as "choose" to interact with "Air",
    giving him the ability of Pseudo-Flight or "choose" to not interact with someone''s
    body, allowing him to negate their conventional durability or "choose" to have
    people not interact with him, giving him a semi-passive form of Intangibility
    within combat-based scenarios, this level of Intang allows Tyki to phase through
    Dark Matter) **Enhanced Non-Physical Interaction (As the Noah of "Pleasure" Tyki
    Mikk can "choose" to interact with "everything in this life" which includes things
    like Space, Air and Souls) **Enhanced Spatial Manipulation, Air Manipulation &
    Enhanced Existence Erasure (As the Noah of "Pleasure", Tyki Mikk can "choose"
    to "repel" things from existence, allowing him to "repel" the existence of things
    like Space to create an vacuum of air around someone to suffocate them and crush
    them) *Berserk Mode (Tyki Mikk enters a berserker-like state if his Noah Memory
    his damaged enough, this takes away Tyki''s ability to think and reason but greatly
    increases his physical stats and grants him the ability to use tendril- like constructs
    of Dark Matter, Tyki can now use these tendrils while in Base), **Passive Aura,
    Fear Manipulation & Limited Sense Manipulation (Whilst in his Noah Form Tyki Mikk
    creates an aura that causes the air around him to become colder and induces intense
    fear onto others like Lavi) *Statistics Amplification (Tyki Mikk can coat Dark
    Matter around his hands to increase their durability and attacking power) *Instinctive
    Reaction (Instinctively reacted to Yu Kanda''s attack from behind) *Limited Size
    Manipulation, Blood Manipulation, Duplication & Reactive Evolution (Tyki Mikk
    possesses "Teez", These are butterfly-like Golem''s that can be "summoned" inside
    someone''s body through manipulating the opponents blood, these "Teez" also feed
    on the blood of Tyki''s opponents to make themselves larger and stronger) *Forcefield
    Creation (Tyki can use the "Teez" as forcefields to block attacks) *Dimensional
    Travel, Portal Creation, BFR & Likely Summoning (Tyki Mikk has access to the Akuma
    Gate, which allows one to travel between dimensions and be used to forcefully
    teleport others into different dimensions as well, should be able to use the Akuma
    Gates in similar ways to that of the Millennium Earl) Fire Manipulation, Heat
    Manipulation & Ice Manipulation (Resist "Ice Fire" which burns hotter than blue-flame
    level heats and creates -100 Degree Celsius ice), Sound Manipulation (Resist "Punk
    Voice" which creates a vibration wave of sound that causes enough pressure to
    cause dense ice to completely shatter, also causes the nerves within one''s body
    to become completely shot, causing someone to go into a catatonic state), Power
    Mimicry (Resist "Paper Mirror" which copies the appearance and abilities of someone,
    even ones that''re inherently antithetical towards his existence like Innocence
    or genetic abilities like Parasitic-Type Innocence), Water Manipulation & Durability
    Negation (Resist "Water Bubbles" which causes the water within the effected target
    to be completely sucked out of them, leaving a dry and empty husk), Sleep Manipulation
    (Resist "Man Eating Plants" which create a pheromone that Allen describes as "sweet
