    - field: intelligence
      value: 'Above Average: Given his position as a Noah, Tyki Mikk rarely has to
        do anything that could be considered "academic" related but given his Noah
        Memory providing him with 1000''s of years of experience, ranging from combat
        to academia from all of the previous Joyd''s he''s much more experienced/intelligent
        then your average human. Gifted: Tyki Mikk is much more gifted in his ability
        within combat comparative to his academia skills, he''s able fight on par
        with other similarly skilled to higher skilled opponents such as Allen Walker
        and Yu Kanda. He''s also shown to be a quick thinker within combat as shown
        after finding out that Apocrypha could sense their location through Allen
        Walker''s Crown Clown he instantly when''t to destroy the Innocence to null
        Apoc''s ability to find their location.'
      source_id: vsbattles-tyki-mikk-unknown
