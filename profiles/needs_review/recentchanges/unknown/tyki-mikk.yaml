- id: claim-weaknesses-fa6e98d4
  section: weaknesses
  axis: weakness
  text: "Innocence, Tyki Mikk can't phase through Innocence with his \"Choose\" ability.\
    \ Notable Attacks/Techniques: Teez (\u30C6\u30A3\u30FC\u30BA T\u012Bzu): Flesh-eating\
    \ butterfly golems created from Dark Matter, these golems are a staple within\
    \ Tyki's arsenal and are consistently used by Tyki within combat, these Teez can\
    \ me \"summon\" in one's body through Tyki manipulating the blood of his opponent,\
    \ this causes the opponents body to rapidly expand, gaining a bunch of boil-like\
    \ markings around their body, which eventually causes the opponent to explode\
    \ into gory chunks of flesh and bone. *Evolved Teez: As the number of Teez multiply,\
    \ they eventually fuse together, creating a much larger, more advanced Teez. They\
    \ retain their butterfly-like appearance, they now bear a skull in the middle\
    \ of their bodies and their wings gain a striped pattern. These are able to shoot\
    \ Dark Matter out of their mouths and be turned into weapons by Tyki or into shields\
    \ by Tyki, allowing him to even block Innocence enhanced attacks like Allen's\
    \ Crown Clown. Choose (\u9078\u629E Sentaku): As the Noah of \"Pleasure\" Tyki\
    \ possesses the ability to \"choose\" all things within creation. This power possesses\
    \ many practical applications. *Solid Phasing: This allows Tyki to pass through\
    \ solid matter as if it didn't exist. He uses this ability to kill many of his\
    \ victims by removing their vital organs without damaging the skin. This also\
    \ grants Tyki the ability to \"phase\" through attacks or anything that his \"\
    Choose\" can interact with. He can also use this to cut through anything he can\
    \ interact with, regardless of that things existence/durability, *Fluid Walker:\
    \ Tyki can choose to treat gas and liquids as solid objects which enables him\
    \ to walk on the air (and thus flying) or on water. *Repel: As the Noah of \"\
    Pleasure\", Tyki is also capable of \"repelling\" the existence of things that\
    \ his \"Choose\" ability can interact with. while fighting Allen, Tyki created\
    \ a vacuum, similar to that of outer space by \"repelling\" the existence of the\
    \ space around Allen, removing the oxygen and ambient air pressure around him.\
    \ This not only caused Allen to start suffocating but also created massive gravitational\
    \ pressure that would've crushed Allen's body from existence. Road notes that\
    \ Tyki only uses this ability when he is serious and not holding back anymore.\
    \ Awakened Noah (\u899A\u9192 Kakusei): After Tyki's Noah Memory has been been\
    \ damaged to a specific-point he transforms into his \"Noah Form\", this form\
    \ greatly changes Tyki's appearance, coating his body in Dark Matter and molding\
    \ it into the shape of a knight-like figure, this form massively increases the\
    \ speed, strength and durability of Tyki, allowing him to casually block attacks\
    \ with his bare-hands which previously heavily damaged Tyki. He also gains the\
    \ ability to create Dark Matter tendrils that protrude from his back, these tendrils\
    \ allow Tyki to attack from a much longer range compared to his regular punches\
    \ and kicks. Tyki gains the ability to use these tendrils while in base and the\
    \ ability to coat his body with Dark Matter as well. Note: Tyki's Dimensional\
    \ Travel and Portal Creation is only applicable in his Third Exorcist Arc Key.\
    \ Tyki Mikk.png Tykirenn.png Noah of Pleasure.jpeg ==Notable Matchups== ==References==\
