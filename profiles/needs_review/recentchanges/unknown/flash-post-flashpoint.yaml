- id: claim-weaknesses-ca83439e
  section: weaknesses
  axis: weakness
  text: "Can get cut off from the Speed Force. He also has been shown to get mentally\
    \ overwhelmed in some situations. Feats: * Disarms some soldiers before they\u2019\
    re aware they\u2019ve been disarmed. *Searches Manhattan and finds Madam Xanadu\
    \ before Frankenstein is aware the Flash has even left. *Runs through everywhere\
    \ in Manhattan saving civilians from monsters. *Can think at a speed where he\
    \ can see the future and make the best possible choice for every action. * His\
    \ instincts and reflexes allow him to react and move the femtosecond he feels\
    \ even the slightest changes in air pressure. *Flash calls the Watch Tower\u2019\
    s computers slow, despite the fact that they can perform over 100 quadrillion\
    \ calculations per second. * Can learn how to use Hal Jordan's Power Ring in seconds.\
    \ *Can speed up all of time and space and take everything a few seconds into the\
    \ future, choosing who to take with him and who to leave behind, skipping a time\
    \ paradox in the process."
  source_ids: *id003
  decisive: false
  status: unverified
