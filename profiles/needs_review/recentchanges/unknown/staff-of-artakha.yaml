    - field: weaknesses
      value: 'Doesn''t use the Nightfall virus or transmutation often, focuses mainly
        on killing. Project 0011''s abilities have cool downs and or have a limited
        amount of time that they work Notable Attacks/Techniques: Unique Abilities
        * Roar: Subject 0011 is able to roar doing damage to people and objects, if
        a staggering Survivor gets damaged it cause a recharge * Warp: Subject 0011
        is able to warp, teleporting to the nearest Survivor * Cloak: Subject 0011
        can cloak, becoming hard to see and notice * Marker: In Before the Dawn II
        every time a survivor moves or breathes, arrows appear showing survivors current
        location * Collapse: In Night shift during the beginning of the sewers section
        of the game a large portion of the sewers almost collapses, later during the
        facility section various large sectors of the facility collapse * Charge:
        Subject 0011 is able to charge with a sword like razor on his arm one hit
        killing anyone standing in his path Not Unique Abilities * Bite: Subject 0011
        bites a nearby survivor, causing the survivor to take small amounts of damage
        over time * Swipe: Subject 0011 swipes at a nearby survivor, draining their
        stamina and doing small amounts of damage over time * Spit: Subject 0011 spits
        at a nearby survivor, doing large amounts of damage over time * Disguise:
        Subject 0011 is able to disguise himself as a survivor * Detect: Subject 0011
        sees and knows the location of the closest survivor * Trap: Subject 0011 creates
        a fake downed survivor that will explode doing critical damage when real survivors
        get close * Chase: Subject 0011 gets more stamina * Fury: Subject 0011''s
        attack speed increases * Execute: Subject 0011 finishes off injured survivors
        * Skip: Subject 0011 skips in the future * Rewind: Subject 0011 rewinds time
        and sees the positions of survivors * Freeze: Subject 0011 pauses time like
        Dio Brando for 9 seconds * Arrest: Subject 0011 pulls a nearby survivor over
        dealing small amounts of damage * Lockdown: Subject 0011 puts down traps that
        prevent survivors from moving while doing a small amount of damage * Mine:
        Subject 0011 places a mine down that does a small amount of damage * Ambush:
        Subject 0011 teleports close to a survivor and reveals all survivors * Booby
        Trap: Subject 0011 will make 1/3 of the map''s consumables explosive * Vapor:
        Subject 0011 becomes a hard to see cloud of vapor * Mist: Subject 0011 blasts
        out a cloud of mist that can stun and drain the batteries of survivors and
        anyone being hit by the mist are marked for a short duration. * Possession:
        Subject 0011 possesses a survivor, disabling their controls for the duration
        of possession, after the end of the duration the survivor explodes blasting
        out a cloud of mist doing heavy damage and draining the batteries of survivors
        with any survivors caught in the explosion being marked for a short duration.
        Note: Its unknown if the mysterious creature from the A Pirate''s Tale Let
        the moon light your path quest line scales or not. Note 2: This profile to
        going to get a another key, more photos, and more. Note 3: Names of characters
        in Aurek Team games change very randomly so in order to make indexing easier
        I used the Subject 0011'
