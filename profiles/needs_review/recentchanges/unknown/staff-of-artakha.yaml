    - field: attack_potency
      value: "High Outerverse Level (Just a flicker of a fragment of the soul of Arthas,\
        \ that was so insignificant that Sylvanas didn\u2019t even consider it a soul,\
        \ was still strong enough to power Kingsmourne. Typically souls maintain the\
        \ strength they had when they were alive (sometimes even surpassing it) as\
        \ seen with characters like Uther, Mograine, Draka and others, with this clearly\
        \ being a case of a soul being vastly weaker than their normal state. Arthas\u2019\
        \ fragmented soul even manifests as a \u201CRemnant of a Fallen King\u201D\
        \ and fights the Champions of Azeroth during their battle against Anduin furthering\
        \ the fact that this fragment of Arthas scales to this Anduin. It is even\
        \ stated that this remnant was the source behind the Domination magic that\
        \ controlled Anduin's soul before and during the fightSepulcher of the First\
        \ Ones Adventure Guide. As mentioned before, this fragment is so weak compared\
        \ to Arthas at full power (with the Helm of Domination and Frostmourne) that\
        \ unlike all the other souls that exist in the Shadowlands, even the ones\
        \ chained and broken within the Maw and Torghast, it dissipates nearly straight\
        \ away when broken away from Kingsmourne. This is all important because Kingsmourne\
        \ and by extent Arthas' soul was able to amp Anduin to the point where he\
        \ could one-shot the Archon using the mourneblade. The Archon is a member\
        \ of the Pantheon of Death also known as the Eternal Ones which is a group\
        \ of transcendent beings embodying the cosmic force of Death. This Pantheon\
        \ is stated to be as powerful as the other Pantheons which includes the Pantheon\
        \ of Order also known as the Titans. Going deeper into Arthas scaling to the\
        \ Eternal Ones. Arthas, after donning the Helm of Domination and becoming\
        \ the Lich King, likely became a being akin to the Eternal Ones, embodying\
        \ the cosmic force of Death. This is because he is directly called the avatar\
        \ of Death itselfThe Fall of Silvermoon (WC3 Undead), a state that is typically\
        \ reserved for the Pantheon of Death, who themselves are the embodiment of\
        \ the cosmic force of Death. As the Lich King he himself states that Death\
        \ seeps through him and envelops all that he touches. The Vrykul who worship\
        \ the Titans as gods also worship the Lich King as their Death God showing\
        \ they hold the Lich King to the same level of reverence as that of the Titans.\
        \ Leading into further support for his scaling to the Titans themselves. The\
        \ merging of Arthas and Ner'zhul into the Lich King is described as having\
        \ formed a godlike being with the Titans often being described as godlike\
        \ beings. Supporting this even more is the fact that it is stated that the\
        \ Lich King is an all-powerful entity with the Titans also being referred\
        \ to as such by Xe'raIn the House of Light and Shadow. Lastly, it is also\
        \ stated that once they merged he became one of the mightiest entities the\
        \ world had ever known with the world having knowledge of Sargeras, the Titans\
        \ and the Old Gods prior to this. Also worth nothing is that he is also stated\
        \ to have unparalleled powerWrath of the Lich King Classic despite the Champions\
        \ having fought the Old God Yogg-Saron before fighting him. From this I think\
        \ it is consistent that at the very least Arthas scales to the various Pantheons\
        \ and himself likely achieved an existence similar to them by becoming the\
        \ embodiment of the cosmic force of Death. The Titans are so powerful that\
        \ a being like Nozdormu is described as the equivalent of a slug crawling\
        \ out of the mudThe Sundering after feeling the power of Sargeras through\
        \ the Well of Eternity. This is notable as Nozdormu scales to the Emerald\
        \ Dream due to him assisting in the defeat of Deathwing who can make the entire\
        \ realm tremble with his CataclysmDeathwing Encounter. The Emerald Dream notably\
        \ transcends the concepts of distance and time which would make it at least\
        \ 1-A with it likely being infinitely high into 1-A. To see more on the justification\
        \ for this, check out my cosmology blog. To further support the gap between\
        \ the Titans and those that scale to the Emerald Dream, Sargeras, a former\
        \ member of the Pantheon of Order, is stated to be so much stronger than Archimonde\
        \ and Mannoroth that they were as fleas in comparison to him. Even the entire\
        \ Burning Legion was described as a shadow compared to himThe Demon Soul.\
        \ The manifestation of the Void Lord Dimensius is also described as being\
        \ a mere shadow relative to his full powerWhispers of Xal'atath with the Void\
        \ Lords likely being part of the Pantheon of Void. Arthas also scales above\
        \ the Old Gods such as Yogg-Saron as mentioned before. The Old Gods are beings\
        \ that are stated to be as much above Krasus as he is to a worm. Krasus scales\
        \ to 1-A due to his participation in the War of the Ancients which includes\
        \ his victory over Hakkar the Houndmaster with aid from Malfurion. Hakkar\
        \ was one of the main leaders of the Legion's assault during the War of the\
        \ Ancients alongside Archimonde and Mannoroth. From this, we can determine\
        \ that Arthas scales to characters that are repeatedly shown to dw"
