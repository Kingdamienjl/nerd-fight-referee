    - field: weaknesses
      value: 'Standard Devil Fruit users weaknesses. Excessive usage of Gear 4th renders
        Luffy unable to use Haki for 10 minutes. Gear 4th greatly increases Luffy''s
        metabolism, making his body burn calories much faster and greatly lowers how
        long he can remain in combat. Gear 4th: Tankman can only be utilized when
        Luffy has consumed a sufficient amount of calories., Same as before. However,
        he doesn''t suffer the same drawback when using Gear 4th, being able to activate
        and deactivate it at will without suffering any notable toll and being capable
        of using his King Kong Gun without losing too much stamina in the process,
        it consumes plenty of energy to maintain and use, at which point Luffy will
        visibly age once de-transformed, and also experience an extensive amount of
        exhaustion and fatigue. That said, Luffy still has his standard weakness to
        cutting attacks'
