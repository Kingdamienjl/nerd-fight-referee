    - field: weaknesses
      value: 'Daphne suffers from insatiable hunger which causes her to not think
        about anything except satisfying her hunger. Doesn''t like to exert herself,
        she considers even moving a muscle as making her hungrier. She will become
        motivated however if food is in front of her, food in any form including people.
        Notable Attacks/Techniques: Authority of Gluttony: Daphne can make people
        feel extreme hunger by touching or looking at them. Her left eye was enough
        to force Subaru to eat his arm and try to lick his own blood while ignoring
        everything other than the thought of eating. Despite this, Echidna described
        Daphne''s left eye as "nothing much", stating that the real horror of Daphne
        is her right eye, and after being eaten. It is dangerous to even touch Daphne
        as her skin devours whatever touches her. Another usage of this Authority
        is the ability to create living things out of nothing. She creates mabeasts
        when her mood is "woozy". Through her ability she has created all mabeasts,
        the most powerful of which are the 3 great mabeasts, the hakugei (white whale),
        oousagi (big rabbit), and the kurohebi (black snake). The hakugei has the
        ability to erase anything it touches with its mist of elimination from existence.
        The oousagi has an insatiable hunger and only eats living things, there are
        as many of them as there are water droplets in mist, it can easily eat people
        like Garfiel, it leaves no traces of the people they have eaten, not even
        a single drop of blood and it can literally keep multiplying infinitely as
        long as even one of them is alive. The kurohebi can plague its victims with
        a hundred diseases just by touching them, and any ground that it slithers
        over is cursed, making anything except mabeasts unable to live on it. A person
        that came into contact with its tongue was scarred with reddish black burns,
        another had their skin from the neck up covered in reddish black spots that
        gushed black blood, and another had their body dried up to the point that
        touching them might break their body apart. Category:Morning Star TM Category:Tier
        7 Category:Tier 4'
      source_id: character-stats-profiles-daphne-re-zero-unknown
      provider_id: character_stats_profiles
      authority: high
