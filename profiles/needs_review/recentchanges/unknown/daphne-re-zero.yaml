- id: claim-weaknesses-dfd41f81
  section: weaknesses
  axis: weakness
  text: 'Has an insatiable hunger which causes her to not think about anything except
    satisfying her hunger. Doesn''t like to exert herself, she considers even moving
    a muscle as making her hungrier. She will become motivated however if food is
    in front of her, food in any form including people. Notable Attacks/Techniques:
    *Authority of Gluttony: An ability which allows Daphne to make people feel extreme
    hunger by touching or looking at them. Her left eye was enough to force Subaru
    to eat his arm and try to lick his own blood while ignoring everything other than
    the thought of eating. Despite this, Echidna described Daphne''s left eye as "nothing
    much", stating that the real horror of Daphne is her right eye, and after being
    eaten. It is dangerous to even touch Daphne as her skin devours whatever touches
    her. *Life Creation: Daphne is able to create living beings called Witchbeasts
    out of nothing. She creates Witchbeasts when her mood is "woozy". Through her
    ability she has created all Witchbeasts, the most powerful of which are the Three
    Great Witchbeasts, the White Whale, Great Rabbit, and the Black Serpent. The White
    Whale has the ability to erase anything it touches with its mist of elimination
    from existence. The Great Rabbit has an insatiable hunger and only eats living
    things, there are as many of them as there are water droplets in mist, it can
    easily eat people like Garfiel, it leaves no traces of the people they have eaten,
    not even a single drop of blood and it can keep multiplying infinitely as long
    as even one of them is alive. The Black Serpent can plague its victims with a
    hundred diseases just by touching them, and any ground that it slithers over is
    cursed, making anything except Witchbeasts unable to live on it. A person that
    came into contact with its tongue was scarred with reddish black burns, another
    had their skin from the neck up covered in reddish black spots that gushed black
    blood, and another had their body dried up to the point that touching them might
    break their body apart. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== Category:Characters Category:Re:Zero kara Hajimeru Isekai Seikatsu
    Category:Female Characters Category:Light Novel Characters Category:Witches Category:Immortals
    Category:Fear Users Category:Internet Characters Category:Supernatural Willpower
    Users Category:Madness Users Category:Isekai Characters Category:Aura Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-a330a9ba
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Greater Law Manipulation & Conceptual\
    \ Manipulation (Type 2; Witch Factors bend the unshakeable laws of the worldNo\
    \ Stella No Life 3 to the will of their possessor. Authority holders are the destroyers\
    \ of concepts, permitted to bend the very rules of the world,Arc 9, Chapter 40,\
    \ \"Flash Remnade\" trampling upon them as they please. Authorities are not simple\
    \ abilities, and instead manifest some sort of concept.Arc 9, Chapter 54, \u201C\
    \u300EWarlock\u300FVS\u300EWitch\u300F\u201D Authorities are powers that twistArc\
    \ 9, Chapter 21, \"Valga Cromwell\" the laws of reality. An Authority is the right\
    \ to interfere with the nature of the world, to overturn concepts, to paint over\
    \ those lawsArc 9, Chapter 36, \"Problem\"\u2014 the official right to rewrite\
    \ the worldArc 9, Chapter 33, \"The Girl Named Petra Leyte\" as recognized by\
    \ Od Lagna), Conceptual Manipulation (Type 3; the Od is the \u201Cpure property\
    \ itself that made a human, human\u201D, being synonymous with the individual's\
    \ soul and defining their existence.Volume 25, Chapter 7Volume 25, Chapter 3 It\
    \ encompasses the individual's Memories, elemental character, destiny, and life\
    \ force,Volume 9, Chapter 1 with the body's form itself conforming to the Od,\
    \ such that altering the Od alters both the body and mind.Volume 31, Chapter 2\
    \ Od contains the Name and Memories. When the name is vanquished, the person is\
    \ erased across all of history with the world being rewritten as though they were\
    \ never there and wiped from everyone's minds.Volume 6, Chapter 4 Eating the Name\
    \ of his victim will erase the Memories of them from the world itself,Volume 9,\
    \ Chapter 6, \"To Each Their Oaths\" even erasing evidence of their existence\
    \ such as anything they wrote.Volume 10, Chapter 1, \"At the Place They Returned\
    \ To\" Those with their Memories eaten forget everything about themselves and\
    \ others, while those with their Name eaten are completely forgotten by everyone\
    \ in the world.) Creation (Has the ability to create WitchbeastsVolume 11, Chapter\
    \ 5), Fear Manipulation (Seeing a Witch causes overwhelming fearVolume 10, Prologue,\
    \ and being in their presence causes others to vomitVolume 10, Chapter 2), Pain\
    \ Manipulation and Madness Manipulation (Type 2; Daphne's left eye causes those\
    \ who look into it to be attacked by agonizing starvation that drives the victim\
    \ insane near instantaneously, and it is considered unthreatening compared to\
    \ her right eye. A Witch's Miasma is so potent and voluminous that if a Witch\
    \ stops holding it back, it will drive most people in their presence to suicidal\
    \ insanity), Aura (Witches have a powerful aura which causes fear. Their aura\
    \ is also said to be overwhelmingVolume 15, Chapter 4 and can cause people around\
    \ them to go numb), Supernatural Willpower (Witches are beings whose beliefs never\
    \ waverVolume 13, Chapter 1 even when they lose a limb or faced with death), Extrasensory\
    \ Perception (Even untrained civilians such as Subaru can detect the mana in the\
    \ atmosphere and spikes of magical energy Volume 3 Chapter 3: \"The Meaning of\
    \ Courage\"), Immortality (Type 1), Enhanced Senses (Even while blindfolded, she\
    \ can accurately grasp her surroundings via smell and sound), Resistance to Empathic\
    \ Manipulation (Witches are unaffected by Carmilla's charms), and Fear Manipulation\
    \ (Having a Witch Factor grants resistance to a Witch's aura which causes fearVolume\
    \ 10, Chapter 2), Madness Manipulation, Soul Manipulation & Mind Manipulation\
    \ (Type 2; Witch Factor holders are unaffected by Witch's Miasma that can cause\
    \ people to go insane, and corrupts their souls. Effecting the soul also effects\
    \ the mindVolume 11, Chapter 5 as the mental has been equated to the spiritualVolume\
    \ 10, Chapter 2), Poison Manipulation, Disease Manipulation, and Petrification\
    \ (She can eat the Black Serpent, a Witchbeast that is poisonous, curses it's\
    \ victim with 100 diseases upon touch, and can petrify people)"
  source_ids: *id003
  decisive: true
