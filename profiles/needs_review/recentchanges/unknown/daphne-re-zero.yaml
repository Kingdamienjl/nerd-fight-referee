    - field: weaknesses
      value: 'Has an insatiable hunger which causes her to not think about anything
        except satisfying her hunger. Doesn''t like to exert herself, she considers
        even moving a muscle as making her hungrier. She will become motivated however
        if food is in front of her, food in any form including people. Notable Attacks/Techniques:
        *Authority of Gluttony: An ability which allows Daphne to make people feel
        extreme hunger by touching or looking at them. Her left eye was enough to
        force Subaru to eat his arm and try to lick his own blood while ignoring everything
        other than the thought of eating. Despite this, Echidna described Daphne''s
        left eye as "nothing much", stating that the real horror of Daphne is her
        right eye, and after being eaten. It is dangerous to even touch Daphne as
        her skin devours whatever touches her. *Life Creation: Daphne is able to create
        living beings called Witchbeasts out of nothing. She creates Witchbeasts when
        her mood is "woozy". Through her ability she has created all Witchbeasts,
        the most powerful of which are the Three Great Witchbeasts, the White Whale,
        Great Rabbit, and the Black Serpent. The White Whale has the ability to erase
        anything it touches with its mist of elimination from existence. The Great
        Rabbit has an insatiable hunger and only eats living things, there are as
        many of them as there are water droplets in mist, it can easily eat people
        like Garfiel, it leaves no traces of the people they have eaten, not even
        a single drop of blood and it can keep multiplying infinitely as long as even
        one of them is alive. The Black Serpent can plague its victims with a hundred
        diseases just by touching them, and any ground that it slithers over is cursed,
        making anything except Witchbeasts unable to live on it. A person that came
        into contact with its tongue was scarred with reddish black burns, another
        had their skin from the neck up covered in reddish black spots that gushed
        black blood, and another had their body dried up to the point that touching
        them might break their body apart. ==Notable Matchups== Victories: Losses:
