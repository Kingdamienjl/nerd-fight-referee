power_scale:
  tier:
    text: Likely 9-A | Low 7-B | 6-C | 6-C | 5-B
    source_ids:
    - vsbattles-red-pok-mon-adventures-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "Likely Small Building level (Knocked out a Rocket Grunt, who should be\
      \ strong as Jessie or James, and managed to free himself from the Grip of Carr\u2019\
      s Mech. Shouldn't be weaker than his Origins counterpart) | Small City level\
      \ (His Pikachu is incredibly powerful among its race, to the point that its\
      \ Thundershock can bypass immunity of Brock's well trained Onix. Most of his\
      \ other Pok\xE9mon were also capable of Brock's admiration even while weakened)\
      \ | Island level (Was considered such a threat by the Elite Four that they were\
      \ forced to team up and attempt to get rid of him) | Island level (Became stronger\
      \ than before and is capable of Mega-Evolving his Venusaur) | Planet level (Uses\
      \ Mewtwo as his primary Pok\xE9mon)"
    source_ids:
    - vsbattles-red-pok-mon-adventures-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Peak Human (Traveled 10 blocks while skipping over a jump rope on a floor\
      \ that was moving backwards. Shouldn't be slower than his Origins counterpart)\
      \ with FTL reactions (Can dodge and react to attacks from fully evolved Pok\xE9\
      mon as Golem or Dragonite) | Sub-Relativistic | FTL | FTL | Massively FTL+"
    source_ids:
    - vsbattles-red-pok-mon-adventures-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class 10 | Class 50 | At least Class T (Has a trained Snorlax in
      his team) | At least Class T | At least Class T. At least Class Z, likely higher
      for Mewtwo
    source_ids: &id002
    - mediawiki-519458
    confidence: 0.95
  striking_strength:
    text: Likely Small Building level | Small City level | Island level | Island level
      | Planet level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: "Building level (Took blasts of electricity from many electric Pok\xE9mon\
      \ and survived a point-blank explosion) | Small City level (Pikachu was hit\
      \ by one of Brock's attacks but was merely irritated, other Pok\xE9mon have\
      \ much more experience) | Island level (Capable of taking hits from Blue / Green's\
      \ team, who are considered equals to Red's Pok\xE9mon) | Island level | Planet\
      \ level"
    source_ids:
    - vsbattles-red-pok-mon-adventures-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: "Athletic (Have become exceedingly more conditioned from Blue's short training\
      \ and years of fighting) | Superhuman (Team members like Saur and Poli fought\
      \ several dozens of Pok\xE9mon without healing or resting) | Superhuman for\
      \ Mewtwo."
    source_ids:
    - vsbattles-red-pok-mon-adventures-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: "Standard Melee Range | Standard Melee Range, Hundreds of Meters on the\
      \ Pok\xE9mon and Move | Standard Melee Range, Tens of Kilometers on the Pok\xE9\
      mon and Move | Standard Melee Range, Tens of Kilometers depending on the Pok\xE9\
      mon and Move | Standard Melee Range, up to Planetary for Mewtwo."
    source_ids:
    - vsbattles-red-pok-mon-adventures-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Above Average (Capable of strategizing under bad conditions, capable of\
      \ beating the first couple gym leaders) | Genius about Pok\xE9mon battling (Used\
      \ physics and artificially created a thunderstorm mid-battle to become the champion\
      \ of Kanto, has grown progressively since then) Feats: * Defeating Blue in the\
      \ League fight, who was notably exceedingly stronger, by a combination of Physics\
      \ and creating a thunderstorm. (Intelligence Feat) * Made a plan in the middle\
      \ of being tortured by Lt. Surge to beat him (Intelligence Feat) * Considering\
      \ to be a massive threat to the Elite Four (Intelligence + Power Feat) * Climbing\
      \ up Mt. Silver even with Frostbite (Stamina Feat) * Can read the emotions of\
      \ Pok\xE9mon from their actions (Intelligence Feat) * Defeats Bruno of the Elite\
      \ Four on his own Note: In Pok\xE9mon Adventures, the Elite Four are ridiculously\
      \ overpowered in comparison to other media counterparts. (Intelligence Feat)\
      \ * Outsmarted Mewtwo and managed to capture him with Pika (Intelligence Feat)\
      \ * Is respected by Giovanni to the point that he believes that putting Red's\
      \ DNA in Organism No.2 would make it unstoppable. (Intelligence Feat)"
    source_ids:
    - vsbattles-red-pok-mon-adventures-unknown
    confidence: 0.6
    notes: auto_repair source extraction
