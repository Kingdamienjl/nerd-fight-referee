    - field: weaknesses
      value: 'She cannot disperse when her body is covered in oil or presumably other
        thick liquids (She remains in paper form but cannot separate). While she has
        shown some resistance to it, a fire could probably pose a threat to her. Notable
        Attacks/Techniques: *Shikigami no Mai (Dance of the Shikigami): Using her
        great origami and ninjutsu skills, Konan can turn her body into numerous sheets
        of paper. She can control every part of her body at will; making such forms
        as weapons for attack, butterflies for spying, paper airplanes for quick transport,
        or covering her enemy in sheets of paper to restrict and asphyxiate them.
        She can also hide exploding tags amongst her papers for a deadly surprise.
        She can casually fly and hover in her paper form. Her occasional wings are
        little more than a decoration. *Paper Rain Technique: After forming large
        wings made of paper, Konan will take to the sky and fire a storm of many sharp
        kunai-like paper blades down upon a target. *Kami Bunshin (Paper Clone): By
        taking advantage of her ability to manipulate paper, Konan can create a duplicate
        of herself from her own chakra-infused layer that can be controlled remotely.
        *Kami Shuriken (Paper Shuriken): By transferring her chakra into a sheet of
        paper, Konan can alter both the hardness and sharpness of the material, often
        forming it into the shape of a shuriken. *Paper Chakram: This technique is
        formed by combining a large number of paper sheets into a solid, sharp ring.
        The chakram is in turn thrown like a disk, spinning rapidly towards its target.
        *Kami no Shisha no Jutsu (Paper Person of God Technique): After an unknown
        amount of prep, Konan can create a massive amount of paper, consisting of
        roughly 600 billion explosive tags. She can disguise them as part of the terrain
        and wait until her enemies are caught inside the trap. In an instant, she
        can unravel the guise and detonate the exploding tags for 10 minutes of non-stop
        explosions. Her bombardment was so strong that it covered the entire area
        and also split a nearby large body of water. It''s arguable whether she can
        make all 600 billion paper tags explode at the same time. Category:Tier 7
        Category:Slappyjoe056'
      source_id: character-stats-profiles-konan
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
