  attack_potency:
    text: Country level (Fought with Inuarashi and Nekomamushi interchangeably for
      5 days straight, being described as an unbeatable monster.One Piece Vol. 81
      Chapter 810 Was considered to be powerful by Kiku.One Piece Vol. 91 Chapter
      917 Equally matched Ashura Doji in combat even after being slashed off-guard
      moments earlier.One Piece Vol. 91 Chapter 921 His strength was so great that
      he was recognized by Kaidou and handpicked to be All-Star.One Piece Vol. 98
      Chapter 991 This should make him far superior to any other Beast Pirate except
      for King and Queen17.25 Teratons), higher in Zoan Forms (Was trusted to retrieve
      Doflamingo from captivity and managed to take out two out of the four ships
      commanded by Tsuru, Fujitora, and Sengoku before being defeated.One Piece Vol.
      80 Chapter 806 While dealing with seawater floods for several hours, he managed
      to push Inuarashi back and force him to recover his energy until the next day.One
      Piece Vol. 81 Chapter 809 One-shotted dozens Sulong Minks with a single swing
      of his trunk and defeated the rest of the army.One Piece Vol. 98 Chapter 990
      Was prepared to fight all of the injured Scabbards by himselfOne Piece Vol.
      100 Chapter 1005 despite being on the brink of death. Inuarashi admitted to
      only being capable of holding him back to buy time for the other Scabbards to
