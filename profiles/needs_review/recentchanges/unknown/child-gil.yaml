    - field: intelligence
      value: Child-Gil lacks the conceit and arrogance of his older self. As a result,
        he is far more willing to go all out at the beginning of a fight and uses
        his weaponry in creative ways that his older self never did. This is particularly
        showcased in his use of Enkidu, trapping his foes in a ball of chains before
        attempting to skewer them and stealing weapons from Angelica's Gate of Babylon
        before throwing them at her. He is also far more willing to use Sha Naqba
        Imuru, fully utilizing the foresight granted by it to consistently outmaneuver
        his foes and produce a favorable outcome. However, while he's not blinded
        by his arrogance like his older counterpart, he is somewhat playful and carefree
        at times, which could lead to brief lapses in judgment against a seemingly
        harmless foe. Nevertheless, he'll get serious in an instant should he deem
        it necessary. In addition, he is aware of his limits, and if an opponent is
        too powerful for him to defeat, he can shift back into his older incarnation
        to win.
      source_id: vsbattles-child-gil-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
