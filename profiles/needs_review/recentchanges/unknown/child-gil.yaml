power_scale:
  tier:
    text: High 6-C, High 6-C to Low 6-B with Gate of Babylon, at least Low 6-B with
      Enuma Elish, 1-C with Full Power Enuma Elish
    source_ids: &id002
    - mediawiki-327548
    confidence: 0.8
  attack_potency:
    text: Large Island level+ (Comparable to other Servants, such as EMIYA, though
      weaker than his adult self. Is able to temporarily restrain Angelica when she
      was using his card), Large Island level+ to Small Country level with Gate of
      Babylon (Should be comparable to his older self's, which was able to easily
      kill Heracles and easily shatter Medea's barriers, which are stated to be as
      strong as Heracles body, like glass. When used by his darkened self, they were
      capable of easily piercing through Bazett's enhanced defense, which has allowed
      her to tank all of Illya and Kuro's attacks including the latter's Triple Linked
      Crane Wing), Small Country level with Enuma Elish (Weaker than his adult self's
      but not incomparable, and Angelica used it to destroy Shirou's Reality Marble),
      Complex Multiverse level with full power Enuma Elish (An Anti-World Noble Phantasm
      and "planet-creating weapon", stated to be capable of destroying the target
      along with the World, and had Enkidu not intervened in Fate/strange Fake, it
      would have destroyed the World. This would all include Avalon, residing in the
      core of the planet, which is a 6-dimensional realmFate/Side Material and Fate/Grand
      Order Material I6-D).
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Relativistic+ with FTL reactions and combat speed (Should be comparable
      to other Servants, such as Saber and his adult self)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class M (Comparable to Martha who stopped a speeding train, Achilles who
      stopped a rolling 300 ton jumbo jet, Asterios who swam carrying the 100-150
      ton Golden Hind galleon ship while injured, and Jeanne who can spin an entire
      airplane2,604.949 Metric Tons)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Large Island level+ (Comparable to his Attack Power), Large Island level+
      to Small Country level with Gate of Babylon (Comparable to his Attack Power)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Large Island level+ (Managed to tank numerous attacks from Angelica, who
      had access to all of the major Noble Phantasms in his treasury), Small Country
      level with Enkidu and Shield of the Gods (when using it as a defense, it allowed
      him to defend against Mjolnir which had easily destroyed five of Illya's A-rank
      magic gates when using Caster's Card Install. Tanked Kuro's Excalibur that was
      traced and projected as a Broken Phantasm)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Servants can fight for an entire day without tiring and continue
      fighting for as long as they have sufficient mana. Managed to keep fighting
      and even laughed off the moderate injuries dealt to him by Angelica before getting
      serious and turning the tables on her)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Extended Melee Range, at least Hundreds of Meters with Gate of Babylon,
      Kilometers (Shattered Shirou's Reality Marble) to Complex Multiversal with Enuma
      Elish (Destroyed the Mirror World and can destroy the World6-D)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Child-Gil lacks the conceit and arrogance of his older self. As a result,
      he is far more willing to go all out at the beginning of a fight and uses his
      weaponry in creative ways that his older self never did. This is particularly
      showcased in his use of Enkidu, trapping his foes in a ball of chains before
      attempting to skewer them and stealing weapons from Angelica's Gate of Babylon
      before throwing them at her. He is also far more willing to use Sha Naqba Imuru,
      fully utilizing the foresight granted by it to consistently outmaneuver his
      foes and produce a favorable outcome. However, while he's not blinded by his
      arrogance like his older counterpart, he is somewhat playful and carefree at
      times, which could lead to brief lapses in judgment against a seemingly harmless
      foe. Nevertheless, he'll get serious in an instant should he deem it necessary.
      In addition, he is aware of his limits, and if an opponent is too powerful for
      him to defeat, he can shift back into his older incarnation to win.
    source_ids: *id002
    confidence: 0.8
