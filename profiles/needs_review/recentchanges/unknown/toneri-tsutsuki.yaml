        \ Tenseigan Chakra Mode: All previous abilities enhanced, Flight, Telekinesis,\
        \ Air Manipulation, Fire Manipulation, Water Manipulation, Earth Manipulation,\
        \ Electricity Manipulation, Gravity Manipulation (Can control attractive and\
        \ repulsive forces to a limited extent), Matter Manipulation and Deconstruction\
