    - field: intelligence
      value: Gifted normally, Extraordinary Genius with Chakra understanding and manipulation
        Toneri is very knowledgeable, given his advanced understanding of his clan,
        its culture, as well as its ultimate treasure and weapon. He also has enough
        medical knowledge to transplant eyes and treat severe injuries. Should possess
