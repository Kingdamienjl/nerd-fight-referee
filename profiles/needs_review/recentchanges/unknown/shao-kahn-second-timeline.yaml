- id: claim-weaknesses-b62e237b
  section: weaknesses
  axis: weakness
  text: 'Shao Kahn is prone to bragging, humiliating and mocking his opponents, but
    sometimes he may simply set these aside to kill them personally. Notable Attacks/Techniques:
    *Soul Manipulation: Shao Kahn is a master of soul magic, being superior to the
    likes of Shang Tsung and Quan Chi. He can consume souls to replenish his life
    force and increase his power, killing the affected in the process and causing
    their body to vanish. **Fusionism: By fusing souls, he can create life forms that
    wield immense power over telekinesis due to the large amount of soul essence bound
    together. **Energy Manipulation: The energy Shao Kahn generates is likely the
    same kind that Shang Tsung uses: soul energy. He can use it to increase the power
    behind his attacks, amplify his speed, propel himself and his weapons should it
    be required and create energy constructs in battle. He can also fire searing energy
    beams and orbs from his hands and eyes. ***Weapon Creation: Shao Kahn can create
    energy spears for him to hurl at opponents and shields made of energy that can
    block and reflect attacks to its source. *Telekinesis: With a gesture or motion
    of his hand, Shao Kahn can freely move his opponents with the power of telekinesis.
    He can push opponents away from him with a telekinetic blast and treat them like
    rag dolls before slamming them away using his psychic power. *Regeneration: While
    it isn''t reliable in combat due to its long duration, it''s still worth mentioning.
    Shao Kahn was able to heal a hole through his chest, but the process is extremely
    slow and requires outside help from a sorcerer proficient in healing magic. *Summoning:
    Shao Kahn can summon a plethora of items and beings that are very useful to him.
    **Shadow Priest: A Shadow Priest is an Outworld sorcerer clad in black robes and
    they''re capable of magic such as resurrection, clairvoyance and weapon enchantment.
    **Wrath Hammer: The signature weapon of Outworld''s mighty emperor. It is a large
    warhammer with a handle that is half the height of its wielder connected to a
    heavy metal head with a face adorned with rows of pyramid-shaped tenderizers that
    makes the flesh that it hits softer for gorier results. It is far larger than
    any maul known to man, and its mass makes it too heavy for two superhuman soldiers
    to lift it. Only Shao Kahn can wield this weapon like a broken twig. **Lance of
    the Great Kahn: His secondary weapon. This six foot long spear can be summoned
    like his primary weapon anytime he wants. He can throw this spear with enough
    strength to pin down opponents and break the sound barrier with it. **Portals:
    Normally used to enter realms after winning the right to invade it. He can create
    small, green personal portals to teleport between the realms without needing to
    go there by foot. *Face Smash: Shao thrusts the butt end of his hammer at the
    opponent''s face. **DIE: Following the initial attack, Shao backhands the opponent
    and summons his spear which he uses to impale them on. He drops them down and
    brutally stabs them thrice before kicking them away. **Takeover: This combo adds
    two simple but savage hits from a front kick and a double axe handle. *Hammer
    Slam: Shao swings his hammer at the opponent. **You Will Die: He then converts
    the first swing into a lower swing, tripping the opponent into the air. He then
    punches them away. **Die By My Hands: This combo adds two more swings, starting
    with Dragon Toe to a two handed Rage Strike. *Tenderizer: Shao rushes forward
    and stabs the butt of his hammer into the opponent''s gut. *Rage Strike: Shao
    turns to his back, spinning around to swing his hammer with one arm. **Bow To
    Me: After Rage Strike, Shao unleashes an uppercut and strikes with his hammer,
    holding it vertically. **Fear Me: Adds a second hit to the combo where he simply
    drops the hammer on his opponent. *Dragon Toe: Shao rushes forward, swinging his
    hammer close to the floor in a rising arc. *Knee Shatter: While crouched, Shao
    thrusts the butt of the hammer at the opponent''s knees. *Hammer Slammer: Shao
    swings low with his hammer, tripping his opponent. *Breaking Dragon Claw: After
    hopping up, Shao brings his energy infused hammer down to the ground. *Deadly
    Swipe: When recovering from knockdowns/successfully blocking an attack, Shao counters
    by swinging his hammer low while in a crouched state. *Fatal Warning: When recovering
    from knockdowns/successfully blocking an attack, Shao counters by swinging his
    hammer up, launching nearby opponents. *Last Breath: Shao does a side kick and
    stomps forward, crushing the opponent''s knee. He grabs their shoulder and presses
    them over his head before breaking their back on his shoulders. *Merciless Spear:
    Shao summons his lance and hurls it towards the opponent, impaling them on it.
    *Scum Grab: Shao grabs an airborne opponent by the neck and throws them to the
    floor. **Once the opponent is downed, he may choose to slam his hammer on them.
    *Shoulder Charge: Shao performs a powerful shoulder charge imbued with green magic.
    *'
