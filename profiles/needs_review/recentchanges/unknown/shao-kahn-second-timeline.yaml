    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Martial Arts (Despite being known
        as a brutish fighter, Shao Kahn seems to have some form of footwork while
        fighting with his hammer, implying that he has a degree of fighting skills.
        Also uses wrestling techniques), Weapon Mastery (Skilled in wielding his hammer
        and spear), Acrobatics (Can leap forward for several meters), Magic (Implied
        to have great knowledge on sorcery, including Skarlet's blood magik, but he
        isn't seen using them as he usually prefers hand-to-hand combat), Longevity
        (Outworlders have naturally long lifespans), Regeneration (Low-Mid over time.
        Healed from Liu Kang's fist going through his chest but needed Quan Chi to
        accelerate his recovery), Can interact with his past self, but will share
        with it irreparable damage and death (As shown throughout MK11), Social Influencing,
        Energy Manipulation (Most of his attacks possess a green colored aura, which
        is the magic that he uses to boost the move speed of his attacks [and in turn
        increase their impact]. He can also shoot scorching, energy beams from his
        hands), Soul Manipulation (Shao Kahn is an unparalleled master of soul magic,
        even the likes of Shang Tsung hoped to surpass his emperor's magic with his
        own. Besides draining and consuming many souls at once while receiving their
        benefits (bonus strength, memories/knowledge, health replenishment, etc.),
        he can fuse the souls of others to create a singular being that's under his
        control), Weapon Creation (Can create energy spears out of thin air), Weapon
        Control (Can summon the Wrath Hammer out of thin air. As of MK11, he summons
        his spear [which is now a physical weapon] rather than creating it), Summoning
        (Can summon his Dark Priests to enchant his weapon and assist him in kombat),
        Telekinesis (Likely a side effect of him gaining so much souls, Shao Kahn
        has the ability to manipulate opponents and objects from a short distance),
        Portal Creation (After claiming his right to merge realms via winning ten
        MK tournaments or simply breaking their rules, he may summon a green portal
        to travel to the realm that he wishes to claim. Also uses it to summon the
        bones and skulls of his enemies, simply for the heck of it), Power Bestowal
        (Responsible for giving Skarlet her powers and strengthening Sindel with Shang
        Tsung's souls, while giving her the ability to drain souls as a side effect),
        Resistance to Soul Manipulation and Mind Manipulation (Trapped inside him
        are the many souls that he has consumed, likely numbering in the millions
        or billions. Ermac, who has a larger amount of souls in him, was able to resist
        Takeda's attempts to read his mind due to the latter being unable to telepathically
        read all of them at once, so Shao Kahn should scale to this feat)
