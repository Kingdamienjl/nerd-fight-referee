- id: claim-weaknesses-a30ba0e5
  section: weaknesses
  axis: weakness
  text: "The Soldier is truly insane and paranoid, leading to his illogical actions\
    \ and volatile personality (i.e. \"I have done nothing but teleport bread for\
    \ three days.\" and his extreme security measures as shown in the WAR! comic).\
    \ He must hurt himself in order to Rocket Jump. His Rocket Launchers have a long\
    \ reload time. He must take or deal a certain amount of damage in order to activate\
    \ his bugles' effects. Using the Escape Plan makes him more vulnerable to damage\
    \ and his Equalizer deals damage based on how much health he has left. ==Gallery==\
    \ Meet the Soldier ==Notable Matchups== Victories: *Spy (Team Fortress 2) Spy's\
    \ Profile (Robot War Spy and Soldier were used, Soldier had Black Box, Concheror,\
    \ and Disciplinary Actionboth, Spy had L\u2019Etranger and Cloak and Dagger, stock\
