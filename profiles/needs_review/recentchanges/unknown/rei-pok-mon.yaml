        \ swaps a Pok\xE9mon's offensive stats with their defensive ones. * Smoke\
        \ Bomb: A bomb of smoke that produces a cloud of fine powder that reduces\
        \ visibility in the area. * Scatter Bang: A bag of trapped air that produces\
