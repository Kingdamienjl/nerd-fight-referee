- id: claim-powers-and-abilities-e8be6bc0
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Supernatural Willpower, Aura (Shown\
    \ here), Damage Reduction (Akari implies that Galaxy Team uniforms are made to\
    \ withstand attacks from Pok\xE9monMission 1: In an Unfamiliar Land), Acrobatics\
    \ (Galaxy Team members can dodge wild Pok\xE9mons' attacks, which includes doing\
    \ thisMission 4: Getting to Work on Research Tasks), Hammerspace via Survey Corps\
    \ satchels, minor Information Analysis via the Pok\xE9dex, limited Earth Manipulation\
    \ via Arc Phone (Caused the Lake Trio's caves to open up), Sealing via Pok\xE9\
    \ Balls, Supernatural Luck via Tempting Charms, Empowerment via Survival Charms,\
    \ Self-Purification via Warding Charms, Purification via Berries, Full Heals,\
    \ and Jubilife Muffins, Stealth Mastery via Stealth Spray and Smoke Bombs (Both\
    \ of these can hide him from the Enhanced Senses of \"even the scardiest wild\
    \ Pok\xE9mon\"), Smoke Manipulation via Smoke Bombs, Sound Manipulation via Scatter\
    \ Bangs, Can give to his Pok\xE9mon: Healing via Potions and Revives, Accelerated\
    \ Development via EXP Candies and Rare Candies, Awakened Power via Grit items,\
    \ Statistics Amplification via Aux items and Twice-Spiced Radish, Power Modification\
    \ via Swap Snacks | Superhuman Physical Characteristics, Enhanced Senses, Non-Physical\
    \ Interaction, Resistance to Sound Manipulation (Far superior to wild Pok\xE9\
    mon who are immune to Scatter Bangs) [All], plus all the abilities of every Pok\xE9\
    mon in the Hisui Pok\xE9dex"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
