  section: weaknesses
  axis: weakness
  text: "Has lost his memories up to being sent to Hisui. Note: Please do not scale\
    \ Postgame Rei's team directly to Arceus, as while they fought, this was a means\
    \ of testing Rei's willpower and skill. Rei could do no real damage to Arceus\
    \ even by reducing his HP to 0, until their rematch in Eternal Battle Reverie.\
    \ ==Gallery== Together in an Unknown Land.jpg Pasio Academy.jpg Friends in Hisui.jpg\
