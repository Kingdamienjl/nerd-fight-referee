    - field: intelligence
      value: "Genius; While initially disoriented due to the loss of his memories\
        \ and being thrust into Hisui, Rei quickly proved he was a natural in battling\
        \ and before long could defeat just about everyone in Galaxy Team, including\
        \ the leaders of each Corps and eventually Commander Kamado himself; moving\
        \ beyond the limits of the team and taking on even Legendary Pok\xE9mon like\
        \ Dialga and Palkia. He can also craft anything he possesses the recipe for,\
        \ even out of raw ingredients like chunks of iron, certain plants, and chunks\
        \ of rock; and has enough recipes that he can craft practically any part of\
        \ his Standard Equipment on the fly. This would require skills like woodcarving,\
