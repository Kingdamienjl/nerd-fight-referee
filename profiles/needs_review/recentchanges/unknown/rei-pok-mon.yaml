- id: claim-standard-equipment-f88e329f
  section: equipment
  axis: equipment
  text: "* Potions: Potions can heal a Pok\xE9mon\u2019s HP, or stamina, during battle.\
    \ The type of Potion correlates to how much HP will be restored, from 20 HP to\
    \ all of it. * Full Heal: A spray that heals any and all status conditions a Pok\xE9\
    mon has. * Jubilife Muffin: An underrated muffin in Jubilife Village that heals\
    \ any and all status conditions a Pok\xE9mon has. * Revive: Items that can revive\
    \ a fainted Pok\xE9mon, with half of their health back. Max Revives restore the\
    \ Pok\xE9mon back to perfect condition. * Stealth Spray: Muffles the sound of\
    \ Rei's footsteps, making people less likely to notice him. * Grit items: Various\
    \ pieces of sediment that can raise the effort levels of his Pok\xE9mon, making\
    \ them stronger. * Aux Power: An item that boosts the Attack of a Pok\xE9mon during\
    \ battle. * Aux Guard: An item that boosts the Defense of a Pok\xE9mon during\
    \ battle. * Aux Powerguard: An item that boosts both the Attack and Defense of\
    \ a Pok\xE9mon during battle. * Aux Evasion: An item that makes a Pok\xE9mon harder\
    \ to hit during battle. * Dire Hit: An item that boosts the Critical Hit ratio\
    \ of a Pok\xE9mon during battle. * Twice-Spiced Radish: A pickled vegetable that\
    \ primes a Pok\xE9mon for battle, allowing them to take a hard-hitting stance\
    \ which boosts their power by 50 percent.\"These pickled vegetables prime a Pok\xE9\
    mon for battle. The Pok\xE9mon takes a hard-hitting stance, which boosts the power\
    \ of the Pok\xE9mon's moves by 50 percent.\" * Swap Snack: A snack that temporarily\
    \ swaps a Pok\xE9mon's offensive stats with their defensive ones. * Smoke Bomb:\
    \ A bomb of smoke that produces a cloud of fine powder that reduces visibility\
    \ in the area. * Scatter Bang: A bag of trapped air that produces a loud noise\
    \ when thrown."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
