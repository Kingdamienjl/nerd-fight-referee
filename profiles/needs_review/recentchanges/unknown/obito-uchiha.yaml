      \ characteristics and attributes of chakra to water, and so on. There are different\
      \ relationship between natures. For example, Water Style counters Fire Style,\
      \ and Fire Style counters Wind Style. These changes in Chakra Nature are the\
      \ foundation of all elemental Ninjutsu, their creation, and development. In\
      \ addition to the five basic changes in chakra nature, there also exists Yin\
      \ Style and Yang Style. Yin Style is primarily based on mental energies, and\
      \ can be used to create form out of naught. It is the basis for many sub-categories\
      \ and techniques, such as Genjutsu and Hiden like the Nara clan's Shadow Possession\
      \ Jutsu. On the other hand, Yang Style is predicated on the user's physical\
      \ energies, and can infuse life into a life-less form. Examples of Yang Style\
      \ include the Akimichi clan's Multi-Size techniques. Usually Chakra Natures\
      \ are used individually and separately, when performing Fire Style one only\
      \ taps into the Fire Chakra Nature. However, it is possible to activate multiple\
      \ Chakra Natures simultaneously which results in an entirely new Chakra Nature.\
      \ For example, Obito can use Wood Style by activating both Water and Earth Chakra\
      \ Natures at the same time. These new natures are classified as Kekkei Genkai.\
      \ *{{Nihongo|Fire Style||Katon}}: One of the fundamental elemental nature transformations.\
      \ It is performed by molding superheated chakra inside the stomach before releasing\
      \ it via the lungs and mouth. There are also variants to this in some mediums,\
      \ such as gun powder, explosive tags, and chakra flow into a weapon. The produced\
      \ flames carry the properties of real flames, producing scorching heat, and\
      \ burning whatever they touch to ash. Concentrated chakra can also inherently\
      \ produce great heat, enough to burn someone from the inside out or carve through\
      \ iron. Katon1.jpeg Katon2.jpeg *{{Nihongo|Lightning Style||Raiton}}: One of\
      \ the basic elemental nature transformation techniques that allow the user to\
      \ generate lightning by increasing the high-frequency vibrations of their chakra,\
      \ allowing for piercing damage and fast movement. The electricity also can paralyze\
      \ the target. While uncommon, lightning can be infused into bladed weapons in\
      \ a way similar to Wind Style through chakra flow for increased piercing power\
      \ through vibrations, with the added effect of inducing numbness. center|400px\
      \ center|400px center|400px * {{Nihongo|Water Style||Suiton}}: One of the basic\
