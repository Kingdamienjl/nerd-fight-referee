        \ |- |- | |-|Nature Transformation={{Border|Scroll=Yes|Visible=No|Content=\
        \ {{Nihongo|Nature Transformation||Seishitsu Henka}}: At the core of Ninjutsu\
        \ is the Great Changes in [Chakra] Nature. Fundamentally, there are five Chakra\
        \ Natures. Fire, Wind, Water, Earth and Lightning. Fire results in Fire Style,\
        \ changing the characteristics and attributes of chakra to fire. Water results\
        \ in Water Style, changing the characteristics and attributes of chakra to\
        \ water, and so on. There are different relationship between natures. For\
        \ example, Water Style counters Fire Style, and Fire Style counters Wind Style.\
        \ These changes in Chakra Nature are the foundation of all elemental Ninjutsu,\
        \ their creation, and development. In addition to the five basic changes in\
        \ chakra nature, there also exists Yin Style and Yang Style. Yin Style is\
        \ primarily based on mental energies, and can be used to create form out of\
        \ naught. It is the basis for many sub-categories and techniques, such as\
        \ Genjutsu and Hiden like the Nara clan's Shadow Possession Jutsu. On the\
        \ other hand, Yang Style is predicated on the user's physical energies, and\
        \ can infuse life into a life-less form. Examples of Yang Style include the\
        \ Akimichi clan's Multi-Size techniques. Usually Chakra Natures are used individually\
        \ and separately, when performing Fire Style one only taps into the Fire Chakra\
        \ Nature. However, it is possible to activate multiple Chakra Natures simultaneously\
        \ which results in an entirely new Chakra Nature. For example, Obito can use\
        \ Wood Style by activating both Water and Earth Chakra Natures at the same\
        \ time. These new natures are classified as Kekkei Genkai. *{{Nihongo|Fire\
        \ Style||Katon}}: One of the fundamental elemental nature transformations.\
        \ It is performed by molding superheated chakra inside the stomach before\
        \ releasing it via the lungs and mouth. There are also variants to this in\
        \ some mediums, such as gun powder, explosive tags, and chakra flow into a\
        \ weapon. The produced flames carry the properties of real flames, producing\
        \ scorching heat, and burning whatever they touch to ash. Concentrated chakra\
        \ can also inherently produce great heat, enough to burn someone from the\
        \ inside out or carve through iron. Katon1.jpeg Katon2.jpeg *{{Nihongo|Lightning\
        \ Style||Raiton}}: One of the basic elemental nature transformation techniques\
        \ that allow the user to generate lightning by increasing the high-frequency\
        \ vibrations of their chakra, allowing for piercing damage and fast movement.\
        \ The electricity also can paralyze the target. While uncommon, lightning\
        \ can be infused into bladed weapons in a way similar to Wind Style through\
        \ chakra flow for increased piercing power through vibrations, with the added\
        \ effect of inducing numbness. center|400px center|400px center|400px * {{Nihongo|Water\
        \ Style||Suiton}}: One of the basic elemental nature transformation techniques\
        \ and allows the user to manipulate and shape surrounding water or create\
        \ water without a source, such as projecting it from the mouth. This chakra\
        \ nature becomes far more powerful if the user has a large water source near\
        \ them, as it will both save them some chakra and increase the volume of water\
        \ at their disposal. Suiton1.jpeg Suiton2.jpeg *{{Nihongo|Earth Style||Doton}}:\
        \ One of the basic elemental nature transformations. With Earth Style, the\
        \ user can manipulate the very earth, altering its shape, size, and density.\
        \ This power can be used to either increase the hardness of something in order\
        \ to boost its durability, or to make something far more pliable and easy\
        \ to pass through. The former can be demonstrated with techniques like the\
        \ Iron Spear and the latter with techniques such as the Hidden Mole Jutsu.\
        \ Earth Style jutsu can also simply allow the user to manipulate the surrounding\
        \ terrain as they see fit. It allows for the manipulation and generation of\
        \ rocks, clay, earth, soil, and everything in between. Doton2.jpeg Doton3.jpeg\
