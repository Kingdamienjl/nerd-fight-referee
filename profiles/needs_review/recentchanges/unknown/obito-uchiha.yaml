  text: "The Sharingan's ability to copy Ninjutsu, Genjutsu, and Taijutsu is limited\
    \ by the user's physical condition, that is to say that the user needs to be physically\
    \ capable of performing the technique they are trying to replicate. They need\
    \ to meet any physical or chakra amount prerequisites the technique in question\
    \ may have. This ability is also incapable of replicating Kekkei Genkai, due to\
    \ either not possessing the genetic predisposition and/or having the necessary\
    \ chakra natures. Naturally, the user also needs to actually see the technique\
    \ they are attempting to copy, meaning they cannot copy something they did not\
    \ see or is obscured from their line of sight. In fact, the same can be said for\
    \ essentially all of the Sharingan's abilities; they are sight based abilities,\
    \ so if the opponent can obscure the user's vision using extremely thick mist/dust\
    \ or blind them, the Sharingan's abilities will be rendered useless. Likewise\
    \ if the opponent is too fast for the Sharingan to visually keep track of them,\
    \ they will be safe from its abilities. Sharingan Genjutsu requires eye contact,\
    \ so if the opponent is able to avoid eye contact or is blind, they will be able\
    \ to avoid Sharingan Genjutsu entirely. Finally, the Sharingan's predictive capabilities\
    \ can be somewhat circumvented by attacks that have little to no pattern, such\
    \ as Naruto's chakra arms that emerge from any part of his body and attack instinctively.\
    \ Kamui's user can't perform physical attacks or teleport while this ability is\
    \ active, and must deactivate it to do so. The user's ability to teleport objects\
    \ to the Kamui dimension is faster than their ability to transport themselves.\
    \ Additionally, this ability can only be used continuously for 5 minutes, after\
    \ which there is a short recharge period. Initially lacked control of the J\u016B\
    bi, but later gained control over its powers. Additionally, J\u016Bbi Jinch\u016B\
    riki are weak against Nature Energy which can bypass their invulnerability. Feats:\
