        \ If his intangibility is active, he cannot teleport. In the brief instant\
        \ where he solidifies and when he teleports, he is vulnerable to attack. |\
        \ He lacks control over the J\u016Bbi. | He is vulnerable to Senjutsu attacks.\
        \ Notable Attacks/Techniques: Hide/Show Katon (Fire Release): One of the basic\
        \ elemental nature transformations. It is performed by molding superheated\
        \ chakra inside the stomach before releasing it via the lungs and mouth. Fire\
        \ jutsu are usually mid-range and can cover a wide area. The force of the\
        \ fire chakra is similar to an explosion, as it can carve craters into rock.\
        \ There are also variants to this in some mediums, such as the use of gunpowder,\
        \ explosive tags, and chakra flow into a weapon. *Katon: Bakufu Ranbu (Fire\
        \ Release: Blast Wave Wild Dance): A technique where chakra kneaded inside\
        \ the body is converted into fire and then expelled from the mouth in a continuous\
        \ stream of flames, which spirals outwards, creating a massive fire vortex.\
        \ If needed, the distorting effects of Kamui can be used to aid the formation\
        \ of the vortex. Mokuton (Wood Release): An advanced nature kekkei genkai\
        \ formed through simultaneously combining earth-based chakra nature in one\
        \ hand and water-based in the other. The Wood Release can create trees or\
        \ various plants from simple seeds or even flowering plants and manipulate\
        \ vegetation. They can also produce plants from any surface, including the\
        \ user's body, as the user's chakra is converted into a source of life. *Mokuton:\
        \ Sashiki no Jutsu (Wood Release: Cutting Technique): A versatile technique\
        \ where the user can produce sharp wooden spikes from their body to either\
        \ fashion short-range weapons akin to a makeshift sword, or else use them\
        \ as long-range projectiles, where the branches' growth can be triggered remotely,\
        \ skewering the enemy as a result. *Wood Release: Underground Roots Technique:\
        \ Using the Wood Release, a user can manipulate the terrain, bringing out\
        \ underground roots of varying sizes to fit various offensive situations,\
        \ such as using the roots for trickery, misdirection, and restriction. One\
        \ can also use a large-scale version, bringing out massive roots over a large\
        \ area that tangle around each other with such force that any one caught in-between\
        \ is violently crushed to death. Sharingan (Mirror Wheel Eye): The Sharingan\
        \ is a d\u014Djutsu kekkei genkai, which appears in some members of the Uchiha\
        \ clan. The Sharingan's abilities consist of two parts: the \"Eye of Insight\"\
        \ (D\u014Dsatsugan) and the \"Eye of Hypnotism\" (Saimingan). The first of\
        \ the Sharingan's powers is being able to see chakra flow. The Sharingan itself\
        \ gives color to chakra, allowing the wielder to differentiate them. They\
        \ can also tell if a person is under an illusion because their chakra flow\
        \ would be irregular. Sharingan's second-most prominent ability grants the\
        \ user an incredible clarity of perception, allowing them to easily recognize\
        \ illusion and different chakra forms, though not to the same extent as the\
        \ Byakugan. This also allows the user to pick up on subtle details, enabling\
        \ them to read lips or mimic body movements. As the Sharingan evolves, gaining\
        \ more tomoe, this ability extends further. At this point, they can track\
        \ fast-moving objects and accurately predicts the target's action, creating\
        \ an image of the attacker's next move from the slightest muscle tension in\
        \ their body and counter-attack or dodge efficiently. Sharingan's third and\
        \ most well-known ability is that it grants the user the ability to copy almost\
        \ any technique they witness, apart from other kekkei genkai techniques. The\
        \ user can memorize ninjutsu, genjutsu, and taijutsu with near-perfect accuracy,\
        \ allowing them to use the techniques as their own or even modify them to\
        \ create new techniques. However, to reproduce a copied method, one must have\
        \ the necessary skill or ability to perform them. In addition to physical\
        \ power and kekkei genkai techniques, the Sharingan cannot reproduce moves\
        \ dependent on other factors, such as summons that the user has not signed\
        \ a contract with. Sharingan's final commonly-used ability can induce a unique\
        \ brand of hypnosis that involves suggesting actions and thoughts to the opponent\
        \ through simple eye contact. Moreover, advanced Sharingan users can take\
        \ the hypnosis ability even further. For example, they can control powerful\
        \ summoned animals or even tailed beasts. Similarly, one can enter a jinch\u016B\
        riki's subconscious to suppress the tailed beast's chakra effectively. *Genjutsu:\
        \ Sharingan: It is merely the general use of genjutsu as employed by Sharingan\
        \ wielders. By establishing direct eye contact with the intended opponents,\
        \ the user can lock them within a genjutsu of their choosing to achieve various\
        \ effects. These effects range from inducing instantaneous, but temporary,\
        \ paralysis or unconsciousness in an opponent to forcefully extracting any\
        \ valuable information that they possess or controlling their actions. *Izanag"
