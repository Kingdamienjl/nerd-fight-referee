    - field: weaknesses
      value: "Nature Transformation: Like his tailed beast, R\u014Dshi was able to\
        \ use the Lava Release kekkei genkai, allowing him to simultaneously use fire\
        \ and earth-based chakra to create a torrent of lava that can melt almost\
        \ anything. In the anime, Tobi referred to him as \"R\u014Dshi of the Lava\
        \ Release\" (\u7194\u9041\u306E\u8001\u7D2B, Y\u014Dton no R\u014Dshi), further\
        \ indicating his prowess with it. He could spit multiple molten rocks at the\
        \ enemy. He could also create an armor made of lava that not only has defensive\
        \ purposes but adds lava to his taijutsu attacks, increasing their potential\
        \ damage., Lava Release Chakra Mode: R\u014Dshi envelops his entire body in\
        \ a coating of lava that enhances the damage of his physical attacks. Due\
        \ to the extreme heat generated by the lava, he is capable of burning the\
        \ target without coming into direct contact with him. In addition to the offensive\
        \ damage the armor can inflict, it can also be used for defensive purposes,\
        \ as it acts as a deterrent towards those who wish to attack the user physically.\
        \ centre, Lava Release: Scorching Armored Fist: R\u014Dshi coats himself in\
        \ lava and punches the opponent. Even if the punch fails to connect, the intense\
        \ heat from the lava can still burn his opponent if they're close enough.,\
        \ Lava Release: Scorching Stream Rock Technique: The user expels a large amount\
        \ of lava from their mouth, which quickly solidifies into multiple boulders\
        \ of molten rock that are fired towards the target with tremendous force.\
        \ Due to their composition, the boulders can melt through most objects with\
        \ ease, and because a considerable number are dispersed over a wide range\
        \ in quick succession, they are also difficult to avoid. centre, Jinch\u016B\
        riki Transformations: As Son Gok\u016B's jinch\u016Briki, R\u014Dshi is granted\
        \ a significant amount of its chakra and stamina. The full extent of his control\
        \ is unknown, but he could form at least one of Son's tails upon his reincarnation,\
        \ further enhancing his power and strength. In the anime, he was shown to\
        \ be able to do this during his battle with Kisame as well, prior to his reincarnation.\
        \ After being immobilised by B's clone, he transformed into his Version 2\
        \ form, in this form, he was able to create an enormous torrent of lava, scorching\
        \ Gy\u016Bki. When R\u014Dshi attacked Naruto and Killer B, Tobi forced him\
        \ to transform into his Tailed Beast Mode. In this form, he displayed tremendous\
        \ strength, being able to toss Killer B in his Tailed Beast Mode a considerable\
        \ distance away., Flower-Fruit Mountain: While R\u014Dshi is in his transformed\
        \ state, he can create a small volcano that explodes violently, sending molten\
        \ rock flying up in all directions like a giant flower. The heat of the lava\
        \ is enough to burn tailed beasts as strong as Gy\u016Bki. centre, Monkey\
        \ Flame Arson: Son Gok\u016B or R\u014Dshi in Tailed Beast Mode spews green\
        \ flames at the opponent. centre, Bijudama (Tailed Beast Ball): A black, extremely\
        \ heavy ball made from positive white chakra and negative black chakra is\
        \ formed, and is shot from the Biju mouth. The ball can be ingested first\
        \ and regurgitated to fire a large energy blast, or shot in its ball form.\
        \ centre, like all of the other Edo Tensei Jinch\u016Briki, [https://imgur.com/a/vjw8rbL\
        \ had his abilities enhanced due to having the Sharingan and Rinnegan]. As\
        \ such"
