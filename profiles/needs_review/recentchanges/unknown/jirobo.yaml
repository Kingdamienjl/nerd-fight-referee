- id: claim-weaknesses-ff73f5d4
  section: weaknesses
  axis: weakness
  text: "Jirobo can be too cocky and tends to toy with his opponents. Use of the Curse\
    \ Mark erodes the user\u2019s body until they eventually lose themselves, binding\
    \ them to OrochimaruNaruto Chapter 179. The second level makes this erosion speed\
    \ up dramaticallyNaruto Chapter 183 and it requires a greater amount of chakra\
    \ to sustain it. It also takes a serious toll on the user, leaving them unable\
    \ to move their body afterwardsNaruto Chapter 186. {| class=\"mw-collapsible mw-collapsed\"\
    \ align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
    \ | colspan=\"2\" style=\"text-align: center; background-color: #C6865A; color:\
    \ #000000\" | Notable Attacks/Techniques |- | *Juin (Cursed Seal): Placed on the\
    \ user by Orochimaru utilizing Juugo's unique enzymes, the Cursed Seal allows\
    \ one to augment their physical stats such as strength, speed, and chakra as well\
    \ as their ninjutsu and genjutsu abilities through the use of natural energy.\
    \ There are two stages of the Cursed Seal: The initial stage appears as the Cursed\
    \ Seal markings spreed across the user's body, allowing them to forcefully absorb\
    \ natural energy and create sage chakra. Once the advanced stage of the Cursed\
    \ Seal is awakened, the user's abilities increase further and their body transforms\
    \ in to a grotesque appearance as their chakra is forcefully drawn from them and\
    \ replaced with potent sage chakra. Although with these transformations the power\
    \ of ninjutsu is greatly increased and becomes senjutsu, prolonged use of the\
    \ Cursed Seal's power is dangerous and causes great strain on the user's body.\
    \ - *Rakanken (Arhat Fist): A form of taijutsu similar to sumo, this fighting\
    \ style relies on applying great physical strength to martial arts techniques\
    \ to increase the raw power of the user's strikes. The user of this style puts\
    \ the weight of their entire body in to their blows with the intent to take down\
    \ the target quickly. The strength of these attacks are increased further with\
    \ the awakening of Jirobo's Cursed Seal stages. *Sh\u014Dshitsu (Rising Knee):\
    \ Jirobo quickly lifts his leg to strike his opponent with an upward knee thrust.\
    \ *Tokken (Thrusting Shoulder): Using the full weight of his body, Jirobo will\
    \ smash into his target with his shoulder. *H\u014Dsh\u014D (Crumbling Palm):\
    \ This technique is a quick forward palm strike. *Sh\u014Dgekish\u014D (Upwards\
    \ Attacking Palm): A powerful upward palm thrust. While in stage 2 of the Cursed\
    \ Seal, the force of this attack was strong enough for Jirobo to send giant Choji\
    \ flying several dozen meters in to the air. *Assh\u014D (Pressure Palm): Jirobo\
    \ strikes using a strong downward palm thrust. *Gangeki (Rock Attack): Jirobo\
    \ attacks with a forceful punch. *Doton (Earth Release): One of the basic elemental\
    \ nature transformation techniques. It allows the user to manipulate the surrounding\
    \ earth for offensive and defensive purposes or create it; be it dirt, mud, or\
    \ rock. These techniques can alter the landscape on a large scale, and solid earth\
    \ barriers are commonly used as defense. Some earth jutsu can even alter hardness\
    \ and weight properties. **Doton Kekkai: Dor\u014D D\u014Dmu (Earth Release Barrier:\
    \ Earth Dome Prison): Jirobo forms a rock dome around a target or a group of targets.\
    \ The victim(s) inside the earth barrier in turn have their chakra drained or\
    \ \"eaten\" by Jirobo. The inside walls of the stone dome are self-repairing and\
    \ regenerate from damage caused to them, though they can be destroyed with sufficient\
    \ enough force. Due to the barrier's uneven chakra distribution, the side of the\
    \ formation opposite of Jirobo has the slowest regeneration speed, and can be\
    \ broken more easily. **Doton: Dory\u014D Dango (Earth Release: Earth Mausoleum\
    \ Dumpling): Using a combination of chakra and super strength, Jirobo can lift\
    \ a building-sized chunk of earth out of the ground. The giant rock can be hurled\
    \ at a target or a group, crushing land and trees in its path. **Doton: Doroku\
    \ Gaeshi (Earth Release: Earth Shore Return): To use this technique, Jirobo will\
    \ place his hands on the ground and cause the earth to shift into a sturdy wall.\
    \ This stone wall provides defense and protects from frontal attacks, though it\
    \ can be destroyed with enough force. *Kekkai H\u014Djin (Barrier Method Formation):\
    \ To use this technique, four explosive tags are placed around a target area.\
    \ When a person enters the formation, the explosive tags detonate to destroy the\
    \ target with a large blast. - Konbi Henge (Combination Transformation): A shapeshifting\
    \ technique that allows two people to merge and change into a new form. The Sound\
    \ Four used this jutsu to disguise themselves as the Kazekage's two bodyguards\
    \ (two in each form). *Shishienjin (Four Violet Flames Formation): To execute\
    \ this technique, the Sound Four stand in a square formation around an area and\
    \ form a large protective chakra barrier. They then form a second barrier level\
    \ on the inside to protect them from potential disturbances within the barrier,\
    \ as they must remain in formation to keep the jutsu activated. This works to\
    \ their advantage,"
  source_ids: *id003
