        \ (Human Bullet Tank): To use this technique, the user must first perform\
        \ the Multi-Size Technique to transform their body into a round shape. The\
        \ user will begin to spin rapidly, and they throw the mass of their large\
        \ body at the target like a giant cannonball. As the user's body rolls, the\
        \ added momentum generates a heavy attack., Nikudan Hari Sensha (Spiked Human\
        \ Bullet Tank): Similar to the standard Nikudan Sensha (Human Bullet Tank).\
        \ Chouji will use chakra to transform and harden his long hair into sharp\
        \ spikes as he increases his mass and begins to spin rapidly. His attack power\
        \ is increased, as the solid spikes add a grinding effect to the jutsu and\
        \ can tear through rock. Ch\u014Dharite (Super Open Hand Slap): After performing\
        \ the Multi-Size Technique to increase their size, the user will focus a large\
        \ amount of chakra around their hands, causing unique markings to manifest\
        \ on their palms. Once the chakra becomes visible, the user will attack with\
