        *In "The Battle Royale", after launching herself from her ship, Dominator
        did a casual ground-pound punch so powerful it caused an eruption that not
        only blew away the other combatants but also ended up causing a vacuum effect
        that brought all the fighters towards her, which in turn caused a second eruption
        that was even more powerful to the point that even the surrounding rock platforms
        and the villains ships were sent into disarray. *Later in the same episode,
        she took a uppercut to the face from a fully enraged Hater that only caused
