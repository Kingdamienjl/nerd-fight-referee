- id: claim-weaknesses-1fa0e621
  section: weaknesses
  axis: weakness
  text: 'Her powers seem to be tied to her armor (as when during "The Night Out",
    she didn''t seem to have access to her lava powers) Feats: *She is a "bigger hater
    than Lord Hater himself". **Word of God from Creator Craig McCracken states that
    Dominator is the worst of the villains in the show in spite of her dorky personality.
    *Became the number one Villain in the entire galaxy in record time. *Out of all
    the people Wander has met in the entire show, she is the only one he was not able
    to be friends with as well as being the only person to ever make him fear someone.
    Only other person who could do this is Dr. Screwball Jones. *Curb stomped all
    of the four main characters (i.e Wander, Sylvia, Hater, and Peepers) in her debut
    ("The Greater Hater"). *Practically the most powerful and evil villain of the
    entire series to date. *In "The Battle Royale", after launching herself from her
    ship, Dominator did a casual ground-pound punch so powerful it caused an eruption
    that not only blew away the other combatants but also ended up causing a vacuum
    effect that brought all the fighters towards her, which in turn caused a second
    eruption that was even more powerful to the point that even the surrounding rock
    platforms and the villains ships were sent into disarray. *Later in the same episode,
    she took a uppercut to the face from a fully enraged Hater that only caused her
    helmet to come off and made her move a few feet back. Keep in mind that a partially
    enraged Hater has enough power to punch someone and make them go flying through
    a planet, and a fully enraged Hater can do more than that. *Became the only villain
    seen on the Galactic Villain Leaderboard alone after defeating all the other villains
    present in the aftermath of "The Battle Royale". *Gained the power to use ice
    and snow after being caught frozen by Peeper''s actions. She also retained her
    use of her lava powers, making her twice as powerful as before. ==Gallery== thumb|center|335px
    ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters Category:Cartoon
    Characters Category:Wander over Yonder Category:Female Characters Category:Aliens
    Category:Lava Users Category:Flight Users Category:Shapeshifters Category:Evil
    Characters Category:Primary Antagonists Category:Antagonists Category:Fire Users
    Category:Tyrants Category:Ice Users Category:Sadists Category:Armor Users Category:Energy
    Users Category:Monster Girls'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-fa225dcb
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Shapeshifting (Only her suit is capable
    of changing form. Uses this to switch between her big armored form and her smaller
    true form), Fire and Lava Manipulation (Can use this to shape-shift her hands
    into many stuff, such as buzzsaws, poison spike shooters, hammerhands, blade scythes,
    a spinning drill, magma cannons, etc. Can also shoot giant streams of magma that
    cool down and incapacitate her foes), Skilled Hand-to-Hand Combatant (Noted to
    be a better fighter than Hater in this regard), Energy Projection (Can shoot giant
    energy beams from her visor powerful enough to vaporize ships like Hater's in
    one blast), True Flight, Ice and Snow Manipulation, Armor Regeneration, Resistance
    to fire and lava
  source_ids: *id003
  decisive: true
  status: unverified
