      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Her powers seem to be tied to her armor (as when during "The Night Out",
        she didn''t seem to have access to her lava powers) Feats: *She is a "bigger
        hater than Lord Hater himself". **Word of God from Creator Craig McCracken
        states that Dominator is the worst of the villains in the show in spite of
        her dorky personality. *Became the number one Villain in the entire galaxy
        in record time. *Out of all the people Wander has met in the entire show,
        she is the only one he was not able to be friends with as well as being the
        only person to ever make him fear someone. Only other person who could do
        this is Dr. Screwball Jones. *Curb stomped all of the four main characters
        (i.e Wander, Sylvia, Hater, and Peepers) in her debut ("The Greater Hater").
        *Practically the most powerful and evil villain of the entire series to date.
        *In "The Battle Royale", after launching herself from her ship, Dominator
        did a casual ground-pound punch so powerful it caused an eruption that not
        only blew away the other combatants but also ended up causing a vacuum effect
        that brought all the fighters towards her, which in turn caused a second eruption
        that was even more powerful to the point that even the surrounding rock platforms
        and the villains ships were sent into disarray. *Later in the same episode,
        she took a uppercut to the face from a fully enraged Hater that only caused
        her helmet to come off and made her move a few feet back. Keep in mind that
        a partially enraged Hater has enough power to punch someone and make them
        go flying through a planet, and a fully enraged Hater can do more than that.
        *Became the only villain seen on the Galactic Villain Leaderboard alone after
        defeating all the other villains present in the aftermath of "The Battle Royale".
        *Gained the power to use ice and snow after being caught frozen by Peeper''s
        actions. She also retained her use of her lava powers, making her twice as
        powerful as before. ==Gallery== thumb|center|335px ==Notable Matchups== Victories:
