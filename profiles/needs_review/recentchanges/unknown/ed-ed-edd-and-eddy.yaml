  intelligence:
    text: Below Average usually (Got mostly F grades on his report card,Season 5 Episode
      1 - Mission Ed-Possible/Every Which Way But Ed somewhat lacks common sense and
      sometimes seems unaware of the situation, gullible, once thought he had actually
      become a monster after he was dressed up as one. When told his feet smelled,
      he wondered how that was possible when they didn't have a nose. It took him
      a whole 24 hours to figure out that two jawbreakers couldn't be divided between
      three people.Season 3 Episode 7 - Boys Will Be Eds/Eds or Tails However, he
      is skilled in some areas, such as playing the flute.Season 5 Episode 6 - Who's
      Minding the Ed?/Pick an Ed He also gave a detailed summary of Robot Rebel Ranch,
      a movie he had never seen before.Season 1 Episode 4 - Dawn of the Eds/Virt-Ed-Go
      Gave another detailed statement about how "it's difficult to deal with girls"Season
      2 Episode 12 - Hot Buttered Ed/High Heeled Ed and was able to make exact replicas
      of notes from Double D's parents.Season 3 Episode 1 - Wish You Were Ed/Momma's
      Little Ed In less than a day, he single-handedly built an elevator that reached
      the moon. His report card shows that he has an A in History. Defeated Eddy's
      Brother through creative thinking, by unhinging a door being held onto by Eddy
      and causing it to slam into Eddy's Brother's face to knock him unconscious,
      as opposed to relying on his brute strength to defeat him)
    source_ids:
    - mediawiki-11400
    confidence: 0.6
    notes: auto_repair source extraction
