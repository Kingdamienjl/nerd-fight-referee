    \ move prevents movement. Body Slam can induce paralysis), Aura (All Pok\xE9mon\
    \ have an aura within them), Statistics Amplification (Rock Polish and other moves),\
    \ Statistics Reduction (Can lower speed with Rock Tomb), Status Effect Inducement\
    \ (Flinching which stops movement temporarily, and paralysis), Portal Creation,\
    \ Summoning (Rock Slide), minor Spatial Manipulation, minor Time Manipulation,\
    \ Durability Negation, Supernatural Willpower (Pok\xE9mon can brush off status\
    \ effects through sheer determination), Extrasensory Perception, Enhanced Senses,\
    \ Power Nullification (Nullifies flying based moves with Gravity), Gravity Manipulation,\
    \ Forcefield Creation (With Max Guard in its Dynamax state, and Wide Guard in\
    \ base), limited Metal Manipulation (Heavy Slam), Damage Boost (Using a more powerful\
    \ move increases a Pok\xE9mon's energy output), Genius Intelligence (Can gain\
    \ an IQ of up to a thousand), Martial Arts (Is stated to be talented in giving\
    \ dynamic kicks. Can use Mega Kick), Pressure Points (With critical hits), Soul\
    \ Manipulation, Non-Physical Interaction (Can interact with dreams, illusions,\
    \ souls, intangible beings), limited Transmutation (Ancient Power), minor Curse\
    \ Manipulation (Curse increases stats). Resistance to Sound Manipulation (From\
    \ normal type attacks), Light Manipulation, Atomic Attacks (From resisting lasers,\
    \ light based attacks, including Techno Blast, Swift and more), Holy Manipulation,\
    \ Air Manipulation, Empathic Manipulation (Resists Relic Song), Extreme Cold,\
    \ Radiation Manipulation, Death Manipulation, Existence Erasure, Absorption, Soul\
    \ Manipulation (From resisting Oblivion Wing), Corrosion Inducement, Poison Manipulation,\
    \ Acid Manipulation, Fragrance Manipulation (From resisting poison type attacks),\
    \ Heat Manipulation, Fire Manipulation, Magma Manipulation (From resisting fire\
    \ type attacks)"
