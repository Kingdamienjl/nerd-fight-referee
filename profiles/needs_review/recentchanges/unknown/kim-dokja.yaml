- id: claim-powers-and-abilities-28cda859
  section: abilities
  axis: hax
  text: "Border|||Content= 6 Layers for all hax and resistances as Nameless Constellation\
    \ *Superhuman Physical Characteristics & Genius Intelligence *Passive Plot Manipulation\
    \ & Immortality (Types 8 & 9; Kim Dokja's true existence is a \"character\" created\
    \ by the Oldest Dream imagining itself within the story of Ways of Survival. This\
    \ connection grants him the Oldest Dream's blessing, passively manipulating the\
    \ narrative to align events in his favor, ensuring his survival and success even\
    \ in impossible situations. His existence is inherently tied to the Oldest Dream\u2019\
    s imagination, and as an extension of the Oldest Dream, his destructionWeb Novel,\
    \ Chapter 514 within the narrative does not impact the Oldest Dream\u2019s true\
    \ form.) *Resurrection & Regeneration (Low-Godly; After becoming the King of No\
    \ Kill during the Fourth Scenario of Kings, it grants him a free resurrection.\
    \ Afterward, the owner must save one person to earn one karma point. At one hundred\
    \ karma points, another resurrection is possible. This attribute only remains\
    \ withWebtoon, Episode 53Webtoon, Episode 54 the owner if they have not killed\
    \ anyone. Later when he loses this resurrection ability as a king, he will gain\
    \ the \"Eight Lives\" characteristic which allows him to be resurrected and completely\
    \ regenerate his body after 72 hours additionally after each resurrection he will\
    \ gain a new ability or stats improvementsWebtoon, Episode 165Webtoon, Episode\
    \ 194) **Limited Biological Manipulation & Statistics Amplification (Upon his\
    \ resurrection, the waste in his organism is completely evacuated from his body,\
    \ his body's performance, vitality and magical strength are increasedWeb Novel,\
    \ Chapter 56) **Social Influencing (After his first resurrectionWeb Novel, Chapter\
    \ 182 he gained popularity.) **Statistics Amplification (His second resurrection\
    \ improved his intelligence.Web Novel, Chapter 170) *Accelerated Development (Passive\
    \ & Other, Abilities; With a deep sleep, one can improve some of his skills.Web\
    \ Novel, Chapter 52 With excessive immersion, the mastery of his skill Omniscient\
    \ Reader's Viewpoint increases considerably.Web Novel, Chapter 55 After returning\
    \ to his body, he can permanently obtain one of the assimilated characters skill.\
    \ However, he has to be fully immersed to copy the skill, or the skill will not\
    \ be available.Webtoon, Episode 54) *Enhanced Senses & Extrasensory Perception\
    \ (Exchanged 2000 coins to get enhanced hearingWebtoon, Episode 49 With the skill\
    \ Calm Observation, he can estimate the overall stats of an opponent.Web Novel,\
