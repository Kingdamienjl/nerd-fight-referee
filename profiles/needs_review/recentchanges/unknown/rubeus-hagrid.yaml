power_scale:
  tier:
    text: At least , likely far higher. Possibly with magic
    source_ids:
    - vsbattles-rubeus-hagrid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: At least Street level+ (Can take down five Aurors and knock out a wizard
      with a single blow. Threw Walden Macnair across the Great Hall, a space that
      can fit in all the Hogwarts students. Fought off an entire colony of giant spiders.
      Can handle giant horses, spiders, three-headed dogs and 10-foot Blast-End Shrewts.
      Would generate this much energy via sheer size), likely far higher. Possibly
      Small Building level with magic (It is unknown whether he learned the Freezing
      Spell in his third year, as he was expelled during that period)
    source_ids:
    - vsbattles-rubeus-hagrid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Athletic Human running speed (Implied to be running fast when escaping\
      \ Hogwarts) with Subsonic combat speed and reactions (Can hit wizards before\
      \ they can react), Speed of Light attack speed via Lumos Solem (Lumos Solem\
      \ is a charm that creates a blinding flash of sunlight used to defend against\
      \ the Devil's Snare. Hagrid should know this spell, as it\u2019s implied to\
      \ be taught in basic herbology to defend against the Devil's Snare and advanced\
      \ charms class, and first years like Hermione have showcased this spell)"
    source_ids:
    - vsbattles-rubeus-hagrid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class 5 (Wrestled trolls when he was only a boy, who can easily
      swing clubs this big. Effortlessly hauled giant Christmas trees), likely Class
      10 (Easily turned a gun into a knot. Handled Madame Maxime's horses which are
      as large as elephants, as well as Acromantulas which are as big as small elephants)
    source_ids: &id002
    - mediawiki-1208081
    confidence: 0.95
  striking_strength:
    text: At least Street level+, likely far higher (Can knock out skilled Aurors
      with one punch. Can send people flying with just a gentle pat on their back)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least Street Level*, likely Building level (Even more durable than regular
      wizards. Can take quite a beating from giants, which Ron claimed could crush
      half the Hogwarts castle if they fell down; as well as monsters. Can tank spells
      from extremely skilled Aurors, as well as moderate levels of Dark Magic from
      Death Eaters)
    source_ids:
    - vsbattles-rubeus-hagrid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Can survive a considerable amount of beating from giants. Remained
      conscious after being tortured by Death Eaters)
    source_ids:
    - vsbattles-rubeus-hagrid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range
    source_ids:
    - vsbattles-rubeus-hagrid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average (Hagrid is good at being resourceful and thinking tactically
      when he is in a serious situation. When Aragog was accused of being Slytherin's
      Monster, Hagrid sent him to the Forbidden Forest to protect him. Before he was
      temporarily sent to Azkaban when he sent a coded message to Harry and Ron telling
      them to visit Aragog which allowed them to determine the location of the Chamber
      of Secrets, also resulting in Hagrid's release from Azkaban. He smuggled Grawp
      into the Forbidden Forest without even Umbridge's attention and tactfully brought
      Harry and Hermione to see him while the Quidditch Final, ensuring a distraction
      for the other Hogwarts residents. He also successfully escaped capture on two
      occasions.
    source_ids:
    - vsbattles-rubeus-hagrid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
