  attack_potency:
    text: Wall level (Casually shattered Ra's al Ghul's blade without any effort.
      Fought on par with Bane, who can easily smash apart limestone pillars. Can one-shot
      highly trained fighters with no effort whatsoever. Smashed a moving van by jumping
      onto it. Slammed Joker's head against an interrogation window glass with enough
      force to smash it. With the aid of a mechanical knee brace given to him by Lucius
      Fox, he effortlessly broke part of a brick wall with a single kick. Kicked Bane
      through a glass door), up to Small Building level with vehicles like the Batmobile
      (Plowed through a concrete road divider/ Can launch some missiles and another
      one can fire even more of them) or Batpod (Capable of blowing up multiple cars
      in a single shot. Fatally damaged the Batmobile)
    source_ids:
    - mediawiki-28121
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Superhuman travel speed (Outran gunfire from three shooters and he glides
      this fast), with Subsonic combat, reaction and travel speed with Tumbler/Batpod
      (Moved about a meter within the time it took an assault rifle to shoot twice,
      effortlessly defeated 17 extremely skilled, armed people in 21 seconds and his
      Tumbler could reach up to the full speed of 220mph), higher attack speed with
      the dual front-mounted cannons of the Batpod. Hypersonic flight speed with the
      Bat
    source_ids:
    - mediawiki-28121
    confidence: 0.6
    notes: auto_repair source extraction
