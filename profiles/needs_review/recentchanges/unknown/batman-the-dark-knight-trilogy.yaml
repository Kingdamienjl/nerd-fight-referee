      arm. Snapped Ra's al Ghul's blade with his Gauntlet spikes. Despite being severely
      weakened, he managed to lift a large wooden beam off of himself. Held his own
      against Bane), higher with mechanized gauntlets (Can bend the barrel of a gun)
    source_ids: &id002
    - mediawiki-28121
    confidence: 0.8
