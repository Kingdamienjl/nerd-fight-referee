- id: claim-weaknesses-7adcb178
  section: weaknesses
  axis: weakness
  text: 'Refuses to kill. He will put himself in harm''s way to protect innocents
    and his loved ones. The wounds accumulated over his years in combat (Including
    taking a fall with Harvey Dent) eventually resulted in him receiving scars not
    only on his body, but also receiving scar damage on his kidneys and severe concussive
    damage on his brain, and even the complete loss of cartilage on his left knee,
    which left him unable to move about without a mechanical knee brace, though he
    seems to have recovered from this by the end of The Dark Knight Rises. ==Gallery==
    Better TDKT Tumbler Render.png|Batmobile/Tumbler TDK Batpod Render 2.png|Batpod
    ==Notable Matchups== Victories: Losses: Kamen Rider Wizard (Kamen Rider) Wizard''s
    Profile (Haruto was in civilian key. Speed was equalized. The fight took place
    at the World Martial Arts Tournament arena) Deathstroke (Arrowverse (CW)) Deathstroke
    (CW)''s profile (Fight took place inside the The Octagon UFC Ring and Speed was
    equalized) Inconclusive: ==References== Category:Characters Category:The Dark
