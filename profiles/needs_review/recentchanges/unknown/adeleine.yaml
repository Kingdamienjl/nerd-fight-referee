    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Flight (Can naturally fly), Self-Sustenance
        (Types 1 and 2: Can breath in the middle of Outer Space), Weapon Mastery (Can
        masterfully wield a sword in combat), Homing Attack (Can create attacks which
        will follow their target), Acrobatics (Shown to be able of performing some
        acrobatic moves), Body Control and Telekinesis (Can throw up and control parts
        of it''s body to attack Kirby), Darkness Manipulation (Can create giant clouds
        of darkness to cover up entire planets), Danmaku (Can create multiple energy
        attacks at all once), Inorganic Physiology (Type 1: Stated multiple times
        that they are made of a cloud-like object), Electricity Manipulation (Can
        shoot out electric blasts at Kirby), Energy Manipulation and Projection (Can
        create and attack enemies with energy attacks), Afterimage Creation (Often
        leaves when attacking), Immersion (Entered and exited through Adeleine''s
