power_scale:
  tier:
    text: physically, up to via Subjective Reality
    source_ids: &id002
    - mediawiki-1834851
    confidence: 0.95
  attack_potency:
    text: "Below Average Human level physically (Can only slightly harm Kirby while\
      \ getting knocked out herself. Presumably as weak as a regular, young human),\
      \ Varies up to Large Planet level via Subjective Reality (Anything she paints\
      \ becomes real,Adeleine's character description \xB7 Kirby 64: The Crystal Shards'\
      \ Jpn. site including inanimate objects and minor enemies that should be comparable\
      \ to Waddle Dees in strength. The strongest beings she paints can put up somewhat\
      \ of a fight against Pre-Canvas Curse Kirby.Kirby 64: The Crystal Shards Would\
      \ become a Dream Friend later in her life, which were implied to \"include those\
      \ who were once Kirby's powerful enemies\"Kirby Nintendo Switch News Channel,\
      \ Jpn. post of 6/5/2018)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: Massively FTL+ (Can join the Star Allies [https://imgur.com/a/NFtcF7O who
      chased and kept up with] Jamba Heart pieces multiple times, which were suddenly
      [https://youtu.be/4t8WOIEgUGM&t=112 scattered] across the galaxy [https://imgur.com/a/XOHxRcx
      from its edge]. While there are a few characters with means of a slightly superior
      Travel Speed, all Star Allies show a comparable Travel, Reaction & Combat Speed,
      notable ones being Kirby, Meta Knight, King Dedede, Gooey, Marx, Ribbon, Magolor,
      and the Three Mage-Sisters. Can react riding a Friend Star for travel & in combat,
      [https://imgur.com/lVZhfld when that vehicle is made by the energies] & [https://imgur.com/puVqY0S
      "the collective power of Kirby and Friends"], whereas a regular Warp Star can
      be made by a lone Kirby. Kirby & 3 Star Allies kept up in combat & defeated
      the Three Mage-Sisters, Hyness, and Void Termina, [https://youtu.be/YEbkyTJIF-I?list=PLDKzS4VtdasmFbc-gVRPEVkcrHKDJIyWS&t=2413
      who in turn was able to keep up with] [https://imgur.com/a/l0mm273 an improved
      version of the Warp Star or the Friend Star], which Adeleine can maneuver in
      combat. The attack speed of her Crystal Gun should be comparable to an incomplete
      Cystal, which repeatedly flew from planet to planet in short periods of time)
    source_ids: *id002
    confidence: 0.95
  lifting_strength:
    text: "Below Average Human | Peak Human ([https://imgur.com/jPuAvtk Can carry\
      \ up to 3] Star Allies lining up above her without being slowed down or hindering\
      \ her mobility, even if the first one jumps away and manage to pull herself\
      \ into the opposite direction on ground or air when in the weaker ranges of\
      \ those moves, which affect the likes of Kirby, Meta Knight, King Dedede and\
      \ Bandana Waddle Dee in the same way.. Adeleine's Friend Heart \xB7 Kirby Star\
      \ Allies.gif|Friend Heart \xB7 Kirby Star Allies Everybody using Friend Hearts-27th\
      \ anniversary twitter video.gif|Adeleine making use of a Friend Heart *Friend\
      \ Heart: Obtained in Kirby Star Allies, Adeleine generates a Friend Heart which\
      \ is then quickly thrown to his objective(s). This can be done an unlimited\
      \ amount of times as well as repeatedly. Upon contact or near it, the Friend\
      \ Heart will generate a major change in the empathy of the being(s) affected\
      \ to the point of making them change their morality towards being friends &\
      \ allies with Adeleine. [https://youtu.be/dFJPGlUjhRI?t=21 The Friend Hearts\
      \ have also shown to make feel objectives extremely happy], [https://youtu.be/gcQcCnCBWMs?t=330\
      \ make them have a deep appreciation for the one who used a Friend Heart on\
      \ them], generate clothes in others, work on robots, [https://imgur.com/a/pZbLxWB\
      \ heal & purify others], [https://youtu.be/k8f2lw5c30A?t=6421 operate without\
      \ making direct contact to others' bodies as well as affect] [https://youtu.be/l8XC_r3LtVI?t=421\
      \ more than one being at a time]. Friend Hearts were also shown either creating\
      \ or turning small [https://imgur.com/Hrx2S01 areas they reached] [https://imgur.com/vAglOM1\
      \ into Friend Platforms] (Creation or Transmutation), an ability any Star Ally\
      \ may possess, but no character in Star Allies uses Friend Hearts in this manner\
      \ or were aware that this happened. The last function the Friend Hearts have\
      \ is that their sentient targets will immediately be bestowed with the ability\
      \ the generate and use Friend Hearts with all previously mentioned characteristics.\
      \ *Positive Energy Manipulation: Called \"positive energy\" in America and left\
      \ nameless & vague in the original version. It refers to the energies Star Allies\
      \ manipulate while doing Friend Actions and Team Attacks; The white energy with\
      \ colorful [https://imgur.com/BiP7rqd stars around] [https://imgur.com/hbsbSBl\
      \ recognized as \"a mysterious power,\"] which may trigger with a heart-shaped\
      \ wave. What exactly positive energy is is a bit vague, but it's related to\
      \ [https://imgur.com/a/P0mTrRv friendship and companionship], and should be\
      \ the opposite of \"negative energy\" (American name)/ \"[https://imgur.com/esI7seH\
      \ substance of darkness]\" (Original name. Since it can be translated as \"\
      dark matter,\" it is not to be confused with Dark Matter), which is conformed\
      \ by, or related to, [https://imgur.com/mSsaCYx hatred, obsession, jealousy,\
      \ desire], [https://imgur.com/a/hrofIDe and may be invisible] (Hyness says the\
      \ Jamba Heart \"is now being filled,\" but we don't see it being filled with\
      \ physical things at the time). In short, [https://imgur.com/esI7seH they are]\
      \ types of energies that respectively relate to morally good, healthy attitudes\
      \ and evil, unhealthy attitudes. The use of positive energy allows Star Allies\
      \ to form certain energy-based moves, power up attacks, and use certain abilities\
      \ in the first place. The Star Allies' every move is filled with positive energy,\
      \ considering how Void, [https://imgur.com/w1TIMtc a being born] [https://imgur.com/mSsaCYx\
      \ from darkness] when playable. The ability to bestow elemental abilities to\
      \ fellow Star Allies, and their use of certain collaborative techniques, are\
      \ also Friend Abilities. They all use the previously mentioned \"positive energy.\"\
      \ **Friend Action: They all supposedly need 4 allies in total to be done and,\
      \ gameplay wise, a special platform to be used; This are only Game Mechanics,\
      \ the narrative seems to indicate the Star Allies Sparkler to have been made\
      \ by the Star Allies without mentioning said platform, Hyness can use his own\
      \ version of the Friend Circle without it, even when using 3 woods as his partners,\
      \ and the Three Mage-Sisters themselves can use a Friend Circle on their own\
      \ too. ***Friend Circle: The friends form a donut circle by holding each other,\
      \ then they constantly roll forward while being coordinated enough to make jumps\
      \ while they advance. They use this to travel faster on stages and power through\
      \ minor enemies instead of bothering to deal with them with their moves. ***Friend\
      \ Star: [https://imgur.com/puVqY0S Through their collective power, the friends]\
      \ [https://imgur.com/lVZhfld use energies from their bodies that combine to\
      \ create a Friend Star], much like how Kirby alone can create a Warp Star, the\
      \ Friend Star is basically a better version of it. One drives while the others\
      \ are behind sustained by nothing but the energies generated by the Friend Star,\
      \ they can change driver mid-use. They can fly around with the vehicle, do spin\
      \ attacks, and shoot projectiles"
    source_ids: *id002
