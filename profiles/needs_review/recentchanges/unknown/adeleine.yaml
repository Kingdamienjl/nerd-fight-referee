        with means of a slightly superior Travel Speed, all Star Allies show a comparable
        Travel, Reaction & Combat Speed, notable ones being Kirby, Meta Knight, King
        Dedede, Gooey, Marx, Ribbon, Magolor, and the Three Mage-Sisters. Can react
        riding a Friend Star for travel & in combat, [https://imgur.com/lVZhfld when
        that vehicle is made by the energies] & [https://imgur.com/puVqY0S "the collective
        power of Kirby and Friends"], whereas a regular Warp Star can be made by a
        lone Kirby. Kirby & 3 Star Allies kept up in combat & defeated the Three Mage-Sisters,
        Hyness, and Void Termina, [https://youtu.be/YEbkyTJIF-I?list=PLDKzS4VtdasmFbc-gVRPEVkcrHKDJIyWS&t=2413
        who in turn was able to keep up with] [https://imgur.com/a/l0mm273 an improved
        version of the Warp Star or the Friend Star], which Adeleine can maneuver
        in combat. The attack speed of her Crystal Gun should be comparable to an
        incomplete Cystal, which repeatedly flew from planet to planet in short periods
        of time)
      source_id: mediawiki-1834851
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: 'Maxim Tomato=Heals all of his health when eaten., Various Food Items=Heal
        varying amounts of his health., Invincible Candy=When collected, Adeleine
        becomes invincible for a short time, and almost any enemy she touches will
        be instantly defeated, or at least damaged., Dream Rod= When picked up and
        used Adeleine summons one of the following Dream Friends to assist her, some
        options coming in as a small team:, Bandana Waddle Dee, King Dedede, Meta
        Knight, "Rick & Kine & Coo", Marx, Gooey, Adeleine & Ribbon, Dark Meta Knight,
        Daroach, Magolor, Taranza, Susie, The Three Mage-Sisters, Star Allies Sparkler=
        The Final Weapon in Star Allies, used to take out Void Termina. The Star Allies
        Sparkler fires projectiles from the tip, fly around quickly and efficiently,
        and spin counterclockwise to avoid all damage on a relative scale (Sparkler
        Turn). Kirby canonically took the lead in the center of the Sparkler while
        his friends rode in the tail. Still, the leader can be rotated to imbue the
        shots with a different element depending on the leader (the technique is called
        Rider Switch). The Sparkler can fire different homing projectiles with varying
        power depending on charge time. An uncharged shot is called the Sparkler Comet,
        and it fires a star-shaped projectile. A charged shot is called the Sparkler
        Starshot, and it fires a projectile shaped like two intertwining stars. The
        strongest attack is called Team Star Allies!, which, if everyone who''s riding
        charges together and releases at the same time, fires a giant laser at the
        opponent. Adeleine uses this item on her own when used in The Ultimate Choice
        of Star Allies., Power-Up Hearts= Used to increase his statistics. The effects
        are shared with allies., Speed Power-Up Hearts: Increases speed., Health Power-Up
        Hearts: Increases & heals all health., Attack Power-Up Hearts: Increases attack
        potency., All Power-Up Hearts: Gives all previous effects at once, both being
        very similar. Whether or not Adeleine and Ado are the same character [https://kaialone.tumblr.com/post/182877726465/kirby-translations-ado-adeleine-the
        is consistently left intentionally unclear] [https://imgur.com/Vub3Dge and
        unknown] across supplementary material. Since official compilation images
        of the character omit Ado from Dream Land 3, it''s safer to assume that they''re
        not the same character. Notably, the "Kirby of the Stars Characters Encyclopedia"
        book lists all of Adeleine''s appearances in a graph that lists all the games
        in the series up to that point, coloring only the games where a character
        appears, and Kirby''s Dream Land 3 wasn''t colored. This means that the latter
        source is affirming Ado and Adeleine to be different characters, even if other
        sources are indecisive. (To be specific, there is evidence that they were
        the same character at first, the character was not used for many years, and
        then the narrative around their identity was changed, in such a way that retconned
        her identity.)'
      source_id: mediawiki-1834851
      provider_id: vsbattles
      authority: high
      confidence: 0.75
