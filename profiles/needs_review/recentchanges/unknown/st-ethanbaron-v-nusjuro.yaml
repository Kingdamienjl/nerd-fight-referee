- id: claim-powers-and-abilities-b28eec55
  section: abilities
  axis: hax
  text: "Saint Ethanbaron V. Nusjuro= *Superhuman Physical Characteristics *Large\
    \ Size (Type 0; Type 1 in Bakotsu forms) *Haki (Advanced Conqueror, Intermediate\
    \ Observation, Intermediate Armament) *Telepathy (The Five Elders are capable\
    \ of communicating mentallyOne Piece Vol. 110 Chapter 1114) *Overwhelming Aura\
    \ and Fear Inducement (Five Elders are described as possessing an otherworldly\
    \ and overwhelming aura, exuding a pressure so intense that it stuns even high-level\
    \ individualsOne Piece Vol. 107 Chapter 1085. Their mere presence was enough to\
    \ visibly bewilder Rob Lucci, a seasoned assassin and one of CP0\u2019s top agents)\
    \ *Transformation (St. Nusjuro can transform into a full BakotsuOne Piece Vol.\
    \ 109 Chapter 1108 and a half human hybrid) *Magic, Summoning, Portal Creation,\
    \ Electricity Manipulation, and Fire Manipulation (Anyone who has the mark is\
    \ capable of traveling through the Abyss using magic circles. Usage of these pentagrams\
    \ typically generates large streaks of black lightning and flamesOne Piece Vol.\
    \ 109 Chapter 1109) *Immortality and Regeneration (Type 1 - St. Saturn has lived\
    \ for over 200 years, showing no signs of agingOne Piece Vol. 111 Chapter 1125;\
    \ Type 2 - Can survive and remain conscious after having large portions of his\
    \ body destroyedOne Piece Vol. 110 Chapter 1121; Type 3 and 8 - at least High,\
    \ possibly higher; The Five Elders can regenerate from any and all forms of physical\
    \ damage, including complete bodily vaporizationOne Piece Vol. 110 Chapter 1111.\
    \ When no biological matter remains, black flames manifest, from which they begin\
    \ to regenerateOne Piece Vol. 110 Chapter 1120. Their existence is sustained through\
    \ their connection to Imu, making them invulnerable to conventional means; as\
    \ death can only occur if this connection is severed) *Extraordinary Master Swordsman\
    \ **Ice Manipulation, Damage Boost, Statistics Amplification, and Limited Durability\
    \ Negation (St. Nusjuro can coat his blade in a cold wind, granting him the ability\
    \ to freeze opponents and deal internal damage with each his strikes. This also\
    \ increases the potency of his attacks, allowing him to clash with Zoro) **Air\
    \ Manipulation (St. Nusjuro is capable of launching flying slashes large enough\
    \ to cut the entire Labophase of Egghead Island in half) **Information Analysis,\
    \ Analytical Prediction and Extrasensory Perception (As one of the most skilled\
    \ swordsmen in the world he should be capable of sensing the \"Breath\" of all\
    \ things, allowing him to know the trajectory of a person or object's actions\
    \ before it happens as well as know it's location despite not being visible to\
    \ him.One Piece Vol. 21 Chapter 195 By doing so he can determine the speed, power\
    \ and angle of where he should cut at allowing him to cut objects he wouldn't\
    \ be able to with strength aloneOne Piece Skill Vivre Card Databook #0002) **Limited\
    \ Durability Negation (Through sensing the \"Breath\" of their desired target\
    \ they're able to cut objects or people they otherwise couldn't through power\
    \ alone.One Piece Vol. 21 Chapter 195 It's effectiveness begins to lessen against\
    \ objects or opponent's with durability that far exceeds the limit of this abilityOne\
    \ Piece Vol. 44 Chapter 422One Piece Vol. 50 Chapter 485One Piece Vol. 102 Chapter\
    \ 1033)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
