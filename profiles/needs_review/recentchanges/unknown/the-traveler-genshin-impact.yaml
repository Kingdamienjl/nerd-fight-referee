  intelligence:
    text: Gifted normally (The Traveler is a quick learner, who at times has encountered
      many obstacles and puzzles by solving them. Most of NPCs often demand his help
      in matters in which he has never been involved, calling him a talented person.
      Has also been shown to make noteworthy deductions, such as ascertaining the
      true identity of Zhongli before it is ever revealed, in spite of Zhongli's efforts
      to conceal the truth. Solved the mystery that he was in a dream, the task of
      which was set by Nahida, the God of Wisdom. Helped Navia find out the truth
      in court about her father that he is not a murderer), likely Genius combatant
      (The Traveler can keep up with Childe, who is implied to be the most skilled
      in battle among the Fatui Harbingers, mastering all weapons aside from a bow.
      Kept up with Raiden to a degree, whose martial techniques are the basis of all
      Inazuman martial arts regarding polearm and sword techniques, each branch fostering
      masters of skilled fighters. [https://youtu.be/aLT0MWUg7t8 A Knowledge Capsule
      worth a million Mora specifically containing information of combat and swordfighting
      techniques- holding "countless figures" demonstrating sword techniques, only
      produced a neglible difference in combat skill]. [https://imgur.com/arBVr9S
      Is a proficient with all types of weapons], [https://imgur.com/akfh5sA stated
      to have the greastest battle iq of the 5 nations he saved], [https://imgur.com/3jIs9xV
      was able to quickly learn how to maintain Kuuvahki structures])
    source_ids: *id002
