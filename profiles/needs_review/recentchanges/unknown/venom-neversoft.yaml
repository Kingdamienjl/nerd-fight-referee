  intelligence:
    text: "Unknown, most likely at least Average (Venom\u2019s intelligence in the\
      \ game is pretty inconsistent most of the time. After becoming an ally with\
      \ Spider-Man, Venom acts a lot dumber, with this as his response for who he\
      \ thinks framed Spider-Man. Although, this was more likely just him joking around,\
      \ as he is portrayed as more of a comic relief character in the game. However,\
      \ there are also scenes that do also suggest that he is pretty dimwitted, as\
      \ he, himself, had stated that he still believed Spider-Man was responsible\
      \ for the heist during Doc Ock\u2019s convention, despite bumping into Peter\
      \ in the crowd, with it also hinted in the game that Eddie was already aware\
      \ of Spider-Man\u2019s identity prior to the events of the game. However, prior\
      \ to the previously mentioned showings of intelligence, Venom was able to create\
      \ a tricky puzzle for Spider-Man to solve and has gotten into his head by kidnapping\
      \ Mary Jane and holding her hostage, even broadcasting himself onto live television\
      \ to catch Peter\u2019s attention, showing how manipulative and calculating\
      \ he can be)"
