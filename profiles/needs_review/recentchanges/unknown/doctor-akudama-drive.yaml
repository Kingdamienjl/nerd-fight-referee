power_scale:
  tier:
    text: At least , possibly higher
    source_ids: &id002
    - mediawiki-5071584
    confidence: 0.8
  attack_potency:
    text: 'At least Wall level, possibly higher (Doctor is a widely feared and notorious
      Akudama, earning her a sentence of 432 years. Doctor is capable of easily killing
      a room full of people casually, or even while performing surgery, and can easily
      threaten the likes of SwindlerAkudama Drive - Episode 5: DEAD MAN WALKING and
      Hoodlum. Despite this, she is not as physically powerful as other Akudama such
      as Brawler and Cutthroat, instead preferring to use drugs and chemicals to fight
      with, though her weaponry is still able to pierce and cut through the likes
      of them)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: "At least High Hypersonic+ Combat, Reaction and Perception Speed (Although\
      \ not as physically strong, Doctor seems to only be slightly slower than other\
      \ Akudama such as Brawler and Cutthroat. Doctor is able to perform extremely\
      \ precise, life saving surgeries on herself and others in minutes at most, even\
      \ in the midst of fighting, and can even accurately measure up someone\u2019\
      s speed by observing them as she did with Master, who can casually deflect bullets\
      \ from point blank range.21417.1 m/s She was also able to blitz Courier and\
      \ paralyse him, though he was not paying attention to her), possibly higher\
      \ (Doctor's speed could possibly be comparable to the likes of Courier or Brawler,\
      \ who are able to consistently and easily dodge laser-like projectiles from\
      \ police robots and tanks)"
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Unknown (Doctor is capable of easily carrying and restraining Brother with
      her strength)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: At least Wall level, possibly higher (Typically prefers to use weapons and
      chemicals to fight with, though her weaponry can penetrate the skin of characters
      with much higher durability such as Brawler and Apprentice)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: 'At least Wall level, at most Small Town level (Despite being weaker, Doctor
      has been shown surviving a lot of the same things as the other Akudama, such
      as missiles from police tanks154.3 Kilojoules and a flying bus collision into
      a large hotel complex without a scratch. Doctor has also been shown to survive
      things such as being thrown into a ceiling by Brawler, who was surprised that
      she had survived, though she had to use her self-medicating to recover, as well
      as quickly recovered when Apprentice was thrown into her by Brawler.Although
      Doctor has blatantly been able to survive and stay conscious after Brawler''s
      throwing of her, which he implies he was not holding back on, Doctor''s ''self-medicating''
      was a requirement and proves that her body in itself cannot withstand Brawler''s
      attacks without surgery. Depsite this, the fact that her body is able to stay
      intact enough to heal in the first place, as well as her ability to stay conscious
      should give her around this level of durability. Doctor should also be comparable,
      if not superior, to the likes of Swindler, who survived three particle cannons
      capable of destroying the Shinkansen with only a limb injured each.Akudama Drive
      - Episode 12: AKUDAMA DRIVE~5422.83 Tons of TNT (1807.62*3) Despite this, characters
      within the series are seemingly more vulnerable to piercing attacks, such as
      from knives or swords, than blunt-force or concussive attacks. Doctor''s ability
      to quickly stitch up and heal her own wounds make her more difficult to kill,
      even when she has been cut in half)'
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Through her body augmentations and extreme ability to conduct
      surgery on herself, Doctor is extremely resilient to pain, being able to barely
      flinch and conduct surgery on herself even in the middle of battle, surviving
      and instantly recovering from attacks inflicted by the likes of Brawler and
      the Execution Division Master. With this, Doctor is able to easily keep conscious
      through injuries such as limb loss or being cut in half. Even when bleeding
      out from a severed carotid in a near-death state, she was able to accurately
      slit Hoodlum's throat and then tend to her own wound)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, Tens of Meters with thrown weaponry (Such as her scalpels,
      which she can throw at pinpoint accuracy alongside her detailed knowledge of
      biological weakpoints, even when she is not looking at her target)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Standard Tactics: *On her own, Doctor seems to best utilise stealth strategies
      that avoid direct confrontation, being able to slip around and face any obstacles
      using her numerous poisons to get what she needs. *In a team, such as when paired
      with other Akudama assigned by the Black Cat, Doctor plays a supportive role,
      utilising her numerous poisons and working more in stealth while her enemies
      are distracted by more prominent forces. With her medical skills, she also plays
      the vital role of a medic, being able to stitch and seal any injuries inflicted
      to the other Akudama, to the point she can even reattach their limbs. *As an
      Akudama, Doctor has no issues with murder or killing others, feeling nothing
      towards it, and instead is devoted to the notion of controlling life and death
      itself. With this, Doctor feels no regret or remorse for killing even bystanders,
      as well as much worse in kidnapping and coercing others for her own goals. She
      will even kill entire rooms of people randomly, just for the thrill of ''controlling
      life''. **Doctor also becomes interested in anything particularly related to
      life and death that could further her research, such as the immortal physiology
      of Brother, and will plan around perfectly obtaining it for herself through
      any means necessary, even leaving her to betray allies or work with opposition
      such as the Execution Division.'
    source_ids: *id002
    confidence: 0.8
