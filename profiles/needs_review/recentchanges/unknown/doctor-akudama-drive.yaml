    - field: intelligence
      value: 'Standard Tactics: *On her own, Doctor seems to best utilise stealth
        strategies that avoid direct confrontation, being able to slip around and
        face any obstacles using her numerous poisons to get what she needs. *In a
        team, such as when paired with other Akudama assigned by the Black Cat, Doctor
        plays a supportive role, utilising her numerous poisons and working more in
        stealth while her enemies are distracted by more prominent forces. With her
        medical skills, she also plays the vital role of a medic, being able to stitch
        and seal any injuries inflicted to the other Akudama, to the point she can
        even reattach their limbs. *As an Akudama, Doctor has no issues with murder
        or killing others, feeling nothing towards it, and instead is devoted to the
