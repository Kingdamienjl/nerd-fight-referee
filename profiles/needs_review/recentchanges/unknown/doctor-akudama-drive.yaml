    - field: durability
      value: 'At least Wall level, at most Small Town level (Despite being weaker,
        Doctor has been shown surviving a lot of the same things as the other Akudama,
        such as missiles from police tanks154.3 Kilojoules and a flying bus collision
        into a large hotel complex without a scratch. Doctor has also been shown to
        survive things such as being thrown into a ceiling by Brawler, who was surprised
        that she had survived, though she had to use her self-medicating to recover,
        as well as quickly recovered when Apprentice was thrown into her by Brawler.Although
        Doctor has blatantly been able to survive and stay conscious after Brawler''s
        throwing of her, which he implies he was not holding back on, Doctor''s ''self-medicating''
        was a requirement and proves that her body in itself cannot withstand Brawler''s
        attacks without surgery. Depsite this, the fact that her body is able to stay
        intact enough to heal in the first place, as well as her ability to stay conscious
        should give her around this level of durability. Doctor should also be comparable,
        if not superior, to the likes of Swindler, who survived three particle cannons
        capable of destroying the Shinkansen with only a limb injured each.Akudama
        Drive - Episode 12: AKUDAMA DRIVE~5422.83 Tons of TNT (1807.62*3) Despite
        this, characters within the series are seemingly more vulnerable to piercing
        attacks, such as from knives or swords, than blunt-force or concussive attacks.
