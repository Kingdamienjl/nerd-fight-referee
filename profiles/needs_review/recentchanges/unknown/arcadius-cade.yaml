  section: abilities
  axis: hax
  text: Telepathy, Mind Manipulation, Immortality (Types 1, 2 and 7), Illusion Creation,
    Pain Manipulation (Made Damon feel as he was stuck into Hell, Kai Parker explained
    that Cade would come to visit him and torture him some days and described him
    as torture incarnate), Memory Manipulation (Showed Stefan memories of his days
    as the Ripper of Monterey), Hellfire Manipulation (Has the power to generate and
    manipulate Hellfire which, as stated by Sybil, stems from the fact that Hell was
    the psychic imprint of Cade's death, and can use it to incinerate objets and beings
    and kill them with a gesture or a mere thought), Biological Manipulation (Killed
    two men at the Mystic Grill by causing gastrointestinal bleeding), Pocket Reality
    Creation (Created Hell with a psychic blast), Life Manipulation and Death Manipulation,
    (Stated to have altered the very cycle of life and death by creating Hell), Durability
    Negation (Via Hellfire Manipulation and other powers), Soul Manipulation (Can
    absorb dark souls into his dimension and feed on them, has complete control over
    the souls of the wicked and can force them to go to Hell after their death such
    as he did with Georgie. Also has the ability to release souls from Hell, upon
    his own volition like he did with Kai Parker), Necromancy (Can communicate with
    souls and spirits and summon them), Resurrection (Can resurrect people like he
    did with Kai. Resurrected himself when the Maxwell Bell rang eleven times), Non-Physical
    Interaction (Can physically interact with souls and spirits and torture souls),
    Air Manipulation (Can produce gusts of wind around him), Extrasensory Perception
    (Can see spirits and senses psychic energies), Power Bestowal and Removal (Gave
    immortality to Sybil and Seline, turning them into Sirens, and removed it later
    with a thought), Dimensional Travel (His psychic powers allow him to travel between
    Hell, Earth and Limbo at will even after his resurrection), Teleportation, Immunity
    to Fire Manipulation and Heart Extraction (Demonstrated it against Damon)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
