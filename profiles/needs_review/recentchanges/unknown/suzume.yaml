        they will enter Critical Counter Mode. In Critical Counter Mode, the fighter
        is able to string together attacks and techniques better making them a better
        fighter, when Critical Counter Mode is nearly over, the fighter can choose
        to end it with an enhanced version of their strongest move. Once the Critical
        Counter gauge is empty, Critical Counter Mode will end. :::* Hyperdrive Mode:
        Hyperdrive Mode is a power-up all fighters can access. In exchange for their
        Super Meter depleting quickly over time, the fighter gets the ability to cancel
        every one of their moves and techniques, allowing them to combo all of their
        moves and techniques together better. Once their Super Meter is empty, Hyperdrive
        Mode will end. Jigoku Otoshi.gif|Jigoku Otoshi Ippon Tsuri Nage.gif|Ippon
