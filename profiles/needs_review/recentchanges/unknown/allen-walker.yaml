    - field: weaknesses
      value: "Dark Matter, Sword of Exorcism can't harm humans {| class=\"wikitable\
        \ mw-collapsible mw-collapsed\" !Notable Attacks/Techniques: |- | Cross: Cross\
        \ is a parasitic type Anti-Akuma Weapon that is centralized in the cross-shaped,\
        \ stone-like Innocence embedded in the back of Allen's left hand. The Innocence\
        \ has caused Allen's entire arm to be taken over by Innocence, so his arm\
        \ from the shoulder down is actually \"foreign\" tissue that his body symbiotically\
        \ accepts as part of himself. Originally, Allen's arm was quite veinous and\
        \ red, but over time its color has darkened and the skin has smoothed out,\
        \ taking on a slightly more normal appearance. * Cross \u03B1: The first and\
        \ most basic form of Allen's Innocence augments his left arm into a monstrous\
        \ claw with a supernatural glow at Allen's scapula-joint. At this phase, his\
        \ Innocence is capable of manipulating its size and shape even to extreme\
        \ ends, such as when it grew enough to grab the entire body of the mountain-sized\
        \ Fallen One, Suman Dark. * Cross Grave: At the first level of invocation,\
        \ the Innocence's power can be channeled into one powerful stream, capable\
        \ of destroying multiple Level 1 Akuma simultaneously, and leaves a cruciform\
        \ of energy behind on each of its targets. Cross \u03B2: This evolution takes\
        \ a more offensive approach, in the form of a massive arm-cannon with his\
        \ fingers becoming energy spikes. This form is capable of both ranged and\
        \ melee combat but tends to use up more energy initially. * Cross Paling:\
        \ At its second phase of invocation, Allen's Innocence is capable of firing\
        \ volleys of rod-shaped energy palings; these laser stakes are made of hard-light\
        \ Innocence energy, which enables them to picket the ground and fence in the\
        \ adversary or to pile upon them. * Cross Spear: Also in its second phase\
        \ of invocation, Allen is capable of focusing the barrel of his Innocence-cannon\
        \ to generate a spear-like energy paling, which can then be used as a sword.\
        \ Crown Clown: When invoked, Crown Clown acts as a body-armored Innocence,\
        \ forming a white-hooded cowl and sleeve of Innocence energy which covers\
        \ his shoulders and right arm, while his left arm and hand become slender\
        \ and black, clad in armor and razor-sharp claws. A masquerade-style mask\
        \ is always affixed to the cowl, which takes on various configurations and\
        \ appearances. This transformation also changes Allen's usual hairstyle from\
        \ flat to a spiky rear. As before, his Innocence possesses a certain degree\
        \ of sentience, such as when Crown Clown is able to manipulate Allen's entire\
        \ body like a marionette when incapacitated, or simply assisting in evasive\
        \ tactics. When not activated, his arm is black and meets with his shoulder\
        \ in a spiraling pattern that ends with a tattoo-like emblem. * Cross Grave:\
        \ Much more powerful than its previous incarnation, Allen can crucify targets\
        \ simply by etching a cross upon them with his left hand, effectively annihilating\
        \ even Level 3 Akuma with a single talon. It can now also be used defensively,\
        \ generation a shield by drawing a cross on the air. * Clown Belt: The cape\
        \ of Allen's cowl is released as a webbing of Innocence-energy that can be\
        \ used to grasp objects, immobilize opponents or form hardened spikes to impale\
        \ enemies. It can also be released from the sleeve and glove on Allen's right\
        \ arm. The ribbons of energy were once used by Crown Clown itself to wrap\
        \ around Allen's limbs and control him like a puppet when Allen was too injured\
        \ to move by himself. * Crown Edge: A projectile attack which unleashes a\
        \ barrage of crown-shaped rings from the clawed fingers on Allen's left hand.\
        \ * Edge End: A swipe of raw destructive power dealt with Allen's fully-invoked\
        \ claw. Sword of Exorcism: When Allen's synchronization rate exceeds 100%,\
        \ he is able to transmute his entire left arm into a large broadsword with\
        \ a cross emblazoned on the faces of the blade. In doing so, his left shoulder\
        \ is capped with a cross-shaped emblem, and his cowl usually forms a cloak\
        \ to cover the missing arm. Once invoked, the blade can exorcise evil from\
        \ any vessel it strikes, though it does not harm humans; this means that Allen\
        \ can damage the inner Noah of members of the Noah family without killing\
        \ their human bodies. If used against Level 1 to Level 3 Akuma, it vanquishes\
        \ them in the same effect as the Cross Grave attack, leaving a residual glowing\
        \ cross crest in the wake of the defeated Akuma. However, in the case of a\
        \ Level 4 Akuma, the sword carries a diminished effect. Allen is shown with\
        \ the ability to telepathically recall the Sword to himself, should it be\
        \ separated from his body. *Death Orbs: When using the Sword of Exorcism,\
        \ Allen can create a series of large explosions. |} ==Gallery== PirateAllen.webp|Pirate\
        \ Allen AllenUWalker.webp|Suit & Ribbon Allen.Walker.1024.1239427.webp|Looking\
        \ up D.Gray-man.1024.251407.webp|With Noahs D.Gray-man.1024.1239322.webp|White\
        \ Uniform Allen.Walker.1024.1169742.webp|Upside Down Allen-walker-from-d-gray-man-v0-1f14cvsb08ec1.jpg|Chapter\
        \ One Allen.Walker.1024.1184034"
