- id: claim-powers-and-abilities-137917da
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Large Size (Type 1), Regeneration (Low-Mid),
    Extrasensory Perception, Magic, Empowerment (Her emotions directly translate into
    magic power and her strength grows more powerful as said emotions get stronger),
    Absorption (Can absorb moonlight energy. All Dragons passively absorb Ethernano
    from the atmosphere to regenerate their Magic Power), Absorption Negation (Dragons
    are capable of entirely negating the effects of the Anima, which is capable of
    absorbing all of someone's magic power and transmuting them into a Larcima Crystal),
    Immortality (Type 1), Flight, Transformation (Via Human Form), Telepathy, Dimensional
    Travel, Teleportation, BFR, Light Manipulation, Fire Manipulation, Air Manipulation,
    Explosion Manipulation, Danmaku, Dragon Slayer Magic (Her Magic is especially
    effective against dragons and those with dragon-like properties, bypassing their
    defenses), Magic Resistance Negation (Can use Dragon Slayer Magic to damage characters
    and objects which are normally immune to Magic), Limited Regeneration Negation
    (Dragons are unable to heal or regenerate from injuries that come from Dragon
    Slayer Magic), Limited Power Mimicry (Can replicate the properties of other magics
    after consuming them), Resistance to Absorption (Dragons are completely resistant
    to the effects of the Anima, which is capable of absorbing all of someone's magic
    power) and Transmutation (Dragons are completely resistant to the effects of the
    Anima, which is capable of transmuting someone into a Larcima Crystal)
