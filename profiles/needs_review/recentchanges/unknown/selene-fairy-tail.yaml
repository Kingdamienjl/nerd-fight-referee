    - field: weaknesses
      value: 'Weak to Dragon Slayer Magic. Selene should suffer from motion sickness
        as a result of being a Dragon, which causes her to become severely nauseous
        while riding transportation. Selene cannot eat the moonlight energy created
        from her own Dragon Slayer Magic to replenish her stamina. Notable Attacks/Techniques:
        Moon Dragon Slayer Magic: Selene can utilize elemental Dragon Slayer Magic
        like all the other Five Dragon Gods, the element, in this case, is the stars
        and the moon. Selene uses this Magic to make her surroundings appear to be
        at nighttime with her own artificial moon and uses it to create an explosion
        that transports her targets into a different world, as well as offensive purposes
        such as pinpoint laser beam attacks. Selene is also capable of manipulating
        "moonlight" energy and uses it to attack in many different forms. Selene''s
        Magic is also connected to the moon itself, as using more of her magic power
        caused Elentear''s moon to greatly increase in size. *Moon Dragon God''s Roar:
        Similar to other Dragons and Dragon Slayers, Selene has shown the ability
        to use her element in the form of an attack coming from her mouth. In Selene''s
        case, the attack takes the form of a concentrated blast of "moonlight" energy.
        *Relocation: Selene creates a large orb of galactic matter that transports
        those caught in it to a chosen area. *Moonlight Conflagration: Selene creates
        a large spiral of flames around her target and burns them. *Moonlight Butterflies:
        Selene creates light-colored paper-like butterflies that causes major damage
        to those that become ensnared by it. In her Dragon Form, this attack takes
        the form of a large beam of "moonlight" energy that blasts her opponent into
        the ground. *Moonlight Blade: Selene swipes her arm sideways as she fires
        numerous crescent blades made of moonlight at her target. The speed of these
        blades is significantly high, leaving Suzaku unable to react in time to properly
        block, let alone avoid, the blades. *Moonlight Palm: With Selene''s arm being
        raised forward, her palm facing the target, a blast of moonlight is launched
        toward said target, causing a large, columnar explosion to be created. In
        her Dragon Form, Selene slams her hand down on her opponent and creates a
        large blast of "moonlight" energy. Selene Moon Dragon''s Roar.jpeg|Moon Dragon
        God''s Roar Fairy Tail Selene Transfer.jpeg|Relocation Selene Moonlight Flame.jpeg|Moonlight
        Conflagration Dragon Form Selene Moonlight Butterflies.jpeg|Moonlight Butterflies
