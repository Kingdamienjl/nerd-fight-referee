      the latter being powered by 2 Chaos Emeralds; both of whom together [https://youtu.be/radbtEhVPDE?t=341
      previously beat Adventure Rouge]. With just one Emerald, Emerl [https://youtu.be/Qv0zYwKyvG0?t=1749
