      he [https://youtu.be/BaTKL2XL-4I?t=1408 fought Emerl with all 7 Chaos Emeralds]
      and [https://youtu.be/BaTKL2XL-4I?t=3286 later fought him again to a standstill].
      Fought Emerl [https://cdn.imgchest.com/files/362a22c88674.mp4 after giving the
      Gizoid the last Chaos Emerald needed]), higher with Chaos Energy (With the Ichikoro
      Gauge, Shadow is able to defeat comparable opponents in a single strike), far
      higher with the Shadow Rifle ([https://imgur.com/a/sZEoNEB It's referred to
      as his strongest weapon, capable of one-shotting even the strongest Black Arms
      like Black Oaks]) and Hidden Potential ([https://imgur.com/a/witness-might-of-power-BengFxi
      Chaos Actions are referred to as his true power], with only these moves being
      able to destroy structures and enemies Shadow would otherwise be unable to damage)
