- id: claim-standard-equipment-d5b7f369
  section: equipment
  axis: equipment
  text: 'File:Air Shoes Design Maria.png|Maria''s design for Shadow''s Air Shoes.
    File:Shadow Inhibitorlessness.png|Shadow''s Inhibitor Rings. File:Chaos Control
    teleportation.gif|Shadow with a Chaos Emerald in his possession. *Air Shoes: Originally
    created by Gerald Robotnik to aid his mobility, these are the shoes worn by Shadow
    the Hedgehog. They allow him to hover in mid-air and glide just above the surface
    of any terrain, enabling Shadow to reach and sustain his incredible speeds without
    issue. They were designed by Maria.Sonic X Shadow Generations: Gerald Robotnik''s
    Journal (Entry #651) *Inhibitor Rings: These Rings, appearing as the cuffs of
    Shadow''s gloves, were created to keep Shadow''s power in check due to his potential
    for power being too great. *Chaos Emerald: Typically seen with the Green one,
    Shadow commonly holds a Chaos Emerald on his person to utilize the fuller extent
    of his Chaos Powers. With it, he can utilize Chaos Control to establish dominion
    over both space and time. File:Shadow Yellow Chaos Emerald.gif|Shadow using a
    Chaos Emerald for an energy attack. *Chaos Emerald: Same as before, although Shadow
    has also been seen with the Yellow Chaos Emerald. Optional'
