  axis: weakness
  text: His uncertainty regarding his past after Sonic Heroes made him somewhat vulnerable
    to manipulation, but is resolved by the end of Shadow the Hedgehog. Chaos Control
    drains Hero Mode quicker, and Chaos Blast does the same with Dark Mode. Removing
    his Inhibitors [https://postimg.cc/JsTqwp2K will drain his stamina quickly], but
    [https://imgur.com/F2Wmh0S it takes a decent amount of time for him to burn out].
    He [https://imgur.com/a/Rr3FA7r is prone to taking risks, dabbling with danger],
    and [https://postimg.cc/ykBmbVL9 will take extreme measures to achieve his goals];.
    *Dark Spin
