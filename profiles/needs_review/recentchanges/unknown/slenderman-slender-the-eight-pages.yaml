    - field: standard_equipment
      value: 'The 8 Pages: The Pages are 8 pieces of paper that have crude drawings
        and warnings relating to Slenderman. The more pages one collects, the more
        aggressive Slenderman becomes and the more prominent he becomes in your mind.
        Victims start to hear increasingly loud ambient noises and apparently thunderous
        footsteps while slowly becoming more obsessed with Slenderman. If the victim
        manages to collect all 8 pages then capture is almost guaranteed. If the victim
        survives this then they will be completely obsessed with the faceless horror,
        drawing pages of their own and panicking at the mere sight of him. It also
        makes them more vulnerable to becoming a proxy for Slenderman.'
      source_id: vsbattles-slenderman-slender-the-eight-pages-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Gifted (He has been shown to be incredibly cunning, using his fire powers
