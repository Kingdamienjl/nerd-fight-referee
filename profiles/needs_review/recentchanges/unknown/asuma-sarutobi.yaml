- id: claim-weaknesses-d28c3580
  section: weaknesses
  axis: weakness
  text: 'Nothing notable Notable Attacks/Techniques: Futon (Wind Release): One of
    the five basic elemental nature transformations. It is performed by making chakra
    as sharp and thin as possible. Wind Release consists primarily of short to mid-ranged
    offensive techniques that combine brute force and keen precision to administer
    cutting and slashing damage. Wind techniques are usually performed by generating
    air circulation and can be enhanced through this method as well. Wind-natured
    chakra can also be channeled into blades to increase their cutting power and extend
    their range. *Hien (Flying Swallow): Asuma focuses wind nature chakra into his
    special knuckle blades to expand their attack range and greatly enhance their
    cutting power. The density of the chakra is so high it becomes visible and can
    easily slice through rock and iron. *Futon: Fujin no Jutsu (Wind Release: Dust
    Cloud Technique): This technique creates a stream of high-velocity winds containing
    countless dust particles, providing a devastating mid-range offensive attack.
    Katon (Fire Release): One of the basic elemental nature transformations. It is
    performed by molding superheated chakra inside the stomach before releasing it
    via the lungs and mouth. Fire jutsu are usually mid-range and can cover a wide
    area. The force of the fire chakra is similar to an explosion as it can carve
    craters into rocks. There are also variants to this in the form of some mediums,
    such as the use of gunpowder, explosive tags, and chakra flow into a weapon. *Katon:
    Haisekisho (Fire Release: Burning Ash Pile): The user spews a stream of chakra
    infused gunpowder from their mouth, which fills the area. As the powder is composed
    entirely of ash, it stays in the air around the victim like a cloud. Once the
    target is engulfed, the user will ignite the ash cloud, causing it to detonate
    and become a blazing inferno. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== Category:Characters Category:Naruto Category:Anime Characters Category:Male
    Characters Category:Heroes Category:Good Characters Category:Knife Users Category:Fire
    Users Category:Humans Category:Manga Characters Category:Teachers Category:Parents
    Category:Ninjas Category:Martial Artists Category:Air Users Category:Smoke Users
    Category:Chi Users Category:Duplication Users Category:Acrobats Category:Self-Sustenance
    Users Category:Inorganic Beings Category:Surface Scalers Category:Paralysis Users
    Category:Afterimage Users Category:Statistics Amplification Users Category:Stealth
    Masters Category:Free Movement Users Category:Illusionists Category:Shapeshifters
    Category:Adults Category:Weapon Masters Category:Energy UsersCategory:Extrasensory
    Perception Users Category:Weapon Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-15a12757
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Martial Arts, Weapon Mastery, Acrobatics,
    Chakra Manipulation, Smoke Manipulation, Statistics Amplification (Shinobi are
    capable of enhancing their physical capabilities with the use of chakra. The Shunshin
    no Jutsu allows Shinobi to greatly enhance their speed by focusing chakra in their
    feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and
    Water Walking (By focusing chakra at the soles of their feet, Shinobi can scale
    and cling to vertical surfaces, and even walk on waterNaruto Chapter 18Naruto
    Chapter 90), Wind Manipulation, Fire Manipulation, Limited Weapon Control and
    Damage Boost (Can channel Chakra Flow through his Wind Release into his blades
    to increase it's sharp strike, changing it's shape making the blade longer than
    it appears through chakra), Afterimage Creation, Stealth Mastery, and Speed Enhancement
    (The Substitution Jutsu allows its user to instantly replace themselves with a
    nearby object such as a tree log, plant, person, or clone at the exact moment
    they are attacked. The Jutsu works even if the user is physically restrained or
    observed by characters as observant as Sharingan or Sage Mode users. This creates
    the optical illusion of the user being hit, which confuses the opponent and gives
    them an opening to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto
    Chapter 374Naruto Chapter 580Naruto Chapter 674), Minor Illusion Creation and
    Duplication (With the Clone TechniqueRin no Sho, Page 220, Shinobi can create
    illusionary duplicates of themselves that have no physical substance), Shapeshifting
    (With the Transformation TechniqueRin no Sho, Page 220, Shinobi can transform
    themselves into other people, animals, plants, and even inanimate objects, such
    as weapons), Paralysis Inducement (With the Temporary Paralysis TechniqueRin no
    Sho, Page 176, Shinobi can completely paralyze their targets from close to mid
    range) All previous, *Regeneration (Low-Godly - Edo Tensei are capable of regenerating
    from the complete destructionNaruto Chapter 517 page 8 and 9 of their bodiesNaruto
    Chapter 561. It's stated that as long as the soul remains, the Edo Tensei will
    keep coming back to lifeNaruto Chapter 120Naruto Chapter 518) *Immortality (Types
    1, 2, 3, 4, 7 and 8 - Edo Tensei are corpses possessed by a soul brought back
    from the Pure Land. They are incapable of feeling pain along with being able to
    survive grievous injuries such as bisectionNaruto Chapter 523 and dismemberment.Naruto
    Chapter 520 page 21 Edo Tensei will keep coming back so long as their soul remains
    bound to the Edo realmNaruto Chapter 120Naruto Chapter 518) *Inorganic Physiology
    (Type 1 - Edo Tensei bodies are comprised of dust and ash enveloping an already
    deceased corpse shaping it into the revived person the caster choosesNaruto Chapter
    119) *Self-Sustenance (Types 1, 2 and 3 - The Edo Tensei are the souls of the
    dead the caster wants to reanimate, the caster uses an already dead body to house
    the revived soulNaruto Chapter 520) *Instinctive Action (Edo Tensei are programed
    to automatically counter enemy jutsuNaruto Chapter 547 along with their bodies
    moving of its own accordNaruto Chapter 548) *Resistance to Mind Manipulation,
    Empathic Manipulation and Emotion Detection (Even though Edo Tensei are able to
    retain their consciousness when brought back from the afterlife, the controller
    can suppress their free willNaruto Chapter 119 Page 16 binding their mind and
    shutting off all emotionNaruto Chapter 522)
