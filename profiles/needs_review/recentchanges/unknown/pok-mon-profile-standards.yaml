        move causing recoil damage to the user. * Bubblebeam: The user shoots concentrated
        bubbles at the enemy, with a chance to reduce their speed. * Ice Beam: A beam
        of cold that has a chance to freeze the enemy solid. * Blizzard: A gust of
        cold wind that hits all enemies and has a chance to freeze the enemy solid.
        * Submission: A strong physical move that deals recoil damage to the user.
        * Seismic Toss: A fighting-type move that deals a fixed amount of damage.
        * Rage: An attack that deals a constantly increasing amount of damage at the
        cost of forcing the user to only use this move. * Thunder: A strong electric
        attack with a chance to paralyze with low accuracy. * Earthquake: A skill
        that provokes an earthquake. * Fissure: The user opens up the earth and crushes
