        \ existence is reliant on the culprit's soul, and as such the Labyrinth will\
        \ do anything in its power to block a truthseeker, such as Yuma, from reaching\
        \ it. With Shinigami\u2019s power, Yuma can directly interact with the Labyrinth,\
        \ fight against the Mystery Phantoms as its defense mechanism, and even impact\
        \ its structure like he did against Yomi's Mystery Phantom. Makoto and Yuma's\
        \ clash was also heavily impacting the environment of the Mystery Labyrinth\
        \ throughout their fight, which eventually shattered after Makoto was defeated.)"
      source_id: vsbattles-yuma-kokohead-unknown
