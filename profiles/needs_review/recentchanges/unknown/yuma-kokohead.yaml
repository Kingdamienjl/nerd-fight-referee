  intelligence:
    text: "Standard Tactics: *As a trainee, Yuma will typically avoid trouble and\
      \ is usually only delegated to information gathering tasks to begin with. Despite\
      \ this, he will usually find himself stuck in situations that he requires his\
      \ allies help in. His innate sense of justice and protection of others will\
      \ typically be the cause of this. Yuma will agree to investigate cases for the\
      \ ethics rather than for any monetary purposes like Halara. *Yuma will typically\
      \ avoid physical confrontation in the real world, and instead rely on sneaking\
      \ around or other utilities available to him (such as his allies\u2019 Fortes).\
      \ *Yuma will usually only use the Mystery Labyrinth when he is completely cornered,\
      \ and will hesitate to use the Labyrinth given it will kill the true culprit.\
      \ Despite this, he typically requires the Mystery Labyrinth to be able to conclusively\
      \ solve the case, at least in regards to cases as complex as the ones he faced\
      \ in Kanai Ward, and would need to gather ample evidence beforehand to make\
      \ into Solution Keys in order to return alive. *Number One will solve any case\
      \ independently, following the WDO creed to discard all emotions and reach a\
      \ perfect solution through a perfect deduction. As such, his methods and movements\
      \ are mysterious, but has the full resources of the WDO and UG at his disposal.\
      \ *In cases where a \u2018perfect solution\u2019 is not capable of being achieved\
      \ just through his intellect, he will turn to the Book of Death and use Shinigami\u2019\
      s power to erase his memories, sacrificing them for his ideals."
    source_ids: *id002
    confidence: 0.8
