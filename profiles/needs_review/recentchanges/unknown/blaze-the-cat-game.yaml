- id: claim-powers-and-abilities-e83435c4
  section: abilities
  axis: hax
  text: "Border|||Content= *Superhuman Physical Characteristics (Blaze has similar\
    \ acrobatic agility to Sonic, being able to perform many similar actions and tricks)\
    \ **Space Survival (Capable of surviving in the vacuum of spaceSonic Speed Simulator)\
    \ **Acrobatics (All Types; Blaze can mix her natural agility with pyrokinesis\
    \ to traverse various environment at high speed, matching Sonic\u2019s athleticism.\
    \ She can travel through corkscrews and loops at high speeds through various terrain,\
    \ being capable of controlling her trajectory mid-air through self-propelled dashes,\
    \ can perform mid-air tricks, and often showcasesSonic the Hedgehog (2006): Silver's\
    \ Story and performing acrobatic actsSonic Generations: Crisis City Restored)\
    \ ***Free Movement (Water Walking; Blaze is capable of running across the surface\
    \ of water) *Small Size (Type 0; Blaze stands at 95cm) *Absorption (Of Rings)\
    \ *Expert Hand-to-Hand Combatant (Her fighting style gracefully combines elegant\
    \ movements with ferocious flames. Stalemated Sonic in combat and managed to incapacitate\
    \ KnucklesSonic Rush (Blaze's Story)) **Instinctive Action (Fought in perfect\
    \ coordination with Silver without thinking Fought in perfect coordination with\
    \ Silver without thinkingSonic Channel Calendar \u201COtherworld Comedy\u201D\
    \ Story Act 8: Reunion With the Magical Princess (August 2023)) **Analytical Prediction\
    \ (Can predict her enemies'Sonic Rush Saikyou Kouryaku Guide moves and note flaws\
    \ in themSonic Rush Blaze Story: Water PalaceSonic Rush Sonic Story: Huge Crisis)\
    \ *Vehicular Mastery (Can race on Extreme Gear. Able to pilot aircrafts, vehicles\
    \ and Extreme Gears with immediate expertise]) *Extrasensory Perception & Enhanced\
    \ Senses (Can sense the Sol Emeralds and dimensional disturbances, as well as\
    \ the flames of other beings) *Non-Physical Interaction (Ghost & Spirits; Can\
    \ harm Pumpkin Ghosts, and should be capable of interacting with the Boos and\
    \ Boom BoosSonic Speed Simulator) *Toon Force **Elasticity (Can survive and recover\
    \ from being flattenedTeam Sonic Racing) **Hammerspace (Similar to Sonic and others,\
    \ Blaze can store items and Sol Emeralds within such a space) **Breaking the Fourth\
    \ Wall (In the Rush games, Blaze will jump out and get scared if you touch her\
    \ on your screen. Can interact with speech bubbles) *Fire Manipulation, Explosion\
    \ Manipulation & Heat Generation (Blaze has pyrokinesis strong enough to stay\
    \ alight while underwater or outer spaceSonic Rush: Water Palace, and can harness\
    \ it in a variety of ways. During combat she can erupt pillars & walls of flames,\
    \ shoot a continuous stream of fire or spam it as bullets, combust objects and\
    \ generate blasts of flames. Blaze has perfect control of the heat of her flames\
    \ making it harmless when using it on her allies and thawing beings who were frozen\
    \ solid.Sonic Rush Adventure]. Can use her flames to accelerate at high speeds,\
    \ propel herself in the air or soften her descentSonic Rush Sonic Story: VS BlazeSonic\
    \ the Hedgehog #59Sonic the Hedgehog #64, page 23Sonic the Hedgehog #4Sonic the\
    \ Hedgehog #11Sonic the Hedgehog #58Sonic the Hedgehog #60. She can also use her\
    \ fire as a light source when in) dark areas) **Limited Power Nullification (Can\
    \ easily dispel columns of fire and erase beings of fire) **Speed Amplication\
    \ & Flight (Can use her flames to accelerate at high speeds, propel herself in\
    \ the air or soften her descent. **Damage Boost (Can coat her melee strikes in\
    \ flamesSonic the Hedgehog Issue 59Sonic Channel Calendar - July 2024Sonic Rush\
    \ - Blaze's Story (Night Carnival)) **Fiery Aura (Explosive) ***Spin Attack (Unique;\
    \ Both her Fire Claw and Burst Dash are her own versions of the Homing Attack\
    \ and the Spin Attack imbued with her fire powers, thus she should be able to\
    \ use the applications of the Spin Attack with them) ***Boost (Fire Boost) *Accelerated\
    \ Development (Leveling, Other; Physical Stats and Abilities. Characters are capable\
    \ of gaining experience per step taken, with each level up increasing speed, jump\
    \ height, and experience gained to a maximum of Level 134; through Rebirths, they\
    \ can increase their base statsRebirths are canonical, as Dr. Eggman accidentally\
    \ rebirthed the entire timeline by using Rebirth Energy.) *Sealing, BFR, Time\
    \ Stop/Time Manipulation, & Teleportation (Successfully sealed Iblis within herself\
    \ where Silver could not, also sealing herself in another dimension after using\
    \ Chaos Control.Sonic the Hedgehog (2006): Silver's Story Upon Barry's suggestion\
    \ to use Chaos Control for a bomb they believed would detonate, Rouge states it\
    \ would be possible if they had a Chaos Emerald.The Murder of Sonic The Hedgehog\
    \ Has deep knowledge on how the emeralds work, seen as how she was the one to\
    \ explain to Silver their functionsSonic the Hedgehog (2006): Silver's Story)\
    \ *Dimensional Travel (Can travel freely in both Sonic's world and her own with\
    \ the Sol EmeraldsSonic Rush Adventure - EX Prologue Sonic Channel (Japanese).\
    \ Characters: Blaze. Sega. Archived from the original on 26 May 2019. Retrieved\
    \ on 3 July 2015."
