    - field: weaknesses
      value: 'Blaze is acrophobic, becoming nervous and jittery when in high places.
        Tends to be stubborn and introverted. Hotheaded and susceptible to taunts.,
        Pyrokinesis: With her pyrokinesis, Blaze can conjure up flames at any place
        on or all over her body for various offensive effects, such as turning herself
        into a burning projectile, forming a cloak of flames or increase the damage
        of her blows. She can even ignite and raise large columns of fire from the
        ground from afar. Offense aside, she can also use her pyrokinesis defensively
        by conjuring up fields of fire around her as protection. She can also use
        her flames to propel herself forward, increasing her speed and/or granting
        her limited flight. Blaze''s pyrokinesis also gives her limited heat resistance,
        making her invulnerable to certain types of flames, Axel Jump: Blaze jumps
        into the air before spinning into her opponent while wreathed in flames.,
        Axel Tornado: When performing the Axel Tornado, Blaze sends herself into the
        air in a manner similar to an axel jump. Once in midair, Blaze unleashes a
        burst of fire under her feet with her pyrokinetic abilities while twirling
        around horizontally, allowing her to launch herself higher into the air and
        reach higher altitudes at different speeds. Blaze uses her pyrokinesis to
        emit fire during her ascent, enabling her to deal damage to enemies and break
        obstacles., Burst Dash: Blaze crouches on the floor, using her pyrokinesis
        to build up speed and momentum before rushing forth as a fiery tornado., Burst
        Hover: Blaze uses her flames to hover a short, Fire Boost: Blaze runs while
        generating a cone of flames around her to ward off projectiles and smash through
        enemies., Spinning Claw: While on the ground Blaze pirouettes around while
        releasing flames around her to damage enemies., Fire Claw: Much like the Homing
        Attack, Blaze launches herself forward with a small burst of flames and homes
        in on a nearby enemy to attack. However, instead of going into a mid-air Spin
        Attack like the Homing Attack, Blaze horizontally spins her body, sticking
        her right arm out in front of her to strike the foe. Burning Blaze:, Burning
        Fire Boost: A vastly more powerful version that she can only use as Burning
        Blaze'
