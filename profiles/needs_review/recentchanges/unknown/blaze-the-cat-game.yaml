- id: claim-weaknesses-8568be93
  section: weaknesses
  axis: weakness
  text: 'Blaze is acrophobic, becoming nervous and jittery when in high places. During
    Sonic Rush, she was stubborn and introverted, but overcame this by the end of
    the game. Hotheaded and susceptible to taunts. The altitude her flying abilities
    can reach is limited | None notable Notable Attacks/Techniques: Notable Attacks/Techniques:
    *Pyrokinesis: With her pyrokinesis, Blaze can conjure up flames at any place on
    or all over her body for various offensive effects, such as turning herself into
    a burning projectile, forming a cloak of flames or increase the damage of her
    blows. She can even ignite and raise large columns of fire from the ground from
    afar. Offense aside, she can also use her pyrokinesis defensively by conjuring
    up fields of fire around her as protection. She can also use her flames to propel
    herself forward, increasing her speed and/or granting her limited flight. Blaze''s
    pyrokinesis also gives her limited heat resistance, making her invulnerable to
    certain types of flames, such as those in the environment. **Axel Jump: Blaze
    jumps into the air before spinning into her opponent while wreathed in flames.
    **Axel Tornado: When performing the Axel Tornado, Blaze sends herself into the
    air in a manner similar to an axel jump. Once in midair, Blaze unleashes a burst
    of fire under her feet with her pyrokinetic abilities while twirling around horizontally,
    allowing her to launch herself higher into the air and reach higher altitudes
    at different speeds. Blaze uses her pyrokinesis to emit fire during her ascent,
    enabling her to deal damage to enemies and break obstacles. **Burst Dash: Blaze
    crouches on the floor, using her pyrokinesis to build up speed and momentum before
    rushing forth as a fiery tornado. **Burst Hover: Blaze uses her flames to hover
    a short **Fire Boost: Blaze runs while generating a cone of flames around her
    to ward off projectiles and smash through enemies. **Spinning Claw: While on the
    ground Blaze pirouettes around while releasing flames around her to damage enemies.
    **Fire Claw: Much like the Homing Attack, when performing the Fire Claw, Blaze
    launches herself forward with a small burst of flames and homes in on a nearby
    enemy to attack. However, instead of going into a mid-air Spin Attack like the
    Homing Attack, Blaze horizontally spins her body, sticking her right arm out in
    front of her to strike the foe. *Cyan Laser: Using the power of a Cyan Wisp, Blaze
    transforms into a cyan laser beam. As the Cyan Laser, Blaze gains the same properties
    as that of a real laser, allowing her to move as a living beam of light. When
    hitting any surfaces as the Cyan Laser, Blaze can also bounce off them as if they
    were reflective surface. *Indigo Asteroid: Using the power of an Indigo Wisp,
    Blaze turns into an orb-shaped body with striped indigo skin and a matching planetary
    ring encircling her middle. As the Indigo Asteroid, Blaze essentially becomes
    a miniature planet with a strong gravitational field. Blaze is as such capable
    of creating a powerful gravitational pull around herself, strong enough to tear
    all kinds of objects to pieces and pull them into the Asteroid Ring. Additionally,
    the gathered matter can be used to empower the gravitational pull. The Indigo
    Asteroid also grants Blaze the ability to levitate through midair. *Yellow Drill:
    Using the power of a Yellow Wisp, Blaze turns into a yellow spiral drill. As the
    Yellow Drill, Blaze can burrow and tunnel underground at remarkable high speeds
    and can be applied underwater, allowing Blaze to move through water like a living
    torpedo. Pets: Also referred to as Friends, these creatures will hover closely
    behind their wielder that typically focus on granting benefits on several stats;
    * Experience (The amount of experience gained when defeating an opponent) * Rings
    (the amount of Rings gained per a single Ring) * Damage (the amount of damage
    dealt to bosses and powerful enemies). * Stamina (The amount of energy consumed
    when Boosting) * Air (The amount of time possible to spend underwater without
    air) * Luck (Non-Combat Applicable). Up to 3-5 Pets can be equipped at a single
    time, stacking the benefits from each. For a full reference of different Pets
    and their impact, see here. Trails: Trails are equippable items that range from
    Level 1 to Level 25 at maximum. They typically focus on increasing three statistics,
    but different Trails offer benefits that include other statistics. Like Pets,
    these include altering; * Experience * Rings * Damage * Stamina * Air Unlike Pets,
    only one trail can be equipped at any given time. For a full reference of Trails
    and their impact, see here. Credit and thanks to the Sonic Speed Simulator wiki.
    *Burning Fire Boost: A vastly more powerful version that she can only use as Burning
    Blaze, she emits flames from her waist down to propel her at speeds sufficient
    to easily smash through an oncoming meteor. List of all the item boxes in the
    Sonic Series == Gallery == Vela Nova (CD Version) - Theme of Blaze BurningBeauty'
  source_ids: *id003
  decisive: false
  status: unverified
