- id: claim-weaknesses-48a0b6af
  section: weaknesses
  axis: weakness
  text: 'None notable | None Notable | None Notable Notable Attacks/Techniques: *
    Bite: An orange attack that deals a fair amount of damage towards an enemy. *
    Bash Jam: A red attack that Bonnie strums on his guitar deals a bit less damage
    than Bite towards multiple enemies. * Happy Jam: A pink attack that Bonnie strums
    on his guitar to heal all members in the party. ==Notable Matchups== Victories:
    Losses: Inconclusive: Category:Characters Category:FNAF World Category:Rabbits
    Category:Robots Category:Male Characters Category:Bodily Weaponry Users Category:Healers
    Category:Summoners Category:Resurrection Users Category:Statistics Amplification
    Users Category:Energy Users Category:Life Users Category:Explosion Users Category:Death
    Users Category:Power Mimicry Users Category:Statistics Reduction Users Category:Curse
    Users Category:Supernatural Luck Users Category:Comedy Characters Category:Playable
    Characters Category:Role-playing Characters Category:Video Game Characters Category:Good
    Characters Category:Heroes Category:Protagonists Category:Game Characters Category:Sound
    Users Category:Musicians Category:Guitar Users Category:Stealth Masters Category:Self-Sustenance
    Users Category:Immortals Category:Non-Physical Interaction Users Category:Instinctive
    Action Users Category:Energy Projection Users Category:Forcefield Users Category:Damage
    Reduction Users Category:Regeneration Users Category:Weapon Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-b119b941
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Inorganic Physiology (Unknown Type;
    It''s unclear if he''s possessed or not like his game-counterpart) **Self-Sustenance
    (Types 2 & 3) **Immortality (Type 2; comparable to the Withereds, who can survive
    being faceless and handless, and to Mangle, who can not only survive being a bare
    endoskeleton, but was also implied to have been put apart and put back together
    like it''s canon counterpart) *Possibly Non-Physical Interaction (Can harm characters
    such as the Phantoms, RWQFSFASXC, Shadow Freddy, and Crying Child, with the former
    being illusions and last three being ghosts. However, since that''s how it''s
    like in the original canon and not FNAF World''s, it''s unclear if they retain
    these properties) *Bodily Weaponry (Via Bite) *Sound Manipulation (Via Bash Jam
    and and Happy Jam) *Healing (Via Happy Jam) *Stealth Mastery (In Foxy.EXE; able
    to hide from Kitten enemies by standing behind pillars) Bytes are supporting beings
    capable of fighting alongside the character. Chips are computer chips installed
    into the character giving them certain advantages during the battle. Only 4 of
    both can be equipped at the same time, however, The Fan and Pearl are present
    all the time. *Statistics Amplification (Via Headstart chips and Endless chips)
    *Limited Supernatural Luck (Via Run: Luck chip) *Resurrection (Via Auto: Giftboxes
    chip) *Enhanced Regeneration (To an unknown extent; Via Auto: Regen chip, Medpod
    bytes and Pearl) *Curse Manipulation & Statistics Reduction (Decreases all opponent''s
    stats via Curse: Status chip) *Forcefield Creation & Damage Reduction (Via Auto:
    Shield chip and Shield bytes) *Enhanced Power Mimicry (Via Auto: Mimic chip) *Summoning
    (Via Freddle: Fury, Pizza: Fury & Evercomet chips) *Death Manipulation (Via Reaper
    bytes) *Explosion Manipulation (Via Bomb bytes) *Life Drain (Via Eyebot bytes)
    *Energy Projection (Via UFO bytes and Fan) *Automatic Counter Attack (Counter:
    Bite; damages all enemies that attack automatically) Resistance to: *Status Effect
    Inducement (Via Block: Jumpscare chip) *Death Manipulation (Via Block: Unscrew)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
