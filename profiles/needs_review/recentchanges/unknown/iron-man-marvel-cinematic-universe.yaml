    sluggish to move around, with many of its hinges exposed to the elements and outside
    forces to exploit and temporarily disable the suit''s movement systems with only
    flamethrowers and a missile to use for long-range combat, and the original 3 gigawatt
    arc reactor it was powered by wasn''t designed for sustained flight. The Mark
    2 originally suffered from a fatal ice buildup if it approached altitudes exceeding
    40,000 feet, resulting in the main transducer feeling sluggish at said altitudes
    and the hull pressurization becoming problematic, which Tony remedied by using
    a gold-titanium alloy from his Seraphim tactical satellite in order to maintain
    fuselage integrity and maintain power-to-weight ratio. While suffering from palladium
    poisoning, he suffered from an episode of recklessness. Suffered from a period
    of insomnia and several episodes of PTSD during the events of Iron Man 3. Weaker
    armors can''t handle extreme conduction | The more damage the Mark 50 armor takes,
    the fewer nanomachines that can be used to regenerate it or make weapons. {| class="mw-collapsible
