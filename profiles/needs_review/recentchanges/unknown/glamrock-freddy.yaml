    Users Category:Bears Category:Protagonists Category:Good Characters Category:Glass
    Cannons Category:Honorable Characters Category:Disabled Characters Category:Tragic
    Characters Category:Information Analysis Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
