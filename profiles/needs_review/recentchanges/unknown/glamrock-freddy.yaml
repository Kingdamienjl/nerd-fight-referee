- id: claim-powers-and-abilities-9c03f31b
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Inorganic Physiology (Type 2), Self-Sustenance
    (Types 1, 2, and 3), Immortality (Type 2; Comparable to other Glamrock animatronics.
    Can still function both as a severed head and as a heavily damaged body without
    a head), Natural Weaponry (With teeth and claws), Information Analysis (Like the
    Toy animatronics, he has a built-in facial recognition software designed to identify
    registered customers in the pizzaplex), Limited Fire Manipulation (Has a lighter
    located in his finger), Resistance to Technology Manipulation (Minor; Resisted
    the Mimic1 Virus multiple times), Extreme Heat/Cold (Can withstand the temperature
    that can be as high to melt dense ice blocks or as cold to freeze metal, which
    fluctuation is refered as extreme by himself), Electricity and Water Manipulation
    (Advanced animatronics aren''t affected by short-circuit caused by water and electrical
    charges, as they can submerge in a sewer and resist several electrocutions, even
    without their casings) | Same as before, plus: Enhanced Senses (With Roxanne''s
    eyes. Can see hidden objects and movement through the walls. Stated to be able
    to see new colors which implies infrared and/or ultraviolet vision. Can see things
    that are invisible and was able to perceive Vanny despite her being normally invisible
    to the other animatronics), Sound Manipulation (With Chica''s voicebox. Can stun
    S.T.A.F.F Bots and other animatronics with a shout. Can also deactivate electronic
    locks)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
