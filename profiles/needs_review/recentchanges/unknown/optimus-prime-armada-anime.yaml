    - field: weaknesses
      value: 'Even after the fued between the Autobots and Decepticons ended, Unicron
        re-awoke due to Optimus and Galvatron''s undying hatred for each other. By
        the time he receives his own Powerlinx upgrade, none of the three legendary
        weapons are available to him, and Optimus abandons the Transformer Matrix.
        {| class="mw-collapsible mw-collapsed" align="center" border="1" cellpadding="1"
