        " |Notable Attacks/Techniques: |- | OptimusTruckArmada.png|Vehicle Mode Comrade_optimus_supermode.webp|Super
        Mode Linkup_jet_prime.webp|Jet Optimus * Vehicle Mode: Optimus Prime can transform
        into a truck with a trailer, allowing him to traverse through environments
        more quickly. * Super Mode: Optimus can fuse with his trailer to transform
        into his Super Mode, a form far stronger and larger than his normal state
        allowing him to stomp regular Decepticon troops and turn a fight to his favour.
        In this form he can combine with Overload. ** Jet Optimus: By fusing with
        Jetfire and transforming into his Super Mode, Optimus can reach an even more
        powerful and larger transformation with the additional ability of flight.
        He still can combine with Overload as well like his previous form. |} ==Notable
