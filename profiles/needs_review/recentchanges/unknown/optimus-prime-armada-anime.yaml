- id: claim-standard-equipment-82639f55
  section: equipment
  axis: equipment
  text: '| ArmadaMatrix.jpg|Transformer Matrix OptimusPrimeUT-Armada.jpg|Rifle Underground_optimus_truckmode.jpg|Trailer
    Comradesparkplug.jpg|Sparkplug Puppet_optimus_overload.webp|Overload * Transformer
    Matrix: An artefact of great power that only the most worthy of Cybertronians
    can wield. Optimus Prime wearing it represents his position as leader in the Autobot
    army. Optimus uses the Matrix against the Hydra Cannon as a last resort to save
    Earth, though it destroyed his body in the process. * Rifle: Optimus'' main form
    of offensive attack within the series. A handheld gun that shoots energy beams
    from it, which allows him to attack from long distances. * Trailer: The trailer
    he caries around actually has multiple uses, such as being used as a base of communication,
    or one to fire energy blasts from for either the Mini-Cons or humans. He can even
    fuse himself with the trailer to transform into his Super Mode. * Sparkplug: Discovered
    and acquired by Optimus Prime in a desert, Sparkplug is Optimus''s Mini-Con partner.
    By fusing with him he can increase his capabilities drastically allowing him to
    turn the battle to his favour, a devastating force for the Decepticons. Although
    Sparkplug is an ally of Optimus Prime, the Mini-Cons still do not wish to fight
    in the war and be used as weapons, which Optimus understands, only using Sparkplug
    at desperate situations in his Super Mode. * Overload: A Cybertronian that is
    visually shown to be and is treated as a far more powerful combiner for Optimus
    than Sparkplug, who merges with Optimus to grant him giant red shoulder cannons
    to fire from. He previously had an addition to Powerlinxing, forcing Mini-Cons
    to fuse with him which was self-destructive. Later realizing this he left the
    battle on Cybertron until he could fix this part of himself. |} {| class="mw-collapsible
    mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
    | colspan="2" style="text-align: left; " |Optional'
