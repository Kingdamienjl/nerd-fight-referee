    - field: attack_potency
      value: "Outerverse level (The Player views the games that they play as fictional\
        \ universes, even though their characters are capable of existing in the real\
        \ world. Games such as Pok\xE9mon even bring up the fact that they are video\
        \ games to the Player, and can enter their own games. They are even capable\
        \ of fighting beings that their own characters struggled with, such as Giygas,\
        \ and kill off the save files their characters are in, where saving is outright\
        \ acknowledged by in-game characters to be a canon feature. This would include\
        \ the game data within Ocarina of Time that houses the Golden Goddesses. They\
        \ are outright stated to have existed before the concepts of time and transcended\
        \ it, and can grant the world of Legend of Zelda concepts, including the concepts\
        \ of dimensions, as they exist within the Zelda cosmology, and they created\
        \ said cosmology. The Heavens also officially exist above everything else\
        \ within the Zelda cosmology, which dimensions do exist in, which the Golden\
        \ Goddesses would have created the concepts to, and the Player exists above\
        \ them. The Player is even capable of changing the setting and mechanics of\
        \ the universe, changing the time of the game, even without the use of an\
        \ Angry Sun/Moon. They can delete the save files within Pok\xE9mon, including\
        \ beings such as Arceus, who is able to erase all of existence, and views\
        \ existence and creation as a mere extension of itself, along with creating\
        \ everything within Pok\xE9mon, including creating Arceus' avatar, who created\
        \ Palkia, who controls all of time, which started when it was created. Characters\
        \ such as Culex owns all of creation, and can consume time, and some of Mario's\
        \ abilities can outright transcend time and space. The Void was going to destroy\
        \ all of creation, existence, and dimensions, and Cutout allows Mario to view\
        \ it as fiction, which the Player should upscale to. Exists above the Mario\
        \ cosmology, including places that time and space don't even exist within,\
        \ objects that can reset anything back to a previous state, including entire\
        \ worlds, and the Player themselves can delete entire levels within Super\
        \ Mario Maker 2, which are used within Mario to describe universes, including\
        \ universes such as Painting worlds, which were also fused with the universe.\
        \ Should exist above planes such as the Woah Zone, a plane beyond space itself.\
        \ The Player can't be comprehended by Mario in-game. Avatars such as Samus\
        \ have access to abilities that can destroy the universe, fought Dark Samus,\
        \ who had absorbed and became a being purely made of Phason, and again, who\
        \ at that time had survived the collapse of the Dark Aether. She also has\
        \ a suit powered by the Light Aether, which holds up a world. Exists above\
        \ Dyntos, who recreated the Galactic Sea, and Dyntos is powerful beyond even\
        \ Pit's imagination, and the Galactic Sea is stated to house galaxies. Dyntos\
        \ can even recreate clones of Palutena. Exists above Galeem and Dharkon, who\
        \ are above Arceus, which they turned into a spirit, who created the world\
