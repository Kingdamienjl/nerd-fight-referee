- id: claim-powers-and-abilities-f4b482e8
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Weapon Mastery, Regeneration (Mid-Low:\
    \ Comparable to Ness, who can recover after being damaged from explosion based\
    \ attacks. Can fully heal himself from physical wounds from eating or resting),\
    \ Non-Physical Interaction (Can interact and fight against ghosts and Intangibles,\
    \ such as Evil Elemental or Fenomeno), Information Analysis (Can check if his\
    \ surroundings have dangers against him, and see the statistics and weaknesess\
    \ of the opponents), Resistance to Radiation Manipulation (Can endure the Atomic\
    \ Reactor Robot\u2019s explosion without suffering any adverse effects from the\
    \ radiation), Likely Limited Resistance to Time Stop (Likely the same as Jeff's\
    \ given the similar opponents fought between the games) Telepathy (Via Telepathy),\
    \ Teleportation (Via Teleport), Healing and Purification (Type 3. Can heal himself\
    \ and/or allies from physical damage or, knocked out or status effects, that can\
    \ be this much), Statistics Amplification (Can increase power, durability or speed\
    \ of himself or an ally), Intangibility (Can use the 4-D Slip to make his body\
    \ escape in the 4th dimension to easily avoid to fight), Forcefield and Attack\
    \ Reflection (Can create shields which halve the damage received or reflect the\
    \ damage to the opponent), Statistics Reduction (Can decrease the durability of\
    \ the opponents), Sleep Manipulation (Can put enemies to sleep) Sound Manipulation,\
    \ Statistics Amplification and Statistics Reduction (Bullhorn allows one to amplify\
    \ their voice. If the enemy believes what the user is saying, their attack decreases,\
    \ otherwise it increases. Flea Bag decreases an opponent's both offense and defense),\
    \ Light Manipulation and Status Effect Inducement (Flashdark blinds the opponent.\
    \ Both StkyMachine and Rope completely block the opponent, making them unable\
    \ to move), Limited Poison Manipulation (Can instantly knock out insect-like opponents\
    \ with Insecticide and Super Spray), Limited Attack Reflection (Franklin Badge\
    \ reflects electric attacks), Damage Reduction (Pendants halve the damage from\
    \ PK Fire, Freeze, and Thunder respectively), Teleportation (Onyx Hook can teleport\
    \ the user to Magicant) Self-Healing and Purification (Type 3. Food can be used\
    \ to heal wounds, and Medicine can be used to heal from poison and cold)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
