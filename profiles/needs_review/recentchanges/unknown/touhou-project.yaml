    - field: powers_and_abilities
      value: 'Soul Manipulation & Absorption: Within all games in the Touhou Project
        series, Spirit may be reduced or absorbed in a variety of methods. In the
        bullet hell games, Spirit can be absorbed from enemies just by attacking them,
        and getting hit will result in a loss of spirit. In the fighting games, striking
        an opponent will cause their available Spirit to deplete, allowing one to
        continually reduce their Spirit through repeated attacks. Statistics Reduction
        & Amplification: Spirit in the bullet hell games directly correlates to the
        power of one''s shot, increasing as the amount of Spirit available increases.
        Conversely, lessening one''s Spirit will weaken them greatly. Stamina Reduction
        & Absorption: As Spirit is also equivalent to one''s stamina, reducing or
        absorbing Spirit is equivalent to reducing or absorbing stamina. Empathic
        Manipulation, Mind Manipulation, & Chi Manipulation: Spirit is equivalent
        to Temperament, the emotions of living beings and their subconscious, so manipulating
        Spirit allows one to manipulate these concepts as well. Attack Nullification
        & Transmutation: Striking an opponent will cause their projectile attacks
        to be converted to Spirit and be automatically absorbed by the attacker. Status
        Effect Inducement: By reducing an opponent''s Spirit enough, one may induce
        a ''guard crush'' that leaves the enemy briefly stunned. Power Nullification:
        Spirit is required to utilize many supernatural techniques, such as skill
        cards and flight. Due to this, draining an opponent''s Spirit will render
        them unable to use their abilities. Spirit is also considered a fundamental
        component in the usage of magic, Curiosities of Lotus Asia, Chapter 18 and
        due to the mental layer of reality, is directly tied to magic itself.Curiosities
        of Lotus Asia, Chapter 27 Regeneration Reduction: By fully depleting an opponent''s
        Spirit, one can reduce the rate at which their Spirit naturally regenerates.
        Supernatural Willpower: Via the natural regeneration of Spirit, allowing one
        to regain their stamina or recover from mental attacks in a short period of
        time., Resistance to Soul Manipulation: All characters can survive having
        their Spirit damaged or absorbed, even to the point of lacking Spirit entirely.
        The vast majority of characters in the series were also capable of surviving
        Tenshi absorbing the Spirit of all living things across the cosmology.'
      source_id: vsbattles-touhou-project-recentchanges
      provider_id: vsbattles
      authority: high
