    - field: intelligence
      value: "At least Average (Possesses high school level education) At least Gifted\
        \ (Has fought on par with and come out on top against several different Viltrumites,\
        \ which are a race of aliens possessing thousands of years of combat experience,\
        \ proficiency in martial arts techniques and melee weapon usage, and have\
        \ ample experience fighting as well as overtaking various different alien\
        \ civilizations, including Thragg, who in turn matched Battle Beast. He also\
        \ demonstrates the ability to learn and adapt his approach during high-pressure\
        \ battles. This skill eventually allows him to overcome other Viltrumite warriors,\
        \ like Conquest, by using his arrogance and predictability against him, he\
        \ stops holding back and eventually choking him to death. While his brawling\
        \ style made him a reckless but effective fighter, he later grows to become\
        \ a competent commander who leads the Combined Coalition forces to victory\
        \ against Thragg\u2019s ranks and manages to outmaneuver alien diplomats.\
        \ Yet, despite his tactical brilliance, Mark\u2019s tactical prowess is often\
        \ undermined by his rash decisions and overall lack of emotional control.\
        \ He is manipulated by Cecil Stedman more than once, becomes a victim of Robot\u2019\
        s scheme, and is constantly in danger of his moral fiber being compromised\
        \ due to his adherence to his personal code, such as when he allowed Angstrom\
        \ Levy and later Dinosaurus to live, with disastrous consequences for Earth\u2019\
        s security)"
      source_id: mediawiki-4680427
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: The Smart Atoms of Viltrumites cannot withstand high temperatures for
        long periods of time, with prolonged exposure weakening their durability as
        the atomic bonds are ripped apart. Pinpoint high intensity sound waves can
        disrupt a Viltrumite's inner ears and highly sensitize equilibrium, causing
        intense pain or potentially death. The Scourge Virus is a specially engineered
        virus that infects Viltrumites and severely hampers their strength and invulnerability,
        usually resulting in death. The Klaxus Plant will poison and weaken the species.
        Mark is strongly against killing and tends to hold back against opponents,
        regardless of the danger they pose to him and others due to fear that he'll
        accidentally kill them. However, this mindset changes after his first fight
        against Conquest.
      source_id: mediawiki-4680427
      provider_id: vsbattles
      authority: high
