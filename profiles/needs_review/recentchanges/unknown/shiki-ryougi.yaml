        been banned from tournaments. In addition, the self-suggestion also helps
        her fight more skillfully with a sword rather than a knife. She also has decent
        hand-to-hand fighting skills, effortlessly beating the bullies assaulting
        Enjou Tomoe. Furthermore, in a battle against a threat to humanity, such as
        Araya Souren, she would hunt and kill them with ruthless efficiency. | Omniscient
        (Is stated to be all-knowing due to be Akasha, the root of all things)
      source_id: mediawiki-8053
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Shiki needs to hit her opponent to use her Mystic Eyes properly. She\
        \ can only fight at her full potential with a sword rather than a knife. To\
        \ kill something with a complex death concept or an immortal, she needs to\
        \ overheat her brain and tap into her \"imagination.\" The Mystic Eyes of\
        \ Death Perception is limited to the user's vision of death. After knowing\
        \ Mikiya Kokutou and falling in love with him, Shiki is forced to suppress\
        \ her murderous nature and becomes a pacifist. As a result, she and Mikiya\
        \ were severely injured and almost killed in the battle against Lio Shirazumi.\
        \ | Same as before, except being a pacifist. | Void Shiki claimed to have\
        \ control over all creations and knows everything. Hence she is indifferent\
        \ and lackadaisical and will not take things seriously most of the time. {|\
