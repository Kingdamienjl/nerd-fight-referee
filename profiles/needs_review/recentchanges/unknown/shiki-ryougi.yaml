- id: claim-weaknesses-0fac763b
  section: weaknesses
  axis: weakness
  text: "Shiki needs to hit her opponent to use her Mystic Eyes properly. She can\
    \ only fight at her full potential with a sword rather than a knife. To kill something\
    \ with a complex death concept or an immortal, she needs to overheat her brain\
    \ and tap into her \"imagination.\" The Mystic Eyes of Death Perception is limited\
    \ to the user's vision of death. After knowing Mikiya Kokutou and falling in love\
    \ with him, Shiki is forced to suppress her murderous nature and becomes a pacifist.\
    \ As a result, she and Mikiya were severely injured and almost killed in the battle\
    \ against Lio Shirazumi. | Same as before, except being a pacifist. | Void Shiki\
    \ claimed to have control over all creations and knows everything. Hence she is\
    \ indifferent and lackadaisical and will not take things seriously most of the\
    \ time. {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"1\"\
    \ cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"\
    text-align: left; |Notable Attacks/Techniques: |- | : A rare type of Mystic Eyes,\
    \ classified as the highest rank, Rainbow, makes its ability on the level of Divine\
    \ Spirits. The Mystic Eyes of Death Perception allows Shiki to visualize the concept\
    \ of death in others as lines. While this ability is rooted in her eyes, even\
    \ if she were to go blind or lose her eyes, she could still \"see\" them. By cutting\
    \ along these lines and points, something that takes no actual exertion, the fated\
    \ destruction of the relevant part is realized. Due to this, it ignores all forms\
    \ of defense, and the effect it brings is absolute. The wounds it causes cannot\
    \ be healed, and it also destroys the victim utterly, nullifying even reincarnation.\
    \ Due to her direct connection to Akasha, the root of all things, her eyes are\
    \ incredibly powerful. Even several ranks higher than other Mystic Eyes of Death\
    \ Perception users such as Shiki Tohno, allowing her to \"kill\" concepts, such\
    \ as the artificial future created by a clairvoyant. thumb|330x330px|Shiki grabbing\
    \ Kirie Fujou with her Magical Prosthetic Arm Magical Prosthetic Arm: Shiki's\
    \ prosthetic arm allows her to grab things from a distance and affect the intangible,\
    \ such as ghosts. Ryougi Shiki (Void): The third personality, said to be the root\
    \ of all things (Akasha). The Void Shiki can be described as an \"almighty wish-granting\
    \ device\" and the source of all supernatural phenomena like Magecraft or ESP.\
    \ She also claimed to be able to rewrite the rules regulating atomic matter, travel\
    \ back in time, alter all life's evolution and development, or annihilate reality.\
    \ |} ==Notable Matchups== Victories: Losses: Inconclusive: ==Notes and Explanations==\
