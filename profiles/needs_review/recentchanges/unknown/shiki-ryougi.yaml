        \ as the highest rank, Rainbow, makes its ability on the level of Divine Spirits.\
        \ The Mystic Eyes of Death Perception allows Shiki to visualize the concept\
        \ of death in others as lines. While this ability is rooted in her eyes, even\
        \ if she were to go blind or lose her eyes, she could still \"see\" them.\
        \ By cutting along these lines and points, something that takes no actual\
        \ exertion, the fated destruction of the relevant part is realized. Due to\
        \ this, it ignores all forms of defense, and the effect it brings is absolute.\
        \ The wounds it causes cannot be healed, and it also destroys the victim utterly,\
        \ nullifying even reincarnation. Due to her direct connection to Akasha, the\
        \ root of all things, her eyes are incredibly powerful. Even several ranks\
        \ higher than other Mystic Eyes of Death Perception users such as Shiki Tohno,\
        \ allowing her to \"kill\" concepts, such as the artificial future created\
