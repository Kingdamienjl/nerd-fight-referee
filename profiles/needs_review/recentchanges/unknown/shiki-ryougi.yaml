  intelligence:
    text: Shiki is inept socially, being bitter, blunt, and to the point while feeling
      out of place in modern society. However, due to her traditional upbringing,
      she developed into an incredibly skilled swordswoman, comparable to Taiga Fujimura,
      a fifth-dan black belt who would've been ranked higher if she hadn't been banned
      from tournaments. In addition, the self-suggestion also helps her fight more
      skillfully with a sword rather than a knife. She also has decent hand-to-hand
      fighting skills, effortlessly beating the bullies assaulting Enjou Tomoe. Furthermore,
      in a battle against a threat to humanity, such as Araya Souren, she would hunt
      and kill them with ruthless efficiency. | Omniscient (Is stated to be all-knowing
      due to be Akasha, the root of all things)
    source_ids:
    - vsbattles-shiki-ryougi-unknown
    confidence: 0.6
    notes: auto_repair source extraction
