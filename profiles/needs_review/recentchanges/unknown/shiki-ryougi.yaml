  attack_potency:
    text: Large Island level+ (Managed to lightly injure Souren Araya in their first
      encounter. Fought dozens of Servants on the Moon Cell, presumably trading blows
      with some of them), higher with Self Suggestion (Word of God states that Shiki
      with a sword would stomp Shiki with a knife just as easily as Shiki slaughtered
      the puppets in Araya's apartment), Unknown with Mystic Eyes of Death Perception
      (Can kill inanimate and animate things, even concepts, by cutting their lines
      of death)
    source_ids:
    - vsbattles-shiki-ryougi-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Supersonic+ to High Hypersonic (Completely outsped an explosion at close
      rangeMach 4.44314 - 25.5102), with FTL reactions and combat speed (Killed 99
      Servants in Fate/Extra. Kept up with Souren Araya, albeit she was slightly inferior),
      higher with Self Suggestion (While severely injured and near death, she blitzed
      Souren Araya, who described her speed as "god-like" and as making him perceive
      time as stopped and even rewound. He also admitted that if it weren't for his
      bounded fields slowing down her movements, she would have killed him instantly
      with her first slash)
