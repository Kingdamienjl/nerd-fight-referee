  intelligence:
    text: 'At least Average, likely Above Average in general, Above Average in strategy
      and stealth (Despite being possessed by the spirit of a child, Bonnie is surprisingly
      intelligent. Apart from possessing basic skills such as understanding English,
      ending phone calls, and checking cameras, Bonnie and the other animatronics
      deliberately stored up their power for a week in order to escape the pizzeria,
      and are fully capable of placing traps and stalling for time. Where Bonnie truly
      excels, however, is stealth, as he can easily sneak into the night guard''s
      office and can take advantage of camera static and flickering lights to catch
      his target by surprise), Animalistic in awareness (Is stated to be animalistic
      by The Puppet and could be easily lured into the back room by Shadow FreddyFive
      Nights at Freddy''s 3 despite having been killed previously by being lured to
      the back room by a man in a costume) | At least Average, likely Above Average
      in general and Above Average in strategy and stealth, Animalistic in awareness
      (Same as before. He''s seemingly capable of tricking the night guard into thinking
