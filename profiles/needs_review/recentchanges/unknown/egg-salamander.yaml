    text: Low Multiverse level (Would have used the power of both the Chaos EMeralds
      and Sol Emeralds to create an Eggmanland that would have transcended Sonic and
      Blaze's dimensions. Completely drained the energy of the Sol Emeralds, the presence
      of which in conjunction with the Chaos Emeralds was causing Blaze's universe
      to merge with Sonic's and ultimately would've caused both universes to collapse.
      Fought toe-to-toe with Modern Super Sonic and Burning Blaze separately and could
      even harm them with specific attacksVaries from 2 Universes to 6 Universes),
      can negate conventional durability with spatial slicing
    source_ids: *id002
