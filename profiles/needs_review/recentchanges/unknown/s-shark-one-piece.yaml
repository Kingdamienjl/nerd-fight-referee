        \ Self sustenance (can breathe in water, and in space), Transmutation with\
        \ gold rush (When in gold rush, all edibles will turn into gold and can give\
        \ gold, it\u2019s implied many times this isn\u2019t a perception thing),\
        \ Resistance to Poison Manipulation (Jellyfish, which normally harm sharks\
        \ by injecting them with toxins, don\u2019t work on Apex sharks) * Explosion\
        \ Manipulation (while using Black Hole Sun, he can activate his quantum eyes,\
        \ which explode and kill all edibles on the screen) * Invulnerability (Temporary\
        \ Invincibility; When in gold rush mode, the shark will regenerate health\
        \ and won\u2019t take any damage from enemy sharks, mines, or jellyfish) *\
        \ Portal Creation, possible Dimensional Travel (Alan is typically seen traveling\
        \ through portals, and it\u2019s stated that Alan might not even be from this\
        \ universe, implying that he might\u2019ve used a portal to get to this universe)\
        \ * Resistance to: Space-Time Manipulation, Blackholes, Causality Manipulation,\
        \ Energy Absorption, Matter Manipulation, Light Manipulation, Antimatter Manipulation,\
        \ Quantum Manipulation, Information Manipulation (Type 2), Existence Erasure,\
        \ Matter Manipulation, Durability Negation, & Deconstruction (Sub-Atomic -\
        \ Unaffected by creating a black hole right on his body. Beyond the event\
        \ horizon, black holes tear matter down to its most fundamental sub-atomic\
        \ components. Blackholes themselves aren't part of the Space-Time continnum,\
        \ they break down Space and Time, and the inside region does not follow a\
        \ cause and effect relation, and time is non existent within it. Blackholes\
        \ grow by absorbing matter which includes things like energy, light, gas,\
        \ etc, and bend them infinitely. While in the universe information can't be\
        \ neither created nor destroyed, black holes are something that have the tendency\
        \ to devour information of something that they consume, which is impossible\
        \ according to quantum physics. Black holes have also entropy, which increases\
        \ alongside their surface area the more they consume matter-based objects.\
        \ They are also Non-Euclidean objects where physics breaks down. Its possible\
        \ dark matter and energy can be generated within supermassive blackholes.\
        \ Black holes have the ability to erase the objects they absorb due to them\
        \ completely consuming the entirety of their matter and information.)"
