  stamina:
    text: Superhuman (Can keep fighting while suffering from injuries such as bullets
      wounds or getting cut and stabbed by Black Noir. Even when depowered and not
      fully recovered from her previous injuries, she endured a brutal beating from
      one of Nina's henchmen, even getting hit repeatedly in her abdomen wound. Kept
      walking towards a man while getting shot by him without any signs of discomfort.
      Wasn't much bothered by getting her arm ripped off and was fine while her face
      was hanging off. Was seemingly up and fighting while still recovering from her
      injuries. Quickly recovered from the pain of getting sliced in half by Homelander's
      heat vision. Endured the agonizing pain of getting exposed to radiation in order
