- id: claim-powers-and-abilities-e839f916
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics **Enhanced Hearing (All Supes have a\
    \ wider range of hearing than humans, and it's comparable to that of dogsGen V;\
    \ Season 1; Episode 2: \"First Day\") **Reactive Evolution (Godolkin claimed that\
    \ under the right amount of pressure, a supe can \"level-up\", becoming more powerfulGen\
    \ V; Season 2; Episode 2: \"Justice Never Forgets\") **Regeneration and Immortality\
    \ (Types 2 and 3 - [Low-Mid]. Healed massive gashes inflicted by Black NoirThe\
    \ Boys; Season 1; Episode 5; \"Good for the Soul\". Regenerated a snapped neckThe\
    \ Boys; Season 2; Episode 8; \"What I Know\", twice The Boys; Season 4; Episode\
    \ 8; \"Season Four Finale\". Healed from a headshot on two different occasionsThe\
    \ Boys; Season 4; Episode 2; \"Life Among the Septics\". Regrew her missing armThe\
    \ Boys; Season 4; Episode 1; \"Department of Dirty Tricks\" and chopped off leg.\
    \ Reattached her face and healed other injuries after falling off from great heights.\
    \ Regenerated from being almost completely bisected and eviscerated. It was stated\
    \ that all supes heal faster than humansThe Boys; Season 3; Episode 7; \"Here\
    \ Comes a Candle to Light You to Bed\"Amazon Prime's X-Ray Trivia. Was perfectly\
    \ functional after getting sliced by Homelander's heat vision, and eventually\
    \ she regeneratedThe Boys; Season 5; Episode 1: \"Fifteen Inches of Sheer Dynamite\"\
    ) **Bodily Weaponry (Conventional; Has very sharp nails, that allowed her to slash\
    \ a man's belly and gore another one, brutally kill a woman, make a deep cut in\
    \ Noir's torso and rip a man's face off. Repeatedly slashed at a man's face) **Acrobatics\
    \ *Skilled Combatant (As seen here. Has been trained in combat since she was a\
    \ kid by her captorsThe Boys; Season 4; Episode 7; \"The Insider\") **Weapon Mastery\
    \ (Was trained in the use of weapons by the Shining Light Liberation Army. Skilled\
    \ with improvised weaponry, typically utilizing scissors or other bladed objectsThe\
    \ Boys; Season 4; Episode 4; \"Wisdom of the Ages\") *Stealth Mastery (Silently\
    \ got off a ceiling vent and snuck up on A-TrainThe Boys; Season 1; Episode 7;\
    \ \"The Self-Preservation Society\". Successfully sneaked into the Sage Grove\
    \ CenterThe Boys; Season 2; Episode 6; \"The Bloody Doors Off\". Snuck up on a\
    \ man to kill him. Quickly and quietly left a room without Frenchie noticing it)\
    \ *Poison Manipulation with the Novichok nerve agent gas mask (Optional Equipment)\
    \ *Resistance to: **Alcohol (Drank at least nine cans of beer which, given her\
    \ weight of 100 lbs, would amount to over a 0.40% BAC, yet she was only midly\
    \ drunk. Rufus implies a supe can drink a lot without dying of alcohol poisoningGen\
    \ V; Season 2; Episode 1: \"New Year, New U.\") **Radiation (SurvivedThe Boys;\
    \ Season 3; Episode 5; \"The Last Time to Look on This World of Lies\" getting\
    \ blasted with radioactive energy without any ill effects, but she lost her powers\
    \ due to the radiation burning the Compound V on her system. Endured getting exposed\
    \ to high levels of radiation in calculated sessions of varying time across a\
    \ day, although she was severely weakened and in tremendous pain during the process,\
    \ but quickly recovered after the exposure was done) **Fire and High Temperatures\
    \ (2861\xB0C; M.M. claimed that a fire blast from Lamplighter would just \"piss\
    \ her off\", even after witnessing him vaporizing a hole on a metal doorIn the\
    \ script's version it says \"Now listen. She\u2019s a Supe. So maybe you can burn\
    \ us, but you\u2019ll just piss her off. So how \u2018bout we all calm down, live\
    \ through this motherfucker?\", implying more likely that Kimiko can indeed withstand\
    \ a fire blast from Lamplighter. Soldier Boy's blasts have been shown to emit\
    \ enough heat to vaporize people, though it's unknown if he reached that heat\
    \ when attacking Kimiko, due to just waking up from cryo sleep) Same as before,\
    \ plus: *Radiation Manipulation and Energy Projection (Obtained Soldier Boy's\
    \ radioactive powers by getting expose to carefully calculated doses of radiation\
    \ for determined amounts of timeThe Boys; Season 5; Episode 7; \"The Frenchman,\
    \ the Female and the Man Called Mother's Milk\", allowing her to fire powerful\
    \ blasts of radioactive energy) **Minor Aura (Overwhelming; Passively emits radiationThe\
    \ Boys; Season 5; Episode 8; \"Blood and Bone\") **Limited Power Nullification\
    \ (Just like Soldier Boy, her blasts completely nullifies supes powers by burning\
    \ the Compound V on their systems) ***Limited Immortality Nullification (Can also\
    \ do the same with V-One users, removing their immortality in the processThe Boys;\
    \ Season 5; Episode 6; \"Though the Heavens Fall\") **Limited Light Manipulation\
    \ (Whenever she activates her powers, she produces a glowing aura)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
