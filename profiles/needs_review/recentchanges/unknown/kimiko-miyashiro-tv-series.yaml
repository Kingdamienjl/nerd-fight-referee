  intelligence:
    text: Above Average. Kimiko is bilingual, understanding both English and Japanese,
      and she also created her own sign language with her brother, that she taught
      to Frenchie. She also knows how to pick handcuffsThe Boys; Season 3; Episode
      6; "Herogasm". After years of working with The Boys, she has learned many techniques
      of espionage and infiltration, and even to use some tech. Quickly taught Hughie
      how to defend himself using a box cutter and an improvised shield. Kimiko has
      been shown to be a brutally efficient combatant and assassin. She easily made
      quick work of her captors despite them being armed, and later she attacked a
      salon, where the police believed that her massacre was a gang hitThe Boys; Season
      1; Episode 4; "The Female of the Species". Though she mostly relies on her superhuman
      strength, she still has shown a fair share of skill in combat, and could even
      take down Vought's guardsThe Boys; Season 2; Episode 5; "We Gotta Go Now"The
      Boys; Season 3; Episode 4; "Glorious Five Year Plan"The Boys; Season 3; Episode
      8; "The Instant White-Hot Wild".
