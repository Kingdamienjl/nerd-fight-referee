    - field: intelligence
      value: 'Extraordinary Genius (Lupin is a character with an extensive history
        of outsmarting and outperforming countless geniuses throughout history. He
        shows amazing intuition and awareness of his surroundings and possesses encyclopedic
        knowledge of various topics, such as history, literature, sciences, fluency
        in multiple language, etc. Thanks to his decades of experience there are few
        things he hasn''t already seen and even fewer that he''s incapable of accomplishing,
        with his mind being directly compared to that of a God) {|class="wikitable
        mw-collapsible mw-collapsed" !Intelligence Feats: |- | *Lupin often creates
        near-perfect disguises of people and can mimic their voices after only just
        meeting them. *Lupin was able to discover that Yael Okuzaki was using a device
        hidden on his eye that allowed him to see the cameras in the entire city.
        *Lupin was able to fool Zenigata into believing that he was dead by painting
        a realistic image on the floor made of spoiled foods.Part 4, Episode 13: The
        End of Lupin III *Is adroit enough to easily detect counterfeit works so well
        crafted that even experts can''t tell which what art is authentic.Part 3,
        Episode 12: Prisoner of Balutan House *Lupin is also a formidable escape artist,
        capable of cracking any safe or freeing himself from shackles in moments.
        *Was able to practically figure out most of the haunted hotel mystery almost
        instantly just by looking at the previous comments in a brochure, though was
        ultimately wrong about the involvement of a ghost and the owners. *Solved
        the mystery of the Tower of Babel, when not even members of an advanced alien
        civilization could during thousands of years. *Was able to quickly solve the
        various pieces of The Italian DreamPart 4, Episode 8: The Zapping Operation
        conspiracy. Having been capable of figuring out the riddles hiding it in an
        instant, he was able to figure out that MI6 were the ones behind it. Decrypted
        in one night the indecipherable text written by Wataru Uraga, which is in
        fact a hidden code which utilizes multiple languages. Wataru is a genius scientist
        who was capable of creating a method to implant a personification of himself
        inside someone''s subconscious, by simply reading the previously mentioned
        code. Eventually being able to figure out that the entire project involved
        the cloning and reincarnating of original Leonardo Da Vinci. *Was instantly
        deemed worthy by Leonardo Da Vinci and the first to wake up from his game,
        this Da Vinci is a clone of the famous Leonardo Da Vinci (by using Wataru''s
        knowledge), who could easily replicate Wataru Uraga''s invention but on a
        massive scale, to the point of making everyone in Italy fall asleep, and was
        going to replace all those people''s personalities with his own, only to fail
        due to Lupin.Part 4, Episode 23: World Dissection (Part One) *Ultimately beat
        Mamo, a man who acted as the ''God'' of the world for 10,000 years, who had
        acquired the knowledge and wisdom of all the geniuses, scientists, philosophers,
        artists, politicians, and religious figures of history and who had been behind
        all historical events in human history, causing all of it''s war, famine,
        hatred, desire, wisdom, and invention. With Lupin''s mind being so terrifying
        that Mamo considered it to be that of a God''s, prompting him to want to kill
        Lupin out of fear. *Can easily see through disguises in a variety of ways.Goodbye
        Partner *Has an intellect defying the best computers to the point there''s
