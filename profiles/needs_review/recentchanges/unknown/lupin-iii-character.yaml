      FTL combat speed and reactions126.03 c (Can dodge the missilesLupin III H: Chapter
      1 and lasers of Zeni-Robo, which are capable of traveling to the sun in a quick
      amount of timeZenigata is the Main Character 5 alongside also being generally
      consistent with the robot''s speed. Reacted to and deflected multiple lasers
      with a piece of Zantetsuken and has shown consistent feats of dodging lasers.Part
      III, Episode 40: A Lotto Ticket to Riot Comparable to Goemon Ishikawa) | Massively
      FTL, higher with Super Arrest Rush (Comparable to Zeni-Robo)'
    source_ids:
