  attack_potency:
    text: At most Island level+92.7 Gigatons of TNT (Lupin's long line of history
      has lead to him performing and combating countless powerful feats. He has dispersed
      a natural disaster with his gun, cleared stormy skies with just his fist, killed
      a size-amped Mamo who's internal energy dwarfed that of mountains, destroyed
      a robotic Oda Nobunaga who's power maintained a pocket dimension based on his
      199 meter mountain fort, held back and deflected a lightning attack from Mamo
      who's capable of covering all of Tokyo with the same type of magic, and was
      capable of physically holding and withstanding the Fujin, a pseudo-black hole
      generator strong enough to not only atomize an island but also completely dispersed
      a massive snowstorm as a simple after-effect of it activating. Can also harm
      from those comparable to him), higher with Stronger Equipment (Has a variety
      of stronger items that can harm those normally too durable for his most basic
      equipment), far higher with Preparation | Small Star level45.36 Quettatons,
      higher with Super Arrest Rush (Comparable to Zeni-Robo)
    source_ids:
    - vsbattles-lupin-iii-character-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Supersonic+Mach 4.61 (Partially outspeed a fireball.Part III, Episode 5:
