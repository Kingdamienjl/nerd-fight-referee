- id: claim-weaknesses-7a8f30f9
  section: weaknesses
  axis: weakness
  text: 'Lupin doesn''t like to kill, but he will if he has to. Sometimes, if he does
    not have any information on an opponent or is not fully prepared for a fight,
    he can be caught off guard. His pronounced attraction towards beautiful women,
    especially Fujiko, frequently results in bouts of irrationality. He also has an
