    - field: intelligence
      value: Above Average (An expert guitarist and a competent fighter. Thanks to
        his talent and charisma, he became famous as the god of metal, and his songs
        quickly became a sensation all over Australia, selling millions of copies
        and granting him the monopoly over the young fans of the genre. His entire
        career was just a plan to brainwash his fans and trade their souls for power.
        After returning from death, he hunted down other Darkstalkers, battling with
        many of them during the tournament held by Pyron and when Jedah dragged him
        into Majigen. Knows many creative ways to employ his special physical properties
        and powers in combat. He also seems to be a rather skilled basketball player)
      source_id: mediawiki-4663582
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Has a crush for Hsien-Ko. Overconfident in his ability to take on stronger
        enemies. Greedy in absorbing energy, to the point of destroying his own body
        in the process. A strong mind/spirit can resist the madness-inducing effect
        of her aura and a dark heart can resist the corruption, Lord Raptor''s birthdate
        is officially 1889, but this is a reference to his previous character concept,
        Le Malta''s statistics are unknown, due to him being a class D beast., Ultimate
        Undead, Loudness Screw: Lord Raptor leaps in the air and mashes his legs into
        a single piece of flesh, with his sharp ribs coming out. He then rotates like
        a drill and descends, Death Hurricane: Lord Raptor dashes in the air towards
        the opponent, Skull Sting: Lord Raptor jumps over the opponent and falls on
        them with his left leg turned into a chainsaw., Hell''s Gate: Le Malta suddenly
        appears from the ground, Skull Punish: Lord Raptor grabs the opponent, jumps
        backwards and performs a flying suplex. He then stabs their back using his
        sharp fingers., Lord Raptor quickly pulls out his guitar, releasing powerful
        sonic waves which push back the opponent., Evil Scream: Lord Raptor extends
        his elbow bone, piercing the opponent and dragging them towards him. Once
        at close range, Lord Raptor delivers an electrified slash with his enlarged
        claws and ribs., Death Voltage: Lord Raptor performs a Death Hurricane powered
        by electricity., Hell Dunk: Le Malta appears below the opponent, swallowing
        them and spitting them out as a ball. He then transforms into a basketball
        hoop afterwards. Lord Raptor catches the ball on the fly, jumps over Le Malta
        and shoots the opponent through the hoop., Ultimate Undead: Lord Raptor calls
        upon his dark power, Le Malta is used as an engine to boost the effectiveness
        of Lord Raptor''s chainsaw arm.'
