        (Via Hell''s Gate. He is also able to appear from nowhere), limited Absorption
        (Can absorb energy sources, like Jedah''s unleashed power), Soul Manipulation
        (Able to collect the souls of defeated enemies and use them for a variety
        of purposes, such as consuming them to become stronger), Passive Aura, Corruption
        (Type 2) and Madness Manipulation (Type 2) (All the Darkstalkers give off
        an aura that corrupts the heart of the opponents and drives them insane),
        Non-Physical Interaction (Able to interact with Pyron, who doesn''t have a
        physical form, and Bishamon in Vampire Savior, whose body is made of souls),
        Resistance to Sound Mimicry (CDs couldn''t properly record his enigmatic voice),
        Soul Manipulation (Possesses a very strong soul, due to it being directly
        connected to his power. Souls such as his own, if splitted in multiple parts,
        are able to draw each piece to the other and return one), Corruption and Madness
        Manipulation (Totally unaffected by the aura of other Darkstalkers) Through
        specific songs at his concerts, Lord Raptor has been able to obtain the following
