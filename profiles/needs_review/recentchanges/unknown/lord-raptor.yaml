- id: claim-weaknesses-31546bce
  section: weaknesses
  axis: weakness
  text: 'Has a crush for Hsien-Ko. Overconfident in his ability to take on stronger
    enemies. Greedy in absorbing energy, to the point of destroying his own body in
    the process. A strong mind/spirit can resist the madness-inducing effect of her
    aura and a dark heart can resist the corruption. Notes: *Lord Raptor''s birthdate
    is officially 1889, but this is a reference to his previous character concept,
    when he was intended to be a revived WWI soldier. *Le Malta''s statistics are
    unknown, possibly even inferior to that of a human, due to him being a class D
    beast. *All references not included in this profile are provided in the verse
    page Notable Attack/Techniques: File:Loudness Screw.gif|Loudness Screw File:Death
    Hurricane.gif|Death Hurricane File:Skull Sting.gif|Skull Sting File:Hell''s Gate.gif|Hell''s
    Gate File:Skull Punish.gif|Skull Punish File:Death Phrase.gif|Death Phrase File:Evil
    Scream.gif|Evil Scream File:Death Voltage.gif|Death Voltage File:Hell Dunk.gif|Hell
    Dunk File:Ultimate Undead.gif|Ultimate Undead *Loudness Screw: Lord Raptor leaps
    in the air and mashes his legs into a single piece of flesh, with his sharp ribs
    coming out. He then rotates like a drill and descends, hitting the opponent. *Death
    Hurricane: Lord Raptor dashes in the air towards the opponent, while his whole
    body takes the form of a spinning top and the spikes on his belt become bigger.
    *Skull Sting: Lord Raptor jumps over the opponent and falls on them with his left
    leg turned into a chainsaw. *Hell''s Gate: Le Malta suddenly appears from the
    ground, swallowing Lord Raptor and teleporting him behind the opponent. *Skull
    Punish: Lord Raptor grabs the opponent, jumps backwards and performs a flying
    suplex. He then stabs their back using his sharp fingers. *Death Phrase: While
    blocking an attack, Lord Raptor quickly pulls out his guitar, releasing powerful
    sonic waves which push back the opponent. *Evil Scream: Lord Raptor extends his
    elbow bone, piercing the opponent and dragging them towards him. Once at close
    range, Lord Raptor delivers an electrified slash with his enlarged claws and ribs.
    *Death Voltage: Lord Raptor performs a Death Hurricane powered by electricity.
    *Hell Dunk: Le Malta appears below the opponent, swallowing them and spitting
    them out as a ball. He then transforms into a basketball hoop afterwards. Lord
    Raptor catches the ball on the fly, jumps over Le Malta and shoots the opponent
    through the hoop. *Ultimate Undead: Lord Raptor calls upon his dark power, enhancing
    strength and agility. While in this state, Le Malta is used as an engine to boost
    the effectiveness of Lord Raptor''s chainsaw arm.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-3c348f2e
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Skilled hand-to-hand combatant, Electricity
    Manipulation, Acrobatics (His fighting style incorporates many jumps and aerial
    attacks. Can fight and defend in mid-air. Able to spin in mid-air and land on
    his feet), Social Influencing (His charisma has been compared to that of a young
    Ozzy Osbourne and his followers were more like cultists rather than fans), Preparation
    (Prepared a mass sacrifice by manipulating his fans overtime through his songs),
    Immortality (Type 2 and 7; Is a zombie and survived with just his head after the
    explosion of his body), Extrasensory Perception (Able to sense relevant sources
    of energy, such as Pyron''s waves), Natural Weaponry (Has sharp fingers and bones),
    Elasticity (His elastic phyisiology allows him to stretch neck and limbs, bounce
    on the ground and recover from being flattened), Body Control (Can swallow his
    own body to become a ball. Able to make his legs spin when jumping. Can control
    his spine to move the upper body. Can manipulate the flesh on his forearms), limited
    Size Manipulation (Can make his hands slightly bigger), Bone Manipulation (Can
    pull out, extend and shapeshift ribs and other bones, making them sharp like blades),
    Shapeshifting (Can transform his limbs into chainsaws and copies of his head,
    the latter to attack and move faster. Can morph into a top-like form) Regeneration
    (Low-Mid; Can instantly heal self-inflicted wounds on his legs and reattach the
    head if horizontally split), Transformation (Can take his previous human form),
    Hair and Cloth Manipulation (Can change clothing and modify hair length and style
    as he pleases. Can enlarge the spikes on his belt, turning them into weapons),
    Dimensional Storage (Keeps his guitar inside his pants), Sound Manipulation (Via
    Death Phrase), Statistics Amplification (Via Ultimate Undead), Teleportation (Via
    Hell''s Gate. He is also able to appear from nowhere), limited Absorption (Can
    absorb energy sources, like Jedah''s unleashed power), Soul Manipulation (Able
    to collect the souls of defeated enemies and use them for a variety of purposes,
    such as consuming them to become stronger), Passive Aura, Corruption (Type 2)
    and Madness Manipulation (Type 2) (All the Darkstalkers give off an aura that
    corrupts the heart of the opponents and drives them insane), Non-Physical Interaction
    (Able to interact with Pyron, who doesn''t have a physical form, and Bishamon
    in Vampire Savior, whose body is made of souls), Resistance to Sound Mimicry (CDs
    couldn''t properly record his enigmatic voice), Soul Manipulation (Possesses a
    very strong soul, due to it being directly connected to his power. Souls such
    as his own, if splitted in multiple parts, are able to draw each piece to the
    other and return one), Corruption and Madness Manipulation (Totally unaffected
    by the aura of other Darkstalkers) Through specific songs at his concerts, Lord
    Raptor has been able to obtain the following effects: Curse Manipulation (His
    songs were curses taken from the book "A chapter of Tolagido"), limited Mind Manipulation
    (Gradually brainwashed his followers overtime), Biological Manipulation (Fans
    at his concerts used to faint and have heart attacks), Blood Manipulation (The
    people present at his final live had all of their blood poured out of their body
    without receiving any external wound), Empathic Manipulation (Every victim died
    with the look of happiness), Self-Deconstruction (After completing the ritual,
    his body crumbled away, leaving behind only a pile of bleached bones), Soul Manipulation
    (The souls of his victims have been sent to Ozom) Small Size (Type 0), Teleportation,
    Dimensional Travel (Able to cross from Makai to the Human World and vice versa),
    Elasticity (Can stretch his limbs and bounce on the ground), Shapeshifting (Can
    take various shapes of different sizes), Immortality (Type 2) and Regeneration
