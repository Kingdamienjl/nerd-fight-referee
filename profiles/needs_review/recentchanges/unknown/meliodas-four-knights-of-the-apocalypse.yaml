power_scale:
  tier:
    text: 1-A, higher with Demon Marks, far higher with Assault mode, Up to at least
      1-A with magic-imbued weaponry
    source_ids: &id002
    - mediawiki-4959234
    confidence: 0.8
  attack_potency:
    text: 'At least Solar System level (1/4th as strong as his enlarged Demon Mark.
      Equal to Base Arthur, who easily subdued True Form Cath Palug.Nanatsu no Taizai
      Chapter 341 Arthur says he would have taken more damage if Tristan hadn''t intervened
      and that Meliodas would have come out unscathed1.15 Gigafoe ), higher with Demon
      Marks (Even after losing his power as the Demon KingNanatsu no Taizai Chapter
      332, his strength did not diminish.Four Knights of The Apocalypse: Sinful Anatomy
      Book - Knights of Hope Superior to Lancelot4.6 Gigafoe), far higher with Assault
      Mode, up to at least Solar System level with magic-imbued weaponry (Can imbue
      weaponry with the power of darkness, which is a form of Destroyer magic that
      enhances the destructive power of a weapon nearly 10-foldFour Knights of The
      Apocalypse Chapter 3746 Gigafoe), higher at night'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: At least FTL (Can exchange blows equally with Base ArthurFour Knights of
      The Apocalypse Chapter 78, which casually blitzed True Form Cath Palug. Prevented
      Tristan from being decapitated by Arthur4c), FTL+ with Demon Marks (Can increase
      the size of his Demon Mark, quadrupling his base speed16c)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class E, higher with Demon Marks
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: At least Solar System level, higher with Demon Marks, far higher with Assault
      Mode
    source_ids: *id002
    confidence: 0.8
  durability:
    text: At least Solar System level (Comparable to his attack potency. Withstood
      an attack from the chaos effortlessly), higher with Demon Marks, far higher
      with Assault Mode
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman
    source_ids: *id002
    confidence: 0.8
  range:
    text: Extended Melee Range, Tens of Meters with ranged attacks (Carved up Albion's
      arm. Severely damaged Drole, who is 25.8 meters in height), Tens of Kilometers
      with Power of Darkness
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Above Average, likely Gifted; Genius in combat (Meliodas has shown himself
      to be an extremely skilled fighter and strategist with over 3,000 years of experience.
      He is capable of learning and improving techniques at an accelerated rate and
      has shown especially skilled swordplay, with a number of versatile techniques
      that he routinely uses in battle. In Cursed By Light, he claimed to have seen
      Demon King's thoughts and memories after his possession)
    source_ids: *id002
    confidence: 0.8
