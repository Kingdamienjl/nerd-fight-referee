- id: claim-powers-and-abilities-748e7365
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Magic, Fire Manipulation, Ice Manipulation,
    Telekinesis, Flight, Healing, Darkness Manipulation (As Dark Bloom), Teleportation,
    Statistics Amplification, Shapeshifting, Life Creation, Portal Creation, Transformation,
    Size Manipulation, Reality Warping, Possibly Dimensional Manipulation (Created
    Arcadia who can manipulate the Golden Kingdom, a dimension that exists outside
    of space-time and is beyond the magic dimension), Sealing, Life and Death Manipulation,
    Empathic Manipulation (Can use her Believix powers to affect the inner wills,
    emotions and feelings of others, making them believe in fairies at least temporarily),
    Atomic Manipulation and Destruction and Resistance to it (Can use her magic to
    reduce targets down to magic particles), Power Nullification (Can reverse and
    nullify spells, especially when using Enchantix Fairy Dust), Can create magic
    barriers that stop attacks and send them back at the opponent, Creation, (Can
    use her magic to casually create from nothing; the dragon flame created the magic
    dimension from nothingness), Data Manipulation (At least low, Bloom can manipulate
    magical data that's created from Tecna, Fairy of Technology), Shapeshifting (Can
    use her magic to transform themselves and others into things), Transmutation (Can
    use her magic to convert targets down to nothing, Has the ability to be one with
    Nature itself via Sophix, Water Manipulation, Can see Spirits, Energy Manipulation,
    Energy Absorption, Energy Sensing, Resistance to Power Nullification (Was able
    to keep her magic despite Acheron removing all magic from the entire Magic Dimension),
    Resistant to attacks that target and harm souls, Transmutation, Barrier Creation,
    BFR, Time Manipulation, Likely Resistance to Reality Warping (Was the only one
    in the Winx with powers that the Legendarium's power could not take away), Can
    use Fairy Dust via Enchantix, Can give powers to others, Can dispel illusions,
    Can see past events, Can travel between Universes, Can breathe underwater, Wish
    Granting via Sirenix Box and Guardian of Sirenix, Can purify darkness completely
    using Fairy Dust, Can undo seals, Can become stronger when people believe in fairies.
  source_ids: *id003
  decisive: true
