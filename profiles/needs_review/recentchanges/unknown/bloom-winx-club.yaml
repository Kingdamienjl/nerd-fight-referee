    Category:Ice Users Category:Magic Users Category:Magical Girls Category:Matter
    Users Category:Portal Users Category:Power Nullification Users Category:Primary
    Protagonists Category:Protagonists Category:Reality Warpers Category:Sealing Users
    Category:Shapeshifters Category:Size Users Category:Statistics Amplification Users
    Category:Telekinesis Users Category:Teleportation Users Category:Time Users Category:Transformation
    Users Category:Transmutation Users Category:Water Users Category:Wing Users Category:Wand
    Users Category:Guardians'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
