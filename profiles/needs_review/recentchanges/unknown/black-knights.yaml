- id: claim-standard-equipment-659f56bc
  section: equipment
  axis: equipment
  text: '*Black Knight Sword: Greatsword of the black knights who wander Lordran.
    Designed to face chaos demons. The large motion that puts the weight of the body
    into the attack and greatly reduces enemy poise, reflecting the tremendous size
    of the enemies that the knights have fearlessly faced. **Skill: Perseverance:
    Raise sword in the name of the First Lord to temporarily boost poise. Damage reduced
    while activated. *Black Knight Greatsword: Ultra Greatsword of the black knights
    who wander Lordran. Designed to face chaos demons. The Black Knights constantly
    faced foes larger than themselves, and this sword''s unique attack greatly reduces
    enemy poise. **Skill: Stomp: Use one''s weight to lunge forward with a low stance
    and increased poise, and follow with a crushing strong attack. *Black Knight Greataxe:
    Greataxe of the black knights who wander the lands. Used to face chaos demons.
    The unique attack of this axe greatly reduces enemy poise, reflecting the tremendous
    size of the enemies that the knights have fearlessly faced. **Skill: Warcry: Let
    out a spirited warcry that temporarily boosts attack, and enables a special consecutive
    attack. *Black Knight Glaive: Glaive of the black knights who wander the lands.
    Used to face chaos demons. The unique attack of this glaive greatly reduces enemy
    poise, reflecting the tremendous size of the enemies that the knights have fearlessly
    faced. **Skill: Spin Sweep: Sweep foes in a large spinning motion, and utilize
    momentum to transition into and overhanded strong attack slash. *Black Knight
    Shield: Shield of the Black Knights that wander Lordan. A flowing canal is chiseled
    deeply into its face. Long ago, the black knights faced the chaos demons, and
    were charred black, but their shields became highly resistant to fire. **Skill:
    Weapon Skill: Equipping this shield in the left hand allows one to perform the
    Skill of the right hand weapon. *Black Knight Set: Armor of the Black Knight who
    haunt Lordran. The knights followed Lord Gwyn when he departed to link the flame,
    but they were burned to ashes in newly kindled fire, wandering the world as disembodied
    spirits ever after. |}'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
