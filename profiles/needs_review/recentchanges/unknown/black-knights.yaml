- id: claim-powers-and-abilities-30b7dc32
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Weapon Mastery (Skilled with a variety
    of weapons) *Damage Boost (Their weapons deal bonus damage to demons) *Immortality
    (Types 1, 2, and 7) *Astral Projection (The Black Knights fought throughout Lordran
    are the projected spirits of the Black Knights that reside within the Kiln of
    the First Flame) *Damage Reduction (Via Perseverance) *Damage Boost (Via Warcry)
    *Resistance to Fire Manipulation, Temperature Manipulation, Magma Manipulation,
    Explosion Manipulation, and Electricity Manipulation (Possesses a high innate
    resistance to fire and lightning damage) *Resistance to Magic, Darkness Manipulation,
    Poison Manipulation, Disease Manipulation, and Blood Manipulation (Possesses a
    innate resistance to magic, dark, and frost damage, as well as conventional Poison
    and Toxic as well as Bleed, though this resistance is much weaker than its other
    elemental resistances)'
  source_ids: *id003
