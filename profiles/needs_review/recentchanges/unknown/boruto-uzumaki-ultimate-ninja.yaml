- id: claim-weaknesses-7425c89c
  section: weaknesses
  axis: weakness
  text: "Overconfidence in his skills. He was initially prone to losing his temper\
    \ if anyone mentioned his father's fame around him, but this is non-existent after\
    \ the Momoshiki encounter | His Yachihoko amp isn't permanent and can only last\
    \ for a couple minutes {| class=\"mw-collapsible mw-collapsed\" align=\"center\"\
    \ border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"\
    2\" style=\"text-align: left; |Notable Attacks/Techniques: |- | : Boruto creates\
    \ tangible \"shadow clones\" that can fight and use his techniques, but disappear\
    \ after one definite hit. Any information and experience the clones gained are\
    \ transferred to Boruto upon their dispersal. *: Boruto creates four shadow clones\
    \ to attack his opponent, delivering a series of open palm strikes and kicks.\
    \ *: Boruto creates four shadow clones, one of which launches itself at the opponent,\
    \ kicking them. The second shadow clone jumps in to continue the assault with\
    \ a Gentle Fist attack, after which the three other clones attack simultaneously\
    \ with a series of attacks, launching their opponent into the air with a defence-breaking\
    \ combo attack. The real Boruto then creates his version of Rasengan and, with\
    \ the help of the clones, jumps into the air and throws the Rasengan at the opponent.\
    \ Naruto's prankish invention. The user transforms into a charming girl to lull\
    \ the opponents' guards. *: It combines the numbers advantage of the Multiple\
    \ Shadow Clone Jutsu with the distractive nature of the Sexy Jutsu to overwhelm\
    \ male opponents. A jutsu developed by his grandfather Minato Namikaze and perfected\
    \ by Naruto, it is a sphere of chakra energy. The original Rasengan was used for\
    \ mid to close range, and Naruto invented long-range variations. *: While learning\
    \ to use the Rasengan, Boruto accidentally developed a smaller variety. As a trade-off\
    \ of this, Boruto unconsciously applies lightning-natured chakra to this Rasengan,\
    \ enabling him to hurl it across distances. Although the Rasengan itself only\
    \ remains stable for a specific range, the wind itself continues on its course\
    \ unseen, inflicting comparable damage upon impact. *: Boruto's version of Rasenshuriken\
    \ where Boruto applies Wind Style chakra to his Rasengan and it forms a uniquely\
    \ green chakra and sports rings around the central sphere. Though his is incomplete,\
    \ Boruto is able to throw it. *: By overlapping the Rasengan as it is formed in\
    \ the dominant hand with the other hand, the user compresses and condenses it\
    \ to its limit. In this state, it can penetrate targets with little resistance.\
    \ Even if the impact is reduced by a strong defense to the point of making it\
    \ non-lethal, it can still knock out powerful opponents. At the same time, its\
    \ compressed nature can cause severe recoil, greatly straining the user's arm,\
    \ making it dangerous to use often. *: Using his Shinobi Guantlet, Boruto sends\
    \ a Wind Style-infused shuriken at his opponent, pushing them back. Boruto then\
    \ uses a Water Style technique to flood the place, holding the opponent in place,\
    \ and while surfing on the waves, sends a Vanishing Rasengan through the water,\
    \ pushing the opponent up when it hits. *: As his mother is of the Hy\u016Bga\
    \ clan, Boruto is trained in her family's Taijutsu style of fighting. Unless he\
    \ activates his Dojutsu to use his fighting style's full potential, Boruto cannot\
    \ easily inflict internal damage on an opponent. *: A taijutsu technique that\
    \ Boruto learned from Sasuke Uchiha, he attacks an opponent with a kick and follows\
    \ up with a punch and another kick from the opposite leg. : Karma is a seal bestowed\
    \ by members of the \u014Ctsutsuki clan that takes the form of a four-point black\
    \ diamond on the recipient's body, marking them as a \"vessel\", and if successful\
    \ a \"perfect \u014Ctsutsuki\" for the clan. Boruto Uzumaki received the mark\
    \ on his right palm from Momoshiki \u014Ctsutsuki after dealing a fatal blow to\
    \ him. When activated it spreads across the right side of his body forming angular\
    \ and curving geometric patterns, extending up to his right eye, and then glows\
    \ blue. Karma significantly enhances the user's physical abilities and jutsu's\
    \ power. *Absorption: Karma allows him to absorb any ninjutsu, negating its effects\
    \ in the process. *Space-Time Portal: This technique is a Space\u2013Time Ninjutsu\
    \ used by the \u014Ctsutsuki clan. The user creates a rift, which allows anyone\
    \ enveloped to transfer to a chosen location including foreign dimensions. : One\
    \ of the five fundamental elemental nature transformations. It is performed by\
    \ making chakra as sharp and thin as possible. Wind Release is mainly short to\
    \ mid-ranged offensive techniques that combine brute force and keen precision\
    \ to deal with cutting and slashing damage. Wind techniques are usually performed\
    \ by generating air circulation and can be enhanced through this method as well.\
    \ Wind-natured chakra can also be channeled into blades to increase their cutting\
    \ power and overall range. *: **: A version of Gale Palm where Boruto uses Wind\
    \ chakra to increase his speed while infusing Lightning chakra i"
