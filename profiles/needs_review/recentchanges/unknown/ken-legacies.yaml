  section: weaknesses
  axis: weakness
  text: 'Tends to be highly arrogant. Gods run on belief and are only as powerful
    as people''s belief in them, which has diminished over the years, though this
    didn''t affect him that much. Only a God or a god-killing weapon can kill another
    God. ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters
    Category:The Vampire Diaries Category:Male Characters Category:Live-Action Characters
    Category:TV Characters Category:Evil Characters Category:Primary Antagonists Category:Antagonists
    Category:Gods Category:Villains Category:Leaders Category:Rulers Category:Tyrants
    Category:Parents Category:Immortals Category:Electricity Users Category:Air Users
    Category:Telekinesis Users Category:Fire Users Category:Earth Users Category:Water
    Users Category:Plant Users Category:Mind Users Category:Memory Users Category:Curse
    Users Category:Power Nullification Users Category:Resurrection Users Category:Sound
    Users Category:Empowerment Users Category:Extrasensory Perception Users Category:Teleportation
    Users Category:Martial Artists Category:Weapon Masters Category:Knife Users Category:Spear
    Users Category:Magic Users Category:Shockwave Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-ae2953d3
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Immortality (Types 1 and 2), Magic,
    Lightning Manipulation (Can pierce the sky with lightning and can call it down
    to strike his enemies. Can also create lightning in the palm of his hand to strike
    his enemies with it), Air Manipulation (Can create enormous gusts of wind and
    has great power over the air), Telekinesis, Shockwave Inducement (Can generate
    powerful shockwaves of energy), Fire, Earth and Water Manipulation (Has been punishing
    humans with earthquakes, fires, and floods for centuries), Plant Manipulation
    (Made a large field of flowers bloom. Can use plants to attack and restrain others
    and can shape plants and vines into objects), Mind Manipulation (Trapped Cleo
    into his own mind when she entered it again), Memory Manipulation (Can distort
    his memories to make others whatever he wants them to see), Curse Manipulation
    (Cursed his sister Lynn to be unable to return home and ferry the souls of humans
    into Peace for all eternity as the Ferryman. Cursed his son Ben with immortality),
    Power Nullification (Removed Ben''s curse, nullifying his immortality and regeneration),
    Resurrection (Stated he can resurrect people like Tristan), Sound Manipulation
    (Amplified his voice to make everyone in the Salvatore school hear him), Empowerment
    (Gains power from belief and worship), Extrasensory Perception (Was able to detect
    Cleo in his dream), Teleportation (Can teleport himself and others with lightning),
    Expert Combattant, Weapon Mastery, Social Influencing, Resistance to : Magic (Gods
    are unaffected by Magic due to their divine blood), Memory Manipulation (Malivore''s
    memory spell doesn''t work on Gods), limited to Absorption (While Lizzie was able
    to siphon his power, it was too vast for her to properly drain and it took her
    a long time of practice to successfully absorb some of it), Fire Manipulation
    (Unaffected by Kaleb''s dragon-fire breath attack)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
