        possessing others, only those with Voorhees blood will last and allow him
        to return to his true form, and his true form will still show in reflections,
        allowing others to deduce his identity. His resurrection can be broken if
        he's killed by someone with Voorhees' blood. When possessing others with his
        mask, his influence can be removed by removing the mask itself., His nanomachines
        can absorb too much energy and short out. Jason will choose to not use some
        of his powers if they don't fulfill his need for destruction and violence,
        the wiki is currently working off the proposal discussed here. Essentially
