    - field: intelligence
      value: Average (Jason is capable of effectively tracking and killing his victims,
        using any number of weapons and tools as deadly weapons, and setting up basic
        traps. While mentally handicapped and emotionally stunted, Jason did well
        in school when he was young. His intelligence was further enhanced after he
        was empowered and resurrected by Freddy in Freddy vs. Jason vs. Ash. As a
        human, Jason had outmaneuvered the police and lived off the land for years,
        remaining an urban legend. After years of bloodshed, Jason has grown into
        an apex predator in terms of combat and stealth, demonstrated by him massacring
        platoons of mercenaries and soldiers, beating Ash twice, and even methodically
        killing a group of extremely well-trained peak human space marines one by
        one aboard their own ship. His ability to improvise is exemplified by battles
        where he's used a helicopter rotor as a massive machete, summoned or used
        firearms against enemies, downed helicopters on two separate occasions by
        throwing objects at them, escaped restraints and swapped places with a dead
        soldier to ambush his comrades, and his general pinpoint accuracy with just
        about anything he can throw, such as when he threw a machete through a victim's
        heart from several feet away while on fire, headshot a pilot aboard a helicopter
        from hundreds of feet away with a severed head, throwing his machete at a
        branch that had caught rotors in order to kill a woman standing in water below
        it, Bodies possessed by the mask are shown to be intelligent enough to use
        firearms and more complex tactics. In The Experiment, Jason is shown driving
        a van. After Jason curbstomped several of his men, security chief Estep believed
        he was against professional soldiers) | Same as before (However, as an addition
        his nanomachines can give Jason new skills to help him if needed)
      source_id: mediawiki-6051
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Being reminded of his mother can stop Jason in his tracks. Jason's resurrection
        does not allow him to rapidly recover from extreme trauma., Same as before,
        He can be incapacitated by trapping him in the waters of Crystal Lake. When
        possessing others, only those with Voorhees blood will last and allow him
        to return to his true form, and his true form will still show in reflections,
        allowing others to deduce his identity. His resurrection can be broken if
        he's killed by someone with Voorhees' blood. When possessing others with his
        mask, his influence can be removed by removing the mask itself., His nanomachines
        can absorb too much energy and short out. Jason will choose to not use some
        of his powers if they don't fulfill his need for destruction and violence,
        the wiki is currently working off the proposal discussed here. Essentially
        the movies are treated as the primary and main canon, with secondary material
        being useable if it does not contradict the primary canon. This means that
        while works like the Jason X novels or certain comics are used in the profile,
        other media such as the NES video game or certain novels like Hate-Kill-Repeat
        are not listed, as they contradict the movies in some capacity and it was
        determined that they should not be included.
      source_id: mediawiki-6051
      provider_id: vsbattles
      authority: high
      confidence: 0.75
