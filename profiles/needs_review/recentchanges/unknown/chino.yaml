- id: claim-weaknesses-42263e18
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: * Blood Dragon Ascension: Blood
    Dragon Ascension is a technique that involves the ability to manipulate blood,
    exclusive to the members of the Chinoike Clan. Through this ability, the user
    forms a dragon of blood with eight heads similar to the "Yamata no Orochi", which
    all can regenerate. In addition to the regeneration, the heads of the dragon also
    have the capacity to release steam after biting a target. The dragon formed is
    strong enough to restrict the movements of Sasuke Uchiha''s Susanoo and was able
    to withstand his Lightning Release when Chino used it in conjunction with the
    iron-rich hot springs of the Valley of Hell, in the Land of Hot Water. ==Notable
    Matchups== Victories: Losses: Inconclusive: ==References== ==Notes/Explanations==
    Category:Naruto Category:Female Characters Category:Ninjas Category:Water Users
    Category:Blood Users Category:Illusionists Category:Mind Users Category:Metal
    Users Category:Paralysis Users Category:Explosion Users Category:Characters Category:Adults'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
