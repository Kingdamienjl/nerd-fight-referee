      Tons)'
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: At least Average Human | Street level
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Unknown, likely Human level | Street level (Should be albe to take blows
      from others on par with him)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: 'Superhuman (Can relentlessly hunt the player for six hours straight) |
      Infinite (Constantly hunts down William Afton without rest as William is trapped
      in an endless loop of death and resurrection Five Nights at Freddy''s: Ultimate
      Custom Night)'
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range | Standard Melee Range
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Unknown (Has displayed no notable feats of intelligence, though it is shown
      to be skilled in stealth) | Unknown, likely Average (Should compare to the other
      animatronics who can speak and understand coherent sentences and thoughts Five
      Nights at Freddy''s: Ultimate Custom Night) Standard Tactics: * FNaF 4: Nightmare
      works near identically to his counterpart Nightmare Fredbear, though he is significantly
      faster. Every 2 seconds he can choose to approach from the left or right hallways,
      jumpscaring the player if left unnatended for 8 (on 20/20/20/20 mode) or 10
      seconds (in Nightmare/Night 7). Alternatively, he can project his laugh in the
      bedroom where the player is at random points of the night, either teleporting
      as a head in the closed or in the bed (with the kill-timer mentioning above
      applying here if it happened) or not appearing at all, with only 2 laughs being
      real per night. *UCN: Nightmare works near identically to his counterpart Nightmare
      Fredbear. Every 5 seconds that the Monitor is raised, the game will choose a
      number between 1 and 40. If this number is less than Nightmare''s AI level,
      he will let out a laugh and appear outside the right doorway. Nightmare is invisible
      to the cameras. From there, the player has to close the door, or else he will
      attack the next time the Monitor is raised.'
    source_ids: *id002
    confidence: 0.8
