    - field: intelligence
      value: "At least Above Average Despite seeming to be merely quick-tempered,\
        \ bloodthirsy and bellicose, Kisame has been shown to be very observant and\
        \ tactical, in truth, a more analytical thinker. He realised Killer B's tactics\
        \ very quickly whilst battling him and was able to counter him. He attacked\
        \ B's comrades to trick B into melee range. He managed to fake his own death\
        \ in order and infiltrate Kumogakure undetected where he was able to gather\
        \ intel for the Akatsuki. The sensors in Kumogakure couldn't detect him because\
        \ he shared the same chakra signature with Samehada, and he was only foiled\
        \ when Naruto spontaenously gained the ability to sense emotions after gaining\
        \ control over Kurama's chakra and entering Bij\u016B Chakra Mode.Naruto Chapter\
        \ 505 Before he committed suicide, he placed a trap within a scroll that had\
        \ intelligence on the Shinobi Alliance to make sure it could still be delivered\
        \ to his allies even after his death. Kisame has shown the intelligence to\
        \ dissect and understand the mechanics of how his opponents' abilities work\
        \ whilst fighting. He was able to analyse Bee's Lightning Style mid-combat,\
        \ which he deduced was more piercing than Wind Style on average. He deduced\
        \ and explained the mechanics of Asakujaku after seeing it just a second time.\
        \ Standard Tactics: Kisame is naturally bloodlusted"
      source_id: vsbattles-kisame-hoshigaki-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Relies on his sword, though Samehada can come back to him. His regeneration
        ability relies on how much energy Samehada has drained. {| class="wikitable
        mw-collapsible mw-collapsed" !Notable Attacks/Techniques: |- | *Silent Killing:
        As the name suggests, this technique is simply a soundless method of killing
        an opponent, usually from behind with a blade. Additionally, because the user
        moves silently, the attack cannot be anticipated and defended against. The
        user will often slit their opponent''s throat, preventing any cry that might
        give them away. Some shinobi also opt to use a cover such as mist or even
        frost to rob their opponents of their field of vision and then attack them.
        *Water Release: **Water Bullet Technique: The Water Release: Water Bullet
        Technique is a highly versatile Water Release technique with many variations.
        After kneading chakra in their stomach, the user expels a large quantity of
        water in the form of a powerful torrent aimed towards their intended target.
        This technique can also be used collaboratively to increase its range and
        effect. **Water Shark Bullet Technique: The user manipulates a volume of water
        with their hand; by thrusting their hand in a direction, the manipulated water
        is sent in that direction. As it moves, the body of water takes the shape
        of a shark, with additional water following in its wake for as long as the
        user keeps their hand thrust out. Because of how quickly the shark moves and
        because of how much water there is, it does extensive damage when it impacts
        something. Users can also ride within the water shark as it moves, allowing
        them to travel faster than they''re able to swim. ***Water Release: Great
        Shark Bullet Technique: The Water Release: Great Shark Bullet Technique is
        a stronger version of the Water Release: Water Shark Bullet Technique. The
        user creates a gigantic shark out of water and, by thrusting both hands forward,
        sends it to attack the opponent. This technique differs from the original,
        since this one is able to absorb the chakra from an opponent''s technique
        and in turn, use that chakra to grow larger and more powerful. Therefore,
        the stronger the opponent''s technique is, the stronger this technique will
        get. **Five Feeding Sharks: The user puts their hand on the surface of a body
        of water and from the tips of five fingers, chakra is released into the water,
        changing it into the form of five ferocious sharks. The sharks circle the
        target with high speed, creating a raging stream that takes away their prey''s
        freedom of movement and their sharp teeth tear into the enemy with each consecutive
        attack. In the anime, these sharks can regenerate from surrounding water,
        making them difficult to destroy. ***A Thousand Feeding Sharks: A much more
        powerful version of the Water Release: Five Feeding Sharks, where the user
        creates one thousand sharks out of water that replicates a giant wave to swarm
        down and attack the opponent. **Exploding Water Colliding Wave: The user spits
        out a great volume of water from their mouth, swallowing up and crushing the
        enemy with the advancing surge. The user can ride the wave, allowing them
        to move at high speed, and attack the enemy, now swept off their feet. The
        amount of water created is proportional to the amount of chakra used; when
        used with Kisame''s enormous chakra, even a dry wasteland can become a small
        ocean. Afterwards, the excess water can be used for additional Water Release
        techniques. ***Great Exploding Water Colliding Wave: This technique is a larger
        version of the Water Release: Exploding Water Colliding Wave. With it, the
        user spews out a massive amount of water, covering an entire area with a ferocious
        tsunami. The produced ocean of water can be used for further techniques, and
        even gathered into a gigantic water prison, allowing Kisame to use his Water
        Prison Shark Dance Technique. ****Shark Dance Technique: After using the Water
        Release: Great Exploding Water Colliding Wave, Kisame forms the water into
        a gigantic prison. Because he acts as the centre of the dome of water, the
        dome alters its position in order to reflect the direction of his movements,
        making it difficult for his target to escape as long as he continues his pursuit.
        Fusing with Samehada provides Kisame a tremendous advantage. This fused form
        grants him the ability to breathe underwater while his target continues to
        drown as they attempt to futilely escape the large body of water. This technique
        is extremely effective in one on one fights, but the user would probably not
        be able to contain two enemies fleeing in opposite directions. ***Water Clone
        Technique: This technique originates from Kirigakure. Using water from the
        surroundings, the user creates one or more copies of themselves. Unlike the
        standard Clone Technique, these water clones are physically real, allowing
        them to interact with others and even perform the same jutsu as the user.
        Although a single water clone can be quite challenging to a standard genin,
        water clones only hav'
