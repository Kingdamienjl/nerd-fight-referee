        \ monsters like Nagato himself. Kisame's chakra reserves initially with a\
        \ 30% clone were said to be greater than anyone Neji had ever seen before\
        \ since Naruto. In this weakened state, he was able to create a massive amount\
        \ of water as far as the eye could see in his battle against Team Guy with\
        \ just a fraction of his chakra, and this is stated in Sha no Sho to be because\
        \ of his enormous chakra reserves, comparable to that of Naruto, which makes\
        \ the scale of his ninjutsu is incredible.Sha no Sho, Page 167 Karin stated\
        \ his chakra was humongousNaruto Chapter 380, page 14 when Kisame approached\
        \ Hebi. Kisame's chakra volume were comparable to those of jinch\u016Briki.\
        \ Chojuro stated that Kisame had jinch\u016Briki-level chakra volumeNaruto\
        \ Chapter 468, page 9 which when fused with Samehada resulted in him becoming\
        \ like a bij\u016B, outputting jinch\u016Briki-like power, when cautioning\
        \ the Gokage of him. Kisame was able to absorb all of Killer B's chakra, including\
        \ almost all of Gy\u016Bki's chakra ,Naruto Chapter 472, page 13 without going\
        \ insane or dying.Naruto Chapter 471, page 11 This replicates a similar feat\
        \ to Kinkaku and Ginkaku whereas others who attempted to eat the Gy\u016B\
        ki's chakra meat through his tentacles died.Naruto Chapter 529, page 4 Kisame\
