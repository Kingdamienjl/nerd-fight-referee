    - field: weaknesses
      value: "Relies on his sword in base form; his regeneration ability relies on\
        \ how much energy Samehada has drained. Notable Attacks/Techniques: *Mizu\
        \ Bunshin no Jutsu/Water Clone: Kisame creates clones of himself that can\
        \ function autonomously. They have significantly less chakra than he does.\
        \ *Suir\u014D no Jutsu/Water Prison: Kisame traps enemies in a virtually inescapable\
        \ sphere of water. Kisame (or a water clone) must keep a hand on the prison\
        \ to maintain it. *Bakusui Sh\u014Dha/Exploding Water Colliding Wave: Kisame\
        \ generates an enormous amount of water and rides it on a wave at his opponents.\
        \ *Goshokuzame/Five Feeding Sharks: Kisame puts his hand on the surface of\
        \ a body of water, and a shark made of water comes out of each finger to strike\
        \ the opponent. *Dai Bakusui Sh\u014Dha/Great Exploding Water Colliding Wave:\
        \ A larger version of Bakusui Sh\u014Dha. *Suik\u014Ddan no Jutsu/Water Shark\
        \ Missile: Similar to Goshokuzame, Kisame forms water into a single shark\
        \ and sends it after his opponent. *Samehada Chakra Drain: Kisame uses his\
        \ sword to drain any excessive amounts of chakra (such as a bijuu's chakra)\
        \ from his opponent. There is a limit to how much it can absorb. *Samehada\
        \ Regeneration: Kisame uses the energy Samehada drains to regenerate from\
        \ injuries. Limited by how much energy Samehada has drained. *Samehada Fusion:\
        \ Kisame fuses with Samehada, becoming a sizable shark-like monster which\
        \ combines his abilities with that of his sword. Category:ImmortalCultivator\
        \ Category:Tier 9 Category:Tier 7"
