      by the Chaos Emeralds, which empowered Super Sonic to [https://youtu.be/nda4a0GA-KU?si=CpaYXi5XRQTUBJ1i&t=2938
      fly to] the Exception. Far faster than his Base even when using his Boost) to
      Infinite (Superior to the Double Boost between Sonic and the Rookie, which allowed
