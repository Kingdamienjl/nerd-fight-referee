  attack_potency:
    text: 'Brown Dwarf level (Fought Classic Sonic, Classic Tails and Mecha Sonic
      Mk. II) | Solar System level ([https://cdn.imgchest.com/files/b2fcdf88527b.png
      Said to have unbeatable power in battle]. Alongside the rest of Team Sonic,
      he fought Team Dark and Team Rose) to Galaxy level (Can harm Gemerl, an improved
      version of Emerl upgraded by Eggman, and [https://imgchest.com/p/qb4zbad654j
      deal massive damage to him while he''s bolstered by Eggtech]), higher with the
      Maximum Heat Attack (Like the Light Speed Attack, the Maximum Heat Attack [https://imgur.com/Zrcpjey
      increases the damage that Knuckles is able to output against bosses]) and with
      Power Cores ([https://imgchest.com/p/pg73ap5njyr Power Cores double the physical
      characteristics of their user]) | Galaxy level to possibly High Universe level
      (Comparable to Sonic, if not stronger, who defeated the Babylon Guardian and
      Master Core: ABIS. Can [https://imgchest.com/p/a846mvpk27x easily dispatch large
      Iblis creatures], which provide more trouble for Sonic himself to deal with.
      Capable of [https://imgur.com/wXezFSC defeating the] Ifrit of his blue rival.
      Capable of harming the Knights of the Round Table directly and should scale
      to Sir Gawain, his Camelot counterpart. Single-handedly [https://imgchest.com/p/pg73qzrxz4r
      dispatched a Super Badnik] and its hordes of Badniks, and [https://cdn.imgchest.com/files/9393ebe8f353.jpg
      had Tails'' confidence] that taking out Egg Hammers with Sonic would be faster
      with him involved. [https://imgchest.com/p/qb4zbadxd4j Fought and easily dispatched]
      Rough and Tumble the Skunk alongside Sonic. [https://imgchest.com/p/agyvbmqeb48
      Fought and harmed Zombot Shadow until he became infected]. Superior to the members
      of the Restoration [https://imgchest.com/p/6eyr3388xyp who dealt notable damage
      to Giga Omega]. [https://imgchest.com/p/wl7l8egkx4x Destroyed several Cyberspace
      Soldiers with one hit each]. [https://imgur.com/a/DYiB1qR Aided Sonic in the
      fight against the Badnik train] on Amy''s birthday), higher with the Maximum
      Heat Attack and Boost | Varies (The power of the Chaos Emeralds are directly
      noted by Starline [https://imgur.com/a/2NsUxzT to vary in power depending on
      the circumstances]), Low Multiverse level (Destroyed the Phantom King. Draws
      on the power of the Chaos Emeralds, which are comparable to the Sol Emeralds;
      the Sol Emeralds could forcefully make Sonic''s universe and the Sol Dimension
      fuse and destroy them. Superior to the power of the seven World Rings. Should
      be superior to the Paradox Prism), up to Complex Multiverse level at his peak
      (Should be capable of achieving the same level of power that Classic and Modern
      Super Sonic used to fight the Time Eater, as he can fight Metal Overlord. Can
      potentially use the full power of the Chaos Emeralds, which allowed Super Sonic,
      Super Shadow and Super Silver to match Solaris) | Complex Multiverse level (Vastly
      above Super Knuckles and is comparable to Hyper Sonic due to being powered by
      the seven Super Emeralds, which are far above the Chaos Emeralds)'
    source_ids: *id002
    confidence: 0.95
  speed:
    text: At least FTL (Can [https://imgur.com/a/aZ5a3SR keep up] with Classic Sonic
      and [https://imgur.com/rvB7nXv match his running by gliding]), higher with the
      Spin Attack (Knuckles can perform the Spin Attack, a technique that allowed
      him [or rather Renegade, an altered Shatterverse counterpart of Knuckles with
