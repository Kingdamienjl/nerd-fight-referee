- id: claim-powers-and-abilities-410f808b
  section: abilities
  axis: hax
  text: 'The power of the Wisps'' Hyper-Go-On Energy, which Knuckles can harness in
    a multitude of ways by temporarily absorbing a Wisp. Each Color Power is dependent
    on what Wisp Knuckles absorbs, as each has their own unique set of abilities for
    her to tap into. **Black Bomb: Using the power of a Black Wisp, Knuckles becomes
    a living and incredibly dense bomb. He is then able to roll over enemies or induce
    widespread explosions by detonating himself without causing self-harm, which can
    grow in size and power depending on how many enemies he''s trampled or destroyed.
    **Blue Cube: Using the power of a Blue Wisp, Knuckles transforms into a perfectly
    shaped blue cube. When transformed into the Blue Cube, he can emit destructive
    shockwaves by slamming into the ground that spread out for a sizeable distance
    in all directions. **Crimson Eagle: Using the power of a Crimson Wisp, Knuckles
    turns into a crimson-colored eagle-like figure. As the Crimson Eagle, he is able
    to achieve flight and soar through the air unhindered as well as being capable
    of performing a dash attack. **Cyan Laser: Using the power of a Cyan Wisp, Knuckles
    transforms into a cyan laser beam. As the Cyan Laser, he gains the same properties
    as that of a real laser, allowing him to move as a living beam of light. When
    hitting any surfaces as the Cyan Laser, he can bounce off them as if they were
    reflective surfaces. When hitting enemies, it causes great damage. **Green Hover:
    Using the power of a Green Wisp, Knuckles turns into a green hovercraft. As the
    Green Hover, he gains the power of flight, allowing him to fly leisurely through
    midair and deal damage to enemies on contact while transformed. **Gray Quake:
    Using the power of a Gray Wisp, Knuckles transforms into a grey iron ball with
    yellow eyes. As the Gray Quake, his body density is greatly increased, making
    her so heavy that jumping or falling down on the ground can create destructive
    shockwaves. The Gray Quake also possesses some form of adhesive properties, allowing
    Knuckles to scale walls despite his weight in this form. **Ivory Lightning: Using
    the power of an Ivory Wisp, Knuckles transforms into a living, straw-colored lightning
    bolt. As the Ivory Lightning, Knuckles gains the same properties as that of a
    real lightning bolt. Associated with this form, he can move at lightning-fast
    speeds and with acrobatic movements as living electricity. He can also obtain
    electrokinetic abilities in this form, giving his the ability to either form threads
    of electricity that he can use to either electrocute enemies or connect himself
    to targets as tethers. **Jade Ghost: As the Jade Ghost, Knuckles is able to turn
    himself invisible and enables him to move around without being visibly detected
    by opponents. The Jade Ghost also makes him intangible, thus allowing him to pass
    through obstacles and avoid unwanted attacks. In addition, the Jade Ghost allows
    Knuckles to hover slightly above ground when using its power. It can even render
    Knuckles intangible to those with Non-Physical Interaction. **Magenta Rhythm:
    Using the power of a Magenta Wisp, Knuckles turns into a large magenta-colored
    eighth note. When in this form, he is able to bounce on air, allowing him to move
    through mid-air in semi-flight. **Orange Rocket: Using the power of an Orange
    Wisp, Knuckles turns into a stubby orange rocket with six fins arranged in a regular
    hexagon on the rear. As the Orange Rocket, he can create powerful jet propulsion
    from his back to launch themselves forward through midair at staggering speeds
    that also damages anything caught in his way. **Pink Spikes: Using the power of
    a Pink Wisp, Knuckles turns into a hot pink spiky ball. As the Pink Spikes, he
    gains long, razor-sharp and extremely durable spikes on his body. By inserting
    these spikes into a surface, he can stick perfectly firm to it that allows him
    to climb up walls and along ceilings. The spikes can also be used offensively
    by using them to pierce opponents. It can also be used to augment her signature
    Spin Attack, making it much more powerful than normal. **Red Burst: Using the
    power of a Red Wisp, Knuckles turns into a red fireball that constantly gives
    off an aura of flames. As the Red Burst, Knuckles obtains pyrokinetic abilities.
    He is able to form a shield of flames around himself that instantly incinerates
    anything it touches, and he can create explosions of fire by combusting into flames
    without inflicting harm on herself. These explosions can be channeled to shoot
    Amy higher into the air or be charged up to trigger large-scale and powerful explosions
    that destroy nearly anything within its range. In addition, Knuckles''s speed
    increases while using Red Burst. **Violet Void: Using the power of a Violet Wisp,
    Knuckles turns into a fast-moving, ghastly and smoky black orb with violet outlines.
    As the Violet Void, Knuckles essentially becomes a living black hole and can warp
    space and time to draw objects into himself from a distance and make them vanish
    witho'
