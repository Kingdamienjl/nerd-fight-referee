      which can grant [https://imgchest.com/p/pg73ap5njyr physical amplifications]
      [https://imgur.com/a/fake-chaos-emeralds-are-superior-boost-to-power-cores-TpFHy7m
      superior] to Power Cores) | Massively FTL (Able to [https://youtu.be/MJJqfz6Ga4k?si=GtSXYtZFXazMS00U&t=27
