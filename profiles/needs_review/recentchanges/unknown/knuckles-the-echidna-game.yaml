      be superior to Shatter Sonic), up to Immeasurable at his peak (Should be able
      to use the full power of the Chaos Emeralds, which enabled Super Sonic to hit
      Solaris before the latter could react. Battled Metal Overlord alongside Super
      Sonic), higher with the Spin Attack | Immeasurable (Far faster than Super Knuckles
      and comparable to Hyper Sonic), higher with the Spin Attack
    source_ids: *id002
