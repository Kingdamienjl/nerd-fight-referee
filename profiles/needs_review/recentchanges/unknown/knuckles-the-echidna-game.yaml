      attacks, though he himself lacks the quickness Sonic has), higher with the Spin
      Attack and with Power Cores | Massively FTL+ (Remains a [https://imgchest.com/p/qe4g3oexkyj
      prominent rival]. Fought against Phantom Ruby's clones of Shadow and Metal Sonic
