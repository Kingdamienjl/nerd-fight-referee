        durability), Resistance to Emotional Manipulation, Madness Manipulation, Mind
        Manipulation (Through his sheer insanity, Ryuji is able to resist the effects
        of Orochi's Riot of the Blood which turns someone into an insane berserking
        beast like it does to Iori Yagami and Leona Heidern), Heat Manipulation, Ice
        Manipulation, Magma Manipulation (Is unaffected by Kula Diamond's ice powers
        which can instantly freeze the area around her when activated and is unaffected
        by the extreme heat from Orochi Yashiro's magma filled arena), Fire Manipulation
        (Is barely effected by powerful fire attacks from the likes of Kyo Kusanagi,
        Iori Yagami, K' and Krizalid), Electricity Manipulation (Can shake of electricity
        based attacks from the likes of Benimaru Nikaido and Blue Mary), Soul Manipulation
        (Can survive Orochi and Zero ripping out and destroying his soul), Time Stop
        (Can fight Saiki in stopped time), Space-Time Manipulation, Reality Warping
        (Was unaffected by Saiki warping Space and Time), Biological Manipulation
        (Can survive being hit by Saiki who can instantly kill someone and rot their
