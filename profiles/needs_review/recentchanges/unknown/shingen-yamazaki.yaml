        Ash Crimson's ability sealing technique), Gravity Manipulation, Black Hole
        Generation (Can survive being sealed into a black hole by Zero One), Petrification
        (Can return to normal after being turned to stone by Mukai), Matter Manipulation
        (Can take hits from Igniz who can casually turn someone into dust just by
        putting his hand on them), Analytical Prediction (Maxima has stated that the
        fighters in the King of Fighters tournament never behave the way his analytical
        data suggests they will), Logic Manipulation (Was unaffected by Otoma=Raga's
        attacks that control the logic of the world)
