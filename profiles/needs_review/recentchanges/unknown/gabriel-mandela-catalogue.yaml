  intelligence:
    text: Extraordinary Genius (Gabriel has been around since, at the very least,
      before the creation of the universe, and as such he presumably holds intimate
      knowledge of the creation of the universe. It's heavily implied that he created
      the Forbidden Fruit of Knowledge of Good and Evil. Gabriel is also the creator
      of the Metaphysical Awareness Disorder, a fatal mental illness caused by hearing
      "information not desired to be known" and/or repeated mental torture. He is
      a cunning and calculating manipulator, capable of effortlessly deceiving the
      likes of Adam and Eve, Dave Lee, Thatcher Davis, and implicitly even God Himself.
      It's heavily implied that he has, through unknown means, managed to "overthrone"
      God, though to what extent is unknown. He also claims to have complete knowledge
      of "what makes [us human,"] and is likely the creator of Adam Murray, who is
      an Alternate so humane that he didn't even realize he was an Alternate himself.
      As the leader of the Alternate hivemind, he should have all their collective
      knowledge and intelligence)
