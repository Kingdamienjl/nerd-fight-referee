        \ Flight, Breath Attack, Ki Manipulation (Can be used defensively and offensively,\
        \ to strengthen his skin or to fire ki blasts, which can home in on targets,\
        \ and form defensive barriers), Acrobatics, Ki Sensing (Can locate others\
        \ by reading their ki), Enhanced Senses (Saiyans have exceptional senses,\
        \ allowing them to locate small, distant objectsDragon Ball, Chapter 29 \u2014\
        \ Find the Stone! by tracking their smellDragon Ball, Chapter 29 \u2014 Find\
