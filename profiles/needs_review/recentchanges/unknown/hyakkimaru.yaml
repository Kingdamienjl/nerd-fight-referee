    confidence: 0.8
  attack_potency:
    text: City-Block level, Higher with Prosthetic Blades (Sliced Nokosaregumo whole
      body clean in half, the latter who can ram through huge formations of rocks
      and produces KE on this levelDodoro Episode 831.73 Tons Of TNT. Impales Nue
      who tried to tackle him and later slashed it to pieces, killing it despite it
      becoming much larger and gaining power, the latter who could collapse a cliff
      after ramming itself into itDodoro Episode 20. Cuts the arms of Hyogo and Mutsu
      in one go of which Hyogo is able to destroy a cliff with his weaponDodoro Episode
      22. Stabs the face of Hakumenfudo (A giant stone buddha statue) that was possessed
      by a demon, creating and sending cracks all the way to its shoulders and dropped
      onto a lift hard enough to send two giant rings upwards with enough force to
      shatter the statue's stone handDodoro Episode 13), Even Higher when Enraged
      (Stronger than before due to demonic residue within him empowering him as he
      explodes in rageDodoro Episode 22)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: At least Subsonic Movement speed/Combat speed/Perceptions & Reaction speed
      (Blitzes a group of soldiers and rapidly cuts them apart, with their movements
      appearing in slow motion compared to hisDodoro Episode 6. Quickly intercepted
      at close range while dodging attacks and outpaced other attacks from Nokosaregumo
      while weakened, the latter who can move this fastDodoro Episode 8At least 55.77
      m/s. Fast enough to be a meaningful threat to Ohagi, who is capable of turning
      to fire off multiple web bursts to catch multiple arrows mid-airDodoro Episode
      7. Dashed out of sight, too fast for armed guards to see or reactDodoro Episode
      11)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class M (Blocked a full onslaughted charge from Nokosaregumo who produces
      this much force levelDodoro Episode 827238.17 Metric Tons. Drops onto a lift
      hard enough to send two large & heavy rings upwards with enough force to shatter
      a Hakumenfudo's hand, which is made of stoneDodoro Episode 13. Blocked a charge
      from an Jiromaru who ate Saburomaru and evolved, who became a giant land-based
      Great White SharkDodoro Episode 18. Easily Stops Nue from pouncing on him with
      his prosthetic blades, lifts it and proceeds to toss it off himDodoro Episode
      20)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: City-Block level, Higher with Prosthetic Blades (Comparable to AP31.73 Tons
