- id: claim-powers-and-abilities-cc8c08b7
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Genius Intelligence (At one point,
    Doug worked as a university researcher alongside his mentor, Professor Claude,
    but Doug was expelled after he punched the Dean of the University in retaliation
    after the Dean falsely claimed that black men couldn''t become great scientists
    or win the Nobel Prize. He instantly knew Axel was attempting to trick him into
    fighting hand to hand and didn''t fall for it) *Elite Marksman (Got 3 headshots
    back to back while driving a boat at the same time) *Martial Arts (While his martial
    arts background is unknown he has shown to be adapt in cqc) *Vehicular Mastery
    (He is the best driver on the Lazarus team, and can also drive boats) *Preparation
    (As a member of the Lazarus team he prepares with the other members for every
    target they engage. Axel is always in communication with the other members and
    always has the location of other members) **Limited Hacking (During his missions
    when Axel is met with a problem, he usually communicates it to Eleina, also known
    by her screen name, Mad Screamer, she is one of top three known hackers in the
    world, and before joining Lazarus, she had committed cyber crimes on a global
    scale) *Acrobatics (Can leap far distances) *Resistance to Poison Manipulation
    (Years ago, the army used Dr. Skinners research to attempt to create bio weapons.
    Skinner attempted to blow the whistle, but the army tracked him down. However,
    they tracked him down at an airport, and the airport security surrounded Skinner
    from the other side. Someone in the baggage claim dropped their suitcase and the
    thud when it hit the floor made everyone open fire. Someone shot Skinner''s suitcase,
    releasing the sample of the poison in his possession. Almost everyone at the scene
    died instantly, only Skinner himself and five others survived. Those five would
    later go on to become the members of Lazarus, and developed a resistance to the
    toxic effect of HapnaLazarus Episode 13) Doug''s Car= *Technology Manipulation
    (Doug''s car has many built in technological functions, such as a built in drone
    that Axel used to fly around on top of while chasing down drug dealers) *Light
    Manipulation via headlights *Sound Manipulation via horn *Gun Attachment (Axel''s
    car has built in guns to shoot at enemies)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
