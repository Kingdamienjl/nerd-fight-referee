- id: claim-powers-and-abilities-6275eff0
  section: abilities
  axis: hax
  text: "* Superhuman Physical Characteristics * Immortality (Types 1 and 7 due to\
    \ being a ghost) * Teleportation * Flight * Incorporeality * Soul Manipulation\
    \ (Made the soul of the Player her servant instantly) * Reality Warping * Spatial\
    \ Manipulation (The mansion itself has strange geometry, such as doors against\
    \ a flat wall leading to an immense room, rooms that change appearance based on\
    \ what angle they were entered in and rooms far underground having a view of the\
    \ outside) * Illusion Creation (Spooky\u2019s Mansion was capable of manifesting\
    \ illusions that could literally hurt you after multiple days of exposure to the\
    \ mansion and were likely the cause of the victim\u2019s \u2018heart palpitations\u2019\
    ) * Sealing (it was explained to us that the Mansion itself can be used to tether\
    \ and seal away Spirits inside of it. This is what we see during the generic death\
    \ screen variant of the game, where \"your soul wanders an endless maze\" You\
    \ couldn't get out then, and you couldn't now. This is further supported by the\
    \ plot of the DLC, where your goal is to break the seal on the Mansion, which\
    \ in turn releases all of the Spirits during the Bad EndingThe Doll House) * Power\
    \ Nullification (Removed the Player's ability of running) * Creation (Made this\
    \ gift out of thin air) * Time Manipulation and Data Manipulation (Spooky was\
    \ able to configure a door in such a way that it effectively undid the floors\
    \ the player had previously traversed, specifically causing the room total to\
    \ revert. In other words, the player was seemingly sent back a few hundred floors,\
    \ as though they had never traversed those rooms in the first place. If interpreted\
    \ literally, this could indicate that time was rewound before subsequently being\
    \ advanced to the correct floor. However, this phenomenon was associated with\
    \ a data overflow or error in the game's code, suggesting that Spooky was more\
    \ likely manipulating the game's data rather than directly controlling the flow\
    \ of time) * Electricity Manipulation (Made a lightning strike) Resistance to:\
    \ * Sealing (Considering the fact that most souls/spirits bound inside the mansion\
    \ are stuck and can not take form its likely that Spooky being unrestricted, makes\
    \ her capable of resisting soul sealment, as she simply ignores the properties\
    \ of the mansion) * Existence Erasure (Upon disabling Specimens & Jump Scares\
    \ from the game via a toggle in the menu, all Specimens will be erased and removed\
    \ from the Mansion. This effect does not get rid of Specimen 9, also Spooky isn\u2019\
    t affected, despite how she should be considered a Specimen; given the implications\
    \ of her essentially being her Father\u2019s life's work when it came to tracking\
    \ down SpecimenSpooky's Jump Scare Mansion: HD Renovation) * BFR and Holy Manipulation\
    \ (Unlike Spooky\u2019s spirits who are incapable of being inside the safe rooms\
    \ due to the \u2018Holy Crosses\u2019 that are found within, as in they\u2019\
    ll literally disappear incapable of chasing you into these cross saferooms; Spooky\
    \ has no problem at all popping in whenever)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
