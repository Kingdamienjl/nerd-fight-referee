    - field: weaknesses
      value: Naive outside of combat. Despite his age, Kirby's still young. Unlike
        fellow warriors in the series, outside of their adventures Kirby's lazy and
        always relaxes with mundane activities. His ability to rest is bestowed by
        the Fountain of Dreams, and if something were to happen to it everyone in
        Dreamland will eventually be restless and irritable. Often celebrates victory
        after notable battles, having once been taken by surprise while doing so (Though
        this should be less of a problem Post-Star Allies, given their power sensing
        ability)
      source_id: character-stats-profiles-fecto-elfilis-unknown
