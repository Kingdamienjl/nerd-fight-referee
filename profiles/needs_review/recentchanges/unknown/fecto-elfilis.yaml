    - field: speed
      value: Massively FTL+ (Can keep up with the Warp Star, which can quickly travel
        from Popstar to Ripple Star and fly to another galaxy in a short period of
        time) | Massively FTL+ (Much faster than before) | Immeasurable (Can keep
        up with the Lor Starcutter and Landia, which can traverse Another Dimension,
