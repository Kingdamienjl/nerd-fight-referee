        ) *As Fecto Elfilis, the descriptions of their Antares\u30FBMeteor and Green\
        \ Flash attacks claim that Fecto Elfilis \"rushes at the speed of light toward\
        \ Kirby\" (\u5730\u4E0A\u306B\u3044\u308B\u30AB\u30FC\u30D3\u30A3\u306B\u5411\
