- id: claim-weaknesses-87773ffb
  section: weaknesses
  axis: weakness
  text: "Across all forms, they have implied trauma, and they are capable of self-destructive\
    \ fits of anger when things don't go their way (See their \"Personality and nature\"\
    \ in their Intelligence above). On top of the following: *Stated to be \"fractured\"\
    , it's unknown if they can survive for long outside their containment, the \"\
    Eternal Capsule\", in base. They can probably survive indefinitely after absorbing\
    \ animals from the Beast Pack, but this is unclear, and it is not an ideal state\
    \ for them to be in, at the very least appearing to be uncomfortable. *Without\
    \ Elfilin, their \"dimensional transport ability turned unstable\", making \"\
    uncontrolled mysterious vortexes\" appear all over, apparently at random. They\
    \ don't use portals in combat yet. This weakness caused the vortexes to summon\
    \ 3 unwanted, problematic creatures from Popstar when kidnapping Waddle Dees there;\
    \ Kirby, Bandana Waddle Dee, and Meta Knight. When defeated, they will fall with\
    \ their back revealing Elfilin in a bubble. After some time Fecto Elfilis will\
    \ absorb him again. But should Elfilin be removed\u2014which Fecto Elfilis will\
    \ try to fight back against\u2014Fecto Elfilis will start melting, and it is unclear\
    \ for how long they can keep their complete form or even survive in this state.\
    \ Still, they would turn into their Soul Forgo form if they die in that state.\
    \ *Without Elfilin, their \"dimensional transport ability turned unstable\", making\
    \ \"uncontrolled mysterious vortexes\" appear all over, apparently at random.\
    \ This caused a portal to randomly open up into Fecto Dream, revealing their secret\
    \ activities. *Lacks a physical body, preferring to possess someone before returning\
    \ to the real world. **Needs a lot of time to fully possess Leongar, and was interrupted\
    \ by the time Kirby & co. reached them, after completing several stages in Forgo\
    \ Dreams. Although it's unclear what Soul Forgo would gain with this \"full\"\
    \ possession, already being able to possess Leongar even after Kirby & co. returned\
    \ Leongar 300 pieces of his soul, making Leongar briefly get back to his senses.\
    \ Stated that \"They no longer have much emotion left, acting only on destructive\
    \ impulses.\" Although it's unclear what exactly that means, given their behavior\
    \ and actions. Feats *A melting Fecto Elfilis, defeated and missing Elfilin, created\
    \ a massive portal in which Planet Popstar could be seen, aiming to drag it through\
    \ the pressure the portal makes to make it crash into the \"New World\" Forgotten\
    \ Land takes place in, to destroy both planets.The movement of Planet Popstar\
    \ shown on-screen has been calculated at Brown Dwarf level/High 5-A (6.30687356e+38\
    \ Joules or 150.74 Ronnatons), with Stellar (3.0740266e+32 Newtons or 3.1346348e+31\
    \ kg) Lifting Strength, and with Popstar moving at Sub-Relativistic speeds (0.01c).\
    \ *As Fecto Elfilis, it's stated that they \"approach with a speed surpassing\
    \ that of the speed of sound\" (\u97F3\u901F\u3092\u8D85\u3048\u308B\u3088\u3046\
    \u306A\u30B9\u30D4\u30FC\u30C9\u3067\u8FEB\u3063\u3066\u304F\u308B) *As Fecto\
    \ Elfilis, the descriptions of their Antares\u30FBMeteor and Green Flash attacks\
    \ claim that Fecto Elfilis \"rushes at the speed of light toward Kirby\" (\u5730\
    \u4E0A\u306B\u3044\u308B\u30AB\u30FC\u30D3\u30A3\u306B\u5411\u304B\u3063\u3066\
    \u5149\u901F\u3067\u7A81\u9032\u3057 and \u30AB\u30FC\u30D3\u30A3\u306B\u5411\u304B\
    \u3063\u3066\u5149\u901F\u3067\u7A81\u9032\u3057\u3066\u304F\u308B). These descriptions\
    \ could be hyperbolic, in this case. Otherwise, Chaos Elfilis shares updated versions\
    \ of those moves that would move at the same speed. *Fecto Elfilis initially \"\
    came flying one day\" to the New World from an unknown point in space. They presumably\
    \ covered interstellar distances in space from one planet to another, although\
    \ they could have used their ability to create portals to shorten the distance.\
    \ Given that they fly by flapping their wing-like ears, this implies constant\
    \ motion along the way. No timeframe is given. Note: In the English version of\
