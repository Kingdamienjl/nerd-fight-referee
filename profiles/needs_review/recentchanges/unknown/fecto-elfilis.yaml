      value: Large Planet level (Fought and defeated Marx, who could survive the destruction
        of Galactic Nova, which can withstand this amount of energy) | Multi-Solar
        System level (Fought and defeated Drawcia, who could create a wave of energy
        that consumed countless stars in the sky) | High Multiverse level+ (Fought
        and defeated Magolor, who was amplified by the Master Crown and could even
        take hits from and defeat said Master Crown after regaining his lost abilities
        in the Magolor Epilogue. The Master Crown itself can survive the collapse
        of Another Dimension, which contains an extra-dimensional road that transcends
        space-time and also is stated to be beyond space-time itself) | High Multiverse
        level+ (Much stronger than before, having defeated foes like Void Termina,
        who can casually create up to four Master Crowns to use as attacks against
        Kirby)
      source_id: character-stats-profiles-fecto-elfilis-unknown
      provider_id: character_stats_profiles
