      value: Animalistic in some instinctive ways, Above Average otherwise. Be they
        Fecto Forgo, Fecto Elfilis, Soul Forgo, or Chaos Elfilis, they all mostly
        maintain the same intelligence, with relatively minor distinctions. They are
        an alien horror with a clever, ruthless mind, capable of methodical plans,
