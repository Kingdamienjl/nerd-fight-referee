  lifting_strength:
    text: "Unknown physically (Fractured without their own half. Quickly grew tentacles\
      \ to lift and drag in several animals from the Beast Pack), likely Multi-Stellar,\
      \ possibly Universal with psychic powers (Using psychic energy, they are later\
      \ shown to create beings that can clash weapons against KirbyPhantom Meta Knight\
      \ battle \xB7 Kirby and the Forgotten Land & Kirby and the Forgotten Land \u2013\
      \ Nintendo Switch 2 Edition + Star-Crossed World while trying to overpower him.\
      \ However, \"Fecto\" was presumably more powerful by then. Currently, Fecto\
      \ Forgo can use their psychic powers to harm Kirby, and this may or may not\
      \ extend to their lifting strength being able to match him as well), Multi-Stellar,\
      \ possibly Universal after absorbing animals from the Beast Pack (Able to endure\
      \ crushing and pressure-based attacks from Post-Star Allies Kirby using Copy\
      \ Abilities, such as Hammer\u2014which crushes lesser enemies flat\u2014and\
      \ Space Ranger's Super Extreme Aim Shot\u2014which forms a black hole-like sphere\
      \ to catch enemies into its center. Can endure Copy Abilties meant to drag enemies\
      \ along\u2014such as Tornado\u2014without losing their positioning, only being\
      \ slowed down)"
