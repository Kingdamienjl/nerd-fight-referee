  section: weaknesses
  axis: weakness
  text: 'Without the SOUL, Kris appears to have difficulty moving. Requires TP to
    cast certain ACTs, such as Courage, Pirouette and X-Slash. Unlike with their weapons
    and armor, Kris can only carry [https://youtu.be/aTp8EW4X3Es&t=2979 12 consumable
    items] at any time. Requires Susie to supercharge their Big Shots, and it only
    lasts for 20 shots. {| class="mw-collapsible mw-collapsed" align="center" border="1"
    cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; " |Notable Attacks/Techniques: |- | [https://deltarune.wiki/w/Encounter#DEFEND
    DEFEND]: Kris transforms their sword into a shield and wields it to block attacks
    and [https://youtu.be/0Y3-XHB-6K0&t=1704 reduce incoming damage]. Using it also
    gathers 16% TP for Kris''s ACTs. [https://deltarune.wiki/w/Kris#ACTs ACTs]: As
    a human, Kris cannot cast spells. Instead, Kris uses the ACT command in different
    ways to face down their opponents. *Chapter 1: **Check: Kris analyzes the target''s
    [https://youtu.be/zfRhmSfs_ok&t=6947 combat] [https://youtu.be/zfRhmSfs_ok&t=6933
    statistics], [https://youtu.be/zfRhmSfs_ok&t=1966 receives some information] about
    [https://youtu.be/zfRhmSfs_ok&t=10948 their life], their mood, [https://youtu.be/zfRhmSfs_ok&t=5339
    their likes and dislikes], [https://youtu.be/zfRhmSfs_ok&t=1963 what] [https://youtu.be/GsNXVVHIObs&t=3685
    they] [https://youtu.be/jy9e4V_Zfhg&t=27337 are], [https://youtu.be/ISXdUxp92mc
    weaknesses], [https://youtu.be/GsNXVVHIObs&t=4980 some] [https://youtu.be/zfRhmSfs_ok&t=10952
    tips] and [https://youtu.be/jy9e4V_Zfhg&t=15608 can obtain] a [https://youtu.be/jy9e4V_Zfhg&t=27008
    straightforward] [https://youtu.be/jy9e4V_Zfhg&t=27343 strategy]. [https://youtu.be/qBOqF9F-MNY&t=13101
    Same] as Aqua in Chapter 5 who [https://youtu.be/qBOqF9F-MNY&t=9664 can see the
    objects] her [https://youtu.be/UuA4a6qrBJI&t=11996 target is carrying]. **Blow
    On/BreathALL/CloakOnX: Kris can [https://youtu.be/qQs6Ea_aQHE blow a wind] capable
    of blowing away [https://youtu.be/f9jLRNGxFmY&t=11316 one] or [https://youtu.be/zfRhmSfs_ok&t=4986
    various] enemies like [https://deltarune.wiki/w/Rabbick Rabbick] and [https://deltarune.wiki/w/Ribbick
    Ribbick]. **Think of Someone: Kris can [https://youtu.be/VR_8F5rpFlI&t=4772 see
    what other people are doing] through the Player''s point of view just by [https://youtu.be/n4tQ7zWk61E&t=83
    closing their eyes] and [https://youtu.be/ovMA1BQiYWU&t=24196 thinking about someone].
    **Courage: Kris encourages the party, boosting their defense and reducing damage
    received by 20%. **Shield: Kris, by using their shield perfectly, can [https://youtu.be/ovMA1BQiYWU&t=8631
    block projectiles/bullets] and [https://youtu.be/eA-RBpfcGgQ&t=9536 push] their
    enemies away. **Pirouette: Kris spins around, making the enemy feel tired. This
    leads to a series of effects, such as: Dropping a target''s defense by 4, lowering
    an enemy''s offense by 30%, healing 25-55 HP to a party member, shuffling the
    group''s HP, increasing the opponent''s attack by 25%, and healing 36-50 HP to
    the team. **Hypnosis: Kris gazes strangely at an opponent, tiring them out and
    reducing their power by 30%. After 9 Hypnosis, Jevil drops completely exhausted.
    *Chapter 2: **TrapOne: Kris can [https://youtu.be/q6WfnAcdlFs&t=5825 summon] a
    red cage to trap enemies, the latter can have [https://youtu.be/lIgyoTsgwIc&t=38
    different] [https://youtu.be/LSzIOVrPIe4&t=75 sizes] when summoned depending on
    the size of the target. **Glare: Kris glares at an opponent, intimidating them
    and decreasing their defense, taking 6.75% more damage. After 8 Glares, Berdly
    loses his resolve to fight. **X-Slash: Kris performs two diagonal strikes with
    their weapon in quick succession, each dealing a critical hit and 25% more damage
    than normal. *Chapter 3: **Sharpshoot: Kris can [https://youtu.be/VR_8F5rpFlI&t=1621
    throw hearts] from their fingers at enemies which can do [https://youtu.be/VR_8F5rpFlI&t=10412
    some] [https://youtu.be/VR_8F5rpFlI&t=17005 damage]. **HoldBreath: Kris [https://youtu.be/KOu-Zaw-uhc&t=4
    held their breath], their heartbeat quickened and the SOUL now moves faster, and
    it accelerates further in extreme situations like in the [https://youtu.be/KOu-Zaw-uhc&t=233
    final attack] of the Knight. *Chapter 4: **Weather Items: Kris can "look at the
    sky and take from it" [https://youtu.be/jy9e4V_Zfhg&t=6131 Sunglasses], a [https://youtu.be/jy9e4V_Zfhg&t=6166
    Telescope], an [https://youtu.be/jy9e4V_Zfhg&t=6228 Umbrella], and a [https://youtu.be/jy9e4V_Zfhg&t=6198
    Warm Hat] to [https://youtu.be/jy9e4V_Zfhg&t=6176 block bullets]. **ScaredyCat:
    Kris can [https://youtu.be/BQ_EbOBa98M&t=25 greatly increase the speed] of their
    SOUL for one turn but their defense decreases too. **Unleash: Kris''s SOUL [https://youtu.be/eA-RBpfcGgQ&t=6020
    can emit a very bright light] that [https://youtu.be/eA-RBpfcGgQ&t=10684 can illuminate
    completely dark rooms], [https://youtu.be/eA-RBpfcGgQ&t=11616 reveal weaknesses]
    and if used within the body of a Titan that [https://'
