        feel tired. This leads to a series of effects, such as: Dropping a target''s
        defense by 4, lowering an enemy''s offense by 30%, healing 25-55 HP to a party
        member, shuffling the group''s HP, increasing the opponent''s attack by 25%,
        and healing 36-50 HP to the team. **Hypnosis: Kris gazes strangely at an opponent,
        tiring them out and reducing their power by 30%. After 9 Hypnosis, Jevil drops
        completely exhausted. *Chapter 2: **TrapOne: Kris can [https://youtu.be/q6WfnAcdlFs&t=5825
        summon] a red cage to trap enemies, the latter can have [https://youtu.be/lIgyoTsgwIc&t=38
        different] [https://youtu.be/LSzIOVrPIe4&t=75 sizes] when summoned depending
        on the size of the target. **Glare: Kris glares at an opponent, intimidating
        them and decreasing their defense, taking 6.75% more damage. After 8 Glares,
        Berdly loses his resolve to fight. **X-Slash: Kris performs two diagonal strikes
        with their weapon in quick succession, each dealing a critical hit and 25%
        more damage than normal. *Chapter 3: **Sharpshoot: Kris can [https://youtu.be/VR_8F5rpFlI&t=1621
        throw hearts] from their fingers at enemies which can do [https://youtu.be/VR_8F5rpFlI&t=10412
        some] [https://youtu.be/VR_8F5rpFlI&t=17005 damage]. **HoldBreath: Kris [https://youtu.be/KOu-Zaw-uhc&t=4
        held their breath], their heartbeat quickened and the SOUL now moves faster,
        and it accelerates further in extreme situations like in the [https://youtu.be/KOu-Zaw-uhc&t=233
        final attack] of the Knight. *Chapter 4: **Weather Items: Kris can "look at
        the sky and take from it" [https://youtu.be/jy9e4V_Zfhg&t=6131 Sunglasses],
        a [https://youtu.be/jy9e4V_Zfhg&t=6166 Telescope], an [https://youtu.be/jy9e4V_Zfhg&t=6228
