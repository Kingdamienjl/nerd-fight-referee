        weapon], [https://deltarune.wiki/w/Item#Armor armor] or [https://deltarune.wiki/w/Item#Consumables
        consumable item], not get the [https://www.youtube.com/watch?v=UHlibLosz2I&list=PLXWRQOreh99vxn5LmFQOhMPc3S8VJm2Pf&t=5884s
        Game Over screen from dying] even once, not get damage from enemies and/or
        [https://www.youtube.com/watch?v=xaQZdvI8Hp4&t=487s hazards] more than 3,
        7, 13 and 21 times in Chapters 1, 2, 3 and 4 respectively (although due to
        forced damage in scripted cutscenes, the actual hit limit in Chapter 3 and
        4 is of [https://www.youtube.com/watch?v=xaQZdvI8Hp4&t=716s 10] and [https://www.youtube.com/watch?v=xaQZdvI8Hp4&t=1144s
        7] respectively instead) and climb over walls (including ones with [https://www.youtube.com/watch?v=hb3Rt0NA8Yw&t=20839s
        obstacles], [https://www.youtube.com/watch?v=hb3Rt0NA8Yw&t=21435s complicated]
