        Ribbick]. ** Think of Someone: Kris can [https://youtu.be/VR_8F5rpFlI&t=4772
        see what other people are doing] through the Player''s point of view just
        by [https://youtu.be/n4tQ7zWk61E&t=83 closing their eyes] and [https://youtu.be/ovMA1BQiYWU&t=24196
        thinking about someone]. ** Courage: Kris encourages the party, boosting their
        defense and reducing damage received by 20%. ** Shield: Kris, by using their
        shield perfectly, can [https://youtu.be/ovMA1BQiYWU&t=8631 block projectiles/bullets]
        and [https://youtu.be/eA-RBpfcGgQ&t=9536 push] their enemies away. ** Pirouette:
        Kris spins around, making the enemy feel tired. This leads to a series of
        effects, such as: Dropping a target''s defense by 4, lowering an enemy''s
        offense by 30%, healing 25-55 HP to a party member, shuffling the group''s
        HP, increasing the opponent''s attack by 25%, and healing 36-50 HP to the
        team. ** Hypnosis: Kris gazes strangely at an opponent, tiring them out and
        reducing their power by 30%. After 9 Hypnosis, Jevil drops completely exhausted.
        * Chapter 2: ** TrapOne: Kris can [https://youtu.be/q6WfnAcdlFs&t=5825 summon]
        a red cage to trap enemies, the latter can have [https://youtu.be/lIgyoTsgwIc&t=38
        different] [https://youtu.be/LSzIOVrPIe4&t=75 sizes] when summoned depending
        on the size of the target. ** Glare: Kris glares at an opponent, intimidating
        them and decreasing their defense, taking 6.75% more damage. After 8 Glares,
