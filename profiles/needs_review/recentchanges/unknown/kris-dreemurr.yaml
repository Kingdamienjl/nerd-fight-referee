        They can swing their blade] with enough dexterity and precision to shave [https://deltarune.wiki/w/Jigsaw_Joe
        Jigsaw Joe] without hurting him, despite being quite fragile. [https://youtu.be/zhEBOFo3GFg&t=12138
        They can use their SOUL] to [https://youtu.be/zhEBOFo3GFg&t=12177 locate]
