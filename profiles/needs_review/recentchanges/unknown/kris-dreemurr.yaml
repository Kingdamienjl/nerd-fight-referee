- id: claim-powers-and-abilities-e5cb1759
  section: abilities
  axis: hax
  text: "Border|||Content= *Lightner Physiology *Knife Wielder (Proficient in the\
    \ use of their knife) *Non-Physical Interaction & SOUL Manipulation (Able to physically\
    \ interact with and rip out their SOUL) *Extrasensory Perception (They\xB4re the\
    \ only one who can see the light of the save points, hence our party members never\
    \ mentioning the savepoints that Kris uses, and so the player only seeing savepoints\
    \ while possesing Kris, otherwise not being able to see them *Supernatural Willpower\
    \ (Even without their SOUL, which holds their will,Deltarune (Chapter 1); 2018;\
    \ \"See that HEART, Kris? That's your SOUL, the culmination of your being! Within,\
    \ it holds your WILL... your COMPASSION... and the FATE of the world.\" - Ralsei\
    \ during the tutorial encounter with the Dummy they are still determined enough\
    \ to open a Dark Fountain.Deltarune (Chapter 2); 2021; \"This Power... This Power\
    \ Of The Will This Power Of Determination... Is This Not Something That All Lightners\
    \ Possess...? If One Was Simply Determined Enough Could Not Anyone Make A Dark\
    \ Fountain?\" - Queen in the cutscene before the boss battle with GIGA Queen Can\
    \ bear the pain of ripping out their SOUL, and they are normally unaffected by\
    \ enemy attacks) *Multiple Selves (Type 1 or Type 2; It's implied that Kris, as\
    \ a person, is independent from the SOUL, or to be a completely separated entityDeltarune\
    \ (Chapter 2); 2021; \"Boss! You can ACT and SPARE on the same turn! If you know\
    \ Kris's ACT will give an enemy 100% mercy... SPARE them on the same turn with\
    \ Susie and Ralsei!\" - Jigsaw Joe during his encounter in the Party Dojo) *Breaking\
    \ the Fourth Wall (Kris is aware that they are being controlled by an outsider\
    \ entity) *Time Manipulation, Immortality & Healing (Types 4 & 8; Through the\
    \ Player who can resurrect them through the Save System and The Voice that gives\
    \ the latter the option to load the file, even going back to before just starting\
    \ a battle with no save point required. Kris can see and interact with the Save\
    \ Points. Can use the Player's SAVE File to re-try events from the start, even\
    \ at death. The Save Points always appearing in the places where they feel something\
    \ in particular and can heal them completely. In the Light World they have a save\
    \ file with their name and they recognize the save point outside the Dark World)"
