      value: 'High Hyperversal+ (#1: Can deal minor damage to the Titan''s shield
        and harm the Titan Spawn, whose DF is higher than the Titan''s AT, which can
        harm a low DT Red SOUL, which empowers Frisk, who can [https://www.youtube.com/watch?v=h__y5gyJZKw&t=95s
        harm] Mad Mew Mew, who [https://www.youtube.com/watch?v=NIzpDmyhFQ8&t=4s survived
        a hit from 3D Toriel], who was [https://x.com/tobyfox/status/802148038072528896?t=4mVSmMyAkDkZufvcO5jQ5Q&s=19
        stated to be canon]. This same 3D Toriel has R>F transcendence over [https://youtu.be/rOBTEs8fqhE?t=60
        1 Undertale timeline], which should include another copy of 3D Toriel across
        [https://i.supaimg.com/a19d3186-0a93-465b-9fc9-16f203fe86b7/a7688185-c672-4631-a088-363ea6f2a8f9.jpg
        infinite timelines with infinite copies] of nearly all characters performing
        the same loop, granting infinite R>F levels, with each +1D extending up to
        infinite dimensionality. #2: For consistency, Annoying Dog was sitting and
        survived an encounter after 3D Toriel, thus they should be as ontologically
        coherent as 3D Toriel, with the same infinite R>F)'
