    - field: weaknesses
      value: 'Without the SOUL, Kris appears to have difficulty moving. Requires TP
        to cast certain ACTs, such as Courage, Pirouette and X-Slash. Unlike with
        their weapons and armor, Kris can only carry [https://youtu.be/aTp8EW4X3Es&t=2979
        12 consumable items] at any time. Requires Susie to supercharge their Big
        Shots, and it only lasts for 20 shots. {| class="mw-collapsible mw-collapsed"
