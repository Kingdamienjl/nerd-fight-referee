  intelligence:
    text: 'Above Average (Kris is the capable and cunning leader of the Delta Warriors,
      commanding the group in combat and solving puzzles for them. Berdly, despite
      his disdain for most other students, considers Kris the third smartest student
      in the class, only behind himself and Noelle, despite Kris not really studying
      with anyone else, or at all, Kris''s impressive charisma allows them to beat
      even the most violent enemies through ACTs of kindness) *Combat Skill: In combat
      they are capable of avoiding projectiles from multiple opponents at once, and
      even dodge bullet hell attacks from enemies as formidable as Jevil, Spamton
      NEO, The Roaring Knight and the Titan. Tenna comments on Kris''s ability to
      [https://deltarune.wiki/w/Pippins#:~:text=%5BTenna%5D%20Wow!!%20Our%20heroes%20are%20grazing,TV!!!%20%5BNeutral%2C%20if%20grazing%20is%20performed%5D
      dodge and not take damage]. During the battle with The Roaring Knight, [https://youtu.be/KOu-Zaw-uhc&t=259
      Kris fakes a cough to signal that neither they nor their allies] were [https://deltarune.wiki/w/Knight#Quotes:~:text=Kris%20coughed.%20The%20enemy%20slowly%20tilted%20its%20head...%20%5BAfter%20using%20its%20final%20attack%2C%20if%20no%20hits%20were%20taken%20up%20to%20Charge%2Dup%20and%20no%20one%20is%20DOWNed/SWOONed%20by%20the%20final%20attack%5D
      harmed], Comparable to Susie, who can beat Gerson [https://youtu.be/oL3i6DuJ4aw&t=561
      on her first try]. Their sword attacks always land on their targets, [https://youtu.be/QU2B3q6iLmA&t=285
      regardless of their agility]. [https://youtu.be/QuMiAWTtZoM&t=14 They learned
      how to fight] shortly after they entered the Dark World, to the point of impressing
      Ralsei, who stated that Kris is [https://youtu.be/QuMiAWTtZoM&t=4 natural] and
      [https://youtu.be/SvwElpKH3O0&t=775 great at attacking]. Can formulate strategies
      to defeat all kinds of enemies peacefully and violently. Kris has an incredible
      sense of equilibrium, being [https://youtu.be/5Bd7YCt5VRE able to balance a
      giant orb of trash] on their head. [https://youtu.be/qjxagjiXE9U&t=8 They can
      swing their blade] with enough dexterity and precision to shave [https://deltarune.wiki/w/Jigsaw_Joe
      Jigsaw Joe] without hurting him, despite being quite fragile. [https://youtu.be/zhEBOFo3GFg&t=12138
      They can use their SOUL] to [https://youtu.be/zhEBOFo3GFg&t=12177 locate] one
      of [https://youtu.be/zhEBOFo3GFg&t=12262 their allies in complete darkness].
      Could defeat the Roaring Knight without getting a single hit, with it using
      as [https://www.youtube.com/watch?v=KOu-Zaw-uhc&t=158s attacks] [https://www.youtube.com/watch?v=KOu-Zaw-uhc&t=113s
      multiple] [https://www.youtube.com/watch?v=KOu-Zaw-uhc&t=193s complex] [https://www.youtube.com/watch?v=KOu-Zaw-uhc&t=234s
      patterns], as noted from Kris [https://www.youtube.com/watch?v=0YLonMJP1Rw&t=220s
      coughing if they do so] unlike [https://www.youtube.com/watch?v=x7A00ahhpqc&t=418s
      in other cases], even [https://www.youtube.com/watch?v=AHPvFaRhvVY&t=619s managing
      to do so without] the [https://deltarune.wiki/w/Shadow_Mantle Shadow Mantle],
      an item that greatly reduces damage dealt from the Knight and that is stated
      as something mandatory to defeat it from [https://www.youtube.com/watch?v=AHPvFaRhvVY&t=619s
      multiple] [https://www.youtube.com/watch?v=wNdW8renScU&t=40s characters] despite
      the fact that the Delta Warriors have defeated prior Jevil and Spamton NEO,
      who both also use patterns that are far harder than the rest of the bosses of
      their respective chapters. Can clear the entire game through all the Chapters
      without getting [https://psnprofiles.com/trophies/34339-deltarune any of the
      achievements] as [https://www.youtube.com/watch?v=hb3Rt0NA8Yw&t=24048s even
      acknowledged from the game], something that has been described by Toby Fox as
      a "[https://imgur.com/a/EwbAs2n hard-core challenge]" and that requires to fulfill
      all the following requirements: not use any [https://deltarune.wiki/w/Item#Weapons
      weapon], [https://deltarune.wiki/w/Item#Armor armor] or [https://deltarune.wiki/w/Item#Consumables
      consumable item], not get the [https://www.youtube.com/watch?v=UHlibLosz2I&list=PLXWRQOreh99vxn5LmFQOhMPc3S8VJm2Pf&t=5884s
      Game Over screen from dying] even once, not get damage from enemies and/or [https://www.youtube.com/watch?v=xaQZdvI8Hp4&t=487s
      hazards] more than 3, 7, 13 and 21 times in Chapters 1, 2, 3 and 4 respectively
      (although due to forced damage in scripted cutscenes, the actual hit limit in
      Chapter 3 and 4 is of [https://www.youtube.com/watch?v=xaQZdvI8Hp4&t=716s 10]
      and [https://www.youtube.com/watch?v=xaQZdvI8Hp4&t=1144s 7] respectively instead)
      and climb over walls (including ones with [https://www.youtube.com/watch?v=hb3Rt0NA8Yw&t=20839s
      obstacles], [https://www.youtube.com/watch?v=hb3Rt0NA8Yw&t=21435s complicated]
      [https://www.youtube.com/watch?v=hb3Rt0NA8Yw&t=22821s patterns] and hazards)
      in less than 90 seconds, [https://youtu.be/xaQZdvI8Hp4?si=eBIcBXwQPM1IIeSn&t=1425
      with all of this being done in an account that didn''t play Deltarun'
    source_ids:
    - vsbattles-kris-dreemurr-unknown
    confidence: 0.6
    notes: auto_repair source extraction
