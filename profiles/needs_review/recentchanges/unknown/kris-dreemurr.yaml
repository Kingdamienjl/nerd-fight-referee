      value: Immeasurable combat and reaction speeds (Tied with a low DT Red SOUL's
        speed, which [https://youtu.be/aT_i1qisCYk?si=p9tG3unccbDpeW19 kept up with
        Undertale Asgore], who [https://i.supaimg.com/a19d3186-0a93-465b-9fc9-16f203fe86b7/09730b56-da62-44bd-9c25-cd24d6a7de82.jpg
        defeated high LV Flowey], who [https://i.supaimg.com/a19d3186-0a93-465b-9fc9-16f203fe86b7/fbef764b-1711-41a2-b0d9-6cfb86db6909.jpg
        defeated Sans], who can dodge projectiles from the Empty Gun, [https://ibb.co.com/FL8XcwpF
        which are implied to be Save Points by matching their forms, with the gun
        being empty]. Save Points can transport Frisk through time, placing them beyond
        its flow; thus, they are not bound by the Speed Formula and transcend the
        concept of speed, granting Immeasurable speed. Supporting this, Save Points
        withstood Asriel's Hyper Goner attack, which destroyed a timeline including
        space-time, alongside being composed of DETERMINATION, making this scaling
        more consistent. Travel speed should be the same thanks to them being comparable
        to Sans who was riding a bike with his legs in Pacisist Credits, making him
        slower than Undyne who caught up to Papyrus's house in mere moments)
