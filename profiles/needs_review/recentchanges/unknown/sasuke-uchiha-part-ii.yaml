    - field: weaknesses
      value: "Sasuke is a bit overconfident and short-tempered. He can also easily\
        \ be manipulated emotionally, though this weakness is non existent as an Adult.\
        \ Lacks his left arm. Traveling between dimensions consumes a great portion\
        \ of his Chakra reserves. Notable Attacks/Techniques: Shadow Clone Technique:\
        \ The user creates tangible \u201Cshadow clones\u201D that can fight and use\
        \ his techniques but disappear after one strong hit and relay their memories\
        \ and experiences to him. Summoning Technique: The Summoning Technique is\
        \ a space-time ninjutsu that allows the summoner to summon animals or people\
        \ across long distances instantly. Sasuke can summon Garuda, his hawk, and\
        \ snakes. Sharingan (Mirror Wheel Eye): The first of the Sharingan's powers\
        \ is being able to see the flow of chakra even through solid obstacles, greatly\
        \ enhances his vision, also allowing him to effectively keep track of swift-moving\
        \ objects, see and give color to chakra, and can even let him see on a cellular\
        \ scale.The Sharingan allows the user to copy Jutsu used by others, including\
        \ combat styles. He can predict someone's movements based on the minor muscle\
        \ tension thanks to the Sharingan, allowing him to retaliate and counterattack\
        \ efficiently. *Sharingan Genjutsu: a generic illusion technique used by Uchiha\
        \ clan members. By having their opponents look into their eyes, the Uchiha\
        \ can lock the user within an illusion of their choosing. This visual illusion\
        \ technique is also greatly amplified by activating Mangeky\u014D. Mangeky\u014D\
        \ Sharingan (Kaleidoscope Copy Wheel Eye): An advanced form of the Sharingan.\
        \ *Amaterasu: Sasuke creates a black fire that moves with his gaze. The flames\
        \ are shown to be very resilient as they have survived complete immersion\
        \ in water. It is powerful enough to smother any normal flames and burn for\
        \ seven days and nights. Sasuke can manipulate and shapeshift it at will.\
        \ *Susano'o: A gigantic, humanoid figure that surrounds the user. Susanoo\
        \ is formed through the materialization of the user's chakra. It differs in\
        \ appearance and color between users. Katon (Fire Release): One of the fundamental\
        \ elemental nature transformations. It is performed by molding superheated\
        \ chakra inside the stomach before releasing it via the lungs and mouth. There\
        \ are also variants to this in some mediums, such as gun powder, explosive\
        \ tags, and chakra flow into a weapon. *Great Fireball: A technique where\
        \ chakra kneaded inside the body is converted into fire and expelled from\
        \ the mouth either as a massive orb of roaring flame or as a continuous flame-thrower.\
        \ The scope of the attack is altered by controlling the volume of chakra that\
        \ is mustered. *Phoenix Sage Fire: This technique creates a volley of small\
        \ fireballs, which are sent flying unpredictably, assaulting the enemy. In\
        \ addition, the flames are controlled one by one with chakra. *Dragon Fire:\
        \ The user breathes fire along a cord or any other type of long object, which\
        \ rushes forward in a straight line catching the enemy on fire. *Great Dragon\
        \ Fire: The user compresses tremendous chakra built up inside their body and\
        \ changes it into a dragon-shaped fireball. The user then skillfully manipulates\
        \ that great fire and attacks their opponent. Mangeky\u014D Sharingan: Enton\
        \ (Blaze Release): An advanced chakra nature. Sasuke uses this technique to\
        \ manipulate the unquenchable black flames of Amaterasu. *Magatama: Utilizing\
        \ the orb in his Susanoo's third hand, Sasuke can rapidly produce several\
        \ magatama projectiles, composed entirely from the black flames of Amaterasu.\
        \ Upon impact, victims of this technique are forcefully thrown off their feet\
        \ and quickly incinerated by the intense flames. *Kagutsuchi: Sasuke creates\
        \ a barrier that not only shields him but also burns and pierces any opponent\
        \ that touches the flames. The technique can also be used in conjunction with\
        \ his Susanoo and its weaponry. *Shield of Black Flames: Sasuke manipulates\
        \ the flames of Amaterasu to surround himself with a shield of black fire.\
        \ Raiton (Lightning Release): One of the basic elemental nature transformation\
        \ techniques that allow the user to generate lightning by increasing the high-frequency\
        \ vibrations of their chakra, allowing for piercing damage and fast movement.\
        \ The electricity also can paralyze the target. While uncommon, lightning\
        \ can be infused into bladed weapons in a way similar to Wind Release through\
        \ chakra flow for increased piercing power through vibrations, with the added\
        \ effect of inducing numbness *Chidori: This technique channels massive lightning\
        \ chakra to the user's hand. Once the technique is completed, the user charges\
        \ forward and thrusts the Chidori into the target. *Chidori Current: By releasing\
        \ the Chidori in every direction, an electrical discharge flows from Sasuke's\
        \ entire body, allowing him to affect multiple enemies. *Chidori Senbon: This\
        \ is one of many variations of the Chidori that uses shape transformation.\
        \ It is specialized in more speed by being transformed into countless sharp\
        \ senbon, all aimed at the enemy. *Chi"
