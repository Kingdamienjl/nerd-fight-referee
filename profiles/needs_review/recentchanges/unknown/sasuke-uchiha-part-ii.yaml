    - field: intelligence
      value: Genius (Has trained with Orochimaru in his curse mark use and swordplay
        for three years, having come back during the early parts of Shippuden easily
        [https://imgur.com/a/n7MET4X outperforming] Naruto and Sakura to the point
        it's stated he's left them in the [https://imgur.com/a/kLMYBPA dust]. Naruto
        also acknowledges that he needs to [https://imgur.com/a/yYAoa6F catch up to
        Sasuke] and thus wants to learn a [https://imgur.com/a/SwVs9I0 new jutsu]
        that'll surpass Kakashi. Is such an exceptional fighter he is able to fight
        hundreds of ninjas, [https://imgur.com/a/VnWPNFH avoiding their vitals and
        having not a drop of blood on him], with Orochimaru considering him above
        himself, a genius in his own right at a young age. Sasuke is a rather smart
        planner and good with noticing worthy ninjas, [https://imgur.com/a/g07BAON
        having planned on recruiting Suigetsu, Jugo and Karin] for their individual
        abilities. Is noted to be good at his curse mark use, being able to do [https://imgur.com/a/9euWLyN
        segmental transformations] by Jugo even being compared to Kimimaro. And Sasuke
        seems to have a decent understanding in the science department, utilizing
        his fire style and amaterasu to form a [https://imgur.com/a/dDhZPyU thundercloud].
        The [https://imgur.com/a/xdzM85Q databook] has noted Sasuke to be resourceful,
        has a keen ability to observe and analyze an opponents power such as when
        he [https://imgur.com/a/ySW1OFY formulated a hypothesis] against Deidara's
        bomb and will even have [https://imgur.com/a/82Ph6cB back up plans formed]
        if he's wrong. It as well [https://imgur.com/a/xdzM85Q states] Sasuke is able
        to see the path to victory in fights. It also says when necessary Sasuke will
        allow himself to be hurt putting him in a special class of shinobi as it shows
        his resolve and ability to act)
      source_id: mediawiki-3218
      provider_id: vsbattles
      authority: high
