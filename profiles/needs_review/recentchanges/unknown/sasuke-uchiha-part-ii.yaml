    - field: weaknesses
      value: "Sasuke is a bit overconfident and short-tempered. He can also easily\
        \ be manipulated emotionally. The Sharingan's ability to copy Ninjutsu, Genjutsu,\
        \ and Taijutsu is [https://imgur.com/gallery/BwAlsIQ limited by the user's\
        \ physical condition], that is to say that the user needs to be physically\
        \ capable of performing the technique they are trying to replicate. They need\
        \ to meet any physical or chakra amount prerequisites the technique in question\
        \ may have. This ability is also [https://imgur.com/d7JHjAk incapable] of\
        \ [https://imgur.com/b7Ud9vn replicating Kekkei Genkai], due to either not\
        \ possessing the genetic predisposition and/or having the necessary chakra\
        \ natures. Naturally, the user also needs to actually see the technique they\
        \ are attempting to copy, meaning they cannot copy something they did not\
        \ see or is obscured from their line of sight. In fact, the same can be said\
        \ for essentially all of the Sharingan's abilities; they are sight based abilities,\
        \ so if the opponent can obscure the user's vision [https://imgur.com/gallery/vhinaOp\
        \ using extremely thick mist/dust] or blind them, the Sharingan's abilities\
        \ will be rendered useless. Likewise if the opponent is too fast for the Sharingan\
        \ to visually keep track of them, they will be safe from its abilities. Sharingan\
        \ Genjutsu requires eye contact, so if the opponent is able to avoid eye contact\
        \ or is blind, they will be able to avoid Sharingan Genjutsu entirely. Finally,\
        \ the Sharingan's predictive capabilities can be somewhat circumvented by\
        \ attacks that have little to no pattern, such as [https://imgur.com/gallery/kpckaTX\
        \ Naruto's chakra arms] that emerge from any part of his body and attack instinctively.\
        \ | The Mangeky\u014D Sharingan offers far more power than the regular Sharingan,\
        \ but that power comes at a cost. More powerful techniques entail a far higher\
        \ chakra cost, making Mangeky\u014D Sharingan Jutsu extremely taxing to use\
        \ and maintain. Additionally, the Mangeky\u014D Sharingan also causes great\
        \ strain on the user's vision, eventually resulting in complete blindness\
        \ with continuous use. The Susano'o causes its user immense pain \"[https://imgur.com/a/o2QfJSs\
        \ in every cell in their body]\". Incapable of utilizing the Six Paths Chibaku\
        \ Tensei and Majestic Attire Susano'o without Naruto, and cannot utilize the\
        \ Six Paths Susano'o or Indra's Arrow without enslaving all 9 Tailed Beasts\
        \ inside 9 Chibaku Tensei. {| class=\"mw-collapsible mw-collapsed\" align=\"\
        center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
        \ | colspan=\"2\" style=\"text-align: left; \" |Notable Attacks/Techniques:\
        \ |- | {{Nihongo|Sharingan|}}: The first of the Sharingan's powers is being\
        \ able to see the flow of chakra. The Sharingan itself gives color to chakra,\
        \ allowing the wielder to differentiate them. Sharingan's second-most prominent\
        \ ability grants the user an incredible clarity of perception, allowing the\
        \ user to pick up subtle details. As Sharingan evolves, this ability extends\
        \ to track fast-moving objects before finally giving some predictive capabilities\
        \ to the user, allowing them to see the image of an attacker\u2019s next move\
        \ from the slightest muscle tension in their body. Sharingan's third and most\
        \ well-known ability is that it grants the user the ability to memorize almost\
        \ any technique they witness. Sharingan users can also induce unique hypnosis\
        \ that involves suggesting actions and thoughts to the opponent through an\
        \ illusion cast by eye contact between both parties. *Sharingan Genjutsu:\
        \ a generic illusion technique used by members of the Uchiha clan. By having\
        \ their opponents look into their eyes, the Uchiha can trap the victim within\
        \ an illusion of their choosing. *Susanoo Genjutsu: Using his Sharingan, Sasuke\
        \ stares at his opponent directly in the eye. Then a shadowy figure of himself\
        \ appears before them forcing them under a genjutsu. An image resembling his\
        \ Susanoo appears in front of the opponent and grasps them as it begins \"\
        assimilating\" them into itself. This breaks the opponent's will. Afterward,\
        \ the opponent is left incapacitated. thumb|220x220px {{Nihongo|Mangeky\u014D\
        \ Sharingan|}}: An advanced form of the Sharingan that is acquired through\
        \ the trauma experienced from the death of the person closest to the Sharingan\
        \ user. Over time, the use of the Mangeky\u014D Sharingan's techniques deteriorates\
        \ the user's eyesight to the point of blindness. Only by taking and transplanting\
        \ the Mangeky\u014D of another Uchiha clan member can the vision be restored,\
        \ a process that results in the creation of an Eternal Mangeky\u014D Sharingan.\
        \ Not only does this process permanently restore one's eyesight, but it also\
        \ gives the person even greater power. *{{Nihongo|Amaterasu|}}: Sasuke summons\
        \ black fire that moves with his gaze. The flames are shown to be very resilient\
        \ as they have survived complete immersion in water. It is powerful enough\
        \ to smother any normal flames and is said to burn for seven days and nights.\
        \ **{{Nihongo|Inferno Style||Enton}}: An advanced chakra nature. Sasuke uses\
        \ this technique"
