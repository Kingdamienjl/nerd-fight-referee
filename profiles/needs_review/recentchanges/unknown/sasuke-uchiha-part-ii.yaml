    \ Flight *Regeneration (Low-Mid; up to High-Mid with the Substitution Jutsu) *Immortality\
    \ (Types 3 & 6) *Snake Manipulation *Pocket Reality Destruction (He was eroding\
    \ the dimension Orochimaru created with just his will) -Sharingan= *Enhanced Sight\
    \ (1 Layer\u3010Invisibility\u3011; The Sharingan provides its user with an incredible\
    \ [https://i.imgur.com/lgPuUvP.png clarity of perception]. This allows the user\
    \ to easily [https://imgur.com/gallery/AwtHprI keep track] of fast moving targets\
    \ with astonishing clarity. This clarity of vision also allows the user to easily\
    \ [https://i.imgur.com/7Uh4cUL.jpeg perceive and decipher] hand seals [https://i.imgur.com/pRZ0VAY.jpeg\
    \ at great speeds], [https://i.imgur.com/OQ7OCv4.jpeg read lips], and perceive\
    \ [https://i.imgur.com/jm0tOos.jpeg pencil movements] in order to mimic them.\
    \ The Sharingan can also [https://i.imgur.com/9GeDS3P.jpeg see chakra] as different\
    \ colors, even [https://i.imgur.com/he6QHcE.jpeg through certain solid obstacles],\
    \ and even perceive [https://i.imgur.com/0vUag3S.jpeg invisible individuals] and\
    \ [https://i.imgur.com/ZygjHdY.jpeg entities]. The Sharingan also allows its user\
    \ to focus their vision and act like a microscope, allowing it to see objects\
    \ on a [https://i.imgur.com/nO95e6h.jpeg cellular level] and clearly [https://imgur.com/gallery/AnyQA4o\
    \ perceive viruses]) **Analytical Prediction (The Sharingan allows its user to\
    \ clearly [https://i.imgur.com/dsL12EL.jpeg anticipate] their opponent's next\
    \ moves and [https://i.imgur.com/GWW0Wdd.jpeg flawlessly counter them]. A fully\
    \ matured Sharingan can even [https://imgur.com/gallery/zGqJyfo see a clear visual\
    \ image of the opponent's next moves], allowing for efficient evasion and counterattacks\
    \ without any wasted movements) *Information Analysis & Power Mimicry (The Sharingan\
    \ has the ability to \"[https://i.imgur.com/g1bVXsI.png discern the reality behind\
