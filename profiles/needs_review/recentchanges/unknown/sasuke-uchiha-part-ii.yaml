power_scale:
  tier:
    text: ", with Sharingan, higher with CS1, even higher with Partial Transformation,\
      \ with CS2, with Kirin | , with Sharingan, higher with Mangeky\u014D Sharingan\
      \ | , higher with Mangeky\u014D Sharingan, with Chidori, far higher with Susano'o\
      \ | , higher with Susano'o, far higher with Perfect Susano'o, with Senjutsu\
      \ Susano'o, higher with Majestic Attire Susano'o, far higher with Majestic Attire\
      \ Susano'o & Rasengan Barrage | physically, higher with Ninjutsu, even higher\
      \ with Chidori, far higher with Kusanagi no Tsurugi: Chidorigatana, even higher\
      \ with Susano'o, far higher with Six Path's Susano'o, even higher with Indra's\
      \ Arrow and Majestic Attire Susano'o"
    source_ids:
    - vsbattles-sasuke-uchiha-part-ii-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "City level+ (Even before absorbing Orochimaru, he could [https://imgur.com/gallery/I2SUzEp\
      \ casually overpower] Sai), Mountain level with Sharingan ([https://imgur.com/a/hWsm0JC\
      \ Physically clashed] with Itachi Uchiha, who was using the Mangeky\u014D Sharingan,\
      \ after matching his shuriken-jutsu), higher with CS1 (At least one-tenth as\
      \ powerful as his CS2 state), even higher with Partial Transformation (Can [https://imgur.com/a/pTpnBw0\
      \ partially transform into CS2] to enhance his strength), Large Mountain level\
      \ with CS2 ([https://imgur.com/a/QKYVwop Created the thundercloud that spawned\
      \ Kirin] with his Fierce Dragon Flame Jutsu), Island level with Kirin (Completely\
      \ obliterated an entire mountain)"
    source_ids:
    - vsbattles-sasuke-uchiha-part-ii-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "At least Sub-Relativistic (By integrating the Shunshin no Jutsu into his\
      \ fighting style, his speed became so overwhelming that Tobi remarked it was\
      \ too fast for Deidara to handle. He effortlessly evaded Deidara\u2019s point-blank\
      \ sneak attacks, with Deidara repeatedly commenting on how fast Sasuke was.\
      \ This portrayal is further supported by the databook, which describes his speed\
      \ as \u201Cgodlike\u201D. Moved too fast for Sakura to keep up with), higher\
      \ with Chidori (The Chidori is a technique that dramatically increases the user's\
      \ speed\u2014so much so that they struggle to perceive or react to their opponents\
      \ while using it. This is particularly notable considering that most ninja can\
      \ already enhance their speed and reflexes with the Body Flicker Technique without\
      \ significant drawbacks. Despite this, Minato outright forbade Kakashi from\
      \ using the Chidori, underscoring its risks. The technique\u2019s major drawback\u2014\
      impaired perception at high speed\u2014can only be compensated for with at least\
      \ a two-tomoe Sharingan), even higher with CS1 and CS2 (Briefly outran Itachi's\
      \ Amaterasu), even far higher Reactions with Sharingan (The Sharingan grants\
      \ its user the ability to keep up with\u2014and even counterattack\u2014opponents\
      \ who were previously overwhelming them in terms of speed), higher with Kirin"
    source_ids:
    - vsbattles-sasuke-uchiha-part-ii-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class G (Far stronger than his previous self due to training rigorously
      for 3 years, [https://ibb.co/Zpw6Ryb9&#x20;https://ibb.co/NgxZj6rT Casually
      sent Sai flying through] [https://ibb.co/Zpw6Ryb9&#x20;https://ibb.co/NgxZj6rT
      Orochimaru's hideout]), far higher with CS1 (The Curse Seal greatly increases
      Sasuke's Lifting Strength, 10 times weaker than his CS2 state), Class T with
      CS2 (Much stronger than his previous Curse mark second state)
    source_ids: &id002
    - mediawiki-3218
    confidence: 0.8
  striking_strength:
    text: City level+ (Casually overpowered Sai), Mountain level with Sharingan (Comparable
      to Itachi Uchiha), higher with CS1 (At least one-tenth as powerful as his CS2
      state), even higher with Partial Transformation, Large Mountain level with CS2
      (Comparable to his attack potency)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: City level+, Mountain level with Sharingan (Comparable to his striking strength),
      higher with CS1 (At least one-tenth as durable as his CS2 state), even higher
      with Partial Transformation, Large Mountain level with CS2 (Comparable to his
