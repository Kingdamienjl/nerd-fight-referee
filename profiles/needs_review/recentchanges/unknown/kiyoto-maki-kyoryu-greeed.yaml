- id: claim-powers-and-abilities-4b69ecbe
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Regeneration (Varis depend on how many
    Cell Medals he had, Low-High at most) (Greeed's can regen from a single Core Medal
    if they had enough Cell Medals), Creation (A Greeed can create Yummies by placing
    a Cell Medal into a Medal Insert Slot. Instead of using humans to make Yummies,
    Kiyoto's are made using inanimate objects that represent the end of a desire,
    such as broken dreams.), Body Control (Can turn his body into a mass of Cell Medals,
    them reforming it back to his original state), Fire Manipulation (He can launch
    purple blasts of flames from his hands), Air Manipulation (He can fire the same
    purple wind-like attack that Eiji Greeed demonstrates.), Limited Telepathy (Because
    of the Purple Cores, Maki now shares a connection with Eiji. The two can detect
    each other's presence, and Maki has even been able to forcibly activate the power
    of Eiji's purple Cores simply by looking at him and activating his own), Possession
    (If a Greeed's body is destroyed but the Medal containing its consciousness remains
    the Greeed is able to act autonomously and possess human bodies), Resistance to
    Perception Manipulation (The Greeed's lack of proper senses, resulting in bleak
    sensory input (e.g., colors are washed out, taste is nonexistent, sounds are muffled
    and distorted); Soul Manipulation (Greeeds are the beings made from mass of cell
    medals, which are nothing but crystalized "desires" and have no soul of their
    own. Their consciousness is held inside the core medals, which act as their prime
    power source), Transformation (He can change between his Greeed and human form),
    Enhanced Senses (He can sense the Yummy monsters in this form), Inorganic Physiology
    (Type 2) (The Greeed body are made of Cell Medals, thus lacking of any organic
    part), Immortality (Type 3 and 8) (Should Greeed had been destroyed, they can
    still be revived as long as his main Core Medal intact), Flight, Absorption (Greeed
    can consume Cell Medals to become stronger or healing themselves), Void Manipulation
    (Like the Medagaburyu Axe, the Kyoryu Greeed has the ability to damage, if not
    completely destroy, the Core Medals of the other Greeed. The Core Medals itself
    are forms of artificial life and manifestations of desire, the Purple Core Medals
    are antithesis to and can completely erase other Core Medals), Resistance to Void
    Manipulation, Existence Erasure and Conceptual Manipulation (Tanked Kamen Rider
    OOO's attack while he was in Putotyra form. Other Greeed would have their Core
    Medals shatter from an a casual strike. While Maki's Core is undamaged)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
