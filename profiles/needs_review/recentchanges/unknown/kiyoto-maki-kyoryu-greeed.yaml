        by looking at him and activating his own), Possession (If a Greeed's body
        is destroyed but the Medal containing its consciousness remains the Greeed
        is able to act autonomously and possess human bodies), Resistance to Perception
        Manipulation (The Greeed's lack of proper senses, resulting in bleak sensory
        input (e.g., colors are washed out, taste is nonexistent, sounds are muffled
        and distorted); Soul Manipulation (Greeeds are the beings made from mass of
        cell medals, which are nothing but crystalized "desires" and have no soul
        of their own. Their consciousness is held inside the core medals, which act
        as their prime power source), Transformation (He can change between his Greeed
        and human form), Enhanced Senses (He can sense the Yummy monsters in this
        form), Inorganic Physiology (Type 2) (The Greeed body are made of Cell Medals,
        thus lacking of any organic part), Immortality (Type 3 and 8) (Should Greeed
