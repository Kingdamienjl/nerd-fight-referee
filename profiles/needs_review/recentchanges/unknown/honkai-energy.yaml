    \ possessing a strong interrelationship with information, allowing it to increase\
    \ and decrease entropy of systems, which is described as informational asymmetries\
    \ between chaotic and ordered information, expressing it through higher-dimensional\
    \ functions. Additionally, Honkai makes up all the fundamental information of\
    \ Stigmas) *Non-Physical Interaction (Spirits, Incorporeality, Memories, Dreams,\
    \ Empatic, Limited Data, Abstract Thoughts, Concept\u3010Type 2\u3011, Information\u3010\
    Type 2\u3011& Nonexistence\u3010Nature\u3008Type 1\u3009\u3011; Can interact with\
    \ Honkai Energy, as well as with Higokumaru, who is a spirit.For better and detailed\
    \ information about minds/souls and information in HoYoverse, check out the HoYovese\
    \ Cosmology page.Honkai Impact 3rd: Sanka Saga Void beings/Quantum statesHonkai\
    \ Impact 3rd; Story Chapter XI: Deep End of the Sea that are a part of the Sea\
    \ of Quanta which exists as possibilities and imaginary concepts, the scenery\
    \ of dreams, a blank space of nothingnessHonkai Impact 3rd - Rita Birthday and\
    \ informationDurandal Visual Novel: Chapter 21, Part 2 that is stated to be a\
    \ higher-dimensional concept.Screenwriter Q&A They are also a projection of it,\
    \ which are born from the cognition of emotions, desires, memories and thoughts,\
