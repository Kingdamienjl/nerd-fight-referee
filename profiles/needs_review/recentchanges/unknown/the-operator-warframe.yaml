    - field: powers_and_abilities
      value: "resistant to the infestations ability to alter flesh on a molecular\
        \ level) * Immortality/Resurrection (Types 1, 2, 4 & 8; Warframes are stated\
        \ to be able to remain active forever. They can survive being pierced through\
        \ by a sword Capable of reviving themselves up to 4 times a missions by surging\
        \ power to their systems. Warframes are surrogate bodies controlled by an\
        \ Operator meaning all Warframes can be reconstructed from blueprints by the\
        \ Helminth in their bases of operation.) * Resistence to Temperature Manipulation\
        \ (5,000\xB0C,Can fight near the surface of the sun without suffering from\
        \ the heat[,its cold resistance should be far superior to the rest of the\
        \ warframes since it is able to withstand its own powers * Abstract Existence\
        \ (Type 2,Narin has an existence linked to Conceptual Incarnation and the\
        \ Void, associated with the identity of Zikhaio Nuri.) * Extrasensory Perception\
        \ (All Warframes have a 30 meter radar that alerts them to the position of\
        \ their enemies.) * Healing (Orokin Lorist's could heal people of severe injuries\
        \ like acid burns and large lacerations in the middle of battle; Warframes\
        \ can do something similar for allies who have been downed and should possess\
        \ healing of a similar potency but would requires more focus.) * Self-Sustenance\
        \ (Types 2 and 3; Warframes do not need to eat or sleep, they are also able\
        \ to survive in space and other areas with limited oxygen for extended periods\
        \ but will eventually require life support to continue.) * Acrobatics * Flight\
        \ (Using Hakchum, Narin deploys crane-like wings to rise and move through\
        \ the air before swooping down on a designated area. This ability grants him\
        \ aerial mobility and allows him to reach groups of enemies while subjecting\
        \ them to his cryogenic effects.) * Temperature Manipulation/Ice Manipulation\
        \ (Neote, Narin sword has an estimated natural temperature of 0.725 K (\u2212\
        272.4 \xB0C), approximately 2 K below the cosmic microwave background temperature\
        \ and extremely close to absolute zero. The temperature of his sword is not\
        \ Narin limit.) * Durability Negation/Time Manipulation (Narin cold can freeze\
        \ time, allowing him to immobilize targets without relying on overcoming their\
        \ conventional physical resistance. His greatest temporal feat is freezing\
        \ the moment of the Operator's decision on Yuvan Peak to contain the Zariman's\
        \ influence. This allows him to affect physically more resilient opponents\
        \ through temporal stasis, provided they lack adequate defenses against this\
        \ effect.) * Limited Reality Warping/Spatial Manipulation (Through the Cryobells,\
        \ Narin can generate phenomena that alter the conditions of reality, granting\
        \ access to different places and times. His Binds modify the conditions of\
        \ the scenarios linked to the bells, while his influence maintains a containment\
        \ mechanism against anomalies related to the Void. This manipulation is limited\
        \ by the functioning of the Cryobells and their associated effects.) * Status\
        \ Effect Inducement/Statistics Reduction (Narin can freeze and slow her enemies,\
        \ increasing their vulnerability to cold and reducing their defenses. Her\
        \ attacks combine freezing and piercing effects, weakening armor and shields,\
        \ and radial explosions against frozen targets, making her subsequent attacks\
        \ more effective.) * Absorption/Purification (Using Naraemagi, she absorbs\
        \ the cold status ailments of nearby enemies to restore her shields. When\
        \ her shields are at maximum, the excess recovery generates Overguard, an\
        \ additional energy barrier that protects her from damage and removes negative\
        \ status ailments upon activation.) * Non-Physical Interaction (Soul, emotion,thoughts,memory,concepts\
        \ and energy; it is stated that the only way to destroy the spectral form\
        \ of the Thrax Centurions is with Void energy, the same is required for the\
        \ energy form of the Vomvalyst,and it is shown that the energy of the Void,\
        \ through conceptual embodiment, can give physical form to thoughts, memories,\
        \ and emotions.)"
