power_scale:
  tier:
    text: likely , higher with Mods and Arcanes, far higher with Tauron Strikes
    source_ids: &id002
    - mediawiki-347812
    confidence: 0.8
  attack_potency:
    text: 'Small Town level+,4.4918 Kilotons likely City level20.1132 to 62.41 Megatons
      (Can damage Stalker who has fought and even defeated many warframes.Warframe:
      The Second Dream(2015) The Operator''s void beam was able to evenly match a
      weakened, but nearly recovered Natah''s laser attack,Warframe: The New War(2021)
      who was previously able to completely destroy Excalibur Umbra''s bodyWarframe:
      The Sacrifice(2018) ), higher with Mods and Arcanes (Similar to their Warframes,
      the Operator can increase the strength of their weapons and abilities with mods
      and arcanes), far higher with Tauron Strikes (Tauron Strikes are the ultimate
      techniques of the Tenno focus schools created by mixing their techniques with
      Sentient teachings, resulting in a massive power increase.Warframe: The Old
      Peace(2025) The Strikes were capable of destroying the makvos cannon in a single
      hit while standard weapons needed to target the cannons weak-pointsWarframe:
      The Old Peace(2025))'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Unknown, possibly Relativistic+ or higher reactions/combat speed (While
      piloting their warframes they can deflect weapons such as Opticor and Glaxion
      at a close distance, the former stated to be able to fire a blast of "light
      energy"), higher with mods
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Unknown
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Unknown
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Unknown
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: 'Peak Human (Could continue their journey through the mountain pass even
      after falling a considerable distance and getting stabbed through the legWarframe:
      The War Within(2016)), Infinite (During transference the operator can''t feel
      fatigue and warframes can operate indefinitelyWarframe: Jade Shadows(2024))'
    source_ids: *id002
    confidence: 0.8
  range:
    text: Varies,Tens of Meters up to Hundreds of Meters (Void beams can vary in range
      depending on the Amps Prism and scaffold) {| class="wikitable mw-collapsible
      mw-collapsed" ! Standard Equipment |- | |}
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Gifted (Capable of easily completing the numerous missions they receive
      regardless of the complexity of the task. Additionally, they are able to solve
      the hall of ascension puzzles, Complex tests made to gauge the agility,power
      and cunning of the challengers) The Tenno are immensely skilled warriors, having
      been made solely to face off against the constantly evolving SentientsWarframe:
      The Sacrifice(2018) by utilizing not only their many abilities but the numerous
      weapons they have mastered. Warframes were described as "miracles" on the battlefield,
      having devastated many sentient strongholdsfrom Browse.wf, a website that compiles
      and displays internal game data from Warframe. and were the singular reason
      the empire survived the war. Individual Warframes were also capable of defeating
      armies of Orokin soldiers,Warframe: Awakening(2020) all of whom would be equipped
      with the same mods that made Tenno weapons so powerful.Warframe:The Teacher(2025)'
    source_ids: *id002
    confidence: 0.8
