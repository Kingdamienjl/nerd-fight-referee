- id: claim-powers-and-abilities-60683987
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics **Enhanced Senses **Large Size (At least\
    \ Type 8; Ghidorah is stated to be extradimensional and to have infinitely long\
    \ heads) **Immortality (Types 1 & 9; King Ghidorah's true self exist in a \"higher-dimension\"\
    ) **Natural Weaponry (Conventional; Teeth) **Space Survival (Can survive in the\
    \ vacuum of space) **Reactive Evolution (According to director Hiroyuki Seshita,\
    \ Ghidorah evolved to the point he discarded his physical body and evolved into\
    \ a form of pure energy. This evolution into an energy being grants Ghidorah the\
    \ ability to pass through dimensions) *Flight *Electricity Manipulation (Able\
    \ to discharge electrical energy through his bite) *Body Control (Able to extend\
    \ his necks to a length of several kilometers) Resistance to: *Gravity Manipulation\
    \ *Extreme Heat (\u22483000\xB0 C; Can withstand 3000\xB0 Celsius heat from Godzilla.\
    \ Heat that was melting the rock around them) All previous abilities significantly\
    \ enhanced plus: *Higher-Dimensional Existence (King Ghidorah himself is a higher-dimensional\
    \ entity capable of interacting with lower dimensional planes through the assistance\
    \ of the Exif) **Intangibility (Due to its higher dimensional physiology, King\
    \ Ghidorah cannot be physically interacted with unless its Exif guide is incapacitated\
    \ or killed) **Incorporeality (Ghidorah's body is made of pure energy with no\
    \ true physical form) **Gravity Manipulation (King Ghidorah can manipulate a 4-dimensional\
    \ framework via using Super Gravity) ***Weather Manipulation (Able to cause powerful\
    \ storms with his gravitational field alone) *Reality Warping (Ghidorah's mere\
    \ presence causes reality to erodeGODZILLA: The Planet Eater (2018)) **Gravity\
    \ Manipulation (His mere presence causes severe gravitational distortion, to the\
    \ point that creatures as heavy as Godzilla Earth can float in mid-air) **Space-Time\
    \ Manipulation (His presence alone distorts and breaks down space and time, including\
    \ causing time loops and causing time to flow out of order) ***Attack Reflection\
    \ (Able to redirect and deflect attacks by bending space around himself) **Non-Physical\
    \ Interaction & Darkness Manipulation (Able to interact with the physical world\
    \ without entering it itself by controlling shadows, and can attack and kill things\
    \ by attacking their shadows) **Black Hole Creation & Portal Creation (Able to\
    \ create portals that allow him to travel from higher to lower spatial dimensions.\
    \ These portals are described as Black Holes) **Light Manipulation *Energy Manipulation\
    \ & Absorption (Absorbed the heat of Scarlet Godzilla and drained it to the point\
    \ that its overall body temperature dropped below 32 F despite it constantly vibrating\
    \ its molecules to increase its body temperature) Resistance to: *Black Holes\
    \ & Spatial Manipulation (Unaffected by using a black hole as a portal) *Void\
    \ Manipulation (Can move normally in a void) *Law Manipulation (Unbound by the\
    \ laws of the physical universe as it comes from a higher dimension) All previous\
    \ abilities on a much higher scale Weakened Avatar"
  source_ids: *id003
  decisive: true
  status: unverified
