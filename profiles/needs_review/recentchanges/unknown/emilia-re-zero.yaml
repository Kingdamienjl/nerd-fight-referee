    - field: weaknesses
      value: 'Can only use Puck from 9 in the morning to 5 in the afternoon. Her awakened
        power is uncontrollable and she will only use it when backed into a corner
        emotionally, or when she has no other choice and no one else is around. Notable
        Attacks/Techniques: *Spirit Arts: Emilia is capable of using this with Puck
        and her other spirits. Emilia and Puck can smoothly alternate between roles
        of offense and defense leading to devastating results. These include changing
        the atmosphere in the sky to rain down multitudes of ice spears, forming ice
        clones that are capable of attacking and using magic, instantly conjuring
        giant freezing blade discs, mist barriers that hide her presence, and ice
        shields. On top of that, Emilia is contracted to several Quasi Spirits; she
        can use them for various applications such as healing. Some of Puck''s contract
        conditions are: **He will be active only from 9 in the morning to 5 in the
        afternoon. **Do not ask about his relationship with Beatrice. **Do not look
        into a mirror or go near a large body of water. **Do not hide the fact that
        you are a half-elf. **He will choose your hairstyle every morning **Groom
        his fur regularly. **Do some exercises when you wake up and before going to
        bed. **Do not be picky about food. **Talk with lesser Spirits every morning
        and evening. *Ice Brand Arts: By using this technique Emilia can instantly
        create weapons made out of ice which she can use and freely manipulate in
        close-quarters combat. The weapons are very sturdy and can even withstand
        heat-based attacks without melting. **Ice Brand Arts: Icicle Line: Emilia
        attacks her opponent by surrounding them with a barrier of ice particles which
        she then transforms into weapons like axes, swords, hammers, etc. **Ice Brand
        Arts: Ice Soldiers: Emilia can create soldiers who are completely made out
        of ice. These soldiers are exactly the same as actual humans and are clad
        in armor made of ice while wielding weapons made of ice. They follow every
        order given to them by Emilia. The soldiers'' strength depends from the mana
        density; the more mana Emilia uses the stronger the soldiers will be. The
        technique was developed by her and Subaru some time after the events of the
        4th arc hence, the soldiers take Subaru''s appearance. Currently, Emilia is
        able to create up to seven proper Ice Soldiers and no less than ten soldiers
        with only their torsos, heads and arms. When destroyed, these soldiers can
        regenerate back to their full health as long as Emilia has the strength to
        do so. *Ice Flower: Emilia creates flowers made of ice on wounds of living
        beings within a certain area that suck the host''s life force and bloom by
        sucking the host''s blood. She has not used this ability ever since she forged
        her contact with Puck. *Absolute Zero: Emilia combines her talent for Magic
        and Spiritual Arts to take greater advantage of her massive mana pool. This
        allows Emilia to use ten or a hundred times her usual magical power and creates
        a white vacuum that freezes everything including time, and not even the breath
        of the Divine Dragon is an exception. ==Notable Matchups== Victories: *Bianca
        (Punishing: Gray Raven) Bianca''s profile (Bianca: Veritas and "Arc 4-8" Emilia
        were used with Awakened Power was restricted; Both were in-character; Starting
        distance was 10 meters; Speed was equalized) *Citlali (Genshin Impact) Citlali''s
        profile ("Arc 4-8" Emilia were used with Awakened Power was restricted; Both
