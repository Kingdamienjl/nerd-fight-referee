    confidence: 0.8
  attack_potency:
    text: 'Island level12.5956 gigatons (Can fight against children of the future
      like Lucina who were able to defeat soldiers from Valla, said soldiers can fight
      against Flora and people stronger than her. Flora''s power is such that she
      was able to freeze an entire sea), Varies, higher, up to Large Island level,
      possibly Multi-Solar System level with the Three Regalia or Hauteclere (Gotoh
      declares that without the Falchion, the Three Regalia are, if used by a wielder
      at the utmost limit of their power, the last hope against Medeus.'' - Book 1
      Chapter #17: "A Knight-Filled Sky." Nintendo, 1994 Hauteclere is said to rival
      the Three Regalia'' - Chapter #7: "Lefcandith Gauntlet." Nintendo, 2008340.3992
      gigatons of TNT, possibly 16.88 exa-foe)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Superhuman travel speed with Massively Hypersonic+ combat and reaction speed
      (Capable of dodging BoltingMach 223.6317), higher attack speed with Brave Weapons,
      higher reaction speed with Dual Guard (Get faster when working together with
      an ally and is able to perform Dual Guard where a character can momentarily
      move at such speed that enemy attacks seem to stop in order to block a strike
      aimed at an ally)
    source_ids: *id002
    confidence: 0.8
