    to regenerate itself from Death-X-mon''s Process 0 and Process F in which erases
    the Digicore. Was also was able to regenerate itself even after its entire Digicore
    was given away) * Summoning (Can summon the Ultimate-Battle-Blade-Ouryuken and
    legendary beings from other worlds) * Sealing * Time Manipulation (Can stop and
    rewind time) * Acausality (Types 1 & 4; Unaffected by constant resets on the timeline,
    exist in the Kernel, within the Yggdrasil System completely transcending the entirety
    of the New Digital WorldDigital Monster Digital Monster Art Book ver.PENDULUM,
    an its system of causalityBx-34, which consists of three layers or Terminals,
    Ulud Terminal which governs the Past, Versandi Terminal which governs the present
    and Skuld Terminal which governs the Future meaning that Kernel inhabitants exist
    completely above the past, present and future) * Causality Manipulation (Wields
    the Alpha InForce, which is able to reset time while maintaining the effects it
    causes) * Statistics Amplification * Statistics Reduction (Can decrease the attack,
    defense and speed of its opponents) * Status Effect Inducement (Can turn resistance
    into weaknesses and weaknesses into resistances) * Forcefield Creation * Memory
    Manipulation * Size Manipulation * Power Bestowal (Can share its abilities with
    others) * Paralysis Inducement * Dimensional BFR * Portal Creation (Can create
    Wormholes) * Teleportation * Creation (Was able to create a Kimeramon to face
    the Digimon World: DS Protagonist) * Resurrection (Brought Ouryumon back from
    non-existence) * Power Nullification * Power Absorption * Regeneration Negation
    (Low Godly; Can kill Ulforce V-Dramon X as DORUguremon) * Spatial Manipulation
    (Can cut and break through dimensions) * Existence Erasure (Has the power to "Delete",
    erasing a being from existence and sending to the Dark Area, the graveyard of
    deleted data. Especially used by Virus Busters to remove evil from within a being)
    Resistance to * Reality Warping (Was unaffected by the Digital World rewrite caused
    by Death-X-mon) * Absorption (Resisted Death-X-mon absorption that is able to
    absorb the whole Digital World and nearly every Digimon in it)'
  source_ids: *id003
  decisive: true
