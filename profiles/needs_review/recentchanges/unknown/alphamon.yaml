  intelligence:
    text: As one the most powerful of the Royal Knights, Alphamon far outstrips nearly
      every other member in skill and technique (Since Alphamon was Grademon its sword
      techniques surpassed even the Holy Knight Lord Knightmon), acting as a deterrent
      force that should appear when an evil, that the Royal Knights cannot defeat
      on their own, arise. also acts as a control for the Royal Knights themselves,
      disciplining them should they stray from the principles of their founding and
      even dispatching of Yggdrasil at one point when the latter began going against
      his purpose. However, he is loyal to it otherwise, and will follow its orders
      faithfully unless they pose a threat to the Digital World. When Alphamon took
      over Kyoko's mind, it acted as a detective, gaining a lot of deductive skills
      that it used to solve cybercrime. Demonstrated a great knowledge about the functioning
      of spacetime, parallel universes, quantum mechanics and the supernatural
    source_ids:
    - vsbattles-alphamon-unknown
    confidence: 0.6
