    \ Speed Simulator.) * Air Manipulation, Speed Augmentation, Status Effect Inducement,\
    \ Forcefield Creation & Gravity Manipulation (Using an Ark of the Cosmos, Wave\
    \ can manipulate gravity for various purposes; to turn sharp corners, repel obstacles\
