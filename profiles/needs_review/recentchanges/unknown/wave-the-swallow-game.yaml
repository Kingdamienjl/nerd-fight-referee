  axis: hax
  text: "*Superhuman Physical Characteristics ** Space Survival (Capable of surviving\
    \ in the vacuum of space) ** Acrobatics *** Spin Attack (Standard; Can perform\
    \ the Spin Attack, Drop Dash, and Homing AttackSonic Speed Simulator) **Non-Standard\
    \ Breathing (Type 1) * Non-Physical Interaction (Ghost & Spirits; Can harm the\
    \ Boos, Boom Boos, and Pumpkin Ghosts in Pumpkin Hill) *Absorption (Of Rings)\
    \ *Possibly Enhanced Senses (Can detect the camouflaged rails in Green Cave) *Electricity\
    \ Manipulation and Paralysis Inducement (Standard level 3 attacks in Sonic Riders\
    \ seemingly can paralyze opponents, which Wave uses her spanner to do via electrocuting\
    \ targets) *Explosion Manipulation (Can create an endless supply of dynamite to\
    \ stick to opposing Extreme Gear to blow them up) *Boost (Standard) *Weapon Mastery\
    \ (Can skillfully wield a wrench/spanner as a club) *Vehicular Mastery (One of\
    \ the foremost skilled Extreme Gear riders across the world. All characters in\
    \ Sonic Speed Sim are able to pilot aircrafts, vehicles and Extreme Gears expertlySonic\
    \ Speed Simulator) *Toon Force ** Hammerspace (Can hold countless Rings, Pets,\
    \ Trails and vehicles in her hammerspace. Can pull her weapons out of thin air)\
    \ **Elasticity (Can reform after getting flattened) **Limited Sound Manipulation\
    \ (Can cartoonishly grow her head and knock other competitors away by shouting)\
