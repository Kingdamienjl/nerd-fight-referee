    \ damage, a varying amount will scatter from the one who collected them with higher\
    \ durability causing less to drop. Rings have repeatedly shown the capacity to\
    \ protect Base characters from villains far stronger than them, ranging from the\
    \ likes of VoidSonic Shuffle to amped Titans such as SupremeSonic Frontiers: Another\
    \ Story (vs The End)) ** Healing and Stamina Recovery (Ring energy revitalizes\
    \ the wielder and restores energy, as noted with Silver wanting to use some to\
    \ replenish his energy. Rings are referred to by The End as being vitality) **\
    \ Statistics Amplification (Ring energy in the Sonic Riders series can amplify\
    \ the user\u2019s speed by nearly 2x and increases their boost duration by nearly\
    \ 2 seconds when going from level 1 to 3) * Power Bestowal (When hit, they grant\
    \ the user with a self-contained power up) * Technology Manipulation & Power Nullification\
    \ (Self-Afflicted. When breaking open a Parts Lock Item Box, the playable character's\
    \ tech is temporarily shut down except for the tech's mobility) * Forcefield Creation\
    \ & Damage Reduction (With Shield, which can create a forcefield around the user\
    \ and protect them from a single hit) * Weapo"
