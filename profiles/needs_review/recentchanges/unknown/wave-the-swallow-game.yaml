    \ Can break out of being frozen solid by Eggman's Emerald Hill Mech and is capable\
    \ of surviving outside the Space Colony ARKDespite gameplay containing a certain\
    \ character, this is true of all playable characters in Sonic Speed Simulator.)\
    \ * Air Manipulation, Speed Augmentation, Status Effect Inducement, Forcefield\
    \ Creation & Gravity Manipulation (Using an Ark of the Cosmos, Wave can manipulate\
    \ gravity for various purposes; to turn sharp corners, repel obstacles in her\
