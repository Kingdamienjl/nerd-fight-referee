- id: claim-weaknesses-019e079a
  section: weaknesses
  axis: weakness
  text: 'Tends to be overconfident and very prideful in her skills, which can potentially
    be used against her Notable Attacks/Techniques: *Tornado: Wave performs a high-speed
    spin on her Extreme Gear, using her accumulated Air to release a grey mini-tornado
    in her wake. The tornadoes possess strong enough wind currents to knock the likes
    of Knuckles the Echidna off balance. *Kick Dash: Wave releases a burst of air
    from the rear of her Extreme Gear, resulting in her being propelled forward at
    blistering speeds. *Gravity Control: Using the gravity-altering properties of
    an Ark of the Cosmos, Wave causes the gravity in her vicinity to be negated, causing
    nearby objects and Wave herself to enter zero gravity. After directly selecting
    a direction to head towards, Wave propels herself forward at high speeds with
    a quick shift in gravity, while other objects caught in the gravity shift are
    crushed/destroyed. *Gravity Dive: Activating her Ark of the Cosmos, Wave generates
    a temporary black hole, thus creating a powerful gravitational disturbance that
    makes all objects within a large radius of her to enter zero-gravity. This results
    in surrounding objects and enemies being torn from their positions and toward
    the black hole. At the same time, the zero gravity field causes Wave to begin
    floating through midair. She is then yanked through mid-air towards the black
    hole at blistering speeds. While flying through the air, Wave has free movement
    abilities, can plow through most obstacles and can freely control her movements
    in all directions. Pets: Also referred to as Friends, these creatures will hover
    closely behind their wielder that typically focus on granting benefits on several
    stats; * Experience (The amount of experience gained when defeating an opponent)
    * Rings (the amount of Rings gained per a single Ring) * Damage (the amount of
    damage dealt to bosses and powerful enemies). * Stamina (The amount of energy
    consumed when Boosting) * Air (The amount of time possible to spend underwater
    without air) * Luck (Non-Combat Applicable). Up to 3-5 Pets can be equipped at
    a single time, stacking the benefits from each. For a full reference of different
    Pets and their impact, see here. Trails: Trails are equippable items that range
    from Level 1 to Level 25 at maximum. They typically focus on increasing three
    statistics, but different Trails offer benefits that include other statistics.
    Like Pets, these include altering; * Experience * Rings * Damage * Stamina * Air
    Unlike Pets, only one trail can be equipped at any given time. For a full reference
    of Trails and their impact, see here. Credit and thanks to the Sonic Speed Simulator
    wiki. ==Notable Matchups== Victories: Losses: Inconclusive: ==References== ==Notes/Explanations==
