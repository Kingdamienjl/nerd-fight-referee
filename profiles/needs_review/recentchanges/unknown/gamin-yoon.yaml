- id: claim-powers-and-abilities-421e05af
  section: abilities
  axis: hax
  text: "Season 1 Season 2 \u25BE Season 3 \u25BE Base Jun Fan Resistances Superhuman\
    \ Physical Characteristics Combat Genius Martial Arts & Weapon Mastery (Gamin\u2019\
    s base in martial arts is Jeet Kune Do [ 1 ] , Gamin Youn was taught Jeet Kune\
    \ Do when he was a child and was set restrictions or more commonly known as Forbidden\
    \ Techniques [ 2 ] which constitute of 11 techniques, this was because Gamin was\
    \ getting too strong to the point of overwhelming his uncle and had he not set\
    \ himself restrictions he could have severely injured someone, Gamin also has\
    \ shown self defense in response to other martial arts such as Wingchun [ 3 ]\
    \ and Fu using unfair play techniques [ 4 ] , Gamin has also shown with Nunchucks\
    \ ) [ 5 ] Acrobatics Self-Momentum & Hypermobility - (Gamin generally utilises\
    \ acrobatic movements against his enemy\u2019s whether it be through kicks or\
    \ punches, he does this by creating momentum and pushing up against the surface\
    \ to jump vertically and form unconventional movements [ 6 ] , Gamin has also\
    \ been seen doing this without a run up when performing a spinning front kick\
    \ ) [ 7 ] Pressure Points (Gamin is more than capable of dishing out attacks that\
    \ precisely target the pressure points in order to finish a fight as soon as possible\
    \ [ 8 ] , Gamin can even deliver blows to the Adam\u2019s Apple) Analytical Prediction\
    \ ( Gamin can predict the moves of a delinquent while he\u2019s speaking to Sehyun\
    \ Kim about exams [ 9 ] , even while being shaken from Hanwool Phi\u2019s schemes\
    \ which caused Gamin's mother to be hurt [ 10 ] and the fact that he was unable\
    \ to attack Hanwool due to three opponents stopping him [ 11 ] , Gamin was still\
    \ able to predict the two of the chul\u2019s attacks before getting rid of his\
    \ shaken feeling and while also being outnumbered [ 12 ] , after getting rid of\
    \ his shaken feeling Gamin is able to predict the attacks by parrying one enemy,\
    \ dodging a kick of the second enemy and landing a palm strike, he blocks sunchul\u2019\
    s punch and uses an uppercut to capitalise on it [ 13 ] , while still occupied\
    \ with sunchul he dodges one of the other chul\u2019s attack and uses forbidden\
    \ technique N0.2, unfair play to analytically predict the three simultaneously\
    \ while also damaging them all in the process [ 14 ] , Gamin could analytically\
    \ predict all of Siwan Cheons attacks and was told he had no real openings [ 15\
    \ ] , Gamin uses a trap by exposing his leg in front of Hanwool so he would intentionally\
    \ exploit Gamin's weakness as his kneecap was broken, when doing this Gamin retracats\
    \ his leg at the last moment and successfully lands a hit on Hanwool ) [ 16 ]\
    \ Supernatural Willpower ( Through will, Gamin was still able to push through\
    \ the pain his broken knee cap was giving him in the midst of his battle with\
    \ Hanwool Phi ) [ 17 ] Accelerated Development & Technique Mimicry ( Training\
    \ and Battle : Physical attributes and Skills ; Gamin has been told on multiple\
    \ occasions that he\u2019s talented from formidable characters in the series ,\
    \ Siwan had even noted that the feeling of his power made no sense and compared\
    \ it to his Wingchun master's , Gamin\u2019s uncle had also made it clear that\
    \ at first he would toy with Gamin during their sparring until the time came where\
    \ Gamin was overcome with the feeling of wanting to excel, Yeongha even specifies\
    \ he doesn\u2019t know when their playing around became serious which indicates\
    \ Gamin\u2019s great development had taken place in a short time frame which would\
    \ also explain why he\u2019s so exceptional granted his young age, he ignores\
    \ logical principles of training such as developing your physique and having adequate\
    \ experience, he lacks in both but brings great results , Due to Gamin's exponential\
    \ rates of growth he's also able to mimic a series of techniques from Yeongha\
    \ from a really young age) Enhanced Awareness & Information Analysis (Gamin is\
    \ able to enter a tranquil state which allows Gamin to formulate countless combat\
    \ simulations that pay attention even to the smallest details that are able to\
    \ go unnoticed by inexperienced fighters as they\u2019re portrayed as not moving\
    \ or doing anything meaningful in the midst of combat, despite Gamin not actually\
    \ knowing Siwan well he was still able to gauge how skilful and dissect his habits\
    \ without any real physical means, relying solely on mental calculations ) [ 18\
    \ ] Social Influencing Reputation - (Due to Gamin\u2019s reputation of beating\
    \ characters within the White Lead Gang people have grown accustomed to to calling\
    \ him a monster, his performance in beating White Lead members was so great that\
    \ they had to personally send a White Lead scout to scout Gamin) Instilling Fear\
    \ - (Via Gamin's eerie gaze he was able to instill fear inside a police officer\
    \ which caused him to momentarily flinch ) [ 19 ] Sleight of Hand Feints - (Gamin\
    \ likes to use feints or trapping to deceive his opponent into using their fighting\
    \ style against themselves like with Hanwool Phi who is always seen instantaneously\
    \ reacting to attacks, because of this Gamin uses a jab to blind him and follows\
    \ with a kick ) [ 20 ] Al"
