- id: claim-powers-and-abilities-950bc4b0
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Immortality (Types 1, 3, 4, 6, and 8),
    Abstract Existence (Type 2), Regeneration (Mid-Godly), Extrasensory Perception
    (The Gods have extra supernatural senses such as the 6th, 7th, 8th, and 9th sense)
    and Enhanced Senses (7th, 8th and 9th Sense User), Reality Warping, Matter Manipulation,
    Soul Manipulation, and Temperature Manipulation (A god has completely mastered
    the 7th sense and 7th sense users can destroy matter down to a level below Quarks.
    Causing damage to a Gold Cloth requires a power that can break apart matter that
    exist below Quarks. The gods have casually destroyed Gold Cloths and their Gold
    Cloth Armor equivalents, such as Scales and Surplices. 7th sense users can generate
    a shield made from pure Cosmo around them at the start of battle, and their Armors
    are also infused with the power of Cosmo. The gods can also control all Atoms
    in the world with their very will. The gods are vastly superior to Gold Saints
    such as Capricorn Shura who can cut twenty billion souls at once and Cancer Deathmask
    whom can destroy twenty billion souls all at once. The power of Ohm could also
    affect twenty billion souls. These divine beings generate more heat than any Gold
    Saint whom can reach temperatures of over a million degrees when focusing their
    attacks), Energy Manipulation, Light Manipulation, Healing, Telepathy, Telekinesis,
    Teleportation, True Flight, Spatial Manipulation, Time Manipulation, Probability
    Manipulation), Durability Negation (Through Soul Destruction and Quantum Destruction),
    Causality Manipulation, Acausality (Capable of ignoring the effects of causality
    inflicted by the Space-Time Continuum itself), Summoning (can summon her cloth),
    Regeneration negation up to Mid-Godly, and Immortality negation (of Types: 3;
    4; 6; 8, and 9: The Divine weapons were created with the intention to permanently
    kill gods. For example. Gaia created a weapon for the king of the Titans Cronos
    to slay Uranus. Gaia then proceeded to create weapons for all twelve of the Titans
    whom all gone to war with the Olympians. They consisted of gods such as Zeus,
    Hades, and Poseidon. Athena was capable of destroying the true body and soul of
    Typhon. Hades had various methods to permanently kill Athena as Athena''s death
    was needed to conquer the world of the living. The Sword of Chrysus can kill gods
    such as Athena, and even Saturn remarked that it could kill an ordinary god. Typhon
    is a biological weapon created by the union of Gaia and Uranus to end the reign
    of the Olympians. Aura, Perception Manipulation, Sense Manipulation, Mind Manipulation,
    Paralysis Inducement, Life Manipulation, Statistics Reduction and Heat Manipulation
    (By being in the presence of a God. The six senses are rendered unusable and denied.
    The Gods radiate a divine aura that causes fear in the surrounding beings and
    forces them to obey their commands. The power that radiates from the Gods also
    causes the affected targets to be paralyzed. Their life force then starts to drain,
    and they then have their strength, speed, and durability reduced by being near
    a Gods cosmo. Powering up their cosmo causes the heat in the area around them
    to increase drastically, along with their attacks being imbued with intense heat),
    Attack Reflection (All attacks that are directed at her become reflected passively,
    Soul Manipulation (being in the direct light from her Sheild can separate the
    soul from the body) Resistance to Mind Manipulation, Soul Manipulation, Matter
    Manipulation, Illusions, Dream Manipulation, Life Manipulation, Space-Time Manipulation,
    Existence Erasure, Heat Manipulation (All Cosmo users by powering up their cosmo
    generates heat around them thus also being in the presence of other Cosmo users,
    and taking attacks from them) and Electricity Manipulation (Entry level Cosmo
    users can withstand 10,000 volts. While more experienced Cosmo users can withstand
    even more than that), Death Manipulation and Law Manipulation (The Underworld
    kills anyone that is "Alive" when entering into it, but 8th sense users can enter
    it alive. The 8th sense allows the user to overcome the laws that Hades had created),
    possibly Regeneration negation up to Mid-Godly, and Immortality negation (Typhon
    had his true body, and soul permanently destroyed by Athena, but he later returned
    as his "Divine Will." Gods such as Poseidon, Zeus, and Hades continue to come
    back despite Athena''s ability to permanently destroy the body and soul of Typhon.
    The Titan King Cronus was able to permanently kill Uranus with a weapon that Gaia
    created. Later Gaia created more weapons for the Titans that were later used in
    a war against the Olympians, which were ineffective against them in a war that
    lasted "10 god years." Athena used The Sword of Chrysus to kill her own self.
    She was seen later flying out of the Underworld and in later works such as Next
    Dimension and Assassins. Typhon is a biological weapon created by the union of
    Gaia and Uranus to end the reign of the'
