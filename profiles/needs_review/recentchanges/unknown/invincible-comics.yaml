  speed:
    text: Varies from Massively Hypersonic+ (Can, on average, fly at 800,000 KPH or
      Mach 671 but also casually go at Mach 1513.386 by covering 8000 miles in 25
      seconds, as shown here) to Relativistic+ (Comparable to Allen who can travel
      at near lightspeed) | Massively FTL+ (Comparable to Omni-Man who can fly from
      the Earth to Thraxa in under a week and to Thaedus, who could react to approaching
      the planet Viltrum while flying at speeds at which Nolan had to pull Mark in
      order for him to keep up, with Mark being able to outspeed the fastest spaceship
      Coalition of Planets has. Quickly flew from Thraxa to Talescria130,446,428c)
      | Massively FTL+ (Could fight and keep up with Thragg>>1,304,464,280 c)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class G (Comparable to Allen the Alien55,556,082.936 Tonnes) | At least
      Class Z (Superior to Tech Jacket. Far stronger than the minimum viltrumite energy
      output68,908,161,289,999,998,976 Tonnes) | At least Class Z, likely far higher
      (Much stronger than before. The most powerful Viltrumite after Thragg)
    source_ids: *id002
    confidence: 0.8
