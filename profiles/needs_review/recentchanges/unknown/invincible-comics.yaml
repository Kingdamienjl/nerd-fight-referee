    text: Large Country level | Large Planet level | At least Large Planet level,
      likely far higher
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Large Country level (Traded blows with Allen the Alien) | Large Planet level
      (Endured hits from Conquest, who could harm his father. Tanked Universa's civilization
      ending burst) | At least Large Planet level, likely far higher (Fought a extended
      and brutal battle against Thragg inside the Sun)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (He can keep fighting even when he has broken bones and hold
