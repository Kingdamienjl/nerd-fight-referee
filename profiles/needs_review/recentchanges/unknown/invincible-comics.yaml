  attack_potency:
    text: Large Country level (Slammed Allen into the moon102.39 Teratons of TNT)
      | Large Planet level (Destroyed Viltrum alongside his father and Thaedus with
      Thragg attributing most of it to them.4.89 Yottatons of TNT Battled against
      Conquest and managed to kill him. Implied that if a meteor came to take out
      Earth he'd be able to handle it. Should be stronger than his alternate universe
      self who cracked the outer shell of the planet killer Omegajacket.) | At least
