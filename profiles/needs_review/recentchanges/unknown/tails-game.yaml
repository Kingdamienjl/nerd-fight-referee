- id: claim-intelligence-9bb80631
  section: power_scale
  axis: battle_iq
  text: Supergenius normally, Genius Combatant (Tails is a highly gifted mechanic
    and engineer, [https://imgchest.com/p/9p4noglmz7n often stated to have intellect
    rivalling that of Dr. Eggman]. He's very hands-on because of it, doing things
    such as [https://imgur.com/a/Hkmco43 building a fox over the course of minutes]
    and [https://imgur.com/B7MCmjO dismantling one of Eggman's mechs with a wrench].
    His technological prowess also extends to hacking, such as [https://imgur.com/6cDWEbh
    tracking the limo of the United Nations president], [https://imgur.com/kVIskqj
    hacking into the programming of] Emerl to discover his true purpose, and creating
    code on the fly to override Eggman's systems of Giga Omega. Espio referred to
    him [https://imgur.com/sjMc3z3 as being observant] and said to have [https://youtu.be/Tl17D2Zlj6o?t=6740
    "brains like Eggman"] from Sonic, having outsmarted the scientist on numerous
    occasions in the past. He can create an Extreme Gear that impresses the likes
    of Wave, who had far more experience in that field by comparison, [https://imgur.com/ee9tHxX
    and outfitted Sonic's Extreme Gear to create miniature tornados]. [https://imgur.com/UxFd99F
    Created a replica of a Chaos Emerald that included the same wavelength and properties],
    albeit weaker, and on a separate occasion used the power of the Chaos Emeralds
    and Sol Emeralds [https://imgur.com/QBxlwZY to create a ship capable of dimensional
    travel]. Tails has [https://imgur.com/G70LZlS claimed he could build a T.V. out
    of paperclips and reprogram a super computer using only dishwashing detergent
    and a toothpick]. [https://imgur.com/lDJVdht Reprogrammed Eggman's machinery to
    restore the planet's stolen energy], an accomplishment Tails noted as something
    even Eggman couldn't do. Capable of [https://www.youtube.com/watch?v=Tl17D2Zlj6o&start=5976
    analyzing Cyber Space and glimpsing into its data], a technology vastly superior
    to any other on the planet at that point. [https://imgchest.com/p/na7kpxdrw48
    He successfully figured out the mechanics of Eggman's Tower]. Constantly fights
    alongside the likes of Sonic rather competently. Constantly fought and trained
    Emerl as he gained more Chaos Emeralds and awoken more of his ancient combat data,
    [https://www.youtube.com/watch?v=wqfxViAIizo&t=240s even being able to train with
    him after he acquired all 7 Chaos Emeralds])
