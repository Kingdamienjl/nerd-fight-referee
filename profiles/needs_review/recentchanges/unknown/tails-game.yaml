  attack_potency:
    text: Brown Dwarf level (Comparable to Classic Sonic and Classic Knuckles. Can
      wreck Mecha Sonic Mk. II) | Solar System level (Comparable to Adventure Sonic.
      [https://youtu.be/tB3HCPrTR_8?t=1094 Fought evenly with Adventure Knuckles],
      later [https://youtu.be/ZC6Fd2FDAQU?t=58 defeating] Chaos 4. Fought Team Rose
      and Team Dark to a presumable standstill) to Galaxy level ([https://youtu.be/sYT_hCx2fSE?t=803
      Fought Shadow to a standstill alongside] Emerl to prevent the Gizoid's destruction,
      who himself fought Emerl after it acquired the seven Chaos Emeralds alongside
      Sonic. Can fight and damage Gemerl) higher with Power Cores ([https://imgchest.com/p/pg73ap5njyr
      Power Cores double the physical characteristics of their user]. Often noted
      to be training with Sonic, having [https://youtu.be/B1deDBsupHg?t=646 fought
      him directly when he was mind-controlled] before [https://imgur.com/olHFaCc
      defeating both him and] Ifrit at once. [https://imgur.com/MPXV2rl Fought and
      defeated] Metal Sonic.) to Universe level+ (Comparable to his Camelot counterpart,
      who can harm Sonic and the Knights of the Round Table in combat.) to Low Multiverse
      level ([https://imgchest.com/p/6eyrkrgrl7p Sheared through Super Badniks in
      a comparable fashion to Sonic]. [https://cdn.imgchest.com/files/bb12748a9790.jpg
      Physically harmed] Zomom alongside Amy, albeit [https://imgchest.com/p/9p4noge2l7n
      they were unable to overcome him directly]. [https://imgchest.com/p/6eyr3388xyp
      Comparable to the likes of Espio, Tangle, and several others who fought against
      and notably damaged] Giga Omega. [https://imgur.com/a/DYiB1qR Aided Sonic in
      the fight against the Badnik train]), higher with Boost | Varies (The power
      of the Chaos Emeralds are directly noted by Starline to [https://imgur.com/a/2NsUxzT
      vary in power depending on the circumstances]), Low Multiverse level (Empowered
      by the Chaos Emeralds. Can damage and destroy the Phantom King. Draws on the
      power of the Chaos Emeralds, which are comparable to the Sol Emeralds; the Sol
      Emeralds could forcefully make Sonic's universe and the Sol Dimension fuse and
      destroy them. Superior to the power of the seven World Rings. Should be superior
      to the Paradox Prism), up to Complex Multiverse level at his peak ([https://youtu.be/0vQP0PSjjEI
      Teamed up with Super Sonic and Super Knuckles to defeat] Metal Overlord. Should
      be capable of achieving the same level of power [https://imgchest.com/p/xny8npz9oyb
      used by Classic Super Sonic and Modern Super Sonic] to defeat the Time Eater.
      Can potentially use the full power of the Chaos Emeralds, as he's capable of
      entering a Hyper Form, which empowered Super Sonic and Super Shadow to [https://cdn.imgchest.com/files/9b0b53cdbe02.mp4
      a level where] they [https://cdn.imgchest.com/files/f387b5f13ec4.mp4 could harm]
      Solaris with [https://cdn.imgchest.com/files/fdf8a682981c.mp4 similar power
      to Super Silver who used the deity's own attacks against it]. [https://imgchest.com/p/o24a9xkxeyl
      Super Sonic and Burning Blaze harmed and ultimately destroyed] the Egg Wizard
      while it was wielding the Power of the Stars. At his strongest, Super Sonic
      destroyed three of the Titans and harmed The End) | Complex Multiverse level
      (Empowered by the Super Emeralds, the Chaos Emeralds enhanced by the Master
      Emerald's power, making him comparable in strength to Hyper Sonic)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: FTL (While not quite as fast, [https://imgur.com/LSaFGnM he can catch up
      to and keep pace with] Classic Sonic), higher with the Spin Attack (Tails is
      able to utilize the Spin Attack, a technique that allowed him [or rather Nine,
      a Shatterverse counterpart of Tails with an altered history] [https://imgur.com/zMhZa2V?r
      to blitz] [https://imgur.com/CLgsXJP?r a group of Eggforcers] that were [https://imgchest.com/p/qb4z23nlg4j
      initially blitzing them]), higher combat and reaction speed with Hyper Mode
      (Hyper Mode is a combat speed speed augmentation bestowed by the power of a
      Chaos Emerald, which can grant [https://imgchest.com/p/pg73ap5njyr physical
      amplifications] [https://imgur.com/a/fake-chaos-emeralds-are-superior-boost-to-power-cores-TpFHy7m
      superior] to Power Cores) | Massively FTL (Can [https://youtu.be/UGt-VeegSPc?t=65
      beat Sonic in a casual race] consistently keeps up with him on their journeys)
      to Massively FTL+ (Can keep pace with members of Team Dark and Team Rose in
      battle. [https://imgchest.com/p/ne7b9gwggy5 Saved Sonic from a Heavy-Egg Hammer's
      swing that he would've been unable to evade]. [https://cdn.imgchest.com/files/b639baf8bf89.jpg
      Outpaced and fought Zomom] alongside Amy. Dodged [https://imgchest.com/p/wl7lpzxroyx
      a lunge from Zavok] and later [https://imgchest.com/p/vj4jpodq548 closed the
      distance between them to land an attack] in quick succession. Although [https://imgur.com/a/wrFaHDV
      inferior], he's overall relative to Sonic), higher with the Spin Attack and
      Boost | Varies (Powered by the seven Chaos Emeralds, which possess immense chaotic
      energies with [https://imgur.com/a/2NsUxzT fluctuating power levels], with Tails
      able to harness varying levels of positive energy), Massively FTL+ (Empowered
      by the Chaos Emeralds, which empowered Super Sonic to [https://youtu.be/nda4a0GA-KU?si=CpaYXi5XRQTUBJ1i&t=2938
      fly to] the Exception. Much faster than anything Base Tails should be capable
      of) to Infinite (Superior to the Double Boost between Sonic and the Rookie,
      which allowed them to cross through the entirety of Null Space through sheer
      speed. Should be superior to Shatter Sonic), up to Immeasurable at his peak
      (Should be able to use the full power of the Chaos Emeralds, which enabled Super
      Sonic to move to different areas of time to combat Solaris with movement alone
      and [https://imgchest.com/p/md7ok9a624p dodge its attacks] [https://imgchest.com/p/qb4zb26b34j
      that appear and strike throughout all of time simultaneously]. Battled Metal
      Overlord alongside Super Sonic), higher with the Spin Attack | Immeasurable
      (Far faster than Super Tails. Comparable to Hyper Sonic), higher with the Spin
      Attack
    source_ids: *id002
    confidence: 0.8
