- id: claim-standard-equipment-11bc4b61
  section: equipment
  axis: equipment
  text: "X-Buster, Maverick copied weapons, Dr. Light's Armors, Mother Elf | None\
    \ Ultimate Armor: Sometime after the events of the Mega Man X era, X wields this\
    \ new armor as his new \"ultimate armor\", complete with a \"Nova Strike\". Not\
    \ much else is known is about this armor. Mother Elf: Also known as the Dark Elf.\
    \ A Cyber-Elf created from Zero's DNA, it was created to be the cure for the Maverick\
    \ Virus at the end of the Maverick Wars. Due to carrying Zero's antigens, it is\
    \ able to cure the Maverick Virus by completely rewriting the DNA and souls of\
    \ every Reploid in range. However, as shown by its actions of the Mother Elf after\
    \ Weil corrupted her, the Mother Elf also has various abilities for combat purposes,\
    \ being able to emit powerful forcefields that require the combined firepower\
    \ of the remaining Guardians along with Zero's own power to destroy. In addition,\
    \ she has been shown to grant her wielders powerful regenerative capabilities\
    \ as well as the ability to modify and upgrade their bodies as well as those of\
    \ other robots at will, turning non-combat robots into powerful Reploids capable\
    \ of fighting X and Zero on even ground. As the original and most powerful Cyber\
