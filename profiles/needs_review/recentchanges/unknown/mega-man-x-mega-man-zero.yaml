        \ The Mother Elf granted Elpizo and the Panetheon more powers than they had,\
        \ which includes projectiles of varying kinds such as projectiles that absorb\
        \ life energy., Warping, The Mother Elf granted Elpizo the ability to teleport.,\
        \ Telekinesis, The Mother Elf granted Elpizo the ability to control his weapon\
