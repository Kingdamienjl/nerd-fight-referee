    \ his physical capabilities, absorbing oncoming projectiles, stunning enemies,\
    \ slowing time to a crawl, halving the target's effective combat endurance and\
    \ durability, and turning foes into relatively helpless Mettaurs. { class=\"fandom-table\"\
