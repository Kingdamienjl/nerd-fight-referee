  attack_potency:
    text: At least Low Multiverse levelImmensely upscales from 176+ Universes (Far
      superior to his X Era self, and comparable to Zero in the Elf Wars, where they
      defeated Mother Elf-amped Omega together. His "perfect copy" can compete with
      Zero in combat, though is considered "weaker" than the real X by Zero), higher
      with Double Buster (Should have access to Rock's Double Buster as he was designed
      to surpass him) and the Mother Elf (The Mother Elf is able to amplify even a
      fodder Pantheon enemy to a comparable enemy to Zero, and as its user, X also
      gains this power) | Unknown (Has shown zero physical combat feats, only shown
      in battle against other Cyber-Elves in a contest of powers solely based on their
      powers as Cyber-Elves)
    source_ids: *id002
