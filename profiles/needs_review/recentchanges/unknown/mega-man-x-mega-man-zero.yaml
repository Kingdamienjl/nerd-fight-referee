- id: claim-weaknesses-c830b4df
  section: weaknesses
  axis: weakness
  text: "None notable ==Notable Attacks and Techniques== Final Strike: A conjunction\
    \ attack with his allies (most commonly Zero and Axl) that unleashes a powerful\
    \ barrage of energy blasts on a number of opponents, dealing immense damage if\
    \ not outright killing the targets in question. This attack completely ignores\
    \ all defenses. This was the attack used to finish off Omega in the Elf Wars.\
    \ This profile will only highlight new abilities shown by Copy X- being his exact\
    \ physical copy in terms of power-set, but note that X should have access to all\
    \ of his previous weapons and armor. Variable Weapons System: X at this point\
    \ in time should have retained weapons he has copied since Mega Man X, his \u201D\
    Perfect Copy\u201D retaining variations of Shotgun Ice, Fire Wave, and Electric\
    \ Spark. {| class=\"fandom-table\" |+Offensive/Defensive Techniques !Ability !Description\
    \ !Visual |- |Raging EX Charge |Creates an damaging aura around himself that regenerates\
    \ his health. |N/A |- |Nova Strike |According to Rockman Zero Hisshou Kouryakuhou,\
    \ since X has this version of the Ultimate Armor, he can use the Nova Strike as\
    \ seen in the games, and often uses it as his main mode of travel across the arena\
    \ before firing an elemental shot. |N/A |- |Reflect Laser |Fires an energy shot\
    \ that reflects off of walls, becoming ideal for indoor combat. |N/A |- |Mode\
    \ Change |Similar to Zero's Chips, X can change elemental modes between Thunder,\
    \ Flame, Ice- giving access to different types of energy shots. |N/A |- |Elemental\
    \ Shot |Depending on the Mode, X can fire projectiles from his Buster with varying\
    \ properties. *Thunder Shots are slow moving orbs, similar to Electric Spark,\
    \ that track the target. The charged version conducts electricity through the\
    \ terrain. *Flame Shots are large longitudinal flames similar to Fire Wave that\
    \ travel in an arc. The charged version shoots a shot upwards, spreading down\
    \ like a shower. *Ice Shots shatter into pieces rebounding the opposite direction,\
    \ identical to Shotgun Ice. The charged version launches a sweeping blizzard forward.\
    \ |N/A |- |} As Copy X is the perfect copy of him, X should possess his Armed\
    \ Phenomenon- which boasts wings for flight, multi-directional lasers fired in\
    \ a storm, binding projectiles, and an overall increase in strength. 400px|center\
    \ Cyber-Elf Physiology: Cyber Elves are sentient computer programs made of pure\
    \ energy. They have the ability to rewrite the information of Cyber Space to erase\
    \ chosen enemies from existence, completely recharge Zero's Energy, boost his\
    \ physical capabilities, absorb oncoming projectiles, stun enemies, slow time\
    \ to a crawl, halve the target's effective combat endurance and durability, and\
    \ turn foes into relatively helpless Mettaurs. {| class=\"fandom-table\" |+Offensive/Defensive\
    \ Techniques !Technique !Description !Visual |- |Hacking |Like other Hacker Type\
    \ Cyber-Elves, X is able to hack into the security systems of the advanced Neo\
    \ Arcadia. He was also able to possess a computer and turn it on when Zero first\
    \ awoken to give him the Z-Saber |N/A |- |Cyberspace Travel |X is able to freely\
    \ move between Cyberspace and the material world at will to commune with souls\
    \ and Cyber-Elves such as when he does so with Phantom and Zero, who reside in\
    \ the two separate worlds. |N/A |- |Nullification |X was able to cancel the possessive\
    \ abilities of the Mother Elf in a weakened state within a select area. |N/A |-\
    \ |Detection |X was able to detect internal traps within other people's bodies\
    \ such as when he detected a trap Weil installed into Copy X. |N/A |- |} ==Notable\
