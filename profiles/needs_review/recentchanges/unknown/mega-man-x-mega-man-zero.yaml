      value: "X-Buster, Maverick copied weapons, Dr. Light's Armors, Mother Elf, None\
        \ center, 250px, thumb, His [[Copy X, copy wielding the Ultimate Armor]] Ultimate\
        \ Armor: Sometime after the events of the Mega Man X era, X wields this new\
        \ armor as his new \"ultimate armor\", complete with a \"Nova Strike\". Not\
        \ much else is known is about this armor. center, 250px Mother Elf: Also known\
        \ as the Dark Elf. A Cyber-Elf created from Zero's DNA, it was created to\
        \ be the cure for the Maverick Virus at the end of the Maverick Wars. Due\
        \ to carrying Zero's antigens, it is able to cure the Maverick Virus by completely\
        \ rewriting the DNA and souls of every Reploid in range. However, as shown\
        \ by its actions of the Mother Elf after Weil corrupted her, the Mother Elf\
        \ also has various abilities for combat purposes, being able to emit powerful\
        \ forcefields that require the combined firepower of the remaining Guardians\
        \ along with Zero's own power to destroy. In addition, she has been shown\
        \ to grant her wielders powerful regenerative capabilities as well as the\
        \ ability to modify and upgrade their bodies as well as those of other robots\
        \ at will, turning non-combat robots into powerful Reploids capable of fighting\
        \ X and Zero on even ground. As the original and most powerful Cyber Elf,\
        \ it is also likely that she has access to the abilities of other Cyber Elves,\
        \ including the ability to rewrite the information of Cyber Space to erase\
        \ chosen enemies from existence, completely recharge Omega's Weapon Energy,\
        \ boosting his physical capabilities, absorbing oncoming projectiles, stunning\
        \ enemies, slowing time to a crawl, halving the target's effective combat\
        \ endurance and durability, class=\"fandom-table\", +List of Mother Elf Abilities\
        \ !Cyber-Elf Ability !Description !Visual, Healing, The Mother Elf is capable\
        \ of healing its user after they've been defeated. Even when weakened, the\
        \ rate at which it can reactivate its wielder to a fully functional state\
        \ is relatively quick. This ability was notably used to revive multiple Mavericks\
        \ onto Elpizo's side in Mega Man Zero 2, despite them being destroyed much\
        \ earlier on during the game. Herculious Anchus, who had been destroyed an\
        \ entire year before- was revived this way shortly after Elpizo gained the\
        \ Dark Elf's powers., Mind Control, The primary threat of the Mother Elf is\
        \ its ability to control machines of all kinds by rewriting their code on\
        \ a fundamental level. Elpizo notably used half of the Mother Elf to force\
        \ Harpuia into transforming into his Armed Phenomenon state, turning him onto\
        \ Zero, as well as many revived Mavericks in Mega Man Zero 2 that were not\
        \ on his side initially., Virus Destruction, The original purpose of the Mother\
        \ Elf was to cure the Maverick Virus worldwide in an instant., Negative Energy\
        \ Field, The Mother Elf generated a \"negative energy field\" that is equviliant\
        \ to a microscopic black hole- typically in order to transform beings., Energy\
        \ Source, When combined with the Ciel System, is stated in Mega Man Zero 3\
        \ that the Mother Elf can generate enormous energy to solve the world's energy\
        \ crisis., The \"Ultimate\" Power, The Mother Elf's most notable ability within\
        \ the story of the Zero saga is the sheer might it can grant its wielders.\
        \ It is said that the Mother Elf\u2019s power is the \"ultimate power\" that\
        \ \"nearly brought the world to destruction\", able to make wielders \"invincible\"\
        \ with its gift. It was able to turn Elpizo (shown right) from a non-combatant\
        \ Reploid into someone who claimed to be stronger than Zero, matching him\
        \ in power- and even at one time casually overpowering him with paralysis\
        \ with just half of the Mother Elf's powers. As Omega is designed specifically\
        \ to use the Mother Elf, he can gain the most out of this boost, without succumbing\
        \ to any ill effects., Madness, A user of Baby Elves, direct offsprings of\
        \ the Mother Elf- can be driven insane if not designed to be compatiable with\
        \ the Mother Elf., Forcefield, The Mother Elf can project a force field that\
        \ easily knocks away foes, Transforming / Erasing, The Mother Elf was able\
        \ to convert Elpizo into a Cyber Elf., Paralysis, Half of the Mother Elf's\
