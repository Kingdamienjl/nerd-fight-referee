    confidence: 0.8
  attack_potency:
    text: "Multi-Galaxy level (As the Scepter formerly used as a Celestial-Body Neuron\
      \ of Nous, Scepter \u03B4-me13 surpasses the worthy Scepters that empowered\
      \ Rubert II to destroy half of the ,Simulated Universe: Unknowable Domain, Scepter:\
      \ Evolution Alter: Extreme which consists of an infinite amount of parallel\
      \ worlds,A Knight StrangerEverwinter Night with a single thought. It is also\
      \ far superior to the Emperor's sword, one of the unworthy Scepters described\
      \ as \"merely poor imitations of Nous,\" capable of annihilating an entire galaxy\
      \ in a nanosecond on a subatomic level.Simulated Universe: Unknowable Domain,\
      \ Secrets: Omnipotent Bankruptcy (III) After being gazed upon by Nanook and\
      \ evolving into Irontomb, it ascended to the status of a Lord Ravager, becoming\
      \ far more powerful than before. Even while not yet fully born, Irontomb was\
      \ stated to be on par with fully-fledged Lord Ravagers such as Zephyro. After\
      \ being fully born, it was capable of fighting Ascended Trailblazer, Ascended\
      \ Permansor Terrae, Ascended March 7th, Demiurge and the Ascended Chrysos Heirs\
      \ simultaneously long enough to begin its Self-Coronation2.93626771 RonnaFoe),\
      \ up to Multiverse level+ with Self-Coronation (Irontomb becomes progressively\
      \ more powerful once it starts the Self-Coronation process. The Interastral\
      \ Peace Corporation's scientists stated that if Irontomb achieves its peak by\
      \ performing the Self-Coronation, it will possess power that vastly surpasses\
      \ that of any Emanator. Should be superior to Khaslana at his peak, whom Irontomb\
      \ is fused with and from whom it is confirmed to draw power, as Khaslana's full-power\
      \ final attack at the absolute peak of his fury was capable of harming True\
      \ Form NanookHero, Shatter That Woeful EffigyAnimated Short \"Hark! There's\
      \ Revelry Atop the Divine Mountain\" | Honkai: Star Rail and drawing a drop\
      \ of blood from THEM.Blazing Sun, Illuminate the Path for the Lost It is also\
      \ reiterated numerous times that Khaslana managed to harm the real Nanook THEMSELF\
      \ inside of the Path Space where the Aeons' True Forms reside.Time, Ferry Me\
      \ Through AgesAs I've Written, \u03B4-me13.exe, Experiment Progress: Eternal\
      \ Recurrence, Anomaly Log: World-Cleansing BloodExperimental Records of \u03B4\
      -me13 (Part III)Zephyro's ProverbStars, Silent as Enigmas After drawing upon\
      \ Khaslana's full power and while still in the midst of the process of Self-Coronation,\
      \ Irontomb unleashed a final attack that destroyed the . Irontomb has been repeatedly\
      \ stated to be capable of destroying the entire and succeeded in doing so, nearly\
      \ destroying the Path of EruditionVanquished Foe's ReticenceData Bank Terms:\
      \ Imaginary Tree (Theory)Wanderer, Decipher the Waxen Imprints before being\
      \ stopped by The Herta intervention during its Self-Coronation. After its Self-Coronation\
      \ was thwarted by The Herta's intervention, it fought against Post-Fuli Gaze\
      \ Demiurge and the Amped versions of the Chrysos Heirs, Trailblazer, March 7th\
      \ and Permansor Terrae at the same time for a while before being defeated.Pages,\
      \ Ripples That Engrave Memories After its first Self-Coronation, Irontomb can\
      \ attempt it as many times as it wants, as shown when it tried to perform a\
      \ second one at the end of its battle against the revived Chrysos Heirs, where\
      \ its second Self-Coronation matched Post-Fuli Gaze Demiurge's strongest attack\
      \ before ultimately being overpowered and defeated)"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: "Massively FTL+ (As the first Scepter ever constructed and one that was\
      \ part of Nous's divine corpus,Captives, Behold the Expanse Beyond Light Scepter\
      \ \u03B4-me13 should be far superior to the Emperor's sword, one of the unworthy\
      \ Scepters described as \"merely poor imitation of Nous\" that are capable of\
      \ annihilating an entire galaxy in a nanosecond. After being gazed upon by Nanook\
      \ and evolving into Irontomb, it ascended to the status of a Lord Ravager, becoming\
      \ even fater than before. Kept up with Ascended Trailblazer, Ascended Permansor\
      \ Terrae, Ascended March 7th, Demiurge and the Ascended Chrysos Heirs at the\
      \ same time63.11385 Sextillion c), up to Infinite with Self-Coronation (Should\
      \ be superior to Khaslana at his peak, as Irontomb is fused with him and is\
      \ confirmed to be capable of drawing power from him, with Khaslana, at the absolute\
      \ peak of his fury, flying across several galaxies and into a higher dimension\
      \ where he was able to attack True Form Nanook. Whilst in the process of Self-Coronation,\
      \ Irontomb's blast was capable of traveling the entire ,Hero, Return to Dawn\
      \ in Mortality which is repeatedly stated to be infinite in sizeHonkai Impact\
      \ 3rd; Second Key; Chapter 2: Seed of Sumeru)"
