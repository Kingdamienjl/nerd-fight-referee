  intelligence:
    text: "Instinctive (Irontomb lacks true consciousness, self-awareness, and higher\
      \ reasoning. As noted by Lygus, it is comparable to a headless chimera\u2014\
      a massively powerful but instinct-driven creature that acts without intention\
      \ or understanding, whose only goal is to seize the Sage's head. Irontomb operates\
      \ purely on automatic, pre-programmed impulses centered on obtaining the head\
      \ of Nous. Although Irontomb is driven solely by its objective of performing\
      \ the Self-Coronation with Nous, it still employs its techniques with precision\
      \ and responds effectively to its surroundings, allowing it to contend simultaneously\
      \ with Trailblazer, March 7th, Permansor Terrae, Demiurge and the Chrysos Heirs,\
      \ enduring long enough to begin its Self-Coronation. Irontomb itself is capable\
      \ of speech as well)"
    source_ids: *id002
    confidence: 0.8
