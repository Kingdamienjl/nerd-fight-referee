    - field: intelligence
      value: "''' '''Instinctive''' ([https://www.youtube.com/watch?v=6BRFRqOq048&t=305s\
        \ Irontomb lacks true consciousness, self-awareness, and higher reasoning.\
        \ As noted by Lygus, it is comparable to a headless chimera\u2014a massively\
        \ powerful but instinct-driven creature that acts without intention or understanding,\
        \ whose only goal is to seize the Sage's head. Irontomb operates purely on\
        \ automatic, pre-programmed impulses centered on obtaining the head of Nous].\
        \ Although Irontomb is driven solely by its objective of performing the Self-Coronation\
        \ with Nous, it still employs its techniques with precision and responds effectively\
        \ to its surroundings, allowing it to contend simultaneously with Trailblazer,\
        \ March 7th, Permansor Terrae, Demiurge and the Chrysos Heirs, enduring long\
        \ enough to begin its Self-Coronation. [https://www.youtube.com/watch?v=RCLYyXeoyys&t=108s\
        \ Irontomb] [https://www.youtube.com/watch?v=RCLYyXeoyys&t=124s itself] [https://www.youtube.com/watch?v=RCLYyXeoyys&t=203s\
        \ is] [https://www.youtube.com/watch?v=RCLYyXeoyys&t=456s capable] [https://www.youtube.com/watch?v=RCLYyXeoyys&t=633s\
        \ of] [https://www.youtube.com/watch?v=RCLYyXeoyys&t=954s speech] [https://www.youtube.com/watch?v=RCLYyXeoyys&t=1082s\
        \ as] [https://www.youtube.com/watch?v=RCLYyXeoyys&t=1117s well]) | '''[[Nigh-Omniscience|Nigh-Omniscient]]'''\
        \ ([https://www.youtube.com/watch?v=6BRFRqOq048&t=429s After completing its\
        \ Self-Coronation, Irontomb is able to merge with Nous, the Aeon of Erudition]\u2014\
        [https://imgur.com/a/MO2PiMB an event averted solely by The Herta]. Through\
        \ Self-Coronation, Irontomb would gain obtain all of [[Nous]]'s abilities,\
        \ which includes THEIR Nigh-Omniscience. [https://imgur.com/a/rOmsNI2 The\
        \ Exploratory Excursion claims that Irontomb would seize Nous's mind for itself]Exploratory\
        \ Excursion: The Headless Archsmith, Flame of Destruction) | '''[[Genius Intelligence|Supergenius]]'''\
        \ ([https://gyazo.com/6f975803a75fc1959e504b89138fc306 Inherited] [https://www.youtube.com/watch?v=x3bRer52asE&t=31s\
        \ all of] [[Cyrene|Demiurge]] and [[Herta|The Herta]]'s knowledge)"
      source_id: mediawiki-5009991
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "Multi-Galaxy level (As the Scepter formerly used as a Celestial-Body\
        \ Neuron of Nous,&#91;3&#93;&#91;2&#93;&#91;10&#93;&#91;34&#93; Scepter \u03B4\
        -me13 surpasses the worthy Scepters&#91;44&#93; that empowered Rubert II to\
        \ destroy half of the UniversePhysical Plane,&#91;114&#93; which consists\
        \ of an infinite amount of parallel worlds,&#91;115&#93;&#91;116&#93; with\
        \ a single thought.&#91;114&#93; It is also far superior to the Emperor's\
        \ sword, one of the unworthy Scepters described as \"merely poor imitations\
        \ of Nous,\"&#91;44&#93; capable of annihilating an entire galaxy in a nanosecond\
        \ on a subatomic level.&#91;117&#93; After being gazed upon by Nanook and\
        \ evolving into Irontomb, it ascended to the status of a Lord Ravager, becoming\
        \ far more powerful than before.&#91;2&#93;&#91;1&#93; Even while not yet\
        \ fully born, Irontomb was stated to be on par with fully-fledged Lord Ravagers\
        \ such as Zephyro.&#91;50&#93; After being fully born, it was capable of fighting\
        \ Ascended Trailblazer, Ascended Permansor Terrae, Ascended March 7th, Demiurge\
        \ and the Ascended Chrysos Heirs simultaneously long enough to begin its Self-Coronation&#91;5&#93;&#91;Statistics\
        \ Values 1&#93;), up to Multiverse level+ with Self-Coronation (Irontomb becomes\
        \ progressively more powerful once it starts the Self-Coronation process.&#91;5&#93;\
        \ The Interastral Peace Corporation's scientists stated that if Irontomb achieves\
        \ its peak by performing the Self-Coronation, it will possess power that vastly\
        \ surpasses that of any Emanator.&#91;50&#93; Should be superior to Khaslana\
        \ at his peak, whom Irontomb is fused with&#91;69&#93; and from whom it is\
        \ confirmed to draw power,&#91;70&#93;&#91;46&#93; as Khaslana's full-power\
        \ final attack at the absolute peak of his fury was capable of harming True\
        \ Form Nanook&#91;3&#93;&#91;6&#93; and drawing a drop of blood from THEM.&#91;118&#93;\
        \ It is also reiterated numerous times that Khaslana managed to harm the real\
        \ Nanook THEMSELF inside of the Path Space where the Aeons' True Forms reside.&#91;119&#93;&#91;118&#93;&#91;3&#93;&#91;120&#93;&#91;121&#93;&#91;122&#93;&#91;123&#93;\
        \ After drawing upon Khaslana's full power and while still in the midst of\
        \ the process of Self-Coronation,&#91;5&#93;&#91;12&#93; Irontomb unleashed\
        \ a final attack that destroyed the UniversePhysical Plane.&#91;5&#93; Irontomb\
        \ has been repeatedly stated to be capable of destroying the entire UniversePhysical\
        \ Plane and succeeded in doing so, nearly destroying the Path of Erudition&#91;20&#93;&#91;46&#93;&#91;68&#93;&#91;4&#93;&#91;108&#93;&#91;12&#93;&#91;10&#93;&#91;124&#93;&#91;125&#93;\
        \ before being stopped by The Herta intervention during its Self-Coronation.&#91;108&#93;&#91;12&#93;&#91;10&#93;\
        \ After its Self-Coronation was thwarted by The Herta's intervention,&#91;108&#93;&#91;12&#93;&#91;10&#93;\
        \ it fought against Post-Fuli Gaze Demiurge and the Amped versions of the\
        \ Chrysos Heirs, Trailblazer, March 7th and Permansor Terrae at the same time\
        \ for a while before being defeated.&#91;12&#93; After its first Self-Coronation,\
        \ Irontomb can attempt it as many times as it wants, as shown when it tried\
        \ to perform a second one at the end of its battle against the revived Chrysos\
        \ Heirs, where its second Self-Coronation matched Post-Fuli Gaze Demiurge's\
        \ strongest attack before ultimately being overpowered and defeated&#91;12&#93;)"
