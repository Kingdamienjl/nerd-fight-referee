        of DETERMINATION (Monsters like Undyne can be filled with determination, Alphys
        has theorized that determination is the power that gives human SOULS their
        incredible power, which is also confirmed by the ancient monsters, and this
        power is what makes a monster with a human soul so powerfull. This would mean
        that a stable monster filled with determination would have a SOUL as strong
        as a human''s, and unlike humans with their physical forms, due to being attuned
