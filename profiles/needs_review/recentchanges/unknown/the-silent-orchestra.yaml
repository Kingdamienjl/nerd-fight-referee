        breath underwater), Animal Manipulation (Several monsters such as Froggit,
        Whimsun, Migosp can attack with several insect based attacks), Astral Projection
        (Several monsters like Froggit, Tsunderplane, Moldybugg can attack with magical
        projections of themselves), Undead Physiology (Type 2; They are ghosts), Immortality
        (Type 7; They are ghosts), Self-Sustenance (Types 1 and 3; Should scale to
        Napstablook who can survive while buried in snow like it's nothing), Flight
        (Ghosts are show several times flying), Non-Corporeal (Ghosts are stated and
        show to be incorporeal), Possession and Fusionism (Ghosts can possess any
        object that they desire and then fuse with them if they feel the right emotions,
        becoming one with the possessed object), Intangibility and Invisibility (Ghosts
        can turn both invisible and intangible, however they probably can't do this
