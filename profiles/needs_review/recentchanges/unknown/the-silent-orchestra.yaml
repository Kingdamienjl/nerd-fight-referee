        and other monsters can create several magical objects to use as projectiles),
        Water Manipulation (Aaron, Woshua and other monsters can attack with water
        based projectiles), Sound Manipulation (Shyren can attack with sound based
        projectiles), Elasticity, Body Control and Vibration Manipulation (Temmies
        can vibrate their bodies to the point their faces leave their body, and they
        can strech their limbs), Magma Manipulation, Statistics Amplification, Precipitation
