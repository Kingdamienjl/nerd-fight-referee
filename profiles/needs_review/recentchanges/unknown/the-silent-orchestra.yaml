  text: Abnormality Physiology, Flight, Sound Manipulation (Can produce a variety
    of sound and music. Can create silent sound), Creation (Can create all four other
    members of the orchestra), Time Manipulation (Can set time back to normal after
    it has been modifiedLobotomy Corporation Game), Power Nullification (Can prevent
    time-based abilities from being usedLobotomy Corporation Game), Cloth Manipulation,
    Perception Manipulation (Its musical performance will appear in the listeners
    sight at all times, with no exception), Energy Manipulation (Can drain collected
    energy and produce enkephalinLobotomy Corporation Game), Teleportation (Can teleport
    around the facilityLobotomy Corporation Game), possibly Absorption (The E.G.O.
    Equipment it can produce can absorb WHITE damage, although it is unknown if the
    Silent Orchestra can use it by itselfLobotomy Corporation Game), Mind Manipulation,
    Madness Manipulation, Fear Manipulation, Morality Manipulation and Perception
    Manipulation (Passively inflicts fear into those who see it, potentially causing
    them to panic and freak out. Can directly attack the mind via WHITE DamageLobotomy
    Corporation Manual), Memory Manipulation (Can make those who hear its music "forget
    everything"), Invulnerability (Can become immune to each attack typeLobotomy Corporation
    Game)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
