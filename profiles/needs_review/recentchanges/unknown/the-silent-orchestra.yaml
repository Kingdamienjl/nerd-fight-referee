        regular food, monster food turns into energy when eaten, thus healing any
        damages to the body and soul, several monsters can also heal using magical
        green projectiles), Magic, Non-Physical Interaction (Magic is capable of harming
        ghosts, which are incorporeal), Intangibility (Elemental; Certain monsters
        such as Grillby are made of fire), Longevity (Monsters like Gerson can live
        for a very long time), Cosmic Awareness (Gerson knows about how the game mechanics
