    - field: weaknesses
      value: "Sirius is completely insane, so she sometimes make incomprehensible\
        \ decisions. One possessing exceptional individualism could resist the effects\
        \ of Soulwashing. Notable Attacks/Techniques: *Authority of Wrath: Soulwashing:\
        \ Sirius's Authority activates upon anyone who is aware that she exists, and\
        \ allows her to freely manipulate the feelings of those affected by it: forcibly\
        \ polarizing, amplifying, and sharing emotions between people. Using this\
        \ power, she can brainwash people into behaving however she pleases and even\
        \ turn them into puppeted pawns, or multiply peoples' feelings against eachother\
        \ to raise them to the point of insanity and death. Sirius's Authority isn't\
        \ just as simple as forcibly linking senses, but works on the level of manipulating\
        \ the soul itself. Due to her power over the soul, Sirius can share and transmit\
        \ physical conditions just as easily as feelings: if she or anyone else under\
        \ her Authority is wounded, she can force everyone under her Authority to\
        \ receive that exact same wound. This includes fatal wounds, meaning Sirius\
        \ can force everyone to share in her or anyone else's death. Following her\
        \ defeat thanks to the efforts of the Songstress, Sirius has been inspired\
        \ to incorporate singing in order to enhance Authority\u2014 her humming alone\
        \ being something that drills into one's brain, the Music of Resentment. *Fire\
        \ Magic: Separate from her Authority of Wrath, Sirius is a supernaturally-skilled\
        \ magician, specializing in Fire magic. She can manipulate flames in a multitude\
        \ of ways: simply producing enormous flames which melt stone, bathing the\
        \ battlefield in a sea of fire, creating weapons of flame, and controlling\
        \ natural fires. Sirius combines her magic with her golden chains, birthing\
