- id: claim-standard-equipment-669f44bf
  section: equipment
  axis: equipment
  text: '*Golden Chains: Seemingly endless chains which Sirius hides within her cultist
    robes. The chains are wound tightly around her arms, and she handles them with
    such skill that they appear to be alive. She may also keep her chains wound around
    her limbs, effectively turning them into golden swords. *The Gospel: A book of
    prophecies given to all members of the Witch Cult, it is a defective version of
    an incomplete copy of the Book of Wisdom. It is a guide to the owner''s desired
    future, but its contents are vague and subject to change, the instructions being
    up to interpretation.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
