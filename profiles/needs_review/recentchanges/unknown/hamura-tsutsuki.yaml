        \ clans and one of the Three Great D\u014Djutsu. Wielders of this eye can\
        \ see long distances (at least up to 10 kilometers) and can see objects that\
        \ are too small for the average eye to detect (such as the tenketsu points\
        \ on a human's body). The Byakugan has an almost perfect 360-degree field\
        \ of vision, though there is a small blind spot located near the back of the\
        \ user's neck. The eye can also see through objects as well as many barriers\
        \ and can see chakra. *Tenseigan (\u8EE2\u751F\u773C, Literally meaning \"\
