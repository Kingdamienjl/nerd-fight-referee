    - field: weaknesses
      value: "Incapable of utilizing the Six Paths Chibaku Tensei without Hagoromo.\
        \ Notable Attacks and Techniques: *: This eye technique is the Kekkei Genkai\
        \ of the Hy\u016Bga and \u014Ctsutsuki clans and one of the Three Great D\u014D\
        jutsu. Wielders of this eye can see long distances (at least up to 10 kilometers)\
        \ and can see objects that are too small for the average eye to detect (such\
        \ as the tenketsu points on a human's body). The Byakugan has an almost perfect\
        \ 360-degree field of vision, though there is a small blind spot located near\
        \ the back of the user's neck. The eye can also see through objects as well\
        \ as many barriers and can see chakra. *: Sometime before his death, Hamura\
        \ had awoken the Tenseigan in his own Byakugan. Doing this gave him several\
        \ abilities, such as the ability to manifest his own Truth-Seeking Orbs and\
        \ an enhanced state called the Tenseigan Chakra Mode. **: An enhanced chakra\
        \ state that gives the user enhanced speed, strength, and durability and the\
        \ ability to form Truth-Seeking Orbs. *: Truth-Seeking Orbs are spheres of\
        \ black, malleable chakra that are comprised of all five fundamental nature\
        \ transformations, natural energy, and Six Paths Sage Chakra. The user can\
        \ shape and manipulate these black orbs that can delete anything they touch.\
        \ They render nearly all powers that come in contact with it completely useless.\
        \ These orbs of black chakra are highly versatile and can be used for offensive,\
        \ defensive, and supplementary purposes. The user can apply shape transformation\
        \ to the balls to alter them into various weapons, either by having the spheres\
        \ pierce through holes in their hands or by simply grabbing them. The balls\
        \ can also wrap around the user to act as a defensive shield, or be launched\
        \ to serve as high-speed projectiles. They are also capable of causing massive\
        \ explosions by rapidly expanding their size, a lethal attack that can also\
        \ damage the user's own body. ==Notable Matchups== Victories: Losses: Inconclusive:\
