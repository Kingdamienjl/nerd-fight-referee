        \ state called the Tenseigan Chakra Mode. *Tenseigan Chakra Mode (\u8EE2\u751F\
        \u773C\u30C1\u30E3\u30AF\u30E9\u30E2\u30FC\u30C9, Tenseigan Chakura M\u014D\
