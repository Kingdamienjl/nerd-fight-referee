      value: 'Peak Human Physical Characteristics, Clairvoyance (He can be summoned,
        which requires him to know who summons him. He began to chase the protagonists
        of the film after being summoned by them. ALEEYKAT93 stated that Slenderman
        knew Wren was "interested" and that he was watching her), Shapeshifting (He
        manifests himself in a variety of forms. He transformed into a tree at the
        end of the movie), Large Size through Shapeshifting (Type 0: He can transform
        into a big tree), Mind Manipulation (It is stated that he has a hypnotic power
        that renders his victims helpless to stop themselves from walking into his
        arms. He caused Katie and Wren to become obsessed with him. He gets into the
        heads of his victims, like a virus that affects their brains. He makes Chloe
        strangle herself. Bio-Electric Beings are capable of causing their victims
        personality changes, bizarre behaviors, mental illnesses, psychosis, loss
        of contact with reality, self-mutilation and suicide), Dream Manipulation
        (He caused Hallie to have nightmares), Status Effect Inducement and Fear Manipulation
        (He caused Lizzie to have a panic attack and faint, and later, he caused her
        to have an even worse panic attack. He was probably the cause of Katie''s
        headaches and Chloe''s throwing up), Darkness Manipulation (He manipulates
        the shadows), Madness Manipulation (Type 2) and Death Manipulation (He is
        capable of making his victims mad. It was declared that looking into his face
        would cause insanity or death in the person doing so. Bio-Electric Beings
        are capable of causing their victims personality changes, bizarre behaviors,
        mental illnesses, psychosis, loss of contact with reality, self-mutilation
        and suicide. He left Chloe in this state), Technology Manipulation and Minor
        Electricity Manipulation (He manipulated Chloe''s cell phone and made it start
        playing what he was seeing, later did the same with Wren''s cell phone. He
        interrupted a phone call and caused a blackout in a library), Invisibility
        (He turned invisible while stalking Chloe), Intangibility (Phasing: He passed
        through some doors), Perception Manipulation and Illusion Creation (He makes
        Chloe strangle herself, while she thinks Slender Man is strangling her. Bio-Electric
        Beings are capable of causing hallucinations. Stretches out Wren''s view of
        a bookcase. Caused Hallie to hallucinate while she was with Tom. Caused Hallie
        to hallucinate in the hospital. He causes ringing in the ears of his victims),
        Bodily Weaponry, Body Control and Additional Limbs (He can create tentacles
        or branches that sprout from his body. He is able to adjust to pass through
        extremely narrow spaces), Teleportation (He appears in front of Chloe, despite
        the fact that she had previously left him behind. He prevented Wren from escaping
        through different hallways in a library, always appearing in front of her.
        Appears next to Hallie, despite not being there two seconds ago. He mysteriously
        disappears after chasing Hallie), Biological Manipulation (He temporarily
        took away Wren''s face), Absorption (He absorbed Hallie)'
