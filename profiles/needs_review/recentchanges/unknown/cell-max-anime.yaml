power_scale:
  tier:
    text: 2-C
    source_ids: &id002
    - mediawiki-4761671
    confidence: 0.8
  attack_potency:
    text: Low Multiverse level (Fought and overpowered the combined forces of Super
      Saiyan Gohan, Trunks, Goten, Potential Unleashed Piccolo, Android 18, Krillin,
      Gamma 1, and Gamma 2 after being released prematurely. Was later able to clash
      with and overwhelm Great Namekian Orange Piccolo. After scraping a win, Gohan
      said that even Goku and Vegeta would not be able to defeat Cell Max. The Bio-Android
      is so powerful and dangerous enough that Gohan decided to target his weak point
      with a fully-charged Special Beam Cannon to eliminate him. Cell Max's fight
      against Beast Gohan is stated to be "the strongest battle in history"6 Universes)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively FTL+ (Much faster than Ultimate Gohan and Orange Piccolo. Moved
      behind Super Saiyan Gohan and Piccolo so fast that they couldn't even perceive
      it and were unable to react in timeUpscales from 73.63 Quintillion c)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class T (Far superior to Base Goku, who endured Pretty Black Hole's
      gravitational pull1.553395 Billion Metric Tons)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Low Multiverse level
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Low Multiverse level (Almost seemed invulnerable to Gohan and Piccolo. Was
      able to take Gamma 2's self-destructive attack, despite severe damage dealt
      to his left arm and side in the process)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Fought Gohan, Piccolo, Gamma 1, and Gamma 2 without any signs
      of tiring. Capable of fighting against and quickly overpowering Orange Piccolo
      despite his weak spot having been attacked multiple times, and losing his arm
      after enduring Gamma 2's self-destruct)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Several Meters, up to Tens of Meters with Size Manipulation; Low Complex
      Multiversal with Ki-based attacks; Interdimensional & Extradimensional (5-D;
      Can affect two respective universes which have a Neutral Space between them)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Animalistic (Whereas Cell was highly intelligent and eloquent, Cell Max
      is nothing but a mindless berserker who instinctively destroys everything in
      sight. Despite this, he appears to possess strong enough fighting knowledge
      to contend with wise fighters such as Piccolo)
    source_ids: *id002
    confidence: 0.8
