- id: claim-powers-and-abilities-51769777
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Large Size (Type 0), Immortality (Types
    2 and 7; becomes Dry Bowser after having all of his flesh burned away and being
    reduced to a skeleton), Bodily Weaponry (Conventional; Claws, tail, horns, teeth,
    and spikes on his back), Fire Breath (His flames are hot enough to instantly incinerate
    flesh and gradually melt a manhole cover), Resistance to Harsh Temperatures (Survived
    being frozen solid by Peach. Is unhurt by the heat of his own flames), Weapon
    Mastery (Axes), Body Control (Can retreat into his shell for protection), Likely
    Space Survival (Walks on a dock exposed to open space), and Social Influencing
    (Social Position and Reputation, Instigating Fear, Leadership, and Coercion; Bowser
    is the King of the Koopas and commands a vast army. He has demonstrated strategic
    prowess by devising an ambush to capture the entire Kong army, and intimidation
    and coercion by briefly coercing Peach into marrying him by threatening her Toads.
    His fearsome reputation is evident when his arrival sends the Toads into a panic,
    necessitating their evacuation, and he has also threatened and tortured Luigi)
    All previous abilities, plus Remote Body Control (Can move his body parts independently
    while they are detached). All abilities listed under Base, plus Flight with his
    airship, Afterimage Creation (Super Star users leave afterimages in their wake),
    Shockwave Generation, and Resistance to Fire (Mario and Luigi powered through
    Bowser's fire breath and created a multicolored shockwave while empowered by the
    Super Star). All physical attributes are enhanced by the Super Star.
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
