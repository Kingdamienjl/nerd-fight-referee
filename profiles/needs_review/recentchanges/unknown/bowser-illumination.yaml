    - field: weaknesses
      value: "Sometimes he acts pretty dumb, and from time to time, he can be quite\
        \ gullible. Notable Attacks/Techniques: *Dark Magic: This was only used in\
        \ Super Mario Bros., where Bowser transformed the entire Toad population into\
        \ bricks and plants. *Bowser Bomb: Bowser jets downwards, shaking the ground,\
        \ which will cause some foes to slip and fall. That is, unless they get crushed\
        \ by the attack itself. *Koopa Claw: Bowser snatches up a foe within his immediate\
        \ vicinity and chomps on them. Either that, or he could choose to backflip\
        \ and body-slam onto them instead. *Whirling Fortress: Bowser retreats into\
        \ his shell and begins spinning rapidly. This renders Bowser immune to virtually\
        \ any harm, as his foes will, in one way or another, be harmed by his spikes.\
        \ This also allows Bowser to float briefly through the air. *Pyrokinesis:\
        \ Bowser has multiple attacks where he creates and manipulates fire. **Flame\
        \ Breath: Bowser's signature technique, where he breathes flames reaching\
        \ 5,000\xB0C. He can breathe small fireballs, big fireballs, make it rain\
        \ big fireballs or small fireballs, breathe a constant beam of flame, or shoot\
        \ multiple red or blue, the latter having a homing effect and doubling the\
        \ heat to 10,000\xB0C, fireballs at his foes. **Flaming Tunnel: Bowser sprouts\
        \ a column of flame to harm or even trap foes. **Flaming Boomerangs: Bowser\
        \ can spawn boomerangs that are eternally set aflame to throw at foes. **Rising\
        \ Hell: Bowser rises a blanket of flame that can cover entire continents.\
        \ *Spike Shoot: Bowser fires a spike from his shell like a cannon. *Spike\
        \ Curl: Bowser curls up into a spiky ball to bulldoze foes with. He feels\
        \ little to no pain when like this due to his shell's defenses, and he can\
        \ cling to walls and climb them. *Poison Gas: Bowser summons a cloud of poisonous\
        \ gas that cloaks his foes and poisons them. Bowser can also add this poison\
        \ effect to his claws and teeth. *Terrorize: Bowser summons an enormous Boo\
        \ to terrorize his foes, halving their strength and durability. *Ztar Zpin:\
        \ Bowser's dark variant of Mario's Star Spin. It allows Bowser to propel himself\
        \ forward whilst in the midst of attacking, but cannot deflect projectiles\
        \ or draw items in. *Boulder of Doom: Bowser utilizes his Terrakinesis and\
        \ forms of barrier of rock around him and rolls forward, thrashing any and\
        \ all foes in the way. *Megastrike: Bowser makes use of tremendous re-entry\
        \ force and (somehow) throws a metal soccerball, splitting it into six and\
        \ giving it re-entry force of its own. *Energy Attacks: Bowser can manipulate\
        \ and bend his energy into multiple attacks. **Sphere: Bowser forms a sphere\
        \ of energy in his hand, and throws it at his foe. There are two different\
        \ versions. The red sphere acts like lava--splashing up magma upon contact\
        \ with the ground. The purple sphere acts like a lightning strike, sending\
        \ out a shockwave of electricity upon contact with the ground. **Weapon: Bowser\
        \ forges a weapon of pure energy. Most notable is a hockey stick, which he\
        \ can use to smack foes with. *Space-Time Tear: Bowser warps through space-time,\
        \ time traveling to where he pleases. *Minion Attacks: These attacks are only\
        \ executable with the help of Bowser\u2019s minions. Thus, they are only usable\
        \ for tag team battles pitting Bowser and his minions on the same team. **Goomba\
        \ Storm: Bowser summons a horde of Goombas. These Goombas run off-screen before\
        \ charging in at the foe\u2019s feet. Bowser attempts to shoot as many as\
        \ he can with fire\u2014those he shoots are burnt and jump into the sky, and\
        \ those he doesn\u2019t slam into the enemy\u2019s legs. Once there are no\
        \ more Goombas, the burnt Goombas then come plummeting down unto the foes\u2019\
        \ heads, burning them and smacking into them at the same time. **Shy-Guy Squad:\
        \ Bowser summons a group of Shy-Guys. The Shy-Guys take organization behind\
        \ Bowser as he curls into his shell. Six Shy-Guys hold a large rubber band\
        \ behind Bowser as six more push him as far as they can into the rubber band.\
        \ Once pushed as far as possible, the Shy-Guys leap out of the way as Bowser\
        \ is sent careening into his enemy\u2019s face\u2014spikes and all. **Koopa\
        \ Corps: Bowser summons dozens of Koopa Troopas. The Koopa Troopas dart off-screen\
        \ as Bowser curls into his shell and spinning rapidly. The Koopa Troopas then\
        \ dash in and curl into their shell\u2014spinning\u2014as well, bashing into\
        \ foes. Bowser then keeps knocking the Koopa Troopas back into their foes.\
        \ The process repeats until Bowser misses and there are no Koopa Troopas left,\
        \ or when the Koopa Troopas\u2019 shells break and they\u2019re defeated.\
        \ **Bob-omb Blitz: Bowser summons a few Bob-ombs. Said soldiers then line\
        \ themselves up, allowing Bowser to order them into specific spots. After\
        \ a couple seconds, the Bob-ombs then charge forward and explode when next\
        \ to the foes. **Magikoopa Mob: Bowser summons a gathering of Magikoopas.\
        \ The Magikoopas aline themselves in random orders, and Bowser then throws\
        \ fireballs into their wands, allowing them to shoot powerful blasts of magic\
        \ at the foe. This process repeats a few times. **Brog"
