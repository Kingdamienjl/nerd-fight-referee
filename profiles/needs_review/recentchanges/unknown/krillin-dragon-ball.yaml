- id: claim-weaknesses-24744afd
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks and Techniques: Ki: The fighting power and life
    force of a martial artist, a tangible energy derived from the user''s vigor, courage,
    and mind. It can be used in a number of ways, such as to surpass the limits of
    one''s body to greatly increase in strength, and it can be fired as blasts of
    energy or used to create defensive barriers. Learning how to use ki at an early
    age, Krillin is now very skilled in its use, and has been called the strongest
    human on Earth, something that doubtlessly stems from his training under many
    martial artists and the potential he had unlocked by Grand Elder Guru. *: Krillin
    fires two reddish-orange waves of ki from his hands, which can follow his opponent
    like homing missiles, making them difficult to evade, especially when Krillin
    attacks alongside them. *: The signature technique of the Turtle School, which
    Krillin learned from Master Roshi. Charged and fired with both hands, it is a
    simple but powerful technique. *: Krillin''s signature technique, a razor sharp
    blade of ki that he creates by holding his hand above his head. Possessing incredible
    cutting power, it''s even powerful enough to cut cleanly through Frieza''s tail
    in his second form. *: Krillin charges up and fires a small large energy sphere
    that slowly flies into the air, where it explodes, splitting into many smaller,
    faster ki blasts that rain down upon his foe. *: One of Tien Shinhan''s signature
    techniques, which Krillin copied from him at some point. Bringing his hands up
    to his face, Krillin can create a bright flash of light that can blind opponents.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
