        rules and physiology as the Omnitrix, while also possessing all of its powers,
        functions, and resistances. While most of its functions have to be activated
        in specific manners, it also includes more passive ones) *Superhuman Characteristics
        and Physiology **Small Size (Type 0) ** Tendrils Manipulation & Body Control
        (Has several tongues that he uses as appandeges to get food easier, those
        aare very adhesive) ** Sharp Teeth ** Acrobatics ** Enhanced Senses (Upchuck
        is connected to the Gourmand species and can sense any danger to his people
        through his stomach) ** Self-Sustenance & Propulsion Flight (By propulsing
        with their own vomit, Gourmands can propel themselves from planet to planet)
        * Limited Toon Force (He can make stuff he eats seemingly cartoonishly elastic,
        easier for consumption. He could also temporaly stay in the air for comedic
        tone, and has extremely elastic, and extendable jaw) * Solid Matter Ingestion,
        Absorption & Empowerment (All Types; Matter, Energy, Liquids & Biological;
