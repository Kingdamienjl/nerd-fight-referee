- id: claim-weaknesses-bd718876
  section: weaknesses
  axis: weakness
  text: 'Average human weaknesses | Completing all three of the Princess Quest arcade
    minigames will free Vanessa from Glitchtrap''s control, although this is not combat
    applicable Note: While one ending of Security Breach implies Vanessa and Vanny
    are different people, this is contradicted by the emails found in Five Night''s
    At Freddy''s AR and the ending scene of Help Wanted''s Dreadbear DLC. Another
    ending of Security Breach implies they are the same person, as Vanessa meets Gregory
    after he frees Vanny from Glitchtrap''s control. This profile assumes they are
    the same person. ==Notable Matchups== Victories: Ghostface (Mobile Game) (Scream)
    Ghostface''s Profile (Vanny used, anything above 10-A was restricted, and starting
    distance was 5 meters) Losses: J. Jonah Jameson (Marvel Comics) Jameson''s Profile
    (First key Vanessa used, anything above 10-A is restricted, and speed was equalized)
    Inconclusive: Category:Characters Category:Five Nights At Freddy''s Category:Female
    Characters Category:Game Characters Category:Video Game Characters Category:Indie
    Game Characters Category:Horror Characters Category:Possessed/Brainwashed Characters
