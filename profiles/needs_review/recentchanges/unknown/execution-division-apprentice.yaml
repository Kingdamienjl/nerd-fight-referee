    field_candidates:
    - field: tier
      value: At least
      source_id: mediawiki-5078759
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: 'At least Small Town level (Alongside Master, Apprentice is a top Executioner
        that was tasked with dealing with the S-Tier Akudama that the Black Cat had
        assembled. Despite being far weaker in every aspect compared to Master, she
        was able to physically match and temporarily overwhelm the likes of Brawler
        in hand-to-hand combat, who admitted she was pretty strong, while also easily
        incapacitating Doctor. She had also been able to physically match Courier,
        and fought him multiple timesAkudama Drive - Episode 12: AKUDAMA DRIVE)'
      source_id: mediawiki-5078759
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: 'At least High Hypersonic+ Short-Burst Movement, Combat, Reaction and
        Perception Speed (Apprentice is capable of easily keeping up with Akudama
        such as Brawler and Courier, and even blitz the likes of Doctor who attempted
        the sneak attack her. With this, she should not be too overwhelmingly slower
        than her Master, who could deflect Courier''s bullets from point blank range21417.1
        m/s), likely higher (Apprentice should be comparable, if not superior, to
        the other Akudama who consistently and easily dodge laser-like projectiles
        from police robots and tanks.Akudama Drive - Episode 1: SE7EN Apprentice in
        particular was able to deflect one of these lasers from a close range, though
        was disarmed by a second shot shortly after. Both her and Master were also
        seemingly able to catch up to the Shinkansen, a bullet train, on foot before
        it picked up speed)'
      source_id: mediawiki-5078759
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: durability
      value: 'At least Small Town level (Although she had taken damage, Apprentice
        was able to survive an offhand impact of Courier''s railgun, that could briefly
        match the power output of a Particle Cannon.Akudama Drive - Episode 12: AKUDAMA
        DRIVE1.80761 Kilotons of TNTAlthough Courier''s Railgun had lost against the
        Particle Cannon in its clash, this was heavily the result of his railgun overheating
        due to previous extended use of not only the weapon, but the bike itself in
        order to escape the Executioners. Although not being hit directly, Apprentice
        had shown to have taken some form of damage after it had been fired as she
        had fallen, although managed to survive and fight with no issues in her next
        encounter with the Akudama. Courier''s intent to kill with this attack could
        possibly question the level of output he had used, since he dislikes killing
        in his jobs if it is not necessary and has spared Apprentice before. Despite
        this is still dealt noticeable damage and collapsed the top of the hotel they
        were fighting in. On top of this, lesser durable characters like Swindler
        could also survive up to three of these Particle Cannons when they were used
        to destroy the Shinkansen, which further supports Apprentice''s scaling. Apprentice
        has also been able to withstand attacks from Brawler and Courier, as well
        as managed to survive in the Decontamination Zone for a short while before
        needing to be rescued, though hospitalised.Akudama Drive - Episode 5: DEAD
        MAN WALKING Despite this, characters within the series are seemingly more
        vulnerable to piercing attacks, such as from knives or swords, than blunt-force
        or concussive attacks)'
      source_id: mediawiki-5078759
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: stamina
      value: 'Superhuman (As a skilled Executioner, Apprentice was able to keep up
        with the likes of S-Tier Akudama such as Brawler, as well as survive being
        temporarily exposed to the Quarantine Zone before being savedAkudama Drive
        - Episode 6: BROTHER)'
      source_id: mediawiki-5078759
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: range
      value: Standard Melee Range, Extended Melee Range with her energy sword, at
        least Tens of Meters with thrown energy sword
      source_id: mediawiki-5078759
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: '*Energy Sword: Like with every Executioner, Apprentice primarily uses
        a retractable yellow energy sword that he wields in his objective to kill
        Akudama. This blade is able to easily cut through solid metals and forcefields,
        as well as effortlessly pierce durable Akudama such as Brawler. Apprentice
        is also able to throw her sword with decent accuracy, almost being able to
        hit Courier.'
      source_id: mediawiki-5078759
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Under the guidance and mentorship of Master, Apprentice has been trained
        into a skilled and dedicated Executioner, capable of faring off against high-tier
        Akudama such as Brawler and Courier. She would eventually rise to become new
        head of the Executioners, striving Kansai towards a brighter future.Akudama
        Drive Comicalize - Chapter 63 Standard Tactics: *As an Executioner, Apprentice''s
        prime directive is to hunt and execute all Akudama he comes across in line
        with her duty. With this, she is required to work in a two-man system with
        her partner and mentor, the Execution Division Apprentice. After his death,
        Apprentice is newly paired with Junior as his new partner. This is made in
        order to invoke feelings of kinship between Executioners, which greatly increases
        survival rates amongst Executioners, who tend to take no care of themselves
        and are prepared to die when in combat.'
      source_id: mediawiki-5078759
      provider_id: vsbattles
      authority: high
      confidence: 0.75
