      described as being "all for show" and doesn't increase Ralsei's displayed stats
      when equipped in the menu. Despite this, it grants Ralsei an invisible +12 ATK,
      +3 DEF, and +3 Magic in battle, which given the prior context, can be attributed
      to Ralsei holding back less in Flowery's memory. Destroyed Sound of Justice
      in just three hits, shattering it into pieces. Claimed that he could handle
      the entirety of a Dark World's challenges on Kris and Susie's behalf), even
      higher with "FireShock" (Instantly disintegrated a large shuriken that threatened
      Susie, with Ralsei stating that he could burn Flowery down in an instant, a
      claim the latter does not deny, placing it on par if not above the damage Kris
      could inflict on Omega Flowery. With the YellowHat, this spell becomes 20% stronger
      and more effective859.6 Zettatons x 1.2 = 1.0315 Yottatons with YellowHat)
