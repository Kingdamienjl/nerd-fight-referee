  section: weaknesses
  axis: weakness
  text: 'Prefers not to fight. His kindness can be taken advantage of, such as when
    King tricked him into healing him. These weaknesses [https://youtu.be/jy9e4V_Zfhg&t=24335
    were] [https://youtu.be/jy9e4V_Zfhg&t=27454 mitigated] after Chapter 4. As with
    all Darkners, he is restricted to Dark Worlds and will turn into a basic object
    if he is brought outside of it. {| class="mw-collapsible mw-collapsed" align="center"
    border="1" cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; " |Notable Attacks/Techniques: |- | [https://deltarune.wiki/w/Encounter#DEFEND
    DEFEND]: Ralsei covers his body with his scarf to block attacks and [https://youtu.be/0Y3-XHB-6K0&t=1704
    reduce incoming damage]. Using it also gathers 16% TP for Ralsei''s SPELLs. [https://deltarune.wiki/w/Encounter#MAGIC
    SPELLs]: When he casting a spell, Ralsei holds his hands together looking down
    with a yellow aura around him, then looks up holding a yellow spark in his hand.
    *Chapter 1: **Pacify: A method used by Ralsei to peacefully end battles against
    tired enemies by putting them to sleep. [https://youtu.be/4ADeYLkC3Mc&t=1667 Can
    put to sleep multiple opponents at the same time] and [https://youtu.be/YjKP75YNcmE&t=204
    even works on "tired" machines] causing them to stop working. **Heal Prayer: Ralsei
    prays and uses a spell to heal himself and his allies. [https://youtu.be/eA-RBpfcGgQ&t=6120
    Can use it constantly] in cutscenes without gathering TP first. And [https://youtu.be/eA-RBpfcGgQ&t=5483
    he can even heal all three at the same time] although it shouldn''t be as powerful
    as Dual Heal. **Lullaby/Sing: Ralsei sings a lullaby, putting his target to sleep
    and tiring everyone around. **BreathALL/CloakOnX: Ralsei can [https://youtu.be/zfRhmSfs_ok&t=4986
    blow a wind] capable of blowing away [https://youtu.be/f9jLRNGxFmY&t=11316 one]
    or [https://youtu.be/zfRhmSfs_ok&t=4986 various] enemies like [https://deltarune.wiki/w/Rabbick
    Rabbick] and [https://deltarune.wiki/w/Ribbick Ribbick]. **Think of Someone: Ralsei
    can [https://youtu.be/VR_8F5rpFlI&t=4772 see what other people are doing] through
    the Player''s point of view just by letting Kris [https://youtu.be/n4tQ7zWk61E&t=83
    close their eyes] and [https://youtu.be/ovMA1BQiYWU&t=24196 think about someone].
    **Hypnosis: Ralsei chants something, reducing the attack power and making the
    enemy feel tired. **Dual Heal: An upgraded Heal Prayer, only accessed after Kris
    shines their SOUL''s light on Ralsei. Requires TP, and heals all of Ralsei''s
    allies. In Chapter 4, Susie uses her healing spell alongside Ralsei, [https://youtu.be/zhEBOFo3GFg&t=14962
    greatly healing] everyone on the team although the spell''s efficiency decreases
    with each use. *Chapter 2: **R-Action: Ralsei can [https://deltarune.wiki/w/Ralsei#R-Action
    form a strategy] and [https://imgur.com/a/QF3dTbM resolve a conflict] in a peaceful
    way like Kris''s [https://deltarune.wiki/w/Encounter#ACT ACT]s. **TrapOne: Ralsei
    can [https://youtu.be/q6WfnAcdlFs&t=5825 summon] a red cage to trap enemies, the
    latter can have [https://youtu.be/lIgyoTsgwIc&t=38 different] [https://youtu.be/LSzIOVrPIe4&t=75
    sizes] when summoned depending on the size of the target. Ralsei can also try
    to [https://youtu.be/q6WfnAcdlFs&t=7766 leave a trap] in the battle area so that
    a cage falls on the enemy, capturing them. **FluffyGuard: Ralsei creates two cotton-like
    shields that protects his ally from bullets. *Chapter 3: **Sharpshoot: Ralsei
    can [https://youtu.be/VR_8F5rpFlI&t=1621 throw hearts] from his fingers at enemies
    which can do [https://youtu.be/VR_8F5rpFlI&t=10412 some] [https://youtu.be/VR_8F5rpFlI&t=17005
    damage]. **PopularBoy: Ralsei can turn into a [https://youtu.be/JsLi4KcxsUI&t=10291
    stuffed toy] to be the center of attention. *Chapter 4: **LightUp: Ralsei can
    throw [https://youtu.be/zhEBOFo3GFg&t=5643 several fireballs]. **LightUp(SOUL):
    Ralsei [https://youtu.be/zhEBOFo3GFg&t=7572 increases the radius of the light]
    emitted by Kris''s SOUL. **Climbing: Ralsei can climb walls that look climbable
    with the [https://imgur.com/a/Cc68wlW ClaimbClaws]. **Charge Jump: When [https://youtu.be/eA-RBpfcGgQ&t=10952
    climbing], Ralsei can [https://youtu.be/eA-RBpfcGgQ&t=6361 charge a jump] and
    [https://youtu.be/eA-RBpfcGgQ&t=7023 increase his climbing speed] for a few seconds.
    **Whirl: Ralsei [https://imgur.com/a/nAuEk8U spins around] with his party to create
    a [https://youtu.be/jy9e4V_Zfhg&t=25640 tornado] and peacefully remove enemies
    from a battle. **Brighten: Susie and Ralsei can [https://youtu.be/zhEBOFo3GFg&t=14019
    greatly increase] the radius of Kris''s SOUL light. **Reviver: A small Ralsei
    with a halo and wings appears to heal one of his allies, [https://youtu.be/zhEBOFo3GFg&t=14431
    removing] the [https://deltarune.wiki/w/Titan_(Chapter_4)#Strategy Down state].
    *Chapter 5: **ReviveSong: [https://youtu.be/SxXo-C4uooo&t=349 Revives a DOWNed
    ally and heals them]. Otherwise, heals a lot of HP. **CleanUp: Ralsei can [https://youtu.be/qBOqF9F-MNY&t=3160
    c'
