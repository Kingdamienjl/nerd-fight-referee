  text: "center|thumb|250px {| class=\"fandom-table\" |- |colspan =\"2\" style=\"\
    text-align: center;\"|Z-Saber: Zero's signature weapon, a powerful beam saber\
    \ he acquired after being rebuilt during the events of Mega Man X2. In the Zero\
    \ series, Zero can charge its slash like a Mega Buster could, making it the source\
    \ of Zero\u2019s strongest attacks. It was able to easily defeat a Neo Arcadian\
    \ Golem with one slash, when his Buster Shot could not do with its basic shots.\
    \ |- !Uncharged Attack !Charged Attack |- |https://static.wikia.nocookie.net/megaman/images/a/a0/MMZ3_Zero_SlashCombo.gif/revision/latest\
    \ |https://static.wikia.nocookie.net/megaman/images/a/a1/MMZ3_Zero_ChargeSlash.gif/revision/latest\
    \ |- |} center|250px {| class=\"fandom-table\" |- |colspan =\"6\" style=\"text-align:\
    \ center;\"|Buster Shot: A blaster salvaged from a fallen soldier after reawakening,\
    \ it has since been considered Zero\u2019s main weapon alongside his Z-Saber.\
    \ It can fire a limitless supply of solar rounds in a manner akin to his original\
    \ Z-Buster, as well as be charged up like a Mega Buster normally could. |- !Uncharged\
    \ Attack !Semi-Charged Attack !Charged Attack !Charged Attack (Thunder) !Charged\
    \ Attack (Flame) !Charged Attack (Ice) |- |https://static.wikia.nocookie.net/megaman/images/0/04/MMZ_BusterShot.gif/revision/latest\
    \ |https://static.wikia.nocookie.net/megaman/images/b/b6/MMZ_ChargeShotS.gif/revision/latest\
    \ |https://static.wikia.nocookie.net/megaman/images/f/f4/MMZ_ChargeShotL.gif/revision/latest\
    \ |https://static.wikia.nocookie.net/megaman/images/d/dd/MMZ_ThunderChip.gif/revision/latest/scale-to-width-down/220\
    \ |https://static.wikia.nocookie.net/megaman/images/9/94/MMZ_FlameChip.gif/revision/latest/scale-to-width-down/220\
    \ |https://static.wikia.nocookie.net/megaman/images/0/08/MMZ_IceChip.gif/revision/latest\
    \ |- |} center|225px {| class=\"fandom-table\" |- |colspan =\"2\" style=\"text-align:\
    \ center;\"|Shield Boomerang: A modification to the Z-Saber, allowing Zero to\
    \ mount it on his arm and spin it to reflect projectile attacks, aside from extremely\
    \ powerful ones. Offensively, it can also be thrown as a buzzsaw that returns\
    \ to him like a boomerang would. |- !Defense !Thrown Attack |- |https://static.wikia.nocookie.net/megaman/images/c/c3/MMZ_ShieldBoomerang.gif/revision/latest\
    \ |https://static.wikia.nocookie.net/megaman/images/4/45/MMZ_Charge_ShieldBoomerang.gif/revision/latest\
    \ |- |} center|250px {| class=\"fandom-table\" |- |colspan =\"2\" style=\"text-align:\
    \ center;\"|Triple Rod: A lance-like extension for the Z-Saber that Zero uses\
    \ in a manner akin to his former Durga Glaive, attacking foes with thrusting and\
    \ slashing attacks and deflecting oncoming attacks with battle staff-like movements.\
    \ Zero can also gain height on his jump by aiming this spear downwards on top\
    \ of enemies or other harmless objects. |- !Uncharged Attack !Charged Attack |-\
    \ |https://static.wikia.nocookie.net/megaman/images/8/84/MMZ_TripleRod.gif/revision/latest\
    \ |https://static.wikia.nocookie.net/megaman/images/0/0a/MMZ_ChargeTripleRod.gif/revision/latest\
    \ |- |} center|250px {| class=\"fandom-table\" |- |colspan =\"2\" style=\"text-align:\
    \ center;\"|Chain Rod: Another modification for the Z-Saber, turning the handle\
    \ into an energy chain that Zero can freely manipulate like a whip to hook onto\
    \ and stun enemies, drag them closer for additional attacks, or simply impale\
    \ them at a distance. If it lands on a shield or other gear, Zero can tear away\
    \ and disarm the equipment. In addition, it can be used as a grappling hook to\
    \ reel himself towards a wall or swing from it- as well as to grab useful items\
    \ or heavy obstacles that are out of reach. |- !Uncharged Attack !Charged Attack\
    \ |- |https://static.wikia.nocookie.net/megaman/images/4/4d/MMZ2_ChainRod.gif/revision/latest\
    \ |https://static.wikia.nocookie.net/megaman/images/8/8e/MMZ2_ChargeChainRod.gif/revision/latest\
    \ |- |} center|250px {| class=\"fandom-table\" |- |colspan =\"2\" style=\"text-align:\
    \ center;\"|Recoil Rod: Yet another modification for the Z-Saber, splitting it\
    \ into a pair of tonfas that repulse anything they strike if not outright destroying\
    \ the target on contact. It can also be used to propel Zero great distances by\
    \ using it against a wall or the ground or even an enemy's head. When it damages\
    \ an enemy, it send them flying into other enemies, or flipping their defenses\
    \ around to leave them open to attack. It can even knock foes as large as Tretista\
    \ Kelverian significantly further backwards. |- !Uncharged Attack !Charged Attack\
    \ |- |https://static.wikia.nocookie.net/megaman/images/6/68/MMZ3_RecoilRod.gif/revision/latest\
    \ |https://static.wikia.nocookie.net/megaman/images/d/df/MMZ3_ChargeRecoilRod.gif/revision/latest\
    \ |- |} center|250px {| class=\"fandom-table\" |- |colspan =\"2\" style=\"text-align:\
    \ center;\"|Zero Knuckle: Chips embedded in Zero's palms that allow him to wrench\
    \ away items from others, disarming them of their weapon and likely body part,\
    \ before using them as his own. Otherwise, it provides a boost to his unarmed\
    \ strength, as well as grip strength- even abl"
