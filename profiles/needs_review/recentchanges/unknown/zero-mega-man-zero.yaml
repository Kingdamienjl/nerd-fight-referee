- id: claim-powers-and-abilities-01e23032
  section: abilities
  axis: hax
  text: "*Possesses all Abilities & Skills from his X-Era Self on a massively higher\
    \ scale, in addition to: *Physiology **Reploid Physiology (General) **Enhanced\
    \ Accelerated Development (Battle; Physical Statistics, Abilities & Intelligence;\
    \ Zero's new body holds more potential (performance) than his previous one, rivalling\
    \ X's. Able to quickly relearn his old battle skills through battle. An amnesiac\
    \ Zero managed to defeat Armed Phenomenon Copy X, who is stronger than all four\
    \ Guardians combined, who were comparable to him just moments earlier, calling\
    \ him \"weak\" compared to the real deal (who credited this to his battle skills).\
    \ Despite being overpowered moments earlier, defeats a then transformed Elpizo\
    \ with the Dark Elf. Defeated Omega with the Dark Elf, despite being unable to\
    \ defeat his base Armored state earlier in the game, and only matching him in\
    \ his Fusion Form just moments before) **Enhanced Transformation (Can obtain new\
    \ forms the more he fights, linked to his innate potential) **Enhanced Non-Physical\
    \ Interaction (Can interact with Cyber Elves, even able to damage them) **Enhanced\
    \ Enhanced Senses (Can somewhat see in complete darkness during Phantom's EX Skill)\
    \ *Skills **Enhanced Genius Intelligence (see Intelligence section) **Enhanced\
    \ Surface Scaling & Acrobatics (via Wall Jumping, able to climb massive structures\
    \ with ease) **Enhanced Martial Arts (Showcases hand to hand prowess with the\
    \ Recoil Rod and Z-Knuckle) **Enhanced Weapon Mastery (Can proficiently use anything\
    \ as weapon- such as sabers, busters, lances, shields, whips, whips, tonfas, etc.,\
    \ and can even utilize ordinary items as effective weapons) **Enhanced Stealth\
    \ Mastery (Manuevered around sensors in the Abandoned Factory) *Miscellaneous\
    \ **Loses Body Control (No longer can transform his arm to a Buster) Zero can\
    \ transform his Z-Saber in-between forms, as well as adjust the compression and\
    \ shape of the Z-Saber to his needs. *Z-Saber: **Elemental Manipulation (Fire;\
    \ Higher than 12000 to 160,000,000 Degrees Celcius, Ice; Layered Absolute Zero,\
    \ Electricity; At least 100 Million Volts and Earth; via Shouenga, Tsuibangeki,\
    \ Buraitotsu, and Hyougetsujin. Comparable to his Element Chips.), Energy Projection\
    \ (Via Kougenjin and Zaneidan) *Buster Shot: **Elemental Manipulation (Fire; Higher\
    \ than 12000 Degrees Celcius, Ice; Layered Absolute Zero, Electricity; At least\
    \ 100 Million Volts, and light. Comparable to his Element Chips.), Explosion Manipulation\
    \ (Via Blast Shot, Burning Shot and Burst Shot), Layered Time Stop (via Time Stopper,\
    \ which was derived from Popla Cocapetri's version which froze Zero, despite his\
    \ X-Era self being immune to Dark Hold), Summoning (Via Blizzard Arrow), Absorption\
    \ (Via Tractor Shot), Paralysis Inducement (Via Spark Shot) *Shield Boomerang:\
    \ **Transmutation (Via Filter Shield), Weapon Control (Via Shield Sweep and Orbit\
    \ Shield), Attack Reflection (Can reflect projectiles) *Chain Rod: **Life Energy\
    \ Drain (Via Energy Chain) *Miscellaneous **Healing (via Sub-Tanks) *Chips **Element\
    \ Chips: Power Modification (Element Chips imbue the user's attacks with elemental\
    \ affinities) ***Thunder Chip; At least 100 Million Volts (The Thunder Chip can\
    \ be salvaged from Panther Flauclaws, who can discharge electricity at 100 million\
    \ volts, and should be superior to the Classic and X-Era cast that use electricity)\
    \ ***Flame Chip; Higher than 12000 Degrees Celcius (The Flame Chip can be salvaged\
    \ from Phoenix Magnion- who is far superior to Heat Man and should be superior\
    \ to the Classic and X-Era cast that use fire) ***Ice Chip; Layered Absolute Zero\
    \ (The Ice Chip can be salvaged from Blizzack Stagroff, who is able to freeze\
    \ Zero and therefore is superior to Tundra Storm, those who can resist it along\
    \ with the X-Era cast such as Chill Penguin, who can freeze Mega Man X, Blizzard\
    \ Buffalo who resists such temperatures, Frost Walrus who can freeze the former\
    \ two, Avalanche Yeti's absolute zero Drift Diamond- which the X8 Cast can resist,\
    \ etc.) **Regeneration (Low; Via Head Chips) **Free Movement (Via Body and Foot\
    \ Chips - Can allow him to move in crumbling terrain, slippery floor, spike floors,\
    \ jump on water surfaces, quick sand, and even ignore the effects of wind and\
    \ more potent magnets) **Limited Pain Tolerance (Absorber allows Zero to withstand\
    \ attacks without recoiling) **Intangibility (Likely Immaterial; via the Shadow\
    \ Chip) **Enhanced Acrobatics (Via Ultima Chip, combines all of the foot chips\
    \ into one), *Forms **Statistics Amplification & Self Statistics Reduction (Depending\
    \ on the form, some stats increase, some decrease) **Absorption (Energy; The Erase\
    \ Form allows Zero's weapons to absorb energy attacks) **Damage Reduction (Defense\
    \ Form doubles Zero's defense) **Probability Manipulation (Via Energy Form) By\
    \ summoning Cyber-Elves, Zero gets more abilities including: *Information Manipulation\
    \ (Type 2) & Reality Warping (Cyber Elves manipulate Cyberspace code to manipulate\
    \ the real world) *Nurse: **Healing (Low-Mid \u2014 Zero's Nurse Cyber-Elves"
