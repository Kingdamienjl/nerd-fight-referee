        This attack completely ignores all defenses. This was the attack used to finish
        off Omega in the Elf Wars. Learning System: Similarly to X and his Variable
        Weapon System, Zero is able to gain access to new attacks by defeating foes
        in combat with the Learning System, sometimes known as the Saber Tactic System.
        Unlike X, Zero rarely copies the attacks of his opponents but instead creates
        new attacks based on his opponent''s abilities known as "EX Skills". For example,
        defeating Phoenix Magnion allowed Zero to develop the Tenshouzan, an uppercut
        with the Z-Saber that can be ignited in flame. Due to the fact that these
        tend to be sword techniques inherent to Zero rather than copied weapons, they
        do not require Weapon Energy and thus can be used as often as Zero likes.
        {, class="fandom-table", +List of EX Skills !Technique !Applied Element !Weapon
        Involved !Description !Visual, Time Stopper, Non-Elemental, Buster Shot, Fires
        a transparent-like cube at his foes, stopping time for all of those that the
        cube overlaps. It is notable that this Time Stop is superior to similar weapons
        from the X-Era and Classic Era which also affect time to stop foes., Blast
        Shot, Buster Shot, Zero has fired multiple types of flame type projectiles
        from his buster involving fiery explosions, whether it be from variants such
        as Burst Shot or Burning Shot. They all involve a kind of lasting explosion
        that deals extra damage, Blizzard Arrow, Buster Shot, Zero has fired multiple
        types of ice type projectiles from his buster involving multiple sharp projectiles
        made of ice. They can range from being structured like a storm such as Blizzard
        Arrow, splinter into fragmented ice on contact with Triple Shot, or aligned
        in a straight line for more durability and multi-hitting ability as Ice Javelin,
        Spark Shot, Buster Shot, Zero has fired multiple types of lightning type projectiles
        from his buster. Spark Shot and V-Shot launch at unique angles, while the
        Tractor Shot absorbs the strength of other projectiles as it charges and travels,
        increasing in size and strength acting as a barrier, Reflect Laser, Non-Elemental,
        Buster Shot, Zero can fire a defense piercing laser shot that reflects off
        of walls at forty-five degree angles, Non-Elemental / Fire, Z-Saber, Sometimes
        known as Split Heavens or Flame Fang- Zero replicates "Ryuenjin" from his
        X-Era self- slashing upwards with a flaming Saber. It is not necessary for
        him to use the Flame Chip for this technique, and can use it normally as a
        non-elemental attack. Flame Fang in particular does not require any associated
        Chip., Saber Smash, Non-Elemental / Ice / Thunder, Z-Saber, A downward stab
        similar to Hyouretsuzan from his X-Era self. It is also known as Sky Chaser
