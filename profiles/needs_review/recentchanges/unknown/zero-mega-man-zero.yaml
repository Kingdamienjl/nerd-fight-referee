  name: 'Zero changing into Energy Form { class="fandom-table" +List of Chips !Chip
    !Description !Visual - colspan ="3" style="text-align: center;"Head Chips - Auto-Charge
    Charges weapons without conscious intent or input https://static.wikia.nocookie.net/megaman/images/d/d0/MMZ3HCAutoCharge.png/revision/latest
    - Auto-Recover Heals while standing still https://static.wikia.nocookie.net/megaman/images/5/5c/MMZ3HCAutoRecover.png/revision/latest
    - Quick Charge Increases charging speed for his weapons. https://static.wikia.nocookie.net/megaman/images/6/69/MMZ3HCQuickCharge.png/revision/latest
    - Auto-Filling Repairs or reloads improvised weapons picked up by the Z-Knuckle
    to make them practically permanent use weapons. N/A - Weapon Plus Increases durability
    of improvised weapons picked up by the Z-Knuckle. N/A - colspan ="3" style="text-align:
    center;"Body Chips - Elemental Chips One of Zero''s most fundamental assets. He
    can imbue his charged attacks and some of his EX Skills with elements of either
    Fire, Ice, and Thunder. These elements are equal to or superior to any showcased
    element in the series thus far, surpassing Heat Man''s Atomic Fire, Tundra Man''s
    Tundra Storm, and at least equal to Panther Flauclaws''s lightning. https://static.wikia.nocookie.net/megaman/images/e/ec/MMZ3BCThunder.png/revision/latest
    https://static.wikia.nocookie.net/megaman/images/4/4d/MMZ3BCFlame.png/revision/latest
    https://static.wikia.nocookie.net/megaman/images/5/58/MMZ3BCIce.png/revision/latest
    - Absorber Chip Zero does not recoil or take knockback by any attack. https://static.wikia.nocookie.net/megaman/images/e/eb/MMZ3BCAbsorber.png/revision/latest
    - Light Chip Allows Zero to ignore quicksand or crumbling terrain by becoming
    lightweight. https://static.wikia.nocookie.net/megaman/images/0/0a/MMZ3BCLight.png/revision/latest
    - Erase/Reflect Chip Allows Zero to erase or reflect projectiles with the Saber.
    N/A - Strong/Stronger/Strongest Reduces instant kill effects significantly in
    damage. N/A - colspan ="3" style="text-align: center;"Foot Chips - Ultima Foot
    Chip Combines all of the effects of the Foot Chips from Mega Man Zero 3 https://static.wikia.nocookie.net/megaman/images/2/2c/MMZ3FCUltimate.png/revision/latest
    - Shadow Dash Chip In Mega Man Zero 3, becomes intangible during a dash, being
    unaffected by attacks that pass through him https://static.wikia.nocookie.net/megaman/images/b/b9/MMZ3FCShadowDash.png/revision/latest
    - Double Jump Chip Allows for the ability to double jump in Mega Man Zero 3 https://static.wikia.nocookie.net/megaman/images/e/e6/MMZ3FCDoubleJump.png/revision/latest
    - Quick Chip Increases movement speed in Mega Man Zero 3 https://static.wikia.nocookie.net/megaman/images/a/a2/MMZ3FCQuick.png/revision/latest
    - Spike Chip In Mega Man Zero 3, this chip allows Zero to become unaffected by
    low friction surfaces and walk normally, such as slippery surfaces https://static.wikia.nocookie.net/megaman/images/3/36/MMZ3FCSpike.png/revision/latest
    - Frog Chip In Mega Man Zero 3, slows descent during a wall slide. https://static.wikia.nocookie.net/megaman/images/4/43/MMZ3FCFrog.png/revision/latest
    - Splash Jump Chip Can jump on the surface of any body of water in Mega Man Zero
    3 https://static.wikia.nocookie.net/megaman/images/8/8b/MMZ3FCSplashJump.png/revision/latest
    - Spike Type W Chip Unaffected by magnetic fields and wind N/A - Spike Type I
    Chip Unaffected by icy floors N/A - colspan ="3" style="text-align: center;"Other
    - Junk "Form" In Mega Man Zero 4, equipping the Junk Head, Body, and Foot Chips
    unlocks a form that can repel Scrap Cyber-Elves, beings made of pure energy and
    electrons. More importantly, it doubles his attack power and damage intake. N/A
    } { class="fandom-table" +List of Forms !Chip !Description !Visual - Ultimate
    Form Zero''s most powerful form is the Ultimate Form. It gives a notable increase
    to all attacks and overall statistics. Most importantly, Zero can use charged
    attacks instantly without the need to actually charge up any of his weapons, which
    also means he is able to apply the effects of his Elemental Chips instantly without
    the need to use an EX Skill or charge up. https://static.wikia.nocookie.net/megaman/images/0/05/Ultimate_Form_Sp.png/revision/latest/scale-to-width-down/220
    - X Form Grants a notable increase to his Buster Shot''s damage and rate of fire.
    https://static.wikia.nocookie.net/megaman/images/5/57/X_Form_Sp.png/revision/latest/scale-to-width-down/220
    - Active Form Grants a notable movement speed increase. Along with it,'
  source_field: keys
