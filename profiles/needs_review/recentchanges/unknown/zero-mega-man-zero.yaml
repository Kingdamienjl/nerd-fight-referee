- id: claim-weaknesses-272ad962
  section: weaknesses
  axis: weakness
  text: 'None notable ==Notable Attacks and Techniques== Final Strike: A conjunction
    attack with his allies (most commonly X and Axl) that unleashes a powerful barrage
    of energy blasts on a number of opponents, dealing immense damage if not outright
    killing the targets in question. This attack completely ignores all defenses.
    This was the attack used to finish off Omega in the Elf Wars. Learning System:
    Similarly to X and his Variable Weapon System, Zero is able to gain access to
    new attacks by defeating foes in combat with the Learning System, sometimes known
    as the Saber Tactic System. Unlike X, Zero rarely copies the attacks of his opponents
    but instead creates new attacks based on his opponent''s abilities known as "EX
    Skills". For example, defeating Phoenix Magnion allowed Zero to develop the Tenshouzan,
    an uppercut with the Z-Saber that can be ignited in flame. Due to the fact that
    these tend to be sword techniques inherent to Zero rather than copied weapons,
    they do not require Weapon Energy and thus can be used as often as Zero likes.
    {| class="fandom-table" |+List of EX Skills !Technique !Applied Element !Weapon
