power_scale:
  tier:
    text: High 8-C, higher with the Super Mushroom, 10-C as Mini Mario | 8-B, possibly
      7-C
    source_ids:
    - vsbattles-mario-illumination-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Large Building level (Can physically damage and take attacks from Dry Bowser
      without requiring a Power-Up, who can withstand attacks from Power-Up-enhanced
      Mario. Defeated [https://youtu.be/-EIXPOw_Wzs?t=238], who withstood an explosion
      of this size, and tackled into him with enough force to destroy a steel bridge),
      higher with the Super Mushroom (The Super Mushroom explicitly enhances Mario's
      physical strength), Below Average Human level with the Mini Mushroom (The Mini
      Mushroom reduces Mario to a diminutive size. Bowser was unable to break free
      from a glass jar when under the effects of a Mini Mushroom) | City Block level
      (Shattered part of Bowser's ship alongside Luigi), possibly Town level (The
      Super Star was implied to be the most powerful thing Bowser had at his disposal,
      which would make it more powerful than the Bomber Bill, something that would've
      caused this much damage if it hit the Mushroom Kingdom)
    source_ids:
    - vsbattles-mario-illumination-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Peak Human (Can run alongside Donkey Kong) with Subsonic reaction and combat
      speed (Dodged an attack from Donkey Kong, who swatted away a cannonball), Below
      Average Human as Mini Mario, Subsonic as Cat Mario (Moved this fast) | At least
      Subsonic (Blitzed Bowser and his entire army)
    source_ids:
    - vsbattles-mario-illumination-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Superhuman (Dragged an unconscious Donkey Kong with one hand while underwater
      and swam him to the surface, tossed a barrel back at Donkey Kong), Below Average
      Human (As Mini Mario) | Possibly Class 50 with the Super Star (Comparable to
      Bowser who lifted a big rock)
    source_ids: &id002
    - mediawiki-4806790
    confidence: 0.95
  striking_strength:
    text: Large Building level, higher with the Super Mushroom, Below Average Human
      level as Mini Mario | City Block level, possibly Town level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Large Building level (Tanked a large explosion and hits from Dry Bowser),
      higher with the Super Mushroom, Below Average Human level (As Mini Mario) |
      City Block level (Can withstand the force of his own attacks), possibly Town
      level (Super Star users are said to be "invincible", implying they could withstand
      the Bomber Bill's explosion)
    source_ids:
    - vsbattles-mario-illumination-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Relentlessly attempted a hazardous training course for over
      a day. Traveled through multiple regions alongside Peach and Toad while showing
      no signs of exhaustion. Endured thrashings from the likes of Bowser and Donkey
      Kong and kept fighting) | Superhuman (Higher than before)
    source_ids:
    - vsbattles-mario-illumination-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Below Standard Melee Range as Mini Mario, Extended
      Melee Range as Cat Mario and Tanooki Suit Mario.
    source_ids:
    - vsbattles-mario-illumination-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average (Mario is shown to possess a diverse skillset, owning his
      own plumbing service, being a skilled go-kart driver, and is a skilled combatant
      able to perform a series of gymnastic stunts. Mario was also able to adapt to
      the world of the Mushroom Kingdom in a matter of days despite it being alien
      to him. Is skilled enough to briefly hold his own against both Dry Bowser and
      Bowser Jr. at the end of the second movie)
    source_ids:
    - vsbattles-mario-illumination-unknown
    confidence: 0.6
    notes: auto_repair source extraction
