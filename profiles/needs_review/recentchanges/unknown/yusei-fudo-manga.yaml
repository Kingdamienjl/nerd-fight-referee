  name: Resistance to Power Nullification, Memory Manipulation, Fear Manipulation,
    Possession, Morality Manipulation, Corruption
  description: Resistance to Power Nullification, Memory Manipulation, Fear Manipulation,
    Possession, Morality Manipulation, Corruption, Mind Manipulation, Soul Manipulation,
    Absorption, Pain Manipulation, and Power Absorption (His Duel Dragon's Shadow
    Sense makes his sense incapable of being negated by Jack's Sense Banish. Broke
    through the terror inflicted by the dark miasma exuded by the Skeleton Duelist,
    and wasn't affected by the powers of other miasma that was corrupting the minds
    and hearts of others. Survived the miasma of the Ultimate God and Dark Sect, whose
    miasma is so dense it has physical form, and causes pain to those around it, with
    the Ultimate God's miasma in its inert form being capable of corrupting Rex and
    Ish and making the, forget each other. Was able to use his Duel Dragon without
    being possessed or having his soul shattered. The Ultimate God fused with Rex
    Goodwin was incapable of stealing the soul and power of him and his cards without
    defeating him in a duel, despite having taken them from every single duelist and
    deck. Superior to other duelists, who can live without their soul), Likely Resistance
    to Law Manipulation (Despite having gained complete power over natural laws, Ultimate
    God Goodwin could not kill him in any manner without a duel), likely Resistance
    to Fate Manipulation, Precognition, and possibly Probability Manipulation (Sect
    and Jack started that Turbo Duelists do not care about fate, the future, destiny,
    and grasp at infinite possibilities, allowing them to overturn the futures predicted
    by others and destiny itself) Limited Resistance to Power Nullification (Duel
    Dragons cannot be copied onto other cards), Resistance to Mind Manipulation (The
    Duel Dragons were capable of breaking free of Ultimaya Tzolkin's powers)
