- id: claim-powers-and-abilities-2ba5ab74
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Subjective Reality with Sense (Can make
    his monsters and the damage they inflict real), Summoning, Darkness Manipulation,
    Light Manipulation, Morality Manipulation (The Duel Dragons can purify those they
    defeat in combat), Attack Reflection (Can reverse the foe's power and turn it
    against them with Cross Sense and Sonic Verse), Durability Negation, Power Nullification,
    Statistics Reduction, Statistics Amplification (Has multiple cards that boost
    statistics. His emotions strengthen his Duel Dragon), Gravity Manipulation, Non-Physical
    Interaction (Duel monsters can harm spirits in the graveyard and destroy objects
    like Phantom Tokens, which have no physical form), Forcefield Creation (Can create
    a sonic barrier that stops all destruction, can fold his sense wings into shields
    that halve damage), Resurrection (Can bring back Stardust as a spirit to destroy
    a foe), Durability Negation, possibly Duplication (Duel Dragons can duplicate
    others, can create a double made of sense), Air Manipulation (Can Summon a tornado
    with Parallel Twister), Fire Manipulation (Can use Phoenix Battle Wings to grant
    a monster flaming wings), Flight (Using his sense to create wings to fly), Aura
    (Can cloak himself in silver sense), Damage Boost (Can boost his sense several
    times over with various factors, including increased speed, timing, distance,
    and emotion. Sense in turn can boost the damage done from monsters and spells
    to a duelist as it increases in power), Reactive Power Level (Light Sense grows
    stronger as darkness does), Sealing (Can use sealing with the Light Sense or with
    Stardust), Empowerment (Gains power from the hopes and prayers of others), Energy
    Projection, Spatial Manipulation and Time Manipulation with Sonic Shine Reverse
    Resistance to Power Nullification, Memory Manipulation, Fear Manipulation, Possession,
    Morality Manipulation, Corruption, Mind Manipulation, Soul Manipulation, Absorption,
    Pain Manipulation, and Power Absorption (His Duel Dragon's Shadow Sense makes
    his sense incapable of being negated by Jack's Sense Banish. Broke through the
    terror inflicted by the dark miasma exuded by the Skeleton Duelist, and wasn't
    affected by the powers of other miasma that was corrupting the minds and hearts
    of others. Survived the miasma of the Ultimate God and Dark Sect, whose miasma
    is so dense it has physical form, and causes pain to those around it, with the
    Ultimate God's miasma in its inert form being capable of corrupting Rex and Ish
    and making the, forget each other. Was able to use his Duel Dragon without being
    possessed or having his soul shattered. The Ultimate God fused with Rex Goodwin
    was incapable of stealing the soul and power of him and his cards without defeating
    him in a duel, despite having taken them from every single duelist and deck. Superior
    to other duelists, who can live without their soul), Likely Resistance to Law
    Manipulation (Despite having gained complete power over natural laws, Ultimate
    God Goodwin could not kill him in any manner without a duel), likely Resistance
    to Fate Manipulation, Precognition, and possibly Probability Manipulation (Sect
    and Jack started that Turbo Duelists do not care about fate, the future, destiny,
    and grasp at infinite possibilities, allowing them to overturn the futures predicted
    by others and destiny itself) Limited Resistance to Power Nullification (Duel
    Dragons cannot be copied onto other cards), Resistance to Mind Manipulation (The
    Duel Dragons were capable of breaking free of Ultimaya Tzolkin's powers)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
