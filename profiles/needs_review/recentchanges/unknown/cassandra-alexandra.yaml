  axis: hax
  text: "Superhuman Physical Characteristics, Sword and Shield Mastery, Adept Hand\
    \ to Hand Combatant, Holy Manipulation via \u03A9 Sword, Statistics Amplification\
    \ via Soul Charge, Resistance to Corruption, Madness Manipulation (Type 2), Soul\
