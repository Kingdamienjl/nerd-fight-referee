        will never die permanently), Reality Warping, Space-Time Manipulation, Existence
        Erasure, Conceptual Manipulation (Type 1), Causality Manipulation, Law Manipulation,
        Power Nullification, Creation, Power Bestowal and Conceptual level Resurrection
