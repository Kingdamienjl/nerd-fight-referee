    - field: weaknesses
      value: "Her magical avatars are considerably weaker than herself. Notable Attacks/Techniques:\
        \ *Authority of Envy: While there are no concrete examples of Satella using\
        \ her Authority, it is most likely the true identity of her flawless immortality,\
        \ which could not be bypassed even by the combined might and wisdom of the\
        \ Sword Saint, the Divine Dragon, and the Great Sage, whom were forced to\
        \ seal her instead. *Time Manipulation: Whether by means of Yin Magic or Authority,\
        \ the Witch of Envy has the power to bring time to a halt. Within the world\
        \ of frozen time, Satella can do as she pleases with her immobile victims,\
        \ often employing her power to secretly punish Natsuki Subaru for violating\
        \ the taboo of Return by Death. *Witch's Miasma: The Evil Sealing Stone Shrine\
        \ where Satella is sealed is drenched in her miasma, which has rendered the\
        \ entire region an unnatural sea of sand where no life can thrive. Being exposed\
        \ to this miasma is detrimental to all living things\u2014 plants will wither,\
        \ food will spoil, souls will be corrupted, and people will die in insanity.\
        \ The majority of people will immediately go mad and then die within 30 seconds\
        \ of direct exposure to a Witch's miasma. *Shamak: The Witch of Envy is a\
        \ specialist in the Yin Magic spell Shamak, which has the special quality\
        \ of \"separation\". As an extraordinary practitioner, Satella can take Shamak\
        \ to its logical extreme: removing awareness from one's body, rending space\
        \ from space, and separat\xECng objects into pieces regardless of their strength.\
        \ When the Witch appears, the entire area is completely swallowed by pitch\
        \ blackness. The shadows dissolve and absorb everything they touch, blending\
        \ together everything and everyone into a single heterogeneous whole. With\
        \ Shamak, Satella kneads magic hands from her miasma, the number summoned\
        \ reaching 2000. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==\
