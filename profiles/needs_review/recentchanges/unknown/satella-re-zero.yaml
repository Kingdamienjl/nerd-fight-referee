    - field: weaknesses
      value: 'Each time Live Mindful of Death is used, the changes in realms that
        is caused by Alcor creates butterfly effects that are completely uncontrollable
        by him. Those with deep connection to Alcor with will gain Deja Vu of the
        previous loops, allowing them to predict what shall happen next in the new
        loop Notable Attacks/Techniques: Return By Death: An ability that is given
        to Alcor by Satella, the Witch of Envy. This ability allows Alcor to return
        to an uncontrollable past point of time upon his death. There is no lag between
        both of the time of death and the time of resurrection. According to Alcor,
        from his own perspective, it is similar to the feeling of someone or something
        switching camera angles inside his head. This ability was given to Alcor because
        of his desire to protect his loved 1s, but from Satella''s own view, she gave
        it to him in order to make him overcome the situations that resulted in his
        death. In addition, the ability does not have a limit to how much it is used,
        and there are penalties if Alcor had the slightest of thought to reveal it
        to anyone or speak it out loud. If he spoke it out, the Witch''s Hand would
        grip his heart and harm him, and at times, kills him. Also, should Alcor speaks
        out of it, and persists and ignores the previous penalty, Satella would direct
        the Witch''s Hand to those who heard about the ability and kill them. If someone
        managed to know the ability, Satella herself will appear to rectify it. Note
        that simply knowing that Alcor can rewind time around the world through means
        unknown will not trigger the penalities. In addition to this, every time Alcor
        uses Return By Death, or even speaks of it, the Witch''s Miasma, which attracts
        Mabeasts surrounds him, and increases the more he uses this ability. Echidna
        who has knowledge of Reinhard and Satella, stated Return by Death is the strongest
        technique. Live Mindful of Death: An additional sub ability of Return By Death.
        When it iss activated at the time of his death, Alcor will reset everything
        if it does not end how he wants it to end, even in realms where time is non-existent.
        During the reset he is capable of manipulating the next timeline however he
        desires. This reset is great enough to bring back the World itself after its
        destruction, and return people whose existence has been wiped out in their
        entirety, beyond any chance of recovery. Due to the repetitious nature of
        this, those with an intense connection to Alcor gain a sensation of Foreknowledge:
        a kind of Deja Vu, in truth limited awareness of previous iterations of the
        loop, allowing them to predict what is it that will happen next. This comes
        with various side-effects that he uses as attacks against those that he fights,
        albeit the butterfly effect that his changes produce is out of his control.
        Category:Morning Star TM Category:Tier 6 Category:Tier 1 Category:Unknown
        Tier'
