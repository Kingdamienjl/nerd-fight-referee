    text: Genius combatant (Comparable to the likes of Dan Heng and The Trailblazer
      in combat skills. March 7th was shown to be a competent bow user as well a very
      skilled fighter overall, as when she fought Cocolia and Phantylia, very dangerous
      and skilled enemies. March is a talented sword user, exhibiting remarkable skill
      despite having never touched a blade before. Under the guidance of Yunli and
      Yanqing, both renowned swordmasters, she rapidly developed her abilities. Within
      just a few weeks, March not only mastered the fundamentals but also created
      her own unique style of swordplay. Her swift progress and innovative approach
      allowed her to reach a level where she could duel with Yanqing, showcasing her
      exceptional aptitude and adaptability in the art of the sword) Extraordinary
      Genius (Evernight was able to overthrow everyone's plan pertaining to Amphoreus,
      such as Astral Express, Genius Society, Garden of Recollection, to the likes
      of Lygus. She accomplished this through convincing March 7th and merging into
      one with her albeit this cost March 7th's memories. Evernight then became a
      fully-fledged Emanator of both Remembrance and Enigmata that rivals Supergeniuses
      like Herta and Lygus, with Herta being powerless against Evernight which was
      shown in the Evernight vs Sunday fight and Lygus being forced to team up with
