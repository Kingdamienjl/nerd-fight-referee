- id: claim-weaknesses-a78bb3a9
  section: weaknesses
  axis: weakness
  text: 'Has a questionable mental state, suffering from paranoia and extreme anger,
    which led to him being easily manipulated by Lex Luthor. However, after Superman''s
    sacrifice, Bruce regained his optimism and sense of hope. ==Gallery== 1 - Past.png|"There
    was a time above... A time before... There were perfect things... Diamond absolutes.
    But things fall... The things on earth. And what falls... Is fallen." 3 - You
    let your family die.jpg|"Metropolis. Mankind is introduced to The Superman." 4
    - New Rules.jpg|"Oh, yes it has, sir. Everything''s changed. Men fall from the
    sky, the gods hurl thunderbolts, innocents die. That''s how it starts, sir. The
    fever, the rage, the feeling of powerlessness that turns good men... Cruel." 5
    - Dead Robin.jpg|"Twenty years in Gotham, Alfred; we''ve seen what promises are
    worth. How many good guys are left? How many stayed that way?" 5.5 - Women like
    You.JPG|"You don''t know me, but I''ve known a few women like you." 6 - Meeting.jpg|"Tell
    me... Do you bleed?" 7 - Knightmare.jpg|"That son of a b---- brought the war to
    us two years ago. Jesus, Alfred, count the dead... Thousands of people. What''s
    next? Millions? He has the power to wipe out the entire human race, and if we
    believe there''s even a one percent chance that he is our enemy we have to take
    it as an absolute certainty... And we have to destroy him." 10 - Hunters.jpg|"I''m
    older now than my father ever was. This may be the only thing I do that matters."
    - A broken Bruce, determined to kill Superman. 12 - Martha.jpg|"I bet your parents
    taught you that you mean something, that you''re here for a reason. My parents
    taught me a different lesson, dying in the gutter for no reason at all... They
    taught me the world only makes sense if you force it to." 13 - Changed Batman.png|I''ve
    failed him... in life. I won''t fail him in death..." - Superman'' sacrifice brought
    goodness to Batman once again. ==Notable Matchups== Victories: Hellboy (Hellboy
    Film Series) Hellboy''s Profile (9-A+ versions, Speed equalized) Losses: Master
    Chief (Halo) Master Chief''s Profile (9-A+ versions, Speed was equalized, Master
    Chief was allowed to use up to 8-C weaponry) Sub-Zero (Mortal Kombat) Sub-Zero''s
    Profile (9-A+ versions with speed equalized) Inconclusive: ==References== ==Notes/Explanations==
