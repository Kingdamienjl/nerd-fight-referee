- id: claim-standard-equipment-4a8a1432
  section: equipment
  axis: equipment
  text: '* Standard Batsuit: Highly durable Kevlar-titanium weave protective suit
    and combat armor, used to compensate for Batman''s lack of invulnerability. It
    is invulnerable to knives, and is also fireproof. The Batsuit''s cowl also digitally
    alters Batman''s voice, making it unrecognizable to those that know him as Bruce
    Wayne. The cowl and neck appear to be equally durable, as a criminal''s knife
    only made sparks when it was brutally struck against the back of his neck. * Armored
    Batsuit: A much more heavily armored and mechanized version of the Standard Batsuit,
    which he wore when confronting Superman. It is durable enough for Batman to survive
    relatively unscathed after being hurled through a building by the mighty alien,
    though Batman was still left heavily panting on the ground, and required a few
    seconds to recover. * Batmobile: An imposing and heavily armed custom combat vehicle
    used by Batman for transportation, pursuit and capture and one of his most powerful
    tools to aid in his war against crime in Gotham. * Batwing: An aerial combat prototype
    vehicle with an immense amount of firepower, used by Batman against Superman.
    It is sometimes remotely piloted by Alfred from within the Batcave. * Batarangs:
    Extremely sharp (capable of piercing concrete walls), but non-lethal throwing
    gadgets in the shape of Batman''s symbol, wielded by him when carrying out various
    different tasks, from incapacitating criminals to breaking through windows. *
    Grapple Gun: A line launching, multi-purpose, highly versatile, and handgun-like
    device that fires a retractable line which Batman utilizes to traverse Gotham
    City, escape danger and remain hidden from foes, all while allowing him to scale
    rappel, swing, catapult, or slingshot himself along structures or across gaps.
    It is able to raise its user up to several stories or slow their rate of descent.
    The line can pull great amounts of weight, as Batman can use it while wearing
    his Mechanized Armor. * Respirator Mask: A small mask than allows Batman to successfully
    breathe in locations with limited oxygen, such as when he was attacked by Firefly''s
    flamethrower. * Sticky Bombs: Small, custom-built hand-held explosives that can
    stick to surfaces before detonating. * Gas Grenades: Canister-type grenades that
    emit a great amount of smoke, augmenting Batman''s already amazing stealth, to
    the point that he was able to temporarily evade Superman himself while using one.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
