    - field: standard_equipment
      value: '* Standard Batsuit: Highly durable Kevlar-titanium weave protective
        suit and combat armor, used to compensate for Batman''s lack of invulnerability.
        It is invulnerable to knives, and is also fireproof. The Batsuit''s cowl also
        digitally alters Batman''s voice, making it unrecognizable to those that know
        him as Bruce Wayne. The cowl and neck appear to be equally durable, as a criminal''s
        knife only made sparks when it was brutally struck against the back of his
        neck. * Armored Batsuit: A much more heavily armored and mechanized version
        of the Standard Batsuit, which he wore when confronting Superman. It is durable
        enough for Batman to survive relatively unscathed after being hurled through
        a building by the mighty alien, though Batman was still left heavily panting
        on the ground, and required a few seconds to recover. * Batmobile: An imposing
        and heavily armed custom combat vehicle used by Batman for transportation,
        pursuit and capture and one of his most powerful tools to aid in his war against
        crime in Gotham. * Batwing: An aerial combat prototype vehicle with an immense
        amount of firepower, used by Batman against Superman. It is sometimes remotely
        piloted by Alfred from within the Batcave. * Batarangs: Extremely sharp (capable
        of piercing concrete walls), but non-lethal throwing gadgets in the shape
        of Batman''s symbol, wielded by him when carrying out various different tasks,
        from incapacitating criminals to breaking through windows. * Grapple Gun:
        A line launching, multi-purpose, highly versatile, and handgun-like device
        that fires a retractable line which Batman utilizes to traverse Gotham City,
        escape danger and remain hidden from foes, all while allowing him to scale
        rappel, swing, catapult, or slingshot himself along structures or across gaps.
        It is able to raise its user up to several stories or slow their rate of descent.
        The line can pull great amounts of weight, as Batman can use it while wearing
        his Mechanized Armor. * Respirator Mask: A small mask than allows Batman to
        successfully breathe in locations with limited oxygen, such as when he was
        attacked by Firefly''s flamethrower. * Sticky Bombs: Small, custom-built hand-held
        explosives that can stick to surfaces before detonating. * Gas Grenades: Canister-type
        grenades that emit a great amount of smoke, augmenting Batman''s already amazing
        stealth, to the point that he was able to temporarily evade Superman himself
        while using one.'
      source_id: vsbattles-batman-dc-extended-universe-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Genius (Extremely competent fighter with decades of experience as a Vigilante.
        Very Skilled Detective. Alongside Alfred, constructed many highly advanced
        gadgets and pieces of tech)
      source_id: vsbattles-batman-dc-extended-universe-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Has a questionable mental state, suffering from paranoia and extreme
        anger, which led to him being easily manipulated by Lex Luthor. However, after
        Superman''s sacrifice, Bruce regained his optimism and sense of hope. ==Gallery==
        1 - Past.png|"There was a time above... A time before... There were perfect
        things... Diamond absolutes. But things fall... The things on earth. And what
        falls... Is fallen." 3 - You let your family die.jpg|"Metropolis. Mankind
        is introduced to The Superman." 4 - New Rules.jpg|"Oh, yes it has, sir. Everything''s
        changed. Men fall from the sky, the gods hurl thunderbolts, innocents die.
        That''s how it starts, sir. The fever, the rage, the feeling of powerlessness
        that turns good men... Cruel." 5 - Dead Robin.jpg|"Twenty years in Gotham,
        Alfred; we''ve seen what promises are worth. How many good guys are left?
        How many stayed that way?" 5.5 - Women like You.JPG|"You don''t know me, but
        I''ve known a few women like you." 6 - Meeting.jpg|"Tell me... Do you bleed?"
        7 - Knightmare.jpg|"That son of a b---- brought the war to us two years ago.
        Jesus, Alfred, count the dead... Thousands of people. What''s next? Millions?
        He has the power to wipe out the entire human race, and if we believe there''s
        even a one percent chance that he is our enemy we have to take it as an absolute
        certainty... And we have to destroy him." 10 - Hunters.jpg|"I''m older now
        than my father ever was. This may be the only thing I do that matters." -
        A broken Bruce, determined to kill Superman. 12 - Martha.jpg|"I bet your parents
        taught you that you mean something, that you''re here for a reason. My parents
        taught me a different lesson, dying in the gutter for no reason at all...
        They taught me the world only makes sense if you force it to." 13 - Changed
        Batman.png|I''ve failed him... in life. I won''t fail him in death..." - Superman''
        sacrifice brought goodness to Batman once again. ==Notable Matchups== Victories:
