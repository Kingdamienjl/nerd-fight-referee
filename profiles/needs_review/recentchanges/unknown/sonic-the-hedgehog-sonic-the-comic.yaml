- id: claim-weaknesses-f2d3f439
  section: weaknesses
  axis: weakness
  text: "Sonic is very cocky and narcissistic, leading him to occasionally overestimate\
    \ himself and make brash moves in combat, or flat out rush in without a plan,\
    \ even though he is perfectly capable of strategy and planning. He is notably\
    \ vulnerable to power absorption, as when Robotnik hit him with a beam that absorbs\
    \ energy/powers, Sonic was reverted to his original, brown, quilly hedgehog state,\
    \ having completely lost his powers, including his super speed. | Rather simple-minded\
    \ and can be manipulated/tricked by others | While slightly more intelligent than\
    \ before, he is still somewhat simple-minded. Is very arrogant and sadistic, often\
    \ holding back to prolong his opponent\u2019s suffering. When a separate entity\
    \ from Sonic, Super Sonic will die if drained of all his Chaos Energy, though\
    \ this weakness is not present when he resides within Sonic."
  source_ids: *id003
  decisive: false
