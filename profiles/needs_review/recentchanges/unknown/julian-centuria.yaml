- id: claim-weaknesses-45d6888d
  section: weaknesses
  axis: weakness
  text: "Julian's number of lives is limited. While he can heal his internal organs\
    \ without using up a life, external organs such as eyes will become non-functional\
    \ if severely wounded, even after healing\u2014 as such, regenerating missing\
    \ limbs or blinded eyes requires him to die and resurrect. Julian's healing factor\
    \ can keep him alive in situations where he's badly injured and wants to die so\
    \ he can heal faster. His blessing only activates in seawater. Notable Attacks/Techniques:\
    \ *Hundred-Fold Strength: Julian's wish to the God of the Sea was proof that the\
    \ lives of his one-hundred fellow slaves weren't a waste. This manifested in the\
    \ Gift he received enhancing all of his \"human abilities\" by a hundred-fold:\
    \ granting the combined strength, speed, endurance, and reflexes of those hundred\
    \ slaves, transforming Julian into a superhuman. Julian also has all one-hundred\
    \ of their lives, allowing him to revive whenever he is killed at the cost of\
    \ one life. Losing a life does not cause the strength that life gave him to vanish\
    \ with it. *Blessing of the Sea: Julian has been blessed by Ocean. As a result,\
    \ the sea favors him and will no longer turn its fangs towards him: Sea currents\
    \ will bring him to safety, the creatures of the sea will not harm him, seafood\
    \ will purposefully be caught by him, he cannot drown, and seawater cannot harm\
    \ him. This blessing empowers Julian within the sea, strengthening his Gift by\
    \ an unbelievable degree, and he temporarily attains immortality and divinity.\
    \ ==Notable Matchups== Victories: *Levi Ackerman (Attack on Titan) Levi Ackerman's\
    \ Profile (Julian starts in Hundred-Fold Strength, SBA otherwise) Losses: Inconclusive:\
    \ ==References== ==Notes== Category:Protagonists Category:Centuria Category:Male\
    \ Characters Category:Manga Characters Category:Blessing Users Category:Fate Users\
    \ Category:Acrobats Category:Martial Artists Category:Immortals Category:Regeneration\
    \ Users Category:Enhanced Senses Users Category:Supernatural Willpower Users Category:Aura\
    \ Users Category:Organic Users Category:Explosion Users Category:Stealth Masters\
    \ Category:Purification Users Category:Statistics Amplification Users Category:Self-Sustenance\
    \ Users Category:Water Users Category:Animal Users Category:Holy Users Category:Adults\
    \ Category:Primary Protagonists Category:Characters"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
