    - field: weaknesses
      value: 'After his augmentation, Vilgax became very large, which hindered his
        ability to enter closed areas. This weakness is magnified by his aquatic form,
        which can only survive in very large bodies of water, seemingly made him lose
        access to many of his powers and limited to slowly sliding across the floor
        until he reverted back to his humanoid form. Also, the transformation between
        those forms consumes much of his energy and thus is impossible if he is weakened.
        Vilgax is both superstitious of and fears magic and mysticism. He is also
        terrified of Ma Vreedle, enough that he will leave the scene if she is present.
        He can even be terrified of Toepick''s face. Vilgax is vulnerable to electricity,
        such as that generated by a Gimlinopithecus. As demonstrated by Zs''Skayr
        and several members of his species, Vilgax is vulnerable to being converted
        into an Ectonurite. Vilgax is vulnerable to the cold virus. Vilgax is limited
        to how much heat he can resist, as he gained burn marks from his near-death
        experience with lava. Vilgax''s skin is vulnerable to electricity, such as
        the Omni-Enhanced energy that Fulmini create. Vilgax is vulnerable to having
        his dna stolen. Feats: * Alongside Kevin he removed The Omnitrix off Ben:z
        Hand * He killed and absorbed greatest Heroes of 10 planets including Galactic
        Enforcers * He defeated all of Ben''s aliens im original series * Killed Chromastone
