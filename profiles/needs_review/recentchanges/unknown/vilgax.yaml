- id: claim-powers-and-abilities-bcced370
  section: abilities
  axis: hax
  text: "Original Series\u25BE= *Superhuman Physical Characteristics *Large Size (Type\
    \ 0: 3.6576 meters) *Enhanced Senses (Enhanced Hearing: Could hear Ben\u2019s\
    \ sneeze from half a mile away) *Natural Weaponry (Sharp Claws) *Longevity *Acrobatics\
    \ (Shows superhuman mobility through building-to-building leaps and has reaction\
    \ speed sufficient to keep up with XLR8 in combat) *Transformation & Underwater\
    \ Breathing (Can change into a giant Squid-like form underwater) *Social Influencing\
    \ (Social Position, Reputation, & Leadership; He's the ruler of the Vilgaxia)\
    \ *Cyborgization (Has boost steroids implanted in his arms) **Statistics Amplification\
    \ and Rage Power (Can increase his physical strength and rage) *Ice Manipulation,\
    \ Fire Manipulation and Radiation Manipulation (Easily withstood Heatblast's attacks\
    \ and can survive in space with no need for oxygen) Alien Force/Ultimate Alien\
    \ \u25BE= *All previous abilities except Cyborgization. *Flight & Spaceflight\
    \ *Self-Sustenance (Type 1) *Forcefield Creation (With the Shield of Seagle) *Energy\
    \ Projection and Explosion Manipulation (With the Ruby Ray of Rouleau) *Homing\
    \ Attack (His eyes beams chase their targets) *Wind Breath (As shown here) *Electricity\
    \ Manipulation and Non-Physical Interaction (With his Gauntlet. Caught Big Chill\
    \ while he was intangible and shocked him) *Fire Manipulation, Attack Reflection\
    \ & Earth Manipulation (Can coat his Sword in fire and reflective crystals) *All\
    \ the abilities provided by the Ascalon (He's temporarily wielder Ascalon) *Ice\
    \ Manipulation & Absolute Zero (Kept on fighting while numerous parts of his body\
    \ were frozen) *Cosmic Radiations (Can freely fly and survive in the vacuum of\
    \ space) Omniverse\u25BE= After Ultimate Alien, Vilgax lost all of his gained\
    \ equipment and abilities *Superhuman Physical Characteristics *Enhanced Senses\
    \ *Acrobatics *Transformation *Energy Projection *Stealth Mastery (Capable of\
    \ hiding his existence from Professor Paradox, who knows all alternate timelines,\
    \ realities, and points in time.) *Existence Erasure, Deconstruction, Soul Destruction,\
    \ Time Manipulation & Spatial Manipulation (History [5-D] - Can ripple timestream\
    \ that can destroy infinitely branching space-time continuums along with their\
    \ individual history, including Anodite) **Information Manipulation (Type 2; Erased\
    \ all timelines, which includes Rex's Dimension where space, time, matter energy,\
    \ etc... are fundamental building blocks of reality, with Chronosapien Time Bomb)\
    \ Lucubra Vilgax\u25BE= *Likely all previous abilities *Energy Manipulation *Vibration\
    \ Manipulation (Here) *Light Manipulation & Fear Manipulation (Here) *Dimensional\
    \ Travel *Fire Manipulation (Here) Dagonax\u25BE= *All previous abilities and\
    \ All abilities of Dagon plus: *Energy Manipulation & Explosion Manipulation (Can\
    \ generate energy balls, Blast through a wall and knock out Kevin Levin and Gwen\
    \ Tennyson) *Flight (True Flight) (Can fly freely) Malgax\u25BE= *All his abilities\
    \ previous abilities *Technology Absorption *Technology Manipulation *All the\
    \ abilities of Malware via Malware Armor"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
