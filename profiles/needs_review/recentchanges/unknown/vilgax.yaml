  name: 420px ==Summary== Vilgax is an intergalactic alien warlord and conqueror,
    a Chimera Sui Generis who serves as Ben's archenemy, and the most recurring villain
    in the on-going franchise. He was introduced in And Then There Were 10, and has
    since appeared multiple times in all the series. Ben considers him as one of the
    most dangerous villains he has faced. Vilgax was the main antagonist of the first
    three series (Ben 10 Alien Force, and Ultimate Alien). ==Powers and Stats
