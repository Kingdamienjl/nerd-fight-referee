        \ to their advantage. Calorie Control: This mode grants the user free control\
        \ over their body's calories, letting them burn the energy into pure chakra.\
        \ The massive increase in power causes two butterfly wings to form on the\
        \ user made out of chakra. In this mode, the user can freely use many high-level\
        \ Akimichi Taijutsu techniques without putting too much strain on their bodies.\
        \ A side effect of this mode is weight loss, though it only poses a threat\
        \ to the user if the calorie control technique was forcefully activated via\
        \ special soldier pills. Chodan Bakugeki (Butterfly Bullet Bombing): Once\
        \ the Calorie Control technique is initiated, the user can perform this powerful\
        \ jutsu. After focusing all of the user's chakra into one of their arms, their\
        \ chakra level briefly increases a hundredfold, allowing them to deliver a\
        \ devastating punch with all of their body's strength."
