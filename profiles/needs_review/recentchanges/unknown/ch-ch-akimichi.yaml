    - field: weaknesses
      value: 'None notable Notable Attacks/Techniques: : This technique grants the
        user the ability to freely convert the calories they store in their bodies
        into chakra to be used in their unique fighting style which ranges from expanding
        parts of, or, their entire body. Akimichi who are less experienced with this
        technique make use of the Three Coloured Pills to initiate this process, however,
        these pills have the adverse effect of converting All the calories in the
        user''s body to chakra. Once perfected, however, the Akimichi no longer has
        need for the pills and can regulate how much of their body weight is converted
        at any given time. *: This is the trademark ability of the Akimichi clan.
        When performed, the Akimichi grows in size, proportionately increasing their
        weight and strength and thus making their physical attacks more powerful.
        Such a significant change in size places a great burden on the user''s body.
        As such, users typically are not seen maintaining the Expansion Jutsu for
        long periods of time, instead reverting back to their normal form after they''ve
        concluded their series of attacks. **: This is a "showy" taijutsu unique to
        members of the Akimichi clan. After growing in size with the Expansion Jutsu,
        the Akimichi tucks themselves into a ball and rolls towards a target. Due
        to their increased weight and the force of their rotation, most obstacles
        are pulverized upon contact. Users can take advantage of the surrounding environment
        to launch themselves into the air, increasing the damage when they fall back
        to the ground. The speed at which they spin has the added benefit of rendering
        most attacks ineffective against them. But the ball''s speed also makes it
        difficult to turn, forcing users to stop spinning entirely if they want to
        make significant changes in direction and thus leaving them vulnerable while
        they do. *: This is a more practical application of the Expansion Jutsu. Rather
        than increase the size of their entire body, the user increases the size of
        only specific body parts, typically the arms and legs. Because of the larger
        size, physical attacks made with the expanded limbs do greater damage than
        normal. The limbs'' growth is very fast, giving users a way of taking opponents
        by surprise. **Empty Crash: By utilising the Partial Expansion Jutsu, the
        user smashes the ground with their enlarged fist, causing debris to fly from
        the ground into the air. The user then jumps into the air and swings their
        enlarged fist into the debris, and sends them flying towards their target.
        *: This is a heightened version of the Akimichi clan''s Expansion Jutsu. It
        is essentially the same as the base version, though the user becomes significantly
        larger, on a scale comparable to a mountain. Because of their huge size, any
        physical attacks the user makes are by default extremely powerful and cover
        a wide area. Such a drastic increase in size places a great strain on the
        user''s body. *: The Butterfly Mode is a heightened transformation of the
        Akimichi clan. The user can enter this mode by converting the calories of
        their body into chakra. The chakra, when visible, is shaped into two large
        butterfly wings that can be compressed into smaller wings. The technique uses
        an enormous amount of chakra. In this form, the user''s combat ability is
        greatly enhanced; allowing the use of the clan''s high-level techniques such
        as Butterfly Bullet Bombing, and the ability to use the chakra wings to create
        gusts of chakra. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
