    - field: weaknesses
      value: "He used to be incompetent due to fear until he overcame it, calling\
        \ him fat will seriously anger him, pre-timeskip Chouji could only use calorie\
        \ control via soldier pills, and was damaged to near death as a result. Notable\
        \ Attacks/Techniques: Baika no Jutsu (Multi-Size Technique): A secret technique\
        \ passed down through the Akimichi clan that allows the user to increase the\
        \ size and mass of their body by converting calories into chakra. The user\
        \ can freely manipulate their size at will when using this technique and can\
        \ use it for extensive periods. One of the most common applications for the\
        \ Multi-Size Technique is to increase the size of the user's abdomen to make\
        \ their body round and ball-like. *Bubun Baika no Jutsu (Partial Multi-Size\
        \ Technique): This application of the expansion technique gives the user the\
        \ ability to increase the size of specific body parts. Increasing the mass\
        \ and weight of one's arm allows the user to strike targets with far more\
        \ powerful punches. The sudden expansion also improves the user's range of\
        \ attack as an effect. *Cho Baika no Jutsu (Super Multi-Size Technique): This\
        \ technique is the Baika no Jutsu (Multi-Size Technique) on a grand scale.\
        \ The user can increase the size of their body to that of a large building.\
        \ The power of physical attacks such and punches, kicks, and body slams are\
        \ multiplied greatly while the user is in this colossal state. Akimichi Clan\
        \ Taijutsu: Changing size through the use of the Multi-Size Technique allows\
        \ the user to perform various Taijutsu (physical attacks) techniques developed\
        \ specifically for the Akimichi clan's unique fighting style. The increased\
        \ mass compliments the user's techniques by providing more weight resulting\
        \ in higher raw power. *Nikudan Sensha (Human Bullet Tank): To use this technique,\
        \ the user must first perform the Multi-Size Technique to transform their\
        \ body into a round shape. The user will begin to spin rapidly, and they throw\
        \ the mass of their large body at the target like a giant cannonball. As the\
        \ user's body rolls, the added momentum generates a heavy attack. *Nikudan\
        \ Hari Sensha (Spiked Human Bullet Tank): Similar to the standard Nikudan\
        \ Sensha (Human Bullet Tank). Chouji will use chakra to transform and harden\
        \ his long hair into sharp spikes as he increases his mass and begins to spin\
        \ rapidly. His attack power is increased, as the solid spikes add a grinding\
        \ effect to the jutsu and can tear through rock. Ch\u014Dharite (Super Open\
        \ Hand Slap): After performing the Multi-Size Technique to increase their\
        \ size, the user will focus a large amount of chakra around their hands, causing\
        \ unique markings to manifest on their palms. Once the chakra becomes visible,\
        \ the user will attack with a downward strike using their weight and strength\
        \ to their advantage. Calorie Control: This mode grants the user free control\
        \ over their body's calories, letting them burn the energy into pure chakra.\
        \ The massive increase in power causes two butterfly wings to form on the\
        \ user made out of chakra. In this mode, the user can freely use many high-level\
        \ Akimichi Taijutsu techniques without putting too much strain on their bodies.\
        \ A side effect of this mode is weight loss, though it only poses a threat\
        \ to the user if the calorie control technique was forcefully activated via\
        \ special soldier pills. Chodan Bakugeki (Butterfly Bullet Bombing): Once\
        \ the Calorie Control technique is initiated, the user can perform this powerful\
        \ jutsu. After focusing all of the user's chakra into one of their arms, their\
        \ chakra level briefly increases a hundredfold, allowing them to deliver a\
        \ devastating punch with all of their body's strength."
      source_id: character-stats-profiles-ch-ch-akimichi-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
