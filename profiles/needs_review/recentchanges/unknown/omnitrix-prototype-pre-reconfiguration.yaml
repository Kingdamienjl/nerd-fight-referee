        \ allowed for the user to transform into a numerous variety of alien life-forms,\
        \ each with their own unique powers and abilities [along with their weaknesses]\
        \ and in a selection of alien DNA that is in groups of 10) ** Heatblast **\
        \ Wildmutt ** DIamondhead ** XLR8 ** Grey Matter ** Four Arms ** Stinfkly\
        \ ** RIpjaws ** Upgrade ** Ghostfreak ** Cannonbolt (Unlocks in S2) ** Wildvine\
        \ (Unlocks in S2) ** Blitzwolfer (Unlocks in S3) ** Snare-Oh (Unlocks in S3)\
        \ ** Frankenstrike (Unlocks in S3) ** Perk Upchuck (Unlocks in S3) ** Ditto\
        \ (Unlocks in S4) ** Eye Guy (Unlocks in S4) ** Way Big (Unlocks in S4) **\
        \ Eon (PossiblyNotes) ** Arctiguana (11 year old only) ** Feedback (11 year\
        \ old only) ** Other unknown 1,000,889 alien forms *Information Manipulation\
        \ (Type 2: Governs a code that makes up the entire universe in the \"Omniverse\"\
        . Can convert DNA, matter, etc. into data.) **Self-Destruction (SDM mode which\
        \ can be activated with codes, can set a countdown for self-destruction, if\
        \ it will charge up for days, it can destroy an entire universe) *Self-Biological\
        \ Manipulation & Superhuman Characteristics (Ben transforms into healthiest,\
        \ strongest, apex version of the specie he transforms into, relatively to\
        \ his age and gender) *Purification (Type 2 & 3; The Omnitrix regenerated\
        \ Ben\u2019s soul after it was corrupted by Ghostfreak, indicating that it\
        \ possesses a \u2018default state\u2019 for the user\u2019s essence. If the\
        \ soul becomes corrupted, the Omnitrix is capable of purifying and restoring\
        \ it to this default state. Could nullify the affects of Retalatior Armor's\
        \ Elecitricity & Paralysis Inducement effect also removed the ice on Heatblast.\
        \ The Omnitrix can also repair genetic mutations, damage and impiurities)\
        \ *Genetic Fusionism (Partial; The Omnitrix is an inseparable part of the\
        \ user's biology; it is fully bonded and cannot be removed by just cutting\
        \ it off) *Failsafes (Instinctive Action, Adaptation, Reactive Evolution,\
        \ Energy Projection, Ressurection, Body Puppetry & Power Bestowal;The Omnitrix\
        \ failsafe is an absolute automatic defense mechanism that activates instantly\
        \ with Irrelevant speed as it saved Ben and reacted to Annihilarrgh, whenever\
        \ the wielder is in mortal danger or when someone attempts to forcibly remove\
        \ the device. This system can operate in various ways, most notably by automatically\
        \ transforming Ben into the exact alien needed to survive a threat; even when\
        \ Ben chooses a different form or fails to activate the watch manually, the\
        \ Omnitrix overrides his choice to provide the perfect counter, such as choosing\
        \ Alien X to endure the universal explosion while Ben gambled, or automatically\
        \ picking Feedback to absorb lethal energy. Additionally, if Ben is somehow\
        \ killed while in an alien form, the Prototype Omnitrix circumvents death\
        \ by instantly transferring his consciousness and generating a fresh, unharmed\
        \ body for him to survive, as seen when Malware destroyed Feedback, Vilgax\
        \ shattered Chromastone to spawn Diamondhead, or Eon vaporized Way Big. The\
        \ failsafe also protects itself by emitting a powerful energy wave that knocks\
        \ back and attacks anyone trying to touch or steal the watch, and it can even\
