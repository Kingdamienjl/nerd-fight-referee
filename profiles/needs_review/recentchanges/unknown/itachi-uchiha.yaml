      \ running around and killing at least dozens of his clansmen.Itachi Shinden:\
      \ Book of Dark Night; Chapter 6 During the events of Part I, he was able to\
      \ use Tsukuyomi twice and Amaterasu once, in addition to a number of other techniques\
      \ such as a Shadow Clone, which cuts his chakra reserves in half, and Suiton\
      \ Jutsu.Naruto Chapter 142Naruto Chapter 147Naruto Chapter 148 Superhuman. His\
      \ stamina had certainly diminished greatly due to his terminal illness reaching\
      \ its peak, and his death drawing near.Naruto Chapter 389Naruto Chapter 393Naruto\
      \ Chapter 394Naruto Chapter 401 However, even in this state he has considerable\
      \ chakra and endurance. Even though it's still a very chakra taxing technique\
      \ to maintain, he's almost always got his Sharingan activated. Itachi is capable\
