      value: "Itachi suffers from a deadly disease. He must use his stronger Mangekyo\
        \ Sharingan abilities sparingly, and does not have an extremely high amount\
        \ of chakra like other high-level shinobi | None Notable Attacks/Techniques:\
        \ * Sharingan (Mirror Wheel Eye): The first of the Sharingan's powers is being\
        \ able to see the flow of chakra. The Sharingan itself gives color to chakra,\
        \ allowing the wielder to differentiate them. As the Sharingan evolves, this\
        \ ability extends to being able to track fast-moving objects before finally\
        \ giving some amount of predictive capabilities to the user, allowing them\
        \ to see the image of an attacker\u2019s next move from the slightest muscle\
        \ tension in their body. The Sharingan's third and most well-known ability\
        \ is that it grants the user the ability to memorize almost any technique\
        \ that he or she witnesses. The Sharingan's final commonly-used ability is\
        \ capable of inducing a unique brand of illusion that involves suggesting\
        \ actions and thoughts to the opponent through genjutsu cast by simple eye\
        \ contact between both parties. ** Sharingan Genjutsu: Simply the use of generic\
        \ genjutsu used by members of the Uchiha clan. By simply having their opponents\
        \ look into their eyes, the Uchiha can lock the user within a genjutsu of\
        \ their choosing. ** Izanami: A genjutsu which affects the target through\
        \ physical sensations shared between them and the user to perform the illusion.\
        \ Requires a few minutes of prep to set up and physical contact to initiate.\
        \ Works even if the opponent is blind/has cut off their eyesight. The caster\
        \ sets a scene or sequence and repeatedly plays it in the opponent's mind\
        \ until the opponent accepts their fate (or desired action as set by the caster),\
        \ upon which the victim is rid of the Izanami. Like its counterpart, Izanagi,\
        \ in exchange for the temporary ability that it grants the user, the Sharingan\
        \ with which Izanami is cast is rendered blind. * Mangeky\u014D Sharingan\
        \ (Kaleidoscope Copy Wheel Eye): An advanced form of the Sharingan that is\
        \ acquired through the trauma experienced from the death of the person closest\
        \ to the Sharingan user. Over time, the use of Mangeky\u014D Sharingan's techniques\
        \ deteriorates the user's eyesight to the point of blindness. Only by taking\
        \ and transplanting the Mangeky\u014D of another Uchiha clan member can the\
        \ vision be restored, a process that results in the creation of an Eternal\
        \ Mangeky\u014D Sharingan. Not only does this process permanently restore\
        \ one's eyesight, but it also gives the person even greater power. ** Tsukuyomi:\
        \ Itachi casts an illusion on an opponent where time moves faster, and he\
        \ can inflict mental torture on them. The uppermost limit of this Jutsu can\
        \ send the victim into 72 hours of suffering whereby a single second seemed\
        \ equivalent to a day. ** Amaterasu: Itachi summons black fire that moves\
        \ with his gaze. The flames are shown to be very resilient as they have survived\
        \ complete immersion in water. It is powerful enough to smother any normal\
        \ flames and is said to burn for seven days and nights. ** Susanoo: The third\
        \ power granted by the Mangeky\u014D Sharingan after awakening the abilities\
        \ in both eyes. It creates a gigantic, humanoid being that surrounds the user\
        \ (it can also surround nearby people to protect them, but using it this way\
        \ decreases Itachi's speed). Susanoo is formed through the materialization\
        \ of the user's chakra and as such differs in appearance as well as a color\
        \ between users. ** Sword of Totsuka: It is sheathed in the sake jar Itachi's\
        \ Susanoo carries; the blade is the liquid inside the gourd that is released\
        \ and shaped, rather than a conventional sword. It is an ethereal weapon,\
        \ with an enchanted blade capable of sealing anything it pierces. Those who\
        \ are stabbed by the sword are drawn into the jar and trapped in a genjutsu-like\
        \ \"world of drunken dreams\" for all eternity. ** Yata Mirror: A shield carried\
        \ by Itachi's Susanoo in its left hand. It is said to be endowed with all\
        \ nature transformations, and as such changes its characteristics depending\
        \ on those of the attack it receives, making the technique ineffective. **\
        \ Yasaka Magatama: Through the use of Susanoo, the user can create the Yasaka\
        \ Magatama from any of its hands, consisting of several magatamas bound together\
        \ through their respective centers by a thread of chakra. Due to this structure,\
        \ the tools then act similarly to that of a shuriken when thrown by Susanoo\
        \ \u2014 rapidly spinning towards the intended target \u2014 and result in\
        \ a powerful collision upon impact. * Katon (Fire Release): One of the fundamental\
        \ elemental nature transformations. It is performed by molding a superheated\
        \ chakra inside the stomach before releasing it via the lungs and mouth. There\
        \ are also variants to this in the form of some mediums such as the use of\
        \ gunpowder, explosive tags, and chakra flow into a weapon. ** Great Fireball:\
        \ A technique where chakra kneaded inside the body is converted into fire,\
        \ and expelled from the mouth either as a massive orb of roaring flame or\
        \ as a continuous flame"
