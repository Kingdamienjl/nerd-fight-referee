        \ Sharingan. This process restores their vision and offers them even greater\
        \ power. **Tsukuyomi: Itachi casts an illusion on an opponent where he drags\
        \ his opponents mind to a dreamscape where he has complete control over all\
        \ aspects of the illusion, and"
