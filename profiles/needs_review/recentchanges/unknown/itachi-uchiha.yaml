      \ Shinden: Book of Bright Light; Chapter 3, Page 120 Itachi also has a very\
      \ high tolerance towards pain, not even flinching when he was stabbed in his\
      \ stomach.Itachi Shinden: Book of Dark Night; Chapter 5, Page 68 During the\
      \ Uchiha massacre, when he was only 13, he could use his Mangeky\u014D Sharingan\
