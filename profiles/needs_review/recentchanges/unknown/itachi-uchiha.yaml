  text: "The Sharingan's ability to copy Ninjutsu, Genjutsu, and Taijutsu is limited\
    \ by the user's physical condition,Rin no Sho, pages 192-193 that is to say, that\
    \ the user needs to be physically capable of performing the technique they are\
    \ trying to replicate. They need to meet any physical or chakra amount prerequisites\
    \ the technique in question may have. This ability is also incapable of replicating\
    \ Kekkei Genkai, due to either not possessing the genetic predisposition and/or\
    \ having the necessary chakra natures. Naturally, the user must be able to see\
    \ the technique they are copying; they cannot replicate what they cannot see.\
    \ The same can be said for essentially all of the Sharingan's abilities; they\
    \ are sight-based abilities, so if the opponent can obscure the user's vision\
    \ using extremely thick mist/dustNaruto Chapter 26 or blind them, the Sharingan's\
    \ abilities will be rendered ineffective. Likewise, suppose the opponent is too\
    \ fast for the Sharingan to track them. In that case, they will be safe from its\
    \ abilities. Sharingan Genjutsu requires eye contact, so if the opponent can avoid\
    \ eye contact or is blind, they will avert Sharingan Genjutsu entirely. Finally,\
    \ the Sharingan's predictive capabilities may partially be circumvented by fast\
    \ attacks with little or no pattern, such as Naruto's chakra armsNaruto Chapter\
    \ 231 that emerge from any part of his body and attack instinctively. The Izanami\
    \ was deemed to be incredibly dangerous to be used in combat, such that it was\
    \ forbidden, due to the inherent escape route designed with the technique. If\
    \ one stops trying to escape the original outcome and attempting change their\
    \ fate, they can break out of the loop.Naruto Chapter 586Naruto Chapter 587 The\
    \ Mangeky\u014D Sharingan offers far more power than the regular Shairngan, but\
    \ that power comes at a cost. More powerful techniques entail a far higher chakra\
    \ cost, making Mangeky\u014D Sharingan Jutsu extremely taxing to use and maintain.\
    \ Additionally, the Mangeky\u014D Sharingan also causes great strain on the user's\
    \ vision, eventually resulting in complete blindness with continuous use. Use\
    \ of the Izanagi and Izanami also causes permanent blindness in the eyes they\
    \ are cast from.Naruto Chapter 586Naruto Chapter 587 The Susano'o causes its users\
    \ immense pain \"in every cell in their body\". Kotoamatsukami can only be used\
    \ once each ten years, per eye, unless the user possesses Hashirama Senju's cells.\
    \ Same as before. Itachi also suffers from a terminal illness that significantly\
    \ weakens him and causes constant pain over time. It also diminishes his chakra\
    \ reserves and stamina.Naruto Chapter 389Naruto Chapter 393Naruto Chapter 394Naruto\
    \ Chapter 401 Same as his Part I self. As a reanimated corpse, he might not be\
    \ as strong as when he was alive, but Edo Tensei ridding him of his illness somewhat\
    \ counterbalances that. Despite the Immortality offered by Edo Tensei, he can\
    \ still be sealed away, and is vulnerable to attacks that directly target his\
    \ soul. Notable Attacks/Techniques: Hide/Show *Sharingan (Mirror Wheel Eye): The\
    \ first of the Sharingan's powers is being able to see the flow of chakra. The\
    \ Sharingan itself gives color to chakra, allowing the wielder to differentiate\
    \ them. As the Sharingan evolves, this ability extends to track fast-moving objects\
    \ before finally giving some predictive capabilities to the user, allowing them\
    \ to see the image of an attacker\u2019s next move from the slightest muscle tension\
    \ in their body. Sharingan's third and most well-known power grants the user the\
    \ ability to memorize almost any technique they witness. **Sharingan Genjutsu:\
    \ The Uchiha clan's generic illusionary art. The Uchiha can lock their opponents\
    \ into their chosen illusion by looking into their eyes. **Izanami: A genjutsu\
    \ that affects the target through physical sensations shared between them and\
    \ the user to perform the illusion. It requires a few minutes of prep to set up\
    \ and physical contact to initiate. Works even if the opponent is blind/has cut\
    \ off their eyesight. The caster creates a scenario or sequence beforehand. After\
    \ the technique's activation, the victims undergo an infinite time loop scenario\
    \ in their minds until they meet the conditions set by the caster. Like its counterpart,\
    \ Izanagi, in exchange for the temporary ability it grants the user, the Sharingan\
    \ with which Izanami is cast is rendered blind. *Mangeky\u014D Sharingan (Kaleidoscope\
    \ Copy Wheel Eye): An advanced form of Sharingan acquired from witnessing the\
    \ death of the loved ones. Despite the tremendous strength, Mangeky\u014D Sharingan\
    \ eventually blinds its user, which is accelerated by using the Mangeky\u014D\
    \ techniques. Their eyesight can only be restored by transplanting another Uchiha\
    \ clan member's Mangeky\u014D, creating an Eternal Mangeky\u014D Sharingan. This\
    \ process restores their vision and offers them even greater power. **Tsukuyomi:\
    \ Itachi casts an illusion on an opponent where he drags his opponents mind to\
    \ a dreamscape where he has complete control over all aspects of the illusion,\
    \ and"
