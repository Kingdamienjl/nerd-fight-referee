- id: claim-weaknesses-51a7eec3
  section: weaknesses
  axis: weakness
  text: Arrogant, stubborn and prone to fits of rage when angered. To some degree
    severely lacks knowledge of the outside world due to several years of isolation
    with the other Daughters of Aku, to the point where they didn't understand the
    meaning of two animals loving each other. Was taught not to assist her sisters
    in combat and to dismiss their deaths as their failure. However of episode XCVII,
    those weaknesses seem to no longer apply. Due to sharing Aku's DNA inside of her,
    Aku is able to mind control Ashi and force her body to do things against her will.
    Albeit she can resist Aku's control with extremely large difficulty.
  source_ids: *id003
  decisive: false
