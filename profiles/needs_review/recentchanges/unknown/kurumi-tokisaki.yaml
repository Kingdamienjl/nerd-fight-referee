- id: claim-powers-and-abilities-beb323f6
  section: abilities
  axis: hax
  text: "* Incorporeality & possibly Abstract Existence (Type 1; As explained by Sawa,\
    \ they\u2019re basically just heart, mind, and memories that have lost their physical\
    \ information. They don\u2019t have a physical body at all and exist purely as\
    \ souls, so everything they feel is experienced directly by the soul itself. The\
    \ Neighboring World is basically an afterlife where only souls without physical\
    \ bodies exist. Even if they appear alive again, it means they\u2019ve been separated\
    \ from their physical body at least once. For Quasi-Spirits, death isn\u2019t\
    \ real death. Since they don\u2019t have physical bodies, \u201Cdying\u201D just\
    \ means going back to the other side or getting reset as an empty shell, and there\u2019\
    s always another chance to exist again. Death basically refers to the death of\
    \ the soul itself, making physical death irrelevant to them. The soul is even\
    \ stated to be the abstract concept that defines a human.) *Inorganic Physiology\
    \ (Type 1; the \u201Cphysical\u201D bodies of Quasi-Spirits, aren\u2019t made\
    \ of flesh and blood, but of Reiryoku, which forms all types of matter. Reiryoku\
    \ builds their bodies using the information contained in the Sephira) * Self-Biological\
    \ Manipulation (Molecular) Matter Manipulation (Atoms/Molecules) and Regeneration\
    \ (Low-Godly; They can actively create a body from a bodiless soul by using Reiryoku\
    \ to assemble chemical elements.) * Flight (They can fly.) * Supranatural Willpower,\
    \ Subjective Reality & Invisibility (Dream is a form of willpower that affects\
    \ how they fight and survive. It\u2019s seen as the purpose of their consciousness.\
    \ Since they don\u2019t have physical bodies, they\u2019re kinda like ghosts.\
    \ Simply put, dream is \u201Chope\u201D, it lets them bring anything they want\
    \ into reality as long as they keep believing in it. They survive by consuming\
    \ dream, and through it, they can create physiological traits that would normally\
    \ be impossible just by hoping. No matter how much blood they lose, what kind\
    \ of deadly poison they inhale, or even if they try to disappear or die, their\
    \ Spirit body will automatically keep them alive, even against their own will.)\
    \ * Subjective Reality, Limited Creation, Construction & Cloth Manipulation (Reiryokuken\
    \ is basically a boundary they create and develop themselves, inside it, they\u2019\
    re pretty much omnipotent. They can create all kinds of things based on their\
    \ Reiryoku capacity and imagination, though their physiological limits can still\
    \ hold them back. Even so, there\u2019s a condition for this kind of construction:\
    \ they can only reproduce objects that don\u2019t feel out of place in the surrounding\
    \ environment. For example, Kurumi can create whatever food she wants, but this\
    \ only works in places like a \u201Ccaf\xE9\u201D or similar settings. As long\
    \ as they have enough Reiryoku, they can create all kinds of materials, generate\
    \ whatever sensations they want, and even make clothes. On top of that, they can\
    \ reconstruct empty space into a livable place by adding color and furniture.)\
    \ * Invisibility Negation (Reiryoku can be spread out to cancel out invisibility\
