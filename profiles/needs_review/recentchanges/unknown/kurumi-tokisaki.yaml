  text: "Hide/Show center480px *Angel: Zafkiel (\u523B\u3005\u5E1D (\u30B6\u30D5\u30AD\
    \u30A8\u30EB), Kokkoku Tei, lit., \"Emperor of Time\") *Weapon: Clock, Flintlock\
    \ Pistol, Musket * Notable Attacks/Techniques: Kurumi mainly can manipulate time,\
    \ but her main power is associated with controlling shadows. Shadow is her primary\
    \ element while Time is her secondary element in terms of usage. Combined with\
    \ the power of the 8th bullet, she can create a clone that has all of her experiences,\
    \ memories, abilities, etc. These clones can take the form of long white hands\
    \ with red outlining when they are in Kurumi's shadows. However, as these are\
    \ her past selves, they sometimes may contain feelings which the current Kurumi\
    \ no longer possesses and as such, Kurumi will not hesitate to kill these clones\
    \ if they choose to disobey her. *City of Devouring Time: Uses a red barrier to\
    \ trap and consume other people's life forces to refill her own. This ability\
    \ not only consumes the life force of the opponents but restores her own power.\
    \ She used this ability to send thousands of people into a comatose state in an\
    \ instant. Kurumi devoring Time 1.jpg Kurumi Time Devoring 2.gif *Spacequakes:\
    \ These occur when Spirits from the alternate dimension occasionally appear in\
    \ the human world, bending the wall between dimensions and resulting in large-scale\
    \ explosions. All Kurumis can summon and dismiss these at will. *Clones: Kurumi\
    \ can create at least hundreds of clones which have her physical abilities, if\
    \ several are destroyed, she can create other Kurumi Clones.gif *Hands of Darkness:\
    \ Kurumi immobilize the opponent by creating white hands behind him and block\
    \ it, she can use this move for absorbing people in her dark dimension Kurumi\
    \ shadow hands 2.gif :With Zafkiel (only the real Kurumi can use these): ::To\
    \ activate any power she needs, she first needs to call her Angel (regardless\
    \ of whether or not the Angel has been summoned already), and position her flintlock\
    \ at the number of the bullet on the Angel. Next, she needs to shoot the bullet\
    \ at the target with the gun. If she needs to use the power on herself, then she\
    \ is required to shoot herself. ::Bullets and Effects: *First Bullet: Aleph [\u4E00\
    \u306E\u5F3E\uFF08\u30A2\u30EC\u30D5\uFF09] (Accelerates time on target object\
    \ or subject) Activated by pointing at 1 o'clock time on the clock. *Second Bullet:\
    \ Bet [\u4E8C\u306E\u5F3E\uFF08\u30D9\u30FC\u30C8\uFF09] (Slows down time on a\
    \ target object or subject) Activated by pointing at the 2 o'clock time on the\
    \ clock. *Third Bullet: Gimel [\u4E09\u306E\u5F3E (\u30AE\u30E1\u30EB) ] (Causes\
    \ a target object or subject to age) Activated by pointing at the 3 o'clock time\
    \ on the clock. *Fourth Bullet: Dalet [\u56DB\u306E\u5F3E\uFF08\u30C0\u30EC\u30C3\
    \u30C8\uFF09] (Rewinds time on a target object or subject) Activated by pointing\
    \ at the 4 o'clock time on the clock. Kurumi time healing.gif *Fifth Bullet: Hei\
    \ [\u4E94\u306E\u5F3E (\u30D8\u30A4) ] (Allows Kurumi to see a glimpse of the\
    \ future) Activated by pointing at the 5 o'clock time on the clock. *Sixth Bullet:\
    \ Vav [\u516D\u306E\u5F3E (\u30F4\u30A1\u30F4) ] (Sends the consciousness of its\
    \ target into the body of a past version of themselves. However, unlike the Twelfth\
    \ Bullet, the user is only able to travel back to a few days at maximum regardless\
    \ of how much time is used. Due to the result of her fight against Kotori, this\
    \ bullet was left unusable for Kurumi until the events of Volume 16) Activated\
    \ by pointing at the 6 o'clock time on the clock. *Seventh Bullet: Zayin [\u4E03\
    \u306E\u5F3E\uFF08\u30B6\u30A4\u30F3\uFF09] (Temporarily freezes time on a target\
    \ object or subject) Activated by pointing at the 7 o'clock time on the clock.\
    \ Kurumi TS.gif 5y7qak by water frez d9p8bj3 by nathanthemanthemhfan-dajd727.gif\
    \ *Eight Bullet: Het [\u516B\u306E\u5F3E\uFF08\u3078\u30C3\u30C8\uFF09] (Creates\
    \ a clone of a target object or subject) Activated by pointing at the 8 o'clock\
    \ time on the clock. 2djmqh.gif *Ninth Bullet: Tet [\u4E5D\u306E\u5F3E\uFF08\u30C6\
    \u30C3\u30C8\uFF09] (allows Kurumi to share her sense with someone from different\
    \ time dimension) Activated by pointing at the 9 o'clock time on the clock. *Tenth\
    \ Bullet: Yud [\u5341\u306E\u5F3E\uFF08\u30E6\u30C3\u30C9\uFF09] (Peeks into the\
    \ past of a target object or subject) Activated by pointing at the 10 o'clock\
    \ time on the clock. Kurumi know the past.gif * Eleventh Bullet: Yud Aleph [\u5341\
    \u4E00\u306E\u5F3E (\u30E6\u30C3\u30C9\u30FB\u30A2\u30EC\u30D5\uFF09] (Allows\
    \ Kurumi to directly devour a Spirit's power) Activated by pointing at the 11\
    \ o'clock time on the clock. * Twelfth Bullet: Yud Bet [\u5341\u4E8C\u306E\u5F3E\
    \uFF08\u30E6\u30C3\u30C9\u30FB\u30D9\u30FC\u30C8\uFF09] (Travels through time\
    \ at the cost of a Spirit's power) Activated by pointing at the 12 o'clock time\
    \ on the clock. center|480px *Information Manipulation: After Nia had a part of\
    \ her Qlipha Crystal extracted from her body, she still has the ability to summon\
    \ Rasiel, Kurumi with the Sephira of Nia is able to use the same abilities as\
    \ she demonstrated in the Volume 19. However, she notes that its ability to give\
    \ information has gotten weaker, with some information coming out as indecipherable.\
    \ She also notes that she has lost the power to control the future."
