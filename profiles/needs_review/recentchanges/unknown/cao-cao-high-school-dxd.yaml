- id: claim-standard-equipment-22670dba
  section: equipment
  axis: equipment
  text: '*Holy Spear of the Setting SunTRUE LONGINUS: Cao Cao''s Sacred Gear and one
    of the Holy Relics. It is one of the eighteen Longinus, special Sacred Gears created
    by the God of the Bible that hold enough power to kill gods. Known as the Spear
    of Destiny, it is the original Longinus and the spear that pierced through Jesus
    Christ and contains his blood.Light Novel Volume 9, Life 3 It takes the form of
    a spear that can extend and retract according to his will and defend him from
    attacks, as well as create blasts of light and an energy blade. As it is one of
    the Holy Relics, it can take away the sanity of those that believe in God if they
    stare at it. *Optional'
  source_ids: *id003
  decisive: false
