      value: Large Country Level (Far stronger than the traveller. Who fought and
        defeated Och-Kan fused with Cocouik, who could do this) Moon level (left Teyvat
        because he saw no one of interest, thus meaning no one in teyvat could challenge
        him. This includes the Heavenly Principles, who obliderated two of teyvats
        moons. Even if you dont consider him>Heavenly principles, he should still
        be on this tier, as all of the 5 sinners are meant to paralell in power and
        authority with the shades and the heavenly principles.) Planet level (each
        of the 5 sinners posses world shattering power) Large Planet level (stated
        to be many times stronger than an entire world) Star Level (Travelled the
        sea of stars with skirk, which is implied to be the imaginary tree. This means
        Surtalogi would have to have travelled through imaginary space, which only
