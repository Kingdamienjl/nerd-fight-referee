  intelligence:
    text: 'Extraordinary Genius (Asmoday designed and constructed the Temple of SpaceLuna
      5 Special Program (Segment-Domain Tau),World Quest, A Long Day in the Mountains,
      Prologue: The Wind Has Ceased an immensely sophisticated extradimensional realm
      that functions as a self-sustaining archive preserving the history of countless
      fallen civilizations and memories;World Quest, A Long Day in the Mountains,
      Act I: Paradise such as Hyperborea, Remuria, Lang-Gan, Ochkanatlan, Delphi Pytho/Enkanomiya
