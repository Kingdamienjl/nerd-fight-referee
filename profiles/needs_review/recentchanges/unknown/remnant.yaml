  text: Remnant is weak to fire, and enough heat can nullify its effects. Healing
    requires taking Remnant from outside sources. Should a haunted entity attempt
    to absorb or interact with a soul more powerful than their own, the stronger spirit
    can overpower the former and suppress them, gaining total control over their vessel
    in the process. Haunted animatronics are entirely bound by their programming.
    All Low
