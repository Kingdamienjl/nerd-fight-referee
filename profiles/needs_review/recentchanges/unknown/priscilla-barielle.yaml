    - field: standard_equipment
      value: 'Three Jeweled Necklace: Jewelry gifted by a former husband that Priscilla
        wears which she can transfer any fatal damage done to her to it, subsequently
        breaking one of its gems. This means it can only absorb up to three attacks
        before its protection wears off., Yang Sword Vollachia: Priscilla can summon
        this ornate crimson sword from light that can shine like the sun if she wishes
        it to. It has a terrible mana consumption rate, so she has it dissipate back
        into light when she''s not using it. Her burning blade can conveniently choose
        what to strike and burn, only harming what she wishes to harm. The blade provides
        protection that even intimidates someone as strong as the 3rd Ranking Divine
        General of Vollachia.'
      source_id: mediawiki-496393
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted (Priscilla was the widow of Leip Barielle, whose lands were on
        the border shared with the Empire of Vollachia, with which the Kingdom had
        engaged in skirmishes for many years. With her cunning, which almost seemed
        like magic, Priscilla had managed to make the most of this unfavorable situation,
        bringing the faltering and anxious regional power holders onto her side all
        at once, pacified the empire, and proceeded to vigorously revitalize impoverished
        villages and otherwise strengthen her landsVolume 16, Chapter 2. Was considered
        by Vincent and Lamia, both of whom are master strategists, to be their biggest
        rival in terms of ambition and aptitude, for the throne of Vollachia. Priscilla
        is a user of the Soul Marriage technique, a secret art which requires a talent
        so rare that it has no historical inheritors, and also requires a miraculous
        sense of balance to put it into practiceArc 8, Chapter 9)
      source_id: mediawiki-496393
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Her Yang Sword consumes a lot of mana, Divine Protection of the Sun:
        Makes Priscilla stronger during the day and boosts the effects of buffs.,
        Extraordinary Luck: Priscilla has unique luck, which she mentions makes "the
        world in her own favor", granting her extremely high luck in her daily life
        and in fights. She also has great intuition, which allowed to guess the right
        and safest path towards the lost Schult during their stay in Priestella. She
        claims that it doesn''t matter what choice she makes, since she''ll always
        be right, Soul Marriage: a long-lost secret technique of the old world that
        has been forgotten by most people. By dividing her own Od and bestowing it
        onto someone of her choosing, Priscilla imbues them with power more or less
        reflective of her own, and she greatly boosts their healing capabilities to
        the point someone acting under her Soul Marriage can receive multiple fatal
        wounds and be healed completely in a few short moments. However, in order
        for Soul Marriage to work, Priscilla must not only love the receiver of this
        ability, but she must also be loved by that person in return. If this condition
        isn''t met, Soul Marriage will not work. During the Flying Dragon Cataclysm
        in Guaral, Priscilla used this ability to protect Schult from being harmed
        by ensuring that he''d be healed against any attack towards him. Additionally,
        she can use Soul Marriage on objects gifted to her with love, allowing her
        to transfer fatal blows into things like the jewellery she wears., Sun Disk:
        Allows her to remain uncontrolled by Sirius during the battle against Wrath.
        In addition to that, the ability was also capable of protecting other people,
        like Liliana Masquerade, for example. It is unknown whether this is the power
        of being a powerful Yang Magic user, or another source of power., Beloved
        Articles: As a user of Soul Marriage, Akame (Akame ga Kill!) Akame''s Profile
        (Both were 7-A. Speed was equalized), Makima (Chainsaw Man) Makima''s Profile
        (Battle took place in Tokyo. Speed was Equalized)'
      source_id: mediawiki-496393
      provider_id: vsbattles
      authority: high
      confidence: 0.75
