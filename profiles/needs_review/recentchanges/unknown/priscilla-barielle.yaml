    \ Subaru were telling the truthVolume 4, Chapter 3 about being from beyond The\
    \ Great Waterfalls. Knights can sense hostilityVolume 9, Chapter 2. Recognized\
    \ Yorna as her motherArc 7, Chapter 78, despite her having a completely difference\
