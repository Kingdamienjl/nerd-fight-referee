    \ (Priscilla's swordsmanship is on the level of experts such as CruschVolume 18,\
    \ Chapter 4) *Temperature Manipulation & Pain Manipulation (Her flames are 7 times\
    \ hotter than normal fire, only burning those Priscilla chooses to, but still\
