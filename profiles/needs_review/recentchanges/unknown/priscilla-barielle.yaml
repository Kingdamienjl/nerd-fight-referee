- id: claim-standard-equipment-1c156adc
  section: equipment
  axis: equipment
  text: '*Three Jeweled Necklace: Jewelry gifted by a former husband that Priscilla
    wears which she can transfer any fatal damage done to her to it, subsequently
    breaking one of its gems. This means it can only absorb up to three attacks before
    its protection wears off. *Yang Sword Vollachia: Priscilla can summon this ornate
    crimson sword from light that can shine like the sun if she wishes it to. It has
    a terrible mana consumption rate, so she has it dissipate back into light when
    she''s not using it. Her burning blade can conveniently choose what to strike
    and burn, only harming what she wishes to harm. The blade provides protection
    that even intimidates someone as strong as the 3rd Ranking Divine General of Vollachia.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
