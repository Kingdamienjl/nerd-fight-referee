    \ Anything\", it is through magic that spirits fight each other to the death and\
    \ destroy the Od. The Od is the \u201Cpure property itself that made a human,\
    \ human\u201D, being synonymous with the individual's soul and defining their\
    \ existence. It encompasses the individual's Memories, elemental character, destiny,\
    \ and life force, with the body's form itself conforming to the Od, such that\
    \ altering the Od alters both the body and mind. Od contains the Name and Memories.\
