- id: claim-powers-and-abilities-99822f0f
  section: abilities
  axis: hax
  text: 'Due to being one of the weaker characters during the early parts of the story,
    Dowan heavily relied on his Active and Passive skills to be able to deal any significant
    amount of damage. *Limited Mana: Active Skills require mana, a resource Dowan
    only possesses a limited amount of. Once his mana runs out Dowan can no longer
    use his Active Skills. *Limited HP: If Dowan''s HP reaches zero, the system will
    automatically paralyze his''s body and render him unconscious to prevent Dowan
    form continuing to fight and put his life at risk. Notable Attacks/Techniques:
    Active Skills: *Multi-Strike Destruction: This technique involves using multiple
    strikes from the fist to inflict damage. Reality Quest Manhwa Chapter 1 *The Falcon
    Drop: strong jump to the head that knocks down the opponent. Reality Quest Manhwa
    Chapter 8 *Blind Spot Strike: strikes the enemy''s blind spot with fast speed.
    *Stun Smash: a technique that fiercely strikes down the opponent. Passive Skills:
    *Critical hit: When attacking, there is a 1% chance to inflict a critical hit
    while ignoring the defensive stats. *Weapon Mastery: the weapon-wielding ability
    is increased slightly (the effect only applies when fighting a weapon-wielding
    enemy). Items: *Bronze'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
