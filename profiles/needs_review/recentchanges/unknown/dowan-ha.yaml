    - field: intelligence
      value: 'At least Above Average, Gifted in combat (Capable fighter with the ability
        to use improvised equipment and the surroundings to his advantage at the drop
        of a hat) Standard Tactics: *Using Active Skills: In fights, Dowan would try
        to quickly KO his opponents by overwhelming them with his Active Skills. *Using
        Environment: Dowan is a gifted fighter who uses the environment around him
        to his advantage all the time, even being able to use an octopus and buttons
        to call lifts be able to give him an edge in battle. *Leveling Up in Battle:
        Dowan saves the Bronze Keys he receives from finishing his quests so he can
        use them to level up stats in the middle of battle. For example: increasing
        his speed in the middle of a fight against an opponent faster than him to
        be able to keep up. Using Bronze Keys to increase the HP stat also recovers
        Dowan''s stamina. *100 Hit Strategy: If Dowan runs out of mana or the active
        skills aren''t strong enough, he would resort to landing 100 low-powered hits
        hoping for one of them to be a Critical Hit which negates durability. *Preparation:
        If he had time to prepare for the fight, Dowan would show up with an appropriate
        weapon to use his Weapon Mastery skill to its maximum potential.'
      source_id: vsbattles-dowan-ha-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: '*Heavy reliance on'
      source_id: vsbattles-dowan-ha-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: 'Due to being one of the weaker characters during the early parts of
        the story, Dowan heavily relied on his Active and Passive skills to be able
        to deal any significant amount of damage. *Limited Mana: Active Skills require
        mana, a resource Dowan only possesses a limited amount of. Once his mana runs
        out Dowan can no longer use his Active Skills. *Limited HP: If Dowan''s HP
        reaches zero, the system will automatically paralyze his''s body and render
        him unconscious to prevent Dowan form continuing to fight and put his life
        at risk. Notable Attacks/Techniques: Active Skills: *Multi-Strike Destruction:
        This technique involves using multiple strikes from the fist to inflict damage.
        Reality Quest Manhwa Chapter 1 *The Falcon Drop: strong jump to the head that
        knocks down the opponent. Reality Quest Manhwa Chapter 8 *Blind Spot Strike:
        strikes the enemy''s blind spot with fast speed. *Stun Smash: a technique
        that fiercely strikes down the opponent. Passive Skills: *Critical hit: When
        attacking, there is a 1% chance to inflict a critical hit while ignoring the
        defensive stats. *Weapon Mastery: the weapon-wielding ability is increased
        slightly (the effect only applies when fighting a weapon-wielding enemy).
        Items: *Bronze'
      source_id: vsbattles-dowan-ha-unknown
      provider_id: vsbattles
      authority: high
