  intelligence:
    text: 'At least Above Average, Gifted in combat (Capable fighter with the ability
      to use improvised equipment and the surroundings to his advantage at the drop
      of a hat) Standard Tactics: *Using Active Skills: In fights, Dowan would try
      to quickly KO his opponents by overwhelming them with his Active Skills. *Using
      Environment: Dowan is a gifted fighter who uses the environment around him to
      his advantage all the time, even being able to use an octopus and buttons to
      call lifts be able to give him an edge in battle. *Leveling Up in Battle: Dowan
      saves the Bronze Keys he receives from finishing his quests so he can use them
      to level up stats in the middle of battle. For example: increasing his speed
      in the middle of a fight against an opponent faster than him to be able to keep
      up. Using Bronze Keys to increase the HP stat also recovers Dowan''s stamina.
      *100 Hit Strategy: If Dowan runs out of mana or the active skills aren''t strong
      enough, he would resort to landing 100 low-powered hits hoping for one of them
      to be a Critical Hit which negates durability. *Preparation: If he had time
      to prepare for the fight, Dowan would show up with an appropriate weapon to
      use his Weapon Mastery skill to its maximum potential.'
    source_ids:
    - vsbattles-dowan-ha-unknown
    confidence: 0.6
    notes: auto_repair source extraction
