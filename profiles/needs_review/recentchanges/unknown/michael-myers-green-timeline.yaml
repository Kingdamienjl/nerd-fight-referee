- id: claim-weaknesses-05faa132
  section: weaknesses
  axis: weakness
  text: "Has lost three of his fingers and is blind in one eye, although these have\
    \ not appeared to significantly impacted his combat efficiency. Without killing\
    \ others or retaining a stable source of fear from others, Michael will be greatly\
    \ weakened.Halloween Ends Infecting others with his evil does not necessarily\
    \ mean they will not attack him, such as when Corey fought him.Halloween Ends\
    \ Removing Michael's mask can act as an effective distraction which may cause\
    \ him to stop attacking until putting it back on, a feat that those much weaker\
    \ than him could accomplishHalloweenHalloween Kills Note: This profile covers\
    \ Michael Myers in the Green Timeline. The movies in this timeline are Halloween,\
    \ Halloween (2018), Halloween Kills, and Halloween Ends. ==Notable Matchups==\
    \ *Norman Bates (Psycho) Norman's Profile (Michael's 1978 key was used. Speed\
    \ was equalized and both had their standard equipment. Both started 10 meters\
    \ away and battle took place in Bates Motel) *Chucky (Child's Play) Chucky\u2019\
    s Profile (1978 Michael and Chucky\u2019s doll form were used. Speed was equalized\
    \ and both had their standard equipment. Both started 10 meters away from each\
    \ other) *Dexter Morgan (Dexter) Dexter's Profile (Michael's 2nd key was used.\
    \ Speed was equalized. The fight took place in a junkyard on halloween night &\
    \ both had prior knowledge. They started 20 meters apart & in hiding) *Giraffe\
    \ (The Real World) Giraffe's Profile (Speed was equalized, battle took place in\
