    - field: intelligence
      value: "At least Gifted (Despite being institutionalized since childhood and\
        \ exhibiting silent and simple-minded behavior, Michael displays a high level\
        \ of intelligence overall. In 1978, Michael orchestrated his escape from Smith's\
        \ Grove by triggering a mass breakout of prisoners from the transport bus.\
        \ Prior to his murder spree, Michael had created escape plans, and also had\
        \ ID\u2019s of himself forged. He took notes on airplane schedules and acquired\
        \ road maps to drive his way back to Haddonfield after he escaped, which was\
        \ 150 miles away, despite him not having any notable prior driving lessons\
        \ and learning them by observing how Loomis and other policemen drove him\
        \ around from the backseat. Instantly mastered driving and later memorized\
        \ all of Haddonfield's roads to stalk his way around town. Plotted his Halloween\
        \ night murder spree by stalking his victims, learning their whereabouts and\
        \ gathering the necessary supplies to kill each of them with different tactics\
        \ to lure them in. Usually sets up the corpses of his victims in a grotesque\
        \ fashion so that others may find them, allowing him to kill them when they\
        \ are in a panic. Has shown other instances of planning ahead, such as using\
        \ a rake to jam the back door so Laurie couldn't easily escape and cutting\
        \ the phone line so she couldn't call for help. He also has a tendency to\
        \ play dead once he's beaten down, allowing him to immediately retaliate when\
        \ his victims lower their guard. Presumably caused the mass breakout during\
        \ the 2018 events in order to steal a truck and drive back to Haddonfield\
        \ where he carefully tracked and stalked Aaron and Dana in order to quietly\
        \ kill them and retrieve his mask from their car. Discovered Laurie's panic\
        \ room beneath the floor by noticing light subtly shining from the bullet\
        \ holes in the floor and predicted that Karen would have a gun trained on\
        \ the spot, though he was fooled when she pretended to be helpless. Furthermore,\
        \ Michael has proven to be effective in combat. He managed outmatched Laurie\
        \ in a one-on-one confrontation, the latter of which had taken 40 years of\
        \ self-defence training in preparation for killing Myers. Outsmarted Marion,\
        \ wasting her bullets and left her defenseless before she was killed then\
        \ redirected a woman's hand using a vehicle door, causing her to shoot herself\
        \ instead of Michael, with the latter only having a few seconds to act on\
        \ this. Managed to kill an entire lynch mob using only a kitchen knife after\
        \ taking a beating, despite his opponents all utilizing weapons with greater\
        \ range such as baseball bats and handguns. Located Corey to Laurie\u2019\
        s residence to retrieve his stolen mask. Escaped after his 2018 murder spree,\
        \ switching up his tracks, outsmarting the entire town of Haddonfield, and\
        \ remained hidden despite investigation by Sheriff Scott, law enforcement,\
        \ and the National Guard\u2019s search of Michael, who could not turn up as\
        \ much as a single clue, effectively outsmarting themHalloween Ends: The Official\
        \ Movie Novelization, Page 19 Actor James Jude Courtney describes Michael\
        \ as heavily instinctual and with an \"incredible intuition,\" comparing him\
        \ to an ex-mafioso who could instantly read a room full of people and stating\
        \ that Michael is the \"epitome of someone who can each out and feel everything\
        \ around him.\") 1978 Plan= Michael's original killing spree began with the\
        \ days leading up to Halloween and is quite devious. It's noted by Loomis\
        \ that Michael had been staring at a wall for years looking forward to Halloween\
        \ night, and this benefitted him since it made it seem like much of his strange\
        \ behavior (stalking, wearing a mask, etc.) was just part of the holidays,\
        \ a time of year when the police and neighbors would already be dealing with\
        \ pranks. Michael began by breaking into a Nick's Hardware Store, from which\
        \ he acquired his iconic mask, rope, and a knife without getting caught. This\
        \ allow lured Dr. Loomis and the Sheriff there, where Michael was able to\
        \ observe them from afar. Michael also stole his sister's gravestone and took\
        \ it to his sister's house, misleading Dr. Loomis, who already believed he\
        \ was intent on returning home, and Sheriff Brackett into believing that Michael\
        \ was using his house as a base. He also left a half-eaten dog's corpse and\
        \ the stolen car there to further sell the illusion. All throughout, Michael\
        \ is shown stalking and tracking the movements of Laurie, Annie, Lynda, and\
        \ even Dr. Loomis without alerting the authorities. After spooking Annie into\
        \ relocating Lindsey at the Doyle house, he killed her in her car, allowing\
        \ him to finish off her friends Bob and Lynda who arrived shortly after without\
        \ alerting them, purposefully eliminating Lynda last while she was on the\
        \ phone to lure his true target, Laurie Strode, over before cutting the phone\
        \ lines. Michael proves to have decently predicted her actions as the bodies\
        \ scare her into clutching a wall by an adjacent room, where Michael is revealed\
        \ to have been lying in wait, and when she attempted to flee by the back door\
        \ Michael a"
