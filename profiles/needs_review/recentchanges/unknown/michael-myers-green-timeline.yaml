      value: "Has lost three of his fingers and is blind in one eye, although these\
        \ have not appeared to significantly impacted his combat efficiency. Without\
        \ killing others or retaining a stable source of fear from others, Michael\
        \ will be greatly weakened.Halloween Ends Infecting others with his evil does\
        \ not necessarily mean they will not attack him, such as when Corey fought\
        \ him.Halloween Ends Removing Michael's mask can act as an effective distraction\
        \ which may cause him to stop attacking until putting it back on, a feat that\
        \ those much weaker than him could accomplishHalloweenHalloween Kills Note:\
        \ This profile covers Michael Myers in the Green Timeline. The movies in this\
        \ timeline are Halloween, Halloween (2018), Halloween Kills, and Halloween\
        \ Ends. ==Notable Matchups== *Norman Bates (Psycho) Norman's Profile (Michael's\
        \ 1978 key was used. Speed was equalized and both had their standard equipment.\
