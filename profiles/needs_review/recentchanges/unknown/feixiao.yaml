- id: claim-weaknesses-8c63f2bd
  section: weaknesses
  axis: weakness
  text: 'Removing a Foxian''s liver will slow down their regeneration. Feixiao suffers
    from Moon Rage, which depletes her life and sanity until she becomes a bloodthirsty
    monster, and due to Foxians not having a healing factor at the same level as the
    Boririns, the Moon Rage will slowly tear her body apart and cause her to eventually
    die. Feixiao also doesn''t know how to activate her Moon Rage state at will, which
    seemingly happens at the peak of her heated battles. | After she consumed Hoolay''s
    Crimson Moon Heart, most of Feixiao''s weaknesses related to the Moon Rage have
    been eliminated, as now her bloodlusted thoughts that plagued her disappeared
    and her body will not be slowly torn apart anymore once she enters the Moon Rage
    state, since she gained a high level regeneration equal to Hoolay''s, allowing
    her to recover any damage the Moon Rage inflicts on her. Although Feixiao still
    doesn''t know how to activate the Moon Rage at will. {| class="mw-collapsible
    mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
    | colspan="2" style="text-align: left; "'
  source_ids: *id003
  decisive: false
