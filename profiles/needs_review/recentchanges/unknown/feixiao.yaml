  stamina:
    text: Superhuman Feixiao possesses abnormal levels of energy. During wartime,
      she can spend long hours commanding her troops in battle and even joining in
      the battle herself. In her downtime, she is capable of running 50 kilometers
      back and forth ten times and still honing her combat skills immediately afterward,
      all of which she does every day. After consuming Hoolay's Crimson Moon Heart,
      Feixiao inherited his energy exertion, which allowed him to be able to exert
      his energy for a very long time as he does not required food, water and sleep.
      After ripping his own heart, Hoolay was also capable of keeping himself alive
      long enough to use his Crimson Moon Heart to nearly succeed in driving all Foxians
      within the entire Xianzhou Luofu into madness. After she consumed Hoolay's Crimson
      Moon Heart, Feixiao inherited his pain tolerance, which allowed him to endure
      intense hyperplasia of the bone and muscle structure, such as a protruded snout
      and jawline, the twisting in of the foot structure, and constant stabbing for
      hundreds of years with no reaction. Hoolay was also able to rip off his own
      heart without showing any signs of pain.
