    text: Gifted (Sheba is blessed with sharp wit and sagacity that made her capable
      of challenging King Solomon with riddles as well as the precognitive ability
      to match Solomon in a duel of clairvoyance adapting to what was becoming settled
      as the future and the past through the three enigmas. Fires and foremost however,
      Sheba is highly intelligent in regards to prosperous business ventures, so much
      so that profits, money, and treasure are described as being the very blood and
      breath that circulate through her mind and body, an aspect that is aided by
      both her ability to see into the future and her keen memory that allows her
      to clearly see what people said ages ago and brings that up again the most critical
      moments. Her discerning eye is so keen that she is able to appraise the worth
      of any object with a glance as well as analyze the actions of her opponents
      in the same manner. She is also an incredibly skilled magus compared to Circe,
      the self-proclaimed "Queen Witch" who taught Medea everything she knows. Her
      efforts slowed down the accelerated flow of time within the Salem sub-singularity,
      buying time for Chaldea to arrive and resolve it)
    source_ids:
    - vsbattles-queen-of-sheba-fate-unknown
    confidence: 0.6
    notes: auto_repair source extraction
