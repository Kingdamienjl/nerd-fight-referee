- id: claim-weaknesses-c73a2042
  section: weaknesses
  axis: weakness
  text: 'Cannot fight in Spirit Form. She is incredibly money-grubbing and can be
    distracted be potential business ventures. Notable Attacks/Techniques: ===Noble
    Phantasm=== thumb|300px *Three Enigmas: Three Riddle Tellings: The Noble Phantasm
    of the Queen of Sheba. Three spirit demons (jinn) that serve her manifest, and
    present the enemy with difficult (physical) questions. The three jinns are respectively
    called "Achat", "Shtayim", and "Shalosh". ===Class Skills=== *Magic Resistance:
    An innate ability that grants protection against magical effects. Unlike the Resistance
    effect that merely rejects Magical Energy, this ability cancels the spells altogether.
    Sheba''s A-rank Magic Resistance makes her untouchable to modern magi and allows
    only the most powerful and oldest spells from the Age of Gods to even affect her.
    She can also shrug off magical effects such as Mind Manipulation, Petrification,
    and Spatial Manipulation with ease. *Territory Creation: A skill which quantifies
    one''s ability to create a territory advantageous to them as a Magus. At C-Rank
    she can construct a territory beneficial to her. She becomes the queen of a small
    kingdom concealed by an ephemeral, often unstable mirage. ===Personal Skills===
    *Spiritual Vision: The formation of a barrier in the surroundings through firm,
    and fair transactions. Not just the appraisal of material things, even the suspicious
    conduct of enemies during battle cannot escape from her eyes. *Demon God''s Wisdom:
    The blessed sharp wit and sagacity that made her capable of challenging King Solomon
    with riddles. *Charisma: The natural talent to command an army. Increases the
    ability of allies during group battles. A rare talent, and ability inherent to
    Servants of the Saver class. It is said that a rank of B in this skill is sufficient
    to lead a nation as its King. The legendary queen of the "Kingdom of Sheba" that
    captivated people even of future times. ==Notable Matchups== Victories: Losses:
    Inconclusive: Category:Characters Category:Female Characters Category:Game Characters
    Category:Fate Category:Nasuverse Category:Spirits Category:Summons Category:Servants
    (Nasuverse) Category:Genies Category:Royal Characters Category:Foxes Category:Leaders
    Category:Queens Category:Magic Users Category:Martial Artists Category:Clairvoyance
    Users Category:Precognition Users Category:Weather Users Category:Flight Users
    Category:Teleportation Users Category:Duplication Users Category:Weapon Creation
    Users Category:Air Users Category:Shapeshifters Category:Summoners Category:Possession
    Users Category:Supernatural Luck Users Category:Fate Users Category:Soul Users
    Category:Regeneration Users Category:Invisibility Users Category:Intangibility
    Users Category:Forcefield Users Category:Time Users Category:Preparation Users
    Category:Power Nullification Users Category:Law Users Category:Illusionists Category:Sealing
    Users Category:Power Bestowal Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-83450090
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Magic, Martial Arts, Clairvoyance, Precognition,\
    \ Fog Manipulation, Flight (Via Fog), Teleportation, Duplication, Weapon Creation\
    \ (Able to form weapons such as clubs or boxing gloves out of fog), Power Nullification\
    \ and Law Manipulation (Passively weakens the power of Demon Gods and passively\
    \ creates a \"Kingdom of Sheba\", where her word is law), Illusion Creation, Power\
    \ Bestowal, Sealing (Alongside Circe, she managed to seal Abigail's gates), Air\
    \ Manipulation, Shapeshifting, Forcefield Creation, Summoning (Via Three Enigmas),\
    \ Supernatural Luck, Time Manipulation (Slowed down Raum's accelerated time back\
    \ to normal levels in the Salem sub-singularity), Minor Fate Manipulation (Servants\
    \ with B-Rank Luck or higher can change their own fates to evade inevitable outcomes\
    \ such as having their hearts destroyed by G\xE1e Bolg), Preparation, Limited\
    \ Power Nullification and Servant Physiology, Resistance to BFR"
