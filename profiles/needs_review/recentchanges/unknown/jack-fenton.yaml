- id: claim-weaknesses-43ecab3c
  section: weaknesses
  axis: weakness
  text: 'Sometimes acts without thinking. Several Fenton Works gadgets and weapons
    only work on ghosts and have little to no effect on humans. Notes: The reason
    Jack is currently scaling to ghosts is due to the fact that humans in Danny Phantom
    possess the same emotional energy as the humans of the past, and said energy is
    shown capable of empowering individuals. Jack along with several other humans
    have also been consistently shown capable of contending with ghosts without special
    equipment. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
