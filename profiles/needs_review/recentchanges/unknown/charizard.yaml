- id: claim-powers-and-abilities-25851338
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Bodily Weaponry (Claws and fangs, used\
    \ through moves like Slash, Bite and Fire Fang) *Fire Manipulation (A Charmander's\
    \ tail is constantly ablaze since birth.Pok\xE9mon Stadium It' tail indicates\
    \ Charmander's life force and burns brightly if the Charmander is health. Can\
    \ use fire-type moves such as Ember and Flamethrower) *Sound Manipulation, Statistics\
    \ Reduction, and Social Influencing (Via Growl which makes an opponent lower their\
    \ attack by cutely growling at them. Scary Face has the user frighten the target\
    \ with a scary face to harshly lower its Speed stat) *Breath Attack, Smoke Manipulation,\
    \ and Paralysis Inducement (Smokescreen releases an obscuring cloud of smoke which\
    \ lowers the target's accuracy. Dragon Breath has the user exhale with a mighty\
    \ gust that inflicts damage which has a chance to leave the target with paralysis)\
    \ *Statistics Amplification (Blaze empowers fire-type moves by 50% when at 1/3\
    \ HP. Solar Power increases the Pok\xE9mon's Special Attack by 1.5\xD7 during\
    \ harsh sunlight. Moves such as Belly Drum, Swords Dance, Dragon Dance, and Ancient\
    \ Power allows the user to boost their stats) *Air Manipulation (Air Cutter hits\
    \ the target with razor-like wind) *Earth Manipulation (Rock Slide hurls large\
    \ boulders at opponents) *BFR (Dragon Tail knocks the target away forcing another\
    \ Pok\xE9mon out in a trainer battle and ending the battle against wild Pok\xE9\
    mon) Resistance to; *Bug-type, Steel-type, Fire Manipulation, Plant Manipulation,\
    \ Ice Manipulation Fairy-type (Only takes 1/2 damage from Bug, Steel, Fire, Grass,\
    \ Ice, and Fairy-type attacks) All the abilities of Charmander including; *Enhanced\
    \ Fire Manipulation (When it swings its burning tail, it elevates the temperature\
    \ to unbearably high levels.Pok\xE9mon Red and Green If it becomes agitated during\
    \ battle, it spouts intense flames, incinerating its surroundingsPok\xE9mon Gold/Silver/Crystal)\
    \ *Bodily Weaponry (Conventional; Noted to have razor-sharp which it uses to destroy\
    \ foesPok\xE9mon Ruby/Sapphire/Emerald/Omega Ruby/Alpha Sapphire and tear up the\
    \ fallen opponentsPok\xE9mon FireRed and LeafGreenPok\xE9mon X and Y) All the\
    \ abilities of Charmeleon including; *Enhanced Fire Manipulation and Breath Attack\
    \ (Can spit fire that's hot enough to melt boulders and cause forest firesPok\xE9\
    mon Sword and Shield as well as quickly melting glaciers weighing 10,000 tons.\
    \ Charizard's fire breath is stated to be able to melt any material) *Flight (Charizard\
    \ can fly close to an altitude of 4,600 feet) *Darkness Manipulation (Shadow Claw\
    \ attacks the target with a a sharp claw made from shadows) *Transformation and\
    \ Statistics Amplification (While holding Charizardite X or Charizardite Y a trainer\
    \ with a Key Stone can allow Charizard to Mega Evolve which transforms the Pok\xE9\
    mon and increases their stats) Resistance to; *Bug-type and Plant Manipulation\
    \ (Only takes 1/4 damage from Bug and Grass-type attacks) *Fighting-type (Only\
    \ takes 1/2 damage from Fighting-type moves)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
