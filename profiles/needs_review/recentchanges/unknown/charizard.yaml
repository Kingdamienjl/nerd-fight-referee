  axis: weakness
  text: It is weak to Water and Electric moves, even more so with Rock-type attacks.
    Charizard will die if the fire on the tip of its tail is completely extinguished,
    Blast Burn forces Charizard to rest and recuperate after its completion, leaving
    it vulnerable to attacks. Flare Blitz deals a significant amount of damage to
    Charizard on impact with its target, Charizard are known to be proud fighters
    to the point of overconfidence at times | As Mega Charizard X, it is only weak
    to Ground, Rock, and Dragon-type moves. As Mega Charizard Y, Drought won't activate
    during the heavy rain of Primordial Sea or when a the mysterious air current of
    Delta Stream appears. | Gigantamax can only be used in areas with Dynamax energy
    (i.e. dens and stadiums), Destroying their non-move forcefield through any means
