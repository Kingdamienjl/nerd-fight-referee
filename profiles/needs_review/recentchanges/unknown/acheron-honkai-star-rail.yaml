  tier:
    text: 3-C, 3-B with Unsheathed Sword
    source_ids: &id002
    - mediawiki-4905531
    confidence: 0.8
  attack_potency:
    text: "Galaxy level (Should be superior to Welt, Trailblazer, March 7th and Himeko,\
      \ who at the time were able to fight against Aventurine of Stratagems. Casually\
      \ fought against the illusion-like clones of Silver Wolf, Blade and Kafka at\
      \ the same time, eventually overpowering them30.453235 ZettaFoe), Multi-Galaxy\
      \ level with Unsheathed Sword (As an Emanator of Nihility and a Self-Annihilator,When\
      \ the Sacred Ginmill ClosesA Walk Among the TombstonesAcheron Character Story:\
      \ Part IV Acheron is vastly stronger than regular Pathstriders and mere mortals.Loading\
      \ Screen - Emanators As a fully-fledged Emanator recognized by the Aeon of Nihility,Data\
      \ Bank Terms: Emanator (Phenomenon) Acheron should be comparable to Ascended\
      \ Trailblazer, Ascended Permansor Terrae and Ascended March 7th, who were able\
      \ to fight against Incomplete Irontomb.Hero, Return to Dawn in Mortality She\
      \ is also destined to fight a fellow Self-Annihilator and Emanator of Destruction,\
      \ Zephyro, with the latter being stated that he cannot take an attack from Acheron's\
      \ blade head-on.Myriad Celestia Trailer \u2014 Fables About the Stars Part 2\
      \ | Honkai: Star RailAeonic Silence After unsheathing her sword, Acheron undergoes\
      \ a transformation which unleashes her full power as an Emanator of Nihility,\
      \ making her stronger than before. With a single attack, she one-shotted Aventurine\
      \ of Stratagems and obliterated his strongest attack which was infused with\
      \ the power of the Path of Preservation. Furthermore, Welt considers her power\
      \ terrifying, and stated it can affect the entire Dreamscape. Acheron herself\
      \ can draw power from the Aeon of Nihility IX to transform,HoYoLAB: Pom-Pom's\
      \ Intel | Emanator Special and is capable of destroying the foundation of Ena's\
      \ Dream, which is regarded as needing the power of an Emanator to overcome in\
      \ both the Trailblaze's and the Finality's perspectives of the Story.Every Dawn\
      \ of the World She can also destroy manifestations of IX THEMSELF as shown in\
      \ her ultimate and backstory2.93626771 RonnaFoe)"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: FTL (As an Emanator of Nihility, Acheron should be faster than Aventurine
      of Stratagems1.1c), Massively FTL+ with Unsheathed Sword (Far faster than before.
      Should be comparable to Zephyro and the Ascended Chrysos Heirs63.11385 Sextillion
      c)
    source_ids: *id002
