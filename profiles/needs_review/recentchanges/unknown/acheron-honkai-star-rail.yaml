    \ of the PastSpecies of the Galaxy: Wubbaboo) *Self-Sustenance (Types 2 & 3; Self-Annihilators\
    \ do not require sleep nor food as they have lost all bodily functions) *Immortality:\
    \ **Type 1 (Acheron has been alive for at least 65,132/57,608 to 205,680/181,920\
    \ years old.Version 2.3 Farewell, Penacony Special Program | Honkai: Star Rail\
    \ Self-Annihilators have their lives infinitely extendedDivergent Universe: Equations\
    \ - Self-Annihilator) **Type 2 (Mid; Self-Annihilators can survive having their\
    \ heads shattered into pieces and ripped off from their bodies for long periods\
    \ of time, being able to talk normally during these situations that would have\
    \ instantly killed a normal human as if they never happenedSimulated Universe:\
    \ Swarm Disaster, Secrets: Lepismat System: Massacre Saga (Part II)) **Type 3\
    \ & Regeneration (Mid; Self-Annihilators can regenerate their heads from being\
    \ smashed into pieces and reattach them back to their original positions) *Master\
    \ Swordswoman *Electricity Manipulation (All of her attacks deal lightning damageKeeping\
    \ up with Star Rail \u2014 Acheron: Another Fall of Rain, _______ _____ ______\
    \ | Honkai: Star Rail) *Danmaku & Energy Projection (Acheron can fire multiple\
    \ slashes of energy made of electricity) *Martial Arts & Acrobatics (Hypermobility;\
    \ Despite mainly being a swordswoman, Acheron is also proficient in Martial Arts\
    \ and Acrobatics as she incorporates them into battle together with her swordswomanshipAcheron\
    \ Trailer \u2014 Your Color | Honkai Star Rail) *Stealth Mastery (Using , Acheron\
    \ can conceal herself and others near herThe Tell-Tale Heart) *Non-Physical Interaction\
    \ **(Spiritual, Mental & Information\u3010Type 2\u3011; Can interact with souls)\
    \ **(Energy; Can interact with a Stellaron which is composed of pure energy.Data\
