  durability:
    text: Galaxy level (Blocked several attacks from the illusion-like clones of Silver
      Wolf, Kafka and Blade with ease. While holding back, she was able to withstand
      and block multiple attacks from SAM), Multi-Galaxy level with Unsheathed Sword
      (More durable than before. As a physical fighter, she can withstand the force
      of her own physical attacks)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: "Superhuman (Acheron endured countless battles against the Yaoyorozu-no-Kami\
      \ and its most powerful subordinates over many years with minimal rest, including\
      \ a grueling and prolonged fight against Hakuhatsu Ki, the wielder of the sword\
      \ End, ultimately emerging victorious. Even after these exhausting trials, she\
      \ withstood being consumed by the shadow of IX, the Aeon of Nihility. Despite\
      \ this overwhelming ordeal, she gathered the strength to unleash a powerful\
      \ slash against IX and successfully escaped from the Aeon of NihilityMyriad\
      \ Celestia Trailer \u2014 Kyoden: A Cleave Across the Transient World | Honkai:\
      \ Star Rail)"
    source_ids: *id002
    confidence: 0.8
  range:
    text: 'Extended Melee Range with Scabbard and Unsheathed Sword, Tens of Meters
      with Scabbard''s Energy Projection, at least Galactic, likely Intergalactic
      & Interdimensional up to High Complex Multiversal & Extradimensional with Honkai
      Energy and Unsheathed Sword''s Abilities (The clash between Emanator-level forces
      was stated to be far more destructive than Chadwick''s Imaginary Implosion Pulse,Memory
      Bubble: Lord Ravager a bomb that completely destroyed 24 planets in a single
      blast.The Trees At Peace A single casual energy slash from Acheron easily extended
      beyond the Clock Studios Theme Park, destroying Aventurine of Stratagems'' strongest
      attack that was covering said park. Her true powers as an Emanator of Nihility
      were stated to be capable of affecting the entirety of Dreamscape, a realm based
      on everything regarding the Asdana Galaxy, including its immense size, which
      spans at least millions of light-years. She unleashed a powerful energy slash
      from Izumo that reached IX despite the Aeon of Nihility being at a distance
      comparable to that between a sun and a planet.Izumo Gensei and Takama Divine
      Realm After unsheathing her sword, Acheron gains the ability to send her opponents
      to the "Horizon of Existence". Was able to nullify Ena''s dream throughout the
      entire Dreamscape despite being on the "Horizon of Existence". Emanators can
      draw power from their respective Aeons, who are Higher-Dimensional beings and
      congregations of Imaginary Energy. Emanators are also capable of traveling through
      imaginary spaces as well as tidal zones between worlds11-D)'
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: "Above Average generally, Genius combatant (Acheron saw through Black Swan's\
      \ true intentions while dancing with her, and as retaliation, she manifested\
      \ her memories upon her, inducing palpitating revelation and psycho trauma.\
      \ She instantly noticed Black Swan's identity upon interacting her and asked\
      \ about the Annihilation Gang. Acheron is highly proficient with the sword being\
      \ able to fight using only the scabbard itself. She has sharpened her skills\
      \ with her katana by fighting for many years against the Yaoyorozu-no-Kami.\
      \ She can also evenly match and eventually defeat the illusion-like clones of\
      \ Blade and Kafka, both of whom are swordmastersAcheron Trailer \u2014 Your\
      \ Color | Honkai Star Rail)"
    source_ids: *id002
    confidence: 0.8
