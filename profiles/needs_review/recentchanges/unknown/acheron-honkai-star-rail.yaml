    \ a Heliobus like the TrailblazerA Foxian Tale of the Haunted) **(Memories; Should\
    \ be able to interact with memories like the MCMemory Bubble and Fu XuanTotal\
    \ Recall) **(Data; Can interact with a Stellaron made out of dataMyriad Celestia\
    \ Trailer: The Jepella Rebellion \u2014 Scene 47 | Honkai: Star Rail and Aether\
    \ Spirit which are also composed of dataAetherium Wars) **(Elemental; Acheron\
    \ can interact with Duke Inferno who is a being made out of flamesThe Devil in\
    \ Velvet) **(Abstractions\u3010Type 2\u3011, Concept\u3010Type 3\u3008Vision,\
    \ Sight & Death\u3009\u3011; Can affect Allseer, which embodies the concepts of\
    \ vision and sightVersion 2.0 If One Dreams At Midnight Special Program as well\
    \ as Something Unto Death, which is a sort of figurative amalgam of complex concepts,\
    \ which for now is known as death) *Limited Madness Manipulation (Type 3; Can\
    \ traumatize those who attempt to look into her mindAnimated Short: Rondo Across\
    \ Countless Kalpas | Honkai: Star Rail) *Imaginary Energy (Nihility) & Honkai\
    \ Energy (High-Level; As an Emanator of Nihility,Data Bank Factions: Self-Annihilator\
    \ \u2014 Nihility Acheron is capable of drawing Imaginary Energy from Paths which\
