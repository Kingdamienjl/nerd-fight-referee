  striking_strength:
    text: Galaxy level (Easily stopped a simultaneous attack from the illusion-like
      clones of Silver Wolf, Blade and Kafka, and then proceeded to overpower them.
      While holding back, she matched SAMWhodunit), Multi-Galaxy level with Unsheathed
      Sword (Should be comparable to Zephyro and the Ascended Chrysos Heirs. It is
      stated that Zephyro cannot take an attack from Acheron's blade head-on)
    source_ids: *id002
