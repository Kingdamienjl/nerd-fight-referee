- id: claim-powers-and-abilities-d7ecfaa7
  section: abilities
  axis: hax
  text: '*Santa Claus **Superhuman Physical Characteristics (Santa Claus is herself
    a Perfect Doll) **Weapon Mastery (Shown to possess skill with hunting, tracking
    and use of a bow to an extent to mentor others such as Tolka to hit living targets
    like foxes) **Stealth Mastery (Was able to painlessly draw blood from Denji by
    piercing him with a cursed nail 3 times while he was guarded by multiple experienced
    devil hunters at the same timeChainsaw Man Chapter 56) *Contracted Abilities **Doll
    Devil ***Transmutation, Mind Manipulation, Body Puppetry, Hive Mind (Type 1) &
    Immortality (Type 6) with Doll Devil contract (Can turn humans into dolls by touching
    their skin or clothes.Chainsaw Man Chapter 58Chainsaw Man Chapter 59 Can create
    a perfect doll by turning a human with respect, worship, pity, and guilt towards
    her into a doll.Chainsaw Man Chapter 63 Can turn humans into dolls while keeping
    their consciousness intact to unnerve enemies.Chainsaw Man Chapter 67Has a hive
    mind connection with her dolls, allowing her to speak through them and borrow
    their senses.Chainsaw Man Chapter 70) ***Superhuman Physical Characteristics,
    Bodily Weaponry & Surface Scaling with Dolls (Can turn their arms and feet into
    blades, can use the blades to cling onto walls while runningChainsaw Man Chapter
    59Chainsaw Man Chapter 68 they also can stay active even with severe damage.Chainsaw
    Man Chapter 67) **Hell Devil ***Superhuman Physical Characteristics ***General
    Devil Physiology ***Summoning, BFR & Darkness Manipulation (With the Hell Devil
    contract, with the sacrifice of 3 children and one of her bodies, Santa Claus
    is able to cast her target to hell. Once summoned, the Hell Devil''s hand will
    drag the area into hell, causing the area to be enveloped in darknessChainsaw
    Man Chapter 63 This ability can also be used to teleport from hell back to earthChainsaw
    Man Chapter 66) **Curse Devil ***Superhuman Physical Characteristics ***General
    Devil Physiology ***Curse Manipulation & Limited Death Manipulation(Is able to
    utilize the Curse Devil''s powers through a cursed nail, which can take the life
    of those who have been pierced 4 times by it.Chainsaw Man Chapter 56) *All previous
    abilities enhanced (Can now turn fiends into dollsChainsaw Man Chapter 68) *Superhuman
    Physical Characteristics *General Devil Physiology *Additional Limbs & Inorganic
    Physiology (Type 1) (With the Darkness Devil contract, Santa became much taller,
    grew many more arms, and had many other changes to her body that resembled dollsChainsaw
    Man Chapter 62Chainsaw Man Chapter 68) *Regeneration (High-Mid) & Immortality
    (Type 2 & 3) (Can regenerate from damage almost instantly while in the darkness,Chainsaw
    Man Chapter 67 which makes her extremely hard to killChainsaw Man Chapter 66)
    *Empowerment & Transformation During Night (Enters a stronger form during the
    nightChainsaw Man Chapter 68) *Pain Manipulation & Mind Manipulation (Santa Claus
    is able to split pain and mental attacks through a hive mindChainsaw Man Chapter
    67Chainsaw Man Chapter 69Chainsaw Man Chapter 70)'
  source_ids: *id003
  decisive: true
  status: unverified
