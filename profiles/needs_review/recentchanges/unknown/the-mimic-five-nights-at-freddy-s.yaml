  axis: hax
  text: "*Superhuman Physical Characteristics *Inorganic Physiology (Type 2) *Self-Sustenance\
    \ (Types 1 and 2: Is a robot) *Body Control (Can change the length of it's parts\
    \ to fit into any costume, and animatronicFive Nights at Freddy's; Secret of the\
    \ Mimic) *Stealth Mastery (Should be comparable to other animatronics in the series,\
    \ was able to sneak inside a mascot suit, without us noticing until he starts\
    \ moving. Was able to move around the building despite us being in the area) *Voice\
    \ Mimicry (Mimicked the voices of David, Jackie, Big Top and many more) *Immortality\
    \ (Type 2: Comparable to other animatronics in the series, survived a detonation\
    \ and was shown fine after falling into molten steel) *Social Influencing (Deception:\
    \ Its mimicry is compelling enough to deceive Cassie into thinking it is Gregory,\
    \ Should be comparable to M1 who was able to fool Arnold into thinking she was\
    \ Dispatch via her Mimicry) *Limited Light Manipulation (Eyes are shown to glow\
    \ bright enough to light up the back of a van) -Resistance= *Extreme Heat (1370\xB0\
    C: Shown to be visibly undamaged after falling into molten steel twice)"
