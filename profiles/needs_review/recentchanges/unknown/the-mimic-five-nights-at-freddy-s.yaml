  intelligence:
    text: Genius (The Mimic is a highly manipulative and intelligent machine that
      uses its mimicry to deceive others. In Secret of the Mimic, he was smart enough
      to have created his own legs, which have the same great Durability, Body Control
      and Superhuman speed that he has, being like the rest of his Body that was made
      by a Genius, alongside creating its own "[https://freddy-fazbears-pizza.fandom.com/wiki/Proto-Mimics
      Proto-Mimics]", of which, like him, seems to be able to [https://www.youtube.com/watch?v=o-cnXsy9AOU&t=5486s
      survive having fell on lava by being seen too close to it]. It has also formulated
      its own escape plan; By mimicking Gregory's voice, it would use his walkie-talkie
      to communicate with Cassie, drawing her into the Pizzaplex sinkhole and tricking
      her into disabling the security nodes that helps keep it locked inside, doing
      this while under the guise of her friend in need of help. As Glitchtrap, it
      somehow devised a way of escaping from the VR world by possessing beta testers,
      and also managed to brainwash one into doing its bidding) The Plot of Secret
      of the Mimic itself is Arnold getting the Mimic Blueprints for Fazbear Entertainment
      interest, the company having in it Geniuses/Extraordinary Geniuses like William
      and Henry, this desire complimenting the Mimic intelligence as his advanced
      AI is one of his most notable characteristics
