- id: claim-powers-and-abilities-8769c3d4
  section: abilities
  axis: hax
  text: 'Likely Superhuman Strength, Limited Inorganic Physiology (Type 2; Despite
    being a robot, Nightmarionne breathes and has a heartbeat.), Self-Sustenance (Types
    2, 3, and possibly 1; As a robot, Nightmarionne lacks the need for food, water,
    or rest. Nightmarionne should also lack a need for air, although its breathing
    puts this into question), Likely Shapeshifting (Should be comparable to Nightmare
    Fredbear, Nightmare, and Nightmare Foxy.Five Nights At Freddy''s 4), Minor Body
    Control (Can appear with or without teethFive Nights At Freddy''s 4), Illusion
    Creation and Dream Manipulation (The Nightmare animatronics are, as their namesakes
    suggest, horrific illusions conjured from the minds of the Crying Child from FNAF
    4 and Michael Afton, with the former being comatoseFive Nights At Freddy''s 4
    and the latter being subject to fear-inducing gas.Tales From The Pizzaplex: Dittophobia
    Despite this, the Nightmares are consistent in their appearances and have also
    been experienced by William Afton and someone in Fazbear Entertainment as Nightmarionne
    exists in Help WantedFive Nights At Freddy''s Help Wanted and as plushes in Security
    BreachFive Nights At Freddy''s Security Breach), Immortality (Type 2; Should be
    comparable to Nightmare Mangle. The other Nightmare animatronics survive having
    their endoskeletons exposed, their outer layers destroyed, and can even survive
    being entirely hollow, as evidenced by Jack-O-Bonnie and Jack-O-Chica), Sound
    Manipulation (The Puppet''s lullaby constantly plays around NightmarionneFive
    Nights At Freddy''s 4), Stealth Mastery (Can sneak into the players closet and
    bed despite the music constantly playing around them), Perception Manipulation
    (Causes the player''s vision to go dark when directly looked at.Five Nights At
    Freddy''s 4 Should be comparable to Nightmare, who can project his laughter in
    rooms that he isn''t in), Enhanced Senses (Can see in the darkness of the house''s
    rooms) Superhuman Physical Characteristics, Immortality (Types 1, 2 and 8; Characters
    frequently talk of torturing and killing the player for eternity.Five Nights at
    Freddy''s: Ultimate Custom Night Comparable to Foxy who can literally tear himself
    limb from limb with no ill effects.Five Nights at Freddy''s: Ultimate Custom Night
    Can be brought back by The One You Should Not Have Killed after being erased by
    the Death CoinFive Nights at Freddy''s: Ultimate Custom Night), Invisibility (Fades
    out of view when not focused onFive Nights at Freddy''s: Ultimate Custom Night),
    Inorganic Physiology (Type 2; created by The One You Shouldn''t Have Killed to
    torture William Afton), Resistance to Temperature Manipulation (Is unaffected
    by the Heater, which can cause animatronics to glitch out and malfunctionFive
    Nights at Freddy''s: Ultimate Custom Night)'
  source_ids: *id003
  decisive: true
