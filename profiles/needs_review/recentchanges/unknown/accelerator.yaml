    - field: weaknesses
      value: 'Over reliance on his vector shield and overconfidence (No longer the
        case after Post-Headshot Era), he changes the vectors in such a way that he
        does not injure his hands and feet. The ability works on a quantum level.
        The peculiarity of this force is that the protection of the Accelerator is
        equal to its destructive capabilities and depends on the amount of energy.,
        Vector Shield: thanks to the ability to redirect, working permanently, any
        harmful effects are simply reflected from the Accelerator. Even nuclear weapons
        can not penetrate it, and harmful radiation and heat energy will not harm
        it (although it will have problems with the ability to breathe, "However,
        I will have enough air balloon, the size of a can of hairspray" (c)). He is
        an albino due to the fact that ultraviolet radiation is blocked, because of
        which there is no production of melanin. For defense, the Accelerator subconsciously
        establishes a filter that recognizes the harmful effect or not, and automatically
        redirects vectors if necessary. Things like light, sound and gravity are calibrated
        to pass through the shield, although it can " turn off"Shields can also block
        teleportation and mental effects, but completely taking up computing power
        is something that requires complex calculations (removal of the techno virus
        from the brain), the shield will have to be removed., Redirection: change
        the direction of the vector when touching. The accelerator can send a moving
        object in the opposite direction. Up to the point that the shooter will kill
        himself. With redirection, the Accelerator can break an object (or human)
        into small parts by redirecting each vector in the body. Black Wings: The
        Accelerator loses its usual consciousness, speech changes to angelic, disintegrating
        matter and absorbing light. Vector control is amplified dozens of times, it
        no longer needs to touch the object to change its vector . He gets the opportunity
        to control imaginary vectors, which actually do not exist. He also gets control
        over laws that were not previously available to him, for example, supernatural
        forces that are not explicable from the point of view of science. All vector
        computations now perform the wings themselves and Accelerator no longer requires
        an electrode to communicate with the Misaka network and calculations are much
        faster than he could do himself, not to mention the Misak network. If the
        Accelerator is full of anger, its black wings begin to grow impressive in
        size, up to hundreds of meters. Perhaps his black wings have their own consciousness,
        because most often they attack themselves, or stop attacks. Wings can be divided
        into hundreds to kill at once a group of enemies. In opposition to Teitoku,
        they are described as more "organic".something colossally powerful . In addition
        to the wings, the power of the accelerator itself changes, it attacks something
        invisible and inexplicable, and the power is enough that the single wave emanating
        from his hand, throws the man out of the skyscraper at a speed ten times the
