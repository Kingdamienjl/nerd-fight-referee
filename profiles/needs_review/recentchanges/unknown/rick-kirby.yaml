  attack_potency:
    text: "Large Planet level (Can assist Pre-Canvas Curse Kirby defeat a Dark Matter-possessed\
      \ King Dedede) | Low Multiverse level (Can assist Kirby & 2 fellow Star Allies\
      \ in the canonical defeats of Void Termina, Corrupt Hyness, the Retaliators\
      \ Three Mage-Sisters [at once]. On side content, he can defeat Morpho Knight\
      \ EX, and the stronger incarnations of Void Termina and manage to pull himself\
      \ into the opposite direction on ground when in the weaker ranges of those moves,\
      \ which affect the likes of Kirby, Meta Knight, King Dedede and Bandana Waddle\
      \ Dee in the same way., with Rick using \"basically the same\" moves. Susie\
      \ and Francisca use Feed Me \xB7 Kirby Star Allies.gif|Feed Me *Feed Me: On\
      \ contact, the user shares a recently eaten healing food item with an ally at\
      \ a time, making them be as healed as themselves. Everybody using Friend Hearts-27th\
      \ anniversary twitter video.gif|Rick making use of a Friend Heart *Friend Heart:\
      \ Obtained in Kirby Star Allies, Rick generates a Friend Heart which is then\
      \ quickly thrown to his objective(s). This can be done an unlimited amount of\
      \ times as well as repeatedly. Upon contact or near it, the Friend Heart will\
      \ generate a major change in the empathy of the being(s) affected to the point\
      \ of making them change their morality towards being friends & allies with Rick.\
      \ [https://youtu.be/dFJPGlUjhRI?t=21 The Friend Hearts have also shown to make\
      \ feel objectives extremely happy], [https://youtu.be/gcQcCnCBWMs?t=330 make\
      \ them have a deep appreciation for the one who used a Friend Heart on them],\
      \ generate clothes in others, work on robots, [https://imgur.com/a/pZbLxWB heal\
      \ & purify others], [https://youtu.be/k8f2lw5c30A?t=6421 operate without making\
      \ direct contact to others' bodies as well as affect] [https://youtu.be/l8XC_r3LtVI?t=421\
      \ more than one being at a time]. Friend Hearts were also shown either creating\
      \ or turning small [https://imgur.com/Hrx2S01 areas they reached] [https://imgur.com/vAglOM1\
      \ into Friend Platforms] (Creation or Transmutation), an ability any Star Ally\
      \ may possess, but no character in Star Allies uses Friend Hearts in this manner\
      \ or were aware that this happened. The last function the Friend Hearts have\
      \ is that their sentient targets will immediately be bestowed with the ability\
      \ the generate and use Friend Hearts with all previously mentioned characteristics.\
      \ *Positive Energy Manipulation: Called \"positive energy\" in America and left\
      \ nameless & vague in the original version. It refers to the energies Star Allies\
      \ manipulate while doing Friend Actions and Team Attacks; The white energy with\
      \ colorful [https://imgur.com/BiP7rqd stars around] [https://imgur.com/hbsbSBl\
      \ recognized as \"a mysterious power,\"] which may trigger with a heart-shaped\
      \ wave. What exactly positive energy is is a bit vague, but it's related to\
      \ [https://imgur.com/a/P0mTrRv friendship and companionship], and should be\
      \ the opposite of \"negative energy\" (American name)/ \"[https://imgur.com/esI7seH\
      \ substance of darkness]\" (Original name. Since it can be translated as \"\
      dark matter,\" it is not to be confused with Dark Matter), which is conformed\
      \ by, or related to, [https://imgur.com/mSsaCYx hatred, obsession, jealousy,\
      \ desire], [https://imgur.com/a/hrofIDe and may be invisible] (Hyness says the\
      \ Jamba Heart \"is now being filled,\" but we don't see it being filled with\
      \ physical things at the time). In short, [https://imgur.com/esI7seH they are]\
      \ types of energies that respectively relate to morally good, healthy attitudes\
      \ and evil, unhealthy attitudes. The use of positive energy allows Star Allies\
      \ to form certain energy-based moves, power up attacks, and use certain abilities\
      \ in the first place. The Star Allies' every move is filled with positive energy,\
      \ considering how Void, [https://imgur.com/w1TIMtc a being born] [https://imgur.com/mSsaCYx\
      \ from darkness] when playable. The ability to bestow elemental abilities to\
      \ fellow Star Allies, and their use of certain collaborative techniques, are\
      \ also Friend Abilities. They all use the previously mentioned \"positive energy.\"\
      \ **Friend Action: They all supposedly need 4 allies in total to be done and,\
      \ gameplay wise, a special platform to be used; This are only Game Mechanics,\
      \ the narrative seems to indicate the Star Allies Sparkler to have been made\
      \ by the Star Allies without mentioning said platform, Hyness can use his own\
      \ version of the Friend Circle without it, even when using 3 woods as his partners,\
      \ and the Three Mage-Sisters themselves can use a Friend Circle on their own\
      \ too. ***Friend Circle: The friends form a donut circle by holding each other,\
      \ then they constantly roll forward while being coordinated enough to make jumps\
      \ while they advance. They use this to travel faster on stages and power through\
      \ minor enemies instead of bothering to deal with them with their moves. ***Friend\
      \ Star: [https://imgur.com/puVqY0S Through their collective power, the friends]\
      \ [https://imgur.com/lVZhfld use energies from their bodies that combine to\
      \ create a Friend Star], much like"
