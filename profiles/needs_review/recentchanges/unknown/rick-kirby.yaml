    - field: weaknesses
      value: 'Kirby is still very young and tends to be very naive outside of combat.
        Unlike fellow warriors in the series, outside of their adventures, Kirby''s
        lazy and relaxes with mundane activities. His ability to dream is bestowed
        by the Fountain of Dreams, and if something were to happen to it everyone
        in Dreamland will eventually be restless and irritable. Often celebrates victory
        after notable battles, having been taken by surprise while doing so, even
        at a point in time when he had the ability to sense his enemies. Notable Attacks/Techniques:
        * Inhale: Kirby''s signature technique. By taking a deep breath, Kirby is
        able to suck objects into his mouth like a vacuum, which stretches to fit
        large objects. Kirby can then swallow the object or enemy that is in his mouth
        to absorb it, or spit it out as a star to attack. In most games, stars will
        sink in water (though in Kirby & The Amazing Mirror, Kirby: Squeak Squad,
        and Kirby''s Return to Dream Land, they will travel straight through water
        without sinking). ** Star Spit: After Inhaling an enemy or object, Kirby then
        spits them out as a star-like projectile. ** Hover: Kirby jumps into the air
        and inhales air, causing him to start gently floating. Kirby can usually float
        as long as he wants to, but in Kirby 64: The Crystal Shards and Kirby and
        the Forgotten Land, his amount of jumps are limited. Kirby most of the time
        moves slowly when he''s hovering, but it can help him reach high up areas.
        Pressing A repeatedly, Kirby will be able to hover faster. Kirby cannot perform
        the Hover underwater, but he will be able to briefly move while inflated if
        he Hovers into a body of water. *** Air Gun: While flying with a mouthful
        of air, Kirby then exhales, puffing out a ball of air that will damage most
        regular enemies and some large enemies. It can also be used to destroy Star
        Blocks. In Kirby''s Adventure, the Air Gun move can destroy Ability Stars.
        However, the attack does not usually deal much damage, and does not affect
        mid-bosses or bosses. *Slide: Kirby slides along the ground with one of this
        legs sticking forward to kick any enemy or Star Blocks in the way. It does
        little damage, but can defeat some weaker enemies in 1 hit. Kirby can use
        it to attack enemies that he can''t inhale like Scarfy. It can also be used
        to get under places or quickly destroy blocks. The slide attack doesn''t work
        on mid-bosses and bosses, as it is too weak to dent them; it will push Kirby
        back instead, and he will get hurt. *Water Gun: A technique that may only
        be performed underwater; Kirby shoots a a short-range blast of water that
        can either be a 1-shot blast or will be an indefinite stream of water/bubbles.
        *Guard: Kirby assumes a defensive posture. This reduces damage from stronger
        attacks and generally negates damage from weaker attacks, however it is ineffective
        against grab moves. Category:Fnw21 Gamer Category:Tier 1'
