- id: claim-weaknesses-76956358
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques: Rick's wall climbing \xB7 Kirby's\
    \ Dream Land 3.gif|Wall climbing skills *Acrobatics: Rick has the unique ability\
    \ to climb walls by jumping off of them at a higher altitude, connecting with\
    \ the wall again, and repeating the process, Kirby regularly mounts Rick for this\
    \ purpose. Rick's Inhale and Exhale \xB7 Kirby's Dream Land 2.gif|Inhale and Exhale\
    \ Rick's Inhale and Swallow, and Inhale and Exhale \xB7 Kirby's Dream Land 3.gif|Inhale\
    \ and Swallow, and Inhale and Exhale *InhaleKirby's Dream Land 2 Instruction Booklet\
    \ page 14: Rick inhales in a current of air into his mouth, dragging in regular\
    \ enemies and things to trap them in his mouth. This is similar to Kirby's regular\
    \ Inhale technique. **Swallow: Initially named as Kirby's techniqueKirby's Dream\
    \ Land 2 Instruction Booklet page 9, with Rick using \"basically the same\" moves.\
    \ Rick chooses to swallow the target inhaled. If they had a special ability, Rick\
    \ will either copy it with his Copy Ability, or Kirby will gain it while he is\
    \ mounted over Rick. **Exhale: Rick chooses to exhale the target inhaled, turning\
    \ it into a star-shaped projectile that travels forward. This technique is similar\
    \ to Kirby, King Dedede, and Gooey's Star Split technique, which has extensive\
    \ evidence of truly turning targets into star-shaped projectiles, and Rick's moves/controls\
    \ were said to be \"basically the same\" as Kirby's own. *Copy Ability: By swallowing\
    \ foes or things, Rick can copy their powers. In Kirby Star Allies, Rick showed\
    \ being able to use the powers and equipment gained from Copy Abilities on his\
    \ own while in base, and he was previously shown to regularly use the Burning\
    \ Copy Ability as a stage hazard in Coo's Forest. When Kirby uses certain Copy\
    \ Abilities [Burning, Ice, Needle, Parasol, Spark, Stone, and Clean] and mounts\
    \ Rick, Rick becomes the one using that Copy Ability. Kirby may be passing over\
    \ his own ability to Rick, but this was never stated, and even then, once separated,\
    \ both Rick and Kirby can still use the Stone Copy Ability. Other characters who\
    \ can use Copy Abilities at will are Kirby, Gooey, Kine, Coo, and Shadow Kirby.\
    \ { class=\"wikitable mw-collapsible mw-collapsed\" ! List of Copy"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-f27083b6
  section: abilities
  axis: hax
  text: "Burning Rick \xB7 Kirby's Dream Land 2.gif|Burning Burning Rick \xB7 Kirby's\
    \ Dream Land 3.gif|Burning Burning: Breathes flames with a low range. - Cutter\
    \ Rick \xB7 Kirby's Dream Land 2.gif|Cutter Cutter Rick \xB7 Kirby's Dream Land\
    \ 3.gif|Cutter Cutter: Rick throws Kirby as a boomerang, whose body morphs to\
    \ become of that shape. Rick doesn't appear to be using any special power, unless\
    \ he turned Kirby into a boomerang, despite Rick being the one who consumed the\
    \ Cutter enemy for this Copy Ability. The boomerang Kirby will try to fly back\
    \ to Rick when returning, and Rick can dodge him for Kirby to orbit around Rick\
    \ for as long as he is avoided. - Ice Rick \xB7 Kirby's Dream Land 2.gif|Ice Ice\
    \ Rick \xB7 Kirby's Dream Land 3.gif|Ice Ice: Regardless of the version, the enemies\
    \ affected regularly survive in outer space fine, and the enemies frozen remain\
    \ where they are, even midair, and they can be touched once to be sent forward\
    \ into any direction to be used as a projectile. *Dream Land 2 version: Sends\
    \ a freezing wave around himself that instantly freezes enemies solid, can't move\
    \ while using this attack. *Dream Land 3 version: If Kirby is mounting Rick, Kirby\
    \ will turn into a snowball that shoots out smaller snowballs around himself falling\
    \ off, which instantly freeze enemies solid. Rick can't move while using this\
    \ attack, although he slides a bit if used while he was already in motion. - Needle\
    \ Rick \xB7 Kirby's Dream Land 2.gif|Needle Needle Rick \xB7 Kirby's Dream Land\
    \ 3.gif|Needle Needle: Rick extends quills from his back, but leaves his front\
    \ vulnerable. - Parasol Rick \xB7 Kirby's Dream Land 2.gif|Parasol Parasol Rick\
    \ \xB7 Kirby's Dream Land 3.gif|Parasol Parasol: Takes out a parasol on his nose\
    \ above himself, damaging enemies. If Kirby was mounting Rick, Kirby will turn\
    \ into a ball and will be balanced around and over the parasol. - Spark Rick \xB7\
    \ Kirby's Dream Land 2.gif|Spark Spark Rick \xB7 Kirby's Dream Land 3.gif|Spark\
    \ Spark: Creates a short \"whip\" of electricity to bend in front of him. - Stone\
    \ Rick \xB7 Kirby's Dream Land 2.gif|Stone Stone: Turns into an invincible rolling\
    \ boulder, rolling around at any direction at will, damaging enemies on contact.\
    \ If Kirby was mounting Rick, Kirby will stand up to the boulder and balance himself\
    \ across its movements, never falling off. - Clean Rick \xB7 Kirby's Dream Land\
    \ 3.gif|Clean Clean: Briefly cleans the area in front of him with a blue feather\
    \ duster, harming enemies. } Rick's Stomp \xB7 Kirby's Dream Land 3.gif|Stomp\
    \ *Stomp: Used since Dream Land 3, named in Kirby Star Allies. By jumping over\
    \ enemies or things, Rick stomps them, damaging them while bouncing off. He can\
    \ choose to jump over them to reach greater heights and navigate around. Rick\
    \ can also safely bounce off of certain obstacles like spikes and Gordo. ===Optional"
