        Ribbon *Dark Meta Knight *Daroach *Magolor *Taranza *Susie *The Three Mage-Sisters
        |-|Star Allies Sparkler= The Final Weapon in Star Allies, used to take out
        Void Termina. The Star Allies Sparkler fires projectiles from the tip, fly
        around quickly and efficiently, and spin counterclockwise to avoid all damage
        on a relative scale (Sparkler Turn). Kirby canonically took the lead in the
        center of the Sparkler while his friends rode in the tail, but the leader
        can be rotated to imbue the shots with a different element depending on the
        leader (the technique is called Rider Switch). The Sparkler can fire different
        homing projectiles with varying power depending on charge time. An uncharged
