        \ will never be seen again. He has an affinity for every element and is capable\
        \ of using all magic. Despite only being taught 4 magical elements, on his\
        \ own he learn not only the other 2 elements, but also how to combine them\
        \ to get the rainbow element. Can simultaneous cast 3 different spells at\
        \ once, an insane technique that all but requires three brains to accomplish\u2014\
        and even that is not the true limits of his potential. Successfully achieved\
