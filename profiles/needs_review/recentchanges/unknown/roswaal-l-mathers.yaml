- id: claim-weaknesses-e468ceb9
  section: weaknesses
  axis: weakness
  text: "Altemillion requires magic crystals and an enormous amount of concentration\
    \ to use, thus he is unable to use sixfold magic and is more vulnerable when casting\
    \ it. Roswaal has a curse mark carved onto himself. According to his oath, if\
    \ he is to ever break his promise and harm Subaru Natsuki in any way, he shall\
    \ be engulfed in a purifying flame, scorching his body and tainting his soul,\
    \ never allowing it to return to Od Laguna. Notable Attacks/Techniques: *Magical\
    \ Prowess: Roswaal is compatible with all six magic elements, enabling him to\
    \ use all forms of magic perfectly. Using this talent, Roswaal is considered to\
    \ be the best in the kingdom in terms of mana usage, power, and speed, and is\
    \ recognized to be as strong as an army. However, Roswaal's only flaw is his inability\
    \ to properly use healing magic. *Altemillion: Altemillion is Roswaal's weather\
    \ changing magic which he used to make it snow in Sanctuary. The magic is powerful\
    \ enough to envelop an area with a radius of 60 km in a raging blizzard. *Goa:\
    \ Manifests a blaze of fire to incinerate foes. **Ul Goa: A higher tier version\
    \ of Goa. The user fires a large amount of powerful fire bullets. A powerful flame\
    \ scatters when the bullets land. **Al Goa: A higher tier version of Goa. Manifests\
    \ a massive blaze of fire, much more powerful that a regular Goa. This is the\
    \ spell Roswaal is most skilled at. *El Huma: The user can freeze any liquids\
    \ around him such as blood. *El Fura: The user unleash a powerful gust of wind\
    \ that create enough force to lift heavy object to the air, or can be used to\
    \ shoot objects like bullets. * Jiwald: A Yang Element magic that allows Roswaal\
    \ to fire heat rays from his fingers. It is a heat-wave blade which burns up,\
    \ burns away, and eliminates anything it touches. Jiwald is a straight-line attack,\
    \ which makes it seem like it would have the weakness of being easy to avoid,\
    \ however the heat ray forcefully smashes into things at the speed of light, attacking\
    \ straight at its prey. * Sixfold Magic: Roswaal's trump card which allows him\
    \ to simultaneously cast 6 different magic attacks at the same time, a technique\
    \ that can only be described as requiring six brains to perform. * Cognitive Disruption:\
    \ A spell effect that can be woven into objects, such as cloaks or masks. It inhibits\
    \ people from being able to recognize the person wearing the object that the spell\
    \ is enchanted into. * Magic Composition Rewriting: By simply touching an incoming\
    \ magic attack with any part of his body, Roswaal could easily rewrite the spell's\
    \ composition, completely disassembling the incoming attack and absorb the mana\
    \ through his own gate. He does so by using his own gate to interfere with the\
    \ magic cast by an opponent, without coming into contact with their own gate.\
    \ This skill is mentioned to be extremely hard to pull off and completely unheard\
    \ of to use, during an ongoing battle, as it would require the user to have next\
    \ to no regard for their own life\u2013a small mistake would most certainly result\
    \ in the caster's death. * Flying Magic: By combining the magical power of the\
    \ Earth, Wind, and Yang elements, Roswaal could float in the air, or, if he wished\
    \ to do so, fly. He can reach speeds over 100 km/h which is faster than an earth\
    \ dragon and roughly on par with a flying dragon. * Unnamed Multi-Element Barrier:\
    \ Roswaal is able to create a barrier using all six elements over a large area,\
    \ taking inspiration from Julius Juukulius\u2019s own spiritual arts. However,\
    \ according to Roswaal, unlike Julius\u2019s use of the spell in which the spirits\
    \ bear the burden of combining the elements separately, being able to create this\
    \ barrier took a lot of mana, effort, and mental strain, meaning it is a spell\
    \ he cannot use freely. * Unnamed Foothold Spell: Roswaal is able to hold objects\
    \ in the air by using this spell. It is capable of withstanding the sheer weight\
    \ of a massive iceberg. * Al Shario: A spell that literally brings the stars down\
    \ to earth, massacring his opponents. The speed of the stars is described to be\
    \ almost impossible to evade. * Soul Transcription: A lost magic technique that\
    \ allows a person to transcribe their own soul over another's. By doing this over\
    \ and over to extend their life indefinitely, the user can achieve what Beatrice\
    \ termed as \"subjective immortality\". However, it has one major restriction\
    \ in that for it to work, the person whose soul is overwritten must usually be\
    \ of blood-relation to the caster. The spell was originally created by Echidna\
    \ to gain immortality, but she could not complete it before her demise. Instead,\
    \ it was finished by Roswaal who has used it to survive up to the present era\
    \ by routinely having children for the soul purpose of creating new vessels for\
    \ his soul. Superhuman Physical Characteristics: Several generations of Roswaal\
    \ were physically honed to act at a superhuman level. For instance, Roswaal J.\
    \ Mathers trained for twenty years to defeat the failed Ryuzu Meyer clone Sphinx\
    \ whilst relying only on her physical might and martia"
