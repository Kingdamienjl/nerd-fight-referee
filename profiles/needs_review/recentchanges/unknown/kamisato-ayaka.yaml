power_scale:
  tier:
    text: 'Name: Kamisato Ayaka, Shirasagi Himegimi, Master of Inazuma Kamisato Art
      Tachi Jutsu, Origin: Genshin Impact Gender: Female Age: Early 20s Classification:
      Daughter of the Yashiro Commission''s Kamisato Clan, Menkyo Kaiden of Kamisato
      Art Tachijutsu, Noble, Cryo Allogene'
    source_ids: &id002
    - mediawiki-4694640
    confidence: 0.8
  attack_potency:
    text: Small City level+ (She was capable of combating the Maguu Kenki, which can
      take attacks from Jean, Kaeya and Diluc. Dainsleif states that Ayaka has honed
      her swordsmanship to the "pinnacle of proficiency", being one of the most skilled
      swordmasters in Inazuma even before obtaining her Vision)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Supersonic (Can fight the Maguu Kenki which can keep up with the likes of
      Jean)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class M (Should at least be comparable to characters that fought
      against Maguu Kenki, such as Jean, Kaeya and Diluc)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Small City level+
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Small City level+ (Can tank attacks from Lawachurls and elite members of
      the Fatui, such as Mirror Maidens and Agents)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Ayaka's sword training consists of repeating the same technique
      an additional fifty times every time she fails to execute it perfectly. Being
      one who lacks the raw talent possessed by a prodigy like Tartaglia, she is known
      to have practiced every single one of her techniques. She strikes a minimum
      of a thousand times each before obtaining her Vision. She has since maintained
      this training regime to the present day. She was capable of fighting Maguu Kenki
      alongside Traveler for almost an entire day)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Extended Melee Range normally; Tens of Meters with magic and sword ki
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Above Average, possibly Gifted (Ayaka is not particularly talented in any
      of her endeavors. Still, she has trained and practiced for so long that, despite
      her young age, she has achieved a level of mastery in all manners of study matched
      by few others. Dainsleif calls her sword skills the "pinnacle of proficiency,"
      and she has surpassed the likes of the unrivaled combat prodigy Tartaglia in
      this respect. She also earned praise from Ei regarding her swordsmanship)
    source_ids: *id002
    confidence: 0.8
