  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Stealth Mastery, Summoning, Supernatural
    Willpower, Empowerment, Accelerated Development, Reactive Power Level, and Reactive
    Evolution (Battle, Leveling, and Training; Physical Stats, Magic, and Improved
    Resistances. Humans are able to get more powerful after defeating strong demons
    or even as they are in the middle of battle, even against opponents ontologically
    superior to them, and are able to grow massively in strength in the span of merely
    a day''s time or less, either through resolve, the threat of death, or training,
    or the bonds they hold dear), Non-Physical Interaction, Durability Negation, Healing
    Nullification, Immortality Negation (Type 2, 3, and 7), and Invulnerability Negation
    (Capable of interacting with Demons, which are invisible beings comprised of data
    and information, the fulcrum of the entire verse proper, a concept synonymous
    to souls, minds, and even concepts. Even entities devoid of time and space, and
    nonexistent bodies such as The White can be struck down. Can completely negate
    their invulnerability to conventional weaponry, and the requirement of needing
    to be on a specific informational frequency to harm, as well as Septentriones,
    which require spiritual attacks to harm, and as well as killing undead beings
    and regenerative entities, such as Nagas and Blobs), Reality Warping and Teleportation
    (Capable of warping, teleporting around, and controlling Magatsu-Inaba to an extent),
    Avatar Creation (Capable of creating avatars that are separated from his real
    body to interact with others) Cognitive Physiology (Persona), Magic, consisting
    of: Spatial Manipulation and Durability Negation (via Vorpal Blade, which cuts
    through space), Electricity Manipulation (via Zio skills), Air Manipulation (via
    Garu- skills), Curse Manipulation, Death Manipulation and Darkness Manipulation
    (via Mudoon and Eiga skills. Can also instantly kill all foes who are fearful
    via Ghastly Wail which negates resistances), Energy Manipulation, Damage Boost
    (with critical hits and Curse Amp), Damage Reduction (with Guard), Resistance
    Negation and Existence Erasure (Can use Almighty Attacks, which bypass all barriers
    and reflectors, invulnerability, and resistances. Can even negate an opponents
    resistance to resistance negation with Pierce. Almighty attacks are able to hurt
    someone wielding the Omnipotent Orb, which bends the rules of reality to defend
    the user from attacks, and Reason Bearers, who are able to enforce rules into
    reality to protect themselves from attacks. The Megi- line of spells is capable
    of obliterating opponents with a light that erases them "beyond death"), Statistics
    Amplification (Can increase his Attack, Defense, and Evasion rate significantly
    with Heat Riser), BFR (Can send others to Magatsu-Inaba), Body Control (Magatsu-Izanagi
    is capable of sprouting additional limbs to fight), Buff and Debuff Negation (Can
    nullify all buffs and debuffs with Dekaja and Dekunda), Status Effect Inducement
    which includes: Empathic Manipulation (Can inflict Confusion and Despair with
    Magatsu-Mandala), Fear Manipulation (Can inflict fear with Evil Smile, Atom Smasher,
    and Bloodbath), Sound Manipulation and Power Nullification (via Foolish Whisper,
    which silences and prevents enemies from using abilities) Invulnerability to Light,
    Dark, and Death Manipulation (via Affinities), Absorption of Fire, Ice, Wind,
    and Electricity. Resistance to Death Manipulation, BFR, Probability Manipulation,
    Existence Erasure, Information Manipulation, Mind Manipulation, Soul Manipulation,
    Fusionism and Memory Manipulation (Simply having the potential to awaken a Persona
    grants one a will firm enough to maintain their own existence and individuality
    in the unconscious world, where the concept of the ego does not exist and all
    individuality dissolves into oneness, with ordinary people being immediately overwhelmed
    by the nothingness and scattered throughout all possible worlds by stepping into
    it), Curse Manipulation and Fate Manipulation (Like other characters, he is likely
    able to fight and defeat White Rider, the abstract embodiment of victory and conquest
    whose crown assures his success in all battles and wars. Unbothered by interactions
    with Pisacas, which fate humans to die in the span of nine months), Disease Manipulation,
    Probability Manipulation, Madness Manipulation and Chaos Manipulation (Unaffected
