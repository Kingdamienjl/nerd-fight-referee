  axis: equipment
  text: '*Leviangilma: A divine sword created by Arcana''s divine power. When the
    sword is summoned, Arcana (or a person who she formed a pact with) will remain
    in a state of permanence and cannot be destroyed. Regardless of what power is
    used to attack them, the user will remain unharmed as they aren''t subject to
    any forms of destruction, being eternally unchangingLight Novel Volume 5 Chapter
    41Light Novel Volume 6 Chapter 39. The slashes of this sword can sever the connection
    between two things, including OrderLight Novel Volume 5 Chapter 42. In addition,
    those other than Arcana who try to use and unsheathe Leviangilma will have their
    sources erased across the past, present, and future.Light Novel Volume 5 Chapter
    40 *Locoronotto: A sword born from the lunar snowdrops of Altiertonoa. Anything
    that comes in contact with this sword will freeze, even magic itself.Light Novel
