- id: claim-weaknesses-b2e0f932
  section: weaknesses
  axis: weakness
  text: "He never listens to people. Notable Attacks/Techniques: *The Flow Method:\
    \ Cecilus was born naturally exercising the basis and pinnacle of martial arts;\
    \ the Flow Method. This is a technique in which a warrior consciously uses the\
    \ mana within their Gate to amplify their physical abilities\u2014 strength, speed,\
    \ senses, motor functions, and more\u2014 achieving transcendent, superhuman characteristics.\
    \ *The Divine Miracle of Empty Sky: A sword technique Cecilus picked up from his\
    \ father. By flicking his wrist with extreme speed, the force of his drawn blade\
    \ rises into the sky and splits the clouds overhead. Cecilus described this cloud-cutting\
    \ technique\u2014 which his father spent his life devising\u2014 as a mere flashy\
    \ performance with no real usefulness whatsoever. *The Star Actor's Stage: Cecilus\
    \ utilizes his brain's extraordinary processing power and imagination in order\
    \ to craft a theatre within his mind. He views his surroundings as a stage, others\
    \ as supporting characters, and himself as the leading actor. Through this method,\
    \ he maintains a mental note on the locations of everyone and everything within\
    \ his vicinity, such that he can put on a fantastic show with the best use of\
    \ supporting characters, props, and timing. He can also train himself within his\
    \ own mind, living out days of hard work and performing hundreds of millions of\
    \ practice swings all in a single instant of real time. ==Gallery== Reinhard vs\
    \ Cecilius.jpg|Reinhard vs Cecilius ==Notable Matchups== Victories: *Roronoa Zoro\
    \ (One Piece) Zoro's profile (Speed is equal. Battle has no prep, Cecilus has\
    \ both the Dream and Fiend swords. Zoro has Enma, Battle takes place on an island.\
    \ Both are 5-C and Zoro's key is his latest key. SBA otherwise) *Uzumaki Naruto\
    \ (Naruto (Verse) Naruto's profile (Both were in their strongest key and ceci\
    \ has his swords, speed is equalized, battle took place around Flugel's Tree,\
    \ starting distance was 50m, SBA) Losses: Inconclusive: ==References== ==Notes==\
