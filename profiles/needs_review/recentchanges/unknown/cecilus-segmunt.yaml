    - field: standard_equipment
      value: "*Murasame, The Fiend Sword: One of the most exceptional swords in his\
        \ collection. It is his number one sword and an enchanted blade with a long\
        \ and storied history. It is a sword which specializes in cutting the concept\
        \ of anything's \"Point\"\u2014 the very essence of an object, phenomenon,\
        \ or concept\u2014 which can be used to transfer or erase Curses, break Contracts,\
        \ nullify attacks, and sever Magic. The sword itself had even chosen to cut\
        \ the \"Point\" of its own scent, making it untraceable to the man it hated\
        \ most. Wielding Murasame requires compensation that can leave even the greatest\
        \ of warriors feeling drained, and most people attempting to wield it would\
        \ outright perish. This sword is capable of cutting the very world itself.\
        \ As an enchanted blade, it requires blood to satisfy its hunger for violence,\
        \ and must be used as a killing tool fairly often. It emits bloodlust even\
        \ while sheathed. *Masayume, The Dream Sword: One of the most exceptional\
        \ swords in his collection. It is his number two sword and an enchanted blade\
        \ with a long and storied history. It is a sword which eats away at its wielder's\
        \ soul with even a single swing. This sword is one that is sheathed within\
        \ dreams, and therefore can be drawn at any time if dreamt. The Dream Sword\
        \ has the ability to make the dreams of its wielder into reality, in exchange\
        \ for the blade consuming the dreams and motivation of the wielder, making\
        \ them forget what allowed them to hold the sword in the first place. As Cecilus'\
        \ dreams and motivation can never run dry, he is Masayume's ideal master.\
        \ Like Murasame, Masayume is permitted to cut things beyond the logic of the\
        \ world. As an enchanted blade, it requires blood to satisfy it's hunger for\
        \ violence, and must be used as a killing tool fairly often. It emits bloodlust\
        \ even while sheathed."
      source_id: vsbattles-cecilus-segmunt-recentchanges
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Below Average normally, Extraordinary Genius in combat
      source_id: vsbattles-cecilus-segmunt-recentchanges
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "He never listens to people. Notable Attacks/Techniques: *The Flow Method:\
        \ Cecilus was born naturally exercising the basis and pinnacle of martial\
        \ arts; the Flow Method. This is a technique in which a warrior consciously\
        \ uses the mana within their Gate to amplify their physical abilities\u2014\
        \ strength, speed, senses, motor functions, and more\u2014 achieving transcendent,\
        \ superhuman characteristics. *The Divine Miracle of Empty Sky: A sword technique\
        \ Cecilus picked up from his father. By flicking his wrist with extreme speed,\
        \ the force of his drawn blade rises into the sky and splits the clouds overhead.\
        \ Cecilus described this cloud-cutting technique\u2014 which his father spent\
        \ his life devising\u2014 as a mere flashy performance with no real usefulness\
        \ whatsoever. *The Star Actor's Stage: Cecilus utilizes his brain's extraordinary\
        \ processing power and imagination in order to craft a theatre within his\
        \ mind. He views his surroundings as a stage, others as supporting characters,\
        \ and himself as the leading actor. Through this method, he maintains a mental\
        \ note on the locations of everyone and everything within his vicinity, such\
        \ that he can put on a fantastic show with the best use of supporting characters,\
        \ props, and timing. He can also train himself within his own mind, living\
        \ out days of hard work and performing hundreds of millions of practice swings\
        \ all in a single instant of real time. ==Gallery== Reinhard vs Cecilius.jpg|Reinhard\
        \ vs Cecilius ==Notable Matchups== Victories: *Roronoa Zoro (One Piece) Zoro's\
