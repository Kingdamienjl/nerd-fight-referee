- id: claim-standard-equipment-d67a2b8b
  section: equipment
  axis: equipment
  text: "*Murasame, The Fiend Sword: One of the most exceptional swords in his collection.\
    \ It is his number one sword and an enchanted blade with a long and storied history.\
    \ It is a sword which specializes in cutting the concept of anything's \"Point\"\
    \u2014 the very essence of an object, phenomenon, or concept\u2014 which can be\
    \ used to transfer or erase Curses, break Contracts, nullify attacks, and sever\
    \ Magic. The sword itself had even chosen to cut the \"Point\" of its own scent,\
    \ making it untraceable to the man it hated most. Wielding Murasame requires compensation\
    \ that can leave even the greatest of warriors feeling drained, and most people\
    \ attempting to wield it would outright perish. This sword is capable of cutting\
    \ the very world itself. As an enchanted blade, it requires blood to satisfy its\
    \ hunger for violence, and must be used as a killing tool fairly often. It emits\
    \ bloodlust even while sheathed. *Masayume, The Dream Sword: One of the most exceptional\
    \ swords in his collection. It is his number two sword and an enchanted blade\
    \ with a long and storied history. It is a sword which eats away at its wielder's\
    \ soul with even a single swing. This sword is one that is sheathed within dreams,\
    \ and therefore can be drawn at any time if dreamt. The Dream Sword has the ability\
    \ to make the dreams of its wielder into reality, in exchange for the blade consuming\
    \ the dreams and motivation of the wielder, making them forget what allowed them\
    \ to hold the sword in the first place. As Cecilus' dreams and motivation can\
    \ never run dry, he is Masayume's ideal master. Like Murasame, Masayume is permitted\
    \ to cut things beyond the logic of the world. As an enchanted blade, it requires\
    \ blood to satisfy it's hunger for violence, and must be used as a killing tool\
    \ fairly often. It emits bloodlust even while sheathed."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
