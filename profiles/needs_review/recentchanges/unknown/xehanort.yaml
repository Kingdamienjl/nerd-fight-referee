    battle. Through the use of the Keyblade, the user is granted increased strength,
    speed, durability, and increased magical power, as well as access to special abilities,
    such as turning his Keyblade into a Keyblade Glider. The Keyblade Xehanort currently
    possesses was originally the Keyblade of the Master of Masters, which enables
    the user to see the future through the eye inlaid in the blade.'
