- id: claim-weaknesses-fb049688
  section: weaknesses
  axis: weakness
  text: 'He can be slightly overconfident. His old age somewhat hampers his mobility
    and forces him to rely more on his magic and cunning (though this isn''t much
    of a problem given his feats and ability to transplant his heart or fragments
    of it into other bodies), to travel through time he must give up his body and
    be only a heart. Feats: *Manipulated Terra into letting darkness into his heart.
    *Defeated Terra and transferred his own heart into Terra''s body, becoming Terra-Xehanort.
    *Divided his heart among two other people, namely Braig and Isa. *Overthrew Ansem
    the Wise and stole his name. *Used his Keyblade to divide not only himself but
    at least five other people into Heartless and Nobodies. *Gained the absolute loyalty
    and admiration of Maleficent. *Sent his Heartless self, Ansem, Seeker of Darkness
    back in time to grant the power of time travel to his 16-year-old self (Young
    Xehanort). *Successfully summoned Kingdom Hearts.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
