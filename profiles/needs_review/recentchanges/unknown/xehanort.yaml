    text: Complex Multiverse level (One of the most powerful beings in the series.
      Struck down Master Eraqus and fought on par with Terra, who is one of the most
      physically powerful characters in the series. Effortlessly froze Ventus solid.
      His magical prowess is equal or superior to Aqua, a Keyblade Master specializing
