    \ Manipulation (Can create an exploding orb of gravitational force), Afterimage\
    \ Creation, BFR (Sent Mickey and Ventus to the Ocean Between), Creation (Created\
    \ Vanitas from the darkness within Ventus' heart), Earth Manipulation, Weather\
    \ Manipulation (Caused a storm in the Land of Departure. Summoning Kingdom Hearts\
    \ leads into a noticeable cloud movement), Empowerment, Power Bestowal (Xehanort\
    \ granted his younger self the Keyblade, which made him stronger, and granted\
    \ him the powers of Time Travel), Transformation (Can transform his Keyblade into\
    \ a whip or a Keyblade Glider which allows for Flight and travel between worlds),\
    \ Vehicular Mastery (Over the Keyblade Glider), Summoning (Can summon his Keyblade\
    \ Armors, Can summon Kingdom Hearts with the \u03C7-Blade, Can summon hordes of\
    \ Nobodies and Heartless. His Nobodies hold standard Nobody Physiology plus Transmutation,\
    \ Stealth Mastery, Spatial Manipulation, Gravity Manipulation, Teleportation,\
    \ Rage Power, Body Control, Martial Arts, Afterimage Creation. His Heartless hold\
    \ standard Heartless Physiology), Telekinesis (Capable of controlling an entire\
    \ storm of Keyblades), Master Keyblade Wielder and Proficient Whip User, Self-Sustenance\
    \ (Type 1. Can breathe in space and underwater. According to his reports, Xehanort\
    \ travelled through the Lanes Between without the use of his Keyblade Armor in\
    \ his youth), Attack Reflection (Used this to somehow redirect Braig's arrow shots\
    \ without lifting his hands), Absorption, Transmutation, Corruption (Turned all\
    \ of Ansem's pupils into Heartless and Nobodies), Social Influencing (Manipulated\
    \ Terra into embracing his darkness and fighting Eraqus, As Terra-Xehanort he\
    \ managed to convince his fellow apprentices into supporting his research into\
    \ the \"heart\", its darkness and the Heartless as well as banishing their mentor\
