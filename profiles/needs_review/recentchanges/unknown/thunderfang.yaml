        \ * Fusion Bolt: One of Zekrom's signature moves. Zekrom surrounds itself\
        \ in a giant sphere of light blue electricity and slams into the opponent.\
        \ This move\u2019s power is increased when influenced by Fusion Flare or Blue\
        \ Flare. * Bolt Strike: One of Zekrom's signature moves. Zekrom surrounds\
        \ itself with a great amount of electricity and charges its target. This may\
        \ also leave the target with paralysis. * Thunder: Zekrom fires off a massive\
        \ bolt of electricity from its body. It may also cause paralysis. Its accuracy\
        \ is increased under rain but decreased under sunny conditions. * Charge Beam:\
        \ Zekrom fires off a beam of electricity. It may raise its special attack.\
        \ * Dragon Breath: Zekrom fires off a hazy stream of purple energy from its\
        \ mouth. It may also cause paralysis. * Zen Headbutt: Zekrom focuses some\
        \ psychic power into an orb just above its head and headbutts the opponent.\
        \ It may also cause them to flinch. * Thunder Fang: Zekrom coats its fang\
        \ with electricity and bites the opponent. It may cause paralysis and also\
        \ cause the opponent to flinch. * Dragon Claw: Zekrom coats its claws with\
        \ energy and then slashes at the opponent with them. * Imprison: Using a psychic\
        \ power, Zekrom creates a seal on itself that prevents the opponent from using\
        \ any moves they share with it. * Hyper Voice: Zekrom lets off an extremely\
        \ loud roar that damages the opponent. It also bypasses moves like Substitute.\
        \ * Crunch: Zekrom coats its fangs in a dark energy and the crunches the opponent\
        \ with them. It may also lower their defense. * Thunderbolt: Zekrom fires\
        \ off a bolt of electricity that may paralyze the opponent. * Dragon Rage:\
        \ Zekrom fires off a blue flame of energy that deals consistent damage. *\
        \ Slash: Zekrom slashes at the opponent with its claws. It has a high chance\
        \ of dealing critical damage. * Outrage: Zekrom attacks and rampages for a\
        \ while. If there are multiple opponents each series of attacks will directed\
        \ to one at random. It leaves Zekrom confused afterwards. * Ancient Power:\
        \ Zekrom manipulates nearby rocks with an ancient power and hurls them at\
        \ the opponent. This may also raise all of its stats. ==Gallery== sample_1c303945v08ce6d0f18f8a99452548c99.jpg|Zekrom\
