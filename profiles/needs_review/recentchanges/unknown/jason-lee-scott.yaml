  intelligence:
    text: Genius in combat (Jason is a black belt champion in karate, knows jiujitsu,
      boxing, Kung Fu Karate, kenpo, Taekwondo, judo, shinkido and way more, he has
      defeated foes with over billions of years old fighting experience who are professionally
      trained warriors that engaged into combat with the most skilled and powerful
      warriors across dimensions, some warriors which already fought Ranger teams
      in the past like Goldar Mighty Morphin Power Rangers SFX magazine, Jason can
      hold his own Mighty Morphin Power Rangers S1 Ep17 against both Goldar and Tommy
      as well as defeat professional and extremely skilled ninjas. Jason has also
      trained with Tommy on many weapons such as swords, katanas, daggers, nuchaku
      and more. Jason and the Rangers have a style that involves around anticipating
      attacksSaban's Go Go Power Rangers issue 5, Jason can also memorize fighting
      styles (by seeing em once scaling to Putties) and by doing so he can distinguish
      the differences between people thanks to it Mighty Morphin Power Rangers S2
      Ep4 but also by memorizing ones fighting style Jason can also be able to know
      their moves before they even do them Mighty Morphin Power Rangers S1 Ep59 even
      if said moves already work through anticipation. It is implied the Rangers can
      predict the opponent by seeing their footwork Mighty Morphin Power Rangers S1
      Ep48. Jason can memorize fighting styles like that of Trini which focus on the
      spiritual training of kung Fu and multiple variations of it like the Mantis
      Kung Fu which is a Chinese martial art that works by attacking the vital spots
      of the enemy, Zack's own fighting style which works by fusing multiple fighting
      styles with his dancing moves to increase unpredictability but also Kimberly's
      fighting style which also combines her martial arts with gymnastics which is
      strong enough fighting style to push Zedd's armies back. Rangers can copy and
      mimic each other's fighting styles so perfectly you can't tell them apart Mighty
      Morphin Power Rangers S1 Ep16. The Rangers as seen can create their own fighting
      styles with combining multiple factors, even Bulk and Skull could create their
      own fighting style of cockroach Kung Fu which surprisingly was able to work
      against Rita's elite warriors. Jason and the Rangers are also very intelligent
      on the environment. They can analyze the behavior of the enemy to take advantage
      or also try to discover the weakness of an enemy and exploit it, they also use
      the environment around em to gain an advantage all which are done mid-fight,
      also Jason defeated a monster by gaining advantage of the pitch-black mistSaban's
      Go Go Power Rangers issue 4, by using all those factors the Rangers can adapt
      to scenarios much like the Putties Mighty Morphin Power Rangers Super 7 figures.
      On top of everything the Rangers can heavily increase their skill in very short
      time-frames, even mid-combat, when Rita's ranger putties mimicked their style
      perfectly to the point of knowing and predicting their attacks before they even
      do them, the Rangers couldn't land a hit but instantly adapted to land multiple
      hits after and dodge their attacks, when overpowered at the first time by putties
      and goldar as well as other monsters. The Rangers constantly train to be able
      to easily outskill anything that previous they couldn't beat, another good example
      when Trini couldn't understand or do well the Mantis Kung Fu, she trained a
      little bit after she got motivated and perfectly counter all of Mantis' monster's
      mastery over the Mantis Kung Fu skill or when Billy went from nothing fodder
      of martial arts to beating putties who are extreme martial artists that were
      trained for billion of years to fighting the greatest warriors in every dimension.
      Also needs to be noted, when morphing the Rangers are increased in skill considerably,
      even those who don't know martial arts can be transformed into a lethal weapon,
      the grid also amplifies the intelligence of others and also gives them a preset
      instinct/sixth sense that allows them to know the perfect moveset in a fight
      before they even think of doing a move. On top of everything above, Jason constantly
      learns new moves while he perfects old ones and can fight with opponents that
      know and excel in every martial art to exist but also the Rangers can grow rapidly
      as Kimberly learnt how to fly a plane in minutes Mighty Morphin Power Rangers
      S1 Ep14 and the Rangers were able to beat an elite team of ballhockey, that
      never lost a game in 2 entire years, after training on the sport for some hours
      despite having no knowledge on it. The Rangers are very well trainers as they
      can get their students to the highest level of martial arts in the martial art
      tournamentsMighty Morphin Power Rangers S1 Ep36. The Rangers can take shots
      that are deemed as impossible by the calculations of the Command Center's computers.
      In addition to the above, in Season 2 of Mighty Morphin Power Rangers we also
      learn that the Rangers are capable of imitating attacks, with the same focus
      and accuracy
