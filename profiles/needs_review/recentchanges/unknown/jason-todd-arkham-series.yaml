power_scale:
  tier:
    text: 9-A | At least 9-A, likely higher
    source_ids:
    - vsbattles-jason-todd-arkham-series-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Small Building level (Equal to Batman and is one of the few people who can
      seriously match him. After his "death" Jason was trained by Deathstroke, he
      later gave himself an even more rigorous training regimen than Batman himself
      to become Batman's equal and even possibly surpass the Dark Knight. Can easily
      tear metal structures and break necks and easily defeated Black Mask and his
      men) | At least Small Building level (Arkham Knight's Cobra tank is more dangerous
      than the Batmobile), likely higher (The Cloudburst tank was used by Scarecrow
      and the Arkham Knight to cover all of Gotham with Fear Toxin)
    source_ids:
    - vsbattles-jason-todd-arkham-series-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "At least Supersonic+ (Was shown to be fast enough to dodge the Batmobile\u2019\
      s riot suppressor rounds which are shot from the Batmobile's M61 Vulcan-based\
      \ machine guns, and easily keep up with Batman in combat speed. Repeatedly dodged\
      \ Black Mask's bullets from his Desert Eagles at close range. His running speed\
      \ is superior to Batman, and he can perform the same types of Fear Takedowns\
      \ as him, where he can view bullets from the Heckler & Koch HK416 as incredibly\
      \ slow). Subsonic (Uses grenade launchers) to Supersonic+ with firearms (Uses\
      \ various assault rifles and anti-materiel rifles) | Subsonic with at least\
      \ Supersonic+ combat speed and reactions (Cloudburst tank's speed is comparable\
      \ to the Batmobile although a little bit slower)"
    source_ids:
    - vsbattles-jason-todd-arkham-series-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class 5 (Equal to Batman. Capable of tossing grown men around and
      snapping small metal bars and lift a full-grown man over his head with one hand
      and throw him several meters) | At least Class 100
    source_ids: &id002
    - mediawiki-2508548
    confidence: 0.95
  striking_strength:
    text: Small Building level (Equal to Batman. Can easily lift fully-grown men by
      the neck with just one arm. Could easily punch Batman hard enough to send him
      rolling a few meters across an entire room) | At least Small Building level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: "Small Building level (Jason\u2019s muscles and bones are much harder/denser\
      \ than normal humans due to his training as the second Robin, extended beatings\
      \ from the Joker for over a year, and his immense training after his \u201C\
      death.\u201D Has shown feats of bodily resistance to the point that he took\
      \ Batman\u2019s full unrestrained attacks) | At least Small Building level,\
      \ likely higher (Heavy Cobra tanks like the Knight's are almost invulnerable\
      \ from both penetration and explosive impact from the front and are only vulnerable\
      \ from the rear)"
    source_ids:
    - vsbattles-jason-todd-arkham-series-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Peak Human (Can still fight even while heavily injured)
    source_ids:
    - vsbattles-jason-todd-arkham-series-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, higher with various gadgets and weapons
    source_ids:
    - vsbattles-jason-todd-arkham-series-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Genius (Has deep knowledge in many subjects including Science, Math, Medicine,\
      \ Geography, Criminology, World History, and English. Due to being heavily tutored\
      \ by Bruce and further training after his \u2018death\u2019 his mind has been\
      \ greatly enhanced through years of mental training. Like Batman, he has perfect\
      \ recall, accelerated learning aptitude, eidetic memory, and photographic memory.\
      \ Having trained under Deathstroke, Jason possesses immense skills in military-grade\
      \ tactics, strategies, and protocols. He has the disciplined mind of a true\
      \ military commander with the strategic mind of Deathstroke. His tactical skills\
      \ are equal to that of Batman, and has outsmarted him on multiple occasions)"
    source_ids:
    - vsbattles-jason-todd-arkham-series-unknown
    confidence: 0.6
    notes: auto_repair source extraction
