- id: claim-weaknesses-34c1b937
  section: weaknesses
  axis: weakness
  text: Normal human weaknesses, though has repeatedly survived situations that would
    easily kill regular people. Trauma from his torture by the hands of the Joker
    during almost two years in Arkham Asylum, because of which he's developed an intense
    hatred for Batman, though he eventually overcomes this and saves him in the end.
    Can sometimes get arrogant and incredibly impatient. The Cobra Tank has a rear
    valve weakness, where one well-placed shot will be enough to destroy it completely.
  source_ids: *id003
  decisive: false
  status: unverified
