- id: claim-standard-equipment-fe8aba41
  section: equipment
  axis: equipment
  text: '*Arsenal mask: Roy wears a dark red mask as his heroic alter-ego, Arsenal.
    It is made from a compressible micro-fabric and can effectively to conceal Roy''s
    identity without any restrictions on his visual field. *Arsenal suit: As Arsenal,
    Roy wears a protective suit designed by Lodai to hide his identity from his enemies
    when fighting crime. It is unknown what materials the suit is comprised of, with
    the exception of kevlar. After faking his death, Roy gave the suit to Thea Queen,
    claiming that red looked better on her. After returning to Star City to stop the
    Ninth Circle; Roy took back the suit. *Quiver: Roy has a brown quiver to carry
    his arrows. *Customized hunting arrows: Like Oliver, Roy uses customized arrows.
    *Trick arrows: In the battle against Slade Wilson''s army, Roy used trick arrows
    with Mirakuru cure heads. He also uses other trick arrows as Arsenal. *Customized
    recurve bow: Roy was trained in archery by Oliver and uses a red bow in battle,
    both for shooting and close-combat. *Escrima sticks: As his vigilante alter-ego,
    Arsenal, Roy carries two escrima sticks strapped to both his lower legs. He used
    them to fight Simon Lacroix and Digger Harkness. *Flechettes: Roy received his
    first flechette after the Arrow rescued him from the Savior, which he kept as
    a reminder of the incident. He later painted the flechette red and used it as
    a way to contact the Arrow before discovering Oliver''s identity and joining Team
    Arrow. As Arsenal, Roy carries multiple red flechettes strapped to his left thigh.
    *Throwing knives: Roy has four throwing knives strapped around his right thigh.
    *Combat knife: Roy carries a combat knife attached to the back of his belt.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-5cf64fcb
  section: power_scale
  axis: battle_iq
  text: Above Average. Roy is intelligent and an accomplished tactician; he was able
    to come up with a plan to exonerate Oliver of being the Arrow and later fake his
    own death. Roy is also an extremely capable scout, combined with his training;
    Oliver regularly sent him out alone to scout Star City to keep track of criminal
    activities. Roy was capable of even tracking Nyssa al Ghul, a high figure in the
    League of Assassins, without her knowing. Roy is also good at math, able to deduce
    alongside Felicity Smoak the next number needed in the decoding of Malcolm's box.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-83b668c9
  section: weaknesses
  axis: weakness
  text: '*Bloodlust: Since being revived by a Lazarus Pit, Roy was left with an insatiable
    bloodlust and the impulse only subsided for a month at a time if he gave in to
    it. The only way to permanently end it is to take out the one who killed him.
    Even after Nyssa gave Roy the Lotus elixir, the bloodlust urges still remained.
    Roy hypothesized that the Mirakuru serum''s past presence in his system made it
    impossible for the Lotus to cure him. *Mirakuru side effects: Although the Mirakuru
    enhanced Roy''s physical abilities, it greatly deteriorated his mental stability.
    Roy occasionally experienced violent and sometimes uncontrollable moments of rage.
    However, unlike Slade Wilson, Roy usually had much better control over these impulses.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-77770d52
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics (Even before his tenure as Oliver Queen's\
    \ prot\xE9g\xE9 and a vigilante, Roy is in top physical condition. Due to his\
    \ youth, Roy is faster than Oliver. After his training, Roy's reflexes became\
    \ sharp enough for him to catch an arrow in midair), Acrobatics (Roy's former\
    \ rough and criminal lifestyle forced him to learn free running to better escape\
    \ his pursuers. He also uses his natural athletic and acrobatic skills to either\
    \ escape from or fight off his opponents. Roy is proven to be more agile and nimble\
    \ than Oliver due to his much longer experience of using these skills on the streets.\
    \ Since re-joining Team Arrow, Roy's skills have seemingly improved to the point\
    \ of mastery), Weapon Mastery (Roy is an adept archer, possibly coming second\
    \ to only Green Arrow himself. He is also a master stickfighter, as well as a\
    \ marksman), Martial Arts (Having grown up in the Glades, Roy has taught himself\
    \ to fight back. He often employs acrobatics to catch opponents off-guard and\
    \ even cause considerable damage to them. Roy was able to fight off two thugs\
    \ at the same time, albeit not as efficiently as more seasoned combatants; such\
    \ as Oliver, Malcolm Merlyn, and Sara Lance. After being trained by Oliver and\
    \ becoming a vigilante, Roy developed an expertise in martial arts, incorporating\
    \ escrima, capoeira, wing chun, judo, sambo, jeet kune do, and taekwondo into\
    \ his preferred style), Stealth Mastery Superhuman Physical Characteristics (With\
    \ Mirakuru, Roy was granted enhanced speed, strength, durability, and stamina),\
    \ Regeneration (Mid-Low) (Roy was able to quickly recover from wounds that would\
    \ be deemed fatal for any normal human being. Bullets/stab wounds and high velocity\
    \ impacts have no ill effects on Roy and would completely heal from a span of\
    \ a few hours or less. However, like all Mirakuru-enhanced humans, Roy was not\
    \ able to regenerate missing limbs/organs. Fatal wounds such as a bullet to the\
    \ head could kill Roy and regular dosages of strong poisons like Tibetan pit viper\
    \ venom could heavily sedate him), Enhanced Senses (It can be assumed that like\
    \ Slade Wilson, the Mirakuru greatly enhanced Roy's senses, allowing him to see,\
    \ hear, and smell far better than any normal human could)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
