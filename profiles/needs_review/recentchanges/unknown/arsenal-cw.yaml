      value: "Superhuman Physical Characteristics (Even before his tenure as Oliver\
        \ Queen's prot\xE9g\xE9 and a vigilante, Roy is in top physical condition.\
        \ Due to his youth, Roy is faster than Oliver. After his training, Roy's reflexes\
        \ became sharp enough for him to catch an arrow in midair), Acrobatics (Roy's\
        \ former rough and criminal lifestyle forced him to learn free running to\
        \ better escape his pursuers. He also uses his natural athletic and acrobatic\
        \ skills to either escape from or fight off his opponents. Roy is proven to\
        \ be more agile and nimble than Oliver due to his much longer experience of\
        \ using these skills on the streets. Since re-joining Team Arrow, Roy's skills\
        \ have seemingly improved to the point of mastery), Weapon Mastery (Roy is\
        \ an adept archer, possibly coming second to only Green Arrow himself. He\
        \ is also a master stickfighter, as well as a marksman), Martial Arts (Having\
        \ grown up in the Glades, Roy has taught himself to fight back. He often employs\
        \ acrobatics to catch opponents off-guard and even cause considerable damage\
        \ to them. Roy was able to fight off two thugs at the same time, albeit not\
        \ as efficiently as more seasoned combatants; such as Oliver, Malcolm Merlyn,\
        \ and Sara Lance. After being trained by Oliver and becoming a vigilante,\
        \ Roy developed an expertise in martial arts, incorporating escrima, capoeira,\
        \ wing chun, judo, sambo, jeet kune do, and taekwondo into his preferred style),\
        \ Stealth Mastery Superhuman Physical Characteristics (With Mirakuru, Roy\
        \ was granted enhanced speed, strength, durability, and stamina), Regeneration\
        \ (Mid-Low) (Roy was able to quickly recover from wounds that would be deemed\
        \ fatal for any normal human being. Bullets/stab wounds and high velocity\
        \ impacts have no ill effects on Roy and would completely heal from a span\
        \ of a few hours or less. However, like all Mirakuru-enhanced humans, Roy\
        \ was not able to regenerate missing limbs/organs. Fatal wounds such as a\
        \ bullet to the head could kill Roy and regular dosages of strong poisons\
        \ like Tibetan pit viper venom could heavily sedate him), Enhanced Senses\
        \ (It can be assumed that like Slade Wilson, the Mirakuru greatly enhanced\
        \ Roy's senses, allowing him to see, hear, and smell far better than any normal\
        \ human could)"
