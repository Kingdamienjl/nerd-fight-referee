    - field: standard_equipment
      value: 'Arsenal mask: Roy wears a dark red mask as his heroic alter-ego, Arsenal.
        It is made from a compressible micro-fabric and can effectively to conceal
        Roy''s identity without any restrictions on his visual field., Arsenal suit:
        As Arsenal, Roy wears a protective suit designed by Lodai to hide his identity
        from his enemies when fighting crime. It is unknown what materials the suit
        is comprised of, with the exception of kevlar. After faking his death, Roy
        gave the suit to Thea Queen, claiming that red looked better on her. After
        returning to Star City to stop the Ninth Circle, Roy took back the suit.,
        Quiver: Roy has a brown quiver to carry his arrows., Customized hunting arrows:
        Like Oliver, Roy uses customized arrows., Trick arrows: In the battle against
        Slade Wilson''s army, Roy used trick arrows with Mirakuru cure heads. He also
        uses other trick arrows as Arsenal., Customized recurve bow: Roy was trained
        in archery by Oliver and uses a red bow in battle, both for shooting and close-combat.,
        Escrima sticks: As his vigilante alter-ego, Arsenal, Roy carries two escrima
        sticks strapped to both his lower legs. He used them to fight Simon Lacroix
        and Digger Harkness., Flechettes: Roy received his first flechette after the
        Arrow rescued him from the Savior, which he kept as a reminder of the incident.
        He later painted the flechette red and used it as a way to contact the Arrow
        before discovering Oliver''s identity and joining Team Arrow. As Arsenal,
        Roy carries multiple red flechettes strapped to his left thigh., Throwing
        knives: Roy has four throwing knives strapped around his right thigh., Combat
        knife: Roy carries a combat knife attached to the back of his belt.'
      source_id: mediawiki-508276
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Above Average. Roy is intelligent and an accomplished tactician; he was
        able to come up with a plan to exonerate Oliver of being the Arrow and later
        fake his own death. Roy is also an extremely capable scout, combined with
        his training; Oliver regularly sent him out alone to scout Star City to keep
        track of criminal activities. Roy was capable of even tracking Nyssa al Ghul,
        a high figure in the League of Assassins, without her knowing. Roy is also
        good at math, able to deduce alongside Felicity Smoak the next number needed
        in the decoding of Malcolm's box.
      source_id: mediawiki-508276
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Bloodlust: Since being revived by a Lazarus Pit, Roy was left with an
        insatiable bloodlust and the impulse only subsided for a month at a time if
        he gave in to it. The only way to permanently end it is to take out the one
        who killed him. Even after Nyssa gave Roy the Lotus elixir, the bloodlust
        urges still remained. Roy hypothesized that the Mirakuru serum''s past presence
        in his system made it impossible for the Lotus to cure him., Mirakuru side
        effects: Although the Mirakuru enhanced Roy''s physical abilities, it greatly
        deteriorated his mental stability. Roy occasionally experienced violent and
        sometimes uncontrollable moments of rage. However, unlike Slade Wilson, Roy
        usually had much better control over these impulses.'
      source_id: mediawiki-508276
      provider_id: vsbattles
      authority: high
      confidence: 0.75
