  section: equipment
  axis: equipment
  text: "{{#tag:tabber| -Rings= *Damage Transferal (Up to 1-C (6-D) AP with Rings.\
    \ [https://imgur.com/a/GBTQLJw Rings completely shield the user from harm so long\
    \ as they have at least 1 in their possession.] Upon taking an instance of damage,\
    \ a varying amount will scatter from the one who collected them [https://imgur.com/a/4sZtT4O\
    \ with higher durability causing less to drop]. Rings have repeatedly shown the\
    \ capacity to protect Base characters [https://imgur.com/z1gqQFi from villains\
    \ far stronger than them], ranging from the likes of Void to Titans such as Supreme)\
    \ **Healing & Stamina Recovery (Ring Energy revitalizes the wielder and restores\
    \ energy, [https://imgur.com/D1hT5qN as noted with Silver wanting to use some\
    \ to replenish his energy]. Rings are referred to by The End as being vitality)\
    \ **Statistics Amplification ([https://imgur.com/a/yGZWnbq Ring Energy in the\
    \ Sonic Riders series can amplify the user\u2019s speed by nearly 2x and increases\
    \ their Boost duration by nearly 2 seconds when going from level 1 to 3]. A similar\
    \ event occurs in Sonic Riders: Zero Gravity, where collecting enough Rings allows\
    \ for a Gear Change, which enhances the Extreme Gear by allowing more Rings to\
    \ be collected, or a higher speed cap, or other boosts) -Adventure Era= {{#tag:tabber|\
    \ -With Item Boxes= Elemental Shields *Elemental Variety, Forcefield Creation\
    \ & Damage Reduction (All Shields are defensive tools meant to negate an instance\
    \ of damage against its wielder) **Underwater Breathing (Type 3; The Aqua Shield\
    \ [https://cdn.imgchest.com/files/f21728565dd5.png allows the user to breathe\
    \ underwater without worrying about air]) **Additional Jumps, Electricity Manipulation\
    \ & Limited Magnetism Manipulation, Resistance to: Electricity & Energy (With\
    \ the Thunder Shield, which [https://cdn.imgchest.com/files/d5d8963fb7a4.png provides\
    \ its user with an additional mid-air jump, the ability to attract nearby Rings],\
    \ and protection from energy and electrical attacks) **Fire Manipulation & Resistance\
    \ to Fire (The Fire Shield is a barrier composed of flames which can affect the\
    \ environment, like burning bridges made of wood, and [https://cdn.imgchest.com/files/f21728565dd5.png\
    \ protects the user from fire attacks]) **Aura (Explosive), Fire Generation &\
    \ Self-Destruction/Explosion Inducement (With Red Burst, [https://cdn.imgchest.com/files/8f6ace09bd6f.gif\
    \ which surrounds the user with an aura of fire]. [https://cdn.imgchest.com/files/ff421d745cbf.gif\
    \ Users are able to cause a detonations of fiery energy that harm nearby opponents\
    \ while leaving them and the Wisp unscathed]) **Flight (With Crimson Eagle, [https://cdn.imgchest.com/files/c755d3534e1e.gif\
    \ which grants the user flight for a limited time]) **Pseudo-Black Hole Creation,\
    \ Gravity Manipulation, Absorption, Levitation & Transmutation (With Indigo Asteroid,\
    \ [https://cdn.imgchest.com/files/2ad09b602165.gif which will break down matter\
    \ and convert it into more substance for the Asteroid Ring] that expands from\
    \ and surrounds the user) **Bodily Weaponry (Conventional) & Surface Scaling (With\
    \ Pink Spikes, [https://cdn.imgchest.com/files/35702022dd2e.gif transforming the\
    \ user into a ball covered in spikes that enable clinging to surfaces]) A full\
    \ list of all Pets in Sonic Speed Simulator can be found here and a full list\
    \ of all Trails in Sonic Speed Simulator can be found here. -Extreme Gear= Rouge\
