  speed:
    text: "Peak Human (Comparable to Arthur and John. Can aim and shoot incredibly\
      \ quickly; he shot and killed four guards in rapid succession while walking,\
      \ shot John's binoculars with a semi-automatic pistol from over 100 yards, without\
      \ any proper preparation, and shot Micah before he could react), Varies, Subsonic+\
      \ to Supersonic attack speed with firearms, possibly higher with high-velocity\
      \ ammunition (Older revolvers had a muzzle velocity ranging from 700 to 1060Venturino,\
      \ Mike. \"Old West Pistol Power, A Baffling Experience.\" American Handgunner.\
      \ https://americanhandgunner.com/handguns/old-west-pistol-power/ (Archived from\
      \ the original on June 26, 2025) feet per second, depending on the model and\
      \ ammunition used, with the \"Schofield\" model of the Smith & Wesson Model\
      \ 3 having a purported average muzzle velocity of 730 to 760 ft/s.Maccar, Dave.\
      \ \"Smith & Wesson Schofield Revolver: The Gun That Almost Beat the Colt Peacemaker\
      \ and Led to the .45 ACP.\" Outdoor Life, Oct 18, 2024. https://www.outdoorlife.com/guns/smith-wesson-schofield-revolver/\
      \ ([Archived from the original] on Nov 5, 2024)\".45 Schofield.\" Wikipedia.\
      \ https://en.wikipedia.org/wiki/.45_SchofieldBarnes, Frank C. (1997) [1965].\
      \ McPherson, M.L. (ed.). Cartridges of the World (8th ed.). DBI Books. pp. 270,\
      \ 275. ISBN 0-87349-178-5\".45 S&W Schofield.\" (PDF) Accurate Powder (Archived\
      \ from the original on Sep 28, 2007) The semi-automatic pistol he carries is\
      \ described as a revolutionary new German pistol with recoil that \"kicks like\
      \ a mule\"Red Dead Redemption - Gunsmith: Semi-automatic Pistol description\
      \ *\u201CRevolutionary new German pistol. Can fire in rapid succession, though\
      \ it kicks like a mule.\u201D and should have an even higher muzzle velocity,\
      \ likely almost 400 m/sPopenker, Maxim. \"7.65\xD725 Borchardt.\" https://modernfirearms.net/en/cartridge/7-65x25-borchardt-2/\
      \ (Archived from the original on Oct 20, 2018)Based on real equivalents: *\"\
      Schofield\" revolver: Subsonic+ (216.408 m/s to 261.823 m/s or 710 to 859 ft/s)\
      \ **Average: 222.504 to 231.648 m/s or 730 to 760 ft/s *Semi-automatic Pistol:\
      \ Supersonic (Based on the Borchardt C-93; 396.24 to 400 m/s or 1300 ft/s to\
      \ 1312.34 ft/s) *General revolver"
    source_ids:
    - vsbattles-dutch-van-der-linde-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: 'At most Class 5 (On par with Arthur and John, but somewhat weaker. Might
      have more brute strength than Micah. Carried Javier Escuella for a significant
      distance while facing harsh terrain and heavy fire.Red Dead Redemption 2 - Chapter
      5: "Guarma," Mission: "A Kind and Benevolent Despot" Drowned Angelo Bronte with
      a single arm. Leaped from one building to another, which requires a little bit
      less than this amount of force)'
