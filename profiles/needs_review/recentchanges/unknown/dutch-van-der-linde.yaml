  intelligence:
    text: "Gifted (Although having never undergone formal schooling, Dutch Van der\
      \ Linde is one incredibly charismatic and brilliant man of the most intelligent\
      \ stature, with incredible understanding of philosophy, politics, history, and\
      \ the general psyche of man. He successfully ran one of America\u2019s most\
      \ notorious criminal gangs for more than two decades, all while on the run,\
      \ meticulously planning grand heists, escapes, and operations that many would\
      \ only dream of planning. Dutch was a supreme manipulator and strategist; a\
      \ great orator and an inspiring leader who could convince almost anyone to follow\
      \ his logic and fight by his side until their very last breath, despite circumstances.\
      \ He could improvise the most intricate of schemes on the drop of a hat, keenly\
      \ aware of the modern world which was eclipsing the last days of the Old West.\
      \ Many believed it was Dutch van der Linde who was truly responsible for the\
      \ gang\u2019s success and the fact it managed to survive as long as it did;\
      \ making him the most dangerous mind a outlaw could ever be)"
    source_ids:
    - vsbattles-dutch-van-der-linde-unknown
    confidence: 0.6
    notes: auto_repair source extraction
