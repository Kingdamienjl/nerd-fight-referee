  intelligence:
    text: As a member of the Olympos XII, Apollomon is one of the most skilled and
      powerful combatants in the Digital World, being on par with the Royal Knights
      in terms of power and technique. He assaults foes with a barrage of physical
      blows and solar-powered projectiles that keep his enemies from gaining an advantage
      at any range, making it terribly difficult to gain any breathing room. He has
      also shown his cunning on occasion, nearly managing to rebel against Bagramon
      without his notice but was caught by the other Death Generals and turned into
      Apollomon Whispered. However, he's known to be incredibly prideful and confident
      in his abilities and won't cooperate with others he hasn't acknowledged. Coronamon
      is young, however is still a very talented fighter. Firamon and Flaremon are
      extremely skilled combatants.
    source_ids:
    - vsbattles-apollomon-unknown
    confidence: 0.6
    notes: auto_repair source extraction
