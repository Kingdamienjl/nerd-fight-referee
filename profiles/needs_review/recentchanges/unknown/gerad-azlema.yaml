- id: claim-standard-equipment-0e956205
  section: equipment
  axis: equipment
  text: '*Cursed Shield : A cursed tool which curses those who attack the wielder
    dealing back twice the damage the wielder receives back to the attacker. The curse
    targets the source (concept) of the attacker and is invoked even when attacks
    are blocked by the shield, whether the shield is in the wielder''s hand at that
    point. While the curse is in effect, the wounds of the opponent are unable to
    be healed though it seems the same might also apply to the wielder. Due to the
    curse targeting the source, f enough damage is dealt to destroy any of the gems
    on the shield or the shield itself, the curse returns enough damage to destroy
    the source of the attacker. *Cursed Sword: Another cursed tool Gerard possesses.
    Despite being a sword, the blade is extremely fragile. When used to attack or
    block attacks and the blade chips, it deals damage wounding the attacker and seems
    to be centered at their heart.'
  source_ids: *id003
  decisive: false
  status: unverified
