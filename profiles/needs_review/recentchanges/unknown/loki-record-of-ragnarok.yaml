- id: claim-weaknesses-8b440ae5
  section: weaknesses
  axis: weakness
  text: "Extremely arrogant (Ragnarok was a joke to him until Round 3 and told Simo\
    \ the way his divine weapon worked although kept stuff about it a secret). Loved\
    \ Brunhilde to an obsessive degree to the point where he framed Siegfried out\
    \ of pure jealousy and being the main motivation for fighting against Simo. Had\
    \ a habit of underestimating his opponent. Notable Attacks/Techniques: Heimskringla\
    \ (Clown's Ring): Loki's ring allows him to touch something or someone using the\
    \ power in his fingertips, known as The Consumer, he can absorb their data. With\
    \ this information stored, he can recreate whatever he has absorbed using the\
    \ power in the palms of his hands, known as Seed of Deception, whether they are\
    \ objects, animals, humans, or gods. When doing so, his palms emit a dark mist,\
    \ allowing him to manifest the copies directly from the mist or through small\
    \ spheres of energy that transform into the desired copies. The copies can also\
    \ be summoned through an expanded dark mist, which both obscures the enemy's field\
    \ of vision and serves as a medium for mass creation, as any point reached by\
    \ the mist can become a new copy. Although Loki can store an infinite number of\
    \ copies, he can normally maintain only up to five active on the battlefield at\
    \ the same time, a state known as Heimskringla, due to his own natural limitations.\
    \ However, this restriction can be removed through Andvaranaut. The clones do\
    \ have some of the original copies such as the copy Thor having his hammer and\
    \ generating lightning although they can't copy complex things. He has 3 hidden\
    \ abilities to do with this technique. Shield of Skuld: Loki uses Heimskringla\
    \ to conjure a piece of a stonewall with an ornate wooden door with glass windows\
    \ in it to defend himself. Shield of Skuld has decent durability, since it was\
    \ able to pause Simo H\xE4yh\xE4's Lemmink\xE4inen for a few seconds. *Hve\xF0\
    rung (False Divine Shadow): The first of three hidden abilities. This allows Loki\
    \ to create one copy of himself that's equal to power as him. This copy does not\
    \ just exactly look like the original Loki, but also retains every aspect of his\
    \ personality, knowledge, and thinking process, making it virtually impossible\
    \ to tell apart from Loki. It always inherits Loki's moves and skills such as\
    \ Shield of Skuld. *N\xEDu Heimr Auga (Peephole of the Nine Worlds): The second\
    \ of three hidden abilities. Loki can look through the eyes of his created clones.\
    \ When Loki uses this technique, his pupils visibly dilate. *Endurl\xEDfa (Gate\
    \ of Resurrection): The third of three hidden abilities. Loki can switch places\
    \ with any of the active copies, allowing him to instantly teleport to that location.\
    \ Using this forcibly dissolves the target copy in the process although it also\
    \ requires Loki\u2019s consciousness to be connected to the copy, making it unusable\
    \ on already dead copies. ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ ==References== Category:Characters Category:Record of Ragnarok Category:Immortals\
    \ Category:Antagonists Category:Invulnerability Users Category:Weapon Masters\
    \ Category:Shapeshifters Category:Duplication Users Category:Teleportation Users\
    \ Category:Geniuses Category:Gods Category:Telekinesis Users Category:Matter Users\
    \ Category:Male Characters Category:Manga Characters Category:Camouflage Users\
    \ Category:Portal Users Category:Flight Users Category:Tricksters Category:Supernatural\
    \ Willpower Users Category:Summoners Category:Tragic Characters Category:Anime\
    \ Characters Category:Chain Users Category:Hook Users Category:Door Users Category:Ring\
    \ Users Category:Enhanced Senses Users"
