    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics, Social Influencing, (Successfully\
        \ fooled and lured children into a back room) Stealth Mastery, (It\u2019s\
        \ far better than the animatronics\u2019 mastery of this ability, since even\
        \ they couldn\u2019t keep up with his antics, as seen in the SAVETHEM minigame\
        \ of Five Nights at Freddy\u2019s 2) Effect Field Projection, (Prevented the\
        \ animatronics from escaping the Safe Room) Possible Teleportation (Afton\
        \ seems to come and go whenever he wants to. If this isn\u2019t the case,\
        \ then it should go into his speed otherwise, being too fast for the animatronics\
        \ to keep up with) | Should have many of the same as before, Immortality,\
        \ (Types 2 to an extent and 7) Self-Sustenance, (Types 1, 2, and 3) Enhanced\
        \ Senses, (Can hear if the alarm is going off all the way down at the office,\
        \ no matter how far he is from it) Inorganic Physiology, (All types) Minor\
        \ Resistance to Fire Manipulation, (Managed to survive the burning of Fazbear\u2019\
        s Fright, ultimately still being damaged by it) Light Manipulation and Darkness\
        \ Manipulation, (Can cause only certain parts of his body to glow at a time)\
        \ Possible Illusion Creation, (Could be responsible for the summoning of the\
        \ Phantom animatronics, but the evidence for this isn\u2019t very strong,\
        \ as in Ultimate Custom Night, you can play a night without any of them and\
        \ still have Springtrap) Technopathy, (Can fiddle with the camera) Minor Intangibility,\
        \ (Can pass right through vent snares in Ultimate Custom Night, but this is\
        \ inconsistent. In Five Nights at Freddy\u2019s 3, he was not able to do that.\
        \ These snares are indeed metal, like the vent door itself. When animatronics\
        \ like Withered Chica and Mangle encounter the activated snare, it makes a\
        \ banging sound, which wouldn\u2019t make sense if it were lasers)"
      source_id: character-stats-profiles-dolly-case-animatronics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "Room level+. (Killed many helpless children with ease. Effortlessly\
        \ ripped Freddy, Bonnie, Chica, and Foxy to pieces in Five Nights at Freddy\u2019\
        s 3) | At least Room level+, likely higher. (His bare strength from his corpse\
        \ alone combined with the animatronic\u2019s power should make him far more\
        \ powerful than he was before. He\u2019s also able to instantly kill a fully\
        \ grown human) | At least Universe level+ (Can defeat Animdude with the help\
        \ of a few other animatronics, who calls himself the storyteller and the puppet-master,\
        \ meaning he likely created the entire game and universe. With his defeat,\
        \ the game ends right on the spot) likely Multi-Universe level. (Animdude\
        \ also acts like the creator of the entire Five Nights at Freddy's franchise.\
        \ FNaF World, the original horror canon, and the novel canon, are entirely\
        \ separate realities, so it\u2019s pretty fair to say there are multiple universes\
        \ in the Five Nights at Freddy\u2019s franchise that were created by Animdude.\
        \ He also should scale to Freddy, who defeated Scott\u2019s Head all by himself,\
        \ He acts as if created the universe of FNAF 57: Freddy in Space, and every\
        \ other game before it. He even continued to list games he would make in the\
        \ future)"
      source_id: character-stats-profiles-dolly-case-animatronics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: "At least Superhuman. (Outpaces Freddy, Bonnie, Chica, and Foxy) | At\
        \ least Superhuman. (Should scale to the other animatronics) | At least Superhuman.\
        \ (Scales to Chica, who is capable of dodging lasers from Chica\u2019s Magic\
        \ Rainbow and petals from Sunflowers in the Chica\u2019s Magic Rainbow minigame.\
        \ Also scales to Foxy, who can pilot his airplane around several missiles\
        \ that fire at similar speeds from Souldozers) Up to FTL. (Scales to Freddy,\
        \ who\u2019s capable of constantly dodging light beams and lasers from the\
        \ likes of Scott\u2019s Head and several of his other robots)"
      source_id: character-stats-profiles-dolly-case-animatronics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
      value: "Unknown, up to Wall level. (His Spring Bonnie suit along with his mutilated\
        \ corpse inside of it managed to survive the burning of Fazbear\u2019s Fright.\
        \ However, he was absolutely demolished in the springlocks of the Spring Bonnie\
        \ suit. Pinpointing his true durability is likely lurking in between those\
        \ two feats) | Wall level. (Should also scale to the other animatronics. While\
        \ he did survive the burning of Fazbear\u2019s Fright, his animatronic body\
        \ was destroyed for good in the burning of Freddy Fazbear\u2019s Pizza Place)\
        \ | At least Universe level+, likely Multi-Universe level."
      source_id: character-stats-profiles-dolly-case-animatronics
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Very impulsive of his actions, as he went into the Spring Bonnie suit\
        \ without even considering the life-threatening consequences. | Same as before,\
        \ since he went to Freddy Fazbear\u2019s Pizza Place in Freddy Fazbear\u2019\
        s Pizza Simulator without any consideration for any dangers ahead of him.\
        \ Very weak to audio distractions close to him. He takes very predictable\
        \ paths. Sealing vents can stop his predictable path towards you. | There\u2019\
        s only so many chips and bytes Purple Guy can use at a time, and a number\
        \ of them wear off after a period of time. Notable Attacks / Techniques: Horror\
        \ canon: *Jumpscare:: Springtrap lunges and screams at his opponent, which\
        \ can instantly kill a fully grown man. FNaF World: *Slasher: (Purpleguy)\
        \ He wields a sword that is capable of doing devastating damage. It only has\
        \ a 1/10 chance of working though. *Bite 2: (Springtrap) He bites the opponent,\
        \ dealing more crucial damage than the first version of the attack. *Springlocks:\
        \ (Springtrap) Does deadly damage to every opponent near him. *Speed Song:\
        \ (Purpleguy) Temporarily increases his and his teammates' speed. *Hocus Pocus:\
        \ (Purpleguy) Temporarily weakens opponents. *Rainy Day: (Springtrap) Temporarily\
        \ lowers his opponents\u2019 durability. *Chips - These items can upgrade\
        \ Purpleguy/Springtrap and his allies or provide new abilities. **Headstart\
        \ Speed - Increases his speed for a period of time. ***Endless Speed - Gives\
        \ him a boost of speed permanently. **Headstart Defense - Increases his durability\
        \ for a period of time. ***Endless Defense - Gives him a boost of durability\
        \ permanently. **Headstart Strength - Increases his strength for a period\
        \ of time. ***Endless Strength - Gives him a boost of strength permanently.\
        \ **Run Luck - Increases his chances...for fleeing a battle. **Block Jumpscare\
        \ - Makes him immune to the move Jumpscare. (In other words, it prevents him\
        \ from being temporarily stunned.) **QuickStart Party - His opponents will\
        \ be prevented from attacking for a period of tifme. **EverComet Weak - Causes\
        \ comets to fall on his opponent(s) sometimes. **EverComet Strong - Causes\
        \ comets to fall on his opponent(s) frequently. **Auto Mimic Ball - Receives\
        \ a Mimic Ball, which allows them to spawn Virtua-Freddy, who uses an enemy's\
        \ previous attack. **Curse Status - Decreases all of his opponent(s)\u2019\
        \ stats for a period of time. **Counter Bite - When an opponent attacks him,\
        \ he bites back a lot of the same damage just dealt. **Auto Giftboxes - Get\
        \ gifted with an extra life. (He can revive himself if he happens to die.)\
        \ **Auto Regen - Automatically regenerates health. *Bytes - These robots help\
        \ deal damage to his opponent(s) and help Purpleguy/Springtrap in battle.\
        \ These can all be upgraded to more powerful and useful versions. **Byte Bee\
        \ - These shoot stingers at opponents for extra damage. **Byte Metapod - These\
        \ heal Purpleguy/Springtrap periodically. **Byte Grim Reaper - These have\
        \ a random chance at instantly killing opponents. **Byte UFO - These shoot\
        \ lasers at opponents for extra damage. **Byte Shield - These block base damage\
        \ from any attack. **Byte Bomb - These can detonate once per battle for instant\
        \ damage. **Byte Eye - These steadily drain the life of other opponents. **Pearl\
        \ - These heal Purpleguy/Springtrap and his allies slowly over time. **Fan\
        \ - These randomly shoot lasers at his opponents. Category:SKeLeTrust Category:Tier\
        \ 9 Category:Tier 2"
