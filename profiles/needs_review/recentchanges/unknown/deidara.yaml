- id: claim-weaknesses-0c734f95
  section: weaknesses
  axis: weakness
  text: 'Raiton (Lightning techniques disable his bombs), and his strongest attacks
    take time. Pride of his art leads him to abandon strategy in his fight with Sasuke.
    Feats: Notable Attacks/Techniques: *C1: Basic exploding clay created with one
    of Deidara''s palm mouths, it can take the form of a small animal or insect and
    often can fly, reaching a target and then detonating with a small amount of explosive
    power (depends on the size). c1 1 by dynamo1212-d9vjifn.png Explosive Clay Grasshopper.png
    Explosive Clay Beetle.png Explosive Clay Spider.png Explosive Clay Mystery Bird.png
    Explosive Clay Phoenix.png Explosive Clay Bird.png Explosive Clay Small Bird.png
    Explosive Clay Large Bird.png Explosive Clay Twin Birds.png Deidara using Explosive
    Clay Snake.png Explosive Clay Centipede.png Explosive Clay Fish.png Explosive
    Clay Jellyfish.png Explosive Clay Dolls.png Deidara captures Gaara.png Explosive
    Clay Bat.png Little Kibaku Nendo.jpg *C2: Creates a large dragon out of clay that
    Deidara can fly on, that shoots out smaller exploding clay missiles that home
    in on their target. 2f6711b4d0b1cad58f51893dd7aef6317edf82d9 00.gif kebwjwbwskslsk.gif
    acc9be887c22262b6bbaceb836652eca2a3ccfe9_hq.gif tumblr_n0qinim1vx1tpmqhmo2 500
    by b akuhatsu-d75v29d.gif *C3: A large clay statue that explodes with enough force
    to destroy an entire village (The Bomb would have destroyed Sunagakure if Gaara
    hadn''t stopped it). C31.gif C32.gif *C4: A large clay statue shaped like Deidara
    that explodes and releases millions of microscopic bombs that enter the bloodstream
    of anyone in range who breathes them in, On Deidara''s command, the micro-bombs''
    detonation causes the victims'' bodies to disintegrate at the cellular level,
    literally turning them into dust. His C4 can also grow and then trap nearby enemies
    as it then floods the inside with C4 bombs. When fighting Onoki, Deidara utilises
    an alternate method of C4 by forming a small, chibi-like clay statue of himself
    with the mouths in his hands. deidara c4 by hakuyuki99-d6c2wmh.gif deidara-c4.png
    6958423-traps sasuke.gif *C0: Deidara eats a large ball of clay with the mouth
    on his chest, turning his entire body into a giant bomb which then detonates in
    a massive explosion. It is claimed to have a 20km range. C0 explosion.png *Suicide
    Bombing Clone: Deidara creates a shadow clone, which then ingests some explosive
    clay and explodes, creating a diversion that can be used to escape. The explosion
    is said to be strong enough to destroy an entire forest. IMG 20181001 183736.png
    IMG 20181001 183757.jpg *Earth Style: Hiding Mole: By infusing the earth with
    chakra to turn it into fine sand, this Jutsu allows the caster to burrow his way
    through the earth, like a mole. It is well suited for sneak attacks and operations
    because the caster can sense what is happening on the ground above. By burrowing
    deep into the earth, it is also possible to escape to a place beyond an enemy''s
    reach. *Clay Doppelganger: A Doppelganger jutsu unique to Deidara. It can be used
    both to substitute himself and to capture an enemy. When attacked, the Clay Doppelganger
    absorbs attacks with its body to capture an enemy. If detonating clay is mixed
    in, the doppelganger can be exploded, taking the enemy with it. ==Gallery== ==Notable
    Matchups== Victories: Losses: Jiraiya (Naruto) Jiraiya''s Profile (Part I & II
    Jiraiya was used) Inconclusive: Yoshikage Kira (JoJo''s Bizarre Adventures) Yoshikage
    Kira''s Profile (Starting Distance: 5m. Both are bloodlusted, speed was equalized
    and the battle took place in Takayama) ==References== ==Notes/Explanations== Category:Characters
