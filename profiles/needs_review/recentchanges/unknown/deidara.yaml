    - field: weaknesses
      value: 'Deidara has a limited amount of clay in a battle. If he runs out, he''s
        nigh-useless. All of Deidara''s jutsus are earth style which makes them naturally
        weak against Lightning, it also seems like he can''t blow himself up with
        CO once he''s affected by Lightning Style. Deidara''s C4 also has a limited
        affect area and can be seen through by Sharingan. Notable Abilities/Techniques:
        Doton: Moguragakure no Jutsu (Earth Style: Hiding Mole): It can be used to
        infuse the earth with chakra to turn it into fine sand. This jutsu is well
        suited for sneak attacks because the caster can sense what is happening above.
        By burrowing deep you can escape to a place that your enemy can''t reach.
        The caster can detect magnetic forces, thus never losing sight of his position.
        Kibaku Nendo (Explosive Clay): Explosive Clay is a ninjutsu unique to Deidara.
        He kneads clay using multiple mouths and infuses it with his chakra. He mostly
        attacks from air with birds, sometimes precision-guided or faster than usual.
        On land he can attack with snakes and other things. Even in water he can use
        a fish or jellyfish clay bomb. He can cause a wide variety of explosive power
        or destructive effects based on how much or which type of chakra is put into
        it. Nendo Bunshin (Clay Doppelganger): It''s a unique doppelganger to Deidara
        that is used to deceive and capture the enemy. Once it''s pierced it transforms
        into clay. As it hardens, the clay wraps around it''s enemy''s arm. When attacked,
        the clay doppelganger absorbs attacks with it''s body to capture an enemy.
        It''s also possible to mix in detonating clay to bring down the enemy in an
        explosion. Sasuke was able to escape with his Chidori. Only because Earth
        is naturally weak against Lightning. Jibaku Bunshin (Self-Destruct Doppelganger):
        Deidara''s Self-Destruct Doppelganger is used for one''s escape by using a
        diversion crated by a shadow doppelganger that ingests detonating clay. He
        uses that moment to swap himself with the shadow doppelganger. It''s a jutsu
        that recruires skill at verbal deception. It only works by being build on
        a foundation of being able to toy with an opponent using many arts. It''s
        even implied that it would''ve reached all the way down to Kakashi and his
        team. And without Kakashi''s Kamui, they would''ve been catched by it''s explosion.
        C1: C2 Dragon: C3 Ohako: C4 Karura: CO: Category:Dehatch Category:Tier 6 Category:Tier
        5'
