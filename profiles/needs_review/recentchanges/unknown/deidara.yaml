      value: 'Multi-Continent level | The Akatsuki are a group that consists of strong
        members who are capable of taking down biju and jinchuriki with their techniques.
        Pain also believes that neither a biju nor jinchuriki have a chance against
        a pair of akatsuki members. Full Avatar KCM2 Naruto achieved this feat. Biju
        can withstand the force of their own biju bomb, yet can damage each other
        with their standard attacks. Atleast Planet-Level | (Gyuki and Kurama are
        both capable of tanking Juubi''s standard attack. Even it''s biju bomb barely
        does anything to them. Kurama has a statement that he can turn the world to
        ash or even blow up the earth with his biju bomb. It''s also stated that the
        biju bomb in general has earth shattering destructive power. This is in reference
        to all the biju. Gyuki can withstand his earth shattering biju bomb, yet was
        shown being more damaged by the other bijus. The biju should be relative to
        each other as they are shown relative in speed and can harm each other.) Higher
        | His weakest clay bomb: C1 can bring down biju. C2 is stronger than C1. His
