- id: claim-powers-and-abilities-e140b306
  section: abilities
  axis: hax
  text: "* Superhuman Physical Characteristics * Large Size (Type 0; Type 1 in Fengxi\
    \ forms) * Haki (Advanced Conqueror, Intermediate Observation, Intermediate Armament)\
    \ * Telepathy (The Five Elders are capable of communicating mentallyOne Piece\
    \ Vol. 110 Chapter 1114) * Overwhelming Aura and Fear Inducement (Five Elders\
    \ are described as possessing an otherworldly and overwhelming auraOne Piece Vol.\
    \ 110 Chapter 1117, exuding a pressure so intense that it stuns even high-level\
    \ individualsOne Piece Vol. 107 Chapter 1085. Their mere presence was enough to\
    \ visibly bewilder Rob Lucci, a seasoned assassin and one of CP0's top agents)\
    \ * Transformation (St. Warcury can transform into a full FengxiOne Piece Vol.\
    \ 109 Chapter 1108 and likely a half human hybrid) * Magic, Summoning, Portal\
    \ Creation, Electricity Manipulation, and Fire Manipulation (Anyone who has the\
    \ mark is capable of traveling through the Abyss using magic circles. Usage of\
    \ these pentagrams typically generates large streaks of black lightning and flamesOne\
    \ Piece Vol. 109 Chapter 1109) * Immortality and Regeneration (Type 1 - Comparable\
    \ to St. Saturn, who has lived for over 200 years, showing no signs of agingOne\
    \ Piece Vol. 111 Chapter 1125; Type 2 - Can survive and remain conscious after\
    \ having large portions of his body destroyedOne Piece Vol. 110 Chapter 1121;\
    \ Type 3 and 8 - at least High, possibly higher; The Five Elders can regenerate\
    \ from any and all forms of physical damage, including complete bodily vaporizationOne\
    \ Piece Vol. 110 Chapter 1111. When no biological matter remains, black flames\
    \ manifest, from which they begin to regenerateOne Piece Vol. 110 Chapter 1120.\
    \ Their existence is sustained through their connection to Imu, making them invulnerable\
    \ to conventional means; as death can only occur if this connection is severed)\
    \ * Flame Manipulation (28000\xBAC - St. Warcury can generate flames that are\
    \ hot enough to burn Luffy) * Acrobatics, Bodily Weaponry, Limited Transformation,\
    \ and Limited Metal Manipulation (St. Warcury can transform the tusks in his Fengxi\
    \ form into blades, which he uses to attack opponents by going airborne) * Breath\
    \ Attack, Sound Manipulation, and Shockwave Generation (St. Warcury's roars cause\
    \ intense shockwaves that can affect targets several kilometers away)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
