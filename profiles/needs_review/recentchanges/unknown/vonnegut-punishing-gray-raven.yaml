        the detective must not be hindered in discovery of clues necessary to solution.
        The detective''s inspection is to be considered exhaustive to the extent that
        it obviates any Devil''s Proof, clues not yielded to the detective also eliminates
        any resolution those clues would have proven. Due to this authority, Erika
        could have merely her observations stamped in the Red Truth and would be entitled
        to the ones which would support her hypothesis., Truths: Special moves utilized
        in debates between Witches and Humans taking place in the Meta-World, being
        statements denoted by specific colors which often manifest as conceptual weapons
        that directly target the enemy''s very existence in an attempt to deny it,
        they completely bypass conventional durability and allow the user to skewer
        and even kill opponents much more powerful than themselves, Red Truth: Irrefutable,
        objective truth that needs no evidence or proof to demonstrate its validity.
