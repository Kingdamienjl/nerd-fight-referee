        infinitely many and asserts it as the ultimate truth, body and soul, it is
        impossible to lie (Essentially trying to deny the validity of a wave function
        that has already been collapsed) using this technique, semantic loopholes
        and different interpretations even in statements spoken in red, though the
        Red Truth itself remains unrefuted., Blue Truth: A theoretical scenario made
