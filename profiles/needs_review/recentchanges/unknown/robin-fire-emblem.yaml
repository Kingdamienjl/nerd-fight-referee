- id: claim-intelligence-ded64929
  section: power_scale
  axis: battle_iq
  text: Genius (Robin is an gifted tacticianRobin in-game character description with
    a virtuosic proficiency in strategy despite their amnesiaFire Emblem Awakening
    - Miriel/M Robin support that led their smaller army to victory in numerous battle
    against bigger forcesFire Emblem Awakening - Lon'qu/M Robin support and great
    odds. They are creative with their plans and have done things like using half
    of their ships as flaming canonball to defeat an army that greatly outnumber themFire
    Emblem Awakening - Chapter 14 Flames on the Blue, use one of their allies who
    was thought to be dead at the time to maneuver and prepare without being detected
    by the constant spying of PlegiaFire Emblem Awakening - Chapter 23 Invisible Ties.
    They are able to monitor their entire army with precisioneven admist the fighting.Fire
    Emblem Awakening - Brady/M Robin support They are also always improving and despite
    always being outsmarted in pure strategy by Virion at first, they grew at a pace
    that the latter called frightening and began winning more and more matchesFire
    Emblem Awakening - Virion/M Robin support. Figured out the way to permanently
    kill Grima after hearing from Naga that Grima could only die if he killed himselfFire
    Emblem Awakening - Chapter 25 To Slay a God. Read Morgan's entire thought process
    to figure out where they hide a book in secondsFire Emblem Awakening - Morgan/Robin
    support.) Despite being primarly a tactician, Robin is also a skilled fighter.
    Minutes after being found amnesic in a field by the Sheperds, they took part of
    their first battle, they quickly picked back their experiences on both swordmanship
    and magic to the point of impressing their saviorsFire Emblem Awakening - Prologue.
    They're skilled enough to allow them to size up in a glance how strong their enemies
    are (stats, abilities,etc), what weapon do they use, the flow of battle and they
    can do even better by applying themselvesFire Emblem Awakening - Prologue. They
    were easily able to read Kjelle's actions despite her being a talented albeit
    reckless fighterFire Emblem Awakening - Kjelle/Robin support that survived her
    whole life in the post apocaliptic world brought by Grima's awakening. They can
    order an entire army in battle with incredible precision, keeping their eyes on
    the whole battlefield while fighting.Fire Emblem Awakening - Brady/M Robin support
    They are a talented member of the Sheperds of Ylisse of which even the most average
    fighter StahlFire Emblem Awakening - Stahl/Miriel support is already so skilled
    that he can read into his foes' thought from their faces or gestures to always
    be a step ahead of them in combat.Fire Emblem Awakening - Stahl/Robin support
    and as seen with Owain, Inigo and Severa, being able to sense someone's presence
    is enough for the Sheperds to allow them to fight and defeat invisible target.Fire
    Emblem Fate - Hidden Truth DLC part 1 Throughout the DLC they were shown to be
    able to fight against the Einherjar (records of famous heroes that conjure a mirror
    image of the beings they wereFire Emblem Awakening - Champions of Yore DLC) of
    many legendary figures in the series and defeat foes from Castle Apotheosis which
    are the strongest of heroes coming from many different world possessing might
    beyond that of any humanFire Emblem Awakening - Apotheosis DLC and as they cleared
    the secret gauntlet the Sheperd became renown as the greatest warriors any world
    has ever known. They can take on dozen of target at the same time and, although
    with great difficulty, beat some of their allies like Chrom, Frederick or Lucina.Fire
    Emblem Warriors Robin demonstrated against Validar the ability to change weapons
    on the fly to suit to their need.Fire Emblem Awakening - Fated Clash cutscene
    Robin is able to dodge a wide variety of spells including some that strike from
    right above (like the Nosferatu) or right below them (like Bolganone) and even
    directly on their location (like the Goetia or the Mire).)
