    \ an eruption at the feet of the target. *Valflame, a timeless tome of fire magic\
    \ which strike the enemy with an explosion and grant Mag +5. *Dying Blaze, a powerful,\
    \ but quick to break tome of fire magic to burn the target. *Micaiah's Pyre, radiant\
    \ fire magic that grant Def/Res +2. Several tome of wind magic which is effective\
    \ against flying targets: *Wind, a standard tome of wind magic throw a projectile\
    \ of wind. *Elwind, a powerful tome of wind magic which strike the enemy with\
    \ strong wind. *Arcwind, an extremely powerful tome of wind magic throw a projectile\
    \ of wind. *Rexcalibur, a devastating tome of wind magic which strike the enemy\
    \ with a tornado. *Excalibur, a timeless tome of wind magic which strike the enemy\
    \ with a tornado. *Forseti, a timeless tome of wind magic which grant Spd +5 and\
    \ strike with strong winds. *Wilderwind, a wind magic tome with increased critical\
    \ rate. *Celica's Gale, a tome of ancient wind magic. Allows the wielder to strike\
    \ twice with a cyclone. Other types of magic: *The Book of Naga, a timeless magic\
    \ tome that grant Def/Res +5 and cause an explosion of light at the location of\
    \ the target. -Consumable= *Several healing item such a Vulnerary, Concoction,\
    \ Elixirs, or Sweet Tincture. *Several stats boosting item with temporary or permanent\
    \ effect such: **Seraph Robe and HP Tonic for HP. **Energy Drop and Strength Tonic\
    \ for strength. **Spirit Dust and Magic Tonic for magic. **Secret Book and Dexterity\
    \ Tonic for dexterity. **Speedwing and Speed Tonic for speed. **Goddess Icon and\
    \ Luck Tonic for luck. **Dracoshield and Defense Tonic for defense. **Talisman,\
    \ Resistance Tonic and Pure Water for resistance. **Boots for movements. **Kris's\
    \ Confect which increase HP by 5 and Def/Res by 2 for one battle. **Gaius's Confect\
    \ which increase strength, speed and skill by 2 for one battle. **Tiki's Tear\
    \ which increase HP by 5 and all other stats by 2 for one battle. **Naga's Tear\
    \ which increase HP by 5 and all other stats by 2 permanantly. *Door, Chest and\
    \ Master Keys to respectively open a door, a chest or both. -Optional"
