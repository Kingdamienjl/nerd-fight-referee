        support is already so skilled that he can read into his foes' thought from
        their faces or gestures to always be a step ahead of them in combat.Fire Emblem
        Awakening - Stahl/Robin support and as seen with Owain, Inigo and Severa,
        being able to sense someone's presence is enough for the Sheperds to allow
        them to fight and defeat invisible target.Fire Emblem Fate - Hidden Truth
