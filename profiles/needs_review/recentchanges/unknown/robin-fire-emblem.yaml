  text: '*Superhuman Physical Characteristics *Non-Physical Interaction (Could harm
    the illusions summoned by the Wellspring of TruthFire Emblem Awakening - Paralogue
    22 The Wellspring of Truth) *Weapon Mastery (Mainly of swords and tomes but Robin
    can use many other weapons like spears, axes, bows and staves) *Damage Boost (Robin
    can inflict critical hit which deal increased damage. Robin can use the skill
    Ignis which have a chance to add half of their magical attack to their physical
    blows and half of their physical strenght to their magical attack) *Information
    Analysis (They''re skilled enough to allow them to size up in a glance how strong
    their enemies are (stats, abilities,etc), what weapon do they use, the flow of
    battle and they can do even better by applying themselvesFire Emblem Awakening
    - Prologue) *Analytical Prediction (They were easily able to read Kjelle''s actions
    despite her being a talented albeit reckless fighterFire Emblem Awakening - Kjelle/Robin
    support. Read Morgan''s entire thought process to figure out where they hide a
    book in secondsFire Emblem Awakening - Morgan/Robin support) *Extrasensory Perception
    (Should be comparable to the Ylisseans that went to the world of Fates and were
    able to fight invisibles vallites soldier by sensing their presenceFire Emblem
    Fate - Hidden Truth DLC part 1) *Psychometry (Robin possess a roster that automatically
    update itself with personal detail about Robin''s alliesFire Emblem Awakening
    - Roster Rescue DLC) *Statistics Amplification (By working in pair with their
    allies, Robin will have their strength, speed and durability increasedFire Emblem
    Awakening - Prologue) *Dimensional Travel (Escaped Gima''s dimension and returned
    to their worldFire Emblem Awakening final boss battle) *Resurrection (Non-combat
    applicable, After killing Grima which should have and did make them cease to exist,
    their bonds with their allies which are even stronger than a thousand friendship
    kept them in this reality allowing them to eventually come backFire Emblem Awakening
    - Chapter 25 To Slay a GodFire Emblem Awakening final boss battle) *Magic, and
    Durability Negation (Robin can use magic tomes and magic completely bypassesFire
    Emblem Engage - Chapter 4: A Land in Bloom physical defenses such as armor,Fire
    Emblem: The Sacred Stones - Chapter 4: Ancient Horrors or thick hidesFire Emblem:
    The Sacred Stones - Lute/Kyle Support) **Fire Manipulation (Via fire magic tomes)
    **Electricity Manipulation (Via thunder magic tomes. Fought Validar using beams
    and balls of electricity.Fire Emblem Awakening - Fated Clash cutscene Stabbed
    Chrom with a stake of electricityFire Emblem Awakening - Fated Clash II cutscene)
    **Air Manipulation (Via wind magic tomes) **Darkness Manipulation (Even without
    a tome, Robin was able to strike Grima with a ball of darknessFire Emblem Awakening
    final boss battle) *Summoning (Robin possess a deck of card that they have accumulated
    during their travels accross the Outrealms, these card contain Einherjar, records
    of some of the greatest heroes in history that manifest as reflections of who
    those heroes used to be.Fire Emblem Awakening - Champions of Yore DLC These cards
    can be used to summon the related Einherjar. Robin posses cards of Marth, Roy,
    Micaiah, Eldigan, Leif, Alm, Seliph, Elincia, Eirika, Lyn, Ephraim, Celica, Ike,
    Est, Palla, Catria and Katarina) *Power Bestowal (Via Rally Spectrum and Solidarity)
    *Healing (Low-Mid, Robin can heal themselves by using healing items like vulneraries.
    Healing in Fire Emblem can heal stab wound in the torso) Resistance to: *Magic
    (Via the resistance to magic stat directly stated to exist like here) *Unconventional
    Resistance to Soul Manipulation (Characters in Fire Emblem can consistently survive
    without their souls, albeit while being reduced to a husk personality wise) *Soul
    Manipulation (The way Robin opposed Grima should have killed their spirit yet
    they were still able to fight against Grima''s influenceFire Emblem Awakening
    - Future Past DLC) *Mind Manipulation (Was able to resist Validar''s control and
    fake the action of killing Chrom before oposing Validar directlyFire Emblem Awakening
    - Chapter 23 Invisible Ties) On top of what they already have they now have access
    to the following'
