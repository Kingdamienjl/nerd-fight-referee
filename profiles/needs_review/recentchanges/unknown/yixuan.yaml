    - field: powers_and_abilities
      value: 'Resistances= {{Border|Scroll=Yes|Visible=Yes|Content= Resistance to:
        *Ether Corruption (Yixuan and other agents in the world of Zenless Zone Zero
        have high ether aptitudes, allowing them to fight and navigate hollows for
        prolonged amounts of time without suffering the various effects inflicted
        by Ether Corruption. [https://youtu.be/UElSygmICww?t=39 It is noted Ether
        strikes faster and more intensely on beings with "souls", such as humans and
        thirens as well as machines who have passed the forbidden fruit test], a test
        to determine if an AI construct is self aware with Miasma being a unique type
        of Ether substance that, upon contact, [https://youtu.be/RpXFMD90zdQ?si=MA0h-0P7D3mvrHVv&t=10412
        assaults the mind and corrupts it, enticing its targets with memories too
        sweet to let go and keeping them locked in its illusions until they become
        Corrupted] Yixuan was able to fight on par with modern Void Hunters such as
        Hoshimi Miyabi, whom she was able to [https://www.youtube.com/watch?v=ffubdFPFlS8&t=61s
        fight to a standstill]. Being comparable to modern Void Hunters also means
        that she likely shouldn''t be that far off from other Void Hunter-level agents
        like Eldreda Sunbringer, who was able to [https://www.youtube.com/watch?v=koRIZaziHnw&t=20s
        defeat a massive Ethereal and forcibly collapse a Hollow down], a feat which
        required this much force. Fought against and defeated the Defiler, [https://youtu.be/7ZvPWJvIB3w?t=11691
        a Sacrifice that was capable of creating a tsunami] and that had been matched
        by Orpheus and Magus, whom Yixuan stated [https://youtu.be/yPjb2nq_4OQ?t=6734
        she could easily defeat even with the aid of all Obsidian troops within Waifei
        Peninsula as support], which Orpheus herself corroborates, [https://imgur.com/a/4UlGhG1
        stating that they only managed to defeat the Sacrifice with that much ease
        because of Yixuan''s assistance].)'
