        the craft of Yunkui Summit.Yixuan Animated Short Film "For My Yixuan" During
        her time as a disciple, Yixuan demonstrated herself to be a prodigy, as she
        mastered any technique no matter the complexity of it, understanding it and
        later even making her own techniques.Agent Intel: Yixuan During this time,
        Yixuan had began her research to develop ways to use the power of Yunkui''s
        Summit Qingming Sword without suffering from its drawbacks, and with the assistance
        of her sister, Yijiang, resulted in the creation of the technique known as
        Qingming Bird, which helped her eliminate enemies and banish evil spirits
        in various difficult and dangerous situations. Despite not being officially
        a Void Hunter, Yixuan has demonstrated being at their level, not only creating
        techniques that could match Void Hunter-level agents like Hoshimi Miyabi,
        but also managing to create the seal of the Qingming Sword held by Ye Shunguang,
        which not only allows its wielder to avoid the repercussions of using the
        sword, but said sword being a Void Hunter-level weapon, which are powered
        up by a Karma Core, a specialized core extracted from Enchainers, a powerful
        type of Ethereals far above ordinary ones that act as the "emissaries" from
        the great Hollows,Phaethon''s Story; Season 3 Chapter 1 "A Sleepwalker''s
        Confession" means she''s knowledgeable enough to create powerful seals that
        can contain the power of other Void Hunter-level weapons. After the Fall of
        the old Capital, Yixuan became the sects new High Preceptor and due to her
        many contributions, she was offered the title of Void Hunter. Though she refused,
        her sheer prowess and skills are officially recognized as that of someone
        on the level of the Void Hunters regardless, impressing even the famous Hoshimi
        Miyabi herself)'
