    notes: auto_repair source extraction
  attack_potency:
    text: At least Town level, possibly Large Town level (Yixuan is officially classified
      as a "Void Hunter-level Investigator"Zenless Zone Zero Version 1.7 "Bury Your
      Tears With the Past" Special Program and has even been offered the title by
      the Mayor, though she ultimately ended up rejecting the title. This puts her
      strength well above base tier agents, as well as stronger agents like Banyue,
      who was able to push up two pillars of rock, producing this much kinetic energy.Banyue
      Character Demo - "Martial Arts Review">10.68 Kilotons of TNT Yixuan was able
      to fight on par with modern Void Hunters such as Hoshimi Miyabi, whom she was
      able to fight to a standstill.Yixuan Character Demo - "Martial Summit Showdown"
      Being comparable to modern Void Hunters also means that she likely shouldn't
      be that far off from other Void Hunter-level agents like Eldreda Sunbringer,
      who was able to defeat a massive Ethereal and forcibly collapse a Hollow down,
      a feat which required this much force.2nd Anniversary Theme Song MV - "Prophecy"Possibly
      238.81 Kilotons of TNT Fought against and defeated the Defiler, a Sacrifice
      that was capable of creating a tsunami and that had been matched by Orpheus
      and Magus, whom Yixuan stated she could easily defeat even with the aid of all
      Obsidian troops within Waifei Peninsula as support, which Orpheus herself corroborates,
      stating that they only managed to defeat the Sacrifice with that much ease because
      of Yixuan's assistance. Fought against Mevorakh, and despite her initial struggles
      against the former's collected Miasma, upon remembering the words of her deceased
      sister Yijiang, Yixuan destroyed the Miasma and completely overwhelmed Mevorakh.
      Far more powerful than other factions capable of fighting against Sacrifices,
      such as Belobog Heavy IndustriesPhaethon's Story; Season 1 Chapter 2 "A Call
      From the Hollow's Heart")
    source_ids:
    - vsbattles-yixuan-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
