- id: claim-powers-and-abilities-0124c40a
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Flight, Natural Weaponry, Martial Arts
    (The Peryton bears horribly sharp horns which it wields with "the skill of a champion"Dragon
    Magazine #82, page 10), Absorption (The Peryton consumes large quantities of metal
    to reinforce its horns and other body parts, making them particularly resistant
    to physical harmDragon Magazine #82, page 11), Immortality (Type 9, it is immune
    to non-magical weaponry since it is not a creature of this worldDragon Magazine
    #82, page 12, which implies it exists not only on this world but its home plane
    as wellDragon Magazine #8, page 4), Limited Adaptation (They have adapted to live
    on high mountain peaks in extremely cold conditionsMonster Manual, 1st Edition,
    page 78), Enhanced Senses (They are noted to have extremely sharp eyes and scentMonstrous
    Manual, 2nd Edition, page 286Monster Manual, 5th Edition, page 251), Damage Reduction
    (As mentioned hereMonster Manual, 3.5e, page 69), Stealth Mastery (They are particularly
    adept at moving quietly through the cold mountaintops), Social Influencing (They
    are skilled at intimidation tactics), Damage Boost (It has a very specific technique
    of divebombing out of the air to inflict unnatural quantities of damage), Perception
    Manipulation (Through unknown means, its shadow appears in the shape of a human,
    often confusing prey; some sources also state that its scent similarly mimics
    that of humans) | All base abilities plus Dimensional Travel (With their Talents
    they were able to travel the planes individually)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
