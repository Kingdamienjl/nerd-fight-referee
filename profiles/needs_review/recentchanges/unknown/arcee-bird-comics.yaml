    - field: attack_potency
      value: 'Deals 115% AD damage and forces target to attack Red for 3 turns. *
        Protect: Target bird receives 55% less damage for 2 turns. * Overpower: Deals
        110% AD, reducing target''s attack power by 25% for 2 turns. * Aura of Fortitude:All
        birds receive 25% less damage for 4 turns. * Orb of Life: 40% chance to heal
        25% of life at the end of the turn * Defensive Formation: Target bird receives
        50% less damage and all other birds receive 40% less damage. Lasts 1 turn.
        * Lifeleech: Every attack heals by 15% of damage dealt. * Spiteful: Deals
        150% damage to enemies that are already stunned. * Revenge: Deals 90% AD damage,
        which increases by 2% per 1% health lost. * I Dare You!: Forces all enemies
        to attack target bird, which receives 20% less damage. Lasts 2 turns. * Holy
        Strike: Deals 135% AD damage. The bird with most of its health depleted is
        healed for 30% of the damage dealt * Devotion: Receives damage instead of
        target bird, and takes 40% less damage. Lasts 3 turns. * Last Breath: 50%
        chance to kill a Undead when doing the last hit. * Knockout: 8% chance to
        stun an enemy. * Feral Assault: Deals 2x 65% AD damage. Targets with negative
        effects receive 150% damage. * Ancestral Protection: Enemies deal 40% less
        damage for 3 turns after attacking the target bird. Lasts 3 turns. * Total
        Balance: Increases the damage by 15% per 30% health lost. * Burst of Anger:
        Red fly''s around the field unleashing shockwave across the screen. * Slingshot:
        The slingshot is the main weapon/utility the birds use in order to attack
        the pigs. Red can pull back on the slingshot strap, then release to fire items
        or even himself right into the enemy''s face. * Small Slingshot: This is a
        smaller slingshot that Red can carry around to fire small rocks or acorns
        at his targets. * Wood Chipper: This special sling doubles Red''s destructive
        potential for everything made out of wood. * Stone Crusher: This special sling
        doubles Red''s destructive potential for everything made out of stone. * Glass
        Smasher: This special sling doubles Red''s destructive potential for everything
        made out of glass or ice. * Golden Slingshot: This special sling gives Red
        an 1.5x increase to his destructive potential for everything made out of wood,
        glass, ice, or stone. * Jingle Sling: Instead of a regular slingshot, the
        Jingle Sling is basically a weaponized Christmas tree that will not only launch
        Red at his chosen target, but several ornaments as well for extra destruction.
        * Bouncy Sling: When fired out of this special slingshot, Red''s bounciness
        will be increased, causing him to ricochet into other objects and cause more
        damage. * Diamond Sling: When fired out of this special slingshot, Red will
        somehow be able to ignore the laws of gravity and fly in a completely straight
        line. * Super Seeds/Power Potion: Red can use these to increase his size and
        striking power. * King Sling: The King Sling is a metal slingshot with stronger
        rubber bands that provide a lot more power for bird launches, allowing them
        to fly further and faster. * Sling Scope: The Sling Scope is a device that
        allows Red to view his flight path to help increase his accuracy. * Birdquake:
        This power-up creates massive earthquakes capable of collapsing structures.
        * TNT Drop/Energy TNT/Allaka-BAM/Boombox: This power-up summons multiple explosive
        crates onto the battlefield which Red can hit to detonate. * Homing Bird:
        As the Homing Bird, Red will change its trajectory upon detecting the first
        target on its radar. * Flock of Birds: This power-up creates 4 smaller clones
        of Red. * Space Egg: Red can summon the Space Egg to create a vortex that
        can pull in objects and targets. * Pig Puffer/Pig Inflater: This power-up
        inflates multiple targets, making them easier to hit. * Mush-Bloom: This power-up
        blooms magenta-colored mushrooms in multiple areas of the enemy fortresses,
        causing the fortress to become less stable, and sometimes, damaging targets
        in the process. * TeleBird: As the TeleBird, Red can teleport himself and
        anything around him to anywhere he wants. * Golden Ducks: This surprisingly
        effective spell causes rubber ducks to rain onto the battlefield, damaging
        anyone who happens to get hit. * Blizzard: This spell turns every object on-screen
        into ice, making them easier to destroy. * Hot Chili: This spell causes a
        random target to ignite and explode. * Mighty Eagle: With a tin of sardines,
        Red can summon the Mighty Eagle to swoop in and destroy everything in sight.
