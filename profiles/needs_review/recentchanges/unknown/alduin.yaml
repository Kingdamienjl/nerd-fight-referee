power_scale:
  tier:
    text: 'Name: Alduin (Also called Ald''uin, Thartaag, Ald Son of Ald). Known by
      many titles, such as The World-Eater, The Time-Eater, The Epoch-Eater, Firstborn
      of Akatosh, The Dragon God Origin: The Elder Scrolls Gender: Inapplicable. Referred
      to as male. Age: Inapplicable. Classification: Nordic Dragon God, World-Eater,
      Aspect of Aka'
    source_ids: &id002
    - mediawiki-2441833
    confidence: 0.95
  attack_potency:
    text: Universe level+ (Alduin is the World-Eater who brings about the End of Time
      by completely devouring the current Kalpa, destroying the very laws of reality
      as defined by the Ehlnofey and resetting Nirn back to the Dawn Era, whose end
      marks the beginning of a new Kalpa. Said to have destroyed twenty-two Jills
      with the fire of his breath. Can cause Dragon Breaks with his power. Became
      even more powerful by gorging on the souls of the dead in Sovngarde. His death
      was said to have echoed throughout all of Time by Paarthurnax, reverberating
      across all Eras of the world)
    source_ids:
    - vsbattles-alduin-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Immeasurable (Is unbound by the concept of linear time and exists outside
      of it, living in the spaces between Kalpas. Unaffected by Dragon Breaks. Capable
      of literally flying through the currents of time, and traveling from Nirn to
      Sovngarde with sheer speed)
    source_ids:
    - vsbattles-alduin-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Immeasurable
    source_ids: *id002
