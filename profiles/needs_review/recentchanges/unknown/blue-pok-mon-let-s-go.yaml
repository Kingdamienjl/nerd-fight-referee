  intelligence:
    text: "Gifted; he is known as one of the greatest Trainers alive in Kanto by the\
      \ time of Let\u2019s Go Pikachu and Eevee, having been asked numerous times\
      \ by the Pok\xE9mon League to become one of their Gym Leaders before finally\
      \ taking the position when Giovanni fled. His team is picked deliberately and\
      \ calculated, so that no one type can counter two of his Pok\xE9mon. Is similar\
      \ in skill to Green, who planned to catch Mewtwo."
