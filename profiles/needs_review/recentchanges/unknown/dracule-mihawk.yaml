power_scale:
  tier:
    text: 5-B
    source_ids: &id002
    - mediawiki-3455
    confidence: 0.8
  attack_potency:
    text: 'Planet level (He''s the strongest swordsman in the world in both name and
      actuality,One Piece Vol. 9 Chapter 49One Piece Vivre Card Databook #0085 and
      he''s currently waiting for a worthy foe who surpasses his old rival Shanks,One
      Piece Vivre Card Databook #0085 which makes him superior to the likes of Vista,
      Old Rayleigh, and Shanks. Databook Red states that Shanks used to be as strong
      as him,One Piece Databook Red implying that he isn''t any longer 59.44 Zettatons)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Relativistic+ with Speed of Light perceptions with Observation Haki (Kept
      up with Vista, capable of fighting against Shanks)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class P (Superior to Zoro and should be comparable, if not superior to,
      Shanks)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: 'Planet level (Even with a one-handed swing, his slash was referred to as
      the World''s StrongestOne Piece Databook Blue Deep: Jozu entry)'
    source_ids: *id002
    confidence: 0.8
  durability:
    text: "Planet level (Got through the Paramount war without a scratch to show for\
      \ it, despite clashing with several of Whitebeard\u2019s commanders)"
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Casually toyed with Luffy and did not show the slightest sign
      of exhaustion throughout the Marineford War, despite clashing with several opponents,
      some of whom were strong enough to threaten the Admirals)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Several Meters with Yoru (Its blade is at least seven feet long), at least
      Kilometers with air slashes (His swings generate enough force to cleave apart
      icebergs from across Marineford)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: At least Above Average in general. Astoundingly skilled in combat. Mihawk
      is famous for being the best swordsman in the world, having displayed masterful
      feats of skill such as deflecting bullets with minimal effort. He is very calculating
      and possesses pinpoint accuracy with his strikes, capable of fully stopping
      Zoro's Oni-giri just by positioning a small blade at the right angle to intercept
      the three-bladed attack. He is skilled enough to emerge from the battlefield
      of Marineford without receiving a scratch, let alone receiving a direct hit
      despite coming to blows with a number of commanders under the Whitebeard crew,
      showcasing his impeccable skill as a swords-master. He is among one of the few
      individuals who has developed a Black-Blade (The other being Ryuma, many years
      ago), which is a feat that many highly acclaimed swordsmen who possess a mastery
      of Haki have failed to accomplish, such as Kozuki Oden, who was incapable of
      evolving his own weapons into Black-Blades.
    source_ids: *id002
    confidence: 0.8
