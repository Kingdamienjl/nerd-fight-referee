  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Small Size (Type
    0 normally; roughly 90 cm tall), Transformation (Can transform into various human/reindeer
    hybrid forms and a humanoid form), Enhanced Senses, Limited Information Analysis
    (Brain Point allows him to identify any possible weaknesses his target has, allowing
