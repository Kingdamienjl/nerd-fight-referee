      Form Kaidou. Took a severe beating from an enraged Hybrid Form Kaidou while
      he was using Haoshoku Infusion), higher with Kagamiyama (Can cover himself in
      ice armor to absorb damage.)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: 'Superhuman (Even while his stamina was hindered by seastone handcuffsOne
      Piece Vivre Card Databook #1578 he fought against Ace to the point he reached
      exhaustion.One Piece Vol. 99 Chapter 999 Ace is able to continually battle for
      5 days straight.One Piece Vol. 57 Chapter 552 He fought through the entire Onigashima
      Raid without reaching his stamina threshold, despite fighting against his father
      and many notable combatants.One Piece Vol. 101 Chapter 1016One Piece Vol. 99
      Chapter 996One Piece Vol. 97 Chapter 984One Piece Vol. 103 Chapter 1038 Endured
