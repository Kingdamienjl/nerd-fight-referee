power_scale:
  tier:
    text: 6-B, 5-C in Zoan Forms, even higher with Conqueror's Haki Infusion
    source_ids: &id002
    - mediawiki-4757734
    confidence: 0.8
  attack_potency:
    text: 'Country level (While he had Seastone Handcuffs on, he one-shotted Full
      Zoan Form Ulti with Thunder BaguaOne Piece Vol. 97 Chapter 983 and fought on
      par with Gear Two + Three LuffyOne Piece Vol. 97 Chapter 984. Far superior to
      the likes of Scratchmen Apoo and X Drake17.25 Teratons), Moon level with Conqueror''s
      Haki Infusion (Knocked Base Kaidou back, alongside a Gear Four: Snakeman Luffy
      that was using Conqueror''s Haki188.362 Exatons), higher in Zoan Forms (Fought
      and parried blows from Hybrid Form Kaidou.One Piece Vol. 101 Chapter 1019 His
      Namuji Glacier Fang matched Hybrid Form Kaidou''s Bolo Breath.One Piece Vol.
      101 Chapter 1020 Knocked a Hybrid Form Kaidou, who was defending himself to
      the ground with HimorogiriOne Piece Vol. 101 Chapter 1025188.362 Exatons), far
      higher with Conqueror''s Haki Infusion (In his Hybrid Form, he matched Hybrid
      Form Kaidou''s Thunder Bagua, with one of his own and managed to draw a small
      amount of blood from him.One Piece Vol. 101 Chapter 1024188.362 Exatons)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Relativistic+ (Kept up evenly with Gear 2nd Luffy. Managed to tag Base Kaidou),
      higher in Zoan Forms (Kept up with Hybrid Form Kaidou), far higher with Thunder
      Bagua (Matched Hybrid Form Kaidou's own Thunder Bagua)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class E (Should be comparable to Base Kaidou), higher in Zoan Forms (Although
