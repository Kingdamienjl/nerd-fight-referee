      moments later got back up and continued fighting despite his injuries.One Piece
      Vol. 101 Chapter 1025 As a child, he was imprisoned, surviving 10 days without
      food or waterOne Piece Vol. 101 Chapter 1024)'
    source_ids: *id002
    confidence: 0.8
