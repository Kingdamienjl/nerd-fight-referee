    Support) *Statistics Amplification (Via stats boosting items like Spirit Dust
    or weapons like the Tyrfing) *Damage Boost (Some weapons like a Beast Killer deal
    effective damage toward certain foes) On top of what he normally have access too
    Walhart can get: *Statistics Amplification (Via skills like Agressor) *Damage
