    1) *Extrasensory Perception (Slimes can sense the flow of magiculesChapter 2)
    *Duplication (As a slime, she can create copies of herselfChapter5) *Regeneration
    (After taking human form, her regeneration became slower for a while,Chapter 5
    but later on the healing properties of her own body became so powerful that it
    can instantly heal even grave illness by putting her own body to heal itChapter8)
    *Information Analysis (By putting small parts of her own body inside of another
    person she can fully analyse themChapter 8) *Healing (The healing properties of
    her own body became so powerful that it can instantly heal even grave illness
    by putting her own body to heal it,Chapter8 as a Saint, she can use her Holy powers
    to healChapter9) *Holy Manipulation (As a Saint, she can use Holy PowersChapter11)
    *Power Absorption (She can absorb the powers of her target, even supernatural
    powers and blessings,Chapter 11 such as when she took the body of a SaintChapter
    1 and gained the powers of a saint and its blessingsChapter11) Resistance to:
    *Poison Manipulation (Slimes are unaffected by poisonsChapter 1)'
