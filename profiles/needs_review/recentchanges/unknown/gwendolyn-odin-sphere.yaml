        to trap her. Gwen can struggle to determine someone's location in an area
        riddled with technology. She also cannot track Ectonurites, as they have no
        manna. Most of Gwen's Anodite powers can be neutralized by a manna disruption
        grenade, a power dampening headband,manacles used by a member of the Synthroid
