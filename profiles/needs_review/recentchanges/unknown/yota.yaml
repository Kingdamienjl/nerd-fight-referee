- id: claim-weaknesses-92742744
  section: weaknesses
  axis: weakness
  text: 'He is physically fragile Notable Attacks/Techniques: *Weather Manipulation:
    A special ability known by his clan, Yota can to freely manipulate the weather
    around him. Regardless of the natural atmosphere around him, he could manifest
    many different weather effects, effectively turning them into powerful attacks
    or defences. It should be noted that his area of effect is not limited to outside,
    as he is able to isolate his abilities to relatively closed off areas, while within
    them. Yota has shown to have a great level of control over the range and direction
    of his ability, and could use them simultaneously if need be. The following effects
    have been shown: **Rain: Once manifested, it could rain softly or fiercely, and
    could even be directed towards a single person. The rain itself seems to have
    an unusual effects on his opponents, as it is able to drain them of their chakra
    and vitality, while seemingly making them sad as well. Once produced in terms
    of offence and defence, he could summon varying sizes of very powerful, pressurised,
    water trenches to either block incoming attacks, restrain, or crush his opponents.
    He could even create huge water bubbles that attacks opponents with concussive
    force. Coming from many different directions, each of his attacks could manifest
    from anywhere within his vicinity, seemingly coming from thin air. **Snow:Showing
    only the offensive capabilities, Yota is able to turn a simple snowfall into a
    powerful blizzard, enabling him to near instantly freeze everything around him,
    including people. **Lightning: Yota can produce large bolts of purple lightning.
    The lightning could be directed from anywhere, to anywhere the enemy is, and in
    rapid succession. It was fast enough to keep up with Kiba Inuzuka and Akamaru.
    Should the lighting ever connect, it is powerful enough to instantly kill the
    target. However, if Yota wills it, the lightning can completely obliterate the
    target, even if it is the latter himself. **Wind: Yota is able to fully manipulate
    the direction and intensity of wind by whistling. He could summon anything from
    a concentrated tornado, to several whirlwinds. Each of these attacks have the
    offensive capabilities to slash and wound the intended target. It was powerful
    enough to cut, and catch off guard, Naruto Uzumaki, despite being in Nine-Tails
    Chakra Mode. **Sunlight: Yota could also make the sun shine brightly. Although
    it hasn''t been used offensively or defensively, it has shown to cause flowers
    to bloom quickly around him. ==Notable Matchups== Victories: Losses: Inconclusive:
    ==References== Category:Characters Category:Naruto Category:Absorption Users Category:Air
    Users Category:Anime Characters Category:Electricity Users Category:Empathic Manipulation
    Users Category:Humans Category:Ice Users Category:Immortals Category:Inorganic
    Beings Category:Light Users Category:Male Characters Category:Memory Users Category:Regeneration
    Users Category:Self-Sustenance Users Category:Telepaths Category:Water Users Category:Weather
    Users Category:Chi Users Category:Energy UsersCategory:Extrasensory Perception
    Users Category:Weapon Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-f71db72f
  section: abilities
  axis: hax
  text: Weather Manipulation (A natural power of his clan, Yota possess the unusual
    ability to manipulate the weather regardless of the natural atmosphere he was
    in, being able to manifest many different weather effects, effectively turning
    them into powerful attacks or defences), Water Manipulation, Energy Absorption
    and Empathic Manipulation (When sad, Yota manifests rain, being able to make it
    rain everywhere around him or direct it at a single person if he wants to. The
    rain has the effect of absorbing people's vitality, weakening them and making
    them sad. Once produced in terms of offence and defence, he could summon varying
    sizes of very powerful, pressurised, water trenches to either block incoming attacks,
    restrain, or crush his opponents. He could even create huge water bubbles that
    attacks opponents with concussive force. Coming from many different directions,
    each of his attacks could manifest from anywhere within his vicinity, seemingly
    coming from thin air. While submerged, Yota has demonstrated the ability to manipulate
    the water surrounding him to force his targets away from him, or increase his
    speed within it), Ice Manipulation (When happy, Yota manifests snow, being able
    to turn a simple snowfall into a powerful blizzard, enabling him to near instantly
    freeze everything around him, including people), Electricity Manipulation (When
    angry, Yota manifests lightning, being able to produce large bolts of purple lightning.
    The lightning could be directed from anywhere, to anywhere the enemy is, and in
    rapid succession. Should the lighting ever connect, it is powerful enough to instantly
    kill the target. However, if Yota wills it, the lightning can completely obliterate
    the target, even if it is the latter himself), Air Manipulation (When he whistles,
    he can fully manipulate the direction and intensity of wind. He could summon anything
    from a concentrated tornado, to several whirlwinds. Each of these attacks have
    the offensive capabilities to slash and wound the intended target), Light Manipulation
    (Yota can manipulate sunlight at will, making the sun shine brightly, causing
    flowers to bloom quickly around him), Telepathy (Yota can telepathically communicate
    with others, and also connect the minds of those he chooses), Memory Manipulation
    and Limited Durability Negation (Can erase anyone's memory by touching them. By
    doing so, the targets are knocked out and once awakened, they have no recollection
    of targeted memories. However, Yota can restore the target's memories by flicking
    them on the forehead), Immortality (Types 1, 2, 3 and 7), Inorganic Physiology
    (Type 1), Self-Sustenance (Types 1, 2 and 3), Regeneration (Low-Godly. Edo tensei
    can regenerate from the damage caused by Deidara's C0, which vaporizes targets,
    as many times as he wanted. Can regenerate as long as his soul remains),Naruto
    Chapter 518 Resistance to Death Manipulation, Age Manipulation and Disease Manipulation
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
