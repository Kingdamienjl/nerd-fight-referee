    - field: weaknesses
      value: 'He is physically fragile Notable Attacks/Techniques: *Weather Manipulation:
        A special ability known by his clan, Yota can to freely manipulate the weather
        around him. Regardless of the natural atmosphere around him, he could manifest
        many different weather effects, effectively turning them into powerful attacks
        or defences. It should be noted that his area of effect is not limited to
        outside, as he is able to isolate his abilities to relatively closed off areas,
        while within them. Yota has shown to have a great level of control over the
        range and direction of his ability, and could use them simultaneously if need
        be. The following effects have been shown: **Rain: Once manifested, it could
        rain softly or fiercely, and could even be directed towards a single person.
        The rain itself seems to have an unusual effects on his opponents, as it is
        able to drain them of their chakra and vitality, while seemingly making them
        sad as well. Once produced in terms of offence and defence, he could summon
        varying sizes of very powerful, pressurised, water trenches to either block
        incoming attacks, restrain, or crush his opponents. He could even create huge
        water bubbles that attacks opponents with concussive force. Coming from many
        different directions, each of his attacks could manifest from anywhere within
        his vicinity, seemingly coming from thin air. **Snow:Showing only the offensive
        capabilities, Yota is able to turn a simple snowfall into a powerful blizzard,
        enabling him to near instantly freeze everything around him, including people.
        **Lightning: Yota can produce large bolts of purple lightning. The lightning
        could be directed from anywhere, to anywhere the enemy is, and in rapid succession.
        It was fast enough to keep up with Kiba Inuzuka and Akamaru. Should the lighting
        ever connect, it is powerful enough to instantly kill the target. However,
        if Yota wills it, the lightning can completely obliterate the target, even
        if it is the latter himself. **Wind: Yota is able to fully manipulate the
        direction and intensity of wind by whistling. He could summon anything from
        a concentrated tornado, to several whirlwinds. Each of these attacks have
        the offensive capabilities to slash and wound the intended target. It was
        powerful enough to cut, and catch off guard, Naruto Uzumaki, despite being
        in Nine-Tails Chakra Mode. **Sunlight: Yota could also make the sun shine
        brightly. Although it hasn''t been used offensively or defensively, it has
        shown to cause flowers to bloom quickly around him. ==Notable Matchups== Victories:
        Losses: Inconclusive: ==References== Category:Characters Category:Naruto Category:Absorption
