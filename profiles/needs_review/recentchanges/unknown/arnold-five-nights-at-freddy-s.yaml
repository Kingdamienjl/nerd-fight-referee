      a child's skull with this much forceFive Nights At Freddy's 4)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Peak Human (Stated to have worked for 36 hours straight without rest at
      the start of the game. Despite being sleep-deprived to the point of "barely
      keeping his eyes open", Arnold was able to survive numerous close encounters
      with The Mimic and escape it in several intense pursuits. Despite Arnold being
      audibly terrified and on edge, he never gave up on his task. Even after being
      knocked out multiple times, he got back up and continued exploring every inch
