  speed:
    text: Subsonic (Has managed to outrun The Mimic while it was piloting a variety
      of suits and machinery, most notably Jackie, Big Top,It is commonly believed
      that Big Top was a separate entity that acted of his own volition to pursue
      and kill Arnold. In official artwork released after the Fourth of July, Big
      Top is shown with The Mimic's eyes, confirming that the latter was inside Big
      Top and controlling him in the same manner as Jackie, Nurse Dollie, and several
      Mascot Suits. and Nurse Dollie. Later outran The Mimic in its bare endoskeleton
      form, and a horde or Protomimics. He should be comparable to the likes of Michael
      Afton and Ralph, the latter of whom was able to run away from Chica long enough
      to cover a distance of 30 feet before she caught him, and evaded the likes of
      Freddy and Bonnie in chase.Mach 0.42)
    source_ids: *id002
    confidence: 0.8
