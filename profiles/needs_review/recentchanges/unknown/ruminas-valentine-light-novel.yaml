    \ version of Self-Regeneration. It's capable of quickly regenerating the body\
    \ to its default state. If imbued into magical clothes or armor, it grants a self-repair\
    \ function that enables complete recovery of the clothing even \"from scratch\"\
    . *Shadow Motion: Allows to move within shadows, and very quickly move to people\
    \ and also places the user had been to before. To use it the user still has to\
    \ move through the shadows to the destination but is not hindered by any obstacles\
