    \ to calculate the visual, auditory and other wave-based information of the surroundings.\
    \ Magic Sense also grants the ability to understand and express the intent of\
    \ spoken words even if the language of the conversation partner is unknown. **Magic\
    \ Sense enables users to be aware of their environment in battle even if blind\
