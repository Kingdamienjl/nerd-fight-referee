    - field: intelligence
      value: 'Unknown. It''s said it used to continuously exterminate enemies, dispatched
        to even different stars on its master''s orders, with a "terrifying military
        record". Fights Kirby, Meta Knight, King Dedede and Bandana Waddle Dee using
        a combination of: Decent swordsmanship, mechanisms that briefly present their
        own threats as Metal General is occupied doing its own attacks, and itself
        can shoot projectiles at many directions at once in a way that limits the
        space others have to dodge them, if its fight took place in a thin battleground.
        It sacrifices competence for power with HR-D3 though.'
      source_id: mediawiki-809350
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "class=\"wikitable mw-collapsible mw-collapsed\" !, HR-D3 is fought as\
        \ the 6th last boss in the updated version of The True Arena in Kirby's Return\
        \ to Dream Land Deluxe, whose listed as Low Multiverse level (Crowned Doomer\
        \ scales to Extra Mode Magolor Soul, having fought evenly against a Magolor\
        \ more powerful than his prior self as that Magolor Soul). This is impressive\
        \ for HR-D3. Under regular circumstances, it would mean that HR-D3 upscales\
        \ from Crowned Doomer, but the portrayal has to be seen as an outlier:, (The\
        \ order of bosses fought in the Extra Mode goes as follows: Metal General\
        \ EX \u2192 HR-D3 \u2192 Landia \u2192 Lor & Magolor \u2192 Magolor EX \u2192\
        \ Magolor Soul, only the latter being listed as Low Multiverse level), Kirby\
        \ & co. would have reached that level from their fight against Metal General\
        \ EX to the fight against HR-D3 a few seconds later. Metal General EX even\
        \ throws some attack while driving HR-D3, further showing that they are roughly\
        \ comparable in power., Kirby & co.'s battle against Magolor EX's went beyond\
        \ limitsMagolor Soul's Jpn. pause description, Extra Mode \xB7 Kirby's Return\
        \ to Dream Land Deluxe, justifying the growth in power Kirby & co. had to\
        \ face off the stronger Magolor Soul seconds later. Magolor Soul uses the\
        \ full \"infinite power\" of the Master Crown, and Landia EX too is \"unable\
        \ to control all its power\"Landia EX's Jpn. pause description \xB7 Kirby's\
        \ Return to Dream Land Deluxe. So there is narrative weight on the escalation\
        \ of power presented by the battle with Magolor Soul, be it for prior bosss\
        \ being weaker, Magolor Soul being stronger, all being \"infinite\" differences\
        \ by both in-game claims of the power used and stats in terms of powerscaling.\
        \ HR-D3 being on a comparable level since earlier contradicts all of that\
        \ and comes out of nowhere., Following HR-D3's battle in the updated The True\
        \ Arena are \"Lor EX & Magolor\" and Magolor EX, boss endurance modes are\
        \ a major part of the Kirby series, the placement of bosses from battle to\
        \ battle is almost always consistent in portraying escalation of power, once\
        \ even stating as much for 1 specific modeKirby and the Forgotten Land & Kirby\
        \ and the Forgotten Land \u2013 Nintendo Switch 2 Edition + Star-Crossed World.\
        \ HR-D3 is simply a strange outlier among them."
      source_id: mediawiki-809350
      provider_id: vsbattles
      authority: high
      confidence: 0.75
