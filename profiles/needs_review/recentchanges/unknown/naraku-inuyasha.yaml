- id: claim-standard-equipment-d22c9b3d
  section: equipment
  axis: equipment
  text: "Sh\u014Dki, Poisonous tentacles, Spiderwebs * Shikon no Tama: The Shikon\
    \ no Tama, also known as Jewel of Four Souls, Sacred Jewel or Shikon Jewel, is\
    \ a powerful marble-sized jewel. The jewel is the result of the fusion of the\
    \ soul of a powerful priestess and demon. It dramatically boosts the power of\
    \ demons and can grant wishes. The jewel is far from all-powerful when it is granting\
    \ wishes, though. Can Create/Summon: * Saimy\u014Dsh\u014D: Demon Wasps that Naraku\
    \ uses for various purposes, including spying on his enemies, relaying messages\
    \ to his minions, or gathering Shikon Jewel Shards. They serve to prevent Miroku's\
    \ use of the Wind Tunnel as they can poison him if he is unfortunate enough to\
    \ suck them in."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
