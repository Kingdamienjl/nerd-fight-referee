- id: claim-weaknesses-6a64ee80
  section: weaknesses
  axis: weakness
  text: "Vulnerable to spiritual and holy attacks, as well as Inuyasha's complete\
    \ Meido Zangetsuha. Any other weaknesses are gradually removed if possible. Feats:\
    \ Respect thread Notable Attacks/Techniques: *Illusion Creation: Naraku has demonstrated\
    \ the capabilities to show others illusions. He has three different methods to\
    \ do so. The first is his \"Illusionary Death\" spell. This spell grows a large\
    \ tree with far-reaching roots. Those touched by the moving roots, or \"creepers\"\
    , are pulled within the illusion. However, only this with a tiny amount of yin\
    \ in their heart are affected and they can be broken out of under certain circumstances.\
    \ The second kind of illusion created is one that Naraku has only demonstrated\
    \ to be able to use if the opponent is inside his body. This kind of illusion\
    \ is compelling, as it can even prevent the target from perceiving anything that\
    \ happens to them outside of the illusion.Chapter 542 The third kind of illusion\
    \ can be created by Naraku through the smell of a special incense. and is a lot\
    \ easier to see through.Media:Illusion via Incense.jpg *Mind Manipulation: Naraku\
    \ has demonstrated on several occasions the ability to manipulate the minds of\
    \ others. However, every such technique comes with severe restrictions. Naraku\
    \ can, for instance, use the Shikon no Tama to cause Half-Youkai to fall into\
    \ a berserk state upon coming close to it.https://i.imgur.com/spSTmKf.jpg The\
    \ second technique he should have inherited from his Infant detachment, which\
    \ he later absorbed. Upon physical touch, it could fuse its soul with the target\
    \ and, that way, gain control over the target's mind. However, there needs to\
    \ be at least a tiny amount of darkness in the target's heart for this to work.Chapter\
    \ 284 and 285 **Memory Manipulation: Naraku has demonstrated the ability to erase\
    \ memories. However, this is only possible by inserting a shard of the Shikon\
    \ no Tama into the targets body and under the condition that the target itself\
    \ has something it strongly wishes to forget.Media:Memory + mind control- Kohaku\
    \ (180).jpgMedia:Kohaku onyl erase memory because doesn'tw ant remember (182).jpgMedia:Kohaku\
    \ specifically controlled via shikon fragment (222).jpg The fact that Kohaku was\
    \ a human personally resurrected by Naraku could also have played into this ability.\
    \ *Soul Manipulation: Naraku can fuse his soul with those of others upon physical\
    \ contact. Doing so requires at least a small amount of darkness in the target's\
    \ heart. If the physical contact is interrupted, the fusion ends. *Attack Reflection:\
    \ When someone sent an air manipulation-based attack at Naraku's barrier, he could\
    \ channel the flow of the attack into his own jaki and then attack his opponents\
    \ with it.https://i.imgur.com/HNFNhe1.jpg *Transmutation: Naraku has demonstrated\
    \ the ability to turn what was either a petrified Oni, or the statue of such a\
    \ being back into its living body.https://i.imgur.com/SGkDFT6.jpg, https://i.imgur.com/TSbpK3u.jpg,\
    \ https://i.imgur.com/tjXxr4f.jpg, https://i.imgur.com/ikJY9Up.jpg * Absorption:\
    \ Naraku can absorb other demons into his body, using it to enhance himself by\
    \ seeking out stronger demons to consume for their strength while purging weaker\
    \ ones to remove any weaknesses. As seen with M\u014Dry\u014Dmaru, Naraku even\
    \ fakes being absorbed by an enemy to take over the body from the inside. He can\
    \ even absorb things when they are in contact with a split part of his flesh.https://i.imgur.com/1PtnRun.jpg,\
    \ https://i.imgur.com/1cS5PLz.jpg, https://i.imgur.com/QJ18Ssg.jpg, https://i.imgur.com/sOQlPSG.jpg,\
    \ https://i.imgur.com/4OPXdns.jpg, https://i.imgur.com/GgKMqjw.jpg, https://i.imgur.com/1JIEGvR.jpg\
    \ *thumb|272x272pxMiasma: Naraku's trademark poisonous gas, potent enough to instantly\
    \ reduce average humans into skeletons. With miasma stored in his body, Naraku\
    \ uses it to cover his entrances and exits, like forming a cloud around himself\
    \ while flying. He created a \"false Shikon shard\" for K\u014Dga with this substance.\
    \ It was able to power K\u014Dga for a while until it backfired, poisoned him,\
    \ and ultimately led him to remove it with the help of Kagome. Naraku's body was\
    \ filled with it; anyone would get poisoned when making contact with him. Over\
    \ time, he turns it from a gas to an acidic liquid. Naraku's Miasma eventually\
    \ becomes potent enough to melt mountains and wipe out surrounding wildlife.https://i.imgur.com/s5exSEu.jpg,\
    \ https://i.imgur.com/ePJ50bJ.jpg, https://i.imgur.com/ikKbUn5.jpg, https://i.imgur.com/2AcwmFq.jpg,\
    \ https://i.imgur.com/oZMqJdF.jpg It became lethal enough to effect Kiky\u014D\
    \ as she resorted to absorbing Midoriko's soul to protect herself. But even the\
    \ influence of Midoriko was nullified after Naraku absorbed M\u014Dry\u014Dmaru.\
    \ Furthermore, the miasma is powerful enough to slow or even prevent regeneration\
    \ and can prevent the resurrection of those affected. *Power Bestowal: Can form\
    \ weapons out of his bones and bestow it upon others. The weapons generate barriers\
    \ and spread miasma. He has gifted various powers to his detachments like S"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
