- id: claim-powers-and-abilities-1d4be344
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Genius Intelligence, Magic, Chi Manipulation,
    Immortality (Type 1, 2, 3 & 8; depending on the Shikon no TamaDue to merging with
    it), Regeneration (Low-GodlyMedia:Defeat naraku = destroy soul (409).jpg, but
    can be permanently incapacitated by complete physical destruction unless someone
    wishes upon the Shikon no Tama afterwardsChapter 551 and onwards), Flight, Reality
    Warping, Causality Manipulation (via the jewel), Spatial Manipulation, Perception
    Manipulation, Illusion Creation, limited Mind Manipulation, limited Memory Manipulation,
    limited Soul Manipulation, Empathic Manipulation, limited Attack Reflection, limited
    Time Travel (requires the Bone-Eater's Well), His miasma can prevent resurrection
    techniquesMedia:Even tensaiga can't save form Naraku's Miasma (374).jpg, Large
    Size (Type 2, likely Type 3Media:Largesize (531).jpg), Teleportation, Forcefield
    Creation, Enhanced Senses, limited Transmutation, Resurrection (single piece of
    his flesh can fully resurrect someone or via the Shikon no Tama), Transformation,
    Telekinesis, Duplication, Necromancy, Absorption and through that Power Absorption,
    Power Nullification, Energy Manipulation, Acid Manipulation, Poison Manipulation,
    Shapeshifting, Curse Manipulation (Cursed Miroku to have a black hole-like weapon
    in his hand, which would eventually suck him up, and would get passed to his children),
    Barrier Nullification (Can dissolve barriers), Hair Manipulation, Thread Manipulation
    (Invisible spider webs multiple kilometres long), Power Bestowal, Astral Projection,
    Resistance to Pain Manipulation (The Shikon Jewel prevents one from feeling pain
    and damage), Lightning Manipulation (Unharmed by the Goraishi, even when hit from
    within his body) and Fire Manipulation (Withstood fire from a Great Demon Queen.
    Regular small time demons are able to incinerate humans in armor to nothingness)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
