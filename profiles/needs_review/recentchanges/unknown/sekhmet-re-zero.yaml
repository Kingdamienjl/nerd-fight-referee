    pure property itself that made a human, human\u201D, being synonymous with the\
    \ individual's soul and defining their existence.Volume 25, Chapter 7Volume 25,\
    \ Chapter 3 It encompasses the individual's Memories, elemental character, destiny,\
    \ and life force,Volume 9, Chapter 1 with the body's form itself conforming to\
    \ the Od, such that altering the Od alters both the body and mind.Volume 31, Chapter\
    \ 2 Od contains the Name and Memories. When the name is vanquished, the person\
    \ is erased across all of history with the world being rewritten as though they\
    \ were never there and wiped from everyone's minds.Volume 6, Chapter 4 Eating\
    \ the Name of his victim will erase the Memories of them from the world itself,Volume\
    \ 9, Chapter 6, \"To Each Their Oaths\" even erasing evidence of their existence\
    \ such as anything they wrote.Volume 10, Chapter 1, \"At the Place They Returned\
    \ To\" Those with their Memories eaten forget everything about themselves and\
