- id: claim-standard-equipment-867c8128
  section: equipment
  axis: equipment
  text: '*The Gospel: A book of prophecies given to all members of the Witch Cult,
    it is a defective version of an incomplete copy of the Book of Wisdom. It is a
    guide to the owner''s desired future, but its contents are vague and subject to
    change, the instructions being up to interpretation. *The Ten Fingers: Sub-commanders
    of Petelgeuse''s followers, the Fingers'' primary role is to serve as spare bodies
    for their Archbishop. Having undergone a ritual to have a portion of Petelgeuse''s
    Sloth Witch Factor implanted into them, they are ideal targets of Petelgeuse''s
    spiritual possession.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-24b867a6
  section: power_scale
  axis: battle_iq
  text: Gifted (Petelgeuse is the only Sin Archbishop who considers defeat as a possibility,
    and scouts out locationsAuthor's Comment while commanding numerous followers,
    being a rare Witch Cultist with leadership skills. He is even able to command
    his fellow Sin Archbishops by taking their difficult personalities into account
    and tricking them into moving how he wants them to.Author's Comment Petelgeuse
    is creative in his manipulation of the Unseen Hand, using it to throw himself,
    effectively giving himself the ability to fly. He also used it at the cost of
    crushing his own shoulder to dodge Wilhelm's strike just before it hit him. Petelgeuse
    figured out how to overcome the limits of the Unseen Hand's speed by throwing
