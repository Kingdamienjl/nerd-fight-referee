    - field: weaknesses
      value: "Multiple uses of his ability can be deadly as his own heart stops when\
        \ using it; however, it can be circumvented when combined with lion's heart.\
        \ Killing all his wives with his heart will make him unable to use his ability\
        \ for more than 5 seconds at a time. Regulus relies a lot on his ability;\
        \ besides his ability, he is an amateur when it comes to fighting. Can only\
        \ move in a straight line with his Authority to boost his speed. Feats: *Killed\
        \ Reinhard Notable Attacks/Techniques: Credit to the Re:Zero Wiki for the\
        \ following explanation Authority of Greed: *Stillness of an Object's Time:\
        \ The mainly offensive ability of the Authority of Greed when it was in the\
        \ possession of Regulus. Regulus could stop the time of anything he was wearing,\
        \ touching, or even his breath, which in turn stopped the object's or thing's\
        \ interference from the outside world, only allowing its interference outwards\
        \ and even granting Regulus the ability to freely manipulate the objects'\
        \ shape. Small objects imbued with Stillness of an Object's Time could be\
        \ used either as a form of platform which allowed Regulus to freely traverse\
        \ on it or be utilized as objects of imminent death and destruction as they\
        \ created devastating and destructive attacks when used with malicious intent.\
        \ **Dirt, sand and pebbles imbued with Stillness of an Object's Time: Regulus\
        \ frequently showed the ability to pick up or kick things like dirt or sand,\
        \ stopping their time and throwing them towards his enemies. As the time of\
        \ these small objects was stopped, the objects effectively acted as anomalies\
        \ in the world, being cut off from the flow of time. They passed through anything\
        \ they collided with, no matter the sturdiness, leaving behind only small\
        \ holes\u2013if the structure was still left standing in the first place.\
        \ If thrown at an individual or an animal, the objects would naturally travel\
        \ through them, completely shredding and goring them, usually leaving behind\
        \ nothing more than an unrecognizable pile of flesh or a bloody mist. Regulus\
        \ used this ability to shred Pandora into a bloody mist during the attack\
        \ on Elior Forest, roughly one century before the start of the main story.\
        \ He used the same attack once more during the events of Arc 5, when he shredded\
        \ Subaru's right leg, as a form of revenge for Subaru spoiling his plans and\
        \ mood. **Water imbued with Stillness of an Object's Time: Though not very\
        \ practical in most fights, Regulus did resort to using water, if he had the\
        \ chance to do so. The ways of attacking were pretty much the same, as Regulus\
        \ usually just scooped up a fistful of water and threw it towards his enemies,\
        \ rendering them to nothingness. However, after being forced to engage in\
        \ combat with the Sword Saint, Regulus was forced to get a bit more creative.\
        \ By kicking the water in a water canal, he unleashed a devastating tsunami,\
        \ hurling towards Subaru and Emilia during their escape. The tidal wave crushed\
        \ everything in its path and did not stop until Reinhard cut it in half, destroying\
        \ it in the process. By freezing the water from a nearby water canal in place,\
        \ Regulus could pick it up with his hands, similarly to having a tatami mat\
        \ made out of water. He manipulated it in a similar way as he manipulated\
        \ the aforementioned water from a nearby canal, creating a giant tsunami.\
        \ If needed, Regulus was also shown to be able to walk on frozen water droplets,\
        \ as if he was walking on solid ground. Furthermore, by just stepping into\
        \ the water, Regulus created a pillar of water with its time stopped, using\
        \ it to propel himself high in the air. There was even a time when he collected\
        \ the water from an entire nearby water canal, shaped it into a giant blob\
        \ of water, jumped (according to Subaru, the jump itself was more akin to\
        \ teleportation) onto the Third Control Tower in the Water Gate City of Priestella,\
        \ reshaped it into thousands of smaller droplets and proceeded to bomb the\
        \ entire district underneath him, while referring to the ongoing bombardment\
        \ as \"purification rain\". **Wind imbued with Stillness of an Object's Time:\
        \ One of Regulus' most recognizable and commonly used attacks are him stopping\
        \ the time of air produced by himself. With a simple swipe of his hand, he\
        \ produced a vortex of wind, traveling in a straight line following his arm.\
        \ By stopping its time, the wind would not dissipate but instead, turn into\
        \ an invisible blade of wind, cutting everything in its path. By utilizing\
        \ this attack, Regulus disarmed both Crusch and Petelgeuse on two separate\
        \ occasions in the main story. He was also shown to imbue shockwaves created\
        \ by him with Stillness of an Object's Time, creating unstoppable explosions,\
        \ shattering everything in its path, as seen when he blew up the first dragon\
        \ carriage in the 2nd Interlude of Arc 3. Perhaps one of his deadliest attacks,\
        \ however, was his breathe with its time stopped. By simply exhaling and stopping\
        \ the time of his exhaled air, Regulus would effectively create invisible\
        \ pockets of air, that would shred everything in its"
