      value: 'None notable | Overtaxing of her processor unit while it''s damaged
        can run the risk of it exploding. | Unknown Notable Attacks Techniques: *Hard
        Drive Divinity (HDD): Due to Neptune''s status as a goddess, she is able to
        draw power from share energy and transform into her goddess form. *Hyper Lightning
        Kick: Neptune so called "killer move" in which she delivers a powerful kick
        to her foe. *Hyper Convulsion Strike: Neptune repeatedly punches the opponent
        at speeds that make the speed of punching 16 times a second look pitiful.
        These punches are made in a way to send vibrations through the entirety of
        the target''s body. *Neptune Break: Neptune''s ultimate skill learned from
        the Neptune of another dimension. Neptune holds her sword before launching
        herself as a purple energy surrounds her. She then rapidly slashes the enemy
        from all directions and then spins her sword into the air and catching the
        sword to slash the enemy again. Neptune stabs the enemy one more time into
        the ground before they explode into a purple column of light. *Various other
        abilities, as there were various lethal techniques were given to Neptune by
        the Neptune from a parallel world'
