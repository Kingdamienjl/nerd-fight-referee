- id: claim-weaknesses-a431f182
  section: weaknesses
  axis: weakness
  text: 'Petelgeuse is completely insane and sporadic which can sometimes cause him
    to let his guard down in combat. He has a constant urge to harm himself and others.
    He can only possess people with the qualificiations of a Spiritual Arts User,
    and he can''t possess people who are already Contracted to a spirit. Petelgeuse
    cannot live without a physical body, and he will die if he ends up with no available
    vessel for his soul. Notable Attacks/Techniques: *Authority of Sloth: Unseen Hand:
    Petelgeuse''s Authority allows him to summon numerous invisible and powerful shadow-like
    arms. These arms boast potent physical might despite lacking physical substance,
    making them intangible. The number of arms is based on how much of his Witch Factor
    is present in his vessel; normally, Petelgeuse is only able to use seven arms,
    but if the divided Witch Factor of Sloth he used to make people into his Fingers
    returns to his body, he is able to summon upwards of a hundred arms. *Earth Magic:
    As a spirit of the earth attribute, Petelgeuse can cast earth magic. **Ul Dona:
    Petelgeuse manipulates the earth around him, raising earth walls into a protective
    dome. Petelgeuse used Ul Dona to defend himself against Julius Juukulius when
    cornered in the Mathers Domain, preventing the knight''s sword from reaching him.
    thumb *Possession: As a spirit, Petelgeuse could possess the bodies of others
    under certain conditions. Compatibility varied between people, which usually depended
    on whether the person had the innate qualifications to be a Spiritual Arts User.
    However, he was unable to possess people who already had a formal Contract with
    a spirit. As Petelgeuse was unable to live without a flesh body, he kept a special
    group of followers he called the Ten Fingers who all had undergone a ritual to
    allow them to be possessed by Petelgeuse in case he dies. He used this method
    to live for over 400 years. ==Notable Matchups== Victories: *Jedah (Fire Emblem)
    Jedah''s profile (Speed was equalised. The fight happened in the flying Hyrule
    Castle) Losses: Inconclusive: ==Notes== ==References== Category:Characters Category:Re:Zero
    kara Hajimeru Isekai Seikatsu Category:Male Characters Category:Aura Users Category:Possession
    Users Category:Light Novel Characters Category:Manga Characters Category:Anime
    Characters Category:Antagonists Category:Supernatural Willpower Users Category:Spirits
