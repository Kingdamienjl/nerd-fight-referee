    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Weapon Mastery (Of swords), Martial
        Arts (Skilled in close combat and is able to match up evenly against Noire
        in a fight. Has stated to have dealt with bank robbers and the like before
        prior to getting a weapon), Immortality (Type 1; As with other goddesses in
        the series, she cannot age, as age does not apply to goddesses), Self-Sustenance
        (Types 1, 2, and likely 3; Can survive and breathe in space. CPUs have repeatedly
        displayed a lack of need for breathing in several continuities. As noted and
        displayed in Victory/RB3, CPUs do not require sustenance to stay alive and
        cannot starve to death. CPUs can remain in active combat with no rest for
        billions of years with no sign of tiredness, as displayed in the original
        Hyperdimension Neptunia, where the four CPUs have fought for eons.), Share
        Energy Manipulation (Lower End Applications; as a goddess, she can freely
        manipulate Share Energy for various purposes), Extrasensory Perception (Can
        sense various forms of energy, such as share energy and evil auras), Fourth
        Wall Awareness (Like other Neptunes in the series, she consistently breaks
        the fourth wall and should be able to use her protagonist status to avoid
        worst case scenarios), Vibration Manipulation (Has attacks designed to cause
        vibrations throughout an enemy to completely destroy them), Stealth Mastery
        (Hid her presence in a hot spring to sneak up on Compa. Could mask her presence
        to tail IF), Dimensional Storage (With her N-Gear) Resistance to Mind Manipulation
        (Unaffected by CFW Magic''s mind control machine, which could mind control
        every citizen of Planeptune at once. The continent of Planeptune contains
        a significant portion of Gamindustri''s 50 billion person population) All
        prior abilities in addition to Enhanced Senses (HDD is shown to enhance one''s
        eyesight, allowing Neptune able to see perfectly clearly whilst in the dark,
        it also allows one to sense the presences of others), Flight, Light Manipulation
        (Initiating HDD causes one to give off a flash of light), Instinctive Reactions
        (Could subconsciously dodge attacks from Arfoire), Air Manipulation (Can generate
        wind vortexes) Resistance to Extreme Heat and Extreme Cold (HDD makes one
        resistant to extreme temperature changes while active) All prior abilities
        on a vastly enhanced scale in addition to Law Manipulation (Stated to be capable
        of changing the laws of the universe if she so desired by CFW Magic), Curse
        Negation (Has dispelled multiple layers of curses from the main Neptune with
        a fraction of her power), Spatial Manipulation, Dimensional Travel, Portal
        Creation (Can open and close gates to other dimensions. Her sheer strength
        can cause a hole that links dimensions to be created when clashing with the
        other CPUs), Statistics Amplification (Is shown to boost the strength of of
        others), Memory Manipulation (Showed the main dimension Neptune the memories
        of various Neptunes from countless parallel worlds.), Mind Manipulation (Could
        forcefully take out the consciousness of the Arfoire of her world from another
        Arfoire so she could bring it back to it) Basic Goddess Abilities (Optional)=Abilities
        that, while not necessarily displayed by her, all goddesses in Neptunia should
