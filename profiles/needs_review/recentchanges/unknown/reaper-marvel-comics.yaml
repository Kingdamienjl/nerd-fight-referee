        of himself or when Sentry mindwiped himself and everybody else after the Void
        was becoming too independent and powerful, also being defeated by Sentry when
        their balance was broken (after the Void killed more people than the Sentry
        saved). But the Void always returned on his own as long as Sentry existed,
        culminating with the Void getting released during the events of Siege. It
