- id: claim-weaknesses-c1eabd92
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques *The Divine Miracle of Empty Sky:\
    \ A sword technique which Rowan spent his life devising. By flicking his wrist\
    \ with extreme speed, the force of his drawn blade rises into the sky and splits\
    \ the clouds overhead. It is a technique that will make those who lack uncommon\
    \ courage experience a sensation akin to their own flesh being cleaved upon witnessing\
    \ it. Although for those who are transcendent beings, this cloud-cutting technique\
    \ is no more than a mere flashy performance with no real usefulness whatsoever.\
    \ *Sacrament of the Immortal King: During the Great Disaster of the Vollachia\
    \ Empire, Rowan took advantage of the resurrecting undead by committing suicide,\
    \ allowing himself to be reborn as a zombie. The forbidden art of the Sacrament\
    \ of the Immortal King called forth souls into Corebugs littered throughout the\
    \ empire, which used the soul's data to reproduce its vessel in life using Restoration\
    \ Magic and earthern bodies. **Learn by Death: Rowan is among the few undead who\
    \ learned to \"clone\" themself by splitting their soul into multiple Corebugs\u2014\
    \ and therefore creating multiple undead Rowans. As each Rowan fights, kills,\
    \ and is killed, he rapidly accumulates combat experience and his combat abilities\
    \ skyrocket. In his final moments, his swordsmanship caused even the infantilized\
    \ Blue Lightning to envision death. ==Notable Matchups== Victories: Losses: Inconckusive:\
    \ ==References== ==Notes and Explanations== Category:Re:Zero kara Hajimeru Isekai\
    \ Seikatsu Category:Light Novel Characters Category:Male Characters Category:Evil\
    \ Characters Category:Antagonists Category:Statistics Amplification Users Category:Sword\
    \ Users Category:Social Influencers Category:Supernatural Willpower Users Category:Enhanced\
    \ Senses Users Category:Extrasensory Perception Users Category:Precognition Users\
    \ Category:Instinctive Action Users Category:Aura Users Category:Body Control\
    \ Users Category:Undead Category:Zombies Category:Regeneration Users Category:Immortals\
    \ Category:Accelerated Development Users Category:Duplication Users Category:Inorganic\
    \ Beings Category:Self-Sustenance Users Category:Resurrection Users Category:Characters"
  source_ids: *id003
  decisive: false
  status: unverified
