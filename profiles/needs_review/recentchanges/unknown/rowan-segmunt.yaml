      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "None notable Notable Attacks/Techniques, The Divine Miracle of Empty\
        \ Sky: A sword technique which Rowan spent his life devising. By flicking\
        \ his wrist with extreme speed, the force of his drawn blade rises into the\
        \ sky and splits the clouds overhead. It is a technique that will make those\
        \ who lack uncommon courage experience a sensation akin to their own flesh\
        \ being cleaved upon witnessing it. Although for those who are transcendent\
        \ beings, this cloud-cutting technique is no more than a mere flashy performance\
        \ with no real usefulness whatsoever., Sacrament of the Immortal King: During\
        \ the Great Disaster of the Vollachia Empire, Rowan took advantage of the\
        \ resurrecting undead by committing suicide, allowing himself to be reborn\
        \ as a zombie. The forbidden art of the Sacrament of the Immortal King called\
        \ forth souls into Corebugs littered throughout the empire, which used the\
        \ soul's data to reproduce its vessel in life using Restoration Magic and\
        \ earthern bodies., Learn by Death: Rowan is among the few undead who learned\
