    - field: intelligence
      value: Average normally, Gifted in combat (Rowan has dedicated his life to the
        sword, honing trustworthy skills, and developing a sword skill similar to
        Iai.Arc 7, Chapter 17, "Looming Evil" He had honed his skills by way of cutting
        down innumerable opponents as he wandered, absorbing the techniques of various
        schools, and cutting down the heads of those schools.Arc 8, Chapter 38, "Rowan
        Segmunt" Rowan's deft sword can slice apart his target without allowing them
        to feel the blade piercing them. His swordsmanship has been praised by Emperor
        Vincent Vollachia, who believed Rowan could rise to fame through his skills,
        which could even easily kill the ringleader of an uprising without staining
        his blade with blood. Rowan's skills have been called first-class, and his
        teachings can create beings far above his own level. He is a warrior whom
        Yorna Mishigure considered neither strong nor weak, the apex of the common
        man; and the divine miracle of empty sky which he spent his entire life devising
        was appraised as having no real usefulness whatsoever by Cecilus and Arakiya.
        After becoming an undead, Rowan's skills developed rapidly as he fought, died,
        and resurrected again and again, a phenomenon that could be termed as "Learn
        by Death". His abilities advanced by what was described by Cecilus as "one
        step", which Rowan had never once achieved before. In his final moments, Rowan's
        swordsmanship was capable of making his infantilized son envision death)
