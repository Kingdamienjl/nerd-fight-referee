  section: weaknesses
  axis: weakness
  text: 'Goku seeks strong opponents and will, therefore allowing his opponents to
    reach their full power for the sake of a good fight. Kaioken strains his body,
    causing him intense pain and exhaustion if he overuses it. He often drops his
    guard and leaves openings for his opponents whenever he gets distracted, lowering
    his durability. His Spirit Bomb requires a long charge up period, during which
    time he is vulnerable. He cannot survive in the vacuum of space and needs to locate
    a Ki signature to teleport using Instant Transmission, initially he couldn''t
    transform into a Super Saiyan God without the ritual, however this is no longer
    a problem after training with Whis | The Evil Containment Wave requires a suitable
    container to seal the target into | Ultra Instinct Omen is initially only temporary,
    and he cannot willingly enter the state, only entering it in response to being
    pushed to his limits. Once Goku exits the form, he is left exhausted. Goku''s
    Ultra Instinct was initially imperfect, so it was harder for him to use it offensively,
    as he still held himself back by thinking out the best method of attack instead
    of intuiting what to do. In prolonged encounters, Goku''s mastered Ultra Instinct
    form can spontaneously deactivate, draining Goku of most of his power. {| class="mw-collapsible
    mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
    | colspan="2" style="text-align: left; "'
