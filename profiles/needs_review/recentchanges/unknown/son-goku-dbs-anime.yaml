  stamina:
    text: Superhuman (Goku can train for days with minimal rest and can fight through
      his long, arduous fights with the likes of Vegeta and Frieza, continuing to
      fight against Vegeta even after overexerting himself with Kaioken x4, and ultimately
      outlasting the latter even after being effortlessly beaten around, pushing himself
      to his limits with Kaioken, and exhausting himself with his Spirit Bomb. When
      he was younger, he managed to pull through and defeat Piccolo even after all
      of his limbs were broken and he was mortally injured. Additionally, as of Battle
      of Gods, he has finally gotten past Super Saiyan 3's energy problem, allowing
      him to use it much more easily and for longer periods. Later in Resurrection
      of F, he was able to endure having a hole in his chest after getting shot by
      Sorbet. In the Future Trunks arc, he was stabbed in his lung and had a huge
      hole in his chest by Black but completely ignored the pain and continued to
      fight both Black and Future Zamasu. In the Tournament of Power Goku was able
      to fight through nearly the entire duration of the tournament despite repeatedly
      breaking through his limits and nearly dying multiple times, ultimately pushing
      himself to fight and eliminate Jiren alongside Frieza even though he could barely
      move moments before. Can engage in combat in low oxygen environments)
    source_ids: *id002
