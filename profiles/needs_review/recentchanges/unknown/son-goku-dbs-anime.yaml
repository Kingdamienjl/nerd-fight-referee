  attack_potency:
    text: Low Multiverse level (Grew far stronger since he fought Kid Buu, [https://imgur.com/a/Op9gBls
      who exerted power greater than all previous versions of Majin Buu], including
      Super Buu [Gohan absorbed]. [https://imgur.com/a/xxLcjD0 Super Buu's Vice Shout
      threatened to completely break down the fabric of space-time which would lead
      to alternate dimensions leaking over into each other and eventually crushing
      the universe entirely], [https://imgur.com/a/LzQLvz8 it being stated multiple
      times that this was done with his power]. As a Super Saiyan God, fought with
      a suppressed Beerus, and their clash both shook and was about to destroy the
      universe from its edge. Absorbed Super Saiyan God's power and became even stronger.
      Managed to overcome Beerus' energy nullification as a Super Saiyan, which easily
      nullified energy capable of destroying the universe. Destroyed a superior amount
      of energy that was going to destroy the universe with a single punch in his
      base form, which consists of 3 space-time continuums) | Low Multiverse level
      (Grew significantly in power during his training and was later capable of enhancing
      his strength even further by stacking Kaioken x10 on top of Super Saiyan Blue
      Upon going past his limits, he could replicate Vegeta and Trunks' feat by himself
      and knock down Fusion Zamasu with Kaioken. Stalemated a stronger Hit with just
      Super Saiyan Blue, without using Kaioken, and even his weaker Super Saiyan forms
      can briefly fight opponents like Toppo, although he is inferior in these forms.
      Also capable of maintaining Super Saiyan Blue Kaioken x20 which was [https://youtu.be/KlM4suwbM4A&t=60
      completely unaffected by the fight between] three Gods of Destruction, with
      a fight between two Gods of Destruction being [https://youtu.be/vU13f79Ca3I&t=151s
      taboo] since it will result in the [https://imgur.com/a/fPOwj5M destruction
      of two universes], each of which consists of 6 space-time continuums) | Low
      Multiverse level, far higher with God Transformations (After breaking his limits
      by achieving Ultra Instinct Omen a second time, and after defeating Anilaza,
      he managed to fight against Jiren, who was finally showing a hint of his full
      power. [https://twitter.com/Herms98/status/1028025720751017984/photo/1 His Super
      Saiyan Blue Kaioken is stated to be equal to Vegeta's Super Saiyan Blue Evolution]
      Comparable to the speed of the explosion from the ki sphere which Super Saiyan
      God Goku and Beerus created in their final clash, which threatened to engulf
      the entire universe in mere moments. Becomes even faster after achieving Super
      Saiyan Blue on-top of his new base) | Massively FTL+ (Has become a lot faster
      through rigorous God training, can be even faster with Kaioken) | Massively
      FTL+ (Has become even faster than before. Comparable to Vegeta and eventually
      achieved Kaioken x20 on-top of Super Saiyan Blue) | Massively FTL+ (Completely
      blitzed both Toppo and Dyspo and was able to keep up to a casual Jiren, who
      Shin commented on his power was unlike any threat they faced before, including
      Zamasu) | At least Class G, likely far higher | At least Class G, likely far
      higher (Stronger than before) to Class T ([https://imgur.com/a/X8cjE4x Endured
      Pretty Black Hole's gravitational pull]) | At least Class T | At least Class
      T, far higher with God Transformations | At least Class T | At least Class T,
      far higher with God Transformations
