  intelligence:
    text: 'Extraordinary Genius combatant (Jingliu is a legendary swordswoman of unparalleled
      skill and mastery, being regarded as a legend of swordplay. Her expertise is
      so extraordinary that she has earned the esteemed title of Sword Champion, a
      designation reserved solely for those who have achieved the zenith of swordsmanship,
      being referred as the Transcendent Flash, the pinnacle of swordmasters, a once-in-ten-millennia
      hero.Jingliu Character Story: Part III 700 years ago, Yingxing, the blacksmith
      who forged the Sword Shard, stated that Jingliu was the only swordmaster on
      the entire Xianzhou Luofu who could tap into the full potential of the best
      sword he crafted.Blade Character Story: Part IV She can tell a person''s swordsmanship
      by sound itself. Jingliu''s prowess is not only evident in her own abilities
      but also in the talents of her students, Jing Yuan and Blade, since Jingliu
      taught everything that they know in the arts of Glaive and Sword, who have become
      expert masters in their respective weapons usage.Frost Blade''s Trial Was capable
      of evenly matching Jing Yuan''s glaive skills with her own sword skills in their
      deathmatch. Despite seeing in first hand Yanqing''s swordsmanship, she casually
      regards his sword''s skills as vastly inferior to her own, with Yanqing desperately
      trying to reach Jingliu''s level of skills in swordplay. Despite Yanqing being
      a renowned swordmaster on his own right, he is still far away from achieving
      the title of Sword Champion, with one of his life goals as a swordsman being
      to obtain this title,Yanqing Character Story: Part III showing once again that
      Yanqing''s swordplay skills pale in comparison to those of Jingliu)'
    source_ids: *id002
    confidence: 0.8
