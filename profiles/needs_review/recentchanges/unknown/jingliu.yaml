- id: claim-weaknesses-2d41e5b2
  section: weaknesses
  axis: weakness
  text: 'Jingliu is Mara-Strucked and requires her blindfold to keep her sanity under
    control. Xianzhou Natives are unable to heal or alter defects they are born with
    due to the unique nature of their physiology. For example, Dan Shu, who was born
    blind, is unable to cure her blindness even with foreign implants like eye implants.
    Her body rejects these modifications, regenerating her eyes back to their default
    state of blindness. {| class="mw-collapsible mw-collapsed" align="center" border="1"
    cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left'
  source_ids: *id003
  decisive: false
  status: unverified
