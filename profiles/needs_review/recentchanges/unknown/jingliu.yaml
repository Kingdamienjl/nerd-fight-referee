  section: equipment
  axis: equipment
  text: 'An ebony blade that she can summon : Increases the wearer''s critical damage
    by 32%. When an ally gets attacked or loses health point, the wearer gains 1 stack
    of Eclipse, up to a max of 3 stack(s). Each stack of Eclipse increases the damage
    of the wearer''s next attack by 24.0%. When 3 stack(s) are reached, additionally
    enables the attack to ignore 20% of the enemy''s defence. This effect will be
    removed after the wearer uses an attack. File:I Shall Be My Own Sword.png|I Shall
    Be My Own Sword'
  source_ids: *id003
  decisive: false
