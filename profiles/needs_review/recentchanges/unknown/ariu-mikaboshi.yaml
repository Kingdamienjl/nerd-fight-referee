    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (Ariu is a highly capable combatant who exploits both his abilities
      and his opponents' lapses in battle. After negotiations broke down and Hiroto
      slit his throat, Ariu played dead for an extended period of time waiting for
      the Irishima Squad to let their guard down briefly activating Sumika to regenerate,
      taking advantage of the situation, which immediately killed the delegate sitting
      in front of him before disappearing from sight and ambushing Mashiro after he
      noticed something and had strayed away from the rest of the group to observe
      what happened, incapacitating him. After eliminating the Irishima Squad entirely
      he deliberately left Shiba as the only survivor due to the nature of his sorcery
      reviving him from a slit throat with only enough capacity to return to Japan
      and relay information about the Mikaboshi and their demands to Japan as a messenger.
      During his fight with the Irishima Squad. Immediately recognized that Yoshinojo
      had begun to understand the effects of his Sorcery and his attempt at countering
      the numbness with pain working to counter his attack. Later, after recovering
      from the Haruma Ironball and being surrounded by Hiroto, Shiba, Mashiro, and
      Yoshinojo, Ariu abandoned his previous restraint and released the full power
      of Sumika, wiping out the group before they could capitalize on their advantage,
      instantly changing the flow and deciding the battle)
    source_ids:
    - vsbattles-ariu-mikaboshi-unknown
    confidence: 0.6
    notes: auto_repair source extraction
