- id: claim-powers-and-abilities-547227ed
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Flight *Immortality (Type 2 and 7;\
    \ Was unharmed being crushed, getting bitten by snakes and getting a Axe stuck\
    \ on his head) *Enhanced Senses & Limited Sound Manipulation (Other vampires such\
    \ as Mavis could hear sounds from multiple meters away, using echolocations) *Shapeshifting\
    \ (Can shapeshift into a mouse, bat and a wolf) *Longevity (Vampires can still\
    \ age however much slower than humans) *Surface Scaling (Vampires can walk up\
    \ walls and ceilings) *Aura (When Dracula feels the need to scare people, an mysterious\
    \ red light surrounds him) *Limited Invisibility (Vampires are shown to be invisible\
    \ in front of cameras.) *Absorption (Vampires can suck the blood out of beings.)\
    \ *Small Size (Type 1; Via his Bat and Mouse form) *Transmutation (Vlad was able\
    \ to transmutate Cakey cosplay into a much more monstrous look, which Dracula\
    \ was able to reverse.) *Creation (Dracula was able to cover Johnny with birdseed\
    \ , Vlad was able to make Cakey shoot out cakes from his mouth, despite Cakey\
    \ just being a costume with a person inside) *Regeneration (Mid-Low Regenerated\
    \ from severe sunburns that left huge gashes in him) *Size Manipulation & Statistics\
    \ Reduction (Dracula's father, Vlad can shrink Bela, which made him weak enough\
    \ to be considered harmless) *Soul Manipulation (Stated by both Dracula, and Vlad,\
    \ that they can steal the souls of people) *Time Stop (Froze everything and everyone\
    \ besides Mavis. Nullifies momentum of sentient and non-sentient beings or objects\
    \ alike, even halting the movement of flames and the effects of extreme temperatures,\
    \ and those 'frozen' in place either on ground or airborne while defying gravity\
    \ may not remember what happened during their frozen state) *Mind Manipulation\
    \ & Memory Manipulation (Can Hypnotize people with a glare to speak for him or\
    \ to erase their memories)''' *Portal Creation (Vampires can create portals to\
    \ Fangceanera, a separate dimension.Hotel Transylvania The Series: S1 Ep 26) *Telekinesis\
    \ (Telekinetically moved objects and people around) *Clairvoyance (Vampires use\
    \ it multiple times to see hundreds upon hundreds of meters away) *Electricity\
    \ Manipulation (Powered Johnny's laptop with a finger) *Minor Body Control (Can\
    \ bend and move his body in unnatural ways) Resistance to: *Pain (Was shot with\
    \ many arrows, bitten by plenty of snakes, had an axe stuck in his head all around\
    \ the same time without him noticing) *Possibly Fire Manipulation (1150\xB0C:\
    \ Can run through fire unharmed) *Possibly Poison Manipulation (Was bit with what\
    \ appears to be Pit Vipers with no sign of being hurt or poisoned in anyway and\
    \ just shrugged it off) *Mind Manipulation (Vampires can't be hypnotized) *Time\
    \ Stop (Vampires can't freeze other VampiresHotel Transylvania: Transformania;\
    \ Novelization)"
