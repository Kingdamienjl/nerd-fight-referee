  intelligence:
    text: Genius (Understood all of Norman Osborn's research, including on the topic
      nanotechnology, writing a paper on said topic much to Norman's approval. Has
      been referred to as "brilliant" by Curt Connors, who is a quantum physics scientist.
      His intellect impressed Otto Octavius, who built his mechanical arms and a self-sustaining
      nuclear fusion reactor which could sustain a protostar. Peter considered that
      the fusion of Otto's reactor would become unstable, which was ultimately true,
      with the latter even admitting that Parker was correct. Calculates his jumps
      and web swings as to make sure he can safely perform them. Harry Osborn and
      Gwen Stacy have called Peter a genius,Spider-Man 3 with Gwen herself being a
      lab worker in Curt Connors' lab)
