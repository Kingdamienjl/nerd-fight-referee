- id: claim-weaknesses-cc915900
  section: weaknesses
  axis: weakness
  text: "Due to his strong heroism, Peter does not hesitate to sacrifice himself for\
    \ the sake of others, especially his beloved ones. Initially, he was prone to\
    \ losing his powers due to emotional turmoil stemming from having an existential\
    \ crisis, but has since overcome this. In the Black Suit, he becomes susceptible\
    \ to high-frequency sonic waves, and he becomes more aggressive, irritable, and\
    \ violent. ==Gallery== Humanspider.jpg|Peter's Wrestling Suit Spider-Man concept\
    \ art.jpg|Alex Ross\u2019 Spider-Man 2 art 2002 Spider-Man concept art.jpg|Alex\
    \ Ross' art of the Raimi Spider-Man suit as depicted in the first 2002 film NWh\
    \ Friendly Neighborhood Spidey.png|Official render Spider-Men Official.jpg|No\
    \ Way Home promotional art depicting all three Spider-Men Spider-Men 3 Official.jpg|Promotional\
    \ art (2) Spider-Men 2 Official.jpg|Promotional art (3) ==Notable Matchups== Victories:\
    \ * Homelander (The Boys) Homelander's Profile (Spider-Man had the Black Suit\
    \ and Homelander was in his V-One key. The fight took place in the DC Universe's\
    \ version of New York City) Losses: * Spider-Man (The Amazing Spider-Man) Spider-Man's\
    \ Profile (Speed was equalized. Both were High 8-C. The fight took place in New\
    \ York City and both were bloodlusted) * Spider-Man (Marvel Cinematic Universe)\
    \ Spider-Man's Profile (Speed was equalized. Both were 8-C. Base Raimi Spider-Man\
    \ and Tech Suit MCU Spider-Man were used. The fight took place in New York City\
    \ and both were bloodlusted) * Spider-Man (60's Cartoon) Spider-Man's Profile\
    \ (Speed was equalized. Black Suit Raimi Spider-Man was used. The battle took\
    \ place in an open New York City, and their starting positions were on the top\
    \ of rooftops of separate buildings) * Thunderbolts (Marvel Cinematic Universe)\
    \ Thunderbolts' Profile (Speed was equalized. Base Spider-Man was used and was\
    \ 8-C. Both had prior knowledge on each other. The fight took place in the Sakaar\
    \ Battle Arena) Inconclusive: ==References== ==Notes/Explanations== Category:Characters\
