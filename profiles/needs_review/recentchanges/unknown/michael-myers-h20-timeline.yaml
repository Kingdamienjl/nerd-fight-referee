  attack_potency:
    text: 'Wall level (Comparable to those who can harm him1.273 Megajoules/0.3043
      KG of TNT. Walked through a solid wooden door with ease,Halloween: Resurrection
      which requires this much energy. Tore open a wooden door with his knife.Halloween
      H20: 20 Years Later Sent Freddie flying across a room with a single hand, destroying
      wooden shelves in the processHalloween: Resurrection. Effortlessly crushed the
      throat of a paramedic, who later tanked getting thrown through a windshield
      and hit/crushed by a van. In a comic, Michael was also far superior to another
      victim who survived getting hit at high speed by a car)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: 'Superhuman (Frequently disappears from sight, eluding the senses of those
      around him.Halloween Managed to get the jump on Alice from close range.Halloween
      II Murdered Bernard before he could react.Halloween II Disappeared, despite
      Laurie keeping a visual lock on him.Halloween: Resurrection Managed to catch
      up to John and Molly, despite the two having a massive head start. Caught up
      to Lisa and her friends at the carnival, despite them driving away in a car)'
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: 'At least Class 1 (Unearthed Judith Myers'' tombstone,Halloween with tombstones
