    - field: weaknesses
      value: 'Goku often seeks to fight opponents at their best and will allow them
        to reach their full power so he can have a good fight. Kaio-ken strains his
        body and causes intense pain. It could horribly damage or even kill him if
        he doesn''t use it sparingly. He has a tendency to be so overconfident that
        he drops his guard, lowering his durability. He needs a long charge time to
        prepare his Spirit Bomb, leaving him open to attack. In order to use Instant
        Transmission, he needs to sense a ki signature to teleport to. Using Super
        Saiyan 3 drains a lot of stamina and he cannot use it for more than a few
        minutes. Is unable to survive in the vacuum of space. Notable Attacks/Techniques:
        *Ki Blast: The most basic form of energy wave. *Invisible Eye Blast: Goku
        has the ability to shoot an invisible blast of ki out of his eyes. He uses
        this twice in the anime (once in the manga). The first (and only time in the
        manga) was when he used it to dig a hole in the Namekian ground to bury Vegeta''s
        corpse in after he was killed by Frieza. *Destructo Disk: The user holds their
        hand into the air, conducting ki in the form of a razor-sharp disc, which
        is then hurled over and around the body to cut the target. **Destructo Disk
        Hexa Blade: Goku moves a Destructo Disk around in specified patterns, cutting
        up pieces of land or people in an instant. *Kamehameha: Goku''s signature
        energy attack, even though it was invented by Master Roshi. Goku first learned
        this technique after witnessing Roshi use it to extinguish the fire on Fire
        Mountain. Goku has also invented numerous variations of the technique, including
        the Bending Kamehameha, Super Kamehameha, Kaioken Kamehameha, Double Kamehameha,
        Twin Dragon Shot, Angry Kamehameha, Flying Kamehameha, Instant Kamehameha,
        True Kamehameha, and Kamehameha Rebirth. He now gains a far more powerful
        version after mastering his godly ki called the God Kamehameha or Burst Kamehameha.
        He can also use them in his Super Saiyan forms. *Continuous Kamehameha: Goku
        releases a rapid barrage of energy blasts at his opponents, causing a massive
        accumulation of damage. Also called Super Energy Wave Volley. *Solar Flare:
        The user spreads and places their fingers on their foreheads, discharging
        a blinding flash of light. *Homing Energy Wave: A move where Goku fires a
        Ki Blast that targets his enemy. He used it against Pikkon. *Kaioken: Goku
        forms a red ki aura around his body, multiplying his power level, enhancing
        his strength and speed. The highest level of this attack used is x20. Goku
        does not use it much after becoming Super Saiyan. However, Goku has a technique
        where he combines the Kaio-ken with his Super Saiyan transformation, the Super
        Kaio-ken; this is done on one occasion, in his fight against Pikkon. So far,
        this only applies to the movie continuity. As of Dragon Ball Super, Goku once
        again used Kaioken in conjunction with Super Saiyan Blue against his fight
        with Hit. However there was initially supposedly just a 10% chance of the
        technique working successfully, and otherwise ending in failure and likely
        severe consequences. *Genki-Dama (Spirit Bomb): One of Goku''s signature attacks
        in which he conducts the spirit energy of all nearby living organisms, forming
        a ball of power and size depending on the amount of harnessed ki energy. Its
        power was used against many powerful opponents such as Vegeta, Frieza, and
        Kid Buu. It has a few variations: Large Spirit Bomb, Instant Spirit Bomb,
        and Super Spirit Bomb. *Shunkan Ido (Instant Transmission): Also called Instantaneous
        Transmission the user places their index and middle finger on their forehead,
        sensing a person that they can teleport to. *Afterimage Technique: This technique
        is a short burst of extremely high speed, moving faster than the opponent
        can sense. This has the side effect of leaving a momentary "after image" until
        the opponent''s senses adapt and realize their target has moved. *Dragonthrow:
        Goku''s signature grapple throw. He uses an example of this move on Frieza
        when he grabbed his tail during their battle on Namek. *Full-Nelson: Executed
        by performing half nelsons with both arms, though Goku only used this once
        against Raditz. *Hasshu-ken: A technique, used to counter Tien Shinhan''s
        Four Witches Technique, in which Goku moves his two arms so fast that they
        each appear to be in four places at once, effectively giving him eight arms
        to use in combat. *Crazy Fist: This is a distraction move designed to confuse
        and taunt the opponent. Goku who acts like a dog or a monkey, barking and
        jumping around to scare his opponent. Goku uses this in reaction to Jackie
        Chun''s (Master Roshi''s alter-ego) use of the Drunken Fist. *Rock, Scissors
        ''N'' Paper: An attack in which Goku delivers either a strong punch, a poke
        in the eyes, or an open palm strike. *Tornado!: Goku spins while rushing on
        the opponent to attack him/her. Used against Nam. * Dragon Fist: An extremely
        powerful technique in which Goku launches himself at his opponent making a
        straight fist, which t'
