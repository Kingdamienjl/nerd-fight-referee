- id: claim-weaknesses-7e6694fd
  section: weaknesses
  axis: weakness
  text: 'Joseph''s barrier is only effective against lasers or metallic projectiles.
    Overuse of his electrification will damage his own body through this is slightly
    negated by Joseph''s regeneration. Notable Techniques: Electric Eel Base: By performing
    the M.O. operation on himself, Joseph gained the electric eel abilities of Adolf
    Reinhard. *Electrification: In his base state, Joseph''s muscles generate a large
    quantity of electricity which he can emit from his whole body. He usually directs
    this electricity with a pointed finger but can also apply his electrification
    through direct contact. *Electromagnetic Barrier: In his base state, Joseph can
    create an electromagnetic barrier that can disperse lasers. Other characters have
    used this ability to redirect bullets and detonate missiles prematurely. Planarian
    Base: By performing the M.O. operation on himself, Joseph gained the planarian
    abilities of Eva Frost. *Planarian Regeneration: In his base state, Joseph can
    regenerate from a significant amount of damage; being able to regrow missing eyes,
    limbs and even recovering from being decapitated and bisected. His regeneration
    should allow him to recover so long as there is a fragment of his body left like
    Eva Frost though this carries the risk of regenerating multiple bodies if severed
    pieces of his body begin regenerating.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
