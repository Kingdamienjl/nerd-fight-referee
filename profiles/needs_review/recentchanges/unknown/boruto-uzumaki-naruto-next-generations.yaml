    Stream. This is impressive as Jonin are usually expected to use at least 2 Nature
    transformations, whereas Boruto does this in the academy. By the time he becomes
    a Genin and the Chunin Exams roll around, his skills are arguably Jonin level,
    and he has also picked up Water Style, all without any real training. For a shinobi
    to utilize any jutsu, they must possess well-rounded scientific knowledge and
    must know every aspect contributing to said jutsu, excluding some exceptions.
    So, for Boruto to use Wind, Lightning, and Water styles, he must understand all
    three elements. When Sasuke tasked Boruto with learning the Rasengan so that he
    could become his student, He managed to do so in only a few days (three days,
    if I''m counting correctly). At first, it looks incomplete, as it''s small and
    vanishes. Still, Boruto actually went a step further and added a Nature Transformation,
    unconsciously creating an S-rank Vanishing Rasengan jutsu instead of replicating
