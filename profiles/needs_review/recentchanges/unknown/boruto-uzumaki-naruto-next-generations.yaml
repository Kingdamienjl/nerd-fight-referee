    \ | Momoshiki cannot absorb Jutsu or Chakra as it threatens to awaken Boruto's\
    \ consciousness making him lose control Notable Attacks/Techniques: Kage Bunshin\
    \ no Jutsu (Shadow Clone Jutsu): Boruto creates tangible \u201Cshadow clones\u201D\
    \ that can fight and use his techniques, but disappear after one definite hit.\
    \ Any information and experience the clones gained are transferred to Boruto upon\
    \ their dispersal. Sexy no Jutsu (Sexy Jutsu): Naruto's prankish invention. The\
    \ user transforms into a charming girl to lull the opponents' guards. *Harem no\
    \ Jutsu (Harem Jutsu): It combines the numbers advantage of the Shadow Clone Jutsu\
    \ with the distractive nature of the Sexy Jutsu to overwhelm male opponents. Rasengan:\
    \ A jutsu developed by his grandfather Minato Namikaze and perfected by Naruto,\
    \ it is a sphere of chakra energy. The original Rasengan was used for mid to close\
    \ range, and Naruto invented long-range variations. *Vanishing Rasengan: While\
    \ learning to use the Rasengan, Boruto accidentally developed a smaller variety.\
    \ As a trade-off of this, Boruto unconsciously applies lightning-natured chakra\
    \ to this Rasengan, enabling him to hurl it across distances. Although the Rasengan\
    \ itself only remains stable for a specific range, the wind itself continues on\
    \ its course unseen, inflicting comparable damage upon impact. center|330px|Boruto's\
    \ Vanishing Rasengan *Wind Style Rasengan: Boruto's version of Rasenshuriken where\
    \ Boruto applies wind chakra to his Rasengan and it forms a uniquely green chakra\
    \ and sports rings around the central sphere. Though his is incomplete, Boruto\
    \ is able to throw it. center|300x300px *High Compression Rasengan: By overlapping\
    \ the Rasengan as it is formed in the dominant hand with the other hand, the user\
    \ compresses and condenses it to its limit. In this state, it can penetrate targets\
    \ with little resistance. Even if the impact is reduced by a strong defense to\
    \ the point of making it non-lethal, it can still knock out powerful opponents.\
    \ At the same time, its compressed nature can cause severe recoil, greatly straining\
    \ the user's arm, making it dangerous to use often. *Rasengan: \"Unison\": *Big\
    \ Ball Rasengan: *Ultra-Big Ball Rasengan: * K\u0101ma Rasengan *Rasengan: \"\
    Uzuhiko\": center|300x300px Taijutsu *Gentle Fist: As his mother is of the Hy\u016B\
    ga clan, Boruto is trained in her family's Taijutsu style of fighting. Unless\
    \ he activates his Dojutsu to use his fighting style's full potential, Boruto\
    \ cannot easily inflict internal damage on an opponent. *H\u014Dka Ranbu (Wild\
    \ Dance of Spouting Fire): A Taijutsu technique that Boruto learned from Sasuke\
    \ Uchiha, he attacks an opponent with a kick and follows up with a punch and another\
    \ kick from the opposite leg. J\u014Dgan: His right eye becoming similar to the\
    \ Byakugan with a blackened sclera, it only activates whenever Boruto is in danger\
    \ and allows him to use his Gentle Fist as intended. While allowing Boruto to\
    \ use an opponent's chakra, it also allows him to see through invisible barriers\
    \ that connect dimensions. Kenjutsu *Uchiha Style Kenjutsu: *Iaid\u014D: K\u0101\
    ma: K\u0101ma is a seal bestowed by members of the \u014Ctsutsuki clan that takes\
    \ the form of a four-point black diamond on the recipient's body, marking them\
    \ as a \"vessel\", and if successful a \"perfect \u014Ctsutsuki\" for the clan.\
    \ Boruto Uzumaki received the mark on his right palm from Momoshiki \u014Ctsutsuki\
    \ after dealing a fatal blow to him. When activated it spreads across the right\
    \ side of his body forming angular and curving geometric patterns, extending up\
    \ to his right eye, and then glows blue. K\u0101ma significantly enhances the\
    \ user's physical abilities and jutsu's power. *Absorption: K\u0101ma allows him\
    \ to absorb any ninjutsu, negating its effects in the process. *Space-Time Portal:\
    \ This technique is a Space\u2013Time Ninjutsu used by the \u014Ctsutsuki clan.\
    \ The user creates a rift, which allows anyone enveloped to transfer to a chosen\
    \ location including foreign dimensions. Futon (Wind Style): One of the five fundamental\
    \ elemental nature transformations. It is performed by making chakra as sharp\
    \ and thin as possible. Wind Release is mainly short to mid-ranged offensive techniques\
    \ that combine brute force and keen precision to deal with cutting and slashing\
    \ damage. Wind techniques are usually performed by generating air circulation\
    \ and can be enhanced through this method as well. Wind-natured chakra can also\
    \ be channeled into blades to increase their cutting power and overall range.\
    \ *Repp\u016Bsh\u014D (Gale Palm): **Boruto Stream: A version of Gale Palm where\
    \ Boruto uses Wind chakra to increase his speed while infusing Lightning chakra\
    \ into his kunai. Raiton (Lightning Style): One of the basic elemental nature\
    \ transformation techniques that allow the user to generate lightning by increasing\
    \ the high-frequency vibrations of the"
