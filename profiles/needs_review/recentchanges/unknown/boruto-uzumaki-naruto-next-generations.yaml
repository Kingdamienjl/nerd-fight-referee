    Boruto can solve advanced problems with his methods even though he doesn''t pay
    attention in classes. When Shino gives him an even harder question far above his
    classes'' level, Mitsuki''s explanation is enough for Boruto to understand instantly.
    Without studying or cheating like the rest of his class, Boruto still managed
    to get a perfect score for the final exam to graduate. In the Academy, Boruto
    learned both Wind and Lightning Styles. He constantly used both with his ninja
