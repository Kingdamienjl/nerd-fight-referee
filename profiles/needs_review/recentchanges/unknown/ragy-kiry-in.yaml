- id: claim-powers-and-abilities-dc1d91d8
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Genius Intelligence *Master Hand-to-Hand
    Combatant *Skilled Swordswoman *Flight *Cloth Manipulation *Weapon Creation *Life-Fiber
    Manipulation *Immortality (Type 3) *Regeneration (High-Mid: regenerated from being
    cut to pieces by Satsuki and Ryuko) *Supernatural Willpower & Shockwaves Creation
    (Able to create massive shockwaves from her willpower alone) *Mind Control (Both
    towards others and herself) *Memory Manipulation, Empathic Manipulation and Morality
    Manipulation via Mental Refitting *Thread Manipulation *Self-Sustenance (Type
    1: Able to survive the vacuum of space both with and without her Kamui) *Energy
    Projection, Light Manipulation (Can emit light from her presence) *Astral Projection
    (Can create a projection of herself as a means of communication over long distances),
    *Limited Power Nullification (Able to negate the powers and transformations of
    Life Fibers), Resistance to: *Extreme Cold and Cosmic Radiation *Mind Manipulation,
    Memory Manipulation, Empathic Manipulation and Morality Manipulation (Completely
    unaffected by wearing Shinra-Koketsu constantly as well as having 70% of her body
    replaced with Life Fibers, when even normal Life fibers have mind and memory manipulation
    [As stated by Inumuta, anyone in Japan who hadn''t been consumed by COVERS had
    their minds taken control of by the Life fibers in their clothing and had parts
    of their memories eaten, so that word of Life Fibers taking over Japan wouldn''t
    spread]. Able to wear a Kamui, which is 100% Life Fibers, without any ill effects,
    when a normal person wearing clothing made of only 50% Life Fibers gets overwhelmed
    to the point of becoming a berserk monster.), *Heat Manipulation (Able to endure
    close combat and physical contact with Ryuko, whose body gives off enough heat
