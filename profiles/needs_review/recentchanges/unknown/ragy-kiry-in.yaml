        \ to kill her and having her father murdered, she had lived a full and happy\
        \ life and had a loving mother, as well as instantly making her fall in love\
        \ with her father's killer. The ability can affect a large number of people\
        \ simultaneously as well, having instantly taken control of the tens of thousands\
        \ of Honn\u014Dji Academy students that were mobilized against her. Ragyo's\
        \ higher forms have this power but to a much greater extent. Shinra-K\u014D\
