- id: claim-weaknesses-4737bdc4
  section: weaknesses
  axis: weakness
  text: "If someone cuts the Banshi threads of Shinra Koketsu, Ragy\u014D becomes\
    \ more vulnerable to attack. Her regeneration can be negated if she is cut from\
    \ both sides simultaneously. Notable Attacks/Techniques: *Life Fiber Manipulation:\
    \ Ragyo can freely manipulate Life Fibers, using them for a wide variety of abilities\
    \ from creating weapons such as swords to making fully functional artificial limbs\
    \ to taking control of the minds of her opponents. **Mental Refitting: By directly\
    \ affecting a target with her Life Fibers, Ragyo can instantly rewrite and destroy\
    \ every facet of one's personality, replacing their thoughts, emotions, and memories\
    \ with artificial ones of her choosing. This allows her to make people unquestionably\
    \ obey any command of hers, including fighting on her behalf or killing themselves.\
    \ This ability is thorough enough that she was able to instantly rewrite Ryuko's\
    \ entire lifetime of memories, making her believe that instead of her mother trying\
    \ to kill her and having her father murdered, she had lived a full and happy life\
    \ and had a loving mother, as well as instantly making her fall in love with her\
    \ father's killer. The ability can affect a large number of people simultaneously\
    \ as well, having instantly taken control of the tens of thousands of Honn\u014D\
    ji Academy students that were mobilized against her. Ragyo's higher forms have\
    \ this power but to a much greater extent. Shinra-K\u014Dketsu: Life Fibers Domination:\
    \ Ragyo's ultimate form which is designed for her by Nui. To draw out its full\
    \ power, a second host is required, often at the sacrifice of their life. *Absolute\
    \ Domination - Shinra-Koketsu mentally controls other Life Fibers and negates\
    \ their abilities. Ragyo uses this ability to call forth the Life Fibers and initiate\
    \ them to undergo the Cocoon Sphere Genesis. *Shapeshifting: Ragyo can slightly\
    \ alter her form like Senketsu and Junketsu. *Second Form - By removing the last\
    \ small bit of humanity and morality Ragyo had, she achieved a much more powerful\
    \ transformation. Ragyo is granted drastically increased abilities and can easily\
    \ overwhelm Ryuko. ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters\
    \ Category:Kill la Kill Category:Anime Characters Category:Antagonists Category:Astral\
    \ Projection Users Category:Billionaires Category:Cloth Users Category:Empathic\
    \ Manipulation Users Category:Evil Characters Category:Female Characters Category:Flight\
    \ Users Category:Geniuses Category:Immortals Category:Light Users Category:Magical\
    \ Girls Category:Memory Users Category:Mind Users Category:Morality Users Category:Parents\
    \ Category:Primary Antagonists Category:Psychopaths Category:Regeneration Users\
    \ Category:Rich Characters Category:Sadists Category:Scientists Category:Self-Sustenance\
    \ Users Category:Shapeshifters Category:Supernatural Willpower Users Category:Sword\
    \ Users Category:Thread Users Category:Villains Category:Weapon Creation Users\
    \ Category:Weapon Masters Category:Misanthropes"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
