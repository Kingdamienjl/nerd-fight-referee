  axis: equipment
  text: 'Power-Ups= *Homing Attack (With Mines) *Fire Manipulation (With Fire) *Ice
    Manipulation (With Ice) *Electricity Manipulation & Paralysis Inducement (With
    Lightning) *Perception Manipulation (With Illusion) *Limited Magnetism Manipulation
    (With Magnet) *Adhesive Manipulation (with Glue Trap) *Organic Manipulation (With
    Oil Slick) *Air Manipulation (With Wind) -Rings= *Damage Transferal (Up to 1-C
    [6-D] AP with Rings; Rings completely shield the user from harm so long as they
    have at least 1 in their possession. Upon taking an instance of damage, a varying
    amount will scatter from the one who collected them with higher durability causing
    less to drop. Rings have repeatedly shown the capacity to protect Base characters
    from villains far stronger than them, ranging from the likes of VoidSonic Shuffle:
    4th Dimension Space (vs Void)) to amped Titans such as SupremeSonic Frontiers:
    Another Story (vs The End)) **Healing & Stamina Recovery (Ring energy revitalizes
    the wielder and restores energy, as noted with Silver wanting to use some to replenish
    his energy. Rings are referred to by The End as being vitality) -Sonic Speed Simulator=
    -Extreme Gear= Metal Sonic 3.0 doesn''t have a specific Extreme Gear. For a more
    in-depth look at the mechanics behind Extreme Gear, as well as each specific board
    and the nature of the subclasses and powers provided, consult this page. *Technological
    Flight *Acrobatics *And several more as listed in the Extreme Gear page''s universal
    abilities. -Pets and Trails/Other= *Statistics Amplification (Of Damage, Speed,
    Jump Height, Energy, Oxygen, Luck, and Event) *Greater Magnetism Manipulation
    (Certain Pets and Trails can increase the reach at which one attracts Rings and
    Chaos Orbs to them) *Probability Manipulation (Non-Combat Applicable; via the
    Luck Stat) *Power Bestowal *Greater Accelerated Development (Pets and Trails increase
    the Experience gained from Chaos Orbs and steps made) *Greater Inventory Duplication
    (Pets can enable characters to collect hundreds of thousands of Rings with every
    Ring collected) *Fusionism (Fast Friends can take up to 150% of all of your Pets
    best Power, Experience gain, and Ring counts) *Aura (Several Trails emit an aura
    around the character) *Possibly Power Bestowal, Statistics Amplification, and
    Shapeshifting (With the Wisp Pets, which can potentially bestow their abilities
    upon their wielderThe Possibly rating indicates the possibility of the Wisp bestowing
    their abilities upon the user, and not the abilities themselves being categorized
    as a possibility. As such, this extends to all Wisp pets from Sonic Speed Sim.)
    **Aura (Explosive), Fire Generation, & Self-Destruction/Explosion Inducement (With
    Red Burst, which surrounds the user with an aura of fire that grants user the
    ability to cause detonations of fiery energy that damage nearby opponents without
    inflicting self-harm)Sonic Colors (DS): Sweet Mountain - Area 2, Mission 1) **Flight
    (With Crimson Eagle, which grants the user flight for a limited timeSonic Lost
    World: Desert Ruins Zone 1) **Pseudo-Black Hole Creation, Gravity Manipulation,
    Absorption, Levitation & Transmutation (With Indigo Asteroid, which will break
    down matter and convert it into more substance for the Asteroid Ring that expands
    from and surrounds the user) **Bodily Weaponry (Conventional) & Surface Scaling
    (With Pink Spikes, transforming the user into a ball covered in spikes that enable
    clinging to surfacesSonic Colors: Planet Wisp Act 1) A full list of all Pets in
    Speed Simulator can be found here and a full list of all Trails in Sonic Speed
