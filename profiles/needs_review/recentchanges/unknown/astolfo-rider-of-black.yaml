    things, giving away important information such as his strengths and weaknesses
    without thinking much of it. He sometimes even forgets the names of his own Noble
    Phantasms. The phasing ability of his Hippogriff has a high mana cost and taxes
    his stamina. Amplifying his strength with Monstrous Strength damages his body.
  source_ids: *id003
