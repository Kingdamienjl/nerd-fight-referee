      value: Astolfo is impulsive, clumsy, absent-minded, and extremely optimistic,
        lacking anything resembling common sense or restraint. He constantly chatters
        about anything that comes to mind, including the weaknesses and True Names
        of himself and his allies, and often forgets important objectives and information,
        such as the names of his Noble Phantasms. Despite this, as a Servant and one
        of the famed Twelve Paladins of Charlemagne, he is extremely skilled in combat,
        surpassing the ability of any living human when it comes to mounted combat.
      source_id: vsbattles-astolfo-rider-of-black-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Astolfo lacks restraint and common sense and thus constantly blabbers
        about things, giving away important information such as his strengths and
        weaknesses without thinking much of it. He sometimes even forgets the names
        of his own Noble Phantasms. The phasing ability of his Hippogriff has a high
        mana cost and taxes his stamina. Amplifying his strength with Monstrous Strength
        damages his body.
      source_id: vsbattles-astolfo-rider-of-black-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
