- id: claim-powers-and-abilities-ab95c212
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Possession, Expert Spearman, Flight\
    \ with the Hippogriff, Sound Manipulation with La Black Luna (Causes an explosion\
    \ of sound that deafens opponents and reduces those it kills to dust), Magic Negation\
    \ with Casseur de Logistille (Can break all magecraft close to High-Thaumaturgy,\
    \ save for Reality Marbles), Status Effect Inducement (Can force physical and\
    \ spiritual beings to \"fall\" with the Trap of Argalia), Self-Sustenance (Type-1,\
    \ traveled to the moon on his hippogriff even before becoming a Servant), Dimensional\
    \ Travel, Intangibility (Can phase through reality and the Reverse Side of the\
    \ World to disappear from sight and phase through attacks), Vehicular Mastery\
    \ (Can \"ride\" any vehicle or mount with supernatural skill), Statistics Amplification\
    \ (Can temporarily increase his own strength), Breaking the Fourth Wall (Scribbled\
    \ all over and commented on his own status page), Animal Manipulation, Supernatural\
    \ Luck, Minor Fate Manipulation (Servants with B-rank Luck or higher can change\
    \ their own fates to evade inevitable outcomes such as having their hearts destroyed\
    \ by G\xE1e Bolg), Limited Power Nullification and Servant Physiology, Resistance\
    \ to BFR"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
