power_scale:
  tier:
    text: with Hippogriff
    source_ids:
    - vsbattles-astolfo-rider-of-black-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Large Island level+ (Although he is considered a "second-rate Servant",
      his legend should make him at least as strong as a recent hero like EMIYA. Parried
      a few blows from a casual Mordred and briefly held back Siegfried), Small Country
      level with Hippogriff (A B-rank Anti-Army Noble Phantasm, making it comparable
      to Great Grudge of Rashoumon). Trap of Argalia bypasses conventional durability
    source_ids:
    - vsbattles-astolfo-rider-of-black-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Relativistic+ with FTL reactions and combat speed (Possesses a B-Rank agility
      stat and thus should be comparable to base Musashi. Is comparable to other servants
      in the Great Holy Grail War such as Spartacus and to a lesser extent Mordred),
      possibly Higher with Hippogriff (He flew to the Moon in an unspecified timeframe).
    source_ids:
    - vsbattles-astolfo-rider-of-black-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class M (Comparable to Martha who stopped a speeding train, Achilles who
      stopped a rolling 300 ton jumbo jet, Asterios who swam carrying the 100-150
      ton Golden Hind galleon ship while injured, and Jeanne who can spin an entire
      airplane)
    source_ids: &id002
    - mediawiki-305860
    confidence: 0.95
  striking_strength:
    text: Large Island level+
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Large Island level+ (Even though he is a "second-rate Servant", he's still
      strong enough to actively participate in combat with other Servants), Small
      Country level with Hippogriff (Survived being blasted by an EX-Rank Magic Attack)
    source_ids:
    - vsbattles-astolfo-rider-of-black-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Servants can fight for an entire day without tiring and continue
      fighting for as long as they have sufficient mana)
    source_ids:
    - vsbattles-astolfo-rider-of-black-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range, Hundreds of Meters with La Black Luna
    source_ids:
    - vsbattles-astolfo-rider-of-black-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Astolfo is impulsive, clumsy, absent-minded, and extremely optimistic, lacking
      anything resembling common sense or restraint. He constantly chatters about
      anything that comes to mind, including the weaknesses and True Names of himself
      and his allies, and often forgets important objectives and information, such
      as the names of his Noble Phantasms. Despite this, as a Servant and one of the
      famed Twelve Paladins of Charlemagne, he is extremely skilled in combat, surpassing
      the ability of any living human when it comes to mounted combat.
    source_ids:
    - vsbattles-astolfo-rider-of-black-unknown
    confidence: 0.6
    notes: auto_repair source extraction
