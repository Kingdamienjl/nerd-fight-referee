    - field: weaknesses
      value: 'As a Chojin, Chojin Physiology: As a Chojin, the race of super beings
        that inhabit the Kinnikuman world, Black Emperor is incredibly strong, fast
        and durable. All Chojin are able to withstand an incredible amount of damage
        before dying with them even being able to survive having large holes blown
        through their chest. A Chojin''s natural healing factor is far greater than
        any human''s with them being able to naturally heal from injuries that would
        take a human six months in just three days and Chojin can heal from large
        gashes across their body. All Chojin are able to extract their own Chojin
        Power from their body and grant to another Chojin, powering them up and healing
        them. :, Flight: All Chojin naturally have the ability to fly through the
        air with nothing propelling them forward like boosters or wings. This level
        of flight allows Chojin to fly in space. :, Size Changing: All Chojin naturally
        have the ability to grow in size, easily growing to become thirty metres tall
        with ease and no negative side effects., Burning Inferno: Black Emperor is
        able to generate an intense flame from his body called the Burning Inferno.
        Black Emperor can either use Burning Inferno to set an area on fire by shooting
        a beam of fire from his fingers or set himself on fire, making him impossible
        to touch without being burned.'
      source_id: character-stats-profiles-giant-dark-emperor-unknown
      provider_id: character_stats_profiles
      authority: high
