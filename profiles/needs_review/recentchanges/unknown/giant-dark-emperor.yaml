        to increase their size to the point that they become over 30 metres tall),
        Power Bestowal, Healing (Chojin have the ability to gather up their power
        and grant it to others and use it to heal them or resurrect them), Resurrection
        (Chojin are able bring themselves back to life by collecting four Lifeforce
        Spheres while in the Chojin Graveyard if they didn't die by old age or natural
        illness), Instinctive Reactions (Chojin are able to really on their instincts
        to fight their opponents), Limited Acausality (Type 1, Everyone in the Kinnikuman
        series is able to remember those who were erased from history or who had one
