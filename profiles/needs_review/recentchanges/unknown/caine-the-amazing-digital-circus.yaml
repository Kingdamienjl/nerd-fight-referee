- id: claim-powers-and-abilities-17bb00d0
  section: abilities
  axis: hax
  text: 'Passive: * Superhuman Physical Characteristics ** Inorganic Physiology (Type
    2; According to the Glitch Productions website, Caine is an artificial intelligence
    character in the virtual world that is The Amazing Digital Circus,The Amazing
    Digital Circus | Glitch Productions while also being literally nothing underneath
    his clothes and only having a skeleton when he is electrocuted) ** Self-Sustenance
    (Type 1, 2 and 3; As a completely artificial A.I being unlike humans in the Digital
    Circus, he shouldn''t require any of the living being''s sustenances) ** Immortality
    (Type 1, 2, and 5; Him being inorganic combined with the "day after day" part
    of the intro resetting itself a few times and there being no escape from The Amazing
    Digital Circus implies that he will never die by natural means as a digital entity,
    and Gooseworx even states that Caine doesn''t need to age. Characters from TADC
