      value: Chiron cannot fight while in Spirit Form. He can only use Antares Snipe
        once per night and its power output is not convenient if his opponent is able
        to survive it.
      source_id: mediawiki-298409
      provider_id: vsbattles
      authority: high
      confidence: 0.75
