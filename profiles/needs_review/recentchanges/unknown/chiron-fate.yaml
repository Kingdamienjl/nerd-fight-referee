  intelligence:
    text: Chiron is known to have been bestowed with the wisdom of the Greek Gods,
      making him extremely knowledgeable in a variety of fields, and taught many Greek
      heroes the tools of their trade including the famous Heracles, Achilles and
      Castor. While he is a master of the spear and sword, his skill with the bow
      is particularly renowned and is said to tread into the realm of the gods as
      he was immortalized as the archer constellation Sagittarius after his death.
      In addition to his expertise in the use of a bow, spear, and sword, he is also
      a master of Pankration, the oldest mixed martial art in Greece. With it he's
      able to fight the likes of Mordred to a draw, breaking her arm while setting
      her up for a finishing blow at the cost of injuring his own shoulder, forcing
      a draw. He is able to combine this with his archery, sending Achilles flying
      with a kick before attempting to shoot his heel while the latter was still in
      mid-air. When they both discarded their weapons and had a barehanded duel to
      the death in Achilles' duel field, Chiron lost but it was close enough that
      Achilles stated that he would never want to duel Chiron again. In addition to
      his combat prowess, he is also a master healer, having taught the man who would
      become the Greek God of Medicine, Aesculapius. He is able to instantly diagnose
      Sieg's condition by scanning over him with his eyes and checking his pulse,
      as well as estimate the latter's lifespan. He is also a capable field commander,
      having been entrusted by Vlad to dictate the movements of the homunculi, golems,
      and his fellow Servants in his absence.
    source_ids:
    - vsbattles-chiron-fate-unknown
    confidence: 0.6
    notes: auto_repair source extraction
