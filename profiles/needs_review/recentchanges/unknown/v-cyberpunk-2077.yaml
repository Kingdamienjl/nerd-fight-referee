- id: claim-powers-and-abilities-7e064c7e
  section: abilities
  axis: hax
  text: "Base \u25BE= * Superhuman Physical Characteristics * Weapon Mastery * Vehicular\
    \ Mastery * Martial Arts * Stealth Mastery * Multiple Selves (Type 1; Slotted\
    \ in V's neural interface is an experimental Relic that contains the engram of\
    \ Johnny Silverhand, a digitalized psyche of a human being. Via the Relic, V essentially\
    \ has two minds inhabiting the same body and is able to converse and work together\
    \ with Johnny, and can even give control over the body to Johnny.) * Cyborgization\
    \ (At least Partial; Can enhance their body by adding cybernetically empowered\
    \ limbs, artificial organs, modifying frontal cortices, converting their arms\
    \ into a blade or cannon, etc.) * Damage Boost (Numerous cybernetics and perks\
    \ allow V's damage, attack speed, movement speed, and reactions to be increased)\
    \ * Fire Manipulation (Utilizes thermal weaponry mods and makes use of incendiary\
    \ grenades) * Status Effect Inducement (With a wide variety of grenades and modifications\
    \ that can inflict fire, chemical or electrical damage on enemies) * Enhanced\
    \ Senses and Information Analysis (With Kiroshi optics, allows V to scan their\
    \ environment to get information on people or objects. In addition, V can see\
    \ a weak point in their enemy and target it for critical damage) * Limited Automatic\
    \ Translation (V can automatically translate multiple languages spoken throughout\
    \ Night City (such as Japanese, Mandarin, Korean, Spanish, Russian, French and\
    \ Haitian Creole) without any knowledge in said languages, by having \"auto-translation\
    \ packages\" installed) * Homing Attack (With smartguns, shots can maneuver around\
    \ cover or specifically aim towards people's heads; the projectile cannon also\
    \ shares a targeting system that can occasionally maneuver shots around cover)\
    \ * Poison Manipulation (With chemical mods and toxic grenades) * Electricity\
    \ Manipulation (With electrical mods and EMP grenades) * Extrasensory Perception\
    \ (Using a recon grenade in his surroundings, even through walls) * Damage Boost\
    \ and limited Durability Reduction (V's shotguns, LMGs, and Heavy LMGs do more\
    \ damage than usual, can partially ignore enemy armor, and gain the ability to\
    \ completely obliterate enemies with a direct hit) * Regeneration (Mid-Low; Can\
    \ rapidly heal flesh wounds even in the middle of combat) * Statistics Amplification\
    \ (When V triggers adrenaline rush, they become stronger, faster and gain resistances\
    \ against movement penalties and non-damaging status effects like blinding or\
    \ being knocked down) * Vibration Manipulation and Healing (V can smash the ground,\
    \ triggering a localized quake that damages enemies and knocks them over in addition\
    \ to healing V) * Damage Boost (V's SMGs, Assault Rifles do increased damage and\
    \ get more powerful with every consecutive hit) * Acrobatics (V can do rapid dashes,\
    \ jumps, slides from moving vehicles and change direction midair through their\
    \ agility) * Statistics Amplification (V can increase their durability up to a\
    \ 90% damage reduction with cyberware and feats of acrobatics) * Status Effect\
    \ Inducement (V with bladed weapons can inflict bleeding, a damaging effect that\
    \ slows down others and causes damage over time effect due to the blood loss)\
    \ * Durability Negation (V with this attribute primarily uses MonoKatana's, weapons\
    \ with molecular sharp edges that vibrate thousands of times a minute to chew\
    \ through armor and people) * Technology Manipulation (V can counter-hack others,\
    \ control machines, and control devices that are connected to the internet) *\
    \ Hacking (V can hack into even secure military-grade encryptions and, if needed,\
    \ can Overclock their processor to pierce through normally unhackable defenses\
    \ at the cost of taking damage. However, hacking requires either a Cyberdeck or\
    \ V directly interfacing with the object) * Statistics Amplification (V can increase\
    \ the effectiveness of SMART weapons, guns that fire homing bullets) * Durability\
    \ Negation and Thread Manipulation (V with this attribute primarily uses Monowire,\
    \ which is molecule or atom wide wire capable of slicing through most objects.\
    \ * Statistics Amplification (V can increase the effectiveness of grenades and\
    \ tech weapons (i.e., railguns) to do greater damage and charge quicker) * Enhanced\
    \ Cyborgization (Likely Full; V under this path is implied to become a full conversion\
    \ cyborg, which is where the majority of their body has been swapped out with\
    \ Cyberware) * Electricity Manipulation (V can generate a large EMP pulse that\
    \ damages all around them) * Rage Power (V, when fully borged out, has a chance\
    \ to enter a lucid state of Cyberpychosis, massively increasing their damage output)\
    \ * Enhanced Stealth Mastery * Damage Boost (V's damage with knives and stealth\
    \ attacks are greatly increased) * Perception Manipulation (Reflex Tuners and\
    \ Kerenzikov all slow V's perception of time when dodging, blocking, near death,\
    \ aiming, or when V triggers it by 80% and 90% respectively) * Healing (Allows\
    \ V's health to return to peak condition automatically during critical condition\
    \ with the Biomonitor"
