- id: claim-weaknesses-0dbfc0f6
  section: weaknesses
  axis: weakness
  text: V's body is rejecting their brain cells and neural network, causing them to
    degrade in health and eventually die. Quickhacks can only work on machines or
    people who have cybernetics within their neural network. Second Heart and Biomonitor
    have a cooldown of two minutes. Other cyberware that amp V also have cooldowns
    (albeit much shorter). V can only install a certain amount of cyberware at a time,
    and the extreme amount of cyberware eats away at their mental state, occasionally
    resulting in them going into fits of murderous rage.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
