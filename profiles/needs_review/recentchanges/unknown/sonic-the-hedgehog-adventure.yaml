      Emerald, something that [https://youtu.be/jGKpiLp0A8A?t=6 Shadow deemed impossible]
      despite his intricacies with Chaos Energy. While costing a lot for him to use
      it the first time, Sonic quickly improved upon it to [https://cdn.imgchest.com/files/50d0735f307b.mp4
      continuously use it against] Shadow with no further repercussions. Sonic can
      [https://imgur.com/a/4kR5Xv1 "perfectly read" patterns, adapt and outperform]
      his opponents mid fight, even against master [https://imgchest.com/p/wl7l6qx267x
