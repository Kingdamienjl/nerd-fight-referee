  attack_potency:
    text: Solar System level (Superior to his classic self. Repeatedly defeated Chaos
      after he absorbed [https://youtu.be/gSbWTyxjEC4&t=94s up to four] Chaos Emeralds,
      where the energy produced from one alone could move planetary fragments [https://youtu.be/OOoLbddZEbQ
      or] [https://imgur.com/a/myXt8tz split the Earth]. Can defeat enemies described
      as some of "[https://imgur.com/a/gxY0Pzt the toughest he has ever faced]" during
      Sonic Advance 2), higher with the Light Speed Attack (The Light Speed Attack
      is capable of [https://m.youtube.com/watch?v=DqLi1zXUdRQ&t=23 letting Sonic
      one-shot enemies he normally takes several hits to destroy]), higher with 3
      Power Cores (As noted by Dr. Starline, Power Cores [https://cdn.imgchest.com/files/07589f4a2ba9.jpg
      are concentrated energy that each double the user's attributes] upon harnessing
      it [an 8x increase at Max Level]) | Solar System level (On par with Shadow by
      the time of the Black Arms invasion, who surpassed his previous threshold of
      strength. Fought Emerl after he gained all seven Chaos Emeralds, [https://imgur.com/a/QiMNCId
      who had grown in strength with each one], and [https://youtu.be/BaTKL2XL-4I?t=2831
      had a much easier time] than Shadow did. While teaming up with Shadow, they
      [https://youtu.be/BaTKL2XL-4I?t=3313 fought Emerl at its full power] as it had
      the Chaos Emeralds), higher with the Light Speed Attack | Galaxy level (Confronted
      Ultimate Emerl and [https://youtu.be/wqfxViAIizo?t=1283 inflicted enough damage]
      to [https://postimg.cc/gallery/TK2T3Tf break him down], who was stated to have
      [https://cdn.imgchest.com/files/dab967c8a830.mp4 surpassed his limits] after
      having [https://static.wikia.nocookie.net/vsbattles/images/4/4e/Sonic_Battle_Strongest_Strategy_Guide_pg_90.jpeg/revision/latest?cb=20250816123954
      copied] and [https://static.wikia.nocookie.net/vsbattles/images/1/16/Sonic_battle_guidebook_translation.png/revision/latest?cb=20250816124255
      captured the gigantic power of] the Final Egg Blaster, made at least 128 times
      more powerful due to the 7 Chaos Emeralds he had amplified himself with, which
      each grant their user an amplification superior to what Power Cores can provide.
      Fought Gemerl and repeatedly destroyed various Eggtech mechas comprised of him,),
      up to Complex Multiverse level (Should superior to Classic Super Sonic, who
      destroyed the Phantom King and aided in the fight against the Time Eater. Superior
      to the power of the World Rings)
