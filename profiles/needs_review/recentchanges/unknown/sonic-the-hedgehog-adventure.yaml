    prior, later on [https://cdn.imgchest.com/files/457c8dcc7429.mp4 later replicated
    Chaos Control himself] in his first try of it with a fake Chaos Emerald, something
    that [https://youtu.be/jGKpiLp0A8A?t=6 Shadow deemed impossible] despite his intricacies
