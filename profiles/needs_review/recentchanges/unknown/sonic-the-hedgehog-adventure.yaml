- id: claim-powers-and-abilities-ad2d5cba
  section: abilities
  axis: hax
  text: "Border|||Content=All the Powers and Abilities of his Classic Self plus: *Greater\
    \ Superhuman Physical Characteristics **Small Size (Type 0; Is 100 centimeters\
    \ tall) **Afterimage Creation (Skill; With Boost Mode) **Greater Acrobatics (All\
    \ Types; Sonic repeatedly shows great agility, dexterity, and fast-paced coordination.\
    \ Regularly performs hypermobile movements with his body, complimented by his\
    \ ability to curl into a ballSonic Heroes [Opening cutscene] and perform techniques\
    \ like the Spin Attack or Homing Attack. He can traverse a large variety of terrain\
    \ with no issue at blazing speeds, from corkscrews and loop-de-loopsSonic Rush:\
    \ Leaf Storm Zone 1 Act 2 to exploding spaceships and hazardous volcanoes. Able\
    \ to increase his forward and upward momentumSonic Advance 2: Music Plant Zone\
    \ Act 1 and utilize double jumps, as well as bring his momentum to a screeching\
    \ halt both on the ground and in the air) ***Spin Attack (Advanced) *Accelerated\
    \ Development (Training, Battle, Leveling, Passive & Other, Physical Stats, Abilities,\
    \ Techniques & Other [Fighting Skill]; Went from having his attacks easily reflected\
    \ and being tagged by Chaos 0, to being able to win against Chaos 4 and keep up\
    \ with Chaos 6. After witnessing Shadow perform Chaos Control, Sonic was later\
    \ able to replicate the use of the technique and perform Chaos Control himself\
    \ with a fake Chaos EmeraldSonic Adventure 2. Even with the Special Stages getting\
    \ trickier and Zero getting faster, Sonic still was able to complete them in order\
    \ to gain a Chaos Emerald. Continuously kept up with Emerl after the Gizoid received\
    \ each Chaos Emerald, even fighting against him alongside Shadow, altho he lost.\
    \ Grew in power to defeat Emerl in much less than 30 seconds, even when the Gizoid\
    \ had mastered all the fighting styles of himself, Shadow, Amy, Knuckles, Tails,\
    \ Cream, Chaos Gamma and Chaos 0 at once, but also upgraded them into far superior\
    \ versions of themselves into the \u201C???\u201D moves. Repeatedly noted to trainSonic\
    \ Battle: Sonic's Story; and grow faster as well as stronger. Characters are capable\
    \ of gaining experience per step taken,Sonic Speed Simulator with each level up\
    \ increasing speed, jump height, and experience gained to a maximum of Level 134;\
    \ through Rebirths, they can increase their base statsRebirths are canonical,\
    \ as Dr. Eggman accidentally rebirthed the entire timeline by using Rebirth Energy.)\
    \ *Greater Senses (Unlike Knuckles, noticed someone coming despite the tremors\
    \ on Ark) *Toon Force **More Fourth Wall Awareness (In Shadow the Hedgehog. he\
    \ acknowledges the start of an level or the end of an route. In Sonic Battle,\
    \ when Shadow asks from Sonic to let him destroy Emerl, the player is given 2\
    \ options: \"YES\" and \"NO\". Even if the player chooses \"YES\", Sonic instead\
    \ asks if he was really expected to agree and fights Shadow anyways) **Hammerspace\
    \ (Is able to store items into a reachable and invisible space. Has gathered large\
    \ amounts of Rings to spend at the Chao Gardens. Can store Chaos Emeralds in a\
    \ spaceSonic Unleashed: Mazuri Gaia Temple behind his back. Can hold countless\
    \ Rings, Pets, Trails and vehicles in his hammerspace) *Expert Hand-to-Hand Combatant\
    \ (Adventure Sonic implements dancing moves with a balance of offense and defense\
    \ in his fighting style.Sonic Battle Japanese WebsiteSonic Battle Saikyou Kouryaku\
    \ Guide Despite Emerl constantly fighting & learning from most cast during Sonic\
    \ Battle, the hedgehog had still more teach him about combat by the end of the\
    \ gameSonic Battle: Shadow StorySonic Battle: Emerl Story) *Analytical Prediction\
    \ (Shown to notice patterns in his opponent's style and adapt to fight accordingly)\
    \ *Weapon Mastery (Sonic is skilled with a lassoSonic Shuffle: Ring Lasso (Mini\
    \ Game)) *Vehicular Mastery (Able to pilot aircrafts, vehicles, and Extreme Gears\
    \ expertly) *Minor Danmaku (Sonic has homing air currents with Sonic Wind, which\
    \ forms around an opponent, locks onto them, and ensnares them) *Dimensional Travel\
    \ (Noted to have returned to his world from the Arabian Night and World of Camelot\
    \ alternate realities. Can travel to Special StagesSonic Advance 2 - Leaf Forest,\
    \ which reside in a separate dimension, simply by runningSonic Advance 2) * Statistics\
    \ Amplification (Skill; Same as his Classic self plus; Boost Mode & Speed Up.\
    \ Passively increases his defense to take less damage from attacks with Strength\
    \ Support, increases his attack to deal more damage to his oponents with Attack\
    \ Support and improve his acceleration with Acceleration Up) *Air Manipulation\
    \ (Ability; Has homing air currents with Sonic Wind, which forms around an opponent,\
    \ locks onto them, and ensnares them) *Explosion Manipulation (With Sonic Crackers,\
    \ which are landmines) *Healing, Forcefield Creation & Energy Restoration (With\
    \ Sonic Heal, he can heal at supersonic speed from any damage he may have taken.\
    \ With his Guard Skill, Sonic Guard, Sonic can defend himself by creating a pulsing\
    \ purple barrier. Receiving damage, blocking attacks with his Guard Skil"
