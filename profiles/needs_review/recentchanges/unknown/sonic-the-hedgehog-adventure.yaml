    quickly improved upon it to [https://cdn.imgchest.com/files/50d0735f307b.mp4 continuously
    use it against] Shadow with no further repercussions. Sonic can [https://imgur.com/a/4kR5Xv1
    "perfectly read" patterns, adapt and outperform] his opponents mid fight, even
    against master [https://imgchest.com/p/wl7l6qx267x martial artists]such as Knuckles,
    and Emerl, the latter of which being 4.000 year old war combat machine with its
    combative data alone having caused Gerald Robotnik's strongest computer to crash
    upon trying to load it, that then went on to scan the fighting style, skills and
    data of down to their very poses, including Sonic himself, with the blue blur
    [https://www.youtube.com/watch?v=BaTKL2XL-4I&t=3664s still being unimpressed]
    by Emerl and [https://www.youtube.com/watch?v=wqfxViAIizo&t=68s continued to teach
    him more]. When Emerl awakened to his Ultimate form, [https://www.youtube.com/watch?v=SXx7KJo1md0
    using a fighting style that mixed it up all of the moves he had scanned prior],
    Sonic [https://www.youtube.com/watch?v=wqfxViAIizo&t=1255s was still able to adapt
    and beat him in less than 30 seconds]. Additionally, Sonic is also able to quickly
    learn how to use skillfully use weapons, [https://cdn.imgchest.com/files/1503ef360a8a.mp4
