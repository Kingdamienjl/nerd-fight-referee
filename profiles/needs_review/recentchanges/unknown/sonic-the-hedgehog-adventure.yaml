      adapt and beat him in less than 30 seconds]. Additionally, Sonic is also able
      to quickly learn how to use skillfully use weapons, [https://cdn.imgchest.com/files/1503ef360a8a.mp4
      such as a lasso], [https://imgchest.com/p/na7kg29vm48 a return-to-sender fashion],
      [https://imgchest.com/p/qe4g3zawbyj and deter charging opponents].. ***Flying
      Spin
