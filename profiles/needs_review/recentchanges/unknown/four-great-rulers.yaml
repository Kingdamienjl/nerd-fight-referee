  tier:
    text: ', with Fate Manipulation, with Environmental Destruction for Istaroth'
    source_ids:
    - vsbattles-four-great-rulers-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Large Planet level (Fought and defeated the original Seven Sovereigns like
      Apep and Xiuhcoatl in the Sky-War alongside the Heavenly Principles. The Four
      Shades are direct projections of the Heavenly Principles itself,Teyvat Interlude
      Chapter Teaser: The Gods'' Limits whom the latter is stated far beyond the reach
      of the three moon goddesses.Song of the Welkin Moon, Act VI: Melting Moonlight
      in the Morning Mists This would put the Shades and Heavenly Principles far above
      the Three Moon Sisters, including the Trilune Goddess Columbina20.5 Yottatons),
      Universe level+ (The Heavenly Principles and the Four Shades created and established
      the system of Fate that determines the course of the world. By imposing a predetermined
      Fate upon reality, they dictate the timeline''s progression from its beginning
      to its destined conclusion, with the anchoring of Fate likewise binding the
      Abyss to the end of time and thereby affecting the timeline in its entirety),
      Low Multiverse level with Environmental Destruction for Istaroth (Created a
      separated space-times/timelines for Aether and LumineArchon Quest: A Space and
      Time For You)'
    source_ids:
    - vsbattles-four-great-rulers-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'FTL for Ronova, Asmoday, Naberius and Rhinedottir (They should be superior
      to Dragon Sovereigns like Xiuhcoatl, Neuvillette and Apep, and Moon Goddess
      like Columbina1.088c), Temporal Omnipresence for Istaroth (Omnipresent across
      every moments of the past, present and futureBook: The Byakuyakoku Collection,
      Vol. 2: Before Sun and Moon - The Third Year of Darkness as she is the one "stillness"
      within the endless flow of time)'
    source_ids:
    - vsbattles-four-great-rulers-unknown
    confidence: 0.6
    notes: auto_repair source extraction
