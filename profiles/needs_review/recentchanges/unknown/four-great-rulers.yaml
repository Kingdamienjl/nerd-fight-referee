    notes: auto_repair source extraction
  range:
    text: 'Extended Melee Range for Rhinedottir with her sword, Hundreds of Kilometers
      for Asmoday, Planetary with their Law Manipulation (The Four Shades of the Heavenly
      Principles, Life, Death, Time and Space, are ubiquitous/everywhere in the world.
      They have the power to enforce the rules of the world itself. When the arrival
      of the Heavenly Principles, the world and every living beings was shackled/anchored
      by the Four Shades'' new established laws), Universal+ with Fate Manipulation
      for all (The Heavenly Principles and the Four Shades created and established
      the system of Fate that determines the course of the world. By imposing a predetermined
      Fate upon reality, they dictate the timeline''s progression from its beginning
      to its destined conclusion, with the anchoring of Fate likewise binding the
      Abyss to the end of time and thereby affecting the timeline in its entirety),
      Interdimensional with BFR for Istaroth and Dimensional Travel for Asmoday, Low
      Multiversal via Time Manipulation for Istaroth Teamwork: As the Four Shades
      of the Primordial One, they cooperate seamlessly in governing and preserving
      the world''s fundamental laws, with each overseeing a distinct but complementary
      aspect of realityDeep Gallery''s Distant Pact'
    source_ids:
    - vsbattles-four-great-rulers-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Unknown Nigh-Omniscient for Istaroth (Is the \"moment\" and \"every moment\"\
      \ itself, hence the God of Moments who knows everything in every moments across\
      \ past, present and future. She remembers everything, creates everything, and\
      \ allow everything to be forgotten.Book: Hymns of the Far North, Vol. 1 - Prayer\
      \ Song IV: Laimelea, Mother of Time She engraved upon her memory of all thingsEvent\
      \ Quest: Sunspray Summer Resort Part 4) Extraordinary Genius for Rhinedottir\
      \ (Widely regarded as one of the greatest alchemists in history and the creator\
      \ of numerous unparalleled lifeforms through the Art of Khemia. She successfully\
      \ created the \"perfect\" synthetic human Albedo, whose intellect is so exceptional\
      \ that Jean Gunnhildr explicitly remarked that the word \"genius\" seemed to\
      \ have been made for him. She also created extraordinary beings such as Durin,\
      \ Elynas, and the Bakunawa, each possessing unique physiology and capabilities\
      \ far beyond conventional life) Extraordinary Genius for Asmoday (Asmoday designed\
      \ and constructed the Temple of SpaceLuna 5 Special Program (Segment-Domain\
      \ Tau),World Quest, A Long Day in the Mountains, Prologue: The Wind Has Ceased\
      \ an immensely sophisticated extradimensional realm that functions as a self-sustaining\
      \ archive preserving the history of countless fallen civilizations and memories;World\
      \ Quest, A Long Day in the Mountains, Act I: Paradise such as Hyperborea, Remuria,\
      \ Lang-Gan, Ochkanatlan, Delphi Pytho/Enkanomiya and Arcadia. She devised an\
      \ intricate system capable of storing books, artworks/paintings which can becomes\
      \ reality,Temple of Space: Luyang Academy architecture, ecosystems, and even\
      \ living individuals (\"the Uplifted\") in a realm where time and space has\
      \ effectively lost its meaning,Official Twitter Account: Temple of Space: Where\
      \ Time and Space Stand Still preventing aging, hunger, exhaustion, evolution,\
      \ and death itself. She established a comprehensive set of immutable laws governing\
      \ the temple, including mechanisms requiring the sacrifice of memories to reach\
      \ her audience and preventing unauthorized knowledge from leaving the domain.\
      \ Asmoday also created autonomous artificial lifeforms; including the Watchers\
      \ Melanta (The Melancholy) and Nihilita (The Nothingness), as well as numerous\
      \ Domain Keepers\u2014to independently administer, protect, and enforce the\
      \ temple's functions for countless ages without her direct supervision.World\
      \ Quest, A Long Day in the Mountain: Act III: Judgement The Mahavaipulya Chamber\
      \ furthermore houses records spanning numerous historical eras and is said to\
      \ contain a page leading to the legendary Infinite Library, a hexagon-shaped\
      \ space which contains all stories, ancient texts and knowledge ever written)"
    source_ids:
    - vsbattles-four-great-rulers-unknown
    confidence: 0.6
    notes: auto_repair source extraction
