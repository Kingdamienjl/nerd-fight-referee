- id: claim-weaknesses-5ac91056
  section: weaknesses
  axis: weakness
  text: 'The Four Shades are subject to restrictions imposed by the Heavenly Principles,
    limiting their actions and preventing them from freely utilizing their full power.Archon
    Quest, Chapter VII, Act III: Night White, Like a Dream Upon WakingArchon Quest,
    Chapter VII, Act IV: A Rekviem for the UnderworldThis restriction only applies
    to the Four Shades while they are acting within Teyvat. The Gods'' Limits teaser
    provides a clear distinction, as the scenes depicting Ronova permanently killing
    living beings, Rhinedottir freely creating life (humans), and Asmoday creating
    numerous worlds within her pocket space all take place outside of Teyvat. Neither
    is shown to be constrained by the Heavenly Principles'' Rules in those scenes.
