    - field: powers_and_abilities
      value: "Immortality (Types 1, 2, and 3. Continued attacking Jack as its organs\
        \ were ripped apart by a shotgun, and regenerates from numerous lethal wounds.\
        \ Given that it did not need to reattach/regrow its arm right away after Jack\
        \ cut it off and spent some time without it, it is likely that it can survive\
        \ extensive bloodloss without needing to heal right away), Self-Sustenance\
        \ (Types 1, 2, and 3), Weapon Mastery (Spoons. Disarmed Jack on three occasions\
        \ using nothing but a spoon), Expert tracking skills (Could always find Jack\
        \ no matter where he went), Regeneration (Low-Mid, regenerated from severe\
        \ damage to its torso from a shotgun, and reattached/grew back a lost arm),\
        \ Invisibility (Unable to be perceived by those other than who it is attacking,\
        \ even digitally), Body Control (Able to control his arm after it was cut\
        \ off), Can transform parts of its body into various bugs (Can be used to\
        \ gross out opponents and cause them to suffer nausea and vomiting), Teleportation\
        \ (Instantly appeared next to Jack on a bus), Possibly Probability Manipulation\
        \ (Every single attempt Jack made to end his life failed due to random events,\
        \ although it is unknown if this isn\u2019t just incidental bad luck), Resistance\
        \ to extreme temperatures, explosives, radiation, and pain"
      source_id: mediawiki-2065550
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "Below Average Human level normally (Took a dozen years to kill a single\
        \ person), likely Street level (Broke Jack\xB4s hand by swinging his spoon\
        \ at it and threw a spoon hard enough to knock Jack to the ground. It is likely\
        \ that it limits itself in order to prolong the death of its target)"
      source_id: mediawiki-2065550
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: At least Average Human, possibly Athletic Human travel speed (Consistently
        shown to run faster than Jack), with Superhuman reactions (Jumped as a car
        moved to hit it)
      source_id: mediawiki-2065550
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: durability
      value: Human level normally (Isn't particularly durable), at least Wall level
        with resistance to fire and explosives, likely far higher (Survived being
        shot by an RPG, which is this powerful, although it seems weak to piercing
        weapons). Immortality and Regeneration make it hard to kill.
      source_id: mediawiki-2065550
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: stamina
      value: Infinite (Followed and continuously hit Jack with a spoon for a period
        of several years without ever growing tired or taking a break. Was implied
        that this has been happening to his family for generations. Does not require
        food, sleep, water, or air. Can spend three months carving a pumpkin without
        ever needing to rest, though this is likely non canon. Can continue to attack
        after either having an arm cut off or having his organs ripped apart by a
        shotgun)
      source_id: mediawiki-2065550
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: range
      value: Standard Melee Range, higher by throwing its spoons
      source_id: mediawiki-2065550
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: A large variety of spoons that it keeps in its vest, including a large
        wooden spoon that hurts much more.
      source_id: mediawiki-2065550
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Above Average (Consistently changes its tactics in response to various
        attempts that Jack tried to stave it off) Standard Tactics: The Ginosaji just
        goes up to its opponent and endlessly hits them with a spoon until they die.
        Usually this takes years, though he can strike much harder if he wants to
        kill the target right away. He usually attacks with one spoon, though at times
        he can attack with two; one in each hand. When guns or blunt weapons are brought
        up against him, he will continue on attacking the same way. When bladed weapons
        are brought up against him, he is more likely to throw his spoons at them.
        If his metal spoons are disabled or he wants to cause more pain, he will bring
        out a wooden spoon, which hurts much more. He normally does not try to evade
        attacks due to his immortality, though he may try to avoid attacks which can
        harm his foe if they miss him (such as ducking to avoid Jack when he tried
        to grab the Ginosaji while wearing spiked gauntlets so Jack would instead
        stab himself with them). If someone else tries to attack the Ginosaji with
        spoons of their own, he will go into a rage and attack in fury to knock their
        spoons away, and may steal their spoons and use them against his foe. If his
        body is ripped open, he will send bugs out of it to gross out his opponent.
        If an arm is cut off, the Ginosaji will send his severed arm to attack his
        foe while holding a spoon while he continues to attack them himself with another
        spoon. However, he will never use other weapons or attack by punching or kicking.
        The most he might do is spit blood at his opponent after being severely injured.'
      source_id: mediawiki-2065550
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Only attacks with a spoon, seems weak to piercing weapons.
      source_id: mediawiki-2065550
      provider_id: vsbattles
      authority: high
      confidence: 0.75
