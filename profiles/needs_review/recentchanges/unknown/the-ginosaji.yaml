- id: claim-powers-and-abilities-ebdfcbcb
  section: abilities
  axis: hax
  text: "Immortality (Types 1, 2, and 3. Continued attacking Jack as its organs were\
    \ ripped apart by a shotgun, and regenerates from numerous lethal wounds. Given\
    \ that it did not need to reattach/regrow its arm right away after Jack cut it\
    \ off and spent some time without it, it is likely that it can survive extensive\
    \ bloodloss without needing to heal right away), Self-Sustenance (Types 1, 2,\
    \ and 3), Weapon Mastery (Spoons. Disarmed Jack on three occasions using nothing\
    \ but a spoon), Expert tracking skills (Could always find Jack no matter where\
    \ he went), Regeneration (Low-Mid, regenerated from severe damage to its torso\
    \ from a shotgun, and reattached/grew back a lost arm), Invisibility (Unable to\
    \ be perceived by those other than who it is attacking, even digitally), Body\
    \ Control (Able to control his arm after it was cut off), Can transform parts\
    \ of its body into various bugs (Can be used to gross out opponents and cause\
    \ them to suffer nausea and vomiting), Teleportation (Instantly appeared next\
    \ to Jack on a bus), Possibly Probability Manipulation (Every single attempt Jack\
    \ made to end his life failed due to random events, although it is unknown if\
    \ this isn\u2019t just incidental bad luck), Resistance to extreme temperatures,\
    \ explosives, radiation, and pain"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
