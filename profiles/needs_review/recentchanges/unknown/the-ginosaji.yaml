  stamina:
    text: Infinite (Followed and continuously hit Jack with a spoon for a period of
      several years without ever growing tired or taking a break. Was implied that
      this has been happening to his family for generations. Does not require food,
      sleep, water, or air. Can spend three months carving a pumpkin without ever
      needing to rest, though this is likely non canon. Can continue to attack after
      either having an arm cut off or having his organs ripped apart by a shotgun)
    source_ids:
    - vsbattles-the-ginosaji-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, higher by throwing its spoons
    source_ids:
    - vsbattles-the-ginosaji-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Above Average (Consistently changes its tactics in response to various
      attempts that Jack tried to stave it off) Standard Tactics: The Ginosaji just
      goes up to its opponent and endlessly hits them with a spoon until they die.
      Usually this takes years, though he can strike much harder if he wants to kill
      the target right away. He usually attacks with one spoon, though at times he
      can attack with two; one in each hand. When guns or blunt weapons are brought
      up against him, he will continue on attacking the same way. When bladed weapons
      are brought up against him, he is more likely to throw his spoons at them. If
      his metal spoons are disabled or he wants to cause more pain, he will bring
      out a wooden spoon, which hurts much more. He normally does not try to evade
      attacks due to his immortality, though he may try to avoid attacks which can
      harm his foe if they miss him (such as ducking to avoid Jack when he tried to
      grab the Ginosaji while wearing spiked gauntlets so Jack would instead stab
      himself with them). If someone else tries to attack the Ginosaji with spoons
      of their own, he will go into a rage and attack in fury to knock their spoons
      away, and may steal their spoons and use them against his foe. If his body is
      ripped open, he will send bugs out of it to gross out his opponent. If an arm
      is cut off, the Ginosaji will send his severed arm to attack his foe while holding
      a spoon while he continues to attack them himself with another spoon. However,
      he will never use other weapons or attack by punching or kicking. The most he
      might do is spit blood at his opponent after being severely injured.'
    source_ids:
    - vsbattles-the-ginosaji-unknown
    confidence: 0.6
    notes: auto_repair source extraction
