- id: claim-weaknesses-d137f361
  section: weaknesses
  axis: weakness
  text: 'Her powers exhaust her physically, and she starts bleeding from the nose
    and, in some cases, the ears if she uses them too much, even passing out if pushed
    to her limit. Expose to an electric shock collar can distract her from focusing
    her power. Sonic wave cannons dampen her powers. Feats: *Made contact with the
    Demogorgon, Will, and Barb''s body while they were in the Upside Down, and she
    was in the real world. *Opened and closed the Gate. * Crushed the internal organs,
    such as the brain, of multiple agents at once. *Created a crater when she threw
    a guard against a wall and then snapped another guard''s neck. *Killed the Demogorgon
    via disintegration. *Defeated the Mind Flayer.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
