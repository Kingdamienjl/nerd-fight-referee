    - field: powers_and_abilities
      value: Superhuman Durability, Telekinesis (Eleven's main power is her telekinesis.
        With it, she can easily throw around objects, lift things into the air, choke
        people out, damage people, and use it for various other purposes), Levitation
        (Can cause herself to float using her telekinesis), Technopathy (Passively
        causes lights to flicker or overflow when using her powers. Can hear what
        people are talking about through radios), Acrobatics (Trained her acrobatic
        skill, allowing her to jump great distances), Mental BFR & Astral Projection
        (By blindfolding herself and tuning out her senses, she can enter into a mental
        void where she can see and hear people, allowing her to know what they are
        saying, thinking and doing in that very moment. She can track these people
        down through dimensions simply by looking at a photo of them. She can also
        use this ability to enter other peoples mindscapes, such as when she entered
        Max's mind in order to fight Vecna. This ability also allows her to bring
        other people into her mindscape, putting them in a trance-like state), Rage
        Power (Can substantially increase her strength through being enraged or frightened.
        After training with Kali, Eleven learned how to harness her rage in combat,
        and uses it strategically to amplify her strength in dire moments), Forcefield
        Creation (Created a forcefield in order to cross a debris field), Portal Creation,
        Space-Time Manipulation & BFR (Can open gates to the Upside Down, a wormhole
        that connects Earth & The Abyss. She is also capable of throwing people into
        these portals and closing them, removing them from the battlefield and trapping
        them in The Abyss), Biological Manipulation & Durability Negation (Crushed
        the organs of multiple Hawkins Lab guards. Forced Max's heart to beat on its
        own, keeping her alive long enough for an ambulance to get to her), Disassembly
        (Turned the Demogorgon into dust), Magnetism Manipulation (Manipulated the
        magnetic field of Lucas' compass), Memory Manipulation (Showed Billy his childhood
        memories. Saw into Max's memories by entering her mindscape)
      source_id: character-stats-profiles-eleven-stranger-things-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Human level physically (Isn't any stronger than a regular teenage girl),
        Wall level with Telekinesis (Flipped a van into the air with ease. Can casually
        kill Demodogs and harm Jim Hopper. Shattered all of the windows in Hopper's
        cabin), Large Building level when enraged (Overpowered Henry Creel and sent
        him flying backwards as a small child, with Henry Creel being able to shape
        The Mind Flayer. Held back The Mind Flayer for an extended period of time
        and eventually overpowered it, though she did pass out afterwards), Large
