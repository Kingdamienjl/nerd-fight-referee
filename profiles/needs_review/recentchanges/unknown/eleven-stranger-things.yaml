power_scale:
  tier:
    text: 10-B physically. At least 8-C with her powers, High 7-C via Environmental
      Destruction
    source_ids: &id002
    - mediawiki-469200
    confidence: 0.8
  attack_potency:
    text: Human level physically (Hit Angela with a rollerskate, which knocked her
      over, caused her to bleed and gave her a concussion. Swung a defibrillator on
      Dr. Brenner's mouth, scarring his lip, and used a pair of scissors to stab Dr.
      Kay's arm), At least Building level+ with her powers (Opened and closed the
      Gate to the Upside-Down, which was stated to require more energy than mankind
      could generate. Overpowered the Mind Flayer's Proxy and temporarily killed it
      until it regenerated. Broke down a fortified steel door), Large Town level+
      via Environmental Destruction (Portals to the Upside Down can cause this level
      of Environmental Destruction if allowed to spread)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Average Human Travel Speed with Superhuman Reaction Speed (Can react to
      attacks from Demodogs. Attacked a group of armed guards before they could react),
      Unknown attack speed with her powers (Shown to activate her powers seemingly
      instantly, though a concrete number cannot be established)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Average Human physically, Class 10 with telekinesis (Flipped a moving van
      upside down. Pulled a train car several meters with great difficulty. Easily
      lifted a 10,000 pound tank into the air. Could throw around a helicopter, which
      can weigh up to 6,000 kg)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Human level
    source_ids: *id002
    confidence: 0.8
  durability:
    text: At least Human level (Survived being thrown around by Vecna)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: At least Athletic (Can fight even after nearly having her internal organs
      destroyed)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, At least Tens of Meters with telekinesis, Interdimensional
      with astral projection (Can locate people and interact with their mindscape
      while in a separate dimension)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Varies from Below Average (Has shown to lack common sense, basically has
      the mind of a child) to Above Average (In situations where survival was at stake,
      she has demonstrated her ability to think quickly and strategically. For example,
      she was able to communicate with her mother despite her schizophrenia and used
      her powers to access Billy's memories to determine the precise spot where the
      Mind Flayer first started spreading the Flayed. She also came up with a successful
      plan to defend Max while she was far away by using remote viewing to battle
      Vecna in her mind.)
    source_ids: *id002
    confidence: 0.8
