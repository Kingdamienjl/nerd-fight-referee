        \ True Dragon: As a True Dragon, Rimuru reincarnates when he dies, the resurrected\
        \ Rimuru will be an entirely different Rimuru., Demon: As an Awakened Demon\
        \ Lord, he absorbed and analyzed demons, thus becoming a demon. Demons were\
        \ born as conceptual existences that receive power from the Spirit of Darkness\
        \ and will revive as long as the Spirit of Darkness exists. Their resurrection,\
