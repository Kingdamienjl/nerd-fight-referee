        back and forth across the trams. *Swing N'' Smash: The Minotaur will roar,
        swing its hammer once, and then destroy a tram. This attack, similarly to
        the swing comb. *Acid Splash: The Minotaur will dig into its chest and pull
        out an acid bomb, then drop it onto one of the trams to create a puddle of
        acid. *Back Sweep: If its victim is riding the Minotaur''s back, it will sweep
        its arm across its back, hurting the victim. *Stampede: The Minotaur will
        momentarily lean forward before charging headfirst at the opponent, dealing
        damage on hit. If it misses the opponent, it will continue to charge in a
        circle around them before stopping, but if it hits a wall instead, the Minotaur
        takes 6 damage and is temporarily stunned. The Minotaur will always perform
        this attack after using three other attacks. *Four-Swing Combo: The Minotaur
        will roar before swinging its hammer four times while approaching the victim.
        *Two-Explosion Combo: The Minotaur will thrust its hammer into the ground,
        dealing damage and creating an explosion that also deals damage, before pulling
        the hammer out, creating a red super explosion that again, deals damage. *Acid
        Splash: The Minotaur will dig into its chest, then pull out an acid bomb and
        throw it to the floor. *Acid Bomb: The Minotaur will dig into its chest, then
        pull out an acid bomb and crush it in the air, creating a large, spherical
        acid cloud that deals damage. |} == Notable Matchups == None yet. None yet.
