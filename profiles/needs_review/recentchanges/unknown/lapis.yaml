- id: claim-powers-and-abilities-0d11c520
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics, Stealth Mastery, Smoke Manipulation
    & Light Manipulation (Via smoke bombs and flash bombs), Afterimage Creation and
    possible Illusion Creation and Duplication (Via Rose Illusion, Blue Mirage and
    Rose Refrain), Skilled Marksman, Longevity, Shapeshifting (Can change into any
    dragon that Euden has formed a pact with for a limited time), Magic, Water and
    Light Manipulation, Paralysis Inducement, Non-Physical Interaction (Can harm ghosts),
    Statistics Amplification (Aramitama increases her strength by 20%, while Nigimitama
    increases her defense by 35%; Gains additional strength and health with wyrmprints),
    Statistics Reduction (The Free-Spirited Opera wyrmprint reduces one's own strength
    by 10% and has a 10% chance to lower the opponent's strength by 10% for a short
    time), Self-Healing (Via Sakimitama, which regenerates health slowly while Nigimitama
    is in effect; Wyrmprints with the Last Recovery or Healing Doublebuff effects
    gives the user a 14% regen buff when HP is below 30% HP or a 3% regen buff when
    granted a defense buff, respectively), Forcefield Creation (The wyrmprints A Brief
    Repose and A Bouquet can bestow a one-time shield which can block up to 30% of
    her health in damage and a life shield that blocks damage up to 15% her total
    health respectively), Resurrection (The Beneath the Boughs wyrmprint sacrifices
    50% of the user's dragon gauge to bring them back to life if they get killed in
    combat), Instinctive Reaction (With The Genius Tactician, the user is able to
    dodge any reasonably avoidable attack automatically once every 30 seconds), Power
    Nullification (Fantastic Flight can remove one beneficial buff from the opponent,
    including Kai Yan's Adamantine Shield; Via Fury Penetrator, Frenzy Res and Spectral
    Shield Penetrator to a limited extent), Limited Resistance Negation (Dispelling
    an opponent's buff or barrier lowers their resistance to water attacks by 5%),
    Damage Boost (Graceful Bullet increases in power by 20% for every stack of the
    "Stronger Bullets" buff she has, as well as 5% for any other buffs she has accumulated,
    up to 80% total; Aramitama increases her critical rate by 12%; Dispelling an opponent's
    buff or barrier, as well as landing 30 consecutive attacks in a row, induces a
    stack of the "Stronger Bullets", which adds 4% to the critical attack rate for
    a short time; Various wyrmprints increase her flurry strength, her force strike
    strength, her strength when attacking an opponent in a broken state, etc.), Various
    abilities via shapeshifting, including Fire Manipulation, Air Manipulation, Light
    Manipulation, Electricity Manipulation, Darkness Manipulation, Poison Manipulation,
    etc., Resistance to Fire Manipulation by 10% when she lands ten or more consecutive
    attacks, Statistics Reduction via Dull Res, Petrification via Petrify Res, Soul
    Manipulation via Soul Eater Res, Heat Manipulation via Scorching Air Res, stun,
    as well as damage from specific High Dragons
  source_ids: *id003
  decisive: true
