power_scale:
  tier:
    text: '10-B for regular members/employees, up to 2-C with Preparation Civilization
      Type: Post-Industrial Civilization in the universe where the Metaverse takes
      place in, Multiversal Civilization for their control over simulations (It''s
      also possibly implied that they''re trying to find the way to apply a similar
      control to their universe)'
    source_ids: &id002
    - mediawiki-4690422
    confidence: 0.65
  attack_potency:
    text: 'Human level for regular members (Apparently being all regular humans),
      up to Low Multiverse level with Preparation (Can create and manipulate Vitual
      Machines, those being VM1, which contains the world of "Doki Doki Literature
      Club!", which is a universe of its own with its own time,Act3 a clone of VM
      1 which contains an alternate timelineTweet from @dansalvato - Information on
      the Side Stories (backup image) where Monika did not get her powers, and VM2,
      which is bigger than VM1, with likely even more. Granted to Monika her powers
      through giving to her "elevated permissions", other than having reset her universe
      many times as well) Power Source: Presumably local electricity Industrial Capacity:
      The company''s job is to help other companies to do large-scale projects through
      improving and/or installing hardware, software and/or security systems, offering
      plans suited for their needs even if the company is large enough to have over
      1000 employees, successfully doing so over all the country for over 40 years.
      The members can build Virtual Machines, which can contain entire simulated universes,
      other than manipulating them in multiple ways in order to see if their own universe
      is a simulated reality, for likely the purpose to see ways to manipulate it
      in a similar method if their world ends up as being an actual simulated reality
      on its own Military Prowess: None notable Notable Individuals: The Player, Ro,
      Ravi, Lib, Ive Laster, Paula Miner (Some employees studying VM1 and later VM2,
      their future project), other world-class engineers, and industry-leading specialists'
    source_ids: *id002
    confidence: 0.65
