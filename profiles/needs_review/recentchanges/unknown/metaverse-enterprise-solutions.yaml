- id: claim-powers-and-abilities-8f92c9aa
  section: abilities
  axis: hax
  text: '* Genius Intelligence (For some of their employees) *Minor Technology Manipulation
    (Their main activity is to improve and/or provide to other companies hardware,
    software and/or security systems) With Preparation, their management over their
    simulated universes gives them access to: *Creation, Spatial Manipulation, Time
    Manipulation, Data Manipulation, Information Manipulation (Type 2) and Reality
    Warping (They can create Virtual Machines such as VM1, which contains the reality
    of the "Doki Doki Literature Club!". They should also be able to manipulate the
    Virtual Machines and to a similar degree to Monika''s due to them having created
    these worlds and granting to Monika the ability to manipulate the datas that make
    up and govern her universe''s reality and information) *Plot Manipulation, Clairvoyance
    and Cosmic Awareness (They can write and edit the scriptAct 4 of the game. They
    should also be able to check it to see the past, present and future events that
    happen within their simulated worlds, even if changed fromAct 2 Monika) *Power
    Bestowal, Empathic Manipulation and Morality Manipulation (Granted Monika "elevated
    access", her self-awareness and ability to alter her reality. Beings who are granted
    "elevated permissions" will go through fundamental changes in personality, emotions,
    values and goals, as also displayed from Sayori after receiving Monika''s powers
    due to becoming the president of the Literature Club) *Limited Dimensional Travel
    (Accidentally had data from VM2 leak into VM1, the latter being Monika''s universe
    and the former their next project) *All the powers of the Player (As they''re
    an employee working for them) *Some of the powers Monika has (They gave her her
    "elevated access"/powers, studied how she weaponized them, and could presumably
    give the same to themselves, but some unexplored amount of Monika''s actions were
    either unknown to them or beyond their expectations, to the point of them being
    called ridiculous at one point)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
