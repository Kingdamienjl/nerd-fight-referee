    - field: powers_and_abilities
      value: 'Immortality (Types 1, 3 & 4 normally, Type 5 after the deletion of her
        character file. Although slightly contradicted a few times by things she says,
        she repeatedly indicated to live forever/an eternity, Sayori with her powers
        did the same. Repeatedly tried to restore herself after being deleted, which
        would have worked if her Character File still existed), Resurrection (Can
        resurrect erased beings if she made a back up for their existence. Though
        not demonstrated, she can likely resurrect herself if she makes a back up
        of her own file), Reality Warping, Data Manipulation, Existence Erasure, Conceptual
        Manipulation (Type 2), Information Manipulation (Type 2) and Plot Manipulation
        (The world of "Doki Doki Literature Club!" is a simulated universe made of
        datas governing it, which Monika has learned to manipulate on a Kernel level.
        She''s also able to manipulate the script to decide the events which happen
        in the game, or even destroy it. Can erase characters from deleting their
        files, with said characters being unable to be recognized from the game after
        being deleted, with not even the narrator being able to process their names
        and actions, and the game being forced to reboot without said character having
        ever existed neither in the plot nor in the space-time to begin with, as also
        shown from Natsuki''s cupcakes being erased as a side effect of her deletion.
        If the Player tries to bring back a character deleted from Monika from bringing
        back their file, the game still cannot process it), Clairvoyance & Genius
        Intelligence (Can see the script to know past, present and future events in
        the plot of her game/reality. This excludes the Player''s actions due to them
        not belonging to that universe, although Monika knows when things of her game
        interact with them), Limited Nonexistent Physiology (Type 2) & Incorporeality
        (Appears as corrupted visuals and can still act & use her powers after having
        her Character File deleted, which meant getting deleted from history, other
        than having the concept, information and plot erased as well, as it was done
        to other characters and to Monika herself. However it should be noted that
        she does not start in this state, but with a physical body, as she described
        being deleted for the first time as painful), Acausality (Type 1 normally:
        her memories are unaffected from the time resets happening through the game
        and was able to mention characters which were deleted from her, despite not
        even the game itself could recognize their existence anymore; Types 1 & 4
        in her Nonexistent state: after getting her character file deleted, she shouldn''t
        get bound anymore from neither causality nor plot, as the files in the DDLC
        world are what makes reality, time, causality, script and so on, with further
        proof being her sending a letter to the Player after the deletion of the whole
        game), 4th Wall Awareness (Is aware of the fictionality of her universe),
        Time Manipulation and Causality Manipulation (Caused time to stop passing
        and could rewind time, changing also the events after said rewinding. Can
        reset the game), Regeneration (Low-Godly; can restore her physical body from
        a back-up file. High-Godly overtime; after the deletion of the game, she''s
        implied to have returned as she is able to still post on her Twitter account,
        which is recognized from the Metaverse Enterprise Solutions, though this seemingly
        takes some time), Mind Manipulation (Controlled Yuri and Natsuki. Messed with
        Sayori in a way that made her want to kill herself, with the latter claiming
        something to be in her head briefly before suiciding), Memory Manipulation
        (Made Natsuki forget the events of a day), Empathic Manipulation (Made Sayori
        progressively more depressed and amplified Yuri''s obsessive personally),
        Biological Manipulation (Could remove Natsuki''s face and induce vomiting
        to Yuri, although Yuri could have simply been made aware of her obsessive
        actions and vomited because of that), Body Control, Power Nullification (Prevented
        the Player from Saving and Loading. Can turn off their ability to fast-forward,
        which explicitly doesn''t work without time. Implied to have prevented Sayori
        from using the powers she has obtained as the new president of the Literature
        Club), Self-Sustenance (All Types: As she''s able to talk forever in a room,
        she''s implied to lack physical needs), Limited Beyond-Dimensional Existence
        (Type 1; Only applies in her Nonexistent state. After getting her character
        file deleted, she should lack space-time features as the files in the DDLC
        world are what makes reality, time and so on), Corruption (Type 2: Her maniputation
        of the game progressively corrupted several parts of it), Sound Manipulation,
        Teleportation (Can slowly appear into places without physically moving into
        them), Resistance to Plot Manipulation (Managed to break out of the script
        of the game via her knowledge of the Fourth Wall. Although she occasionally
        follows her programming unwillingly, if briefly)'
