  section: weaknesses
  axis: weakness
  text: 'Its shown members can act in unprofessional ways, or be a bit greedy, as
    they prioritize keeping their jobs, getting promotions and simply getting more
    money. The company has apparentely also questionable ethics, to the point that
    some have deserted Note: Although the universe where Monika lives in is a videogame,
    it is counted as being real as the world where MES and the Player resides in due
    to both worlds being simulated universes. As such the series makes use of Reality
    Equalization for its stats.'
