- id: claim-weaknesses-77b05cf3
  section: weaknesses
  axis: weakness
  text: "Combatants with intense focus, or the ability to disperse it, can see through\
    \ any illusions caused by the madness wavelength. {| class=\"mw-collapsible mw-collapsed\"\
    \ align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
    \ | colspan=\"2\" style=\"text-align: left; |Notable Attacks/Techniques: |- |\
    \ *Soul Perception A technique used by Weapon Meisters that allows the user to\
    \ see into other's souls, Asura's paranoia boosting its power. *Grim Reaper physiology:\
    \ Being a Grim Reaper, Asura is naturally stronger and more resilient than a human.\
    \ He is assumed to possess the same immunity to most weather conditions and natural\
    \ poisons like Death the Kid. *Konso: This ability allows Asura to store souls\
    \ and hold them for later use. *Sanzu Lines: A trait common in the Grim Reaper\
    \ and those spawned from him, Asura's being in the form of lines in his bangs.\
    \ Their lines eye-like broken appearance signifies that while Asura became a Grim\
    \ Reaper in his own right, the absence of the third line means he could never\
    \ succeed Lord Death. *Madness of Fear: Unlike his father, having been created\
    \ from a fragment of his father's soul that containing phobias, Asura's madness\
    \ wavelength enables him to influence the minds of other with feelings of absolute\
    \ terror. That same madness can also warp the afflicted into potential agents\
    \ and spawn physical embodiments called Clowns. Even while being first sealed\
    \ by Death under the DWMA, the madness wavelength's potency in the world was still\
    \ felt, to the point of forcing those near him to suicide. It is so strong that\
    \ it managed to slightly overpower Maka's Anti-Demon Wavelength and Black\u2606\
    Star's natural resistance. Asura can also use it as weapon in techniques like\
    \ Compact, where he focuses his madness as a physical force to flatten his target.\
    \ *Black Blood: A type of artificially made black blood cell invented by Medusa\
    \ that boosters the infected with madness and great power, used to revive Asura\
    \ by replacing the blood he lost. It enables Asura to solidify and heal his wounds.\
    \ center|300px|Kishin fending off Black Star with his bandages *Skin Scarves:\
    \ Kishin can use the bandages all over his body, originally folds of his outstretched\
    \ skin, to attack and defend. center|300px|One of The Kishin's Dark Arts *Unknown\
    \ Dark Arts: Kishin capable of using an unknown form of black magic he created.\
    \ This is typically used to fire energy blasts be it from his hand or with a certain\
    \ incantation. Some cause pure destruction and others are used as a distraction.\
