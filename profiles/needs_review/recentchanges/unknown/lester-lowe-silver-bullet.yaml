        while moving to attack opponents and mow down obstacles. **Spin Jump: Silver
        leaps into the air and proceeds to perform a Spin Attack, a technique that
        allows Silver to attack a foe in quick succession, hit objects in a return-to-sender
        fashion, and deter charging opponents. ***Double Jump: After Silver performs
        a Spin Jump, he quickly follows up with a second Spin Jump to reach up to
        higher grounds. **Spin'
      source_id: character-stats-profiles-lester-lowe-silver-bullet
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: "*Cyan Laser: Using the power of a Cyan Wisp, Silver transforms into\
        \ a cyan laser beam. As the Cyan Laser, Silver gains the same properties as\
        \ that of a real laser, allowing him to move as a living beam of light. When\
        \ hitting any surfaces as the Cyan Laser, Silver can also bounce off them\
        \ as if they were a reflective surface. *Indigo Asteroid: Using the power\
        \ of an Indigo Wisp, Silver turns into an orb-shaped body with striped, indigo\
        \ skin and a matching planetary ring encircling his middle. As the Indigo\
        \ Asteroid, Silver essentially becomes a miniature planet with a strong gravitational\
        \ field. Silver is as such capable of creating a powerful gravitational pull\
        \ around himself, strong enough to tear all kinds of objects to pieces and\
        \ pull them into the Asteroid Ring. Additionally, the gathered matter can\
        \ be used to empower the gravitational pull. The Indigo Asteroid also grants\
        \ Silver the ability to levitate through mid-air. *Yellow Drill: Using the\
        \ power of a Yellow Wisp Silver turns into a yellow spiral drill. As the Yellow\
        \ Drill, Silver can burrow and tunnel underground at remarkably high speeds\
        \ and can be applied underwater, allowing Silver to move through the water\
        \ like a living torpedo. *Jade Ghost: As the Jade Ghost, Silver is able to\
        \ turn himself invisible and enables him to move around without being visibly\
        \ detected by opponents. The Jade Ghost also makes him intangible, thus allowing\
        \ him to pass through obstacles and avoid unwanted attacks. In addition, the\
        \ Jade Ghost allows Sonic to hover slightly above ground when using its power.\
        \ It can even render Silver intangible to those with Non-Physical Interaction.\
        \ Super Silver: *Shield of Light: When performing this move, Super Silver\
        \ uses his natural psychokinesis to form a large green shield of energy in\
        \ front of him, which will grab any thrown projectiles that enter its radius.\
        \ Once caught, Super Silver can then throw the projectile back at his foe\
        \ with relative force. * Super Sonic Boost: Super Silver surrounds himself\
        \ in a golden aura of Chaos Energy before ramming the target with incredible\
        \ speed, resulting in a rather devastating impact. *Turbo Boost: Super Silver\
        \ surrounds himself in a brilliant golden aura that amplifies his speed. This\
        \ can be used for extensive maneuverability or deployed in short bursts to\
        \ evade attacks. List of all the Power-Ups in Sonic Rivals 1\u20132. List\
        \ of all the item boxes in the Sonic Series."
