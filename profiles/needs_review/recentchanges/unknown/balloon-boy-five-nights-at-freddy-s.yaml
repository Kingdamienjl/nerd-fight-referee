    so much so that he can overcome his programmed passivity during daytimeFive Nights
    At Freddy''s 2), Sound Manipulation (His voicebox can be used to project his laughter
    to rooms he isn''t inFive Nights At Freddy''s 3), Stealth Mastery (Can enter the
    player''s office without them noticing.Five Nights At Freddy''s 2 Should be comparable
    to JJ, who hides under the office desk without most players noticing) Superhuman
    Physical Characteristics, Immortality (Types 1, 2 and 8; Characters frequently
