    - field: weaknesses
      value: "Earth Style: Diamond Morph has an Achille's heel that the affected body\
        \ part cannot be moved and has a severe nature weakness against lightning\
        \ based attacks. Noteable Attacks/Techniques: Jiongu (Earth Grudge Fear):\
        \ Kakuzu's Secret Technique: Earth Grudge Fear, possible made out of Kakuzu's\
        \ very own grudges. Kakuzu stole this Secret Technique from the Waterfall\
        \ Village, which was it's prized treasure, after failing and impossible task\
        \ of assassinating Hashirama Senju. With Earth Grudge Fear it's possible to\
        \ reattach and detach body parts of himself. He can even stich up his fellows\
        \ partners body parts as seen when Hidan loses his head. He can stock up hearts\
        \ at any given time, given him semi-permanent immortality. His hearts that\
        \ he puts masks onto is capable of acting autonomously from Kakuzu. Even if\
        \ they are severed from his body they can move like a separate living organism.\
        \ Giving Kakuzu \"no blind spot\" which is probably in reference to the masks\
        \ being able to see incoming attacks, similar to the Six Paths of Pain. He\
        \ can control all 5 chakra nature elements as well as give him high-level\
        \ jutsu that normally can't be obtained that way. The chakra that is going\
        \ off the hearts is stated to be \"disgusting\" or \"menacing\". The hearts\
        \ are seen flying. Making them essentially hard to counter for opponents that\
        \ rely on close combat. Once Kakuzu is close to running out of hearts, he\
        \ enters his Jiongu state. Once they jump into him, they destroy his body\
        \ in the process. He also can change the length and form of his tentacles\
        \ at will given him a way to counter many opponents based on their fighting\
        \ style for example: close combat, long range combat etc. He's seen transforming\
        \ into a long range Jiongu state against Naruto which grants him massive chakra\
        \ with just three out of five hearts and eight giant tentacles that he can\
        \ focus on a single point. Katon: Zukkuko (Fire Style: Searing Migraine):\
        \ This jutsu allows the user to create a huge and wide Fire Style. It drops\
        \ a tiny fireball, making it explode into raging firestorm that can burn down\
        \ everything. The wide range of this jutsu makes escape difficult. Fuuton:\
        \ Atsugai (Wind Style: Pressure Damage): This powerful attack shoots a very\
        \ densely compacted tornado mass. When it impacts, the air pressure, raised\
        \ to the extreme can know down everything in its way. It can inflict severe\
        \ damage to the opponent and surroundings once it's in the hands of a master\
        \ of wind nature transformation. Wind of overwhelming power and quantity can\
        \ knock down trees and gouge the earth. This techniques destructive power\
        \ is on par with a natural disaster. Raiton: Gian (Lightning Style False Darkness):\
        \ This jutsu is unleashed by one of Kakuzu's five hearts. It can increase\
        \ the numbers of bolts to hit multiple targets at once, each bolt has equal\
        \ power as seen when Kakashi cancels out Lightning Style: False Darkness.\
        \ It is converted into a spear-like form that pierces through enemies with\
        \ a high killing power. It possesses great sharpness that can gouge through\
        \ even rock. Kimen no Bakuen (Strange Mask Exploding Flame) / Jiongu Issei\
        \ H\u014Dka (Earth Grudge Fear: Simultaneous Arson): This jutsu can be performed\
        \ once the Fire and Wind Mask merge together. Once combined with the properties\
        \ of Wind, the Fire transforms into a intensity. The flames have sufficient\
        \ explosive combustive force to turn the surrounding areas into a charred\
        \ wasteland. Water Style alone can't put out this Wind and Fire Style combo.\
        \ Guf\u016B Suika no Jutsu (Art of the Hurricane Vortex): This jutsu can be\
        \ invoked by anyone that is capable of using multiple elements. It creates\
        \ a huge fog which benefits the user by taking away the opponent's field of\
        \ vision. It's perfect for escaping or conducting sneak attacks. It's a powerful\
        \ jutsu that has many applications. Doton: Domu (Earth Style: Diamond Morph):\
        \ Kakuzu's main elemental nature transformation. It's a defense technique\
        \ that works by pouring chakra into each part of your body, raising the defense\
        \ power to the limit. It also increases the power of physical attacks, although\
        \ it's weak spot is that the hardened part can't be moved. Because it's a\
        \ earth based technique, it's natural weakness is Lightning Style ninjutsu.\
        \ Without Lightning Style Ninjutsu, there's no way to break or defeat Earth\
        \ Style: Diamond Morph. Category:Dehatch Category:Tier 5"
