    confidence: 0.8
  attack_potency:
    text: "Large Island level+ (Able to fight against Katsushika Hokusai. Has C-Rank\
      \ strength, making her comparable to Shirou Kotomine and other combat-ready\
      \ Servants, such as Archer), Small Country level with Bright Ehangwen (As an\
      \ A+-Rank Anti-Fortress Noble Phantasm it should be comparable to B\xF6lverk\
      \ Gram. Still has her Rhongonomiad and likely has the same firepower as her\
      \ traditional counterpart2.8882 Teratons), Complex Multiverse level6-D, possibly\
      \ higher with Rhongomyniad restraints released (With at least half of its Restraints\
      \ released, it can show its true power as an anchor that fastens together the\
      \ outer layer of the world and the Reverse Side of the World. If it were to\
      \ be undone, reality will be stripped from the surface of the World, leaving\
      \ only the Reverse Side of the World and bringing back the Age of Gods. Kirschtaria\
      \ Wodime needs to use a majority of his power to defend against it, with Beryl\
      \ also stating that the plan was always to use it to destroy Olympus regardless\
      \ of what Wodime planned8-D) | Small Country level (Artoria is comparable to\
      \ the forces of 5 Servants and able to stomp any Servants that she can come\
      \ across, also superior to Numeral of the Saints Gawain boosted even further\
      \ by Aloha Shirt. Managed to fight against Summer Hokusai at the end of Summer\
      \ 4, who can win against Tenma Musashi, a counterpart of Zero Musashi), Complex\
      \ Multiverse level6-D, possibly higher with Rhongomyniad restraints released8-D"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Relativistic+ with FTL reactions and combat speed (Has B-rank Agility making
      her comparable to Musashi who intercepted an attack from Castor and her saber
      counterpart who can move at near-light speeds), Immeasurable attack speed with
      Rhongomyniad restraints released | Immeasurable (Comparable to Tenma Musashi
      and Hokusai)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class M (Comparable to Martha who stopped a speeding train, Achilles who
      stopped a rolling 300 ton jumbo jet, Asterios who swam carrying the 100-150
      ton Golden Hind galleon ship while injured, and Jeanne who can spin an entire
      airplane2,604.949 Metric Tons)
    source_ids: *id002
    confidence: 0.8
