- id: claim-weaknesses-2eb48c28
  section: weaknesses
  axis: weakness
  text: 'Limited to sword techniques. Notable Attacks/Techniques *Iaido: A style of
    kenjutsu that is concerned with the smooth, controlled movements of drawing the
    sword from its scabbard, striking or cutting an opponent, and then replacing the
    sword in the scabbard. The linear motion and force applied to draw the sword from
    its scabbard result in much faster slashes than ones realized with the sword already
    drawn. *Iaigiri: Mifune performs a quick and powerful slash with his sword in
    order to cut the intended target. Was able to cut open the head of Hanzo''s summon,
    Ibuse. Note: Not to be confused with similarly named character from Soul Eater.
    ==Notable Matchups== Victories: Losses: Inconclusive: ==References== ==Notes/Explanations==
    Category:Characters Category:Naruto Category:Anime Characters Category:Male Characters
