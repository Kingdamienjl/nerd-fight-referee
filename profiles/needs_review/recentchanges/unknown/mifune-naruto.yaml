    Users Category:Samurai Category:Acrobats Category:Surface Scalers Category:Adults
    Category:Leaders Category:Chi UsersCategory:Extrasensory Perception UsersCategory:Knife
    Users Category:Weapon Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
