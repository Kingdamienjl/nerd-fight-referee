    a tangible energy derived from the user''s vigor, courage, and mind. It can be
    used in a number of ways, such as to surpass the limits of one''s body to greatly
    increase in strength, and it can be fired as blasts of energy or used to create
    defensive barriers. *Dodon Ray: A powerful energy beam fired from the index finger
    originating from The Crane School. Chiaotzu first used this technique in his quarter-finals
    match against Krillin. *Telekinesis: Chiaotzu can use his psychic energy to manipulate
    objects in his vicinity. With this, he can induce paralysis and stop projectiles.
    *Farewell, Mr. Tien: A self-destruct technique powered by his psychic energy.
    It was used against Nappa, with little success.'
