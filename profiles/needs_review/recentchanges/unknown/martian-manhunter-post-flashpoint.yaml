- id: claim-weaknesses-69096cd3
  section: weaknesses
  axis: weakness
  text: 'Martians are much more vulnerable to fire than the average Earth human. At
    times this has been portrayed as physical, psychological, or a combination of
    the two. The effect of this is to strip any Martian of their powers as they involuntarily
    lose control of their body. Notes: *Before making any changes to this page, please
    read and follow the Power-scaling Rules for Marvel and DC Comics. *Martian Manhunter
    (J''onn J''onzz) was created by Joseph Samachson and Joe Certa, first appearing
    in Detective Comics #225. However, in the Prime Earth continuity, Martian Manhunter
    (J''onn J''onzz) first appeared as part of the New 52 DC Universe in Stormwatch
    (Volume 3) #1 by Paul Cornell and Miguel Sepulveda. *J''onn J''onzz is the older
    of two twins, whose name means light for light.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-8346ce89
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Flight, Telepathy, Shapeshifting, Size
    Manipulation, Invisibility, Intangibility, Regeneration, Enhanced Senses, Illusion
    Creation (Telepathically defeated Despero by using illusions, and then put him
    into a coma), Possession, Astral Projection, Mind Manipulation, Memory Manipulation,
    Telekinesis, Weapon Creation, Fusionism, Duplication, Adaptation, Limited Vibration
    Manipulation (Thunderclaps drones away.Action Comics (2011) Annual #3), Absorption
    (Of DNA), Multiple Selves (J''onn split himself into multiple different beings
    long ago to experience Earth under the pretense of being actual humans, not knowing
    of their origin. Upon learning of an incoming Martian invasion of Earth, J''onn
    activated contacted them all telepathically and awakened their powers.Martian
    Manhunter (2019) #12), Limited Empathic Manipulation (Telepathic connection keeps
    Ultra calm.Justice League United #4), Memory Absorption (Absorbs John Jones being
    into himself. Martian Manhunter (2019) #12), Retrocognition (Reads psionic impressions
    of past events, and projects the images.Aquaman (2011) #36), Sleep Manipulation
    (Makes a woman peacefully fall asleep and extracts knowledge of how to operate
    a machine.Martian Manhunter (2015) #2), Perception Manipulation (Makes the Justice
    League think they''re in battle with him.Martian Manhunter (2015) #2), Durability
    Negation (Phases out an Amazo''s brain.Justice League (2018) #27 Joker controlling
    Martian Manhunter manages to attack Batman at a microscopic level.Justice League
    (2018) #6), Body Control, Extrasensory Perception (Has fourteen other senses aside
    from telepathy.Justice League (2018) #26) Resistance to Time Manipulation, Reality
    Warping, Mind Manipulation, Anti-Energy Attacks (Takes an anti-energy blast from
    Wildfire. Justice League (2018) #2), Biological Manipulation/Disease Manipulation
    (Body can resist pathogenic mutagens. Justice League (2018) #2), Ice Manipulation
    (Breaks free of his cells being told to freeze.Martian Manhunter (2018) #12),
    Madness Manipulation (Enters Atrocitus''s mind, feeling his rage and viewing his
    past.Red Lanterns #10), Temperature Manipulation/Magma Manipulation (Flies closer
    to the sun than any living beings been before according to Superman.Action Comics
    (2011) #34 Survives heat and lava up-close that was burning Mera from far away.Aquaman
    (2011) #36), Corruption (Resists the totality reverting and mutating his mind.Justice
    League (2018) #3), Pain Manipulation (Endures Mindhunter''s mental assault and
    torture for hours.Justice League (2018) #54-56), Poison Manipulation (Phases only
    an arm to avoid an attack and phases out his lungs to avoid breathing toxic spray.Justice
    League of America (2013) #3), Paralysis Inducement (Walks through a stasis field.Justice
    League United #2)'
