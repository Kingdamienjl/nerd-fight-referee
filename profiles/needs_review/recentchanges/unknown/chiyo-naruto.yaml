        And Non-Physical Interaction (Can likely touch Appetite Oni, after eating
        PAIR can touch Souls) *Fear Aura, Power Null And Death Manipulation (He should
        have potent aura of fear, which can kill creatures) *Energy Manipulation,
        Energy Absorption, Energy Projection And Durability Negation (Can absorb the
        energy from the things it eats, With Appetite Energy it can manipulate air
        and create Ou Shoku Bansan which ignores durability by directly eating its
        target, it can project it) *Energy Weapon Creation (Can create weapons from
        Appetite Energy) *Pain Manipulation (Chiyo''s slicing capabilities are perfected
        to the point of being capable of cutting someone or something so fast and
        cleanly that the person doesn''t initially register the cut, causing them
        to feel zero pain even though massive chunks of flesh are removed from their
        body. This can even cause opponents to move around like they''re still alive
        even after they''ve been killed by Chiyo because they didn''t initially register
        the fact they were killed by Chiyo. This has a caveat however, if the opponent
        registers the damage dealt to them by Chiyo''s slices then the "painlessness"
        or "deathlessness" of the wound is removed, causing the opponent to be flooded
        with pain from the wound or the dead opponent stops moving around like they''re
        still alive) *Forcefield Creation (Chiyo can generate a cutting board constructed
        of appetite energy to block attacks) *Knocking Combat User, Sealing, Status
