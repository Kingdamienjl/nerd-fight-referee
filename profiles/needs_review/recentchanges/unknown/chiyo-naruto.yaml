        capabilities with the use of chakra. The Shunshin no Jutsu allows Shinobi
        to greatly enhance their speed by focusing chakra in their feetRin no Sho,
        Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and Water Walking
        (By focusing chakra at the soles of their feet, Shinobi can scale and cling
        to vertical surfaces, and even walk on waterNaruto Chapter 18Naruto Chapter
        90), Minor Illusion Creation and Duplication (With the Clone TechniqueRin
        no Sho, Page 220, Shinobi can create illusionary duplicates of themselves
        that have no physical substance), Shapeshifting (With the Transformation TechniqueRin
        no Sho, Page 220, Shinobi can transform themselves into other people, animals,
        plants, and even inanimate objects, such as weapons), Paralysis Inducement
        (With the Temporary Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely
        paralyze their targets from close to mid range), Genjutsu Nullification (Shinobi
        can typically break free from and nullify non-ocular genjutsu by intentionally
        disrupting the flow of chakraSha no Sho, Page 301 within their bodies), Afterimage
        Creation (Can create one or more afterimages of herself to move alongside
        her), Healing (She is a highly capable medical-nin), Limited Resurrection
        (Can resurrect a dead person back to life by exchanging her death), Poison
        Manipulation (She is a poison expert, which allowed her to create powerful
        poisons that in her entire life have only been countered by Tsunade, who is
        herself renowned as the world''s greatest medical-nin), Summoning (Can summon
        puppets using scrolls), Sealing (Sealed Shukaku into Gaara), Thread Manipulation
        (Can manipulate chakra threads to control and fire weapons), Thread Mastery
        (She has great skill with chakra threads, as she could place them onto other
        puppets without her opponent noticing and suppressing them to the point that
        they became invisible), Body Puppetry (Can control the movements of puppets
        and living beings by attaching chakra threads to them), Forcefield Creation
