    - field: weaknesses
      value: "Anger may blind her Notable Attacks/Techniques: *Food Honor: A philosophical\
        \ practice of the appreciation of your food, which is pursued by seeking perfection\
        \ of bodily control and power of concentration, and through it achieving enhanced\
        \ physical ability and supreme energy efficiency (via using your muscles more\
        \ efficiently). Chiyo formerly followed the discipline taught at the Shokurin\
        \ Temple, where she learned to continuously show appreciation for one's meal\
        \ from the bottom of their hearts. In the training, she drastically augmented\
        \ her physical ability and power of concentration by learning to cut on unnecessary\
        \ movements, better focus her mind and practicing bodily control and precision.\
        \ Having joined the Bishokukai, Chiyo has dropped the appreciation aspect\
        \ of Food Honor but has apparently kept all of her skill. *Food Pressure:\
        \ A concept similar to Food Honor, though instead of appreciating food to\
        \ capture delicate or special ingredients, one threatens food, so as to control\
        \ it by force. Chiyo uses this after she joined the Bishokukai. *Food Immersion:\
        \ Secret technique of Food Honor, where the user through complete appreciation\
        \ of the food is able to receive almost limitless nutrients from it, and also\
        \ store months\u2019 worth of nourishment in the body. *Judas Tree Peeling\
        \ (\u6842\u5265\u304D Katsura Muki): Using this technique, Chiyo can cut the\
        \ arm of an opponent into a thin sheet. It can be performed from a distance.\
        \ *Chopping Board Shield (\u307E\u306A\u677F\u30B7\u30FC\u30EB\u30C9 Manaita\
        \ Sh\u012Brudo): Chiyo uses a giant chopping board as a shield. The board\
        \ is durable enough to withstand multiple Leg Knives, although in the end\
        \ it broke. In the anime, she created the chopping board with her knives out\
        \ of a purple energy in a similar manner to Toriko's Fork and Knife attacks.\
        \ *One Blade: Thunder Cut (\u4E00\u5200 \u96F7\u65AC\u308A Itt\u014D: Raigiri):\
        \ Chiyo spins her knife like a drill and stabs her opponent. This attack does\
        \ not require physical contact with the knife to damage the target. In the\
        \ anime the technique is simply called Raigiri and, instead of piercing the\
        \ target, it generates a spinning beam to strike them. *Dicing Cut (\u3055\
        \u3044\u306E\u76EE\u5207\u308A Sainomekiri): Powerful blades of air are made\
        \ from one's knife which can travel a long distance and dice foes into small\
        \ cubes. She can also add Knocking to the cut to incapacitate creatures with\
        \ regenerative abilities. * * Category:GigaTopMagnum"
