- id: claim-weaknesses-b2a70da9
  section: weaknesses
  axis: weakness
  text: "None Notable Notable Attacks/Techniques: *White Secret Technique: The Chikamatsu\
    \ Collection of Ten Puppets: After unravelling the carrying scroll, the Chikamatsu\
    \ Collection appears from the gate (\u9580, mon) crest. Using the Puppet Technique\
    \ to manipulate them at will is what is known as the \"an amount matching ones\
    \ fingers\" (\u6307\u306B\u6570, Yubi ni s\u016B) method. With this puppet collection\
    \ it is literally possible to use one puppet with each finger \u2014 each boasting\
    \ a power matching a thousand puppets put together. However, to use all of these\
    \ secret mechanisms demands extremely high-class expertise and skill. ==Notable\
    \ Matchups== Victories: Losses: Inconclusive: ==References== Category:Characters\
    \ Category:Naruto Category:Female Characters Category:Manga Characters Category:Anime\
    \ Characters Category:Acrobats Category:Surface Scalers Category:Free Movement\
    \ Users Category:Weapon Masters Category:Martial Artists Category:Poison Users\
    \ Category:Body Puppetry Users Category:Paralysis Users Category:Resurrection\
    \ Users Category:Stealth Masters Category:Statistics Amplification Users Category:Healers\
    \ Category:Shapeshifters Category:Illusionists Category:Duplication Users Category:Humans\
    \ Category:Elders Category:Zombies Category:Ninjas Category:Adults Category:Chi\
    \ Users Category:Energy UsersCategory:Extrasensory Perception Users Category:Weapon\
    \ Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
