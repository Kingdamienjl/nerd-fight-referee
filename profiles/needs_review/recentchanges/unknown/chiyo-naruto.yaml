- id: claim-powers-and-abilities-9551540b
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Stealth Mastery, Acrobatics, Martial
    Arts (Skilled in taijutsu, as seen during her brief scuffle with Naruto and his
    clone), Weapon Mastery (Can control puppets that use a variety of weapons), Puppet
    Mastery (She is a renowned master of the Puppet Technique, famous for her abilities
    in both creating and controlling puppets), Chakra Manipulation, Statistics Amplification
    (Shinobi are capable of enhancing their physical capabilities with the use of
    chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance their speed by
    focusing chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter
    71), Surface Scaling and Water Walking (By focusing chakra at the soles of their
    feet, Shinobi can scale and cling to vertical surfaces, and even walk on waterNaruto
    Chapter 18Naruto Chapter 90), Minor Illusion Creation and Duplication (With the
    Clone TechniqueRin no Sho, Page 220, Shinobi can create illusionary duplicates
    of themselves that have no physical substance), Shapeshifting (With the Transformation
    TechniqueRin no Sho, Page 220, Shinobi can transform themselves into other people,
    animals, plants, and even inanimate objects, such as weapons), Paralysis Inducement
    (With the Temporary Paralysis TechniqueRin no Sho, Page 176, Shinobi can completely
    paralyze their targets from close to mid range), Genjutsu Nullification (Shinobi
    can typically break free from and nullify non-ocular genjutsu by intentionally
    disrupting the flow of chakraSha no Sho, Page 301 within their bodies), Afterimage
    Creation (Can create one or more afterimages of herself to move alongside her),
    Healing (She is a highly capable medical-nin), Limited Resurrection (Can resurrect
    a dead person back to life by exchanging her death), Poison Manipulation (She
    is a poison expert, which allowed her to create powerful poisons that in her entire
    life have only been countered by Tsunade, who is herself renowned as the world''s
    greatest medical-nin), Summoning (Can summon puppets using scrolls), Sealing (Sealed
    Shukaku into Gaara), Thread Manipulation (Can manipulate chakra threads to control
    and fire weapons), Thread Mastery (She has great skill with chakra threads, as
    she could place them onto other puppets without her opponent noticing and suppressing
    them to the point that they became invisible), Body Puppetry (Can control the
    movements of puppets and living beings by attaching chakra threads to them), Forcefield
    Creation (She have a chakra shield installed in her puppet arm) All previous abilities
    when alive, *Regeneration (Low-Godly - Edo Tensei are capable of regenerating
    from the complete destructionNaruto Chapter 517 page 8 and 9 of their bodiesNaruto
    Chapter 561. It''s stated that as long as the soul remains, the Edo Tensei will
    keep coming back to lifeNaruto Chapter 120Naruto Chapter 518) *Immortality (Types
    1, 2, 3, 4, 7 and 8 - Edo Tensei are corpses possessed by a soul brought back
    from the Pure Land. They are incapable of feeling pain along with being able to
    survive grievous injuries such as bisectionNaruto Chapter 523 and dismemberment.Naruto
    Chapter 520 page 21 Edo Tensei will keep coming back so long as their soul remains
    bound to the Edo realmNaruto Chapter 120Naruto Chapter 518) *Inorganic Physiology
    (Type 1 - Edo Tensei bodies are comprised of dust and ash enveloping an already
    deceased corpse shaping it into the revived person the caster choosesNaruto Chapter
    119) *Self-Sustenance (Types 1, 2 and 3 - The Edo Tensei are the souls of the
    dead the caster wants to reanimate, the caster uses an already dead body to house
    the revived soulNaruto Chapter 520) *Instinctive Action (Edo Tensei are programed
    to automatically counter enemy jutsuNaruto Chapter 547 along with their bodies
    moving of its own accordNaruto Chapter 548) *Resistance to Mind Manipulation,
    Empathic Manipulation and Emotion Detection (Even though Edo Tensei are able to
    retain their consciousness when brought back from the afterlife, the controller
    can suppress their free willNaruto Chapter 119 Page 16 binding their mind and
    shutting off all emotionNaruto Chapter 522) Superhuman Physical Characteristics,
    Inorganic Physiology (Type 2), Thread Manipulation ("Mother and Father" puppets
    were equipped with wire strings that extend from both of the puppets hands. When
    connected they have the ability to cut through most things), Forcefield Creation
    (Both puppets have a chakra shield installed in their arms to defend against attacks)
    Superhuman Physical Characteristics, Inorganic Physiology (Type 2), Sealing and
    Power Nullification with Sealing Technique: Lion Closing Roar (Puppet 10 can release
    an orb from its mouth that blocks the target''s chakra by closing all the tenketsu
    of the person caught in the middle with a sealing formula), Air Manipulation with
    Three Jewels Suction Crushing (Puppets 6, 7, and 8 can create a powerful tornado
    that sucks the targets into the centre of the formation)'
  source_ids: *id003
  decisive: true
