- id: claim-powers-and-abilities-1ede5af0
  section: abilities
  axis: hax
  text: 'Agony (Peak-Tier and Spirit), Incorporeality and Invisibility (Is a spirit
    that is never truly perceived by the player), Creation, Summoning, Reality Warping,
    and Life Manipulation (Created the realm of UCN to prevent the player and themselves
    from moving on to the afterlife.Ultimate Custom Night Can create animatronics
    to torture the player with. Actively prevents the player from truly perishing,
    as stated by Nightmare FreddyUltimate Custom Night), Possession (Speaks through
    the Mediocre MelodiesUltimate Custom Night), Subjective Reality (Brought the Nightmare
    animatronics into physical reality despite formerly being illusions, described
    as them being "given flesh", as stated by Nightmare Freddy and Nightmare FredbearUltimate
    Custom Night), Clairvoyance (Is stated to be "always watching" by MangleUltimate
    Custom Night), Resurrection (Repeatedly resurrects the player, which is directly
    pointed out by NightmarionneUltimate Custom Night), Law Manipulation and Power
    Bestowal (By raising or lowering the animatronics'' AI, they can become faster,
    more aggressive, and more intelligent, or the opposite), Time Manipulation (Resets
    time every night), Temperature Manipulation and Sound Manipulation (By virtue
    of creating everything within the Offices, including the Heater, Power AC, and
    Global Music Box), Sealing (Soul & Mind - Withered Bonnie implies that he and
    William''s soul are prisoners within their realm after William''s death as a means
    to torture him for eternity), Darkness Manipulation (Slowly makes the office pitch
    black after the power runs outUltimate Custom Night), Dimensional Travel and Resistance
    To BFR (Can leave Old Man Consequences'' pondUltimate Custom Night despite it
    being impossible in FNAF World.FNAF World) Through Summoning, The One You Should
    Not Have Killed also has access to: Technology Manipulation (Via Bonnie, Balloon
    Boy, JJ, Old Man Consequences, and Rockstar Foxy), Sound Manipulation (Via Phantom
    Mangle, Trash and the Gang, Helpy, Music Man, Ballora, and Phone Guy), Perception
    Manipulation (Via Phantom Freddy and Phantom BB), Light Manipulation (Via Funtime
    Chica), Summoning (Via Dee Dee and XOR), Darkness Manipulation (Via RWQFSFASXC),
    Status Effect Inducement (Via El Chip and Lolbit)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
