- id: claim-weaknesses-e9751199
  section: weaknesses
  axis: weakness
  text: "Teleportation with Homeward Idol takes several seconds in which he is vulnerable.\
    \ Dying repeatedly exhausts Wolf's resurrective power which leads to temporary\
    \ unconsciousness, and if the process is repeated, the resurrection eventually\
    \ gets powered through absorbing the life force of others, spreading a lethal\
    \ disease known as Dragonrot which causes coughing of blood and eventual death.\
    \ A Mortal Blade, which Wolf himself wields, can be used to kill him permanently.\
    \ Notable Attacks/Techniques: *All Skills *All Prosthetic Tools ==Notable Matchups==\
    \ Victories: * Homer Simpson (The Simpsons) Homer\u2019s Profile (Speed was equalized,\
    \ Wolf was in his 8-C key) * Ikaruga (Senran Kagura) Ikaruga's Profile (Mid-game\
    \ Wolf and Versus Ikaruga were used. Speed was equalized.) * Talion (Shadow of\
    \ Mordor) Talion's Profile (8-C versions used, Shadow of Mordor Talion used, starting\
    \ distance was 2 meters, and speed was equalized) * Chosen Undead (Dark Souls)\
    \ Undead's Profile (Speed was equalized, 7-C keys were used, starting distance\
    \ was 100 meters, fight took place in Mumbai) * V1 (ULTRAKILL) V1's Profile (Speed\
    \ was equalized, 7-C keys were used, starting distance was 10 meters, V1's weapons\
    \ were all normal variants) Losses: * Geralt of Rivia (The Witcher series) Geralt's\
    \ profile (Speed was equalized and both were 8-C, Geralt could use all his potions\
    \ and Sekiro could use all his prosthetics) Inconclusive: ==References== ==Statistics\
