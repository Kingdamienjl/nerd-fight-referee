        Social Influencing, Charisma, Myeong-gil possesses a "dark" charisma characterized
        by a "sharp tongue." He uses this to navigate high-society circles, presenting
        himself as a legitimate investor to the wealthy and convincing them that "dirty
        money doesn't exist" if used for good ends, while acting as a loan shark to
        the poor, Leadership, As the CEO of Smile Capital, he leads an organized criminal
