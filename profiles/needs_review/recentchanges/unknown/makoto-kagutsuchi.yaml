      Kanai Wards Ultimate Secret. *Makoto will prefer to manipulate from behind the
      scenes, while using his identical face to Number One in order to utilise resources
      from the WDO and the UG. Afterwards, he will have no initial issue with covering
      the evidence, such as disposing of Yuma or Fink the Slaughter Artist. **Makoto
      will not directly oust opposition, and will instead use the abilities and efforts
      of others to achieve his goals, such as using the Master Detectives to oust
      Yomi from his position as head of the Peacekeepers. He befriended Yuma accordingly
      in order to perfectly execute all of his plans.'
