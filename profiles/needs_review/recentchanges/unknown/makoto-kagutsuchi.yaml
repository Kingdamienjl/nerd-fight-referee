        Forte: Coalesense, Makoto is able to copy and use the abilities of anyone
        who he is holding the hands of), Limited Weather Manipulation (Makoto created
        a device that creates rainclouds that cover an entire city and stay there
        for over three years) All previous abilities, Limited Immortality (Type 2,
