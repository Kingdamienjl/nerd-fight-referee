        attack and movement rate while also revealing invisible enemies. *Consume:
        Sacrifices a nearby allied Zerg to restore energy to Kerrigan. *Psionic Storm:
        Kerrigan can create disturbances in psionic energies in a target location,
        tearing them into a vicious storm. This storm attacks almost every aspect
        of an enemy, from mind, to body, to armor; it can quickly rip even a durable
        enemy apart from its core. *Razor Swarm: Creates a violent swarm of zerg microbes
        in an area, dealing heavy damage to enemies in the area. *Implosion: Creates
        a localized gravity well that telekinetically crushes and quickly kills the
        target mechanical unit. *Kinetic Blast: Deals damage to a target instantly.
        *Leaping Strike: Kerrigan leaps to a target location, attacking any enemies
        around her landing area. *Crushing Grip: Stuns a targeted area and hurts any
        within the area over time. *Chain Reaction: Kerrigan''s normal psionic strikes
        bounce to four adjacent enemies for less damage. *Psionic Shift: Kerrigan
        dashes forward, dealing damage to any enemy in front of her. *Wild Mutation:
        Kerrigan massively increases the durability and attack rate of Zerg in an
