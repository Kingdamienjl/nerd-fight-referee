- id: claim-weaknesses-c9c1c219
  section: weaknesses
  axis: weakness
  text: 'None notable; if killed within the Void, she will not be able to regenerate
    as a Xel''naga. Notable Attacks/Techniques: *Cloaking: Allows Kerrigan to turn
    invisible, only being seen by units that can see invisible units. *Lockdown: Disables
    the target mechanical or robotic unit for a minute. *Cloaking: Allows Kerrigan
    to turn invisible, only being seen by units that can see invisible units. *Ensnare:
    Covers enemies in an area with green slime, halving their attack and movement
    rate while also revealing invisible enemies. *Consume: Sacrifices a nearby allied
    Zerg to restore energy to Kerrigan. *Psionic Storm: Kerrigan can create disturbances
    in psionic energies in a target location, tearing them into a vicious storm. This
    storm attacks almost every aspect of an enemy, from mind, to body, to armor; it
    can quickly rip even a durable enemy apart from its core. *Razor Swarm: Creates
    a violent swarm of zerg microbes in an area, dealing heavy damage to enemies in
    the area. *Implosion: Creates a localized gravity well that telekinetically crushes
    and quickly kills the target mechanical unit. *Kinetic Blast: Deals damage to
    a target instantly. *Leaping Strike: Kerrigan leaps to a target location, attacking
    any enemies around her landing area. *Crushing Grip: Stuns a targeted area and
    hurts any within the area over time. *Chain Reaction: Kerrigan''s normal psionic
    strikes bounce to four adjacent enemies for less damage. *Psionic Shift: Kerrigan
    dashes forward, dealing damage to any enemy in front of her. *Wild Mutation: Kerrigan
    massively increases the durability and attack rate of Zerg in an area. Does not
    effect herself. *Spawn Banelings: Kerrigan summons six Banelings to attack her
    enemies that last for ninety seconds or until they explode. *Mend: Kerrigan heals
    herself and surrounding allies. *Infest Broodlings: Kerrigan''s attacks infest
    enemies she harms with broodlings. Killing two broodlings to hatch from their
    corpse and attack enemies. *Fury: As Kerrigan makes attacks, she gains a stacking
    bonus to her attack rate, up until she is attacking seventy-five percent faster.
    *Apocalypse: After channeling energy, deal massive damage to enemies in a targeted
    area. *Spawn Leviathan: Summons a Leviathan to attack her enemies for four minutes.
    *Drop Pods: Causes Zerg drop pods to drop and let out forty primal Zerglings,
    five primal Roaches, five primal Hydralisks that attack her enemies for four minutes.
    Xel''Naga= *Quantum Ray: Deals heavy damage to the target. *Celestial Radiance:
    Heals Kerrigan and nearby allies. *Creep Teleport: Teleports Kerrigan and nearby
    friendly Zerg to any area covered with creep. *Extinction: Deals damage to enemies
    in a large area around Kerrigan, and void-based enemies are killed instantly.
    *Cosmic Fury: Allies in a large area around Kerrigan have increased attack and
    movement rates. ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters
    Category:Game Characters Category:Book Characters Category:Female Characters Category:Energy
    Users Category:Telepaths Category:Telekinesis Users Category:Flight Users Category:Regeneration
    Users Category:Healers Category:Neutral Characters Category:Evil Characters Category:Good
    Characters Category:StarCraft Category:Monster Girls Category:Protagonists Category:Antagonists
    Category:Primary Antagonists Category:Psychics Category:Humans Category:Adults
    Category:Soldiers Category:Snipers Category:Assassins Category:Aliens Category:Hybrids
    Category:Gun Users Category:Knife Users Category:Invisibility Users Category:Revolutionaries
    Category:Fusions Category:Absorption Users Category:Military Characters Category:Status
    Effect Users Category:Summoners Category:Tragic Characters Category:Transcendent
    Beings Category:Teleportation Users Category:Perception Users Category:Mind Users
    Category:Matter Users Category:Gravity Users Category:Queens Category:Portal Users
    Category:Nigh-Omniscient Beings Category:Martial Artists Category:Durability Negation
    Users Category:Electricity Users Category:Technology Users Category:Stealth Masters
    Category:Hackers Category:Weapon Masters Category:Extrasensory Perception Users
    Category:Enhanced Senses Users Category:Biology Users Category:Hackers Category:Healers
    Category:Science Fiction Characters Category:Video Game Characters Category:Fallen
    Characters'
