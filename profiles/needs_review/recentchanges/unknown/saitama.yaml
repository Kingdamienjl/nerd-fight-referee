    text: At least Average (Saitama seems to be single-minded at times, chasing a
      mosquito relentlessly even after sustaining a blast that destroyed his clothing
      completely. Additionally, he is lacking academically, only barely passing the
      hero exam due to his poor score on the written exam. However, Saitama seems
      to have some experience in fighting techniques and is an excellent brawler in
      combat, pressuring his opponents relentlessly if he goes more serious. He displays
      great control over his speed and strength, stopping his fist within a hair's
      breadth of Genos' face to avoid hurting him and generally holding back in fights
      to prolong them. Saitama has been shown to be a good judge of character, being
      able to tell people's real motives, such as those of Garou and Fubuki quite
      quickly. While serious, Saitama has proven himself to be an ingenious fighter.
      During his fight with Garou, he masterfully copied multiple of his techniques
      and performed them with expertise that not even those such as Bang and Bomb
      could replicate. Garou even further stated that he has the potential to master
      the power of god without being given it, and master them even further; he mastered
