      value: 'Saitama, due to being used to being the strongest in the universe, would
        underestimate his opponent or not care about the fight entirely, which could
        cost him the victory. Notable Attacks/Techniques : Normal Punch : Saitama
        performs a regular punch. 300px|center Consecutive Normal Punches : Saitama
        throws multiple normal punches. 300px|center Serious Punch : Saitama throws
        a very powerful punch, able to level continents, or even worse, a planet.
        300px|center Serious Consecutive Side Hops : Saitama hops from side to side,
        going fast enough to overwhelm people like Speed-o''-sound-sonic. 300px|centerOther
        Attacks : Serious Headbutt : Saitama throws a head strike. Serious Sneeze
        : Saitama sneezes, hard enough to explode a gas giant. Serious Sprint : Saitama
        sprints, fast enough to break through dimensions. Serious Squirt Gun : Saitama
        uses his hands as a high pressure water gun.. or lava gun. Serious Table Flip
        : Saitama lifts the crust of a planet. == Notes/Explanations == I manually
        calculated almost everything, except for the teenager wall level feat. Contact
        me if you wanna know any calculations. I didn''t scale Saitama above Multiversal
        cause he affected the universe with his last punch, and was in a 4d construct.
        I initially scaled him to Low 2-C but didn''t proceed cause God and Saitama
        only have statements over 4-D. Furthermore, High 3-A was the logical pick
        for me, as God was unaffected by time stones, but i could not see much feats
        that could place him over 4-D, except for statements. I did copy most abilities
        from VSBW (mb csap mods) but nothing else. Scaling him above 4-D or Universe
        Level+ would be illogical. I don''t think Saitama could use Time Travel, which
