power_scale:
  tier:
    text: 6-C, , higher, up to High 6-C, possibly 4-A with the Three Regalia or Hauteclere
    source_ids: &id002
    - mediawiki-501211
    confidence: 0.8
  attack_potency:
    text: 'Island level12.5956 gigatons (Can fight against children of the future
      like Lucina who were able to defeat soldiers from Valla, said soldiers can fight
      against Flora and people stronger than her. Flora''s power is such that she
      was able to freeze an entire sea), Varies, higher, up to Large Island level,
      possibly Multi-Solar System level with the Three Regalia or Hauteclere (Gotoh
      declares that without the Falchion, the Three Regalia are, if used by a wielder
      at the utmost limit of their power, the last hope against Medeus.'' - Book 1
      Chapter #17: "A Knight-Filled Sky." Nintendo, 1994 Hauteclere is said to rival
      the Three Regalia'' - Chapter #7: "Lefcandith Gauntlet." Nintendo, 2008340.3992
      gigatons of TNT, possibly 16.88 exa-foe), can ignore conventional durability
      with several spells'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Superhuman travel speed with Massively Hypersonic combat and reaction speed
      (Capable of dodging BoltingFire Emblem AwakeningMach 223.6317), higher attack
      speed with Brave Weapons, higher reaction speed with Dual Guard (Get faster
      when working together with an ally and is able to perform Dual Guard where a
      character can momentarily move at such speed that enemy attacks seem to stop
      in order to block a strike aimed at an ally)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Superhuman (Can carry heavy magic tomes across entire battlefields with
      no signs of fatigue)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Island, Varies, higher, up to Large Island level, possibly Multi-Solar System
      level with the Three Regalia or Hauteclere (When used by a wielder who has pushed
      their power to their utmost limit, the Three Regalia, as well as weapons of
      similar might, like Hauteclere, are capable of harming Medeus)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Island level (Can withstand attacks from opponents capable of harming Tiki)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Can fight entire battles with no signs of tiring)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range; Tens of Meters with spells
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: "Gifted (Although Tharja tends to make irrational decisions in pursuit of\
      \ her obsessions and curiosity, she consistently displays a great deal of intelligence.\
      \ Being trained in the dark arts as early as her infancy,Fire Emblem Awakening\
      \ - Tharja/Noire B Support she possesses knowledge on a wide array of advanced\
      \ spells and curses. Although she lacked confidence in herself as a mentor,\
      \ she successfully taught Ricken how to cast hexes, getting him to master the\
      \ basics in a short timeframe.Fire Emblem Awakening - Tharja/Ricken S Support\
      \ This brief time as a mentor also allowed Tharja to learn more about her art.Fire\
      \ Emblem Awakening - Tharja/Ricken S Support After meeting Robin, she would\
      \ stalk them every day without being spotted for the majority of the process,\
      \ taking note of \"every single move\" and accurately recalling incredibly mundane\
      \ patterns.Fire Emblem Awakening - Robin/Tharja C Support Stated she could construct\
      \ a flute from animal bones) Gifted (As a highly proficient Dark Mage who was\
      \ trained since infancy,Fire Emblem Awakening - Tharja/Noire B Support Tharja\
      \ is an especially powerful warrior who has made efficient use of her unique\
      \ abilities. Even with her incomplete training,Fire Emblem Awakening - Tharja/Ricken\
      \ B Support she is particularly skilled at doling out hexes and curses whenever\
      \ she is agitated, a trait that has terrorized her friends and foes alike. Tharja\
      \ served as a member of Chrom's Shepherds, who are all trained soldiers and\
      \ guards to the Exalt. Her observational tendencies apply outside of stalking\
      \ Robin, such as how she can recognize when her enemies are growing stronger.\
      \ Has easily fought and defeated groups of Deadlords,Fire Emblem Awakening -\
      \ Infinite Regalia Risen soldiers,Fire Emblem Awakening - Roster Rescue Wyvern\
      \ Lords,Fire Emblem Awakening - Five-Anna Firefight Swordmasters,Fire Emblem\
      \ Awakening - Roster Rescue and mercenaries,Fire Emblem Awakening - Summer Scramble\
      \ the latter of which are considered to be \u201Cmasters of the killing arts\u201D\
      Fire Emblem: The Sacred Stones)"
    source_ids: *id002
    confidence: 0.8
