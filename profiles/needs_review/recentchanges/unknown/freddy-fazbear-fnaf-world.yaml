- id: claim-weaknesses-8e92a6e6
  section: weaknesses
  axis: weakness
  text: 'None notable | None notable | None notable Notable Attacks/Techniques: *Mic
    Toss: Freddy throws his microphone at one enemy. *Pizza Wheel: Freddy makes a
    tossing pose as many pizzas roll from the right of the screen and off the left
    side of the screen. It hurts every enemy. *Birthday: Many pops and cheers are
    heard, which raises the attack, defense and speed of all allies. ==Notable Matchups==
    Victories: Losses: Inconclusive: Category:Characters Category:Male Characters
    Category:Robots Category:FNAF World Category:Playable Characters Category:Heroes
    Category:Protagonists Category:Good Characters Category:Non-Physical Interaction
    Users Category:Game Characters Category:Statistics Amplification Users Category:Supernatural
    Luck Users Category:Summoners Category:Resurrection Users Category:Regeneration
    Users Category:Curse Users Category:Forcefield Users Category:Power Mimicry Users
    Category:Death Users Category:Explosion Users Category:Life Users Category:Energy
    Users Category:Role-playing Characters Category:Bears Category:Acrobats Category:Danmaku
    Users Category:Food Users Category:Microphone Users Category:Inorganic Beings
    Category:Immortals Category:Organic Users Category:Energy Projection Users Category:Video
    Game Characters Category:Gun Users Category:Weapon Users Category:Instinctive
    Action Users Category:Musicians'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-aa80a8db
  section: abilities
  axis: hax
  text: '{{#tag:tabber||-|Base= *Superhuman Physical Characteristics *Inorganic Physiology
    (Unknown Type; It''s unclear if it''s possessed like its canon counterpart or
    not) *Immortality (Type 2; Comparable to the Withereds, who can survive face less
    and handless, and to Mangle, who can not only survive being a bare endoskeleton,
    but was also implied to have been put apart and put back together like it''s cannon
    counterpart) *Food Manipulation (Via Pizza Wheel) *Statistics Amplification (Via
    Birthday) *Possibly Non-Physical Interaction (Can harm characters such as the
    Phantoms, RWQFSFASXC, Shadow Freddy and Crying Child, with the formers being illusions
    and last three being ghosts. However, since that''s how it''s like in the original
    canon and not FNaF Worlds, it''s unclear if they retain these properties) Resistance
    to *Plot Manipulation (Managed to fight Animdude, who was trying to use this ability
    on every playable character) |-|Bytes and Chips= *Greater Statistics Amplification
    (Via Headstart Chips and Endless Chips) *Limited Supernatural Luck (Via Run: Luck
    Chip) *Resurrection (Via Auto: Giftboxes Chip) *Regeneration (To an unknown extent;
    Via Auto: Regen Chip, Medpod Bytes, and Pearl) *Curse Manipulation (Decreases
    all opponent''s stats; Via Curse: Status Chip) *Forcefield Creation (Via Auto:
    Shield Chip and Shield Bytes) *Power Mimicry (Via Auto: Mimic Chip, which mimics
    attacks done by Freddy) *Summoning (Via Freddle: Fury, Pizza: Fury chip, and Evercomet
    Chips) *Death Manipulation (Via Reaper Bytes) *Explosion Manipulation (Via Bomb
    Bytes) *Life Drain (Via Eyebot Bytes) *Energy Projection (Via UFO Chips and Fan)
    *Automatic Counter Attack (Counter: Bite; damages all enemies that attack automatically)
    Resistance to *Status Effect Inducement (Via Block: Jumpscare Chip) *Death Manipulation
    (Via Block: Unscrew) }} FNaF 57: Freddy in Space= *Superhuman Physical Characteristics
    *Inorganic Physiology *Immortality (Type 2) *Higher Jumps (Via Jump Boost) *Energy
    Projection (Via Energy Gun) *Danmaku (With gun upgrades)'
  source_ids: *id003
  decisive: true
