- id: claim-weaknesses-8c3d7ac2
  section: weaknesses
  axis: weakness
  text: 'Standard Human Weaknesses. | Most of, if not all, of his traps have a way
    to survive them. However, the traps tend to leave the victim in a very wounded
    state (missing limbs, blood, organs, etc). Note: This profile includes traps from
    the games: Saw: The Video Game and Saw II: Flesh and Blood. ==Notable Matchups==
    Victories: *Ghostface (2023) (Scream) The team''s profile (Speed is equalized.
    Both teams start out of line of sight 10 m away from each other without prior
    knowledge of their hiding spots. Battle takes place in the stab shrine. Wayne
    has his shotgun while Amanda is 10-A; Hoffman and Kramer are restricted to 9-C
    attacks. Ghostface is restricted to 9-C. John, Amanda and Hoffman are teamed up
    together) *Mr. Glass (Unbreakable) Mr. Glass''s Profile (10-C versions were used.
    Both were given one week of preparation) Losses: *Yugi Muto (Yu-Gi-Oh!) Yugi Muto''s
    Profile (John was in his prime. The shadow game was Jenga) *Light Yagami (Death
    Note) Light''s Profile (John was in his prime. Both were given one week of preparation)
    *Walter White (Breaking Bad) Walter White''s Profile (Both were in their prime;
    Preparation time: Both characters had 7 days of preparation time) *The Front Man
    (Squid Game) The Front Man''s Profile (Both of the games they run are pitted against
    each other. Each host is given 32 people from each other''s universes to work
    with. Both hosts'' lackeys are allowed. Both sides are given enough prep time
    to set up whichever game takes longer to set up. Match determines which game is
    deadlier.) ==References== Category:Characters Category:Saw (Franchise) Category:Acid
