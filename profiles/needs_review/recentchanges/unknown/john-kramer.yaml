  intelligence:
    text: Over the course of a few weeks, John Kramer, while heavily sick from cancer,
      malnutrition, and sleep deprivation, mastered several of the various fields
      he employs in his games, such as chemistry, toxicology, botany, medicine, and
      more by reading hundreds of books.) *Social Influencing (Leadership - His followers
      and apprentices see him as a visionary leader who pushes them to confront their
      flaws and ultimately change for the better, Deception - John Kramer employs
      intricate deception as a central component of his twisted games. By luring his
      victims into elaborate traps under false pretenses, Coercion - Blackmailed Mark
      Hoffman as a way to turn him to his side, threatening to reveal his true nature
      to the public, - Instigating Fear - By utilizing psychological manipulation
      and the threat of physical harm, Charisma - Kramer is extraordinarily charismatic.
      Despite his twisted philosophy and ostensibly being a serial killer, many of
      Kramer's former victims have come around to it under his teachings and influence,
      and his teachings have even indirectly spread to victims who've never met him
      or to killers inspired by him. Logan and Gordon both became loyal followers
      after Kramer nursed them back to health, Hoffman carried out John's targets
      long after the threat of blackmail had ceased, and Amanda came to see him as
      a father figure) *Weapon Mastery *Preparation (John Kramer's most defined characteristic
      is his ability to recognize and prepare for upcoming events, being able to stay
      one step ahead of his opponents at all time, whether it's having planned out
      scenarios prepared for them or orchestrated schemes in which his apprentices
      will have the job done) *Paralysis Inducement and Pain Manipulation (Via Opiate;
      Shown when used on Donnie Greco) *Stealth Mastery (Often uses the element of
      surprise when abducting victims for his games) *Sleep Manipulation (Via Syringes)
      *High Pain Tolerance (Endured brain surgery without anesthetics with little
      trouble. Quickly recovered from a shotgun blast. Endured a beating from Eric
      Matthews, including the cop snapping his finger, with little reaction) *Explosion
      Manipulation (Via Explosive Bracelets, Explosive Cube, The Bomb Belt, Bomb Chair,
      Nail Bombs, and Billy the Puppet) *Acid Manipulation (Via Acid Room, Chain Hangers,
      Angel Trap, Acid Barrel Trap, and Acid Vat) *Poison Manipulation (In either
      the form of an injection/liquid or a gas) *Electricity Manipulation (Via Electric
      Bathtub, The Pool, Electrified Staircase, Floor Puzzle, The Cage Fight, and
      Shackles) *Fire Manipulation (Via Burning Rack, The Crematorium, Brazen Bull,
      The Furnace, and Flammable Jelly Trap) *Heat Manipulation and Minor Steam Manipulation
      (Via Steam Maze and The Steam Maze) *Minor Water Manipulation (Via Water Cube
      and Water Tank) *Minor Ice Manipulation (Via Freezer Room)
    source_ids: *id002
    confidence: 0.8
