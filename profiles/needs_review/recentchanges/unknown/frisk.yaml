    - field: weaknesses
      value: 'Frisk is weak to possession, as characters like Chara can easily take
        over their body. Notable Attacks / Techniques: *Determination: A power that
        allows SOULs to persist after death. It also allows Frisk to get more powerful
        for the time being. If Frisk happens to get killed, they can use this power
        to keep fighting on by using the abilities listed below. **SAVE: In-game,
        this feature is used to save your files. In other words, it saves Frisk''s
        current point in the timeline they''re in by using a SAVE Point. ***LOAD:
        In-game, this feature is used to return to the last time you saved in said
        file. In other words, it allows Frisk to return to their previous SAVE Point,
        commonly after being killed by someone or something. Characters with timeline
        awareness may be aware of the previous Loads. ***RESET: In-game, this feature
        is used to erase any files and most of the stored information within it. In
        other words, it completely restarts the said timeline. Just like with Loading,
        characters who have knowledge of previous timelines will recognize Frisk,
        but not aware of how they know them. ****TRUE RESET: In-game, this feature
        is used to erase a file and all the stored information within it. In other
        words, it completely refreshes anything in that timeline. Even the memories
        of characters with timeline awareness will be completely refreshed. *FIGHT:
        Frisk will be prompted to attack a character. *ACT: Frisk will be prompted
        to select a character to learn more about them. This includes checking their
        stats or simply just interacting with them. Frisk can befriend them...or taunt
        them. In-game, ACTing can make it easier to Spare an opponent, depending on
        how flattered they are with Frisk''s interactions. (However, this technique
        doesn''t work on those who are absolutely bloodlusted.) *ITEM: Frisk will
        be prompted to use an item in their inventory. *MERCY: Frisk will refuse to
        fight at all for that turn by Sparing an opponent, or they just straight up
        run away by Fleeing. Sometimes, these can''t always happen due to certain
        circumstances. *Serious Mode: This disables any humor when fighting a character.
        (Some examples are when fighting a Boss Monster like Toriel, Asgore, Undyne
        the Undying or Sans.) Category:SKeLeTrust Category:Tier 7 Category:Tier 2'
