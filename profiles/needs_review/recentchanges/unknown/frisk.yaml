  attack_potency:
    text: "Varies with Determination, Small Building level (At their minimal level\
      \ of power, they have 0 ATK, making them equal to Moldsmal's durability. Their\
      \ Determination later grew to the point of being capable of fighting stronger\
      \ monsters, including Undyne, Mettaton EX, Mr. Sunshine and Abberant), up to\
      \ higher with Regular Determination ([https://youtu.be/Eqypnw6gQNg&t=350 Fought\
      \ and defeated] Asgore while not trying to kill him. [https://youtu.be/MFLnSfrDD4w?t=409\
      \ Killed] Undyne the Undying after a long fight), Likely Small Town Level with\
      \ Immense Determination (At the end of the Neutral Route, Frisk is able to cross\
      \ the Barrier despite not having a monster SOUL, despite it normally requiring\
      \ the [https://youtu.be/BnJ1LBP-7r4?si=G2fauUKf7Qfk0J-w&t=19518 power of a human\
      \ and monster SOUL to cross]. This indicates being at the power level of a monster\
      \ and human SOUL, which should be comparable to [https://vsbattles.fandom.com/wiki/Asriel_Dreemurr_(Flowey)#Chara's_SOUL_Absorbed:~:text=At%20least%20Small,with%20SOUL%20Magic\
      \ Asriel with Chara's SOUL absorbed]. Though the exact means by which Frisk\
      \ crossed the Barrier are ambiguous, it would likely put them at the full power\
      \ of a human SOUL), at least Low Complex Multiverse level with Peak Determination\
      \ (Should be the same as Chara in their Absolute, [https://imgur.com/a/1CBak7k\
      \ due to them having reached this level of power] thanks to the Player's Determination,\
      \ (Should be much faster than the likes of Asgore, due to being likely being\
      \ comparable to [https://vsbattles.fandom.com/wiki/Asriel_Dreemurr_(Flowey)#Chara's_SOUL_Absorbed:~:text=At%20least%20Small,with%20SOUL%20Magic\
