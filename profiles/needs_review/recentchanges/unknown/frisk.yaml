  text: 'Border|||Content= *Superhuman Physical Characteristics *Accelerated Development
    (Leveling; Physical Statistics; Frisk becomes stronger each time they kill someone.
    Would become strong enough to one shot Toriel, something not normally possible)
    *Information Analysis (By using CHECK. Can figure out the stats of an opponent
    and even their emotional state in some cases just by looking at them) *Automatic
