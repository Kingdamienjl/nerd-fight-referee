  section: equipment
  axis: equipment
  text: '* Web-Shooters: Two wrist-mounted devices worn by Peter, enabling him to
    shoot out his own homemade webbing.The Amazing Spider-Man Spider-Man uses his
    Web-Shooters for transportation, rescuing others, and combating opponents in a
    variety of ways. To prepare for a second confrontation with Electro, who previously
    fried one of the devices, Peter had his Web-Shooters magnetized as per Gwen Stacy''s
    recommendation, which yielded the intended results.The Amazing Spider-Man 2 *
    First Spider-Man Suit: The first legitimate costume worn by Peter for the initial
    purpose of anonymously hunting down Uncle Ben''s killer, and later, acting a superhero.The
    Amazing Spider-Man * Second Spider-Man Suit: The second suit worn by Peter for
    operating as Spider-Man. This suit is said to be rubberized, granting him protection
    against electrical attacks, such as the ones used against him by Electro, albeit
    to a very limited degree as the supervillain still burned through the suit multiple
    times.The Amazing Spider-Man 2'
