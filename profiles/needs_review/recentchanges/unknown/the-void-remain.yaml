    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Longevity (Void has existed for
        eons), Reincarnation (One of Void''s main abilities is he being capable of
        reincarnating himself into a new existence, which have an infinite number
        of possibilities encompassing them), Energy Manipulation and Projecion (Void
        is capable of releasing multiple energy beam attacks out of him and is also
        able to create a Master Crown-like Crown which is able to fire out several
        lasers out of it), Creation (Is able to create a Master Crown-like Crown which
        he uses to attack his enemies), Portal Creation (Was able to create a portal
        to an alternative dimension where his fight takes place), Large Size (Type
        0: His first form is almost 4 meters tall, and his Angel Form suprasses it),
        Shockwave Creation (Most of Void Termina''s attacks results in him creating
        massive shockwaves around the Arena), Natural Weaponry (Is capable of casually
        use his own body as a weapon), Body Control (Is capable of casually shapeshift
        his body in various ways around), Shapeshifting (Shown to be capable of shapeshift
        his own body into spikes), Duplication (Is able to create many copies of himself
        to attack the target in various directions), Durability Negation (Some of
        his attacks are able to bypass guards and forcefields as well), Flight (In
        his Angel Form, he gains wings which allows him to fly around the battlefield
        and is also able to naturally float around as well), Weapon Creation and Weapon
        Mastery (Is capable of creating two enourmous swords which he is able to use
        masterfully), Glyph Creation (Is able to create glyphs as seen here), Ice
        Manipulation (Is capable of manipulating his sword to become the element of
        ice, which he uses to create many ice attacks), Incorporeality (The true Void
        exists naturally as a soul), Absorption (Void is capable of naturally absorb
        both positive and negative energy, which will decided wherever he will be
        born as an Evil or Good reincarnation), Black Hole Creation (Some of his smaller
        copies are able to create small black holes which suck anything into them),
        Danmaku (Is able to launch many energy blastes out of his eye), Attack Reflection
        (Is able to create mirrors which are able to reflect his own attacks), Minor
        Transmutation (Is able to change off the shape of his sword depending on the
        element he''s using), Air Manipulation (Created a massive air vortex that
        sucked Kirby and co. into his body), Fire Manipulation (Is capable of using
        his sword now amped by the Fire Element which he uses to create many attacks
        made out of fire), Water Manipulation (Is able to manipulate the liquid that''s
        inside his body), Electricity Manipulation (Is able to fire out an electric
        blast out of his eye which is also able to eletricate the water within there.
        Can transform his swords into the Electric Element which he uses to create
        several electric attacks out of it), Self-Sustenance (Types 1, 2 and 3), Immortality
        (Types 1, 3 and 4), Transformation (Is able to switch between his normal and
        Dark Matter-like form at any will), Light Manipulation (Is able of illuminate
        the background with several types of colors), Non-Physical Interaction, Statistics
        Amplification and Power Bestowal (The Jamba Hearts permanently made the likes
        of Meta Knight have far greater strength than before alongside giving him
        new powers as well), Dimensional Travel (The Jamba Hearts arrived into Kirby''s
        universe by traveling through Another Dimension from a separate universe),
        Weather Manipulation (The Jamba Hearts were able to create a storm over Dedede''s
        castle), Intangibility (The Jamba Hearts are capable of entering through one''s
        body in order to better influence them), Smoke Manipulation, Inorganic Physiology
        (Type 1), BFR (Once a Jamba Hearts attach into a target, they send their spirits
        into Another Dimension), Corruption, Mind Manipulation, Empathic Manipulation
        and Morality Manipulation (With Omnidirectional waves, Void is capable of
        forcefully corrupt and control the likes of the Star Allies to them be his
        allies and assist him mid-battle. Looking at the Jamba Hearts makes them capable
        of controlling the person which are looking at them, which includes the likes
        of King Dedede, the Jamba Hearts have also repeatedly influenced several others
        in many planets, said effects were also described as brainwashing), Chaos
        Manipulation, Darkness Manipulation, Dream Manipulation and Soul Manipulation
        (Void was hinted to be the ancestor and original essence of these), Telekinesis
        (Permanently gave Meta Knight telekinetic powers), Regeneration (Mid-High:
        As the ancestor of Dark Matter, he should have regeneration comparable to
        them, which means that he is able to completely regenerate after having all
        of it''s body scattered with said body being made of a cloud-like object.
        Mid-Godly overtime: Even after being killed, Void is able to regenerate himself
        after a while into a new existence, even if his soul is completely gone)'
