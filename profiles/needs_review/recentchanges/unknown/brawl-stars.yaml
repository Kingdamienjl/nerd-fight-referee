        bomb sends Colt into Metropolis - 0.6 tons of TNT (Building level) * Melodie''s
        regular body withstanding her galaxy-sized head - 1.3243504e+56 kg (Universal)
        * Tara throwing a gravity well/black hole - 6.2098044e+26 - 9.9073537e+35
        Newtons (Class Y - Multi-Stellar) * Colette pushing the Boss Robot super fast
        and 11 meters away - 42580602958195560 Metric tons of force (Class E) * El
        Primo lifting the Boss Robot - 559292.780189 Kilogram-force (Class K) * Melodie''s
        Size Manipulation speed - 104bil c (Massively FTL+) * Kenji slices the Sun
        - 122c (Massively FTL) * Buzz Lightyear dodges Bibi''s swings - 1.22c (FTL)
        * Colette Super dashing speed - 0.88c (Relativistic+) * Brawler dashing spe'
