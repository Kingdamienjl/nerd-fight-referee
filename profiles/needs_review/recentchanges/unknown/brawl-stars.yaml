    - field: powers_and_abilities
      value: 'Crossovers with other verses are not canon due to them also ignoring
        canon. The Godzilla event has Colt play Brawl Stars, even though Brawlers
        should not be able to acknowledge their existence and play themselves on phone
        screens while sitting in a train, since Brawlers being canonically controlled
        themselves by children on phone screens. The SpongeBob event also has Brawlers
        permanently turning into SpongeBob characters. However, the events that occurred''s
        in-game abilities and game modes have no reason to be non-canon. But they
        have to be specified to be included in debates due to Mutations and SpongeBob
        Power-Ups being only temporary abilities and not standard for Brawlers to
        have. Squad Busters also contradicts lore by making Brawlers have their powers
        as children, which we know is not when Brawlers got their powers, and they
        only ever got their powers within a specific point in time in the 90s as adults
        for many Brawlers. Before then, human Brawlers were normal people. Scaling
        to the Clash series, Clash-a-Rama also cannot be used due to Clash-a-Rama
        being specifically stated to be non-canon to the Clash universe. * 8-Bit Project
        Laser Minigame: The minigame explicitly takes place within 8-Bit''s mind due
        to the start-up screen saying the game is merely a memory. Said memory is
        the game, which is nonsensical and involves 8-Bit fighting random strange
        enemies, which is due to being a hallucination from 8-Bit. The start-up screen
        also recalls the memory as to exist for 8-Bit to remember who he is, which
        is a reference to an official animation also related to the lore, in which
        Colt watches a fictional animation in-universe about him, which Colt says,
        "is that... who I am?". This blatantly not-real animation is used to remind
        Colt of what he as a character was meant to be like when he was designed by
        Starr Corporation, and so this is also what the 8-Bit Project Laser minigame''s
        whole sequence of events is also meant to be. This is confirmed when the 8-Bit
        Minigame is confirmed to be a game on an arcade cabinet. * Existence of Magic:
        Joakim, a game developer from the Brawl Stars team, has confirmed that magic
        does not exist in the Brawl Stars universe, meaning seemingly magical Brawlers
        such as Tara and Gene don''t actually possess magic, and statements of "magical
        or magic" abilities are mere descriptions of how some attacks appear to be,
        but aren''t actually magic in nature. This is backed up by the art director
        of the game echoing the same statement about magic. * Supercell Scaling: According
        to an ex-community manager, Darian, despite various crossovers (which are
        cross promotions) occurring, each Supercell IP is a separate universe, which
        was in response to Wizard and Barley being in the same animation. What this
        means is that every crossover isn''t meant to be canon, and are just simply
        cross promotions. Squad Busters is a unique case, however, Brawlers getting
        their powers as children directly contradicts the timeline to the lore of
        Brawl Stars. Additionally, "Worlds" in Squad Busters are simply sections of
        existing worlds, such as a World for the Jungle Arena alone, or various other
        arenas from Clash Royale, suggesting that the worlds of other Supercell IPs
        are interconnected in Squad Busters, contradicting the statement that they''re
        separate universes. This is confirmed when the Squad Busters social media
        accounts confirm that the Mortis in Squad Busters is a separate Mortis from
        mainline canon. * Records: It''s confirmed that Records are canon, since they
        are uncovered hidden employee records for Starr Park. ==Calculations ((mostly)
        by G-Toasty)== * Melodie''s Size Manipulation GBE - 2.232e+29 TenaexaFoe (Universe
