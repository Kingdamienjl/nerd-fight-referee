    - field: weaknesses
      value: 'Can only use Puck from 9 AM to 5 PM Notable Attacks/Techniques: *Spirit
        Arts: Emilia is capable of using this with Puck and her other spirits. Emilia
        and Puck can smoothly alternate between roles of offense and defense leading
        to devastating results. These include changing the atmosphere in the sky to
        rain down multitudes of ice spears, forming ice clones that are capable of
        attacking and using magic, instantly conjuring giant freezing blade discs,
        mist barriers that hide her presence, and ice shields. On top of that, Emilia
        is contracted to several Quasi Spirits; she can use them for various applications
        such as healing. Some of Puck''s contract conditions are: **He will be active
        only from 9 am to 5 pm **Do not ask about his relationship with Beatrice **Do
        not look into a mirror or go near a large body of water **Do not hide the
        fact that you are a half-elf **He will choose your hairstyle every morning
        **Groom his fur regularly **Do some exercises when you wake up and before
        going to bed. ** Do not be picky about food **Talk with lesser spirits every
        morning and evening *Absolute Zero: Over 100 years ago, when Emilia was 7,
        she froze the entirety of Elior Forest and all the inhabitants. Because of
        that her home, Elior Forest, became a world of absolute zero which freezes
        all, freezing every living creature, the freezing also continues to spread
        even in the present day. She froze everything including herself, if Puck hadn''t
        freed her from the ice she would have been frozen until the forest''s mana
        had run out, which would have probably taken at least hundreds of years. Those
        frozen have their consciousness put to sleep while their bodies still mature
        inside the ice if Emilia wasn''t an elf she would have already been dead from
        aging while in the ice. Freezing on such a massive scale like that is outside
        the range of Emilia''s power; however, Absolute Zero is an ability Emilia
        can use before regaining her powers with Puck as her trump card, which, if
        used will only leave her standing as the entire area will get frozen at absolute
        zero. She can''t replicate her Elior Forest freezing feat after regaining
        her powers, nor has she been shown to use Absolute Zero. In Arc 6, however,
        Emilia has shown to have mastered this technique, up to the extent that it
        became her strongest skill, being able to easily nullifying the Purification
        Breath attack from Volcanica. This ability has been shown to freeze everything
        it catches within its diameter, up to the extent that it freeze time itself,
        and being so strong that it was stated to be able to finish the battle in
        a single hit. *Ice Brand Arts: By using this technique Emilia can instantly
        create weapons made out of ice which she can use and freely manipulate in
        close-quarters combat. The weapons are very sturdy and can even withstanding
        heat-based attacks without melting. **Ice Brand Arts: Icicle Line: Emilia
        attacks her opponent by surrounding them with a barrier of ice particles which
        she then transforms into weapons like axes, swords, hammers, etc. **Ice Brand
        Arts: Ice Soldiers: Emilia can create soldiers who are completely made out
        of ice. These soldiers are exactly the same as actual humans and are clad
        in armor made of ice while wielding weapons made of ice. They follow every
        order given to them by Emilia. The soldiers'' strength depends from the mana
        density; the more mana Emilia uses the stronger the soldiers will be. The
        technique was developed by her and Subaru some time after the events of the
        4th arc hence, the soldiers take Subaru''s appearance. Currently, Emilia is
        able to create up to seven proper Ice Soldiers and no less than ten soldiers
        with only their torsos, heads and arms. When destroyed, these soldiers can
        regenerate back to their full health as long as Emilia has the strength to
        do so. *Ice Flower: Emilia creates flowers made of ice on wounds of living
        beings within a certain area that suck the host''s life force and bloom by
        sucking the host''s blood. She has not used this ability ever since she forged
        her contact with Puck.'
