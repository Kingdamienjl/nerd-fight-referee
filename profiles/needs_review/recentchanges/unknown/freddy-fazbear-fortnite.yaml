  attack_potency:
    text: Small Building level+ (Can hurt Loopers) | Small Building level+ physically
      and with weaker weapons (Can destroy Metal walls in many shots), Up to Building
      level with regular weapons (Heavy Snipers can one shot Metal walls and other
      Loopers with Headshots, Rail Guns can destroy two metal structures in a single
      hit), Large Building level with Explosives (Explosives can destroy multiple
      Metal walls in a single shot), City Block level with Various other weapons (The
      Infinity Blade can replicate feats performed by Thanos, Symbiotes can break
      through dozens of Metal Structures in a single attack, the Boom Box can achieve
      this level of Environmental Destruction), some attacks Ignore Durability (Stink
      Bombs, Storm Flips, Fire Attacks, and more can directly harm other Loopers and
      ignore Shield)
    source_ids:
    - vsbattles-freddy-fazbear-fortnite-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Average Human travel speed, Supersonic+ attack and reaction speed (Comparable
