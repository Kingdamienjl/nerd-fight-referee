      Wolverine's claws and some various fishes. Supersonic+ attack and reaction speed
      (Has access and can react to various firearms. Can build walls in the time it
      takes bullets from Sniper Rifles to reach them)
    source_ids:
    - vsbattles-freddy-fazbear-fortnite-unknown
    confidence: 0.6
    notes: auto_repair source extraction
