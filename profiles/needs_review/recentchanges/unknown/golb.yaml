- id: claim-powers-and-abilities-3eeddd8b
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Immortality (Type 1; Implied to have
    existed before the universe, time and nothingness, with the Lich stating himself
    to be the Last Scholar of GOLB and stated to have "studied his ways, devoting
    his existence to GOLB". Type 5; Primordial Monsters existed long before the concepts
    of life and death as well as existence itself. Type 8; and GOLB is also the great
    embodiment of Chaos and Discord) **Large Size (Type 2; Is much larger than The
    Cake in comparison) **Regeneration (Low; Regenerated a small hole caused by harmony
    through his stomach) **Self-Sustenance (All Types; Was seen outside of the planet
    Mars in the Promo art, implying that it took place when GOLB first attacked Mars
    and took Margles away. Has existed before the universe, time and nothingness even
    existed) **Abstract Existence (Type 1; Simon stated that GOLB "embodies chaos"
    and "his presence is felt in every crevice where chaos lurks" which implies that
    GOLB is more abstract than physical, Princess Bubblegum said that "GOLB is Discord.
    It''s the harmony! Harmony hurts them!", GOLBetty was stated by Extinct World
    Lich to be "great embodiment of chaos") **Beyond-Dimensional Existence (Type 1;
    Primordial Monsters exist beyond the plane of mortal existence by existing in
    the void) *Acausality (Type 1 & 4; Existed before time and nothingness, and shouldn''t
    be affected by changes in the past when he predates time itself, or any effect
    of time at all. Due to living beyond anything and nothing, primordial beings should
    operate on a different and irregular system of cause and effect than regular causality)
    *Portal Creation & Dimensional Travel (Made a portal to Ooo) *Flight (Hovered
    above the ground throughout the final battle of Ooo) *Energy Manipulation & Magic
    (Simon speculated people could harness "all that dank energy" from GOLB, Betty
    was trying to harness GOLB''s power due to being the most powerful force in the
    universe) *Possibly Void Manipulation (Seemingly turned Pillow World into a Void)
    *Death Manipulation *Reality Warping *Existence Erasure, Aura & Spatial Manipulation
    (Prismo was unable to bring Margles back after Magic Man attempted to wish her
    back,Adventure Time, Season 6 Episode 38: You Forgot Your Floaties with Magic
    Man putting that "she was gone, erased" to the point where he was unable to find
    her after searching through every dimension and Dead World, existing in only memories
    and feelings, implying that other versions of Margles have been "erased" too.
    While merging with Betty, he created an Aura and erased the monsters he transformed)
    *Breath Attack, Biological Manipulation & Transmutation (Has a monster breath
    that fused an entire army into a Demon, which would continue to absorb more and
    more creatures into its biomass, and capable of regenerating from being smashed
    into multiple pieces. Was able to turn the inorganic Gumball Guardians into flesh)
    *Pocket Reality Manipulation (Has an inescapable pocket dimension inside of his
    stomach that he uses to shrink down and crush anything inside, with Simon stating
    that "It''s hopeless. You can''t punch your way out of his guts") **Absorption
    & Nullification of Magic & Concept (Type 1)/Reality Warping ("Digested" the magical
    properties of Betty Grof and Ice King''s Crown to their base forms, while also
    causing Fionna World to be no longer magical inside of Simon''s brain) **Age Manipulation,
    Fate Manipulation, Memory Manipulation & Matter Manipulation (GOLB digesting Ice
    King and Magic Woman reverted them through the different stages of their lives
    before turning them back to their human selves, which Betty puts as "breaking
    us apart, layer by layer, down to our essential forms," implying that their atoms
    themselves were being destroyed before returning to their original state) **Fusionism
    (Capable of merging with other beings with sufficiently strong wish magic) *Passive
    Chaos Manipulation & Weather Manipulation (Upon his arrival in Ooo, irregularities
    began due to his presence, and the weather became a massive storm until he left)
    *Cloth Manipulation (While merging with Betty, he formed a rope-like thing to
    wrap around his head) *Multiple Selves (Type 1; Merged with Betty Grof) **All
    Betty Grof''s abilities and powers (Since he is merged with Betty, he should have
    all the powers that she has) *Large Size (Type 3; Much more larger than before)
    *Telekinesis (Lifted Extinct World Lich off of the ground) *Sealing & Transmutation
    (1 layer; After Extinct World Lich lashed out at GOLBetty, he transmuted his skeleton
    body into a cubic pyramid and sealed his head inside of it, as the Lich wasn''t
    turned into a candy person after being within the Candy Kingdom Post-Elemental
    Bubblegum for an unknown, but long, period of time,Adventure Time, Season 2 Episode
    25: Mortal Folly and also implies that the other cubic pyramids surrounding GOLB/GOLBetty
    were other beings that met the same fate as Extinct World Lich and GOLBetty also
    caused pain to the Lich, who did not'
