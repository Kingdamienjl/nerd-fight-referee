- id: claim-powers-and-abilities-1119a10c
  section: abilities
  axis: hax
  text: "*Superhuman Speed *Non-Physical Interaction (Can land on and affect souls\
    \ such as Soul Forgo) *Small Size (Type 2; That of a butterfly) *Self-Sustenance\
    \ (Type 1; One appeared in the Divine Terminus, which is opened to outer space,\
    \ other than having gravity. And it came flying from off-screen, having reached\
    \ the Jambandra space satellite where it is located. Came flying from Another\
    \ Dimension, which is mostly made up of outer space like the regular universe)\
    \ *Flight (Flies around the air as a butterfly. One reached the Jambandra space\
    \ satellite by flying into it from an unknown starting point in Another Dimension,\
    \ appearing flying in from off-screen rather than teleporting or using a portal.\
    \ Another Dimension is mostly made up of outer space like the regular universe)\
    \ **Dimensional Travel (Will come flying down from Another Dimension into Kirby's\
    \ universe \"on the day of judgment\". Can travel to dimensions portrayed as a\
    \ world of Dreams or an underworld. As Morpho Knight EX, he flew into Kirby's\
    \ universe from Another Dimension, having flown from Kirby's universe to Another\
    \ Dimension after his defeat as base Morpho Knight) **Likely Immersion (One came\
    \ to Fecto Dreams [See Fecto Forgo's feats in their profile for more information\
    \ about the place]/drifted towards Forgo Dreams as if summoned. While there was\
    \ a portal for characters to enter at will, another butterfly was previously implied\
    \ to travel across dimensions to maybe arrive at a \"world of dreams\"; Holds\
    \ \"Dream Eater\" in one of its titlesMorpho Knight's Jpn. title card \xB7 Kirby\
    \ and the Forgotten Land & Kirby and the Forgotten Land \u2013 Nintendo Switch\
    \ 2 Edition + Star-Crossed World) *Enhanced Senses & Extrasensory Perception (One\
    \ was \"drawn by the cries of death and the scent of battle\" on the Divine Terminus,\
    \ those being Galacta Knight's cries after \"endless years\" of being \"ceaselessly\
    \ engaged in eternal battle\", sympathizing with him. This is despite Galacta\
    \ Knight being silent and appearing stoic, that butterfly interrupted his incoming\
    \ battle against the Star Allies. Another butterfly drifted towards Forgo Dreams\
    \ \"as if summoned\", appearing just in time to interrupt Soul Forgo's battle\
    \ against Kirby. These butterflies have some unknown role to judge those who perish\
    \ or would perish during \"decisive battles\", exemplified with Galacta Knight\
    \ and Soul Forgo. As such, they must display similar senses on a regular basis)\
    \ *Transmutation, Absorption & Fusionism (Can turn targets into energy on contact\
    \ and absorb them to fuse with them. Stated that the process can be said to be\
    \ absorption of a target's power or a mutation of the targetHowever, this was\
    \ said back when only Galacta Knight was shown to be absorbed, with Morpho Knight\
    \ and Galacta Knight being similar in appearance. A future game shows another\
    \ butterfly absorbing Fecto Soul to turn into the same Morpho Knight form, when\
    \ he doesn't look like Fecto Soul at all. As such, the idea of a mutation might\
    \ have been discarded. The fusion appears as one where the butterfly is in control,\
    \ putting similar moves regardless of who is absorbed. (Although, that is not\
    \ to say his intelligence isn't necessarily boosted by those absorbed.). Described\
    \ as feeding upon a target. These butterflies have some unknown role to judge\
    \ those who perish or would perish, exemplified with these powers being used on\
    \ Galacta Knight and Forgo Soul, meaning that they regularly do this in their\
    \ roles) **Soul Manipulation (One butterfly did the latter to Soul Forgo. Although\
    \ the soul was basically trapped within Morpho Knight's body rather than destroyed,\
    \ allowing Soul Forgo to escape when said body was destroyedSpecifically, Soul\
    \ Forgo resisted being assimilated into Morpho Knight's being. Unlike Soul Forgo,\
    \ when Galacta Knight-absorbed Morpho Knight got destroyed, Galacta Knight's soul\
    \ wasn't inside. This is perhaps unsurprising, considering Fecto Forgo had better\
    \ control over their soul, being able to exist and act as one, and ready to fight\
    \ off Kirby in that state.. Soul Forgo was trapped regardless of being able to\
    \ leave or teleport out of Leongar's possessed body. Escaping presumably meant\
    \ that this Morpho Knight couldn't develop his EX form, his threat being over\
    \ in a single defeat) **Transformation (Absorbing those it turns into energy turns\
    \ a butterfly into a Kirby-looking knight called Morpho Knight. Has been portrayed\
    \ as getting amplified daily by the power received this way until finally making\
    \ it completely his own, when he kept assimilated what he absorbed) As before,\
    \ *Superhuman Physical Characteristics *Small Size (Slightly bigger than Kirby,\
    \ who is 20 cm tall) *Teleportation (Teleports mid-combat) *Weapon Mastery (Is\
    \ quick & efficient with his sword, as well as being able to dual wield and fight\
    \ with two swords at once) *Energy Manipulation and Projection (Has a number of\
    \ energy attacks) *Fire Manipulation (Has a number of fire attacks, regularly\
    \ using this attribute in his sword) **Likely Durability Negation (The Star All"
