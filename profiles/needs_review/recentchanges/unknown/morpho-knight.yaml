      value: "None notable Feats: *Descriptions: **Morpho Knight and Morpho Knight\
        \ EX's pause descriptions \xB7 Kirby Star Allies **KIRBY STAR ALLIES THE ORIGINAL\
        \ ART BOOK pages 168 & 169 **Jpn. figurine in Kirby and the Forgotten Land\
        \ **Kirby JP Twitter post of Dec 9, 2022 Notable Attacks/Techniques: Butterfly\
        \ absorbs Galacta Knight \xB7 Kirby Star Allies.gif|A butterfly absorbs Galacta\
        \ Knight \xB7 Kirby Star Allies Fluttering Foe on an Isolated Isle cutscene\
        \ last part \xB7 Kirby and the Forgotten Land.gif|A butterfly absorbs Soul\
        \ Forgo \xB7 Kirby and the Forgotten Land & its Nintendo Switch 2 Edition\
        \ *Transmutation, Absorption, and Fusionism: The butterfly lands on a targets\
        \ and turns them into energy, which it then absorbs. If the target absorbed\
        \ was strong enough, the butterfly will turn into its Morpho Knight form.\
        \ The target and the butterfly are said to fuse, the process can be said to\
        \ be absorption of a target's power or a mutation of the target. These butterflies\
        \ have some unknown role to judge those who perish or would perish, exemplified\
        \ with these powers being used on Galacta Knight and Forgo Soul, meaning that\
        \ they regularly do this in their roles. Described as feeding upon a soul\
        \ once, the butterflies may consume others for substance. Likewise, while\
        \ the butterflies never display being able to consume targets in their Morpho\
        \ Knight forms, they should still be able to do so, if it is out-of-character\
        \ to do so in battle. **Soul Manipulation: One butterfly did this to Soul\
        \ Forgo. Although the soul was basically trapped within Morpho Knight's body\
        \ rather than destroyed/assimilated, allowing Soul Forgo to escape when said\
        \ body was destroyed. Soul Forgo was trapped regardless of being able to leave\
        \ or teleport out of Leongar's possessed body. Escaping presumably meant that\
        \ this Morpho Knight couldn't develop his EX form, Morpho Knight's threat\
        \ being over in a single defeat. **Transformation: If the target absorbed\
        \ was strong enough, the butterfly will turn into a Kirby-looking knight called\
        \ Morpho Knight. One Morpho Knight has been portrayed as getting amplified\
        \ daily by the power received this way until finally making it completely\
        \ his own, when he kept assimilated the target he absorbed (Galacta Knight).\
        \ This suggests the butterflies don't 100% own the power from the targets\
        \ they absorb at first, needing some time to make it their own. It's also\
        \ possible that Galacta Knight's power was too great to fully handle at first,\
        \ but this will not be assumed. *\"Hyper Rush\" (\u30CF\u30A4\u30D1\u30FC\u30E9\
        \u30C3\u30B7\u30E5\u30D5\u30A1\u30DF\u901A\u300C\u661F\u306E\u30AB\u30FC\u30D3\
        \u30A3 \u30B9\u30BF\u30FC\u30A2\u30E9\u30A4\u30BA \u304B\u3093\u307A\u304D\
