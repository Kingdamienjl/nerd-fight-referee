      value: "At least High Universe Level (Was able to fight with Kirby, whose power\
        \ has been regarded as infinite by several sources. First of all, the pause\
        \ menu of Kirby Planet Robobot says that Kirby has infinite power, and this\
        \ isn't a mistranslation at all, because the japanese version uses the term\
        \ mugen [\u3080\u3052\u3093], which means infinite. In an interview with Shinya\
        \ Kumazaki, the director of Kirby Planet Robobot, there is a part where he\
        \ mentions that Kirby has infinite power, further supporting the pause menu\
        \ statement. Finally, Star Dream says that Kirby has nearly infinite power\
        \ in the American version of its third pause description; however, the japanese\
        \ version, which is more reliable, doesn't mention the nearly, but said that\
        \ Kirby has Mugen no paw\u0101 [\u30E0\u30B2\u30F3\u306E\u30D1\u30EF], which\
        \ means infinite power, and Star Dream itself says that it can do much against\
        \ Kirby. Morpho Knight can also fight and is supposed to be stronger than\
        \ Meta Knight, whose galaxia holds infinite power according to the pause menu\
        \ of the Meta Knightmere Ultra mini game in Kirby Super Star Ultra; the pause\
        \ menu says this: \u5263\u306B\u3084\u3069\u308B\u306F \u3080\u3052\u3093\u306E\
