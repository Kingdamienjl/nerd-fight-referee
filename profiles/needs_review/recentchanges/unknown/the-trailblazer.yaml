- id: claim-powers-and-abilities-32490a3e
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Multiple Selves (Type 1; Stellaron\
    \ is a type of sentient lifeform that responds to the will of it's host to grant\
    \ a wish based on location and circumstance in desire to advance that world's\
    \ civilization. It has a special property that can tether someone to a specific\
    \ Aeon's power and path, this is the sole reason why the Trailblazer can walk\
    \ on the Path of Remembrance through MemCaptives, Behold the Expanse Beyond Light)\
    \ *Extrasensory Perception & Enhanced Senses (Enhanced Sight) **(Neutral Vision\
    \ & Soul Vision; Can see soulsSpecies of the Galaxy: WubbabooThe Stars Are Cold\
    \ ToysGhost of the Past) *Non-Physical Interaction **(Spiritual, Mental & Information\u3010\
    Type 2\u3011; Can interact with souls) **(Memory; Can interact with memoriesMemory\
    \ Bubble) **(Energy; Should be able to interact with a Stellaron which is composed\
    \ of pure energyData Bank Terms: Cancer of All Worlds (Phenomenon)) *Imaginary\
    \ Energy (Destruction, Harmony & Trailblaze) & Honkai Energy (Low-Level; Upon\
    \ being gazed at by Nanook, Trailblazer unlocked the Path of Destruction, and\
    \ Trailblaze due to walking on the Path of Trailblaze.The Voyage ContinuesData\
    \ Bank Factions: Astral Express \u2014 TrailblazeData Bank Factions: The Nameless\
    \ \u2014 Trailblaze Trailblazer also possess a living Stellaron inside their body,\
    \ which is a part of Imaginary Energy.Data Bank: Enemy Creatures - Cocolia, Mother\
    \ of Deception The Stellaron is directly stated to be high-energy radiation of\
    \ Imaginary Internal Energy,Anti-Entropy Visual Novel: Chapter 5, Part 2 with\
    \ Stellaron originating from the Path of Harmony,Omen in the Trees which allows\
    \ its users to manipulate Harmony Path Energy as they please like Cocolia) *Summoning\
    \ (Can summon their Bat to battle) *Expert Bat User *Statistics Amplification\
    \ (Can increase their health, attack, defense and critical stats) *Damage Boost\
    \ (Can boost their attack when using Stardust Ace) *Healing (Can heal themselves\
    \ and others for 15% of their respective maximum health with Immortal Third Strike)\
    \ *Passive Probability Manipulation (When one walks on a Path their various possibilities\
    \ collapses into a single entityLoading Screen - Eidolons) *Imaginary Energy &\
    \ Honkai Energy (Low-Level; Was able to withstand attacks from the Doomsday Beast\
    \ Disaster's Right Hand,Lingering Shadows which uses Imaginary Energy to attackData\
    \ Bank: Enemy Creatures - Disaster's Right Hand) *Ice Manipulation & Extreme Cold\
    \ (At least -270.45\xB0C, likely higher; The Trailblaze Path helps prevent being\
    \ frozen and reduces the sensation of cold produced by the Eternal Freeze,The\
    \ Dawn Here... which can freeze even the Antimatter Legion's troops.Roads to the\
    \ Past Have Long Been Closed These legions are capable of surviving in space with\
    \ no issues. The Trailblazer can also easily resist the temperature of the Shackling\
    \ Prison, which are near Absolute ZeroRogues on the RunUndestroyed Notes) *Curse\
    \ Manipulation, Corrosion Inducement & Madness Manipulation (Type 2; Upon being\
    \ gazed at by Nanook, the Trailblazer resisted defying their fate of being a child\
    \ of Destruction ever since then. Those who dare to betray their fate as children\
    \ of Destruction will be afflicted with the Weathering Curse, which will corrode\
    \ females' bodies away,Non-Existent State while males will be driven into madnessReadable:\
    \ Weathering Curse Record) *Extreme Heat (15,000,000\xB0C; Can resist the heat\
    \ from Blaze Out of Space which is as hot as the core of starsData Bank: Enemy\
    \ Creatures - Blaze Out of Space) *Antimatter Manipulation (Can resist the effects\
    \ from Reavers whose bodies are completely made out of antimatterData Bank: Enemy\
    \ Creatures - Voidranger: Reaver) *Life Manipulation (The Stellaron negated an\
    \ attempt to make the Trailblazer immortalSinners Misled, Credence Falsified)\
    \ *Information Manipulation (Type 1; After looking at Fuli, the Trailblazer was\
    \ able withstand being flooded by countless memories and information of all beings\
    \ in the universesSimulated Universe: Second Closed Beta of which there are an\
    \ infinite amount of them) *Biological Manipulation, Corrosion Inducement, Space-Time\
    \ Manipulation & Reality Warping (Can withstand several effects caused by the\
    \ FragmentumData Bank Terms: Fragmentum (Phenomenon)In the Dangerous Muddy SwampOnes\
    \ Fallen Into the AbyssAdventure Mission - Calyx (Golden): Bud of MemoriesAdventure\
    \ Mission - Stagnant ShadowCavern of Corrosion) *Status Effect Inducement (Which\
    \ in-game is represented as Burning, Freezing, Electric Shock, Sharp Winds, Quantum\
    \ Entanglement & Imaginary Imprisonment)"
