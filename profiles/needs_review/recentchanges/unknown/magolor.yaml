    - field: powers_and_abilities
      value: 'Powers & abilities Magolor is proven to have before obtaining the Master
        Crown., Magic: Being a wizard, most of his moves are magic-based. Magolor
        makes brief ritual-like gestures or immediately manifests magic circles with
        runes in them first to use some attacks. In Magolor Epilogue, Magolor loses
        not all his magic, therefore becoming unable to use most of his moves that
        are superpowers, minus his ability to fly for a limited time, a limited form
        of Magic Sphere in range & power, Team Attack, and his Absorption of magic.
        All the powers he recovers or newly gains there are stated to be magic., Toon
        Force: The Kirby series has "mysterious creatures that defy all reason, "
        which can display Toon Force-based powers, or powers that aren''t Toon Force
        & simply weren''t elaborated upon., Transmutation: [https://imgur.com/lxBvwmI
        Can turn a katana into a mini] Lor Starcutter. Note that we can tell that
        small ship is his transformed katana because he now lack its grip, [https://imgur.com/a/QQUBrZ7
        and Samurai Kirby is a game where characters transform their katanas at will].
        Granted, at this point it could be argued that this isn''t Toon Force and
        the characters are able to turn things into other things perfectly logically
        in-universe., Teleportation: [https://imgur.com/a/LL1IePd Magolor can instantly
        teleport across Planet Popstar]. He does this to save Kirby & co. from falling
        into pits, being as fast & reliable as if he was programmed. He disappears
        from his ship & appears where he''s needed with a magic circles with runes
        in them in both places. Magolor teleports back with the same movements he
        uses to do Dimensional Vanish, a move he would later show to have. It''s unclear
        if he had and was using that move before gaining the Master Crown., Enhanced
        Senses (Pre-Master Crown version): Said Teleportation is possible due to Magolor
        somehow knowing when & where to teleport in to save Kirby & co. while he is
        busy working in his ship. His ship does have screens with views on Popstar,
        but how much it shows of the planet portrayed as limited and it isn''t stated
        that Magolor oversees everything Kirby & co. do during their quest. It''s
        also possible that the Enhanced Senses characters like Magolor show later
        in the series is accessible for them since earlier than reasonably assumed.,
        Dimensional Travel & Time Travel: [https://imgur.com/WFl47Pd That same Teleportation
        can be used in the "inter-dimensional rifts areas" of Return to Dream Land
        Deluxe], when each of those areas happen in a different dimension inside Another
        Dimension, as well as in the future of that game after Magolor''s defeat,
        which caused the collapse of those dimensions and the Dimensional Walls seen
        there. Magolor also went from the Dream Kingdom to the dimension where the
        main Halcandra is by unknown means (Dimensional Travel only), which happened
        before he owned the Lor Starcutter, so one could assume he simply teleported
        out of there, traveled around Another Dimension''s Road'
      source_id: mediawiki-91529
      provider_id: vsbattles
      authority: high
      confidence: 0.75
