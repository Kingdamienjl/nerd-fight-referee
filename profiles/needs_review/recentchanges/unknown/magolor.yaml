- id: claim-intelligence-f08007a5
  section: power_scale
  axis: battle_iq
  text: Genius (A genius engineer, as well as an educated magicial, competent combatant,
    skilled liar, knowledgeable in the multiverse & ancient history, and with ambitions
    to conquer the universe) See here. Mixes magic with his technological achievements,
    invalidating an unknown amount of the engineering skills he would need to apply.
    Repeatedly repaired a futuristic sci-fi vehicle. Repeatedly created pocket realms
    of various sizes within small structures, and made a couple of theme park with
    those gimmicks. Potentially built a number of stat-increasing items, many of them
    having absurd powers. Built Merry Magoland, which serves as "the best theme park
    in the whole universe," being able to receive beings from all over the universe
    and even other realities, housing and entertaining them in an apparently impossible
    manner, given their diverse body structures. See here. Known as a deceiver and
    a trickster by the narrative, Magolor is a very smooth talker who is talented
    at using others to achieve his goals. That said, while skilled, he is not a genius
    in that specific regard. Magolor wants to conquer the universe, a goal he can
    succeed in doing if given the chance; The sheer amount of beings and the differences
    between them in the main Kirby universe are those of a vast sci-fi setting, necessitating
    Magolor to be an immensely capable individual to be their overlord. Although his
    activities as a ruler would have been unknown. He knew about Kirby from the beginning,
    knows about Kirby's universe, Another Dimenion (a complex series of many realities),
    has traveled to many realities, and knows about the ancients. Runned a Shoppe
    in a medieval setting, making it "number one in the whole Dream Kingdom" on a
    short amount of time. Skilled magician, with some unclear knowledge over his own
    magical capabilities and the supernatural. See here. A crafty combatant by himself,
    Magolor holds a great combat performance against the most capable warriors of
    the series, whose characteristics range from impressive to legendary.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
