    - field: weaknesses
      value: '* Magic: Despite being a powerful sorceress herself, Morgana still proved
        susceptible to the effects of magic, seeing as how both Merlin and Douxie
        were able to magically imprison her. This is inclusive of mystical artifacts
        and weaponry, such as Excalibur. * Magical Depletion: While Morgana could
        siphon magic from outside sources to increase her magical powers, overuse
        could deplete them significantly; as with other magic users, the only way
        to restore her waning powers is an extended period of rest. When she absorbed
        Merlin''s magic from his staff, she was likely able to sustain her magic without
        fear of her power depleting (until her ultimate defeat at the hands of the
        Trollhunters). * Amber: While imprisoned deep within the Heartstone, Morgana
        was unable to use her magic to break free from her own amber prison. Therefore,
        she required someone outside of her prison to use the Staff of Avalon and
        create a crack in the amber enough to free herself. * Onyx Shards: Morgana''s
        magic could not completely protect her from the Onyx Shards wielded by her
        fallen brother, Arthur, as one broke through her defenses and dealt her a
        deadly wound to her left abdomen. As confirmed by Aaron Waltke, Morgana was
        slowly dying after being hit by the shard (and using up the last of her magics
        to strip Arthur of his right to wield Excalibur). Similar to what happened
        with Merlin after being punctured by the bewitched sword, she would''ve vaporized
        into soot as well, until the falling piece of Camelot finished her off sooner,
        transferring her soul into the Light Realm. * Hubris: Despite her more-or-less
        good intentions, Morgana''s greatest flaw had been, in fact, her pride, viewing
        beings of magic (herself included) to be greater and more than the magic-fearing
        masses, especially her brother and to some extent, Merlin. In Morgana''s eyes,
        others feared the potential of the magical and would quash it whereas she
        did not fear magic in any shape or form, for from her point of view, magic
        was true strength. However, her pride grew to where she turned on her own
        allies, believing them all to be "traitors" when they tried to help her reconcile
        with her paranoid brother. After being gifted the title as the "Eldritch Queen"
        by the Arcane Order, Morgana allowed her own pride and hypocrisy to turn her
        into the very thing she claimed to despise: a tyrant (yet she saw the error
        of her ways when brought back from the Shadow Realm). == Others == Notable
        Victories: Notable Losses: Inconclusive Matches:'
