- id: claim-weaknesses-243e9bbb
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques *Infantilization: One of his trademark
    skills, it works by making contact with a person and altering their Od, effectively
    rejuvenating the target''s body and making them physically younger. Using this
    technique, most of his enemies are effectively rendered powerless against him,
    as they''re left in the body of a child. In addition, after being infantilized,
    the target''s deduction skills and overall intellectual capabilities slowly diminish
    over time, reflecting their sudden rejuvenation in both body and mind. ==Notable
    Matchups== Victories: Garou (One-Punch Man) Garou''s profile (Half-monster Garou
    was used, starting distance was 20m, speed was equalized, rest was SBA) Losses:
    Inconclusive: ==References== Category:Characters Category:Re:Zero kara Hajimeru
    Isekai Seikatsu Category:Male Characters Category:Light Novel Characters Category:Internet
    Characters Category:Ninjas Category:Aura Users Category:Enhanced Senses Users
    Category:Extrasensory Perception Users Category:Instinctive Action Users Category:Precognition
    Users Category:Statistics Amplification Users Category:Information Analysis Users
    Category:Body Control Users Category:Flight Users Category:Vibration Users Category:Regeneration
    Users Category:Underground Mobility Users Category:Explosion Users Category:Air
    Users Category:Attack Reflection Users Category:Damage Reduction Users Category:Space
    Users Category:Stealth Masters Category:Poison Users Category:Acrobats Category:Self-Destruction
    Users Category:Pressure Point Users Category:Martial Artists Category:Age Users
    Category:Soul Users Category:Mind Users Category:Adults'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-5a83e782
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics * Aura (Overwhelming; Fighting spirit\
    \ can cause those around to feel like their skin is on fire,Volume 15, Closing\
    \ Chapter and makes it feel as if the surroundings are shakingVolume 12, Chapter\
    \ 2) *Enhanced Senses (People of the other world have incredible eyesightArc 7,\
    \ Chapter 34) *Extrasensory Perception (Superior to Knights who can sense hostility,Volume\
    \ 9, Chapter 2 as well as sense the presence Volume 8, Chapter 2 of others. Can\
    \ keep track of othersArc 7, Chapter 41 even with his back turned to them, due\
    \ to his ability to read the breathing of othersArc 7, Chapter 42. Even untrained\
    \ civilians such as Subaru can detect the mana in the atmosphere and spikes of\
    \ magical energy Volume 3 Chapter 3: \"The Meaning of Courage\") *Instinctive\
    \ Action (More skilled than Al who can attack his opponents with pure instinctEx\
    \ Novel 5, Vermillion Sword Wolf) *Analytical Prediction (Superior to Emilia who\
    \ dodged a rain of arrows by reading the shooter's intentBond of Ice, Chapter\
    \ 1) *Statistics Amplification (Warriors use mana via the Flow Method to strengthen\
    \ themselvesArc 7, Chapter 98) *Regeneration (Low; Having excellent control over\
    \ the Flow Method greatly contributes to the recovery of wounds and physical strengthArc\
    \ 9, Chapter 23, \"The Gang's All Here\") *Information Analysis (By reading a\
    \ person's gaze, the way their face tenses up, the way their muscles contract,\
    \ he can tell exactly what someone is thinking) *Body Control (The basics of flow\
    \ method is for the user to have have complete control over their body.The Golden\
    \ Lion and the Sword Saint: Riot in Flanders Users of the Flow Method can release\
    \ heatVolume 12, Chapter 4 from their body, Arc 7 Chapter 100: \"A Myriad Of Changes\
    \ at the Bastions\" which can vaporize snow around them. Body control is the foundation\
    \ of the shinobi,Arc 7, Chapter 51 you can\u2019t be a shinobi unless you can\
    \ do different things with your right hand and left hand, and your right foot\
    \ and left foot at the same time) *Flight (Can fly through the air) *Vibration\
    \ Manipulation (By piercing the ground with his feet he can cause a shockwave\
    \ which erupts beneath his enemies' feetArc 7, Chapter 52) *Underground Mobility\
    \ (Can hide within the ground itself, and also easily travel through the ground\
    \ itself) *Explosion Manipulation (Olbart has bombs stuffed with fire magic stones)\
    \ *Air Manipulation (Can attack with blades of windArc 7, Chapter 53) *Attack\
    \ Reflection, and Damage Reduction (Can make his opponent's attacks pass through\
    \ him, turning the force of their own attacks back on them.Arc 7, Chapter 95 Can\
    \ redirect the damage from his opponents' attacks from himself to the ground)\
    \ *Stealth Mastery (2 layers; Can easily infiltrate an area without a hint of\
    \ his presence. Olbart's invisibility allow him to bypass the mass-targeting effectArc\
    \ 8, Chapter 58, \"Proof of Existence\" of the Curse of Thorns. Even the power\
    \ of the Divine protection of Ambushing,Arc 8, Chapter 39, \"Laughter of the One\
    \ Unbounded\" which can hide one from the sight of Palladio's Evil Eye,Arc 9,\
    \ Intermission, \"Katya Aur\xE9lie\" could not escape the Curse of Thorns)) *Poison\
    \ Manipulation (Can poison his opponentsArc 7, Chapter 100 by touching them) *Acrobatics\
    \ (Can skillfully maneuver his bodyArc 7, Chapter 105) *Self-Destruction (Shinobi\
    \ have techniques which makes them self-destruct upon death) *Pressure Points\
    \ (Can strike pressure points robbing his opponents of their freedom) *Martial\
    \ Arts (Olbart has honed his martial arts for as long as he can rememberArc 8,\
    \ Chapter 67) *Matter Manipulation (Olbart, with a light strike, can cause the\
    \ surface of a wall to ripple like water, allowing Olbart to stuff the bodies\
    \ of others inside the wall itself, after which the wall's surface fills back\
    \ in as if nothing happened) *Age Manipulation, Soul Manipulation, and Mind Manipulation\
    \ (By meddling with the Od of his target,Arc 7, Chapter 48 he can reduce them\
    \ back into a younger body. This reduces the target's deduction skills and overall\
    \ intellectual capabilities over time, reflecting their sudden rejuvenation in\
    \ both body and mind. The soul is the very root of one's self,Arc 7, Chapter 46\
    \ the Od, and damage to the soul, also damages the mind,Volume 11, Chapter 5 as\
    \ the mental has been equated to the spiritualVolume 10, Chapter 2) *Conceptual\
    \ Manipulation (Type 3; the Od is the \u201Cpure property itself that made a human,\
    \ human\u201D, being synonymous with the individual's soul and defining their\
    \ existence.Volume 25, Chapter 7Volume 25, Chapter 3, \"Rui Arneb\" It encompasses\
    \ the individual's Memories, elemental character, destiny, and life force,Volume\
    \ 9, Chapter 1 with the body's form itself conforming to the Od, such that altering\
    \ the Od alters both the body and mind.Volume 31, Chapter 2 Od contains the Name\
    \ and Memories. When the name is vanquished, the person is erased across all of\
    \ history with the world being rewritten as though they were never there and wiped\
    \ from everyone's minds.Volume 6, Chapter 4 Eating the N"
