    Bracelet | At first, he was unable to continuously use his ability to travel to
    other universes, this weakness would disappear in later installments | It is currently
    unknown whether he could utilize his time dilation technique in combat. Using
    the Shining Star Drive technique greatly drains him of his energy {| class="mw-collapsible
    mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
    | colspan="2" style="text-align: left; |Notable Attacks and Techniques: |- | *Astral
    Projection: Zero can appear as a astral projection of himself as shown in Ultraman
    Geed episode 3. *Travel Sphere: Zero can travel through space with a yellow travel
    sphere. A blue variant is used to gain extra speed to save Geed. *Assimilation:
    Like other Ultras, Zero can merge himself with another human and reviving their
    lifeforce. Zero can do it through the Ultra Zero/Ultimate Bracelet or his own
    power, shown when he merges Leito Igaguri. *Solar Recharge: Like his father, Zero
    can draw on the sun to power himself and circumvent his time limit on Earth like
    planets, however until he gained the Shield of Baradhi, he was unable to draw
    energy from the suns of other dimensions. In Ultraman X The Movie, Zero received
    light from X''s Beta Spark Armor Cyber Wing to empower himself through his protectors.
    *Size Change: Like his father, Zero can change his size from human size to his
    proper giant height. He uses the same stance as his father, crossing arms and
    bringing upright to the sides of his head to grow and the reverse to shrink. *Ultra
    Sign: Like other Ultras, Zero is capable of creating an Ultra Sign. *Crossover
    Formation: A momentary power boost used with other Heisei Ultras similar to Glitter
    Tiga and alternate Ultra Brothers'' Glitter Version. Used to destroy Etelgar''s
    castle. *Wave Intrusion: Zero is capable of intruding communication waves to converse
    with any person he desired. He did so in Ultraman X episode 5 as Ultimate Zero,
    though in New Ultraman Retsuden, he is able to do it in his normal form. *Power
    Endowment: Zero can give his power through the Ultra Fusion Brace along with other
    Heisei Ultras for Ultraman Ginga Victory to use his Zero Wide Shot and Emerium
    Slash respectively. *Ultra Charge: Zero can release energy from his Color Timer
    to give other Ultras energy or revive them. *Item Creation: Zero can create the
    Plasma Zero-let. *Type Change: Zero can change his forms through several methods
    after acquiring them. Among those listed are Ultimate Zero, Strong-Corona Zero,
    Luna-Miracle Zero, Shining Ultraman Zero and Ultraman Zero Beyond. Zero Astral
    Projection.jpg|Astral Projection Zero Travel Sphere.png|Travel Sphere Zero Assimilation.gif|Assimilation/Possession
    Zero Recharge.jpg|Solar Recharge/Empowerment Crossover Formation.gif|Crossover
    Formation Zero Size Change.jpg|Size Change Zero Ultra Sign.png|Ultra Sign Heisei
    Ultra Power Bestowal.jpg|Power Bestowal Zero Ultra Charge.jpg|Ultra Charge Zero
    Item Creation.jpg|Item Creation *Emerium Slash: A beam fired from Zero''s Beam
    Lamp similar to Ultraseven''s Emerium Beam. During the battle with Bandero in
    Ultraman X, Zero can fire multiple Emerium Slashes rapidly. *Wide Zero Shot: Zero
    charges his energy using Leo''s Space Martial Arts stance before firing an L-style
    beam. Similar to Ultraseven''s Wide Shot. **Powered-Up Wide Zero Shot: A stronger
    version of the Wide Zero Shot. Used in Ultraman Ginga S The Movie: Showdown! The
    10 Ultra Warriors! once acquiring Crossover Formation. *Zero Twin Shoot: A powerful
    beam from his chest with the Zero Sluggers attached to his Color Timer. Zero Emerium
    Slash .gif|Emerium Slash Zero Emerium Slash Rapid Fire.gif|Emerium Slash (Rapid
    Fire) Zero Wide Zero Shot.gif|Wide Zero Shot Zero Powered-Up Wide Zero Shot.gif|Powered-Up
    Wide Zero Shot Zero Twin Shoot.gif|Zero Twin Shoot *Space Martial Arts: Having
    been trained by Leo, Zero has a similar fighting style to the martial arts master.
    **Knifehand Strike: As one of the martial art movements taught by Leo, Zero is
    capable of performing a karate chop, with enough force being able to sever one
    of the horns of Mecha Gomora. ***Big Bang Zero: Zero covers his hand with fiery
    energy and performs a chop. First used to break Darklops Zero''s Sluggers. *Ultra
    Zero Kick: A flying kick similar to Ultraman Leo''s Leo Kick. **Slash Kick: Zero
    can perform a slash kick variant of the Ultra Zero Kick. Used against Tyrant with
    Orb in Ultra Fight Orb and again in Geed to destroy Belial''s Dark Fireball. *Ultra
    Zero Punch: A powerful punch attack that can knock back opponents. **Zero Knuckle:
    A punch from a fist covered in concentrated energy. Only used in a game. *Beam
    Zero Spike: Green energy discharges from his blows. Used against Imitation Ultr'
