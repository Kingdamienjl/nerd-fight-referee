- id: claim-weaknesses-56790d4c
  section: weaknesses
  axis: weakness
  text: "Cannot affect anything that's yellow. | Rings hold a limited charge and need\
    \ to be recharged with a power battery every so often. The ring cannot be used\
    \ without sufficient willpower. If the user is somehow overcome by fear they will\
    \ be unable to use the ring and will become vulnerable to the color yellow. If\
    \ Green Lantern loses focus or concentration (i.e. through illusions) his power\
    \ will weaken. | Prologue use of Krona's Power Gauntlet causes Hal\u2019s powers\
    \ to go unstable, becoming thought, expression, a construct, a being of pure unharnessed\
    \ will, close to disappearing inside the emotional spectrum forever. Feats: Toggle\
    \ *Hal blocks Ultraman's heat-vision.Justice League of America Vol 1 #30 September\
    \ 1964 *Withstood the Universe's magnetic forceGreen Lantern Vol 2 #135, December\
    \ 1980 *An alien who copied Hal's body, memories, and stole his ring hurts and\
    \ may kill SupermanDC Comics Presents Vol 1 #26, October 1980 *According to Superman,\
    \ the power of Hal\u2019s ring defies all quantificationJustice League of America\
    \ Vol 1 #189, April 1981 *Hal designed a prison that was capable of holding Ultra-Man\
    \ and the Crime Syndicate. Power Girl and Alan Scott prove incapable of shattering\
    \ the construct. It takes the combined power of Dr. Fate and Starman to do the\
    \ job. Justice League of America Vol 1 #207, October 1982 *Hal Jordan says that\
    \ he stopped Superman cold onceJustice League of America Vol 1 #224, March 1984\
    \ *Time travel is harder since the crisis. Hal and Arisia time-travelGreen Lantern\
    \ Corps Vol 1 #215, August 1987 *Hal Jordan fights Captain AtomAction Comics Vol\
    \ 1 #630, December 1988 **Captain Atom didn't learn about his Universal level\
    \ powers until later onCaptain Atom Vol 2 #54, June 1991, #55, #56, and #57 *A\
    \ rookie Hal due to a timewarp was forced to fight himself as Parallax. Young\
    \ Hal says their wills are even(They are the same person), but Parallax says that\
    \ he has more power.Green Lantern Vol 3 #106, October 1998 *Inside his battery,\
    \ Hal fuses will and imagination to create a Microverse, projected from the hologram\
    \ of his mind.Green Lantern: Will world July 2001 *Hal contains a star destroying\
    \ entropic weaponGreen Lantern Vol 3 #167, September 2003 *Hal Jordan and Sinestro\
    \ cause a collision so powerful it bends local realityGreen Lantern: Rebirth Vol\
    \ 1 #5, April 2005 *Took a punch from Superboy-PrimeGreen Lantern Corps Vol 2\
    \ #18, January 2008 *Hal severely damages AMAZO who all of the League's powersJustice\
    \ League of America Vol 2 #23, September 2008 *Hal and other Lanterns spike the\
    \ second Mandrakk, Rox OgamaFinal Crisis Vol 1 #7, March 2009 *Hal stops Captain\
    \ Atom who is holding backAction Comics Vol 1 #885 March 2010 *Hal fights on par\
    \ with LoboGreen Lantern Vol 4 #55 August 2010 *Hal catches Parallax Flash who\
    \ is running in circlesGreen Lantern Vol 4 #60 January 2011 *Krona who had Ion\
    \ easily pushed back Hal's willpower, but Hal was able to scratch KronaGreen Lantern\
    \ Vol 4 #62 March 2011 *Hal Jordan one-shots Krona while he is wearing rings from\
    \ seven different lantern corps. Green Lantern Vol 4 #67, August 2011"
