    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Extrasensory Perception (As a Stand
        User, Jotaro is able to see Stands which are invisible to non-Stand Users
        and ghosts, Due to being a member of the Joestar Bloodline, Jotaro is able
        to sense the locations of other members of the Joestar Bloodline in a city-wide
        radius), Aura, Summoning (Can summon his Stand, Star Platinum), Indomitable
        Will (Only those with incredible fighting spirits are able to develop and
        use a Stand), Telepathy (Stand Users can communicate telepathically through
        their Stands), Pain Suppression (Has fought against Dio with three broken
        bones, Was barely affected by having a ceiling fan stabbed into his shoulder),
        Instinctive Reactions (Even while in a coma, his body attacked someone who
        tried to remove his hat), Fourth Wall Awareness (Stated that if he was to
        die who would replace him as the protagonist heavily implying that he knows
        he is in a manga), Resistance to Fire Manipulation, Heat Manipulation (Wasn't
        fazed by being set on fire to the point that fire was coming out of his mouth)
        and a Minor Resistance to Time Stop (Can see events in stopped time even after
        his time stop has run out) Superhuman Physical Characteristics, Afterimage
