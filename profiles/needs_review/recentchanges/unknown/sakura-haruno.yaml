        medical Ninja, with more skill and talent than Shizune. She was personally
        taught by Tsunade herself, and is now skilled enough to heal most ailments
        and injuries effortlessly), Earth Manipulation, Water Manipulation, Limited
        Durability Negation (Can perform internal damage like cutting muscle tendons
