    - field: attack_potency
      value: Wall level physically (Can fend off large animals like cattle, wolves,
        cougars, and even grizzly bears with his bare hands and beat them to death
        with these bears weighing somewhere around 1,000 pounds, and it takes two
        dynamite sticks to kill them. Can kill the legendary bison with a few hits,
        which is notably bigger than the American Bison120,936.0575 Joules. Was capable
        of giving Tommy brain damage with his punches, who is noticeably bigger and
        stronger than Arthur. On par with John Marston, although Dutch van der Linde
        considers Arthur the better outlaw, and most of the camp has stated Arthur
        to possess better fighting experience. Capable of trading blows with those
        who can harm him and those with comparable durability, like Micah Bell. Can
        also harm himself with his own attacks. Can effortlessly crush necks with
        pure grip strength alone. Can send people flying with his strikes. Can fight
        against Hortensia, a strong woman who can rip books apart, bend steel and
        withstand concrete blocks being smashed on her, although the game is scripted
        to make her win regardless of how much health and energy Arthur has left.
        Can easily kill peak-level human beings with one punch or kick. Can harm horses
        with his punches. Even when suffering from tuberculosis he was still capable
        of putting up a good fight against Micah and defeating him, as seen in the
        true ending), higher with firearms (His firearms can easily penetrate thick
        steel doors and blow up human heads and limbs with ridiculous ease. His weapons
        are also capable of killing big game like lions), melee weapons, and dynamite
        (Single dynamite sticks can bust open metal doors2,847.52444 Kilojoules and
        scale to 1/15th of the feat of blowing up the bridge4,708.10901104 Kilojoules),
        Small Building level with preparation time (Blew up a bridge with 15 sticks
        of dynamite0.01687897594 Tons of TNT)
      source_id: mediawiki-2299664
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: Peak Human travel speed, Superhuman reaction speed14.068956 m/s and Subsonic
        perception speed19.0127366 milliseconds with Deadeye (Using deadeye things
        are slowed down enough that Arthur is able to perceive the motion of bullets
        react to them), Subsonic+ (Most revolvers during the 1890s and the early 1900s
        could easily hit over 250 m/s) to Supersonic attack speed with firearms (Used
        a Winchester Rifle. Shotgun shells can exceed 549 m/s, while the pellets from
        those shells can hit 425 m/s. Several rifles during his time had muzzle velocities
        easily exceeding 750 m/s), higher attack speed with high-velocity ammunition
      source_id: mediawiki-2299664
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: durability
      value: Wall level (Can easily brush off high falls and high-speed collisions
        into trees and walls with horses, only feeling irritated at worst. Can withstand
        being viciously mauled by grizzlies, alligators and brush off full-powered
        charges from cattle. Survived a dynamite exploding underneath a wagon he was
        on. Capable of often surviving a head-on train collision, but barely. Was
        shot point-blank in the shoulder with a shotgun but survived. Survived a trolley
        crash. Early in the game, he took a full-powered blow to the head from a chair
        and was still completely fine, followed by getting tossed through a window
        by Tommy, a burly man who is bigger and stronger than him, and then proceeding
        to take multiple hits from him. Can easily withstand multiple high-caliber
        rounds from guns to the head that can easily blow up human heads and body
        parts with a single shot before dying. Survived falling down a cliff and into
        the ocean. Can tank attacks from those comparable to him like Micah)
      source_id: mediawiki-2299664
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: stamina
      value: Superhuman (Can keep fighting for hours at an end without stopping. Can
        still keep fighting even when viciously wounded. Can also swim in ice-cold
        water for extended periods. Even early in the game, he traveled through a
        heavy snowstorm with Dutch for three days straight without sleeping or eating,
        and was still capable of leading the gang with him and partaking in a gunfight.
        Was kidnapped by O'Driscolls, beaten, shot point-blank in the shoulder, tortured
        while held upside down, whipped in the ribs with a pistol, went a day without
        any treatment, and still had enough energy to perform self-surgery and stealth-kill
        an entire house full of O'Driscolls. Survived being in a disastrous shipwreck
        that forced him to swim in the ocean during a violent thunderstorm for presumably
        long periods of time, followed by being stranded on the island of Guarma and
        walking across the island while sunburned and incredibly exhausted. Even when
        suffering from tuberculosis and being near death because of it, he was still
        capable of going on hours and hours in a gunfight, dying only when he was
        caught off-guard, though this is for the bad end, as in the true conclusion,
        Arthur emerges victorious). Can nevertheless recover all of his Stamina via
        tonics
      source_id: mediawiki-2299664
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: range
      value: Standard Melee Range; Extended Melee Range with melee weapons; Several
        Meters with a lasso and by throwing weapons; Tens of Meters to Hundreds of
        Meters with firearms, higher with high-velocity rounds
      source_id: mediawiki-2299664
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: Revolver, bow, lasso, knife, mask, shotgun, rifles, dynamite sticks,
        several ammo types, rope, machetes, tomahawks
      source_id: mediawiki-2299664
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Genius (Despite lacking any formal education and being called a fool
        and idiot by some characters throughout the game, Arthur is actually a highly
        cunning and intelligent individual. He is also the peerless gunslinger of
        the era and is described as "too dangerous" to approach by both the Pinkerton
        Detective Agency and the law of Blackwater. Mastered how to use a bow in a
        short lesson and can instantly pick up abilities that normally require decades
        to learn. He is also a master strategist, formulating plans to get out of
        situations involving the law with almost no preparation time required, practically
        thinking on the spot. He solved a murder mystery laid out by a serial killer
        which the law weren''t able to figure out at all, figured out multiple treasure
        maps that famous explorers were unable to decipher in moments to find hidden
        treasures. Instantly learned how to use toxins and potent poisons despite
        never having used them before. Has a vast understanding on animal life as
        well as plant life, and can use plants to create things to heal himself and
        provide additional boosts. Can create explosives out of basic things. Arthur
        is also a very sophisticated writer, having over 400 pages in his journal
        with exceptional penmanship and drawings, recollecting areas he has been to
        in precise detail. The world will soon no longer accept gunslingers or outlaws
        like Arthur and his gang, and Arthur is one of the few people who realizes
        this. Arthur excels at horse riding, surviving in the wilderness, hunting
        down exceptionally rare animals, and is a marksman in all sorts of guns, as
        well as melee fighting, being capable of countering opponents armed with knives
        and machetes while barehanded. Arthur is also able to track the smallest of
        items and is usually relied on by others to find special items for them such
        as looking for tonics to make flaming arrows) Standard Tactics: Arthur starts
        his fights by immediately activating Dead Eye (such as when confronted by
        numerous guards, facing experienced gunslingers, protecting Sean before anyone
        could fire their guns, and fighting off a swarm of Pinkertons, including one
        armed with a maxim gun) and aiming for his opponent''s vital areas, most notably
        the head. Even when outnumbered or if his opponent has a notable stat advantage
        over him, Arthur is never willing to surrender and will fight dirty. If need
        be, Arthur will also use his environment to his advantage and use stealth
        tactics to turn the tides of the fight and ambush his opponent.'
      source_id: mediawiki-2299664
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Dead Eye only lasts for a maximum of 20 seconds at a time. He can often
        have a knack for getting on people's nerves quite quickly, he is wiser and
        calmer. Later contracted tuberculosis, which weakened his overall state and
        ultimately claimed his life.
      source_id: mediawiki-2299664
      provider_id: vsbattles
      authority: high
      confidence: 0.75
