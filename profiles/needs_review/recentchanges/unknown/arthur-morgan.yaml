    - field: stamina
      value: Superhuman (Can keep fighting for hours at an end without stopping. Can
        still keep fighting even when viciously wounded. Can also swim in ice-cold
        water for extended periods. Even early in the game, he traveled through a
        heavy snowstorm with Dutch for three days straight without sleeping or eating,
        and was still capable of leading the gang with him and partaking in a gunfight.
        Was kidnapped by O'Driscolls, beaten, shot point-blank in the shoulder, tortured
        while held upside down, whipped in the ribs with a pistol, went a day without
        any treatment, and still had enough energy to perform self-surgery and stealth-kill
        an entire house full of O'Driscolls. Survived being in a disastrous shipwreck
        that forced him to swim in the ocean during a violent thunderstorm for presumably
        long periods of time, followed by being stranded on the island of Guarma and
        walking across the island while sunburned and incredibly exhausted. Even when
        suffering from tuberculosis and being near death because of it, he was still
        capable of going on hours and hours in a gunfight, dying only when he was
