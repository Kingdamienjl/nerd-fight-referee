        has such a great sense that he was able to tell something was about to go
        wrong in the town he was in before it even happened, when no one else in his
        gang could. Learned the ability Eagle Eye which heightens his already great
        awareness to see the most smallest of details even in snowy areas, including
        tracks, small objects and even those that can be traps, trails and can "see"
        scents. With the ability he can spot out animals as well as humans, even if
        they are hidden.), Social Influencing (Arthur is extremely charming and has
        a good way of words despite how he portrays himself. Arthur convinced a drunken
        man to stop bothering him, convinced a teenager who was on the verge of shooting
        himself to stop and change his perception on his life with a small pep talk
        despite the teenager being manipulated by a cult. He also made people who
        previously despised him because of the wrong he did to their families start
        to see him as a good man after short conversations noting that he is a "good
        man" despite every bad thing they know he has done.), Weapon Mastery, Superhuman
        Precision, Limited Homing Attacks (Arthur is a master at using multiple types
        of weapons, from firearms to things like a tomahawk, knives, molotovs, etc
        and is capable of instantly learning how to use weapons he's never used before,
        all of which are listed here. He is able to kill his enemies with absolute
        precision as well and effectively never miss at his best, even small targets
        such as birds or snakes. He can also have homing attacks with his weapons
        like with a tomahawk, which always headshots the target even if he isn't aiming
        directly at them.), Stealth Mastery (Arthur has sneaked around Braithwaite
        Manor, the manor of an extremely rich family that is guarded everywhere without
        getting caught, managing to get passed the guards and reach the daughter of
        the family who was across a pond, and then escape the facility without much
        issue. Arthur has sneaked into multiple heavily guarded camps at morning and
        at night without getting caught, some camps being situated in the middle of
        a forest, and can still not be caught even though he would be walking through
        bushes and grass, and can remain unnoticed even when he is right behind his
        target and is killing people around the camps. Went across a field, climbed
        up a tower to stealth kill a sniper without getting caught and then proceeded
        to snipe down the enemies. Sneaked around the island of Guarama despite said
        illness with the island possessing many trained guards and warriors. Arthur's
        stealth can also sneak up to many animals including cougars and other animals
