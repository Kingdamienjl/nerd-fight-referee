- id: claim-weaknesses-a15883b0
  section: weaknesses
  axis: weakness
  text: 'Paranoid. Grew increasingly unstable over the course of the novels, eventually
    running mad by the end of the series. | None notable Note: While it is implied
    that Roland''s guns might have been able to kill the Crimson King''s avatar prior
    to him becoming undead, this theory was never proven, and the basis for that argument
    lay in the in-universe legend that the guns are capable of killing immortals.
    (Similarly to Excalibur, the sword which was melted down in order to forge them)
    The legend itself also holds no context inside or outside of the story, and the
    supposed immortal-killing aspect of Roland''s guns has never been shown at any
    point within the series.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
