    Information Analysis (Deduced in a short time that Hans Gelen was pumping blood
    into his eyes which boosted his neurons 3x higher. Set a trap by triggering his
    emotions and killed him right afterBlack Joke Chapter 26), Vehicular Mastery (Kira
    is known as a expert driver who Todome assigns driver escort missions to. Has
    used his own car to run over enemiesBlack Joke Chapter 4. Can also fly HelicoptersBlack
    Joke Chapter 17), Afterimage Creation (Shown hereBlack Joke Chapter 26), Analytical
    Prediction (States as long as he doesn't use specific muscles Hans Gelen can't
    predict his attacksBlack Joke Chapter 26), Regeneration (Mid Low - Has shown many
    times to tank deadly stab wounds that would kill other characters. Also shown
    here) Technology Manipulation and Hacking (Designed his own computer notepad that
    can take enhanced pictures of the location he is in to help him create plans.
