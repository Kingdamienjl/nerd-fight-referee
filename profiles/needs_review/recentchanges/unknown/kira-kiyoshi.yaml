        (Despite being an anthropomorphized dog, Kira is still simply a dog at heart,
        and as shown in the episode "Speak", if dogs aren't allowed to speak English,
        they can still communicate with each other through barks and whines), Genius
        Intelligence, Enhanced Senses (Dogs are shown to have a keen enough sense
        of smell to tell if things are wrong), Bodily Weaponry (Via teeth and claws.
        Kira states that she sharpens her teeth before bed), Preparation (Environmental
        and Technological; Able to set up traps using her surroundings rather well.
        Kira is smart enough to gather various high-tech supplies to reverse-engineer
        various devices to her advantage), Light Manipulation (Able to emit a shining
        light somehow, which is bright enough to make Chonies have to squint and try
        to block the light), Weapon Mastery (Able to kill large alien monsters with
        ease with her weaponry, and has a really skilled throw with her daggers),
        Vehicular Mastery (Incredibly skilled at fighting while piloting the Venus
        Mech, which is already not built for stability), Martial Arts (Is skilled
        in hand-to-hand combat, being able to toss, punch, and kick Garbage, and several
        dogs ganging up on her), Acrobatics (Capable of hopping, running, and jumping
        around to avoid Nomi's various explosive missiles and lasers), Adhesive Manipulation
        (Utilized extraterrestrial plant goop to trap multiple characters), Energy
        Projection (Able to fire beams from her arm cannon), Heat Manipulation (Has
        yellow balls that she can throw to make things melt and even bubble up, Owns
        a ball of active lava), Poison Manipulation, Minor Plant Manipulation (Kira
        owns a toxic pollen bomb), Minor Spike Projection (Her arm cannon comes with
        a sharp knife that can pop out of the barrel of the cannon, has throwing daggers.
        The Venus Mech has a hidden giant sword in its hand), Fire Manipulation, Magma
        Manipulation (Can fire lava balls from her arm cannon which can instantly
        set off firey explosions), Electricity Manipulation (Her electric rifle allows
        her to fire blasts that electrocute enemies), Limited Healing (Her mechanical
        cast is able to heal her broken arm(s) within days instead of months, however
        this is very unlikely to be useful in a short-lived fight and only usable
