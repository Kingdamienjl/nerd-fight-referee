    Drug Manipulation (Planted laxatives in Johnny's waterBlack Joke Chapter 8), Electricity
    Manipulation (Figured out the Kyojin Clones are weak to electricity and set a
    electric trapBlack Joke Chapter 47), Explosion Manipulation (Crafted the bomb
