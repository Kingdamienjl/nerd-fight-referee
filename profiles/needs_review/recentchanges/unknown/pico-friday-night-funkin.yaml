  axis: weakness
  text: "Average human weaknesses. Note: As of now, Pico\u2019s School is not confirmed\
    \ to be canon to the Friday Night Funkin\u2019 universe, and feats shown there\
    \ are not taken into account. However in 2021, Tom Fulp, the original creator\
    \ of Pico released a version of Pico's School called Pico's School: Love conquers\
    \ all, where he introduces Boyfriend as his Boyfriend. This could be seen as a\
    \ split timeline of the original Pico's School and a prequel to Friday Night Funkin'.\
