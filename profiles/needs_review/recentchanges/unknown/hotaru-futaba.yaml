  intelligence:
    text: 'Average, Gifted in martial arts (Hotaru is a very talented fighter for
      her young age and has already been acknowledged as such numerous times. In her
      childhood she underwent harsh training under the guide of her father Gao, an
      expert martial artist and owner of his own dojo. After her abandonment, Hotaru
      began a solitary journey that lasted seven years, during which she survived
      on her own and polished her skills even more. She entered both the fifth and
      sixth "King of Fighters" tournament, coming out as one of the most notable participants;
      she even came to confront her brother on at least two occasions, proving her
      worth, if not outright defeating him. Recently, she settled in South Town and
      has become an acquaintance and sparring partner for the many fighters that populate
      the city. Her skillsFatal Fury: City of the Wolves - Terry Bogard''s Win Quotes
      (Vs. Mode - Vs. Hotaru) are said to be impressiveFatal Fury: City of the Wolves
      - Chun-Li''s Win Quotes (Vs. Mode - Vs. Hotaru) for one of her age and she received
      earnestFatal Fury: City of the Wolves - Conversations: Heroines Past and Present
      complimentsFatal Fury: City of the Wolves - Conversations: Hotaru''s New Teacher?
      from seasoned fightersFatal Fury: City of the Wolves - Conversations: Just a
      Bit of Bravery such as Terry Bogard, Mai Shiranui, Chun-Li and Rick Strowd.
      Even more people have also praised her resolve and fighting spirit which made
      her able to confront the many adversities and foes she has found on her path.Fatal
      Fury: City of the Wolves - Conversations and Win Quotes Lastly, Hotaru possesses
      some peculiar skills, such as making animals out of snow and disarming trapsFatal
      Fury: City of the Wolves - Conversations: Living Together set up by poachers)'
    source_ids: *id002
    confidence: 0.8
