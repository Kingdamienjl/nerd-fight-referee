- id: claim-weaknesses-9a68ec07
  section: weaknesses
  axis: weakness
  text: "Rock / Protective Craft. Is deathly allergic to pineapples. Notable Attacks/Techniques:\
    \ * Knife To Meet You - Deals SCISSORS damage to one enemy. Might lower enemy's\
    \ DEFENSE. * Too Cleaver by Half - Deals SCISSORS damage to all enemies. Might\
    \ lower enemies\u2019 ATTACK. * Make Up The Time - Makes all friends FASTER for\
    \ a few turns. * Turn It Up - Give your turn to a friend, BOOSTING their ATK and\
    \ CRIT CHANCE. * Buy One Get One Three - Deal three SCISSORS hits to one enemy.\
    \ High chance of doing a Critical hit. * Done Heal - Heal 30% of a friend\u2019\
    s HP and boosts their ATTACK. * In A While, Rockodile - Deals weak ROCK damage\
    \ to one enemy. Gives two JACKPOT points instead of one. * Rose Printed Glasses\
    \ - Deals weak PAPER damage to one enemy. Gives two JACKPOT points instead of\
    \ one. * Regener-ade - For three turns, a friend REGENERATES 10% of HP every turn.\
    \ * Tear You Apart - Deals big PAPER damage to one enemy. Gives two JACKPOT points\
    \ instead of one. * Rock Bottom - Deals big ROCK damage to one enemy. Gives two\
    \ JACKPOT points instead of one. * (Just Attack.) - Deals massive SCISSORS damage\
    \ to all enemies. Doesn\u2019t give a JACKPOT POINT. * (Call Loop.) - Call Loop\
    \ for advice. * Wish Craft - Generally a non combat-applicable technique. Wish\
    \ Craft is a form of Craft that allows the user to craft wishes through various\
    \ rituals and a strong belief. * (Rock.) - Deals big ROCK damage to one enemy.\
    \ * (Paper.) - Deals big PAPER damage to one enemy. * (Scissors.) - Deals massive\
    \ SCISSORS damage to all enemies. * (Breathe.) - Boost actors\u2019 ATTACK, DEFENSE\
    \ and ATTACK SPEED. * (Heal.) - Heal self. * (Don\u2019t Attack.) - Can't hurt\
    \ them. Attack the only person left. Note: Whenever using Siffrin\u2019s first\
    \ key in a VS Match, it should be specified what Act he is in as he breaks free\
    \ from the time loop in Act 6. ==Notable Matchups== Victories: Losses: *Subaru\
    \ Natsuki (Re:Zero kara Hajimeru Isekai Seikatsu) Subaru\u2019s profile (Arc 1-4\
    \ Subaru and The Traveler / The Wanderer Siffrin were used. Siffrin was 9-B+ and\
    \ had access to all of his optional equipment, while Subaru only had his standard\
    \ equipment. Speed was equalized) Inconclusive: ==References== ==Notes/Explanations==\
    \ Category:Knife Users Category:Statistics Amplification Users Category:Statistics\
    \ Reduction Users Category:Regeneration Users Category:Fear Users Category:Accelerated\
    \ Development Users Category:Time Users Category:Immortals Category:Reality Warpers\
    \ Category:Power Bestowal Users Category:Size Users Category:Memory Users Category:Large\
    \ Sized Characters Category:Characters Category:In Stars and Time Category:Explosion\
    \ Users Category:Telepaths Category:Protagonists Category:Indie Game Characters\
    \ Category:Energy Projection Users Category:Water Users Category:Perception Users\
    \ Category:Nonbinary Characters"
