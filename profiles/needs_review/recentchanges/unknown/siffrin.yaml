- id: claim-powers-and-abilities-f105ade0
  section: abilities
  axis: hax
  text: "* Superhuman Physical Characteristics * Energy Projection (Craft is described\
    \ as taking one\u2019s creative energy and making it physical to hurt enemies)\
    \ * Statistics Amplification with Craft skills, Memories, and Items * Healing\
    \ with Craft skills and Items * Regeneration with Craft skills and Memories *\
    \ Telepathy with (Call Loop.) (Can speak to Loop from inside their mind, though\
    \ their connection breaks the further Siffrin travels away from them.) * Acausality\
    \ (Type 1, even after escaping the loops, Siffrin could remember what happened\
    \ when Loop looped back in their fight) * Self Statistics Reduction with Memory\
    \ of Touch equipped (When equipped, Memory of Touch reduces all stats by 50.)\
    \ * Fear Manipulation with Memory of Sadnesses equipped (When equipped, Memory\
    \ of Sadnesses will make all Sadnesses scared of Siffrin, causing them to run\
    \ from him.) *Accelerated Development for teammates with Memory of Family equipped\
    \ (When equipped, Memory of Family doubles EXP gain for all of Siffrin\u2019s\
    \ teammates, not including his own EXP gain.) * Minor Reality Warping with Memory\
    \ of Pillars and Memory of Barrels (When equipped, Siffrin will randomly find\
    \ items in pillars and barrels respectively. Loop claims that, while it\u2019\
    s nonsensical that Siffrin would find items within pillars, that it\u2019s \u201C\
    how the world works now,\u201D implying a minor level of Reality Warping.) * Explosion\
    \ Manipulation with the Bomb * Water Manipulation with the Star Crest (The Star\
    \ Crest is able to clear rows of the King\u2019s tears) * Wish Craft is responsible\
    \ for the following abilities ** Time Manipulation, Time Travel, and Immortality\
    \ (Type 1, 4, & 8) (Siffrin, throughout most of the game, is stuck in a time loop\
    \ caused by Wish Craft. Wish Craft is implied to be reliant on a higher power\u2014\
    the Universe\u2014to work) ** Reality Warping (Wish Craft was able to alter the\
    \ layout of the House and turn the sky red) ** Power Bestowal and Size Manipulation\
    \ (Despite not using either of these effects in this key, the King was able to\
    \ grant himself the power to freeze Vaugard in time through Wish Craft and also\
    \ vastly grew in size) ** Memory Manipulation (Despite not ever using Wish Craft\
    \ for this purpose, Wish Craft is capable of removing the island north of Vaugard\
    \ from everyone\u2019s memories) ** Perception Manipulation (Wish Craft is implied\
    \ to have been the source for what made colors disappear from people\u2019s perception,\
    \ as shown with wishes breaking being symbolized by a \u201Cvisceral color\u201D\
    ; red. Note that colors still exist in the world of In Stars and Time, as Mirabelle\
    \ claims that \u201Cwe just, um, forgot how to see them.\u201D) Resistance to\
    \ * Extreme Temperatures (Siffrin\u2019s cloak was stitched with a temperature\
    \ regulation spell) The same as before, minus abilities granted only through memories\
    \ The same as before, minus abilities granted only through memories, along with\
    \ * Large Size (Type 0; 4.894489015 meters)"
  source_ids: *id003
  decisive: true
  status: unverified
