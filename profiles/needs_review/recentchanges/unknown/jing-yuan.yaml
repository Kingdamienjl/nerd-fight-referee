        \ identify and devise strategic plans to counter them effectively. His quick-witted\
        \ nature constantly surprises his superiors. Jing Yuan's remarkable achievements\
        \ have enabled him to maintain peace within the Xianzhou region for many years.\
        \ As a result, he has earned the esteemed position of one of the 7 Arbiter-Generals\
        \ with the moniker \"wise and brave\".Myriad Celestia Trailer: History of\
        \ the Xianzhou: Seven Arbiter-Generals | Honkai: Star Rail Furthermore, Jing\
        \ Yuan demonstrated his exceptional intelligence and cunning during a chess\
        \ match against Fu Xuan, defeating her despite her having used the Omniscia\
        \ ability to accurately calculate and predict his next 48 moves.Jing Yuan\
        \ Character: Story I Moreover, during his confrontation with Phantylia, Jing\
        \ Yuan cleverly taunts her, intentionally drawing her focus on him, and this\
        \ maneuver allowed him to link up with her, allowing Dan Heng to seal Phantylia's\
        \ powers while Jing Yuan strucked the finishing blow. During the Luminary\
        \ Wardance, Jing Yuan quickly formulated a plan using the classic strategy,\
        \ \u201CWhen you surround an army, leave an outlet free.\u201D To capture\
        \ Hoolay, he set a trap by disguising Cloud Knights as civilians on the Skysplitter,\
        \ knowing that Hoolay would aim for the Skysplitter to escape. Anticipating\
        \ that Hoolay might avoid the initial trap, Jing Yuan meticulously prepared\
        \ a backup plan: he closed all transport lanes and restricted traffic, leaving\
        \ the Skysplitter as the only viable escape route. To further ensure success,\
        \ he enlisted Feixiao to block all other exits, driving Hoolay into the ambush\
        \ he had set, ensuring there was no escape. The plan succeeded, leaving Hoolay\
        \ with no escapeI Shall Turn the Tide) Genius (Jing Yuan is an extraordinarily\
        \ skilled glaive user, having undergone rigorous training under the guidance\
        \ of Jingliu, the Sword Champion, a title reserved for those who have achieved\
        \ the utmost mastery in the art of swordsmanship.Jingliu Character Story:\
