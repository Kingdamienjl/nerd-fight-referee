claims:
- id: claim-powers-and-abilities-5923d22e
  section: abilities
  axis: hax
  text: ==Yunkui Summit Mystic Arts Techniques== ==Notes== Ether as a whole is complex,
    and its Corruption symptoms can often times be spontaneous and random, varying
    from person to person. Although the amount of time it takes for a person to become
    fully corrupted is unclear, consistent exposure to high doses of Ether, such as
    in the form of the various Ether-based weapons in-game Ether agents utilize in
    combat, will cause Corruption symptoms to kick in faster. Ether Corruption can
    also be exacerbated by fear, as mentioned in the abilities section, which is an
    ailment Ether itself can also inflict on victims. To make Ether's varying abilities
    easier to understand for readers, they have been broken down into three different
    subcategories. Common Afflictions are the most common symptoms of Ether Corruption,
    and they're symptoms commonly seen in the earlier stages of Ether Corruption.
    Terminal Afflictions are rarer symptoms, and these symptoms are usually seen in
    the later stages of Ether Corruption, past the point of recovery for most ordinary
    people. Miscellaneous Abilities are abilities that are either not directly tied
    to one specific stage of Ether Corruption, or are more so just abilities tied
    to the general nature of Ether energy rather than it's Corruption effects specifically.
    ==Users of Ether== *Wise *Belle *Nicole Demara *Zhu Yuan *Astra Yao *Vivian Banshee
    *Yixuan *Ju Fufu *Pan Yinhu *Ye Shunguang *Ye Shiyuan *Lucia Elowen *Aria *Nangong
    Yu ==References== center|600px ==Summary== Ethereals are monsters that exist within
    Zenless Zone Zero's Hollows, and they are the main and most prominent enemy threat
    both in-game and in-lore. Ethereals can form naturally within the environment
    of Hollows as a result of high Ether Concentration,Current Intel - "Faun" but
    they can also be the result of organic beings forcefully being transformed as
    a result of Ether Corruption. The most notable part of every Ethereal is their
    dark "cores," comprised entirely out of Ether. These cores can be considered their
    weak points, as destruction of it will result in the Ethereal's death. However,
    many Ethereals have naturally grown ways of protecting their cores, such as covering
    it in thick armor,Current Intel - "Armored Hati" which makes properly killing
    an Ethereal a task far easier said than done. Ethereals can vary drastically in
    size, shape, and appearance. Naturally forming Ethereals often take on physical
    characteristics of the environments they were formed in, such as an Ethereal formed
    in an abandoned Metro station sprouting signs and utility equipment from its body,Current
    Intel - "Metro Goblin" and organic being-turned Ethereals will more often than
    not retain some physical characteristics of their bodies prior to becoming corrupted,
    such as in the case of Pompey.Phaethon's Story; Chapter 4 - "Tour De Inferno"
    More often than not, Ethereals are highly aggressive and animalistic in nature,
    attacking any lifeforms that they come across. Interestingly enough, however,
    some Ethereals have been shown displaying unique traits and behaviors. Certain
    types of Ethereals seem to hunt and attack in packs,Alice Thymefield's Character
    Demo; "Sword and Waltz" and some Ethereals have also displayed traits such as
    mercilessness, cunning, and honor.Current Intel - "Ionized - Nassellaria" ==Ethereal
