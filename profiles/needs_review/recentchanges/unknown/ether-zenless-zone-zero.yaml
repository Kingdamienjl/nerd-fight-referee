      value: 'Has a crippling fear of insects. EMP can temporarily disable his Ether
        Gear. Has difficulty using his powers underwater. Notable Attacks/Techniques:
        Satan Gravity: Renowned as "the power of the Demon King," which he inherited
        from his adoptive grandfather, Ziggy, Shiki uses this Ether Gear to control
        and manipulate gravity itself, giving him "Demon King Ether". He is capable
        of changing the direction of the gravitational force around himself which
        enables him to stick to walls, float in the air, and make objects and people
        weightless to an extent. When using its power throughout his body, Shiki is
        identified as the new Demon King. He also describes it as a power he inherited
        from his grandfather, and that it took him a month to learn it. After training
        with Xenolith for seven days, Shiki has shown improvement over his Satan Gravity
        to the point that he is capable of feats such as drastically increasing the
        weight of multiple people or objects without making contact, changing the
        direction of bullets fired at him with a flick of the wrist, and launching
        multiple opponents with a single punch. He is also capable of sending Poseidon
        Shura, another Satan Gravity user who is said to be stronger than he is, into
        the air after being briefly held down by the immense weight of the latter''s
        own gravitational field before sending him downwards with two gravity-empowered
        punches. Three years later in the Kaede Cosmos, Shiki''s gravity powers have
        increased drastically. *Magimech'
