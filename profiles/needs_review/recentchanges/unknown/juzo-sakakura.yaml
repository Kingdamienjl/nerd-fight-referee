power_scale:
  tier:
    text: 8-A
    source_ids: &id002
    - mediawiki-2005362
    confidence: 0.95
  attack_potency:
    text: 'Multi-City Block level+Scales to 959.588 Tons (He is one of the Future
      Foundation''s members who can fight against Remnants of Despair members like
      Peko, Nekomaru and Akane. Held his own against GozuDanganronpa 3: The End of
      Hope''s Peak High School; Future Arc; Episode 02: Hang the Witch and Tengan,Danganronpa
      3: The End of Hope''s Peak High School; Future Arc; Episode 04: Who is a Liar
      and only got overpowered in the two cases due to his inability to use his boxing
      talent as per his Forbidden Action. Kicked the robotic Miaya Gekkogahara so
      hard that it had to be rebooted by Monaca. Injured Takumi Hijirihara with a
      punchDanganronpa Gaiden Killer Killer; Chapter 04: Sting Casino Murders)'
    source_ids:
    - vsbattles-juzo-sakakura-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Hypersonic+Scales to Mach 14.22 with Relativistic+Scales to 81.36% SoL reaction
      speed (Comparable to the likes of Kyosuke Munakata. Dodged the explosions of
      six rockets by moving to the corridor on his right)
    source_ids:
    - vsbattles-juzo-sakakura-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class 5
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Multi-City Block level+
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Multi-City Block level+ (Survived getting stabbed by Munakata.Danganronpa
      3: The End of Hope''s Peak High School; Future Arc; Episode 09: You are My Reason
      to Die He also cut his arm off, although he died from severe blood loss,Danganronpa
      3: The End of Hope''s Peak High School; Future Arc; Episode 11: All Good Things
      after receiving too many injuries. Tanked a huge explosion that didn''t do much
      to harm him despite the damage to the buildingDanganronpa Gaiden Killer Killer;
      Chapter 10: Killer Killer Killer)'
    source_ids:
    - vsbattles-juzo-sakakura-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Even after getting stabbed in the stomach by a heated katana,
      having his left shoulder pierced by a spear, and having his left arm cut off,
      Juzo was still capable of standing on his legs and walk to the breaker room
      to turn off the power of the whole facility they were in, thus deactivating
      the bracelets and ending the Final Killing Game)
    source_ids:
    - vsbattles-juzo-sakakura-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range
    source_ids:
    - vsbattles-juzo-sakakura-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'Average normally, Genius in boxing (He was described as incompetent, with
      his boxing skills being his only redeeming quality. As the Future Foundation''s
      6th Division Head, he is responsible for maintaining public order by suppressing
      insurrections, and managing the special crime investigation unit.Danganronpa
      Gaiden Killer Killer; Chapter 01: Murder For Murder He exposed the serial killing
      gambling and investigated the Killer Killer.Danganronpa Gaiden Killer Killer;
      Chapter 06: Possibility Of Despair Even before graduating from Hope''s Peak
      Academy, Juzo won the World Championship, earning him the title of Ultimate
      Boxer. He predominantly fights with a southpaw (left-handed) stance but can
      likely fight both southpaw and orthodox (right-handed) due to his boxing prowess.
      He won at least one more championship before putting his career on hold to help
      Kyosuke investigate the Academy. According to Misaki Asano, after the Tragedy,
      Juzo gained a reputation as the most aggressive person in Future Foundation,
      known for his short temper and boxing talent. He is said to be able to take
      down countless Ultimate Despairs using only his fists and is shown to be capable
      of incapacitating a target with a single punch)'
    source_ids:
    - vsbattles-juzo-sakakura-unknown
    confidence: 0.6
    notes: auto_repair source extraction
