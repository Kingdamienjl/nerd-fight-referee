- id: claim-weaknesses-a59e7ba1
  section: weaknesses
  axis: weakness
  text: Juzo is generally described as very incompetent, with his boxing skills being
    his only good point. He is obstinate and violent, resorting to violence most of
    the time if things go haywire, and that same attitude got Daisaku Bandai killed
    unnecessarily in the Final Killing Game. Refuses to use weapons in a fight, seeing
    them as mere cowardice and stupidity. He is also short-tempered, easily provoked,
    and not very honest with himself at times, which results to the men under him
    getting fed up and some of them even becoming serial killers in the process, just
    for the sake of "revenge".
  source_ids: *id003
