    - field: attack_potency
      value: "Large Town level (As Mr. 0 partner, Robin is superior to Mr. 1 and Mr.\
        \ 2. Didn't consider Pell's strength to be particularly noteworthy after defeating\
        \ him. Implied to be comparable to Skypiea Arc Monster Trio and superior to\
        \ Chopper), higher with more arms (Overpowered Yama and made him cough blood\
        \ after slamming him into a tree) | Large Mountain level (Can restrain a powerful\
        \ zombie like Jigoro, albeit briefly, who had Zoro\u2019s strength. If it\
        \ wasn't for Gecko Moria\u2019s ability to switch places with his shadow,\
        \ she likely would have snapped his back), higher with Cien Fleur (With hundred\
        \ arms, she could restrain powerful characters like Oars) | Island level (Inflicted\
        \ damage on Vegapunk's second dragon, which is stronger than Dragon Number\
        \ Thirteen which could take attacks from Gear 2nd Luffy), Island level+ with\
        \ Mil Fleur (Casually deflected a sword strike from Diamante) | At least Island\
        \ level (Drew blood from and wounded Black Maria with a Gigantesco Mano SpankOne\
        \ Piece Vol. 100 Chapter 1005), Country level with Gigante Fleur (Harmed Hybrid\
        \ Form Black MariaOne Piece Vol. 101 Chapter 1020), far higher with Demonio\
        \ Fleur (Far stronger than beforeOne Piece Vol. 101 Chapter 1021) | Moon level\
        \ (Shaka deduced that alongside Zoro, Nico Robin would be able to instantly\
        \ take out both Lilith and a horde of Sea Beast WeaponsOne Piece Vol. 105\
        \ Chapter 1062188.362 Exatons), far higher with Gigante Fleur, even higher\
        \ with Demonio Fleur"
      source_id: mediawiki-11229
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: Massively Hypersonic+ (Dodged an attack from Crocodile. Should be comparable,
        if not superior to, her ex-subordinates Daz Bonez, Zala, and Bon Clay), presumably
        instant when creating/dispersing body parts with the Hana-Hana no mi | Relativistic
        (Pulled Nami out of the way of a Gomu Gomu no Pistol from OarsOne Piece Vol.
        49 Chapter 475, and saved Luffy from an attack from Monster Point Chopper)
        | Relativistic+ (Captured Hakuba immediately after noticing him, intercepted
        an attack from Trebol, and repeatedly outsped Diamantes attacks while protecting
        Rebecca. Got inbetween the fight of Jinbe and G2nd Luffy) | At least Relativistic+
        (Faster than before) | Relativistic+ (Faster than before. Should be at least
        as fast as Usopp and Nami)
      source_id: mediawiki-11229
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: durability
      value: Town level (Her duplicate limbs are used in every single one of her attacks,
        and her real body feels any damage they take) | Town level (Comparable to
        her Attack Power) | Large Mountain level (Restricted the monstrous Oars without
        feeling any strain in her arms) | Island level (Scaling to her Attack Potency)
        | Country level (Took hits from Hybrid Black Maria)
      source_id: mediawiki-11229
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: stamina
      value: Superhuman (Has handled many armed soldiers with her hands with no showings
        of fatigue and was stabbed by Crocodile and survived. Fought Yama and took
        several attacks from his Axe Dials in order to protect Skypiea's ruins. After
        repeatedly beaten by Spandam while trapped in seastone handcuffs (which included
        his elephant sword Funkfreed in its animal form driving her hard enough into
        a wall to leave a crater), once freed she went on to beat him up and help
        fight off over 200 marine officers. She was stabbed in the shoulder with a
        giant ice pick by Monet and showed no signs of being hurt throughout the rest
        of the arc. Protected Rebecca from Diamante's Death Enjambre while being severely
        injured in the process)
      source_id: mediawiki-11229
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: range
      value: As far as she can see, although has occasionally demonstrated the ability
        to sprout body parts in places she can't see.
      source_id: mediawiki-11229
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Genius (Nico Robin is extremely intelligent with extensive knowledge
        of the world, especially in regard to historical matter, remarkably insightful
        and very experienced in the use of her Devil Fruit ability. A child prodigy,
        she passed her archaeological exams to become a certified scholar at the young
        age of 8, and also taught herself to read the ancient texts on the poneglyphs.
        She learned these skills on her own by researching in the library of Ohara,
        done without any help from Professor Clover or the rest of her adult colleagues.
        As the Vice President of Baroque Works, her intellect along with her leadership
        had been 'invaluable' to the organization, according to Crocodile himself.
        Due to living most of her life on the run from the Marines and the World Government,
        she is a skilled and battle-hardened combatant, being able to hold her own
        against opponents that are faster and stronger than she is. During her training
        with the Revolutionary Army, under the tutorage of Koala and Sabo, she learned
        to incorporate both the fundamentals of Gyojin Karate and Ryusoken into her
        usual fighting style)
      source_id: mediawiki-11229
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Standard Devil Fruit users weaknesses. She feels anything her duplicate\
        \ limbs feels, will take damage to her real body if they\u2019re attacked,\
        \ can't create limbs where there is not enough room and while each part is\
        \ capable of that part\u2019s normal movements, the body part itself is bound\
        \ to where it was sprouted from, she refuses to fight in places where there\
        \ are ancient artifacts and leaves herself vulnerable to her opponent\u2019\
        s attacks. She can only fly for 5 seconds (though this was before the timeskip,\
        \ it hasn't been confirmed if she's improved her flight time or not after\
        \ her training)."
      source_id: mediawiki-11229
      provider_id: vsbattles
      authority: high
      confidence: 0.75
