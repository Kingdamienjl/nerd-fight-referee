- id: claim-weaknesses-e14004fd
  section: weaknesses
  axis: weakness
  text: "Standard Devil Fruit users weaknesses. She feels anything her duplicate limbs\
    \ feels, will take damage to her real body if they\u2019re attacked, can't create\
    \ limbs where there is not enough room and while each part is capable of that\
    \ part\u2019s normal movements, the body part itself is bound to where it was\
    \ sprouted from, and typically remains stationary when using her powers though\
    \ she doesn't have to. Because of her reverence for history and the past, she\
    \ refuses to fight in places where there are ancient artifacts and leaves herself\
    \ vulnerable to her opponent\u2019s attacks. She can only fly for 5 seconds (though\
    \ this was before the timeskip, it hasn't been confirmed if she's improved her\
    \ flight time or not after her training)."
  source_ids: *id003
  decisive: false
