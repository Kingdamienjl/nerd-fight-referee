power_scale:
  tier:
    text: High 7-C, higher with more arms
    source_ids: &id002
    - mediawiki-11229
    confidence: 0.8
  attack_potency:
    text: Large Town level (As Mr. 0 partner, Robin is superior to Mr. 1 and Mr. 2.
      Didn't consider Pell's strength to be particularly noteworthy after defeating
      him. Implied to be comparable to Skypiea Arc Monster Trio and superior to Chopper),
      higher with more arms (Overpowered Yama and made him cough blood after slamming
      him into a tree)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively Hypersonic+ (Dodged an attack from Crocodile. Should be comparable,
      if not superior to, her ex-subordinates Daz Bonez, Zala, and Bon Clay), presumably
      instant when creating/dispersing body parts with the Hana-Hana no mi
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: "Class G (Capable of disarming Alabasta Arc Roronoa Zoro) | At least Class\
      \ T (Could restrain a powerful zombie like Jigoro, albeit briefly, who possess\
      \ Zoro\u2019s strength), higher with Cien Fleur (Moved the entire mass like\
      \ one gigantic arm, grabbed Oars' arm, and performed a Clutch move on Oars'\
      \ arm with it) | At least Class T (Held down Hakuba), higher with Mil Fleur\
      \ (Casually deflected a sword strike from Diamante) | At least Class T (Stronger\
      \ than before), higher with more arms, far higher with Demonio Fleur (Could\
      \ restrain Hybrid Form Maria)"
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Town level
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Town level (Her duplicate limbs are used in every single one of her attacks,
      and her real body feels any damage they take)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Has handled many armed soldiers with her hands with no showings
      of fatigue and was stabbed by Crocodile and survived. Fought Yama and took several
      attacks from his Axe Dials in order to protect Skypiea's ruins. After repeatedly
      beaten by Spandam while trapped in seastone handcuffs (which included his elephant
      sword Funkfreed in its animal form driving her hard enough into a wall to leave
      a crater), once freed she went on to beat him up and help fight off over 200
      marine officers. She was stabbed in the shoulder with a giant ice pick by Monet
      and showed no signs of being hurt throughout the rest of the arc. Protected
      Rebecca from Diamante's Death Enjambre while being severely injured in the process)
    source_ids: *id002
    confidence: 0.8
  range:
    text: As far as she can see, although has occasionally demonstrated the ability
      to sprout body parts in places she can't see.
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Genius (Nico Robin is extremely intelligent with extensive knowledge of
      the world, especially in regard to historical matter, remarkably insightful
      and very experienced in the use of her Devil Fruit ability. A child prodigy,
      she passed her archaeological exams to become a certified scholar at the young
      age of 8, and also taught herself to read the ancient texts on the poneglyphs.
      She learned these skills on her own by researching in the library of Ohara,
      done without any help from Professor Clover or the rest of her adult colleagues.
      As the Vice President of Baroque Works, her intellect along with her leadership
      had been 'invaluable' to the organization, according to Crocodile himself. Due
      to living most of her life on the run from the Marines and the World Government,
      she is a skilled and battle-hardened combatant, being able to hold her own against
      opponents that are faster and stronger than she is. During her training with
      the Revolutionary Army, under the tutorage of Koala and Sabo, she learned to
      incorporate both the fundamentals of Gyojin Karate and Ryusoken into her usual
      fighting style)
    source_ids: *id002
    confidence: 0.8
