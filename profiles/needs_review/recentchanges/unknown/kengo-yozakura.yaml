  intelligence:
    text: 'Gifted (Is one of the most intelligent and cunning spies in the world and
      the strongest member of the Yozakura family, often called gifted or a genius
      even by other talented spies. Managed to pass the bronze exam at only 6 years
      old, which would have required a deep understanding of many combat scenarios,
      spy work, math, and critical thinking as well as having a less than 1% pass
      rate. This test gave Taiyo Asano, when he was 16 years old, trouble in the written
      section. All the other participants were much older than him. Kengo has also
      been shown to be able to fight in sync with Yozakuras such as Taiyo. Such as
      when he wore multiple layers of disguise and dropped a doll in the water when
      sea water was rushing into the hull in order to get Shinzo to lower his guard.
      Allowing Taiyo to strike from behind. Even switching places in ways unnoticeable
      in intervals as brief as both of them stumbling backwards. The Yozakura family
      also struggles to catch him whenever he''s running away from them and causing
      trouble. Being able to disguise himself as a painting and not being found by
      Nanao, Shion or Shinzo. Since Kengo knows he is not suited to head on physical
      fights he will always ideally seek to use trickery to win. When he and Taiyo
      were assigned the task of subduing Shinzo. Understanding he was weaker, he not
      only could predict Shinzo''s likely attacks days in advance for the operation
      but came up with a plan to get close enough to use Assimilation on him despite
      Shinzo being strong enough to beat both of them in one hit respectfully. He
      decided to use Assimilation as his blooming can interface with minds, with Shinzo
      being mind controlled at the time. Then correctly deduced Momo''s dreams worked
      by blocking out memories and inserting fake ones, thus sharing his own memories
      with Shinzo would break the control.Mission: Yozakura Family; Vol. 18; Chapter
      151: Shinzo''s Memories Against Hulang he aimed to exploit her weakness in that
      she always hesitates when it comes to hitting children to disguise himself as
      his child self so he could get close enough to try Assimilation. Knowing it
      was the one way of contact that also bypassed Asa''s eyes he had grown across
      Teiou academy to spy on Hulang)'
    source_ids:
    - vsbattles-kengo-yozakura-unknown
    confidence: 0.6
    notes: auto_repair source extraction
