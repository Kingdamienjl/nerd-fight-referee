- id: claim-weaknesses-2610c905
  section: weaknesses
  axis: weakness
  text: 'Cissia does not actively enjoy fighting, especially against opponents who
    she deems to be threats. She will actively avoid engaging in combat if possible,
    and is more than willing to run if it means avoiding conflict,Phaethon''s Story;
    Season 2 Epilogue "New: Eridan Sunset (A)" though she has become more willing
    to put herself on the front lines to fight, especially in order to defend people
    she cares about.Phaethon''s Story; Season 2 Epilogue "New: Eridan Sunset (A)"
    Snake Thirens like herself are also vulnerable to sudden temperature changes,
    as she states herself to be cold-blooded. Sudden temperature rises can make her
    susceptible to heatstroke,In-Game Event; "Chronicles of Simmering Flavors" and
    sudden temperature drops can make her vulnerable to colds.Quality Time Event;
    "Divination Readings are Like Body Temperature" {| class="mw-collapsible mw-collapsed"
