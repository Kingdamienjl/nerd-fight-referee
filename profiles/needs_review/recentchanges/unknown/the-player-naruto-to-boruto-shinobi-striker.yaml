    \ Tomoe Sharingan, 3 Tomoe Sharingan, Izanami & Izanagi, Mangeky\u014D Sharingan,\
    \ and Susano'o Abilities, Has access to all of Kakashi's Mangeky\u014D Sharingan\
    \ Abilities, Can use all Deva Path Abilities like Limited Levitation (The Deva\
    \ Path allows the user to levitate), Gravity Manipulation, Telekinesis, and Sealing\
    \ (The Deva Path allows the user to control attractive and repulsive forces, in\
