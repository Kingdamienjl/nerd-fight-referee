    - field: standard_equipment
      value: '*Monocle: A completely normal monocle he always wears, giving an intelligent
        impression. Although it is not special in any way, wearing it allows Clind
        to shift his mindset and conceal his draconic characteristics. *Witch Factor
        of Tristitia: Clind has been entrusted with the safekeeping of the Witch Factor
        of Tristitia, which is incompatible with all others save for its previous,
        deceased holder. The Factor is stored in a black box on Clind''s person, and
        he won''t hesitate to make use of the Authority it grants in battle.'
      source_id: vsbattles-clind-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: 'Genius (Clind is one who possesses a beyond-human intellect, and gives
        off an intellectual impression.Tanpenshuu 11, Elegant Lesson He is blessed
        with exceptional talents, a master of his own abilities who can freely switch
        how he fights on the fly. Clind is the ultimate steward, having trained maids
        such as Ram and Frederica, and his abilities as a butler overwhelms others.One
        Day II, Chapter 6 Clind can read others so well that he can respond to their
        unvoiced thoughts.Meili''s Witchbeast Observation Record II He is also an
        excellent teacher, having taught Subaru how to: silence his footsteps; perform
        parkour; distinguish edible wild plants;Arc 7, Chapter 1, "Initiation" perform
        first-aid;Volume 18, Chapter 1, "Fighting a Losing Battle" and wield the whip
        at a level of mastery where he can use either hand or even just two fingers.
        Clind''s own mastery of the whip is to such a degree that he can strike the
        tip of Subaru''s whip mid-flight with his own whip, and he is even capable
        of swordsmanship) Standard Tactics: Clind is unflinching and merciless when
        he is intent on killing a target. He will not hesitate to injure or kill people
        who oppose him with good intentions, and he will unflinchingly kill his enemies.
        Although it pains him to do so, if necessary he will even maim people he cares
        for in order to carry out his task. Typically he will aim to fatally crush
        the heart of his opponent with Compression, or if that is not possible he
        will use it to erase the space they occupy instead.'
      source_id: vsbattles-clind-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "As he is incompatible with the Witch Factor of Tristitia, Clind requires\
        \ compensation in order to use Compression, else he may be punished by Od\
        \ Lagna. The phenomenon of Compression is simply the compaction of feasibly\
        \ achievable events, making its possible uses far narrower unless the target\
        \ consented to its effects or was caught off-guard. Notable Attacks/Techniques:\
        \ Authority of Tristitia: Compression: Clind is in possession of the Witch\
        \ Factor of Tristitia, allowing him to wield its Authority. The Authority\
        \ allows the wielder to Compress different concepts, namely space and time:\
        \ *Teleportation: Clind can perform an extremely long-ranged warp by Compressing\
        \ the distance between two locations, and the time required to travel, resulting\
        \ in a form of instantaneous transportation. He can simultaneously warp multiple\
        \ people, including several dragon carriages, across thousands of kilometers\
        \ so long as they are within the Kingdom of Lugunica, and do not encounter\
        \ obstacles in the form of spatial distortions. This Compression is restricted\
        \ to affecting those who consent to being warped, or are caught by surprise,\
        \ making its use in combat somewhat limited. Additionally, due to Clind being\
        \ incompatible with the Witch Factor, exercising the Authority's Compression\
        \ requires payment to be made to Od Lagna for its permission, in the form\
        \ of offering \"possibilities\". *Dissipation: Clind was able to carve out\
        \ and erase pockets of space itself, causing the surrounding space to vanish\
        \ and swallow whatever is unlucky enough to be in the targeted space along\
        \ with it. While he has a habit of clenching his palm when using it, this\
        \ is unnecessary to actually activating the ability. It is unknown if Clind\
        \ must pay compensation to use this ability, although he isn't at all hesitant\
        \ in using it in comparison to his teleportation. *Crushing: Clind utilized\
        \ a seemingly telekinetic force to twist and crush people or objects\u2014\
        \ this is in reality a small-scale Compression of space. With a mere thought,\
        \ he can destroy his target's limbs, body, and even internal organs, with\
        \ even powerful opponents being unable to avoid or defend against it. By crushing\
        \ his opponent's heart, he could induce a more subtle certain-death even at\
        \ a distance. It is unknown if Clind must pay compensation to use this ability,\
        \ although he isn't at all hesitant in using it in comparison to his teleportation.\
        \ Draconic Power: Clind is the dragonkin of the strongest Dragon, and as such\
        \ has been endowed with similarly transcendent abilities as an ultimate lifeform.\
        \ Clind's power is so great that he can battle against the dragonhusk that\
        \ birthed him as an equal, truly embodying his nature at the apex of all life.\
        \ *Sealing Shackle: Unleash Second Stage: Clind concentrates power at his\
        \ black horns, imbuing his entire body with nigh-invulnerability on par with\
        \ the Divine Dragon, allowing him to weaponize his sturdiness. He can also\
        \ concentrate his power to develop a vallum against magical attacks which\
        \ rivals the might of the Dragon's dragonhalo. *Sealing Shackle: Unleash Third\
        \ Stage: The pinnacle of Clind's power as the dragonkin of the Divine Dragon.\
        \ At this stage, he becomes a living comet with a tail of violet lightning,\
        \ allowing Clind to deliver a blow with maximum strength at maximum speed,\
        \ which pierced the reverse-scale of the Divine Dragon. *Purple Lightning:\
        \ Originally an astonishing defensive ability, Clind is wreathed in violet\
        \ electricity which he is masterful in manipulating beyond its true purpose.\
        \ Clind used this lightning to heighten his combat abilities; kicking off\
        \ of bursts of lightning to fly at unthinkable speeds, strengthening his strikes\
        \ with eruptions of thunder, and firing destructive bolts at range. *Dragonhusk\
        \ Possession: As its dragonkin, Clind can freely fill up Volcanica's dragonhusk\
        \ with his own ego. Clind can draw out the full potential of Volcanica's dragonhusk,\
        \ and was known to possess it in order to carry out the Covenant between Lugunica\
