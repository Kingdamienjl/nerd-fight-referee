- id: claim-weaknesses-2e0ed455
  section: weaknesses
  axis: weakness
  text: "As he is incompatible with the Witch Factor of Tristitia, Clind requires\
    \ compensation in order to use Compression, else he may be punished by Od Lagna.\
    \ The phenomenon of Compression is simply the compaction of feasibly achievable\
    \ events, making its possible uses far narrower unless the target consented to\
    \ its effects or was caught off-guard. Notable Attacks/Techniques: Authority of\
    \ Tristitia: Compression: Clind is in possession of the Witch Factor of Tristitia,\
    \ allowing him to wield its Authority. The Authority allows the wielder to Compress\
    \ different concepts, namely space and time: *Teleportation: Clind can perform\
    \ an extremely long-ranged warp by Compressing the distance between two locations,\
    \ and the time required to travel, resulting in a form of instantaneous transportation.\
    \ He can simultaneously warp multiple people, including several dragon carriages,\
    \ across thousands of kilometers so long as they are within the Kingdom of Lugunica,\
    \ and do not encounter obstacles in the form of spatial distortions. This Compression\
    \ is restricted to affecting those who consent to being warped, or are caught\
    \ by surprise, making its use in combat somewhat limited. Additionally, due to\
    \ Clind being incompatible with the Witch Factor, exercising the Authority's Compression\
    \ requires payment to be made to Od Lagna for its permission, in the form of offering\
    \ \"possibilities\". *Dissipation: Clind was able to carve out and erase pockets\
    \ of space itself, causing the surrounding space to vanish and swallow whatever\
    \ is unlucky enough to be in the targeted space along with it. While he has a\
    \ habit of clenching his palm when using it, this is unnecessary to actually activating\
    \ the ability. It is unknown if Clind must pay compensation to use this ability,\
    \ although he isn't at all hesitant in using it in comparison to his teleportation.\
    \ *Crushing: Clind utilized a seemingly telekinetic force to twist and crush people\
    \ or objects\u2014 this is in reality a small-scale Compression of space. With\
    \ a mere thought, he can destroy his target's limbs, body, and even internal organs,\
    \ with even powerful opponents being unable to avoid or defend against it. By\
    \ crushing his opponent's heart, he could induce a more subtle certain-death even\
    \ at a distance. It is unknown if Clind must pay compensation to use this ability,\
    \ although he isn't at all hesitant in using it in comparison to his teleportation.\
    \ Draconic Power: Clind is the dragonkin of the strongest Dragon, and as such\
    \ has been endowed with similarly transcendent abilities as an ultimate lifeform.\
    \ Clind's power is so great that he can battle against the dragonhusk that birthed\
    \ him as an equal, truly embodying his nature at the apex of all life. *Sealing\
    \ Shackle: Unleash Second Stage: Clind concentrates power at his black horns,\
    \ imbuing his entire body with nigh-invulnerability on par with the Divine Dragon,\
    \ allowing him to weaponize his sturdiness. He can also concentrate his power\
    \ to develop a vallum against magical attacks which rivals the might of the Dragon's\
    \ dragonhalo. *Sealing Shackle: Unleash Third Stage: The pinnacle of Clind's power\
    \ as the dragonkin of the Divine Dragon. At this stage, he becomes a living comet\
    \ with a tail of violet lightning, allowing Clind to deliver a blow with maximum\
    \ strength at maximum speed, which pierced the reverse-scale of the Divine Dragon.\
    \ *Purple Lightning: Originally an astonishing defensive ability, Clind is wreathed\
    \ in violet electricity which he is masterful in manipulating beyond its true\
    \ purpose. Clind used this lightning to heighten his combat abilities; kicking\
    \ off of bursts of lightning to fly at unthinkable speeds, strengthening his strikes\
    \ with eruptions of thunder, and firing destructive bolts at range. *Dragonhusk\
    \ Possession: As its dragonkin, Clind can freely fill up Volcanica's dragonhusk\
    \ with his own ego. Clind can draw out the full potential of Volcanica's dragonhusk,\
    \ and was known to possess it in order to carry out the Covenant between Lugunica\
    \ and the Divine Dragon. ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ ==References== ==Notes and Explanations== Category:Re:Zero kara Hajimeru Isekai\
    \ Seikatsu Category:Male Characters Category:Butlers Category:Dragons Category:Longevity\
    \ Users Category:Inorganic Beings Category:Supernatural Willpower Users Category:Precognition\
    \ Users Category:Enhanced Senses Users Category:Extrasensory Perception Users\
