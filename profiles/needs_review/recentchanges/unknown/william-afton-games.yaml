- id: claim-powers-and-abilities-0b5dcaf4
  section: abilities
  axis: hax
  text: '*Possibly Superhuman Physical Characteristics *Genius Intelligence *Stealth
    Mastery *Power Bestowal of Soul & Mind (Created the S.C.U.P.E.R, a machine which
    injects remnant) *Social Influencing (Charisma; Convinced children to follow him
    into the saferoom. Five Nights at Freddy''s Would later get away with building
    the funtime animatronics with ways to kill children in spite of engineers approaching
    him about the designs) *Summoning (Can summon Shadow Freddy) *Likely Remnant (Low-Tier;
    Due to already having found out of Remnant, and creating the funtime animatronics
    to collect the substance, William likely would have been infused with Remnant
    at this point) All abilities from before, plus: *Agony (Peak-Tier) **Possibly
    Illusion Creation and Greater Technology Manipulation (Implied to be the one behind
    the apparition of the Phantom Animatronics, who can make the audio, camera, and
    ventilation systems malfunction) *Superhuman Physical Characteristics *Cyborgization
    (Normal; Springtrap is not fully inorganic, as there''s a corpse inside of him)
    *Minor Body Control (Is capable of switching from animatronic mode to suit modeFive
    Nights at Freddy''s 3 Phone calls) *Supernatural Willpower (Survived his entire
    body being crushed from animatronic parts in the saferoom and left to rot for
    30 years without losing any semblance of sanity) *Enhanced Stealth Mastery (Far
    better than other animatronics in the series, capable of hiding himself from the
    view of cameras, similar to another animatronic in the series) Resistance to:
    *Electricity Manipulation (Is in better condition than his FNaF 6 self, who can
    remain operational after being hit with a controlled shock, something that usually
    disables electronics) *Invisibility (Via Animstealth Module) *Teleportation (Via
    the Plushtrap CPU; Brings the player to a new location altogether when encountered)
    *Statistics Amplification (Via Servo Boosters; Increases Springtrap''s speed in
    camera mode) *Fire Manipulation (As Flaming Springtrap) *Poison Manipulation (As
    Toxic Springtrap) All abilities from before, plus: *Bodily Weaponry *Enhanced
    Stealth Mastery (Like other scrap animatronics, Afton is able to hide inside marked
    down objects to get inside the pizzeria early) Same as when he was alive, plus:
    *Resurrection (At least Mid to High-Mid; Is brought back to life with no wounds
    from animatronic attacks, which include being torn apart, sliced to bits, and
    skull damage]) *Immortality (Types 1 & 8; Jack-O-Chica implies that William will
    live for eternity. Ultimate Custom Night Is presumably being brought back by The
