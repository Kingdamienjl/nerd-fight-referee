- id: claim-powers-and-abilities-a4de9323
  section: abilities
  axis: hax
  text: "Base \u25BE= Superhuman Physical Characteristics, Enhanced Senses, Regeneration\
    \ (Low-mid), Immortality (Types 1, 3 and 7; Vampires' bodies are already dead.The\
    \ Harvest They have eternal life and can regenerate wounds that are fatal), Blood\
    \ Drinking, Martial Arts and Weapon Mastery (Angel was a highly skilled combatant\
    \ and generally fought unarmed, using circular attacks such as spinning kicks\
    \ and back hands. His fighting style takes from Karate, Hapkido, Taekwondo, Muay\
    \ Thai, Brazilian JiuJitsu, Wushu, Boxing, Wrestling and Tai Chi. In addition\
    \ to his proficiency in many forms of martial arts, he mastered many varieties\
    \ of weapons, favoring broadswords and sometimes axes. He was even more dangerous\
    \ without a soul, when he would fight with no remorse. During his lifetime, Angel\
    \ successfully stood up to and defeated a wide variety of powerful and skilled\
    \ opponents, including Buffy Summers, Faith Lehane, Marcus Hamilton, Riley, and\
    \ Connor, amongst others Additionally, Angel beat Spike on numerous occasions,\
    \ only losing to his prot\xE9g\xE9 once in their century plus association. Following\
    \ Darla being sired by Drusilla, a cold, ruthless and driven Angel was shown to\
    \ have single-handedly defeated around twenty vampires and demons in one fight.\
    \ Angel was also able to physically dominate The Beast, forcing the demon to its\
    \ knees before finally succumbing to The Beast's strength), Acrobatics (Angel\
    \ often uses acrobatics), Self-Sustenance (Type 1 and 2; Vampires do not breathe\
    \ and can survive for an indefinite period of time without feeding.), Empathic\
    \ Manipulation (Vampire bites trigger the pleasure centers of the victim, meaning\
    \ most don't even fight back when they're being bitten. Angel exploits this to\
    \ calm down Willow who's been taken over by dark magic), Telepathy (He has a psychic\
    \ bond with those he transforms), Immense Pain Tolerance (Vampires can feel pain,\
    \ but don't hold back because of it), Stealth Mastery (Infiltrates Wolfram & Hart\
    \ despite the heavy security and vampire detectors. Sneaks into Lilah's office\
    \ and behind her without getting noticed), Multilingualism, Photographic Memory\
    \ (Can mentally recreate a scene from last night, recalling the actions of the\
    \ people present including where they were seated. Recalls a specific code he\
    \ saw months ago), Social Influencing (In an elaborate ruse to get information\
    \ out of Faith, Angel pretends to be his evil counterpart Angelus to gain her\
    \ trust. Impersonates a detective to enter a crime scene. Impersonates a well-known\
    \ vampire to infiltrate a bank heist), Multiple Selves (Type 2; Angel, Angelus\
    \ (the soulless and evil version of Angel) and the demon share the same body.),\
    \ Perception Manipulation (As a vampire, he should be comparable to Spike), Transformation\
    \ (Angel reveals his vampire face), Corruption (Type 1; Vampires can turn people\
    \ into vampires), Statistics Amplification (Angel can amp up his own stats by\
    \ drinking the blood of his opponents. He uses this to defeat Marcus Hamilton\
    \ after he bragged about his blood being filled with the ancient power of the\
    \ Senior Partners), Information Analysis (As a vampire, he should be comparable\
    \ to Spike), Instinctive Action (Vampires have instincts that help them in fights.\
    \ Angel, even while suffering from amnesia and believing himself to be a teenager,\
    \ managed to defeat Connor by fighting purely on instinct), Bodily Weaponry (Vampires\
    \ have claws and fangs that they use in battle), Magic and Exorcism (Angel can\
    \ cast exorcism spells), Extrasensory Perception (Vampires can sense each other)\
    \ Extrasensory Perception (Due to his undead body, Angel lacks the usual life\
    \ signs. He uses this to defeat a blind assassin whose ability to sense other's\
    \ life signs made her a difficult combatant), Possession (His demon self stops\
    \ Eyghon the Sleepwalker from possessing his body. The two demonic entities battle\
    \ and Angel's demon side is the victor), Empathic Manipulation (Limited; He was\
    \ unimpressed by Billy Blim's power to promote misogyny), Soul Manipulation (Vampires\
    \ don't have souls), Poison Manipulation (Because he doesn't need oxygen to live,\
    \ he is completely unaffected by a gas leak. Is immune to the effects of a deadly\
    \ gas. Can survive in atmospheres that would be harmful to humans. Is unaffected\
    \ by a demon's venom), Telepathy (Resisted Buffy's telepathy), Mind Manipulation\
    \ Absorption (Vampires' minds cannot be absorbed), Temperature Manipulation (Travels\
    \ through freezing waters for several hours. Resists Amy's freezing spell), Electricity\
    \ Manipulation (Resists Gwen's electrical attacks. ( She has the potential to\
    \ fry somebody alive via physical contact, yet she fails to even phase him despite\
    \ her efforts. Puts his hand through an electric field for a few seconds. This\
    \ field can incinerate demons, but Angel doesn't have a mark on him), Disease\
    \ Manipulation (Vampires don't get sick), Sleep Manipulation (Vampires can resist\
    \ sleeping spells if they want to), Perception Manipulation (As a vampire, he\
    \ should be comparable to Spike) Twilight'"
