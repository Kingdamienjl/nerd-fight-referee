- id: claim-weaknesses-300c685d
  section: weaknesses
  axis: weakness
  text: 'Beat''s capacity to summon Silence using music is presumably unique to the
    HARM world, and is not necessarily applicable to battles in other settings. Silences
    are liable to attack Beat as well as whoever else is in the vicinity. Silence
    Dampeners give Beat headaches and make her nauseousEpisode 2 & Episode 4, Silence
    Dampeners. Note: Matchups should specify whether or not Beat is fighting inside
    of the HARM world, as abilities related to producing Silence are usually not relevant
    outside of the setting.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-ce994b3b
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Acrobatics (Capable of highly flexible
    mid-air movementEpisode 2, Giant Silence boss fight), limited Flight (Capable
    of hovering in the airAll Episodes, High Hold Notes in combat), Regeneration (Low;
    capable of healing from bruises and minor combat wounds in seconds, leaving them
    imperceptible, and rapidly recovered from being smashed through HARM tower at
    a rate Sforzando was surprised byEpisode 5, Rest boss fight) Danmaku, Void Manipulation,
    Spatial Manipulation, Reality Warping, and Non-Physical Interaction (Can create
    waves of Silence by playing music, holes in the fabric of reality made of nothingEpisode
    6, Sforzando pocket dimension conversation, frequently using these to overwhelm
    enemies>Episode 5, DC, Poco, and Apoco boss fight and attacking the Silence along
    the way), Pocket Reality Manipulation (Capable of travelling through the Silence
    pocket dimensions), Nonexistent Physiology (Type 1), Subjective Reality, Supernatural
    Willpower and possibly Invulnerability (Beat is comprised of 99% Silence, holes
    in the fabric of reality where nothing exists that take shape based on the feelings
    of the people witnessing them. Sforzando states that Beat's willpower is the only
    thing allowing her to shape herself into her tangible form. Sforzando also explicates
    that, because she perceives Beat as being essentially non-existent, she expects
    a bullet fired from her gun would have no effectEpisode 5, Sforzando boss fight),
    Resistance to Subjective Reality (As a Silence that has learned to think about
    itself, Beat is a self-perpetuating Silence who is unaffected by other people's
    perception of her formEpisode 5, Sforzando notes), BFR (Returned to the HARM world
    after being sent back to her original world, despite Sforzando stating she would
    disappear from reality), Void Manipulation and Existence Erasure (Capable of standing
    inside the Silence pocket dimensions, destructive holes in reality that turn things
    into nothing, without being destroyedEpisode 6, Silence pocket dimensions), and
    likely Radiation Manipulation (Sforzando states that she doubts it's possible
    for Beat to get skin cancer from ionising radiationEpisode 5, Sforzando at the
    top of HARM tower)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
