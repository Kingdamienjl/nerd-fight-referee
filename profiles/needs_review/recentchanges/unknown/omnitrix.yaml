- id: claim-range-aed247aa
  section: power_scale
  axis: range
  text: "Several Meters for Post-reconfiguration Omnitrix and Ultimatrix with Scan\
    \ Mode, Several Meters with scan mode Planetary with DNA detection for Omnitrix\
    \ (Omniverse) (The Omniverse Omnitrix was initially unable to scan Lord Transyl\u2019\
    s DNA sample because they were leaving the planet. When Ben later returned to\
    \ the planet, the Omnitrix successfully acquired the DNA sample.), at least Planetary\
    \ range with DNA Recombination, Complex Multiverse level, likely Hyperverse level\
    \ with Self-Destruct Mode Weaknessess: in its Pre-Reconfigurated model, the Omnitrix\
    \ could only transform its user for 10 minutes, needed to recharge and will give\
    \ Ben the wrong alien from time to time (not always though), this disappears if\
    \ the Omnitrix glitches or Master Control is unlocked | The Post-Reconfiguration\
    \ Omnitrix doesn't have any of tanging knesses, although quick changing too much\
    \ may the battery run out faster | The Ultimatrix normally enters a lockdown while\
    \ in Scan Mode; however, under certain circumstances\u2014such as when Ben is\
    \ already transformed into an alien\u2014it will not lock itself and will instead\
    \ scan the DNA sample while Ben remains in that alien form. The Ultimatrix had\
    \ the problem of shutting down all its functions if a new DNA sample was close,\
    \ but that stopped happening after Azmuth fixed it, since it didn't lock itself\
    \ when in proximity to the Prisoner 775. | The new Omnitrix will timeout after\
    \ a 10 to 15 minutes period, with this varying if Ben's in danger, and doesn't\
    \ need to recharge after transforming back anymore, as Ben can go alien immediately\
    \ after timing out. If the Omnitrix is out of the detection range it will lock\
    \ itself in 30 seconds if the wielder doesn't go back to the place where DNA is\
    \ located Notable Attacks and Techniques: * Activate Mode: The Omnitrix's default\
    \ mode, allowing the user to transform into an alien recorded within for 10 to\
    \ 20 minutes. However, once this time is up, Omnitrix will go into \"Recharge\
    \ Mode\", locking itself down for a minimum of five minutes in order to prevent\
    \ incorrigible damage to the user's DNA. However, the Omnitrix can instantly recharge\
    \ in the face of sudden, mortal danger in order to protect its wielder. * Capture/Scan\
    \ Mode: When the Omnitrix detects new DNA not present in its records, it can copy\
    \ the DNA of the new sample by making direct contact with the alien or by scanning\
    \ the alien with a visor under the watch's face. * Self-Destruct Mode: The failsafe\
    \ measure put in place should the Omnitrix fall into the wrong hands, it can be\
    \ set to destroy itself with the voice command, \"Omnitrix Self Destruct in (time):\
    \ Command code: 000 - Destruct 0\". After activation, the Omnitrix charges energy\
    \ while counting down until it explodes, with the power of the explosion being\
    \ proportionate to the amount of time spent charging. The Omnitrix can gather\
    \ enough energy in thirty seconds to blast off the arm of Vilgax, but can unleash\
    \ a ripple of energy that can destroy the entire universe if allowed to charge\
    \ for a few days. * Master Control: A function that is only granted by Azmuth\
    \ to users who have used the Omnitrix for a sufficiently long amount of time (or,\
    \ in the case of Ken Tennyson, forcibly modified the device), it allows the user\
    \ to switch between any alien recorded in the Omnitrix with a thought and disables\
    \ the time out function, allowing them to remain transformed indefinitely. * DNA\
    \ Manipulation: In addition to allowing the user to take up the form of other\
    \ aliens, the Omnitrix can alter the biological makeup of others and repair damaged\
    \ genetic structures. This function was able to cure the severe genetic damage\
    \ caused by Xenocyte parasitism and apply the traits of numerous aliens onto the\
    \ Highbreed in order to remedy the genetic stagnation they caused through their\
    \ own inbreeding. The Omnitrix also has hand to hand combat fileBen 10, Ultimate\
    \ Alien, Season 2: Episode 24 Inspector 13, \"Inspector 13\". Note: The mid-end\
    \ is the accepted value for the speed calc. ==References== ==Notes and Explanations==\
