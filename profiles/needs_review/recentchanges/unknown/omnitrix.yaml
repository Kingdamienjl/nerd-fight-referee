    - field: weaknesses
      value: 'The Omnitrix has a cooldown of a few minutes (this disappears if the
        Omnitrix glitches or Master Control is unlocked), it cannot copy aliens that
        lack DNA, are hybrids, came from the same species of the user, or are nonsapient.
        The Self-Destruct Mode needs some days to charge to destroy the universe.
        The Omnitrix will lockdown while in Scan Mode. Notable Attacks/Techniques:
        *Activate Mode: The Omnitrix''s default mode, allowing the user to transform
        into an alien recorded within for 10 to 20 minutes. However, once this time
        is up, Omnitrix will go into "Recharge Mode", locking itself down for a minimum
        of five minutes in order to prevent incorrigible damage to the user''s DNA.
        However, the Omnitrix can instantly recharge in the face of sudden, mortal
        danger in order to protect its wielder. *Capture/Scan Mode: When the Omnitrix
        detects new DNA not present in its records, it can copy the DNA of the new
        sample by making direct contact with the alien or by scanning the alien with
        a visor under the watch''s face. *Self-Destruct Mode: The failsafe measure
        put in place should the Omnitrix fall into the wrong hands, it can be set
        to destroy itself with the voice command, "Omnitrix Self Destruct in (time):
        Command code: 000 - Destruct 0". After activation, the Omnitrix charges energy
        while counting down until it explodes, with the power of the explosion being
        proportionate to the amount of time spent charging. The Omnitrix can gather
        enough energy in thirty seconds to blast off the arm of Vilgax, but can unleash
        a ripple of energy that can destroy the entire universe if allowed to charge
        for a few days. *Master Control: A function that is only granted by Azmuth
        to users who have used the Omnitrix for a sufficiently long amount of time
        (or, in the case of Ken Tennyson, forcibly modified the device), it allows
        the user to switch between any alien recorded in the Omnitrix with a thought
        and disables the time out function, allowing them to remain transformed indefinitely.
        *DNA Manipulation: In addition to allowing the user to take up the form of
        other aliens, the Omnitrix can alter the biological makeup of others and repair
        damaged genetic structures. This function was able to cure the severe genetic
        damage caused by Xenocyte parasitism and apply the traits of numerous aliens
        onto the Highbreed in order to remedy the genetic stagnation they caused through
        their own inbreeding. The Omnitrix also has hand to hand combat file. Category:Tier
        2 Category:Tier 2-B Category:Tier 2-A Category:AkiraAkabane10'
