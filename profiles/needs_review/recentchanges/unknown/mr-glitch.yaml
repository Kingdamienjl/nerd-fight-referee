    changed the game's lore, added DLC, loot boxes, & advertisements, added a wait
    period for resurrection, etc.), possibly Intangibility (Has a gaseous form, which
    has caused him to accidentally enter game elements, Could phase through the ground),
    Flight, Corruption, limited Probability Manipulation (Every time Mr. Glitch tries
    to explain his plan to the User and Game, something occurs to interrupt them from
    hearing it such as a pop-up ad or error), Portal Creation and "Dimensional Travel"
    (Can create portals between different games and to different devices), Possession
    (Accidentally possessed Mr. Wilhelm while entering the Sherlock Holmes game),
    Fourth Wall Awareness, Size Manipulation (A glitchy hammer and monocle could affect
    the sizes of sprites), Creation and Weapon Creation (Created new game elements
    and objects within Legend of the Secret), Mind Manipulation (Forced Legend of
    the Secrets characters to endorse advertisements and to not remember the previous
    version of the game), Statistics Reduction (Greatly reduced Hero's speed, Made
    it so Hero runs out of energy quickly when away from home), Statistics Amplification
    (Can create items that increase stats such as running shoes), Ice Manipulation
    (Created the Super Cold advertisement, the avatar within being cold enough for
    a small portion to freeze an entire lake), Reality Warping (Could prevent the
    User and Game from escaping Legend of the Secret through his portal), Existence
    Erasure (Can delete game elements), Sealing (Could trap Gigi in a different game
    by placing her name in the game's Music Creator slot and destroying it), Electricity
    Manipulation (Could create jolts of electricity from the Wi-Fi router, Escaped
    from the Wi-Fi Router after), Technology Manipulation (After escaping the Wi-Fi
    router, could infect devices across the entire country, creating traffic disturbances
    and resetting the stock market, Brought smart devices to life and made them start
    attacking people, such as a vacuum attacking the creator), Enhanced Senses (After
    escaping the Wi-Fi router and attacking devices across the United States, he could
    still hear the Creator's call with GiGi and Game due to the phone call not being
    ended)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
