- id: claim-weaknesses-130aeb69
  section: weaknesses
  axis: weakness
  text: 'Arrogant. Can be easily distracted by someone like Wander or Lord Dominator.
    Generally prefers rushing at his opponents with brute force rather than making
    strategies to win against them (though in some episodes in the show, this has
    actually worked well before). Is not much of a fighter Feats: * Was initially
    the most powerful villain in the galaxy before Wander showed up. * Demolished
    an army, took down a giant dinosaur singlehandedly, and later punched Emperor
    Awesome with enough power to send him flying through the moon/planet they were
    fighting on ("The Picnic"). ** Though the last part he did this by using one of
    Awesome''s henchmen as a weapon, it is likely possible that he could do this on
    his own. * Actually made Wander the most wanted person in the Galaxy at one point
    (Mentioned in "The Fancy Party"). * Made it into the top ten of the Villain leaderboard....by
    being it ("The It"). ** Hates the color purple so much that he has gone out of
    his way to destroy planets that have that color. ** Reason why was because a girl
    with purple hair turned him down on his date request during his highschool years.
    * Was initially actually doing good at taking over dozens of planets without Peepers
    help ("The Axe"). * Though he lost, went toe to toe against Lord Dominator in
    a epic battle ("The Battle Royale"). * Created the H.A.T.E.R.V....by himself.
    ("The Toy").'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-399a5504
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Energy Manipulation and Projection (As
    shown here), Explosion Manipulation (Can create explosions through his blasts),
    Light Manipulation, Electricity Manipulation (Through his energy powers), Forcefield
    Creation (Could create a forcefield of energy to block Lord Dominator''s attack),
    Telekinesis (Could leviate Lord Dominator), Flight (As shown here), Teleportation,
    Resistance to Fire and Heat (Can emerge from pools of lava unharmed. Can wisthand
    a lava blast from Lord Dominator, although he eventually got overpowered), Rage
    Power/"Power of Hate" (Hater gets more powerful the angrier he gets), Aura (Capable
    of surrounding himself in a green aura of energy), Regeneration (Mid: Of the cartoonish
    variety. Has healed broken bones and scrapes, and has reattached torn off limbs,
    as well as regenerated his head after it exploded), Vehicular Mastery, can talk
    really fast, Non-Physical Interaction (Grabbed Major Threat''s energy beams. Kicked
    his own energy blast)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
