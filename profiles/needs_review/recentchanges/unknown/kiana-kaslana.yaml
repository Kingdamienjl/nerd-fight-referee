      \ Imaginary Renormalization, she was able to destroy] [https://imgur.com/a/IwIhk6t\
      \ The Cocoon of Finality is the only true imaginary singularity and the only\
      \ Herrscher core], [https://imgur.com/a/uKPZXR7 being an undivided, omnipresent\
      \ will]. As [https://imgur.com/a/5VKSpz8 Truth beyond Space and Time], and thus\
