    - field: standard_equipment
      value: "| |-|White Comet= *{{Nihongo|Battlesuit White Comet|\u30FB|Ry\u014D\
        ikis\u014D - Shironeri}}: A 3rd generation Valkyrie battlesuit and part of\
        \ the \"General Purpose Universal Combat Battlesuit\" series. Equipped with\
        \ jet propulsion and military-grade visors, and is effective on most environments.\
        \ *{{Nihongo|Positron Blasters||Y\u014Ddenshi Shuh\u014D}}: A pair of PRI-ARM\
        \ pistols with built-in particle accelerators that emit a beam of positrons\
        \ rather than standard ammunition. Designed to fire a beam of positrons at\
        \ targets in order to trigger electron-positron annihilation upon contact.\
        \ *{{Nihongo|Prototype Godsbane Battlesuit - Knight Moonbeam|\u300C\u30FB\u300D\
        |Ry\u014Dikis\u014D\u30FBShirokishi - Gekk\u014D}}: A prototype 4th generation\
        \ Godsbane-class Valkyrie battlesuit designed to be worn only by S-rank Valkyries.\
        \ High speed gamma particles flowing within the suit can be ejected from the\
        \ back, allowing the Valkyrie to fire gamma beams that can be manipulated\
        \ freely mid-flight. *Gungnir: The \"Gungnir\" particle beam cannon is a special\
        \ anti-Herrscher weapons platform and is one of Kiana's favorite weapons.\
        \ Only available when wearing the Knight Moonbeam battlesuit. |-|Herrscher\
        \ of the Void (Sirin)=All previous items except for the Knight Moonbeam battlesuit.\
        \ |-|Void Drifter= *{{Nihongo|ARC Serratus||Tenk\u016B Ressha}} A pair of\
        \ customized firearms that Kiana created during her wanderings. Infused with\
        \ the Void Authority, its bullets can become immaterial upon firing to pass\
        \ through obstacles until the intended target is reached, at which point,\
        \ the bullets will re-materialize and deal devastating damage. |-|Herrscher\
        \ of Flamescion= *{{Nihongo|Sword of Flamescion|\u306E|Shinen no Yaiba}}:\
        \ A sword that symbolizes Kiana's resolve. The gems in its hilt each represent\
        \ a Herrscher Authority, with the blue and dark red gems representing the\
        \ Authorities of Reason and Sentience respectively, while the yellow and orange\
        \ gems represent the Void and Flame Authorities owned by Kiana. |-|Herrscher\
        \ of Finality= *{{Nihongo|Cocoon of Finality|\u306E|Sh\u016Ben no Mayu}}:\
        \ The Core of the Herrscher of Finality, and the source of all Honkai-related\
        \ phenomena in the world; including the selection and descent of Herrschers,\
        \ the 50000-year cycles of time, and the basis of Stigmata. All Herrschers\
        \ are but shadows of the Finality, and their Cores mere extensions of the\
        \ Cocoon. It is through imposing the constraint of human thought upon the\
        \ Cocoon of Finality that Prometheus No.17 became what is known as the Will\
        \ of the Honkai, and it is through this Will of the Honkai that Kevin was\
        \ able to steal portions of the Authority of Finality. After becoming one\
        \ with the Cocoon, Kiana became the one who decides how the Cocoon embraces\
        \ humanity, and one of the most basic applications of this is the choice of\
        \ what Herrschers manifest in the world, in which she is not limited by the\
        \ recorded Herrschers from the Previous and Current Eras. |}"
