    - field: intelligence
      value: Gifted normally, Genius in combat (While generally incapable when it
        comes to her studies, Kiana has displayed her intelligence regarding topics
        that are of actual interest to her. These include her being able to rapidly
        deduce the schemes of World Serpent within Arc City just from scattered clues,
        a feat that greatly surprised Fu Hua, as well as keep up with the difficult
        mathematical and quantum theory behind the applications of her Void Authority.
        In terms of combat, in the span of only a few months, Kiana went from a combatant
        with a very rough and unrefined fighting style to a martial artist and swordswoman
        capable of keeping up with the likes of Fu Hua, Senti, Durandal and Kevin;
        mastering the Edge of Taixuan's Eminence in under half a year despite geniuses
        from Ancient Shenzhou spending their entire lives trying and failing to do
        the same, despite having the same teacher in Fu Hua)
