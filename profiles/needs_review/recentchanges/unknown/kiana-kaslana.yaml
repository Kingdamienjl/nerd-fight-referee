- id: claim-standard-equipment-f576bfdc
  section: equipment
  axis: equipment
  text: '*: A 3rd generation Valkyrie battlesuit and part of the "General Purpose
    Universal Combat Battlesuit" series. Equipped with jet propulsion and military-grade
    visors, and is effective on most environments. *: A pair of PRI-ARM pistols with
    built-in particle accelerators that emit a beam of positrons rather than standard
    ammunition. Designed to fire a beam of positrons at targets in order to trigger
    electron-positron annihilation upon contact. *: A prototype 4th generation Godsbane-class
    Valkyrie battlesuit designed to be worn only by S-rank Valkyries. High speed gamma
    particles flowing within the suit can be ejected from the back, allowing the Valkyrie
    to fire gamma beams that can be manipulated freely mid-flight. *Gungnir: The "Gungnir"
    particle beam cannon is a special anti-Herrscher weapons platform and is one of
    Kiana''s favorite weapons. Only available when wearing the Knight Moonbeam battlesuit.
    Herrscher of the Void (Sirin)=All previous items except for the Knight Moonbeam
    battlesuit. * A pair of customized firearms that Kiana created during her wanderings.
    Infused with the Void Authority, its bullets can become immaterial upon firing
    to pass through obstacles until the intended target is reached, at which point,
    the bullets will re-materialize and deal devastating damage. *: A sword that symbolizes
    Kiana''s resolve. The gems in its hilt each represent a Herrscher Authority, with
    the blue and dark red gems representing the Authorities of Reason and Sentience
    respectively, while the yellow and orange gems represent the Void and Flame Authorities
    owned by Kiana. *: The Core of the Herrscher of Finality, and the source of all
    Honkai-related phenomena in the world; including the selection and descent of
    Herrschers, the 50000-year cycles of time, and the basis of Stigmata. All Herrschers
    are but shadows of the Finality, and their Cores mere extensions of the Cocoon.
    It is through imposing the constraint of human thought upon the Cocoon of Finality
    that Prometheus No.17 became what is known as the Will of the Honkai, and it is
    through this Will of the Honkai that Kevin was able to steal portions of the Authority
    of Finality. After becoming one with the Cocoon, Kiana became the one who decides
    how the Cocoon embraces humanity, and one of the most basic applications of this
    is the choice of what Herrschers manifest in the world, in which she is not limited
    by the recorded Herrschers from the Previous and Current Eras.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-4009e8e3
  section: power_scale
  axis: battle_iq
  text: Gifted normally, Genius in combat (While generally incapable when it comes
    to her studies, Kiana has displayed her intelligence regarding topics that are
    of actual interest to her. These include her being able to rapidly deduce the
    schemes of World Serpent within Arc City just from scattered clues, a feat that
    greatly surprised Fu Hua, as well as keep up with the difficult mathematical and
    quantum theory behind the applications of her Void Authority. In terms of combat,
    in the span of only a few months, Kiana went from a combatant with a very rough
    and unrefined fighting style to a martial artist and swordswoman capable of keeping
    up with the likes of Fu Hua, Senti, Durandal and Kevin; mastering the Edge of
    Taixuan's Eminence in under half a year despite geniuses from Ancient Shenzhou
    spending their entire lives trying and failing to do the same, despite having
    the same teacher in Fu Hua)
