  attack_potency:
    text: "Multi-Solar System level ([https://youtu.be/9AK40d4O2N4?si=sIgv9CzroijPrbDD&t=601\
      \ Nearly defeated Wendy with the help of Mei and Bronya]. Kiana was also able\
      \ to assist in the battle against Wotan while it was powered by the same Gem\
      \ of Desire ) | At least Galaxy level (Sirin's Honkai energy output using Kiana's\
      \ body is [https://imgchest.com/p/lqyer28qq4d noted by Tesla to be superior\
      \ to that of her peak energy output during the Second Eruption. As she's never\
      \ detected Honkai Energy levels that high before], which was already [https://imgur.com/a/SDggjre\
      \ superior to that of the power] of the First and Second Herrschers of the Previous\
      \ Era, which despite being defeated before the invention of MANTIS soldiers\
      \ and Divine Keys, were recorded to have possessed and manipulated [https://imgur.com/a/8nBevTB\
      \ an order of magnitude more energy than was used by an Ether Anchor] that created\
      \ [https://imgur.com/a/kqNL4XS Durandal's bubble universe]. Is more powerful\
      \ than Welt Joyce, [https://youtu.be/EgDw5dIMpik?si=kFQeWeNFLVXrTPia&t=210 given\
      \ Einstein wondered if her machine was broken upon assessing Sirin's Honkai\
      \ Energy levels]. Putting her above Welt Yang's peak as well) | Galaxy level\
      \ (During the events of Arc City, [https://youtu.be/ZKPUMVwayGk?si=0JVwIPX7ecYyS_Qj&t=1906\
      \ Kiana was able to fight on par with an S-Rank Valkyrie such as Argent Knight\
      \ Rita]. She could also fight against and defeat Raven. Eclipse Mode Shadow\
      \ Knight Fu Hua, who is equal to a weaker Rita.) | Low Complex Multiverse level\
      \ (After recovering from her corruption past the events in Nagazora, Kiana was\
      \ able to [https://youtu.be/hhvqa8Up7X4?t=33 hold her own in an extended battle\
      \ against the Herrscher of Sentience even while only in Void Drifter form];\
      \ and in her Herrscher form, [https://youtu.be/NQdVJcEE0m4?t=48 managed to fight\
      \ evenly with and eventually overwhelm] a serious though emotionally-compromised\
