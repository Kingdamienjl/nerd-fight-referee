    - field: weaknesses
      value: 'White Comet= Early into her story, Kiana tended to act reckless and
        headstrong, often charging headfirst into battle with little to no plan and
        relying solely on her instincts and abilities. |-|Herrscher of the Void= During
        the Great Eruption, while possessed by the Herrscher of the Void persona,
        she was arrogant and often preferred to play with her opponents, defaulting
        to shows of strength and ability rather than any actual tactics. |-|Void Drifter=
        After regaining control of her body and having been forced to adapt to her
        new circumstances as Void Drifter, Kiana became far more strategic in her
        approach to battle. However, she could not use her Herrscher powers too extensively
        or risk losing control of her body once again to the Herrscher of the Void.
        |-|Post-Nagazora= After gaining control over her full Herrscher form during
        the climax of the Arc City storyline, and as was the case throughout the Herrscher
        of Sentience arc, Kiana became less restricted in her use of Herrscher Authorities,
        but still could not use too much or risk speeding up her Honkai corruption
        and eventually cascading. |-|Post-Herrscher of Flamescion= As the Herrscher
        of Flamescion onward, she has no notable weaknesses. == Notable Matchups ==
