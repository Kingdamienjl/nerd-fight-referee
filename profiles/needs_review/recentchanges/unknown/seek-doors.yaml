- id: claim-powers-and-abilities-8679501a
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Inorganic Physiology (Type 1) **Body
    Control (Advanced Control: Seek''s main method of pursuit is forming a humanoid
    extension of itself. Additionally, Seek will sprout out gigantic arms from outside
    the hallway near the end of the chase and can also have its eyes appear in different
    rooms) **Shapeshifting (Can supposedly shape itself into virtually anything, albeit
    with flaws and imperfections"well while seek has the ability to shape itself into
    pretty much anything that doesn''t necessarily mean its good at doing it perfectly
    or replicating things accurately" - RediblesQW, DOORS Dev) **Size Manipulation
    *Limited Immersion (Its eyes also appear within paintings) *Limited Light Manipulation
    (Emits an ominous red light from its body) *Technology Manipulation (Its presence
    makes lights flicker) *Transmutation (Immediately turns its victim''s body into
    black goo upon catching them) Resistance to: *Fire Manipulation (Unhindered by
    the fire caused by the fallen chandeliers) *Holy Manipulation and BFR (Alongside
    The Figure, Seek is one of the only Entities that cannot be banished by the Crucifix,
    and is instead merely stunned for a short time)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
