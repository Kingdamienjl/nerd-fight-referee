    requires recharging, and without recharging she is quite weakened. She is also
    not capable of more advanced spells such as Tohru''s Perception Blocking as her
    usage is limited. Dragons are weak to holy weapons, which bypass their natural
    durability. While in their dragon forms or using dragon-based attacks, they are
    also unable to damage opponents protected by holy armors and clothing. Notes:
    There is no difference in powers and abilities between Kanna''s human and dragon
    forms, as the only difference between these forms is her appearance.'
