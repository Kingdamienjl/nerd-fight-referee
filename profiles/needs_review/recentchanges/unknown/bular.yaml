power_scale:
  tier:
    text: 'Name: Bular, Son of Gunmar, The Gumm-Gumm Prince Origin: Tales of Arcadia
      Gender: Male Age: At least 1000 years old (Was alive in mid-12th century) Classification:
      Troll, Gumm-Gumms, Prince'
    source_ids: &id002
    - mediawiki-4899653
    confidence: 0.95
  attack_potency:
    text: Small Building level+ (Shown to be equal, if not stronger than Aarghaumont,
      who managed to destroy a putrified Bular and harm Varvatos Vex, who withstood
      a laser capable of this. Traded blows with Draal)
    source_ids:
    - vsbattles-bular-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Subsonic (Caught up to Jim and Toby on their bikes, kept up with Aarghaumont,Trollhunters
      S1E2: Becoming Part 2 who is comparable to Angor Rot. Relative to Jim and caught
      one of his attacks)'
    source_ids:
    - vsbattles-bular-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: 'Class 25 (Wrestled with Aarghaumont, who can lift a large boulder with
      a lot of strain.Trollhunters S3E8: For the Glory of Merlin Grappled with Draal,
      who threw Nomura into the horizon.Trollhunters S1E6: Win Lose or Draal Lifted
      a truck and threw it meters away with ease. Single-handedly took down several
      electric poles. Uprooted trees from the ground by running into them)'
    source_ids: *id002
    confidence: 0.95
  striking_strength:
    text: Small Building level+
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Small Building level+ (Withstood several blows from Aarghaumont and Draal)
    source_ids:
    - vsbattles-bular-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: 'Superhuman (Kept up with Jim and Toby riding their bikes across town, briefly
      fought with the new trollhunter and still looked like he wasn''t fatigued. Tried
      to get another chance at killing the trollhunter despite being severally injured
      and was getting petrified by the sun at that timeTrollhunters S1E13: The Battle
      of Two Bridges)'
    source_ids:
    - vsbattles-bular-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range physically and with weapons
    source_ids:
    - vsbattles-bular-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Average, Gifted in combat (Survived centuries on the surface without the
      guidance of his father and still grew to be a formidable opponent as he can
      fight with Aarghaumont, the old general of the gumm-gumms, Draal, who trained
      his entire life to be a trollhunter and even defeated Kanjigar which Blinky
      claimed to be one of the best and would need decades of constant training for
      the average troll to be on his level. He came up with a plan to test Strickler's
      loyalty, after witnessing that he had changed. However, he extremely impulsive,
      making short term decisions that costs him, like when he was defeated by Jim.
      Instead of saving his forces to retreat and probably to find a way to heal himself
      from the sunlight, he attacked headfirst, despite knowing that Jim is a much
      better foe then he initially thought, because of course he was defeated by him,
      and also having his friends around, including Argh that smashed him into pieces.
      Though it is unknown if he could've actually survived after Jim stabbed him
      with daylight and if this attack was only a final attack before he could inevitably
      parish, but the point stands)
    source_ids:
    - vsbattles-bular-unknown
    confidence: 0.6
    notes: auto_repair source extraction
