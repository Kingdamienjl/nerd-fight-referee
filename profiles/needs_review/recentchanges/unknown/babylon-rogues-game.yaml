power_scale:
  tier:
    text: to possibly | to
    source_ids:
    - vsbattles-babylon-rogues-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Galaxy level to possibly High Universe level (Even Wave, who is physically
      the weakest member of the group, can harm other characters such as Sonic and
      Tails, who could harm the Babylon Guardian in Sonic Riders. Helped defeat Master
      Core: ABIS and can harm other racers by hitting them with their Extreme Gear)
      | Universe level+ to Low Multiverse level (Comparable to Sonic, soon after Sonic''s
      defeat of Erazor Djinn. Jet and Storm were able to fight Master Zik, the latter
      incapacitating him with a single punchSonic the Hedgehog #286 Universes by the
      IDW Comics)'
    source_ids:
    - vsbattles-babylon-rogues-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively FTL+ (Jet's Extreme Gear was capable of keeping pace with and
      even possibly outspeeding Sonic while he was on foot during the events of Sonic
      Riders, forcing him to use Extreme Gear himself later on to keep up. The other
      two should be comparable to this) | Massively FTL+ (All of them were able to
      keep pace with Master Zik during the Metal Virus arc)
    source_ids:
    - vsbattles-babylon-rogues-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Multi-Stellar (While Storm is the strongest out of the group, all of them
      should be as powerful as other comparable characters, such as the members of
      Team Sonic)
    source_ids: &id002
    - mediawiki-4800933
    confidence: 0.95
  striking_strength:
    text: Galaxy level to possibly High Universe level | Universe level+ to Low Multiverse
      level
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Galaxy level to possibly High Universe level (All are able to take hits
      from other racers, including Knuckles.) | Universe level+ to Low Multiverse
      level Both Wave and Storm took hits from their own Extreme Gear being thrown
      at them by Master Zik''s abilities). Up to Complex Multiverse level (6-D) Damage
      Transferal with Rings (Having enough Rings shields damage from those as strong
      as Void and Tethered SupremeSonic Frontiers: Another Story (Vs The End))'
    source_ids:
    - vsbattles-babylon-rogues-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman
    source_ids:
    - vsbattles-babylon-rogues-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Extended Melee Range with their Extreme Gear; Up to Hundreds of Meters
      with their ranged attacks Teamwork: The Babylon Rogues almost exclusively work
      as a unit, usually able to cover each other''s backs during either a fight or
      a getaway. Jet is a capable leader, quickly picking up on Eggman''s deceitful
      nature and commanding Storm to look into the doctor''s true motives. Even with
      Storm''s less notable intelligence, he would successfully apprehend valuable
      information from Robotnik''s diary unnoticed, allowing his team to learn of
      his plans. Wave takes a very active role in the effectiveness and progression
      of her team, often speaking to Jet directly about her concerns. More impressively,
      her foresight is especially reliable. Wave was able to quickly realize the trouble
      Team Sonic could present later, planting an explosive onto Sonic''s Extreme
      Gear well before the final race, ultimately leading to Jet''s victory. Despite
      their personalities sometimes causing friction between them, their trust in
      each other is unmatched. They are hesitant to abandon each other, even when
      prompted to by their teammates, such as when Jet stayed to battle alongside
      his friends during an impossible fight against a Zombot horde.'
    source_ids:
    - vsbattles-babylon-rogues-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Below Average (Storm is the least intelligent of the group, being portrayed
      as rather dim outside of his Extreme Gear mastery) up to at least Genius (Wave
      is a technological genius, particularly when it comes to Extreme Gears, surpassing
      even Tails and Dr. Eggman in this field)
    source_ids:
    - vsbattles-babylon-rogues-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
