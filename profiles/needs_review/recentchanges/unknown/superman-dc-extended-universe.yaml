        Pod 2.jpg|"Goodbye, my son. Our hopes and dreams travel with you..." 1 - Child
        Clark.jpg|"You just have to decide what kind of a man you want to grow up
        to be, Clark; because whoever that man is, good character or bad, he''s...
        He''s gonna change the world." 2 - Saving Bus.jpg|"My son was in the bus.
        He saw what Clark did." 6 - Flight.jpg|"Earth''s sun is younger and brighter
        than Krypton''s was. Your cells have drunk in its radiation, strengthening
        your muscles, your skin, your senses. Earth''s gravity is weaker, yet its
        atmosphere is more nourishing. You''ve grown stronger here than I ever could
        have imagined. The only way to know how strong, is to keep testing your limits."
        8 - Outcast.jpg|"My father believed that if the world found out who I really
        was, they''d reject me... out of fear... I let my father die because I trusted
        him. Because he was convinced that I had to wait. That the world was not ready.
