- id: claim-weaknesses-6c2ff165
  section: weaknesses
  axis: weakness
  text: 'Kryptonite is capable of reducing his abilities when nearby and outright
    negating them in higher quantities. Incapable of seeing through lead. Easily goaded
    or driven to anger when loved ones are threatened. ==Gallery== 0 - Pod 2.jpg|"Goodbye,
    my son. Our hopes and dreams travel with you..." 1 - Child Clark.jpg|"You just
    have to decide what kind of a man you want to grow up to be, Clark; because whoever
    that man is, good character or bad, he''s... He''s gonna change the world." 2
    - Saving Bus.jpg|"My son was in the bus. He saw what Clark did." 6 - Flight.jpg|"Earth''s
    sun is younger and brighter than Krypton''s was. Your cells have drunk in its
    radiation, strengthening your muscles, your skin, your senses. Earth''s gravity
    is weaker, yet its atmosphere is more nourishing. You''ve grown stronger here
    than I ever could have imagined. The only way to know how strong, is to keep testing
    your limits." 8 - Outcast.jpg|"My father believed that if the world found out
    who I really was, they''d reject me... out of fear... I let my father die because
    I trusted him. Because he was convinced that I had to wait. That the world was
    not ready. What do you think?" 10 - Battle of Smallvile 3.jpg|Superman during
    the Battle of Smallville. 11 - Supes vs Zod.jpg|Superman and General Zod''s final
    battle in Metropolis False God.png|"Is it really surprising that the most powerful
    man in the world should be a figure of controversy?" 12 - Savior 1.jpg|"We, as
    a population on this planet, have been looking for a savior." 14 - Senate 1.png|"Today
    is a day for truth." 15 - Fight Night 2.png|"Black and Blue. Fight Night. God
    versus Man. Day versus Night. Son of Krypton versus Bat of Gotham." 17 - Trinity.gif|The
    Trinity. United for the first time. 18 - Death of Superman.png|The Death of Superman
    Monument.jpg supamane returns.jpg|The Return of Superman ==Notable Matchups==
    Victories: *Black Adam (DC Extended Universe) Black Adam''s Profile (Theatrical
    Superman and Black Adam were used. Class Z Lifting Strength is restricted. Location:
    Kahndaq) *Ali (Ejen Ali (Verse)) Ali''s Profile (7-C versions are used. Ali has
    all his Season 3 Standard Equipment. Location: Indoor M.A.T.A. Training Area;
    Speed was equalized) *Pochita (Chainsaw Man) Pochita''s Profile (SBA was used;
    Battle took in Amphoreus; "Theatrical" 7-C Superman and "Part 1" 7-C Pochita was
    used. Anything above 7-C was remove; Speed was Equalized.) *The Player (Minecraft)
    The Player''s Profile (Speed was equalized. The starting distance was 5 meters,
    and the battle took place in Gotham. Steve has all of his equipment, and Theatrical
    Cut Superman was used.) Losses: *Ladybug (Miraculous: Tales of Ladybug & Cat Noir)
    Ladybug''s Profile (Theatrical Superman and Season 1 Ladybug were used. Speed
    was equalized) *Garou (One-Punch Man) Garou''s Profile (7-C Half Monster Garou
    and Superman are used; Garou has prior knowledge about Superman; Location: S-City;
    Starting Distance: 10 meters) Inconclusive: ==References== ==Notes/Explanations==
