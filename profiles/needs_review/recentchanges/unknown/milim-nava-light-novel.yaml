- id: claim-weaknesses-e649fe0d
  section: weaknesses
  axis: weakness
  text: "Milim loses control of herself when activating Stampede (which is simply\
    \ using Satanael at full output). However, later she learns to manage her state\
    \ of mind perfectly fine even at full output. {| class=\"mw-collapsible mw-collapsed\"\
    \ align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
    \ | colspan=\"2\" style=\"text-align: left; |Notable Attacks/Techniques: |- |\
    \ *Dragonoids\u300C Doragonoido\u300Dare an irregular species born from the union\
    \ of the normally incapable of reproducing True Dragon and a High Human. They're\
    \ a type of Spiritual Lifeform, and although they are merely imitations of True\
    \ Dragons, they possess immense power comparable to one. *Milim Eye \uFF62 Mirimu\
    \ Ai, lit. \"Dragon Eyes\"\uFF63 is one of Milim Nava's Unique Skill. *Analytical\
    \ Appraisal\u300C Kaiseki Kantei?\u300DAnalytical Appraisal releases waves that\
    \ enter the target of analysis and perform a full scan of their composition, which\
    \ is then sent back to the user. Through this, the user can gain information such\
    \ as the material composition of the target, the amount of Magicules it possesses,\
    \ and if they're under the effects of Skills or Magic. The strength and precision\
    \ of Analytical Appraisal varies depending on the level of the user. *Magic Measurement\u300C\
    \ Maryoku Sokutei, lit. \"Magic Power Measurement\"\u300DAllows the user to accurately\
    \ read the magical power of a target even if their aura is suppressed. *Multilayer\
    \ Barrier\u300C Taj\u016B Kekkai\u300DAn Extra Skill and one of the Intrinsic\
    \ Skill. Multiple Ranged Barriers are linked with various resistances to create\
    \ a Multilayer Barrier. It's a thin, colorless, invisible coating covering the\
    \ body. It is a barrier consisting of several layers but still so thin that Magic\
    \ Sense can only barely spot it. It doesn't require much Magic Power to keep going.\
    \ Once it is summoned, it barely consumes any at all. Even if it gets destroyed,\
    \ the user can just recreate it instantly. *Spatial Motion\u300C K\u016Bkan Id\u014D\
    \u300Dis an Extra Skill that Rimuru acquired after analyzing the Spatial Element\
    \ of the Elemental fused with Alice Rondo. It allows the user instantaneous travel\
    \ to locations they have been to before or aware of the coordinates, similar to\
    \ the Elemental Magic Warp Portal, except performed at a much faster speed. The\
    \ magical energy it consumes, in return, is immense. It involves linking two points\
    \ in space together with a gate and stabilizing it, which normally takes several\
    \ minutes. *Spatial Storage\u300C K\u016Bkan Sh\u016Bn\u014D\u300DAn Extra Skill\
    \ and a fundamental spell in Spatial Magic. *Battlewill\u300C Kit\u014Dh\u014D\
    , lit. \"Aura Fighting Method\"\u300DA family of Arts that makes use of the Aura\
    \ present in all living beings to perform powerful physical attacks and effects\
    \ that resemble magic. Unlike magic, these techniques do not require any sort\
    \ of chant and usually have little to no casting time. *Milim charges her fist\
    \ with aura and magicules and throws a punch strong enough to send victims flying.\
    \ The Drago Fist\u300C Ry\u016Bmaken\u300Dis a school of Arts created and propagated\
    \ by Milim Nava. It combines hand-to-hand martial arts with fundamental Battlewill\
    \ principles to create a unique style that is equal parts straightforward and\
    \ profound. *Draconic Blast\u300C Doragonikku Burasuto, lit. \"Dragon Demon Strong\
    \ Explosion\"\u300D *Draconic Cannon \uFF62 Doragonikku Kanon, lit. \"Dragon Fang\
    \ Holy Fist Conqueror\"\uFF63 *Dragon Fang \uFF62 Ry\u016Bga\uFF63: An art that\
