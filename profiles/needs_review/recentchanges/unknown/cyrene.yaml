        \ World-Cleansing Blood"
      source_id: mediawiki-5010555
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: "Extraordinary Genius (Upon realizing that the truth about Amphoreus\
        \ by Lygus, PhiLia093 devised a plan to prevent the birth of Irontomb from\
        \ the Scepter \u03B4-me13, all whilst being aware of the situation they're\
        \ in after Lygus told them the truth. PhiLia093 made a bold move using the\
        \ Ceremonial Blade to erase \"Time\" from Amphoreus, drawing the gaze of Fuli,\
        \ or rather the Heart of Amphoreus itselfLoading Screen - Cyrene that took\
        \ over her identity in the future since Fuli used \"Time\" to record everything\
        \ that has happened in Amphoreus to be kept as memories \u2014 PhiLia093 later\
        \ created the Eternal Recurrence, in this loop, PhiLia093 told everything\
        \ that has happened in the end of each loop to the Heart of Amphoreus in the\
        \ past that existed only as a Pure Children of An\u0101srava that self-iterated\
        \ for 33,550,336 cyclesAs I've Written, \u03B4-me13.exe, Experiment Progress:\
        \ Eternal Recurrence, Anomaly Log: Demiurge) Supergenius (As the Heart of\
        \ Amphoreus, before it materialized into Mem after 33,550,336 cycles of self-iteration\
        \ through PhiLia093, it's the consciousness of Scepter \u03B4-me13 that's\
        \ tasked to nurture a life form with an \"Ego\", a task originally given by\
        \ Nous, the Aeon of Erudition, a nigh-omniscient being that embodies knowledge\
        \ itself.Simulated Universe - Nous the Erudition: Dev Log1Wood Sprouts Anew,\
        \ Fate Tilts Askew It is also the Scepter that simulated Amphoreus, a space-time\
        \ dimension on its own which is able to create space-time barriers to prevent\
        \ external variables, with Century Gate being able to link space-times altogether)\
        \ Supergenius (Same as before. Cyrene is respected by The Herta to be comparable\
        \ to her in terms of intelligence, leading her to believe that Cyrene's identity\
        \ isn't as simple as she thought originally. An accomplishment so rare given\
        \ its really unexpected to find such a genius within an isolated world like\
        \ Amphoreus. Cyrene is then able to outsmart Lygus, trapping him within his\
        \ own realm, the Exomyth, with her being able to debate Lygus inside that\
        \ realm together with The Herta and Screwllum. Cyrene herself acknowledged\
        \ its her greatest honor to be on the same page as the geniuses and that she\
        \ caught onto The Herta's plan to trap Lygus with this method immediately,\
        \ though Lygus managed to deduce how she's able to accomplish it with Lygus\
        \ being powerless against it) Supergenius (Same as before. The Battle of Amphoreus,\
        \ the defeat of Irontomb, and the victory of the Cosmic Alliance, are only\
        \ made possible through Demiurge's actions beforehand which is a multiple\
        \ phase operation consisted of preventing any casualty in the fight against\
        \ Irontomb, an Emanator of Destruction who is able to destroy the entire )\
        \ Supergenius (Same as before. The Herta used to ask Nous in the beginning\
        \ of the Amphoreus Arc, regarding Divinity and what is it.A New Venture on\
        \ the Eighth Dawn Nous didn't answer the question just yet, though it was\
        \ shown in the end of the Amphoreus Arc that Demiurge is able to answer this\
        \ question, with Demiurge herself proving how would the universe come back\
        \ from being destroyed which is what Nous is trying to calculate and extrapolateData\
        \ Bank: Aeons - Nous the Erudition)"
