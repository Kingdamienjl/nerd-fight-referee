- id: claim-powers-and-abilities-bff5017a
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Martial Arts, Acrobatics, Stealth Mastery,
    Chakra Manipulation, Statistics Amplification (Shinobi are capable of enhancing
    their physical capabilities with the use of chakra. The Shunshin no Jutsu allows
    Shinobi to greatly enhance their speed by focusing chakra in their feetRin no
    Sho, Page 197Naruto Chapter 24Naruto Chapter 71), Surface Scaling and Water Walking
    (By focusing chakra at the soles of their feet, Shinobi can scale and cling to
    vertical surfaces, and even walk on waterNaruto Chapter 18Naruto Chapter 90),
    Minor Illusion Creation and Duplication (With the Clone TechniqueRin no Sho, Page
    220, Shinobi can create illusionary duplicates of themselves that have no physical
    substance), Shapeshifting (With the Transformation Technique, Shinobi can transform
    themselves into other people, animals, plants, and even inanimate objects, such
    as weapons), Paralysis Inducement (With the Temporary Paralysis TechniqueRin no
    Sho, Page 176, Shinobi can completely paralyze their targets from close to mid
    range), Cyborgization (Partial. Like with all other members of Kara, Deepa''s
    body had been modified with Scientific Ninja Tools by Amado), Body Control, Limited
    Matter Manipulation, Organic Manipulation and Absorption (Can absorb carbon and
    control the molecular-bonding of the carbon that he is exposed to, whether that
    he makes contact with or that is in his body. By properly rearranging them, his
    body becomes super durable, as hard as diamond. He can also create an armor of
    carbon), Limited Telekinesis (Can freely manipulate carbon and launch it as a
    powerful shower of controlled projectiles) Limited Size Manipulation (Can increase
    the size of his projectiles to strengthen their sheer force, and condense for
    even more devastating attacks), Crystal Manipulation (Can refine carbon into diamond),
    Resistance to: Electricity Manipulation (Was able to remain intact after being
    hit by lightning release clones of the Kumogakure ninjas)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
