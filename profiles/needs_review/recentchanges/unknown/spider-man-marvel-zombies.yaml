- id: claim-powers-and-abilities-676a2b68
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Disease Manipulation, *Madness Manipulation,
    and Power Bestowal (Can spread the Hunger Gospel via bites,Marvel Zombies: Dead
    Days which induces an extremely overwhelming hunger for flesh and grants some
    zombie abilities. The disease is even shown turning androids, spirits, and other
    non-organics like Sandman, though this isn''t entirely consistent) *Self Sustenance
    (Types 1, 2, and 3) *Longevity andImmortality (Type 1, 2; Reed explains that the
    virus makes almost everything besides the brain unnecessary for continued function.
    Zombies can survive as just heads, and Spider-Man is shown to be fine after getting
    nearly bisected verticallyMarvel Zombies 2) *Supernatural Willpower (Spider-Man
    was one of the first to overcome the virus.Marvel Zombies 2 During the initial
    outbreak, he was able to resist it longer than most, and Spider-Man later fought
    it off to contain the virus in a time loop) *Surface Scaling *Adhesive Manipulation
    (via his webs and arteries) *Bodily Weaponry (Zombification grants the host sharp
    teeth. Spider-Man can shoot "organic" webs in the form of his blood vessels out
    of his wrists) *Enhanced Senses (Smell; Smelled Kraven''s herbs through his flesh)
    and Precognition (Retains his spider sense, which allowed him to see through Mysterio''s
    illusions) *Berserk Mode *Preparation and Power Nullification (Created a cure
    for the zombie virus that was even capable of killing characters with potent healing
    factors) *Regeneration (Low; Regenerated blood vessels for continued usage) Immunity
    to Pain Manipulation (The zombies feel no pain), Resistance to Electricity Manipulation
    (Held onto Ock''s arms while they were caught by Electro''s blasts), Disease Manipulation
    (Prior to infection, Spider-Man was able to temporarily resist the infection longer
    than most. Afterwards, he''s unaffected by decomposition) Same as before plus
    Energy Projection (Can shoot cosmic blastsMarvel Zombies), Cyborgization (Has
    a prosthetic leg to replace the one he tore off), Flight, Non-Standard Breathing
    (Type 2)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
