      value: 'Superhuman Physical Characteristics, Genius Intelligence, Regeneration
        (Mid-Low; can regenerate broken bones in hours), Acrobatics (Can easily leap
        several stories high. States he can achieve perfect equilibrium in any position
        imaginable and that he''s without peers when it comes to any acrobatic acts.
        Unaffected by a nausea-inducing blast from Vertigo), Preparation (Created
        the bulletproof Spider-Armor Mark II after he lost his Spider Sense. Created
        and used the Spider-Armor Mark III to defeat the Sinister Six, which was made
        to counter them. Made ice silicone webbing to cool down the Human Torch. Has
        created and stored a large variety of vehicles. Created a suit for lethal
        combat. Stated he''s prepared for ways to defeat other heroes in case he had
        to stop them, including a way to kill the Hulk), Martial Arts Master (Has
        trained under the likes of Captain America and Shang Chi, and has a fighting
        style specifically tailored towards his abilities using his training), Stealth
        Proficiency (Capable of sneaking into Latveria undetected. Daredevil describes
        him as impossibly quiet, and has used his abilities to sneak up on his enemies),
        Weapon Creation and Weapon Mastery (With his webbing, Spider-Man is capable
        of creating a multitude of different weapons that he can use efficiently),
        Vehicular Mastery (Can drive many different vehicles, such as the Spider-Mobile
        and the Hydro Spider). Enhanced Senses (Much better than a normal human''s.
        Can detect radio frequencies and radiation trails. Can sense dangerous people.
        His Spider-Sense is heightened when he''s blind, allowing him to "see" danger
        rather than sense it. Can sense disturbances in Space-Time. Can vaguely sense
        how many people are coming, how fast, and how close they are), Precognition
        and Instinctive Reaction (His Spider-Sense alerts him and works as an instinctive
        response to danger), Extrasensory Perception (Can sense presences and how
        they feel compared to each other. Can sense and dodge invisible attacks. Senses
        Morwen manifesting in the city. Can use his Spider Sense in reverse to find
        the most danger]), Perception Manipulation (His Spider Sense slows action
        down to a crawl and says it allows him to think of jokes for what feels like
        hours), Web Creation (Can use his webbing in a variety of ways, ranging from
        enhancing his mobility in several ways to using it as several forms of projectiles),
        Surface Scaling (Can cling to and climb nearly any surface. Strong enough
        to overpower the momentum of a giant flying robot, being yanked by Colossus,
        and holding onto a space shuttle. Can also use it to throw opponents or rip
        off skin from somebody''s face), Paralysis Inducement (After his training
        with Shang-Chi, Spider-Man has shown knowledge of attacking nerve clusters
        and using pressure points), Chi Manipulation (Trained by Captain America to
        focus and utilize his Chi), Barrier Creation (Can create web-shields that
        are impervious to bullets), Afterimage Creation (Can consistently move fast
        enough to create several afterimages of himself) Pseudo-Flight (Can create
