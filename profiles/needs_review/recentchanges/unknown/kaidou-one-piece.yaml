    methods, all of which he has survived. His hobby is "suicide".One Piece Vol. 79
    Chapter 795 Characters weaker than him have fought for days on end (from fiveOne
    Piece episode A Chapter 2One Piece Volume 81 Chapter 810 to ten daysOne Piece
    Vol. 66 Chapter 650), and he fought Big Mom for at least a day, emerging with
    only minor damage and displayed no signs of fatigue.One Piece Vol. 94 Chapter
    952 During the raid of Onigashima, the Red Scabbards were to accomplish the rare
    feat of piercing his skin and drawing blood from with their swords and attacks,
    although these wounds were shown to have little, if any, effect on Kaidou.One
    Piece Vol. 98 Chapter 987 He could withstand Raizo's Scroll-Scroll Fruit redirecting
    the force of his own Bolo Breath at close range, as well as assaults from Nekomamushi
    and Inuarashi's Sulong-enhanced attacks, Kawamatsu's Amano-gawa, Izou's Dangirigan,
    and Kikunojo's Zansetsu-gama, eventually requiring Kin'emon, Denjiro, Inuarashi
    and Ashura Doji to combine their attacks in the form of a Togen Totsuka to put
    him down,One Piece Vol. 98 Chapter 992 which he still didn't fall from as he stated
    that the injuries to be minor in comparison to when Oden inflicted a massive scar
    on him before proceeding to begin his counterattack.One Piece Vol. 98 Chapter
    993 Later, after defeating the ScabbardsOne Piece Vol. 99 Chapter 996 and generating
    Flame Clouds to lift Onigashima with over 35,000 people on it and move the island
    to Wano,One Piece Vol. 99 Chapter 997 he proceeded to engage in another lengthy
    battle with members of the Worst Generation (Luffy, Zoro, Law, Kid, and Killer),
    where despite taking even more lasting damage, Kaidou continued fighting regularly,
    only becoming irritated rather than alarmed by their growing ability to damage
    him numerous times, either through brute force or bypassing his defenses,One Piece
    Vol. 99 Chapter 1000One Piece Vol. 99 Chapter 1001One Piece Vol. 99 Chapter 1002
    one of which being enough to fatally wound someone of Dolflamingo's caliber and
    would have killed him if not for his ability to mitigate the damage.One Piece
    Vol. 78 Chapter 781 Despite Luffy's increased strength and skill with Conqueror's
    Haki Infusion,One Piece Vol. 100 Chapter 1010 Kaidou was able to match him for
    dozens of minutes before eventually defeating him.One Piece Vol. 100 Chapter 1013
    Following that, he began his search for Kozuki Momonosuke,One Piece Vol. 100 Chapter
    1014 defeated Kin'emon again,One Piece Vol. 100 Chapter 1015 fought Yamato in
    a lengthy battle,One Piece Vol. 101 Chapter 1024 and engaged in his second battle
    with Luffy that night.One Piece Vol. 102 Chapter 1026 Even after enduring more
    attacks that were greatly enhanced by advanced applications of Armament and Conqueror's
    Haki, and despite being weakened by still carrying Onigashima with his Flame Clouds,
    Kaidou was able to defeat Luffy once more.One Piece Chapter 1042 Following that,
    he engaged in a skirmish with the Ninja-Pirate-Mink-Samurai Alliance and Marco,One
    Piece Chapter 1043 before being dragged into one last showdown with Luffy,One
    Piece Chapter 1044 this time the latter having assumed his Gear Five, which is
    considered the pinnacle of what he can do. He fought Gear Fifth Luffy for an extended
    period of time, enduring Luffy stretching through his body, hitting vital spots
    like his eyes, brain and organs, as well as numerous attacks coated with Armament
    and Conqueror's Haki.One Piece Chapter 1045One Piece Chapter 1046 After all of
    this, it took Luffy's most powerful attack to overpower Kaidou's Flame Dragon
    Torch and finally put him downOne Piece Chapter 1049)
