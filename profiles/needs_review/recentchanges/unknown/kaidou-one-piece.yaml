        \ Technique Mimicry (In his Thieving Drunk mode, Kaidou can mimic his opponent's\
        \ fighting style to an extent but has so far only been shown to replicate\
        \ Luffy's ability to change his attack's trajectory at will), Regeneration\
        \ (Mid-Low), Empowerment (When drunk from alcohol he enters a state called\
        \ Shuron Hakke which strengthens his Haki and causes him to change into various\
        \ modes based on his drunken mood swings), Resistance to Radiation Manipulation\
