    with Pain.Naruto Chapter 382 It should be noted that even after all of that damage
    he'd sustained and pain he'd endured, he still had the mental fortitude to quickly
    come up with and write a very complex coded message relaying all the information
    he'd learned Superhuman. With Sage Mode, Jiraiya's stamina increases significantly
    because he does not actually use up his own chakra, but rather the Senjutsu chakra
    he'd created by absorbing Nature Energy from his surroundings.Naruto Chapter 415
    It should be noted that Sage Mode normally does not last for very long, usually
    around five minutes at most; however, Jiraiya does have a work around for this,
    which is to fuse with Ma and Pa in order to have them supply him with a constant
    flow of Nature Energy, making his Sage Mode seemingly endless.Naruto Chapter 420
