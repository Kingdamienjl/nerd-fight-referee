    - field: weaknesses
      value: "Can't maintain Sage Mode on his own for a substantial period. He has\
        \ to hold his breath to retain control over his target's mind and body. Notable\
        \ Attacks/Techniques: Kuchiyose no Jutsu (Summoning Technique): The Summoning\
        \ Technique is a space-time ninjutsu that allows the summoner to summon animals\
        \ or people across long distances instantly. Jiraiya uses this to summon frogs,\
        \ such as Gamabunta, and can also summon shadow clones from a different location.\
        \ Rasengan: A sphere of chakra energy that can create a large explosion and\
        \ damage the inside of a target. Needs to close to melee range to use it.\
        \ *Ultra Big Ball Rasengan: A giant version of Rasengan. Sennin Mode (Sage\
        \ Mode or Hermit Mode): The result of using natural energy along with a ninja\u2019\
        s normal chakra in perfect balance to drastically empower their abilities.\
        \ Flame Bullet: This technique is executed by the user gathering oil in their\
        \ mouth which is created by chakra, spitting it out, and igniting it. This\
        \ technique shoots a flame bullet at the enemy. *Big Flame Bullet: This technique\
        \ is a senjutsu altered version of the Flame Bullet. Sage Art: Goemon: This\
        \ technique is a collaboration technique used by Jiraiya with Shima and Fukasaku.\
        \ Swamp of the Underworld: By changing the surface of an object beneath an\
        \ enemy into mud and creating a swamp, the user can sink his enemy into the\
        \ mud. Shadow Manipulation Technique: After infusing chakra into the victim's\
        \ shadow, the user makes their own body as flat as possible. Then, by becoming\
        \ one with the shadow, this technique temporarily establishes control over\
        \ the victim's mind and body. While the technique is in effect, the victim\
        \ is momentarily stunned and can serve as a human shield. Turning into a Frog\
        \ Technique: By touching the forehead of a target and then, according to a\
        \ mental image the user forms, the target changes into a frog. Hiding in a\
        \ Toad Technique: The frog can dive up to a hundred meters in fresh water,\
        \ making it especially useful for infiltrating enemy camps that are surrounded\
        \ by a river or a lake. The stomach of the frog also has a unique barrier\
        \ that obstructs chakra, protecting the user from detection-type ninjutsu.\
        \ Toad Confrontation Chant: Jiraiya used this technique with the help of Fukasaku\
        \ and Shima during the fight against Pain. It is a sound-based genjutsu passed\
        \ down on Mount Myoboku. Because learning it requires many long years of training,\
        \ only the Two Great Sage Toads, Fukasaku and Shima, have the skills to perform\
        \ it. Barrier: Toad Gourd Technique: Jiraiya summons a small toad that pulls\
        \ enemies into its stomach, a space which is much larger than the toad with\
        \ gastric acids inside. Summoning: Toad Mouth Bind: Jiraiya summons the oesophagus\
        \ of a toad which changes the surroundings around him. Making it much harder\
        \ to move, he can control this any way he wants and can reverse summon it\
        \ to BFR opponents. This section of the toad contains stomach acid, and the\
        \ air within is filled with an acidic poison that is colourless and odourless,\
        \ making it difficult to detect. Though it can be endured in small amounts,\
        \ this poison begins to paralyse a person's entire body after ten minutes\
        \ of continuous exposure, indiscriminately affecting anyone contained within\
        \ the stomach."
