    - field: weaknesses
      value: "The Art of the Manipulated Shadow requires Jiraiya to hold his breath\
        \ to maintain the technique. Once he takes a breath, the technique is immediately\
        \ undone.Sha no Sho, Page 238 Gamakure Jutsu leaves the user especially vulnerable\
        \ to sensory-type ninja at the exact moment they exit the barrier space.Sha\
        \ no Sho, Page 238 Jiraiya hasn't completely mastered the manipulation of\
        \ Sage Jutsu chakra, which resulted in him acquiring additional frog-like\
        \ features when he entered Sage Mode.Naruto Chapter 410 Additionally, to enter\
        \ Sage Mode, one has to stay perfectly still while they absorb Nature Energy\
        \ and convert it into Senjutsu chakra, which is extremely ineffective in combat.Naruto\
        \ Chapter 420 Sage Mode also has a very short time limit, only lasting for\
        \ five minutes at most.Naruto Chapter 420 Finally, if one fails to balance\
        \ the Nature Energy intake with their own chakra, and absorb an excessive\
        \ amount of Nature Energy, they will be permanently turned into a frog statue.Naruto\
        \ Chapter 410 However, Jiraiya has a workaround for all of these weaknesses,\
        \ which is fusing with Fukasaku and/or Shima. This fusion allows Jiraiya to\
        \ do battle in Sage Mode without having to worry about standing still to collect\
        \ Nature Energy, since Ma and/or Pa are constantly doing it for him. This\
        \ also allows him to stay in Sage Mode for far longer periods of time than\
        \ what would normally be possible. Additionally, having them on his shoulder,\
        \ balancing his Nature Energy intake, also eliminates the possibility of him\
        \ taking in too much energy and irreversibly turning into a frog.Naruto Chapter\
        \ 420 Notable Attacks/Techniques: Kuchiyose no Jutsu (Summoning Technique):\
        \ The Summoning Technique is a space-time ninjutsu that allows the summoner\
        \ to summon animals or people across long distances instantly. Jiraiya uses\
        \ this to summon frogs, such as Gamabunta, and can also summon shadow clones\
        \ from a different location. Rasengan: A sphere of chakra energy that can\
        \ create a large explosion and damage the inside of a target. Needs to close\
        \ to melee range to use it. *Ultra Big Ball Rasengan: A giant version of Rasengan.\
        \ Sennin Mode (Sage Mode or Hermit Mode): The result of using natural energy\
        \ along with a ninja\u2019s normal chakra in perfect balance to drastically\
        \ empower their abilities. Flame Bullet: This technique is executed by the\
        \ user gathering oil in their mouth which is created by chakra, spitting it\
        \ out, and igniting it. This technique shoots a flame bullet at the enemy.\
        \ *Big Flame Bullet: This technique is a senjutsu altered version of the Flame\
        \ Bullet. Sage Art: Goemon: This technique is a collaboration technique used\
        \ by Jiraiya with Shima and Fukasaku. Swamp of the Underworld: By changing\
        \ the surface of an object beneath an enemy into mud and creating a swamp,\
        \ the user can sink his enemy into the mud. Shadow Manipulation Technique:\
        \ After infusing chakra into the victim's shadow, the user makes their own\
        \ body as flat as possible. Then, by becoming one with the shadow, this technique\
        \ temporarily establishes control over the victim's mind and body. While the\
        \ technique is in effect, the victim is momentarily stunned and can serve\
        \ as a human shield. Turning into a Frog Technique: By touching the forehead\
        \ of a target and then, according to a mental image the user forms, the target\
        \ changes into a frog. Hiding in a Toad Technique: The frog can dive up to\
        \ a hundred meters in fresh water, making it especially useful for infiltrating\
        \ enemy camps that are surrounded by a river or a lake. The stomach of the\
        \ frog also has a unique barrier that obstructs chakra, protecting the user\
        \ from detection-type ninjutsu. Toad Confrontation Chant: Jiraiya used this\
        \ technique with the help of Fukasaku and Shima during the fight against Pain.\
        \ It is a sound-based genjutsu passed down on Mount Myoboku. Because learning\
        \ it requires many long years of training, only the Two Great Sage Toads,\
        \ Fukasaku and Shima, have the skills to perform it. Barrier: Toad Gourd Technique:\
        \ Jiraiya summons a small toad that pulls enemies into its stomach, a space\
