    \ convey in a millisecond,Cosmic Powers Unlimited #2 assess a situation in a microsecond,Marvel\
    \ Graphic Novel #58 - The Enslavers and correctly calculate where a wormhole leads.\
    \ Intentionally annoyed Mephisto into releasing Shalla-Bal from his realm by playing\
    \ on Mephisto's hatred of pure love. Outsmarted the Grandmaster by making a wager\
    \ he knew he wouldn\u2019t accept, despite the fact Grandmaster was winning their\
    \ game, with his bluff intimidating the Grandmaster into folding.Silver Surfer\
    \ Vol. 8 (2016) #7 Deduced that Seekers are conduits of the Opposing Force, which\
