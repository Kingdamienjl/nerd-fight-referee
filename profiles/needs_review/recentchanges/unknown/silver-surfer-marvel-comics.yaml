    - field: intelligence
      value: "Extraordinary Genius Norrin Radd was, and as the Silver Surfer still\
        \ is, an exceptional scientist, tutored in this area by Jartran Radd and in\
        \ the nature of the universe by Galactus. He was self-taught in various areas,\
        \ especially history, and absorbed much Zenn-Lavian knowledge from \"Hypno-powered\
        \ study cubes\". He is able to understand information that would take a millennium\
        \ to convey in a millisecond,Cosmic Powers Unlimited #2 assess a situation\
        \ in a microsecond,Marvel Graphic Novel #58 - The Enslavers and correctly\
        \ calculate where a wormhole leads. Intentionally annoyed Mephisto into releasing\
        \ Shalla-Bal from his realm by playing on Mephisto's hatred of pure love.\
        \ Outsmarted the Grandmaster by making a wager he knew he wouldn\u2019t accept,\
        \ despite the fact Grandmaster was winning their game, with his bluff intimidating\
        \ the Grandmaster into folding.Silver Surfer Vol. 8 (2016) #7 Deduced that\
        \ Seekers are conduits of the Opposing Force, which is contained inside the\
        \ Currs, by observing Ravenous, and that to weaken the Seekers, he just had\
        \ to kill the Currs. Is a skilled enough with his illusions to trick the Impossible\
        \ Man, a skilled shapeshifter himself. While fighting Mrrungo-Mu, gave half\
        \ his power to Earl Weygand in order for Weygand to find the power plant that\
        \ provided most of Mrrungo-Mu's power, distracting the physically superior\
        \ Mrrungo-Mu by fighting him while Weygand found and badly damaged the power\
        \ plant, allowing Surfer to then finish off and destroy the power plant and\
        \ successfully weaken Mrrungo-Mu. Deduced that Brandy Clark had been the one\
        \ secretly aiding Doctor Dredd in his planetary assault on Galador due to\
        \ her grief and instability due to identifying and analyzing the circumstances\
        \ leading up to the attack, and exposed the Wraith Queen as the mastermind\
        \ secretly manipulating Brandy Clark. Quickly came up with a way to stop a\
        \ fusion of two stars from going supernova through a combination of cosmic,\
        \ quantum, and universal energies, guiding Quasar and Ronan on how to use\
        \ their energies in addition to his to stabilize the fusion. During his imprisonment\
        \ on Earth for over a decade, used his powers to study literally all of Earth's\
        \ culture and features, including \"every song ever written, the name and\
        \ phylum of every Earthly creature, every blade of grass\", as well as all\
        \ of Earth's films and pop culture. States that he understands rocket science.\
        \ Has spent a lifetime honing his skills with the Power Cosmic. Is shown to\
        \ be a skilled swordsman, and even when badly weakened matches Knull in a\
        \ sword fight. Skillfully fought off a thousand congregational souls without\
        \ getting overwhelmed, even with the fact that the force of their attacks\
        \ increased with every strike they made and despite the fact that Norrin wasn\u2019\
        t fully focused on the fight since he was looking for an Iridian soul to weaken\
        \ the Uni-Lord with. Skillfully outmaneuvered and defeated three alien goddesses\
        \ simultaneously despite being weakened and slightly holding back, even using\
        \ his board as a mobile weapon to counter their movements and attacks. Stated\
        \ that he's spent centuries fighting (and by extent besting) the warriors\
        \ and champions of countless worlds. Has repeatedly been shownSilver Surfer\
        \ (1968) #17 to be skilledSilver Surfer (2014) #9-#10 at playingSilver Surfer\
        \ (1987) #72-#73 dead.Silver Surfer Vol. 8 (2016) #11 Despite holding back\
        \ on both occasions, fought relatively evenly with Warrior One, a specially\
        \ trained and previously unbeaten warrior on a planet where every citizen\
        \ is trained in their certain craft to be the best in the universe, with Silver\
        \ Surfer later confirming that he was holding back in their previous battles\
        \ and easily stomping Warrior One once he got serious. Even without being\
        \ able to access his cosmic powers, easily defeated multiple opponents in\
        \ a gladiator ring and was noted to not only be an ideal possible opponent\
        \ for the Hulk in the eyes of his captors but also a skilled yet aggressive\
        \ melee fighter and weapons user.Planet Hulk: Gladiator Guidebook Is skilled\
        \ enough to put opponents in chokeholds with his legs despite being wrangled.\
        \ Has constantly been shown using his surfboard as a mobile weapon.The Mighty\
        \ Thor #3The Mighty Thor #4Beta Ray Bill: Godhunter #2Silver Surfer: Ghost\
        \ Light #5 Defeated the gladiator Algol Demonstar, veteran and winner of a\
        \ thousand battles, in close-quarters combat. Ended a war between two technologically\
