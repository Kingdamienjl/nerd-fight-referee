    text: "Extraordinary Genius Norrin Radd was, and as the Silver Surfer still is,\
      \ an exceptional scientist, tutored in this area by Jartran Radd and in the\
      \ nature of the universe by Galactus. He was self-taught in various areas, especially\
      \ history, and absorbed much Zenn-Lavian knowledge from \"Hypno-powered study\
      \ cubes\". He is able to understand information that would take a millennium\
      \ to convey in a millisecond,Cosmic Powers Unlimited #2 assess a situation in\
      \ a microsecond,Marvel Graphic Novel #58 - The Enslavers and correctly calculate\
      \ where a wormhole leads. Intentionally annoyed Mephisto into releasing Shalla-Bal\
      \ from his realm by playing on Mephisto's hatred of pure love. Outsmarted the\
      \ Grandmaster by making a wager he knew he wouldn\u2019t accept, despite the\
      \ fact Grandmaster was winning their game, with his bluff intimidating the Grandmaster\
      \ into folding.Silver Surfer Vol. 8 (2016) #7 Deduced that Seekers are conduits\
      \ of the Opposing Force, which is contained inside the Currs, by observing Ravenous,\
      \ and that to weaken the Seekers, he just had to kill the Currs. Is a skilled\
      \ enough with his illusions to trick the Impossible Man, a skilled shapeshifter\
      \ himself. While fighting Mrrungo-Mu, gave half his power to Earl Weygand in\
      \ order for Weygand to find the power plant that provided most of Mrrungo-Mu's\
      \ power, distracting the physically superior Mrrungo-Mu by fighting him while\
      \ Weygand found and badly damaged the power plant, allowing Surfer to then finish\
      \ off and destroy the power plant and successfully weaken Mrrungo-Mu. Deduced\
      \ that Brandy Clark had been the one secretly aiding Doctor Dredd in his planetary\
      \ assault on Galador due to her grief and instability due to identifying and\
      \ analyzing the circumstances leading up to the attack, and exposed the Wraith\
      \ Queen as the mastermind secretly manipulating Brandy Clark. Quickly came up\
      \ with a way to stop a fusion of two stars from going supernova through a combination\
      \ of cosmic, quantum, and universal energies, guiding Quasar and Ronan on how\
      \ to use their energies in addition to his to stabilize the fusion. During his\
      \ imprisonment on Earth for over a decade, used his powers to study literally\
      \ all of Earth's culture and features, including \"every song ever written,\
      \ the name and phylum of every Earthly creature, every blade of grass\", as\
      \ well as all of Earth's films and pop culture. States that he understands rocket\
      \ science. Has spent a lifetime honing his skills with the Power Cosmic. Is\
      \ shown to be a skilled swordsman, and even when badly weakened matches Knull\
