- id: claim-weaknesses-f4f6be31
  section: weaknesses
  axis: weakness
  text: 'The Silver Surfer rarely fights to truly kill, and often does not use his
    abilities to their fullest extent. Although his body does not require sleep, his
    mind still does in order to give it an opportunity to dream. The Surfer is extremely
    reliant on his cosmic power and is more of a fighter in his surfboard than without
    it. Feats: *Enters the Astral Plane of existence to destroy the soul of a foe.
    *Can create black holes *Atomizes an enemy *Can see past, present, and future
    at the same time *Can exist in the Singularity (dimension before Big Bang) *Teleports
    out of Quasimodo''s hands *Transmutes an enemy into a liquid, and an object into
    pure energy *Transmutes weapons into atoms *Used spatial cutting and dimensional
    portal creation with the power cosmic *Can travel through time *Precognition *Senses
    weakness of Gladiator (who is vulnerable to radiation) with Power Cosmic *Shrinks
    his body to subatomic size, where atoms appear as large as Solar Systems *Phases
    through a wall. phased out Dawn''s tonsils *Can seal people into his surfboard
    *Moves the moon with telekinesis *Can exist without his body and transform into
    air or snow *Can absorb energy, radiation, and sunlight to amplify his power *Can
    create an anti-gravity force field *Phases his hand into a woman''s head and rescues
    her mind from a "psychic abyss" trapped there by the Other, *Telepathically calms
    the population of a planet during world-threatening event *Can send his thoughts
    to others galaxies away through hyperspace. *Creates an illusion in Galactus''
    mind, scares Skaar with illusion *Erases memory of a guard *Frees himself of the
    Goddess''s control over him and resists a psychic blast from Moondragon, an already
    very powerful telepath, whose powers were amplified greatly by the mind gem. *Has
    resisted Power Absorption of Rogue *Resurrected himself after letting Doombots
    absorb his powers completely, which resulted in his death in outer space *Surfer
    can resurrect himself as long as power cosmic exists *Borgo (Frankensurfer), who''s
    an exact clone made of Surfer''s own energy, resisted Classic Doctor Strange''s
    power nullification *Has escaped a Time Loop *Has ties and wins over characters
    such as Thor, Beta Ray Bill, and the Hulk.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
