    \ his powers to study literally all of Earth's culture and features, including\
    \ \"every song ever written, the name and phylum of every Earthly creature, every\
    \ blade of grass\", as well as all of Earth's films and pop culture. States that\
    \ he understands rocket science. Has spent a lifetime honing his skills with the\
    \ Power Cosmic. Is shown to be a skilled swordsman, and even when badly weakened\
    \ matches Knull in a sword fight. Skillfully fought off a thousand congregational\
