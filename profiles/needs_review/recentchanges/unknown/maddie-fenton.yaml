- id: claim-powers-and-abilities-62e1657b
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics (Superior to humans like Tucker, who
    can kick doors off their hinges with a single strike,Danny Phantom; Season 1;
    Episode 3; One of a Kind and is comparable to other humans, who can survive being
    thrown across a room through a table and into a wall without any harm and get
    back upDanny Phantom; Season 1; Episode 7; Bitter Reunions) * Genius Intelligence
    (Help create all the weapons, gadgets, and vehicles of Fenton Works) * Empowerment
    (Humans possess the same emotional energy as the humans from the past, this energy
    is shown capable of empowering an individual and is described as the ultimate
    power in the universeDanny Phantom A Glitch in Time) * Acrobatics (Shown hereDanny
    Phantom; Season 1; Episode 17; Maternal Instincts) * Martial Arts (Stated that
    she is a ninth degree black beltDanny Phantom; Season 1; Episode 15; Public Enemies)
    * Weapon Mastery, Marksmanship and Vehicular Mastery (Shown throughout the series
    to be capable of using and operating the various gadgets, weapons, and vehicles
    of Fenton Works) Has access to all the gadgets and weapons of Fenton Works up
    to season 1 only. Below is a list of equipment Maddie herself has specifically
    used in season 1 and the powers and abilities they grant. * Non-Physical Interaction
    (Spirits / Abstract Emotions - Many of the gadgets and weapons at Fenton Works
    are capable of interacting with ghosts and causing them actual harm) * Smoke Generation
    (Has access to smoke grenadesDanny Phantom; Season 1; Episode 1; Mystery Meat)
    * Extrasensory Perception (The Fenton Finder utilizes satellites to track ghosts
    in the area) * Sealing (The Fenton Weasel sucks up ambient ghost energy, allowing
    it to capture and contain ghostsDanny Phantom; Season 1; Episode 4; Attack of
    the Killer Garage Sale) * Energy Projection, Portal Creation and BFR (The Fenton
    Bazooka is a two handed blaster that fires destructive blasts of energy, and can
    fire a beam of energy that acts as a portable ghost portal and sucks anything
    nearby into the Ghost ZoneDanny Phantom; Season 1; Episode 15; Public Enemies)
    * Power Nullification (The Specter Deflector is a belt that was made from parts
    of an anti-ghost shield. It repels and weakens ghosts that come into contact with
    it or the wearer, nullifying their powersDanny Phantom; Season 1; Episode 17;
    Maternal Instincts) * Energy Projection (Utilizes laser weapons) * Durability
    Negation (Has a dual blade that destroys ghosts on contact) * Energy Manipulation,
    Ice Manipulation and Electricity Manipulation (The Fenton Ghost Assault Vehicle
    contains many hidden weapons, including lasers and ice rays, as well as lightning)
    * Forcefield Creation and Power Nullification (The Fenton Ghost Assault Vehicle
    can generate an anti ghost shield) * Energy Projection and Electricity Generation
    (The goggles of her jumpsuit can fire beams of energy and hidden within her suit
    is multiple laser weapons and tazersDanny Phantom; Season 1; Episode 20; Control
    Freaks) All previous powers and abilities Has access to all the gadgets and weapons
    of Fenton Works up to season 2 only. Below is a list of new equipment Maddie herself
    has specifically used in season 2 and the powers and abilities they grant. * Non-Physical
    Interaction (Spirits / Abstract Emotions - Many of the gadgets and weapons at
    Fenton Works are capable of interacting with ghosts and causing them actual harm)
    All previous powers and abilities * Pressure Points (Shown hereDanny Phantom;
