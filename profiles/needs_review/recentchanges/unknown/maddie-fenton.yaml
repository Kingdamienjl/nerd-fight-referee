- id: claim-weaknesses-cb8e4ab0
  section: weaknesses
  axis: weakness
  text: 'Several Fenton Works gadgets and weapons only work on ghosts and have little
    to no effect on humans. Notes: The reason Maddie is currently scaling to ghosts
    is due to the fact that humans in Danny Phantom possess the same emotional energy
    as the humans of the past, and said energy is shown capable of empowering individuals.
    Maddie along with several other humans have also been consistently shown capable
    of contending with ghosts without special equipment. ==Notable Matchups== Victories:
    Losses: Inconclusive: ==References== ==Notes/Explanations== Category:Characters
    Category:Danny Phantom Category:Cartoon Characters Category:Female Characters
    Category:Good Characters Category:Adults Category:Humans Category:Hunters Category:Geniuses
    Category:Empowerment Users Category:Acrobats Category:Martial Artists Category:Non-Physical
    Interaction Users Category:Smoke Users Category:Extrasensory Perception Users
    Category:Sealing Users Category:Energy Weapon Users Category:Portal Users Category:BFR
    Users Category:Power Nullification Users Category:Durability Negation Users Category:Ice
    Users Category:Forcefield Users Category:Electricity Users Category:Pressure Point
    Users Category:Exorcists Category:Parents Category:Acausal Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
