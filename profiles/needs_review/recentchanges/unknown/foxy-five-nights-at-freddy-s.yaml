- id: claim-powers-and-abilities-82be24e3
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Remnant (High-tier), Inorganic Physiology
    (Type 1; is a possessed robot), Stealth Mastery (Foxy should be comparable to
    the other originals such as Bonnie the Bunny who has possessed the capability
    to sneak into offices in a split second completely silently since as far back
    as Five Nights at Freddy''s 2.Five Nights at Freddy''s 2Five Nights at Freddy''s
    Could repeatedly sneak up on Ralph, taking advantage of flickering lights to do
    so in one instanceFive Nights at Freddy''s Interactive Novel #1: The Week Before),
    Enhanced Senses (Can make his way to the office after the power goes out.Five
    Nights at Freddy''s Can see in the completely dark rooms of the pizzeria without
    them being illuminated by the player''s flashlightFive Nights at Freddy''s 2 Could
    hear Ralph''s hold on the stall door knob and could hear him in the bathroom from
    Pirate Cove), Limited Electricity Absorption (Can charge himself with 1.21 gigawatts
    of electricity through his feet), Bodily Weaponry (Unconventional; With his hook,
