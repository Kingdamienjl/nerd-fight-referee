        be shown flashing in the player's eyes in FNaF 1, but it's unknown if Freddy
        is causing this), possible Information Analysis (Some of the toy animatronics
        parts have been put in the old animatronics, the toys have a facial recognition
        software to detect criminals), passive Technopathy (Foxy's mere appearance
        causes the technology to flicker and turn off, all animatronics upon entering
        a room causes the camera to go static), Berserker Mode (Goes into an aggressive
        state around adults, even to the point of overcoming their innate passivity
        during the day), Resistance to Electricity Manipulation (Every animatronic
        in Pizzeria Simulator can be shocked without much damage. Sister Location
