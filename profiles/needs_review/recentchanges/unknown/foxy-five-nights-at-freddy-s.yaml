  attack_potency:
    text: 'At least Wall level (Capable of shoving a full-grown man into an animatronic
      suit with such force that it crushes his skull to the point that only his eyes
      and teeth survive in the timeframe of at most an hour.Five Nights at Freddy''s
      Capable of easily overpowering humans who would be required to be physically
      fit due to their job as a security guard like Phone GuyFive Night at Freddy''s
      1 Night 4 Phone Call and Mike Schmidt.Five Nights at Freddy''s Implied to have
      torn humans apart in the pastFive Nights at Freddy''s. Could beat up the industrial
      steel security doors of the office, and could have potentially broken them down
      by attacking them for long enough. Should be comparable to Bonnie, who could
      mangle a vent grate in a single hit. Could reduce Ralph''s door to splinters394773.549
      Joules), higher with bite (Superior or possibly comparable to the weaker Toy
      animatronics like Mangle who is considered the most likely candidate for the
      bite of 87,Five Nights at Freddy''s 2 which completely removed the frontal lobe
      of a human of unknown ageFive Nights at Freddy''s) | Wall level (Comparable
      to the Toy animatronics like Mangle and possibly comparable to his FNaF 1 self,
      was also used as replacement parts for the Toys. Despite being in worse condition,
      Foxy should be at least roughly comparable to his future self in this regard),
      higher with bite (Comparable to Mangle who is considered the most likely candidate
      for the bite of 87,Five Nights at Freddy''s 2 which removed the frontal lobe
      of a human of unknown age,Five Nights at Freddy''s and was also used as replacement
      parts for the Toys) | Street level (Can easily kill the protagonist, comparable
      to other UCN animatronics, who can damage skulls and rip humans apartFive Nights
      at Freddy''s: Ultimate Custom Night) | At least Wall level (Was built to be
      as similar to the original as possible, and is comparable to Springtrap), higher
      with bite (Springtrap is comparable to Fredbear who crushed a child''s head
      with no ill effects for himselfFive Nights at Freddy''s 4 Night 4 Minigame)'
