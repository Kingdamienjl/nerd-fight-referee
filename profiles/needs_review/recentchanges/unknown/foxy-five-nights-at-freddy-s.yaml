      value: 'At least Average, likely Above Average in general, Above Average in
        strategy and stealth (Despite being possessed by the spirit of a child, Foxy
        is surprisingly intelligent. Apart from possessing basic skills such as understanding
        English, ending phone calls, and checking cameras, Foxy and the other animatronics
        deliberately stored up their power for a week in order to escape the pizzeria,
        and are fully capable of placing traps and stalling for time. Where Foxy truly
        excels, however, is stealth, as he can easily sneak into the night guard''s
        office and can take advantage of camera static and flickering lights to catch
        his target by surprise), Animalistic in awareness (Is stated to be animalistic
