power_scale:
  tier:
    text: 5-C, higher with Punk Rotten, Low 5-B with strongest attacks
    source_ids:
    - vsbattles-eustass-kid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "Moon level (Countered a Cognac strike from Big Mom aimed for Nami and Usopp\
      \ and slightly scuffed her with a Punk Gibson,One Piece Vol. 100 Chapter 1013\
      \ Referred to by Kin'emon as mighty.One Piece Vol. 97 Chapter 978 Alongside\
      \ Law, he fought Big Mom with all of her Homies while she was using Ha\u014D\
      shoku InfusionOne Piece Vol. 101 Chapter 1024188.362 Exatons), far higher with\
      \ Punk Rotten (Portrayed as comparable to Post-Udon Gear 4th Luffy and Law.\
      \ Made Base Kaidou grunt in pain after slightly harming him with a Punk Vise,\
      \ and then made Zoan Kaidou cry out in pain with a Slam Gibson188.362 Exatons),\
      \ Small Planet level with his strongest attacks (Alongside Law's Kroom, his\
      \ Punk Clash drew blood from Big Mom and caused her to feel more pain than she\
      \ had felt in decades. Briefly fought a lifespan amplified Big Mom off-screen\
      \ alongside Law and blocked attacks from her Homies,One Piece Vol. 103 Chapter\
      \ 1036 but was eventually overpowered. Alongside Trafalgar Law, his Punk Corna\
      \ Dio cracked a lifespan amplified Big Mom's bonesOne Piece Vol. 103 Chapter\
      \ 1038One Piece Vol. 103 Chapter 1039 and made her fearful of getting hit by\
      \ it a second time [with one of her Homies even telling her to dodge the attack],\
      \ and his Damned Punk made a lifespan amplified Big Mom cough large amounts\
      \ of blood and scream in agonyOne Piece Chapter 10399.042 Zettatons)"
    source_ids:
    - vsbattles-eustass-kid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Relativistic+ (Kept up with Big Mom and intercepted her Cognac strike. Dodged
      Big Mom's Tenjin and was only tagged because it was a homing attack. Blocked
      attacks from Big Mom's Homies off-screen. His Punk Corna Dio blitzed a lifespan
      amplified Big Mom when he first used it)
    source_ids:
    - vsbattles-eustass-kid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class E (Comparable in strength to Base Luffy in Udon Prison),
      higher with Magnetism (With his metal arm, he was able to stop the force of
      Big Mom's cognac swing. Using Assign, he could pin a life-amplified Big Mom
      against a wall, with her being unable to break free from the wall)
    source_ids: &id002
    - mediawiki-61445
    confidence: 0.95
  striking_strength:
    text: Moon level, far higher with Punk Rotten, Small Planet level with his strongest
      attacks
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Moon level (Has taken several different attacks from Big Mom, which consist
      of Heavenly Bonbon,One Piece Vol. 99 Chapter 1001 Ikoku Sovereignty,One Piece
      Vol. 102 Chapter 1030 Fulgora,One Piece Vol. 100 Chapter 1011 Mama Raid,One
      Piece Vol. 102 Chapter 1029 and a Tenman Daijizai Tenjin strike.One Piece Vol.
      99 Chapter 1002 Took a point-blank punch from Big Mom to the face and was only
      slightly injured.One Piece Chapter 1009 Fought her off-screen for a long period
      of time while she was using Haoshoku Infusion and only took minor damage. Took
      many attacks off-screen from a lifespan-amplified Big Mom, and while he was
      momentarily incapacitated, he got up mere moments later without issue188.362
      Exatons)
    source_ids:
    - vsbattles-eustass-kid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Was noted by Basil Hawkins to have fought Kaidou until he literally
      could not stand anymore. Despite being badly injured after Kaidou defeated him,
      Kid was able to do slave work in Udon Prison while being cuffed with Seastone
      and missing an arm. And all of that was done while he recovered his strength
      to escape from Udon later, instead of getting weaker. Was capable of fighting
      Kaidou and Big Mom on the Roof of Onigashima, and despite taking damage from
      Big Mom on the roof and from Basil Hawkins channeling damage to him via his
      Devil Fruit, he was still capable of fighting and defeating Big Mom alongside
      Law, although he collapsed from exhaustion following Big Mom's defeat)
    source_ids:
    - vsbattles-eustass-kid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Tens of Meters, possibly higher (Gathered metal objects from the Slave House
      when he was outside of it)
    source_ids:
    - vsbattles-eustass-kid-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted in combat, Average otherwise (Doesn't seem to be that intelligent
      outside the battlefield, which was evident when he asked Killer what the Ox
      Bell at Marineford was)
    source_ids:
    - vsbattles-eustass-kid-unknown
