- id: claim-weaknesses-765b0427
  section: weaknesses
  axis: weakness
  text: 'Reze cannot use her explosion powers if she is wet, since the moisture prevents
    her from generating the necessary spark for her explosions. {| class="wikitable
    mw-collapsible mw-collapsed" !Notable Attacks/Techniques: |- | * Hybrid Transformation:
    By pulling a pin on her neck, much like a grenade, Reze can cause herself to explode
    and transform into a hybrid form. She also can perform the same technique but
    instead of just transforming, she blows her head off and leaves the rest of her
    body as a decoy to distract her opponents. This decoy can hold its own head and
    throw it, the head then explodes just like a bomb and reveals a transformed Reze.
    The headless decoy body can be remotely controlled and act as a bomb, catching
    its target off-guard.Chainsaw Man Chapter 44Chainsaw Man Chapter 46Chainsaw Man
    Chapter 46Chainsaw Man Chapter 46 * Explosion Creation: After pulling the pin
    on her neck, Reze gains the ability to create explosions. The explosions are powerful
    enough to destroy vehicles, buildings and asphalt roads. Her explosions are also
    effective against other Devils, being capable of harming Beam and Denji in his
    hybrid form. Besides that, Reze does not take any damage from her explosions,
    unless she desires, allowing her to use her powers without worrying about harming
    herself.Chainsaw Man Chapter 45Chainsaw Man Chapter 46Chainsaw Man Chapter 45Chainsaw
    Man Chapter 48 * Explosive Propulsion: By releasing explosions from her arms and
    legs, Reze can enhance her physical attacks and mobility with the explosive force
    from the blasts. She can also travel through the air by causing continuous and
    consecutive explosions, being capable of keeping up with cars.Chainsaw Man Chapter
    44Chainsaw Man Chapter 47 * Explosive Spark: By flicking her hands, Reze can release
    a spark which explodes upon impact. This attack serves as a long range projectile
    and is powerful enough to kill ordinary humans.Chainsaw Man Chapter 45 * Self-Detonation:
    Besides her ability to release explosions from her body, Reze also has the power
    to turn parts of her body into bombs. Unlike her normal explosions, which are
    more instantaneous, the explosive flesh behaves more like a remote bomb. The body
    parts that Reze losses by using them as explosives do not appear to cause her
    damage, since she is able to regrow them without needing to drink blood.Chainsaw
    Man Chapter 48Chainsaw Man Chapter 49 * Torpedo Transformation: Reze can transform
    her limbs into torpedoes, which makes her punches and kicks more devastating.
    Reze does not appear to suffer any damage from the detonation of her torpedo-like
    limbs.Chainsaw Man Chapter 48Chainsaw Man Chapter 48 |} ==Gallery== ==Notable
    Matchups== Victories: *Katsuki Bakugo (My Hero Academia) Dynamight''s profile
    (Joint Training Arc Bakugo was used. Speed was equalized) *Yang Xiao Long (RWBY)
