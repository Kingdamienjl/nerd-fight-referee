  stamina:
    text: Superhuman (Survived Earth being frozen for over 5 billion years in The
      Goofy Newbie. Worked a 43-day, 24-hour per day shift alongside Squidward and
      SpongeBob in Fear of a Krabby Patty. In Arrgh!, he could still function perfectly
      fine after transversing 40,000 paces in just a few hours. Cried for 4 days straight
      in Banned in Bikini Bottom. Stood still for 3 days straight in Clams. Fought
      a skeleton army from nighttime to sunrise without stopping in One Krabs Trash,
      and didn't seem tired afterwards). Can nevertheless recover all of his Stamina
      via Healing.
    source_ids: *id002
    confidence: 0.95
  range:
    text: Below Standard Melee Range
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: "Extraordinary Genius (Mr. Krabs is a cunning, successful businessman and\
      \ con man who has seventy years or more worth of experience of consistently\
      \ outsmarting and facing Plankton, who is a scientist who went to college, built\
      \ his own highly advanced laboratory, and regularly invents gadgets that far\
      \ surpass modern technology, such as a machine that can rewrite entire timelines\
      \ to switch lives with someone. In \"Truth or Square\", he made secret rooms\
      \ in The Krusty Krab that even those like SpongeBob or Plankton didn\u2019t\
      \ know about and even put cameras in everyone\u2019s house, including Sandy's\
      \ treedome. As a former Navy Cadet, Mr. Krabs is also exceptionally skilled\
      \ in hand-to-hand combat, and he defeated hordes of pirates in a sword fight\
      \ with only a telescope. Fought evenly with Sandy, who is a \"Blacker Belt\"\
      \ in karate and highly adapting karate master of multiple fighting styles. Battled\
      \ an entire army of undead skeletons without stopping, and has had prior experience\
      \ with doing so. Made several quick calculations to discover the nature of the\
      \ Randomland realm despite never going there, and he made these calculations\
      \ in seconds, even identifying the properties and source of SpongeBob's Spot\
      \ Master 6000. Managed and protected the Krusty Krab for an eternity. He is\
      \ capable of serving as a good mentor, as he has trained SpongeBob for the Fry\
      \ Cook Games, which is a prestigious Olympics-like series of events. Comparable\
      \ to SpongeBob, as they have created robots with the exact same statistics as\
      \ themselves)"
    source_ids: *id002
    confidence: 0.95
