    - field: weaknesses
      value: "Standard Devil Fruit users weaknesses. Excessive usage of Gear 4th renders\
        \ Luffy unable to use Haki for 10 minutes. Gear 4th greatly increases Luffy's\
        \ metabolism, making his body burn calories much faster and greatly lowers\
        \ how long he can remain in combat. Gear 4th: Tankman can only be utilized\
        \ when Luffy has consumed a sufficient amount of calories. However, after\
        \ improving his Haki in the Wano Arc, he no longer suffers the same drawbacks\
        \ when using Gear 4th, being able to activate and deactivate it at will without\
        \ any notable toll, and even being capable of using his King Kong Gun without\
        \ losing too much stamina in the process. Luffy has a limit on how much he\
        \ can use Gear 5th, Model: Nika, is a Mythical Zoan-type Devil Fruit that\
        \ allows the user to transform into the legendary \"Sun God\" Nika and gain\
        \ his attributes, namely a body with the properties of rubber. The fruit's\
        \ major strength, is that the user's body permanently adopts the properties\
        \ of rubber: their body can stretch, even when the user himself is nullified.\
        \ It also makes them almost entirely, immune to blunt attacks, including hand-to-hand\
        \ combat, bullets, or even cannonballs. Thanks to Luffy's own creativity both\
        \ in and out of combat, this fruit has consistently proven to be one of the\
        \ most formidable, versatile and unpredictable of its kind. The user's rubber-like\
        \ body also allows the user to survive falls from massive heights and collisions\
        \ that would kill a normal person. Stretching also allows the user to drastically\
        \ increase the range of what would otherwise be considered a powerful close-range\
        \ attack, turning it into a devastating long-range attack. A stretched limb\
        \ can also be used to store potential energy like a stretched spring, increasing\
        \ the velocity by stretching his arm back resulting in increased power. Combined\
        \ with Haki, his power is increased even more. Owing to rubber-like natural\
        \ insulating properties, the user is also immune to electrical attacks and\
        \ is also able to hit an electric Logia user without Haki. Once the fruit\
        \ is awakened, the user undergoes a drastic transformation. Their hair becomes\
        \ fiery and white, their eyes become more manic-like, and they gain a strange\
        \ wisp around their body. They also gain the ability to freely alter their\
        \ physique however they desire, being able to inflate their muscles without\
        \ the need to blow air into them. In addition, they can alter the environment\
        \ around them in a similar way, such as using the ground to deflect oncoming\
        \ attacks. Gear 2nd: This technique consists of Luffy accelerating the blood\
        \ flow in all or some parts of the body to provide them with more oxygen and\
        \ nutrients, making him much faster and powerful. It can be used to achieve\
        \ a full body effect, or an effect on any single area of his body (e.g. the\
        \ arm). The techniques in this mode are basically the same as the regular\
        \ attacks, but greatly increased by his enhanced attack speed and, consequently,\
        \ attack power. The known Gear 2nd specific techniques are listed below. *Gomu\
        \ Gomu no Jet Pistol: Luffy delivers a Gomu Gomu no Pistol so fast that his\
        \ fists movements are invisible, and it truly seems like he is shooting at\
        \ his opponent with enough power to send the opponent several meters away.\
        \ *Gomu Gomu no Red Hawk: Luffy uses his Bus\u014Dshoku Haki in conjunction\
