- id: claim-weaknesses-4d766ad9
  section: weaknesses
  axis: weakness
  text: 'As an Artificial Spirit, Beatrice has a terrible mana consumption rate in
    exchange for her immense power, which she got around by sneakily taking mana from
    those within Roswaal Mansion using the Forbidden Library as a medium. When far
    from the library, her strength is reduced. As a Spirit, running out of mana will
    make her mana-body unsustainable, but as Beatrice cannot naturally dematerialize
    this will actually kill her. | Beatrice''s nature as an Artificial Spirit also
    makes her contract with Subaru highly restrictive: She cannot make use of atmospheric
    mana; she cannot take mana from anyone other than Subaru; and she monopolizes
    Subaru''s ability as a contractor. Because of these restrictions, Beatrice''s
    ability as a Great Spirit is greatly reduced, and her strongest magic consumes
    far too much mana to be used freely.'
  source_ids: *id003
  decisive: false
  status: unverified
