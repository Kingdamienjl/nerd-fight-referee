  stamina:
    text: Unknown | Below Average (As her only source of mana is Subaru's decisively
      below-average reserves, Beatrice's mana can be stretched thin by a single real
      battleArc 10, Chapter 19, "An Enemy Far Too Great")
    source_ids:
    - vsbattles-beatrice-re-zero-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Tens of Meters with Magic, conditionally Hundreds of Kilometers with Door
      Crossing (Beatrice was able to teleport Subaru from Roswaal's Mansion to the
      Sanctuary,Volume 14, Chapter 2, "The Beginning of the Sanctuary and the Beginning
      of the Collapse" which by dragon carriage is a 7-8 hour journeyVolume 10, Chapter
      1, "At the Place they Returned To"), Interdimensional with various Yin Magic
      (The spell Al Shamak creates a hole to a different world. With Door Crossing,
      Beatrice can create an isolated subspace connected to the real world by doors,
      or open up a portal at a pre-established location connecting to a different
      dimensionArc 10, Chapter 31, "I'm Home, Welcome Back")
    source_ids:
    - vsbattles-beatrice-re-zero-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Genius (Beatrice has spent 400 years in the Forbidden Library, having read
      every single one of the books kept there,Arc 10, Chapter 30, "Ballpoint Pen"
      most written by the Witch of Greed herself. Consequently, she possesses an exceptionally
      vast amount of knowledge in various fields, and particularly those related to
      the theory and practical application of magic, her knowledge beingVolume 21,
      Chapter 1, "The Reason to Bring You Out" comparable to even Roswaal L Mathers.
      Despite her mind being occluded by the effects of a Forbidden Art, Beatrice
      devoted herself to deciphering the technique and reverse-engineering the sealing
      spell from within its seal, and then employed the Forbidden Art successfully
      when that knowledge was passed on to her from her future selfArc 10, Chapter
      4, "You're Welcome" through Subaru. Beatrice is capable of employing multiple
      varieties of spells in multiple fashions, as well as cast two spells of differing
      attributes at the same time. The simultaneous activation of magic is exceptionally
      challenging, as it's akin to taking a pen in each hand and writing an essay
      with one hand while drawing an illustration with the other,Arc 9, Chapter 52,
      "Aldebaran I" and doing so with differing attributes requires adding an extra
      brain for each additional attribute. Miraculously, Beatrice successfully activated
      EMM from within the deployment of EMT without either spell failing and cancelling.
      While applying the gravity-amplifying spell Vita to innumerable falling arrows,
      Beatrice made sure to apply a different weight to each arrow, a feat of equal
      difficulty to threading many needles at once without using one's hands. Possessing
      the talent to make use of theory in practice, Beatrice has the skill to use
      a single spell as a simultaneous act of offense and defense)
    source_ids:
    - vsbattles-beatrice-re-zero-unknown
    confidence: 0.6
    notes: auto_repair source extraction
