      value: "High Outerverse Level (A work of fiction in the human domain is its\
        \ own world, each of those worlds has an infinite amount of ideas, theories,\
        \ and again works of fictions, so basically it\u2019d be an endless recursion\
        \ of fictional worlds, and all these things reside within Kakera/fragments.\
        \ Someone like Beatrice is capable of creating an endless catbox with endless\
        \ tales depicted as fragments, each one of these fragments can contain the\
        \ previous I showed, and infinite worlds with infinite possibilities. Now\
        \ in just one of these worlds can contain wave functions, essentially a Wave\
        \ Function is a concept used in quantum mechanics that can formulate a Hilbert\
        \ Space/Quantum Configuration, which is a generalization of the Euclidean\
        \ Space, and this works as a Real Coordinate Space, therefore, it also works\
        \ as uncountably infinite higher dimensions. This is also supported from the\
        \ fact the difference between a lower dimension and higher dimension is uncountably\
        \ infinite following the concept of Projective Geometry. This hierarchy's\
        \ transcendency should then apply to every other hierarchy/world in the Human\
        \ Domain as they're shown to have relationships and is a recursion of the\
        \ same thing. This is then followed by another hierarchy, but involving kakera\
        \ this time. Making a single step Kotaru rewrites himself to a place with\
        \ no concepts of coordinates, space, and time. Where infinite versions of\
        \ yourself exist, and within this hierarchy, the higher you climb the more\
        \ knowledge you will be overflowed with. All this is just within one step.\
        \ It's also shown there are higher ideas of time with reality being yanked\
        \ upward multiple times, not with just time. After undergoing various forces,\
        \ these are the steps where you are no longer functionally human. Even ideas\
        \ such as love are this high up. Concepts like non-dualisms are irrelevant.\
        \ Passing through ideas of infinity. Reaching a layer that he can't comprehend,\
        \ this is the level that is the pinnacle of human conceptualization. The visitor\
        \ is already beginning to understand the problem of boredom, which is characteristic\
        \ of higher beings. [essentially anything from here is absolutely above the\
        \ way a human thinks.] This is the peak of all things and the peak of intelligence.\
        \ So high that the lower ladder of concepts has lost its meaning. All that\
        \ was below disappeared. The feeling of footing is already lost, an independent\
        \ return to human nature is no longer possible. This should also be the boundary\
        \ between the Human Domain and the Witch Domain that Beatrice also achieved,\
        \ but couldn't actually go up to the ladder due to him needing the agreement\
        \ of a witch. Although with the help of superior creatures managed to return\
        \ back to his usual converged conceptual body in the the ordinary world beyond\
        \ time, space, and coordinates; fearing the power of a god) | High Outerverse\
        \ Level (Manifested within the Witch Domain which is fully transcendent over\
        \ the Human Domain, and created her own domain within, known as the Golden\
        \ Land, which is produced from Beatrice's thoughts of the Endless, the Golden\
        \ Land is the highest world in Beatrice's game board which supersedes the\
        \ infinite hierarchy of kakera that she created. The Witch Domain should at\
        \ least be a repeatence of the Human Domain, as it's shown that the higher\
        \ world would see the lower world as kakera) | High Outerverse Level (Battled\
        \ and kept up with Erika), likely High Outerverse Level (In a sense, transcended\
