- id: claim-weaknesses-64bb0000
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Rock Armor: Marcos'' trump card
    in which he creates body armor using magic that covers his entire body. The armor
    is made of gray stones, his height is increased to three meters, and makes him
    immune to things like poison gas. *Discerning Eye: Marcos can check for dangerous
    magic reactions and/or any equipment people may have, by making his blue eyes
    glimmer slightly. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    ==Notes and Explanations== Category:Characters Category:Re:Zero kara Hajimeru
    Isekai Seikatsu Category:Male Characters Category:Knights Category:Earth Users
    Category:Leaders Category:Aura Users Category:Extrasensory Perception Users Category:Light
    Novel Characters Category:Anime Characters Category:Manga Characters Category:Internet
    Characters Category:Perception Users Category:Instinctive Action Users Category:Precognition
    Users Category:Information Analysis Users Category:Attack Reflection Users Category:Power
    Mimicry Users Category:Regeneration Users Category:Isekai Characters Category:Magic
    Users Category:Statistics Amplification Users Category:Enhanced Senses Users Category:Body
    Control Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
