- id: claim-powers-and-abilities-6c37c78d
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Statistics Amplification (Warriors\
    \ use mana via the Flow Method to strengthen themselvesArc 7, Chapter 98) *Regeneration\
    \ (Low; Having excellent control over the Flow Method greatly contributes to the\
    \ recovery of wounds and physical strengthArc 9, Chapter 23, \"The Gang's All\
    \ Here\") *Magic, Law Manipulation & Conceptual Manipulation (Type 2; Magic is\
    \ the process of imposing one\u2019s will on reality by manipulating mana to override\
    \ natural laws,Arc 9, Chapter 12 it is reality and meddling with logic to reshape\
    \ the natural order of the world, where the caster\u2019s will clashes with the\
    \ world\u2019s resistanceOne Wild Night and can bend the world's natural orderRiot\
    \ in Flanders. The laws of the world being concepts themselvesArc 9, Chapter 36\
    \ \u2013 \u201CProblem\u201D) *Earth Manipulation *Instinctive Action (Fights\
    \ on the level of Garfiel are immediate, with no delay between decision making\
    \ and action,Volume 20, Chapter 3 with the slightest delay being exploited by\
    \ their opponent.) *Perception Manipulation (More skilled than Garfiel who can\
    \ reach perfect focus, making his opponent all that remains in his consciousness.\
    \ By doing this all light, sound and unnecessary things are removed from his field\
    \ of view and he perceives everything in slow motion) *Enhanced Senses (People\
    \ of the other world have incredible eyesightArc 7, Chapter 34) *Extrasensory\
    \ Perception (2 layers; Knights can senseVolume 8, Chapter 2 the presences of\
    \ others. Knights can sense hostilityVolume 9, Chapter 2. Marcos is superior to\
    \ Garfiel Tinsel, who was able to detect the invisibilityArc 7 Chapter 95, \"\
    Enemies on all Bastions\" of Olbart Dunkelkenn in spite espite Olbart's invisibility\
    \ bypassing the mass-targeting effectArc 8, Chapter 58, \"Proof of Existence\"\
    \ of the Curse of Thorns. Even the power of the Divine protection of Ambushing,Arc\
    \ 8, Chapter 39, \"Laughter of the One Unbounded\" which can hide one from the\
    \ sight of Palladio's Evil Eye,Arc 9, Intermission, \"Katya Aur\xE9lie\" could\
    \ not escape the Curse of Thorns) *Aura (Overwhelming; Fighting spirit can cause\
    \ those around to feel like their skin is on fireVolume 15, Closing Chapter, and\
    \ make it feel as if the surroundings is shakingVolume 12, Chapter 2) *Information\
    \ Analysis (Comparable to Grimm who could perfectly judge the speed and trajectory\
    \ of his opponent's attackThe Sword Demon Battle Ballad Act 6) *Power Mimicry\
    \ (After being hit by Roswaal's martial arts technique, Marcos copied it and used\
    \ it on RoswaalOnce Upon a Time in Lugunica) *Attack Reflection (Superior to Garfiel,\
    \ who can redirect the force of his enemies attacksVolume 15, Chapter 3) *Analytical\
    \ Prediction (Superior to Emilia who dodged a rain of arrows by reading the shooters\
    \ intent.Bond of Ice, Chapter 1), *Body Control (The basics of flow method is\
    \ for the user to have have complete control over their body.The Golden Lion and\
    \ the Sword Saint: Riot in Flanders Users of the Flow Method can release heatVolume\
    \ 12, Chapter 4 from their body, Arc 7 Chapter 100: \"A Myriad Of Changes at the\
    \ Bastions\" which can vaporize snow around them) Resistance to: *Poison Manipulation\
    \ (With his Rock Armor) *Extreme Temperatures (Users of the Flow Method can resist\
    \ the effects of extreme coldArc 7, Chapter 104 and extreme heatVolume 20, Chapter\
    \ 1) *Absorption & Deconstruction (Matter; Users of the Flow Method can resist\
    \ the White Whale's absorption)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
