    far above Heat Man's flames https://static.wikia.nocookie.net/megaman/images/4/40/ZX_ModelOX_Ryuenjin.png/revision/latest
    - Shinkuujin Launches a blade beam of electricity, able to do so consecutively
    without issue. The electricity should be on par with Panther Flauclaws and his
    100 million volt discharges https://static.wikia.nocookie.net/megaman/images/5/58/ZX_ModelOX_Shinkujin.png/revision/latest
