  range:
    text: 'Standard Melee Range, Several Meters with their Team Blast Teamwork: Team
      Rose is excelled by the strong bond between the three, with Amy and Cream in
      particular having a bond as strong as the one between Sonic and Tails. While
      their team is often lighthearted and goofy in its nature, they make up for their
      lack of fighting instinct through their sheer tenacity and will. All three work
      seamlessly together, formidable enough to fight and match the likes of Team
      Sonic and the Chaotix. Despite some members being so young, they are adventurers
      and heroes in their own right. The three of them reliably work together in order
      to overcome any obstacle they may face through the strength of not only their
      members, but of their bonds as well.'
    source_ids:
    - vsbattles-team-rose-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Varies from Below Average (Big is very simple minded, although he is a very
      experienced fisherman, is capable with technology and is also an extremely skilled
      swimmer and climber. He is also a very capable combatant as he fought Metal
      Madness alongside the rest of Team Rose and could even fight Gizoids, who have
      thousands of years of combat experience) to At least Average, Gifted in combat
      (Amy is skilled with her Piko-Piko Hammer and can fight both against and alongside
      Sonic competently; Cream is skilled in cooking, decorating and Extreme Gear
      riding)
    source_ids:
    - vsbattles-team-rose-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
