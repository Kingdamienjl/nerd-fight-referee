    - field: range
      value: 'Standard Melee Range, Several Meters with their Team Blast Teamwork:
        Team Rose is excelled by the strong bond between the three, with Amy and Cream
        in particular having a bond as strong as the one between Sonic and Tails.
        While their team is often lighthearted and goofy in its nature, they make
        up for their lack of fighting instinct through their sheer tenacity and will.
        All three work seamlessly together, formidable enough to fight and match the
        likes of Team Sonic and the Chaotix. Despite some members being so young,
        they are adventurers and heroes in their own right. The three of them reliably
        work together in order to overcome any obstacle they may face through the
        strength of not only their members, but of their bonds as well.'
      source_id: mediawiki-4738653
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Varies from Below Average (Big is very simple minded, although he is
