- id: claim-weaknesses-3765a15d
  section: weaknesses
  axis: weakness
  text: "Team Rose has no proper Headquarters to speak of Notable Team Attacks/Techniques:\
    \ Speed Formation: Amy= * Rocket Accel: When performing Rocket Accel, Amy Rose\
    \ rolls into a ball, while the remaining Cream and Big get up behind Amy. Once\
    \ gathered, Cream and Big push Amy forward with extreme force, propelling her\
    \ forward at high speed as a yellow field forms around them, allowing the team\
    \ to damage enemies caught in Amy\u2019s path. * Tornado Hammer: When performing\
    \ this technique, Amy jumps into the air, where she pulls out her Piko Piko Hammer\
    \ and swings it around herself once, creating a vortex made of pink hearts that\
    \ she can launch at her targets from afar. While using the Tornado Hammer, Amy\
    \ gives off pink hearts. * Propeller Hammer: When using the Propeller Hammer,\
    \ Amy pulls out her Piko Piko Hammer and begins swirling around with it in a manner\
    \ similar to a propeller. This creates an updraft that allows her to momentarily\
    \ sustain flight through the air for a short time. Fly Formation: Cream= * Ascending\
    \ Flight: Cream starts flying into the air. At the same time, Amy grabs onto the\
    \ Cream's feet and Big grabs onto Amy\u2019s feet. As a result, Cream flies through\
    \ the air while the remainder of their team rides with them. * Quick Ascent: Cream\
    \ performs a sudden dash upwards when using Ascending Flight while the rest of\
    \ the team hangs on to her. While doing that, Cream is surrounded by their respective\
    \ aura. * Thunder Shoot: Cream punts one of the team members currently holding\
    \ onto them forward, like kicking a ball. In the process, the launched team member\
    \ is conferred in a crackling shield of electricity. Once the launched team member\
    \ hits an enemy, the enemy becomes temporarily stunned and also take damage if\
    \ the Thunder Shoot is powerful enough, while the launched teammate returns to\
    \ their position in the team formation. * Cheese"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
