  intelligence:
    text: 'Supergenius (Sage is a superadvanced AI made by a combination between Eggman''s
      base coding and fully integrating into Cyber Space, where Cyber Space in question
      is an entire reality built of the memories, hopes, dreams and even the very
      essences of the Ancients. It is capable of endlessly expanding with the memories
      of others, with the amount of data stored within being stated by Eggman to defy
      quantification. Capable of running different calculations and simulations; she''s
      able to run 1,700,050 simulations in an extremely short timeframe and had run
      millions of them to see the best way to keep Eggman alive) Standard Tactics:
      Sage oftentimes uses simulations to seek the outcome with the best possible
      chance of survival. As noted by Sonic, she is constantly deferring to odds and
      simulations while being quick to leap at a scenario that leads to victory. She
      has used varying tactics, ranging from standard blasts of energy to imprisoning
      Sonic''s friends within Cyber Space.'
    source_ids:
    - vsbattles-sage-sonic-the-hedgehog-unknown
    confidence: 0.6
    notes: auto_repair source extraction
