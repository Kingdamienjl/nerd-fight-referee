    - field: powers_and_abilities
      value: Passive *Superhuman Physical Characteristics *Genius Intelligence (Sage
        is a superadvanced A.I. created by Dr. Eggman to hack into Cyberspace. The
        A.I. had calculated millions of simulations into the future to guarantee Dr.
        Eggman's safety) *Inorganic Physiology (Type 2) & Small Size (Type 0; Is an
        AI created by Eggman and is around as tall as Sonic, if not smaller) **Intangibility
        (As an AI, Sage does not have a physical form. Is called a ghost girl by Sonic
        and casually phases through walls) *Enhanced Senses (Knows about the mysterious
        voice guiding Sonic, something that others like Knuckles are unable to hear)
        **Information Analysis (Stated that she knew Sonic's age, biometrics, and
        weaknesses. Can detect the rate at which Sonic's cyber corruption is affecting
        him) Communication *Automatic Translation (Integrated into Cyber Space should
        allowed Sage the ability to understand all languages, as Amy understood in
        real time the language of the Kocos, which was foreign to her) Mobility *Flight
        (Levitation; Often shown doing this and flew into the Supreme) *Teleportation
        (Casually teleported around Tails for a conversation) *Dimensional Travel
        (Can travel freely between Cyber Space and the real world) Activated Direct
        combative *Aura (Can glow with a red aura) *Energy Projection (Fired an energy
        blast at Sonic) *Telekinesis (Destroyed dozens of GUN helicopters without
        touching them) Hax *Sealing (Imprisoned Eggman, Amy, Knuckles, and Tails inside
        Cyber Space) *Summoning (Can call for a Titan from Cyberspace) *Sense Manipulation
        and Empathic Manipulation (With Cyber Cages; Amy described her experience
        within a Cyber Cage as being unable to see or hear things clearly while Knuckles
        described his time as drowning in terrible visions and emotions. Awakened
        Wyvern's rage against Sonic to have it chase after and attack him) *Data Manipulation,
        Hacking & Technology Manipulation (Is able to have control over Cyberspace
        to some extent and have access all the Data in Cyberspace, including the Ancients
        and The End) All previous abilities alongside all the abilities of Supreme.
        Passive *Superhuman Physical Characteristics (Gave Super Sonic a more difficult
        time than every other Titan) *Acausality (Type 4; Created with the Chaos Emeralds
        by the Ancients, which can grant Super forms the ability to function in places
        like the Egg Reverie Zone, where time is shown to be shifting constantly and
        Base characters can only helplessly float around. Could survive hits from
        Super Sonic at his strongest, who could harm Solaris through all points in
        its time and damage it) *Large Size (Type 1) & Inorganic Physiology (Type
        2; It is a large, towering mech that dwarfs Sonic in size) *Non-Physical Interaction
        and Conceptual Manipulation (Type 1; Can interact with entities such as The
        End) *Bodily Weaponry (I & III) (Its arms have sharp claws for hands. Is able
        to reveal extra parts of itself that fire lasers from its shoulders that act
        as angel wings.) **Invulnerability Negation (A mech made by the Ancients using
        the Chaos Emeralds, it's able to kill Super Sonic with certain attacks. Threw
        Sonic hard enough that it pierced through The End while it was invulnerable.
        Its sacrifice completely destroyed it). *Weapon Mastery (Skilled at using
        a giant gun) *Homing Attack (As seen here) Mobility *Flight (True Flight;
        Formed wings from the pillars which erupt from it. Flew to fight The End in
