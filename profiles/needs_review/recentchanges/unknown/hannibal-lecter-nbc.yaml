    - field: intelligence
      value: Genius (Hannibal Lecter is a brilliant forensic psychiatrist with an
        absolute mastery of human psychology, capable of interpreting microexpressions,
        hidden motivations, traumas, and emotional weaknesses with surgical precision.
        This allows him to profoundly manipulate people and predict their behavior
        with remarkable accuracy, both inductively and deductively. He constructs
        and inhabits a vast memory palace that grants him a near-perfect eidetic memory,
        effortlessly recalling minute details of conversations, crime scenes, smells,
        tastes, faces, and entire texts years later. He is fluent in several languages,
        possesses an encyclopedic knowledge of history, art, literature, classical
        music, and philosophy, and is a talented musician capable of performing complex
        pieces on the piano and harpsichord. His artistic ability is exceptional,
        drawing portraits and scenes with photographic precision. As a physician by
        profession, he excels in surgery and pharmacology, performing precise procedures
        in both medical and forensic contexts. He is an exceptional gourmet and chef
        with a deep understanding of culinary techniques, exotic ingredients, and
        aesthetic presentation. His analytical skills allow him to devise elaborate
        long-term plans, create complex deceptions, anticipate the movements of the
        police and the FBI, and adapt quickly to any unforeseen event. He combines
        all of this with almost superhuman emotional self-control, heightened sensory
        perception, and cultural sophistication)
      source_id: mediawiki-518677
      provider_id: vsbattles
      authority: high
      confidence: 0.75
