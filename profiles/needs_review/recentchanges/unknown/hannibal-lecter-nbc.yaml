  attack_potency:
    text: 'Street level+ physically Scales to 9.92 Kilojoules (Held his own against
      Jack Crawford. Fought with and eventually defeated Tobias. Tore off Red Dragon''s
      throat with his teeth. Broke a glass coffee table with an elbow. Bend a wooden
      cabinet. Splintered a door with multiple hits. Single-handedly stabbed through
      a cutting board. Easily knocked out Alana by slamming her head against a wall
      using a single arm.Hannibal S1E3: Potage Easily stabbed an entire ice pick through
      Professor Sogliato''s skull.Hannibal S3E3: Secondo Splintered every bone within
      a man according to Will,Hannibal S3E2: Primavera which would require this much
      strength), higher with weaponry.'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: 'Peak Human (While standing in the middle of a hallway, he quickly turned
      off the lights and run out of sight before Beverly, an FBI agent, could draw
      her gunHannibal S2E4: Takiawase), with Subsonic combat and reactions speedScales
      to 51.2236526978 m/s (Attacked Red Dragon with an axe before he could react.
      Quickly outmaneuvered three henchmen. Dodged several attacks from Tobias'' whips.
      Dodged multiple knife swings from Jack. Was fast enough to use a bodyguard as
      a shield and slam to another bodyguard with them unable to react.Hannibal S2E7:
      Yakimono Avoided being hit by bullets by rolling under the line of fire. Possibly
      dodged these gunshots off-screen. Scales to Will Graham who could dodge a bulletHannibal
      S2E9: Shiizakana)'
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: "Class 11250 lbf/ 566.9904625 kgf (Has easily snapped people\u2019s neck\
      \ on a few occasions.Hannibal S3E1: Antipasto Could contend with Tobias and\
      \ even managed to snap his arm. Threw a hammer with enough force to strike a\
      \ charging bodyguard and spin him sideways. Somewhat wrestled with Red Dragon.\
      \ Turned a human body into a heart after splintering all of its bones)"
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Street level+ (Can fight those who can harm him), higher with weaponry
    source_ids: *id002
    confidence: 0.8
  durability:
    text: 'Street level+ (Got slammed into big chunks of glass, with them instantly
      breaking each time. Got thrown across the room by Jack into a wooden cabinet,
      causing a door of it to shatter. Got kicked in the stomach by Red Dragon. Survived
      a car crash. Survived a back body drop. Survived a fall from the second floor
      while heavily injured. Survived a fall from the top of a cliff while injured,Hannibal
      S3E13: The Wrath of the Lamb although landed in water)'
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: "Superhuman (Endured being branded with almost no pain at all.Hannibal S3E7:\
      \ Digestivo Endured a heavy beating from Tobias, receiving multiple cut, slash,\
      \ stab wounds in the fight. Survived getting beat up by Jack for minutes. Was\
      \ tortured by Matthew.Hannibal S2E5: Muk\u014Dzuke Fough with Red Dragon after\
      \ suffering from a gunshot in the lower back)"
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Genius (Hannibal Lecter is a brilliant forensic psychiatrist with an absolute
      mastery of human psychology, capable of interpreting microexpressions, hidden
      motivations, traumas, and emotional weaknesses with surgical precision. This
      allows him to profoundly manipulate people and predict their behavior with remarkable
      accuracy, both inductively and deductively. He constructs and inhabits a vast
      memory palace that grants him a near-perfect eidetic memory, effortlessly recalling
      minute details of conversations, crime scenes, smells, tastes, faces, and entire
      texts years later. He is fluent in several languages, possesses an encyclopedic
      knowledge of history, art, literature, classical music, and philosophy, and
      is a talented musician capable of performing complex pieces on the piano and
      harpsichord. His artistic ability is exceptional, drawing portraits and scenes
      with photographic precision. As a physician by profession, he excels in surgery
      and pharmacology, performing precise procedures in both medical and forensic
      contexts. He is an exceptional gourmet and chef with a deep understanding of
      culinary techniques, exotic ingredients, and aesthetic presentation. His analytical
      skills allow him to devise elaborate long-term plans, create complex deceptions,
      anticipate the movements of the police and the FBI, and adapt quickly to any
      unforeseen event. He combines all of this with almost superhuman emotional self-control,
      heightened sensory perception, and cultural sophistication)
    source_ids: *id002
    confidence: 0.8
