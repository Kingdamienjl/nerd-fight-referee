    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Stealth Mastery (Even more than
        the other members of his band, Freddy possesses the capability of hiding out
        of sight, sticking to shadows and easily sneaking into offices. Could repeatedly
        sneak up on Ralph, with the latter running straight into him in one instance.Five
        Nights at Freddy''s: The Week Before), Enhanced Senses (Can make his way to
        Mike Schmidth''s office after the power goes out, engulfing the pizzeria in
        complete darkness.Five Nights at Freddy''s 1 (2014) Can see in the completely
        dark rooms of the pizzeria without them being illuminated by Jeremy''s or
        Fritz''s flashlight.Five Nights at Freddy''s 2 (2014) Should have comparable
        hearing to Foxy, who could hear Ralph''s hold on the stall door knob and could
        hear him in the bathroom from Pirate Cove. Possibly heard Ralph talk to him
        in the office from the stage.), Perception Manipulation (Freddy was directly
        responsible for the posters on the wall changing.), Empathic Manipulation
        (Caused Coppelia to see him as her friend despite her having been traumatized
        by the animatronics years ago.), Immortality and Body Control (Type 2; Is
        comparable to Bonnie, who was unharmed by his head falling off of his body
        and could operate the two simultaneously.), Mind Manipulation (Comparable
        to Chica, who caused Ralph to sing "Happy Birthday" to her, even putting the
        name Susie in his head to do so.), Technology Manipulation (Comparable to
        Foxy, who deliberately caused the lights to flicker to help him sneak up on
        Ralph.), Light Manipulation and Paralysis Inducement (His eyes can glow bright
        enough to illuminate a room, other animatronics show the ability to blind
        and stun people who look into their eyes for long periods of time.), Telekinesis
        (Various animatronics demonstrate telekinetic abilities, allowing them to
        manipulate objects and people), Dream Manipulation (Can appear in Mike''s
        dreams with his group)'
      source_id: character-stats-profiles-freddy-fazbear-recentchanges
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: 'Small Building Level (Dismantled Toy Freddy without any issues,Five
        Nights at Freddy''s 2: The Movie (2025) splitting his torso off from the rest
        of his body in the process. Crushed Ralph to death with a hug, which would
        require this much energy. Could beat up the industrial steel security doors
        of the office, and could have potentially broken them down by attacking them
        for long enough. Destroyed a locked wooden door alongside his gang,Five Nights
        at Freddy''s: The Twisted Ones which would yield this much energy. According
        to the newspaper, it is highly implied that the animatronics were responsible
        for dismembering, which would imply he is capable of ripping arms off. Capable
        of overpowering and brutally murdering the likes of Mike Schmidt, Ralph, Jeremy
        Fitzgerald and Fritz Smith, stuffing them in animatronics suit with such force
        that it ends up crushing their skulls in the process. Heavily implied to be
        feared by the other animatronics, which implies a considerable gap between
        them in power. Considerably stronger than Foxy, who splintered a wooden door
        at those levels of energy, and destroyed his twisted counterpart, which was
        able to bust a hole through a wall at this much energy. Considerably stronger
        than Chica; who had cracked a human skull open by stomping on it and ripped
        Twisted Wolf''s head off. Considerably stronger than Bonnie; who had mangled
        the gate of a vent at those leves of energy.), Higher with bite force (Split
        Max in half with a bite,Five Nights at Freddy''s: The Movie (2023) which would
        require this much energy. Vastly above Mr. Cupcake, who bit a hole into Springbonnie
        suit and caused the springlocks to activate, which were able to safely withstand
        a bullet from a Glock.)'
      source_id: character-stats-profiles-freddy-fazbear-recentchanges
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: 'Subsonic (Comparable to the others animatronics; with Foxy rushing Ralph
