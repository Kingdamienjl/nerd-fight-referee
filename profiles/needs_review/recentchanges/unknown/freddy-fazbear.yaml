      value: "Wall level. (A selection of his incarnations are capable of effortlessly\
        \ killing a fully grown man and stuffing them inside a suit with such force\
        \ that only their eyes and teeth remain. He also scales to the other animatronics\
        \ who can do the same, and in some regards, in harsher ways. This doesn't\
        \ apply to his Phantom form, however) | At least Universe level+ (Can defeat\
        \ Animdude with the help of a few other animatronics, who calls himself the\
        \ storyteller and the puppet-master, meaning he likely created the entire\
        \ game and universe. With his defeat, the game ends right on the spot. likely\
        \ Multi-Universe level. (Animdude also acts like the creator of the entire\
        \ Five Nights at Freddy's franchise. FNaF World, the original horror canon,\
        \ and the novel canon, are entirely separate realities, so it\u2019s pretty\
        \ fair to say there are multiple universes in the Five Nights at Freddy\u2019\
        s franchise that were created by Animdude. (Even if Freddy isn\u2019t typically\
        \ used for later parts, he should still scale to the other animatronics.)\
        \ He also defeated Scott\u2019s Head all by himself, who also acts as if created\
        \ the universe of FNAF 57: Freddy in Space, and every other game before it.\
        \ He even continued to list games he would make in the future.)"
      source_id: character-stats-profiles-freddy-fazbear-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: "Peak Human to Superhuman. (Capable of moving so fast around the Pizzeria,\
        \ a normal human wouldn\u2019t have time to react. Scales to animatronics\
        \ like Foxy, who can travel from Pirate Cove to the Office in a very short\
        \ time frame. Thanks to Custom Night in a few games, we know that the animatronics,\
        \ including Freddy, are capable of darting around the pizzeria in very short\
        \ times) | At least Superhuman. (Scales to Chica, who is capable of dodging\
        \ lasers from Chica\u2019s Magic Rainbow and petals from Sunflowers in the\
        \ Chica\u2019s Magic Rainbow minigame. Also scales to Foxy, who can pilot\
        \ his airplane around several missiles that fire at similar speeds from Souldozers.\
        \ Up to FTL. Capable of constantly dodging light beams and lasers from the\
        \ likes of Scott\u2019s Head and several of his other robots.)"
      source_id: character-stats-profiles-freddy-fazbear-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: durability
