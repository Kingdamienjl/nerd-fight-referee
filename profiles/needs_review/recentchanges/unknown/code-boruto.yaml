- id: claim-weaknesses-ad11096a
  section: weaknesses
  axis: weakness
  text: "Code can be somewhat arrogant. Code isn't able to use his White K\u0101ma\
    \ to absorb any jutsus. He can't use any of his Claw Marks to travel anywhere\
    \ if they have been shrunken. Notable Attacks/Techniques: *Body Transformation:\
    \ Similar to Kawaki and Delta, Code is able to weaponize portions of his body,\
    \ such as transforming his fingers into razor-sharp talons that can effortlessly\
    \ slice through flesh. *White K\u0101ma: As a failed vessel of Isshiki \u014C\
    tsutsuki, Code bears a White K\u0101ma which grants him access to his master's\
    \ \"pure power\", though the extent of its abilities remains unknown. In time,\
    \ it will allow him to transform into a complete, perfect \u014Ctsutsuki and carry\
    \ out the clan's will of devouring worlds and evolving in order to attain godhood.\
    \ When activated it spreads grey markings across the left side of his body forming\
    \ angular and curving geometric patterns, extending up to his left eye, almost\
    \ mirroring Jigen's. According to Amado, the way his body responded to the White\
    \ K\u0101ma gave him abnormally great power, exceeding even Jigen's. *Genjutsu\
    \ Communication: This technique is a projection-type genjutsu which is used to\
    \ meet with multiple people at once. It is used to compensate for the fact that\
    \ a group may not always be in close proximity. All the images projected by this\
    \ technique appear corporeal and even the immediate surroundings can be altered\
    \ by the user. *Shinjutsu: Shinjutsu (literally meaning: Divine Techniques) are\
    \ techniques of the highest order, mainly used by members of the \u014Ctsutsuki\
    \ clan. According to Amado, Shinjutsu are phenomena equivalent to divine miracles,\
    \ and all ninjutsu are attempts to reproduce the effects of these powers. Some\
    \ of the cyborgs modified by Amado were granted some of these abilities by having\
    \ DNA harvested from the remains of a god, Shibai \u014Ctsutsuki, implanted into\
    \ them.Boruto: Chapter 75 *Claw Marks: By mixing Chakra and the iron in his blood.\
    \ Code is able to create claw-shaped belts, and he is able to space-time ninjutsu\
    \ by using the belts as a portal to travel through any location or dimension.\
    \ He can also use the belts to travel with others. He is also able to use the\
    \ belts to teleport certain parts of his body like his ear, mouth, eye, or arm.\
    \ He can also use the belts as a way of communication as he places the belts on\
    \ his ears and mouth to contact with Ada. Previously with his limiters in place,\
    \ he could only create a limited amount of Claw Marks, but after having his limiters\
    \ removed. He is able to create more amounts of Claw Marks. He is also able to\
    \ use the belts to wrap around the Ten-Tails to manipulate and pinch off a small\
    \ piece of the beast to create small beings of the Ten-Tails. **Claw Grime: Using\
    \ his Claw Marks, wrapping their markings around splitting off the flesh of small\
    \ portions of the Ten-Tails to create humanoid soldiers similar to Fission Beings.\
    \ Being portions from the Ten-Tails the Claw Grimes are also able to manifest\
    \ a Rinnegan of their own. And can be capable of speech to an extent. The Grime\
    \ can also use the claw marks on each other to travel. Like the Ten-Tails, it\
    \ has an instinct to consume others and turn into a tree upon biting a target.\
    \ ==Gallery== Code manga.jpg Code3.png ==Notable Matchups== Victories: Losses:\
    \ Inconclusive: ==References== ==Notes/Explanations== Category:Characters Category:Naruto\
    \ Category:Anime Characters Category:Villains Category:Manga Characters Category:Cyborgs\
    \ Category:Chi Users Category:Statistics Amplification Users Category:Stealth\
    \ Masters Category:Free Movement Users Category:Acrobats Category:Surface Scalers\
    \ Category:Empowerment Users Category:Evil Characters Category:Aura Users Category:Illusionists\
    \ Category:Technology Users Category:Body Control Users Category:Portal Users\
    \ Category:Dimensional Travel Users Category:Teleportation Users Category:Nanotechnology\
    \ Users Category:Biology Users Category:Weapon Creation Users Category:Regeneration\
    \ Users Category:Antagonists Category:Boruto Category:Energy Users Category:Extrasensory\
    \ Perception Users Category:Weapon Users"
  source_ids: *id003
