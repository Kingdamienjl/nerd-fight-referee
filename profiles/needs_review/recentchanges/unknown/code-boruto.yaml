- id: claim-powers-and-abilities-7053f9ad
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Chakra Manipulation, Statistics Amplification
    (Can use chakra to augment his physical capabilities), Speed Enhancement with
    Shunshin, Stealth Mastery, Surface Scaling, Water Walking (Channels Chakra at
    the soles of his feet to walk on water and scale vertical surfaces), Acrobatics,
    Cyborgization (Like with all other members of Kara, Code''s body had been modified
    with Scientific Ninja Tools by Amado), Nanotechnology (Has a scientific ninja
    tool body just like Kawaki,Boruto: Naruto Next Generations Chapter 56 who has
    nanomachinesBoruto: Naruto Next Generations Chapter 68 implanted throughout his
    entire body that constantlCha circulatory and nervous systems at the cellular
    level, transforming him into a living scientific ninja tool.Boruto: Naruto Next
    Generations Chapter 25Boruto: Naruto Next Generations Chapter 26 This grants Code
    superhuman strength, durability, and speed Boruto: Naruto Next Generations Chapter
    24 even without the use of chakra), Body Control, Biological Manipulation & Weapon
    Creation (The nanomachines allows the user''s body to instantly undergo sclerosis
    or malacia to harden, soften, and expand. This allows him to transform parts of
    his body, weaponising it; Enabling him to alter his hands into various weapons,
    shapes and sizes, and transforming his fingers into razor sharp talons), Regeneration
    (Low. As a living scientific ninja tool, he should have regeneration comparable
    to that of Kawaki, whose body tissue can undergo rapid cellular division, able
    to regenerate lost anatomy and heal at an accelerated rate, able to mend his injuries
    in minutes, thanks to the nanomachines in his bloodBoruto: Naruto Next Generations
    Chapter 42), Illusion Creation (Can create illusory images of himself to communicate
    over a long distance with Genjutsu Communication. Should be able to alter the
    immediate surroundings just like Jigen), Portal Creation (Can create and spread
    numerous black bands like the one covering his face. These bands will adhere to
    anything they come in contact with and act as a personal portal he can pass through,
    either partially or completely, allowing him to strike from any location the bands
    touch), Dimensional Travel (Can travel freely to and from Isshiki''s dimension
    with his abilities), Teleportation (Can teleport to his black bands), Aura (As
    seen here), Empowerment (Karma involuntarily gives the user strength. After having
    his limters removed his power was further increased)'
  source_ids: *id003
  decisive: true
  status: unverified
