- id: claim-weaknesses-f5e35a71
  section: weaknesses
  axis: weakness
  text: 'Before reclaiming his memories, he was plagued by nightmares of the Djinn,
    but overcame it after his consciousness merges with Nehal, a psychological manifestation
    of his memories of his past life as Loki. After this, he grieves considerably
    for Loki''s son Fenrir (Due to him being a direct reincarnation of Loki and thus
    sharing his memories and cursed history as well), and was eventually driven mad
    because of it, holding considerable hatred against Odin due to the latter having
    imprisoned Fenrir, the hate eventually materialized towards Odin''s reincarnations
    as well, especially Eivor, even though she had nothing to do with Fenrir in the
    first place. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
