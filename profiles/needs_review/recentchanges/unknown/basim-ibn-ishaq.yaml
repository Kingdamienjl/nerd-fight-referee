power_scale:
  tier:
    text: At least physically, higher with his Damascus Steel sword and Hidden Blade,
      even higher with the Staff of Hermes Trismegistus
    source_ids:
    - vsbattles-basim-ibn-ishaq-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: "At least Small Building level+ (As a direct reincarnation of the Norse\
      \ Isu Loki, with incredibly high-enough concentrations of Isu DNA to be able\
      \ to easily handle the Yggdrasil supercomputer and understand all of its functions\
      \ and work mechanisms, he should easily be equal in strength to other Sages\
      \ like Bartholomew Roberts, Fran\xE7ois-Thomas Germain, direct Isu descendants\
      \ like Kassandra, Alexios and Pythagoras, and should at least be comparable\
      \ to the Isu themselves in terms of physical and combat prowess, and Kassandra\
      \ herself stated that Eivor, also a Norse Sage, was of similar strength to her.\
      \ Able to hold his own against Eivor even after being wounded, and the only\
      \ way Eivor could defeat him was to imprison him within the Yggdrasil Supercomputer),\
      \ higher with his Damascus Steel sword, even higher with the Staff of Hermes\
      \ Trismegistus"
    source_ids:
    - vsbattles-basim-ibn-ishaq-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: 'Hypersonic (Considerably swifter than Eivor and can also replicate the
      same feats as her, as well as parry arrows this fast, even being able to casually
      swat aside all of Eivor''s fully-charged arrow shots from her highly-advanced
      bows aimed right in his face without even needing to look, and any attempt to
      shoot at Basim in the first stage of his boss fight will cause him to easily
      swat aside all arrows being shot at him. Later made use of the Animus''s Bleeding
      Effect to absorb all of Eivor''s skills and abilities. WoG also confirms that
      Basim is far too fast for the Animus to keep up with him when he uses Assassin''s
      Focus,GamesRadar: Assassin''s Creed Mirage''s Animus Glitch effects happen because
      Basim is too elite to be contained, Original tweet here, archive here, backup
      image here in fact, he is so fast that even his own projectiles come to a near-standstill
      when he goes all out with his Assassin''s Focus Kills)'
    source_ids:
    - vsbattles-basim-ibn-ishaq-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class 5 (Briefly overpowered Eivor to see the small black mark
      on her neck that would identify her as a Sage, and is in general, much stronger
      than her. Can easily send himself hurling into the air with just his arm with
      his grappling hook without having the need to use nearby walls as support)
    source_ids: &id002
    - mediawiki-5052774
    confidence: 0.8
  striking_strength:
    text: At least Small Building level+, higher with the Staff of Hermes
    source_ids: *id002
    confidence: 0.8
  durability:
    text: At least Small Building level+ (Scales to his own striking strength, able
      to withstand blows from the likes of Eivor), higher with the Staff of Hermes
    source_ids:
    - vsbattles-basim-ibn-ishaq-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Shares many of the same stamina feats as Eivor, managed to muster
      his strength after being released from the Yggdrasil Supercomputer over 1000
      years later in order to grab the Staff of Hermes in order to rejuvenate himself),
      Infinite with the Staff of Hermes (No longer needs to eat, drink or sleep)
    source_ids:
    - vsbattles-basim-ibn-ishaq-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range, Extended Melee Range with his sword, Several Meters
      with the Staff of Hermes
    source_ids:
    - vsbattles-basim-ibn-ishaq-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Extraordinary Genius (He shares the same genius-level intellect as many
      of his Isu brethren, having long known about the precursor concepts of the Animus
      and all its features as if they were playthings for him thanks to possessing
      all of Loki's memories, with Loki having successfully managed to transfer the
      consciousness of his lover Aletheia into the Staff of Hermes for future resurrection.
      Easily managed to master various 21st-century technology merely by looking at
      them. As a young child, he was an incredibly-talented student of the great Arab
      polymath Al Khwarizmi, with Basim always coming back to read more books at the
      Library of Baghdad.)
    source_ids:
    - vsbattles-basim-ibn-ishaq-unknown
    confidence: 0.6
    notes: auto_repair source extraction
