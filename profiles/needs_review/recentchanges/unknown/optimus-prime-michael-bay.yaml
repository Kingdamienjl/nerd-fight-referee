    confidence: 0.8
  attack_potency:
    text: 'At least Small City level (Was able to hold his own and gain an upper hand
      against Revenge of the Fallen Megatron, Starscream and Grindor, only losing
      eventually because he was weakened and distracted. Optimus was the biggest threat
      to the Fallen, with him being the main reason the Fallen did not travel to EarthTransformers,
      Revenge of the Fallen Commentary, even going so far as to state that only Optimus
      could defeat the Fallen. The Fallen had energy beams that were this powerfulTransformers,
      Revenge of the Fallen: The Movie Universe, and tanked his own re-entry1.54 Megatons)
      | At least Small City level (Overpowered and killed The Fallen with ease and
      is superior to the likes of Devastator, with the Databook listing Devastator
      as "Power level 5" while the Fallen as "Power level 5+"Transformers, Revenge
      of the Fallen: The Movie Universe>1.54 Megatons) | At least Small City level
      (Stated to be stronger than he had ever beenTransformers, Dark of the Moon Breygent
      Trading Cards. Somewhat comparable to The Driller and can harm itTransformers,
      Dark of the Moon (Video game)), higher in Stealth Force, even higher with Weaponry
      (His Temenos sword completely cut through Lockdown and sliced through The Last
      Knight Megatron''s arm. His brass knuckles completely ripped through Shockwave''s
      armor. His axe easily ripped off Dark of the Moon Megatron''s head) and Flight
      Tech (Forced Shockwave and The Driller to retreatTransformers, Dark of the Moon
      (Video game))'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Subsonic movement speed (Should be capable of moving as fast as a Peterbilt.
      Can keep up with the Autobots like JazzTransformers (2007)), with Massively
      Hypersonic+ reaction and combat speed (Should be no different in speed to his
      later counterpart. Superior to IronhideTransformers (2007)) | Subsonic movement
      speed, with Massively Hypersonic+ reaction and combat speed (Should be the same
      as before). Supersonic+ flight speed (Should at least be comparable in speed
      to the Lockheed SR-71 Blackbird, given that his jet parts come from JetfireMach
      3.20) | Subsonic movement speed, with Massively Hypersonic+ reaction and combat
      speed (Should scale to his flight speed, as he has shown to be able to create
      maneuvers while flying with his jets such as here and here). Massively Hypersonic+
      flight speed with jets and with Flight Tech (Was able to outmaneuver The DrillerMach
      1,325.20)
    source_ids: *id002
    confidence: 0.8
