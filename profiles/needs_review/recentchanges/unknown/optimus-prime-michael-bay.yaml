  intelligence:
    text: 'Gifted (Lead the Autobots against Megatron''s decepticons for thousands
      of years. Optimus is shown to be a highly capable fighter, with knowledge of
      a wide array of fighting styles. Highly knowledgeable when it comes to Cybertron''s
      history and culture) Standard Tactics: In long range, Optimus will often utilize
      his long range weaponry against opponents. Once up close, Optimus will then
      switch to either melee or his melee weapons. Often utilizing weapons from his
      trailer. If Optimus were to face much larger foes or find himself at a disadvantage,
      Optimus will utilize his flight tech to amp himself up. Optimus often aims for
      vital areas such as the head.'
    source_ids: *id002
