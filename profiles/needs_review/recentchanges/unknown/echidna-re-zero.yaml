    - field: standard_equipment
      value: '*The Memories of the World: A white book crafted by Echidna that allows
        her to draw knowledge from the world''s memory. The book doesn''t just know
        the past and present, it also shows the true future. Most people''s minds
        would be fried if they attempted to read it, due to the sheer volume of information
        flowing into the reader''s mind. *The Meteor Staff: A plain, white staff that
        releases a large destructive force when supplied with Mana, sending an attack
        that causes utter decimation, mowing down everything in its path. According
        to Beatrice, Echidna created this meteor with the primary purpose of pestering
        the Divine Dragon, Volcanica.'
