- id: claim-weaknesses-94fda49c
  section: weaknesses
  axis: weakness
  text: "She has poor athleticism and tires easily when performing physical exercise.\
    \ Since Shima was not the most suitable host for Echidna's soul transference,\
    \ she was forced to leave behind her experience with magic. To her estimates,\
    \ it will take her roughly two years to regain all her skills and powers. Notable\
    \ Attacks/Techniques: Authority of Greed: Not much is known about the ability\
    \ granted to Echidna through this authority. However, her Book of Wisdom is believed\
    \ to be a product of it. The Gospels used by Beatrice, Roswaal and the Witches\
    \ Cult are stated to be incomplete copies of it. The Gospels are magic tomes guiding\
    \ the readers way to the future. * Book of Wisdom: The Book of Wisdom is a white\
    \ book Echidna owned that allowed her to draw knowledge from the world's memory.\
    \ The book didn't just know the present and past, it also knew what would happen\
    \ in the future, and drew its needed information from there. Unparallelled Magic\
    \ Proficiency: Echidna was able to use all six magic elements and was extremely\
    \ skilled in all of them with\u2013at the time\u2013unparalleled mastery. She\
    \ possessed a high quantity of mana and was capable of using every spell that\
    \ existed at the time, even creating her own spells to use. Following her death,\
    \ no one came close to her overall skill with manipulating magic, until her apprentice\
    \ Roswaal L. Mathers became the first and only person who would rival and even\
    \ surpass her in magical knowledge and proficiency. * Jiwald: A Yang Element magic\
    \ that allows Echidna to fire heat rays from her fingers. It is a heat-wave blade\
    \ which burns up, burns away, and eliminates anything it touches. Jiwald is a\
    \ straight-line attack, which makes it seem like it would have the weakness of\
    \ being easy to avoid however, the heat ray forcefully smashed things at lightspeed,\
    \ attacking straight at its prey. * Goa: A blaze of fire that incinerate foes.\
    \ * Healing Magic: Echidna summons water mana to heal the wounds of herself and\
    \ others, however it only affected physical ones. * Teleportation: Like Beatrice,\
    \ Echidna was capable of Teleportation Magic, with no one else holding the capabilities\
    \ to display such type of magic, not even her genius disciple Roswaal. * Al Shario:\
    \ Echidna was capable of casting a spell that literally brought the stars down\
    \ to earth, massacring her opponents. The speed of the stars was described to\
    \ be almost impossible to evade. * Castle of Dreams: The name given to a dream\
    \ world/pocket dimension created and maintained by Echidna using a rare magic\
    \ called dream arts. It is where her soul and the souls of the other five deceased\
    \ Witches of Sin resided up until her reincarnation as Omega. Echidna holds complete\
    \ and total control over the dream world and can freely alter its landscape. She\
    \ is capable of brining others into the dream and, once inside, access their memories\
    \ to the point of being able to recreate them down to the finest detail, or suppress\
    \ their memory altogether and prevent them from recalling their experience within\
    \ the dream. Due to its location in a separate dimension, certain phenomena from\
    \ the outside world does not apply within the Castle of Dreams. Such as Subaru\
    \ Natsuki's penalty for telling others about Return by Death, allowing him and\
    \ Echidna to openly discuss the power without any interference from Satella. *\
    \ Soul Transference: Soul Transference was a lost forbidden magic art that allows\
    \ a person to move their spirit from one body to another by overwriting the soul\
    \ of the target body with their own. By doing this over and over to extend their\
    \ life indefinitely, the user can, in theory, achieve what Beatrice termed as\
    \ \"subjective immortality\". However it has one major restriction in that for\
    \ it to work, the person whose soul is overwritten must be of blood-relation to\
    \ the caster. The spell was originally created by Echidna to gain immortality,\
    \ but she could not complete it before her demise. The spell was instead finished\
    \ by her apprentice, Roswaal. However, 400 years after her death, Echidna managed\
    \ to successfully transfer her soul out of the Castle of Dreams and into a living\
    \ body by gradually placing more and more of herself inside a clone of Ryuzu Meyer\
    \ named Shima over a period of ten years. After successfully resurrecting herself\
    \ in the present day she took on a new identity, renaming herself Omega. Item/Life\
    \ Construction: During her lifetime, Echidna created a variety of items and beings\
    \ due to her vast intellect and absolute mastery of magic. * Artificial Spirit\
    \ Creation: Echidna has created three artificial spirits: Puck, Beatrice, and\
    \ Echidna (a White Fox spirit that shares her name). It is unknown how she created\
    \ them, but they were created via an unspecified mechanism. * Clone Creation:\
    \ Echidna was capable of creating Ryuzu Meyer copies by using the original Ryuzu\
    \ Meyer as a basis for an experiment to research immortality. They were created\
    \ by crafting an artificial Od through a special spell and creating the rest of\
    \ the body through mana, adding that al"
