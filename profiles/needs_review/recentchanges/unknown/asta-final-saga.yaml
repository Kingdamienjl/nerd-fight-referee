    - field: weaknesses
      value: Reckless with little regard for his own safety, but this has lessened
        somewhat over the course of the story. Asta is exceptionally naive at times
        and is rather merciful. He can swing the Demon-Dweller Sword faster, but can't
        hit as hard with it and vice versa. Anti-Magic is less effective against amorphous
        magic such as Fog, and Sand Magic as they can simply flow back into position.
        The magic projectile function of the Demon-Dweller Sword requires time to
        charge and the actual type of projectile fired cannot be controlled by Asta.
        His Anti-Magic can be completely bypassed if the opponent lacks a component
        for him to swing at entirely (i.e. Blood Magic or Red Thread of Fate). He
        can only enter his Black Asta state three times a day and doing so places
        an incredible strain on his muscles and bones., Devil Union lasts 5 minutes,
        Partial Devil Union lasts 10 minutes
