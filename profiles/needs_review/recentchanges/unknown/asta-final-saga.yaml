    during the last second of their battle against Dante Zogratis. Can cut spells
    with its edge, just like his other three swords. In Devil Union, this sword can
    cut only what its user wants to cut, making it possible to pass through Asta''s
    allies. Asta Grimoire.png|Asta''s Grimore Demon-Slayer Sword.png|Demon-Slayer
