      Ladros while having a hole pierced into him without showing any pain. Managed
      to re-enter his Black Asta form against Zagred and defeat him despite having
      just been forced out of it due to the strain it put on his body. Right before
      and during the Spade Kingdom Raid, Asta fought against Nacht for two days straight
      and continued to train with Liebe for an extended period, likely without sleeping,
      then fought and defeated an Ancient Demon with Devil Union and immediately headed
      to the Spade Kingdom afterward, where he fought and defeated Lilith and Naamah
      and then fought Morris afterward despite the physical backlash of using Devil
      Union. Immediately after, he went on to use Devil Union after the 30-minute
      cooldown ran out, destroying Lucifero's incomplete vessel and then fighting
      him in his half-manifested state, wherein he was brutally wounded, but still
      managed to get back up despite Mimosa being unable to even get close to completely
      heal him. After having his wounds sealed by Nero but not completely healed,
      he re-entered the fight against the full power of Lucifero's half-manifestation,
      where he suffered more grave injuries and ran out of Devil Union while still
      having enough stamina left to deal a final blow to the Devil King in his base
