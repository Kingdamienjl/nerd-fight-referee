    - field: standard_equipment
      value: 'Grimoire: Asta wields a five-leaf clover grimoire, which he receives
        during his fight with Revchi. The grimoire is tattered and covered in dirt,
        a black five-leaf clover insignia at the center of its front cover. Assume
        that the grimoire possesses unusual magic but is otherwise ordinary. Asta
        is able to summon rusted swords out of it, which he uses for his Anti-Magic.
        His grimoire used to be a four-leaf clover grimoire that belonged to Licht.,
        Demon-Slayer: Asta''s first and primary Anti-Magic sword. It is the largest
        and heaviest of the four swords, dealing massive blunt damage with each swing
        and being a better shield overall, its heft means it is slower than the Demon-Dweller
        and Demon-Destroyer, making it less suitable for parrying and reflecting high-speed
        attacks. After the 6 months timeskip, Asta gained the ability to fly on Demon-Slayer
        by channeling Anti-Magic and calling it back by saying its name. By infusing
        Anti-Magic at the extremity of Demon-Slayer, Asta creates a spell called Black
        Divider. With Black Divider, Asta makes the extremity of Demon-Slayer sharper
        in order to deal deadlier injuries. In Devil Union, Asta changes the size
        of the sword itself, making it long and wide enough to deflect kilometer-sized
        projectiles., Demon-Dweller: His second anti-magic weapon, which he discovered
        towards the end of his fight with Mars. A thinner and more ornate weapon,
        Asta can swing it much faster than the Demon Slayer Sword, allowing him to
        defend against attacks too fast for him to block with the Demon Slayer Sword
        and slice and stab opponents. As a trade-off, it lacks some of the heft of
        the Demon Slayer sword, resulting in weaker blows. After the 6 months timeskip,
        Asta gained the ability to summon Demon-Dweller by saying its name and create
        several Anti-Magic slashes by filling the sword with Anti-Magic and swinging
        it., Demon-Destroyer: Asta''s third Anti-Magic sword can cut through magic
        spells with its edges, just like his other two swords. It can also sever the
        cause-and-effect relationship to absorb and remove the effects of magic spells
        as if they were never cast or even negate Reincarnation Magic. The shape of
        Demon-Destroyer changes when Asta is in Devil Union., Demon-Slasher: Asta''s
        fourth and most recent Anti-Magic sword, a katana taken from Yami Sukehiro
        during the last second of their battle against Dante Zogratis. Can cut spells
        with its edge, just like his other three swords. In Devil Union, this sword
        can cut only what its user wants to cut, Demon-Slasher Katana'
      source_id: vsbattles-asta-final-saga
      provider_id: vsbattles
      authority: high
      confidence: 0.75
