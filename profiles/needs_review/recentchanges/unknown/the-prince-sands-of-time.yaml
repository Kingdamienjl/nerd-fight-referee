      blows with his brother Malik, who while being possessed by Ratash, easily decimated
      a floor beneath him that massively dwarfed the Prince in size, simply by powering
      up, also took full-powered punches from Ratash's final form, who was now large
      enough to topple massive towers just by moving alone. Can tank attacks from
      the Dahaka and the Dark Prince. Also survived Klompa's stomps and attacks, with
