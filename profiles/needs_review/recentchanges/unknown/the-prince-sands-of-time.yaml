power_scale:
  tier:
    text: High 8-C
    source_ids:
    - vsbattles-the-prince-sands-of-time-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Large Building level (Easily defeated Ratash, who in his first form alone
      can easily destroy massive floors and ceilings with a single blast while holding
      back. Later fought against and defeated his brother Malik, who after being possessed
      by Ratash, became even stronger and casually destroyed an even bigger floor
      just by powering up. With the Djinn Sword, he was able to contend against Ratash's
      final form, which could easily destroy gigantic towers just by moving. He can
      easily trade blows with those who can harm him. Can easily damage gigantic monsters
      like Klompa, who is large enough to dwarf Babylon's already-massive buildings
      and whose boots alone completely dwarf the Prince in size. Killed Zurvan who
      casually busted a massive bridge with a single blast and ruined the roof of
      the Tower of Babel with his powers, can casually swing his sword so hard that
      he smashes walls and other similar barriers, and can even casually smash boulders)
    source_ids:
    - vsbattles-the-prince-sands-of-time-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Superhuman (Has outpaced the Dahaka on a multitude of occasions and is extremely
      agile, being able to run on walls as well. Can easily keep up with highly-trained
      Scythian hunting dogs and Sand dogs, which are considerably larger and more
      powerful than real-life hunting dogs) with Supersonic+ combat speed, short-burst
      speed and reactions (Can easily swat aside arrows in front of his face. Also
      capable of rolling away from swifter mechanical arrows at similar ranges), far
      higher with Ravages of Time (Can speedblitz virtually all enemies he encounters)
    source_ids:
    - vsbattles-the-prince-sands-of-time-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class 5 (Can easily move around massive stone blocks and wooden pillars
      on his lonesome. As the Dark Prince, he can easily yank out massive stone blocks
      with his Daggertail whip, and they are both the one and the same person)
    source_ids: &id002
    - mediawiki-224534
    confidence: 0.95
  striking_strength:
    text: Large Building level
    source_ids: *id002
    confidence: 0.95
  durability:
