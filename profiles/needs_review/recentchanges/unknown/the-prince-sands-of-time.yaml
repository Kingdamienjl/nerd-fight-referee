        of Time readily available (This weakness is non-existent with his Elemental
        Powers), the Prince must stab his enemies in order to freeze them in time
        (The Power of Haste, which also stops time, does not have this weakness, and
        can be activated at any given time without requiring body contact). Both his
        Sand powers and Elemental powers need a recharge time to be usable again,
        and some of them require a certain amount of Sand Tanks to activate. With
        the Mask of the Wraith, his health will rapidly drain unless he gets to a
        water source or absorbs sand from his enemies. Can be manipulated emotionally
