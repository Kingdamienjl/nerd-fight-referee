- id: claim-weaknesses-8b1f441a
  section: weaknesses
  axis: weakness
  text: The Prince cannot make use of his Time-based powers without the Sands of Time
    readily available (This weakness is non-existent with his Elemental Powers), and
    can only rewind it back to a certain amount without the aid of the Hourglass.
    Recall only works on one structure at a time. With the Dagger, the Prince must
    stab his enemies in order to freeze them in time (The Power of Haste, which also
    stops time, does not have this weakness, and can be activated at any given time
    without requiring body contact). Both his Sand powers and Elemental powers need
    a recharge time to be usable again, and some of them require a certain amount
    of Sand Tanks to activate. With the Mask of the Wraith, his health will rapidly
    keep draining until he kills his other self in order to be able to remove it.
    As the Dark Prince, his health will rapidly drain unless he gets to a water source
    or absorbs sand from his enemies. Can be manipulated emotionally and has feelings
    for his family and Farah. Becomes significantly more arrogant, hot-tempered, aggressive
    and restless during the events of Warrior Within, due to the Dahaka being after
    his life for seven years straight, all while having witnessed both the gruesome
    deaths of his mentor and mother during that timeframe. Other
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-6ce482ac
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Acrobatics *Stealth Mastery (As seen
    in The Two Thrones) *Expert Martial Artist *Weapon Mastery (Swords) *Magic, Time
    Manipulation, Time Stop and Precognition (Can slow, freeze, rewind time up to
    ten seconds, completely freeze time for his surroundings, and have visions of
    possible futures with the Dagger of Time. Can also slow down and stop time with
    the Djinn Power of Flow for much longer, while the Medallion of Time retains the
    ability to slow down and rewind time. After discarding both the Dagger and Medallion,
    he was still capable of having prophetic dreams, one such dream he had after making
    love with Kaileena showed Babylon in ruins, the return of the Vizier and the emergence
    of his dark self, foreshadowing the events of The Two Thrones) *Sand Manipulation,
    Teleportation (Via the Power of Haste and the Power of Flight, the Prince can
    instantaneously move from one opponent to the next) *Statistics Amplification
    (Via the Medallion of Time, he managed to increase his overall health and gain
    access to the Ravages of Time, which increases his speed significantly) *Explosion
    Manipulation (Via Breath, Wind, and Cyclone of Fate) *Elemental Manipulation (Via
    Djinn''s abilities. Power of Flow and Ice Blast both grant him Water Manipulation
    and Ice Manipulation, being able to freeze waterfalls, pipe drainages for acrobatic
    purposes and to freeze enemies or to impale them on ice spikes. Power of Memory/Earth
    Recall grants him Earth Manipulation, which allows him to rebuild old buildings
    brought to ruin, and Stone Armor surrounds his body in a stone armor to stave
    off further damage. Whirlwind grants him Air Manipulation and BFR, allowing him
    to create powerful gusts of wind to send enemies flying away from the battlefield
    and to never return. Trail of Flame grants him Fire Manipulation, which leaves
    behind fire trails to burn his enemies to a crisp) *Regeneration (Low; can heal
    from severe cut wounds quickly without medical aid, but they leave behind scars)
    *Immortality (Type 1) *Transformation (Into the Dark Prince) *Resistance to Corruption
    (Type 1; Razia granted multiple powers of the Djinn to the Prince, which kept
    him shielded from the Djinn Seal''s corruptive abilities. In addition, repeated
    usage of the Sand''s powers eventually granted him a sort of resistance to the
    Sand''s corruption. With the King''s sword, he managed to gain enough willpower
    on his own and resist the Dark Prince''s inner corruption and ultimately cast
    him out, enhancing his resistance even further) and Petrification (The Djinn seal
    also prevents its user from being turned into a statue due to Ratash''s capabilities)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
