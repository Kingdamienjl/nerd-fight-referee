        visions of possible futures with the Dagger of Time. Can also slow down and
        stop time with the Djinn Power of Flow for much longer, while the Medallion
        of Time retains the ability to slow down and rewind time. After discarding
        both the Dagger and Medallion, he was still capable of having prophetic dreams,
        one such dream he had after making love with Kaileena showed Babylon in ruins,
        the return of the Vizier and the emergence of his dark self, foreshadowing
        the events of The Two Thrones), Sand Manipulation, Teleportation (Via the
        Power of Haste and the Power of Flight, the Prince can instantaneously move
        from one opponent to the next), Statistics Amplification (Via the Medallion
        of Time, he managed to increase his overall health and gain access to the
        Ravages of Time, which increases his speed significantly), Explosion Manipulation
        (Via Breath, Wind, and Cyclone of Fate), Elemental Manipulation (Via Djinn's
        abilities. Power of Flow and Ice Blast both grant him Water Manipulation and
        Ice Manipulation, being able to freeze waterfalls, pipe drainages for acrobatic
        purposes and to freeze enemies or to impale them on ice spikes. Power of Memory/Earth
        Recall grants him Earth Manipulation, which allows him to rebuild old buildings
        brought to ruin, and Stone Armor surrounds his body in a stone armor to stave
        off further damage. Whirlwind grants him Air Manipulation and BFR, allowing
        him to create powerful gusts of wind to send enemies flying away from the
        battlefield and to never return. Trail of Flame grants him Fire Manipulation,
        which leaves behind fire trails to burn his enemies to a crisp), Regeneration
        (Low; can heal from severe cut wounds quickly without medical aid, but they
        leave behind scars), Immortality (Type 1), Transformation (Into the Dark Prince),
        Resistance to Corruption (Type 1; Razia granted multiple powers of the Djinn
        to the Prince, which kept him shielded from the Djinn Seal's corruptive abilities.
        In addition, repeated usage of the Sand's powers eventually granted him a
        sort of resistance to the Sand's corruption. With the King's sword, he managed
        to gain enough willpower on his own and resist the Dark Prince's inner corruption
        and ultimately cast him out, enhancing his resistance even further) and Petrification
        (The Djinn seal also prevents its user from being turned into a statue due
        to Ratash's capabilities)
