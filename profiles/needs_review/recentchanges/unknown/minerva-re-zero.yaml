- id: claim-weaknesses-6fdbc6f8
  section: weaknesses
  axis: weakness
  text: 'When Minerva physically interacts with something living, no matter what action
    she takes, it turns into something restorative. She could punch with all her strength
    and it''ll close wounds, wrestle someone while trying to wrench their limbs off
    and it''ll cure their chronic diseases. Notable Attacks/Techniques: *Authority
    of Wrath: Minerva can heal herself or others by taking any physical action against
    them. **This functions by twisting cause & effect to transform her might into
    healing. **It requires a massive volume of mana, which is drained from the Od
    Laguna, the soul of the world itself. **The aforementioned mana imbalance causes
    natural disasters on the other side of the world from Minerva, killing as many
    people as she saves. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==
    Category:Characters Category:Re:Zero kara Hajimeru Isekai Seikatsu Category:Aura
    Users Category:Aura Users Category:Fear Users Category:Female Characters Category:Healers
    Category:Regeneration Users Category:Internet Characters Category:Isekai Characters
    Category:Light Novel Characters Category:Supernatural Willpower Users Category:Teenagers
    Category:Witches Category:Statistics Amplification Users Category:Enhanced Senses
    Users Category:Body Control Users Category:Humans'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
