    - field: weaknesses
      value: 'Minerva cannot directly harm people due to the nature of her Authority,
        not even with a weapon. She can punch with all of her strength and it will
        only heal wounds, grab someone in a sleeperhold and it will heal broken bones
        and cartilages, wrestle someone in an attempt to yank their limbs out of their
        sockets and it will only heal chronic diseases, and not even an insect will
        suffer any kind of notable damage when she steps on it. Notable Attacks/Techniques:
        Authority of Wrath: Minerva can twist cause and effect to heal others by simply
        touching them. No matter the wound, disease or even if the target is completely
        mangled beyond comparison. This ability is so potent that it can bypass the
        effects of the Divine Protection of the Sould Reaper, which can cause cellular
        destruction, as well as undo the damage done by Typhon''s Authority of Pride,
        which breaks apart the target that she touches, effectively missing with their
        biological appearances. However, as a downside, Minerva cannot undo the healing
        properties provided by her Authority, meaning that any assaulting actions
        would result in the target being healed, not even stepping on an insect will
        make any harm and instead, said tiny creature will only become rejuvenated,
        and not even holding a sword or a gun will have any different effect, as the
        result will end in the target being healed. As such, Minerva can only cause
        damage to non living beings and attack living beings indirectly, like causing
        shockwaves or causing a landslide. Furthermore, due to her Gate being connected
        to Od Laguna, Minerva draws enormous amounts of Mana from core of the world
        to use her Authority, causing calamities and disasters to spread all around
        the world each time she heals a living being, causing the number of people
        that she saves to become way inferior in comparison to the number of people
        that the side effects of her Authority kills on a daily basis. Category:Morning
        Star TM Category:Tier 6 Category:Unknown Tier'
      source_id: character-stats-profiles-minerva-re-zero-unknown
      provider_id: character_stats_profiles
      authority: high
