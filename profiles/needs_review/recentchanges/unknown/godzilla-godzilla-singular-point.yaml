- id: claim-weaknesses-9650154d
  section: weaknesses
  axis: weakness
  text: "He can't move very well on land | Godzilla Amphibia is incapable of surviving\
    \ his own Flammable Ice Vapor attack | His back is vulnerable to aerial attacks\
    \ | None notable | None notable | None notable Notable Attacks and Techniques:\
    \ Notable Attacks and Techniques: Aquatilis \u25BE= *: In both his Aquatilis and\
    \ Amphibia form, Godzilla expels large amounts of archetype from his skin in the\
    \ form of red dust, forming a dense cloud around him. Godzilla Terrestris expelled\
    \ an even larger plume after generating a blue halo of energy in front of his\
    \ mouth. *Teeth/Tail: In this form Godzilla Aquatilis uses his natural weaponry\
    \ to destroy skyscrapers and other monsters. Amphibia \u25BE= *Flammable Ice Vapor:\
    \ Godzilla Amphibia can breath a flammable vapor that has a temperature of -20\
    \ degrees. *Cocoon: Godzilla Aquatilis was able to assume a second, amphibious\
    \ form after making landfall in Japan. Shortly after, Godzilla Amphibia formed\
    \ a cocoon around himself. Terrestris \u25BE= *Atomic Ring Blast: Godzilla Terrestris\
    \ can fire an Atomic Ring blast that is strong enough to one shots and kills a\
    \ super large Rodan. *Energy Burst: By manipulating the Red Dust Terrestris is\
    \ able to generate huge energy bursts. *Extendable Arms: In his third stage, Godzilla\
    \ can extend his arms twice their length. *Blood Tentacles: From his wounds, Godzilla\
    \ was able to extend the blood into a tentacle like formation, able to grab a\
    \ missile out of the air and smothering it's explosion. *Damage Reduction: In\
    \ his third form, it's revealed that he has an ability similar to the Anguirus\
    \ one, with the difference of, only reducing the damage against powerful weapons,\
    \ seeing him bleeding a bit with the impact of the missiles. *Reactive Armor:\
    \ Godzilla is stated to have reactive armor to attacks, that buffers his tissue\
    \ to future attacks, and rapidly generate tissue as well. *Regeneration: After\
    \ retracting his blood tentacles into his body, Godzilla Terrestris rapidly healed\
    \ from the injuries caused by the two JSDF bombs. Godzilla Ultima's regeneration\
    \ is much faster, as it immediately regenerated after a Manda was killed. Ultima\
    \ \u25BE= *: Like almost all Godzilla incarnations, Godzilla Ultima can fire his\
    \ signature atomic breath. Godzilla Ultima's more focused atomic breath is a condensed\
    \ blue-violet beam of ionized radiation that destroyed a column of JSDF tanks\
    \ and cleaved straight through multiple buildings, and was potent enough to leave\
    \ large areas of buildings destroyed and engulfed in flames. The atomic breath\
    \ is also strong enough to slice straight through a Manda with ease. After Godzilla's\
    \ growth spurt to a staggering 100 meters, his atomic breath increased considerably\
    \ in power, with it slicing a building in half in mere seconds and blasting a\
    \ hole straight through a supersized Jet Jaguar's face, and killed him when fired\
    \ at a point-blank range. *Terraformation: Godzilla's Archetype is able to create\
    \ bizarre plant-life over a period of time. This plant life is able to distort\
    \ dimensions such as space. Godzilla Ultima can also alter local wildlife."
