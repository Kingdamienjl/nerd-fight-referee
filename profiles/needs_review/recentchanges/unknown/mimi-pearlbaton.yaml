    - field: weaknesses
      value: 'Her Divine Protection''s Uses are limited to five times a day and Hetaro
        and Tivey are limited to two times a day, so the maximum usage per day is
        four times. Notable Attacks/Techniques: *Divine Protection of Trisection:
        Her Divine Protection, which she uses in conjunction with her brothers Hetaro
        and Tivey, enables them to bear each other''s physical and emotional burdens
        and can also be used to split damage between them such as to block death blows.
        However, as Mimi is the strongest out of the three, her brothers are often
        stuck with bearing her burdens. In addition, they can launch a destructive
        interference wave using the Divine Protection and the other siblings, though
        Mimi is limited to five times and Hetaro and Tivey are limited to two times,
        so the maximum usage per day is four times. *Magic: Mimi has a natural affinity
        for the earth attribute, and she is capable of using both earth and water
        magic. Though it is unclear how adept she is with her magic, she is at least
        capable of conjuring earthen walls, healing injuries, and creating barriers.
        **Healing Magic: Mimi can use a simple application of healing magic to heal
        the wounds of herself and others. She used this during the battle against
        the White Whale to heal soldiers'' wounds. **Multi-barrier: Mimi is capable
        of producing a dual-layered, wind-based barrier that can block physical attacks.
        However, the barriers can be shattered with sufficient force, as in the case
        of Theresia van Astrea. *Roaring Wave: The triplets unleash a burst of a violent
        destructive mana from their mouths together. Only two of the three of them
        can do it at a time. This ability was learned from Ricardo as he is the originator
        of that ability. ==Gallery== Mimi Borgar.png|Mimi Ordering a ham bulgar Mimi
        and her brothers.png|Mimi With Her Brothers: Tivey and Hetaro Volume 6 cover.png|Volume
