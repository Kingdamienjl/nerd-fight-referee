  intelligence:
    text: While Guilmon is not exactly book smart, as a combat-species Digimon it
      is an extremely talent fighter and killer. As it evolves it grows more intelligent,
      but more violent. However, despite it being more of a berserker, its later forms
      get even more skilled in combat. WarGrowlmon seems to be less of a berserker
      in battle and is a master of anti-air and anti-ground battle tactics. If trained
      by a pure and kind tamer, the Guilmon line can in fact be less berserker like.
    source_ids:
    - vsbattles-guilmon-unknown
    confidence: 0.6
    notes: auto_repair source extraction
