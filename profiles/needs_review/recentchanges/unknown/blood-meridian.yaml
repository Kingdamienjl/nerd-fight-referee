      value: Extraordinary Genius (Judge desires to learn all there is, believing
        that what he doesn't know about shouldn't exist at all. A proficient marksman,
        geologist, chemist, biologist, philosopher, lawman, draftsman, historian,
        and botanist, along with far more titles. His portraits of people are so lifelike
        that they are found disturbing. He never leaves behind any evidence despite
        his horrific crimes. A cold and calculated tactician that repeatedly wins
        battles with brutal and unconventional strategies, like when he surrendered
        to a group of Native Americans only to slaughter them at the last possible
        moment or when he lead the Glanton Gang into bat caves for sulfur and up a
        volcano, so they can make ad hoc Gunpowder. He is able to speak many different
        languages, mainly English, Spanish, and several Native American dialects.
        He is, however, truly and utterly sadistic. Capable of performing unspeakable
        acts on children and animals alike. Truly a mysterious and foreboding force
        within the novel akin to a fundamental force of nature)
      source_id: mediawiki-5032148
      provider_id: vsbattles
      authority: high
      confidence: 0.75
