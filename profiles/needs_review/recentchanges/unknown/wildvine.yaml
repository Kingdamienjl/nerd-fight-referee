    - field: powers_and_abilities
      value: '* Alien Physiology (All of Ben''s alien transformations follow the same
        rules and physiology as the Omnitrix, while also possessing all of its powers,
        functions, and resistances. While most of its functions have to be activated
        in specific manners, it also includes more passive ones) * Superhuman Characteristics
        and Physiology ** Natural Weaponry & Spike Projection (Can generate thorns
        across his body) ** Inorganic Physiology (Wildvine has physiological qualities
        of a plant) ** Plant Telepathy (Wildvine can telepathicly communicate with
        sentient plants that can''t speak verbally) ** Immortality (Type 2 & 3) **
        Regeneration (Low-High, Pax, a member of his species regenerated from having
        his whole body blown to pieces, comparable or superior to Swampfire, he can
        regenerate on cellural level) ** Resistance *** Fragrance Manipulation (Was
        immune to a toxic gas, as he doesn''t have lungs) *** Mind Manipulation (Florauna
        as a species are immune to mind control) * Plant Manipulation (Wildvine possesses
        chlorokinesis, the ability to telepathically interface with plant life. This
        was first demonstrated by Kevin in his second amalgamation form, where he
        used this ability to trap the Tennysons and his own teammates within thick
        vines. Another demonstration of this ability was seen by Negative Wildvine,
        who was able to remotely ensnare multiple individuals onto tables with vines.
        He should also have Swampfire''s plant manipulation abilities due to being
        the "main" plant-based alien) * Tendrils Manipulation, Shapeshifting, Body
        Control & Elasticity (Wildvine has five tentacle like legs that he uses as
        tendrils and manifest a large amount of additional ones. Wildvine has shapeshifting
        abilities, being able to transform his arms into whip-like tendrils that he
        can use against opponents. He can also shapeshift his entire body to mimic
        a flytrap and clumps of vines. Furthermore, Wildvine has control over his
        cellular growth, which allows him to extend his limbs and arms to suit his
        movement needs. Using this power, Wildvine turns his limbs into prehensile
        vine-like tendrils to grab and restrain others. Additionally, using his elastic
        limbs, Wildvine can swing around at great speeds, and grab bars and poles)
        * Explosion Manipulation, Smoke Manipulation, Sleep Inducement & Danmaku (Wildvine
        can grow black fruits on his back that contain a whole host of substances,
        allowing him to use them as explosives or smoke bombs that can cause people
        to fall asleep. His fruits can also grow vines * Underground Mobility (Wildvine
        can travel underground quickly and bring his opponent alongside him, as seen
        during his fight with the Werewolf when he dragged him underground) * Plant
        Merging, Camouflage & possibly Power Mimicry (Wildvine can merge with existing
        plants, allowing him to camouflage. If a plant has extraterrestrial abilities,
        he can likely use them, similar to how other aliens inherit the powers of
        whoever or whatever they possess) * Water Absorption * Empowerment (Stronger
        while exposed to sun) ** All of his classic coninuity self except Fruit Generation,
        and Alien Physiology ** Tendrils Manipulation (He retracts four large tentacles
        out of seeds on his back, those can also transform into leaves) ** Omni-Enhanced
        Form *** All previous but Enhanced *** Empowerment, Statistics Amplification,
        Electricity Manipulation, Fusionism & Earth Manipulation (This form allows
        him to fuse his powers with Shock Rock, allowing his attacks to be enhanced
        with electricity and infused with rock) *** Organic Constructs & Explosion
        manipulation (Wildvine now posseses an additional pair of Fulmini energy based
        tendrils with maces, which he can detach for them to explode upon impact)
        ****Superhuman Characteristics and Physiology *****Tendrils Manipulation &
        Transformation (Wildvine can transform his legs from bipedal to quadropedal)
        *****Inorganic Physiology *****Immortality and/or Regeneration & Pain Tolerance
        (Type 2 and/or High-Low; Survives Zombozo tearing out his limbs rather easily
        in a realistic dream sequence)'
