        tendrils and manifest a large amount of additional ones. Wildvine has shapeshifting
        abilities, being able to transform his arms into whip-like tendrils that he
        can use against opponents. He can also shapeshift his entire body to mimic
        a flytrap and clumps of vines. Furthermore, Wildvine has control over his
        cellular growth, which allows him to extend his limbs and arms to suit his
        movement needs. Using this power, Wildvine turns his limbs into prehensile
        vine-like tendrils to grab and restrain others. Additionally, using his elastic
        limbs, Wildvine can swing around at great speeds, and grab bars and poles)
