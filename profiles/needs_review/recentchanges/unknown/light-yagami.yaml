- id: claim-weaknesses-5492c087
  section: weaknesses
  axis: weakness
  text: After wielding the Death Note for a while, Light develops a god complex, harboring
    an unwavering belief in his superiority over others, He also takes sadistic glee
    in outsmarting his opponents, which ultimately cost him his life when he gloated
    prematurely against Near. The Death Note comes with several limitations - Light
    must have both the name and face of his intended target in order to successfully
    use it, and it cannot be used to manipulate subjects into performing logically
    impossible tasks. Additionally, Shinigami Eyes users can easily identify Light
    as a Death Note owner. In terms of power, he relies heavily on the Death Note
    to be considered powerful. Meaning that once he loses it, he will for the most
    part be considered vulnerable to even the most ordinary attacks. The Death Note
    is "rendered useless" if a victims name is misspelled 4 times, although the specific
    details of this rule are unknown. The Death Note requires great mental strength
    to yield due to its corruptive power.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-55a66599
  section: abilities
  axis: hax
  text: '*Peak Human Physical Characteristics *Extraordinary Genius Intelligence (Was
    stated to be the best student in all of Japan. Matched wits with the best and
    brightest of Wammy''s House) *Social Influencing (Leadership - Along side L, Light
    was capable of leading a group of skilled police officers, Deception - Constantly
    deceives FBI agents, trained detectives, and his own family, Charisma - Made many
    people believe in Kira''s decisions of killing all criminals in the world, Coercion
    - Constantly manipulates FBI agents and trained detectives, Reputation - Is renowned
    worldwide as "Kira", Instilling Fear - Made the entire world fear Kira due to
    him killing criminals with heart attacks *Enhanced Senses (Awareness: The smartest
    humans in the Death Note verse are capable of parallel processing through sheer
    brain capacity and analytical ability, which means they are capable of dividing
    their attention between several sources simultaneously, meaning he should be comparable
    to L and Near in this regard and superior to ordinary Wammy''s House students
    who can do this. Outside of parallel processing, Light''s senses are still highly
    keen. He can notice a difference of 5 mm in a door handle''s position with a glance.
    He was able to somehow see into the mini-TV potato chip bag while studying, which
    sat at almost a 90 degree angle to him and which he couldn''t directly look into
    without alerting L. He noticed Rem''s eyes slightly widening in fright out of
    the corner of his eye) *Information Analysis and Analytical Prediction (Light''s
    exceptional reasoning and thinking ability allowed him to easily honor L''s title
    as the World''s Greatest Detective, with L being a legendary force singlehandedly
    bringing crime rates down by the double digits. Predicted several of L''s moves
    and could often see through L''s traps on the fly. Predicted Higuchi''s next victim
    by analyzing Yotsuba''s stocks, deducing whose death would most benefit the company.
    Predicted Near''s plan months in advance. Light states he could deduce several
    pieces of information from mere email from Kira, such as his mentality, his age,
    and his region) *Hacking *Preparation (At the height of his power, Light commands
    L''s global power over police bureaus and intelligence agencies and has the Death
    Note) *Accelerated Development (Passive - Intelligence and'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
