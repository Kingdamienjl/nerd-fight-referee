    - field: intelligence
      value: 'At least Gifted (Ninjas, by default, have exceptional and well rounded
        scientific knowledgeShinobi Hiden Column 7: Science. Although she was criticized
        as a failure and unworthy to be the heir of the Hyuga clan, Hinata quickly
        honed her skills after reconciling her with cousin Neji, managing to hold
        her own against numerous Zetsu clones and eventually Juubi spawns during the
        Great Shinobi War. True to her clan''s traditions, she is a specialist in
        close-range combat who attempts to disable her opponent by sealing off their
        tenketsu before going in for the finish. She also has pronounced chakra control,
        acting as a medical-nin and assisted in the erection of numerous seals. Also,
        she produced various techniques of her own from what she already knew in the
        anime (which reappeared inside materials and the games), demonstrating creativity
        and ingenuity)'
      source_id: vsbattles-hinata-hy-ga-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Her fighting style is primarily limited to taijutsu, and there is a\
        \ small blind spot near the back of her neck, which her vision cannot cover.\
        \ Notable Attacks/Techniques: HinataByakugan.gif|Hinata activating her Byakugan\
        \ Byakugan's Blind Spot.png|A model of the Byakugan's sight range and its\
        \ blind spot Chakra Circulatory System.PNG|The Byakugan being used to view\
        \ the target's chakra network Byakugan (White Eye): This eye technique is\
        \ the kekkei genkai of the Hy\u016Bga clan and one of the Three Great D\u014D\
        jutsu. Wielders of this eye can see long distances (at least up to 10 kilometers)\
        \ and can see objects that are too small for the normal eye to detect (such\
        \ as the tenketsu points on a human's body). The Byakugan has an almost perfect\
        \ 360-degree field of vision, though there is a small blind spot located near\
        \ the back of the user's neck. The eye can also see through objects as well\
        \ as many barriers and can see chakra. Juuken (Gentle Fist): By taking advantage\
        \ of the Byakugan, the user can see a person's chakra pathway system. Juuken\
        \ inflicts internal damage through attacking the body's Chakra Pathway System\
        \ by injecting chakra into specific pressure points (tenketsu), subsequently\
        \ injuring internal organs that are closely intertwined with the pathways.\
        \ Once these tenketsu points are struck, they are, in turn, sealed and can\
        \ no longer produce chakra for a certain amount of time, severely limiting\
        \ the victim's chakra flow. Eight Trigrams Vacuum Palm.png|Eight Trigrams\
        \ Empty Palm Hakke K\u016Bhekish\u014D.png|Eight Trigrams Empty Wall Palm\
        \ (with Neji) J\u016Bho S\u014Dshiken.png|Gentle Step Twin Lion Fists HinataFighting.gif|Hinata\
        \ attempting to attack Pain with her Twin Lion Fists Anime32Palms.gif|Hinata\
        \ using a halved version of Eight Trigrams Sixty-Four Palms on Guren in the\
        \ anime *Hakke Kuushou (Eight Trigrams Empty Palm): After using their Byakugan\
        \ to locate a target's vitals, the user will attack with a forceful palm thrust\
        \ which releases a small wave of chakra. The attack is powerful enough to\
        \ blow a person off of their feet and has a range of several meters. *Hakke\
        \ Kuhekisho (Eight Trigrams Empty Wall Palm): A combination attack involving\
        \ two Juuken users who simultaneously strike a target with their Hakke Kuushou\
        \ (Eight Trigrams Empty Palm) technique. Hinata uses this jutsu in combination\
        \ with Neji. *Juho Soshiken (Gentle Step Twin Lion Fists): Hinata forms two\
        \ sizeable lion-shaped chakra shrouds around her hands, then uses them to\
        \ strike an opponent. The move dramatically increases her attacks' range and\
        \ destructive power. The lion heads also drain the chakra network of those\
        \ they touch. It is a challenging ability to learn, as the slightest mistake\
        \ in chakra control will lead to failure, meaning it is a feat requiring the\
        \ Byakugan. This technique can be used in conjunction with the Eight-Trigrams\
        \ Sixty-Four Palms. **Eight Trigrams Twin Lions Crumbling"
      source_id: vsbattles-hinata-hy-ga-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
