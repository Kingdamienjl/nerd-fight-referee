    - field: powers_and_abilities
      value: "Superhuman Physical Characteristics, Chakra Manipulation, Statistics\
        \ Amplification (Shinobi are capable of enhancing their physical capabilities\
        \ with the use of chakra. The Shunshin no Jutsu allows Shinobi to greatly\
        \ enhance their speed by focusing chakra in their feetRin no Sho, Page 197Naruto\
        \ Chapter 24Naruto Chapter 71), Surface Scaling and Water Walking (By focusing\
        \ chakra at the soles of their feet, Shinobi can scale and cling to vertical\
        \ surfaces, and even walk on waterNaruto Chapter 18Naruto Chapter 90), Taijutsu\
        \ Expert (Hinata is hailed as the \"master of Gentle Fist\" both in Naruto\
        \ \"The Last\" and the Boruto databookBoruto Databook), Acrobatics, X-ray\
        \ Vision, Extrasensory Perception (Capable of unconsciously sensing even the\
        \ slightest hint of chakra without activating her Byakugan. Could sense and\
        \ recognize Naruto's familiar chakraSasuke Shinden: Teacher's Star Pupil ),\
        \ Afterimage Creation, Stealth Mastery, and Speed Enhancement (The Substitution\
        \ Jutsu allows its user to instantly replace themselves with a nearby object\
        \ such as a tree log, plant, person, or clone at the exact moment they are\
        \ attacked. The Jutsu works even if the user is physically restrained or observed\
        \ by characters as observant as Sharingan or Sage Mode users. This creates\
        \ the optical illusion of the user being hit, which confuses the opponent\
        \ and gives them an opening to flee or counterattackNaruto Chapter 6Naruto\
        \ Chapter 54Naruto Chapter 374Naruto Chapter 580Naruto Chapter 674), Minor\
        \ Illusion Creation and Duplication (With the Clone TechniqueRin no Sho, Page\
        \ 220, Shinobi can create illusionary duplicates of themselves that have no\
        \ physical substance), Shapeshifting (With the Transformation Technique, Shinobi\
        \ can transform themselves into other people, animals, plants, and even inanimate\
        \ objects, such as weapons), Paralysis Inducement (With the Temporary Paralysis\
        \ TechniqueRin no Sho, Page 176, Shinobi can completely paralyze their targets\
        \ from close to mid range), Enhanced Senses (Byakugan allows her to see long\
        \ distances and tiny objects, has an almost perfect 360\xB0 field of vision,\
        \ can see through visual obstructions and her opponents' internal chakra systems),\
        \ Absorption (via Gentle Step Twin Lion Fists), Precognition (The byakugan\
