    - field: weaknesses
      value: "None notable | Before firing Hell's Snipe, her eyes and stinger glow\
        \ so slightly that it may seem a mere trick of the eyes. Notable Attacks/Techniques:\
        \ right|thumb *Hell's Snipe: Shaula's signature technique, invented by her\
        \ master Flugel. Shaula can summon magical white stingers and fire them with\
        \ unbelievable speed and accuracy. The stinger produces extreme heat and light,\
        \ appearing as a flash that evaporates whatever it hits. It's noted that Hell's\
        \ Snipe has an abnormal amount of mana poured into each shot, considering\
        \ how rapidly it can be fired in succession. This technique also has a built-in\
        \ laser-pointer for accurate sniping. **Infinite Hell's Snipe: An advanced\
        \ variant of Hell's Snipe, Shaula can manifest nearly a hundred \"gunport\"\
        \ magic circles in the air, aim them as she pleases, and have all of them\
        \ fire a Hell's Snipe each. right|thumb *Crimson Scorpion: Whenever the Pleiades\
        \ Watchtower's rules were broken, Shaula's contract forced her to transform\
        \ into her original Witchbeast form\u2014 a titanic scorpion. The scorpion\
        \ is as big as an elephant, its black carapace is hard as iron, it possesses\
        \ extremely dangerous pincers, and a tail with a stinger that could fire Hell's\
        \ Snipe at will. Shaula's humanity is nowhere to be found within this Witchbeast,\
        \ it is a \"cold-hearted killing-machine\". **Explosive Autotomy: The titanic\
        \ scorpion practiced autotomy when attacked, severing a pincer or its tail\
        \ and fleeing. This is a trap however, as the severed body part will soon\
        \ explode with extreme force, heat, and light. **Regeneration: To account\
        \ for its strategy of autotomy, the titanic scorpion can regenerate its pincers\
        \ and even its whole tail relatively quickly, and it even regenerates from\
        \ accumulated damage as it battles. However, this isn't so rapid as to render\
        \ severing its limbs or tail ineffective. **Attack Hue: When pushed to its\
        \ limits or filled with rage, the titanic scorpion, like other Witchbeasts,\
        \ will shift into its attack hue. The monster's carapace heats up and is dyed\
        \ a bright red, earning the Witchbeast its name \"Crimson Scorpion\", and\
        \ it becomes far more aggressive. Alongside this aggression, the Crimson Scorpion\
        \ becomes more powerful, its Hell's Snipe stinger empowered so as to be capable\
        \ of blowing away everything around itself. **Jesus Scissors Hellfire"
      source_id: mediawiki-452792
      provider_id: vsbattles
      authority: high
      confidence: 0.75
