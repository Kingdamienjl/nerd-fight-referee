    - field: weaknesses
      value: "If his Mental Stone takes damage, it could shut down his body. Despite\
        \ being able to reattach limbs, he can be incapacitated if he takes too much\
        \ damage. Has no control of Ky\u016Bbi Mode and has to seal him away to stay\
        \ in control. Though the Storm 4 DLC implies he can use Ky\u016Bbi Mode and\
        \ the Mecha-Kurama Avatar at will. Notable Attacks/Techniques: * Rocket Rasengan:\
        \ Mecha-Naruto's variant of the rasengan. Mecha-Naruto creates an electrical\
        \ purple orb of energy in the palm of his hand, he then propels himself toward\
        \ the opponent, slamming it into their chest. He then detaches his hand, sending\
        \ the opponent away with the rasengan before detonating it. * Naruto Beam:\
        \ Mecha-Naruto locks onto its target and fires an laser beam from its eyes.\
        \ It is capable of destroying several buildings in one fell swoop. * Tailed\
        \ Beast Cannon: Mecha-Naruto transforms part of its body into a cannon and\
        \ fires a powerful laser, made from the chakra of Mecha-Kurama, at its opponent.\
        \ * Ky\u016Bbi Mode: Mecha-Naruto's other self, Ky\u016Bbi Mode, is the result\
        \ of Mecha-Naruto regaining its Mental Stone after the Ninja World Tournament.\
        \ In contrast to its counterpart, Ky\u016Bbi Mode is destructive and shows\
        \ great hatred towards Mecha-Naruto for \"sealing him away\". In mechanised\
        \ variations, Mecha-Naruto possesses most of Naruto and Kurama's abilities,\
        \ such as the Rocket Rasengan and a mechanical variant of the Tailed Beast\
        \ Ball. Additionally, it can also shoot rays with its \"eyes\", after targeting\
        \ the opponent. * Mecha-Kurama: Similar to the Kurama Avatar of Naruto. It's\
        \ large size makes it extremely powerful and is still capable of using all\
