    - field: weaknesses
      value: "Each body only has a handful of abilities- they're weaker if they're\
        \ isolated from the others. Deva Realm has a 5-second window between repels.\
        \ Shinra Tensei drains Deva Realm, and Chou Shinra Tensei temporarily disables\
        \ all of his bodies, the energy required taking off a portion of Nagato's\
        \ lifespan. Chibaku Tensei uses up a lot of chakras. | None Notable. Notable\
        \ Attacks/Techniques: Rinnegan (Sa\u1E43s\u0101ra Eye): Said to be the most\
        \ powerful of the Three Great D\u014Djutsu, the Rinnegan is admired as being\
        \ able to bring forth all ninjutsu. The holder of these eyes can completely\
        \ master all five fundamental nature transformations that form the basis of\
        \ ninjutsu. It also allows the user to use all of the six paths techniques,\
        \ as well as the seventh path - that is \"beyond life and death.\" *Rikud\u014D\
        \ no Jutsu (Six Paths Technique): The power granted by the Rinnegan to manifest\
        \ the various abilities of the Six Paths. Nagato created the Six Paths of\
        \ Pain to utilize these techniques through the use of six separate corpse\
        \ bodies implanted with chakra receivers. These chakra receivers, which take\
        \ on the appearance of piercings, allow Nagato to control the bodies of Pain\
        \ freely and utilize a single path ability per body. Each figure has been\
        \ given its own set of Rinnegan eyes, linking its vision to help eliminate\
        \ blind spots. **Tend\u014D (Deva Path): This path grants the user the ability\
        \ to manipulate gravity to repel or attract objects, using their body as a\
        \ center point. These techniques cannot be used in quick succession, however,\
        \ and require a recharge time equal to the power of the previous attack. ***Shinra\
        \ Tensei (Almighty Push): Deva Path emits a large shock-wave of gravity capable\
        \ of large scale destruction. If Nagato cuts off chakra to all of the other\
        \ bodies and focuses it through the Deva Realm, this technique is capable\
        \ of city-level destruction. The normal Shinra Tensei has a five-second cooldown,\
        \ while the city level version has a much longer one. The full-powered Shinra\
        \ Tensei shortens Nagato's life, however, as it causes a massive strain on\
        \ his main body. ***Bansh\u014D Ten'in (Universal Pull): This ability allows\
        \ Deva Path to manipulate the force of attraction of an object by controlling\
        \ its gravitational pull. As opposed to Shinra Tensei, which pushes objects\
        \ away, Bansh\u014D Ten'in attracts objects towards the caster. ***Chibaku\
        \ Tensei (Celestial Star Bursting from the Earth): Deva Realm launches a dark-colored\
        \ gravity-generating sphere into the air. The orb tears up the local landscape\
        \ and forms the rocks, dirt, trees, etc. into a mountain-sized ball around\
        \ it, trapping and crushing anyone who was standing on the scene. If the spherical\
        \ body at the center is destroyed, the technique will be canceled. **Chikush\u014D\
        d\u014D (Animal Path): This path gives the Rinnegan user the ability to gather\
        \ various gigantic immortal creatures into battle. This summoning technique\
        \ doesn't require the blood of the caster. Each of Pain's summoned creatures\
        \ has the Rinnegan as well, granting them a shared vision. ***Kuchiyose no\
        \ Jutsu (Summoning Technique): Animal Realm can summon various giant creatures,\
        \ including a chameleon that can turn invisible, a dog that multiplies when\
        \ attacked, a rhino, a bull, a bird, and a panda with high durability properties.\
        \ He can also assemble all of the Pain bodies, and even subordinates such\
        \ as Konan at any time. Nagato himself can also convene the Gedo Mazo. **Ningend\u014D\
        \ (Human Path): Grants a Rinnegan user the ability to read the mind of a target\
        \ by placing their hand on the target's head. As a result of this ability,\
        \ the target's soul is ripped from their body, killing them. ***Ky\u016Bkon\
        \ no Jutsu (Absorption Soul Technique): A soul-sucking technique that rips\
        \ the soul out of a target's body once Human Path places his hand on the victim's\
        \ head. Ideal for gathering information as it reads the target's memories;\
        \ however, the target is killed during the process. **Gakid\u014D (Preta Path):\
        \ This path grants the Rinnegan user the ability to absorb chakra. This power\
        \ can suck the chakra out of ninjutsu, thus rendering such forms of offense\
        \ futile. ***F\u016Bjutsu Ky\u016Bin (Blocking Technique Absorption Seal):\
        \ An advanced sealing technique unique to Preta Path. This path can absorb\
        \ all forms of chakra manipulation including nature transformation, and can\
        \ also drain the chakra out of a target's body by coming in to contact with\
        \ them. Edo Nagato was able to absorb stolen chakra into his body, which regenerated\
        \ his withered and weakened state, restoring him to his prime. **Shurad\u014D\
        \ (Asura Path): The abilities of this path give the user robotic and cyborg-like\
        \ qualities. Described as a summoned mechanical body, these augmentations\
        \ allow Asura Path and Nagato to make use of various advanced weaponry. The\
        \ machine-like attributes granted by this path allows the user to further\
        \ transform their body, such as growing additional limbs. ***Chakra Propulsion\
        \ Cannon: The Asura Path allows the user to transform a part of their body\
        \ into a laser cannon."
