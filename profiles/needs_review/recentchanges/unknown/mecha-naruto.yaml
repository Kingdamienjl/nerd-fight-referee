- id: claim-weaknesses-828c5b92
  section: weaknesses
  axis: weakness
  text: "If his Mental Stone takes damage, it could shut down his body. Despite being\
    \ able to reattach limbs, he can be incapacitated if he takes too much damage.\
    \ Has no control of Ky\u016Bbi Mode and has to seal him away to stay in control.\
    \ Though the Storm 4 DLC implies he can use Ky\u016Bbi Mode and the Mecha-Kurama\
    \ Avatar at will. Notable Attacks/Techniques: * Rocket Rasengan: Mecha-Naruto's\
    \ variant of the rasengan. Mecha-Naruto creates an electrical purple orb of energy\
    \ in the palm of his hand, he then propels himself toward the opponent, slamming\
    \ it into their chest. He then detaches his hand, sending the opponent away with\
    \ the rasengan before detonating it. * Naruto Beam: Mecha-Naruto locks onto its\
    \ target and fires an laser beam from its eyes. It is capable of destroying several\
    \ buildings in one fell swoop. * Tailed Beast Cannon: Mecha-Naruto transforms\
    \ part of its body into a cannon and fires a powerful laser, made from the chakra\
    \ of Mecha-Kurama, at its opponent. * Ky\u016Bbi Mode: Mecha-Naruto's other self,\
    \ Ky\u016Bbi Mode, is the result of Mecha-Naruto regaining its Mental Stone after\
    \ the Ninja World Tournament. In contrast to its counterpart, Ky\u016Bbi Mode\
    \ is destructive and shows great hatred towards Mecha-Naruto for \"sealing him\
    \ away\". In mechanised variations, Mecha-Naruto possesses most of Naruto and\
    \ Kurama's abilities, such as the Rocket Rasengan and a mechanical variant of\
    \ the Tailed Beast Ball. Additionally, it can also shoot rays with its \"eyes\"\
    , after targeting the opponent. * Mecha-Kurama: Similar to the Kurama Avatar of\
    \ Naruto. It's large size makes it extremely powerful and is still capable of\
    \ using all of its former abilities. ==Notable Matchups== Victories: Losses: Inconclusive:\
    \ Category:Characters Category:Naruto Category:Absorption Users Category:Air Users\
    \ Category:Berserkers Category:Creation Users Category:Duplication Users Category:Energy\
    \ Projection Users Category:Energy Users Category:Enhanced Senses Users Category:Explosion\
    \ Users Category:Fire Users Category:Flight Users Category:Homing Attack Users\
    \ Category:Immortals Category:Incorporeal Characters Category:Inorganic Beings\
    \ Category:Light Users Category:Martial Artists Category:Mind Users Category:Multiple\
    \ Selves Users Category:Non-Physical Interaction Users Category:Pocket Reality\
    \ Users Category:Protagonists Category:Regeneration Users Category:Robots Category:Sealing\
    \ Users Category:Self-Destruction Users Category:Summoners Category:Transformation\
    \ Users Category:Vibration Users Category:Chi UsersCategory:Extrasensory Perception\
    \ Users Category:Weapon Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-12623a75
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Martial Arts, Inorganic Physiology (Type\
    \ 2), Absorption, Energy Projection (Can fire laser beams from his eyes), Light\
    \ Manipulation (Can use light to blind his opponents), Explosion Manipulation\
    \ and Homing Attack with Missiles, Flight, Enhanced Senses, Immortality (Type\
    \ 1 and 3), Regeneration (High Low; Can reattach his head), Mind Manipulation\
    \ (Mecha Naruto was able to switch bodies with Naruto), Duplication and Explosion\
    \ Manipulation (Can create 3 clones that explode after some time), Non-Physical\
    \ Interaction (Capable of fighting and interacting with Mecha Kurama, who exists\
    \ in the Mental Stone), Mind-Based Sealing (Mecha-Naruto was stated to have sealed\
    \ away Mecha-Kurama), Multiple Selves (Type 2) (Base Mode and Ky\u016Bbi Mode\
    \ exist within the same Mental Stone), Resistance to Possession (Was capable of\
    \ resisting Mecha Kurama's attempt at taking over his body) Naruto's body= Has\
    \ access to all of base Naruto's ability from Storm 3 All previous abilities enhanced,\
    \ Air Manipulation (Can generate air pressure with his attacks), Fire Manipulation\
    \ (Can shoot fire and even control his tails which are made of fire), Energy Projection,\
    \ Berserk Mode (Killed its creator upon being activated), Transformation (Into\
    \ Mecha-Kurama), Vibration Manipulation (Sent vibrations across Festival Island\
    \ which people thought was an earthquake) All previous abilities, Large Size (Varies\
    \ from Type 2 to Type 3; as the game protrays different sizes during gameplay\
    \ and cutscene), Pocket Reality Manipulation via Metal Stone (Created the mental\
    \ space), Mind Manipulation via Mental Stone (Can destroy mental bodies with his\
    \ normal attacks), Incorporeality (Its true essence doesn't have a physical body,\
    \ and in order to fight him, Naruto and Hinata had to be transported into the\
    \ Mental Stone), Summoning (Can summon his boomerang back to him after its been\
    \ thrown), Creation (Can create giant drills which he can launch towards his opponents.\
    \ Can create his arms if he loses them), Enhanced Mind Manipulation via Self-Destruction\
    \ (Was going to blow up the mental space and his own body along with it. This\
    \ was going to erase Mecha-Naruto's mind)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
