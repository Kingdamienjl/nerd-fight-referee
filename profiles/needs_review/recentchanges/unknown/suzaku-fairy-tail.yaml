- id: claim-powers-and-abilities-c321dc62
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Enhanced Senses, Extrasensory Perception,
    Magic, Empowerment (His emotions directly translate into magic power and his strength
    grows more powerful as said emotions get stronger), Absorption (Can absorb his
    element. All Mages passively absorb Ethernano from the atmosphere to regenerate
    their Magic Power), Absorption Negation (Dragon Slayers are capable of entirely
    negating the effects of the Anima, which is capable of absorbing all of someone's
    magic power and transmuting them into a Larcima Crystal), Master Swordsman, Non-Physical
    Interaction (Can cut fire), Dragon Slayer Magic (His Magic is especially effective
    against dragons and those with dragon-like properties, bypassing their defenses),
    Magic Resistance Negation (Can use Dragon Slayer Magic to damage characters and
    objects which are normally immune to Magic), Limited Regeneration Negation (Dragons
    are unable to heal or regenerate from injuries that come from Dragon Slayer Magic),
    Limited Power Mimicry, Awakened Power (Achieved Unison Raid, which is so difficult
    that even dedicating your entire life to achieving it isn't enough to use it),
    Resistance to High Temperature (Withstood direct attacks from Natsu and Ignia's
    Fire, which are hotter than 200 Million Degrees Celsius), Absorption (Dragon Slayers
    are completely resistant to the effects of the Anima, which is capable of absorbing
    all of someone's magic power), Transmutation (Dragon Slayers are completely resistant
    to the effects of the Anima, which is capable of transmuting someone into a Larcima
    Crystal), Sealing (Resisted and broke out of Dogramag's Earth Dragon God's Ji
    Korumea, which can completely seal someone within his Labyrinth), Possible Resistance
    to Slashing and Cutting Attacks
  source_ids: *id003
  decisive: true
