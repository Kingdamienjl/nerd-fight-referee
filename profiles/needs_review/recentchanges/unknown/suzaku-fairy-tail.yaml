- id: claim-weaknesses-5217eb93
  section: weaknesses
  axis: weakness
  text: 'Suzaku cannot eat the elements created from his own Dragon Slayer Magic to
    replenish his stamina. Notable Attacks/Techniques: Sword Saint Dragon Slayer Magic:
    Suzaku is able to use this Magic that allows him to gain the abilities and characteristics
    of a Sword Saint Dragon. This Magic revolves around physical swordplay. Suzaku
    in particular employs what he calls his Kurnugi-Style Sword-Drawing Art, in reference
    to the dragon he ate to acquire this Magic, as well as creating a new sword-drawing
    art based on it called Kurnugi-Style Sword-Drawing Art Abyss. *Kurnugi Style Sword
    Drawing Art: Underworld Drop: Suzaku creates instantaneous slices and slashes
    along with a dark aura that shred everything in their vicinity. *Kurnugi Style
    Sword Drawing Art: Underworld Cycle: Suzaku holds on to his sword as he creates
    a pressure around him, the blade of his sword would then create some light before
    he slashes his sword forward releasing a circular attack onto his target. *Kurnugi
    Style Sword Drawing Art: Underworld Purgatory Dance: Suzaku draws his sword and
    then slices his opponent with multiple instantaneous slashes across their entire
    body. *Kurnugi Style Sword Drawing Art Abyss: Underworld Black Purgatory Slash:
    Suzaku holds his sword as he creates a vortex around him, he would then rush onto
    his target as he slash them with his sword and surround them with the vortex that
    he have created. Suzaku Underworld Drop.jpeg|Kurnugi Style Sword Drawing Art:
    Underworld Drop Selene and Suzaku Attack.jpeg|Kurnugi Style Sword Drawing Art:
    Underworld Cycle Suzaku Underworld Purgatory Dance.jpeg|Kurnugi Style Sword Drawing
    Art: Underworld Purgatory Dance Suzaku Abyss Underworld Purgatory Slash.jpeg|Kurnugi
    Style Sword Drawing Art Abyss: Underworld Black Purgatory Slash Unison Raid: Suzaku
    possesses the ability to perform a Unison Raid, which is an extremely powerful
    ability that allows two Mages to unite two kinds of Magic similar in nature together,
    thereby creating an even stronger attack. Suzaku has performed a Unison Raid with
    only Natsu so far. *Fire Dragon''s Slash: Suzaku hands over his sword to Natsu,
    who then wreathes the blade with his flames and slashes their target with the
    blade while soaring with wings made of fire. Natsu Fire Dragon''s Slash.jpeg|Fire
    Dragon''s Slash ==Gallery== Fairy Tail Suzaku Render.png ==Statistics Values==
    ==Notable Matchups== Victories: Losses: Inconclusive: ==References== Category:Characters
    Category:Fairy Tail Category:Absorption Users Category:Dragon Slayers Category:Empowerment
    Users Category:Enhanced Senses Users Category:Magic Users Category:Male Characters
    Category:Manga Characters Category:Non-Physical Interaction Users Category:Power
    Mimicry Users Category:Resistance Negation Users Category:Sword Users Category:Weapon
    Masters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
