    - field: weaknesses
      value: 'Team Sonic has no proper Headquarters to speak of Notable Team Attacks/Techniques:
        Formations: Depending on the number and intensity of the obstacles in their
        path, Team Sonic is quick to utilize different strategies by having a member
        in the lead of their formation. They can shift into three types, and can do
        so in a moment''s notice with nothing but a quick call to their allies., Flight
        Formation: The formation Team Sonic assumes with Tails in the lead. Sonic
        grabs onto tails ankles, Knuckles does the same to Sonic, and the three of
        them form a tower-like position. This position is one that capitalizes range
        and mobility, and is the formation they use when an obstacle can''t be solved
        with speed nor strength., Power Formation: The formation Team Sonic assumes
        with Knuckles in the lead. When moving, Sonic and Tails stand equal distance
        apart on either side of Knuckles in an "impassable wall" type position. This
        formation is one that relies on overwhelming offense to make up for a slight
        decrease in speed and mobility, and is one that they often use in the face
        of stronger enemies or overwhelming numbers., Speed Formation: The formation
        Team Sonic assumes with Sonic in the lead. When moving, Tails and Knuckles
        rally side-by-side behind Sonic like a precise arrow tip. This formation is
        one that is primarily used for travel and quick-fire attacks, The Triangle
        Dive, Ascending Flight: Tails takes to the skies and can freely maneuver for
        limited amounts of time. The more Tails moves, the less he can remain airborne
        with his allies attached to him (Fly Formation)., Quick Ascent: For a swifter
        rise into the air, Tails will perform a sudden dash upwards., Triangle Dive:
        When in the air or over an object that sends them airborne, Dummy Ring Bomb:
        Tails throws three Dummy Rings in front of the trio, Fire Combination: Also
        known as Fighting Pose, Sonic and Tails encase each of Knuckles'' fists like
        a pair of gloves. While doing so, Knuckles can hit their enemies in several
        ways that cause devastating damage to the enemy (Power Formation)., Fire Dunk:
        While assuming the Fire Combination while in the air, as well as destroying
        obstacles in general., Fireball Jump: While in their Fire Combination, Sonic
        and Tails spin in a wide circle around Knuckles as he jumps into the air.
        When Knuckles'' feet lands back on the ground, they resume their previous
        position., Volcanic Dunk: While in Knuckles jumps into the air while releasing
        his teammates, fireballs spew from the ground and into the air. Even enemies
        such as Badniks that usually take multiple hits to be subdued will be destroyed
        instantly., Rocket Accel: Tails and Knuckles rally behind Sonic before launching
        him forward. coating Sonic in a yellow aura that harms those he comes into
        contact with (Speed Formation)., Thunder Shoot: Performed by Tails kicking
        his teammate towards an enemy, either Sonic or Knuckles will be coated in
        a protective aura. Once contact is made, the enemy will be vulnerably locked
        in place for several moments., Sonic Overdrive: Team Sonic''s Team BlastSonic
