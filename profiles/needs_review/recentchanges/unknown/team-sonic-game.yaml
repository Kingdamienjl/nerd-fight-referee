  attack_potency:
    text: 'Solar System level (Tails, the physically weakest member of Team Sonic,
      can still harm and defeat the likes of Chaos 4 and members of Team DarkSonic
      Heroes: Team Sonic) to Galaxy level (While Tails is weaker and Knuckles is stronger,
      they are both comparable to Sonic after his fight with Ultimate Emerl.Sonic
      Battle Each member can harm the likes of Gemerl and various Eggman mechas comprised
      of himSonic Advance 3), higher with 3 Power Cores (Power Cores double the physical
      abillities of their user) | Galacy level2 Universes by Sonic Colors - 59.57
      ZettaFOE by Sonic Riders - 1.14 YottaFOE by Sonic Riders: Zero Gravity, possibly
      High Universe level (Each member contributed to defeating the Babylon Guardian
      & Master Core: ABIS) to Universe level+ (Sonic defeated Erazor DjinnAbove Baseline)
      to Low Multiverse level (Sonic defeated the Egg Dragoon as of Sonic Generations,
      which was stated to be the pinnacle compared to all of Eggman''s prior machines,
      including the Super Egg Robot. Tails can shear through Super Badniks and harm
      the likes of both Zomom and Zavok, with Knuckles being capable of taking down
      a Super Badnik and its Badnik horde alone2 Universes by Sonic Colors - 6 Universes
      by Sonic Forces) | Varies (The Chaos Emeralds can vary in power depending on
      the circumstances. In the case of Team Sonic, they each draw enough power to
      remain comparable to one another), Low Multiverse level (Super Sonic has defeated
      beings such as the Phantom King, and the Chaos Emeralds were able to destroy
      both the Sol and Prime dimension when in close proximityVaries between 2 Universes
      to 6 Universes) to Complex Multiverse level (At his strongest, Super Sonic was
      able to harm and ultimately defeat the likes of the Egg Wizard and Solaris6-D)'
    source_ids:
    - vsbattles-team-sonic-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively FTL (Knuckles is the slowest member of the team, but even he is
      faster than Sonic's younger self, and can keep up with Chaos 6) to Massively
      FTL+ (All 3 members of the team can keep up with the likes of Gemerl and the
      Eggmobile), higher in reactions (Though only Sonic has shown this level of reactions),
      higher with the Spin Dash, Super Peel out, and with Power Cores | Massively
      FTL+ (Knuckles remains the slowest of the three, but even he can fight with
      Phantom Ruby clones of Metal Sonic) to higher (Sonic is the fastest of the three,
      being able to keep up with Infinite in later fights despite previously being
      no match for him), faster with the Super Peel out, Boost, and reactions (Same
      as prior) | Varies from Massively FTL+ (Far faster than whatever their Base
      forms are caapable of) to Infinite (Superior to the Double Boost between Sonic
      and the Rookie, which allowed them to cross through the entirety of Null Space
      through sheer speed. Should be superior to Shatter Sonic), up to Immeasurable
      (Super Forms can react to and outpace attacks from Solaris and the Time Eater.
      Faster than Modern base Sonic)
    source_ids:
    - vsbattles-team-sonic-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class M (Those such as Sonic have tipped over the Egg Golem's weight, with
      Knuckles being physically superior to him and Tails being slightly weaker) |
      At least Class M (Tails is stronger than before due to training with Sonic,
      but to what extent and by how much is unknown) to Multi-Stellar for Sonic and
      Knuckles (Modern Sonic is superior to his Werehog self in strength and can grapple
      with Metal Sonic, who is constantly updated to be on-par with him. Knuckles
      remains a prominent rival to Sonic) | Varies from Multi-Stellar to Immeasurable
    source_ids: &id002
    - mediawiki-4726855
    confidence: 0.95
  striking_strength:
    text: Solar System level (All three able to meaningfully harm those comparable
      to each of them, such as Team Dark and Team Rose, though Tails is overall weaker
      than Sonic and Knuckles is stronger) to Galaxy level (Comparable to Sonic after
      his fight with Ultimate Emerl, Tails being weaker and Knuckles being stronger,
      with each of them strong enough to fight and defeat Gemerl several times throughout
      their adventure, higher with Power Cores) | Galaxy level, possibly High Universe
      level to Universe level+ to Low Multiverse level (Tails can make Zomom elicit
      sounds of pain from his strikes and can stagger Zavok with a Spin Attack. Sonic
      can trade blows with and beat down Zazz. Knuckles can trade blows with Zombot
      Shadow, who tore apart E-123 Omega) | Varies, Low Multiverse level (Super Sonic
      can harm those such as the Phantom King with his strikes) to Complex Multiverse
      level (6-D. Super Sonic and his Classic self could harm the Time Eater. Super
      Sonic, Super Shadow, and Super Silver each individually shattered different
      parts of Solaris' armor plating, which allowed them to make quick work of Solaris
      afterwards before it transformed. Super Sonic and Burning Blaze can individually
      harm the Egg Wizard)
    source_ids: *id002
    confidence: 0.95
  durability:
    text: 'Solar System level (Tails is the weakest member, with Sonic and Knuckles
      being able to take far more punishment) to Galaxy level (Each member can take
      attacks from Gemerl and his Eggman-machine variations), higher with Power Cores.
