- id: claim-weaknesses-3b8b1b49
  section: weaknesses
  axis: weakness
  text: 'Team Sonic has no proper Headquarters to speak of Notable Team Attacks/Techniques:
    Formations: Depending on the number and intensity of the obstacles in their path,
    Team Sonic is quick to utilize different strategies by having a member in the
    lead of their formation. They can shift into three types, and can do so in a moment''s
    notice with nothing but a quick call to their allies. *Flight Formation: The formation
    Team Sonic assumes with Tails in the lead. Sonic grabs onto tails ankles, Knuckles
    does the same to Sonic, and the three of them form a tower-like position. This
    position is one that capitalizes range and mobility, and is the formation they
    use when an obstacle can''t be solved with speed nor strength. *Power Formation:
    The formation Team Sonic assumes with Knuckles in the lead. When moving, Sonic
    and Tails stand equal distance apart on either side of Knuckles in an "impassable
    wall" type position. This formation is one that relies on overwhelming offense
    to make up for a slight decrease in speed and mobility, and is one that they often
    use in the face of stronger enemies or overwhelming numbers. *Speed Formation:
    The formation Team Sonic assumes with Sonic in the lead. When moving, Tails and
    Knuckles rally side-by-side behind Sonic like a precise arrow tip. This formation
    is one that is primarily used for travel and quick-fire attacks, as it excels
    in speed and agility over Knuckles'' strength or Tails'' mobility. Triangle Dive.gif|The
    Triangle Dive *Ascending Flight: Tails takes to the skies and can freely maneuver
    for limited amounts of time. The more Tails moves, the less he can remain airborne
    with his allies attached to him (Fly Formation). **Quick Ascent: For a swifter
    rise into the air, Tails will perform a sudden dash upwards. *Triangle Dive: When
    in the air or over an object that sends them airborne, Team Sonic can hold onto
    one another in a triangular formation to efficiently glide in the air and slow
    their descent (Power Formation). Fire Dunk Attack.gif|Knuckles'' Fire Dunk Volcanic
    Dunk.gif|Knuckles'' Volcanic Dunk Thunder Shoot.gif|Tails'' Thunder Shoot Sonic
    Team Blast.gif|Team Sonic''s Team Blast *Dummy Ring Bomb: Tails throws three Dummy
    Rings in front of the trio, which causes an explosion when it makes contact with
    an enemy that releases an electrical paralysis field (Fly Formation). *Fire Combination:
    Also known as Fighting Pose, Sonic and Tails encase each of Knuckles'' fists like
    a pair of gloves. While doing so, Knuckles can hit their enemies in several ways
    that cause devastating damage to the enemy (Power Formation). **Fire Dunk: While
    assuming the Fire Combination while in the air, Knuckles can hurl Sonic and Tails
    into enemies with such ferocity that they turn into fireballs that create an explosion
    upon making contact with an enemy. Said explosion damages anything in close proximity.
    This can also be used to break down doors that they couldn''t otherwise, as well
    as destroying obstacles in general. **Fireball Jump: While in their Fire Combination,
    Sonic and Tails spin in a wide circle around Knuckles as he jumps into the air.
    When Knuckles'' feet lands back on the ground, they resume their previous position.
    **Volcanic Dunk: While in Knuckles jumps into the air while releasing his teammates,
    then punches the ground with such force that it creates powerful volcanic explosions.
    At its most powerful, fireballs spew from the ground and into the air. Even enemies
    such as Badniks that usually take multiple hits to be subdued will be destroyed
    instantly. *Rocket Accel: Tails and Knuckles rally behind Sonic before launching
    him forward. coating Sonic in a yellow aura that harms those he comes into contact
    with (Speed Formation). *Thunder Shoot: Performed by Tails kicking his teammate
    towards an enemy, either Sonic or Knuckles will be coated in a protective aura.
    Once contact is made, the enemy will be vulnerably locked in place for several
    moments. *Sonic Overdrive: Team Sonic''s Team BlastSonic the Hedgehog Encyclo-speed-ia
    Page 136. Sonic is kickstarted into the Light Attack and destroys all enemies
    in an "instant", increasing his speed during the attack so significantly that
    everything around him appears frozen in place. Black Bomb Wisp.gif|Black Bomb
    Blue Cube Wisp.gif|Blue Cube Crimson Eagle Wisp.gif|Crimson Eagle Cyan Laser Wisp.gif|Cyan
    Laser Green Hover Wisp.gif|Green Hover Gray Quake Wisp.gif|Gray Quake Indigo Asteroid
    Wisp.gif|Indigo Asteroid Ivory Lightning Wisp.gif|Ivory Lightning Magenta Rhythm
    Wisp.gif|Magenta Rhythm Orange Rocket Wisp.gif|Orange Rocket Pink Spikes Wisp.gif|Pink
    Spikes Purple Frenzy Wisp.gif|Purple Frenzy Red Burst Wisp.gif|Red Burst Violet
    Void Wisp.gif|Violet Void Yellow Drill Wisp.gif|Yellow Drill Final Color Blaster
    Attack.gif|Final Color Blaster *Color'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
