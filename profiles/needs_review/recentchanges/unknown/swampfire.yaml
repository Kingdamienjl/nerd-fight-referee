- id: claim-powers-and-abilities-9a6a0dc2
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Fire Manipulation (Can project powerful
    flames from his hands) *Breath Attack (As shown here) *Plant Manipulation (Can
    control nearby plants to attack or restrain enemies. In his evolved form was able
    to control plants from another planet as well) *Regeneration (Low-High) (Was cut
    into a puddle but was able to casually regenerate. Easily regenerated after his
    head blowed up) *Immortality (Type 3) *Sleep Inducement (Can project sleeping
    gas) *Acrobatics (Can perform acrobatic rolls) *Explosion Manipulation (Can project
    explosive fire attacks) *Adhesive Manipulation (Can shoot toxic slime) *Acid Manipulation
    (Can generate acidic slime) *Elasticity (Being a plant like alien he can use his
    limbs as tentacles and greatly extended them to several meters) *Body Control
    (Can control his body to squeeze into tight spaces) *Underwater Breathing and
    Propulsion *Gas Manipulation (Can project methane that knocked out Incursean soldiers)
    *Intangibility (Was able to casually walk out a prison bar) *Flight (Via Propulsion)
    *Extreme Cold, Electricity, Fire Manipulation (All abilities and resistances provided
    by the Omnitrix) *Poison Manipulation and Sleep Manipulation (His species is not
    affected by the highly toxic atmosphere of Planet Methanos, nor by the high amounts
    of methane gas and swamp gas). All previous abilities on a higher scale *Air Manipulation
    (Can create fire tornadoes) *Organic Manipulation (His body can organic napalm
    sacs growing and can be hurled like bombs at an enemy) *Enhanced Fire Manipulation
    and Energy Manipulation (His flames have become much more powerful than before,
    and he has improved his control over fire, now being able to manipulate blue fire
    energy]). *Enhanced Plant Manipulation (improved his chlorokinesis). *Transformation
    (Can transform from his Base form to his Ultimate form) *Empowerment (Ultimate
    Form increase the aliens strengths and abilites) All previous resistance on a
    higher scale *Resistance (All abilities and resistances provided by the Omnitrix)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
