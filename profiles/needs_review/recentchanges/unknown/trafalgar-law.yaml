    text: Superhuman (Despite having been grievously injured and poisoned by several
      lead bullets in an earlier fight, Law could continue fighting in near-perfect
      condition. Has powered through several impalement wounds to the torso, and despite
      having one of his arms sawed off, he could still fight to some extent. Despite
      the stamina drain of his Awakened Devil Fruit attacks [and having taken a Thunder
