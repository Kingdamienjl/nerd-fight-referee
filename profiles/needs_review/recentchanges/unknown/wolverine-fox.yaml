- id: claim-stamina-f5ab1882
  section: power_scale
  axis: stamina
  text: Superhuman (Has gone through several decades of warfare without food or rest,
    and has taken much more punishment than most other comparable mutants, such as
    being burned by a nuclear explosion and being pierced all over his body. Every
    time he has to endure the pain of his claws coming out. Even though he had no
    chance to recharge his psychic and physical batteries, forcing him to stay awake
    to the point of absolute exhaustion, which was worse than a knockdown and, as
    a consequence, his healing factor was so busy fixing the damage that he was mostly
    in a kind of hibernation, he could still decimate several soldiers and hold his
    own against Lady Deathstrike, and then while the psychic wave from Cerebro was
    harming his mind, body and soul, he also suffered the pain of all the wounds he
    ever endured at once without healing, including the operation of Adamantium being
    surgically injected into his skeleton that he had survived, which made him suffer
    more pain than any other man can endure and that even Sabretooth would never survive
    it. Could fight while engulfed in flames even though it hurt like hell, and stated
    that his body keeps going till there's nothing left but bones. Constantly endured
    having his mind ripped apart countless times due to his consciousness being sent
    back in time for days His healing factor can mitigate pain. Even when his healing
    factor was disabled, he still endured a shotgun blast at point-blank range, multiple
    gunshots and stabbings, and cutting open his own chest to extract a parasite from
    his heart. Even while old, severely weakened and diminished healing, he was still
    able to endure a shotgun blast at point-blank range and survive multiple slices
    from X-24's Adamantium claws)
