- id: claim-weaknesses-703305b4
  section: weaknesses
  axis: weakness
  text: His Adamantium skeleton and claws can be perforated and sliced by piercing
    or superheated Adamantium weapons, and due to them, his body can also be easily
    manipulated by magnetic powers. Suffered from amnesia after being shot in the
    brain with two Adamantium bullets, though he eventually regained his memories
    upon his return to Alkali Lake. Due to the amnesia, during the events of X-Men
    and X2, he was having more nightmares and flashbacks so his mental torment was
    getting stronger too, having no chance to recharge his psychic and physical batteries,
    forcing him to stay awake to the point of absolute exhaustion, which was worse
    than a knockdown and, as a consequence, his healing factor was so busy fixing
    the damage that he was mostly in a kind of hibernation. His Adamantium decayed
    and rotted over time, which constantly poisoned his body as the Adamantium leached
    into his system, causing chronic pain and diminished healing so his abilities
    weren't what they were, being also affected by alcohol that he had to use as a
    painkiller. He also suffered from arthritis, mobility impairments and breathing
    problems, having sunk into a state of depression near the end of his life that
    eventually led him to contemplate suicide.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
