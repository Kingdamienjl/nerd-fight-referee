- id: claim-weaknesses-b837720b
  section: weaknesses
  axis: weakness
  text: Although she can still fight without a Beaststone, lacking one renders her
    unable to transform. Weak to beast killing weapons, such as the Lance "Beast Killer",
    and the Rapier. In warmer environments, like on a sunny beach, warmth of Panne's
    fur may cause her to overheat, albeit she can still move and fight.Fire Emblem
    Awakening - Summer Scramble Was initially distrusting of humans due to her race's
    history of being abused and nearly extinct by them, but through interacting with
    the Shepherds, fighting alongside them, bonding closely with and potentially marrying
    one of them, and remembering her mother's dying words instructing her to not hold
    hatred for all humans, she has essentially overcome this barrier.Fire Emblem Awakening
    - Panne/Lon'qu S Support
  source_ids: *id003
  decisive: false
  status: unverified
