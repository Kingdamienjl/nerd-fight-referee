  intelligence:
    text: "Gifted (Panne's status as the last surviving Taguel only fuels her drive\
      \ to represent her people proudly, ultimately proving herself both in how she\
      \ preserves the culture of her race and as a skilled fighter. She educated Gaius\
      \ in the style of Taguel ornamentation to where she believed he had captured\
      \ it perfectly.Fire Emblem Awakening - Panne/Gaius S Support Holds the knowledge\
      \ of a secret Taguel medicine recipe that is far more potent than human cures,\
      \ and has produced this medicine to heal an injury sustained by Cordelia's pegasus.Fire\
      \ Emblem Awakening - Cordelia/Panne B Support More impressively, Panne could\
      \ concoct a potion that when consumed by Lon'qu, ceased his nightmares and provided\
      \ him with wonderful dreams, all without her knowing if said potion was effective\
      \ on those who were not Taguels.Fire Emblem Awakening - Panne/Lon'qu A Support\
      \ The Taguel race were already a species well-versed in combat, often using\
      \ mortal combat to secure the right to wed one another. Panne herself displayed\
      \ a technique with such effectiveness in lowering an opponent's front guard\
      \ that it had the likes of Robin curious about her strategies.Fire Emblem Awakening\
      \ - Panne/Kellam B Support She is a rather pragmatic fighter, granting no quarter\
      \ and more than willing to utilize lethal tactics such as tearing out the throats\
      \ of enemies, disemboweling foes, and ripping out their hearts with her teeth.Fire\
      \ Emblem Awakening - Panne/Kellam B Support Defeated Kellam in all of their\
      \ sparring matches, \"destroying\"Fire Emblem Awakening - Panne/Kellam B Support\
      \ him in the first match and leaving him in covered in injuries that caused\
      \ him to succumb to unconsciousness in a later roundFire Emblem Awakening -\
      \ Panne/Kellam A Support in spite of his impregnable armour.Fire Emblem Awakening\
      \ - Panne/Kellam C Support In one of these mock battles, her tactics and skills\
      \ were successful enough to draw the interest of other human fighters, who proceeded\
      \ to study them in hopes of utilizing them. Following this, these very same\
      \ humans shared their own skills and secrets with Panne.Fire Emblem Awakening\
      \ - Panne/Kellam A Support Furthermore, Panne believed that if she and Kellam\
      \ were to seriously fight one another, the latter would likely perish as a result.\
      \ By fighting alongside Vaike, she learned much more about fighting, improving\
      \ her proficiency in battle strategy.Fire Emblem Awakening - Panne/Vaike A Support\
      \ Has been known to sneak in extra training for the sake of significantly improving\
      \ her weapon skills. Managed to sneak up on Yarne,Fire Emblem Awakening - Panne/Yarne\
      \ C Support a Taguel and her son from the future who possesses senses that can\
      \ detect oncoming presences from a mile away.Fire Emblem Awakening - Female\
      \ Robin/Yarne B Support Has easily fought and defeated groups of Deadlords,Fire\
      \ Emblem Awakening - Infinite Regalia Risen soldiers,Fire Emblem Awakening -\
      \ Roster Rescue Wyvern Lords,Fire Emblem Awakening - Five-Anna Firefight Swordmasters,Fire\
      \ Emblem Awakening - Roster Rescue and mercenaries,Fire Emblem Awakening - Summer\
      \ Scramble the latter of which are considered to be \u201Cmasters of the killing\
      \ arts\u201DFire Emblem: The Sacred Stones)"
    source_ids: *id002
    confidence: 0.8
