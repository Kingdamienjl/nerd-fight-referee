        \ Tensei requires a much longer recovery time, disables all other bodies,\
        \ and shortens Nagato's lifespan. Chibaku Tensei requires massive chakra expenditure\
        \ and needs Nagato to be close to the Deva Path to transmit the signal. The\
        \ Human and Naraka Paths must touch their target, and the Preta Path cannot\
        \ absorb purely physical attacks | Bound to the will of Edo Tensei's caster.\
