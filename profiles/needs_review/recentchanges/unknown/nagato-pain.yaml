    - field: attack_potency
      value: "Varies (Pain's power varies depending on how many bodies are active\
        \ at a time and how far they are from Nagato) from Large Mountain Level (Even\
        \ with 6 bodies active and being far away from Nagato, Pain can easily overpower\
        \ Kakashi, Ch\u014Dza, and Choji with his Shinra Tensei. With less bodies\
        \ active, he was able to trade blows with base Naruto, although he wasn't\
        \ at full capacity yet. Passively manipulates the rain in the Rain village\
        \ choosing when it should fall (his chakra is imbeded into the droplets])\
        \ to Country level (Casually caught a punch from Sage Mode Jiraiya. SM Jiriaya\
        \ admitted that the three Pains he was facing could kill him if he fought\
        \ them simultaneously. The Animal Path could stab and wound Sage Mode Jiraiya.\
        \ He easily dissipated Sage Mode Naruto's FRS with 3 bodies active, and later\
        \ replicated the feat with one body active while exhausted.), far higher with\
        \ Chaotic Shinra Tensei (Far stronger than his regular attacks; destroyed\
        \ the entirety of Konoha), even far higher with Chibaku Tensei (Strong enough\
        \ to seal away KN7 Naruto before he went into the 8 tails form; Should be\
        \ able to easily capture and seal weaker Biju like Matabi) | Country level\
        \ (Easily overpowered KCM Naruto and Killer B, who needed Itachi to save their\
        \ lives. Naruto stated that Nagato's power and Jutsu were far greater than\
        \ Pain's because he wasn't acting through six bodies anymore), far higher\
        \ with Chaotic Shinra Tensei, likely even far higher with Chibaku Tensei (took\
        \ the combined power of Naruto, Killer B and Edo Itachi using their strongest\
        \ attacks to destroy it)"
      source_id: character-stats-profiles-nagato-pain
