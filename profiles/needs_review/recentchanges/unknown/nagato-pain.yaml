    - field: durability
      value: Varies from Large Mountain level (Scales from his striking strength and
        his peak, where he could somewhat withstand his own Shinra Tensei) to Country
        Level (The Human Path survived a kick from Sage Mode Jiraiya, albeit his eyes
        were permanently injured, and later on casually caught a punch from Jiraiya.
        The Preta Path momentarily caught Jiraiya's Chou Odama Rasengan before absorbing
        it. He withstood a kick from Sage Mode Naruto while having 3 bodies active,
        though he was sent flying, took a punch from V2 Naruto; He withstood the recoil
        of his own Shinra Tensei, and even the explosion of Six Tails Naruto's TBB.
        He later withstood a kick from SM Naruto while extremely low on chakra and
        fatigued) | Country level (Withstood the initial impact of V2 Bee Lariat before
        absorbing it)
      source_id: character-stats-profiles-nagato-pain
