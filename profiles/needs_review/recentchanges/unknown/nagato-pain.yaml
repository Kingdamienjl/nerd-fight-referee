- id: claim-weaknesses-b9d8db36
  section: weaknesses
  axis: weakness
  text: "Nagato's real body is emaciated, crippled, and unable to walk on its own,\
    \ making him vulnerable if located. Each Path of Pain can only use its own set\
    \ of abilities, and the bodies weaken the farther they are from Nagato, as his\
    \ control range is limited. Operating individually, the bodies are far less effective,\
    \ making coordination between them crucial. The Deva Path's standard Shinra Tensei\
    \ has a roughly five-second cooldown. Ch\u014D Shinra Tensei requires a much longer\
    \ recovery time, disables all other bodies, and shortens Nagato's lifespan. Chibaku\
    \ Tensei requires massive chakra expenditure and needs Nagato to be close to the\
    \ Deva Path to transmit the signal. The Human and Naraka Paths must touch their\
    \ target, and the Preta Path cannot absorb purely physical attacks | Bound to\
    \ the will of Edo Tensei's caster. {| class=\"mw-collapsible mw-collapsed\" align=\"\
    center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\"\
    \ | colspan=\"2\" style=\"text-align: left;\" |Notable Attacks/Techniques: |-\
    \ | : Said to be the most powerful of the Three Great D\u014Djutsu, the Rinnegan\
    \ is revered as the eye from which all ninjutsu originated. Its wielder can master\
    \ all five basic nature transformations that form the foundation of ninjutsu.\
    \ It also grants access to the techniques of the Six Paths, as well as the seventh\
    \ path, which governs life and death. *: The power granted by the Rinnegan to\
    \ manifest the abilities of the Six Paths. Nagato created the Six Paths of Pain\
    \ to wield these techniques through six corpses implanted with chakra receivers.\
    \ These receivers, which look like piercings, let Nagato control each body freely,\
    \ with each body wielding a single Path's abilities. Every body also has its own\
    \ Rinnegan, and their shared vision eliminates blind spots.centre|thumb|501x501px|Six\
    \ Paths Jutsu **: Grants control over attractive and repulsive forces, repelling\
    \ or pulling in objects with the user's body as the center point. These techniques\
    \ cannot be used in rapid succession, as the interval between uses scales with\
    \ the power of the previous attack. ***: The Deva Path emits a powerful repulsive\
    \ shockwave capable of large-scale destruction. The standard version has a roughly\
    \ five-second cooldown. If Nagato cuts off chakra to the other bodies and channels\
    \ everything through the Deva Path, he can unleash Ch\u014D Shinra Tensei, which\
    \ leveled all of Konoha. This version has a much longer cooldown and puts immense\
    \ strain on Nagato's body, shortening his life. ***: The counterpart to Shinra\
    \ Tensei. Instead of repelling, the Deva Path pulls a target toward itself. ***:\
    \ The Deva Path launches a dark sphere with an immense gravitational pull into\
    \ the air. It tears up the surrounding landscape, gathering rocks, earth, and\
    \ trees into a massive satellite around itself that traps and crushes anyone caught\
    \ inside. The technique is cancelled if the central sphere is destroyed. **: Allows\
    \ the user to summon various giant creatures into battle. Unlike the standard\
    \ Summoning Jutsu, it does not require the caster's blood. Each summoned creature\
    \ also has the Rinnegan, linking it to Pain's shared vision. ***: The Animal Path\
    \ can summon a variety of giant creatures, including a chameleon that can turn\
    \ invisible, a dog that multiplies when attacked, a giant bird, a rhinoceros,\
    \ an ox, a crustacean, a centipede, and a highly durable panda. It can also summon\
    \ the other Paths of Pain to its location at any time. Nagato himself can summon\
    \ the Gedo Statue. **: Allows the user to read a target's mind by placing a hand\
    \ on their head. Doing so rips the target's soul from their body, killing them.\
    \ ***: Once the Human Path places its hand on a victim's head, it reads their\
    \ memories and tears out their soul. This makes it ideal for gathering information,\
    \ though the target is always killed in the process. **: Grants the ability to\
    \ absorb chakra in any form, including ninjutsu, rendering chakra-based attacks\
    \ useless against it. ***: An advanced sealing technique that absorbs chakra of\
    \ all types, including nature transformations, and drains chakra from a target\
    \ on contact. Edo Nagato used absorbed chakra to restore his emaciated body to\
    \ its prime condition. **: Grants the user a mechanized, cyborg-like body armed\
    \ with advanced weaponry, and lets them reshape it further, such as by sprouting\
    \ extra limbs. ***: The Asura Path opens its head to reveal a cannon that fires\
    \ a destructive chakra beam. Edo Nagato can turn one of his arms into a similar\
    \ cannon. ***Asura Path Missiles: The Asura Path stores missiles throughout its\
    \ body, including a dozen in its right arm. Once fired, they home in on their\
    \ target and detonate in building-level explosions. ***Arm Cannon: The Asura Path\
    \ can detach its forearm and fire it with tremendous force and speed, enough to\
    \ level a large building. The arm stays connected by a cable and can be retracted\
