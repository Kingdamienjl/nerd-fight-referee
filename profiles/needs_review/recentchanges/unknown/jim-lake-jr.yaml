    - field: weaknesses
      value: Normal human weaknesses.- His humanity, which makes him reluctant to
        kill a person (although this disappears in Part 2). He often puts himself
        at risk to protect those he loves, Sunlight.- Which turns trolls into stone
        when they are completely engulfed. (Can be partially overridden with this).,
        Manipulation.- He seems to be much more susceptible to being manipulated by
        magical methods, this also manipulates his behavior, for example, when he
        is manipulated by The Green Knight, he is too impulsive and aggressive, without
        having a conscience too noticeable, at the time of being controlled by Claire,
        he is able to have more of his consciousness, he seems to be able to think
        without problems. In most of his time as a Full-Troll, he was manipulated
        by The Green Knight, making him too impulsive. & Sunlight.- Which turns trolls
        into stone when they are completely engulfed., Doubts.- During the film, he
        had many doubts about himself as a leader, which is resolved at the end of
        the film.
      source_id: character-stats-profiles-jim-lake-jr
