    field_candidates:
    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Skilled Hand-To-Hand combatant &
        Weapon Mastery (Defeated Bular, a deadly opponent that won a fight against
        Kanjigar, one of the best troll hunters that ever existed. Even with items
        such as a simple knife, fork or a a frying pan, he hold his own against Strickler
        and Nomura individually with some efforts. Was able to exploit Draal's blindspot.
        After being more advanced in his training, he fought both Strickler and Nomura
        at the same time. Battled against Angor Rot and Gunmar simultaneously, both
        villains that he killed or will be killed by Jim.), Summoning (Can summon
        his weapons, as well as teleport them to him when out of reach), Acrobatics
        (His agility was seen impressive by Vendel. Shown some amazing feats for a
        teenager, Toby even takes note that he makes evading death traps in the Hero's
        Forge "look so easy" compared to everyone else's.), Vehicular Mastery (with
        a scooter), Stealth Mastery, Limited Camouflage (Bring several trolls out
        of Troll Market while avoiding the Gumm-Gumms. With his eclipse armor, his
        steathly is greatly enhanced to the point that he can blend himself in the
        darkness and avoid the Gumm-Gumms for over 2 weeks), Energy Projection, Light
        Manipulation (His sword is constructed from daylight, a major weakness to
        trolls and can shot it in the form of blasts from the blade or his amulet.),
        Fire Manipulation (Has shown to produce fire in complete darkness.) Regeneration
        (Low; Completely healed from scratches made by goblins over night which would
        take the average person over 3 to 7 days.), Accelerated Development (Is a
        quick learner as he eventually defeated Bular, a deadly opponent that won
        a fight against Kanjigar, one of the best troll hunters that ever existed
        and would take a troll over decades of training to be on his level. Was struggling
        with Strickler and Nomura individually, while he would eventually defeat both
        of them at the same time. Gained more endurence and stamina, as at first he
        was barely able to run with his armor on for more than dozens of seconds while
        after he could fight against hordes of gumm-gumms and a Nyalagroth for hours
        while being malnourished and has little to no sleep for the span of 2 weeks),
        Statistics Amplification (Can gains new abilities, resistances and equipment
        via specials gems like the time he gained superhuman strength, the ability
        to walk vertically on walls, to duplicate himself into several sides of his
        personality, can walk in daytime without any injuries (which he already had)
        or his new shield, glaives, helmet and the eclipse armor made to be powerful
        enough to kill Gunmar. By drinking Merlin's elixir, he became half-troll,
        half human, making him stronger, more durable and faster in combat.), Rage
        Power (Can become more powerful when letting his rage get the better of him),
        Limited Power Nullification (By putting the eye of Angor Rot as a gem into
        his amulet, Jim was unaffected by Angor Rot's magic and wasn't able to control
        daylight anymore), Attack Reflection (Deflected some magic blast from Angor
        Rot), Weapon Control (Could control his glaives and fly them around and back
        to him), Automatic translation, Information Analysis (The amulet can scan
        any text and translate it to the language of it's wielder. It shown to be
        capable of analyzing it's surroundings.), Same powers as before but enhanced
        plus, Immortality (As half-troll, he would likely live to hundreds of years),
        Enhanced Senses (Trolls have an acute sense of smell and sight.), Aura and
        greater Rage Power (Has control his rage and with it, he marked Gunmar yellow
