  intelligence:
    text: Gifted (Jim has shown to be a fast learner, and even before his training
      with Draal, he can wield Daylight with little difficulty. Cunning and quick-witted,
      as seen during his second battle with Draal where he was able to exploit Draal's
      blindspot. After training with Draal, he can hold off against the likes of Nomura,
      Stricklander, Bular and even Angor Rot, an assassin who fought and killed numerous
      Trollhunters for the past few centuries. Very resourceful, as he has survived
      and adapted at living in the harsh and physically demanding terrain of the Darklands
      for two weeks straight, while also avoiding detection from Gunmar's army. Good
      at improvising)
    source_ids:
    - vsbattles-jim-lake-jr-unknown
    confidence: 0.6
    notes: auto_repair source extraction
