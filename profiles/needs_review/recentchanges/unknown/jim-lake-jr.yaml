    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Genius Intelligence, Accelerated
        Development (Training - Over just weeks of training with Blinky and Draal,
        Jim has augmented his physicality alongside his skills in combat to the point
        where he could fight very skilled opponents such as Bular, [https://imgur.com/a/ja1sKE3
        who prior defeated Kanjigaar who is described to be one of the best trollhunters
        to have ever lived and would need decades of training to be on his level,]
        something that Jim achieved under such a small period of time. Even very early
        in the days as Trollhunter, he was able to hold his own against Nomura or
        Draal and defeated both by outsmarting them, and could also take down a Stalking
        after remembering a lesson Blinky taught him in combat.), Regeneration (Low;
        Completely healed from scratches made by goblins over night [https://myhealth.alberta.ca/Health/Pages/conditions.aspx?hwid=sig49202&lang=en-ca#:~:text=Most%20scrapes%20heal%20well%20with,weeks%20or%20longer%20to%20heal.
        which would take the average person over 3 to 7 days].), Possibly Non-Physical
        Interaction (The likes of Steve Palchuk can strike harm Shadow Mephits, which
        are described as phasing in and out of reality.), Acrobatics ([https://imgur.com/a/xDKIG3k
        He also is able to do flips] and [https://imgur.com/a/AYcHNas other acrobatic
        stunts]. Can climb houses, obstacles and walls that are hundreds of meters
        high. He is often praised for his agility, either by the likes [https://imgur.com/a/jubcRyK
        of Vendel] or Toby who claimed that Jim made the Hero's forge obstacles look
        easy.), Expert Martial Artist and Expert Hand to Hand Combatant (Somewhat
        skilled in close quarters combat, as he can deliver successful kicks, upper
        cuts, and execute [https://imgur.com/a/oXkGD8t wrestling moves]. [https://imgur.com/a/AYcHNas
        Managed to restrain Strickler], an experienced changeling. It should be mentioned
        that his training with both Blinky and Draal incorporated hand-to-hand.),
        Weapon Mastery (Fought against Bular and defeated him, [https://imgur.com/a/ja1sKE3
        who is claimed by Blinky to be a formidable opponent and is on par with Kanjigaar,
        who was stated to be one of the best trollhunters to have ever existed]. Held
        his own against Angor Rot, an expert assassin who have killed multiple trollhunters
        in the past. Even with equipment like a small knife, fork or frying pan, he
        is able to keep up with Strickler and Nomura.), Stealth Mastery (Hid behind
        Draal for a brief period of time. Briefly stay hidden from Bular. Sneak trolls
        out of the troll market without being caught by Gumm-Gumms. Managed to say
        hidden for over 2 weeks inside the Darklands without detection.), Vehicular
        Mastery (Shown to be skilled using a scooter, even in narrow spaces such as
        the sewers), Rage Power ([https://imgur.com/a/oXkGD8t Easily overpowered Strickler
        by letting his hatred govern his actions.]), Social Influencing and Morality
        Manipulation, Charisma - Blinky believed that Jim's greatest strength is his
        humanity and his ability so see greatness in others. [https://imgur.com/MNUZjFS
        This is shown when Jim convinced Angor Rot to turn against Morgana by reminding
        him who he was prior to becoming her champion]., Preparation (Alongside Draal
        and Strickler, they all three planned to kill Angor Rot by first bringing
        him in Jim's house and setting up various traps to incapicate him.), Fear
        Immunity with [https://talesofarcadia.fandom.com/wiki/Grit-Shakas Grit-Shaka]
        ([https://talesofarcadia.fandom.com/wiki/Grit-Shakas#:~:text=Grit%2DShakas%C2%A0are%20magic%20totems%20used%20by%20the%20Gumm%2DGumms%2C%20which%20they%20use%20to%20banish%20all%20fear%2C%20making%20them%20fierce%20and%20more%20nimble.
        Removes any anxiety or fear], albeit it is meant for trolls and made Jim very
        arrogant, reckless and without control.), Time Manipulation with [https://talesofarcadia.fandom.com/wiki/Kairosects
        Kairosect] ([https://talesofarcadia.fandom.com/wiki/Kairosects#:~:text=The%20maximum%20of%20the%20time%2Dstopping%20effect%20lasts%20for%20precisely%20forty%2Dthree%20minutes%20and%20nine%20seconds.
        Can stop time for 43 minutes and 21 seconds] with the wielder not affected,
        although its [https://talesofarcadia.fandom.com/wiki/Kairosects#:~:text=It%20can%20only%20be%20used%20three%20times.%20After%20which%2C%20it%20will%20be%20rendered%20completely%20useless.
        usage is only limited to three tries].), Paralysis Inducement with [https://talesofarcadia.fandom.com/wiki/Stasis_Trap
        Stasis Stones] (A piece of magical stones discovered by Angor Rot, which he
        used to immobilize his prey.), Transformation Nullification with [https://talesofarcadia.fandom.com/wiki/Gaggletacks
        Gaggletack] ([https://talesofarcadia.fandom.com/wiki/Gaggletacks#:~:text=Gaggletacks%20are%20magical%2C%20horseshoe%2Dshaped%20totems%20that%20can%20reveal%20a%20Changeling%27s%20true%20nature%20through%20physical%20contact.
        Can expose Changelings from their humans forms].), Limited Soul Manipulation
        with Infern
