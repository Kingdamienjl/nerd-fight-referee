    - field: attack_potency
      value: Wall level physically (Knocked out Steve Palchuck with a punch, who dented
        a locker door with his punches and shouldn't be much weaker than Coach Lawrence,
        who threw a mobile phone hard enough to fly out of view), likely Small Building
        level+ with weaponry (The Sword of Daylight was able to stab through a large
