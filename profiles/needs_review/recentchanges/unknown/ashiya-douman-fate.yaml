    confidence: 0.8
  attack_potency:
    text: Large Island level+ (Has C rank strength making him comparable to Servants
      such as Atlanta), Small Country level with Maelstrom - Evil Spirit Left Minister
      (As a B rank Noble Phantasm, it should be comparable to Noble Phantasms such
      as Great Grudge of Rashoumon), ignores conventional durability with Noble Phantasm
      | Small Country level (Stronger than both Berserker of Samghata Hell, and Musashi
      with the latter being unable to escape unscathed from a direct hit from him,
      making him comparable to the Dioscuri2.8882 Teratons) | Complex Multiverse level6-D,
      possibly higher (Fused with the Naraka Mandala which absorbed Ibuki-douji and
      had magical energy greater than hers. The Settsu Armor Kumano was able to hold
      Aphrodite down and damage her, Limbo claimed it wouldn't be able to do anything
      to him before wielding the Kusanagi-no-Tachi. Stated that even the highest divinities
      would be dancing in his palm)8-D
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Relativistic+ with FTL Combat speed and Reactions (Has E-Rank Agility, making
      him slower than Mash who could block attacks from the Dioscuri) | Relativistic+
      with FTL Reactions and Combat speed (Much faster than before, comparable to
      Musashi) | Immeasurable with FTL (Comparable to Olympian Gods due to absorbing
      Ibuki-douji's magical energy)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class M (Comparable to Martha who stopped a speeding train, Achilles who
      stopped a rolling 300 ton jumbo jet, and Asterios who swam carrying the 100-150
      ton Golden Hind galleon ship while injured, and Jeanne who can spin an entire
      airplane2,604.949 Metric Tons) | Same as before | Immeasurable (Superior to
      Tiamat, whose existence was a 4-dimensional pocket with infinite volume)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Large Island level+ | At least Large Island level+ (Broke through Kadoc's
      forcefield who could defeat Servants) | Complex Multiverse level, possibly higher
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Large Island level+, higher with Forcefields | Small Country level+ (Has
      a multi-layered bounded field around his body which blocked an attack from Musashi
      that should've taken his head right off) | Complex Multiverse level, possibly
      higher
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Servants can fight for an entire day without tiring and continue
      fighting for as long as they have sufficient mana) | Infinite
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, Kilometers with curses (Cursed an entire city) | Standard
      Melee Range, Planetary with curses (Turned the Moon Red) | Complex Multiversal
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Genius (Ashiya Douman is extremely scheming and always takes actions that
      put him in an advantageous situation. As shown when he fixed Danzou and sent
      her Chaldea's way to lure them into a trap near the final chapters of Shimousa,
      manipulated an emotionless god to hasten the destruction of his Lostbelt without
      him knowing, can easily deduce that Hera was a traitor to Olympus, and was able
      to turn a Singularity into a Lostbelt. As a combatant, Limbo is proficient in
      hand-to-hand combat and onmyouji arts in which he commonly attempts to overwhelm
      his opponents with sheer numbers of monsters and spirits. Even when he is about
      to killed, Ashiya Douman never stops scheming when he tried to stall time to
      deploy his secret art that would annihilate everyone at the cost of his own
      life.)
    source_ids: *id002
    confidence: 0.8
