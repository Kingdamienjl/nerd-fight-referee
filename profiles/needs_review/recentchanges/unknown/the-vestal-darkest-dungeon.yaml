- id: claim-weaknesses-fda29d7c
  section: weaknesses
  axis: weakness
  text: Dependent upon quirks and trinkets gathered throughout the game, but can vary
    anywhere from being inflicted with the black plague, being incredibly abusive
    or fearful, or simply becoming stressed more easily. Cannot use many of her moves
    if she's too close to the enemy. Most of her moves don't inflict much immediate
    damage, instead focusing on supporting allies.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-85bf08ad
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Weapon Mastery (Although the Vestal mostly
    fights with her magic, she is also skilled with a mace and can daze her opponents
    with it), Social Influencing (Can inspire allies and reduce their stress through
    Encourage or Pep Talk), Regeneration (Mid-Low, capable of healing from nigh-lethal
    damage on the way back to the Hamlet), Light Manipulation (Attacks through holy
    light with many of her abilities. This light is bright enough to light up the
    dark environments that she often ends up exploring throughout the course of the
    game), Healing (Can heal allies or herself with Divine Grace, Divine Comfort,
    Judgement, Wound Care and Sanctuary), Statistics Amplification (Can increase her
    own accuracy, damage and chance of inflicting a lethal blow through Hand of Light),
    Blessed (The Vestal is blessed by The Light and can bless others to increase their
    accuracy and evasion), Empathic Manipulation (Can remove the Horror Status from
    allies with Divine Grace), Status Effect Inducement (Can stun enemies with Dazzling
    Light), Holy Manipulation (Uses The Light's power through her attacks and inflicts
    bonus damage against Unholy beings), Resistance to Stun, Debuff, and Bleed Inducement,
    Disease Manipulation, Acid Manipulation, Empathic Manipulation, Fear Manipulation,
    Madness Manipulation, (Types 2 and 3), Mind Manipulation, Statistics Reduction,
    Curse Manipulation, and Poison Manipulation (Able to resist various status effects)
    Stealth Mastery (Various trinkets make it easier for the Vestal to dodge attacks
    if the environment is relatively bright or very dark), Statistics Amplification
    and Statistics Reduction (The Haste Chalice improves the Vestal's speed greatly
    at the beginning of the battle, although it lowers it afterwards and weakens her
    Stun skills. The Youth Chalice improves her health at the cost of damage. Atonement
    Beads improve her melee strength and accuracy at the cost of reduced virtue chance,
    Heretical Passage increases her damage against Eldritch and Husk enemies, and
    many more trinkets increase and lower her statistics), Improved Status Effect
    Inducement, Improved Healing (Various trinkets greatly improve the Vestal's healing
    abilities though often at a cost, such as the Profane Scroll, which only improves
    them if she's in the second row of her team, the Tome of Holy Healing, which lowers
    her HP, or the Sacred Scroll, which weakens her Stun skills and damage), Improved
    Resistance to Disease Manipulation, Stun, Debuff, and Bleed Inducement, Acid Manipulation,
    Empathic Manipulation, Fear Manipulation, Madness Manipulation, (Types 2 and 3),
    Mind Manipulation, Statistics Reduction, Curse Manipulation, and Poison Manipulation
    (Through various trinkets, although many of the Vestal's trinkets have a tendency
    to increase her Stress instead)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
