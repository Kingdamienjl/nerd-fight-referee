      be it people, animals or even other creatures, like the shadow blob she tamed
      into becoming her Stand. However, Korone's lack of restraints and tendency to
      not listen to others sometimes causes her to be nonsensical or do illogical
      things. She's also prone to turn to violence if she can't solve a problem through
      normal means)
    source_ids: *id002
