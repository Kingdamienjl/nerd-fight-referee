- id: claim-powers-and-abilities-13660911
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics (Even while being sealed by the combination
    of Kumagawa's Book Maker and All Fiction, Ajimu kept great strength), Fourth Wall
    breaking, Multilocation (700 million people on Earth are none other than Ajimu
    herself), Social Influencing (Has 100 thousand people working with the Flask Plan,Chapter
    103, page 5 and enough terminals that she makes up one tenth of the world population.
    Every person in the world has someone that can influence their life at the beck
    and call of Ajimu.Good Loser Kumagawa Novel, Chapter 3 (Yakeishi Kushi's character
    note) Can influence society without even trying, an unfair advantage that Ajimu
    knows and makes the most of when she wants to. Once used this to orchestrate events
    in a way that rendered Medaka's own charisma voidChapter 140, page 11), Self-Sustenance
    (Type 1 & 2; Being born before the Universe and living that way for trillions
    of years, Ajimu would not need food, water, or air), Immortality (Type 1; via
    Dead Lock), Martial Arts (With Four Figure Leg Lock), Sense Manipulation (With
    Mirror Juvenile), Limited Nigh-Omnipresence (With Alibi Block), Power Bestowal
    and Power Absorption (With Lip Service), Power Nullification (With Life Zero),
    BFR, Time Travel and Dimensional Travel (with Door To Door), Air Manipulation
    (Ajimu says that she has a skill to control oxygen molecules), Law Manipulation
    (Ajimu set up a rule for the Hero's Sword, making it so that only a hero can pull
    it out), Sleep Manipulation (Instantly made Zenkichi unconscious with an unknown
    skill), Weapon Creation (with Sword Looks), Possibly Memory Manipulation, Statistics
    Reduction, Durability Negation, Sealing (With Bookmaker), Non-Physical Interaction
    (Has beaten disembodied consciousnesses with her bare-hands,Chapter 88, pages
    1 - 4 blew up a star that only existed in a dream when already deadChapter 168,
    page 11), Possibly Disease Manipulation (With Five Focus), Possibly Perception
    Manipulation (With Parasite Seeing), Possibly Causality Manipulation (with Hundred
    Gauntlets), Resistance to Perception Manipulation (with Standing Ovation), Sealing
    (Partially resisted the effects of Bookmaker, escaped from Momo Momozono's sealing
    in a week), Power Erasure (Skills capable of erasing powers, such as All Fiction
    and Wrong Conversion, don't work on Minuses) and Causality Manipulation (Partially
    resisted the effects of All Fiction, although the skill was still an important
    part in sealing Ajimu), Reality Warping (granted Saki Sukinasaki the wish of becoming
    a famous idolGood Loser Kumagawa Novel, chapter 4). All previous abilities massively
    enhanced; also all abilities previously rated "possibly" (except for those granted
    by Bookmaker) are a certainty, in addition to, Accelerated Development (Ajimu
    in her quest to find an impossible task gained an extremely large number of powers),
    Creation (Ajimu has created 700 million humans across the world that can act as
    her proxys), Limited Nigh-Omniscience and Precognition (Ajimu is stated to be
    Omniscient and to possess all knowledge of past and future events, but she decides
    to restrain her knowledge at the human level to be "fair" to the story), Surface
    Scaling (With Give Up-Down), Limited Information Manipulation (with Count up),
    Self-Power Nullification (With Unskilled), Shapeshifting (She has several abilities
    that let her drastically change the shape of her body, such as turning into a
    giant dinosaur), Magic (of the skills that Ajimu holds, many are magical,Chapter
    143, page 4 and Magical Life is a Magic governing skillMagical Life's skill notes),
    Mind Manipulation (Holds many mental skills that target the mind,Chapter 143,
    page 5 and also has the power to bring the disembodied consciousness of a nearly
    dead or dead person to herChapter 154, pages 8 - 9), Bone Manipulation (Can remove
    bones with Boneless Farm), Marksmanship (An entire branch of her quadrillion skills
    consist of supernatural mastery of aiming and guns, used them to easily defeat
    a character that claimed to be a specialist in gun fightsChapter 160, pages 3
    - 4), Resistance to Memory Manipulation (her memories were unaffected by Kumagawa's
    erasure of Shiranui HansodeChapter 159, pages 8 and 15)
