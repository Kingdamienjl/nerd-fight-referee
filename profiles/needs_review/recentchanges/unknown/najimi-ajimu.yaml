- id: claim-weaknesses-fb35dcab
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques Superhuman Physiology: Even being\
    \ sealed by the combination of Kumagawa's Book Maker and All Fiction, Ajimu seems\
    \ to have great strength. She has crushed the ground by just stepping on it. Ajimu\
    \ has also carried a soccer goal all the way to the top of the clock tower using\
    \ only one hand. Ajimu is shown to be incredibly fast, to have dodged both the\
    \ attacks of Zenkichi and Emukae simultaneously without effort while doing a sideways\
    \ peace sign. *Four Figure Leg Lock (\u56DB\u306E\u5B57\u56FA\u3081, Yon no Jigatame):\
    \ A judo skill which restrains the opponent's movements, Ajimu used it in response\
    \ to Tsurubami's Provocations {| class=\"wikitable mw-collapsible mw-collapsed\"\
    \ !Abnormalities and Minuses: |- | Multiple Skill User: Ajimu does not have one\
    \ specific Abnormality or Minus. Instead she has an insurmountable amount of distinct\
    \ Abnormalities and Minuses (7,932,135,441,523,222 Abnormalities and 4,925,916,526,110,643\
    \ Minuses, for 12,858,051,967,633,865 skills in total). After giving Hundred Gauntlets\
    \ to Kumagawa and later Parasite Seeing to Zenkichi, her total drops to 12,858,051,967,633,863\
    \ skills. She later takes back Hundred Gauntlets from Kumagawa and returns his\
    \ original Minus to him, raising the total amount to 12,858,051,967,633,864 skills.\
    \ After she is \"killed\" by Iihiko, she meets Kumagawa in the dream classroom\
    \ to give him Hundred Gauntlets and Unskilled. This decreases her total to 12,858,051,967,633,862\
    \ skills. At present, Ajimu has demonstrated or explained 814 different skills.\
    \ *Parasite Seeing (\u6B32\u8996\u529B, Parasaito Sh\u012Bingu): This ability\
    \ allow her to see what other people see through their own eyes, this can also\
    \ allow her to see how others view the world and understand what they think. *\
    \ Hundred Gauntlets (\u624B\u306E\u3072\u3089\u5B75\u3057, Handoreddo Gantoretto):\
    \ Hundred Gauntlet was originally a skill that reversed causality before she gave\
    \ it to Kumagawa. *Lip Service (\u53E3\u5199\u3057, Rippu S\u0101bisu): By kissing\
    \ someone, Ajimu is able to switch the opponent's ability with another she possesses.\
    \ She uses this ability to return Kumagawa's original Minus to him, taking back\
    \ Hundred Gauntlets in the process. * Alibi Block (\u8151\u7F6A\u8A3C\u660E, Aribai\
    \ Burokku): A skill that allows Ajimu to appear wherever she wants, whenever she\
    \ wants. Including physical places such as a locked room, space, heaven, and hell,\
    \ as well as metaphysical places like dreams and hearts. However she has also\
    \ demonstrated appearing in multiple places at once, appearing in both Kumagawa's\
    \ and Zenkichi's hearts. *Dead Lock (\u6B7B\u5EF6\u8DB3, Deddo Rokku): One of\
    \ Ajimu's abilities that grants her eternal life, she has lived for over 3 trillion\
    \ years) *Life Zero (\u7121\u52B9\u811B, Raifu Zero): With Life Zero, Ajimu can\
    \ nullify any skill she desires, she was supposed to be able to nullify Medaka's\
    \ The End. *Standing Ovation (\u624B\u306E\u821E\u8DB3\u306E\u8E0F\u3080\u3068\
    \u3053\u308D\u3092\u77E5\u3089\u305A, Sutandeingu Ob\u0113shon): A skill that\
    \ negates the effect of Parasite Seeing. * Mirror Juvenile (\u8EAB\u6C17\u697C\
    , Mir\u0101 Jubunairu): The ability tampers with a person's sense of perception,\
    \ allowing her to appear to them however she wishes. *Five Focus (\u4E94\u672C\
    \u306E\u75C5\u722A, Faibu F\u014Dkas): Five Focus is a skill that manipulates\
    \ aliments, it inflicts diseases on to anyone that is scratched by the user's\
    \ claws, Ajimu never displayed this skill herself, having bestowed it upon Aoki\
    \ Aka, along with the mission to prevent anyone at Hakoniwa Academy from dying.\
    \ *Door To Door (\u53E3\u533A\u9593, Doa To Doa): An ability which allows Ajimu\
    \ to \"travel through time\" by bringing herself and others into the dream world\
    \ where they appear at different stages in their lives. While Ajimu seems to be\
    \ able to enter the dream world freely on her own, to send other people there,\
    \ she must first kiss them. *Give Up-Down (\u9006\u8EE2\u638C\u8A34, Gibu Appu\
    \ Daun): An ability which allows Ajimu to cling to high ceilings, even upside\
    \ down, she used this ability against Emukae and Zenkichi during their training.\
    \ *Count Up (\u6307\u6298\u308A\u78BA\u8A8D, Kaunto Appu): The ability to count\
    \ large numbers, Ajimu uses it to count all the skills she uses. *Bookmaker (\u5374\
    \u672C\u4F5C\u308A, Bukku Meika) After she gave Hundred Gauntlets to Misogi, she\
    \ stole bookmaker. As this ability was one of Ajimu's skills for a time, she would\
    \ have been able to use it. *Unskilled (\u5B9F\u529B\u52DD\u8CA0, Ansukirudo):\
    \ It's a skill that nullifies and blocks all the user's skills for a maximum of\
    \ three minutes. Ajimu leaves this skill to Kumagawa after her death to make his\
    \ new minus, April Fiction. * Lady Guitarist (\u5F3E\u722A\u306E\u9E97\u4EBA,\
    \ Redi Gitarisuto): This skill allow her to reload guns without touching the gun\
    \ or the bullets *Sword Look (\u898B\u56EE\u5200, S\u014Ddo Rukkusu): A skill\
    \ used to create weaponry. Used to create the Hero's Sword *Unnamed Skill: A skill\
    \ that Ajimu used to made Zenkichi unconscious Others: If you want to read all\
    \ of her abilities click here. |} ==Gallery== Sword Skills.png|Sword Skills Martial\
    \ Arts Skill.png|Martial Arts Skills File:Magic Skills.png|Magic Skills File:Mental\
    \ Skills.png|Mental Skills Biological Skills.png|Biological Skills Boss Skills.png|Boss\
    \ Skills Ajimu Multiplier FC.png|Multiplier File:Gun Skills.png|Gun Skills Ninja\
    \ S"
  source_ids: *id003
  decisive: false
