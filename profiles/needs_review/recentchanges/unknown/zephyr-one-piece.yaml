        \ of moving through the air by creating special clouds called \"Flame Clouds\"\
        \ and using them as footholds. These clouds can also be used to lift other\
        \ objects, they are even capable of lifting an entire island out of the sea),\
        \ Enhanced Senses (Zoan users gain the senses of their respective animals),\
        \ Breath Attack, Fire Manipulation (Can release devastating blasts of fire\
        \ from his mouth), Electricity Manipulation (Can release bolts of lightning\
        \ by roaring), Air Manipulation (Can produces invisible, sharp wind blades\
        \ by blowing on top of stirring up strong, fast-rotating tornados), Limited\
        \ Danmaku with Tatsumaki and Kaifu (Those caught in his Tatsumaki are cut\
        \ by dozens of ranged slashes composed in a constant swirling tornado, his\
        \ Tatsumaki Kaifu releases several sharp wind blades in all directions), Limited\
        \ Technique Mimicry (In his Thieving Drunk mode, Kaidou can mimic his opponent's\
        \ fighting style to an extent but has so far only been shown to replicate\
        \ Luffy's ability to change his attack's trajectory at will), Regeneration\
        \ (Mid-Low), Empowerment (When drunk from alcohol he enters a state called\
        \ Shuron Hakke which strengthens his Haki and causes him to change into various\
        \ modes based on his drunken mood swings), Resistance to Radiation Manipulation\
        \ (Could take a Gamma Knife inside his body), Animal Manipulation (Zoans are\
        \ immune to Tama's Kibi Dangos), Madness Manipulation, Mind Manipulation and\
        \ Soul Manipulation via Willpower (Through sheer willpower they can resist\
        \ losing their mind when absorbing shadows through the Kage Kage no Mi. Shadows\
        \ belonging to strong willed people are difficult to control, allowing them\
        \ to rebel against Moria's pact which usually immediately submits a shadow\
        \ to his supremacy and orders. Spiritual energy is contained within one's\
        \ soul/life; this energy is represented by the fighting power or the Haki\
        \ itself. Those with strong souls, which are homologous to shadows, resist\
        \ the effects of Brook's soul manipulation)"
