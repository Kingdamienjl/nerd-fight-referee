  section: abilities
  axis: hax
  text: "* Superhuman Physical Characteristics (Tsunade, like all Shinobi, is capable\
    \ of using Chakra to enhance her strength to superhuman levelsItachi Shinden:\
    \ Book of Bright Light; Chapter 1, Page 28) * Genius Intelligence * Social Influencing\
    \ (Reputation- is considered the strongest woman and was the only kunoichi to\
    \ participate in the Third Great War - Tsunade's skills extend beyond the typical\
    \ medical ninja. She earned fame during the Second Shinobi World War for being\
    \ the only person able to make antidotes for the poisons of Sungakure's Chiyo\
    \ - Is one of the \u201Cthree great ninja of Konoha.\u201D - The abilities of\
    \ these individuals are considered to be in a different category than those of\
    \ ordinary shinobi, so much so that akatuski withdrew ) * Longevity (As a descendant\
    \ of both the SenjuNaruto Chapter 576 and UzumakiNaruto Chapter 545 clans, Tsunade\
    \ has been blessed with an extremely powerful vitality and improved longevity.\
    \ This effect can be observed through the fact that she's still alive well into\
    \ her late sixties and early seventies, despite having abused her Mitotic Regeneration,\
    \ which has the side effect of greatly accelerating her aging and shortening her\
    \ lifespanNaruto Chapter 169) * Chakra Manipulation ** Statistics Amplification\
    \ (Shinobi are capable of enhancing their physical capabilities with the use of\
    \ chakra. The Shunshin no Jutsu allows Shinobi to greatly enhance their speed\
    \ by focusing chakra in their feet.Rin no Sho, Page 197Naruto Chapter 24Naruto\
    \ Chapter 71 Using her signature chakra enhanced \"monster\" strength, Tsunade\
    \ focuses her maximum chakra into her limbs at the exact moment of impact in order\
    \ to release far greater power than is possible for most Shinobi.Naruto Chapter\
    \ 246 She can also release the Strength of a Hundred Seal on her forehead to gain\
    \ access to all of her accumulated chakra and greatly increase her strength even\
    \ furtherJin no Sho, page 279) ** Surface Scaling and Water Walking (By focusing\
    \ chakra at the soles of their feet, Shinobi can scale and cling to vertical surfaces,\
    \ and even walk on waterNaruto Chapter 18Naruto Chapter 90) ** Afterimage Creation,\
    \ Stealth Mastery, and Speed Enhancement (The Substitution Jutsu allows its user\
    \ to instantly replace themselves with a nearby object such as a tree log, plant,\
    \ person, or clone at the exact moment they are attacked. The Jutsu works even\
    \ if the user is physically restrained or observed by characters as observant\
    \ as Sharingan or Sage Mode users. This creates the optical illusion of the user\
    \ being hit, which confuses the opponent and gives them an opening to flee or\
    \ counterattackNaruto Chapter 6Naruto Chapter 54Naruto Chapter 374Naruto Chapter\
    \ 580Naruto Chapter 674) ** Minor Illusion Creation and Duplication (With the\
    \ Clone Technique,Rin no Sho, Page 220 Shinobi can create illusionary duplicates\
    \ of themselves that have no physical substance. He can also create Shadow Clones,Naruto\
    \ Chapter 373 which are identical clones that can aid him in combat, use his techniques,\
    \ telepathically relay information back to him when they're destroyed, and act\
    \ as distractions, among other things) ** Shapeshifting (With the Transformation\
    \ Technique,Rin no Sho, Page 220 Shinobi can transform themselves into other people,\
    \ animals, plants, and even inanimate objects, such as weapons. Tsunade is also\
    \ capable of using chakra in order to permanently alter her physical appearance\
    \ and age in order to keep herself looking young or to avoid her gambling debtsNaruto\
    \ Chapter 149) ** Paralysis Inducement (With the Temporary Paralysis Technique,Rin\
    \ no Sho, Page 176 Shinobi can completely paralyze their targets from close to\
    \ mid range) ** Genjutsu Nullification (Shinobi can typically break free from\
    \ and nullify non-ocular genjutsu by intentionally disrupting the flow of chakraSha\
    \ no Sho, Page 301 within their bodies) * Martial Arts (All Shinobi are trained\
    \ to be highly proficient in Taijutsu.Naruto Chapter 5 Even in the Ninja Academy,\
    \ they are trained in Hand-to-Hand combat and perform drills regularly to perfect\
    \ their Taijutsu.Naruto Chapter 538 She is an elite Shinobi with decades of combat\
    \ experience under her belt. She casually disarmed and outclassed Naruto in hand-to-hand\
    \ combat.Naruto Chapter 158 She's able to contend with masterful combatants such\
    \ as Kabuto, Orochimaru, and Madara Uchiha for extended periods of time, and routinely\
    \ outclassed them in Taijutsu.Naruto Chapter 164Naruto Chapter 169Naruto Chapter\
    \ 170Naruto Chapter 577 She trained Sakura to be skilled enough in Taijutsu to\
    \ read attack patterns, and predict incoming attacks, even if the attacks are\
    \ extremely numerous or are coming from practically all directionsNaruto Chapter\
    \ 270) * Pressure Points Strikes (Shinobi are taught a technique that allows them\
    \ to painlessly knock people out with a simple neck chop in the Academy.Kakashi\
    \ Retsuden: The Sixth Hokage and the Failure Boy; Chapter 3 As a doctor, Tsunade\
    \ has an intimate knowledge of the human body, as well as all of its weak spots,\
    \ and is perf"
