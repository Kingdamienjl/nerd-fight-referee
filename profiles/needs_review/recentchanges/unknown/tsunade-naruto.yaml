- id: claim-weaknesses-bed57f7a
  section: weaknesses
  axis: weakness
  text: "Using her Mitotic Regeneration technique consumes a lot of chakra, greatly\
    \ accelerates her aging, and shortening her lifespan.Naruto Chapter 169 When she\
    \ runs out of chakra, her transformation technique comes undone and she temporarily\
    \ loses her youthful appearance.Naruto Chapter 171 Initially suffered from crippling\
    \ Hemophobia due to her immense and constant guilt for not being able to save\
    \ her lover and younger brother,Naruto Chapter 157 but during her fight with Orochimaru,\
    \ she was able overcome this.Naruto Chapter 169 She has unhealthy habits, such\
    \ as severe gambling addiction and alcohol abuse. She's also very impatient and\
    \ has a very short temper, and is extremely prone to fits of anger.Naruto Chapter\
    \ 156 Katsuyu's Remote Healing is linked to Tsunade's chakra reserves, which renders\
    \ Katsuyu's healing abilities useless if Tsunade is out of chakra.Naruto Chapter\
    \ 635 Notable Attacks/Techniques: *Ranshinshou (Body Pathway Derangement): Tsunade\
    \ hits a particular point on the opponent's body and releases her chakra inside,\
    \ disrupting and rearranging the nerve signals in the brain. The technique confuses\
    \ the movements of the limbs, effectively paralysing them. For example, if someone\
    \ is trying to move his right arm, a different body part would perform the same\
    \ movement. *Sozo Saisei (Creation Rebirth): By using a large amount of chakra,\
    \ Tsunade can enter a regenerative state that allows her to heal from fatal wounds\
    \ quickly and even regenerate lost limbs and organs. However, the use of this\
    \ technique shortens her lifespan. *Byakugo no Jutsu (Strength of a Hundred Technique):\
    \ An advanced form of Tsunade's Creation Rebirth technique. She is covered in\
    \ various tattoos and markings, giving her a general power increase and constant\
    \ regenerative abilities. *Summon Katsuyu: Tsunade summons her giant slug, Katsuyu.\
    \ It can spit acid or heal others by dividing it into many small slugs and transfer\
    \ its chakra directly to them. *Chakra Transfer Technique: Tsunade can transfer\
    \ her chakra to others, which powers up their abilities. It can bring Onoki's\
    \ strengths up from Small City to Large Mountain level of power. *Enkaku Chiyu\
    \ (Remote Healing): Through the use of Katsuyu's clones, she can heal and shield\
    \ an entire city's worth of people, unlocking her In Fuin (Yin Seal) can even\
    \ protect the villagers from an attack that was capable of leveling a town. ==Gallery==\
    \ Tsunade_render(2).png Tsunade.full.3758904.png Tsunade wielding Gamabunta's\
    \ giant blade.jpg|Tsunade wielding Gamabunta's giant blade TsunadeWar.jpeg TsunadeHokage.jpg\
    \ TsunadeByakugou.jpeg ==Notable Matchups== Victories: Ditto (Pok\xE9mon) Ditto's\
    \ Profile (Byakug\u014D Seal Tsunade was used and Ditto was given time to transform)\
    \ Mei Terumi (Naruto) Mei's Profile (Byakug\u014D Seal Tsunade was used and speed\
    \ was equalized) Black Maria (One Piece) Black Maria's Profile (Black Maria was\
    \ in her Zoan form and the Byakug\u014D Seal was restricted. Speed was equalized.)\
    \ Losses: Inconclusive: Katsuki Bakugo (My Hero Academia) Bakugo's Profile (The\
    \ Five Kage in their 6-B keys and Final War Arc Dynamight were used) ==References==\
    \ ==Notes/Explanations== Category:Characters Category:Naruto Category:Anime Characters\
    \ Category:Humans Category:Healers Category:Geniuses Category:Chi Users Category:Heroes\
    \ Category:Good Characters Category:Female Characters Category:Manga Characters\
    \ Category:Kages Category:Leaders Category:Doctors Category:Summoners Category:Ninjas\
    \ Category:Martial Artists Category:Regeneration Users Category:Illusionists Category:Adults\
    \ Category:Poison Users Category:Earth Users Category:Water Users Category:Electricity\
    \ Users Category:Fire Users Category:Biology Users Category:Durability Negation\
    \ Users Category:Stealth Masters Category:Duplication Users Category:Shapeshifters\
    \ Category:Tragic Characters Category:Alcoholics Category:Acrobats Category:Surface\
    \ Scalers Category:Paralysis Users Category:Free Movement Users Category:Afterimage\
    \ Users Category:Statistics Amplification Users Category:Telekinesis Users Category:Plant\
    \ Users Category:Energy UsersCategory:Extrasensory Perception UsersCategory:Knife\
    \ Users Category:Weapon Users"
