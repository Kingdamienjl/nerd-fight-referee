- id: claim-intelligence-788101a2
  section: power_scale
  axis: battle_iq
  text: "Gifted normally. Extraordinary Genius as a Doctor. A medical genius known\
    \ the world over as the strongest Kunoichi,Naruto Chapter 172 and the world's\
    \ foremost medical expert.Naruto Chapter 155 She graduated from the Ninja Academy\
    \ at the tender age of 6,Sha no Sho, Page 165 with the average graduation age\
    \ being 12 years old.Itachi Shinden: Book of Bright Light; Chapter 1, Page 57\
    \ Tsunade was able to complete the Ch\u016Bnin Exam's written test, which included\
    \ questions involving Trigonometry, Kinematics, among other topics far too advanced\
    \ for her age group.Naruto Chapter 41Naruto Chapter 44 The examinees were expected\
    \ to either solve the questions using their own knowledge, or use a combination\
    \ of their analytical abilities, powers of observation, special abilities, and\
    \ intelligence gathering skills in order to cheat the correct answers, which was\
    \ the trueNaruto Chapter 41 purposeNaruto Chapter 44 of the exam. She was acknowledged\
    \ for her abilities and skill by the likes of Hanz\u014D, which is how she became\
    \ one of the Sannin alongside Oorchimaru and Jiraiya.Naruto Chapter 369 She has\
    \ been credited as one of the principle reasons that led to Konoha's victory during\
    \ the Second and Third Shinobi World WarNaruto Chapter 158 thanks to her contributions\
    \ both on the battlefield and in developing the \"One Medic Specialist per 4-Man\
    \ Cell\" system, which greatly increased the survival rates of Shinobi cells.Naruto\
    \ Chapter 154 She also founded the laws and principles that govern how all Medical\
    \ Ninja operate.Naruto Chapter 577 She was considered one of the best candidates\
    \ for the title of Hokage,Naruto Chapter 158 and was actually picked for the position.\
    \ As a Hokage, she was noted to be a very effective leader.Sha no Sho, Page 165\
    \ She also found out that Danz\u014D Shimura was conducting shady dealings behind\
    \ the scenes, and extremely wary of him and his organization, Root.Naruto Chapter\
    \ 367 She has performed many seemingly impossible feats in the medical field such\
    \ as healing the psychological damage inflicted upon Sasuke and Kakashi by Tsukuyomi\
    \ with a mere touch,Naruto Chapter 172 fully healing Rock Lee's spinal injuryNaruto\
    \ Chapter 210 which was deemed a hopeless case,Naruto Chapter 173 counteracted\
    \ the effects of the Three Coloured Pills, which were eating away at his cells,\
    \ using instructions from the Nara Clan's Sacred Medical Guide,Naruto Chapter\
    \ 235 analyzed and neutralized the poisons of renowned experts such as Chiyo of\
    \ the Sand,Naruto Chapter 253 and much more. She was also noted to be the only\
    \ one capable of healing Orochimaru's arms,Naruto Chapter 153Naruto Chapter 155Naruto\
    \ Chapter 156 which had their soul sealed away and lost their ability to function,\
    \ even though Orochimaru had the aid of a competent Medical Ninja such as Kabuto.Naruto\
    \ Chapter 153 She is adept enough to perform complex autopsies, even on a cellular\
    \ level, and determine the exact causes of death in addition to perfectly analyzing\
    \ the properties of any attacks used on the victim.Naruto Chapter 346 She was\
    \ able to synthesize artificial limbs from the cells of her grandfather, Hashirama\
    \ Senju,Naruto Chapter 699 which is something that took the likes of Orochimaru\
    \ years to perfect. However, her crowning medical achievement is perhaps her development\
    \ of the Creation Rebirth Jutsu, which goes a step beyond healing and actually\
    \ regenerates all of her wounds by drawing on her chakra reserves to perform cellular\
    \ division and heal almost any injury.Naruto Chapter 169 She has the uncanny ability\
    \ of being able to accurately diagnose someone's physical condition with a mere\
    \ glance from several meters away.Naruto Chapter 155 She can also easily spot\
    \ and identify specific ailments that are affecting her patients without the use\
    \ of equipment.Sha no Sho, Page 256Naruto Chapter 253 In addition to her medical\
    \ expertise, she is also an elite Shinobi with decades of experience fighting\
    \ against and commanding the respect of legends such as Hanzo, Orochimaru, Jiraiya,\
    \ and even the likes of Madara Uchiha.Naruto Chapter 577 She's a Taijutus expert\
    \ who holds considerable skill in armed and unarmed combat. She was also able\
    \ to teach and train Sakura to master her evasion techniques, which allowed her\
    \ to gradually read someone's attack patterns and start dodging accordingly, even\
    \ from blindspots.Naruto Chapter 270 Finally, she was awarded a 5 on her Databook\
    \ entry's intelligence category, which makes her comparable to other geniuses\
    \ such as Orochimaru, Kakashi, and Itachi."
