    - field: weaknesses
      value: "Using her Mitotic Regeneration technique consumes a lot of chakra, greatly\
        \ accelerates her aging, and shortening her lifespan.Naruto Chapter 169 When\
        \ she runs out of chakra, her transformation technique comes undone and she\
        \ temporarily loses her youthful appearance.Naruto Chapter 171 Initially suffered\
        \ from crippling Hemophobia due to her immense and constant guilt for not\
        \ being able to save her lover and younger brother,Naruto Chapter 157 but\
        \ during her fight with Orochimaru, she was able overcome this.Naruto Chapter\
        \ 169 She has unhealthy habits, such as severe gambling addiction and alcohol\
        \ abuse. She's also very impatient and has a very short temper, and is extremely\
        \ prone to fits of anger.Naruto Chapter 156 Katsuyu's Remote Healing is linked\
        \ to Tsunade's chakra reserves, which renders Katsuyu's healing abilities\
        \ useless if Tsunade is out of chakra.Naruto Chapter 635 Notable Attacks/Techniques:\
        \ *Ranshinshou (Body Pathway Derangement): Tsunade hits a particular point\
        \ on the opponent's body and releases her chakra inside, disrupting and rearranging\
        \ the nerve signals in the brain. The technique confuses the movements of\
        \ the limbs, effectively paralysing them. For example, if someone is trying\
        \ to move his right arm, a different body part would perform the same movement.\
        \ *Sozo Saisei (Creation Rebirth): By using a large amount of chakra, Tsunade\
        \ can enter a regenerative state that allows her to heal from fatal wounds\
        \ quickly and even regenerate lost limbs and organs. However, the use of this\
        \ technique shortens her lifespan. *Byakugo no Jutsu (Strength of a Hundred\
        \ Technique): An advanced form of Tsunade's Creation Rebirth technique. She\
        \ is covered in various tattoos and markings, giving her a general power increase\
        \ and constant regenerative abilities. *Summon Katsuyu: Tsunade summons her\
        \ giant slug, Katsuyu. It can spit acid or heal others by dividing it into\
        \ many small slugs and transfer its chakra directly to them. *Chakra Transfer\
