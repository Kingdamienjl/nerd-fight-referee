    - field: weaknesses
      value: 'Using her regeneration technique consumes a lot of chakras and shortens
        her lifespan, most of her superhuman strength is based on chakra and thus
        can run out. Initially suffered from hemophobia due to her immense and constant
        guilt for not being able to save her lover Dan Kato, but after her fight with
        Orochimaru, she seems to have overcome this. She has unhealthy habits, such
        as severe gambling addiction and alcohol abuse. Notable Attacks/Techniques:
        *Ranshinshou (Body Pathway Derangement): Tsunade hits a particular point on
        the opponent''s body and releases her chakra inside, disrupting and rearranging
        the nerve signals in the brain. The technique confuses the movements of the
        limbs, effectively paralyzing them. For example, if someone is trying to move
        his right arm, a different body part would perform the same movement. *Sozo
        Saisei (Creation Rebirth): By using a large amount of chakra, Tsunade can
        enter a regenerative state that allows her to heal from fatal wounds quickly
        and even regenerate lost limbs and organs. However, the use of this technique
        shortens her lifespan. *Byakugo no Jutsu (Strength of a Hundred Technique):
        An advanced form of Tsunade''s Creation Rebirth technique. She is covered
        in various tattoos and markings, giving her a general power increase and constant
        regenerative abilities. *Summon Katsuyu: Tsunade summons her giant slug, Katsuyu.
        It can spit acid or heal others by dividing it into many small slugs and transfer
        its chakra directly to them. *Chakra Transfer Technique: Tsunade can transfer
        her chakra to others, which powers up their abilities. It can bring Onoki''s
        strengths up from Small City to Large Mountain level of power. *Enkaku Chiyu
        (Remote Healing): Through the use of Katsuyu''s clones, she can heal and shield
        an entire city''s worth of people, unlocking her In Fuin (Yin Seal) can even
        protect the villagers from an attack that was capable of leveling a town.'
