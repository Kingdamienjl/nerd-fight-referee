  stamina:
    text: "Superhuman (As a descendant of both the SenjuNaruto Chapter 576 and UzumakiNaruto\
      \ Chapter 545 clans, Tsunade has an incredibly large reserve of very powerful\
      \ chakra, as well as an extremely strong strong life-force and vitality.Naruto\
      \ Chapter 579 This genetic make-up allows her to fight for long periods of time,\
      \ while easily shrugging off and surviving grievous injuries. Even when she\
      \ was still rusty, heavily exhausted, and injured after a lengthy battle with\
      \ Kabuto Yakushi,Naruto Chapter 164Naruto Chapter 165 she was still able to\
      \ withstand a barrage of sword slashes from Orochimaru.Naruto Chapter 169 She\
      \ was constantly slashed, and even fully impaled through the chest,Naruto Chapter\
      \ 168 but even then, she was still capable of regaining her composure after\
      \ overcoming her Hemophobia.Naruto Chapter 169 She then promptly started beating\
      \ Orochimaru, used her Mitotic Regeneration technique to heal her injuries,\
      \ which is a very taxing technique, and proceeded to summon Katsuyu, another\
      \ chakra-taking endeavor.Naruto Chapter 169 She then went on to beat both Manda\
      \ and Orochimaru,Naruto Chapter 170 before showing signs of exhaustion.Naruto\
      \ Chapter 171 She could fight for hours on endNaruto Chapter 561Naruto Chapter\
      \ 562Naruto Chapter 591 against the likes of Madara Uchiha even after sustaining\
      \ fatal injuries, such as full impalement,Naruto Chapter 578 even by multiple\
      \ giant blades,Naruto Chapter 588 stab wounds, and getting burnt.Naruto Chapter\
      \ 591 She could even survive complete bisection for prolonged periods of time.Naruto\
      \ Chapter 601 It should also be noted that during the battle against Madara,\
      \ she was constantly healing the Gokage and replineshing their chakra reserves,\
      \ which also took an additional toll on her.Naruto Chapter 563Naruto Chapter\
      \ 588 She has spent years storing chakra in her 100 Healing mark,Naruto Chapter\
      \ 169 which she can then unleash to increase her reserves greatly.Jin no Sho,\
      \ page 279 Her chakra reserves are so great that she can protect, heal, and\
      \ replenish the chakra reserves of thousands of people simultaneously, which\
      \ she has showcased during Pain's assaultNaruto Chapter 430 and the Fourth Shinobi\
      \ World War.Naruto Chapter 650 She even showed her considerable reserves when\
      \ she instantly healed and replenished Shikamaru, even though a Ky\u016Bbi-cloak\
      \ enhanced 100H Sakura, as well as Naruto's own Ky\u016Bbi chakra, failed to\
      \ heal himNaruto Chapter 649)"
    source_ids:
