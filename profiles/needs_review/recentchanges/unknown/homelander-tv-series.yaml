  section: weaknesses
  axis: weakness
  text: '*His X-ray vision cannot see through zinc. *Radiation can greatly weaken
    him and his powers,The Boys; Season 5; Episode 4; "King of Hell"The Boys; Season
    5; Episode 7; "The Frenchman, the Female and the Man Called Mother''s Milk" with
    concentrated blasts of radioactive energy burning the V in his system, leaving
    him powerless. *Was purposely raised so that he would develop an extreme need
    for love and approval. This let to an obsessive need for everyone to love him,
    and can quickly become more aggressive and mentally unstable every time he feels
    like his image and reputation might be in danger. **He is also desperate to form
    familiar and meaningful bonds and even developed oedipus complex. *Has a god-complex,
    believing himself superior to all humans and Supes alike, and becomes increasingly
    erratic and unstable whenever his supposed "superiority" is questioned. After
    hallucinating the deceased Madelyn Stillwell as an angelic figure telling him
    that he should ascend to become the one true God of the world, he only grew more
    mentally unstable. *Without his powers to boost his confidence, Homelander is
    shown to be a timid and cowardly individual. Feats: *Invulnerability: As an invulnerable
    supe, specialized high caliber bullets wouldn''t even bother him, and meta-material
    darts would fail to pierce even soft tissueThe Boys; Season 4; Episode 8; "Season
    Four Finale". Additionally, saws would not only fail to cut his skin, but they''ll
