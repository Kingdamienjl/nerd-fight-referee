    - field: range
      value: 'Standard Melee Range, Hundreds of Meters with projectiles Teamwork:
        Team Chaotix is excelled by the strong bond between the three. While their
        team is often light-hearted and goofy in its nature, they make up for it with
        their powerful will to never give up on a case. All three work seamlessly
        together, formidable enough to fight and match the likes of Team Dark and
        Team Rose. Despite Charmy being so young, they are heroic detectives and heroes
        in their own right. The team of them reliably work together in order to overcome
        any obstacle they may face through the strength of not only their members,
        but of their bonds as well.'
      source_id: mediawiki-4889661
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Varies from Below Average (Charmy is very immature, although he is somewhat
        skilled in combat) to At least Average, Gifted in combat (Vector is an expert
        detective with a knack for solving riddles and mysteries, such as quickly
        piecing together the Deadly Six's motives with his fellow Chaotix members
        and investigating Dodon Pa's motives in Team Sonic Racing at the behest of
        Tails. He is capable of piecing together vague clues and other minor hints
        to reach conclusions that his teammates and most others would have overlooked,
        allowing to see through ruses and cons [even from exceptionally devious individuals].
        Vector excels in leadership, such as quickly uniting several of his allies
        into a competent fighting force to face off against Eggman and his Omega Mech.
        By commanding them into groups and roles based on playing to their strengths,
        they were even able to cause noticeable damage despite fighting a losing battle
        before Sonic showed up. A competent fighter, Vector is also capable of taking
        out hordes of Badniks and fighting opponents as skilled as Sonic, and Shadow);
        Espio is shown having a keen and analytical mind and experience in investigation,
        solving mysteries, and gathering intel. Typically the smartest member of the
        Chaotix. He is fluent in 17 different languages and can quickly memorize books
        in a short amount of time. Having undergone extensive ninja training, Espio
        is a master of ninjutsu and a skilled martial artist. He possesses combat
        prowess comparable to the likes of Sonic and Knuckles, being referred to as
        one of the two best-trained fighters by Sonic and noted as "particularly skilled"
        by Blaze, enough to overcome the brute strength of a Chaos Emerald-powered
        Zazz whilst alone)
      source_id: mediawiki-4889661
      provider_id: vsbattles
      authority: high
      confidence: 0.75
