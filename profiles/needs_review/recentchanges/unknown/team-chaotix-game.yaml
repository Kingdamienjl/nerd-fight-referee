  attack_potency:
    text: 'Brown Dwarf level (The team fought and destroyed Metal Sonic Kai who was
      charged with a large Dark Ring>>160.62 Ronnatons by Knuckles'' Chaotix) | Solar
      System level (Fought Adventure Team Dark to a standstill, and the team helped
      out weakening Metal Madness>>30.11 Foe by Sonic Heroes, >>>240.92 Foe by Shadow
      the Hedgehog), higher with 3 Power Cores (each Power Cores doubles the user''s
      physical characteristics) | Galaxy level, possibly High Universe level by Sonic
      Rivals 2 (Helped Silver take down the IfritSonic Rivals 2: Chaotic Inferno Zone
      Boss1.14 YottaFoe by Sonic Rivals 2). Universe level+ by Sonic Free Riders (Vector
      is capable of harming other racers in the Sonic Free Riders World Grand Prix).
      Low Multiverse level by Sonic Generations (Espio can withstand multiple hits
      from Modern Sonic. Vector could have a prolonged match volleying back his notes
      after Sonic hit them with a homing attack. The team was part of the Resistance
      and helped fight a horde of Modern Chaos 0, Modern Metal Sonic, Zavok and Modern
      Shadow clones in Sonic Forces2 Universes by Sonic Generations, 6 Universes by
      Sonic Forces)'
    source_ids:
    - vsbattles-team-chaotix-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
