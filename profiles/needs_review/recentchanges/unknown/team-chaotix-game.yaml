- id: claim-weaknesses-5a09301c
  section: weaknesses
  axis: weakness
  text: "Team Chaotix can be overconfident, Vector and Charmy can get riled up easily\
    \ Notable Team Attacks/Techniques: Speed Formation: Espio= * Rocket Accel: When\
    \ performing Rocket Accel, Espio rolls into a ball, while the remaining Charmy\
    \ and Vector get up behind Espio. Once gathered, Charmy and Vector push Espio\
    \ forward with extreme force, propelling him forward at high speed as a yellow\
    \ field forms around them, allowing the team to damage enemies caught in Espio\u2019\
    s path. * Leaf Swirl: When performing this technique, Espio jumps into the air,\
    \ where he makes a hand sign in front of his face, creating a vortex covered in\
    \ transparent leaves that turns him completley invisible to his enemies. * Shuriken:\
    \ Espio pulls out a three foot large, four pointed shuriken and tosses it like\
    \ a frisbee to pierce through enemies. * Triangle Jump: Espio launches a Homing\
    \ Attack at the wall to grab onto it. Espio can then jump directly horizontally\
    \ from one wall to another. Depending on the user's inherent abilities, the user\
    \ can either continuously hang onto the wall or even run along it. * Homing"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-da6c0501
  section: abilities
  axis: hax
  text: 'Air Manipulation (With the Leaf Swirl), Paralysis Inducement (With Thunder
    Shoot), Statistics Amplification (Through various moves, such as the Chaotix Recital),
    Fire Manipulation (With Fireball), Homing Attack (With Homing Attack), Surface
    Scaling (With Triangle Jump), Sound Manipulation (With Chaotix Recital) | All
    previous abilities, all the abilities gifted by Wisps (As seen in Sonic Lost World,
    upwards of 99 Wisps can be kept in their inventory through capsules) *Base of
    Operations: The Chaotic Detective Agency office'
