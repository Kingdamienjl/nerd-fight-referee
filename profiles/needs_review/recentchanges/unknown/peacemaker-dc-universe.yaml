  intelligence:
    text: 'Above Average (While he comes off as a brutish soldier, Peacemaker is not
      entirely unintelligent when it comes to strategy, he knows how to effectively
      use his resources; he brought his x-ray vision helmet on a mission after learning
      that Butterflies infest a person''s brain so he could identify them. He correctly
      deduced that his father was tracking him by his helmets, so he attached his
      helmet to a raccoon to mislead him and his group.Peacemaker S1E7: Stop Dragon
      My Heart Around After being tipped off by Harcourt, Smith anticipated that their
      meet up at Kupperberg Park was being monitored by undercover A.R.G.U.S. agents
      and prevented them from getting a clear shot by getting close to civilians so
      that Judomaster couldn''t shoot him, he also used an A.R.G.U.S. agent as a human
      shield in order to prevent other agents from opening fire on him when they had
      him surrounded. He managed to improvise how to stop a group of armed terrorists,
      using the environment and in less than 4 minutes)'
