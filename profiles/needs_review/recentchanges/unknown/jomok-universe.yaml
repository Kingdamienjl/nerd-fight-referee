    - field: weaknesses
      value: "None notable. Feats: Armok, is just about the only constant in these\
        \ chaotic random universes. A general sense of conflict keeps Armok appeased\
        \ - when the universe becomes too boring it is set on the anvil of creation\
        \ to be reforged. The destruction of the world by Armok will arise inevitably\
        \ in most game worlds. As civilizations spread and the frontier closes, the\
        \ world will start to look homogeneous. Armok, looking upon this decadence\
        \ in disgust, will reform the world. Basically, when the universe has become\
        \ too boring, it will be changed. But who or what is Armok? ARMOK is the God\
        \ of Blood... The Supreme God, he gives name to the game, his powers are literally\
        \ endless... He creates and destroys whole Universes just for pleasure and\
        \ fun. He enjoys watching death, of course, blood run on his Universe... In\
        \ a Universe, he can have billions of worshippers, while in another his existence\
        \ might be unknown...but HE EXISTS. This cannot be denied, and allows to play\
        \ almost any type universe... from a standard fantasy-type world to a \u201C\
        primitive\u201D, why not a \u201Cfuture world\u201D with star travel? In fact,\
        \ when Armok creates a Universe, he likes putting more than one planet in\
        \ it! Remember... Armok can control and destroy all other creatures, \u201D\
        lesser\u201D gods, but he usually enjoys watching civilizations grew, because\
        \ he hopes that one day these civilizations will fight each other"
      source_id: vsbattles-jomok-universe-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
