- id: claim-powers-and-abilities-b250d60e
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Abstract Existence (Type 1; Law, Fate,\
    \ Concept Type 1; Gods are order itself and nothing more, they are the absolute\
    \ existence for all who live in the world, they are the laws and concepts of the\
    \ world and both life and death are governed by the orderLight Novel Volume 4;\
    \ Act 2, Chapter 86), Immortality & Regeneration (Types 1, 2, 3, 4, 5 & 8 up-to\
    \ High-Godly; Gods are eternal and immortal beings,Light Novel Volume 1 Chapter\
    \ 26Light Novel Volume 3 Chapter 41Light Novel Volume 4 Chapter 6 can survive\
    \ having their hearts destroyed and being decapitated.Light Novel Volume 4 PrologueLight\
    \ Novel Volume 4 Chapter 50 Can easily resurrect and regenerate their bodies after\
    \ being destroyed. Gods are nothing, they're immortal and thus not living, existing\
    \ solely as the logic of the world.Light Novel Volume 4 Chapter 68 Gods are capable\
    \ of regenerating from source (concept) destruction.Light Novel Volume 4 Chapter\
    \ 7 Beings made of Order can reform themselves even after being struck by source-destroying\
    \ attacks), Acausality (Type 1: The gods that preside over time possess the order\
    \ of keeping the past as the past.Light Novel Volume 4 Chapter 44 Any changes\
    \ that create a paradox with the present will not remain.Light Novel Volume 4\
    \ Chapter 43 The Gods were not affected by severing fate and altering historyLight\
    \ Novel Volume 3 Chapter 37), Aura (A Gods existence makes the very environment\
    \ around them trembleLight Novel Volume 4 Chapter 68Light Novel Volume 5 Chapter\
    \ 18), Limited Invulnerability (For their source; The source (concept) of a god\
    \ is indestructible even against weapons made specially to permanently kill them\
    \ likeLight Novel Volume 4 Chapter 69 Shin's ), Law Manipulation & Conceptual\
    \ Manipulation (Type 1; Gods are beings who embody, maintain and control order\u2013\
    the laws of nature, magic which govern the world and make it what it isLight Novel\
    \ Volume 4 Chapter 6), Fate Manipulation (Fate is determined by the Gods and thus\
    \ inalterableLight Novel Volume 1 Chapter 27), Resistance Negation (A god's powers\
    \ can only be resisted by another godLight Novel Volume 5 Chapter 18), Adaptation\
    \ (Gods' miracles are not so sweet that they can be resisted twiceLight Novel\
    \ Volume 5 Chapter 18), Holy Manipulation (Gods are holy and divine existencesLight\
    \ Novel Volume 3 Chapter 40Light Novel Volume 3 Chapter 42), Body Puppetry, Paralysis\
    \ Inducement, Power Nullification & Mind Manipulation (The words of a God possess\
    \ a compelling force capable of controlling othersLight Novel Volume 4 Chapter\
    \ 50), Memory Manipulation (A god's power is able to erase memoriesLight Novel\
    \ Volume 4 Chapter 16), Physics Manipulation (The World is structured by Order.\
    \ That is the law of nature, the law of magic-the order that makes the world this\
    \ world. Altering Order, alters the laws of Physics like Gravity.Light Novel Volume\
    \ 3 Chapter 32 WOG stated that the Order of the gods are the laws of physicsAuthor\
    \ Comments P. 722) Extrasensory Perception (Can create a net of magic in an area\
    \ to identify lifeforms as well as locate others in an areaLight Novel Volume\
    \ 3 Chapter 17), Power Mimicry (The user is able to copy any spell just by observing\
    \ it and it is also possible to copy the spell from the same copy of another spell),\
    \ Limited Reactive Evolution (The Source releases the most power the closer an\
    \ individual is to death and by utilizing this power, their abilities are stronger\
    \ than before.Light Novel Volume 3, Chapter 3 Misha Necron gained new abilities\
    \ such as her Eyes of Creation on the verge of death when faced against Linka\
    \ TheornessLight Novel Volume 4 Chapter 13Light Novel Volume 3 Chapter 14Light\
    \ Novel Volume 4 Chapter 17), Magic (At the core of every spell there is an existing\
    \ theoretical and practical formula that allows it to function. A magical blueprint\
    \ that determines the function of the magic. In addition, altering the spell formula\
    \ changes the properties of the magic itselfLight Novel Volume 1 Chapter 10Light\
    \ Novel Volume 2 Chapter 8Light Novel Volume 1 Chapter 13), Aura, Fear Manipulation,\
    \ Sleep Manipulation & Death Manipulation (Certain levels of magic power are capable\
    \ of causing fear in andLight Novel Volume 1 Chapter 17 incapacitating those without\
