- id: claim-weaknesses-140443a1
  section: weaknesses
  axis: weakness
  text: 'Cannot see futures where either she or her divine eyes doesn''t exist. Notable
    Attacks/Techniques: *Restricted/Sublime World: Naphta''s very own divine domain
    created by Kandaquizorte, able to be summoned in either its sublime form (which
    is adjoined to the world/area over a wide range) or the true restricted form (which
    puts both her and the opponent inside the full crystal world), is the realm that
    sentences the opponent''s very own future to the worst possible result to benefit
    Naphta. Things such as restricting the future to where one could not catch an
    attack or is too slow to avoid, or even rendering healing magic as ineffective
    are such examples. Inside of it, an entire world of crystal that she can morph
    or manipulate to her liking exists, whether it be to make spears, fire, water,
