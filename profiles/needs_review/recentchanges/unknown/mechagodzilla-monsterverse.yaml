    confidence: 0.8
  speed:
    text: At least Subsonic+ travel speed, High Hypersonic+ attack speed, combat speed
      and reactions (Matched Godzilla's Atomic Breath speed), higher with Rocket Boosters
      (Mechagodzilla has a set of six rocket boosters that fire out of openable ports
      by its dorsal fins. These boosters make Mechagodzilla more agile in close-quarters
      combat, being able to easily outmaneuver the exhausted Godzilla)
    source_ids: *id002
    confidence: 0.8
