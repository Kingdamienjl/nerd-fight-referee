- id: claim-weaknesses-d97663c6
  section: weaknesses
  axis: weakness
  text: 'Damage or interference to Mechagodzilla''s control panel will resulted in
    causing its satellite link to be disrupted and it seizing up during combat. Notable
    Attacks and Techniques: right|400px right|400px right|480px right|480px Claws
    Slash|right|350px *A-74 Proton Scream: Mechagodzilla has a series of lenses that
    assembles inside of his throat, allowing it to focus and fire a concentrated red
    beam of pure energy from its maw called the A-74 Proton Scream or simply Proton
    Scream. When deployed at 40% power, it was sufficient to cut a large Skullcrawler
    in half in gruesome fashion. After Mechagodzilla became powered by Hollow Earth
    energy, the proton scream could reach higher energy yields. This made the proton
    scream potent enough to cleave through multiple buildings in a matter of seconds
    and prevail in an beam lock against Godzilla''s atomic breath, blasting the Titan
    backward and leaving a searing wound on his chest. *Missile launchers: Mechagodzilla
    has two sixteen-cell missile launchers which rise from behind its shoulder pads.
    They did little to slow Godzilla''s charge, despite each missile releasing a plethora
    of micro missiles before impact, though they did cause him to roar out in pain.
    When Kong and Godzilla held its arms, Mechagodzilla deployed a four-cell missile
    launcher hidden in its left shoulder against Godzilla, causing him to release
    his grip. Jared Krichevsky also designed Mechagodzilla to have three concealed
    four-cell missile launchers in its chest; though unused in the film, they are
    visible on its S.H. MonsterArts figure and are seen in the Rise of Mechagodzilla
    special feature. *Jet boosters: Mechagodzilla has a set of six rocket boosters
    that fire out of openable ports by its dorsal fins. These boosters make Mechagodzilla
    more agile in close-quarters combat, helping it gain the upper hand against Godzilla.
    Designer Jared Krichevsky confirmed that there are also jets inside of Mechagodzilla''s
    tail. *Tail Drill: Mechagodzilla''s tail is a versatile weapon, which it uses
    to knock Kong off of its back. It is tipped with multiple spikes that can be rotated
    at high speed to act like a drill. *Rotor Vlaws: Unlike previous incarnations,
    Mechagodzilla is equipped with crane-like Rotor Claws rather than claws that resemble
    Godzilla''s fingers. The interiors of these claws are adorned with industrial
    buzzsaws, allowing them to cut through flesh while grappling. Much like Kiryu,
    this Mechagodzilla can rotate its hands like drills and can use the Hollow Earth
    energy to deliver extra damage in the form of plasma punches. These punches have
    a maximum output temperature of 3,400 degrees Celsius, or 6,152 degrees Fahrenheit.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
