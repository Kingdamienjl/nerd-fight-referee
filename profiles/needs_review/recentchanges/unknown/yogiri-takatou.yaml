    \ {| class=\"wikitable mw-collapsible mw-collapsed\" |- !Yogiri Respect Thread\
    \ |- | *Yogiri explains his power and how he can automatically kill people *Yogiri\
    \ can kill specific body parts of a person's body * Yogiri can kill everyone in\
    \ a certain direction from himself *Yogiri can use his power in a way that makes\
    \ the target die after a few seconds if he wants to. He also explains that his\
    \ power is irreversible *Yogiri can use his power however he wants as long as\
    \ it leads to the death of the one it was used upon, and he also mentions that\
    \ his power is irreversible once activated. *Yogiri's ability does not negate\
    \ the regeneration, but instead negates the regaining of their functions through\
    \ any method. Ex: If Yogiri kills someone\u2019s ears they can cut them off and\
    \ regenerate them perfectly but they still won\u2019t be able to hear, not even\
    \ through telepathy. *Yogiri \"kills\" a dog man\u2019s eyes, ears, and nose;\
    \ negating the senses that go along with them. No amount of healing magic was\
    \ useful, and the dog-man is completely unable to communicate with others or grasp\
    \ aspects of the world, even telepathy is effectively negated... *Analyze skill\
    \ can't detect Yogiri's abilities *\"Killing intent\" is a rather lacking description\
    \ for his powers, since he actually can sense/predict any hazards towards his\
    \ life *Yogiri's can see hazards in the form of shadows which allows him to know\
    \ where attacks were going to land, the source of the danger or the trajectory\
    \ of the attack. *Yogiri's Instant Death \"killed\" Lisa\u2019s ice magic, completely\
    \ negating it, and he also \u201Ckilled\u201D her magic staff causing it to shatter\
    \ to pieces. *Yogiri can kill clothes *Yogiri killed Lain\u2019s true body through\
    \ the indirect connection Lain\u2019s B existence had with Lain\u2019s (main)\
    \ existence who\u2019s existence was reliant on her real body which was located\
    \ in a completely different dimension. *Yogiri only leads towards one future and\
    \ his opponent could not attack within time stop because they would get him killed\
    \ through killing intent. *Yogiri can kill barriers *Yogiri\u2019s ability reacts\
    \ to the Celestial Foundation Eater\u2019s killing intent and causes that the\
    \ death of the avatar of the Celestial Foundation Eater to become a decided future.\
    \ *Yogiri kills an undead *Yogiri\u2019s ability kills an entire battalion of\
    \ undead monsters and people with \u201Cimmunity\u201D to Instant Death. *Yogiri\
    \ inadvertently killed the sealed Devil and his passive miasma *Yogiri can kill\
    \ inanimate objects *Yogiri kills the tower\u2019s ability to suction spirits.\
    \ *Yogiri's existence is protected by Fate *Narration states that Yogiri can kill\
    \ any existence or phenomena *Heavily hinted that Yogiri is the incarnated phenomena\
    \ of death. *Aoi states that Yogiri is not a living being *Yogiri causes Aoi to\
    \ fall into despair, her internals organs to twist, and her sanity be lost when\
    \ she tries to look through the flow of Fate. She immediately surrendering despite\
    \ her ability, as all futures lead to Yogiri\u2019s victory. *Vahanato was instinctively\
    \ afraid of Yogiri and would not take aim at him with her light attacks despite\
    \ her having lost all of her sanity. *Yogiri's ability is beyond the normal flow\
    \ of time and beyond fate *More about Yogiri's ability *Yogiri is capable of killing\
    \ the immortal ruler of life and death, someone on whom the concept of death should\
    \ not even apply to *Yogiri's true form is beyond Fate and Plot itself. *Yogiri\
    \ can perceive and freely manipulate the higher-dimensional Abyss/Astral Plane.\
    \ *Yukimasa's ability of rewriting the future at will couldn't deal with Yogiri.\
    \ *Yogiri can use his powers even while sleeping. *If Yogiri dies, he will reincarnate\
    \ into a new vessel. *What dies and what phenomenon occurs, all of it relies on\
    \ Yogiri's subjective perception of death. *His power can manifest through videos,\
    \ audios, cameras and any other recording device, even if not in real time. *He\
    \ can kill and destroy programs, such as the Judge. *Yogiri can use his power\
    \ to tear holes between different realities and travel through them. *Yogiri's\
