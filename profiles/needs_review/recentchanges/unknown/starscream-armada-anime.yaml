- id: claim-standard-equipment-2e5f4043
  section: equipment
  axis: equipment
  text: '| 2791Scream.webp|Sword Jungle-Null_Ray_Cannon.jpg|Null Laser Cannon Swindle-AR-model.gif|Swindle
    * Sword: Starscream''s trademark weapon, where his left wing folds into a sword.
    When activated, his sword is surrounded by a red energy that allows it to be more
    powerful than before, and is even able to clash with weapons such as the Star
    Saber. * Shoulder Cannons: A pair of shoulder mounted cannons Starscream can deploy
    to fire at his enemies without having to resort with close combat, often referred
    to as his "Null Laser Cannon" or even "Proton Cannon" whenever Starscream powered
    by Swindle, allowing him to fire devastating explosions at his enemies. * Swindle:
    Discovered and acquired by Starscream in a forest, Swindle is Starscream''s Mini-Con
    partner. By fusing with him he can increase his capabilities drastically allowing
    him to turn the battle to his favour, a devastating force for the Autobots. He
    was also given the nickname Grid by Starscream, as a showing of how affectionate
    he is of him. Although Swindle has a real bond with Starscream, the Mini-Cons
    still do not wish to fight in the war and be used as weapons, which Starscream
    learns much later on. |} {| class="mw-collapsible mw-collapsed" align="center"
    border="1" cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; " |Optional'
  source_ids: *id003
  decisive: false
  status: unverified
