- id: claim-powers-and-abilities-7f35e490
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Weapon Mastery (Can efficiently use\
    \ various types of weapons like guns and even a tank despite his age), Regeneration\
    \ (Mid-Low: Comparable to Ness, who can recover after being damaged from explosion\
    \ based attacks. Can fully heal himself from physical wounds from eating or resting),\
    \ Non-Physical Interaction (Can interact and fight against ghosts and Intangibles,\
    \ such as Evil Elemental or Fenomeno), Resistance to Radiation Manipulation (Can\
    \ endure the Atomic Reactor Robot\u2019s explosion without suffering any adverse\
    \ effects from the radiation), Likely Limited Resistance to Time Stop (Likely\
    \ the same as Jeff's given the similar opponents fought between the games) Explosion\
    \ Manipulation (Via Bomb and Super Bomb), Energy Projection (Via Laser Beam and\
    \ Plasma Beam), Sound Manipulation, Statistics Amplification and Statistics Reduction\
    \ (Bullhorn allows one to amplify their voice. If the enemy believes what the\
    \ user is saying, their attack decreases, otherwise it increases. Flea Bag decreases\
    \ an opponent's both offense and defense),Light Manipulation and Status Effect\
    \ Inducement (Flashdark blinds the opponent. Both StkyMachine and Rope completely\
    \ block the opponent, making them unable to move), Limited Poison Manipulation\
    \ (Can instanyly knock out insect-like opponents with Insecticide and Super Spray),\
    \ Limited Attack Reflection (Franklin Badge reflects electric attacks), Damage\
    \ Reduction (Pendants halve the damage from PK Fire, Freeze, and Thunder respectively),\
    \ Teleportation (Onyx Hook can teleport the user to Magicant) Self-Healing and\
    \ Purification (Type 3. Food can be used to heal wounds, and Medicine can be used\
    \ to heal from poison and cold)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
