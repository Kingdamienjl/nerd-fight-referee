  tier:
    text: 'Name: Chaos Ball Origin: Super Dragon Ball Heroes Age: Unknown (It was
      created for a short amount of time before merging with Mechikabura, however
      due to absorbing the entire infinite multiverse which includes all of time,
      past, present and future, its age is irrelevant) Classification: Black Holes
      Wielders: Mechikabura (Also its creator), Dark Shenron *Possible users: Fu (Super
      Dragon Ball Heroes), Universe Tree, Demigra (Dragon Ball Heroes), Robelu Location:
