      the Dark Factor, the Chaos Ball is capable of absorbing the entire infinite
      multiverse along with all past, present and future and the Crack of Time. Its
      powers boosted Mechikabura tremendously. Stated by the narratorSDBH Dark Demon
      Realm Mission Manga Chapter 16SDBH Dark Demon Realm Mission Manga Chapter 17
      that it instantly absorbed all existence, along with Time Nest and Crack of
      Time, leaving behind a voidSDBH Dark Demon Realm Mission Manga Chapter 16SDBH
