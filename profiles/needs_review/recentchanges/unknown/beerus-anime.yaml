      destruction of two universesDragon Ball Super - Episode 28 each containing three
      universal space-times]. Is stated to be able to easily destroy the universe,
      and has proven these claims multiple times during his fight with Goku, despite
      holding back his true power. Traded blows with Champa, who can harm him6 Universes)
    source_ids: *id002
    confidence: 0.8
  speed:
