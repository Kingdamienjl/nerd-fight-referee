    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range; Low Complex Multiversal with Ki Blasts and Shockwave
      Attacks; Interdimensional & Extradimensional (5-D; Can affect two respective
      universes which have a Neutral Space between them)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: At least Above Average, Genius combatant (As the God of Destruction, Beerus
      possesses millions of years of fighting experience, casually defeating the entirety
      of the Z Fighters with nothing more than a bored expression on his face. Due
      to his tutelage under Whis, Beerus has mastered a wide variety of martial arts
      and has extensive knowledge of pressure points, allowing him to instantly incapacitate
      foes of Goku's caliber with a single attack. However, for all his power and
      experience, Beerus' inability to find a proper sparring partner (outside of
      Whis) in Universe 7 has left him in a constant state of boredom and moodiness.
      As a result, he will often drag out fights for their entertainment on the rare
      occasion that he does find someone who manages to catch his eye (as he did with
      Goku despite his ability to easily defeat him at any time). In addition, he
      is far more interested in trying Earth's cuisine than paying attention to important
      objectives or potentially cataclysmic events, such as ignoring Frieza's rampage
      while enjoying a sundae and watching from the sidelines which, to be frank,
      was somewhat justified at the time by the fact that Beerus was still far above
      the conqueror in terms of power)
    source_ids: *id002
    confidence: 0.8
