      \ differently to accommodate these inherent differences), Several Meters with\
      \ Intention Reflection and Claw Marks (Both Shinjutsu are shown to extend several\
      \ meters from the user's physical location), likely far higher with Intention\
      \ Reflection (Since the ability is based on harmful intention, and is not an\
      \ ability that requires a physical distance to be traveled. The range of it\
      \ should logically be far higher than what has been shown in the series), Several\
      \ Kilometers with Storm Creation (Shibai, through an unknown Shinjutsu, can\
      \ generate entire thunderstorms, which normally are around several kilometers\
      \ in diameter), Universe level+ with Omnipotence (It's explained that Omnipotence\
      \ allowed \u014Ctsutsuki Gods to create entire \"worlds\" from naught. Ada's\
      \ usage of Omnipotence affected everyone on a universal and interdimensional\
      \ scale), Interdimensional with Senrigan, Omnipotence, and Claw Marks (By using\
      \ Claw Marks, Shibai can traverse through entire dimensions), Multiversal with\
      \ Prescience (With this ability, Shibai can perceive a countless number of alternative\
      \ realities)"
    source_ids:
    - vsbattles-shibai-tsutsuki-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Extraordinary Genius (\u014Ctsutsuki geneticallyBoruto, Chapter 5: \"Momoshiki\
      \ and Kinshiki!!\" devourBoruto, Episode 62 and incorporate informationBoruto,\
      \ Chapter 55: \"Legacy\" into their very being through a complex evolutionary\
      \ process similar to reincarnation; a cycle of death and rebirth actualized\
      \ by Kama - bestowing upon them ever-evolving intelligence and martial ability.\
      \ Shibai has consumed an innumerable amount of genetic information. It's held\
      \ as common knowledge by the clan that Shibai had devoured countless planets,\
      \ naturally consuming all genetic information present and incorporating that\
      \ material into himself, resulting in a great increase to his intellect. Additionally,\
      \ \u014Ctsutsuki who can be inferred as being less intelligent compared to Shibai\
      \ given his evolutionary status, one that is on the precipice of transcendence,\
      \ have developed technology so advanced that it completely eclipses anything\
      \ humanity has constructed, including technologies developed by Amado. Finally,\
      \ Shibai, through his ability Prescience, has acquired an extensive amount of\
      \ information and understanding because of its capability to see into countless\
      \ amounts of futures)"
    source_ids:
    - vsbattles-shibai-tsutsuki-unknown
    confidence: 0.6
    notes: auto_repair source extraction
