power_scale:
  tier:
    text: 2-C, far higher with God Transformations
    source_ids: &id002
    - mediawiki-2472040
    confidence: 0.8
  attack_potency:
    text: 'Low Multiverse level (Much stronger than the combined strength ofDragon
      Ball Super: Broly - Movie Super Saiyan Blue Kaioken x20 Goku and Super Saiyan
      Blue Evolution Vegeta even in his base form, which power was stated to be equal,
      if not superior to an initial Super Saiyan Broly;Dragon Ball Super: Broly -
      Light Novel as he was capable of easily deflecting his Ki blasts.Dragon Ball
      Super: Broly - Movie As a Super Saiyan, he was able to match a stronger Super
      Saiyan Broly,Dragon Ball Super: Broly - Movie with their fight being described
      as a "clash of never-before-seen power",Dragon Ball Super: Broly - Light Novel
      surpassing any previous clashes, including the clash between Perfected Ultra
      Instinct Goku and Limits Broken Jiren during the Tournament of PowerDragon Ball
      Super - Episode 1306 Universes), far higher with God Transformations (As a Super
      Saiyan Blue, he overpowered and defeated Super Saiyan Full Power Broly with
      relative ease, and it was heavily implied that he was capable of killing him
      with an all-out Kamehameha.Dragon Ball Super: Broly - Movie Fusions are stated
      to be the ultimate and strongest trump card of Goku and Vegeta, with neither
      being inferior to the other, hence they should be superior to even a current
      Perfected Ultra Instinct GokuWeekly Jump: Dragon Ball Super: Broly - Promotional)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: 'Massively FTL+ (At the start of the fight, Gogeta in his base form was
      able to outspeed several Ki blasts from an initial Super Saiyan Broly with ease.
      As a Super Saiyan, he kept up with a faster Super Saiyan Broly, and even outpaced
      him at some points through their fightDragon Ball Super: Broly - MovieUpscales
      from 73.63 Quintillion c), far higher with God Transformations (As a Super Saiyan
      Blue, he overwhelmed Super Saiyan Full Power BrolyDragon Ball Super: Broly -
      Movie)'
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
