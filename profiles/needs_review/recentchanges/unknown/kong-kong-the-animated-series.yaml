  attack_potency:
    text: At least Multi-Continent level, likely Small Star level (Kong was empowered
      by Lua using all the Primordial Stones in Apocalypse, allowing him to force
      Chiros into the portal. The Primordial Stones collectively possess considerable
      power, where Lua uses them to empower Kong and recreate Chiros's prison. Their
      capabilities are explored further in Primal Power, while their origins and nature
      are addressed in The 13th Stone. This is consistent with the Blue Star, which
      establishes this level of power associated with the stones. Can hurt himself
      and fight those who can harm him. Fought Chiron who can create storms with just
      one of his stones.Season 1 Episode 17 - "Enlil's Wrath"), possibly higher |
      At least Multi-Continent level (Considerably stronger than before.) possibly
      higher (Fought Set who could casually raise a city from the desert and would've
      destroyed the world alongside other ancient gods of Egypt.Season 1 Episode 13
      - "The Sleeping City" the Cobra God who was going to burn the world into ashes.Season
      2 Episode 6 - "Cobra God" Comparable to the Windigo who during its fight with
      Kong, it's stated that the Windigo is absorbing the energy of the universe itself
      simply by existing, and that it can destroy the world and eventually the universe
      over timeSeason 2 Episode 7 - "Windigo"), higher as Mega Kong
    source_ids:
