- id: claim-weaknesses-9a5de3cc
  section: weaknesses
  axis: weakness
  text: 'Red Oak Tree (Wood or ashes from it can permanently kill her) Notable Attacks/Techniques:
    *Telekinesis: Hope is able to use this ability to move or influence something.
    Like other witches she is able to use this to bypass durability by attacking the
    internal organs. *Boundary Spell: Hope is able to cast boundary spells that can
    trap someone(s) in a location. If she were to use this in a house and the person
    were to try to leave the house through open doors, windows, or even through the
    walls themselves, a force field would keep them bound inside. *Locator Spell:
    Hope can cast a locator spell over an object or on an person, and their location
    will be revealed to her. The degree of the targets location (the city, the building,
    etc. depends on the level of the spell). Users have been able to find a "ball
    park figure" down to the exact location of the intended target. ==Notable Matchups==
