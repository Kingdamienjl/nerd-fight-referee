  text: 'Sonic can be cocky and overconfident at times and has trouble in aquatic
    areas due to his inability to swim. When the Warp Topaz receives too much of a
    charge, it will cause severe reality alterations and eventually explode, backfiring
    on the user. Without Starline''s glove it is hard to gain precise control on the
    Topaz opening portals becomes more difficult More violent than before. His Werehog
    form trades in a large bulk of his speed in favor of natural raw strength, and
    he transforms into this form involuntarily at night and will forc back in the
    day. When using 4 Prism Shards of the Paradox Prism, his power quickly runs out.
    None Notable Master King referred to Sonic''s enhanced Cyber Corruption power
    as a "fragile thing" that is volatile to his form due to it not being meant for
    him.Sonic Frontiers: Another Story (Fifth Tower Trial Cleared) This is proven
    correct, as strenuous power struggles can disable the form and even shut off his
    Super State entirely (although he can reactivate both fairly quickly, and Rings
