- id: claim-intelligence-a8dbf846
  section: power_scale
  axis: battle_iq
  text: Genius normally, Extraordinary Genius Combatant ([https://postimg.cc/nCWxB6mL
    Vastly superior] to his Adventure Era Self. Through years of countless adventures,
    Sonic has shown himself to be a skilled and formidable combatant. The Blue Blur's
    single greatest asset is his signature speed, which he has [https://imgchest.com/p/9249e6pgbyn
    demonstrated] [https://imgchest.com/p/lqyerxgmz4d complete] [https://imgchest.com/p/a846m858w7x
    mastery] [https://imgchest.com/p/ej7m5dldbyd over] [https://imgchest.com/p/vj4jzl8ox78
    in] any environment due to [https://imgchest.com/p/pg73qelbg4r full control of
    his momentum]. Because of this, Sonic excels in applying his speed and agility
    into [https://imgchest.com/p/pg73qedwj4r evasive maneuvers] and [https://imgchest.com/p/wl7l8qov64x
    offensive techniques] fueled by [https://imgchest.com/p/a846m8dvw7x momentum-based]
    [https://imgur.com/a/Q2BYcXL allowing him to use his incredible agility] [https://imgchest.com/p/m9yxnjrgm7q
    both in and out of combat in nearly any type of terrain and situation]. Beyond
    clever applications of Sonic's speed is his capacity for adaptability and quick
    learning; [https://imgur.com/a/3afrbQf learned swordsmanship so quick he became
    bored by it, effortlessly applying teachings "like it was nothing" in a manner
    deemed as "like a true knight" during his very first battle] and [https://cdn.imgchest.com/files/deedd1c05e65.mp4
    effortlessly applying it to his speed]. In duels, Sonic is [https://www.youtube.com/watch?v=WWUjHVPAj1Y&t=775s
    capable of of precisely timing his attacks] with his opponent multiple times in
    a row, canceling the attacks and giving him an opening for a counter attack, doing
    so as early as his first real fight with Caliburn. Sonic is also knowledgeable
    on traditional martial arts such as [https://imgur.com/a/OSCjdEg Kenpo] and [https://imgur.com/a/sonic-unleashed-chun-nan-day-side-missions-9EEseEi
    Kung Fu, the latter of which he quickly mastered after only 2 sections of training].
    His skillset [https://imgur.com/a/b2rHMcV left Master Zik utterly impressed, calling
    his moves unique and acknowledging him as being a master on his own], with the
    Deadly Six being said to [https://postimg.cc/F1K2TKBm have been humiliated by
    him in battle]. [https://imgur.com/a/7cNuPZS Kept up with] Neo Metal Sonic after
    he copied his Bio-Data, [https://imgur.com/a/GXtPj0t which allows him to copy
    one's own intellect for himself]. Capable of [https://imgur.com/a/blue-rat-vs-robot-rat-SU6iK3s
    out-racing, out-fighting & out-thinking] Metal Sonic across most of their encounters,
    despite Metal's capabilities of copying and learning with each encounter and having
    powers & abilities similar to Sonic himself. Casually [https://imgur.com/QMudkwg
    dominated Surge in combat], [https://imgur.com/a/starline-refers-to-surge-kit-as-perfectly-calibrated-doppelgangers-of-sonic-tails-sth-50-8vF15XZ
    who was perfectly calibrated] [https://imgur.com/a/surge-kits-bodies-are-result-of-combination-of-cybernetics-combat-information-of-sonic-shadow-neo-metal-sonic-power-cores-loose-dna-of-tails-personality-of-belle-sth-imposter-syndrome-3-AWbbxSi
    with his Bio-Data to be his equal] and who was so similar in all aspects that
    Dr. Eggman's [https://imgur.com/a/starlines-combat-data-was-so-accurate-that-eggmans-security-algorithms-which-are-familiar-with-blue-blur-fox-boy-could-not-distinguish-surge-kit-from-sonic-tails-sth-imposter-syndrome-4-6mHieBk
    systems were unable to differentiate her from him]. [https://www.youtube.com/watch?v=QMopx-E4la0&t=7340s
    Easily defeated] [https://www.youtube.com/watch?v=QMopx-E4la0&t=7600s and mocked]
    Eggman while piloting the Egg Dragoon, [https://imgur.com/gallery/egg-dragoon-eggmans-mad-science-pinacle-cRpusyN
    a machine that has years of study of his movement patterns in the several years
    he and the Doctor have been fighting]. Referred to by Doctor Starline as [https://imgchest.com/p/9rydo29wl7k
    the only being capable of standing up to Dr. Eggman with sheer skill alone]. Despite
    Dr. Eggman's intellect and vast list of creations, such as [https://imgchest.com/p/92496dpzb4n
    machines with years of research into Sonic's movement patterns], Sonic has [https://imgchest.com/p/a846mz3ag7x
    come out on top over 227,000 times]. Defied Sage's expectations, a supergenius
    AI, regarding both his chances of survival [https://www.youtube.com/watch?v=DVWeU4VhZ_g&t=300s
    against] [https://www.youtube.com/watch?v=DVWeU4VhZ_g&t=1125s the] Titans and
    the [https://www.youtube.com/watch?v=uiXzAli2New&t=1014s handling] of his Cyber
    Corruption, both of which she said it would be impossible for him to beat. Impressed
    and shocked the Ancients' [https://www.youtube.com/watch?v=tUCDSmXRyjQ&t=600s
    greatest warriors] and [https://www.youtube.com/watch?v=tUCDSmXRyjQ&t=650s minds
    alike], the very beings who created Cyber Space, to the point where one referred
    to his potential as "limitless" and was incapable of comprehending the way he
    fought nor how he overcame the Titans. Sonic is a
