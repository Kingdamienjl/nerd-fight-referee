  stamina:
    text: Superhuman (Endured the "Arrow of Judgement", which slowly drained his life-force,
      weakening him to such a level that he was left on his knees, and much later
      was still capable of standing up to fight against Erazor Djiin. Withstood a
      beating from Merlina and refused to give up regardless of his physical condition.
      Ran at top speed almost nonstop for several days while physically and mentally
      taxed in order to fight off the effects of the Metal Virus, receiving minimal
      rest for the duration of the plague. Stated that he isn't used to getting tired
      despite his adventurous lifestyle. Absorbed Cyber Corruption to free Amy, Knuckles,
      and Tails from their imprisonment across the Starfall Islands. Even while dealing
      with the corruption's influence across nearly all of Sonic Frontiers and dealing
      with it better than Sage predicted, he successfully scaled all six towers of
      Rhea Island and refused to stop until his friends were freed from Cyber Space.
      In situations where most others would give up and where he is severely outnumbered
      or outgunned, such as close encounters with the Titans when he's without all
      the Chaos Emeralds, Sonic never loses faith in himself and never surrenders),
      same, if not higher, with transformations, Infinite with Endless Boost (Gains
      never ending energy at the cost of not being able to hold any Rings) | Infinite
      (Is powered by all 7 Chaos Emeralds) | Infinite (Uses a Super State as its base,
      and should thus have its stamina directly)
    source_ids: *id002
    confidence: 0.95
  range:
    text: 'Standard Melee Range, Extended Melee Range with Caliburn, Hundreds of Meters
      with abilities. Up to Low Complex Multiversal With Chaos Control (Chaos Control
      can halt time in White Space, as Shadow intended to freeze the moment in time
      where Maria and Gerald were being restored to the timeline to prevent it, despite
      it repeatedly being stated that all of space-time was erased. Should be superior
      to Base Eggman and Primordial Form Time Eater, which can respectively travel
      reach White Space and Time Eater''s Lair). Beyond baseline Complex Multiversal
      with the Double Boost (Broke through Null Space using the Double Boost alongside
      the Rookie, an alternate dimension that is stated to go on forever, be an endless
      void, and contain absolutely nothingSonic Forces: Stage 24 - Metropolis (Null
      Space)) Same as his Base form. Universe level+ with abilities (Moves such as
      Time Break allow Darkspine Sonic to freeze the flow of time. Fixed the entirety
      of the Arabian Nights reality with a hand gesture) Same as his Base form. Extended
      Melee Range to Several Meters via Elasticity (Able to extend his limbs that
      far. Able to create shockwaves that cover that far by pounding the ground) Same
      as his Base form. Extended Melee Range, higher with Excalibur''s extension,
      Thousands of Kilometers with abilities (Excalibur is made by the combined power
      of all 4 Sacred Swords, with them being able to create a giant barrier that
      can cover that far) Standard Melee Range; Hundreds of Meters, up to Low Complex
      Multiversal with his Aura (Super Sonic''s aura swallowed several duplicates
      of Perfect Chaos and shattered alternate worlds of the Phantom Ruby all through
      out the Egg Field); Varies. Low Multiversal (Powered by all 7 Chaos Emeralds,
      with the Emeralds being able to reach to 2 universes alongside the Sol Emeralds),
      up to beyond baseline Complex Multiverse level with abilities (Able to affect
      Solaris, who Dr. Eggman twice states is an extra-dimensional lifeformSonic the
      Hedgehog (2006) VS Solaris: Phase 1 Pop UpsSonic the Hedgehog (2006) VS Solaris:
      Phase 2 Pop Ups that would make it superior to the likes of Illumina and Void.
      Travelled to the Infinite Tunnel Dimension alongside Classic Super Sonic. Should
      be comparable to Solaris due to being powered by the full power of the Chaos
      Emeralds, which allowed him to destroy "everything" across all of time, which
      would include Null Space) Same as Super Sonic, if not higher.'
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: Genius normally, Extraordinary Genius Combatant ([https://postimg.cc/nCWxB6mL
      Vastly superior] to his Adventure Era Self. Through years of countless adventures,
      Sonic has shown himself to be a skilled and formidable combatant. The Blue Blur's
      single greatest asset is his signature speed, which he has [https://imgchest.com/p/9249e6pgbyn
      demonstrated] [https://imgchest.com/p/lqyerxgmz4d complete] [https://imgchest.com/p/a846m858w7x
      mastery] [https://imgchest.com/p/ej7m5dldbyd over] [https://imgchest.com/p/vj4jzl8ox78
      in] any environment due to [https://imgchest.com/p/pg73qelbg4r full control
      of his momentum]. Because of this, Sonic excels in applying his speed and agility
      into [https://imgchest.com/p/pg73qedwj4r evasive maneuvers] and [https://imgchest.com/p/wl7l8qov64x
      offensive techniques] fueled by [https://imgchest.com/p/a846m8dvw7x momentum-based]
      [https://imgur.com/a/Q2BYcXL allowing him to use his incredible agility] [https://imgchest.com/p/m9yxnjrgm7q
      both in and out of combat in nearly any type of terrain and situation]. Beyond
      clever applications of Sonic's speed is his capacity for adaptability and quick
      learning; [https://imgur.com/a/3afrbQf learned swordsmanship so quick he became
      bored by it, effortlessly applying teachings "like it was nothing" in a manner
      deemed as "like a true knight" during his very first battle] and [https://cdn.imgchest.com/files/deedd1c05e65.mp4
      effortlessly applying it to his speed]. In duels, Sonic is [https://www.youtube.com/watch?v=WWUjHVPAj1Y&t=775s
      capable of of precisely timing his attacks] with his opponent multiple times
      in a row, canceling the attacks and giving him an opening for a counter attack,
      doing so as early as his first real fight with Caliburn. Sonic is also knowledgeable
      on traditional martial arts such as [https://imgur.com/a/OSCjdEg Kenpo] and
      [https://imgur.com/a/sonic-unleashed-chun-nan-day-side-missions-9EEseEi Kung
      Fu, the latter of which he quickly mastered after only 2 sections of training].
      His skillset [https://imgur.com/a/b2rHMcV left Master Zik utterly impressed,
      calling his moves unique and acknowledging him as being a master on his own],
      with the Deadly Six being said to [https://postimg.cc/F1K2TKBm have been humiliated
      by him in battle]. [https://imgur.com/a/7cNuPZS Kept up with] Neo Metal Sonic
      after he copied his Bio-Data, [https://imgur.com/a/GXtPj0t which allows him
      to copy one's own intellect for himself]. Capable of [https://imgur.com/a/blue-rat-vs-robot-rat-SU6iK3s
      out-racing, out-fighting & out-thinking] Metal Sonic across most of their encounters,
      despite Metal's capabilities of copying and learning with each encounter and
      having powers & abilities similar to Sonic himself. Casually [https://imgur.com/QMudkwg
      dominated Surge in combat], [https://imgur.com/a/starline-refers-to-surge-kit-as-perfectly-calibrated-doppelgangers-of-sonic-tails-sth-50-8vF15XZ
      who was perfectly calibrated] [https://imgur.com/a/surge-kits-bodies-are-result-of-combination-of-cybernetics-combat-information-of-sonic-shadow-neo-metal-sonic-power-cores-loose-dna-of-tails-personality-of-belle-sth-imposter-syndrome-3-AWbbxSi
      with his Bio-Data to be his equal] and who was so similar in all aspects that
      Dr. Eggman's [https://imgur.com/a/starlines-combat-data-was-so-accurate-that-eggmans-security-algorithms-which-are-familiar-with-blue-blur-fox-boy-could-not-distinguish-surge-kit-from-sonic-tails-sth-imposter-syndrome-4-6mHieBk
      systems were unable to differentiate her from him]. [https://www.youtube.com/watch?v=QMopx-E4la0&t=7340s
      Easily defeated] [https://www.youtube.com/watch?v=QMopx-E4la0&t=7600s and mocked]
      Eggman while piloting the Egg Dragoon, [https://imgur.com/gallery/egg-dragoon-eggmans-mad-science-pinacle-cRpusyN
      a machine that has years of study of his movement patterns in the several years
      he and the Doctor have been fighting]. Referred to by Doctor Starline as [https://imgchest.com/p/9rydo29wl7k
      the only being capable of standing up to Dr. Eggman with sheer skill alone].
      Despite Dr. Eggman's intellect and vast list of creations, such as [https://imgchest.com/p/92496dpzb4n
      machines with years of research into Sonic's movement patterns], Sonic has [https://imgchest.com/p/a846mz3ag7x
      come out on top over 227,000 times]. Defied Sage's expectations, a supergenius
      AI, regarding both his chances of survival [https://www.youtube.com/watch?v=DVWeU4VhZ_g&t=300s
      against] [https://www.youtube.com/watch?v=DVWeU4VhZ_g&t=1125s the] Titans and
      the [https://www.youtube.com/watch?v=uiXzAli2New&t=1014s handling] of his Cyber
      Corruption, both of which she said it would be impossible for him to beat. Impressed
      and shocked the Ancients' [https://www.youtube.com/watch?v=tUCDSmXRyjQ&t=600s
      greatest warriors] and [https://www.youtube.com/watch?v=tUCDSmXRyjQ&t=650s minds
      alike], the very beings who created Cyber Space, to the point where one referred
      to his potential as "limitless" and was incapable of comprehending the way he
      fought nor how he overcame the Titans. Sonic is a
