- id: claim-range-746cd258
  section: power_scale
  axis: range
  text: 'Standard Melee Range, Extended Melee Range with Caliburn, Hundreds of Meters
    with abilities. Up to Low Complex Multiversal With Chaos Control (Chaos Control
    can halt time in White Space, as Shadow intended to freeze the moment in time
    where Maria and Gerald were being restored to the timeline to prevent it, despite
    it repeatedly being stated that all of space-time was erased. Should be superior
    to Base Eggman and Primordial Form Time Eater, which can respectively travel reach
    White Space and Time Eater''s Lair). Beyond baseline Complex Multiversal with
    the Double Boost (Broke through Null Space using the Double Boost alongside the
    Rookie, an alternate dimension that is stated to go on forever, be an endless
    void, and contain absolutely nothingSonic Forces: Stage 24 - Metropolis (Null
    Space)) Same as his Base form. Universe level+ with abilities (Moves such as Time
    Break allow Darkspine Sonic to freeze the flow of time. Fixed the entirety of
    the Arabian Nights reality with a hand gesture) Same as his Base form. Extended
    Melee Range to Several Meters via Elasticity (Able to extend his limbs that far.
    Able to create shockwaves that cover that far by pounding the ground) Same as
    his Base form. Extended Melee Range, higher with Excalibur''s extension, Thousands
    of Kilometers with abilities (Excalibur is made by the combined power of all 4
    Sacred Swords, with them being able to create a giant barrier that can cover that
    far) Standard Melee Range; Hundreds of Meters, up to Low Complex Multiversal with
    his Aura (Super Sonic''s aura swallowed several duplicates of Perfect Chaos and
    shattered alternate worlds of the Phantom Ruby all through out the Egg Field);
    Varies. Low Multiversal (Powered by all 7 Chaos Emeralds, with the Emeralds being
    able to reach to 2 universes alongside the Sol Emeralds), up to beyond baseline
    Complex Multiverse level with abilities (Able to affect Solaris, who Dr. Eggman
    twice states is an extra-dimensional lifeformSonic the Hedgehog (2006) VS Solaris:
    Phase 1 Pop UpsSonic the Hedgehog (2006) VS Solaris: Phase 2 Pop Ups that would
    make it superior to the likes of Illumina and Void. Travelled to the Infinite
    Tunnel Dimension alongside Classic Super Sonic. Should be comparable to Solaris
    due to being powered by the full power of the Chaos Emeralds, which allowed him
    to destroy "everything" across all of time, which would include Null Space) Same
    as Super Sonic, if not higher.'
