  text: Superhuman (Endured the "Arrow of Judgement", which slowly drained his life-force,
    weakening him to such a level that he was left on his knees, and much later was
    still capable of standing up to fight against Erazor Djiin. Withstood a beating
    from Merlina and refused to give up regardless of his physical condition. Ran
    at top speed almost nonstop for several days while physically and mentally taxed
    in order to fight off the effects of the Metal Virus, receiving minimal rest for
    the duration of the plague. Stated that he isn't used to getting tired despite
    his adventurous lifestyle. Absorbed Cyber Corruption to free Amy, Knuckles, and
    Tails from their imprisonment across the Starfall Islands. Even while dealing
    with the corruption's influence across nearly all of Sonic Frontiers and dealing
    with it better than Sage predicted, he successfully scaled all six towers of Rhea
    Island and refused to stop until his friends were freed from Cyber Space. In situations
    where most others would give up and where he is severely outnumbered or outgunned,
    such as close encounters with the Titans when he's without all the Chaos Emeralds,
    Sonic never loses faith in himself and never surrenders), same, if not higher,
    with transformations, Infinite with Endless Boost (Gains never ending energy at
    the cost of not being able to hold any Rings) | Infinite (Is powered by all 7
    Chaos Emeralds) | Infinite (Uses a Super State as its base, and should thus have
    its stamina directly)
