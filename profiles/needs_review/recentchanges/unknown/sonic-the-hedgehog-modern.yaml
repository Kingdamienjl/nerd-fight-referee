    text: 'Massively FTL+ ([https://postimg.cc/nCWxB6mL Vastly superior] to his Adventure
      Era-self. Capable of evading crashing meteors on a ship traveling through interstellar
      space. Kept pace with Master Core: ABIS while it flew with its gravitational
