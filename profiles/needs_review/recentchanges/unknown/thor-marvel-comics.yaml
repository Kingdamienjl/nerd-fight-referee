    - field: weaknesses
      value: 'Thor''s tendency to hold back against foes of Earthly roots, as he fears
        his full might may destroy them, sometimes results in Thor being caught by
        surprise. Additionally, he is more vulnerable to damage when outside of the
        Nine Realms. His statistics amplification methods have severe drawbacks (Using
        Megingjord will later leave Thor in such an exhausted state he can barely
        walk, while the Warrior''s Madness robs Thor of his ability to differentiate
        between friends and foes). He has sometimes been portrayed as susceptible
        to the charms of extremely beautiful evil women, in particular Amora the Enchantress.
        | Requires the Allsleep in order to rejuvenate his powers | None notable |
        Requires the Allsleep in order to rejuvenate his powers | Requires the Allsleep
        in order to rejuvenate his powers | Thor''s Fate Manipulation cannot rewrite
        the past and could only destroy the future Fate that bound the Nine Worlds
        to the cycle of Ragnarok Additional Feats/Scaling: As a character with decades
        of history and a large number of high-tier feats, Worthy Thor has so many
        showings that displaying all of his notable battles and accomplishments would
