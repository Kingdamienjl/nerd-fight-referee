    to affect Thor. Loki had to tap into the power of Surtur''s Twilight Sword to
    turn Thor into a frog, implying the God of Mischief''s own transmutation power
    cannot achieve such a feat. :*Soul Manipulation: Thor can resist assaults from
    Glory''s psychic maggots that eat away at his very soul and could withstand the
    totality of Glory''s power, including his soul attacks. Doctor Strange and Mephisto
    also commented that Thor has a mighty soul. Thor even resisted Mephisto''s attempt
    to absorb his soul and forced out Loki''s astral possession. :*Mind Manipulation:
    Thor has resisted mind attacks from Moondragon. As a god, he also didn''t have
    his mind destroyed by Chaos King''s power, which could immediately destroy a mortal''s
    mind with a touch. He also resisted a wave of psychic toxins from Glory that permeated
    every level of his being: body, mind and spirit. He fought said attack and even
    continued his attack on Glory, while just speaking would take an effort to break
    most men or gods. Mind-tendrils attack from the maggots of The Other also affected
    Thor only momentarily before the God of Thunder recovered. The Hurricane of the
    Lustful in Mephisto''s Hell also failed to influence Thor. Powers with'
