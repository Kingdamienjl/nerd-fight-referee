- id: claim-weaknesses-1ed7692b
  section: weaknesses
  axis: weakness
  text: 'Dark Matter. Notable Attacks/Techniques: Dark Boots: Lenalee''s Innocence
    is called Dark Boots, they''re a equipment type Innocence which take the form
    of dark colored boots, these boots grant Lenalee the ability of greatly increased
    movement and some abilities which relate to the speed principle of her Innocence.
    * Waltz: Mist Wind: Lenalee can spin her legs fast enough to create massive, destructive
    tornadoes which rip and tear through her enemies. * Burden, Acoustic Technique:
    Sound Shackles: Lenalee''s Dark Boots allows her to interact with waves of vibration
    which is created from sound as if they were physical, doing so greatly increases
    the speed of Lenalee. * Burden, Water Surface Technique: Water Shackles: Lenalee''s
    Dark Boots allows her to interact with water as if it was solid, allowing her
    to walk and fight on water. Level 2 Dark Boots: After Lenalee''s Innocence became
    a "Crystal Type" the capabilities of Dark Boots massively increased, taking the
    basic principle of the previous form of Dark Boots to new and greater heights,
    these new Dark Boots dramatically increase Lenalee''s speed, this increase also
    increases Lenalee''s attacking power given she possesses more momentum behind
    her attacks compared to her previous Dark Boots, Lenalee can increase he speed
    and attacking power even further through increasing the acceleration of the butterfly-like
    thrusters on the backs of her boots.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-703ea69f
  section: abilities
  axis: hax
  text: 'Soul Manipulation, Poison Manipulation, Disease Manipulation and Deconstruction
    (Molecular: Scales to Allen Walker who resisted the effects of the Akuma Blood
    Oil Virus), Fire Manipulation, Heat Manipulation and Ice Manipulation (Resist
    "Ice Fire" which burns hotter than blue-flame level heats and creates -100 Degree
    Celsius ice), Sound Manipulation (Resist "Punk Voice" which creates a vibration
    wave of sound that causes enough pressure to cause dense ice to completely shatter,
    also causes the nerves within one''s body to become completely shot, causing someone
    to go into a catatonic state), Power Mimicry (Resist "Paper Mirror" which copies
    the appearance and abilities of someone, even ones that''re inherently antithetical
    towards his existence like Innocence or genetic abilities like Parasitic-Type
    Innocence) All Previous Resistances Including: Water Manipulation and Durability
    Negation (Resist "Water Bubbles" which causes the water within the effected target
    to be completely sucked out of them, leaving a dry and empty husk), Sleep Manipulation
    (Resist "Man Eating Plants" which create a pheromone that Allen describes as "sweet
    smelling", this pheromone causes the effected user to fall unconscious), Petrification,
    Paralysis Inducement and Biological Manipulation (Resist "Eye" which turns people
    into puppets, causing their bodies to become incredibly brittle and freezing their
    physical movements), Absorption (Biological: Resist "Thread" which deconstructs
    and absorbs matter down to the atomic-level), Fear Manipulation (Scales to Allen
    who resisted Tyki''s Noah-Form Aura), Unholy Manipulation, Corruption (Type 2),
    Enhanced Soul Manipulation, Power Nullification, Enhanced Poison Manipulation,
    Enhanced Disease Manipulation, Enhanced Deconstruction (Atomic), Limited Existence
    Erasure (Only Dark Boots), Spatial Manipulation, Gravity Manipulation and Darkness
    Manipulation (As a General-Class Exorcist, Lavi resists the effects of the Dark
    Matter from Noah and the Dark Matter from Akuma), Possession (Resist "Tsukikami"
    which can possess others, taking control of their physical movements and actions),
    Time Stop (Scales above Chomesuke who can move within Miranda''s "Timeout") and
    Willpower Manipulation (As a Exorcist, Lenalee resist the effects of Innocence''s
    Will)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
