- id: claim-standard-equipment-d74c6176
  section: equipment
  axis: equipment
  text: 'Rings are accessories that provide various bonuses when equipped. The Chosen
    Undead can equip up to 2 Rings, but equipping two of the same ring is not possible.
    Armor is protective equipment for The Chosen Undead in Dark Souls. The Chosen
    Undead can equip protective gear in four different body slots: Head, Chest, Arms
    and Legs. Armor is often comprised of "Sets" with a matching look and similar
    protective characteristics. They are not limited to Sets, however, and different
    pieces from different sets can be mixed to provide different defensive benefits
    with no drawbacks. Armor provides protection against both physical (Regular, Strike,
    Slash, Thrust) and elemental (Magic, Fire, Lightning) damage, it increases resistance
    against negative status effects, and it can increase Poise (stagger resistance).
    Like weapons, most armor pieces can be upgraded, and upgraded armor yields higher
    defensive values and elemental resistance, but never alters Poise.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
