- id: claim-powers-and-abilities-ed731643
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Aura (Fear-inducing & Explosive) *Genius
    Intelligence *Master Hand-to-Hand Combatant & Swordsman *Acrobatics *Social Influencing
    **Reputation ( he was renowned as the fastest shinobi of his time, thanks to his
    technique - He is known for creating numerous Jutsu such as edo tensei,Flying
    Thunder God tecnique,shadow clone tecnique ) **Instigated fear ( his presence
    is able to intimidate ) *Chakra Manipulation: **Statistics Amplification (Shinobi
    are capable of enhancing their physical capabilities with the use of chakra. The
    Teleportation Jutsu allows Shinobi to greatly enhance their speed by focusing
    chakra in their feetRin no Sho, Page 197Naruto Chapter 24Naruto Chapter 71) **Surface
    Scaling & Water Walking (By focusing chakra at the soles of their feet, Shinobi
    can scale and cling to vertical surfaces, and even walk on waterNaruto Chapter
    18Naruto Chapter 90) **Afterimage Creation, Stealth Mastery & Speed Enhancement
    (The Substitution Jutsu allows its user to instantly replace themselves with a
    nearby object such as a tree log, plant, person, or clone at the exact moment
    they are attacked. The Jutsu works even if the user is physically restrained or
    observed by characters as observant as Sharingan or Sage Mode users. This creates
    the optical illusion of the user being hit, which confuses the opponent and gives
    them an opening to flee or counterattackNaruto Chapter 6Naruto Chapter 54Naruto
    Chapter 374Naruto Chapter 580Naruto Chapter 674) **Minor Illusion Creation & Duplication
    (With the Clone JutsuRin no Sho, Page 220, Shinobi can create illusionary duplicates
    of themselves that have no physical substance) **Shapeshifting (With the Transformation
    JutsuRin no Sho, Page 220, Shinobi can transform themselves into other people,
    animals, plants, and even inanimate objects, such as weapons) **Paralysis Inducement
    (With the Paralysis JutsuRin no Sho, Page 176, Shinobi can completely paralyze
    their targets from close to mid range) **Soul Manipulation (Can send out his soul
    to a target''s body with a Kinjutsu similar to the Ghost Transformation Jutsu)
    **Extrasensory Perception (Can sense chakra signals countries away and can detect
    individual members of clans by their chakra type) *Nature Transformation: **Earth
    Manipulation **Fire Manipulation **Air Manipulation **Water Manipulation (Has
    an affinity for Water Release) **Electricity Manipulation *Edo Tensei: **Necromancy
    (Can resurrect and control the dead) *Tandem Paper Bombs: **Summoning & Explosion
    Manipulation *Flying Raijin: **Teleportation (Can teleport with Flying Raijin
    similarly to Minato) *Four Crimson Ray Formation: **Forcefield Creation (Can create
    a barrier with the other Hokage) ***Non-Physical Interaction (Via barrier) ***BFR
    All previous abilities when alive plus: *Immortality (Types 1, 2, 3, 4, 7 & 8
    - Edo Tensei are corpses possessed by a soul brought back from the Pure Land.
    They are incapable of feeling pain along with being able to survive grievous injuries
    such as bisectionNaruto Chapter 523 and dismemberment.Naruto Chapter 520 page
    21 Edo Tensei will keep coming back so long as their soul remains bound to the
    Edo realmNaruto Chapter 120Naruto Chapter 518) **Regeneration (Low-Godly - Edo
    Tensei are capable of regenerating from the complete destructionNaruto Chapter
    517 page 8 and 9 of their bodiesNaruto Chapter 561. It''s stated that as long
    as the soul remains, the Edo Tensei will keep coming back to lifeNaruto Chapter
    120Naruto Chapter 518) *Inorganic Physiology (Type 1 - Edo Tensei bodies are comprised
    of dust and ash enveloping an already deceased corpse shaping it into the revived
    person the caster choosesNaruto Chapter 119) *Self-Sustenance (Types 1, 2 & 3
    - The Edo Tensei are the souls of the dead the caster wants to reanimate, the
    caster uses an already dead body to house the revived soulNaruto Chapter 520)
    *Instinctive Action (Edo Tensei are programed to automatically counter enemy jutsuNaruto
    Chapter 547 along with their bodies moving of its own accordNaruto Chapter 548)
    Resistance to: *Mind Manipulation, Empathic Manipulation & Emotion Detection (Even
    though Edo Tensei are able to retain their consciousness when brought back from
    the afterlife, the controller can suppress their free willNaruto Chapter 119 Page
    16 binding their mind and shutting off all emotionNaruto Chapter 522)'
