- id: claim-weaknesses-43ec6053
  section: weaknesses
  axis: weakness
  text: 'Tobirama was a pragmatist and generally unsympathetic to his enemies; he
    tended to refrain from using diplomatic efforts to settle disputes. {| class="wikitable
    mw-collapsible mw-collapsed" !Notable Attacks and Techniques: |- | *: It allows
    the user to manipulate pre-existing water, or if sufficiently skilled create their
    own by converting their chakra into water. It''s considered one of the most versatile
    of the five chakra natures, as the techniques can not only change shape but the
    state as well. **: A technique that shapes massive amounts of water into the form
    of a giant, mighty dragon, which strikes the target with great force. **: A defensive
    technique that creates a wall of water around the user. The water is raised from
    below and blown out in the form of a circle around the user, to block incoming
    attacks or be used offensively to strike a target with the rising water wall.
    **: A technique that lets the user fire a high-pressure stream of water out of
    their mouth. This technique is powerful enough to cut through solid objects, such
    as the roots of the Divine Tree. ** A technique that lets the user fire water
    needles out of their mouth, it is usually used to target vital points. *: The
    Summoning Jutsu is a space-time ninjutsu that can summon weapons, familiars, tools,
    and other targets across vast distances by using blood as a sacrifice. *: A forbidden
    technique created by Tobirama. It allows the user to revive the dead. To perform
    this technique, the user must first acquire some of the DNA of the person they
    intend to revive. The soul of the intended revived must also reside in the pure
    world, and a living sacrifice is also required for the soul of the resurrected
    to use as a vessel. After the individual has been summoned and awakened, the summoner
    can bind the individual to their will by using a special talisman, which is attached
    to the end of a kunai and implanted in the brain. Various talismans can be used
    to enact different degrees of control. * A supplementary technique, created by
    Tobirama to take advantage of Edo Tensei''s infinitely regenerating bodies. By
    using their own bodies as mediums, the Edo Tensei creates several special explosive
    tags which attach themselves to a target. When detonated, additional explosive
    tags are summoned that in turn create more as they too explode. This process is
    continuously repeated, leading to a chain reaction of consecutive explosions.
    Tobirama was said to use this technique in conjunction with Edo Tensei whenever
    he needed to "clear the map." A live individual can also employ the method though
    the user will die in the process. *: Another technique that Tobirama created.
    It allows the user to create clones of himself that can fight independently and
    even perform their own techniques. However, the clones can be dispersed instantly
    if struck with a sufficiently powerful blow. *: A space-time teleportation technique
    created by Tobirama. It''s a technique that allows for almost instantaneous teleportation
    to any destination that is marked with a special seal. Once activated, the user
    enters a dimensional void that instantaneously transports themselves to the location
    of the seal. This formula can be applied in advance to weapons such as special
    kunai, and the mark can also be used on a touched area, such as an opponent (the
    seal never disappears from an object) or some other surrounding feature. This
    technique can also be used to teleport other objects or people, though the size
    of the object determines the amount of chakra required. **: A technique that combines
    the Flying Raijin technique with kenjutsu (sword techniques). While wielding a
    sword or kunai, Tobirama instantaneously teleports to a destination with the Flying
    Raijin Jutsu to deal a quick devastating slash to a target. **: A technique that
    requires two users of the Flying Raijin Jutsu. After both users mark each other
    with their respective seals, they will gain the ability to switch their positions
    at any point in time during a battle. It''s often used to make devastating surprise
    attacks on unsuspecting targets. : By molding his chakra into the appropriate
    form, Tobirama can locate and keep track of other living beings through their
    chakra signatures, working through walls and visual obstructions. Tobirama is
    one of the most proficient sensors, being able to sense chakra signals countries
    away and detect individual members of clans by their chakra type. Unnamed Kinjutsu:
    Tobirama can use an unnamed Kinjutsu that lets him send his soul to a target,
    similar to the Spirit Transformation Technique. |} ==Notable Matchups== Victories:
    Losses: Minato Namikaze (Naruto) Minato''s Profile (Alive versions of both were
    used. They started 20m apart in the clearing of a large forest) Inconclusive:
    ==References== ==Notes/Explanations== Category:Characters Category:Naruto Category:Acrobats
    Category:Air Users Category:Afterimage Users Category:Anime Characters Category:Antiheroes
    Category:Aura Users Category:BFR Use'
