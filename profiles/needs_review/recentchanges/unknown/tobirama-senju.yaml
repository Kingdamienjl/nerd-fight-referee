        \ is a space-time ninjutsu that can summon weapons, familiars, tools, and\
        \ other targets across vast distances by using blood as a sacrifice. *Edo\
        \ Tensei (Impure World Reincarnation): A forbidden technique created by Tobirama.\
        \ It allows the user to revive the dead. To perform this technique, the user\
        \ must first acquire some of the DNA of the person they intend to revive.\
        \ The soul of the intended revived must also reside in the pure world, and\
