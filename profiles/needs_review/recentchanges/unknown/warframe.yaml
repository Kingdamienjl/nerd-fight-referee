        \ of damage immunity.) * Resistence to Biological Manipulation/Matter Manipulation\
        \ (Molecular; The exoskeleton of the warframes makes them highly resistant\
        \ to the infestations ability to alter flesh on a molecular level) * Immortality/Resurrection\
        \ (Types 1, 2, 4 & 8; Warframes are stated to be able to remain active forever.\
        \ They can survive being pierced through by a sword Capable of reviving themselves\
        \ up to 4 times a missions by surging power to their systems. Warframes are\
        \ surrogate bodies controlled by an Operator meaning all Warframes can be\
        \ reconstructed from blueprints by the Helminth in their bases of operation.)\
        \ * Resistence to Temperature Manipulation (5,000\xB0C,Can fight near the\
        \ surface of the sun without suffering from the heat[,its cold resistance\
        \ should be far superior to the rest of the warframes since it is able to\
        \ withstand its own powers * Abstract Existence (Type 2,Narin has an existence\
        \ linked to Conceptual Incarnation and the Void, associated with the identity\
        \ of Zikhaio Nuri.) * Extrasensory Perception (All Warframes have a 30 meter\
        \ radar that alerts them to the position of their enemies.) * Healing (Orokin\
        \ Lorist's could heal people of severe injuries like acid burns and large\
        \ lacerations in the middle of battle; Warframes can do something similar\
        \ for allies who have been downed and should possess healing of a similar\
        \ potency but would requires more focus.) * Self-Sustenance (Types 2 and 3;\
        \ Warframes do not need to eat or sleep, they are also able to survive in\
        \ space and other areas with limited oxygen for extended periods but will\
        \ eventually require life support to continue.) * Acrobatics * Flight (Using\
        \ Hakchum, Narin deploys crane-like wings to rise and move through the air\
        \ before swooping down on a designated area. This ability grants him aerial\
        \ mobility and allows him to reach groups of enemies while subjecting them\
        \ to his cryogenic effects.) * Temperature Manipulation/Ice Manipulation (Neote,\
        \ Narin sword has an estimated natural temperature of 0.725 K (\u2212272.4\
        \ \xB0C), approximately 2 K below the cosmic microwave background temperature\
        \ and extremely close to absolute zero. The temperature of his sword is not\
