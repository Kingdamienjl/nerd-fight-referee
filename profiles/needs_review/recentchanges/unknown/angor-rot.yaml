- id: claim-powers-and-abilities-cd7ba54e
  section: abilities
  axis: hax
  text: 'Tier: Name: Angor Rot Origin: Trollhunters Gender: Male Age: At least a thousand
    years (lived during 1297 AD and should be as old as Draal) Classification: Troll
    Powers and Abilities: Superhuman Physical Characteristics, Stealth Mastery, Magic,
    Energy Projection, Immortality (Type 1), Enhanced Senses (Per being a Troll, which
    gives him acute sense of smell as well as sight), Regeneration (High-Low: Regenerates
    from carving out his own body), Acrobatics, Skilled hand-to-hand combatant, Weapon
    Mastery (With a dagger, Shadow Staff and sword), Portal Creation and BFR with
    Shadow Staff (Can create portals as a means of transportation or can use it to
    transport people into the Shadow Realm), Petrification with Creeper''s Sun Poison
    (Can imbue his weapons with Creeper''s Sun, which is able to turn objects into
    stone when cut by it. The time it takes for one to be petrified depends on the
    severity of the cut), Summoning (With his Animus Totems, when a totem comes contact
    with inanimate objects, they become Golems that follow his command), Technology
    Manipulation (Caused a black-out), Fate Manipulation with Totems (Can entwine
    the fates of two individuals (if one gets hurt, so will the other), though this
    requires them to directly ingest the totems), Soul Manipulation (Harvests the
    souls of his victims after killing them), Telekinesis, Teleportation (Creates
    a green flash when teleporting), Paralysis Inducement with Stasis Stones (Can
    use several stones to form a circle, and use it to trap victims by luring them
    into it), Explosion Manipulation with Dwarkstones (Dwarkstones are extremely volatile
    and its explosions are strong enough to reduce a Troll to ashes), Mind Manipulation
    with Pixies (Pixies are minuscule, glowing creatures that are capable of entering
    a person''s head and induce vivid hallucinations), Power Stealing (With The Mark
    of Angor Rot; when painted on a target''s face, he is able to control their abilities/weapons),
    Body Control (Can detach his eyes from his sockets in-order to spy on his target),
    Darkness Manipulation (Creates a shadow for him to pass through so he can avoid
    sunlight), Immunity to Soul Manipulation (Accidentally destroyed the Inferna Copula
    which contained his soul, loosing his soul in the process), Preparation (Set up
    a trap to lure Jim into, and made a bunch of Totems to attack Troll market), Durability
    Negation (with [https://talesofarcadia.fandom.com/wiki/Creeper''s_Sun Creeper''s
    Sun], as one hit turns you to stone), Resistance to Electricity (AAARRRGGHH!!!
    was immune to Tronos Madu [https://imgur.com/a/s8g3v6u due to being made of stone]
    so should he) Attack Potency: Small Building level+ (Burst through a roof. Staggered
    Aarghaumont with a kick and is able to trade blows with Post-Transformation Jim),
    Durability Negation with [https://talesofarcadia.fandom.com/wiki/Creeper''s_Sun
    Creeper''s Sun] Speed: Subsonic (Fast enough to keep up with a speeding automobile
    and a scooter at full speed. Caught a crossbow bolt point-blank) Lifting Strength:
    Class 25 (Wrestled with Draal, who can briefly grapple with Bular, who threw and
    lifted trucks with ease) Striking Strength: Small Building level+ (Strong enough
    to stagger Aarghaumont) Durability: Small Building level+ (Traded blows with the
    likes of Aarghaumont and Post-Transformation Jim) Stamina: Superhuman (Chased
    a car throughout Arcadia yet showed no signs of exhaustion) Range: Standard Melee
    Range, Tens of Meters with energy blasts, Kilometers with portals (Was able to
    travel from California to Florida with his portals) Standard Equipment: The Shadow
    Staff, Creeper Sun Dagger, Animus Totems Optional Equipment: Amber Pixie Hive
    Intelligence: Genius (Angor Rot is both a skilled swordsman and a cunning strategist;
    as shown where he is able to wield Daylight with proficiency and even defeated
    Jim with it. He is able to use his Golems and have them fight his opponents just
    to analyze their fighting style. He uses his Pixies and Golems to cause chaos
    and divert attention away from him, as seen during his final assault at Trollmarket
    with his Golems and in Arcadia Oaks High with his Pixies. Angor Rot has slain
    and claimed the souls of previous Trollhunters, a testament to his skill and competence)
    Weaknesses: Sunlight, which turns Trolls into stone when fully engulfed. The Inferna
    Copula can be used to control him (though it was destroyed by him). While his
    Golems can regenerate from any damage done to their body, they can be instantly
    killed if their Totems are destroyed (which is located in their "chest")'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
