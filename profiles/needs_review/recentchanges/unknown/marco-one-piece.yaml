    - field: weaknesses
      value: "Standard Devil Fruit users weaknesses. His healing powers have their\
        \ limits. Notable Attacks/Techniques right, which is an immensely unique type\
        \ of Zoan Devil Fruit said to be even rarer than Logia. His Devil Fruit enables\
        \ him to transform into a phoenix. It is because of this ability that he is\
        \ identified as \"Marco the Phoenix\". Using the power of his Devil Fruit,\
        \ Marco is capable of regenerating from virtually any attack like a phoenix\
        \ being reborn, : A defensive move that has Marco, in his phoenix form, he\
        \ forms a protective swirl of fire in front of him, out of his wings, in order\
        \ to block the attack in question. Being Marco's first-seen technique, Fujiazami\
        \ was used by him (but not named) when protecting Whitebeard from Kizaru during\
        \ the Summit War, protecting a bandaged-up Roronoa Zoro. The move's name is\
        \ a pun on, the name of the Japanese Fuji thistle. The Viz manga calls the\
        \ technique Undying Thistle., : While midair, Marco readies his phoenix talons\
        \ in front of him, then delivers an extremely forceful, two-legged kick to\
        \ a target. This move, was strong enough to knock back the Queen Mama Chanter,\
        \ an enormous ship. Later when used against Queen the Plague, making the All-Star\
        \ cough up blood and question if he had been hit by some shockwave. The technique's\
        \ name contains the Japanese name for the fenghuang (h\u014D\u014D), an immortal\
        \ bird originating in Chinese mythology that is often compared to the Western\
        \ phoenix, being sometimes called \"Chinese phoenix\" (despite mythological\
        \ similarities between the two being only superficial). The VIZ manga calls\
        \ this move Phoenix Brand., : Marco transforms his arms into phoenix wings\
        \ and swirls them around, thereby spreading his flames to a potential multitude\
        \ of people, setting them on fire in order to heal them. The technique was\
        \ first seen being used by Marco to counteract the \"Ice Oni\" virus in numerous\
        \ infected at Skull Dome's Live Floor, keeping the flames at just the right\
        \ temperature to slow the virus' effects. However, it is noted that the flames\
        \ cease to work the moment the affected run out of physical stamina. The technique's\
        \ name is a pun: the kanji include an antiquated Japanese word for pineapple,\
        \ referring to a lack of reply after asking something (the \"nashi\" for \"\
        pear\" sounds the same as \"nashi\" for \"nothing\"). In the VIZ manga, the\
        \ technique is called Phoenix Pyreapple., : An attack where Marco uses his\
        \ outstretched index and middle fingers to make a dense, flaming swirl of\
        \ phoenix feathers in front of him, remotely shaping it into a large fireball\
        \ that he, upon uttering the attack's name, launches straight toward an enemy\
        \ in a thrust-like, Marco used one of his cut-off wings as a medium to produce\
        \ the feathers, the fenghuang is said to bear various animal resemblances,\
        \ the attack is also called Bluebird., : A melee attack similar to Hoo-in,\
        \ with its four sharp talons doing slashing damage. This kick, proved strong\
        \ enough to send Queen the Plague flying with great force, while gashing his\
        \ face. Ongle is French for \"nail\". The attack's name may also (given the\
        \ kanji) play on how the fenghuang is said, per modern descriptions, to be\
        \ the composite of various birds, including having a crane's legs. The VIZ\
