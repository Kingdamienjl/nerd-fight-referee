        \ identified as \"Marco the Phoenix\". Using the power of his Devil Fruit,\
        \ Marco is capable of regenerating from virtually any attack like a phoenix\
        \ being reborn, : A defensive move that has Marco, in his phoenix form, he\
        \ forms a protective swirl of fire in front of him, out of his wings, in order\
        \ to block the attack in question. Being Marco's first-seen technique, Fujiazami\
        \ was used by him (but not named) when protecting Whitebeard from Kizaru during\
        \ the Summit War, protecting a bandaged-up Roronoa Zoro. The move's name is\
        \ a pun on, the name of the Japanese Fuji thistle. The Viz manga calls the\
        \ technique Undying Thistle., : While midair, Marco readies his phoenix talons\
        \ in front of him, then delivers an extremely forceful, two-legged kick to\
        \ a target. This move, was strong enough to knock back the Queen Mama Chanter,\
        \ an enormous ship. Later when used against Queen the Plague, making the All-Star\
        \ cough up blood and question if he had been hit by some shockwave. The technique's\
        \ name contains the Japanese name for the fenghuang (h\u014D\u014D), an immortal\
        \ bird originating in Chinese mythology that is often compared to the Western\
        \ phoenix, being sometimes called \"Chinese phoenix\" (despite mythological\
