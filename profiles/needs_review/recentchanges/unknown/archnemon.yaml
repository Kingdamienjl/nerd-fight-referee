    text: Varies among the species. KoDokugumon (In-Training) despite it's young stage
      has shown to be able to provide support to Dokugumon in battle. KoDokugumon
      (Rookie) attacks and hunts with other KoDokugumon, it can to make use of another
      Digimon's ability to produce more potent poison as shown when a swarm of them
      used poison from a Tropiamon to hunt prey and grow. Dokugumon is a fearsome
      fighter who relies on its potent poison to overwhelm opponents. Archnemon is
      an highly intelligent and extremely cunning Digimon, be it by commanding its
      Dokugumon to overwhelm opponents or by utilizing its human form to get their
