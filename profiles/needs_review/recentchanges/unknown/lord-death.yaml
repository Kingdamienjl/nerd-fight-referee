    a true Grim Reaper. {| class="mw-collapsible mw-collapsed" align="center" border="1"
    cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; |Notable Attacks/Techniques: |- | *: A technique in which a weapon amplies
    the a meister''s soul wavelength, generating and amplifying more power within
    an individual to create offensive or defensive techniques. *: A ability to see
    the souls of the living (and deceased). Death''s soul perception is unlike others,
    capable of seeing the good/evil quality of other beings. Grim Reaper Physiology:
    As a Grim Reaper, Death is naturally stronger and more resilient that a human.
    He is unaffected by most weather conditions like the sun''s UV Rays and immune
    to natural poisons. It can be assumed there are many more benefits, those of which
    that are unknown. While immortal, Death will cease to be at the moment that Kid''s
    full potential as his heir is realized as the consequence that there can only
    be one Grim Reaper in the world. *Konso: This ability allows Death to store souls
    and hold them for later use. *: Described as Death''s true power, this allows
    him to eclipse all human emotion and subject them to his own control. It can also
    counteract other forms of Madness such as Asura''s Madness of Fear. Hand-to-Hand
    Techniques: *Shinigami Chop: A attack used by Death in the form of a large karate
    chop with his gloves, in which can change their size. Shinigami Powers Attacks/Techniques:
    *: An attack that sends forth four claws from his body. The attack was also hinted
    to be the same attack capable of skinning an individual. *Death Block: A defensive
    technique that creates a large shield in the shape of his current mask. *Shinigami
    Shockwaves: A follow-up of Katsu, it releases a set of shock waves towards a opponent
    |} Note: This profile covers the Manga''s version of Lord Death. ==Notable Matchups==
