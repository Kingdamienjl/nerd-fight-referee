        easily demolishing scores of Pacifistas with her decades of experience in
        hand-to-hand combat and the use of her Devil Fruit's abilities. She is also
        one of the few people in the world able to use all three forms of Haki, allowing
        her to easily anticipate her foes' attacks and crush them with her superior
        technique. As such, even the highest echelons of the World Government, including
        the Admirals, are wary of her power and influence. Her prowess was proven
        during the Whitebeard War, where she was one of the only combatants to leave
        the battlefield completely unscathed, despite clashing with both the Whitebeard
        Pirates and the Marines during the conflict. However, her confidence in her
        beauty and strength has also made her rather arrogant, often looking down
