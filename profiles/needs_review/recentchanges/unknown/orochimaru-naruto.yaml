  intelligence:
    text: "Orochimaru's greatest specialty is arguably scientific research. In pursuit\
      \ of immortality, he developed the Living Corpse Reincarnation, a forbidden\
      \ technique capable of transferring his consciousness into another person's\
      \ body. By repeatedly replacing his physical vessel, Orochimaru created his\
      \ own method of extending his life and successfully performed the technique\
      \ on multiple hosts, while intending to eventually take Sasuke's body. His research\
      \ into J\u016Bgo's clan is another major example. Orochimaru investigated J\u016B\
      go's abnormal transformations and learned that they were connected to the natural\
      \ absorption of Natural Energy. His experiments on J\u016Bgo's body became the\
      \ basis of his Cursed Seals, allowing Orochimaru to reproduce aspects of J\u016B\
      go's transformation in unrelated individuals through his own artificial method.\
      \ By the New Era, Orochimaru's research had advanced to the point that he could\
      \ create synthetic human beings. Mitsuki and Log were artificially created by\
      \ Orochimaru while possessing functioning chakra systems, consciousness and\
      \ individual personalities. His research was not limited to isolated experiments.\
      \ Orochimaru spent decades gathering biological samples and studying people\
      \ with rare abilities, Kekkei Genkai and unusual mutations. Kabuto later built\
      \ directly upon this body of work, using Orochimaru's remains and collected\
      \ genetic material as the foundation for his own extensive biological modifications.\
      \ One of Orochimaru's greatest feats of sealing knowledge came after Hiruzen\
      \ used the Dead Demon Consuming Seal to seal away the use of his arms. Orochimaru\
      \ eventually discovered the technique's connection to the Uzumaki Clan and learned\
      \ how the sealed souls could be released. He infiltrated the Ch\u016Bnin Exams\
      \ through Otogakure, entered an alliance with Sunagakure, secretly killed the\
      \ Fourth Kazekage and impersonated him, allowing Orochimaru to direct the Sand's\
      \ participation in the invasion while posing as its leader. Outside of the invasion,\
      \ Orochimaru created Otogakure and maintained an organization built around his\
      \ ambitions. He operated through numerous bases and hideouts, keeping his research,\
      \ prisoners and subordinates distributed across multiple locations. Orochimaru's\
      \ plan involving Sasuke also unfolded over a long period. He marked Sasuke with\
      \ the Cursed Seal during the Ch\u016Bnin Exams, then later used the Sound Four\
      \ to exploit Sasuke's desire for greater power and entice him away from Konoha.\
      \ Sasuke ultimately left the village and spent the following timeskip training\
      \ under Orochimaru, bringing Orochimaru substantially closer to obtaining the\
      \ Sharingan-bearing vessel he wanted. When Orochimaru's current vessel began\
      \ deteriorating before Sasuke arrived, he immediately adjusted his plan and\
      \ transferred into Gen'y\u016Bmaru instead. This sacrificed his opportunity\
      \ to take Sasuke's body at that moment while ensuring his own survival and allowing\
      \ him to pursue Sasuke again later. With Sasuke, Orochimaru recognized that\
      \ Sasuke's desire for enough power to kill Itachi made him vulnerable to manipulation.\
      \ He placed the Cursed Seal on Sasuke and later had the Sound Four demonstrate\
      \ the seal's greater power and offer Sasuke the strength he believed Konoha\
      \ could no longer provide, contributing to Sasuke abandoning the village voluntarily.\
      \ |-|Combat"
    source_ids:
    - vsbattles-orochimaru-naruto-unknown
    confidence: 0.6
    notes: auto_repair source extraction
