  axis: weakness
  text: "Living Corpse Reincarnation can only be performed once every three years\
    \ and Orochimaru's pre-resurrection host bodies eventually begin rejecting him\
    \ and deteriorating. The Orochimaru-Style Body Replacement Technique also consumes\
    \ a considerable amount of chakra when used repeatedly. His confidence in his\
    \ own knowledge and abilities can lead him to underestimate opponents, most notably\
