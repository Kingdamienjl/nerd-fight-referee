        suicide due to his killing intent, and paralyzed Sakura from moving. His aura
        worked on Kakashi, who could resist Zabuza's aura, and made him envision his
        own death. Was able to scare Kabuto out of fighting him with his aura alone.
        His aura caused damage to the environment during his battle against Hiruzen),
        Resurrection (He can be revived any number of times through the Evil Releasing
        Method, provided there are enough cursed seals and DNA. However this requires
        outside help and is not useful in general combat), Possession (Able to transfer
        his soul to someone else's body, gaining all their abilities and powers),
        Soul Manipulation (He can use the Dead Demon Consuming Seal), Dimension Creation
