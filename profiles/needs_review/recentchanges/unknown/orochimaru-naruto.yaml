    - field: weaknesses
      value: "He can only perform his body-switching technique once every three years,\
        \ and needs a new host after this period. Extreme arrogance and pride, which\
        \ prevents him from fighting at his best as he overextends himself. Notable\
        \ Attacks/Techniques: Ninjutsu: Wishing to obtain all of the techniques in\
        \ the world, Orochimaru has a vast arsenal of techniques at his disposal,\
        \ ranging from simple offensive ones, which nonetheless become deadly when\
        \ performed by him, to higher ranking, more complicated ones. Even at a young\
        \ age, he was able to utilise his former master's signature Shuriken Shadow\
        \ Clone Technique. Orochimaru also exhibited mastery with the Transformation\
        \ Technique, as he was able to view Sasuke's battle with Yoroi Akad\u014D\
        \ during the Ch\u016Bnin Exams, undetected. He was also able to pose as the\
        \ Fourth Kazekage for weeks, fooling the entire village of Sunagakure, including\
        \ its elite shinobi and the ones closest to the dead Kazekage. When conducting\
        \ experiments, he is also capable of utilizing medical ninjutsu and would\
        \ make use of the chakra scalpel. In terms of defensive techniques, Orochimaru\
        \ uses both Summoning: Rash\u014Dmon and Summoning: Triple Rash\u014Dmon,\
        \ in which he summons a varying number of large demonic gates that are capable\
        \ of enduring even the most intense forms of damage. Orochimaru can also use\
        \ a technique to avoid injury, and another to temporarily paralyze an opponent.\
        \ Orochimaru's trademark trait is his affinity with snakes, in addition to\
        \ impacting the appearance and composition of his pure form, and granting\
        \ him the ability to extend his limbs to abnormal lengths and to take on snake-like\
        \ traits in battle, caused him to learn several snake-related skills, including\
        \ learning Sage Mode. His snake-related techniques have been referred to as\
        \ Power of the White Snake. One such ability is being able to summon giant\
        \ snakes to fight alongside him in battle, made possible by the summoning\
        \ contract tattooed on his arm. This allows him to summon snakes within his\
        \ vicinity, as opposed to having to place his hand on a surface. If need be,\
        \ Orochimaru can morph into a giant snake, despite being slightly smaller\
        \ in size to his larger ones. His signature summon was Manda, a colossal snake\
        \ which was described as the largest in the world, with immense fighting capabilities.\
        \ With Hidden Shadow Snake Hands, Orochimaru can instantly call forth snakes\
        \ from his sleeves and mouth to attack his opponents in large numbers with\
        \ venomous bites. A stronger variation of this technique was the Many Hidden\
        \ Shadow Snake Hands, in which the summoned snakes grow noticeably in both\
        \ numbers and size, as well as a variety wherein the snakes had sword blades\
        \ sticking out from their mouths."
