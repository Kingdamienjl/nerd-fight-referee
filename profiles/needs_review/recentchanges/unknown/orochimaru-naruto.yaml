        Control (Can stretch and lengthen parts of his body. Able to create snakes
        from inside of his body and use them to attack. Can "shed his skin" and create
        a new body for himself, allowing him to get rid of all previous damage inflicted
        on him), Necromancy (Capable of resurrecting the dead as near-immortal zombies
        under his control, however, he needs preparation for this, and it is not useful
