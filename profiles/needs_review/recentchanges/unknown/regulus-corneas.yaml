- id: claim-weaknesses-9e3cd725
  section: weaknesses
  axis: weakness
  text: "Continuous use of Lion's Heart can be deadly as his own heart stops when\
    \ using it; however, it can be circumvented by merging his heart with his wives\
    \ through Little King. Stopping all of his wives' hearts will make him unable\
    \ to use Lion's Heart for more than 5 seconds at a time without risking a heart\
    \ failure, and it becomes exceedingly difficult for him to use Lion's Heart on\
    \ things beyond his own body. Regulus relies a lot on Lion's Heart: he is an amateur\
    \ when it comes to fighting normally. Lion's Heart does not increase his reaction\
    \ speed, meaning he can only travel in straight lines if he is moving at extreme\
    \ superhuman speeds. Regulus has an insatiable need to assert himself, meaning\
    \ he won't kill an opponent until he has \"proven\" his superiority, although\
    \ he may still kill them as soon as he is able to if he flies into a blind rage.\
    \ Notable Attacks/Techniques: Authority of Greed: Regulus' Authority of Greed\
    \ can be divided into two abilities\u2014 his simultaneously offensive and defensive\
    \ time-stopping power: Lion's Heart, and his ability to share his heart to his\
    \ wives: Little King. *Lion's Heart: This ability allows Regulus to stop the time\
    \ of any object he is touching, be it dirt, sand, water, blood, humans, or himself,\
    \ cutting it off from the world's flow of time and turning it into a distortion\
    \ in space. Because the object's time is stopped, it ignores every law of the\
    \ world, and is liberated from all concepts. **Defensive use of Lion's Heart:\
    \ Regulus has Lion's Heart constantly active, keeping his time stopped. This temporal\
    \ freeze on his body grants him total invincibility while only allowing his body\
    \ to receive the force of attacks while remaining unharmed. However, he can consciously\
    \ decide to become unbound by every law and concept in the world to become totally\
    \ inviolable, and all objects that come into contact with him will be rejected\
    \ by his body and completely destroyed without a trace. The crux of Lion's Heart's\
    \ defense is that Regulus will not change; just as he wishes for total isolation\
    \ and refuses to change himself, Lion's Heart makes it impossible for outside\
    \ influences to change him on any level. Due to his body's nature of destroying\
    \ any object he touches, he must stop the time of whatever he is touching so as\
    \ to not destroy the object, including the ground under his feet (if gravity is\
    \ affecting him). The invincibility granted by Lion's Heart extends beyond just\
    \ making his body invulnerable, but also makes interacting with him in any form,\
    \ such as altering his senses, impossible. Even metaphysical interaction with\
    \ his mind or soul cannot be achieved. Lion's Heart's freeze of Regulus' bodily\
    \ functions means he no longer has any need to eat, drink, sleep, or breathe,\
    \ and he won't age or even sweat under its effects. The weakness of this seemingly\
    \ perfect defense is that Regulus can only stop his time for 5 seconds before\
    \ he must unfreeze it as he risks heart failure, but this can be circumvented\
    \ through his secondary ability: Little King. **Offensive use of Lion's Heart:\
    \ Regulus uses Lion's Heart on everyday objects such as dirt, sand, or pebbles,\
    \ in order to transform them into deadly projectiles that pierce any defenses.\
    \ Because an object under the effect of Lion's Heart cannot experience change\
    \ or outside influence, ignoring the laws of the world, it will pierce straight\
    \ through any object or person it comes into contact with: shredding buildings\
    \ and people alike, turning them into rubble, and red mist respectively. Essentially\
    \ anything can be imbued with Lion's Heart and used as a weapon by Regulus, even\
    \ air from waving his hand or his own breath can eviscerate anything it touches.\
    \ Regulus can even imbue people he touches with Lion's Heart in order to launch\
    \ them away with impossible momentum, incapable of being slowed, leaving cartoonish\
    \ person-shaped holes in whatever they pass through. As well as this, Regulus\
    \ is free to manipulate objects imbued with Lion's Heart to his heart's content\u2014\
    \ turning water into a floating cube or a rising pillar, and manipulating the\
    \ structure of buildings as if he's playing with a Rubik's Cube. The weakness\
    \ of this seemingly perfect offense is that stopping the time of and manipulating\
    \ objects outside of his own body is extremely difficult for Regulus to manage\
    \ consciously, but this can be circumvented through his secondary ability: Little\
    \ King. *Little King: This ability allows Regulus to merge a small pseudo-heart\
    \ into the heart of any woman he considered to be his wife, acting as a parasitic\
    \ organ. The woman's heartbeat would pump his smaller pseudo-heart even when Regulus'\
    \ actual heart was frozen in time, freeing him from the 5 second restriction of\
    \ Lion's Heart. Freed from this restriction, Regulus is able to remain in a permanent\
    \ state of invincibility as he has been for well over a century, and he can utilize\
    \ his many applications of Lion's Heart upon other objects without need for conscious\
    \ control, which makes using his Authority far eas"
