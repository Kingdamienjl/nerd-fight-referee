- id: claim-standard-equipment-ea03f9d9
  section: equipment
  axis: equipment
  text: '*The Gospel: A book of prophecies given to all members of the Witch Cult,
    it is a defective version of an incomplete copy of the Book of Wisdom. It is a
    guide to the owner''s desired future, but its contents are vague and subject to
    change, the instructions being up to interpretation. *The Little Kingdom: Regulus''
    harem of 53 women, all of whom were forced to marry him. Regulus'' wives have
    all had their spirits broken by Regulus, although they maintain a hidden hatred
    for him within their hearts. These women are Regulus'' lifeline, as Regulus can
    only freely use Lion''s Heart because he has his wives take his burden through
    Little King. Despite being his lifeline, he doesn''t hesitate to murder them when
    they displease him.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
