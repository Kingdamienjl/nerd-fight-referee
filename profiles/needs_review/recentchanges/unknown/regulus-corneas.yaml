    - field: powers_and_abilities
      value: Superhuman Physical Characteristics, Time Stop (Can stop the time of
        his body, anything he is wearing, touched, or even his breath), Spatial Manipulation
        (Can cut through space. Was stated to be a walking distortion in space), Invisibility
        (The attacks of Regulus are stated to be invisible), Immortality (Type 1),
        Physics Manipulation, Law Manipulation (Can give momentum to gravel, water,
        sand, etc., and make them pass through anything in their path, the water,
        gravel, sand, etc. will also keep flying endlessly unless Regulus removes
        the effect. Is able to ignore all the rules of the world, allowing him to
        do the impossible, like extracting enough liquid to fit a 25 yard pool), Aura,
        Fear Manipulation (The mere presence of Regulus causes those around him to
        feel unimaginable fear), Indomitable Will (Was still able to remain alive
        even after having every single bone in his bone destroyed, his inner organs
        badly damaged and his lower half being crushed, to the point that he was described
        as "a mass of meat that was vaguely human in shape", being driven by his hollow
        vanity to a terrifying level of attachment to life, if not a grudge against
        those who oppose his resolve to achieve his goal in life, which was to never
        be looked down or pitied by others), Self-Sustenance (Types 1, 2 and 3), Flight
        (Said to be able to just come right back after being thrown into space, can
        ignore every physical law in the world if he wishes), Danmaku (He can use
        multiple sand projectiles to attack his opponents with the use of his Authority.
        With this he even thought to turn all of Pristella into just a pile of corpses
        by destroying it. Able to release droplets of water that is frozen in time,
        which was described as carpet-bombing the City of Pristella), Body Control
        (Alters his body to apart from reversing the damage inflicted), Damage Manipulation
        (One of the functions of his authority allows him to turn everything he touches
        into a lethal weapon capable of destroying anything while in an unchanging
        state due to his heart), Invulnerability (By stopping time around either himself
        or anything he touches, Regulus can never experience any kind of outside changes),
        Durability Negation, Conceptual Manipulation (Type 1; Authorities ignore the
        concepts of the world and directly overpower Mana and Blessings. Regulus'
        authority makes him unbound by all concepts and those bound by concepts will
        not be able to harm him.) Acausality (Type 5; His authority lets him exist
        outside the flow of time, all laws and all concepts which includes cause and
        effect.) Madness Manipulation (Unaffected by Pandora's presence. Being in
        a Witches presence makes you go made and vomit normally), Law Manipulation
        (His authority lets him ignore all physical laws in the world), Conceptual
        Manipulation (Is unbound by all concepts and laws), Willpower Manipulation,
        Morality Manipulation (Due to the over-obsession with their sins, Sin Archbishops
        possess unimaginable, unrelenting ego that allows them to survive unimaginable
        injuries and pain, continuing their fight despite being in a near-death state),
        Mind Manipulation, Darkness Manipulation, Perception Manipulation (Shamak
        had no effect on him. Was safely interacting with Sirius, whose Authority
        of Wrath can brainwash others into becoming her pawns), Emotional Manipulation,
        Soul Manipulation, Damage Transferal, Fear Manipulation, Pain Manipulation
        (Was fine while interacting with an aggressive Sirius, whose Authority of
        Wrath can work on the soul itself, cause others in her vicinity to feel the
        fear of each other, manipulate the emotions of others just by her enemies
        hearing her voice, transfer physical and emotional damage to others around
        her and share the pain of either herself or others, with those around her,
        to the point that she can share even the death of herself or others around
        her), Magic, Fire Manipulation, Ice Manipulation, Water Manipulation, Earth
        Manipulation, Air Manipulation, Light Manipulation, Durability Negation, Petrification,
        Age Manipulation, Black Hole Generation, Gravity Manipulation, Time Manipulation,
        Existence Erasure, Spatial Manipulation, BFR, Status Effect Inducement, Power
        Nullification and Transmutation (Echidna stated that Authorities were created
        in the world before the existence of Divine Protections, where Divine Protections
        were created afterwards to "annoy Authority users", with the Authorities being
        stated to defy the concepts of the world, essentially Od Laguna, the creator
        of Divine Protections, where Divine Protections are even greater and superior
        to Magic, which in turn makes Authority users become unaffected by any kind
        of magic that is thrown at them. Due to the nature of his Authority, Regulus
