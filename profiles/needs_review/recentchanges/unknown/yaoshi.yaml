- id: claim-powers-and-abilities-004d01a7
  section: abilities
  axis: hax
  text: "*Aeon Physiology *Paths (Abundance; Can use all the powers and has all resistances\
    \ that their Pathstriders and Emanators obtained through the Path of Abundance,\
    \ as Yaoshi is the only entity capable of wielding their Path at full capacity\
    \ and without restriction) *Bodily Weaponry (Conventional) & Additional Limbs\
    \ (Yaoshi has sharp horns and six arms) *Life Manipulation, Healing, Purification\
    \ (Types 1 & 2), Matter Manipulation (Atomic), Soul Manipulation, Mind Manipulation,\
    \ Information Manipulation (Type 2; Yaoshi can grant immortality to the mortals\
    \ bodies and souls.Data Bank Factions: Denizens of Abundance \u2014 Abundance\
    \ A person's soul is regarded as their mind and is composed of fundamental information,\
    \ the latter that shapes reality and life as a line of code, being conceptual\
    \ in nature. Yaoshi can heal the body, mind, soul, atoms, fundamental information\
    \ and even galaxiesSimulated Universe World 5 Event) *Resurrection (Yaoshi has\
    \ the power to resurrectDemise of Immortality, Finale of Calamity) *Plant Manipulation\
    \ & Power Bestowal (With their own powers, Yaoshi created and planted the Ambrosial\
    \ Arbor on Xianzhou Luofu, which is an ancient giant tree that harbors fruits\
    \ that grants Eternal Life along with other abilities and resistancesMyriad Celestia\
    \ Trailer: History of the Xianzhou: Seven Arbiter-Generals | Honkai: Star RailWood\
    \ Sprouts Anew, Fate Tilts Askew) *Passive Biological Manipulation (1 Layer) &\
    \ Madness Manipulation (Types 1 & 3; Coming into contact with Yaoshi will instantly\
    \ cause Mara-Struck,Desolate Depths of Despair and even trying to foresee the\
    \ fate of Yaoshi will cause the diviner to become Mara-Struck.Glimpses into the\
    \ Beyond, \"Inquiry Into The Gods: The Authors of Calamity\", Plagues Author Those\
    \ who were Mara-Strucked will lose their human form and mutate into a humanoid\
    \ monster,Data Bank: Enemy Creatures - Mara-Struck Soldier succumbing into an\
    \ uncontrollable bloodlust and madness,Dan Shu's Diary (II)Disciples of Sanctus\
    \ Medicus: Collection of Exhibits displaying violent tendenciesClouds Leave No\
    \ Trace and attacking anyone indiscriminately. Yaoshi can affect people who can\
    \ resist the effects of the Fragmentum, such as the Trailblazer)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
