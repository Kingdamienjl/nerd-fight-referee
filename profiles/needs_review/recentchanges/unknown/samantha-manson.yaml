- id: claim-powers-and-abilities-87db08bc
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics (Superior to humans like Tucker, who
    can kick doors off their hinges with a single strikeDanny Phantom; Season 1; Episode
    3; One of a Kind, and is comparable to other humans, who can survive being thrown
    across a room through a table and into a wall without any harm and get back upDanny
    Phantom; Season 1; Episode 7; Bitter Reunions) * Empowerment (Humans possess the
    same emotional energy as the humans from the past, this energy is shown capable
    of empowering an individual and is described as the ultimate power in the universeDanny
    Phantom A Glitch in Time) * Weapon Mastery, Marksmanship and Vehicular Mastery
    (Shown throughout the series to be capable of using and operating the various
    gadgets, weapons, and vehicles of Fenton Works) Resistances *Ectoplasmic Energy
    (Can resist the natural effects of ectoplasmic energy, as she''s survive being
    hit by ectoplasmic energy attacksDanny Phantom; Season 1; Episode 20; Control
    Freaks) **Biological Manipulation (Molecular level - Ectoplasmic energy affects
    the body on a molecular level, overriding their DNA, and can result in altering
    the body''s physical appearance, increasing muscle mass and or breaking down the
    body into energy while leaving only a part of itDanny Phantom; Season 2; Episode
    2; Doctor''s Disorders) **Disease Manipulation (Ectoplasmic energy causes sickness
    such as Ecto Acne, which is fatal to the victimDanny Phantom; Season 2; Episode
    16; Masters of All Time. Was shown visually fine despite being infected by the
    ghost mosquito bit which made majority of the other students visibly illDanny
    Phantom; Season 2; Episode 2; Doctor''s Disorders) **Possession, Mind Manipulation,
    Empathic Manipulation, and Corruption (Type 1) (Ectoplasmic energy can take over
    the body, taking over the victims mind and corrupting them, making them monstrous
    and ghost likeDanny Phantom Fair Game, in the same manner a when they''re OvershadowedDanny
    Phantom; Season 1; Episode 6; What You Want) * Heat (Could touch the Reality Gems
    without issue, which give off enough heat to burn a kid''s handDanny Phantom;
    Season 2; Episode 19 - 20; Reality Trip) Has access to all the gadgets and weapons
    of Fenton Works up to season 3 only. Below are is a list of equipment Sam herself
    has specifically used and the powers and abilities they grant. * Non-Physical
    Interaction (Spirits / Abstract Emotions - Many of the gadgets and weapons at
    Fenton Works are capable of interacting with ghosts and causing them actual harm)
    * Power Nullification (The Fenton Phones are earphones that are primarily used
    for communication but naturally filter out spectral noise, protecting the wearer
    from sound based ghost attacksDanny Phantom; Season 1; Episode 11; Fanning the
    Flames. The Specter Deflector is a belt that was made from parts of an anti-ghost
    shield. It repels and weakens ghosts that come into contact with it or the wearer,
    nullifying their powersDanny Phantom; Season 1; Episode 17; Maternal Instincts)
    * Purification (Type 2 - The Fenton Foamer is a two handed blaster that fires
    green foam that can "clean" ectoplasm, visually purifying objects that have been
    transformed and infected by ectoplasmic energyDanny Phantom; Season 1; Episode
    13; Fright Knight) * Electricity Generation (The Jack-o''-Ninetails is device
    that fires cables that electrocutes and continuously squeezes the target until
    they explode) * Extrasensory Perception (The Booo-merang is a device that can
    home in on a ghosts unique energy signature and seek it out wherever it goesDanny
    Phantom; Season 2; Episode 8 - 9; The Ultimate Enemy) * Sealing (The Fenton Thermos
    can seal ghostsDanny Phantom; Season 1; Episode 1; Mystery Meat) * Energy Projection,
    Matter Manipulation (Atomic) and Durability Negation (The Fenton Peeler fires
    a beam of energy that rips ghosts apart atom by atomDanny Phantom; Season 1; Episode
    9; My Brother''s Keeper) * Energy Projection (Utilizes variousDanny Phantom; Season
    3; Episode 8; Boxed Up Fury energy weaponsDanny Phantom; Season 3; Episode 10;
    Claw of the Wild) All previous powers and abilities * Acausality (Type 1) and
    Resistance to Time Manipulation (Clockwork''s medallions protect the user from
    time related abilities and the rules of timeDanny Phantom A Glitch in Time) Has
    access to all the gadgets and weapons of Fenton Works up to season 3 only. Below
    is a list of new equipment Sam herself has specificly used in A Glitch in Time
    and the powers and abilities they grant. * Forcefield Creation (Fenton Works wristbands
    can create shields strong enough to block beams that can harm an amplified Danny
    PhantomDanny Phantom Fair Game All previous powers and abilities up to season
    3 * Plant Manipulation (Is empowered by Undergrowth, giving her control over his
    plantsDanny Phantom; Season 3; Episode 6; Urban Jungle)'
  source_ids: *id003
  decisive: true
