      Invaders 31) | Low Multiverse level (Could keep up with RazenoidBakugan Mechtanium
      Surge 21) | Low Multiverse level (Evolved from Titanium Dragonoid to Fusion
      Dragonoid and became much stronger than before. Can easily defeat Razenoid,
      who is powerful enough to destroy the 12 Universes.Bakugan Mechtanium Surge
      2612 Universes Can fight powerful Nonets like Betadron. Can defeat ReptakBakugan
      Mechtanium Surge 46 ) | Low Multiverse level (Merged with Reptak and became
