        fight. Has all the abilities of Neo Dragonoid: *Bakugan Physiology (Pyrus,
        Ventus, Subterra, Aquos, Haos, Darkus) *Statistics Amplification (Diano Cocos
        X is always stronger than his opponent with his ability. Unless the opponent
        cancels this ability) *Energy Absorption (Absorbs the power of ApollonirBakugan
        New Vestroia 18) *Invulnerability to Elemental Attacks, Darkness Manipulation
        and Light Manipulation with Neo Legend X, although it can only be activated
        if Vestroia X has been activated as wellBakugan New Vestroia 18) *Transformation
