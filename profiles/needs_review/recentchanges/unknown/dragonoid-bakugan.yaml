- id: claim-powers-and-abilities-75e43fb9
  section: abilities
  axis: hax
  text: 'All previous powers. Drago sacrifices himself and gives up his body. He now
    becomes the Spirit of the Perfect Core located at the center of Vestroia. While
    in this form he can see everything that happens in Vestroia but cannot fight.
