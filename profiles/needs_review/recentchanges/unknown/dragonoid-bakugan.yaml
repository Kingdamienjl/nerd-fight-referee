    - field: powers_and_abilities
      value: 'All previous powers. Drago sacrifices himself and gives up his body.
        He now becomes the Spirit of the Perfect Core located at the center of Vestroia.
        While in this form he can see everything that happens in Vestroia but cannot
        fight. Has all the abilities of Neo Dragonoid: *Bakugan Physiology (Pyrus,
        Ventus, Subterra, Aquos, Haos, Darkus) *Statistics Amplification (Diano Cocos
        X is always stronger than his opponent with his ability. Unless the opponent
        cancels this ability) *Energy Absorption (Absorbs the power of ApollonirBakugan
        New Vestroia 18) *Invulnerability to Elemental Attacks, Darkness Manipulation
        and Light Manipulation with Neo Legend X, although it can only be activated
        if Vestroia X has been activated as wellBakugan New Vestroia 18) *Transformation
        (Can transform into a stronger form with Chaos Ability XBakugan New Vestroia
        18) It is no longer a problem for Vestroia to use the full power of the Infinity
        Core. Can use all hax in Infinty Dragonoid form. Since he received Apollonir''s
        power and DNA, he can use his abilitiesBakugan Wiki and Bakugan New Vestroia
        27: *Bakugan Physiology (Pyrus, Ventus, Subterra, Aquos, Haos, Darkus) Resistance
        to: *Petrification (Like Apollonir, Drago should not be affected by the negative
        properties of the Doom Dimension, such as petrification) All previous powers.
        He absorbed the power from the BT System, which contained the power and DNABakugan
        New Vestroia 42 of the Six Ancient Warriors (Apollonir, Exedra, Frosch, Oberus,
        Lars Lion, and Clayf). It was stated that Helix Dragonoid has the DNA of Ancient
        Warriors.Bakugan Wiki Must be able to use their abilities. *Regeneration Negation
        (Galactic Dragon ability negates Helios'' regenerationBakugan New Vestroia
        44) Battle Gear Physiology (JetKor ) *Paralysis Inducement & Energy Projection
        (With his Battle Gear JetKor, he immobilizes his opponents'' movements. Then,
        he hits them with a wave of energyBakugan New Vestroia 45) Resistance to:
        *Existence Erasure (It is said that BT System will wipe out all Bakugan in
        a 6000 kilometer area. Despite this, Drago was not erased from existence by
        BT SystemBakugan New Vestroia 27Bakugan New Vestroia 42) All previous abilities.
        Drago took the Element from Neo.Bakugan Gundalian Invaders 12 He must have
        the haxes that Neo has thanks to the Element. *Battle Gear Physiology (Explosix
        Gear) *Mobil Assault Physiology (Raytheus) All previous abilities. *Battle
        Gear Physiology (Axator Gear) *Mobil Assault Physiology (Jakalier) All previous
        abilities plus: *Afterimage Creation (via Dragon SpurBakugan Mechtanium Surge
        27) *Summoning (Can summon his own Mechtogan, Dragonoid DestroyerBakugan Mechtanium
        Surge 27) }}'
