  attack_potency:
    text: 'Galaxy level (It is the strongest Bakugan type, Dragonoid. Therefore, it
      should be above lower-level Bakugan such as Saurus, Mantris, and Juggernoid.
      It is the same type as Naga, and since Naga is a White Being, it is even weaker
      than Base DragonoidBakugan: Ultimate Handbook12.2759486386 ZettaFoe) | Low Multiverse
      level (Capable of fighting and defeating ApollonirBakugan Battle Brawlers 33)
      | Low Multiverse level (Barely defeated Alpha Hydranoid, who could take on and
      kill Naga''s Royal guards, who were capable of hurting Infinity DragoBakugan
      Battle Brawlers 38) | Low Multiverse level (He gained the upper hand over Silent
      Naga. When Hal-G realized that Naga could not defeat Drago, he called the Paladins
      to battleBakugan Battle Brawlers 51) | Low Multiverse level (Far stronger than
      Infinity Drago, stopped two universes from collapsing in on each other with
      minimal effort and united the 6 universes to form New VestroiaBakugan Battle
      Brawlers 526 Universes) | Low Multiverse level (Was stated to rival the power
      of the Perfect Core itselfBakugan New Vestroia 26) | Low Multiverse level (With
      the power of the Forbidden Card, he became stronger than his Neo Dragonoid form.
      He was able to fight Apollonir, and Exedra called his power "impossible"Bakugan
      New Vestroia 18) | Low Multiverse level (Fought evenly with Maxus Helios, who
      was able to shrug off Neo Drago''s attacks like they were nothing) | Low Multiverse
      level (Managed to defeat Maxus Helios MK2 on his ownBakugan New Vestroia 31)
      | Low Multiverse level (Managed to fight evenly with Maxus Helios MK2 who was
      stronger than before) | Low Multiverse level (Could fight Helios MK2 when Helios
      was using the Twin Destructor Battle Gear, is more powerful than beforeBakugan
      New Vestroia 44) | Low Multiverse level (Superior to his previous form, took
      on Dragonoid ColossusBakugan Gundalian Invaders 29) | Low Multiverse level (Superior
