- id: claim-weaknesses-8cde2764
  section: weaknesses
  axis: weakness
  text: 'He cannot fight while in his Perfect Core form. He is hesitant to use the
    power of the infinity core while in Neo Dragonoid form. If he uses the power of
    the Infinity Core, New Vestroia will suffer. At the same time, his body cannot
    handle the full power of the Infinity Core. As of the Cross Dragonoid form, all
    of these problems disappear. While in the Vexos Dragonoid forum, he could not
    control himself and was about to die due to excessive power. He has trouble controlling
    his power while in his Titanium Dragonoid form. However, this solves the problem
    later. He has no significant weaknesses while in his Fusion Dragonoid and Aeroblitz
    Dragonoid forms. Notable Attacks/Techniques: ==Notable Matchups== Victories: Losses:
    Inconclusive: ==References== ==Notes== Category:Bakugan Category:Anime Characters
