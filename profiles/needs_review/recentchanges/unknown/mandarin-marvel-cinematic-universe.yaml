  attack_potency:
    text: "Small Building level in Base (Superior to his children Shang-Chi and Xialing,\
      \ who were viewed as greater than several fighters such as a former Black Widow,\
      \ who would be comparable to Natasha Romanoff. Easily defeated Shang-Chi their\
      \ first fight while holding back and evenly matched him during their second\
      \ fight), higher (Destroyed a large castle entrance. Broke Shang-Chi's staff\
      \ and launched him into a lake. Caused a large shockwave while hitting Shang-Chi.\
      \ Managed to damage the barrier holding back the Dweller In Darkness), up to\
      \ Brown Dwarf level with the Ten Rings (The Ten Rings are said to be the stronger\
      \ than anything in the Universe upscaling Mj\xF6lnir and other weapons, grant\
      \ Wenwu the Strength of Gods, reiterated in the Artbook and Confirmed by Heimdall.\
      \ The Film's Producer claims that if his Son used the Ten Rings and fought Hulk\
      \ or Thor, it could go either way), possibly Small Star level to Solar System\
      \ level (Should be comparable to his Variant from What If, who can keep up with\
      \ Hela and Prime Odin. Can ground Prime Odin with a Single Punch, leaving him\
      \ on the ground panting)"
