- id: claim-powers-and-abilities-cf47ae8b
  section: abilities
  axis: hax
  text: "Due to Sealing the Yin half of Kurama into him before he died, Minato has\
    \ access to the Yin half of Kurama's power. Thus his speed, strength, and durability\
    \ increase to incredible levels. *: The first form Minato displayed. It seems\
    \ to be a mix between Naruto's humanoid Tailed Beast Mode and his Nine-Tails Chakra\
    \ Mode, and thus enables him to fully transform into Kurama. *: After Naruto managed\
    \ to convince Yin Kurama to make his presence known, Kurama granted Minato the\
    \ ability to fully transform into a darker shaded version of Naruto's full Tailed\
    \ Beast Form. In this form, he can use gigantic Rasengans and can even do the\
    \ Tailed Beast Bomb alongside Naruto. **: A ratio of black and white chakra at\
    \ a factor of 8:2. When stabilized, the Tailed Beast Bomb can be launched as a\
    \ ball of chakra with explosive force. minato Blazing - Narucole.jpg|Minato Blazing\
