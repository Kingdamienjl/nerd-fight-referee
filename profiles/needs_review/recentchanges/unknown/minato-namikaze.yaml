        \ average age being 12.T\u014D no ShoItachi Shinden: Book of Bright Light;\
        \ Chapter 1, Page 57 Even as a Genin, Minato's intellect and talent allowed\
        \ him to rise above even the best Konoha soldiers, and become an international\
        \ legend[Minato Column 1] Yellow Flash of Konoha: Tales of Minato Namikaze's\
        \ Valor at the same time most ninja were learning the basics. When the villages\
        \ Jinchuriki, Kushina was kidnapped by highly skilled Kumogakure ninja who\
        \ were able to easily infiltrate the village and capture her. Konoha immediately\
        \ sent multiple search parties looking for her, but even experienced Jonin\
        \ search parties were unable to track her, but Minato, as a mere Genin was\
        \ able to pick up on the trail she left and defeat her captors.Naruto, Chapter\
        \ 498: \"My Ma's Red Hair\" When it was time take the Chunin Exams, Minato's\
        \ intelligence once again left a mark, when he earned the highest written\
        \ exam score in the history of Konohagakure. Even other geniuses who succeeded\
        \ him, like Itachi Uchiha, and Shikamaru Nara failed to overtake this score.Itachi\
        \ Shinden: Book of Bright Light; Chapter 3, Page 121 This test included Kinematics,\
        \ Trigonometry, and other topics too advanced for his age group.Naruto, Chapter\
