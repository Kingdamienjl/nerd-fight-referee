    - field: weaknesses
      value: "He hasn't fully mastered the sage arts, as it takes too long for him\
        \ to build up natural chakra, and he has a severely limited amount of time\
        \ with it. Notable Attacks/Techniques: * Rasengan: A sphere of chakra energy\
        \ that can create a massive explosion and damage the inside of a target. Needs\
        \ to be within melee range to use it. Minato invented this technique after\
        \ he studied how Bijuudama works. * Kuchiyose no Jutsu (Summoning Technique):\
        \ It is a space-time ninjutsu that allows the summoner to gather animals or\
        \ people across long distances instantly. Minato can summon frogs, such as\
        \ Gamabunta. ** Hiraishin no Jutsu (Flying Thunder God Technique): A teleportation\
        \ technique created by Minato Namikaze. To activate this technique, the user\
        \ needs a special seal to mark the destination. After this is done, the user\
        \ enters a dimensional void that instantaneously transports themselves to\
        \ the location of the seal. Minato applied the formula in advance to weapons\
        \ such as distinctive kunai, and can also apply the mark to a touched area,\
        \ such as his opponent (The seal never disappears) or some other surrounding\
        \ feature. Minato can also use this technique to teleport other objects (warped\
        \ the Juubi's bijuu bomb without problems), though the size of the object\
        \ determines the amount of chakra required. ** Jikukan Kekkei (Space-Time\
        \ Barrier): Using a kunai with a Hiraishin seal, Minato can form a barrier\
        \ that will teleport away incoming attacks directed at it to another Hiraishin\
        \ seal at his choosing (basically the same as Hiraishin, only applied to something\
        \ other than himself). He can divert away attacks as powerful as a Biju Bomb\
        \ from Kurama. * F\u016Binjutsu (Sealing Techniques): A type of jutsu that\
        \ seal objects, living beings, chakra, along with a wide variety of other\
        \ things within another object. ** Shiki F\u016Bjin (Sealing Jutsu: Reaper\
        \ Death Seal): A seal which invokes the power of the \"death god.\" Once called\
        \ upon, the death god hovers behind the user and wraps its left arm with prayer\
        \ beads, which causes a seal to appear on it. The death god's arm extends\
        \ from their chest and grabs the soul of the target, immobilizing them, at\
        \ which time the victim can see the death god as well. At the user's command,\
        \ the death god then performs the sealing, consuming the souls of the user\
        \ and the sealed, sentencing them to be locked in combat within its stomach\
        \ for all eternity. ** Four Symbols Seal: The sealing formula is carved into\
        \ a human body or an object, and is mainly used when a giant enemy or evil\
        \ spirit needs to be sealed. To use it, the user must have remarkable natural\
