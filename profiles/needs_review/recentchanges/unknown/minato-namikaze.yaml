- id: claim-weaknesses-c38990e1
  section: weaknesses
  axis: weakness
  text: 'Standard Tactics == {| class="mw-collapsible mw-collapsed" align="center"
    border="1" cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; " |Notable Attacks/Techniques: |- | * A sphere of chakra energy that can
    create a massive explosion and damage the inside of a target. Needs to be within
    melee range to use it. Minato invented this technique after he studied how the
    Tailed Beast Bomb works. *: It is a space-time Ninjutsu that allows the summoner
    to gather animals or people across long distances instantly. Minato can summon
    frogs, such as Gamabunta. **: A teleportation technique created by Tobirama Senju.
    To activate this technique, the user needs a special seal to mark the destination.
    After this is done, the user enters a dimensional void that instantaneously transports
    themselves to the location of the seal. Minato applied the formula in advance
    to weapons such as distinctive kunai, and can also apply the mark to a touched
    area, such as his opponent (The seal never disappears) or some other surrounding
    feature. Minato can also use this technique to teleport other objects (warped
    the Ten-Tails''s Tailed Bast Bomb without problems), though the size of the object
    determines the amount of chakra required. **: Using a kunai with a Flying Raijin
    seal, Minato can form a barrier that will teleport away incoming attacks directed
    at it to another Flying raijin seal at his choosing (basically the same as Flying
    Raijin, only applied to something other than himself). He can divert away attacks
    as powerful as a Tailed Beast Bomb from Kurama. *: A type of Jutsu that seals
    objects, living beings, chakra, along with a wide variety of other things within
    another object. **: A seal that invokes the power of the "death god". Once called
    upon, the death god hovers behind the user and wraps its left arm with prayer
    beads, which causes a seal to appear on it. The death god''s arm extends from
    their chest and grabs the soul of the target, immobilizing them, at which time
    the victim can see the death god as well. At the user''s command, the death god
    then performs the Sealing, consuming the souls of the user and the sealed, sentencing
    them to be locked in combat within its stomach for all eternity. ** The Sealing
    formula is carved into a human body or an object, and is mainly used when a giant
    enemy or evil spirit needs to be sealed. To use it, the user must have remarkable
    natural skills. **Contract Seal: When the user implements this technique on a
    summoner, it removes any direct control the summoner has over a summoned creature.
    *: A high-speed movement technique, accomplished by using chakra to temporarily
    vitalize the body and move in a short burst of enhanced speed. *Chakra Transfer
    Jutsu: Can transfer his chakra to other people, or people close to him. Jinchuriki
    Forms/'
