    - field: weaknesses
      value: "*Standard Someinine Weaknesses *Too much time in her standard battle\
        \ gear stiffens her shoulders and muscles, although she hasn't often mentioned\
        \ it in the middle of a battle *If all of her limbs are completely restrained,\
        \ she is unable to harness Aiki properly and may resort to randomly thrashing.\
        \ Although from the Momo saga onwards, this does not seem to be an issue,\
        \ as she can generate Aiki just by twisting her wrist *As strong as she is,\
        \ her tiny frame means that anyone strong enough to parry her blows can force\
        \ her back easily because of her lack of body weight. *She's bad with anything\
        \ electronic, to the point where a keyboard is too complex for her to use.\
        \ *When she gets too emotional or gets frustrated, she tends to resort to\
        \ brute force to solve the problem in front of her. *She is terrified of scary\
        \ things such as ghosts, needing an entire day to calm down and even wetting\
        \ herself one time on a mission to a haunted house. *Futaba\u2019s ability\
        \ lets her to manipulate flow, so Kyoichiro stated the best way to counter\
        \ that is with another opposing flow of similar magnitude *[https://imgur.com/a/AqjeZSu\
        \ If Futaba infuses her Aiki into an object. You can undo the infusion by\
        \ copying her Aikido techniques in reverse, in a process compared to unlocking\
        \ an object] {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"\
        1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"\
        2\" style=\"text-align: left; |Notable Attacks/Techniques: |- | |-|Blooming=\
        \ {{Nihongo|Blooming||Kaika}} is an ability created when the Someinine in\
        \ the Yozakura's blood strengthens the body to its limits, becoming a trump\
        \ card for those given the Yozakura Blood. With each ability being unique\
        \ to the user's personality. For Futaba, this ability is called Magnanimity.\
        \ *{{Nihongo|Magnanimity||H\u014Dy\u014D}}: Futaba's kinetic vision is heightened\
        \ to the max which when combined with her nimble fingers allow her to engulf\
        \ and neutralize attacks by absorbing them. Futaba-Magnan.png|Futaba absorbing\
        \ Akai's fire blast Post-TSFutabaMagnan.png|Futaba neutralizing Hifumi's Infinity\
        \ Futaba-Purify.png|Futaba purifying poison gas *Rejection: Her True Spring\
        \ Blooming Ability, which allows her Aiki to \"reject\" all forces that attempt\
        \ to interact with it. Negating it, Futaba has used this to cancel out the\
        \ force of the Meteor Asa tried to drop on Teiou Academy, and to nullify the\
        \ force of gravity with her Aiki balls |-|Technique(s)= *Dragon's Flower Breath\
        \ - Upon closing up to her target, she emits all her strength into one spot\
        \ resulting huge whirlwind. *{{Nihongo|Cherry Blossom Drain|\u3057|Sakura\
        \ Nagashi}}: Futaba crates a whirlwind using a snap of her fingers, the whirlwind\
        \ is massive and shaped like a cherry blossom *{{Nihongo|Sleeping Dragon||Nemuryu}}:\
        \ Futaba stirs 'Aiki' flow into tea, and when that tea has any motions or\
        \ tremors caused to it, that will unleash the Aiki, causing a strong whirlwind\
        \ to send people flying. *{{Nihongo|Sinking Wind||Jinpu}}: First seen by just\
        \ by using the tap of a cup, Futaba creates a force able to bring all those\
        \ around her to the ground. Futaba can do any downwards motion to activate\
        \ the technique, causing a considerable amount of downwards force in the area.\
        \ *{{Nihongo|First Gale of Spring||Haruichiban}}: Futaba collects up wind\
        \ with her Aiki to create a blast 360\xB0 around her, throwing all the objects\
        \ in a circle around her. *{{Nihongo|Benevolent Kings||Ni\u014D}}: Futaba\
        \ creates a large about of wind with her Aiki, creating to large fists made\
        \ out of wind. Futaba is able to control these large fists, and can move them\
        \ in any way she likes using her arms as the wind mimics her movements and\
