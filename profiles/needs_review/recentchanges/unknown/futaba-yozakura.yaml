        \ **{{Nihongo|Super Spinning Air Noogie|\u3053\u3081\u304B\u307F\u30B0\u30EA\
        \u30B0\u30EA\u30A8\u30A2|Komekami Guriguriea Genkotsu}}: A burst of wind which\
