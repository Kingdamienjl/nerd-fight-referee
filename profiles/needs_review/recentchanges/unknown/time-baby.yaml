    otherwise have already enough power to destroy all the Multiversal Timelines,
    when in the show he was instantly destroyed by Bill after the latter got empowered
    from the Weirdmageddon, with Bill describing himself as being infinitely stronger
    than before, despite the Weirdmageddon affecting only a Multiversal Timeline,
    other than being matched by the Shacktron, which was merely empowered by a portal
    with enough power to shake a single Nightmare Realm, thus causing a contradiction
    in the overall plot of Gravity Falls.'
