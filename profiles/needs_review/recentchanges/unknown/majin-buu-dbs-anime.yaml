- id: claim-weaknesses-9dff31ac
  section: weaknesses
  axis: weakness
  text: 'Majin Buu''s energy can be worn out if he fights another Buu or a copy of
    himself. In addition, if he battles stronger opponents, he may also become psychologically
    weakened over time. Buu is fairly unintelligent and prone to fooling around during
    fights, often taunting and mocking his opponents rather than going all out and
    defeating them immediately. He has a short temper and is easily angered. Buu is
    also influenced by the personalities of those he absorbs; as he absorbs more heroic
    individuals, he becomes less villainous and more good-natured. Furthermore, Buu
    is not immune to his own magic, as shown when Evil Buu reflected his transfiguration
    beam back at him, turning him into chocolate as well. {| class="mw-collapsible
