- id: claim-weaknesses-3bada96a
  section: weaknesses
  axis: weakness
  text: Standard Devil Fruit weaknesses. When the flames on his back are lowered,
    his durability decreases in return for his speed increase. Rather arrogant, albeit
    not to a crippling extent. If his face is revealed, he will slightly lose control
    and attack everything around him. When he uses Omori Karyudon, he has to temporarily
    drop the flames on his back, leaving him momentarily vulnerable should someone
    get past his attack. His Hybrid form and Imperial Pride Stake also apparently
    force him to drop the flames on his back, although even without Lunarian flames
    his Zoan form is still incredibly durable.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-d03a80e0
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Large Size (Type 0 in Base Form -
    6.13 m; Type 1 in Zoan form) * Weapon Mastery (Given his occupation he should
    be an extremely skilled swordsman) * Skilled Hand-to-Hand Combatant * Flight *
    Fire Manipulation (King is constantly surrounded by a flaming aura) * Adaptation
    (As a Lunarian his race is capable of surviving in any natural environment) *
    Haki (Intermediate Kenbunshoku, Intermediate Busoshoku) * Transformation and Natural
    Weaponry (Into a pteranodon/human hybrid and a full pteranodon) * Regeneration
    (Mid-Low) * Weapon Control and Cloth Manipulation (His Katana''s blade can change
    shape and his suit has retractable spikes) * Acrobatics (Self-Momentum) * Air
    Manipulation and Danmaku (Produced dozens of ranged slashes, composed of highly
    pressurized air that attacked everyone around him indiscriminately) * Body Control
    and Minor Elasticity (With Imperial Deep Pride Stake) * Self-Destruction (Is able
    to trigger massive explosions from his body by having his stomach area pierced
    by a blade, however he himself is unharmed) * Statistics Amplification (When he
    deactivates the flames on his back his physical speed increases however his durability
    decreases) * Explosion Manipulation (His Imperial Flaming Wings attacks explode
    on impact) Resistance to * Fire Manipulation and Heat Manipulation (Can resist
    his own fire and it''s heat) * Animal Manipulation (Zoans are immune to Tama''s
    Kibi Dangos) * Madness Manipulation, Mind Manipulation and Soul Manipulation via
    Willpower (Through sheer willpower they can resist losing their mind when absorbing
    shadows through the Kage Kage no Mi. Shadows belonging to strong willed people
    are difficult to control, allowing them to rebel against Moria''s pact which usually
    immediately submits a shadow to his supremacy and orders. Spiritual energy is
    contained within one''s soul/life; this energy is represented by the fighting
    power or the Haki itself. Those with strong souls, which are homologous to shadows,
    resist the effects of Brook''s soul manipulation)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
