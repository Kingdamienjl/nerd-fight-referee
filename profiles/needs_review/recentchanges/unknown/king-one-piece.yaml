        generally smart decisions under pressure, such as directly intervening to
        prevent the Big Mom Pirates from entering Wano without being ordered to do
        so. He has also fully mastered his Pteranodon Devil Fruit. He is also skilled
        in combat, as he was able to go toe-to-toe with the swordsman Roronoa Zoro
        and, in the past, easily bested Raizo of the Nine Scabbards in combat. Is
        also a skilled battlefield commander, as he was able to coordinate the Beast
        Pirates while fighting Marco, and in the past assisted Kaido in his conquest
        of Wano)
