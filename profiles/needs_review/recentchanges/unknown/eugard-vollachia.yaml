- id: claim-standard-equipment-037867aa
  section: equipment
  axis: equipment
  text: "*Yang Sword Vollachia: An enchanted sword used by the members of the Imperial\
    \ Family of Vollachia. It is an ornate crimson sword with light that shines like\
    \ the sun. The sword appears out of thin air when the user wishes to use it and\
    \ it cuts and burns whatever the user desires, even the souls of their targets.\
    \ *Murasame, The Fiend Sword: An enchanted blade with a long and storied history,\
    \ which specializes in cutting the concept of anything's \"Point\"\u2014 the very\
    \ essence of an object, phenomenon, or concept\u2014 which can be used to erase\
    \ Curses, break Contracts, nullify attacks, sever Magic, and it even cut the \"\
    Point\" of its own scent. Wielding Murasame requires compensation that can leave\
    \ even the greatest of warriors feeling drained, and most people attempting to\
    \ grasp it would outright perish. This sword is capable of cutting the very world\
    \ itself. As an enchanted blade, it requires blood to satisfy it's hunger for\
    \ violence, and must be used as a killing tool fairly often. It emits bloodlust\
    \ even while sheathed."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
