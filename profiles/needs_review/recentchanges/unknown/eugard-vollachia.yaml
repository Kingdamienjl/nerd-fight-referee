        \ it was in Wilhelm's veins, he can create pikes from the blood at any time\
        \ or in any location. He is bale to form them under his feet to increase is\
        \ jumping ability, or fire them off as powerful projectiles. His stakes can\
        \ drain the \"life-force\" of whatever they hit. This includes blood and even\
        \ their soul. It even works on non-living things, to exist as the immortal\
        \ bloodsucker in eternal darkness. When activated, it changes the area around\
        \ Wilhelm into night, much like a vampire. This Bri'ah changes the area within\
        \ a 500 meter radius around Wilhelm into night, causing them to slowly weaken,\
        \ decay and die. If he focus on a target, he can increase the Bri'ah's effectiveness,\
        \ inhibiting the target's senses. He then takes the stolen energy as his own\
        \ increasing his own strength, speed and regeneration. Wilhelm has no blind\
        \ spots in the forest of death. He is fully aware of every inch of space in\
        \ the forest and can teleport around the area freely. The Bri'ah also enhances\
        \ Qliphoth Bacikal, allowing Wilhelm to create spikes of blood in any location\
        \ as long as it is in the forest. He can even summon them out of thin air.\
        \ Wilhelm can also make himself completely undetectable while the Bri'ah is\
        \ active. He is not invisible, rather he just can't be seen, and even tracking\
        \ his soul becomes impossible. By activating his Bri'ah underneath a real\
        \ full moon, he can increase its power. However, his Bri'ah's full power is\
        \ only activated when used in conjunction with Helga. The range increases\
        \ and the environment around Wilhelm becomes a forest of bloody roses and\
        \ thorns. The forest is constantly changing and moving to devour its target,\
        \ making staying in a single spot for more than an instant impossible. It\
