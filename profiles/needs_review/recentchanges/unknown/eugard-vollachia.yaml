- id: claim-weaknesses-cb033226
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques *Commandment of Thorns: A curse Eugard
    placed on his lover Iris. It causes her soul to continually return to the earth,
    finding a new vessel to inhibit. *Curse of Thorns: A curse placed onto him that
    caused him to bind himself and the people around him with thorns. He had the ability
    to bind people with with sharp, ashen grey thorns that pierced their hearts. These
    thorns and had no tangible form, making them impossible to remove, and their effect
    was dependent on the target''s Od/soul. So long as a target met the conditions,
    the thorns indiscriminately applied themselves to anyone within who entered a
    given distance centered around Eugard and more intensely harmed them the closer
    they got to him. The curse can only be activated on those Eugard could love. ==Notable
