  intelligence:
    text: 'Instinctive (He was said to have given all of his memory, with all that
      remains being his instinct and rage) Standard Tactics: During the first phase
      of the fight, Tarsus will use their teleportation often, attacking their opponent
      from different angles and sometimes speed in from the edge of their arena to
      attack before disappearing at the other end. In the second phase, however, Tarsus
      will forgo teleportation altogether and focus on skating around to control distance
      and avoid attacks. In the first phase, they will occasionally use Ice Storm,
      but in the second phase, they will instead use Ice Spikes.'
    source_ids:
    - vsbattles-tarsus-the-first-martyr-unknown
