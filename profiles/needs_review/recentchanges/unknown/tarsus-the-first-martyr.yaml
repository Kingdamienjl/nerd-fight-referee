    ) *Berserk Instincts (Is driven entirely by his instincts and rage) **Swordsmanship\
    \ *Teleportation (Can disappear into a fine cloud of ice shards before reappearing\
    \ elsewhereTarsus, the First Martyr boss fight, Martyr's Altar area, Crypt of\
    \ Martyrs location) *Ice Manipulation, Air Manipulation and Temperature Manipulation\
    \ (Can freeze targets completely still, either by generating miniature whirlwinds\
    \ around themselves or by summoning spikes of ice that shoot up from the ground)\
    \ **Minor Sense Manipulation (While frozen, individuals are left blinded by the\
    \ ice they are trapped in) *Resistance to Memory Manipulation (Was said to have\
    \ given away all of his memory.Inscription, Abandoned Chamber area, Crypt of Martyrs\
    \ location: The First Martyr gave neither blood nor body. No, he gave up so much\
    \ more to preserve our faith. He gave his living memory\u2014all that he knew,\
    \ all that he glimpsed\u2014sealed within ice. As it thaws, open your mouth and\
    \ harden your heart. Receive his gift. Remember what came before.)"
  source_ids: *id003
