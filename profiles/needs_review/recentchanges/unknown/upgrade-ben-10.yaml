    - field: weaknesses
      value: Category:DJthisben10guy Upgrade's control over machines is not absolute,
        as sapient, intelligent machines like Slix Vigma can easily fight off Upgrade
        if he merges with them against their will. He may also be unable to override
        some security systems or combat computer viruses, such as those of the Megacruiser
        and Plumber Headquarters, respectively. Upgrade can be forcefully separated
        from technology, as demonstrated by Rojo. When possessing technology, Upgrade
        is able to falter in producing constructs exactly how he had envisioned them,
        seen when he upgraded an urban assault vehicle by adding even more guns to
        it. Upgrade can be hurt if he is pulled and stretched hard enough, as shown
        when he was being pulled and stretched by Dr. Animo's Mutant Sea Monster.
        Upgrade can be powered down by a Repo Boot, as demonstrated with Ship. Upgrade
        is sensitive to electromagnetic pulses and magnetic fields. Upgrade is vulnerable
        to having his energy absorbed, which leaves him petrified afterwards. Being
        a swarm of nanomachines, Upgrade is weak against electricity, such as that
        generated by Nosedeenians, Cerebrocrustaceans and Conductoids, the latter
        of which has been demonstrated with Malware. Upgrade is weak against acid
        and intense heat such as lava. This is because any sort of corrosive can upset
        his delicate chemistry. Upgrade can be controlled by Vladats via their Corrupturas.
        Upgrade can be trapped in crystals by Petrosapiens, as demonstrated with Malware.
        Upgrade can be affected by technorganic viruses and a Nemuina's sleeping dust.
        Upgrade is vulnerable to being turned into a smoothie by Squirtapiller's species
        Being living metal, Upgrade is vulnerable to electricity, such as that generated
        by a Fulmini, as demonstrated with Bootleg. Upgrade is sensitive to electromagnetic
        pulse/fields and magnetic fields. As a toddler, Upgrade cannot completely
        merge with technology but could if he was stretched long enough. Upgrade can
        sustain damage from attacks on whatever object or technology he is merged
        with, as demonstrated with Bootleg. Upgrade can be forcefully separated by
        species with enough strength, as he was easily separated by Vilgax == Notes
