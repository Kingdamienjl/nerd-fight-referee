        \ the galaxy in minutes, comparable to Retaliator) * Nanotechnology (Upgrade's\
        \ entire body is made of nanites) * Technology Possession, Technological Merging\
        \ & Camouflage (Upgrade has the ability to merge with and possess any technology\
        \ by encasing his liquified body over it. The size of the device is not significant\
        \ and he controls it as naturally as he would his own body. When he merges,\
        \ his black and green circuitry pattern spreads across the technology's surface\
        \ to fit its proportions; although he also has the ability to perfectly replicate\
        \ the technology's original colors. That includes cyborgized people like Rojo,\
        \ technology based sentient beings like Chronosapien, and nanotechnology infused\
        \ people like Rex. Upgrade's technological possession can work on non-electrical\
        \ machinery, such as a row machine in a gym. Upgrade only needs a part [or\
        \ extremity of his body to touch a piece of technology to begin possessing\
        \ it]. Upgrade can also make his head or face appear from anywhere on the\
        \ machines he possesses) * Technological Phasing (Upgrade can phase into machines\
        \ to possess them, rather than covering them in his liquified state) * Technological\
        \ Telekinesis (Upgrade can also telekinetically move and control any piece\
        \ of technology he is possessing, but is not attached to his main body, even\
