- id: claim-weaknesses-0c6112eb
  section: weaknesses
  axis: weakness
  text: 'Being made of living metal, Upgrade is vulnerable to electricity and magnets.
    He can be hurt if he''s stretched hard enough. He can be infected with technorganic
    viruses. He will melt in acid and extreme heat such as lava. Sentient machines
    are resistant to his control. ==Notable Matchups== Victories: Losses: Big Chill
    (Ben 10) Big Chill''s Profile (Base Key for Big Chill, second to Upgrade was used,
    Battle took place in the Plumbers Headquarters) Inconclusive: ==Notes/Explanations==
    Category:Characters Category:Ben 10 (Classic) Category:Ben 10 Aliens Category:Aliens
    Category:Transformations (Ben 10) Category:Male Characters Category:Good Characters
    Category:Heroes Category:Cartoon Characters Category:Energy Projection Users Category:Elasticity
    Users Category:Shapeshifters Category:Size Users Category:Regeneration Users Category:Hackers
    Category:Self-Sustenance Users Category:Technology Users Category:Body Control
    Users Category:Nanotechnology Users Category:Inorganic Beings Category:Technopaths
    Category:Transformation Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-c4422100
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Nanotechnology (Upgrade's body is made\
    \ of billions smaller cell-like nanites) *Inorganic Physiology (Type 2: Upgrade\u2019\
    s body is made of billions of smaller, cell-like nanites, and Upgrade is a technology\
    \ like Ship who is not alive) *Technology Manipulation & Technology Possession\
    \ (1 layer - Can merge with and control technology. Could manipulate Robo Rojo's\
    \ armor despite it resisting his prior attempt) *Body Control (Capable of turning\
    \ his body into a parachute-like form, can stretch his limbs and body, and can\
    \ transform his body into a semi-spaghetti-like state that allows him to move\
    \ in this manner) *Shapeshifting (Shown here) *Immortality (Type 3) & Regeneration\
    \ (At least Low-High: Capable of regenerating even after being reduced to a liquid\
    \ state also is capable of melting his body to avoid attacks and he is capable\
    \ of regenerating himself from that state, possibly High: Should be comparable\
    \ to Malware) *Plasma Manipulation (Capable of generating Plasma beams) *Energy\
    \ Projection (Capable of generating energy beams from his eye) *Size Manipulation\
    \ (Should be comparable to other Galvanic Mechamorphs, who can increase their\
    \ size) *Transformation (Can upgrade technology he merges with) *Data Manipulation\
    \ (Can control the entire game world as Upgrade while he was inside the Sumo Slammers\
    \ game) *Statistics Amplification (Everything he upgrades becomes better and stronger)\
    \ *Limited Resurrection (Resurrected Ishiyama after Kenko killed him) *Weapon\
    \ Creation (Created weapons out of his arms in his fight against Kenko) *Elasticity\
    \ (Was stretched to unreasonable levels by Dr. Animo's giant squid monster) *Limited\
    \ Durability Negation & Explosion Manipulation (Could go right through Kenko's\
    \ armor and explode it from the inside out, also as shown here) *Intangibility\
    \ (Capable of phasing his hand through Vilgax's drone to destroy it from the inside.)\
    \ *Self-Sustenance (Type 1) & Space Survival (Could effortlessly survive in space\
    \ when he flew to the space station with Victor. Galvanic Mechamorphs have also\
    \ been seen effortlessly surviving is space) *Additional Limbs (Could bring an\
    \ additional limb out of his chest in his fight against Otto. This ability should\
    \ also be added to Malware's profile as he could do the same in his fight against\
    \ Cannonbolt) *Flight (Via Technology, Could fly to the space station when fused\
    \ with a rocket and could allow Kevin's car to fly when he fused with it) *Hacking\
    \ (Could hack the Plumber's computors to stop a transmission) Resistance to: *Extreme\
    \ Cold and Cosmic Radiation *Electricity Manipulation (Was unaffected by Victor's\
    \ electrical attacks and the electricity that came of Robo Rojo's armor) *Explosion\
    \ Manipulation (Was completely unaffected by Kenko's armor imploding on itself.\
    \ Comparable to Ba-Zel, who could fine after being engulfed in a large explosion)\
    \ All abilities and resistances provided by the Omnitrix"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
