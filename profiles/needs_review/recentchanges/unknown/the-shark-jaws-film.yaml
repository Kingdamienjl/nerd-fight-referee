  section: weaknesses
  axis: weakness
  text: 'Should have most if not all the same weaknesses as a great white shark. Note:
    A scan sometimes attributed to the shark is it possessing a bite force/pressure
    of 15 tons per square inch, taken from Peter Benchley''s third and final draft
    for the 1975 movie, where the shark kills itself by biting down on the oxygen
    tank. This was scrapped in favour of a re-write by Carl Gottlieb and thus is unusable,
    as the actual final script and movie don''t mention the shark''s bite force.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
