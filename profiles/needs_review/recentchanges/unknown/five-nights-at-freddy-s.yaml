    - field: weaknesses
      value: "Freddy is typically only active during nighttime. (12AM to 6AM) Freddy\u2019\
        s strategies for killing his opponents get pretty predictable. Simply hiding\
        \ behind metal doors can stop him. If a human plays dead, Freddy\u2019s attacks\
        \ can be delayed. Viewing him on electronics like monitors can slow his path\
        \ towards the opponent down. Flashlights have the same effect. He can be fooled\
        \ by wearing an animatronic mask. (Although they have to be quick enough to\
        \ put it on) If his body parts are broken apart too much, he won\u2019t be\
        \ able to do much. | There\u2019s only so many chips and bytes Freddy can\
        \ use at a time, and a number of them wear off after a period of time. Notable\
        \ Attacks/Techniques: Five Nights at Freddy's canon: *Jumpscare - Freddy lunges\
        \ and screams at his opponent, capable of easily killing a fully grown man.\
        \ *Room Light Flicker - If Freddy is around any area with lights in it, he\
        \ can cause them to flicker on and off repeatedly, usually to warn the opponent\
        \ about killing him. *Teleportation - Freddy can use this ability to hide\
        \ himself from the opponent. FNaF World: *Mic Toss - Freddy (Classic/Withered)\
        \ tosses his Mic at an opponent. *Pizza Wheel - Freddy (Classic) summons several\
        \ Pizzas and throws it at his opponent(s). *Bite 2 - Freddy (Nightmare) deals\
        \ heavy damage to two foes. **Esc Key - Freddy (Withered/Phantom) can wipe\
        \ out every nearby opponent using this move. However, this attack is chance-based.\
        \ *Freddles - Freddy (Nightmare) summons Freddles that heavily damages all\
        \ enemies multiple times. *Birthday - Freddy (Classic) increases his Speed,\
        \ Strength and Durability for not only himself, but for others too. *Gloom\
        \ Song - Freddy (Withered) causes his opponent(s)\u2019 speed to decrease\
        \ temporarily. *Sludge - Freddy (Phantom/Nightmare) temporarily decreases\
        \ all his opponents' speed. *Rainy Day - Freddy (Phantom) temporarily decreases\
        \ all his opponents' durability. *Chips - These items can upgrade Freddy and\
        \ his allies or provide new abilities. **Headstart Speed - Increases his speed\
        \ for a period of time. ***Endless Speed - Gives him a boost of speed permanently.\
        \ **Headstart Defense - Increases his durability for a period of time. ***Endless\
        \ Defense - Gives him a boost of durability permanently. **Headstart Strength\
        \ - Increases his strength for a period of time. ***Endless Strength - Gives\
        \ him a boost of strength permanently. **Run Luck - Increases his chances...for\
        \ fleeing a battle. **Block Jumpscare - Makes him immune to the move Jumpscare.\
        \ (In other words, it prevents him from being temporarily stunned.) **QuickStart\
        \ Party - His opponents will be prevented from attacking for a period of tifme.\
        \ **EverComet Weak - Causes comets to fall on his opponent(s) sometimes. **EverComet\
        \ Strong - Causes comets to fall on his opponent(s) frequently. **Auto Mimic\
        \ Ball - Receives a Mimic Ball, which allows them to spawn Virtua-Freddy,\
        \ who uses an enemy's previous attack. **Curse Status - Decreases all of his\
        \ opponent(s)\u2019 stats for a period of time. **Counter Bite - When an opponent\
        \ attacks him, he bites back a lot of the same damage just dealt. **Auto Giftboxes\
        \ - Get gifted with an extra life. (He can revive himself if he happens to\
        \ die.) **Auto Regen - Automatically regenerates health. *Bytes - These robots\
        \ help deal damage to his opponent(s) and help Freddy in battle. These can\
        \ all be upgraded to more powerful and useful versions. **Byte Bee - These\
        \ shoot stingers at opponents for extra damage. **Byte Metapod - These heal\
        \ Freddy periodically. **Byte Grim Reaper - These have a random chance at\
        \ instantly killing opponents. **Byte UFO - These shoot lasers at opponents\
        \ for extra damage. **Byte Shield - These block base damage from any attack.\
        \ **Byte Bomb - These can detonate once per battle for instant damage. **Byte\
        \ Eye - These steadily drain the life of other opponents. **Pearl - These\
        \ heal Freddy and his allies slowly over time. **Fan - These randomly shoot\
        \ lasers at his opponents. *Blaster - Freddy uses this to shoot laser beams\
        \ at his opponents. These can be upgraded to a more powerful and useful state.\
        \ Category:SKeLeTrust"
