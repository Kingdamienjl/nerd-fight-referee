    - field: weaknesses
      value: "His Jutsu can consume large amounts of chakra, and can only use the\
        \ one-tail to its strongest when truly asleep. Oil also makes his sand extremely\
        \ heavy and difficult to control Notable Attacks/Techniques: Sand Manipulation:\
        \ Sand is a versatile material, most often employed by the shinobi originating\
        \ from Sunagakure for various purposes, including numerous supplementary functions\
        \ ranging from concealment to disguise. However, the tool itself rose to prominence\
        \ in the hands of the jinch\u016Briki of Shukaku, who acquired the ability\
        \ to manipulate sand through the beast, with the most renowned amongst these\
        \ being Gaara. While Gaara is capable of controlling any sand, he keeps specially-made\
        \ sand in his gourd, also made from this sand. This sand is infused with his\
        \ chakra, allowing him to make faster and more powerful attacks. *Shield of\
        \ Sand: A technique that is unique to Gaara. Whenever Gaara is about to be\
        \ harmed, a shield of sand will automatically surround and protect him. The\
        \ sand will react regardless of Gaara's will, even protecting him from self-inflicted\
        \ injuries. *Armor of Sand: Gaara can cover himself in a compacted layer of\
        \ sand, providing an additional defense should his Shield of Sand fail. *Desert\
        \ Layered Imperial Funeral Seal: Using a large quantity of sand, Gaara covers\
        \ the enemy with several successive layers of the material, before compressing\
        \ it into the form of a huge pyramid which acts to imprison the target upon\
        \ its completion. *Prison Sand Burial: Gaara using his ability to manipulate\
        \ sand, loosens the ground below his enemy and catches them in a maelstrom\
        \ of sand. The swallowed enemy sinks up to two hundred meters underground,\
        \ while completely unable to move a muscle. *Sand Clone: Gaara uses a clone\
        \ of sand. *Sand Waterfall Funeral: After wrapping an opponent with sand with\
        \ either Sand Binding Coffin or Sand Drizzle, Gaara will cause the sand to\
        \ implode and crush whatever is within it. *Sand Waterfall Imperial Funeral:\
        \ This technique is a specialty of Gaara, where he makes the land a stage\
        \ for his representation. *Quicksand Waterfall Flow: This technique creates\
        \ a massive amount of sand in the form of a wave, covering and \"drowning\"\
        \ the opponent in an ocean of sand. From the sand Gaara carries in his gourd,\
        \ he grinds the rocks and minerals from underground into a large sea of sand\
        \ and manipulates it like a tsunami that engulfs everything in his line of\
        \ sight. *Air Sand Protective Wall: This air defence technique creates a giant\
        \ shield of sand that is suspended in mid-air by raising a great amount of\
        \ sand from the ground. By gathering the best possible mineral-rich sand,\
        \ the hardness of the shield is considered to be very high. Furthermore, the\
        \ sand has its defensive strength raised by flowing chakra through it. It\
        \ was strong enough to protect Sunagakure from Deidara's C3, and stop a lightened\
        \ Tengai Shinsei. In the The Last: Naruto the Movie, Gaara uses this technique\
        \ in conjunction with wind-natured chakra, creating multiple giant sand shields,\
        \ to protect his village from a falling meteor. *Third Eye: Gaara can create\
        \ an artificial eye made of sand or Gold Dust for extrasensory vision. He\
        \ can control the size of the eye depending on its use. Its main purpose is\
        \ spying, as it can form and disperse on any location in command. He can use\
        \ it to see what's happening outside while surrounding himself in the Shield\
        \ of Sand for protection during combat."
