    - field: weaknesses
      value: 'Kimimaro has a fatal illness, and is somewhat easily provoked. Notable
        Attacks/Techniques: *Cursed Seal of Earth: This is one of the strongest of
        Orochimaru''s cursed seals, the other being its counterpart: the Cursed Seal
        of Heaven. It consists of three slightly curved lines, which spread in a rip-like
        pattern. The seal is located on the upper portion of Kimimaro''s chest over
        his manubrium. When the first level is activated, the seal expands and lines
        spread all over Kimimaro''s body in contorting and parallel lines. When the
        second level of the seal is active, Kimimaro takes on a dinosaur-like appearance
        complete with a tail. Several large bones also protrude from his darkened
        skin. Like all cursed seals, Kimimaro receives increased chakra levels, physical
        capabilities, and his ninjutsu skills become more effective when the seal
        is active. When in his Level 2 form, Kimimaro''s appearance was similar to
        that of a dinosaur, with dark grey skin, six large bone spines protruding
        out of his back, and a long bone-spiked tail. Kimimaro had great enough skill
        with the Cursed Seal that he could do a partial transformation. *Shikotsumyaku:
        An ability which allows Kimimaro to manipulate his own skeletal structure
        as a means of combat. Specifically, it allows him to combine his chakra with
        calcium, making his bones flexible. This ability gave him absolute control
        over the concentration of calcium within his bones, allowing him to control
        the density or malleability of them. Kimimaro also stated that his bones were
        stronger than steel. He used this ability to wield his bones as weapons in
        battle, and could use them in the form of taijutsu attacks (which he called
        dances) to give him a variety of abilities, as well as grant him a near-invincible
        defence. **Tenshi Sendan(Ten-Digit Drilling Bullets): Kimimaro fires bones
        from the tips of his fingers like bullets. **Tessenka no Mai (Dance of the
        Clematis): Kimimaro pulls out his own spinal column to use as a flexible spiked
        staff and regrows a new spine to replace the removed one. Kimimaro will trap
        his opponent in his spinal column and then encase his other arm in a large
        bone lance and pierce them with it. **Sawarabi no Mai (Dance of the Seedling
        Fern): Kimimaro causes a giant forest of bone spikes to burst from the ground.
        He is able to merge with the bones to create a surprise attack. This technique
        has an AoE of city block level or higher.'
      source_id: character-stats-profiles-kimimaro
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
