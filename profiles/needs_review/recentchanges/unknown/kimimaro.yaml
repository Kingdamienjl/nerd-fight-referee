    - field: weaknesses
      value: 'Kimimaro has a fatal illness, and is somewhat easily provoked. Use of
        the Curse Mark erodes the user''s body until they eventually lose themselves,
        binding them to OrochimaruNaruto, Chapter 179. The second level makes this
        erosion speed up dramaticallyNaruto, Chapter 183 and it requires a greater
        amount of chakra to sustain it. It also takes a serious toll on the user,
        leaving them unable to move their body afterwardsNaruto, Chapter 186. {| class="mw-collapsible
        mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
        | colspan="2" style="text-align: left; |Notable Attacks/Techniques: |- | *:
        This is one of the strongest of Orochimaru''s cursed seals, the other being
        its counterpart: the Cursed Seal of Heaven. It consists of three slightly
        curved lines, which spread in a rip-like pattern. The seal is located on the
        upper portion of Kimimaro''s chest over his manubrium. When the first level
        is activated, the seal expands and lines spread all over Kimimaro''s body
        in contorting and parallel lines. When the second level of the seal is active,
        Kimimaro takes on a dinosaur-like appearance complete with a tail. Several
        large bones also protrude from his darkened skin. Like all cursed seals, Kimimaro
        receives increased chakra levels, physical capabilities, and his ninjutsu
        skills become more effective when the seal is active. When in his Level 2
        form, Kimimaro''s appearance was similar to that of a dinosaur, with dark
        grey skin, six large bone spines protruding out of his back, and a long bone-spiked
        tail. Kimimaro had great enough skill with the Cursed Seal that he could do
        a partial transformation. *: An ability which allows Kimimaro to manipulate
        his own skeletal structure as a means of combat. Specifically, it allows him
        to combine his chakra with calcium, making his bones flexible. This ability
        gave him absolute control over the concentration of calcium within his bones,
        allowing him to control the density or malleability of them. Kimimaro also
        stated that his bones were stronger than steel. He used this ability to wield
        his bones as weapons in battle, and could use them in the form of taijutsu
        attacks (which he called dances) to give him a variety of abilities, as well
        as grant him a near-invincible defence. **: Kimimaro fires bones from the
        tips of his fingers like bullets. **: Kimimaro pulls out his own spinal column
        to use as a flexible spiked staff and regrows a new spine to replace the removed
        one. Kimimaro will trap his opponent in his spinal column and then encase
        his other arm in a large bone lance and pierce them with it. **: Kimimaro
        causes a giant forest of bone spikes to burst from the ground. He is able
        to merge with the bones to create a surprise attack. This technique has an
        AoE of city block level or higher. |} ==Gallery== File:Kimimaro kaguya edo
        tensei by meshugene89-d4xteyn.png|Edo Tensei Kimimaro. ==Notable Matchups==
