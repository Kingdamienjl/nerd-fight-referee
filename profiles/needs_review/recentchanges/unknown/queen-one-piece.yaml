  attack_potency:
    text: 'Country level (Drew blood from X Drake with his swordOne Piece Vol. 98
      Chapter 990. Superior to JackOne Piece Vivre Card Databook #0960 and all of
      the TobiroppoOne Piece Vol. 97 Chapter 979. Fought Denjiro in the past17.253
      Teratons), Moon level in Zoan Forms (His Full Zoan can fight and overwhelm Monster
      Point Chopper, who can slightly harm himOne Piece Vol. 100 Chapter 1007. Slightly
      superior to Pre-Exoskeleton Sanji. Was called tough to fight by Hybrid Marco188.362
      Exatons), higher with Brachio Launcher (Harmed himself and Sanji), far higher
      with Vinsmoke Abilities (Can amp his regular fighting style with Vinsmoke abilities
      like Sparking Red, Dengeki Blue, and Winch GreenOne Piece Vol. 102 Chapter 1034.
      Matched and did notable damage to Post-Exoskeleton Sanji, whom his normal Hybrid
      form could not even hurt), can bypass durability to an extent through the heat
      with Sparkling Queen and Black Coffee (Made the likes of Phoenix Marco, Zoro
      and Sanji wary of his attacks)'
    source_ids:
    - vsbattles-queen-one-piece-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Relativistic+ (Superior to Jack and could combat the scabbards in the past,
      while some of them were equal to their previous selves. Managed to dodge an
      attack from Rooftop Zoro, although it did startle him and slice his machine
      gun), higher in Zoan Forms (Could tag Post-Exoskeleton Sanji. Was able to intercept
      Post-Udon Base Luffy and grab both him and Base Zoro with his mouth before they
      could reach the roof), Speed of Light with Black Coffee, Henry Blazer or Sparking
      Valkyrie
    source_ids:
    - vsbattles-queen-one-piece-unknown
    confidence: 0.6
    notes: auto_repair source extraction
