- id: claim-weaknesses-097d5b7c
  section: weaknesses
  axis: weakness
  text: Queen can become rather surprised easily, though this usually doesn't last
    long. He has a particular sweet tooth for oshiruko, and will fly into a rage should
    someone imply they will cut into his own supply of it, causing him to recklessly
    challenge an Emperor like Big Mom. Can become distracted in the middle of a fight,
    such as how his desire to punish an Oiran for rejecting his advances cost him
    his potential victory against Sanji by giving the latter both an opening and another
    motivation to defeat him. Is proud of his genius, and will sometimes boast about
    his achievements, even to his own detriment. Furthermore, he possesses the standard
    Devil Fruit weaknesses
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-ddcf213a
  section: abilities
  axis: hax
  text: "* Superhuman Physical Characteristics * Weapon Mastery (Although not displayed\
    \ so far, given that he is one of the top executives of the Beast Pirates, he\
    \ should possess extreme proficiency with the blade he carries. Skilled marksman\
    \ with his gatling gun) * Transformation (Into a Brachiosaurus/human hybrid and\
    \ full Brachiosaurus at will) * Large Size (Type 0 in Base form - 6.12 meters\
    \ tall; Type 1 in Zoan form) * Regeneration (Mid-Low) * Body Control (Detaches\
    \ his neck and tail from his torsoOne Piece Vol. 102 Chapter 1028) * Breath Attack,\
    \ Limited Light Manipulation, Explosion Manipulation, Heat Manipulation and Energy\
    \ Projection with Black Coffee * Cyborgization (Partial, Has several cybernetic\
    \ enhancements, including Brachio Launchers installed in his torso) * Haki (Intermediate\
    \ Kenbunshoku, Intermediate Busoshoku) * Fire Manipulation with Bridal Grabber\
    \ Resistance to * Animal Manipulation (Zoans are immune to Tama's Kibi Dangos)\
    \ * Extreme Heat (Had his laser blow up inside his mouth twice. Took several Diable\
    \ Jambes from Pre-Vinsmoke Awakening Sanji without getting fatally burned) * Madness\
    \ Manipulation, Mind Manipulation and Soul Manipulation via Willpower (Through\
    \ sheer willpower they can resist losing their mind when absorbing shadows through\
    \ the Kage Kage no Mi. Shadows belonging to strong willed people are difficult\
    \ to control, allowing them to rebel against Moria's pact which usually immediately\
    \ submits a shadow to his supremacy and orders. Spiritual energy is contained\
    \ within one's soul/life; this energy is represented by the fighting power or\
    \ the Haki itself. Those with strong souls, which are homologous to shadows, resist\
    \ the effects of Brook's soul manipulation) * Corruption (Type 1) * Disease Manipulation\
    \ and Power Bestowal (Can spread contact based diseases via his Plague Bullets\
    \ and Plague Shots. His Ice Oni virus increases muscle mass and allows victims\
    \ to fight in close to their prime states, providing Transformation and Natural\
    \ Weaponry for those affected) * Ice Manipulation * Biological Manipulation and\
    \ Madness Manipulation (Via his 'Ice Oni' Plague Rounds) * Pain Manipulation,\
    \ Blood Manipulation, and Heat Manipulation (Via 'Mummy' Plague Rounds; causes\
    \ burning pain all over one\u2019s body and induces hemorrhages in victims as\
    \ they start to bleed), which produces intense fevers * Energy Projection, Light\
    \ Manipulation, Danmaku, Heat Manipulation, Durability Negation (with Sparking\
    \ Queen) * Explosion Manipulation (with Sparking Red) * Electricity Manipulation\
    \ (Can electrify parts of his body) * Body Control (with Winch Queen) * Invisibility\
    \ (with Stealth Black) * Possibly Poison Manipulation (Can integrate poison into\
    \ his physical attacks) * Possibly Durability Negation * Possibly Poison Resistance\
    \ and Poison Absorption (Capable of eating highly toxic poison into his body with\
    \ no consequences)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
