- id: claim-weaknesses-98ee102a
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks/Techniques: *Yoko Kurama Transformation: With\
    \ the past life seeds that Suzuki gave him Kurama can become Yoko Kurama for a\
    \ short amount of time, boosting his fighting abilities. By the end of the manga\
    \ Kurama could do this without the need of the seeds. *Rose Whip: Kurama's signature\
    \ technique. He uses his demon energy a seed into a rose and then into a long\
    \ thorn whip capable of cutting through steel. *Kagon Retsuzanshi: Also known\
    \ as Rose Whiplash, Kurama swiftly performs a multi directional slash. *F\u016B\
    ka Enbu Jin: Also known as Rose Whip Thorn Wheel, Kurama makes a whirlwind of\
    \ rose petals hovers around him which attacks and rip enemies that get close enough\
    \ to shreds. *Shimaneki S\u014D: Also known as Seed of the Death Plant, this is\
    \ a small seed that Kurama plants in his opponent's body that he manipulates using\
    \ his demon energy. The seed kills the victim once it has had enough time to sprout.\
    \ *Shoku Y\u014D Shokubutsu: Also known as Death Tree, this is a giant carnivorous\
    \ tree with an acidic saliva that strikes anything that moves. *Makai Ojigi: Also\
    \ known as Ojigi Plant, a plant indigenous to South America. It closes its leaves\
    \ around its prey and crushes it to death in response to movements or heat. *Ky\u016B\
    ketsu Shokubutsu: Also known as Blood Sucking Plant, a special demon world plant\
    \ that can uses its tentacles to attack to the victim and suck out their blood\
    \ as the name suggests. *Akaru Weed: Also known as Lamp Weed, Kurama plants them\
    \ to act as back tracking markers. *Janenju: Also known as Sinning Tree, the tree\
    \ responds to the memories of the victims and forces them to replay their fears\
    \ until they die.. *Y\u014Dzan Ken: Also known as The Binding Fist of the Demonic\
    \ Vine, it is similar to the Rose Whip in that it is composed of a vine with thorns,\
    \ but this time it grows around Kurama's arm and is wielded as a sword-like weapon.\
    \ *The Pseudocreature: A plant that merges with the target's cells, instinctively\
    \ repairs damages on host's body. It will remain in a half-alive state for a long\
    \ time as long as the host's brain is intact (used for torture). ==Notable Matchups==\
    \ Victories: Losses: Inconclusive: Category:Characters Category:Yu Yu Hakusho\
    \ Category:Accelerated Development Users Category:Acid Users Category:Acrobats\
    \ Category:Anime Characters Category:Astral Projection Users Category:Aura Users\
    \ Category:Body Puppetry Users Category:Chi Users Category:Demons Category:Energy\
    \ Users Category:Enhanced Senses Users Category:Extrasensory Perception Users\
    \ Category:Flight Users Category:Foxes Category:Geniuses Category:Hair Users Category:Healers\
    \ Category:Humans Category:Illusionists Category:Male Characters Category:Manga\
    \ Characters Category:Martial Artists Category:Mind Users Category:Paralysis Users\
    \ Category:Plant Users Category:Primary Protagonists Category:Protagonists Category:Rage\
    \ Users Category:Reformed Characters Category:Smoke Users Category:Statistics\
    \ Amplification Users Category:Stealth Masters Category:Summoners Category:Weapon\
    \ Creation Users Category:Weapon Masters Category:Whip Users Category:Leaf Users"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-253cd4ad
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Genius Intelligence, Accelerated Development\
    \ (Training; Physical Stats, Abilities), Longevity as Yoko Kurama, Acrobatics,\
    \ Aura, Ki Manipulation, Energy Manipulation, Summoning (Can summon a wide variety\
    \ of plants from the demon realm, as well as acids from plants, one of which being\
    \ able to mind attack an opponent), Weapon Creation (Can turn plants into weapons),\
