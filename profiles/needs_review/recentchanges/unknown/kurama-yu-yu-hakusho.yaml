    \ Enhanced Senses, Extrasensory Perception, Paralysis Inducement (Kurama can restrict\
    \ the opponent's movements from the inside growing a plant in the body), Statistics\
    \ Amplification and Rage Power (Yusuke's death caused him to become stronger),\
    \ Danmaku (Flower Petals), Electricity Manipulation (Via Rose Whip), Resistance\
    \ to Telepathy, Limited Poison Manipulation (Those who\u2019ve awakened some form\
    \ of spirit energy are able to survive in the demons planes poisonous atmosphere)"
