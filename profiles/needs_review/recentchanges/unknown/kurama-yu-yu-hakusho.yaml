      source_id: mediawiki-5004
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Yoko Kurama Transformation: With the past life seeds that Suzuki gave\
        \ him Kurama can become Yoko Kurama for a short amount of time, boosting his\
        \ fighting abilities. By the end of the manga Kurama could do this without\
        \ the need of the seeds., Rose Whip: Kurama's signature technique. He uses\
        \ his demon energy a seed into a rose and then into a long thorn whip capable\
        \ of cutting through steel., Kagon Retsuzanshi: Also known as Rose Whiplash,\
        \ Kurama swiftly performs a multi directional slash., F\u016Bka Enbu Jin:\
        \ Also known as Rose Whip Thorn Wheel, Kurama makes a whirlwind of rose petals\
        \ hovers around him which attacks and rip enemies that get close enough to\
        \ shreds., Shimaneki S\u014D: Also known as Seed of the Death Plant, this\
        \ is a small seed that Kurama plants in his opponent's body that he manipulates\
        \ using his demon energy. The seed kills the victim once it has had enough\
        \ time to sprout., Shoku Y\u014D Shokubutsu: Also known as Death Tree, this\
        \ is a giant carnivorous tree with an acidic saliva that strikes anything\
        \ that moves., Makai Ojigi: Also known as Ojigi Plant, a plant indigenous\
        \ to South America. It closes its leaves around its prey and crushes it to\
        \ death in response to movements or heat., Ky\u016Bketsu Shokubutsu: Also\
        \ known as Blood Sucking Plant, a special demon world plant that can uses\
        \ its tentacles to attack to the victim and suck out their blood as the name\
        \ suggests., Akaru Weed: Also known as Lamp Weed, Kurama plants them to act\
        \ as back tracking markers., Janenju: Also known as Sinning Tree, the tree\
        \ responds to the memories of the victims and forces them to replay their\
        \ fears until they die.., Y\u014Dzan Ken: Also known as The Binding Fist of\
        \ the Demonic Vine, it is similar to the Rose Whip in that it is composed\
        \ of a vine with thorns, but this time it grows around Kurama's arm and is\
        \ wielded as a sword-like weapon., The Pseudocreature: A plant that merges\
        \ with the target's cells"
      source_id: mediawiki-5004
      provider_id: vsbattles
      authority: high
      confidence: 0.75
