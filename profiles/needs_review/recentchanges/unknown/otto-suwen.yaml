    creature to convey meaning, and speak with said living creature in turn. This
    even allows him to understand the nuance of words, so an unknown term such as
    "gasoline" would sound like "special oil that burns well". He speaks the language
    of the creatures he is talking to, which makes him seem like a shady character
    to others while he''s using it. ==Gallery== ==Notable Matchups== Victories: Losses:
