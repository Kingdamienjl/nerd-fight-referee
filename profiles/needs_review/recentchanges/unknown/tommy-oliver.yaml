- id: claim-powers-and-abilities-eb84da63
  section: abilities
  axis: hax
  text: 'Those of Tommy plus * Superhuman Physical Characteristics * Enhanced Martial
    Arts and Acrobatics (When a ranger morphs, their skill are heavily enhanced to
    the point even a person who is horrible at martial arts can become a "Lethal Weapon"
    Saban''s Go Go Power Rangers issue 2) * Instinctive Reaction (The Rangers when
    they morph know the ideal skill moves in a fight before they even do them, it''s
    a preset instinct. Thanks to that instinct the Rangers can also hit enemies without
    the need of seeing them Saban''s Go Go Power Rangers issue 2 Power Rangers Lost
    Chronicles) * Statistics Amplification (The Zeo Rangers get stronger as time goes
    on Mighty Morphin Power Rangers Season 3 Episode 29 and the energy he generates
    can be used to enhance his attacks. Zeo episode 21 to the point of even inflicting
    great damage on King Mondo Zeo episode 50 He can enhance his kicking power to
    create the Zeo V Flying Power Kick Zeo episode 2) * Energy Projection (With their
    blasters they can shot energy beams at the opponent, Zeo episode 5 the Zeo V Power
    Sword of the Red Ranger can also send energy attacks aswell Zeo episode 10 and
    can also work as a blaster Zeo episode 13) * Explosion Manipulation (Multiple
    attacks of the Zeo Rangers can create explosions, their pose can also create explosions
    and their finishers can explode the enemy) * Energy Manipulation (The Zeo rangers
    can generate energy to power up their attacks Zeo episode 21 or manipulate energy
    to cover themselves in an energy ball to do massive explosive damage to their
    opponent Zeo episode 13) * Self-Sustenance (Type 1; The Zeo Rangers like every
    other Power Ranger are fine in space, Wild Force episode 34 all the Ranger teams
    are also fine outside the dome city of corinth where the air is extremely RPM
    episode 1 poisonous Hyperforce episode 6) * Cloth Manipulation when transforming
    (Their clothes are turned into the ranger suits by the Grid manipulating matter
    in a molecular level Power Rangers Universe issue 2), Forcefield Creation (The
    Rangers can create an oxygen field around their opponent using their Zeo blasters
    Zeo episode 11) * Ice Manipulation (The Zeo cannon fires a cryogenic wave that
    freezes solid anything it hits Zeo episode 24) * Fusionism (The Rangers can fuse
    their zords to form the Megazords), Underwater Breathing (Type 2: All Rangers
    are fine underwater, the Zeo Rangers upscale Mighty Morphin who are fine in water
    Saban''s Go Go Power Rangers issue 2) * Weapon Mastery (The Zeo V Power Sword
    aswell as his multiple blasters, showcased here Zeo episode 10) * Summoning (The
    red ranger can summon his Zeo V Power Sword, Zeo episode 5 his zord Zeo episode
    3 and the Defender Wheel Zeo episode 13) * Transformation (The Zeo rangers can
    always turn into red light to avoid dangerous situations Zeo episode 6) * Electricity
    Manipulation (He can call lightning to power up his sword Zeo episode 5) * Shockwave
    Creation (The Red Ranger can create shockwaves after landing hits with his energy
    amped attacks Zeo episode 21) * Aura (While powering up his sword he is covered
    in red aura Zeo episode 5) * Stealth Mastery (The Rangers thesmelves are very
    stealthy, capable of disappearing without a trace and doing surprised attacks
    on the Cogs who have enhanced senses, scanners and radars Zeo episode 29) * Vehicular
    Mastery (All the Rangers are good at riding their motorcycles Zeo episode 30 aswell
    as piloting their zords) * Power Nullification (The Defender Wheel can nullify
    any abilities that are done via frequencies like when they canceled Puppetman''s
    mind control ability) Zeo episode 8) * Limited Durability Negation (The finishers
    of the Power Rangers can make weakened or weaker opponents explode into nothing)
    Resistance to: * Fire Manipulation (The rangers were able to endure the heat of
    the sun Zeo episode 3 , the rangers should also upscale from King Mondo''s monsters
    who even the ones made by metal garbage can ram into the atmosphere just fine
    Zeo episode 22) * Electricity Manipulation (The rangers have taken electricity
    attacks from Mean Screen, Zeo episode 5 Boohoo the Clown. Zeo episode 13 and even
    the powerful electricity attacks of King Mondo himself Zeo episode 21 The rangers
    are capable of taking hits from each other just fine) * Hacking (Thanks to an
    antivirus now the ranger technology cant be effected by computer viruses and cant
    be hacked that way. The defender wheel is resistant to hacking and computer viruses
    Zeo episode 13) * Deconstruction (Upscale Mighty Morphin Power Rangers who can
