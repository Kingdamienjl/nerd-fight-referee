- id: claim-powers-and-abilities-528f858f
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Remnant (Mid-Tier) **Inorganic Physiology
    (Type 1; is a possessed animatronic) *Multiple Selves (Type 3; Bon-Bon, his bonnie
    hand puppet, has its own will and can even detach, helping either in calming him
    down or attacking when necessaryFive Nights at Freddy''s: Sister Location) **Small
    Size (Type 1; Bon-Bon should be around this size) *Body Control and likely Bodily
    Weaponry (Can open and close his face and chest plates at will. Likely has a similar
    claw to Circus Baby,Five Nights at Freddy''s: Official Character Encyclopedia
    since he also possesses a storage tank like herFuntime Freddy''s blueprints) *Enhanced
    Senses (Possesses a proximity sensor for grouping victims together and a 360 pivot
    (possibly Bon-Bon himself) for tracking parents. Can see unbothered in the darkness
    of the Breaker Room) *Sound Manipulation and Social Influencing (Deception, Charisma
    and Leadership; Can mimic voices and lure people using them. Conspired with the
    rest of the Funtime animatronics to kick Circus Baby out of Ennard,Discussion
    between Scottgames.com and fnafworld.com seemingly turning into the leadering
    soul in Molten Freddy.Freddy Fazbear''s Pizzeria Simulator Bon-Bon can calm Freddy
    down simply by talking to him) *Stealth Mastery (Can sneak on Micheal Afton in
    the Breaker Room, using the darkness to his advantage) *Fusionism (Can fuse with
    the other funtime animatronics) **Superhuman Physical Characteristics ***Remnant
    (Low-Tier) ***Inorganic Physiology (Type 1; The fact that it can feed on remnant
    implies some type of possession of it) ***Body Control (Can open and close his
    faceplates) **Multiple Selves (Type 3; Bon Bon, his bonnie hand puppet, has a
    will of its own, and attacks even when Funtime Freddy is unconcious) ***Small
    Size (Type 1; Bon-Bon should be around this size) ***Absorption and Healing (Bon-Bon
    can jumpscare the player to absorb energy from them and give it to Funtime Freddy
    to bring him back from unconciousness) ***Possibly Sound Manipulation (Bon-Bon''s
    footsteps are completely soundless) **Stealth Mastery (Can sneak across entire
    continents without being heard) **Invisibility (Via Cloaking, which makes him
    completely invisible to everything but cameras which static upFNAF AR Special
    Delivery) **Illusion Creation or Teleportation via Fake-outs (If the animatronics
    do not decloak during charges, only their eyes appear, and they vanish after reaching
    the player **Technology Manipulation (The player''s phone produces static when
    hovering over the animatronic''s location. Can cause the phone to glitch out temporarily
    with Interference, and can preform Haywires) **Teleportation/BFR (Can have the
    Plushtrap CPU, which brings The Player to a new location altogether when encountered)'
  source_ids: *id003
