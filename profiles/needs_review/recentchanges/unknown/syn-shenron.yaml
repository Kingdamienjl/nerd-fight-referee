- id: claim-weaknesses-51e6263d
  section: weaknesses
  axis: weakness
  text: 'Syn Shenron is quite arrogant. | A strong enough attack can cause him to
    regurgitate the Dragon Balls and return to his base form, though he can easily
    reabsorb them. {| class="mw-collapsible mw-collapsed" align="center" border="1"
    cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; |Notable Attacks/Techniques: |- | : The fighting power and life force of
    a martial artist, a tangible energy derived from the user''s vigor, courage, and
    mind. It can be used in a number of ways, such as to surpass the limits of one''s
    body to greatly increase in strength, and it can be fired as blasts of energy
    or used to create defensive barriers. Born from the immense amounts of negative
    energy created by Mr. Popo''s wish to resurrect all those Frieza killed on Namek,
    Syn Shenron is the most powerful of the seven Shadow Dragons. Dragon Ball Absorption:
    By consuming the other Dragon Balls, Syn Shenron can transform into his Super
    Shadow Dragon form, known as Omega Shenron, gaining a huge boost to his power
    and the abilities of his fellow Shadow Dragons. Even if he doesn''t absorb all
    of them, he''ll still assume the form, just weaker. If he is significantly damaged
    by an attack, it can cause him to regurgitate the Dragon Balls and return to his
    base form, though he can easily reabsorb them if given the chance. *Dragon Thunder:
    Gained from Rage Shenron, this technique allows Omega to blast his foes with powerful
    bolts of lightning, or, by impaling them on his spikes, electrocute them directly,
    dealing severe damage. *Heat Armor: Inherited from Nuova Shenron, this is an ability
    that allows Omega to increase his body temperature to a level so great that it
    surpasses the heat of the sun and provides him a measure of protection thanks
    to the sheer heat, which can badly burn those unfortunate enough to come into
    contact with him. *Regeneration: Thanks to Rage Shenron, Omega has the ability
    to regenerate from lethal wounds and even having his entire body destroyed by
    converting it into a thick slime, from which he can reform his body. *Super Ice
    Ray: Omega can fire two beams from his eyes that will freeze anything they strike,
    an ability he inherited from Eis Shenron. *Whirlwind Blade: In a twist on Oceanus
    Shenron''s technique, Omega sweeps his hand, striking his opponent with a whirling
    spiral of crimson energy. *Whirlwind Spin: Another technique of Oceanus Shenron''s,
    Omega puts his hands forwards, blasting his opponents with powerful winds that
    can cut them apart. *Dragon Booster: Omega can fire the Dragon Balls from his
    body to embed them in the body of another and corrupting them with his negative
    energy before he explodes from inside of them and regains his complete body. *Minus
    Energy Control: The greatest power afforded to Omega by his transformation is
    the ability to release the negative energy within his body and control it, spreading
    it across Earth to cause worldwide disasters and threatening to consume the entire
    universe. He can channel this negative energy for his most powerful attack, the
    Minus Energy Power Ball, also called the Negative Karma Ball, a massive, crimson
    sphere of energy that he describes as the sum total of all humanity''s sins. This
    sphere possesses the entirety of the heavily condensed power of all the Evil Dragons,
    as well as the minus energy inside the Dragon Balls. |} ==Notable Matchups== Victories:
