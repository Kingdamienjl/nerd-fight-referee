    - field: intelligence
      value: ''''''' ''''''Gifted'''''' in general, ''''''Genius'''''' Combatant (Vector
        runs a fairly successful detective agency and is an accomplished detective
        with a knack for solving riddles and mysteries, such as [https://cdn.imgchest.com/files/c78444e4b24f.jpg
        quickly piecing together the Deadly Six''s motives]Sonic the Hedgehog #41
        with his fellow Chaotix members and investigating Dodon Pa''s motives in ''''Team
        Sonic Racing'''' at the behest of Tails. He is capable of piecing together
        vague clues and other minor hints to reach conclusions that his teammates
        and most others would have overlooked, allowing to see through ruses and cons
        [even from [[Dr. Eggman (Game)|exceptionally devious individuals]]]. Vector
        excels in leadership, such as quickly uniting several of his allies into a
        competent fighting force to face off against Eggman and his Omega Mech. By
        commanding them into groups and roles based on playing to their strengths,
        they were even able to cause noticeable damage despite fighting a losing battle
        before Sonic showed up. A competent fighter, Vector is also capable of taking
        out hordes of [[Eggman Empire|Badniks]], fighting opponents as skilled as
        members of [[Team Dark (Game)|Team Dark]], occasionally assisting the likes
        of [[Sonic the Hedgehog (Modern)#Sonic Forces (Post-Imprisonment) - Ongoing|Sonic]]
        & [[Shadow the Hedgehog (Game)|Shadow]] in battle. Additionally, Vector can
        use his [https://youtu.be/gGXM8uMWM6o?si=JAK560YUvWzE6eOA&t=723 investigative
        skills] to pick up patterns on enemy movement during combatShadow the Hedgehog;
        Cosmic Haunt (Hero) - Vs. Black Doom)'
      source_id: mediawiki-374124
      provider_id: vsbattles
      authority: high
      confidence: 0.75
