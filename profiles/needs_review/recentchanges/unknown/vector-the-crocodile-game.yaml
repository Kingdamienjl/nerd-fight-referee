power_scale:
  tier:
    text: High 5-A | 4-B, higher with Power Cores | Low 2-C by Sonic Free Riders.
      2-C by Sonic Forces
    source_ids: &id002
    - mediawiki-374124
    confidence: 0.8
  attack_potency:
    text: Brown Dwarf level ([https://youtu.be/B0BtvgZ-5oA?t=121 Can help destroy
      Metal Sonic Kai] [https://youtu.be/B0BtvgZ-5oA?t=10 if chosen] and is directly
      comparable to those such as Classic Knuckles and Mighty) | Solar System level
      (Stronger than Adventure Espio and Adventure Charmy. Has been shown to be comparable
      to Adventure Knuckles, who is somewhat stronger than Adventure Sonic in terms
      of raw strength. Aided in the defeat of the Egg Dealer alongside Adventure Shadow
      in one of the possible endings to Shadow The Hedgehog), higher with 3 Power
      Cores ([https://cdn.imgchest.com/files/07589f4a2ba9.jpg each Power Cores doubles
      the user's physical characteristics]) | Universe level+ by Sonic Free Riders
      (Can harm other Extreme Gear racers, such as Sonic and Knuckles, with his bite).
      Low Multiverse level by Sonic Forces (Was part of the Resistance and helped
      fight a horde of Modern Chaos 0, Modern Metal Sonic, Zavok and Modern Shadow
      clones. [https://imgchest.com/p/6eyr3388xyp Fought alongside Modern Espio, Modern
      Tangle, and several others] against Giga Omega and dealt notable damage to it),
      higher with the Boost
    source_ids: *id002
    confidence: 0.8
  speed:
    text: FTL (Comparable to Classic Knuckles), higher with the Spin Attack ([https://imgur.com/pA71oe0
      Classic Vector has his own version] of the Spin Attack, a technique that allowed
      Sonic, Tails Nine, and Renegade Knucks [https://imgur.com/zMhZa2V?r to blitz]
      [https://imgur.com/CLgsXJP?r a group of Eggforcers] that were [https://cdn.imgchest.com/files/6fa15317d45f.mp4
      initially blitzing them]) | Massively FTL+ ([https://www.youtube.com/watch?v=A-EEXvXYRUw
      Kept pace with a casual Adventure Shadow] and could tag the Egg Dealer), higher
      with the Spin Attack and with 3 Power Cores | Massively FTL+ (Fought against
      Phantom Ruby clones of Modern Shadow, Modern Metal Sonic, and Zavok, who could
      pressure Modern Sonic during their confrontation with them before his imprisonment.),
      higher with the Spin Attack and Boost
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class K (Comparable in strength to Classic Knuckles and Mighty) | Class
      M (Comparable to Adventure Knuckles) | At least Class M (Metal Sonic at his
      weakest, [https://imgchest.com/p/o24a9xkvwyl considered in no shape to fight]
      and presenting no real threat after being somewhat repaired by Modern Tails,
      was still capable of breaking the chains that were used to restrain it. Stronger
      than Tangle, whose tail gaped a hole in a reinforced door), possibly Multi-Stellar
      (Shouldn't be far off his fellow Power Type characters like Omega)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Brown Dwarf level (Capable of harming and eventually destroying Metal Sonic
      Kai with his strikes with his fellow Chaotix members and investigating Dodon
      Pa's motives in Team Sonic Racing at the behest of Tails. He is capable of piecing
      together vague clues and other minor hints to reach conclusions that his teammates
      and most others would have overlooked, allowing to see through ruses and cons
      [even from exceptionally devious individuals]. Vector excels in leadership,
      such as quickly uniting several of his allies into a competent fighting force
      to face off against Eggman and his Omega Mech. By commanding them into groups
      and roles based on playing to their strengths, they were even able to cause
      noticeable damage despite fighting a losing battle before Sonic showed up. A
      competent fighter, Vector is also capable of taking out hordes of Badniks, fighting
      opponents as skilled as members of Team Dark, occasionally assisting the likes
      of Sonic & Shadow in battle. Additionally, Vector can use his [https://youtu.be/gGXM8uMWM6o?si=JAK560YUvWzE6eOA&t=723
      investigative skills] to pick up patterns on enemy movement during combat)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Brown Dwarf level (Able to withstand attacks from those such as Metal Sonic
      Kai). Up to Complex Multiverse level (6-D) Damage Transferal with Rings (Having
      enough Rings shields damage from those as strong as Void and Tethered Supreme)
      | Solar System level (Could take hits from enemies who could match Shadow and
      Espio). Up to Complex Multiverse level (6-D) Damage Transferal with Rings |
      Universe level+ by Sonic Free Riders (Can take special Attacks from other Extreme
      Gear racers, like Sonic's Spin Dash). Low Multiverse level by Sonic Forces (Can
      take attacks from Rough and Tumble), up to Complex Multiverse level (6-D) Damage
      Transferal with Rings
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: '(The amount of energy consumed when Boosting) * Air (The amount of time
      possible to spend underwater without air) * Luck (Non-Combat Applicable). Up
      to 3-5 Pets can be equipped at a single time, stacking the benefits from each.
      For a full reference of different Pets and their impact, see here. Trails: Trails
      are equippable items that range from Level 1 to Level 25 at maximum. They typically
      focus on increasing three statistics, but different Trails offer benefits that
      include other statistics. Like Pets, these include altering; * Experience *
      Rings * Damage * Stamina * Air Unlike Pets, only one trail can be equipped at
      any given time. For a full reference of Trails and their impact, see here. Credit
      and thanks to the Sonic'
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range, Hundreds of Meters via ranged based attacks
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Gifted in general, Genius Combatant (Vector runs a fairly successful detective
      agency and is an accomplished detective with a knack for solving riddles and
      mysteries, such as quickly piecing together the Deadly Six''s motivesSonic the
      Hedgehog #41 with his fellow Chaotix members and investigating Dodon Pa''s motives
      in Team Sonic Racing at the behest of Tails. He is capable of piecing together
      vague clues and other minor hints to reach conclusions that his teammates and
      most others would have overlooked, allowing to see through ruses and cons [even
      from exceptionally devious individuals]. Vector excels in leadership, such as
      quickly uniting several of his allies into a competent fighting force to face
      off against Eggman and his Omega Mech. By commanding them into groups and roles
      based on playing to their strengths, they were even able to cause noticeable
      damage despite fighting a losing battle before Sonic showed up. A competent
      fighter, Vector is also capable of taking out hordes of Badniks, fighting opponents
      as skilled as members of Team Dark, occasionally assisting the likes of Sonic
      & Shadow in battle. Additionally, Vector can use his investigative skills to
      pick up patterns on enemy movement during combatShadow the Hedgehog; Cosmic
      Haunt (Hero) - Vs. Black Doom)'
    source_ids: *id002
    confidence: 0.8
