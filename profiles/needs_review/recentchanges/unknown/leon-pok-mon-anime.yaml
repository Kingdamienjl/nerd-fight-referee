power_scale:
  tier:
    text: Likely 9-B | Low 1-C, higher with Gigantamax
    source_ids: &id002
    - mediawiki-5083309
    confidence: 0.8
  attack_potency:
    text: "Likely Wall level (Leon should be comparable to other Pok\xE9mon trainers\
      \ like Ash and Team Rocket, and is capable of throwing the likes of Dynamax\
      \ BallsPok\xE9mon Journeys - Episode 12: Flash of the Titans!) | Low Complex\
      \ Multiverse level (Leon is the undisputed champion of the Galar Region, and\
      \ is ranked #1 in the World Coronation as a member of the Masters 8 with his\
      \ Pok\xE9mon team, ranking above other Champion-tier characters such as Cynthia,\
      \ whose Garchomp was capable of cancelling out Palkia\u2019s Spacial Rend with\
      \ Draco Meteor.Pok\xE9mon the Series: Diamond & Pearl - Episode 152: The Battle\
      \ Finale of Legend!Palkia is assumed to be comparable to its representation\
      \ in the Games, as it is the treated as the representation of space in the Pok\xE9\
      mon multiverse as a whole. Although Palkia's Spacial Rend was done in retaliation\
      \ to Garchomp's Draco Meteor, Palkia was berserk and unrestrained within the\
      \ Red Chain, and was able to cancel out compared to the combined efforts of\
      \ Pikachu, Piplup and Croagunk against Dialga's Roar of Time (who was in the\
      \ same berserk state as Palkia). This suggests there was no restraint on power\
      \ on Palkia's end, and was not trying to merely block Draco Meteor. Leon has\
      \ been able to fight base form Eternatus using Charizard, though was ultimately\
      \ overwhelmed by Eternamax Eternatus.Pok\xE9mon Journeys - Episode 44: Sword\
      \ and Shield: \"From Here to Eternatus!\" Leon has been able to defeat the likes\
      \ of other powerful trainers without being psuhed, such as AshPok\xE9mon Journeys\
      \ - Episode 13: The Climb to Be the Very Best!, Lance, RaihanPok\xE9mon Journeys\
      \ - Episode 27: Toughing It Out!, Flint, AlainPok\xE9mon Journeys - Episode\
      \ 115: Curtain Up! Fight the Fights! and Diantha.Pok\xE9mon Journeys - Episode\
      \ 122: It's\u2026 Champion Time! In his climactic battle with Ash, he had managed\
      \ to push Ash and Pikachu to extreme lengths in order to defeat himPok\xE9mon\
      \ Journeys - Episode 132: Partners in Time!, while Ash was allowed to use all\
      \ of his special gimmicks in Mega Evolution, Z-Moves and Gigantamaxing), higher\
      \ with Gigantamax (Leon has notably been able to Gigantamax his Charizard, Rillaboom\
      \ and Cinderace, which gives them a strong temporary boost to their size and\
      \ power)"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: "Likely Superhuman with Massively FTL+ to Infinite reactions (As a World\
      \ Champion, Leon should be comparable, if not superior to other top-tier trainers\
      \ such as Ash, and is able keep track of his Pok\xE9mon battling, which requires\
      \ him to constantly analyze the battle and give commands at any moment accordingly.\
      \ Leon in particular was able to react to and avoid an attack from Eternatus,\
      \ and is capable to giving his commands quick enough to react to Pok\xE9mon\
      \ such as Lance's Gyrados, Flint's Infernape and Ash's DragonitePok\xE9mon Journeys\
      \ - Episode 131: Paring Pok\xE9mon While Parrying! as they are happening) |\
      \ At least Massively FTL+, likely Infinite (Leon's team stand at the pinnacle\
      \ of trainer-owned Pok\xE9mon across the world, and should be easily comparable\
      \ to the likes of other top-tier trainers' Pok\xE9mon such as Ash's and Cynthia's.\
      \ His Charizard could react to the likes of Flint's Infernape's Mach Punch and\
      \ intercept attacks from the likes of Eternatus for a few examples)"
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Unknown (Leon can easily throw a Dynamax Ball far into the air)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Likely Wall level | Low Complex Multiverse level with Gigantamax
    source_ids: *id002
    confidence: 0.8
  durability:
    text: "Unknown, at least Wall level, possibly higher (Pok\xE9mon Trainers are\
      \ usually portrayed as being capable of withstanding moves from Pok\xE9mon,\
      \ though are portrayed as regular humans and can still be injured mundanely.\
      \ Leon in particular was able to survive the pure energy released by Eternatus'\
      \ Eternamax form, though he was knocked unconscious afterwardsPok\xE9mon Journeys\
      \ - Episode 45: Sword and Shield... The Legends Awaken!) | Low Complex Multiverse\
      \ level (Leon's Pok\xE9mon are capable of withstanding attacks from multiple\
      \ powerful Pok\xE9mon on the level of other Masters' 8 members. His Pok\xE9\
      mon such as Charizard have been shown to be able to take super effective attacks,\
      \ such as Aqua Tail from Gyrados and continue fighting, who could also take\
      \ Ash's Gigantamaxed Pikachu's electricity. Charizard has also been able to\
      \ survive attacks from Eternatus without immediately being taken out)"
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: "Unknown physically | Superhuman (Leon's Pok\xE9mon stand at the pinnacle\
      \ of trainers, and can consistently fight and stand victorious in 6v6 battles.\
      \ Leon's Pok\xE9mon also tend to have more left standing than his opponents,\
      \ such as how he could defeat Alain without needing to reveal his third Pok\xE9\
      mon, as well as defeated all of Diantha's Pok\xE9mon with four of his Pok\xE9\
      mon left remaining in a 6v6 As Galar's Champion, Leon is also heavily accustomed\
      \ to fighting the likes of Dynamax and Gigantamax Pok\xE9mon)"
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range | Standard Melee Range with physical attacks; Hundreds
      of Meters to Kilometers with Ranged attacks
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: "At least Gifted, likely Genius in Pok\xE9mon & Battling (Leon is ranked\
      \ the #1 Pok\xE9mon Trainer within the World Coronation Series, and was previously\
      \ the reigning Champion before losing to Ash. His strategies are able to easily\
      \ overwhelm and counter the likes of other champion-tiered trainers such as\
      \ Lance and Diantha, and he is described as a genius with unmatched observational\
      \ skills. He is capable of advanced learning and observation of his opponent's\
      \ strategies, and can even replicate them like he did with Inteleon copying\
      \ Pikachu's Counter Shield Strategy. As the champion, Leon is also highly knowledgeable\
      \ about Pok\xE9mon, being able to easily calm and befriend a wild Corviknight,\
      \ as well as shares a lot of understanding about the phenomena surrounding them\
      \ such as Dynamax, Gigantamax and even Mega EvolutionPok\xE9mon Journeys - Episode\
      \ 86: A Battle of Mega Versus Max) Standard Tactics: *As the highest ranked\
      \ trainer in the world, Leon offers a diverse and overwhelming set of skills\
      \ and strategies to his battling, that are effective in both long-term planning\
      \ or improvised as the battle is ongoing, even against other strategically-advanced\
      \ Pok\xE9mon champions such as Ash and Diantha. He is highly perceptive of his\
      \ opponents, and is stated to learn from every battle he watches. *Charizard\
      \ is considered his Ace Pok\xE9mon, and he will usually rely on it when sizing\
      \ up to other powerful Pok\xE9mon such as Diantha's Mega Gardevoir, Ash's Pikachu\
      \ and even Eternatus. His Rillaboom is also notably powerful and used to sweep\
      \ his opponents like it did against Diantha. His Cinderace and its versatile\
      \ Libero ability allows him to change its type to better suit particular matchups,\
      \ such as making it resist Pikachu's Thunderbolt by transforming into a Ground-type.\
      \ Leon is also very accustomed to switching his Pok\xE9mon out and managing\
      \ his numbers to maintain advantage, and even employs the likes of Dragapult's\
      \ Dragon Tail to manipulate his opponent's ability to switch."
    source_ids: *id002
    confidence: 0.8
