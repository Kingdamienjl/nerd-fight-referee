    \ Pok\xE9mon such as Diantha's Mega Gardevoir, Ash's Pikachu and even Eternatus.\
    \ His Rillaboom is also notably powerful and used to sweep his opponents like\
    \ it did against Diantha. His Cinderace and its versatile Libero ability allows\
    \ him to change its type to better suit particular matchups, such as making it\
    \ resist Pikachu's Thunderbolt by transforming into a Ground-type. Leon is also\
    \ very accustomed to switching his Pok\xE9mon out and managing his numbers to\
    \ maintain advantage, and even employs the likes of Dragapult's Dragon Tail to\
    \ manipulate his opponent's ability to switch."
