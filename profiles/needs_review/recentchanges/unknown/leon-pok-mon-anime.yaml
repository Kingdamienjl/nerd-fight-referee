    - field: intelligence
      value: "At least Gifted, likely Genius in Pok\xE9mon & Battling (Leon is ranked\
        \ the #1 Pok\xE9mon Trainer within the World Coronation Series, and was previously\
        \ the reigning Champion before losing to Ash. His strategies are able to easily\
