  section: weaknesses
  axis: weakness
  text: "Like his game counterpart, Leon is hopeless when it comes to navigating and\
    \ directions. Trainers cannot Gigantamax without Dynamax Energy present in the\
    \ surrounding area, such as in the stadiums of Galar. Pok\xE9mon: The Pok\xE9\
    mon considered are only ones that Leon has directly been shown to own and use\
    \ in battle. This excludes the likes of Eternatus, who although Leon had been\
    \ taking care of it in order to get it closer to human-relationship, it has not\
    \ been shown to be utilised or properly owned as an asset to him. Similarly to\
    \ the games, Pok\xE9mon are only seen being able to use 4 moves at a time (with\
    \ few exceptions), however their movesets are freely able to be changed in between\
    \ matches, similar to what happened during the Masters 8 Tournament. Therefore,\
    \ these moves are not outright forgotten by the Pok\xE9mon using them."
