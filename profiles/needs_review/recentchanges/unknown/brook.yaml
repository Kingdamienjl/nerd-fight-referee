- id: claim-powers-and-abilities-e95565b7
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Adept Swordsman (Specializes in fencing)
    *Water Walking *Immortality (Types 2 and 7; Unaffected by having his head and
    other body parts detached) *Soul Manipulation and Resurrection (Ate the Yomi Yomi
    no Mi, a Paramecia type Devil Fruit which allows the user to come back to life
    and allows the user to access other soul-based abilities) *Inorganic Physiology
    (Type 1) *Sleep Manipulation (Via Nemuriuta: Flanc) *Limited Regeneration (High-Low;
    Can regenerate wounds such as large cracks on his skull by drinking milk) *Statistics
    Amplification (Speed; can enhance his speed to the point where he can blitz those
    who can normally keep up with him via Yahazu Giri and similar moves) *Possibly
    Empathic Manipulation when playing music (Uses music to inspire cultists to fight
    for themselves) *Immunity to Water Absorption (Due to being a skeleton) Resistance
    to *Electricity Manipulation (Due to not having flesh. He also covered himself
    in lightning to attack Oars without showing major damage) *Extreme Temperatures
    (Was unbothered by the cold side of Punk Hazard even in his normal attire and
    survived getting caught in a Pacifista laser explosion although was badly injured)
    Same as before, to a greater degree *Astral Projection (Can separate his soul
    to move individually of his body) *Body Control (Can reattach his head and other
    body parts) *Ice Manipulation (Able to freeze objects and people by channeling
    the power of his soul through his sword [Soul Solid, the "Freezing Sword"]) *Non-Physical
    Interaction (Capable of affecting and damaging Big Mom homies such as Zeus and
    Prometheus), Spiritual Awareness *Large Size (Type 0; 2.77 m) *Air Manipulation
    (Can generate wind blades with sword slashes and thrusts, can also use this in
    conjunction with his freezing ability) *Durability Negation (Can freeze the blood
    flow of opponents, affecting them internally. Can hit the soul) *Broadway Force
    *Mind Manipulation when playing music (Able to hypnotize people with music: forcing
    them to sleep, create illusions in their minds, etc.) Resistance to *Madness Manipulation,
    Mind Manipulation and Soul Manipulation via Willpower (Through sheer willpower
    they can resist losing their mind when absorbing shadows through the Kage Kage
    no Mi. Shadows belonging to strong willed people are difficult to control, allowing
    them to rebel against Moria''s pact which usually immediately submits a shadow
    to his supremacy and orders. Spiritual energy is contained within one''s soul/life;
    this energy is represented by the fighting power or the Haki itself. Those with
    strong souls, which are homologous to shadows, resist the effects of his own soul
    manipulation)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
