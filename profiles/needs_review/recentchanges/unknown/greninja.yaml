- id: claim-powers-and-abilities-2f14b799
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics *Water Manipulation (Froakie can secrete\
    \ flexible bubbles from its chest and back. The bubbles reduce the damage it would\
    \ otherwise take when attackedPok\xE9mon X and YPok\xE9mon Ruby/Sapphire/Emerald/Omega\
    \ Ruby/Alpha Sapphire. Can utilize Water-type moves such as Water Pulse and Water\
    \ Gun) *Acrobatics (Froakie utilizes its extraordinary jumping abilities to flummox\
    \ its foesPok\xE9mon Scarlet and Violet) *Statistics Amplification (Torrent boosts\
    \ the power of Water-type moves by 50% when the Pok\xE9mon is at 1/3 of their\
    \ HP. Power-Up Punch makes the user's fists harder upon hitting a target which\
    \ boosts their attack) *Sound Manipulation and Social Influencing (Growl makes\
    \ an opponent lower their attack by cutely growling at them) *Status Effect Inducement\
    \ **Paralysis Inducement (Lick has a 30% chance of paralyzing the target) **Mind\
    \ Manipulation (Water Pulse has a 20% chance of confusing the target) *Smoke Manipulation\
    \ (Smokescreen has the user release an obscuring cloud of smoke or ink which lowers\
    \ their accuracy) *Homing Attack (Water Pulse can bypass accuracy and evasion\
    \ checks to always hit) *Afterimage Creation (Double Team has the user make illusory\
    \ copies of itself by moving rapidly to boost it's evasiveness) *Poison Manipulation\
    \ (Toxic Spikes lays a trap of poison spikes at the foe's feet which poisons opposing\
    \ Pok\xE9mon that switch into battle) *Telepathy (Mind Reader lets the user senses\
    \ the foe's action to ensure its next move hits) Resistance to; *Steel-type, Fire\
    \ Manipulation, Water Manipulation, Ice Manipulation (Only takes 1/2 damage from\
    \ Steel, Fire, Water, and Ice-type attacks) *Marksmanship (Frogadier can throw\
    \ bubble-covered pebbles with precise control, being able to hit cans over 100\
    \ feet away) *Surface Scaling (The tips of its fingers and toes stick firmly to\
    \ vertical surfaces. Frogadier can scale skyscrapers and 2,000 feet towers with\
    \ ease) Same as before including; *Enhanced Water Manipulation and Weapon Creation\
    \ (Greninja can make shuriken out of mucus excreted from its thighs. These shuriken\
    \ can cut cleanly through steel cables) *Stealth Mastery (It appears and vanishes\
    \ with a ninja's grace. It toys with its enemies using swift movements, while\
    \ slicing them with throwing stars of sharpest water) *Enhanced Senses (The movement\
    \ of air against the long tongue Greninja keeps wrapped around its neck allows\
    \ it to sense enemies it can\u2019t see) *Statistics Amplification/Statistics\
    \ Reduction Nullification (Haze eliminates every stat change among all the Pok\xE9\
    mon engaged in battle) *Power Mimicry (Role Play has the user mimic the target\
    \ completely, copying the target's Ability) *Darkness Manipulation (Shadow Sneak\
    \ has the user extends its shadow and attack the target from behind) *Telekinesis\
    \ (Extrasensory attacks the target with an odd, unseeable power) As Mega Greninja:\
    \ **Greater Water Manipulation (Creates and maintains a large water Shuriken from\
    \ it's mucus secreted from a gelatinous membrane) **Possibly minor Social Influencing\
    \ (It's large Shuriken distracts foes and catches them off guard) Resistance to;\
    \ *Ghost-type, Steel-type, and Darkness Manipulation (Only takes 1/2 damage from\
    \ Ghost, Steel, and Dark-type attacks) Immunity (within reason) to; *Telekinesis\
    \ (It's Dark-typing grants an Immunity to Psychic-type moves)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
