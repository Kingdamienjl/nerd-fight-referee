    confidence: 0.8
  attack_potency:
    text: "Below Average Human level (A typical BB pistol could only enter but not\
      \ exit a single empty soda can; a cheap BB rifle can shoot down songbirds such\
      \ as sparrows and starlings, grasshoppers, and small lizards; A BB with a velocity\
      \ of 45 m/s can pierce skin, and a BB with a velocity of 60 m/s can fracture\
      \ boneTsui, Cl; Tsui, Kl; Tang, Yh (November 2010). \"Ball Bearing (BB) Gun\
      \ Injuries\". Hong Kong Journal of Emergency Medicine. 17 (5): 488\u2013491.\
      \ CiteSeerX 10.1.1.1088.5686. doi:10.1177/102490791001700510. S2CID 9643574.\
      \ KE ratings can go from 1.16424 joules for a lever-action BB gun to 1.9965\
      \ joules for rifles such as the Red Ryder and the Daisy Model 25.)"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: 'Subsonic effective firing speed (Lever-action BB guns have firing speeds
      as low as 84 m/s; the Daisy Model 25 has a firing speed of 350 feet per second
      (106.68 m/s),https://www.daisy.com/product/Model-25-Pump-Gun/?itemnumber=990025-001
      but had been noted to have firing speeds of 114 to 145 m/sWikipedia: BB gun)
      Wielders: Children, small game hunters, once used by the US military for quick-kill
      training in the later stages of the Vietnam War'
    source_ids: *id002
