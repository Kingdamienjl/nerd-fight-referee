    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: 'General= Gifted (Espio is a member of the fairly successful Chaotix Detective
      Agency, having a keen and analytical mind alongside experience in investigation,
      solving mysteries, and gathering intel. Typically the most rational and intelligent
      member of the Chaotix, as he is [https://www.youtube.com/watch?v=8s93LWNZRiU&t=282s
      fluent in 17 different languages and is able to quickly memorize books in a
      short timeframe].. Espio also possesses combat prowess on a similar level to
      the likes of Sonic and Knuckles, being referred to as one of the two best-trained
      fighters) * Chroma Camo: Espio focuses his powers to become invisible and intangible
      as well as increase his speed. * Leaf Swirl: Espio generates a cyclonic vortex
      laced with razor-sharp leaves before turning invisible and intangible. The tornado
      can send enemies flying, blow away their weaponry/equipment, and disorient enemies.
      He has even used this to [https://imgchest.com/p/ej7mpw2wb7d form gusts of wind]
      against Zazz. * Spin'
    source_ids:
    - vsbattles-espio-the-chameleon-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
