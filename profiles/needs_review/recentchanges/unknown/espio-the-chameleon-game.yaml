  attack_potency:
    text: Brown Dwarf level (Comparable to Classic Knuckles and Classic Charmy. [https://youtu.be/B0BtvgZ-5oA?t=121
      Can help destroy Metal Sonic Kai] [https://youtu.be/B0BtvgZ-5oA?t=10 if chosen])
      | Solar System level (Put up a good fight against the members of Adventure Team
      Dark and Adventure Team Rose and should be somewhat comparable to Adventure
      Vector, who can contribute to the defeat of the Egg Dealer alongside Adventure
      Shadow), higher with 3 Power Cores ([https://cdn.imgchest.com/files/07589f4a2ba9.jpg
      each Power Cores doubles the user's physical characteristics]) | High Universe
      level (Helped Silver take down the Ifrit) to Low Multiverse level ([https://youtu.be/aV5iGjkHuWw
      Fought against Modern Sonic] during Sonic Generations and was part of the Resistance
      that fought against clones of Modern Chaos 0, Modern Shadow, Zavok and Modern
      Metal Sonic. [https://imgchest.com/p/wl7lpgrgpyx Harmed and staggered Zazz].
      Fought alongside [https://imgchest.com/p/6eyr3388xyp Modern Vector, Amy, Tails,
      and several others] to fight Giga Omega), higher with the Boost
    source_ids:
    - vsbattles-espio-the-chameleon-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: FTL (As fast as those such as Classic Knuckles), higher combat speed with
      Hyper Mode (Hyper Mode is a combat speed amplification enabled by a Chaos Emerald,
      which [https://imgur.com/a/fake-chaos-emeralds-are-superior-boost-to-power-cores-TpFHy7m
      grant greater statistical amplifications] than [https://cdn.imgchest.com/files/07589f4a2ba9.jpg
      Power Cores]), higher with the Spin Attack (Adventure Espio [https://imgur.com/pA71oe0
      can perform the Spin Attack], a technique that allowed Sonic, Tails Nine, and
      Renegade Knucks [https://imgur.com/zMhZa2V?r to blitz] [https://imgur.com/CLgsXJP?r
      a group of Eggforcers] that were [https://cdn.imgchest.com/files/6fa15317d45f.mp4
      initially blitzing them]) | Massively FTL+ (Kept up with Adventure Sonic and
      Adventure Shadow), higher with the Spin Attack and with 3 Power Cores | Massively
      FTL+ (Can keep pace with Silver and race against the likes of Modern Rouge and
      Modern Knuckles. Able to [https://imgchest.com/p/xny8nvo5oyb keep up with Modern
      Sonic]), higher with the Spin Attack and Boost
    source_ids:
    - vsbattles-espio-the-chameleon-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class K (Comparable to others such as Classic Vector and Mighty) | Class
      M (Comparable to members of Adventure Team Dark and Adventure Team Rose) | At
      least Class M (Modern Metal Sonic, [https://imgchest.com/p/o24a9xkvwyl while
      repaired only to the extent of being a non-threat and hardly being able to stand],
      was still capable of breaking chains that were used to restrain it)
    source_ids: &id002
    - mediawiki-513595
    confidence: 0.8
  striking_strength:
    text: Brown Dwarf level (Can harm Metal Sonic Kai with his strikes) | Solar System
      level (Can damage Adventure Eggman creations capable of fighting Adventure Sonic
      and fought enemies side by side with Adventure Shadow during the Black Arms
      invasion) higher with 3 Power Cores | High Universe level (Harmed the Ifrit
      with its strikes) to Low Multiverse level (Capable of directly harming Modern
      Sonic in Sonic Generations)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Brown Dwarf level (Can take attacks from Metal Sonic Kai). Up to Complex
      Multiverse level (6-D) Damage Transferal with Rings ([https://imgur.com/a/S9khfwT
      Having enough Rings] [https://imgur.com/a/qWYslO8 shields damage from those
      as strong as] Void and Tethered Supreme). Up to Complex Multiverse level (6-D)
      Damage Transferal with Rings
    source_ids:
    - vsbattles-espio-the-chameleon-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman | Superhuman (Journeyed for 3 days over the course of Sonic Heroes
      with minimal to no rest) | Superhuman (Journeyed through days of the Metal Virus
      on the front lines, doing things such as sleeping in shifts only to immediately
      begin working on finding survivors once he awakes. Despite [https://imgchest.com/p/qb4z2ewb54j
      the loss of his closest friends], he continued on until the very end of the
      plague and played a key role in securing one of the Chaos Emeralds from Zazz
      to help save the world)
    source_ids:
    - vsbattles-espio-the-chameleon-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
