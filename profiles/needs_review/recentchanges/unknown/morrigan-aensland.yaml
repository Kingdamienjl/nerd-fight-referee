- id: claim-weaknesses-a8f426f3
  section: weaknesses
  axis: weakness
  text: 'Dependent on stimulation, her own or by absorbing the liquid produced by
    the brain of others while dreaming. She would die within two days if she does
    not feed or receive a stimulation. Has trouble operating in sunlight. A strong
    mind/spirit can resist the madness-inducing effect of her aura and a dark heart
    can resist the corruption. Those with very strong minds can resist the effects
    of her body odor. Note: All the references not included in this profile are provided
    on the verse page. File:SoulFist.gif|Soul Fist File:ShadowBlade.gif|Shadow Blade
    File:AirDash.gif|Vertical Dash and Dash Shift File:VectorDrain.gif|Vector Drain
    File:ValkyrieTurn.gif|Valkyrie Turn File:DarknessIllusion.gif|Darkness Illusion
    File:FinishingShower.gif|Finishing Shower File:CrypticNeedle.gif|Cryptic Needle
    File:AstralVision.gif|Astral Vision *Soul Fist: Morrigan points the arm towards
    the opponent and fires a bat-shaped projectile made of energy. She can also enhance
    the strength of the attack, making it larger and shaped like the skull of a bat.
    *Shadow Blade: Morrigan turns one of her wings into a blade and performs an uppercut
    *Vertical Dash and Dash Shift: Morrigan turns her wings into rocket engines and
    dashes in the air. She can also control the direction in which she fly. *Vector
    Drain: Morrigan turns her wings into rocket engines and hugs the opponent, dragging
    them in the air. After a moment, she flips upside-down and drives the opponent
    head-first into the ground. *Valkyrie Turn: Morrigan turns her wings into rocket
    engines and flies away. After a moment, she comes back with her legs engulfed
    in her wings, which now have the shape of a drill, and pierces the opponent multiple
    times. *Darkness Illusion: Morrigan turns her wings into rocket engines and flies
    towards the opponent. After hittim them, she creates a duplicate of herself and
    proceed to deliver a flurry of attacks at the opponent, while the clone copies
    her movements. *Finishin Shower: Morrigan changes the shapes of her wings and
    starts floating in the air. She then fires a barrage of bullets made with her
    body matter. *Cryptic Needle: Morrigan covers her arm with her wings to form a
    claw-like shape and extends it towards the opponent. If the attack lands, the
    opponent is stabbed by mutliple needles, while their energy gets absorbed and
    used to restore that of Morrigan. *Astral Vision: Morrigan creates a duplicate
