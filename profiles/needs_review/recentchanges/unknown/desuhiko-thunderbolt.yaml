- id: claim-standard-equipment-bdd8bbc1
  section: equipment
  axis: equipment
  text: "200px|right|Desuhiko's Backpack Backpack: For his Disguise Forte, Desuhiko\
    \ carries an oversized yellow and black backpack, containing all of his disguise\
    \ tools required for his Forte. It is unknown whether this backpack was supernaturally\
    \ created by Desuhiko\u2019s Forte, or whether it was an existing item that is\
    \ used as a conduit. When changing into disguises generated by his Forte, Desuhiko\
    \ (and anyone else accompanying him) must enter the backpack and he cannot create\
    \ supernatural disguises outside of it. It is also implied that he can carry real\
    \ items inside the backpack, given it is also used as his suitcase.Master Detective\
    \ Archives: RAIN CODE - Epilogue: RAIN CODE Desuhiko claims to have \u2018tons\
    \ of different disguise tools\u2019 that are used to form the aspects of the disguise,\
    \ however the ones confirmed include: * Voice Changers: Desuhiko uses voice changers\
    \ that he can slip underneath disguises to match voices with who he is disguising\
    \ as. He claims to be able to set a perfect matching impression if he\u2019s heard\
    \ it just once. * Tape/Padding: Tape and Padding are used to change the overall\
    \ width of body dimensions, where tape is used to make a body thinner, while padding\
    \ makes them thicker. *Fake Blood: Desuhiko has been shown to replicate the pink\
    \ blood of the citizens of Kanai Ward in his disguises, and can likely replicate\
    \ real blood too.Master Detective Archives: RAIN CODE - Chapter Fubuki: Fubuki's\
    \ Luckiest Day {| class=\"wikitable mw-collapsible mw-collapsed\" !Optional/Preparatory"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
