      value: "At least Athlete level (Although he has not been shown to be proficient\
        \ in fighting, Desuhiko was capable of temporarily restraining the likes of\
        \ Yomi Hellsmile, Martina Electro and a peacekeeper by grabbing onto them.)\
        \ Likely higher within a Mystery Labyrinth (When entering a Mystery Labyrinth\
        \ through the shared effects of Yuma\u2019s Coalescence ability, Desuhiko\
        \ is seemingly capable of assisting against Mystery Phantoms, as well as able\
        \ to defend Yuma from their attacks.Mystery Labyrinths are separate alternate\
        \ universes that are formed as the manifestation of unsolved mysteries, where\
        \ a pact with Shinigami allows Yuma to interact and perform superhuman feats\
        \ he is normally not capable of doing within them. This is through the use\
        \ of his understanding and acquired clues of the case. When sharing a limited\
        \ version of this pact with Desuhiko via Coalescence, this may as a result\
        \ also grant him similarly enhanced statistics, although he is unable to interact\
        \ with the Labyrinth in the same way as Yuma.)"
      source_id: vsbattles-desuhiko-thunderbolt-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: 'Unknown (Desuhiko implies that the disguises created by his Forte need
        to be manually worn, meaning he can change into these outfits superhumanly
        quick. Was also able to draw a map of the Mystery Labyrinth in quick succession,
        looking as if he was teleporting. Desuhiko can move so fast, he kicks up a
        dust cloud with his movements), possibly High Hypersonic in Perception, Reaction
        and Combat speed (Could potentially be comparable in reaction speed to Fubuki
        Clockford, who can activate their Forte while reacting to fired bullets0.000055
        second-window and detonated explosions.Master Detective Archives: RAIN CODE
        - Chapter 3: No Longer A Detective), possibly higher within a Mystery Labyrinth
        (Desuhiko could keep up with Yuma and Shinigami in the Mystery Labyrinth,
        while they were outrunning a large boulder.)'
      source_id: vsbattles-desuhiko-thunderbolt-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: durability
      value: At least Athlete level (Withstood a direct kick from Martina that sent
        him flying a few metres. Withstood a punch to the face from a peacekeeper
        with only mild complaining), likely higher within a Mystery Labyrinth (Shinigami
        implies that Yuma is more durable within a Mystery Labyrinth, and would not
        instantly die to a gunshot unlike the real world. This likely extends to Desuhiko,
        who under Yuma's shared Coalescence ability, also gains a limited interaction
        within the Labyrinth and can provide support for Yuma. Desuhiko, like the
        other detectives, could survive falling a great height into the Mystery Labyrinth.Yuma
        remarks multiple times that entering the Mystery Labyrinth through falling
        and landing is painful. Desuhiko in particular also does this. Therefore,
        it is more than likely a valid showing of physical durability exclusively
        within the Mystery Labyrinth, as opposed to a form of teleportation. Desuhiko
        in particular was a victim of multiple slapstick-based injuries within his
        turn using Coalescence, such as being punched in quick succession by Shinigami
        or being thrown into walls with no lasting injuries)
      source_id: vsbattles-desuhiko-thunderbolt-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: stamina
      value: "At least Athletic (Was able to navigate through a Mystery Labyrinth\
        \ alongside Yuma, which involved activities such as running from boulders,\
        \ jumping from platforms and climbing up long sets of stairs without being\
        \ too out of breath), Unknown with Disguise (Desuhiko\u2019s disguises require\
        \ concentration and stamina in order to maintain, with his body gradually\
        \ being strained both physically and mentally while using them. With it, Desuhiko\
        \ has been able to maintain up to two disguised persons, and five separate\
        \ changes of disguises for likely over an hour, which he claims is the longest\
        \ he has ever pushed it for the sake of Yuma)"
      source_id: vsbattles-desuhiko-thunderbolt-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: range
      value: Standard Melee Range
      source_id: vsbattles-desuhiko-thunderbolt-unknown
