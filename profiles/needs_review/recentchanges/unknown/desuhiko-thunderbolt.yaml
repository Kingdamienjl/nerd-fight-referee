- id: claim-powers-and-abilities-af39a703
  section: abilities
  axis: hax
  text: '{{Border|Scroll=Yes|Visible=Yes|content= *Possibly Superhuman Physical Characteristics
    *Skilled Detective (Desuhiko is a licensed Master Detective for the World Detective
    Organisation, a global detective agency overseen by the Unified Government. He
    was acclaimed and trusted enough to be dispatched to Kanai Ward, in order to assist
    in solving the ''Great Global Mystery''. and playing instruments such as the [https://youtu.be/EwlLHpG3Oxk?si=0HI9y9d2gUO9GyrU&t=168
    guitar and bass.]) *Social Influencing (Charisma; In both his undercover work
    and in his pursuit of becoming a star, Desuhiko has trained his ability to exude
    charisma in everything he does, allowing him to easily gain information from others
    and negotiate. Despite this, he frequently fails when it comes to using this for
    personal reasons, such as picking up women; Deception; Alongside his Disguise
    Forte [https://youtu.be/DfAn0SpK5G0?si=iYoKHU1ZKUTqR92g&t=686 being great at deceiving
    prying eyes], Desuhiko is a skilled actor and liar who can expertly fool others
    in both pretending to be someone and intellectual strategy) *Photographic Memory
    ([https://youtu.be/hFSz7I0NO8Q?si=bfXypKaaM0_NRtxS&t=1047 Desuhiko, in tandem
    with his Disguise, has a perfect photographic memory, particularly when it comes
    to memorising someone''s appearance, voice and other information about them. With
    this, it allows him to create perfect disguises from only a glance.] [https://youtu.be/KiTuQuOCH98?si=1IANqng2EaTppi32&t=5395
    This also extends to him being able to perfectly recreate maps by hand.]) *Stealth
    Mastery & Disguising (Desuhuko excels at using disguises for his undercover investigations,
    allowing himself and others to expertly infiltrate anywhere as someone else) **Body
    Control & Limited Shapeshifting (Desuhiko is able to alter his size, weight, build
    and other proportions to fit in tandem using disguise tools. [https://youtu.be/djyq0XZCZ-c?si=yCUilD57VggXOlsk&t=3422
    He also states he is able to alter joints to a certain point.], and is the victim
    of multiple slapstick-style attacks with little to no lasting pain.)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
