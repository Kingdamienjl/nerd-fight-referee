        is able to alter his size, weight, build and other proportions to fit in tandem
        using disguise tools. [https://youtu.be/djyq0XZCZ-c?si=yCUilD57VggXOlsk&t=3422
        He also states he is able to alter joints to a certain point.], and is the
        victim of multiple slapstick-style attacks with little to no lasting pain.)'
