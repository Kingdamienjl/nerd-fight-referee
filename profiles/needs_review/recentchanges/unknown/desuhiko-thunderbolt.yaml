      confidence: 0.75
    - field: standard_equipment
      value: "200px|right|Desuhiko's Backpack Backpack: For his Disguise Forte, Desuhiko\
        \ carries an oversized yellow and black backpack, containing all of his disguise\
        \ tools required for his Forte. It is unknown whether this backpack was supernaturally\
        \ created by Desuhiko\u2019s Forte, or whether it was an existing item that\
        \ is used as a conduit. When changing into disguises generated by his Forte,\
        \ Desuhiko (and anyone else accompanying him) must enter the backpack and\
        \ he cannot create supernatural disguises outside of it. It is also implied\
        \ that he can carry real items inside the backpack, given it is also used\
        \ as his suitcase.Master Detective Archives: RAIN CODE - Epilogue: RAIN CODE\
        \ Desuhiko claims to have \u2018tons of different disguise tools\u2019 that\
        \ are used to form the aspects of the disguise, however the ones confirmed\
        \ include: * Voice Changers: Desuhiko uses voice changers that he can slip\
        \ underneath disguises to match voices with who he is disguising as. He claims\
        \ to be able to set a perfect matching impression if he\u2019s heard it just\
        \ once. * Tape/Padding: Tape and Padding are used to change the overall width\
        \ of body dimensions, where tape is used to make a body thinner, while padding\
        \ makes them thicker. *Fake Blood: Desuhiko has been shown to replicate the\
        \ pink blood of the citizens of Kanai Ward in his disguises, and can likely\
        \ replicate real blood too.Master Detective Archives: RAIN CODE - Chapter\
        \ Fubuki: Fubuki's Luckiest Day {| class=\"wikitable mw-collapsible mw-collapsed\"\
        \ !Optional/Preparatory"
      source_id: vsbattles-desuhiko-thunderbolt-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: "Standard Tactics: *Desuhiko specializes in undercover investigations,\
        \ and uses his Disguise Forte to naturally blend in and obtain information\
        \ from the inside. As such, he tends to begin by gathering sizable amounts\
        \ of information from people, which his photographic memory allows him to\
        \ piece together quickly. When using Disguise, although he has shown capable\
        \ of concealing it normally, he will usually hide his backpack somewhere out\
        \ of sight. *Desuhiko is usually more passionate about figuring out a case\
        \ if it will net him popularity, or if it will tarnish the image of a \u2018\
        rival\u2019 who is more famous than him, such as the Nine-Tailed Cat. *In\
        \ physical confrontations, although he would tend to avoid them on his own,\
        \ he is prone to recklessly endangering himself in order to let others get\
        \ away, even with guns pointed at him. He will usually grab onto an opponent,\
        \ such latching onto Martina to give Yuma a chance to escape, as well as again\
        \ with Yomi."
      source_id: vsbattles-desuhiko-thunderbolt-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Notable Attacks/Techniques: Forensic Forte - Disguise: A Forensic Forte\
        \ is a supernatural ability used by Master Detectives of the World Detective\
        \ Organisation, that can be used to assist in specialised investigative work\
        \ deriving from existing talents/dispositions of the individual. To develop\
        \ one, the person must excel at the original basis of a talent, which the\
        \ WDO can then train and develop into a Forte.\"Forensic Forte\" Glossary\
        \ term (Master Detective Archives: RAIN CODE)Gumshoe Gab - Gab with Halara\
        \ Vol.2 (Master Detective Archives: RAIN CODE) Desuhiko\u2019s Forte was developed\
        \ through his innate talent for making disguises and pretending to be others,\
        \ which he had always been naturally gifted at. right|300px|Desuhiko using\
        \ his Forte to disguise as Yakou Desuhiko's Forte is entitled 'Disguise' and\
        \ allows him to create and change into disguises, using the tools held inside\
        \ the backpack he carries around with him. He uses this ability in his undercover\
        \ detective work, being able to perfectly match and infiltrate into places\
        \ in order to obtain information to solve a case, even while it is still ongoing\
        \ without being caught. In addition to being able to create clothing and other\
        \ materials in his disguises, Desuhiko's Forte in itself allows him to change\
        \ physical aspects of his body such as his height, build and facial structure\
        \ by adjusting joints or applying other disguise tools such as tape and padding\
        \ to alter body widths. He is also able to make props alongside his disguises\
        \ such as a book or even Martina's custom revolver, and it is likely that\
        \ his Forte was also used to create a fake Virgo Ring (which Enyne could not\
        \ tell was faux). He claims himself that this is not done by magic or copying,\
        \ and is instead a highly refined technique, suggesting that although his\
        \ Forte is supernatural in nature, Desuhiko's skill at crafting disguises\
        \ is what makes it effective. Desuhiko is able to make disguises on the fly\
        \ with only a brief reference, such as perfectly disguising as Hana by just\
        \ a glance at her, but he has also said to keep prepared disguises prior to\
        \ the investigation, such as an Amaterasu Peacekeeper uniform. He can disguise\
        \ not only himself, but anyone else that enters his bag, and is even capable\
        \ of overlaying multiple disguises on top of one another. In order to mimic\
        \ voices, Desuhiko uses a voice changer that he slips underneath his disguise,\
        \ and claims he is capable of perfectly replicating any voice he has heard\
        \ only once with them. Despite this, it is possible he can also guess someone's\
        \ voice by their appearance given he had not been shown to have heard Hana's\
        \ voice. Simple disguises that don't alter the body, such as a basic Amaterasu\
        \ Uniform, have shown to be able to be taken off and then reworn outside of\
        \ the backpack. It is possible that Desuhiko's disguises can even replicate\
        \ biometrics, given he was able to sneak into Amaterasu Corporation, requiring\
        \ employee IDs and retinal scans to enter.'TIPS Amaterasu Security' Glossary\
        \ Section - \"Entry to the premises requires employee IDs, as well as biometric\
        \ authentication via retinal scans, making it practically impossible for outsiders\
        \ to infiltrate Amaterasu Corporation\" (Master Detective Archives: RAIN CODE\
        \ Plus) Desuhiko implies that while disguises don't have to be \u2018exactly\
        \ perfect\u2019, they can be covered by matching the overall impression instead\
        \ by imitating the subject visually and psychologically. Despite this, Desuhiko's\
        \ disguises cannot last forever and will start to strain him both physically\
        \ and mentally after a while, and it will require concentration to maintain.\
        \ When pushing himself to the limit, he will be unable to move properly or\
        \ retrieve his disguise tools until his energy restores. The effect of certain\
        \ variables, such as how many people are being disguised or how complex the\
        \ disguise, for example are unknown though it is implied that disguises that\
        \ push physical limitations such as height are more strenuous to maintain.\
        \ He can maintain a disguise for at least over an hour before feeling fatigue.Given\
        \ Desuhiko was able to casually maintain his and Yuma's disguise for over\
        \ 45 minutes, even while napping for most of that time and the fact that this\
        \ was the longest he had stayed in disguise, it is safe to assume that his\
        \ limit is at least over an hour. Considering the added time including when\
        \ they first entered Aetheria Academy and Yuma's separate three investigations\
        \ while disguised as Waruna, Yoshiko and Kurane; this is very likely to be\
        \ longer than 15 minutes. Desuhiko also states that there are limits to how\
        \ much he can realistically change his body, however these parameters are\
        \ unknown, and he has proven capable of easily disgusing as people a foot\
        \ taller than him such as Yakou. Desuhiko tends to hide his backpack, since\
        \ it stands out even in his disguises, though he has also shown to be able\
        \ to make it invisible alongside his disguise.The example of Desuhiko being\
        \ able to make his backpack invisible alongside his disguise"
      source_id: vsbattles-desuhiko-thunderbolt-unknown
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: powers_and_abilities
      value: '{{Border|Scroll=Yes|Visible=Yes|content= *Possibly Superhuman Physical
        Characteristics *Skilled Detective (Desuhiko is a licensed Master Detective
        for the World Detective Organisation, a global detective agency overseen by
        the Unified Government. He was acclaimed and trusted enough to be dispatched
        to Kanai Ward, in order to assist in solving the ''Great Global Mystery''.
        and playing instruments such as the [https://youtu.be/EwlLHpG3Oxk?si=0HI9y9d2gUO9GyrU&t=168
        guitar and bass.]) *Social Influencing (Charisma; In both his undercover work
        and in his pursuit of becoming a star, Desuhiko has trained his ability to
        exude charisma in everything he does, allowing him to easily gain information
        from others and negotiate. Despite this, he frequently fails when it comes
        to using this for personal reasons, such as picking up women; Deception; Alongside
        his Disguise Forte [https://youtu.be/DfAn0SpK5G0?si=iYoKHU1ZKUTqR92g&t=686
        being great at deceiving prying eyes], Desuhiko is a skilled actor and liar
        who can expertly fool others in both pretending to be someone and intellectual
        strategy) *Photographic Memory ([https://youtu.be/hFSz7I0NO8Q?si=bfXypKaaM0_NRtxS&t=1047
        Desuhiko, in tandem with his Disguise, has a perfect photographic memory,
        particularly when it comes to memorising someone''s appearance, voice and
        other information about them. With this, it allows him to create perfect disguises
        from only a glance.] [https://youtu.be/KiTuQuOCH98?si=1IANqng2EaTppi32&t=5395
        This also extends to him being able to perfectly recreate maps by hand.])
        *Stealth Mastery & Disguising (Desuhuko excels at using disguises for his
        undercover investigations, allowing himself and others to expertly infiltrate
