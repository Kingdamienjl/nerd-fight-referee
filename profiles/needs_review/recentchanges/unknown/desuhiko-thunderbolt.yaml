      value: "Standard Tactics: *Desuhiko specializes in undercover investigations,\
        \ and uses his Disguise Forte to naturally blend in and obtain information\
        \ from the inside. As such, he tends to begin by gathering sizable amounts\
        \ of information from people, which his photographic memory allows him to\
        \ piece together quickly. When using Disguise, although he has shown capable\
        \ of concealing it normally, he will usually hide his backpack somewhere out\
        \ of sight. *Desuhiko is usually more passionate about figuring out a case\
        \ if it will net him popularity, or if it will tarnish the image of a \u2018\
        rival\u2019 who is more famous than him, such as the Nine-Tailed Cat. *In\
        \ physical confrontations, although he would tend to avoid them on his own,\
        \ he is prone to recklessly endangering himself in order to let others get\
        \ away, even with guns pointed at him. He will usually grab onto an opponent,\
        \ such latching onto Martina to give Yuma a chance to escape, as well as again\
        \ with Yomi."
