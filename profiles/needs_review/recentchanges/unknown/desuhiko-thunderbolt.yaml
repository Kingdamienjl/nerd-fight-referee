  attack_potency:
    text: "At least Athlete level (Although he has not been shown to be proficient\
      \ in fighting, Desuhiko was capable of temporarily restraining the likes of\
      \ Yomi Hellsmile, Martina Electro and a peacekeeper by grabbing onto them.)\
      \ Likely higher within a Mystery Labyrinth (When entering a Mystery Labyrinth\
      \ through the shared effects of Yuma\u2019s Coalescence ability, Desuhiko is\
      \ seemingly capable of assisting against Mystery Phantoms, as well as able to\
      \ defend Yuma from their attacks.Mystery Labyrinths are separate alternate universes\
      \ that are formed as the manifestation of unsolved mysteries, where a pact with\
      \ Shinigami allows Yuma to interact and perform superhuman feats he is normally\
      \ not capable of doing within them. This is through the use of his understanding\
      \ and acquired clues of the case. When sharing a limited version of this pact\
      \ with Desuhiko via Coalescence, this may as a result also grant him similarly\
      \ enhanced statistics, although he is unable to interact with the Labyrinth\
      \ in the same way as Yuma.)"
    source_ids:
    - vsbattles-desuhiko-thunderbolt-unknown
    confidence: 0.6
    notes: auto_repair source extraction
