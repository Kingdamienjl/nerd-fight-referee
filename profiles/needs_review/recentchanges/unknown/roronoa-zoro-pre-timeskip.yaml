    - field: weaknesses
      value: 'Zoro has a very poor sense of direction (i.e. climbing up buildings
        when told to go north and getting lost in a straight hallway). {| class="mw-collapsible
        mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
        | colspan="2" style="text-align: left; |Notable Attacks/Techniques: |- | :
        There are normally two types of Haki regular people can tap into: the Observation
        Haki which allows individuals to sense the presence of others, and Armament
        Haki which allows individuals to create an invisible armor around them. There
        is however a third type of Haki, Conqueror''s Haki, that only a few individuals
        can use. *: Zoro can utilize an application of Armament Haki known as Mighty
        Blade which allows him with his swords to cut through the thickest steel when
        he wishes and at the same time for it not the cut the thinnest of paper. To
        do this he senses the "Breath" of what he wishes to cut or not cut. When sensing
        the "Breath" of something he can know the trajectory of it''s movement before
        it happens as well as it''s location despite not being visible to him. By
        doing so he can determine the speed, power and angle of where he should cut.
        Then by conveying his will into his sword, it allows him to achieve his desire
        to cut through things he otherwise couldn''t with strength alone. : Over the
        course of his journey, Roronoa Zoro has been in situations where his techniques
        have had to adapt for one reason or another. In addition to his primary fighting
        style, he has several other related fighting styles that form the greater
        part of his Three-Sword Style fighting abilities. One-Sword Style is one of
        them. These are the attacks he uses with one sword. As Zoro is left-handed,
        his Ittoryu techniques have nearly always been executed with his left hand.
        He usually uses Wado Ichimonji for them, but after the timeskip he seems to
        be proficient in using each of his three swords for his one-sword techniques.
        He mainly fights with one sword when not fighting seriously or when he is
        using a specialized cutting technique. Early in the series (when Sham stole
        two of his swords and Zoro had to fight him and Buchi with just one), Zoro
        himself claims that he is "not that good at one-sword techniques". However,
        over time, he seems to have worked on this weakness and becomes proficient
        with this style. In fact, most of his Ittoryu techniques are very powerful
        finishing techniques. *: Placing the sheathed sword upright and listening
        to the "breath" of his opponent, the attacker rapidly unsheathes, attacks,
        and resheathes their sword. An interesting note is that Zoro does the technique
        in reverse grip from beside-and-over his head, as opposed to from the waist
        with a standard grip on the sword. His very first One-Sword Style attack,
        this was first seen used to finish off Mr. 1. Zoro uses this technique only
        when he needs to cut metal like Mr. 1''s steel body or Kaku''s Tekkai technique.
        This attack is as powerful as Kaku''s Tempest Kick: Dragon Cut. *: This attack
        uses the air itself to slash the target from a distance. To initiate it, Zoro
        first holds one of his swords horizontally above the shoulder of his sword
        arm, and then performs a circular swing that launches the air compressed projectile
        spiraling towards the target. Zoro introduced this technique as a very powerful
        Flying Slash Attack. This was first seen being used to finish off Braham in
        Enel''s Survival Game. *: Using one sword wielded in his left hand with his
        right hand gripping his left wrist for support (or vice-versa), Zoro jumps
        high up into the air and slashes his opponent. After slashing them, Zoro''s
        opponent then bursts into flames (in the anime, the color of the fire is blue
        instead) from where they were slashed. This was first seen being used against
        Ryuma. The animal or creature that usually accompanies Zoro in the background
        when performing powerful techniques is an occidental dragon. is another related
        sword/blade-style that Roronoa Zoro developed over the course of his journey,
        when in situations where his techniques have had to adapt for one reason or
        another. These are the attacks he uses with two swords. Two-Swords Tyle was
        also Zoro''s original fighting style when he began to learn how to wield a
        sword, before accepting Kuina''s sword and practicing Three-Swords Style.
        *: While airborne, creates a powerful gust of wind to knock opponents over.
        It was first used to wipe out some Baroque Works agents at Whisky Peak. It
        can be done while standing on the ground. Zoro says this attack is very useful
        against a group of weak enemies. *: Zoro holds his swords in front of him
