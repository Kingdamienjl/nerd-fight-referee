    - field: weaknesses
      value: 'Most of his techniques only hit from a close range Notable Attacks/Techniques:
        * Santoryu: Three-Sword Style: Zoro fights with his unique sword style where
        uses three swords at the same time, one sword in each of his hands and the
        third in his mouth. ** Oni Giri: The Oni Giri is a sword technique where Zoro
        slashes the opponent with all three swords at once. ** Tatsu Maki: The Tatsu
        Maki is a sword technique where Zoro swings his swords to create a small tornado.
        ** 1080 Pound Cannon: The 1080 Pound Cannon is a sword technique where Zoro
        fires a slash wave of compressed air at the opponent. ** Kyutoryu: Nine-Sword
        Style: Zoro, using a physical illusion, creates four more arms and two more
        heads which in turn gives him six additional swords he can fight with. * Haki:
        Zoro is one of the few people who can use Haki, a type of life force. He can
        use two of the three types, Observation Haki which allows him to predict attacks
        and sense other people and Armament Haki which allows him to make a thin layer
        of armour around his body for more defence or around his swords to increase
        their power. Note: This profile is based on what is in Death Battles video,
        any information displayed on any profile based on Death Battle are solely
        based on whatever is said in their videos and not my own opinion. So if a
        character is weaker or stronger on a profile than they actually are then it
        isn''t my fault. == Others == Notable Victories: Notable Losses: Inconclusive
        Matches: Category:Unbacked0 Category:Tier 7'
