  intelligence:
    text: '{{{content| Skilled combatant (Zoro is naturally gifted, spending most
      of his time as a child challenging Dojo''s surpassing the skill of the majority
      of participants in them including full grown adults. It was at Isshin Dojo where
      Zoro met the first person he was unable to best, Kuina where the two developed
      a strong friendship. Shortly after Kuina''s death Zoro pursued his vow to become
      the greatest Swordsmen and developed his very own style Three-Sword Style a
      sword style that''s completely unique to Zoro, involving the usage of three
      blades held simultaneously in an unorthodox fashion. This is the sword style
      Zoro is the most skilled in, using Three-Sword Style Zoro is able to attack
      from borderline unpredictable and unstable angles. (Has also been shown to be
      able to fight despite whatever terrain or environment he''s on, weather it be
      underwater, in the air or as the ground beneath him is collapsing) His Three-Sword
      Style attacks are harder to register than that of even a six sword style from
      Hachi, and can effortlessly parry slashes coming at him from every direction
      while using foreign swords. Hachi firmly believing that there''s a vast skill
      gap between 6 armed Fish-Men like himself and that of humans, despite Hachi
      believing in this statement Zoro is able to dance around Hachi effortlessly.
      Zoro is also displays Mastery in various other forms of sword styles such as
      One-Sword Style and Two-Sword Style, and even developed another unique form
      of sword play, No-Sword Style in which Zoro is able to utilize if ever disarmed
      of his swords, revolving around throws and changing the trajectory of his opponents
      momentum, allowing Zoro to fling his opponents at one another, allowing him
      to cut without technically having a blade on him. Zoro has also developed another
      unique form of swordplay an extension of his Three-Sword Style: Nine-Sword Style
      differing from his other disciplines, creating a tangible illusion of himself
      with 6 extra arm''s and 3 heads resembling that of a Demon God. These illusions
      have a physical affect on whatever Zoro interacts with, this is Zoro''s strongest
      ability out of his whole arsenal. Zoro is also shown to be familiar with other
      bladed weapons although his preference is a sword, Zoro also shows impressive
      levels of body control being able to manipulate the mass and density of his
      muscles and can bend in unorthodox ways. Zoro showcases a phenomenal growth
      rate and develops at a very fast rate, at times even improves notably in the
      middle of battle, or against all odds such as when he learned how to cut Daz
      Bonez, who was previously immune to slashing and cutting based attacks while
      on the verge of death simply by remembering his teacher''s words and putting
      them into practice. At this point Zoro unlocks the very zenith of Swordsmanship
      known as Mighty Blade (), a state of mind of mind that grants access to "The
      Breath of All Things." Zoro is capable of sensing the "Breath" of all things
      living and even the intimate. By analyzing the "Breath" of the target Zoro can
      read the trajectory of something''s movements before it happens as well as it''s
      location despite not being visible to him. Mighty Blade users such as Zoro are
      also capable of analyzing the opponent in order to determine the speed, power
      and angle of where he should cut at, allowing him to cut objects he otherwise
      couldn''t with strength alone. An analytical and alert fighter Zoro prefers
      to target lethal vital points from the get go.(quick to grasp the rhythm of
      battle, as a attentive fighter Zoro excels in analyzing his opponents to find
      their weakness allowing Zoro to create extremely effective countermeasures and
      combinations on the spot. Zoro is able to analyze his opponents skill, attack
      patterns and timing. Zoro also showcases impressive predictive accuracy, being
      able to predict the movements and trajectory of his opponents, being able to
      predict FTE attacks and attacks that change trajectory. A man of canny tactical
      ability (has on more than one occasion pulled through with a victory with smart
      thinking, such as luring opponents into traps) }}}'
    source_ids:
    - vsbattles-roronoa-zoro-pre-timeskip-unknown
    confidence: 0.6
    notes: auto_repair source extraction
