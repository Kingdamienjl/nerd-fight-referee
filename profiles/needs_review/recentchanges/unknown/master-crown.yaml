    level (Fought evenly against Magolor Epilogue Magolor, who was stronger than his
    prior self as Extra Mode Magolor Soul. In side content, it can fight evenly against
    Kirby, King Dedede, Meta Knight, and Bandana Waddle Dee at once, [https://imgur.com/fLZrvgu
    Hydriath], and [https://imgur.com/mp7sThl the Rampaging Doomers] under its dominion;
    The latter bosses was doing tasks for Crowned Doomer, their master, which is also
    portrayed as Crowned Doomer [https://imgur.com/XXDVTuC controlling them]. However,
    it could simply be that Crowned Doomer conquered them & they followed its authority
    with no superpowers involved at it. Crowned Doomer was likely to already be the
    boss of the Rampaging Doomers, but he would have needed to conquer the rest extremely
    quickly, given that Magolor & the crown reached the same place at the same time,
    and Magolor found Electricky Dooter, Fiery Puffer & Hydriath in that situation
    as bosses of a rather short story right after the crown met Crowned Doomer off-screen.
    Similarly, Magolor (Phase 1) & Magolor EX may have [https://youtu.be/NOffRGW3H9w?list=PLDKzS4Vtdasm5gnV9uj2xHEqBxHZgtD6q&t=274
    used it to control dozens] of Doomers and Sphere Doomers to attack Kirby & co.
    as [https://youtu.be/NOffRGW3H9w?list=PLDKzS4Vtdasm5gnV9uj2xHEqBxHZgtD6q&t=323
    this creatures could stay & die] [https://youtu.be/NOffRGW3H9w?list=PLDKzS4Vtdasm5gnV9uj2xHEqBxHZgtD6q&t=334
    on places that could crush them]): The Master Crown creates 1-3 dimensional rifts,
    out from which its roots strike the stage in various patterns, creating Dropped
