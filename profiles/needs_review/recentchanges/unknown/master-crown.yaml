    - field: attack_potency
      value: "The Master Crown creates two large Gem Apple bombs that drop from dimensional\
        \ rifts onto the arena. They slowly grow larger until they detonate in a big\
        \ explosion, but can be attacked to destroy them before this happens by Magolor\
        \ or Kirby & co. The explosion cannot be guarded. Kirby can swallow these\
        \ using a Super Inhale to gain the Bomb ability. *\"Daphne's Scream\" (\u30C0\
        \u30D5\u30CD\u306E\u7D76\u53EB\u305C\u3063\u304D\u3087\u3046): The Master\
        \ Crown shoots an energy beam from its eye that sweeps the ground, and then\
        \ causes the entire floor to explode, hitting enemies in a certain range at\
        \ the moment of impact and leaving Dropped Stars behind in The True Arena.\
        \ As soon as the explosion happens, the music temporarily lowers in volume,\
        \ accompanied with a high-pitched tone. *\"Dance of the Double-Edged Leaves\"\
        \ (\u53CC\u8449\u3082\u308D\u306F\u306E\u821E\u307E\u3044): The Master Crown\
        \ creates two groups of two large spade-shaped leaf projectiles on both sides\
        \ and then fires them one at a time to its target from the background. Kirby\
        \ can swallow these using a Super Inhale to get the Leaf Copy Ability. *Unnammed\
        \ seed"
