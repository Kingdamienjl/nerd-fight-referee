      value: 'Superhuman Physical Characteristics, Inorganic Physiology (Type 2),
        Power Bestowal (The Master Crown can give it''s powers to it''s users), Large
        Size: (Type 1: Immensly larger than Magolor while fused with the Gem Apple
        Seed), Soul Manipulation (While using the Crown, the users'' soul can be consumed
        by it), Corruption (Corrupted Magolor), Regeneration: (High-Mid: Came back
        after being shattered into pieces), Possession (The Master Crown can easily
        go wild and take control of it''s user), Pocket Reality Manipulation (Seemingly
        created an alternative dimension), Energy Manipulation and Projection (Can
        create several laser beams), Danmaku (Can spawn numerous attacks at the same
        time), Plant Manipulation and Homing Attack (Can use it''s own leaves to attack
        targets, in which the leaves home in), Transformation (Transformed Magolor.
        Transformed itself into it''s Tree form), Reality Warping (Shown to have warped
        the background during it''s Transformation), Portal Creation (Can create portals),
        Fusionism (Fused itself with the Gem Apple Seed), Natural Weaponry, Body Control
        (Can use it''s own roots to attack), Creation (Can create Explosive Gem Apples
        to attack Magolor), Healing (Was capable of healing Magolor), Ice Manipulation
        (Scaling to Magolor Soul who could create an ice hammer), Sand Manipulation
        and Air Manipulation (Scaling to Magolor Soul who can create sand tornados),
        Summoning (Can summon enemies to assist it through portals), Explosion Manipulation
        (Can create explosions), Teleportation (Can teleport), Mind Manipulation (The
        Master Crown is capable of using it''s powers to brainwash enemies), Power
        Nullification (Magolor with the Crown was capable of shutting off Kirby''s
        ability), Space-Time Manipulation (Magolor with the Crown could warp Another
        Dimension), Weapon Creation (Magolor with the Crown could create weapons for
        himself), Resistance to Extreme Cold and Cosmic Radiations, Ice Manipulation
        (Can tank Ice Kirby''s attacks), Black Holes (Can tank Magolor''s black holes),
        Fire Manipulation'
