    - field: weaknesses
      value: "Removing the shackles on her strength takes a heavy toll on her body.\
        \ Without Rem's Synesthesia or Subaru's Cor Leonis, she is limited to releasing\
        \ a maximum of 2 out of 10 shackles without risking death. She can't absorb\
        \ mana by herself so she can't fight for long periods of time. Notable Attacks/Techniques:\
        \ *Clairvoyance: A secret technique of the Onis that enables Ram to synchronize\
        \ with the vision of those who have the same wavelength, allowing her to see\
        \ off into the distance. Although she is unable to defend herself while using\
        \ it, it allows her to continuously switch between people, making her actually\
        \ able to see past one thousand miles. However, the side effect of overusing\
        \ the technique causes her veins to become prominent, to bleed tears of blood\
        \ from one eye, and her legs to shake uncontrollably. *Fura: Ram creates a\
        \ blade of wind which she uses to slice her target part. **El Fura: The user\
        \ unleash a powerful gust of wind that create enough force to lift heavy object\
        \ to the air, or can be used to shoot objects like bullets. **Ul Fura: Ram\
        \ creates a windstorm with her target in the middle, the raging wind strikes\
        \ the target, slices them, tosses them, smashes them against the ground, and\
        \ then flung so thoroughly they cannot discern up from down, left from right.\
        \ **Al Fura: Ram unleashes a windstorm with sharpness that not even a treasured\
        \ sword could compare to, making anything that comes in contact with it lose\
        \ all of its original form. The windstorm destroys people\u2019s eardrums,\
        \ tearing through their bodies by breaking into the holes in them, Once the\
        \ destruction blew through, all that\u2019s left is a scene without any bloodstains.\
        \ *Shackles of the Oni God: Even with only a single horn Ram was formerly\
        \ considered to be a child prodigy and the next leader of the Oni Clan, however\
        \ her horn was cut off when the Witch Cult attacked her village. She can still\
        \ use her Oni powers, even without her horn, increasing her physical and regenerative\
        \ abilities, though it enacts a heavy toll on her body as without her horn\
        \ which drains the limitless mana in the atmosphere, she cannot fuel her Oni\
        \ abilities. To limit this toll, Ram constantly binds her power with 10 metaphorical\
        \ Shackles, restricting her abilities. She can release a number of Shackles\
        \ to access her a portion of her powers, but the more she uses the worse the\
        \ effect on her body. **Synesthesia: As twins, Rem and Ram share a connection\
        \ between their souls, and can share feelings or even mana. Even unconscious,\
        \ Rem can act as Ram's horn through Synesthesia- taking Ram's burden on for\
        \ her and allowing Ram to release her higher Shackles without risking permanent\
        \ damage. ==Notable Matchups== Victories: Ditto (Pok\xE9mon) Ditto's profile\
        \ (Speed was equalized, Ditto was given time to transform, The starting distance\
