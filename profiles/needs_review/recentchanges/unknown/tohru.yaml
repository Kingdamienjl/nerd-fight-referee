    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: At least Island level (Created an explosion of this magnitude in her fight
      with Elma. Destroyed three islands when fighting Elma. Casually cleared the
      sky on a cloudy day. Even while restraining her powers to the level of a human
      of her world,Miss Kobayashi's Dragon Maid- Chapter 9 she still effortlessly
      created attacks comparable to nukes and even called such attacks playing. Elma
      stated that Tohru used to blow up mountains for fun. It should be noted that
      Tohru can wipe out entire armies of humans with that level of power, as dragons
      are ranked below only gods in her world. Fought against Ilulu and defeated her.
      Fought and clashed evenly with Kimun Kamui. Contributed her strength to the
      Dragon Ball that was capable of one shotting Kimun Kamui)
    source_ids:
    - mediawiki-588753
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At least Massively Hypersonic+ travel speed (Should be faster than Kanna,
      who flew from Japan to New York City in a very brief timeframe, with Sub-Relativistic
      combat speed (Regularly fights on par with Elma, with both of them being able
      to react to each other's energy blasts and mouth beam attacks, the latter being
      this fast)
    source_ids:
    - mediawiki-588753
    confidence: 0.6
    notes: auto_repair source extraction
