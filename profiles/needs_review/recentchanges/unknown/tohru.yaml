    notes: auto_repair source extraction
  intelligence:
    text: 'Above Average (Tohru has battled generations of humans and dragons alike
      and can effectively use her powers for a vast variety of purposes. Outside of
      battle, she has had to learn most things by experience, although she is an incredibly
      quick learner) Standard Tactics: She is most likely to play the range game with
      fire breath and energy beams, though against enemies who are unable to fly it
      is not uncommon for her to attempt to open up portals either beneath or in front
      of them so as to drop them into the dragon world and be done with it. Against
      enemies whose abilities are magic-based, which she has the ability to sense,
      she has also adopted the strategy of scattering her own magic around the battlefield
      which disables the magic power of others. She has utilized her ability to become
      invisible, inaudible, and unable to be sensed through smell in combat a few
      times in the manga as well.'
    source_ids:
    - mediawiki-588753
    confidence: 0.6
    notes: auto_repair source extraction
