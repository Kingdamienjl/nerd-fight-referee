    - field: weaknesses
      value: 'Cannot turn off the Sharingan, so has to cover it with a blindfold.
        Using the Sharingan is an immense drain on his stamina, made much worse by
        using the Mangekyo Sharingan. Notable Attacks/Techniques: * Sharingan: The
        Sharingan''s first ability is to see chakra flow and colorize them, allowing
        the wielder to distinguish them easily. Sharingan''s second most notable ability
        allows the user to perceive subtle details with incredible clarity. As the
        Sharingan evolves, it gains the ability to track fast-moving objects and predict
        an attacker''s next move based on the slightest muscle tension in the body.
        Another well-known Sharingan skill is copying and countering virtually any
        technique they see. In addition to hypnosis, the Sharingan''s final commonly-used
        power involves suggesting actions and thoughts to opponents through an illusion
        cast by simple eye contact. * Chidori: The Chidori is Kakashi Hatake''s first
        original technique. This technique channels a large amount of lightning chakra
        to the user''s hand. Once the move is completed, the user charges forward
        and thrusts the Chidori into the target * Raikiri: The Lightning Cutter is
        an enhanced and concentrated form of the Chidori with the same effects and
        drawbacks. The Chidori appears as a raging mass of electrical chakra in the
        user''s hand, while the Lightning Cutter is more focused. In Part I, Kakashi
        is limited to using it four times a day, but in Part II, he can use it at
        least six times * Earth-Style Wall: The user creates a solid earth wall as
        a form of defense. Chakra is either converted to earth within the body and
        then spat out to form the partition, or the user can manipulate pre-existing
        soil to create it. The ground then instantly rises and takes form * Water
        Dragon Bullet: This technique shapes a large amount of water into a giant,
        mighty dragon, which hits the opponent with formidable might, dealing physical
        damage * Great Waterfall: This technique extends water over a large scale,
        surges, and rises to several meters high. Then it streams down to the ground
        in one big cascade, much like a gigantic waterfall * Shadow Clone: Kakashi
        creates a clone(s) of the user able to perform techniques and interact with
        the environment due to its physical substance; and also evenly distributes
        the user''s chakra to each clone. If the clone is injured, the clone will
        disperse'
      source_id: character-stats-profiles-kakashi-hatake
      provider_id: character_stats_profiles
      authority: high
