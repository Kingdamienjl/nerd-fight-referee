    - field: weaknesses
      value: "Kakashi can't deactivate his Sharingan at will; thus, he's forced to\
        \ cover it with his headband to conserve chakra when it's not in use. The\
        \ Sharingan's ability to copy Ninjutsu, Genjutsu, and Taijutsu is limited\
        \ by the user's physical condition, that is to say, that the user needs to\
        \ be physically capable of performing the technique they are trying to replicate.\
        \ They need to meet any physical or chakra amount prerequisites the technique\
        \ in question may have. This ability is also incapable of replicating Kekkei\
        \ Genkai, due to either not possessing the genetic predisposition and/or having\
        \ the necessary chakra natures. Naturally, the user also needs to actually\
        \ see the technique they are attempting to copy, meaning they cannot copy\
        \ something they did not see or is obscured from their line of sight. The\
        \ same can be said for essentially all of the Sharingan's abilities; they\
        \ are sight-based abilities, so if the opponent can obscure the user's vision\
        \ using extremely thick mist/dust or blind them, the Sharingan's abilities\
        \ will be rendered useless. Likewise, if the opponent is too fast for the\
        \ Sharingan to visually keep track of them, they will be safe from its abilities.\
        \ Sharingan Genjutsu requires eye contact, so if the opponent is able to avoid\
        \ eye contact or is blind, they will be able to avert Sharingan Genjutsu entirely.\
        \ Finally, the Sharingan's predictive capabilities can be somewhat circumvented\
        \ by attacks that have little to no pattern, such as Naruto's chakra arms\
        \ that emerge from any part of his body and attack instinctively. | The Mangeky\u014D\
        \ Sharingan offers far more power than the regular Sharingan, but that power\
        \ comes at a cost. More powerful techniques entail a far higher chakra cost,\
        \ making Mangeky\u014D Sharingan Jutsu extremely taxing to use and maintain.\
        \ Additionally, the Mangeky\u014D Sharingan also causes great strain on the\
        \ user's vision, though Obito's Sharingan is unique and will not cause blindness\
        \ with use. | The user can't perform physical attacks or teleport while this\
        \ ability is active, and must deactivate it to do so. The user's ability to\
        \ teleport objects to the Kamui dimension is faster than their ability to\
        \ transport themselves. Additionally, this ability can only be used continuously\
        \ for 5 minutes, after which there is a short recharge period. | After the\
        \ Fourth Shinobi World War, he no longer possesses the Sharingan. Notable\
        \ Attacks/Techniques: Hide/Show Sharingan (Mirror Wheel Eye): The Sharingan's\
        \ first ability is to see chakra flow and colorize them, allowing the wielder\
        \ to distinguish them easily. Sharingan's second most notable ability allows\
        \ the user to perceive subtle details with incredible clarity. As the Sharingan\
        \ evolves, it gains the ability to track fast-moving objects and predict an\
        \ attacker's next move based on the slightest muscle tension in the body.\
        \ Another well-known Sharingan skill is copying and countering virtually any\
        \ technique they see. In addition to hypnosis, the Sharingan's final commonly-used\
        \ power involves suggesting actions and thoughts to opponents through an illusion\
        \ cast by simple eye contact. *Sharingan Genjutsu: The generic illusionary\
        \ technique used by members of the Uchiha clan. A Sharingan user can lock\
        \ their victim in an illusion by making eye contact. Mangeky\u014D Sharingan\
        \ (Kaleidoscope Copy Wheel Eye): An advanced form of the Sharingan that is\
        \ acquired through the trauma experienced from the death of the person closest\
        \ to the Sharingan user. Usually, the eyesight of Mangeky\u014D Sharingan's\
        \ users gradually deteriorates over time to the point of total blindness,\
        \ especially with extensive usage. However, Obito's Mangeky\u014D Sharingan\
        \ pair are unique; they do not seem to degrade progressively with use and\
        \ regain full strength after rest. *Kamui: Kakashi/Obito's Mangeky\u014D Sharingan's\
        \ innate power. It transfers anything to another dimension by forming a swallowing\
        \ portal in the user's field of vision. Additionally, the portal's location\
        \ and size can be modified as desired, with the greater one requiring more\
        \ chakra. Kakashi can perform this technique up to three times daily, even\
        \ at full strength. *Susanoo: After receiving Obito's powers, Kakashi manifests\
        \ the Mangeky\u014D Sharingan in both eyes, enabling the use of Susanoo. With\
        \ it, Kakashi can produce it in its perfect stabilised form. Like other Susanoo's\
        \ users, Kakashi can channel all his techniques to the chakra figure, including\
        \ the newfound Kamui Shuriken. Raiton (Lightning Release): One of the basic\
        \ elemental nature transformation techniques that allows the user to generate\
        \ lightning and high-frequency vibrations for greater destructive power and\
        \ movement speed. The electricity paralyzes the target, leaving them vulnerable\
        \ to a finishing strike. The electricity can also be infused into weapons\
        \ or body parts to increase offensive power through vibrations and induce\
        \ numbness. *Chidori (One Thousand Birds): The Chidori is Kakashi Hatake's\
        \ first original technique. This technique channels a large amount of lightnin"
