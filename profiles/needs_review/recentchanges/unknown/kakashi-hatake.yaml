- id: claim-powers-and-abilities-bc616f39
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Genius Intelligence * Social Influencing
    (Reputation; Known as "Copy Ninja Kakashi" and "Kakashi of the Sharingan" for
    having copied over a thousand techniques with his Sharingan) * Supernatural Willpower
    (Endured 72 hours of torture in Itachi Uchiha''s Tsukuyomi without going mad,
    though it left him in a coma) * Chakra Manipulation * Statistics Amplification
    (Shinobi can enhance their physical capabilities with chakra. Can open the first
    of the Eight Gates. The Body Flicker Technique lets shinobi greatly increase their
    speed by focusing chakra in their feetRin no Sho, Page 197Naruto, Chapter 24Naruto,
    Chapter 71) * Surface Scaling & Water Walking (By focusing chakra in the soles
    of their feet, shinobi can cling to vertical surfaces and even walk on waterNaruto,
    Chapter 18Naruto, Chapter 90) * Expert Hand-to-Hand Combatant * Lightning Manipulation
    * Enhanced Smell and Hearing * Afterimage Creation, Stealth Mastery & Speed Enhancement
    (The Substitution Technique lets its user instantly swap places with a nearby
    object, such as a log, plant, person, or clone, at the exact moment they are attacked.
    It works even if the user is restrained or watched by perceptive characters such
    as Sharingan or Sage Mode users, creating the illusion that the user was hit and
    giving them an opening to flee or counterattackNaruto, Chapter 6Naruto, Chapter
    54Naruto, Chapter 374Naruto, Chapter 580Naruto, Chapter 674) * Explosion Manipulation
    (With explosive tags) * Minor Illusion Creation & Duplication (With the Clone
    Technique,Rin no Sho, Page 220 shinobi can create illusory duplicates with no
    physical substance. Kakashi can also create Shadow Clones, Water Clones, and Lightning
    Shadow Clones, which paralyze opponents on contact) * Shapeshifting (With the
    Transformation Technique, shinobi can turn into other people, animals, plants,
    and even inanimate objects such as weapons) * Paralysis Inducement (With the Temporary
    Paralysis Technique,Rin no Sho, Page 176 shinobi can completely paralyze targets
    at close to mid range) * Weapon Mastery (An expert with kunai, shuriken, and other
    ninja weapons. As an adult, he can channel lightning through them to increase
    their sharpness and cutting power, and to paralyze the target) * Water Manipulation
    (Can use the Water Encampment Wall and the Water Dragon Bullet) * Fear-inducing
    Aura (Exposed to Kakashi''s aura, Sasuke wanted to kill himself) * Earth Manipulation
    * Sealing (Sealed Sasuke''s Cursed Seal using his own blood) * Summoning (Can
    summon weapons of various sizes, and ninja hounds that help with tracking and
    espionage and can restrain targets, leaving them open to attack) * Genjutsu Nullification
    (Shinobi can usually break free from non-ocular genjutsu by deliberately disrupting
    the flow of chakraSha no Sho, Page 301 within their bodies) * Resistance to Fear
    Manipulation and Madness Manipulation (Type 3; Unfazed by Zabuza''s aura) * Enhanced
    Sight (The Sharingan grants incredible clarity of perception,Naruto, Chapter 26
    letting its user easily trackNaruto, Chapter 27Naruto, Chapter 49 fast-moving
    targets, perceive and decipherNaruto, Chapter 333 hand seals at great speeds,Naruto,
    Chapter 361 read lips,Naruto, Chapter 246 and follow pencil movements to mimic
    them.Naruto, Chapter 41 It can also see chakra as different colors, even through
    certain solid obstacles,Naruto, Chapter 579 and perceive invisible peopleNaruto,
    Chapter 242 and entities.Naruto, Chapter 551 It can focus like a microscope, seeing
    things at a cellular level and even virusesBoruto, Chapter 41) * Analytical Prediction
    (The Sharingan lets its user clearly anticipate their opponent''s next moves and
    flawlessly counter them. A fully matured Sharingan can even see a clear image
    of the opponent''s next move,Naruto, Chapter 230 allowing efficient evasion and
    counterattacks without wasted movement) * Information Analysis & Power Mimicry
    (The Sharingan can "discern the reality behind any technique" and reflect it back
    at its caster.Naruto, Chapter 12 It can read the seals an opponent weaves and
    determine the attack''s nature and range from the color of its chakra.Sha no Sho,
    Page 45 By deciphering this information,Rin no Sho, Pages 192-193 the user can
    instantly understand, memorize, and copy an opponent''s ninjutsu,Naruto, Chapter
    15 genjutsu,Naruto, Chapter 141 and taijutsuNaruto, Chapter 67Naruto, Chapter
    68 with near-perfect accuracy. Seeing chakra also lets the user gauge an opponent''s
    remaining energy and next movesNaruto, Chapter 390Naruto, Chapter 641) * Empowerment
    & Rage Power (The Sharingan is awakened and evolved through negative emotions
    such as hatred, grief, or disappointment; the deeper the hatred or pain, the stronger
    it becomesNaruto, Chapter 619) * Limited Clairvoyance (Can occasionally see through
    Obito''s Sharingan) * Limited Light Manipulation (The Sharingan glows in the darkNaruto,
    Chapter 301) * Illusion Reflection (The Sharingan can decipher an opponent''s
    genjutsu, copy it'
