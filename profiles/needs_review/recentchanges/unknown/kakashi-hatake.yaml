- id: claim-intelligence-b78b51e6
  section: power_scale
  axis: battle_iq
  text: "Genius normally, and an extremely skilled combatant Kakashi is one of the\
    \ smartest people in Konoha. He holds the record as the youngest person to become\
    \ a Genin, at age five, and a Ch\u016Bnin, at age six,First Databook, Character\
    \ Files, Kakashi and his later ranks as J\u014Dnin, ANBU captain, division commander\
    \ of the Allied Shinobi Forces, and Sixth Hokage show his excellent leadership.\
    \ His use of the Sharingan is exceptional: he has copied over a thousand techniques,Naruto,\
    \ Chapter 12, Page 6 something unheard of even among the Uchiha, and retains all\
    \ of them in his memory.First Databook, Page 192 Though the Sharingan helped him\
    \ build this knowledge, he is also a quick learner and an innovator. At a very\
    \ young age, he learned the Rasengan,Naruto, Chapter 321, Pages 6-8 an A-rank\
    \ technique, and he invented complex techniques such as the Chidori and its variationsNaruto,\
    \ Chapter 113, Pages 15-16 and Purple Lightning.Kakashi Hiden, Chapter 5 He also\
    \ devised a training method that used Naruto's Shadow ClonesNaruto, Chapter 315,\
    \ Pages 8-9 to master a technique as complex as the Rasenshuriken in record time,\
    \ showing a deep understanding of both technique mechanics and his students' needs.\
    \ Deductive reasoning is one of his greatest strengths, and he uses it constantly\
    \ in battle. He realized that a hare was Zabuza's decoy just from its location\
    \ and appearance,Naruto, Chapter 11, Page 16 and uses his keen sensesNaruto, Chapter\
    \ 246, Page 15 to locate hidden enemies. He is widely praised: NarutoNaruto, Chapter\
    \ 246, Page 12 considers him smarter than Shikamaru, who was stated to have an\
    \ IQ over 200, and the Sage of Six PathsNaruto, Chapter 691, Page 7 commended\
    \ his leadership in guiding Team 7 to seal Kaguya. Kakashi is a genius combatant\
    \ who often outwits enemies with strategicallyNaruto, Chapter 142, Pages 9-10\
    \ placedNaruto, Chapter 13, Page 1 clonesNaruto, Chapter 423, Pages 13-16 and\
    \ constantly analyzes his opponents mid-battle. He pinpointed a hidden enemy and\
    \ used the Substitution Technique to set up a counterattack,Naruto, Chapter 9,\
    \ Page 17 \u2013 Chapter 10, Page 10 and deliberately let himself bleedNaruto,\
    \ Chapter 29, Page 18 so his hounds could track Zabuza. In the war, he quickly\
    \ devised a multi-step planNaruto, Chapter 523, Pages 7-9 to defeat and seal the\
    \ reanimated Zabuza and Haku, one that relied on his understanding of the Shadow\
    \ Possession and Mind Transfer techniques and coordinated several allies at once.\
    \ During Pain's assault on Konoha, he deduced Shinra Tensei's cooldownNaruto,\
    \ Chapter 423, Pages 3-5 by testing it with a kunai, used a Lightning Clone as\
    \ a decoy to study Pain's abilities,Naruto, Chapter 423, Page 1 and set up chains\
    \ hidden undergroundNaruto, Chapter 423, Pages 6-10 to exploit it, defeating the\
    \ Deva Path with Ch\u014Dji and Ch\u014Dza's help. In the Fourth Shinobi World\
    \ War, he deduced that Obito could not use all of Pain's abilities,Naruto, Chapter\
    \ 567, Pages 8-10 earning praise from both Naruto and Obito, then figured out\
    \ the mechanics of Obito's Kamui and planned a counter with Naruto, Guy, and his\
    \ own Kamui to get past Obito's phasing.Naruto, Chapter 596, Pages 10-15 After\
    \ receiving Obito's eyes, he quickly mastered Susano'o and created Kamui Shuriken\
    \ and Kamui Raikiri.Naruto, Chapter 688, Page 15; Chapter 689, Pages 1-10 Against\
    \ Kaguya, he devised and carried out a complex planNaruto, Chapter 689, Pages\
    \ 6-15 using all of Team 7: he trapped Kaguya with Kamui Raikiri between Naruto,\
    \ disguised as Sasuke, attacking from her injured side, and a clone attacking\
    \ from the side where Kakashi predicted she would use her All-Killing Ash Bones.\
    \ Kakashi then protected Naruto with Kamui, Sasuke swapped places with the clone,\
    \ and Sakura pinned Kaguya from above, allowing her to be sealed. In Kakashi Retsuden,Kakashi\
    \ Retsuden, Chapter 3 he showed an exceptional understanding of materials: knowing\
    \ how electricity behaves in glass, he briefly turned his Earth-Style Wall into\
    \ glass to insulate it against lightning attacks, then changed it back so it could\
    \ block physical attacks. Deduction and Observation: 1. Deduced that Shinra Tensei\
    \ has a cooldown 2. Deduced the weakness of Obito's Kamui 3. Deduced that the\
    \ hare was Zabuza's decoy 4. Deduced that Obito cannot use all of Pain's abilities\
    \ 5. Sensed an enemy hiding in a puddle 6. Sensed enemies by smell and sound 7.\
    \ Deduced that Zabuza had faked his death with Haku's helpNaruto, Chapter 17,\
    \ Pages 1-5 Strategy and Planning: 1. Used Lightning Shadow Clones to gather information\
    \ on and defeat the Deva Path 2. Exploited the weakness of Obito's Kamui with\
    \ a plan involving Guy and Naruto 3. Deliberately got wounded against Zabuza so\
    \ he could track him by his blood 4. Devised a plan to counter the reanimated\
    \ Zabuza and Haku hiding in the mist 5. Devised the plan to seal Kaguya 6. Countered\
    \ Shinra Tensei with chains hidden underground Knowledge and Learning Ability:\
    \ 1. Created a Shadow Clone training method for Naruto to learn complex techniques\
    \ 2. Created the Chidori and its"
