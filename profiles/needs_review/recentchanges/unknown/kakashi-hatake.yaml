        \ over a thousand techniques,Naruto, Chapter 12, Page 6 something unheard\
        \ of even among the Uchiha, and retains all of them in his memory.First Databook,\
        \ Page 192 Though the Sharingan helped him build this knowledge, he is also\
        \ a quick learner and an innovator. At a very young age, he learned the Rasengan,Naruto,\
        \ Chapter 321, Pages 6-8 an A-rank technique, and he invented complex techniques\
        \ such as the Chidori and its variationsNaruto, Chapter 113, Pages 15-16 and\
