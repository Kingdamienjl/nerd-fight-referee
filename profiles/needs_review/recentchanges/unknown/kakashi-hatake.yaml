    - field: weaknesses
      value: "Sharingan: Kakashi cannot deactivate his Sharingan at will, so he covers\
        \ it with his forehead protector to save chakra when it is not in use. Its\
        \ copying ability is limited by the user's physical capabilities: he must\
        \ meet a technique's physical and chakra requirements to reproduce it, and\
        \ he cannot copy Kekkei Genkai without the necessary genetics or chakra natures.\
        \ He must also actually see a technique to copy it. Since all of the Sharingan's\
        \ abilities are sight-based, thick mist or dust or blindness renders them\
        \ useless, and opponents too fast for it to track are safe from them. Sharingan\
        \ Genjutsu requires eye contact, and its prediction can be partly circumvented\
        \ by patternless attacks, such as Naruto's chakra armsNaruto, Chapter 231\
        \ that emerge from anywhere on his body and attack instinctively. Mangeky\u014D\
        \ Sharingan: Its techniques are far more powerful but extremely taxing to\
        \ use and maintain, and it puts great strain on the user's vision, though\
        \ Obito's Sharingan is unique in not causing blindness with use. Dual Mangeky\u014D\
        \ Sharingan: While intangible, Kakashi cannot attack physically or teleport,Naruto,\
        \ Chapter 510 and must deactivate it to do so. Transporting objects into the\
        \ Kamui dimension is faster than transporting himself, and intangibility can\
        \ only be maintained for five minutes at a time, followed by a short recharge.\
        \ New Era: After the Fourth Shinobi World War, he no longer has the Sharingan.\
        \ Notable Attacks/Techniques: Show/Hide : The Sharingan's first ability is\
        \ seeing chakra flow in color, letting the wielder tell different chakra apart.\
        \ It also lets the user perceive subtle details with incredible clarity, and\
        \ as it matures, track fast-moving objects and predict an attacker's next\
        \ move from the slightest muscle tension. It is best known for copying and\
        \ countering nearly any technique it sees, and can also hypnotize opponents\
        \ and suggest actions and thoughts to them through illusions cast by eye contact.\
        \ *Sharingan Genjutsu: The basic illusion technique of the Uchiha clan. A\
        \ Sharingan user can trap a victim in an illusion through eye contact. : An\
        \ advanced form of the Sharingan, awakened through the trauma of losing the\
        \ person closest to its user. Users usually go blind gradually with use, but\
        \ Obito's pair is unique: it does not degrade with use and regains full strength\
        \ after rest. *Kamui: The innate power of Kakashi's and Obito's Mangeky\u014D\
        \ Sharingan. It sends anything into another dimension through a swallowing\
        \ portal in the user's field of vision, and its location and size can be adjusted\
        \ at will, with larger portals costing more chakra. Early on, Kakashi could\
        \ perform it only up to three times a day, even at full strength. right|200px\
        \ *Susano'o: After receiving Obito's power, Kakashi gains the Mangeky\u014D\
        \ Sharingan in both eyes, letting him use Susano'o in its stable Perfect form.\
        \ Like other Susano'o users, he can channel all his techniques through it,\
        \ including his new Kamui Shuriken. : A basic nature transformation that generates\
        \ lightning and high-frequency vibrations for greater destructive power and\
        \ movement speed. The electricity paralyzes targets, leaving them open to\
        \ a finishing blow, and can be infused into weapons or body parts to increase\
        \ their offensive power and induce numbness. *: Kakashi's first original technique.\
        \ He gathers a large amount of lightning chakra in his hand, then charges\
        \ forward and thrusts it into the target. *: A refined, more concentrated\
        \ form of the Chidori with the same effects and drawbacks; where the Chidori\
        \ is a raging mass of electricity, the Raikiri is more focused. In Part I,\
        \ Kakashi could use it four times a day, and in Part II, at least six. *:\
        \ Kakashi and a Shadow Clone connect their Raikiri, forming a cable of lightning\
        \ that cuts through several targets at once. *: Kakashi shapes the lightning\
        \ in his hand into a hound that stays connected to him, letting him control\
        \ it as it attacks. *Purple Lightning: After losing the Sharingan, Kakashi\
        \ developed this technique to replace the Chidori, whose high-speed charge\
        \ was no longer safe without it. He fires a stream of purple electricity from\
        \ his hand at short to mid range, powerful enough to summon rain clouds when\
        \ shot into the sky, and can even channel it through spilled alcohol. : A\
        \ basic nature transformation that lets the user create or manipulate earth,\
        \ be it dirt, mud, or rock, for attack or defense. *Earth-Style Wall: Kakashi\
        \ raises a solid wall of earth as a defense, either converting chakra into\
        \ earth inside his body and spitting it out, or shaping existing soil. *Hiding\
        \ Like a Mole Technique: Kakashi turns the surrounding earth into fine sand\
        \ with chakra, letting him tunnel through it like a mole; he can tell where\
        \ he is underground by sensing magnetic forces. *Double Suicide Decapitation\
        \ Technique: Kakashi hides underground and drags his opponent down into the\
        \ earth, leaving only their head exposed and pinning them for another attack.\
        \ *Tracking Fang Technique: Kakashi summons his ninja hounds,"
