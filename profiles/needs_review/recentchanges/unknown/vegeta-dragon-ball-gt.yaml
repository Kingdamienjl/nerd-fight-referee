- id: claim-weaknesses-50436ef9
  section: weaknesses
  axis: weakness
  text: 'Vegeta is arrogant and prideful, and if overpowered by someone he considers
    below him, he can lose his temper. He also seeks strong opponents and will therefore
    allow his opponents to reach their full power for the sake of a good fight. He
    needs a substantial amount of Blutz Waves to transform into Super Saiyan 4 {|
    class="mw-collapsible mw-collapsed" align="center" border="1" cellpadding="1"
    cellspacing="1" style="width:100%" | colspan="2" style="text-align: left; " |Notable
    Attacks/Techniques: |- | : The fighting power and life force of a martial artist,
    a tangible energy derived from the user''s vigor, courage, and mind. It can be
    used in a number of ways, such as to surpass the limits of one''s body to greatly
    increase in strength, and it can be fired as blasts of energy or used to create
    defensive barriers. Along with his Saiyan blood, Ki acts as the source of Vegeta''s
    incredible power and abilities. Born with an abnormally high power level, even
    at a young age it was believed that Vegeta would certainly surpass his father,
    and for many years he remained as the strongest Saiyan in the universe. In combat,
    Vegeta often makes use of high amounts of ki blasts, firing them in large amounts
    and in rapid succession to overwhelm his opponents. As opposed to other Dragon
    Ball characters, Vegeta has a host of signature attacks. *: After extending his
    arm and opening up his palm, Vegeta creates a massive sphere of energy, which
    he then fires at his opponent, causing a massive explosion. *: By pointing his
    index and middle fingers at his opponent, Vegeta causes them to be engulfed by
    a massive explosion that destroys them from the inside out, killing most opponents
    instantly. *: The suicidal technique that Vegeta ultimately uses in attempt to
    destroy Majin Buu, converting all of his life force into energy and causing a
    massive explosion that levels his surroundings and reduces Vegeta to a crumbling
    stone statue. *: One of Vegeta''s most famous attacks. After spending some time
    gathering the massive amounts of energy needed for the technique, Vegeta releases
    it all as a massive, high-power beam of ki that can completely engulf and incinerate
    a foe. *: Vegeta''s most famous signature technique. Pulling both of his hands
    to his chest, he gathers ki before firing the beam straight at his opponent. *:
    Krillin''s signature technique, which Vegeta presumably copied from him. Raising
    his hand above his head, Vegeta creates a razor-sharp disc of ki with incredible
    cutting power, and then throws it at his opponent. It should be noted that the
    Destructo Disc can cut through opponents that are several times stronger and more
    durable. *: An energy sphere that mimics the presence of a full moon, created
    from the Blutz Waves that trigger a Saiyan''s transformation into an Great Ape.
    Saiyan Physiology: The physiology of a Saiyan, an aggressive warrior race of conquerors.
    Saiyans have the natural ability to control ki and to fly. While his lifespan
    is comparable to that of a human, Vegeta will remain at his peak strength for
    much longer. One of the most powerful abilities of a Saiyan is their ability to
    grow stronger and stronger through combat, allowing Vegeta to constantly push
    his own limits during a fight and rise to higher and higher peaks in power. This
    ability grants a substantial boost in power when Vegeta is badly injured, allowing
    him to reach a whole new level of power once he recovers. * The famous, legendary
    transformation of a Saiyan that allows them to greatly surpass their limits and
    reach the fabled state that is Super Saiyan. After desperately attempting to reach
    the state for years, Vegeta finally becomes a Super Saiyan out of sheer hopeless
    desperation. These transformations can be reached through extensive training,
    but are more often unlocked in moments of intense emotional turmoil and need,
    and due to the natural aggressiveness of Saiyans, they cause the user to become
    more aggressive and malicious, though Vegeta managed to make these things effectively
    a non-issue through training. While immensely powerful, Super Saiyan transformations
    drain a lot of energy, and the first was very inefficient before Vegeta mastered
    the state and became a "Full Power Super Saiyan", allowing him to maintain the
    form effectively indefinitely without issue. While the original Super Saiyan state
    is eclipsed in power by Super Saiyan 2, the higher forms become increasingly inefficient.
    **: Also referred to by the name "Ascended Super Saiyan", this is an extension
    of the original Super Saiyan form that forcefully floods ki through the user''s
    body by concentrating every single nerve, allowing for an increase in speed and
    strength. This is only a variant of the original Super Saiyan form, not a separate
    transformation. While it increases Vegeta''s power and speed significantly, it
    drains a lot more ki and is overshadowed by the efficiency of the Full Power Super
    Saiyan state, leading to Vegeta eventually dropping its use. *: An incredibly'
