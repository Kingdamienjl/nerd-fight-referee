    able to turn himself into a miniature Tornado, based on Earth. This can be combined
    with the other ninjas Spinjitzu to create the Tornado of Creation. *Airjitzu:
    Similar to the Spinjitzu, although it gives the ability for short-term flight.
    *Earth Dragon Summoning: When conquering his fears and doubts, Cole is able to
    summon a Dragon made out of his earth elemental powers. *Ninja Skills: As a trained
    ninja, Cole is an expert in stealth and martial arts, as well as training with
    numerous weapons. He is also notably the physically strongest ninja. *RX Punch:
