    field_candidates:
    - field: powers_and_abilities
      value: '* Golden Power: This is the most powerful elemental Power, which grants
        the user nigh omnipotence, and gives the user the ability to bend and warp
        reality as well as allowing them to defy the laws of physics. This elemental
        Power was the only power the first spinjitzu power did not give away, and
        instead, allowed for his grandson Lloyd Garmadon to inherit. * Energy: This
        elemental power is essentially a nerfed version of the Golden Power. It allows
        the user to manipulate energy in all kinds of forms, including kinetic energy.
        This Power is the Primary ability of Lloyd Garmadon * Creation: This elemental
        power is used by both Sensei Wu and Lord Garmadon, and it allows the user
        to create anything although they need already exsisting objects to do so *
        Destruction: This power is used by both Lloyd and Lord Garmadon and grants
        the user the ability to cause unseen destruction on what has shown to be a
        continental scale. * Fire: This elemental Power is possessed by Kai and grants
        the user the ability to create, and manipulate fire in different shape and
        forms, previous users who mastered the power can also manipulate the temperature
        of said fire * Lightning: This power is possessed by Jay and allows the user
        to shoot lightning bolts, manipulate lighting as well as creating thunderstorms
        and having resistance to lightning. Better users of the power can use lightning
        to surge through their body, greatly boosting their speed *Earth: This power
        is possessed by Cole and grants the user greatly boosted strength and durability,
        as well as giving the user the ability cause earthquakes, manipulate the structure
        of the land as well as being able shake mountains making them unstable *Ice:
        This power is possessed by Zane and allows the user to create ice structures,
        manipulate ice as well as its temperature. More advanced users of this power
        like the one before Zane were able to drastically change the weather wherever
        they went === Secondary Elemental'
      source_id: character-stats-profiles-cole-ninjago-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: speed
      value: 'This Power is possessed by Turner and allows the user to greatly boost
        their speed, agility and reaction time == Power of the verse == The ninjago
        verse is filled with many powerful supernatural beings and many dangerous
        villains. The majority of the characters range from Mountain Level to Large
        Country level with Massively Hypersonic to Relativistic speeds. The upper
        God tiers of the verse range from Small Planetary to Large Star level, and
        some as high as low multiversal with FTL speed Before we go further, please
        note that the calculations I do are not Gospel, or set in stone, and the only
        correct things out there. They''re just estimations that I wanted to do because
        they''re fun. You can use a different method that''s just as valid, but get
        a drastically different result. These are just rough guesses for the fun of
        it === Attack Potency and Durability calcs === * Zane freezes a river: High
        8-C (3.4 Tons) * Zane makes an ice wall: 8-B (91 Tons) * Kai vaporises Zane''s
        Ice dragon: 8-A (271.3 Tons) * Fungus freezes a lava monster: 8-A (341 Tons)
        * Zane makes an ice wall: Low 7-C (1.42 Kilotons) * Morro''s storm: 7-B (7.45
        Megatons) * Zane''s everlasting winter: Low 6-B (3 Teratons) *Asphera''s Magic'
