- id: claim-standard-equipment-348e004f
  section: equipment
  axis: equipment
  text: '*Scythe of Quakes: One of the Golden Weapons, with its power being its control
    over the elemental power of Earth *Earth Elemental Blade (Season 2): Similar to
    the Scythe of Quakes, its power is the element of Earth, and it was found in the
    Temple of Light *Earth Techno-Blade (Season 3): While normally unable to cut anything
    due to their extreme dullness, their true purpose is found when hackable technology
    is nearby. The blades transform and grow in size and are able to hack any machine
    to fit the ninja and their element, as well as their goals. *Earth Aeroblade:
    The Aeroblades are shuriken-like weapons that are dull and non-colored until touched,
    glowing brights colors usually connected to the user''s elemental power. They
    have the ability to physically interact with ghosts, since they are comprised
    of Deepstone, an aquatic material. A ghost''s only weakness is water. *Hammer
    (Post-Season 8): Similar to a sledgehammer, is about his height, and is used for
    both attack and defense.'
