      Yang]), higher with RX Punch ([https://youtu.be/nOo59qMC_I8?si=p73Urff6XKSfHsok
      Easily defeated Yang with a single blow]) | At least Star level (Far superior
      to his base self), likely higher ([https://www.youtube.com/watch?v=a67t2b_d8LI&t=2110s
      Completely overpowered and defeated] The Skull Sorcerer, who he previously struggled
      and ultimately lost to) | Low Complex Multiverse level ([https://imgur.com/a/cN7mD8x
      Enhanced by Golden Power], which is stated [https://imgur.com/a/LOoEDEh numerous
      times] to be the strongest power in the series, superior even to Darkness which
      can [https://imgur.com/a/darkness-xstgIch destroy all the Realms], a collection
      of several 5-Dimensional Hypertimelines. Possesses 1/4th of the Golden Ultra
      Dragon's power, [https://imgur.com/a/CcbZmLq a dragon made from the Ninjas'
      Elemental Powers] and is a [https://imgur.com/a/3xP1sZl manifestation of those
      powers]. This dragon [https://youtu.be/OuhDWeeGmCU?t=370 harmed] The Crystal
      King using four elemental powers. [https://www.youtube.com/watch?v=jvf0c0nbCzc&t=316s
      Equal to] the [https://imgur.com/a/FI5S9CA Oni Form] which is capable of injuring
      the Overlord as shown by Golden Oni Lloyd. Should be comparable to other Ninja
      Dragon Forms) | Star level (Comparable to Nya), higher with Spinjitzu and Golem
      Form ([https://youtu.be/9xu7R4Hlg6M?t=10 One-shotted] Sora and knocked her away)
      | Varies, from at least Star level (Far stronger than his base self. [https://imgchest.com/p/xny88986oyb
      Was enhanced by half of the Weapon of Desolation], which [https://imgchest.com/p/ljyqe6ezky2
      allowed him to clash with a Post Land of Monsters Beatrix]), up to Low Complex
      Multiverse level at peak (Even more powerful than his previous self due to [https://imgchest.com/p/wl7ld6d36yx
      being enhanced by the full power of the Weapon of Desolation], who [https://imgchest.com/p/5xy2mdlaj7l
      is said by LaRow to be so powerful it forced the FSM to split it in half and
      empower the wielder beyond all comprehension] and manipulated unbalanced Source
      Energy, which [https://imgchest.com/p/n87w2lrmg7x drained the Source Energy
      that powered the entire Realm of the Wishpering Woods]), higher with Spinjitzu,
      even higher with RX Punch
