    Mastery (Can sneak into heavily guarded spaces such as the Hypnobrai's fortress
    and the Skulkins stronghold), Acrobatics (Has shown various acrobatic skills such
    as here and here), Earth Manipulation, Sand Manipulation (Elemental Masters of
    Earth can manipulate rocks, dirt and sand), Magma Manipulation, Statistics Amplification
    with his RX Punch (Stated to be have the power of magma through his arms), Paralysis
