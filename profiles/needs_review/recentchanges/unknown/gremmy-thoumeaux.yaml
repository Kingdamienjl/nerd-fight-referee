- id: claim-weaknesses-de77befe
  section: weaknesses
  axis: weakness
  text: 'Blut Vene and Blut Arterie use two different reishi systems, so they cannot
    be used at the same time. Gremmy is quite arrogant and rather overconfident of
    his abilities. If he falters or imagines his own death, The Visionary can be used
    against him. Also, if he imagines somebody or something to be impossible to surpass
    due to being too powerful or difficult, then attempts to exceed their strength
    while he is unable to imagine an equally powerful body to properly contain it
    will cause his own power to instead fatally damage him. When using medallion,
    its user needs to be sufficiently powerful to wield it and the power stolen by
    medallion is weaker than the original unless the Quincy in question takes the
    time and effort to master it. {| class="mw-collapsible mw-collapsed" align="center"
    border="1" cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
