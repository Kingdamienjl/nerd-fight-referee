    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Martial Arts, Weapon Mastery, Preparation
        (Capable of making plans to be victorious in combat, as well as making various
        weapons to help him in battle), Limited Cyborgization (After cutting off his
        right hand, he replaced it with a chainsaw. He later did the same with some
        robotic hands and other weapons), Acrobatics (Ash has shown to be quite acrobatic
        on more than one occasion. He jumped high to grab his chainsaw), Genius Intelligence,
        Instinctive Reactions (He was able to kill Eligos without thinking), Extrasensory
        Perception (Can see Auras), Regeneration (Low-Mid: He regenerated his hand
        using a bit of evil, although it was only temporary. He was able to regenerate
        his shoulder after it was pierced by Krueger), Vehicular Mastery (He was able
        to drive a tank), Stealth Mastery (He hid from Evil Ash for 20 years without
        realizing he was still alive), Creation of Residual Images (Seen Here), Healing
        (Can heal other survivors), Invulnerability (If you receive three 3''s when
        defending a survivor. He will become invulnerable to any damage received),
        Immortality (Type 8; as long as he has hope, he will be resurrected by The
        Entity), Non-Physical Interaction (Can kill Deadite Ghosts), Resistance to
        Mind Manipulation (He was shown to be immune to Baal''s mind control, and
        counterattacked Eligos when he got into his head, managing to take control
        of the hallucination caused by the demon), Possession, Soul Absorption and
        Corruption (He returned to normal on his own after being possessed by the
        Kandarian Demon), Heat Temperatures (Ash can endure drinking boiling water
        twice, and endure having his face burned on an oven), Minor Resistance to
        Body Warp (Her face was warped by the Necronomicon and just shaking it a bit
        returned it to normal), Electricity Manipulation (It can withstand large electric
        shocks), Fire Manipulation (Withstands a strong blast of Fire from Freddy),
        Pain (Ash can carry on like nothing even after a car accident. He can take
        stabbing his hand and then cutting it off. He can take several Mini-Ashes
        sticking a fork in his butt. He can stab his leg without much pain. He can
        bear to have his hand cut off again) Durability Negation with the Kandarian
        Dagger, Portal Creation and Time Travel, Duplication (With the Necronomicon,
        he managed to create evil duplicates of himself and Cassie Hack), Summoning
        (The Necronomicon allows you to invoke the sea to the Army of Darkness or
        the demons of the dream), Reality Warping, Statistics Amplification (The Necronomicon
        allows him to amplify his strength), Transformation, Non-Corporeal, Possession
        and Self-Destruction (Using the Necronomicon he can become a sphere of energy,
        and in that form he can possess his rival. After a certain time, his rival''s
        body will explode, killing him instantly) with the Necronomicon Ex-Mortis,
        Energy Projection and Fire Manipulation (The futuristic version of his robotic
        hand includes items such as a high powered laser, grappling hook and flamethrower),
        Explosion Manipulation (Through his Dynamite, Molotov Cocktail and Rocket
        Launcher, Rocket Hand and the futuristic version of his robotic hand with
        its missiles),'
