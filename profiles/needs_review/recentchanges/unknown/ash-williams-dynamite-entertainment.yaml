  attack_potency:
    text: 'Small Building level (Can harm those who can harm him, can fight evenly
      with average Deadites, who can reduce humans to red mistEvil Dead 2). higher
      with Boomstick, Chainsaw, and the Death Coaster | At least Building level (Vastly
      superior to average Deadites,Army of Darkness: Old School casually broke Freddy
      Krueger''s arm,Freddy vs Jason vs Ash: Nightmare Warriors who endured a tank
      shell. Crushed Pestilence''s skull with a headbutt, a demon at least ten times
      more powerful than anything he fought before,Army of Darkness: Long Road Home
      and who no-sold getting struck by Necronomicon-summoned lightning Dislocated
      Earth 2149 Spider-Man''s jaw) higher with Boomstick and Chainsaw, possibly far
      higher (Damaged an avatar of destruction, seven of whom could act as a conduit
      for energy suffice to tear the planet apart. Somewhat relative to Dracula, who
      claimed that no weapon on Earth could harm him) | At least Building level physically.
      Planet level with summons (Especially powerful summons within the book can tear
      the world apart, a vision of an alternate future showed that the book could
      do just that). Up to High Universe level with the Necronomicon (Scientists who
      studied the Necronomicon concluded that it had "boundless" and "infinite" power.
      Freddy Krueger, upon empowering himself with the Necronomicon, surpassed the
      Dream Demons. The Necronomicon is capable of breaking the barriers between dimensions
      to summon the Old Ones. Using its power, Evil Ash Prime was able to destroy
      the Mirror Universe), can bypass durability in many ways'
    source_ids:
    - vsbattles-ash-williams-dynamite-entertainment-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Superhuman with Supersonic combat and reaction speed (Even while inexperienced,
      Ash dodged a point-blank shotgun blast. Outran the Kandarian Demon) | Subsonic
      travel speed with Sub-relativistic combat and reaction speed (Moved fast enough
      to leave after-images. Outran an RPG. Outran explosions. Reacted to various
      attacks from Freddy Krueger, who can attack this fast. Faster than Jason, who
      could also catch a machete propelled by Freddy in the Dream World. Dodged these
      energy beams)
    source_ids:
