  intelligence:
    text: Genius (Despite often coming off and being stated to be an idiot, Ash displays
      incredible intelligence throughout the series. He is highly skilled with several
      weapons, even using tanks in some stories, and has a wealth of experience from
      his years of fighting evil. He has a degree in engineering, which he put to
      good use by fashioning an advanced bionic hand from a knight gauntlet and modifying
      his car into the Death Coaster, and, presumably something he picked up from
      experience, a mastery in chemistry and tactics, as he was able to craft explosives
      from supplies he found in a grocery store. On another occasion, he was able
      to identify a machine rigged to explode by a genius gadgeteer. Ash also has
      picked up ancient Greece to a conversational level through his adventures. He's
      kept up with Wrath, a millennium old warrior, showing how quickly he's mastered
      combat, despite only having fought evil for a couple years by that point in
      time)
    source_ids:
    - vsbattles-ash-williams-dynamite-entertainment-unknown
    confidence: 0.6
    notes: auto_repair source extraction
