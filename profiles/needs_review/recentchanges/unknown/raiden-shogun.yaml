power_scale:
  tier:
    text: At least 6-B, higher with Musou Isshin's Full Power, far higher with the
      Musou no Hitotachi
    source_ids: &id002
    - mediawiki-4699562
    confidence: 0.8
  attack_potency:
    text: 'At least Country level (In their 500-year long duel, Ei and the Shogun
      were evenly matched making Ei only win through her skill rather than power.
      Orobashi, a giant snake God that created Watatsumi Island, believed that he
      stood no chance of defeating Ei and Makoto during the Archon War.Genshin Impact:
      Weapon: Oathsworn Eye Killed the Thunderbird with one attack, who''s subsequent
      fall left a massive crater on Seirai Island. Ei was regarded as the superior
      fighter of the Raiden twins even after Makoto became the Electro Archon and
      obtained a Gnosis, acting as her Kagemusha or "Shadow Warrior."Genshin Impact;
      Archon Quest Chapter II Act III Omnipresence Over Mortals As one of the strongest
      Archons in the Archon War, she should be comparable to the other Archons like
      Barbatos and Morax), higher with the Musou Isshin''s Full Power (Ei attained
      the ability to unleash the Musou Isshin''s Full Power after coming to fully
      understand ideals of her sister, Raiden Makoto), far higher with the Musou no
      Hitotachi (It is stated to be her ultimate technique and the pinnacle of her
      swordsmanship. This technique was strong enough to slay Orobashi in a single
      strike, even having enough power left over to destroy a massive chunk of Yashiori
      Island that was beneath the giant Serpent God, creating the Musoujin Gorge.Official
      Genshin Impact Website, Inazuma Travel Highlights: Musoujin Gorge After witnessing
      it reduce La Signora to nothingness, the Traveler believed that it would be
      impossible to defend against it24.62 Teratons)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: 'Relativistic (As the Electro Archon she should be superior to a mortal
      vision wielders such as Clorinde and Yelan. Could react to the Inazuma Traveler
      when they were boosting their speed with lightning.Raiden Shogun''s Character
      Story 2 Immensely superior to any human in Inazuma and Ayaka stated that any
      fight between her and human would end in an instant.Genshin Impact: Warrior''s
      Spirit She can also cast cloud-to-ground lightning from the sky.Character Demo
      - "Raiden Shogun: Judgment of Euthymia" As an Archon, she should be on the same
      level as Ineffa who can dodged Rerir''s attacks.Song of the Welkin Moon Act
      IV0.10c)'
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class G (As one of the Seven Archons, she should be far superior
      to a mere mortal like Tartaglia who can do this feat. Comparable to current
      Traveler)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: At least Country level (Should be comparable to the other Archons like Barbatos
      and Morax), higher with the Musou Isshin's Full Power (Ei attained the ability
      to unleash the Musou Isshin's Full Power after coming to fully understand the
      ideals of her sister, Raiden Makoto), far higher with the Musou no Hitotachi
      (is stated to be her ultimate technique and the pinnacle of her swordsmanship.)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: At least Country level (Despite Ei and the Shogun expending enough energy
      to turn day into night across their 500-year fight, they both remained in fighting
      condition and appeared largely undamaged by the time the Traveler arrivedGenshin
      Impact; Imperatrix Umbrosa Chapter Act II Transient Dreams)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (The Shogun is stated to have zero need for physical rest. Despite
      fighting each other at maximum power for over 500 years in a pocket dimension,
      neither the Shogun nor Ei were visibly tired)
    source_ids: *id002
    confidence: 0.8
  range:
    text: "Extended Melee Range normally with sword and polearm; Several Meters while\
      \ transformed; Planetary with the Authority of Electro (As the Electro Archon,\
      \ Raiden Shogun has the power to manipulate all lightning storms in the worldVoiceline:\
      \ Good Night), Interdimensional with BFR (Raiden Ei can sense the changes in\
      \ the world outside the Plane of Euthymia, and she\u2019s also able to talk\
      \ to the Traveler when she is in the Plane of Euthymia)"
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'At least Genius (She studying and perfecting the Khaenri''ah technology
      that allowed her to construct the puppet body known as the Raiden Shogun, Ei
      has made it possible for the Raiden Shogun to almost perfectly mimic her in
      every way. She also created the Wanderer who is said to be a Transcendent being
      and holds the power that rival the gods.Pale Flame Artifact: Surpassing Cup
      Dottore was so impressed with Wanderer as a creation of Electro Archon, he studied
      the Wanderer for hundreds of years so he could imitate the same thing and create
      his own segments.Wanderer''s Character Story When it comes to Sword and Spear
      combat, all Inazuman martial arts can trace their roots back to Raiden Ei. She
      established the Raiden Gokaden, the Raiden Gokaden developed from the blade-forging
      techniques taught by the Raiden Shogun, and the variations are "based on astrology,
      application, materials used, the furnace conditions, individual personalities,
      and elemental changes."Kamisato Ayaka''s Voice-Over: More About Kamisato Ayaka:
      III Even today, her expertise is seen as unparalleled, and her power is held
      up as a metaphor for Absolute Dominance), Below Average in cooking (Raiden Ei
      is very bad at cooking, to the point that she can''t be used for cooking.)'
    source_ids: *id002
    confidence: 0.8
