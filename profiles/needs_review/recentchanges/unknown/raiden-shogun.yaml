        fall left a massive crater on Seirai Island. Ei was regarded as the superior
        fighter of the Raiden twins even after Makoto became the Electro Archon and
        obtained a Gnosis, acting as her Kagemusha or "Shadow Warrior."Genshin Impact;
        Archon Quest Chapter II Act III Omnipresence Over Mortals As one of the strongest
        Archons in the Archon War, she should be comparable to the other Archons like
        Barbatos and Morax), higher with the Musou Isshin''s Full Power (Ei attained
        the ability to unleash the Musou Isshin''s Full Power after coming to fully
        understand ideals of her sister, Raiden Makoto), far higher with the Musou
        no Hitotachi (It is stated to be her ultimate technique and the pinnacle of
        her swordsmanship. This technique was strong enough to slay Orobashi in a
        single strike, even having enough power left over to destroy a massive chunk
        of Yashiori Island that was beneath the giant Serpent God, creating the Musoujin
        Gorge.Official Genshin Impact Website, Inazuma Travel Highlights: Musoujin
        Gorge After witnessing it reduce La Signora to nothingness, the Traveler believed
        that it would be impossible to defend against it24.62 Teratons)'
      source_id: vsbattles-raiden-shogun-recentchanges
