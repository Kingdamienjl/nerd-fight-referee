- id: claim-weaknesses-5cada092
  section: weaknesses
  axis: weakness
  text: 'Scout is academically inept and incredibly impulsive, which is exacerbated
    by his puffed-up self-esteem. All of these things have gotten him into trouble
    on numerous occasions. He is also insecure about his feelings for Ms. PaulingLove
    & War Update: Expiration Date. (2014, June 17). https://www.teamfortress.com/loveandwar/
    https://web.archive.org/web/20250611164255/https://www.teamfortress.com/loveandwar/
    and his attempts to impress her can distract him from time to time. Notable Attacks/Techniques:
    *Home Run: The Scout points to the sky, winds up, and swings the bat, instantly
    killing any enemy too slow, unaware, or simply unfortunate enough to be in range.
    ==Gallery== Meet the Scout ==Notable Matchups== Victories: *Rock Lee (Naruto)
    Lee''s profile (Part 1 unweighted Lee and Robot War Scout were used, Scout possessed
    the Soda Popper, Bat Saber, and BONK!, speed was equalized to both''s base states,
    both started 10 meters apart, the fight took place in the ''39 Tin Man''s forest)
    Losses: *Miss Pauling (Team Fortress) Miss Pauling''s Profile (Second key Scout
    used, his pistol was replaced with Mad Milk, and starting distance was 10 meters)
    *Ruby Rose (RWBY) Ruby Rose''s profile (Speed was equalized. Gravel War Scout
    and Beacon Ruby were used. Fight took place on 2fort, starting in Scout''s effective
    range) Inconclusive: *Demoman (Team Fortress 2) Demoman''s Profile (Robot War
    versions used, both characters had all optional equipment, and starting distance
    was 20 meters) ==References== Updates: Comics: ==Statistics Values== Category:Characters
