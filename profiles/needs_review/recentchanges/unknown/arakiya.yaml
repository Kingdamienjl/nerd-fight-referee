- id: claim-weaknesses-160aed88
  section: weaknesses
  axis: weakness
  text: "Resulting from her nature as a Spirit Eater, Arakiya is highly susceptible\
    \ to mana-poisoning.Arc 7, Chapter 28, \"Victory Conditions\" Notable Attacks/Techniques:\
    \ Spirit Eating: A lost technique from 400 years ago which allows a Arakiya to\
    \ literally grab and consume spirits, assuming their powers and nature for herself,\
    \ making use of everything that composes the natural world to battle. While the\
    \ spirits' powers can only be used until fully consumed, the fact that lesser\
    \ spirits exist everywhere means she is never wanting for fuel. Arakiya's power\
    \ not only made her the sole successful modern Spirit Eater, she in fact surpassed\
    \ all of her predecessors who who were called to oppose an ancient Witch. *Fire:\
    \ Consuming a fire spirit grants Arakiya command over heat and flames. She can\
    \ wreathe her body in inextinguishable fire of varying colors, and radiate such\
    \ intense heat that life simply cannot exist within her range. By transforming\
    \ her legs into jets of flame she can soar through the air, and fully assimilating\
    \ with fire makes her body invulnerable to physical attacks. On one occassion,\
    \ Arakiya burned down half of the Demon City of Chaosflame in a single breath,\
    \ having used the presence of lesser fire spirits to spread her flames with unnatural\
    \ speed. After devouring the Stone, the heat Arakiya could generate rose to the\
    \ extent that merely being within her range risked spontaneous combustion\u2014\
    \ the ground around her boiled into magma, and even pillars or tiles launched\
    \ as arrows vanished in the heat before they could reach Arakiya. *Water: Consuming\
    \ a water spirit grants Arakiya command over water and life. She can become one\
    \ with water, swimming at impossible speeds while remaining invisible, and she\
    \ can fire high-pressure jets of water that easily cut through stone, let alone\
    \ flesh. When Arakiya applied this logic to a flood-worth of water, her jet split\
    \ the earth all the way to the horizon. She also learned to materialize water\
    \ inside the heads of her targets, making for a deadly and efficient use of her\
    \ skills. *Wind: Consuming a wind spirit grants Arakiya command over the wind.\
    \ She can summon the likes of tornados, or raise a gale of such might that it's\
    \ less like a storm and more like being struck by a giant's palm. Arakiya can\
    \ fly with incredible speed by wearing the wind, or even assimilate with the breeze\
    \ to become transparent and untouchable. *Earth: Consuming an earth spirit grants\
    \ Arakiya command over the ground and stone. She can freely manipulate the shape\
    \ of the earth beneath her feet, or create and lift massive blocks of stone to\
    \ wield as projectiles. She can assimilate with and move through the ground without\
    \ her speed being hindered, appearing as though she's passing through the earth.\
    \ After devouring the Stone, Arakiya began to make greater use of the Great Spirit's\
    \ attribute\u2014 summoning great pillars of stone and limbs of earth to swat,\
    \ crush, and snatch at any approaching threats, and she created house-sized quadrilateral\
    \ masses of stone to fire as enormous high-speed arrows. *Light: Consuming a yang\
    \ spirit grants Arakiya command over light. She can fire rays of heat with incredible\
    \ power, and assimilate with light to become intangible, becoming those deadly\
    \ rays herself. *Shadow: Consuming a yin spirit grants Arakiya command over darkness.\
    \ She can dive into and vanish within the shadows of objects or people, and assimilate\
    \ with shadow to become an untouchable being. Spiritual Constitution: After devouring\
    \ the Stone, Muspel, and fully assimilating with its existence, Arakiya gained\
    \ a physiology similar to that of a spirit-human's. She has an eternal lifespan,\
    \ and she can swap between possessing a flesh body and a mana-body at will, making\
    \ her effectively immortal as her mana-body restores itself as soon as she is\
    \ damaged, requiring one to exhaust the practically endless mana supply she received\
    \ from the Great Spirit of Earth. *Diamond Belts: After devouring the Stone, Arakiya\
    \ began to wield 12 adamantine belts of light\u2014 these are extremely hard and\
    \ sharp magic crystals forged from her tremendous pool of mana. Each belt has\
    \ an independent will, and they cut through the world with irregular trajectories\
    \ akin to an animal rather than a weapon. As they're constructed of mana, the\
    \ 12 belts of light can deconstruct and reconstruct freely, and well as alter\
    \ then own construction to divide into ultrathin, yet deadly, articles that are\
    \ impossible to evade. ==Notable Matchups== Victories: Losses: Inconclusive: ==References==\
    \ ==Notes/Explanations== Category:Re:Zero kara Hajimeru Isekai Seikatsu Category:Light\
    \ Novel Characters Category:Female Characters Category:Isekai Characters Category:Statistics\
    \ Amplification Users Category:Supernatural Willpower Users Category:Enhanced\
    \ Senses Users Category:Extrasensory Perception Users Category:Sleep Users Category:Instinctive\
    \ Action Users Category:Accelerated Development Users Category:Absorption Users\
    \ Category:Magic Users Category:Law Users Category:Intangibilit"
