    - field: weaknesses
      value: 'As a Spirit Eater, Arakiya is extremely sensetive to massive amounts
        of mana being released around her, where if she absorbs too much mana from
        the atmosphere, it will result in Mana Poisoning which makes people confused,
        sick and eventually results in death Notable Attacks/Techniques: *Spirit Eating:
        Arakiya has the power to eat spirits, assimilate her body with them and use
        their powers as her own without needing to form a contract with them. By eating
        a Water micro-spirit, for example, she''s described as almost becoming one
        with water, allowing her to swim past Demon Beasts residing in the waters,
        undetected. Her power is so strong that it even allowed her to take in one
        of the Four Great Spirits'' power without losing her sanity. Arakiya is able
        to use other spirits'' powers until she completely digests them, and it is
        unknown what happens to spirits, after she eats them. Furthermore, the firmer
        one''s sense of self is, the better they are with their power. This ability
        does have a downside, however. If exposed to larger quantities of mana, Arakiya
        will become confused and eventually sick, as she starts experiencing symptoms
        of mana poisoning. This trick was used against her at the Battle of Guaral,
        when Vincent flooded the entire room with mana, confusing her and allowing
        Al to hold his own against her. This ability was originally a secret technique
        wielded by unnamed tribes living on the frontier of the Empire, but were wiped
        out due to the ability''s potential. Currently, Arakiya is the only known
        spirit eater. Note: Arakiya holds the ability to use all kinds of magic in
        Re:Zero due to having eaten countless Spirits of different affinities in the
        past Category:Morning Star TM Category:Tier 4 Category:Tier 1'
      source_id: character-stats-profiles-arakiya-unknown
      provider_id: character_stats_profiles
