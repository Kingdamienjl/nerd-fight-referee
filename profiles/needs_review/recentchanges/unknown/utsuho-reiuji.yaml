- id: claim-powers-and-abilities-0ba28b84
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Flight *Danmaku *Spirit Manipulation
    *Limited Creation & Conceptual Manipulation (Type 1; The process of creating a
    spell card requires giving it a ''name'' to define its form and power, not unlike
    how the gods gave ''names'' to everything at the beginning of reality to give
    them form from nothingness, albeit on a much smaller scalePerfect Memento in Strict
    Sense, Draft of Spell Card RulesImperishable Night, Afterword Curiosities of Lotus
    Asia, Chapter 15 ) *Power Modification (Spell card users are capable of changing
    the traits of any attack or ability by naming it, being able to turn ordinarily
    lethal attacks into nonlethal ones, or severely restricting the potency of an
    ability by ''gameifying'' itAlternative Facts in Eastern Utopia, Essay: Marisa
    KirisameThe Grimoire of Marisa, Reimu Hakurei''s spell cards ) *Magic *Extrasensory
    Perception (Magic users are sensitive to changes in temperamentScarlet Weather
    Rhapsody, Patchouli''s Scenario ) *Acausality (Types 1 & 4; Unaffected by Keine
    erasing the human village from historyImperishable Night, Stage 3 , despite the
    fact that youkai rely on the continued existence of the human village in order
    to sustain their own existencePerfect Memento in Strict Sense, Human Village .
    Exists within the Hakurei BarrierWild and Horned Hermit, Chapter 25 , which created
    a world with a different flow of timeWild and Horned Hermit, Chapter 19 and different
    physical lawsDr. Latency''s Freak Report . Should be comparable to those who can
    act normally inside Eientei, which exists outside of time and causalityCage in
    Lunatic Runagate, Chapter 2 Bohemian Archive in Japanese Red, Eientei ) *Natural
    Weaponry & Cyborgization (Partial; Has a nuclear control rod replacing her right
    hand, which she can use as an energy cannon) *Acrobatics *Transformation & Matter
    Manipulation (Can make matter undergo fusion reactions) *Radiation Manipulation,
    Heat Manipulation, Energy Manipulation & Gravity Manipulation (Her artificial
    suns have their own gravity) *Explosion Manipulation (Many of her attacks can
    cause explosions) *Fire Manipulation (Her spell cards can throw out a large number
    of fireballs) *Magma Manipulation (Can turn the ground to magma) *Light Manipulation,
    Madness Manipulation & Status Effect Inducement (Is so dazzling that looking at
    her causes blindness, and gazing into her eyes can make one go insaneSubterranean
    Animism, Marisa and Patchouli''s Scenario, Stage 6 ) *Forcefield Creation *Non-Physical
    Interaction (Can harm Phantoms and Evil Spirits with her regular attacks) *Longevity
    (Youkai lifespans are longer than that of humansPerfect Memento in Strict Sense
    Encyclopedia: Youkai , and half youkai such as Rinnosuke seemingly do not age
    at allCuriosities of Lotus Asia, Chapter 20 ) *Enhanced Senses (Youkai can see
    better than humans in the dark of nightCage in Lunatic Runagate, Chapter 1 ) *Shapeshifting
    (Upon entering Gensokyo, youkai gained the ability to change their form as they
    pleaseSymposium of Post-mysticism, Part 3 Wild and Horned Hermit, Chapter 9 ,
    often choosing to take forms more closely resembling that of humansPerfect Memento
    in Strict Sense, Wriggle Nightbug Forbidden Scrollery, Chapter 19 ) *Intangibility
    (Youkai can break themselves down intoForbidden Scrollery, Chapter 13 Forbidden
    Scrollery, Chapter 15 , or regenerate fromOriental Sacred Palace, Chapter 17 Wild
    and Horned Hermit, Chapter 1 Wild and Horned Hermit, Chapter 8 Silent Sinner in
    Blue, Chapter 6, a sort of black mist. They are also repeatedly shown to form
    from this mist out of thin air) *Incorporeality (Youkai are stated to be unbound
    from the confines of the material worldLotus Eaters, Chapter 28 , and are made
    of SpiritBohemian Archive in Japanese Red, Eirin''s Interview ) *Regeneration
    (Mid-Godly; Youkai are able to recover from bodily destruction, despite being
    made of SpiritPerfect Memento in Strict Sense, Beast Youkai Bohemian Archive in
    Japanese Red, Eirin''s Interview . They can also quickly recover from their Spirit
    being drained or destroyed) *Aura, Sense Manipulation & Fear Manipulation (All
    youkai possess ''youkai energy'' that takes the form of an auraGrimoire of Usami
    . This aura can make one feel pins and needles throughout their bodyForbidden
    Scrollery, Chapter 5 , can make one start to trembleForbidden Scrollery, Volume
    Two Bonus Sketches and 4koma , and is powerful enough to deliver these effects
    even while sealed awayForbidden Scrollery, Chapter 5 . Successfully inducing fear
    in a target also allows a youkai to absorb their SpiritUndefined Fantastic Object,
    Sanae''s A Scenario ) *Aura Suppression (Youkai commonly infiltrate the human
    village without their auras affecting nearby peopleCheating Detective Satori,
    Chapter 17 , and areForbidden Scrollery, Chapter 33 shownForbidden Scrollery,
    Chapter 5 Forbidden Scrollery, Chapter 37 Forbidden Scrollery, Chapter 38 to be
    able toForbidden Scrollery, Chapter 10 mask their auras fromForbidden Scrollery,
    Chapter 14'
