  name: 700px ==Summary== Albedo is Azmuth's former assistant. He is originally a
    Galvan but he now resembles a clone of Ben through his nearly successful attempt
    to recreate the Omnitrix. His Omnitrix synced itself with Ben's against his will,
    causing his default form to resemble Ben, to his great distaste. He first appeared
    exactly like Ben and wore exactly the same clothing. But after his and Ben's Omnitrix
    reacted to each other, it sent out a pulse that damaged his DNA and thus his form,
    inverting his colors. This made his hair white, his skin slightly paler, his eyes
    red, his eyebrows black and turned the colors of his jacket from green with white
    stripes to red with black stripes. ==Powers and Stats
