  intelligence:
    text: 'Below Average (Most beings in the series are silly and childish to a degree.
      Squishys are not shown being able to talkKirby''s Avalanche is a non-canon game,
      see here. It has a Squishy talking with Kirby and playing against him in a tournament.,
      but they are proven to have human-like intelligence) Some Squishys willingly
      form part of King Dedede''s Army: *Squishys are enemies in Kirby''s way during
      Dedede''s first plot, and were replaced for the stronger Flotzos, who acts similarly,
      during its Extra Game, which Dedede initiated as a tougher rematch against Kirby.
      *A Squishy can play as a goalkeeper of a mini-game inside Pinball Land, catching
      Kirby as a ball and throwing him back. They enjoyed playing there, with a Squishy
      running back to Pinball Land for another round at the end of the game among
      all other enemies. *Squishys are among the servents who carried a star [A small
      star creature, not an actual celestial body Dedede stole, being ordered by Dedede
      to stand guard and wait for Kirby to arrive]. **They were given a stolen star
      to guard on two separate occasions. *Holds a white flag when King Dedede is
      defeated, surrendering to Kirby & co. while representing King Dedede''s ArmyKirby''s
      Star Stacker, Super Famicom version. *Squishys can get teleported in to face
      Kirby by unknown means during one of Dedede''s games. In Kirby: Triple Deluxe=It''s
      possible that some Squishys were commanded by Queen Sectonia as her minions:
      Squishys appear as enemies in Floralia, which Sectonia conquered. However, creatures
      opposing Sectonia still run around Floralia, meaning that every enemy there
      might not be serving Queen Sectonia. It''s likely that some Squishys were commanded
      by Crowned Doomer as its minions: Squishys can get teleported in to face Magolor
      by unknown means along many other enemies. However, they could just be inhabitants
      of the dimensions where Magolor is, without serving Crowned Doomer. The Squishys
      in this story have stolen some Magic Points for themselves, likely understanding
      their power, and several other regular enemies are referred to as "enemy troops"
      "drawn by [their power"].'
    source_ids:
    - vsbattles-squishy-unknown
    confidence: 0.6
    notes: auto_repair source extraction
