    - field: powers_and_abilities
      value: 'Base= Superhuman Physical Characteristics, Weapon Mastery (Primarily
        wields staves to use magic. Wields a katana in 4GO), Adept in martial arts,
        Transformation (Into White Sister Rom with HDD [Hard Drive Divinity]), Fourth
        Wall Awareness, Acrobatics, Healing (Transforming into her goddess form fully
        restores her HP and SP. Also with "I''ll Heal You" and "You''re Okay"), Acausality
        (Types 1, 3, and 4; Was unaffected by having the entirety of Hyper Dimension''s
        history itself being rewritten and even normal citizens kept their memories
        after the world was rewritten. It''s explained by Histoire that time and causality
        splits people''s past and future into multiple timelines to protect them from
        paradoxes and causal changes), Flight, Immortality (Types 1, 3, 4, 8; As a
        goddess, Rom cannot age, as age does not apply to goddesses. The Player can
        simply resurrect her or reload a save file if she loses at all. CPUs are reliant
        upon Share Energy and so long as there are shares, they can indefinitely revive
        themselves. Auto-Raise [should have it from scaling to Neptune] automatically
        resurrects her whenever she dies or is knocked out in battle.), Large Size
        (Type 11), Beyond-Dimensional Physiology (As with all other entities in the
        Neptunia series, her existence is beyond the concept of numerical dimensionality,
        as all beings evolved alongside Gamindustri into beyond dimensional existences),
        Fate and Plot Manipulation (Passive; Scaling from Neptune, as any protagonists
        should have it based on Neptune''s statements and showings [Rom was one of
        the protagonists for a period of time in Megadimension]. Should have similar
        capabilities to that of Blanc and Noire, whom prevented a boss battle so the
        player didn''t have to waste their time with it), Forcefield Creation, Self-Sustenance
        (Types 1, 2, and likely 3; CPUs have repeatedly displayed a lack of need for
        breathing in several continuities. As noted and displayed in Victory/RB3,
        CPUs do not require sustenance to stay alive and cannot starve to death. CPUs
        can remain in active combat with no rest for billions of years with no sign
        of tiredness, as displayed in the original Hyperdimension Neptunia, where
        the four CPUs have fought for eons.), Abstract Existence (Type 2; Goddesses
        are born from and are embodiments of Share Energy and won''t perish so long
        as they have it), Conceptual Manipulation (Share Energy wielders can freely
        manipulate it to their whim. Share Energy is directly stated to be the concepts
        of will, faith, emotion, and desire. Share Energy can erase the true form
        of the Deity of Sin from existence by killing its manifestation, with the
        True Deity of Sin being abstract and conceptual in nature.), Hammerspace,
        Blessed (The Player can grant her the ability to One Shot opponents, give
        her Invulnerability, and/or weaken the opponent), Share Energy Manipulation
        (Lower End Applications), Information Analysis (The Observation Scope and
        Analyser allow her to analyze information of a foe, including but not limited
        to: heart rate, temperature, item drops, held items, health, stamina, statistics,
        and resistances), Weapon Creation (Can create her weapons out of nothing on
        the fly in just a couple of seconds), Extrasensory Perception (Can sense various
        forms of energy, including share energy and negative energy), Positive Emotion
        Empowerment (As a goddess she gains strength from share energy, which is consistently
        regarded to as positive emotions like hopes, desires, prayers, and faith.
        Share energy has also been referred to as the opposite to negative energy.),
        Non-Physical Interaction (Regular enemies include ghosts and beings made of
        data), Durability Negation, Damage Boost (Via Critical hits), Enhanced Senses
        (Sneaking Eye shows what the enemies can see), Perception Manipulation (Thanks
        to the White Orb, enemies won''t attack unless they''re attacked first), Regeneration
        (High-Godly; She can passively heal off damage from the remade Dark CPUs,
        which have Conceptual Manipulation due to possessing the abilities of the
        Next Form users.), Status Effect Inducement (In the form of Paralysis, Poison
        and Power Nullification), Magic (via various attacks), Elemental Manipulation
        (Of Water, Fire, Ice, Electricity, Earth, Poison, Air, Light, and Darkness
        through various attacks. She has the option of infusing one or more of these
        elements into her every attack [Scaling off of Neptune].), Absolute Zero Ice
        (Was taught to use Absolute Zero ice attacks by her older sister), Limiter
