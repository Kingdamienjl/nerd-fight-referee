    - field: intelligence
      value: Genius. Snape is considered even by Voldemort to be an exceptional wizard.
        As a child, he was known to be an unusually gifted student, with Sirius Black
        claiming that he knew more curses in his first year than many of the 7th year
        students in Hogwarts, and his magical prowess was so great as a teenager that
        his bully and rival, James Potter would never have taken him on in a one on
        one fight unless he was backed up by his 3 friends. Snape was highly skilled
        in practically all branches of magic, but he had a specialty for the Dark
        Arts and has created many useful spells used by the Death Eaters and sometimes
        even by his rivals. He was also a highly skilled potioneer, and has altered
        potion formulas so that it would be easier and more efficient to produce them.
        His instructions for making potions enabled Harry, who was a mediocre potion
        student, to surpass even Hermione Granger in potions. Additionally, he was
        highly skilled at espionage, and alongside his considerable talents in Occlumency,
        managed to spy on the Death Eaters without ever drawing suspicion even from
        Voldemort himself.
      source_id: mediawiki-222965
      provider_id: vsbattles
      authority: high
      confidence: 0.75
