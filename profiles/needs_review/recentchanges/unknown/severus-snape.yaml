- id: claim-weaknesses-b2ad0c1a
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Sectumsempra: A rather dangerous
    curse, created by Snape himself, when the incantation is uttered its effect is
    the equivalent of an invisible sword; it is used to slash the victim from a distance,
    causing rather deep wounds. The slash follows the user''s wand movements. Due
    to the depths of the cut, the victims run the risk of dying from blood loss if
    treatment is not applied in time, if the wounds are not instantly fatal. *Vulnera
    Sanentur: A healing spell that can heal someone who is even hit by sectumsempra.
    For the maximum effect of the spell, the incantation had to be repeated thrice;
    firstly slowing the flow of blood to prevent death by exsanguination; the second
    to clear residue and begin to heal the wounds; and the third to fully knit the
    wounds, although dittany had to be applied to prevent scarring. *Avada Kedavra:
    The Killing Curse is a tool of the Dark Arts and one of the three Unforgivable
    Curses. It is one of the most powerful and sinister spells known to wizardkind.
    When cast successfully on a living person or creature, the curse causes instantaneous
    death. *Many other spells, potions, charms and curses. ==Notable Matchups== Victories:
    Losses: Inconclusive: Category:Characters Category:Wizarding World Category:Adults
    Category:Alchemists Category:Book Characters Category:Fantasy Characters Category:Flight
    Users Category:Geniuses Category:Healers Category:Humans Category:Live-Action
    Characters Category:Magic Users Category:Male Characters Category:Matter Users
    Category:Movie Characters Category:Potion Users Category:Status Effect Users Category:Teachers
    Category:Telekinesis Users Category:Telepaths Category:Teleportation Users Category:Tragic
    Characters Category:Wand Users Category:Wizards'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-efb963e4
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Magic, Genius Intelligence, Teleportation,
    Transmutation (Highly skilled at Transfiguration), Telepathy via Legilimency (Snape
    can read thoughts, and has attacked Harry's mind as part of his training in Occlumency.
    He can apply this to combat via reading a target's mind to discern their future
    actions based on their thoughts, as shown when he was able to predict what spells
    Harry Potter would attempt to attack him with), Curse Manipulation (Knows the
    Unforgivable Curses and has invented a few himself. Knew more curses when he arrived
    at Hogwarts than half the kids in Seventh Year), Summoning (Can conjure a Patronus),
    Forcefield Creation, Matter Manipulation, Excellent at potion making, Durability
    Negation, Status Effect Inducement (With a variety of spells and potions), Healing
    (Partially healed Dumbledore's hand after being cursed by Marvolo Gaunt's Ring,
    saved Katie Bell from a cursed necklace, and healed Draco's wounds from the effects
    of Sectumsempra), Resistance to Mind Reading and Mental Attacks via Occlumency
    (A master of Occlumency, he blocked Voldemort's influence for several years and
    acted as a double agent the whole time. He has been implied to be able to resist
    the Imperius Curse and even the effects of Veritaserum), Flight, Telekinesis,
    Death Manipulation (via Avada Kedavra), Genius Intelligence
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
