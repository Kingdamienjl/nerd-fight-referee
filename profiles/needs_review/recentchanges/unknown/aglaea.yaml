    - field: weaknesses
      value: "X-Gate: Spatial magic which allows the user to create portals and travel\
        \ vast distances, simply connecting the coordinates with each other. It is\
        \ a combination of Arcane Magic and Divine Magic. The Divine Magic and Arcane\
        \ Magic touch each other, distorting the world created by the Goddess Arovinas.,\
        \ Observing Eyes: An that displays the level, and even the stats of an opponent\
        \ if the user is skilled enough. However unless your own level is double that\
        \ of Search Eye\u2019s target, only their name and level will be displayed.\
        \ Furthermore, if the target\u2019s level equals or exceeds your own, Search\
        \ Eye will fail to activate., Memory Manipulation: A skill which lets her\
        \ rewrite or erase the memories of anyone she sees., Metal-Attribute Arcane\
        \ Magic: Arcane magic which can be used to give birth to a metal., Cleta:\
        \ An ability which creates thousands or even tens of thousands of Metal-attribute\
        \ raindrops which she drops on her opponent., Dawn Star: The strongest Aoe\
        \ Metal attribute arcane magic which creates a gigantic globe, kilometers\
        \ in diameter high up in the sky which she then uses X-Gate to bring it down\
        \ towards her opponent., Auxo: An ability which uses her Metal-attribute raindrops\
        \ to create trees by bathing the earth with them., Aglaia: An ability which\
        \ creates a bright light which blinds her opponent., Illusion: Water magic\
        \ which uses mists to confuse the opponents and change one\u2019s appearance.,\
        \ Star of Asclepius: The highest-tiered Water attribute divine magic. The\
        \ effect of the skill is to fully recover the HP of all allies within the\
        \ specified area around the user whilst stripping all status buffs, irrespective\
        \ of their effects, and it also comes with the effect of resurrecting the\
        \ dead., Rasalhague: The most powerful unique skill, which has the effect\
        \ of activating all the ouroboroses simultaneously. As the stand-in for the\
        \ Goddess, she has the ability to wake the ouroboroses, not only that, she\
        \ has the authority to give orders to them., Yed Posterior: A unique skill\
        \ which is used to control time. A set period of the target's time is cut\
        \ away and removed, causing the enemy\u2019s movement itself to elongate over\
        \ the cut period. It is an extraordinary skill only usable because she is\
        \ the proxy of the Goddess. It is an absolute skill with an unfair effect.\
        \ Not only that, this skill\u2019s effect only become more potent the more\
        \ time the target was placed under. Eventually, not only is the target\u2019\
        s time stop completely, it goes beyond that, and tread into the negative territory.\
        \ The target\u2019s time itself is revert and rewind back into the past. This\
        \ skill can't be prevented and it takes absolute priority over all others\
        \ that are in place., Cebalrai: A unique skill which manipulates the target\u2019\
        s memory, the user is able to make the target perceive them as air or a rock,\
        \ thus making them unable to feel their presence. It has the priority rank\
        \ 6, it takes precedence over every other skill. It cannot be negated by any\
        \ means., Muliphen: A unique skill which can assign a maximum damage restriction\
        \ on the target. It is able to drop their maximum damage down to 9999. It\
        \ has the priority rank 6, it takes precedence over every other skill. It\
        \ cannot be negated by any means., Yed Prior: A unique skill which separates\
        \ the target\u2019s time from the surroundings and allows it to be sped up\
        \ infinitely without an upper limit. Eventually, the target of this skill\
        \ can be sped up such that they transcend past the limit and concept of time\
        \ itself. It has the priority rank 6, it takes precedence over every other\
        \ skill. It cannot be negated by any means., Sabik: A unique skill that creates\
        \ skills. However, this does not mean that it can create any skill whatsoever\
        \ on a whim. There are 100 points that can be distributed out during the creation\
        \ of a skill. For example, if the power of the skill is raised too much, it\
        \ may end up as an extremely destructive skill but possesses a terrible accuracy\
        \ rate or end up as a skill with no special effect. Alternatively, if you\
        \ evenly distribute points to those effects, there will be less assignable\
        \ points to power. Additionally, if the previously made skill still remains\
        \ in place, Sabik cannot be used to create another skill. If Alovenus wants\
        \ to create a new skill, she will need to get rid of the previously created\
        \ skill., Marfik: A unique skill which allows the Goddess to possess the body,\
        \ skyrocketing all stats by multiple times. When this skill was used, Dina\
        \ in a very literal sense, became the Goddess\u2019s avatar. Her consciousness\
        \ was be erased. This skill can be activated by the Goddess, regardless of\
        \ Dina\u2019s will. It has the priority rank 6, it takes precedence over every\
        \ other skill. It cannot be negated by any means., Subspace Seal: A skill\
        \ which abandons the targ"
