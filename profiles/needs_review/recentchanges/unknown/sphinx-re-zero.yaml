      value: 'None notable Notable Attacks/Techniques: *Jiwald: Jiwald is a Yang Element
        magic that allows Sphinx to fire heat rays from her fingers. Sphinx is able
        to use all four levels of this magic. Jiwald is a straight-line attack, which
        makes it seem like it would have the weakness of being easy to avoid however,
        the heat ray forcefully smashed things at lightspeed, attacking straight at
        its prey. **Al Jiwald: The ultimate form of Jiwald, in which she fires Jiwald
        from her entire palm instead of just her finger tip. *Flying Magic: Sphinx
        uses Flying Magic, allowing her to float in the sky. *Immortal King''s Sacrament:
        The Immortal King''s Sacrament can be used to resurrect people from the dead,
        though the effect of the magic depends on the skill of the user. As the version
        Sphinx used was incomplete, she was only able to reanimate corpses. *Parasite
        Creation: Sphinx has the ability to create parasites that take over a living
        target''s body and turns them into "zombies". *Barrier: Sphinx is able to
        deploy a barrier that strongly affects her opponents the more magic ability
        they have. *Al Shario: A spell used by Echidna, which was capable of casting
