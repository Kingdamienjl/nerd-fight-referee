    - field: weaknesses
      value: "Possession: Being a sentient walking collection of armor, Armored Darkness\
        \ needs a host to combine with in order to empower itself to its full power.\
        \ To do this he often imprisons the being inside of him., Darkness Broad (\u30C0\
        \u30FC\u30AF\u30CD\u30B9\u30D6\u30ED\u30FC\u30C9, D\u0101kunesu Bur\u014D\
        do): As a backup weapon should his trident be lost, Armored Darkness is armed\
        \ with a giant sword that's incredibly sharp, sharp enough to penetrate the\
        \ toughest of material and even cut through his own armor. If another being\
        \ obtains it, they will be influenced to do his bidding, unless they are a\
        \ powerful being like Mebius Phoenix Brave. He can also summon this weapon\
        \ to his hands if needed. Also, other beings like Alien Mefilas, if made a\
        \ direct touch with it can turn himself into Armored Mefilas., Darkness Trident\
        \ (\u30C0\u30FC\u30AF\u30CD\u30B9\u30C8\u30E9\u30A4\u30C7\u30F3\u30C8, D\u0101\
        kunesu Toraidento): Armored Darkness is armed and equipped with and uses a\
        \ gigantic, double bladed, trident as his main weapon and he can use with\
        \ great skill and it can extend to any length it wishes at frightening speed\
        \ making it good for range combat, increasing its length at rapid speed, allowing\
        \ him to strike objects normally out of its reach. He can fire an extremely\
        \ powerful dark beam from its tip, as well as enhance its power with a lightning\
        \ bolt from its tip, as well as purple energy blasts from its tip. This trident\
        \ can put anyone under its influence if he/she picks it up and also change\
        \ size and length., Darkness Blasts: Armored Darkness can launch numerous,\
        \ very powerful, purplish blasts of energy fired from his trident. These blasts\
        \ can create massive explosions, some rivaling his own size., Rezolium Ray\
        \ (\u30EC\u30BE\u30EA\u30E5\u30FC\u30E0\u5149\u7DDA, Rezory\u016Bmu K\u014D\
        sen): Armored Darkness can launch a very powerful, devastating red and black\
        \ beam of dark energy fired from the tip of his trident spear, similar to\
        \ that of Alien Empera's Rezolium Ray. This beam has enough firepower to completely\
        \ destroy a mountain in a single hit. It can also be charged with dark red\
        \ lightning that is equally as strong., Giga Rezolium Ray (\u30AE\u30AC\u30EC\
        \u30BE\u30EA\u30E5\u30FC\u30E0\u5149\u7DDA, Giga Rezory\u016Bmu K\u014Dsen):\
        \ By repeatedly spinning his trident anticlockwise, Armored Darkness can charge\
        \ his Rezolium Ray to incredible levels, making it near deadly to the opponent.,\
        \ Darknesphere (\u30C0\u30FC\u30AF\u30CD\u30B9\u30D5\u30A3\u30A2, D\u0101\
        kunesufia): Armored Darkness travels in a dark sphere like Alien Empera. If\
        \ this dark sphere collides with Earth it will destroy it. This dark sphere\
        \ also contains a dark dimension that eradicates Ultra powers and amplifies\
        \ his own., Reformation: If destroyed, Armored Darkness is capable of reforming\
        \ his entire body, without any amount of previous damage, in just seconds\
        \ so long as he is on the Dark Planet he controls., Armor: Being a living\
        \ suit-like being composed of armor, Armored Darkness can stand up to and\
        \ is resistant just about nearly any attack and many basic physical and projectile\
        \ attacks. It became even tougher after being revived by Alien Reiblood, even\
        \ capable of surviving a direct hit from the Pedanium Launcher. This can enable\
        \ him to toss opponents by either striking or countering an opponent's move\
        \ with great force., Revival/Monster Dispersion: Armored Darkness can revive\
        \ fallen monsters at will. He can also create monsters with dark energies,\
        \ doing so to create Zarabon and Garourar. ULTRA MONSTERS:, Reionic Fusion\
        \ (\u30EC\u30A4\u30AA\u30CB\u30C3\u30AF\u30D5\u30E5\u30FC\u30B8\u30E7\u30F3\
        , Reionikku Fy\u016Bjon): Under possession of Reiblood, Armored Darkness can\
        \ fire his own version of Giga Rezolium Ray called the Reionic Fusion, which\
        \ was said to be the combination of the armor's energy with his Reionic energy.\
        \ This cannot be considered as a tag-team combination, since at that time,\
        \ Reiblood is assumed as the player themselves and Armored Darkness is only\
        \ present as part of Reiblood's attack., Dead Slasher (\u30C7\u30C3\u30C9\u30B9\
        \u30E9\u30C3\u30B7\u30E3\u30FC, Deddo Surassh\u0101): Armored Darkness first\
        \ threw the lethally charged Darkness Trident to the opponent before charging\
        \ forward and slash them with the Darkness Broad., Inpelaizer Splash (\u30A4\
        \u30F3\u30DA\u30E9\u30A4\u30B6\u30FC\u30B9\u30D7\u30E9\u30C3\u30B7\u30E5,\
        \ Inperaiz\u0101 Supurasshu): A tag-team attack made with an Inpelaizer. The\
        \ Inpelaizer first charge towards the opponent and perform a high speed rotation\
        \ to slash the target with its sword. Armored Darkness charges its Darkness\
        \ Trident and throw it towards both the Inpelaizer and the slashed opponent,\
        \ causing the two to be destroyed. However, the Inpelaizer survived due to\
        \ its lower waist and simply regenerated its upper body."
      source_id: character-stats-profiles-gomora
