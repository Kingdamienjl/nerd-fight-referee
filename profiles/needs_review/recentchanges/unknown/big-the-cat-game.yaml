power_scale:
  tier:
    text: 4-B, higher with 3 Power Cores | Low 2-C to 2-C
    source_ids:
    - vsbattles-big-the-cat-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Solar System level (Physically the strongest member of Adventure Team Rose,
      making him stronger than Adventure Amy and Adventure Cream. Capable of harming
      members of Adventure Team Sonic) higher with 3 Power Cores ([https://cdn.imgchest.com/files/07589f4a2ba9.jpg
      each Power Cores doubles the user's physical characteristics]) | Universe level+
      (Survived in [https://youtu.be/kevLVP-IqtQ?t=453 the Arabian Nights] while Erazor
      Djinn was attacking it during Sonic and the Secret Rings) to Low Multiverse
      level (Could harm and overwhelm ordinary Zombots, [https://cdn.imgchest.com/files/6fcb65be379f.jpg
      who are highly durable to even the other heroes]. Often considered to have tremendous
      power), higher with the Boost
    source_ids:
    - vsbattles-big-the-cat-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively FTL (Can keep up with Chaos 6) to Massively FTL+ (Can keep up
      with the rest of Team Rose), higher with 3 Power Cores (Each Power Core doubles
      the physical characteristics of the wielder, and Big can hold up to 3) | Massively
      FTL+ (Can [https://www.youtube.com/watch?v=dwdNnVrO3MM&t=77s race against Metal
      Sonic/Metal Sonic 3.0] and Jet [https://www.youtube.com/watch?v=rElxZc2RWZg&t=26s
      on his Type-J Extreme Gear]), higher with the Spin Attack and Boost
    source_ids:
    - vsbattles-big-the-cat-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class M (Able to lift giant boulders and cars with ease. Physically stronger
      than Adventure Vector) | Class M, likely at least Multi-Stellar
    source_ids: &id002
    - mediawiki-311850
    confidence: 0.8
  striking_strength:
    text: Solar System level, higher with 3 Power Cores (Can harm the individual members
      of Team Sonic with his strikes) | Universe level+ to Low Multiverse level
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Solar System level, higher with 3 Power Cores (Can withstand attacks from
      the likes of Adventure Sonic and Adventure Knuckles), Up to Complex Multiverse
      level (6-D) Damage Transferal with Rings
    source_ids:
    - vsbattles-big-the-cat-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Journeyed alongside Adventure Amy and Adventure Cream for three
      days with minimal rest, fighting Dr. Eggman Badnik forces all the while) | Superhuman
    source_ids:
    - vsbattles-big-the-cat-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range; Tens of Meters with his Fishing Rod
    source_ids:
    - vsbattles-big-the-cat-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Below Average generally, Gifted in Combat and with Machinery (Although he
      is generally simple-minded and unintelligent, he is a very experienced fisherman,
      is capable with technology, being able to pilot Tails' Tornado 2 plane when
      seeing it for the first time, pilot the Eggwalker and he is good at piloting
      his personal vehicle Frog Cruiser on par with other racers like Sonic or Shadow,
      and is also an extremely skilled swimmer and climber. He is also a very capable
      combatant as he fought Metal Madness alongside the rest of Team Rose.)
    source_ids:
    - vsbattles-big-the-cat-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
