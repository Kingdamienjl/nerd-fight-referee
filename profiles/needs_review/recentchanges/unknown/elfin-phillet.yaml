- id: claim-weaknesses-562516de
  section: weaknesses
  axis: weakness
  text: "Physical Conditioning: Because she specializes as a rear-line operator, she\
    \ has relatively low physical stamina compared to frontline Holy Swordswomen and\
    \ suffers from low blood pressure and drowsiness in the mornings. Standard Tactic:\
    \ Elfin\xE9 operates primarily from the rear or from an aerial/mobile command\
    \ post, deploying up to eight Eye of the Witch orbs across the battlefield to\
    \ map terrain, scan enemy mana signatures and Holy/Demon Sword properties, maintain\
    \ telepathic communication with her allies, and calculate long-range firing trajectoriesThe\
    \ Demon Sword Master of Excalibur Academy - Volume 1The Demon Sword Master of\
    \ Excalibur Academy - Volume 2The Demon Sword Master of Excalibur Academy - Volume\
    \ 3. In tactical engagements, she hides orbs inside robotic units or behind walls\
    \ to ambush opponents with blinding flashes and crossfireThe Demon Sword Master\
    \ of Excalibur Academy - Volume 7, or uses her orbs to jam enemy mana waves and\
    \ hack nearby terminalsThe Demon Sword Master of Excalibur Academy - Volume 1The\
    \ Demon Sword Master of Excalibur Academy - Volume 2. In direct combat, she relies\
    \ on Eye of the Witch's Auto-Guard barriers while firing her Ray Hawk-model mana\
    \ handgun, and shifts Eye of the Witch into Vorpal Ray mode to unleash converging\
    \ laser beams, a triangular disintegration barrier, and Tri-Flare BurstThe Demon\
    \ Sword Master of Excalibur Academy - Volume 5The Demon Sword Master of Excalibur\
    \ Academy - Volume 9. As the Demon Sword Queen, she flies in midair with her black\
    \ wings, uses all-range homing heat beams and predictive Ray of Vorpal barrages\
    \ to overwhelm her target, and finishes them with The Binary Star of Ruin \u2014\
    \ Tri-Flare BlasterThe Demon Sword Master of Excalibur Academy - Volume 12."
  source_ids: *id003
  decisive: false
