        Infinite Gacha: In the world where Light resides, while being the weakest
        race, are blessed with the extremely rare chance to have a special skill called
        Gift upon becoming 10 years old. In the case of Light, he was 1 of the lucky
        Humans who received the Gift of Infinite Gacha. This Gift allows Light to
        produce cards infinitely 24 hours a day, whereby pressing the button that
        appears whenever Light activates his Gift, he gets the cards and produce whatever
        is on the card into reality, ranging from items to normal civilians to even
        expert fighters with absurdly high levels of power. Infinite Gacha works by
        absorbing mana from the air in the same manner as mages who uses the mana
        in the air to use magic. The quality of the cards produced by Infinite Gacha
        varies depending on the thickness of mana surrounding Light. The more the
        mana is thick in the air, the higher the quality of the card. Ranking from
        the highest, the qualities of the are as follows: EX (Extreme), SUR (Super
        Ultra Rare), UR (Ultra Rare), SSSR (Super Super Super Rare), SSR (Super Super
        Rare), SR (Super Rare), R (Rare), N (Normal), and E (Error). This ability
        is what enabled Light to reach level 9999 within 3 years, allowing him to
        break his own limitations, where the average level of power that normal Humans
