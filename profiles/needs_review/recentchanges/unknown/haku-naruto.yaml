- id: claim-weaknesses-ae2d9ba3
  section: weaknesses
  axis: weakness
  text: "Notably too kind, and suppresses himself and often refuses to kill, opting\
    \ to knock out his opponent if possible, but isn't adverse to killing if needed.\
    \ {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"\
    1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align:\
    \ left; |Notable Attacks/Techniques: |- | : The advanced chakra nature, Kekkei\
    \ Genkai of the Yuki clan which allows the users to combine wind and water-based\
    \ chakra to create ice which they can manipulate through willpower alone. The\
    \ ice Haku created was resistant to fire-based attacks, only melting slightly\
    \ when coming into contact with Sasuke's flames. Having nearby water is an advantage,\
    \ as the user can simply freeze that water to create ice. *: Haku grabs his opponent's\
    \ arm then quickly performs several hand seals with his other hand. Countless\
    \ needles appear in response, created from the surrounding moisture. Haku jumps\
    \ back right before the needles would impact, effectively surviving the volley\
    \ without a single scratch. *: A technique in which several large ice spikes emerge\
    \ from below to impale anything in their vicinity. The rate at which this occurs\
    \ is so sudden that it's considered to be a certain kill. When used inside an\
    \ enclosed area like a cottage, it leaves very little room for escape. *: Haku\
    \ surrounds his opponent in a dome of dozens of ice mirrors. His image is reflected\
    \ in each mirror, making it hard to judge Haku\u2019s real location. Also, Haku\
    \ can quickly travel between these mirrors, moving so fast that it seems like\
    \ he was attacking from all directions. Haku can also use a variation of this\
    \ technique to quickly pass dozens of meters in ways similar to teleportation.\
    \ *: Haku raises a half-spherical dome of ice to fend off incoming attacks and\
    \ protect both himself and everyone in his vicinity. This technique was strong\
    \ enough to withstand multiple exploding tags. *: This technique is simply a very\
    \ quiet method of killing an opponent, usually from behind with a blade. Additionally,\
    \ because the user moves silently, it cannot be defended against, because the\
    \ attack cannot be anticipated. The user will often slit their opponent's throat,\
    \ preventing any cry that might give them away. |} Note: *Haku only travels at\
    \ lightspeed when he is reflecting through his ice mirrors. However, this does\
    \ not scale to anybody; it is established numerous times that it is impossible\
    \ to keep up with Haku when he moves through the mirrors. *Do not attempt to downgrade\
    \ Haku or upgrade Naruto and Sasuke based on their fights in the Land of Waves\
