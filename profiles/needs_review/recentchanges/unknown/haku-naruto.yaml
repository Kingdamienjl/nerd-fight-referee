    - field: weaknesses
      value: "Notably too kind, and suppresses himself and often refuses to kill,\
        \ opting to knock out his opponent if possible, but isn't adverse to killing\
        \ if need be. Notable Attacks/Techniques: Hy\u014Dton (Ice Release): The advanced\
        \ chakra nature, Kekkei Genkai of the Yuki clan which allows the users to\
        \ combine wind and water-based chakra to create ice which they can manipulate\
        \ through willpower alone. The ice Haku created was resistant to fire-based\
        \ attacks, only melting slightly when coming into contact with Sasuke's flames.\
        \ Having nearby water is an advantage, as the user can simply freeze that\
        \ water to create ice. *Thousand Flying Water Needles of Death: Haku grabs\
        \ his opponent\u2019s arm then quickly performs several hand seals with his\
        \ other hand. Countless needles appear in response, created from the surrounding\
        \ moisture. Haku jumps back right before the needles would impact, effectively\
        \ surviving the volley without a single scratch. *Demonic Ice Crystal Mirrors:\
        \ Haku surrounds his opponent in a dome of dozens of ice mirrors. His image\
        \ is reflected in each mirror, making it hard to judge Haku\u2019s real location.\
        \ Also, Haku can quickly travel between these mirrors, moving so fast that\
        \ it seems like he was attacking from all directions. Haku can also use a\
        \ variation of this technique to quickly pass dozens of meters in ways similar\
        \ to teleportation. *Ice Release: Ice Rock Dome of Magnificent Nothingness:\
        \ Haku raises a half-spherical dome of ice to fend off incoming attacks and\
        \ protect both himself and everyone in his vicinity. This technique was strong\
        \ enough to withstand multiple exploding tags. Note: As Haku is a member of\
        \ the Yuki Clan, his proper name should be Yuki Haku. Haku only travels at\
        \ lightspeed when he is reflecting through his ice mirrors. However, this\
        \ does not scale to anybody; it is established numerous times that it is impossible\
        \ to keep up with Haku when he moves through the mirrors. Category:Tier 7\
        \ Category:Slappyjoe056"
      source_id: character-stats-profiles-haku-naruto-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
