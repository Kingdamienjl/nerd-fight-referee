    - field: weaknesses
      value: 'None notable | With the right timing, can be injured while he is forming
        back to his human form Notable Attacks/Techniques: *Jimmy: The Jimmy Mysticker
        is one that has the ability to create an electric guitar. The guitar is able
        to manipulate the sound waves created by using it to create many sonic attacks.
        To activate it the user slides their finger down the strings on the mysticker.
        Since it is an electric guitar, it is able to absorb electricity and then
        use that to increase the power of its attack. The sound released can also
        be used to sense the surroundings using a form of echolocation to determine
        where sound is bouncing off of. It also has a steel wire, with a steel point,
        at the end of it which allows the user to swing it around or at a target (usually
        while slasher slaughter is activated). During his final fight against Daichi,
        can was able to fire sound blast from his mouth **Howling Noise: Jeff Explosion:
        By manipulating the sound waves the user is able to release them forward as
        a shock wave. The power can be varied from just a high level of ear damaging
        sound to a blast that is able to level the target and can render the target
        unconscious. By using Max Volume he releases his strongest blast **Chainsaw
        Noise: Slash Slaughter: By using the sound waves it is capable of transmitting
        the vibrations to the blade attached to the guitar. These vibrations increase
        the cutting power of the blade. They are also capable of shaking off any bindings
        attached to the blade. This can also be used as a ranged attack where after
        activating the attack the user throws the guitar and controls it with the
        attached wire. Kaine can also spin his guitar fast in a circle, allowing him
        to do great damage, he even cut 4-5 big trees in one move. **Jeff Blast: Another
        destructive big sound blast. Jeff Blast+ is a stronger variation of this technique
        **Jeff Blast: Fast Beat (Hayabiki Jeff Blast): Kaine plays chords quickly
        to deliver a very powerful, close range attack in his Blazer Drive state.
        *Edie Concentration Puppet Dance: He is also able to control other people
        with a special song on his guitar granted the person has already heard the
        melody once. This special melody can still control a person even if they shut
        their ears since it is already in their brain. Works on both conscious and
        unconscious people. He can control multiple people to use as an army *Manson
        Head: A tune that activates Kaine''s Blazer Drive state *Les Paul: By placing
        a strange mysticker on Jimmy, Kaine jumps high into the air and launches two
        horned beast from his guitar in order to attack the opponent below Blazer
        Drive: A state most blazers have access to. While only lasting a short amount
        of time, a blazers can activate a special state called Blazer Drive in which
        the users skin turns dark while also gaining increased speed, power, and an
        inability to feel pain. * Portal Creation: Due to his biology, Kaine can create
        portals that allow him to travel great distances and attack the target from
        different directions Multiple Qilin Mysticker'
      source_id: character-stats-profiles-kaine-parker-unknown
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
