        Since it is an electric guitar, it is able to absorb electricity and then
        use that to increase the power of its attack. The sound released can also
        be used to sense the surroundings using a form of echolocation to determine
        where sound is bouncing off of. It also has a steel wire, with a steel point,
        at the end of it which allows the user to swing it around or at a target (usually
        while slasher slaughter is activated). During his final fight against Daichi,
        can was able to fire sound blast from his mouth **Howling Noise: Jeff Explosion:
        By manipulating the sound waves the user is able to release them forward as
        a shock wave. The power can be varied from just a high level of ear damaging
        sound to a blast that is able to level the target and can render the target
        unconscious. By using Max Volume he releases his strongest blast **Chainsaw
        Noise: Slash Slaughter: By using the sound waves it is capable of transmitting
        the vibrations to the blade attached to the guitar. These vibrations increase
        the cutting power of the blade. They are also capable of shaking off any bindings
        attached to the blade. This can also be used as a ranged attack where after
        activating the attack the user throws the guitar and controls it with the
        attached wire. Kaine can also spin his guitar fast in a circle, allowing him
