  text: 'Often refuses to do anything except mindlessly hammer the enemy. Refuses
    to follow orders. These weaknesses were mitigated after Chapter 1. Can''t use
    Red or Dual Buster by herself. {| class="mw-collapsible mw-collapsed" align="center"
    border="1" cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left; " |Notable Attacks/Techniques: |- | [https://deltarune.wiki/w/Encounter#DEFEND
    DEFEND]: Susie crosses her arms defending her body to block attacks and [https://youtu.be/0Y3-XHB-6K0&t=1704
    reduce incoming damage]. Using it also gathers 16% TP for Susie''s SPELLs. [https://deltarune.wiki/w/Encounter#MAGIC
    SPELLs]: Before casting a spell, she holds her ax straight with a pink flame on
    top and smiles. Then, she raises her ax in the air and it flickers white. *Chapter
    1: **Magic Axes: Susie [https://youtu.be/TmyNeAC0wow&t=6065 creates] and [https://youtu.be/zutvmcSOWko&t=4807
    throws] a lot of axes at the opponent. **Rude Buster: Susie fires off a large
    wave of "Rude Energy" at her opponent, dealing more damage than her normal melee
    attacks. Capable of launching it [https://youtu.be/zhEBOFo3GFg&t=13677 3 times]
    without collecting TP first. **Morale Boost: Susie [https://deltarune.wiki/w/K._Round#:~:text=Warning%20K.%20Round%20three%20times%20increases%20Susie%27s%20Attack%20by%2050%25
    can massively increase her ATK] just by [https://youtu.be/4oDgerCHEeQ&t=37 boosting
    her morale]. **Hypnosis: Susie spins something around to lull an opponent to sleep
    and reduce their attack power. **Red Buster: An upgraded Rude Buster. Only available
    after Kris shines their SOUL''s power onto Susie. *Chapter 2: **Roar: Susie makes
    a [https://youtu.be/4ADeYLkC3Mc&t=3659 loud roar] that tires one or more enemies
    upon hearing it. **S-Action: Susie can [https://deltarune.wiki/w/Susie#S-Action
    form a strategy] and [https://imgur.com/a/QF3dTbM resolve a conflict] in a peaceful
    way like Kris''s [https://deltarune.wiki/w/Encounter#ACT ACT]s. **UltimateHeal/UltraHeal/BetterHeal:
    Susie projects a magic attack that [https://youtu.be/4ADeYLkC3Mc&t=6903 slightly
    heals] her allies in Chapters 2 and 3, [https://youtu.be/zhEBOFo3GFg&t=14200 greatly
    healing] her allies in Chapter 4. **TrapOne: Susie can [https://youtu.be/q6WfnAcdlFs&t=5825
    summon] a red cage to trap enemies, the latter can have [https://youtu.be/lIgyoTsgwIc&t=38
    different] [https://youtu.be/LSzIOVrPIe4&t=75 sizes] when summoned depending on
    the size of the target. **Supercharge: Susie can boost Kris''s Yellow Mode to
    shoot faster and even stronger energy attacks. *Chapter 3: **Sharpshoot: Susie
    can [https://youtu.be/VR_8F5rpFlI&t=1621 throw hearts] from her fingers at enemies
    which can do [https://youtu.be/VR_8F5rpFlI&t=10412 some] [https://youtu.be/VR_8F5rpFlI&t=17005
    damage]. *Chapter 4: **Embezzle: Susie can [https://youtu.be/jy9e4V_Zfhg&t=14260
    steal] [https://youtu.be/jy9e4V_Zfhg&t=14285 items] and [https://deltarune.wiki/w/Mizzle#Strategy
    other stuff] while inflicting the [https://deltarune.wiki/w/Encounter#Tired TIRED
    effect] to her enemies. **TreasureHunt: Susie [https://youtu.be/zhEBOFo3GFg&t=7570
    can enhance her sense of smell] to find stuff in the dark. **Climbing: Susie can
    climb walls that look climbable with the [https://imgur.com/a/Cc68wlW ClaimbClaws].
    **Charge Jump: When [https://youtu.be/eA-RBpfcGgQ&t=10952 climbing], Susie can
    [https://youtu.be/eA-RBpfcGgQ&t=6361 charge a jump] and [https://youtu.be/eA-RBpfcGgQ&t=7023
    increase her climbing speed] for a few seconds. **Shield Ax: Susie can [https://youtu.be/9QA7rK0owxY&t=120
    block] projectiles/bullets with her axe. By doing so, she also gains some TP.
    Can take much more damage than Susie herself can, as evidenced by it not breaking
    from blocking numerous Gerson projectiles. **Reflect Ax: Susie can [https://youtu.be/4pG-raMF9P4&t=131
    reflect attacks] with her axe. **Whirl: Susie [https://imgur.com/a/nAuEk8U spins
    around] with her party to create a [https://youtu.be/jy9e4V_Zfhg&t=25640 tornado]
    and peacefully remove enemies from a battle. **Brighten: Susie and Ralsei can
    [https://youtu.be/zhEBOFo3GFg&t=14019 greatly increase] the radius of Kris''s
    SOUL light. **Dual Heal: Kris shines the light of their SOUL onto Susie and Ralsei,
    [https://youtu.be/zhEBOFo3GFg&t=14962 powering up the healing spell] that the
    two are doing together, allowing them to heal the entire team at once although
    the spell''s efficiency decreases with each use. **Wake Up: Susie hits her ally
    [https://youtu.be/zhEBOFo3GFg&t=14719 removing] the [https://deltarune.wiki/w/Titan_(Chapter_4)#Strategy
    Down state]. **DualBuster: Kris shines the light of their SOUL onto Susie and
    Gerson, [https://youtu.be/zhEBOFo3GFg&t=15381 powering up their DualBuster] and
    launching a very powerful double attack. *Chapter 5: **Scythemare: Inflicts all
    enemies with bad dreams. [https://youtu.be/FqwLmN1hpXQ&t=12 All TIRED enemies
    will be SPAREd]. **LayUp: Susie can [https://youtu.be/qBOqF9F-MNY&t=3178 create
    a hoop to catch bullets]. **Value/SalonC'
