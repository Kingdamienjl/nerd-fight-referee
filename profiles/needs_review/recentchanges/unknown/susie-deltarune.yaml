    - field: intelligence
      value: 'At most Above Average (Despite not having conventional knowledge in
        school subjects, she has proven to be efficient in other areas. [https://youtu.be/GsNXVVHIObs&t=12306
        She managed to decipher the solution to a puzzle] before Berdly, who is the
        second smartest student in the class. [https://youtu.be/GsNXVVHIObs&t=10819
        She managed to learn a new healing spell] in a short time [https://youtu.be/GsNXVVHIObs&t=6984
        thanks to Ralsei], [https://youtu.be/jy9e4V_Zfhg&t=16384 a spell that she
        began to train on her own], progressing from [https://deltarune.wiki/w/Susie%27s_healing#Mechanics
        UltraHeal] in Chapter 3, to [https://deltarune.wiki/w/Susie%27s_healing#Mechanics
        BetterHeal] in Chapter 4, [https://youtu.be/zhEBOFo3GFg&t=14200 managing to
        fully master it] in two days and [https://youtu.be/zhEBOFo3GFg&t=14962 use
        it together with Ralsei]. In some cases, she comes up with ideas to defeat
        enemies before Kris and Ralsei, figuring out how to [https://youtu.be/zfRhmSfs_ok&t=9468
        defeat K. Round faster], thinking of an [https://youtu.be/GsNXVVHIObs&t=5661
        alternative way to win against Sweet Cap''n Cakes], and [https://youtu.be/jy9e4V_Zfhg&t=27909
        coming up with the idea to enter the Titan and have Kris seal it away]) *Combat
        Skill: In combat she is capable of avoiding projectiles from multiple opponents
        at once, and even dodge bullet hell attacks from enemies as formidable as
        Jevil, Spamton NEO, The Roaring Knight and the Titan. Tenna comments on Susie''s
        ability to [https://deltarune.wiki/w/Pippins#:~:text=%5BTenna%5D%20Wow!!%20Our%20heroes%20are%20grazing,TV!!!%20%5BNeutral%2C%20if%20grazing%20is%20performed%5D
        dodge and not take damage]. During the battle with The Roaring Knight, [https://youtu.be/KOu-Zaw-uhc&t=259
        Kris fakes a cough to signal that neither they nor their allies] were [https://deltarune.wiki/w/Knight#Quotes:~:text=Kris%20coughed.%20The%20enemy%20slowly%20tilted%20its%20head...%20%5BAfter%20using%20its%20final%20attack%2C%20if%20no%20hits%20were%20taken%20up%20to%20Charge%2Dup%20and%20no%20one%20is%20DOWNed/SWOONed%20by%20the%20final%20attack%5D
        harmed], She is capable of defeating Gerson [https://youtu.be/oL3i6DuJ4aw&t=561
        on her first try]. Her axe attacks always land on her targets, [https://youtu.be/QU2B3q6iLmA&t=285
        regardless of their agility]. [https://youtu.be/zfRhmSfs_ok&t=1956 She learned
        how to fight] shortly after they entered the Dark World, [https://youtu.be/zfRhmSfs_ok&t=2757
        defeating a group] of Jigsawry with ease. Can formulate strategies to defeat
        all kinds of enemies peacefully and violently, [https://youtu.be/zfRhmSfs_ok&t=9468
        having unconventional ideas to defeat K. Round], [https://youtu.be/GsNXVVHIObs&t=5661
        Sweet Cap''n Cakes] and [https://youtu.be/jy9e4V_Zfhg&t=27909 the Titan].
        [https://youtu.be/oL3i6DuJ4aw&t=522 She can swing her axe] with enough dexterity
        and precision to shave the Old Man without hurting him. Could defeat the Roaring
        Knight without getting a single hit, with it using as [https://www.youtube.com/watch?v=KOu-Zaw-uhc&t=158s
        attacks] [https://www.youtube.com/watch?v=KOu-Zaw-uhc&t=113s multiple] [https://www.youtube.com/watch?v=KOu-Zaw-uhc&t=193s
        complex] [https://www.youtube.com/watch?v=KOu-Zaw-uhc&t=234s patterns], as
        noted from Kris [https://www.youtube.com/watch?v=0YLonMJP1Rw&t=220s coughing
        if they do so] unlike [https://www.youtube.com/watch?v=x7A00ahhpqc&t=418s
        in other cases], even [https://www.youtube.com/watch?v=AHPvFaRhvVY&t=619s
        managing to do so without] the [https://deltarune.wiki/w/Shadow_Mantle Shadow
        Mantle], an item that greatly reduces damage dealt from the Knight and that
        is stated as something mandatory to defeat it from [https://www.youtube.com/watch?v=AHPvFaRhvVY&t=619s
        multiple] [https://www.youtube.com/watch?v=wNdW8renScU&t=40s characters] despite
        the fact that the Delta Warriors have defeated prior Jevil and Spamton NEO,
        who both also use patterns that are far harder than the rest of the bosses
        of their respective chapters. Can clear the entire game through all the Chapters
        without getting [https://psnprofiles.com/trophies/34339-deltarune any of the
        achievements] as [https://www.youtube.com/watch?v=hb3Rt0NA8Yw&t=24048s even
        acknowledged from the game], something that has been described by Toby Fox
        as a "[https://imgur.com/a/EwbAs2n hard-core challenge]" and that requires
        to fulfill all the following requirements: not use any [https://deltarune.wiki/w/Item#Weapons
        weapon], [https://deltarune.wiki/w/Item#Armor armor] or [https://deltarune.wiki/w/Item#Consumables
        consumable item], not get the [https://www.youtube.com/watch?v=UHlibLosz2I&list=PLXWRQOreh99vxn5LmFQOhMPc3S8VJm2Pf&t=5884s
