    text: "}} |-|Explanations= {{#tag:tabber| -Pages= Goku-Ki-Kamehameha.png|Ki Manipulation|link=Ki\
      \ Manipulation (Dragon Ball) DB Quilted multiverse owo.png|Dragon Ball Cosmology|link=Dragon\
      \ Ball Cosmology -Blogs=}} |-|Notes={{Border|Scroll=Yes|Visible=No|Content=#Note\
      \ 1: According to the Daizenshuu, Super Exciting Guide and Dragon Ball Z: Kakarot\
      \ encyclopedia, Super Saiyan is officially a [https://imgur.com/a/super-saiyan-is-50x-multiplier-kuM7iGA\
      \ 50x multiplier]. However, more than that, Super Saiyan is consistent with\
      \ the showings in the manga as a 50x speed multiplier specifically. Goku using\
      \ Kaioken x10 was being casually stomped by 50% Frieza, and even Kaioken x20\
      \ while using a Kamehameha was at best equal to 50% Frieza, yet using Super\
      \ Saiyan allowed Goku to easily stomp 50% Frieza, and overpower 100% Frieza.\
      \ Therefore, it is highly consistent with the 50x multiplier assigned to it.\
      \ Similarly, Super Saiyan 2 and Super Saiyan 3 are [https://imgur.com/a/C8uBjX8\
      \ 100x and 400x], respectively, as stated in the Super Exciting Guide, and more\
      \ recently in Dragon Ball Z: Kakarot encyclopedia. Oozaru is officially a [https://imgur.com/a/D7aaOw6\
      \ 10x multiplier] as stated directly in the source material and the Dragon Ball\
      \ Super Exciting Guide as well. #Note 2: It has been stated numerous times across\
      \ various sources in the series that a larger ki means greater statistics \u2013\
      \ statistics such as [https://imgur.com/tNJjg2h strength] and [https://imgur.com/ZBCGREl\
      \ overall power], [https://imgur.com/NdBBzNO speed], [https://imgur.com/jgtiEmQ\
      \ aerial capabilities], [https://imgur.com/Xf6sKDx destructive capacity], [https://imgur.com/a/KYhrxRq\
      \ Goku also says to Toppo that SSG is his fourth transformation], and seeing\
      \ how Super Saiyan 4 would be likely inferior he would have no reason to lie\
      \ here. * Shin and Kibito remain fused at the start of Super, even though they\
      \ unfused in Dragon Ball Daima which takes place before Super in the timeline.\
      \ We are given no reason as to why this is the case, so it should be counted\
      \ as a contradiction. [https://imgur.com/a/qg0fBPG And later when they unfused\
      \ Goku is confused on how they were able to do it, even though an answer was\
      \ already given with] Majin Buu in Daima, which predates Super. The fact that\
      \ they went through the trouble of collecting the Namekian Dragon Balls instead\
      \ of going to Majin Buu again is already weird to say the least. * Vegeta doesn't\
      \ use Super Saiyan 3/Ultra Vegeta 1 against Beerus whatsoever even after breaking\
      \ loose. The overall consensus is that Dragon Ball Daima has very dubious canon\
      \ in relation to Super, and is thus treated as an alternate continuation of\
      \ the original manga, rather than being part of the current overarching story.\
      \ Furthermore, Dragon Ball Z: Kakarot is recognized as supplementary material\
      \ to the original canon, as discussed in this thread. It's important to note\
      \ that the gameplay and cutscenes of the game are not considered canonical to\
      \ the original work due to contradictions and material from the TV anime that\
      \ may not be faithful to the original manga. Therefore, only supplementary materials\
      \ such as the game's encyclopedia would be considered valid for use. DLCs are\
      \ not to be considered canon unless stated otherwise. |} {| class=\"mw-collapsible\
      \ mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"\
      1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align: left; |Anime Canon\
      \ |- | DBS Anime is also considered to continue from the events of DBZ Kai for\
      \ the reasons that\u2019ll be expounded upon below: * The DBS anime uses [https://m.youtube.com/watch?v=6oJMQe-FoVY\
      \ scenes] [https://youtu.be/aDTgZDvTFKE from the DBZ Kai] [https://youtu.be/xSyzxDdzOGc\
      \ anime] [https://youtu.be/ToktTPdGux8?si=qP_BUBjL8qeX6-T6 as character flashbacks]\
      \ to represent events that took place in the previous arcs. These flashbacks\
      \ also seem to show events that are anime-only, for example, during Trunks's\
      \ flashback we see the Semi-Perfect Cell versus SS2 Gohan fight which is an\
      \ anime-only battle and never took place in the manga, meaning the DBS anime\
      \ follows the events of DBZ Kai anime rather than the Dragon Ball manga. * The\
      \ presence of anime-only characters like [https://youtu.be/cifhvsSngqw?si=EbDDhiJ7K3VgjWhw\
      \ Gregory] and [https://imgur.com/a/CtyTmLJ Mr. Satan's underlings] in the DBS\
      \ anime who are absent from the Dragon Ball manga, even during important events\
      \ such as during Cell's self-destruction on King Kai's planet, Gregory was nowhere\
      \ to be found in the scene, indicating his absence in the manga's story, not\
      \ to mention the official Dragon Ball website also calls him a \"[https://dragon-ball-official.com/news/01_2736.html\
      \ TV-series only character]\" which is another proof of why the DBS anime should\
      \ be canon to DBZ Kai. * Bulma [https://imgur.com/a/k1F7FP2 indicating] that\
      \ the entire side story of Ginyu switching bodies with her happened in the past\
      \ which is an anime-only story and isn't present in the manga, meaning that\
      \ the DBS anime seems to follow events from DB"
