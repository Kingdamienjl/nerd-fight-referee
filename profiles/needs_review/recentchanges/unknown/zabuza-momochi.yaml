    - field: weaknesses
      value: 'Requires large amounts of water for certain techniques. {| class="mw-collapsible
        mw-collapsed" align="center" border="1" cellpadding="1" cellspacing="1" style="width:100%"
        | colspan="2" style="text-align: left; |Notable Attacks/Techniques: |- | :
        A massive single-edged broadsword. While this sword appears ordinary at first
        glace, if damaged it can absorb iron from the blood drawn by mowing down various
        enemies, allowing the sword to slowly regenerate by reforming itself. : One
        of the basic elemental nature transformation techniques that allows the user
        to manipulate pre-existing water, or create their own, by turning their Chakra
        into water. It takes much greater skill to create the water than to manipulate
        what is already available and expel it via mouth. One of the most versatile
        of the five basic Chakra natures, Water Style jutsu can not only change shape
        but state as well. *: A specialty of the ninja from Kirigakure, where one
        causes a mist to spring forth by lifting up some water from either a pre-existing
        source or expelled from their mouth, then goes in and out of sight at will
        from within the pearly-white realm. The mist''s thickness is controlled by
        the amount of chakra kneaded into it. *: The Water Clone Jutsu is similar
        to the Shadow Clone Jutsu except it creates clones out of water that have
        one-tenth of the original person''s power. If the water clones are injured
        enough they will revert back to normal water. *: This jutsu is used to trap
        a victim inside a virtually inescapable sphere of water. The only downside
        to this technique is that the user must keep at least one arm inside the sphere
        at all times in order for the victim to remain imprisoned. This technique
        requires a sufficient amount of water, which can be provided by expelling
        it from one''s mouth. Once trapped the target is unable to move or breathe
        while within it due to the heaviness of the water. Because of the density
        of the water it can be used, to a limited extent, for defensive purposes if
        performed on oneself. It can also be stored in scrolls as traps. *: This technique
        shapes a large amount of water into a giant, powerful dragon, which hits the
        opponent with formidable might, dealing physical damage. The ideal place to
