    (Types 1, 2, 3, 4, 7 & 8; Edo Tensei are corpses possessed by a soul brought back
    from the Pure Land. They are incapable of feeling pain along with being able to
    survive grievous injuries such as [https://imgur.com/a/0npLmKL bisection and]
