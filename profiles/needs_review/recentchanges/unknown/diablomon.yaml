- id: claim-weaknesses-a2321455
  section: weaknesses
  axis: weakness
  text: 'Insane. The more Diaboromon absorbs, the more arrogant and overconfident
    he gets. Notable Attacks/Techniques *Nail Scratch: Slashes with the claws on its
    tentacles. *Duplication: Tsumemon can make countless clones of itself to aid it
    in battle. *Destruction Cannon: Blasts the opponent with dark energy. *Blood Eye:
    Confuses the enemy with its eye. *Death Cannon: Burns a large area with blast
    of Darkness. *Crazy Giggle: Fires a shot of pre-eminent light with destructive
    power from its mouth while laughing. *Fool Out: Emits an unbearable discord. *Crazy
    Smoke: Blows out poisonous smoke. *Crazy Turn: Attacks by extending its arms and
    spinning around. *Destroyer: A passive ability that give all his attacks a 10%
    chance of instantly killing the opponent. *Crazy Turn: Attacks by extending its
    arms and spinning around. *Crazy Smoke: Blows out poisonous smoke. *Duplication:
    Keramon can make countless clones of itself to aid it in battle. These clones
    have weaker powers. *Dark Crusher: Uses an arrow of Darkness to destroy any data
    it touches. *Guard Break: Lowers the opponent''s durability by 15%. *Dark Claw:
    Attacks the opponent with claws of darkness. Those hit can be poisoned by the
    skill. *Crazy Giggle: Fires a shot of exceptionally powerful bullet of light from
    its mouth which has more than tripled in power from before. *Data Crusher: Destroys
    the opponent''s configuration data with the tentacles extending from its back.
    This can mean destroying the mind, body and soul of the opponent individually
    or flat out erasing their existence by destroying them all at once. *Misconnecting:
    Flies up in the air and squashes the enemy with its huge body. *Cursed Slash:
    Slashes with cursing power that can also put the foe to sleep. *Nanomachine Break:
    Blasts the foe with a bolt of electricity. *Dark Counter: Uses the Power of Darkness
    to grant itself and allies the ability to instantly counter any attack. *Mental
    Essence: Uses the Power of Darkness to restore the MP of itself or an ally. *Demi
    Darts: Throws syringes filled with viruses at the enemy. This attack also drains
    life force to heal Chrysalimon. *Akuma no Sasayaki (Evil Whisper): Emits hypnotic
    waves from its eyes. *Attack Break: Lowers the opponent''s Attack Potency by 10%.
    Can stack. *Panic Wisp: A fire magic attack that confuses the opponent. *''Paralyze
    Breath: Breathes a paralyzing poison gas at the enemy, or paralyzes them with
    electricity. *Soul Absorption: Disassembles and absorbs the enemy''s data. *Erase
    Sickle: Attacks with its tentacles, erasing the enemies configuration data. *Bonfire/Lava
    Loogie: Fires a small flame. *Melt Wax/Paraffin Paralyzer: Flaps melted wax from
    its body onto the foe. *Karma Flamer/Karmic Flame: Spins around while creating
    a tornado of flame that repels attacks. *Tai Atari/Body'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
