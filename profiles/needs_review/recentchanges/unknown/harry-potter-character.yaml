    notes: auto_repair source extraction
  attack_potency:
    text: Street level physically, at least Small Building level (Hogwarts students
      learned the Freezing Spell in their third year. Collapsed a ceiling with Voldemort),
      likely Building level with magic (Comparable to Hermione Granger, Luna Lovegood,
      and Ginny Weasley; they matched Bellatrix Lestrange as a group), higher with
      the Sword of Gryffindor (Killed The Basilisk), can ignore conventional durability
      in several ways
    source_ids:
    - vsbattles-harry-potter-character-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "Athletic Human with Subsonic reaction speed (Capable of maneuvering with\
      \ his broomstick in the seeker position of Quidditch, which requires to dodge\
      \ the Bludgers while trying to catch the Snitch, which move as fast as broomsticks\
      \ like a Firebolt. Dodged multiple curses by Voldemort and Death Eaters), Speed\
      \ of Light attack speed via Lumos Solem (Lumos Solem is a charm that creates\
      \ a blinding flash of sunlight used to defend against the Devil's Snare. Harry\
      \ should know this spell, as it\u2019s implied to be taught in basic herbology\
      \ to defend against the Devil's Snare and advanced charms class, and first years\
      \ like Hermione have showcased this spell)"
    source_ids:
    - vsbattles-harry-potter-character-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Athletic Human physically (Should be comparable to Oliver Wood. Supported
      Ginny Weasley and himself), Class 5 with magic (Comparable to Ron Weasley. Levitated
      a motorcycle side-car)
    source_ids: &id002
    - mediawiki-8321
    confidence: 0.95
  striking_strength:
