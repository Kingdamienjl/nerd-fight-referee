        the name of the summoned object., Aguamenti (Water-Making Spell): Produces
        a fountain or jet of water from the wand tip., all other arachnids., Ascendio:
        Lifts the caster., Confringo: Causes anything it touches to explode and presumably
        combust., Crucio (Cruciatus Curse): Inflicts intense pain on the target, the
        pain is comparable to driving hot knives into the victim. It cannot be cast
        successfully by a person doing so out of pure spite or anger, one must want
        to cause the victim pain., Defodio: This spell allows the caster to gouge
        out large chunks of the target., Depulso (Banishing Charm): This spell makes
        the target fly toward a specific location, it is the opposite of the summoning
        charm., Diffindo (Severing Charm): Rips, or more generally physically damages
        the target., Entomorphis: Transforms the target into an insectoid for a short
        time., Episkey: Used to heal relatively minor injuries, such as broken bones
        and cartilage., Erecto: Used to erect a tent or other structure., Expecto
        Patronum (Patronus Charm):thumb, Harry summoning Patronus This charm is a
        defensive spell which will conjure a spirit-like incarnation of their positive
        emotions to defend against dark creatures, it can also send messages to other
        witches or wizards. It seems one''s Patronus will take the form of something
        important to the caster, and can change when one has undergone a period of
        heightened emotion., Expelliarmus (Disarming Charm): Causes whatever the victim
        is holding to fly away, knocks out an opponent if used too forcefully., Feather-light
        charm: Makes something lightweight., Furnunculus (Pimple Jinx): Covers the
        target in boils (or pimples)., Imperio (Imperius Curse): Places the subject
        in a dream-like state, in which he or she is utterly subject to the will of
        the caster. However, those who are strong-willed may learn to resist it.,
        Inflatus (Inflatus Jinx): Inflates objects (living or dead)., Langlock: Glues
        the subject''s tongue to the roof of their mouth., Levicorpus: The victim
        is dangled upside-down by their ankles, sometimes accompanied by a flash of
