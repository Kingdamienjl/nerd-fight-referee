    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (Is an incredibly skilled wizard, only surpassed in his magical intellect
      by a few, such as Hermione, who credited him as a great wizard in only his first
      year. He planned many things in the war with Voldemort and successfully destroyed
      one of his Horcruxes before Voldemort noticed. As a testament to his incredibly
      high levels of skill, he's a prodigy in learning complex spells, learning to
      produce a corporeal Patronus at the end of his third year when much older Wizards
      found it hard to conjure a mist Patronus. He also taught a large group of Hogwarts
      students many spells, including the latter mentioned Patronus charm. He was
      responsible for Voldemort's downfall despite Voldemort dwarfing him in magical
      strength and skill)
    source_ids:
    - vsbattles-harry-potter-character-unknown
    confidence: 0.6
    notes: auto_repair source extraction
