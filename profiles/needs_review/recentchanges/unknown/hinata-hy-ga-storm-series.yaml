- id: claim-weaknesses-c70bdc74
  section: weaknesses
  axis: weakness
  text: "Her fighting style is primarily limited to taijutsu, and there is a small\
    \ blind spot near the back of her neck, which her vision cannot cover. Notable\
    \ Attacks/Techniques: Byakugan (White Eye): This eye technique is the kekkei genkai\
    \ of the Hy\u016Bga clan and one of the Three Great D\u014Djutsu. Wielders of\
    \ this eye can see long distances (at least up to 10 kilometers) and can see objects\
    \ that are too small for the normal eye to detect (such as the tenketsu points\
    \ on a human's body). The Byakugan has an almost perfect 360-degree field of vision,\
    \ though there is a small blind spot located near the back of the user's neck.\
    \ The eye can also see through objects as well as many barriers and can see chakra.\
    \ Juuken (Gentle Fist): By taking advantage of the Byakugan, the user can see\
    \ a person's chakra pathway system. Juuken inflicts internal damage through attacking\
    \ the body's Chakra Pathway System by injecting chakra into specific pressure\
    \ points (tenketsu), subsequently injuring internal organs that are closely intertwined\
    \ with the pathways. Once these tenketsu points are struck, they are, in turn,\
    \ sealed and can no longer produce chakra for a certain amount of time, severely\
    \ limiting the victim's chakra flow. *Hakke Kuushou (Eight Trigrams Empty Palm):\
    \ After using their Byakugan to locate a target's vitals, the user will attack\
    \ with a forceful palm thrust which releases a small wave of chakra. The attack\
    \ is powerful enough to blow a person off of their feet and has a range of several\
    \ meters. *Hakke Kuhekisho (Eight Trigrams Empty Wall Palm): A combination attack\
    \ involving two Juuken users who simultaneously strike a target with their Hakke\
    \ Kuushou (Eight Trigrams Empty Palm) technique. Hinata uses this jutsu in combination\
    \ with Neji. *Juho Soshiken (Gentle Step Twin Lion Fists): Hinata forms two sizeable\
    \ lion-shaped chakra shrouds around her hands, then uses them to strike an opponent.\
    \ The move dramatically increases her attacks' range and destructive power. The\
    \ lion heads also drain the chakra network of those they touch. It is a challenging\
    \ ability to learn, as the slightest mistake in chakra control will lead to failure,\
    \ meaning it is a feat requiring the Byakugan. This technique can be used in conjunction\
    \ with the Eight-Trigrams Sixty-Four Palms. It can also fire a projectile of blue\
    \ chakra at her opponent. **Eight Trigrams Twin Lions Crumbling"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-30d6827b
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Chakra Manipulation, Statistics Amplification\
    \ (Shinobi are capable of enhancing their physical capabilities with the use of\
    \ chakra]]. The Shunshin no Jutsu allows Shinobi to greatly enhance their speed\
    \ by focusing chakra in their feet), Surface Scaling and Water Walking (By focusing\
    \ chakra at the soles of their feet, Shinobi can scale and cling to vertical surfaces,\
    \ and even walk on water), Taijutsu Expert (Hinata is hailed as the \"master of\
    \ Gentle Fist\"), Acrobatics, X-ray Vision, Extrasensory Perception (Capable of\
    \ sensing even the slightest hint of chakra without activating her Byakugan. Could\
    \ sense and recognize Naruto's familiar chakra ), Afterimage Creation, Stealth\
    \ Mastery, and Speed Enhancement (The Substitution Jutsu allows its user to instantly\
    \ replace themselves with a nearby object such as a tree log, plant, person, or\
    \ clone at the exact moment they are attacked. The Jutsu works even if the user\
    \ is physically restrained or observed by characters as observant as Sharingan\
    \ or Sage Mode users. This creates the optical illusion of the user being hit,\
    \ which confuses the opponent and gives them an opening to flee or counterattack),\
    \ Minor Illusion Creation and Duplication (With the Clone Technique, Shinobi can\
    \ create illusionary duplicates of themselves that have no physical substance),\
    \ Shapeshifting (With the Transformation Technique, Shinobi can transform themselves\
    \ into other people, animals, plants, and even inanimate objects, such as weapons),\
    \ Paralysis Inducement (With the Temporary Paralysis Technique, Shinobi can completely\
    \ paralyze their targets from close to mid range), Enhanced Senses (Byakugan allows\
    \ her to see long distances and tiny objects, has an almost perfect 360\xB0 field\
    \ of vision, can see through visual obstructions and her opponents' internal chakra\
    \ systems), Absorption (via Gentle Step Twin Lion Fists), Precognition (The byakugan\
    \ is stated to anticipate and predict movements), Limited Durability Negation\
    \ (The Gentle Fist bypasses durability to an extent as it directly targets the\
    \ nerves and life energy channels to disrupt the target's movements and ability\
    \ to control their inner energy), Chakra nullification (Hyugas are able to nullify\
    \ chakra-based ninjutsus by using the chakra on their palms to neutralize the\
    \ chakra in them), Acupuncture, Barrier Creation (via Kaiten), Fire Manipulation,\
    \ Lightning Manipulation, Air Manipulation, Mind Manipulation and Non-Physical\
    \ Interaction (Can fight in the mental space similar to how she fights in the\
    \ real world. Can harm Mecha-Kurama who's true essence doesn't have a physical\
    \ body), Non-Physical Interaction (Was capable of fighting against Kasumi's illusions),\
    \ Resistance to Illusion Creation and Mind Manipulation (Can take attacks from\
    \ Mecha-Kurama similar to how she takes attacks in the real world)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
