  attack_potency:
    text: "Small Planet level (Frequently fought with Gol D. Roger and cornered him\
      \ on several occasions, and he said that the Marines should bring Garp or Sengoku\
      \ if they wish to capture him. Many decades ago he along with Roger defeated\
      \ Rocks D. Xebec, who was the captain of Linlin, Kaido, Whitebeard, Shiki, and\
      \ other big-shot pirates. He is stated to have destroyed mountains by himself,\
      \ using them as punching bags. Defeated Prime Chinjao and disfigured his head.\
      \ Defeated Shiki alongside Sengoku. He is hailed as the hero of marines, thus\
      \ making him one of the strongest characters in the series. Stronger than he\
