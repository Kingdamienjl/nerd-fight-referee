- id: claim-standard-equipment-e941c38e
  section: equipment
  axis: equipment
  text: 'His favored hand-axe and grappling hook fastened to a spool of rope, a tough
    leather and scale armor that allows for moderate protection without sacrificing
    his flexibility and mobility. A string of flashbangs fastened to his belt and
    a supply of caltrops. Optional Equipment includes two trinkets and some small
    provisions: Agility Talon.png Unmovable Helmet.png Campers Helmet.png Hunters
    Talons.png Wounding Helmet.png Crime Lords Molars.png Vengeful Kill List.png Bounty
    Notice.png Grappling Mits.png BH Heartseeker.png Infamous Visage.png Mask of the
    Timeless.png * Agility Talon: Slightly boosts the Bounty Hunter''s speed and dodge
    capability. (+1 SPD, +4 DODGE) * Unmovable Helmet: Increases the odds of knocking
    back or pulling a target towards him while reducing the likelihood of being moved
    himself. (+30% Move Resist, 20% Move Skill Chance) * Camper''s Helmet: Increases
    his ability to reduce stress during camping and improve his scouting capability.
    (+20% Stress Skills while Camping, 10% Scouting Chance) * Hunter''s Talons: Improves
    his ability to deal a more lethal strike along with his accuracy at the cost of
    having him consume more food. (6% CRIT, +10 ACC, +50% Food Consumed) * Wounding
    Helmet: Boosts his damage with melee strikes while sacrificing some stunning,
    knockback and pull capability. (+25% DMG Melee Skills, -25% Move Skill Chance,
    -20% Stun Skill Chance) * Crime Lords'' Molars: A set trinket that provides a
    damage boost against marked, stunned, and bleeding enemies at a heavy cost of
    his dodge capability. ([20% DMG vs. Marked, Stunned, Bleeding], -10 DODGE) * Vengeful
    Kill List: Increases his knockback and bleeding capability along with providing
    an accuracy increase to his ranged skills. When paired with Crime Lords'' Molars
    the Bounty Hunter gets an increased chance at dealing a more lethal strike to
    marked, stunned, and bleeding targets. (50% Move Skill Chance, 35% Bleed Skill
    Chance, +15 ACC Ranged Skills. [5% CRIT vs. Marked, Stunned, Bleeding]) * Bounty
    Notice: Gives the Bounty Hunter an increase in damage, accuracy, and potential
    lethality against marked targets. (20% DMG, +10 ACC, +4% CRIT vs. Marked) * Grappling
    Mits: Improves his knockback, pull, and stunning capability alongside an accuracy
    increase. (25% Move Skill Chance, 20% Stun Skill Chance, +8 ACC) * Heart Seeker:
    Boasts a heavy melee damage increase while also increasing his odds at dealing
    a killing blow to a target. (25% DMG Melee Skills, 10% Death Blow Dealt Chance)
    * Infamous Visage: Improves his damage, lethality and accuracy to the suffering
    from a mental affliction while inflicting Stress on targets struck in melee. ([20%
    DMG, 10% CRIT, +5 ACC vs. Afflicted], On Melee Hit: Inflict +15 Stress) * Mask
    of the Timeless: A crystalline trinket that greatly boosts his dodge with a slight
    increase in speed at the cost of causing more stress on himself. (+2 SPD, +15
    DODGE, +5% Stress) For a comprehensive list of general and class trinkets, please
    head here. Provisions Animation.gif DD Shovel.png DD Torch.png DD Antivenom.png
    DD Bandage.png Medicinal Herbs.png DD Holy Water.png Laudanum.png The Blood.png
    Shard Dust.png Provisions are single-use items that may be used to provide slight
    benefits during a battle or outside of one. * Food: Self-explanatory, used to
    stave off hunger and provide slight healing. * Shovel: Used to clear away obstacles
    in the Bounty Hunter''s path, whether this be useful in the moment or not is uncertain.
    * Torch: Illuminates the area for the Bounty Hunter, like the shovel its usefulness
    depends on if the need for it arises. * Antivenom: Cures the Bounty Hunter of
    blights, poisons, and toxins. * Bandage: Staunches the flow of bleeding, removing
    the effect from the Bounty Hunter. * Medicinal Herbs: Stated to be able to cure
    diseases and maladies, but removes debuffs. * Holy Water: Increases their resistances
    upon usage. * Laudanum: A soothing tincture to inure one''s mind against the horrors
    of the dark. Cures Horror, a stress-inducing effect. * The Blood: A vial of blood.
    Should the Bounty Hunter be infected with the Crimson Curse this will push him
    into a state of Bloodlust, granting increased strength, speed, and resistance
    to Blight and stunning at the cost of becoming less resistant to bleeding. If
    not infected, this would become rather poisonous to him and thus not very useful.
    * Shard Dust: A shard of crystals that be used to tap into an otherworldly power,
    giving increased speed and strength for the entire battle at the cost of inflicting
    stress upon them. Consecutive uses of this will lead to greater amounts of stress.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
