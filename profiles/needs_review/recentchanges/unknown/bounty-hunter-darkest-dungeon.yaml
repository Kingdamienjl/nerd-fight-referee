      value: Superhuman Physical Characteristics, Stealth Mastery (The Bounty Hunter
        has an expertise in tracking and scouting, being able to survey his surroundings
        and locate looming threats without getting caught while also giving him the
        advantage in an ambush), Weapon Mastery (Experienced with his hand axe and
        grappling hook, demonstrating his ability to wield them with proficiency),
        Social Influencing (Can inspire allies and reduce their stress through Encourage
        or Pep Talk), Regeneration (Mid-low; capable of healing from nigh-lethal damage
        on the way back to the Hamlet), Healing and Purification (Type 3; Wound Care
        gives the Bounty Hunter the ability to heal another target along with removing
        Blight and Bleed), Preparation and possible Information Analysis (Skills such
        as This Is How We Do It and Planned Takedown increase the Bounty Hunter's
        accuracy and strength against larger opponents), Statistics Amplification
        and Statistics Reduction (Marked for Death will apply a Mark to a target and
        reduce their protection to damage while boosting the Bounty Hunter's speed,
        can reduce a target's speed through Caltrops), Status Effect Inducement (Caltrops
        are capable of inflicting Bleed on a target while also increasing their susceptibility
        to damage, Flashbang can disorient and stun targets, causing them to shuffle
        their position with another), Light Manipulation and Smoke Manipulation (Flashbangs
        erupt with a blast of light and leave a cloud of dizzying smoke), Damage Boost
        (The Bounty Hunter deals increased damage against targets that are marked
        and/or human as well as stunned targets with Collect Bounty and Finish Him
        respectively), Empowerment (When faced with heavy amounts of Stress, the Bounty
        Hunter can enter a Virtuous state, which may provide a series of positive
        effects), limited Holy Manipulation (Can obtain resistance buffs through the
        use of Holy Water), Resistance to Stun, Debuff, and Bleed Inducement, Disease
        Manipulation, Acid Manipulation, Empathic Manipulation, Fear Manipulation,
        Madness Manipulation, (Types 2 and 3), Mind Manipulation, Statistics Reduction,
        Curse Manipulation, and Poison Manipulation (The Bounty Hunter much like any
        other party member can resist various ailments, status effects, and the effects
        of Horror and Stress) Improved Status Effect Inducement and Statistics Reduction
        (Various trinkets such as the Vengeful Kill List and the Stun Amulet improve
        his ability to inflict stuns, bleed, and debuffs on targets), Camouflage (Trinkets
        like the Camouflage, Sun, and Moon Cloak improve the Bounty Hunter's ability
        to dodge attacks dependent on how well lit the area is), Statistics Amplification
        (Agility Talon, Hunter's Talons, and the Wounding Helmet improve his speed,
        accuracy, and the damage of his melee strikes respectively), Damage Boost
        (Crime Lords' Molars increase the damage the Bounty Hunter does to targets
        that are either stunned, bleeding, or marked while decreasing his dodge capability.
        The Martyr's Seal increases damage when near-death, etc.), Damage Reduction
        (Tough Ring and Heavy Boots increase protection from damage at the cost of
        damage potential or speed respectively), Poison Manipulation and Acid Manipulation
        (Crushed Hemlock allows the Bounty Hunter to inflict Blight with his melee
        strikes), Resistance to Stun, Debuff, and Bleed Inducement, Disease Manipulation,
        Acid Manipulation, Empathic Manipulation, Fear Manipulation, Madness Manipulation,
        (Types 2 and 3), Mind Manipulation, Statistics Reduction, Curse Manipulation,
        and Poison Manipulation (Many trinkets his ability to resist certain ailments
        or status effects, like the Cleansing Crystal and Fortifying Garlic)
