    - field: stamina
      value: ''''''' ''''''Superhuman'''''' (On par with Kirby, Meta Knight, and King
        Dedede, doing an adventure with them that left them similarly fatigued) |
        ''''''Superhuman'''''' (As before. 4 of any Star Ally can complete an adventure
        of several levels and bosses without any notable rest, ultimately defeating
        [[Zan Partizanne]], [[Hyness]] (2 phases), and [[Void Termina]] (4 phases)
        one after another)'
      source_id: mediawiki-16630
