  intelligence:
    text: 'Below Average in general, vast combat skills. Portrayed as slightly submissive,
      emotional, and with an unreasonably low regard for his own abilities, Bandana
      Dee has childish goals and reactions to things, but works around what he aims
      to do with the competence of a young teenager. He''s humble and will act heroic
      when needed to. Like other Kirby characters, his intelligence in combat is another
      story entirely; A master spear wielder and an experienced combatant who has
      gone toe to toe alongside Kirby on multiple occasions. Possesses vast combat
      skills due to being able to contend with, and defeat, foes with either some
      notable edge in power, competent combat skills, experience, complex attack patterns
      that require coordination to dodge, use abilities that give them a reasonable
      advantage mid-combat, or a combination of those factors, those being: Metal
      General, Landia EX, Magolor EX, Magolor Soul (In canon and in side content against
      the stronger, more complext Magolor Soul of the updated The True Arena), Galacta
      Knight (Side content), Crowned Doomer (Side content), the Master Crown possessing
      the Red Fruit (Side content), many Kirby clones as good as the original, Meta
      Knight | As before. Adding to that list of foes: The Three Mage-Sisters, Hyness,
      Void Termina (In canon, and the stronger version in side content), Parallel
      Meta Knight, Morpho Knight (Galacta Knight-absorbed regular and EX form in side
      content, Soul Forgo-absorbed in canon), many Kirbys, Bandana Waddle Dees, Magolors
      of a magic tower, Shadow Kirby, Meta Knight & Dedede (As a team), the real Kirby
      (In side content), Phantom Meta Knight, Fecto Elfilis & Chaos Elfilis'
    source_ids: *id002
    confidence: 0.95
