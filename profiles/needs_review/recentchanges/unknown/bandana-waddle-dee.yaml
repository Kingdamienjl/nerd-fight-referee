  attack_potency:
    text: "Continent level (A Waddle Dee closely serving King Dedede,Revenge of the\
      \ King \xB7 Kirby Super Star Ultra\"A Visitor from Afar\" cutscene \xB7 Kirby's\
      \ Return to Dream Land & Kirby's Return to Dream Land Deluxe which should make\
      \ him on par with Parasol Waddle Dees that are all over Planet Popstar and outer\
      \ space. His Megaton Punch fails to be as good as Iron Mam's, but it is in part\
      \ a manner of timing, precision and technique, rather than exclusively power,\
      \ hence Kirby can perform poorly despite his power being at the peak performance\
      \ of a Megaton Punch. Can fight against Kirby & a Helper at once, easily losing\
      \ because of Kirby, but not necessarily because of the Helper, who can harm\
      \ and defeat Iron Mams)"
    source_ids: *id002
    confidence: 0.95
  speed:
    text: "Relativistic+ Combat Speed (Can punch Planet Popstar hard enough to quickly\
      \ leave a crack in it visible from spaceMegaton Punch, level 3 \xB7 Kirby Super\
      \ Star & Kirby Super Star Ultra in side content, which shows what Kirby and\
      \ other characters can do. He's a Waddle Dee closely serving King Dedede, which\
      \ should make him on par with Parasol Waddle Dees that are all over Popstar\
      \ & outer space. Can fight against Kirby & a Helper at once, easily losing because\
      \ of Kirby, but not necessarily because of the Helper, who can harm and defeat\
      \ Iron Mams and are comparable to each other; like Knuckle Joe, who can also\
      \ punch Planet Popstar to quickly leave a crack in it visible from space, his\
      \ being better, or Simirror, who can react to an incoming laser by using a reflective\
      \ move at a close distance [0.64 c]; Any Helper can react to & dodge those lasers\
      \ across their adventures) | Massively FTL+ (Kept up with Kirby, Meta Knight\
      \ and King Dedede in an adventure, sharing comparable Travel, Reaction & Combat\
      \ Speed, if Meta Knight's Travel Speed is slightly superior by flying. Repeatedly\
      \ outran \"Dimension Walls,\" space waves which were consuming interstellar\
      \ parts of Another Dimension,See the AP of Magolor (Phase 2)/Magolor Soul or\
      \ the Master Crown. These space waves were only consuming interstellar parts\
      \ in the context of what was outrun, regardless of the scale of the whole feat.\
      \ which were moving fast enough to get past stars & nebulae in the background,Inter-dimensional\
      \ rift areas \xB7 Kirby's Return to Dream Land & Kirby's Return to Dream Land\
      \ Deluxe as well as keeping up with a flying Lor Starcutter and Landia in the\
      \ time a fainted Kirby woke up & they all escaped.\"Each to His Own World\"\
      \ cutscene \xB7 Kirby's Return to Dream Land & Kirby's Return to Dream Land\
      \ Deluxe Kept up in combat against the latter two and Magolor EX; Drew his spear\
      \ against Phase 1 Magolor while riding a Landia flying across Another Dimension's\
      \ Road,\"Final Battle EX\" cutscene \xB7 Kirby's Return to Dream Land & Kirby's\
      \ Return to Dream Land Deluxe meaning that he was really to face Magolor like\
      \ that and was reacting to the obstructed flight Landia just took while passing\
      \ by stars & nebulae.Level 8: Another Dimension \xB7 Kirby's Return to Dream\
      \ Land & Kirby's Return to Dream Land Deluxe In side content, which shows what\
      \ Kirby and other characters can do, he can keep up with & dodge projectiles\
      \ from several types of Doomers empowered by the Master Crown previously shown\
      \ in their regular state to keep up with & obstruct Landia as he flew across\
      \ Another Dimension's Road, and he can defeat Crowned Doomer, the tyrant boss\
      \ of the Doomers who should be comparable to those types of Doomers, and Galacta\
      \ Knight. Can join the Star Allies who chased and kept up with Jamba Heart pieces\
      \ multiple times, which were scattered across the galaxy from its edge. While\
      \ there are a few characters with means of a slightly superior Travel Speed,\
      \ all Star Allies show a comparable Travel, Reaction & Combat Speed, notable\
      \ ones being Kirby, Meta Knight, King Dedede, Gooey, Marx, Ribbon, Magolor,\
      \ and the Three Mage-Sisters. Can react riding a Friend Star for travel & in\
      \ combat, when that vehicle is made by the energies & \"the collective power\
      \ of Kirby and Friends\",KIRBY STAR ALLIES THE ORIGINAL ART BOOK, page 28 whereas\
      \ a regular Warp Star can be made by a lone Kirby. Kirby & 3 Star Allies kept\
      \ up in combat & defeated the Three Mage-Sisters, Hyness, and Void Termina,\
      \ who in turn was able to keep up with an improved version of the Warp Star\
      \ or the Friend Star, which Bandana Dee can maneuver in combat. In side content,\
      \ 4 Star Allies can defeat Morpho Knight EX, the stronger incarnations of Void\
      \ Termina. Along Kirby, they defeated Shadow Kirbya few times)"
