      value: 'In the Ninja Dojo minigame Bandana Dee either trains as a ninja or plays
        as one. He''s shown to teleport, appearing with some smoke. Although this
        could simply be tactics of confusion & quick movements, common to ninjutsu.
        He has a number of [https://youtu.be/mPnrPJnaJq4?t=975 "ninja stars"] (shurikens).,
        Maxim Tomato Certain items given in Merry Magoland, a theme park Magolor made,
        many of them and many of each can be carried at a time. [https://imgur.com/xoReMFF
        Bandana Dee can choose and use whatever items he has at any time]. These include:,
        Energy Drink: Restores health by 50% when used., Random Copy Essence: Only
        useful for Kirby. Randomly cycles itself to become all Copy Essences in Return
        to Dream Land Deluxe, slowing down after a few seconds of being summoned and
        somewhat removing the random factor. Touching the Copy Essence makes Kirby
        use the Copy Ability it represents., Crackler: Same as listed elsewhere as
        an item., Maxim Tomato: Same as listed elsewhere as an item., Balloon Bomb:
        Same as listed elsewhere as an item., Basket=In the Egg Catcher minigame he''s
        given a basket to equal Kirby & Dedede''s inhaling powers. He uses the basket
        to catch 30 eggs tossed at him one after another, [https://youtu.be/SxIBSXmJ63I?t=19
        have them hatch into chicks and safely come off], although they all die if
        he catches a bomb along them. This is either a display of his Toon Force or
        a magic basket., Booming Blasters'
