- id: claim-powers-and-abilities-1851af75
  section: abilities
  axis: hax
  text: Loses an interpretable amount of powers from base, and has *Incorporeality
    *Non-Physical Interaction *Immortality (Type 7. Has no health and can't be destroyed
    or defeated by others who can affect ghosts, unlike them) *Self-Sustenance (Types
    2 and 3) *Flight *Limited Life-energy Absorption (Triggers the aforementioned
    regeneration of his physical body) *Invisibility and Intangibility (Can actively
