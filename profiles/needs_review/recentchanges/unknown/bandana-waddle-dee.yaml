    - field: standard_equipment
      value: 'In the Ninja Dojo minigame Bandana Dee either trains as a ninja or plays
        as one. He''s shown to teleport, appearing with some smoke. Although this
        could simply be tactics of confusion & quick movements, common to ninjutsu.
        He has a number of [https://youtu.be/mPnrPJnaJq4?t=975 "ninja stars"] (shurikens).,
        Maxim Tomato Certain items given in Merry Magoland, a theme park Magolor made,
        many of them and many of each can be carried at a time. [https://imgur.com/xoReMFF
        Bandana Dee can choose and use whatever items he has at any time]. These include:,
        Energy Drink: Restores health by 50% when used., Random Copy Essence: Only
        useful for Kirby. Randomly cycles itself to become all Copy Essences in Return
        to Dream Land Deluxe, slowing down after a few seconds of being summoned and
        somewhat removing the random factor. Touching the Copy Essence makes Kirby
        use the Copy Ability it represents., Crackler: Same as listed elsewhere as
        an item., Maxim Tomato: Same as listed elsewhere as an item., Balloon Bomb:
        Same as listed elsewhere as an item., Basket=In the Egg Catcher minigame he''s
        given a basket to equal Kirby & Dedede''s inhaling powers. He uses the basket
        to catch 30 eggs tossed at him one after another, [https://youtu.be/SxIBSXmJ63I?t=19
        have them hatch into chicks and safely come off], although they all die if
        he catches a bomb along them. This is either a display of his Toon Force or
        a magic basket., Booming Blasters'
      source_id: mediawiki-16630
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: "''' '''Continent level''' (A [[Waddle Dee]] closely serving [[King Dedede]],Revenge\
        \ of the King \xB7 Kirby Super Star Ultra\"A Visitor from Afar\" cutscene\
        \ \xB7 ''Kirby's Return to Dream Land'' & ''Kirby's Return to Dream Land Deluxe''\
        \ which should make him on par with Parasol Waddle Dees that are all over\
        \ Planet Popstar and outer space. His Megaton Punch fails to be as good as\
        \ [[Iron Mam]]'s, but it is in part a manner of timing, precision and technique,\
        \ rather than exclusively power, hence Kirby can perform poorly despite his\
        \ power being at the peak performance of a Megaton Punch. Can fight against\
        \ Kirby & a Helper at once, easily losing because of Kirby, but not necessarily\
        \ because of the Helper, who can harm and defeat Iron Mams) | '''Low Multiverse\
        \ level''' (While helped with [[Kirby]], [[King Dedede]], and [[Meta Knight]],\
        \ their battle against [[Magolor|Magolor EX]] [https://imgur.com/zkweSIu \"\
        went beyond limits\"] [ie made them stronger], allowing them to defeat Magolor\
        \ Soul, destroying the [[Master Crown]]. [https://youtu.be/c3RuPLDbRJc&t=98\
        \ Overpowered 2 Grab Hands from a] [[Dark Crafter]]-possessed [[Claycia]],\
        \ [https://youtu.be/c3RuPLDbRJc&t=452 when one of them then repeatedly assaulted\
        \ Kirby], [https://youtu.be/N7zzhtHN3bg?t=981 overpowering him on contact\
        \ and being up to Bandana Dee to always beat the Grab Hand],''Kirby and the\
        \ Rainbow Curse'' comics \xB7 Kirby Art & Style Collection, page 141 [https://youtu.be/N7zzhtHN3bg?t=739\
        \ as \"Kirby can't seem to defeat him\"].Grab Hand figurine \xB7 ''Kirby and\
        \ the Rainbow Curse'' Won Dedede's Cake Royale alongside Kirby, which consisted\
        \ mostly of physical confrontations, beating various [https://imgur.com/a/fKsYE3O\
        \ Kirby clones as good as the original] in the process, as well as a [[Meta\
        \ Knight]] [https://imgur.com/a/WTdzIDI seeking to become stronger, who reiterated\
        \ that Kirby used his true strength], and King Dedede. In [[User blog:Eficiente/Kirby:\
        \ Canon & Scaling#Side content|side content, which shows what Kirby and other\
        \ characters]], he can defeat the following; [[Magolor|Phase 2 Magolor]] [a\
        \ weaker form of Magolor with the same multiversal feat], Crowned Doomer [[https://imgur.com/r7NSTy8\
        \ who obtained the power of the fragments of the crown]], the [[Master Crown]]\
        \ possessing the Red Fruit, and the strongest version of Magolor Soul.The\
        \ True Arena, updated version \xB7 ''Kirby's Return to Dream Land Deluxe'')\
        \ | '''Low Multiverse level''' (Can assist Kirby & 2 fellow [[:Category:Star\
        \ Allies|Star Allies]] in the canonical defeats of [[Void Termina]], [[Hyness|Corrupt\
        \ Hyness]], and the Retaliators [[Francisca|Three]] [[Flamberge|Mage]]-[[Zan\
        \ Partizanne|Sisters]] [at once].Story Mode & Heroes in Another Dimension\
        \ \xB7 ''Kirby Star Allies'' [[User blog:Eficiente/Kirby: Canon & Scaling#Side\
        \ content|On non-canon side content]], and while assisted by 3 Star Allies,\
        \ they can defeat [[Morpho Knight|Morpho Knight EX]] and the stronger incarnations\
        \ of Void Termina.Guest Star ???? Star Allies Go! mode when playing the [[Francisca|Three]]\
        \ [[Flamberge|Mage]]-[[Zan Partizanne|Sisters]], and The Ultimate Choice;\
        \ Soul Melter and Soul Melter EX difficulties \xB7 ''Kirby Star Allies'' In\
        \ canon, he and [[Gooey]] are the main partners Kirby can choose to defeat\
        \ everyone in the Buddy Fighters Tower, the team of two faced inexplicable\
        \ hordes of Kirbys, Bandana Waddle Dees, Gooeys and [[Magolor]]s, and more\
        \ notably they a few times defeated [[Shadow Kirby]], Meta Knight and King\
        \ Dedede, [[Kirby: General Explanations#Accelerated Development|becoming more\
        \ powerful by deepening their bonds of friendship]]. Can follow Kirby through\
        \ all of ''Forgotten Land'', helping him defeat the likes of Fecto Soul-absorbed\
        \ [[Morpho Knight]] and [[Fecto Forgo|Chaos Elfilis]], and [https://youtu.be/5RKroUoF3IY?list=PLDKzS4Vtdaskg6aNh0gTfCZ3v_2UOAGw1&t=372\
        \ when Kirby uses evolved Copy Abilities, Bandana Dee grows a bit stronger\
        \ too to match the their evolution level, admitting & being glad to be able\
        \ to keep up with him]), able to [[Durability Negation|negate durability]]\
        \ with Friend Hearts, and likely via fire and freezing attacks"
      source_id: mediawiki-16630
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: durability
      value: ''''''' ''''''Continent level'''''' (Can fight against Kirby & a Helper
        at once, easily losing because of Kirby, but not necessarily because of the
        Helper, who can harm and defeat [[Iron Mam]]s. Bandana De can endure several
        hits, if it is a one-sided fight) | ''''''Low Multiverse level'''''' (Can
        take several hits from anyone he can defeat) | ''''''Low Multiverse level''''''
        (Can take multiple hits from the [https://imgur.com/a/fKsYE3O Kirbys created
        by the Kirby Printer, which were as good as the original], Meta knight, and
        King Dedede. Can take blows from [[Void Termina]] in all his forms; The Star
        Allies Sparkler doesn''t cover the bodies of its drivers. Can take attacks
        from Post-Magolor Epilogue [[Magolor]])'
      source_id: mediawiki-16630
      provider_id: vsbattles
