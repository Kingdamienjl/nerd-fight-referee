    text: "Superhuman for Rouge (Has had three days of straight adventuring in Sonic\
      \ Heroes, both in and out of combat, and has went on adventures both alone and\
      \ with others while rarely showing signs of exhaustion. Has had special training\
      \ with G.U.N to be an elite agent as stated in Sonic Battle. However, she will\
      \ grown tired if she attempts to fly while carrying both Shadow and Omega for\
      \ too long and will struggle with flight in general if she does so for extended\
