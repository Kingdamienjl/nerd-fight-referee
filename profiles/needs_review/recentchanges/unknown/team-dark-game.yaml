- id: claim-standard-equipment-1ca6c91b
  section: equipment
  axis: equipment
  text: 'These weapons are firearms that typically have smaller rounds but a larger
    ammo capacity. **Egg Gun: One of the standard weapons of the Egg Pawn, a less
    powerful weapon but one that shoots with a rapid rate of fire (Gun). **Flash Shot:
    A weapon of the Black Arms, this automatic alien weapon shoots purple energy incredibly
    quickly but has a low level of damage. **Gatling Gun: This weapon has a rate of
    fire only matched by its incredible firepower, dispatching enemies much more quickly
    than many other weapons. **Heavy Machine Gun: A titular and powerful weapon loosely
    based off of the design given to the M60 and M1919 Browning. **Heavy Shot: A Black
    Arms handgun, low in power but carrying a decent amount of ammunition. **Light
    Shot: Another Black Arms handgun, particularly weak in the purple blasts it shoots
    compared to many of Shadow''s other weapons. **Pistol: A short-ranged and low-power
    G.U.N. weapon, loosely based off of the USP Tactical. **Ring Shot: Shooting out
    purple rings that harm anything caught in its path, this Black Arms weapon is
    particularly deadly due to its large bullet radius and high rate of fire. **Semi-Auto
    Rifle: An automatic rifle sporting a 30-round magazine, based loosely off of the
    M16A1. **Sub-Machine Gun: With a short range, low power, and fast rate of fire,
    Shadow best-utilizes this weapon in close range firefights. *Laser'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-dd1cd5b9
  section: power_scale
  axis: battle_iq
  text: Gifted (Rouge is an expert in thievery and espionage, having undergone special
    training to get where she is, skilled at kickboxing, hacking, swimming and manipulating
    others, such as Eggman in Sonic Adventure 2. Shadow is the Ultimate Lifeform,
    having given experience since birth at fighting and combat, expert in handling
    several types of weapons and vehicles with little training. Omega is an Eggman
    robot built to contain Shadow, having an ample access to his and possibly GUN's
    database). Extraordinary Genius Combatants (Shadow and E-123 Omega have shown
    this level of combat intelligence)
  source_ids: *id003
  decisive: false
  status: unverified
