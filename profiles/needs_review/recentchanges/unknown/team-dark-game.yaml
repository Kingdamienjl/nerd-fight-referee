- id: claim-weaknesses-9af2da2a
  section: weaknesses
  axis: weakness
  text: 'Omega is extremely prone to violence and destruction, sometimes even disobeying
    orders to cause more mayhem against his enemies. Notable Team Attacks/Techniques:
    Formations: Depending on the number and intensity of the obstacles in their path,
    Team Dark is quick to utilize different strategies by having a member in the lead
    of their formation. They can shift into three types, and can do so in a moment''s
    notice with nothing but a quick call to their allies. *Flight Formation: The formation
    Team Dark assumes with Rouge in the lead. Shadow grabs onto Rouge''s ankles, Omega
    does the same to Shadow, and the three of them form a tower-like position. This
    position is one that capitalizes range and mobility, and is the formation they
    use when an obstacle can''t be solved with speed nor strength. *Power Formation:
    The formation Team Dark assumes with Omega in the lead. When moving, Shadow and
    Rouge stand equal distance apart on either side of Omega in an "impassable wall"
    type position. This formation is one that relies on overwhelming offense to make
    up for a slight decrease in speed and mobility, and is one that they often use
    in the face of stronger enemies or overwhelming numbers. *Speed Formation: The
    formation Team Dark assumes with Shadow in the lead. When moving, Rouge and Omega
    rally side-by-side behind Shadow like a precise arrow tip. This formation is one
    that is primarily used for travel and quick-fire attacks, as it excels in speed
    and agility over Omega''s strength or Rouge''s mobility. File:Triangle Dive Omega.gif|The
    Triangle Dive *Ascending Flight: Rouge takes to the skies and can freely maneuver
    for limited amounts of time. The more Rouge moves, the less she can remain airborne
    with her allies attached to her (Fly Formation). **Quick Ascent: For a swifter
    rise into the air, Rouge will perform a sudden dash upwards. *Triangle Dive: When
    in the air or over an object that sends them airborne, Team Dark can hold onto
    one another in a triangular formation to efficiently glide in the air and slow
    their descent (Power Formation). File:Fire Launcher.gif|Omega''s Fire Launcher
    File:Omega Arms.gif|Omega''s Omega Arm File:Thunder Shot Rouge.gif|Rouge''s Thunder
    Shoot File:Chaos Inferno.gif|Team Dark''s Team Blast *Dummy Ring Bomb: Rouge throws
    three Dummy Rings in front of the trio, which causes an explosion when it makes
    contact with an enemy that releases an electrical paralysis field (Fly Formation).
    *Fire Combination: Also known as Fighting Pose, Shadow and Rouge encase each of
    Omega''s hands like a pair of gloves. While doing so, Omega can hit their enemies
    in several ways that cause devastating damage to the enemy (Power Formation).
    **Fire Launcher: While assuming the Fire Combination while in the air, Omega can
    launch Shadow and Rouge into enemies with such ferocity that they turn into fireballs
    that create an explosion upon making contact with an enemy. Said explosion damages
    anything in close proximity. This can also be used to break down doors that they
    couldn''t otherwise, as well as destroying obstacles in general. **Fireball Jump:
    While in their Fire Combination, Shadow and Rouge spin in a wide circle around
    Omega as he jumps into the air. When Omega''s feet lands back on the ground, they
    resume their previous position. **Omega Arm: Omega releases his teammates from
    his grip and stands in one place while spinning his robotic torso around clockwise.
    While doing so, Omega unleashes a full-force weapon barrage from his built-in
    arm cannons, which he transforms according to the weapon he uses. This results
    in a spiral-like wave of artillery that damages anything caught within its radius.
    At it''s most powerful Omega launches explosive missiles from his arms, causing
    wide-spread annihilation and destruction around him. Even enemies such as Badniks
    that usually take multiple hits to be subdued will be destroyed instantly. *Rocket
    Accel: Rouge and Omega rally behind Shadow before launching him forward, coating
    Shadow in a yellow aura that harms those he comes into contact with (Speed Formation).
    *Thunder Shoot: Performed by Rouge kicking her teammate towards an enemy, either
    Shadow or Omega will be coated in a protective aura. Once contact is made, the
    enemy will be vulnerably locked in place for several moments. *Chaos Inferno:
    Team Dark''s Team Blast.Sonic the Hedgehog Encyclo-speed-ia Page 136 Shadow grabs
    a Chaos Emerald from inside Omega and uses its power to use Chaos Control to stop
    time itself, holding his opponents in place. Rouge then grabs Omega and lifts
    him off the ground, and the walking arsenal fires two sets of gigantic lasers
    from his arms, destroying all opponents around him, truly a "frozen grave". File:Dark
    Rider.jpg| The Dark Rider File:S06Glider.jpg| GUN''s glider File:S06Buggy.jpg|
    GUN''s buggy File:S06Hovercraft.jpg| GUN''s hovercraft File:TSR_DarkReaper.png|
    Dark Reaper File:TSR_CrossDozer.png| Cross Dozer File:TSR_LipSpyder.png| Lip Spyder
    *Dark Rider: Shadow''s personal motocycle made by GUN'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-0bea1fb4
  section: abilities
  axis: hax
  text: 'Technological Flight (With G.U.N''s glider), Homing Attack and Explosion
    Inducement (With various vehicles and weapons given by GUN or others, Rouge''s
    own personal bombs and more), Paralysis Inducement (With Rouge using Thunder Shoot),
    and Statistics Amplification (Through various moves, such as the Rocket Accel),
    Absorption (With Egg Vacuum and Vacuum Pod), Healing (With Heal Cannon), Can research
    on information with GUN''s database.| All previous abilities, all the abilities
    gifted by Wisps (As seen in Team Sonic Racing, Dodon Pa gave them to each team
    that participated in his races), Technological Flight (With Shadow''s personal
    and custom Extreme Gear, Black Shot and Rouge''s personal and custom Extreme Gear,
    Temptation), Vehicular Mastery and Technological Fusionism (Can pilot the vehicles
    given by Dodon Pa, with Omega being able to fuse with his own to pilot it), Invulnerability
    (With Team Ultimate) *Base of Operations: GUN''s headquarters (At least for Shadow
    and sometimes Rouge, with Omega operating solo at times)'
