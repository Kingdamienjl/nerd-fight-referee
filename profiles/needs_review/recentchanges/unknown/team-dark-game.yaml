    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'Solar System level (Shadow can fight against Sonic repeatedly over the
      course of Sonic Adventure 2, the same with Rouge against Knuckles. Omega was
      made to defeat and contain Shadow [which he succeeded in doing in Silver''s
      future], and is superior to Gamma due to being the ultimate E-Series robot),
      higher with 3 Power Cores (Each Power Core doubles the physical abilities of
      their user), higher without Limiters | Galaxy level (All three of them fought
      against MephilesSonic the Hedgehog (2006): Shadow''s Story) to Universe level+
      (Rouge and Shadow can harm other racers within Sonic Free Riders, including
      a post-Secret Rings Sonic, who could defeat Erazor Djinn) to Low Multiverse
      level (Rouge and Omega are shown as comparable to Shadow within Dark Beginnings,
      with Shadow being comparable to Sonic, who could defeat the Egg Dragoon, a machine
      described as the pinnacle of Eggman''s scientific creations, which would include
      the Super Egg Robot), higher without Limiters (The three of them easily destroyed
      an entire army of Mephiles clones, and Shadow without Inhibitor Rings is massively
      more powerful than with them6 Universes)'
    source_ids:
    - vsbattles-team-dark-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: Massively FTL+ (Shadow can keep up with Sonic who is superior to his younger
      self, who has outpaced lasers. Rouge can keep up with Knuckles and Omega can
      keep up with both of them), higher with Power Cores, even higher without his
      limiters and in reactions (Though only Shadow has this ability and thus is the
      only one that can achieve this level of speed on his own) | Massively FTL+ (Comparable
      to Modern Sonic since both Rouge and Shadow have raced against him in Sonic
      Rivals 2. Shadow has evaded crashing meteors on a ship and intercepted an attack
      from a clone of him that caught Sonic off-guard, Omega was able to get the jump
      on and tag Infinite after being rebuilt), faster reaction speed and with his
      Boost (Shadow can react and dodge Sonic's Boost, has a Boost technique of his
      own that's comparable to Sonic's. This only applies to Shadow), higher without
      Limiters
    source_ids:
    - vsbattles-team-dark-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: Class M (Shadow is equal to Sonic who has tipped over the Egg Golem's weight,
      with Omega being physically superior to him and Rouge being slightly weaker)
      | At least Class M for Rouge (Rouge constantly improves herself with her elite
      training, but to what extent and by how much is unknown). At least Multi-Stellar
      for Shadow and Omega (Equal to Modern Sonic who is superior to his Werehog self
      in strength and can grapple with Metal Sonic, who is constantly updated to be
      on-par with him. Omega is stronger than him)
    source_ids: &id002
