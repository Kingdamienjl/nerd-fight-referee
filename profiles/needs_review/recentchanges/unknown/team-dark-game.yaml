      \u30AC\u30A4\u30C9 (in Japanese). ISBN 978-4757706255. Retrieved February 5,\
      \ 2007.)) | Superhuman for Rouge, Infinite for Omega and Shadow"
    source_ids:
    - vsbattles-team-dark-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: 'Standard Melee Range, Several Meters with their Team Blast, up to Complex
      Multiversal (6-D) with certain abilities for each | Same as prior Teamwork:
      Even back when the team was first formed, they have showcased the need of very
      little communication between them while traversing perilous environments and
      engaging enemies. They can switch formations seamlessly depending on what they
      deem best as necessary with only a shout of confirmation towards their teammates.
      After Shadow regained his memory, the team became more united than ever. They
      often go together in multiple missions in behalf of G.U.N; even after having
      the team''s trust shaken up by Mephiles'' manipulation, they quickly united
      together to seal the demon once and for all. In Modern times, they''re able
      to work in perfect harmony by using their separate strengths on a single target
      for greatest efficiency.Sonic X Shadow Generations: Dark Beginnings Episode
      II - Finding the Way'
    source_ids:
    - vsbattles-team-dark-game-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (Rouge is an expert in thievery and espionage, having undergone special
      training to get where she is, skilled at kickboxing, hacking, swimming and manipulating
      others, such as Eggman in Sonic Adventure 2. Shadow is the Ultimate Lifeform,
      having given experience since birth at fighting and combat, expert in handling
