    - field: range
      value: 'Standard Melee Range, Several Meters with their Team Blast, up to Complex
        Multiversal (6-D) with certain abilities for each | Same as prior Teamwork:
        Even back when the team was first formed, they have showcased the need of
        very little communication between them while traversing perilous environments
        and engaging enemies. They can switch formations seamlessly depending on what
        they deem best as necessary with only a shout of confirmation towards their
        teammates. After Shadow regained his memory, the team became more united than
        ever. They often go together in multiple missions in behalf of G.U.N; even
        after having the team''s trust shaken up by Mephiles'' manipulation, they
        quickly united together to seal the demon once and for all. In Modern times,
        they''re able to work in perfect harmony by using their separate strengths
        on a single target for greatest efficiency.Sonic X Shadow Generations: Dark
        Beginnings Episode II - Finding the Way'
      source_id: mediawiki-4727458
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Gifted (Rouge is an expert in thievery and espionage, having undergone
        special training to get where she is, skilled at kickboxing, hacking, swimming
        and manipulating others, such as Eggman in Sonic Adventure 2. Shadow is the
        Ultimate Lifeform, having given experience since birth at fighting and combat,
        expert in handling several types of weapons and vehicles with little training.
        Omega is an Eggman robot built to contain Shadow, having an ample access to
        his and possibly GUN's database). Extraordinary Genius Combatants (Shadow
        and E-123 Omega have shown this level of combat intelligence)
      source_id: mediawiki-4727458
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: 'Omega is extremely prone to violence and destruction, sometimes even
        disobeying orders to cause more mayhem against his enemies. Notable Team Attacks/Techniques:
        Formations: Depending on the number and intensity of the obstacles in their
        path, Team Dark is quick to utilize different strategies by having a member
        in the lead of their formation. They can shift into three types, and can do
        so in a moment''s notice with nothing but a quick call to their allies., Flight
        Formation: The formation Team Dark assumes with Rouge in the lead. Shadow
        grabs onto Rouge''s ankles, Omega does the same to Shadow, and the three of
        them form a tower-like position. This position is one that capitalizes range
        and mobility, and is the formation they use when an obstacle can''t be solved
        with speed nor strength., Power Formation: The formation Team Dark assumes
        with Omega in the lead. When moving, Shadow and Rouge stand equal distance
        apart on either side of Omega in an "impassable wall" type position. This
        formation is one that relies on overwhelming offense to make up for a slight
        decrease in speed and mobility, and is one that they often use in the face
        of stronger enemies or overwhelming numbers., Speed Formation: The formation
        Team Dark assumes with Shadow in the lead. When moving, Rouge and Omega rally
        side-by-side behind Shadow like a precise arrow tip. This formation is one
        that is primarily used for travel and quick-fire attacks, The Triangle Dive,
        Ascending Flight: Rouge takes to the skies and can freely maneuver for limited
        amounts of time. The more Rouge moves, the less she can remain airborne with
        her allies attached to her (Fly Formation)., Quick Ascent: For a swifter rise
        into the air, Rouge will perform a sudden dash upwards., Triangle Dive: When
        in the air or over an object that sends them airborne, Dummy Ring Bomb: Rouge
        throws three Dummy Rings in front of the trio, Fire Combination: Also known
        as Fighting Pose, Shadow and Rouge encase each of Omega''s hands like a pair
        of gloves. While doing so, Omega can hit their enemies in several ways that
        cause devastating damage to the enemy (Power Formation)., Fire Launcher: While
        assuming the Fire Combination while in the air, as well as destroying obstacles
        in general., Fireball Jump: While in their Fire Combination, Shadow and Rouge
        spin in a wide circle around Omega as he jumps into the air. When Omega''s
        feet lands back on the ground, they resume their previous position., Omega
        Arm: Omega releases his teammates from his grip and stands in one place while
        spinning his robotic torso around clockwise. While doing so, Omega unleashes
        a full-force weapon barrage from his built-in arm cannons, causing wide-spread
        annihilation and destruction around him. Even enemies such as Badniks that
        usually take multiple hits to be subdued will be destroyed instantly., Rocket
        Accel: Rouge and Omega rally behind Shadow before launching him forward, coating
        Shadow in a yellow aura that harms those he comes into contact with (Speed
        Formation)., Thunder Shoot: Performed by Rouge kicking her teammate towards
        an enemy, either Shadow or Omega will be coated in a protective aura. Once
        contact is made, the enemy will be vulnerably locked in place for several
        moments., Chaos Inferno: Team Dark''s Team Blast.Sonic the Hedgehog Encyclo-speed-ia
        Page 136 Shadow grabs a Chaos Emerald from inside Omega and uses its power
        to use Chaos Control to stop time itself, holding his opponents in place.
        Rouge then grabs Omega and lifts him off the ground, destroying all opponents
        around him, Lip Spyder, Dark Rider: Shadow''s personal motocycle made by GUN'
      source_id: mediawiki-4727458
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: 'These weapons are firearms that typically have smaller rounds but a
        larger ammo capacity., Egg Gun: One of the standard weapons of the Egg Pawn,
        a less powerful weapon but one that shoots with a rapid rate of fire (Gun).,
        Flash Shot: A weapon of the Black Arms, this automatic alien weapon shoots
        purple energy incredibly quickly but has a low level of damage., Gatling Gun:
        This weapon has a rate of fire only matched by its incredible firepower, dispatching
        enemies much more quickly than many other weapons., Heavy Machine Gun: A titular
        and powerful weapon loosely based off of the design given to the M60 and M1919
        Browning., Heavy Shot: A Black Arms handgun, low in power but carrying a decent
        amount of ammunition., Light Shot: Another Black Arms handgun, particularly
        weak in the purple blasts it shoots compared to many of Shadow''s other weapons.,
        Pistol: A short-ranged and low-power G.U.N. weapon, loosely based off of the
        USP Tactical., Ring Shot: Shooting out purple rings that harm anything caught
        in its path, this Black Arms weapon is particularly deadly due to its large
        bullet radius and high rate of fire., Semi-Auto Rifle: An automatic rifle
        sporting a 30-round magazine, based loosely off of the M16A1., Sub-Machine
        Gun: With a short range, low power, Shadow best-utilizes this weapon in close
        range firefights., Laser'
      source_id: mediawiki-4727458
      provider_id: vsbattles
      authority: high
      confidence: 0.75
