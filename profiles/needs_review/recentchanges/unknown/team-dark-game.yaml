    - field: weaknesses
      value: 'Omega is extremely prone to violence and destruction, sometimes even
        disobeying orders to cause more mayhem against his enemies. Notable Team Attacks/Techniques:
        Formations: Depending on the number and intensity of the obstacles in their
        path, Team Dark is quick to utilize different strategies by having a member
        in the lead of their formation. They can shift into three types, and can do
        so in a moment''s notice with nothing but a quick call to their allies., Flight
        Formation: The formation Team Dark assumes with Rouge in the lead. Shadow
        grabs onto Rouge''s ankles, Omega does the same to Shadow, and the three of
        them form a tower-like position. This position is one that capitalizes range
        and mobility, and is the formation they use when an obstacle can''t be solved
        with speed nor strength., Power Formation: The formation Team Dark assumes
        with Omega in the lead. When moving, Shadow and Rouge stand equal distance
        apart on either side of Omega in an "impassable wall" type position. This
        formation is one that relies on overwhelming offense to make up for a slight
        decrease in speed and mobility, and is one that they often use in the face
        of stronger enemies or overwhelming numbers., Speed Formation: The formation
        Team Dark assumes with Shadow in the lead. When moving, Rouge and Omega rally
        side-by-side behind Shadow like a precise arrow tip. This formation is one
        that is primarily used for travel and quick-fire attacks, The Triangle Dive,
        Ascending Flight: Rouge takes to the skies and can freely maneuver for limited
        amounts of time. The more Rouge moves, the less she can remain airborne with
        her allies attached to her (Fly Formation)., Quick Ascent: For a swifter rise
        into the air, Rouge will perform a sudden dash upwards., Triangle Dive: When
        in the air or over an object that sends them airborne, Dummy Ring Bomb: Rouge
        throws three Dummy Rings in front of the trio, Fire Combination: Also known
        as Fighting Pose, Shadow and Rouge encase each of Omega''s hands like a pair
        of gloves. While doing so, Omega can hit their enemies in several ways that
        cause devastating damage to the enemy (Power Formation)., Fire Launcher: While
