- id: claim-range-92febb45
  section: power_scale
  axis: range
  text: 'Standard Melee Range, Several Meters with their Team Blast, up to Complex
    Multiversal (6-D) with certain abilities for each | Same as prior Teamwork: Even
    back when the team was first formed, they have showcased the need of very little
    communication between them while traversing perilous environments and engaging
    enemies. They can switch formations seamlessly depending on what they deem best
    as necessary with only a shout of confirmation towards their teammates. After
    Shadow regained his memory, the team became more united than ever. They often
    go together in multiple missions in behalf of G.U.N; even after having the team''s
    trust shaken up by Mephiles'' manipulation, they quickly united together to seal
    the demon once and for all. In Modern times, they''re able to work in perfect
    harmony by using their separate strengths on a single target for greatest efficiency.Sonic
    X Shadow Generations: Dark Beginnings Episode II - Finding the Way'
  source_ids: *id003
  decisive: false
