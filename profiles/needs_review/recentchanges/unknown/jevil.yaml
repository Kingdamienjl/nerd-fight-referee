- id: claim-powers-and-abilities-d6d81071
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *Darkner Physiology **Danmaku (Uses
    attacks involving the use of multiple bullets of various shapes coming from multiple
    directions at once in many patterns in order to overwhelm the opponent, including
    carousels going at opposite intervals and multiple scythes) **Immortality (Type
    1; Can seemingly live for hundreds of years) **Duplication, Shapeshifting & Size
    Manipulation (Can transform in either the Devilsknife or the Devilstail after
    his defeat, with him being able to also make duplicates of himself as the former
    or enlarging his size) **Statistics Amplification & Pseudo-Energy Manipulation
    (By transforming into the Jevilstail or the Devilsknife, it can increase the strength,
    defense, or magic of the user. Devilsknife can reduce the TP cost of the Rude
    Buster by 10%) *Durability Negation (Final Chaos attacks disregards enemy defense,
    and inflict damage proportional to target remaining HP) *Flight & Afterimage Creation
    (Shown to constantly levitate and can control his movements mid-air with enough
    speed to generate multiple afterimages) *Teleportation (Shown here and here) *Energy
    Projection (His scythes generate pillars of energy) *Homing Attack (Some of his
    attacks also target the opponent and aim directly at them depending on their position)
    *Breaking the Fourth Wall (Aware of his world being just a game, with him also
    being implied to have also the same awareness as Spamton''s about this due to
    him calling the entire world around him a prison with no freedom unlike his cell,
    or Spamton and Jevil knowing each other, with Spamton hating him for probably
    having the opposite view on him on this fact) *Body Control (Can extend his neck
    as if it''s a spring toy) *Telekinesis (Has full control on the objects he creates)
    *Reality Warping & Void Manipulation (Warped his room upon starting the fight,
    and made it completely disappear after his defeat) *Sleep Manipulation & Dream
    Manipulation (Can assist in Susie''s Scythemare spell; his scythes can replicate
    the effects of the spell, inflicting all TIRED enemies with bad dreams and SPARE
    all of them) Resistance to the following: *Sleep Manipulation (Jevil needed to
    be hypnotized 9 times to even be vulnerable to a sleep inducement spell) *Absolute
    Zero, Ice Manipulation & Heat Manipulation (Present as an item in the fight with
    Lanino and Elnina, can withstand being at 999F/-999F. Has greater defense than
    Berdly, who took IceShocks capable of freezing other Darkners solid, and is thus
    would be even less vulnerable to ice spells)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
