    confidence: 0.95
  attack_potency:
    text: Planet level (Stated to be superior to Spamton, as Jevil is the one he referred
      to as "Clown". Given Spamton's implications about Jevil's "games" and his knowledge
      on Jevil's scythe, his superiority seems to lie in strength. Able to deal more
      damage than both King and Susie in Chapter 1. Described by Seam in Chapter 2
      as exceptionally powerful among Darkners due to him being an owner of a Shadow
      Crystal, managing to fight him is not a small feat, and in Chapter 5 Seam effortlessly
      defeated and was unimpressed by the CH4 RECRUITs, making Jevil as the only one
      who could match them in the games they used to playAs evident from Jevil's game
      with the Fun Gang being a fight to the death, as well as his plans to play the
      same game with the rest of the Card Kingdom, his "games" appear to involve fighting.
      Furthermore, the implications surrounding his games with Spamton and the latter's
      familiarity with Jevil's scythe suggest that this was also the case before Jevil's
      change in perspective.122.8 Zettatons)
    source_ids:
    - vsbattles-jevil-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
