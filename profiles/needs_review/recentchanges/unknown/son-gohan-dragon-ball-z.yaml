    - field: weaknesses
      value: Gohan has an explosive temper that can flare up suddenly and cause him
        to act irrationally, but he is generally a pacifist who despises fighting.
        Due to this, Gohan was prone to arrogance, even dipping into ruthlessness
        during his battle with Cell and seeking to prolong his suffering as retaliation
        for his crimes. He needs a moon to transform and loses control of himself
        as an Oozaru. He never trained the weakness away, his tail is a vulnerable
        point and grabbing or removing it will cause him intense pain.
