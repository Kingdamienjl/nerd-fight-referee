- id: claim-weaknesses-a849df63
  section: weaknesses
  axis: weakness
  text: 'Gohan has an explosive temper that can flare up suddenly and cause him to
    act irrationally, but he is generally a pacifist who despises fighting. Due to
    this, he often keeps his true power restrained to avoid harming others. As a Super
    Saiyan 2 and after first getting his Ultimate form, Gohan was prone to arrogance,
    even dipping into ruthlessness during his battle with Cell and seeking to prolong
    his suffering as retaliation for his crimes. He needs a moon to transform and
    loses control of himself as a Great Ape. He never trained the weakness away; his
