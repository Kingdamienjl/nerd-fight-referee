- id: claim-standard-equipment-57e394ac
  section: equipment
  axis: equipment
  text: "* Thunderseal: The sword Ky currently owns. One of the Eight Sacred Treasures,\
    \ weapons designed by Sol Badguy as part of Outrage, the ultimate anti-Gear weapon.\
    \ It acts as a conduit for thunder magic, allowing the user to charge up energy\
    \ inside the blade for release at an opportune time. By breaking it, the user\
    \ can generate a localized temporal stasis field, stopping time in a short range\
    \ for everyone except the user. This field can only be dismantled from the outside\
    \ by powerful magic users. * Aquila: A modified ceremonial sword Ky used in GG2\
    \ after breaking Thunderseal to freeze Dizzy in time. It seems to have capabilities\
    \ similar to those of Thunderseal, although less powerful. * Magnolia \xC9clair:\
    \ A custom-made Illyrian sword Ky used in Xrd, replacing Aquila. It seems to have\
    \ capabilities similar to those of Thunderseal, although less powerful."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
