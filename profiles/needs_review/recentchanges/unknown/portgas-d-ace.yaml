- id: claim-powers-and-abilities-e42b3268
  section: abilities
  axis: hax
  text: "* Superhuman Physical Characteristics * Acrobatics * Stealth Mastery * Weapon\
    \ Mastery (Ace was shown using various weapons, including an axe and a knife.\
    \ As a child, he used a long bo staff made from pipe to defeat some bandits) *\
    \ Proficient Hand-to-Hand Combatant * Haki (Initial Haoshoku) Same as before *\
    \ Haki (Intermediate Haoshoku, Intermediate Kenbunshoku, Intermediate Busoshoku)\
    \ * Reactive Power Level (Is stated capable of growing stronger continuously through\
    \ battle) * Expert Hand-to-Hand Combatant (Excels in combat in spite of his Devil\
    \ Fruit) * Supernatural Willpower (Resisted Shanks' Conqueror Haki. He was the\
    \ only one of his crew unaffected by Whitebeard's Conqueror Haki, even though\
    \ he was severely tired and injured. He could work assiduously in building a ship\
    \ for days, without any rest or food; when humans under normal conditions began\
    \ to lose strength and pass out) * Fire Manipulation and Intangibility (Ate the\
    \ Mera Mera no Mi, a Logia-type Devil Fruit that allows him to become the element\
    \ of fire and control the flames from his body in various ways) * Inorganic Physiology\
    \ (Type 1; While he's turned into fire) * Regeneration (Mid-High; only in his\
    \ Logia form) * Body Control (He should be capable of altering the size and shape\
    \ of his Logia form to some degree \u2013 similarly to Aokiji) * Heat Manipulation\
    \ (Able to change the heat of his fire, so that this can make green, white fire\
    \ and possibly other colors) * Limited Weather Manipulation (Could clear away\
    \ bad weather like blizzards and make it sunny) * Heat Aura (Ace's Haki had been\
    \ described by Shanks and Benn Beckman to be fiery in nature, to the point that\
    \ Ace\u2019s very presence was able to stop a blizzard on an island for as long\
    \ as he was there. As such, when he turned up on Drum Island, no snow fell at\
    \ all on the island for an entire day) * Weapon Creation (Fully capable of creating\
    \ beings or weapons made of pure fire: such as spears and dragons) * Limited Light\
    \ Manipulation, Homing Attack and Danmaku (Via Hotarubi) * Forcefield Creation\
    \ (Via Flame Fence. Ace can use his flames defensively, to the point of creating\
    \ walls/barriers made of fire) * Minor Durability Negation (Can make his fire\
    \ go through the enemy's body thus burning them both in and out) * Flight via\
    \ propulsion * Fire Absorption * Speed Boost via acceleration Resistance to *\
    \ Extreme Heat and Fire Manipulation (All Logias are resistant to their respective\
    \ elements. Resisted the water boiling bath in Impel Down when he had no powers.\
    \ Was unfazed from Akainu's heat aura) * Cold Manipulation (Unfazed by the cold\
    \ temperatures of a blizzard storm while on a high mountain elevation while wearing\
    \ shorts) * Madness Manipulation, Mind Manipulation, and Soul Manipulation via\
    \ Willpower (Through sheer willpower they can resist losing their mind when absorbing\
    \ shadows through the Kage Kage no Mi. Shadows belonging to strong willed people\
    \ are difficult to control, allowing them to rebel against Moria's pact which\
    \ usually immediately submits a shadow to his supremacy and orders. Spiritual\
    \ energy is contained within one's soul/life; this energy is represented by the\
    \ fighting power or the Haki itself. Those with strong souls, which are homologous\
    \ to shadows, resist the effects of Brook's soul manipulation)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
