    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Levitation (seen here), Dimensional
        Travel (was able to travel from the real world back to the velvet room, which
        is a separate dimensions) a master user of Cognition there for should be able
        to use its various effects such as Reality Warping (Philemon states himself
        that cognition can alter reality itself) Subjective Reality (Maruki explains
        how depend on someone''s cognition they comprehend the world different than
        others meaning ones reality can be another''s fiction) Maruki stating that
        he would rewrite all of existence with his cognition meaning anything that
        where to exist would''ve overwritten meaning Matter, Death, Ice, Light, Holy,
        Dark, Air, Curse, and energy spells. Durability and Resistance Negation (with
        almighty spells) Creation (cognition creates clothes) Earth Manipulation,
        Existence Erasure ( able to kill demons who reside within aziluth which transcends
        life and death) Regeneration High-Godly (cognition allows one to reclaim their
        existence within a reality) Invulnerability (with endure skills) Statistics
        Reduction (is able to reduce the statistics of the investigation team during
        there fight) Summoning (can summon personas and even beings such as lucifer)
        Rules over all power and therefore should be able govern over it giving her
        Power Nullification, Power Bestowal, Power Mimicry, Power Absorption, Nigh
        Invulnerability (with the omnipotent orb) Teleportation (seen in persona 4
        arena ultimax) Poison Manipulation (seen here) Statistics Amplification (Margaret
        can increase her stats such as her attack) Forcefields (with Tetrakarn/Marakarn)
        Reactive Evolution (when users of persona''s are at there brink they can have
        a explosive boost in their stats, going from getting dwarfed to stomping in
        return) Buff and Debuff negation, Pain Manipulation (able to make opponents
        feel her pain with Hex) Power Nullification (with bind skills) Healing (can
        heal herself) Life Absorption (seen here with spirit drain) Transmutation
        ( Elizabeth with here cognition is able to turn people into cards) BFR (characters
        are able to open portals so send foes away) Conceptual Manipulation (Cognition
        by definition should inherently be conceptual) Personas Cognition seems to
        one in the same with Observation/Understanding thus should give off the same
        effect of it Power Nullification (seen here with Nanashi) Immortality Negation
        Type: 4 (can kill demons who can reincarnate indefinitely)'
