    \ higher in the hierarchy than other divine protections meaning her divine protection\
    \ is resistant to the effect of weaker divine protections]) **Fate Manipulation\
    \ (Several individuals, through their intuition, [https://i.gyazo.com/f551f3c5db28fbf25ca1e09bfbb5b4a6.jpg\
