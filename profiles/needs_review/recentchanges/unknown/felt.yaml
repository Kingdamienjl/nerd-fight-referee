    - field: weaknesses
      value: 'Notable Attacks/Techniques: *Unnamed Divine Protection; Felt has a Divine
        Protection which is mentioned to be related to the wind. It seemingly allows
        her to move faster than she otherwise could and accelerate to top-speed in
        an instant. Felt can dash ahead in the blink of an eye, releasing a gust when
        she stops moving. She has also shown that she can use her Divine Protection
        to dash upwards, climbing on walls and buildings. This Divine Protection is
        noted to be somewhat high up in the "hierarchy" of Divine Protections, as
        the Divine Protection of Evaluation cannot discern it. ==Notable Matchups==
