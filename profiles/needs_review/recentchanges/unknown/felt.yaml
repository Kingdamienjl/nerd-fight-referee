        return to peak condition and body modifications, even those as profound as
        Overhaul''s Quirk, will be undone. Using this Quirk on a single person for
        a long-enough period of time will cause extreme pain that feels as though
        the target''s own body were tearing itself apart before finally rewinding
        them out of existence completely. This Quirk first targets recent changes,
        allowing Deku to intentionally break his own limbs with One For All 100% to
        mitigate the effects of Eri''s Quirk. However, the speed of the changes will
        also increase over time, as even Deku''s use of One For All 100% wasn''t enough
