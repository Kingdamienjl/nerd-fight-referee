    - field: standard_equipment
      value: '*A large knife. *The Star Staff: A meteor invented by the Witch of Greed,
        when supplied with an appropriate volume of mana it fires the light of Shario
        at a target. While incomparable to a the power of a star, it still boasts
        incredible might that mows down everything in its path, and even locks onto
        its target''s Gate to guarantee that it strikes true. Allegedly, the Witch
        created this meteor with the primary purpose of pestering the Divine Dragon.'
      source_id: mediawiki-605092
      provider_id: vsbattles
