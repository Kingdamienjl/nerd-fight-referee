- id: claim-weaknesses-fb584423
  section: weaknesses
  axis: weakness
  text: "Using the K\u0101ma Seal to release jutsu causes him to \"Overheat\" and\
    \ pass out after a while. | After being rebranded with a new K\u0101ma seal from\
    \ Amado, he installed a shutdown command that would place him into stasis using\
    \ Amado's voice. Kawaki has average chakra control that's isn't on par with Shinobis.\
    \ {| class=\"mw-collapsible mw-collapsed\" align=\"center\" border=\"1\" cellpadding=\"\
    1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"2\" style=\"text-align:\
    \ left; \" |Notable Attacks/Techniques: |- | * Body Transformation: Kawaki's body\
    \ has undergone significant modification at the hands of Amado, down to the level\
    \ of his circulatory and nervous systems, transforming him into something of a\
    \ living scientific ninja tool. His body tissue can undergo rapid cellular division,\
    \ causing it to expand, and it can also instantly undergo sclerosis or malacia\
    \ to harden or soften. This allows him to partially transform his body in a manner\
    \ similar to J\u016Bgo's Sage Transformation, weaponizing it to produce sharp\
    \ blades or piercing tendrils; these growths can even be shed, or thrown as projectiles.\
    \ This also provides him with an accelerated healing rate, able to mend his injuries\
    \ in minutes. ** : The user impales the opponent with their modified limb and\
    \ disintegrates them with a large blast of chakra gathered from their K\u0101\
    ma. ** : With Microscopic Scientific Ninja Tools in their bloodstream, the user\
    \ is able to modify their flesh for offensive, defensive, and supplementary purposes.\
    \ ** : Using their modified flesh, the user uses their hardened flesh to throw\
    \ projectiles. ** : The user punches the opponent and follows up by impaling them\
    \ with their modified flesh. ** : * : During his time in Konoha, Kawaki learned\
    \ to use Fire Style. * : Kawaki creates tangible \"shadow clones\" that can fight\
    \ and use his techniques, but disappear after one definite hit. * : K\u0101ma\
    \ is a seal bestowed by members of the Otsutsuki clan that takes the form of a\
    \ four-point black diamond on the recipient's body, marking them as a \"vessel\"\
    . The seal significantly enhances the user's physical abilities and jutsu's power.\
    \ He received the mark on his left palm from Isshiki \u014Ctsutsuki. When activated\
    \ it spreads across the left side of his body forming angular and curving geometric\
    \ patterns, extending up to his left eye, and then glows red. He later lost his\
    \ Kama due to Isshiki's revival using Jigen's body. He would later be rebranded\
    \ by Amado with a K\u0101ma that serves as a weapon. This reconstructed K\u0101\
    ma seal was also modified by Amado to contain the data of Amado's late daugther\
    \ Akebi, in hopes to implant on a clone in hopes of bringing her back. ** : The\
    \ user gathers chakra stored in their K\u0101ma to release a blast of chakra.\
    \ ** \u014Ctsutsuki Teleportation: Using K\u0101ma, the user creates a rift from\
    \ the mark, which allows anyone who enters it to travel to a chosen location including\
    \ foreign dimensions. ** : After being rebranded with a new K\u0101ma. Kawaki\
    \ gain access Isshiki's Kokugan. Kawaki is able to use the spokes of the d\u014D\
    jutsu. One spoke when he's not using any techniques and two to five when using\
    \ any technique. Three years later he would obtain all 8 spokes. *** : After regaining\
    \ his K\u0101ma, Kawaki is able to abilites of Isshiki. Using Isshiki's Kokugan,\
    \ Kawaki is able to shrink and enlarge either himself and any inorganic matter\
    \ within his gaze and return it to its original size at will. Because the change\
    \ in size happens too fast for the human eye to see, it is often mistaken for\
    \ teleportation. Daikokuten can store these objects within a timeless dimension,\
    \ allowing them to maintain their condition. **** : The user fires formerly shrunken\
    \ black rods as projectiles towards the enemy. **** : The user shrinks themselves\
    \ to evade their enemy's sight in order to perform a sneak attack. *** : Daikokuten\
    \ is a technique within the Kokugan. Through its use, living and non-living matter\
    \ can be transported and stored within a dimension where time doesn't flow, allowing\
    \ them to maintain a pristine condition. They can be instantaneously retrieved\
    \ at the focus of his gaze. Kawaki can also transport himself into the Daikokuten\
    \ dimension. **** : Can manifest massive black cubes with Daikokuten, which he\
    \ can freely manipulate. These black cubes disrupt sensory abilities. **** Black\
    \ Rods: Black rods created by Kawaki to immobilize, restrict movements and absorb\
    \ the target's chakra. *** Chakra Suppression Technique: Kawaki would obtain the\
    \ \u014Ctsutsuki's ability to suppress their chakra signature. Vessels of an \u014C\
    tsutsuki can access this ability on instinct, without being consciously aware\
    \ of its existence. However unlike shinobis who suppress their chakra signature\
    \ \u014Ctsutsuki can still able to use ninjutsu. Such when Kawaki created and\
    \ maintained a shadow clone while suppressing his true body's chakra. But \u014C\
    tsutsuki and vessels can detect the user regardless. File:Jutsu_absorption.jpg|Jutsu\
    \ absorption File:Releasing.jpg|Release File:Right_hand_altering.jpg|Right Hand\
    \ transformation File:Mid_rang"
