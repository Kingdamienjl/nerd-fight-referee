- id: claim-standard-equipment-78419e1e
  section: equipment
  axis: equipment
  text: '*Enma: As one of 21 Wazamono and a masterpiece made by the legendary blacksmith
    Shimotsuki Kouzaburou, Enma is among the best swords in the world. Enma was seen
    as an extremely difficult sword to handle, with Oden being the only one to have
    tamed it. This is due to Enma''s distinctive quality of extracting Ryuo (Armament
    Haki) from its user in excessive quantities, forcing attacks much more powerful
    than intended. *Ame no Habakiri: As a masterpiece by Tenguyama Hitetsu, one of
    Wano''s greatest blacksmiths and one of 21 O Wazamono, Ame no Habakiri is an extremely
    powerful sword comparable to Enma. According to the creator, it can "cut through
    even the heavens".'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-65855e4d
  section: power_scale
  axis: battle_iq
  text: At least Above Average (He is a genius of Bushido's art, being comparable
    to swordsmen and warriors considered legends. As a member of royalty he is able
    to read and write the ancestral language. He's been a master at using Haki since
    he was young)
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-30cdb04f
  section: weaknesses
  axis: weakness
  text: "Standard Haki Weaknesses Notable Attacks/Techniques *Voice of All Things:\
    \ Like Roger and Luffy, Oden had the ability to hear the \"Voice of All Things\"\
    , which his son also inherited. On the trip to Fish-Man Island, he could hear\
    \ the voices of the Sea Kings alongside Roger, and could also hear a voice while\
    \ nearing Zou. *Haki (\u8987 \u6C17): Haki is a latent power in any living thing\
    \ in One Piece. It basically consists of three types: The Armament Haki, Observation\
    \ Haki and the Conqueror's Haki (Conqueror's Haki is only exclusive for some special\
    \ individuals, something Oden is). Oden was one of the very small number of people\
    \ in the world who could use all three types of Haki. His Haki was so powerful\
    \ that he could easily wield the sword Enma, which drains away its wielders Haki\
    \ at a near fatal rate. **Armament Haki (\u6B66\u88C5\u8272\u306E\u8987\u6C17\
    \ Bus\u014Dshoku Haki): Oden was an extremely powerful master of Armament Haki,\
    \ which is known as It is most noted as he was the only samurai who tamed the\
    \ Meito, Enma, despite its dangerous Haki-draining properties, which even Kin'emon,\
    \ the Nine Red Scabbards' Leader feared, displaying his supreme mastery compared\
    \ to Zoro whose entire arm was emaciated after a single slash wielding Enma. Even\
    \ at age 18, Oden was masterful in using Armament Haki, as he imbued both his\
    \ swords (Ame no Habakiri and Enma) hardening them, letting him cleanly bisect\
    \ the enormous Mountain God in a single slash. At age 29, Oden hardened his swords\
    \ and then clashed against one of the 12 Saijo O Wazamono, Murakumogiri, which\
    \ belonged to Edward Newgate, an immensely powerful Armament Haki master in his\
    \ own right. A true testament to his prowess, at age 39, Oden was able to wound\
    \ the nigh-indestructible Kaido while in his dragon form, giving him a permanent\
    \ scar whereas Luffy using Boundman couldn't even damage him. **Observation Haki\
    \ (\u898B\u805E\u8272\u306E\u8987\u6C17 Kenbun-shoku no Haki): This haki works\
    \ similarly to a sensor, the user is able to see or feel people's aura, being\
    \ able to anticipate their attacks and capture them even from great distances.\
    \ In other stages, this haki provides the user with the ability to even see the\
    \ future. **Conqueror's Haki (\u8987\u738B\u8272\u306E\u8987\u6C17 Ha\u014D-shoku\
    \ no Haki): Oden possessed the ability to use Conqueror's Haki, a very rare type\
    \ of Haki whose users are said to have the qualities of a king. In his initial\
    \ encounter with Edward Newgate 30 years ago, the sudden clash between both of\
    \ them created a notable effect similar to lightning, as well as released a shockwave,\
    \ this is also shown during his clash against Kaido. While not directly shown\
    \ in the manga, Oden uses its more common effect at least once, making a bunch\
    \ of Kaido's henchmen faint. *Oden Nitoryu (Oden's Two Sword-Syle): Oden was an\
    \ immensely skilled and powerful swordsman, having developed his own variation\
    \ of Nitoryu, which Oden himself called as Oden Nitoryu. He had immense prowess\
    \ and ambidexterity in dual-wielding the legendary swords, Enma and Ame no Habakiri.\
    \ **Togen Shirataki (Paradise White Waterfall): Oden hardens both his swords using\
    \ Armament Haki and then delivers a diagonal slash with each one of them at the\
    \ same time. This technique has immense power and range, as seen when Oden used\
    \ the technique to bisect the massive Mountain God in half. When performing it\
    \ in the anime, Oden not only imbues his swords' blade, but also their hilts and\
    \ his own arms. **Shimi Daikon (Great Spirit of Samurai): Oden imbues his swords\
    \ with an extra amount of Armament Haki, then charges the opponent with the swords\
    \ crossed behind his own head, then uncrosses them in a single motion, eventually\
    \ unleashing the Armament Haki and cutting into them at once. Each sword wears\
    \ a long Armament Haki blade extension as a result of this technique. **Gan Modoki\
    \ (Gun Imitating Demon): After hardening his swords with Armament Haki, Oden crosses\
    \ his swords and charges forward, slicing anyone in his path. When Oden used this\
    \ technique, he was able to defeat several members of the Roger Pirates at once.\
    \ **Togen Totsuka (Paradise Ten Hands): Oden hardens his swords using Armament\
    \ Haki, then leaps toward his opponent, and performs an X-shaped slash powerful\
    \ enough to give the nigh-invincible Kaido his permanent scar. When performing\
    \ it in the anime, Oden not only imbues his swords' blade but also his own arms.\
    \ OdenBusoshokuHaki.gif|Armament Haki OdenHaoshokuHaki.gif|Conqueror's Haki OdenTogenShirataki.gif|Togen\
    \ Shirataki OdenShimiDaikon.gif|Shimi Daikon GanModokiOden.gif|Gan Modoki OdenTogenTotsuka.gif|Togen\
    \ Totsuka"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-95c093e5
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Large Size (Type 0; 3.82 meters)
    * Master Swordsman * Haki (Advanced Haoshoku, Intermediate Kenbunshoku, Advanced
    Busoshoku) * Supernatural Willpower (Held onto a chain pulled by the Moby Dick
    and faced the many dangers and climates of the New World ocean with no protection
    for three days. Spent 1 hour in boiling oil which temperature exceeded 700 Degrees
    of heat, while lifting the 9 Scabbards the entire time) * Regeneration (Mid-Low
    over time; Recovered from being severely injured after a night time of sleep),
    Air Manipulation (Able to send air slashes with his swords) * Extrasensory Perception
    and Telepathy (Can hear the "Voice of All Things") * Social Influencing (Women
    get attached to Oden''s charisma even if he commits outrageous actions and the
    women who were kidnapped by him when he formed a harem when he was 15, stayed
    willingly with him. He also made people want to follow his lead and his charisma
    turned Kuri, a district full of infamous thieves, into a peaceful land) * Enhanced
    Senses (Heard Toki being attacked at a cove while he was at the sea and successfully
    found her) Resistance to * Energy Absorption (Tamed the sword Enma, which drains
    its user''s Haki with a few uses) * Cold Temperatures (Danced half-naked every
    day for 5 years despite the cold weather and showed no signs of coldness) * Heat
    Manipulation (Withstood boiling oil temperature that exceeded 700 Degrees in his
    body for an entire hour, at the same time that he exerted force to lift the 9
    Scabbards) * Madness Manipulation, Mind Manipulation and Soul Manipulation with
    Willpower (Through sheer willpower they can resist losing their mind when absorbing
    shadows through the Kage Kage no Mi. Shadows belonging to strong willed people
    are difficult to control, allowing them to rebel against Moria''s pact which usually
    immediately submits a shadow to his supremacy and orders. Spiritual energy is
    contained within one''s soul/life; this energy is represented by the fighting
    power or the Haki itself. Those with strong souls, which are homologous to shadows,
    resist the effects of Brook''s soul manipulation) * Limited Power Nullification
    and Stamina Absorption (Scaling to other/lesser Haoshoku Haki users who can resist
    the effects of Seastone to different extents)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
