power_scale:
  tier:
    text: 5-C, Low 5-B with Armament Haki, higher with Strongest Techniques
    source_ids:
    - vsbattles-kozuki-oden-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Moon level (Whitebeard said that Ace was foolish thinking that he could
      beat someone who beat Oden, and Blackbeard, prior to eating his Devil Fruit,
      called Oden strong. Stronger than Rooftop Zoro using Enma, as he could use the
      sword's full power without having to stabilize his usage of Haki while wielding
      it188.362 Exatons), Small Planet level with Armament Haki (Prior to his prime,
      he traded blows with a no Buso Whitebeard, who called him dangerous, and he
      kept fighting with Gol D. Roger's crew for 3 days. Was equal to Post Mink Medicine
      Zoro unleashing Enma3.014 Zettatons), higher with Strongest Techniques (Made
      a big scar on Full Zoan Kaidou's chest and was about to kill him. Kaidou acknowledged
      him, alongside other legendary pirates, as one of the few capable of truly going
      toe-to-toe with him,One Piece Vol. 99 Chapter 1001 with Luffy only receiving
      the same acknowledgment after using Gear 2nd + Gear 3rd in conjunction with
      Conqueror's Haki InfusionOne Piece Vol. 103 Chapter 103712.056 Zettatons)
    source_ids:
    - vsbattles-kozuki-oden-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
