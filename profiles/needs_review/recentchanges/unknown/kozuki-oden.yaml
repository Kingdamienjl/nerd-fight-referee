  durability:
    text: Moon level (Prior to his prime, he took a Busoshoku Haki infused attack
      from Gol D. Roger and stood back up with minor injuries), Small Planet level
      with Armament Haki
    source_ids:
    - vsbattles-kozuki-oden-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (He fought for 3 days without stopping in the battle against
      Gol D. Roger and his crew. Superior to characters who can battle non-stop for
      10 full days. He was able to spend 3 days and 3 nights being dragged by a ship
      while he had only one rope for support, even after being attacked by sea monsters
      and facing storms, Oden did not release the rope at any time. At age 9, Oden
      faced an entire Yakuza gang alone. Oden conquered the Kuri region after defeating
      an entire army of hundreds of bandits, including Ashura Doji, even though he
      was alone. As a testament to his monsterous strength and endurance, Oden was
      able to hold up all nine of his retainers, each who are very large, on a thick
      wooden plank while his lower half was submerged for an extended period of time
      in a large pot of boiling oil, which killed an average man in seconds despite
      getting out. He survived being boiled alive in oil while the temperature continued
      to increase to over 700 degrees of heat for almost over an hour, a feat no one
      has managed before. Despite this, Oden could still muster the strength to throw
      all nine of his retainers a great distance away from the execution site and
      was still alive while his body was on fire until Kaido shot him in the head,
      with Oden smiling while his body sunk into the sizzling oil)
    source_ids:
    - vsbattles-kozuki-oden-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range, Hundreds of Meters with Ranged Slashes (Cut the Mountain
      God in half with Togen Shirataki)
    source_ids:
    - vsbattles-kozuki-oden-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: At least Above Average (He is a genius of Bushido's art, being comparable
      to swordsmen and warriors considered legends. As a member of royalty he is able
      to read and write the ancestral language. He's been a master at using Haki since
      he was young)
    source_ids:
    - vsbattles-kozuki-oden-unknown
    confidence: 0.6
    notes: auto_repair source extraction
