    Yakuza gang alone. Oden conquered the Kuri region after defeating an entire army
    of hundreds of bandits, including Ashura Doji, even though he was alone. As a
    testament to his monsterous strength and endurance, Oden was able to hold up all
    nine of his retainers, each who are very large, on a thick wooden plank while
    his lower half was submerged for an extended period of time in a large pot of
    boiling oil, which killed an average man in seconds despite getting out. He survived
    being boiled alive in oil while the temperature continued to increase to over
    700 degrees of heat for almost over an hour, a feat no one has managed before.
    Despite this, Oden could still muster the strength to throw all nine of his retainers
    a great distance away from the execution site and was still alive while his body
    was on fire until Kaido shot him in the head, with Oden smiling while his body
    sunk into the sizzling oil)
