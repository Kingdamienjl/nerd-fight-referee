        blacksmith Shimotsuki Kouzaburou, Enma is among the best swords in the world.
        Enma was seen as an extremely difficult sword to handle, with Oden being the
        only one to have tamed it. This is due to Enma''s distinctive quality of extracting
        Ryuo (Armament Haki) from its user in excessive quantities, forcing attacks
        much more powerful than intended., Ame no Habakiri: As a masterpiece by Tenguyama
        Hitetsu, one of Wano''s greatest blacksmiths and one of 21 O Wazamono, Ame
        no Habakiri is an extremely powerful sword comparable to Enma. According to
        the creator, it can "cut through even the heavens".'
      source_id: mediawiki-4106167
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: At least Above Average (He is a genius of Bushido's art, being comparable
        to swordsmen and warriors considered legends. As a member of royalty he is
        able to read and write the ancestral language. He's been a master at using
        Haki since he was young)
      source_id: mediawiki-4106167
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: "Standard Haki Weaknesses Notable Attacks/Techniques, Oden had the ability\
        \ to hear the \"Voice of All Things\", which his son also inherited. On the\
        \ trip to Fish-Man Island, he could hear the voices of the Sea Kings alongside\
        \ Roger, Haki (\u8987 \u6C17): Haki is a latent power in any living thing\
        \ in One Piece. It basically consists of three types: The Armament Haki, Observation\
        \ Haki and the Conqueror's Haki (Conqueror's Haki is only exclusive for some\
        \ special individuals, something Oden is). Oden was one of the very small\
        \ number of people in the world who could use all three types of Haki. His\
        \ Haki was so powerful that he could easily wield the sword Enma, Armament\
        \ Haki (\u6B66\u88C5\u8272\u306E\u8987\u6C17 Bus\u014Dshoku Haki): Oden was\
        \ an extremely powerful master of Armament Haki, despite its dangerous Haki-draining\
        \ properties, the Nine Red Scabbards' Leader feared, displaying his supreme\
        \ mastery compared to Zoro whose entire arm was emaciated after a single slash\
        \ wielding Enma. Even at age 18, Oden was masterful in using Armament Haki,\
        \ Oden hardened his swords and then clashed against one of the 12 Saijo O\
        \ Wazamono, an immensely powerful Armament Haki master in his own right. A\
        \ true testament to his prowess, at age 39, giving him a permanent scar whereas\
        \ Luffy using Boundman couldn't even damage him., Observation Haki (\u898B\
        \u805E\u8272\u306E\u8987\u6C17 Kenbun-shoku no Haki): This haki works similarly\
        \ to a sensor, this haki provides the user with the ability to even see the\
        \ future., Conqueror's Haki (\u8987\u738B\u8272\u306E\u8987\u6C17 Ha\u014D\
        -shoku no Haki): Oden possessed the ability to use Conqueror's Haki, a very\
        \ rare type of Haki whose users are said to have the qualities of a king.\
        \ In his initial encounter with Edward Newgate 30 years ago, Oden uses its\
        \ more common effect at least once, Oden Nitoryu (Oden's Two Sword-Syle):\
        \ Oden was an immensely skilled and powerful swordsman, which Oden himself\
        \ called as Oden Nitoryu. He had immense prowess and ambidexterity in dual-wielding\
        \ the legendary swords, Enma and Ame no Habakiri., Togen Shirataki (Paradise\
        \ White Waterfall): Oden hardens both his swords using Armament Haki and then\
        \ delivers a diagonal slash with each one of them at the same time. This technique\
        \ has immense power and range, Oden not only imbues his swords' blade, Shimi\
        \ Daikon (Great Spirit of Samurai): Oden imbues his swords with an extra amount\
        \ of Armament Haki, then charges the opponent with the swords crossed behind\
        \ his own head, then uncrosses them in a single motion, eventually unleashing\
        \ the Armament Haki and cutting into them at once. Each sword wears a long\
        \ Armament Haki blade extension as a result of this technique., Oden crosses\
        \ his swords and charges forward, Togen Totsuka (Paradise Ten Hands): Oden\
        \ hardens his swords using Armament Haki, then leaps toward his opponent,\
        \ Togen Totsuka"
      source_id: mediawiki-4106167
