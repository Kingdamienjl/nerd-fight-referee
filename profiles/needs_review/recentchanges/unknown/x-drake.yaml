        what he had previously heard about Luffy from Koby in order to convince Luffy
        that he was on his side. He is also an incredibly skilled fighter who easily
        defeated 5 samurai at Amigasa village and quickly rose through the ranks of
        the Beast Pirates to become one of the Tobiroppo in no more than 2 years.
