  intelligence:
    text: Gifted (He possesses a deep understanding of the workings of the World Government,
      being aware of the Pacifista and Vegapunk. He successfully went undercover as
      a pirate captain and founded his own crew for an unknown purpose, before infiltrating
      the Beasts Pirates and being unexposed for up to 2 years. After he defected
      from the Beasts Pirates, Drake quickly took advantage of what he had previously
      heard about Luffy from Koby in order to convince Luffy that he was on his side.
      He is also an incredibly skilled fighter who easily defeated 5 samurai at Amigasa
      village and quickly rose through the ranks of the Beast Pirates to become one
      of the Tobiroppo in no more than 2 years. He was able to discover one of the
      Oto Oto no Mi's weaknesses (in that its sound attacks could be dodged if one
      was faster than Apoo's eyesight, as Apoo can only attack targets that he can
      see) and use it to match Scratchmen Apoo in an offscreen fight.)
