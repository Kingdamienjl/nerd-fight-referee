- id: claim-weaknesses-5032ecaf
  section: weaknesses
  axis: weakness
  text: "Weak against Fighting, Bug, and Fairy type attacks | Absol can only access\
    \ their Mega Evolutionary stage through physical possession of a specific Mega\
    \ Stone type that is uniquely attuned to that species and resonating the Stone\
    \ with an accompanying Mega Ring (or similar device containing a Key Stone), which\
    \ can only be constructed by artificial means: this excludes most wild specimens\
    \ from harnessing the innate evolutionary potential, leaving only individuals\
    \ in captivity as probable candidates for Mega Evolution. Mega Evolution is not\
    \ a permanent transformation; specimens immediately revert back to their \"base\"\
    \ forms once combat has been successfully concluded Notable Attacks/Techniques\
    \ * Pressure: Absol's primary special ability. Most Absol can either reflexively\
    \ or consciously exert an intangible field of supernaturally oppressive force\
    \ in combat situations, which forces opponents to exert twice as much stamina\
    \ in technique and/or m\xEAl\xE9e performance for the duration of the field's\
    \ presence on the battlefield. The field's effects should only be applicable to\
    \ organisms or entities up to (and not at or beyond) the level of Legendary Pok\xE9\
    mon. * Super Luck: Absol's secondary special ability. Many other Absol possess\
    \ a (presumably) genetic abnormality that results in a noticeable, uncontrollable\
    \ and entirely positive enhancement of probability exclusively to themselves,\
    \ enhancing the likelihood of inflicting critical damage with an attack, triggering\
    \ the side-effects of appropriate techniques much more often or simply heightening\
    \ the chance of self-beneficial events that are of a coincidental nature in occurring.\
    \ * Justified: Absol's hidden (tertiary) special ability. A select few Absol possess\
    \ spirits of such purity and valor that attacks composed of darkness and negative\
    \ energy, though still capable of inflicting physical trauma, actually serve to\
    \ enhance the offensive power of these specimens upon direct contact. * Magic\
    \ Bounce: Mega Absol's sole special ability. As a result of the Mega Evolution,\
    \ these Absol will passively manifest a mystical 'mirror' around their bodies\
    \ which reflects back any and all techniques at the user(s), under the sole condition\
    \ that they do not administer direct physical trauma as part of the"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
