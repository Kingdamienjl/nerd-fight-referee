        s criminal mark. Along with the ability to construct one, he is also shown\
        \ to be an expert at riding a Duel Runner, pulling off extremely dangerous\
        \ maneuvers on a regular basis. He was even able to reverse-engineer a Duel\
        \ Board simply from a detailed drawing. Yusei is also an adept teacher as\
        \ shown when he was helping Akiza get her Turbo Dueling License. He is a skilled\
        \ fighter, as evident from how effortlessly he knocked out two of Goodwin's\
        \ security guards, and is street smart enough to consistently evade capture\
        \ Sector Security, He\u2019s also an expert in physics, eventually over his\
        \ parents' job as head of overseeing the completion of the Ener-D Reactor\
        \ and even building the Fortune program to prevent the Meklord Emperor Genocide.\
