  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Will Empowerment, Supernatural Willpower\
    \ (Held on to her existence for an entire week after the Antispiral was killed.\
    \ Kept hanging on during the Anti-Spiral war, so that the spiral race wouldn't\
    \ be annihilated), Weapon Mastery, Spiral Power, Reactive Evolution (Spiral Power\
    \ is effectively the power of evolution itself, whether biological or cosmic.\
    \ As a Spiral being is pushed further to their limits and retains their fighting\
    \ spirit, they will inevitably grow increasingly stronger, and more capable of\
    \ handling the threat before them), Multiple Selves (Type 1. Anti-Spiral genes\
    \ were implanted within her, becoming active whenever the population on Earth\
    \ reached one million people. This would cause her to switch personalities, and\
    \ become Messenger Nia, who's only intentions are to help Antispiral in his plan\
    \ to inflict absolute despair) Same as before, Physical Combat (Easily dominated\
    \ Viral in a fist fight, in prison), Instinctive Reaction (Dodged Yoko's bullet,\
    \ seemingly without any knowledge of her presence), Energy Projection (Can shoot\
    \ lasers, similar to the Antispiral's own lasers), Flight, Teleportation, Dimensional\
    \ Travel, Portal Creation and Limited Space-Time Manipulation (Teleportation works\
    \ by recognizing beings or objects and can instantly jump by thinking about it.\
    \ Shown to be able to teleport instantly. Can travel through dimensions with portals.\
    \ Her teleportation was stated to twist time and space), Light Manipulation (Showed\
    \ Simon a projection of the moon crashing to the Earth), Technology Manipulation\
    \ (Projected a live broadcast onto all the screens of Kamina City) Electricity\
    \ Manipulation (Can manipulate any electric currents, that run through her body),\
    \ Regeneration Negation (Mid-Low. Nia made Viral incapable of regenerating the\
    \ damage he took from her), Self-Sustenance (Type 1), Non-Physical Interaction\
    \ and Enhanced Senses (In Antispiral's universe she was shown to be capable of\
    \ physically touching and seeing Antispiral; a being stated to be invisible to\
    \ humans), Limited Memory Manipulation and Regeneration (Low-Mid. Was desperately\
    \ trying to regenerate, while Antispiral was examining her, by wrapping her memory\
    \ around her. Regenerated from her belly, her breasts, her neck, and her face\
    \ disappearing. Regenerated her entire body seemingly instantly, after becoming\
    \ free of Antispiral), Information Manipulation (Can plant false information),\
    \ Limited Explosion Manipulation, Limited Deconstruction (She is composed of the\
    \ same energy blocks as the Mugann. After being damaged, she deconstructs into\
    \ explosive blocks), Resistance to Electricity Manipulation and Paralysis Inducement\
    \ (Remained unaffected by a blitzkrieg, which paralyze an opponent's actions),\
    \ Pain Manipulation (Could move her arms, which were severed), Information Analysis\
    \ (Can prevent others from reading her information, by creating false information)\
    \ and Existence Erasure via Regeneration (Continuously regenerated from Antispiral\
    \ analyzing her. Was supposed to disappear along with Antispiral right after his\
    \ death, but kept regenerating her body until she reached her regeneration\u2019\
    s limit) Same as before except Limited Explosion Manipulation, Limited Deconstruction;\
    \ Acrobatics, Piloting, Invulnerability, Spaceflight, Aura, Weapon Creation, Reality\
    \ Warping, Creation, Physics Manipulation, Matter Manipulation, Shapeshifting,\
    \ Transmutation, Size Manipulation, Biological Manipulation, Body Control (Capable\
    \ of creating and changing her mecha with just thought), Probability Manipulation,\
    \ Space-Time Manipulation via powerscaling (Scales to TTGL, which created a space-time\
    \ fold just from its battle with Granzeboma), Large Size (Type 7), Durability\
    \ Negation via Probability Manipulation (Can negate the probability of an opponent\
    \ successfully blocking an attack), Incorporeality, Abstract Existence (Type 1),\
    \ Self-Sustenance (Types 1, 2 & 3), Regeneration (Low-Godly. Her body had become\
    \ a materialized thought, and can reform her body with just thought), Immortality\
    \ (Type 3), Higher-Dimensional Existence, Acausality (Types 2 & 4. Scales to Tengen\
    \ Toppa Gurren Lagann; the ultimate evolution of Gurren Lagann, which merged every\
    \ version of itself upon integrating the Multiverse. Stated to have broken through\
    \ cause, effect and fate. It is said, that even when trapped, their feelings open\
    \ the gate, and they will decide their own fate), likely Nigh-Omniscience Resistances=Resistance\
    \ to Gravity Manipulation, Radiation Manipulation (Much more powerful than the\
    \ space gunmen, who could fight for lengthy periods of time within the ultra-dense\
    \ space), Spatial Manipulation, Time Manipulation via powerscaling (Scales to\
