  text: "---- === Holy Power === ---- center|600x600px , also called the , , , , ,\
    \ The and the , is the manifestation of ///// and . It represents the \u201CSource\
    \ of All Life,\u201D the essence of evolution, vitality, and goodness in the Digital\
    \ World. Every Digimon possesses some degree of Holy Power, for it is the foundation\
    \ that allows them to exist and evolve. The so-called are those with exceptionally\
    \ high amounts of Holy Power. They wield it actively, often as a duty, to banish\
    \ evil and suppress the Darkness. Among them, Digimon of the , specially the group,\
    \ are very notable, they are Digimon guided by an innate sense of justice to oppose\
    \ corruption and evil forces with their . While some Digimon embody this power\
    \ more clearly, Holy Power exists universally, it is the natural life-force within\
    \ all Digimon, though only some are driven by the \u201CWill of Justice\u201D\
    \ to use it against darkness. When invoked as a Digisoul, Holy Power manifests\
    \ as a === Dark Power === ---- center|600x600px , also called the , , , and \"\
    The , is the control over ////, , and , being the dark feelings that all beings\
    \ possess, as well as the inevitable death that all things go through. Unlike\
    \ Light, which nurtures life, Darkness reflects nothingness, the lack of evolution,\
    \ movement and growth. Some Digimon harness it to spread destruction, erasure\
    \ and overwhelming despair. Just as all Digimon possess Holy Power, they also\
    \ carry within them some level of Dark Power. However, in most, it is restrained\
    \ and balanced by their Light. Those who surrender themselves to Darkness become\
    \ known as Dark Digimon, often driven by viral impulses and destructive urges.\
    \ The most known group that uses Dark Power are the , the army of the Dark Area,\
    \ with Digimon also commonly harnessing Dark Power When invoked as a Digisoul,\
    \ Dark Power manifests as a == Universal Energy System == All Digicore's contain\
    \ the Strength Calibrator, which controls and allocates strength to all statistics\
    \ and special abilities with its respective Digimon. The Strength Calibrator is\
    \ entirely dependent on how much Data is available to it, which determines the\
    \ overall strength of a Digimon's capabilities. This Data being also the source\
    \ for all of techniques/abilities that a Digimon uses.Digimon Chronicle 1.0 BookletDigital\
    \ Monster - Artbook Ver.1\uFF5E5&20th Also shown by how absorbing the Data of\
    \ others makes them stronger and gives them the powers/abilities of the ones absorbed.Digimon\
    \ Story WebsiteDigimon Tamers Episode 2 \"You are my Friend Introducing Terriermon!\"\
    Digimon Tamers Episode 13 \"The Order to Capture Digimon! The Premonition of Disaster\"\
    Digimon Tamers Episode 3 \"Renamon vs Guilmon! Battle is a Digimon's LifeDigimon\
    \ Hyper Colosseum St-344Digimon Frontier Episode 1 \"The Legendary Warrior! Agnimon\
    \ of Flame\"Digimon Frontier Episode 13 \"Awaken Seraphimon! The Secret of The\
    \ Ten Legendary Warriors\"Digimon Frontier Episode 14 \"Thunder! Even Rock Breaks!\
    \ Bolgmon's Do-or-Die Challenge\"Digimon Frontier Episode 20 \"Mysterious Warrior\
    \ Lurking in the Darkness, Duskmon!\"Digimon Frontier Episode 28 \"Takuya's Fusion\
    \ Evolution, Aldamon's Explosive Attack!\"Digimon Frontier Episode 36 \"Fly Towards\
    \ Victory! Confrontation at Cherubimon's Castle\"Digimon Frontier Episode 37 \"\
    Decisive Battle! As long as there's Life, Get Back The Digital World\"Digimon\
    \ Frontier Episode 39 \"This is the Digital World?! Escape from the Moon\"Digimon\
    \ Frontier Episode 40 \"The Chosen Ones!? The Children who Manipulate Angemon!\"\
    Digimon Frontier Episode 41 \"Don't Let Them Scan! The Beanstalk of Friendship\"\
    Digimon Frontier Episode 42 \"Protect the DigiTama! The Miracle of Disappearing\
    \ Life\"Digimon Frontier Episode 43 \"Annihilation of the Hometown! Messenger\
    \ of Hell Skull Satamon\"Digimon Frontier Episode 48 \"Light and Darkness are\
    \ One! Kouichi's Last Wish\"Digimon Frontier Episode 48 \"Light and Darkness are\
    \ One! Kouichi's Last Wish\"Digimon Xros Wars Episode 17 \"Miraculous Digi Xros!\
    \ Shoutmon X5 Flies!\"Digimon Adventure (2020) Episode 21 \"The Tide-Turning Update\"\
    Digimon Adventure (2020) Episode 22 \"The Unbeatable Blue Sagittarius\"Digimon\
    \ Adventure (2020) Episode 36 \"Operation Satellite Sniper\"Chiaki J. Konaka TwitterDigimon\
    \ Jintrix 3-009Digimon Adventure V-Tamer 01 Chapter 34 \"VS Omegamon \u2460, DEAD\
    \ OR ALIVE\" Holy/Dark Data also shows this, the more powerful the Light/Darkness,\
    \ the stronger their users become. Channeling them in all of their techniques,\
    \ be it physical attacks or energy beamsDigimon Hyper Colosseum Bo-953Digimon\
    \ Battle Terminal DM02-022Digimon Reference Book: Lady DevimonDigimon Hyper Colosseum\
    \ Bo-677 == Potency == Data is what all of existence is made of, with Light and\
    \ Darkness being what formed and defined all of existence, and Darkness being\
    \ able to affect all worlds. Distortions to Data are able to directly affected/destroy\
    \ the Quantum Sea, the primordial world that which all others emerged, with alterations\
    \ to it affecting all other worlds. The manipulation of Data should thus at bare\
    \ minimum scale to the scope of every worl"
