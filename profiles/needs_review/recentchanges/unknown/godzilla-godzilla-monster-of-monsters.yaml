  attack_potency:
    text: At least Multi-City Block level+ physically (Based off Showa Godzilla, this
      Godzilla stands 50 meters tall and can crush "rocky mountains" almost as big
      as him, Can smash through a large metal wall blocking his path and hurt other
      kaiju capable of withstanding his Atomic Breath), higher with Atomic Breath
      (His atomic breath is strong enough to destroy and pulverize/vaporize tanks,
      other similar vehicles and rocky mountains almost as big as him. Able to destroy
      the aforementioned metal wall with his Atomic Breath as well)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Subsonic travel speed (Capable of clearing distances as vast as he is big
      in seconds) with at least Supersonic+ reaction and combat speed (Can intercept,
      redirect and dodge projectiles ranging from tank shells and missiles from jets
      to Ghidora's Gravity Rays, as well as fight monsters faster than him)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At least Class M (Based on his size and weight), possibly higher (Able to
      perfectly move and jump around on other planets from the Solar System with greater
