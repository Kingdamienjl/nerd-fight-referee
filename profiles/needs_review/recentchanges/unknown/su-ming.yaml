    can affect directly the Principles of Life and the matrix that guides one life),
    Death Manipulation (Via Seven Abyssal Yin Death Seal and Grass Knots Art), Time
    Manipulation (Can reverse or accelerate time with Destiny; can loop a target between
    the past and the future to constantly attack them), likely Fate Manipulation (Via
    Pressing Down and Seizing) and Law Manipulation (Via Pressing Down and Seizing)
    (Since it can change the governing laws of the world and affect the fate of the
    life to show a transformation of a degree that could turn the world upside down),
    Creation (Via Pressing Down and Seizing), Curse Manipulation (Via Grass Knots
    Art; can insert curses within a target by touching them reducing them to a state
    of being alive and dead, a living dead person; via Candle's Dragon Curse), Power
    Mimicry (Via Nine Transformations), Transformation (Via Destiny), Teleportation
    (Via Relocation Rune and Nascent Divinity), Dimensional Travel (Via Black Stone
    Fragment, Su Ming can hide in the Dimension within it), Statistics Amplification
    (Via Provenance of Wind), Danmaku (Can create endless bolts of lightning), Regeneration-Negation
    (By sending the power of Curse through his attacks, Su Ming can negate the regeneration
