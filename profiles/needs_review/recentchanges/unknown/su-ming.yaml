    Ice Aura (His body emits an aura of ice that will cover the surrounding in ice),
    Resistance to Madness Manipulation (Type 2. Resisted sound that could induce madness
    in those that heard it) Half-Life Cultivation, Shapeshifting (Can transform in
    the Candle Dragon), Large Size (Type 3 as the Candle Dragon which is 3048m long),
    Summoning (Can summon his statue of God of Berserker which is 3048m tall being
    in his form with all his abilities), Statistics Amplification (By fusing with
    his statue of God of Berserkers)
