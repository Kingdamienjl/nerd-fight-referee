    \ Spear (A magic spear that can summon a black eagle to attack), Virescent Sword\
    \ (The Sword has a presence strong enough that it can crumble souls), Black Mask\
    \ (A mask that once worn will change one presence making him seem like he's not\
    \ there, making his hard to be noticed), Wings of the Moon (Souls of the fallen\
    \ Fire Berserkers which are non-corporal) He Feng (A spiritual entity that can\
    \ fight, become one with the shadows and transform in the people the eats), White\
    \ Scale (A scale the size of a fingernail that has the power of a Bone Sacrifice\
    \ cultivator for one attack), Han Mountain Bell (An artifact that can be used\
    \ to attack and defend using it), Fire within Ice (A gift granted to Su Ming from\
    \ his Eldest Senior Brother which can be used for an attack that will instantly\
    \ seal a target within ice and then burn it to ash) Power of God of Berserkers\
    \ (As Su Ming received the inheritance of Lightning and Wind Berserker, he also\
    \ got two use of its full power which can destroy the Heaven and Earth - God of\
    \ Berserkers, Lie Shan Xiu), Sea Marrow Drop (A drop of mystic water that once\
    \ ingested will instantly recover the body, healing and recuperating the stamina),\
    \ Unique Feather (A magic feather that looks normal but it can even block the\
    \ Divine Sense property of information detecting), Black Wooden Club (A club so\
    \ heavy that even the punching bag which is a pocket dimension can't store it;\
    \ it can also increase in size and weight), Poison Corpse (A body of a dead cultivator\
    \ who was changed and become poison itself), Divine General Armor of Berserker\
    \ Soul (A purple armor that possesses no defensive properties but it becomes stronger\
    \ the more blood and killing there is; it possesses a strong KI that can affect\
    \ even Berserker Soul cultivators), Undertaker\u2019s of Evil Spear (A spear from\
    \ the World of Nine Yin. It contains a powerful aura that will cause a frenzied\
    \ fear), Welcoming the Deities (A pill created by Su Ming. It has two uses: internal\
    \ one that could contain his Nascent Divinity and change into various forms, just\
    \ like a clone while its external functions is the ability to sense and forcefully\
    \ absorb souls. Then he can swallow the fill and turn into the soul absorbed and\
    \ with his will, he could bring out the power of the soul) Nothing new Optional"
