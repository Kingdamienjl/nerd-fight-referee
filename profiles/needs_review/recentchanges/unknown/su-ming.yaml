    could control moonlightPursuit Of Truth chapter 39Pursuit Of Truth chapter 93,
    and use it to heal minor injuriesPursuit Of Truth chapter 98 or destroy illusory
    Berserker MarksPursuit Of Truth chapter 94) Awakening Cultivation, Power Mimicry
    (Can copy others skills and even create a counter for them at the same time),
    Vibration Manipulation (His casual steps can cause earthquakes), Weather Manipulation
    (With his Creations), Subjective Reality (Via World Picture Creation and Berserker
