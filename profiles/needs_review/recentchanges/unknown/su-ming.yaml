- id: claim-weaknesses-b951f179
  section: weaknesses
  axis: weakness
  text: "None notable Notable Attacks & Techniques: *Spirit Devourer: A technique\
    \ that needs preparations. Using a fresh animal carcass, a Berserker gather their\
    \ Berserker Blood and use it to sense the Spirit of the deceased animal and bring\
    \ it out to increase their own strength temporarily. *Dark Blood Dust: Gathers\
    \ a drop of Berserker Blood within the body and allows the caster to obtain an\
    \ astonishing burst of strength for a short period of time. At its peak, it will\
    \ also be used to manipulate fire. *Execution of Three Evils: Between Heaven and\
    \ Earth exist three forces - Severing, Beginning and Nurture. Sever is known as\
    \ the evil of theft, Beginning as the evil of disaster, and Nurture as the evil\
    \ of time. The three evil always existed in the world but they had no form. No\
    \ one can see them, neither could they touch them. **Evil of Theft (Sever) - can\
    \ cut through space. It can also cut the evil desire within people to stop them\
    \ fighting **Evil of Disaster (Beginning) - can change the pattern governing the\
    \ desire to kill. It will make skills and divine abilities to miss or hit other\
    \ targets. **Evil of Time (Nurture) - once cut, it will accelerate the state of\
    \ the wounds on a person. *Branding Art: A strange technique that creates a special\
    \ zone that has a circumference of 609.6 meters that will make all things appear\
    \ in the user mind. It can also be used to contract and shrank the area to hurt/attack\
    \ the soul of those within its range. Branding Art can also be used to brand an\
    \ imprint into someone's body and it will fuse with it. A thought will be enough\
    \ to kill the branded character. **Once he reached the Awakening realm, his range\
    \ increase dramatically, letting him cover half of the Han Mountain which is 61km\
    \ tall and at least 10km wide. *Berserker Mark: Su Ming's Mark is the Mountain\
    \ Mark - Dark Mountain which contains the Dark Mountain, the village, and all\
    \ its villagers within it. At full completion, the Red Moon will appear behind\
    \ it. **After Su Ming reached Awakening, he added snow onto the Mountain. **In\
    \ Awakening Kei as a Mid-stage just by using it, Su Ming can fight with a later\
    \ stage. *World Picture Creation: Su Ming's first Creation, Picture of Creation\
    \ that he comprehends in his first serendipitous state. With the sky as the board\
    \ and the people as paper, he can draw a line through 7 people. It contains enough\
    \ power that its permeating abilities will spread through several papers, with\
    \ the first paper containing the bigger stain, and the last the weakest. An art\
    \ that let Su Ming treat the world as a board while his fingers are a paintbrush.\
    \ The characters will be crushed by the world, being rejected by the world itself.\
    \ *Berserker Obliteration: An abstract technique which will create a line that\
    \ will turn those before it in a sheet of paper for Su Ming to draw. It will change\
    \ the weather, the wind and cloud will tumble backward and the target will be\
    \ cut in two parts which then will turn in red gusts of smoke before disappearing\
    \ into nothing. It can also cute through space. *Wind Separation: Wind exists\
    \ in all parts of the world, but if you can separate the wind from a particular\
    \ region, thereby causing the wind to no longer exists in that region, then you\
    \ can become the lord of that region. Without wind, there is no aura, and without\
    \ aura, there is no power. When the power of the world is sealed within when all\
    \ manner of aura no longer exists, then from then on, the place where you are\
    \ will be a forbidden area for all lives, and that is Wind Separation. **Sun Genesis\
    \ \u2013 Wind Borrowing - it will collect and control all wind, clouds from several\
    \ hundreds of li around the user to create a Black Wind Dragon whose presence\
    \ will freeze the Qi and make it flow backward and scatter away. **Lunar Burial\
    \ - A hot wave of air will appear turning into a cyclone that contains great heat,\
    \ at the same time a gigantic whirlwind will form in the sky which contains a\
    \ freezing chill. A gust of wind that will bury life, as the body will rapidly\
    \ dry up and their life force will fly out of them. *Nine Transformations, Ten\
    \ Transfigurations, One Voice: Transformation could be understood as a deeper\
    \ level of imitation. An imitation of an opponent\u2019s divine abilities and\
    \ Arts with the user\u2019s own power. Imitation was just a part of the Nine Transformations\
    \ Art. The true Transformation came from after the imitation. This divine ability\
    \ would start changing as if it was evolving, and the first, the second\u2026\
    \ and up to the ninth Transformation would happen! Each Transformation would cause\
    \ this Art\u2019s power increase to exponentially, but the power of cultivation\
    \ for it would also increase! *Destiny: A binary concept given form by Su Ming.\
    \ His palm symbolizes the past while the back of his hand represents the future.\
    \ The fusion between them will form the present. This art will fusion the past\
    \ and future to create the present. **Fusion of Destiny: First Form - once used\
    \ his past self (a baby) will appear and his future self (a man filled w"
