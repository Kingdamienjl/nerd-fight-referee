- id: claim-weaknesses-6486ad8e
  section: weaknesses
  axis: weakness
  text: 'Without his second layer of skin, Ghostfreak is extremely vulnerable to light,
    especially sunlight or any weapon/gun that fires as bright as a sunlight. A certain
    chemical can solidify Ghostfreak and completely negate his intangibility and invisibility.
    Feats: *Went intangible and had a battle with Kraab *Defeated the Circusfreak
    trio via possession and other ghostly powers *Defeated and scared the psychopath
    clown Zombozo Notable Attacks/Techniques: GFPossession.gif|Possession TentaclesGF.gif|Tentacles
    Invisibility GF.gif|Invisibility *Sharp Claws: Ghostfreak can use his sharp claws
    to harm enemies. *Teleporation: Ghostfreak can teleport to sneak attack enemies.
    *Possession: Ghostfreak can take over the bodies of others. Ben used it to take
    control of Darkstar and Zs''Skayr uses it to threaten to kill Gwen by making her
    jump off a building. ==Notable Matchups== Victories: Losses: Inconclusive: ==Notes/Explanations==
    Category:Characters Category:Ben 10 (Classic) Category:Aliens Category:Ben 10
    Aliens Category:Darkness Users Category:Energy Users Category:Flight Users Category:Ghosts
