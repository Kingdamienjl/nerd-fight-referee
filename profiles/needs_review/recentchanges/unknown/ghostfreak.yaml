    Users Category:Male Characters Category:Possession Users Category:Self-Sustenance
    Users Category:Soul Users Category:Telekinesis Users Category:Transformations
    (Ben 10) Category:Transmutation Users Category:Undead Category:Tentacle Users'
  source_ids: *id003
