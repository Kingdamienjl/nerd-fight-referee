- id: claim-weaknesses-940c0a99
  section: weaknesses
  axis: weakness
  text: 'Chiros was a destruction god on Kong Island who was sealed away by the Atlanteans
    and the original Kong using the Primal Stones of the elements. Chiros is heavily
    connected to the stones, which are the only thing keeping him from regaining his
    power and destroying the island. If the stones are removed from the island, he
    will return to power. The fewer stones on the island, the more power he has, but
    as long as one stone remains he will be unable to leave his temple. ==Notable
    Matchups== Victories: Losses: Inconclusive: ==References== Category:Characters
