      value: "Magic, Invulnerability to physical damage, Regeneration (High-Mid; Regenerated\
        \ from being almost reduced to ashes), Summoning (The reader can summon demons\
        \ from hell by citing the passages from the book), Possession (It can also\
        \ turn living people into its servants), Portal Creation, Teleportation via\
        \ portals, Space-Time Manipulation (It can open portal in spacetime and can\
        \ be used for time travel), BFR (Can send both people and objects through\
        \ space-time, to the Deadlands or \"Hell\"), Interdimensional Travel (Can\
        \ open portals to the Mirror Dimension, where The Dark Ones are imprisoned),\
        \ Resurrection (Through the proper incantations located in the book, a reader\
        \ can resurrect a deceased individual or even fully restore a corpse by repairing\
        \ disintegrated flesh and the allowing the original spirit to re-enter the\
        \ body. Resurrected Evil Ash, Its blood could reanimate Amanda Fisher as a\
        \ Deadite. Resurrected hundreds, if not thousands, of people at the start\
        \ of Ash vs Evil Dead), Power Bestowal (After being \"de-faced\", the Necronomicon\
        \ can transfer its powers and spells to a human being), Reality Warping (The\
        \ Necronomicon has displayed the ability to rewrite history or alter a predetermined\
        \ destiny. Is repeatedly implied to have this ability. Caused a Cabin to bleed,\
        \ and form eyes), Power Absorption (The Necronomicon demonstrated the ability\
        \ to take on the characteristics of a living creature that it has trapped\
        \ within its pages), Death Manipulation (The funerary incantations found within\
        \ the book can be used to help the spirits of the deceased move on to another\
        \ plane of existence), Sealing (Can seal demons, spirits, souls, Dark Ones\
        \ and various other beings within its passages), Earth Manipulation (When\
        \ using the book, Ruby opened up sink holes), Biological Manipulation (Ruby\
        \ created new forms of demons using the Necronomicon), Necromancy (Has raised\
        \ thousands of the dead), Power Nullification (Was able to nullify Baal's\
        \ abilities through a deal made by Ruby), Transmutation (Gave the Kandarian\
        \ Demon a physical form), Duplication (Duplicated Ash's body), Weather Manipulation,\
