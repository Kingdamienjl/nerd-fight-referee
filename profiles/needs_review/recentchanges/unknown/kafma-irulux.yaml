    - field: weaknesses
      value: "Some of his abilities hurt to use, leaving him exhausted in prolonged\
        \ fights. Notable Attacks/Techniques: *Insect Cage Clan Attacks: As a member\
        \ of the Insect Cage Clan, Kafma can masterfully use a variety of his Clan's\
        \ trademark attacks and weapons. Although he originally had 32, he now holds\
        \ a total of 33 different insects inside himself, each with unique abilities.\
        \ As the relationship between Kafma and his insects are meant to be symbiotic,\
        \ his insects typically require mana or lifeforce for the use of their power.\
        \ However, should those prove insufficient, they will begin to eat flesh and\
        \ blood instead. When being forced to use a vast quantity of insects to fire\
        \ off thorns, bullets of light, and blades of wind simultaneously over an\
        \ extended period of time without proper nourishment, he could feel the insects\
        \ eating away at him from the inside, causing him intense pain. It is also\
        \ possible to frighten the insects inside of him, preventing them from continuing\
        \ to devour him from the inside. However, it is unknown whether or not this\
        \ can affect Kafma's fighting strength. **Thorns: Kafma can skillfully fire\
        \ countless purple thorn-like insects towards his enemies with extreme precision\
        \ and speed, and the thorns can all be as long as a human arm. With this attack,\
        \ Kafma easily breaches the distance between him and his enemies, skewering\
        \ them before they have the chance to retaliate. Likewise, these thorns can\
        \ come attached to strong vines. Kafma can use these insects both to protect\
        \ people over a wide area and to grab onto multiple targets at once. He can\
        \ also create footholds for his allies with this ability. The vines are often\
        \ used in defense and support rather than for offense, though that doesn't\
        \ mean they can't be used for offense. In fact, when the vines charge at an\
        \ opponent, the pressure generated has been compared to an entire forest crashing\
        \ into an opponent. It even has enough binding strength to hold back a Dragon\
        \ of Valgren's level for a short period of time. This being said, as the thorns\
        \ are part of the insect, if they get damaged, it can hurt the insect, causing\
        \ them to scream out in pain, and as such there will be backlash. **Wings:\
        \ Kafma can sprout six insect wings that enable him to fly. By making his\
        \ speed vary with the movement of his wings, he can confuse his enemy by moving\
        \ in and out of their awareness. He can also unleash slashes from his wings.\
        \ **Ribs: By protruding his ribs from his body, the golden insect within can\
        \ create a powerful attack that can hollow out anything his ribs aimed at,\
        \ including the top of the reinforced walls of Lupugana's ramparts, and once\
        \ the attack is done, his ribs close again. This being said, the use of this\
        \ insect wears on Kafma's mind and body and is not meant for rapid firing.\
        \ **Carapaces: Kafma can generate black carapaces one his arms like gauntlets\
        \ and use them for self-protection like Garfiel's gauntlets. **Antennae: By\
        \ transforming his shoulder bones into red antennae, he can fire them off\
        \ like cannonballs that can send a transformed Garfiel flying backward. However,\
        \ doing this causes Kafma an intense amount of pain, as he needs to snap the\
        \ antennae off at the base to do this. **Other Insects: Among his collection\
        \ of insects, some of them allow him to fire off blades of wind and bullets\
        \ of light, among other abilities. **Insect Implantation: Aside from the technique\
        \ he uses to implant insect inside his own body, Kafma can force his target\
        \ to take an insect egg into their body through a special tube that he uses\
        \ in close combat. When fighting, this tube allows a white insect to implant\
        \ an egg through a wound that hatches inside the target's body. Since most\
        \ people\u2019s bodies are not capable of withstanding these insects, not\
        \ to mention the intense preparation time required for the body to be able\
        \ to adapt to their insect, it is not uncommon for his target to die in agony\
        \ as the insect transfigures its host. Likewise, healing magic is ineffective\
        \ against it as, while said magic can heal wounds, it cannot stop the transfiguration\
        \ caused by the insects. He typically avoids using this technique unless he\
        \ is forced to take his opponent down as quickly as possible. It is possible,\
        \ however, to burn the insects that were implanted in the target\u2019s body,\
        \ albeit at the risk of burning oneself. ***Pupa State: When Kafma decides\
        \ to take another insect into his body, he can put himself into a cocoon-like\
        \ state so that he can adapt to his new insect. It is unknown if this is inherent\
        \ to Kafma or something shared among all the Insect Cage Clan members. **Extra\
        \ Organ: Kafma has developed an extra organ, not as a result of a particular\
        \ insect but of the symbiosis between him and all of his insects. This organ\
        \ can be exposed by Kafma's chest opening up. Once exposed, it can be used\
        \ to send out a shockwave that is said to reduce any warrior into red mist.\
        \ ==Gallery== Kafma Design.png|Kafma Irulux's Design Olbartkafma.png|Re:Zero\
        \ Light Novel Volume 28 Illustration With"
