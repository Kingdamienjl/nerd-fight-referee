- id: claim-weaknesses-d085688d
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: As the one above all SpiritMasters,
    Kaisinel utilizes their abilities, and more with the exception of Archdaeva abilities
    such as "Transformation: Incarnation of Earth", "Compassion of Fire" and such
    powers. He can bring out his wings and use them as fairy-like Spirits, which he
    used to one-shot Tiamat. Kaisinel can also send out projectiles of energy, fire,
    wind, earth, water, lightning, and other elements, unlike ordinary Spiritmasters.
    Feats: Kills Tiamat with ease ==Notable Matchups== Victories: Losses: Inconclusive:
    Category:Characters Category:Protagonists Category:Demigods Category:Aion Category:Transformation
    Users Category:Shapeshifters Category:Illusionists Category:Fear Users Category:Summoners
