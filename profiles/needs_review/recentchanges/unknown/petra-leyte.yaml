        \ Camp Struggle she is able to recall most of the mansion's layout after playing\
        \ in it once. She learned everything her mother could teach her about cooking\
        \ within a month and a half. After arc 4 Petra improved enough that she could\
        \ handle almost every household related task by herself.Petra's birthday 2018,\
        \ Q&A Over the course of a year, she experienced the most growth among the\
        \ Emilia Camp members. Petra is stated to be a fast learner and her talent\
        \ is described as rare\u2014\"heaven only ganted to a select few\"\u2014and\
        \ she is the type of girl who can pretty much do anything and has talent in\
        \ lots of things.Re:Zero 10th Anniversary Soace Within the camp, she is especially\
        \ known for her intelligence alongside Otto, even being praised by Roswaal\
        \ as astute.Arc 8, Chapter 26, \"The Poison Princess\" Despite her origins\
        \ as a village girl, her education level reached that of a noble\u2019s child\
        \ who's been given proper training within a year. She demonstrated enough\
        \ knowledge of Lugunican and Vollachian history that she is seen as well as\
        \ well-read and studious Petra is regarded a geniusArc 9 Chapter 46:\"The\
        \ Witch of Tristitia\" by other geniuses such as Felt and she is regarded\
        \ as the smartest person Subaru knowsArc 9 Chapter 59: \"No\". Her plan to\
        \ thwart Aldebaran machinations, a time looper, was made in an instant and\
