        \ can merely burn her opponents. *Healing Magic: While she cannot use the\
        \ healing power of Water mana, Petra can use Yang Magic to cast useful healing\
        \ spells on herself or others, aiding in the recovery of injuries. Authority\
        \ of Tristitia: Compression: Petra is in possession of the Witch Factor of\
        \ Tristitia, allowing her to wield its Authority of Compression. This Authority\
        \ allows the wielder to compact feasibly achievable events in exchange for\
        \ sacrificing \"possibilities\": *Compression of Distance: By compressing\
        \ the distance between two locations, Petra can perform an instantaneous spatial\
        \ warp. This allows Petra to effectively teleport herself and her allies anywhere\
        \ she pleases without warning, and teleport her opponents into unfavorable\
        \ positions if caught off-guard. *Compression of Time: By compressing the\
        \ time needed for events to unfold, Petra can reduce the time needed to perform\
        \ complex actions to zero. This allows Petra to instantly communicate with\
        \ her allies by compressing discussion time, and act perfectly without hesitation\
        \ by compressing thinking time. *Compress Agony: By compressing her allies'\
        \ or her own pain, Petra can avoid being stunned or hesitant as a result of\
        \ the agony. As a drawback, this massively increases the agony due to experiencing\
        \ all of it in an instant. ==Notable Matchups== Victories: Losses: Inconclusive:\
