        \ arcane arts has been acknowledged by the magicians around her, such as Ram\
        \ and Emilia, and particularly by Roswaal L Mathers\u2014 the greatest magician\
        \ in the world. Petra is still a novice, however she has studied for a year\
        \ under Roswaal, and has developed useful techniques. *Yang Magic Enhancement:\
        \ Petra's magical affinity is for the rare Yang Attribute, which specializes\
        \ in enhancing its target's strength, speed, and toughness\u2014 in other\
        \ words, buffs. Petra has used her magic to enhance others' sense of hearing,\
        \ to raise their resilience to explosions, to multiply their sheer strength,\
        \ and to make up for her own lack of stamina. Her spells are also more stable\
        \ when cast on herself than others. *Jiwald: One of the rare offensive spells\
