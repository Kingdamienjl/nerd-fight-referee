    - field: standard_equipment
      value: "None Notable | Crimson Scorpion *Crimson Scorpion: The matured small\
        \ Crimson Scorpion which the Starkeeper Shaula was reduced to. After living\
        \ for more than four centuries, it mastered the use of Hell\u2019s Snipe,\
        \ evolving into a monster whose combat ability far surpasses that of ordinary\
        \ witchbeasts. Though inherently hostile toward anyone who would threaten\
        \ the Witch of Tristitia, it abides by her no-kill rule, usually limiting\
        \ the damage it inflicts to severing its opponents\u2019 legs. The Crimson\
        \ Scorpion remained beside the Witch for centuries because of a request entrusted\
        \ to it long ago by a friend of the Witch, who alone refused to forget her\
        \ after the world had abandoned her. Though that friend eventually passed\
        \ on, the Crimson Scorpion continued to accompany the Witch through the years\
        \ of solitude, staying by her side at all times as she guarded the Agzadd\
        \ Glacier and preventing her from fully becoming a calamity feared by the\
        \ world."
      source_id: mediawiki-4977592
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
