- id: claim-standard-equipment-d7d79cae
  section: equipment
  axis: equipment
  text: "None Notable | Crimson Scorpion *Crimson Scorpion: The matured small Crimson\
    \ Scorpion which the Starkeeper Shaula was reduced to. After living for more than\
    \ four centuries, it mastered the use of Hell\u2019s Snipe, evolving into a monster\
    \ whose combat ability far surpasses that of ordinary witchbeasts. Though inherently\
    \ hostile toward anyone who would threaten the Witch of Tristitia, it abides by\
    \ her no-kill rule, usually limiting the damage it inflicts to severing its opponents\u2019\
    \ legs. The Crimson Scorpion remained beside the Witch for centuries because of\
    \ a request entrusted to it long ago by a friend of the Witch, who alone refused\
    \ to forget her after the world had abandoned her. Though that friend eventually\
    \ passed on, the Crimson Scorpion continued to accompany the Witch through the\
    \ years of solitude, staying by her side at all times as she guarded the Agzadd\
    \ Glacier and preventing her from fully becoming a calamity feared by the world."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-7d4a6ec9
  section: power_scale
  axis: battle_iq
  text: "Genius | Extraordinary Genius Petra has a good memory,Petra's Emilia Camp\
    \ Struggle she is able to recall most of the mansion's layout after playing in\
    \ it once. She learned everything her mother could teach her about cooking within\
    \ a month and a half. After arc 4 Petra improved enough that she could handle\
    \ almost every household related task by herself.Petra's birthday 2018, Q&A Over\
    \ the course of a year, she experienced the most growth among the Emilia Camp\
    \ members. Petra is stated to be a fast learner and her talent is described as\
    \ rare\u2014\"heaven only ganted to a select few\"\u2014and she is the type of\
    \ girl who can pretty much do anything and has talent in lots of things.Re:Zero\
    \ 10th Anniversary Soace Within the camp, she is especially known for her intelligence\
    \ alongside Otto, even being praised by Roswaal as astute.Arc 8, Chapter 26, \"\
    The Poison Princess\" Despite her origins as a village girl, her education level\
    \ reached that of a noble\u2019s child who's been given proper training within\
    \ a year. She demonstrated enough knowledge of Lugunican and Vollachian history\
    \ that she is seen as well as well-read and studious Petra is regarded a geniusArc\
    \ 9 Chapter 46:\"The Witch of Tristitia\" by other geniuses such as Felt and she\
    \ is regarded as the smartest person Subaru knowsArc 9 Chapter 59: \"No\". Her\
    \ plan to thwart Aldebaran machinations, a time looper, was made in an instant\
    \ and she had successfully carried it out with only one chance against someone\
    \ who could retry a billion timesArc 9 Interlude: \"Weave\") The Witch of Tristia\
    \ is capable of flight magic, which is a spell that even the best magicians of\
    \ the world cannot useTanpenshuu 14: Pristella reconstruction Journals. Even though\
    \ they can perform simultaneous usage of multiple spells of different element\
    \ which practically requires multiple brains to performArc 9 Chapter 52: \"Aldebaran\
    \ I\" which is superior to casting several spells of the same element and even\
    \ that is a feat akin to taking a pen in each hand and writing an essay with one\
    \ hand while drawing an illustration with the other. Through her own intelligence\
    \ she found new ways to apply Compression creatively and became a \"broken\" witch\
    \ capable of fighting evenly or superior against anyone. Plotting is ineffective\
    \ against the Witch\u2014 she has more time than anyone else to think and everyone\
    \ is less intelligent than she is. The Witch can learn new skills, acquire knowledge,\
    \ and absorb as much information as she wants in an instant via Compression)"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-1735c65d
  section: weaknesses
  axis: weakness
  text: "Yang magic is heavily susceptible to the caster\u2019s mental state, mana\
    \ usage, and various other factors. Petra's Yang Magic is unstable when used on\
    \ others. | As a result of overusing the Witch Factor of Tristitia, Petra sacrificed\
    \ many \"possibilities\": {| class=\"mw-collapsible mw-collapsed\" align=\"center\"\
    \ border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width:100%\" | colspan=\"\
    2\" style=\"text-align: center; background-color: #000000; color: #ffffff\" |The\
    \ Witch of Tristitia's Sacrifices |- | |} Notable Attacks/Techniques: Magic: Despite\
    \ her young age, Petra's talent for the arcane arts has been acknowledged by the\
    \ magicians around her, such as Ram and Emilia, and particularly by Roswaal L\
    \ Mathers\u2014 the greatest magician in the world. Petra is still a novice, however\
    \ she has studied for a year under Roswaal, and has developed useful techniques.\
    \ *Yang Magic Enhancement: Petra's magical affinity is for the rare Yang Attribute,\
    \ which specializes in enhancing its target's strength, speed, and toughness\u2014\
    \ in other words, buffs. Petra has used her magic to enhance others' sense of\
    \ hearing, to raise their resilience to explosions, to multiply their sheer strength,\
    \ and to make up for her own lack of stamina. Her spells are also more stable\
    \ when cast on herself than others. *Jiwald: One of the rare offensive spells\
    \ of the Yang Attribute, this is the lowest class of Jiwald which allows the caster\
    \ to fire a ray of heated light from their fingertips. When used by a master,\
    \ this spell can vaporize flesh and stone, however Petra's Jiwald can merely burn\
    \ her opponents. *Healing Magic: While she cannot use the healing power of Water\
    \ mana, Petra can use Yang Magic to cast useful healing spells on herself or others,\
    \ aiding in the recovery of injuries. Authority of Tristitia: Compression: Petra\
    \ is in possession of the Witch Factor of Tristitia, allowing her to wield its\
    \ Authority of Compression. This Authority allows the wielder to compact feasibly\
    \ achievable events in exchange for sacrificing \"possibilities\": *Compression\
    \ of Distance: By compressing the distance between two locations, Petra can perform\
    \ an instantaneous spatial warp. This allows Petra to effectively teleport herself\
    \ and her allies anywhere she pleases without warning, and teleport her opponents\
    \ into unfavorable positions if caught off-guard. *Compression of Time: By compressing\
    \ the time needed for events to unfold, Petra can reduce the time needed to perform\
    \ complex actions to zero. This allows Petra to instantly communicate with her\
    \ allies by compressing discussion time, and act perfectly without hesitation\
    \ by compressing thinking time. *Compress Agony: By compressing her allies' or\
    \ her own pain, Petra can avoid being stunned or hesitant as a result of the agony.\
    \ As a drawback, this massively increases the agony due to experiencing all of\
    \ it in an instant. ==Notable Matchups== Victories: Losses: Inconclusive: ==Notes==\
    \ ==References== Category:Re:Zero kara Hajimeru Isekai Seikatsu Category:Magic\
    \ Users Category:Light Novel Characters Category:Anime Characters Category:Female\
    \ Characters Category:Teenagers Category:Maids Category:Extrasensory Perception\
    \ Users Category:Statistics Amplification Users Category:Enhanced Senses Users\
    \ Category:Good Characters Category:Characters Category:Light Users Category:Temperature\
    \ Users Category:Healers Category:Social Influencers Category:Internet Characters\
    \ Category:Power Mimicry Users Category:Curse Users Category:Martial Artists"
  source_ids: *id003
  decisive: false
  status: unverified
