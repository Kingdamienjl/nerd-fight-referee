        Marksman Variant: Along with the standard shot, V1 can create and throw coins
        which can be used in a variety of ways. Sharpshooter Variant" Along with the
        standard shot, V1 can fire a charge shot with increased damage less than the
        Piercer but without a limit on penetration and 3 bounces (regular has 3 charged,
        slab has 1) Alt Revolver (Slab Variant): The alternate version of the revolver
        has a slower rate of fire, but increased damage to standard and charge shots.
        Core Eject Variant: Can eject the shotgun''s core to fire a grenade-like projectile
        Pump Charge Variant: Can pump the shotgun to overcharge the shot, potentially
        creating a massive explosion. Sawed-On Variant: Has a chainsaw put on the
        shotgun that can then be thrown at an enemy but has a wire or black rope attached
        to it so it comes back. It can be thrown at a higher velocity by breaking
        the rope via launching the chainsaw after it''s fired with the Knuckleblaster
        and Jackhammer pierces enemies Alt Jackhammer: Variation in game of the shotguns
        that replaces the usual "concentrated heat" pellet with a jackhammer that
        does more damage, all mechanics are the same with the variants but it can
        fire the core projectile of the core eject variant at high speeds if it hits
        it Attractor Variant: Can fire a magnet that attracts nails to it, in order
        to create traps. Can also attract Rocket Launcher rockets. Overheat Variant:
        After firing for a period of time, an overheat can be activated for a burst
        of an increased fire rate as well as flaming nails that burns their targets.
        Jumpstart Variant: Can attach a wire to an enemy and fire electricity after
        the gun Alt Sawblade Launcher: Same mechanics as the variants but replaces
        nails with sawblades. The overheat shot is replaced with larger red sawblade
        that does more damage and stay around longer but has weaker sawblades than
        the attractor variant. The Jumpstart''s electric attack charge up speeds up
        if the enemy is hit with saw. Saws orbit around magnets of the attractor variant
        and ricochet when passing through enemies Electric Variant: Fires an electric
        beam that pierces through enemies. Screwdriver Variant: Fires a drill into
        an opponent that does damage over time and constantly sprays blood out from
        the wound, letting V1 heal more easily. Malicious Variant: Fires a beam that
        creates a large explosion on contact, similar to a malicious face. Freezeframe
        Variant: The rockets can be frozen in place after being fired, allowing V1
        to combine it with other weapons or even ride on top of the rockets for added
        mobility. S.R.S Cannon Variant: A rocket launcher exactly the same as the
        freezeframe but instead of stopping rockets in place it fires a large cannonball
        Firestarter Variant: A rocket launcher exactly the same as the freezeframe
        but instead of stopping rockets in place it can spew oil that can be set on
        fire and sticks onto enemies Note: V1 can switch between arms at will. These
        arms are only V1''s left arm. Feedbacker: V1''s default arm This arm can parry
        attacks, allowing V1 to reflect projectiles (including it''s own shotgun shots
        and coins) and even heal itself to full health upon a successful parry. Knuckleblaster:
        An arm V1 stole from V2 after their first fight. While it can deflect some
        projectiles, it is not as accurate. It can detonate shells within the arm
        to create a shockwave which deals heavy damage and knocks enemies away. Whiplash:
        Obtained after V1''s second fight with V2. It serves as a grappling hook V1
        can use to pull lighter enemies closer, or pull itself towards heavier enemies.
        It cam be used for extra traversal or to juggle coins and pull V1''s own shotgun
        cores and rockets. ==Others== Notable Victories: Archangel Gabriel, Minos
