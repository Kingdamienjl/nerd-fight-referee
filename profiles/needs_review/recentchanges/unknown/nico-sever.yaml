        it), Magic (Demonic energy is often associated with having magical properties),
        Social Influencing (Is described as having undeniable charisma), Sealing (Ebony
        and Ivory is capable of Sealing very powerful enemies away, just like how
        he did with Mundus), Durability Negation (Devil Sword Sparda can cut through
        time and space), BFR, Flight (via Devil Trigger), Non-Physical Interaction
        (Can interact with Demons, which are many kinds of Evil Spirits. Dante has
        also shown to be able to Interact with a demons soul shortly before transforming
        into a Devil Arm), Fear Manipulation (Demons cause fear through their Prescence.
        High amounts of Demonic energy can also cause non-organic matter to feel fear),
        Soul Manipulation, Power Absorption (When Dante absorbed Geryon's Soul, He
        gained the Ability to Control Time), Spatial Manipulation (Demonic Energy
        can warp the fabric of Time and Space), Time Manipulation (Via Quicksilver),
        Enhanced Senses (Vergil is capable of sensing Dante and Lady arriving at the
        Temen-ni-gru Tower. And Dante sensing that Vergil was at the Top of the Tower),
        Extrasensory Perception (Capable of Detecting measurements in power. Dante
        even as Tony Redgrave can sense the Soul of a demon that's possessing a Human),
        Conceptual Manipulation (Types 1 & 2; Arkham states that the Name of a Demon
        is their Truth, Hence their true form. Even a mere change of a Demons Name
        can shape reality at it's will. Sparda's Lineage can remove, give, or even
        change a demons name. When Tony Redgrave changed his Name from Tony to Dante,
        he not only gained Tremendous power, but the concept of his being changed.
        This allowed him to keep up with the likes of Gilver. When Vergil was captured,
        Mundus Changes his name to "Nelo Angelo", Thus changing his entire being.
        When Nelo Angelo was destroyed after defeat, Years later he came back as Vergil.
        Vergil then proceeds to split himself in two by separating Man from Devil,
        creating 2 Identities, I.e. V & Urizen. In turn, "Vergil" becomes far more
        powerful), Acausality (Types 1, 4, & 5; Demons are unaffected by Time paradoxes
        of the past and the future. Demons also exist beyond the concept of Right
        and Wrong, which is a form of duality that is governed by cause and effect),
        Summoning (Dante summons a Dragon during his fight with mundus), Immortality
        (Types 1, 2, 3, 4, 5, 6, 8, & 9; Demons don't age at all. Dante, even in this
        condition, can keep fighting without being grievously wounded. Demons are
        capable of regenerating loss of limbs and injuries that would otherwise be
        fatal to a human. Demonic energy can bring even humans back to life. Demonic
        energy is unbound by the laws of life and death. Demons can project their
        consciousness, even without the needs of a physical Avatar. A demons name
        is closer to it's true substance, hence their avatars are separate from true
        forms), Regeneration (High Godly; Dante's inheritance from Sparda is on the
        same level as Vergil's, who he, despite being completely Erased as Nelo Angelo
        on a Physical, Spiritual, and Conceptual level, regenerates back into Vergil
        soon as Dmc5 took place), Mind Manipulation (Demonic energy can warp human
        minds), Corruption (Types 1 & 2; Goes as follows), Madness Manipulation (Types
        2, 3, & 4; Anyone prone to demonic energy would start gouging their own eyes
        out from pure insanity moments before mutating into a demon. This can also
        happen on a Spiritual level. When V made eye contact with Dante, he began
        to feel insanity and despair), Law Manipulation (Demons can draw their demonic
        energy from the Demon world, which can make it's own laws that differ from
        the laws of the Human World), Self Sustenance (All Types; Demons can survive
        indefinitely underwater without the need to breathe. Dante doesn't need to
        breathe while fighting Mundus in Space. Demons are able to live without the
        need to eat. Dante can replenish his energy faster than absorb it in Devil
        Trigger. Thanks to this, he can stay in DT as long as he wants), Elemental
        Manipulation (Fire, Lightning, Ice, Light, & Air), Power Nullification (Ebony
        and Ivory is capable of Negating the powers that Arkham held), Existence Erasure
        (Transforming into Devil Trigger can Erase nearby Enemies. Dante was able
        to completely destroy Mundus to the point where he vanished in a void of Agony),
        Possession (Types 1 & 2 [Aspects 1, 2, 1, & 3]; Demons can enter their spiritual
        forms to possess humans, and even non living things), Fate Manipulation (Demonic
        Energy can completely change fate, no matter what a human or a demon is trying
        to do. For Example, Nero's fate was being controlled by the demon die, thus
        he was forced to play the game. Whereas Dante wasn't), Dimensional Travel
        (Demons can travel from the Demon world to the Human world, and Vice Versa)
