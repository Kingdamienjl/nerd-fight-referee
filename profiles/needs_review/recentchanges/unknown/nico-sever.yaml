  intelligence:
    text: 'Standard Tactics: * Earth Magic: Elijah is proficent at earth magic. He
      is also able to summon metal or earth seemingly out of thin air, something no
      other earth or metal mage is known to be capable of (Though he cannot summon
      it out of liquids), and possess extreme amounts of raw power with it, though
      he initially lacked fine control over it. Nico''s power was so great that a
      single earth pulse spell from him could finely detect everything within the
      Dire Tombs and individuals within it, while normal earth mages could only perceive
      crowds of people. *Metal Deviant: Elijah is also able to use metal deviant magic,
      which he discovered when he accidentally conjured a field of metal spikes around
      him. He favors metal magic in combat over earth. *Black Spikes: They appear
      to be a unique metal deviant spell; these spikes are highly powerful and the
      magic he employs the most in battle; nevertheless, he needs shadows to cast
      them. This is related to Vritra''s decay mana arts. This is something that Uto
      can use as well. *Soul Fire: Nico uses Soul Fire, a Vritra decay mana art, which
      manifests as black flame that does not emit heat but consumes whatever it comes
      into contact with; therefore, it does not burn but destroys matter and energy.
      Soul Fire has been shown to deplete life energy, making it impossible for even
      a being as strong as a Lance to use mana for an extended period of time. It
      can also be used to treat non-fatal injuries to the user and others. Nico isn''t
      nearly as skilled with Soul Fire as other Scythes, such as Cadell. *Poison Gas:
      He has demonstrated a poison gas magic mana art very similar to Jagrette''s
      poison gas, though he has only demonstrated it once.'
    source_ids: *id002
    confidence: 0.8
