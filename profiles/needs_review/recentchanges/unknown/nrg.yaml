- id: claim-weaknesses-580deece
  section: weaknesses
  axis: weakness
  text: 'He is weaker and slower in his suit as compared to his True form which has
    true flight and emits continous radiation. In his True Form NRG is vulnerable
    to carbon dampening rods, which slow down nuclear reactions and inhibit his radiation
    generating abilities if he is penetrated hard enough with carbon damping rods
    this would slow him down as team Tennyson did this to weaken him to a point they
    were able to defeat him (Scan) Feats: *NRG was able to eat a device that covered
    the Earth which was going to destroy the planet over time, yet he was able to
    casually eat it. (Scan) *Ben and P''andor were able to deal with a water and ice
    alien with ease. (Scan) and (Scan) *He cannot be possessed or mind-manipulated
    thanks to being inside his armor and intangibility. (Scan). *NRG''s suit is specially
    designed so that he will not be harmed by fire, radiation or heat (Scan) Notable
    Attacks/Techniques: NRG is harmful to humans in his true form. His radiation can
    kill them, which is why he''s kept in his containment suit which he can exit any
    time he wants. NRG is capable of firing highly radioactive energy beams through
    the vents in his containment suit which can corrode or melt metallic objects.
    NRG can channel his heat underground, which results in the eruption of massive
    geysers of lava. NRG''s containment suit is fireproof, being able to resist fire
    attacks, and is immune to radiation, extremely hot or cold environments. Because
    the containment suit is made of metal, NRG is immune to being possessed by Lucubra.
    Overall, the containment suit is very well known for being extremely durable.
    Outside of the suit, all of NRG''s powers are massively greater. He becomes very
    agile and gains both flight and phasing abilities, he can breathe underwater,
    and grows in size if he absorbs and consumes enough energy. The more he absorbs
    and eats, the stronger and bigger he gets) ==Gallery== NRG mama.gif|Magma manipulation
    NRG Armor.gif|Impenetrable Armor NRG Radiation.gif|Radiation melting Nrg true
    form.gif|NRG True form showed by P''andor NRG Electrictiy absopbtion.gif|Electricity
    absorption NRG intangibility.gif|Intangibility NRG absorbing a Nuclear Powerplant.gif|Absorbing
    a Nuclear Power plant NRG Eating Uranium from Nuclear Power planets core.gif|Eating
    uranium from the core of a nuclear power plant NRG breaking free from Ice.gif|NRG
    breaking free from Ice Radiation beam.gif|Radiation beam NRG Radiation blast.gif|NRG
    Radiation blast ==Notable Matchups== Victories: Losses: Inconclusive: ==Notes/Explanations==
    Category:Characters Category:Ben 10 (Classic) Category:Ben 10 Aliens Category:Aliens
    Category:Transformations (Ben 10) Category:Male Characters Category:Good Characters
    Category:Heroes Category:Armor Users Category:Cartoon Characters Category:Radiation
    Users Category:Temperature Users Category:Energy Users Category:Magma Users Category:Light
    Users Category:Non-Physical Interaction Users Category:Flight Users Category:Intangibility
    Users Category:Absorption Users Category:Body Control Users Category:Size Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
