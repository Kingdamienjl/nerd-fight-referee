- id: claim-weaknesses-e12eff0a
  section: weaknesses
  axis: weakness
  text: "Can't move swiftly while absorbing energy. Isshiki's power gradually destroys\
    \ Jigen's body. If he resurrects via K\u0101ma, all other K\u0101ma marks he put\
    \ disappear. | If he's resurrected in a less than ideal body, he starts literally\
    \ breaking down within a matter of days. Notable Attacks/Techniques: D\u014Djutsu=\
    \ *Byakugan (White Eye): Byakugan is the kekkei genkai that originated from the\
    \ \u014Ctsutsuki Clan and later inherited by their distant descendants, the Hy\u016B\
    ga Clan. It is regarded as one of the \"Three Great D\u014Djutsu,\" the others\
    \ being the Sharingan and the Rinnegan. Isshiki has the Byakugan in his left eye,\
    \ granting him a telescopic vision, x-ray vision, a near 360\xB0 field of visual\
    \ perception (with the presumed exception of a small blind spot at the upper thoracic\
    \ vertebrae), and the ability to see the chakra pathway system and its tenketsu.\
    \ *Kokugan (Black Eye): The d\u014Djutsu that Isshiki has in his right eye, little\
    \ is known about his powers, but he gives Isshiki the ability to use Sukunahikona\
    \ and Daikokuten on a larger scale compared to when he was possessing Jigen. **Sukunahikona:\
    \ Sukunahikona is a d\u014Djutsu of Isshiki \u014Ctsutsuki's unspecified right\
    \ eye. It allows him to instantaneously shrink himself or any inorganic matter\
    \ within his gaze and return it to its original size at will. Because the change\
    \ in size happens too fast for the human eye to see, it is often mistaken for\
    \ teleportation. Daikokuten can store these objects within a timeless dimension,\
    \ allowing them to maintain their condition. While inhabiting Jigen\u2019s body,\
    \ this technique customarily required hand gestures to shrink foreign matter,\
    \ but in his original form, Isshiki can achieve the effect just by looking at\
    \ desired objects. ***Parasite Technique: In its shrunken state, Isshiki demonstrated\
    \ the ability to enter someone's body to settle as a parasite, absorbing its nutrients\
    \ and eventually gaining complete control of its host. **Daikokuten: Daikokuten\
    \ is a technique within the unspecified d\u014Djutsu of Isshiki \u014Ctsutsuki.\
    \ Through its use, anything he has previously shrunken using Sukunahikona can\
    \ be stored within a dimension where time doesn't flow, allowing them to maintain\
    \ a pristine condition. They can be instantaneously retrieved at the focus of\
    \ his gaze. The objects retrieved are manifested with such speed that they can\
    \ catch attentive opponents, such as Sharingan-wielding Sasuke Uchiha and Six\
    \ Paths Sage Mode-enhanced Naruto Uzumaki off guard while inflicting severe bodily\
    \ harm on them. While inhabiting Jigen\u2019s body, this technique normally required\
    \ hand gestures in order to summon the foreign matter back, but in his original\
    \ form, Isshiki can achieve the effect just by looking at the target location.\
    \ ***Daihakoten: Can manifest massive black cubes with Daikokuten, which he can\
    \ freely manipulate. These black cubes disrupt sensory abilities. K\u0101ma= *K\u0101\
    ma: K\u0101ma is a seal that serves as a compressed backup of an \u014Ctsutsuki\
    \ clan member's biological data that they can embed in the body of a chosen recipient\
    \ known as a vessel. Over time the K\u0101ma will gradually overwrite the vessel's\
    \ genetic profile until they transform into a perfect \u014Ctsutsuki. Should the\
    \ \u014Ctsutsuki be slain, their soul will migrate to one of their vessels, and\
    \ when the K\u0101ma completes, they will reincarnate through their body. When\
    \ activated, K\u0101ma significantly enhances the user's physical abilities and\
    \ the power of their jutsu. **Absorption and Reflection: K\u0101ma allows him\
    \ to absorb any ninjutsu, negating its effects in the process, release an enhanced\
    \ version of it, and unleash large-scale explosions. *Black Rods: Black rods created\
    \ by Isshiki to immobilize, restrict movements and absorb the target's chakra.\
    \ *Space-Time Portal: This technique is a Space-Time Ninjutsu used by the \u014C\
    tsutsuki clan. The user creates a rift, allowing anyone enveloped to transfer\
    \ to a chosen location, including foreign dimensions. The rift's formation is\
    \ fast enough to catch targets off guard and transport them alongside the user,\
    \ as well as to evade attacks from enemies at the last moment. Isshiki can also\
    \ use this technique to transport himself to his vessel's location. *Sealing Coffin:\
    \ Can use a gigantic sealing coffin located on his dimension to perform a powerful\
    \ F\u016Binjutsu, able to seal away even the likes of Naruto inside. Only Isshiki\
    \ himself is capable of breaking the seal, and cracking it will only destroy whatever\
    \ is inside. *Genjutsu Communication: This technique is a projection-type genjutsu\
    \ which it uses to meet with multiple people at once. It is used to compensate\
    \ for the fact that a group may not always be nearby. All the images projected\
    \ by this technique appear corporeal, and the user can alter even the immediate\
    \ surroundings. ==Gallery== JigenO.png Isshiki_Revived.png ==Notable Matchups==\
    \ Victories: Madara Uchiha (Naruto) Madara's Profile (True Form Isshiki and Dual\
    \ Rinnegan+Rinne Sharingan Madara were used, speed was equalized and the battle\
    \ took place in the Cell Games Arena) Losses: Inconclu"
