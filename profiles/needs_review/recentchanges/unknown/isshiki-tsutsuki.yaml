        \ rift, allowing anyone enveloped to transfer to a chosen location, including\
        \ foreign dimensions. The rift's formation is fast enough to catch targets\
        \ off guard and transport them alongside the user, as well as to evade attacks\
        \ from enemies at the last moment. Isshiki can also use this technique to\
        \ transport himself to his vessel's location. *Sealing Coffin: Can use a gigantic\
        \ sealing coffin located on his dimension to perform a powerful F\u016Binjutsu,\
