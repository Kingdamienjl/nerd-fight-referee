    \ (Channels Chakra at the soles of his feet to walk on water and scale vertical\
    \ surfaces), Extrasensory Perception (Can easily sense the presence of Kashin\
    \ Koji's toad that went unnoticed even to Naruto), Aura (As seen here), Transformation,\
    \ Energy Projection, Illusion Creation (Can create illusory images of himself\
    \ and alter the immediate surroundings to communicate over a long distance with\
    \ genjutsu communication), BFR (Sent Naruto to another dimension), Size Manipulation\
    \ (Up to Small Size Type 3; With Sukunahikona he can instantly shrink himself\
    \ or any non-living target to microscopic levels and just as quickly restore its\
    \ original size), Dimensional Storage, Limited Time Stop & Summoning (With Daikokuten\
    \ he can send things he has shrunk to a dimension where time doesn't flow, and\
    \ instantly bring them back. He has a stock of things, such as tables, food and\
    \ drinks), Weapon Creation (Can create black rods that can be formed directly\
    \ from his hand, through the floor or around his neck. These rods can also be\
    \ used as a B\u014D), Paralysis Inducement & Energy Absorption (Can drain energy,\
    \ paralyze and restrict the movements of targets with his black rods), Limited\
    \ Telekinesis (Can telekinetically control his black rods), can bypass durability\
    \ to an extent by creating rods in the body of opponents, Sealing (Can seal people\
    \ within a gigantic sealing coffin), Resistance to Ice Manipulation (Possesses\
    \ better chakra control than Kakashi), and Extreme Heat (Unaffected by Sasuke's\
    \ amaterasu) All previous abilities amped, \u014Ctsutsuki Physiology (\u014Ctsutsuki),\
    \ Enhanced Senses (Byakugan allows him to see long distances and tiny objects,\
    \ has an almost perfect 360\xB0 field of vision, can see through visual obstructions\
    \ and his opponents' internal chakra systems), Limited Durability Negation (The\
    \ Gentle Fist bypasses durability to an extent as it directly targets the nerves\
    \ and life energy channels to disrupt the target's movements and ability to control\
    \ their inner energy), Biological Manipulation & Body Control (Controlled Jigen's\
    \ brain and took over his body like a parasite), Unconventional Attack Reflection,\
    \ Power Nullification, Dimensional Travel & limited Time Stop (Via Sukunahikona\
    \ and Daikouten can shrink non-living objects and attacks within his eyesight\
    \ making them useless and if he wishes teleports them to a time stopped dimension\
    \ and use said attacks or objects whenever he wants), Summoning (Can summon black\
    \ cubes), Telekinesis (He can freely control the black cubes telekinetically.\
    \ Additionally, he deflected some Shuriken with Telekinesis), and Extrasensory\
    \ Perception Manipulation (His black cubes can block out sensory abilities of\
    \ Naruto and Kurama's caliber)"
