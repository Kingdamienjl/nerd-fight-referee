  section: weaknesses
  axis: weakness
  text: "He can't use his Fire Breath on an empty stomach | None notable | None notable\
    \ Notable Attacks and Techniques: Notable Attacks and Techniques: Godzillaman!=\
    \ *Fire Breath: This is his strongest attack as Godzilla-kun can spit charged\
    \ fire from his mouth. *: Godzilla Kun can defeat enemies with one punch. *Time\
    \ Stop: He can stop time during 15 seconds with the Sandglass item. *Heart: He\
    \ can recover some of his health with a Heart item. *Thunder: Godzilla-kun summons\
    \ a thunder that directly hits his enemies. *Flight: Godzilla-kun can flight by\
    \ his own means in similar way to Godzilla Showa. *Fire Godzilla: After eating\
    \ a Nuclear Nut Godzilla obtains a power-up called \"Fire Godzilla\" his whole\
    \ body bursts into flames, and can carbonize enemies with ease. *: After drinking\
    \ a magic potion Godzilla-kun turned into a superhero called Godzillaman. He is\
    \ way stronger than his base form, can fly, is inmune to pain, and can duplicate\
    \ himself. **Duplication: Ghidorah blasts Godzillaman with his gravity beams.\
    \ This causes Godzillaman to split into a ton of smaller Godzillamen. The tiny\
    \ Godzillamen bite and blast Ghidorah before creating an arrow formation and targeting\
    \ Ghidorah's weak spot. *Kamen Gojida: A Kamen Rider spoof, but it\u2019s Kamen\
    \ Gojida. Here we see Kamen Gojida jumping into action and attacking his off-screen\
    \ foe as he yells out the names of his attacks. Gojida Kick! Gojida Punch! And\
    \ his final attack, a light ray! **Light Ray: A ray of light, and Kamen Gojida\
    \ strongest attack. *Diamond Godzilla: Godzilla catches the diamond in his mouth,\
    \ which changes him, combining the jewel and his face, and giving him a jewel\
    \ beam power that takes out Ghidorah in one hit. There is a big celebration, but\
    \ now that Godzilla IS the Tear of Godzilla. **Jewel Beam: Diamond Godzilla can\
    \ fire a powerful energy beam from his mouth. ==Gallery== Art \u25BE= ==Notable\
