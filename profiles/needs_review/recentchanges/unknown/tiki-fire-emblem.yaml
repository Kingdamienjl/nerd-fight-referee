- id: claim-intelligence-2f39b2c4
  section: power_scale
  axis: battle_iq
  text: Young Tiki= -General= Average (Despite her great age, as she spent almost
    the entirely of her life sleeping, Tiki lack experience inb life and is about
    as smart as a regular human child.) -Combat= Despite her lack of fighting experience
    at this point in time, Tiki is still a capable fighter. Gotoh consider Tiki capable
    of handling Medeus.Fire Emblem Shadow Dragon - Chapter 24 The Dragonkin Realm
    She is capable of defeating Marth though he can also defeat her in return. Her
    and other playable characters are able to dodge spells that cause big pillars
    of fire or large beam of darkness. -Adult Tiki= -General= Above Average (In the
    2000 years since Marth's era, Tiki have greatly matured and is now reverred by
    the people of Valm as an oracle, the Voice of the Divine Dragon.) -Combat= After
    the 2000 years since Marth's era, Tiki is more experienced than before. She is
    now a member of the Sheperd of which even the most average fighter StahlFire Emblem
    Awakening - Stahl/Miriel support is already so skilled that he can read into his
    foes' thought from their faces or gestures to always be a step ahead of them in
    combat.Fire Emblem Awakening - Stahl/Robin support and as seen with Owain, Inigo
    and Severa, being able to sense someone's presence is enough for the Sheperds
    to allow them to fight and defeat invisible target.Fire Emblem Fate - Hidden Truth
    DLC part 1 Can defeat foes from Castle Apotheosis which are the strongest of heroes
    coming from many different world possessing might beyond that of any humanFire
    Emblem Awakening - Apotheosis DLC and as they cleared the secret gauntlet the
    Sheperd became renown as the greatest warriors any world has ever known.
