- id: claim-powers-and-abilities-8d6c4f02
  section: abilities
  axis: hax
  text: 'Superhuman Physical Characteristics, Genius Intelligence, Social Influencing,
    Negative Speed Force Aura, Time Manipulation (Can freely alter the timeline, mastered
    manipulating time to where Tempus Fuginaut consider that he almost rivals himTales
    from the Dark Multiverse: Flashpoint), Regeneration (At least Mid-Low; Briefly
    got a batarang impaled in his foot but didn''t appear to be bothered by the damage,
    having presumably quickly healed from it, possibly Low Mid; possibly comparable
    to that of the Flashes), Statistics Amplification and Self-Perception Manipulation
    (Can slow down his perceptions to view things in slow motionThe Flash Vol 1 #755),
    Vibration Manipulation (Can create shockwaves with a snap of his fingersThe Flash
    Vol 5 #22 or clapBatman Vol 3 #22), Durability Negation and Intangibility (Can
    phase through things by vibratingBatman Vol 3 #21, and leave some parts of his
    body solid while inside targetsThe Flash Vol 5 #24), Time Travel (As seen here),
    Sound Manipulation (Via thunderclaps), Age Manipulation (Can accelerate the age
    of targets on contactThe Flash Vol 5 #27), BFR (As seen hereThe Flash Vol 1 #760),
    Portal Creation (As seen here), Mind Manipulation (Can speak at a hypnotic frequency
    to push people to do things they would never do otherwiseThe Flash Vol 1 #761),
    Possession (Can possess people when vibrating at just the right frequencyThe Flash
    Vol 1 #758), Electricity Manipulation (Can fire bolts of electricity from his
    hands), Limited Air Manipulation (Can create vortexes by spinning his arms around),
    Technology Manipulation (His lightning fries the Batcave''s surveillance equipment
    like an EMPThe Flash Vol 5 #21), Energy Projection and Energy Absorption (Via
    his lightning rodThe Flash Vol 5 #754), Dimensional Travel (Escaped Paradox''s
    dimension), Afterimage Creation (As seen hereThe Flash Vol 5 #25), Electro-Magnetism
    Manipulation (Uses it to form his suit), Surface Scaling and Free Movement (As
    seen here), Power Bestowal and Corruption(Gives Barry the Negative Speed Force,
    turning him into Negative FlashThe Flash Vol 5 #26), Summoning (Can summon Flash
    villains from different time periods to help fight for him), Explosion Manipulation
    (As seen hereDeathstroke Vol 4 #24), Limited Earth Manipulation (Causes seismic
    patterns via runningDeathstroke Vol 4 #26), The same powers and resistances as
    his Post-Crisis version (As he kept his memories and is portrayed as the same,
    like how he created the Negative Speed Force), Resistance to Sleep Manipulation
    (Speedsters have a special metabolism that prevents things such as sleep gas to
    deal damage to them or affect themThe Flash (2016) #774) Same powers as before,
    Extrasensory Perception & Cosmic Awareness (Was able to remember events and how
    he died in the Flashpoint timelineThe Flash Vol 5 #19, which was altered into
    the different timeline he was now present on & "reborned" into, meaning that he
    shouldn''t have the memories of that other version of himself. Claims to experience
    "all at the same time" his prior deaths through time and in the former Post-Crisis
    timeline. Could feel the presence of hidden Doctor Manhattan "like a wave of static
    electricity", vaguely how powerful he was, how he had done strange things to the
    timeline, and a more clear idea of his power when he showed himself upThe Flash
    Vol 5 #22), Immortality (Types 3 & 4, likely 5: Thawne considers threats of death
    irrelevant due to his nature as a living paradox since he has no past or future
    until he brings it back togetherThe Flash (2016) #22. Came back from the dead
    after getting slainThe Flash (2016) #23 and will always be reborn no matter how
    he diesThe Flash (2016) #753), Resurrection (Despite having been killed many times
    before, he''s always reborn, considering to be forever locked into that never-ending
    loop of resurrectionThe Flash Vol 1 #753, allowing him to be reckless over actions
    that might kill him) & Regeneration (Low-Mid after dying; After days of not having
    regenerated from having his dead body in a mummy-like state, he started regenerating
    early one day and was fully healed by the nightThe Flash Vol 5 #23) Attack Potency
    Varies with Speed (A Speedster''s power varies depending on howDark Crisis: Big
    Bang, December 2022 fastJLA Vol 1 #3 they''reThe Flash Vol 2 #148 May 1999 movingConvergence:
    Speed Force #2. Flashes often hold back their full speed, otherwise they may kill
    someone while going too fastDC Rebirth, The Flash Vol 5 #7, November 2016), up
    to Low Complex Multiverse level (Consistently shown to be superior to Barry Allen,
    with it being stated twice Thawne to be superior to BarryThe Flash Vol 5 #23.
    Should be as capable as Barry is, as he had received his powers from Barry''s
    suit. Fought a fully bloodlusted Barry Allen, but ultimately lostThe Flash Vol
    5 #275-D)'
