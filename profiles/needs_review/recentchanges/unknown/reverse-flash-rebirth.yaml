  description: 'Resistance to Sleep Manipulation (Speedsters have a special metabolism
    that prevents things such as sleep gas to deal damage to them or affect themThe
    Flash (2016) #774) Same powers as before, Extrasensory Perception & Cosmic Awareness
    (Was able to remember events and how he died in the Flashpoint timelineThe Flash
    Vol 5 #19, which was altered into the different timeline he was now present on
    & "reborned" into, meaning that he shouldn''t have the memories of that other
    version of himself. Claims to experience "all at the same time" his prior deaths
    through time and in the former Post-Crisis timeline. Could feel the presence of
    hidden Doctor Manhattan "like a wave of static electricity", vaguely how powerful
    he was, how he had done strange things to the timeline, and a more clear idea
    of his power when he showed himself upThe Flash Vol 5 #22), Immortality (Types
    3 & 4, likely 5: Thawne considers threats of death irrelevant due to his nature
    as a living paradox since he has no past or future until he brings it back togetherThe
    Flash (2016) #22. Came back from the dead after getting slainThe Flash (2016)
    #23 and will always be reborn no matter how he diesThe Flash (2016) #753), Resurrection
    (Despite having been killed many times before, he''s always reborn, considering
    to be forever locked into that never-ending loop of resurrectionThe Flash Vol
    1 #753, allowing him to be reckless over actions that might kill him) & Regeneration
    (Low-Mid after dying; After days of not having regenerated from having his dead
    body in a mummy-like state, he started regenerating early one day and was fully
    healed by the nightThe Flash Vol 5 #23) Attack Potency Varies with Speed (A Speedster''s
    power varies depending on howDark Crisis: Big Bang, December 2022 fastJLA Vol
    1 #3 they''reThe Flash Vol 2 #148 May 1999 movingConvergence: Speed Force #2.
    Flashes often hold back their full speed, otherwise they may kill someone while
    going too fastDC Rebirth, The Flash Vol 5 #7, November 2016), up to Low Complex
    Multiverse level (Consistently shown to be superior to Barry Allen, with it being
    stated twice Thawne to be superior to BarryThe Flash Vol 5 #23. Should be as capable
    as Barry is, as he had received his powers from Barry''s suit. Fought a fully
    bloodlusted Barry Allen, but ultimately lostThe Flash Vol 5 #275-D)'
