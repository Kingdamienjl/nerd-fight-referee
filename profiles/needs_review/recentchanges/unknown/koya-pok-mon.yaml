        \ increased to 128 instantly. In an unrelated glitch, it can passively cause\
        \ certain beings to randomly duplicate around it., Sprite Glitch: MissingNo.\
        \ causes severe issues with graphics when it appears. This can lead to characters\
        \ being duplicated as stated above, but it can also cause sprites to be scrambled\
        \ or shredded just from its sheer presence., Crash: MissingNo. appearing before\
        \ an enemy has a chance to cause the game to crash. This effectively destroys\
        \ the game world, forcing the player to load a previous state of the game.\
