- id: claim-weaknesses-ef99a847
  section: weaknesses
  axis: weakness
  text: 'Presumably cannot talk Notable Attacks/Techniques: Kharms'' Savvies: *Rude
    Gestures: What hands are really for. Like many Savvies in Gingiva, it''s unknown
    how this attack actually works, but by making rude gestures, Kharms can do great
    damage to all enemies on the battlefield. *Manhandle: Manhandles the opponent.
    One of Kharms'' strongest attacks. *High Five: Using this technique, Kharms can
    cure status conditions that are akin to seals put on special skills, or confused
    states that make the victim attack themselves. *Peace Sign: Heals an ally or the
    user. *Deal With It: A technique that casts Occlude on the user or an ally, which
    increases their defenses by 50%. *Rally: A technique that casts Forbear on the
    user or an ally, increasing their speed by 50%. *It''s a Bust: It''s unknown what
    this attack actually does, but its animation shows another scuttlebeast charging
    at the target. This either indicates that Kharms is summoning another scuttlebeast
    to attack for him (Since the sprite used is of that of a different scuttlebeast),
    or that Kharms himself charges at the opponent, as all of the other scuttlebeasts
    also use the same attack. *Noodle Strum: Plays with the target''s nerves like
    strings on a guitar. ==Notable Matchups== Victories: Losses: Inconclusive: Category:Statistics
    Amplification Users Category:Summoners Category:Monsters Category:Playable Characters
    Category:Protagonists Category:Game Characters Category:Characters Category:Genderless
    Characters Category:Status Effect Users Category:Gingiva Category:John Clowder'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
