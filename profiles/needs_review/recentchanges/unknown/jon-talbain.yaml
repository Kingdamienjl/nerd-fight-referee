- id: claim-powers-and-abilities-755bd144
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Enhanced Senses (Comparable to wolves,\
    \ who have enhanced hearing, sense of smell, and sight. Their sense of smell is\
    \ 100x greater than a human's. Wolves can hear as far as 9 kilometers away in\
    \ a forest and 16 kilometers in the open tundra. They also have a sharper vision\
    \ than most domestic dogs.Wolf Facts They can recognize the identity of a packmate\
    \ by its urine.How Keen Is a Wolf\u2019s Sense of Smell? Wolves could smell a\
    \ dead moose or caribou buried under three metres (ten feet) of snow, even if\
    \ the wind was blowing the wrong directionHow Do Wolves Say Hello?), Bodily Weaponry\
    \ (Sharp teethWolf Teeth: Everything You Need to Know and clawsWolf Claws | What\
    \ Are Wolves\u2019 Claws Used for & How Claws They Built?), Expert Martial Artist\
    \ (A skilled martial artist who uses his knowledge of martial arts to fight opponents),\
    \ Acrobatics (Jon grabs his opponent and executes a backward somersault, spinning\
    \ multiple times in midair before driving them into the ground), Stealth Mastery\
    \ (Uses stealth tactics similar to wolves, allowing them to approach their prey\
    \ undetectedWildlife Watch: In the Company of Wolves), Expert Nunchaku Wielder\
    \ (Jon demonstrates expert proficiency with nunchaku, wielding them skillfully\
    \ in combat to execute rapid strikes and fluid combinations against his opponents),\
    \ Transformation (Can transform into a wolf at will), minor Body Control (Able\
    \ to extend his claws), Extrasensory Perception (Able to sense relevant sources\
    \ of energy, such as Pyron's waves), Chi/Energy Projection (Able to project energy\
    \ and use it to enhance his physical blows), Soul Manipulation (Every Darkstalker\
    \ is able to collect the souls of defeated enemies and use them for a variety\
    \ of purposes, such as absorbing them to become stronger), Passive Aura, Corruption\
    \ (Type 2) and Madness Manipulation (Type 2; All the Darkstalkers give off an\
    \ aura that corrupts the heart of the opponents and drives them insane), Non-Physical\
    \ Interaction (Able to interact with Pyron, who doesn't have a physical form,\
    \ and with Bishamon in Vampire Savior, whose body is made of souls), Fire Manipulation\
    \ (Via Dragon Cannon), Speed Amplification/Afterimage Creation (Via Mirage Body),\
    \ Resistance to Soul Manipulation (Possesses a very strong soul, due to it being\
    \ directly connected to his power. Souls such as his own, if splitted in multiple\
    \ parts, are able to draw each piece to the other and return one), Corruption/Madness\
    \ Manipulation (Totally unaffected by the aura of other Darkstalkers)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
