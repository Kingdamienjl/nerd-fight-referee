- id: claim-weaknesses-b5eecfd1
  section: weaknesses
  axis: weakness
  text: 'His aura''s madness-inducing and corrupting effects can be resisted by individuals
    with sufficiently strong minds or spirits, as well as those with particularly
    dark hearts. He also struggles against his werewolf nature and must maintain his
    humanity to avoid becoming consumed by his primal instincts. Notable Attack/Techniques:
    BeastCannon.gif|Beast Cannon ClimbLaser.gif|Climb Laser MillionFlicker.gif|Million
    Flicker WildCircular.gif|Wild Circular DragonCannon.gif|Dragon Cannon MomentSlice.gif|Moment
    Slice MirageBody.gif|Mirage Body *Beast Cannon: Jon covers his body with ki and
    charges towards the opponent, hitting them with a shoulder tackle. Jon can perform
    this move in multiple directions and even in the air. *Climb Laser: Jon hits the
    opponent with a somersault kick imbued with ki. *Million Flicker: Jon strikes
    the opponent multiple times with his nunchaku. *Wild Circular: Jon grabs the opponent
    and jumps backwards, spinning multiple times in the air before slamming them into
    the ground. *Dragon Cannon: Jon pulls out his nunchaku and summons a huge beam
    of fire that takes the shape of a dragon or that of three wolves. *Moment Slice:
    Jon stabs the opponent with his claws and violently slices through their body.
    *Mirage Body: Jon howls and temporarily increases his speed. When this state is
    active, he moves fast enough to create afterimages. ==Gallery== ==Notable Matchups==
