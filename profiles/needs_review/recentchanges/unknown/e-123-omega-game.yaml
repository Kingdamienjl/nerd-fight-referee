power_scale:
  tier:
    text: ', higher with Power Cores, even higher with Chaos Inferno | to , higher
      with Chaos Inferno and Boost'
    source_ids: &id002
    - mediawiki-476992
    confidence: 0.8
  attack_potency:
    text: Solar System level (The most powerful of Dr. Eggman's other robots within
      the E-series. Fought alongside Shadow and Rouge against Team Sonic and the members
      of Team Chaotix. Comparable to Shadow by the time of the Black Arms invasion,
      who grew stronger than when he previously had 3 Power Cores. Assisted Shadow
      in destroying several Shadow Androids, who could [https://www.youtube.com/watch?v=KP8EIxQUFDw&t=884s
      perfectly counter] Homing Attacks from [https://www.youtube.com/watch?v=n_o1cRH9jBs&t=616s
      the original] and [https://www.youtube.com/watch?v=xEQzNu6uywg&t=952s Sonic]),
      higher with Power Cores ([https://postimg.cc/kB7h937z Each Power Core doubles
      the user's physical abilities]), even higher with Chaos Inferno (Should be comparable
      to Sonic Overdrive, a stronger version of the Light Speed Dash, and unlike it,
      this move's strength comes only from Omega himself) | Galaxy level (Forced Mephiles
      to concede that his power is enough to combat Shadow, and thus Mephiles himself
      by extension.) to Low Multiverse level (Referred to as the world's most powerful
      robot by [https://youtu.be/flP-4ucN15k?t=186 both his own word] and [https://youtu.be/F0DyBi2Yl64?t=65
      Infinite's], and is called Eggman's strongest robot in [https://youtu.be/bRp8FT69_GY?list=PLHLYObbB2kuiZMCOh6XFuLF4196yi3eHS&t=394
      Team Sonic Racing], [https://youtu.be/bRp8FT69_GY?list=PLHLYObbB2kuiZMCOh6XFuLF4196yi3eHS&t=179
      making] him [https://youtu.be/bRp8FT69_GY?list=PLHLYObbB2kuiZMCOh6XFuLF4196yi3eHS&t=59
      superior] in strength to Metal Sonic. Made Infinite put some effort into [https://youtu.be/qrs8UozGEDo?t=1070
      dodging and reflecting] his lasers in combat), higher with Chaos Inferno
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively FTL+ ([https://www.youtube.com/watch?v=qZ4aUW-ZBMk&t=43s Could]
      keep [https://www.youtube.com/watch?v=sBVeF__tez8&t=17s track] of Shadow's movement),
      higher with Power Cores | Massively FTL+ (Can [https://youtu.be/pPRJIldk6Ss?t=1963
      keep up with] Shadow. Shot down a flying Phantom Ruby Clone of Metal Sonic.
      Able to [https://youtu.be/DXHo9__fo0s?t=1175 get the jump on and tag Infinite])
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class M | At least Multi-Stellar ([https://youtu.be/bRp8FT69_GY?list=PLHLYObbB2kuiZMCOh6XFuLF4196yi3eHS&t=193
