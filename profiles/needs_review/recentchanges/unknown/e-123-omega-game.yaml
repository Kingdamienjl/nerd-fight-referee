        Omega transforms into a cyan laser beam. As the Cyan Laser, Omega gains the
        same properties as that of a real laser, allowing him to move as a living
        beam of light. When hitting any surfaces as the Cyan Laser, Omega can also
        bounce off them as if they were reflective surface., Indigo Asteroid: Using
        the power of a Indigo Wisp Omega turns into a orb-shaped body with striped
        indigo skin and a matching planetary ring encircling his middle. As the Indigo
        Asteroid, Omega essentially becomes a miniature planet with a strong gravitational
        field. Omega is as such capable of creating a powerful gravitational pull
        around himself, strong enough to tear all kinds of objects to pieces and pull
        them into the Asteroid Ring. Additionally, the gathered matter can be used
        to empower the gravitational pull. The Indigo Asteroid also grants Omega the
        ability to levitate through midair., Yellow Drill: Using the power of a Yellow
        Wisp Omega turns into a yellow spiral drill. As the Yellow Drill, Omega can
        burrow and tunnel underground at remarkable high speeds and can be applied
        underwater, allowing Omega to move through water like a living torpedo.'
