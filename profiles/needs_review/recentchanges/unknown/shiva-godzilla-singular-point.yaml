- id: claim-powers-and-abilities-cc7bd8f0
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics **Longevity **Immortality (Type 9; The
    novel explains of how the SHIVA we see is nothing compared to its true form, the
    true body creating the physical body from scratch and resurrecting it at any point
    in time)Godzilla Singular Point (Novelization), Page 187 ***Regeneration (At least
    High; Comparable in nature to Godzilla who created its body from scratch and regenerated
    parts of it at will, has seemingly recreated and reshaped it''s own body after
    annihilating it. The body of SHIVA is a shell created around the singular point
    which can be restored using Archetypes at any point) **Large Size (Type 1; For
    the rock casing around the true body) **Acausality (Type 4; Is another manifestation
    of the Singular Point, similarly to Godzilla, who comes from outside of space-time
    and is considered to be the same as Jet Jaguar and his pilot who are seen as nodes
    whose future is impossible to view on a higher dimensional causality net.) **Higher-Dimensional
    Existence with Archetype Shell, Beyond-Dimensional Existence for the true body
    (At least Countless-D with the shell; Type 2 for the true body; The Singular Point
    is a spatio-temporal construct that allows for the creation of uncountably infinite-dimensional
    Archetype molecules as explained here. Having the Singular Point as part of oneself
    makes one superior to other red dust creatures. SHIVA is built around a Singular
    Point which is a construct that surpasses space-time.) *Genius Intelligence (Can
    perform various super complex and advanced calculations in mere seconds)Godzilla
    Singular Point (Novelization), Page 111 *Limited Dimensional Manipulation (Uncountably
    Infinite-D; Capable of hyperspatial and hypertemporal manipulation) *Space-Time
    Manipulation (Uncountably Infinite-D; SHIVA can twist the Space-Time surrounding
    it and is capable of hyperspatial and hypertemporal manipulation. As a manifestation
    of "It", should have the same type of power as Godzilla)Godzilla Singular Point
    (Novelization), Page 79Godzilla Singular Point (Novelization), Page 80 *Causality
    Manipulation (Scaling from Godzilla) *Subjective Reality (Red dust creatures can
    change universes to their will and could even eventually change the structure
    of the stars)Godzilla Singular Point (Novelization), Page 148Godzilla Singular
    Point (Novelization), Page 149 *Law Manipulation & Physics Manipulation (SHIVA
    can expel large amounts of the Archetype from its skin in the form of red dust,
    forming a dense cloud around it. The Archetype is able to distort the physics
    laws of the universe.Godzilla Singular Point (Novelization), Page 71Godzilla Singular
    Point (Novelization), Page 126 It can manipulate radio waves and absorb them,
    thus canceling out, well, any radio waves so something like a robot may not work
    near it if it is radio-controlled)Godzilla Singular Point (Novelization), Page
    97 -Resistances= Resistance to: *Biological Manipulation (Red dust creatures have
    a unique structure that is more perfect than DNA so they resist biological manipulation
    to an extent) *Mind Manipulation ("It"s second trunk is in control of SHIVA and
    is effectively just "Its" physical avatar without a mind of it''s own, unlike
    the other creatures under "Its" control) *Space-Time Manipulation (Uncountably
    Infinite-D; The "Singular Point" that is described is mentioned to have a "Bizzarre
    Space-Time structure")Godzilla Singular Point (Novelization), Page 161 *Precognition
    (Comes from outside of space-time and is considered to be the same as Jet Jaguar
    and his pilot who are seen as nodes whose future is impossible to view on a higher
    dimensional causality net. Can manipulate the causality to suit it while other
    monsters it controls see their own inevitable demise)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
