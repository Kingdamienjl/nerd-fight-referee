      that overtakes universes, being far superior to entities connected to uncountably
      infinite higher dimensions. The Singular Point is a mere branch of "It". "It"
      should be superior to its state with the Omega Point, which would've also collapsed
      the Singular Point whilst destroying and surpassing space-time as a whole. "It"
      surpasses the universe on a qualitive layer, viewing everything as mere fiction,
      with the universe being like a dream or a tv show to it and the singular point
      as well being merely a hole it put in the metaphorical screen separating the
      universe from itself. It views the past, future and the present as dreams and
      dreams within dreams, "It" itself being on a level that can never be truly reached,
      far above the endless repetition of dreams that it is constantly seeing. A more
