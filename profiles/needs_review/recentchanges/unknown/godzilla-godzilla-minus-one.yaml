- id: claim-weaknesses-50621d73
  section: weaknesses
  axis: weakness
  text: Although his outsides are extremely durable, his insides are far more susceptible
    to damage. Godzilla is unable to fire his atomic breath in rapid succession due
    to the burns and physical injuries it inflicts upon him, which take time to heal.
    After being forced to the surface in the final stage of Kenji Noda's plan, he
    seemingly had trouble firing his atomic breath, likely due to the same reason.
    Despite his amphibious lifestyle, Godzilla is susceptible to injury from rapid
    compression and decompression caused by sudden changes in ocean depth.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
