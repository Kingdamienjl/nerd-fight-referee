- id: claim-weaknesses-a16402aa
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Void: Tam is one of the best users
    of the Void in the series, able to achieve it instantly and teaching it to rand.
    In this state of extreme concentration, the user stops emotion from hindering
    their actions. They gain the ability to ignore debilitating pain. They also gain
    an unconscious understanding of the terrain around them, as well as an increased
    ability to predict their opponent''s motions by their steps and eye movements.
    They can feel the presence of other people coming from other directions, and Tam
    explicitly experiences a slowed sense of time when entering combat within the
    void. The void is not explicitly supernatural, but it allows normal humans to
    access an inhuman state of awareness and perception. ==Notable Matchups== Victories:
    Losses: Inconclusive: Category:The Wheel of Time Category:Male Characters Category:Weapon
    Masters Category:Book Characters Category:Good Characters Category:Humans Category:Soldiers
    Category:Sword Users Category:Blade Users Category:Warriors Category:Bow Users
    Category:Extrasensory Perception Users Category:Self-Sustenance Users Category:Perception
    Users Category:Characters Category:Fantasy Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
