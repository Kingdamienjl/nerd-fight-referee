- id: claim-weaknesses-1c8fd390
  section: weaknesses
  axis: weakness
  text: 'None notable Notable Attacks/Techniques: *Authority of Tristitia: Compression:
    The Witch Factor of Tristitia grants its wielder the Authority to Compress space
    and time. Hector typically used this to crush his targets alongside the space
    they occupy, appearing as though they were struck by an invisible mass. Compression
    can also crush more conceptual phenomena, but it is unknown whether Hector made
    use of this. As the Valiant whom the Witch Factor of Tristitia was tailored for,
    Hector is the only person capable of compatibility with the Witch Factor, and
    as a result he does not need to offer any compensation to Od Lagna to make use
    of his Authority, unlike subsequent users of Compression. ==Notable Matchups==
    Victories: Losses: Inconclusive: ==Notes== ==References== Category:Characters
    Category:Re:Zero kara Hajimeru Isekai Seikatsu Category:Antagonists Category:Aura
    Users Category:Enhanced Senses Users Category:Fear Users Category:Gravity Users
    Category:Internet Characters Category:Light Novel Characters Category:Male Characters
    Category:Supernatural Willpower Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
