    to deliver heavy blows during close quarter combat, capable of piercing and cutting
    through Warframe armor with ease. *Dread: The arrows fired by Dread are specially
    designed for decapitation allowing Stalker to quickly dispatch off-guard foes.
    *Despair: Throwing daggers designed to have a mono-molecular edges that can cut
    into most materials. *War: The Great sword wielded by Shadow Stalker and created
    from a piece of the Sentient war-leader Hunhow''s body. War has the ability to
    fire waves of energy with each swing allowing it hit foes twice when at a close
    range. The sword sustains Stalker''s connection with Hunhow and allows them to
    communicate regardless of distance. *Enlightened Hate: After Stalker was infused
    with Jade''s light the Hate''s blade became covered in the same light, allowing
    it to burn enemies on contact and project orbs of jade light with each swing.'
