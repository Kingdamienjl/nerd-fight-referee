    - field: weaknesses
      value: Cannonbolt's bipedal form is top-heavy, making him very unbalanced and
        clumsy. This is because Arburian Pelarotas are made to spin, not walk. Cannonbolt
        cannot roll over slippery surfaces, such as a Gourmand's slime spit, as it
        will cause him to immediately uncurl from his sphere form and fall over. Cannonbolt
        can be trapped by strong adhesives, such as those used by the Stalker. Similarly,
        he can be held in place by beings with as much strength as a Chimera Sui Generis.
        Cannonbolt's large body makes it hard for him to move in small spaces, such
        as in vehicles like the Proto-TRUK. Cannonbolt can be incapacitated by electricity
        when not curled into a ball, such as that generated by a Transylian. Similarly,
        Cannonbolt can be burned by extremely hot objects when not curled into a ball.
        In his uncurled form, Cannonbolt can be controlled by a Vladat via their Corrupturas.
        Cannonbolt's bipedal form is top-heavy, making him very unbalanced and clumsy,
        though he can still manage to use his curled shape to enhance his agility.
        Cannonbolt cannot roll on sand or slippery surfaces, the latter of which has
        been demonstrated with Wreckingbolt. Cannonbolt is vulnerable to electricity.
        Cannonbolt can be affected by Nanny Nightmare's Baby Powder, as demonstrated
        with Wreckingbolt. == Notes == == Statistic Values == Category:DJthisben10guy
