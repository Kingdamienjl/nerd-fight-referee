    - field: powers_and_abilities
      value: '* Alien Physiology (All of Ben''s alien transformations follow the same
        rules and physiology as the Omnitrix, while also possessing all of its powers,
        functions, and resistances. While most of its functions have to be activated
        in specific manners, it also includes more passive ones) * Superhuman Characteristics
        and Physiology ** Enhanced Senses (Excellent Hearing & Eyeless Vision; The
        fur on his body registers shifts in the air and motion around him, giving
        him "eyeless" vision) * Attack Reflection (His shell can reflect lasers, as
        shown here) * Sphere Transformation (Cannonbolt can curl into a ball, encasing
        himself in his plating. In general, the Arburian Pelarota species mostly used
        this maneuver for defense, like an armadillo. However, since Ben did not know
        about this when discovering Cannonbolt, he weaponized Cannonbolt''s originally
        defensive capabilities. Cannonbolt is nigh-invulnerable when curled into a
        ball, so invulnerable that he can survive a fall from Earth''s atmosphere
        without suffering damage. When rolled up, Cannonbolt becomes like a motorized
        wheel that can move at great speed https://ben10.fandom.com/wiki/File:Cannonbolt_Chemicals.png
        because of chemicals in his exo-plates that reduce friction and can increase
        his rotational momentum to slam into and/or run over enemies. Cannonbolt can
        ricochet and bounce off surfaces like a pinball in sphere form, suffering
        little-to-no loss in momentum. Cannonbolt can also house people and fairly
        large objects within his spheroid form and provide them the same level of
        protection that he has. In his spherical form, he can bounce to create shockwaves
        or spin into a fierce tornado.) ** Superspeed (Type 1) ** Electric Conductivity
        Empowerment (Can get empowered with electricity by an ally) ** Underground
        Mobility and Acrobatics (Here) ** Surface Scaling (Can roll on walls) ** Shockwave
        Creation & Vortex Generation (Via Impact and spinning) ** Resistance *** Acid
        (Here) *** Magma (Shrugged off Magma interaction) *** Heat & Radiation (Survived
        reentry) *** Extreme Temperatures (Effortressly survived on Mikdlty) *** Limited
        Friction *** All Previous but Enhanced *** Spike Covered Body & Metalic Body
        (Ultimate Cannonbolt appears to be covered in metal, and has spikes all over
        his body, he as well seems even more immune to radiation, since he''s unbothered
        by P''andor) **** Superhuman Physical Characteristics **** Sphere Transformation
        **** Vortex Generation (Via spinning) **** Attack Reflection (Can reflect
        lasers) **** Water Rolling (Can surf on water) **** Fire Resistance **** Omni-Enhanced
        Form ***** All previous but Enhanced ***** Empowerment, Statistics Amplification,
        Electricity Manipulation, Fusionism & Earth Manipulation (This form allows
        him to fuse his powers with Shock Rock, allowing his attacks to be enhanced
        with electricity and infused with rock. Can shoot earth projectiles) ****
        Omni-Kix Form ***** All previous but Enhanced ***** Armor Creation, Statistics
        Amplification & Nanotechnology (Omni-Kix is an armor-based power-up introduced
        in Season 4 of the Ben 10 reboot. It was unlocked when Ben inserted a special
        key he discovered inside the Omnitrix containment pod. This feature grants
        all of Ben''s forms enhanced physical armor and general empowerment) *****
        Energy Manipulation (Omni-Kix Cannonbolt rolling around in one place can cause
        a green kinetic energy build up, which he can use to his advantage) *****
        Underwater Breathing *****Superhuman Physical Characteristics *****Sphere
        Transformation'
