- id: claim-powers-and-abilities-b7fbfa82
  section: abilities
  axis: hax
  text: "* Superhuman Physical Characteristics ** Self-Sustenance (All Types) * Absorption\
    \ (of Rings) * Statistics Amplification (The Gravity Dive enables the ability\
    \ to destroy large obstacles that would otherwise be too tough to obliterate)\
    \ * Inorganic Physiology (Type 2) ** Electricity Manipulation and Paralysis Inducement\
    \ (Both GP and HD's attacks induce electric shock on the target that temporarily\
    \ paralyzes them) ** Flight (All SCR units can fly with the jets on their back)\
    \ ** Transformation (SCR units can curl into a ball to act as their own Extreme\
    \ Gear) ** Gravity Manipulation & Pseudo-Black Hole Creation (SCR-HD is fueled\
    \ by an Ark of the Cosmos, which amplifies gravity to form black holes, and both\
    \ it and GP are capable of using Gravity Control and Gravity Dive) ** Self-Destruction\
    \ (Upon scanning another Ark of the Cosmos, SCR-HD suddenly exploded) ** Limited\
    \ Resurrection (Eggman hypothesized that the reason SCR-HD was still active after\
    \ exploding was due to an electromagnetic pulse reactivating its buffer) ** Limited\
    \ Technology Manipulation (The stone's power can control all the SCR robots when\
    \ combined with the Mother Computer. All the SCR units follow HD due to it possessing\
    \ an Ark of the Cosmos) ** Magnetism Manipulation (The Arks exude a unique magnetic\
    \ field, and all the Arks attract each other) ** Energy-based Transmutation (The\
    \ Arks can convert mass-energy into other types of energy, with a range encompassing\
    \ an entire planet) SCRs don't have an Extreme Gear to use, as they transform\
    \ themselves into Wheel-type Extreme Gear. For a more exhaustive look at the abilities\
    \ and powers Extreme Gear provide, consult this page. * Enhanced Acrobatics *\
    \ And several more as listed in the Extreme Gear page's universal abilities. *\
    \ Damage Transferal (Up to 1-C (6-D) AP with Rings. Rings completely shield the\
    \ user from harm so long as they have at least 1 in their possession. Upon taking\
    \ an instance of damage, a varying amount will scatter from the one who collected\
    \ them with higher durability causing less to drop. Rings have repeatedly shown\
    \ the capacity to protect Base characters from villains far stronger than them,\
    \ ranging from the likes of VoidSonic Shuffle to amped Titans such as SupremeSonic\
    \ Frontiers: Another Story (vs The End)), * Healing & Stamina Recovery (Ring energy\
    \ revitalizes the wielder and restores energy, as noted with Silver wanting to\
    \ use some to replenish his energy. Rings are referred to by The End as being\
    \ vitality) * Statistics Amplification (Ring energy in the Sonic Riders series\
    \ can amplify the user\u2019s speed by nearly 2x and increases their boost duration\
    \ by nearly 2 seconds when going from level 1 to 3. Master Core: ABIS= Same as\
    \ before minus Ring-based abilities and Transformation * Large Size (Type 0) *\
    \ Fusionism (Merged with the core unit of Babylon Garden) * Energy Projection\
    \ (Can fire blasts from its arm cannon) * Earth Manipulation (Can condense several\
    \ chunks of space debris together to hurl at targets) * Enhanced Black Hole Creation\
    \ (Fueled by all 5 Arks, forming a supermassive black hole threatening to suck\
    \ in the planet) * Enhanced Gravity Manipulation (Can induce Gravity Control on\
    \ a scale encompassing the entirety of Babylon Garden, forcing all racers to enter\
    \ Gravity Dive)"
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
