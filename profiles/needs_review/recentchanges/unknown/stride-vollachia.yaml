- id: claim-standard-equipment-815d3382
  section: equipment
  axis: equipment
  text: '*Gospel: A black book which list the users future. However the details are
    vague and incomplete, and often up to interpretation. *Curse Rings: Stride wears
    five meteor rings on both hands which he can use to cast curses on people. The
    ring on his little finger is known as the Scarlet Little Finger, and it is capable
    of casting a curse that rots the target''s limbs, eventually leading to death.
    He is also able to use the other rings to cast curses on others to bind them to
    his will. Some examples of the curses effects include targets obeying each of
    his commands, and being able to asphyxiate someone from a distance when their
    loved one touches them. *Yang Sword Vollachia: As a member of the royal family,
    Stride was able to summon an ornate crimson sword from light just like Vincent
    Vollachia.'
  source_ids: *id003
  decisive: false
  status: unverified
