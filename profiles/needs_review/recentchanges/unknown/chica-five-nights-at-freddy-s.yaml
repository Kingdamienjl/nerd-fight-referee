        Information Analysis (Some of the toy animatronics parts have been put in
        the old animatronics, the toys have a facial recognition software to detect
        criminals), passive Technopathy (Chica's mere appearance causes the technology
        to flicker and turn off, all animatronics upon entering a room causes the
        camera to go static), Berserker Mode (Goes into an aggressive state around
        adults, even to the point of overcoming their innate passivity during the
        day), Resistance to Electricity Manipulation (Every animatronic in Pizzeria
        Simulator can be shocked without much damage. Sister Location animatronics
        can take controlled shocks), Enhanced Bite Non-Corporeal (Chica is possessed
        by the spirit of a dead child), Self-Sustenance (Types 1, 2, & 3), Immortality
        (Types 7 & 8; Is a ghost, and will only rest if the "Happiest Day" is achieved),
        limited Possession (Of inanimate objects; Comparable to the crying child in
        Golden Freddy and the Puppet), Undead Physiology, Flight (As ghosts, they
        can naturally fly), Invisibility (They can turn invisible after William Afton's
        supposed death), Time Travel (Should scale to Shadow Bonnie, who can travel
        back to the Crying Child's party and give them cake), Acausality (Unaffected
        by Shadow Bonnie going back in time and giving them cake as they still roam
        around in FNaF 1), Extrasensory Perception (They are able to see Shadow Freddy),
        Fear Manipulation, Illusion Creation (The crying children can create hallucinations
        of their cries on walls)
