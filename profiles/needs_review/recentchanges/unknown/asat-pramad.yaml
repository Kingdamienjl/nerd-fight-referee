        \ static states at the information substrate level. Objects remain physically\
        \ present but lose their \"living/dynamic\" essence, becoming monochromatic,\
        \ static representations of themselves. *Conceptual Erasure (Passive) \u2014\
        \ Erases the conceptual data of anything it seeps through, rendering it unreadable\
