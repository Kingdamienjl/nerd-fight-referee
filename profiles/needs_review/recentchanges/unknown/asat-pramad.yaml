    - field: powers_and_abilities
      value: "*True Namelessness \u2014 Any label directed toward AUP loses its destination\
        \ before arriving. The God of Layer Two's naming ability \u2014 which functions\
        \ as the act of creation itself, anchoring existence into the base substrate\
        \ of information \u2014 failed entirely upon contact with AUP. The definition\
        \ simply vanished without reaching any target. *Unregistered Existence \u2014\
        \ AUP is not hidden or cloaked; it is literally absent from every information\
        \ system across all layers simultaneously. Even a total sweep of every consciousness\
        \ in Layer Two \u2014 every human, every infant, every bird \u2014 returned\
        \ zero traces of AUP. *Acausality (Type 5; see classification note below)\
        \ \u2014 AUP exists at a level where the concept of causality was never established\
        \ as a functional framework. It is not \"immune to causality\" (which would\
        \ imply causality exists and AUP resists it). It is not \"outside causality\"\
        \ (which would imply causality is a container and AUP is beyond its walls).\
        \ AUP simply has no address in any causal system. Causality requires: *Cause\
        \ \u2192 Effect (temporal/logical sequence) *Dependency (one thing requires\
        \ another) *Directionality (before \u2192 after) AUP has none of these: *No\
        \ cause: AUP was never \"caused.\" It was not created, spawned, or generated.\
        \ It was found, already present, before any system existed. *No effect: AUP\
        \ does not \"do\" anything. It does not act, influence, or change. Its \"\
        effect\" is purely passive \u2014 absence filling space. *No temporal position:\
        \ AUP is not \"before\" or \"after\" anything. It exists at the point where\
        \ the concept of sequence was never written. *No dependency: AUP does not\
        \ depend on causality to exist. Removing all causality from all systems would\
        \ not affect AUP, because AUP was never registered in any causal chain to\
        \ begin with. Rewriting causality, reversing cause and effect, severing causal\
        \ links, or establishing new causal laws \u2014 none of these operations are\
        \ applicable, because they all require a target that exists within a causal\
        \ framework. AUP does not. \u26A0\uFE0F Classification Note: AUP is listed\
        \ as Acausality Type 5 on this wiki because that is the closest available\
        \ conventional classification. However, even \"Type 5 \u2014 Transcendence\
        \ of Causality\" is not a fully accurate descriptor. \"Transcendence\" implies\
        \ that causality exists as a structure and AUP is above or beyond it. This\
        \ is still too relational. AUP is not \"above causality.\" AUP is not \"beyond\
        \ causality.\" AUP exists at a level where the distinction between \"within\
        \ causality\" and \"outside causality\" was never drawn. Type 5 is used here\
        \ because the wiki's classification system requires a label, and Type 5 is\
        \ the least inaccurate option. AUP does not \"transcend\" causality any more\
        \ than it transcends gravity, language, or mathematics. It simply was never\
        \ registered in any of these systems. A more precise (but unwieldy) descriptor\
        \ would be: \"Causality-Inapplicable (Pre-Systemic Absence).\" *Inherent Untargetability\
        \ \u2014 AUP is not untargetable because it resists targeting. It is untargetable\
        \ because the concept of 'target' requires a registered coordinate to function\
        \ \u2014 and AUP has no registered coordinate in any information system across\
        \ any layer. There is no object for the targeting to be directed toward. The\
        \ absence is not a defense; it is a property of AUP's fundamental nature.\
        \ *System Immunity \u2014 All powers that operate within any causal system\
        \ in any layer are inapplicable against AUP. This is not a resistance; it\
        \ is the absence of the substrate that power requires to function. *Pre-fiction\
        \ Existence \u2014 Exists prior to the narrative of A Game Syndrome itself,\
        \ and prior to the author's own layer. As stated by the author: \"AUP was\
        \ there before the first word of chapter one. It was there before I had the\
        \ concept for this story. It exists in every fictional cosmology that has\
        \ ever been written \u2014 not because I put it there.\" *Information Substrate\
        \ Manipulation \u2014 Touches the information substrate of every object it\
        \ passes through, altering the foundational layer beneath matter, energy,\
