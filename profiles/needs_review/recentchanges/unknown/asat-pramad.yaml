  range:
    text: "Extented Melee Range with Weapons, Tens of Meters as Lord of Sa\u1E43vartasth\u0101\
      yi, Intergalactic up to High Complex Multiversal & Extradimensional with Honkai\
      \ Energy, Powers and Abilities (Lord Ravagers/Overlords are capable of incinerating\
      \ entire galaxies. Should be comparable to Zephyro, who destroyed the Tia'nua\
      \ galaxy between 2157 AE and 2158 AE.IPC Broadcast #1 A single Amber Era ranges\
      \ from 76 to 240 Trailblaze Years, with the Trailblaze Calendar being a close\
      \ analog to the Gregorian calendar. Completely destroyed dozens of celestial\
      \ bodies and galaxies, resulting in a massive singularity being created. Emanators\
      \ can draw power from their respective Aeons, who are Higher-Dimensional beings\
      \ and congregations of Imaginary Energy. Emanators are also capable of traveling\
      \ through imaginary spaces as well as tidal zones between worlds11-D)"
    source_ids:
    - vsbattles-asat-pramad-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Extraordinary Genius (Regarded as a chess master capable of leading armies\
      \ to slowly chip away at a planet\u2019s resistance and push it to structural\
      \ collapse. His campaigns led many planets, such as Syracuse-III, Red Babel,\
      \ the Ogul ring, and many others, to their end.List of Archenemies During the\
      \ fall of the Ogul ring, Asat Pramad slowly pushed his forces, just to manipulate\
      \ the enemy resistance into spelling the following words with their formation:\
      \ \"Destruction is where laughter ends. It is mourning, not celebration\u201D\
      .Date Bank, Lord Ravengers-Destruction As Navigator Isee, he orchestrated a\
      \ death game, culling out unwanted members in the Astral Express, leaving only\
      \ him and his successor, Falcon Amundsen.Improv Tour Trailer: \"Death of the\
      \ Elation\"Relic, As Navigator Isee Sees It: Navigator's Game Die During the\
      \ events of Planarcadia, Asat Pramad murdered Ryusuke Murata and stole his identity.\
      \ By larping as Ryusuke's identity, Asat Pramad raised his daughter, Himeko,\
      \ fostering her into becoming a proper Nameless. Implied to be the one who sponsored\
      \ Marcus Antali, leading him into becoming the Herald of Death. He also gave\
      \ Fulwish Shuhu\u2019s flesh, allowing her to become the 2nd Herald of Death.\
      \ Through these actions, Asat Pramad was able to accumulate a massive quantity\
      \ of fear that amplifies his power. Additionally, he exploited a loophole in\
      \ the Phantasmoon Games rules, making Evacenscia lose her position as Arbitrator)"
    source_ids:
    - vsbattles-asat-pramad-unknown
    confidence: 0.6
    notes: auto_repair source extraction
