    notes: auto_repair source extraction
  attack_potency:
    text: "Galaxy level (As an Emanator of Destruction, a Lord Ravager, Asat Pramad\
      \ is vastly stronger than Pathstriders and mere mortals,Data Bank Factions:\
      \ Self-Annihilator \u2014 NihilityGalactic Archives | \"Destruction\" and Lord\
      \ Ravagers which should make him more powerful than the Giant Sting. Lord Ravagers/Overlords\
      \ are capable of incinerating entire galaxies.Welt, About the Galaxy - About\
      \ the Aeons Easily overpowered the Trailblazer, Silver Wolf, and Murata Graphia\
      \ at the same time. Easily fought and kept up with General Yao Guang, Welt Yang,\
      \ and Permansor Terrae at the same time>304.53235 ZettaFoe), Multi-Galaxy level\
      \ as Lord of Sa\u1E43vartasth\u0101yi (Fought and easily defeated the Trailblazer,\
      \ Himeko, Welt, Evernight Form March 7th, Permansor Terrae, Sunday, and Pom-Pom\
      \ at the same time. Obliterated dozens of celestial bodies and galaxies, resulting\
      \ in a massive singularity being created. Fought and kept up with Himeko \u2022\
      \ Nova and the Starblazer)"
    source_ids:
    - vsbattles-asat-pramad-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: "FTL+ (As an Emanator, Asat Pramad should be faster than Welt Yang. Asat\
      \ Pramad was able to easily react to and dodge attacks from Murata Graphia and\
      \ partially transformed Silver Wolf, immediately following up by speed-blitzing\
      \ the Trailblazer and attacking them before they could react. Asat Pramad was\
      \ also able to dodge attacks from Permansor Terrae, Welt Yang, and Yao Guang\
      \ simultaneously,Non-Existent State although Dan Heng notes that the reason\
      \ they couldn't hit him was due to the abilities of his Die.Every Arcadian Corner\
      \ All At Once Avoided Himeko's attacks11c (10x the original calculation)), higher\
      \ as Lord of Sa\u1E43vartasth\u0101yi (Easily kept up with the Trailblazer,\
      \ Himeko \u2022 Nova, Starblazer, Welt, Evernight Form March 7th, Permansor\
      \ Terrae, Sunday, and Pom-Pom at the same time)"
    source_ids:
    - vsbattles-asat-pramad-unknown
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: "Pre-Stellar (Clashed against Welt and easily flicked the Trailblazer away.\
