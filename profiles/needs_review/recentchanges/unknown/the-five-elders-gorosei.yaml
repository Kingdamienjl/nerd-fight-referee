    \ 107 Chapter 1085 Their mere presence was enough to visibly bewilder Rob Lucci,\
    \ a seasoned assassin and one of CP0's top agents) *Transformation (The Elders\
    \ can transform into full YokaiOne Piece Vol. 109 Chapter 1108 or a half human\
    \ hybridsOne Piece Vol. 108 Chapter 1094) *Summoning, Portal Creation, Electricity\
    \ Manipulation, and Fire Manipulation (Anyone who has the mark can travel through\
    \ Abyss pentagrams. Usage of these pentagrams typically generates large streaks\
    \ of black lightning and flamesOne Piece Vol. 109 Chapter 1109) *Immortality and\
    \ Regeneration (Type 1 - St. Saturn has lived for over 200 years, showing no signs\
    \ of agingOne Piece Vol. 111 Chapter 1125; Type 2 - Can survive and remain conscious\
    \ after having large portions of his body destroyedOne Piece Vol. 110 Chapter\
    \ 1121; Type 3 and 8 - at least High, possibly higher; The Five Elders can regenerate\
    \ from any and all forms of physical damage, including complete bodily vaporization.One\
    \ Piece Vol. 110 Chapter 1111 When no biological matter remains, black flames\
    \ manifest, from which they begin to regenerate.One Piece Vol. 110 Chapter 1120\
    \ Their existence is sustained through their connection to Imu, making them invulnerable\
    \ to conventional means; as death can only occur if this connection is severed)\
    \ *Concussive Blast and Limited Durability Negation (St. Saturn can send a concussive\
    \ blast activated through his eyes which allows him to harm people from a range.\
    \ This attack is potent enough to take the heads off of weaker opponents and deal\
    \ significant internal damageOne Piece Vol. 108 Chapter 1095 to characters relative\
    \ to himselfOne Piece Vol. 109 Chapter 1107) *Paralysis Aura (St. Saturn is able\
    \ to activate an aura which pins down everyone around himOne Piece Vol. 109 Chapter\
    \ 1103) *Fire Manipulation, Explosion Manipulation, and Minor Danmaku (28000\xBA\
    C - St. Saturn can spit dozens of explosive balls from his mouth that detonate\
    \ on impact) *Additional Limbs, Bodily Weaponry, and Poison Manipulation (Each\
    \ of the limbs in St. Saturn's Gyuki form are coated in a deadly poison which\
    \ he uses to attack his opponents) *Surface Scaling (Scaled up from the Fabiriophase\
    \ of Egghead Island all the way up to it's Labophase in the skiesOne Piece Vol.\
    \ 110 Chapter 1112) *Acrobatics and Limited Flight (Self-Momentum; St. Saturn\
    \ can change directions mid-flight) St. Marcus Mars= *Heat Manipulation, Energy\
    \ Manipulation, and Breath Attack (28000\xBAC - St. Mars can fire energy beams\
    \ from his mouth that have high temperaturesOne Piece Vol. 110 Chapter 1119) *Flight\
    \ (St. Mars can fly in his Itsumade form) St. Topman Warcury= *Flame Manipulation\
    \ (28000\xBAC - St. Warcury can generate flames that are hot enough to burn Luffy)\
    \ *Acrobatics, Bodily Weaponry, Transformation, and Limited Metal Manipulation\
