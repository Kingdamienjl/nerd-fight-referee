- id: claim-weaknesses-1a08d23e
  section: weaknesses
  axis: weakness
  text: "Prometheus still feels the multiplied pain when using Acantha, despite having\
    \ built up a resistance to it alongside his high mental fortitude. Notable Attacks/Techniques:\
    \ Gkremos_Arkan.png|Gkrem\xF3s Archon: Divine Punishment in Chains Deno_Altair.png|Deno\
    \ Altair - Eagle's Break *Gkrem\xF3s Archon: Divine Punishment in Chains: Prometheus\
    \ drags his opponent towards him via his chains, meeting them with a powerful\
    \ headbutt straight to their head using all of his strength. A headbutt from Prometheus\
    \ is capable of instantly killing other Gods on the level of Bia. *Deno Altair\
    \ - Eagle's Break: A technique used by Prometheus as a follow-up to his Gkrem\xF3\
    s Archon, where Prometheus ties up his stunned opponent with Acantha, and delivers\
    \ a brainbuster wrestling throw, directly colliding them into the ground. This\
    \ move was capable of briefly stunning Sun Wukong. ==Notable Matchups== Victories:\
    \ Losses: Inconclusive: ==References== Category:Characters Category:Male Characters\
    \ Category:Manga Characters Category:Record of Ragnarok Category:Titans Category:Gods\
    \ Category:Greek Gods Category:Immortals Category:Invulnerability Users Category:Supernatural\
    \ Willpower Users Category:Social Influencers Category:Pain Users Category:Chain\
    \ Users Category:Prisoners Category:Weapon Masters Category:Martial Artists Category:Good\
    \ Characters"
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
