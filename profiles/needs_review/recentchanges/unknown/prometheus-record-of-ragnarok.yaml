- id: claim-standard-equipment-a31deb2c
  section: equipment
  axis: equipment
  text: "Acantha: Prometheus\u2019 Divine weapon, which are chains forged by Zeus\
    \ on request of Prometheus himself, as per his punishment. Anyone caught in Acantha,\
    \ including Prometheus, feels every instance of pain they take multiplied hundredfold.\
    \ Prometheus has experienced enough torture throughout his life that he is easily\
    \ capable of withstanding the pain multiplier from Acantha, and can willingly\
    \ choose to take them off should he wish. This weapon has since been destroyed\
    \ by Sun Wukong releasing 15% of his stored power during the second bout of the\
    \ Gods' Apocalypse."
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
