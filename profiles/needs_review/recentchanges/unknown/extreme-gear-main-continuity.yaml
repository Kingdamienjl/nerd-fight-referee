- id: claim-powers-and-abilities-8d6e1a06
  section: abilities
  axis: hax
  text: '*Technological Flight (All Extreme Gears are able to take flight, their ability
    to do so hinted by Tails to relate to the Kutta-Joukowski Theorem) **Possibly
    Spaceflight (Extreme Gear are said to ''float in space''. The original Extreme
    Gear were developed by the Babylonians, who are aliens that invented space travel)
    *Additional Limbs (Extreme Gear come equipped with a cord to attach to other riders
    to allow both to ride on the Gear) *Air Manipulation (Many Gears run off of Air,
    allowing them to create tornadoes with the Tornado Trap at the cost of large amounts
    of Air, as well as perform Air Boosts to increase speed, drift to make turns around
    tight corners, and regain Air via performing Tricks, doing specific actions like
    grinding/air riding/smashing obstacles, or reaching an Air refueling station)
    *Gravity Manipulation (Many of the Gears in Sonic Riders: Zero Gravity enhance
    the natural use of gravity manipulation from the Gravity Band/Arks of the Cosmos,
    either by increasing the storage amount of Gravity energy, enhancing the effectiveness
    of gravity dives or Gravity Control, or by regaining Gravity energy by performing
    Gear-specific actions and Tricks) *Transformation (The Gear in Sonic Riders: Zero
    Gravity can transform into alternate forms by expending rings, primarily into
    the Bike, Wheel, Air Ride, or Yacht-type gears to unlock new movement abilities)
    *Berserk Mode (Riders can use specific power-ups to enter an "Attack Mode" state
    where they will immediately damage and stun any riders they pass on the track
    for a limited time) *Non-Physical Interaction (Can be used to ride on rainbows,
    as well as lasers and stardust roads) *Friction Resistance (Due to being hoverboards,
    can travel in off-road areas without losing much speed, with some Gears having
    increased effectiveness in this field) *Speed Amplification (Extreme Gears are
    capable of boosting the speed and acceleration of their riders, with some Gear
    having far more speed potential than others) *Self-Statistics Reduction (Many
    gears will sacrifice one attribute to boost others, including top speed, amount
    of Air and gravity energy that can be gained, or cornering ability) *Limited Fusionism
    (Merges the Air Tanks of two Extreme Gear together so that the air gain and loss
    of one Gear affects the other and vice versa) *Electricity Manipulation & Extrasensory
    Perception (Using a radar tracker, the linked Extreme Gear can sense the progression
    of each other, so if one gets too far ahead, it administers an electric shock
    to the further rider to slow them down) Gear Parts: *Speed Amplification & Friction
    Resistance (Start Speed Up, Max Speed Up & Durability Up increase the acceleration,
    top speed, and endurance stat of the board) *Rail Grinding, Strength Amplification
    & Flight (Start Speed Up, Max Speed Up, Durability Up: grant the type-specific
    board abilities from Sonic Riders: Zero Gravity to any Gear) *Invisibility & Intangibility
    (1 layer. Invisibility turns the rider invisible and intangible to attacks, even
    from characters like Knuckles who can tag King Boom Boo) *Air Manipulation (Air
    Saver decreases consumption of air boards use when doing air-hungry actions) *Air
    Manipulation & Speed Amplification (Trick Boost/Rapid Dash/Rapid Stream give a
    speed boost after landing a Trick, doing a kick Dash, or riding a Slipstream respectively)
    *Air Manipulation (Extra Air/Air Plus increases Air Gauge capacity or amount of
    Air gained from Tricks) *Magnetism Manipulation (Ring Eater pulls in nearby Rings)
    *Probability Manipulation (Item Lock Rings/Air forces random item boxes to spawn
    only power-ups that increase Ring count or Air supply respectively) *Sound Manipulation
    (Non-Combat Applicable; Music Change 1/2: Changes the background noise to match
    one of two iconic music pieces) Power-Ups: *Creation (Tee Shot/Free Throw creates
    a giant golf ball or basketball to damage enemies) *Speed Amplification (Soda
    Rocket/Octo-Boost: creates an octopus or soda can that grants Extreme Gear Riders
    a temporary speed boost) *Homing Attack & Explosion Manipulation (Target Torpedo
    creates a homing missile that locks onto enemies) *Creation (Ring Can creates
    a can that, when shaken, releases a shower of Rings) *Limited Existence Erasure
    (Bowling Strike summons bowling balls that damage opponents and erase Rings they
    roll over) *Organic Manipulation & Status Effect Inducement (Octo-Ink summons
    an octopus which squirts ink behind itself, creating an ink bubble that obscures
    the vision of those who ride into it) *Status Effect Inducement (Colorball obscures
    the vision of those who pick up the item with a myriad of colors) *Explosion Manipulation
    (Explosion/Missile creates a bomb that either rolls along the ground or can be
    thrown, which explodes after a certain amount of time. Or, summons a missile which
    can be launched by Gravity Control, which explodes upon hitting the ground. Both
    also have slight homing properties, as they will turn away from walls to avoid
    wasting the explo'
