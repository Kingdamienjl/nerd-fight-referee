- id: claim-weaknesses-85dc114e
  section: weaknesses
  axis: weakness
  text: 'Extreme Gears are prone to technological interference. Note: For a more in-depth
    guide on every type of Extreme Gear, consult this page. Notable Attacks/Techniques:
    {| class="wikitable" data-table="soundtrack" ! style="width: 20%"|Gear Skills/Parts
    ! style="width: 80%"|Description ! style="width: 10%"|Example |- |Tricks: | When
    jumping off a ramp, an Extreme Gear user can perform a series of mid-air movements
    to create stylish trick combos. A more impressive combo produces higher amounts
    of air or gravity points, which Extreme Gear require to do many of their actions.
    |thumb|305px|Extreme Gear riders doing tricks after jumping off a Ramp. |- |Boost/Kick
    Dash: | Extreme Gear can expend air to perform a boost, allowing them to surge
    forward at high speeds. |thumb|305px|Performing a dash via kicking off the ground
    and expending air. |- |Drift: | The Extreme Gear expends Air to allow the user
    to maneuver around tight corners, before rocketing off in the chosen direction
    upon completion of the drift. |thumb|305px|Extreme Gear riders drifting around
    a corner. |- |Turbulence Riding: | If an opponent is leaving behind a Slipstream,
    Extreme Gear can allow a rider to be carried along by the wind trail to move faster,
    even allowing tricks to be performed at the tips of the Slipstream. |thumb|305px|Extreme
    Gear riders using turbulence to speed up. |- |Tornado Trap: | Extreme Gear can
    expend a large amount of Air to leave behind a tornado, which trips up anyone
    behind the Gear for several seconds. |thumb|305px|Extreme Gear creating a tornado
    to stun enemies. |- |Grinding: | Certain Gear types can allow the rider to move
    along thin rails, increasing their speed and allowing access to otherwise unreachable
    areas. |thumb|305px|Extreme Gear user grinding on rails to speed up. |- |Air Riding:
    | Certain Gear types can allow the rider to fly in the air and pass through Accelerator
    Rings, maintaining aerial momentum and allowing access to otherwise unreachable
    areas. |thumb|305px|Extreme Gear user flying through Accelerator Rings to stay
    airborne. |- |Obstacle Breaking: | Certain Gear types can allow the rider to punch
    their way through barricades or other obstructions, allowing access to otherwise
    unrestricted areas and acting as a strength increase. |thumb|305px|Extreme Gear
    user punching through vehicles. |- |Attack Mode: | With the proper items equipped,
    an Extreme Gear can empower its rider to move forward at high speeds without riding
    the Gear, as well as boosting their strength to enable them to deliver devastating
    blows. This boost also allows the rider to access certain shortcuts that the Extreme
    Gear is unable to reach. |thumb|305px|Extreme Gear Riders getting off their board
    to attack enemies. |- |Special Item: | Similar to the Extreme Gear''s Attack Mode,
    but also granting unlimited Air for the Extreme Gear. |thumb|305px|Extreme Gear
    rider charging forward to attack. |- |Extra Air: | Increases the maximum amount
    of Air an Extreme Gear can hold. |thumb|305px|Extreme Gear Rider receiving a large
    boost in air storage for their Gear. |- |Air Saver: | Decreases the amount of
    Air used when drifting or boosting with Extreme Gear. |thumb|305px|Extreme Gear
    user being able to boost more than usual. |- |Air Plus: | Increases the amount
    of Air gained by doing tricks or Extreme Gear shortcuts. |thumb|305px|Extreme
    Gear air riding having boosted air accumulation. |- |Big Air: | Increases the
    amount of height gained when Extreme Gear users jump into the air. |thumb|305px|Extreme
    Gear user getting making a massive jump off a ramp. |- |Trick Boost: | Gives a
    speed boost after an Extreme Gear user completes a Trick. |thumb|305px|Tricks
    giving the Extreme Gear a speed boost. |- |Rapid Dash: | Gives a speed boost after
    performing a Kick Dash. |thumb|305px|Extreme Gear rider getting a huge speed boost
    from a Kick Dash. |- |Rapid Stream: | Gives a speed boost after riding in an opponent''s
    Slipstream. |thumb|305px|Extreme Gear Rider speeding up by catching a Slipstream.
    |- |Max Speed Up: | Increases the top speed of the Extreme Gear. |thumb|305px|Extreme
    Gear with this perk having extremely high top speed vs without. |- |Starting Speed
    Up: | Increases the acceleration of the Extreme Gear. |thumb|305px|Skill Booster
    gear allowing Extreme Gear rider to regain speed quickly. |- |Durability Up: |
    Decreases the amount of friction of the Extreme Gear, allowing it to more easily
    go over rough terrain. |thumb|305px|Extreme Gear moving over rough terrain. |-
    |Item Lock: Rings: | Makes it so random Item Boxes only drop Ring caches. |thumb|305px|Extreme
    Gear user picking up only Rings when boosted by this perk. |- |Item Lock: Air:
    | Makes it so random item boxes only drop air caches. |thumb|305px|Extreme Gear
    users getting a huge amount of air from Item Boxes. |- |Ring Eater/Magnetic Barrier:
    | Attracts nearby Rings to the Extreme Gear. This can either be done via the Ring
    Eater Extreme Gear part, or the Magnetic Barrier picked up from an item box.'
  source_ids: *id003
  decisive: false
  status: unverified
