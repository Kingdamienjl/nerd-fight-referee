    - field: attack_potency
      value: "Galaxy level (Matched and eventually overpowered Black Tide Aquila in\
        \ an energy beam clash. Defeated Black Tide Aquila alongside Dan Heng, Trailblazer\
        \ and Post-Dawnmaker Phainon where they dealt final blow together >304.53235\
        \ ZettaFOE) | Multi-Galaxy level (The Chrysos Heirs in the Final Cycle have\
        \ Ascended as the ultimate Titans of Amphoreus and have become amalgamations\
        \ of existences shaped through more than thirty million cycles of inheritance,\
        \ conflict, knowledge, remembrance, and conceptual reintegration made possible\
        \ by the Scepter's iterative and accumulative experimental cycles.As I've\
        \ Written, \u03B4-me13.exe, Experiment Phase: Final Cycle, Twelve TitansAs\
        \ I've Written, \u03B4-me13.exe, Experiment Progress: Era Nova, Titan / Chrysos\
        \ HeirsAs I've Written, \u03B4-me13.exe, Experiment Progress: Era Nova, Era\
        \ Nova Unlike the within-the-recurrence Chrysos Heirs, the Ascended forms\
        \ retain the memories, identities, and destinies of all prior iterations,\
        \ regarding earlier selves as incomplete or fragmented states.Hero, Return\
        \ to Dawn in Mortality Naturally, they surpass previous generations of other\
        \ cycles. Their existence is a synthetic apotheosis formed from the totality\
        \ of previous lives. By the end of the Final Cycle, through Cyrene and the\
        \ power of Remembrance, the Chrysos Heirs become beings preserved through\
        \ memory itself, their accumulated identities condensed into mementos carried\
        \ beyond. Fought alongside the rest of the Chrysos Heirs, Demiurge, Trailblazer,\
        \ March 7th, and Permansor Terrae against Incomplete IrontombHero, Return\
        \ to Dawn in Mortality2.93626771 RonnaFoe) | Multiverse level+ (After Demiurge\
        \ was gazed upon by Fuli, she used her power to restore and amped Hyacine.\
        \ Alongside the rest of the Chrysos Heirs, Demiurge, Trailblazer, March 7th,\
        \ and Permansor Terrae, she fought against and defeated Post Self-Coronation\
        \ Incomplete Irontomb.Pages, Ripples That Engrave Memories Contributed to\
        \ the \"Epics, As We've Written\" attack that was capable of severely damaging\
        \ Post Self-Coronation Incomplete Irontomb. Future Demiurge is the Pure Child\
        \ of An\u0101srava who gazed upon the Present Demiurge,Silver Chariot, Part\
        \ With That Humanity's Epic as the nature of Remembrance is stated to be the\
        \ causality that transcends timeData Bank: Aeons - Fuli the Remembrance)"
