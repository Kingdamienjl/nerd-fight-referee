    - field: intelligence
      value: "Gifted (Despite her young age, Hyacine possesses exceptional intelligence,\
        \ combining medical genius, tactical acumen, and combat proficiency. She demonstrates\
        \ a deep understanding of both physical and spiritual health, capable of healing\
        \ bodies and souls even when conventional methods fail. In combat, she exhibits\
        \ advanced strategic thinking, quickly assessing situations and combining\
