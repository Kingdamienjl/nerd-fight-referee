    - field: standard_equipment
      value: 'A Staff she can summon Long May Rainbows Adorn the Sky: Increases the
        wearer''s SPD by 18%. When the wearer uses Basic ATK, Skill, or Ultimate,
        consumes all allies'' HP equal to 1.0% of their current HP and additionally
        deals 1 instance of Additional DMG of the wearer''s memosprite Type equal
        to 250.0% of the total consumed HP to the attacked target after the next attack
