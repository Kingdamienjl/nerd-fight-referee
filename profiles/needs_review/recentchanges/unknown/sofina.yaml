- id: claim-weaknesses-aedb3418
  section: weaknesses
  axis: weakness
  text: 'Is practically defenseless without her magic Notable Attacks/Techniques:
    *Necrotic Strike: Her most common attack, Sofina delivers Necrotic magic either
    by touching a creature or blasting it. *Dimension Door: An spell that can make
    the user teleport to any spot within roughly 150 meters, Sofina can use it to
    escape dangerous situations or even hurt her opponent if the former is in the
    destination, although she can only use this spell twice a day she seemingly can
    use it at least three times in this time interval *Otiluke''s Resilient Sphere:
    Sofina can engulf at least two people in an inescapable sphere immune to all damage
    from inside or outside. She can use this spell twice an day *Swarm of Meteors:
    Once a day. Sofina magically calls down a meteor swarm that detonates in four
    12 meters radius spheres, destroying everything within their range *Animate Object:
    Sofina can make statues become alive while still maintaining their material properties,
    apparently she needs total concentration while using it, being unable to use other
    spells *Time Stop: Sofina''s trump card, once an day she creates an ever going
    sphere that stops everything it touches, she can easily stop an target for more
    than 30 seconds. A full list of Sofina''s spells can be see here ==References==
    ==Notable Matchups== Victories: Losses: Inconclusive: Category:Characters Category:Female
    Characters Category:Dungeons and Dragons Category:Wizards Category:Evil Characters
    Category:Undead Category:Immortals Category:Self-Sustenance Users Category:Status
    Effect Users Category:Summoners Category:Sealing Users Category:Smoke Users Category:Electricity
    Users Category:Curse Users Category:Death Users Category:Time Users Category:Transmutation
    Users Category:Durability Negation Users'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
