power_scale:
  tier:
    text: '4-B, higher with Power Cores. 3-C by Sonic Advance 3 | 3-C, possibly High
      3-A by Sonic Riders: Zero Gravity. 2-C by the IDW Comics'
    source_ids: &id002
    - mediawiki-487447
    confidence: 0.8
  attack_potency:
    text: 'Solar System level (Fought members of Adventure Team Sonic and Adventure
      Team Chaotix Defeated Chaos Gamma with Adventure Cheese at her disposal), higher
      with Power Cores. Galaxy level by Sonic Advance 3 (Can harm Adventure Gemerl
      and various machines comprised of both him and Eggtech) | Galaxy level, possibly
      High Universe level by Sonic Riders: Zero Gravity (Capable of harming other
      racers with her Extreme Gear, such as those who participated in the Babylon
      Guardian''s defeat). Low Multiverse level by the IDW Comics (Remains comparable
      to other Extreme Gear racers through Sonic Free Riders. [https://imgchest.com/p/ljyq5jeoey2
      Struck and harmed] Zeena with a Spin Attack)'
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Massively FTL+ ([https://imgur.com/a/wF2J1eq Stated to be faster] than Adventure
      Tails on her debut. Kept up with Adventure Amy throughout their adventure to
      find Adventure Sonic and Chocola. Can keep up with Sonic and is stated to be
      nearly as fast as him. Can keep with the likes of Adventure Gemerl and the Adventure
      Eggmobile even when mixed together, the later which performed this feat a technique
      that allowed Sonic, Tails Nine, and Renegade Knucks [https://imgur.com/zMhZa2V?r
      to blitz] [https://imgur.com/CLgsXJP?r a group of Eggforcers] that were [https://cdn.imgchest.com/files/6fa15317d45f.mp4
      initially blitzing them]) and with Power Cores | Massively FTL+ (Comparable
      to other Extreme Gear riders, as well as Cheese. [https://youtu.be/KUx_h4qgl5g
      Kept up with Modern Sonic]), higher with the Spin Attack
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class M (Should be comparable to Adventure Tails) | At least Class M (Stronger
      than before)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: 'Solar System level, higher with Power Cores (Can harm members of Adventure
      Team Sonic and Adventure Team Chaotix with the rest of Adventure Team Rose).
      Galaxy level by Sonic Advance 3 (Can destroy machines comprised of Eggtech and
      Adventure Gemerl) | Galaxy level, possibly High Universe level by Sonic Riders:
      Zero Gravity (Using her Extreme Gear, Cream is capable of harming the likes
      of Knuckles and Storm). Low Multiverse level by the IDW Comics (Harmed Zeena
      with a Spin Attack)'
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Solar System level (Can take attacks from members of Adventure Team Sonic
      and Adventure Team Chaotix) to Galaxy level by Sonic Advance 3 (Can take hits
      from Adventure Gemerl and variations of him combined with Eggtech), higher with
      Cream Guard (Cream's Guard Skill allows her to tank attacks that would normally
      be able to strike her down in one hit). Up to Complex Multiverse level Damage
      Transferal with Rings ([https://imgur.com/a/S9khfwT Having enough Rings] [https://imgur.com/a/qWYslO8
      shields damage from those as strong as] Void and Tethered Supreme) | Superhuman
      (Aided her friends throughout much of the Metal Virus plague, ultimately assisting
      in taking Zeena's Chaos Emerald from her and returning it to Modern Sonic alongside
      Modern Gemerl)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Journeyed for 3 days with minimal rest in her quest to get back
      Chocola, fighting Eggman's Badnik forces and traversing hazardous areas all
      the while) | Superhuman (Aided her friends throughout much of the Metal Virus
      plague, ultimately assisting in taking Zeena's Chaos Emerald from her and returning
      it to Modern Sonic alongside Modern Gemerl)
    source_ids: *id002
    confidence: 0.8
  range:
    text: 'Standard Melee Range. Tens of Meters with tornadoes and Cheese. {| class="mw-collapsible
