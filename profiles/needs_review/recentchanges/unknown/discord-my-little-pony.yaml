  section: abilities
  axis: hax
  text: 'Passive: *Superhuman Physical Characteristics **Immortality (Types 1, 2,
    3 & possibly 8 via scaling to Cosmos; Often dismembers himself with no problems
    and could think/remain conscious despite being turned to stone) **Natural Weaponry
    (Conventional; His hands have claws at the end of them) **Self-Sustenance (Types
    1 & 2 via scaling to Cosmos; Able to fly to space unharmed) **Abstract Existence
    (Type 2; Is a similar being to Cosmos in that both embody a concept, and even
    while depowered Cosmos has strongly implied she cannot be destroyed becau''se
    the concept she embodies cannot) **Acausality (Type 1; His aura of chaos prevents
    him from being affected by timeline changes) **Regeneration (Mid-High; Appeared
    from under the bed when his body on it turned into ascending bubbles) **Space
    Survival (An IDW comic cover shows that Discord can survive in space while other
    ponies require spacesuits. Hangs around the Horsehead Nebula on occasion with
    no protection) **Enhanced Senses & Extrasensory Perception (Has enhanced physical
    senses as well as the ability to sense the presence of magic and magical disturbances)
    *Incorporeality & Astral Projection (Fluttershy stated that Discord is a being
    of "pure chaos" and a Spirit of Disharmony. Could project a ghost form of himself
    even when his body was banished by Starlight) *Social Influencing (Constantly
    and masterfully manipulates those around him) *Empowerment (The Cutie Mark Crusaders
    getting into a fight and causing chaos is implied to have helped him escape his
    weakened seal; The comics have stated that causing chaos actively makes him stronger,
    and gives him more energy until he becomes "unstoppable") *Cosmic Awareness, Precognition
    & Retrocognition (Is stated to have knowledge that knows no bounds, as well as
    having such control over time and space that he can see and hear anything ever
    said through time) *Toon Force **Elasticity **4th Wall Awareness **Dimensional
    Storage (Constantly pulls objects out of thin air) *Non-Physical Interaction (Could
    affect Sombra''s magic during their battle, Was able to grab and hold a piece
    of magic) Mobility: *Flight *Teleportation *Portal Creation & Dimensional Travel
    (Can teleport to his own realm freely, Can create portals to other dimensions)
    Activated: *Magic & Reality Warping **Physics Manipulation (He has displayed control
    over his realm such as adding and deleting gravity from it on a whim) **Self-Conceptual
