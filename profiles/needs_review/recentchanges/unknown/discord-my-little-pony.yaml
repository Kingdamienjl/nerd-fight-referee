- id: claim-weaknesses-10d6b11a
  section: weaknesses
  axis: weakness
  text: '*Discord''s magic can be overcome by certain individuals or objects. He has
    been defeated and petrified by the Elements of Harmony; Celestia cast a spell
    on the Elements to keep Discord from taking them again; His magic has been overpowered
    and taken by an empowered Tirek and Grogar''s Bell; His magic had been nullified
    by Queen Chrysalis'' throne and an anti-magic lock put on him in Abyssia. *He
    can be so overconfident and cocky that he will not go all-out against enemies,
    and has a tendency to underestimate them. He has been defeated three times due
    to this; Initially by Celestia and Luna, later by the Mane Six, and most recently
    by Tirek. Despite being a master manipulator, he can be tricked himself at some
    points, such as when he was tricked by Lord Tirek into betraying his friends for
    freedom, and then tricked by Tirek, Chrysalis and Cozy Glow into thinking that
    they failed to obtain Grogar''s bell. *If Discord acts or becomes "normal", he
    starts to fade away from existence as he cannot use his reality warping powers
    in the process of doing so, but it can be reversed if he experiences something
    "chaotic". In addition, he can lose his powers if someone compatible with his
    realm enters it while he is not there and begins to link with it, although this
    can be reversed by proving himself the more chaotic one. They would have to destroy
    the spare Discord recently residing in the dimension first before the linking
    can begin. Notable Attacks/Techniques: *Reality Warping: Discord''s reality warping
    has shown no real limitations, but it is not as powerful as Tirek was after draining
    most of Equestria''s citizens. Although he usually activates his powers with a
    snap of his fingers, it''s been shown to be thought based on multiple occasions.
    Note: It has been confirmed that the Sun of Equestria is the same size as our
    own, despite that it revolves around the Earth. ==Notable Matchups== Victories:
    *Lord Tirek (My Little Pony) Lord Tirek''s Profile (Post-Mane 6 Tirek was used)
    Losses: *Magolor (Kirby) Magolor''s Profile (Speed was equalized, Magolor Soul
    was used) *Bobobo-bo Bo-bobo (Bobobo-bo Bo-bobo) Bo''s Profile (Speed was equalized,
    and the battle took place in Ponyville) *The Overlord (Ninjago) Overlord''s Profile
    (Speed was equalized, Golden Master and Discord keys were used) *One (Battle for
    Dream Island) One''s Profile (Discord and Post-Power Absorption One were used
    and speed was equalized) Inconclusive: *Dimentio (Super Mario Bros.) Dimentio''s
    Profile (Base Dimentio was used, Speed was Equalized) *Ainz Ooal Gown (Overlord)
    Ainz''s Profile (Speed was Equalized) *The Snatcher (A Hat in Time) Snatcher''s
    Profile (Speed was equalized, and both characters were bloodlusted) Category:Characters
