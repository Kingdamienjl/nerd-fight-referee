    At Freddy''s 2), Stealth Mastery (Can enter the player''s office without them
    noticingFive Nights At Freddy''s 2), Body Control (Can remove her beakFive Nights
    At Freddy''s 2) Superhuman Physical Characteristics, Immortality (Types 1, 2 and
    8; Characters frequently talk of torturing and killing the player for eternity,Five
    Nights at Freddy''s: Ultimate Custom Night Comparable to Foxy who can literally
    tear himself limb from limb with no ill effects,Five Nights at Freddy''s: Ultimate
    Custom Night Can be brought back by The One You Should Not Have Killed after being
    erased by the Death CoinFive Nights at Freddy''s: Ultimate Custom Night), Self-Sustenance
    (Types 1, 2, and 3; As a robot, Toy Chica lacks a need for food, water, air, or
    rest), Enhanced Senses (Can see in the dark), Inorganic Physiology (Type 2; created
    by The One You Shouldn''t Have Killed to torture William Afton), Body Control
