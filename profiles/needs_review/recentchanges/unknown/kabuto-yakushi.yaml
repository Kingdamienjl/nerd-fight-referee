- id: claim-powers-and-abilities-fff6c1f6
  section: abilities
  axis: hax
  text: "{{#tag:tabber|Part 1 and 2= {{#tag:tabber| -Base=Superhuman Physical Characteristics,\
    \ Acrobatics, Genius Intelligence, Chakra Manipulation, Statistics Amplification\
    \ (Shinobi are capable of enhancing their physical capabilities with the use of\
    \ chakra. The Shunshin no Jutsu allows Shinobi to greatly [https://imgur.com/gallery/wHi3SQC\
    \ enhance their speed by focusing chakra in their feet]), Surface Scaling and\
    \ Water Walking (By [https://imgur.com/gallery/JPJs3ri focusing chakra at the\
    \ soles of their feet], Shinobi can scale and cling to vertical surfaces, and\
    \ even walk on water), Afterimage Creation, Stealth Mastery, and Speed Enhancement\
    \ (The [https://imgur.com/gallery/q116mH6 Substitution Jutsu] allows its user\
    \ to instantly replace themselves with a nearby object such as a tree log, plant,\
    \ person, or clone at the exact moment they are attacked. The Jutsu works even\
    \ if the user is physically restrained or observed by characters as observant\
    \ as Sharingan or Sage Mode users. This creates the [https://imgur.com/gallery/5noqSsK\
    \ optical illusion] of the user being hit, which confuses the opponent and gives\
    \ them an opening to flee or counterattack), Minor Illusion Creation and Duplication\
    \ (With [https://i.imgur.com/kZQLat1.png the Clone Technique], Shinobi can create\
    \ illusionary duplicates of themselves that have no physical substance), Shapeshifting\
    \ (With [https://i.imgur.com/5hPbTb8.png the Transformation Technique], Shinobi\
    \ can transform themselves into other people, animals, plants, and even inanimate\
    \ objects, such as weapons), Paralysis Inducement (With [https://i.imgur.com/whMQ6MP.png\
    \ the Temporary Paralysis Technique], Shinobi can completely paralyze their targets\
    \ from close to mid range), Healing (Can heal injuries of himself and others,\
    \ even from a slight distance), Limited Durability Negation (Can perform internal\
    \ damage like cutting muscle tendons and tissues without directly affecting the\
    \ skin), Earth Manipulation, Water Manipulation, Air Manipulation, Body Control,\
    \ Illusion Creation and Sleep Manipulation (Can put a large number of people to\
    \ sleep with Genjutsu), Poison Manipulation, Necromancy (Can reanimate corpses\
    \ and use them as allies in combat or decoys), Summoning (Can summon corpses)\
    \ }} - Fourth Shinobi World War= {{#tag:tabber| -Base=All previous abilities enhanced,\
    \ Enhanced Senses (Has snake-like senses, being able to feel things through temperature\
    \ or sense of smell), Snake Manipulation (Can create snakes of varying sizes that\
    \ can restrain targets, possess enhanced senses, can inject venom into his targets,\
    \ act as extra appendages, among other things), Enhanced Healing (His outer skin\
    \ has a snake embedded in its navel, which he can merge with others' bodies in\
    \ order to heal them), Barrier Creation (Can produce barriers to hide his location),\
    \ Telepathy ([https://imgur.com/JdVAcC8 Capable of talking through his Edo Tensei]),\
    \ Body Control (Can alter his body to replicate certain others' trademark skills),\
    \ Regeneration (Low-Mid, has Karin's natural Uzumaki-based rejuvenation, who healed\
    \ her after having her organs destroyed by Tobi, up to High-Mid with Orochimaru-Style\
    \ Body Replacement Technique), Intangibility (Elemental, Type 3, Can liquefy himself\
    \ or his snakes at will, blocking out sensory capabilities in the process), Limited\
    \ Petrification and Transmutation (Opponents who absorb excess amounts of natural\
