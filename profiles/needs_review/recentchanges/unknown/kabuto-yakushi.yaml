- id: claim-weaknesses-3c137674
  section: weaknesses
  axis: weakness
  text: "Kabuto can be arrogant and overconfident | He is vulnerable to lightning-based\
    \ techniques in his water form. Notable Attacks/Techniques: Medical Ninjutsu (\u533B\
    \u7642\u5FCD\u8853, Iry\u014D Ninjutsu): *It is is a branch of ninjutsu associated\
    \ with healing, as well as the manipulation of their own, or another body, practiced\
    \ by shinobi categorized as \"medical-nin\". *Yin Healing 'Wound Destruction:\
    \ A medical ninjutsu where one anticipates the spot the enemy will attack and\
    \ preemptively applies medical treatment to it, reducing damage to a minimum.\
    \ The user concentrates chakra on that area and begins the cell recreation process\
    \ even before the targeted area becomes damaged. Using the opponent's facial expression\
    \ and movements, the technique's speed and power, the user analyses everything\
    \ in an instant and accurately deduce where the attack will land. Even more than\
    \ accurately predicting the attack or instantly gauging the situation, high resilience\
    \ is necessary, so one might say this technique is exclusive to Kabuto. *Chakra\
    \ Scalpels: This medical technique forms one's chakra into a small, sharp blade.\
    \ This can then be used for highly accurate incisions necessary for surgeries\
    \ and anatomical dissections. Unlike regular scalpels, the chakra scalpel can\
    \ make cuts inside the body without actually creating an open wound, limiting\
    \ the risks of an infection. The chakra scalpel can also be used offensively,\
    \ although it requires high precision to be effective. Because of this requirement,\
    \ using the chakra scalpel offensively is highly unusual. In heated combat, even\
    \ the most celebrated medical[http://naruto.wikia.com/wiki/Medical-nin -]nin won't\
    \ be able to exert the precision needed to make fatal cuts. However, it can still\
    \ effectively cut muscle tissues and tendons, rendering the target immobile. *Mystical\
    \ Palm Technique: This medical ninjutsu allows the user to speed up the body's\
    \ natural healing process by sending chakra from their hands into a wound or afflicted\
    \ body part. This allows the user to heal a patient without the need for medical\
    \ equipment or surgery, making it very useful on the battlefield. It can be used\
    \ to treat both external and internal injuries. It is vital to match the amount\
    \ of chakra used to the severity of the affliction or injury. This requires a\
    \ considerable amount of chakra control, and because of this, only a few highly\
    \ skilled medical-nin can use this technique. Kabuto Yakushi demonstrated the\
    \ ability to use it a short distance away from the target instead of through direct\
    \ contact. By sending an excess amount of chakra into the patient's body, the\
    \ user can overload the patient's circulation, trapping them in a comatose state,\
    \ though this is usually undesirable. *Summoning: Impure World Resurrection: The\
    \ Summoning: Impure World Resurrection links the soul of a deceased person to\
    \ a living vessel, restoring them at their peak during their lifetime to do their\
    \ summoner's bidding. It was created by Tobirama Senju. Orochimaru would rediscover\
    \ the technique decades later, and Kabuto would perfect it. Doton (Earth Release):\
    \ *One of the basic elemental nature transformation techniques and allows the\
    \ user to manipulate the surrounding earth for offensive and defensive purposes\
    \ or create it; be it dirt, mud, or rock. *Hiding Like a Mole: This technique\
    \ changes earth into fine sand by channeling chakra into it, allowing the user\
    \ to dig through it like a mole. This effect goes around the body (not just the\
    \ hands), making it just large enough for a person to move through. The user can\
    \ pinpoint where they are, despite being underground, by sensing the magnetic\
    \ forces. *Doton: Doroku Gaeshi (Earth Release: Earth Shore Return): To use this\
    \ technique, Jirobo will place his hands on the ground and cause the earth to\
    \ shift into a sturdy wall. This stone wall provides defense and protects from\
    \ frontal attacks, though it can be destroyed with enough force. Suiton (Water\
    \ Release): *One of the basic elemental nature transformation techniques that\
    \ allow the user to manipulate pre-existing water, or create their own, by turning\
    \ their chakra into water. It takes much more ability to create the water than\
    \ to manipulate what is already available and expel it from their mouths. One\
    \ of the most versatile of the five basic chakra natures, Water Release techniques\
    \ can not only change shape but the state as well. Moreover, the water becomes\
    \ more solid in the process as well. *Water Release: Water Dragon Bullet Technique:\
    \ shapes a large amount of water into a giant, mighty dragon, which hits the opponent\
    \ with formidable might, dealing physical damage. The ideal place to use it is\
    \ near a body of water, but if the user's skill allows it, it is possible to use\
    \ it even in a place where there is none. The amount of water used will be in\
    \ proportion to the user's skill. *Water Release: Great Waterfall Technique extends\
    \ water over a large scale, surges and rises to several dozens of meters high.\
    \ Then it streams down to the ground in one big cascade, muc"
  source_ids: *id003
