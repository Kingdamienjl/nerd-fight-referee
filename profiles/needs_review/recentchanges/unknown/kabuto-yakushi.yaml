  name: "350px }} ==Summary== Kabuto Yakushi (\u85AC\u5E2B\u30AB\u30D6\u30C8, Yakushi\
    \ Kabuto) grew up as a child orphaned by war. He was taken in by Konohagakure\
    \ but, in exchange, he was pressured to start spying for the village by Root.\
    \ The many identities he had to assume left him unsure of who he truly was. This\
    \ left him susceptible to the influence of Orochimaru, leading him to become his\
    \ right-hand-man. Years later, after Orochimaru is seemingly killed, Kabuto uses\
    \ the many talents he has gained under the latter to forge out on his own, but\
    \ later on, he is finally able to define his place in the world. ==Powers and\
    \ Stats"
