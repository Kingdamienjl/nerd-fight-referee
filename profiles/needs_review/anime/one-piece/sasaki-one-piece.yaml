        in Zoan Forms (Superior to his Base Form), far higher with Propellers (Speeds
        him up to an "extreme level." Blitzed Franky's V-For-Victory Flash), even
        higher with Magnumceratops (As his ultimate technique, it should be far superior
        to the likes of Tamaceratops, which frightened Franky at the thought of its
        speed)
      source_id: vsbattles-sasaki-one-piece-one-piece
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: durability
      value: At least Island level (Superior to Page One), Country level in Zoan Forms
