- id: claim-standard-equipment-6642d5ab
  section: equipment
  axis: equipment
  text: 'Karakuri Rasento: *Karakuri Rasento: A Japanese-style Nandao blade with light,
    greenish-gray tsuka-ito forming rhombus gaps on the hilt and being gold-colored
    below and which has an orange pair of tufted cords tied to it, as well as a gold
    kashira, a rectangular gold tsuba, and a saya colored the same as the tsuka-ito.
    Karakuri Rasento is a specialized mechanized sword that, when used in its preferred
    way, erects razor-like blades at the side of the sword, which are then spun like
    a drill in order to shred apart opponents and increase the strength of swings.
    Karakuri Rasento is so powerful that a single swing can slice through a thick
    steel blade as if it were butter.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
