    - field: attack_potency
      value: 'At least Island level (Should be far superior to his subordinates in
        the Armored Division, who could block attacks from General Franky. Implied
        to be stronger than Page One.One Piece Vol. 97 Chapter 978), Country level
        in Zoan Forms (Despite the full effects of the attack being stopped by Franky,
        Sasaki was still able to knock him backwards with enough force to cause him
        to yell in painOne Piece Vol. 99 Chapter 1004), Karakuri Rasento: Screw Sword
        (Sliced through General Franky''s ''Franken Sword'') or Tamaceratops (Was
        able to pierce through and destroy General Franky''s ''General Shield'') higher
        with Heliceratops (As a combination of Tamaceratops'' speed and Karakuri Rasento:
        Screw Sword''s power, it should be stronger than both of them individually.
        Was able to slice through the Armored Divisions'' weapons with ease, which
        Franky''s attacks were incapable of doingOne Piece Vol. 99 Chapter 998), far
        higher with Magnumceritops (Sasaki believed that it would be able to take
        out both himself and Franky in one go, even after seeing him stop the force
        of his Tamaceratops with a prior attack. Completely shattered General Franky)'
      source_id: mediawiki-4814179
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: speed
      value: At least Relativistic+ (Comparable, if not superior to Page One), higher
