power_scale:
  tier:
    text: 'At least 6-C, 6-B in Zoan Forms, Karakuri Rasento: Screw Sword or Tamaceratops,
      higher with Heliceratops, far higher with Magnumceratops'
    source_ids:
    - mediawiki-4814179
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: 'At least Island level (Should be far superior to his subordinates in the
      Armored Division, who could block attacks from General Franky. Implied to be
      stronger than Page One.One Piece Vol. 97 Chapter 978), Country level in Zoan
      Forms (Despite the full effects of the attack being stopped by Franky, Sasaki
      was still able to knock him backwards with enough force to cause him to yell
      in painOne Piece Vol. 99 Chapter 1004), Karakuri Rasento: Screw Sword (Sliced
      through General Franky''s ''Franken Sword'') or Tamaceratops (Was able to pierce
      through and destroy General Franky''s ''General Shield'') higher with Heliceratops
      (As a combination of Tamaceratops'' speed and Karakuri Rasento: Screw Sword''s
      power, it should be stronger than both of them individually. Was able to slice
      through the Armored Divisions'' weapons with ease, which Franky''s attacks were
      incapable of doingOne Piece Vol. 99 Chapter 998), far higher with Magnumceritops
      (Sasaki believed that it would be able to take out both himself and Franky in
      one go, even after seeing him stop the force of his Tamaceratops with a prior
      attack. Completely shattered General Franky)'
    source_ids:
    - mediawiki-4814179
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: At least Relativistic+ (Comparable, if not superior to Page One), higher
      in Zoan Forms (Superior to his Base Form), far higher with Propellers (Speeds
      him up to an "extreme level." Blitzed Franky's V-For-Victory Flash), even higher
      with Magnumceratops (As his ultimate technique, it should be far superior to
      the likes of Tamaceratops, which frightened Franky at the thought of its speed)
    source_ids:
    - mediawiki-4814179
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class T (Should be superior to Page One), higher in Zoan Forms
      (With a single charge, was able to send General Franky flying several meters
      backwards despite him defending), far higher with Tamaceratops (Generates greater
      force than his normal attacks), even higher with Magnumceritops (Far superior
      to Tamaceratops)
    source_ids: &id002
    - mediawiki-4814179
    confidence: 0.95
  striking_strength:
    text: 'At least Island level, Country level in Zoan Forms, Karakuri Rasento: Screw
      Sword or Tamaceratops, higher with Heliceratops, far higher with Magnumceratops'
    source_ids: *id002
    confidence: 0.95
  durability:
    text: At least Island level (Superior to Page One), Country level in Zoan Forms
      (Unharmed by all of Franky's attacks that hit his scales)
    source_ids:
    - mediawiki-4814179
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Ancient Zoan devil fruit users have shown incredible endurance
      and stamina, allowing them to continue fighting without issue despite taking
      many attacks that can even be fatal. Even when defeated they possess immense
      recovery time that allows them to get back up in a matter of minutes despite
      their injuries. Combined with his Fishman blood, Sasaki's stamina should be
      greater than other Ancient Zoan users.)
    source_ids:
    - mediawiki-4814179
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Extended Melee Range via sheer size, Several Meters with Karakuri Rasento,
      Tens of Meters with Heliceratops
    source_ids:
    - mediawiki-4814179
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Above Average. As one of the six strongest Shinuchi with a 472,000,000 Berries,
      Sasaki is very powerful and considered potentially able to challenge an All-Star,
      such as King, Queen or Jack, for their position. Sasaki himself used to be the
      captain of his own Pirate Crew, which would require him to have at the very
      least, basic knowledge on Seafaring and Ship duties.
    source_ids:
    - mediawiki-4814179
    confidence: 0.6
    notes: auto_repair source extraction
