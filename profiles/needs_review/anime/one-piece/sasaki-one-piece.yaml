    - field: stamina
      value: Superhuman (Ancient Zoan devil fruit users have shown incredible endurance
        and stamina, allowing them to continue fighting without issue despite taking
        many attacks that can even be fatal. Even when defeated they possess immense
        recovery time that allows them to get back up in a matter of minutes despite
        their injuries. Combined with his Fishman blood, Sasaki's stamina should be
        greater than other Ancient Zoan users.)
      source_id: vsbattles-sasaki-one-piece-one-piece
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: range
      value: Extended Melee Range via sheer size, Several Meters with Karakuri Rasento,
        Tens of Meters with Heliceratops
      source_id: vsbattles-sasaki-one-piece-one-piece
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: standard_equipment
      value: 'Karakuri Rasento: A Japanese-style Nandao blade with light, greenish-gray
        tsuka-ito forming rhombus gaps on the hilt and being gold-colored below and
        which has an orange pair of tufted cords tied to it, as well as a gold kashira,
        a rectangular gold tsuba, and a saya colored the same as the tsuka-ito. Karakuri
        Rasento is a specialized mechanized sword that, when used in its preferred
        way, erects razor-like blades at the side of the sword, which are then spun
        like a drill in order to shred apart opponents and increase the strength of
        swings. Karakuri Rasento is so powerful that a single swing can slice through
        a thick steel blade as if it were butter.'
      source_id: vsbattles-sasaki-one-piece-one-piece
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: intelligence
      value: Above Average. As one of the six strongest Shinuchi with a 472,000,000
        Berries, Sasaki is very powerful and considered potentially able to challenge
        an All-Star, such as King, Queen or Jack, for their position. Sasaki himself
        used to be the captain of his own Pirate Crew, which would require him to
        have at the very least, basic knowledge on Seafaring and Ship duties.
      source_id: vsbattles-sasaki-one-piece-one-piece
      provider_id: vsbattles
      authority: high
      confidence: 0.75
    - field: weaknesses
      value: Sasaki's bottom is not covered in scales, so he is much more vulnerable
        to attacks there. Sasaki is also quite prideful, making him unable to admit
        to mistakes and blunders. This pride also extends to his opponents to where
        if they do something that he considers "shameful, " he may lose his temper
        and rush in with a blind attack. Other than those, Standard Devil Fruit user
        weaknesses.
      source_id: vsbattles-sasaki-one-piece-one-piece
      provider_id: vsbattles
      authority: high
