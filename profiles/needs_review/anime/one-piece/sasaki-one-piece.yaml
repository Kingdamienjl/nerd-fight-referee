        to yell in painOne Piece Vol. 99 Chapter 1004), Karakuri Rasento: Screw Sword
        (Sliced through General Franky''s ''Franken Sword'') or Tamaceratops (Was
        able to pierce through and destroy General Franky''s ''General Shield'') higher
        with Heliceratops (As a combination of Tamaceratops'' speed and Karakuri Rasento:
