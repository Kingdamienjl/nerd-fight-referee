- id: claim-weaknesses-948b5631
  section: weaknesses
  axis: weakness
  text: Sasaki's bottom is not covered in scales, so he is much more vulnerable to
    attacks there. Sasaki is also quite prideful, making him unable to admit to mistakes
    and blunders. This pride also extends to his opponents to where if they do something
    that he considers "shameful," he may lose his temper and rush in with a blind
    attack. Other than those, Standard Devil Fruit user weaknesses.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-1e73d036
