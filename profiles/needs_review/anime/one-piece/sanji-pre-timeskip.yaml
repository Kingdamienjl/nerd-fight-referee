  stamina:
    text: Superhuman. As a child, Sanji survived 85 days on 5 days of food without
      sleepOne Piece Vol. 7 Chapter 58 in order to find passing by ships. After receiving
      a ruthless beatingOne Piece Vol. 7 Chapter 56 from Pearl in an attempt to protect
      Baratie, Sanji went on to fight Gin, with the latter landing many significant
      hits,One Piece Vol. 7 Chapter 61 resulting in Sanji breaking several ribs. Despite
      being in this state, Sanji was still able to fight and dodge attacks swiftly
      and without issue. During Arlong Park, Sanji was blindsided by Kuroobi, getting
      up shortly after.One Piece Vol. 10 Chapter 84 Sanji was able to survive a brutal
      assault from Kuroobi underwater (where the latter's strength was doubled), which
      included Sanji's organs being crushed by water pressure.One Piece Vol. 10 Chapter
      86 While in this condition Sanji was able to easily outmaneuver and mercilessly
      decimate Kuroobi. After taking a beating by Bon Clay due to him looking like
      Nami, having a hole kicked through his shoulder,One Piece Vol. 21 Chapter 188
      and having broken bones, Sanji was able to clash evenly with, and eventually
      get the better of him and win.One Piece Vol. 21 Chapter 189 Sanji has been shown
      to be able to take durability negating attacks with little difficulty as shown
      in Skypiea, where he took several hits from Satori's Impact Dial,One Piece Vol.
      27 Chapter 247 which utilizes shockwaves to target internal organs, recovering
      mere moments later.One Piece Vol. 27 Chapter 250 The Reject Dial, which works
      identical to the Impact Dial, with the former being stronger, was able to do
      this when landed on Giant Jack.One Piece Vol. 32 Chapter 296 Shortly after,
      Sanji was shown taking the full power of Enel's El Thor,One Piece Vol. 30 Chapter
      284 having enough willpower to stay standing. In Enies Lobby, Sanji fought Kalifa,
      which resulted in the former being left as a bloody mess.One Piece Vol. 42 Chapter
      403 After that, he faced off against Jabra. During their fight, Sanji took several
      Zoan Enhanced Rokushiki attacks,One Piece Vol. 43 Chapter 415 and was still
      capable of helping fight off the 10,000 Marine Soldiers presentOne Piece Vol.
      44 Chapter 428 during the Buster Call that took place afterwards. In Thriller
      Bark, Sanji took a barrage of attacks from Absalom, which resulted in the former
      being stabbed through the chest.One Piece Vol. 48 Chapter 464 While in this
      state, Sanji got hit by many attacks from Oars, fractured his leg, took Ursus
      Shock, and could still walk around.One Piece Vol. 50 Chapter 485
    source_ids:
    - vsbattles-sanji-pre-timeskip-one-piece
