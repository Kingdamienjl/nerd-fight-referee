    confidence: 0.95
  attack_potency:
    text: "Island level (Each of these Pacifista are powerful enough to instantly\
      \ force Luffy into Gear 2nd and trade blows with his strongest attacksOne Piece\
      \ Vol. 52 Chapter 508. They were designed with a remodeled laser from Kizaru's\
      \ Devil Fruit, which from the Pacifista could destroy battleshipsOne Piece Vol.\
      \ 57 Chapter 562 and on its own is this strong. Could fight against a Pre-Timeskip\
      \ Eustass Kid and Trafalgar LawOne Piece Vol. 52 Chapter 506, who were both\
      \ relative to Luffy's Gear 3rd. Easily overpowered a base Sabaody Urouge, who\
      \ should be somewhat relative in power to the other low-end Supernova. Nearly\
      \ one-shot Franky with a casual punchOne Piece Vol. 52 Chapter 51037.5 Gigatons),\
      \ can bypass durability to an extent through the sheer heat of their lasers\
      \ (Easily burned through Kid's legOne Piece Vol. 52 Chapter 505, a buffed-up\
      \ UrougeOne Piece Vol. 52 Chapter 509, and even characters with resistances\
      \ like SanjiOne Piece Vol. 52 Chapter 512 who's immune to his own flames and\
      \ Brook who was unharmed by the heat of natural lightningOne Piece Vol. 49 Chapter\
      \ 476) | Moon level+ (The far inferior police Pacifista of the Fabiriophase\
      \ could pressure Jinbe, Base Luffy, and BonneyOne Piece Vol. 105 Chapter 1063.\
      \ According to Vegapunk, Egghead Island's defenses are \"utterly impenetrable,\"\
      \ with the PX\xB7III being a major factor as to whyOne Piece Vol. 108 Chapter\
      \ 1091. Saturn stated that the PX\xB7III take priority if the decision to keep\
      \ either them or the Sea Beast Weapons came up, making them stronger376.724\
      \ Exatons), can bypass durability to an extent through the sheer heat of their\
      \ lasers (They have far better laser technology than the prototypes before the\
      \ timeskip which should be similarly potent to all of the laser in Egghead such\
      \ as the Frontier Come and the lasers used by the Seraphim. Capable of one-shotting\
      \ several Sea Beast WeaponsOne Piece Vol. 108 Chapter 1092. Destroyed 30 battleshipsOne\
      \ Piece Vol. 109 Chapter 1106 in an instantOne Piece Vol. 109 Chapter 1107.\
      \ They have the power to destroy a countryOne Piece Vol. 110 Chapter 1112)"
    source_ids:
    - mediawiki-675512
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
