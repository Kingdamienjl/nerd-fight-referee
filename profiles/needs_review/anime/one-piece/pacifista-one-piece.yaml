  durability:
    text: "Island level+ (Kid, Law, and their crews struggled to force their way past\
      \ a single Pacifista. Tanked an attack from Pre-Timeskip X Drake. Tanked several\
      \ Coup de Vents from Franky. A combined attack from Gear 2nd Luffy, Three Sword\
      \ Style Zoro, and Diable Jambe Sanji's strongest attacks could deal only a noticeable\
      \ amount of damage to one. After which it took several dozen of Chopper's durability\
      \ negating attacks, a barrage from Franky, direct attacks from Brook and Usopp,\
      \ his own laser exploding on himself, Nami's Thunder Lance Tempo, and a follow\
      \ up attack from Diable Jambe Sanji, Asura Zoro, and Luffy's Gear 3rd Giant\
      \ Rifle to put one down. Harmed Sanji with his body after the strain of kicking\
      \ him several times prior despite using Diable Jambe75.9 Gigatons) | Moon level+\
      \ (Cannons that work against the Sea Beast Weapons would be worthless against\
      \ the PX\xB7IIIOne Piece Vol. 108 Chapter 1090. Can endure strikes from other\
