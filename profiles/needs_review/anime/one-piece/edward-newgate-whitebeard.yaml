        \ Bisento Wielder, Breath Attack (Extinguishes a massive piece of volcanic\
        \ rock with his breath), Supernatural Willpower (Able to keep fighting despite\
        \ the hundreds of life-threatening injuries he sustained, which included half\
        \ of his head being burned off), Vibration Manipulation (Can create powerful\
        \ shockwaves through any medium with the power of the Tremor-Tremor Fruit),\
        \ Air Manipulation (With the swing of his bisento, can generate powerful air\
        \ pressure with his attacks. Can use air-quakes through cracking the air and\
        \ sending shock waves through the air as a result), Water Manipulation (His\
        \ shockwaves are able to create large tsunamis), Earth Manipulation (With\
        \ his power, he can tilt the ground) and Weather Manipulation (His shockwaves\
        \ are able to affect the sky, bringing great storms), Limited Durability Negation\
        \ (His vibrations can pass through the bodies of opponents, affecting them\
        \ internally), Resistance to Heat (Was not bothered by the ambient heat Akainu\
        \ let off in his magma form and resisted direct magma attacks, albeit with\
        \ eventually fatal burn injuries), Ice Manipulation (His vibrations are strong\
        \ enough to prevent being encased in ice), Madness Manipulation, Mind Manipulation\
        \ and Soul Manipulation via Willpower (Through sheer willpower they can resist\
        \ losing their mind when absorbing shadows through the Kage Kage no Mi. Shadows\
        \ belonging to strong willed people are difficult to control, allowing them\
        \ to rebel against Moria's pact which usually immediately submits a shadow\
        \ to his supremacy and orders. Spiritual energy is contained within one's\
        \ soul/life; this energy is represented by the fighting power or the Haki\
        \ itself. Those with strong souls, which are homologous to shadows, resist\
        \ the effects of Brook's soul manipulation), Limited Power Nullification and\
        \ Stamina Absorption (Scaling to other/lesser Haoshoku Haki users who can\
        \ resist the effects of Seastone to different extents), and Limited Resistance\
        \ to Gravity Manipulation (Resisted the gravitational pull of Blackbeard\u2019\
        s attempt to suck him into his Black Hole) | Same as before except his Haki\
        \ was weakening"
