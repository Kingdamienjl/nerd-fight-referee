power_scale:
  tier:
    text: "Low 5-B, 5-B with Ha\u014Dshoku Infusion | Low 5-B, 5-B with Ha\u014Dshoku\
      \ Infusion | Low 5-B"
    source_ids: &id002
    - mediawiki-2832
    confidence: 0.8
  attack_potency:
    text: "Small Planet level (Stronger than he was in his old age. Kaidou acknowledged\
      \ Whitebeard as one of the few people capable of fighting him, referring to\
      \ him as mighty24.112 Zettatons), Planet level with Ha\u014Dshoku Infusion (Matched\
      \ Gol D. Roger's Ha\u014Dshoku Haki in a clash59.44 Zettatons) | Small Planet\
      \ level (Stronger than his subordinates, including Marco, Jozu, Vista, Izou\
      \ and Ace. A young Ace stated that ever reaching Whitebeard's level was beyond\
      \ his ability. Should be relative to Shanks' base9.042 Zettatons), Planet level\
      \ with Ha\u014Dshoku Infusion (Clashed with Shanks' Ha\u014Dshoku Infusion)\
      \ or Devil Fruit (Just a small fraction of his devil fruit was able to one-shot\
      \ Ace. Has the power to destroy the world) | Small Planet level (Although weaker\
      \ than before due to his sickness, he could swipe away Akainu's Dog-Bite Blaze\
      \ with a naginata swing, and could harm the admiral in battle. Can create earthquakes\
      \ this powerful while seriously ill, and weakened by his age. Can generate Magnitude\
      \ 6 earthquakes across the entire planet3.014 Zettatons), Can ignore conventional\
      \ durability with Internal Vibrations"
    source_ids: *id002
    confidence: 0.8
  speed:
    text: At least Relativistic+ with Speed of Light perceptions with Observation
      Haki (Faster than his old self) | Relativistic+ with Speed of Light perceptions
      with Observation Haki (Far superior to his sicker self, as during Marineford,
      Squard called it practically a miracle to hit him even once) | At most Relativistic+
      with Speed of Light perceptions with Observation Haki (Although slower than
      before, he managed to keep up with Akainu as an equal. Intercepted Kizaru's
      lightspeed movement)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class P (Stronger than his old self) | Class P (Superior to his state in
      Marineford) | Class P (Stronger than Marco)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: "Small Planet level (Stronger than his old self), Planet level with Ha\u014D\
      shoku Infusion | Small Planet level (Stronger than in Marineford), Planet level\
      \ with Ha\u014Dshoku Infusion or Devil Fruit | Small Planet level"
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Small Planet level (Able to fight with his late rival, Gol D. Roger for
      three days and nights, and come out of the fight with only minor bruises) |
      Small Planet level | Small Planet level
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (He fought with Roger in an all-out battle between the two pirate
      crews over the course of three days and three nights, although it's hinted they
      took time to rest during the battle. Should be higher then his older self due
      to not suffering from old age or illness) | Superhuman (Despite his old age
      and illness, during the Marineford battle he continued to fight while accumulating
      injuries and, at the time of his death, had literally taken 267 sword wounds,
      152 gunshot wounds, and 46 wounds from cannon balls. The sum adds up to a total
      of 465 hits, most significantly those he received from the Admirals Akainu and
      Kizaru, and even soldiered on after having half his head vaporized by the former.
      Weaker characters, with lower endurance, were also able to continuously battle
      for ten days straight)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Extended Melee Range by Sheer Size, Several Meters with Bisento. Up to possibly
      Stellar with Gura Gura no Mi (Can generate powerful vibrations that can be felt
      across the planet)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: Gifted (Whitebeard is the pirate closest to obtaining the "One Piece" treasure
      in the entire world, and along with a couple of decades' worth of experience,
      is the single most-dangerous pirate in his world. He has sufficient leadership
      qualities to oversee a last-minute invasion of Marineford, an incredibly skilled
      military strategist, and a match for Sengoku the Buddha. His tactical prowess
      was demonstrated when he scattered the pirates so that they wouldn't be routed
      by Pacifista, or when he bypassed the siege wall. Has mastered the use of the
      Gura Gura no Mi)
    source_ids: *id002
    confidence: 0.8
