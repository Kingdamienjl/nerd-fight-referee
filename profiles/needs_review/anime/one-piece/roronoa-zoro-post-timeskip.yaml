    - field: standard_equipment
      value: 'His three katanas, : One of the 21 Great Grade Meito. Forged by the
        legendary Wano swordsmith Shimotsuki Kozaburo and previously owned by his
        granddaughter and Zoro''s friend Kuina, given to Zoro 11 years ago by Kuina''s
        father Koushirou after her untimely death. The only one of Zoro''s swords
        that did not shatter when Zoro first clashed with Mihawk''s Supreme Grade
        sword Yoru., : A Grade Meito, it is said to be "cursed" and will bring great
        misfortune upon its owner. Forged by the great Wano swordsmith Tenguyama Hitetsu
        and given to Zoro two years ago in Loguetown by the arms dealer Ipponmatsu.,
        : One of the 21 Great Grade Meito and a powerful Black Blade. Famously wielded
        by the legendary samurai Ryuma and a treasured heirloom in all of Wano Country,
        it was stolen along with Ryuma''s body by Gecko Moria and used by Ryuma''s
        corpse when it became animated into a zombie. Ryuma bestowed it to Zoro after
        being defeated by the swordsman on Thriller Bark two years ago, and Zoro utilized
        it as a replacement for Yubashiri. The sword was stolen by Gyukimaru in Wano
        Country two years later and returned to Ryuma''s grave, where Zoro let it
        remain in exchange for Enma at Hiyori''s behest. Same as before with the exception
        of Shusui, : One of the 21 Great Grade Meito. Also forged by Shimotsuki Kozaburo
        and was originally wielded by the legendary samurai, Kozuki Oden. Oden''s
        daughter, Kozuki Hiyori who inherited Enma bestowed it to Zoro under the promise
        that he return Shusui to Ryuma''s grave. Until the Onigashima Raid in the
        Wano Country Arc, it was one of the two swords to cut Kaido of the Four Emperors
        and give him his one scar. Enma has the special trait of drawing out large
        amounts of the wielder''s Ryou.'
      source_id: mediawiki-2667325
