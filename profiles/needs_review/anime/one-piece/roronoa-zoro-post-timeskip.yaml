- id: claim-standard-equipment-9d71a77b
  section: equipment
  axis: equipment
  text: 'His three katanas; *: One of the 21 Great Grade Meito. Forged by the legendary
    Wano swordsmith Shimotsuki Kozaburo and previously owned by his granddaughter
    and Zoro''s friend Kuina; given to Zoro 11 years ago by Kuina''s father Koushirou
    after her untimely death. The only one of Zoro''s swords that did not shatter
    when Zoro first clashed with Mihawk''s Supreme Grade sword Yoru. *: A Grade Meito;
    it is said to be "cursed" and will bring great misfortune upon its owner. Forged
    by the great Wano swordsmith Tenguyama Hitetsu and given to Zoro two years ago
    in Loguetown by the arms dealer Ipponmatsu. *: One of the 21 Great Grade Meito
    and a powerful Black Blade. Famously wielded by the legendary samurai Ryuma and
    a treasured heirloom in all of Wano Country, it was stolen along with Ryuma''s
    body by Gecko Moria and used by Ryuma''s corpse when it became animated into a
    zombie. Ryuma bestowed it to Zoro after being defeated by the swordsman on Thriller
    Bark two years ago, and Zoro utilized it as a replacement for Yubashiri. The sword
    was stolen by Gyukimaru in Wano Country two years later and returned to Ryuma''s
    grave, where Zoro let it remain in exchange for Enma at Hiyori''s behest. Same
    as before with the exception of Shusui, which was replaced with: *: One of the
    21 Great Grade Meito. Also forged by Shimotsuki Kozaburo and was originally wielded
    by the legendary samurai, Kozuki Oden. Oden''s daughter, Kozuki Hiyori who inherited
    Enma bestowed it to Zoro under the promise that he return Shusui to Ryuma''s grave.
    Until the Onigashima Raid in the Wano Country Arc, it was one of the two swords
    to cut Kaido of the Four Emperors and give him his one scar. Enma has the special
    trait of drawing out large amounts of the wielder''s Ryou.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-intelligence-5adfa7d2
  section: power_scale
  axis: battle_iq
  text: 'Above Average in general. Astoundingly skilled combatant (Zoro is naturally
    gifted, spending most of his time as a child challenging Dojo''s surpassing the
    skill of the majority of participants in them including full grown adults. It
    was at Isshin Dojo where Zoro met the first person he was unable to best, Kuina
    where the two developed a strong friendship. Shortly after Kuina''s death Zoro
    pursued his vow to become the greatest Swordsmen and developed his very own style
    , a sword style that''s completely unique to Zoro, involving the usage of three
    blades held simultaneously in an unorthodox fashion. This is the sword style Zoro
    is the most skilled in, using Santoryu Zoro is able to attack from borderline
    unpredictable and unstable angles. (Has also been shown to be able to fight despite
    whatever terrain or environment he''s on, weather it be underwater where Fishmen
    specialize in, in the air, and even without ground beneath him.) Zoro has also
    displayed Mastery in various other forms of sword styles, such as One-Sword Style
    and Two-Sword Style, and even developed another unique form of sword play, , which
    Zoro is able to utilize if he is ever disarmed of his swords, revolving around
    throws and changing the , allowing Zoro to fling his opponents at one another,
    allowing him to cut without technically having a blade on him. Zoro has also developed
    another unique form of swordplay an extension of his Three-Sword Style: differing
    from his other disciplines, creating a tangible illusion of himself with 6 extra
    arm''s and 3 heads resembling that of a Demon God. These illusions have a physical
    affect on whatever Zoro interacts with. This is Zoro''s strongest ability out
    of his whole arsenal. Zoro is also shown to be familiar with other weapons although
    his preference is a sword, Zoro also shows impressive levels of body control being
    able to manipulate the mass and density of his muscles and can bend in unorthodox
    ways. After being trained by Dracule Mihawk The World''s Strongest Swordsman for
    2 years, Zoro''s skill has increased drastically, to where he can utilize Goken
    and The Breath of All Thing''s to a much greater degree, being able to apply it
    to all of his attacks. (The Pinnacle of Swordsmanship that allows the users to
    analyze their opponents "breathing", living or to determine the speed, power and
    angle to cut at allowing him to cut what he couldn''t with strength alone. Users
    of this ability are also able to predict the trajectory of something''s movements
    before it happens, as well as detect objects that might be hidden.), even functioning
    while Zoro himself is near unconsciousness. His Santoryu attacks are harder to
    register than Hyouzou''s type Swordsmanship, the strongest Swordsman on Fish-Man
    Island and considers skilled Swordsmen like Hachi to be pathetic, and can effortlessly
    parry slashes coming at him from every direction. (Cephalopods like Hyouzou and
    Hachi have ''Brains'' within their limbs, allowing them to move/attack through
    instinct) Zoro is able to turn his back to Swordsmen on the level of Hyouzou and
    considers them to not even being able to kill his boredom. An analytical and alert
    fighter, Zoro prefers to target lethal vital points from the get go. (Quick to
    grasp the rhythm of battle, as a attentive fighter, Zoro excels in analyzing his
    opponents to find their weakness allowing Zoro to create extremely effective countermeasures
    and combinations on the spot. Zoro is able to analyze his opponents'' skill, attack
    patterns and timing. Zoro also showcases impressive predictive accuracy, being
    able to predict the movements and trajectory of his opponents, being able to predict
    FTE attacks and attacks that change trajectory. After training with Mihawk Zoro
    can copy techniques after seeing them be used, such as when he copied Kin''emon''s
    Firefox Style, a style that was unique to Kin''emon himself and use it to a greater
    degree than Kin''emon''s own usage. With Asura, it has been stated in the Databook
    that he directs all of his sword attacks to an enemy''s vital points.'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-weaknesses-5b0a5e7e
  section: weaknesses
  axis: weakness
  text: 'Zoro has a very poor sense of direction (i.e., climbing up buildings when
    told to go north and getting lost in a straight hallway). Even though he can unleash
    Enma''s full power, doing so for too long will kill him due to the energy drain.
    Zoro is also rather reckless in battle, regardless of how many injuries he suffers
    and how much blood he loses, although he is still capable of keeping a cool head
    under pressure. {| class="mw-collapsible mw-collapsed" align="center" border="1"
    cellpadding="1" cellspacing="1" style="width:100%" | colspan="2" style="text-align:
    left'
