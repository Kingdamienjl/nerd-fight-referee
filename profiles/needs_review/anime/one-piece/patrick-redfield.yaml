        covered in water. Busoshoku Haki and seastone nullify his Devil Fruit power
        and his, resistance to blunt impact, making him vulnerable like regular people.
        During Dressrosa, excessive usage of Gear 4th would render Luffy incapacitated
        for 10 minutes, barely able to move and having no access to Haki, but during
        Whole-Cake arc, Luffy only suffers from having no haki usage for 10 minutes.
        Gear 4th greatly increases Luffy's metabolism, making his body burn calories
        much faster and greatly lower how long he can remain in combat. Gear 4th Tankman
        Full Version can only be utilized when Luffy has consumed a sufficient amount
        of calories.
