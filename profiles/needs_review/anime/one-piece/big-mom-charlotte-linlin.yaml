- id: claim-weaknesses-4679f122
  section: weaknesses
  axis: weakness
  text: Standard Devil Fruit users weaknesses. If someone has her Vivre Card, a strong
    aura prevents Homies ("humanized" inanimate objects and non-sentient beings) from
    attacking that person, unless she's very close to that said person. She can give
    into her cravings which lead her into a crazed bloodlust for what she wants to
    eat, which makes her unable to distinguish from friend or foe; due to being a
    picky eater in this state, she can get even weaker if she hasn't eaten for a while
    (around 8 hours or so) until she gets a hold of the food she wants at the moment.
    Big Mom cannot steal the life of people who do not feel fear of death. Her body
    loses its toughness when she is in a psychological crisis. Zeus is so gluttonous
    towards thunderclouds that he would betray her for the person who fed him. Due
    to Prometheus being an animated, concentrated flame, he's weak against water,
    unless he gets big enough to not be affected by it; but if he does get really
    big, his movements become sluggish. For a short while, Big Mom cannot control
    her Homies when the memories of the people who possessed the souls previously
    come rushing in. Her Homies need to be commanded verbally where they can hear
    her.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
