power_scale:
  tier:
    text: 5-C, Varies up to Low 5-B with Homies, higher with Conqueror's Haki Infusion,
      far higher with Combined Attacks, even higher with with Soru Soru no Mi, far
      higher with Combined Attacks
    source_ids: &id002
    - mediawiki-140281
    confidence: 0.8
  attack_potency:
    text: Moon level (Was stated to be one of the few people who can stop Blackbeard.
      Knocked down and caused severe injury to Queen with two attacks while in her
      crazed hunger state), Varies up to Small Planet level with Homies ([https://imgur.com/a/q0xo9Sz
      Luffy was forced to evade her Ikoku Sovereignty, and was likened to another
      Kaidou]. Marco stated that she was a serious threat. Matched Hybrid Form Kaidou
      during their Conquest of the Sea combined attack. [https://imgur.com/a/ens5gwW
      Hera is far superior to] Zeus, and [https://imgur.com/a/e5ujVvg grew even stronger
      after absorbing most of his soul]. [https://imgur.com/a/jEsCk2X Her Homies become
      stronger] [https://imgur.com/a/glWDVZl when given space to grow and charge]
      and [https://imgur.com/a/pvS4AIY while at full power was] [https://imgur.com/Y8jJG9u
      equal to Hybrid Kaidou]), higher with Conqueror's Haki Infusion (Clashed and
      split the skies with Kaidou for several days, [https://imgur.com/a/PgVCsEA making
      her superior] to post-Haki bloom Luffy with Gears. Even without her Homies,
      she one-shot Page One), far higher with Combined Attacks ([https://imgur.com/a/fLKBW6A
      The Maser Cannon is a 3 part combination of Prometheus, Hera, and Big Mom's
      individual firepower]), even higher or with Soru Soru no Mi (By absorbing her
      own lifespan, she can grow far stronger than before. She and all her main Homies
      got larger and stronger, and she was able to overpower and temporarily incapacitate
      Eustass Kid and Trafalgar Law), far higher with Combined Attacks (The Maser
      Cannon, Maser Saber, and Misery are all combined attacks of Big Mom and her
      Homies' power), her masers can bypass durability to an extent (Can cleanly [https://imgur.com/a/CxyVI1Z
      penetrate opponents and cut structures] through sheer heat)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: FTL (Could slam Queen's head into the ground before he could do anything),
      higher with Homies (Can match Hybrid Kaidou to perform a simultaneous, combined
      attack)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class P (Could hold and trap Marco within her hands, with the latter unable
      to break free)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Moon level, Varies up to Small Planet level with Homies, higher with Conqueror's
      Haki Infusion, far higher with Combined Attacks or with Soru Soru no Mi,even
      higher with Combined Attacks
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Moon level (Fought against Kaidou for at least a day and sustained minor
      damage. Despite being tired and suffering from both hunger and amnesia, she
      was able to take a Brachio Bomber from Zoan Queen with relatively minor injuries),
      Small Planet level with Soru Soru no Mi (After absorbing her own lifespan to
      grow stronger, she withstood several attacks from Eustass Kid and Trafalgar
      Law, requiring them to BFR her out of the battlefield in order to defeat her.
      Survived being in the middle of the explosion of one of the bombs that could
      destroy Onigashima [and also mortally wounded Kazenbo] and stayed conscious)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Goes hours on end destroying towns and cities with no visible
      signs of tiring. Fought Kaidou for at least a day. Took 3 durability-negating
      attacks from Law that targeted her organs, as well as multiple attacks from
      Kid that either broke her bones or made her bleed, yet was still heavily implied
      to be capable of winning the fight had Kid and Law not removed her from the
      battlefield)
    source_ids: *id002
    confidence: 0.8
  range:
    text: At least Tens of Kilometers (Her sword-swings have sliced across Whole-Cake
      Island and her homies can create massive storms almost instantly)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: At least Above Average (She leads an entire land of species who all live
      in harmony and effectively organized a plan to kill the entirety of the Vinsmoke
      family)
    source_ids: *id002
    confidence: 0.8
