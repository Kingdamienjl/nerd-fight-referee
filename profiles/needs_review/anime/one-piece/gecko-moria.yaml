- id: claim-weaknesses-fc6b8cbe
  section: weaknesses
  axis: weakness
  text: Standard Devil Fruit users weaknesses. Overconfident and lazy, Shadow Asgard
    form is temporary and can lose power if hit by even a weaker opponent, zombies
    still have the personality of the person their shadow was taken from and take
    a while to come under his control if they have a lot of power, no special powers
    such as Devil Fruit abilities are transferred to the zombie with the shadow, only
    the original owner's personality (which subsides after a while), physical stats,
    and skills, if the original owner dies, the zombie with his/her shadow will die
    too, zombies can have their shadows ejected from them and returned to their original
    owner if they eat salt (an amount proportional to their body size), shadows will
    return to their owner if the zombie body they are in is completely destroyed,
    shadows stolen by Moria that have been ejected from a zombie can be used by anyone
    inside of their body and give them a power boost, but it only lasts for 10 minutes
    at most, but only people with strong spirits can survive having more than a few
    shadows in them at once. Can be reckless at times. | Same as in current day except
    for his laziness and overconfidence, which developed after he built his zombie
    army.
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-c270d9aa
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Basic Swordsmanship * Darkness Manipulation
    (Ate the Kage Kage no Mi, a Paramecia type Devil Fruit which allows him to steal
    the shadows of other people) * Sleep Manipulation (Stealing the shadows of other
    people causes hem to go into a coma for 2 days) * Limited Existence Erasure (A
    person without a shadow is incapable of existing in sunlight, and when hit by
    sunlight, their existence starts to vanish. Happens solely to those who he takes
    their shadow from, and having your shadow returned to you before the completion
    of the erasure of your physical body gives you your body back) * Necromancy and
    Power Mimicry (He can put the stolen shadows into corpses to create zombie soldiers
    who possess the same abilities as the original bearers) * Power Bestowal (Can
    put shadows of people on other people''s bodies to make them stronger and give
    them the same abilities as the original shadow bearer) * Limited Teleportation
    (He can instantly switch places with Doppelman) * Non-Physical Interaction (Can
    make contact with shadows, like they were physical beings) * Weapon Creation (Can
    manipulate his own shadow to create weapons) * Body Puppetry (Via Shadow Revolution)
    * Limited Memory Manipulation and Mind Manipulation (No matter how strong the
    shadow is, once ripped away from its owner, it will eventually forget its memories
    of its original owner and obey the Moria completely) * Absorption (He can absorb
    all of the shadows in a large area into him) * Transformation, Statistics Amplification,
    Size Manipulation (Capable of growing to giant size and to gain a massive strength
    boost) * Body Control (Can change the form of one''s shadow, making their body
    take the form of their shadow) * Large Size (Type 0 in Base form; Type 1 via absorbing
    shadows) * Immense Willpower (Absorbed 1000 shadows without passing out, though
    this could be because of the Kage Kage no mi and was able to withstand a burst
    of Marineford Luffy''s Haoshoku Haki) Resistance to * Madness Manipulation, Mind
    Manipulation and Soul Manipulation via Willpower (Through sheer willpower they
    can resist losing their mind when absorbing shadows through the Kage Kage no Mi.
    Shadows belonging to strong willed people are difficult to control, allowing them
    to rebel against Moria''s pact which usually immediately submits a shadow to his
    supremacy and orders. Spiritual energy is contained within one''s soul/life; this
    energy is represented by the fighting power or the Haki itself. Those with strong
    souls, which are homologous to shadows, resist the effects of Brook''s soul manipulation)
    | Likely the same as before (In the Wano flashback with Brick Bats flying around
    him, indicating he still had his Devil Fruit by this time) * Intangibility (Types
    2, 3, and 9; Made of shadows and darkness. Can become semi-solid to liquid) *
    Flight (Can fly) * Possession (Can possess other shadows) * Shapeshifting (Can
    shapeshift into different forms) * Regeneration ([Low-High via physiology; can
    disperse into a flock of bats and come back together to heal. Can become semi-solid
    to liquid])'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
