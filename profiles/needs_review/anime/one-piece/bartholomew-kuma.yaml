    - field: powers_and_abilities
      value: 'Superhuman Physical Characteristics, Immortality (Type 9. Exists as
        an avatar directly controlled by his higher self in the Meta-World, who can
        easily manifest again by putting his piece back into the chessboard), Electricity
        Manipulation (Manifested his Blue Truth as a lightning bolt), Large Size (Type
        10), Higher-Dimensional Existence, Incorporeality, Acausality (Type 4), Invulnerability
        and Power Nullification with Endless Nine, Red and Blue Truths. All previous
        powers and abilities to far greater extents, as well as: Immortality (Types
        1, 2, 3, 4 and 8 [His life and existence are both sustained by Beatrice as
        part of the world of her gameboard]), Regeneration (High-Godly. Capable of
        recovering and preserving his existence by maintaining his ability to think
        and remembering his own form, even if it is conceptually erased and sent to
        the nothingness beyond all stories and layers), Teleportation, Dimensional
        Travel (Can willfully manifest in various layers of existence, both higher
        and lower, adapting his own existence to the atmospheric pressure of higher
        worlds), Spatial Manipulation, Fate Manipulation, Void Manipulation, Mind
        Manipulation, Soul Manipulation, Plot Manipulation (Can manipulate kakera,
        which are crystallizations of lower worlds that record and contain infinite
        possibilities, as well as their fate and plot, encompassing higher dimensional
        structures alongside countless spiritual / mental realms, as well as nothingness
        devoid of space and time entirely), Astral Projection, Non-Physical Interaction,
        Reactive Evolution and Adaptation, Cosmic Awareness (Can look into infinite
        possibilities by touching kakera), Shapeshifting, Causality Manipulation (Controls
        the flow of cause and effect in the world of pieces, seeing its denizens as
        pawns on a game board and events as chess moves), Possession, Conceptual Manipulation
        (Type 1. Can manipulate the concepts of the Human Domain, which are visualized
        as physical objects on his level of existence, and create several concepts
        on the level of a higher-order world, such as gravity, out of his thoughts),
        Nonexistent Physiology (Type 2. Exists as an entity of nothingness at the
        core of his being, with his physical form being constructed and defined solely
        by his sense of self and identity), Resurrection (Can easily return from death
        by regaining his interest and will to live, as the concept of time does not
        exist in the higher domains. Resurrected after being killed by the Red Key,
        which negates the concept of revivals), Abstract Existence (Type 1), 4th Wall
        Awareness (Directly addressed the player during the EP 1 Tea Party), Light
        Manipulation, Incorporeality, Fusionism, Avatar Creation, Acausality (Type
        4; Exists completely outside of the chessboard and is unrestrained by the
        limitations of the Human Domain, including that of fate, time and causality),
        Blue Truths, Resistance to Void Manipulation, Mind Manipulation, Soul Manipulation
        and Conceptual Manipulation (Meta-World beings are defined by their thoughts
        as a conceptualized form and are able to resist conceptual attacks on their
        identity to a degree). All previous powers and abilities to immensely higher
        degrees, in addition to: Magic, Mathematics Manipulation, Size Manipulation,
        Duplication, Telekinesis, Resistance Negation, Law Manipulation, Probability
        Manipulation, BFR (Threatened to kick Bernkastel off of his game board, and
        almost fired EVA-Beatrice from Umineko altogether. Can take pieces in and
        out of the chess board at will), Information Manipulation, Life Manipulation
        (Rebirthed Beatrice into a new body after her death, though he was unable
        to recover her previous memories and experiences), Flight, Intangibility,
        Reality Warping (Reshaped parts of the Meta-World into a replica of Rokkenjima),
        Soul Manipulation (Pieces brought to the Meta-World are inanimate wax dolls
        unless the Game Master chooses to give them souls and allow them to speak),
        Sealing (Shackled Ange to her piece, preventing her from leaving his game.
        Encased the Book of the Single Truth in a crystal which only the Game Master
        could open), Power Bestowal (Can allow opponents to use Truths, as well as
        remove their access to them), Power Nullification, Cloth Manipulation, Subjective
        Reality (Could have rewritten the tale of the Rokkenjima Serial Murders so
        that they were all just a dream), Golden Truths, as well as all of Beatrice''s
        powers.'
      source_id: character-stats-profiles-bartholomew-kuma-anime
      provider_id: character_stats_profiles
      authority: high
      confidence: 0.75
    - field: attack_potency
      value: Low Complex Multiverse level (Accessed a higher layer of the chessboard
        beyond the physical world, which is stated to include a 5-dimensional realm
        above the human world, and fought against a held back Dlanor alongside the
        Eiserne Jungfrau while in this state) | Outerverse level (Exists in the Meta-World,
        a higher realm of existence from which the entire Human Domain is regarded
        as fiction and its inhabitants are seen as pieces laid on a chessboard, their
        fates and lives merely small fragments which can be manipulated and physically
        interacted with even by normal humans inhabiting this perspective. This includes
        structures such as the Underside of the Chessboard, a void of nothingness
        completely lacking space and time which resides in an unreachable "nowhere"
        in relation to the entire world of the pieces. Can manifest in a layer above
        the Meta-World, in which he stands superimposed over the scenery and perceives
        events there as frozen in time, as well as the Golden Land, which is stated
        to exist on an even higher level than it) | High Outerverse level (Vastly
        more powerful than before, having inherited the title and powers of the Endless
        Witch previously held by Beatrice, alongside her position as Game Master and
        Territory Lord of her fragment, which encompasses both Purgatorio and the
        Cathedral, as well as the Golden Land existing above them as the highest and
        most impenetrable part of his game board, all of which is created and sustained
        by him on a conceptual level. Exists on a higher plane of existence than everything
        else in his territory, including its version of the Sea of Fragments, the
        framework in which every layer within his catbox is contained as fiction inside
        fragments) | Extraverse level (Manifested in the City of Books, one of the
        highest realms in the World of Witches, above the majority of the infinite
        layers of existence leading to the Creator Domain, containing countless books
        and stories, a single one of which could record all of Umineko, with the lives
        of individual characters taking up little more than a single line. The world
        of his territory eventually came to encompass the City of Books as well, allowing
        him to fight against Bernkastel and completely overpower her to the point
        she was forced to abuse the rules of the gameboard to defeat him, making her
        "writhe in anguish" with a punch and vomit blood with a kick)
