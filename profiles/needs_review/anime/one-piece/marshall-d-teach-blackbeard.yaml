power_scale:
  tier:
    text: 5-C, far higher with Devil Fruit Powers | 5-C, Low 5-B with Devil Fruit
      Powers
    source_ids:
    - vsbattles-marshall-d-teach-blackbeard-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  attack_potency:
    text: Moon level (He could harm Ace by hitting him in his weak spots like his
      neck and his stomach. Even before getting his Devil Fruits, he was widely considered
      a solid candidate as one of Whitebeard's commanders, making his physical AP
      at least comparable to the likes of Jozu and Izou188.362 Exatons), far higher
      with Devil Fruit Powers (His power is increased by the abilities of the Yami
      Yami no Mi and the Gura Gura no Mi. With Whitebeard's fruit, he's capable of
      generating Magnitude 6 earthquakes throughout the entire planet. Alongside his
      crew, he fought against Sengoku and Garp at the same time. Despite having just
      obtained the Gura Gura no Mi and not being able to control it well, Teach was
      able to cause earthquakes this powerful188.362 Exatons) | Moon level (At least
      as strong as he was before the time-skip188.362 Exatons), Small Planet level
      with Devil Fruit Powers (Alongside his crew, he clashed against Marco and the
      other remnants of the Whitebeard Pirates during the timeskip and obliterated
      them with Marco stating that they couldn't overcome him anymore. Should have
      greater mastery over Whitebeard's Devil Fruit than before. Old Rayleigh believed
      that he wouldn't be able to defeat Blackbeard. Defeated Trafalgar Law in battle9.042
      Zettatons)
    source_ids:
    - vsbattles-marshall-d-teach-blackbeard-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  speed:
    text: FTL (Kept up with Ace without missing a beat in their battle. Parried and
      matched Marineford Whitebeard's attacks) | FTL (Clashed and defeated Marco to
      the point where he admits that he can't overcome him anymore)
    source_ids:
    - vsbattles-marshall-d-teach-blackbeard-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  lifting_strength:
    text: At least Class T (Could grab and slam Impel Down Arc Luffy), Class P with
      Yami Yami no Mi (Held Marineford Whitebeard in place with his Black Hole) |
      At least Class P (Should be comparable to Old Rayleigh), far higher with Yami
      Yami no Mi (Should be far stronger than his Pre-Timeskip self)
    source_ids: &id002
    - mediawiki-9488
    confidence: 0.95
  striking_strength:
    text: Moon level (Physically stronger than Ace as he nearly broke his neck in
      a single strike despite being staggered by one of Ace's attack), far higher
      with Devil Fruit Powers | Moon level (Stronger than before), far higher possibly
      Small Planet level with Devil Fruit Powers
    source_ids: *id002
    confidence: 0.95
  durability:
    text: Moon level (Tanked many blows from Ace. Took a point-blank quake bubble
      attack from Marineford Whitebeard as well as a direct slash from Whitebeard's
      bisento. Withstood Sengoku's shockwave attack and then engaged in an offscreen
      battle against both Sengoku and Garp, eventually emerging with moderate injuries
      once the fight was over) | Moon level (Far more durable than before. Old Rayleigh
      believes that he wouldn't be able to defeat Blackbeard. Withstood Trafalgar
      Law's Shock Wille), Small Planet level with Armament Haki (Blocked an attack
      from S-Hawk)
    source_ids:
    - vsbattles-marshall-d-teach-blackbeard-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: Superhuman (Fought Ace for an extended period of time while sustaining several
      attacks yet displayed no signs of strain or fatigue, also endured Magellan's
      poison and recovered completely after receiving an antidote, was still going
      strong after fighting with Sengoku and Garp when the Marineford Battle concluded)
    source_ids:
    - vsbattles-marshall-d-teach-blackbeard-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: Standard Melee Range physically, Kilometers with Yami Yami no Mi (Covered
      a town with darkness and during the final clash with Ace their powers towered
      several mountains). Up to possibly Stellar with Gura Gura no Mi (Can generate
      powerful vibrations that can be felt across the planet just like Whitebeard)
      | Same as before
    source_ids:
    - vsbattles-marshall-d-teach-blackbeard-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: Gifted (He was considered Whitebeard Commander caliber by virtue of his
      basic combat prowess, before he ate the Yami Yami no Mi, with decades of battle
      experience in the grim and feral New World. Quickly learned to access and use
      the Yami Yami no Mi efficiently after eating it, was able to utilize the Gura
      Gura no Mi to a significant extent moments after absorbing it. A very cunning
      and patient strategist, laying low with the Whitebeard Pirates for twenty years
      to find the Yami Yami no Mi fruit. Manipulated the World Government by joining
      the Seven Warlords of the Sea in order to gain access to Impel Down to recruit
      powerful prisoners to his crew, and at Marineford, used the conflict between
      the Whitebeard Pirates and the World Government to put an end to Whitebeard
      and steal his Devil Fruit powers in the process, using that power to gain massive
      influence and become one of the Four Emperors)
    source_ids:
    - vsbattles-marshall-d-teach-blackbeard-one-piece
    confidence: 0.6
    notes: auto_repair source extraction
