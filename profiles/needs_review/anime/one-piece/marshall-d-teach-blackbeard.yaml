- id: claim-weaknesses-0c5a85a4
  section: weaknesses
  axis: weakness
  text: Standard Devil Fruit users weaknesses. He's overconfident in his abilities
    and inclined to underestimate opponents. The Yami Yami no Mi does not give him
    access to an elemental state where he can disperse, reform and regenerate. His
    gravity powers has the perpetual consequence that things such as his opponents
    attacks are attracted to him, which increases the power of the attacks and consequently
    the pain he takes from them. Was initially inexperienced with using the Gura Gura
    No Mi, although after the timeskip this no longer applies.
