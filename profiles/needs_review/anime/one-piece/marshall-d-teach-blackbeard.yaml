- id: claim-powers-and-abilities-a736afe0
  section: abilities
  axis: hax
  text: "* Superhuman Physical Characteristics * Haki (Intermediate Kenbunshoku, Busoshoku)\
    \ * Flintlock pistol and Claw user * Proficient Hand-to-Hand Combatant * Darkness\
    \ Manipulation, Absorption, Gravity Manipulation, BFR, Pseudo Black Hole Creation,\
    \ Madness Manipulation (Type 3; Those who are absorbed by Blackbeard's darkness\
    \ are left as a mentally unstable mess with only a few seconds of exposure) *\
    \ Power Nullification (Can nullify the Devil Fruit abilities of others by touching\
    \ them) * Limited Power Absorption (Can absorb Devil Fruit abilities, but only\
    \ demonstrated the power to take the ability of a dead DF user and has only shown\
    \ the capacity to have two fruit abilities so far) * Self-Sustenance (Type 3;\
    \ Explained in the databook) Same as before plus, * Vibration Manipulation (Can\
    \ create powerful shockwaves through any medium with the power of the Tremor-Tremor\
    \ FruitOne Piece Vol. 57 Chapter 556) * Non-Physical Interaction and Spatial Manipulation\
    \ (The Tremor-Tremor Fruit has shown the ability to crackOne Piece Vol. 57 Chapter\
    \ 552One Piece Vol. 58 Chapter 563, grab, and warp spaceOne Piece Vol. 58 Chapter\
    \ 564. This ability allowed Blackbeard to fragment and destroy Trafalgar Law's\
    \ Room spaceOne Piece Vol. 105 Chapter 1064 and later clash with his formless\
    \ K-ROOM blade) * Air Manipulation (With the swing of his bisento, can generate\
    \ powerful air pressure with his attacksOne Piece Vol. 58 Chapter 566. Can use\
    \ air-quakes through cracking the air and sending shock waves through the air\
    \ as a resultOne Piece Vol 58 Chapter 572) * Water Manipulation (His devil fruit\
    \ is able to create large tsunamis) * Earth Manipulation (With his power, he can\
    \ tilt the ground) * Weather Manipulation (His power is able to affect the sky,\
    \ bringing great stormsOne Piece Vol. 45 Chapter 434) * Limited Durability Negation\
    \ (His vibrations can pass through the bodies of opponents, affecting them internallyOne\
    \ Piece Vol. 59 Chapter 576) Same as before but stronger, Enhanced Haki (Intermediate\
    \ Busoshoku) * Resistance to ** Heat Manipulation (28000\xBAC - He was able to\
    \ calmly withstand the heat of Ace's flames and even make contact with them directly,\
    \ without getting burned. However, Teach still suffered in pain from the heat\
    \ of the flames) ** Ice Manipulation (His vibrations should be strong enough to\
    \ prevent being externally frozen just like Whitebeard), Gravity Manipulation\
    \ (Unaffected by his own gravity) ** Madness Manipulation, Mind Manipulation and\
    \ Soul Manipulation via Willpower (Through sheer willpower they can resist losing\
    \ their mind when absorbing shadows through the Kage Kage no Mi. Shadows belonging\
    \ to strong willed people are difficult to control, allowing them to rebel against\
    \ Moria's pact which usually immediately submits a shadow to his supremacy and\
    \ orders. Spiritual energy is contained within one's soul/life; this energy is\
    \ represented by the fighting power or the Haki itself. Those with strong souls,\
