      value: Gifted (He was considered Whitebeard Commander caliber by virtue of his
        basic combat prowess, before he ate the Yami Yami no Mi, with decades of battle
        experience in the grim and feral New World. Quickly learned to access and
        use the Yami Yami no Mi efficiently after eating it, was able to utilize the
        Gura Gura no Mi to a significant extent moments after absorbing it. A very
        cunning and patient strategist, laying low with the Whitebeard Pirates for
        twenty years to find the Yami Yami no Mi fruit. Manipulated the World Government
        by joining the Seven Warlords of the Sea in order to gain access to Impel
        Down to recruit powerful prisoners to his crew, and at Marineford, used the
        conflict between the Whitebeard Pirates and the World Government to put an
        end to Whitebeard and steal his Devil Fruit powers in the process, using that
        power to gain massive influence and become one of the Four Emperors)
