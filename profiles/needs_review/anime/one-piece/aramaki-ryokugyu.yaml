power_scale:
  tier:
    text: Low 5-B
    source_ids: &id002
    - mediawiki-4804089
    confidence: 0.8
  attack_potency:
    text: Small Planet level (As a Navy Admiral and one of the "Greatest Military
      Powers," Aramaki should be superior to CP0 and SSG members like Sentomaru. Fought
      Revolutionary Army commander Morley during the assault on Marijoa, and later
      engaged in battle with Issho, all while holding back significantly and without
      sustaining notable injuriesOne Piece Vol. 92 Chapter 925One Piece Vol. 104 Chapter
      1054One Piece Vol. 107 Chapter 1083One Piece Vol. 107 Chapter 1085. Easily overpowered
      and defeated King and Queen plus several of their subordinates at once, after
      they had spent a week recuperating from their prior defeatsOne Piece Vol. 104
      Chapter 1053, however it should be noted that they were both still injured.
      Was able to take on five of the Nine Red Scabbards, Shinobu, Zoan form Momonosuke,
      and base Yamato simultaneously, subduing them all within moments upon getting
      seriousOne Piece Vol. 104 Chapter 1054One Piece Vol. 104 Chapter 1055. Should
      be roughly comparable to his fellow Admirals. According to Monkey D. Garp, the
      strongest possible forces available during the Reverie, capable of fighting
      threats like Big Mom and Kaidou, were assigned to protect the Celestial DragonsOne
      Piece Vol. 90 Chapter 907. During the Revolutionary Army's assault, Rob Lucci
      and a select group of CP0 agents were sent to guard Nefertari Vivi, while Aramaki,
      alongside Issho, were tasked with defending the Celestial Dragons. This implies
      that Aramaki is at least comparable to Rob Lucci in strength and considered
      powerful enough to confront top-tier threats. Was able to capture Weevil, an
      ex-Warlord of the Sea noted to have monstrous strength reminiscent of a young
      Whitebeard'sOne Piece Vol. 106 Chapter 10733.014 Zettatons)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: Relativistic+ with Speed of Light perceptions with Observation Haki (Has
      speed roughly on par with Fujitora, as evident from the two Admirals' scuffle
      at Marijoa). Was quick enough with his ability to capture several of the Nine
      Red Scabbards and even Yamato, ensnaring them with wooden tendrils)
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: Class E (Stronger than King and Queen. Was able to capture and keep both
      All-Stars restrained with wooden tendrils, as well as capture and hold up Yamato
      and a dragonified Momonosuke using the same method), likely Class Z (Should
      be relative to Kizaru)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Small Planet level (Was able, with his wooden tendrils, to subdue and impale
      the likes of King, the cyborg Queen, Yamato, and some of the Red Scabbards,),
      likely far higher (Should be roughly comparable to his fellow Admirals)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Small Planet level (Took an Conqueror's Haki-infused kanabo blow to the
      head from Yamato while off-guard and, while expressing some pain, was ultimately
      unharmed. Was completely unharmed by Raizo's Fire Escape), likely far higher
      (Should be roughly comparable to his fellow Admirals)
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Can sustain himself by draining others of their body fluids/nutrients,
      which has allowed him to eschew eating/drinking normally for three years and
      presumably lets him recover his stamina mid-battle)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Extended Melee Range; Kilometers with his Devil Fruit power (Can create
      and control a large forest with which to blanket the landscape)
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: 'Above Average (Experienced Marine officer: should have enough strategic
      acumen and leadership ability to hold the rank of Admiral with competence)'
    source_ids: *id002
    confidence: 0.8
