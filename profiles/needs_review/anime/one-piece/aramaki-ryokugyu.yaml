- id: claim-powers-and-abilities-b8a6c94b
  section: abilities
  axis: hax
  text: "*Superhuman Physical Characteristics (Admirals are consideredOne Piece SBS\
    \ Vol. 8 Chapter 66 to be superior toOne Piece 15th Anniversary: Dive to Grand\
    \ World Page 16 Rokushiki mastersOne Piece Vol. 58 Chapter 567 such as the Vice\
    \ Admirals,One Piece Vol. 69 Chapter 681 so Aramaki should haveOne Piece Vol.\
    \ 37 Chapter 347 greater physical ability than themOne Piece Vol. 37 Chapter 348)\
    \ *Haki (Intermediate Kenbunshoku; Intermediate Busoshoku) *Plant Manipulation\
    \ (Via the Mori Mori no Mi. Ryokugyu can create and control all plant life that\
    \ makes up forests: primarily wood/trees/roots/shrubs but also flowers, grass,\
    \ mushrooms, etc. States that his power is nature [Logia] incarnate,One Piece\
    \ Vol. 104 Chapter 1054 and he can convert arid wastelands into verdant forests.One\
    \ Piece Vol. 104 Chapter 1053 As a Logia user, he can also physically transform\
    \ into plant matter/wood, making him immune to physical attacks not imbued with\
    \ Haki or otherwise exploiting his Devil Fruit weaknesses) *Intangibility (Elemental,\
    \ Type 1 Via his Devil Fruit. However, plants are a solid, and thus his powers\
    \ seem more based on seamless regeneration rather than the fluid \"intangibility\"\
    \ seen with other Logias) *Regeneration (At least High-Mid, only in his Logia\
    \ form. Can regrow an entirely new body from a sapling within secondsOne Piece\
    \ Vol. 104 Chapter 1055) *Body Control and Transformation (Via his Devil Fruit.\
    \ Capable of changing the size and shape of his plant-made Logia body, as well\
    \ as assume a massive, tree-like golem formOne Piece Vol. 104 Chapter 1054\u2013\
    1055) **Large Size (Type 2 in his tree golem form, which is shown to dwarf an\
    \ adult, full-sized dragon-form Momonosuke) *Flight (Can manifest a propeller-like\
    \ flower on his back, allowing him to fly over long distancesOne Piece Vol. 104\
    \ Chapter 1052) *Absorption (Of liquid/nutrients, sapping them away from people\
    \ via wooden roots/tendrils that pierce into their bodies. This allows Ryokugyu\
    \ to go indefinitely without eating/drinking the conventional wayOne Piece Vol.\
    \ 90 Chapter 905) Resistance to: *Fire Manipulation (Limited. Has trained to heighten\
    \ his plant body's resistance against fire-based attacks, although exceedingly\
    \ strong flames will still hurt him) *Madness Manipulation, Mind Manipulation,\
    \ and Soul Manipulation via Willpower (Through sheer willpower one can resist\
    \ losing one's mind when absorbing shadows through the Kage Kage no Mi. Shadows\
    \ belonging to strong-willed people are difficult to control, allowing them to\
    \ rebel against Moria's pact, which usually immediately submits a shadow to his\
    \ supremacy and orders. Spiritual energy is contained within one's soul/life;\
    \ this energy is represented by the fighting power or the Haki itself. Those with\
    \ strong souls, which are homologous to shadows, resist the effects of Brook's\
    \ soul manipulation)"
  source_ids: *id003
