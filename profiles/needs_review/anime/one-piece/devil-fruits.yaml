claims:
- id: claim-weaknesses-70ca5265
  section: weaknesses
  axis: weakness
  text: "The primary weakness shared across all Devil Fruit users is that they will\
    \ be rendered unable to swim. This is referred to in-universe as \"becoming a\
    \ hammer\" (\u30AB\u30CA\u30C5\u30C1, kanazuchi)One Piece Chapter 19 due to Devil\
    \ Fruit users losing all their strength while submerged in water, becoming helpless\
    \ and unable to move. This is not specific to seawater, as even freshwater pools\
    \ and baths can render Devil Fruit users powerless due to being considered \"\
    an extension of the sea\".One Piece SBS Vol. 41 Page 206 Devil Fruit users are\
    \ still conscious while submerged and capable of certain movements such as breathing\
    \ (If provided with air)One Piece Chapter 85Vivre Card - One Piece Visual Dictionary\
    \ Card #0960, Jack's Vivre Card and can even thrash about, but are overall helpless,\
    \ cannot use their powers (though powers that cause permanent changes to physiology\
    \ still apply), and cannot maneuver in the water whatsoever .One Piece Chapter\
    \ 1One Piece Chapter 403 The specific amount of water needed to render Devil Fruit\
    \ users powerless somewhat varies within the series: There are instances where\
    \ even thigh-deep water can render Devil Fruit users weakened,One Piece Chapter\
    \ 175One Piece Chapter 617 while in other instances a Devil Fruit user can bathe\
    \ their entire body with no issue so long as they have at least half of their\
    \ body out of water.One Piece Chapter 407 Generally, a Devil Fruit starts to become\
    \ powerless when at least half of their body is submerged in water.One Piece Chapter\
    \ 617 However, a consistent trait amongst all instances is that the Devil Fruit\
    \ users must be submerged in water fully, as they are not subject to the same\
    \ weakness when hit by moving water, rain, or water-based attacks.One Piece Chapter\
    \ 202One Piece SBS Vol. 41 Page 206 This weakness to water also only applies externally,\
    \ as Devil Fruit users can still drink water, and in cases where a Devil Fruit\
    \ user stores large amounts of water within themselves, they still retain their\
    \ powers.One Piece Chapter 200 An increase in surface area from a Devil Fruit\
    \ power also does not seem to be a factor in negating powers, as shown when Luffy\
    \ used Gear 3 underwater and could still function, albeit weakened, despite his\
    \ fist growing far larger than his own body.One Piece Chapter 605 Another unique\
    \ weakness to Devil Fruit users is a rare mineral known as Seastone. Seastone,\
    \ said to \"emit an energy identical to the ocean\", is capable of nullifying\
    \ Devil Fruit users powers and sap their stamina, similar to their weakness to\
    \ being submerged in water. However, they need to be in continuous physical contact\
    \ with Seastone for these weakening effects to apply, as just being near Seastone\
    \ is not detrimental.One Piece Chapter 169 Also, unlike their weakness to being\
    \ submerged, Devil Fruit users with enough endurance can power through the weakening\
    \ effects of Seastone, though their powers will still not work.One Piece Chapter\
    \ 951 Seastone also only negates Devil Fruit powers, and individuals with abilities\
    \ independent of Devil Fruits can still use their other abilities, though they\
    \ will still suffer from their stamina being drained and thus may be rendered\
    \ powerless regardless.One Piece Chapter 935 Also, though Seastone can debilitate\
    \ Devil Fruit users, Seastone itself is not impervious to Devil Fruit powers being\
    \ used on it.One Piece Chapter 444One Piece Chapter 571One Piece Chapter 677 Devil\
    \ Fruit powers also have a sort of \"hierarchy\" to the abilities they grant,\
    \ where abilities of a similar type can be classified with one having a stronger\
    \ version of the same ability. When these two powers would clash, the inherently\
    \ stronger ability will win out, though this does not account for individual skill\
    \ or usage. Sakazuki was capable of burning Ace despite him being in Logia form\
    \ because Akainu's magma was a superior power to Ace's fire.One Piece Chapter\
    \ 573One Piece SBS Vol. 79 Page 100 However, the presence of these hierarchies\
    \ when Devil Fruit powers clash are noted to be unpredictable, and there's no\
    \ way to know how these powers might interact,One Piece Chapter 546 thus this\
    \ weakness should only be considered in the cases where a hierarchy has been proven\
    \ to exist. Finally, the powers granted by a Devil Fruit can be countered by Haki.\
    \ In the cases of Logia users, Haki can bypass their intangibility by forcing\
    \ the fluid elemental bodies of Logia users to solidify.One Piece Chapter 597One\
    \ Piece Chapter 689 This bypass also affects certain Devil Fruit abilities which\
    \ directly alter the physiology of the users, such as certain Paramecia abilities\
    \ which can transform the user or Zoan transformations with a unique physiology.One\
    \ Piece Chapter 597 Strong enough Haki can outright negate powers by \"breaking\
    \ through\" them, though this does require a large amount of Haki.One Piece Chapter\
    \ 1009One Piece Chapter 1063 one-piece-luffy-punches-caesar-clown-69b2219920d33.webp|Haki\
    \ can bypass the intangibility granted by Logia Devil Fruits Devil Fruit Effects.webp|Being\
    \ submerged in water weaken"
