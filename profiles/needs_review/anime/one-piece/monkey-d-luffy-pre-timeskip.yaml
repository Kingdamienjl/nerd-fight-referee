  intelligence:
    text: Average normally, Genius in combat Normally Luffy is very average, but in
      battle, he is a genius in his own right. He's shown a myriad of different qualities
      of intelligence ranging from unique creativity to quickly comprehending difficult
      situations. This was born from his training with his grandfather Monkey D. Garp,
      and his upbringing with his foster brothers Portgas D. Ace and Sabo. Alongside
      Garp, Luffy learned how to survive. Alongside Ace and Sabo, Luffy learned how
      to fight. Raised in the harsh environment of Mount Culubo with his brothers,
      he got stronger and smarter every passing day. Luffy is extremely innovative
      and creative. As a child under the age of 6 years old, Luffy was forced to learn
      how to survive by getting thrown in ravines, being left in the wild alone and
      tied to balloons. Because of that, he taught himself how to hunt and cook meat
      to survive, showing his unnatural growth. When his ship was about to crash into
      Laboon, he shot a cannonball into the whale and used the recoil of its shockwave
      to stop his ship from colliding into Laboon. Luffy has been shown several times
      to create techniques on the spot by copying things that he has seen, whether
      it be an attack or an object. After seeing Genzo's pinwheel, Luffy made a technique
      inspired by it, where he uses all the force and weight of a sea beasts' huge
      body and spins it in a pinwheel formation to defeat several foes. He has great
      situational awareness, noticing a pole outside of a building in which he could
      stretch to dodge a plethora of daggers from Buggy. He used a rock in the ground
      to block a stab from Kuro. He threw a ship's mast at Krieg and stabbed Laboon
      with his own as well. He also stretches to retreat from fights occasionally,
      like when he took a small break from his raid on Enies Lobby to gain high ground
      in order to scout his enemies and his location, or when he grappled the top
      of Krieg's ship in order to dodge an explosion. He also noticed Buggy in a sandstorm
      and using him as a human shield in the heat of battle with the greatest swordsman
      in the world. He used a piece of a mirror in his hair to reflect Foxy's Noro
      Noro beams. While fighting Rob Lucci, he showcased this to a far superior extent,
      using large throwable objects like boxes to block his field of vision. He was
