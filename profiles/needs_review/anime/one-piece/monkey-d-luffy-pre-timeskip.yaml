      him to even move. He took several strikes from Rob Lucci that affected all of
      his organs and left him in a large puddle of his own blood, yet he could stand
      back up shortly after and withstand the same attack immediately after. After
      the Marineford War, Luffy suffered from severe physical and mental trauma due
      to the loss of his brother, his life-threatening injuries, and having to use
      adrenaline-based drugs more than once to keep fighting, only to merely pass
      out and go on a rampage several hours later immediately after going through
      surgery, and being in perfect condition some time after. Able to persevere with
      highly lethal poison coursing through his veins and with grave wounds, his stamina
      can be almost completely restored instantly if he eats meat)
