      (Can send opponents flying over the horizon to distant lands) *Telepathy (Can
      hear the Voice of All Things, allowing him to perceive and understand animals
      like the Sea Kings and Zunesha as well potentially inanimate objects *Rage Power
      (Shown here) *Reactive Power Level & Accelerated Development (Battle; Luffy
      improves himself in combat in a short span of time, going from getting thrashed
      near the beginning of a fight to matching and often surpassing his opponent
      as the battle progresses. Luffy does not win by slowly wearing himself out but
      by pushing himself to the "extreme state" that comes when he faces a strong
      enemy at full strength, and uses this as food for growth) *Supernatural Luck
      (Is described as an extremely lucky individual. Several feats of supernatural
      luck shown here) *Instinctive Reaction (Can "switch off" his conscious mind,
      allowing him to avoid attacks entirely on instinct however he cannot attack
      himself) *Afterimage Creation (Shown here) *Analytical Prediction, Information
