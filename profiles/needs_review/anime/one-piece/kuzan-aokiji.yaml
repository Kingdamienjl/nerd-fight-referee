- id: claim-weaknesses-012e5881
  section: weaknesses
  axis: weakness
  text: Standard Devil Fruit users weaknesses. He can counteract his weakness against
    water by freezing it on contact. His regeneration is limited to his logia body
    only, as he was unable to regenerate lower part of his biological left leg after
    fighting Sakazuki. His ice powers are not quite as effective against heat-based
    abilities. In the worst-case scenario, his logia powers will not fully defend
    him against heat, or his ice-based attacks will melt--much like when his Pheasant
    Beak was canceled out by one of Portgas D. Ace's attacks
  source_ids: *id003
