- id: claim-weaknesses-c05a4261
  section: weaknesses
  axis: weakness
  text: Standard Devil Fruit User Weaknesses, Cannot swim and becomes immobilized
    if more than half of his body is covered in water, loses his powers and becomes
    helpless if more than half of his body is submerged in water, when Buggy's body
    is split up he is more susceptible to attacks, an enemy can do all sorts of things
    to his separated body parts from groin kicks to tying up most of his body parts,
    Buggy can only control his separated pieces from and up to a certain distance.
    There is a cutoff point as to how far he can use his separated parts. If a part
    goes any further from the cutoff point, he loses all control of that part. This
    includes levitation and the user consciously using that body part altogether.
    This distance is a 200 Bara Bara diameter circle around the point where the person
    touches the ground, for Buggy to be able to levitate any of his body parts, his
    feet must be on the ground as they are the only body parts of the user that can't
    levitate
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-15be4cc4
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Weapon Mastery * Body Control (Ate
    the Bara Bara no Mi, a Paramecia type Devil Fruit which grants him the ability
    to split his body into parts and rejoin it) * Pseudo-Flight (He can make parts
    of him fly as long as his feet are touching the ground) * Explosion Manipulation
    (via Muggy Ball) * Social Influencing (Escaped and survived from Impel Down prison,
    gathering lots of criminals under his command by sheer luck to the point of convincing
    them to follow his lead just by bluffing) * Minor Adaptation (Adapted to the oxygen
    shortage in Skypiea) Resistance to * Extreme Heat (Endured the heat aura from
    one of Akainu''s attacks) * Madness Manipulation, Mind Manipulation and Soul Manipulation
    via Willpower (Through sheer willpower they can resist losing their mind when
    absorbing shadows through the Kage Kage no Mi. Shadows belonging to strong willed
    people are difficult to control, allowing them to rebel against Moria''s pact
    which usually immediately submits a shadow to his supremacy and orders. Spiritual
    energy is contained within one''s soul/life; this energy is represented by the
    fighting power or the Haki itself. Those with strong souls, which are homologous
    to shadows, resist the effects of Brook''s soul manipulation) * Immunity to Piercing
    and Slashing Attacks (Due to the nature of his Devil Fruit, he is completely immune
    to conventional cutting attacks, regardless of their angle or direction)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
