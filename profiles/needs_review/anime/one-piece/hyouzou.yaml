- id: claim-powers-and-abilities-633132dc
  section: abilities
  axis: hax
  text: Superhuman Physical Characteristics, Expert Swordsman (Master of Hattoryu),
    Underwater Breathing (Type 2), Natural Weaponry, Healing (The Energy Steroids
    seem to have stimulant or revitalizing properties, allowing one to recover immediately
    from being wounded and use their strength to its full extent), Statistics Amplification
    (Can drastically increase his physical capabilities by consuming Energy Steroids.
    The speed of fishmen is increased when underwater), Surface Scaling, Light Manipulation
    (Via iridophores in their rings), Instinctive Reaction (Cephalopods have 'Brains'
    within their limbs, allowing them to move/attack through instinct), Regeneration
    (Low-Mid, All cephalopods can regenerate lost tentacles), Poison Manipulation,
    Paralysis Inducement (Hyouzou is capable of secreting venom from his tentacles
    and poisoning his opponents through a mere, short-lasting physical touch, as Luffy
    was poisoned by rapidly punching him), Berserk Mode (Is capable of entering a
    kind of berserker mode when consuming Energy Steroids), Resistance to Poison Manipulation
    (Carries tetrodotoxin within it to kill 26 adult humans with no adverse health
    effects), Madness Manipulation, Mind Manipulation and Soul Manipulation via Willpower
    (Through sheer willpower they can resist losing their mind when absorbing shadows
    through the Kage Kage no Mi. Shadows belonging to strong willed people are difficult
    to control, allowing them to rebel against Moria's pact which usually immediately
    submits a shadow to his supremacy and orders. Spiritual energy is contained within
    one's soul/life; this energy is represented by the fighting power or the Haki
    itself. Those with strong souls, which are homologous to shadows, resist the effects
    of Brook's soul manipulation)
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
