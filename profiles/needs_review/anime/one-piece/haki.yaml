    field_candidates:
    - field: weaknesses
      value: 'In order to fully utilize Observation Haki, the user must remain focused
        and calm, otherwise the ability''s effectiveness becomes dulled or even negated.One
        Piece Vol 88 Chapter 884, The user, can not predict what will happen if they
        change their actions to respond to a predicted enemy attack. This also becomes
        prominent when even an advanced user is against an opponent with comparable
        or even superior levels of precognition, such as when Luffy could dodge Katakuri''s
        attacks early in their fight., are less likely to evade or defend against
        an attack if it is too fast for them to see or keep up withOne Piece Vol 53
        Chapter 520One Piece Vol 99 Chapter 1001, Users cannot sense non living things
        unless they are used by living things to harm others. Luffy can sense water
        being thrown at him but Kin''emon couldn''t sense his passive surroundings.One
        Piece Vol 66 Chapter 656One Piece Vol 67 Chapter 659One Piece Vol 67 Chapter
        663, Users are capable of running out of Kenbunshoku Haki, One Piece Vol 88
        Chapter 886 although it takes a long time, as Katakuri could go eleven hours
        using its most advanced version without it running out., Although users are
        capable of discerning emotion and intent to a great degree in people, they
        can still be fooled by superb acting skills, such as Luffy and Sanji being
        completely fooled by Pudding. center, Armament Haki, Color of Armaments, is
        one of the two most common shades of Haki. It allows the user to manipulate
        their own spiritual energy to create, in essence, an invisible armor around
        themselves in order to amplify their strength and durability. This color of
        Haki is the direct counter to Devil Fruit abilities, allowing them to harm
        Logias with elemental intangibility and Paramecias with special blunt force-negating
        bodies, negate resistances, and even resist Devil Fruit abilities. It is referred
        to as an "invisible armor" that grows in strength as the user''s Haki grows
        in potency.One Piece Vol 61 Chapter 597 More potent Buso allows people to
        affect those who can resist abilities from weaker Buso users.One Piece Vol
        69 Chapter 690 It can be used while unconscious, Initial Stage: Haki users
        at this stage are capable of using Busoshoku Haki at its basic levels, this
        is not an initial stage of a Haki shade that works uncontrollably, also known
        as "Hardening" which makes the invisible armor now visible, and it covers
        the user in a black colored coating which is much more potent than the invisible
        Haki. Particularly strong concentrations of Busoshoku in a body part will
        cause the edges of the coating to take the shape of flames.One Piece Vol 78
        Chapter 784One Piece Vol 87 Chapter 871One Piece Vol 89 Chapter 895 Users
        are shown to infuse Busoshoku: Koka into other objects, like swords, One Piece
        Vol 78 Chapter 778 bullets, One Piece Vol 98 Chapter 992 and even bamboo sticksOne
        Piece Vol 69 Chapter 690 and Devil Fruit abilities.One Piece Vol 79 Chapter
        790 Users can turn incredibly weak things into very strong weapons, One Piece
        Vol 69 Chapter 690 or giving regular arrows the power to break through stone.One
        Piece Vol 53 Chapter 516 If a projectile weapon is imbued with Haki, One Piece
        Vol 69 Chapter 690One Piece Vol 78 Chapter 778One Piece Vol 101 Chapter 1018
        although this is noted to be rare. Swordsmen are known to create "Black Blades",
        creating permanent black blades, via using Koka on a sword over a long period
        of time, which makes the sword much more durable. This "forging" process seems
        to happen specifically because of consistent Armament Haki usage, One Piece
        Vol 95 Chapter 955 and Black Blades are some of the most durable weapons in
        existence because of it. In addition to becoming nigh-indestructible, Black
        Blades automatically move up a grade rank when they are forged as such.One
        Piece Vol 95 Chapter 995, Examples include Monkey D. Luffy as of Post Timeskip'
