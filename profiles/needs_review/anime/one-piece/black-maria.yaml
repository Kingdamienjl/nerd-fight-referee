- id: claim-powers-and-abilities-63c982a3
  section: abilities
  axis: hax
  text: "Superhuman Physical Characteristics, Haki (Kenbunshoku, Intermediate Busoshoku),\
    \ Skilled Polearm wielder (She is highly adept at using her polearm Wanyudo),\
    \ Martial Arts, Large Size (Type 0; 820 cm. Type 1 in Zoan form), Social Influencing\
    \ (Turned Samurai into her \"pets\" who supposedly can't survive without her),\
    \ Preparation (With sufficient time she can lay many traps with her webs and subordinates\
    \ to capture people), Transformation and Natural Weaponry (She ate the Kumo Kumo\
    \ no Mi, Model: Rosamygale Grauvogeli, an Ancient Zoan-type Devil Fruit that allows\
    \ her to transform into a full Rosamygale grauvogeli\u2014a prehistoric, carnivorous\
    \ spider\u2014as well as into a human-spider hybrid at will), Regeneration (Mid-Low),\
    \ Poison Manipulation (The tips of her legs are poison needles), Enhanced Senses\
    \ (Zoan's gain the senses of their respective animal), Surface Scaling, Thread\
    \ Manipulation and Adhesive Manipulation via Webs, Fire Manipulation (via Wanyudo\
    \ and Atatamaria), Illusion Creation (Her illusion mist causes the effected to\
    \ see and hear their most precious memories), Resistance to Fire Manipulation\
    \ (Unaffected by her own and Wanyudo's fire), Animal Manipulation (Zoans are immune\
    \ to Tama's Kibi Dangos)"
  source_ids: *id003
  decisive: true
