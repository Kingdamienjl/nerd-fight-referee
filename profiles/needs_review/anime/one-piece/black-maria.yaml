  intelligence:
    text: Gifted (As one of the six strongest Shinuchi with a 480,000,000 Berries,
      Black Maria is very powerful and considered potentially able to challenge an
      All-Star, such as King, Queen or Jack, for their position. Black Maria has shown
      herself to be a crafty strategist, having collaborated with her subordinates
      to come up with an ingenious trap to subdue Sanji, one of the Straw Hat Pirates'
      strongest members, by taking advantage of his obsessive chivalry, having Sarahebi
      feign being sexually harassed while she used her spider web to trap Sanji. As
      part of her plan to lure and seize Robin into the Banquet Hall, she had several
      spider webs set up in the two corridors used to access the room, and a few subordinates
      armed with tranquilizer guns and placed into strategic positions to further
      ensure Robin's capture. This was, however, countered by Robin's own ability
      to bypass obstacles by blooming her own limbs through them and Brook's ice freezing
      Black Maria's webs solid)
    source_ids:
