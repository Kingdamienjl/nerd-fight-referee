        subordinates to come up with an ingenious trap to subdue Sanji, one of the
        Straw Hat Pirates' strongest members, by taking advantage of his obsessive
        chivalry, having Sarahebi feign being sexually harassed while she used her
        spider web to trap Sanji. As part of her plan to lure and seize Robin into
        the Banquet Hall, she had several spider webs set up in the two corridors
        used to access the room, and a few subordinates armed with tranquilizer guns
        and placed into strategic positions to further ensure Robin's capture. This
        was, however, countered by Robin's own ability to bypass obstacles by blooming
