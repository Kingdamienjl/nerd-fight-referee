        \ belonging to strong willed people are difficult to control, allowing them\
        \ to rebel against Moria's pact which usually immediately submits a shadow\
        \ to his supremacy and orders. Spiritual energy is contained within one's\
        \ soul/life; this energy is represented by the fighting power or the Haki\
        \ itself. Those with strong souls, which are homologous to shadows, resist\
