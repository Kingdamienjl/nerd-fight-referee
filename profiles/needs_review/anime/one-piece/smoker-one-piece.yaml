- id: claim-powers-and-abilities-1de0009e
  section: abilities
  axis: hax
  text: '* Superhuman Physical Characteristics * Enhanced Senses (Has demonstrated
    acute hearing, being able to distinguish between the three cries of Bananawani)
    * Master Jitte Wielder (i.e. the martial art of using jitte) * Expert Hand-to-Hand
    Combatant (Dexterously uses his Logia-dispersion to compliment him in close-quarter-combat)
    * Smoke Manipulation (Ate the Moku Moku no Mi, a Logia-type Devil Fruit which
    allows him to create, control, and become smoke) * Intangibility (Elemental; Type
    4) * Inorganic Physiology (Type 1; While he''s turned into smoke) * Body Control
    (He should have the ability to change the space and size of his Logia-form to
    various degrees) * Regeneration (Mid-High; when in Logia form he can pull himself
    back together from smoke no matter how many times he is dispersed) * Flight (Only
    when dispersed as smoke) * Limited Water Radiation Manipulation and Minor Aura
    Suppression with Seastone (Seastone emits an energy identical to the ocean that
    Devil Fruit users can sense from far away, and it''s stated by Smoker to be the
    sea in solid form. Because it emits the same energy as the sea, Sea Kings and
    other fish cannot perceive it because they get it mixed up with the ocean) Resistance
    to * Smoke Manipulation (All Logias are resistant to their respective elements)
    * Limited Power Nullification and Stamina Absorption (Has been shown to been capable
    of moving regardless of being affected by varying densities of Seastone that he
    casually carries around, while low densities have been shown to completely incapacitate
    and drastically weaken others and stopping them from using their abilities) All
    previous abilities to a greater extent, plus * Haki (Intermediate Kenbunshoku,
    Intermediate Busoshoku) Resistance to * Madness Manipulation, Mind Manipulation
    and Soul Manipulation via Willpower (Through sheer willpower they can resist losing
    their mind when absorbing shadows through the Kage Kage no Mi. Shadows belonging
    to strong willed people are difficult to control, allowing them to rebel against
    Moria''s pact which usually immediately submits a shadow to his supremacy and
    orders. Spiritual energy is contained within one''s soul/life; this energy is
    represented by the fighting power or the Haki itself. Those with strong souls,
    which are homologous to shadows, resist the effects of Brook''s soul manipulation)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
