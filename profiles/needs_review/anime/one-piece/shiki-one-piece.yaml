    text: Small Planet level (Would've defeated Gol D. Roger and his crew in the Edd
      War if it wasn't for a storm, and Databook Blue states that Shiki once stood
      as equals with Roger. Destroyed half of Marineford single-handedly, and contended
      against both Monkey D. Garp and Sengoku in their prime after having part of
      a ship's steering wheel implanted in his head, and Garp stated that he was a
      dangerous foe. Stronger than his later self) | Unknown
    source_ids:
