    - field: powers_and_abilities
      value: CPU Neptune=Superhuman Physical Characteristics, Weapon Mastery (Of swords),
        Acrobatics (Can preform various midair movements, further helped by her ability
        to create glyphs midair), Psuedo-Flight (Via usage of glyphs midair), Immortality
        (Type 1 and possibly 8; as a goddess, she cannot age, as age does not apply
        to goddesses. Based on her statements in episode five, she implies that goddesses
        cannot perish so long as they have a connection to Share Energy.), Self-Sustenance
        (Types 1, 2, and likely 3; Can survive and breathe in space. CPUs have repeatedly
        displayed a lack of need for breathing in several continuities. As noted and
        displayed in Victory/RB3, CPUs do not require sustenance to stay alive and
        cannot starve to death. CPUs can remain in active combat with no rest for
        billions of years with no sign of tiredness, as displayed in the original
        Hyperdimension Neptunia, where the four CPUs have fought for eons.), Healing
        (Through Share Energy, which can allow her to recover from a near death state),
        Transformation (With HDD), Fourth Wall Awareness (Like other versions of Neptune,
        she consistently breaks the fourth wall on a regular basis.), Social Influencing
        (Is noted to be particularly charismatic in the "Thanksgiving (Festival) Full
        of Nep-Nep" OVA), Indomitable Will (Left the dream world through sheer motivation
        and will in the "Thanksgiving (Festival) Full of Nep-Nep" OVA), Share Energy
        Manipulation (Lower End Applications; as a goddess, she can freely manipulate
        Share Energy for various purposes), Weapon Creation (Can create her weapons
        out of nothing on the fly.), Glyph Creation, Forcefield Creation (Can create
        platforms to walk across, use as a seat, give herself a midair boost, or use
        as a barrier to fend off attacks. She's capable of doing this in base but
        hasn't displayed it as much as her transformed self, as shown in her transformation
        scene, where she creates a pink colored platform), Aura (Goddesses display
        an aura around themselves before transforming. They can also continue to retain
        the aura after the transformation and have it dissipate whenever), Shockwave
        Generation (Goddesses can send out shockwaves before transforming as seen
        with Nepgear's initial transformation), Existence Erasure (Like other characters,
        even basic attacks from her can erase monsters from existence), Non-Physical
        Interaction (Could interact and was briefly in combat with Neptune GT), Data
        Manipulation (Can interact with and destroy things made up of data), Forcefield
        Creation (Similarly to other characters such as her sister, Neptune can create
        a forcefield in front of her to defend against attacks), Light Manipulation
        (As shown in episode 5, the goddesses, even when just barely alive, can create
        a large amount of light from themselves that shines through an opaque black
        barrier), Air Manipulation (Like Blanc, she should be capable of sending out
        whirlwinds with the swings of her weapons), Illusion Creation (Stated herself
        to have used a mirage to make it look like she stripped when she actually
        didn't alongside Vert and Plutia during the R-18 Island episode.), Extrasensory
        Perception (Can sense forms of energy in others, such as Share Energy)
