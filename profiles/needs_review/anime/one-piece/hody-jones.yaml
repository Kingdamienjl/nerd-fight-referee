    - field: intelligence
      value: 'Above Average (He was recognized as a particularly talented soldier
        during his time in the Neptune Army and as such should be noted as an experienced
        combatant with knowledge and experience of combat techniques on the battlefield.
        Hody is an extensive planner and shrewd captain, carefully managing the core
        group of the "New Fish-Man Pirates" so that all its members would share his
        extremist ideals and intense prejudice towards humanity. He shot Queen Otohime
        of Fish-Man Island and then framed a nearby human smuggler as his scapegoat
        and kept it a secret for many years to increase support from the wider island
        community in persecuting humans. He was also more financially supportive of
        his members, freely willing to spend money to recruit the services of Hyouzou,
        something which Arlong was unwilling to do, and was also able to recognize
        the value of an alliance with Vander Decken IX as an equal partner to kill
        the potential threat of Princess Shirahoshi. He nearly succeeded in overthrowing
        Neptune and would have if not for Luffy''s intervention) Standard Tactics:
        Hody is a fairly well-skilled Fishman Karate practitioner, and will prefer
        to use ranged water-based attacks if possible to snipe an opponent from afar
        before blitzing in for a kill. Almost always bloodlusted considering his Great
        White Shark heritage, Hody is exceptionally straightforward in fights. He
        will attempt to make it a water-based fight for his own advantage if possible,
        use human shields, bite his opponent with his powerful jaws, and all around
        try to out-bruteforce his foe with raw physicals. Of special note, Hody will
        indulge in Energy Steroid quite frequently, a drug which amps the user''s
        physicals by 2 multiplicatively.'
      source_id: mediawiki-705707
      provider_id: vsbattles
      authority: high
      confidence: 0.75
