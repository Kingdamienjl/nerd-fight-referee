      value: Superhuman Physical Characteristics, Enhanced Senses (As a Great White
        Shark Fishman, he should be capable of smelling even a small amount of blood
        up to 5 kilometers away), Extrasensory Perception (As a Great White Shark
        Fishman, he should be able to sense bioelectrical fields generated by other
        aquatic organisms and vibrations within the water, and see well in darkness),
        Underwater Breathing (Type 2), Natural Weaponry (Via his sharp teeth), Weapon
        Mastery, Skilled with Fishman Karate, Expert Swimmer, Limited Water Manipulation
        and Shockwave Generation (Via Fishman Karate), Limited Regeneration (Mid-Low,
        Like Arlong, Hody is also able to grow his teeth back immediately after they
        are broken), Healing (The Energy Steroids seem to have stimulant or revitalizing
        properties, allowing one to recover immediately from being wounded and use
        their strength to its full extent), Statistics Amplification (Can drastically
        increase his physical capabilities by consuming Energy Steroids, plus a Fishman
        gains their natural strength and speed when underwater), Damage Boost (As
        a Shark Fishman, each time his teeth is shattered and regenerated, it become
        more stronger than before), Berserk Mode (Is capable of entering a kind of
        berserker mode when consuming Energy Steroids), Resistance to Madness Manipulation,
        Mind Manipulation and Soul Manipulation via Willpower (Through sheer willpower
        they can resist losing their mind when absorbing shadows through the Kage
        Kage no Mi. Shadows belonging to strong willed people are difficult to control,
        allowing them to rebel against Moria's pact which usually immediately submits
        a shadow to his supremacy and orders. Spiritual energy is contained within
        one's soul/life; this energy is represented by the fighting power or the Haki
        itself. Those with strong souls, which are homologous to shadows, resist the
        effects of Brook's soul manipulation)
