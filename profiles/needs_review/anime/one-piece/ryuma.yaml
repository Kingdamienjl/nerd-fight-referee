    the techniques are amplified to a much higher level), Haki (Advanced Busoshoku),
    Information Analysis (Capable of sensing the "Breath" of all things, allowing
    him to know the trajectory of something's movements before it happens as well
    as it's location despite not being visible to him. By doing so he can determine
    the speed, power and angle of where he should cut at allowing him to cut objects
    he otherwise couldn't with strength alone), Analytical Prediction (Through sensing
    the breath of someone or an object he can know the trajectory of their actions
    before it happens), Extrasensory Perception (Through sensing the breath of someone
    or an object he can know their location despite not being visible to him), Limited
    Durability Negation (Through sensing the "Breath" of their desired target they're
    able to cut objects or people they otherwise couldn't through power alone. It's
    effectiveness begins to lessen against objects or opponent's with durability that
    far exceeds the limit of this ability) | Same as before except for Haki, Air Manipulation
    (Can generate wind blades with sword slashes), Limited Durability Negation against
    swords, Inorganic Physiology (Type 2), Immortality (Type 7), Immunity to Pain
    Manipulation (Zombies are stated to be unable to feel pain in any way)
  source_ids: *id003
