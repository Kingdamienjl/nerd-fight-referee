  intelligence:
    text: '{{Border|Scroll=Yes|Visible=Yes|Padding=Yes|Content= Combat Genius. Gen
      is the Captain of the Defense Force''s First Division, the strongest key division
      in Japan, the nation with the highest monster emergence rates in the world,
      dubbed the "kaiju supernation," and famous even outside of Japan for its exceptional
      power.Kaiju No. 8 Vol. 5 Chapter 39 Each officer is stated by Kikoru to be highly
      skilled, having an estimated unleash combat power of over 40%, making them stronger
      than the Platoon Leader Class of the other divisions.Kaiju No. 8 Vol. 5 Chapter
      39 Director General Isao Shinomiya, who was once known as the "Strongest Soldier"
      in the entire history of the Defense Force as well as Humanity''s Strongest,
      appears to hold high regard for the First Division, as he decided to make it
      even stronger by including in it both Japan''s strongest anti-kaiju combatant
      Gen Narumi and the benevolent kaiju part of the strongest-class Kafka Hibino.Kaiju
      No. 8 Vol. 5 Chapter 40 In fact, Gen stated that everything he knows about combat
      was drilled into him by Isao,Kaiju No. 8 Vol. 7 Chapter 54 from hand-to-hand
      combat to swordsmanship,Kaiju No. 8 Chapter 86 with his skills being highly
      recognized that Isao entrusted Gen with the safety of the Defense Force and
      the whole nation when he completely steps down from combat.Kaiju No. 8 Vol.
      7 Chapter 52 Even among his own division, he is regarded as having such exceptional
      combat talents that as a show of respect for his strength, many of the platoon
      leaders would dye a portion of their hair to emulate him. In fact, from the
      moment they first occupied the same space on the battlefield, Platoon Leader
      Shinonome herself was overwhelmed by the level of combat mastery Gen displayed
      in comparison to her own, describing him as "an entity far beyond my reach".Kaiju
      No. 8 Chapter 82 His skills are regarded as genuine because even one demonstration
      of them is enough to overshadow all of his flaws as a problem child on the verge
      of being discharged entirely from the Defense Force multiple times,Kaiju No.
      8 Chapter 88 which Mina Ashiro also agree with, saying that his only redeeming
      talent is slaying kaiju.Kaiju No. 8 Vol. 7 Chapter 57 When he was a child, Gen
      was able to handle kaiju''s uniorgans, which are not designed for a flesh and
      blood person to use. He was able to draw forth a tremendous amount of power
      from a corpse alone, and he was able to slay kaiju without needing a Defense
      Force suit or weaponry, which Hasegawa deemed to be impossible.Kaiju No. 8 B-Side
      Chapter 9 After being tested, it was determined that at such a young age, Gen''s
      unleashed combat power is 24%, despite the fact that a regular officer can typically
      get after undergoing training is 20%, and Gen has never donned a suit, which
      was observed as a high unprecedented to Eiji Hasegawa.Kaiju No. 8 B-Side Chapter
      10 Despite his childish and eccentric nature, Gen possesses great levels of
      intelligence. Able to score high marks in not only athletics but academics as
      well in school and the Defense Force, putting him at the top of his classes.Kaiju
      No. 8 B-Side Chapter 10 Even during major crisis, Gen is able to remain calm
      and make important observations about the battlefield and the enemy''s strategy.Kaiju
      No. 8 Vol. 5 Chapter 42Kaiju No. 8 Vol. 9 Chapter 71Kaiju No. 8 Vol. 10 Chapter
      77 As the captain of the First Division, Gen has shown excellent leadership
