  intelligence:
    text: "Combat Genius. Mina is the Captain of the Third Division of the Defense\
      \ Force and a very powerful combatant, able to release up to 96% of her suit's\
      \ power and thus proving that she is capable of scaling the wall that people\
      \ hit with unleashed combat powers, a wall that only a few can scale, since\
      \ most officers will end their careers with their unleashed combat powers capped\
      \ at 20 or 30%, unable to push beyond that no matter how hard they strive or\
      \ how great their accelerated development is, such as Iharu.Kaiju No. 8 Vol.\
      \ 2 Chapter 14Kaiju No. 8 Vol. 2 Chapter 16 As the captain of the Third Division,\
      \ Mina has shown excellent leadership skills and is capable of bringing her\
      \ troops together to neutralize Kaiju threats.Kaiju No. 8 Vol. 1 Chapter 1 Mina\
      \ is a serious and determined woman who takes her work and role in the Defense\
      \ Force very seriously and she strives to uphold the promise made as a child\
      \ to defeat every kaiju to the point that she dedicates all of herself to kaiju\
      \ fighting, making her usually uninterested in anything outside of that.Kaiju\
      \ No. 8 Vol. 1 Chapter 4 However, when engage in casual activities, such as\
      \ video games, she faces it with the same determination and become heavily invested\
      \ in it to the point of being unable to differentiate between the game and reality.Kaiju\
      \ No. 8: Relax Chapter 2 She is the \"strongest\" female captain of the Defense\
      \ ForceKaiju No. 8 Vol. 9 Chapter 69 and has neutralized hundreds of kaiju in\
      \ her career.Kaiju No. 8 Vol. 1 Chapter 1 With skills rivaled only by her looks,\
      \ she is regarded as one of the most popular captains currently in service and\
      \ a shoo-in for future corps commander.Kaiju No. 8 Vol. 1 Chapter 1 Stated that\
      \ no one else in the entire world can wield large kaiju weapons with the level\
      \ of capacity Mina has since those weapons require a greater quantity and variety\
      \ of kaiju tissues, and unless one can draw out all its power at a high enough\
      \ level, the weapon will not only lose range and force, but it also won't be\
      \ able to pierce a kaiju's shield. It was stated that if the Defense Force had\
      \ her giant-class disposal abilities, which surpassed even that of the Captain\
      \ of the First Division, \"Japan's Strongest Anti-Kaiju Combatant\", Gen Narumi,\
      \ during the No. 6 Cataclysm, one of the greatest disasters in Japanese history,Kaiju\
      \ No. 8 Vol. 5 Chapter 38Kaiju No. 8 Vol. 7 Chapter 59 they would have likely\
      \ mitigated damage to under a third of what they incurred.Kaiju No. 8 Vol. 10\
      \ Chapter 76 From her first mission with the Third Division, Mina's extraordinary\
      \ skill as a super artillery assault specialist was recognized.Kaiju No. 8 Chapter\
      \ 95 When Director General Isao Shinomiya discovered her power, he declared\
      \ that she was \"the missing link\" and that she would forever change kaiju\
      \ neutralization, something he didn't stated with genius fighters like Gen Narumi.Kaiju\
      \ No. 8 Chapter 95 Even Kaiju No. 9, a powerful adversary that could threaten\
      \ the entirety of the Defense Force with its might and intellect, acknowledges\
      \ and admires Mina's strength and wants to steal it from her in order to become\
      \ stronger.Kaiju No. 8 Chapter 96 It was stated by Kaiju No. 9 that if it were\
      \ to absorb and incorporate Mina into its creations, it would be able to give\
      \ birth to an army of giant No. 6-class Kaiju with superb shooting ability and\
      \ without Mina as its trump card to confront these giants, humanity will have\
      \ no way to stop them.Kaiju No. 8 Chapter 98 Isao Shinomiya personally invited\
      \ her in her teens to join the First Division, a gathering place for elite officers\
      \ from across the nations, including future captain candidates, because of her\
      \ extreme skills in kaiju neutralization, imposing presence, and ability to\
      \ work in teams effectively, placing her at the top of her class alongside her\
      \ contemporary Gen Narumi prior to awakening RT-0001, whose power is greatly\
      \ valued so much so that Isao would constantly fight with HQ and prevent them\
      \ from discharging him.Kaiju No. 8 B-Side Chapter 10Kaiju No. 8 B-Side Chapter\
      \ 12 Captain and Vice-Captain level fighters are stated to be more than capable\
      \ of defeating a Fortitude 6.4 in solo combat, even though just a Fortitude\
      \ 6.4 Kaiju is so dangerous that neutralizing just one would require an entire\
      \ company of general officers from the Third Division.Kaiju No. 8 Vol. 1 Chapter\
      \ 7 General Officers from the Third Division possess Unleashed Combat Powers\
      \ around 20-30%,Kaiju No. 8 Vol. 1 Chapter 5 making them more skilled than JSDF\
      \ military officers, such as Aoi Kaguragi, who was recognized as the military's\
      \ rising star when he first joined the Defense Force, not to mention capable\
      \ of holding their own against kaijuKaiju No. 8 Vol. 10 Chapter 75 who is not\
      \ only intelligent enough to predict Soshiro Hoshina\u2019s movement but is\
      \ fast enough to blitz him and knock him away when using 51% of Numbers Weapon\
      \ 10's power \u2014 meaning that these kaiju are more than capable of blitzing\
      \ and one-shotting the general officersKaiju No. 8 Vol. 9 Chapter 73 \u2014\
      \ and neut"
