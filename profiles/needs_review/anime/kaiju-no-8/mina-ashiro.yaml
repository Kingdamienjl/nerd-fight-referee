        \ possess Unleashed Combat Powers around 20-30%,Kaiju No. 8 Vol. 1 Chapter\
        \ 5 making them more skilled than JSDF military officers, such as Aoi Kaguragi,\
        \ who was recognized as the military's rising star when he first joined the\
        \ Defense Force, not to mention capable of holding their own against kaijuKaiju\
