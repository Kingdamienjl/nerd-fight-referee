  intelligence:
    text: "Genius Kikoru is lauded as the greatest talent of all time,Kaiju No. 8\
      \ Vol. 1 Chapter 4 especially in Japan, the nation with the highest monster-emergence\
      \ rates in the world and dubbed the \"kaiju supernation,\" as she possesses\
      \ the best talent in the history of the Japanese Defense Force, which would\
      \ include characters like Soshiro Hoshina, Gen Narumi, Mina Ashiro, Isao Shinomiya,\
      \ etc\u2026 This is corroborated by Soshiro, who describes her as outstanding\
      \ and expresses his admiration for her skill with both fire arms and swordplay\
      \ but also expresses that she is still unrefined and has some more growing to\
      \ do.Kaiju No. 8 B-Side Chapter 1Kaiju No. 8 B-Side Chapter 4 Her excellent\
      \ combat skills, in tandem with her remarkable Unleashed Combat Power and tactical\
      \ skills, earned Kikoru the praise of many senior officers, most, if not all,\
      \ of them agreeing that she will become the linchpin of the Defense Force in\
      \ the future.Kaiju No. 8 Vol. 1 Chapter 7Kaiju No. 8 Vol. 10 Chapter 78 She\
      \ was able to unleash 46% of her suit's power by the time she applied to the\
      \ Third Division, breaking the previous pre-enlistment recordKaiju No. 8 Vol.\
      \ 1 Chapter 5 and proving that she was already capable of scaling the wall that\
      \ people hit with unleashed combat powers, a wall that only a few can scale,\
      \ since most officers will end their careers with their unleashed combat powers\
      \ capped at 20 or 30%, unable to push beyond that no matter how hard they strive\
      \ or how great their accelerated development is, such as Iharu.Kaiju No. 8 Vol.\
      \ 2 Chapter 14Kaiju No. 8 Vol. 2 Chapter 16 Kikoru is known for being ruthless\
      \ in battle and brutalizing her opponents by tearing their bodies apart, attacking\
      \ vulnerable body areas, chop off their limbs, bisecting them, or simply just\
      \ decapitating them to end fights quickly because she inherited her father's\
      \ offensive prowess.Kaiju No. 8 Vol. 5 Chapter 43Kaiju No. 8 Vol. 6 Chapter\
      \ 44Kaiju No. 8 Vol. 9 Chapter 72 In fact, her typical plan is to attack head-on\
      \ and subdue with overwhelming power\u2014that doesn't mean strategy isn't important\
      \ to her, as she could quickly deduce that Soshiro wanted her to judiciously\
      \ incorporate standard weapons into her attacks during a training session, but\
      \ the hope of a one-shot kill suited her temperament best.Kaiju No. 8: Exclusive\
      \ on the Third Division Chapter 2 Although she doesn't have the raw power that\
      \ Aoi Kaguragi has, her blows are swift and well-aimed, and her footwork was\
      \ graceful enough to close appropriate distances as she willed it, showing that,\
      \ despite her aggressive fighting style, she has technique, according to Soshiro\
      \ Hoshina.Kaiju No. 8: Exclusive on the Third Division Chapter 3 Even as a young\
      \ child, she was noted for having outstanding talent and was described as a\
      \ soldier who was rapidly growing because her father constantly chastised her\
      \ that focusing on a single success will only cause one to falter and that in\
      \ order to be perfect for the sake of the nation's future and her late mother\
      \ as well, she should waste no time and begin working toward the next goal,\
      \ always moving forward so she will never be outdone and instead dominate everything\
      \ in her path.Kaiju No. 8 Vol. 1 Chapter 7 She attended a variety of neutralization\
      \ schools, which are the Defense Force's equivalent to IRL schools, spanning\
