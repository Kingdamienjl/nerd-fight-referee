    \ No. 8 Chapter 103 it is shown that they can physically interact with that person,Kaiju\
    \ No. 8 Chapter 128 even if they are a being with no true form.Kaiju No. 8 Chapter\
    \ 118 As Kafka can see the departing spirits of the Meireki Kaiju and the grudge\
    \ warriors,Kaiju No. 8 Chapter 128 it means that the consciousness also holds\
    \ the soul of a being. In this mental realm, one can give or take the essence\
