- id: claim-intelligence-305583c1
  section: power_scale
  axis: battle_iq
  text: "Combat Genius. According to Hoshina, Reno has been noted as the second-best\
    \ talent after Kikoru since joining the Third Division and training for two months.\
    \ This was further demonstrated when Soshiro claimed that Reno has the potential\
    \ to scale the wall that people hit with unleashed combat powers, a wall that\
    \ only a few can scale, since most officers will end their careers with their\
    \ unleashed combat powers capped at 20 or 30%, unable to push beyond that no matter\
    \ how hard they strive or how great their accelerated development is, such as\
    \ Iharu.Kaiju No. 8 Vol. 2 Chapter 14Kaiju No. 8 Vol. 2 Chapter 16 Reno's talent\
    \ grew even more after leaving the Third Division and joining the Fourth Division\
    \ to the point where Iharu acknowledges Reno as a genuine monster among their\
    \ peers, even more so than Kikoru, Aoi, and Haruichi when they were in the Third\
    \ Division.Kaiju No. 8 Vol. 8 Chapter 61 Despite lacking a neutralization university\
    \ education and having average entrance exam scores,Kaiju No. 8 Vol. 7 Chapter\
    \ 58 he is regarded by Captain Ogata as a prodigy due to his abnormal growth,\
    \ which allows him to develop his strength and skills through fighting and training\
    \ at a rate that is significantly faster than even a prodigy amongst prodigies\
    \ such as Kikoru Shinomiya, allowing him to perform tasks stated to be impossible.Kaiju\
    \ No. 8 Vol. 8 Chapter 60 In contrast to his own natural ability, even Haruichi\
    \ Izumo acknowledges Reno's innate talent.Kaiju No. 8 Chapter 102 Martial arts,\
    \ such as kendo or judo, became mandatory subjects in middle school and higher\
    \ education as a result of the government's curriculum modification for the next\
    \ generation.Kaiju No. 8 B-Side Chapter 1 Seniors in the Defense Force, as well\
    \ as Soshiro Hoshina and Kikoru Shinomiya, recognize Reno as a truly capable individual,\
    \ not only for his combat prowess but also for his personal qualities. Even Iharu,\
    \ the self-proclaimed capable man examiner, stated that Reno had earned over 100\
    \ points within less than an hour, showcasing multiple skills like looking at\
    \ surrounding situations, being attentive, having good balance, etc. Reno's exceptional\
    \ abilities allow him to notice minuscule details, such as Kikoru cutting her\
    \ ends by one centimeter, Kafka Hibino's shoe size, or Iharu's empty drink prompting\
    \ him to order a cola. Reno's exceptional abilities allow him to predict events\
    \ in advance, to the point where Iharu describes him as frightening. For instance,\
    \ he can anticipate and correct Kafka's mistakes, such as forgetting to take out\
    \ his trash or order the limited edition shoes on time, and identify the song\
    \ Kafka wants to sing at karaoke based on limited information, only to reveal\
    \ that he had prematurely added the exact song to the queue. His talent when it\
    \ comes to music and cooking is such that in their respective worlds, he would\
    \ reach the highest position; in fact, for the latter, he could make good-looking\
    \ food just from leftovers that taste perfect.Kaiju No. 8: Relax Chapter 3 In\
    \ battle, Reno is a determined and straightforward person, being a natural thinker\
    \ on his own. After training with the Third Division for two months, he is capable\
    \ of completing the Third Division live-wire exercises in 2 minutes, 35 seconds.Kaiju\
    \ No. 8 Vol. 2 Chapter 11 After observing his performance during the Raid on Tachikawa\
    \ Base against the Wyvern-type Kaiju, Kikoru was astounded by his level of skill\
    \ and believed he would make an excellent backup for her.Kaiju No. 8 Vol. 3 Chapter\
    \ 26 He has developed prediction talents thanks to Kikoru's assistance, allowing\
    \ him to precisely predict the movements of individuals like No. 9 although its\
    \ attacks are so fast that people faster than Reno, like 46% Kikoru, cannot even\
    \ perceive them.Kaiju No. 8 Vol. 2 Chapter 15 The combat skills of the rookies\
    \ such as Kikoru, Reno, Iharu, Aoi, and Haruichi are noted as quite exceptional,\
    \ with Third Division general officers in their fourth years being astonished\
    \ and losing confidence in their own abilities at their performance, and top-notch\
    \ officers above them such as Platoon Leader Nakanoshima acknowledging their skills\
    \ and stating that the Third Division is beyond lucky to have acquired such talents.Kaiju\
    \ No. 8 Vol. 2 Chapter 13 General Officers from the Third Division possess Unleashed\
    \ Combat Powers around 20-30%,Kaiju No. 8 Vol. 1 Chapter 5 making them more skilled\
    \ than JSDF military officers, such as Aoi Kaguragi, who was recognized as the\
    \ military's rising star when he first joined the Defense Force, not to mention\
    \ capable of holding their own against kaijuKaiju No. 8 Vol. 10 Chapter 75 who\
    \ is not only intelligent enough to predict Soshiro Hoshina\u2019s movement but\
    \ is fast enough to blitz him and knock him away when using 51% of Numbers Weapon\
    \ 10's power \u2014 meaning that these kaiju are more than capable of blitzing\
    \ and one-shotting the general officersKaiju No. 8 Vol. 9 Chapter 73 \u2014 and\
    \ neutralize them. Though ultimately outclassed, his skills allow him to hold\
    \ his own against a"
