- id: claim-stamina-e1ae6c0c
  section: power_scale
  axis: stamina
  text: "Superhuman with Defense Force Suit (He remarked that according to the fitness\
    \ tests, he is comparable to Iharu,Kaiju No. 8 Vol. 2 Chapter 11 who placed third\
    \ out of 225 candidates, whereas a grown adult who frequently exercises and performs\
    \ hard manual labor each day was unable to keep up and placed 219th.Kaiju No.\
    \ 8 Vol. 1 Chapter 4 He can endure rigorous training every day for two months.Kaiju\
    \ No. 8 Vol. 2 Chapter 11 During the Sagamihara Neutralization Operation, he and\
    \ the other members of the Third Division can fight countless numbers of kaiju\
    \ being spawned with little to no rest, even when they are exhausted, from 0400\
    \ hours to daybreak. Could withstand attacks strong enough to pierce his suit's\
    \ shield and rip off his flesh and continue to fight.Kaiju No. 8 Vol. 2 Chapter\
    \ 15 Kafka Hibino claims that people who use the Defense Force experience physical\
    \ strain due to the bonding of Kaiju tissues to acquire power, which involves\
    \ the synchronization of nerves,Kaiju No. 8 Vol. 4 Chapter 35Kaiju No. 8 Vol.\
    \ 7 Chapter 59 although it is not as severe as it was in the past.Kaiju No. 8\
    \ Chapter 117 Those with strong willpower are capable of having the stamina to\
    \ endure a month of battling in Kaiju No. 9\u2019s mental plane, which is teeming\
    \ with hundreds of Kaiju, each relentlessly swarming their victims and perpetually\
    \ regenerating or reforming, having no weaponry besides the one that you can conjure,\
    \ their strength, memories and appearance reduce to when one were at their most\
    \ vulnerable (I.e, childhood), all the while Kaiju No. 9 has full dominance to\
    \ the point of spawning tentacles, creating illusions, etcKaiju No. 8 Vol. 9 Chapter\
    \ 68Kaiju No. 8 Chapter 103Kaiju No. 8 Chapter 104)"
