  text: "{{Border|Scroll=No|Visible=Yes|Content= |-|Personal= {{#tag:tabber|{{!}}-{{!}}Himself=\
    \ {{Border|Scroll=Yes|Visible=No|Content= *Superhuman Physical Characteristics\
    \ *Combat Genius IntelligenceCheck Intelligence section for further justifications/scans\
    \ *Greater Accelerated Development (Training, Battle; Physical Statistics, Abilities.\
    \ Stated to have consistent \"growth spur\" during the two months of training.Kaiju\
    \ No. 8 Vol. 2 Chapter 11 During the Compatible User Episode, Reno was able to\
    \ significantly increase the rate of his growth in just a month to the point of\
    \ far surpassing that of Post Kaiju Weapon Episode Kikoru Shinomiya's, allowing\
    \ for him to bring his levels up to combat-ready status to utilize Numbers Weapon\
    \ 6, a task that should\u2019ve been impossible according to Captain OgataKaiju\
    \ No. 8 Vol. 8 Chapter 60) *Information Analysis and Analytical Prediction (Has\
    \ been taught by Kikoru to predict the attacks of opponents capable of perception-blitzing\
    \ him through their tells.Kaiju No. 8 Vol. 2 Chapter 15 The Defense Force recognizes\
    \ Reno as a capable man who observes his surroundings, possesses good balance\
    \ and pays attention to even the smallest details without even trying, like Kikoru\
    \ cutting her ends by one centimeter, Kafka Hibino's shoe size, or Iharu's empty\
    \ drink prompting him to order a cola for him. Reno's exceptional abilities allow\
    \ him to predict events in advance, to the point where Iharu describes him as\
    \ frightening. For instance, he can anticipate and correct Kafka's mistakes, such\
    \ as forgetting to take out his trash or order the limited edition shoes on time,\
    \ and identify the song Kafka wants to sing at karaoke based on wrong information,\
    \ only to reveal that he had prematurely added the exact song to the queueKaiju\
    \ No. 8: Relax Chapter 3) *Supernatural Willpower and Instinctive Action (With\
    \ powerful willpower, characters can force their bodies to move and fight even\
    \ if they are unable to control their own thoughts.Kaiju No. 8 Vol. 8 Chapter\
    \ 62 Additionally, they can withstand the passive aura of a Daikaiju, whether\
    \ it is through wearing Numbers Weapon Suits or clashing with a Daiakiju head-to-head\
    \ with no ill-effect, even though even though it induces a plethora of different\
    \ aliments/effects onto those that affected by it like Fear Inducement, Hallucination\
    \ Causation, Statistics Reduction, Madness Manipulation (Type 3Kaiju No. 8 Vol.\
    \ 5 Chapter 42Kaiju No. 8 Vol. 5 Chapter 43Kaiju No. 8 Vol. 6 Chapter 44Kaiju\
    \ No. 8 Vol. 6 Chapter 45Kaiju No. 8 Vol. 7 Chapter 59) and even outright actual\
    \ death.Kaiju No. 8 Chapter 116 When it comes to Mental BFR, characters with strong\
    \ willpower can connect with the trapped individual through their resolve, enabling\
    \ them to break free from manipulation, even when their memories has been taken.Kaiju\
    \ No. 8 Chapter 83Kaiju No. 8 Chapter 103Kaiju No. 8 Chapter 104 And it is implied\
    \ with Isao Shinomiya that one can regain their missing memories by oneself.Kaiju\
    \ No. 8 Chapter 103 It is also possible for them to resist Paralysis Inducement\
    \ and Sleep Manipulation as they can move despite the fact that their bodies had\
    \ not been responding to them previously, to regain their fading consciousness,\
    \ and even to seize control of their bodies,Kaiju No. 8 Vol. 5 Chapter 37Kaiju\
    \ No. 8 Chapter 104 the latter of which happening after being subjected to possessionKaiju\
    \ No. 8 Vol. 5 Chapter 36 through sheer willpower) **Telepathy, Soul Manipulation,\
