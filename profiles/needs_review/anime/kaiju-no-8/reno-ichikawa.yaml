    \ a full-body hexagonal shieldKaiju No. 8 Chapter 94 that extends far from their\
    \ bodies.Kaiju No. 8 Chapter 115 Even at its minimum potency,Kaiju No. 8 Vol.\
    \ 1 Chapter 5 this shield can help them survive life-or-death situations, and\
    \ by using the shield's maximum potency,Kaiju No. 8 Vol. 4 Chapter 32 they can\
    \ increase their chances of survival. Even when up against a stronger and much\
    \ larger opponent, by raising one\u2019s shield, they can reduce the damage they\
    \ take to zero.Kaiju No. 8: Exclusive on the Third Division Chapter 2 Additionally,\
    \ although many examinees are more than capable of eliminating the Primigenius\
    \ according to Soshiro Hoshina, some being as strong as 18% Full Release Haruichi\
    \ Izumo, they still require finding the Kaiju\u2019s weak spot due to the Kaiju\u2019\
    s shield.Kaiju No. 8 Vol. 1 Chapter 5 However, by focusing a shield in a specific\
    \ area,Kaiju No. 8 Chapter 119 one can weaken attacks from even Kaiju No. 9's\
    \ projectiles,Kaiju No. 8 Vol. 1 Chapter 7 which are powerful enough to not only\
    \ break the full-body shield but also penetrate the person fully,Kaiju No. 8 Vol.\
    \ 2 Chapter 15 as shown with Kikoru Shinomiya)"
