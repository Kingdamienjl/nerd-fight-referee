- id: claim-intelligence-b78b8d25
  section: power_scale
  axis: battle_iq
  text: "Combat Genius. Soshiro is the Vice-Captain of the Third Division of the Defense\
    \ Force and a very powerful combatant, able to release up to 92% of his suit's\
    \ power and thus proving that he is capable of scaling the wall that people hit\
    \ with unleashed combat powers, a wall that only a few can scale, since most officers\
    \ will end their careers with their unleashed combat powers capped at 20 or 30%,\
    \ unable to push beyond that no matter how hard they strive or how great their\
    \ accelerated development is, such as Iharu.Kaiju No. 8 Vol. 2 Chapter 14Kaiju\
    \ No. 8 Vol. 2 Chapter 16 Despite his laid-back appearance, Soshiro is quite intelligent\
    \ and intuitive, as he was the only one who correctly identified Kafka Hibino\
    \ as Kaiju No. 8, and one of the main reasons he accepted him in the Third Division\
    \ despite failing the exam was to keep an eye on him and carefully observe his\
    \ movements.Kaiju No. 8 Vol. 2 Chapter 10 As the vice-captain of the Third Division,\
    \ Soshiro has shown excellent leadership skills, able to guide a whole platoon\
    \ and multiple officers on the battlefield during major battles.Kaiju No. 8 Vol.\
    \ 2 Chapter 12 Soshiro is an extremely skilled swordsman who hails from a family\
    \ of kaiju slayers dating back to the Muromachi period.Kaiju No. 8 Vol. 2 Chapter\
    \ 14 He will strive to gauge an opponent's capabilities before going all out,Kaiju\
    \ No. 8 Vol. 3 Chapter 23 making full use of his sword cutting techniques he has\
    \ cultivated since he was young to exploit blind spotsKaiju No. 8 Vol. 9 Chapter\
    \ 73 as well as slash them with great speed and precision, as proven when he was\
    \ able to bypass the toughness of Kaiju No. 10's shell by cutting through the\
    \ tiny gaps within it,Kaiju No. 8 Vol. 4 Chapter 27 which Soshiro could even do\
    \ when caught off guard.Kaiju No. 8 Vol. 3 Chapter 26 He also displayed his precision\
    \ by cutting the shell of Gigantification Kaiju No. 10 to such an extent that\
    \ characters who could not previously scratch its hide with their strongest strike\
    \ could now smash it with an ordinary attack.Kaiju No. 8 Vol. 4 Chapter 30 His\
    \ usual style is dual-wielding his SW-2033s in combat, utilizing the reverse grip\
    \ to provide a more diverse range of strikes. According to his father, a young\
    \ Soshiro would\u2019ve been lauded as a prodigy in the Edo period, the golden\
    \ age of traditional Japanese kenjutsu, due to his already extraordinary mastery\
    \ in swordsmanship.Kaiju No. 8 Vol. 4 Chapter 29 While his skill set puts him\
    \ at a disadvantage against large-sized kaiju, Soshiro's proficiency in defeating\
    \ small to mid-sized kaiju in battle surpasses that of the Captain of the First\
    \ Division, \"Japan's Strongest Anti-Kaiju Combatant\", Gen Narumi,Kaiju No. 8\
    \ Vol. 7 Chapter 57 even when the captain possesses RT-0001. Along with Gen Narumi,\
    \ Soshiro boasts the highest level of expertise in close quarters combat within\
    \ the whole Defense Force, should also be capable of repelling multiple automatic\
    \ homing attacks that can outpace him from all directions.Kaiju No. 8 Chapter\
    \ 86Kaiju No. 8 Chapter 90 Has been stated that he been building up outrageous\
    \ experience since he was a child, step by step, slowly and steadily in order\
    \ to resist his own fate as being the shadow of his perfect older brother.Kaiju\
    \ No. 8 Chapter 90 Additionally, Soshiro's assaults can induce delayed reaction\
    \ prior to the main series as a rookie officer, as demonstrated by him slicing\
    \ through opponents without their body understanding they have been badly cut\
    \ until it is too late.Kaiju No. 8 B-Side Chapter 2 When faced with projectiles,\
    \ Soshiro\u2019s plan is to utilizes his surroundings to his advantage to disguise\
    \ his movements and move stealthily until he can get the target within range.Kaiju\
    \ No. 8 B-Side Chapter 2 He could easily outskill and defeat Post Sagamihara Neutralization\
    \ Operation Aoi Kaguragi, Iharu Furuhashi, Reno Ichikawa, Kafka Hibino, and Kikoru\
    \ Shinomiya in sparring kendo sessions; some of these opponents had trained since\
    \ middle school or had served in the military.Kaiju No. 8 B-Side Chapter 1Kaiju\
    \ No. 8 B-Side Chapter 4 His swordsmanship is highly appreciated by the Monster\
    \ Sweepers, as he cuts Kaiju into clean and finely cut pieces that they don\u2019\
    t need to do any dismantling in comparison to someone like Kikoru who send pieces\
    \ of Kaiju meat flying over the place. Captain and Vice-Captain level fighters\
    \ are stated to be more than capable of defeating a Fortitude 6.4 in solo combat,\
    \ even though just a Fortitude 6.4 Kaiju is so dangerous that neutralizing just\
    \ one would require an entire company of general officers from the Third Division.Kaiju\
    \ No. 8 Vol. 1 Chapter 7 General Officers from the Third Division possess Unleashed\
    \ Combat Powers around 20-30%,Kaiju No. 8 Vol. 1 Chapter 5 making them more skilled\
    \ than JSDF military officers, such as Aoi Kaguragi, who was recognized as the\
    \ military's rising star when he first joined the Defense Force, not to mention\
    \ capable of holding their own against kaijuKaiju No. 8 Vol. 10 Chapter 75 who\
    \ is not only intelligent eno"
