    \ requires the knowledge of the five basic types of stridingKaiju No. 8 Vol. 9\
    \ Chapter 67) **Damage Boost (Standard Squadron-Style Combat Technique and Axe\
    \ Technique: The Defense Force has meticulously honed the Squadron-Style techniques\
    \ to slay Kaiju.Kaiju No. 8 B-Side Chapter 8 Upon utilizing a combat technique,\
    \ the combatant\u2019s power is noted to grow, allowing for one to go from being\
    \ overpoweredKaiju No. 8 Chapter 105 to the one that is now overpowering insteadKaiju\
    \ No. 8 Chapter 106 A demonstration of the power provided by these techniques\
    \ is when a fighter who states that they cannot sell another fighter\u2019s regular\
    \ attacks is actively dodging the combat techniques instead of tanking them.Kaiju\
    \ No. 8 Vol. 10 Chapter 78 Another demonstration is shown when Kikoru, with a\
    \ regular attack, could only destroy a giant Kaiju\u2019s arm despite putting\
    \ all of her weight into it, yet Number One Fallen Thunder, under the same conditions,\
    \ could perfectly split the giant Kaiju in half right down the middle where its\
    \ armor is at its most durable, causing a veritable fountain of bodily fluid to\
    \ spray out and drench the entire area.Kaiju No. 8 B-Side Chapter 7Kaiju No. 8\
    \ B-Side Chapter 8 The sixth technique of the Squ"
