    \ kill almost every officer in the Third Division, heavily implying that she believed\
    \ those superior to her, like Vice-Captain Hoshina and Captain Ashiro at their\
    \ maximum combat power, would be able to survive.Kaiju No. 8 Vol. 4 Chapter 32\
    \ Despite overheating, Soshiro was able to withstand the combined firepower of\
    \ two self-destructing Wyvern-type Kaiju that created one giant explosion, doubling\
    \ its power.Kaiju No. 8 Vol. 4 Chapter 28 Could withstand a direct hit from Kaiju\
    \ No. 10Kaiju No. 8 Vol. 3 Chapter 26), higher with Shield (Defense Force Officers\
    \ and Kaiju possess the ability to project a full-body hexagonal shieldKaiju No.\
    \ 8 Chapter 94 that extends far from their bodies.Kaiju No. 8 Chapter 115 Even\
    \ at its minimum potencyKaiju No. 8 Vol. 1 Chapter 5, this shield can help them\
    \ survive life-or-death situations, and by using the shield's maximum potency,Kaiju\
    \ No. 8 Vol. 4 Chapter 32 they can increase their chances of survival. Even when\
    \ up against a stronger and much larger opponent, by raising one\u2019s shield,\
    \ they can reduce the damage they take to zero.Kaiju No. 8: Exclusive on the Third\
    \ Division Chapter 2 Additionally, although many examinees are more than capable\
    \ of eliminating the Primigenius according to Soshiro Hoshina, some being as strong\
    \ as 18% Full Release Haruichi Izumo, they still require finding the Kaiju\u2019\
    s weak spot due to the Kaiju\u2019s shield.Kaiju No. 8 Vol. 1 Chapter 5 However,\
    \ by focusing a shield in a specific area,Kaiju No. 8 Chapter 119 one can weaken\
    \ attacks from even Kaiju No. 9's projectiles,Kaiju No. 8 Vol. 1 Chapter 7 which\
    \ are powerful enough to not only break the full-body shield but also penetrate\
