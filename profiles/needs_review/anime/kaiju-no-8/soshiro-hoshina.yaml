  durability:
    text: "Small Town level+ with 63% (Comparable to Attack Potency), Mountain level+\
      \ with 92% (Kikoru stated that if the Super-Giant Yoju Bomb explodes, it would\
      \ kill almost every officer in the Third Division, heavily implying that she\
      \ believed those superior to her, like Vice-Captain Hoshina and Captain Ashiro\
      \ at their maximum combat power, would be able to survive.Kaiju No. 8 Vol. 4\
      \ Chapter 32 Despite overheating, Soshiro was able to withstand the combined\
      \ firepower of two self-destructing Wyvern-type Kaiju that created one giant\
      \ explosion, doubling its power.Kaiju No. 8 Vol. 4 Chapter 28 Could withstand\
      \ a direct hit from Kaiju No. 10Kaiju No. 8 Vol. 3 Chapter 26), higher with\
      \ Shield (Defense Force Officers and Kaiju possess the ability to project a\
      \ full-body hexagonal shieldKaiju No. 8 Chapter 94 that extends far from their\
      \ bodies.Kaiju No. 8 Chapter 115 Even at its minimum potencyKaiju No. 8 Vol.\
      \ 1 Chapter 5, this shield can help them survive life-or-death situations, and\
      \ by using the shield's maximum potency,Kaiju No. 8 Vol. 4 Chapter 32 they can\
      \ increase their chances of survival. Even when up against a stronger and much\
      \ larger opponent, by raising one\u2019s shield, they can reduce the damage\
      \ they take to zero.Kaiju No. 8: Exclusive on the Third Division Chapter 2 Additionally,\
      \ although many examinees are more than capable of eliminating the Primigenius\
      \ according to Soshiro Hoshina, some being as strong as 18% Full Release Haruichi\
      \ Izumo, they still require finding the Kaiju\u2019s weak spot due to the Kaiju\u2019\
      s shield.Kaiju No. 8 Vol. 1 Chapter 5 However, by focusing a shield in a specific\
      \ area,Kaiju No. 8 Chapter 119 one can weaken attacks from even Kaiju No. 9's\
      \ projectiles,Kaiju No. 8 Vol. 1 Chapter 7 which are powerful enough to not\
      \ only break the full-body shield but also penetrate the person fullyKaiju No.\
      \ 8 Vol. 2 Chapter 15, as shown with Kikoru Shinomiya)"
    source_ids:
    - vsbattles-soshiro-hoshina-kaiju-no-8
    confidence: 0.6
    notes: auto_repair source extraction
  stamina:
    text: "Superhuman with Defense Force Suit (Being the Vice-Captain, who possesses\
      \ the greatest combat power alongside the Captain in a division, he should be\
      \ superior to the regular Third Division officers who can fight countless numbers\
      \ of kaiju being spawned with little to no rest, even when they are exhausted,\
      \ from 0400 hours to daybreak. Despite being heavily injured after taking a\
      \ powerful punch from Kaiju No. 10, he is able to continue fighting even after\
      \ his suit overheats.Kaiju No. 8 Vol. 4 Chapter 28 After going well beyond his\
      \ suit's limit, he is still able to push beyond and use 63% of his suit's power\
      \ despite being heavily fatigued.Kaiju No. 8 Vol. 4 Chapter 30 As a fellow Squadron-Style\
      \ Combat Technique practitioner, he should be able to perform 100 strides every\
      \ day as training like Kafka HibinoKaiju No. 8 Vol. 9 Chapter 67. Kafka Hibino\
      \ claims that people who use the Defense Force experience physical strain due\
      \ to the bonding of Kaiju tissues to acquire power, which involves the synchronization\
      \ of nerves,Kaiju No. 8 Vol. 4 Chapter 35Kaiju No. 8 Vol. 7 Chapter 59 although\
      \ it is not as severe as it was in the past.Kaiju No. 8 Chapter 117 Those with\
      \ strong willpower are capable of having the stamina to endure a month of battling\
      \ in Kaiju No. 9\u2019s mental plane, which is teeming with hundreds of Kaiju,\
      \ each relentlessly swarming their victims and perpetually regenerating or reforming,\
      \ having no weaponry besides the one that you can conjure, their strength, memories\
      \ and appearance reduce to when one were at their most vulnerable (I.e, childhood),\
      \ all the while Kaiju No. 9 has full dominance to the point of spawning tentacles,\
      \ creating illusions, etc.Kaiju No. 8 Vol. 9 Chapter 68Kaiju No. 8 Chapter 103Kaiju\
      \ No. 8 Chapter 104)"
    source_ids:
    - vsbattles-soshiro-hoshina-kaiju-no-8
    confidence: 0.6
    notes: auto_repair source extraction
  range:
    text: "Extended Melee Range with SW-2033 (The size of his dual bladed swords are\
      \ 55cm), Several Meters with Hoshina Style (His air slashes can cover distances\
      \ larger than Kaiju No. 10\u2019s body), likely Hundreds of Meters with Marksman\
      \ Weaponry (Defense Force Officers's effective range with standard weapons are\
      \ trained to be able to hit opponents that are moving pretty fast in the head\
      \ from four hundred meters away.Kaiju No. 8: Exclusive on the Third Division\
      \ Chapter 3. Although Soshiro possesses a high unleashed combat power at his\
      \ maxiumum, much higher than regular Defense Force officers, it is stated to\
      \ be low for marksman weaponryKaiju No. 8 Vol. 4 Chapter 29, which would heavily\
      \ affects not only his power, but also his range overall), Up to Kilometers\
      \ with Aura (When a captain-class officer, who possesses an Unleashed Combat\
      \ Power of 84% or above,Kaiju No. 8 Vol. 10 Chapter 77, unleashes full release,\
      \ the area is designated as restricted to officers with an Unleashed Combat\
      \ Power under 60 percentKaiju No. 8 Vol. 6 Chapter 47. The reason for this is\
      \ that a captain-class\u2019s combat power reaches the level of a Daikaiju and\
      \ thus releases an aura capable of engulfing weaker officers and killing them,Kaiju\
      \ No. 8 Chapter 116 which is why those officers usually need permission to perform\
      \ a Full ReleaseKaiju No. 8 Vol. 3 Chapter 19 or warn other officers to not\
      \ approach the danger zoneKaiju No. 8 Vol. 10 Chapter 78, showcasing that Daikaiju\u2019\
      s aura is passive in nature. Danger Zones can range from Hundreds of Meters\
      \ to KilometersKaiju No. 8 Vol. 10 Chapter 78Kaiju No. 8 Chapter 105. Kaiju\
      \ No. 6\u2019s aura was able to affect Kaiju No. 8 from beyond three kilometers\
      \ awayKaiju No. 8 Chapter 99) |-|Numbers Weapon Suit"
    source_ids:
    - vsbattles-soshiro-hoshina-kaiju-no-8
    confidence: 0.6
    notes: auto_repair source extraction
  intelligence:
    text: "Combat Genius. Soshiro is the Vice-Captain of the Third Division of the\
      \ Defense Force and a very powerful combatant, able to release up to 92% of\
      \ his suit's power and thus proving that he is capable of scaling the wall that\
      \ people hit with unleashed combat powers, a wall that only a few can scale,\
      \ since most officers will end their careers with their unleashed combat powers\
      \ capped at 20 or 30%, unable to push beyond that no matter how hard they strive\
      \ or how great their accelerated development is, such as Iharu.Kaiju No. 8 Vol.\
      \ 2 Chapter 14Kaiju No. 8 Vol. 2 Chapter 16 Despite his laid-back appearance,\
      \ Soshiro is quite intelligent and intuitive, as he was the only one who correctly\
      \ identified Kafka Hibino as Kaiju No. 8, and one of the main reasons he accepted\
      \ him in the Third Division despite failing the exam was to keep an eye on him\
      \ and carefully observe his movements.Kaiju No. 8 Vol. 2 Chapter 10 As the vice-captain\
      \ of the Third Division, Soshiro has shown excellent leadership skills, able\
      \ to guide a whole platoon and multiple officers on the battlefield during major\
      \ battles.Kaiju No. 8 Vol. 2 Chapter 12 Soshiro is an extremely skilled swordsman\
      \ who hails from a family of kaiju slayers dating back to the Muromachi period.Kaiju\
      \ No. 8 Vol. 2 Chapter 14 He will strive to gauge an opponent's capabilities\
      \ before going all out,Kaiju No. 8 Vol. 3 Chapter 23 making full use of his\
      \ sword cutting techniques he has cultivated since he was young to exploit blind\
      \ spotsKaiju No. 8 Vol. 9 Chapter 73 as well as slash them with great speed\
      \ and precision, as proven when he was able to bypass the toughness of Kaiju\
      \ No. 10's shell by cutting through the tiny gaps within it,Kaiju No. 8 Vol.\
      \ 4 Chapter 27 which Soshiro could even do when caught off guard.Kaiju No. 8\
      \ Vol. 3 Chapter 26 He also displayed his precision by cutting the shell of\
      \ Gigantification Kaiju No. 10 to such an extent that characters who could not\
      \ previously scratch its hide with their strongest strike could now smash it\
      \ with an ordinary attack.Kaiju No. 8 Vol. 4 Chapter 30 His usual style is dual-wielding\
      \ his SW-2033s in combat, utilizing the reverse grip to provide a more diverse\
      \ range of strikes. According to his father, a young Soshiro would\u2019ve been\
      \ lauded as a prodigy in the Edo period, the golden age of traditional Japanese\
      \ kenjutsu, due to his already extraordinary mastery in swordsmanship.Kaiju\
      \ No. 8 Vol. 4 Chapter 29 While his skill set puts him at a disadvantage against\
      \ large-sized kaiju, Soshiro's proficiency in defeating small to mid-sized kaiju\
      \ in battle surpasses that of the Captain of the First Division, \"Japan's Strongest\
      \ Anti-Kaiju Combatant\", Gen Narumi,Kaiju No. 8 Vol. 7 Chapter 57 even when\
      \ the captain possesses RT-0001. Along with Gen Narumi, Soshiro boasts the highest\
      \ level of expertise in close quarters combat within the whole Defense Force,\
      \ should also be capable of repelling multiple automatic homing attacks that\
      \ can outpace him from all directions.Kaiju No. 8 Chapter 86Kaiju No. 8 Chapter\
      \ 90 Has been stated that he been building up outrageous experience since he\
      \ was a child, step by step, slowly and steadily in order to resist his own\
      \ fate as being the shadow of his perfect older brother.Kaiju No. 8 Chapter\
      \ 90 Additionally, Soshiro's assaults can induce delayed reaction prior to the\
      \ main series as a rookie officer, as demonstrated by him slicing through opponents\
      \ without their body understanding they have been badly cut until it is too\
      \ late.Kaiju No. 8 B-Side Chapter 2 When faced with projectiles, Soshiro\u2019\
      s plan is to utilizes his surroundings to his advantage to disguise his movements\
      \ and move stealthily until he can get the target within range.Kaiju No. 8 B-Side\
      \ Chapter 2 He could easily outskill and defeat Post Sagamihara Neutralization\
      \ Operation Aoi Kaguragi, Iharu Furuhashi, Reno Ichikawa, Kafka Hibino, and\
      \ Kikoru Shinomiya in sparring kendo sessions; some of these opponents had trained\
      \ since middle school or had served in the military.Kaiju No. 8 B-Side Chapter\
      \ 1Kaiju No. 8 B-Side Chapter 4 His swordsmanship is highly appreciated by the\
      \ Monster Sweepers, as he cuts Kaiju into clean and finely cut pieces that they\
      \ don\u2019t need to do any dismantling in comparison to someone like Kikoru\
      \ who send pieces of Kaiju meat flying over the place. Captain and Vice-Captain\
      \ level fighters are stated to be more than capable of defeating a Fortitude\
      \ 6.4 in solo combat, even though just a Fortitude 6.4 Kaiju is so dangerous\
      \ that neutralizing just one would require an entire company of general officers\
      \ from the Third Division.Kaiju No. 8 Vol. 1 Chapter 7 General Officers from\
      \ the Third Division possess Unleashed Combat Powers around 20-30%,Kaiju No.\
      \ 8 Vol. 1 Chapter 5 making them more skilled than JSDF military officers, such\
      \ as Aoi Kaguragi, who was recognized as the military's rising star when he\
      \ first joined the Defense Force, not to mention capable of holding their own\
      \ against kaijuKaiju No. 8 Vol. 10 Chapter 75 who is not only intelligent eno"
