- id: claim-stamina-8af0588a
  section: power_scale
  axis: stamina
  text: "Superhuman with Defense Force Suit (Being the Vice-Captain, who possesses\
    \ the greatest combat power alongside the Captain in a division, he should be\
    \ superior to the regular Third Division officers who can fight countless numbers\
    \ of kaiju being spawned with little to no rest, even when they are exhausted,\
    \ from 0400 hours to daybreak. Despite being heavily injured after taking a powerful\
    \ punch from Kaiju No. 10, he is able to continue fighting even after his suit\
    \ overheats.Kaiju No. 8 Vol. 4 Chapter 28 After going well beyond his suit's limit,\
    \ he is still able to push beyond and use 63% of his suit's power despite being\
    \ heavily fatigued.Kaiju No. 8 Vol. 4 Chapter 30 As a fellow Squadron-Style Combat\
    \ Technique practitioner, he should be able to perform 100 strides every day as\
    \ training like Kafka HibinoKaiju No. 8 Vol. 9 Chapter 67. Kafka Hibino claims\
    \ that people who use the Defense Force experience physical strain due to the\
    \ bonding of Kaiju tissues to acquire power, which involves the synchronization\
    \ of nerves,Kaiju No. 8 Vol. 4 Chapter 35Kaiju No. 8 Vol. 7 Chapter 59 although\
    \ it is not as severe as it was in the past.Kaiju No. 8 Chapter 117 Those with\
    \ strong willpower are capable of having the stamina to endure a month of battling\
    \ in Kaiju No. 9\u2019s mental plane, which is teeming with hundreds of Kaiju,\
    \ each relentlessly swarming their victims and perpetually regenerating or reforming,\
    \ having no weaponry besides the one that you can conjure, their strength, memories\
    \ and appearance reduce to when one were at their most vulnerable (I.e, childhood),\
    \ all the while Kaiju No. 9 has full dominance to the point of spawning tentacles,\
    \ creating illusions, etc.Kaiju No. 8 Vol. 9 Chapter 68Kaiju No. 8 Chapter 103Kaiju\
    \ No. 8 Chapter 104)"
