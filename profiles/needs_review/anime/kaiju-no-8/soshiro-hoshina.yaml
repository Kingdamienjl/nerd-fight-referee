    \ of strain on the user's body and shaves years off their lives that could ultimately\
    \ be fatal.Kaiju No. 8 Vol. 6 Chapter 44 Notable Attacks/Techniques: Hoshina Style:\
    \ Founded by the members of the Hoshina Family, the Hoshina Style is the school\
    \ of swordsmanship and martial art passed down by the clan since the Muromachi\
    \ period. This swordsmanship style involves both a Dual-Blade Form and a Single-Blade\
    \ Form. Furthermore, the style possesses two main repertoire of techniques, which\
    \ can occasionally be used together. With no apparent consequences thus far in\
    \ the series, it is more than feasible for the officer to spam these techniques\
    \ one after the other. *Sword-Slay Technique: The Sword-Slay Technique is a style\
    \ mainly centered on swing attacks, consisting of six forms, plus a seventh one\
    \ created by Soshiro: **Number One: Air Slicer: An air slash performed so swift\
    \ and smooth that it is undetectable to people who can perceive his other invisible\
    \ slashes, preventing the opponent from perceiving the attack even if they were\
    \ fast enough to dodge Soshiro\u2019s blades until it is too late. **Number Two:\
    \ Cross Slasher: A crossed dual attack able to target and penetrate the small\
    \ gaps on the opponent's body. **Number Three: Return Slasher: While running,\
    \ Soshiro throws a twisting crossed attack. **Number Four: Wild Slasher: An attack\
    \ consisting of multiple sword slashes from various angles. **Number Five: Mist\
    \ Slasher: This attack is disguised as a dual x-shaped invisible long-range attack\
    \ but is actually made of a third surprise low attack from the side. **Number\
    \ Six: Eightfold Slasher: Presumably his strongest attack prior to Number Seven,\
    \ usually used as a finisher. An eight-pointed slash attack. **Number Seven: 12-Layered\
    \ Strike: A special attack that was developed by Soshiro and is only available\
    \ to him. With the assistance of the tail of Numbers Weapon 10, Soshiro is able\
    \ to wield three swords and unleash a powerful onslaught of twelve strikes on\
    \ the adversary. This attack should be far superior to the sixth technique, as\
    \ Soshiro claimed before to gaining Full Release with Numbers Weapon 10 that the\
    \ technique was nothing more than an armchair thoery. Soshiro Number One - Air\
    \ Slicer.png|Number One: Air Slicer Soshiro Number Two - Cross Slasher.png|Number\
    \ Two: Cross Slasher Soshiro Number Three - Return Slasher 1.2.jpg|Number Three:\
    \ Return Slasher Soshiro Number Four - Wild Slasher.png|Number Four: Wild Slasher\
    \ Soshiro Number Five - Mist Slasher (Double Strike).png|Number Five: Mist Slasher\
    \ (Double Strike) Soshiro Number Five - Mist Slasher (The Triple Strike).png|Number\
    \ Five: Mist Slasher (Triple Strike) Soshiro Number Six - Eightfold Slasher.png|Number\
    \ Six: Eightfold Slasher Number Seven - 12-Layered Strike.jpg|Number Seven: 12-Layered\
    \ Strike (The 11 Strikes) Number Seven - 12-Layered Strike part 2.jpg|Number Seven:\
    \ 12-Layered Strike (The Final Strike) *Quick-Slash Technique:The Quick-Slash\
    \ Technique is a style centered around quick-draw attacks, consisting of six"
