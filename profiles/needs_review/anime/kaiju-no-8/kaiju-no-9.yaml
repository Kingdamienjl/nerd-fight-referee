      \ Defense Force.Kaiju No. 8 Vol. 7 Chapter 57 It is capable of creating kaiju\
      \ with specific abilities in order to counteract enemies,Kaiju No. 8 Vol. 10\
      \ Chapter 81 such as creating Kaiju No. 15"
