        \ for knowledge, and its desire to reclaim Kaiju powers from human hands best\
        \ define its behavior. Throughout the series, its main motivation is to learn\
        \ and utilize everything that makes humanity unique, including their bodies\
        \ and cultures, as a foundation for the ideal Kaiju world it aspires to create.Kaiju\
        \ No. 8 Chapter 107 These personality traits, coupled with its scheming nature,\
        \ enable it to formulate articulate and complex plans aimed at crushing the\
        \ Defense Force. The focus on its plan is such that No. 9 appears as a completely\
        \ apathetic and distant creature. It consistently speaks in a cold, menacing,\
        \ and emotionless tone, never once rising beyond it even when discussing its\
        \ passionsKaiju No. 8 Chapter 107 or in danger,Kaiju No. 8 Vol. 3 Chapter\
        \ 18 allowing it to remain level-headed even when facing potential death,Kaiju\
        \ No. 8 Vol. 7 Chapter 53 and also shows no affection or even attention to\
        \ the Kaiju he spawned to eliminate the Defense Force officers.Kaiju No. 8\
        \ Chapter 85 The more No. 9 learns about humans, whether through studying,\
        \ dissecting, or assimilating them, the more its intelligence increases,Kaiju\
        \ No. 8 Chapter 107 allowing it to evolve every time it fights. Later, it\
        \ becomes clear that Kaiju No. 9 has lived for hundreds of years before the\
        \ start of the series and has absorbed the memories and skills of many people\
        \ from different eras, such as Soshiro Hoshina\u2019s ancestor, a swordsman\
        \ known as the greatest in all creation, and Gen Narumi\u2019s ancestor, who\
        \ is an onmyoji.Kaiju No. 8 Chapter 104Kaiju No. 8 Chapter 117 Similar to\
        \ how humans would conduct extensive research to employ measures against entities\
        \ that poss threats to their survival, Kaiju No. 9 is the first kaiju capable\
        \ of doing the same, as demonstrated when it specifically designed Kaiju No.\
