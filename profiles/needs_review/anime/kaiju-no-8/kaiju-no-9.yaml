  name: "Kaiju No. 9 to Kikoru Shinomiya, purposely showing the face of her dead father\
    \ to torment herKaiju No. 8 Vol. 7 Chapter 52}}}} ==Summary == Kaiju No. 9 is\
    \ a humanoid kaiju who can create other kaiju and absorb humans, taking their\
    \ appearance and memories. No. 9 infiltrates society by initially disguising itself\
    \ as a human kaiju cleaner named Takamichi Hotaka but was then later forced to\
    \ hide as Kanji Nagamine. No. 9 orchestrates most of the catastrophes that befall\
    \ the Defense Force. It absorbs Isao Shinomiya and his Identified Kaiju Weapon\
    \ 2, which greatly increases its strength and ability to create stronger kaiju.\
    \ No. 9 is constantly in the pursuit of knowledge and aims to create a world for\
    \ kaiju to thrive in. After Kafka and Mina destroy No. 9's core, No. 9 is revealed\
    \ to have absorbed an old creature from the Meireki era who wreaked havoc in Japan,\
    \ subsequently causing the Great Fire of Meireki. The creature takes over No.\
    \ 9's body and goes on a rampage against the Defense Force. Kaiju No. 9 is one\
    \ of the strongest kaiju seen so far in the series, having a fortitude level of\
    \ 8.5 when it first appeared, but it eventually reached a point where it was deemed\
    \ \u201Cimmeasurable\u201D by the Defense Force. ==Powers and Stats"
