    - field: intelligence
      value: "Genius No. 9 is highly intelligent and adaptable, able to formulate\
        \ strategies to overcome old weaknesses and assimilate others to increase\
        \ its knowledge and power, which is why it has been likens to an ever-changing\
        \ virus.Kaiju No. 8 Vol. 6 Chapter 47 Its fascination with humanity, its thirst\
        \ for knowledge, and its desire to reclaim Kaiju powers from human hands best\
        \ define its behavior. Throughout the series, its main motivation is to learn\
        \ and utilize everything that makes humanity unique, including their bodies\
        \ and cultures, as a foundation for the ideal Kaiju world it aspires to create.Kaiju\
        \ No. 8 Chapter 107 These personality traits, coupled with its scheming nature,\
        \ enable it to formulate articulate and complex plans aimed at crushing the\
        \ Defense Force. The focus on its plan is such that No. 9 appears as a completely\
        \ apathetic and distant creature. It consistently speaks in a cold, menacing,\
        \ and emotionless tone, never once rising beyond it even when discussing its\
        \ passionsKaiju No. 8 Chapter 107 or in danger,Kaiju No. 8 Vol. 3 Chapter\
        \ 18 allowing it to remain level-headed even when facing potential death,Kaiju\
        \ No. 8 Vol. 7 Chapter 53 and also shows no affection or even attention to\
        \ the Kaiju he spawned to eliminate the Defense Force officers.Kaiju No. 8\
        \ Chapter 85 The more No. 9 learns about humans, whether through studying,\
        \ dissecting, or assimilating them, the more its intelligence increases,Kaiju\
        \ No. 8 Chapter 107 allowing it to evolve every time it fights. Later, it\
        \ becomes clear that Kaiju No. 9 has lived for hundreds of years before the\
        \ start of the series and has absorbed the memories and skills of many people\
        \ from different eras, such as Soshiro Hoshina\u2019s ancestor, a swordsman\
        \ known as the greatest in all creation, and Gen Narumi\u2019s ancestor, who\
        \ is an onmyoji.Kaiju No. 8 Chapter 104Kaiju No. 8 Chapter 117 Similar to\
        \ how humans would conduct extensive research to employ measures against entities\
        \ that poss threats to their survival, Kaiju No. 9 is the first kaiju capable\
        \ of doing the same, as demonstrated when it specifically designed Kaiju No.\
        \ 11 through 15 for the purpose of exterminating the Defense Force by targeting\
        \ their weaknesses.Kaiju No. 8 Vol. 10 Chapter 81 Despite only having played\
        \ for a week, it was able to climb to the top of Japan's chess leaderboards,\
        \ defeating the second-best player in a seven-minute match, and it has even\
        \ been shown playing 12 consecutive matches at once.Kaiju No. 8 Anime Episode\
        \ 12 If it appears to be at a disadvantage in close combat, it will retreat\
        \ and shoot its target from a safe distance.Kaiju No. 8 Vol. 6 Chapter 47\
        \ It is ruthless and driven to complete its mission at any cost and will not\
        \ hesitate to kill enemies who engage it, usually by shooting them directly\
        \ in the heart,Kaiju No. 8 Vol. 1 Chapter 6Kaiju No. 8 Vol. 2 Chapter 15 though\
        \ it will most likely spare innocent bystanders if it means avoiding unwanted\
        \ attention.Kaiju No. 8 Vol. 3 Chapter 21 As befits its vicious nature, this\
        \ creature will not hesitate to exploit its opponents' weaknesses, such as\
        \ when it used the face of Kikoru's deceased father to demoralize herKaiju\
        \ No. 8 Vol. 7 Chapter 52 or hampered Kafka and Gen's movements by exploiting\
        \ humans' unwillingness to abandon their comrades.Kaiju No. 8 Vol. 7 Chapter\
        \ 53 However, in spite of its usual analytical, collected and rational demeanor,\
        \ No. 9 s not above holding grudges against those who defeat it or ruin its\
        \ plans, like Kaiju No. 8.Kaiju No. 8 Vol. 3 Chapter 21 It is revealed that\
        \ Kaiju No. 9 excels at multi-tasking; not only could it direct the thousands\
        \ of Kaiju in their actions against the entirety of Japan,Kaiju No. 8 Vol.\
        \ 9 Chapter 71 but it could also strategically manipulate the numerous Daikaiju\
        \ of the Third WavesKaiju No. 8 Chapter 102 while simultaneously dealing with\
        \ Mina Ashiro and Bakko personally.Kaiju No. 8 Chapter 103 Soshiro stated\
        \ that one should anticipate cold-blooded attacks from kaiju.Kaiju No. 8 Vol.\
        \ 4 Chapter 28 Despite typical Kaiju being animalistic in nature and often\
        \ attack with no regard for how open they will be after an attack like savage\
        \ beasts,Kaiju No. 8 Vol. 5 Chapter 36 they are more than intelligent enough\
        \ to predict attacks from skilled Defense Force officers, such as Soshiro\
        \ Hoshina, although his movement was hindered by Kaiju No. 10.Kaiju No. 8\
        \ Vol. 9 Chapter 73 A Kaiju can instinctively tell how strong an opponent\
        \ is, and due to this, they can instantly make decisions whether to run or\
        \ engage based on it.Kaiju No. 8: Exclusive on the Third Division Chapter\
