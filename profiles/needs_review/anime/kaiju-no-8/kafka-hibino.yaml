  intelligence:
    text: "Above Average. Kafka's time on the Kaiju Disposal Team provides him with\
      \ extensive knowledge of Kaiju anatomy, which he uses to identify weaknesses\
      \ and the type of kaiju he is confronted with.Kaiju No. 8 Vol. 1 Chapter 5Kaiju\
      \ No. 8 Vol. 3 Chapter 25 Even when working with his Defense Force suit, from\
      \ which Kafka can only draw 1% of its power, he is able to easily pierce through\
      \ a kaiju's corpse and dig into it to further study it and localize the core.Kaiju\
      \ No. 8 Vol. 2 Chapter 13 It was due to this that, during the Sagamihara Neutralization\
      \ Operation, his findings were able to substantially mitigate potential damageKaiju\
      \ No. 8 Vol. 3 Chapter 22 and foil Kaiju No. 9's plan of outwitting the Third\
      \ Division.Kaiju No. 8 Vol. 2 Chapter 14 Despite his comically childish personality\
      \ in most situations, Kafka is very keen-minded, as he has been shown to have\
      \ great observational and prediction abilities. In the Defense Force Screening\
      \ Exam's Second Final Test, he was able to instantly deduce based on drones\
      \ being assigned to monitor each and every one of the applicants that the test\
      \ is based on how they take action and adapt their abilities to the task at\
      \ hand and not the number of kaiju they neutralize, as they could just count\
      \ them with sensors.Kaiju No. 8 Vol. 1 Chapter 5 If the location of his core\
      \ was to be discovered in battle, he would use it to his advantage, as demonstrated\
      \ during his encounter with Soshiro Hoshina where he predicted exactly where\
      \ he would be attacked despite the attack coming from a blind spot, thus preparing\
      \ his body to catch Soshiro's sword before it reaches his core and allowing\
      \ Kafka to disarm the vice-captain without harming him and escape.Kaiju No.\
      \ 8 Vol. 3 Chapter 20 Despite admitting that he can't even see the eight-armed\
      \ Kaiju No. 9's gamma duplicate's attacks, which are already more than fast\
      \ enough that people much faster than Kafka like Kikoru Shinomiya, Reno Ichikawa\
      \ and Iharu Furuhashi also can't perceive them, he was able to quickly adapt\
      \ to them, eventually to the point of consistently reacting to and dodging them,\
      \ albeit barely,Kaiju No. 8 Vol. 5 Chapter 43Kaiju No. 8 Vol. 6 Chapter 44 despite\
