- id: claim-weaknesses-132f13aa
  section: weaknesses
  axis: weakness
  text: 'None notable. Notable Attacks/Techniques: *Power of Darkness: The Darkness
    Devil''s main ability, evidently, is the ability to control darkness. Likely due
    to the Darkness Devil''s incalculable power, this power has a variety of applications;
    enhanced intellect, the ability to turn into and manifest oneself out of darkness,
    the ability to summon things from the darkness, the ability to control a mysterious
    force, etc. Whenever the Darkness Devil uses its powers, there will usually be
    a sign such as the Devil itself reciting broken katakana or another creature making
    a sound that signals the Power of Darkness is about to take effect. ==Gallery==
    File:Darkness Devil Cover 1.png|Chapter 64 Art File:Darkness Devil Cover 2.png|Chapter
    65 Art ==Notable Matchups== Victories: Losses: Inconclusive: ==References== {{scroll
    box|content={{reflist|2}}}} ==Notes/Explanations== {{scroll box|content=}} {{scroll
    box|content=}} {{Discussions}} Category:Abstract Entities Category:Additional
    Limbs Users Category:Antagonists Category:Attack Reflection Users Category:Biology
    Users Category:Bodily Weaponry Users Category:Characters Category:Chainsaw Man
    Category:Darkness Users Category:Durability Negation Users Category:Deconstruction
    Users Category:Dimensional Travel Users Category:Demons Category:Enhanced Senses
    Users Category:Evil Characters Category:Evil Characters Category:Forcefield Users
    Category:Fear Users Category:Invulnerability Users Category:Madness Users Category:Power
    Bestowal Users Category:Regeneration Users Category:Shapeshifters Category:Summoners
    Category:Teleportation Users Category:Telekinesis Users Category:Weapon Creation
    Users Category:Manga Characters'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
  - fan_wiki_single_source
- id: claim-powers-and-abilities-5dbb7d3f
  section: abilities
  axis: hax
  text: '*Superhuman Physical Characteristics *General Devil Physiology (Primal-Fear)
    **Enhanced Senses (Instantly became aware of the cast''s arrival in Hell and was
    watching them from afar.Chainsaw Man Chapter 64) **Dimensional Travel (Reached
    out of Hell to fulfill its contract with Santa Claus.) **Regeneration (At least
    High-Mid, likely at least Mid-High; Should possess incomparably more potent regeneration
    than Santa Claus using a tiny piece of its flesh, who could instantly reform from
    being blown to pieces.Chainsaw Man Chapter 67 Likely possesses regeneration on
    par with Falling Devil''s avatars.Chainsaw Man Chapter 122Chainsaw Man Chapter
    125Chainsaw Man Chapter 126Chainsaw Man Chapter 131) **Additional Limbs & Natural
    Weaponry (Possesses 8 limbs, all of which can be transformed into scythe-like
    appendages that can cut cleanly through opponents.Chainsaw Man Chapter 65) *Darkness
    Manipulation (Covered Hell in darkness.) **Shapeshifting (Can turn itself into
    darkness, and then manifest itself.) **Summoning (Can summon the Sword of Darkness.)
    *Biological Manipulation (Caused Aki and Angel to bleed profusely with a mere
    stare.Chainsaw Man Chapter 66 Being stabbed by the Sword of Darkness causes catastrophically
    violent hemorrhaging which causes anyone stabbed to bleed far more than they normally
    would.) *Durability Negation & Deconstruction (Can cause an individual''s body
    to fall apart without actually damaging them.) *Fear Manipulation & Madness Manipulation
    (Type 3; Merely watching them was enough to instill a sense of terror into the
    Fiends; Pingsti nearly lost her mind and began begging for permission to commit
    suicide.) *Teleportation & Attack Reflection (Transported the Stone Devil into
    its hands and reflected its petrification back onto the Devil and its contractor.)
    *Telekinesis (Telekinetically twisted Denji''s body and made Galgali spontaneously
    explode. Crushed and twisted Makima''s arm.) *Invulnerability (Santa Claus became
    immune to damage in the darkness after consuming a piece of the Darkness Devil''s
    flesh.) *Forcefield Creation (Constantly has a forcefield in place.)'
  source_ids: *id003
  decisive: true
  status: unverified
  policy_flags:
  - fan_wiki_single_source
