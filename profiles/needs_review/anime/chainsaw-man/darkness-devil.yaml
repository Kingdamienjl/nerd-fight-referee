        fully regenerate from just a heart without any external blood consumption]])
        *Enhanced Chain Control & Enhanced Acrobatics (Hypermobility & Surface Running;
        Skilled enough to [https://imgur.com/a/8XXzGwQ perform a complete 360 kick
