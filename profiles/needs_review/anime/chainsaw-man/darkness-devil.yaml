        briefly traded blows with Katana Man, though was still overall slower. Massively-hypersonic
        is comparable to the Gun Devil, who flew across the world and killed millions
        of people in five minutes. Massively-hypersonic+ far faster than before as
        the Chainsaw Devil. Was capable of throwing his heart from orbit all the way
        back to Tokyo. Subsonic+ is notably slower after being weakened, but is still
        fast enough to dodge all of Yuko's attacks with ease, who could react to shots
