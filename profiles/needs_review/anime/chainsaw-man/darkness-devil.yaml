        with the help of others]) Cyborgization, Bodily Weaponry & Chainsaw Creation
        (Partial, upon entering his hybrid form multiple chainsaws will erupt out
        of his head and arms. These blades can [https://imgur.com/a/ZnQQZje be retracted
        at will] Denji has also shown to be able to regenerate from wounds such as
        [https://imgur.com/a/opKYUpC decapitation] and [https://imgur.com/a/r5Uix0D
        bisection] as well as scale to the regeneration of his fellow Hybrids, who''ve
        survived being [https://imgur.com/a/Eppp0iQ reduced to just a head], by pulling
        his chainsaw cord. This also seems to bring him back into peak shape but is
        [https://imgur.com/a/dxPUTG6 entirely dependent on how much blood he has in
        his body]) *Immortality (Enhanced Type 3; Able to [https://imgur.com/a/IQsqOaw
        fully recover from attaining injuries that would be fatal to even devils through
        some blood and pulling his chainsaw cord]) *Limited Fire Manipulation & Heat
        Manipulation (By smashing his chainsaws together, Denji is [https://imgur.com/a/YcoeH47
        able to create sparks which can light up gasoline]) *Limited Body Control
        (Able to unhinge his jaw and digestive system to inhuman levels; enough to
        [https://imgur.com/a/chapter-189-HfgUIiu stuff half a person into his mouth]
        and [https://imgur.com/a/chapter-190-UXYPo9c vomit out both the Aging Devil
        and Tadashi Hasegawa]) *Limited Martial Arts (While not a master, Denji is
        shown to be a decently skilled street-brawler, [https://imgur.com/a/Nf0B79H
        knowing to aim for weak spots and being able to trade hands with experienced
        fighters, albeit after catching them off guard]) *Weapon Mastery (Has been
        [https://imgur.com/a/2VTNrvZ hunting devils using Pochita], essentially a
        living chainsaw dog, as a weapon ever [https://imgur.com/a/sB2nvrx since he
        was a child]. Also shown to [https://imgur.com/a/e0UVb5q have proficiency
        with using melee weapons like an axe]) *Supernatural Willpower (Possess unnatural
        willpower [https://imgur.com/a/yvYGoap far from the average devil hunter];
        showing that he will still [https://imgur.com/a/tU6M0yk continue to unapologetically
        fight on even if he''s being continuously mutilated], [https://imgur.com/a/sAX7oUL
        killed repeatedly] or experiencing any of the showings in his stamina section
