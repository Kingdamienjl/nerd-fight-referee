        blades out of his feet, he can [https://imgur.com/a/Hv82ZPW use them to stick
        onto walls and run on them] After [https://imgur.com/a/d5aosen receiving some
        guidance] from Beam, has learnt to manipulate his chains better to [https://imgur.com/a/d5aosen
