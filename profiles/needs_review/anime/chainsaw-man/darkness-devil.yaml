        take on and hunt low-tier devils like the tomato devil. Was capable of knocking
        down Aki Hayakawa, albeit Denji had to strike him in the balls to accomplish
        this. Building level after becoming a hybrid Denji could take on devils like
        the Zombie, and Eternity Devil, and survive hits from devils like that bat
        devil who could do this. Multi-city block level, after training under Kishibe
        Denji, could take on hybrids like Bomb Girl, who could create a massive explosion
        over Tokyo Tower.Varies; City-level Was capable of cutting through the Typhoon
        devil with ease, who was a massive storm that covered all of Tokyo.Varies;
        at least City-level, the Chainsaw Devil is regarded as "the devil that devils
        fear most." should be considerably stronger than post-training Denji. Was
        capable of cutting through Makima and all other hybrids in Special Division
        5 with no difficulty. Multi-city block level after being severely weakened
        by Makima due to the lack of fear surrounding Chainsaw Man, still able to
        fight powerful devils like the Cockroach Devil, and post-revival Yuko. Small-town
        level with Powers Blood Chainsaw was able to one-shot Makima and cause severe
        damage to her casually. At least City-level after being Re-empowered through
        fear became super duper strong, and could casually one-shot fake Chainsaw
        Man. Island level as Denji Man could fight on par with Yoru and overpower
        her strongest weapons. Should be on par with, if not stronger than, the Gun
        Goddess, who could shoot a near light speed bullet from New York to Tokyo,
        worth this much energy.
      source_id: character-stats-profiles-darkness-devil-chainsaw-man
