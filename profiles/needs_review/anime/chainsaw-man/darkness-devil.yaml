        their previous incarnation) *Blood Manipulation (Is able to freely manipulate
        her own blood, even when it''s a distance away from her body. She also can
        manipulate the blood of others to a limited degree, although she stated this
        is a difficult feat) **Healing (Low; Is able to manipulate the blood of others
        through direct contact to stop bleeding) **Weapon Creation & Regeneration
        Negation (Up to High-Mid; Is able to create various different weapons by forming
        them out of her own blood, such as hammers, spears, knifes, and scythes. Weapons
        created from her blood are shown to be capable of disrupting the regenerative
        abilities of other Devils, due to Power''s blood constantly ripping the body
        apart internally) *Blood Empowerment & Statistics Amplification (After drinking
        large amounts of blood, she becomes stronger and will continue to grow even
        stronger, scarier, and haughtier with the more blood she consumes if it isn''t
        drained periodically) *Enhanced Smell (Is able to smell, track, and identify
        others from a distance by the specific scent of their blood) *Fear Empowerment
        (The more feared the concept or name a Devil embodies, the more powerful they
        become. This also includes fear of mental ideas relating to a concept, such
        as fearing the idea of getting run over by a car despite not fearing cars
        themselves. Due to Power embodying the concept of blood, the more feared blood
        or the name "Blood Fiend/Devil" become, the stronger she becomes) *Immortality
        (Limited Type 6; Can survive as a small amount of blood in an individual''s
        body, although will disappear over time without any way to regenerate) *Limited
