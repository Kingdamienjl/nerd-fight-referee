      value: 'None notable. Notable Attacks/Techniques: *Power of Darkness: The Darkness
        Devil''s main ability, evidently, is the ability to control darkness. Likely
        due to the Darkness Devil''s incalculable power, this power has a variety
        of applications; enhanced intellect, the ability to turn into and manifest
        oneself out of darkness, the ability to summon things from the darkness, the
        ability to control a mysterious force, etc. Whenever the Darkness Devil uses
        its powers, there will usually be a sign such as the Devil itself reciting
        broken katakana or another creature making a sound that signals the Power
