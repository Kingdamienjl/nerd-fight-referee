power_scale:
  tier:
    text: 9-A in human form, ; 8-A with katanas while transformed
    source_ids: &id002
    - mediawiki-4861079
    confidence: 0.8
  attack_potency:
    text: Small Building Level in human form (Harmed Post-Training Denji with a [https://imgchest.com/p/pg73q8zpg4r
      kick in the nuts], should be comparable to his durability), Varies (With the
      devil embodying the fear of katanas within him, [https://imgur.com/a/U6toaeg
      the more feared he is, the more powerful he becomes], even a relatively minor
      boost in fear can [https://imgur.com/a/nhcsWiK immensely boost a devil's overall
      strength and effects of their abilities]); Multi-City Block level+ with katanas
      while transformed ([https://imgur.com/a/chapter-159-dyYUSn9 Smashed through
      the Tokyo Detention Centre], a specialized high-security devil [https://imgur.com/a/chapter-31-159-174-yZU82Yy
      containment facility] that is explicitly stated to have [https://imgur.com/a/chapter-156-UOFO1eB
      never had a single devil escape since its founding], highlighting the exceptional
      durability of its structure Engaged a fully fresh Post-Training Chainsaw Man
      in direct combat, overpowering him by [https://imgur.com/a/VBKF8tf effortlessly
      severing his limbs] and even [https://imgur.com/a/9v9pKuZ shattering the chainsaw
      emerging from his head].)
    source_ids: *id002
    confidence: 0.8
  speed:
    text: "Athletic Human in human form (Should be comparable to Pre-Training Denji,\
      \ as he\xB4s also a [https://files.catbox.moe/wkm85r.jpg Devil Hunter]), Varies;\
      \ At least High Hypersonic when transformed ([https://imgur.com/a/PevZsL8 Is\
      \ able to block all of Pre-Training Chainsaw Man's attacks without getting hit\
      \ once] and even managed to land a [https://imgur.com/a/H5WLtoY strike on his\
      \ torso].), High Hypersonic+ with Sword-Draw Dash (By crouching down, Katana\
      \ Man is able to dash forward at incredible speeds, blitzing his opponents.\
      \ Utilizing this technique, [https://imgur.com/a/05jZqJs he is able to pierce\
      \ through Pre-Assault Aki faster than Aki can react], with Power saying [https://imgur.com/a/llZgc79\
      \ she didn't even see him move].)"
    source_ids: *id002
    confidence: 0.8
  lifting_strength:
    text: At most Class 5 in human form ([https://imgur.com/a/PljJjNA Was able to
      lift a bisected Chainsaw Man by his handle], [https://imgur.com/a/chapter-27-otBp7kq
      which a regular person was unable to do], remarking that Chainsaw Man was notably
      heavy.)
    source_ids: *id002
    confidence: 0.8
  striking_strength:
    text: Small Building level in human form, Varies; Multi-City Block level when
      transformed ([https://imgur.com/a/nY99ww2 Stated to be one of the few Weapon
      Hybrids capable of standing on equal footing with Chainsaw Man]. This likely
      refers to the same Chainsaw Man whom Katana Man personally fought; [https://imgur.com/a/kcuFJcZ
      initially overwhelming Denji before his training] and later clashing with him
      again after his training, [https://imgur.com/a/chapter-36-xchMxuT where they
      fought on roughly equal footing].)
    source_ids: *id002
    confidence: 0.8
  durability:
    text: Small Building level in human form ([https://imgur.com/a/JMn6k6g Was able
      to survive being uppercutted by Pre-Training Power], albeit it momentarily stunned
      him, he took it better than Pre-Training Denji being [https://imgchest.com/p/wl7l8vg864x
      knocked out by her]). While being subjected to Aki and Denji's torment, [https://imgur.com/a/cBlFWWq
      he was able to endure being repeatedly kicked in the nuts by them].), Varies;
      At least Multi-City Block level when transformed (Relative to his striking strength),
      Multi-City Block level+ with katanas (Capable of [https://imgur.com/a/chapter-37-9v9pKuZ
      clashing against Post-Training Chainsaw Man's chainsaws])
    source_ids: *id002
    confidence: 0.8
  stamina:
    text: Superhuman (Is able to keep fighting through immense pain and bodily disruptions
      this including; getting pierced by a sword 4 times, locking in after being death
      haxed by the Curse Devil and getting his nuts kicked in by Denji & Aki thanks
      to his physiology, Samurai can theoretically fight indefinitely as long as there's
      blood around.Chainsaw Man Chapter 19)
    source_ids: *id002
    confidence: 0.8
  range:
    text: Standard Melee Range physically, Extended Melee Range with Katanas, Several
      Meters with slashes ([https://imgchest.com/p/dl7pb5we8yo Can throw slashes from
      much farther away])
    source_ids: *id002
    confidence: 0.8
  intelligence:
    text: At least Average generally, Gifted in combat (Was able to compete with Post-Training
      Denji despite of his [https://imgur.com/a/VXaD24w daily special combat training
      with Kishibe], Kishibe being a veteran devil hunter who's skilled enough to
      [https://imgur.com/a/Ll3ucFi briefly keep up] with Quanxi, another hunter that's
      skilled enough to be regarded to be able to [https://imgur.com/a/vzl2Nl8 win
      against anyone else in the world in a pure bare-knuckle fighting].)
    source_ids: *id002
    confidence: 0.8
