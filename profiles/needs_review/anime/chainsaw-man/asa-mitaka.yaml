    - field: weaknesses
      value: 'General Devil weaknesses. Needs to touch an object to turn it into a
        weapon. Yoru is unable to take over Asa''s body when she is stricken with
        fear;Chainsaw Man Chapter 101 this can be circumvented by distracting Asa
        from her fear. Yoru is dumb.Chainsaw Man Chapter 105 Asa operates poorly under
        pressure. Like Makima, Yoru views people not through appearances but through
        scent, leaving her vulnerable to sneak attacks.Chainsaw Man Chapter 97 | No
        longer needs to touch a target to turn it into a weapon. Notable Attacks/Techniques:
        *War: As the Fiend hosting the Devil that embodies war and combat, Asa and
        Yoru have the ability to turn anything that they view as belonging to them
        into a weapon. This ability functions on a wide variety of targets; several
        objects, flesh andChainsaw Man Chapter 110 blood, entire structures, and even
        advanced technology. The War Fiend''s ability is based not on legitimate ownership
        but rather on the Fiend''s "perception of ownership". By setting up arbitrary
        requirements of ownership, such as purchasing an object for a sum of money
        that is nowhere near enough to legally buy it, the War Fiend can gain "ownership"
        of things she typically would be unable to own. WarYoru.gif|Yoru''s first
        on-screen uses of her ability. *Host Transference: The War Fiend is a unique
        specimen among Fiends. Usually, most if not all of the original body''s brain
        is destroyed during the process of a Devil taking over their body.Chainsaw
        Man Chapter 56 Half of the War Fiend''s brain is still intact,Chainsaw Man
        Chapter 99 allowing the original host body, Asa Mitaka, to maintain a certain
        level of control. In combat, this allows both Asa and Yoru to fight at the
        same time, with Asa maintaining control most of the time and then releasing
        Yoru in bursts to follow up on her attacks. WarFiend.gif|Yoru and Asa''s symbiotic
        relationship. ==Gallery== {{Scroll box|content= Volume 12 Back Cover (cleaned).png|Asa
