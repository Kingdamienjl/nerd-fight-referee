- id: claim-weaknesses-a563b8b6
  section: weaknesses
  axis: weakness
  text: 'Possesses all general weaknesses possessed by Fiends / Devils. Easily excitable,
    impulsive and prone to going out of control when faced against a opponent she
    can handle.Chainsaw Man Vol 4 Recap However, tends to be cowardly and pusillanimous
    when faced with opponents she believes to be greatly above her caliber.Chainsaw
    Man Chapter 25 As a fiend, she can only manipulate her very own blood freely;
    controlling someone else''s blood is considered difficult for her and requires
    her to be directly touching the target. Moreover, her regeneration is linked to
    the amount of blood she possesses in her body.Chainsaw Man Chapter 30 Furthermore,
    using too much of her own blood outside of her body will leave her anaemic and
    weak overtime. Able to get seasick.Chainsaw Man Chapter 72 Feats: </div>'
  source_ids: *id003
  decisive: false
  status: unverified
  policy_flags:
