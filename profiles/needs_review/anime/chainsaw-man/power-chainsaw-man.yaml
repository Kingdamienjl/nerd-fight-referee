      to Aki's, which was sturdy enough to help him survive being slashed by Katana
      Man's Sword-Draw Dash.Downscales from 9.14 Tons of TNT)
    source_ids: *id002
    confidence: 0.95
  stamina:
    text: Superhuman (As a fiend / devil, she should possess superior stamina than
      any normal human; being able to survive months on end in the wilderness by herself
      as a fiend and capable of enduring bisection long enough to defeat a bunch of
      zombies before dragging Pochita into a trash container as a devil. As long as
      there's blood around, can theoretically fight indefinitely like other devils
      and fiendsChainsaw Man Chapter 19)
    source_ids: *id002
    confidence: 0.95
  range:
    text: Standard Melee Range physically; Several Meters with Blood Manipulation
      (Was able to command her blood from the apartment block above in order to form
      multiple spears), Up to Tens of Meters with Blood Weapons (Weapons such as her
      blood spears can reach this range)
    source_ids: *id002
    confidence: 0.95
  intelligence:
    text: "Average (In spite of being considered very controlled compared to other\
      \ fiends and her claims of possessing an IQ that reaches quadruple digits,Chainsaw\
      \ Man Chapter 21 she has shown anything but such levels. However, that isn't\
      \ to say that she hasn't shown bouts of intelligence every now and then such\
      \ as exploiting Denji's lust in order to manipulate him to go to the Bat Devil\
      \ under the pretense of recusing her cat and buying a top hat to not only fit\
      \ with her detective attire at the time but also to hide her horns from humans)\
      \ Above Average, possibly Gifted (While initially Power relied on her fiend\
      \ abilities to overwhelm opponents with sheer strength and ferocity. Her later\
      \ training with Kishibe, a seasoned devil hunter who's skilled enough to briefly\
      \ keep up with Quanxi \u2014 another hunter that's skilled enough to be regarded\
      \ to be able to win against anyone else in the world in a pure bare-knuckle\
      \ fightingChainsaw Man Chapter 54 \u2014 has refined and significantly enhanced\
      \ her combat skills. Lessons from this training emphasized to her to always\
      \ keep a cool head while in battle, be perspective if the environment around\
      \ her can be exploited against an opponent and to never trust what a \"hunter\"\
      \ says. Application of the former lesson can be seen by her setting up traps\
      \ with her blood and choosing to play dead in order to avoid Quanxi's attacks.\
      \ While she hasn't displayed much of her battle IQ and skill after training\
      \ due to her limited appearance in combat on-screen, it\u2019s somewhat possible\
      \ to scale her abilities close to Denji's level, as they trained together and\
      \ possibly developed comparable skills) Standard Tactics: Generally her egotistical\
      \ and impulsive nature leads her to recklessly rush down her opponent with whatever\
      \ blood weapons she believes is suitable at the time, whether that be knives\
      \ for enclosed space combat or a giant mallet when striking from above, without\
      \ much thought;Chainsaw Man Chapter 15 enjoying showing off her strength and\
      \ proving her superiority over others. She will generally always attack with\
      \ the intention to kill or at worst mutilate. However, if faced against an opponent\
      \ that has her outmatched, she has no qualms about running away, playing deadChainsaw\
      \ Man Chapter 61 or bargaining with her opponent in the situation. Her approach\
      \ to combat is often swift and decisive, with decisions made and executed without\
      \ hesitation. Possesses the same traits as her fiend counterpart however due\
      \ to her enhanced blood manipulation, she will primarily utilize her opponent's\
      \ blood rather than her own blood by making it burst out of their bodies as\
      \ blood weapons."
    source_ids: *id002
    confidence: 0.95
