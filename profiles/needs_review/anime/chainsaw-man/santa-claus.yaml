        Regeneration, Limited Resurrection & Statistics Amplification (Types 3 and
        Limited 4, Up to Mid, Resuscitation; After his ripcord is pulled, he is able
        to regenerate back into peak condition, being able to regenerate after being
        decapitated, bisected, and even outright killed. When in his Hybrid form,
        his physically capabilities are also greatly increased) *Fear Empowerment
        (The more feared the concept or name a Devil embodies, the more powerful they
        become. This also includes fear of mental ideas relating to a concept, such
        as fearing the idea of getting run over by a car despite not fearing cars
        themselves. Due to Denji being fused with the Chainsaw Devil, the more feared
        chainsaws or the name "Chainsaw Man/Devil" become, the stronger he becomes)
        *Immortality (Type 1; Hybrids do not age, as shown by the Whip Hybrid, who
        still appears young despite being 81) *Indomitable Will (Willing to keep fighting
        despite severe and fatal injuries such as disembowelment, bisection, being
        set on fire, and decapitation, even showing masochistic tendencies upon transforming
        into his Hybrid form) *Multiple Souls (As the Chainsaw Hybrid, he possesses
        the Chainsaw Devil inside him as his heart) *Regeneration & Limited Resurrection
        (Up to Mid, Resuscitation; Hybrids are capable of regenerating from fatal
        injuries and death by drinking blood) *Weapon Mastery (Has decent proficiency
        with his axe) *Resistance to: *Corruption & Transmutation (Type 2; Due to
        being non-human, Devils and Fiends are immune to the effects of the Zombie
        Devil and its zombies, which will turn any human that they bite into a zombie.
