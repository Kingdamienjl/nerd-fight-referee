    - field: intelligence
      value: "Genius (Kiga is a master manipulator who has been pulling the strings\
        \ of every event in the Academy Saga, not unlike her sister Makima's position\
        \ in the Public Safety Saga. She developed multiple plans involving the manipulation\
        \ of multiple people, devils, and pawns, to starve the War Devil and turn\
        \ her into a pawn\u2014 and although this failed due to Chainsaw Man's interference,\
        \ it did not faze her: she adapted to this issue and instead manipulated both\
        \ Asa and Yoru into working for her of their own free will, promising them\
        \ both their true wishes. At the same time, she had her subordinates manipulate\
        \ DenjiChainsaw Man, Chapter 140 in preparation for the breaking of his contract\
        \ with Pochita. Kiga founded and led as the brains of the Chainsaw Man Church,Chainsaw\
        \ Man, Chapter 132 an organization which successfully gathered over 350,000\
        \ members across multiple nations. This sham church was in reality a method\
        \ for the Fire Devil\u2014 incognito as the \"Justice Devil\"\u2014 to gain\
        \ as many contractors as possible who would be transformed into hundreds of\
        \ thousands of Chainsaw Man-like devils, thereby inspiring fear of both Chainsaw\
        \ Man and War, all in order to empower Chainsaw Man and the War Devil so that\
        \ they can be made capable of defeating the Death Devil. She continued to\
        \ personally manipulate AsaChainsaw Man, Chapter 165 while using her underlings\
        \ to manipulate Denji,Chainsaw Man, Chapter 170 finally successfully breaking\
        \ Denji's contract with Pochita just as she had planned, unleashing an empowered\
        \ Hero of Hell upon earthChainsaw Man, Chapter 171) Standard Tactics: Rather\
        \ than engaging directly, Kiga tends to act from the shadows, having her pawns\
        \ do the fighting for her while she schemes."
