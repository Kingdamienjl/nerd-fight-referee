    - field: weaknesses
      value: 'The victims will only display all the knowledge they know, so if someone
        doesn''t know their own weakness Rohan can''t exploit it, Any damage dealt
        to Heaven''s Door will also be dealt to Rohan, If Heaven''s Door is destroyed
        then Rohan will die too, Heaven''s Door''s maximum range is several metres
        and it can not go any further away from Rohan then that, Rohan is unable to
        write commands into himself, If overwhelmed by a large number of opponents,
        Rohan is unable to transform them all into books Notable Attacks/Techniques:
        * Heaven''s Door: Heaven''s Door is a Close-Range Humanoid Stand that Rohan
        is able to summon by drawing in the air with either his pen or his fingers.
        When Rohan first unlocked this ability, Heaven''s Door could only activate
        by having someone read Rohan''s manga, however, after one fight against Josuke,
        Rohan learned how to summon Heaven''s Door''s true form which can activate
        its ability just by touching the opponent. :* Book Transmutation: Once an
        opponent is under the effect of Heaven''s Door, their skin and parts of their
        body such as their limbs will turn into books. On each page of these books
        is the entire history of the opponent with every piece of information that
        they know of. While their body is transformed into a book, either the opponent''s
        ability is reduced heavily to the point that they are only able to slowly
        crawl across the floor or they will be instantly put to sleep and won''t wake
        up until Heaven''s Door is deactivated. Rohan is able to use this ability
        on any human being, corpses, ghosts, Stands, any type of animal, any food,
        any plant life and even himself. While transforming someone into a book is
        usually used in order to set up Heaven''s Door''s other abilities, it has
        used the ability to transform an opponent into a book to its advantage such
        as turning The Hand''s arm into a book so it would break apart before it could
        hit Rohan or to turn someone''s entire body into a book so they would be flat
        enough to be run over by a train and suffer no injuries. ::* Memory Removal:
        Rohan is able to tear out pages, doing so will result in the opponent losing
        all information and memories on those pages will be removed and the opponent''s
        body weight will be decreased significantly with Koichi losing over half of
        his body weight instantly after losing a few pages. If the opponent loses
        enough pages from their body then they will die. Once Rohan is beaten into
        submission, then the ripped out pages will be automatically returned to the
        opponent. ::* Written-In Command: While an opponent is turned into a book,
        Rohan and Heaven''s Door are able to write commands onto the pages of the
        opponent, these commands are something that the opponent is forced to do even
        if it is something that they are normally unable to do. Rohan requires a pen
        to write the commands but Heaven''s Door is able to use its finger. Some examples
        of the commands that Rohan is able to write in an opponent include making
        an opponent travel to a certain location without even realising it, set themself
        on fire if certain conditions are met, removing memories either short term
        or after certain conditions are met such as if they leave his house, removing
        someone''s ability to see and give back someone''s ability to see, prevent
        someone from being able to turn around, make someone fly in a direction at
        70 kilometres per hour, make it impossible for someone to be able to turn
        around, be able to send someone to Hell when they are taken to the afterlife,
        make someone gain the ability to fluently speak a different language that
        they didn''t know before, remove all memories of his existence from an opponent
        and make it impossible for someone to see, amplifying the weight of an opponent
        to the point that they become ten times heavier and make plants absorb C02
        and fly over to someone before releasing the CO2. The command written in a
        person will stay in effect for however long Rohan writes in but if there is
        no time given for the effect then it can be permanent. :::* Safety Lock: One
        of the most powerful commands that Rohan can write into an opponent is his
        Safety Lock, a command where Rohan writes in the command "I cannot attack
        Rohan Kishibe" into the person. This Safety Lock prevents the opponent from
        being able to hit Rohan at all or use any ability that will cause any harm
        to Rohan as well as preventing the opponent from being able to consciously
        seek out any help and prevent them from telling their allies what Rohan''s
        Stand and its abilities are.'
