    - field: intelligence
      value: 'Genius. Is the best Devil Hunter in Japan,Chainsaw Man Chapter 30 and
        has survived decadesChainsaw Man Chapter 61 in a profession where almost everyone
        dies within months to years.Chainsaw Man Chapter 19 Even while exceedingly
        drunk, is able to formulate effective plans on the fly, such as when he came
        up with idea to leverage Denji and Power''s inhuman tolerance for fatal injury
        to train them up to a proficient level (enough to land hits {albeit glancing
        ones} on him) in a rapid amount of time.Chainsaw Man Chapter 30 This plan
        was effective to the extent that it allowed Denji to handily defeat Katana
        Man in one-on-one combat in their rematch, though Katana Man had quite easily
        defeated him in their initial fight just a couple weeks prior.Chainsaw Man
        Chapter 37Chainsaw Man Chapter 26 Organized the counter-attack against Makima
        and her expanding control over Japan,Chainsaw Man Chapter 61Chainsaw Man Chapter
        75 orchestrating a multi-stage plan that would have successfully banished
        her to Hell had Pochita not unexpectedly intervened and been sent to Hell
        in her stead.Chainsaw Man Chapter 83Chainsaw Man Chapter 83Chainsaw Man Chapter
        84 It''s especially notable that he managed to formulate this plan and execute
        it as Makima has the ability to borrow the senses of lower forms of life such
        as rats and birds, allowing her to effortlessly eavesdrop on anyone and anything
        of interest and have near-flawless abilities of reconnaissance and spying.Chainsaw
        Man Chapter 67 Standard Tactics: Kishibe rarely goes into a fight without
        adequate preparation. Knowing of Power''s ability to create weapons from blood,
        he evened the playing field by coming into the fight with several of his own,
        and also took advantage of Denji and Power''s inexperience and overconfidence
        to easily blindside them and effortlessly take them down countless times for
        hours on end.Chainsaw Man Chapter 30 During the International Assassins Arc,
        he was able to take advantage of gaps in Makima''s surveillance, communicating
        in writing with Quanxi at times when Makima could use the senses of lower
        lifeforms to hear them, but didn''t have eyes on them.Chainsaw Man Chapter
        61 Through unknown means, he also obtained a thorough knowledge of Makima''s
        abilities and even her true identity widely remaining entirely secretive until
        late into Part 1 of the series,Chainsaw Man Chapter 61 with it being known
        only to those with access to extensive espionage networks, such as the President
        of the United States.Chainsaw Man Chapter 75 In summary, Kishibe makes a point
        of finding out actionable knowledge about his opponent(s), and uses this knowledge
        to formulate a plan of attack that can effectively counter them, be it by
        matching their abilities, or finding weaknesses and loopholes within them.'
